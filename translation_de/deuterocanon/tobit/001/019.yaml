  yaml_path: translation/deuterocanon/tobit/001/019.yaml
  text: But one of the men in Nineveh went and informed the king about me[a], that I was burying them; and I hid myself. Then, realizing that I was being sought to be put to death[b], I withdrew in fear.
translation:
  language: de
  text: Doch einer von denen, die in Ninive lebten, ging hin und meldete dem König, dass ich sie bestattete[a]. Da verbarg ich mich. Als ich erkannte, dass man mich suchte, um mich zu töten[b], zog ich mich aus Angst zurück.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „einer von denen in Ninive“.'
    reason: Die griechische Wendung ist elliptisch und bestimmt die betreffende Person weder nach Geschlecht noch nach sozialer Zugehörigkeit näher.
  - marker: b
    text: 'Wörtlich etwa: „dass ich gesucht wurde, um zu sterben“. Die knappe passive griechische Wendung meint im Zusammenhang, dass man mich zur Tötung suchte.'
    reason: Die Fußnote bewahrt die passive und verdichtete Form des Griechischen, ohne den missverständlichen Eindruck zu erwecken, Tobit habe selbst sterben wollen.
lexical_decisions:
- source_word: πορευθεὶς
  choice: ging hin
  rationale: Das Aoristpartizip bezeichnet hier eine der Meldung vorausgehende Bewegung; „ging hin und berichtete“ gibt die Abfolge im Deutschen natürlich wieder.
- source_word: εἷς τῶν ἐν Νινευὴ
  choice: einer von denen in Ninive
  rationale: Die elliptische griechische Formulierung wird bewusst ohne die ergänzende Festlegung auf „Männer“ oder „Einwohner“ wiedergegeben.
- source_word: ὑπέδειξε
  choice: berichtete
  rationale: Im Zusammenhang bezeichnet das Verb die Mitteilung an den König. „Berichtete“ ist verständlich und vermeidet die stärkere, im Verb nicht zwingend enthaltene Wertung „zeigte an“.
- source_word: περὶ ἐμοῦ
  choice: über mich
  rationale: Dies entspricht der gewöhnlichen Bedeutung der Präposition und passt zur Meldung über Tobits Handeln.
- source_word: ὅτι θάπτω αὐτούς
  choice: dass ich sie begrub
  rationale: Der griechische Präsensgebrauch in der indirekten Rede kann fortgesetztes oder wiederholtes Handeln bezeichnen; im deutschen Erzählzusammenhang ist das Präteritum natürlich, ohne eine einmalige Bestattung festzulegen.
- source_word: ἐκρύβην
  choice: Da verbarg ich mich
  rationale: Die passive beziehungsweise medial-intransitive Form hat hier reflexiven Sinn. Ein eigener kurzer Satz bildet den Handlungsfortgang klar ab.
- source_word: ἐπιγνοὺς
  choice: Als ich erkannte
  rationale: Das Partizip bezeichnet das Gewahrwerden der bereits bestehenden tödlichen Bedrohung.
- source_word: ζητοῦμαι ἀποθανεῖν
  choice: dass man nach mir suchte, um mich zu töten
  rationale: Die komprimierte passive Wendung wird in natürliches Deutsch übertragen. Die unpersönliche Form mit „man“ lässt die handelnden Verfolger unbestimmt und bewahrt den Zweck der Suche.
- source_word: φοβηθεὶς
  choice: aus Angst
  rationale: Das Partizip kann begleitend oder kausal verstanden werden; „aus Angst“ gibt im Zusammenhang den Beweggrund knapp und natürlich wieder.
- source_word: ἀνεχώρησα
  choice: zog ich mich … zurück
  rationale: „Sich zurückziehen“ bewahrt die Grundbedeutung des Verbs und steigert die Aussage nicht unnötig zu „fliehen“.
theological_decisions:
- issue: Darstellung von Tobits Reaktion auf die Verfolgung
  choice: „zog ich mich aus Angst zurück“
  alternative: „floh ich aus Angst“
  rationale: Der Text stellt Tobits Rückzug angesichts drohender Tötung dar. ἀνεχώρησα verlangt jedoch nicht die dramatischere Wiedergabe „floh“; die gewählte Form wahrt sowohl seine Angst als auch die Zurückhaltung des griechischen Ausdrucks.
- issue: Identität der Person, die Tobit meldete
  choice: „einer von denen in Ninive“
  alternative: „einer der Männer in Ninive“
  rationale: Der griechische Text nennt weder Geschlecht noch gesellschaftliche Zugehörigkeit ausdrücklich. Die Übersetzung bewahrt diese Offenheit, statt eine nicht notwendige Festlegung einzuführen.
