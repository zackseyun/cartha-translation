  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Kurze Hauptsätze erhalten den zügigen Handlungsablauf; unnötig altertümliche oder konfessionell geprägte Ausdrücke werden vermieden.
