base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/001/021.yaml
  text: And before fifty days had passed[a], his two sons killed him and fled to the mountains of Ararat. And Sacherdonos his son reigned in his place, and he appointed Achiacharos, the son of Anael, my brother's son[b], over all the accounts of his kingdom and over the whole administration.
translation:
  language: de
  text: Noch ehe fünfzig Tage vergangen waren, töteten ihn seine beiden Söhne und flohen in das Gebirge Ararat. Sein Sohn Sacherdonos[a] wurde an seiner Stelle König. Er setzte Achiacharos[b], den Sohn Anaëls, des Sohnes meines Bruders, über das gesamte Rechnungswesen seines Königreichs und über die ganze Verwaltung ein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sacherdonos ist die griechische Form des assyrischen Königsnamens, der im Deutschen gewöhnlich als Asarhaddon wiedergegeben wird.
    reason: lexical_alternative
  - marker: b
    text: Achiacharos ist die griechische Form des Namens, der häufig als Ahikar wiedergegeben wird.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ διῆλθον ἡμέραι πεντήκοντα ἕως οὗ
  choice: Noch ehe fünfzig Tage vergangen waren
  rationale: Gibt die griechische Zeitwendung idiomatisch wieder und bewahrt die Betonung des kurzen Zeitraums.
- source_word: ἀπέκτειναν
  choice: töteten
  rationale: Direkte, wertungsneutrale Wiedergabe; „ermordeten“ würde die rechtlich-moralische Einordnung stärker festlegen als der griechische Ausdruck.
- source_word: ἔφυγον εἰς τὰ ὄρη Ἀραράθ
  choice: flohen in das Gebirge Ararat
  rationale: „Flohen“ bewahrt den Fluchtcharakter; der griechische Plural wird mit der im Deutschen geläufigen geografischen Bezeichnung „Gebirge Ararat“ natürlich wiedergegeben.
- source_word: ἐβασίλευσεν ... ἀντʼ αὐτοῦ
  choice: wurde an seiner Stelle König
  rationale: Drückt Thronbesteigung und Nachfolge in natürlichem modernem Deutsch aus.
- source_word: ἔταξεν
  choice: setzte ... ein
  rationale: Passt zum formellen Einsetzen in eine leitende Verwaltungsfunktion.
- source_word: ἐπὶ πᾶσαν τὴν ἐκλογιστείαν
  choice: über das gesamte Rechnungswesen
  rationale: Bezeichnet die Zuständigkeit für Abrechnung und Finanzführung, ohne den Ausdruck unnötig auf die Schatzkammer einzuengen.
- source_word: διοίκησιν
  choice: Verwaltung
  rationale: Gibt die umfassendere administrative Leitung klar und knapp wieder.
- source_word: Σαχερδονός / Ἀχιάχαρον / Ἀναήλ
  choice: Sacherdonos / Achiacharos / Anaël
  rationale: Die Namen werden entsprechend der griechischen Textgestalt transliteriert und nicht stillschweigend an bekanntere historische Namensformen angeglichen.
- source_word: τὸν Ἀναὴλ υἱὸν τοῦ ἀδελφοῦ μου
  choice: den Sohn Anaëls, des Sohnes meines Bruders
  rationale: 'Bewahrt die Abfolge der genealogischen Appositionen: Achiacharos ist Anaëls Sohn; Anaël ist der Sohn des Bruders des Erzählers.'
theological_decisions:
- issue: Namensformen aus anderen biblischen und historischen Überlieferungen
  choice: Griechische Namensformen im Haupttext
  alternative: Geläufige historische Formen wie Asarhaddon und Ahikar
  rationale: Die Übersetzung folgt dem vorliegenden griechischen Zeugen. Bekanntere Namensformen werden in Fußnoten genannt, ohne die Textgestalt zu harmonisieren.
- issue: Genealogische Zuordnung von υἱὸν τοῦ ἀδελφοῦ μου
  choice: Anaël ist der Sohn des Bruders des Erzählers
  alternative: Anaël ist selbst der Bruder des Erzählers
  rationale: Kasus und Appositionsfolge sprechen dafür, υἱὸν auf Anaël zu beziehen. Die Formulierung bildet diese Beziehung ausdrücklich ab.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Satzfolge wurde leicht gegliedert, um die lange griechische Parataxe lesbar zu machen. Sämtliche Fußnotenmarker stehen unmittelbar bei den erläuterten Namen.
