  text: Ich aber hütete mich davor, zu essen[a][b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Ich aber bewachte meine Seele, nicht zu essen.« »Meine Seele« bezeichnet hier idiomatisch die eigene Person.'
