lexical_decisions:
- source_word: ἐγὼ δὲ
  choice: Ich aber
  rationale: δέ kennzeichnet hier einen leichten Gegensatz; Tobit stellt sein eigenes Verhalten dem Verhalten anderer gegenüber.
- source_word: συνετήρησα
  choice: hütete mich
  rationale: Das Verb bezeichnet sorgfältiges Bewahren oder Bewachen. Zusammen mit »meine Seele« und dem negierten Infinitiv drückt es wachsame Selbstdisziplin aus; »hütete mich« gibt dies im Deutschen natürlich wieder.
- source_word: τὴν ψυχήν μου
  choice: mich
  rationale: Wörtlich steht »meine Seele«, doch die Wendung bezieht sich idiomatisch auf die eigene Person. Die reflexive Wiedergabe vermeidet eine nicht beabsichtigte leib-seelische Aussage.
- source_word: μὴ φαγεῖν
  choice: davor zu essen
  rationale: Der negierte Infinitiv benennt das Verhalten, vor dem Tobit sich bewahrte. Mit »sich davor hüten« entsteht eine natürliche deutsche Konstruktion, ohne den knappen griechischen Wortlaut inhaltlich zu ergänzen.
theological_decisions:
- issue: Anthropologische Bedeutung von ψυχή in τὴν ψυχήν μου
  choice: 'idiomatisch-reflexiv: »mich«'
  alternative: 'wörtlich: »meine Seele«'
  rationale: Im Zusammenhang geht es um Tobits Selbstdisziplin beim Essen, nicht um eine Lehre über die Seele als vom Körper unterschiedenen Bestandteil. Die idiomatische Wiedergabe wahrt den Sinn, während die Fußnote die wörtliche Form sichtbar macht.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch in würdigem Erzählton. Die Formulierung bleibt bewusst knapp und übernimmt durch das abschließende Komma den Anschlusscharakter des griechischen Fragments.
