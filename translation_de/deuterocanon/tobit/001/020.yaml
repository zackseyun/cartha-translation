  text: And all my possessions were plundered[a], and nothing was left to me except Anna my wife and Tobit my son.
translation:
  language: de
  text: Alles, was ich besaß, wurde geraubt, und nichts blieb mir außer meiner Frau Anna und meinem Sohn Tobit.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Aussage beschreibt, wer Tobit nach dem Raub seines Besitzes noch blieb; sie stellt seine Frau und seinen Sohn nicht als Besitz dar.
    reason: lexical_alternative
lexical_decisions:
- source_word: διηρπάγη
  choice: wurde geraubt
  rationale: Das Passiv bezeichnet die gewaltsame Wegnahme durch andere. „Wurde geraubt“ gibt dies im Deutschen natürlich wieder; „wurde geplündert“ würde eher einen Ort oder Bestand als das Weggenommene bezeichnen.
- source_word: πάντα τὰ ὑπάρχοντά μου
  choice: alles, was ich besaß
  rationale: Die Wendung bezeichnet die Gesamtheit von Tobits materiellem Besitz. Die verbale Formulierung ist idiomatischer als „alle meine Besitztümer“ und bewahrt die durch πάντα ausgedrückte Vollständigkeit.
- source_word: οὐ κατελείφθη μοι οὐδέν
  choice: nichts blieb mir
  rationale: Die knappe deutsche Form gibt das unpersönliche Passiv und die nachdrückliche Verneinung natürlich und genau wieder.
- source_word: πλὴν
  choice: außer
  rationale: „Außer“ kennzeichnet Frau und Sohn als die Einzigen, die Tobit nach dem Verlust noch blieben.
- source_word: Ἄννας
  choice: Anna
  rationale: Die griechische Namensform Ἄννα wird in der im Deutschen üblichen Form „Anna“ wiedergegeben.
- source_word: Τωβεὶτ
  choice: Tobit
  rationale: „Tobit“ entspricht der griechischen Namensform Τωβεὶτ und dem deutschen Buchtitel; „Tobias“ wäre eine andere traditionelle Namensform.
