base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/001/009.yaml
  text: And when I became a man[a], I took Anna as my wife from the seed of our ancestral family[b], and by her I fathered Tobiah.
translation:
  language: de
  text: Als ich ein Mann geworden war, nahm ich Anna aus der Nachkommenschaft unserer Sippe väterlicherseits[a] zur Frau, und mit ihr zeugte ich Tobias[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „aus dem Samen unserer Sippe“; gemeint ist die gemeinsame Abstammungslinie väterlicherseits.'
    reason: lexical_alternative
  - marker: b
    text: Der Name wird auch „Tobija“ wiedergegeben.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγενόμην ἀνήρ
  choice: als ich ein Mann geworden war
  rationale: Die Formulierung bewahrt das ausdrücklich männliche Lebensstadium des Griechischen und bezeichnet hier das Erreichen des Mannesalters.
- source_word: ἔλαβον Ἄνναν γυναῖκα
  choice: nahm ich Anna … zur Frau
  rationale: Die geläufige deutsche Eheformel gibt die griechische Wendung eng und zugleich würdevoll wieder.
- source_word: ἐκ τοῦ σπέρματος τῆς πατριᾶς ἡμῶν
  choice: aus der Nachkommenschaft unserer Sippe
  rationale: „Nachkommenschaft“ erfasst die übertragene Bedeutung von σπέρμα, während „Sippe“ den durch gemeinsame Abstammung bestimmten Familienverband πατριά wiedergibt, ohne eine engere rechtliche Bedeutung einzutragen.
- source_word: ἐγέννησα ἐξ αὐτῆς
  choice: mit ihr zeugte ich
  rationale: Das männliche Subjekt und die ausdrückliche Bezugnahme auf Anna bleiben erhalten; „zeugte“ ist im biografisch-biblischen Register präzise und verständlich.
- source_word: Τωβίαν
  choice: Tobias
  rationale: „Tobias“ ist die im Deutschen etablierte Wiedergabe der griechischen Namensform; „Tobija“ ist als stärker semitisch geprägte Form möglich.
theological_decisions:
- issue: Geschlechtsspezifische Bezeichnung des Lebensstadiums
  choice: ein Mann geworden war
  alternative: erwachsen geworden war
  rationale: ἀνήρ bezeichnet hier ausdrücklich das Mannesalter. Eine geschlechtsneutrale Wiedergabe wäre zwar idiomatisch, würde aber eine Nuance des Ausgangstextes entfernen.
- issue: Heirat innerhalb der eigenen Abstammungsgruppe
  choice: aus der Nachkommenschaft unserer Sippe
  alternative: aus unserer Sippe
  rationale: Die doppelte Abstammungssprache des Griechischen bleibt erkennbar, ohne daraus eine über den Vers hinausgehende rechtliche oder theologische Vorschrift abzuleiten.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdevoll-biblischem Ton. Die Satzstruktur folgt dem griechischen Erzählfluss, vermeidet jedoch unnatürliche Gräzismen.
