  source_fidelity: 'Der Entwurf gibt die Satzfolge und die wesentlichen Aussagen des Griechischen zuverlässig wieder: Erreichen des Mannesalters, Heirat Annas, ihre Zugehörigkeit zur Abstammungsgruppe und die Zeugung des Tobias. Die deutsche Wiedergabe von πατριά als „Sippe“ ist grundsätzlich angemessen. Allerdings bleibt die in πατριά enthaltene väterliche/patrilineare Ausrichtung in „unserer Sippe“ unmarkiert; auch die Fußnote lässt sie aus.'
  naturalness: Der Text ist flüssiges modernes Standarddeutsch mit einem passenden leicht bibelnahen Register. „Als ich ein Mann geworden war“ und „nahm ich Anna … zur Frau“ sind klar und idiomatisch. „Aus der Nachkommenschaft unserer Sippe“ ist verständlich; die Ergänzung „väterlicherseits“ stellt die Quellennuance ohne schwerfällige Formulierung dar.
