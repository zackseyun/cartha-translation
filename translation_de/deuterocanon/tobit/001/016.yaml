translation:
  language: de
  text: Und zur Zeit Enemessars erwies ich meinen Brüdern viele Wohltaten[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Almosen“ oder „wohltätige Taten“. Das griechische Wort bezeichnet häufig konkrete Werke der Barmherzigkeit, besonders Gaben an Bedürftige.'
