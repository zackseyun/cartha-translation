lexical_decisions:
- source_word: ἐν ταῖς ἡμέραις
  choice: in den Tagen
  rationale: Die geläufige zeitliche Wendung bewahrt die Form des Griechischen und klingt im Deutschen würdig und verständlich.
- source_word: Ἐνεμεσσάρου
  choice: Enemessars
  rationale: Der Personenname wird aus der griechischen Genitivform als Enemessar erschlossen und im Deutschen regelmäßig flektiert.
- source_word: ἐλεημοσύνας
  choice: Werke der Barmherzigkeit
  rationale: Die Wiedergabe umfasst konkrete barmherzige Taten, besonders Gaben an Bedürftige, ohne den Ausdruck vorschnell auf Geldspenden zu verengen.
- source_word: πολλὰς
  choice: viele
  rationale: Das Adjektiv stimmt mit dem pluralischen ἐλεημοσύνας überein und wird direkt wiedergegeben.
- source_word: ἐποίουν
  choice: tat ich
  rationale: Das Imperfekt bezeichnet Tobits wiederholtes beziehungsweise fortdauerndes Handeln in jener Zeit; im Deutschen ist das Präteritum hier natürlich, während der Kontext den Verlauf trägt.
- source_word: τοῖς ἀδελφοῖς μου
  choice: für meine Brüder
  rationale: „Brüder“ bewahrt die wörtliche Verwandtschaftsbezeichnung und ihre mögliche weitere Bedeutung als Volks- oder Glaubensgenossen; „für“ gibt den begünstigenden Dativ natürlich wieder.
theological_decisions:
- issue: Bedeutungsumfang von ἀδελφοῖς μου
  choice: meine Brüder
  alternative: meine Verwandten / meine israelitischen Volksgenossen
  rationale: Der Haupttext bewahrt die wörtliche, theologisch und sozial offene Bezeichnung. Eine Beschränkung auf leibliche Brüder oder eine eindeutige Ausweitung auf alle Israeliten wäre durch diesen Satz allein nicht gesichert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Werke der Barmherzigkeit“ ist verständlich und quellennah; die Fußnoten erhalten die konkrete Bedeutung „Almosen“ sowie die Mehrdeutigkeit von „Brüder“.
