  text: And if Sennacherib the king killed any when he came fleeing from Judea[a], I buried them secretly; for in his anger he killed many, and the bodies were sought by the king, but they were not found.
translation:
  language: de
  text: Und wenn König Sanherib jemanden tötete, als er auf der Flucht aus Judäa kam,[a] begrub ich die Toten heimlich. Denn in seinem Zorn tötete er viele. Die Leichen wurden vom König gesucht, doch sie wurden nicht gefunden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der griechische Text bei Swete hat hier „König Achreil“ (Ἀχρειλ ὁ βασιλεύς); im Zusammenhang ist damit Sanherib gemeint.
    reason: textual_variant
lexical_decisions:
- source_word: καὶ εἴ τινα
  choice: Und wenn … jemanden
  rationale: Die konditionale Wendung bezeichnet einen wiederkehrenden Fall. „Jemanden“ entspricht dem indefiniten Singular; die anschließende Mehrzahl wird im Deutschen durch „die Getöteten“ verständlich aufgenommen.
- source_word: ἀπέκτεινεν
  choice: töten ließ / tötete
  rationale: Beim ersten Vorkommen macht „töten ließ“ die königliche Verantwortlichkeit natürlich deutlich, ohne eine eigenhändige Tötung vorauszusetzen; beim zweiten bleibt das knappe „tötete“ nahe am griechischen Wortlaut.
- source_word: Ἀχρειλ ὁ βασιλεύς
  choice: König Sanherib
  rationale: Der Erzählzusammenhang weist auf Sanherib. Die abweichende Namensform des griechischen Textes wird zur Wahrung der Quellenoffenheit in einer Fußnote angegeben.
- source_word: ὅτε ἦλθεν φεύγων ἐκ τῆς Ἰουδαίας
  choice: als er auf der Flucht aus Judäa zurückkam
  rationale: Die Formulierung gibt sowohl die Bewegung als auch das fluchtartige Kommen wieder. „Zurückkam“ ist im Kontext natürlich, ohne das Fluchtmotiv zu glätten.
- source_word: ἔθαψα αὐτοὺς κλέπτων
  choice: begrub ich die Getöteten heimlich
  rationale: κλέπτων bezeichnet hier ein verborgenes, heimliches Handeln, nicht Diebstahl. „Die Getöteten“ löst den Wechsel vom indefiniten Singular zum pluralischen Pronomen verständlich auf.
- source_word: ἐν τῷ θυμῷ αὐτοῦ
  choice: in seinem Zorn
  rationale: „Zorn“ bewahrt die Stärke von θυμός in würdigem, geläufigem Deutsch, ohne unnötig zu übersteigern.
- source_word: ἐξητήθη ὑπὸ τοῦ βασιλέως τὰ σώματα
  choice: Der König ließ nach den Leichen suchen
  rationale: Die aktive deutsche Konstruktion gibt das griechische Passiv und die königliche Veranlassung idiomatisch wieder. „Leichen“ ist im Kontext eindeutiger als „Körper“.
- source_word: οὐχ εὑρέθη
  choice: sie wurden nicht gefunden
  rationale: Das griechische Verb steht wegen des neutralen Plurals im Singular; im Deutschen verlangt das pluralische Bezugswort den Plural.
theological_decisions:
- issue: Namensform des assyrischen Königs
  choice: Sanherib im Haupttext, Ἀχρειλ/Achreil in der Fußnote
  alternative: König Achreil im Haupttext
  rationale: Dies ist eine textkritische und historische, keine dogmatische Entscheidung. Der Kontext identifiziert den König als Sanherib; zugleich wird die tatsächlich bezeugte griechische Namensform transparent dokumentiert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Kurze Satzglieder erhöhen die Verständlichkeit. Der markierte Quellenunterschied beim Königsnamen bleibt sichtbar; die schwerfällige wörtliche Wiedergabe von κλέπτων wird idiomatisch als „heimlich“ ausgedrückt.
