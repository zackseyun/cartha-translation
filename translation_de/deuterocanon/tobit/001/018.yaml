  to: Und wenn König Sanherib jemanden tötete, als er auf der Flucht aus Judäa kam,[a] begrub ich die Toten heimlich. Denn in seinem Zorn tötete er viele. Die Leichen wurden vom König gesucht, doch sie wurden nicht gefunden.
