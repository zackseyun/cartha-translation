  naturalness: Der Text ist insgesamt modernes, klares Standarddeutsch. „Als er auf der Flucht aus Judäa kam“ bewahrt die gedrängte griechische Ausdrucksweise ohne den zusätzlichen Sinn von „zurück“. Die passive Wiedergabe der Suche nach den Leichen ist zugleich idiomatisch und quellennah.
