base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/001/010.yaml
  text: And when we were taken captive to Nineveh[a], all my brothers and those of my kindred ate from the bread of the Gentiles;
translation:
  language: de
  text: Als wir nach Ninive verschleppt wurden, aßen alle meine Brüder und alle aus meiner Verwandtschaft vom Brot der Heiden[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „von den Broten der Heiden“; „Brote“ kann hier allgemein deren Nahrung oder Verpflegung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾐχμαλωτίσθημεν
  choice: wir … verschleppt wurden
  rationale: Das griechische Passiv bezeichnet die gewaltsame Wegführung in die Gefangenschaft. „Verschleppt“ ist im heutigen Deutsch klar und bewahrt diesen Zwang besser als das allgemeinere „ins Exil geführt“.
- source_word: εἰς Νινευή
  choice: nach Ninive
  rationale: εἰς bezeichnet bei einer Bewegung das Ziel; für eine Stadt ist „nach Ninive“ die natürliche deutsche Formulierung.
- source_word: πάντες οἱ ἀδελφοί μου
  choice: alle meine Brüder
  rationale: Die Wiedergabe folgt der maskulinen Form ἀδελφοί und lässt den familiären beziehungsweise gemeinschaftlichen Bezug offen.
- source_word: οἱ ἐκ τοῦ γένους
  choice: die Angehörigen meines Geschlechts
  rationale: γένος bezeichnet hier Abstammung, Sippe oder Verwandtschaft. „Angehörige meines Geschlechts“ bewahrt den Bezug zur gemeinsamen Herkunft, ohne moderne Vorstellungen von „Rasse“ einzutragen.
- source_word: ἤσθιον
  choice: aßen
  rationale: Der Imperfekt kann wiederholtes oder übliches Handeln ausdrücken; das deutsche Präteritum ist im Erzählzusammenhang natürlich und schließt diesen Sinn nicht aus.
- source_word: ἐκ τῶν ἄρτων τῶν ἐθνῶν
  choice: vom Brot der Heiden
  rationale: ἄρτοι bedeutet wörtlich „Brote“, kann hier aber als Bezeichnung für Nahrung beziehungsweise Verpflegung dienen. „Brot“ erhält das konkrete Bild; „Heiden“ gibt im jüdischen Erzählkontext den Gegensatz zu den nichtisraelitischen Völkern wieder.
theological_decisions:
- issue: Ethnisch-religiöse Bedeutung von ἐθνῶν
  choice: Heiden
  alternative: Völker; Nichtjuden
  rationale: Im Kontext des jüdischen Lebens in der Verbannung bezeichnet der Ausdruck Nichtisraeliten und trägt wahrscheinlich auch religiöse Speiseimplikationen. „Heiden“ wahrt diesen Gegensatz, ohne ihn auf eine bloß politische Nationenzugehörigkeit zu verengen.
- issue: Ob die Speisen ausdrücklich als unrein bezeichnet werden sollen
  choice: Keine Ergänzung von „unrein“
  alternative: von den unreinen Speisen der Heiden
  rationale: Der griechische Satz nennt die Nahrung nicht ausdrücklich unrein. Diese naheliegende Folgerung soll nicht als zusätzliche Aussage in den Haupttext aufgenommen werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Verschleppt“ bringt die erzwungene Gefangennahme prägnant zum Ausdruck; die etwas formellere Wendung „Angehörige meines Geschlechts“ erhält den Abstammungsbezug von γένος.
