base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/001/003.yaml
  text: I[a], Tobit, walked in the ways of truth and righteousness all the days of my life[b], and I did many acts of mercy for my brothers and for my people who went with me into the land of the Assyrians, to Nineveh.
translation:
  language: de
  text: Ich, Tobit, ging alle Tage meines Lebens auf Wegen der Wahrheit und in Gerechtigkeit. Meinen Brüdern[a] und meinem Volk, die mit mir ins Land der Assyrer, nach Ninive, gezogen waren, erwies ich vielfach Barmherzigkeit.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit „Brüdern“ sind hier wahrscheinlich Tobits israelitische Verwandte oder Volksgenossen im weiteren Sinn gemeint, nicht nur leibliche Brüder.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „gab ich viele Almosen“. Der griechische Ausdruck kann besonders das Almosengeben bezeichnen, hier aber auch barmherzige Taten im weiteren Sinn umfassen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁδοῖς ἀληθείας ἐπορευόμην
  choice: ging … auf Wegen der Wahrheit
  rationale: Die Formulierung bewahrt das biblische Bild vom Lebenswandel als einem Gehen auf Wegen und gibt den Plural ὁδοῖς wieder, ohne im Deutschen unnatürlich zu klingen.
- source_word: δικαιοσύνῃ
  choice: in Gerechtigkeit
  rationale: „Gerechtigkeit“ umfasst hier die sittliche und religiöse Rechtschaffenheit Tobits. „Rechtschaffenheit“ wäre idiomatischer, würde aber den zentralen Begriff δικαιοσύνη weniger unmittelbar abbilden.
- source_word: ἐλεημοσύνας πολλὰς ἐποίησα
  choice: erwies ich vielfach Barmherzigkeit
  rationale: ἐλεημοσύνη kann konkret Almosengeben bezeichnen, aber auch barmherzige Taten im weiteren Sinn. Die Übersetzung wahrt diese Bedeutungsbreite; die engere Möglichkeit wird in einer Fußnote genannt.
- source_word: τοῖς ἀδελφοῖς μου
  choice: meinen Brüdern
  rationale: Die Übersetzung folgt der maskulinen Pluralform des Griechischen. Im Zusammenhang sind wahrscheinlich Volks- oder Glaubensgenossen beziehungsweise Verwandte gemeint, nicht ausschließlich leibliche Brüder.
- source_word: τῷ ἔθνει
  choice: meinem Volk
  rationale: „Meinem Volk“ gibt den ethnisch-nationalen Sinn von ἔθνος in der Ich-Erzählung natürlich und beziehungsorientiert wieder.
- source_word: τοῖς προπορευθεῖσιν μετʼ ἐμοῦ
  choice: die mit mir … gezogen waren
  rationale: Die Formulierung bezeichnet die gemeinsame Bewegung in die assyrische Verbannung. Das Präfix προ- kann zusätzlich ein Vorausgehen ausdrücken, doch eine starre Wiedergabe wäre im Deutschen missverständlich; diese Nuance bleibt in der Dokumentation festgehalten.
- source_word: εἰς χώραν Ἀσσυρίων εἰς Νινευή
  choice: ins Land der Assyrer, nach Ninive
  rationale: 'Die Wendung bildet beide griechischen Zielangaben ab: das Gebiet der Assyrer und als genaueres Ziel Ninive.'
theological_decisions:
- issue: δικαιοσύνη in Tobits ethischer Selbstaussage
  choice: Gerechtigkeit
  alternative: Rechtschaffenheit
  rationale: „Gerechtigkeit“ bewahrt die theologisch-ethische Weite des griechischen Begriffs und reduziert ihn weder auf Rechtsprechung noch ausschließlich auf persönliche Anständigkeit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzteilung entlastet die lange griechische Periode, ohne ihre inhaltlichen Beziehungen aufzulösen. „Auf Wegen der Wahrheit“ erhält das traditionelle ethische Wegbild; „vielfach Barmherzigkeit erweisen“ ist gehoben, aber allgemein verständlich.
