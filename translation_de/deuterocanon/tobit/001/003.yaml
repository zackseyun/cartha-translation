  source_fidelity: 'Der Entwurf gibt die griechische Aussage vollständig und sachgerecht wieder: das ethische Wegbild (ὁδοῖς ... ἐπορευόμην), Wahrheit und Gerechtigkeit, die vielen Erweise von ἐλεημοσύνη sowie die Adressaten und das Ziel der gemeinsamen Bewegung nach Ninive. „gezogen waren“ ist als deutsche Wiedergabe des aoristischen Partizips προπορευθεῖσιν im Exilkontext vertretbar und behauptet keine über das Griechische hinausgehende Zwangsdeutung.'
  naturalness: Modernes, würdiges Standarddeutsch. Die Satzteilung und die Voranstellung der Empfänger im zweiten Satz sind natürlich und bewahren die inhaltlichen Bezüge. „Auf Wegen der Wahrheit“ und „vielfach Barmherzigkeit erweisen“ sind bewusst leicht gehoben, aber verständlich und für den biblischen Register angemessen.
  terminology: „Gerechtigkeit“ gibt δικαιοσύνη angemessen in ihrer ethisch-religiösen Weite wieder. „Barmherzigkeit“ wahrt bei ἐλεημοσύνη die mögliche Breite über konkrete Almosen hinaus; die Fußnote nennt die spezifischere Lesart. „Brüder“ und „Volk“ sind treffend, und die Erläuterung zu „Brüdern“ ist zurückhaltend formuliert.
