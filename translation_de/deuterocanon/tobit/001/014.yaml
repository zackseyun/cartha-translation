  yaml_path: translation/deuterocanon/tobit/001/014.yaml
  text: I used to go to Media[a], and I deposited ten talents of silver with Gabael, the brother of Gabri[c][b], in Rages of Media.
translation:
  language: de
  text: Ich reiste immer wieder nach Medien[a] und hinterlegte bei Gabaël, dem Bruder des Gabri, in Rages[c] in Medien zehn Talente Silber.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ich reiste nach Medien.“ Der griechische Imperfekt kann eine wiederholte oder gewohnheitsmäßige Handlung bezeichnen, muss aber nicht zwingend so verstanden werden.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „vertraute Gabaël zehn Talente Silber an“. Das griechische Verb kann bedeuten, etwas in die Obhut eines anderen zu geben; hier steht es in einem finanziellen Zusammenhang.'
    reason: lexical_alternative
  - marker: c
    text: Der griechische Ortsname wird auch „Rhages“ geschrieben.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπορευόμην
  choice: Ich reiste immer wieder
  rationale: Der griechische Imperfekt kann eine wiederholte oder gewohnheitsmäßige Handlung in der Vergangenheit ausdrücken. „reiste immer wieder“ gibt diesen Aspekt in natürlichem Deutsch wieder, ohne ihn in der Fußnote als einzig mögliche Deutung festzuschreiben.
- source_word: παρεθέμην
  choice: hinterlegte
  rationale: Das Verb bezeichnet hier, dass Silber einem anderen zur Verwahrung beziehungsweise in einem finanziellen Treuhandverhältnis übergeben wurde. „hinterlegte“ ist knapp und passt zum Sachzusammenhang.
- source_word: ἀργυρίου
  choice: Silber
  rationale: Der griechische Text nennt ausdrücklich Silber. Die Wiedergabe bewahrt die antike Sachangabe, statt sie zu allgemeinem „Geld“ umzudeuten.
- source_word: τάλαντα δέκα
  choice: zehn Talente
  rationale: Das Talent ist eine antike große Gewichts- und Werteinheit. Die traditionelle Bezeichnung vermeidet eine spekulative Umrechnung in moderne Maße oder Währungen.
- source_word: Γαβηλῷ
  choice: Gabaël
  rationale: Die Form folgt einer im Deutschen gut lesbaren Transliteration des griechischen Personennamens; das Trema zeigt, dass die Vokale getrennt gesprochen werden.
- source_word: τῷ ἀδελφῷ Γαβρίᾳ
  choice: dem Bruder des Gabri
  rationale: ἀδελφός wird in seiner gewöhnlichen Bedeutung „Bruder“ wiedergegeben; der folgende Name bezeichnet, wessen Bruder Gabaël ist.
- source_word: ἐν Ῥάγοις τῆς Μηδείας
  choice: in Rages in Medien
  rationale: Die Form bezeichnet die Stadt Rages innerhalb der Landschaft Medien. Das zweite „in“ ist im modernen Deutschen natürlicher als die wörtlichere Konstruktion „Rages von Medien“.
