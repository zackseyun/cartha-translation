base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/001/006.yaml
  text: But I alone would often go to Jerusalem for the feasts[a], as it is written for all Israel in an everlasting ordinance[b], bringing the firstfruits and the tithes of the produce and the first shearings.
translation:
  language: de
  text: Ich allein aber zog häufig zu den Festen nach Jerusalem, wie es für ganz Israel in einer immerwährenden Satzung geschrieben steht, und brachte die Erstlingsgaben, die Zehnten vom Ertrag und die Erstlingsanteile von der Schur[a] mit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das seltene griechische Wort bezeichnet wahrscheinlich die ersten Anteile aus der Schur; möglich ist auch allgemeiner eine erste Abgabe aus der Viehhaltung.
    reason: lexical_alternative
lexical_decisions:
- source_word: μόνος
  choice: ich allein
  rationale: Bewahrt die emphatische Aussage, dass Tobit im Gegensatz zu anderen persönlich treu blieb.
- source_word: ἐπορευόμην πλεονάκις
  choice: zog häufig
  rationale: Der Imperfekt bezeichnet zusammen mit πλεονάκις eine wiederholte Gewohnheit in der Vergangenheit; „zog häufig“ ist natürlich und würdevoll.
- source_word: ἐν Ἱεροσολύμοις ταῖς ἑορταῖς
  choice: zu den Festen nach Jerusalem
  rationale: Obwohl der griechische Text ἐν verwendet, verlangt die Bewegungsrichtung im Deutschen idiomatisch „nach Jerusalem“; ταῖς ἑορταῖς bezeichnet die israelitischen Feste.
- source_word: καθὼς γέγραπται
  choice: wie es ... geschrieben steht
  rationale: Entspricht der üblichen Schrift- und Gesetzesformel und gibt die bleibende Geltung des Perfekts wieder.
- source_word: παντὶ τῷ Ἰσραήλ
  choice: für ganz Israel
  rationale: Gibt den umfassenden Bezug der Vorschrift auf Israel knapp und genau wieder.
- source_word: ἐν προστάγματι αἰωνίῳ
  choice: in einer immerwährenden Satzung
  rationale: „Satzung“ passt zum rechtlich-kultischen Zusammenhang; „immerwährend“ wahrt die Dauerbedeutung von αἰώνιος, ohne sie philosophisch auszuweiten.
- source_word: τὰς ἀπαρχάς
  choice: die Erstlingsgaben
  rationale: Bezeichnet die ersten Erträge, die Gott als kultische Abgabe dargebracht wurden; „Erstlingsgaben“ ist im Deutschen verständlicher als das substantivierte „Erstlinge“.
- source_word: τὰς δεκάτας τῶν γενημάτων
  choice: die Zehnten vom Ertrag
  rationale: „Zehnten“ ist der etablierte Ausdruck für die Abgabe eines Zehntels; „Ertrag“ wahrt die breite Bedeutung landwirtschaftlicher Erzeugnisse.
- source_word: τὰς προκουρίας
  choice: die Erstlingsschur
  rationale: Das seltene Wort bezeichnet wahrscheinlich den ersten Anteil aus der Schur; die knappe Wiedergabe erhält die kultische Listenstruktur und wird wegen der lexikalischen Unsicherheit erläutert.
- source_word: ἔχων
  choice: brachte ... mit
  rationale: Das Partizip beschreibt, dass Tobit die genannten Gaben bei seiner Reise mit sich führte; „brachte ... mit“ ist im Deutschen idiomatisch.
theological_decisions:
- issue: Art von Tobits Gesetzestreue
  choice: Der Vers schildert seine konkrete persönliche Befolgung der auf Jerusalem bezogenen Fest- und Abgabepflichten Israels.
  alternative: Die Aussage könnte lediglich als allgemeiner Ausdruck persönlicher Frömmigkeit verstanden werden.
  rationale: Der ausdrückliche Hinweis auf das für ganz Israel Geschriebene und die genaue Aufzählung der Abgaben sprechen für konkrete Gesetzesbefolgung.
- issue: Bedeutung von αἰώνιος in der Gesetzesformel
  choice: immerwährend
  alternative: dauerhaft; ewig
  rationale: „Immerwährend“ bewahrt die Aussage einer fortdauernden Satzung und vermeidet zugleich eine über den rechtlich-bundestheologischen Zusammenhang hinausgehende Festlegung.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Die Rechtsformel bleibt erkennbar, während Satzbau und Wortwahl natürlich deutsch sind. Der einzige Fußnotenmarker kennzeichnet die echte lexikalische Unsicherheit bei προκουρίας.
