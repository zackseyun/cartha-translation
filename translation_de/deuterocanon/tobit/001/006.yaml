  terminology: „Erstlingsgaben“, „Zehnten“, „Ertrag“ und „immerwährende Satzung“ sind im kultisch-gesetzlichen Kontext treffend. Für προκουρίας sollte die Übersetzung nicht den Schurvorgang selbst, sondern die abzugebenden Anteile bezeichnen.
