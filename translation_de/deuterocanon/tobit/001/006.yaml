  source_fidelity: 'Die Übersetzung gibt die hervorgehobene Ausschließlichkeit (μόνος), die gewohnheitsmäßige wiederholte Handlung des Imperfekts mit πλεονάκις, das Ziel Jerusalem, die Festzeiten sowie die kultisch-rechtliche Aufzählung insgesamt zuverlässig wieder. Die Wiedergabe von προκουρίας als „Erstlingsschur“ ist jedoch semantisch zu eng bzw. missverständlich: Sie kann die erste Schur als Vorgang bezeichnen, während der griechische Ausdruck wahrscheinlich eine davon zu entrichtende Erstlingsgabe bzw. einen Erstanteil meint und im Plural steht.'
