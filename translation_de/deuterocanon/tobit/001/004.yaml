revisions:
- from: Und als ich noch jung war und in meiner Heimat, im Land Israel, lebte, wandte sich der ganze Stamm meines Vorfahren Naftali vom Haus Jerusalems[a] ab. Dieses war aus allen Stämmen Israels dazu erwählt worden, dass alle Stämme dort Opfer darbrachten. Und der Tempel, die Wohnstätte des Höchsten, war geheiligt und für alle Generationen erbaut worden.[b]
  to: Und als ich noch jung war und in meiner Heimat, im Land Israel, lebte, wandte sich der ganze Stamm Naftali, der Stamm meines Vaters, vom Haus Jerusalems[a] ab, das aus allen Stämmen Israels dazu erwählt worden war, damit alle Stämme dort Opfer darbringen konnten; und der Tempel, die Wohnstätte des Höchsten, wurde geheiligt und für alle Generationen erbaut.[b]
  rationale: Die Revision beseitigt die genealogische Überfestlegung bei Naftali, gibt den Zweck des griechischen Infinitivs klarer wieder und vermeidet beim abschließenden Aoristpaar eine unmarkierte Vorzeitigkeit. Die überlieferte Textlücke am Versende bleibt transparent durch Fußnote [b] ausgewiesen.
