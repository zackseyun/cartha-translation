  - severity: low
    issue: „dass alle Stämme dort Opfer darbrachten“
    rationale: εἰς τὸ θυσιάζειν drückt Zweck aus. „Damit alle Stämme dort Opfer darbringen konnten“ gibt diese Zweckbeziehung im Deutschen klarer wieder.
