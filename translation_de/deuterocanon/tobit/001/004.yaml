base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/001/004.yaml
  text: And when I was in my own country[a], in the land of Israel, while I was still young, the whole tribe of my father Naphtali fell away from the house of Jerusalem, which had been chosen from all the tribes of Israel for all the tribes to sacrifice there; and the temple, the dwelling place of the Most High[c][b], was consecrated and built for all generations.
translation:
  language: de
  text: Und als ich noch jung war und in meiner Heimat, im Land Israel, lebte, wandte sich der ganze Stamm Naftali, der Stamm meines Vaters, vom Haus Jerusalems[a] ab, das aus allen Stämmen Israels dazu erwählt worden war, damit alle Stämme dort Opfer darbringen konnten; und der Tempel, die Wohnstätte des Höchsten, wurde geheiligt und für alle Generationen erbaut.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „Haus Jerusalems“. Der griechische Text unterscheidet diese Wendung vom anschließend ausdrücklich genannten „Tempel“; gemeint ist wahrscheinlich das Jerusalemer Heiligtum in weiterem Sinn.
    reason: lexical_alternative
  - marker: b
    text: Der überlieferte griechische Satz endet unvollständig mit „für alle“. Die Übersetzung ergänzt sinngemäß „Generationen“; die längere Texttradition des Tobitbuches stützt einen auf Dauer beziehungsweise Generationen bezogenen Sinn.
    reason: textual_variant
lexical_decisions:
- source_word: χώρα
  choice: Heimat
  rationale: In ἐν τῇ χώρᾳ μου bezeichnet das Wort Tobits eigenes Land; „Heimat“ gibt den persönlichen Bezug natürlich wieder, während „im Land Israel“ die geografische Bestimmung bewahrt.
- source_word: νεωτέρου μου ὄντος
  choice: als ich noch jung war
  rationale: Die Genitivus-absolute-Konstruktion gibt eine Zeitangabe und Tobits damaliges Alter an; die Formulierung ist idiomatisch und genau.
- source_word: ἀπέστη
  choice: wandte sich ... ab
  rationale: Das Verb bezeichnet Abkehr oder Abfall. „wandte sich ab“ erhält den religiösen Ernst, ohne einen späteren theologischen Fachbegriff aufzudrängen.
- source_word: φυλὴ τοῦ Νεφθαλεὶμ τοῦ πατρός μου
  choice: Stamm meines Vorfahren Naftali
  rationale: πατήρ kann in genealogischem Zusammenhang „Vorfahr“ bedeuten. So wird vermieden, Naftali missverständlich als Tobits unmittelbaren Vater darzustellen.
- source_word: οἶκος Ἱεροσολύμων
  choice: Haus Jerusalems
  rationale: Die ungewöhnliche griechische Wendung wird erkennbar bewahrt und nicht vorschnell mit dem später ausdrücklich genannten ναός gleichgesetzt.
- source_word: ἐκλεγείσης
  choice: war ... erwählt worden
  rationale: Bewahrt Passiv und Vorzeitigkeit der Erwählung Jerusalems als Opferstätte.
- source_word: εἰς τὸ θυσιάζειν πάσαις ταῖς φυλαῖς
  choice: dass alle Stämme dort Opfer darbrachten
  rationale: Gibt den Zweck der Erwählung verständlich wieder; „dort“ macht den im Kontext enthaltenen Ortsbezug deutlich.
- source_word: ναός
  choice: Tempel
  rationale: Die übliche und kontextgerechte Wiedergabe, die zugleich vom vorherigen „Haus Jerusalems“ unterscheidbar bleibt.
- source_word: κατασκήνωσις
  choice: Wohnstätte
  rationale: Bewahrt die Vorstellung vom Wohnen des Höchsten, ohne im Tempelkontext durch „Stiftshütte“ eine zu enge technische Deutung einzuführen.
- source_word: ὕψιστος
  choice: der Höchste
  rationale: Eingebürgerte, würdige deutsche Wiedergabe des göttlichen Titels.
- source_word: ἡγιάσθη
  choice: war geheiligt worden
  rationale: Drückt das Aussondern als heilig aus und fügt sich in den rückblickenden Erzählzusammenhang.
- source_word: ᾠκοδομήθη
  choice: war ... erbaut worden
  rationale: Bewahrt die konkrete architektonische Bedeutung des Verbs.
- source_word: εἰς πάσας
  choice: für alle Generationen
  rationale: Der überlieferte griechische Text bricht grammatisch unvollständig mit „für alle“ ab. „Generationen“ stellt den wahrscheinlich vorausgesetzten dauerhaften Bezug her, wird aber durch eine Textfußnote offengelegt.
theological_decisions:
- issue: Abkehr des Stammes Naftali vom Jerusalemer Heiligtum
  choice: wandte sich ... ab
  alternative: fiel ab / wurde abtrünnig
  rationale: Die Übersetzung lässt die kultische und bundestheologische Tragweite erkennen, vermeidet aber eine unnötig technisch-dogmatische Festlegung.
- issue: Jerusalem als erwählter Opferort
  choice: aus allen Stämmen Israels dazu erwählt ..., dass alle Stämme dort Opfer darbrachten
  alternative: unter allen Stämmen Israels zum Opferdienst erwählt
  rationale: Die doppelte Bezugnahme auf alle Stämme wird erhalten und Jerusalems zentrale kultische Stellung weder abgeschwächt noch über den Text hinaus entfaltet.
- issue: Göttliche Gegenwart im Tempel
  choice: die Wohnstätte des Höchsten
  alternative: die Stiftshütte des Höchsten
  rationale: Die Formulierung wahrt die Aussage vom Wohnen Gottes, ohne κατασκήνωσις auf eine bestimmte bauliche Form einzuengen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit gut verständlicher Syntax. Die ungewöhnliche Unterscheidung zwischen „Haus Jerusalems“ und „Tempel“ bleibt samt Erläuterung erhalten. Die textkritisch notwendige Ergänzung am Versende wird nicht im Haupttext markiert geklammert, sondern transparent in Fußnote [b] ausgewiesen.
