base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/001/001.yaml
  text: The book of the words of Tobit son of Tobiel[a], son of Ananiel, son of Aduel, son of Gabael, from the seed of Asiel, from the tribe of Naphtali[b],
translation:
  language: de
  text: Buch der Worte Tobits, des Sohnes Tobiëls, des Sohnes Ananiëls, des Sohnes Aduëls, des Sohnes Bagabaëls[a], aus der Nachkommenschaft Asiëls, aus dem Stamm Naftali,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der griechische Text bietet hier eine schwierige Namensform, die quellennahe als „Bagabaël“ wiedergegeben ist. Andere Textzeugen und Überlieferungen haben Formen wie „Gabaël“ oder „Gabiël“.
    reason: alternative_reading
lexical_decisions:
- source_word: ΒΙΒΛΟΣ λόγων
  choice: Buch der Worte
  rationale: Die formelhafte Überschrift wird bewusst quellennah wiedergegeben. „Worte“ bewahrt den semitisch geprägten Ausdruck, der auch einen Bericht oder eine Lebensgeschichte bezeichnen kann.
- source_word: Τωβείτ
  choice: Tobit
  rationale: Die im Deutschen etablierte biblische Namensform wird verwendet.
- source_word: τοῦ Τωβιὴλ τοῦ Ἀνανιὴλ τοῦ Ἀδουὴλ τοῦ ΒαΓαβαήλ
  choice: des Sohnes Tobiëls, des Sohnes Ananiëls, des Sohnes Aduëls, des Sohnes Gabaëls
  rationale: Die bloßen griechischen Genitive bezeichnen in der Abstammungsreihe die jeweilige Sohnschaft. Ihre ausdrückliche Wiedergabe macht die Beziehung im Deutschen klar; Tremazeichen kennzeichnen die getrennte Aussprache der Vokale.
- source_word: ἐκ τοῦ σπέρματος
  choice: aus der Nachkommenschaft
  rationale: σπέρμα bedeutet wörtlich „Same“, bezeichnet hier aber eine Abstammungslinie. „Nachkommenschaft“ gibt den genealogischen Sinn in natürlichem, würdigem Deutsch wieder.
- source_word: Ἀσιήλ
  choice: Asiël
  rationale: Der Name wird eng nach der griechischen Form transliteriert; das Trema erleichtert die Aussprache.
- source_word: ἐκ τῆς φυλῆς Νεφθαλείμ
  choice: aus dem Stamm Naftali
  rationale: φυλή bezeichnet hier einen israelitischen Stamm. „Naftali“ ist die geläufige deutsche biblische Namensform.
theological_decisions: []
translation_notes:
  register: Formelle, titelartige Eröffnung in modernem Standarddeutsch. Die ungewöhnliche Wendung „Buch der Worte“ bleibt wegen ihrer erkennbaren Quellennähe erhalten; die Abstammungsbeziehungen werden zur Verständlichkeit ausdrücklich mit „Sohn“ wiedergegeben.
