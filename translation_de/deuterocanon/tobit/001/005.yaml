base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/001/005.yaml
  text: and all the tribes that had apostatized were sacrificing to Baal the heifer[a], including the house of my father[b], Naphtali.
translation:
  language: de
  text: Und alle Stämme, die gemeinsam abgefallen waren, opferten dem Baal, der jungen Kuh[a], auch das Haus Naftalis, meines Vaters[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dem Kalb“. Das griechische Wort bezeichnet eine junge Kuh oder Färse. Die Formulierung dürfte auf das Rinderbild des Kultes im Nordreich anspielen; ihre genaue Bedeutung bleibt jedoch offen.'
    reason: lexical_alternative
  - marker: b
    text: 'Der griechische Satzschluss ist stark verkürzt, wörtlich etwa: „und das Haus Naftalis meines Vaters“. Gemeint ist, dass auch Tobits eigene väterliche Herkunftslinie an diesem Kult beteiligt war.'
    reason: alternative_reading
lexical_decisions:
- source_word: πᾶσαι αἱ φυλαί
  choice: alle Stämme
  rationale: φυλαί bezeichnet hier die Stämme Israels; „Stämme“ ist im historischen und nationalen Zusammenhang genauer als „Sippen“.
- source_word: αἱ συναποστᾶσαι
  choice: die gemeinsam abgefallen waren
  rationale: Das zusammengesetzte Partizip bezeichnet eine gemeinsame Abkehr. „Abgefallen“ bewahrt im unmittelbaren Zusammenhang des Götzendienstes den religiösen Sinn, ohne ihn durch einen abstrakten Fachbegriff zu überzeichnen.
- source_word: ἔθυον
  choice: brachten … Opfer dar
  rationale: Die Wendung gibt das kultische Opfern natürlich wieder. Der griechische Imperfekt beschreibt eine fortdauernde oder wiederholte Praxis; im Deutschen ergibt sich diese zeitliche Einordnung aus dem Erzählzusammenhang.
- source_word: τῇ Βάαλ
  choice: Baal
  rationale: Der Dativ nach θύω bezeichnet den Empfänger des Opfers. Beim indeklinablen Eigennamen wird diese Funktion im Deutschen durch die Satzstellung und die Konstruktion „Opfer darbringen“ deutlich.
- source_word: τῇ δαμάλει
  choice: der jungen Kuh
  rationale: δαμάλις bezeichnet eine junge Kuh beziehungsweise Färse. Die feminine Apposition zu Baal wird möglichst unmittelbar bewahrt, ohne die genaue kultische Identifikation aufzulösen.
- source_word: ὁ οἶκος Νεφθαλεὶμ τοῦ πατρός μου
  choice: auch das Haus meines Vaters, Naftali
  rationale: Die gedrängte griechische Schlusswendung bezieht Tobits eigene Herkunftslinie in die Abkehr ein. „Auch“ macht die syntaktisch nur angefügte Einschließung im Deutschen verständlich; die genaue Beziehung von „Naftali“ und „meines Vaters“ bleibt in einer Fußnote erläutert.
theological_decisions:
- issue: Religiöser Gehalt von συναποστᾶσαι
  choice: abgefallen
  alternative: abtrünnig geworden / gemeinsam rebelliert
  rationale: Das anschließende Opfer für Baal zeigt eine religiöse und bundesbezogene Abkehr. „Abgefallen“ trägt diesen Sinn, lässt aber die politische Nebenbedeutung des Wortes grundsätzlich offen.
- issue: Identifikation von τῇ δαμάλει
  choice: Baal, der jungen Kuh
  alternative: Baal, dem Kalb / dem mit einem Rinderbild verbundenen Baal
  rationale: Der griechische Text stellt Βάαλ und δαμάλει unmittelbar nebeneinander. Die direkte Wiedergabe bewahrt diese auffällige Formulierung und legt nicht fest, ob Baal selbst, ein Kultbild oder eine kultische Benennung gemeint ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnliche Bezeichnung „Baal, der jungen Kuh“ bleibt bewusst stehen, weil eine glättende Wiedergabe die Mehrdeutigkeit des griechischen Textes beseitigen würde. „Abgefallen“ ist allgemein verständlich und trägt hier durch den Kontext den religiösen Sinn.
