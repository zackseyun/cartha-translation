base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/006/008.yaml
  text: And he said to him[a], “The heart and the liver—if a demon or an evil spirit troubles anyone, burn these as smoke before a man or a woman, and he or she will no longer be troubled.”
translation:
  language: de
  text: 'Und er sagte zu ihm: „Das Herz und die Leber: Wenn ein Dämon oder ein böser Geist jemanden bedrängt, räuchere diese[a] vor einem Mann oder einer Frau; dann wird er oder sie nicht länger bedrängt werden.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „verbrenne diese“; das griechische Verb bezeichnet hier das Erzeugen von Rauch durch Verbrennen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καρδία
  choice: Herz
  rationale: Gemeint ist wörtlich das Organ des Fisches, da es zusammen mit der Leber genannt wird.
- source_word: ἧπαρ
  choice: Leber
  rationale: Das Wort bezeichnet hier im anatomischen Sinn die Leber des Fisches.
- source_word: ἐάν τινα ὀχλῇ
  choice: wenn … jemanden bedrängt
  rationale: „Bedrängen“ gibt die durch ὀχλέω bezeichnete belastende Einwirkung natürlich wieder, ohne ihre Art über den griechischen Text hinaus festzulegen.
- source_word: δαιμόνιον
  choice: Dämon
  rationale: Die Wiedergabe wahrt die ausdrückliche Unterscheidung vom unmittelbar folgenden „bösen Geist“.
- source_word: πνεῦμα πονηρόν
  choice: böser Geist
  rationale: Dies entspricht der gewöhnlichen Bedeutung der beiden Wörter und erhält den Parallelismus zu „Dämon“.
- source_word: ταῦτα δὲ καπνίσαι
  choice: verbrenne sie …, sodass Rauch entsteht
  rationale: Das Verb bezeichnet hier das Erzeugen von Rauch durch Verbrennen. Die Formulierung macht Handlung und Ergebnis in natürlichem Deutsch deutlich.
- source_word: ἐνώπιον
  choice: in Gegenwart
  rationale: Die Wendung bezeichnet eine Handlung vor beziehungsweise in der Anwesenheit der betroffenen Person.
- source_word: ἀνθρώπου ἢ γυναικός
  choice: eines Mannes oder einer Frau
  rationale: Die ausdrückliche Nennung beider Geschlechter im griechischen Text bleibt erhalten.
- source_word: οὐ μηκέτι ὀχληθῇ
  choice: wird … nicht länger bedrängt werden
  rationale: Die Formulierung bewahrt die starke Verneinung einer weiteren Bedrängnis und nimmt dasselbe Verb wie im vorangehenden Satzteil wieder auf.
theological_decisions:
- issue: Dämonische Bedrängnis und die Verwendung der Organe als Gegenmittel
  choice: Die Anweisung wird als Aussage der Erzählung unmittelbar und ohne Abschwächung wiedergegeben.
  alternative: Die übernatürliche Sprache lediglich symbolisch, medizinisch oder folkloristisch umdeuten.
  rationale: Der griechische Text nennt ausdrücklich einen Dämon oder bösen Geist und beschreibt das raucherzeugende Verbrennen der Organe als Mittel gegen die Bedrängnis. Eine Übersetzung soll diese Textwelt weder leugnen noch dogmatisch erweitern.
- issue: Geschlechtsbezogene Formulierung in ἀνθρώπου ἢ γυναικός
  choice: „eines Mannes oder einer Frau“
  alternative: „eines Menschen“ oder „einer Person“
  rationale: Die Übersetzung erhält die im Ausgangstext ausdrücklich formulierte Unterscheidung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Doppelpunkt nach „Leber“ bildet die elliptische griechische Satzführung lesbar ab. „Er oder sie“ nimmt die ausdrücklich genannten Personen auf und vermeidet eine rein männliche Rückbeziehung.
