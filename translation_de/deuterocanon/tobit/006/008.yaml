  source_fidelity: Der Entwurf gibt die Organe, die Unterscheidung „Dämon oder böser Geist“, die Bedrängnis, die Handlung vor einem Mann oder einer Frau und die starke Aussage über deren Ende grundsätzlich zutreffend wieder. Die infinitivische griechische Anweisung kann im Deutschen idiomatisch als Imperativ wiedergegeben werden. „In Gegenwart“ ist möglich, doch „vor“ entspricht ἐνώπιον unmittelbarer.
  naturalness: 'Der Haupttext ist verständlich, aber „verbrenne sie …, sodass Rauch entsteht“ ist etwas umständlich. „Räuchere diese vor …“ ist im rituellen Kontext knapp und natürlich. Die Fußnote ist in ihrer jetzigen Form nicht präzise: „Lass sie rauchen“ ist keine wörtliche deutsche Wiedergabe der griechischen Infinitivform und steht als angebliche wörtliche Alternative neben einer bereits interpretierenden Hauptformulierung.'
  terminology: „Herz“, „Leber“, „Dämon“, „böser Geist“ und „bedrängt“ sind angemessen. Die ausdrückliche Formulierung „Mann oder Frau“ soll erhalten bleiben; die Rückaufnahme „er oder sie“ wahrt dies im Deutschen.
