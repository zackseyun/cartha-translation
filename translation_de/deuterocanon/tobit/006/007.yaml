  text: And the young man said to the angel[a], “Azariah, brother, what are the liver and the heart and the gall of the fish for?”
translation:
  language: de
  text: 'Und der junge Mann sagte zum Engel: »Asarja, Bruder, wozu dienen die Leber, das Herz und die Galle[a] des Fisches?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Gallensaft«. Das griechische Wort χολή kann »Galle« oder »Gallensaft« bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ παιδάριον
  choice: der junge Mann
  rationale: παιδάριον kann ein Kind, einen Jungen oder jungen Diener bezeichnen. Im Erzählzusammenhang ist Tobias alt genug, selbstständig zu reisen und zu handeln; »der junge Mann« wahrt seine Jugend, ohne ihn als kleines Kind erscheinen zu lassen.
- source_word: τῷ ἀγγέλῳ
  choice: zu dem Engel
  rationale: ἄγγελος kann »Bote« bedeuten, bezeichnet hier im Kontext jedoch ausdrücklich eine Engelsgestalt.
- source_word: Ἀζαρία
  choice: Asarja
  rationale: Der Personenname wird in der im Deutschen üblichen biblischen Form wiedergegeben; der Vokativ wird durch die direkte Anrede ausgedrückt.
- source_word: ἀδελφέ
  choice: Bruder
  rationale: Die wörtliche Anrede bleibt erhalten. Sie bezeichnet hier vertraute oder respektvolle Anrede und behauptet keine leibliche Verwandtschaft.
- source_word: τί ἐστιν
  choice: wozu dienen
  rationale: Wörtlich steht »was ist«, doch im Zusammenhang fragt Tobias nach Zweck und Verwendung der Fischorgane. »Wozu dienen« gibt diese Funktion im natürlichen Deutschen wieder.
- source_word: τὸ ἧπαρ
  choice: die Leber
  rationale: Die übliche anatomische Bedeutung.
- source_word: ἡ καρδία
  choice: das Herz
  rationale: Die übliche anatomische Bedeutung.
- source_word: ἡ χολή
  choice: die Galle
  rationale: χολή bezeichnet Galle beziehungsweise Gallenflüssigkeit. »Galle« ist die knappe, geläufige anatomische Wiedergabe; die genauere Alternative wird in einer Fußnote genannt.
- source_word: τοῦ ἰχθύος
  choice: des Fisches
  rationale: Der Genitiv bezeichnet die Zugehörigkeit der genannten Organe zum Fisch.
theological_decisions:
- issue: Anrede ἀδελφέ gegenüber dem engelhaften Begleiter
  choice: Wörtlich als »Bruder« in direkter Anrede wiedergegeben
  alternative: Idiomatisch »Freund« oder Weglassen der Anrede
  rationale: Der Vers behauptet damit keine leibliche oder ontologische Verwandtschaft mit einem Engel, sondern gibt eine gewöhnliche vertraute Anrede wieder. Die wörtliche Form bewahrt dennoch die Ausdrucksweise und Spannung des griechischen Textes.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Frage ist natürlich formuliert, ohne die vertraute Anrede »Bruder« oder die ausdrückliche Bezeichnung des Begleiters als Engel abzuschwächen.
