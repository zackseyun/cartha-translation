  yaml_path: translation/deuterocanon/tobit/006/003.yaml
  text: Then the young man went down to wash himself[a], and a fish leaped up from the river and tried to swallow the young man.
translation:
  language: de
  text: Da ging der junge Mann hinunter, um sich zu waschen. Da sprang ein Fisch aus dem Fluss hervor und wollte den jungen Mann hinunterschlucken.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸ παιδάριον
  choice: der junge Mann
  rationale: Das Diminutiv παιδάριον kann ein Kind, einen Jungen oder jungen Diener bezeichnen. Tobias ist hier alt genug, selbstständig zu reisen und zu handeln; daher gibt „der junge Mann“ den Erzählzusammenhang verständlich wieder, ohne ihn als kleines Kind erscheinen zu lassen.
- source_word: κατέβη
  choice: ging hinunter
  rationale: Die Wendung bewahrt die konkrete Abwärtsbewegung zum Wasser und klingt im modernen Deutschen natürlich.
- source_word: περικλύσασθαι
  choice: um sich zu waschen
  rationale: Der mediale Infinitiv bezeichnet das Waschen der eigenen Person. Die Übersetzung bleibt neutral und setzt kein vollständiges Baden oder Untertauchen voraus.
- source_word: ἀνεπήδησεν
  choice: sprang … auf
  rationale: Das Verb beschreibt eine plötzliche Aufwärtsbewegung. „sprang … auf“ erhält die Lebendigkeit der Szene.
- source_word: ἰχθύς
  choice: ein Fisch
  rationale: Das Substantiv steht bei seiner Einführung ohne Artikel; „ein Fisch“ entspricht dem am unmittelbarsten.
- source_word: ἀπὸ τοῦ ποταμοῦ
  choice: aus dem Fluss
  rationale: Im Deutschen bezeichnet „aus dem Fluss“ idiomatisch sowohl die Herkunft als auch die Bewegung aus dem Wasser heraus.
- source_word: ἐβουλήθη
  choice: wollte
  rationale: Das Verb bezeichnet Willen, Wunsch oder Absicht. „wollte“ wahrt diese Bedeutung, ohne aus der bloßen Absicht ausdrücklich einen bereits begonnenen Versuch zu machen.
- source_word: καταπεῖν
  choice: verschlingen
  rationale: Das Verb bedeutet wörtlich „hinunterschlucken“. Bei einem angreifenden Fisch gibt „verschlingen“ den Vorgang natürlich und anschaulich wieder, ohne eine zusätzliche theologische Deutung einzutragen.
