translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Erzählbewegung. Die Wiederholung von „der junge Mann“ folgt dem griechischen Text und vermeidet einen unklaren Pronomenbezug. Die Satzteilung macht die rasche Abfolge im Deutschen gut verständlich.
