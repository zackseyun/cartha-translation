base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/006/015.yaml
  text: And now I am my father's only one[a], and I am afraid that if I go in, I will die, just as the former ones did, because a demon loves her, and it harms no one except those who approach her. And now I am afraid that I may die and bring down the life of my father and my mother in grief because of me to their grave[c][b]; and they have no other son who will bury them.
translation:
  language: de
  text: Und nun bin ich der einzige Sohn meines Vaters, und ich fürchte, dass ich sterben könnte, wenn ich zu ihr hineingehe, ebenso wie die früheren Männer. Denn ein Dämon liebt sie[a] und fügt niemandem Schaden zu außer denen, die zu ihr kommen. Nun fürchte ich, dass ich sterben und so das Leben meines Vaters und meiner Mutter aus Kummer um mich in ihr Grab hinabbringen könnte[b]. Sie haben keinen anderen Sohn, der sie begraben wird.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Ein Dämon liebt sie.“ Im Erzählzusammenhang beschreibt dies die unheilvolle, besitzergreifende Bindung des Dämons an Sara.'
    reason: Die ungewöhnliche wörtliche Aussage wird erläutert, ohne sie im Haupttext umzudeuten.
  - marker: b
    text: 'Wörtlich: „das Leben meines Vaters und meiner Mutter aus Kummer um mich in ihr Grab hinabbringen“ – ein Bild dafür, dass sein Tod auch seine Eltern vor Kummer sterben lassen könnte.'
    reason: Die griechische Bildrede wird im Haupttext bewahrt und in der Fußnote verständlich erklärt.
lexical_decisions:
- source_word: μόνος ... τῷ πατρί
  choice: der einzige Sohn meines Vaters
  rationale: μόνος bezeichnet hier im Zusammenhang mit dem später ausdrücklich genannten υἱός Tobias als den einzigen Sohn seines Vaters. Die deutsche Formulierung ist natürlich und macht den kontextuell eindeutigen Bezug verständlich.
- source_word: φοβοῦμαι μὴ εἰσελθὼν ἀποθάνω
  choice: ich fürchte, dass ich sterben werde, wenn ich zu ihr hineingehe
  rationale: Die Wendung gibt die Befürchtung samt der an das Hineingehen geknüpften Möglichkeit des Todes natürlich wieder. „Zu ihr“ verdeutlicht den im Kontext gegebenen Bezug, ohne den Ort ausdrücklich als Brautgemach festzulegen.
- source_word: οἱ πρότεροι
  choice: die früheren Männer
  rationale: Gemeint sind Saras frühere Ehemänner. „Männer“ ist im Deutschen verständlicher als das substantivierte „die Früheren“, ohne eine weitergehende Deutung einzuführen.
- source_word: δαιμόνιον
  choice: ein Dämon
  rationale: Das griechische Wort bezeichnet in der Erzählung ein persönliches feindliches Geistwesen; „Dämon“ ist die direkte moderne Entsprechung.
- source_word: φιλεῖ αὐτήν
  choice: liebt sie
  rationale: φιλέω bedeutet seinem gewöhnlichen Wortsinn nach „lieben“. Die befremdliche, besitzergreifende Bindung des Dämons wird nicht durch eine abschwächende Umschreibung aufgelöst.
- source_word: ἀδικεῖ
  choice: fügt ... Schaden zu
  rationale: Im Kontext bezeichnet ἀδικέω das schädigende, letztlich tödliche Handeln des Dämons. Die Formulierung ist idiomatisch und bleibt gegenüber der genauen Art des Schadens offen.
- source_word: τῶν προσαγόντων αὐτῇ
  choice: denen, die zu ihr kommen
  rationale: Die Wendung bezeichnet Männer, die sich Sara im Rahmen der Eheschließung nähern. „Zu ihr kommen“ bewahrt die Breite des Ausdrucks und klingt im Deutschen natürlich.
- source_word: κατάξω τὴν ζωὴν ... εἰς τὸν τάφον αὐτῶν
  choice: das Leben ... in ihr Grab hinabbringen
  rationale: 'Die auffällige griechische Bildsprache wird bewahrt: Tobias fürchtet, durch seinen Tod auch seine Eltern vor Kummer dem Tod zuzuführen.'
- source_word: μετʼ ὀδύνης ἐπʼ ἐμοί
  choice: aus Kummer um mich
  rationale: ὀδύνη bezeichnet schmerzlichen Kummer; ἐπʼ ἐμοί benennt Tobias als dessen Anlass. Die deutsche Wendung verbindet beides knapp und natürlich.
- source_word: υἱὸς ἕτερος οὐχ ὑπάρχει αὐτοῖς
  choice: Sie haben keinen anderen Sohn
  rationale: Dies ist die idiomatische deutsche Wiedergabe der griechischen Existenzkonstruktion.
- source_word: ὃς θάψει αὐτούς
  choice: der sie begraben wird
  rationale: Der zukünftige Vollzug der kindlichen Bestattungspflicht wird formal und verständlich wiedergegeben.
theological_decisions:
- issue: Wesen des δαιμόνιον
  choice: ein persönlicher Dämon, der Saras Ehemänner schädigt
  alternative: ein allgemein verstandener böser Geist
  rationale: Der Erzählzusammenhang und die grammatische Darstellung behandeln das δαιμόνιον als handelndes persönliches Wesen. Die Übersetzung bleibt bei dieser unmittelbaren Textaussage.
- issue: Bedeutung von φιλεῖ für die Bindung des Dämons an Sara
  choice: „liebt sie“
  alternative: „ist besitzergreifend an sie gebunden“ oder „begehrt sie“
  rationale: Die direkte Bedeutung „liebt“ erhält die theologisch und erzählerisch spannungsvolle Aussage des Textes. Eine Erklärung der unheilvollen Art dieser Liebe gehört in die Fußnote, nicht als stillschweigende Umdeutung in den Haupttext.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit gut verständlichem Satzbau. Die Wiederholung „ich fürchte“ und die drastische Grabmetaphorik bleiben erhalten. Das zweimalige καὶ νῦν wird mit „Und nun“ beziehungsweise „Nun“ wiedergegeben, ohne den deutschen Text unnötig zu beschweren.
