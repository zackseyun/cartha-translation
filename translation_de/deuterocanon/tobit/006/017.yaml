  text: And when you enter into the bridal chamber[a], take some of the incense ashes and place on them some of the fish’s heart and liver, and make smoke with them[b],
translation:
  language: de
  text: Und wenn du in das Brautgemach gehst, nimm etwas Asche vom Räucherwerk, lege etwas vom Herzen und von der Leber des Fisches darauf und erzeuge damit Rauch.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Verb bezeichnet genauer das Erzeugen von Rauch oder Räuchern, nicht lediglich das Verbrennen.
    reason: lexical_alternative
lexical_decisions:
- source_word: νυμφῶνα
  choice: Brautgemach
  rationale: Das Wort bezeichnet hier den Raum für das Ehebett beziehungsweise den Vollzug der Ehe. „Brautgemach“ ist im Deutschen würdevoll, verständlich und bewahrt den ehelichen Zusammenhang.
- source_word: λήμψῃ
  choice: nimm
  rationale: Im Zusammenhang dieser praktischen Anweisung bezeichnet das Verb das Nehmen eines Gegenstands zum anschließenden Gebrauch.
- source_word: τέφραν θυμιαμάτων
  choice: etwas Asche vom Räucherwerk
  rationale: τέφρα bedeutet „Asche“, während θυμιαμάτων verbrannte Duft- oder Räucherstoffe bezeichnet. „Asche vom Räucherwerk“ gibt die Genitivverbindung natürlich wieder; „etwas“ entspricht dem sachlich vorausgesetzten Teilquantum.
- source_word: ἐπιθήσεις
  choice: lege … darauf
  rationale: Das Verb bedeutet „auflegen“ oder „darauflegen“. „Darauf“ bezieht sich eindeutig auf die zuvor genannte Asche.
- source_word: ἀπὸ τῆς καρδίας καὶ τοῦ ἥπατος τοῦ ἰχθύος
  choice: etwas vom Herzen und von der Leber des Fisches
  rationale: 'ἀπό hat hier partitive Bedeutung: Von beiden Organen soll jeweils eine Menge genommen und auf die Asche gelegt werden. Die Formulierung wahrt, dass nicht notwendig die ganzen Organe gemeint sind.'
- source_word: καπνίσεις
  choice: erzeuge damit Rauch
  rationale: Das Verb bezeichnet spezifisch das Hervorbringen von Rauch beziehungsweise Räuchern, nicht bloß ein unspezifisches Verbrennen. Die Formulierung beschreibt die konkrete Handlung, ohne ihre Wirkung vorwegzunehmen.
theological_decisions:
- issue: Rituelle beziehungsweise heilkundliche Handlung bei καπνίσεις
  choice: Die Handlung wird konkret als Erzeugen von Rauch wiedergegeben.
  alternative: „Verbrenne es als Opfer“ oder „räuchere das Zimmer aus“
  rationale: Der griechische Text beschreibt in diesem Vers nur die physische Handlung. Ihre Wirkung wird erst im folgenden Zusammenhang erklärt; deshalb wird hier weder eine Opferhandlung noch eine ausdrücklich exorzistische Wirkung in den Text eingetragen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. „Brautgemach“ bewahrt das antike eheliche Umfeld, ohne altertümliche Syntax zu verwenden. Der Satz folgt der griechischen Abfolge der Anweisungen und lässt die beabsichtigte Wirkung des Rauchs offen.
