base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/006/004.yaml
  text: But the angel said to him, “Grab the fish.” So the boy seized the fish and threw it up onto the land.
translation:
  language: de
  text: 'Doch der Engel sagte zu ihm: »Pack den Fisch!« Da ergriff der Junge den Fisch und warf ihn ans Ufer.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐπιλαβοῦ τοῦ ἰχθύος
  choice: Pack den Fisch!
  rationale: Der Aoristimperativ von ἐπιλαμβάνομαι fordert ein entschlossenes Zugreifen; die knappe, natürliche Wendung gibt die Dringlichkeit wieder.
- source_word: τὸ παιδάριον
  choice: der Junge
  rationale: Bezeichnet hier natürlich den jungen Tobias; „der Junge“ ist modern und wahrt die erzählerische Perspektive.
- source_word: ἀνέβαλεν αὐτὸν ἐπὶ τὴν γῆν
  choice: warf ihn ans Ufer hinauf
  rationale: ἀναβάλλω bezeichnet hier eine Bewegung nach oben beziehungsweise aus dem Wasser auf festen Boden; „warf ... hinauf“ bewahrt die kräftige Handlung, während „Ufer“ im Kontext natürlicher als das wörtliche „Land“ ist.
