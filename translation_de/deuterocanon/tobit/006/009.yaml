    issue: „weiße Flecken“ für λευκώματα
    rationale: Die griechische Bezeichnung meint im Augenkontext eher weißliche Trübungen/Eintrübungen als bloße Flecken. Die Änderung bleibt beschreibend und vermeidet eine diagnostische Festlegung.
  - severity: low
    issue: Unidiomatische Konstruktion „einem Menschen auftragen“
    rationale: Die Aussage ist nicht falsch, klingt aber im modernen Deutsch unnatürlich. „bei einem Menschen ... auftragen“ erhält die im Griechischen genannte Person als Bezug und formuliert die Anwendung klarer.
  revised_text: Die Galle aber soll man bei einem Menschen, der weiße Trübungen in den Augen hat, auftragen; dann wird er geheilt.
