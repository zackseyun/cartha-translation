lexical_decisions:
- source_word: χολή
  choice: Galle
  rationale: Die direkte und im Zusammenhang mit dem Fischorgan klare deutsche Entsprechung.
- source_word: ἐγχρῖσαι
  choice: auftragen
  rationale: Der Infinitiv bezeichnet das äußerliche Auftragen beziehungsweise Einstreichen; „auftragen“ klingt im medizinischen Zusammenhang natürlich und bewahrt den sachlichen Sinn.
- source_word: λευκώματα
  choice: weiße Flecken
  rationale: Das Wort bezeichnet weißliche Stellen oder Trübungen am Auge. „Weiße Flecken“ bildet die sichtbare Erscheinung verständlich ab, ohne eine moderne Diagnose festzulegen.
- source_word: ἰαθήσεται
  choice: wird geheilt werden
  rationale: Das Passiv und die Zukunftsbedeutung werden ausdrücklich bewahrt.
