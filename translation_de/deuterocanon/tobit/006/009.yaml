  verdict: revise
  source_fidelity: Der Satz gibt χολή („Galle“), die äußerliche Anwendung von ἐγχρῖσαι und die Zukunftsaussage καὶ ἰαθήσεται zutreffend wieder. λευκώματα bezeichnet weißliche Trübungen bzw. fleckige Eintrübungen im Auge; „weiße Flecken“ ist möglich, aber weniger idiomatisch und medizinisch weniger treffend als eine beschreibende Wiedergabe mit „Trübungen“.
  naturalness: „Die Galle aber soll man einem Menschen auftragen“ ist verständlich, wirkt im Deutschen jedoch syntaktisch etwas ungeschickt, weil üblicherweise eine Körperstelle bzw. die Augen als Auftragungsort erwartet werden. Da das Griechische die Person als Objekt nennt und die Augenkrankheit unmittelbar folgt, ist „bei einem Menschen ... auftragen“ eine natürliche Formulierung, ohne einen im Ausgangstext nicht ausdrücklich genannten Auftragungsort zu ergänzen. „wird geheilt“ ist modernes, natürliches Deutsch und bewahrt die Zukunftsaussage.
  terminology: „Galle“ ist korrekt. „Weiße Trübungen in den Augen“ gibt λευκώματα als sichtbaren Befund wieder, ohne eine konkrete moderne Diagnose festzulegen, und entspricht dem englischen Audit-Ausdruck „white films“ besser als „weiße Flecken“.
  issues:
