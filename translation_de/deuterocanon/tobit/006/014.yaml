base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/006/014.yaml
  text: Then the young man said to the angel[a], “Azariah, brother, I have heard that the girl has been given to seven men[b], and that all of them were hindered in the bridal chamber.”
translation:
  language: de
  text: 'Da sagte der junge Mann zu dem Engel: „Asarja, Bruder, ich habe gehört, dass das Mädchen sieben Männern gegeben worden ist[a] und dass sie alle im Brautgemach gehindert wurden[b].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sieben Ehemännern zur Frau gegeben worden ist“. Wörtlich steht im Griechischen „sieben Männern gegeben worden ist“; der Zusammenhang macht deutlich, dass es um Eheschließungen geht.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich etwa: „sie alle im Brautgemach gehindert wurden“. Die knappe griechische Formulierung sagt nicht ausdrücklich, worin die Hinderung bestand; nach dem Erzählzusammenhang konnten die früheren Bräutigame die Ehe nicht vollziehen, weil sie dort starben.'
    reason: alternative_reading
lexical_decisions:
- source_word: τὸ παιδάριον
  choice: der junge Mann
  rationale: παιδάριον kann ein Kind oder einen Jungen bezeichnen; da Tobias im heiratsfähigen Alter ist, gibt „der junge Mann“ die erzählerische Situation im heutigen Deutsch angemessen wieder.
- source_word: τῷ ἀγγέλῳ
  choice: zu dem Engel
  rationale: Im Kontext des Tobitbuches ist Asarja ein Engel; diese Bedeutung von ἄγγελος ist hier sachlich eindeutig.
- source_word: ἀδελφέ
  choice: Bruder
  rationale: Die direkte Anrede wird formal bewahrt; sie kann vertraulich gemeint sein, ohne eine leibliche Verwandtschaft auszudrücken.
- source_word: ἀκήκοα
  choice: ich habe gehört
  rationale: Das Perfekt bezeichnet hier ein Gehörthaben, dessen Kenntnis in der Gegenwart fortbesteht.
- source_word: τὸ κοράσιον
  choice: das Mädchen
  rationale: κοράσιον bezeichnet ein Mädchen oder eine junge Frau; „das Mädchen“ ist natürlich und bleibt nah an der griechischen Bezeichnung.
- source_word: δεδόσθαι ἑπτὰ ἀνδράσιν
  choice: sieben Männern gegeben worden ist
  rationale: Die passive Form von δίδωμι wird eng am Wortlaut wiedergegeben. Der eheliche Sinn ergibt sich aus dem Kontext, während ἀνδράσιν formal „Männern“ heißen kann.
- source_word: ἐν τῷ νυμφῶνι
  choice: im Brautgemach
  rationale: νυμφών bezeichnet das für die Hochzeit beziehungsweise die eheliche Vereinigung bestimmte Gemach; „Brautgemach“ ist knapp und würdevoll.
- source_word: ἀποκωλῦσαι
  choice: gehindert wurden
  rationale: Das Verb bezeichnet ein Hindern oder Abhalten. Die komprimierte griechische Aussage wird nicht durch die aus dem weiteren Kontext bekannte Tötung ersetzt.
theological_decisions:
- issue: Wie ausdrücklich das Schicksal von Saras früheren Männern wiederzugeben ist
  choice: Im Haupttext „gehindert wurden“
  alternative: „getötet wurden“, „umkamen“ oder „von ihr ferngehalten wurden“
  rationale: Der griechische Wortlaut verwendet ein Verb des Hinderns oder Abhaltens und benennt hier nicht ausdrücklich den Tod. Dass die Männer starben, ergibt sich aus dem weiteren Erzählzusammenhang und wird daher nur in der Fußnote erläutert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Anrede „Asarja, Bruder“ und die ungewöhnlich knappe Aussage über das Brautgemach bleiben erhalten; erklärende Präzisierungen stehen in den Fußnoten.
