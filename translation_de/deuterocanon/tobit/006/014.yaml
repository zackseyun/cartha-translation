  source_fidelity: 'Der Entwurf gibt die zentralen Ausdrücke des griechischen Textes zuverlässig wieder: παιδάριον ist kontextgerecht als „der junge Mann“ gefasst, ἀδελφέ bleibt in der unmittelbaren Anrede „Bruder“ sichtbar, und das Perfekt ἀκήκοα wird treffend mit „ich habe gehört“ wiedergegeben. „Sieben Männern gegeben worden ist“ bewahrt die nicht weiter spezifizierte Bezeichnung ἀνδράσιν, ohne den ehelichen Kontext zu verlieren. „Im Brautgemach gehindert wurden“ erhält die knappe und hinsichtlich der genauen Art der Hinderung zurückhaltende Aussage von ἀποκωλῦσαι.'
