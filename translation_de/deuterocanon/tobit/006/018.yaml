base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/006/018.yaml
  text: Then the demon will smell it and flee[a], and it will never return forever. But when you go in to her, rise, both of you, and cry out to the merciful God, and he will save you and have mercy on you. Do not fear, because she had been prepared for you from eternity, and you will save her, and she will go with you, and I suppose that you will have children by her. And when Tobias heard these things, he kissed her[d][c][b], and his soul was bound to her very strongly.
translation:
  language: de
  text: Dann wird der Dämon es riechen und fliehen, und er wird in alle Ewigkeit nicht zurückkehren.[a] Wenn du aber zu ihr eingehst,[b] dann steht beide auf und ruft zum barmherzigen Gott; er wird euch retten und sich eurer erbarmen. Fürchte dich nicht, denn sie war von Ewigkeit her für dich bereitet.[c] Du wirst sie retten, und sie wird mit dir gehen. Ich nehme an, dass du mit ihr Kinder haben wirst. Als Tobias dies hörte, küsste er sie, und seine Seele hing sehr an ihr.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: „Er wird nicht zurückkehren für immer und ewig.“ Die griechische Wendung betont, dass er endgültig nicht zurückkehrt.'
    reason: lexical_alternative
  - marker: b
    text: „Zu ihr eingehen“ ist hier eine eheliche Wendung und meint, dass Tobias sich Sara als ihr Ehemann nähert.
    reason: cultural_note
  - marker: c
    text: 'Oder: „seit alters“ beziehungsweise „seit langer Zeit“. Der griechische Ausdruck kann sowohl eine weit zurückliegende Zeit als auch einen ewigen Horizont bezeichnen.'
    reason: alternative_reading
  - marker: d
    text: Dass seine Seele „an ihr hing“, ist ein anschauliches Bild für eine tiefe, feste Verbundenheit, nicht nur für eine flüchtige Zuneigung.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀσφρανθήσεται
  choice: wird es riechen
  rationale: Das Verb bezeichnet konkret das Wahrnehmen eines Geruchs. Die knappe Wiedergabe bewahrt den Bezug zu den zuvor genannten Fischteilen.
- source_word: τὸ δαιμόνιον
  choice: der Dämon
  rationale: Dies ist die präzise und im Deutschen übliche Bezeichnung; „böser Geist“ wäre möglich, aber weniger nah am griechischen Ausdruck.
- source_word: οὐκ ἐπανελεύσεται τὸν αἰῶνα τοῦ αἰῶνος
  choice: wird in alle Ewigkeit nicht zurückkehren
  rationale: Die deutsche Wendung gibt die emphatische Aussage dauerhafter Nichtrückkehr würdig und natürlich wieder, ohne die griechische Bekräftigung durch unnötige Redundanz nachzuahmen.
- source_word: προσπορεύῃ αὐτῇ
  choice: zu ihr eingehst
  rationale: Im Zusammenhang der Eheschließung bezeichnet die Formulierung die Annäherung an Sara als Ehemann. Die traditionelle deutsche Ehebettsprache wahrt den Sinn, ohne ihn grob auszudrücken.
- source_word: ἐγέρθητε ἀμφότεροι
  choice: steht beide auf
  rationale: Der Pluralimperativ und die ausdrückliche Einbeziehung beider Personen bleiben erhalten.
- source_word: βοήσατε πρὸς τὸν ἐλεήμονα θεόν
  choice: ruft zu dem barmherzigen Gott
  rationale: „Ruft“ bewahrt die Dringlichkeit von βοάω besser als das allgemeinere „betet“.
- source_word: σώσει ὑμᾶς καὶ ἐλεήσει
  choice: er wird euch retten und sich eurer erbarmen
  rationale: Beide Verben werden transparent wiedergegeben; „retten“ lässt sowohl die unmittelbare erzählerische Gefahr als auch die theologische Tragweite stehen.
- source_word: ἡτοίμασμένη ἦν ἀπὸ τοῦ αἰῶνος
  choice: war von Ewigkeit her für dich bereitet
  rationale: „Bereitet“ wahrt den passivischen Wortlaut, während „von Ewigkeit her“ die starke Zeitangabe wiedergibt. Die mögliche Bedeutung „seit alters“ wird in der Fußnote offengehalten.
- source_word: σὺ αὐτὴν σώσεις
  choice: du wirst sie retten
  rationale: Dasselbe Verb wie zuvor wird konsequent mit „retten“ wiedergegeben; der unmittelbare Zusammenhang ist Saras Befreiung von der tödlichen Bedrohung durch den Dämon.
- source_word: πορεύσεται μετὰ σοῦ
  choice: sie wird mit dir gehen
  rationale: Die einfache, natürliche Formulierung bewahrt die Breite des griechischen Verbs.
- source_word: ὑπολαμβάνω
  choice: ich nehme an
  rationale: Die Wendung gibt eine persönliche, wenn auch zuversichtliche Erwartung wieder, ohne sie zu einer ausdrücklichen Offenbarungsformel zu verstärken.
- source_word: ἐξ αὐτῆς παιδία
  choice: mit ihr Kinder
  rationale: Im Deutschen bezeichnet „mit ihr Kinder haben“ natürlich und eindeutig Kinder aus dieser Verbindung.
- source_word: ἡ ψυχὴ αὐτοῦ ἐκολλήθη αὐτῇ σφόδρα
  choice: seine Seele hing sehr an ihr
  rationale: Die Formulierung erhält ψυχή als „Seele“ und gibt das bildhafte feste Anhängen idiomatisch wieder.
theological_decisions:
- issue: Zeitliche Tragweite von ἀπὸ τοῦ αἰῶνος bei Saras Bereitung für Tobias
  choice: von Ewigkeit her
  alternative: seit alters / seit langer Zeit
  rationale: Die starke Lesart passt zur feierlichen Zusage göttlicher Vorsehung, doch die griechische Wendung kann auch auf weit zurückliegende Zeit weisen; diese Spannung wird durch eine Fußnote bewahrt.
- issue: Bedeutung von „du wirst sie retten“
  choice: „retten“ bleibt im Haupttext stehen und bezeichnet im Erzählzusammenhang die Befreiung von der Bedrohung durch den Dämon
  alternative: beschützen / bewahren oder eine umfassendere geistliche Erlösung
  rationale: Der unmittelbare Kontext spricht von der tödlichen dämonischen Gefahr. Die wortnahe Wiedergabe vermeidet zugleich, eine spätere dogmatische Bedeutung ausdrücklich in den Vers einzutragen.
- issue: Gewissheitsgrad von ὑπολαμβάνω
  choice: ich nehme an
  alternative: ich erwarte / ich bin überzeugt
  rationale: Die Übersetzung bewahrt die im Verb liegende persönliche Einschätzung und macht Raphaels Aussage nicht eindeutiger oder offenbarungsförmiger, als der griechische Wortlaut es verlangt.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Erzählstil. Konkrete und theologisch gewichtige Ausdrücke wie „Dämon“, „retten“, „barmherzig“ und „Seele“ bleiben erhalten. Die eheliche Wendung wird im Haupttext knapp bewahrt und in der Fußnote erläutert; echte zeitliche und semantische Mehrdeutigkeiten werden nicht stillschweigend aufgelöst.
