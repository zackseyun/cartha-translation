base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/006/011.yaml
  text: The angel said to the young man, “Brother, today we will lodge with Raguel. He is your relative, and he has a daughter named Sarah.”
translation:
  language: de
  text: 'Der Engel sagte zu dem jungen Mann: »Bruder, heute werden wir bei Raguël übernachten. Er ist mit dir verwandt und hat eine Tochter namens Sara.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παιδαρίῳ
  choice: zu dem jungen Mann
  rationale: Das Wort kann einen Jungen oder jungen Menschen bezeichnen. Da Tobias im Zusammenhang als Reisender und heiratsfähiger Mann erscheint, ist »junger Mann« im modernen Deutsch natürlich und sachgerecht.
- source_word: Ἀδελφέ
  choice: Bruder
  rationale: Die direkte Anrede wird in ihrer verwandtschaftlich-brüderlichen Form bewahrt und nicht zu einer allgemeinen Anrede abgeschwächt.
- source_word: σήμερον
  choice: heute
  rationale: Direkte und natürliche Wiedergabe des griechischen Zeitadverbs.
- source_word: αὐλισθησόμεθα
  choice: werden wir … übernachten
  rationale: Das Verb bezeichnet hier das Einkehren beziehungsweise Verbringen der Nacht. »Übernachten« ist im Reisekontext idiomatisch und legt nicht unnötig fest, ob im Freien oder in einem Haus genächtigt wird.
- source_word: παρὰ Ῥαγουήλῳ
  choice: bei Raguël
  rationale: παρά mit Dativ bezeichnet hier den Aufenthalt bei einer Person beziehungsweise in ihrem Haushalt; »bei Raguël« ist die natürliche deutsche Entsprechung.
- source_word: συγγενής σού
  choice: mit dir verwandt
  rationale: Die prädikative Konstruktion bezeichnet ein Verwandtschaftsverhältnis. Die Formulierung ist modernes, klares Deutsch und vermeidet das altertümliche »Verwandter« beziehungsweise »Verwandter von dir«.
- source_word: θυγάτηρ
  choice: Tochter
  rationale: Direkte und eindeutige Wiedergabe des Verwandtschaftsbegriffs.
- source_word: ὄνομα Σάρρα
  choice: namens Sara
  rationale: Die knappe Namenskonstruktion wird idiomatisch wiedergegeben. »Sara« entspricht der im Deutschen gebräuchlichen biblischen Namensform.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die griechische Satzverkettung wird zur besseren Verständlichkeit in zwei Sätze gegliedert, ohne den Sinn oder die Abfolge der Aussagen zu verändern. Die Schreibung »Raguël« kennzeichnet die getrennte Aussprache der Vokale.
