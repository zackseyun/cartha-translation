base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/006/016.yaml
  text: But the angel said to him[a], “Do you not remember the words that your father commanded you about taking a wife from your own kin? And now listen to me, brother, because she will be your wife, and pay no attention to the demon, for tonight she will be given to you as a wife.”
translation:
  language: de
  text: 'Der Engel aber sagte zu ihm: »Erinnerst du dich nicht an die Worte, die dein Vater dir aufgetragen hat: Du sollst eine Frau aus deiner eigenen Verwandtschaft nehmen? Nun hör mir zu, Bruder! Denn sie wird deine Frau sein. Kümmere dich nicht um den Dämon[a], denn in dieser Nacht wird sie dir zur Frau gegeben werden.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Sorge dich nicht wegen des Dämons.« Wörtlich lautet die griechische Wendung etwa: »Habe keine Rede/Rechnung von dem Dämon.«'
    reason: Lexikalische Alternative und Erklärung einer griechischen Redewendung.
lexical_decisions:
- source_word: μέμνησαι
  choice: Erinnerst du dich nicht
  rationale: Das Perfekt hat hier präsentische Bedeutung; die deutsche Frage gibt den fortdauernden Erinnerungsbezug natürlich wieder.
- source_word: λόγων ὧν ἐνετείλατό σοι
  choice: an die Worte, die dein Vater dir aufgetragen hat
  rationale: »Worte« bewahrt λόγων, während »aufgetragen« den verbindlichen, aber im familiären Kontext natürlichen Sinn von ἐνετείλατο ausdrückt.
- source_word: ὑπὲρ τοῦ λαβεῖν σε γυναῖκα
  choice: Du sollst eine Frau ... nehmen
  rationale: Die Eheformel wird quellennah wiedergegeben; die direkte Soll-Formulierung macht im Deutschen den Inhalt des väterlichen Auftrags klar.
- source_word: ἐκ τοῦ γένους σου
  choice: aus deiner eigenen Verwandtschaft
  rationale: γένος bezeichnet hier die familiäre Abstammungs- und Verwandtschaftsgruppe, ohne zwingend einen Stamm oder ein Volk festzulegen.
- source_word: ἄκουσόν μου
  choice: höre auf mich
  rationale: Die Wendung enthält mehr als bloßes akustisches Hören und fordert dazu auf, dem Rat des Engels Beachtung zu schenken.
- source_word: ἀδελφέ
  choice: Bruder
  rationale: Die wörtliche Anrede bleibt erhalten und vermittelt zugleich die zugewandte Ansprache.
- source_word: σοὶ ἔσται εἰς γυναῖκα
  choice: sie wird deine Frau sein
  rationale: Dies ist eine natürliche deutsche Wiedergabe der griechischen Formel für den ehelichen Status.
- source_word: τοῦ δαιμονίου μηδένα λόγον ἔχε
  choice: Kümmere dich nicht um den Dämon
  rationale: Die wörtlich ungewöhnliche Wendung »keine Rede/Rechnung vom Dämon haben« bedeutet hier, ihm keine Beachtung oder Sorge zu widmen; eine Fußnote bewahrt die mögliche Nuance.
- source_word: τὴν νύκτα ταύτην
  choice: noch in dieser Nacht
  rationale: Die Formulierung erhält den ausdrücklichen Bezug auf diese Nacht und klingt im Zusammenhang natürlich.
- source_word: δοθήσεταί σοι αὕτη εἰς γυναῖκα
  choice: wird sie dir zur Frau gegeben werden
  rationale: Das Passiv und die wiederholte Eheformel des Griechischen bleiben ausdrücklich erhalten.
theological_decisions:
- issue: Eheformel und verwandtschaftliche Verpflichtung
  choice: Die wiederholte Eheterminologie und der Bezug auf die eigene Verwandtschaft werden ausdrücklich beibehalten.
  alternative: Durchgehend allgemeiner mit »heiraten« und »Verwandte« formulieren.
  rationale: Der griechische Text betont sowohl den väterlichen Auftrag als auch die formelhafte Übertragung zur Frau; die Übersetzung bewertet diesen sozialen Rahmen nicht, sondern bildet ihn ab.
- issue: Benennung der übernatürlichen Bedrohung
  choice: δαιμόνιον wird mit »Dämon« wiedergegeben.
  alternative: »böser Geist«
  rationale: »Dämon« entspricht der ausdrücklichen Benennung im Ausgangstext und vermeidet eine unnötige Verallgemeinerung.
- issue: Mehrdeutigkeit von μηδένα λόγον ἔχε
  choice: Im Haupttext steht »Kümmere dich nicht um den Dämon«; die Fußnote nennt die mögliche Nuance »Sorge dich nicht wegen des Dämons«.
  alternative: Nur eine der Bedeutungsnuancen ohne Hinweis wiedergeben.
  rationale: Die griechische Redewendung kann sowohl fehlende Beachtung als auch fehlende Sorge ausdrücken; diese Spannung soll nicht stillschweigend aufgelöst werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede ist klar gegliedert; »eine Frau nehmen« und »zur Frau gegeben werden« bewahren bewusst die antike Eheformel, ohne unnötig altertümlich zu klingen.
