base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/006/006.yaml
  text: And the young man did as the angel told him. Then they roasted the fish and ate it[a], and both of them traveled on until they came near Ecbatana.
translation:
  language: de
  text: Und der junge Mann tat, was der Engel ihm gesagt hatte. Dann brieten sie den Fisch und aßen ihn. Beide zogen weiter, bis sie in die Nähe von Ekbatana kamen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸ παιδάριον
  choice: der junge Mann
  rationale: παιδάριον kann »Junge« oder »Kind« bedeuten; im Erzählzusammenhang ist Tobias jedoch ein heiratsfähiger Reisender. »Der junge Mann« bewahrt seine Jugend, ohne ihn als kleines Kind erscheinen zu lassen.
- source_word: ἐποίησεν ... ὡς εἶπεν αὐτῷ ὁ ἄγγελος
  choice: tat, was der Engel ihm gesagt hatte
  rationale: Die natürliche deutsche Formulierung gibt sowohl das Tun als auch die vorausgegangene Anweisung wieder, ohne εἶπεν zu einem förmlichen Befehl zu verstärken.
- source_word: τὸν δὲ ἰχθὺν ὀπτήσαντες ἔφαγον
  choice: Dann brieten sie den Fisch und aßen ihn
  rationale: Das Partizip wird als zeitliche Handlungsfolge wiedergegeben. »Brieten« bezeichnet hier verständlich das Garen über Feuer; das Pronomen »ihn« macht den im Griechischen erschließbaren Gegenstand deutlich.
- source_word: ὥδευον ἀμφότεροι
  choice: Beide zogen weiter
  rationale: Der Imperfekt bezeichnet die fortgesetzte Reise; »zogen weiter« ist idiomatisch und »beide« hält ausdrücklich fest, dass Tobias und der Engel gemeinsam unterwegs waren.
- source_word: ἕως ἤγγισαν ἐν Ἐκβατάνοις
  choice: bis sie in die Nähe von Ekbatana kamen
  rationale: ἤγγισαν bezeichnet Annäherung und nicht zwingend die Ankunft in der Stadt. Die etwas ungewöhnliche Verbindung mit ἐν wird im Deutschen natürlich als räumliche Nähe ausgedrückt.
