translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch in würdigem Erzählstil. Der Satzbau bleibt nah an der griechischen Handlungsfolge, wird aber für flüssiges Deutsch leicht gegliedert. Keine Fußnote ist nötig, weil die Annäherung an Ekbatana bereits eindeutig im Haupttext ausgedrückt wird.
