base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/006/012.yaml
  text: I will speak about her[a], so that she may be given to you as a wife, because her inheritance falls to you, and you alone are from her family[b]; and the young woman is beautiful and sensible.
translation:
  language: de
  text: Ich werde über sie sprechen[a], damit sie dir zur Frau gegeben wird; denn ihr Erbe fällt dir zu[b], und du allein gehörst zu ihrer Verwandtschaft[c]. Die junge Frau ist schön und verständig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ich werde ihretwegen sprechen“ beziehungsweise „für sie sprechen“. Das Griechische sagt wörtlich, dass über sie gesprochen wird; ein Eintreten für sie ergibt sich möglicherweise aus dem Zusammenhang.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „ihr Erbe gehört dir“ beziehungsweise „der Anspruch auf ihr Erbe fällt dir zu“. Das Griechische bezeichnet einen mit der Verwandtschaft verbundenen rechtlichen Anspruch oder eine entsprechende Verpflichtung.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „du allein bist von ihrer Sippe“ beziehungsweise „du allein bist mit ihr verwandt“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λαλήσω περὶ αὐτῆς
  choice: Ich werde über sie sprechen
  rationale: λαλέω mit περί und Genitiv bezeichnet unmittelbar das Sprechen über oder bezüglich einer Person. Ein Eintreten „für sie“ kann im Zusammenhang mitschwingen, wird aber nicht ausdrücklich gesagt.
- source_word: τοῦ δοθῆναί σοι αὐτὴν εἰς γυναῖκα
  choice: damit sie dir zur Frau gegeben wird
  rationale: Der artikulierte Infinitiv mit τοῦ drückt hier den Zweck des angekündigten Gesprächs aus. „Zur Frau“ gibt εἰς γυναῖκα knapp und würdig wieder.
- source_word: σοὶ ἐπιβάλλει ἡ κληρονομία αὐτῆς
  choice: ihr Erbe fällt dir zu
  rationale: ἐπιβάλλει bezeichnet hier, dass das Erbe aufgrund der verwandtschaftlichen Rechtslage dem Angesprochenen zufällt. „Fällt dir zu“ bewahrt den rechtlichen und dynamischen Sinn besser als das allgemeinere „gehört dir“.
- source_word: σὺ μόνος εἶ ἐκ τοῦ γένους αὐτῆς
  choice: du allein gehörst zu ihrer Verwandtschaft
  rationale: γένος meint hier Familie, Sippe oder Verwandtschaft. Die gewählte Formulierung ist im modernen Deutsch natürlich und gibt die maßgebliche Zugehörigkeit zur Verwandtschaft wieder, ohne eine engere Abstammungslinie festzulegen.
- source_word: τὸ κοράσιον
  choice: die junge Frau
  rationale: κοράσιον kann ein Mädchen oder eine junge Frau bezeichnen. Im Zusammenhang einer beabsichtigten Eheschließung ist „junge Frau“ angemessen und vermeidet einen kindlichen Beiklang.
- source_word: καλὸν
  choice: schön
  rationale: καλός bezeichnet in der Beschreibung der künftigen Braut ihre Schönheit beziehungsweise ihr ansprechendes Äußeres.
- source_word: φρόνιμόν
  choice: verständig
  rationale: φρόνιμος bezeichnet praktische Einsicht, Besonnenheit und gutes Urteilsvermögen. „Verständig“ ist würdig und bewahrt diese Bedeutungsbreite.
theological_decisions:
- issue: Ehe und Erbe im Rahmen verwandtschaftlicher Rechtsansprüche
  choice: denn ihr Erbe fällt dir zu, und du allein gehörst zu ihrer Verwandtschaft
  alternative: denn ihr Erbe gehört dir, und du allein bist aus ihrer Sippe
  rationale: Die Begründung verbindet die vorgeschlagene Ehe mit Verwandtschaft und Erbrecht. Die Übersetzung erhält diese rechtlich-soziale Spannung, ohne die genaue zugrunde liegende Rechtsordnung zu erklären oder eine spätere konfessionelle Deutung einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzglieder bleiben eng an der griechischen Begründungsfolge; der abschließende mit καί verbundene Satz wird zur besseren deutschen Lesbarkeit als eigener Satz wiedergegeben.
