base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/006/013.yaml
  text: And now listen to me[a], and I will speak to her father; and when we return from Rages, we will arrange the marriage. For I know that Raguel will certainly not give her to another man contrary to the law of Moses, or he will incur death[b], because it is fitting for you to receive the inheritance rather than any other man.
translation:
  language: de
  text: 'Und nun hör mir zu: Ich werde mit ihrem Vater reden, und wenn wir aus Rages zurückkehren, werden wir die Hochzeit feiern. Denn ich weiß: Raguel wird sie gewiss keinem anderen Mann geben, denn das wäre gegen das Gesetz des Mose; sonst würde er sich die Todesstrafe zuziehen.[a] Denn dir gebührt es mehr als jedem anderen Mann, das Erbe zu erhalten.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Griechisch wörtlich: „oder er wird Tod schulden“. Die Wendung bezeichnet, dass Raguel dem Tod beziehungsweise der Todesstrafe verfallen wäre; im Zusammenhang wäre die Vergabe an einen anderen Mann gegen das Gesetz des Mose.'
    reason: lexical_alternative
  - marker: b
    text: 'Der griechische Wortlaut ist ungewöhnlich knapp: „denn dir kommt es zu, das Erbe zu erhalten, als jeder Mann“. Gemeint ist dein Vorrang vor jedem anderen Mann.'
    reason: textual_ambiguity
lexical_decisions:
- source_word: ἄκουσόν μου
  choice: hör mir zu
  rationale: Der Imperativ fordert hier aufmerksames Zuhören. „Hör mir zu“ ist im heutigen Deutsch natürlich und gibt den persönlichen Appell wieder.
- source_word: λαλήσω τῷ πατρὶ αὐτῆς
  choice: Ich werde mit ihrem Vater reden
  rationale: Die Formulierung bleibt nahe am schlichten Sinn von λαλέω und legt den Gesprächsinhalt nicht zusätzlich fest.
- source_word: ὅταν ὑποστρέψωμεν ἐκ Ῥάγων
  choice: wenn wir aus Rages zurückkehren
  rationale: ὅταν mit Aorist Konjunktiv bezeichnet einen erwarteten zukünftigen Zeitpunkt; „zurückkehren“ gibt ὑποστρέφω idiomatisch wieder.
- source_word: ποιήσωμεν τὸν γάμον
  choice: werden wir die Hochzeit feiern
  rationale: Die wörtliche Wendung „die Hochzeit machen“ ist im Deutschen unnatürlich. Gemeint ist die Durchführung der Hochzeit; „feiern“ ist dafür die geläufige, nicht übermäßig deutende Formulierung.
- source_word: οὐ μὴ δῷ
  choice: keinesfalls … geben wird
  rationale: οὐ μή mit dem Konjunktiv ist eine nachdrückliche Verneinung. „Keinesfalls“ erhält diese Verstärkung.
- source_word: ἀνδρὶ ἑτέρῳ
  choice: einem anderen Mann
  rationale: ἀνήρ kann „Mann“ oder „Ehemann“ bedeuten. Da es um eine erst bevorstehende Eheschließung geht, bleibt „Mann“ näher am Wortlaut und ist kontextuell eindeutig.
- source_word: κατὰ τὸν νόμον Μωυσῆ
  choice: nach dem Gesetz des Mose
  rationale: Diese formal nahe Wiedergabe bewahrt die Stellung und mögliche syntaktische Spannung der griechischen Wendung. Im Zusammenhang mit der folgenden Todeshaftung bezeichnet sie das Gesetz als Grund dafür, dass Raguel Sara keinem anderen geben darf.
- source_word: ὀφειλέσει θάνατον
  choice: wird er sich des Todes schuldig machen
  rationale: Wörtlich steht „wird er Tod schulden“. Die gewählte deutsche Rechtswendung drückt die Haftung zum Tod verständlich aus, ohne eine konkrete Vollstreckungsart einzutragen.
- source_word: τὴν κληρονομίαν
  choice: das Erbe
  rationale: „Das Erbe“ entspricht κληρονομία und bewahrt das Fehlen eines ausdrücklichen Possessivpronomens.
- source_word: σοὶ καθήκει λαβεῖν
  choice: dir steht es … zu, … zu erhalten
  rationale: καθήκει kann das Gebührende, Angemessene oder Zustehende bezeichnen. „Dir steht es zu“ bringt den Vorrang beziehungsweise Anspruch zum Ausdruck, ohne ihn als moderne juristische Fachkategorie festzulegen.
- source_word: ἢ πάντα ἄνθρωπον
  choice: eher als jedem anderen Mann
  rationale: Der griechische Ausdruck lautet ungewöhnlich wörtlich „als jeder Mensch/Mann“. Im Zusammenhang bezeichnet er Tobias’ Vorrang vor allen anderen möglichen Männern.
theological_decisions:
- issue: Bindende Kraft des mosaischen Gesetzes für Raguels Entscheidung
  choice: Das Gesetz des Mose begründet, dass Raguel Sara keinem anderen Mann geben darf; andernfalls macht er sich des Todes schuldig.
  alternative: κατὰ τὸν νόμον Μωυσῆ könnte eng und rein formal mit „nach dem Gesetz des Mose“ an das Geben angeschlossen werden, ohne die Folgerelation ausdrücklich zu erläutern.
  rationale: Die emphatische Verneinung und der anschließende Satz über die Todesschuld zeigen, dass keine gesetzmäßige Vergabe an einen anderen gemeint ist. Die Übersetzung behält dennoch „nach dem Gesetz des Mose“ bei und vermeidet dadurch eine unnötig starke Glättung zu „entgegen dem Gesetz“.
- issue: Art von Tobias’ Anspruch auf das Erbe
  choice: Tobias hat gegenüber jedem anderen Mann den vorrangigen Anspruch, das Erbe zu erhalten.
  alternative: Die Aussage könnte nur als allgemeine Angemessenheit und nicht als rechtlicher Vorrang verstanden werden.
  rationale: καθήκει umfasst sowohl Angemessenheit als auch ein Zustehen. Der Vergleich mit allen anderen Männern verlangt zumindest einen Vorrang, während die Übersetzung dessen genaue rechtliche Ausgestaltung offenlässt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Nachdrückliche Verneinung und rechtliche Spannung bleiben erhalten; schwer verständliche griechische Idiome werden behutsam idiomatisch wiedergegeben. Alle Fußnotenmarker stehen an den jeweils erläuterten Aussagen.
