  to: 'Und nun hör mir zu: Ich werde mit ihrem Vater reden, und wenn wir aus Rages zurückkehren, werden wir die Hochzeit feiern. Denn ich weiß: Raguel wird sie gewiss keinem anderen Mann geben, denn das wäre gegen das Gesetz des Mose; sonst würde er sich die Todesstrafe zuziehen.[a] Denn dir gebührt es mehr als jedem anderen Mann, das Erbe zu erhalten.[b]'
