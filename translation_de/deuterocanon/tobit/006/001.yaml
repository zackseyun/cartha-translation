  register: Natürliches, modernes Standarddeutsch in schlichtem erzählerischem Ton. Die knappe Satzgestalt des griechischen Haupttextes bleibt erhalten; die abweichende längere Überlieferung wird in der Fußnote kenntlich gemacht.
