translation:
  language: de
  text: Und sie hörte auf zu weinen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hier zugrunde gelegte griechische Text ist sehr kurz: „Und sie hörte auf zu weinen.“ Eine längere, mit der semitischen Überlieferung verwandte Texttradition setzt diesen Vers mit dem Reisebericht fort („Der junge Mann zog seines Weges …“); dieser Wortlaut steht jedoch nicht im hier übersetzten griechischen Haupttext.'
    reason: textual_variant
lexical_decisions:
- source_word: καὶ
  choice: Und
  rationale: Die Konjunktion verbindet den kurzen Satz schlicht mit dem vorausgehenden Zusammenhang; „Und“ gibt diese Funktion transparent wieder.
- source_word: ἐπαύσατο
  choice: hörte auf
  rationale: Der Aorist Medium von παύω bezeichnet hier das Ende einer fortdauernden Handlung. „hörte auf“ ist im modernen Deutschen natürlich und inhaltlich genau.
- source_word: κλαίουσα
  choice: zu weinen
  rationale: Das Präsenspartizip von κλαίω bezeichnet ein andauerndes Weinen, das nun endet. Die deutsche Infinitivkonstruktion „aufhören zu weinen“ gibt den Sinn idiomatisch und würdig wieder.
theological_decisions: []
