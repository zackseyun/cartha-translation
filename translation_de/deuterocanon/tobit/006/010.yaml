lexical_decisions:
- source_word: Ὡς δὲ
  choice: Als … aber
  rationale: ὡς leitet hier einen temporalen Nebensatz ein; δέ markiert den Fortgang der Erzählung. „Als … aber“ bildet beides in natürlichem, würdigem Deutsch ab.
- source_word: προσήγγισαν
  choice: sie sich … näherten
  rationale: Der Aorist bezeichnet hier die Annäherung an einen Ort. „sich nähern“ ist im modernen Standarddeutsch präzise und idiomatisch.
- source_word: τῇ Ῥάγῃ
  choice: Rages
  rationale: Der Dativ bezeichnet bei dem Verb der Annäherung den Ort, dem sie sich näherten. Der Ortsname wird in der im Deutschen geläufigen biblischen Form „Rages“ wiedergegeben.
