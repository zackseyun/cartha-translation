base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/006/005.yaml
  text: And the angel said to him, “Cut open the fish, and after taking the heart and the liver and the gall, put them away safely.”
translation:
  language: de
  text: 'Und der Engel sagte zu ihm: »Schneide den Fisch auf, nimm das Herz, die Leber und die Galle[a] heraus und bewahre sie sicher auf.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort kann auch mit »Gallenflüssigkeit« wiedergegeben werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀνάτεμε
  choice: Schneide … auf
  rationale: Der Imperativ von ἀνατέμνω bezeichnet hier das Aufschneiden des Fisches, damit die genannten Organe entnommen werden können. Die Formulierung ist konkret und im modernen Deutschen natürlich.
- source_word: τὸν ἰχθύν
  choice: den Fisch
  rationale: Direktes Objekt mit Artikel; die schlichte Wiedergabe entspricht dem griechischen Text.
- source_word: λαβὼν
  choice: nimm … heraus
  rationale: Das Aoristpartizip bezeichnet die Entnahme vor dem sicheren Aufbewahren. Im Deutschen gibt eine koordinierte Imperativfolge den Handlungsablauf klar und natürlich wieder; »heraus« ist durch das Aufschneiden und die genannten Organe sachlich nahegelegt.
- source_word: τὴν καρδίαν
  choice: das Herz
  rationale: Entspricht der üblichen anatomischen Bedeutung.
- source_word: τὸ ἧπαρ
  choice: die Leber
  rationale: Entspricht der üblichen anatomischen Bedeutung.
- source_word: τὴν χολὴν
  choice: die Galle
  rationale: χολή kann die Galle beziehungsweise Gallenflüssigkeit bezeichnen. »Galle« ist die knappe, traditionelle und im Deutschen verständliche Wiedergabe, ohne den Text auf die Gallenblase festzulegen.
- source_word: θὲς ἀσφαλῶς
  choice: bewahre sie sicher auf
  rationale: θὲς bedeutet wörtlich »lege/stelle«, während ἀσφαλῶς Sicherheit beziehungsweise zuverlässige Verwahrung ausdrückt. Zusammen ist »bewahre sie sicher auf« im Kontext idiomatisch und macht ihre Aufbewahrung für den späteren Gebrauch deutlich.
theological_decisions:
- issue: Bezeichnung des Sprechers als ὁ ἄγγελος
  choice: der Engel
  alternative: der Bote
  rationale: Obwohl ἄγγελος allgemein »Bote« bedeuten kann, ist die Gestalt innerhalb der Tobiterzählung als himmlischer Engel ausgewiesen. »Engel« entspricht daher dem erzählerischen Sinn, ohne zusätzliche dogmatische Aussagen einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede bleibt knapp und handlungsorientiert. Die imperativische Reihung bildet den natürlichen Ablauf ab; die Fußnote wahrt die Bedeutungsbreite von χολή.
