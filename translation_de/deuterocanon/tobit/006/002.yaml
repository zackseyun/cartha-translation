base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/006/002.yaml
  text: As they were traveling on the road[a], they came by evening to the Tigris River, and they camped there.
translation:
  language: de
  text: Als sie unterwegs waren[a], kamen sie am Abend an den Tigris und schlugen dort ihr Nachtlager auf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der griechische Kurztext sagt hier lediglich, dass sie am Abend den Tigris erreichten und dort ihr Nachtlager aufschlugen. Die längere semitische Überlieferung und die griechische Langfassung erweitern die Szene an dieser Stelle um die anschließend erzählte Begebenheit mit dem Fisch.
    reason: textual_variant
lexical_decisions:
- source_word: πορευόμενοι τὴν ὁδὸν
  choice: als sie unterwegs waren
  rationale: Die Wendung bezeichnet ihre fortdauernde Reise. »Unterwegs sein« ist im modernen Deutsch natürlich und gibt den durativen Sinn des Partizips wieder, ohne die im Deutschen schwerfällige Formulierung »den Weg ziehen« nachzuahmen.
- source_word: ἦλθον ἑσπέρας
  choice: kamen sie gegen Abend
  rationale: Der Ausdruck bezeichnet die Ankunft zur Abendzeit. »Gegen Abend« ist idiomatisch und lässt offen, ob der Abend bereits vollständig angebrochen war.
- source_word: ἐπὶ τὸν Τίγριν ποταμόν
  choice: an den Tigris
  rationale: ἐπί mit Bewegung bezeichnet hier das Erreichen des Flusses. Im Deutschen genügt beim bekannten Flussnamen »der Tigris«; »an den Tigris« gibt das Ziel natürlich wieder.
- source_word: ηὐλίζοντο
  choice: schlugen dort ihr Nachtlager auf
  rationale: Das Verb bezeichnet das Lagern beziehungsweise Übernachten auf einer Reise. Die gewählte Formulierung bewahrt den Bezug zur Nacht und passt zur Rast am Fluss, ohne eine feste Unterkunft vorauszusetzen.
- source_word: ἐκεῖ
  choice: dort
  rationale: Direkte und natürliche Wiedergabe des lokalen Adverbs.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. »Nachtlager aufschlagen« verdeutlicht die Reise- und Übernachtungssituation, ohne unnötig archaisch zu wirken.
