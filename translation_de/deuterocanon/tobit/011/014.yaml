base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/011/014.yaml
  text: And she wept and said[a], “Blessed are you, O God, and blessed is your name forever, and blessed are all your holy angels,”
translation:
  language: de
  text: 'Und sie weinte und sagte: »Gepriesen bist du, Gott, und gepriesen ist dein Name in Ewigkeit[a], und gepriesen sind alle deine heiligen Engel.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Griechisch wörtlich: »in die Zeitalter«; die Wendung bedeutet »in Ewigkeit«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔκλαυσεν
  choice: Da weinte sie
  rationale: Das Verb bedeutet »weinen«. Seine Form bezeichnet kein grammatisches Geschlecht; aus dem Erzählzusammenhang ergibt sich jedoch Anna als handelnde Person. »Da« bindet den Satz natürlich an das vorherige Geschehen an.
- source_word: Εὐλογητὸς εἶ ὁ θεός
  choice: Gepriesen bist du, Gott
  rationale: »Gepriesen« gibt die biblische Segens- und Lobpreisformel im Deutschen natürlich und würdig wieder. Der Vokativ »Gott« macht die direkte Anrede deutlich, ohne das im heutigen Deutsch altertümlich wirkende »o« einzufügen.
- source_word: τὸ ὄνομά σου
  choice: dein Name
  rationale: Die feste biblische Wendung bleibt ohne erklärende Erweiterung erhalten.
- source_word: εἰς τοὺς αἰῶνας
  choice: in Ewigkeit
  rationale: Die griechische Zeitformel bezeichnet unbegrenzte Dauer. »In Ewigkeit« ist eine natürliche, würdevolle deutsche Entsprechung und bewahrt den biblischen Klang.
- source_word: εὐλογημένοι πάντες οἱ ἅγιοι ἄγγελοί σου
  choice: gepriesen sind alle deine heiligen Engel
  rationale: Die Formulierung setzt die Aussageform der vorangehenden Lobpreisungen fort. ἅγιοι bestimmt unmittelbar ἄγγελοι und ist daher als »heilige Engel« wiederzugeben.
theological_decisions:
- issue: An Gott gerichtete Lobpreisformel
  choice: Gepriesen bist du, Gott
  alternative: Gelobt bist du, Gott / Gesegnet bist du, Gott
  rationale: Die wiederholten Formen aus dem Wortstamm εὐλογητ- werden einheitlich als Lobpreisung wiedergegeben. »Gepriesen« wahrt sowohl die liturgische Würde als auch die Aussageform des Griechischen, ohne die Wendung in einen Wunsch umzudeuten.
- issue: Aussage oder Wunsch bezüglich der Engel
  choice: gepriesen sind alle deine heiligen Engel
  alternative: gepriesen seien alle deine heiligen Engel
  rationale: Das griechische Adjektiv führt am ehesten die vorherige deklarative Satzstruktur fort. Die mögliche deutsche Wunschform wird daher nicht in den Text eingetragen.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdevollem Gebetston. Die dreifache Wiederholung von »gepriesen« bildet die griechische Struktur und den liturgischen Rhythmus nach. Das Fußnotenzeichen steht unmittelbar bei der erläuterten Zeitangabe.
