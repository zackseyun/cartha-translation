  text: Take courage[a], father. Then, when they had come together, he rubbed his eyes[b],
translation:
  language: de
  text: »Fass Mut, Vater![a]« Als sie dann zusammengekommen waren[b], rieb er ihm die Augen,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: »Sei guten Mutes, Vater!«'
