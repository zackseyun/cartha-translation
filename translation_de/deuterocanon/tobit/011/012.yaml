    text: 'Der griechische Satz sagt: »als sie zusammengekommen waren«; gemeint sein kann ihre Begegnung oder ihr Wiedersehen.'
    reason: alternative_reading
lexical_decisions:
- source_word: Θάρσει
  choice: Fass Mut
  rationale: Der Imperativ von θαρσέω spricht Ermutigung und Zuversicht zu. »Fass Mut« ist im heutigen Deutsch natürlich und bewahrt die Aufforderung des Griechischen.
- source_word: πάτερ
  choice: Vater
  rationale: Die direkte Anrede steht im Griechischen ohne Possessivpronomen; deshalb wird kein »mein« ergänzt.
- source_word: ὡς δὲ
  choice: Als … dann
  rationale: Die Verbindung leitet den nächsten Vorgang temporal ein. Die deutsche Wortstellung verteilt die beiden Elemente idiomatisch auf den Nebensatz.
- source_word: συνεδήχθησαν
  choice: sie zusammengekommen waren
  rationale: Gemäß dem überlieferten und geprüften Verständnis bezeichnet das Verb hier ihr Zusammenkommen beziehungsweise ihre Begegnung. Die Formulierung lässt die genaue Art dieses Zusammentreffens offen.
- source_word: διέτριψε
  choice: rieb
  rationale: Das Verb bezeichnet ein Reiben. Die Übersetzung vermeidet es, eine über diesen Satzteil hinausgehende medizinische Handlung einzutragen.
- source_word: τοὺς ὀφθαλμοὺς αὐτοῦ
  choice: ihm die Augen
  rationale: Die im Deutschen übliche Konstruktion mit Dativ bezeichnet die Augen des Vaters und vermeidet die mögliche Fehlauffassung von »seine Augen« als die Augen des handelnden Sohnes.
