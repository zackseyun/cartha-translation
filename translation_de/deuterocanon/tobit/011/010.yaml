  naturalness: „Nun kann ich sterben“ ist die natürliche moderne deutsche Entsprechung für diese emotionale Wendung. „ging hinaus zur Tür“ macht die Bewegungsrichtung verständlich, ohne die Präposition als Weg durch die Tür zu überbestimmen.
