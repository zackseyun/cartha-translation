base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/011/010.yaml
  text: “From now on I can die.” And both of them wept. Then Tobit went out toward the door and stumbled[a], but his son ran to him,
translation:
  language: de
  text: „Nun kann ich sterben.“[a] Und beide weinten. Dann ging Tobit hinaus zur Tür und stolperte; sein Sohn aber lief zu ihm,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Von nun an werde ich sterben.“ Die Aussage drückt aus, dass ihre Sehnsucht erfüllt ist und sie nun bereit ist, in Frieden zu sterben.'
    reason: Die idiomatische Wiedergabe im Haupttext gibt den Sinn der emotionalen Zukunftsaussage wieder; die Fußnote nennt die formnähere Alternative.
lexical_decisions:
- source_word: ἀπὸ τοῦ νῦν
  choice: Von jetzt an
  rationale: Die zeitliche Wendung bezeichnet den Beginn eines neuen Zustands ab dem gegenwärtigen Augenblick und wird im Deutschen natürlich mit „von jetzt an“ wiedergegeben.
- source_word: ἀποθανοῦμαι
  choice: kann ich sterben
  rationale: Die griechische Futurform lautet wörtlich „werde ich sterben“. Im Zusammenhang der erfüllten Sehnsucht drückt die Aussage jedoch die Bereitschaft aus, nun in Frieden zu sterben; „kann ich sterben“ bewahrt diesen idiomatischen Sinn, während die wörtliche Form in einer Fußnote genannt wird.
- source_word: ἔκλαυσαν ἀμφότεροι
  choice: beide weinten
  rationale: Die knappe Formulierung gibt sowohl das gemeinsame Weinen als auch die erzählerische Schlichtheit des Griechischen wieder.
- source_word: ἐξήρχετο πρὸς τὴν θύραν
  choice: ging Tobit zur Tür hinaus
  rationale: Das Imperfekt schildert Tobits Bewegung nach draußen; „zur Tür hinausgehen“ ist eine natürliche deutsche Entsprechung und erhält die Richtung auf die Tür zu.
- source_word: προσεκόπτεν
  choice: stolperte
  rationale: προσκόπτω bezeichnet das Anstoßen beziehungsweise Stolpern; die knappe Wiedergabe passt zu Tobits eingeschränktem Sehvermögen im Kontext.
- source_word: προσέδραμεν αὐτῷ
  choice: lief zu ihm
  rationale: Die Aoristform bezeichnet eine rasche Bewegung auf Tobit zu. „Lief zu ihm“ gibt dies direkt und ohne zusätzliche Deutung wieder.
theological_decisions:
- issue: Emotionale Bedeutung von ἀποθανοῦμαι
  choice: „kann ich sterben“ als Ausdruck erfüllter Sehnsucht
  alternative: „werde ich sterben“
  rationale: Der Kontext einer freudigen Wiederbegegnung spricht gegen eine bloße Vorhersage des Todes. Die Übersetzung gibt den idiomatischen Sinn im Haupttext wieder, ohne die formale Zukunftsbedeutung zu verschweigen.
- issue: Subjektfolge der Erzählung
  choice: Tobit geht hinaus und stolpert; sein Sohn läuft zu ihm
  alternative: Abweichende Abläufe in längeren Textüberlieferungen
  rationale: Die Übersetzung folgt dem vorgelegten griechischen Text der Swete-Ausgabe und gleicht ihn nicht an abweichende Rezensionen an.
translation_notes:
  register: Moderne, klare und zugleich würdevolle Erzählsprache. Die Partikel „aber“ in „sein Sohn aber“ bewahrt den leichten Kontrast des griechischen ὁ δέ. Der Fußnotenmarker steht unmittelbar bei der erklärten Aussage.
