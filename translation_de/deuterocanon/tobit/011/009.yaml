  source_fidelity: 'Die Übersetzung gibt die Abfolge und die Kernaussagen des griechischen Textes zuverlässig wieder: Annas Herbeilaufen, die stürmische Umarmung ihres Sohnes und ihre emotionale Aussage. »Fiel ihrem Sohn um den Hals« ist eine treffende deutsche idiomatische Entsprechung von ἐπέπεσεν ἐπὶ τὸν τράχηλον. »Ich habe dich gesehen« bewahrt den vollzogenen Charakter von Εἶδόν σε.'
  naturalness: Modernes, flüssiges Standarddeutsch mit angemessen erzählerisch-würdigem Ton. »Da lief Anna auf ihn zu« und »fiel ihrem Sohn um den Hals« sind natürlich und anschaulich. Die Anrede »mein Kind« ist im Deutschen bei einer zärtlichen mütterlichen Anrede idiomatisch und vermittelt die im Diminutiv παιδίον liegende Zuneigung, ohne den Sinn unangemessen zu erweitern.
  terminology: »Sohn« gibt υἱός präzise wieder. »Mein Kind« ist als Anrede für παιδίον kontextgerecht; es macht keine Aussage über Alter oder Geschlecht jenseits des bereits genannten Sohnes. Es liegen keine theologischen Schlüsselbegriffe oder namensbezogenen Probleme vor.
