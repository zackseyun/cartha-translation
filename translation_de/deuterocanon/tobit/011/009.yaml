  yaml_path: translation/deuterocanon/tobit/011/009.yaml
  text: And Anna ran up and fell on the neck of her son[a], and said to him, “I have seen you, child.”
translation:
  language: de
  text: 'Da lief Anna auf ihn zu, fiel ihrem Sohn um den Hals[a] und sagte zu ihm: »Ich habe dich gesehen, mein Kind.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »fiel auf den Hals ihres Sohnes«; gemeint ist eine gefühlvolle Umarmung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσδραμοῦσα
  choice: lief ... auf ihn zu
  rationale: Das Partizip bezeichnet ein Heranlaufen. Die deutsche Wendung gibt Bewegung und Ziel natürlich und anschaulich wieder; das Objekt ergibt sich aus dem Zusammenhang.
- source_word: ἐπέπεσεν ἐπὶ τὸν τράχηλον τοῦ υἱοῦ αὐτῆς
  choice: fiel ihrem Sohn um den Hals
  rationale: 'Die feste deutsche Wendung bewahrt sowohl das Bild des griechischen Ausdrucks als auch dessen Sinn: eine stürmische, gefühlvolle Umarmung.'
- source_word: τοῦ υἱοῦ αὐτῆς
  choice: ihrem Sohn
  rationale: υἱός bezeichnet ausdrücklich den Sohn. Der Dativ ist durch die natürliche deutsche Redewendung »jemandem um den Hals fallen« bedingt.
- source_word: Εἶδόν σε
  choice: Ich habe dich gesehen
  rationale: Das Perfekt gibt den griechischen Aorist als vollendetes Wiedersehen mit gegenwärtiger Gefühlswirkung wieder, ohne ihn deutend zu »wiedergefunden« zu erweitern.
- source_word: παιδίον
  choice: mein Kind
  rationale: παιδίον ist hier eine zärtliche mütterliche Anrede. Im natürlichen Deutschen verlangt die direkte Anrede in diesem Zusammenhang gewöhnlich den possessiven Ausdruck »mein Kind«, auch wenn das Possessivpronomen im Griechischen nicht ausdrücklich steht.
