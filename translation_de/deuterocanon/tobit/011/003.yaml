base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/011/003.yaml
  text: Let us run on ahead of your wife and prepare the house[a].
translation:
  language: de
  text: Lasst uns deiner Frau vorauslaufen und das Haus vorbereiten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich nach dem Griechischen: „deiner Frau“. Aufgrund des weiteren Erzählzusammenhangs könnte man hier die Erwähnung eines anderen Familienmitglieds erwarten; der vorliegende griechische Text lautet jedoch „deiner Frau“.'
    reason: alternative_reading
lexical_decisions:
- source_word: προδράμωμεν
  choice: Lasst uns … vorauslaufen
  rationale: Der Aorist Konjunktiv ist hier auffordernd gebraucht. „Vorauslaufen“ bewahrt sowohl die lebhafte Bewegung als auch den Gedanken, vor jemandem einzutreffen.
- source_word: ἔμπροσθεν
  choice: voraus-
  rationale: Das Adverb bezeichnet in Verbindung mit dem Bewegungsverb das Vorangehen; im Deutschen wird dies natürlich durch das Verbpräfix in „vorauslaufen“ ausgedrückt.
- source_word: τῆς γυναικός σου
  choice: deiner Frau
  rationale: γυνή bezeichnet mit dem Possessivpronomen in diesem Beziehungskontext die Ehefrau. Die ungewöhnliche Aussage des überlieferten griechischen Textes wird nicht stillschweigend korrigiert.
- source_word: ἑτοιμάσωμεν
  choice: vorbereiten
  rationale: Auch dieser Konjunktiv ist auffordernd und parallel zum ersten Verb. „Vorbereiten“ ist klar, natürlich und dem würdigen Erzählton angemessen.
- source_word: τὴν οἰκίαν
  choice: das Haus
  rationale: οἰκία kann Haus oder Hausgemeinschaft bedeuten. Da hier vor der Ankunft etwas bereitgemacht werden soll, liegt das Gebäude als konkrete Bedeutung näher.
