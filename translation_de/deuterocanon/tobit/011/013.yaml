lexical_decisions:
- source_word: ἐλεπίσθη
  choice: lösten sich
  rationale: Das Verb bezeichnet ein Abschälen oder Ablösen. „Lösten sich“ gibt den Vorgang natürlich wieder, während die Vorstellung einer dünnen, sich ablösenden Schicht durch „Häutchen“ erhalten bleibt.
- source_word: κανθῶν τῶν ὀφθαλμῶν
  choice: Augenwinkeln
  rationale: κάνθος bezeichnet im anatomischen Zusammenhang den Augenwinkel; das deutsche Kompositum ist präzise und idiomatisch.
- source_word: λευκώματα
  choice: weißen Häutchen
  rationale: Gemeint sind weißliche Trübungen oder Schichten an den Augen. „Häutchen“ passt zum durch ἐλεπίσθη ausgedrückten Ablösen und ist für heutige Leser anschaulicher als das klinische „Trübungen“.
- source_word: ἰδών
  choice: Als er … sah
  rationale: Das Partizip wird im Satzzusammenhang natürlich als temporaler Nebensatz wiedergegeben.
- source_word: ἐπέπεσεν ἐπὶ τὸν τράχηλον αὐτοῦ
  choice: fiel er ihm um den Hals
  rationale: Die deutsche feste Wendung bewahrt sowohl das Bild des griechischen Ausdrucks als auch dessen Sinn einer ergriffenen Umarmung.
