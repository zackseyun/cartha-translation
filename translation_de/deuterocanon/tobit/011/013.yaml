translation:
  language: de
  text: Da schälten sich die weißen Beläge von seinen Augenwinkeln ab. Als er seinen Sohn sah, fiel er ihm um den Hals,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „fiel er auf seinen Hals“; gemeint ist eine innige Umarmung.'
