  to: Denn du hast mich geschlagen und dich meiner erbarmt. Sieh[a], ich sehe meinen Sohn Tobias! Und sein Sohn kam voller Freude herein und berichtete seinem Vater von den großen Dingen, die ihm in Medien widerfahren waren.
