lexical_decisions:
- source_word: ἐμαστίγωσας
  choice: du hast mich geschlagen
  rationale: Das Verb μαστιγόω bezeichnet wörtlich ein Schlagen oder Geißeln und kann übertragen schwere Züchtigung oder Heimsuchung ausdrücken. „Geschlagen“ bewahrt die direkte Zuschreibung an Gott, ohne zwingend eine buchstäbliche Geißelung vorauszusetzen.
- source_word: ἠλέησάς με
  choice: dich meiner erbarmt
  rationale: Eine natürliche, würdevolle Wiedergabe von ἐλεέω, die den scharfen Gegensatz zum vorausgehenden Schlagen erhält.
- source_word: ἰδοὺ
  choice: Sieh
  rationale: Die aufmerksamkeitslenkende Partikel wird in modernem, aber gehobenem Deutsch lebendig wiedergegeben.
- source_word: βλέπω
  choice: ich sehe
  rationale: Die schlichte Wiedergabe bewahrt sowohl die wiedererlangte Sehkraft als auch den unmittelbar gesehenen Sohn.
- source_word: χαίρων
  choice: voller Freude
  rationale: Gibt den begleitenden emotionalen Zustand des Partizips natürlich wieder.
- source_word: ἀπήγγειλεν
  choice: berichtete
  rationale: Das Verb bezeichnet das Überbringen eines Berichts und passt zum folgenden Inhalt.
- source_word: τὰ μεγάλα
  choice: all dem Großen
  rationale: Bewahrt die offene Bedeutung bemerkenswerter oder großer Geschehnisse, ohne sie ausdrücklich als Taten Gottes zu bestimmen.
- source_word: τὰ γενόμενα αὐτῷ
  choice: das ihm widerfahren war
  rationale: Natürliche deutsche Wiedergabe der auf Tobias bezogenen Ereignisse; das Plusquamperfekt markiert ihre Vorzeitigkeit.
- source_word: ἐν τῇ Μηδείᾳ
  choice: in Medien
  rationale: „Medien“ ist die etablierte deutsche Bezeichnung der antiken Landschaft Media.
theological_decisions:
- issue: Göttliches Handeln in Leiden und Erbarmen
  choice: „du hast mich geschlagen und dich meiner erbarmt“
  alternative: „du hast mich heimgesucht und dich meiner erbarmt“
  rationale: Der griechische Text schreibt Gott sowohl das schmerzhafte Handeln als auch das Erbarmen direkt zu. Diese Spannung wird nicht abgeschwächt oder aufgelöst.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Sieh“ erhält den Ausrufcharakter, während „voller Freude“ und „widerfahren war“ einen flüssigen Erzählstil schaffen. Der Name Τωβείαν wird entsprechend der üblichen deutschen Form als „Tobias“ wiedergegeben.
