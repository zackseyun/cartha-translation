  text: because you afflicted me and had mercy on me. Behold[a], I see Tobiah my son. And his son entered rejoicing, and reported to his father the great things that had happened to him in Media.
translation:
  language: de
  text: Denn du hast mich geschlagen und dich meiner erbarmt. Sieh[a], ich sehe meinen Sohn Tobias! Und sein Sohn kam voller Freude herein und berichtete seinem Vater von den großen Dingen, die ihm in Medien widerfahren waren.
