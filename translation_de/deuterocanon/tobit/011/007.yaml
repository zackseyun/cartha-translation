translation:
  language: de
  text: 'Und Rafael sagte: »Ich weiß, dass dein Vater wieder sehen können wird.[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »dass dein Vater seine Augen öffnen wird«. Die griechische Wendung bezeichnet hier die Wiederherstellung des Sehvermögens.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐπίσταμαι
  choice: Ich weiß
  rationale: Das Verb bezeichnet sicheres Wissen; »ich weiß« gibt Rafaels zuversichtliche Aussage direkt und natürlich wieder.
- source_word: ἀνοίξει
  choice: wird öffnen
  rationale: Der griechische aktive Futur steht ausdrücklich mit dem Vater als Subjekt. Die Übersetzung bewahrt diese Form, statt sie passiv wiederzugeben oder die Heilung bereits auszudeuten.
- source_word: τοὺς ὀφθαλμούς
  choice: seine Augen
  rationale: Im Griechischen steht wörtlich »die Augen«; im Deutschen ist bei Körperteilen hier das Possessivpronomen idiomatisch und macht den Bezug eindeutig.
- source_word: ὁ πατήρ σου
  choice: dein Vater
  rationale: Dies ist die direkte und natürliche Wiedergabe der eindeutigen griechischen Wortgruppe.
- source_word: Ῥαφαήλ
  choice: Rafael
  rationale: »Rafael« ist die im Deutschen etablierte Schreibweise des Namens.
theological_decisions:
- issue: Redewendung für die Heilung von Blindheit
  choice: Die aktive Formulierung »dein Vater seine Augen öffnen wird« im Haupttext bewahren
  alternative: dein Vater wird wieder sehen können; deinem Vater werden die Augen geöffnet werden
  rationale: Der griechische Text formuliert aktiv und spricht wörtlich vom Öffnen der Augen. Im Zusammenhang bezeichnet dies die Wiederherstellung des Sehvermögens; die wörtliche Bildsprache bewahrt jedoch die Erzählwirkung und vermeidet eine stillschweigende Ausdeutung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die etwas auffällige aktive Wendung ist bewusst beibehalten, weil sie der griechischen Satzform entspricht; die Fußnote erläutert ihre Bedeutung im Zusammenhang.
