base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/011/001.yaml
  text: After these things[a], Tobiah also went on his way, blessing God because he had made his journey successful, and he kept blessing Raguel and Edna his wife[b]. And he went on until they came near to Nineveh.
translation:
  language: de
  text: Danach zog Tobias weiter und pries Gott, weil er seine Reise hatte gelingen lassen,[a] und segnete immer wieder Raguel und dessen Frau Edna. Und er zog weiter, bis sie sich Ninive näherten.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „weil er seinen Weg gelingen ließ“; gemeint ist, dass Gott seine Reise gelingen ließ.'
    reason: lexical_alternative
  - marker: b
    text: 'Der letzte Satzteil ist im Griechischen syntaktisch schwierig. Wahrscheinlich ist gemeint: „bis sie sich Ninive näherten“; möglich ist auch: „bis er sich Ninive näherte“.'
    reason: textual_variant
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: Danach
  rationale: Gibt den zeitlichen Übergang und den Rückbezug des griechischen Plurals in natürlichem modernem Deutsch wieder.
- source_word: ἐπορεύετο
  choice: zog … weiter
  rationale: Das Imperfekt bezeichnet eine fortdauernde Reisebewegung; „zog weiter“ ist idiomatisch und wahrt den erzählerischen Ton.
- source_word: εὐλογῶν τὸν θεόν
  choice: Er pries Gott
  rationale: Beim Segnen Gottes hat εὐλογέω im Deutschen idiomatisch den Sinn „preisen“; „Gott segnen“ wäre zwar formnäher, für viele heutige Leser aber missverständlich.
- source_word: ὅτι εὐώδωσεν τὴν ὁδὸν αὐτοῦ
  choice: weil er seiner Reise Erfolg geschenkt hatte
  rationale: Gibt die bildhafte Wendung vom Gelingenlassen des Weges verständlich wieder und bewahrt Gott als Handelnden.
- source_word: κατευλόγει
  choice: segnete immer wieder
  rationale: Das Imperfekt und die verstärkte Verbform legen wiederholtes oder anhaltendes Segnen nahe.
- source_word: Ῥαγουὴλ καὶ Ἔδναν τὴν γυναῖκα αὐτοῦ
  choice: Reguël und dessen Frau Edna
  rationale: Macht eindeutig, dass Edna die Frau Reguëls ist, und formuliert die Apposition natürlich auf Deutsch.
- source_word: μέχρις οὗ ἤγγισαν αὐτὸν εἰς Νινευή
  choice: bis sie sich Ninive näherten
  rationale: Folgt dem pluralischen ἤγγισαν und dem im Kontext wahrscheinlichen Reisesinn, ohne das syntaktisch schwierige αὐτόν unnatürlich nachzubilden.
theological_decisions:
- issue: Wiedergabe von θεός
  choice: Gott
  alternative: der Gott
  rationale: Im erzählerischen Kontext ist dies die normale Bezeichnung für Israels Gott; ein Artikel oder besonderer Titel ist im Deutschen nicht erforderlich.
- issue: Subjektwechsel in der Schlussklausel
  choice: So zog er weiter, bis sie sich Ninive näherten.
  alternative: So zog er weiter, bis er sich Ninive näherte.
  rationale: Der erste Satzteil hat ein singularisches Verb, die Annäherungsklausel dagegen ein pluralisches. Die Übersetzung bewahrt diese Spannung und erläutert die schwierige Überlieferung in einer Fußnote.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit gut verständlichem Erzählfluss. „Pries Gott“ vermeidet die im heutigen Deutschen missverständliche Formulierung „segnete Gott“, während „segnete immer wieder“ bei Reguël und Edna die unterschiedliche Zielrichtung und den fortdauernden Aspekt wahrt. Die Schreibweisen Tobija, Reguël und Ninive folgen geläufigen deutschen Bibelnamen.
