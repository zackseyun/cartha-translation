base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/011/017.yaml
  text: And Tobit gave thanks before them that God had shown them mercy. And when Tobit came near to Sarah his daughter-in-law[a], he blessed her, saying, “May you come in good health, daughter. Blessed is God, who has brought you to us, and your father and your mother.”
translation:
  language: de
  text: 'Und Tobit dankte vor ihnen dafür, dass Gott ihnen Erbarmen erwiesen hatte. Als Tobit sich Sara, seiner Schwiegertochter, näherte, segnete er sie und sagte: »Mögest du gesund ankommen, Tochter! Gepriesen sei Gott, der dich zu uns geführt hat, und dein Vater und deine Mutter.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Text endet unvermittelt mit »und dein Vater und deine Mutter«. Möglicherweise ist sinngemäß zu ergänzen: »und gepriesen seien dein Vater und deine Mutter«; ein entsprechendes Verb steht in diesem Textzeugen jedoch nicht.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐξωμολογεῖτο
  choice: dankte
  rationale: Im Zusammenhang mit Gottes Erbarmen bezeichnet das Verb ein öffentliches dankbares Bekenntnis beziehungsweise Lob, nicht ein Sündenbekenntnis.
- source_word: ἠλέησεν
  choice: Erbarmen erwiesen hatte
  rationale: Bewahrt das theologische Gewicht von ἐλεέω und gibt den griechischen Aorist im deutschen Rückblick natürlich wieder.
- source_word: καὶ ὡς ἤγγισεν
  choice: Als ... sich ... näherte
  rationale: ὡς hat hier am natürlichsten temporalen Sinn; die Annäherung bildet den Anlass für den Segen.
- source_word: τῇ νύμφῃ αὐτοῦ
  choice: seiner Schwiegertochter
  rationale: νύμφη kann Braut oder Schwiegertochter bedeuten; aus Tobits Perspektive ist Sara die Frau seines Sohnes und damit seine Schwiegertochter.
- source_word: κατευλόγησεν
  choice: segnete
  rationale: Das einfache deutsche Verb gibt die Handlung würdig und ohne unnötige Überzeichnung wieder.
- source_word: Ἔλθοις ὑγιαίνουσα
  choice: Mögest du gesund ankommen
  rationale: Der Optativ drückt einen Wunsch oder Segensgruß aus; »ankommen« bewahrt die Bewegungsrichtung und ist in dieser Empfangsszene natürlich.
- source_word: θύγατερ
  choice: Tochter
  rationale: Gibt die herzliche familiäre Anrede wieder, ohne ein im Griechischen nicht ausdrücklich vorhandenes Possessivpronomen hinzuzufügen.
- source_word: εὐλογητὸς ὁ θεός
  choice: Gepriesen sei Gott
  rationale: Natürliche und würdige deutsche Wiedergabe der feststehenden Segensformel.
- source_word: ὃς ἤγαγέν σε πρὸς ἡμᾶς
  choice: der dich zu uns geführt hat
  rationale: Das Perfekt bezeichnet im Deutschen passend die vollendete Handlung mit gegenwärtigem Ergebnis.
- source_word: καὶ ὁ πατήρ σου καὶ ἡ μήτηρ σου
  choice: und dein Vater und deine Mutter
  rationale: Die unvermittelte Schlusswendung wird wie überliefert bewahrt; ein ausgelassenes Prädikat wird nicht stillschweigend ergänzt.
theological_decisions:
- issue: Bedeutung von ἐξωμολογεῖτο in Bezug auf Gott
  choice: öffentliches Danken
  alternative: bekennen oder öffentlich preisen
  rationale: Der ὅτι-Satz nennt Gottes Erbarmen als Inhalt; daher geht es um dankbare Anerkennung göttlichen Handelns, nicht um das Eingestehen von Schuld.
- issue: Abgebrochene Schlusswendung »und dein Vater und deine Mutter«
  choice: wörtlich und syntaktisch unvermittelt im Haupttext bewahrt
  alternative: 'elliptisch ergänzt: »und gepriesen seien dein Vater und deine Mutter«'
  rationale: Der griechische Zeuge enthält kein wiederholtes Verb. Die Übersetzung bewahrt deshalb die Spannung des Wortlauts und erläutert die mögliche Ellipse nur in der Fußnote.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem Erzählton. Der Segenswunsch wird durch »Mögest du« als Optativ kenntlich gemacht; die ungewöhnliche Syntax am Versende bleibt bewusst erhalten.
