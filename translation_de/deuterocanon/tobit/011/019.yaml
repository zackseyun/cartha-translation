  language: de
  text: Und die Hochzeit Tobijas wurde sieben Tage lang mit Freude gefeiert.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤχθη
  choice: wurde … gefeiert
  rationale: Der Aorist Passiv von ἄγω bezeichnet hier idiomatisch das Abhalten oder Feiern eines Festes; die passive Form bleibt im Deutschen erhalten.
- source_word: ὁ γάμος
  choice: die Hochzeit
  rationale: Im Zusammenhang mit Freude und einer Dauer von sieben Tagen bezeichnet γάμος die Hochzeitsfeier, nicht nur den abstrakten Ehestand.
- source_word: Τωβεία
  choice: Tobits
  rationale: Der Genitiv bezeichnet die Zugehörigkeit der Hochzeit. „Tobit“ gibt die griechische Namensform Τωβείας in einer im Deutschen geläufigen Form wieder.
- source_word: μετʼ εὐφροσύνης
  choice: mit großer Freude
  rationale: Die Wendung bezeichnet die festliche Freude, mit der die Hochzeit begangen wurde; „großer“ macht den positiven Intensitätsgehalt von εὐφροσύνη natürlich verständlich.
- source_word: ἑπτὰ ἡμέρας
  choice: sieben Tage lang
  rationale: Der Akkusativ drückt die Zeitdauer aus; „lang“ kennzeichnet diese Funktion im Deutschen eindeutig.
