base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/011/004.yaml
  text: But take the fish’s gall in your hand. And they went on, and the dog came along behind them.
translation:
  language: de
  text: Nimm aber die Galle des Fisches[a] zur Hand. Dann zogen sie weiter, und der Hund kam hinter ihnen her.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Gallenflüssigkeit des Fisches“. Das griechische Wort χολή kann Galle oder Gallenflüssigkeit bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Die parallele semitisch geprägte Textüberlieferung schildert diese Szene wesentlich ausführlicher und berichtet vor allem, wie Tobias die Galle des Fisches auf die Augen seines Vaters aufträgt. Im Haupttext wird hier der kürzere griechische Wortlaut wiedergegeben.
    reason: alternative_reading
lexical_decisions:
- source_word: λάβε
  choice: nimm
  rationale: Der Aoristimperativ von λαμβάνω bezeichnet hier eine unmittelbare praktische Aufforderung; „nimm“ ist im Deutschen direkt und natürlich.
- source_word: παρὰ χεῖρα
  choice: zur Hand
  rationale: Die Wendung bezeichnet hier, dass die Substanz griffbereit genommen beziehungsweise gehalten werden soll. „Zur Hand“ gibt den praktischen Sinn idiomatisch wieder, ohne ein Führen an der Hand nahezulegen.
- source_word: χολὴν τοῦ ἰχθύος
  choice: die Galle des Fisches
  rationale: χολή kann sowohl die Galle als Organ beziehungsweise Substanz als auch die Gallenflüssigkeit bezeichnen. „Galle“ ist knapp, traditionell und im Erzählzusammenhang verständlich; die mögliche Wiedergabe „Gallenflüssigkeit“ wird in der Fußnote genannt.
- source_word: ἐπορεύθησαν
  choice: sie zogen weiter
  rationale: Das Verb bezeichnet die Fortsetzung ihres Weges. „Zogen weiter“ ist eine natürliche deutsche Erzählform und macht die fortgesetzte Reise deutlich.
- source_word: συνῆλθεν
  choice: kam ... her
  rationale: συνέρχομαι bezeichnet ein Mitkommen oder Sich-Anschließen. Zusammen mit ὀπίσωθεν αὐτῶν bewahrt „kam hinter ihnen her“ sowohl die begleitende Bewegung als auch die räumliche Angabe.
- source_word: ὁ κύων
  choice: der Hund
  rationale: Der Artikel verweist auf den bereits aus der Erzählung bekannten Hund.
- source_word: ὀπίσωθεν αὐτῶν
  choice: hinter ihnen her
  rationale: Die räumliche Wendung beschreibt, dass der Hund den Reisenden von hinten folgt.
