  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπελάβετο
  choice: ergriff
  rationale: Das Medium von ἐπιλαμβάνομαι bezeichnet hier ein konkretes Ergreifen oder Festhalten. „Ergriff“ ist knapp und bewahrt die Handlung, ohne sie als Umarmung oder Unterstützung auszudeuten.
- source_word: προσέπασεν
  choice: strich … auf
  rationale: Das Verb bezeichnet das Aufbringen beziehungsweise Aufstreichen einer Substanz. „strich … auf“ ist im medizinischen Zusammenhang natürlich und bildet den konkreten Vorgang deutlicher ab als das abstraktere „wendete an“.
- source_word: χολήν
  choice: Galle
  rationale: χολή bezeichnet Galle. „Galle“ ist die sachlich genaue und zugleich traditionelle Benennung des in der Erzählung verwendeten Heilmittels.
- source_word: ὀφθαλμούς
  choice: Augen
  rationale: „Augen“ ist die gewöhnliche und kontextgemäße Wiedergabe von ὀφθαλμοί.
- source_word: λέγων
  choice: Dabei sagte er
  rationale: Das präsentische Partizip leitet die folgende direkte Rede ein. „Dabei sagte er“ gibt die Gleichzeitigkeit natürlich wieder; der Doppelpunkt hält den Satz für die anschließende Rede offen.
