  source_fidelity: 'Der Entwurf gibt die Abfolge und die wesentlichen Ausdrücke des griechischen Textes zutreffend wieder: das Ergreifen des Vaters, das Auftragen der Galle auf seine Augen und die Einleitung der folgenden Rede. Die Wiederholung „seines Vaters“ bei den Augen sollte jedoch wie im griechischen Text ausdrücklich erhalten bleiben.'
