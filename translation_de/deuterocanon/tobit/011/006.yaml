  yaml_path: translation/deuterocanon/tobit/011/006.yaml
  text: And she noticed him coming and said to his father[a], “Look, my son is coming, and the man who went with him.”
translation:
  language: de
  text: 'Und sie bemerkte ihn kommen[a] und sagte zu seinem Vater: »Schau, mein Sohn kommt, und der Mann, der mit ihm gegangen ist.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Verb kann hier auch mit »erkannte ihn kommen« oder »nahm ihn kommen wahr« wiedergegeben werden. Es bezeichnet, dass sie ihn als Kommenden wahrnahm.
    reason: lexical_alternative
lexical_decisions:
- source_word: προενόησεν
  choice: erkannte ihn schon von Weitem
  rationale: Das Verb bezeichnet hier eine vorausgehende Wahrnehmung. Im Erzählzusammenhang sieht die Frau den Ankommenden aus der Entfernung und erkennt ihn; die Formulierung bewahrt sowohl das Wahrnehmen als auch den zeitlich-räumlichen Vorsprung.
- source_word: ἐρχόμενον
  choice: als er näher kam
  rationale: Das Präsenspartizip beschreibt seine Bewegung auf die Beobachtende zu. »Als er näher kam« ist im Deutschen natürlicher als die wörtliche Partizipialkonstruktion.
- source_word: Ἰδοὺ
  choice: Schau
  rationale: Die Aufforderung lenkt unmittelbar die Aufmerksamkeit auf die Ankommenden. »Schau« ist gegenwärtig und würdig, ohne das altertümliche Gepräge von »Siehe«.
- source_word: ὁ υἱός μου
  choice: mein Sohn
  rationale: Die einfache Besitzangabe wird unmittelbar wiedergegeben.
- source_word: ὁ ἄνθρωπος
  choice: der Mann
  rationale: Der griechische Text nennt ihn ausdrücklich »den Mann«; die kontextuell mögliche Deutung als Reisebegleiter wird nicht an die Stelle des Wortlauts gesetzt.
- source_word: ὁ πορευθεὶς μετʼ αὐτοῦ
  choice: der mit ihm gegangen ist
  rationale: Die Relativkonstruktion gibt den rückblickenden Aoristpartizipialausdruck eng und verständlich wieder.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit unmittelbarer erzählerischer Rede. Die etwas ungewöhnliche Verbindung »der Mann, der mit ihm gegangen ist« bleibt bewusst nahe am griechischen Ausdruck.
