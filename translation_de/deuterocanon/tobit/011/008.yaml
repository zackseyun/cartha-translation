base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/011/008.yaml
  text: You shall anoint his eyes with the gall[a], and when it stings, he will rub them, and the white films will come away[c][b], and he will see you.
translation:
  language: de
  text: Trag ihm die Galle[a] auf die Augen auf. Wenn es ihn sticht[b], wird er sie reiben; die weißen Beläge[c] werden sich lösen, und er wird dich sehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den Gallensaft“. Das griechische Wort bezeichnet Galle beziehungsweise Gallensaft, der hier als Heilmittel verwendet wird.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „wenn er gebissen wird“. Das Griechische beschreibt die stechende Wirkung auf die Augen mit einem anschaulichen körperlichen Ausdruck.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „die weißen Flecken“ beziehungsweise „die weißen Trübungen“. Gemeint sind weißliche Veränderungen am Auge, nicht zwingend ein Katarakt im heutigen medizinischen Sinn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔγχρισον
  choice: Streiche … in die Augen
  rationale: Der Imperativ von ἐγχρίω bezeichnet das Auftragen beziehungsweise Einstreichen einer Substanz. „Streiche … in die Augen“ gibt die konkrete Anweisung im Deutschen natürlich wieder.
- source_word: χολὴν
  choice: Galle
  rationale: χολή bezeichnet Galle beziehungsweise Gallensaft. „Galle“ ist die knappe, traditionelle und hier als Heilmittel verständliche Wiedergabe.
- source_word: δηχθεὶς
  choice: Wenn es ihn sticht
  rationale: Das Partizip bezeichnet wörtlich ein Gebissen- oder Gestochenwerden. Die Formulierung bewahrt die anschauliche körperliche Wirkung, klingt im Zusammenhang mit den Augen aber natürlich.
- source_word: διατρίψει
  choice: wird er sie reiben
  rationale: Das Verb bezeichnet kräftiges oder anhaltendes Reiben. Das Pronomen „sie“ nimmt die zuvor genannten Augen auf, deren Objektbezug im Griechischen unausgesprochen bleibt.
- source_word: ἀποβαλεῖται
  choice: werden sich lösen
  rationale: Die mediale Verbform beschreibt, dass die weißen Beläge infolge des Reibens abgestoßen beziehungsweise entfernt werden. „Werden sich lösen“ gibt das Ergebnis idiomatisch wieder, ohne einen modernen medizinischen Vorgang zu unterstellen.
- source_word: τὰ λευκώματα
  choice: die weißen Beläge
  rationale: Der Ausdruck bezeichnet weißliche Trübungen oder Auflagerungen am Auge. „Weiße Beläge“ bleibt anschaulich und vermeidet die medizinisch engere Festlegung auf Katarakte.
- source_word: ὄψεταί σε
  choice: er wird dich sehen
  rationale: Die schlichte Aussage des griechischen Textes wird ohne den erklärenden Zusatz „wieder sehen können“ beibehalten.
