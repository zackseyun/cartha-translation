base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/011/002.yaml
  text: And Raphael said to Tobiah[a], “Do you not know, brother, how you left your father?”
translation:
  language: de
  text: 'Und Rafael sagte zu Tobias: „Weißt du nicht, Bruder, wie du deinen Vater zurückgelassen hast?“[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Erinnerst du dich nicht, in welchem Zustand du deinen Vater zurückgelassen hast?“ Die semitische Paralleltradition nennt die Blindheit des Vaters ausdrücklich; der griechische Text formuliert knapper.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐ γινώσκεις
  choice: Weißt du nicht
  rationale: Die Wiedergabe bleibt nahe an γινώσκω („wissen, erkennen“). Im Zusammenhang schwingt die Erinnerung an den Zustand des Vaters mit, ohne dass diese Bedeutung ausdrücklich in den Haupttext eingetragen wird.
- source_word: ἀδελφέ
  choice: Bruder
  rationale: Der Vokativ wird wörtlich und zugleich als natürliche, herzliche Anrede wiedergegeben; eine leibliche Verwandtschaft wird dadurch nicht zusätzlich behauptet.
- source_word: πῶς ἀφῆκες
  choice: wie du … zurückgelassen hast
  rationale: πῶς bewahrt die knappe Frage nach Art beziehungsweise Zustand; „zurückgelassen“ gibt ἀφῆκες in diesem Kontext idiomatisch wieder, ohne die Blindheit ausdrücklich zu ergänzen.
- source_word: τὸν πατέρα σου
  choice: deinen Vater
  rationale: Direkte und natürliche Wiedergabe des griechischen Akkusativobjekts.
- source_word: Τωβείαν
  choice: Tobias
  rationale: Die im modernen Deutschen geläufige Namensform wird für den griechischen Namen Τωβείας verwendet.
theological_decisions:
- issue: Verhältnis des knappen griechischen Textes zur ausführlicheren semitischen Paralleltradition
  choice: Die knappe rhetorische Frage des griechischen Hauptzeugen bleibt im Haupttext erhalten.
  alternative: „Weißt du nicht mehr, in welchem Zustand du deinen Vater zurückgelassen hast?“ beziehungsweise eine ausdrückliche Erwähnung seiner Blindheit.
  rationale: Der griechische Text nennt die Blindheit nicht ausdrücklich. Die Paralleltradition erhellt wahrscheinlich den gemeinten Zustand, darf aber die primäre griechische Textgrundlage nicht ersetzen oder erweitern.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Anrede „Bruder“ und die knappe, leicht mehrdeutige Frage des Griechischen bleiben erhalten; die Fußnote erläutert den im Kontext möglichen Zustandsbezug.
