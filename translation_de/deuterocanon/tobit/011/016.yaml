base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/011/016.yaml
  text: And Tobit went out to meet his daughter-in-law[a], rejoicing and blessing God, at the gate of Nineveh. And those who saw him walking were amazed[b], because he could see.
translation:
  language: de
  text: Und Tobit ging hinaus, um seiner Schwiegertochter[a] entgegenzugehen, freute sich und pries Gott am Tor von Ninive. Diejenigen, die ihn gehen sahen, staunten[b], weil er sehen konnte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort kann sowohl „Braut“ als auch „Schwiegertochter“ bedeuten. Hier bezeichnet es Sara als Frau von Tobits Sohn.
    reason: lexical_alternative
  - marker: b
    text: Im griechischen Text steht hier die Namensform „Tōbeias“. Der Zusammenhang weist jedoch auf den älteren Tobit, denn die Menschen staunen darüber, dass er sehen kann.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: ging hinaus
  rationale: Gibt den erzählenden Aorist als schlichte Bewegung nach draußen natürlich wieder.
- source_word: Τωβείας
  choice: Tobit
  rationale: Obwohl die griechische Namensform Tōbeias lautet, weist der unmittelbare Zusammenhang auf den zuvor blinden und nun sehenden Vater Tobit.
- source_word: εἰς συνάντησιν
  choice: um … entgegenzugehen
  rationale: Die Wendung bezeichnet das Hinausgehen, um eine ankommende Person zu begrüßen; „entgegengehen“ ist im Deutschen präzise und natürlich.
- source_word: τῇ νύμφῃ αὐτοῦ
  choice: seiner Schwiegertochter
  rationale: νύμφη kann „Braut“ oder „Schwiegertochter“ bedeuten; hier ist Sara als Frau seines Sohnes gemeint.
- source_word: χαίρων
  choice: freute er sich
  rationale: Bewahrt den verbalen Gehalt des Partizips in flüssigem modernem Deutsch.
- source_word: εὐλογῶν τὸν θεόν
  choice: pries Gott
  rationale: Das griechische „Gott segnend“ bezeichnet hier den an Gott gerichteten Lobpreis; „pries Gott“ ist im Deutschen idiomatisch und vermeidet das mögliche Missverständnis, Tobit spende Gott einen Segen.
- source_word: πρὸς τῇ πύλῃ Νινευή
  choice: am Tor von Ninive
  rationale: Gibt die Ortsangabe knapp und natürlich wieder; πρὸς mit Dativ bezeichnet die Lage bei beziehungsweise an dem Tor.
- source_word: ἐθαύμαζον
  choice: staunten
  rationale: Das Imperfekt schildert die anhaltende Reaktion der Beobachtenden; „staunten“ ist gegenwärtiges, würdiges Deutsch.
- source_word: οἱ θεωροῦντες αὐτὸν πορευόμενον
  choice: alle, die ihn gehen sahen
  rationale: Gibt die ineinander verschachtelten Partizipien klar wieder, ohne zusätzliche Deutung.
- source_word: ὅτι ἔβλεψεν
  choice: weil er sehen konnte
  rationale: Bleibt nahe bei der Aussage des griechischen Verbs und lässt die im Zusammenhang erkennbare Wiederherstellung des Sehvermögens unausgesprochen.
theological_decisions:
- issue: Identität der mit Τωβείας bezeichneten Person
  choice: Tobit, der geheilte Vater
  alternative: Tobias, der Sohn
  rationale: Das abschließende Staunen darüber, dass die Person sehen konnte, passt im unmittelbaren Erzählzusammenhang zu Tobit, dessen Blindheit geheilt worden war. Die Namensform bleibt wegen der textlichen Auffälligkeit in einer Fußnote transparent.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die lange griechische Satzfolge wurde zur besseren deutschen Lesbarkeit in drei Sätze gegliedert. „Gott preisen“ ist gegenüber dem formaleren „Gott segnen“ idiomatischer, während die Namensfrage und die Bedeutungsbreite von νύμφη durch Fußnoten offengelegt werden.
