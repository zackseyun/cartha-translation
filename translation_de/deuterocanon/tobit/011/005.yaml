  text: And Anna sat watching the road for her son,[a]
translation:
  language: de
  text: Anna saß da und hielt auf die Straße hinaus nach ihrem Sohn Ausschau.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das Griechische formuliert knapp: „zur Straße hin ausblickend, ihren Sohn“. Gemeint ist, dass sie die Straße beobachtete und auf die Rückkehr ihres Sohnes wartete.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκάθητο
  choice: saß da
  rationale: Das Imperfekt von κάθημαι beschreibt Annas anhaltende Sitzhaltung. „Saß da“ klingt im Deutschen natürlich und lässt zugleich die fortdauernde Handlung des Partizips hervortreten.
- source_word: περιβλεπομένη
  choice: hielt … Ausschau
  rationale: Das Partizip bezeichnet ein aufmerksames, suchendes Umherblicken. „Ausschau halten“ gibt die erwartungsvolle Haltung im Kontext idiomatisch wieder.
- source_word: εἰς τὴν ὁδόν
  choice: auf der Straße
  rationale: ὁδός bezeichnet hier die Straße beziehungsweise den Weg, auf dem ihr Sohn zurückkehren würde. Die Verbindung mit „Ausschau halten“ wird im Deutschen natürlich durch „auf der Straße“ ausgedrückt.
- source_word: τὸν παῖδα αὐτῆς
  choice: nach ihrem Sohn
  rationale: παῖς kann „Kind“, „Junge“ oder „Sohn“ bedeuten. Im Zusammenhang ist Tobias ihr Sohn. Das griechische Akkusativgefüge ist knapp; „nach ihrem Sohn Ausschau halten“ gibt den gemeinten Sinn verständlich wieder.
