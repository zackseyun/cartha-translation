  text: And there was joy for all his brothers in Nineveh[a]. And Ahikar came, and Nasbas his cousin[b],
translation:
  language: de
  text: Und alle seine Brüder in Ninive freuten sich.[a] Und Achikar kam, ebenso sein Cousin Nasbas,[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »seine Verwandten« beziehungsweise »seine Angehörigen«; das griechische Wort für »Brüder« kann auch einen weiteren Verwandtschaftskreis bezeichnen.'
