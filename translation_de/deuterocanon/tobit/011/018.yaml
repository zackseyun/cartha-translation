lexical_decisions:
- source_word: ἐγένετο χαρὰ
  choice: freuten sich
  rationale: Die griechische Wendung bezeichnet das Eintreten bzw. Vorhandensein von Freude. Die verbale deutsche Formulierung gibt dies natürlich und klar wieder.
- source_word: πᾶσι
  choice: alle
  rationale: Bewahrt den umfassenden Sinn des griechischen Dativs im Deutschen.
- source_word: τοῖς ἐν Νινευὴ
  choice: in Ninive
  rationale: Gibt die Ortsangabe knapp und idiomatisch wieder.
- source_word: ἀδελφοῖς αὐτοῦ
  choice: seine Brüder
  rationale: Folgt der konkreten maskulinen Pluralform des griechischen Textes; ein weiterer Verwandtschaftssinn bleibt in der Fußnote erhalten.
- source_word: παρεγένετο
  choice: kam
  rationale: Eine schlichte und natürliche Wiedergabe des erzählenden Verbs für Ankunft oder Erscheinen.
- source_word: Ἀχιάχαρος
  choice: Achikar
  rationale: Verwendet die im Deutschen geläufige Namensform, die zugleich die griechische Form erkennen lässt.
- source_word: Νασβὰς
  choice: Nasbas
  rationale: Gibt die Namensform des zugrunde gelegten griechischen Textes direkt wieder, ohne sie nach anderen Textzeugen zu harmonisieren.
- source_word: ὁ ἐξάδελφος αὐτοῦ
  choice: sein Cousin
  rationale: ἐξάδελφος bezeichnet spezifisch einen Cousin; die präzise Verwandtschaftsbezeichnung ist daher einem allgemeineren „Verwandten“ vorzuziehen.
theological_decisions:
- issue: Bedeutungsumfang von ἀδελφοῖς αὐτοῦ
  choice: „seine Brüder“ im Haupttext
  alternative: „seine Verwandten“ oder „seine Angehörigen“
  rationale: Das Griechische sagt wörtlich „seine Brüder“, kann in erzählendem Kontext aber auch einen weiteren Kreis von Verwandten oder Zugehörigen bezeichnen. Die konkrete Form bleibt im Haupttext stehen, während die mögliche weitere Bedeutung in einer Fußnote genannt wird.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die idiomatische Verbform „freuten sich“ vermeidet eine schwerfällige Nachbildung von ἐγένετο χαρά. Das abschließende Komma bewahrt den offenen Satzanschluss des griechischen Textes.
