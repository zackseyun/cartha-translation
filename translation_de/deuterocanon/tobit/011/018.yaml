  source_fidelity: Die Wiedergabe der Freude durch „freuten sich“ ist als idiomatische Umformung von καὶ ἐγένετο χαρά ... πᾶσι vertretbar. Der zweite Satz sollte jedoch die beiden durch καί verbundenen Ankünfte klarer wiedergeben. Die Zuordnung von αὐτοῦ zu Achikar wird im Deutschen am natürlichsten durch „sein Cousin Nasbas“ verdeutlicht.
  naturalness: „Auch Achikar kam, ebenso Nasbas, sein Cousin“ ist im modernen Standarddeutsch stilistisch etwas holprig; zudem ist die Apposition nicht so klar angebunden. „Und Achikar kam, ebenso sein Cousin Nasbas“ ist flüssig, wahrt die Satzellipse und lässt den offenen Anschluss bestehen.
  terminology: „Brüder“ bewahrt die Form des griechischen Textes; die Fußnote nennt den möglichen weiteren Verwandtschaftssinn angemessen. „Cousin“ ist für ἐξάδελφος präzise. Die Namensformen Achikar und Nasbas sind mit der vorgelegten griechischen Textgrundlage vereinbar.
