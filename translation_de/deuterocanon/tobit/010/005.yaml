    text: 'Oder: „Kümmert es mich etwa nicht, mein Kind, dass ich dich fortgeschickt habe, das Licht meiner Augen?“ Die griechische Formulierung ist eine rhetorische Frage, die tiefe persönliche Not ausdrückt.'
