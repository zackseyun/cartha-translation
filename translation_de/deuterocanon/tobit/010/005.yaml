lexical_decisions:
- source_word: Οὐ μέλει μοι
  choice: Liegt mir denn nichts daran
  rationale: Die idiomatische Wendung μέλει μοι bezeichnet persönliches Kümmern beziehungsweise innere Anteilnahme. Die rhetorische Frage und das verstärkende „denn“ bewahren den schmerzlichen, emotionalen Ton.
- source_word: τέκνον
  choice: mein Kind
  rationale: τέκνον ist eine liebevolle familiäre Anrede. Das im Deutschen natürliche „mein Kind“ bringt die innige Beziehung zum Ausdruck, ohne das Geschlecht durch „Sohn“ ausdrücklich festzulegen.
- source_word: ἀφῆκά σε
  choice: dass ich dich habe ziehen lassen
  rationale: ἀφίημι meint hier, jemanden fortgehen zu lassen. Die Formulierung vermittelt sowohl die vollzogene Trennung als auch deren fortdauernde emotionale Wirkung.
- source_word: τὸ φῶς τῶν ὀφθαλμῶν μου
  choice: das Licht meiner Augen
  rationale: Die bildhafte liebevolle Bezeichnung wird bewusst wörtlich bewahrt; sie ist im Deutschen verständlich und erhält die emotionale Intensität des griechischen Ausdrucks.
