  text: Then Tobias said to Raguel[a], “Send me away, because my father and my mother no longer expect to see me.”
translation:
  language: de
  text: 'Da sagte Tobias zu Raguel: »Lass mich ziehen, denn mein Vater und meine Mutter hoffen nicht mehr[a], mich zu sehen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »rechnen nicht mehr damit, mich zu sehen«. Das griechische Verb kann sowohl Hoffnung als auch Erwartung ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἶπεν δὲ
  choice: Da sagte
  rationale: δέ verbindet die Erzählung locker mit dem Vorhergehenden; »Da« gibt den Fortgang der Handlung natürlich wieder, ohne einen starken Gegensatz auszudrücken.
- source_word: Τωβείας
  choice: Tobias
  rationale: Die im Deutschen geläufige Namensform wird verwendet.
- source_word: τῷ Ῥαγουὴλ
  choice: zu Raguël
  rationale: Der Dativ bezeichnet den Gesprächspartner. »Raguël« folgt einer geläufigen deutschen Schreibung und macht die getrennte Aussprache der Vokale sichtbar.
- source_word: Ἐξαπόστειλόν με
  choice: Lass mich abreisen
  rationale: Der Aoristimperativ bittet Raguël darum, Tobias zur Abreise zu entlassen. Die Formulierung klingt im heutigen Deutsch natürlicher und weniger abweisend als »Schick mich fort«.
- source_word: ὅτι
  choice: denn
  rationale: Die Konjunktion leitet die Begründung der Bitte ein; »denn« passt natürlich zur direkten Rede.
- source_word: ὁ πατήρ μου καὶ ἡ μήτηρ μου
  choice: mein Vater und meine Mutter
  rationale: Die ausdrückliche Nennung beider Elternteile bleibt erhalten und wird nicht zu »meine Eltern« verkürzt.
- source_word: οὐκέτι
  choice: nicht mehr
  rationale: Die Wendung bezeichnet das Ende eines bisherigen Hoffens oder Erwartens.
- source_word: ἐλπίζουσιν
  choice: hoffen
  rationale: Das Verb bezeichnet häufig Hoffnung, kann hier aber auch die Erwartung eines künftigen Wiedersehens meinen. »Hoffen« bewahrt die emotionale Färbung des Zusammenhangs.
- source_word: ὄψεσθαί με
  choice: mich wiederzusehen
  rationale: Wörtlich steht »mich zu sehen«. Im Kontext seiner ausstehenden Rückkehr bezeichnet das Sehen ein Wiedersehen; die idiomatische deutsche Wiedergabe macht diesen Bezug deutlich.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle Erzählprosa. Die direkte Bitte wird natürlich formuliert, ohne ihre Dringlichkeit abzuschwächen; die ausdrückliche Nennung von Vater und Mutter bleibt erhalten.
