- from: 'Da sagte Tobias zu Raguël: »Lass mich abreisen, denn mein Vater und meine Mutter hoffen nicht mehr[a], mich wiederzusehen.«'
  to: 'Da sagte Tobias zu Raguel: »Lass mich ziehen, denn mein Vater und meine Mutter hoffen nicht mehr[a], mich zu sehen.«'
