  naturalness: Modernes, würdiges Standarddeutsch. „zog weiter“, „pries Gott“ und „immer wieder“ sind gut verständlich und dem Erzählregister angemessen. Die Wiederaufnahme von „Er zog weiter“ entspricht der griechischen Wiederholung besser als die mit „So“ eingeleitete Fassung.
  terminology: Die Namen Tobias, Raguel, Edna und Ninive sind konsistent und gebräuchlich. „pries Gott“ vermittelt εὐλογῶν τὸν θεόν idiomatisch; „segnete“ erhält bei κατευλόγει sinnvoll die konkrete Segenshandlung. Die Fußnotenanker stehen an den jeweils einschlägigen Aussagen.
