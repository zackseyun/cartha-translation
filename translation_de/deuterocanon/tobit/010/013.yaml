  yaml_path: translation/deuterocanon/tobit/010/013.yaml
  text: After these things Tobiah also went on his way[a], blessing God because he had made his journey successful, and he kept blessing Raguel and Edna his wife[b]. And he went on until they came near to Nineveh.
translation:
  language: de
  text: Danach zog auch Tobias weiter und pries Gott, weil Gott seiner Reise Gelingen geschenkt hatte,[a] und segnete Raguel und dessen Frau Edna immer wieder. Er zog weiter, bis sie sich Ninive näherten.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „dass er seinen Weg gelingen ließ“; die griechische Wendung bedeutet, dass Gott der Reise Erfolg schenkte.'
    reason: lexical_alternative
  - marker: b
    text: 'Der griechische Text ist hier syntaktisch unregelmäßig: Neben dem Verb im Plural („sie näherten sich“) steht ein Pronomen im Singular („ihn“). Der Haupttext gibt den naheliegenden Sinn der Erzählung wieder: Die Reisenden näherten sich Ninive.'
    reason: textual_variant
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: Danach
  rationale: Eine natürliche deutsche Zeitangabe, die den Anschluss an die vorausgehenden Ereignisse wahrt.
- source_word: ἐπορεύετο
  choice: zog weiter
  rationale: Das Imperfekt bezeichnet eine fortdauernde Reisebewegung; „zog weiter“ gibt dies im Erzählzusammenhang natürlich wieder.
- source_word: εὐλογῶν τὸν θεόν
  choice: pries Gott
  rationale: Beim Segnen Gottes bezeichnet εὐλογέω inhaltlich Lobpreis. „Pries Gott“ ist im heutigen Deutsch klar und wahrt den religiösen Ton.
- source_word: ὅτι εὐώδωσεν τὴν ὁδὸν αὐτοῦ
  choice: dass er seiner Reise Gelingen geschenkt hatte
  rationale: εὐοδόω mit ὁδός ist eine Weg- und Reiseidiomatik für gewährten Erfolg. Die Formulierung erhält sowohl das Bild der Reise als auch Gott als den Handelnden.
- source_word: κατευλόγει
  choice: segnete … immer wieder
  rationale: Das Imperfekt und die verstärkende Verbform legen ein fortgesetztes beziehungsweise nachdrückliches Segnen nahe.
- source_word: Ῥαγουὴλ καὶ Ἔδναν τὴν γυναῖκα αὐτοῦ
  choice: Raguel und dessen Frau Edna
  rationale: Die deutsche Formulierung macht eindeutig, dass Edna Raguels Frau ist, und gibt die griechische Apposition idiomatisch wieder.
- source_word: μέχρις οὗ ἤγγισαν αὐτὸν εἰς Νινευή
  choice: bis sie sich Ninive näherten
  rationale: Der überlieferte griechische Satz ist syntaktisch unregelmäßig. Die Wiedergabe folgt dem erkennbaren Erzählzusammenhang, ohne den unstimmigen Singular αὐτόν künstlich in den Haupttext einzubauen.
theological_decisions:
- issue: Urheber des Gelingens der Reise
  choice: Gott schenkte Tobias’ Reise Gelingen
  alternative: Gott ließ den Weg selbst gedeihen oder förderte das Unternehmen allgemein
  rationale: Die Konstruktion εὐώδωσεν τὴν ὁδὸν αὐτοῦ schreibt Gott das Gelingen der Reise zu. Diese Aussage göttlicher Fürsorge wird klar wiedergegeben, ohne sie theologisch auszubauen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Kurze Sätze entlasten die griechische Satzreihe; „pries Gott“ klingt natürlicher als „segnete Gott“, während „segnete“ für den Segen über Raguel und Edna beibehalten wird. Die echte syntaktische Schwierigkeit am Versende wird nicht verschwiegen, sondern in Fußnote [b] offengelegt.
