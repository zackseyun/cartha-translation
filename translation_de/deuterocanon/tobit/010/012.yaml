  yaml_path: translation/deuterocanon/tobit/010/012.yaml
  text: And he said to his daughter[a], “Honor your parents-in-law; they are now your parents. May I hear a good report about you.” And he kissed her. And Edna said to Tobiah, “Beloved brother, may the Lord of heaven restore you, and may he grant me to see children from you and from Sarah my daughter, so that I may rejoice before the Lord. And look, I entrust my daughter to you as a deposit[b]; do not grieve her.”
translation:
  language: de
  text: 'Und er sagte zu seiner Tochter: „Ehre deine Schwiegereltern; sie sind jetzt deine Eltern. Möge ich Gutes über dich hören.“ Und er küsste sie. Edna sagte zu Tobias: „Lieber Bruder, möge der Herr des Himmels dich wiederherstellen[a] und mir schenken, Kinder von dir und meiner Tochter Sara zu sehen, damit ich mich vor dem Herrn freue. Sieh, ich vertraue dir meine Tochter zur Verwahrung an[b]; bereite ihr keinen Kummer.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dich wohlbehalten zurückbringen“. Das griechische Verb kann Wiederherstellung oder Wiederzurechtbringung bezeichnen und im Zusammenhang der Reise auch eine sichere Rückkehr einschließen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich etwa: „als hinterlegtes Gut“. Gemeint ist etwas, das jemandem treuhänderisch zur Obhut anvertraut wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τίμα
  choice: Ehre
  rationale: Bewahrt das ethische Gewicht von τιμάω und die Sprache familiärer Pflichten; „Respektiere“ wäre schwächer.
- source_word: τοὺς πενθερούς σου
  choice: deine Schwiegereltern
  rationale: Bezeichnet die Eltern des Ehepartners gemeinsam und ist im modernen Deutschen präzise und natürlich.
- source_word: ἀκούσαιμί σου ἀκοὴν καλήν
  choice: Möge ich Gutes über dich hören
  rationale: Gibt den griechischen Wunsch idiomatisch wieder, eine gute Nachricht beziehungsweise einen guten Bericht über sie zu hören.
- source_word: ἀδελφὲ ἀγαπητέ
  choice: Geliebter Bruder
  rationale: Bewahrt sowohl die verwandtschaftliche Anrede als auch den herzlichen Ton.
- source_word: ἀποκαταστήσει σε
  choice: bringe dich wohlbehalten zurück
  rationale: Im Kontext der bevorstehenden Reise bezeichnet das Verb plausibel die sichere Rückkehr; die allgemeinere Bedeutung „wiederherstellen“ bleibt in der Fußnote genannt.
- source_word: ὁ κύριος τοῦ οὐρανοῦ
  choice: der Herr des Himmels
  rationale: Natürliche und ehrerbietige Wiedergabe des griechischen Gottestitels.
- source_word: δῴη μοι ἰδεῖν σου παιδία ἐκ Σάρρας τῆς θυγατρός μου
  choice: schenke mir, Kinder von dir und meiner Tochter Sara zu sehen
  rationale: Bewahrt mit „von“ den Gedanken der Herkunft beziehungsweise Elternschaft, ohne ἐκ als bloße Agensangabe zu verengen.
- source_word: ἵνα εὐφρανθῶ ἐνώπιον τοῦ κυρίου
  choice: damit ich mich vor dem Herrn freue
  rationale: Folgt der religiösen Ausrichtung der Wendung und bleibt verständlich.
- source_word: παρατίθεμαί σοι ... ἐν παρακαταθήκῃ
  choice: ich vertraue dir ... als anvertrautes Gut an
  rationale: Gibt sowohl den Akt des Anvertrauens als auch das rechtlich gefärbte Bild eines zur Verwahrung übergebenen Gutes wieder.
- source_word: μὴ λυπήσῃς αὐτήν
  choice: bereite ihr keinen Kummer
  rationale: Drückt die kausative Bedeutung „sie betrüben/ihnen Kummer bereiten“ in natürlichem modernem Deutsch aus.
theological_decisions:
- issue: Wiedergabe von κύριος in einem griechischen Gottestitel
  choice: der Herr
  alternative: der HERR; der Gebieter
  rationale: „Herr“ ist die natürliche, ehrerbietige Wiedergabe von κύριος; der griechische Text rechtfertigt hier keine besondere typografische Kennzeichnung.
- issue: Bedeutungsumfang von ἀποκαταστήσει im Reisesegen
  choice: bringe dich wohlbehalten zurück
  alternative: stelle dich wieder her
  rationale: Der unmittelbare Abschiedskontext legt sichere Rückkehr nahe. Eine Fußnote bewahrt die allgemeinere lexikalische Möglichkeit, ohne den Sinn dogmatisch festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Segenswunsch wird ohne altertümlichen Konjunktiv formuliert. „Sieh“ bewahrt das aufmerksamkeitslenkende ἰδού; „anvertrautes Gut“ erhält das Verwahrungsbild, klingt aber natürlicher als „als Depot“.
