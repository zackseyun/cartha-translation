  language: de
  text: 'Und Tobias sagte[a]: »Schick mich zu meinem Vater.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »sagt«; im Griechischen steht das historische Präsens.'
