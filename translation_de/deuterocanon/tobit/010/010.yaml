lexical_decisions:
- source_word: λέγει
  choice: sagte
  rationale: Das griechische historische Präsens wird in einer fortlaufenden deutschen Erzählung idiomatisch im Präteritum wiedergegeben; eine Fußnote macht die Form des Ausgangstextes sichtbar.
- source_word: Ἐξαπόστειλόν
  choice: Schick mich
  rationale: Der Imperativ von ἐξαποστέλλω bezeichnet hier das Weg- beziehungsweise Aussenden. Im Deutschen vermittelt »Schick mich zu …« die Bewegung vom gegenwärtigen Ort zum genannten Ziel natürlich und ohne unnötigen Zusatz.
- source_word: πρὸς τὸν πατέρα μου
  choice: zu meinem Vater
  rationale: πρός mit Akkusativ bezeichnet die Bewegung auf eine Person zu. Die Wiedergabe fügt weder »zurück« noch »Haus« hinzu, da beides nicht ausdrücklich im griechischen Text steht.
- source_word: Τωβείας
  choice: Tobias
  rationale: Der griechische Personenname wird gemäß der im Deutschen geläufigen Form des Namens wiedergegeben.
