base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/010/002.yaml
  text: he said[a], “Could it be that he has been delayed? Or could it be that Gabael has died, and no one is giving him the money?”
translation:
  language: de
  text: 'sagte er: „Ist er vielleicht beschämt worden?[a] Oder ist vielleicht Gabaël gestorben, und niemand gibt ihm das Geld?“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „ist beschämt worden“. Die Wendung kann auf eine demütigende oder beschämende Erfahrung hindeuten; die genauen Umstände werden nicht genannt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μή ποτε
  choice: Ob er wohl …? / Oder ist vielleicht …?
  rationale: Die Wendung leitet besorgte, erwägende Fragen ein. Die variierte deutsche Wiedergabe klingt natürlich und bewahrt die Ungewissheit.
- source_word: κατῄσχυνται
  choice: in eine beschämende Lage geraten ist
  rationale: Das Perfekt Passiv von καταισχύνω bezeichnet wörtlich ein Beschämt- oder Zuschandewerden. Die Formulierung erhält diesen Sinn, ohne die im Zusammenhang mögliche Verzögerung oder einen bestimmten Rückschlag ausdrücklich in den Text hineinzulesen.
- source_word: ἀπέθανεν
  choice: gestorben
  rationale: Gibt den Aorist von ἀποθνῄσκω schlicht wieder; im Deutschen bezeichnet das Perfekt den für die gegenwärtige Sorge relevanten Zustand natürlich.
- source_word: Γαβαήλ
  choice: Gabaël
  rationale: Der griechische Personenname wird transliteriert; die Trema-Schreibung macht die getrennte Aussprache der Vokale deutlich und vermeidet eine Verwechslung mit Gabriel.
- source_word: δίδωσιν αὐτῷ τὸ ἀργύριον
  choice: niemand gibt ihm das Geld
  rationale: ἀργύριον kann Silber oder Geld bedeuten; im Erzählzusammenhang sind hinterlegte Geldmittel gemeint. „gibt“ bleibt nah am unspezifischen griechischen Verb und legt die Art der Übergabe nicht näher fest.
