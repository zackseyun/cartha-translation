  text: Then his father-in-law said to him[a], “Stay with me, and I will send word to your father, and they will make known to him the things concerning you.”
translation:
  language: de
  text: 'Da sagte sein Schwiegervater zu ihm: „Bleib bei mir! Ich werde Boten zu deinem Vater schicken, und sie werden ihm mitteilen, wie es dir geht.“[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Ich werde zu deinem Vater schicken, und sie werden ihm mitteilen, was dich betrifft.“ Im Griechischen wird nicht ausdrücklich gesagt, wen der Schwiegervater schickt; das folgende „sie“ bezieht sich wahrscheinlich auf die Entsandten.'
    reason: Das nicht genannte Objekt von ἐξαποστελῶ und der unvermittelte Plural δηλώσουσιν schaffen eine echte sprachliche Unbestimmtheit, die in der flüssigen Hauptübersetzung erklärt werden muss.
lexical_decisions:
- source_word: ὁ πενθερός
  choice: sein Schwiegervater
  rationale: πενθερός bezeichnet den Vater durch Heiratsverwandtschaft; im Kontext spricht Raguël als Schwiegervater zu Tobias.
- source_word: Μεῖνον παρʼ ἐμοί
  choice: Bleib bei mir!
  rationale: Der Aoristimperativ von μένω ist eine unmittelbare Aufforderung; παρʼ ἐμοί bezeichnet das Bleiben beim Sprecher. Die knappe Formulierung ist natürlich und quellengetreu.
- source_word: κἀγὼ ἐξαποστελῶ πρὸς τὸν πατέρα σου
  choice: Ich werde Boten zu deinem Vater schicken
  rationale: ἐξαποστέλλω bedeutet „aussenden/fortschicken“. Das griechische Objekt bleibt unausgesprochen; aus dem folgenden Verb im Plural ergibt sich wahrscheinlich, dass entsandte Personen gemeint sind. „Boten“ macht den Satz im Deutschen verständlich, ohne den Mitteilungszweck zu verändern.
- source_word: δηλώσουσιν αὐτῷ
  choice: sie werden ihm mitteilen
  rationale: δηλόω bedeutet „bekannt machen, mitteilen“. Der Plural „sie“ wird entsprechend dem Griechischen beibehalten und auf die wahrscheinlich mitgedachten Entsandten bezogen.
- source_word: τὰ κατὰ σέ
  choice: wie es dir geht
  rationale: Die Wendung bezeichnet die Angelegenheiten oder Umstände einer Person. „Wie es dir geht“ gibt sie in diesem familiären Nachrichtenzusammenhang natürlich wieder; die wörtlichere Fassung wird in der Fußnote genannt.
