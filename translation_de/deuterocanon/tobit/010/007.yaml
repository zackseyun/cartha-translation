review_pass:
  verdict: revise
  source_fidelity: Die Sprecher- und Adressatenangabe im griechischen Wortlaut lautet ausdrücklich „er sagte zu ihr“ (εἶπεν αὐτῇ). Der Entwurf emendiert dies im Haupttext zu „sie sagte zu ihm“. Da der überlieferte Wortlaut mit dem unmittelbaren Zusammenhang kollidiert, soll die Spannung transparent in einer textkritischen Fußnote vermerkt, aber nicht im Haupttext stillschweigend aufgelöst werden. „Mein Kind ist verloren“ bewahrt zudem die lexikalische Offenheit von ἀπώλετο besser als „ist umgekommen“.
  naturalness: Die revidierte Fassung ist modernes, würdiges Standarddeutsch. Die Schlusswendung wird syntaktisch geglättet, ohne Raguels Schwur oder Tobias’ verpflichtenden Aufenthalt abzuschwächen.
  terminology: „Kind“, „Brot“, „trauern“ und „Hochzeitsfeier“ geben die griechischen Ausdrücke angemessen wieder. „Verloren“ lässt offen, ob die Rede von Verlust, Verschollensein oder befürchtetem Tod ist.
  issues:
  - severity: high
    issue: Die Haupttext-Sprecherzuordnung weicht vom vorgelegten griechischen Wortlaut ab.
    rationale: εἶπεν αὐτῇ bedeutet grammatisch „er sagte zu ihr“. Der Kontext legt zwar eine gegenteilige Zuordnung nahe, doch diese textkritische Schwierigkeit darf nicht durch eine unmarkierte Änderung im Haupttext beseitigt werden.
  - severity: medium
    issue: „ist umgekommen“ verengt ἀπώλετο auf Tod.
    rationale: Das Verb kann in diesem Kontext auch „ist verloren“ beziehungsweise „ist verschollen“ ausdrücken. Die direkte Rede gibt eine verzweifelte Einschätzung wieder, nicht eine Erzählerfeststellung.
  - severity: low
    issue: Die bisherige Schlussformulierung „die Raguel ihn, wie er geschworen hatte, dort verbringen lassen wollte“ schwächt den Schwur zu einer bloßen Absicht ab.
    rationale: ὤμοσεν bezeichnet einen Schwur. „geschworen hatte, ihn dort verbringen zu lassen“ bildet dies genauer und idiomatisch ab.
