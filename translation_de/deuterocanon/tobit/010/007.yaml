base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/010/007.yaml
  text: And she said to him[a], “Be quiet; do not mislead me. My child has perished.” And every day she would go out to the road by which he had departed, and by day she would eat no bread, and at night she did not cease mourning for Tobias her son, until the fourteen days of the wedding feast were completed[b], which Raguel had sworn that he should spend there.
translation:
  language: de
  text: 'Da sagte sie zu ihm[a]: »Sei still! Führe mich nicht in die Irre! Mein Kind ist umgekommen[b].« Jeden Tag ging sie hinaus auf die Straße, auf der er fortgegangen war. Tagsüber aß sie kein Brot, und nachts hörte sie nicht auf, um ihren Sohn Tobias zu trauern, bis die vierzehn Tage der Hochzeitsfeier[c] vorüber waren, die Raguel ihn, wie er geschworen hatte, dort verbringen lassen wollte.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die vorliegende griechische Transkription lautet wörtlich: »Da sagte er zu ihr« (εἶπεν αὐτῇ). Der Zusammenhang verlangt jedoch Anna als Sprecherin und Tobit als Angesprochenen; vermutlich liegt hier eine abweichende Lesart oder ein Übertragungsfehler vor.'
    reason: textual_variant
  - marker: b
    text: 'Oder: »Mein Kind ist verloren.« Das griechische Wort kann sowohl Verlorensein als auch Umkommen bezeichnen. Hier äußert die Mutter ihre Befürchtung; der Erzähler bestätigt damit nicht, dass Tobias tot ist.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: »die vierzehn Tage der Hochzeit«; gemeint ist die Dauer der Hochzeitsfeier.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Σίγα
  choice: Sei still!
  rationale: Der knappe Imperativ bewahrt die schroffe Zurückweisung und klingt zugleich natürlich.
- source_word: μὴ πλάνα με
  choice: Führe mich nicht in die Irre!
  rationale: Bewahrt das Bild und unterstellt nicht zwingend eine bewusste Täuschungsabsicht.
- source_word: ἀπώλετο
  choice: ist umgekommen
  rationale: Gibt Annas angstvolle Annahme eines Todes wieder, ohne die mögliche Bedeutung »ist verloren« zu verschweigen; diese steht in der Fußnote.
- source_word: τὸ παιδίον μου
  choice: mein Kind
  rationale: Erhält den mütterlich-zärtlichen Ton und vermeidet die Wiederholung von »Sohn« im folgenden Satz.
- source_word: καθʼ ἡμέραν
  choice: jeden Tag
  rationale: Klare, gegenwärtige deutsche Entsprechung der wiederholten Handlung.
- source_word: εἰς τὴν ὁδὸν ἔξω οἵας ἀπῆλθεν
  choice: hinaus auf die Straße, auf der er fortgegangen war
  rationale: Gibt anschaulich wieder, dass sie immer wieder an dem Weg Ausschau hielt, den Tobias genommen hatte.
- source_word: ἡμέρας τε ἄρτον οὐκ ἤσθιεν
  choice: Tagsüber aß sie kein Brot
  rationale: Behält das konkrete »Brot« des Griechischen bei, auch wenn es allgemein für Nahrung stehen kann.
- source_word: τὰς δὲ νύκτας οὐ διέλιμπανεν θρηνοῦσα
  choice: nachts hörte sie nicht auf, ... zu trauern
  rationale: Drückt die fortdauernde, ununterbrochene Klage in natürlichem Deutsch aus.
- source_word: αἱ δέκα τέσσαρες ἡμέραι τοῦ γάμου
  choice: die vierzehn Tage der Hochzeitsfeier
  rationale: Im Zusammenhang bezeichnet γάμος die Feierzeit der Hochzeit, nicht bloß den Ehestand.
- source_word: ἃς ὤμοσεν Ῥαγουὴλ ποιῆσαι αὐτὸν ἐκεῖ
  choice: die Raguel ihn, wie er geschworen hatte, dort verbringen lassen wollte
  rationale: Löst die gedrängte griechische Konstruktion lesbar auf und erhält sowohl Raguels Schwur als auch Tobias’ vorgesehenen Aufenthalt.
theological_decisions:
- issue: Sprecherzuordnung in καὶ εἶπεν αὐτῇ
  choice: »Da sagte sie zu ihm« im Haupttext, mit textkritischem Hinweis
  alternative: »Da sagte er zu ihr« nach der wörtlichen Form der bereitgestellten Transkription
  rationale: Die bereitgestellte Form αὐτῇ bedeutet »zu ihr«, doch Aussageinhalt, Erzählzusammenhang und die fortgesetzte Schilderung der trauernden Mutter weisen deutlich auf Anna als Sprecherin und Tobit als Angesprochenen. Die Abweichung wird nicht stillschweigend beseitigt, sondern in Fußnote [a] offengelegt.
- issue: Status von Tobias in ἀπώλετο
  choice: 'Als angstvolle Aussage der Mutter formuliert: »ist umgekommen«'
  alternative: »ist verloren«
  rationale: Die Erzählstimme bestätigt Tobias’ Tod nicht. Das mehrdeutige Verb steht in direkter Rede und gibt Annas verzweifelte Schlussfolgerung wieder; die alternative Bedeutung wird in Fußnote [b] bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Erzählführung. Die direkte Rede bleibt knapp und emotional. Konkrete Bilder wie »Brot« und »Straße« werden erhalten; die gedrängte Schlusskonstruktion wird behutsam idiomatisiert. Sämtliche Fußnotenmarker erscheinen im Haupttext.
