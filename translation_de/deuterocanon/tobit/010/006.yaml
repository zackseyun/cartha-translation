  text: And Tobit said to her[a], “Be quiet; do not be anxious. Be well.”
translation:
  language: de
  text: 'Und Tobit sagte zu ihr: „Sei still; mach dir keine Sorgen.[a] Bleib gesund.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Griechisch wörtlich etwa: „Habe kein Wort / keine Angelegenheit.“ Gemeint ist hier wohl: „Mach dir keine Sorgen.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: Σίγα
  choice: Sei still
  rationale: Der Imperativ ist eine knappe Aufforderung, ruhig zu sein. „Sei still“ bewahrt die Direktheit und klingt im heutigen Standarddeutsch natürlich.
- source_word: μὴ λόγον ἔχε
  choice: mach dir keine Sorgen
  rationale: Wörtlich etwa „habe kein Wort/keine Angelegenheit“. Im Zusammenhang dient die Wendung dazu, Annas Unruhe zu beschwichtigen; die idiomatische Wiedergabe vermittelt diesen Sinn verständlich, während die Fußnote die Mehrdeutigkeit des griechischen Ausdrucks offenlegt.
- source_word: ὑγίαινε
  choice: Bleib gesund
  rationale: Der Imperativ von ὑγιαίνω bezeichnet Gesundheit beziehungsweise Wohlergehen. „Bleib gesund“ ist eine knappe, natürliche Aufforderung und bewahrt den gesundheitlichen Bedeutungsanteil.
- source_word: λέγει αὐτῇ
  choice: sagte zu ihr
  rationale: Das historische Präsens des griechischen Erzählstils wird im Deutschen idiomatisch im Präteritum wiedergegeben.
- source_word: Τωβείτ
  choice: Tobit
  rationale: Der Personenname folgt der im Deutschen für dieses Buch und seine Hauptfigur üblichen Form.
