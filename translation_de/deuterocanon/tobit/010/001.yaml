base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/010/001.yaml
  text: And Tobit his father counted each day[a]; and when the days of the journey were completed and they were not coming back[b],
translation:
  language: de
  text: Und sein Vater Tobit zählte Tag für Tag[a]. Als die für die Reise bestimmte Zeit verstrichen war und sie noch immer nicht zurückkamen[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die semitische Parallelüberlieferung erweitert die Szene: Dort zählen die Eltern Tage und Nächte und werden auch in ihrer Sorge geschildert. Der Haupttext folgt hier dem kürzeren Wortlaut der griechischen Hauptquelle.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: »sie noch immer nicht kamen«. Der griechische Imperfekt kann ausdrücken, dass sie nach Ablauf der erwarteten Reisezeit weiterhin nicht eingetroffen waren; im Zusammenhang ist ihre Rückkehr nach Hause gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλογίζετο
  choice: zählte
  rationale: Im Zusammenhang mit »Tag für Tag« bezeichnet das Verb am ehesten das Zählen beziehungsweise Berechnen der vergehenden Tage, nicht ein bloßes Nachdenken.
- source_word: ἑκάστης ἡμέρας
  choice: Tag für Tag
  rationale: Die distributive Bedeutung wird in natürlichem, modernem Deutsch klar wiedergegeben.
- source_word: ἐπληρώθησαν αἱ ἡμέραι τῆς πορείας
  choice: die für die Reise vorgesehene Zeit verstrichen war
  rationale: Die Wendung meint die erwartete Dauer der Reise. »Verstrichen war« ist idiomatisch und vermeidet die hier missverständliche religiöse Färbung von »erfüllt waren«.
- source_word: οὐκ ἤρχοντο
  choice: sie noch immer nicht zurückkamen
  rationale: Der Imperfekt beschreibt die weiterhin ausbleibende Ankunft nach Ablauf der erwarteten Reisezeit. »Zurückkamen« macht aus der Perspektive des zu Hause wartenden Tobit die im Kontext liegende Richtung deutlich; die wörtlichere Möglichkeit wird in einer Fußnote bewahrt.
- source_word: Τωβεὶτ ὁ πατὴρ αὐτοῦ
  choice: sein Vater Tobit
  rationale: Die Apposition wird in eine natürliche deutsche Wortstellung gebracht, ohne ihren Sinn zu verändern.
- source_word: Καὶ
  choice: Und
  rationale: Der einfache erzählerische Anschluss des griechischen Textes bleibt erhalten.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. »Tag für Tag« und »die für die Reise vorgesehene Zeit« geben den zeitlichen Sinn idiomatisch wieder. Das abschließende Komma bewahrt den im vorgelegten griechischen Ausschnitt noch nicht abgeschlossenen Satz.
