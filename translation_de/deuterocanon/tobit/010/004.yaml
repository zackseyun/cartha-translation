  text: Then his wife said to him[a], “The child has perished, because he has been delayed.” And she began to mourn for him and said,
translation:
  language: de
  text: 'Da sagte seine Frau zu ihm: »Das Kind ist umgekommen, weil es so lange ausbleibt.« Und sie begann, um ihn zu klagen[a], und sagte:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Im Griechischen steht »ihn« zweimal (wörtlich etwa: »um ihn, ihn«), möglicherweise zur Betonung oder aufgrund einer Abschreibwiederholung.'
    reason: textual_variant
lexical_decisions:
- source_word: Ἀπώλετο
  choice: ist umgekommen
  rationale: Der Aorist von ἀπόλλυμι gibt hier die angstvolle Schlussfolgerung der Mutter wieder, ihr Sohn sei tot. »Ist umgekommen« bewahrt den Ernst, ohne die Todesart festzulegen.
- source_word: τὸ παιδίον
  choice: das Kind
  rationale: Die Grundbedeutung »das Kind« passt zur emotionalen Rede der Mutter; gemeint ist ihr Sohn Tobias.
- source_word: κεχρόνικεν
  choice: so lange ausbleibt
  rationale: Das Perfekt von χρονίζω bezeichnet ein bereits lange andauerndes Ausbleiben. Das deutsche Präsens ist nach »weil« idiomatisch und bewahrt den fortdauernden Zustand, ohne einen äußeren Verursacher der Verzögerung anzunehmen.
- source_word: ἤρξατο θρηνεῖν
  choice: begann, … zu klagen
  rationale: θρηνεῖν bezeichnet das Einsetzen einer Totenklage oder eines lauten Trauerns. »Um ihn klagen« ist natürliches, würdiges Deutsch und passt zum vermeintlichen Tod.
- source_word: αὐτὸν αὐτὸν
  choice: um ihn
  rationale: Die doppelte Überlieferung des Pronomens klingt im deutschen Haupttext unnatürlich. Ein einzelnes »ihn« vermittelt den Sinn; die Wiederholung wird in einer Fußnote ausgewiesen.
