base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/010/011.yaml
  text: Then Raguel rose and gave him Sarah his wife[a], and half of his possessions—servants and livestock and silver—and after blessing them he sent them away, saying, “May the God of heaven prosper you, children[b], before I die.”
translation:
  language: de
  text: 'Da stand Raguel auf und gab ihm Sara, seine Frau, sowie die Hälfte seines Besitzes: Sklaven[a], Vieh und Silber. Nachdem er sie gesegnet hatte, schickte er sie fort und sagte: »Der Gott des Himmels möge euch Erfolg schenken, Kinder, bevor ich sterbe.«[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Körper«; in dieser Aufzählung von Besitz sind damit Sklaven gemeint.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder als Vorhersage: »Der Gott des Himmels wird euch Erfolg schenken.« Das griechische Futur kann hier als Segenswunsch verstanden werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀναστὰς
  choice: stand ... auf
  rationale: Das aoristische Partizip von ἀνίστημι bezeichnet hier idiomatisch das Aufstehen, um zu handeln; im Deutschen wird es natürlich in die fortlaufende Erzählung eingefügt.
- source_word: ἔδωκεν αὐτῷ Σάρραν τὴν γυναῖκα αὐτοῦ
  choice: gab ihm seine Frau Sara
  rationale: Bewahrt den familiär-rechtlichen Sinn der Übergabe Saras an ihren Ehemann und formuliert die griechische Apposition in natürlichem Deutsch.
- source_word: τὰ ἥμισυ τῶν ὑπαρχόντων
  choice: die Hälfte seines Besitzes
  rationale: ὑπάρχοντα bezeichnet den vorhandenen Besitz; die Sammelbezeichnung wird durch die folgende Aufzählung konkretisiert.
- source_word: σώματα
  choice: Sklaven
  rationale: Wörtlich bedeutet das Wort »Körper«; in einer Aufzählung von Eigentum bezeichnet es jedoch Menschen, die als Besitz gehalten wurden. »Sklaven« macht diese soziale Realität deutlicher als das beschönigende »Diener«.
- source_word: κτήνη
  choice: Vieh
  rationale: Das Wort bezeichnet allgemein als Besitz gehaltene Nutztiere; »Vieh« ist knapp, geläufig und kontextgerecht.
- source_word: ἀργύριον
  choice: Silber
  rationale: Die konkrete Bezeichnung des griechischen Textes bleibt erhalten, auch wenn Silber zugleich als Geld dienen konnte.
- source_word: εὐλογήσας αὐτοὺς
  choice: Nachdem er sie gesegnet hatte
  rationale: Das vorzeitige aoristische Partizip wird als zeitlich vorausgehende Handlung wiedergegeben.
- source_word: ἐξαπέστειλεν
  choice: ließ er sie ziehen
  rationale: Gibt das Aussenden zur Abreise in natürlichem erzählendem Deutsch wieder.
- source_word: Εὐοδώσει ὑμᾶς
  choice: lasse es euch gelingen
  rationale: Das Futur steht im Zusammenhang eines Segens und kann daher als Segenswunsch verstanden werden. Die Formulierung wahrt den allgemeinen Sinn von Erfolg und Wohlergehen, ohne ihn ausschließlich auf die Reise einzuengen.
- source_word: τέκνα
  choice: Kinder
  rationale: Der Vokativ ist eine liebevolle Anrede. Ein Possessivpronomen wie »meine« steht nicht ausdrücklich im griechischen Text.
- source_word: ὁ θεὸς τοῦ οὐρανοῦ
  choice: der Gott des Himmels
  rationale: Die feste ehrfürchtige Gottesbezeichnung wird formal und theologisch offen bewahrt.
- source_word: πρὸ τοῦ μὲ ἀποθανεῖν
  choice: bevor ich sterbe
  rationale: Die Infinitivkonstruktion mit με als Subjektsakkusativ wird idiomatisch als deutscher Nebensatz wiedergegeben.
theological_decisions:
- issue: Aussagekraft des Futurs Εὐοδώσει in der Segensformel
  choice: 'Als Wunsch bzw. Segen: »Der Gott des Himmels lasse es euch gelingen«'
  alternative: 'Als Vorhersage: »Der Gott des Himmels wird es euch gelingen lassen«'
  rationale: Der unmittelbare Zusammenhang von Segnung und Abschied legt eine benediktive Funktion nahe. Die Fußnote bewahrt jedoch die grammatisch mögliche prädiktive Lesart.
- issue: Bezeichnung versklavter Menschen durch σώματα in einer Besitzaufzählung
  choice: Sklaven
  alternative: 'Diener; wörtlich: Körper'
  rationale: Da die genannten Menschen ausdrücklich unter dem Besitz aufgeführt sind, gibt »Sklaven« ihre Stellung sachlich wieder. Die wörtliche Metonymie »Körper« wird in der Fußnote offengelegt.
translation_notes:
  register: Moderne, gut verständliche Standardsprache mit würdigem Erzählton. Die Satzstruktur wurde für natürliches Deutsch gegliedert; die Reihenfolge der Handlungen und die formelhafte Gottesbezeichnung bleiben erhalten. Die Eigentumssprache des Ausgangstextes wird nicht beschönigt.
