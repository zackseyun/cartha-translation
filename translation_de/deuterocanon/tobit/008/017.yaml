  to: Gepriesen seist du, denn du hast mich froh gemacht, und es ist mir nicht so ergangen, wie ich vermutet hatte[a]; vielmehr bist du nach deinem großen Erbarmen mit uns verfahren. Gepriesen seist du, denn du hast dich über zwei Einzelkinder[b] erbarmt. Erbarme dich ihrer, Gebieter, und vollende ihr Leben[c] bei guter Gesundheit und mit Freude und Erbarmen.
