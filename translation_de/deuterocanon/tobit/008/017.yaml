base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/008/017.yaml
  text: Blessed are you[a], because you have made me rejoice, and it has not happened to me as I suspected; rather, according to your abundant mercy, you have acted with us. Blessed are you, because you have shown mercy to two only children. Show them mercy, Master[c][b]; bring their life to completion in health with gladness and mercy.
translation:
  language: de
  text: Gepriesen seist du, denn du hast mich froh gemacht, und es ist mir nicht so ergangen, wie ich vermutet hatte[a]; vielmehr bist du nach deinem großen Erbarmen mit uns verfahren. Gepriesen seist du, denn du hast dich über zwei Einzelkinder[b] erbarmt. Erbarme dich ihrer, Gebieter, und vollende ihr Leben[c] bei guter Gesundheit und mit Freude und Erbarmen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wie ich argwöhnte“. Das griechische Verb kann sowohl eine Vermutung als auch einen argwöhnischen Verdacht ausdrücken; der Zusammenhang legt eine besorgte Erwartung nahe.'
    reason: lexical_alternative
  - marker: b
    text: „Zwei Einzelkinder“ bedeutet, dass beide Ehepartner jeweils das einzige Kind ihrer Eltern waren.
    reason: cultural_note
  - marker: c
    text: Wörtlich steht im Griechischen die Einzahl „ihr Leben“. Möglich ist ein kollektiver Bezug auf das Leben beider; die Formulierung kann jedoch auch allgemeiner verstanden werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλογητὸς
  choice: Gepriesen seist du
  rationale: Die deutsche Segens- und Lobformel gibt das prädikative Adjektiv in der direkten Anrede an Gott würdig und natürlich wieder.
- source_word: ηὔφρανάς
  choice: du hast mich froh gemacht
  rationale: Bewahrt den ausdrücklich kausativen Sinn von εὐφραίνω in verständlichem modernem Deutsch.
- source_word: ὑπενόουν
  choice: ich argwöhnte
  rationale: Gibt die zwischen Vermutung und besorgtem Verdacht liegende Bedeutung wieder, ohne sie eindeutig zu „fürchtete“ zuzuspitzen.
- source_word: κατὰ τὸ πολὺ ἔλεός σου
  choice: nach deinem großen Erbarmen
  rationale: „Nach“ wahrt den Maßstabsbezug von κατά; „großes Erbarmen“ trägt die Betonung von πολύ und klingt im Deutschen natürlich.
- source_word: ἐποίησας μεθʼ ἡμῶν
  choice: du hast an uns gehandelt
  rationale: Hält die Handlung allgemein, wie die griechische Wendung, und verbindet sie idiomatisch mit den Betroffenen.
- source_word: ἠλέησας
  choice: du hast dich ... erbarmt
  rationale: Die verbale Wiederaufnahme des Erbarmens bleibt erhalten und entspricht idiomatischem Deutsch.
- source_word: δύο μονογενεῖς
  choice: zwei Einzelkinder
  rationale: Bezeichnet hier zwei Menschen, von denen jeder das einzige Kind seiner Eltern ist, und vermeidet christologische Nebenbedeutungen von „eingeboren“.
- source_word: δέσποτα
  choice: Gebieter
  rationale: Bewahrt die Unterscheidung von κύριος und bringt die souveräne Autorität der Anrede in würdigem Deutsch zum Ausdruck.
- source_word: συντέλεσον τὴν ζωὴν αὐτῶν
  choice: lass sie ihr gemeinsames Leben vollenden
  rationale: Die kollektive Einzahl ζωή wird als gemeinsames Leben des Paares verständlich gemacht; die Gebetsbitte um einen vollendeten Lebensweg bleibt erhalten.
- source_word: ἐν ὑγείᾳ
  choice: bei Gesundheit
  rationale: Natürliche deutsche Wiedergabe des Zustands körperlichen Wohlergehens.
- source_word: μετὰ εὐφροσύνης καὶ ἐλέους
  choice: mit Freude und Erbarmen
  rationale: Bewahrt sowohl die Freude als auch die Wiederholung des leitenden Erbarmensmotivs.
theological_decisions:
- issue: Gottesbezeichnung δέσποτα
  choice: Gebieter
  alternative: Herr; Herrscher
  rationale: „Gebieter“ erhält die lexikalische Abgrenzung gegenüber κύριος, ohne eine konfessionelle Sonderdeutung einzutragen.
- issue: Bedeutung von μονογενεῖς
  choice: zwei Einzelkinder
  alternative: zwei Einziggeborene; zwei einzigartige Menschen
  rationale: Im Erzählzusammenhang geht es um den familiären Status beider Eheleute als jeweils einziges Kind, nicht um metaphysische Einzigartigkeit.
- issue: Singular τὴν ζωὴν αὐτῶν
  choice: ihr gemeinsames Leben
  alternative: ihr Leben; ihre Leben
  rationale: Der kollektive Singular bleibt sichtbar, ohne die deutsche Formulierung unnatürlich oder missverständlich werden zu lassen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit gebetsartigem Ton. Die wiederholte Erbarmenssprache und die lexikalische Unterscheidung der Gottesbezeichnungen bleiben erhalten; erklärungsbedürftige familiäre und grammatische Einzelheiten stehen in Fußnoten.
