  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Der elliptische letzte Satzteil wurde durch „soll er erhalten“ behutsam ergänzt und die Ergänzung in der Fußnote kenntlich gemacht. Die im englischen Konsultationstext offenbar vertauschten Fußnotenmarker wurden ihren tatsächlichen Bezugspunkten zugeordnet.
