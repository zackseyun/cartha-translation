translation:
  language: de
  text: Und dann soll er, nachdem er die Hälfte seines Besitzes genommen hat, wohlbehalten zu deinem Vater[a] gehen; den Rest soll er erhalten, wenn meine Frau und ich gestorben sind.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „zu dem Vater“; der Zusammenhang der direkten Anrede spricht für „zu deinem Vater“.'
    reason: lexical_alternative
  - marker: b
    text: 'Der letzte Satzteil ist im Griechischen verkürzt: wörtlich etwa „und den Rest, wenn ich sterbe und meine Frau“. Gemeint ist offenbar, dass er den Rest nach dem Tod beider Ehepartner erhalten soll.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λαβόντα
  choice: soll er … nehmen
  rationale: Das griechische Aoristpartizip ist dem Infinitiv πορεύεσθαι untergeordnet. Im Deutschen gibt die Verbindung mit „soll“ den in diesem Satzgefüge vorausgesetzten Plan natürlich wieder; die Abfolge bleibt durch „nehmen und … ziehen“ erkennbar.
- source_word: τὸ ἥμισυ
  choice: die Hälfte
  rationale: Direkte und idiomatische Wiedergabe der Mengenangabe.
- source_word: τῶν ὑπαρχόντων αὐτοῦ
  choice: seines Besitzes
  rationale: τὰ ὑπάρχοντα bezeichnet vorhandenes Eigentum oder Vermögen. Das Pronomen αὐτοῦ wird entsprechend seiner Form als „seines“ bewahrt und nicht stillschweigend in „meines“ geändert.
- source_word: πορεύεσθαι
  choice: ziehen
  rationale: „Ziehen“ bezeichnet hier eine Reise zu einem Ziel und klingt im Zusammenhang natürlicher und würdevoller als das allgemeinere „gehen“.
- source_word: μετὰ ὑγείας
  choice: bei guter Gesundheit
  rationale: Die Formulierung bewahrt den ausdrücklichen Bezug auf Gesundheit und verengt ihn nicht auf bloße Reisesicherheit.
- source_word: πρὸς τὸν πατέρα
  choice: zu deinem Vater
  rationale: Im Griechischen steht wörtlich nur „zu dem Vater“. Der Zusammenhang der direkten Anrede macht den Vater des Angesprochenen wahrscheinlich; die Ergänzung wird in einer Fußnote offengelegt.
- source_word: τὰ λοιπά
  choice: den Rest
  rationale: Natürliche Wiedergabe des verbleibenden Anteils am Besitz.
- source_word: ὅταν ἀποθάνω καὶ ἡ γυνή μου
  choice: wenn meine Frau und ich gestorben sind
  rationale: Die griechische Klausel ist verkürzt und lautet formal etwa „wenn ich sterbe und meine Frau“. Die deutsche Fassung macht verständlich, dass der Tod beider Ehepartner gemeint ist, ohne eine Reihenfolge zu behaupten.
