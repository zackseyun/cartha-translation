base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/008/006.yaml
  text: You made Adam[a], and you gave him Eve as a helper and support, his wife; from these came the seed of mankind. You said, ‘It is not good for the man to be alone[b]; let us make for him a helper like himself.’
translation:
  language: de
  text: 'Du hast Adam gemacht und ihm Eva, seine Frau, als Helferin und Stütze gegeben. Von ihnen stammt das Menschengeschlecht[a]. Du hast gesagt: »Es ist nicht gut, dass der Mensch allein ist[b]. Lasst uns ihm eine Helferin machen, die ihm gleich ist.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »der Same der Menschen«; gemeint ist die von Adam und Eva abstammende Menschheit.'
    reason: lexical_alternative
  - marker: b
    text: Diese Worte greifen Genesis 2,18 auf.
    reason: cross_reference
lexical_decisions:
- source_word: ἐποίησας
  choice: du hast … gemacht
  rationale: Gibt ποιέω direkt wieder und vermeidet eine unnötige Spezialisierung auf »erschaffen«, obwohl der Schöpfungskontext deutlich bleibt.
- source_word: Ἀδάμ
  choice: Adam
  rationale: Der Personenname wird in seiner geläufigen deutschen Form wiedergegeben.
- source_word: ἔδωκας
  choice: gegeben
  rationale: Direkte und natürliche Wiedergabe von δίδωμι im Sinn göttlicher Zuwendung.
- source_word: βοηθὸν … στήριγμα
  choice: als Helferin und Stütze
  rationale: Bewahrt sowohl die Verbindung zum Schöpfungsbericht als auch das Bild einer tragenden Unterstützung. Die feminine Form ist im Deutschen durch Eva als Bezugsperson erforderlich.
- source_word: τὴν γυναῖκα αὐτοῦ
  choice: Eva, seine Frau
  rationale: Die Apposition wird klar auf Eva bezogen; γυνή bedeutet im ehelichen Zusammenhang natürlich »Frau« im Sinn von Ehefrau.
- source_word: ἐκ τούτων
  choice: von ihnen
  rationale: Bezieht die Herkunft der Menschheit knapp und eindeutig auf Adam und Eva.
- source_word: τὸ ἀνθρώπων σπέρμα
  choice: das Menschengeschlecht
  rationale: Ist im Deutschen eine natürliche Bezeichnung für die gesamte von dem Paar abstammende Menschheit; eine Fußnote bewahrt zugleich das konkrete griechische Bild vom »Samen«.
- source_word: Οὐ καλὸν εἶναι τὸν ἄνθρωπον μόνον
  choice: Es ist nicht gut, dass der Mensch allein ist
  rationale: Folgt eng dem Griechischen und lässt den Anklang an Genesis 2,18 deutlich hörbar werden.
- source_word: ποιήσωμεν
  choice: Lasst uns … machen
  rationale: Gibt den hortativen Aoristkonjunktiv in der ersten Person Plural wieder und erhält die auffällige Pluralform.
- source_word: ὅμοιον αὐτῷ
  choice: die ihm gleich ist
  rationale: Gibt die im griechischen Text ausgesagte Ähnlichkeit ohne die stärkere, aus dem hebräischen Hintergrund mögliche Deutung »die ihm entspricht« wieder.
theological_decisions:
- issue: Konkretes Abstammungsbild in τὸ ἀνθρώπων σπέρμα
  choice: Im Haupttext »Menschengeschlecht«, mit wörtlicher Bedeutung in der Fußnote
  alternative: »der Same der Menschen« oder »die Nachkommenschaft der Menschen«
  rationale: »Menschengeschlecht« ist im Deutschen verständlich und bezeichnet hier die gesamte Menschheit. Die Fußnote verhindert, dass das genealogische Bild des griechischen σπέρμα unsichtbar wird.
- issue: Anspielung auf Genesis 2,18
  choice: Die Schlüsselwendungen »nicht gut«, »allein«, »Helferin« und »Lasst uns … machen« werden beibehalten
  alternative: Eine freiere moderne Umschreibung
  rationale: Das Gebet ruft erkennbar den Schöpfungsbericht auf; eine quellennähere Formulierung bewahrt diese innerbiblische Verbindung.
- issue: Bedeutung von ὅμοιον αὐτῷ
  choice: »die ihm gleich ist«
  alternative: »die ihm entspricht«
  rationale: »Entspricht« könnte den hebräischen Hintergrund von Genesis 2,18 stärker abbilden, als es der hier vorliegende griechische Ausdruck ὅμοιος selbst verlangt. »Gleich« bewahrt die Aussage dieses Zeugen und lässt ihre genaue Reichweite offen.
translation_notes:
  register: 'Modernes, würdiges Standarddeutsch. Die Satzstellung macht die griechische Apposition eindeutig: Eva ist Adams Frau und zugleich die genannte Helferin und Stütze. Die Formulierung bleibt nahe am Schöpfungsbericht, ohne den griechischen Text durch Rückübersetzung aus dem Hebräischen zu erweitern.'
