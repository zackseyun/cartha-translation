base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/008/002.yaml
  text: As he went in[a], he remembered the words of Raphael, and he took the ashes of the incense and placed the fish’s heart and liver on them, and made them smoke.
translation:
  language: de
  text: Als er hineinging[a], erinnerte er sich an die Worte Rafaels. Er nahm die Asche des Räucherwerks, legte das Herz und die Leber des Fisches darauf und ließ beides qualmen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „als er ging“. Das griechische Partizip bezeichnet allgemein eine Bewegung; der Zusammenhang legt hier das Hineingehen in das Zimmer nahe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πορευόμενος
  choice: als er hineinging
  rationale: Das Partizip bezeichnet eine begleitende Bewegung. Der unmittelbare Zusammenhang legt das Betreten des Zimmers nahe; die Fußnote bewahrt die allgemeinere lexikalische Möglichkeit.
- source_word: ἐμνήσθη
  choice: erinnerte er sich
  rationale: Die gewöhnliche deutsche Wiedergabe bezeichnet das Wieder-ins-Gedächtnis-Kommen und passt zur Erzählfolge.
- source_word: λόγων
  choice: Worte
  rationale: Die direkte Entsprechung lässt offen, dass es sich dem Kontext nach um Anweisungen handelte.
- source_word: τέφραν τῶν θυμιαμάτων
  choice: die Asche des Räucherwerks
  rationale: „Räucherwerk“ bezeichnet hier natürlich den verbrannten aromatischen Stoff, dessen Asche genommen wird, ohne eine engere kultische Bedeutung einzutragen.
- source_word: ἐπέθηκεν
  choice: legte ... darauf
  rationale: Das Verb bezeichnet das Auflegen; „darauf“ nimmt idiomatisch die zuvor genannte Asche auf.
- source_word: τὴν καρδίαν τοῦ ἰχθύος καὶ τὸ ἧπαρ
  choice: das Herz und die Leber des Fisches
  rationale: Die Formulierung gibt beide konkreten Organe präzise und in natürlichem Deutsch wieder.
- source_word: ἐκάπνισεν
  choice: ließ beides qualmen
  rationale: Das Verb bezeichnet das Hervorbringen von Rauch. „Qualmen“ vermittelt die konkrete Rauchentwicklung, ohne einen nicht ausdrücklich genannten technischen Ritus einzutragen; „beides“ bezieht sich eindeutig auf Herz und Leber.
theological_decisions:
- issue: Verhältnis der griechischen Kurzfassung zur längeren semitischen beziehungsweise Langfassung dieser Szene
  choice: Die Handlung des griechischen Textes wird ohne Erweiterung übersetzt; nur die kontextuell naheliegende Bedeutung des Hineingehens wird im Haupttext ausgedrückt und in einer Fußnote als nicht zwingend markiert.
  alternative: Schlichter „als er ging“ oder eine harmonisierende Erweiterung um das Gebet der längeren Überlieferung.
  rationale: Der griechische Text bleibt die maßgebliche Vorlage. Der Szenenzusammenhang stützt „hineinging“, rechtfertigt aber keine Aufnahme von Material, das in diesem griechischen Vers nicht steht.
translation_notes:
  register: Modernes, würdevolles Erzählregister. „Rafaël“ folgt einer im Deutschen klar lesbaren Namensform; „Räucherwerk“ ist geläufiger und präziser als eine unnötig technische Kultbezeichnung. Der Fußnotenmarker [a] steht unmittelbar bei der betroffenen Formulierung.
