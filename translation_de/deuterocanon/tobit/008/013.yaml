lexical_decisions:
- source_word: καὶ
  choice: Und
  rationale: Der gewöhnliche erzählende Anschluss bleibt erhalten.
- source_word: εἰσῆλθεν
  choice: trat ein
  rationale: Der Aorist von εἰσέρχομαι bezeichnet hier das Hineingehen; »trat ein« ist in einer häuslichen Szene natürlich und präzise.
- source_word: ἡ παιδίσκη
  choice: das Dienstmädchen
  rationale: παιδίσκη bezeichnet eine junge weibliche Dienstperson und kann je nach sozialem Kontext auch eine Sklavin meinen. »Dienstmädchen« wahrt Geschlecht und Dienststellung in verständlichem Deutsch.
- source_word: ἀνοίξασα
  choice: öffnete … und
  rationale: 'Das vorzeitige Aoristpartizip wird idiomatisch als erste Handlung einer deutschen Verbfolge wiedergegeben: Sie öffnete zunächst die Tür und trat dann ein.'
- source_word: τὴν θύραν
  choice: die Tür
  rationale: θύρα bezeichnet in diesem häuslichen Zusammenhang gewöhnlich eine Tür, nicht ein Tor.
