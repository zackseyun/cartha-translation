base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/008/020.yaml
  text: And Raguel said to him under oath[a], before the days of the wedding were completed, that he should not leave unless the fourteen days of the wedding were fulfilled,
translation:
  language: de
  text: Noch bevor die Hochzeitstage zu Ende waren, sagte Raguël ihm unter Eid[a], er solle nicht abreisen, solange die vierzehn Hochzeitstage nicht vollendet seien.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit einem Eid“. Das griechische Adverb besagt, dass Raguël seine Anweisung durch einen Eid bekräftigte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὶν ἢ συντελεσθῆναι
  choice: noch bevor … zu Ende waren
  rationale: Die Wendung bezeichnet einen Zeitpunkt vor dem Abschluss des genannten Zeitraums; die deutsche Formulierung ist natürlich und bewahrt den zeitlichen Bezug.
- source_word: τὰς ἡμέρας τοῦ γάμου
  choice: die Hochzeitstage
  rationale: Die kompakte Wiedergabe bezeichnet die festgelegte Zeit der Hochzeit beziehungsweise Hochzeitsfeier, ohne mehr als der griechische Ausdruck festzulegen.
- source_word: ἐνόρκως
  choice: unter Eid
  rationale: Das Adverb kennzeichnet Raguëls Aussage als eidlich bekräftigt; „unter Eid“ ist im modernen Deutschen klar und idiomatisch.
- source_word: μὴ ἐξελθεῖν αὐτόν
  choice: er solle nicht abreisen
  rationale: Der Infinitiv gibt den Inhalt der Anweisung wieder. Im Zusammenhang ist nicht bloß das Hinausgehen aus einem Gebäude, sondern das Fortgehen vom Aufenthaltsort gemeint.
- source_word: ἐὰν μὴ πληρωθῶσιν
  choice: solange … nicht vollendet seien
  rationale: Diese Formulierung bewahrt die negative Bedingung des Griechischen und gibt zugleich idiomatisch wieder, dass die Abreise erst nach Ablauf des Zeitraums gestattet ist.
- source_word: αἱ δέκα τέσσαρες ἡμέραι τοῦ γάμου
  choice: die vierzehn Hochzeitstage
  rationale: Zahl und Bezug auf den vollständigen Hochzeitszeitraum bleiben ausdrücklich erhalten.
