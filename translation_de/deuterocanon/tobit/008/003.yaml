base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/008/003.yaml
  text: But when the demon smelled the odor[a], it fled to the remotest parts of Egypt, and the angel bound it.
translation:
  language: de
  text: Als aber der Dämon den Geruch wahrnahm, floh er in die äußersten Gebiete Ägyptens[a], und der Engel band ihn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „nach Oberägypten“; wörtlicher auch: „in die obersten Gebiete Ägyptens“.'
    reason: Die griechische Wendung kann entweder allgemein räumlich oder als Hinweis auf Oberägypten verstanden werden.
lexical_decisions:
- source_word: ὠσφράνθη
  choice: nahm … wahr
  rationale: Das deponentische Verb bezeichnet hier aktives Wahrnehmen durch den Geruchssinn. „Den Geruch wahrnahm“ ist im Deutschen natürlicher und eindeutiger als „roch“.
- source_word: τὸ δαιμόνιον
  choice: der Dämon
  rationale: Die Erzählung beschreibt ein handelndes, feindliches Geistwesen. „Dämon“ entspricht dem griechischen Ausdruck direkt, ohne die Aussage abzuschwächen.
- source_word: τῆς ὀσμῆς
  choice: den Geruch
  rationale: ὀσμή bezeichnet einen Geruch. Die neutrale Wiedergabe vermeidet die positive Nebenbedeutung von „Duft“ und passt zum Rauch der verbrannten Fischorgane.
- source_word: ἔφυγεν
  choice: floh
  rationale: Das Verb bezeichnet eine Flucht; „floh“ gibt die kraftvolle und knappe Erzählweise wieder.
- source_word: εἰς τὰ ἀνώτατα Αἰγύπτου
  choice: in die äußersten Gebiete Ägyptens
  rationale: ἀνώτατα ist ein Superlativ mit räumlicher Bedeutung. „Äußerste Gebiete“ bewahrt die offene geografische Aussage, ohne sie eindeutig als den Eigennamen „Oberägypten“ festzulegen.
- source_word: ἔδησεν
  choice: band
  rationale: δέω bedeutet gewöhnlich „binden“. Die schlichte Wiedergabe lässt Art und Dauer der Fesselung offen.
- source_word: ὁ ἄγγελος
  choice: der Engel
  rationale: Der bestimmte Singular verweist im Kontext auf Rafael, doch der Vers selbst nennt keinen Namen; deshalb bleibt die Übersetzung beim Wortlaut.
theological_decisions:
- issue: Wesen des δαιμόνιον
  choice: ein persönliches feindliches Geistwesen („Dämon“)
  alternative: „böser Geist“
  rationale: Das Wesen nimmt den Geruch wahr, flieht und wird vom Engel gebunden. „Dämon“ bildet diese personale Darstellung direkt ab.
- issue: Geografische Bedeutung von εἰς τὰ ἀνώτατα Αἰγύπτου
  choice: „in die äußersten Gebiete Ägyptens“
  alternative: „nach Oberägypten“ oder „in die obersten Gebiete Ägyptens“
  rationale: Die Formulierung kann geografisch auf Oberägypten weisen, ist im Griechischen jedoch kein zwingend festgelegter Eigenname. Die Hauptübersetzung wahrt diese Mehrdeutigkeit; die Fußnote nennt die naheliegende geografische Deutung.
translation_notes:
  register: Moderne, gut verständliche Standardsprache mit würdigem erzählerischem Ton. Das vorangestellte „Als aber“ bildet den griechischen Anschluss ab; die Pronomen „er“ und „ihn“ sind im Deutschen grammatisch auf den maskulinen „Dämon“ bezogen.
