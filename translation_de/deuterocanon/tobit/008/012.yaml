  text: And Edna said to his wife, “Send one of the servant girls, and let them see whether he is alive; but if not, so that we may bury him and no one may know.”
translation:
  language: de
  text: 'Und Edna sagte zu seiner Frau: „Schick eine der Dienerinnen, und sie sollen nachsehen, ob er lebt[a]. Doch wenn nicht, wollen wir ihn begraben, damit niemand davon erfährt.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Griechischen steht „sie sollen nachsehen“ im Plural, obwohl unmittelbar zuvor nur eine Dienerin genannt wird. Dieser auffällige Numeruswechsel wird in der Übersetzung beibehalten.
    reason: textual_variant
lexical_decisions:
- source_word: Ἀπόστειλον
  choice: Schick
  rationale: Der Imperativ von ἀποστέλλω wird mit dem natürlichen, gegenwärtigen deutschen Ausdruck „Schick“ wiedergegeben.
- source_word: μίαν τῶν παιδισκῶν
  choice: eine von den Dienerinnen
  rationale: παιδίσκη bezeichnet eine weibliche Hausbedienstete und kann auch eine Sklavin meinen. „Dienerin“ bewahrt Geschlecht und häusliche Funktion, ohne einen rechtlichen Status festzulegen, den der unmittelbare Kontext nicht hervorhebt.
- source_word: ἰδέτωσαν
  choice: sie sollen nachsehen
  rationale: Der überlieferte griechische Text hat trotz des vorausgehenden Singulars einen Imperativ der dritten Person Plural. Die Übersetzung erhält diesen Numeruswechsel und gibt ὁράω in diesem Zusammenhang idiomatisch mit „nachsehen“ wieder.
- source_word: εἰ ζῇ
  choice: ob er lebt
  rationale: Die indirekte Entscheidungsfrage wird im Deutschen natürlich mit „ob“ formuliert; „lebt“ bewahrt die knappe Ausdrucksweise des Griechischen.
- source_word: ἵνα θάψωμεν αὐτόν
  choice: wollen wir ihn begraben
  rationale: Der finale Zusammenhang wird nach der elliptischen Bedingung „Wenn nicht“ im Deutschen als beabsichtigtes Handeln natürlich ausgedrückt.
- source_word: καὶ μηδεὶς γνῷ
  choice: ohne dass jemand davon erfährt
  rationale: Die Fortsetzung der Zweckvorstellung bezeichnet die beabsichtigte Geheimhaltung. „Davon erfährt“ ist in diesem Kontext natürlicher als das isolierte „weiß“ und lässt den Gegenstand aus dem Zusammenhang hervorgehen.
