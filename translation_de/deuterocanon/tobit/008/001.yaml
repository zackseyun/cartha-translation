base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/008/001.yaml
  text: And when they had finished dining[b][a], they brought Tobiah in to her.
translation:
  language: de
  text: Als sie mit dem Essen fertig waren, brachten sie Tobija[b] zu ihr hinein.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Griechisch: „Sie brachten Tobija zu ihr.“ Die semitische Parallelüberlieferung schildert die Szene ausführlicher: Das Zimmer und das Bett werden vorbereitet, das Paar geht gemeinsam hinein, und die Tür wird hinter beiden geschlossen.'
    reason: alternative_reading
  - marker: b
    text: Traditionell wird der Name häufig mit „Tobias“ wiedergegeben; „Tobija“ entspricht stärker seiner semitischen Form.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅτε δὲ
  choice: Als
  rationale: Leitet in natürlichem deutschem Erzählstil das zeitlich anschließende Geschehen ein. Die fortführende Funktion von δέ ergibt sich aus dem Zusammenhang und muss nicht eigens mit „und“ wiedergegeben werden.
- source_word: συνετέλεσαν δειπνοῦντες
  choice: sie mit dem Essen fertig waren
  rationale: Gibt die Verbindung aus „vollenden/beenden“ und dem Partizip „essen, die Hauptmahlzeit einnehmen“ idiomatisch wieder, ohne eine kulturell zu enge Festlegung auf Mittag- oder Abendessen.
- source_word: εἰσήγαγον
  choice: brachten sie
  rationale: Das Verb bezeichnet das Hineinbringen oder Hineinführen. Im Deutschen ist „brachten sie … zu ihr“ hier flüssig; die Bewegung in den Raum ist aus der Szene erschließbar.
- source_word: Τωβείαν
  choice: Tobija
  rationale: Die Form „Tobija“ gibt den semitischen Namen im Deutschen angemessen wieder; „Tobias“ ist die herkömmliche, stärker griechisch-lateinisch geprägte Namensform.
- source_word: πρὸς αὐτήν
  choice: zu ihr
  rationale: πρός mit Akkusativ bezeichnet hier die Bewegung zu der Frau hin. „Zu ihr“ wahrt die knappe Formulierung des Griechischen, ohne den ehelichen Kontext weiter auszudeuten.
theological_decisions:
- issue: Namensform Τωβείαν
  choice: Tobija
  alternative: Tobias
  rationale: Personennamen werden nach einer im Deutschen geläufigen semitischen Form transliteriert. Die traditionelle Form „Tobias“ bleibt als Alternative in der Fußnote kenntlich.
- issue: Umfang der Szene
  choice: Die knappe griechische Lesart steht im Haupttext.
  alternative: Die semitische Parallelüberlieferung erweitert die Szene um die Vorbereitung des Zimmers und das gemeinsame Eintreten des Paares.
  rationale: Der angegebene griechische Text ist die primäre Übersetzungsgrundlage. Die abweichende, ausführlichere Parallelüberlieferung wird dokumentiert, aber nicht in den Haupttext eingetragen.
translation_notes:
  register: Moderner, würdiger und leicht verständlicher Erzählstil. Die Formulierung bleibt knapp wie der griechische Ausgangstext und vermeidet sowohl altertümliches „speisen“ als auch eine unnötige Festlegung auf „Abendessen“.
