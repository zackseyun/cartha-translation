base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/008/004.yaml
  text: And when the two of them had been shut in together[a], Tobiah rose from the bed and said, “Get up, sister[b], and let us pray that the Lord may show us mercy.”
translation:
  language: de
  text: 'Als die beiden eingeschlossen worden waren[a], stand Tobias vom Bett auf und sagte: »Steh auf, Schwester[b], und lass uns beten, damit der Herr sich unser erbarmt.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »als beide zusammen eingeschlossen worden waren«. Gemeint ist, dass das Paar gemeinsam in der Kammer eingeschlossen worden war.'
    reason: lexical_alternative
  - marker: b
    text: »Schwester« ist die griechische Anrede für seine Braut und spiegelt die in dieser Erzählung verwendete verwandtschaftliche Ausdrucksweise wider.
    reason: cultural_note
lexical_decisions:
- source_word: συνεκλείσθησαν
  choice: zusammen eingeschlossen worden waren
  rationale: Die passive Form und die zeitliche Abfolge bleiben erhalten. Die Wendung bezeichnet hier, dass das Paar gemeinsam in der Kammer eingeschlossen worden war.
- source_word: ἀμφότεροι
  choice: sie beide
  rationale: Die Form hebt ausdrücklich beide Personen als Paar hervor und klingt im Deutschen natürlich.
- source_word: ἀνέστη
  choice: stand … auf
  rationale: Dies gibt die körperliche Bewegung vom Bett weg klar und idiomatisch wieder.
- source_word: κλίνης
  choice: Bett
  rationale: Im Zusammenhang der Hochzeitskammer ist „Bett“ die klare, gewöhnliche Bedeutung.
- source_word: Ἀνάστηθι
  choice: Steh auf
  rationale: Der Imperativ entspricht unmittelbar der zuvor von Tobias selbst vollzogenen Handlung.
- source_word: ἀδελφή
  choice: Schwester
  rationale: Die wörtliche Anrede des griechischen Textes bleibt erhalten; ihre verwandtschaftlich geprägte Verwendung für die Braut wird in einer Fußnote erläutert.
- source_word: προσευξώμεθα
  choice: lass uns beten
  rationale: Der hortative Konjunktiv der ersten Person Plural wird mit der im modernen Deutschen üblichen Aufforderungsform wiedergegeben.
- source_word: ἐλεήσῃ
  choice: sich unser erbarmt
  rationale: Die Formulierung gibt das Erweisen von Erbarmen präzise, natürlich und in einem dem Gebet angemessenen Register wieder.
- source_word: ὁ κύριος
  choice: der Herr
  rationale: Die feste biblische Wiedergabe von κύριος passt hier sowohl zum griechischen Artikel als auch zum Gebetskontext.
theological_decisions:
- issue: Anrede ἀδελφή an Tobias’ Braut
  choice: Im Haupttext wörtlich mit „Schwester“ wiedergeben
  alternative: Deutend „meine Frau“ oder „liebe Frau“ schreiben beziehungsweise die Anrede auslassen
  rationale: Der griechische Text nennt ausdrücklich „Schwester“. Die ungewöhnliche verwandtschaftliche Anrede wird nicht theologisch geglättet, sondern bewahrt und durch eine Fußnote in ihrem Erzählzusammenhang erläutert.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Die Erzählung bleibt syntaktisch flüssig; die ungewöhnliche Anrede und der passive Ausdruck des griechischen Textes werden bewusst bewahrt.
