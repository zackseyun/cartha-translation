lexical_decisions:
- source_word: ἐκέλευσεν
  choice: befahl
  rationale: Das Verb κελεύω bezeichnet das Erteilen eines verbindlichen Auftrags. „Befahl“ gibt die autoritative Kraft knapp und natürlich wieder.
- source_word: τοῖς οἰκέταις
  choice: den Dienern
  rationale: οἰκέταις bezeichnet Angehörige des Hauspersonals und kann je nach sozialem Kontext auch Haussklaven meinen. „Dienern“ ist hier eine natürliche, knappe Wiedergabe, ohne den im Vers nicht näher bestimmten Rechtsstatus festzulegen.
- source_word: χῶσαι
  choice: zuzuschütten
  rationale: χῶσαι, der Aoristinfinitiv von χόω, meint hier das Auffüllen oder Bedecken mit Erde. In Verbindung mit einem Grab bezeichnet „zuschütten“ die konkrete Handlung präzise.
- source_word: τὸν τάφον
  choice: das Grab
  rationale: τάφος kann Grab oder Grabstätte bedeuten. Da es in diesem Zusammenhang zugeschüttet werden soll, ist „Grab“ die idiomatische und sachlich passende Wahl.
