base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/008/016.yaml
  text: And Raguel blessed God[a], saying, “Blessed are you, O God, with every blessing; and may your holy ones bless you, and all your creatures[c][b]; may all your angels and your chosen ones bless you forever.”
translation:
  language: de
  text: 'Und Raguel pries Gott und sprach: »Gepriesen bist du, Gott, mit allem Lobpreis. Dich sollen deine Heiligen[a] preisen und alle deine Geschöpfe[b]; alle deine Engel und deine Erwählten[c] sollen dich preisen in Ewigkeit.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »deine heiligen Wesen«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »deine ganze Schöpfung«.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »die von dir Auserwählten«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλόγησεν / Εὐλογητὸς / εὐλογείτωσάν
  choice: pries / Gepriesen / sollen preisen
  rationale: Die Wortfamilie wird im Deutschen durchgehend mit »preisen/gepriesen« wiedergegeben. Das ist bei einem an Gott gerichteten Lob natürlich und bewahrt zugleich die liturgische Wiederholung besser als das missverständliche »Gott segnen«.
- source_word: ἐν πάσῃ εὐλογίᾳ
  choice: in jedem Lobpreis
  rationale: Die Formulierung hält sich eng an ἐν und πάσῃ, gibt εὐλογία in diesem doxologischen Zusammenhang als »Lobpreis« wieder und vermeidet das im Deutschen unnatürliche »mit jedem Segen«.
- source_word: οἱ ἅγιοί σου
  choice: deine Heiligen
  rationale: »Heilige« ist die klare und geläufige Wiedergabe von ἅγιοι; der Ausdruck bleibt hinsichtlich menschlicher oder himmlischer Referenten offen.
- source_word: πᾶσαι αἱ κτίσεις σου
  choice: alle deine Geschöpfe
  rationale: Der Plural »Geschöpfe« entspricht dem griechischen Plural κτίσεις und bezeichnet natürlich das von Gott Geschaffene.
- source_word: οἱ ἐκλεκτοί σου
  choice: deine Erwählten
  rationale: »Erwählte« gibt den Kern von ἐκλεκτοί präzise wieder, ohne die im Text nicht näher bestimmte Gruppe einzugrenzen.
- source_word: εἰς τοὺς αἰῶνας
  choice: in Ewigkeit
  rationale: Die traditionelle, weiterhin verständliche doxologische Wendung gibt die unbegrenzte Dauer idiomatisch wieder.
theological_decisions:
- issue: Bezug von »deine Heiligen« und »deine Erwählten« neben den ausdrücklich genannten Engeln
  choice: Die Gruppen werden allgemein als »deine Heiligen« und »deine Erwählten« bezeichnet.
  alternative: Beide Gruppen ausdrücklich als Engel oder als gläubige Menschen bestimmen.
  rationale: Der griechische Text legt nicht fest, ob damit gerechte Menschen, himmlische Wesen oder beide gemeint sind. Die Übersetzung bewahrt diese Offenheit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit liturgischem Klang. »Und sprach« gibt λέγων idiomatisch wieder. Die parallelen Aufforderungen und die Wiederholung von »preisen« bilden die Struktur des griechischen Satzes ab; vor »deine Heiligen« wurde kein »alle« ergänzt, da dort im Griechischen kein πᾶς steht.
