  text: And Raguel got up[a], went and dug a grave, saying, “Perhaps he too may die.”
translation:
  language: de
  text: 'Und Raguel stand auf, ging und grub ein Grab. Er sagte: »Vielleicht stirbt auch dieser.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: »Nicht dass etwa auch dieser stirbt!« Die griechische Formulierung drückt Raguels Befürchtung aus, Tobias könne wie die früheren Bräutigame sterben.'
    reason: Die alternative Wiedergabe macht die mit μή und dem Konjunktiv ausgedrückte besorgte Erwartung deutlicher.
lexical_decisions:
- source_word: ἀναστὰς
  choice: stand auf
  rationale: Das Aoristpartizip von ἀνίστημι leitet in erzählender Folge Raguëls nächste Handlung ein; »stand auf« gibt die körperliche Bewegung natürlich und genau wieder.
- source_word: ἐπορεύθη
  choice: ging hin
  rationale: Das Verb bezeichnet hier schlicht das Gehen zu dem Ort, an dem Raguël das Grab aushebt. »Hin« macht die Bewegung im Deutschen idiomatisch, ohne ein im Griechischen nicht ausdrücklich genanntes Hinausgehen aus einem Gebäude zu behaupten.
- source_word: ὤρυξεν
  choice: grub
  rationale: Das Verb bezeichnet das tatsächliche Ausheben; »grub« ist die schlichte und genaue erzählerische Wiedergabe.
- source_word: τάφον
  choice: ein Grab
  rationale: τάφος kann Grab oder Grabstätte bedeuten. Zusammen mit »grub« ist »Grab« im Deutschen die naheliegende Bezeichnung.
- source_word: λέγων
  choice: Dabei sagte er
  rationale: Das Partizip führt Raguëls begleitende Äußerung ein. Die finite Form ist in modernem Deutsch natürlich und lässt den zeitlichen Zusammenhang erkennen.
- source_word: Μὴ καὶ οὗτος ἀποθάνῃ
  choice: Vielleicht stirbt auch dieser
  rationale: μή mit dem Konjunktiv bringt hier eine befürchtete Möglichkeit zum Ausdruck. Die Formulierung bewahrt Ungewissheit und Sorge; »auch dieser« stellt Tobias in die Reihe der früheren Bräutigame, ohne seinen Namen ergänzend einzufügen.
theological_decisions: []
translation_notes:
  register: Schlichte, würdige Erzählsprache in modernem Standarddeutsch. Der Name wird als »Raguël« geschrieben, damit die getrennte Aussprache der Vokale erkennbar bleibt. Die im Griechischen nicht ausdrücklich genannte Angabe »hinaus« wurde nicht ergänzt.
