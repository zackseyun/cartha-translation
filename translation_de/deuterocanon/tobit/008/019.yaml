translation:
  language: de
  text: Und er veranstaltete für sie ein vierzehntägiges Hochzeitsfest.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Und er veranstaltete für sie eine Hochzeit, die vierzehn Tage dauerte.« Das griechische Wort γάμος kann sowohl die Hochzeit selbst als auch das Hochzeitsfest oder die Hochzeitsfeier bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐποίησεν
  choice: veranstaltete
  rationale: ποιέω bedeutet wörtlich »machen/tun«, bezeichnet mit γάμον als Objekt aber idiomatisch das Ausrichten oder Feiern einer Hochzeit. »Veranstaltete« gibt diese Bedeutung in natürlichem Deutsch wieder.
- source_word: αὐτοῖς
  choice: für sie
  rationale: Der Dativ bezeichnet hier die Begünstigten. Aus dem Zusammenhang geht hervor, dass das Hochzeitspaar gemeint ist.
- source_word: γάμον
  choice: Hochzeitsfest
  rationale: γάμος kann sowohl die Hochzeit selbst als auch das Hochzeitsfest beziehungsweise die Hochzeitsfeier bezeichnen. Wegen der Dauer von vierzehn Tagen liegt hier die Feier als Bedeutung nahe.
- source_word: ἡμερῶν δέκα τεσσάρων
  choice: vierzehntägiges
  rationale: Der Genitiv bezeichnet die Dauer. Die attributive Wiedergabe »vierzehntägiges« ist im Deutschen knapp und natürlich.
