base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/008/007.yaml
  text: And now[a], Lord, I am not taking this my sister because of sexual immorality, but in truth[b]. Command that I may find mercy and that I and she may grow old together.
translation:
  language: de
  text: Und nun, Herr, nehme ich diese meine Schwester nicht aus Unzucht zur Frau, sondern in aufrichtiger Absicht. Gebiete, dich meiner zu erbarmen und sie mit mir alt werden zu lassen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κύριε
  choice: Herr
  rationale: Direkte Anrede Gottes; „Herr“ entspricht dem würdigen deutschen Gebetsregister.
- source_word: οὐ διὰ πορνείαν
  choice: nicht aus sexueller Begierde
  rationale: πορνεία bezeichnet grundsätzlich unerlaubtes sexuelles Verhalten; in diesem Motivkontrast ist die sexuelle Begierde als Beweggrund gemeint. Die Formulierung bleibt deutlich, ohne Tobias eine konkrete unsittliche Handlung zuzuschreiben.
- source_word: λαμβάνω
  choice: nehme … zur Frau
  rationale: Das wörtliche „nehmen“ steht hier eindeutig im Eheschließungskontext. „Zur Frau nehmen“ macht diesen Sinn im Deutschen verständlich und bewahrt zugleich das Bild des griechischen Verbs.
- source_word: τὴν ἀδελφήν μου ταύτην
  choice: diese meine Schwester
  rationale: Die wörtliche Verwandtschaftsbezeichnung wird beibehalten; im Erzählzusammenhang bezeichnet sie eine nahe Verwandte und rechtmäßige Ehepartnerin.
- source_word: ἐπʼ ἀληθείας
  choice: in Aufrichtigkeit
  rationale: Die Wendung bezeichnet hier den wahrhaftigen, lauteren Beweggrund und bildet den natürlichen Gegensatz zur sexuellen Begierde.
- source_word: ἐπίταξον
  choice: Gebiete
  rationale: Bewahrt die auffällige Stärke des Imperativs „befiehl/ordne an“, statt ihn zu „gewähre“ abzuschwächen.
- source_word: ἐλεῆσαί με καὶ αὐτὴν
  choice: dass uns Erbarmen zuteilwird
  rationale: Die griechische Folge kann als Bitte um Erbarmen für Tobias und Sara verstanden werden. Die inklusive deutsche Formulierung gibt με καὶ αὐτήν knapp und natürlich wieder.
- source_word: συγκαταγηρᾶσαι
  choice: wir miteinander alt werden
  rationale: Der zusammengesetzte Infinitiv bezeichnet ausdrücklich das gemeinsame Altwerden.
theological_decisions:
- issue: Bezeichnung Saras als „Schwester“ in einem Ehegebet
  choice: Die wörtliche Verwandtschaftssprache „diese meine Schwester“ bleibt im Haupttext erhalten.
  alternative: „diese meine Verwandte“
  rationale: ἀδελφή bedeutet wörtlich „Schwester“. Der narrative und kulturelle Zusammenhang zeigt, dass hier eine nahe Verwandte gemeint ist, die rechtmäßig geheiratet wird; eine interpretierende Ersetzung würde die Eigenart des Textes verdecken.
- issue: Syntaktische Zuordnung der abschließenden Bitte
  choice: Die Bitte wird als Erbarmen für beide und gemeinsames Altwerden wiedergegeben.
  alternative: „Gebiete, dich meiner zu erbarmen und sie mit mir alt werden zu lassen.“
  rationale: Die knappe griechische Infinitivkonstruktion ist syntaktisch angespannt und lässt mehr als eine Gliederung zu. Die gewählte Fassung folgt der naheliegenden gemeinsamen Petition, ohne eine weitergehende dogmatische Festlegung.
translation_notes:
  register: Modernes, würdiges Gebetsdeutsch. Die ungewöhnliche Verwandtschaftsbezeichnung und die starke Bitte „Gebiete“ bleiben bewusst sichtbar; erläuternde Glättungen werden vermieden.
