review_pass:
  verdict: revise
  source_fidelity: 'Die Fassung trifft den Eheschließungssinn von λαμβάνω und das gemeinsame Altwerden grundsätzlich gut. Sie erweitert jedoch ἐλεῆσαί με („sich meiner zu erbarmen“) unzulässig zu einer Bitte um Erbarmen für beide. Im Griechischen ist αὐτήν bei συγκαταγηρᾶσαι anzuschließen: Gott soll sich Tobias erbarmen und Sara mit ihm alt werden lassen. Zudem ist „sexuelle Begierde“ als Motiv zwar kontextuell nachvollziehbar, aber enger bzw. anders akzentuiert als πορνεία, das „Unzucht/sexuelle Unmoral“ bezeichnet.'
  naturalness: „Diese meine Schwester“ und „zur Frau nehmen“ sind im würdigen modernen Gebetsregister verständlich. „Gebiete“ bewahrt angemessen die auffällige Stärke von ἐπίταξον. „In aufrichtiger Absicht“ ist im Deutschen idiomatischer als ein bloßes „in Wahrheit“ und gibt den ethischen Motivkontrast wieder.
  terminology: „Herr“, „zur Frau nehmen“ und „Schwester“ sind angemessen. „Unzucht“ gibt πορνεία quellennäher wieder als „sexuelle Begierde“, ohne Tobias eine vollzogene Handlung zuzuschreiben, da sie mit „aus“ den zurückgewiesenen Beweggrund bezeichnet. Keine Fußnotenanker sind im deutschen Entwurf vorhanden; eine kulturelle Erläuterung zu „Schwester“ ist daher als unmarkierte Fußnote nicht erforderlich.
  issues:
  - severity: high
    issue: Die Bitte um Erbarmen wird auf Sara ausgeweitet.
    rationale: ἐλεῆσαί hat με als Objekt. αὐτήν gehört zur anschließenden Bitte um gemeinsames Altwerden; „dass uns Erbarmen zuteilwird“ verändert somit die Referenz und Satzgliederung des griechischen Textes.
  - severity: medium
    issue: „sexuelle Begierde“ ersetzt πορνεία durch einen anderen Begriff.
    rationale: πορνεία bezeichnet sexuelle Unmoral bzw. Unzucht, nicht primär Begierde. Der Kontext betrifft zwar den Beweggrund für die Heirat, rechtfertigt aber nicht die lexikalische Verschiebung.
  revised_text: Und nun, Herr, nehme ich diese meine Schwester nicht aus Unzucht zur Frau, sondern in aufrichtiger Absicht. Gebiete, dich meiner zu erbarmen und sie mit mir alt werden zu lassen.
