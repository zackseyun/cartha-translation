  rationale: 'Die Revision stellt die unterschiedliche Zuordnung der beiden Schlussbitten wieder her: Erbarmen gilt Tobias (με), während Sara (αὐτήν) mit ihm alt werden soll. Sie ersetzt ferner die nicht deckungsgleiche „sexuelle Begierde“ durch „Unzucht“ für πορνεία. Die wörtliche Verwandtschaftsbezeichnung bleibt erhalten, ohne die im Griechischen vorhandene kulturelle Mehrdeutigkeit zu glätten.'
