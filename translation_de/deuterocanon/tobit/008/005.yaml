base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/008/005.yaml
  text: And Tobiah began to say[a], “Blessed are you, O God of our fathers, and blessed is your holy and glorious name forever; may the heavens and all your creation bless you.”
translation:
  language: de
  text: 'Und Tobias begann zu sprechen: „Gepriesen bist du, Gott unserer Väter, und gepriesen ist dein heiliger und herrlicher Name in Ewigkeit. Mögen die Himmel und alle deine Geschöpfe dich preisen.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤρξατο Τωβίας λέγειν
  choice: Tobit begann zu beten
  rationale: Wörtlich steht „Tobit begann zu sagen“. Da unmittelbar ein an Gott gerichtetes Gebet folgt, gibt „begann zu beten“ die Funktion der griechischen Wendung natürlich und präzise wieder.
- source_word: Εὐλογητὸς ... εὐλογητὸν ... εὐλογησάτωσάν
  choice: Gepriesen ... gepriesen ... sollen ... preisen
  rationale: „Gepriesen“ bewahrt den liturgischen Klang der Segensformel und lässt sich im Deutschen auch beim Namen Gottes natürlich verwenden. Die abschließende Imperativform wird als aufforderndes „sollen ... preisen“ wiedergegeben.
- source_word: ὁ θεὸς τῶν πατέρων ἡμῶν
  choice: Gott unserer Väter
  rationale: Die traditionelle Gebetsformel gibt das ausdrücklich männliche πατέρων genau und in würdigem modernem Deutsch wieder.
- source_word: τὸ ὄνομά σου τὸ ἅγιον καὶ ἔνδοξον
  choice: dein heiliger und herrlicher Name
  rationale: Beide attributiven Adjektive bleiben erhalten; „heilig“ und „herrlich“ sind natürliche und etablierte Entsprechungen.
- source_word: εἰς τοὺς αἰῶνας
  choice: in Ewigkeit
  rationale: Die idiomatische deutsche Gebetssprache gibt den Gedanken unbegrenzter Dauer wieder, ohne den griechischen Plural mechanisch abzubilden.
- source_word: οἱ οὐρανοὶ
  choice: die Himmel
  rationale: Der Plural des griechischen Textes bleibt erhalten und passt zum kosmischen Lobpreis.
- source_word: πᾶσαι αἱ κτίσεις σου
  choice: alle deine Geschöpfe
  rationale: Die pluralische Form κτίσεις bezeichnet das von Gott Geschaffene. „Geschöpfe“ wahrt den Plural, während eine Fußnote auf die mögliche umfassendere Wiedergabe „deine ganze Schöpfung“ hinweist.
theological_decisions:
- issue: Geschlechtsspezifische Sprache in der Gebetsformel
  choice: unserer Väter
  alternative: unserer Vorfahren
  rationale: πατέρων bedeutet hier ausdrücklich „Väter“. Die traditionelle Bundes- und Gebetsformel wird nicht geschlechtsneutral umgedeutet.
- issue: Umfang von πᾶσαι αἱ κτίσεις im kosmischen Lobpreis
  choice: alle deine Geschöpfe
  alternative: deine ganze Schöpfung
  rationale: Die gewählte Fassung erhält den griechischen Plural und die Vorstellung, dass alles Geschaffene Gott preist. Die Alternative macht den umfassenden Bezug auf die gesamte Schöpfung deutlicher; die griechische Formulierung lässt diese Bedeutungsweite zu.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht liturgischem Klang. Die traditionelle Formel „Gott unserer Väter“ und der Plural „die Himmel“ bewahren die sprachliche Gestalt des griechischen Gebets; unnötige Archaismen werden vermieden.
