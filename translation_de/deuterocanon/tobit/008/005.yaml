    rationale: Der Text sagt wörtlich, dass Tobias zu sprechen bzw. zu sagen begann. Der folgende Inhalt ist ein Gebet, doch „sprechen“ erhält die Ausdrucksweise des Ausgangstextes ohne Sinnverlust.
