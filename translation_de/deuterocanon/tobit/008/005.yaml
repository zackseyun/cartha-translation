  source_fidelity: 'Eine sichere Korrektur ist nötig: Der griechische Text nennt Τωβίας, also Tobias, nicht Tobit (Τωβίτ). Außerdem gibt „begann zu sprechen“ ἤρξατο ... λέγειν unmittelbarer wieder als die interpretierende Einengung „begann zu beten“. Die übrigen Aussagen entsprechen dem griechischen Text gut.'
  naturalness: Die revidierte Fassung ist modernes, würdiges Standarddeutsch. „Mögen die Himmel und alle deine Geschöpfe dich preisen“ ist eine natürliche deutsche Wiedergabe des benediktivischen Imperativs, ohne den Aufforderungscharakter von „sollen“ unnötig zu verhärten.
  terminology: „Gott unserer Väter“, „heiliger und herrlicher Name“, „in Ewigkeit“ und „die Himmel“ sind sachgerecht und registerangemessen. „Geschöpfe“ ist für κτίσεις vertretbar; die Fußnote bewahrt die weitere Lesart „ganze Schöpfung“.
