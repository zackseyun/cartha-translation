  text: Und Raguel kam in sein Haus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »sein eigenes Haus«. Das griechische Reflexivpronomen ἑαυτοῦ kann ausdrücklich mit »eigenes« wiedergegeben werden; die kürzere Form ist hier im Deutschen natürlicher.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Und
  rationale: Bewahrt die schlichte parataktische Verknüpfung der griechischen Erzählung, ohne eine zusätzliche zeitliche Nuance einzutragen.
- source_word: ἦλθεν
  choice: kam
  rationale: Der Aorist von ἔρχομαι bezeichnet hier die vollzogene Bewegung; »kam« gibt das griechische Verb knapp wieder, während »trat ein« die durch εἰς bereits ausgedrückte Bewegung ins Innere unnötig verdoppeln würde.
- source_word: Ῥαγουὴλ
  choice: Raguël
  rationale: Direkte, im Deutschen gut lesbare Umschrift der griechischen Namensform; das Trema zeigt, dass u und e getrennt gesprochen werden.
- source_word: εἰς
  choice: in
  rationale: Mit dem Akkusativ bezeichnet die Präposition eine Bewegung in einen Raum hinein; im Deutschen drückt »in sein Haus kommen« dies natürlich aus.
- source_word: τὴν οἰκίαν
  choice: sein Haus
  rationale: οἰκία bezeichnet hier konkret das Haus als Ziel der Bewegung. Das Possessivpronomen nimmt den folgenden reflexiven Genitiv idiomatisch auf.
- source_word: ἑαυτοῦ
  choice: sein
  rationale: Der reflexive Genitiv verweist auf Raguël zurück. »Sein« ist im Deutschen natürlich; »sein eigenes« wäre expliziter, könnte aber eine im Zusammenhang nicht geforderte Betonung nahelegen.
