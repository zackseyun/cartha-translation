lexical_decisions:
- source_word: ἐξελθοῦσα
  choice: sie ging hinaus
  rationale: Das Aoristpartizip von ἐξέρχομαι bezeichnet das Hinausgehen. Im natürlichen deutschen Erzählstil wird die vorgeordnete Handlung als koordinierter Hauptsatz wiedergegeben.
- source_word: ἀπήγγειλεν
  choice: berichtete
  rationale: ἀπαγγέλλω bedeutet, eine Nachricht zu überbringen oder etwas zu melden. »Berichtete« passt zum erzählerischen Zusammenhang und bewahrt den sachlichen Ton.
- source_word: αὐτοῖς
  choice: ihnen
  rationale: Der Dativ Plural bezeichnet die Empfänger der Nachricht und wird im Deutschen idiomatisch mit »ihnen« wiedergegeben.
- source_word: ὅτι
  choice: dass
  rationale: ὅτι leitet hier den Inhalt der Mitteilung ein; dem entspricht im Deutschen ein dass-Satz.
- source_word: ζῇ
  choice: er lebte
  rationale: Die Präsensform von ζάω bedeutet wörtlich »er lebt« beziehungsweise »er ist am Leben«. Nach dem erzählenden Präteritum ist »er lebte« im Deutschen eine natürliche Zeitenfolge; das unausgedrückte Subjekt wird aus dem Kontext ergänzt.
