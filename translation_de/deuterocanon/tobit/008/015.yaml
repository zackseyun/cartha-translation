  text: Und sie ging hinaus und berichtete ihnen, dass er lebt[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Griechisch wörtlich: »dass er lebt« oder »dass er am Leben ist«.'
