translation:
  language: de
  text: 'Und Tobias rief Rafael und sagte zu ihm: »Asarja[a], Bruder …[b]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Rafael wird hier mit »Asarja« angesprochen, dem Namen, unter dem er mit Tobias unterwegs ist.
    reason: cross_reference
  - marker: b
    text: Die längere, semitisch geprägte Überlieferung lässt unmittelbar Tobias’ Anweisungen an Asarja/Rafael folgen; der hier zugrunde gelegte griechische Zeuge bewahrt in diesem Vers nur den Anfang der Anrede.
    reason: textual_variant
lexical_decisions:
- source_word: ἐκάλεσεν
  choice: rief
  rationale: Das Aoristverb καλέω leitet hier die direkte Rede ein. „Rief“ gibt dies natürlich wieder, ohne den stärkeren Sinn von „ließ kommen“ oder „bestellte zu sich“ vorauszusetzen.
- source_word: Τωβίας
  choice: Tobit
  rationale: „Tobit“ folgt der im Deutschen etablierten Unterscheidung der Buchfiguren und bezeichnet hier den Sohn, der Rafael begleitet; die griechische Namensform Τωβίας kann je nach Kontext Tobit beziehungsweise Tobias entsprechen.
- source_word: Ῥαφαήλ
  choice: Rafael
  rationale: Gebräuchliche moderne deutsche Schreibung des Namens.
- source_word: Ἀζαρία
  choice: Asarja
  rationale: Tobit redet Rafael mit dessen angenommenem Namen an. „Asarja“ ist die geläufige deutsche Wiedergabe des semitischen Namens hinter der griechischen Form.
- source_word: ἀδελφέ
  choice: Bruder
  rationale: Der Vokativ bedeutet wörtlich „Bruder“ und kann hier eine vertraute Anrede sein, ohne biologische Verwandtschaft zu behaupten. Die wörtliche Anrede bewahrt diese Offenheit.
