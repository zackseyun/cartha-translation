lexical_decisions:
- source_word: ηυλογησεν
  choice: Er segnete
  rationale: Der Aorist von εὐλογέω bezeichnet hier im erzählenden Zusammenhang am natürlichsten das Erteilen eines Segens. »Er pries« würde den Sinn verschieben.
- source_word: τους αιωνας
  choice: für immer
  rationale: Die Wendung mit αἰῶνες bezeichnet in Segenssprache eine unbegrenzte, fortdauernde Zeit. »Für immer« ist im modernen Deutschen klar und idiomatisch.
theological_decisions:
- issue: Textgestalt der Segensformel
  choice: 'Die knappe Grundlesart wird als einfacher, dauerhaft geltender Segen wiedergegeben: »Er segnete sie für immer.«'
  alternative: Eine Randlesart erweitert die Aussage um »mit einem reinen und heiligen Segen«; weitere Varianten setzen καί vor πάντες beziehungsweise πάντας vor τοὺς αἰῶνας.
  rationale: Die erweiternden Lesarten werden nicht stillschweigend in den Haupttext aufgenommen. Die inhaltlich bedeutsame Erweiterung bleibt in einer Fußnote sichtbar; kleinere Varianten ändern den Grundsinn nicht.
translation_notes:
  register: Modernes, schlichtes und würdevolles Standarddeutsch. Die knappe Form des überlieferten Ausgangstextes bleibt erhalten; die textkritische Erweiterung wird transparent in der Fußnote dokumentiert.
