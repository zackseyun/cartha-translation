lexical_decisions:
- source_word: διότι
  choice: Denn
  rationale: Leitet die Begründung für die vorausgehende Aussage ein und bewahrt den kausalen Zusammenhang in natürlichem deutschem Erzählstil.
- source_word: ὠμόμοκεν
  choice: hat geschworen
  rationale: Das griechische Perfekt bezeichnet einen vollzogenen Schwur, der weiterhin gilt; das deutsche Perfekt gibt diese gegenwärtige Relevanz angemessen wieder.
- source_word: ὁ Ῥαγουὴλ
  choice: Raguel
  rationale: Die etablierte deutsche Form des griechischen Personennamens wird beibehalten.
- source_word: μὴ ἐξελθεῖν με
  choice: mich nicht fortgehen zu lassen
  rationale: ἐξέρχομαι bedeutet wörtlich „hinausgehen“, bezeichnet im Kontext aber das Fortgehen aus Raguels Haus. „Zu lassen“ macht die im Schwur vorausgesetzte Verfügungsgewalt Raguels verständlich, ohne den Sinn auf eine bestimmte Art des Verhinderns festzulegen.
