  source_fidelity: „zählt die Tage“ gibt das durative Präsens ἀριθμεῖ treffend wieder. „Wenn ich lange ausbleibe“ ist im erzählerischen Zusammenhang eine mögliche idiomatische Entfaltung von χρονίσω, auch wenn das griechische Verb allgemeiner „sich verspäten/lange zögern“ bedeutet. Die Wiedergabe von ὀδυνηθήσεται λίαν durch „wird er sich große Sorgen machen“ schwächt jedoch den ausdrücklich starken Kummer bzw. Schmerz ab und verschiebt ihn zu bloßer Besorgnis.
