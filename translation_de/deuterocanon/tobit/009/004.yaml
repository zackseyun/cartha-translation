translation:
  language: de
  text: Und mein Vater zählt die Tage. Wenn ich lange ausbleibe, wird er sehr bekümmert sein.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀριθμεῖ
  choice: zählt
  rationale: Das Präsens bezeichnet die fortdauernde Handlung. Im Deutschen kann das einfache Präsens diesen Verlauf natürlich ausdrücken.
- source_word: τὰς ἡμέρας
  choice: die Tage
  rationale: Die direkte Wiedergabe bewahrt das Bild des wartenden Vaters, der jeden vergehenden Tag zählt.
- source_word: χρονίσω
  choice: ich lange ausbleibe
  rationale: Das Verb bezeichnet hier ein längeres Verweilen beziehungsweise verzögertes Zurückkehren. „Ausbleiben“ passt zum Zusammenhang und legt keine äußere Ursache der Verzögerung fest.
- source_word: μέγα
  choice: lange
  rationale: μέγα wird adverbial gebraucht und bezeichnet hier die erhebliche Dauer des Ausbleibens.
- source_word: ὀδυνηθήσεται
  choice: wird er sich Sorgen machen
  rationale: Die Form bezeichnet den zu erwartenden starken inneren Schmerz oder Kummer des Vaters. Die deutsche Wendung ist im Zusammenhang des besorgten Wartens verständlich und natürlich.
- source_word: λίαν
  choice: große
  rationale: Das verstärkende λίαν wird in der idiomatischen Verbindung „große Sorgen“ ausgedrückt.
