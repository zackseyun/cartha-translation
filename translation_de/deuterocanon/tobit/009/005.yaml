  text: So Raphael went and lodged with Gabael[a], and he gave him the written note[b]; then Gabael brought out the money bags with the seals and gave them to him.
translation:
  language: de
  text: So ging Rafael zu Gabael und übernachtete bei ihm. Er gab ihm den Schuldschein[a]. Darauf holte Gabael die Geldbeutel hervor, die noch versiegelt waren[b], und gab sie ihm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die schriftliche Urkunde“. Das griechische Wort kann ein eigenhändig geschriebenes Dokument bezeichnen, das einen finanziellen Anspruch bestätigt.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „die Beutel in den Siegeln“; gemeint ist, dass die Siegel an den Geldbeuteln noch unversehrt waren.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπορεύθη
  choice: ging
  rationale: Der narrative Aorist bezeichnet schlicht Rafaels Weg zu Gabael; „ging“ ist natürlich und quellengetreu.
- source_word: ηὐλίσθη παρὰ Γαβαήλ
  choice: übernachtete bei ihm
  rationale: αὐλίζομαι bezeichnet das nächtliche Quartiernehmen; παρά mit der Person wird idiomatisch mit „bei ihm“ wiedergegeben. Der Name Gabael steht bereits unmittelbar zuvor.
- source_word: τὸ χειρόγραφον
  choice: den Schuldschein
  rationale: χειρόγραφον bezeichnet hier im Zusammenhang mit dem hinterlegten Geld ein eigenhändig ausgestelltes Dokument über einen finanziellen Anspruch. „Schuldschein“ gibt die Funktion knapp wieder, ohne die genaue Rechtsform festzulegen.
- source_word: προήνεγκεν
  choice: holte … hervor
  rationale: Das Verb beschreibt, dass Gabael die verwahrten Beutel hervorbrachte; „holte … hervor“ klingt im Deutschen konkret und natürlich.
- source_word: τὰ θυλάκια
  choice: die Geldbeutel
  rationale: θυλάκια sind kleine Beutel; der Erzählzusammenhang zeigt, dass sie das Geld enthielten.
- source_word: ἐν ταῖς σφραγῖσιν
  choice: die noch versiegelt waren
  rationale: Die wörtlich ungewöhnliche Wendung „in den Siegeln“ besagt, dass die Beutel ihre Siegel trugen beziehungsweise unversehrt versiegelt waren.
- source_word: ἔδωκεν αὐτῷ
  choice: gab sie ihm
  rationale: Das im Griechischen kontextuell erschlossene Objekt wird im Deutschen als Pluralpronomen auf die Geldbeutel bezogen.
