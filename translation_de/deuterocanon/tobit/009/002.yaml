base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/009/002.yaml
  text: Take with yourself a servant and two camels, and go to Rages of Media, to Gabael, and bring me the money, and bring him with you to the wedding.
translation:
  language: de
  text: Nimm einen Diener und zwei Kamele mit und geh nach Rages in Medien zu Gabaël. Hol mir das Geld[a] und bring ihn zu mir zur Hochzeit[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Griechisch wörtlich: »das Silber«; gemeint ist hier das Gabaël anvertraute Geld.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »zum Hochzeitsfest«. Das griechische Wort kann sowohl die Hochzeit als auch das dazugehörige Festmahl bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λάβε μετὰ σεαυτοῦ
  choice: Nimm … mit
  rationale: Die natürliche deutsche Wendung gibt die griechische Begleitkonstruktion vollständig wieder, ohne das im Deutschen schwerfällige »mit dir selbst«.
- source_word: παῖδα
  choice: einen Diener
  rationale: παῖς kann Kind, junger Mann oder Diener bedeuten. Im Zusammenhang einer Reise mit weiteren Begleitmitteln bezeichnet es am ehesten einen Diener oder Gehilfen; ein rechtlicher Sklavenstatus wird nicht hervorgehoben.
- source_word: δύο καμήλους
  choice: zwei Kamele
  rationale: Direkte Wiedergabe von Zahlwort und Substantiv.
- source_word: πορεύθητι ἐν Ῥάγοις τῆς Μηδείας παρὰ Γαβαήλ
  choice: geh zu Gabaël nach Rages in Medien
  rationale: Bei dem Bewegungsverb bezeichnet die Wendung das Reiseziel. Die deutsche Reihenfolge stellt die Person als unmittelbares Ziel und Rages in Medien als Ort klar heraus, ohne ein im Griechischen nicht genanntes Haus einzufügen.
- source_word: κόμισαί μοι τὸ ἀργύριον
  choice: Hol mir das Geld
  rationale: κομίζω bezeichnet hier das Abholen und Herbringen des hinterlegten Betrags. ἀργύριον heißt wörtlich »Silber«, wird aber geläufig für Geld gebraucht.
- source_word: καὶ αὐτὸν ἄγε μοι
  choice: und bring ihn mit
  rationale: Das Pronomen bezieht sich auf Gabaël. »Bring ihn mit« gibt das Begleiten zum genannten Festziel in natürlichem Deutsch wieder.
- source_word: εἰς τὸν γάμον
  choice: zur Hochzeit
  rationale: γάμος kann die Eheschließung oder das damit verbundene Hochzeitsfest bezeichnen. »Hochzeit« bewahrt im Haupttext diese Bedeutungsbreite.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter Aufforderungsform. Die Satzfolge wurde für natürliche deutsche Lesbarkeit leicht gegliedert. Die kürzere griechische Fassung bleibt maßgeblich; die erheblich erweiterte indirekte hebräische Rückübersetzung wurde nicht in den Haupttext aufgenommen.
