  terminology: „Diener“, „Kamele“, „Geld“, „Gabaël“, „Rages“ und „Medien“ sind angemessen. Die Fußnoten erläutern ἀργύριον und γάμος sachgerecht, ohne die griechische Mehrdeutigkeit aufzulösen.
