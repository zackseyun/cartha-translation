  text: And they rose early together and came to the wedding[a], and Tobias blessed his wife.
translation:
  language: de
  text: Und sie standen gemeinsam früh auf und kamen zur Hochzeit[a], und Tobias segnete seine Frau.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zur Hochzeitsfeier“. Das griechische Wort γάμος kann sowohl die Eheschließung als auch die Hochzeitsfeier bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὤρθρευσαν
  choice: standen früh auf
  rationale: Das Verb bezeichnet frühes Aufstehen beziehungsweise das Aufsein am frühen Morgen. „standen früh auf“ bewahrt die zeitliche Aussage, ohne eine Abreise hineinzulesen.
- source_word: κοινῶς
  choice: gemeinsam
  rationale: Das Adverb bezeichnet hier das gemeinschaftliche Handeln und wird im Deutschen natürlich mit „gemeinsam“ wiedergegeben.
- source_word: ἦλθοσαν
  choice: kamen
  rationale: „kamen“ folgt der Perspektive des griechischen Verbs, ohne das Erreichen des Ziels stärker hervorzuheben als der Ausgangstext.
- source_word: γάμον
  choice: Hochzeit
  rationale: γάμος kann sowohl die Eheschließung als auch die Hochzeitsfeier bezeichnen. „Hochzeit“ ist im Deutschen ähnlich weit und bewahrt diese Offenheit.
- source_word: εὐλόγησεν
  choice: segnete
  rationale: Die übliche Bedeutung ist „segnen“. Die schlichte Wiedergabe lässt Form und Inhalt des Segens wie im Griechischen unbestimmt.
- source_word: Τωβείας
  choice: Tobias
  rationale: „Tobias“ ist die im Deutschen etablierte Namensform.
- source_word: γυναῖκα αὐτοῦ
  choice: seine Frau
  rationale: Im ehelichen Zusammenhang bezeichnet γυνή eindeutig die Ehefrau; „seine Frau“ ist die natürliche moderne Wiedergabe.
theological_decisions:
- issue: Art der Handlung des Tobias gegenüber Sara in εὐλόγησεν ... τὴν γυναῖκα αὐτοῦ
  choice: Tobias segnete seine Frau
  alternative: Tobias sprach einen Segen über seine Frau
  rationale: Der Vers erwähnt einen Segen, bestimmt aber weder dessen Form noch Inhalt. Die direkte Formulierung vermeidet es, eine bestimmte liturgische Handlung vorauszusetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt nahe am griechischen Text; „Hochzeit“ bewahrt die lexikalische Mehrdeutigkeit von γάμος.
