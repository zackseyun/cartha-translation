- source_word: μετα / μετ
  choice: mit
  rationale: Die überlieferte Angabe verzeichnet lediglich die orthografisch beziehungsweise kontextbedingt verkürzte Variante der Präposition. Ohne weiteren Kontext liegt „mit“ am nächsten; wegen der fragmentarischen Textgrundlage erscheint sie jedoch nicht im Haupttext.
