  choice: jeden Tag
  rationale: Die Wendung drückt eine tägliche Wiederholung aus; »jeden Tag« ist im modernen Deutschen natürlich und bewahrt den distributiven Sinn.
- source_word: Τωβεὶθ ὁ πατὴρ αὐτοῦ
  choice: sein Vater Tobit
  rationale: Der griechische Text nennt Tobit und bestimmt ihn appositionell als dessen Vater. Die deutsche Wortfolge gibt die Beziehung klar und idiomatisch wieder.
