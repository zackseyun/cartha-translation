base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/004/020.yaml
  text: And now I am showing you the ten talents of silver that I deposited with Gabael son of Gabrias in Rages of Media[a].
translation:
  language: de
  text: Und nun zeige ich dir die zehn Talente Silber, die ich bei Gabaël, dem Sohn des Gabrias, in Rages in Medien hinterlegt habe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mache ich dir bekannt“. Das griechische Verb kann bedeuten, auf etwas hinzuweisen oder etwas offenzulegen, nicht nur, etwas sichtbar vorzuzeigen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιδεικνύω
  choice: zeige ich dir
  rationale: Das Präsens und der Dativ werden unmittelbar wiedergegeben. Im Zusammenhang bedeutet das Verb, Tobias auf das Geld hinzuweisen beziehungsweise ihn darüber zu unterrichten, nicht ihm die Silbermenge körperlich vorzuzeigen; eine Fußnote wahrt diese Bedeutungsbreite.
- source_word: τὰ δέκα τάλαντα τοῦ ἀργυρίου
  choice: die zehn Talente Silber
  rationale: Die antike Gewichts- und Geldeinheit bleibt erhalten und wird nicht spekulativ in einen modernen Wert umgerechnet. „Silber“ gibt den Genitiv des Stoffes natürlich wieder.
- source_word: παρεθέμην
  choice: hinterlegt habe
  rationale: Die mediale Verbform bezeichnet hier das Anvertrauen beziehungsweise Hinterlegen von Geld zur Verwahrung. „Hinterlegt“ ist im Deutschen präzise und idiomatisch.
- source_word: Γαβαήλῳ
  choice: Gabaël
  rationale: Der Personenname wird aus der griechischen Form transliteriert; das Trema verdeutlicht im Deutschen die getrennte Aussprache der Vokale.
- source_word: τῷ τοῦ Γαβρεία
  choice: dem Sohn Gabrias
  rationale: Die griechische Artikelfügung mit Genitiv ist eine patronymische Angabe; „Sohn“ muss für natürliches und eindeutiges Deutsch ergänzt werden.
- source_word: ἐν Ῥάγοις τῆς Μηδείας
  choice: in Rages in Medien
  rationale: Der Ortsname wird aus dem griechischen Zeugen transliteriert. Die Zugehörigkeit zur Landschaft Medien wird im Deutschen natürlich mit einer zweiten Ortsangabe wiedergegeben.
theological_decisions: []
