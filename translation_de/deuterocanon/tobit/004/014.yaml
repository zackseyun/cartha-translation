    issue: Unnötiges pronominales Subjekt bei der Vergeltung
    rationale: „wird es dir vergolten werden“ legt einen deutschen Bezug für „es“ nahe, obwohl das griechische Passiv kein Subjekt nennt. „wird dir vergolten werden“ wahrt die Offenheit der Vorlage klarer.
  - severity: low
    issue: „Achte auf dich“ ist leicht unterbestimmt
    rationale: πρόσεχε σεαυτῷ fordert Selbstbeobachtung bzw. Selbstachtsamkeit. „Achte auf dich selbst“ macht den reflexiven Bezug im Deutschen deutlicher.
