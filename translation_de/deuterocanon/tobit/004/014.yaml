base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/004/014.yaml
  text: Do not let the wages of any man who works for you stay overnight with you, but pay him at once. If you serve God, it will be repaid to you. Watch yourself, child, in all your works, and be disciplined in all your conduct.
translation:
  language: de
  text: Der Lohn jedes Menschen, der für dich arbeitet, soll nicht über Nacht bei dir bleiben; zahle ihn ihm vielmehr sofort aus. Wenn du Gott dienst, wird dir vergolten werden. Achte auf dich selbst, Kind, bei allem, was du tust, und sei in deinem ganzen Verhalten diszipliniert.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μισθὸς παντὸς ἀνθρώπου
  choice: Der Lohn jedes Menschen
  rationale: Gibt die uneingeschränkte Formulierung mit ἄνθρωπος geschlechtsübergreifend und im modernen Standarddeutsch wieder.
- source_word: μὴ αὐλισθήτω
  choice: soll nicht über Nacht bei dir bleiben
  rationale: Bewahrt das anschauliche Bild des griechischen Verbs, das wörtlich ein Übernachten oder Nachtquartiernehmen bezeichnet.
- source_word: ἀπόδος αὐτῷ παραυτίκα
  choice: zahle ihn ihm vielmehr sofort aus
  rationale: ἀποδίδω bezeichnet hier im Zusammenhang mit dem Lohn dessen Aushändigung; παραυτίκα fordert unverzügliche Zahlung.
- source_word: δουλεύσῃς τῷ θεῷ
  choice: du Gott dienst
  rationale: Das übliche deutsche Verb „dienen“ trifft die auf Gott bezogene Bedeutung von δουλεύω, ohne die im Deutschen missverständliche wörtliche Form „Sklave sein“ aufzudrängen.
- source_word: πρόσεχε σεαυτῷ
  choice: Achte auf dich
  rationale: Knapp und natürlich; umfasst sowohl Selbstbeobachtung als auch Vorsicht im eigenen Handeln.
- source_word: ἐν πᾶσι τοῖς ἔργοις σου
  choice: bei allem, was du tust
  rationale: Eine natürliche moderne Wiedergabe des umfassenden Ausdrucks „in allen deinen Werken/Taten“.
- source_word: πεπαιδευμένος
  choice: diszipliniert
  rationale: Bewahrt hier den ethischen Sinn von Erziehung, Einübung und Selbstzucht und entspricht dem anschließenden Bezug auf die gesamte Lebensführung.
- source_word: ἀναστροφῇ
  choice: Verhalten
  rationale: Bezeichnet die Lebensführung beziehungsweise das praktische Verhalten; „Verhalten“ ist im Satz idiomatisch und allgemeinverständlich.
theological_decisions:
- issue: Unbestimmtes Subjekt in ἀποδοθήσεταί σοι
  choice: wird es dir vergolten werden
  alternative: Gott wird es dir vergelten
  rationale: Das griechische Passiv nennt den Handelnden nicht ausdrücklich. Die gewählte Form wahrt den möglichen göttlichen Bezug, ohne Gott grammatisch als ausdrücklich genanntes Subjekt einzusetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit direkter weisheitlicher Anrede. Die Bildlichkeit des über Nacht zurückbehaltenen Lohns und die offene Passivkonstruktion der Vergeltung bleiben erhalten.
