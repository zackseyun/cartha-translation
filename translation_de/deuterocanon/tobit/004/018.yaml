  text: Seek counsel from every wise man, and do not despise any useful advice.
translation:
  language: de
  text: Suche Rat bei jedem verständigen Menschen, und verachte keinen nützlichen Rat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „und verachte keinen hilfreichen Ratschlag“. Das Griechische gebraucht hier nochmals dasselbe Wort für „Rat“ wie am Anfang des Verses.'
    reason: lexical_alternative
lexical_decisions:
- source_word: συμβουλίαν
  choice: Rat
  rationale: Das Substantiv bezeichnet Rat oder Beratung; „Rat suchen“ ist im Deutschen idiomatisch und bewahrt den Gedanken bewusst eingeholter Orientierung.
- source_word: παρὰ παντὸς φρονίμου
  choice: bei jedem verständigen Menschen
  rationale: παρά mit Genitiv bezeichnet hier die Quelle. φρόνιμος kann „verständig“, „klug“ oder „besonnen“ bedeuten; die substantivische maskuline Form ist in diesem Weisheitsspruch allgemein auf verständige Menschen bezogen.
- source_word: ζήτησον
  choice: Suche
  rationale: Der Imperativ fordert dazu auf, Rat aktiv zu suchen; „suche“ erhält diese prägnante Aufforderung.
- source_word: μὴ καταφρονήσῃς
  choice: verachte keinen
  rationale: καταφρονέω bedeutet stark „verachten“ oder „geringschätzen“. Mit „keinen“ wird die distributive Aussage von πάσης in der deutschen Verneinung natürlich wiedergegeben.
- source_word: ἐπὶ πάσης συμβουλίας χρησίμης
  choice: keinen nützlichen Rat
  rationale: χρήσιμος bezeichnet etwas Nützliches oder Hilfreiches. Die Wiederholung von „Rat“ bildet die Wiederholung von συμβουλία im Griechischen ab; die genaue Funktion von ἐπί ist in dieser Verbindung weniger eindeutig und wird nicht eigens ausformuliert.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Verständiger Mensch“ vermeidet eine unnötige Beschränkung auf Männer, ohne die substantivische Form des griechischen Weisheitsspruchs zu überdeuten. Die Wiederholung von „Rat“ folgt bewusst dem griechischen Wortlaut.
