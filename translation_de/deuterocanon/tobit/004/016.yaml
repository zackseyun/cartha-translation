  yaml_path: translation/deuterocanon/tobit/004/016.yaml
  text: Give from your bread to the hungry[a], and from your clothing to the naked. Whatever may abound to you, do as almsgiving[b], and do not let your eye be envious when you do almsgiving.
translation:
  language: de
  text: Gib dem Hungrigen von deinem Brot und den Nackten von deinen Kleidern.[a] Alles, was du im Überfluss hast, gib als Almosen, und sei beim Almosengeben nicht missgünstig.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „den Nackten“; das griechische Wort kann auch Menschen bezeichnen, die unzureichend bekleidet sind.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Dein Auge soll nicht missgünstig sein, wenn du Almosen gibst“; gemeint ist, dass man seine Gabe nicht widerwillig oder geizig geben soll.'
    reason: source_idiom
lexical_decisions:
- source_word: ἐκ τοῦ ἄρτου σου δίδου πεινῶντι
  choice: Gib von deinem Brot dem Hungrigen
  rationale: Bewahrt das konkrete Bild von ἄρτος und gibt den substantivierten Singular πεινῶντι als allgemeine Bezeichnung für einen Bedürftigen wieder.
- source_word: ἐκ τῶν ἱματίων σου τοῖς γυμνοῖς
  choice: von deinen Kleidern denen, die nichts anzuziehen haben
  rationale: ἱμάτια bezeichnet Kleider; γυμνοί kann sowohl Nackte als auch Menschen ohne ausreichende Kleidung meinen. Die Formulierung ist im Deutschen natürlich und wahrt die praktische Notlage.
- source_word: πᾶν ὃ ἐὰν περισσεύσῃ σοι
  choice: Alles, was du im Überfluss hast
  rationale: περισσεύω bezeichnet Überfluss beziehungsweise einen Überschuss. Die Wiedergabe ist idiomatisch, ohne den Umfang des Überschusses näher festzulegen.
- source_word: ποίει ἐλεημοσύνην
  choice: gib als Almosen
  rationale: ἐλεημοσύνη meint hier konkret eine Gabe an Bedürftige. Die deutsche Wendung gibt die Verbindung mit ποιέω natürlich wieder.
- source_word: μὴ φθονεσάτω σου ὁ ὀφθαλμός
  choice: sei ... nicht missgünstig
  rationale: Die griechische Augenmetapher bezeichnet widerwilliges oder geiziges Geben. Im Haupttext wird ihr Sinn natürlich ausgedrückt; die wörtliche Bildsprache bleibt in der Fußnote sichtbar.
- source_word: ἐν τῷ ποιεῖν σε ἐλεημοσύνην
  choice: beim Almosengeben
  rationale: 'Die Konstruktion ἐν τῷ mit Infinitiv ist temporal beziehungsweise begleitend: während oder wenn jemand Almosen gibt.'
theological_decisions:
- issue: Bedeutung von ἐλεημοσύνη
  choice: Almosen / Almosengeben
  alternative: Barmherzigkeit erweisen
  rationale: Im Zusammenhang mit Brot und Kleidung bezeichnet der Ausdruck konkrete materielle Hilfe für Bedürftige, ohne die weiter reichende Verbindung zur Barmherzigkeit zu leugnen.
- issue: Augenmetapher in μὴ φθονεσάτω σου ὁ ὀφθαλμός
  choice: Sinnwiedergabe im Haupttext, Metapher in der Fußnote
  alternative: Lass dein Auge nicht missgünstig sein
  rationale: Eine rein wörtliche deutsche Fassung wäre auffällig und potenziell missverständlich. Die Fußnote erhält das genuine Bild und seine moralische Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die konkreten Bilder von Brot und Kleidung bleiben erhalten; schwer verständliche griechische Idiomatik wird im Haupttext natürlich wiedergegeben und in den Fußnoten dokumentiert.
