  yaml_path: translation/deuterocanon/tobit/004/011.yaml
  text: For almsgiving is a good gift for all who do it before the Most High[a].
translation:
  language: de
  text: Denn Almosengeben ist eine gute Gabe für alle, die es vor dem Höchsten tun.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »eine gute Opfergabe«; das griechische Wort kann allgemein eine Gabe und in manchen Zusammenhängen eine Opfergabe bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δῶρον
  choice: Gabe
  rationale: Das Substantiv bezeichnet allgemein eine Gabe und kann in bestimmten Zusammenhängen auch eine Opfergabe meinen. »Gabe« bewahrt hier den weiten Sinn, ohne ungesicherte kultische Bezüge einzutragen.
- source_word: ἐλεημοσύνη
  choice: Almosengeben
  rationale: Gemeint ist konkret das Geben an Bedürftige, nicht lediglich eine allgemeine Haltung der Barmherzigkeit. »Almosengeben« ist im heutigen Deutschen verständlich und bezeichnet die Handlung genauer als »Wohltätigkeit«.
- source_word: πᾶσι τοῖς ποιοῦσιν αὐτήν
  choice: für alle, die es tun
  rationale: Die Formulierung gibt das griechische ποιέω mit seinem rückbezüglichen Pronomen direkt und natürlich wieder. Sie lässt offen, ob eine einzelne Tat oder eine geübte Praxis im Blick steht.
- source_word: ἐνώπιον τοῦ ὑψίστου
  choice: vor dem Höchsten
  rationale: »Vor« bewahrt die räumlich-relationale Bildsprache von ἐνώπιον; »der Höchste« ist im Deutschen ein geläufiger göttlicher Hoheitstitel.
theological_decisions:
- issue: Wie die Aussage zu verstehen ist, Almosengeben sei eine »gute Gabe«
  choice: Die Aussage wird als unmittelbare positive Würdigung des Almosengebens wiedergegeben, ohne sie dogmatisch zu erweitern.
  alternative: »Gabe« ausdrücklich als himmlischen Lohn oder als kultische Opfergabe deuten.
  rationale: Der griechische Wortlaut nennt das Almosengeben eine gute Gabe für diejenigen, die es vor dem Höchsten tun. Er erklärt weder einen bestimmten Heilsmechanismus noch eindeutig einen kultischen Opfercharakter; diese Spannung bleibt erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wendung »vor dem Höchsten« erhält den biblischen Hoheitstitel und bleibt zugleich für heutige Leser verständlich.
