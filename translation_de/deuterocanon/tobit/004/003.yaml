base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/004/003.yaml
  text: And calling him[a], he said, “Child, if I die, bury me, and do not neglect your mother; honor her all the days of your life,”
translation:
  language: de
  text: 'Und er rief ihn zu sich und sagte: »Mein Kind, wenn ich sterbe, begrabe mich und vernachlässige deine Mutter nicht[a]. Ehre sie alle Tage deines Lebens.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »übersieh deine Mutter nicht«, »missachte deine Mutter nicht«. Die parallele semitische Überlieferung formuliert stärker: »Verlass sie nicht.«'
    reason: Das griechische μὴ ὑπερίδῃς lässt mehrere nahe Bedeutungsnuancen zu; die Fußnote bewahrt diese Bandbreite und kennzeichnet die stärkere Formulierung der Paralleltradition.
lexical_decisions:
- source_word: καλέσας
  choice: er rief ihn zu sich
  rationale: Das vorzeitige Partizip wird als beigeordneter deutscher Erzählungssatz wiedergegeben. „Zu sich rufen“ klingt natürlich und bringt das Herbeirufen vor der anschließenden Rede zum Ausdruck.
- source_word: Παιδίον
  choice: Mein Kind
  rationale: Die Anrede ist liebevoll und familiär. Das im Deutschen idiomatische „Mein Kind“ gibt diesen Ton wieder; „mein“ ist dabei eine natürliche Ergänzung der Anrede und keine sachliche Erweiterung.
- source_word: ἐὰν ἀποθάνω
  choice: wenn ich sterbe
  rationale: Das griechische ἐάν mit Konjunktiv formuliert eine Bedingung. Im Deutschen kann „wenn“ sowohl den konditionalen als auch den zeitlichen Bezug natürlich ausdrücken, ohne die Aussage unnötig hypothetisch klingen zu lassen.
- source_word: θάψον με
  choice: begrabe mich
  rationale: Direkte, schlichte und würdevolle Wiedergabe des Imperativs.
- source_word: μὴ ὑπερίδῃς
  choice: vernachlässige deine Mutter nicht
  rationale: ὑπεροράω kann ein Übersehen, Nichtbeachten oder Geringschätzen bezeichnen. Im familiären Pflichtzusammenhang erfasst „vernachlässigen“ die praktische ethische Tragweite, ohne die stärkere Lesart „verlassen“ in den Haupttext einzutragen.
- source_word: τίμα
  choice: Ehre
  rationale: „Ehren“ ist die etablierte und sachlich genaue Wiedergabe für die gebotene Achtung gegenüber einem Elternteil.
- source_word: πάσας τὰς ἡμέρας τῆς ζωῆς σου
  choice: alle Tage deines Lebens
  rationale: Die formnahe Wendung ist im Deutschen verständlich und bewahrt den feierlichen, umfassenden Charakter der Anweisung.
theological_decisions:
- issue: Verhältnis des griechischen Haupttextes zur ausführlicheren semitischen Paralleltradition
  choice: Der Haupttext folgt dem zitierten griechischen Wortlaut; die semitische Paralleltradition wird nur zur Bestätigung der ethischen Stoßrichtung herangezogen.
  alternative: Den Text um die zusätzlichen Anweisungen der längeren Tradition erweitern oder μὴ ὑπερίδῃς stärker mit „verlass sie nicht“ übersetzen.
  rationale: Swetes griechischer Text ist hier die primäre Übersetzungsgrundlage. Die indirekte neuhebräische Rückübersetzung darf weder als antike Vorlage behandelt noch zur Einfügung im griechischen Vers nicht vorhandener Aussagen verwendet werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit schlichter familiärer Anrede. Die Satzgliederung folgt natürlichem deutschem Erzählstil, während die knappen Imperative und die feierliche Schlusswendung erhalten bleiben.
