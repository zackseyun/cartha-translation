  text: Pour out your bread on the grave of the righteous[a], and give none to sinners.
translation:
  language: de
  text: Gieße dein Brot auf das Grab der Gerechten aus[a], und gib den Sündern nichts.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „am Grab der Gerechten“. Die Wendung könnte eine wohltätige Handlung bei einer Bestattung oder zum Totengedenken bezeichnen; hier wird jedoch die wörtliche Bildsprache des Griechischen beibehalten.'
    reason: lexikalische und kulturelle Deutungsalternative
lexical_decisions:
- source_word: ἔκχεον
  choice: gieße … aus
  rationale: Der Imperativ bedeutet wörtlich „ausgießen“ oder „ausströmen lassen“. Die konkrete, ungewöhnliche Bildsprache bleibt erhalten, statt sie deutend als großzügiges Geben wiederzugeben.
- source_word: τοὺς ἄρτους σου
  choice: dein Brot
  rationale: Obwohl im Griechischen der Plural „deine Brote/Laibe“ steht, bezeichnet „dein Brot“ im heutigen Deutschen natürlich die bereitgestellte Nahrung und bewahrt zugleich das konkrete Bild.
- source_word: ἐπὶ τὸν τάφον τῶν δικαίων
  choice: auf das Grab der Gerechten
  rationale: ἐπί mit Akkusativ ist hier räumlich am unmittelbarsten mit „auf“ wiedergegeben; τάφος bedeutet „Grab“. Die möglicherweise dahinterstehende Bestattungs- oder Gedächtnispraxis wird nicht in den Haupttext hineingedeutet.
- source_word: τῶν δικαίων
  choice: der Gerechten
  rationale: „Die Gerechten“ gibt den moralisch-religiösen Sinn von δίκαιοι in biblischer Sprache klar und geläufig wieder.
- source_word: καὶ μὴ δῷς
  choice: und gib … nichts
  rationale: „Und“ bildet καί direkt ab. Das im zweiten Satzteil nicht wiederholte Objekt bleibt wie im Griechischen unausgesprochen; „nichts“ macht die Verneinung im Deutschen vollständig und knapp.
- source_word: τοῖς ἁμαρτωλοῖς
  choice: den Sündern
  rationale: „Sünder“ ist die transparente und in biblischer Sprache übliche Entsprechung für ἁμαρτωλοί.
theological_decisions:
- issue: Deutung der Anweisung im Zusammenhang mit einem Grab
  choice: Das konkrete Bild, Brot „auf das Grab der Gerechten“ auszugießen, bleibt im Haupttext stehen.
  alternative: Gib dein Brot bei der Bestattung der Gerechten; teile bei der Trauer um die Gerechten Nahrung aus.
  rationale: Der genaue kulturelle Hintergrund der ungewöhnlichen griechischen Formulierung ist nicht sicher. Eine erklärende Wiedergabe als Totenmahl, Begräbnishilfe oder Gedächtnisalmosen würde die vorhandene Mehrdeutigkeit vorschnell auflösen.
- issue: Umfang des Verbots gegenüber Sündern
  choice: „und gib den Sündern nichts“
  alternative: Gib den Sündern nichts von deinem Brot; beteilige dich bei Sündern nicht an einer solchen Totengabe.
  rationale: Im zweiten Satzteil nennt das Griechische den Gegenstand des Gebens nicht erneut. Die knappe deutsche Fassung lässt ihn ebenfalls unausgesprochen und legt nicht fest, ob nur das Brot beziehungsweise die beschriebene Handlung oder jede Gabe gemeint ist.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die auffällige Verbindung von „Brot“ und „ausgießen“ ist bewusst beibehalten, weil sie der ebenso ungewöhnlichen griechischen Bildsprache entspricht. Das Komma vor „und“ dient hier der deutlichen Gliederung der zwei imperativischen Teilsätze.
