  text: For almsgiving rescues from death and will not allow one to enter into the darkness[a][b].
translation:
  language: de
  text: Denn das Geben von Almosen rettet vor dem Tod und wird einen nicht in die Finsternis eintreten lassen[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Barmherzigkeit“ beziehungsweise „Werke der Barmherzigkeit“; das griechische Wort meint hier besonders das Geben an Bedürftige.
    reason: lexical_alternative
  - marker: b
    text: „Die Finsternis“ kann an den Bereich des Todes oder an tiefes Dunkel erinnern; das griechische Bild bleibt knapp und in seiner genauen Bedeutung offen.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐλεημοσύνη
  choice: Almosengeben
  rationale: Das Substantiv bezeichnet im hellenistisch-jüdischen Sprachgebrauch konkret das Geben an Bedürftige. „Almosengeben“ bewahrt diesen Handlungssinn besser als das allgemeinere „Barmherzigkeit“.
- source_word: ἐκ θανάτου
  choice: vor dem Tod
  rationale: Bei „retten“ ist „vor dem Tod retten“ im Deutschen idiomatisch und gibt die durch ἐκ bezeichnete Befreiung aus dem Machtbereich des Todes wieder.
- source_word: ῥύεται
  choice: rettet
  rationale: Das Verb bezeichnet das Retten oder Befreien aus Gefahr. „Rettet“ ist knapp und natürlich, ohne den Satz über seine unmittelbare Aussage hinaus auszudeuten.
- source_word: οὐκ ἐάσει
  choice: lässt … nicht
  rationale: Die Zukunftsform drückt aus, dass das Eintreten verhindert wird. Das deutsche Präsens ist in einer allgemeinen Aussage natürlich und kann diese zukünftige Folge einschließen.
- source_word: εἰσελθεῖν
  choice: eintreten
  rationale: „Eintreten“ gibt den Infinitiv präzise und in Verbindung mit „in die Finsternis“ würdig wieder.
- source_word: εἰς τὸ σκότος
  choice: in die Finsternis
  rationale: Der bestimmte Artikel und die knappe Bildsprache werden beibehalten; die mögliche Beziehung auf Tod, Totenreich oder tiefes Dunkel bleibt offen.
theological_decisions:
- issue: Ob der Vers so wiederzugeben ist, dass Almosengeben das Heil verdient
  choice: Die direkte Aussage, dass Almosengeben vor dem Tod rettet, bleibt ohne dogmatische Erweiterung oder Abschwächung stehen.
  alternative: „Tod“ nur als zeitliche Gefahr deuten oder die Aussage durch „kann retten“ abschwächen.
  rationale: Der griechische Text formuliert die Behauptung ohne Einschränkung. Die Übersetzung soll diese Spannung bewahren und weder eine spätere Lehrsystematik hineintragen noch den Wortlaut harmonisierend mildern.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die konkrete Handlung wird mit „Almosengeben“ ausgedrückt; die markante Aussage und das offene Bild der Finsternis bleiben erhalten.
