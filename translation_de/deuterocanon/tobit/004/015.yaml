base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/004/015.yaml
  text: And what you hate[a], do to no one. Do not drink wine to drunkenness, and do not let drunkenness go with you on your way.
translation:
  language: de
  text: Und was du hasst,[a] das tu niemandem an. Trink keinen Wein bis zur Trunkenheit, und die Trunkenheit soll dich auf deinem Weg nicht begleiten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Und was dir zuwider ist, das tu keinem anderen an.“'
    reason: Lexikalische Alternative für ὃ μισεῖς; sie macht ausdrücklich, dass etwas dem Angeredeten zuwider ist.
lexical_decisions:
- source_word: ὃ μισεῖς
  choice: was du hasst
  rationale: Die knappe Relativkonstruktion bewahrt die sprichwörtliche Weite und die direkte Anrede. Eine alternative, stärker objektbezogene Deutung wird in der Fußnote erhalten.
- source_word: μηδενὶ … ποίησης
  choice: das tu niemandem an
  rationale: Das Dativobjekt wird im Deutschen mit der idiomatischen Wendung „jemandem etwas antun“ wiedergegeben; so bleibt die universale Verneinung deutlich.
- source_word: οἶνον εἰς μέθην μὴ πίῃς
  choice: Trink keinen Wein bis zur Trunkenheit
  rationale: „Bis zur Trunkenheit“ gibt die durch εἰς bezeichnete Folge beziehungsweise Grenze verständlich wieder, ohne den konkreten Bezug auf Rausch abzuschwächen.
- source_word: μὴ πορευθήτω μετὰ σοῦ μέθη
  choice: die Trunkenheit soll dich … nicht begleiten
  rationale: Die Personifikation der Trunkenheit als Wegbegleiterin bleibt erhalten; die Formulierung gibt den Imperativ der dritten Person natürlich wieder.
- source_word: ἐν τῇ ὁδῷ σου
  choice: auf deinem Weg
  rationale: Die Wendung bewahrt sowohl das konkrete Wegmotiv als auch dessen mögliche Bedeutung für den Lebenswandel.
theological_decisions:
- issue: Formulierung der negativen Gegenseitigkeitsregel
  choice: Und was du hasst, das tu niemandem an.
  alternative: Und was dir zuwider ist, das tu keinem anderen an.
  rationale: Die Hauptfassung folgt der direkten verbalen Aussage des Griechischen und bewahrt ihre Kürze. Die Alternative verdeutlicht die mögliche subjektbezogene Bedeutung, ohne sie im Haupttext festzuschreiben.
- issue: Bildhafte Warnung vor Trunkenheit
  choice: die Trunkenheit soll dich auf deinem Weg nicht begleiten
  alternative: geh auf deinem Weg nicht in Trunkenheit
  rationale: Die gewählte Fassung erhält die im Griechischen angelegte Personifikation und vermeidet eine Verengung auf einen einzelnen Zustand oder Anlass.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter Anrede im Singular. Die sprichwörtliche Kürze und das Wegmotiv werden bewahrt; „Trunkenheit“ entspricht dem leicht gehobenen Weisheitsstil.
