base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/004/013.yaml
  text: And now[a], child, love your brothers, and do not become proud in your heart over your brothers and the sons and daughters of your people, so as to take a wife for yourself from among them. For in pride there is ruin and much disorder, and in uselessness there is decline and great want[b]; for uselessness is the mother of famine.
translation:
  language: de
  text: Und nun, Kind, liebe deine Brüder und überhebe dich in deinem Herzen nicht über deine Brüder und die Söhne und Töchter deines Volkes, um dir aus ihrer Mitte eine Frau zu nehmen.[a] Denn im Hochmut liegen Verderben und viel Unordnung, und im Müßiggang liegen Niedergang und große Not; denn der Müßiggang ist die Mutter des Hungers.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Satzfügung ist gedrängt. Der Infinitiv kann auch so verstanden werden: »… und überhebe dich in deinem Herzen nicht über deine Brüder und die Söhne und Töchter deines Volkes, wenn oder indem du dir aus ihrer Mitte eine Frau nimmst.« Der Zusammenhang zwischen der Warnung vor Hochmut und der Wahl einer Frau lässt sich verschieden verstehen.'
    reason: alternative_reading
  - marker: b
    text: Das mit »Müßiggang« wiedergegebene Wort kann auch »Trägheit« oder, in diesem Zusammenhang weniger wahrscheinlich, »Nutzlosigkeit« bedeuten. Niedergang, Not und Hunger sprechen für unproduktive Untätigkeit.
    reason: lexical_alternative
lexical_decisions:
- source_word: παιδίον
  choice: Kind
  rationale: Bewahrt die liebevolle direkte Anrede und legt über das grammatische Neutrum hinaus kein Geschlecht fest.
- source_word: ἀγάπα
  choice: liebe
  rationale: Direkte und natürliche Wiedergabe des Imperativs von ἀγαπάω.
- source_word: ἀδελφούς
  choice: Brüder
  rationale: Entspricht dem grammatisch maskulinen Plural; die folgende ausdrückliche Nennung von Söhnen und Töchtern bleibt erhalten.
- source_word: ὑπερηφάνευε τῇ καρδίᾳ σου
  choice: überhebe dich in deinem Herzen nicht
  rationale: Gibt die innere hochmütige Selbsterhöhung idiomatisch wieder und bewahrt das Bild des Herzens.
- source_word: ἀπὸ τῶν ἀδελφῶν σου καὶ τῶν υἱῶν καὶ θυγατέρων τοῦ λαοῦ σου
  choice: über deine Brüder und die Söhne und Töchter deines Volkes
  rationale: Bei einem Verb des Hochmuts bezeichnet ἀπό hier am ehesten die Menschen, über die man sich erhebt.
- source_word: λαβεῖν σεαυτῷ ἐξ αὐτῶν γυναῖκα
  choice: wenn du dir aus ihrer Mitte eine Frau nimmst
  rationale: Die zeitlich-situative Fassung ist im Deutschen natürlich, bewahrt die Verbindung zur Partnerwahl und vermeidet, den syntaktisch gedrängten griechischen Satz eindeutig als Zweck- oder Folgesatz festzulegen.
- source_word: ἀπώλεια
  choice: Verderben
  rationale: Bezeichnet im weisheitlichen Zusammenhang eine verhängnisvolle Folge, ohne eine endzeitliche Bedeutung aufzudrängen.
- source_word: ἀκαταστασία πολλή
  choice: viel Unordnung
  rationale: Bewahrt die breite Bedeutung von Zerrüttung, Instabilität und Unordnung.
- source_word: ἀχρειότης
  choice: Müßiggang
  rationale: Niedergang, Not und Hunger sprechen hier für Untätigkeit beziehungsweise unproduktive Trägheit statt für abstrakte Wertlosigkeit.
- source_word: ἐλάττωσις
  choice: Niedergang
  rationale: Gibt Verminderung oder Abnahme im wirtschaftlich-sozialen Zusammenhang idiomatisch wieder.
- source_word: ἔνδεια μεγάλη
  choice: große Not
  rationale: Drückt schweren Mangel in verständlichem, würdigem Deutsch aus.
- source_word: λιμός
  choice: Hunger
  rationale: Im Spruch bezeichnet das Wort die aus Untätigkeit erwachsende Hungersnot beziehungsweise den Hunger; die knappe Form wahrt den sprichwörtlichen Klang.
theological_decisions:
- issue: Sozialethische Bedeutung des Heiratssatzes
  choice: Die Mahnung warnt davor, sich bei der Wahl einer Frau aus dem eigenen Volk hochmütig über die eigenen Angehörigen zu erheben.
  alternative: Der Infinitiv kann enger als Aufforderung verstanden werden, eine Frau aus dem eigenen Volk zu nehmen, oder als Zweck-/Folgesatz zur Warnung vor Hochmut.
  rationale: Die griechische Syntax ist gedrängt. Die deutsche Fassung stellt den situativen Zusammenhang her, während die Fußnote die anderen möglichen Verknüpfungen offenhält und keine weitergehende Lehre über Eheschließung einträgt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit weisheitlich-sprichwörtlichem Ton. Die Anrede bleibt knapp und zärtlich; die parallele Satzstruktur des Griechischen wird weitgehend bewahrt. Sämtliche Fußnotenmarker stehen im Haupttext.
