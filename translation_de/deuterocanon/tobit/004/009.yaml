translation:
  language: de
  text: Denn du sammelst dir einen guten Schatz für einen Tag der Not[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „für den Tag der Not“, „für eine Zeit der Bedrängnis“ oder „für einen Tag dringenden Bedarfs“. Der griechische Ausdruck ist weit gefasst und kann sowohl Notlage als auch Bedrängnis bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: θέμα
  choice: Schatz
  rationale: Das Substantiv bezeichnet etwas Zurückgelegtes oder Aufbewahrtes. „Schatz“ gibt zusammen mit θησαυρίζεις das Bild eines angesammelten wertvollen Vorrats natürlich wieder, ohne es auf eine finanzielle Einlage zu verengen.
- source_word: γὰρ
  choice: Denn
  rationale: „Denn“ bewahrt die begründende und an den vorherigen Aufruf anknüpfende Funktion der Partikel.
- source_word: ἀγαθὸν
  choice: gut
  rationale: „Gut“ entspricht der weiten Bedeutung des Adjektivs und vermeidet eine Verengung auf materiellen Wert.
- source_word: θησαυρίζεις
  choice: du sammelst
  rationale: Das Verb bezeichnet das Ansammeln oder Aufhäufen eines Schatzes. Mit dem Objekt „Schatz“ ist „sammelst“ im modernen Deutschen klar und idiomatisch; die Präsensform bleibt erhalten.
- source_word: σεαυτῷ
  choice: dir
  rationale: Der reflexive Dativ bezeichnet den Nutzen für die handelnde Person; das deutsche „dir“ gibt dies knapp und natürlich wieder.
- source_word: εἰς ἡμέραν ἀνάγκης
  choice: für einen Tag der Not
  rationale: Die Wendung bezeichnet einen von Not, Bedrängnis oder dringendem Bedarf geprägten Tag. „Tag der Not“ ist würdig und verständlich, ohne die Art der Not näher festzulegen.
theological_decisions:
- issue: Bild vom Ansammeln eines Schatzes durch das im Kontext geforderte Almosengeben
  choice: Das Bild des angesammelten guten Schatzes bleibt ohne lehrmäßige Ausdeutung stehen.
  alternative: Die Aussage ausdrücklich als Erwerb eines himmlischen Lohns oder als praktische Vorsorge für spätere Not erklären.
  rationale: Der griechische Text beschreibt nur das Ansammeln eines guten Schatzes für einen Tag der Not. Die Übersetzung lässt offen, worin dieser Schatz genau besteht und auf welche Weise er dann zugutekommt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Begründungsstruktur und das Schatzbild des griechischen Textes bleiben erhalten; die mehrdeutige Wendung für künftige Not wird nicht unnötig präzisiert.
