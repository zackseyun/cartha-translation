translation:
  language: de
  text: Je nachdem, wie viel du besitzt, gib davon Almosen; wenn du wenig besitzt, scheue dich nicht, entsprechend deinen geringen Mitteln Almosen zu geben.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡς σοι ὑπάρχει κατὰ τὸ πλῆθος
  choice: Wenn du viel besitzt ... deinem Überfluss entsprechend
  rationale: Die Formulierung verbindet den verfügbaren Besitz mit der durch κατά ausgedrückten Verhältnismäßigkeit. Die deutsche Fassung macht den Gegensatz zum anschließenden „wenn du wenig besitzt“ klar und bewahrt zugleich den Gedanken, dass die Gabe dem vorhandenen Überfluss entsprechen soll.
- source_word: ποίησον ἐξ αὐτῶν ἐλεημοσύνην
  choice: gib davon ... Almosen
  rationale: ἐλεημοσύνη bezeichnet hier konkret das Geben für Bedürftige. „Almosen geben“ ist im Deutschen idiomatisch und gibt ἐξ αὐτῶν mit „davon“ als Gabe aus dem Besitz wieder.
- source_word: ἐὰν ὀλίγον σοι ὑπάρχῃ
  choice: wenn du aber wenig besitzt
  rationale: Die knappe Wiedergabe erhält den ausdrücklichen Gegensatz zum Überfluss; „aber“ markiert diesen im Deutschen natürlich.
- source_word: κατὰ τὸ ὀλίγον
  choice: dem Wenigen entsprechend
  rationale: κατά mit Akkusativ bezeichnet das Verhältnis oder Maß. Die Formulierung wahrt die Parallelität mit „deinem Überfluss entsprechend“.
- source_word: μὴ φοβοῦ ποιεῖν ἐλεημοσύνην
  choice: scheue dich nicht, ... Almosen zu geben
  rationale: φοβοῦ bedeutet wörtlich „fürchte dich“, bezeichnet hier aber das Zurückschrecken vor dem Geben trotz geringer Mittel. „Scheue dich nicht“ ist natürliches modernes Deutsch, ohne die Mahnung zu einer bloßen Empfehlung abzuschwächen.
theological_decisions:
- issue: Wiedergabe von ἐλεημοσύνη
  choice: Almosen geben
  alternative: Barmherzigkeit üben; Wohltätigkeit leisten
  rationale: Im Kontext des Tobitbuches bezeichnet ἐλεημοσύνη die konkrete materielle Unterstützung Bedürftiger. „Almosen“ bewahrt diesen sachlichen und thematischen Bezug, ohne den Ausdruck zu einer allgemeinen Tugend auszuweiten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Satzstruktur bildet den Gegensatz zwischen Überfluss und geringen Mitteln ab; „scheue dich nicht“ vermeidet altertümliches Deutsch und erhält den mahnenden Ton.
