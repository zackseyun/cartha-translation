base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/004/001.yaml
  text: On that day Tobit remembered the silver that he had deposited with Gabael in Rages of Media[a][b].
translation:
  language: de
  text: An jenem Tag erinnerte sich Tobit an das Silber[a], das er bei Gabaël in Rages in Medien[b] hinterlegt hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Geld“. Das griechische Wort bezeichnet Silber und kann auch Silber als Zahlungsmittel meinen.'
    reason: lexical_alternative
  - marker: b
    text: Rages wird auch „Rhages“ geschrieben.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐν τῇ ἡμέρᾳ ἐκείνῃ
  choice: An jenem Tag
  rationale: Idiomatic modern German preserving the definite temporal reference of the Greek.
- source_word: ἐμνήσθη
  choice: erinnerte sich
  rationale: Direct and natural rendering of the aorist middle without adding interpretive nuance.
- source_word: περὶ τοῦ ἀργυρίου
  choice: an das Silber
  rationale: Preserves the concrete wording ἀργύριον; in context it may denote silver used as money.
- source_word: ὃ παρέθετο
  choice: das er … hinterlegt hatte
  rationale: The pluperfect reflects that the deposit preceded Tobit's remembering; „hinterlegt“ conveys the financial or custodial sense of παρατίθημι.
- source_word: Γαβαήλῳ
  choice: bei Gabaël
  rationale: The dative names the person with whom the silver was deposited; the diaeresis clarifies the separate vowels in the Greek-derived name.
- source_word: ἐν Ῥάγοις τῆς Μηδίας
  choice: in Rages in Medien
  rationale: Natural German geographical wording; the regional genitive is expressed idiomatically by „in Medien“.
