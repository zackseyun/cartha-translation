base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/004/002.yaml
  text: And he said within himself[a], “I have asked for death; why should I not call Tobiah my son, so that I may instruct him before I die?”
translation:
  language: de
  text: 'Und er sagte sich[a]: »Ich habe um den Tod gebeten. Warum sollte ich nicht meinen Sohn Tobija rufen, damit ich ihn unterweise, bevor ich sterbe?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die parallele semitische Überlieferung führt den Gedanken ausführlicher aus: Tobit ruft Tobija, um ihn vor seinem Tod über das bei Gabael hinterlegte Geld zu informieren.'
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπεν ἐν ἑαυτῷ
  choice: sagte sich
  rationale: Die Wendung bezeichnet ein inneres Selbstgespräch. „Sagte sich“ ist im modernen Deutschen natürlich und bewahrt dies deutlicher als das allgemeinere „dachte“.
- source_word: ᾐτησάμην θάνατον
  choice: habe um den Tod gebeten
  rationale: Der Aorist verweist auf Tobits vorausgegangene Bitte und hat hier gegenwärtige Bedeutung für seinen Entschluss. Das Perfekt gibt diesen Zusammenhang idiomatisch wieder; „gebetet“ wäre gegenüber dem Verb selbst stärker deutend.
- source_word: τί οὐ καλῶ
  choice: Warum sollte ich nicht … rufen?
  rationale: Die Frage ist abwägend und selbstauffordernd, nicht bloß eine sachliche Warum-Frage. Die gewählte Form gibt diesen deliberativen Sinn natürlich wieder.
- source_word: Τωβείαν τὸν υἱόν μου
  choice: meinen Sohn Tobija
  rationale: „Tobija“ ist eine im Deutschen gebräuchliche, semitisch geprägte Namensform und vermeidet die stärker lateinisch-traditionelle Form „Tobias“.
- source_word: ὑποδείξω
  choice: unterweise
  rationale: Das Verb kann „zeigen“, „mitteilen“ oder „anweisen/unterweisen“ bedeuten. Im Zusammenhang der letzten väterlichen Weisungen trifft „unterweisen“ den allgemeinen kommunikativen und richtunggebenden Sinn, ohne den im griechischen Text nicht genannten Inhalt vorwegzunehmen.
- source_word: πρὶν ἀποθανεῖν με
  choice: bevor ich sterbe
  rationale: Dies ist die klare und natürliche Wiedergabe der temporalen Konstruktion im heutigen Standarddeutsch.
theological_decisions:
- issue: Einfluss der parallelen semitischen Überlieferung auf ὑποδείξω
  choice: 'Die Hauptzeile bleibt allgemein: Tobit ruft seinen Sohn, um ihn vor seinem Tod zu unterweisen.'
  alternative: 'Den Zusatz der parallelen Überlieferung in den Haupttext aufnehmen: Tobit wolle ihn über das bei Gabael hinterlegte Geld informieren.'
  rationale: Der maßgebliche griechische Text nennt den Gegenstand der Unterweisung nicht. Die indirekte hebräische Parallelquelle bezeugt eine ausführlichere Überlieferung, darf aber den griechischen Ausgangstext nicht überschreiben; ihre Zusatzinformation gehört daher in eine Fußnote.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das innere Selbstgespräch bleibt erkennbar; die rhetorische Abwägung wird idiomatisch formuliert. Die Namensform „Tobija“ folgt einer semitisch geprägten deutschen Wiedergabe.
