base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/004/012.yaml
  text: Guard yourself[a], child, from all sexual immorality, and first take a wife from the offspring of your fathers. Do not take a foreign woman who is not from the tribe of your father, because we are sons of the prophets. Remember, child, Noah, Abraham, Isaac, and Jacob, our fathers from of old, that they all took wives from among their brothers, and they were blessed in their children[b], and their offspring will inherit the land.
translation:
  language: de
  text: Hüte dich, Kind, vor jeder sexuellen Unmoral, und nimm dir zuerst eine Frau aus der Nachkommenschaft deiner Väter. Nimm keine fremde Frau, die nicht aus dem Stamm deines Vaters ist; denn wir sind Söhne der Propheten.[a] Denk daran, Kind, dass Noah, Abraham, Isaak und Jakob, unsere Väter von alters her, sich alle Frauen aus dem Kreis ihrer Brüder nahmen.[b] Sie wurden in ihren Kindern gesegnet, und ihre Nachkommenschaft wird das Land erben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wir sind Nachkommen der Propheten.“ Wörtlich steht im Griechischen: „Söhne der Propheten“.'
    reason: alternative_reading
  - marker: b
    text: Gemeint sind hier nicht ihre leiblichen Brüder, sondern nahe Verwandte beziehungsweise Angehörige ihrer Sippe.
    reason: lexical_alternative
lexical_decisions:
- source_word: πρόσεχε σεαυτῷ
  choice: Hüte dich
  rationale: Die reflexive Warnung wird im Deutschen natürlich und eindringlich wiedergegeben; die anschließende Präposition ἀπό bezeichnet das, wovor man sich hüten soll.
- source_word: παιδίον
  choice: Kind
  rationale: Die liebevolle Anrede bleibt erhalten, ohne das im Griechischen nicht ausdrücklich stehende Possessivpronomen „mein“ hinzuzufügen.
- source_word: πάσης πορνείας
  choice: vor jeder sexuellen Unmoral
  rationale: Die Formulierung gibt den breiten moralischen Bedeutungsumfang von πορνεία in verständlichem Gegenwartsdeutsch wieder, ohne ihn auf einen einzelnen Tatbestand einzuengen.
- source_word: γυναῖκα πρῶτον λάβε
  choice: nimm dir zuerst eine Frau
  rationale: Die übliche eheliche Bedeutung von λαμβάνειν γυναῖκα und die auffällige Prioritätsangabe πρῶτον bleiben ausdrücklich erhalten.
- source_word: ἀπὸ τοῦ σπέρματος τῶν πατέρων σου
  choice: aus der Nachkommenschaft deiner Väter
  rationale: σπέρμα bezeichnet hier die Abstammungslinie; „Nachkommenschaft“ bewahrt den genealogischen Bezug, ohne das missverständliche wörtliche „Samen“ zu verwenden.
- source_word: γυναῖκα ἀλλοτρίαν
  choice: keine fremde Frau
  rationale: ἀλλοτρία bezeichnet im Kontext eine Frau außerhalb der eigenen Abstammungs- und Stammesgemeinschaft; der folgende Relativsatz präzisiert diese Fremdheit.
- source_word: φυλῆς τοῦ πατρός σου
  choice: dem Stamm deines Vaters
  rationale: Die väterliche Stammeszugehörigkeit wird formal nah und idiomatisch wiedergegeben.
- source_word: υἱοὶ προφητῶν ἐσμεν
  choice: wir sind Söhne der Propheten
  rationale: Die ungewöhnliche wörtliche Formulierung bleibt im Haupttext bestehen; eine mögliche Deutung als Abstammungsaussage wird in der Fußnote genannt.
- source_word: ἀπὸ τοῦ αἰῶνος
  choice: von alters her
  rationale: Die Wendung bezeichnet die weit zurückreichende Vergangenheit und passt zum würdevollen erzählerischen Register.
- source_word: ἐκ τῶν ἀδελφῶν αὐτῶν
  choice: aus dem Kreis ihrer Brüder
  rationale: Die männliche Verwandtschaftsbezeichnung des griechischen Textes bleibt sichtbar; die Fußnote erläutert den im Heiratskontext gemeinten weiteren Sippenbezug.
- source_word: εὐλογήθησαν ἐν τοῖς τέκνοις αὐτῶν
  choice: Sie wurden in ihren Kindern gesegnet
  rationale: Die Wiedergabe bleibt nahe bei ἐν und wahrt die mögliche Spannung zwischen Segen in, durch oder an den Kindern.
- source_word: κληρονομήσει γῆν
  choice: wird das Land erben
  rationale: Im Zusammenhang mit den Erzvätern liegt das verheißene Land näher als die Erde im Allgemeinen; der bestimmte Artikel ist im Deutschen kontextgemäß.
theological_decisions:
- issue: Bedeutung der Wendung „Söhne der Propheten“ bei einer anschließenden Aufzählung der Erzväter
  choice: Die wörtliche Wendung „Söhne der Propheten“ bleibt im Haupttext erhalten.
  alternative: „Wir sind Nachkommen der Propheten.“
  rationale: Die auffällige Ausdrucksweise des griechischen Textes soll nicht geglättet werden. Die mögliche genealogische Bedeutung wird als Alternative in einer Fußnote kenntlich gemacht.
- issue: Verwandtschaftssprache in der Heiratsanweisung
  choice: „Brüder“ bleibt im Haupttext erhalten und wird in einer Fußnote erläutert.
  alternative: „Verwandten“ oder „Sippenangehörigen“
  rationale: Das Griechische verwendet ausdrücklich ἀδελφοί. Im Kontext kann damit jedoch der weitere Kreis naher Verwandter oder der Sippe gemeint sein; beides wird transparent bewahrt.
- issue: Art des Segens in den Kindern
  choice: „in ihren Kindern gesegnet“
  alternative: „durch ihre Kinder gesegnet“ oder „mit Kindern gesegnet“
  rationale: Die formnahe Wiedergabe löst nicht festlegend auf, ob die Kinder Mittel, Bereich oder Inhalt des Segens sind.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Ungewöhnliche genealogische und theologische Formulierungen des griechischen Textes werden nicht stillschweigend vereindeutigt; erläuterungsbedürftige Stellen stehen in knappen Fußnoten.
