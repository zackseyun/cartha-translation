base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/004/006.yaml
  text: For if you practice the truth[a], your works will prosper[b], and so will all who practice righteousness.
translation:
  language: de
  text: Denn wenn du nach der Wahrheit handelst[a], wird es dir bei deinen Taten gut ergehen[b] – und ebenso allen, die Gerechtigkeit üben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „die Wahrheit tust“. Gemeint ist wahrhaftiges, zuverlässiges Handeln.'
    reason: lexical_alternative
  - marker: b
    text: 'Der griechische Wortlaut ist knapp und kann auch wiedergegeben werden: „In deinen Taten wird es gutes Gelingen geben.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιοῦντός σου τὴν ἀλήθειαν
  choice: wenn du nach der Wahrheit handelst
  rationale: Die komprimierte Genitivus-absolutus-Konstruktion wird im ermahnenden Zusammenhang konditional wiedergegeben. „Nach der Wahrheit handeln“ bewahrt den ethischen Sinn von ἀλήθεια und klingt im Deutschen natürlicher als „die Wahrheit tun“.
- source_word: εὐοδίαι ἔσονται ἐν τοῖς ἔργοις σου
  choice: wird dir alles gelingen, was du tust
  rationale: Die griechische Wendung bezeichnet günstigen Fortgang oder Erfolg bei den eigenen Tätigkeiten. Diese Fassung gibt den Sinn natürlich wieder, ohne ihn ausdrücklich auf materiellen Wohlstand zu verengen.
- source_word: πᾶσι τοῖς ποιοῦσι
  choice: allen, die … üben
  rationale: Das substantivierte Partizip bezeichnet Menschen, deren Verhalten fortdauernd davon geprägt ist.
- source_word: τὴν δικαιοσύνην
  choice: Gerechtigkeit
  rationale: δικαιοσύνη umfasst hier gerechtes und rechtschaffenes Handeln. „Gerechtigkeit üben“ ist im Deutschen verständlich, würdig und bewahrt die ethische Weite des Ausdrucks.
theological_decisions:
- issue: Wiedergabe von δικαιοσύνη
  choice: Gerechtigkeit
  alternative: Rechtschaffenheit
  rationale: „Gerechtigkeit“ hält sowohl die soziale als auch die umfassend ethische Dimension des griechischen Begriffs offen. „Rechtschaffenheit“ könnte den persönlichen Charakter stärker hervorheben, würde aber den möglichen Gerechtigkeitsaspekt abschwächen.
- issue: Verhältnis von wahrhaftigem Handeln und Gelingen
  choice: Als Weisheitsspruch ohne ausdrückliche Einschränkung wiedergegeben
  alternative: Als ausnahmslose Garantie materiellen Erfolgs erläutern
  rationale: Der Text verbindet wahrhaftiges beziehungsweise gerechtes Handeln mit günstigem Fortgang, bestimmt diesen aber nicht ausdrücklich als materiellen Wohlstand und entfaltet keine systematische Lehre über ausnahmslosen Erfolg.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Weisheitston. Der Gedankenparallelismus bleibt durch den Gedankenstrich sichtbar; die schwerfällige griechische Kompression wird idiomatisch entfaltet.
