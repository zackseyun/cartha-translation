base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/004/007.yaml
  text: From what you have[a], give alms, and do not let your eye be grudging when you give alms. Do not turn your face away from any poor person[c][b], and the face of God will not be turned away from you.
translation:
  language: de
  text: Gib von dem, was du hast, Almosen, und sei beim Almosengeben nicht missgünstig.[a] Wende dein Gesicht von keinem Armen ab,[b] dann wird auch Gottes Angesicht sich gewiss nicht von dir abwenden.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Lass dein Auge nicht missgünstig sein, wenn du Almosen gibst.“ Gemeint ist eine widerwillige oder knauserige Haltung beim Geben.'
    reason: lexical_alternative
  - marker: b
    text: '„Von keinem Armen“ ist allgemein und distributiv gemeint: von keinem bedürftigen Menschen.'
    reason: source_form_clarification
  - marker: c
    text: 'Wörtlich steht in beiden Satzteilen dasselbe Bild: Du sollst dein Gesicht nicht abwenden, und Gottes Angesicht wird sich nicht von dir abwenden. „Angesicht“ kann dabei auch die zugewandte Gegenwart Gottes bezeichnen.'
    reason: literary_and_theological_clarification
lexical_decisions:
- source_word: ἐκ τῶν ὑπαρχόντων σοι
  choice: von dem, was du hast
  rationale: Die Wendung bezeichnet den vorhandenen Besitz beziehungsweise die verfügbaren Mittel. Die gewählte Form ist natürlich und bewahrt den Bezug auf die tatsächlichen Möglichkeiten des Gebenden.
- source_word: ποίει ἐλεημοσύνην
  choice: Gib … Almosen
  rationale: ἐλεημοσύνη bezeichnet hier konkrete materielle Hilfe für Bedürftige. „Almosen geben“ gibt diesen Sinn präzise und in würdiger, verständlicher Sprache wieder.
- source_word: μὴ φθονεσάτω σου ὁ ὀφθαλμός
  choice: sei … nicht missgünstig
  rationale: Das griechische Augenbild bezeichnet eine widerwillige, knauserige Haltung. Eine wörtliche Rede vom missgünstigen Auge wäre im heutigen Deutschen missverständlich; die Fußnote bewahrt das Bild.
- source_word: ἐν τῷ ποιεῖν σε ἐλεημοσύνην
  choice: beim Almosengeben
  rationale: Die substantivierte Infinitivkonstruktion hat hier zeitlich-begleitenden Sinn und wird knapp und idiomatisch wiedergegeben.
- source_word: μὴ ἀποστρέψῃς τὸ πρόσωπόν σου
  choice: Wende dein Gesicht … nicht ab
  rationale: „Gesicht“ bleibt ausdrücklich erhalten, damit die rhetorische Entsprechung zu Gottes Angesicht im Folgesatz sichtbar bleibt.
- source_word: ἀπὸ παντὸς πτωχοῦ
  choice: von keinem Armen
  rationale: Der substantivierte maskuline Singular hat distributiv-generische Kraft. „Von keinem Armen“ bildet Form und Sinn knapp ab, ohne die Aussage auf eine bestimmte Person zu beschränken.
- source_word: οὐ μὴ ἀποστραφῇ
  choice: wird sich gewiss nicht … abwenden
  rationale: Die verstärkte Negation οὐ μή wird durch „gewiss nicht“ ausgedrückt. Das reflexive deutsche Verb gibt die natürliche Bedeutung des griechischen Passivs im Parallelismus wieder.
- source_word: τὸ πρόσωπον τοῦ θεοῦ
  choice: Gottes Angesicht
  rationale: „Angesicht“ bewahrt die anthropomorphe Ausdrucksweise und hebt zugleich die feierliche, bewusste Entsprechung zu „dein Gesicht“ hervor.
theological_decisions:
- issue: Anthropomorphe Rede von Gottes πρόσωπον
  choice: Gottes Angesicht
  alternative: Gottes Gegenwart
  rationale: Der griechische Text verwendet πρόσωπον sowohl für den Menschen als auch für Gott. Die konkrete Wiedergabe erhält die wechselseitige Bildsprache und deutet sie nicht vorschnell als bloße „Gegenwart“ aus.
- issue: Verhältnis zwischen menschlicher Mildtätigkeit und Gottes Zuwendung
  choice: dann wird auch Gottes Angesicht sich gewiss nicht von dir abwenden
  alternative: sodass Gottes Gegenwart dir erhalten bleibt
  rationale: Die konditional-konsekutive Spannung des Satzes bleibt bestehen; sie wird weder zu einem mechanischen Verdienstschema ausgebaut noch theologisch abgeschwächt.
- issue: Generischer maskuliner Singular πτωχοῦ
  choice: von keinem Armen
  alternative: von keinem armen Menschen
  rationale: Die gewählte substantivische Form entspricht dem grammatischen Singular und ist im Deutschen allgemein-distributiv verständlich. Die Fußnote macht die Reichweite ausdrücklich klar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Almosen“ erhält den konkreten Sinn karitativer Gabe; „Angesicht“ markiert bewusst den feierlicheren göttlichen Gegenpol zu „Gesicht“. Die Wiederholung des Almosengebens und der Gesicht-/Angesicht-Parallelismus des Griechischen bleiben erkennbar.
