base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/004/019.yaml
  text: And at all times bless the Lord God[a], and ask from him that your ways may be made straight and that all your paths and plans may prosper. For no nation has counsel, but the Lord himself gives all good things, and whomever he wills he humbles, just as he pleases. And now, child, remember my commandments[b], and do not let them be blotted out from your heart.
translation:
  language: de
  text: Und zu jeder Zeit preise Gott, den Herrn, und bitte ihn, dass deine Wege gerade werden und du auf all deinen Pfaden und mit all deinen Plänen[a] Erfolg hast. Denn kein Volk verfügt über Rat[b], sondern der Herr selbst gibt alles Gute, und wen immer er will, erniedrigt er, wie es ihm gefällt. Und nun, Kind, denk an meine Gebote, und lass sie nicht aus deinem Herzen getilgt werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Vorhaben“ oder „Ratschlüsse“. Das griechische Wort βουλαί kann Pläne, Absichten oder Beratungen bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Die Aussage „kein Volk verfügt über Rat“ ist im Griechischen unvermittelt und kann bedeuten, dass kein Volk über letztgültigen Rat verfügt – im Gegensatz zum Herrn, der alles Gute gibt und erniedrigt, wen er will.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν παντὶ καιρῷ
  choice: zu jeder Zeit
  rationale: Gibt die umfassende zeitliche Bedeutung natürlich und vollständig wieder.
- source_word: εὐλόγει
  choice: preise
  rationale: Beim Segnen Gottes bezeichnet das Verb ein lobendes Preisen; „segne“ wäre im heutigen Deutschen missverständlich und weniger natürlich.
- source_word: Κύριον τὸν Θεόν
  choice: Gott, den Herrn
  rationale: Bewahrt beide Gottesbezeichnungen in einer im Deutschen natürlichen Apposition, auch wenn ihre Reihenfolge gegenüber dem Griechischen umgestellt wird.
- source_word: παρʼ αὐτοῦ αἴτησον
  choice: bitte ihn
  rationale: Natürliches Deutsch für die an Gott gerichtete Bitte; der Bezug auf ihn als den Erbetenen und Geber bleibt klar.
- source_word: ὅπως αἱ ὁδοί σου εὐθεῖαι γένωνται
  choice: dass deine Wege gerade werden
  rationale: Bewahrt das Bild gerader Wege, ohne es abstrakt als bloße Führung aufzulösen.
- source_word: τρίβοι
  choice: Pfade
  rationale: Entspricht dem Wegbild und unterscheidet den Ausdruck zugleich von ὁδοί.
- source_word: βουλαί
  choice: Pläne
  rationale: Bezeichnet hier am natürlichsten die Vorhaben, deren Gelingen erbeten wird; „Ratschlüsse“ wäre im modernen Deutsch schwerfälliger.
- source_word: εὐοδωθῶσιν
  choice: gelingen
  rationale: Drückt einen erfolgreichen Ausgang idiomatisch aus und passt sowohl zu Pfaden als auch zu Plänen.
- source_word: πᾶν ἔθνος οὐκ ἔχει βουλήν
  choice: kein Volk verfügt aus sich selbst über Rat
  rationale: Bewahrt den schroffen Gegensatz zwischen menschlichem Rat und Gottes Handeln. „Aus sich selbst“ macht den im Zusammenhang liegenden Kontrast verständlich, ohne dem Volk schlechthin jede Überlegung abzusprechen.
- source_word: δίδωσιν πάντα τὰ ἀγαθὰ
  choice: gibt alles Gute
  rationale: Direkte, natürliche Wiedergabe der umfassenden Aussage.
- source_word: ὃ ἐὰν θέλῃ ταπεινοῖ
  choice: wen immer er will, erniedrigt er
  rationale: Die personale Deutung ergibt im Zusammenhang mit Völkern und göttlichem Handeln einen verständlichen Sinn; die starke Aussage wird nicht abgeschwächt.
- source_word: παιδίον
  choice: Kind
  rationale: Bewahrt die liebevolle Anrede, ohne das im Griechischen nicht ausdrücklich stehende „mein“ oder die Festlegung auf „Sohn“ hinzuzufügen.
- source_word: μὴ ἐξαλειφθήτωσαν ἐκ τῆς καρδίας σου
  choice: lass sie nicht aus deinem Herzen getilgt werden
  rationale: Erhält das kräftige Bild des Auslöschens beziehungsweise Tilgens und gibt den verneinten Imperativ natürlich wieder.
theological_decisions:
- issue: Wiedergabe von κύριος
  choice: Herr
  alternative: Gebieter
  rationale: „Herr“ ist die etablierte und sachgerechte Gottesbezeichnung und bewahrt den biblischen Sprachgebrauch.
- issue: Göttliche Souveränität gegenüber dem Rat der Völker
  choice: Den starken Gegensatz zwischen menschlichem Rat und dem souveränen Geben und Erniedrigen des Herrn bewahren
  alternative: Die Aussage zu allgemeiner menschlicher Fehlbarkeit oder mangelnder Einsicht abschwächen
  rationale: Der griechische Text formuliert den Gegensatz bewusst scharf. Die Übersetzung erhält diese theologische Spannung, ohne sie durch eine zusätzliche Lehrdeutung aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter Wegmetaphorik. Die Satzfügung wurde behutsam geglättet; die abrupte und theologisch starke Aussage über den Rat der Völker bleibt durch Haupttext und Fußnote erkennbar.
