revisions:
- from: Und zu jeder Zeit preise Gott, den Herrn, und bitte ihn, dass deine Wege gerade werden und alle deine Pfade und Pläne[a] gelingen. Denn kein Volk verfügt aus sich selbst über Rat[b]; vielmehr gibt der Herr selbst alles Gute, und wen immer er will, erniedrigt er, wie er will. Und nun, Kind, denk an meine Gebote, und lass sie nicht aus deinem Herzen getilgt werden.
  to: Und zu jeder Zeit preise Gott, den Herrn, und bitte ihn, dass deine Wege gerade werden und du auf all deinen Pfaden und mit all deinen Plänen[a] Erfolg hast. Denn kein Volk verfügt über Rat[b], sondern der Herr selbst gibt alles Gute, und wen immer er will, erniedrigt er, wie es ihm gefällt. Und nun, Kind, denk an meine Gebote, und lass sie nicht aus deinem Herzen getilgt werden.
  rationale: Die Revision entfernt die nicht ausdrücklich im Griechischen enthaltene Auslegung „aus sich selbst“ und gibt ἀλλά mit „sondern“ wieder. Sie glättet zudem die deutsche Verbindung von Pfaden und Gelingen, ohne die Metapher oder den Sinnbereich von εὐοδωθῶσιν aufzugeben. Die Fußnote erläutert weiterhin die textlich und semantisch schwierige Aussage über den Rat der Völker, ohne sie im Haupttext auf eine Deutung festzulegen.
