base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/004/005.yaml
  text: All the days[a], child, remember the Lord our God. Do not desire to transgress his commandments. Practice righteousness all the days of your life, and do not walk in the ways of unrighteousness.
translation:
  language: de
  text: Denk alle Tage, Kind, an den Herrn, unseren Gott. Sei nicht gewillt, seine Gebote zu übertreten. Übe Gerechtigkeit[a] alle Tage deines Lebens, und geh nicht auf den Wegen der Ungerechtigkeit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Tu, was recht ist … und geh nicht auf den Wegen des Unrechts.« Die griechischen Begriffe können sowohl persönlich-moralische als auch sozialethische Bedeutung tragen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάσας τὰς ἡμέρας
  choice: alle Tage
  rationale: Bewahrt die zeitliche Wiederholung des Griechischen und lässt die spätere erweiterte Wendung »alle Tage deines Lebens« bestehen.
- source_word: παιδίον
  choice: Kind
  rationale: Gibt die liebevolle Anrede wieder, ohne das im Griechischen nicht ausdrücklich stehende Possessivpronomen »mein« oder eine geschlechtsspezifische Bezeichnung einzufügen.
- source_word: Κυρίου τοῦ θεοῦ ἡμῶν
  choice: den Herrn, unseren Gott
  rationale: Natürliche deutsche Wiedergabe der griechischen Genitivgruppe; die Apposition erhält sowohl den Hoheitstitel als auch das gemeinschaftliche »unseren«.
- source_word: μνημόνευε
  choice: Denk … an
  rationale: Der präsentische Imperativ bezeichnet fortdauerndes Erinnern und achtsames Bedenken; »an … denken« ist im heutigen Deutsch unmittelbar und natürlich.
- source_word: μὴ θελήσῃς παραβῆναι
  choice: Sei nicht gewillt, … zu übertreten
  rationale: Gibt sowohl das Willensmoment von θελήσῃς als auch die Übertretung selbst wieder, ohne die Aussage auf ein bloßes »Übertritt nicht« zu verkürzen.
- source_word: τὰς ἐντολὰς αὐτοῦ
  choice: seine Gebote
  rationale: »Gebote« entspricht dem religiös-ethischen Sprachgebrauch von ἐντολαί und bleibt in modernem Deutsch verständlich.
- source_word: δικαιοσύνην ποίει
  choice: Übe Gerechtigkeit
  rationale: Gibt die wörtliche Verbindung »Gerechtigkeit tun« idiomatisch und als beständige Lebenspraxis wieder; die mögliche soziale Dimension von »Recht tun« wird in der Fußnote bewahrt.
- source_word: πάσας τὰς ἡμέρας τῆς ζωῆς σου
  choice: alle Tage deines Lebens
  rationale: Bewahrt die volle griechische Formulierung und ihre nachdrückliche Wiederaufnahme des Zeitmotivs.
- source_word: μὴ πορευθῇς
  choice: geh nicht
  rationale: Erhält zusammen mit »Wegen« das griechische Bild vom Lebenswandel, ohne unnötig altertümlich zu klingen.
- source_word: ταῖς ὁδοῖς τῆς ἀδικίας
  choice: auf den Wegen der Ungerechtigkeit
  rationale: Bewahrt den Plural »Wege« sowie den formalen Gegensatz zwischen δικαιοσύνη und ἀδικία.
theological_decisions:
- issue: Wiedergabe des ethischen Begriffspaars δικαιοσύνη / ἀδικία
  choice: Gerechtigkeit / Ungerechtigkeit
  alternative: Recht / Unrecht
  rationale: »Gerechtigkeit / Ungerechtigkeit« wahrt den umfassenden persönlich-moralischen und religiösen Sinn sowie den griechischen Wortgegensatz. »Recht / Unrecht« kann die sozialethische Dimension deutlicher hervorheben und wird deshalb als echte Alternative in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Anrede »Kind« folgt dem Griechischen ohne ergänzendes »mein«. Das Wegmotiv bleibt als biblisch verständliche Metapher für den Lebenswandel erhalten; sperrige Wörtlichkeit wird sonst vermieden.
