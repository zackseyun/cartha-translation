base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/004/004.yaml
  text: And do what is pleasing to her[a], and do not grieve her. Remember, child, that she faced many dangers because of you while you were in the womb; when she dies[b], bury her beside me in one grave.
translation:
  language: de
  text: 'Tu, was ihr gefällt, und betrübe sie nicht. Denk daran, Kind: Sie hat deinetwegen viele Gefahren erlebt, als du in ihrem Mutterleib warst.[a] Wenn sie stirbt, begrabe sie neben mir in einem einzigen Grab.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Sie hat deinetwegen viele Gefahren im Mutterleib gesehen“; gemeint sind die Gefahren, die sie während der Schwangerschaft erlebte.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „in demselben Grab“.'
    reason: alternative_reading
lexical_decisions:
- source_word: ποίει τὸ ἀρεστὸν αὐτῇ
  choice: Tu, was ihr gefällt
  rationale: ἀρεστός bezeichnet das, was jemandem gefällt oder angenehm ist; der Dativ αὐτῇ nennt die Mutter als diejenige, der es gefallen soll. Die Formulierung ist eng am Griechischen und zugleich natürlich.
- source_word: μὴ λυπήσῃς αὐτήν
  choice: betrübe sie nicht
  rationale: λυπέω bedeutet, Kummer, Trauer oder Schmerz zu bereiten. „Betrüben“ bewahrt das emotionale Gewicht der Mahnung.
- source_word: μνήσθητι, παιδίον
  choice: Denk daran, Kind
  rationale: παιδίον ist hier eine liebevolle Anrede. „Kind“ wahrt die Zärtlichkeit, ohne das im Griechischen nicht ausdrücklich vorhandene Possessivpronomen „mein“ hinzuzufügen oder das Wort auf „Sohn“ zu verengen.
- source_word: πολλοὺς κινδύνους ἑόρακεν
  choice: sie hat viele Gefahren erlebt
  rationale: Wörtlich steht „sie hat viele Gefahren gesehen“. Im Zusammenhang bedeutet die Wendung, Gefahren erfahren oder durchgemacht zu haben. „Erlebt“ bleibt dem Bild nahe und ist im Deutschen verständlich.
- source_word: ἐπὶ σοὶ ἐν τῇ κοιλίᾳ
  choice: deinetwegen … als du in ihrem Mutterleib warst
  rationale: ἐπὶ σοὶ wird kausal als „deinetwegen“ verstanden; ἐν τῇ κοιλίᾳ verweist auf die Zeit der Schwangerschaft. Die deutsche Fassung macht den Bezug verständlich, ohne die Aussage auf eine bestimmte medizinische Gefahr festzulegen.
- source_word: ὅταν ἀποθάνῃ
  choice: Wenn sie stirbt
  rationale: ὅταν mit Konjunktiv bezeichnet hier ein erwartetes, noch zukünftiges Ereignis. „Wenn sie stirbt“ ist die natürliche deutsche Entsprechung.
- source_word: θάψον αὐτὴν παρʼ ἐμοὶ
  choice: begrabe sie neben mir
  rationale: παρά mit Dativ bezeichnet räumliche Nähe. Im Bestattungskontext gibt „neben mir“ dies klar wieder.
- source_word: ἐν ἑνὶ τάφῳ
  choice: in einem einzigen Grab
  rationale: εἷς betont die Einheit, während τάφος sowohl Grab als auch Grabstätte bezeichnen kann. „In einem einzigen Grab“ gibt die Formulierung direkt wieder; „in demselben Grab“ bleibt als mögliche Deutung in der Fußnote erhalten.
theological_decisions:
- issue: Familiäre Anrede παιδίον
  choice: Kind
  alternative: mein Kind; Sohn
  rationale: Die Anrede ist liebevoll, enthält aber weder ausdrücklich ein Possessivpronomen noch verlangt das Wort für sich genommen die männliche Bezeichnung „Sohn“. Die zurückhaltende Wiedergabe vermeidet einen unnötigen Zusatz.
- issue: Bildhafte Aussage πολλοὺς κινδύνους ἑόρακεν
  choice: sie hat viele Gefahren erlebt
  alternative: sie hat viele Gefahren gesehen; sie hat viele Gefahren durchgestanden
  rationale: Die wörtliche Rede vom „Sehen“ von Gefahren ist im Deutschen missverständlich. „Erlebt“ bewahrt den Erfahrungscharakter, ohne stärker als der Ausgangstext zu behaupten, sie habe jede Gefahr überwunden.
- issue: Bedeutung von ἐν ἑνὶ τάφῳ
  choice: in einem einzigen Grab
  alternative: in demselben Grab
  rationale: Der griechische Wortlaut betont „ein“ Grab, lässt sich im Kontext aber als gemeinsames beziehungsweise dasselbe Grab verstehen. Die Hauptfassung bleibt formal nah; die idiomatische Deutung wird ausgewiesen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter, familiärer Anrede. Der Satzbau ist für heutige Leser geglättet, während die kausale Aussage, die Bildsprache der erfahrenen Gefahren und die mögliche Mehrdeutigkeit von „einem Grab“ erhalten bleiben.
