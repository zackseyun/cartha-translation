base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/004/021.yaml
  text: And do not be afraid[a], child, because we have become poor; you have much, if you fear God and turn away from every sin and do what is pleasing before him.
translation:
  language: de
  text: Und fürchte dich nicht, Kind, weil wir arm geworden sind. Du hast viel[a], wenn du Gott fürchtest, dich von jeder Sünde abwendest und tust, was ihm gefällt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Vieles steht dir zur Verfügung. Der griechische Ausdruck kann bezeichnen, was jemand besitzt oder was ihm verfügbar ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ φοβοῦ
  choice: fürchte dich nicht
  rationale: Die verneinte Imperativform wird mit der geläufigen und würdevollen deutschen Wendung wiedergegeben.
- source_word: παιδίον
  choice: mein Kind
  rationale: Der Vokativ ist eine liebevolle familiäre Anrede. Das im Griechischen nicht ausdrücklich gesetzte Possessivpronomen ist im Deutschen für eine natürliche direkte Anrede erforderlich beziehungsweise idiomatisch naheliegend.
- source_word: ἐπτωχεύσαμεν
  choice: wir arm geworden sind
  rationale: Der Aorist von πτωχεύω bezeichnet hier das Eintreten in den Zustand der Armut und nicht nur einen bestehenden Zustand.
- source_word: ὑπάρχει σοι πολλὰ
  choice: du hast viel
  rationale: Die Konstruktion mit ὑπάρχω und Dativ kann Besitz oder etwas Verfügbares ausdrücken. Die knappe Wiedergabe bewahrt diese inhaltliche Weite.
- source_word: ἐὰν φοβηθῇς τὸν θεὸν
  choice: wenn du Gott fürchtest
  rationale: Die traditionelle biblische Ausdrucksweise bewahrt sowohl Ehrfurcht als auch den Ernst der Gottesbeziehung.
- source_word: ἀποστῇς ἀπὸ πάσης ἁμαρτίας
  choice: dich von jeder Sünde abwendest
  rationale: Die Formulierung gibt die bewusste Trennung beziehungsweise Abkehr von jeder Sünde natürlich wieder.
- source_word: ποιήσῃς τὸ ἀρεστὸν ἐνώπιον αὐτοῦ
  choice: tust, was ihm gefällt
  rationale: Die substantivierte Wendung τὸ ἀρεστόν und ἐνώπιον αὐτοῦ werden in natürlichem Deutsch zusammengeführt; der Bezug auf Gottes Beurteilung bleibt erhalten.
theological_decisions:
- issue: Bedeutung von „du hast viel“ im Zusammenhang mit Armut
  choice: Die Aussage bleibt offen und bezeichnet viel beziehungsweise ausreichenden Reichtum, der dem Sohn bei einem an Gottesfurcht und Sündenvermeidung ausgerichteten Leben zukommt oder verfügbar ist.
  alternative: Die Aussage könnte ausschließlich materiellen Wohlstand verheißen oder ausschließlich geistlichen beziehungsweise sittlichen Reichtum bezeichnen.
  rationale: Der griechische Text bestimmt die Art des Vielen nicht näher. Die Übersetzung vermeidet daher sowohl eine Wohlstandsgarantie als auch eine einengende Vergeistigung.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdevoll-biblischem Ton. Der Satzbau bleibt nahe am griechischen Gedankengang, ohne im Deutschen unnatürlich zu wirken.
