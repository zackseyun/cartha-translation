  source_fidelity: 'Die Übersetzung gibt die Satzglieder und den Sinn des griechischen Textes zuverlässig wieder: die Heiratsgabe an sieben Ehemänner, Aschmodais Tötung vor dem ehelichen Zusammensein sowie die verletzende Anschuldigung und den abschließenden Vorwurf. Der generische Plural in „wie Ehemänner mit ihren Frauen“ entspricht dem griechischen ὡς ἐν γυναιξίν und sollte nicht zu einem Singular vereinheitlicht werden.'
