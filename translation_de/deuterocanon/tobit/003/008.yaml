base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/003/008.yaml
  text: because she had been given to seven husbands[a], and Asmodeus, the evil demon, killed them before they could be with her as with wives. And they said to her, “Do you not understand that you are choking your husbands? Already you have had seven, and you have not benefited from even one of them.”
translation:
  language: de
  text: 'Denn sie war sieben Männern zur Frau gegeben worden, und Aschmodai, der böse Dämon, hatte sie getötet, bevor sie mit ihr zusammenkommen konnten, wie Ehemänner mit ihren Frauen.[a] Da sagten sie zu ihr: »Begreifst du nicht, dass du deine Männer erstickst? Sieben hast du nun schon gehabt, und keiner von ihnen hat dir etwas genützt.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »bevor sie ehelichen Verkehr mit ihr hatten«. Das Griechische umschreibt die eheliche Vereinigung verhüllend.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δεδομένη ἀνδράσιν ἑπτά
  choice: sieben Männern zur Frau gegeben worden
  rationale: Das Perfekt Passiv von δίδωμι bleibt erkennbar und der eheliche Zusammenhang von ἀνδράσιν wird natürlich ausgedrückt, ohne lediglich von sieben beliebigen Männern zu sprechen.
- source_word: Ἀσμοδαῖος
  choice: Aschmodai
  rationale: Die im modernen deutschen Bibelgebrauch geläufige Namensform gibt den griechischen Eigennamen wieder.
- source_word: τὸ πονηρὸν δαιμόνιον
  choice: der böse Dämon
  rationale: Gibt sowohl πονηρόν als auch δαιμόνιον direkt wieder und vermeidet eine abschwächende oder konfessionell geprägte Umschreibung.
- source_word: ἀπέκτεινεν
  choice: hatte sie getötet
  rationale: Das Plusquamperfekt verdeutlicht im deutschen Satz die gegenüber dem Bericht bereits vorausliegende, wiederholte Tötung; das Pronomen bezieht sich auf die sieben Männer.
- source_word: πρὶν ἢ γενέσθαι αὐτοὺς μετʼ αὐτῆς ὡς ἐν γυναιξίν
  choice: bevor sie mit ihr zusammenkommen konnten, wie Ehemänner mit ihren Frauen
  rationale: Bewahrt die verhüllende Redeweise für die eheliche Vereinigung und nimmt zugleich den generischen Plural γυναιξίν auf.
- source_word: Οὐ συνιεῖς
  choice: Begreifst du nicht
  rationale: Eine natürliche, vorwurfsvolle Wiedergabe von συνίημι im spöttischen direkten Zitat.
- source_word: ἀποπνίγουσά σου τοὺς ἄνδρας
  choice: dass du deine Männer erstickst
  rationale: Das anschauliche und grausame Verb ἀποπνίγω wird direkt wiedergegeben; „deine Männer“ bezeichnet hier ihre Ehemänner.
- source_word: ἤδη ἑπτὰ ἔσχες
  choice: Sieben hast du nun schon gehabt
  rationale: Bewahrt die knappe Form des Griechischen, in der „Männer“ aus dem Zusammenhang ergänzt wird.
- source_word: ἑνὸς αὐτῶν οὐκ ὠνάσθης
  choice: keiner von ihnen hat dir etwas genützt
  rationale: Gibt den Sinn von ὀνίναμαι als Nutzen oder Vorteil haben in natürlichem modernem Deutsch wieder.
theological_decisions:
- issue: Verhüllende Bezeichnung der ehelichen Vereinigung
  choice: „bevor sie mit ihr zusammenkommen konnten, wie Ehemänner mit ihren Frauen“
  alternative: „bevor sie ehelichen Verkehr mit ihr hatten“
  rationale: Der griechische Text benennt den Geschlechtsverkehr nicht ausdrücklich. Die Übersetzung erhält diese Zurückhaltung, macht den ehelichen Sinn aber durch den Vergleich verständlich.
- issue: Bezeichnung Aschmodais als δαιμόνιον
  choice: „der böse Dämon“
  alternative: „der böse Geist“
  rationale: „Dämon“ entspricht δαιμόνιον unmittelbarer und bewahrt die ausdrückliche Charakterisierung als böse, ohne die Gestalt theologisch weiter einzuordnen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede bleibt scharf und verletzend, wie es die Anschuldigung im griechischen Text verlangt. Die eheliche Vereinigung wird entsprechend der Vorlage zurückhaltend, aber verständlich formuliert.
