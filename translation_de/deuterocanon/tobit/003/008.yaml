  terminology: „Aschmodai“ ist eine gebräuchliche deutsche biblische Namensform; „der böse Dämon“ entspricht τὸ πονηρὸν δαιμόνιον direkt. „Männer“ ist im Kontext eindeutig als Ehemänner zu verstehen, und „hat dir etwas genützt“ gibt ὠνάσθης idiomatisch wieder.
