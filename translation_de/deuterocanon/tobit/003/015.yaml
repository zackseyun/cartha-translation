base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/003/015.yaml
  text: And I have not defiled my name[a], nor the name of my father, in the land of my captivity. I am my father’s only child, and he has no child who will inherit him, nor a near brother, nor does he have a son so that I might keep myself for him as a wife. Already seven have perished from me; why should I live? But if it does not seem good to you to put me to death, command that you look upon me and have mercy on me[c][b], and that I no longer hear reproach.
translation:
  language: de
  text: Und ich habe meinen Namen nicht befleckt, auch nicht den Namen meines Vaters, im Land meiner Gefangenschaft. Ich bin das einzige Kind meines Vaters, und er hat kein Kind, das ihn beerben wird, auch keinen nahen Bruder[a] und keinen Sohn, den er hätte, für den ich mich als Frau bewahren könnte.[b] Schon sieben sind mir umgekommen.[c] Warum soll ich leben? Wenn es dir aber nicht gut erscheint, mich zu töten, dann befiehl, auf mich zu blicken und dich meiner zu erbarmen, damit ich keine Schmähung mehr hören muss.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „einen nahen männlichen Verwandten“. Wörtlich steht im Griechischen „einen nahen Bruder“; wahrscheinlich ist die Bezeichnung hier weiter im Sinn der männlichen Verwandtschaftslinie gebraucht.'
    reason: lexical_alternative
  - marker: b
    text: Die Satzverbindung zwischen dem „nahen Bruder“, dem „Sohn“ und dem Bewahren als Frau ist im Griechischen syntaktisch schwierig. Die Übersetzung bleibt nahe am Wortlaut, ohne das genaue familienrechtliche Verhältnis festzulegen.
    reason: textual_variant
  - marker: c
    text: Gemeint sind im Erzählzusammenhang ihre sieben Ehemänner; im Griechischen steht an dieser Stelle jedoch nur „sieben“.
    reason: contextual_clarification
lexical_decisions:
- source_word: ἐμόλυνα
  choice: befleckt
  rationale: „Beflecken“ bewahrt das moralische Gewicht des Verbs, ohne ausdrücklich eine rein rituelle Verunreinigung zu behaupten.
- source_word: ὄνομα
  choice: Name
  rationale: Die wörtliche Wiedergabe erhält die antike Verbindung von Name, Ehre und Ansehen, ohne „Ruf“ erklärend in den Haupttext einzutragen.
- source_word: γῇ τῆς αἰχμαλωσίας μου
  choice: Land meiner Gefangenschaft
  rationale: Diese Formulierung folgt dem griechischen Ausdruck eng und hält sowohl die Erfahrung der Verschleppung als auch die Fremde im Blick.
- source_word: μονογενής
  choice: das einzige Kind
  rationale: Gemeint ist das einzige Nachkommenkind des Vaters; „einzige Tochter“ wäre kontextuell richtig, aber im Griechischen nicht ausdrücklich gesagt.
- source_word: κληρονομήσει αὐτόν
  choice: ihn beerben wird
  rationale: „Jemanden beerben“ ist natürliches modernes Deutsch und bildet den direkten griechischen Akkusativ genauer ab als „von ihm erben“.
- source_word: ἀδελφὸς ἐγγύς
  choice: naher Bruder
  rationale: Die bewusst enge Wiedergabe erhält die schwierige griechische Verwandtschaftsbezeichnung; eine Fußnote weist auf den möglichen weiteren Sinn „naher männlicher Verwandter“ hin.
- source_word: συντηρήσω ἐμαυτὴν αὐτῷ γυναῖκα
  choice: für den ich mich als Frau bewahren könnte
  rationale: Die Wiedergabe wahrt den Gedanken des Sich-Bewahrens beziehungsweise Sich-Bereithaltens zur Ehe, ohne das schwer bestimmbare familienrechtliche Verhältnis aufzulösen.
- source_word: ἀπώλοντό μοι ἑπτά
  choice: sieben sind mir umgekommen
  rationale: Die persönliche Verlustbedeutung des Dativs bleibt hörbar; „Ehemänner“ wird nicht ergänzt, da das Substantiv in diesem Satz nur aus dem Erzählzusammenhang hervorgeht.
- source_word: δοκεῖ σοι
  choice: es dir nicht gut erscheint
  rationale: Die Formulierung gibt das Urteil darüber wieder, was Gott als gut beziehungsweise angemessen erscheint, ohne es unmittelbar mit Gottes Willen gleichzusetzen.
- source_word: ἀποκτεῖναί με
  choice: mich zu töten
  rationale: Das klare deutsche Verb trifft den griechischen Ausdruck unmittelbar und bleibt im Gebetskontext würdig.
- source_word: ἐπίταξον ἐπιβλέψαι ἐπʼ ἐμέ
  choice: befiehl, auf mich zu blicken
  rationale: Die ungewöhnliche Befehlsform des griechischen Gebets wird bewusst nicht geglättet; „auf mich blicken“ bewahrt das Motiv göttlicher Zuwendung.
- source_word: ὀνειδισμόν
  choice: Schmähung
  rationale: „Schmähung“ bezeichnet die ehrverletzende Beschimpfung präziser und würdiger als ein bloßer „Vorwurf“.
theological_decisions:
- issue: Identität der sieben Umgekommenen
  choice: Im Haupttext steht nur „sieben“, wie im Griechischen.
  alternative: „Sieben Ehemänner“ ausdrücklich ergänzen.
  rationale: Aus dem Erzählzusammenhang sind die Ehemänner eindeutig, doch der Vers selbst nennt sie nicht. Die Erläuterung gehört deshalb in die Fußnote.
- issue: Schwierige Verwandtschafts- und Eheklausel
  choice: Die Bezeichnungen „naher Bruder“ und „Sohn“ sowie das Sich-Bewahren als Frau werden eng am Wortlaut wiedergegeben.
  alternative: Verallgemeinernd von einem nahen männlichen Verwandten oder einem heiratsfähigen Verwandten sprechen.
  rationale: Syntax und genaue familienrechtliche Beziehung sind im griechischen Text unsicher. Eine stärker deutende Fassung würde diese Unsicherheit unberechtigt beseitigen.
- issue: Göttlicher Blick und Erbarmen als Befehl
  choice: Die auffällige Form „befiehl, auf mich zu blicken“ bleibt erhalten.
  alternative: Glätten zu „blicke auf mich und erbarme dich meiner“.
  rationale: Die griechische Formulierung ist rhetorisch und syntaktisch ungewöhnlich. Die Übersetzung soll diese Spannung nicht stillschweigend auflösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit enger Bindung an die Gebetssprache des griechischen Textes. Ungewöhnliche Wendungen bleiben dort erhalten, wo sie echte syntaktische oder inhaltliche Spannung des Ausgangstextes tragen; erläuternde Präzisierungen stehen in den Fußnoten.
