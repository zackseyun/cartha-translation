base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/003/005.yaml
  text: And now your judgments are many and true in dealing with me concerning my sins and the sins of my fathers[a], because we did not keep your commandments[b]; for we did not walk in truth before you.
translation:
  language: de
  text: Und nun sind deine Urteile zahlreich und wahr in dem, was du wegen meiner Sünden und der Sünden meiner Väter[a] an mir tust; denn wir haben deine Gebote nicht gehalten und sind vor dir nicht in Wahrheit[b] gewandelt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit den „Sünden meiner Väter“ bekennt Tobit die Verfehlungen der vorangegangenen Generationen, ohne hier zu erklären, in welchem Sinn ihre Schuld ihn betrifft.
    reason: theological_clarification
  - marker: b
    text: „In Wahrheit wandeln“ ist eine biblische Redeweise für ein wahrhaftiges und treues Leben vor Gott.
    reason: lexical_alternative
lexical_decisions:
- source_word: κρίσεις
  choice: Urteile
  rationale: Bezeichnet in diesem Bußgebet Gottes richterliche Entscheidungen beziehungsweise sein richtendes Handeln; „Urteile“ wahrt den formalen und theologischen Sinn.
- source_word: ἀληθιναί
  choice: wahr
  rationale: Gibt die Grundbedeutung unmittelbar wieder und lässt die im Zusammenhang mitgemeinte Gerechtigkeit der göttlichen Urteile bestehen, ohne sie an die Stelle des griechischen Ausdrucks zu setzen.
- source_word: ἐξ ἐμοῦ ποιῆσαι
  choice: in dem, was du … an mir tust
  rationale: Die griechische Wendung ist ungewöhnlich; diese Formulierung ist im Deutschen verständlich und bewahrt Gottes auf Tobit bezogenes Handeln, ohne es durch „gegen mich“ unnötig zu verschärfen.
- source_word: περὶ τῶν ἁμαρτιῶν μου καὶ τῶν πατέρων μου
  choice: wegen meiner Sünden und der Sünden meiner Väter
  rationale: περί bezeichnet hier den Bezug beziehungsweise Anlass des göttlichen Handelns. Das wiederholte „Sünden“ verdeutlicht die im Griechischen elliptische Zuordnung.
- source_word: ἐντολάς
  choice: Gebote
  rationale: Die übliche und gewichtige deutsche Wiedergabe im Bundes- und Gehorsamskontext.
- source_word: ἐπορεύθημεν ἐν ἀληθείᾳ
  choice: sind … nicht in Wahrheit gewandelt
  rationale: Bewahrt das biblische Wegmotiv und die lexikalische Verbindung zu ἀληθιναί; „Wahrheit“ lässt sowohl Wahrhaftigkeit als auch Treue anklingen.
- source_word: ἐνώπιόν σου
  choice: vor dir
  rationale: Natürlich, knapp und geeignet für ein Leben unter Gottes Blick und in seiner Gegenwart.
theological_decisions:
- issue: Ob Gottes Urteile ausdrücklich als „gerecht“ statt als „wahr“ bezeichnet werden sollen
  choice: wahr
  alternative: gerecht
  rationale: Das Bekenntnis schließt die Richtigkeit und Gerechtigkeit von Gottes Handeln ein, doch der griechische Wortlaut lautet ἀληθιναί. „Wahr“ bewahrt diese Ausdrucksweise und die Spannung des Textes.
- issue: Ob die Sünden der Vorfahren als vererbte Schuld erklärt werden sollen
  choice: die Sünden meiner Väter
  alternative: die Sünden unserer Vorfahren
  rationale: Der Text nennt Tobits eigene Sünden und die seiner Väter. Die Übersetzung bewahrt die gemeinschaftliche beziehungsweise familiäre Beichte, ohne eine weitergehende Lehre über vererbte Schuld einzutragen.
- issue: Ob ἐν ἀληθείᾳ ausschließlich als Treue gedeutet werden soll
  choice: in Wahrheit
  alternative: treu
  rationale: Die wörtlichere Form bewahrt die Mehrdeutigkeit zwischen Wahrheit, Wahrhaftigkeit und Treue sowie den Anklang an die zuvor als „wahr“ bezeichneten Urteile.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrtem biblischem Wegmotiv. Der Satzbau wurde gegenüber dem Griechischen leicht geglättet; „wahr“ und „in Wahrheit gewandelt“ erhalten die bewusste lexikalische Verbindung.
