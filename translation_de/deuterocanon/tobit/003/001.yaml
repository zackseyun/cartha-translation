translation:
  language: de
  text: 'Betrübt weinte ich und betete voller Schmerz:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λυπηθεὶς
  choice: Da wurde ich traurig
  rationale: Das einleitende Aoristpartizip bezeichnet Tobits schmerzliches Betrübtwerden. Die finite deutsche Wendung ist natürlich und bewahrt den zeitlich-folgernden Anschluss.
- source_word: ἔκλαυσα
  choice: weinte
  rationale: κλαίω wird schlicht und ohne zusätzliche, im Griechischen nicht ausgedrückte Verstärkung wiedergegeben.
- source_word: προσηυξάμην
  choice: betete
  rationale: Die übliche und genaue Wiedergabe von προσεύχομαι im erzählenden Zusammenhang.
- source_word: μετʼ ὀδύνης
  choice: voller Schmerz
  rationale: ὀδύνη bezeichnet starken seelischen Schmerz. Die Wendung ist im heutigen Deutsch natürlich und erhält die Intensität.
- source_word: λέγων
  choice: ':'
  rationale: Der Doppelpunkt leitet im Deutschen den folgenden Wortlaut des Gebets idiomatisch ein und erfüllt hier die Funktion des griechischen Partizips λέγων.
