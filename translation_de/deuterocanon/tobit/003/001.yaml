  source_fidelity: 'Die Grundbedeutung wird getroffen: λυπηθείς, ἔκλαυσα, προσηυξάμην und μετʼ ὀδύνης sind erkennbar wiedergegeben. »Da wurde ich traurig« verschiebt das aoristische Partizip jedoch unnötig zu einem ausdrücklich eintretenden Zustandswechsel und legt einen stärkeren zeitlich-folgernden Zusammenhang nahe, als der griechische Satz verlangt.'
