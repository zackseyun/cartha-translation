base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/003/009.yaml
  text: Why do you flog us? If they have died[a], go with them! May we never see a son or daughter from you forever.
translation:
  language: de
  text: Warum geißelst du uns? Wenn sie gestorben sind,[a] dann geh mit ihnen! Mögen wir von dir niemals einen Sohn oder eine Tochter sehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sinngemäß auch: »Dann geh und stirb mit ihnen!« Im Griechischen steht nur »geh mit ihnen«; gemeint sind ihre verstorbenen Männer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μαστιγοῖς
  choice: geißelst
  rationale: Das Verb bezeichnet wörtlich das Schlagen mit einer Geißel oder Peitsche. „Geißelst“ bewahrt die drastische Bildsprache des griechischen Vorwurfs; hier ist sie als scharfe verbale Anklage zu verstehen.
- source_word: βάδιζε μετʼ αὐτῶν
  choice: geh mit ihnen
  rationale: βάδιζε ist ein Imperativ des Gehens. Die Formulierung bleibt nahe am Wortlaut; dass damit angesichts der verstorbenen Männer der Tod gemeint ist, wird nicht erklärend in den Haupttext eingefügt.
- source_word: μὴ ἴδωμέν
  choice: Mögen wir niemals … sehen
  rationale: Der Aoristkonjunktiv mit μή drückt hier einen starken negativen Wunsch beziehungsweise eine Verwünschung aus.
- source_word: σου υἱὸν ἢ θυγατέρα
  choice: einen Sohn oder eine Tochter von dir
  rationale: Der Genitiv σου bezeichnet die erhofften beziehungsweise hier verfluchten Nachkommen Saras. „Von dir“ gibt diesen Bezug im Deutschen natürlich wieder.
- source_word: εἰς τὸν αἰῶνα
  choice: niemals
  rationale: In Verbindung mit μή und dem Verb „sehen“ ist „niemals“ die idiomatische deutsche Wiedergabe der zeitlich uneingeschränkten Verneinung; ein zusätzliches „für immer“ wäre redundant.
theological_decisions:
- issue: Impliziter Sinn von „geh mit ihnen“
  choice: Die Aufforderung bleibt im Haupttext wörtlich als „geh mit ihnen“ stehen.
  alternative: „Geh und stirb mit ihnen.“
  rationale: Die verstorbenen Männer sind kontextuell gemeint, doch das Griechische nennt das Sterben in der Aufforderung nicht ausdrücklich. Die Übersetzung bewahrt daher die implizite, boshafte Todesverwünschung, ohne sie auszudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst scharfer Sprache entsprechend der gehässigen Rede. „Geißelst“ bewahrt das konkrete Bild des Ausgangstextes; die Todesanspielung bleibt im Haupttext unausgesprochen und wird in der Fußnote erläutert.
