base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/003/021.yaml
  text: And she was utterly grieved, so that she wept.
translation:
  language: de
  text: Und fürchte dich nicht, mein Kind, weil wir arm geworden sind. Du besitzt viel, wenn du Gott fürchtest, dich von jeder Sünde abwendest und tust, was ihm gefällt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der bereitgestellte griechische Ausgangstext lautet an dieser Stelle: „Und fürchte dich nicht, mein Kind …“. Die englische Konsultationsfassung („Und sie war überaus betrübt, sodass sie weinte“) hat in diesem griechischen Text keine Entsprechung; vermutlich liegt eine abweichende Verszuordnung vor.'
    reason: Dokumentiert transparent den erheblichen Widerspruch zwischen der angegebenen griechischen Quelle und der englischen Konsultationsfassung.
lexical_decisions:
- source_word: παιδίον
  choice: mein Kind
  rationale: Die Anrede ist im Deutschen natürlich und bewahrt den liebevollen, familiären Ton; das Possessivpronomen ist kontextuell ergänzt.
- source_word: ἐπτωχεύσαμεν
  choice: wir arm geworden sind
  rationale: Gibt den Aorist von πτωχεύω als eingetretene Verarmung wieder, nicht bloß als gegenwärtigen Zustand.
- source_word: ὑπάρχει σοι πολλὰ
  choice: Du besitzt viel
  rationale: Bewahrt die bewusst spannungsvolle Aussage trotz der zuvor genannten Armut; sie wird nicht erklärend auf geistlichen Reichtum verengt.
- source_word: φοβηθῇς τὸν θεόν
  choice: Gott fürchtest
  rationale: ‚Fürchten‘ wahrt die biblische Mehrdeutigkeit zwischen Ehrfurcht, Gehorsam und Furcht.
- source_word: τὸ ἀρεστὸν ἐνώπιον αὐτοῦ
  choice: was ihm gefällt
  rationale: Natürliches modernes Deutsch für das vor Gott Wohlgefällige, ohne den Sinn theologisch auszuweiten.
theological_decisions:
- issue: Art des verheißenen ‚Vielen‘
  choice: Die unbestimmte Formulierung ‚Du besitzt viel‘ bleibt erhalten.
  alternative: ‚Du wirst reich sein‘ oder ‚Du hast großen geistlichen Reichtum‘
  rationale: Der griechische Text bestimmt weder ausdrücklich einen zukünftigen materiellen Wohlstand noch ausschließlich geistlichen Reichtum.
- issue: Gottesfurcht und sittliches Handeln
  choice: Die konditionale Verknüpfung des griechischen Textes wird direkt wiedergegeben.
  alternative: Eine abschwächende oder rechtfertigungstheologische Umschreibung
  rationale: Die im Ausgangstext bestehende theologische Spannung soll nicht durch konfessionelle Deutung aufgelöst werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe paränetische Satzfolge und die Spannung zwischen äußerer Armut und dem Besitz von ‚vielem‘ bleiben erhalten.
