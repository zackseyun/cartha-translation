base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/003/002.yaml
  text: You are righteous[a], Lord, and all your works and all your ways are mercy and truth, and you judge true and righteous judgment forever.
translation:
  language: de
  text: Du bist gerecht, Herr, und alle deine Werke und alle deine Wege sind Barmherzigkeit und Wahrheit[a]; und du sprichst für immer ein wahres und gerechtes Urteil.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Barmherzigkeit und Treue“. Der griechische Plural ἐλεημοσύναι kann einzelne Erweise der Barmherzigkeit bezeichnen; ἀλήθεια kann hier auch die Bedeutung „Treue“ haben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Δίκαιος
  choice: gerecht
  rationale: Das prädikative Adjektiv bezeichnet Gottes Charakter; „gerecht“ bewahrt sowohl den moralischen als auch den richterlichen Sinn.
- source_word: Κύριε
  choice: Herr
  rationale: Direkte Anrede Gottes und die im Deutschen übliche biblische Wiedergabe von κύριος.
- source_word: πάντα τὰ ἔργα σου
  choice: alle deine Werke
  rationale: „Werke“ gibt den weiten Sinn dessen wieder, was Gott tut, ohne ihn auf einzelne Taten zu verengen.
- source_word: πᾶσαι αἱ ὁδοί σου
  choice: alle deine Wege
  rationale: Bewahrt das biblische Bild für Gottes Handeln und Walten.
- source_word: ἐλεημοσύναι
  choice: Barmherzigkeit
  rationale: Im Prädikat zu Gottes Wegen meint der Plural Erweise der Barmherzigkeit, nicht menschliches Almosengeben. Der deutsche Kollektivbegriff ist hier natürlich und würdig.
- source_word: ἀλήθεια
  choice: Wahrheit
  rationale: Direkte Wiedergabe des griechischen Wortes; die mögliche Bedeutungsnuance „Treue“ bleibt in der Fußnote erhalten.
- source_word: κρίσιν ἀληθινὴν καὶ δικαίαν
  choice: ein wahres und gerechtes Urteil
  rationale: Beide Adjektive und ihr Bezug auf κρίσιν bleiben ausdrücklich erhalten.
- source_word: κρίνεις
  choice: du sprichst … ein Urteil
  rationale: Idiomatic German judicial expression that transparently renders the cognate construction κρίσιν … κρίνεις.
- source_word: εἰς τὸν αἰῶνα
  choice: für immer
  rationale: Natürliche deutsche Wiedergabe der unbegrenzten Dauer; syntaktisch auf Gottes richterliches Handeln bezogen.
theological_decisions:
- issue: Bedeutung von ἀλήθεια in der Verbindung mit ἐλεημοσύναι
  choice: Wahrheit
  alternative: Treue
  rationale: „Wahrheit“ bildet den griechischen Wortlaut unmittelbar ab; „Treue“ ist eine mögliche biblisch-theologische Nuance, die nicht stillschweigend in den Haupttext eingetragen, sondern als Alternative dokumentiert wird.
- issue: Bezug von εἰς τὸν αἰῶνα
  choice: Gott spricht für immer ein wahres und gerechtes Urteil
  alternative: Das Urteil gilt für immer
  rationale: Die Schlussbestimmung steht am natürlichsten beim Verb κρίνεις und beschreibt Gottes dauerhaftes gerechtes Richten; die griechische Wortstellung lässt jedoch eine enge Verbindung mit dem gesamten Urteilssatz zu.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem Gebetston. Die vertrauten biblischen Begriffe „Werke“, „Wege“, „Barmherzigkeit“ und „Wahrheit“ bleiben erhalten; die Satzstruktur wurde nur so weit geglättet, wie es für natürliches Deutsch nötig ist.
