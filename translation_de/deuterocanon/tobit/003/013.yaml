  text: Tell me to release me from the earth[a], so that I may no longer hear reproach.
translation:
  language: de
  text: Sprich, dass ich von der Erde befreit werde[a] und keine Schmähung mehr höre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „von der Erde freigelassen werde“ oder „von der Erde genommen werde“. Die griechische Wendung ist eine indirekte Bitte, aus dem irdischen Leben entlassen zu werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰπὸν
  choice: Sprich
  rationale: Der Aoristimperativ von λέγω richtet eine unmittelbare Bitte an Gott. „Sprich“ bewahrt die Formulierung des griechischen Textes, ohne die Nuance durch „Befiehl“ unnötig festzulegen.
- source_word: ἀπολῦσαί με
  choice: dass ich … befreit werde
  rationale: ἀπολύω bezeichnet Loslassen, Freigeben oder Befreien. Die deutsche Konstruktion gibt den Inhalt des erbetenen göttlichen Ausspruchs natürlich wieder; das Passiv vermeidet eine im Deutschen schwer verständliche Infinitivfügung, ohne die indirekte Bitte um den Tod ausdrücklich auszudeuten.
- source_word: ἀπὸ τῆς γῆς
  choice: von der Erde
  rationale: γῆ kann Erde, Land oder Boden bedeuten. Hier bewahrt „von der Erde“ das Bild des Ausgangstextes und lässt dessen indirekten Bezug auf das Ende des irdischen Lebens bestehen.
- source_word: καὶ μὴ ἀκοῦσαί με μηκέτι
  choice: und … nicht mehr hören muss
  rationale: Die koordinierte Infinitivfügung bezeichnet den ebenfalls erbetenen Ausgang. „Nicht mehr“ gibt μηκέτι präzise wieder; „hören muss“ ist in modernem Deutsch natürlich und macht deutlich, dass die fortdauernde Erfahrung enden soll.
- source_word: ὀνειδισμόν
  choice: Schmähung
  rationale: ὀνειδισμός kann Vorwurf, Beschimpfung, Schmach oder Hohn bezeichnen. Wegen des Verbs „hören“ hebt „Schmähung“ den verbalen Spott hervor, ohne den Begriff auf einen einzelnen Vorwurf zu verengen.
theological_decisions:
- issue: Indirekte Todesbitte im Gebet
  choice: von der Erde befreit werde
  alternative: von der Erde genommen werde
  rationale: Der griechische Text spricht nicht ausdrücklich vom Sterben, sondern bittet um Befreiung von der Erde. Die Übersetzung erhält diese ehrfürchtige Umschreibung und die Spannung des Gebets, statt daraus eine explizite Aussage über Tod oder Jenseits zu machen.
- issue: Bedeutung von εἰπὸν vor dem Infinitiv
  choice: Sprich, dass
  alternative: Befiehl, dass
  rationale: Die Wendung kann als Bitte um einen göttlichen Ausspruch beziehungsweise Befehl verstanden werden. „Sprich“ bleibt lexikalisch näher am Ausgangstext und legt die Art des göttlichen Handelns nicht stärker fest als das Griechische.
translation_notes:
  register: Modernes, würdevolles Gebetsdeutsch. Die Satzform bleibt bewusst nahe an der ungewöhnlichen griechischen Bitte; „Schmähung“ wahrt den feierlichen Klagecharakter.
