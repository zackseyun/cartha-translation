base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/003/004.yaml
  text: For they disobeyed your commandments, and you gave us over to plunder and captivity and death, and to become a proverb of reproach among all the nations where we have been scattered.
translation:
  language: de
  text: Denn sie haben deinen Geboten nicht gehorcht, und du hast uns der Plünderung, der Gefangenschaft und dem Tod preisgegeben und uns bei allen Völkern, unter denen wir zerstreut worden sind, zu einem sprichwörtlichen Gegenstand des Spotts gemacht.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „zu einem Sprichwort des Spotts“; auch möglich: „zum Gespött“ oder „zum Gegenstand der Schande“.'
    reason: Die griechische Wendung verbindet ausdrücklich „Sprichwort/Spottwort“ mit „Spott/Schmähung“ und lässt sich im Deutschen nicht zugleich wörtlich und völlig idiomatisch wiedergeben.
lexical_decisions:
- source_word: παρήκουσαν
  choice: sie haben … nicht gehorcht
  rationale: Die Wendung gibt das Nichtbeachten beziehungsweise den Ungehorsam idiomatisch wieder und bewahrt das Subjekt in der dritten Person Plural.
- source_word: τῶν ἐντολῶν σου
  choice: deinen Geboten
  rationale: „Gebote“ wahrt den religiös-bundestheologischen Klang von ἐντολαί; der deutsche Dativ entspricht der natürlichen Rektion von „gehorchen“.
- source_word: ἔδωκας ἡμᾶς εἰς
  choice: hast du uns … preisgegeben
  rationale: „Preisgeben“ drückt das Ausliefern an widrige Folgen natürlich und mit erhaltener göttlicher Handlungsmacht aus.
- source_word: διαρπαγήν
  choice: Plünderung
  rationale: Die Wahl bezeichnet das Ausrauben beziehungsweise die Preisgabe als Beute unmittelbar.
- source_word: αἰχμαλωσίαν
  choice: Gefangenschaft
  rationale: Dies ist die direkte und kontextgerechte Wiedergabe; „Verbannung“ wäre weniger präzise.
- source_word: θάνατον
  choice: Tod
  rationale: Der einfache Wortsinn wird ohne Abschwächung bewahrt.
- source_word: παραβολὴν ὀνειδισμοῦ
  choice: zum sprichwörtlichen Gegenstand des Spottes
  rationale: Die Formulierung bewahrt sowohl das Motiv des Sprichworts beziehungsweise Spottworts als auch die öffentliche Schmähung und bleibt im Deutschen verständlich.
- source_word: πᾶσιν τοῖς ἔθνεσιν
  choice: unter allen Völkern
  rationale: „Völker“ ist im exilischen Zusammenhang breit und angemessen; „Heiden“ wäre stärker konfessionell beziehungsweise traditionssprachlich geprägt.
- source_word: ἐν οἷς ἐσκορπίσμεθα
  choice: unter die wir zerstreut worden sind
  rationale: Die Formulierung bezieht das Relativpronomen auf die Völker und bewahrt Passiv sowie Diaspora-Motiv.
theological_decisions:
- issue: Korporatives Bekenntnis und Gottes Handeln im Gericht
  choice: Der Ungehorsam bleibt in der dritten Person („sie“), während die leidende Gemeinschaft als „uns“ erscheint; Gottes aktives Preisgeben wird ausdrücklich bewahrt.
  alternative: „Wir haben nicht gehorcht“ beziehungsweise das Passiv „wir wurden preisgegeben“.
  rationale: Der griechische Text hält die Unterscheidung zwischen den Ungehorsamen und der gegenwärtig betroffenen Gemeinschaft sowie die göttliche Gerichtshandlung nebeneinander fest.
- issue: Bildhafte Sprache öffentlicher Schande
  choice: Das Doppelmotiv von sprichwörtlicher Rede und Spott bleibt im Haupttext erhalten.
  alternative: „zum Gespött“ oder „zum Gegenstand der Schande“.
  rationale: Eine bloß idiomatische Kurzfassung würde einen Teil der ungewöhnlichen griechischen Wortverbindung παραβολὴ ὀνειδισμοῦ verlieren; die Fußnote dokumentiert knapper mögliche Wiedergaben.
- issue: Verhältnis von Begründung und Folge
  choice: γάρ wird mit „Denn“ wiedergegeben; der folgende selbstständige Satz beginnt zur Verdeutlichung der Konsequenz mit „Darum“.
  alternative: Nur eine fortlaufende Satzverbindung mit „und“.
  rationale: „Denn“ erhält den rückbezüglichen Begründungscharakter von γάρ. „Darum“ macht den im Zusammenhang naheliegenden Zusammenhang von Ungehorsam und Gericht verständlich, ohne die göttliche Handlung abzuschwächen.
translation_notes:
  register: Moderne, würdevolle Gebetssprache. Die Satzteilung entlastet die lange Aufzählung. „Preisgegeben“ und „zerstreut“ bewahren den ernsten Gerichts- und Exilton, ohne altertümlich zu wirken. Der Fußnotenmarker [a] steht im Haupttext und erklärt die ungewöhnliche Schandmetapher.
