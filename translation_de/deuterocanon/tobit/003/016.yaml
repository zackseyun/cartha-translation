translation:
  language: de
  text: Und das Gebet der beiden wurde vor der Herrlichkeit[a] erhört.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „vor Gottes Herrlichkeit“ oder „in der Gegenwart der Herrlichkeit“. Im Griechischen wird Gott in diesem Satzteil nicht ausdrücklich genannt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσηκούσθη
  choice: wurde erhört
  rationale: Das Passiv von εἰσακούω bezeichnet bei einem Gebet gewöhnlich ein wohlwollendes Hören. Das deutsche „erhört“ gibt dies idiomatisch wieder, ohne bereits eine bestimmte Art der Gebetserfüllung auszuführen.
- source_word: προσευχὴ
  choice: das Gebet
  rationale: „Gebet“ ist die direkte und im Kontext natürliche Entsprechung.
- source_word: ἀμφοτέρων
  choice: der beiden
  rationale: Der Genitiv verweist auf die zwei zuvor genannten Personen; „der beiden“ ist im Deutschen knapp und eindeutig.
- source_word: ἐνώπιον
  choice: vor
  rationale: Die Präposition bezeichnet ein Sein vor beziehungsweise in der Gegenwart von jemandem oder etwas; „vor“ bewahrt die knappe Ausdrucksweise des Griechischen.
- source_word: τῆς δόξης
  choice: der Herrlichkeit
  rationale: Der bestimmte Artikel wird bewahrt. Die ehrfürchtige Umschreibung weist im Kontext wahrscheinlich auf Gottes herrliche Gegenwart, ohne dass Gott in diesem Satzteil ausdrücklich genannt wird.
theological_decisions:
- issue: Ob δόξης durch einen ausdrücklichen Gottesbezug erweitert werden soll
  choice: der Herrlichkeit
  alternative: der Herrlichkeit Gottes / in Gottes herrlicher Gegenwart
  rationale: Der griechische Text nennt Gott in diesem Satzteil nicht ausdrücklich. Die wörtlichere Wiedergabe erhält die ehrfürchtige indirekte Redeweise und ihre theologische Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Erhört“ ist im Zusammenhang mit Gebet natürlich und präziser als das bloße „gehört“. Die Großschreibung von „Herrlichkeit“ wird nicht als zusätzliche Sondermarkierung verwendet, da deutsche Substantive ohnehin großgeschrieben werden.
