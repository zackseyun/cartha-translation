base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/003/019.yaml
  text: And at all times bless the Lord God[a], and ask from him that your ways may be made straight and that all your paths and plans may prosper. For no nation has counsel, but the Lord himself gives all good things, and whomever he wills he humbles, as he wills. And now, child, remember my commandments[b], and do not let them be blotted out from your heart.
translation:
  language: de
  text: Und zu jeder Zeit preise Gott, den Herrn, und bitte ihn, dass deine Wege gerade werden und all deine Pfade und Pläne gelingen. Denn kein Volk hat Rat[a]; vielmehr gibt der Herr selbst alles Gute, und wen er will, den erniedrigt er, wie er will.[b] Und nun, Kind, denk an meine Gebote, und lass sie nicht aus deinem Herzen getilgt werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Aussage „kein Volk hat Rat“ ist im Griechischen knapp und mehrdeutig. Gemeint sein kann, dass kein Volk aus sich selbst über verlässlichen Rat verfügt, im Gegensatz zum Herrn, der alles Gute gibt.
    reason: alternative_reading
  - marker: b
    text: Das griechische Relativpronomen ist formal sächlich und kann auch mit „was er will“ wiedergegeben werden; im Zusammenhang ist ein Bezug auf Menschen naheliegend.
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: ἐν παντὶ καιρῷ
  choice: zu jeder Zeit
  rationale: Bewahrt die verteilende Bedeutung der griechischen Wendung und klingt im Deutschen natürlich und würdig.
- source_word: εὐλόγει
  choice: preise
  rationale: Wörtlich bedeutet das Verb „segne“; wenn Gott das Objekt ist, gibt „preise“ den gemeinten biblischen Sprachgebrauch im heutigen Deutsch klarer wieder.
- source_word: Κύριον τὸν Θεόν
  choice: Gott, den Herrn
  rationale: Eine natürliche deutsche Wiedergabe der Gottesbezeichnung, ohne ein im Griechischen nicht vorhandenes Possessivpronomen einzufügen.
- source_word: παρʼ αὐτοῦ αἴτησον
  choice: bitte ihn
  rationale: Das deutsche Verb „bitten“ bringt den Bezug auf den Geber idiomatisch zum Ausdruck; eine mechanische Wiedergabe als „bitte von ihm“ wäre unnatürlich.
- source_word: ὅπως αἱ ὁδοί σου εὐθεῖαι γένωνται
  choice: dass deine Wege gerade werden
  rationale: Bewahrt sowohl das Wegbild als auch die mögliche Bedeutung eines Geradewerdens; die alternative resultativ-passive Nuance wird in Fußnote [a] genannt.
- source_word: τρίβοι καὶ βουλαὶ
  choice: Pfade und Pläne
  rationale: Unterscheidet die beiden Bild- beziehungsweise Bedeutungsebenen und gibt βουλαί hier als persönliche Vorhaben wieder.
- source_word: εὐοδωθῶσιν
  choice: gelingen
  rationale: Drückt den günstigen Ausgang beziehungsweise erfolgreichen Fortgang knapp und idiomatisch aus.
- source_word: πᾶν ἔθνος οὐκ ἔχει βουλήν
  choice: kein Volk hat Rat
  rationale: Bleibt der knappen und schwierigen griechischen Aussage eng verbunden, ohne ihren Sinn durch eine erklärende Ergänzung festzulegen.
- source_word: δίδωσιν πάντα τὰ ἀγαθὰ
  choice: gibt alles Gute
  rationale: Bewahrt Gottes Handeln und die umfassende Formulierung des griechischen Textes.
- source_word: ὃ ἐὰν θέλῃ ταπεινοῖ
  choice: wen er will, den erniedrigt er
  rationale: Folgt der im Zusammenhang naheliegenden personalen Deutung, lässt aber die formale Möglichkeit eines sachlichen Bezugs in Fußnote [c] sichtbar.
- source_word: μνημόνευε τῶν ἐντολῶν μου
  choice: denk an meine Gebote
  rationale: Gibt den fortdauernden Imperativ verständlich wieder und wahrt den ausdrücklichen Bezug auf die Gebote des Sprechers.
- source_word: μὴ ἐξαλειφθήτωσαν ἐκ τῆς καρδίας σου
  choice: lass sie nicht aus deinem Herzen getilgt werden
  rationale: Erhält das starke Bild des Auslöschens beziehungsweise Tilgens und die passive Form.
theological_decisions:
- issue: Wiedergabe von κύριος als Gottesbezeichnung
  choice: der Herr
  alternative: der Gebieter
  rationale: „Der Herr“ ist die etablierte, ehrerbietige und konfessionell nicht verengende Wiedergabe von κύριος in diesem Zusammenhang.
- issue: Göttliche Freiheit in ὃ ἐὰν θέλῃ ταπεινοῖ, καθὼς βούλεται
  choice: wen er will, den erniedrigt er, wie er will
  alternative: was er will, erniedrigt er, wie es ihm gefällt
  rationale: Die Formulierung wahrt die schroffe Aussage über Gottes freies Handeln, ohne sie abzuschwächen oder dogmatisch weiter auszudeuten; die grammatische Alternative bleibt in einer Fußnote erhalten.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Bildhafte Begriffe wie „Wege“, „Pfade“, „Herz“ und „tilgen“ bleiben erhalten. Schwierige oder echte Mehrdeutigkeiten werden nicht im Haupttext geglättet, sondern knapp in den Fußnoten ausgewiesen.
