  yaml_path: translation/deuterocanon/tobit/003/007.yaml
  text: On that same day it happened to Sarah, the daughter of Raguel, in Ecbatana of Media, that she too was reproached by her father's maidservants,
translation:
  language: de
  text: Am selben Tag geschah es auch Sara, der Tochter Raguels, in Ekbatana in Medien, dass sie von den Dienerinnen ihres Vaters beschimpft[a] wurde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »geschmäht« oder »verhöhnt«; das griechische Verb bezeichnet vorwurfsvolle Beschimpfung oder ehrverletzende Rede.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν τῇ αὐτῇ ἡμέρᾳ
  choice: Am selben Tag
  rationale: Natürliche deutsche Zeitangabe; αὐτῇ stellt die Verbindung zum vorangehenden Geschehen her.
- source_word: συνέβη ... καὶ ταύτην ὀνειδισθῆναι
  choice: geschah es auch Sara ... dass sie ... beschimpft wurde
  rationale: Die unpersönliche Konstruktion mit Infinitiv wird im Deutschen durch „geschah es ... dass“ wiedergegeben. „auch“ bewahrt die additive, zum parallelen Erzählstrang überleitende Kraft von καὶ ταύτην, ohne sie unnötig auf das Pronomen zu verengen.
- source_word: τῇ θυγατρὶ Ῥαγουὴλ Σάρρᾳ
  choice: Sara, der Tochter Raguëls
  rationale: Bewahrt Namen und Abstammungsangabe in natürlicher deutscher Apposition.
- source_word: ἐν Ἐκβατάνοις τῆς Μηδείας
  choice: in Ekbatana in Medien
  rationale: Gibt Stadt und Region klar und idiomatisch wieder; der Genitiv bezeichnet hier die geografische Zuordnung.
- source_word: ὀνειδισθῆναι
  choice: beschimpft wurde
  rationale: Das Verb bezeichnet vorwurfsvolle, ehrverletzende verbale Angriffe. „Beschimpft“ ist gegenwärtig, verständlich und wahrt die Schärfe des Ausdrucks.
- source_word: ὑπὸ παιδισκῶν πατρὸς αὐτῆς
  choice: von den Dienerinnen ihres Vaters
  rationale: „Dienerinnen“ gibt Geschlecht und untergeordnete Stellung wieder, ohne sich hinsichtlich des rechtlichen Status stärker festzulegen, als dieser Vers allein verlangt.
