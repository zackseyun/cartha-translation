  yaml_path: translation/deuterocanon/tobit/003/011.yaml
  text: And she prayed by the window and said[a], “Blessed are you, Lord my God, and blessed is your holy and honored name forever; let all your works bless you forever.”
translation:
  language: de
  text: 'Und sie betete am Fenster und sagte: »Gepriesen seist du, Herr, mein Gott! Gepriesen sei dein heiliger und hochgeehrter Name in Ewigkeit. Alle deine Werke sollen dich in Ewigkeit preisen.[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Alle deine Werke sollen dich in Ewigkeit segnen.“ Im Griechischen steht hier dieselbe Wortfamilie wie bei „Gepriesen“ am Anfang des Gebets.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδεήθη
  choice: betete
  rationale: Das Verb bezeichnet eine eindringliche, an Gott gerichtete Bitte. Im unmittelbaren Gebetskontext gibt „betete“ den Sinn natürlich wieder, ohne die Intensität unnötig zu steigern.
- source_word: πρὸς τῇ θυρίδι
  choice: am Fenster
  rationale: θυρίς bezeichnet ein Fenster oder eine Öffnung; die Präpositionalverbindung gibt hier am natürlichsten den Ort an.
- source_word: Εὐλογητὸς
  choice: Gepriesen
  rationale: In einer an Gott gerichteten Doxologie ist „gepriesen“ idiomatischer als „gesegnet“ und bewahrt zugleich einen würdigen biblischen Ton.
- source_word: Κύριε ὁ θεός μου
  choice: Herr, mein Gott
  rationale: Die direkte Anrede wird im Deutschen natürlich mit einer Apposition wiedergegeben. „Herr“ ist die übliche Wiedergabe von κύριος in der Anrede Gottes.
- source_word: τὸ ὄνομά σου τὸ ἅγιον καὶ ἔντιμον
  choice: dein heiliger und hochgeehrter Name
  rationale: ἔντιμος bezeichnet etwas Geachtetes, Geehrtes oder Kostbares. „Hochgeehrt“ passt im Deutschen natürlich zu „Name“ und wahrt den Gedanken ehrfürchtiger Wertschätzung.
- source_word: εἰς τοὺς αἰῶνας / εἰς τὸν αἰῶνα
  choice: in Ewigkeit
  rationale: Beide Wendungen drücken in diesem Lobgebet unbegrenzte Dauer aus. Die gleiche Wiedergabe erhält den Parallelismus.
- source_word: εὐλογησάτωσάν
  choice: sollen ... preisen
  rationale: Der Aoristimperativ der dritten Person hat auffordernden beziehungsweise jussiven Sinn. Beim Handeln der Werke Gottes gegenüber Gott gibt „preisen“ den gemeinten Sinn im heutigen Deutsch klar wieder.
- source_word: πάντα τὰ ἔργα σου
  choice: alle deine Werke
  rationale: Die Formulierung bleibt bewusst weit und kann sowohl Gottes Taten als auch das von ihm Geschaffene umfassen.
theological_decisions:
- issue: Wiedergabe von κύριος in der direkten Anrede Gottes
  choice: Herr
  alternative: Gebieter
  rationale: Im Gebet ist „Herr“ die sachlich und sprachlich angemessene traditionelle Gottesbezeichnung; der Kontext verlangt keine abweichende Spezifizierung.
- issue: Segenssprache, die auf Gott bezogen ist
  choice: preisen
  alternative: segnen
  rationale: Die griechischen Formen gehören derselben Wortfamilie an. „Preisen“ ist jedoch bei einer von Gottes Werken an Gott gerichteten Handlung im modernen Deutsch eindeutig und natürlich. Die mögliche wörtlichere Wiedergabe „segnen“ wird in der Fußnote bewahrt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Gebetston. Die Ausrufezeichen gliedern die doxologische Anrede natürlich; der breite Ausdruck „Werke“ und die wiederholte Zeitangabe bleiben erhalten.
