  text: And now[a], Lord, I have set my eyes and my face toward you.
translation:
  language: de
  text: Und nun, Herr, habe ich meine Augen und mein Gesicht auf dich gerichtet.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »habe ich dir meine Augen und mein Gesicht gegeben«. Die griechische Wendung meint wahrscheinlich, dass sich die betende Person Gott zuwendet.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ νῦν
  choice: Und nun
  rationale: Die Wendung markiert schlicht den unmittelbaren Fortgang des Gebets.
- source_word: Κύριε
  choice: Herr
  rationale: Der Vokativ von κύριος wird in natürlichem modernem Deutsch als direkte Anrede „Herr“ wiedergegeben.
- source_word: τοὺς ὀφθαλμούς μου
  choice: meine Augen
  rationale: Die wörtliche Wiedergabe bewahrt die körperliche Bildsprache des griechischen Textes.
- source_word: τὸ πρόσωπόν μου
  choice: mein Gesicht
  rationale: Neben „Augen“ ist die konkrete Bedeutung „Gesicht“ am naheliegendsten und erhält die parallele körperliche Ausdrucksweise.
- source_word: εἰς σὲ
  choice: auf dich
  rationale: Bei „Augen“ und „Gesicht richten“ drückt „auf dich“ im Deutschen die Orientierung zu Gott hin idiomatisch aus.
- source_word: δέδωκα
  choice: habe … gerichtet
  rationale: Das Perfekt von δίδωμι bedeutet wörtlich „habe gegeben“, bezeichnet hier aber wahrscheinlich das bewusste Hinwenden im Gebet. Das deutsche Perfekt wahrt den Aspekt einer vollzogenen, fortwirkenden Ausrichtung.
theological_decisions:
- issue: Wiedergabe von κύριος in der direkten Anrede Gottes
  choice: Herr
  alternative: O Herr
  rationale: „Herr“ entspricht dem griechischen Vokativ und klingt im heutigen Deutsch würdig und natürlich; ein zusätzliches „O“ ist nicht erforderlich.
- issue: Deutung der körperlichen Wendung mit δίδωμι
  choice: als Ausrichtung auf Gott im Gebet
  alternative: 'wörtlich: Augen und Gesicht Gott geben'
  rationale: Die idiomatische Wiedergabe vermittelt die wahrscheinliche Bedeutung, während die Fußnote die auffällige wörtliche Form offenlegt und so die Bildsprache nicht verdeckt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die konkrete Körperbildsprache bleibt erhalten; nur das im Deutschen missverständliche „gegeben“ wird im Haupttext idiomatisch als „gerichtet“ wiedergegeben und in der Fußnote dokumentiert.
