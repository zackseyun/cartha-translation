base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/003/003.yaml
  text: Remember me and look upon me[a]; do not punish me for my sins and my errors done in ignorance, and for those of my fathers[c][b], which they committed before you.
translation:
  language: de
  text: Denk an mich und sieh auf mich! Ahnde[a] nicht meine Sünden und meine unwissentlich begangenen Verfehlungen[b] und auch nicht die Sünden meiner Vorfahren[c], die vor dir gesündigt haben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Vergilt mir nicht meine Sünden“ beziehungsweise wörtlicher: „Räche nicht meine Sünden.“ Das griechische Verb kann das Rächen oder die strafende Durchsetzung des Rechts bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Gemeint sind schuldhafte Verfehlungen, die aus Unwissenheit oder ohne volle Erkenntnis begangen wurden.
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „Väter“; gemeint sind hier die Vorfahren beziehungsweise früheren Generationen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μνήσθητί μου
  choice: Denk an mich
  rationale: Der Imperativ ist eine Gebetsbitte um Gottes zugewandtes Gedenken. „Denk an mich“ ist unmittelbar, natürlich und bewahrt den biblischen Gebetston.
- source_word: ἐπίβλεψον ἐπʼ ἐμέ
  choice: sieh auf mich
  rationale: Die Wendung bittet eindringlich um Gottes Aufmerksamkeit und Zuwendung. „Sieh auf mich“ ist würdevoll und im modernen Deutsch gut verständlich.
- source_word: μὴ ἐκδίκῃς
  choice: Ahnde nicht
  rationale: ἐκδικέω kann „rächen“, „Recht verschaffen“ oder „strafend vergelten“ bedeuten. Mit den Sünden als Gegenstand bezeichnet es hier deren strafende Ahndung; „ahnden“ erhält diese forensische Färbung, ohne Gott menschliche Rachsucht zuzuschreiben.
- source_word: τὰς ἁμαρτίας μου
  choice: meine Sünden
  rationale: „Sünden“ gibt das moralische und theologische Gewicht von ἁμαρτίαι direkt wieder.
- source_word: τοῖς ἀγνοήμασίν μου
  choice: meine unwissentlich begangenen Verfehlungen
  rationale: ἀγνόημα bezeichnet schuldhafte Handlungen, die aus Unwissenheit oder ohne volle Erkenntnis begangen wurden. Die Formulierung macht diesen Aspekt deutlich, ohne sie zu bloßen Irrtümern abzuschwächen.
- source_word: τῶν πατέρων μου
  choice: die Sünden meiner Vorfahren
  rationale: πατέρες meint hier die früheren Generationen. „Vorfahren“ ist im heutigen Deutsch eindeutiger als das wörtliche „Väter“; „die Sünden“ wird zur natürlichen Kennzeichnung des im Griechischen elliptischen Bezugs ergänzt.
- source_word: ἃ ἥμαρτον ἐνώπιόν σου
  choice: die vor dir gesündigt haben
  rationale: Der Plural ἥμαρτον weist am ehesten auf die Vorfahren als handelndes Subjekt. „Vor dir“ bewahrt die relationale und gerichtliche Aussage von ἐνώπιόν σου.
theological_decisions:
- issue: Bezugsbereich von ἃ ἥμαρτον ἐνώπιόν σου
  choice: 'Der Relativsatz bezieht sich auf die Vorfahren: Sie haben vor Gott gesündigt.'
  alternative: Der Satz kann weiter gefasst als Rückblick auf sämtliche zuvor genannten Sünden verstanden werden.
  rationale: Das finite Verb ἥμαρτον steht im Plural und weist daher am natürlichsten auf den nächstliegenden pluralischen Personenausdruck „meine Vorfahren“. Die Übersetzung unterscheidet so persönliche und ererbte beziehungsweise gemeinschaftlich bekannte Schuld, ohne ihre theologische Beziehung näher festzulegen.
- issue: Bedeutung von μὴ ἐκδίκῃς im Gebet
  choice: Bitte, die genannten Sünden nicht strafend zu ahnden.
  alternative: 'Wörtlicher und schärfer: „Räche nicht meine Sünden.“'
  rationale: Der griechische Ausdruck enthält den Gedanken gerechter Vergeltung. „Ahnde nicht“ bewahrt ihn, vermeidet aber die im modernen Deutsch leicht missverständliche Vorstellung persönlicher Rachsucht.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Gebetston. Die kurzen Imperative bleiben eindringlich; Fachsprache und konfessionell geprägte Deutungen werden vermieden. Die griechische Unebenheit in der Reihung der Kasus wird nicht mechanisch nachgebildet, sondern in natürlichem Deutsch transparent gemacht.
