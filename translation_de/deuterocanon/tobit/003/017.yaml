base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/003/017.yaml
  text: 'of the great Raphael. And he was sent to heal the two: to remove the white films from Tobit''s eyes[a], and to give Sarah daughter of Raguel to Tobiah son of Tobit as a wife, and to bind Asmodeus, the evil demon, because Tobiah was entitled to inherit her. At that same time Tobit returned and entered into his house, and Sarah daughter of Raguel came down from her upper room.'
translation:
  language: de
  text: 'des großen Rafaels. Und er wurde gesandt, die beiden zu heilen: die weißen Beläge von Tobits Augen abzulösen, Sara, die Tochter Raguels, Tobias, dem Sohn Tobits, zur Frau zu geben und Asmodäus, den bösen Dämon, zu fesseln; denn Tobias hatte den Anspruch darauf, sie zu erben.[a] Zur selben Zeit kehrte Tobit zurück und betrat sein Haus, und Sara, die Tochter Raguels, kam aus ihrem Obergemach herab.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sinngemäßer: „denn Tobias hatte das Recht, sie zu heiraten“. Im Griechischen steht „sie zu erben“; darin spiegelt sich der rechtlich-familiäre Rahmen der Erzählung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦ μεγάλου Ῥαφαήλ
  choice: des großen Raphael
  rationale: Der Genitivanschluss und damit der fragmentarische Beginn des Verses werden beibehalten, da die Wendung syntaktisch an den vorhergehenden Kontext anschließt. Der Personenname folgt der geläufigen deutschen Form.
- source_word: ἀπεστάλη
  choice: er wurde gesandt
  rationale: Das Passiv wahrt, dass der göttliche Sender im griechischen Text unausgesprochen bleibt.
- source_word: ἰάσασθαι τοὺς δύο
  choice: die beiden zu heilen
  rationale: Die knappe Formulierung umfasst sowohl Tobits körperliche Heilung als auch Saras Befreiung und wird nicht auf nur eine der folgenden Handlungen verengt.
- source_word: λεπίσαι τὰ λευκώματα
  choice: die weißen Beläge von Tobits Augen abzulösen
  rationale: „Ablösen“ gibt den bildhaften Sinn des Abschälens wieder; „weiße Beläge“ beschreibt die sichtbaren Trübungen, ohne sie vorschnell als moderne Diagnose „Katarakt“ festzulegen. Die Augen sind aus dem unmittelbaren Sachzusammenhang ergänzt.
- source_word: δοῦναι ... γυναῖκα
  choice: Sara ... Tobias ... zur Frau zu geben
  rationale: Die deutsche Heiratsformel gibt die griechische Konstruktion natürlich und zugleich sachlich wieder.
- source_word: δῆσαι Ἀσμοδαῖον τὸ πονηρὸν δαιμόνιον
  choice: Asmodäus, den bösen Dämon, zu fesseln
  rationale: „Fesseln“ bewahrt die konkrete Bedeutung von δῆσαι und die Vorstellung wirksamer Einschränkung. „Asmodäus“ ist die im Deutschen eingebürgerte Namensform.
- source_word: ἐπιβάλλει κληρονομῆσαι αὐτήν
  choice: hatte den Anspruch, sie zu erben
  rationale: Die Formulierung bewahrt sowohl den rechtlichen Anspruch als auch die ungewöhnliche Erbsprache des griechischen Textes im ehelichen Zusammenhang.
- source_word: ἐν αὐτῷ τῷ καιρῷ
  choice: Zur selben Zeit
  rationale: Die Wendung stellt die Gleichzeitigkeit der beiden erzählten Vorgänge klar heraus.
- source_word: ὑπερῴου
  choice: Obergemach
  rationale: Das Wort bezeichnet einen Raum im oberen Stockwerk; „Obergemach“ ist knapp, verständlich und dem historischen Erzählmilieu angemessen.
theological_decisions:
- issue: Umfang von Raphaels Heilungsauftrag
  choice: „die beiden zu heilen“ leitet die gesamte Reihe der Handlungen an Tobit und Sara ein
  alternative: Das Heilen nur auf Tobits Augen beziehen und Saras Befreiung als davon getrennte Aufgabe darstellen
  rationale: Der Infinitiv ἰάσασθαι bezieht sich auf „die beiden“ und eröffnet die nachfolgende Aufzählung. So bleibt der weitere Sinn von Heilung einschließlich Befreiung erhalten.
- issue: Rechtlich-ehelicher Sinn von κληρονομῆσαι αὐτήν
  choice: „hatte den Anspruch, sie zu erben“
  alternative: „hatte das Recht, sie zu heiraten“
  rationale: Die Hauptfassung erhält die auffällige Erbterminologie und den rechtlich-familiären Rahmen. Die Fußnote bietet die idiomatische Deutung, ohne sie stillschweigend in den Text einzutragen.
translation_notes:
  register: 'Modernes, würdevolles Standarddeutsch mit klarer Satzführung. Der fragmentarische Versanfang wird wegen des griechischen Genitivanschlusses bewusst erhalten. Personenname: „Sara“ und „Tobias“ als geläufige deutsche Formen; „Tobit“ unterscheidet den Vater vom Sohn. Die ungewöhnliche Erbsprache bleibt im Haupttext sichtbar und wird in der Fußnote erläutert.'
