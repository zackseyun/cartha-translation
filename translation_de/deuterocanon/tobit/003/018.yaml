  text: Seek counsel from every wise person[a], and do not despise any useful counsel.
translation:
  language: de
  text: Suche Rat bei jedem weisen Menschen, und verachte keinen nützlichen Rat.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συμβουλίαν / συμβουλίας
  choice: Rat
  rationale: „Rat“ gibt das auf Entscheidungen bezogene συμβουλία in beiden Satzhälften natürlich und lexikalisch einheitlich wieder.
- source_word: παρὰ παντὸς φρονίμου
  choice: bei jedem weisen Menschen
  rationale: παρά mit Genitiv bezeichnet hier die Quelle; im Deutschen ist „Rat bei jemandem suchen“ idiomatisch. Das substantivierte φρόνιμος ist allgemein und nicht ausdrücklich männlich.
- source_word: ζήτησον
  choice: Suche
  rationale: Der Aoristimperativ fordert zur aktiven Suche auf; „Suche Rat“ bewahrt diese Kraft.
- source_word: μὴ καταφρονήσῃς
  choice: verachte nicht
  rationale: καταφρονέω bezeichnet Geringschätzung oder Verachtung; „verachten“ erhält die stärkere Wertung gegenüber dem schwächeren „nicht beachten“.
- source_word: χρησίμης
  choice: nützlichen
  rationale: „Nützlich“ ist die direkte und im Zusammenhang natürliche Wiedergabe von χρήσιμος.
theological_decisions:
- issue: Allgemeiner Personenbezug von φρονίμου
  choice: jedem weisen Menschen
  alternative: jedem weisen Mann
  rationale: Das Griechische verwendet ein substantiviertes Adjektiv ohne ausdrücklich männliches Substantiv; die Übersetzung bewahrt den allgemeinen Bezug.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung von „Rat“ spiegelt die Wiederholung von συμβουλία im griechischen Text und klingt im Deutschen nicht störend.
