  yaml_path: translation/deuterocanon/tobit/003/010.yaml
  text: When she heard these things[a], she was deeply grieved, so that she wanted to hang herself. But she said, “I am my father’s only child. If I do this, it will be a disgrace to him, and I will bring his old age down with sorrow to Hades.”
translation:
  language: de
  text: 'Als sie das hörte, wurde sie so tief betrübt, dass sie sich erhängen wollte. Doch sie sagte: „Ich bin das einzige Kind meines Vaters. Wenn ich das tue, wird es ihm Schande bringen, und ich werde sein hohes Alter mit Kummer in den Hades[a] hinabbringen.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „in das Totenreich“ beziehungsweise „ins Grab“. Im Griechischen steht „Hades“.
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα ἀκούσασα
  choice: Als sie das hörte
  rationale: Die temporale Partizipialkonstruktion wird in natürlichem Deutsch wiedergegeben. Das neutrale „das“ verweist auf das zuvor Gesagte, ohne dessen Inhalt näher festzulegen.
- source_word: ἐλυπήθη σφόδρα
  choice: wurde sie so tief betrübt
  rationale: „Tief betrübt“ gibt den starken seelischen Schmerz von λυπέω mit der Verstärkung σφόδρα würdig und verständlich wieder; „so“ leitet zugleich die folgende Ergebniskonstruktion ein.
- source_word: ὥστε ἀπάγξασθαι
  choice: dass sie sich erhängen wollte
  rationale: Die ὥστε-Konstruktion bezeichnet hier eine Folge beziehungsweise einen erwogenen Schritt. Der Kontext zeigt, dass sie die Tat nicht ausführt; „wollte“ vermeidet daher, einen vollzogenen oder endgültig gefassten Entschluss zu behaupten.
- source_word: Μία μέν εἰμι τῷ πατρί μου
  choice: Ich bin das einzige Kind meines Vaters
  rationale: Die griechische Wendung bezeichnet sie als die eine beziehungsweise einzige ihres Vaters. „Einziges Kind“ bewahrt, dass der Text an dieser Stelle nicht ausdrücklich „Tochter“ sagt.
- source_word: ὄνειδος αὐτῷ ἔσται
  choice: wird es Schande über ihn bringen
  rationale: ὄνειδος bezeichnet Schmach, Schande oder öffentlichen Vorwurf. Die gewählte Formulierung passt zum sozialen Ehrkontext und klingt im modernen Deutsch natürlich.
- source_word: τὸ γῆρας αὐτοῦ κατάξω
  choice: ich werde sein hohes Alter … hinabbringen
  rationale: 'Die ungewöhnliche Bildsprache des griechischen Textes bleibt erhalten: Ihr Handeln würde das Alter ihres Vaters hinabführen. „Hohes Alter“ verdeutlicht γῆρας als Lebensalter, ohne das Objekt in „ihn“ umzudeuten.'
- source_word: μετʼ ὀδύνης
  choice: voller Kummer
  rationale: ὀδύνη kann Schmerz, Qual oder Kummer bezeichnen. Im Zusammenhang mit dem Leid des Vaters gibt „voller Kummer“ die emotionale Bedeutung idiomatisch wieder.
- source_word: εἰς ᾅδου
  choice: in den Hades
  rationale: Der griechische Text nennt ausdrücklich ᾅδης. „Hades“ bewahrt diesen Ausdruck und vermeidet die theologisch enger gefasste Wiedergabe „Hölle“.
theological_decisions:
- issue: Wiedergabe von ᾅδης im griechischen deuterokanonischen Text
  choice: Hades
  alternative: Totenreich; Grab
  rationale: „Hades“ folgt dem ausdrücklichen griechischen Begriff und lässt dessen genaue Vorstellung offen. „Hölle“ wäre eine unzulässige dogmatische Verengung; verständliche Bedeutungsalternativen werden in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die drastische Aussage über Suizid wird entsprechend dem Ausgangstext klar benannt. Die fremdartige Wendung vom Hinabbringen des hohen Alters bleibt bewusst erhalten, wird aber syntaktisch flüssig gestaltet. Der Fußnotenmarker steht unmittelbar bei „Hades“, da sich die Anmerkung auf diesen Ausdruck bezieht.
