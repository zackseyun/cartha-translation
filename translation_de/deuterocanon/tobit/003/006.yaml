base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/003/006.yaml
  text: And now deal with me according to what is pleasing to you[a]. Command that my spirit be taken up, so that I may be released and become dust. For it is better for me to die than to live, because I have heard false reproaches, and there is great grief within me. Command that I be released now from this distress into the everlasting place[b], and do not turn your face away from me.
translation:
  language: de
  text: Und nun verfahre mit mir, wie es dir gefällt. Gebiete, dass mein Geist aufgenommen werde, damit ich frei werde und zu Erde werde.[a] Denn es ist besser für mich zu sterben als zu leben, weil ich falsche Schmähungen gehört habe und großer Kummer in mir ist. Gebiete, dass ich jetzt aus dieser Bedrängnis befreit werde und an den ewigen Ort[b] gelange. Wende dein Angesicht nicht von mir ab.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „zu Erde werde“. Die Wendung ist eine bildhafte Umschreibung des Todes und der Rückkehr zur Erde.'
    reason: lexical_alternative
  - marker: b
    text: „Der ewige Ort“ ist eine allgemeine Bezeichnung für den Ort der Toten; der griechische Text verwendet hier keinen genauer bestimmten Begriff für das Jenseits.
    reason: theological_ambiguity
lexical_decisions:
- source_word: κατὰ τὸ ἀρεστόν σου
  choice: wie es dir gefällt
  rationale: Die Wendung bezeichnet das, was Gott wohlgefällig ist beziehungsweise seinem Willen entspricht. Die deutsche Formulierung ist natürlich und bewahrt die Ausrichtung auf Gottes Entscheidung.
- source_word: ἐπίταξον
  choice: Gebiete
  rationale: Der Imperativ bittet Gott um einen autoritativen Befehl. „Gebiete“ wahrt Direktheit und feierlichen Gebetsstil.
- source_word: ἀναλαβεῖν τὸ πνεῦμά μου
  choice: dass mein Geist aufgenommen wird
  rationale: Die passive Form bewahrt das Bild des Aufnehmens und gibt πνεῦμα ausdrücklich mit „Geist“ wieder, ohne durch „Leben“ oder „Seele“ eine bestimmte Anthropologie einzutragen.
- source_word: ἀπολυθῶ
  choice: damit ich frei werde
  rationale: ἀπολύω bezeichnet Freilassen oder Entlassen und dient hier als Umschreibung des Todes. „Frei werde“ erhält das Bild, ohne einen spezifischen Lehrbegriff zu verwenden.
- source_word: γένωμαι γῆ
  choice: zu Erde werde
  rationale: Die wörtliche Wiedergabe bewahrt das Sterblichkeitsbild des griechischen Textes. Im Deutschen ist „zu Erde werden“ verständlich und vermeidet, γῆ ohne Not durch „Staub“ zu ersetzen.
- source_word: λυσιτελεῖ μοι
  choice: es ist besser für mich
  rationale: Die idiomatische Wendung bedeutet, dass etwas vorteilhafter oder zuträglicher ist. Im Vergleich von Sterben und Leben ist „besser für mich“ die natürliche deutsche Entsprechung.
- source_word: ὀνειδισμοὺς ψευδεῖς
  choice: falsche Schmähungen
  rationale: „Schmähungen“ gibt den verletzenden Charakter von ὀνειδισμοί wieder; „falsche“ bewahrt ausdrücklich deren Unwahrheit.
- source_word: λύπη ἐστὶν πολλὴ ἐν ἐμοί
  choice: großer Kummer in mir ist
  rationale: Die Formulierung erhält sowohl die starke innere Trauer als auch die existentielle Satzstruktur des Griechischen.
- source_word: τῆς ἀνάγκης
  choice: aus dieser Bedrängnis
  rationale: ἀνάγκη kann Zwang, Not oder Bedrängnis bezeichnen. Im Klagegebet entspricht „Bedrängnis“ dem leidvollen Kontext, ohne die Bedeutung unnötig einzuengen.
- source_word: εἰς τὸν αἰώνιον τόπον
  choice: an den ewigen Ort
  rationale: Die transparente Wiedergabe lässt den Zielort so allgemein wie im Griechischen und benennt weder Totenreich noch Himmel.
- source_word: μὴ ἀποστρέψῃς τὸ πρόσωπόν σου ἀπʼ ἐμοῦ
  choice: Wende dein Angesicht nicht von mir ab
  rationale: Die Formulierung bewahrt das biblische Bild vom abgewandten Angesicht und passt zum würdevollen Gebetsregister.
theological_decisions:
- issue: Anthropologische Aussage in der Todesbitte
  choice: dass mein Geist aufgenommen wird
  alternative: dass mir das Leben genommen wird
  rationale: Der Ausgangstext nennt ausdrücklich πνεῦμα. „Geist“ bewahrt diese Aussage, ohne sie auf das biologische Leben zu reduzieren oder eine ausgearbeitete Lehre über den Zustand nach dem Tod festzulegen.
- issue: Bedeutung des Zielortes nach dem Tod
  choice: an den ewigen Ort
  alternative: ins Totenreich / in den Himmel
  rationale: Der griechische Text nennt lediglich den „ewigen Ort“. Die allgemeine Formulierung wird beibehalten, damit keine genauere Jenseitsvorstellung in den Text eingetragen wird.
- issue: ἀπολύω als Todesumschreibung
  choice: frei werde / befreit werde
  alternative: sterbe / aus dem Leben scheide
  rationale: Die wiederholte Befreiungsmetaphorik des griechischen Textes bleibt sichtbar. Dadurch wird der Tod nicht verschleiert, aber auch nicht an beiden Stellen interpretierend ausdrücklich eingesetzt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst biblisch-feierlichen Elementen wie „Gebiete“ und „Angesicht“. Die direkte, klagende Gebetssprache und die Wiederholung der Befreiungsmetaphorik bleiben erhalten. Beide Fußnotenmarker stehen an den jeweils erläuterten Wendungen im Haupttext.
