base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/003/020.yaml
  text: And now I am showing you the ten talents of silver that I deposited with Gabael son of Gabrias in Rages of Media[a][b].
translation:
  language: de
  text: Und nun zeige ich dir[a] die zehn Talente Silber, die ich bei Gabael, dem Sohn des Gabrias, in Rages in Medien[b] hinterlegt habe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »mache ich dir bekannt« beziehungsweise »weise ich dich darauf hin«; das griechische Verb muss kein körperliches Vorzeigen bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Der Ortsname wird auch »Rhages« geschrieben.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιδεικνύω
  choice: zeige ich dir
  rationale: Das Präsens und die Grundbedeutung »zeigen, auf etwas hinweisen« bleiben erhalten. Im Zusammenhang kann das Verb sowohl ein tatsächliches Vorzeigen als auch ein ausdrückliches Bekanntmachen bezeichnen; diese Spannweite wird in einer Fußnote kenntlich gemacht.
- source_word: τὰ δέκα τάλαντα τοῦ ἀργυρίου
  choice: die zehn Talente Silber
  rationale: Die antike Gewichts- und Geldeinheit wird nicht in einen modernen Wert umgerechnet. »Silber« gibt den Stoff beziehungsweise Geldwert knapp und natürlich wieder.
- source_word: παρεθέμην
  choice: hinterlegt habe
  rationale: Die mediale Verbform bezeichnet hier das Übergeben von Vermögen zur Verwahrung. »Hinterlegt« trifft diesen finanziellen Zusammenhang genauer als das allgemeinere »anvertraut«.
- source_word: Γαβαήλῳ
  choice: Gabael
  rationale: Der Personenname wird in einer im Deutschen gut lesbaren Form aus dem Griechischen transliteriert.
- source_word: τῷ τοῦ Γαβρεία
  choice: dem Sohn des Gabrias
  rationale: Die griechische Verbindung aus Artikel, Genitiv und Personenname ist eine übliche patronymische Angabe und wird im Deutschen ausdrücklich als Vater-Sohn-Beziehung wiedergegeben.
- source_word: ἐν Ῥάγοις τῆς Μηδείας
  choice: in Rages in Medien
  rationale: Der Ortsname wird transliteriert; »in Medien« gibt die geografische Zuordnung idiomatisch und ohne den missverständlichen deutschen Genitiv »von Medien« wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit enger Bindung an die griechische Satzstruktur. Die antike Einheit »Talent« sowie die Eigennamen bleiben transparent erhalten; unnötige Modernisierung oder konfessionelle Deutung wird vermieden.
