base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/002/005.yaml
  text: And when I returned[b][a], I washed myself and ate my bread in sorrow.
translation:
  language: de
  text: Als ich zurückkam, wusch ich mich[a] und aß voll Trauer mein Brot[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Text sagt: „wusch ich mich“. Im Zusammenhang ist wahrscheinlich ein Waschen nach der Berührung eines Toten gemeint; die semitische Parallelüberlieferung hebt den Reinheitsaspekt deutlicher hervor.'
    reason: cultural_note
  - marker: b
    text: 'Oder: „meine Mahlzeit“. Wörtlich steht im Griechischen „mein Brot“; „Brot“ kann auch allgemein Nahrung oder eine Mahlzeit bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιστρέψας
  choice: Als ich zurückkam
  rationale: Das Aoristpartizip bezeichnet eine Handlung, die den Hauptverben vorausgeht. Die temporale Wiedergabe ist im Deutschen natürlich und bewahrt die erzählerische Abfolge.
- source_word: ἐλουσάμην
  choice: wusch ich mich
  rationale: Die mediale Form bezeichnet hier naheliegend das Waschen des eigenen Körpers. Der griechische Wortlaut benennt keine rituelle Reinigung ausdrücklich.
- source_word: ἤσθιον
  choice: aß
  rationale: Das Imperfekt kann in dieser knappen Erzählfolge idiomatisch mit dem deutschen Präteritum wiedergegeben werden, ohne einen besonderen Verlaufsaspekt aufzudrängen.
- source_word: τὸν ἄρτον μου
  choice: mein Brot
  rationale: ἄρτος bedeutet wörtlich „Brot“, kann aber auch allgemeiner für Nahrung oder eine Mahlzeit stehen. Die konkrete Ausdrucksweise des Griechischen bleibt im Haupttext erhalten.
- source_word: ἐν λύπῃ
  choice: voll Trauer
  rationale: Die Wendung gibt den begleitenden Gemütszustand natürlich und würdig wieder. λύπη kann Trauer, Kummer oder Betrübnis bezeichnen.
theological_decisions:
- issue: Ob das Waschen ausdrücklich als rituelle Reinigung bezeichnet werden soll
  choice: Im Haupttext steht lediglich „wusch ich mich“.
  alternative: „reinigte ich mich“ oder „nahm ich ein Reinigungsbad“
  rationale: Der Zusammenhang mit der Bestattung und die semitische Parallelüberlieferung weisen auf den Umgang mit Leichenunreinheit hin. Das griechische Ausgangswort nennt jedoch nur das Waschen; eine ausdrückliche rituelle Deutung würde mehr festlegen als der Wortlaut.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Satzfolge bleibt knapp; „voll Trauer“ klingt natürlicher als das formalere „in Trauer“, ohne die Bedeutung zu verstärken.
