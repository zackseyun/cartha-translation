base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/002/014.yaml
  text: But she said[a], “It was given to me as a gift in addition to my wages.” But I did not believe her, and I told her to give it back to its owners; and I was embarrassed before her. Then she answered and said to me, “Where are your acts of mercy and your righteous deeds? Behold[d][c][b], everything about you is known.”
translation:
  language: de
  text: 'Sie aber sagte: »Das ist mir zusätzlich zu meinem Lohn als Geschenk gegeben worden.«[a] Doch ich glaubte ihr nicht und forderte sie auf, es seinen Eigentümern[b] zurückzugeben; dabei schämte ich mich vor ihr.[c] Sie erwiderte mir: »Wo sind deine Werke der Barmherzigkeit und deine gerechten Taten?[d] Sieh doch, alles an dir ist bekannt.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »zusammen mit meinem Lohn« beziehungsweise »als Teil meines Lohns«. Die griechische Wendung bezeichnet etwas, das in Verbindung mit dem Lohn gegeben wurde; im Zusammenhang versteht Anna es offenbar als zusätzliches Geschenk.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »seinen Herren«. Gemeint sind hier diejenigen, denen das Tier gehört.'
    reason: lexical_alternative
  - marker: c
    text: Das griechische Wort bedeutet wörtlich, dass jemand errötet; hier drückt es Scham oder Beschämung aus.
    reason: lexical_alternative
  - marker: d
    text: 'Oder: »deine Almosen und deine Taten der Gerechtigkeit«. Beide griechischen Wörter stehen im Plural und bezeichnen konkrete Handlungen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Δῶρον δέδοταί μοι
  choice: Das ist mir … als Geschenk gegeben worden
  rationale: Das griechische Perfekt Passiv bezeichnet etwas, das Anna von anderer Seite als Geschenk erhalten hat; die deutsche Form bewahrt Ergebnis und Passiv.
- source_word: ἐπὶ τῷ μισθῷ
  choice: zusätzlich zu meinem Lohn
  rationale: Die Präpositionalphrase verbindet das Geschenk mit dem Lohn. Der Kontext legt eine Zugabe nahe, lässt aber auch die allgemeinere Bedeutung »zusammen mit« oder »als Teil von« zu.
- source_word: οὐκ ἐπίστευον αὐτῇ
  choice: ich glaubte ihr nicht
  rationale: Die schlichte deutsche Vergangenheitsform gibt den erzählenden Imperfekt idiomatisch wieder, ohne eine zusätzliche Motivation einzutragen.
- source_word: ἀποδιδόναι αὐτὸ τοῖς κυρίοις
  choice: es seinen Eigentümern zurückzugeben
  rationale: ἀποδιδόναι bedeutet hier zurückgeben; κύριοι bezeichnet im Zusammenhang die Verfügungsberechtigten beziehungsweise Eigentümer des Tieres, nicht einen theologischen Herrentitel.
- source_word: ἠρυθρίων πρὸς αὐτήν
  choice: dabei schämte ich mich vor ihr
  rationale: Das Verb bezeichnet wörtlich Erröten und überträgt im Kontext Scham oder Beschämung; »vor ihr« wahrt den Bezug von πρὸς αὐτήν.
- source_word: ἐλεημοσύναι
  choice: Werke der Barmherzigkeit
  rationale: Der Plural kann konkret Almosengaben bezeichnen, umfasst aber sprachlich barmherzige Taten; die Formulierung bleibt modern und ethisch konkret.
- source_word: δικαιοσύναι
  choice: gerechte Taten
  rationale: Der griechische Plural verweist hier auf konkrete Handlungen und nicht bloß auf die abstrakte Eigenschaft Gerechtigkeit.
- source_word: ἰδοὺ γνωστὰ πάντα μετὰ σοῦ
  choice: Sieh doch, alles an dir ist bekannt
  rationale: Die knappe, idiomatisch schwierige Aussage wird verständlich wiedergegeben, ohne festzulegen, ob Annas Vorwurf öffentliche Bloßstellung, den sichtbaren Ausgang von Tobits Frömmigkeit oder eine allgemein offenbar gewordene Haltung meint.
theological_decisions:
- issue: Konkreter Sinn des Plurals δικαιοσύναι
  choice: gerechte Taten
  alternative: Taten der Gerechtigkeit
  rationale: Der Plural bezeichnet im nichtpaulinischen ethischen Zusammenhang konkrete Werke. Die Wiedergabe vermeidet, daraus eine Aussage über einen abstrakten Heilsstatus zu machen.
- issue: Reichweite von ἐλεημοσύναι
  choice: Werke der Barmherzigkeit
  alternative: Almosen
  rationale: Der Ausdruck kann speziell Almosengaben meinen, besonders im Tobitbuch, trägt aber auch den weiteren Sinn barmherzigen Handelns. Haupttext und Fußnote bewahren beide Möglichkeiten.
- issue: Aussagekraft des abschließenden Vorwurfs
  choice: Sieh doch, alles an dir ist bekannt
  alternative: Siehe, alles bei dir ist offenkundig
  rationale: Die Übersetzung erhält die Schärfe und zugleich die Unbestimmtheit des griechischen Satzes, ohne ausdrücklich ein göttliches Urteil oder einen öffentlichen Skandal einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer direkter Rede. »Sieh doch« gibt ἰδού nachdrücklich, aber weniger altertümlich als »siehe« wieder. Die etwas offene Schlussformulierung ist bewusst beibehalten, weil der griechische Ausdruck knapp und mehrdeutig ist.
