  source_fidelity: 'Der Entwurf gibt die griechische Abfolge und den Sinn zuverlässig wieder: die Gabe im Zusammenhang mit dem Lohn, Tobits Misstrauen und Aufforderung zur Rückgabe, seine Beschämung sowie Annas scharfe, bewusst knappe Erwiderung. Die Deutung von τοῖς κυρίοις als „Eigentümern“ ist im unmittelbaren Sachzusammenhang angemessen. Die offene Schlussformulierung wahrt die semantische Kürze und Ambiguität von γνωστὰ πάντα μετὰ σοῦ.'
