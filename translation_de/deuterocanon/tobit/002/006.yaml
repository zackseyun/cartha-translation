base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/002/006.yaml
  text: And I remembered the prophecy of Amos[a], as he said, “Your festivals will be turned into mourning, and all your rejoicing into lamentation.” And I wept.
translation:
  language: de
  text: 'Da erinnerte ich mich an die Prophezeiung des Amos[a], wie er gesagt hatte: »Eure Feste werden in Trauer verwandelt werden und all eure Freude in Klage.« Und ich weinte.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die zitierte Aussage greift Amos 8,10 in der Septuaginta-Tradition auf.
    reason: cross_reference
lexical_decisions:
- source_word: ἐμνήσθην
  choice: ich erinnerte mich
  rationale: Das deponentisch gebrauchte Aoristverb wird im Deutschen natürlich aktiv wiedergegeben; die Formulierung ist direkt und idiomatisch.
- source_word: προφητείας
  choice: Prophezeiung
  rationale: Der Singular bezeichnet hier den zitierten prophetischen Ausspruch des Amos. „Prophezeiung“ ist verständlich und wahrt den schriftsprachlichen Ton.
- source_word: Στραφήσονται
  choice: werden … verwandelt werden
  rationale: Die Passivform bewahrt, dass die Feste eine Umkehrung erfahren, ohne den Handelnden ausdrücklich zu benennen.
- source_word: ἑορταὶ
  choice: Feste
  rationale: „Feste“ bezeichnet natürliche und allgemein verständliche Weise gemeinschaftliche, religiös geprägte Festzeiten.
- source_word: πένθος
  choice: Trauer
  rationale: Das Wort bezeichnet im prophetischen Zusammenhang Trauer, auch in ihrer öffentlichen Ausdrucksform.
- source_word: εὐφροσύναι
  choice: Freude
  rationale: Der deutsche Sammelbegriff gibt die freudigen Äußerungen und Anlässe natürlich wieder; das vorangestellte „all“ entspricht πᾶσαι.
- source_word: θρῆνον
  choice: Klage
  rationale: „Klage“ erfasst den Ausdruck der Trauer und erhält den gehobenen prophetischen Ton, ohne altertümlich zu wirken.
- source_word: ἔκλαυσα
  choice: ich weinte
  rationale: Die schlichte Vergangenheitsform gibt den punktuellen Erzählfortgang knapp und würdig wieder.
theological_decisions:
- issue: Wiedergabe des eingebetteten Amos-Zitats
  choice: 'Als direkte prophetische Rede in der zweiten Person Plural: „Eure Feste werden in Trauer verwandelt werden und all eure Freude in Klage.“'
  alternative: 'Freier und weniger formal: „Aus euren Festen wird Trauer, aus all eurer Freude Klage.“'
  rationale: Der griechische Text führt ausdrücklich eine Prophezeiung ein und zitiert sie. Die direkte Rede wahrt den intertextuellen Bezug und lässt die nicht ausdrücklich genannte Ursache der Verwandlung offen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das einleitende „Da“ markiert den Erzählfortgang, ohne dem Text eine zusätzliche Kausalität aufzuzwingen. Die Prophetensprache bleibt gehoben, aber allgemein verständlich.
