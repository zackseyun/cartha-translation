base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/002/009.yaml
  text: And on that very night[a], after I had gone out and buried him, I lay down to sleep in a defiled state beside the wall of the courtyard, and my face was uncovered.
translation:
  language: de
  text: Und noch in derselben Nacht kehrte ich zurück, nachdem ich ihn begraben hatte, und legte mich in unreinem Zustand[a] an der Mauer des Hofes schlafen; mein Gesicht war unbedeckt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »verunreinigt«. Gemeint ist kultische Unreinheit infolge der Bestattung, nicht unbedingt moralische Schuld.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν αὐτῇ τῇ νυκτί
  choice: noch in derselben Nacht
  rationale: Die betonte Wendung bezeichnet dieselbe Nacht und hebt die unmittelbare zeitliche Abfolge hervor. »Noch in derselben Nacht« gibt dies in natürlichem Deutsch wieder.
- source_word: ἀνέλυσα
  choice: kehrte ich zurück
  rationale: ἀναλύω kann je nach Zusammenhang »aufbrechen«, »weggehen« oder »zurückkehren« bedeuten. Nach der vorausgesetzten Bestattung außerhalb des Hauses passt hier »zurückkehren« am besten zum Handlungsablauf, ohne den folgenden Partizipsatz zu überladen.
- source_word: θάψας
  choice: nachdem ich ihn begraben hatte
  rationale: Das Aoristpartizip bezeichnet eine der Rückkehr vorausgehende Handlung. Das im Kontext erkennbare Objekt wird im Deutschen mit »ihn« ausgedrückt.
- source_word: ἐκοιμήθην
  choice: legte mich … schlafen
  rationale: Die Form kann sowohl das Schlafen als auch das Niederlegen zum Schlaf bezeichnen. Die konkrete Ortsangabe spricht für die natürliche Wiedergabe »legte mich … schlafen«.
- source_word: μεμιαμμένος
  choice: in unreinem Zustand
  rationale: Das Perfektpartizip beschreibt einen fortbestehenden Zustand der Verunreinigung. Im Zusammenhang mit der Bestattung ist kultische, nicht notwendig moralische Unreinheit gemeint.
- source_word: παρὰ τὸν τοῖχον τῆς αὐλῆς
  choice: an der Mauer des Hofes
  rationale: Die räumliche Angabe wird schlicht und idiomatisch wiedergegeben; »Hof« bewahrt den häuslichen Schauplatz.
- source_word: τὸ πρόσωπόν μου ἀκάλυπτον ἦν
  choice: mein Gesicht war unbedeckt
  rationale: πρόσωπον bezeichnet ausdrücklich das Gesicht, nicht den Kopf. »Unbedeckt« erhält die für das folgende Geschehen wichtige Angabe genau.
theological_decisions:
- issue: Unreinheit infolge der Bestattung
  choice: in unreinem Zustand
  alternative: verunreinigt; unrein
  rationale: Die Formulierung bewahrt die kultische Bedeutung des Ausdrucks und vermeidet, dem Erzähler moralische Schuld zuzuschreiben. Die Fußnote macht diese Unterscheidung kenntlich, ohne die Spannung des Textes aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt eng am griechischen Handlungsablauf, wird jedoch durch einen temporalen Nebensatz und ein Semikolon für heutige Leser übersichtlich gestaltet.
