base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/002/008.yaml
  text: And the neighbors were mocking[a], saying, “He is no longer afraid of being put to death over this matter; he ran away, and look, he is burying the dead again.”
translation:
  language: de
  text: 'Und die Nachbarn verspotteten ihn[a] und sagten: »Er fürchtet sich nicht mehr, wegen dieser Sache getötet zu werden. Er ist geflohen, und seht, wieder begräbt er die Toten.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Andere Texttraditionen des Buches Tobit weichen hier erheblich ab. In der indirekten hebräischen Rückübersetzung spricht Hanna davon, dass Tobits Güte und Gerechtigkeit ihm in seiner Not und Schande nichts geholfen hätten; vom Spott der Nachbarn über die Bestattung der Toten ist dort nicht die Rede.
    reason: textual_variant
lexical_decisions:
- source_word: οἱ πλησίον
  choice: die Nachbarn
  rationale: Das substantivierte Adjektiv bezeichnet Menschen aus Tobits unmittelbarer Umgebung; »die Nachbarn« ist im Deutschen die natürlichste kontextuelle Wiedergabe.
- source_word: ἐνέγελων
  choice: verspotteten ihn
  rationale: Das Imperfekt beschreibt anhaltenden oder wiederholten Spott. Das im Deutschen nötige Objekt »ihn« ergibt sich eindeutig aus der gegen Tobit gerichteten Rede.
- source_word: Οὐκέτι φοβεῖται
  choice: Er hat keine Angst mehr
  rationale: Die Formulierung gibt das Präsens mit οὐκέτι direkt und in natürlichem modernem Deutsch wieder.
- source_word: φονευθῆναι
  choice: getötet zu werden
  rationale: Der passive Infinitiv bezeichnet das Getötetwerden. Die Wiedergabe bleibt bewusst allgemeiner als »hingerichtet«, da die griechische Form keinen ausdrücklich rechtlichen Vollzug bezeichnet.
- source_word: περὶ τοῦ πράγματος τούτου
  choice: wegen dieser Sache
  rationale: Im Zusammenhang bezeichnet die Wendung den Anlass der drohenden Tötung; »wegen dieser Sache« gibt diesen Bezug knapp und idiomatisch wieder.
- source_word: ἀπέδρα
  choice: Damals ist er geflohen
  rationale: Der Aorist verweist auf Tobits frühere Flucht. »Damals« verdeutlicht den zeitlichen Rückblick, ohne einen zusätzlichen Sachinhalt einzuführen.
- source_word: καὶ ἰδοὺ
  choice: und nun seht
  rationale: ἰδού lenkt in direkter Rede nachdrücklich die Aufmerksamkeit auf das gegenwärtige Geschehen. »Nun seht« bewahrt diese Lebendigkeit in würdigem, aktuellem Deutsch.
- source_word: πάλιν
  choice: schon wieder
  rationale: Im spöttischen Kontext bringt »schon wieder« nicht nur die Wiederholung, sondern auch den vorwurfsvollen Ton der Nachbarn natürlich zum Ausdruck.
- source_word: θάπτει τοὺς νεκρούς
  choice: begräbt er die Toten
  rationale: Das griechische Präsens bezeichnet die erneut stattfindende Handlung; im Deutschen ist nach »nun seht« das einfache Präsens idiomatisch.
theological_decisions:
- issue: Verhältnis des griechischen Hauptzeugen zur abweichenden semitischen Texttradition
  choice: Der Haupttext folgt der griechischen Lesart, in der die Nachbarn Tobit wegen der erneuten Bestattung der Toten verspotten.
  alternative: Eine indirekte neuzeitliche hebräische Rückübersetzung bietet stattdessen Hannas Vorwurf, Tobits Barmherzigkeit und Gerechtigkeit hätten ihm in Not und Schande nicht geholfen.
  rationale: Der vorgegebene primäre Übersetzungsanker ist der griechische Text. Die hebräische Fassung Neubauers ist kein antiker hebräischer Zeuge, sondern eine Rückübersetzung aus einer aramäischen Handschrift und kann daher die griechische Lesart nicht verdrängen; die erhebliche Abweichung wird jedoch transparent in einer Fußnote genannt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die direkte Rede bleibt lebendig und spöttisch, ohne altertümliche Wendungen wie »siehe« oder eine konfessionell geprägte Auslegung.
