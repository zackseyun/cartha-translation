base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/002/001.yaml
  text: When I had come down to my house[a], and Anna my wife and Tobiah my son were restored to me, on the feast of Pentecost, which is the holy feast of seven weeks, a fine meal was prepared for me[c][b], and I reclined to eat.
translation:
  language: de
  text: Als ich in mein Haus hinabgekommen war und mir meine Frau Anna und mein Sohn Tobija zurückgegeben worden waren, wurde mir am Pfingstfest[a], dem heiligen Fest der sieben Wochen, ein gutes Mahl bereitet[c]. Ich legte mich zum Essen zu Tisch[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „am Wochenfest“. Der griechische Text nennt das Fest „Pfingsten“ und erklärt es unmittelbar als das heilige Fest der sieben Wochen.'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlich: „Ich legte mich hin, um zu essen.“ Gemeint ist die antike Sitte, beim Mahl zu Tisch zu liegen.'
    reason: cultural_note
  - marker: c
    text: 'Die parallele semitische Texttradition bietet an dieser Stelle eine längere Fassung: Tobija wird ausgesandt, um einen armen Verwandten zum Mahl einzuladen. Dieser Zusatz fehlt im hier übersetzten kürzeren griechischen Wortlaut.'
    reason: textual_variant
lexical_decisions:
- source_word: κατῆλθον
  choice: ich ... hinabgekommen war
  rationale: Bewahrt die Richtungsangabe des griechischen Verbs; das Plusquamperfekt fügt sich natürlich in den deutschen temporalen Nebensatz ein.
- source_word: οἶκόν μου
  choice: mein Haus
  rationale: Gibt den konkreten Wortlaut enger wieder als „mein Zuhause“, ohne den persönlichen Bezug zu verlieren.
- source_word: ἀπεδόθη μοι
  choice: mir ... zurückgegeben worden waren
  rationale: Bewahrt das Passiv und den Gedanken, dass Anna und Tobija Tobit nach der Trennung zurückgegeben wurden. Im Deutschen steht wegen der beiden Personen der Plural.
- source_word: Ἄννα ἡ γυνή μου
  choice: meine Frau Anna
  rationale: Natürliche deutsche Wortstellung; der griechische Name Ἄννα wird als Anna wiedergegeben.
- source_word: Τωβίας
  choice: Tobija
  rationale: Die Form gibt den semitischen Namen im Deutschen transparent wieder und vermeidet die traditionell latinisierte Form „Tobias“.
- source_word: πεντηκοστῇ ἑορτῇ
  choice: am Pfingstfest
  rationale: Bewahrt die griechische Festbezeichnung; die folgende Erklärung stellt zugleich den Bezug zum jüdischen Wochenfest klar.
- source_word: ἁγία ἑπτὰ ἑβδομάδων
  choice: dem heiligen Fest der sieben Wochen
  rationale: Gibt die erklärende Apposition des Griechischen wieder, ohne sie auf eine ausschließlich spätere christliche Bedeutung festzulegen.
- source_word: ἐγενήθη ἄριστον καλὸν μοι
  choice: wurde mir ... ein gutes Mahl bereitet
  rationale: Natürliche deutsche Wiedergabe des wörtlichen Sinnes „ein gutes Mahl entstand für mich“; „Mahl“ lässt die genaue Tageszeit offen.
- source_word: ἀνέπεσα
  choice: ich legte mich ... zu Tisch
  rationale: Spiegelt die antike Sitte wider, beim Essen auf einem Polster zu liegen, und ist im Deutschen verständlicher als das isolierte „ich lehnte mich zurück“.
- source_word: τοῦ φαγεῖν
  choice: zum Essen
  rationale: Gibt den Zweck des articularen Infinitivs knapp und idiomatisch wieder.
theological_decisions:
- issue: Bezeichnung des Festes πεντηκοστή in einem jüdischen Erzählzusammenhang
  choice: Pfingstfest ... heiliges Fest der sieben Wochen
  alternative: Wochenfest
  rationale: Die gewählte Fassung hält sowohl an der ausdrücklichen griechischen Bezeichnung als auch an ihrer unmittelbar folgenden jüdischen Erklärung fest und vermeidet so eine einseitig christliche Lesart.
- issue: Namensform Τωβίας
  choice: Tobija
  alternative: Tobias
  rationale: „Tobija“ macht die semitische Namensform im modernen Deutschen erkennbar; „Tobias“ bleibt eine mögliche traditionelle Form.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzfolge wurde zur besseren Lesbarkeit geteilt. „Zu Tisch legen“ bewahrt den historischen Vorgang, während die Fußnote die fremde Tischsitte erläutert. Die Fußnotenmarker stehen jeweils unmittelbar bei der betreffenden Formulierung.
