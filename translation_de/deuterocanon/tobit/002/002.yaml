revisions:
- from: 'Und ich sah die vielen Speisen[a] und sagte zu meinem Sohn: »Geh und bring einen von unseren Brüdern[b] mit, den du in Not findest und der an den Herrn denkt. Sieh, ich warte auf dich.«[c]'
  to: 'Und ich sah viele Speisen[a] und sagte zu meinem Sohn: »Geh und bring jeden unserer Brüder mit, den du bedürftig findest und der sich an den Herrn erinnert. Sieh, ich warte auf dich.«[c][b]'
  rationale: Die Revision präzisiert zwei semantisch relevante Ausdrücke (ἐνδεής, μέμνηται), macht die unbestimmte Relativkonstruktion deutlicher und glättet »die vielen Speisen« zu idiomatischem »viele Speisen«. Die textkritische Unsicherheit der Schlussformel bleibt durch die vorhandene Fußnote kenntlich. Der Fußnotenanker b wird entsprechend dem englischen Audit-Trail am Schluss der Rede zusätzlich gesetzt, damit die Erläuterung zu »Brüdern« nicht mit dem textkritischen Anker kollidiert.
