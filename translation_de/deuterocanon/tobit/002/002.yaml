    issue: »der an den Herrn denkt«
    rationale: μέμνηται bedeutet primär »sich erinnern« bzw. »im Sinn behalten«. »An jemanden denken« kann im Deutschen bloß einen aktuellen Gedankenvorgang bezeichnen und schwächt die direkte Erinnerungssemantik.
