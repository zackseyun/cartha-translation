base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/002/002.yaml
  text: And I saw much food[a], and I said to my son, “Go and bring whichever one of our brothers you may find in need, who remembers the Lord; and behold[c][b], I am waiting for you.”
translation:
  language: de
  text: 'Und ich sah viele Speisen[a] und sagte zu meinem Sohn: »Geh und bring jeden unserer Brüder mit, den du bedürftig findest und der sich an den Herrn erinnert. Sieh, ich warte auf dich.«[c][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »viele Gerichte« beziehungsweise »viel Essen«. Das griechische Wort bezeichnet zubereitete Speisen, die zu einer Mahlzeit gereicht werden.'
    reason: lexical_alternative
  - marker: b
    text: Mit »unseren Brüdern« sind hier Angehörige von Tobits eigenem Volk gemeint, nicht nur leibliche Brüder.
    reason: cultural_note
  - marker: c
    text: Die Schlussworte sind in der griechischen Textüberlieferung ungewöhnlich formuliert. Gemeint ist offenbar, dass Tobit zurückbleibt und auf die Rückkehr seines Sohnes wartet.
    reason: textual_variant
lexical_decisions:
- source_word: ἐθεασάμην
  choice: ich sah
  rationale: Das Aoristverb bezeichnet hier schlicht die Wahrnehmung und fügt sich natürlich in die Erzählfolge ein.
- source_word: ὄψα πολλά
  choice: die vielen Speisen
  rationale: ὄψα bezeichnet zubereitete Speisen beziehungsweise Beilagen zu einer Mahlzeit; »Speisen« bleibt anschaulich, ohne die Art der Gerichte festzulegen.
- source_word: Βάδισον
  choice: Geh
  rationale: Der Imperativ wird im Deutschen idiomatisch als Aufforderung »Geh« wiedergegeben.
- source_word: ἄγαγε
  choice: bring ... mit
  rationale: Im Zusammenhang soll der Sohn einen Bedürftigen zur Mahlzeit bringen; »mitbringen« gibt die Zielrichtung im Deutschen natürlich wieder.
- source_word: ὃν ἐὰν εὕρῃς
  choice: einen ..., den du ... findest
  rationale: Die Verbindung mit ἐάν ist unbestimmt; die Formulierung wahrt zugleich die singularische Konstruktion des Griechischen.
- source_word: τῶν ἀδελφῶν ἡμῶν
  choice: von unseren Brüdern
  rationale: Die Verwandtschaftsbezeichnung bleibt erhalten; gemeint sind hier Angehörige von Tobits eigenem Volk, nicht nur leibliche Brüder.
- source_word: ἐνδεής
  choice: in Not
  rationale: ἐνδεής bezeichnet einen Menschen, dem es am Nötigen fehlt. »In Not« ist verständlich und nicht ausschließlich auf Geldmangel beschränkt.
- source_word: ὃς μέμνηται τοῦ κυρίου
  choice: der an den Herrn denkt
  rationale: Das Perfekt μέμνηται kann »sich erinnern« oder »bedenken, im Sinn behalten« bedeuten. »An den Herrn denkt« klingt im Deutschen natürlich und bewahrt die religiöse Ausrichtung.
- source_word: ἰδοὺ μένω σε
  choice: Sieh, ich warte auf dich
  rationale: Die überlieferte griechische Formulierung ist ungewöhnlich. »Sieh« gibt ἰδού wieder, während »ich warte auf dich« den naheliegenden Sinn von μένω σε ausdrückt, ohne die textliche Schwierigkeit zu verschweigen.
theological_decisions:
- issue: Wiedergabe von κύριος in einer Frömmigkeitsformel
  choice: der Herr
  alternative: der HERR
  rationale: Der griechische Ausgangstext bietet κύριος und nicht unmittelbar den hebräischen Gottesnamen; deshalb steht im Haupttext »der Herr«.
- issue: Bedeutungsumfang von ἀδελφῶν ἡμῶν
  choice: unsere Brüder
  alternative: unsere Volksgenossen
  rationale: Die familiäre Metapher des Ausgangstextes wird bewahrt. Eine Fußnote erläutert, dass die Gemeinschaft des eigenen Volkes gemeint ist.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die direkte Rede ist natürlich formuliert; die ungewöhnliche Schlusskonstruktion und die Bedeutungsbreite von ὄψα werden in Fußnoten offengelegt.
