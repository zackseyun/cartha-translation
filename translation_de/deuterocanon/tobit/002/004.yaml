  language: de
  text: Ich aber sprang auf, noch bevor ich etwas gekostet hatte, und brachte ihn in einen Raum, bis die Sonne unterging.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πρὶν ἢ γεύσασθαί με
  choice: noch bevor ich etwas gekostet hatte
  rationale: Gibt die zeitliche Konstruktion natürlich wieder; γεύομαι bezeichnet hier im Zusammenhang des Mahls das Kosten beziehungsweise Essen.
- source_word: ἀναπηδήσας
  choice: sprang auf
  rationale: Bewahrt die plötzliche, entschlossene Bewegung des griechischen Partizips.
- source_word: ἀνειλόμην αὐτόν
  choice: brachte ihn
  rationale: Im Kontext bedeutet das Medium, den Leichnam an sich zu nehmen und wegzubringen; „brachte ihn“ ist im Deutschen natürlich, ohne ein Ziel oder Motiv hinzuzufügen.
- source_word: εἰς τι οἴκημα
  choice: in einen Raum
  rationale: τι ist unbestimmt, und οἴκημα kann einen Raum beziehungsweise ein Gemach bezeichnen; die Wiedergabe vermeidet die zu spezifische Vorstellung eines eigenständigen Hauses.
- source_word: ἕως οὗ ἔδυ ὁ ἥλιος
  choice: bis die Sonne unterging
  rationale: Entspricht direkt dem zeitlichen Abschluss der griechischen Aussage.
