  yaml_path: translation/deuterocanon/tobit/002/013.yaml
  text: But when she came to me[a], she began to cry out, and I said to her, “Where is the young goat from? Is it stolen? Give it back to its owners, for it is not lawful to eat what is stolen.”
translation:
  language: de
  text: 'Als sie aber zu mir kam, fing sie an zu schreien. Da sagte ich zu ihr: »Woher kommt dieses Zicklein? Ist es etwa Diebesgut? Gib es seinen Eigentümern zurück; denn es ist nicht erlaubt, Gestohlenes zu essen.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτε δὲ ἦλθεν πρὸς μέ, ἤρξατο κράζειν
  choice: Als sie aber zu mir kam, begann das Zicklein zu meckern
  rationale: 'Die Subjekte der beiden Verben sind im Griechischen nicht ausdrücklich genannt. Aus dem Zusammenhang ergibt sich am ehesten ein Subjektwechsel: Die Frau kommt zu Tobit, und das Zicklein gibt einen Laut von sich. „Meckern“ ist für den Ruf einer jungen Ziege im Deutschen natürlich; die grammatische Mehrdeutigkeit wird in einer Fußnote offengelegt.'
- source_word: Πόθεν τὸ ἔριφον;
  choice: Woher hast du das Zicklein?
  rationale: πόθεν fragt nach der Herkunft. Die idiomatische deutsche Frage bringt dies im Gesprächszusammenhang klar zum Ausdruck, ohne eine zusätzliche Herkunftsangabe einzuführen.
- source_word: ἔριφον
  choice: Zicklein
  rationale: ἔριφον bezeichnet eine junge Ziege. „Zicklein“ ist im heutigen Deutsch eindeutig und natürlich.
- source_word: μὴ κλεμμάιον ἐστίν;
  choice: Ist es etwa gestohlen?
  rationale: κλεμμάιον bezeichnet Diebesgut beziehungsweise etwas Gestohlenes. „Etwa“ gibt den durch μή angezeigten argwöhnischen Fragecharakter wieder, ohne die Antwort vorwegzunehmen.
- source_word: ἀπόδος αὐτὸ τοῖς κυρίοις
  choice: Gib es seinen Eigentümern zurück
  rationale: ἀπόδος fordert zur Rückgabe auf; κύριοι bezeichnet hier die rechtmäßigen Besitzer und nicht Herren in einem theologischen Sinn.
- source_word: οὐ γὰρ θεμιτὸν ἐστιν φαγεῖν κλεψιμαῖον
  choice: denn es ist nicht erlaubt, Gestohlenes zu essen
  rationale: θεμιτόν trägt eine moralisch-rechtliche Bedeutung. „Nicht erlaubt“ bewahrt diese Kraft in natürlichem modernem Deutsch; „Gestohlenes“ gibt κλεψιμαῖον allgemein wieder.
theological_decisions:
- issue: Moralisch-rechtliche Aussage von θεμιτόν
  choice: denn es ist nicht erlaubt, Gestohlenes zu essen
  alternative: denn es ist nicht recht, Gestohlenes zu essen
  rationale: „Nicht erlaubt“ wahrt den normativen Charakter der Aussage, ohne eine bestimmte spätere Gesetzesordnung oder konfessionelle Deutung vorauszusetzen.
- issue: Nicht ausdrücklich genannter Handelnder bei ἤρξατο κράζειν
  choice: Das Zicklein begann zu meckern
  alternative: Sie begann laut zu rufen
  rationale: Im unmittelbaren Erzählzusammenhang motiviert der Laut des Tieres Tobits Verdacht und entspricht die tierische Lesart der natürlichen Referenz. Da der griechische Satz das Subjekt jedoch nicht ausdrücklich wiederholt, bleibt die alternative Zuordnung in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter, mündlich natürlicher Rede. „Zicklein“ vermeidet Fachsprache; „Eigentümer“ grenzt den Besitzsinn von κύριοι gegen eine theologische Bedeutung ab.
