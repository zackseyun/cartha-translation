  naturalness: Die revidierte Fassung ist modernes, idiomatisches Standarddeutsch. „Fing sie an zu schreien“ gibt κράζειν klar und ohne eine bestimmte Gefühlslage zu behaupten wieder. „Woher kommt dieses Zicklein?“ ist eine natürliche Frage nach Herkunft und bleibt näher an πόθεν als „Woher hast du ...?“
  terminology: „Zicklein“ gibt ἔριφον angemessen wieder. „Diebesgut“ trifft κλεμμάιον als substantivische Bezeichnung für gestohlenen Besitz präzise. „Nicht erlaubt“ gibt die normativ-moralische Kraft von θεμιτόν in heutigem Deutsch angemessen wieder. „Eigentümer“ ist für κύριοι im Besitzkontext sachgerecht.
