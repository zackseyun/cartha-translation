lexical_decisions:
- source_word: ἡ γυνή μου
  choice: meine Frau
  rationale: γυνή mit Possessivpronomen bezeichnet in diesem Zusammenhang idiomatisch die Ehefrau.
- source_word: Ἄννα
  choice: Anna
  rationale: Der Personenname wird in seiner im Deutschen üblichen Form wiedergegeben.
- source_word: ἠριθεύετο
  choice: arbeitete
  rationale: Das Verb bezeichnet entlohnte Arbeit beziehungsweise Erwerbsarbeit. Die allgemeinere Wiedergabe vermeidet eine nicht gesicherte Festlegung auf eine bestimmte Tätigkeit.
- source_word: ἐν τοῖς γυναικείοις
  choice: in Frauenarbeiten
  rationale: Die substantivierte Wendung bezeichnet wahrscheinlich den Bereich der damals üblicherweise von Frauen verrichteten Arbeiten, ohne eine bestimmte Handarbeit oder einen Ort eindeutig festzulegen.
