- from: Und sie schickte die fertige Arbeit immer wieder zu den Auftraggebern[a]; diese zahlten ihr den Lohn und gaben noch ein Ziegenböckchen dazu.
  to: Und sie schickte die fertige Arbeit immer wieder zu ihren Herren[a]; auch sie zahlten ihr den Lohn und gaben noch ein Zicklein dazu.
  rationale: Die Revision bewahrt den wiederholten Charakter des Imperfekts und die kontextuell notwendige Ergänzung des zurückgesandten Arbeitsstücks. Sie gibt κύριοι quellentreuer wieder, ohne eine moderne institutionelle Arbeitsbeziehung einzutragen, und vermeidet bei ἔριφος eine im Griechischen nicht vorhandene Geschlechtsfestlegung. „Auch sie“ berücksichtigt die Betonung durch αὐτοί.
