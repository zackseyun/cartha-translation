review_pass:
  verdict: revise
  source_fidelity: Die habituale Wiedergabe von ἀπέστελλεν durch „immer wieder“ ist angemessen, und Lohn sowie zusätzliche Gabe sind richtig erfasst. „Ziegenböckchen“ legt jedoch unbegründet das männliche Geschlecht fest; ἔριφος bezeichnet allgemein ein junges Ziegentier. Außerdem sollte das hervorgehobene αὐτοί wenigstens durch „auch sie“ wiedergegeben werden.
  naturalness: Der Satz ist flüssiges modernes Standarddeutsch. „Die fertige Arbeit“ ist als kontextuelle Ergänzung aus dem vorangehenden Vers verständlich. „Herren“ ist im heutigen Deutsch ohne Erläuterung sozialhistorisch markiert, wird aber durch die Fußnote klar und quellennah erklärt.
  terminology: „Auftraggeber“ ist zwar idiomatisch, schwächt aber die im griechischen κύριοι ausgedrückte soziale Beziehung zu bloßen Auftragserteilern ab. „Herren“ mit einer erklärenden Fußnote wahrt die historische und semantische Offenheit besser. „Zicklein“ gibt ἔριφος ohne nicht belegte Geschlechtsfestlegung wieder.
  issues:
  - severity: medium
    issue: „Ziegenböckchen“ spezifiziert das Geschlecht.
    rationale: Das griechische ἔριφος bedeutet ein junges Ziegentier und verlangt keine männliche Spezifizierung.
  - severity: low
    issue: „Auftraggebern“ ist für κυρίοις zu eng modernisiert.
    rationale: Der Ausdruck kann im Kontext Personen bezeichnen, in deren Dienst Anna stand; „Auftraggeber“ reduziert dies auf ein bloßes Geschäftsverhältnis. Die wörtlichere Wiedergabe mit Erklärung ist quellentreuer.
  - severity: low
    issue: Das betonte αὐτοί bleibt unmarkiert.
    rationale: „Auch sie“ bildet die zusätzliche Betonung des griechischen Textes natürlich ab.
