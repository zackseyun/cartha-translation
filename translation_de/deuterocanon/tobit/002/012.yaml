  text: And she would send it to the owners[a], and they also paid her wages, adding a young goat.
translation:
  language: de
  text: Und sie schickte die fertige Arbeit immer wieder zu ihren Herren[a]; auch sie zahlten ihr den Lohn und gaben noch ein Zicklein dazu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »zu den Herren«; gemeint sind die Personen, für die sie arbeitete.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστελλεν
  choice: schickte … immer wieder
  rationale: Der Imperfekt beschreibt hier wahrscheinlich eine wiederholte oder gewohnheitsmäßige Handlung; die deutsche Wendung macht diesen Aspekt deutlich.
- source_word: τοῖς κυρίοις
  choice: zu den Auftraggebern
  rationale: Im Arbeitszusammenhang bezeichnet der Ausdruck die Personen, für die sie tätig war. „Auftraggeber“ ist im modernen Deutschen natürlicher als „Herren“ und vermeidet eine unpassende theologische Färbung.
- source_word: ἀπέδωκαν
  choice: zahlten
  rationale: In Verbindung mit μισθόν bezeichnet das Verb die Auszahlung des geschuldeten Arbeitslohns.
- source_word: τὸν μισθόν
  choice: den Lohn
  rationale: μισθός meint hier die Vergütung für geleistete Arbeit; „Lohn“ ist präzise und idiomatisch.
- source_word: προσδόντες
  choice: gaben noch … dazu
  rationale: Das Partizip bezeichnet eine zusätzliche Gabe über den Lohn hinaus.
- source_word: ἔριφον
  choice: ein Ziegenböckchen
  rationale: ἔριφος bezeichnet eine junge Ziege; im Kontext von Tobit 2,13, wo Tobit an der Stimme das Tier als ἔριφος erkennt, ist „Ziegenböckchen“ eine klare und natürliche Wiedergabe.
theological_decisions:
- issue: Wiedergabe von κυρίοις in einem nichttheologischen Arbeitszusammenhang
  choice: Auftraggebern
  alternative: Herren
  rationale: Der Plural bezeichnet hier menschliche Personen, für die Anna arbeitete, nicht den göttlichen Herrentitel. „Auftraggeber“ wahrt den wirtschaftlichen Zusammenhang, ohne theologischen Klang einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Die fertige Arbeit“ wird aus dem unmittelbaren Zusammenhang ergänzt, da das griechische Pronomen αὐτό aus dem vorausgehenden Vers seinen Bezug erhält. Die Wiederholung des Imperfekts wird mit „immer wieder“ sichtbar gemacht.
