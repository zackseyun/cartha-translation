base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/002/003.yaml
  text: And he came and said[a], “Father, one of our own people has been strangled and thrown down in the marketplace.”
translation:
  language: de
  text: 'Und er kam und sagte: „Vater, einer aus unserem Volk[a] ist erwürgt und auf den Marktplatz geworfen worden.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „einer von unseren Verwandten“. Das griechische Wort γένος kann die Familie, eine Verwandtschaftsgruppe, die Abstammung oder das eigene Volk bezeichnen.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: ἐλθὼν
  choice: Und er kam
  rationale: Das vorzeitige Aoristpartizip wird dem natürlichen deutschen Erzählstil entsprechend als beigeordnete Handlung wiedergegeben.
- source_word: Πάτερ
  choice: Vater
  rationale: Die schlichte Anrede wahrt den griechischen Vokativ, ohne ein im Ausgangstext nicht ausdrücklich vorhandenes Possessivpronomen hinzuzufügen.
- source_word: εἷς ἐκ τοῦ γένους ἡμῶν
  choice: einer aus unserem Volk
  rationale: γένος kann Familie, Verwandtschaftsgruppe, Abstammung oder Volkszugehörigkeit bezeichnen. Im Zusammenhang bezeichnet die Wendung am ehesten einen Angehörigen der eigenen ethnisch-religiösen Gemeinschaft, ohne eine unmittelbare Blutsverwandtschaft zu behaupten.
- source_word: ἐστραγγαλωμένος
  choice: ist erwürgt
  rationale: Das passive Perfektpartizip bezeichnet hier den durch Erdrosseln herbeigeführten Tod. „Erhängt“ würde die konkrete Todesart stärker festlegen, als es der griechische Ausdruck verlangt.
- source_word: ἔρριπται
  choice: auf den Marktplatz geworfen worden
  rationale: Das passive Perfekt von ῥίπτω drückt gewaltsames Hinwerfen mit fortbestehendem Ergebnis aus. Die deutsche Passivkonstruktion gibt sowohl die Handlung als auch die gegenwärtige Lage des Leichnams knapp wieder.
- source_word: ἐν τῇ ἀγορᾷ
  choice: auf den Marktplatz
  rationale: ἀγορά bezeichnet den öffentlichen Markt- oder Versammlungsplatz. „Marktplatz“ ist im modernen Deutsch natürlich und bewahrt den öffentlichen Schauplatz.
theological_decisions:
- issue: Bedeutungsumfang von γένος ἡμῶν
  choice: 'gemeinschaftliche beziehungsweise ethnische Zugehörigkeit: „einer aus unserem Volk“'
  alternative: 'engere Verwandtschaft: „einer von unseren Verwandten“'
  rationale: Der Zusammenhang handelt von einem Toten aus Tobits eigener Gemeinschaft, nicht eindeutig von einem nahen Familienangehörigen. Die gewählte Fassung wahrt den gemeinschaftlichen Bezug, während die Fußnote die engere mögliche Bedeutung offenhält.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die koordinierte Satzform folgt dem schlichten Erzählstil des Griechischen; die Formulierung vermeidet sowohl altertümliche Wendungen als auch eine unnötige Festlegung von γένος auf unmittelbare Blutsverwandtschaft.
