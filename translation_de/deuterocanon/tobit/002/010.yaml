  yaml_path: translation/deuterocanon/tobit/002/010.yaml
  text: And I did not know that sparrows were in the wall[a]; and while my eyes were open, the sparrows dropped warm dung into my eyes, and white films formed on my eyes. Then I went to physicians, but they did not help me[b]. But Achiacharus supported me until I went to Elymais.
translation:
  language: de
  text: Ich wusste nicht, dass Spatzen in der Mauer waren.[a] Während meine Augen offen waren, ließen die Spatzen warmen Kot in meine Augen fallen, und in meinen Augen bildeten sich weiße Trübungen.[b] Da ging ich zu Ärzten, doch sie konnten mir nicht helfen. Achiachar aber versorgte mich, bis ich nach Elymaïs ging.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „kleine Vögel“. Das griechische Wort kann allgemein kleine Vögel bezeichnen; „Spatzen“ ist hier jedoch wahrscheinlich.'
    reason: lexical_alternative
  - marker: b
    text: Das griechische Wort bezeichnet weiße Trübungen oder undurchsichtige Stellen in den Augen. Gemeint sein könnte ein dem Grauen Star ähnliches Leiden; eine genaue medizinische Diagnose gibt der Text jedoch nicht.
    reason: lexical_alternative
lexical_decisions:
- source_word: στρουθία
  choice: Spatzen
  rationale: στρουθία bezeichnet gewöhnlich Spatzen, kann aber allgemeiner kleine Vögel meinen. „Spatzen“ ist hier die wahrscheinlichste und zugleich natürliche Wiedergabe.
- source_word: ἐν τῷ τοίχῳ
  choice: in der Mauer
  rationale: Die Formulierung folgt dem ausdrücklichen griechischen Wortlaut, ohne den möglichen Nistplatz als Spalt, Maueröffnung oder Dachstelle näher zu bestimmen.
- source_word: ἀνεῳγότων
  choice: während meine Augen offen waren
  rationale: Der Genitivus absolutus wird als gleichzeitige Umstandsangabe natürlich ins Deutsche übertragen.
- source_word: ἀφώδευσαν
  choice: ließen ... Kot ... fallen
  rationale: Das Verb bezeichnet unverblümt das Ausscheiden von Kot. Die deutsche Formulierung bewahrt die konkrete Aussage, ohne unnötig klinisch zu klingen.
- source_word: θερμὰ
  choice: warmen
  rationale: θερμά kann „warm“ oder „heiß“ bedeuten; „warm“ ist in diesem Zusammenhang die maßvolle und natürliche Wiedergabe.
- source_word: λευκώματα
  choice: weiße Trübungen
  rationale: Das Wort bezeichnet weißliche, undurchsichtige Veränderungen. „Weiße Trübungen“ bleibt anschaulich, ohne eine moderne Diagnose wie Grauen Star festzulegen.
- source_word: ἰατρούς
  choice: Ärzten
  rationale: ἰατροί bezeichnet medizinische Behandler; „Ärzte“ ist die natürliche moderne Standardbezeichnung.
- source_word: οὐκ ὠφέλησάν με
  choice: sie konnten mir nicht helfen
  rationale: Die Wendung besagt, dass die Ärzte Tobit keinen Nutzen brachten. Die gewählte Formulierung ist idiomatisch und legt nicht fest, ob Behandlung versucht wurde.
- source_word: ἔτρεφέν με
  choice: versorgte mich
  rationale: τρέφω kann „ernähren“ bedeuten und hier weiter gefasst für den Lebensunterhalt sorgen. „Versorgte mich“ schließt Nahrung ein, ohne die Unterstützung darauf zu begrenzen.
- source_word: Ἐλυμαΐδα
  choice: Elymaïs
  rationale: Der historische Landschaftsname wird in gebräuchlicher deutscher Transkription wiedergegeben.
theological_decisions:
- issue: Medizinische Beschreibung von Tobits Augenleiden
  choice: λευκώματα beschreibend als „weiße Trübungen“ wiedergeben
  alternative: „Grauer Star“, „weiße Flecken“ oder „weiße Häutchen“
  rationale: Der griechische Text beschreibt eine sichtbare weißliche Augenveränderung, nennt aber keine präzise moderne Diagnose. Die Übersetzung bewahrt diese Unbestimmtheit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Erzählführung. Die konkrete, körperliche Ausdrucksweise des griechischen Textes bleibt erhalten; medizinische und räumliche Einzelheiten werden nicht über den Wortlaut hinaus präzisiert.
