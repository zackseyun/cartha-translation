  text: And I wept. And when the sun had set[a], I went and dug and buried him.
translation:
  language: de
  text: Und ich weinte. Als die Sonne untergegangen war, ging ich fort, hob ein Grab aus[a] und begrub ihn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „… ging ich fort und begrub ihn, nachdem ich gegraben hatte.“ Ein Grab ist im Griechischen nicht ausdrücklich genannt, ergibt sich aber aus dem Zusammenhang.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔκλαυσα
  choice: ich weinte
  rationale: Das Aoristverb κλαίω bezeichnet Weinen. „Ich weinte“ gibt die Gefühlsäußerung knapp und ohne die zusätzliche Deutung eines förmlichen Trauerrituals wieder.
- source_word: ὅτε ἔδυ ὁ ἥλιος
  choice: als die Sonne untergegangen war
  rationale: Die Formulierung bezeichnet den eingetretenen Sonnenuntergang als Zeitpunkt der folgenden Handlung. Das deutsche Plusquamperfekt bildet diese Abfolge natürlich ab.
- source_word: ᾠχόμην
  choice: ging ich hin
  rationale: Das Verb bezeichnet hier das Fortgehen beziehungsweise Sich-an-einen-Ort-Begeben. „Ging ich hin“ ist im Erzählzusammenhang natürlich und bewahrt die gerichtete Bewegung.
- source_word: ὀρύξας
  choice: hob ein Grab aus
  rationale: Das Partizip bedeutet wörtlich „nachdem ich gegraben hatte“. Das beim Begraben sinngemäß vorausgesetzte Grab wird im Deutschen ergänzt, damit die Handlung verständlich und idiomatisch bleibt; die Ergänzung wird in einer Fußnote kenntlich gemacht.
- source_word: ἔθαψα αὐτόν
  choice: begrub ihn
  rationale: θάπτω bedeutet hier „begraben“. Die schlichte Formulierung entspricht dem direkten Erzählstil und lässt den männlichen Personenbezug von αὐτόν bestehen.
