  text: But those who sin are enemies of their own life[a].
translation:
  language: de
  text: Doch wer sündigt, ist ein Feind seines eigenen Lebens.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „seiner eigenen Seele“. Das griechische Wort kann weiter gefasst werden; „Leben“ ist hier jedoch die näherliegende Bedeutung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ ... ἁμαρτάνοντες
  choice: wer sündigt
  rationale: Der substantivierte Präsenspartizip bezeichnet Menschen unter dem Gesichtspunkt ihres sündigen Handelns. Die singularische generische Form ist im Deutschen natürlich und bewahrt den verbalen Charakter.
- source_word: δὲ
  choice: Doch
  rationale: δέ setzt hier einen milden Gegensatz zum vorausgehenden Gedanken; „Doch“ gibt diesen Kontrast würdig und knapp wieder.
- source_word: πολέμιοί
  choice: ein Feind
  rationale: Das Prädikatswort bezeichnet jemanden, der feindlich gegen etwas steht. Wegen der im Deutschen gewählten generischen Singularform steht entsprechend „ein Feind“.
- source_word: τῆς ἑαυτῶν ζωῆς
  choice: seines eigenen Lebens
  rationale: Die reflexive Wendung macht deutlich, dass sich die Feindschaft gegen das eigene ζωή richtet. „Leben“ ist die naheliegende Bedeutung und vermeidet eine unnötige anthropologische Festlegung auf „Seele“.
theological_decisions:
- issue: Bedeutung von ζωή im weisheitlich-ethischen Zusammenhang
  choice: Leben
  alternative: Seele
  rationale: ζωή bedeutet gewöhnlich „Leben“ und bezeichnet hier das eigene Leben beziehungsweise Wohlergehen. „Seele“ würde eine engere, im griechischen Wortlaut nicht ausdrücklich vorgegebene Deutung eintragen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit knapper, würdiger Spruchform. Der generische Singular vermeidet das schwerfällige „diejenigen, die sündigen“ und erhält den pointierten Aussagecharakter.
