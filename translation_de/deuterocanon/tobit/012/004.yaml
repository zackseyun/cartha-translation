  text: And the elder said, “It is justified for him.”
translation:
  language: de
  text: 'Und der alte Mann sagte: »Es steht ihm zu.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ πρεσβύτης
  choice: der alte Mann
  rationale: πρεσβύτης bezeichnet hier den älteren Mann beziehungsweise Vater, nicht notwendig einen Amtsträger; daher ist „der Älteste“ missverständlich.
- source_word: Δικαιοῦται αὐτῷ
  choice: Es steht ihm zu
  rationale: Die knappe griechische Wendung drückt im Zusammenhang einen berechtigten Anspruch aus. Die deutsche Formulierung ist natürlich, bewahrt die unpersönliche Konstruktion und vermeidet die irreführende Aussage, die Person selbst werde „gerechtfertigt“.
theological_decisions:
- issue: Bedeutung von δικαιοῦται in der Vergütungsfrage
  choice: 'als Feststellung eines berechtigten Anspruchs: „Es steht ihm zu“'
  alternative: „Er wird gerechtfertigt“ / „Es ist für ihn gerechtfertigt“
  rationale: Der unmittelbare Zusammenhang handelt von dem Lohn, der dem Begleiter zusteht. Eine soteriologische Bedeutung von „rechtfertigen“ ist hier weder erforderlich noch kontextgemäß; zugleich wird nicht näher bestimmt, worauf sich der Anspruch genau bezieht.
translation_notes:
  register: Knappes, würdevolles Standarddeutsch. „Der alte Mann“ gibt die Personenbezeichnung ohne den möglichen Amtsklang von „der Älteste“ wieder.
