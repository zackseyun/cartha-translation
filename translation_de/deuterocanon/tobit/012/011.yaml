base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/012/011.yaml
  text: I will certainly not hide any word from you[a]. I have indeed said, ‘It is good to hide a king’s secret[b], but to reveal the works of God gloriously.’
translation:
  language: de
  text: 'Ich werde euch ganz gewiss kein Wort verschweigen. Ich habe ja gesagt: »Es ist gut, das Geheimnis eines Königs[a] geheim zu halten, die Werke Gottes aber ruhmvoll[b] zu offenbaren.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die vertrauliche Angelegenheit eines Königs«. Das griechische Wort bezeichnet hier ein Geheimnis, nicht notwendig ein theologisches »Mysterium«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »ehrenvoll« oder »mit Ehre«. Das Adverb kann die angemessene Art bezeichnen, in der Gottes Werke bekannt gemacht werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ μὴ κρύψω
  choice: Ich werde … ganz gewiss … nicht verschweigen
  rationale: οὐ μή mit dem Aorist Konjunktiv drückt eine nachdrückliche Verneinung mit Zukunftsbezug aus. „Ganz gewiss“ gibt diese Verstärkung in natürlichem Deutsch wieder.
- source_word: ἀφʼ ὑμῶν
  choice: euch … verschweigen
  rationale: Im Deutschen bezeichnet der Dativ bei „verschweigen“, wem etwas vorenthalten wird; so wird die Funktion von ἀπό mit Genitiv idiomatisch wiedergegeben.
- source_word: πᾶν ῥῆμα
  choice: kein Wort
  rationale: Wörtlich bezeichnet die Wendung jedes Wort beziehungsweise jede Sache. In Verbindung mit der Verneinung bewahrt „kein Wort“ das konkrete Bild und bedeutet zugleich, dass nichts zurückgehalten wird.
- source_word: εἴρηκα δὴ
  choice: Ich habe ja gesagt
  rationale: Das Perfekt εἴρηκα wird als deutsches Perfekt wiedergegeben; „ja“ vermittelt die bekräftigende beziehungsweise rückverweisende Wirkung von δή ohne Schwerfälligkeit.
- source_word: μυστήριον βασιλέως
  choice: das Geheimnis eines Königs
  rationale: μυστήριον meint hier eine vertrauliche Angelegenheit des Königs und nicht notwendig ein theologisches Mysterium. Die Formulierung bleibt eng am griechischen Genitiv.
- source_word: κρύψαι καλόν
  choice: Es ist gut, … geheim zu halten
  rationale: Der Infinitiv mit καλόν formuliert einen allgemeinen Grundsatz. „Geheim halten“ ist im Deutschen für ein Geheimnis idiomatischer als „verbergen“ und erhält den sprichwortartigen Ton.
- source_word: τὰ δὲ ἔργα τοῦ θεοῦ
  choice: die Werke Gottes aber
  rationale: „Werke“ bewahrt die Breite von ἔργα und den feierlichen Klang; „aber“ gibt den Kontrast von δέ wieder.
- source_word: ἀνακαλύπτειν
  choice: zu offenbaren
  rationale: Das Verb bedeutet aufdecken beziehungsweise bekannt machen. „Offenbaren“ bildet einen klaren Gegensatz zum Geheimhalten und passt zum würdevollen Register.
- source_word: ἐνδόξως
  choice: ruhmvoll
  rationale: Das Adverb kann „ruhmvoll“, „ehrenvoll“ oder „mit Ehre“ bedeuten. „Ruhmvoll“ bewahrt die Wortfeldnähe zu δόξα, während die Fußnote die mögliche Nuance der ehrenvollen Art der Bekanntmachung nennt.
theological_decisions:
- issue: Bedeutung von μυστήριον im weisheitlich-sprichwortartigen Zusammenhang
  choice: Geheimnis
  alternative: Mysterium
  rationale: Gemeint ist eine vertrauliche königliche Angelegenheit. „Geheimnis“ vermeidet spätere fachtheologische Konnotationen, ohne den Gedanken des Verborgenen abzuschwächen.
- issue: Bezug und Nuance von ἐνδόξως
  choice: Das Adverb beschreibt die ruhmvolle Art, Gottes Werke zu offenbaren.
  alternative: Das Adverb kann „ehrenvoll“ oder „mit Ehre“ bedeuten.
  rationale: Der griechische Ausdruck lässt sowohl den Gedanken des Ruhmes als auch den einer angemessenen, ehrenvollen Bekanntmachung zu. Die Hauptfassung wahrt die lexikalische Nähe zur Herrlichkeit, die Fußnote erhält die echte Bedeutungsbreite.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit sprichwortartigem Satzbau. Die starke Verneinung wird idiomatisch verstärkt; die Gegenüberstellung von Geheimhalten und Offenbaren bleibt deutlich. Sämtliche Fußnotenmarker stehen unmittelbar bei den erläuterten Ausdrücken.
