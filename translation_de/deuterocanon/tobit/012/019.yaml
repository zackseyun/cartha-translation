  text: All the days I was appearing to you[a], but I neither ate nor drank; rather, you were seeing a vision.
translation:
  language: de
  text: Die ganze Zeit über erschien ich euch[a], doch weder aß ich noch trank ich; vielmehr saht ihr eine Vision.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „war ich euch sichtbar“. Die griechische Imperfektform kann das fortdauernde Erscheinen während dieses ganzen Zeitraums hervorheben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάσας τὰς ἡμέρας
  choice: Die ganze Zeit über
  rationale: Die Wendung bezeichnet den gesamten Zeitraum. Diese idiomatische deutsche Formulierung gibt den zeitlichen Umfang natürlich wieder, ohne zusätzliche zeitliche Bestimmungen einzuführen.
- source_word: ὠπτανόμην ὑμῖν
  choice: erschien ich euch
  rationale: ὀπτάνομαι bezeichnet das Sichtbarwerden oder Erscheinen. Das Präteritum ist im erzählenden Deutsch natürlich; der durative Wert des Imperfekts wird bereits durch „Die ganze Zeit über“ getragen.
- source_word: οὐκ ἔφαγον οὐδὲ ἔπιον
  choice: ich aß weder noch trank ich
  rationale: Die paarige Verneinung und die ausgewogene Struktur des Griechischen bleiben erhalten.
- source_word: ἀλλὰ
  choice: vielmehr
  rationale: 'Das Wort leitet eine berichtigende Gegenüberstellung ein: kein tatsächliches Essen und Trinken, sondern eine wahrgenommene Erscheinung.'
- source_word: ὅρασιν ὑμεῖς ἐθεωρεῖτε
  choice: saht ihr eine Erscheinung
  rationale: ὅρασις kann eine Vision, Schau oder sichtbare Erscheinung bezeichnen. „Erscheinung“ knüpft an Raphaëls Erscheinen an und wahrt, dass hier keine gewöhnliche sinnliche Wahrnehmung gemeint ist. Das deutsche Präteritum bleibt natürlich, während der zeitliche Kontext den fortdauernden Wahrnehmungsvorgang erkennen lässt.
theological_decisions:
- issue: Art von Raphaëls sichtbarer Gegenwart und seinen Handlungen
  choice: Raphaël erklärt, dass er ihnen erschien, ohne tatsächlich zu essen oder zu trinken, und bezeichnet ihre Wahrnehmung als eine Erscheinung.
  alternative: Die Aussage als bloßen Irrtum der Beobachter oder lediglich mit „es sah nur so aus“ wiederzugeben.
  rationale: Der griechische Text stellt das Erscheinen ausdrücklich dem Nichtessen und Nichttrinken gegenüber und nennt das Wahrgenommene ὅρασις. Die Übersetzung bewahrt diese übernatürliche Spannung, ohne eine weitergehende Engellehre in den Vers einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Die ganze Zeit über“ ist idiomatischer als das formal engere „alle Tage“. „Erscheinung“ wahrt die Bedeutungsbreite von ὅρασις besser als eine dogmatisch stärker festgelegte Umschreibung.
