  yaml_path: translation/deuterocanon/tobit/012/022.yaml
  text: And they acknowledged his great and wondrous works[b][a], because an angel of the Lord had appeared to them.
translation:
  language: de
  text: Und sie priesen seine großen und wunderbaren Taten[a], weil ihnen ein Engel des Herrn erschienen war[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sie bekannten öffentlich / dankten für seine großen und wunderbaren Taten“. Das griechische Verb kann je nach Zusammenhang Bekennen, öffentliches Anerkennen, Danken oder Preisen ausdrücken.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich nach dem artikellosen griechischen Ausdruck: „ein Engel des Herrn“; auch die Wiedergabe „der Engel des Herrn“ ist sprachlich möglich, wird hier aber nicht vorausgesetzt.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐξωμολογοῦντο
  choice: sie priesen
  rationale: Das Verb kann öffentliches Bekennen, dankbares Anerkennen oder Preisen bezeichnen. Da Gottes große und wunderbare Taten das Objekt sind, gibt „priesen“ den kontextuellen Sinn natürlich und würdig wieder; die Bedeutungsbreite wird in der Fußnote erhalten.
- source_word: τὰ ἔργα τὰ μεγάλα καὶ θαυμαστὰ αὐτοῦ
  choice: seine großen und wunderbaren Taten
  rationale: „Taten“ ist im Deutschen für Gottes Handeln natürlicher als „Werke“; „groß“ und „wunderbar“ bilden die beiden griechischen Adjektive unmittelbar ab.
- source_word: ὡς
  choice: weil
  rationale: 'Im Zusammenhang lässt sich ὡς kausal verstehen: Das Erscheinen des Engels ist der Anlass beziehungsweise Grund ihres Preisens. Andere mögliche Nuancen werden nicht zur Änderung des klaren Erzählzusammenhangs herangezogen.'
- source_word: ὤφθη
  choice: erschienen war
  rationale: Die passive Form dient idiomatisch als Erscheinungsverb. Das deutsche Plusquamperfekt macht deutlich, dass die Erscheinung dem Preisen vorausging.
- source_word: ἄγγελος Κυρίου
  choice: ein Engel des Herrn
  rationale: ἄγγελος steht ohne Artikel. Die indefinite Wiedergabe vermeidet eine vom griechischen Wortlaut nicht verlangte Identifikation mit einer bestimmten Gestalt.
theological_decisions:
- issue: Bestimmte oder unbestimmte Wiedergabe von ἄγγελος Κυρίου
  choice: ein Engel des Herrn
  alternative: der Engel des Herrn
  rationale: Der griechische Ausdruck ist artikellos. „Ein Engel des Herrn“ wahrt diese Offenheit und importiert keine besondere theologische Identifikation.
- issue: Deutung von ἐξωμολογοῦντο als Bekenntnis, Dank oder Lob
  choice: sie priesen
  alternative: sie bekannten / sie dankten für / sie erkannten öffentlich an
  rationale: Bei den großen und wunderbaren Taten Gottes als Objekt liegt eine lobende öffentliche Anerkennung nahe. Die Fußnote bewahrt die echte lexikalische Spannweite.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch in würdigem Erzählton. „Taten“ und „priesen“ sind idiomatisch, ohne die Bedeutungsbreite des Griechischen zu verdecken; beide Fußnotenmarker stehen an den jeweils betroffenen Ausdrücken.
