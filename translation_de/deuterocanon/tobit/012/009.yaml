review_pass:
  verdict: revise
  source_fidelity: Die direkte Aussage von ἐλεημοσύνη als Rettung vor dem Tod sowie die ungemilderte Verbindung zur Reinigung von Sünde sind zutreffend erhalten. „vollständig reinigen“ ist jedoch im Deutschen semantisch missverständlich, weil es die Sünde als das zu Reinigende erscheinen lässt; der griechische Sinn ist Reinigung von Sünde bzw. deren Beseitigung.
  naturalness: Der Text ist insgesamt modernes, würdiges Standarddeutsch. „Wer barmherzig gibt und gerecht handelt“ ist idiomatisch. „wird jede Sünde vollständig reinigen“ klingt hingegen nicht natürlich. Auch „sich am Leben satt genießen“ in der Fußnote ist keine angemessene deutsche Wiedergabe der Sättigungsmetapher.
  terminology: „Barmherziges Geben“ gibt ἐλεημοσύνη als konkrete hilfreiche Gabe angemessen wieder, ohne den heute teils eng oder negativ verstandenen Ausdruck „Almosen“ zu erzwingen. „gerecht handelt“ gibt den praktischen Plural δικαιοσύνας vertretbar wieder. Die offene Bedeutung von ζωῆς bleibt gewahrt.
  issues:
  - severity: medium
    issue: Unnatürliche und sachlich verschobene Formulierung bei der Sündenreinigung
    rationale: „jede Sünde vollständig reinigen“ kann bedeuten, dass die Sünde selbst gereinigt werde. Für ἀποκαθαριεῖ πᾶσαν ἁμαρτίαν ist im Deutschen „von jeder Sünde reinigen“ die klare, natürliche Entsprechung.
  - severity: medium
    issue: Fußnotenalternative „sich am Leben satt genießen“ ist zu interpretierend
    rationale: „genießen“ fügt einen Genussaspekt hinzu, den πλησθήσονται ζωῆς nicht ausdrückt. Die Alternative sollte die Metapher des Sattwerdens bzw. Erfülltwerdens bewahren.
  revised_text: Barmherziges Geben rettet vor dem Tod, und es wird von jeder Sünde reinigen. Wer barmherzig gibt und gerecht handelt, wird mit Leben erfüllt werden.[a]
