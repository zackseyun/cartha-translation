- from: Barmherziges Geben rettet vor dem Tod, und es wird jede Sünde vollständig reinigen. Wer barmherzig gibt und gerecht handelt, wird mit Leben erfüllt werden.[a]
  to: Barmherziges Geben rettet vor dem Tod, und es wird von jeder Sünde reinigen. Wer barmherzig gibt und gerecht handelt, wird mit Leben erfüllt werden.[a]
  rationale: Die Revision klärt die Richtung der Reinigung idiomatisch als Reinigung von Sünde, ohne die unmittelbare Aussage des griechischen Textes abzuschwächen. Die Fußnote ersetzt eine zu stark deutende Formulierung durch eine nähere Wiedergabe der Sättigungsmetapher.
