base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/012/009.yaml
  text: Almsgiving rescues from death[a], and it will cleanse away every sin. Those who do acts of almsgiving and righteousness will be filled with life.
translation:
  language: de
  text: Barmherziges Geben rettet vor dem Tod, und es wird von jeder Sünde reinigen. Wer barmherzig gibt und gerecht handelt, wird mit Leben erfüllt werden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wer barmherzig gibt und gerecht handelt, wird am Leben satt werden.“'
    reason: Die Verbindung πλησθήσονται ζωῆς kann neben „mit Leben erfüllt werden“ die bildhafte Bedeutung haben, am Leben gesättigt beziehungsweise satt zu werden.
lexical_decisions:
- source_word: ἐλεημοσύνη / ἐλεημοσύνας
  choice: barmherziges Geben / barmherzig gibt
  rationale: Der Ausdruck bezeichnet konkrete Barmherzigkeit in Form von Gaben an Bedürftige. Die Wiedergabe ist im heutigen Deutsch natürlicher als „Almosengeben“ und bewahrt sowohl den Aspekt des Gebens als auch den der Barmherzigkeit.
- source_word: ῥύεται
  choice: rettet
  rationale: Das Verb bezeichnet die Rettung oder Befreiung aus einer Gefahr. „Rettet vor dem Tod“ gibt die Konstruktion mit ἐκ klar und ohne zusätzliche dogmatische Festlegung wieder.
- source_word: ἀποκαθαριεῖ
  choice: wird ... vollständig reinigen
  rationale: Das zusammengesetzte Verb hat verstärkende beziehungsweise gründliche Bedeutung. „Vollständig reinigen“ bewahrt den Reinigungsgedanken und seine umfassende Kraft.
- source_word: πᾶσαν ἁμαρτίαν
  choice: jede Sünde
  rationale: Die Verbindung wird distributiv und mit ihrer umfassenden Aussage wiedergegeben.
- source_word: ποιοῦντες ... δικαιοσύνας
  choice: gerecht handelt
  rationale: Die Pluralform verweist hier auf konkrete gerechte Taten. Die verbale Formulierung klingt im Deutschen natürlich und erhält den praktischen Sinn.
- source_word: πλησθήσονται ζωῆς
  choice: wird mit Leben erfüllt werden
  rationale: Die Formulierung folgt dem Zukunftspassiv und bewahrt das Bild des Erfülltwerdens, ohne festzulegen, ob „Leben“ Langlebigkeit, Lebenskraft oder umfassenden Segen meint.
theological_decisions:
- issue: Verhältnis von barmherzigem Geben zu Rettung und Sündenreinigung
  choice: Die unmittelbare Aussage, dass barmherziges Geben vor dem Tod rettet und jede Sünde reinigt, bleibt ungemildert stehen.
  alternative: Die Aussage als bloße Weisheitsmaxime, als Übertreibung oder ausdrücklich als nicht verdienstliche Begleiterscheinung der Umkehr erklären.
  rationale: Der griechische Text formuliert den Zusammenhang direkt. Die Übersetzung bewahrt diese theologische Spannung und fügt keine spätere dogmatische Erklärung hinzu.
- issue: Bedeutung von δικαιοσύνας
  choice: Als konkrete gerechte Handlungen verbal mit „gerecht handelt“ wiedergeben.
  alternative: „Gerechtigkeit übt“ oder „gerechte Taten tut“.
  rationale: Der Plural und die Verbindung mit barmherzigem Geben sprechen für praktisches rechtschaffenes Handeln. Die gewählte Form ist natürlich, ohne den ethischen Gehalt abzuschwächen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Barmherziges Geben“ vermeidet das heute teils abwertend oder institutionell klingende „Almosengeben“, hält aber die konkrete Hilfe für Bedürftige fest. Der Singular „Wer ... handelt“ gibt den generischen Plural idiomatisch wieder.
