base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/012/003.yaml
  text: because he brought me back to you healthy, and he healed my wife and brought back my money, and he likewise healed you.
translation:
  language: de
  text: Denn er hat mich gesund zu dir gebracht, meine Frau geheilt, mein Geld gebracht und dich ebenfalls geheilt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγώχεν … ὑγιῆ
  choice: hat mich gesund … zurückgebracht
  rationale: Das resultative ὑγιῆ wird unmittelbar mit „gesund“ wiedergegeben; ἀγώχεν bezeichnet hier das Zurückbringen zum Vater.
- source_word: ἐθεράπευσεν
  choice: geheilt
  rationale: Das Verb bezeichnet in beiden Fällen eine Heilung und wird zur Wahrung der Wiederholung gleich übersetzt.
- source_word: τὸ ἀργύριόν μου ἤνεγκεν
  choice: mein Geld zurückgebracht
  rationale: ἀργύριον meint im Kontext das Geld; obwohl ἤνεγκεν wörtlich „gebracht“ heißt, macht „zurückgebracht“ die Rückführung des zuvor hinterlegten Geldes idiomatisch deutlich.
- source_word: ὁμοίως
  choice: ebenso auch
  rationale: Die Entsprechung zwischen der Heilung der Frau und der Heilung des Vaters bleibt klar hervorgehoben.
