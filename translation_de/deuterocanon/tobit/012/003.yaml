    issue: „zurückgebracht“ bei ἀγώχεν und ἤνεγκεν
    rationale: Das Griechische sagt jeweils lediglich „gebracht/geführt“. Eine Rückkehr bzw. Rückführung ist kontextuell verständlich, aber nicht lexikalisch ausgedrückt; „gebracht“ bewahrt die Offenheit des Wortlauts.
  - severity: low
    issue: „ebenso auch“
    rationale: Die Kombination ist im Deutschen redundant. „ebenfalls“ entspricht ὁμοίως ohne stilistische Doppelung.
