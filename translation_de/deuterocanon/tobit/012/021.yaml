  text: And they stood up[a], and they did not see him.
translation:
  language: de
  text: Sie standen auf und sahen ihn nicht.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνέστησαν
  choice: sie standen auf
  rationale: Der Aorist von ἀνίστημι bezeichnet hier im Erzählzusammenhang eine schlichte körperliche Bewegung; „standen auf“ ist natürlich und wahrt die Aussage des Griechischen.
- source_word: οὐκ εἶδον
  choice: sie sahen ihn nicht mehr
  rationale: Wörtlich steht „sie sahen ihn nicht“. Im Deutschen bringt „nicht mehr“ den im Kontext naheliegenden Übergang vom Sehen zum Nichtsehen idiomatisch zum Ausdruck, ohne eine Unfähigkeit oder den Vorgang des Verschwindens ausdrücklich zu behaupten.
- source_word: αὐτόν
  choice: ihn
  rationale: Das maskuline Akkusativpronomen bezieht sich im Kontext eindeutig auf Rafael.
theological_decisions:
- issue: Soll das angedeutete übernatürliche Verschwinden ausdrücklich benannt werden?
  choice: 'Die Aussage bleibt bei der Wahrnehmung der Beobachter: „sie sahen ihn nicht mehr“.'
  alternative: „Er verschwand vor ihren Augen.“
  rationale: Der griechische Text beschreibt lediglich, was sie wahrnahmen, und erklärt nicht ausdrücklich, auf welche Weise Rafael nicht mehr zu sehen war. Diese Zurückhaltung bleibt erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzverknüpfung mit „doch“ gibt den erzählerischen Kontrast natürlich wieder; die Formulierung wahrt zugleich die knappe Zurückhaltung des griechischen Ausgangstextes.
