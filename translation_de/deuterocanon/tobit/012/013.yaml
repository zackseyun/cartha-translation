base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/012/013.yaml
  text: And when you did not hesitate to rise and leave your meal so that you might go and wrap the dead man[a], your doing good did not escape me[b], but I was with you.
translation:
  language: de
  text: Und als du nicht zögertest aufzustehen und dein Mahl[b] stehen zu lassen, um hinzugehen und den Toten einzuhüllen[a], blieb mir dein gutes Handeln nicht verborgen, sondern ich war bei dir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den Toten für die Bestattung herzurichten“. Das griechische Verb kann das Einhüllen oder anderweitige Herrichten eines Leichnams bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Das griechische Wort kann eine Hauptmahlzeit bezeichnen; welche Tageszeit gemeint ist, wird hier nicht näher bestimmt.
    reason: cultural_note
lexical_decisions:
- source_word: οὐκ ὤκνησας
  choice: du nicht zögertest
  rationale: ὀκνέω bezeichnet hier Zögern oder widerstrebendes Zaudern. „Nicht zögern“ ist im modernen Deutsch natürlich und bewahrt das Lob für das entschlossene Handeln.
- source_word: ἀναστῆναι
  choice: aufzustehen
  rationale: Das Verb bedeutet wörtlich „aufstehen“ und bezeichnet im Zusammenhang das Aufstehen vom Mahl.
- source_word: καταλιπεῖν τὸ ἄριστόν σου
  choice: dein Mahl stehen zu lassen
  rationale: ἄριστον bezeichnet eine Mahlzeit, teils besonders eine Hauptmahlzeit, ohne hier die Tageszeit eindeutig festzulegen. „Stehen lassen“ gibt im Deutschen anschaulich wieder, dass Tobit das Essen unverzüglich verließ.
- source_word: ὅπως ἀπελθὼν
  choice: um hinzugehen
  rationale: Die Konstruktion drückt eine Absicht aus. Die deutsche Infinitivgruppe gibt diesen Zweck knapp und idiomatisch wieder.
- source_word: περιστείλῃς τὸν νεκρόν
  choice: den Toten einzuhüllen
  rationale: περιστέλλω kann das Einhüllen oder anderweitige Herrichten eines Leichnams bezeichnen. „Einhüllen“ bleibt nah am griechischen Ausdruck, ohne bereits den gesamten Bestattungsvorgang in das Verb hineinzulesen.
- source_word: οὐκ ἔλαθές με ἀγαθοποιῶν
  choice: blieb mir nicht verborgen, dass du Gutes tatest
  rationale: Die Wendung mit λανθάνω besagt, dass Tobits gutes Handeln dem Sprecher nicht entging. Die Satzform ist natürliches Deutsch und bewahrt zugleich die verbale Aussage von ἀγαθοποιῶν.
- source_word: ἀλλὰ σὺν σοὶ ἤμην
  choice: sondern ich war bei dir
  rationale: Die schlichte Wiedergabe bewahrt den Gegensatz und Raphaels Aussage seiner Gegenwart, ohne sie weiter auszudeuten.
theological_decisions:
- issue: Art von Raphaels Gegenwart und Wahrnehmung
  choice: Raphael sagt ausdrücklich, dass Tobits gutes Handeln ihm nicht verborgen blieb und dass er bei ihm war.
  alternative: Die Aussage als Hinweis auf eine umfassende engelhafte Allwissenheit, besondere Schutzengelrolle oder Mittlerschaft auszuweiten.
  rationale: Der griechische Text trifft nur eine Aussage über diese konkrete Begebenheit. Die Übersetzung wahrt diese erzählerische Aussage, ohne zusätzliche Lehren einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nah am griechischen Gedankengang, wird aber idiomatisch geglättet. Die Fußnotenmarker stehen jeweils unmittelbar bei dem Ausdruck, den sie erläutern.
