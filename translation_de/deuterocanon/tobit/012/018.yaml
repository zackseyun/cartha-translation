  yaml_path: translation/deuterocanon/tobit/012/018.yaml
  text: For it was not by my own favor[a], but by the will of your God. Therefore bless him forever.
translation:
  language: de
  text: Denn es geschah nicht aus meiner eigenen Gunst[a], sondern nach dem Willen eures Gottes. Darum preist ihn in Ewigkeit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „aus meiner eigenen Gnade“. Das griechische χάρις kann „Gnade“ oder „Gunst“ bedeuten; hier ist wahrscheinlich Rafaels eigenes Wohlwollen oder seine eigene Initiative gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: χάριτι
  choice: Gunst
  rationale: „Gunst“ gibt χάρις in diesem Erzählzusammenhang als persönliche Begünstigung oder gnädiges Entgegenkommen wieder, ohne den Begriff vorschnell dogmatisch aufzuladen.
- source_word: θελήσει
  choice: Willen
  rationale: θέλημα bezeichnet hier Gottes Willen oder Absicht; „nach dem Willen“ ist im Deutschen natürlich und wahrt Gottes maßgebende Initiative.
- source_word: τοῦ θεοῦ ὑμῶν
  choice: eures Gottes
  rationale: Die Genitivverbindung ist possessiv beziehungsweise relational und richtet sich an mehrere Angesprochene.
- source_word: ὅθεν
  choice: Darum
  rationale: ὅθεν leitet hier die Folgerung und anschließende Aufforderung aus der vorangehenden Aussage ein.
- source_word: εὐλογεῖτε
  choice: preist
  rationale: Das Imperativverb bedeutet wörtlich „segnet“, bezeichnet bei Gott jedoch idiomatisch sein Lobpreisen; „preist“ ist in modernem Deutsch klar und würdevoll.
- source_word: εἰς τὸν αἰῶνα
  choice: in Ewigkeit
  rationale: Die feste Wendung bezeichnet unbegrenzte Dauer; „in Ewigkeit“ bewahrt den biblisch-feierlichen Ton.
- source_word: ἐμαυτοῦ
  choice: meiner eigenen
  rationale: Das Reflexivpronomen betont, dass die Gunst nicht von Rafael selbst ausging.
theological_decisions:
- issue: Bedeutung von χάρις in Rafaels Verneinung eigener Urheberschaft
  choice: Rafael erklärt, das Geschehen sei nicht auf seine eigene Gunst zurückzuführen, sondern auf Gottes Willen.
  alternative: Rafael erklärt, es sei nicht durch seine eigene Gnade, sondern durch Gottes Willen geschehen.
  rationale: χάρις kann „Gnade“, „Gunst“ oder „Wohlwollen“ bedeuten. Im narrativen Zusammenhang steht die von Gott bestimmte Sendung beziehungsweise Hilfe im Vordergrund; „Gunst“ wahrt diesen Sinn, während die Fußnote die echte lexikalische Alternative offenhält.
- issue: Implizites Prädikat im ersten Satz
  choice: „es geschah“ wird zur Bildung eines natürlichen deutschen Satzes ergänzt.
  alternative: 'Die griechische verblos-elliptische Form unmittelbar nachbilden: „Denn nicht aus meiner eigenen Gunst, sondern nach dem Willen eures Gottes.“'
  rationale: Der griechische Text lässt das aus dem Kontext zu ergänzende Geschehen unausgesprochen. Das neutrale „es geschah“ macht den Satz im Deutschen vollständig, ohne die konkrete Art von Rafaels Wirken festzulegen.
- issue: Wiedergabe des Segnens Gottes
  choice: „preist ihn“
  alternative: „segnet ihn“
  rationale: „Segnen“ kann im Deutschen missverständlich so wirken, als verliehen Menschen Gott Segen. „Preisen“ drückt die hier gemeinte, an Gott gerichtete εὐλογία idiomatisch aus, ohne den Inhalt der Aufforderung abzuschwächen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die Ellipse des Griechischen wird zurückhaltend durch „es geschah“ ergänzt; „in Ewigkeit“ erhält die feierliche Ausdrucksweise.
