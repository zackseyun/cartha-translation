  revision_rationale: Keine sichere sachliche oder sprachliche Korrektur erforderlich. Der deutsche Text bewahrt die Ausdrucksweise und die bewusst nicht weiter aufgelöste himmlische Bildsprache des griechischen Ausgangstextes.
