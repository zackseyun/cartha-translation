base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/012/015.yaml
  text: I am Raphael[a], one of the seven holy angels who present the prayers of the holy ones and enter before the glory of the Holy One.
translation:
  language: de
  text: Ich bin Rafael, einer von den sieben heiligen Engeln, die die Gebete der Heiligen[a] emportragen und vor die Herrlichkeit des Heiligen treten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Gemeint sind die Menschen, die als heilig zu Gott gehören; auch: »der heiligen Menschen«.'
    reason: Die Erläuterung verhindert, dass »die Heiligen« ausschließlich im späteren Sinn förmlich kanonisierter Personen verstanden wird, und macht die lexikalische Weite des griechischen Ausdrucks sichtbar.
lexical_decisions:
- source_word: Ῥαφαήλ
  choice: Rafael
  rationale: Der Eigenname wird in seiner im Deutschen geläufigen biblischen Form wiedergegeben.
- source_word: εἷς ἐκ τῶν ἑπτὰ ἁγίων ἀγγέλων
  choice: einer von den sieben heiligen Engeln
  rationale: Die natürliche deutsche Form bewahrt sowohl den partitiven Ausdruck als auch die ausdrücklich genannte Zahl und das Attribut »heilig«.
- source_word: προσαναφέρουσιν
  choice: emportragen
  rationale: Das Verb bezeichnet ein Hinauf- beziehungsweise Heranbringen. »Emportragen« bewahrt die Bewegungsrichtung zum himmlischen Thron, ohne zwingend eine Opferhandlung auszudrücken.
- source_word: τὰς προσευχὰς τῶν ἁγίων
  choice: die Gebete der Heiligen
  rationale: »Gebete« ist die direkte Entsprechung zu προσευχάς. Das substantivierte »die Heiligen« gibt τῶν ἁγίων knapp wieder und lässt wie das Griechische offen, ob der Ausdruck erläuternd als Gottes heiliges Volk wiederzugeben ist.
- source_word: εἰσπορεύονται ἐνώπιον
  choice: vor … treten
  rationale: Die Wendung gibt sowohl die Bewegung in die Gegenwart hinein als auch das Stehen vor einer höheren Instanz in natürlichem, würdigem Deutsch wieder.
- source_word: τῆς δόξης τοῦ ἁγίου
  choice: die Herrlichkeit des Heiligen
  rationale: »Herrlichkeit« hält δόξα ausdrücklich sichtbar. »Der Heilige« versteht den substantivierten Singular als ehrfürchtige Gottesbezeichnung, ohne die Wendung erläuternd zu erweitern.
theological_decisions:
- issue: Bezug von τοῦ ἁγίου im Schlusssatz
  choice: »des Heiligen« als Gottesbezeichnung
  alternative: adjektivischer Sinn oder weniger ausdrückliche Umschreibung der göttlichen Gegenwart
  rationale: Im Bild des himmlischen Hofes bezeichnet der substantivierte Singular am natürlichsten Gott. Die Formulierung bewahrt zugleich die ungewöhnliche Aussage, dass die Engel vor seine Herrlichkeit treten.
- issue: Bedeutung von τῶν ἁγίων
  choice: »der Heiligen«
  alternative: »der heiligen Menschen« oder »der zu Gott Gehörenden«
  rationale: Die knappe substantivische Wiedergabe entspricht der Form des Griechischen und bewahrt dessen traditionelle wie auch allgemeinere Bedeutung, ohne den Ausdruck auf später kanonisierte Heilige einzuengen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur folgt dem feierlichen Selbstzeugnis Rafaels, bleibt aber flüssig. »Emportragen« und »vor … treten« erhalten die räumliche Bildsprache des himmlischen Hofes.
