  terminology: „Der Heilige“ bewahrt die substantivierte Gottesbezeichnung ohne den Referenten im Haupttext stärker festzulegen als die Quelle. „Gedenken“ gibt μνημόσυνον zurückhaltend wieder; die Fußnote kann den möglichen kultischen Sinn erläutern, darf jedoch keine grammatisch nicht mögliche Neutrumlesart behaupten.
