base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/012/012.yaml
  text: And now[a], when you and your bride Sarah were praying, I brought the memorial of your prayer before the Holy One. And when you were burying the dead[c][b], I likewise was with you.
translation:
  language: de
  text: 'Und nun: Als du und deine Frau Sara[a] beteten, brachte ich das Gedenken an euer Gebet[b] vor den Heiligen.[c] Und als du die Toten begrubst, war ich ebenso bei dir.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „deine junge Frau Sara“. Das griechische Wort kann eine Braut oder eine junge, soeben verheiratete Frau bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „das Gedenkzeichen eures Gebets“. Der Ausdruck kann einen kultischen Anklang haben, ähnlich einem vor Gott gebrachten Gedenkopfer.'
    reason: lexical_alternative
  - marker: c
    text: „Der Heilige“ bezeichnet hier dem Zusammenhang nach Gott.
    reason: alternative_reading
lexical_decisions:
- source_word: νῦν
  choice: nun
  rationale: Das temporale Adverb dient hier zugleich als Übergang im Redegang; „nun“ ist knapp und idiomatisch.
- source_word: προσηύξω
  choice: als du und deine Braut Sara beteten
  rationale: Der Aorist bezeichnet den Anlass des Gebets. Wegen des zusammengesetzten Subjekts steht im Deutschen natürlich der Plural, auch wenn die griechische Verbform in der zweiten Person Singular steht.
- source_word: νύμφη
  choice: Braut
  rationale: „Braut“ bewahrt die unmittelbare Hochzeitssituation und kann wie das griechische Wort auch die junge, soeben verheiratete Frau bezeichnen.
- source_word: προσήγαγον
  choice: brachte ich … vor
  rationale: Die direkte Bedeutung „heranbringen/vorbringen“ wird durch die Verbindung mit „vor den Heiligen“ natürlich wiedergegeben, ohne ausdrücklich ein Opfergeschehen einzutragen.
- source_word: μνημόσυνον τῆς προσευχῆς ὑμῶν
  choice: das Gedenken an euer Gebet
  rationale: „Gedenken“ erhält sowohl den allgemeinen Sinn der Erinnerung als auch den möglichen kultischen Anklang eines vor Gott gebrachten Gedenkzeichens. Der Singular von προσευχή bleibt erhalten.
- source_word: ἐνώπιον τοῦ ἁγίου
  choice: vor den Heiligen
  rationale: Die substantivierte Bezeichnung wird formal bewahrt und in diesem Kontext als Gottesbezeichnung verstanden, ohne „Gott“ in den Haupttext einzusetzen.
- source_word: ἐθάπτες τοὺς νεκρούς
  choice: als du die Toten begrubst
  rationale: Der Imperfekt kann wiederholtes oder andauerndes Handeln ausdrücken. Das deutsche Präteritum ist hier natürlich und lässt den Kontext wiederholter Bestattungen zu.
- source_word: ὡσαύτως συμπαρήμην σοι
  choice: war ich ebenso bei dir
  rationale: „Ebenso“ gibt die Entsprechung wieder; „bei dir sein“ vermittelt die begleitende Anwesenheit, ohne zusätzliche Schutz- oder Beistandsvorstellungen einzutragen.
theological_decisions:
- issue: Bezug von τοῦ ἁγίου
  choice: „der Heilige“ als Bezeichnung Gottes
  alternative: ein heiliges himmlisches Wesen oder, grammatisch möglich, „das Heilige“
  rationale: Im Zusammenhang bringt Rafael das Gebet in die göttliche Gegenwart. „Der Heilige“ wahrt die griechische Ausdrucksweise und macht keine menschliche Heiligengestalt daraus; eine Fußnote nennt die kontextuelle Deutung ausdrücklich, ohne die grammatische Spannung zu verschweigen.
- issue: Kultischer Gehalt von μνημόσυνον
  choice: „Gedenken“
  alternative: „Gedenkzeichen“ oder „Gedenkopfer“
  rationale: Der Ausdruck kann in religiöser Sprache einen kultischen Anklang tragen. Der Haupttext lässt diesen mitschwingen, behauptet aber nicht ausdrücklich, das Gebet sei ein Opfer.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bleibt nahe an der griechischen Abfolge, wird jedoch durch den Doppelpunkt und natürliche deutsche Kongruenz gut lesbar. Die ungewöhnliche Wendung „das Gedenken … vor den Heiligen bringen“ wird bewusst nicht geglättet, damit ihr möglicher kultischer Gehalt erhalten bleibt.
