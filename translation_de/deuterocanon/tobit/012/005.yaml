translation:
  language: de
  text: 'Und er rief den Engel und sagte zu ihm[a]: »Nimm die Hälfte von allem, was«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der für diesen Vers bereitgestellte griechische Quellenausschnitt ist unvollständig und bricht mitten im Satz nach »von allem, was« ab. Daher bleibt auch die Übersetzung unvollendet, statt nicht überlieferte Wörter zu ergänzen.
    reason: textual_variant
lexical_decisions:
- source_word: ἐκάλεσεν
  choice: rief
  rationale: Der Aorist von καλέω bedeutet hier schlicht »rufen« bzw. »zu sich rufen«. »Rief« ist im Erzählzusammenhang natürlich und vermeidet eine unnötig förmliche Wiedergabe wie »ließ kommen«.
- source_word: τὸν ἄγγελον
  choice: den Engel
  rationale: ἄγγελος kann »Bote« oder »Engel« bedeuten; in Tobit 12 ist die Gestalt jedoch als himmlisches Wesen ausgewiesen. Daher entspricht »Engel« ihrer erzählerischen Identität.
- source_word: Λάβε
  choice: Nimm
  rationale: Der Imperativ von λαμβάνω wird in diesem Zusammenhang, in dem eine Entlohnung angeboten wird, direkt und idiomatisch mit »Nimm« wiedergegeben.
- source_word: τὸ ἥμισυ
  choice: die Hälfte
  rationale: Die substantivierte Form bezeichnet eine Hälfte. Im Deutschen ist »die Hälfte« die natürliche Wiedergabe.
- source_word: πάντων
  choice: von allem
  rationale: Der Genitiv Plural ist umfassend gebraucht. »Von allem« ist im Deutschen knapp und idiomatisch.
- source_word: ὧν
  choice: was
  rationale: Das Relativpronomen leitet einen im bereitgestellten griechischen Ausschnitt unvollständigen Relativsatz ein. Nach »allem« ist »was« die natürliche deutsche Entsprechung.
