  source_fidelity: 'Die Übersetzung gibt alle Elemente des griechischen Textes zutreffend wieder: die Erschütterung bzw. das Erschrecken (ἐταράχθησαν), die beiden Personen (οἱ δύο), ihr Niederfallen in Gesichtsrichtung zum Boden (ἔπεσον ἐπὶ πρόσωπον) und die ausdrücklich genannte Furcht als Grund (ὅτι ἐφοβήθησαν). „Da“ vermittelt den narrativen Anschluss von Καὶ idiomatisch.'
