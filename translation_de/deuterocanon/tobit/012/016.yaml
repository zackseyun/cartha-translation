  text: And the two were shaken, and they fell facedown, because they were afraid.
translation:
  language: de
  text: Da erschraken die beiden und fielen auf ihr Angesicht, denn sie fürchteten sich.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐταράχθησαν
  choice: erschraken
  rationale: Das Verb bezeichnet hier eine plötzliche innere Erschütterung oder Beunruhigung. „Erschraken“ ist im Deutschen natürlich und lässt die anschließend ausdrücklich genannte Furcht als Begründung stehen.
- source_word: οἱ δύο
  choice: die beiden
  rationale: Die substantivierte Zahl wird im Deutschen idiomatisch mit „die beiden“ wiedergegeben und bezieht sich auf Tobit und Tobias.
- source_word: ἔπεσον ἐπὶ πρόσωπον
  choice: fielen auf ihr Angesicht
  rationale: Die Wendung bezeichnet das Niederfallen mit dem Gesicht zum Boden. Die leicht gehobene Formulierung bewahrt das konkrete Bild und den würdevollen biblischen Ton.
- source_word: ὅτι
  choice: denn
  rationale: ὅτι führt hier die Begründung für das Niederfallen an. „Denn“ gibt diesen Zusammenhang in einem natürlichen deutschen Satz wieder.
- source_word: ἐφοβήθησαν
  choice: sie fürchteten sich
  rationale: Die deponentische Form drückt Furcht aus. „Sie fürchteten sich“ ist präzise und stilistisch angemessen.
theological_decisions:
- issue: Art der Reaktion auf Rafaëls Offenbarung
  choice: Das Niederfallen wird ausdrücklich als Reaktion auf Furcht dargestellt, ohne es als Anbetung zu bezeichnen.
  alternative: Die Haltung könnte als ehrfürchtiges Niederwerfen vor einem Engel verstanden werden.
  rationale: Der griechische Text nennt das Niederfallen und begründet es mit ihrer Furcht. Die Übersetzung fügt keine nicht ausdrücklich genannte Deutung als Anbetung hinzu.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem, leicht biblischem Klang. „Auf ihr Angesicht“ bewahrt das körperliche Bild der griechischen Wendung; „erschraken“ vermeidet eine schwerfällige passive Formulierung.
