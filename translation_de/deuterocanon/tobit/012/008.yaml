base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/012/008.yaml
  text: Prayer with fasting[a], almsgiving, and righteousness is good; a little with righteousness is better than much with unrighteousness[b]. It is good to do almsgiving rather than to store up gold.
translation:
  language: de
  text: Gebet zusammen mit Fasten, Almosengeben und Gerechtigkeit[a] ist gut; wenig mit Gerechtigkeit ist besser als viel mit Ungerechtigkeit. Es ist gut, Almosen zu geben, statt Gold anzuhäufen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: »Gerechtigkeit« kann hier auch im Sinn von »Rechtschaffenheit« oder »gerechtem Handeln« verstanden werden; entsprechend bezeichnet »Ungerechtigkeit« auch unrechtes Handeln.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγαθὸν
  choice: ist gut / ist besser
  rationale: Das prädikative Adjektiv bewertet die genannten Handlungen als gut. Im Mengenvergleich gibt »besser« die durch ἢ ausgedrückte Vergleichsbeziehung im natürlichen Deutschen wieder, obwohl im Griechischen kein formaler Komparativ steht.
- source_word: προσευχὴ μετὰ νηστείας
  choice: Gebet zusammen mit Fasten
  rationale: »Zusammen mit« bewahrt die offene Beziehung zwischen Gebet und Fasten, ohne Fasten als Mittel oder Bedingung festzulegen.
- source_word: ἐλεημοσύνης / ποιῆσαι ἐλεημοσύνην
  choice: Almosengeben / Almosen zu geben
  rationale: Der Ausdruck bezeichnet in diesem jüdisch-griechischen Zusammenhang konkrete Unterstützung Bedürftiger. Die variierte deutsche Formulierung ist idiomatisch und erhält den sachlichen Zusammenhang beider Vorkommen.
- source_word: δικαιοσύνης / ἀδικίας
  choice: Gerechtigkeit / Ungerechtigkeit
  rationale: Die Wortpaarung erhält den direkten moralischen Gegensatz und lässt sowohl gerechtes Handeln als auch umfassende Rechtschaffenheit anklingen.
- source_word: τὸ ὀλίγον / πολὺ
  choice: wenig / viel
  rationale: Die knappe substantivische Gegenüberstellung entspricht dem sprichwortartigen Charakter des griechischen Satzes.
- source_word: καλὸν
  choice: Es ist gut
  rationale: καλόν kann auch moralische Schönheit oder Vorzüglichkeit bezeichnen; »gut« ist hier würdig und verständlich und verbindet die abschließende Maxime mit den vorausgehenden Aussagen.
- source_word: θησαυρίσαι χρυσίον
  choice: Gold anzuhäufen
  rationale: »Anhäufen« gibt das Ansammeln eines Schatzes wieder, ohne die ausdrücklich abwertende Nuance von »horten« einzutragen.
theological_decisions:
- issue: Bedeutungsbreite von δικαιοσύνη und ἀδικία
  choice: Gerechtigkeit / Ungerechtigkeit
  alternative: Rechtschaffenheit / Unrecht
  rationale: »Gerechtigkeit« wahrt den ethisch-sozialen Gehalt und zugleich die breitere religiös-moralische Bedeutung. Die Fußnote dokumentiert, dass der Ausdruck nicht auf institutionelle Rechtsprechung beschränkt ist.
translation_notes:
  register: Moderner, würdiger Weisheitsstil mit klarer parataktischer Struktur. »Almosengeben« ist als präziser religiös-ethischer Begriff beibehalten; die Schlussformulierung »Almosen zu geben« klingt im heutigen Deutsch natürlicher.
