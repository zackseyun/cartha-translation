  text: And now God has sent me to heal you and Sarah your bride[a].
translation:
  language: de
  text: Und nun hat Gott mich gesandt, dich und deine Schwiegertochter Sara[a] zu heilen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort kann auch „Braut“ oder „junge Ehefrau“ bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ νῦν
  choice: Und nun
  rationale: Gibt sowohl die verbindende Funktion von καί als auch den zeitlichen Übergang durch νῦν schlicht und quellennah wieder.
- source_word: ἀπέστειλέν με ὁ θεὸς
  choice: hat Gott mich gesandt
  rationale: Das Perfekt bezeichnet im Deutschen natürlich die bereits erfolgte Sendung mit ihrer gegenwärtigen Bedeutung. „Gesandt“ wahrt den würdigen Ton und den Beauftragungscharakter von ἀποστέλλω.
- source_word: ἰάσασθαί σε
  choice: dich … zu heilen
  rationale: ἰάομαι bedeutet heilen oder gesund machen. „Heilen“ ist breit genug für Tobits Leiden und vermeidet eine unnötige medizinische Einengung.
- source_word: τὴν νύμφην σου Σάρραν
  choice: deine Schwiegertochter Sara
  rationale: Da Tobit angeredet wird und Sara mit seinem Sohn Tobias verheiratet ist, bezeichnet νύμφη hier natürlich seine Schwiegertochter. Die ebenfalls im Wort liegende Bedeutung „Braut“ beziehungsweise „junge Ehefrau“ wird in der Fußnote offengehalten.
theological_decisions:
- issue: Mehrdeutigkeit von νύμφη und Saras Beziehung zum angesprochenen Tobit
  choice: deine Schwiegertochter Sara
  alternative: Sara, die Braut / deine junge Schwiegertochter Sara
  rationale: Der Erzählzusammenhang macht „Schwiegertochter“ als Beziehungsbezeichnung zum Adressaten wahrscheinlich. Weil νύμφη zugleich „Braut“ oder „junge Ehefrau“ bedeuten kann und Saras frische Eheschließung mitschwingt, wird diese Bedeutungsbreite nicht verschwiegen, sondern in einer Fußnote bewahrt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Die Satzstellung bündelt beide Objekte natürlich vor „zu heilen“, ohne den Sinn oder die Gleichordnung des griechischen Textes zu verändern.
