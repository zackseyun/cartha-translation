  yaml_path: translation/deuterocanon/tobit/012/006.yaml
  text: And calling the two of them privately[a], he said to them, “Bless God and give thanks to him; give him greatness, and give thanks to him before all the living for what he has done with you. It is good to bless God and to exalt his name, showing forth with honor the words of the works of God[c][b]; and do not be reluctant
translation:
  language: de
  text: 'Und nachdem er die beiden beiseitegerufen hatte, sagte er zu ihnen: »Segnet Gott[a] und dankt ihm! Schreibt ihm Größe zu und dankt ihm vor allen Lebenden für das, was er mit euch getan hat.[b] Es ist gut, Gott zu segnen und seinen Namen zu erhöhen, indem ihr gebührend von Gottes Taten berichtet. Und nicht …[c]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Verb kann in diesem Zusammenhang auch mit »preist Gott« wiedergegeben werden; wörtlich steht »Segnet Gott«.
    reason: lexical_alternative
  - marker: b
    text: Das Griechische lautet wörtlich »für das, was er mit euch getan hat«; je nach Zusammenhang kann dies auch im Sinn von »für euch getan hat« verstanden werden.
    reason: lexical_alternative
  - marker: c
    text: Der hier vorliegende griechische Text bricht mit den Worten »Und nicht …« ab; die begonnene Aufforderung wird erst im folgenden Text fortgesetzt.
    reason: source_fragment
lexical_decisions:
- source_word: καλέσας τοὺς δύο κρυπτῶς
  choice: nachdem er die beiden unter vier Augen zu sich gerufen hatte
  rationale: Die Konstruktion gibt das einleitende Partizip natürlich wieder; »unter vier Augen« bezeichnet ein Gespräch abseits der Öffentlichkeit, ohne einen verdächtigen Beiklang von »heimlich« aufzudrängen.
- source_word: Εὐλογεῖτε τὸν θεόν
  choice: Preist Gott
  rationale: Das wörtliche »Segnet Gott« ist im Deutschen zwar biblisch möglich, kann aber missverständlich wirken. »Preist« gibt den auf Gott gerichteten Sinn des Verbs klar und würdig wieder; die Grundbedeutung wird in einer Fußnote offengelegt.
- source_word: ἐξομολογεῖσθε
  choice: dankt ihm
  rationale: Im Zusammenhang mit der öffentlichen Verkündigung von Gottes Taten bezeichnet das Verb dankbares Anerkennen und Bekennen, nicht ein Sündenbekenntnis.
- source_word: μεγαλωσύνην δίδοτε αὐτῷ
  choice: Schreibt ihm Größe zu
  rationale: Die Formulierung bewahrt das konkrete Bild des Griechischen, nach dem Gott Größe gegeben beziehungsweise zuerkannt wird, und ist zugleich verständlicher als das rein wörtliche »Gebt ihm Größe«.
- source_word: ἐνώπιον πάντων τῶν ζώντων
  choice: vor allen Lebenden
  rationale: Die Wendung erhält den umfassenden öffentlichen Charakter der Aufforderung und wahrt den gehobenen biblischen Ton.
- source_word: περὶ ὧν ἐποίησεν μεθʼ ὑμῶν
  choice: für das, was er an euch getan hat
  rationale: »An euch« ist im Deutschen natürlich und lässt sowohl Gottes Handeln zugunsten der Angesprochenen als auch sein Handeln an ihnen anklingen. Die wörtlich mögliche Wiedergabe mit »mit euch« wird in der Fußnote genannt.
- source_word: ὑψοῦν τὸ ὄνομα αὐτοῦ
  choice: seinen Namen zu erhöhen
  rationale: Die traditionelle biblische Wendung bleibt erkennbar und ist im modernen Deutschen verständlich.
- source_word: τοὺς λόγους τῶν ἔργων τοῦ θεοῦ ἐντίμως ὑποδεικνύντες
  choice: indem ihr gebührend von Gottes Taten berichtet
  rationale: Die verdichtete griechische Wortfolge wird als ehrenvolle öffentliche Bekanntmachung der Taten Gottes wiedergegeben, ohne das Deutsche durch eine unverständliche Wort-für-Wort-Fassung zu belasten.
- source_word: καὶ μή
  choice: Und nicht …
  rationale: Der bereitgestellte griechische Text bricht nach der einleitenden Verneinung ab. Die Übersetzung ergänzt das fehlende Prädikat nicht eigenmächtig.
theological_decisions:
- issue: Auf Gott gerichtetes εὐλογεῖν
  choice: Preist Gott
  alternative: Segnet Gott
  rationale: Die Übersetzung vermittelt die Aufforderung zu ehrender Gottesrede klar, während die Fußnote die im Griechischen enthaltene Segensformel transparent macht.
- issue: Bedeutung von ἐξομολογεῖσθε
  choice: dankt ihm
  alternative: bekennt ihn / preist ihn
  rationale: Der unmittelbare Zusammenhang nennt Gottes Wohltaten und ihre öffentliche Bekanntmachung. Dankbares Anerkennen ist daher der naheliegende Sinn, ohne die weitere Bedeutungsbreite des Verbs grundsätzlich auszuschließen.
- issue: Gottes Handeln μεθʼ ὑμῶν
  choice: was er an euch getan hat
  alternative: was er mit euch getan hat / was er für euch getan hat
  rationale: Die gewählte Formulierung vermeidet eine einseitige Festlegung auf bloßes Handeln zugunsten der Menschen und bewahrt die Möglichkeit, dass Gottes Wirken an ihnen oder in ihrem Leben gemeint ist.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit gut verständlicher Satzführung. Biblische Wendungen wie »vor allen Lebenden« und »seinen Namen erhöhen« bleiben erhalten; schwer verständliche Wörtlichkeiten werden transparent und quellennah geglättet. Der fragmentarische Schluss wird nicht ergänzt.
