  text: And he said to them[a], “Do not be afraid; peace be with you. But bless God forever.”
translation:
  language: de
  text: 'Und er sagte zu ihnen: »Fürchtet euch nicht! Friede wird mit euch sein. Doch preist Gott in Ewigkeit!«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μὴ φοβεῖσθε
  choice: Fürchtet euch nicht
  rationale: Die geläufige deutsche Wiedergabe der verneinten Imperativform bewahrt sowohl den Aufforderungscharakter als auch den würdevollen biblischen Ton.
- source_word: εἰρήνη ὑμῖν ἔσται
  choice: Friede wird mit euch sein
  rationale: Die Wiedergabe bildet das Futur ἔσται ausdrücklich ab und versteht die Aussage als Zusicherung. Zugleich entspricht »mit euch sein« natürlichem, gehobenem Standarddeutsch.
- source_word: τὸν δὲ θεὸν
  choice: Doch ... Gott
  rationale: 'δέ kennzeichnet hier nach der Beruhigung einen milden Gegensatz beziehungsweise Übergang: Nicht Furcht, sondern das Preisen Gottes soll ihre Reaktion bestimmen.'
- source_word: εὐλογεῖτε
  choice: preist
  rationale: Bei Gott als Objekt bedeutet εὐλογέω, ihn lobend zu rühmen. »Preist« ist im heutigen Deutsch verständlicher als »segnet Gott«, ohne den kultisch-biblischen Sinn zu verlieren.
- source_word: εἰς τὸν αἰῶνα
  choice: in Ewigkeit
  rationale: Die feste Wendung bezeichnet unbegrenzte Dauer; »in Ewigkeit« ist eine natürliche und würdevolle deutsche Entsprechung.
theological_decisions:
- issue: Aussagekraft des Friedenswortes
  choice: 'Zukünftige Zusicherung: »Friede wird mit euch sein«'
  alternative: 'Gruß oder Segenswunsch: »Friede sei mit euch«'
  rationale: Das griechische Futur ἔσται spricht vorrangig für eine Zusage, die auf das Verbot der Furcht folgt. Die Übersetzung bewahrt diese grammatische Form, ohne den möglichen Anklang an einen Friedensgruß auszuschließen.
- issue: Wiedergabe von εὐλογεῖτε gegenüber Gott
  choice: »preist Gott«
  alternative: »segnet Gott«
  rationale: Im Deutschen kann »Gott segnen« missverständlich so verstanden werden, als spende der Mensch Gott Segen. »Preist« gibt die hier gemeinte lobende Rede idiomatisch wieder und vermeidet eine konfessionelle Zuspitzung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede ist klar und mündlich verständlich; das Futur der Friedenszusage bleibt gegen die traditionelle benediktive Form ausdrücklich erhalten.
