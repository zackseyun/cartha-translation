base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/012/007.yaml
  text: Do not hesitate to acknowledge him[a]. It is good to conceal a king’s secret, but to reveal the works of God gloriously. Do what is good[b], and evil will not find you.
translation:
  language: de
  text: Zögert nicht, euch zu ihm zu bekennen[a]. Das Geheimnis eines Königs zu verbergen ist gut; die Taten Gottes aber soll man auf ehrenvolle Weise[b] offenbaren. Tut Gutes, und Böses wird euch nicht finden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihm Dank bezeugen“ oder „ihn offen preisen“. Das griechische Verb kann je nach Zusammenhang öffentliches Bekennen, Danken oder Preisen bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „ruhmvoll“ oder „mit gebührender Ehre“. Das griechische Adverb kann sowohl einen Bezug zu Gottes Herrlichkeit als auch die angemessene, ehrerbietige Weise des Bekanntmachens bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀκνεῖτε
  choice: Zögert nicht
  rationale: Das Verb bezeichnet ein Zögern, Zaudern oder Zurückschrecken. „Zögert nicht“ gibt den verneinten Imperativ natürlich und prägnant wieder.
- source_word: ἐξομολογεῖσθαι αὐτῷ
  choice: euch öffentlich zu ihm zu bekennen
  rationale: ἐξομολογεῖσθαι kann öffentliches Bekennen, Danken oder Preisen bezeichnen. Die gewählte Formulierung wahrt den Dativ αὐτῷ und den Gedanken einer offenen Anerkennung, ohne die Bedeutung auf ein Sündenbekenntnis festzulegen.
- source_word: μυστήριον βασιλέως
  choice: das Geheimnis eines Königs
  rationale: μυστήριον bezeichnet hier eine vertrauliche Angelegenheit. „Geheimnis“ ist im Deutschen klarer und kontextgemäßer als ein theologisches „Mysterium“.
- source_word: καλὸν κρύψαι
  choice: zu verbergen ist gut
  rationale: Die Infinitivkonstruktion formuliert eine allgemeine Lebensregel. Die Wiedergabe erhält ihre knappe, sprichwortartige Form.
- source_word: τὰ ἔργα τοῦ θεοῦ
  choice: die Taten Gottes
  rationale: ἔργα meint hier Gottes wirksames Handeln. „Taten“ klingt im modernen Deutsch natürlicher als „Werke“ und passt zum Offenbarmachen dessen, was Gott getan hat.
- source_word: ἀνακαλύπτειν
  choice: offenbaren
  rationale: Das Verb bedeutet aufdecken oder bekannt machen. „Offenbaren“ bildet einen deutlichen Gegensatz zu „verbergen“ und entspricht dem erhabenen Kontext.
- source_word: ἐνδόξως
  choice: ruhmvoll
  rationale: Das Adverb beschreibt die Weise, in der Gottes Taten bekannt gemacht werden sollen. „Ruhmvoll“ bewahrt den Bezug zu Ehre und Herrlichkeit; die mögliche Bedeutung „ehrenvoll“ wird in einer Fußnote genannt.
- source_word: ἀγαθὸν ποιήσατε
  choice: Tut Gutes
  rationale: Die knappe ethische Aufforderung entspricht dem griechischen Ausdruck und ist im Deutschen unmittelbar verständlich.
- source_word: κακὸν οὐχ εὑρήσει ὑμᾶς
  choice: Böses wird euch nicht finden
  rationale: Die Formulierung bewahrt bewusst das anschauliche griechische Bild des Bösen, das jemanden „findet“, statt es enger als Schaden oder Unglück auszulegen.
theological_decisions:
- issue: Bedeutung von ἐξομολογεῖσθαι αὐτῷ
  choice: sich öffentlich zu Gott bekennen
  alternative: ihm danken; ihn offen preisen; ihm bekennen
  rationale: Der folgende Gegensatz zwischen dem Verbergen eines königlichen Geheimnisses und dem Bekanntmachen der Taten Gottes spricht für öffentliche Anerkennung beziehungsweise Lob. Die Übersetzung hält zugleich die breitere Bedeutung des Verbs offen.
- issue: Bedeutung von ἐνδόξως
  choice: ruhmvoll
  alternative: ehrenvoll; mit gebührender Ehre
  rationale: Im Zusammenhang mit Gottes Taten kann das Adverb eine auf Gottes Herrlichkeit bezogene, doxologische Färbung tragen. Da ebenso die würdige Art des Bekanntmachens gemeint sein kann, wird diese Möglichkeit in der Fußnote bewahrt.
- issue: Aussage über das Nichtfinden durch das Böse
  choice: Böses wird euch nicht finden
  alternative: kein Unheil wird euch treffen
  rationale: Die wörtliche Bildsprache lässt offen, ob κακόν moralisches Böses, Schaden oder Unheil bezeichnet. Sie wird daher nicht zu einer engeren Zusage materieller Unversehrtheit umgedeutet.
translation_notes:
  register: Moderne, würdige Standardsprache mit sprichwortartiger Kürze. Die Anrede steht entsprechend dem griechischen Plural durchgehend in der vertrauten Mehrzahl („euch“). Die bewusst ungewöhnliche Wendung „Böses wird euch nicht finden“ erhält das Bild und die Bedeutungsweite des griechischen Textes.
