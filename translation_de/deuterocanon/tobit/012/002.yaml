    text: 'Wörtlich: „Ich werde nicht geschädigt, nachdem ich ihm die Hälfte von dem gegeben habe, was ich gebracht habe.“ Gemeint ist, dass Tobias keinen Verlust erleidet, wenn er dem Begleiter die Hälfte der zurückgebrachten Güter gibt.'
    reason: lexical_alternative
  revision_rationale: Der Haupttext kann unverändert bleiben. Allerdings enthält die Fußnote einen Futurfehler gegenüber dem griechischen Präsens und muss entsprechend berichtigt werden. Die Fußnote wird mit einer präsentischen Wiedergabe und einer vorsichtigen Erklärung der aoristischen Partizipialkonstruktion formuliert.
