  text: And he said[a], “Father[b], I lose nothing by giving him half of what I have brought back.”
translation:
  language: de
  text: 'Und er sagte: „Vater, ich erleide keinen Verlust, wenn ich ihm die Hälfte von dem gebe, was ich zurückgebracht habe.“[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Ich werde nicht geschädigt, nachdem ich ihm die Hälfte von dem gegeben habe, was ich gebracht habe.“ Gemeint ist, dass Tobias keinen Verlust erleidet, wenn er dem Begleiter die Hälfte der zurückgebrachten Güter gibt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάτερ
  choice: Vater
  rationale: Direkte Anrede an Tobit; das Deutsche verwendet hier natürlich die bloße Verwandtschaftsbezeichnung ohne Possessivpronomen.
- source_word: οὐ βλάπτομαι
  choice: ich erleide keinen Verlust
  rationale: Die Form bezeichnet hier, dass Tobias durch die Vergütung keinen Nachteil erleidet. Die Wiedergabe wahrt das Bild wirtschaftlichen Verlusts und bleibt näher am Griechischen als „ich verliere nichts“.
- source_word: δοὺς
  choice: wenn ich … gebe
  rationale: Das Aoristpartizip bezeichnet den begleitenden beziehungsweise bedingenden Umstand. Ein deutscher wenn-Satz gibt den im Zusammenhang beabsichtigten Vorschlag natürlich wieder, ohne eine bereits erfolgte Zahlung zu behaupten.
- source_word: αὐτῷ
  choice: ihm
  rationale: Dativobjekt, das sich auf Rafael beziehungsweise Asarja bezieht.
- source_word: τὸ ἥμυσυ
  choice: die Hälfte
  rationale: Natürliche deutsche Wiedergabe des substantivierten Neutrums mit bestimmtem Artikel.
- source_word: ὧν ἐνήνοχα
  choice: von dem, was ich zurückgebracht habe
  rationale: Das Perfekt bezeichnet eine abgeschlossene Handlung mit gegenwärtigem Ergebnis. „Zurückgebracht“ entspricht dem Reise- und Rückkehrzusammenhang; der indirekte semitische Paralleltext stützt die Herkunft „von dort“, ist aber kein eigenständiger alter hebräischer Textzeuge.
