review_pass:
  verdict: revise
  source_fidelity: 'Der Haupttext gibt καὶ εἶπεν, die Anrede Πάτερ, den wirtschaftlich verstandenen Nachteil in οὐ βλάπτομαι sowie die Hälfte der zurückgebrachten Dinge zutreffend wieder. Die konditionale deutsche Auflösung des Aoristpartizips ("wenn ich … gebe") ist im Kontext vertretbar, sollte aber nicht durch eine angeblich wörtliche, futurische Fußnotenübersetzung gestützt werden: βλάπτομαι steht im Präsens, nicht im Futur.'
  naturalness: Der Haupttext ist klares, modernes Standarddeutsch und dem würdevollen Erzählregister angemessen. „Keinen Verlust erleiden“ ist in diesem Zusammenhang idiomatisch.
  terminology: „Vater“ ist als direkte Anrede angemessen. „Die Hälfte“ und „zurückgebracht“ sind natürlich; Letzteres macht den narrativen Rückkehrkontext sichtbar, ohne eine theologische oder konfessionelle Deutung einzutragen.
  issues:
  - severity: medium
    issue: Die Fußnote gibt οὐ βλάπτομαι als „Ich werde nicht geschädigt“ wieder.
    rationale: Das griechische Verb steht im Präsens. Die futurische Form ist daher weder wörtlich noch eine genaue Erklärung der Verbform. Die Fußnote soll zudem die Partizipialkonstruktion erläutern, ohne eine zeitliche Festlegung als einzig mögliche Lesart auszugeben.
  revised_text: 'Und er sagte: „Vater, ich erleide keinen Verlust, wenn ich ihm die Hälfte von dem gebe, was ich zurückgebracht habe.“[a]'
  revised_footnotes:
