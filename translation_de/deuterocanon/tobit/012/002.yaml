translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wirtschaftliche Bedeutung von βλάπτομαι wird ausdrücklich, aber nicht umgangssprachlich wiedergegeben. Die syntaktische Spannung des griechischen Aoristpartizips wird als noch ausstehende, erwogene Gabe formuliert; die wörtlichere Struktur bleibt in der Fußnote sichtbar.
