  source_fidelity: Der Zusatz „mein“ in der Anrede ist im Deutschen zwar idiomatisch, steht jedoch nicht im griechischen τέκνον. Da der griechische Wortlaut ausdrücklich die weniger spezifische Anrede „Kind“ verwendet, sollte der Zusatz vermieden werden. Die übrigen Formulierungen geben den Sinn des Griechischen zuverlässig wieder, einschließlich der unpersönlichen Notwendigkeit in δεῖ und der zusätzlichen Vergütung in προσθεῖναι.
  naturalness: „Sieh, Kind“ ist als direkte, würdige Anrede in einem erzählerisch-biblischen Register verständlich und näher am Ausgangstext als „Sieh, mein Kind“. „Der dich begleitet hat“ sowie „man muss ihm noch etwas dazugeben“ sind modernes, gut lesbares Standarddeutsch.
  terminology: „Lohn“ gibt μισθός im Kontext geschuldeter Vergütung angemessen wieder. „Mann“ entspricht ἀνήρ/ἄνθρωπος hier als männlicher Bezugsperson, und „Kind“ wahrt die bewusst allgemeinere griechische Anrede gegenüber „Sohn“. Die Fußnote soll die abweichende semitische Lesart präzise als „Überlieferung“ bezeichnen, ohne sie zur Grundlage des Haupttexts zu machen.
