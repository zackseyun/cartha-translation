base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/012/001.yaml
  text: Then Tobit called Tobias his son and said to him[a], “See, child, wages must be given to the man who went with you, and more must be added for him.”
translation:
  language: de
  text: 'Dann rief Tobit seinen Sohn Tobias zu sich und sagte zu ihm: „Sieh, Kind[a]: Dem Mann, der dich begleitet hat, muss sein Lohn gegeben werden, und man muss ihm noch etwas dazugeben.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Griechisch: „Kind“; die parallele semitische Überlieferung lautet „mein Sohn“. Der Haupttext folgt der griechischen Anrede und bewahrt zugleich den familiären Klang im Kontext.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκάλεσεν
  choice: rief … zu sich
  rationale: Gibt den üblichen erzählerischen Sinn wieder, dass Tobit seinen Sohn zu sich ruft, und klingt im modernen Deutschen natürlich.
- source_word: Ὅρα
  choice: Sieh
  rationale: Bewahrt die direkte Aufforderung des griechischen Imperativs, ohne sie erklärend zu erweitern.
- source_word: τέκνον
  choice: mein Kind
  rationale: Das griechische Wort bedeutet wörtlich „Kind“ und dient hier als liebevolle Anrede. Das possessive „mein“ ist im Deutschen idiomatisch und macht die im Kontext klare familiäre Beziehung deutlich, ohne „Kind“ durch das spezifischere „Sohn“ zu ersetzen.
- source_word: μισθὸν
  choice: Lohn
  rationale: Bezeichnet die geschuldete Vergütung für den geleisteten Begleitdienst; „Lohn“ ist präzise und im Deutschen gut verständlich.
- source_word: τῷ ἀνθρώπῳ
  choice: dem Mann
  rationale: Entspricht dem maskulinen Singular und dem konkreten männlichen Begleiter.
- source_word: τῷ συνελθόντι σοι
  choice: der dich begleitet hat
  rationale: Gibt den Sinn von „der mit dir gegangen ist“ in natürlichem modernem Deutsch wieder.
- source_word: προσθεῖναι αὐτῷ δεῖ
  choice: man muss ihm noch etwas dazugeben
  rationale: Bewahrt die unpersönlich ausgedrückte Notwendigkeit von δεῖ und macht deutlich, dass über den eigentlichen Lohn hinaus eine zusätzliche Gabe gemeint ist.
