  text: And now give thanks to God[a], because I am ascending to the one who sent me; and write all that has been accomplished in a book.
translation:
  language: de
  text: Und nun dankt Gott[a], denn ich steige hinauf zu dem, der mich gesandt hat. Schreibt alles, was geschehen ist, in ein Buch.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „preist Gott“; das griechische Verb kann auch ein anerkennendes Bekenntnis zu Gott bezeichnen, das sich in Dank oder Lob ausdrückt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξομολογεῖσθε
  choice: dankt
  rationale: Mit dem Dativ Gottes bezeichnet das Verb im hellenistisch-jüdischen Sprachgebrauch häufig die anerkennende Hinwendung zu Gott in Dank oder Lob. „Dankt Gott“ ist hier natürlich und kontextgerecht; die Bedeutungsbreite wird in der Fußnote bewahrt.
- source_word: ἀναβαίνω
  choice: ich steige hinauf
  rationale: Die Wiedergabe erhält sowohl das Präsens mit unmittelbar bevorstehender Handlung als auch die im Verb ausgedrückte Aufwärtsbewegung, ohne deutend „ich kehre zurück“ zu ergänzen.
- source_word: τὸν ἀποστείλαντά με
  choice: dem, der mich gesandt hat
  rationale: Der substantivierte Partizipialausdruck wird im Deutschen natürlich als Relativsatz wiedergegeben. Der Sender wird nicht ausdrücklich identifiziert, da auch der griechische Teilsatz dies nicht tut.
- source_word: γράψατε
  choice: Schreibt
  rationale: Der Imperativ Plural wird direkt und idiomatisch wiedergegeben.
- source_word: πάντα τὰ συντελεσθέντα
  choice: alles, was geschehen ist
  rationale: Die Form bezeichnet die Gesamtheit der zum Abschluss gekommenen Ereignisse. „Was geschehen ist“ ist natürliches modernes Deutsch und vermeidet die im Kontext schwerfällige Formulierung „was vollbracht worden ist“.
- source_word: εἰς βιβλίον
  choice: in ein Buch
  rationale: Die Wendung bezeichnet das schriftliche Festhalten in einem Dokument. „Buch“ ist zugänglich und wird von βιβλίον verlangt, ohne die mögliche materielle Form als Schriftrolle festzulegen.
theological_decisions:
- issue: Raphaels Hinaufsteigen zu dem, der ihn gesandt hat
  choice: Als Hinaufsteigen zu seinem Sender wiedergeben, ohne den Sender im zweiten Satzteil ausdrücklich als Gott zu benennen.
  alternative: „Ich kehre zu Gott zurück, der mich gesandt hat.“
  rationale: Der Zusammenhang legt den göttlichen Sender nahe, doch der griechische Text bewahrt in diesem Teilsatz die Umschreibung. „Hinaufsteigen“ erhält zudem die räumliche und himmlische Implikation, ohne die Angelologie auszuweiten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Wechsel vom durch Semikolon verbundenen griechischen Satz zu zwei deutschen Sätzen verbessert die Lesbarkeit, ohne die Gedankenfolge zu verändern. „Dankt Gott“ ist knapp und allgemein verständlich; die echte lexikalische Mehrdeutigkeit wird durch Fußnote [a] offengelegt.
