lexical_decisions:
- source_word: ἀπέθανεν
  choice: starb
  rationale: Das griechische Verb bezeichnet direkt den Tod; „starb“ ist die schlichte, präzise und nicht euphemistische Wiedergabe.
- source_word: ἐτῶν ἑκατὸν ἑπτὰ
  choice: im Alter von 107 Jahren
  rationale: Der Genitiv bezeichnet das Lebensalter beim Tod. Diese Formulierung ist im modernen Standarddeutsch natürlich und würdevoll.
- source_word: ἐν Ἐκβατάνοις
  choice: in Ekbatana
  rationale: ἐν bezeichnet hier den Ort. „Ekbatana“ ist die gebräuchliche deutsche Namensform der antiken Stadt.
- source_word: τῆς Μηδείας
  choice: in Medien
  rationale: Der Genitiv bestimmt Ekbatana geografisch näher. Im Deutschen gibt „in Medien“ die gemeinte Lage klarer und natürlicher wieder als das schwerfällige „Ekbatana Mediens“.
