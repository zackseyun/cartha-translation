base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/014/009.yaml
  text: But you, keep the law and the commandments, and become merciful and righteous, so that it may go well with you.
translation:
  language: de
  text: Du aber halte dich an das Gesetz und die Gebote. Werde barmherzig und gerecht, damit es dir gut geht.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τήρησον
  choice: halte dich an
  rationale: Gibt den gebotenen Sinn von »bewahren, beachten, befolgen« in natürlichem modernem Deutsch wieder.
- source_word: τὸν νόμον καὶ τὰ προστάγματα
  choice: das Gesetz und die Gebote
  rationale: Bewahrt die Unterscheidung zwischen dem Gesetz und den einzelnen verbindlichen Anordnungen; »Gebote« ist hier klar und idiomatisch.
- source_word: γενοῦ
  choice: Werde
  rationale: Gibt den ausdrücklichen Aufforderungscharakter und den Entwicklungsgedanken des griechischen Aoristimperativs wieder, statt ihn zu »sei« abzuschwächen.
- source_word: φιλελεήμων
  choice: barmherzig
  rationale: Bezeichnet eine Haltung, die von Erbarmen und tätiger Zuwendung geprägt ist; »barmherzig« ist verständlich und würdevoll.
- source_word: δίκαιος
  choice: gerecht
  rationale: Entspricht dem ethisch-religiösen Sinn des griechischen Begriffs, ohne ihn enger auszulegen.
- source_word: ἵνα σοι καλῶς ἦν
  choice: damit es dir gut geht
  rationale: Natürliches Deutsch für die finale Wendung; lässt offen, worin das Wohlergehen konkret besteht.
theological_decisions:
- issue: Verhältnis von Gehorsam, Barmherzigkeit und Wohlergehen
  choice: Die finale Verknüpfung »damit es dir gut geht« wird unmittelbar beibehalten.
  alternative: Eine abschwächende Wiedergabe wie »und dann wird es dir gut gehen« oder eine erklärende geistliche Deutung.
  rationale: Der griechische Text stellt eine Ziel- beziehungsweise Folgebeziehung her. Die Übersetzung bewahrt diese Spannung, ohne daraus eine umfassende Vergeltungslehre abzuleiten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die zwei Aufforderungssätze vermeiden eine schwerfällige Reihung und erhalten zugleich die nachdrückliche persönliche Anrede »Du aber«.
