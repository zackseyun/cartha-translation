source:
  edition: lxx-swete-1909
  text: καὶ εὐλογήσουσιν πάντα τὰ ἔθνη Κύριον. καὶ ὁ λαὸς αὐτοῦ ἐξομολογήσεται τῷ θεῷ, καὶ ὑψώσει Κύριος τὸν λαὸν αὐτοῦ· καὶ χαρήσονται πάντες οἱ ἀγαπῶντες Κύριον τὸν θεὸν ἐν ἀληθείᾳ καὶ δικαιοσύνῃ, ποιοῦντες ἔλεος τοῖς ἀδελφοῖς ἡμῶν.
  language: Greek
  pages: []
  confidence: high
base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/014/007.yaml
  text: And all the nations will bless the Lord[a]. And his people will give thanks to God, and the Lord will exalt his people; and all who love the Lord God in truth and righteousness will rejoice[c][b], showing mercy to our brothers.
translation:
  language: de
  text: Und alle Völker werden den Herrn preisen. Sein Volk wird Gott danken[a], und der Herr wird sein Volk erhöhen. Alle, die den Herrn, ihren Gott, in Wahrheit und Gerechtigkeit[b] lieben, werden sich freuen und unseren Brüdern[c] Barmherzigkeit erweisen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Verb kann je nach Zusammenhang auch „bekennen“ oder „preisen“ bedeuten.
    reason: lexical_alternative
  - marker: b
    text: „Gerechtigkeit“ kann hier auch im Sinn von „Rechtschaffenheit“ verstanden werden.
    reason: lexical_alternative
  - marker: c
    text: Wörtlich „unseren Brüdern“; der Ausdruck kann auch Angehörige der eigenen Verwandtschaft oder Gemeinschaft insgesamt bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλογήσουσιν
  choice: werden … preisen
  rationale: Wenn Menschen Gott zum Gegenstand von εὐλογέω machen, bezeichnet das Verb ein lobendes Segnen. „Preisen“ ist im heutigen Deutschen natürlicher als „segnen“, ohne den gottesdienstlichen Sinn abzuschwächen.
- source_word: πάντα τὰ ἔθνη
  choice: alle Völker
  rationale: Die Wiedergabe wahrt den universalen Umfang und vermeidet, ἔθνη vorschnell auf „Heiden“ einzuengen.
- source_word: ἐξομολογήσεται
  choice: wird … danken
  rationale: Im Zusammenhang paralleler Gottesverehrung ist „danken“ die naheliegende Bedeutung; die ebenfalls möglichen Bedeutungen „bekennen“ und „preisen“ bleiben in einer Fußnote sichtbar.
- source_word: ὑψώσει
  choice: wird … erhöhen
  rationale: „Erhöhen“ bewahrt sowohl das Bild des Emporhebens als auch den Sinn, dem Volk Ehre und Ansehen zu verleihen.
- source_word: ἐν ἀληθείᾳ καὶ δικαιοσύνῃ
  choice: in Wahrheit und Gerechtigkeit
  rationale: Die formnahe Wendung erhält die Offenheit, ob Wahrheit und Gerechtigkeit die Haltung, den Lebensvollzug oder den Bereich der Gottesliebe näher bestimmen.
- source_word: ποιοῦντες ἔλεος
  choice: Barmherzigkeit erweisen
  rationale: Die idiomatische deutsche Wendung gibt den semitisch geprägten Ausdruck „Barmherzigkeit tun“ natürlich und sachgetreu wieder.
- source_word: τοῖς ἀδελφοῖς ἡμῶν
  choice: unseren Brüdern
  rationale: Die Übersetzung bildet den ausdrücklich maskulinen Plural ab; eine Fußnote weist auf seine mögliche repräsentative Verwendung für Angehörige der eigenen Gemeinschaft hin.
theological_decisions:
- issue: Wiedergabe von Κύριος
  choice: Herr
  alternative: der HERR
  rationale: „Herr“ entspricht dem griechischen Wortlaut, ohne durch eine besondere Schreibweise eine nicht ausdrücklich markierte Rückübersetzung einzuführen.
- issue: Wiedergabe von δικαιοσύνη
  choice: Gerechtigkeit
  alternative: Rechtschaffenheit
  rationale: „Gerechtigkeit“ hält die theologische und ethische Bedeutungsbreite des griechischen Begriffs offen; „Rechtschaffenheit“ würde ihn stärker auf persönliche Tugend beschränken.
- issue: Bezug von θεὸν in Κύριον τὸν θεὸν
  choice: den Herrn, ihren Gott
  alternative: den Herrn Gott
  rationale: Der griechische Artikel erlaubt, τὸν θεόν appositionell zu verstehen. „Den Herrn, ihren Gott“ ist im Deutschen natürlich und bewahrt diese Beziehung, ohne zwei verschiedene Bezugsgrößen anzunehmen.
- issue: Repräsentative Reichweite von ἀδελφοῖς
  choice: Brüdern
  alternative: Brüdern und Schwestern
  rationale: Der Haupttext wahrt die grammatische Form des Ausgangstextes; die mögliche umfassendere gemeinschaftliche Bedeutung wird nicht ausgeschlossen, sondern in der Fußnote benannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Satzführung. Die Wiederholungen „Herr“, „Gott“ und „Volk“ bleiben als prägende Elemente des griechischen Textes erhalten. Das Partizip ποιοῦντες wird mit „und … erweisen“ an dieselbe Personengruppe wie „werden sich freuen“ angeschlossen.
