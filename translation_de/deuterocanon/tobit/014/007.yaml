  source_fidelity: 'Die Übersetzung bildet die Abfolge und die zentralen Aussagen des griechischen Textes zuverlässig ab: alle Völker preisen den Herrn; sein Volk dankt Gott; der Herr erhöht sein Volk; die den Herrn, ihren Gott, in Wahrheit und Gerechtigkeit lieben, freuen sich und erweisen den Brüdern Barmherzigkeit. „Preisen“ ist für εὐλογέω bei Gott als Objekt eine idiomatische und sinngetreue deutsche Wiedergabe. Das abschließende Partizip ποιοῦντες ist angemessen an die Gruppe der Liebenden angeschlossen.'
