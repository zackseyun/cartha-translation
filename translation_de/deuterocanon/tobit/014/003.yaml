base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/014/003.yaml
  text: He had grown very old[a]; and he called his son and his grandsons, and said to him, “Child, take your sons. Look, I have grown old[b], and I am about to depart from life.”
translation:
  language: de
  text: 'Er war sehr alt geworden. Er rief seinen Sohn und dessen Söhne[a] und sagte zu ihm: »Mein Kind, nimm deine Söhne. Sieh, ich bin alt geworden und stehe kurz davor, aus dem Leben zu scheiden[b].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »seinen Sohn und seine Söhne«. Im Zusammenhang sind mit den Söhnen wahrscheinlich die Söhne seines Sohnes, also seine Enkel, gemeint.'
    reason: Der formale griechische Wortlaut und die kontextuelle Deutung werden voneinander unterschieden.
  - marker: b
    text: 'Das Griechische sagt ungewöhnlich und bildhaft etwa: »Ich bin dem Weglaufen aus dem Leben nahe«; gemeint ist, dass sein Tod unmittelbar bevorsteht.'
    reason: Die idiomatisch geglättete Todesumschreibung wird transparent gemacht.
lexical_decisions:
- source_word: μεγάλως δὲ ἐγήρασεν
  choice: Er war sehr alt geworden
  rationale: μεγάλως verstärkt hier das Altern; das Plusquamperfekt gibt im deutschen Erzählzusammenhang den erreichten Zustand natürlich wieder. δέ wird durch die Satzfügung getragen und nicht eigens mit einem unmotivierten »nun« übersetzt.
- source_word: τὸν υἱὸν αὐτοῦ καὶ τοὺς υἱοὺς αὐτοῦ
  choice: seinen Sohn und dessen Söhne
  rationale: Die Wiederholung von αὐτοῦ bezieht sich am natürlichsten auf den unmittelbar genannten Sohn. »Dessen Söhne« bewahrt die griechische Verwandtschaftsformulierung und macht deutlich, dass Tobits Enkel gemeint sind.
- source_word: Τέκνον
  choice: Mein Kind
  rationale: τέκνον ist eine warme, familiäre Anrede. Das im Deutschen idiomatische »Mein Kind« gibt diese Zuneigung wieder, ohne über die im Kontext klare Sohnesbeziehung hinaus eine Lehrentscheidung einzutragen.
- source_word: λάβε τοὺς υἱούς σου
  choice: nimm deine Söhne
  rationale: Die schlichte Imperativform »nimm« bleibt nahe bei λάβε; eine genauere Zielrichtung wie »versammle« oder »bring mit« legt der Satz nicht ausdrücklich fest.
- source_word: ἰδοὺ γεγήρακα
  choice: Sieh, ich bin alt geworden
  rationale: »Sieh« erhält den aufmerksamkeitslenkenden, feierlichen Ton von ἰδού. Das Perfekt »bin alt geworden« bezeichnet den gegenwärtigen Zustand als Ergebnis des Alterns.
- source_word: πρὸς τὸ ἀποτρέχειν ἐκ τοῦ ζῇν εἰμί
  choice: ich stehe kurz davor, aus dem Leben zu scheiden
  rationale: Die ungewöhnliche Umschreibung bezeichnet den nahen Tod. »Stehe kurz davor« gibt die Nähe wieder; »aus dem Leben scheiden« erhält den euphemistischen Ton, ohne die Wendung unverständlich wörtlich als »vom Leben weglaufen« abzubilden.
theological_decisions:
- issue: Euphemistische Bezeichnung des bevorstehenden Todes
  choice: aus dem Leben zu scheiden
  alternative: zu sterben
  rationale: Der griechische Text verwendet nicht das schlichte Verb »sterben«, sondern eine bildhafte Umschreibung. Die Übersetzung bewahrt diese Zurückhaltung und löst keine darüber hinausgehende Aussage über Tod oder Jenseits ein.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede bleibt feierlich, aber vermeidet Archaismen wie »siehe« oder »verschieden«. Die Satzstruktur folgt dem griechischen Ablauf, wird jedoch idiomatisch deutsch formuliert.
