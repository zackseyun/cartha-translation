base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/014/004.yaml
  text: 'Go to Media[a], my child, because I am convinced that what Jonah the prophet spoke concerning Nineveh will happen: it will be overthrown. But in Media there will be peace for a while. And our brothers will be scattered from the good land, and Jerusalem will be desolate, and the house of God in it will be burned down[b], and it will be desolate until a time.'
translation:
  language: de
  text: 'Geh nach Medien, mein Kind, denn ich bin überzeugt, dass eintreffen wird, was der Prophet Jona über Ninive gesagt hat: Es wird zerstört werden. In Medien aber wird eine Zeit lang mehr Frieden herrschen.[a] Unsere Brüder werden aus dem guten Land zerstreut werden, Jerusalem wird verwüstet sein, und das Haus Gottes darin wird niedergebrannt werden.[b] Jerusalem wird eine Zeit lang verwüstet bleiben.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort für „mehr“ kann einen relativen Frieden oder eine relative Sicherheit in Medien ausdrücken, nicht notwendig uneingeschränkten Frieden.
    reason: lexical_alternative
  - marker: b
    text: Mit dem „Haus Gottes“ ist der Tempel in Jerusalem gemeint.
    reason: referent_clarification
lexical_decisions:
- source_word: ἄπελθε εἰς τὴν Μηδείαν
  choice: Geh nach Medien
  rationale: Der Aoristimperativ wird mit dem natürlichen deutschen Richtungsverb „geh“ wiedergegeben; „Medien“ ist die übliche deutsche Bezeichnung der antiken Landschaft.
- source_word: τέκνον
  choice: mein Kind
  rationale: Die liebevolle Anrede wird idiomatisch wiedergegeben. Das Possessivpronomen ist im Deutschen natürlich, ohne das Geschlecht des Kindes über den griechischen Ausdruck hinaus festzulegen.
- source_word: πέπεισμαι
  choice: ich bin überzeugt
  rationale: Das Perfekt bezeichnet eine gefestigte, gegenwärtige Überzeugung.
- source_word: ὅσα ἐλάλησεν ... ὅτι καταστραφήσεται
  choice: 'dass eintreffen wird, was ... gesagt hat: Es wird zerstört werden'
  rationale: Die Formulierung macht den syntaktischen Bezug zwischen Tobits Überzeugung und dem Inhalt der Prophezeiung verständlich, ohne deren Aussage zu erweitern.
- source_word: ἔσται εἰρήνη μᾶλλον ἕως καιροῦ
  choice: bis zu einer bestimmten Zeit eher Frieden herrschen
  rationale: „Eher“ bewahrt das echte Vergleichsmoment von μᾶλλον und deutet relative Sicherheit an. „Bis zu einer bestimmten Zeit“ erhält die zeitliche Begrenzung von ἕως καιροῦ, ohne einen ausdrücklich göttlich festgesetzten Termin zu behaupten.
- source_word: οἱ ἀδελφοὶ ἡμῶν
  choice: unsere Brüder
  rationale: Die männliche Pluralform wird formal bewahrt; im Zusammenhang bezeichnet sie die israelitischen Volksgenossen.
- source_word: ἀπὸ τῆς ἀγαθῆς γῆς
  choice: aus dem guten Land
  rationale: Die wörtliche Wiedergabe erhält den biblischen Anklang der Güte des Landes.
- source_word: ἔρημος
  choice: verwüstet
  rationale: Im Zusammenhang von Stadt und Tempel bezeichnet das Wort einen Zustand der Verödung beziehungsweise Verwüstung, nicht notwendig eine buchstäbliche Wüste.
- source_word: ὁ οἶκος τοῦ θεοῦ
  choice: das Haus Gottes
  rationale: Die Quellmetapher bleibt im Haupttext erhalten; eine Fußnote erläutert den Bezug auf den Jerusalemer Tempel.
theological_decisions:
- issue: Verhältnis von Tobits Überzeugung zur Prophezeiung Jonas
  choice: Die Prophezeiung wird als künftig eintreffend formuliert.
  alternative: „Ich bin von allem überzeugt, was der Prophet Jona über Ninive gesagt hat, dass es zerstört werden wird.“
  rationale: Die gewählte Fassung klärt die griechische Satzfügung, ohne eine Aussage über den Mechanismus oder die theologische Bedingtheit prophetischer Erfüllung hinzuzufügen.
- issue: Vergleichsmoment bei μᾶλλον
  choice: „eher Frieden“
  alternative: „Frieden für eine Weile“
  rationale: Die formal nähere Wiedergabe bewahrt, dass Medien nur vergleichsweise friedlicher oder sicherer sein kann; sie macht aus der Aussage keine Zusage absoluten Friedens.
- issue: Referenz des abschließenden ἔρημος ἔσται
  choice: „Es“ bezieht sich am natürlichsten auf Jerusalem.
  alternative: Bezug auf das Haus Gottes beziehungsweise den gesamten zuvor beschriebenen Zustand
  rationale: Das grammatische Femininum passt zu Jerusalem; die deutsche Pronomenform lässt zugleich die im Griechischen bestehende Nähe zum vorausgehenden Tempelsatz sichtbar, ohne sie dogmatisch auszuwerten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit prophetischem Ernst. Die Satzfolge bleibt nahe am Griechischen, wird aber durch klare deutsche Haupt- und Nebensätze lesbar gemacht. Das Vergleichsmoment von μᾶλλον und die begrenzte Dauer von καιρός werden bewusst nicht eingeebnet.
