    rationale: „Eher“ wird im heutigen Deutsch leicht epistemisch verstanden („vermutlich/wohl eher“) und bildet daher das griechische komparative μᾶλλον nicht eindeutig ab. „mehr Frieden“ erhält den relativen Charakter, dessen Vergleichsgröße im Text unausgesprochen bleibt.
  - severity: medium
    issue: Unklarer Bezug von „Es wird ... verwüstet sein“
    rationale: Das deutsche Neutrum kann sich nach dem unmittelbar vorausgehenden „das Haus Gottes“ auf den Tempel beziehen. Die feminine griechische Form ἔρημος weist dagegen auf Jerusalem; die Wiederholung des Ortsnamens verhindert eine sachlich relevante Verschiebung.
  - severity: low
    issue: „bis zu einer bestimmten Zeit“
    rationale: „Bestimmten“ präzisiert καιρός unnötig. „Eine Zeit lang“ gibt die zeitliche Begrenzung idiomatisch wieder, ohne einen näher bestimmten oder festgesetzten Zeitpunkt nahezulegen.
