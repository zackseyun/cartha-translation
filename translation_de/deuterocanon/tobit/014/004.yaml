  verdict: revise
  source_fidelity: 'Die Übersetzung gibt Imperativ, liebevolle Anrede, feste Überzeugung, die Zukunft der Ninive-Prophezeiung, Zerstreuung, Verwüstung Jerusalems und Verbrennung des Tempels insgesamt zuverlässig wieder. Das Vergleichselement μᾶλλον sollte jedoch im Deutschen nicht mit „eher Frieden“ wiedergegeben werden: Diese Formulierung kann idiomatisch bedeuten, dass Frieden bloß wahrscheinlicher sei, statt einen relativen Mehrgrad an Frieden bzw. Sicherheit auszudrücken. Die abschließende feminine Prädikation ἔρημος ἔσται bezieht sich im griechischen Satzbau auf Jerusalem; die deutsche Fassung sollte dies ausdrücklich machen, statt durch das nahe stehende Neutrum „Haus“ einen missverständlichen Bezug zu erzeugen.'
  naturalness: „Mehr Frieden herrschen“ ist modernes, klares Standarddeutsch und bewahrt die implizite Vergleichsrelation. „Eine Zeit lang“ gibt die begrenzte Dauer von ἕως καιροῦ natürlich wieder, ohne „bestimmt“ als zusätzliche Präzisierung einzutragen. Die Wiederaufnahme von „Jerusalem“ im letzten Satzteil macht den Bezug verständlich und flüssig.
  terminology: „Medien“, „Jona“, „Ninive“, „unsere Brüder“, „das gute Land“ und „Haus Gottes“ sind angemessen. Die Tempelerläuterung in Fußnote b ist sachlich und nicht auslegungsüberladen.
  issues:
