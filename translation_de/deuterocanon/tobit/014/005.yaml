base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/014/005.yaml
  text: And God will again have mercy on them and bring them back to the land[a], and they will build the house, though not like the former one, until the times of the age are fulfilled. And after these things they will return from the captivities and build Jerusalem honorably, and the house of God in her will be built gloriously[c][b], just as the prophets spoke concerning her.
translation:
  language: de
  text: Und Gott wird sich ihrer wieder erbarmen und sie in das Land zurückbringen. Dann werden sie das Haus bauen, doch nicht so wie das frühere, bis die Zeiten des Zeitalters erfüllt sind.[a] Danach werden sie aus den Gefangenschaften zurückkehren[b] und Jerusalem in Ehren aufbauen. Und das Haus Gottes in ihr wird herrlich erbaut werden,[c] wie die Propheten über sie gesprochen haben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Die Zeiten des Zeitalters“ ist eine bewusst offen gehaltene Wendung. Sie kann festgesetzte Zeiten bezeichnen, die zu Gottes umfassenderer Wiederherstellung führen.
    reason: lexical_alternative
  - marker: b
    text: Das Griechische hat den Plural „aus den Gefangenschaften“; gemeint sein können mehrere Orte oder Zeiten der Verbannung.
    reason: lexical_alternative
  - marker: c
    text: 'Jerusalem wird im Griechischen mit femininen Pronomen bezeichnet: „in ihr“ und „über sie“.'
    reason: cultural_note
lexical_decisions:
- source_word: πάλιν ἐλεήσει αὐτοὺς ὁ θεός
  choice: Gott wird sich ihrer wieder erbarmen
  rationale: „Sich erbarmen“ gibt ἐλεέω in natürlichem, würdigem Deutsch wieder; „wieder“ bewahrt πάλιν als erneutes göttliches Handeln.
- source_word: ἐπιστρέψει αὐτοὺς εἰς τὴν γῆν
  choice: sie in das Land zurückbringen
  rationale: Die transitive Konstruktion bezeichnet Gottes Herbeiführung der Rückkehr. Der bestimmte Artikel wird ohne ergänztes Possessivpronomen bewahrt.
- source_word: οἰκοδομήσουσιν τὸν οἶκον
  choice: sie werden das Haus bauen
  rationale: „Haus“ hält die biblische Ausdrucksweise fest; der spätere Ausdruck „Haus Gottes“ verdeutlicht den Bezug auf den Tempel.
- source_word: οὐχ οἷος ὁ πρότερος
  choice: doch nicht wie das frühere
  rationale: Die Formulierung lässt offen, ob vor allem Verschiedenheit oder geringere Herrlichkeit gemeint ist.
- source_word: ἕως πληρωθῶσιν καιροὶ τοῦ αἰῶνος
  choice: bis die Zeiten des Zeitalters erfüllt sind
  rationale: Die bewusst formale Wiedergabe erhält die zeitliche und eschatologische Offenheit von καιροί und αἰών.
- source_word: ἐκ τῶν αἰχμαλωσιῶν
  choice: aus den Gefangenschaften
  rationale: Der ungewöhnliche Plural des Griechischen bleibt sichtbar und kann mehrere Gefangenschaften oder Verbannungsorte bezeichnen.
- source_word: οἰκοδομήσουσιν Ἰερουσαλὴμ ἐντίμως
  choice: Jerusalem in Ehren aufbauen
  rationale: „In Ehren“ gibt ἐντίμως würdig und verständlich wieder, ohne es allein auf architektonische Pracht zu verengen.
- source_word: ἐν αὐτῇ
  choice: in ihr
  rationale: Das feminine Pronomen bezieht sich auf Jerusalem und bewahrt die im Griechischen naheliegende Darstellung der Stadt als weiblich.
- source_word: οἰκοδομηθήσεται ἐνδόξως
  choice: wird in Herrlichkeit gebaut werden
  rationale: „In Herrlichkeit“ erhält den Anklang an δόξα deutlicher als eine rein ästhetische Wiedergabe wie „prächtig“.
- source_word: καθὼς ἐλάλησαν περὶ αὐτῆς οἱ προφῆται
  choice: wie die Propheten über sie gesprochen haben
  rationale: Die Wendung wahrt den ausdrücklichen Bezug auf die prophetische Rede und das feminine Pronomen für Jerusalem.
theological_decisions:
- issue: Zeitangabe καιροὶ τοῦ αἰῶνος
  choice: bis die Zeiten des Zeitalters erfüllt sind
  alternative: bis die festgesetzten Zeiten erfüllt sind
  rationale: Der griechische Ausdruck ist eschatologisch deutbar, legt aber kein bestimmtes Endzeitschema fest. Die Übersetzung bewahrt diese Spannung.
- issue: Bedeutung von „das Haus“
  choice: das Haus
  alternative: der Tempel
  rationale: Der Tempel ist sachlich gemeint, doch die Ausgangsformulierung verwendet zunächst den biblischen Ausdruck „das Haus“, der anschließend durch „das Haus Gottes“ erläutert wird.
- issue: Personifizierung Jerusalems
  choice: in ihr / über sie
  alternative: darin / darüber
  rationale: Die femininen Pronomen des Griechischen werden beibehalten, sodass die Bildsprache Jerusalems nicht neutralisiert wird.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit biblischem Klang. Ungewöhnliche, aber bedeutungstragende Ausdrücke wie „Haus“, „Zeiten des Zeitalters“ und der Plural „Gefangenschaften“ bleiben erhalten und werden nötigenfalls durch Fußnoten erläutert.
