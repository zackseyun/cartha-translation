base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/014/013.yaml
  text: And he grew old honorably[a], and he buried his parents-in-law with honor, and he inherited their property and that of Tobit his father.
translation:
  language: de
  text: Und er wurde in Ehren alt, und er bestattete seine Schwiegereltern ehrenvoll[a], und er erbte ihren Besitz sowie den seines Vaters Tobit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „prächtig“. Das griechische Wort kann auch „ruhmvoll“ oder „glanzvoll“ bedeuten; im Zusammenhang ist wahrscheinlich eine ehrenvolle Bestattung gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγήρασεν
  choice: wurde … alt
  rationale: Der Aorist von γηράσκω bezeichnet das Altwerden beziehungsweise das Erreichen hohen Alters. „Wurde alt“ gibt den verbalen Vorgang natürlich wieder.
- source_word: ἐντίμως
  choice: in Ehren
  rationale: Das Adverb bezeichnet ein ehrenvolles oder angesehenes Altwerden. „In Ehren“ ist im Deutschen idiomatisch und bewahrt den gesellschaftlich-moralischen Sinn.
- source_word: ἔθαψεν
  choice: bestattete
  rationale: Das Verb bedeutet schlicht „begrub/bestattete“. „Bestattete“ ist gegenwärtiges, würdevolles Standarddeutsch, ohne den Sinn abzuschwächen.
- source_word: τοὺς πενθεροὺς αὐτοῦ
  choice: seine Schwiegereltern
  rationale: Der Plural bezeichnet die Eltern des Ehepartners. „Schwiegereltern“ ist die klare und natürliche deutsche Entsprechung.
- source_word: ἐνδόξως
  choice: ehrenvoll
  rationale: Das Adverb kann „ruhmvoll“, „prächtig“ oder „ehrenvoll“ bedeuten. Im Zusammenhang einer Bestattung bezeichnet es am ehesten eine ehrenvolle Beisetzung; die mögliche Nuance einer prächtigen Ausgestaltung wird in der Fußnote erhalten.
- source_word: ἐκληρονόμησεν
  choice: erbte
  rationale: Das Verb bezeichnet ausdrücklich den Erwerb durch Erbschaft. „Erbte“ ist knapp und genau.
- source_word: τὴν οὐσίαν αὐτῶν
  choice: ihren Besitz
  rationale: οὐσία bezeichnet hier Besitz oder Vermögen. „Besitz“ ist umfassend, verständlich und weniger fachsprachlich als „Nachlass“.
- source_word: καὶ Τωβεὶτ τοῦ πατρὸς αὐτοῦ
  choice: sowie den seines Vaters Tobit
  rationale: Der Ausdruck fügt den Besitz Tobits, seines Vaters, als weiteres Erbe hinzu. Das Pronomen „den“ nimmt „Besitz“ auf und vermeidet eine schwerfällige Wiederholung.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die dreifache Reihung mit „und“ folgt dem schlichten Erzählrhythmus des griechischen Textes. „In Ehren“ und „ehrenvoll“ halten die beiden verwandten, aber nicht identischen griechischen Adverbien unterscheidbar.
