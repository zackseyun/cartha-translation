  text: Und Tobit hörte auf, Dank zu sagen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zu bekennen“. Das griechische Wort kann auch „bekennen“ bedeuten; im Zusammenhang ist hier wahrscheinlich Lob oder Dank gemeint.'
