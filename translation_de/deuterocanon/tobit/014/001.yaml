lexical_decisions:
- source_word: ἐπαύσατο
  choice: hörte auf
  rationale: Der Aorist Medium von παύω bezeichnet hier das Beenden einer fortdauernden Handlung. „Hörte auf“ ist im heutigen Deutsch natürlich und gibt die Konstruktion mit dem begleitenden Partizip klar wieder.
- source_word: ἐξομολογούμενος
  choice: Gott zu preisen
  rationale: ἐξομολογέομαι kann je nach Zusammenhang „bekennen“, „danken“ oder „preisen“ bedeuten. Hier beendet Tobit eine vorausgehende Lob- und Segensrede; deshalb passt „Gott preisen“ am besten. Das ergänzte „Gott“ macht das im kultischen Sprachgebrauch vorausgesetzte Gegenüber im Deutschen natürlich verständlich.
- source_word: Τωβείτ
  choice: Tobit
  rationale: „Tobit“ ist die im Deutschen etablierte Namensform.
theological_decisions:
- issue: Bedeutung von ἐξομολογούμενος im Gebets- und Lobpreiskontext
  choice: Gott zu preisen
  alternative: zu bekennen / ein Bekenntnis abzulegen
  rationale: Der unmittelbare Zusammenhang ist der Abschluss von Tobits Lob- und Segensrede, nicht ausdrücklich ein Sündenbekenntnis. Die mögliche Bedeutung „bekennen“ bleibt jedoch in der Fußnote sichtbar, damit die lexikalische Mehrdeutigkeit nicht verschwiegen wird.
translation_notes:
  register: Kurzer, würdevoller Erzählsatz in modernem Standarddeutsch. „Hörte auf“ ist natürlicher als das gehobenere „beendete“, während „Gott zu preisen“ den gottesdienstlichen Zusammenhang verständlich wiedergibt.
