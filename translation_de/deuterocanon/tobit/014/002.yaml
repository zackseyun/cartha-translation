  text: And he was fifty-eight years old when he lost his sight[a], and after eight years he regained it; and he did acts of mercy[c][b], and he continued to fear God.
translation:
  language: de
  text: Er war achtundfünfzig Jahre alt, als er sein Augenlicht verlor[a]; nach acht Jahren erlangte er es wieder. Er tat Werke der Barmherzigkeit[b] und fuhr fort, Gott zu fürchten[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich steht im Griechischen sinngemäß „die Sehkraft verlieren“; das folgende Verb bedeutet in diesem Zusammenhang „wieder sehen“ beziehungsweise „das Augenlicht wiedererlangen“.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Er gab Almosen.“ Das griechische Wort kann sowohl Almosengeben im engeren Sinn als auch Werke der Barmherzigkeit allgemein bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: Im vorliegenden griechischen Wortlaut steht nur „fuhr fort zu fürchten“; „Gott“ ist aus dem frommen Zusammenhang ergänzt.
    reason: implicit_object
lexical_decisions:
- source_word: ἦν ἐτῶν πεντήκοντα ὀκτώ
  choice: er war achtundfünfzig Jahre alt
  rationale: Die griechische Altersangabe wird mit der üblichen und natürlichen deutschen Wendung wiedergegeben.
- source_word: ἀπώλεσεν τὰς ὄψεις
  choice: er verlor sein Augenlicht
  rationale: Die wörtlich ungewöhnliche Mehrzahl bezeichnet idiomatisch den Verlust des Sehvermögens. „Sein Augenlicht verlieren“ ist im Deutschen präzise und würdevoll.
- source_word: μετὰ ἔτη ὀκτώ
  choice: nach acht Jahren
  rationale: Direkte und natürliche Wiedergabe der zeitlichen Angabe.
- source_word: ἀνέβλεψεν
  choice: konnte er wieder sehen
  rationale: In einem Zusammenhang von Blindheit bezeichnet das Verb die Wiedererlangung des Sehvermögens; die Formulierung bewahrt zugleich den Grundsinn „wieder sehen“.
- source_word: ἐποίει ἐλεημοσύνας
  choice: er tat Werke der Barmherzigkeit
  rationale: ἐλεημοσύνη kann sowohl Almosengeben im engeren Sinn als auch barmherzige Taten allgemeiner bezeichnen. Die gewählte Fassung bewahrt diese Bedeutungsbreite.
- source_word: προσεθέτο φοβεῖσθαι
  choice: er fuhr fort, Gott zu fürchten
  rationale: Die Konstruktion drückt ein Fortfahren beziehungsweise weiteres Hinzutun aus. Das im griechischen Ausschnitt nicht genannte Objekt wird aus dem frommen Zusammenhang ergänzt und in einer Fußnote kenntlich gemacht.
theological_decisions:
- issue: Unausgesprochenes Objekt von φοβεῖσθαι
  choice: Gott zu fürchten
  alternative: sich weiterhin zu fürchten
  rationale: Im biblisch-frommen Zusammenhang ist Gottesfurcht gemeint. Da das deutsche „sich fürchten“ ohne Objekt leicht als bloße Angst missverstanden würde, wird „Gott“ zur Klarheit ergänzt; die Fußnote legt diese Ergänzung offen.
- issue: Bedeutungsumfang von ἐλεημοσύνας
  choice: Werke der Barmherzigkeit
  alternative: Almosen
  rationale: Die weitere Wiedergabe vermeidet eine unbegründete Verengung auf Geldgaben und lässt den spezifischeren Sinn „Almosen“ als mögliche Lesart bestehen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die Satzstruktur bleibt nahe am griechischen Text, während idiomatische Wendungen wie „sein Augenlicht verlieren“ und „wieder sehen“ natürlich deutsch formuliert sind. Interpretierende Ergänzungen und lexikalische Alternativen werden transparent in Fußnoten ausgewiesen.
