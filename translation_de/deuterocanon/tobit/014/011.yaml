base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/014/011.yaml
  text: And now, children, see what almsgiving does, and how righteousness delivers. And while he was saying these things, his life came to an end on the bed. He was a hundred fifty-eight years old, and he buried him honorably.
translation:
  language: de
  text: Und nun, Kinder, seht, was das Geben von Almosen bewirkt und wie die Gerechtigkeit[a] rettet. Noch während er dies sagte, endete sein Leben in seinem Bett.[b] Er war hundertachtundfünfzig Jahre alt, und er bestattete ihn ehrenvoll.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Gerechtigkeit“ kann hier auch „Rechtschaffenheit“ bedeuten.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „Seine Seele versagte/verließ ihn.“ Die griechische Wendung bezeichnet den Tod.'
    reason: lexical_alternative
  - marker: c
    text: 'Man könnte dem Zusammenhang nach „sie bestatteten ihn ehrenvoll“ erwarten; im vorliegenden griechischen Text steht jedoch das Verb im Singular: „er bestattete ihn ehrenvoll“.'
    reason: textual_variant
lexical_decisions:
- source_word: παιδία
  choice: Kinder
  rationale: Die Anrede bezeichnet Nachkommen oder jüngere Angehörige; „Kinder“ bewahrt den familiären Ton, ohne das Geschlecht enger festzulegen.
- source_word: ἴδετε
  choice: seht
  rationale: Der Imperativ Plural behält den direkten, mahnenden Charakter der Aufforderung bei.
- source_word: ἐλεημοσύνη
  choice: Almosengeben
  rationale: Im Buch Tobit bezeichnet der Ausdruck besonders die konkrete Gabe an Bedürftige, nicht nur eine allgemeine barmherzige Haltung.
- source_word: ποιεῖ
  choice: bewirkt
  rationale: „Bewirkt“ gibt die wirksame Tätigkeit idiomatisch wieder und passt im Deutschen besser zur offenen Frageform als ein bloßes „tut“.
- source_word: δικαιοσύνη
  choice: Gerechtigkeit
  rationale: „Gerechtigkeit“ deckt im Deutschen sowohl rechtschaffenes Handeln als auch den Gerechtigkeitsaspekt des griechischen Begriffs ab; die Bedeutungsbreite bleibt im Kontext erhalten.
- source_word: ῥύεται
  choice: rettet
  rationale: Das Verb bezeichnet Befreiung oder Rettung. „Rettet“ ist knapp und lässt offen, vor welcher Art von Gefahr gerettet wird.
- source_word: ἐξέλιπεν αὐτοῦ ἡ ψυχὴ
  choice: ging sein Leben zu Ende
  rationale: Die griechische Wendung bezeichnet seinen Tod. Die idiomatische deutsche Fassung vermeidet eine übermäßig bestimmte Aussage darüber, was beim Tod mit der Seele geschieht; die wörtlichere Form wird in der Fußnote bewahrt.
- source_word: κλίνη
  choice: Bett
  rationale: „Bett“ ist die gewöhnliche und kontextuell passende Bedeutung.
- source_word: ἐτῶν ἑκατὸν πεντήκοντα ὀκτώ
  choice: hundertachtundfünfzig Jahre alt
  rationale: Natürliche deutsche Wiedergabe der Altersangabe.
- source_word: ἔθαψεν αὐτὸν ἐνδόξως
  choice: er bestattete ihn ehrenvoll
  rationale: Die auffällige Singularform des griechischen Verbs wird bewahrt. „Ehrenvoll“ bezeichnet die würdige Art der Bestattung, ohne modernen Prunk anzudeuten.
theological_decisions:
- issue: Bedeutungsumfang von δικαιοσύνη
  choice: Gerechtigkeit
  alternative: Rechtschaffenheit
  rationale: Der griechische Ausdruck kann sowohl gerechtes als auch rechtschaffenes Handeln bezeichnen. „Gerechtigkeit“ wahrt diese Breite; die mögliche stärker ethische Nuance wird in der Fußnote genannt.
- issue: Todeswendung ἐξέλιπεν αὐτοῦ ἡ ψυχὴ
  choice: ging sein Leben zu Ende
  alternative: seine Seele verließ ihn
  rationale: Die Wendung stellt den Tod fest, ohne notwendig eine genaue Anthropologie des Sterbens zu lehren. Die Hauptfassung ist verständlich und zurückhaltend; die wörtlichere Aussage bleibt als Fußnote sichtbar.
- issue: Singularisches Subjekt bei ἔθαψεν
  choice: er bestattete ihn
  alternative: sie bestatteten ihn
  rationale: Obwohl Leser im Zusammenhang einen Plural erwarten könnten, steht im vorliegenden griechischen Zeugen ein Verb im Singular. Diese textliche Spannung wird nicht stillschweigend beseitigt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit direkter Weisheitsmahnung. Konkretes „Almosengeben“ wurde gegenüber allgemeiner „Wohltätigkeit“ bevorzugt. Die ungewöhnliche singularische Schlussform und die Zurückhaltung der griechischen Todeswendung bleiben erkennbar.
