base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/014/010.yaml
  text: And bury me properly[a], and your mother with me, and do not stay any longer in Nineveh. Child, see what Nadab did to Ahikar, who had reared him—how he brought him from the light into the darkness, and all that he repaid him. But Ahikar was saved, while that man received the repayment, and he himself went down into the darkness. Manasseh did acts of mercy, and he was saved from the deadly snare that Nadab had set for him[b]; but Nadab fell into the trap and perished.
translation:
  language: de
  text: 'Und begrabe mich, wie es sich gehört, und deine Mutter zusammen mit mir. Bleibt nicht länger in Ninive. Mein Kind, sieh, was Nadab[a] Ahikar angetan hat, der ihn großgezogen hatte: wie er ihn aus dem Licht in die Finsternis brachte und ihm alles vergalt. Ahikar aber rettete er; jener dagegen empfing die Vergeltung und stieg selbst in die Finsternis hinab. Manasse übte Barmherzigkeit[b] und wurde aus der Todesfalle gerettet, die Nadab ihm gestellt hatte; Nadab aber geriet selbst in die Falle und kam um.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im griechischen Text steht hier der Personenname „Adam“. Gemeint ist der verräterische Höfling aus der Ahikar-Erzählung, der auch als Nadab beziehungsweise Nadan bekannt ist, nicht Adam, der erste Mensch.
    reason: alternative_reading
  - marker: b
    text: 'Oder: „gab Almosen“. Das griechische Wort ἐλεημοσύνη bezeichnet im Buch Tobit häufig konkret wohltätiges Geben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: θάψον με καλῶς
  choice: begrabe mich, wie es sich gehört
  rationale: Die Wendung gibt den Befehl und das adverbiale καλῶς natürlich und würdig wieder, ohne das bürokratisch klingende „ordnungsgemäß“ oder die zusätzliche Nuance „ehrenvoll“ einzutragen.
- source_word: μηκέτι αὐλισθῆτε
  choice: Bleibt nicht länger
  rationale: Das Verb kann „übernachten“, „sich aufhalten“ oder im weiteren Sinn „bleiben“ bedeuten. Im Zusammenhang mit dem Wegzug aus Ninive ist „bleibt nicht länger“ idiomatisch; die Pluralform des griechischen Befehls bleibt in der deutschen Verbform erhalten.
- source_word: τέκνον
  choice: Mein Kind
  rationale: τέκνον ist eine vertrauliche familiäre Anrede. Das im Deutschen natürliche „mein“ ist kontextuell impliziert, obwohl es im Griechischen nicht ausdrücklich steht.
- source_word: Ἀδὰμ
  choice: Nadab
  rationale: Der Name bezeichnet hier den verräterischen Höfling der Ahikar-Erzählung, nicht den ersten Menschen Adam. „Nadab“ vermeidet eine sachlich irreführende Identifikation; die griechische Form wird in der Fußnote dokumentiert.
- source_word: τῷ θρέψαντι αὐτόν
  choice: der ihn großgezogen hatte
  rationale: τρέφω bezeichnet hier nicht bloß Ernährung, sondern Erziehung und Fürsorge beim Aufwachsen.
- source_word: ἐκ τοῦ φωτὸς ... εἰς τὸ σκότος
  choice: aus dem Licht in die Finsternis
  rationale: Die bildhafte und rhetorisch gegensätzliche Formulierung wird eng am Griechischen bewahrt.
- source_word: ὅσα ἀνταπέδωκεν αὐτῷ
  choice: so vergalt er ihm alles
  rationale: „Vergelten“ bewahrt den Gedanken der Erwiderung beziehungsweise Gegenleistung; „alles“ gibt den umfassenden Sinn von ὅσα wieder.
- source_word: ἀνταπόδομα ἀπεδόθη
  choice: empfing die Vergeltung
  rationale: „Vergeltung“ wahrt die lexikalische Verbindung zum vorherigen „vergalt“ und lässt offen, durch wen die gerechte Folge herbeigeführt wurde.
- source_word: ἐλεημοσύνην
  choice: übte Barmherzigkeit
  rationale: ἐλεημοσύνη kann besonders im Buch Tobit konkrete Mildtätigkeit oder Almosengeben bezeichnen. „Barmherzigkeit üben“ ist idiomatisches, würdevolles Deutsch und hält den Begriff etwas weiter; die engere Möglichkeit steht in der Fußnote.
- source_word: παγίδος θανάτου
  choice: Todesfalle
  rationale: Das deutsche Kompositum gibt den Genitiv knapp und anschaulich als eine tödliche Falle wieder.
- source_word: ἀπώλετο
  choice: kam um
  rationale: Die Wendung bezeichnet hier den Tod beziehungsweise Untergang Nadabs und ist in modernem Deutsch klarer als das missverständliche „ging verloren“.
theological_decisions:
- issue: Bedeutung der Rettungsaussagen bei Ahikar und Manasse
  choice: Rettung aus konkreter Lebensgefahr
  alternative: geistliches oder ewiges Heil
  rationale: Der Erzählzusammenhang handelt von Intrige, Todesfalle und Entkommen. „wurde gerettet“ bleibt lexikalisch offen genug, während der unmittelbare Kontext die konkrete Rettung erkennen lässt.
- issue: Nicht genannter Handelnder bei καὶ Ἀχιάχαρον μὲν ἔσωσεν
  choice: 'passivisch: „Ahikar wurde gerettet“'
  alternative: aktivisch mit ergänztem Subjekt, etwa „Gott rettete Ahikar“
  rationale: Die griechische Verbform ist aktiv, nennt an dieser Stelle jedoch kein eindeutiges Subjekt. Das deutsche Passiv bewahrt die Rettungsaussage, ohne einen theologischen Handelnden einzusetzen, den der Satz nicht ausdrücklich nennt.
- issue: Bedeutungsumfang von ἐλεημοσύνη
  choice: Barmherzigkeit üben
  alternative: Almosen geben
  rationale: Die weitere Wiedergabe hält sowohl konkrete Wohltätigkeit als auch barmherziges Handeln offen. Die im Buch Tobit häufig naheliegende engere Deutung als Almosengeben wird als Fußnote ausgewiesen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die Licht-Finsternis-Bildsprache und die wiederholte Sprache der Vergeltung bleiben erhalten. Eigennamen sind in gut lesbaren deutschen Formen wiedergegeben; „Nadab“ wird wegen der abweichenden griechischen Namensform ausdrücklich erläutert.
