  naturalness: Der Ton ist modernes, würdiges Standarddeutsch. „Übte Barmherzigkeit“ ist idiomatisch, aber etwas abstrakter als die im Kontext naheliegenden barmherzigen Taten beziehungsweise Almosen. Die Beibehaltung ist mit der Fußnote vertretbar. Die Umformulierung des Ahikar-Satzes bleibt natürlich und macht die Gegensatzstruktur klarer.
