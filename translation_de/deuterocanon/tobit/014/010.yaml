revisions:
- from: 'Und begrabe mich, wie es sich gehört, und deine Mutter zusammen mit mir. Bleibt nicht länger in Ninive. Mein Kind, sieh, was Nadab[a] Ahikar angetan hat, der ihn großgezogen hatte: Er brachte ihn aus dem Licht in die Finsternis – so vergalt er ihm alles. Doch Ahikar wurde gerettet; jener dagegen empfing die Vergeltung und stieg selbst in die Finsternis hinab. Manasse übte Barmherzigkeit[b] und wurde aus der Todesfalle gerettet, die Nadab ihm gestellt hatte; Nadab aber geriet selbst in die Falle und kam um.'
  to: 'Und begrabe mich, wie es sich gehört, und deine Mutter zusammen mit mir. Bleibt nicht länger in Ninive. Mein Kind, sieh, was Nadab[a] Ahikar angetan hat, der ihn großgezogen hatte: wie er ihn aus dem Licht in die Finsternis brachte und ihm alles vergalt. Ahikar aber rettete er; jener dagegen empfing die Vergeltung und stieg selbst in die Finsternis hinab. Manasse übte Barmherzigkeit[b] und wurde aus der Todesfalle gerettet, die Nadab ihm gestellt hatte; Nadab aber geriet selbst in die Falle und kam um.'
  rationale: Die Revision beschränkt sich auf die aktive Wiedergabe von ἔσωσεν. „Ahikar aber rettete er“ lässt offen, wer rettete, erhält aber die im Griechischen vorliegende aktive Satzform. Die Umstellung von „so vergalt er ihm alles“ zu „wie er ihn ... brachte und ihm alles vergalt“ bildet die beiden von ὡς umfassten Aussagen klarer und ohne Bedeutungsänderung ab. Fußnotenanker und ihre Inhalte bleiben vollständig erhalten.
