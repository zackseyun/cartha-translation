base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/014/008.yaml
  text: And now[a], child, depart from Nineveh, because what the prophet Jonah spoke will surely happen.
translation:
  language: de
  text: Und nun, mein Kind[a], geh fort aus Ninive; denn was der Prophet Jona gesagt hat, wird ganz gewiss eintreffen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mein Sohn“. Das griechische Wort τέκνον ist eine familiäre Anrede und kann je nach Zusammenhang mit „Kind“ oder „Sohn“ wiedergegeben werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τέκνον
  choice: mein Kind
  rationale: Die Anrede bezeichnet ein Kind in der familiären Beziehung. Das im Deutschen idiomatische „mein Kind“ bewahrt die elterliche Anrede, ohne das Geschlecht stärker festzulegen als der griechische Ausdruck.
- source_word: ἄπελθε
  choice: geh fort
  rationale: Der Aoristimperativ fordert zum entschiedenen Weggehen auf. „Geh fort“ ist gegenwärtiges, natürliches Deutsch und wahrt den direkten Befehlscharakter.
- source_word: ἀπὸ Νινευή
  choice: aus Ninive
  rationale: ἀπό bezeichnet hier die Trennung beziehungsweise Entfernung von der Stadt; bei Städtenamen ist „aus Ninive“ idiomatischer als „von Ninive“.
- source_word: πάντως
  choice: ganz gewiss
  rationale: Das Adverb verstärkt die Gewissheit der angekündigten Erfüllung; „ganz gewiss“ gibt diesen Nachdruck klar wieder.
- source_word: ἔσται
  choice: wird ... eintreffen
  rationale: Das wörtliche „wird sein“ bezeichnet im Zusammenhang das Eintreten des prophetisch Gesagten. „Eintreffen“ ist im Deutschen besonders passend für eine Vorhersage.
- source_word: ἃ ἐλάλησεν
  choice: was ... gesagt hat
  rationale: Die Wendung bezeichnet den Inhalt von Jonas prophetischer Rede. „Gesagt hat“ ist natürlicher als „gesprochen hat“, ohne den prophetischen Zusammenhang abzuschwächen.
- source_word: ὁ προφήτης Ἰωνᾶς
  choice: der Prophet Jona
  rationale: Die Wiedergabe bewahrt Titel, Namen und griechische Wortfolge in idiomatischem Deutsch.
theological_decisions:
- issue: Gewissheit über die Erfüllung von Jonas prophetischer Aussage
  choice: „wird ganz gewiss eintreffen“
  alternative: „wird sicherlich geschehen“
  rationale: Die Formulierung erhält die nachdrückliche Gewissheit des griechischen πάντως, ohne Zeitpunkt, Art oder Umfang der Erfüllung näher zu bestimmen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte familiäre Anrede und der feierliche Ernst der Warnung bleiben erhalten; altertümliche Wendungen wie „ziehe hinweg“ oder „wird geschehen, was ... geredet hat“ werden vermieden.
