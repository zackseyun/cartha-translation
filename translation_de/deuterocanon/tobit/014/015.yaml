revisions:
- from: Und noch bevor er starb, hörte er von der Vernichtung Ninives, das Nebukadnezar und Ahasver in Gefangenschaft geführt hatten.[a] Vor seinem Tod freute er sich über Ninive. Amen.
  to: Und noch bevor er starb, hörte er von der Vernichtung Ninives, die Nebukadnezar und Ahasver in Gefangenschaft geführt hatten.[a] Noch vor seinem Tod freute er sich über Ninive. Amen.
  rationale: Die einzige notwendige Änderung berichtigt das Relativpronomen zu „die“, das sich auf die als Stadt feminine Ortsbezeichnung „Ninive“ bezieht. Die Übersetzung bleibt sonst eng am griechischen Text, einschließlich seiner Wiederholung der Zeitangabe und seiner historisch umstrittenen Namensnennung.
