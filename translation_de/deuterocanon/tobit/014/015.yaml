    rationale: Der Relativsatz meint Ninive, nicht „die Vernichtung“. Als Stadt wird Ninive im Deutschen feminin behandelt; daher muss es „Ninive, die …“ heißen. Das vorhandene „das“ ist grammatisch fehlerhaft und stört den Sinnbezug.
