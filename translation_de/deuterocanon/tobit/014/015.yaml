base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/014/015.yaml
  text: And before he died[a], he heard of the destruction of Nineveh, which Nebuchadnezzar and Ahasuerus had taken captive; before dying, he rejoiced over Nineveh. Amen.
translation:
  language: de
  text: Und noch bevor er starb, hörte er von der Vernichtung Ninives, die Nebukadnezar und Ahasver in Gefangenschaft geführt hatten.[a] Noch vor seinem Tod freute er sich über Ninive. Amen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'So der griechische Text: „die Nebukadnezar und Ahasver in Gefangenschaft geführt hatten“. Ninive steht dabei offenbar für seine Bevölkerung. Wie die genannten Herrscher historisch mit dem Fall Ninives zusammenhängen, ist umstritten.'
    reason: Die ungewöhnliche Formulierung und die historische Spannung sollen kenntlich gemacht werden, ohne den Quelltext im Haupttext zu harmonisieren.
lexical_decisions:
- source_word: ἤκουσεν
  choice: hörte er von
  rationale: Das Verb bedeutet „hören“; mit dem Ereignis als Objekt ist „von … hören“ im Deutschen natürlich und deutet keine unmittelbare Wahrnehmung der Zerstörung an.
- source_word: πρὶν ἢ ἀποθανεῖν αὐτόν
  choice: noch bevor er starb
  rationale: Die Infinitivkonstruktion bezeichnet einen Zeitpunkt vor seinem Tod. „Noch bevor er starb“ gibt sie idiomatisch und klar wieder.
- source_word: ἀπωλίαν
  choice: Vernichtung
  rationale: Im Zusammenhang mit dem Untergang einer Stadt bezeichnet das Wort deren Zerstörung beziehungsweise Untergang; „Vernichtung“ wahrt die Stärke des griechischen Ausdrucks.
- source_word: ᾐχμαλώτισεν
  choice: in Gefangenschaft geführt hatten
  rationale: Das Verb bezeichnet das Gefangennehmen oder Wegführen in die Gefangenschaft. Die Stadt steht dabei metonymisch für ihre Bevölkerung; die ungewöhnliche Aussage des Quelltextes bleibt erkennbar.
- source_word: Ναβουχοδονοσόρ
  choice: Nebukadnezar
  rationale: Dies ist die im modernen deutschen Bibelgebrauch etablierte Namensform.
- source_word: Ἀσύηρος
  choice: Ahasver
  rationale: Dies ist die gebräuchliche deutsche biblische Namensform für den griechischen Namen.
- source_word: ἐχάρη
  choice: freute er sich
  rationale: Die Form bezeichnet Freude; die schlichte Wendung ist genau, würdig und in modernem Deutsch natürlich.
- source_word: ἐπὶ Νινευή
  choice: über Ninive
  rationale: ἐπί kann hier den Gegenstand oder Anlass der Freude bezeichnen. „Über Ninive“ erhält die knappe Mehrdeutigkeit, ohne ausdrücklich „über dessen Untergang“ einzusetzen.
- source_word: ἀμήν
  choice: Amen
  rationale: Das ausdrücklich im griechischen Text stehende Schlusswort wird beibehalten.
theological_decisions:
- issue: Historische Identifizierung der bei Ninives Fall genannten Herrscher
  choice: Die Namen „Nebukadnezar und Ahasver“ werden entsprechend dem griechischen Quelltext im Haupttext beibehalten.
  alternative: Die Namen aufgrund historischer Rekonstruktionen ändern, harmonisieren oder als spätere Verwechslung aus dem Haupttext entfernen.
  rationale: Die Übersetzung gibt den vorhandenen griechischen Text wieder und löst seine historische Spannung nicht stillschweigend auf.
- issue: Gegenstand der abschließenden Freude
  choice: „freute er sich über Ninive“
  alternative: „freute er sich über Ninives Untergang“
  rationale: Der griechische Ausdruck nennt Ninive als Gegenstand oder Anlass der Freude, spezifiziert an dieser Stelle aber nicht erneut ausdrücklich den Untergang. Die offenere Formulierung bewahrt diese Spannung.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die zweimalige Erwähnung seines bevorstehenden Todes entspricht der Wiederholung im griechischen Text. Die knappe Wendung „über Ninive“ bleibt bewusst unausgedeutet.
