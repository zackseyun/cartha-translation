  text: And all the nations will truly turn to fear the Lord God[a]; they will bury their idols.
translation:
  language: de
  text: Und alle Völker werden sich wahrhaftig dem Herrn, Gott, zuwenden, um ihn zu fürchten; ihre Götzen werden sie begraben.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πάντα τὰ ἔθνη
  choice: alle Völker
  rationale: Die Wendung bezeichnet umfassend die Völker der Welt. „Alle Völker“ bewahrt den universalen Umfang und klingt im Deutschen natürlich und bibelsprachlich vertraut.
- source_word: ἐπιστρέψουσιν
  choice: werden sich dazu wenden
  rationale: Das Verb bezeichnet ein Sichwenden oder Umkehren. Die Formulierung hält das Bild einer Hinwendung zu Gott sichtbar, ohne einen späteren theologischen Fachbegriff wie „sich bekehren“ einzutragen.
- source_word: ἀληθινῶς
  choice: wahrhaftig
  rationale: Das Adverb kennzeichnet die Hinwendung als echt und aufrichtig. „Wahrhaftig“ bewahrt seine ausdrückliche adverbiale Funktion und den würdigen Ton.
- source_word: φοβεῖσθαι
  choice: zu fürchten
  rationale: „Fürchten“ entspricht dem unmittelbaren Sinn und bewahrt die biblische Spannung zwischen Furcht, Ehrfurcht und Unterordnung, statt sie durch „verehren“ zu glätten.
- source_word: Κύριον τὸν θεόν
  choice: Gott, den Herrn
  rationale: Die natürliche deutsche Apposition gibt beide Bezeichnungen ohne ein im Griechischen nicht vorhandenes Possessivpronomen wieder. Die Umstellung vermeidet die im modernen Deutschen schwer verständliche Folge „den Herrn, Gott“.
- source_word: κατορύξουσιν
  choice: werden sie begraben
  rationale: Das Verb bedeutet wörtlich, etwas einzugraben oder zu begraben. „Begraben“ erhält das anschauliche Bild der Abkehr von den Götzen.
- source_word: τὰ εἴδωλα αὐτῶν
  choice: ihre Götzen
  rationale: „Götzen“ ist in diesem religiösen Zusammenhang die präzise deutsche Entsprechung und wahrt den Bezug des Possessivpronomens.
theological_decisions:
- issue: Ob φοβεῖσθαι mit „fürchten“ oder abschwächend mit „verehren“ wiederzugeben ist
  choice: Gott, den Herrn, zu fürchten
  alternative: Gott, den Herrn, zu verehren
  rationale: Der griechische Text verwendet ausdrücklich die verbreitete biblische Rede von der Gottesfurcht. „Fürchten“ erhält deren theologisches Gewicht und ihre Spannung.
- issue: Ob ἐπιστρέψουσιν als formaler Bekehrungsbegriff auszudrücken ist
  choice: werden sich dazu wenden
  alternative: werden sich bekehren
  rationale: Das griechische Verb bewahrt das konkrete Bild des Wendens beziehungsweise Umkehrens. „Sich bekehren“ wäre stärker terminologisch festgelegt und würde die lexikalische Mehrdeutigkeit verringern.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bleibt nahe am griechischen Gedankengang, wird aber durch „dazu wenden“ und die natürliche deutsche Apposition „Gott, den Herrn“ verständlich gehalten. Das Semikolon bewahrt die enge Verbindung zwischen der Hinwendung zu Gott und der Beseitigung der Götzen.
