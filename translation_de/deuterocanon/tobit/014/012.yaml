base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/014/012.yaml
  text: And when Hanna died[a], he buried her with his father. Then Tobias went away with his wife and his sons to Ecbatana, to Raguel his father-in-law.
translation:
  language: de
  text: Als Hanna gestorben war, begrub er sie mit seinem Vater.[a] Danach zog Tobias mit seiner Frau und seinen Söhnen nach Ekbatana zu seinem Schwiegervater Raguel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Griechischen ist das Subjekt von „begrub er sie mit seinem Vater“ nicht ausdrücklich genannt; erst im folgenden Satz steht der Name Tobias.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπέθανεν
  choice: gestorben war
  rationale: Der Aorist bezeichnet schlicht Hannas Tod; im deutschen Zeitgefüge gibt das Plusquamperfekt das dem Begräbnis vorausgehende Geschehen natürlich wieder.
- source_word: ἔθαψεν
  choice: begrub
  rationale: Direkte und sachliche Wiedergabe von θάπτω.
- source_word: μετὰ τοῦ πατρὸς αὐτοῦ
  choice: bei seinem Vater
  rationale: μετά mit Genitiv bedeutet wörtlich „mit“; im Bestattungskontext drückt „bei“ idiomatisch die gemeinsame beziehungsweise nahe Grabstätte aus, ohne deren genaue Anlage festzulegen.
- source_word: ἀπῆλθεν
  choice: zog
  rationale: ἀπέρχομαι bezeichnet hier das Fortgehen an einen anderen Ort; „zog … nach“ ist im Deutschen für einen Ortswechsel mit der Familie natürlich.
- source_word: γυναικὸς
  choice: Frau
  rationale: Im possessiven Familienzusammenhang bedeutet γυνή eindeutig die Ehefrau.
- source_word: υἱῶν
  choice: Söhnen
  rationale: Das griechische Wort bezeichnet ausdrücklich Söhne und wird nicht zum allgemeineren „Kinder“ erweitert.
- source_word: Ἐκβάτανα
  choice: Ekbatana
  rationale: Gebräuchliche deutsche Form des antiken Ortsnamens.
- source_word: πρὸς Ῥαγουὴλ τὸν πενθερὸν αὐτοῦ
  choice: zu seinem Schwiegervater Raguël
  rationale: πρός bezeichnet die Bewegung zu einer Person; die Apposition wird in eine natürliche deutsche Possessivkonstruktion überführt.
theological_decisions:
- issue: Subjekt des Begräbnissatzes
  choice: Das im Griechischen unausgesprochene Subjekt bleibt als „er“ unbestimmt; erst im folgenden Satz wird Tobias ausdrücklich genannt.
  alternative: Das Subjekt des Begräbnissatzes ausdrücklich als Tobias bestimmen.
  rationale: Bei ἔθαψεν steht kein ausgedrücktes Subjekt, während der nächste Satz Τωβίας ausdrücklich nennt. Die Übersetzung bewahrt diese sprachliche Offenheit, statt sie durch eine harmonisierende Ergänzung aufzulösen.
translation_notes:
  register: Moderne, gut verständliche Standardsprache mit würdigem Erzählton. „Zog … nach“ klingt natürlicher als ein wörtliches „ging weg“, während die familiären Bezeichnungen und die Unbestimmtheit des ersten Subjekts quellennah bleiben.
