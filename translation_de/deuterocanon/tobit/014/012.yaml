  text: Καὶ ὅτε ἀπέθανεν Ἅννα, ἔθαψεν αὐτὴν μετὰ τοῦ πατρὸς αὐτοῦ· ἀπῆλθεν δὲ Τωβίας μετὰ τῆς γυναικὸς αὐτοῦ καὶ τῶν υἱῶν αὐτοῦ εἰς Ἐκβάτανα πρὸς Ῥαγουὴλ τὸν πενθερὸν αὐτοῦ.
