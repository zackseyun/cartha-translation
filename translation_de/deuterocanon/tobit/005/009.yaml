base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/005/009.yaml
  text: And he went in and said to his father[a], “Look, I have found someone who will travel with me.” And he said, “Call him to me, so that I may learn what tribe he is from[c][b], and whether he is trustworthy to go with you.”
translation:
  language: de
  text: 'Und er ging hinein und sagte zu seinem Vater: »Sieh, ich habe jemanden gefunden, der mit mir reisen wird.« Da sagte er: »Ruf ihn zu mir, damit ich erfahre, aus welchem Stamm er ist[a] und ob er zuverlässig ist, mit dir zu gehen[b].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »von welchem Stamm er ist«.'
    reason: Die Formulierung spiegelt die Bedeutung der israelitischen Stammeszugehörigkeit im griechischen Text wider.
  - marker: b
    text: 'Oder: »ob er vertrauenswürdig ist, mit dir zu gehen«.'
    reason: πιστός kann sowohl Zuverlässigkeit als auch Vertrauenswürdigkeit bezeichnen.
lexical_decisions:
- source_word: εἰσελθὼν
  choice: er ging hinein
  rationale: Das Aoristpartizip bezeichnet eine der Hauptaussage vorausgehende Handlung. Die koordinierte deutsche Form gibt die Abfolge knapp und natürlich wieder.
- source_word: Ἰδοὺ
  choice: Sieh
  rationale: Die aufmerksamkeitslenkende Partikel wird würdig und zugleich gegenwärtig wiedergegeben; „Siehe“ wäre heute stärker altertümlich.
- source_word: εὕρηκα
  choice: ich habe ... gefunden
  rationale: Das Perfekt hebt das gegenwärtige Ergebnis der Suche hervor.
- source_word: ὃς συμπορεύσεταί μοι
  choice: der mit mir reisen wird
  rationale: Das Verb bezeichnet das gemeinsame Unterwegssein und passt unmittelbar zum geplanten Reiseunternehmen.
- source_word: Φώνησον αὐτὸν πρὸς μέ
  choice: Ruf ihn zu mir
  rationale: Die Wendung bewahrt das konkrete Rufen beziehungsweise Herbeirufen, ohne das stärkere „befiehl ihn her“ einzutragen.
- source_word: ἐπιγνῶ
  choice: damit ich erfahre
  rationale: Im Zusammenhang will der Vater die Herkunft des Begleiters feststellen; „erfahren“ ist natürlich und wahrt den Erkenntnisvorgang.
- source_word: ποίας φυλῆς ἐστίν
  choice: aus welchem Stamm er ist
  rationale: φυλή bezeichnet hier im israelitischen Umfeld die Stammeszugehörigkeit und sollte nicht zu „Familie“ verallgemeinert werden.
- source_word: πιστὸς
  choice: zuverlässig
  rationale: Gemeint ist, ob man sich auf den Reisebegleiter verlassen kann. Das Wort erhält seinen moralischen Gehalt, ohne unnötig einen theologischen Fachsinn von „gläubig“ einzutragen.
- source_word: τοῦ πορευθῆναι μετὰ σοῦ
  choice: mit dir zu gehen
  rationale: Die Infinitivkonstruktion bezeichnet den Bereich, in dem sich seine Zuverlässigkeit erweisen soll; die knappe Form folgt dem Griechischen.
theological_decisions:
- issue: Soziale Identitätsbezeichnung φυλή
  choice: Stamm
  alternative: Sippe / Familienlinie
  rationale: Der griechische Wortlaut und der israelitische Erzählrahmen weisen auf Stammeszugehörigkeit. Eine allgemeinere Wiedergabe würde diesen Aspekt der Identität einebnen.
- issue: Bedeutung von πιστός
  choice: zuverlässig
  alternative: treu / vertrauenswürdig
  rationale: Hier wird die Eignung eines Begleiters für die Reise beurteilt. „Zuverlässig“ wahrt den praktischen und charakterlichen Sinn, ohne die Aussage als Bekenntnis über Glauben umzudeuten.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Satzverknüpfung bleibt nahe am schlichten griechischen Stil; altertümliche oder konfessionell geprägte Ausdrücke werden vermieden.
