base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/005/005.yaml
  text: And he said to him[a], “Can I travel with you to Rages of Media[b], and are you familiar with the places?”
translation:
  language: de
  text: 'Und er sagte zu ihm: „Kann ich mit dir nach Rages[a][b] in Medien reisen, und bist du mit den Orten vertraut?“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich steht im Griechischen „in Rages in Medien“. Im Zusammenhang mit dem Verb des Reisens ist jedoch wahrscheinlich das Ziel gemeint: „nach Rages in Medien“.'
    reason: lexical_alternative
  - marker: b
    text: Der Ortsname wird auch „Rhages“ geschrieben; „Rages“ folgt unmittelbar der griechischen Namensform.
    reason: alternative_reading
lexical_decisions:
- source_word: πορευθῆναι
  choice: reisen
  rationale: Das Verb bezeichnet hier das Unterwegssein beziehungsweise die Reise zu einem entfernten Ort; „reisen“ ist im modernen Deutsch natürlich und kontextgerecht.
- source_word: μετὰ σοῦ
  choice: mit dir
  rationale: Die schlichte Begleitungsangabe wird direkt und idiomatisch wiedergegeben.
- source_word: ἐν Ῥάγοις τῆς Μηδείας
  choice: nach Rages in Medien
  rationale: Obwohl ἐν gewöhnlich „in“ bedeutet, bezeichnet die Wendung im Zusammenhang mit einem Bewegungsverb sehr wahrscheinlich das Reiseziel. „In Medien“ gibt die geographische Zuordnung durch den Genitiv τῆς Μηδείας natürlich wieder.
- source_word: Ῥάγοις
  choice: Rages
  rationale: „Rages“ folgt der griechischen Namensform Ῥάγοις beziehungsweise ihrem Nominativ Ῥάγαι und ist im Deutschen als Form des Ortsnamens verständlich.
- source_word: ἔμπειρος
  choice: vertraut
  rationale: ἔμπειρος bezeichnet Erfahrung oder genaue Bekanntschaft mit etwas. In Verbindung mit Gegenden ist „vertraut“ idiomatisch und präzise.
- source_word: τῶν τόπων
  choice: mit den dortigen Gegenden
  rationale: Der Plural τόποι meint hier die Orte beziehungsweise Landstriche, die man für die Reise kennen muss. „Dortigen“ macht den kontextuellen Bezug deutlich, ohne das Gebiet zu einem einzigen Ort zu verengen.
