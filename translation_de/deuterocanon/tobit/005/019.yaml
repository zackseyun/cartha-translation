  text: Do not value silver against silver[a], but let it become refuse for our child.
translation:
  language: de
  text: Das Silber soll nicht zählen[a]; vielmehr soll es im Vergleich mit unserem Kind wie Kehricht sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: »Silber soll dem Silber nicht zuvorkommen; vielmehr soll es Kehricht unseres Kindes sein.« Die griechische Wendung ist idiomatisch; gemeint ist, dass Geld gegenüber dem Kind als wertlos gelten soll.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀργύριον τῷ ἀργυρίῳ μὴ φθάσαι
  choice: Silber soll gegen Silber nicht ins Gewicht fallen
  rationale: Die verdichtete, offenbar sprichwörtliche Wendung ist wörtlich schwer verständlich. »Ins Gewicht fallen« gibt φθάσαι hier als Warnung wieder, Geld nicht zum ausschlaggebenden Maßstab zu machen; die Wiederholung von »Silber« und die vergleichende Kraft des Dativs bleiben erhalten.
- source_word: ἀλλά
  choice: vielmehr
  rationale: Das adversative ἀλλά leitet hier nicht bloß einen Gegensatz, sondern die maßgebliche Neubewertung des Silbers ein.
- source_word: περίψημα
  choice: Kehricht
  rationale: περίψημα bezeichnet Abgewischtes, Abgeschabtes oder Weggeworfenes. »Kehricht« bewahrt das kräftige Bild von etwas Wertlosem und bleibt in einem würdigen deutschen Register verständlich.
- source_word: τοῦ παιδίου ἡμῶν
  choice: für unser Kind
  rationale: Der knappe Genitiv bezeichnet die Beziehung zum Kind, ohne ihre genaue Nuance eindeutig festzulegen. »Für unser Kind« bleibt nah an der Formulierung und passt zum Gedanken, Silber um des Kindes willen geringzuachten.
- source_word: γένοιτο
  choice: soll es … sein
  rationale: Der Optativ drückt einen Wunsch beziehungsweise entschlossenen Willen aus. Die Konstruktion mit »soll« gibt diesen Ton im Deutschen natürlich wieder.
theological_decisions:
- issue: Verhältnis zwischen materiellem Besitz und dem Wohl des Kindes
  choice: Das Silber wird gegenüber dem Kind als wertlos bezeichnet.
  alternative: Die Zeile könnte enger als Aussage über den Vergleich oder die Anhäufung verschiedener Geldbeträge verstanden werden.
  rationale: Der griechische Wortlaut ist idiomatisch und elliptisch. Die Übersetzung macht den Grundgedanken verständlich, ohne eine bestimmte wirtschaftliche Handlung oder eine weitergehende Lehre in den Text einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das konkrete »Silber« und das starke Abfallbild bleiben erhalten; eine Fußnote weist auf die ungewöhnliche wörtliche Formulierung und ihre Mehrdeutigkeit hin.
