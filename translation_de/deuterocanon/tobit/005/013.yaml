  yaml_path: translation/deuterocanon/tobit/005/013.yaml
  text: to learn your family line and your name. But he said[a], “I am Azarias, son of the great Ananias, of your brothers.”
translation:
  language: de
  text: 'um deine Abstammung und deinen Namen zu erfahren. Er aber sagte: »Ich bin Asarja, der Sohn Hananjas, des Großen, einer deiner Brüder[a].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »einer deiner Verwandten«; das griechische Wort für »Brüder« kann hier weiter gefasste Verwandtschaft bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιγνῶναι
  choice: zu erfahren
  rationale: Der Infinitiv bezeichnet hier das Erlangen von Auskunft über die Identität; »zu erfahren« ist im Deutschen natürlich und bewahrt den Erkenntnisaspekt.
- source_word: γένος
  choice: Abstammung
  rationale: Im Zusammenhang der Identitäts- und Verwandtschaftsangabe bezeichnet γένος die familiäre Herkunft beziehungsweise Linie, nicht allgemein Art oder Volk.
- source_word: ὄνομα
  choice: Name
  rationale: Die direkte deutsche Entsprechung passt zur erfragten persönlichen Identität.
- source_word: Ἐγὼ Ἀζαρίας
  choice: Ich bin Asarja
  rationale: »Asarja« ist die im Deutschen geläufige Form des biblischen Namens und gibt die griechische Namensform verständlich wieder.
- source_word: Ἀνανίου
  choice: Hananja
  rationale: Der Genitiv nennt den Vater Asarjas; »Hananja« ist die geläufige deutsche Form des zugrunde liegenden biblischen Namens.
- source_word: τοῦ μεγάλου
  choice: des großen
  rationale: Die wörtliche Bedeutung »des großen« lässt offen, ob Größe, Rang oder Ansehen gemeint ist, statt deutend »des Älteren« oder »des angesehenen« zu setzen.
- source_word: τῶν ἀδελφῶν σου
  choice: aus dem Kreis deiner Brüder
  rationale: Die Wendung wahrt das griechische Verwandtschaftswort »Brüder«, während »aus dem Kreis« die Zugehörigkeit idiomatisch ausdrückt, ohne ausdrücklich ein im Griechischen nur impliziertes »einer von« einzufügen.
theological_decisions:
- issue: Reichweite des Verwandtschaftsbegriffs ἀδελφῶν
  choice: Brüder im Haupttext
  alternative: Verwandte oder Angehörige
  rationale: Das maskuline Verwandtschaftswort wird transparent wiedergegeben. Da ἀδελφοί in diesem Zusammenhang auch einen weiteren Verwandtschaftskreis bezeichnen kann, wird diese Möglichkeit in einer Fußnote genannt und nicht im Haupttext festgelegt.
- issue: Bezug der Genitivphrase τῶν ἀδελφῶν σου
  choice: formal offene Zugehörigkeitsangabe
  alternative: Hananja ausdrücklich als einen der Brüder beziehungsweise Verwandten Tobits bestimmen
  rationale: Die knappe griechische Genitivfügung lässt den syntaktischen Bezug nicht völlig eindeutig erkennen. Die deutsche Formulierung vermeidet daher eine stärkere genealogische Festlegung als der Ausgangstext.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzanfang bleibt als Infinitivanschluss erhalten, weil der überlieferte Vers mit der Fortsetzung des vorherigen Satzes beginnt. Die Namensformen folgen geläufigen deutschen Bibelnamen; die knappe Verwandtschaftsangabe bewahrt möglichst viel von der Mehrdeutigkeit des Griechischen.
