  verdict: revise
  source_fidelity: Der Infinitivanschluss »um deine Abstammung und deinen Namen zu erfahren« gibt ἐπιγνῶναι τὸ γένος σου καὶ τὸ ὄνομα zutreffend wieder. Die Namen Asarja und Hananja sind im deutschen Bibelgebrauch angemessene Formen. Die partitive Genitivgruppe τῶν ἀδελφῶν σου bezeichnet idiomatisch eine Person als zu Tobits Brüdern bzw. weiterer Verwandtschaft gehörig.
  naturalness: »aus dem Kreis deiner Brüder« ist verständlich, aber für die knappe Selbstvorstellung unnötig umschreibend und weniger natürlich als die im Deutschen übliche partitive Wendung »einer deiner Brüder«.
  terminology: »Abstammung«, »Name«, »der Große« und »Brüder« bewahren die wesentlichen Begriffe und Registerebenen. Die Fußnote sollte die mögliche weitere Verwandtschaftsbedeutung präzise benennen, ohne das unbestimmtere »Angehörige« einzuführen.
