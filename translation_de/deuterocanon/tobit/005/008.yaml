base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/005/008.yaml
  text: And he said to him[a], “Go, and do not delay.”
translation:
  language: de
  text: 'Und er sagte zu ihm[a]: »Geh und halte dich nicht auf!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich nach dem Griechischen: »Geh und halte dich nicht auf!« Das semitische Parallelmaterial ist in den umliegenden Versen ausführlicher; an der Wiedergabe dieser klaren Aufforderung ändert das nichts.'
    reason: cross_reference
lexical_decisions:
- source_word: Πορεύου
  choice: Geh
  rationale: Der Imperativ von πορεύομαι fordert hier schlicht zum Aufbruch beziehungsweise Fortgehen auf. »Geh« bewahrt die Kürze und Direktheit des Griechischen.
- source_word: μὴ χρονίσῃς
  choice: halte dich nicht auf
  rationale: χρονίζω bezeichnet hier ein Verweilen oder Verzögern. Die idiomatische Wendung »halte dich nicht auf« gibt das Verbot in natürlichem modernem Deutsch wieder.
- source_word: καὶ
  choice: und
  rationale: Die Konjunktion verbindet die Erzählformel mit der direkten Rede und wird ohne zusätzliche zeitliche Deutung wiedergegeben.
- source_word: εἶπεν αὐτῷ
  choice: er sagte zu ihm
  rationale: Die gewöhnliche griechische Erzählformel wird eng am Wortlaut wiedergegeben; das im Kontext bestimmte Subjekt bleibt wie im Ausgangstext unbenannt.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe und nachdrückliche Form des griechischen Befehls bleibt erhalten; »halte dich nicht auf« ist gegenwärtig und idiomatisch, ohne Umgangssprachlichkeit.
