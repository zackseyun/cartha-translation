  text: But tell me, what wages shall I give you? A drachma a day, and your necessities, as for my own son?
translation:
  language: de
  text: 'Aber sag mir: Welchen Lohn soll ich dir geben?[a] Eine Drachme am Tag und alles Nötige für dich, ebenso wie für meinen Sohn?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Was soll ich dir bezahlen?“ Das Griechische fragt unmittelbar nach der Vergütung, die Tobit geben soll.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μισθὸν
  choice: Lohn
  rationale: μισθός bezeichnet die Vergütung für Arbeit oder Dienst; „Lohn“ passt knapp und natürlich zum Beschäftigungskontext.
- source_word: δραχμὴν τῆς ἡμέρας
  choice: Eine Drachme am Tag
  rationale: Die Genitivkonstruktion gibt den Tagessatz an. Die antike Münzbezeichnung bleibt erhalten, ohne sie durch einen modernen Geldwert zu ersetzen.
- source_word: τὰ δέοντά σοι
  choice: alles, was du brauchst
  rationale: Die Wendung bezeichnet das für Reise und Lebensunterhalt Nötige. Diese Formulierung ist im heutigen Deutsch natürlich und legt nicht fest, ob Verpflegung, Ausrüstung oder sonstige Aufwendungen gemeint sind.
- source_word: ὡς καὶ τῷ υἱῷ μου
  choice: ebenso wie meinem Sohn
  rationale: 'ὡς καί drückt den Vergleich aus: Für den Begleiter soll ebenso gesorgt werden wie für Tobits Sohn. Das griechische μου wird mit „meinem“ unmittelbar wiedergegeben.'
- source_word: τίνα σοὶ ἔσομαι ... διδόναι
  choice: Welchen Lohn soll ich dir geben?
  rationale: Die Verbindung des Futurs von εἰμί mit dem Infinitiv bezeichnet die beabsichtigte beziehungsweise zu erwartende Handlung; die deutsche Frage bewahrt ihre Direktheit.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Frageform des griechischen Satzes bleibt auch beim angebotenen Tagessatz und Unterhalt erhalten; „alles, was du brauchst“ vermeidet unnatürliches Amtsdeutsch.
