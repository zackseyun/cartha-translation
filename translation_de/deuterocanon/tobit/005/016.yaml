translation:
  language: de
  text: Und ich werde dir noch etwas zu deinem Lohn dazugeben, wenn ihr gesund zurückkehrt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „wenn ihr als Gesunde zurückkehrt“. Das Griechische hebt das körperliche Wohlergehen bei der Rückkehr hervor.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔτι προσθήσω
  choice: werde … noch etwas … dazugeben
  rationale: Die Verbindung bezeichnet eine zusätzliche Zahlung über den vereinbarten Lohn hinaus. Die deutsche Formulierung ist natürlich und bewahrt den verstärkenden Sinn von ἔτι.
- source_word: σοι ἐπὶ τὸν μισθόν
  choice: dir … zu deinem Lohn
  rationale: σοι ist Singular und bezeichnet den Empfänger der zusätzlichen Zahlung; ἐπὶ mit Akkusativ drückt hier die Hinzufügung zum Lohn aus.
- source_word: ἐὰν
  choice: wenn
  rationale: Leitet eine reale Bedingung ein, von deren Erfüllung die zugesagte zusätzliche Zahlung abhängt.
- source_word: ὑγιαίνοντες
  choice: gesund
  rationale: Das Partizip bezeichnet körperliches Wohlergehen. „Gesund zurückkehren“ ist im Deutschen idiomatisch, ohne die Aussage zu „sicher und wohlbehalten“ auszuweiten.
- source_word: ἐπιστρέψητε
  choice: ihr … zurückkehrt
  rationale: Der Aorist Konjunktiv steht mit ἐὰν in der Bedingung und ist Plural. „Zurückkehren“ entspricht dem Reisekontext und bewahrt den Numerusunterschied zum singularischen σοι.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches und zugleich würdiges Standarddeutsch. Der Wechsel vom Singular „dir“ zum Plural „ihr“ folgt ausdrücklich den griechischen Formen und wird nicht geglättet.
