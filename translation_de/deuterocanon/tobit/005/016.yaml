  source_fidelity: Die Übersetzung gibt ἔτι προσθήσω σοι ἐπὶ τὸν μισθόν zutreffend als zusätzliche Zahlung zum Lohn wieder. Der im Griechischen auffällige Wechsel von Singular σοι („dir“) zu Plural ἐπιστρέψητε/ὑγιαίνοντες („ihr“) wird korrekt bewahrt. „gesund zurückkehrt“ entspricht der Bedeutungsweite von ὑγιαίνοντες im Reisekontext, ohne zusätzliches „wohlbehalten“ einzutragen.
