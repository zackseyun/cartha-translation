translation_notes:
  register: Moderne, klare und zugleich würdige Erzählsprache. „Da kam er herein“ verbindet die kurzen griechischen Satzglieder natürlich, ohne zusätzliche Handlung oder ausdrücklich benannte Personen einzuführen.
