  source_fidelity: 'Der Entwurf gibt die drei knappen griechischen Aussagen vollständig und in derselben Abfolge wieder: ἐκάλεσεν αὐτόν („rief ihn“), εἰσῆλθεν („kam herein“) und ἠσπάσαντο ἀλλήλους („sie begrüßten einander“). „Da“ markiert lediglich den erzählerischen Fortgang und fügt keine sachliche Information hinzu.'
