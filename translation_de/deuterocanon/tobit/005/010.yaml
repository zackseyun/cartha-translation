  language: en
  yaml_path: translation/deuterocanon/tobit/005/010.yaml
  text: And he called him[a], and he went in, and they greeted one another.
translation:
  language: de
  text: Und er rief ihn[a]. Da kam er herein, und sie begrüßten einander.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Text ist hier knapp: „Und er rief ihn. Da kam er herein, und sie begrüßten einander.“ Eine längere semitisch geprägte Texttradition des Buches Tobit bietet an dieser Stelle ausführlichere Rede; der Haupttext folgt jedoch der hier zugrunde gelegten griechischen Überlieferung.'
    reason: textual_variant
lexical_decisions:
- source_word: ἐκάλεσεν
  choice: rief
  rationale: Der Aorist von καλέω bezeichnet hier schlicht das Rufen beziehungsweise Herbeirufen. „Bestellte“ oder „ließ kommen“ wäre für die häusliche Szene zu förmlich oder zu ausdrücklich.
- source_word: αὐτόν
  choice: ihn
  rationale: Das maskuline Objektpronomen wird entsprechend dem knappen griechischen Text ohne erklärende Ergänzung wiedergegeben.
- source_word: εἰσῆλθεν
  choice: kam herein
  rationale: εἰσέρχομαι bezeichnet das Hineingehen oder Eintreten. Im Deutschen entspricht „kam herein“ der natürlichen Perspektive einer Person, die zu den bereits drinnen Befindlichen tritt.
- source_word: ἠσπάσαντο
  choice: begrüßten
  rationale: ἀσπάζομαι bedeutet gewöhnlich „grüßen“ oder „begrüßen“. Eine körperliche Handlung wie eine Umarmung wird nicht ausdrücklich genannt.
- source_word: ἀλλήλους
  choice: einander
  rationale: Das reziproke Pronomen wird idiomatisch und knapp mit „einander“ wiedergegeben.
