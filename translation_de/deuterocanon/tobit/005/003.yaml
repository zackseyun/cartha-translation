base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/005/003.yaml
  text: And he gave him the written note and said to him[a], “Find for yourself a man who will go with you, and I will give him wages while I live[b]; then go and get the silver.”
translation:
  language: de
  text: 'Und er gab ihm das Schriftstück[a] und sagte zu ihm: »Such dir einen Mann, der mit dir reisen wird. Ich werde ihm Lohn geben, solange ich lebe. Dann geh und hol das Silber[b].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der griechische Ausdruck bezeichnet etwas von Hand Geschriebenes. Gemeint ist hier offenbar das Dokument, das zu dem hinterlegten Geld gehörte; die parallele semitische Überlieferung weist ebenfalls auf ein Erkennungszeichen oder Dokument für die Hinterlegung hin.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »das Geld«. Das griechische Wort ἀργύριον bedeutet wörtlich »Silber«, bezeichnet hier aber die hinterlegten Geldmittel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: χειρόγραφον
  choice: Schriftstück
  rationale: Das Wort bezeichnet etwas von Hand Geschriebenes. Im Zusammenhang ist es das Dokument, das zu dem hinterlegten Geld gehört; »Schriftstück« bewahrt diesen konkreten Sinn, ohne die rechtliche Art als Schuldschein oder Quittung zu eng festzulegen.
- source_word: Ζήτησον σεαυτῷ ἄνθρωπον
  choice: Such dir einen Mann
  rationale: Die Formulierung gibt den ausdrücklich männlichen Singular ἄνθρωπον wieder und klingt zugleich in modernem Deutsch natürlich.
- source_word: συμπορεύσεταί
  choice: der mit dir reisen wird
  rationale: Das Verb bezeichnet gemeinsames Unterwegssein. »Mit dir reisen« bewahrt hier den konkreten Reisebezug.
- source_word: μισθὸν
  choice: Lohn
  rationale: μισθός bezeichnet die Bezahlung für eine Leistung oder einen Dienst; »Lohn« passt zur entlohnten Reisebegleitung.
- source_word: ἕως ζῶ
  choice: solange ich lebe
  rationale: Die Wiedergabe folgt der zeitlichen Formulierung des Griechischen und lässt deren ungewöhnlich weit klingende Zusage stehen, ohne sie erklärend einzuengen.
- source_word: λάβε πορευθεὶς τὸ ἀργύριον
  choice: Dann geh und hol das Silber
  rationale: Die partizipiale Wendung wird idiomatisch als Handlungsfolge wiedergegeben. »Silber« erhält die konkrete Grundbedeutung von ἀργύριον; im Kontext sind die hinterlegten Geldmittel gemeint.
