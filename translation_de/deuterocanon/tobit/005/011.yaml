  register: Modernes, würdevolles Standarddeutsch. Die direkte Anrede »Bruder« und die zwei parallelen Herkunftsfragen bleiben erhalten; die abschließende Aufforderung wird im Deutschen kontextgemäß idiomatisch formuliert.
