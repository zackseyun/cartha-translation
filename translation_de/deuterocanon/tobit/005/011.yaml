  text: And Tobit said to him, “Brother, from what tribe and from what homeland are you? Show me.”
translation:
  language: de
  text: 'Und Tobit sagte zu ihm: »Bruder, aus welchem Stamm und aus welcher Heimat kommst du? Sag es mir.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φυλή
  choice: Stamm
  rationale: Bezeichnet hier die Stammeszugehörigkeit und wird im biblischen Zusammenhang natürlich mit »Stamm« wiedergegeben.
- source_word: πατρίς
  choice: Heimat
  rationale: Bewahrt den Bezug auf Herkunftsland beziehungsweise Herkunftsort, ohne den Umfang unnötig festzulegen.
- source_word: ὑπόδειξόν μοι
  choice: Sag es mir
  rationale: Das Verb bedeutet wörtlich »zeige/weise mir auf«; im Kontext einer Frage nach der Herkunft ist die idiomatische deutsche Aufforderung »Sag es mir« gemeint.
theological_decisions: []
