base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/005/014.yaml
  text: And he said to him[a], “May you come in health, brother; and do not be angry with me because I sought to learn your tribe and your family. And you indeed turn out to be my brother, from a good and noble lineage. For I knew Ananias and Jathan, the sons of Shemaiah the great, as we used to go together to Jerusalem to worship, bringing the firstborn and the tithes of the produce; and they were not led astray in the error of our brothers. You are from a good root[b], brother.”
translation:
  language: de
  text: 'Und er sagte zu ihm: „Komm gesund an, Bruder![a] Sei mir nicht böse, dass ich nach deinem Stamm und deiner Familie gefragt habe, um sie kennenzulernen. Du erweist dich ja als mein Bruder aus gutem und edlem Geschlecht. Denn ich kannte Hananias und Jatan, die Söhne des großen Schemaja, als wir gemeinsam nach Jerusalem zogen, um anzubeten und die Erstgeburten und die Zehnten vom Ertrag darzubringen; sie wurden nicht in den Irrtum unserer Brüder[b] hineingezogen. Du stammst aus einer guten Wurzel, Bruder.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Mögest du gesund kommen.“ Gemeint ist ein herkömmlicher Wunsch für Wohlergehen oder eine sichere Ankunft; möglich ist auch: „Geh in Frieden und Gesundheit.“'
    reason: lexical_alternative
  - marker: b
    text: Mit „unseren Brüdern“ sind hier Volks- oder Stammesgenossen gemeint, nicht nur leibliche Brüder.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑγιαίνων ἔλθοις
  choice: Komm gesund an
  rationale: Gibt den griechischen Wunsch mit ἔλθοις („mögest du kommen/ankommen“) natürlich wieder, ohne ihn gegen den Wortlaut zu einem Abschiedsgruß umzudeuten.
- source_word: φυλήν
  choice: Stamm
  rationale: Bewahrt die für die israelitische Identität wichtige Stammeszugehörigkeit.
- source_word: πατριάν
  choice: Herkunftsfamilie
  rationale: Bezeichnet hier die väterliche Großfamilie beziehungsweise Abstammungslinie; „Herkunftsfamilie“ ist verständlich und unterscheidet den Begriff von „Stamm“.
- source_word: τυγχάνεις
  choice: du erweist dich ja als
  rationale: Bringt zum Ausdruck, dass sich die Verwandtschaft als Ergebnis der Nachforschung herausstellt.
- source_word: καλῆς καὶ ἀγαθῆς γενεᾶς
  choice: aus einem angesehenen und rechtschaffenen Geschlecht
  rationale: καλός und ἀγαθός bezeichnen hier sowohl den guten Ruf als auch die sittliche Güte der Abstammung; „Geschlecht“ wahrt den genealogischen Zusammenhang.
- source_word: κοινῶς
  choice: gemeinsam
  rationale: Bezeichnet die zusammen unternommenen Pilgerreisen.
- source_word: προσκυνεῖν
  choice: anzubeten
  rationale: Im Zusammenhang der Wallfahrt nach Jerusalem bezeichnet das Verb kultische Verehrung.
- source_word: τὰ πρωτότοκα
  choice: die Erstgeburten
  rationale: Bewahrt den kultisch-rechtlichen Begriff für die zuerst geborenen Tiere beziehungsweise die entsprechenden Gaben.
- source_word: τὰς δεκάτας τῶν γενημάτων
  choice: die Zehnten vom Ertrag
  rationale: Gibt sowohl den Zehnten als auch den landwirtschaftlichen Ertrag prägnant und ohne unnötige Einengung wieder.
- source_word: ἐπλανήθησαν ἐν τῇ πλάνῃ
  choice: ließen sich nicht durch den Irrweg ... in die Irre führen
  rationale: Bewahrt das griechische Wortspiel zwischen Verb und Substantiv in verständlichem Deutsch.
- source_word: ἐκ ῥίζης καλῆς
  choice: aus einer guten Wurzel
  rationale: Erhält das konkrete Herkunftsbild des griechischen Textes, statt es zu „aus einer guten Familie“ zu glätten.
theological_decisions:
- issue: Genealogische und verwandtschaftliche Sprache
  choice: Die konkreten Begriffe „Bruder“, „Stamm“, „Geschlecht“ und „Wurzel“ bleiben erhalten.
  alternative: Die Begriffe durch „Verwandter“ und allgemeinere Rede von einer guten Familie ersetzen.
  rationale: Der Vers betont Abstammung, Zugehörigkeit zu Israel und Treue im Gottesdienst. Die Bild- und Verwandtschaftssprache trägt diese soziale und theologische Spannung.
- issue: Bezeichnung des abweichenden Verhaltens der Volksgenossen
  choice: „Irrweg unserer Brüder“
  alternative: „Irrtum unserer Landsleute“
  rationale: „Brüder“ wahrt die gemeinsame israelitische Zugehörigkeit trotz der beschriebenen kultischen Abweichung; „Irrweg“ lässt offen, worin diese im Einzelnen bestand.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Anrede „Bruder“ und das Bild der „guten Wurzel“ wurden trotz ihrer leicht fremdartigen Wirkung beibehalten, weil sie die genealogische Wärme und Struktur des griechischen Textes tragen. Die Namen folgen gebräuchlichen deutschen biblischen Formen.
