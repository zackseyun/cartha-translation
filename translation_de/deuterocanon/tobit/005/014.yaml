    rationale: ἐπλανήθησαν ist passiv; die reflexive deutsche Form verschiebt die Aussage leicht auf ihre eigene Widerstandskraft. „Irrtum“ bildet πλάνη zudem unmittelbarer ab als „Irrweg“.
