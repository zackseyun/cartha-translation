  source_fidelity: Die Übersetzung gibt den Sinn weitgehend zutreffend wieder. Korrekturbedarf besteht bei ἐζήτησα ... ἐπιγνῶναι, das eine Erkundigung nach Stamm und Familie, nicht den Versuch eines persönlichen Kennenlernens bezeichnet. Außerdem sollte das Passiv von ἐπλανήθησαν nicht unnötig in eine aktiv-reflexive Form umgedeutet werden.
  naturalness: Der Stil ist überwiegend würdevoll und verständlich. „Herkunftsfamilie“ wirkt im heutigen Deutsch jedoch fachsprachlich und anachronistisch; „Familie“ ist hier natürlicher. Die Satzverbindung bei der Erinnerung an die gemeinsamen Jerusalemreisen wird näher am griechischen Zusammenhang gestaltet.
  terminology: „Stamm“, „Bruder“, „Erstgeburten“, „Zehnten“ und „Wurzel“ sind passend. „Gut und edel“ gibt καλῆς καὶ ἀγαθῆς ohne die stärkere moralische Festlegung von „rechtschaffen“ wieder. Die Namensformen Hananias, Jatan und Schemaja können beibehalten werden.
