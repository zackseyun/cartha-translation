  to: 'Und er sagte zu ihm: „Komm gesund an, Bruder![a] Sei mir nicht böse, dass ich nach deinem Stamm und deiner Familie gefragt habe, um sie kennenzulernen. Du erweist dich ja als mein Bruder aus gutem und edlem Geschlecht. Denn ich kannte Hananias und Jatan, die Söhne des großen Schemaja, als wir gemeinsam nach Jerusalem zogen, um anzubeten und die Erstgeburten und die Zehnten vom Ertrag darzubringen; sie wurden nicht in den Irrtum unserer Brüder[b] hineingezogen. Du stammst aus einer guten Wurzel, Bruder.“'
