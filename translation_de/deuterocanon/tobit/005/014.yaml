    issue: „weil ich versucht habe, deinen Stamm und deine Herkunftsfamilie kennenzulernen“
    rationale: ἐζήτησα ... ἐπιγνῶναι meint, die genealogische Zugehörigkeit zu erfragen bzw. festzustellen. „kennenlernen“ legt ein persönliches Bekanntwerden nahe; „Herkunftsfamilie“ ist zudem unnötig fachsprachlich.
  - severity: low
    issue: „angesehenen und rechtschaffenen Geschlecht“
    rationale: Die Wiedergabe legt καλός und ἀγαθός stärker auf gesellschaftliches Ansehen beziehungsweise moralische Rechtschaffenheit fest. „gut und edel“ erhält die wertende, genealogische Ausdrucksweise offener.
