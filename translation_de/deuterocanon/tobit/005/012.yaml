  text: And he said to him[a], “Are you seeking a tribe and a family line, or a hired man who will go with your son?” And Tobit said to him, “I want to know[c][b], brother,”
translation:
  language: de
  text: 'Da sagte er zu ihm: „Suchst du nach Stamm und Sippe[a] oder nach einem Lohnarbeiter, der mit deinem Sohn reisen wird?“ Tobit antwortete ihm: „Ich möchte es wissen, Bruder.“[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Stamm und Sippe“ bezeichnet die soziale und genealogische Zugehörigkeit; die beiden Ausdrücke müssen nicht zwei klar voneinander getrennte moderne Kategorien meinen.
    reason: cultural_note
  - marker: b
    text: 'Der griechische Text ist am Ende verkürzt und lautet wörtlich: „Ich möchte, Bruder.“ „Es wissen“ ist aus der vorausgehenden Frage ergänzt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Φυλὴν
  choice: Stamm
  rationale: φυλή bezeichnet hier die Zugehörigkeit zu einem Stamm beziehungsweise einer größeren Abstammungsgruppe; „Stamm“ bewahrt den sozialen und genealogischen Sinn.
- source_word: πατριὰν
  choice: Herkunft
  rationale: πατριά bezeichnet Familie, Sippe oder Abstammung. Im Deutschen gibt „Herkunft“ die erfragte genealogische Identität natürlich wieder, ohne moderne Kategorien zu scharf voneinander abzugrenzen.
- source_word: μίσθιον
  choice: Lohnarbeiter
  rationale: μίσθιος ist eine gegen Lohn angestellte Person. „Lohnarbeiter“ ist sachlich und vermeidet den abwertenden Beiklang von „Mietling“.
- source_word: συμπορεύσεται
  choice: begleiten soll
  rationale: Das Verb bedeutet, gemeinsam mit jemandem zu gehen oder zu reisen. Im Zusammenhang einer gesuchten Reisebegleitung ist „begleiten soll“ natürlich und präzise.
- source_word: Βούλομαι
  choice: Ich möchte es wissen
  rationale: Der griechische Wortlaut „Ich möchte, Bruder“ ist elliptisch. Das aus der vorausgehenden Frage erschlossene „es wissen“ macht den Sinn auf Deutsch verständlich, ohne einen neuen inhaltlichen Gedanken einzuführen.
- source_word: ἀδελφέ
  choice: Bruder
  rationale: Wörtlich „Bruder“; hier zugleich eine höfliche beziehungsweise vertrauliche Anrede. Die wörtliche Form bleibt erhalten.
