base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/005/006.yaml
  text: And the angel said to him[a], “I will go with you, and I am familiar with the way, and I have lodged with Gabael our brother.”
translation:
  language: de
  text: 'Und der Engel sagte zu ihm: „Ich werde mit dir gehen. Ich kenne den Weg gut und habe bei Gabaël, unserem Bruder, übernachtet.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πορεύσομαι μετὰ σοῦ
  choice: Ich werde mit dir gehen
  rationale: Das Futur von πορεύομαι und μετά mit Genitiv bezeichnen hier schlicht die zugesagte Begleitung; diese Wiedergabe ist natürlich und quellennah.
- source_word: τῆς ὁδοῦ ἐμπειρῶ
  choice: Ich kenne den Weg gut
  rationale: Die gedrängte griechische Wendung bezeichnet praktische Vertrautheit oder Erfahrung mit dem Reiseweg. Die Formulierung gibt dies in heutigem Deutsch klar wieder, ohne zusätzliche Einzelheiten aus der semitischen Parallele einzutragen.
- source_word: παρὰ Γαβαὴλ
  choice: bei Gabaël
  rationale: παρά mit einer Person bezeichnet im Zusammenhang mit ηὐλίσθην den Aufenthalt bei dieser Person beziehungsweise in ihrem Haus.
- source_word: τὸν ἀδελφὸν ἡμῶν
  choice: unserem Bruder
  rationale: Die direkte Wiedergabe bewahrt die familiäre Bezeichnung des Griechischen; ob ein leiblicher Bruder oder ein Volks- beziehungsweise Glaubensgenosse gemeint ist, wird nicht festgelegt.
- source_word: ηὐλίσθην
  choice: habe … übernachtet
  rationale: Das Verb αὐλίζομαι bezeichnet das Übernachten oder Beherbergtwerden. „Übernachtet“ ist im modernen Deutschen natürlicher als „genächtigt“ und präziser als das allgemeinere „war“.
theological_decisions:
- issue: Bedeutung von ὁ ἄγγελος
  choice: der Engel
  alternative: der Bote
  rationale: Im Erzählzusammenhang ist die Gestalt ein himmlischer Engel; „Engel“ ist daher die natürliche Wiedergabe von ἄγγελος, ohne daraus einen Eigennamen zu machen.
- issue: Bedeutungsumfang von ἀδελφός
  choice: Bruder
  alternative: Verwandter / Volksgenosse
  rationale: Die Übersetzung erhält den Wortlaut und seine mögliche soziale oder ethnische Weite, statt eine bestimmte verwandtschaftliche Beziehung festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Kurze Hauptsätze geben die dreigliedrige Aussage des Griechischen klar wieder. Der Name wird als „Gabaël“ geschrieben, damit die getrennte Aussprache der Vokale erkennbar bleibt.
