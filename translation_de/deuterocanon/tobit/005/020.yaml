  terminology: „Herr“ ist die etablierte, kontextgerechte Wiedergabe von κύριος. „Vom Herrn“ bildet die Herkunftsangabe παρὰ τοῦ κυρίου treffend ab, und „genügt uns“ entspricht idiomatisch ἱκανὸν ἡμῖν ὑπάρχει. Es werden keine zusätzlichen theologischen oder interpretativen Aussagen eingetragen.
