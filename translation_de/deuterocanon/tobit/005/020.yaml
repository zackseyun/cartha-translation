  text: For as it has been given to us by the Lord to live, this is enough for us.
translation:
  language: de
  text: Denn es ist uns vom Herrn gegeben zu leben; das genügt uns.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡς γὰρ
  choice: Denn
  rationale: „Denn“ gibt die begründende Funktion von γάρ natürlich wieder; die mit ὡς eingeleitete Grundlage wird im Deutschen durch den folgenden Aussagesatz ausgedrückt.
- source_word: δέδοται ἡμῖν
  choice: es ist uns gegeben
  rationale: Die Formulierung bewahrt den Empfänger im Dativ und den fortwirkenden Zustand des griechischen Perfekts, ohne im Deutschen schwerfällig zu klingen.
- source_word: ζῇν
  choice: zu leben
  rationale: Der verbale Infinitiv entspricht dem griechischen ζῇν genauer als das abstrakte Substantiv „Leben“.
- source_word: παρὰ τοῦ κυρίου
  choice: vom Herrn
  rationale: παρά mit Genitiv bezeichnet hier den Ursprung der Gabe; „vom Herrn“ bildet diese Herkunft im Deutschen unmittelbar ab.
- source_word: τοῦτο
  choice: das
  rationale: „Das“ verweist natürlich auf die zuvor genannte Gabe, leben zu dürfen, ohne den Bezug näher auszudeuten.
- source_word: ἱκανὸν ἡμῖν ὑπάρχει
  choice: das genügt uns
  rationale: Die idiomatische deutsche Wendung gibt die Bedeutung „ist für uns ausreichend“ klar und knapp wieder.
theological_decisions:
- issue: Wiedergabe von κύριος
  choice: Herr
  alternative: Gebieter
  rationale: „Herr“ ist in diesem ehrfürchtigen, auf Gott bezogenen Zusammenhang die übliche und sachlich passende Wiedergabe, ohne zusätzliche Bestimmungen einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der mit einem Semikolon verbundene Parallelbau hält Gabe und Genügsamkeit eng zusammen und bewahrt zugleich die schlichte Aussageform des Griechischen.
