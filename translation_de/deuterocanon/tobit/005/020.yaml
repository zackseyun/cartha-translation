  source_fidelity: 'Die Übersetzung gibt die Aussage des griechischen Satzes zuverlässig wieder: Das Leben ist den Sprechenden vom Herrn gegeben, und dies wird als ausreichend bezeichnet. „Denn“ vermittelt die begründende Funktion von ὡς γὰρ in natürlichem Deutsch. Das deutsche „ist ... gegeben“ kann den fortgeltenden Resultatszustand des griechischen Perfekts δέδοται angemessen ausdrücken.'
