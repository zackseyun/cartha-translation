  text: But how will I be able to get the money[b][a], since I do not know him?
translation:
  language: de
  text: Aber wie soll ich das Geld[a] bekommen, wenn ich ihn nicht kenne?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „das Silber“; gemeint ist hier die hinterlegte Geldsumme.'
    reason: lexical_alternative
  - marker: b
    text: 'Eine parallele aramäische Fassung, die auch in hebräischer Rückübersetzung vorliegt, führt den Gedanken ausführlicher aus: „Wie kann ich das Geld von Gabaël nehmen? Er wird mich nicht erkennen, und ich kenne ihn nicht …“ Damit wird ausdrücklich gesagt, dass beide einander nicht kennen.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλὰ
  choice: Aber
  rationale: Die adversative Partikel leitet einen praktischen Einwand gegen den vorausgehenden Auftrag ein; „Aber“ ist dafür im Deutschen der natürliche Anschluss.
- source_word: πῶς
  choice: wie
  rationale: Das Fragewort bezeichnet unmittelbar die Art und Weise, in der das Geld erlangt werden soll.
- source_word: δυνησομαι
  choice: soll ich … bekommen
  rationale: Die griechische Futurform von δύναμαι fragt nach der künftigen Möglichkeit. Im Deutschen gibt die idiomatische Frage „Wie soll ich …?“ die praktische Unmöglichkeit beziehungsweise Ratlosigkeit natürlich wieder.
- source_word: λαβεῖν
  choice: bekommen
  rationale: λαμβάνω kann „nehmen“ oder „empfangen“ bedeuten. Im Zusammenhang mit der Rückholung hinterlegten Geldes bezeichnet „bekommen“ den Vorgang klar, ohne eine gewaltsame oder eigenmächtige Wegnahme anzudeuten.
- source_word: τὸ ἀργύριον
  choice: das Geld
  rationale: ἀργύριον bedeutet wörtlich „Silber“, kann aber auch Geld bezeichnen. Hier geht es um eine hinterlegte Geldsumme, weshalb „das Geld“ für heutige Leser sachlich klar ist.
- source_word: καὶ
  choice: wenn
  rationale: Das formal koordinierende καί verbindet hier die fehlende Bekanntschaft mit der Schwierigkeit, das Geld zu erhalten. „wenn“ bildet diesen situativen Zusammenhang im Deutschen natürlich ab, ohne ihn stärker kausal festzulegen.
- source_word: οὐ γινώσκω
  choice: ich … nicht kenne
  rationale: γινώσκω bezeichnet hier persönliche Bekanntschaft beziehungsweise die Fähigkeit, die betreffende Person zu erkennen; „nicht kennen“ wahrt diese Bedeutungsbreite.
- source_word: αὐτόν
  choice: ihn
  rationale: Das maskuline Pronomen verweist auf den Mann, bei dem das Geld hinterlegt ist.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Frageform des Griechischen bleibt erhalten; „Wie soll ich …?“ klingt natürlicher als das schwerfälligere „Wie werde ich imstande sein …?“. Die Fußnotenmarker stehen jeweils unmittelbar bei dem Ausdruck beziehungsweise Satzteil, den sie erläutern.
