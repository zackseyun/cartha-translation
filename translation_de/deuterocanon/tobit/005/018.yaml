base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/005/018.yaml
  text: But Anna his mother wept and said to Tobit[a], “Why did you send our child away? Is he not the staff of our hand as he goes in and goes out before us?”
translation:
  language: de
  text: 'Doch seine Mutter Anna weinte und sagte zu Tobit: »Warum hast du unser Kind fortgeschickt? Ist es nicht der Stab in unserer Hand[a], wenn es vor uns ein und aus geht?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das heißt sinngemäß: »unsere Stütze« oder »unser Halt«. Der Haupttext bewahrt das Bild des griechischen Textes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔκλαυσεν
  choice: weinte
  rationale: Der Aorist von κλαίω bezeichnet Weinen oder Klagen; »weinte« gibt Annas Schmerz knapp und eindeutig wieder.
- source_word: ἐξαπέστειλας
  choice: hast du … fortgeschickt
  rationale: Das zusammengesetzte Verb bezeichnet das Weg- oder Aussenden; »fortgeschickt« lässt Annas Empfinden der Trennung hervortreten.
- source_word: τὸ παιδίον ἡμῶν
  choice: unser Kind
  rationale: παιδίον kann »Kind« oder »Junge« bedeuten. »Unser Kind« bewahrt den liebevollen mütterlichen Blick, ohne Alter oder Geschlecht stärker festzulegen, als es der Ausdruck selbst tut.
- source_word: ἡ ῥάβδος τῆς χειρὸς ἡμῶν
  choice: der Stab in unserer Hand
  rationale: Die Wendung ist ein Bild für Halt und Unterstützung. Die deutsche Fassung bewahrt das Bild des Stabes, formuliert das griechische Genitivattribut jedoch verständlich und natürlich.
- source_word: ἐν τῷ εἰσπορεύεσθαι αὐτὸν καὶ ἐκπορεύεσθαι
  choice: wenn es … ein und aus geht
  rationale: Die substantivierte Infinitivkonstruktion beschreibt ein gewohntes Kommen und Gehen. Die bewusst rhythmische Wendung erhält den semitisch geprägten Ausdruck.
- source_word: ἐνώπιον ἡμῶν
  choice: vor uns
  rationale: Dies ist die direkte und im Zusammenhang verständliche Wiedergabe; sie bezeichnet das Geschehen in der Gegenwart und vor den Augen der Eltern.
