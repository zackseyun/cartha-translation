base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/005/021.yaml
  text: And Tobit said to her[a], “Do not worry, sister; he will return safe and sound, and your eyes will see him.”
translation:
  language: de
  text: 'Und Tobit sagte zu ihr: »Mach dir keine Sorgen, Schwester[a]. Er wird gesund zurückkommen, und deine Augen werden ihn sehen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: »Schwester« ist die wörtliche griechische Anrede. Tobit spricht hier zu seiner Frau; die Bezeichnung ist familiär beziehungsweise ehelich gemeint, nicht als Hinweis auf eine leibliche Schwester.
    reason: cultural_note
lexical_decisions:
- source_word: Μὴ λόγον ἔχε
  choice: Mach dir keine Sorgen
  rationale: Die Wendung lautet wörtlich etwa »habe kein Wort/keine Sache«, dient hier aber als beruhigender Zuspruch. »Mach dir keine Sorgen« gibt ihre Funktion in natürlichem, modernem Deutsch wieder.
- source_word: ἀδελφή
  choice: Schwester
  rationale: Das griechische Wort bedeutet wörtlich »Schwester«. Hier ist es eine familiäre Anrede Tobits an seine Frau; die Übersetzung bewahrt die Ausdrucksweise des Ausgangstextes und erläutert sie in einer Fußnote.
- source_word: ὑγιαίνων
  choice: gesund
  rationale: Das Partizip bezeichnet einen gesunden, unversehrten Zustand und bezieht sich darauf, wie der Sohn zurückkommen wird. »Gesund« wahrt die konkrete Bedeutung, ohne zusätzliche Sicherheit ausdrücklich in den Text einzutragen.
- source_word: ἐλεύσεται
  choice: wird … zurückkommen
  rationale: Das Verb bedeutet grundsätzlich »wird kommen«. Da vom abwesenden Sohn und seiner Heimkehr die Rede ist, gibt »zurückkommen« die im Kontext enthaltene Richtung natürlich wieder.
- source_word: οἱ ὀφθαλμοί σου ὄψονται αὐτόν
  choice: deine Augen werden ihn sehen
  rationale: Die ausdrückliche Nennung der Augen wird beibehalten, weil sie die Anschaulichkeit und emotionale Kraft des griechischen Satzes trägt und auch im Deutschen verständlich ist.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede ist natürlich formuliert; die bildhafte Wendung »deine Augen werden ihn sehen« und die wörtliche Anrede »Schwester« bleiben erhalten.
