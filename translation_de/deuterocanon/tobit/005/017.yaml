base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/005/017.yaml
  text: They agreed to this[a]. Then he said to Tobiah, “Get ready for the journey, and may your journey be prosperous.” So his son prepared what was needed for the journey. Then his father said to him, “Go with the man, and may God, who dwells in heaven, make your journey prosper, and may his angel go with you.” So both went out to depart[b], and the boy’s dog went with them.
translation:
  language: de
  text: 'Sie waren damit einverstanden. Dann sagte er zu Tobias: »Mach dich für die Reise bereit, und möge eure Reise gelingen.[a]« Sein Sohn bereitete alles vor, was für die Reise nötig war. Da sagte sein Vater zu ihm: »Geh mit dem Mann. Gott, der im Himmel wohnt, wird eure Reise gelingen lassen, und sein Engel[b] möge euch begleiten.« Da gingen beide hinaus, um aufzubrechen, und der Hund des Jungen ging mit ihnen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das Griechische hat hier die Pluralform: »Möget ihr auf dem Weg Erfolg haben«, obwohl Tobias unmittelbar angeredet wird.'
    reason: grammatical_ambiguity
  - marker: b
    text: Das griechische Wort kann auch »Bote« bedeuten; im Zusammenhang des Tobitbuches ist sehr wahrscheinlich ein himmlischer Engel gemeint.
    reason: alternative_reading
lexical_decisions:
- source_word: εὐδόκησαν οὕτως
  choice: Sie waren damit einverstanden
  rationale: Das Verb bezeichnet hier im Zusammenhang die Zustimmung zu dem zuvor besprochenen Vorhaben; die deutsche Wendung gibt dies natürlich wieder.
- source_word: Ἔτοιμος γίνου πρὸς τὴν ὁδόν
  choice: Mach dich für die Reise bereit
  rationale: Die Aufforderung und der Bezug auf die bevorstehende Reise werden klar und in gegenwärtigem Deutsch ausgedrückt.
- source_word: εὐοδωθεῖητε
  choice: möge eure Reise gelingen
  rationale: Der Optativ formuliert einen Wunsch um Erfolg auf dem Weg. Die Pluralform wird mit »eure« bewahrt, obwohl unmittelbar Tobias angeredet wird.
- source_word: τὰ πρὸς τὴν ὁδόν
  choice: alles, was für die Reise nötig war
  rationale: Die knappe griechische Wendung bezeichnet die nötigen Reisevorbereitungen oder Reisegegenstände, ohne diese näher festzulegen.
- source_word: ὁ ἐν τῷ οὐρανῷ οἰκῶν θεός
  choice: Gott, der im Himmel wohnt
  rationale: Die partizipiale Gottesbezeichnung wird eng am Wortlaut und zugleich idiomatisch wiedergegeben.
- source_word: εὐοδώσει τὴν ὁδὸν ὑμῶν
  choice: möge eure Reise gelingen lassen
  rationale: Die Form ist grammatisch Futur, steht im Segenswunsch jedoch funktional als vertrauensvolle Bitte beziehungsweise Zusage. Die Wiedergabe hält den Zusammenhang mit εὐοδωθεῖητε fest.
- source_word: ὁ ἄγγελος αὐτοῦ συμπορευθήτω ὑμῖν
  choice: sein Engel möge euch begleiten
  rationale: »Begleiten« gibt das gemeinsame Reisen natürlich wieder; im Erzählzusammenhang von Tobit bezeichnet ἄγγελος am wahrscheinlichsten ein himmlisches Wesen.
- source_word: ἐξῆλθαν ἀμφότεροι ἀπελθεῖν
  choice: Da gingen beide hinaus, um aufzubrechen
  rationale: Die leichte Redundanz des griechischen Ausdrucks wird bewahrt, ohne im Deutschen schwerfällig zu wirken.
- source_word: ὁ κύων τοῦ παιδαρίου
  choice: der Hund des Jungen
  rationale: Die konkrete, erzählerische Bezeichnung wird schlicht und anschaulich wiedergegeben.
theological_decisions:
- issue: Bedeutung von ἄγγελος
  choice: Engel
  alternative: Bote
  rationale: Das Wort kann allgemein »Bote« bedeuten. Im literarischen Zusammenhang des Tobitbuches ist jedoch ein himmlischer Engel gemeint; die Fußnote hält die lexikalische Alternative sichtbar.
- issue: Aussageform von εὐοδώσει
  choice: möge ... gelingen lassen
  alternative: wird ... gelingen lassen
  rationale: Das griechische Futur kann als zuversichtliche Aussage verstanden werden. Im Zusammenhang der unmittelbar folgenden Wunschform »möge sein Engel ...« ist eine Segensbitte im Deutschen gut begründet, ohne die Alternative zu verschweigen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Tobias« folgt der im Deutschen geläufigen Namensform. Die Segenswünsche bleiben als Wünsche formuliert; die Pluralformen des griechischen Textes werden bewahrt.
