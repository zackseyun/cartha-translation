base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/005/022.yaml
  text: For a good angel will go with him, and his journey will be successful, and he will return in good health.
translation:
  language: de
  text: Denn ein guter Engel wird ihn begleiten; seine Reise wird gelingen, und er wird gesund zurückkehren.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄγγελος
  choice: Engel
  rationale: Im Erzählzusammenhang des Tobitbuches ist ein himmlisches Wesen gemeint, nicht lediglich ein menschlicher Bote.
- source_word: ἀγαθὸς
  choice: gut
  rationale: Die schlichte Wiedergabe bewahrt die Charakterisierung des Engels, ohne seine Rolle näher auszudeuten.
- source_word: συνπορεύσεται
  choice: wird ihn begleiten
  rationale: Das Verb bezeichnet das Mitgehen beziehungsweise gemeinsame Reisen; »begleiten« ist im Deutschen natürlich und präzise.
- source_word: εὐοδωθήσεται
  choice: wird gelingen
  rationale: Die Passivform beschreibt einen guten, erfolgreichen Verlauf. Bezogen auf die Reise gibt »wird gelingen« den Sinn idiomatisch wieder.
- source_word: ἡ ὁδὸς αὐτοῦ
  choice: seine Reise
  rationale: Wörtlich steht »sein Weg«; im gegebenen Reisekontext bezeichnet die Wendung den Reiseverlauf.
- source_word: ὑποστρέψει
  choice: wird zurückkehren
  rationale: Das Verb bedeutet hier klar, an den Ausgangsort zurückzukehren.
- source_word: ὑγιαίνων
  choice: gesund
  rationale: Das prädikativ gebrauchte Partizip hebt körperliches Wohlergehen bei der Rückkehr hervor.
theological_decisions:
- issue: Bedeutung von ἄγγελος im Kontext
  choice: himmlischer Engel
  alternative: Bote im allgemeinen Sinn
  rationale: Die Erzählwelt des Tobitbuches identifiziert den Reisebegleiter als Engel. »Engel« entspricht daher dem gemeinten Bezug, ohne zusätzliche dogmatische Aussagen einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzglieder folgen der dreiteiligen Zusage des Griechischen; das Semikolon verhindert eine schwerfällige Wiederholung von »und«, ohne die enge Gedankenverbindung aufzulösen.
