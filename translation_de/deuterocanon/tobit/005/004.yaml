  - severity: low
    issue: Unnötiger Satzanschluss „Da“
    rationale: „Da“ ist nicht sinnwidrig, aber das griechische καί wird durch die direkte Reihung „und fand“ schlichter und näher am Erzählstil wiedergegeben.
