base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/005/004.yaml
  text: And he went to look for a man[a], and he found Raphael, who was an angel, but he did not know it.
translation:
  language: de
  text: Und er ging los, um einen Mann zu suchen, und fand Rafael, der ein Engel war. Tobias wusste jedoch nicht, dass Rafael ein Engel war.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπορεύθη
  choice: ging los
  rationale: Das deponentische Aoristverb bezeichnet hier den Beginn des Suchgangs. „Ging los“ ist im modernen Deutschen natürlich und bewahrt die schlichte Erzählfolge.
- source_word: ζητῆσαι
  choice: um … zu suchen
  rationale: Der Infinitiv bezeichnet den Zweck des Gehens. Die deutsche Konstruktion „um … zu suchen“ gibt dies unmittelbar wieder.
- source_word: ἄνθρωπον
  choice: einen Mann
  rationale: ἄνθρωπον bezeichnet hier im Zusammenhang einen männlichen Reisebegleiter; „einen Mann“ entspricht der Form und dem erzählten Kontext genauer als das allgemeinere „jemanden“.
- source_word: εὗρεν
  choice: Da fand er
  rationale: „Fand“ ist die direkte erzählerische Entsprechung. „Da“ stellt im Deutschen flüssig den Anschluss her, ohne zusätzliche inhaltliche Information einzuführen.
- source_word: Ῥαφαήλ
  choice: Rafael
  rationale: „Rafael“ ist die im Deutschen gebräuchliche Form des Namens.
- source_word: ἄγγελος
  choice: Engel
  rationale: Obwohl ἄγγελος grundsätzlich auch „Bote“ bedeuten kann, bezeichnet es Rafael in diesem Erzählzusammenhang als himmlisches Wesen.
- source_word: οὐκ ᾔδει
  choice: er wusste es aber nicht
  rationale: Das im Griechischen unausgesprochene Objekt bezieht sich auf Rafaels Identität als Engel. Das Pronomen „es“ macht diesen Bezug im Deutschen natürlich deutlich; „aber“ gibt den erzählerischen Gegensatz wieder.
theological_decisions:
- issue: Rafaels Identität als ἄγγελος
  choice: Im Haupttext „Engel“
  alternative: Bote
  rationale: Der Erzähler bezeichnet Rafael hier als übermenschliches Engelwesen. „Bote“ würde die vom Erzähler bereits offengelegte Identität unnötig verdunkeln.
- issue: Wissen um Rafaels Identität
  choice: Das Subjekt bleibt durch „er“ unausdrücklich benannt
  alternative: Den Namen Tobias ergänzen
  rationale: Das Griechische nennt das Subjekt von οὐκ ᾔδει nicht ausdrücklich. Die Übersetzung bewahrt diese grammatische Form und ergänzt keinen Namen.
translation_notes:
  register: Moderner, würdevoller Erzählstil mit klarer Syntax. Die Satzteilung erhöht die Lesbarkeit, ohne die Abfolge oder den Sinn des griechischen Textes zu verändern. Keine Fußnote wurde übernommen, da die englische Anmerkung bei „man“ offenbar ἄνθρωπος mit ἄγγελος verwechselt; die mögliche Bedeutung „Bote“ gehört zu ἄγγελος, ist hier aber kontextuell nicht die passende Hauptübersetzung.
