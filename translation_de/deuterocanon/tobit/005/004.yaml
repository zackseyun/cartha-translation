  verdict: revise
  source_fidelity: 'Der Entwurf gibt die Abfolge und den Sinn des Griechischen im Wesentlichen zutreffend wieder: Weggehen mit dem Zweck zu suchen, Finden Rafaels und dessen Identität als Engel. Die deutsche Schlussformulierung lässt jedoch das Subjekt von „wusste“ wegen des unmittelbar vorher genannten Rafael unnötig mehrdeutig erscheinen. Im Griechischen ist aus dem Erzählzusammenhang klar, dass der suchende Tobias nichts von Rafaels Engelidentität wusste.'
  naturalness: „Und er ging los“ und „Da fand er“ sind verständlich, doch eine einheitliche Satzführung mit „und fand“ folgt der knappen griechischen Erzählfolge natürlicher. Die ausdrückliche Benennung von Tobias im letzten Satz verhindert im Deutschen ein potenziell missverständliches Pronomen.
  terminology: '„Rafael“ ist die gebräuchliche deutsche Namensform; „Engel“ trifft ἄγγελος im erzählerischen Kontext. Keine Fußnote ist erforderlich. Der englische Audit-Trail hat seine Fußnote offenbar falsch an „man“ verankert: Die dort erläuterte Alternative „messenger/Bote“ betrifft ἄγγελος, nicht ἄνθρωπον.'
