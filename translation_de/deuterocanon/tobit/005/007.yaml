base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/005/007.yaml
  text: And Tobiah said to him[a], “Wait for me, and I will tell my father.”
translation:
  language: de
  text: 'Und Tobias sagte zu ihm[a]: „Warte auf mich; ich will es meinem Vater sagen.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Text ist knapp: „Und Tobias sagte zu ihm: ‚Warte auf mich; ich will es meinem Vater sagen.‘“ Eine parallele Überlieferung in semitischer Form gestaltet die Szene ausführlicher: Tobias geht zu seinem Vater, berichtet ihm von dem Mann, den er gefunden hat, und geht dann hinaus, um ihn zu rufen. Der Haupttext folgt dem griechischen Text; die ausführlichere Fassung wird hier vermerkt.'
    reason: textual_variant
lexical_decisions:
- source_word: Ὑπόμεινόν με
  choice: Warte auf mich
  rationale: Der Aorist-Imperativ von ὑπομένω fordert den Mann in diesem Zusammenhang auf, zu warten, während Tobija mit seinem Vater spricht. „Warte auf mich“ ist im modernen Deutschen natürlich und bewahrt den Bezug des griechischen με.
- source_word: ἐρῶ
  choice: ich will es … sagen
  rationale: Die Futurform von λέγω bezeichnet hier Tobijas Absicht, seinen Vater über die Begegnung zu informieren. Das ergänzte „es“ ist im Deutschen idiomatisch, ohne den knappen griechischen Sinn inhaltlich auszuweiten.
- source_word: τῷ πατρί
  choice: meinem Vater
  rationale: Der griechische Artikel steht bei einer nahen Verwandtschaftsbezeichnung, wo modernes Deutsch in direkter Rede gewöhnlich ein Possessivpronomen verwendet. Gemeint ist Tobijas eigener Vater, Tobit.
- source_word: Τωβίας
  choice: Tobija
  rationale: „Tobija“ gibt die semitische Namensform in einer im Deutschen etablierten biblischen Schreibweise wieder und unterscheidet den Sohn sprachlich klar von Tobit.
