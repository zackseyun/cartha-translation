base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/005/001.yaml
  text: And Tobiah answered him[a], “Father, I will do everything that you have commanded me.”
translation:
  language: de
  text: 'Und Tobias antwortete ihm[a]: »Vater, ich werde alles tun, was du mir geboten hast.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das parallele semitisch geprägte Zeugnis formuliert ausdrücklich: »Tobias antwortete seinem Vater … Alles, was du mir geboten hast, mein Vater, werde ich tun.« Der griechische Hauptzeuge hat schlichter »antwortete ihm« und die Anrede »Vater«.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποκριθεὶς
  choice: antwortete
  rationale: Das griechische narrative Partizip leitet die direkte Rede ein; im natürlichen Deutschen wird es passend als finites Verb wiedergegeben.
- source_word: Τωβίας
  choice: Tobija
  rationale: Die im modernen deutschen Bibelgebrauch geläufige semitisch orientierte Namensform vermeidet eine unnötige Latinisierung als »Tobias«.
- source_word: αὐτῷ
  choice: ihm
  rationale: Das Pronomen wird entsprechend dem griechischen Hauptzeugen wiedergegeben, ohne den Bezug im Haupttext zu »seinem Vater« zu erweitern; die Anrede macht ihn klar.
- source_word: Πάτερ
  choice: Vater
  rationale: Die direkte Anrede entspricht dem griechischen Vokativ. Das im parallelen semitisch geprägten Zeugnis stehende Possessiv wird nicht in den Haupttext übernommen.
- source_word: ποιήσω
  choice: ich werde … tun
  rationale: Das Futur bezeichnet hier Tobijas erklärte Absicht zum Gehorsam; die Formulierung ist direkt und idiomatisch.
- source_word: πάντα ὅσα
  choice: alles, was
  rationale: Diese natürliche deutsche Verbindung gibt den umfassenden Bezug der beiden griechischen Ausdrücke präzise wieder.
- source_word: ἐντέταλσαί μοι
  choice: du mir geboten hast
  rationale: Das Perfekt bezeichnet einen erteilten Auftrag mit fortdauernder Geltung. »Geboten« wahrt die Verbindlichkeit, ohne die familiäre Aussage unnötig zu verschärfen.
