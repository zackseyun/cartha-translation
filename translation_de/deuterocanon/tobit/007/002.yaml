base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/007/002.yaml
  text: And Edna said to his wife[b][a], “How much the young man Tobit resembles my nephew!”
translation:
  language: de
  text: 'Und Edna sagte zu seiner Frau[a]: »Wie ähnlich ist doch der junge Mann Tobit meinem Neffen[b]!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'So lautet der griechische Text: „Edna sagte zu seiner Frau.“ In der semitischen Parallelüberlieferung spricht dagegen Raguël zu seiner Frau Edna. Der Zusammenhang könnte auf eine Unregelmäßigkeit in der Textüberlieferung hindeuten.'
    reason: textual_variant
  - marker: b
    text: 'Oder: „meinem Cousin“. Das griechische Verwandtschaftswort kann auch allgemeiner einen nahen männlichen Verwandten bezeichnen; „Neffe“ ist die spezifischere Bedeutung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ εἶπεν
  choice: Und … sagte
  rationale: Die schlichte Erzählverknüpfung und das Redeverb werden im Deutschen natürlich mit „Und … sagte“ wiedergegeben.
- source_word: Ἔδνα
  choice: Edna
  rationale: Der Personenname wird in seiner üblichen deutschen Form beibehalten.
- source_word: τῇ γυναικὶ αὐτοῦ
  choice: zu seiner Frau
  rationale: γυνή bezeichnet hier eine Ehefrau; das Possessivpronomen αὐτοῦ wird trotz der auffälligen Verbindung mit Edna als genanntem Sprecher formal bewahrt.
- source_word: Ὡς ὅμοιος
  choice: Wie ähnlich ist
  rationale: Das exklamative ὡς und das prädikative ὅμοιος ergeben einen Ausruf über die starke Ähnlichkeit; „Wie ähnlich ist …“ wahrt Form und Nachdruck.
- source_word: ὁ νεανίσκος
  choice: der junge Mann
  rationale: νεανίσκος bezeichnet einen jungen Mann; die gewählte Formulierung ist modern, klar und würdevoll.
- source_word: Τωβεὶτ τῷ ἀνεψιῷ μου
  choice: meinem Neffen Tobit
  rationale: Τωβεὶτ wird als Name in Apposition zur durch den Dativ markierten Vergleichsperson verstanden. ἀνεψιός wird im Haupttext mit der spezifischen Bedeutung „Neffe“ wiedergegeben; die mögliche weitere Verwandtschaftsbedeutung wird in einer Fußnote erhalten.
theological_decisions:
- issue: Sprecherangabe und Possessivbezug
  choice: Der griechische Text wird unverändert als „Edna sagte zu seiner Frau“ übersetzt.
  alternative: „Raguël sagte zu seiner Frau Edna“ beziehungsweise „Raguël sagte zu Edna, seiner Frau“.
  rationale: Der maßgebliche griechische Text nennt ausdrücklich Edna als Sprecher und fügt „zu seiner Frau“ hinzu. Das ist im Zusammenhang auffällig und weicht von der semitischen Parallele ab, in der Raguël zu seiner Frau Edna spricht. Die Übersetzung emendiert den griechischen Text nicht stillschweigend, sondern macht die Überlieferungsspannung in der Fußnote sichtbar.
translation_notes:
  register: Modernes Standarddeutsch in schlichter, würdevoller Erzählprosa. Der Ausruf bildet die griechische Satzgestalt möglichst eng ab, ohne die auffällige Lesart des Ausgangstextes zu glätten.
