- from: 'Und Raguël fragte sie: „Woher kommt ihr, Brüder?“ Sie antworteten ihm: „Wir gehören zu den Nachkommen Naftalis[a], die aus Ninive verschleppt worden sind[b].“'
  to: 'Und Raguël fragte sie: „Woher kommt ihr, Brüder?“ Sie antworteten ihm: „Wir sind Nachkommen Naftalis und gehören zu den Gefangenen aus Ninive[b].“'
