base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/007/003.yaml
  text: And Raguel asked them[a], “Where are you from, brothers?” And they said to him, “We are from the sons of Naphtali[b], the captives from Nineveh.”
translation:
  language: de
  text: 'Und Raguël fragte sie: „Woher kommt ihr, Brüder?“ Sie antworteten ihm: „Wir sind Nachkommen Naftalis und gehören zu den Gefangenen aus Ninive[b].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'Oder: „den Gefangenen in Ninive“. Das griechische Wort bezeichnet Menschen, die gefangen genommen wurden. Die Verbindung von „aus Ninive“ kann je nach Verständnis die Herkunft bezeichnen oder die Gefangenen als in Ninive befindlich kennzeichnen.'
    reason: textual_ambiguity
lexical_decisions:
- source_word: ἠρώτησεν
  choice: fragte
  rationale: Das übliche und natürliche deutsche Erzählverb für das Stellen einer Frage.
- source_word: Πόθεν ἐστέ
  choice: Woher kommt ihr?
  rationale: Idiomatic German question about origin, accurately reflecting the Greek.
- source_word: ἀδελφοί
  choice: Brüder
  rationale: Preserves the masculine form of address in the Greek; in context it is a cordial address.
- source_word: Ἐκ τῶν υἱῶν Νεφθαλεὶ
  choice: Wir gehören zu den Nachkommen Naftalis
  rationale: The Greek literally says 'from the sons of Naphtali' and denotes descent or tribal affiliation. This wording is natural in modern German while retaining the genealogical sense.
- source_word: τῶν αἰχμαλώτων
  choice: die ... verschleppt worden sind
  rationale: Expresses the coercive force of αἰχμάλωτοι more clearly than the broader 'Verbannte' and identifies them as people taken away into captivity.
- source_word: ἐκ Νινευή
  choice: aus Ninive
  rationale: Formally preserves the repeated ἐκ. In combination with 'verschleppt worden sind,' however, the phrase can suggest removal out of Nineveh; a footnote therefore preserves the contextual alternative that they are captives in Nineveh.
