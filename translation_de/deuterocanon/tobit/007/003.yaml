translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Nachkommen Naftalis“ vermeidet die im Deutschen schwerfällige wörtliche Form „Söhne Naftalis“, während die Fußnote den griechischen Wortlaut dokumentiert. Die mögliche Mehrdeutigkeit von ἐκ Νινευή wird nicht stillschweigend beseitigt.
