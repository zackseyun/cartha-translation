  verdict: revise
  source_fidelity: 'Die Aussage über die Zugehörigkeit zu den Nachkommen Naftalis und den Status als αἰχμάλωτοι ist grundsätzlich erfasst. „aus Ninive verschleppt worden“ kehrt jedoch die naheliegende Bezugsrichtung von ἐκ Νινευή um: Es legt eine Verschleppung weg aus Ninive nahe, während der griechische Ausdruck die Gefangenen mit Ninive verbindet und syntaktisch als „aus Ninive“ stehen bleibt. Die räumliche Deutung „in Ninive“ sollte als Alternative vermerkt werden.'
  naturalness: „Woher kommt ihr, Brüder?“ und „Sie antworteten ihm“ sind natürliches, würdiges modernes Standarddeutsch. Die revidierte zweite Antwort vermeidet die semantisch irreführende passive Umschreibung und bleibt gut lesbar.
  terminology: „Raguël“, „Naftali“, „Brüder“ und „Nachkommen Naftalis“ sind angemessen. „Gefangene“ gibt αἰχμάλωτοι direkt wieder und bewahrt gegenüber dem enger lenkenden „verschleppt worden“ sowohl die Gefangenschaft als auch die knappe Form des griechischen Textes.
  issues:
  - severity: medium
    issue: „die aus Ninive verschleppt worden sind“
    rationale: Diese Formulierung stellt Ninive als Ausgangsort einer Verschleppung dar. Das griechische ἐκ Νινευή kann zwar formal „aus Ninive“ heißen, verbindet die Gefangenen im Kontext aber mit Ninive; es besagt nicht, dass sie aus Ninive wegverschleppt wurden.
  revised_text: 'Und Raguël fragte sie: „Woher kommt ihr, Brüder?“ Sie antworteten ihm: „Wir sind Nachkommen Naftalis und gehören zu den Gefangenen aus Ninive[b].“'
