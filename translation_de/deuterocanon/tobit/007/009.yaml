  yaml_path: translation/deuterocanon/tobit/007/009.yaml
  text: And they slaughtered a ram from the flock and set out many dishes. Then Tobiah said to Raphael, “Azariah, brother, speak about the matter you were talking about on the journey, and let the matter be brought to completion.”
translation:
  language: de
  text: 'Und sie schlachteten einen Widder aus der Herde und trugen viele Speisen auf. Da sagte Tobias zu Rafael: »Asarja, Bruder, sprich über das, worüber du auf der Reise gesprochen hast, und die Sache soll zum Abschluss gebracht werden.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κριὸν προβάτων
  choice: einen Widder aus der Herde
  rationale: Gibt das männliche Schaf und seine Zugehörigkeit zur Herde natürlich und präzise wieder.
- source_word: ὄψα πλείονα
  choice: reichlich Speisen
  rationale: ὄψα bezeichnet hier aufgetragene Gerichte bzw. Speisen; πλείονα drückt eine größere, üppige Menge aus.
- source_word: τελεσθήτω τὸ πρᾶγμα
  choice: damit die Sache zum Abschluss kommt
  rationale: Bewahrt den Aufforderungscharakter des griechischen Imperativs und gibt die Vollendung der Angelegenheit idiomatisch wieder.
theological_decisions:
- issue: Inhalt der unterwegs besprochenen Sache
  choice: das, wovon du unterwegs gesprochen hast
  alternative: die Sache, von der du unterwegs gesprochen hast
  rationale: Das relative ὑπὲρ ὧν bleibt inhaltlich offen; der Kontext wird nicht durch eine ausdrückliche Benennung oder theologische Deutung ergänzt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Anrede »Bruder Asarja« bewahrt die Reihenfolge und Vertrautheit des griechischen Ausdrucks; direkte Rede ist flüssig und ohne unnötige Archaismen gestaltet.
