  yaml_path: translation/deuterocanon/tobit/007/011.yaml
  text: I gave my child to seven men[a], and whenever they went in to her, they died during the night. But for now, be cheerful. And Tobiah said[b], “I will taste nothing here until you settle and conclude the matter with me.”
translation:
  language: de
  text: 'Ich habe mein Kind sieben Männern gegeben[a], und sooft sie zu ihr hineingingen, starben sie in der Nacht. Doch nun sei guten Mutes! Tobias aber sagte[b]: »Ich werde hier nichts essen, bis ihr die Sache mit mir geregelt und die Sache verbindlich festgelegt habt.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Griechisch: »sieben Männern«. Im Zusammenhang sind die Männer gemeint, denen sie zur Ehe gegeben worden war; daher ist auch die Übersetzung »sieben Ehemännern« möglich.'
    reason: lexical_alternative
  - marker: b
    text: 'Der letzte Satzteil ist in diesem griechischen Textzeugen schwer verständlich. Die Übersetzung gibt den wahrscheinlichen Sinn wieder: Tobias weigert sich zu essen, bevor die Ehevereinbarung mit ihm verbindlich geregelt ist.'
    reason: textual_variant
lexical_decisions:
- source_word: τὸ παιδίον μου
  choice: mein Kind
  rationale: παιδίον bezeichnet wörtlich ein Kind oder junges Wesen. Im Zusammenhang ist Raguëls Tochter Sara gemeint; »mein Kind« bewahrt jedoch die familiäre und liebevolle Ausdrucksweise des Griechischen.
- source_word: ἑπτὰ ἀνδράσιν
  choice: sieben Männern
  rationale: ἀνήρ kann »Mann« oder »Ehemann« bedeuten. Die formal nähere Wiedergabe lässt den durch den Zusammenhang gegebenen ehelichen Sinn offen; eine Fußnote nennt »Ehemänner« als mögliche Kontextübersetzung.
- source_word: ὁπότε ἐὰν εἰσεπορεύοντο πρὸς αὐτήν
  choice: sooft sie zu ihr hineingingen
  rationale: Die Formulierung wahrt den griechischen Euphemismus für das Eingehen zu einer Frau im ehelichen beziehungsweise sexuellen Zusammenhang, ohne ihn ausdrücklich auszudeuten.
- source_word: ἀπέθνησκον ὑπὸ νύκτα
  choice: starben sie in der Nacht
  rationale: ὑπὸ νύκτα ist eine Zeitangabe; der deutsche Imperfekt gibt die im Griechischen als wiederholt dargestellten Todesfälle natürlich wieder.
- source_word: ἔχων ἡδέως γίνου
  choice: sei guten Mutes
  rationale: Die überlieferte Wendung ist sprachlich ungewöhnlich, hat aber offenbar ermutigenden Sinn. »Sei guten Mutes« ist würdig, verständlich und weniger auf bloße Heiterkeit verengt als »sei fröhlich«.
- source_word: Οὐ γεύομαι οὐδὲν ὧδε
  choice: Ich werde hier nichts anrühren
  rationale: γεύομαι bedeutet wörtlich »kosten« und im weiteren Sinn essen. »Nichts anrühren« ist eine natürliche deutsche Wendung für die entschiedene Weigerung, von der Mahlzeit zu essen.
- source_word: ἕως ἂν στήσητε καὶ σταθῆτε πρὸς μέ
  choice: bis ihr die Sache festgelegt und mit mir zum Abschluss gebracht habt
  rationale: Die doppelte Verbform ist in diesem griechischen Zeugen schwierig. Die Übersetzung wahrt zwei Handlungsmomente und gibt den aus dem Zusammenhang erkennbaren Sinn einer verbindlichen Regelung der Eheschließung wieder, ohne einen unverständlichen deutschen Wortlaut zu erzeugen.
