  text: And he called Sarah his daughter[a], and taking her by the hand he gave her to Tobiah as a wife, and he said, “See, according to the law of Moses, take her and bring her to your father.” And he blessed them.
translation:
  language: de
  text: 'Und er rief seine Tochter Sara herbei, nahm sie bei der Hand und gab sie Tobias zur Frau. Er sagte: »Sieh, nimm sie nach dem Gesetz des Mose[a] und führe sie zu deinem Vater.« Und er segnete sie beide.'
