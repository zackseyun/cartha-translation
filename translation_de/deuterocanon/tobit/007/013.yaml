    text: 'Oder: »nimm sie in Empfang«. Das griechische Verb kann je nach Zusammenhang »nehmen«, »in Empfang nehmen« oder »mitnehmen« bedeuten; der folgende Befehl bezeichnet bereits das Führen zum Vater.'
