lexical_decisions:
- source_word: ἐκάλεσεν Σάρραν τὴν θυγατέρα αὐτοῦ
  choice: er rief seine Tochter Sara
  rationale: Das schlichte »rief« gibt ἐκάλεσεν natürlich wieder; die Apposition wird im Deutschen idiomatisch als »seine Tochter Sara« formuliert.
- source_word: λαβὼν τῆς χειρὸς αὐτῆς
  choice: nahm sie bei der Hand
  rationale: Die konkrete Geste bleibt erhalten; »bei der Hand nehmen« ist dafür die natürliche deutsche Wendung.
- source_word: παρέδωκεν αὐτὴν Τωβείᾳ γυναῖκα
  choice: gab sie Tobias zur Frau
  rationale: παραδίδωμι bezeichnet hier die Übergabe zur Eheschließung, nicht ein feindliches Ausliefern. »Zur Frau geben« bewahrt die prädikative Funktion von γυναῖκα.
- source_word: Ἰδοὺ
  choice: Sieh
  rationale: »Sieh« wahrt den aufmerksamkeitslenkenden Charakter, ohne so altertümlich wie »siehe« zu wirken.
- source_word: κατὰ τὸν νόμον Μωυσέως
  choice: nach dem Gesetz des Mose
  rationale: Die Formulierung gibt den ausdrücklichen Rechtsbezug knapp und genau wieder und behält die Nennung des Mose bei.
- source_word: κομίζου αὐτήν
  choice: nimm sie an
  rationale: Das Medium κομίζου kann hier das Annehmen beziehungsweise In-Empfang-Nehmen der Braut bezeichnen. »Annehmen« unterscheidet diesen Akt sinnvoll vom anschließenden Wegführen.
- source_word: ἄπαγε πρὸς τὸν πατέρα σου
  choice: führe sie zu deinem Vater
  rationale: »Führe sie« bildet die gerichtete Bewegung von ἄπαγε ab und vermeidet die perspektivische Unschärfe des deutschen »bring sie«.
- source_word: εὐλόγησεν αὐτούς
  choice: er segnete sie beide
  rationale: Das maskuline Pluralpronomen bezieht sich im Kontext auf Tobias und Sara; »sie beide« macht den Bezug im Deutschen eindeutig, ohne den Inhalt zu erweitern.
theological_decisions:
- issue: Bezug auf das mosaische Gesetz in einer deuterokanonischen Erzählung
  choice: »nach dem Gesetz des Mose« ausdrücklich beibehalten
  alternative: »nach unserem Gesetz« oder nur »nach dem Gesetz«
  rationale: Der griechische Text nennt Mose ausdrücklich. Die Übersetzung bewahrt diesen Anspruch der Erzählung, ohne eine spätere konfessionelle oder kanontheologische Wertung einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede bleibt knapp und feierlich, ohne unnötig archaische Formen. »Tobias« folgt der im Deutschen geläufigen Namensform für Τωβείας.
