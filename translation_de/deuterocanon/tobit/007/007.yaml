base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/007/007.yaml
  text: And he said to him[a], “He is the son of a noble and good man.” And when he heard that Tobit had lost his eyes[b], he was grieved and wept.
translation:
  language: de
  text: 'Und er sagte zu ihm: »Er ist der Sohn eines ehrenhaften und guten Mannes.«[a] Als er hörte, dass Tobit sein Augenlicht verloren hatte,[b] war er betrübt und weinte.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Im Griechischen steht hier verkürzt etwa: »[einer] des ehrenhaften und guten Mannes«. »Sohn« ist aus dem Zusammenhang ergänzt.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: »dass Tobit seine Augen verloren hatte«; gemeint ist der Verlust des Sehvermögens.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὁ τοῦ καλοῦ καὶ ἀγαθοῦ ἀνθρώπου
  choice: Er ist der Sohn eines angesehenen und guten Mannes
  rationale: Die griechische Wendung ist elliptisch und nennt »Sohn« nicht ausdrücklich. Der familiäre Zusammenhang legt diese knappe Ergänzung jedoch nahe. »Angesehen« und »gut« bewahrt die doppelte Würdigung, ohne im Deutschen unnatürlich »gut und gut« zu sagen.
- source_word: καλοῦ
  choice: angesehenen
  rationale: In der Verbindung mit ἀγαθοῦ bezeichnet καλός wahrscheinlich die ehrenvolle, achtbare Stellung oder den guten Ruf des Mannes. »Angesehen« klingt im modernen Deutschen natürlicher als »edel« und unterscheidet sich klar von »gut«.
- source_word: ἀγαθοῦ
  choice: guten
  rationale: Das Wort enthält hier eine allgemeine positive, auch moralische Beurteilung; »gut« ist die unmittelbarste deutsche Entsprechung.
- source_word: ἀκούσας
  choice: Als er hörte
  rationale: Das griechische Partizip wird als natürlicher temporaler Nebensatz wiedergegeben.
- source_word: ἀπώλεσεν τοὺς ὀφθαλμοὺς ἑαυτοῦ
  choice: sein Augenlicht verloren hatte
  rationale: Wörtlich spricht der griechische Text davon, dass Tobit seine Augen verloren habe. Im Deutschen könnte »seine Augen verloren« jedoch als körperlicher Verlust der Augen missverstanden werden; »sein Augenlicht verloren« gibt den gemeinten Verlust des Sehvermögens klar und idiomatisch wieder.
- source_word: ἐλυπήθη
  choice: wurde er traurig
  rationale: Die Form bezeichnet das Erfülltwerden von Kummer oder Trauer. »Wurde traurig« ist gegenwärtiges, gut verständliches Deutsch und passt zur anschließenden Reaktion.
- source_word: ἔκλαυσεν
  choice: weinte
  rationale: »Weinte« gibt das konkrete Weinen schlicht und würdig wieder.
theological_decisions:
- issue: Elliptische Identifizierung im ersten Satzteil
  choice: Das nicht ausdrücklich vorhandene Beziehungswort wird als »Sohn« ergänzt und durch eine Fußnote kenntlich gemacht.
  alternative: Eine formalere Wiedergabe wie »Er ist von einem angesehenen und guten Mann« würde die Beziehung offenlassen.
  rationale: 'Der überlieferte griechische Wortlaut ist abrupt: wörtlich etwa »der des angesehenen und guten Mannes«. Für verständliches Deutsch ist eine Ergänzung nötig; »Sohn« entspricht dem familiären Identifikationszusammenhang, ohne eine theologische Aussage einzutragen.'
- issue: Konkrete Formulierung für Tobits Blindheit
  choice: Im Haupttext steht idiomatisch »sein Augenlicht verloren hatte«; die wörtlichere Form wird in der Fußnote bewahrt.
  alternative: »Seine Augen verloren hatte« folgt den einzelnen griechischen Wörtern enger, kann im Deutschen aber einen körperlichen Verlust der Augen bezeichnen.
  rationale: Die Übersetzung soll den Sinn der konkreten griechischen Wendung verständlich ausdrücken und zugleich ihre wörtliche Gestalt transparent machen. Eine konfessionelle oder dogmatische Festlegung ist damit nicht verbunden.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die direkte Rede bleibt knapp. Die griechische Ellipse wird minimal aufgelöst; die auffällige konkrete Wendung zur Blindheit wird idiomatisch übersetzt und in einer Fußnote dokumentiert.
