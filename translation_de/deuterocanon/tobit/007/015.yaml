  yaml_path: translation/deuterocanon/tobit/007/015.yaml
  text: And they began to eat[a]. Then Raguel called Edna his wife and said to her, “Sister[b], prepare the other room and bring her in.”
translation:
  language: de
  text: 'Und sie begannen zu essen. Dann rief Raguel seine Frau Edna und sagte zu ihr: »Schwester[a], richte das andere Zimmer[b] her und führe sie hinein.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: »Schwester« ist die wörtliche Anrede an seine Frau; hier dient sie als vertraute, liebevolle Anrede.
    reason: cultural_note
  - marker: b
    text: 'Oder: »die andere Kammer«. Das griechische Wort kann einen Innenraum oder eine Kammer bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤρξαντο ἐσθίειν
  choice: sie begannen zu essen
  rationale: Die Verbindung von ἄρχομαι mit dem Infinitiv bezeichnet unmittelbar den Beginn des Essens; die schlichte Wiedergabe entspricht dem Griechischen.
- source_word: ἐκάλεσεν
  choice: rief
  rationale: Im häuslichen Zusammenhang ist »rief« natürlicher und weniger förmlich als »ließ ... rufen« oder »beorderte«.
- source_word: Ἀδελφή
  choice: Schwester
  rationale: Die wörtliche Anrede bewahrt die semitisch geprägte Verwandtschaftssprache gegenüber der Ehefrau; ihre idiomatische Funktion wird in einer Fußnote erläutert.
- source_word: ἑτοίμασον
  choice: richte ... her
  rationale: Die Wendung ist ein natürlicher deutscher Imperativ für das Vorbereiten eines Zimmers.
- source_word: τὸ ἕτερον ταμεῖον
  choice: das andere Zimmer
  rationale: ταμεῖον kann einen Innenraum oder eine Kammer bezeichnen. »Zimmer« ist im Zusammenhang klar und gegenwärtig; »andere« gibt ἕτερον wieder.
- source_word: εἴσαγε αὐτήν
  choice: führe sie hinein
  rationale: Die Wiedergabe erhält sowohl die verursachte Bewegung als auch die Richtung nach innen, ohne ein im Griechischen nicht ausdrücklich stehendes Ortsadverb wie »dorthin« hinzuzufügen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Erzählung bleibt knapp; die ungewöhnliche eheliche Anrede wird aus Quelltreue beibehalten und knapp erläutert.
