translation:
  language: de
  text: Und er rief seine Frau Edna, nahm ein Schriftstück, schrieb einen Vertrag[a], und sie versiegelten ihn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eine schriftliche Vereinbarung“. Das griechische Wort bezeichnet ein förmliches schriftliches Rechtsdokument; im Zusammenhang kann ein Ehevertrag gemeint sein.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκάλεσεν
  choice: rief
  rationale: Das Verb bedeutet hier schlicht „rufen“; im Deutschen ist „er rief seine Frau Edna“ natürlich und wahrt den möglichen Sinn von Herbeirufen, ohne die Förmlichkeit von „vorladen“ einzutragen.
- source_word: Ἔδναν
  choice: Edna
  rationale: Der Personenname wird in der im Deutschen gebräuchlichen Form wiedergegeben.
- source_word: τὴν γυναῖκα αὐτοῦ
  choice: seine Frau
  rationale: γυνή bezeichnet mit dem Possessivpronomen in diesem häuslichen Zusammenhang eindeutig die Ehefrau.
- source_word: λαβὼν βιβλίον
  choice: nahm er ein Schriftstück
  rationale: βιβλίον kann Buch, Rolle oder Schriftstück bezeichnen. Da darauf eine rechtliche Vereinbarung aufgesetzt und versiegelt wird, gibt „Schriftstück“ die Funktion im Kontext treffend wieder, ohne eine bestimmte materielle Form festzulegen.
- source_word: ἔγραψεν
  choice: setzte ... auf
  rationale: Das einfache „schrieb“ wird im Zusammenhang mit einem Vertrag idiomatisch als „setzte ... auf“ wiedergegeben; dies bezeichnet das schriftliche Abfassen, ohne zusätzliche Handlung einzutragen.
- source_word: συγγραφήν
  choice: Ehevertrag
  rationale: συγγραφή bezeichnet eine förmliche schriftliche Vereinbarung bzw. einen Vertrag. Der unmittelbare Heiratskontext rechtfertigt „Ehevertrag“; die allgemeinere lexikalische Bedeutung wird in der Fußnote offengehalten.
- source_word: ἐσφραγίσαντο
  choice: sie versiegelten ihn
  rationale: Die Form ist 3. Person Plural und bezeichnet das konkrete Anbringen eines Siegels bzw. das Versiegeln. Das Pronomen bezieht sich im Deutschen auf den Ehevertrag.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die kurze parataktische Erzählweise des Griechischen bleibt erkennbar, wird jedoch durch „Dann“ natürlich gegliedert. „Schriftstück“ vermeidet die heute irreführende wörtliche Wiedergabe „Buch“, und „setzte ... auf“ entspricht dem üblichen deutschen Ausdruck für das Abfassen eines Vertrags.
