  text: And Raguel sprang up, kissed him warmly, and wept.
translation:
  language: de
  text: Da sprang Raguel auf, küsste ihn innig[a] und weinte.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das mit „küsste ihn innig“ wiedergegebene griechische Verb ist stärker als das einfache Wort für „küssen“ und drückt besondere Zuneigung aus.
    reason: lexical_alternative
  - marker: b
    text: Die hier angeführte semitische Parallelquelle ist eine erheblich spätere Rückübersetzung und bestimmt den Wortlaut dieses Verses nicht; die Übersetzung folgt dem griechischen Textzeugen.
    reason: textual_variant
lexical_decisions:
- source_word: ἀνεπήδησεν
  choice: sprang … auf
  rationale: Das Verb bezeichnet ein plötzliches, lebhaftes Aufspringen und bewahrt so die emotionale Unmittelbarkeit der Szene.
- source_word: κατεφίλησεν
  choice: küsste ihn innig
  rationale: Das verstärkte Verb bezeichnet mehr als einen nüchtern festgestellten Kuss und kann herzliches oder wiederholtes Küssen ausdrücken. „innig“ gibt die Zuneigung wieder, ohne zusätzlich eine Umarmung einzuführen.
- source_word: ἔκλαυσε
  choice: weinte
  rationale: „weinte“ ist die natürliche moderne deutsche Wiedergabe für das Vergießen von Tränen in dieser Begegnungsszene.
- source_word: Ῥαγουὴλ
  choice: Raguel
  rationale: Der Name folgt der im griechischen Text bezeugten Form.
- source_word: αὐτόν
  choice: ihn
  rationale: Das Pronomen wird entsprechend seinem männlichen Bezug im Zusammenhang wiedergegeben.
