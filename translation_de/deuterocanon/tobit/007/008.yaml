  text: And Edna his wife and Sarah his daughter wept[a], and they welcomed them eagerly.
translation:
  language: de
  text: Und Edna, seine Frau, und Sara, seine Tochter, weinten und nahmen sie bereitwillig auf.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „hießen sie herzlich willkommen“ oder „nahmen sie willig auf“. Das griechische Adverb betont bereitwillige, zugewandte Gastfreundschaft.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔδνα
  choice: Edna
  rationale: Der Personenname wird nach der üblichen deutschen Namensform wiedergegeben.
- source_word: ἡ γυνὴ αὐτοῦ
  choice: seine Frau
  rationale: γυνή bezeichnet hier eindeutig die Ehefrau; die possessive Verbindung wird idiomatisch wiedergegeben.
- source_word: Σάρρα
  choice: Sara
  rationale: Die im Deutschen geläufige biblische Namensform wird verwendet.
- source_word: ἡ θυγάτηρ αὐτοῦ
  choice: seine Tochter
  rationale: Die familiäre Beziehung und das Possessivpronomen werden direkt und idiomatisch wiedergegeben.
- source_word: ἔκλαυσαν
  choice: weinten
  rationale: Der Aorist bezeichnet das Weinen als erzähltes Ereignis, ohne dass ein Beginn oder eine Dauer ausdrücklich markiert wird.
- source_word: ὑπεδέξαντο
  choice: nahmen … auf
  rationale: Das Verb bezeichnet in diesem Zusammenhang die gastliche Aufnahme der Besucher. Die deutsche Wendung lässt sich natürlich mit dem Adverb προθύμως verbinden.
- source_word: αὐτούς
  choice: die Gäste
  rationale: Das Pronomen bezieht sich auf die angekommenen Besucher. Die explizite Wiedergabe als „die Gäste“ verhindert im Deutschen eine störende Folge mehrerer gleichlautender Pronomen und macht den Gastfreundschaftskontext deutlich.
- source_word: προθύμως
  choice: bereitwillig
  rationale: Das Adverb betont Bereitschaft und willige, engagierte Gastfreundschaft; „bereitwillig“ bewahrt diesen Akzent, ohne die Gefühlsintensität zu überzeichnen.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Erzählsprache. Das Semikolon gliedert die beiden aufeinanderfolgenden Handlungen, während „dann“ das erneute καί natürlich wiedergibt. „Die Gäste“ dient der Klarheit und vermeidet das missverständliche „sie nahmen sie … auf“.
