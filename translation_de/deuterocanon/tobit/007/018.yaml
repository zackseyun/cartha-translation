base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/007/018.yaml
  text: And Raguel called Edna his wife and said to her[a], “Sister[b], prepare the other chamber and bring her in there.”
translation:
  language: de
  text: 'Und Raguël rief seine Frau Edna und sagte zu ihr: »Schwester[a], richte das andere Zimmer[b] her und führe sie hinein.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Schwester“ ist hier eine vertrauliche Anrede Raguëls an seine Frau, keine Aussage über ihre leibliche Verwandtschaft.
    reason: cultural_note
  - marker: b
    text: Das griechische Wort kann einen inneren Raum, ein Zimmer oder eine Kammer bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀδελφή
  choice: Schwester
  rationale: Der direkte Vokativ wird wörtlich bewahrt. Er ist hier eine vertrauliche Anrede an die Ehefrau und keine Angabe einer leiblichen Verwandtschaft.
- source_word: ἑτοίμασον
  choice: richte … her
  rationale: Die Imperativform bedeutet, etwas vorzubereiten oder bereitzumachen. „Richte … her“ ist in diesem Zusammenhang natürliches, modernes Deutsch.
- source_word: τὸ ἕτερον ταμεῖον
  choice: das andere Zimmer
  rationale: ταμεῖον kann einen inneren Raum, ein Zimmer oder eine Kammer bezeichnen. „Zimmer“ ist verständlich und wahrt die lexikalische Offenheit besser als das stärker konnotierte „Schlafgemach“.
- source_word: εἴσαγε αὐτήν
  choice: führe sie hinein
  rationale: Die Form bezeichnet das Hineinführen einer Person. Das deutsche „hinein“ nimmt den zuvor genannten Raum eindeutig auf, ohne ein im Griechischen nicht wiederholtes Ortswort zu ergänzen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nah am Griechischen; „richte … her“ und „führe sie hinein“ vermeiden zugleich unnötig altertümliche Formulierungen.
