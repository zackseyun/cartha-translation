  yaml_path: translation/deuterocanon/tobit/007/010.yaml
  text: And he conveyed the matter to Raguel. And Raguel said to Tobiah, “Eat, drink, and be glad, for it is fitting for you to take my child; but I will explain the truth.”
translation:
  language: de
  text: 'Und er brachte die Sache bei Raguël zur Sprache. Da sagte Raguël zu Tobias: »Iss, trink und sei guter Dinge! Denn dir steht es zu, meine Tochter zur Frau zu nehmen. Doch ich will dir die Wahrheit darlegen.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετέδωκεν τὸν λόγον
  choice: brachte die Sache … zur Sprache
  rationale: Die Wendung bezeichnet hier das Übermitteln beziehungsweise Ansprechen der zuvor verhandelten Angelegenheit; die deutsche Formulierung ist natürlich und lässt den nicht ausdrücklich genannten Sprecher bestehen.
- source_word: ἡδέως γίνου
  choice: sei guter Dinge
  rationale: Gibt die Aufforderung idiomatisch als freudige, unbeschwerte Haltung beim Essen und Trinken wieder, ohne sie auf bloßes Vergnügen zu verengen.
- source_word: καθήκει
  choice: steht es zu
  rationale: Bewahrt den Sinn von Angemessenheit beziehungsweise berechtigter Zuständigkeit im Zusammenhang mit der Eheschließung.
- source_word: τὸ παιδίον μου
  choice: meine Tochter
  rationale: Das grammatisch sächliche παιδίον bedeutet wörtlich »mein Kind«; aus dem Erzählzusammenhang ist eindeutig Raguëls Tochter Sara gemeint, weshalb die natürliche deutsche Bezeichnung gewählt wird.
- source_word: λαβεῖν
  choice: zur Frau zu nehmen
  rationale: Im Heiratskontext bedeutet »nehmen« die Eheschließung; die Ergänzung macht dies im heutigen Deutsch eindeutig.
- source_word: ὑποδείξω τὴν ἀλήθειαν
  choice: will dir die Wahrheit darlegen
  rationale: ὑποδείκνυμι meint zeigen, erklären oder darlegen; die Wiedergabe kündigt die offene Mitteilung der tatsächlichen Lage an.
theological_decisions:
- issue: Berechtigung des Tobias zur Eheschließung
  choice: »dir steht es zu«
  alternative: »es ist passend für dich«
  rationale: Die Übersetzung wahrt die rechtlich-familiäre und zugleich allgemeine Bedeutung von καθήκει, ohne eine bestimmte Auslegung des Verwandtschaftsrechts stärker als der griechische Text festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit natürlicher direkter Rede. Der Satzanfang lässt wie der griechische Text offen, wer die Angelegenheit bei Raguël anspricht; es wird kein Name ergänzt.
