base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/007/001.yaml
  text: And he came to Ecbatana and arrived at the house of Raguel[a], and Sarah also met him. She greeted him, and he greeted them[b], and he brought them into the house.
translation:
  language: de
  text: Er kam nach Ekbatana und gelangte zum Haus Raguels. Auch Sara kam ihm entgegen. Sie begrüßte ihn, und er begrüßte sie[a]. Dann führte er[b] sie ins Haus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich steht im Griechischen beim Objekt die Mehrzahl „sie“; auf wen sie sich genau bezieht, wird nicht ausdrücklich gesagt.
    reason: ambiguity
  - marker: b
    text: Das griechische Verb hat hier ein unausgesprochenes Subjekt im Singular; der Text nennt nicht ausdrücklich, wer sie ins Haus führte.
    reason: ambiguity
lexical_decisions:
- source_word: ἦλθεν
  choice: kam
  rationale: Das allgemeine Bewegungsverb wird schlicht mit „kam“ wiedergegeben; die anschließende Zielangabe wird durch παρεγένετο näher bestimmt.
- source_word: παρεγένετο
  choice: gelangte
  rationale: Die Wiedergabe wahrt gegenüber ἦλθεν die leichte erzählerische Steigerung hin zum konkreten Ziel, ohne im Deutschen dasselbe Verb zu wiederholen.
- source_word: οἰκίαν
  choice: Haus
  rationale: Gemeint ist hier zunächst das Wohnhaus; „Haus“ ist zugleich natürlich und offen für den weiteren Sinn des Haushalts.
- source_word: ὑπήντησεν
  choice: kam … entgegen
  rationale: Das Verb bezeichnet häufig das Entgegengehen zu einer Begegnung. Diese Wiedergabe unterscheidet den Vorgang klar vom anschließenden Begrüßen.
- source_word: ἐχαιρέτισεν
  choice: begrüßte
  rationale: „Begrüßte“ ist die direkte, gegenwärtige deutsche Entsprechung und fügt keine über den griechischen Text hinausgehende Willkommensgeste hinzu.
- source_word: αὐτὸς αὐτούς
  choice: er begrüßte sie
  rationale: Die knappe griechische Formulierung wird ebenso knapp wiedergegeben. Das pluralische Objekt bleibt im Deutschen unbestimmt, statt seine Bezugsgruppe erklärend festzulegen.
- source_word: εἰσήγαγεν
  choice: führte … ins Haus
  rationale: Das Verb bezeichnet das Hineinführen oder Hineinbringen. „Führte … ins Haus“ gibt die Bewegung nach drinnen natürlich wieder.
- source_word: Ἐκβάτανα
  choice: Ekbatana
  rationale: Gebräuchliche deutsche Umschrift des griechischen Ortsnamens.
- source_word: Ῥαγουήλ
  choice: Raguël
  rationale: Die Schreibung folgt der griechischen Namensform und markiert durch das Trema die getrennte Aussprache der Vokale.
- source_word: Σάρρα
  choice: Sara
  rationale: „Sara“ ist die etablierte deutsche Form des Namens und entspricht der griechischen Form.
theological_decisions:
- issue: Bezug des pluralischen Pronomens in αὐτὸς αὐτούς
  choice: er begrüßte sie
  alternative: er begrüßte sie seinerseits
  rationale: Der griechische Text nennt die mit „sie“ bezeichnete Mehrzahl nicht ausdrücklich. Die Übersetzung bewahrt diese Unbestimmtheit und ergänzt weder eine Personengruppe noch eine ausdrücklich reziproke Nuance.
- issue: Subjekt des abschließenden εἰσήγαγεν
  choice: Dann führte er sie ins Haus.
  alternative: Dann wurden sie ins Haus geführt.
  rationale: Die griechische Verbform hat ein unausgesprochenes Subjekt im Singular. Das Pronomen „er“ bildet dies formal ab, ohne die Person namentlich zu bestimmen; eine Passivform würde die grammatische Gestalt des Ausgangstextes stärker verändern.
translation_notes:
  register: Moderne, würdige Erzählsprache mit kurzen, gut verständlichen Sätzen. Die Pronomen bleiben bewusst so offen wie im griechischen Text; erläuternde Festlegungen auf Tobit, Raguël oder eine bestimmte Personengruppe werden vermieden.
