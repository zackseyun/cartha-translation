  yaml_path: translation/deuterocanon/tobit/007/017.yaml
  text: Take courage[a], child; may the Lord of heaven and earth grant you favor instead of this sorrow of yours. Take courage, daughter.
translation:
  language: de
  text: Hab Mut, Kind! Der Herr des Himmels und der Erde schenke dir Gunst[a] anstelle deines jetzigen Kummers. Hab Mut, Tochter!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Gnade«; das griechische Wort χάρις kann hier beides bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Θάρσει
  choice: Hab Mut
  rationale: Der Imperativ von θαρσέω spricht in bedrängter Lage unmittelbar Mut zu. „Hab Mut“ ist im heutigen Deutsch natürlich und bewahrt die Wiederholung beider Aufforderungen.
- source_word: τέκνον
  choice: Kind
  rationale: τέκνον ist hier eine liebevolle, nicht ausdrücklich männliche Anrede. „Kind“ gibt sie ohne den im Griechischen nicht vorhandenen Zusatz „mein“ wieder.
- source_word: ὁ κύριος
  choice: der Herr
  rationale: Im jüdischen Gebets- und Segenskontext ist κύριος als Gottesbezeichnung mit „der Herr“ wiederzugeben.
- source_word: τοῦ οὐρανοῦ καὶ τῆς γῆς
  choice: des Himmels und der Erde
  rationale: Die feste biblische Wendung bezeichnet umfassend Gottes Herrschaft und wird im Deutschen idiomatisch so wiedergegeben.
- source_word: δῴη
  choice: schenke
  rationale: Der Optativ drückt einen Wunsch beziehungsweise Segen aus. Der deutsche Konjunktiv „schenke“ bewahrt diese Gebetsform knapp und würdig.
- source_word: σοι χάριν
  choice: dir Gunst
  rationale: χάρις bezeichnet hier eine gnädige Zuwendung oder Wohltat. „Gunst“ wahrt diesen Sinn, ohne dem Wort unnötig einen späteren theologischen Fachgehalt zu geben; „Gnade“ bleibt möglich und wird in der Fußnote genannt.
- source_word: ἀντὶ τῆς λύπης σου ταύτης
  choice: anstelle dieses deines Kummers
  rationale: ἀντί bezeichnet Austausch oder Ersatz; λύπη ist Kummer beziehungsweise Trauer. Die Formulierung bewahrt sowohl den Ersatzgedanken als auch die persönliche Zuordnung des Kummers.
- source_word: θύγατερ
  choice: Tochter
  rationale: Die ausdrücklich feminine Anrede wird beibehalten und macht den Wechsel von der allgemeinen Anrede τέκνον zur konkreten Anrede θύγατερ sichtbar.
theological_decisions:
- issue: Wiedergabe von χάρις in einem an Gott gerichteten Segenswunsch
  choice: Gunst
  alternative: Gnade
  rationale: Der Zusammenhang ist ein tröstender Segenswunsch und keine lehrhafte Erörterung. „Gunst“ bezeichnet die erbetene gnädige Zuwendung, ohne einen technischen theologischen Sinn festzulegen; „Gnade“ ist lexikalisch ebenfalls möglich.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter, warmer Anrede. Die zweimalige Aufforderung „Hab Mut“ sowie der Wechsel von „Kind“ zu „Tochter“ bleiben erhalten. Der leicht feierliche Genitiv „dieses deines Kummers“ spiegelt die griechische Hervorhebung, ohne archaisch unverständlich zu werden.
