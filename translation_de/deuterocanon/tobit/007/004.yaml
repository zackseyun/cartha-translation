base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/007/004.yaml
  text: And he said to them[a], “Do you know Tobit our brother?”
translation:
  language: de
  text: 'Und er sagte zu ihnen: »Kennt ihr Tobit, unseren Bruder[a]?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »unseren Verwandten«. Das griechische Wort lautet »Bruder«, kann hier aber eine weiter gefasste Verwandtschaft oder Zugehörigkeit bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ εἶπεν αὐτοῖς
  choice: Und er sagte zu ihnen
  rationale: Gibt die einleitende Erzählformel eng am Griechischen und zugleich in natürlichem Deutsch wieder.
- source_word: Γινώσκετε
  choice: Kennt ihr
  rationale: Das Verb bezeichnet hier die persönliche Bekanntschaft mit Tobit; „kennt ihr“ ist die natürliche deutsche Frageform.
- source_word: Τωβεὶτ
  choice: Tobit
  rationale: Verwendet die im Deutschen etablierte Namensform.
- source_word: τὸν ἀδελφὸν ἡμῶν
  choice: unseren Bruder
  rationale: Bewahrt die familiäre Ausdrucksweise des griechischen Textes. Im Zusammenhang kann „Bruder“ ein Verwandtschafts- oder Zugehörigkeitsverhältnis bezeichnen und muss keinen leiblichen Bruder meinen.
theological_decisions:
- issue: Bedeutung von ἀδελφός als Verwandtschafts- oder Zugehörigkeitsbezeichnung
  choice: unseren Bruder
  alternative: unseren Verwandten
  rationale: Die wörtliche familiäre Redeweise bleibt im Haupttext erhalten, ohne die wahrscheinlich weitere soziale oder verwandtschaftliche Bedeutung stillschweigend festzulegen; die Fußnote weist auf diese Möglichkeit hin.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Das notwendige Komma kennzeichnet „unseren Bruder“ als Apposition zu „Tobit“.
