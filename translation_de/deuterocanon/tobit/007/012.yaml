  yaml_path: translation/deuterocanon/tobit/007/012.yaml
  text: And Raguel said[a], “Take her from now on according to the judgment. You are her brother, and she is yours[c][b]. And may the merciful God prosper what is best for you.”
translation:
  language: de
  text: 'Und Raguël sagte: »Nimm sie von nun an zu dir, gemäß dem Urteil.[a] Du bist ihr Bruder,[b] und sie gehört dir. Der barmherzige Gott aber möge euch das Beste gelingen lassen.«[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »gemäß dem Entscheid« beziehungsweise »gemäß der rechtlichen Verfügung«.'
    reason: lexical_alternative
  - marker: b
    text: »Bruder« ist hier eine Verwandtschaftsbezeichnung und meint offenbar einen nahen Verwandten, der nach dem Familienrecht als Ehemann infrage kommt, nicht einen leiblichen Bruder.
    reason: cultural_note
  - marker: c
    text: 'Wörtlicher und als Aussage: »Der barmherzige Gott aber wird euch die besten Dinge gelingen lassen.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: Κομίζου
  choice: Nimm sie … zu dir
  rationale: Der mediale Imperativ bezeichnet hier das Annehmen beziehungsweise Zu-sich-Nehmen Saras als Ehefrau. Die Formulierung ist im Deutschen natürlich, ohne den Vorgang weiter auszudeuten.
- source_word: ἀπὸ τοῦ νῦν
  choice: von nun an
  rationale: Die Wendung markiert den Beginn des neuen ehelichen Rechtsverhältnisses und entspricht dem griechischen Zeitausdruck knapp und idiomatisch.
- source_word: κατὰ τὴν κρίσιν
  choice: gemäß dem Urteil
  rationale: κρίσις kann Urteil, Entscheid oder rechtliche Verfügung bedeuten. »Gemäß dem Urteil« bewahrt den förmlich-rechtlichen Klang, ohne eine bestimmte Rechtsform vorauszusetzen.
- source_word: ἀδελφὸς
  choice: Bruder
  rationale: Die unmittelbare Bedeutung wird beibehalten. Im Zusammenhang bezeichnet das Wort offenbar einen nahen männlichen Verwandten und nicht einen leiblichen Bruder; dies wird in der Fußnote erläutert.
- source_word: ἐλεήμων
  choice: barmherzig
  rationale: »Barmherzig« ist die direkte, im biblischen Sprachgebrauch vertraute und dennoch verständliche Wiedergabe.
- source_word: εὐοδώσει
  choice: möge … gelingen lassen
  rationale: Das Verb bedeutet, Erfolg oder gutes Gelingen zu schenken. Der griechische Futur kann in dieser Segensformel als zuversichtlicher Segenswunsch wiedergegeben werden.
- source_word: τὰ κάλλιστα
  choice: das Beste
  rationale: Der substantivierte neutrale Plural bezeichnet wörtlich »die besten Dinge«. »Das Beste« gibt ihn im Deutschen natürlich wieder, ohne seinen Inhalt unnötig festzulegen.
theological_decisions:
- issue: Verwandtschaftsbezeichnung im Zusammenhang einer Eheschließung
  choice: »Bruder« im Haupttext beibehalten und die weitere verwandtschaftliche Bedeutung in einer Fußnote erläutern.
  alternative: Im Haupttext »Verwandter« oder »naher Verwandter« schreiben.
  rationale: Der griechische Text verwendet ausdrücklich ἀδελφός. Die Übersetzung bewahrt diese auffällige Bezeichnung, ohne daraus eine leibliche Geschwisterbeziehung abzuleiten.
- issue: Futurische Segensformel
  choice: Als Segenswunsch mit »möge« wiedergeben.
  alternative: 'Aussagend übersetzen: »Der barmherzige Gott aber wird euch das Beste gelingen lassen.«'
  rationale: Obwohl εὐοδώσει formal im Futur steht, hat der Satz im Kontext den Charakter eines Segens. »Möge« bildet diese Sprechhandlung im Deutschen natürlich ab; die aussagende Möglichkeit bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Von nun an« und »barmherzig« bewahren einen dezent biblischen Klang, bleiben aber allgemein verständlich. Die rechtliche und verwandtschaftliche Mehrdeutigkeit des Ausgangstextes wird im Haupttext nicht eingeebnet.
