base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/007/005.yaml
  text: They said[a], “He is alive and well.” And Tobiah said[b], “He is my father.”
translation:
  language: de
  text: 'Sie antworteten: »Er lebt und ist gesund.« Und Tobija[a] sagte: »Er ist mein Vater.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traditionell wird der Name auch mit »Tobias« wiedergegeben.
    reason: alternative_reading
lexical_decisions:
- source_word: ζῇ
  choice: lebt
  rationale: Das Präsens von ζάω bezeichnet hier im Gespräch, dass der Erfragte noch am Leben ist. „Er lebt“ ist im Deutschen natürlich und nah am griechischen Ausdruck.
- source_word: ὑγιαίνει
  choice: ist gesund
  rationale: ὑγιαίνω bedeutet hier, körperlich gesund beziehungsweise wohlauf zu sein. „Ist gesund“ gibt die Aussage klar und ohne Verstärkung wieder.
- source_word: Πατήρ μου ἐστιν
  choice: Er ist mein Vater
  rationale: Die im Griechischen nachgestellte Kopula und das Subjekt werden in natürlicher deutscher Wortstellung wiedergegeben; das im Zusammenhang vorausgesetzte „er“ wird ausdrücklich gesetzt.
- source_word: Τωβίας
  choice: Tobija
  rationale: „Tobija“ gibt den semitischen Namen hinter der griechischen Form Τωβίας in einer im Deutschen gebräuchlichen Gestalt wieder.
theological_decisions:
- issue: Namensform Τωβίας
  choice: Tobija
  alternative: Tobias
  rationale: Die Entscheidung ist nicht lehrentscheidend. „Tobija“ spiegelt den semitischen Namen deutlicher wider; die traditionelle deutschsprachige Form „Tobias“ wird in einer Fußnote genannt.
translation_notes:
  register: Schlichte, natürliche Dialogsprache in modernem Standarddeutsch. Die doppelte Aussage des Griechischen — dass der Vater lebt und gesund ist — bleibt ohne idiomatische Verkürzung erhalten.
