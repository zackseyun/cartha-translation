lexical_decisions:
- source_word: ἐποίησεν ὡς εἶπεν
  choice: Sie tat, wie er gesagt hatte
  rationale: Die Wendung wird schlicht und idiomatisch wiedergegeben. Das Plusquamperfekt macht im Deutschen deutlich, dass seine Anweisung dem Handeln vorausging. Das im Griechischen unausgesprochene Subjekt wird aufgrund des femininen αὐτῆς und des Erzählzusammenhangs als weiblich verstanden.
- source_word: εἰσήγαγεν αὐτὴν ἐκεῖ
  choice: führte sie dorthin
  rationale: εἰσάγω bezeichnet das Hineinführen oder Hineinbringen. „Führte sie dorthin“ bewahrt die erzählerische Bewegung und gibt ἐκεῖ ausdrücklich wieder.
- source_word: ἔκλαυσεν
  choice: weinte sie
  rationale: „Weinte“ entspricht dem schlichten, feierlichen Erzählton und bezieht sich am natürlichsten auf dasselbe weibliche Subjekt.
- source_word: ἀπεδέξατο τὰ δάκρυα
  choice: nahm die Tränen … auf
  rationale: Die bildhafte Verbindung wird bewahrt, ohne sie zu einer ausdrücklichen Deutung wie „tröstete“ abzuflachen.
- source_word: τῆς θυγατρὸς αὐτῆς
  choice: ihrer Tochter
  rationale: Das feminine αὐτῆς bedeutet formal „ihrer“. Zusammen mit dem fortlaufenden weiblichen Subjekt ergibt sich natürlich die Mutter-Tochter-Beziehung; eine Änderung zu „seiner Tochter“ ist weder sprachlich nötig noch kontextuell vorzuziehen.
- source_word: εἶπεν αὐτῇ
  choice: sagte zu ihr
  rationale: Dies ist die natürliche deutsche Wiedergabe der üblichen griechischen Redeeinleitung; der Doppelpunkt weist auf die im nächsten Vers folgende Rede voraus.
theological_decisions:
- issue: Bestimmung des unausgesprochenen Subjekts und Bezug von αὐτῆς
  choice: Das Subjekt wird als weiblich wiedergegeben, und τῆς θυγατρὸς αὐτῆς als „ihrer Tochter“.
  alternative: 'Männliches Subjekt: „Er tat … nahm die Tränen seiner Tochter auf“.'
  rationale: Die griechischen Aoristformen markieren kein Genus, doch das feminine Possessivpronomen αὐτῆς und der Erzählzusammenhang weisen auf eine Frau als handelnde Person. Die feminine Lesart folgt daher den griechischen Sprachsignalen und vermeidet eine unbegründete Korrektur des Pronomens.
translation_notes:
  register: Moderne, würdevolle Erzählsprache. Die kurzen Hauptsätze folgen dem griechischen Erzählfluss; „nahm die Tränen … auf“ bewahrt bewusst das ungewöhnliche Bild des Ausgangstextes.
