translation:
  language: de
  text: Und die Straßen Jerusalems werden mit Beryll, Karfunkel und Stein aus Sufir[a] gepflastert werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Stein aus Ofir“, falls Σουφείρ als der Ortsname Ofir verstanden und nicht unmittelbar nach dem griechischen Text als Sufir wiedergegeben wird.'
    reason: alternative_reading
lexical_decisions:
- source_word: πλατεῖαι
  choice: Straßen
  rationale: Das Wort bezeichnet breite Straßen oder offene Plätze einer Stadt. Im Zusammenhang der städtischen Pracht ist „Straßen“ im modernen Deutschen die natürliche Wiedergabe.
- source_word: βηρύλλῳ
  choice: Beryll
  rationale: Der herkömmliche Edelsteinname bewahrt die konkrete Schmucksteinbildlichkeit, ohne die genaue moderne Mineralbestimmung zu überdeuten.
- source_word: ἄνθρακι
  choice: Karfunkel
  rationale: In diesem Edelsteinkontext bezeichnet ἄνθραξ einen glühend wirkenden Schmuckstein, nicht gewöhnliche Kohle. „Karfunkel“ ist die traditionelle deutsche Bezeichnung.
- source_word: λίθῳ ἐκ Σουφεὶρ
  choice: Steinen aus Sufir
  rationale: Die Wendung bezeichnet Stein aus einem Ort namens Σουφείρ. „Sufir“ gibt die Form des vorliegenden griechischen Zeugen wieder; der deutsche Plural fügt sich natürlich in die Aufzählung der Baumaterialien ein.
- source_word: ψηφολογηθήσονται
  choice: werden … gepflastert werden
  rationale: Das Verb bezeichnet hier das Auslegen einer Fläche mit kleinen Steinen beziehungsweise ein Pflastern oder Mosaizieren. „Gepflastert“ vermittelt den baulichen Sinn klar und ohne unnötigen Fachausdruck.
