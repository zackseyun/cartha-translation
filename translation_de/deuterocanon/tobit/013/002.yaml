base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/013/002.yaml
  text: For he afflicts and shows mercy; he brings down to Hades and brings up[a], and there is no one who will escape his hand.
translation:
  language: de
  text: Denn er züchtigt und erbarmt sich; er führt hinab in den Hades[a] und führt herauf, und niemand wird seiner Hand entkommen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in das Totenreich“; auch: „ins Grab“. Griechisch: „in den Hades“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μαστιγοῖ
  choice: züchtigt
  rationale: Das Verb bezeichnet wörtlich das Geißeln, kann hier jedoch weiter das Zufügen von Leid oder göttliche Zurechtweisung ausdrücken. „Züchtigt“ bewahrt sowohl die Härte als auch den möglichen erzieherischen Aspekt, ohne ein ausschließlich körperliches Schlagen vorauszusetzen.
- source_word: ἐλεᾷ
  choice: erbarmt sich
  rationale: Die geläufige biblische Wendung gibt Gottes Erbarmen klar und würdig wieder und bildet einen prägnanten Gegensatz zu „züchtigt“.
- source_word: κατάγει
  choice: führt hinab
  rationale: Die räumliche Bewegung des griechischen Verbs wird direkt wiedergegeben; zugleich bleibt der Parallelismus mit ἀνάγει erhalten.
- source_word: εἰς ᾅδην
  choice: in den Hades
  rationale: Der griechische Text nennt ausdrücklich den Hades. Die direkte Wiedergabe vermeidet eine vorschnelle Verengung auf das Grab und lässt die Bedeutung als Totenreich offen.
- source_word: ἀνάγει
  choice: führt wieder herauf
  rationale: „Führt ... herauf“ entspricht dem Verb und spiegelt „führt hinab“. „Wieder“ macht im Deutschen die gegenläufige Bewegung natürlich verständlich, ohne ausdrücklich Auferstehung festzulegen.
- source_word: οὐκ ἔστιν ὃς ἐκφεύξεται
  choice: niemand wird ... entkommen
  rationale: Die Formulierung gibt die verneinte Existenzkonstruktion idiomatisch wieder und bewahrt die Zukunftsform des griechischen Verbs.
- source_word: τὴν χεῖρα αὐτοῦ
  choice: seiner Hand
  rationale: Das konkrete biblische Bild für Macht und Zugriff bleibt erhalten, statt es erklärend durch „Macht“ zu ersetzen.
theological_decisions:
- issue: Bedeutung des Hinabführens in den und Heraufführens aus dem Hades
  choice: Als offene Aussage über Gottes Herrschaft über Tod und Totenreich formuliert, ohne eine ausdrückliche Auferstehungslehre in den Wortlaut einzutragen.
  alternative: Gemeint sein könnte entweder das Führen an den Rand des Todes und die Rettung daraus oder ausdrücklich die Auferweckung aus dem Totenreich.
  rationale: Das Gegensatzpaar κατάγει/ἀνάγει mit ᾅδης trägt beide Deutungsmöglichkeiten. Die Übersetzung bewahrt diese theologische Spannung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst biblischer Bildsprache. Der antithetische Parallelismus wird durch „führt hinab ... führt wieder herauf“ bewahrt; die Formulierung bleibt für gewöhnliche Leser verständlich.
