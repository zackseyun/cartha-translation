  text: Let them all speak and give thanks to him in Jerusalem[a].
translation:
  language: de
  text: Alle sollen reden und ihm in Jerusalem danken.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ihn preisen« oder »sich zu ihm bekennen«; das griechische Verb kann in einem gottesdienstlichen Zusammenhang diese verschiedenen Bedeutungen haben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λεγέτωσαν
  choice: sollen reden
  rationale: Der Imperativ der dritten Person Plural wird im Deutschen natürlich mit „sollen“ wiedergegeben. „Reden“ bewahrt die inhaltliche Offenheit von λέγω, ohne das Gemeinte vorschnell als Verkündigung festzulegen.
- source_word: πάντες
  choice: alle
  rationale: Das substantivisch gebrauchte Adjektiv bezeichnet umfassend alle und lässt sich knapp und unmittelbar mit „alle“ wiedergeben.
- source_word: ἐξομολογείσθωσαν
  choice: danken
  rationale: Das Verb kann im biblisch-griechischen Gottesdienstkontext bekennen, preisen oder danken bedeuten. Im hymnischen Zusammenhang von Tobit 13 ist „danken“ eine natürliche Haupttextentscheidung; die echte Mehrdeutigkeit bleibt in der Fußnote erhalten.
- source_word: αὐτῷ
  choice: ihm
  rationale: Der Dativ des Pronomens bezieht sich auf Gott und wird im Deutschen idiomatisch als Dativobjekt „ihm“ wiedergegeben.
- source_word: ἐν Ἱεροσολύμοις
  choice: in Jerusalem
  rationale: Die Ortsangabe mit ἐν und Dativ entspricht im modernen Standarddeutsch „in Jerusalem“.
theological_decisions:
- issue: Bedeutung von ἐξομολογείσθωσαν im gottesdienstlichen Zusammenhang
  choice: danken
  alternative: bekennen; preisen
  rationale: Der doxologische Kontext legt Dank nahe, doch der griechische Ausdruck trägt auch die Bedeutungen Bekennen und Preisen. Daher wird keine dieser sachlich möglichen Nuancen verschwiegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallelen Aufforderungen bleiben knapp; „sollen“ gibt den griechischen Drittpersonenimperativ natürlich wieder. Der Fußnotenmarker steht unmittelbar nach dem Satz.
