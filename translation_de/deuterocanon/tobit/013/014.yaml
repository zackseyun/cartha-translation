base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/013/014.yaml
  text: Oh[a], blessed are those who love you; they will rejoice over your peace. Blessed are all who were grieved over your afflictions, because they will rejoice over you when they see all your glory; and my soul will rejoice forever.
translation:
  language: de
  text: Wie glücklich sind alle, die dich lieben! Sie werden sich über deinen Frieden freuen. Glücklich sind alle, die über deine Bedrängnisse[a] betrübt waren; denn sie werden sich über dich freuen, wenn sie deine ganze Herrlichkeit sehen. Und meine Seele wird sich in Ewigkeit freuen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Geißelhiebe“, „Plagen“ oder „Züchtigungen“. Das griechische Wort μάστιξ bezeichnet wörtlich eine Peitsche beziehungsweise einen Geißelhieb und übertragen leidvolle Schläge oder Heimsuchungen.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὦ μακάριοι
  choice: O glücklich sind
  rationale: Bewahrt den Ausruf ὦ und gibt μακάριοι als feierlichen Glückwunsch wieder, ohne das im Deutschen missverständliche „selig“ zu erzwingen.
- source_word: οἱ ἀγαπῶντές σε
  choice: alle, die dich lieben
  rationale: Natürliche Wiedergabe des substantivierten Präsenspartizips; „alle“ macht die generische Mehrzahl im Deutschen flüssig.
- source_word: χάρησονται
  choice: sie werden sich freuen
  rationale: Entspricht dem Futur von χαίρω und erhält die wiederkehrende Freude als Leitmotiv.
- source_word: ἐπὶ τῇ εἰρήνῃ σου
  choice: über deinen Frieden
  rationale: ἐπί mit Dativ bezeichnet hier den Anlass beziehungsweise Gegenstand der Freude; „über“ ist dafür idiomatisches Deutsch.
- source_word: ὅσοι ἐλυπήθησαν
  choice: alle, die … betrübt waren
  rationale: Gibt den Aorist passivisch beziehungsweise zuständlich wieder, ohne den Ausdruck auf Totenklage zu verengen.
- source_word: μάστιξίν
  choice: Bedrängnisse
  rationale: Der bildhafte Plural kann Schläge oder leidvolle Heimsuchungen bezeichnen. „Bedrängnisse“ passt zum Leiden der personifizierten Stadt, während eine Fußnote die stärkeren Bildvarianten offenhält.
- source_word: θεασάμενοι
  choice: wenn sie … sehen
  rationale: Das Aoristpartizip wird idiomatisch temporal wiedergegeben; die Freude setzt beim Schauen der Herrlichkeit ein.
- source_word: πᾶσαν τὴν δόξαν σου
  choice: deine ganze Herrlichkeit
  rationale: Bewahrt sowohl die umfassende Kraft von πᾶσαν als auch den erhöhten Klang von δόξα.
- source_word: εὐφρανθήσεται
  choice: wird sich freuen
  rationale: Natürliches Deutsch für die futurische Form und zugleich bewusste Aufnahme des wiederholten Freudenmotivs.
- source_word: εἰς τὸν αἰῶνα
  choice: in Ewigkeit
  rationale: Feierliche, im modernen Bibeldeutsch verständliche Wiedergabe der unbegrenzten Dauer.
- source_word: ἡ ψυχή μου
  choice: meine Seele
  rationale: Erhält die personale und poetisch-andächtige Ausdrucksweise des griechischen Textes.
theological_decisions:
- issue: Bezug der femininen Pronomen der zweiten Person Singular
  choice: Die direkte Anrede bleibt unaufgelöst und bezieht sich im Kontext auf das personifizierte Jerusalem beziehungsweise Zion.
  alternative: Allgemeinere Anrede des Volkes Gottes.
  rationale: Der unmittelbare Zusammenhang spricht von Frieden, Leiden und Herrlichkeit der Stadt. Die Übersetzung bewahrt jedoch schlicht „dich/dein“ und fügt keine Deutung in den Haupttext ein.
- issue: Bedeutung von μάστιξ im Leiden Jerusalems
  choice: Neutraler als „Bedrängnisse“ wiedergegeben, mit stärkeren Alternativen in der Fußnote.
  alternative: „Geißelhiebe“, „Plagen“ oder „Züchtigungen“, möglicherweise mit ausdrücklichem Straf- oder Erziehungscharakter.
  rationale: Das griechische Wort trägt das Bild von Schlägen, legt hier aber nicht eindeutig fest, ob körperliche Gewalt, Plage, Strafe oder allgemeines Leid gemeint ist. Die Übersetzung soll diese theologische Spannung nicht vorschnell auflösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit poetischem Ausruf zu Beginn. Die wiederholte Freude und die direkte Anrede der personifizierten Stadt bleiben hörbar; unnötig altertümliche Formen werden vermieden.
