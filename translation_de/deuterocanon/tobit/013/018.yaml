  text: And all her streets will say[a], ‘Hallelujah and praise!’ saying, ‘Blessed is God, who has exalted all the ages.’
translation:
  language: de
  text: 'Und alle ihre Straßen werden rufen: »Halleluja und Lobpreis!«, und sagen: »Gepriesen ist Gott, der alle Zeitalter erhöht hat.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ῥῦμαι
  choice: Straßen
  rationale: ῥύμη bezeichnet eine Straße oder Gasse innerhalb einer Stadt. »Straßen« ist im heutigen Deutsch natürlich und bewahrt die Personifizierung der Stadt.
- source_word: ἀλληλουιά
  choice: Halleluja
  rationale: Das Griechische übernimmt den liturgischen Ruf als Transliteration; die vertraute deutsche Form »Halleluja« entspricht diesem Befund.
- source_word: αἴνεσιν
  choice: Lobpreis
  rationale: Das Substantiv bezeichnet Lob. »Lobpreis« fügt sich als ausgerufener Ausdruck natürlich zu »Halleluja« und wahrt den gehobenen gottesdienstlichen Ton.
- source_word: Εὐλογητός
  choice: Gepriesen
  rationale: In einer doxologischen Aussage über Gott gibt »Gepriesen ist Gott« den Sinn idiomatisch und würdig wieder. Es bewahrt den Aussagecharakter eher als die Wunschform »Gott sei gepriesen«.
- source_word: ὕψωσεν
  choice: erhöht hat
  rationale: ὑψόω bedeutet erhöhen oder hoch erheben. »Erhöht hat« bleibt eng an der ungewöhnlichen Aussage des griechischen Textes.
- source_word: πάντας τοὺς αἰῶνας
  choice: alle Zeitalter
  rationale: Die Wendung lautet wörtlich »alle Zeitalter« und ist auch im Griechischen ungewöhnlich. Die formal verankerte Wiedergabe bewahrt diese Spannung, statt sie stillschweigend als »für immer« aufzulösen.
theological_decisions:
- issue: Bedeutung von πάντας τοὺς αἰῶνας im Schlusssatz
  choice: alle Zeitalter
  alternative: für immer; in alle Ewigkeit
  rationale: Der griechische Wortlaut stellt »alle Zeitalter« als Objekt von »erhöht hat« dar. Obwohl möglicherweise eine idiomatische Aussage über Gottes ewige Erhabenheit gemeint ist, wird die ungewöhnliche Formulierung im Haupttext nicht geglättet; die mögliche zeitliche Deutung erscheint in der Fußnote.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die personifizierten Straßen bleiben als sprechendes Subjekt erhalten. Die Wiederholung von λέγοντες wird durch »Sie werden sagen« klar aufgenommen; der ungewöhnliche Schlusssatz bleibt bewusst formal nah am Griechischen.
