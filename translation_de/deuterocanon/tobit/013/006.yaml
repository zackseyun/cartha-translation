base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/013/006.yaml
  text: If you turn to him with all your heart and with all your soul[a], to do what is true before him, then he will turn to you and will certainly not hide his face from you. See what he will do with you, and give thanks to him with your whole being; bless the Lord of righteousness[d][c][b], and exalt the King of the ages.
translation:
  language: de
  text: Wenn ihr euch ihm mit eurem ganzen Herzen und mit eurer ganzen Seele zuwendet, um vor ihm Wahrheit zu tun[a], dann wird er sich euch zuwenden und sein Angesicht gewiss nicht vor euch verbergen. Seht, was er mit euch tun wird, und dankt ihm mit eurem ganzen Leib[b]. Preist den Herrn der Gerechtigkeit[c] und erhebt den König der Zeitalter[d]. Ich danke ihm im Land meiner Gefangenschaft und verkünde den sündigen Völkern seine Macht und seine Größe. Kehrt um, ihr Sünder, und übt Gerechtigkeit vor ihm. Wer weiß, ob er euch zugetan sein[e] und euch Barmherzigkeit erweisen wird?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „um vor ihm treu zu handeln“. Wörtlich steht im Griechischen „Wahrheit zu tun“, eine semitisch geprägte Wendung für wahrhaftiges oder treues Handeln vor Gott.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „mit eurem ganzen Leib“. Gemeint sein kann ein Dank, an dem die ganze Person leibhaftig beteiligt ist.'
    reason: idiom_clarification
  - marker: c
    text: 'Oder: „den Herrn des Rechts“.'
    reason: lexical_alternative
  - marker: d
    text: 'Oder: „den ewigen König“. Das Griechische hat die Mehrzahl „der Zeitalter“.'
    reason: lexical_alternative
  - marker: e
    text: 'Wörtlich: „ob er euch wollen wird“. Die ungewöhnliche Formulierung kann bedeuten, dass Gott euch zugetan sein oder euch annehmen wird.'
    reason: lexical_clarification
lexical_decisions:
- source_word: ἐὰν ἐπιστρέψητε ... τότε ἐπιστρέψει
  choice: wenn ihr euch ... zuwendet, dann wird er sich euch zuwenden
  rationale: Die Wiederholung desselben Verbs wird bewahrt und macht die wechselseitige Bewegung von Umkehr und erneuter Zuwendung Gottes hörbar.
- source_word: ἐν ὅλῃ καρδίᾳ ὑμῶν καὶ ἐν ὅλῃ τῇ ψυχῇ
  choice: mit eurem ganzen Herzen und mit eurer ganzen Seele
  rationale: Die umfassende Hingabeformel wird eng am Griechischen und in vertrauter biblischer Sprache wiedergegeben.
- source_word: ποιῆσαι ἐνώπιον αὐτοῦ ἀλήθειαν
  choice: um vor ihm Wahrheit zu tun
  rationale: Die ungewöhnliche semitisch geprägte Verbindung von ποιεῖν und ἀλήθεια bleibt sichtbar; eine idiomatischere Deutung wird in der Fußnote angeboten.
- source_word: οὐ μὴ κρύψῃ τὸ πρόσωπον αὐτοῦ ἀφʼ ὑμῶν
  choice: sein Angesicht gewiss nicht vor euch verbergen
  rationale: „Gewiss nicht“ gibt die emphatische Verneinung οὐ μή wieder; „Angesicht verbergen“ bewahrt das biblische Bild.
- source_word: θεάσασθε ἃ ποιήσει μεθʼ ὑμῶν
  choice: Seht, was er an euch tun wird
  rationale: „Seht“ ist ein natürlicher, nicht altertümlicher Imperativ; „an euch“ gibt μεθʼ ὑμῶν in diesem Handlungskontext idiomatisch wieder.
- source_word: ἐξομολογήσασθε αὐτῷ
  choice: dankt ihm
  rationale: Im Lobkontext bezeichnet ἐξομολογέομαι das dankende Preisen, nicht primär ein Sündenbekenntnis.
- source_word: ἐν ὅλῳ τῷ σώματι ὑμῶν
  choice: mit eurem ganzen Leib
  rationale: Die ausdrückliche Körperbezeichnung σῶμα wird beibehalten, auch wenn die Wendung zugleich die ganze, leibhaftige Person einschließt.
- source_word: τὸν κύριον τῆς δικαιοσύνης
  choice: den Herrn der Gerechtigkeit
  rationale: Die Genitivfügung bleibt als feierlicher Gottestitel erhalten; „Gerechtigkeit“ wahrt die moralische und rechtliche Bedeutungsbreite.
- source_word: τὸν βασιλέα τῶν αἰώνων
  choice: den König der Zeitalter
  rationale: Die Pluralform αἰώνων wird bewahrt und der doxologische Ton erhalten.
- source_word: δεικνύω τὴν ἰσχὺν καὶ τὴν μεγαλοσύνην αὐτοῦ
  choice: verkünde seine Macht und seine Größe
  rationale: δεικνύω bedeutet wörtlich „zeigen“; im Zusammenhang öffentlichen Gotteslobs trifft „verkünden“ die kommunikative Funktion natürlicher.
- source_word: ἔθνεσιν ἁμαρτωλῶν
  choice: unter sündigen Völkern
  rationale: Die kompakte griechische Genitivfügung wird als qualitative Kennzeichnung verstanden; die wörtlichere Form „unter Völkern von Sündern“ wäre im Deutschen schwerfällig.
- source_word: ποιήσατε δικαιοσύνην ἐνώπιον αὐτοῦ
  choice: übt Gerechtigkeit vor ihm
  rationale: „Gerechtigkeit üben“ ist natürliches Deutsch und hält den konkreten Handlungscharakter von ποιεῖν fest.
- source_word: τίς γινώσκει εἰ θελήσει ὑμᾶς
  choice: Wer weiß, ob er Gefallen an euch haben wird
  rationale: Die ungewöhnliche Verbindung von θέλω mit einem Personenobjekt wird sinngemäß als wohlwollende Annahme wiedergegeben, ohne die Unsicherheit der Frage aufzulösen.
- source_word: ποιήσει ἐλεημοσύνην ὑμῖν
  choice: euch Barmherzigkeit erweisen wird
  rationale: ἐλεημοσύνη bezeichnet hier Gottes Erbarmen beziehungsweise barmherziges Handeln, nicht menschliches Almosengeben.
theological_decisions:
- issue: Gegenseitigkeit von menschlicher Umkehr und Gottes Zuwendung
  choice: dieselbe Verbalwurzel durch „zuwenden“ wiederholen
  alternative: menschlich „umkehren“, göttlich „zurückkehren“
  rationale: Die Übersetzung bewahrt die rhetorische Entsprechung des Textes, ohne daraus eine weitergehende Lehre über Verdienst oder Bedingtheit abzuleiten.
- issue: δικαιοσύνη als Gottestitel und menschliches Handeln
  choice: Gerechtigkeit
  alternative: Recht beziehungsweise Recht tun
  rationale: „Gerechtigkeit“ erhält die breite ethische und theologische Bedeutung und verbindet den Titel Gottes mit dem geforderten gerechten Handeln.
- issue: τίς γινώσκει εἰ θελήσει ὑμᾶς
  choice: 'offene Frage: „Wer weiß, ob ...“'
  alternative: zuversichtliche Zusage, dass Gott sie annimmt
  rationale: Die grammatisch ausgedrückte Ungewissheit und Spannung werden nicht in eine sichere Verheißung umgedeutet.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst bewahrten biblischen Bildern wie „sein Angesicht verbergen“. Ungewöhnliche Quellformulierungen werden dort formal erhalten, wo sie verständlich bleiben, und durch knappe Fußnoten erläutert. Der gesamte im griechischen Quelltext überlieferte Vers ist übersetzt, einschließlich des im englischen Konsultationstext nicht enthaltenen Schlussteils.
