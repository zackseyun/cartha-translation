  text: For Jerusalem will be built with sapphire and emerald[a], and your walls with precious stones, and the towers and battlements with pure gold[c][b],
translation:
  language: de
  text: Denn Jerusalem wird mit Saphir und Smaragd erbaut werden[a], deine Mauern mit kostbarem Gestein und die Türme und Bollwerke mit reinem Gold.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wiederaufgebaut werden“. Im Griechischen steht schlicht „erbaut werden“; der Zusammenhang der Wiederherstellung kann jedoch einen Wiederaufbau nahelegen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἰκοδομηθήσεται
  choice: wird … erbaut werden
  rationale: Das Futur Passiv von οἰκοδομέω bezeichnet schlicht das Bauen. Der Wiederherstellungskontext lässt auch „wiederaufgebaut werden“ zu, doch ein ausdrückliches Präfix für „wieder-“ fehlt.
- source_word: σαπφείρῳ καὶ σμαράγδῳ
  choice: mit Saphir und Smaragd
  rationale: Die Dative können das Baumaterial oder die Ausstattung bezeichnen. „Mit“ bewahrt diese Offenheit und klingt im Deutschen natürlich.
- source_word: λίθῳ ἐντίμῳ
  choice: mit kostbarem Gestein
  rationale: Der griechische Singular kann kollektiv als Materialangabe verstanden werden. „Kostbares Gestein“ gibt dies idiomatisch wieder, ohne künstlich eine einzelne Steinart festzulegen.
- source_word: τὰ τείχη σου
  choice: deine Mauern
  rationale: Das ausdrücklich gebrauchte Possessivpronomen der zweiten Person erhält die direkte Anrede Jerusalems.
- source_word: οἱ πύργοι
  choice: die Türme
  rationale: „Türme“ ist im Zusammenhang einer befestigten Stadt die klare und übliche Entsprechung.
- source_word: οἱ προμαχῶνες
  choice: die Bollwerke
  rationale: Der Ausdruck bezeichnet vorgelagerte oder verstärkende Verteidigungsanlagen. „Bollwerke“ ist verständlich und hält die Bedeutung weiter als das speziellere „Zinnen“.
- source_word: χρυσίῳ καθαρῷ
  choice: mit reinem Gold
  rationale: Der Dativ bezeichnet wiederum Material oder Ausstattung; „reines Gold“ entspricht καθαρός natürlich und präzise.
theological_decisions:
- issue: Zukünftige Wiederherstellungs- und Herrlichkeitsbilder für Jerusalem
  choice: Die prächtige Bauvision wird unverändert als poetische Zukunftsaussage wiedergegeben.
  alternative: Die Materialien ausdrücklich als wörtliche Architektur oder ausdrücklich als Symbole der wiederhergestellten Herrlichkeit deuten.
  rationale: Der griechische Text entscheidet nicht zwischen wörtlicher, hyperbolischer und symbolischer Lesart. Die Übersetzung bewahrt daher Bild und Spannung, ohne sie theologisch festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Anrede Jerusalems bleibt durch „deine Mauern“ erhalten. „Kostbares Gestein“ gibt den kollektiven Singular idiomatisch wieder; „Bollwerke“ bezeichnet allgemein die Verteidigungsanlagen.
