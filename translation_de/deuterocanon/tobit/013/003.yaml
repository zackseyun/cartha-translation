base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/013/003.yaml
  text: Give thanks to him[a], O sons of Israel, before the nations, because he himself has scattered us among them.
translation:
  language: de
  text: Dankt ihm[a], ihr Söhne Israels, vor den Völkern; denn er selbst hat uns unter ihnen zerstreut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Bekennt euch zu ihm“ oder „Preist ihn“; das griechische Verb kann je nach Zusammenhang anerkennen, bekennen, danken oder preisen bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξομολογεῖσθε
  choice: Dankt
  rationale: Das Verb kann im biblischen Griechisch bekennen, anerkennen, danken oder preisen bedeuten. Im Zusammenhang des öffentlichen Gotteslobs gibt „Dankt“ den Aufforderungscharakter natürlich wieder, ohne die Bedeutung auf ein Sündenbekenntnis zu verengen.
- source_word: αὐτῷ
  choice: ihm
  rationale: Der Dativ bezieht sich unmittelbar auf Gott und wird schlicht beibehalten.
- source_word: οἱ υἱοὶ Ἰσραήλ
  choice: ihr Söhne Israels
  rationale: Die ausdrückliche maskuline Mehrzahl wird bewahrt; „ihr“ gibt die Anrede im heutigen Deutsch natürlicher wieder als ein vorangestelltes „o“.
- source_word: ἐνώπιον τῶν ἐθνῶν
  choice: vor den Völkern
  rationale: Die Wendung bezeichnet die Gegenwart beziehungsweise Öffentlichkeit vor den Völkern und bleibt von dem folgenden „unter ihnen“ unterschieden.
- source_word: ὅτι
  choice: denn
  rationale: Die Konjunktion leitet die Begründung der Aufforderung ein; „denn“ fügt sich würdig und natürlich in den deutschen Satz.
- source_word: αὐτὸς
  choice: er selbst
  rationale: Das ausdrücklich gesetzte Pronomen ist betont; „er selbst“ erhält diese Hervorhebung, ohne Ausschließlichkeit hinzuzufügen.
- source_word: διέσπειρεν
  choice: hat ... zerstreut
  rationale: Das Perfekt bezeichnet im Deutschen natürlich eine vergangene Handlung Gottes mit fortdauernder gegenwärtiger Folge.
- source_word: ἡμᾶς
  choice: uns
  rationale: Das direkte Objekt wird ohne Erweiterung wiedergegeben.
- source_word: ἐν αὐτοῖς
  choice: unter ihnen
  rationale: Das Pronomen verweist auf die Völker; bei Personengruppen ist „unter ihnen“ die natürliche deutsche Wiedergabe.
theological_decisions:
- issue: Israels Zerstreuung als Handeln Gottes
  choice: denn er selbst hat uns unter ihnen zerstreut
  alternative: denn er selbst hat uns unter sie versprengt
  rationale: Der griechische Text schreibt die Zerstreuung ausdrücklich Gott zu. Diese theologische Spannung wird weder abgeschwächt noch durch eine Erklärung aufgelöst.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Anrede bleibt erhalten; das altertümlich wirkende Anredepartikel „o“ wird vermieden. Das Semikolon gliedert Aufforderung und Begründung klar.
