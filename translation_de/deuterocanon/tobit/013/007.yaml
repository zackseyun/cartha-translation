base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/013/007.yaml
  text: I exalt my God[a], and my soul rejoices in the King of heaven, and it will exult in his greatness.
translation:
  language: de
  text: Ich erhebe meinen Gott, und meine Seele freut sich am König des Himmels[a] und wird über seine Größe jubeln.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der mittlere griechische Satzteil ist elliptisch und lautet wörtlich: „und meine Seele dem König des Himmels“. „Freut sich am“ ist aus dem poetischen Lobzusammenhang ergänzt; auch andere syntaktische Ergänzungen sind möglich.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὑψῶ
  choice: ich werde … erheben
  rationale: Die Form bezeichnet hier am ehesten ein zukünftiges Erhöhen beziehungsweise Preisen. „Erheben“ bewahrt das bildhafte Lobpreisvokabular des Griechischen.
- source_word: ψυχή
  choice: meine Seele
  rationale: Die ausdrückliche Nennung der Seele wird beibehalten und wahrt den poetisch-andächtigen Ton.
- source_word: βασιλεῖ τοῦ οὐρανοῦ
  choice: am König des Himmels
  rationale: „König des Himmels“ gibt den göttlichen Titel und die Genitivverbindung direkt wieder; „am“ gehört zur behutsam ergänzten deutschen Wendung „sich freuen an“.
- source_word: ἀγαλλιάσεται
  choice: wird … jubeln
  rationale: Das Futur bezeichnet überschwängliche Freude. „Jubeln“ ist im Deutschen klar, kräftig und dem hymnischen Zusammenhang angemessen.
- source_word: μεγαλοσύνην
  choice: über seine Größe
  rationale: „Größe“ ist die breiteste unmittelbare Entsprechung; die Präposition „über“ macht die Verbindung mit „jubeln“ im Deutschen idiomatisch.
- source_word: καὶ ἡ ψυχή μου τῷ βασιλεῖ τοῦ οὐρανοῦ
  choice: und meine Seele freut sich am König des Himmels
  rationale: Die überlieferte griechische Wortfolge enthält kein ausdrückliches Verb. Im Lobkontext drückt die Ergänzung „freut sich am“ den wahrscheinlichen poetischen Sinn aus, ohne die Ellipse unbemerkt zu glätten.
theological_decisions:
- issue: Verblose, elliptische Mittelphrase
  choice: Als poetische Ellipse verstanden und mit „freut sich am“ ergänzt
  alternative: „Und meine Seele [gehört] dem König des Himmels“ oder Ergänzung eines anderen Lobverbs
  rationale: Der griechische Text legt die genaue syntaktische Ergänzung nicht eindeutig fest. Der Lob- und Freudenkontext stützt „freut sich am“, doch die Fußnote hält die echte Mehrdeutigkeit offen, statt eine dogmatische Festlegung vorzunehmen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit hymnischem Klang. Die beiden Zukunftsformen des griechischen Textes werden wiedergegeben; die syntaktische Ellipse wird im Haupttext lesbar ergänzt und in der Fußnote offengelegt.
