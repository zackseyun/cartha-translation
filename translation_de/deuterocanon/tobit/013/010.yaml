  to: Danke dem Herrn gebührend und preise den König der Zeitalter, damit sein Zelt wieder mit Freude für dich aufgebaut wird und er die Gefangenen in dir erfreut und die Bedrängten in dir liebt, für alle Generationen des Zeitalters.
