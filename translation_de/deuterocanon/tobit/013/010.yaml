base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/013/010.yaml
  text: Give thanks well to the Lord, and bless the King of the ages, so that his tent may again be built for you with joy; and so that he may gladden within you the captives and love within you the afflicted for all the generations of the age.
translation:
  language: de
  text: Danke dem Herrn gebührend und preise den König der Zeitalter, damit sein Zelt wieder mit Freude für dich aufgebaut wird und er die Gefangenen in dir erfreut und die Bedrängten in dir liebt, für alle Generationen des Zeitalters.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξομολόγου
  choice: Danke
  rationale: Das Verb bezeichnet in diesem Lobkontext das öffentliche Danken beziehungsweise Preisen; „Danke“ gibt die Aufforderung klar und idiomatisch wieder.
- source_word: ἀγαθῶς
  choice: gebührend
  rationale: Das Adverb bedeutet „gut, recht, auf angemessene Weise“. „Gebührend“ bewahrt diesen modalen Sinn, ohne ihn als Hinweis auf Gottes Güte umzudeuten.
- source_word: τὸν βασιλέα τῶν αἰώνων
  choice: den König der Zeitalter
  rationale: Die formnahe Wiedergabe erhält den pluralischen Ausdruck αἰώνων und seinen feierlichen Klang.
- source_word: ἡ σκηνὴ αὐτοῦ
  choice: sein Zelt
  rationale: σκηνή bedeutet zunächst „Zelt“ und kann zugleich an Gottes Wohnstätte beziehungsweise Heiligtum erinnern; „Zelt“ bewahrt diese Bildsprache.
- source_word: τοὺς ταλαιπώρους
  choice: die Bedrängten
  rationale: Der Ausdruck bezeichnet Menschen in Not und Elend; „Bedrängte“ ist würdig, verständlich und vermeidet eine abwertende Bezeichnung.
- source_word: εἰς πάσας τὰς γενεὰς τοῦ αἰῶνος
  choice: durch alle Generationen des Zeitalters hindurch
  rationale: Die ungewöhnliche Zeitformel wird bewusst formnah wiedergegeben, statt sie stillschweigend zu einem schlichten „für immer“ zu glätten.
theological_decisions:
- issue: Bezug von „in dir“
  choice: 'Die Ortsangabe wird jeweils unmittelbar beim Verb bewahrt: „in dir … erfreut“ und „in dir … liebt“.'
  alternative: „die Gefangenen in dir“ und „die Bedrängten in dir“
  rationale: Die griechische Wortstellung setzt ἐν σοὶ vor die jeweiligen Objekte und lässt einen Bezug sowohl zum Handeln als auch zu den in der angesprochenen Stadt befindlichen Menschen anklingen. Die gewählte Stellung wahrt diese Spannung möglichst weitgehend.
- issue: Unausgesprochenes Subjekt von εὐφρᾶναι und ἀγαπήσαι
  choice: „er“, auf den Herrn beziehungsweise König bezogen
  alternative: Unpersönliche oder passive Wiedergabe
  rationale: Die Infinitive führen den Zwecksatz fort; als handelndes Subjekt liegt der zuvor genannte Herr/König nahe, ohne dass eine zusätzliche Benennung eingeführt wird.
translation_notes:
  register: Feierliches, aber gegenwärtiges Standarddeutsch. Die direkte Anrede im Singular bleibt erhalten; aus dem Kontext ist die personifizierte Stadt angesprochen. Ungewöhnliche Quellformulierungen wie „König der Zeitalter“ und „Generationen des Zeitalters“ werden nicht vorschnell idiomatisch eingeebnet.
