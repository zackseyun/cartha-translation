lexical_decisions:
- source_word: εὐλόγει
  choice: Preise
  rationale: Der Singularimperativ von εὐλογέω fordert hier dazu auf, ehrend von Gott zu sprechen. „Preise“ gibt diesen biblischen Sprachgebrauch im heutigen Deutsch natürlicher wieder als das missverständliche „Segne“.
- source_word: τὸν θεὸν
  choice: Gott
  rationale: Der artikulierte Akkusativ bezeichnet das direkte Objekt; im Deutschen steht der Gottesname idiomatisch ohne Artikel.
- source_word: τὸν βασιλέα τὸν μέγαν
  choice: den großen König
  rationale: Die Wortgruppe steht appositionell zu „Gott“. „Groß“ entspricht μέγας unmittelbar und bewahrt die umfassende Hoheitsaussage, ohne sie auf Macht einzuengen.
theological_decisions:
- issue: Wiedergabe des göttlichen Königstitels
  choice: den großen König
  alternative: den großen König [mit typografischer Hervorhebung als Titel]
  rationale: Das Griechische bezeichnet Gott appositionell als „den König, den großen“. Die deutsche Form ist natürlich und bewahrt den erhabenen Königstitel; eine besondere Großschreibung von „König“ ist nach deutscher Rechtschreibung weder nötig noch textlich gefordert.
translation_notes:
  register: Kurzer, würdevoller Imperativ in modernem Standarddeutsch. „Preise“ ist im religiösen Kontext allgemein verständlich und vermeidet die im Deutschen naheliegende Fehlbedeutung, ein Mensch solle Gott Segen verleihen. Das Schlusskomma wurde beibehalten, weil der vorgelegte Versausschnitt syntaktisch offenbar weiterführt.
