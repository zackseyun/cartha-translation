base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/013/001.yaml
  text: Then Tobit wrote a prayer of rejoicing and said[a], “Blessed is the living God forever, and his kingdom.”
translation:
  language: de
  text: 'Dann schrieb Tobit ein Gebet des Jubels und sagte[a]: »Gepriesen ist der lebendige Gott in Ewigkeit – und sein Reich.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der griechische Text endet unvermittelt mit »und sein Reich«. Manche Übersetzungen ergänzen sinngemäß ein Prädikat wie »ist gepriesen« oder beziehen »in Ewigkeit« auch auf das Reich. Hier bleibt die knappe Form erhalten, damit nichts ergänzt wird, was im Ausgangstext nicht ausdrücklich steht.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔγραφεν
  choice: schrieb
  rationale: Die direkte Wiedergabe führt das schriftlich festgehaltene Gebet ein. »Verfasste« wäre möglich, würde aber eine stärkere literarische Nuance hinzufügen.
- source_word: προσευχὴν
  choice: ein Gebet
  rationale: Natürliche und unmittelbare Wiedergabe des Akkusativobjekts.
- source_word: εἰς ἀγαλλίασιν
  choice: des Jubels
  rationale: Gibt den freudig-feierlichen Charakter des Gebets knapp und idiomatisch wieder, ohne die Präpositionalfügung unnötig auszudeuten.
- source_word: Εὐλογητὸς
  choice: Gepriesen
  rationale: Im doxologischen Zusammenhang ist »Gepriesen« im modernen Deutschen natürlicher als »Gesegnet« und wahrt den liturgischen Ton.
- source_word: ὁ θεὸς ὁ ζῶν
  choice: der lebendige Gott
  rationale: Entspricht der griechischen attributiven Konstruktion und der geläufigen biblischen Wendung.
- source_word: εἰς τοὺς αἰῶνας
  choice: in Ewigkeit
  rationale: Klare, würdige und idiomatische Wiedergabe der griechischen Zeitformel.
- source_word: βασιλεία
  choice: Reich
  rationale: »Reich« bewahrt die substantivische Form und den biblisch-doxologischen Klang; »Herrschaft« wäre ebenfalls möglich, deutete den Ausdruck aber stärker funktional.
theological_decisions:
- issue: Deutung der prädikatslosen Schlusswendung καὶ ἡ βασιλεία αὐτοῦ
  choice: 'Als elliptische Fortsetzung wiedergegeben: »– und sein Reich.«'
  alternative: »und gepriesen ist sein Reich«; »und sein Reich besteht in Ewigkeit«; »und sein Reich ist gepriesen«
  rationale: Der überlieferte griechische Text enthält kein ausdrückliches Prädikat und bricht syntaktisch knapp ab. Der Gedankenstrich markiert diese Ellipse, ohne ein theologisches Prädikat zu ergänzen oder die Wendung eindeutig mit »in Ewigkeit« zu verbinden.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem biblischem Register. »Gebet des Jubels« wahrt den feierlichen Charakter; die Schlussellipse bleibt bewusst sichtbar.
