    text: בעת ההיא כתב טוביה את כל הדברים האלה בשמחה ויאמר טובי ברוך יי האלהים הגדול המפליא לעשות פלאיו לעמו ועכשיו והוא מוחץ ורופא וממית ומחיה ומוריד שאול ויעל אשר פזר אותנו בין הגוים חייבין אנו להודיע את כל הנפלאות האלה בין העמים ואתם בני ישראל חזקו ויאמץ לבבכם ולא ירפו ידיכם כי יש שכר לפעולתכם והוא [יחכה לחננכם ו]ירום לרחמכם כי אלהי משפט יי אשרי כל חוכי לו ואתם בני הרבו צדקה תפלה ותחנה לפני רבון [כל] העולם כי צדקה ותפלה דוחין את הגזרה שנאמר "וצדקה תציל ממות" (משלי י, ב).
