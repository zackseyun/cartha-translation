base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/013/012.yaml
  text: All who hate you are accursed; all who love you will be blessed forever.
translation:
  language: de
  text: Verflucht sind alle, die dich hassen; alle, die dich lieben, werden für immer gesegnet sein.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπικατάρατοι
  choice: verflucht
  rationale: Das prädikative Adjektiv bezeichnet Menschen, die unter einem Fluch stehen. „Verflucht“ bewahrt die feierliche und starke Aussage und ist im heutigen Deutsch natürlich.
- source_word: μισοῦντές
  choice: die dich hassen
  rationale: Das Partizip wird substantivisch gebraucht. „Die dich hassen“ gibt den direkten Gegensatz zu denen, die lieben, klar wieder.
- source_word: εὐλογημένοι
  choice: gesegnet
  rationale: Hier geht es um den Empfang von Segen, nicht lediglich um Lob. „Gesegnet“ ist die sachlich und theologisch angemessene Wiedergabe.
- source_word: ἀγαπῶντές
  choice: die dich lieben
  rationale: Das substantivische Partizip wird direkt und parallel zu „die dich hassen“ wiedergegeben.
- source_word: ἔσονται
  choice: werden … sein
  rationale: Die Futurform des griechischen Verbs bleibt ausdrücklich erhalten. Die Stellung „gesegnet werden … sein“ ist idiomatisches Deutsch und hält zugleich den Gegensatz zur verblosen ersten Aussage fest.
- source_word: εἰς τὸν αἰῶνα
  choice: für immer
  rationale: Die feste Wendung bezeichnet unbegrenzte Dauer. „Für immer“ ist in modernem Standarddeutsch klar und würdig.
theological_decisions:
- issue: Aussagekraft von Fluch und Segen gegenüber der als „du“ angeredeten Stadt
  choice: Als ungemilderte Aussage über Fluch und Segen wiedergeben
  alternative: Als bloße Missbilligung beziehungsweise Anerkennung abschwächen
  rationale: Die griechischen Begriffe bezeichnen wirklichen Fluch und Segen. Die Übersetzung bewahrt dieses theologische Gewicht, ohne die Art oder den Urheber von Fluch und Segen näher festzulegen.
translation_notes:
  register: 'Modernes, würdiges Standarddeutsch. Der Parallelismus und die unterschiedliche Zeitform der beiden Aussagen bleiben sichtbar: gegenwärtiger Zustand in der verblosen ersten Hälfte, ausdrückliches Futur in der zweiten.'
