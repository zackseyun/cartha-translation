base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/013/013.yaml
  text: Rejoice and exult over the sons of the righteous[a], because they will be gathered together and will bless the Lord of the righteous.
translation:
  language: de
  text: Freue dich und juble über die Söhne der Gerechten[a], denn sie werden zusammengeführt werden und den Herrn der Gerechten preisen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die Kinder der Gerechten«. Das griechische Wort bedeutet wörtlich »Söhne«, kann hier aber auch Nachkommen im weiteren Sinn bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρηθι
  choice: Freue dich
  rationale: Der Imperativ wird natürlich und direkt wiedergegeben und bildet mit dem folgenden, stärkeren Freudenverb ein passendes Paar.
- source_word: ἀγαλλίασαι
  choice: juble
  rationale: „Juble“ bewahrt die gesteigerte, feierliche Freude, ohne dasselbe Verb zu wiederholen.
- source_word: ἐπὶ τοῖς υἱοῖς τῶν δικαίων
  choice: über die Söhne der Gerechten
  rationale: „Über“ bezeichnet idiomatisch den Anlass beziehungsweise Gegenstand der Freude; „Söhne“ gibt das ausdrücklich maskuline υἱοί transparent wieder.
- source_word: συναχθήσονται
  choice: sie werden zusammengeführt werden
  rationale: Die Form ist Futur Passiv. „Zusammengeführt werden“ wahrt sowohl das Passiv als auch den gemeinschaftlichen und wiederherstellenden Klang.
- source_word: εὐλογήσουσιν
  choice: werden … preisen
  rationale: εὐλογέω kann im Blick auf Gott „preisen“ oder „loben“ bedeuten. Im modernen Deutschen ist „den Herrn preisen“ natürlich und vermeidet das missverständliche „den Herrn segnen“.
- source_word: τὸν κύριον τῶν δικαίων
  choice: den Herrn der Gerechten
  rationale: Die Genitivverbindung wird formal bewahrt, ohne sie als „den gerechten Herrn“ oder als Apposition umzudeuten.
theological_decisions:
- issue: Geschlechtsspezifische Nachkommenschaftssprache in τοῖς υἱοῖς τῶν δικαίων
  choice: die Söhne der Gerechten
  alternative: die Kinder der Gerechten
  rationale: Der griechische Text hat ausdrücklich das maskuline „Söhne“. Da die Wendung zugleich Nachkommen umfassender bezeichnen kann, wird diese Möglichkeit in einer Fußnote erhalten.
- issue: Deutung von τὸν κύριον τῶν δικαίων
  choice: den Herrn der Gerechten
  alternative: den gerechten Herrn; den Herrn, den Gerechten
  rationale: Die naheliegende syntaktische Lesart ist eine Genitivverbindung. Die Alternativen setzen eine Umdeutung voraus, die der Wortlaut nicht verlangt.
- issue: Wiedergabe von εὐλογήσουσιν bei Gott als Objekt
  choice: preisen
  alternative: segnen
  rationale: „Preisen“ entspricht in diesem Kontext dem idiomatischen Sinn des griechischen Verbs und klingt im Deutschen natürlich; „segnen“ wäre formnäher, könnte aber fälschlich nahelegen, Menschen verliehen Gott Segen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallelen Aufforderungen „Freue dich und juble“ erhalten den feierlichen Ton; ungewöhnliche, aber theologisch offene Genitivsprache bleibt bewusst stehen.
