  text: Ἱεροσόλυμα πόλις ἁγίου· μαστιγώσει ἐπὶ τὰ ἔργα τῶν υἱῶν σου, καὶ πάλιν ἐλεήσει τοὺς υἱοὺς τῶν δικαίων.
