  source_fidelity: Der Entwurf gibt die Anrede an Jerusalem, die Apposition „Stadt des Heiligen“, die beiden futurischen Aussagen sowie das Verhältnis von Züchtigung aufgrund der Taten und anschließendem Erbarmen zuverlässig wieder. „dich“ ergibt sich korrekt aus der direkten Anrede. Das ergänzte „Er“ ist im Kontext als Gott plausibel und entspricht der für einen deutschen Satz nötigen Explizierung, ohne den griechischen Wortlaut weiter auszudeuten.
  naturalness: Modernes, verständliches und zugleich würdiges Standarddeutsch. „wegen der Taten“, „geißeln“ und „sich über ... erbarmen“ sind idiomatisch; die Satzfügung bewahrt die knappe, prophetisch-poetische Spannung des Ausgangstextes.
  terminology: „Stadt des Heiligen“ wahrt die wahrscheinlich göttliche Referenz von ἁγίου, ohne sie im Text zu einer dogmatisch engeren Benennung auszubauen. „Kinder“ ist an beiden Stellen als kollektive, kontextgerechte Wiedergabe von υἱοί vertretbar. „Gerechte“ gibt δικαίων sachgerecht substantivisch wieder. Die Fußnoten dokumentieren sowohl die semantische Offenheit von ἁγίου als auch die wörtliche maskuline Form υἱοί und ihre kollektive Funktion.
