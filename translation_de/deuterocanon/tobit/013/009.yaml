base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/013/009.yaml
  text: 'Jerusalem[a], city of the Holy One: he will scourge you for the works of your children[b], and again he will show mercy to the children of the righteous.'
translation:
  language: de
  text: 'Jerusalem, Stadt des Heiligen[a]: Er wird dich wegen der Taten deiner Kinder[b] geißeln und sich wieder über die Kinder der Gerechten erbarmen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich kann das artikellose Griechisch auch »Stadt eines Heiligen« bedeuten; im Zusammenhang ist mit »dem Heiligen« wahrscheinlich Gott gemeint.
    reason: lexical_alternative
  - marker: b
    text: Das Griechische hat hier und am Versende wörtlich »Söhne«; gemeint ist jeweils die Gesamtheit der Kinder beziehungsweise Nachkommen.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἱεροσόλυμα
  choice: Jerusalem
  rationale: Die im Deutschen übliche Form des Ortsnamens.
- source_word: πόλις ἁγίου
  choice: Stadt des Heiligen
  rationale: Die Genitivverbindung bezeichnet Jerusalem am natürlichsten als Stadt dessen, der heilig ist; im Zusammenhang ist damit wahrscheinlich Gott gemeint. Die artikellose griechische Form bleibt in einer Fußnote als Mehrdeutigkeit kenntlich.
- source_word: μαστιγώσει
  choice: wird dich geißeln
  rationale: Das Verb bezeichnet wörtlich das Geißeln und vermittelt bildhaft eine harte Züchtigung. Das im Griechischen nicht eigens ausgedrückte Objekt wird aus der direkten Anrede Jerusalems als „dich“ ergänzt.
- source_word: ἐπὶ τὰ ἔργα
  choice: wegen der Taten
  rationale: ἐπί mit Akkusativ gibt hier den Grund der Züchtigung an; „Taten“ ist im heutigen Deutsch natürlicher als „Werke“.
- source_word: τῶν υἱῶν σου
  choice: deiner Kinder
  rationale: Obwohl υἱοί formal „Söhne“ bedeutet, sind kollektiv die zu Jerusalem gehörenden Menschen gemeint, nicht ausschließlich männliche Nachkommen.
- source_word: πάλιν
  choice: wieder
  rationale: Das Wort markiert die erneute Zuwendung des Erbarmens nach dem Gericht.
- source_word: ἐλεήσει
  choice: wird sich … erbarmen
  rationale: Die feste deutsche Verbindung „sich über jemanden erbarmen“ gibt den aktiven göttlichen Erweis von Barmherzigkeit würdig und verständlich wieder.
- source_word: τοὺς υἱοὺς τῶν δικαίων
  choice: die Kinder der Gerechten
  rationale: „Kinder“ gibt den kollektiven Sinn von υἱοί wieder; δικαίων wird substantivisch als moralisch-theologische Bezeichnung „der Gerechten“ übersetzt.
theological_decisions:
- issue: Unausgesprochenes Subjekt von μαστιγώσει und ἐλεήσει
  choice: Gott wird durch „Er“ als Subjekt kenntlich gemacht.
  alternative: Das Subjekt unausgesprochen lassen oder Jerusalem als bloßen grammatischen Bezugspunkt behandeln.
  rationale: Im griechischen Satz steht kein ausdrückliches Subjekt. Der Zusammenhang von Gericht und Erbarmen sowie die Bezeichnung „Stadt des Heiligen“ weisen jedoch am ehesten auf Gott als Handelnden. Da ein deutscher Aussagesatz hier ein Subjekt verlangt, wird „Er“ ergänzt.
- issue: Männliche Verwandtschaftsbezeichnung υἱοί
  choice: An beiden Stellen „Kinder“.
  alternative: An beiden Stellen „Söhne“.
  rationale: Die poetische Anrede Jerusalems bezieht sich kollektiv auf dessen Bevölkerung beziehungsweise Nachkommenschaft und ist nicht erkennbar auf männliche Personen beschränkt.
- issue: Referenz von ἁγίου
  choice: „des Heiligen“ als wahrscheinliche Gottesbezeichnung.
  alternative: „eines Heiligen“ als unbestimmte Personenbezeichnung.
  rationale: Der artikellose Genitiv lässt formal eine unbestimmtere Deutung zu; im Kontext ist die substantivische Gottesbezeichnung jedoch am wahrscheinlichsten. Die Fußnote bewahrt die sprachliche Offenheit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Geißeln“ bewahrt die kräftige Bildsprache des griechischen Verbs; „Taten“ und „Kinder“ sorgen zugleich für natürliche Verständlichkeit. Die parallelen Zukunftsaussagen zu Gericht und Erbarmen bleiben knapp und spannungsvoll nebeneinandergestellt.
