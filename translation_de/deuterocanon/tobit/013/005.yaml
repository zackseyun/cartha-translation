  yaml_path: translation/deuterocanon/tobit/013/005.yaml
  text: And he will scourge us for our injustices[a], and again he will show mercy and gather us from all the nations among which you were scattered.
translation:
  language: de
  text: Und er wird uns wegen unserer Vergehen geißeln; wieder wird er sich erbarmen und uns aus allen Völkern sammeln, unter die ihr auch immer zerstreut worden seid.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der griechische Text wechselt hier von „uns/unserer“ zu „ihr“. Die Wendung „unter die ihr auch immer zerstreut worden seid“ gibt die unbestimmte Nuance von οὗ ἐὰν wieder.
    reason: Bewahrung des Personenwechsels und der möglichen unbestimmten Nuance von οὗ ἐὰν mit dem Konjunktiv.
lexical_decisions:
- source_word: μαστιγώσει
  choice: wird … geißeln
  rationale: Das Verb bezeichnet wörtlich das Auspeitschen oder Geißeln und steht hier bildlich für eine strenge göttliche Züchtigung. „Geißeln“ bewahrt die Stärke des griechischen Ausdrucks besser als das allgemeinere „bestrafen“.
- source_word: ἐν ταῖς ἀδικίαις ἡμῶν
  choice: wegen unserer Vergehen
  rationale: ἐν hat hier im Zusammenhang einen begründenden Sinn. „Vergehen“ gibt den Plural von ἀδικίαις wieder und bezeichnet begangenes Unrecht, ohne den Ausdruck vorschnell mit dem umfassenderen Begriff „Sünden“ gleichzusetzen.
- source_word: πάλιν ἐλεήσει
  choice: dann wird er sich wieder erbarmen
  rationale: „Wieder“ wahrt πάλιν und kennzeichnet die erneute Zuwendung nach der Züchtigung; „sich erbarmen“ ist eine natürliche und würdevolle Wiedergabe von ἐλεήσει.
- source_word: συνάξει ἡμᾶς
  choice: wird … uns … sammeln
  rationale: συνάγω bezeichnet das Zusammenführen und ist besonders für die Wiederherstellung eines zerstreuten Volkes passend. „Sammeln“ bewahrt dieses Motiv knapp und unmittelbar.
- source_word: ἐξ πάντων τῶν ἐθνῶν
  choice: aus allen Völkern
  rationale: ἔθνη meint hier die Völker, unter denen Israel zerstreut ist. „Völker“ ist kontextgemäßer als „Heiden“ und vermeidet eine unnötige konfessionelle oder dogmatische Zuspitzung.
- source_word: οὗ ἐὰν σκορπισθῆτε ἐν αὐτοῖς
  choice: unter die ihr zerstreut worden seid
  rationale: Die Wendung beschreibt die Völker als Bereich der Zerstreuung. Die deutsche Formulierung ist idiomatisch und bewahrt insbesondere den auffälligen Wechsel zur zweiten Person Plural; die mit ἐὰν mögliche unbestimmte Nuance wird in der Fußnote kenntlich gemacht.
theological_decisions:
- issue: Wechsel von der ersten Person Plural zur zweiten Person Plural im letzten Satzteil
  choice: 'Der Wechsel bleibt erhalten: „uns … unserer … uns … ihr“.'
  alternative: 'Den gesamten Vers an die erste Person angleichen: „unter die wir zerstreut worden sind“.'
  rationale: Der vorliegende griechische Text wechselt ausdrücklich von ἡμᾶς/ἡμῶν zur zweiten Person σκορπισθῆτε. Die Übersetzung glättet diesen rhetorischen Wechsel nicht.
- issue: Zeitliche beziehungsweise unbestimmte Nuance von οὗ ἐὰν σκορπισθῆτε
  choice: Im Haupttext steht idiomatisch „unter die ihr zerstreut worden seid“, mit Hinweis auf die mögliche Wiedergabe „wohin auch immer ihr zerstreut werdet“ in der Fußnote.
  alternative: „wohin auch immer ihr zerstreut werdet“ unmittelbar in den Haupttext aufnehmen.
  rationale: οὗ mit ἐὰν und dem Konjunktiv kann einen unbestimmten Sinn ausdrücken. Im Zusammenhang mit Sammlung und Zerstreuung ist die rückblickende deutsche Form natürlich, doch die griechische Offenheit soll nicht verschwiegen werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Geißeln“ bewahrt bewusst die Härte des Bildes, während „Vergehen“ verständlich bleibt und den Plural des griechischen Ausdrucks wiedergibt. Das Semikolon macht den Umschwung von Züchtigung zu Erbarmen lesbar, ohne ihn theologisch zu erklären.
