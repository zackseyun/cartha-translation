source:
  edition: lxx-swete-1909
  text: ἐκεῖ ὑποδείξατε τὴν μεγαλοσύνην αὐτοῦ, ὑψοῦτε αὐτὸν ἐνώπιον παντὸς ζῶντος· καθότι αὐτὸς κύριος ἡμῶν, καὶ θεὸς αὐτὸς πατὴρ ἡμῶν, εἰς πάντας τοὺς αἰῶνας.
