base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/013/004.yaml
  text: There declare his greatness[a], and exalt him before every living being; for he is our Lord[c][b], and he is our God and our Father forever.
translation:
  language: de
  text: Dort verkündet seine Größe[a] und erhebt ihn vor allem, was lebt[b]; denn er ist unser Herr, und er ist unser Gott und unser Vater in alle Ewigkeit[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zeigt seine Majestät“. Das griechische Verb kann „zeigen“ oder „bekannt machen“ bedeuten; das Substantiv auch „Majestät“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „vor jedem Lebenden“. Im Zusammenhang sind besonders alle lebenden Menschen gemeint, doch die griechische Formulierung ist weiter.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „in alle Zeitalter“; die Wendung bezeichnet eine unbegrenzte Dauer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκεῖ
  choice: Dort
  rationale: Das Ortsadverb verweist knapp auf den Zusammenhang unter den Völkern beziehungsweise in der Fremde aus dem vorausgehenden Vers, ohne diesen näher auszudeuten.
- source_word: ὑποδείξατε
  choice: verkündet
  rationale: Der Aoristimperativ Plural fordert dazu auf, Gottes Größe öffentlich sichtbar beziehungsweise bekannt zu machen. „Verkündet“ gibt dies im Lobkontext natürlich wieder; „zeigt“ bleibt als wörtlichere Möglichkeit in der Fußnote erhalten.
- source_word: τὴν μεγαλοσύνην αὐτοῦ
  choice: seine Größe
  rationale: μεγαλοσύνη bezeichnet Größe oder Majestät. „Größe“ ist klar, würdig und lexikalisch breit.
- source_word: ὑψοῦτε αὐτόν
  choice: erhebt ihn
  rationale: Die wörtliche Metapher des Erhöhens bleibt erhalten und ist im Deutschen als Ausdruck ehrender Preisung verständlich.
- source_word: ἐνώπιον παντὸς ζῶντος
  choice: vor allem, was lebt
  rationale: Die substantivierte Singularform ζῶντος wird nicht vorschnell auf Menschen eingeschränkt. Die Formulierung bewahrt die umfassende Weite des Griechischen und klingt im Deutschen natürlich.
- source_word: καθότι
  choice: denn
  rationale: Leitet die Begründung für die vorausgehenden Aufforderungen ein.
- source_word: κύριος ἡμῶν
  choice: unser Herr
  rationale: Entspricht dem üblichen theologischen und kontextgerechten Gebrauch von κύριος.
- source_word: θεὸς αὐτὸς πατὴρ ἡμῶν
  choice: er ist unser Gott und unser Vater
  rationale: Die wiederholte Hervorhebung durch αὐτός und die beiden auf Gott bezogenen Benennungen werden klar und ohne dogmatische Erweiterung wiedergegeben.
- source_word: εἰς πάντας τοὺς αἰῶνας
  choice: in alle Ewigkeit
  rationale: Eine geläufige, würdevolle deutsche Wiedergabe der idiomatischen Wendung; ihr wörtliches Bild von allen Zeitaltern wird in der Fußnote genannt.
theological_decisions:
- issue: Verhältnis der Bezeichnungen „unser Herr“, „unser Gott“ und „unser Vater“
  choice: 'Alle drei Bezeichnungen werden auf denselben Referenten bezogen: „er ist unser Herr, und er ist unser Gott und unser Vater“.'
  alternative: „er ist unser Herr und Gott, unser Vater“
  rationale: Die Wiederholung von αὐτός wird durch das zweite „er ist“ hörbar gemacht. Zugleich verhindert die verbindende Wiedergabe mit „und“ eine unnötige appositionelle Mehrdeutigkeit, ohne die Titel zu einem einzigen Ausdruck zu verschmelzen.
- issue: Reichweite von παντὸς ζῶντος
  choice: „vor allem, was lebt“
  alternative: „vor jedem lebenden Menschen“
  rationale: Der Kontext legt menschliche Zuhörer nahe, doch der griechische Wortlaut ist weiter. Die Übersetzung bewahrt diese genuine Offenheit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Imperative stehen im Plural. „Verkündet“ trägt den öffentlichen Lobcharakter, während „erhebt“ die griechische Metapher wahrt. Die Satzstruktur lässt die nachdrückliche Wiederholung von αὐτός erkennen, ohne im Deutschen schwerfällig zu wirken.
