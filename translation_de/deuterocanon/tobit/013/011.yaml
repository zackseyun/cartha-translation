  rationale: Es ist nur die Gottesbezeichnung korrigiert. Die Änderung beseitigt eine unnatürliche und missverständliche deutsche Apposition, erhält aber die griechische Wortfolge und die offene, nicht weiter ausgelegte Formel „zum Namen“ bei. Alle übrigen Entscheidungen können unverändert bleiben.
