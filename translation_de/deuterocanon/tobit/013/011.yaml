base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/013/011.yaml
  text: Many nations will come from far away to the name of the Lord God[a], carrying gifts in their hands, gifts for the King of heaven; generations of generations will give you exultation.
translation:
  language: de
  text: Viele Völker werden aus der Ferne zum Namen des Herrn Gottes kommen. Sie tragen Gaben in ihren Händen, Gaben für den König des Himmels. Generationen von Generationen werden dir Jubel schenken.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Generation um Generation wird dir Freude bringen.« Wörtlich lautet das Griechische: »Generationen von Generationen werden dir Jubel geben.«'
    reason: Die Fußnote nennt eine idiomatischere Wiedergabe und dokumentiert zugleich die ungewöhnliche griechische Konstruktion.
lexical_decisions:
- source_word: ἔθνη πολλὰ
  choice: Viele Völker
  rationale: ἔθνη kann »Völker« oder »Nationen« bezeichnen. »Völker« klingt im Deutschen natürlich und bewahrt die weltweite Perspektive, ohne einen ausdrücklichen Gegensatz zwischen Juden und Nichtjuden einzutragen.
- source_word: μακρόθεν
  choice: aus der Ferne
  rationale: Die Wendung gibt den entfernten Herkunftsort wieder und entspricht dem erhöhten poetischen Ton.
- source_word: ἥξει
  choice: werden … kommen
  rationale: Der Singular des griechischen Verbs bei einem sächlichen Plural wird im Deutschen sinngemäß als Plural wiedergegeben. »Kommen« passt zum Bild einer Wallfahrt.
- source_word: πρὸς τὸ ὄνομα Κυρίου τοῦ θεοῦ
  choice: zum Namen des Herrn, des Gottes
  rationale: Die ungewöhnliche Richtungsangabe »zum Namen« bleibt erhalten, damit die Aussage nicht vorschnell auf »anbeten« oder »wegen des Ruhmes« festgelegt wird. Die Apposition »des Gottes« bildet die griechische Titelfolge ab.
- source_word: δῶρα ἐν χερσὶν ἔχοντες
  choice: Sie tragen Gaben in ihren Händen
  rationale: Die selbstständige deutsche Satzform gibt das begleitende Partizip natürlich wieder und bewahrt das konkrete Bild der in den Händen getragenen Gaben.
- source_word: καὶ δῶρα τῷ βασιλεῖ τοῦ οὐρανοῦ
  choice: Gaben für den König des Himmels
  rationale: Die Wiederholung von δῶρα wird als poetische Hervorhebung beibehalten; »für« bezeichnet den Empfänger im Deutschen idiomatisch.
- source_word: γενεαὶ γενεῶν
  choice: Generationen von Generationen
  rationale: Die genitivische Wiederholung wird trotz ihrer Ungewöhnlichkeit bewahrt, da sie die semitisch geprägte, feierliche Ausdrucksweise des griechischen Textes trägt.
- source_word: δώσουσίν σοι ἀγαλλίαμα
  choice: werden dir Jubel schenken
  rationale: ἀγαλλίαμα bezeichnet jubelnde Freude. »Jubel schenken« wahrt die Konstruktion mit »geben«, ist im Deutschen jedoch verständlicher als »Jubel geben«.
theological_decisions:
- issue: Bezug des Pronomens σοι
  choice: Die Anrede bleibt mit »dir« offen; im Kontext gilt sie dem personifizierten Jerusalem/Zion.
  alternative: Den Namen »Jerusalem« ausdrücklich in den Vers einsetzen oder die Anrede allgemein auf Israel beziehen.
  rationale: Der Zusammenhang macht Jerusalem zur Angeredeten, doch der Vers selbst nennt die Stadt nicht. Das Pronomen bewahrt die poetische Anrede, ohne eine Erklärung in den Text einzutragen.
- issue: Bedeutung von »zum Namen des Herrn, des Gottes«
  choice: Das biblische Bild einer ehrfürchtigen Hinwendung zum göttlichen Namen bleibt wörtlich erkennbar.
  alternative: Dynamisch mit »um den Herrn, Gott, anzubeten« oder »wegen des Ruhmes des Herrn, Gottes« übersetzen.
  rationale: Die griechische Wendung kann Verehrung und Wallfahrt einschließen, legt sich aber nicht ausdrücklich auf nur eine dieser Erklärungen fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst bewahrten biblisch-poetischen Wendungen. Kurze Hauptsätze erleichtern das Verständnis; die Wiederholung von »Gaben« und die ungewöhnliche Formel »Generationen von Generationen« erhalten den Klang und die Struktur der Vorlage.
