base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/024.yaml
  text: 'The priests: the sons of Jeddus[a], the son of Jeshua, of the sons of Sanabeis, eight hundred seventy-two; the sons of Emerus[c][b], two hundred fifty-two.'
translation:
  language: de
  text: 'Die Priester: die Söhne Jeddus, des Sohnes Jeschuas, unter den Söhnen Sanabeis[a]: achthundertzweiundsiebzig; die Söhne des Emerus[b][c]: zweihundertzweiundfünfzig.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich steht im Griechischen eine ungewöhnliche Wendung mit „in/zu den Söhnen Sanabeis“. Gemeint ist wahrscheinlich die Zugehörigkeit zu dieser Familiengruppe.
    reason: lexical_alternative
  - marker: b
    text: Der griechische Name „Emerus“ könnte der Priesterfamilie entsprechen, die in der hebräischen Überlieferung andernorts „Emmer“ heißt. Der Haupttext folgt unmittelbar dem griechischen Zeugen.
    reason: alternative_reading
  - marker: c
    text: Der für diese Stelle angegebene masoretische Paralleltext stimmt mit dieser griechischen Zeile nicht eng überein. Solche Umstellungen und Neubildungen kommen in 1 Esdras vor; daher folgt die Übersetzung hier vorrangig dem griechischen Text.
    reason: textual_variant
lexical_decisions:
- source_word: οἱ ἱερεῖς
  choice: Die Priester
  rationale: Die direkte Wiedergabe bewahrt die Gliederung der Zählliste und bezeichnet die nun folgende priesterliche Gruppe.
- source_word: οἱ υἱοὶ Ἰέδδου
  choice: die Söhne Jeddus
  rationale: „Söhne“ bewahrt die genealogische Ausdrucksweise des Griechischen; im Zusammenhang kann das Wort auch Nachkommen beziehungsweise Angehörige eines Geschlechts bezeichnen.
- source_word: τοῦ υἱοῦ Ἰησοῦ
  choice: des Sohnes Jeschuas
  rationale: Ἰησοῦ gibt hier im nachexilischen genealogischen Zusammenhang den Namen Jeschua/Josua wieder. „Jeschua“ entspricht dem historischen Kontext und verhindert eine unbeabsichtigte Gleichsetzung mit Jesus von Nazaret.
- source_word: εἰς τοὺς υἱοὺς Σαναβείς
  choice: unter den Söhnen Sanabeis
  rationale: Die Konstruktion mit εἰς ist in dieser Liste ungewöhnlich. „Unter“ gibt eine wahrscheinliche Gruppenzugehörigkeit wieder, ohne die syntaktische Schwierigkeit oder das genaue Verwandtschaftsverhältnis stärker festzulegen als der griechische Text.
- source_word: ὀκτακόσιοι ἑβδομήκοντα δύο
  choice: achthundertzweiundsiebzig
  rationale: Die Zahl wird vollständig und idiomatisch ausgeschrieben.
- source_word: υἱοὶ Ἐρμήρου
  choice: die Söhne des Emerus
  rationale: Der Name folgt unmittelbar der maßgeblichen griechischen Form Ἐρμήρου. Eine mögliche Gleichsetzung mit Emmer wird nicht in den Haupttext eingetragen.
- source_word: διακόσιοι πεντήκοντα δύο
  choice: zweihundertzweiundfünfzig
  rationale: Die Zahl wird vollständig und idiomatisch ausgeschrieben.
