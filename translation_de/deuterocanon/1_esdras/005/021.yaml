  text: those from Makalon[a], one hundred twenty-two; those from Betolio, fifty-two; Neipheis, one hundred fifty-six.
translation:
  language: de
  text: 'Die aus Makalon[a]: 122; die aus Betolio: 52; Neipheis: 156.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hebräische Paralleltext in Nehemia 7,25 lautet: „die Söhne von Rama und Geba: 621“. 1 Esdras bietet hier deutlich andere Namen und Zahlen.'
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ ἐκ
  choice: die aus
  rationale: Die griechische Wendung bezeichnet Menschen nach ihrer Herkunft. „Die aus“ gibt dies knapp und natürlich wieder, ohne das „Söhne“ des abweichenden hebräischen Paralleltexts einzutragen.
- source_word: Μακαλών
  choice: Makalon
  rationale: Der unsicher zu identifizierende Eigenname wird unmittelbar aus der griechischen Form transliteriert und nicht mit dem abweichenden hebräischen Paralleltext harmonisiert.
- source_word: Βετολιώ
  choice: Betolio
  rationale: Der Ortsname wird aus dem Griechischen transliteriert; angesichts der schwankenden Überlieferung wäre eine spekulative Gleichsetzung unangemessen.
- source_word: Νειφείς
  choice: Neipheis
  rationale: Der Name wird nach der griechischen Form wiedergegeben, da eine sichere Zuordnung zum hebräischen Paralleltext nicht möglich ist.
- source_word: ἑκατὸν εἴκοσι δύο
  choice: '122'
  rationale: Die Zahl wird in einer Aufzählung übersichtlich mit Ziffern wiedergegeben.
- source_word: πεντήκοντα δύο
  choice: '52'
  rationale: Die Zahl wird in einer Aufzählung übersichtlich mit Ziffern wiedergegeben.
- source_word: ἑκατὸν πεντήκοντα ἕξ
  choice: '156'
  rationale: Die Zahl wird in einer Aufzählung übersichtlich mit Ziffern wiedergegeben.
theological_decisions:
- issue: Umgang mit dem stark abweichenden masoretischen Paralleltext
  choice: Die griechische Liste wird im Haupttext übersetzt; die Abweichung des hebräischen Paralleltexts wird in einer Fußnote offengelegt.
  alternative: 'Den Haupttext an Nehemia 7,25 angleichen: „die Söhne von Rama und Geba: 621“.'
  rationale: Für 1 Esdras ist der griechische Text die primäre Quelle. Die Unterschiede bei Namen und Zahlen sind zu erheblich, um sie stillschweigend zu harmonisieren; beide Überlieferungen bleiben durch die Fußnote transparent.
translation_notes:
  register: Knappes, würdiges Listenregister in modernem Standarddeutsch. Doppelpunkte und Ziffern sorgen für gute Lesbarkeit; die Eigennamen folgen dem griechischen Ausgangstext.
