base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/007.yaml
  text: These are the ones from Judea who came up from the captivity of the exile[a], whom Nebuchadnezzar king of Babylon had carried away to Babylon[b],
translation:
  language: de
  text: Dies sind diejenigen aus Judäa, die aus der Gefangenschaft des Exils[a] heraufzogen und die Nebukadnezar, der König von Babylon, nach Babylon verschleppt hatte[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der hebräische Paralleltext in Esra 2,1 hat hier „die Söhne der Provinz“ statt „diejenigen aus Judäa“. Diese Übersetzung folgt dem griechischen Text von 1 Esdras als Primärquelle.
    reason: alternative_reading
  - marker: b
    text: 'Oder: „die Nebukadnezar, der König von Babylon, nach Babylon deportiert hatte“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσὶν δὲ οὗτοι
  choice: Dies sind
  rationale: δὲ ist hier nur leicht verbindend; im Deutschen ist kein ausdrücklicher Konnektor nötig.
- source_word: οἱ ἐκ τῆς Ἰουδαίας
  choice: diejenigen aus Judäa
  rationale: Der griechische Primärtext nennt ausdrücklich Ἰουδαία. „Judäa“ bewahrt diese Ortsbezeichnung, während der hebräische Paralleltext anders lautet.
- source_word: οἱ ἀναβάντες
  choice: die ... heraufzogen
  rationale: Die traditionelle Richtungsangabe des Hinaufziehens ins Land wird bewahrt; „heraufzogen“ passt zur rückblickenden Erzählperspektive.
- source_word: ἐκ τῆς αἰχμαλωσίας τῆς παροικίας
  choice: aus der Gefangenschaft der Verbannung
  rationale: αἰχμαλωσία bezeichnet Gefangenschaft; παροικία meint hier das Leben in der Fremde beziehungsweise die Verbannung. Die markante Genitivverbindung des Griechischen bleibt erhalten.
- source_word: οὓς μετῴκισεν
  choice: die ... verschleppt hatte
  rationale: μετοικίζω bezeichnet die erzwungene Umsiedlung. „Verschleppen“ ist natürlich, historisch passend und weniger verwaltungssprachlich als „deportieren“.
- source_word: Ναβουχοδονοσὸρ
  choice: Nebukadnezar
  rationale: Verwendet wird die im modernen Deutschen übliche Namensform.
- source_word: βασιλεὺς Βαβυλῶνος
  choice: der König von Babylon
  rationale: Obwohl im Griechischen ohne Artikel, ist die Bezeichnung sinngemäß bestimmt; die Apposition wird im Deutschen mit Artikel wiedergegeben.
- source_word: εἰς Βαβυλῶνα
  choice: nach Babylon
  rationale: Die Präposition bezeichnet das Ziel der Verschleppung; bei Städtenamen ist „nach“ die natürliche deutsche Wiedergabe.
