base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/051.yaml
  text: And after these[a], the regular offerings[b], and the sacrifices for Sabbaths and new moons and all the consecrated feasts.
translation:
  language: de
  text: Und danach die regelmäßigen Opfergaben[a] sowie die Opfer für die Sabbate, die Neumonde und alle geheiligten Feste.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die fortwährenden Opfergaben“. Das griechische Wort kann eine ununterbrochene oder eine in festen Abständen wiederkehrende Darbringung bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Die hebräische Parallele im Buch Esra hebt das Brandopfer hervor, das „Tag für Tag in der vorgeschriebenen Zahl“ dargebracht wurde. 1 Esdras fasst hier den regelmäßigen heiligen Festkalender umfassender zusammen.
    reason: cross_reference
lexical_decisions:
- source_word: μετὰ ταῦτα
  choice: danach
  rationale: Die knappe Zeitangabe gibt den Übergang zu den anschließend genannten Opferhandlungen natürlich wieder; der Rückbezug des griechischen Plurals ist im Deutschen in „danach“ enthalten.
- source_word: προσφορὰς ἐνδελεχισμοῦ
  choice: die regelmäßigen Opfergaben
  rationale: προσφορά bezeichnet hier kultische Gaben; ἐνδελεχισμός kann fortdauernde oder in festen Abständen wiederkehrende Darbringungen meinen. „Regelmäßig“ ist verständlich und legt sich nicht unnötig auf ununterbrochene Dauer fest.
- source_word: θυσίας
  choice: die Opfer
  rationale: „Opfer“ wahrt den kultischen Sinn und unterscheidet den Ausdruck von den zuvor genannten „Opfergaben“, ohne im Deutschen schwerfällig zu wirken.
- source_word: σαββάτων
  choice: für die Sabbate
  rationale: Der Plural bezeichnet die wiederkehrenden Sabbattage des heiligen Kalenders.
- source_word: νουμηνιῶν
  choice: die Neumonde
  rationale: Gemeint sind die monatlichen Neumondtage beziehungsweise ihre kultischen Feiern; die knappe traditionelle Bezeichnung passt zur Aufzählung.
- source_word: ἑορτῶν πασῶν ἡγιασμένων
  choice: alle geheiligten Feste
  rationale: Das Partizip ἡγιασμένων kennzeichnet die Feste als für den heiligen Gebrauch ausgesondert. „Geheiligt“ bewahrt diese kultische Nuance.
theological_decisions:
- issue: Verhältnis der griechischen Kultkalender-Zusammenfassung zur hebräischen Parallelüberlieferung
  choice: Die breitere griechische Aufzählung der regelmäßigen Opfergaben sowie der Opfer für Sabbate, Neumonde und geheiligte Feste wird unmittelbar übersetzt.
  alternative: Den Wortlaut an die hebräische Parallele mit ihrem Schwerpunkt auf dem täglichen Brandopfer und der vorgeschriebenen Tageszahl angleichen.
  rationale: Der griechische Text ist für 1 Esdras die maßgebliche Vorlage. Die hebräische Parallele kann die regelmäßige Wiederkehr erläutern, darf aber die abweichende, breitere Formulierung des griechischen Zeugen nicht ersetzen.
- issue: Elliptische Syntax des Verses
  choice: Die nominale Fortsetzung ohne ergänztes Verb bleibt erhalten.
  alternative: Ein Verb wie „brachten sie dar“ oder „folgten“ ergänzen.
  rationale: Der griechische Wortlaut ist syntaktisch knapp und setzt den vorherigen Zusammenhang fort. Ein ausdrücklich eingesetztes Verb würde Subjekt und Handlungsform stärker festlegen, als es der vorgelegte Vers selbst tut.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit vertrauter biblischer Kultterminologie. Die knappe, an den vorherigen Satz anschließende Struktur des Griechischen wird bewahrt; „regelmäßig“ vermeidet eine unnötige Festlegung zwischen fortdauernder und wiederkehrender Darbringung.
