  source_fidelity: 'Der Entwurf gibt die griechische Aufzählung zuverlässig wieder: μετὰ ταῦτα als knappe zeitliche Fortsetzung, προσφορὰς ἐνδελεχισμοῦ als regelmäßig wiederkehrende Opfergaben und θυσίας als davon unterschiedene Opfer. Auch die Reihenfolge Sabbate, Neumonde und alle geheiligten Feste bleibt erhalten. Die nominale Satzfortsetzung bewahrt die Ellipse des Griechischen, ohne ein im Einzelvers nicht ausgedrücktes Verb zu ergänzen.'
  naturalness: „Und danach die regelmäßigen Opfergaben sowie die Opfer für die Sabbate, die Neumonde und alle geheiligten Feste“ ist verständliches modernes Standarddeutsch und zugleich dem würdevollen kultischen Register angemessen. Die Parallelität von „Opfergaben“ und „Opfer“ ist hier sinnvoll, da sie die griechische lexikalische Unterscheidung abbildet.
  terminology: „Regelmäßige Opfergaben“ lässt die sachlich mögliche Nuance von fortwährend bzw. wiederkehrend offen. „Neumonde“ und „Sabbate“ sind etablierte biblische Kalenderbegriffe. „Geheiligte Feste“ gibt ἡγιασμένων präzise wieder, ohne die Formulierung an die nur annähernd parallele hebräische Überlieferung anzugleichen. Die Fußnoten sind sachlich zutreffend; Anker a steht passend beim erläuterten Ausdruck, und Anker b bezieht sich sinnvoll auf die gesamte Zusammenfassung der Kulttermine.
