lexical_decisions:
- source_word: υἱοὶ
  choice: die Söhne des
  rationale: In dieser listenartigen Zählung ist υἱοὶ eine genealogische Gruppierungsformel. „Die Söhne des“ bewahrt die formale Struktur und legt die Bezeichnung nicht unnötig als umfassenderes „Nachkommen“ aus.
- source_word: Ἀρές
  choice: Ares
  rationale: Der Eigenname wird entsprechend dem maßgeblichen griechischen Text transliteriert. Die erheblich abweichende ungefähre MT-Parallele rechtfertigt keine Angleichung an einen anderen Familiennamen.
- source_word: ἑπτακόσιοι πεντήκοντα ἕξ
  choice: siebenhundertsechsundfünfzig
  rationale: Die ausgeschriebene Zahl gibt den griechischen Gesamtwert 756 genau und in standardgemäßem modernem Deutsch wieder.
theological_decisions:
- issue: Vorrang des griechischen Textes gegenüber der abweichenden MT-Parallele in der Zählliste
  choice: Der griechischen Lesart „Ares … siebenhundertsechsundfünfzig“ folgen.
  alternative: Eine Angleichung an die ungefähre MT-Parallele ergäbe eine andere Familienbezeichnung und eine andere Gesamtzahl.
  rationale: Für 1 Esdras ist hier der griechische Text die primäre Übersetzungsgrundlage. Die ungefähre MT-Parallele weicht sowohl beim Namen als auch bei der Zahl wesentlich ab; diese Differenz wird dokumentiert, nicht harmonisiert.
translation_notes:
  register: Knappes, würdiges Listendeutsch. Die traditionelle genealogische Formel „die Söhne des“ bleibt erhalten; Eigenname und Zahl folgen unmittelbar dem griechischen Hauptzeugen.
