    reason: referent_ambiguity
lexical_decisions:
- source_word: τυμπάνων
  choice: Handtrommeln
  rationale: τύμπανον bezeichnet eine mit der Hand gespielte Rahmentrommel beziehungsweise ein tamburinähnliches Schlaginstrument. „Handtrommeln“ ist im heutigen Deutsch verständlich und vermeidet das möglicherweise irreführende Bild eines modernen Tamburins mit Schellen.
- source_word: αὐλῶν
  choice: Flöten
  rationale: αὐλός bezeichnet ein Blasinstrument, häufig ein Rohrblattinstrument. „Flöten“ ist eine geläufige Wiedergabe; die breitere Möglichkeit „Pfeifen“ wird in der Fußnote bewahrt.
- source_word: ἀδελφοὶ
  choice: Brüder
  rationale: Der griechische Ausdruck steht ausdrücklich im maskulinen Plural. „Brüder“ erhält diese Form, ohne den möglichen weiteren Sinn von Verwandten eigenmächtig festzulegen.
- source_word: παίζοντες
  choice: spielten
  rationale: παίζω kann festliches Spielen, Musizieren oder Tanzen bezeichnen. Wegen der unmittelbar genannten Instrumente liegt „spielten“ nahe, ohne die Art der Darbietung weiter festzulegen.
- source_word: ἐποίησεν ... συναναβῆναι
  choice: er ließ sie ... hinaufziehen
  rationale: ποιέω mit dem Infinitiv hat hier kausative Kraft; „ließ ... hinaufziehen“ ist natürliches, würdevolles Deutsch. συναναβαίνω bezeichnet das gemeinsame Hinaufziehen.
- source_word: μετʼ ἐκείνων
  choice: mit jenen
  rationale: „jenen“ bewahrt die distale demonstrative Kraft von ἐκείνων und vermeidet es, ein im griechischen Fragment nicht ausdrücklich genanntes Substantiv wie „Männern“ einzufügen.
