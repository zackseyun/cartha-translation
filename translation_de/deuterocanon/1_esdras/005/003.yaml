  text: mit Handtrommeln und Flöten[a]. Und alle ihre Brüder spielten, und er ließ sie mit jenen[b] hinaufziehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Pfeifen“. Das griechische Wort αὐλῶν kann allgemein Rohrblatt- oder ähnliche Blasinstrumente bezeichnen.'
