base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/040.yaml
  text: And Nehemiah and Atharias told them not to partake of the holy things until a priest should arise clothed with the Manifestation and the Truth[a][b].
translation:
  language: de
  text: Und Nehemia und Atharias wiesen sie an, nicht von den heiligen Gaben zu essen, bis ein Priester auftritt, der mit Offenbarung und Wahrheit bekleidet ist.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit »Offenbarung und Wahrheit« sind traditionell die priesterlichen Lose Urim und Tummim gemeint.
    reason: alternative_reading
  - marker: b
    text: Bis zu einer verbindlichen priesterlichen Entscheidung durften sie nicht von den heiligen, den Priestern zustehenden Gaben essen.
    reason: cultural_note
lexical_decisions:
- source_word: εἶπεν αὐτοῖς
  choice: wiesen sie an
  rationale: Die Infinitivkonstruktion μὴ μετέχειν gibt der Aussage Weisungscharakter; „wiesen sie an“ ist im Deutschen natürlich und macht diese Funktion deutlich.
- source_word: Ναιμίας
  choice: Nehemia
  rationale: Verwendet die im Deutschen etablierte biblische Namensform für Ναιμίας.
- source_word: Ἀθαρίας
  choice: Atharias
  rationale: Gibt die griechische Namensform direkt wieder, ohne sie gegen den Primärzeugen zu „Asarja“ zu semitisieren.
- source_word: μὴ μετέχειν τῶν ἁγίων
  choice: nicht von den heiligen Gaben zu essen
  rationale: μετέχειν bezeichnet Teilhabe; im kultischen Zusammenhang sind mit τὰ ἅγια die den Priestern vorbehaltenen heiligen Anteile gemeint. Die Wiedergabe ist verständlich, ohne die Gaben genauer zu bestimmen, als es der Text erlaubt.
- source_word: ἕως ἀναστῇ ἱερεύς
  choice: bis ein Priester aufträte
  rationale: „Aufträte“ gibt das künftige, noch ausstehende Erscheinen eines Priesters idiomatisch wieder; der Konjunktiv fügt sich in die abhängige Rede nach „wiesen … an“.
- source_word: ἐνδεδυμένος
  choice: bekleidet wäre
  rationale: Bewahrt das konkrete Bild des griechischen Partizips und den gehobenen kultischen Ton.
- source_word: τὴν δήλωσιν καὶ τὴν ἀλήθειαν
  choice: die Offenbarung und die Wahrheit
  rationale: Folgt den semantischen griechischen Bezeichnungen, statt im Haupttext unmittelbar die hebräischen Fachwörter Urim und Tummim einzusetzen. „Offenbarung“ gibt δήλωσις als Kundgabe bzw. Klarlegung natürlich wieder.
theological_decisions:
- issue: Ob δήλωσις und ἀλήθεια im Haupttext semantisch griechisch oder als die traditionellen hebräischen Begriffe Urim und Tummim wiederzugeben sind
  choice: „die Offenbarung und die Wahrheit“ im Haupttext; Identifikation mit Urim und Tummim in der Fußnote
  alternative: „Urim und Tummim“ unmittelbar im Haupttext
  rationale: Der griechische Primärtext verwendet Bedeutungswörter und keine Transliteration. Die gewählte Fassung wahrt diese Eigenart und zugleich durch die Fußnote den wahrscheinlich gemeinten priesterlichen Fachbezug.
- issue: Umfang von τῶν ἁγίων
  choice: „von den heiligen Gaben zu essen“
  alternative: „an den heiligen Dingen teilzuhaben“
  rationale: Der Zusammenhang weist auf heilige priesterliche Speiseanteile. Die Formulierung macht den praktischen Sinn verständlich, während „Gaben“ die genaue Art der Anteile offenlässt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt nah am Griechischen, wird aber durch „wiesen sie an“ und „von den heiligen Gaben zu essen“ für heutige Leser verständlich. Die Bezeichnung des priesterlichen Paars bleibt im Haupttext bewusst semantisch und damit quellennah.
