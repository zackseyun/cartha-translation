  source_fidelity: Die Übersetzung gibt die Personen, das Verbot der Teilhabe an den heiligen Dingen und die bis zu einem künftigen priesterlichen Handeln bestehende Einschränkung insgesamt zutreffend wieder. „Heilige Gaben“ ist im Kontext gut vertretbar, obwohl τῶν ἁγίων weiter gefasst bleibt. Die Wiedergabe von δήλωσις καὶ ἀλήθεια als „Offenbarung und Wahrheit“ folgt zu Recht dem griechischen Primärtext; die Fußnote benennt die traditionelle Identifizierung lediglich ergänzend.
  naturalness: Der Satz ist verständlich und würdevoll. Der Konjunktiv „bekleidet wäre“ lässt die Bekleidung jedoch unnötig hypothetisch erscheinen. Das griechische Partizip beschreibt die Kennzeichnung des erwarteten Priesters; im Deutschen ist hierfür „bekleidet ist“ klarer und natürlicher.
  terminology: „Nehemia“ und „Atharias“ sind angemessen. „Offenbarung und Wahrheit“ wahrt die semantische Eigenart des Griechischen, ohne die traditionellen Fachbegriffe in den Haupttext zu harmonisieren. Die Fußnotenanker stehen sachgerecht nach dem Satz.
