base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/004.yaml
  text: And these are the names of the men who were going up according to their ancestral houses[a], into their tribes[b], each to his own administrative division.
translation:
  language: de
  text: Und dies sind die Namen der Männer, die hinaufzogen, nach ihren Familienverbänden[a], in ihre Stämme, jeweils in ihren eigenen Verwaltungsbezirk[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „nach ihren Vaterhäusern“. Das griechische Wort bezeichnet Verwandtschaftsgruppen, die auf eine gemeinsame väterliche Abstammung zurückgeführt werden.'
    reason: lexical_alternative
  - marker: b
    text: Das seltene griechische Wort kann einen Bezirk, einen territorialen Anteil oder eine andere formale Verwaltungsgliederung bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: Und
  rationale: Der einfache Anschluss an den vorausgehenden Zusammenhang bleibt ohne zusätzliche Hervorhebung erhalten.
- source_word: ταῦτα τὰ ὀνόματα
  choice: dies sind die Namen
  rationale: Die demonstrative Wendung weist unmittelbar auf das folgende Namensverzeichnis voraus.
- source_word: τῶν ἀνδρῶν
  choice: der Männer
  rationale: ἀνήρ bezeichnet hier ausdrücklich Männer, wahrscheinlich männliche Familienoberhäupter oder Vertreter im Verzeichnis.
- source_word: τῶν ἀναβαινόντων
  choice: die hinaufzogen
  rationale: Das Partizip bezeichnet im Zusammenhang der Rückkehr diejenigen, die hinauf in das Land beziehungsweise nach Jerusalem zogen; das deutsche Präteritum ist in erzählender Prosa natürlich.
- source_word: κατὰ πατριὰς αὐτῶν
  choice: nach ihren Sippen
  rationale: πατριά bezeichnet eine durch gemeinsame Abstammung bestimmte Verwandtschaftsgruppe; „Sippen“ ist verständlich und bewahrt den genealogischen Bezug.
- source_word: εἰς τὰς φυλὰς
  choice: zu ihren Stämmen
  rationale: „Zu“ wahrt die von εἰς ausgedrückte Richtung, während φυλαί die größeren Stammesverbände bezeichnet.
- source_word: ἐπὶ τὴν μεριδαρχίαν αὐτῶν
  choice: jeweils in ihre eigene Verwaltungseinheit
  rationale: Das seltene μεριδαρχία bezeichnet offenbar eine formale territoriale oder administrative Gliederung. „Jeweils“ gibt den im Pluralpronomen liegenden distributiven Bezug idiomatisch wieder, ohne die genaue Art der Einheit festzulegen.
