base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/064.yaml
  text: And they recognized that those from the captivity were building the temple for the Lord God of Israel[a][b].
translation:
  language: de
  text: Und sie erkannten, dass die aus der Gefangenschaft Zurückgekehrten den Tempel für den Herrn, den Gott Israels, bauten.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die aus der Gefangenschaft“; auch: „die Exilierten“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „… dem Herrn, dem Gott Israels, den Tempel bauten“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέγνωσαν
  choice: sie erkannten
  rationale: Der Aorist bezeichnet hier das Erlangen einer klaren Erkenntnis. „Sie erkannten“ bleibt der griechischen Ausdrucksweise nahe und lässt offen, ob sie dies durch Beobachtung oder Mitteilung erfuhren.
- source_word: οἱ ἐκ τῆς αἰχμαλωσίας
  choice: die aus der Gefangenschaft
  rationale: Die substantivierte Wendung wird bewusst quellennah wiedergegeben und bezeichnet die aus der Verschleppung beziehungsweise dem Exil Zurückgekehrten. Das glattere „die Exilierten“ steht als Alternative in der Fußnote.
- source_word: οἰκοδομοῦσιν
  choice: bauten
  rationale: Das griechische Präsens beschreibt im abhängigen Aussagesatz einen damals fortdauernden Vorgang; im deutschen Vergangenheitsrahmen gibt „bauten“ dies natürlich wieder.
- source_word: τὸν ναόν
  choice: den Tempel
  rationale: ναός bezeichnet hier das wiedererrichtete Tempelgebäude; „Tempel“ ist die klare und kontextgemäße deutsche Entsprechung.
- source_word: τῷ κυρίῳ θεῷ Ἰσραήλ
  choice: für den Herrn, den Gott Israels
  rationale: Der Dativ kann Ziel, Widmung oder Begünstigten ausdrücken. „Für“ ist mit „bauen“ idiomatisch und bewahrt den Gedanken der Bestimmung für Israels Gott; „dem Herrn“ bleibt als mögliche formnähere Wiedergabe in der Fußnote sichtbar.
theological_decisions:
- issue: Wiedergabe von κύριος in der Gottesbezeichnung κύριος θεὸς Ἰσραήλ
  choice: der Herr, der Gott Israels
  alternative: der Gebieter, der Gott Israels
  rationale: „Der Herr“ entspricht dem üblichen biblischen Sprachgebrauch für κύριος und wahrt die Verbindung zur traditionellen Gottesbezeichnung, ohne eine zusätzliche konfessionelle Deutung einzutragen.
- issue: Funktion des Dativs τῷ κυρίῳ θεῷ Ἰσραήλ
  choice: für den Herrn, den Gott Israels
  alternative: dem Herrn, dem Gott Israels
  rationale: Der Dativ lässt sowohl eine widmende beziehungsweise benefaktive als auch eine direktere dativische Wiedergabe zu. Der Haupttext wählt das natürliche „für“, während die Fußnote die grammatische Alternative erhält.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wortstellung ist gut verständlich und zugleich nah am griechischen Satz. Die Apposition „den Gott Israels“ verdeutlicht die zusammengehörige Gottesbezeichnung. Beide Fußnotenmarker stehen im Haupttext.
