  to: Und alle, die mit Serubbabel und Jeschua, Nehemia, Zaraios, Resaios, Enenios, Mordechai, Beelsaros, Aspharasos, Boroleios, Roimos und Baana gekommen waren[a], kehrten nach Jerusalem und in das übrige Judäa zurück, jeder in seine eigene Stadt. Diese waren ihre Anführer.
