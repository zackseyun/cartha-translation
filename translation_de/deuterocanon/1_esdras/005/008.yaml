translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die lange griechische Satzperiode wurde zur besseren Verständlichkeit in zwei Sätze gegliedert; Wiederholung und Aussagegehalt bleiben erhalten. Die ungewöhnliche griechische Verbindung eines singularischen Verbs mit einer nachfolgenden Personengruppe wird im Deutschen idiomatisch im Plural wiedergegeben.
