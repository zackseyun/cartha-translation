base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/008.yaml
  text: And each returned to Jerusalem and the rest of Judea[a], each to his own city—the ones who had come with Zerubbabel and Jeshua, Nehemiah, Zareiah, Resaiah, Enenius, Mordecai, Beelsarus, Aspharasus, Boroelius, Roimus, and Baanah, their leaders.
translation:
  language: de
  text: Und alle, die mit Serubbabel und Jeschua, Nehemia, Zaraios, Resaios, Enenios, Mordechai, Beelsaros, Aspharasos, Boroleios, Roimos und Baana gekommen waren[a], kehrten nach Jerusalem und in das übrige Judäa zurück, jeder in seine eigene Stadt. Diese waren ihre Anführer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mehrere Namen in dieser Liste haben andere Formen als in den annähernden hebräischen Parallelen in Esra und Nehemia. Die Wiedergabe folgt dem griechischen Text von 1 Esdras und gleicht die Namen nicht durchgehend an die hebräischen Formen an.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπέστρεψεν
  choice: kehrten … zurück
  rationale: Das Verb bezeichnet die Rückkehr an einen früheren Ort. Der deutsche Plural entspricht sinngemäß der durch οἱ ἐλθόντες bezeichneten Personengruppe, obwohl im Griechischen formal ein Singular steht.
- source_word: τὴν λοιπὴν Ἰουδαίαν
  choice: in das übrige Judäa
  rationale: λοιπή bezeichnet den übrigen Teil des Landes im Gegensatz zu Jerusalem; „das übrige Judäa“ ist präzise und natürlich.
- source_word: ἕκαστος εἰς τὴν ἰδίαν πόλιν
  choice: jeder in seine eigene Stadt
  rationale: Die distributive Einzahl und der Bezug auf die jeweils eigene πόλις bleiben ausdrücklich erhalten.
- source_word: οἱ ἐλθόντες
  choice: alle, die … gekommen waren
  rationale: Der substantivierte Aoristpartizip bezeichnet die betreffende Gruppe; das Plusquamperfekt ordnet ihr Kommen verständlich vor der Rückkehr ein.
- source_word: μετὰ
  choice: mit
  rationale: Die Präposition drückt hier Begleitung aus.
- source_word: Ζοροβαβὲλ καὶ Ἰησοῦ
  choice: Serubbabel und Jeschua
  rationale: Diese im Deutschen geläufigen Namensformen bezeichnen die nachexilischen Führer eindeutig; „Jeschua“ vermeidet eine unnötige Verwechslung mit Jesus.
- source_word: τῶν προηγουμένων αὐτῶν
  choice: Diese waren ihre Anführer
  rationale: Das Partizip bezeichnet diejenigen, die der Gruppe vorangingen und sie führten. Ein eigener kurzer Satz vermeidet im Deutschen den missverständlichen Eindruck, sämtliche Genannten seien bloß Begleiter Serubbabels und Jeschuas.
- source_word: Ἰερουσαλήμ
  choice: Jerusalem
  rationale: Übliche deutsche Form des Ortsnamens.
- source_word: Νεεμίου, Ζαραίου, Ῥησαίου, Ἐνήνιος, Μαρδοχαίου, Βεελσάρου, Ἀσφαράσου, Βορολείου, Ῥοείμου, Βαανά
  choice: Nehemia, Zaraios, Resaios, Enenios, Mordochai, Beelsaros, Aspharasos, Boroleios, Roimos und Baana
  rationale: Bekannte Namen erhalten geläufige deutsche Formen; die übrigen werden eng nach der eigenständigen griechischen Namensfolge von 1 Esdras wiedergegeben und nicht an den nur annähernden masoretischen Paralleltext angeglichen.
