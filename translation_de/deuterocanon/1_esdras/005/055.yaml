base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/055.yaml
  text: And they laid the foundation of the temple of God on the new moon of the second month[a], in the second year after they had come into Judea and Jerusalem.
translation:
  language: de
  text: Und sie legten das Fundament des Tempels Gottes am Neumond des zweiten Monats, im zweiten Jahr, nachdem sie nach Judäa und Jerusalem gekommen waren.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐθεμελίωσαν
  choice: legten … das Fundament
  rationale: Das Verb bezeichnet das Legen eines Fundaments beziehungsweise die Gründung eines Bauwerks; im Zusammenhang mit dem Tempel ist diese konkrete deutsche Wendung natürlich und präzise.
- source_word: τὸν ναὸν τοῦ θεοῦ
  choice: des Tempels Gottes
  rationale: ναός bezeichnet hier unmittelbar das Tempelgebäude beziehungsweise Heiligtum. „Tempel Gottes“ gibt den griechischen Ausdruck genauer wieder als das im Esra-Kontext ebenfalls mögliche „Haus Gottes“.
- source_word: τῇ νουμηνίᾳ
  choice: am Neumondstag
  rationale: νουμηνία bezeichnet den Neumond beziehungsweise den dadurch markierten ersten Tag eines Monats. „Neumondstag“ bewahrt die kalendarische Ausdrucksweise und ist im Deutschen eindeutig.
- source_word: τοῦ δευτέρου μηνὸς
  choice: des zweiten Monats
  rationale: Der Genitiv bestimmt, zu welchem Monat der genannte Neumondstag gehört.
- source_word: τοῦ δευτέρου ἔτους
  choice: im zweiten Jahr
  rationale: Die deutsche Datierungsformel gibt den griechischen Genitiv idiomatisch wieder.
- source_word: ἐν τῷ ἐλθεῖν
  choice: nachdem sie … gekommen waren
  rationale: Die Verbindung aus ἐν und substantiviertem Infinitiv ist temporal. Der gewählte Nebensatz macht verständlich, dass die Ankunft der Grundsteinlegung vorausging, ohne weitere zeitliche Einzelheiten hinzuzufügen.
- source_word: εἰς τὴν Ἰουδαίαν καὶ Ἰερουσαλήμ
  choice: nach Judäa und Jerusalem
  rationale: εἰς bezeichnet die gerichtete Bewegung zum Land und zur Stadt; im Deutschen ist „nach“ bei diesen geografischen Namen die natürliche Entsprechung.
theological_decisions:
- issue: Wiedergabe von ναός beim Wiederaufbau des Tempels
  choice: Tempel Gottes
  alternative: Haus Gottes
  rationale: Der griechische Text verwendet ausdrücklich ναός, den üblichen Ausdruck für Tempel beziehungsweise Heiligtum. „Haus Gottes“ wäre aus der parallelen Esra-Überlieferung verständlich, ist hier aber weniger quellennah. Die Wahl entscheidet keine konfessionelle Frage.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung hält die Datierungsangaben zusammen und lässt zugleich die Kernaussage der Grundsteinlegung klar hervortreten. Der griechische Text wurde als primäre Grundlage behandelt; der angegebene masoretische Paralleltext entspricht diesem Vers inhaltlich nicht genau und bestimmt daher die Übersetzung nicht.
