base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/066.yaml
  text: For we also[a], like you, listen to your Lord, and we will sacrifice to him from the days of Asbakaphath king of the Assyrians[c][b], who brought us here.
translation:
  language: de
  text: Denn ebenso wie ihr hören auch wir auf euren Herrn, und ihm werden wir seit den Tagen Asbakaphats, des Königs der Assyrer, der uns hierhergebracht hat, Opfer darbringen[c][a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Asbakaphat ist hier die griechische Namensform. Der hebräische Paralleltext in Esra 4,2 nennt den König Esarhaddon.
    reason: alternative_reading
  - marker: b
    text: „Hierhergebracht“ kann in diesem Zusammenhang eine unter assyrischer Herrschaft erzwungene Verbringung oder Umsiedlung bezeichnen.
    reason: cultural_note
  - marker: c
    text: Im Griechischen steht das Futur „wir werden Opfer darbringen“ zusammen mit „seit den Tagen“. Manche Übersetzungen glätten die schwierige Zeitangabe zu einer seit damals fortdauernden Opferpraxis.
    reason: textual_difficulty
lexical_decisions:
- source_word: ὁμοίως … ὑμῖν
  choice: genau wie ihr … auch wir
  rationale: Die Vergleichsaussage wird im Deutschen ausdrücklich und natürlich wiedergegeben, ohne sie inhaltlich zu verstärken.
- source_word: ἀκούομεν τοῦ κυρίου ὑμῶν
  choice: hören … auf euren Herrn
  rationale: „Auf jemanden hören“ bewahrt sowohl den Grundsinn des Hörens als auch die mögliche Bedeutung des Beachtens, ohne eindeutig „gehorchen“ zu setzen. Der ausdrückliche Genitiv „eures Herrn“ bleibt als „euren Herrn“ erhalten.
- source_word: ἐπιθύσομεν
  choice: werden … Opfer darbringen
  rationale: Die griechische Form ist Futur; „Opfer darbringen“ bezeichnet den kultischen Vorgang klarer als das im Deutschen potenziell missverständliche „opfern“ allein.
- source_word: ἀπὸ ἡμερῶν
  choice: seit den Tagen
  rationale: Die Wendung bezeichnet gewöhnlich einen zeitlichen Ausgangspunkt. Die Spannung zwischen diesem Rückbezug und dem vorausgehenden Futur wird nicht stillschweigend beseitigt, sondern durch Gedankenstriche sichtbar gehalten und in einer Fußnote erläutert.
- source_word: Ἀσβακαφὰθ
  choice: Asbakafat
  rationale: Der Name wird aus der maßgeblichen griechischen Textform ins Deutsche transkribiert; die Identifizierung mit Esarhaddon im Paralleltext wird nur in der Fußnote genannt.
- source_word: βασιλέως Ἀσσυρίων
  choice: des Königs der Assyrer
  rationale: Dies folgt der ethnischen Formulierung des Griechischen, statt sie zu „König von Assyrien“ zu glätten.
- source_word: μετήγαγεν ἡμᾶς ἐνταῦθα
  choice: der uns hierhergebracht hat
  rationale: Die Formulierung bleibt allgemein genug für Verbringung oder Umsiedlung; der imperiale Zwangskontext wird in der Fußnote kenntlich gemacht.
theological_decisions:
- issue: Behaupten die Sprecher, denselben Herrn wie die judäischen Rückkehrer zu verehren?
  choice: 'Die Selbstaussage wird unmittelbar wiedergegeben: Auch sie hören auf „euren Herrn“ und wollen ihm Opfer darbringen.'
  alternative: ἀκούομεν als „gehorchen“ wiederzugeben oder κύριος zu „der Herr, euer Gott“ zu erweitern.
  rationale: Der griechische Text berichtet die Behauptung der Sprecher, bestätigt oder widerlegt aber an dieser Stelle weder ihre Aufrichtigkeit noch ihre theologische Gültigkeit. „Euer Herr“ bewahrt zudem den ausdrücklichen Wortlaut, ohne „Gott“ hinzuzufügen.
- issue: Zeitliche Spannung zwischen Futur und „seit den Tagen“
  choice: Das Futur „werden … darbringen“ und der rückblickende Ausdruck „seit den Tagen“ bleiben beide erkennbar erhalten.
  alternative: Den Satz zu „bringen ihm seit den Tagen … Opfer dar“ oder „haben ihm seit den Tagen … Opfer dargebracht“ zu harmonisieren.
  rationale: Die überlieferte griechische Form ἐπιθύσομεν ist Futur, während ἀπὸ ἡμερῶν gewöhnlich einen in der Vergangenheit liegenden Ausgangspunkt angibt. Eine Harmonisierung würde eine echte Schwierigkeit des Ausgangstextes verdecken.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Auf euren Herrn hören“ ist allgemein verständlich und hält die Bedeutungsbreite zwischen Hören und Beachten offen. Die Gedankenstriche markieren die im Griechischen auffällige Verbindung des Futurs mit einem vergangenen Ausgangspunkt, ohne den Text unnötig unlesbar zu machen.
