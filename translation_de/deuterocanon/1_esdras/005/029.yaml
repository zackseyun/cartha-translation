base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/029.yaml
  text: 'the sons of Tobeis[a], altogether one hundred thirty-nine; the temple servants: the sons of Esau, the sons of Taseipha, the sons of Tabaoth, the sons of Keras, the sons of Soua, the sons of Phalaiou, the sons of Labana[c][b],'
translation:
  language: de
  text: 'die Nachkommen von Tobeis, insgesamt 139; die Tempelsklaven[a]: die Nachkommen von Esau, die Nachkommen von Taseipha, die Nachkommen von Tabaoth, die Nachkommen von Keras, die Nachkommen von Sua, die Nachkommen von Phalaios, die Nachkommen von Labana,[b][c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort kann auch mit »Tempeldiener« wiedergegeben werden; »Tempelsklaven« hebt den unfreien Status hervor.
    reason: lexical_alternative
  - marker: b
    text: Der Vers ist im Ausgangstext ein Listenfragment und endet mit einem Komma; der folgende Vers setzt die Aufzählung der Tempelsklaven fort.
    reason: cross_reference
  - marker: c
    text: Der hebräische Paralleltext in Nehemia 7 bietet an dieser Stelle keinen wörtlich entsprechenden Text; 1 Esdras ordnet und erweitert Teile der Rückkehrerliste anders.
    reason: alternative_reading
lexical_decisions:
- source_word: υἱοὶ
  choice: die Nachkommen von
  rationale: In dieser Rückkehrerliste bezeichnet die wörtliche Wendung »Söhne von« Familien- oder Sippenzugehörigkeit. »Nachkommen von« gibt diese Funktion in natürlichem modernem Deutsch wieder, ohne ausschließlich unmittelbare Söhne anzunehmen.
- source_word: Τωβείς
  choice: Tobeis
  rationale: Der seltene Eigenname wird eng an der griechischen Form transliteriert.
- source_word: πάντες
  choice: insgesamt
  rationale: »Insgesamt« gibt die zusammenfassende Funktion des Wortes in einer Zählliste idiomatisch wieder.
- source_word: ἑκατὸν τριάκοντα ἐννέα
  choice: '139'
  rationale: Die Zahl wird exakt und in der für moderne deutsche Listen üblichen Ziffernschreibung wiedergegeben.
- source_word: οἱ ἱερόδουλοι
  choice: die Tempelsklaven
  rationale: Das Kompositum bezeichnet Menschen, die in einem unfreien Dienstverhältnis an ein Heiligtum gebunden waren. »Tempelsklaven« bewahrt diesen sozialen Status deutlicher als das mildere »Tempeldiener«.
- source_word: Ἠσαύ
  choice: Esau
  rationale: Verwendet wird die im Deutschen etablierte Form des biblischen Namens.
- source_word: Τασειφά
  choice: Taseipha
  rationale: Der seltene Eigenname wird quellennah transliteriert.
- source_word: Ταβαώθ
  choice: Tabaoth
  rationale: Der Eigenname wird unmittelbar aus dem Griechischen transliteriert.
- source_word: Κηράς
  choice: Keras
  rationale: Kappa wird transparent mit K wiedergegeben.
- source_word: Σουά
  choice: Sua
  rationale: Griechisches ου wird nach deutscher Transliteration als u wiedergegeben; eine semitische Rekonstruktion wird vermieden.
- source_word: Φαλαίου
  choice: Phalaios
  rationale: Die belegte Form ist ein von υἱοὶ abhängiger Genitiv; für die deutsche Namensform wird der zugrunde liegende griechische Nominativ Phalaios verwendet.
- source_word: Λαβανά
  choice: Labana
  rationale: Die Endung der griechischen Namensform bleibt erhalten; der Name wird nicht zum vertrauteren Laban angeglichen.
theological_decisions:
- issue: Sozialer Status der ἱερόδουλοι
  choice: Tempelsklaven
  alternative: Tempeldiener
  rationale: Die Übersetzung soll die im griechischen Ausdruck erkennbare Unfreiheit nicht durch eine allgemeinere Dienstbezeichnung verdecken. Die mögliche mildere Wiedergabe wird in einer Fußnote genannt.
- issue: Verhältnis zum abweichenden masoretischen Paralleltext
  choice: Die griechische Rückkehrerliste unverändert übersetzen
  alternative: Den Inhalt des hebräischen Parallelabschnitts über die Leviten übernehmen
  rationale: Der angegebene masoretische Text ist hier nur ein ungefährer Parallelzeuge und stimmt inhaltlich nicht mit dem griechischen Vers überein. Für 1 Esdras bleibt der griechische Text die Übersetzungsgrundlage.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wiederholte Formel »die Nachkommen von« erhält den listenartigen Rhythmus und ist zugleich verständlicher als eine streng wörtliche, im Deutschen teils missverständliche Wiedergabe mit »Söhne«. Das Semikolon und der abschließende Listenanschluss spiegeln den fortlaufenden griechischen Satzbau.
