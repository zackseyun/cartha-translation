base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/035.yaml
  text: 'All the temple servants and the sons of Solomon’s servants: three hundred seventy-two[a].'
translation:
  language: de
  text: 'Alle Tempeldiener und die Söhne der Diener Salomos: dreihundertzweiundsiebzig.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „Tempelsklaven“ und „die Söhne der Sklaven Salomos“; die griechischen Bezeichnungen meinen abhängigen Dienst und können einen unfreien Status ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντες
  choice: Alle
  rationale: Das Adjektiv fasst beide genannten Gruppen zusammen; „Alle“ gibt diese summierende Funktion knapp und natürlich wieder.
- source_word: ἱερόδουλοι
  choice: Tempeldiener
  rationale: Das Kompositum bezeichnet Menschen, die zum Dienst am Tempel gehören. „Tempeldiener“ ist im Deutschen verständlich und wahrt die institutionelle Funktion, ohne den möglichen unfreien Status auszublenden; dieser wird in der Fußnote genannt.
- source_word: υἱοὶ τῶν παίδων Σαλωμών
  choice: die Söhne der Diener Salomos
  rationale: „Söhne“ bewahrt die formale genealogische Ausdrucksweise des Griechischen; gemeint sein können auch Nachkommen. παῖδες kann Diener oder Sklaven bezeichnen, weshalb die stärkere soziale Lesart in der Fußnote erhalten bleibt.
- source_word: τριακόσιοι ἑβδομήκοντα δύο
  choice: dreihundertzweiundsiebzig
  rationale: Direkte Wiedergabe der Kardinalzahl in üblicher deutscher Schreibweise.
theological_decisions:
- issue: Wiedergabe sozial abhängiger Dienstverhältnisse in einer Verwaltungsliste
  choice: Im Haupttext „Tempeldiener“ und „Diener Salomos“
  alternative: „Tempelsklaven“ und „Sklaven Salomos“
  rationale: Der Vers nennt die Gesamtzahl zweier institutioneller Gruppen. „Diener“ lässt den genauen rechtlichen Status offen und überbestimmt den administrativen Kontext nicht; da beide griechischen Ausdrücke jedoch einen unfreien Status bezeichnen können, wird diese Möglichkeit ausdrücklich in der Fußnote bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Form einer Zensus- beziehungsweise Rückkehrerliste bleibt erhalten; der Doppelpunkt leitet die Gesamtzahl ein.
