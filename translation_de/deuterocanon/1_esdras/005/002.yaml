  text: And Darius sent with them a thousand horsemen[a], until they had brought them back to Jerusalem in peace and with music,
translation:
  language: de
  text: Und Darius sandte mit ihnen tausend Reiter, bis diese sie in Frieden und mit Musik nach Jerusalem zurückgebracht hatten,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συναπέστειλεν
  choice: sandte … mit ihnen
  rationale: Das Präfix συν- bezeichnet das Mitsenden als Begleitung; die deutsche Formulierung ist natürlich und bewahrt diesen Sinn.
- source_word: ἱππεῖς χιλίους
  choice: tausend Reiter
  rationale: ἱππεῖς bezeichnet hier berittene Begleiter beziehungsweise Truppen. „Reiter“ ist im Deutschen knapp, geläufig und im Kontext hinreichend militärisch.
- source_word: ἕως τοῦ ἀποκαταστῆσαι αὐτούς
  choice: damit sie sie … zurückbrächten
  rationale: Die Genitivkonstruktion kann Ziel oder den Endpunkt der Begleitung ausdrücken. Im Zusammenhang bezeichnet sie die bis zur Rückkehr nach Jerusalem reichende Aufgabe der Reiter; „damit“ gibt den Zweck in natürlichem Deutsch wieder, ohne das Subjekt ausdrücklich festzulegen.
- source_word: μετʼ εἰρήνης
  choice: wohlbehalten
  rationale: Die Wendung bezeichnet hier eine friedliche und sichere Ankunft. „Wohlbehalten“ gibt diesen kontextuellen Sinn idiomatisch wieder.
- source_word: μετὰ μουσικῶν
  choice: begleitet von Musik
  rationale: μουσικῶν kann sich auf Musik oder auf Musizierende beziehen. Der Haupttext wahrt die allgemeinere Deutung als Musik; die personale Alternative wird in der Fußnote genannt.
