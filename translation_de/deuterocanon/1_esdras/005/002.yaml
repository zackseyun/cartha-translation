review_pass:
  verdict: revise
  source_fidelity: Die Wiedergabe von συναπέστειλεν, ἱππεῖς χιλίους und ἀποκαταστῆσαι als Entsendung einer Eskorte und Rückbringung nach Jerusalem trifft den Sinn. „Damit“ hebt jedoch einseitig den Zweck hervor, während ἕως τοῦ hier vorrangig die Begleitung bis zum Abschluss der Rückkehr ausdrückt. „Wohlbehalten“ verengt μετʼ εἰρήνης auf körperliche Unversehrtheit; „in Frieden“ wahrt die griechische Wendung und ihre mögliche Bedeutung einer sicheren, friedlichen Ankunft.
  naturalness: Die Folge „damit sie sie ... zurückbrächten“ ist wegen der doppelten, nicht auflösbaren Pronomen schwer lesbar. Mit einem demonstrativen Subjekt für die Reiter und einer Bis-Konstruktion ist der Satz klar und modernes Standarddeutsch.
  terminology: „Darius“, „tausend Reiter“ und „Musik“ sind angemessen. Die Fußnote erhält die lexikalische Alternative zu μουσικῶν zutreffend; „Musiker“ ist im Deutschen die idiomatische Bezeichnung.
  issues:
  - severity: medium
    issue: Die Konjunktion „damit“ macht die ἕως-Genitivinfinitiv-Konstruktion ausschließlich final.
    rationale: 'Die Konstruktion kann zwar einen Zweckzusammenhang haben, bezeichnet in diesem Kontext aber besonders die zeitliche Grenze der Eskorte: bis die Rückkehr nach Jerusalem vollzogen war. „Bis“ bildet diese Nuance direkter ab.'
  - severity: medium
    issue: „Wohlbehalten“ ist enger als μετʼ εἰρήνης.
    rationale: Das deutsche Wort betont vor allem das unversehrte Ankommen. „In Frieden“ bewahrt die offene griechische Formel, die Frieden und sichere Ankunft umfassen kann.
  - severity: low
    issue: Das doppelte „sie“ ist referenziell unnötig schwer verständlich.
    rationale: „Diese“ kann ohne Sinnzusatz auf die zuvor genannten Reiter zurückverweisen; das Objektpronomen bleibt dann klar als die begleitete Gruppe lesbar.
  revised_text: Und Darius sandte mit ihnen tausend Reiter, bis diese sie in Frieden und mit Musik nach Jerusalem zurückgebracht hatten,
  revised_footnotes:
  - marker: a
    text: 'Oder: „mit Musikern“. Das griechische Wort kann sowohl Musik allgemein als auch Musizierende bezeichnen.'
    reason: lexical_alternative
  revision_rationale: Die Revision gibt den zeitlichen Umfang der Eskorte mit „bis“ wieder, bewahrt die Breite von μετʼ εἰρήνης durch „in Frieden“ und löst die deutsche Pronomenhäufung. Die Fußnotenalternative bleibt am Ausdruck „mit Musik“ verankert und ist idiomatisch formuliert.
