revisions:
- from: Und Darius sandte tausend Reiter mit ihnen, damit sie sie wohlbehalten nach Jerusalem zurückbrächten, begleitet von Musik[a],
  to: Und Darius sandte mit ihnen tausend Reiter, bis diese sie in Frieden und mit Musik nach Jerusalem zurückgebracht hatten,
  rationale: Die Revision gibt den zeitlichen Umfang der Eskorte mit „bis“ wieder, bewahrt die Breite von μετʼ εἰρήνης durch „in Frieden“ und löst die deutsche Pronomenhäufung. Die Fußnotenalternative bleibt am Ausdruck „mit Musik“ verankert und ist idiomatisch formuliert.
