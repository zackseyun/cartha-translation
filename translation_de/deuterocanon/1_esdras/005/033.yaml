base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/033.yaml
  text: the sons of Solomon’s servants[a], the sons of Assapheioth, the sons of Phaerida, the sons of Jeelei, the sons of Lozon, the sons of Isdael, the sons of Saphuei,
translation:
  language: de
  text: die Nachkommen der Diener Salomos[a], die Nachkommen Assapheioths, die Nachkommen Phareidas, die Nachkommen Jeeleis, die Nachkommen Lozons, die Nachkommen Isdaels, die Nachkommen Saphueis,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Text nennt hier mehrere Familiennamen, die erheblich von dem ungefähren masoretischen Paralleltext abweichen. Dieser enthält nur die kürzere Liste: „die Nachkommen Giddels, die Nachkommen Gahars, die Nachkommen Reajas“.'
    reason: alternative_reading
lexical_decisions:
- source_word: υἱοὶ
  choice: die Nachkommen
  rationale: In einer Rückkehrer- und Sippenliste bezeichnet die wiederholte Formel die Angehörigen beziehungsweise Nachfahren einer Familie; „Nachkommen“ ist im modernen Deutschen natürlicher und sachlich genauer als das ausschließlich männlich klingende „Söhne“.
- source_word: παίδων Σαλωμών
  choice: der Diener Salomos
  rationale: παῖς kann Diener oder Sklave bedeuten. In dieser administrativ-genealogischen Gruppenbezeichnung ist „Diener“ die angemessene, traditionelle Wiedergabe, ohne eine über den Kontext hinausgehende Aussage zum Rechtsstatus festzulegen.
- source_word: Σαλωμών
  choice: Salomo
  rationale: Gebräuchliche deutsche Form des Königsnamens.
- source_word: Ἀσσαφειώθ
  choice: Assapheioth
  rationale: Enge Umschrift der griechischen Namensform; keine Angleichung an den deutlich abweichenden masoretischen Paralleltext.
- source_word: Φαρειδά
  choice: Phareida
  rationale: Die griechische Form wird eng und in einer im Deutschen lesbaren Gestalt wiedergegeben; φ erscheint als „Ph“.
- source_word: Ἰεηλεί
  choice: Jeelei
  rationale: Die Namensform folgt dem griechischen Text; anlautendes Ἰ wird nach deutscher Bibelnamenkonvention als J wiedergegeben.
- source_word: Λοζών
  choice: Lozon
  rationale: Direkte, lesbare Umschrift der griechischen Namensform.
- source_word: Ἰσδαήλ
  choice: Isdael
  rationale: Enge Umschrift des ungewöhnlichen griechischen Namens, ohne Harmonisierung mit einer vermuteten hebräischen Form.
- source_word: Σαφυεί
  choice: Saphuei
  rationale: Enge Umschrift der seltenen griechischen Namensform; φ wird als „ph“ wiedergegeben.
theological_decisions:
- issue: Verhältnis der griechischen Namensliste zum ungefähren masoretischen Paralleltext
  choice: Die vollständige griechische Liste wird unverändert übersetzt; die Abweichung wird in einer Fußnote genannt.
  alternative: 'Angleichung an die kürzere masoretische Liste: Giddel, Gahar und Reaja.'
  rationale: Für 1 Esdras ist der griechische Text die primäre Übersetzungsgrundlage. Der masoretische Paralleltext dient nur zum Vergleich und darf die deutlich andere griechische Überlieferung nicht stillschweigend ersetzen.
translation_notes:
  register: Moderne, würdige Listensprache. Die wiederholte Formel bleibt zur Wahrung des genealogischen Rhythmus erhalten. Die Eigennamen folgen dem griechischen Hauptzeugen und werden nicht an die abweichende hebräische Parallele angeglichen.
