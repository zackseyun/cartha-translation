  text: and from the tribe of Judah[a], who spoke wise words to Darius king of the Persians in the second year of his reign, in the month Nisan, the first month.
translation:
  language: de
  text: und aus dem Stamm Juda, der vor Darius[a], dem König der Perser, weise Worte sprach, im zweiten Jahr seiner Herrschaft, im Monat Nisan, dem ersten Monat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in der Gegenwart des Darius“ oder „zu Darius“. Die griechische Wendung ἐπὶ Δαρείου lässt in diesem höfischen Zusammenhang mehrere eng verwandte Deutungen zu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: φυλῆς δὲ Ἰούδα
  choice: und aus dem Stamm Juda
  rationale: φυλή bezeichnet hier die Stammeszugehörigkeit. „Stamm Juda“ ist die übliche und im genealogisch-ethnischen Zusammenhang natürliche Wiedergabe; δέ wird im fortlaufenden Satz als „und“ wiedergegeben.
- source_word: ἐλάλησεν
  choice: sprach
  rationale: Die einfache Vergangenheitsform gibt λαλέω direkt wieder, ohne die Art der Rede näher festzulegen.
- source_word: ἐπὶ Δαρείου
  choice: vor Darius
  rationale: ἐπί mit Genitiv kann in diesem höfischen Zusammenhang das Reden vor beziehungsweise in Gegenwart des Königs bezeichnen. „Vor Darius“ ist knapp, idiomatisch und wahrt diese räumlich-höfische Nuance.
- source_word: λόγους σοφοὺς
  choice: weise Worte
  rationale: Die Wiedergabe bewahrt sowohl den Plural λόγους als auch die Eigenschaft σοφούς und klingt im Deutschen natürlich.
- source_word: ἐν τῷ δευτέρῳ ἔτει τῆς βασιλείας αὐτοῦ
  choice: im zweiten Jahr seiner Herrschaft
  rationale: Die Formulierung ist eine natürliche deutsche Zeitangabe; „Herrschaft“ gibt βασιλεία im Blick auf die Regierungszeit wieder.
- source_word: μηνὶ Νισὰν τοῦ πρώτου μηνός
  choice: im Monat Nisan, dem ersten Monat
  rationale: Der ausdrücklich genannte „Monat“ bleibt erhalten; die nachgestellte Apposition erklärt Nisan als den ersten Monat.
