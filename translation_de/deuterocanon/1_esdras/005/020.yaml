base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/020.yaml
  text: the sons of Chadiasai and Ammidioi[a], four hundred twenty-two; the sons of Keiramas Kabbes, six hundred twenty-one[b];
translation:
  language: de
  text: 'die Chadiasai und Ammidioi[a]: 422; die aus Keiramas Kabbes[b]: 621;'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die griechische Form kann eine Personen- oder Familiengruppe bezeichnen; sinngemäß wäre auch »die Nachkommen des Chadiasai und des Ammidioi« möglich.
    reason: translation_ambiguity
  - marker: b
    text: 'Wörtlich: »die aus Keiramas Kabbes«. Die Namensfolge ist im Griechischen ungewöhnlich und enthält zwischen den beiden Namen kein »und«. Der hebräische Paralleltext in Esra/Nehemia weicht hier bei Namen und Zahlen erheblich ab; daher folgt die Übersetzung dem griechischen Text.'
    reason: textual_variant
lexical_decisions:
- source_word: οἱ Χαδιάσαι καὶ Ἀμμίδιοι
  choice: die Chadiasai und Ammidioi
  rationale: Der substantivierte Artikel bezeichnet in dieser Rückkehrerliste eine Personen- oder Familiengruppe. Die knappe Wiedergabe bewahrt die Form des Griechischen, ohne das dort nicht ausdrücklich stehende »Söhne/Nachkommen« einzufügen. Die Eigennamen werden nach dem griechischen Hauptzeugen transliteriert.
- source_word: τετρακόσιοι εἴκοσι δύο
  choice: '422'
  rationale: Die Kardinalzahl wird in der zahlenreichen Liste übersichtlich mit Ziffern wiedergegeben.
- source_word: οἱ ἐκ Κειράμας Κάββης
  choice: die aus Keiramas Kabbes
  rationale: ἐκ bezeichnet Herkunft oder Zugehörigkeit und wird formal mit »aus« wiedergegeben. Zwischen Κειράμας und Κάββης steht im Griechischen keine Konjunktion; deshalb wird kein »und« ergänzt. Die ungewöhnliche Namensfolge bleibt erhalten.
- source_word: ἑξακόσιοι εἴκοσι εἷς
  choice: '621'
  rationale: Die Kardinalzahl wird in der zahlenreichen Liste übersichtlich mit Ziffern wiedergegeben.
