base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/045.yaml
  text: And the priests and the Levites and some of the people settled in Jerusalem and the region[a], and the temple singers and the gatekeepers, and all Israel in their villages.
translation:
  language: de
  text: Und die Priester, die Leviten und Angehörige seines Volkes[a] ließen sich in Jerusalem und in der Gegend nieder, ebenso die Tempelsänger und die Torhüter; und ganz Israel ließ sich in seinen Dörfern nieder.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die aus seinem Volk“. Worauf sich „seinem“ bezieht, ist im Griechischen nicht eindeutig; gemeint sind offenbar Angehörige des Volkes neben den Priestern und Leviten.'
    reason: Bewahrung einer grammatischen und referenziellen Mehrdeutigkeit des griechischen Textes.
lexical_decisions:
- source_word: κατῳκίσθησαν
  choice: ließen sich nieder
  rationale: Die Form bezeichnet hier die Ansiedlung beziehungsweise Aufnahme eines festen Wohnsitzes. „Ließen sich nieder“ ist im modernen Deutschen natürlich und gibt den Vorgang der Wiederansiedlung wieder, ohne unnötig einen ausdrücklich genannten menschlichen Veranlasser vorauszusetzen.
- source_word: οἱ ἱερεῖς
  choice: die Priester
  rationale: Die übliche und genaue Bezeichnung für die kultischen Amtsträger.
- source_word: οἱ Λευεῖται
  choice: die Leviten
  rationale: Die konventionelle und präzise Wiedergabe der levitischen Gruppe.
- source_word: οἱ ἐκ τοῦ λαοῦ αὐτοῦ
  choice: Angehörige seines Volkes
  rationale: Diese Wiedergabe bleibt näher beim griechischen Wortlaut „die aus seinem Volk“ als eine quantifizierende Formulierung wie „einige aus dem Volk“. Zugleich bleibt der unklare Bezug des Possessivpronomens erhalten und wird in einer Fußnote erläutert.
- source_word: ἐν Ἰερουσαλὴμ καὶ τῇ χώρᾳ
  choice: in Jerusalem und in der Gegend
  rationale: χώρα bezeichnet hier neben Jerusalem das weitere Gebiet beziehungsweise die Gegend. „Gegend“ ist verständlich und fügt die im Griechischen nicht ausdrücklich vorhandene Bestimmung „umliegend“ nicht in den Haupttext ein.
- source_word: οἵ τε ἱεροψάλται
  choice: ebenso die Tempelsänger
  rationale: ἱεροψάλται bezeichnet Sänger im Heiligtums- beziehungsweise Tempeldienst. „Tempelsänger“ macht diese kultische Funktion im Deutschen klar; „ebenso“ bildet die koordinierende Fortführung der Aufzählung ab.
- source_word: οἱ θυρωροὶ
  choice: die Torhüter
  rationale: Die etablierte und im Tempelkontext klare Bezeichnung für die mit den Toren betraute Gruppe.
- source_word: πᾶς Ἰσραήλ
  choice: ganz Israel
  rationale: Die feste kollektive Bezeichnung wird unmittelbar wiedergegeben, ohne sie ausdrücklich auf jeden einzelnen Israeliten zu verengen.
- source_word: ἐν ταῖς κώμαις αὐτῶν
  choice: in seinen Dörfern
  rationale: κώμη bezeichnet gewöhnlich ein Dorf oder eine kleinere Ortschaft. Das singularische Possessivpronomen entspricht im Deutschen dem grammatisch singularischen Kollektivnamen „Israel“.
theological_decisions:
- issue: Umfang von πᾶς Ἰσραήλ
  choice: ganz Israel
  alternative: jeder einzelne Israelit ohne Ausnahme
  rationale: Die Formulierung bezeichnet das wiederhergestellte Bundesvolk kollektiv. Die Übersetzung bewahrt diese korporative Aussage, ohne eine mathematische Vollständigkeit ausdrücklich festzulegen.
- issue: Bezug von αὐτοῦ in οἱ ἐκ τοῦ λαοῦ αὐτοῦ
  choice: seines Volkes, mit Hinweis auf den unklaren Bezug
  alternative: aus dem Volk / einige aus dem Volk
  rationale: Das griechische Possessivpronomen hat im unmittelbaren Satz keinen eindeutigen singularischen Bezug. Es wird daher nicht stillschweigend entfernt oder auf eine bestimmte Person festgelegt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wiederholte Wendung „ließ sich … nieder“ verdeutlicht im Deutschen die elliptische Fortführung des griechischen Verbs beim abschließenden „ganz Israel“. Das Semikolon gliedert die lange Aufzählung, ohne ihre inhaltliche Zusammengehörigkeit aufzulösen.
