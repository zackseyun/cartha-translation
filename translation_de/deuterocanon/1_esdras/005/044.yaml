base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/044.yaml
  text: and to give to the holy treasury for the works one thousand minas of gold[a], and five thousand minas of silver[b], and one hundred priestly garments.
translation:
  language: de
  text: und in die heilige Schatzkammer[a] für die Arbeiten tausend Minen[b] Gold, fünftausend Minen Silber und hundert Priestergewänder zu geben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Tempelschatzkammer“. Der griechische Ausdruck verbindet wörtlich „heilig“ mit „Schatzkammer/Vorratshaus“.'
    reason: lexical_alternative
  - marker: b
    text: Eine Mine war eine antike Gewichts- und davon abgeleitet auch Werteinheit. Die alte Bezeichnung wird beibehalten, statt sie in eine moderne Einheit umzurechnen.
    reason: cultural_note
lexical_decisions:
- source_word: δοῦναι
  choice: zu geben
  rationale: Der Infinitiv wird unmittelbar wiedergegeben und bewahrt den Anschluss an den vorausgehenden Satz.
- source_word: εἰς τὸ ἱερὸν γαζοφυλάκιον
  choice: in die heilige Schatzkammer
  rationale: γαζοφυλάκιον bezeichnet eine Schatzkammer oder ein Vorratshaus für Kostbarkeiten; ἱερόν kennzeichnet sie als heilig beziehungsweise zum Heiligtum gehörig. Die Formulierung bildet beide Bestandteile des Griechischen ab, ohne sie stillschweigend als Tempelschatzkammer auszulegen.
- source_word: τῶν ἔργων
  choice: für die Arbeiten
  rationale: Der Genitiv bezeichnet hier am ehesten Zweck oder Zuordnung. „Arbeiten“ wahrt den Plural und lässt offen, ob sämtliche Bau-, Wiederherstellungs- oder sonstigen Tempelarbeiten gemeint sind.
- source_word: χρυσίου μνᾶς χιλίας
  choice: tausend Minen Gold
  rationale: Die antike Gewichts- und Werteinheit μνᾶ wird als „Mine“ beibehalten, statt eine unsichere moderne Umrechnung einzuführen.
- source_word: ἀργυρίου μνᾶς πεντακισχιλίας
  choice: fünftausend Minen Silber
  rationale: Die parallele Mengenangabe wird knapp und idiomatisch wiedergegeben; Material und Zahl bleiben ausdrücklich erhalten.
- source_word: στολὰς ἱερατικὰς
  choice: Priestergewänder
  rationale: Die Zusammensetzung ist im modernen Deutsch natürlich und verständlich und vermeidet den stärker konfessionell geprägten Ausdruck „Paramente“.
- source_word: ἑκατόν
  choice: hundert
  rationale: Schlichte Wiedergabe der Zahl im sachlichen Stil der Aufzählung.
theological_decisions:
- issue: Bezug der Schatzkammer auf das Heiligtum
  choice: heilige Schatzkammer
  alternative: Tempelschatzkammer
  rationale: Das Griechische verwendet ἱερόν adjektivisch und nennt den Tempel nicht ausdrücklich. Die Hauptfassung bewahrt diese Form; die naheliegende sachliche Deutung wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Vers bleibt als Infinitivkonstruktion formuliert, da er syntaktisch an den vorherigen Zusammenhang anschließt. Die Aufzählung ist bewusst knapp gehalten; antike Maße und die mögliche Mehrdeutigkeit der Schatzkammerbezeichnung bleiben erhalten.
