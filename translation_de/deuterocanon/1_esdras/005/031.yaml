base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/031.yaml
  text: the sons of Iaeir[a], the sons of Daisan, the sons of Noeba, the sons of Chaseba, the sons of Kazera, the sons of Ozeiou, the sons of Phinoe, the sons of Asara, the sons of Basthai, the sons of Assana, the sons of Manei, the sons of Napheisei, the sons of Akouph, the sons of Acheiba, the sons of Asour, the sons of Pharakem,
translation:
  language: de
  text: Die Söhne von Jaeir[a], die Söhne von Daisan, die Söhne von Noeba, die Söhne von Chaseba, die Söhne von Kazera, die Söhne von Ozeiu, die Söhne von Phinoe, die Söhne von Asara, die Söhne von Basthai, die Söhne von Assana, die Söhne von Manei, die Söhne von Napheisei, die Söhne von Akuph, die Söhne von Acheiba, die Söhne von Asur, die Söhne von Pharakem,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die hebräische Parallele in Nehemia 7,46 nennt an dieser Stelle andere Namen: „die Tempeldiener: die Söhne Zihas, die Söhne Hasufas, die Söhne Tabbaots“. Das 1. Buch Esdras überliefert hier eine deutlich abweichende griechische Liste; deshalb folgt die Übersetzung dem griechischen Ausgangstext, statt ihn an die hebräische Parallele anzugleichen.'
    reason: alternative_reading
lexical_decisions:
- source_word: υἱοὶ
  choice: die Söhne von
  rationale: In dieser genealogischen Liste bezeichnet die wiederkehrende Formel Familien- oder Sippengruppen. „Die Söhne von“ bewahrt die formale Struktur des Griechischen und vermeidet bei den seltenen Namen unsichere deutsche Genitivformen.
- source_word: Ἰαείρου
  choice: Jaeir
  rationale: Der Name wird nach der griechischen Form wiedergegeben und nicht an einen geläufigeren hebräischen Namen oder an die nur ungefähre masoretische Parallele angeglichen.
- source_word: Δαισάν
  choice: Daisan
  rationale: Quellennah aus dem Griechischen transliteriert; die ungefähre hebräische Parallele bietet keinen hinreichenden Grund für eine Normalisierung.
- source_word: Νοεβά
  choice: Noeba
  rationale: Direkte, im Deutschen gut lesbare Transliteration der griechischen Namensform.
- source_word: Χασεβά
  choice: Chaseba
  rationale: Das griechische Chi wird als „Ch“ wiedergegeben; die übrige Form folgt eng dem griechischen Text.
- source_word: Καζηρά
  choice: Kazera
  rationale: Konservative Transliteration des seltenen Namens; auf eine mutmaßliche Harmonisierung mit einer anderen Liste wird verzichtet.
- source_word: Ὀζείου
  choice: Ozeiu
  rationale: Die Form wird quellennah mit deutschem „u“ für griechisches ου wiedergegeben, ohne sie spekulativ einem bekannteren Namen anzugleichen.
- source_word: Φινόε
  choice: Phinoe
  rationale: Direkte Transliteration; „Ph“ gibt das griechische Phi wieder.
- source_word: Ἀσαρά
  choice: Asara
  rationale: Der Name wird unmittelbar nach seiner griechischen Form wiedergegeben.
- source_word: Βασθαί
  choice: Basthai
  rationale: Quellennahe Transliteration, bei der der Diphthong αι als „ai“ erhalten bleibt.
- source_word: Ἀσσανά
  choice: Assana
  rationale: Die Verdopplung des griechischen Sigma wird durch „ss“ sichtbar gemacht.
- source_word: Μανεί
  choice: Manei
  rationale: Die griechische Namensform wird ohne spekulative Normalisierung transliteriert.
- source_word: Ναφεισεί
  choice: Napheisei
  rationale: Quellennahe Transliteration mit „Ph“ für Phi und „ei“ für die griechischen ει-Verbindungen.
- source_word: Ἀκούφ
  choice: Akuph
  rationale: Direkte Transliteration der griechischen Form mit „Ph“ für Phi.
- source_word: Ἀχειβά
  choice: Acheiba
  rationale: Direkte Transliteration; Chi und der Diphthong ει bleiben erkennbar.
- source_word: Ἀσούρ
  choice: Asur
  rationale: Die griechische Lautfolge ου wird gemäß deutscher Transliteration als „u“ wiedergegeben.
- source_word: Φαρακέμ
  choice: Pharakem
  rationale: Direkte, im Deutschen lesbare Transliteration der griechischen Namensform.
