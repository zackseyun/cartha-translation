translation:
  language: de
  text: 'Die Nachkommen Samas[a]: dreitausenddreihunderteins.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Im griechischen Text steht »Sama« mit einer Gesamtzahl von 3.301. Die ungefähre Parallele in Esra 2,29 im masoretischen Text lautet dagegen: »die Nachkommen Nebos«, zweiundfünfzig. Da 1 Esdras hier nach dem griechischen Text übersetzt wird, folgt der Haupttext trotz dieser erheblichen Abweichung dem Griechischen.'
    reason: textual_variant
lexical_decisions:
- source_word: υἱοὶ
  choice: die Nachkommen
  rationale: In einer genealogischen Rückkehrerliste bezeichnet υἱοὶ die Angehörigen einer Familie oder Sippe. „Nachkommen“ ist im heutigen Deutsch natürlicher und vermeidet die missverständliche Beschränkung auf unmittelbare Söhne.
- source_word: Σαμά
  choice: Samas
  rationale: Der Eigenname wird nach dem maßgeblichen griechischen Text als „Sama“ wiedergegeben; der deutsche Genitiv wird mit -s gebildet. Die erhebliche Abweichung der ungefähren MT-Parallele wird in der Fußnote offengelegt.
- source_word: τρισχίλιοι τρακόσιοι εἷς
  choice: dreitausenddreihunderteins
  rationale: Die griechische Zahlenangabe wird ausgeschrieben und in der im Deutschen üblichen Zusammenschreibung wiedergegeben. Die Form bewahrt den knappen Listenstil.
theological_decisions: []
translation_notes:
  register: Knappes, würdevolles Listendeutsch. „Nachkommen“ gibt die genealogische Gruppenbezeichnung idiomatisch wieder; der Name und die hohe Zahl folgen bewusst dem griechischen Primärtext.
