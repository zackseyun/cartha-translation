  text: and many with trumpets[a], and great joy with the voice[b];
translation:
  language: de
  text: und viele mit Trompeten[a], und große Freude mit der Stimme[b];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Text ist hier elliptisch und wirkt wie eine verkürzte Aufzählung; wörtlich etwa: „und viele durch/mit Trompeten“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich steht hier: „und große Freude mit der Stimme“. Die Wendung kann eine hörbare Äußerung der Freude meinen, ohne deren genaue Form näher zu bestimmen. Die hebräische Parallelstelle in Esra 3,10 beschreibt ausführlicher Priester mit Trompeten und Leviten mit Zimbeln, die den HERRN loben; 1 Esdras bietet eine stark verkürzte griechische Fassung dieser Szene.'
    reason: cross_reference
lexical_decisions:
- source_word: πολλοὶ
  choice: viele
  rationale: Das substantivisch gebrauchte Adjektiv bezeichnet eine große Zahl Beteiligter. „Viele“ bewahrt die knappe, elliptische Ausdrucksweise, ohne ein im Griechischen fehlendes Bezugswort zu ergänzen.
- source_word: διὰ σαλπίγγων
  choice: mit Trompeten
  rationale: διά mit dem Genitiv bezeichnet hier das Mittel beziehungsweise die instrumentale Begleitung. „Mit Trompeten“ ist im Deutschen idiomatisch und wird durch die hebräische Parallelüberlieferung gestützt.
- source_word: χαρὰ μεγάλη
  choice: große Freude
  rationale: Die Wendung gibt das griechische Substantiv und sein Adjektiv unmittelbar wieder und vermeidet die stärker deutende Wiedergabe „großer Jubel“.
- source_word: τῇ φωνῇ
  choice: im Rufen
  rationale: φωνή kann Stimme, Laut oder Ruf bezeichnen. „Im Rufen“ macht die hörbare Äußerung der Freude verständlich, ohne das im Griechischen nicht vorhandene Adjektiv „laut“ einzuführen; die ungewöhnlich verdichtete Verknüpfung bleibt erkennbar.
