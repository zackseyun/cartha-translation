base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/036.yaml
  text: These were the ones who came up from Thermeleth and Thelersas, with Charaathalan and Allar leading them.
translation:
  language: de
  text: Diese waren aus Thermeleth und Thelersas heraufgezogen; Charaathalan und Allar führten sie an.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὗτοι
  choice: Dies sind diejenigen
  rationale: Gibt den rückverweisenden und identifizierenden Sinn des griechischen Demonstrativpronomens natürlich wieder.
- source_word: ἀναβάντες
  choice: heraufzogen
  rationale: Bewahrt das übliche räumliche beziehungsweise traditionsgeprägte Bild des Hinaufziehens, ohne das im Deutschen unnatürliche Partizip nachzubilden.
- source_word: ἡγούμενος αὐτῶν
  choice: führten sie an
  rationale: Das griechische Singularpartizip steht neben zwei Namen und erzeugt eine grammatische Spannung. Die finite Pluralform folgt dem naheliegenden Sinn, dass beide Genannten die Gruppe anführten, ohne ihnen ausdrücklich einen Amtstitel zu geben.
