base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/037.yaml
  text: 'And they were not able to declare their families and lineage[a], that they were from Israel: the sons of Asan son of Baenan, the sons of Nekodan[b], six hundred fifty-two.'
translation:
  language: de
  text: 'Und sie konnten ihre Sippen und ihre Abstammung nicht angeben, um zu zeigen, dass sie aus Israel stammten: die Söhne Asans, des Sohnes des Baenan[a], die Söhne Nekodans[b], sechshundertzweiundfünfzig.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich steht im Griechischen bei Asan die auffällige Formulierung „des Sohnes des Baenan“. Sie wird hier beibehalten und nicht zu einer eindeutigen genealogischen Beziehung geglättet.
    reason: lexical_alternative
  - marker: b
    text: Der griechische Text nennt hier Asan, Baenan und Nekodan. Der annähernde masoretische Paralleltext in Nehemia 7 bietet an dieser Stelle andere Namen. Da 1 Esdras hier nach dem griechischen Text übersetzt wird, bleiben dessen Namensformen im Haupttext erhalten.
    reason: alternative_reading
lexical_decisions:
- source_word: οὐκ ἠδύναντο ἀπαγγεῖλαι
  choice: sie konnten … nicht angeben
  rationale: Gibt die ausdrücklich bezeichnete Unfähigkeit und das formelle Nennen der genealogischen Angaben in natürlichem Deutsch wieder.
- source_word: τὰς πατριὰς αὐτῶν καὶ γενεάς
  choice: ihre Sippen und ihre Abstammung
  rationale: „Sippen“ bezeichnet die väterlich bestimmte Familiengruppe; „Abstammung“ hebt daneben die genealogische Herkunft hervor, ohne beide Begriffe gleichzusetzen.
- source_word: ὡς ἐκ τοῦ Ἰσραὴλ εἰσίν
  choice: und damit nicht nachweisen, dass sie aus Israel stammten
  rationale: Im Zusammenhang geht es darum, dass ihre israelitische Herkunft durch die fehlenden genealogischen Angaben nicht belegt werden konnte. „Dass“ wahrt die Aussage des griechischen ὡς, während „nachweisen“ den evidenziellen Zusammenhang im Deutschen verständlich macht.
- source_word: υἱοὶ
  choice: die Söhne
  rationale: Bewahrt die übliche und transparente Wiedergabe der Listenformel, auch wenn damit im genealogischen Kontext weiter gefasst Nachkommen gemeint sein können.
- source_word: Ἀσὰν
  choice: Asan
  rationale: Transliteration des Namens aus dem maßgeblichen griechischen Text.
- source_word: τοῦ υἱοῦ τοῦ Βαενάν
  choice: des Sohnes des Baenan
  rationale: Bewahrt die überlieferte doppelte Sohnesbeziehung, statt die auffällige genealogische Formulierung stillschweigend zu glätten.
- source_word: Νεκωδάν
  choice: Nekodan
  rationale: Transliteration aus dem griechischen Hauptzeugen; die Namen des nur annähernden masoretischen Paralleltexts werden nicht in den Haupttext übernommen.
- source_word: ἑξακόσιοι πεντήκοντα δύο
  choice: sechshundertzweiundfünfzig
  rationale: Gibt die genaue Gesamtzahl in der für einen ausgeschriebenen deutschen Zahlennamen üblichen Form wieder.
