  register: Modernes, gut verständliches Standarddeutsch mit würdigem Listenstil. Die Formulierung „und damit nicht nachweisen“ macht den Zusammenhang zwischen fehlender genealogischer Angabe und unbelegter israelitischer Herkunft deutlich, ohne die auffällige Namens- und Abstammungsformel zu harmonisieren.
