  register: Knappes, würdiges Listenregister in modernem Standarddeutsch. Die wiederholte Formel des griechischen Textes bleibt erhalten; Eigennamen werden nach dem griechischen Hauptzeugen transliteriert. Das abschließende Komma macht sichtbar, dass der Satz beziehungsweise die Liste im folgenden Vers weitergeht.
