  text: the sons of Anneis[a], one hundred one; the sons of Arom, the sons of Bassai, three hundred twenty-three; the sons of Arseiphoureith[b],
translation:
  language: de
  text: 'die Söhne des Anneis[a]: 101; die Söhne des Arom, die Söhne des Bassai: 323; die Söhne des Arseiphureith[b],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Namensliste weicht hier von der ungefähr parallelen Stelle in Nehemia 7,23 ab; dort steht: „die Söhne Besais“.'
    reason: alternative_reading
  - marker: b
    text: Der Name „Arseiphureith“ ist im griechischen Text unsicher; der ungefähr parallele hebräische Text könnte auf „Harif“ weisen.
    reason: textual_variant
lexical_decisions:
- source_word: υἱοὶ
  choice: die Söhne des
  rationale: In dieser Herkunfts- und Heimkehrerliste bezeichnet der Ausdruck die Angehörigen einer Familie oder Sippe. Die wörtliche und in biblischen Listen geläufige Wiedergabe „die Söhne des“ bewahrt die Form des griechischen Textes.
- source_word: Ἀννείς
  choice: Anneis
  rationale: Der Eigenname wird eng am griechischen Hauptzeugen transliteriert und nicht an den abweichenden hebräischen Paralleltext angeglichen.
- source_word: ἑκατὸν εἷς
  choice: '101'
  rationale: Die Ziffernschreibung gibt die eindeutige Kardinalzahl in der langen Namens- und Zahlenliste übersichtlich wieder.
- source_word: Ἀρόμ
  choice: Arom
  rationale: Direkte Transliteration des griechischen Eigennamens; wegen der erheblichen Abweichung des Paralleltextes wird keine Harmonisierung vorgenommen.
- source_word: Βασσαί
  choice: Bassai
  rationale: Die Form folgt dem griechischen Βασσαί. Das ungefähr parallele hebräische Bezai wird nicht in den Haupttext übernommen.
- source_word: τριακόσιοι εἴκοσι τρεῖς
  choice: '323'
  rationale: Die eindeutige Kardinalzahl wird der Übersichtlichkeit der Liste entsprechend als Zahl geschrieben.
- source_word: Ἀρσειφουρείθ
  choice: Arseiphureith
  rationale: Die deutsche Transliteration bildet die griechischen Lautwerte möglichst transparent ab (ου = u, ει = ei, θ = th), ohne die unsichere Namensform stillschweigend zu korrigieren.
