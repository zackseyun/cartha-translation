  text: the sons of Kalamokalos and Onous[a], seven hundred twenty-five; the sons of Jericho, two hundred forty-five;
translation:
  language: de
  text: 'Die Söhne von Kalamokalos und Onus[a]: siebenhundertfünfundzwanzig; die Söhne von Jericho: zweihundertfünfundvierzig;'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die hebräische Parallele in der Esra-Nehemia-Überlieferung weicht hier deutlich ab und lautet ungefähr: „die Männer von Bethel und Ai: zweihundertdreiundzwanzig“. Der griechische Text von 1 Esdras bietet andere Namen und Zahlen.'
    reason: alternative_reading
lexical_decisions:
- source_word: υἱοὶ
  choice: die Söhne von
  rationale: Die feste Listenformel bezeichnet hier eine Herkunfts- oder Gruppenzugehörigkeit. „Söhne von“ bewahrt das Bild und die formale Struktur des Griechischen, ohne sie auf unmittelbare leibliche Söhne zu beschränken.
- source_word: Καλαμωκάλου
  choice: Kalamokalos
  rationale: Der Eigenname wird nach der griechischen Form transliteriert und nicht an die abweichende hebräische Parallele angeglichen.
- source_word: Ὠνούς
  choice: Onus
  rationale: Die griechische Namensform wird in deutscher Transliteration wiedergegeben; griechisches ου erscheint dabei als „u“. Eine Harmonisierung mit den anderen Ortsnamen der hebräischen Parallele wird vermieden.
- source_word: ἑπτακόσιοι εἴκοσι πέντε
  choice: siebenhundertfünfundzwanzig
  rationale: Direkte Wiedergabe der griechischen Kardinalzahl in üblicher deutscher Schreibung.
- source_word: Ἰερήχου
  choice: Jericho
  rationale: Die im Deutschen geläufige Form des Ortsnamens gibt den griechischen Namen klar und natürlich wieder.
- source_word: διακόσιοι τεσσεράκοντα πέντε
  choice: zweihundertfünfundvierzig
  rationale: Direkte Wiedergabe der griechischen Kardinalzahl in üblicher deutscher Schreibung.
theological_decisions:
- issue: Verhältnis des griechischen Textes zur abweichenden hebräischen Parallele in dieser Rückkehrerliste
  choice: Die Namen und Zahlen des griechischen Textes werden unverändert übersetzt.
  alternative: 'Angleichung an die hebräische Parallele: „die Männer von Bethel und Ai, zweihundertdreiundzwanzig“'
  rationale: Für 1 Esdras ist der vorgelegte griechische Text der unmittelbare Ausgangstext. Die hebräische Parallele ist nur annähernd und weicht hier sowohl bei den Namen als auch bei der Gesamtzahl deutlich ab; eine Harmonisierung würde die eigenständige griechische Überlieferung verdecken.
translation_notes:
  register: Moderne, würdige Listensprache. Die wiederholte Formel „die Söhne von“ hält die genealogische Ausdrucksweise des Griechischen fest und bleibt zugleich für heutige Leser verständlich. Die deutschen Zahlwörter werden zusammengeschrieben; die semikolonartige Reihung des Ausgangstextes bleibt erhalten.
