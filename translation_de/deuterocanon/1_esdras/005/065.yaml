base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/065.yaml
  text: And coming to Zerubbabel and Jeshua and the heads of the fathers’ houses[a], they said to them, “We will build with you.”
translation:
  language: de
  text: 'Sie traten an Serubbabel, Jeschua und die Oberhäupter der Sippen heran und sagten zu ihnen: »Wir werden gemeinsam mit euch bauen[a].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Wir werden uns euch beim Bauen anschließen.« Das griechische Verb bezeichnet gemeinsames Bauen, nicht nur allgemeine Unterstützung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθόντες
  choice: Sie traten … heran
  rationale: Das Aoristpartizip bezeichnet die Annäherung vor dem Sprechen. Die finite deutsche Form gibt den Handlungsablauf natürlich wieder.
- source_word: τῷ Ζοροβαβὲλ καὶ Ἰησοῦ
  choice: an Serubbabel, Jeschua
  rationale: Die im Deutschen etablierten alttestamentlichen Namensformen passen zum nachexilischen historischen Kontext.
- source_word: τοῖς ἡγουμένοις τῶν πατριῶν
  choice: die Oberhäupter der Sippen
  rationale: ἡγούμενοι bezeichnet leitende Personen; πατριαί sind durch Abstammung bestimmte Familien- oder Sippenverbände. Die Formulierung ist präzise und für heutige Leser verständlich.
- source_word: λέγουσιν
  choice: sagten
  rationale: Das griechische historische Präsens wird im Deutschen idiomatisch als Erzählpräteritum wiedergegeben, ohne die zeitliche Abfolge zu verändern.
- source_word: Συνοικοδομήσομεν ὑμῖν
  choice: Wir werden gemeinsam mit euch bauen
  rationale: Das Futur wird ausdrücklich wiedergegeben; »gemeinsam mit euch« bewahrt die συν-Komponente des Verbs συνοικοδομέω und damit den Anspruch auf Beteiligung am Bau.
theological_decisions:
- issue: Wiedergabe von Ἰησοῦ im nachexilischen Kontext
  choice: Jeschua
  alternative: Jesus; Josua
  rationale: Gemeint ist der Hohepriester der nachexilischen Zeit. »Jeschua« entspricht der üblichen historischen Namensform und vermeidet eine unbeabsichtigte Identifikation mit Jesus Christus.
- issue: Art der angebotenen Beteiligung am Bau
  choice: gemeinsam mit euch bauen
  alternative: euch beim Bauen helfen
  rationale: Das zusammengesetzte Verb bezeichnet gemeinsames Mitbauen und nicht lediglich allgemeine Unterstützung; die Übersetzung lässt den darin erhobenen Anspruch auf Teilhabe erkennen.
translation_notes:
  register: Moderne, würdige Erzählprosa. »Oberhäupter der Sippen« wahrt die soziale Struktur des Ausgangstextes, ohne den im heutigen Deutsch schwer verständlichen Ausdruck »Vaterhäuser« zu verwenden.
