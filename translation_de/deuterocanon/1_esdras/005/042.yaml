lexical_decisions:
- source_word: κάμηλοι
  choice: Kamele
  rationale: Die übliche und hier hinreichend genaue Bedeutung ist »Kamele«; der griechische Ausdruck verlangt keine engere Bestimmung der Kamelart.
- source_word: ἵπποι
  choice: Pferde
  rationale: Direkte und natürliche Wiedergabe der gewöhnlichen Bezeichnung für Pferde.
- source_word: ἡμίονοι
  choice: Maultiere
  rationale: Der griechische Ausdruck bezeichnet Maultiere; eine etymologisch wörtliche Wiedergabe wäre im Deutschen unidiomatisch.
- source_word: ὑποζύγια
  choice: Lasttiere
  rationale: Der Ausdruck bezeichnet allgemein Tiere, die zum Tragen oder als Arbeitstiere eingesetzt werden, ohne eine bestimmte Tierart festzulegen. »Lasttiere« bewahrt diese begriffliche Weite.
- source_word: τετρακόσιοι τριάκοντα πέντε
  choice: '435'
  rationale: Die Zahl wird in einer übersichtlichen Aufzählung nach heutiger deutscher Schreibweise als Ziffer wiedergegeben.
- source_word: ἑπτακισχίλιοι τριάκοντα ἕξ
  choice: '7.036'
  rationale: Direkte Wiedergabe des griechischen Zahlwerts mit deutschem Tausendertrennzeichen.
- source_word: διακόσιοι τεσσεράκοντα πέντε
  choice: '245'
  rationale: Direkte Wiedergabe des griechischen Zahlwerts.
- source_word: πεντακισχίλια πεντακόσια εἴκοσι πέντε
  choice: '5.525'
  rationale: Direkte Wiedergabe des griechischen Zahlwerts mit deutschem Tausendertrennzeichen.
