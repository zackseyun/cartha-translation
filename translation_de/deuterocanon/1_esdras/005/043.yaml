base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/043.yaml
  text: And some of the heads of families[a], when they arrived at the temple of God in Jerusalem, pledged to raise up the house on its site, according to their ability,
translation:
  language: de
  text: Und einige der Oberhäupter der Sippen gelobten[a], als sie zum Tempel Gottes in Jerusalem kamen, das Haus an seiner Stätte wieder aufzurichten, soweit es in ihrer Kraft stand.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „verpflichteten sich, das Haus an seiner Stätte wieder aufzubauen“. Das griechische Verb kann ein Gelübde oder ein feierliches Versprechen bezeichnen; mit „Haus“ ist hier der Tempel gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡγουμένων κατὰ τὰς πατριὰς
  choice: Oberhäuptern der Sippen
  rationale: Die Wendung bezeichnet führende Personen innerhalb abstammungsbezogener Familienverbände. „Oberhäupter der Sippen“ gibt sowohl die Leitungsfunktion als auch die soziale Gliederung natürlich wieder.
- source_word: παραγίνεσθαι
  choice: kamen
  rationale: Das Verb bezeichnet hier ihr Eintreffen beim Tempel; „kamen“ ist schlicht, natürlich und kontextgemäß.
- source_word: ἱερὸν τοῦ θεοῦ
  choice: Tempel Gottes
  rationale: ἱερόν bezeichnet gewöhnlich den Tempel beziehungsweise den Tempelbezirk; „Tempel Gottes“ ist im Deutschen klar und geläufig.
- source_word: εὔξαντο
  choice: gelobten
  rationale: Das Verb kann ein Gelübde, ein feierliches Versprechen oder auch Gebet/Wunsch ausdrücken. Mit dem folgenden Infinitiv bezeichnet es hier am ehesten eine feierliche Selbstverpflichtung; „gelobten“ bewahrt diesen möglichen religiösen Klang.
- source_word: ἐγεῖραι
  choice: wieder aufzurichten
  rationale: Wörtlich bedeutet das Verb „aufrichten/erheben“. Da das Haus an seiner eigenen Stätte errichtet werden soll, ist der Wiederaufbau impliziert; „wieder aufzurichten“ bewahrt zugleich das griechische Bild.
- source_word: οἶκον
  choice: das Haus
  rationale: Gemeint ist Gottes Haus, also der Tempel. „Haus“ erhält die biblische Ausdrucksweise; der vorherige Ausdruck „Tempel Gottes“ klärt den Bezug.
- source_word: ἐπὶ τοῦ τόπου αὐτοῦ
  choice: an seiner Stätte
  rationale: Die Formulierung bezeichnet den zugehörigen beziehungsweise ursprünglichen Standort. „An seiner Stätte“ ist würdig und präzise.
- source_word: κατὰ τὴν αὐτῶν δύναμιν
  choice: soweit es in ihrer Kraft stand
  rationale: Die Wendung lässt sowohl vorhandene Mittel als auch praktische Leistungsfähigkeit anklingen und wird im Deutschen idiomatisch wiedergegeben.
theological_decisions:
- issue: Ob εὔξαντο als förmliches religiöses Gelübde oder als allgemeinere Verpflichtung zu verstehen ist
  choice: gelobten
  alternative: verpflichteten sich / versprachen
  rationale: Der Tempelkontext und die mögliche Gelübdebedeutung des Verbs sprechen für eine feierliche Formulierung. Die Fußnote hält die weitere Bedeutungsbreite offen, ohne ein technisch-kultisches Gelübde zwingend festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Oberhäupter der Sippen“ bildet die soziale Struktur verständlich ab; „Haus“ bewahrt die biblische Tempelmetaphorik. Die Stellung der Fußnotenmarke am Versende bezieht sie auf die erläuterte Aussage als Ganze.
