base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/048.yaml
  text: to offer burnt offerings on it[a], according to what is prescribed in the book of Moses, the man of God.
translation:
  language: de
  text: um darauf Brandopfer darzubringen, entsprechend dem, was im Buch des Mose, des Mannes Gottes, vorgeschrieben ist.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hebräische Paralleltext in Esra 3,2 lautet: „wie es im Gesetz des Mose, des Mannes Gottes, geschrieben steht“. 1 Esdras spricht hier vom „Buch des Mose“ und von dem, was „vorgeschrieben“ ist; beide Formulierungen haben denselben Grundsinn.'
    reason: alternative_reading
lexical_decisions:
- source_word: προσενέγκαι
  choice: darzubringen
  rationale: Im Opferkontext bezeichnet das Verb das Darbringen von Opfern; die deutsche Wendung ist präzise und bibelsprachlich vertraut.
- source_word: ἐπ’ αὐτοῦ
  choice: darauf
  rationale: Das Pronomen verweist auf den zuvor genannten Altar; „darauf“ gibt den örtlichen Bezug knapp und natürlich wieder.
- source_word: ὁλοκαυτώματα
  choice: Brandopfer
  rationale: „Brandopfer“ ist die etablierte deutsche Bezeichnung für ein vollständig verbranntes Opfer und wird durch das hebräische Parallelwort עֹלוֹת bestätigt.
- source_word: ἀκολούθως
  choice: entsprechend
  rationale: Das Adverb bezeichnet die Übereinstimmung mit einer verbindlichen Vorgabe; „entsprechend“ ist natürlich und wahrt diesen Sinn.
- source_word: τοῖς ... διηγορευμένοις
  choice: dem, was ... vorgeschrieben ist
  rationale: Das Partizip bezeichnet autoritativ Festgelegtes. „Vorgeschrieben“ passt zum rechtlich-kultischen Zusammenhang, ohne den Wortlaut unnötig zu verstärken.
- source_word: ἐν τῇ Μωσέως βίβλῳ
  choice: im Buch des Mose
  rationale: Die griechische Vorlage nennt ausdrücklich das „Buch“ des Mose, nicht das „Gesetz“; diese Formulierung bleibt daher gegenüber dem hebräischen Paralleltext vorrangig.
- source_word: τοῦ ἀνθρώπου τοῦ θεοῦ
  choice: des Mannes Gottes
  rationale: Der Genitiv erläutert Mose durch einen traditionellen biblischen Ehrentitel; die formale Wiedergabe bewahrt dessen Gewicht.
theological_decisions:
- issue: Verhältnis des griechischen Wortlauts zum hebräischen Paralleltext in Esra 3,2
  choice: Die griechische Formulierung „im Buch des Mose“ und „vorgeschrieben“ wird beibehalten.
  alternative: „wie es im Gesetz des Mose, des Mannes Gottes, geschrieben steht“
  rationale: Für 1 Esdras ist der griechische Text die primäre Vorlage. Der hebräische Paralleltext bestätigt den rechtlich-kultischen Grundsinn, soll aber die abweichende griechische Formulierung nicht ersetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Brandopfer darzubringen“ wahrt die kultische Fachsprache, während Satzbau und Wortwahl allgemein verständlich bleiben. Der Fußnotenmarker steht unmittelbar nach dem vollständigen Satz.
