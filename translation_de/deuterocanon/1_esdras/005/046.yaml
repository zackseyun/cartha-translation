base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/046.yaml
  text: When the seventh month had come[a], and the sons of Israel were each in their own places[c][b], they gathered with one accord in the open area of the first gate on the east.
translation:
  language: de
  text: Als der siebte Monat angebrochen war und jeder von den Söhnen Israels[a] an seinem eigenen Ort war[b], versammelten sie sich einmütig auf der Freifläche[c] beim ersten Tor an der Ostseite[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Israeliten“. Wörtlich steht im Griechischen „Söhne Israels“, eine familiäre Bezeichnung für das Bundesvolk.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich etwa: „jeder in dem Seinen“. Gemeint ist, dass jeder an dem ihm eigenen Ort war; der genaue örtliche Bezug bleibt im Griechischen unausgesprochen.'
    reason: ambiguity
  - marker: c
    text: 'Oder: „auf dem weiten Platz“. Das griechische Wort bezeichnet einen geräumigen, offenen Bereich.'
    reason: lexical_alternative
  - marker: d
    text: „Tor“ kann hier auch den gesamten Torbau bezeichnen. Die Wendung beschreibt ihn als das erste Tor auf der Ostseite beziehungsweise als das erste Tor in östlicher Richtung.
    reason: architectural_ambiguity
lexical_decisions:
- source_word: Ἐνστάντος δὲ τοῦ ἑβδόμου μηνός
  choice: Als der siebte Monat angebrochen war
  rationale: Der Genitivus absolutus bezeichnet den Eintritt des siebten Monats. „Angebrochen war“ gibt diesen zeitlichen Beginn natürlich wieder; δέ verlangt hier kein eigens ausgedrücktes „aber“.
- source_word: τῶν υἱῶν Ἰσραήλ
  choice: die Söhne Israels
  rationale: Die griechische familiäre Bundesbezeichnung wird sichtbar bewahrt; das idiomatischere „Israeliten“ bleibt als Fußnotenalternative erhalten.
- source_word: ἕκαστος ἐν τοῖς ἰδίοις
  choice: jeder … an seinem eigenen Ort
  rationale: Die substantivisch gebrauchte Pluralform τοῖς ἰδίοις bleibt hinsichtlich der genauen Örtlichkeit offen. Die deutsche Einzahl folgt dem distributiven ἕκαστος und klingt natürlich.
- source_word: συνήχθησαν ὁμοθυμαδόν
  choice: versammelten sie sich einmütig
  rationale: ὁμοθυμαδόν bezeichnet nicht nur gemeinsames Erscheinen, sondern übereinstimmende Gesinnung beziehungsweise Zielrichtung.
- source_word: εἰς τὸ εὐρύχωρον
  choice: auf der Freifläche
  rationale: Gemeint ist ein weiter, offener Raum. „Freifläche“ vermeidet die nicht zwingende Festlegung auf einen städtischen Platz.
- source_word: τοῦ πρώτου πυλῶνος τοῦ πρὸς τῇ ἀνατολῇ
  choice: beim ersten Tor an der Ostseite
  rationale: Die räumliche Zuordnung wird verständlich wiedergegeben, ohne die unsichere architektonische Bedeutung von πυλών über „Tor“ hinaus festzulegen.
theological_decisions:
- issue: Familiäre maskuline Bezeichnung τῶν υἱῶν Ἰσραήλ
  choice: die Söhne Israels
  alternative: die Israeliten
  rationale: Die ausdrückliche griechische Verwandtschaftsbezeichnung wird bewahrt, da sie Israels gemeinschaftliche und bundestheologische Identität anklingen lässt. Die Alternative wird genannt, ohne die Formulierung stillschweigend zu verallgemeinern.
translation_notes:
  register: Moderne, gut verständliche Standardsprache mit würdigem Erzählton. Der Satzbau folgt dem griechischen zeitlichen Zusammenhang, wird aber im Deutschen geglättet. Echte lexikalische und architektonische Unsicherheiten werden in den Fußnoten offengelegt.
