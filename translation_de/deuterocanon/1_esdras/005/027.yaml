lexical_decisions:
- source_word: υἱοὶ
  choice: die Söhne
  rationale: Bewahrt die genealogische Listenformel des Griechischen; „Nachkommen“ wäre deutender.
- source_word: ἱεροψάλται
  choice: Tempelsänger
  rationale: Gibt die Verbindung von heiligem beziehungsweise tempelbezogenem Dienst und Singen knapp und verständlich wieder.
- source_word: υἱοὶ Ἀσάφ
  choice: die Söhne Asafs
  rationale: Erhält die im Griechischen wiederholte Formel und kennzeichnet die Sängergruppe nach ihrer Abstammung.
- source_word: ἑκατὸν εἴκοσι ὀκτώ
  choice: einhundertachtundzwanzig
  rationale: Entspricht der griechischen Kardinalzahl in üblichem modernem Deutsch.
