base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/014.yaml
  text: the sons of Adonikam[a], thirty-seven; the sons of Bosai, two thousand six hundred six; the sons of Adilion, four hundred fifty-four;
translation:
  language: de
  text: 'die Söhne Adonikams[a]: siebenunddreißig; die Söhne Bosais: zweitausendsechshundertsechs; die Söhne Adilions: vierhundertvierundfünfzig;'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der griechische Text nennt für Adonikam »siebenunddreißig«; die masoretische Parallelüberlieferung im Esra-Nehemia-Stoff hat »sechshundertsechsundsechzig«.
    reason: alternative_reading
lexical_decisions:
- source_word: υἱοὶ
  choice: die Söhne
  rationale: Die formelhafte Wendung der griechischen Rückkehrerliste wird formal bewahrt; sie bezeichnet hier Angehörige beziehungsweise Nachkommen einer Familie.
- source_word: Ἀδωνεικάμ
  choice: Adonikam
  rationale: Der Eigenname wird transliteriert; die Schreibweise entspricht zugleich gut der semitischen Namensform.
- source_word: τριάκοντα ἑπτά
  choice: siebenunddreißig
  rationale: Die im griechischen Haupttext überlieferte Zahl wird genau wiedergegeben und nicht an den abweichenden masoretischen Paralleltext angeglichen.
- source_word: Βοσαί
  choice: Bosai
  rationale: Der Eigenname wird unmittelbar aus dem Griechischen transliteriert, ohne ihn an eine vermutete hebräische Entsprechung anzupassen.
- source_word: δισχίλιοι ἑξακόσιοι ἕξ
  choice: zweitausendsechshundertsechs
  rationale: Genaue Wiedergabe der griechischen Zahl in ausgeschriebener Form.
- source_word: Ἀδειλίου
  choice: Adilion
  rationale: Die griechische Genitivform bezeichnet in der Listenformel die Familie; im Deutschen steht entsprechend der Genitiv des transliterierten Namens.
- source_word: τετρακόσιοι πεντήκοντα τέσσαρες
  choice: vierhundertvierundfünfzig
  rationale: Genaue und idiomatische Wiedergabe der griechischen Kardinalzahl.
theological_decisions:
- issue: Abweichende Zahlen und Namen gegenüber der masoretischen Parallelüberlieferung
  choice: Die Lesarten und Zahlen des griechischen Textes von 1 Esdras werden unverändert übersetzt.
  alternative: Adonikams Zahl nach der masoretischen Parallelüberlieferung als sechshundertsechsundsechzig wiedergeben.
  rationale: Für 1 Esdras ist der griechische Text die maßgebliche Übersetzungsgrundlage. Die erhebliche Abweichung wird nicht harmonisiert, sondern transparent in einer Fußnote dokumentiert.
translation_notes:
  register: Moderne, würdige Standardsprache. Die knappe, formelhafte Struktur einer antiken Namens- und Zahlenliste bleibt erhalten; Doppelpunkte verdeutlichen im Deutschen die Zuordnung der Zahlen zu den Familien.
