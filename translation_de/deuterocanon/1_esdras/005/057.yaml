revisions:
- from: Und die Priester traten in festlicher Kleidung mit Musikern und Trompeten an[a], und die Leviten, die Söhne Asafs, hielten die Zimbeln; sie lobten den Herrn und priesen ihn nach dem Vorbild Davids, des Königs von Israel[b].
  to: Und die Priester standen in festlicher Kleidung mit Musikinstrumenten und Trompeten[a], und die Leviten, die Söhne Asafs, hielten die Zimbeln; sie lobten den Herrn und priesen ihn nach David, dem König Israels[b].
  rationale: Die Revision folgt die griechische Wortwahl enger, ohne ihre lexikalische und syntaktische Offenheit aufzulösen. Sie ersetzt die im Kontext weniger wahrscheinliche Personenlesart von μουσικῶν im Haupttext, hält diese aber in der Fußnote fest. „nach David“ vermeidet die durch „nach dem Vorbild“ erzeugte Einengung des κατά-Ausdrucks. Beide Fußnotenanker bleiben unmittelbar an den jeweiligen Ausdrücken stehen.
