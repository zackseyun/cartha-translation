base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/057.yaml
  text: And the priests stood arrayed with musicians and trumpets, and the Levites, the sons of Asaph, had the cymbals, praising the Lord and blessing him according to David king of Israel;
translation:
  language: de
  text: Und die Priester standen in festlicher Kleidung mit Musikinstrumenten und Trompeten[a], und die Leviten, die Söhne Asafs, hielten die Zimbeln; sie lobten den Herrn und priesen ihn nach David, dem König Israels[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit Musikern und Trompeten“. Das griechische Wort kann musikalische Ausführende, musikalische Begleitung oder Musikinstrumente bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „nach der Anordnung Davids, des Königs von Israel“ oder „in der Weise Davids, des Königs von Israel“. Der griechische Ausdruck lässt offen, ob eine Vorschrift, ein überlieferter Brauch oder ein Vorbild gemeint ist.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἔστησαν
  choice: traten … an
  rationale: Gibt das Einnehmen einer zeremoniellen Stellung natürlich wieder, ohne eine bloß statische Haltung oder eine amtliche Einsetzung festzulegen.
- source_word: ἐστολισμένοι
  choice: in festlicher Kleidung
  rationale: Bezeichnet die für den feierlichen Dienst angelegte Kleidung, ohne ausdrücklich besondere Priestergewänder vorauszusetzen.
- source_word: μετὰ μουσικῶν καὶ σαλπίγγων
  choice: mit Musikern und Trompeten
  rationale: μουσικῶν kann musikalische Ausführende oder allgemeiner musikalische Begleitung beziehungsweise Instrumente bezeichnen; im Haupttext wird die personale Deutung gewählt und die weitere Möglichkeit in der Fußnote bewahrt.
- source_word: Λευεῖται υἱοὶ Ἀσὰφ
  choice: die Leviten, die Söhne Asafs
  rationale: Bewahrt sowohl die kultische Zuordnung als auch die Familien- oder Sängergruppenbezeichnung.
- source_word: ἔχοντες τὰ κύμβαλα
  choice: hielten die Zimbeln
  rationale: Gibt den Partizipialausdruck konkret und idiomatisch wieder, ohne die tatsächliche Verwendung über das Halten hinaus ausdrücklich zu behaupten.
- source_word: ὑμνοῦντες τῷ κυρίῳ
  choice: sie lobten den Herrn
  rationale: ὑμνεῖν bezeichnet hier gesungenes Gotteslob; das allgemein verständliche „lobten“ vermeidet eine unnötig technische Formulierung.
- source_word: εὐλογοῦντες
  choice: priesen ihn
  rationale: Im Deutschen ist „Gott preisen“ für εὐλογεῖν in dieser Richtung natürlicher als „ihn segnen“; das ergänzte Pronomen macht den im Griechischen impliziten Bezug auf den Herrn deutlich.
- source_word: κατὰ Δαυεὶδ βασιλέα τοῦ Ἰσραήλ
  choice: nach dem Vorbild Davids, des Königs von Israel
  rationale: Bewahrt den Gedanken der Übereinstimmung mit David, ohne eindeutig zwischen Vorschrift, Anordnung und liturgischem Muster zu entscheiden.
theological_decisions:
- issue: Wiedergabe von κύριος im kultischen Kontext der Septuaginta
  choice: der Herr
  alternative: Herr
  rationale: Der Ausdruck bezeichnet hier den Gott Israels. „Der Herr“ ist die übliche, verständliche Wiedergabe und wahrt den gottesdienstlichen Bezug.
- issue: Genauer Sinn von κατὰ Δαυεὶδ βασιλέα τοῦ Ἰσραήλ
  choice: nach dem Vorbild Davids, des Königs von Israel
  alternative: nach der Anordnung Davids, des Königs von Israel
  rationale: κατά drückt Übereinstimmung aus, lässt aber offen, ob eine formelle Anordnung oder eine überlieferte Art des Lobpreises gemeint ist. Der Haupttext vermeidet daher eine unnötige Festlegung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt feierlich, wird aber durch das Semikolon und einen finiten Folgesatz für heutige Leser übersichtlich. „Zimbeln“ ist im biblisch-kultischen Zusammenhang präzise und geläufig.
