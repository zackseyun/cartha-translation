translation_notes:
  register: Die wiederholte Listenformel bleibt vollständig erhalten. „Die Söhne von“ ist sachlich, würdig und für heutige Leser klar; sie kann im genealogischen Zusammenhang auch Familienangehörige beziehungsweise Nachkommen bezeichnen. Die seltenen Eigennamen werden quellennah und nach deutschen Transliterationserwartungen wiedergegeben.
