base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/034.yaml
  text: the sons of Hagia[a], the sons of Phacareth-sabeie, the sons of Sarothei, the sons of Meisaias, the sons of Gas, the sons of Addous, the sons of Soubas, the sons of Apherra, the sons of Barotheis, the sons of Saphag, the sons of Allon;
translation:
  language: de
  text: die Söhne von Hagia[a], die Söhne von Phakaret-Sabeie, die Söhne von Sarothei, die Söhne von Meisaias, die Söhne von Gas, die Söhne von Addus, die Söhne von Subas, die Söhne von Apherra, die Söhne von Barotheis, die Söhne von Saphag, die Söhne von Allon;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die hebräische Parallele in Nehemia 7,51 ist an dieser Stelle wesentlich kürzer: „die Söhne von Usa, die Söhne von Paseach, die Söhne von Besai“. 1 Esdras bietet eine erweiterte griechische Liste; deshalb folgt die Übersetzung den griechischen Namen, statt sie an den hebräischen Text anzugleichen.'
    reason: alternative_reading
lexical_decisions:
- source_word: υἱοὶ
  choice: die Söhne von
  rationale: In dieser genealogischen Liste bezeichnet die wiederkehrende Formel die Angehörigen beziehungsweise Nachkommen einer Familie. „Die Söhne von“ bewahrt die Struktur des Griechischen, bleibt aber in modernem Deutsch verständlich und vermeidet schwerfällige oder missverständliche Genitivformen der seltenen Namen.
- source_word: Ἁγιά
  choice: Hagia
  rationale: Der Eigenname wird nach der griechischen Form wiedergegeben; der anlautende Spiritus asper wird durch H kenntlich gemacht.
- source_word: Φακαρὲθ Σαβειή
  choice: Phakaret-Sabeie
  rationale: Die seltene, offenbar eng zusammengehörige Namensfolge wird konservativ aus dem Griechischen transliteriert. Der Bindestrich macht ihre enge Verbindung sichtbar, ohne ihre genaue semitische Herleitung festzulegen.
- source_word: Σαρωθεί
  choice: Sarothei
  rationale: Konservative Transliteration der griechischen Namensform; eine Angleichung an die wesentlich kürzere hebräische Parallele wird vermieden.
- source_word: Μεισαίας
  choice: Meisaias
  rationale: Der Eigenname wird unmittelbar nach seiner griechischen Form transliteriert.
- source_word: Γάς
  choice: Gas
  rationale: Die kurze griechische Namensform wird ohne unbelegte Normalisierung nach einer anderen Texttradition beibehalten.
- source_word: Ἀδδούς
  choice: Addus
  rationale: Die Verdoppelung des Delta bleibt erhalten; griechisches ου wird in deutscher Transliteration als u wiedergegeben.
- source_word: Σουβάς
  choice: Subas
  rationale: Der Eigenname wird direkt transliteriert; griechisches ου erscheint im Deutschen als u.
- source_word: Ἀφερρά
  choice: Apherra
  rationale: Konservative Transliteration mit ph für griechisches Phi und Beibehaltung des doppelten Rho.
- source_word: Βαρωθείς
  choice: Barotheis
  rationale: Die griechische Form einschließlich des Diphthongs ει wird nachvollziehbar wiedergegeben.
- source_word: Σαφάγ
  choice: Saphag
  rationale: Direkte, traditionelle Transliteration des griechischen Namens mit ph für Phi.
- source_word: Ἀλλών
  choice: Allon
  rationale: Der Eigenname wird in einer im Deutschen gut lesbaren Umschrift ohne Längenakzent wiedergegeben.
