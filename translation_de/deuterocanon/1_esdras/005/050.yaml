base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/050.yaml
  text: And they kept the Feast of Booths[a], as it is commanded in the law, and offered sacrifices day by day, as was fitting.
translation:
  language: de
  text: Und sie feierten das Laubhüttenfest[a], wie es im Gesetz geboten ist, und brachten Tag für Tag Opfer dar, wie es sich gehörte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: »Fest der Hütten«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠγάγοσαν
  choice: sie feierten
  rationale: ἄγω wird in Verbindung mit einem Fest idiomatisch im Sinn von »feiern« oder »begehen« gebraucht; »feierten« ist im modernen Deutschen natürlich.
- source_word: τὴν τῆς σκηνοπηγίας ἑορτήν
  choice: das Laubhüttenfest
  rationale: Die feste deutsche Bezeichnung ist zugleich allgemein verständlich und bewahrt das konkrete Bild der Hütten.
- source_word: ὡς ἐπιτέτακται
  choice: wie es … geboten ist
  rationale: Das Perfekt Passiv bezeichnet eine weiterhin geltende Anordnung; das deutsche Präsens gibt diesen fortdauernden Geltungsanspruch wieder.
- source_word: ἐν τῷ νόμῳ
  choice: im Gesetz
  rationale: Die Wendung verortet das Gebot im Gesetz; die Großschreibung entspricht dem deutschen Gebrauch für den bezeichneten religiösen Gesetzeskorpus.
- source_word: θυσίας
  choice: Opfer
  rationale: θυσία bezeichnet hier Opferhandlungen beziehungsweise Opfergaben; »Opfer darbringen« ist die direkte und idiomatische deutsche Wiedergabe.
- source_word: καθ’ ἡμέραν
  choice: Tag für Tag
  rationale: Die distributive Formulierung betont die tägliche Wiederholung stärker als das schlichtere »täglich«.
- source_word: ὡς προσῆκον ἦν
  choice: wie es sich gehörte
  rationale: Die Wendung bezeichnet das Angemessene oder Gebührende, ohne nochmals ausdrücklich eine gesetzliche Verpflichtung zu behaupten.
theological_decisions:
- issue: Bezeichnung des Festes σκηνοπηγία
  choice: Laubhüttenfest
  alternative: Fest der Hütten; Hüttenfest
  rationale: »Laubhüttenfest« ist die etablierte, transparente deutsche Bezeichnung. Eine Fußnote nennt die wörtlichere Alternative, ohne eine konfessionelle Sonderdeutung einzuführen.
- issue: Verhältnis von Gebot und Angemessenheit
  choice: »geboten ist« und »wie es sich gehörte« werden unterschieden
  alternative: Beide Wendungen als rechtliche Verpflichtung wiedergeben
  rationale: Der griechische Text verwendet zunächst ausdrückliche Gebotssprache, danach jedoch eine Wendung für das Gebührende; diese Spannung bleibt erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz folgt der griechischen Struktur, bleibt aber durch »feierten« und »brachten … dar« natürlich lesbar. Der Fußnotenmarker [a] steht unmittelbar beim Festnamen.
