base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/059.yaml
  text: And all the people sounded trumpets and shouted with a loud voice, praising the Lord because of the raising up of the house of the Lord.
translation:
  language: de
  text: Und das ganze Volk ließ die Trompeten erschallen und rief mit lauter Stimme, während es den Herrn wegen der Errichtung[a] des Hauses des Herrn pries.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wegen des Wiederaufbaus des Hauses des Herrn“. Das griechische Wort hat die Grundbedeutung „Aufrichtung“ und kann hier die Wiedererrichtung des Tempels bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς ὁ λαός
  choice: das ganze Volk
  rationale: Die kollektive Wendung bezeichnet die gesamte versammelte Gemeinschaft; „das ganze Volk“ bewahrt die Totalität und klingt im Deutschen natürlich.
- source_word: ἐσάλπισαν
  choice: ließ die Trompeten erschallen
  rationale: Das Verb bedeutet, Trompeten zu blasen beziehungsweise erschallen zu lassen. Die Formulierung ist idiomatisch, würdevoll und vermeidet das missverständliche „trompetete“.
- source_word: ἐβόησαν φωνῇ μεγάλῃ
  choice: rief mit lauter Stimme
  rationale: Die Wiedergabe erhält sowohl das Rufen als auch die ausdrückliche Angabe der lauten Stimme, ohne die Wendung zu übersteigern.
- source_word: ὑμνοῦντες
  choice: während es … pries
  rationale: Das begleitende Partizip bezeichnet Lobpreis, möglicherweise auch gesungenen Lobpreis, legt die musikalische Form aber nicht eindeutig fest. Der temporale Anschluss bildet die Gleichzeitigkeit natürlich ab.
- source_word: τῷ κυρίῳ
  choice: den Herrn
  rationale: κύριος bezeichnet hier im gottesdienstlichen Zusammenhang den Gott Israels und wird entsprechend der griechischen Vorlage mit „der Herr“ wiedergegeben.
- source_word: ἐπὶ τῇ ἐγέρσει
  choice: für die Errichtung
  rationale: ἐγέρσις bezeichnet wörtlich ein Aufrichten beziehungsweise Errichten. Im Zusammenhang kann der Ausdruck die Wiedererrichtung des Tempels meinen; „Errichtung“ wahrt das Bild und bleibt weiter als „Wiederaufbau“.
- source_word: τοῦ οἴκου Κυρίου
  choice: des Hauses des Herrn
  rationale: Die wörtliche biblische Wendung bewahrt die intertextuelle Bildsprache; gemeint ist der Tempel, doch „Tempel“ wäre bereits eine explizierende Deutung.
theological_decisions:
- issue: Wiedergabe von κύριος als Bezeichnung für den Gott Israels
  choice: der Herr
  alternative: der HERR
  rationale: Die unmittelbare Vorlage bietet κύριος und nicht den hebräischen Gottesnamen. „Der Herr“ folgt daher dem griechischen Text, ohne den Bezug auf Israels Gott zu verschleiern.
- issue: Bedeutung von ἐγέρσις beim Haus des Herrn
  choice: Errichtung
  alternative: Wiederaufbau
  rationale: Der Ausdruck kann das Aufrichten oder Errichten und im historischen Zusammenhang die Wiedererrichtung bezeichnen. Der Haupttext erhält die weitere Bedeutung; die kontextuell plausible engere Lesart steht in der Fußnote.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die traditionelle Wendung „Haus des Herrn“ bleibt erhalten; Satzbau und Wortwahl sind zugleich für heutige Leser unmittelbar verständlich.
