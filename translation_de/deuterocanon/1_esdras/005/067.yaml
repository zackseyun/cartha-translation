  terminology: »Oberhäupter der israelitischen Sippen« gibt οἱ ἡγούμενοι τῶν πατριῶν angemessen wieder. »Haus« wahrt τὸν οἶκον; die Fußnote erklärt zutreffend den Tempelbezug. »der Herr, unser Gott« folgt dem griechischen Κυρίῳ θεῷ ἡμῶν, ohne den hebräischen Gottesnamen typografisch vorwegzunehmen.
