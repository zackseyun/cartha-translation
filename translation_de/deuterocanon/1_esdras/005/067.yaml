  source_fidelity: 'Die Übersetzung gibt alle Bestandteile des griechischen Satzes wieder: die Sprechergruppe, die Anrede an »sie«, die auf die Adressaten beschränkte Verweigerung, das Bauen, »das Haus« und »den Herrn, unseren Gott«. Die Namensformen Serubbabel und Jeschua sind im Kontext sachgerecht. Die deutsche Pluralform »sagten« ist bei dem zusammengesetzten Subjekt idiomatisch, obwohl εἶπεν formal Singular ist.'
