base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/067.yaml
  text: Then Zerubbabel and Jeshua and the heads of the fathers’ houses of Israel said to them[b][a], “It is not for you to build the house for the Lord our God.”
translation:
  language: de
  text: 'Da sagten Serubbabel, Jeschua[a] und die Oberhäupter der israelitischen Sippen zu ihnen: »Euch steht es nicht zu, das Haus[b] für den Herrn, unseren Gott, zu bauen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Name lautet hier Iesous; gemeint ist der nachexilische Hohepriester Jeschua. Andere Namensform: Josua.'
    reason: lexical_alternative
  - marker: b
    text: 'Gemeint ist der Tempel; wörtlich: das Haus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν αὐτοῖς
  choice: sagten zu ihnen
  rationale: Die griechische Singularform steht bei einem zusammengesetzten Subjekt; im natürlichen Deutschen verlangt dieses den Plural. Die übliche Erzählformel wird direkt wiedergegeben.
- source_word: Ζοροβαβὲλ
  choice: Serubbabel
  rationale: Gebräuchliche deutsche Namensform des nachexilischen Statthalters; sie entspricht der biblischen Tradition besser als eine unmittelbare Umschrift des Griechischen.
- source_word: Ἰησοῦς
  choice: Jeschua
  rationale: Gemeint ist der nachexilische Hohepriester. »Jeschua« identifiziert ihn im deutschen Bibelkontext eindeutig und vermeidet das hier irreführende »Jesus«.
- source_word: οἱ ἡγούμενοι τῶν πατριῶν
  choice: die Oberhäupter der israelitischen Sippen
  rationale: ἡγούμενοι bezeichnet führende Personen, πατριαί die durch Abstammung bestimmten Großfamilien beziehungsweise Sippen. Die Formulierung ist verständlich und bewahrt die soziale Struktur des Ausdrucks.
- source_word: Οὐχ ὑμῖν
  choice: Es ist nicht an euch
  rationale: Die knappe griechische Ellipse wird idiomatisch ergänzt, ohne die ausführlichere Aussage des Parallelberichts einzutragen.
- source_word: τοῦ οἰκοδομῆσαι
  choice: zu bauen
  rationale: Der Infinitiv bezeichnet die den Angesprochenen abgesprochene Handlung. »Wieder aufzubauen« wäre kontextuell möglich, ist hier aber nicht ausdrücklich gesagt.
- source_word: τὸν οἶκον
  choice: das Haus
  rationale: Die wörtliche Wiedergabe bewahrt die biblische Bezeichnung des Tempels als Gottes Haus; die gemeinte Bedeutung wird in einer Fußnote genannt.
- source_word: Κυρίῳ θεῷ ἡμῶν
  choice: für den Herrn, unseren Gott
  rationale: Der Dativ bei οἰκοδομέω wird im Deutschen natürlich mit »für« wiedergegeben. Die Apposition mit Komma verdeutlicht, dass »der Herr« und »unser Gott« dieselbe Person bezeichnen.
theological_decisions:
- issue: Wiedergabe von κύριος im Zusammenhang mit dem Tempelbau und dem alttestamentlichen Gottesnamen
  choice: der Herr
  alternative: der HERR
  rationale: Der maßgebliche griechische Text bietet κύριος. »der Herr« folgt diesem Wortlaut; die typografische Form »der HERR« würde unmittelbar den hebräischen Gottesnamen markieren und damit die griechische Vorlage überpräzisieren.
- issue: Reichweite der Zurückweisung Οὐχ ὑμῖν
  choice: Es ist nicht an euch
  alternative: Ihr habt keinen Anteil daran
  rationale: Die gewählte Fassung bewahrt die knappe, auf das Bauen bezogene Zurückweisung. Die Alternative könnte eine umfassendere theologische oder gemeinschaftliche Ausgrenzung nahelegen, die in diesem griechischen Satz nicht ausdrücklich formuliert ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Sippen« vermittelt die abstammungsbezogenen πατριαί verständlicher als das heute missverständliche »Vaterhäuser«. Die Satzstellung bleibt nah am Griechischen, während Numerus und Zeichensetzung deutschem Sprachgebrauch folgen.
