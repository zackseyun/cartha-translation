  text: the sons of Baiterous[a], three thousand five; the sons of Ragethlomon, one hundred twenty-three;
translation:
  language: de
  text: Die Söhne des Baiterus[a], dreitausendfünf; die Söhne aus Ragethlomon, einhundertdreiundzwanzig;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechischen Namen und Zahlen dieses Verses weichen von der ungefähren hebräischen beziehungsweise masoretischen Parallelüberlieferung ab. Dort steht an dieser Stelle: »die Söhne Haschums, zweihundertdreiundzwanzig«. Der Haupttext folgt dem griechischen Text von 1 Esdras und gleicht ihn nicht an den masoretischen Text an.'
    reason: alternative_reading
lexical_decisions:
- source_word: υἱοὶ
  choice: die Söhne
  rationale: Die wörtliche Wiedergabe bewahrt die feste genealogische Listenformel; gemeint sind in diesem Zusammenhang Angehörige einer Familie oder Sippe.
- source_word: Βαιτηρούς
  choice: Baiterus
  rationale: Der Eigenname wird nach seiner griechischen Form deutsch transliteriert; griechisches ου wird dabei als „u“ wiedergegeben.
- source_word: τρισχίλιοι πέντε
  choice: dreitausendfünf
  rationale: Die ausgeschriebene Kardinalzahl gibt die knappe Zählweise der griechischen Liste ohne Zusatz wieder.
- source_word: ἐκ
  choice: aus
  rationale: Die Präposition ist im Griechischen ausdrücklich vorhanden und wird beibehalten, auch wenn die genaue Art der Gruppenzugehörigkeit offenbleibt.
- source_word: Ῥαγεθλωμῶν
  choice: Ragethlomon
  rationale: Der Name wird aus dem griechischen Hauptzeugen transliteriert und nicht an die abweichende hebräische Parallelüberlieferung angeglichen.
- source_word: ἑκατὸν εἴκοσι τρεῖς
  choice: einhundertdreiundzwanzig
  rationale: Die Kardinalzahl wird passend zum Listenstil ausgeschrieben und in natürlicher deutscher Zahlenbildung wiedergegeben.
theological_decisions:
- issue: Die griechischen Namen und Zahlen weichen an dieser Stelle von der ungefähren masoretischen Parallelüberlieferung ab.
  choice: Im Haupttext stehen Baiterus, Ragethlomon sowie die griechischen Zahlenangaben.
  alternative: Angleichung an „die Söhne Haschums, zweihundertdreiundzwanzig“ nach der masoretischen Parallelüberlieferung.
  rationale: Für 1 Esdras ist der griechische Text der primäre Quellzeuge. Eine Harmonisierung würde die echte textgeschichtliche Abweichung verdecken.
translation_notes:
  register: Knapper, würdiger Listenstil in modernem Standarddeutsch. Die formelhafte Wendung „die Söhne“ bleibt erhalten; „aus“ bildet das ausdrücklich gesetzte griechische ἐκ ab. Zahlen werden ausgeschrieben.
