translation_notes:
  register: Modernes, gut verständliches Standarddeutsch in würdigem Erzählstil. Die auffällige griechische Singularform bleibt im Haupttext sichtbar; die idiomatische Wendung „was es mit … auf sich hatte“ bewahrt die Offenheit der indirekten Frage.
