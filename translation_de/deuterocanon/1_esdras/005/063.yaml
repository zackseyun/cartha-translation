base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/063.yaml
  text: And when the enemies of the tribe of Judah and Benjamin heard[a], they came to find out what the sound of the trumpets was[b],
translation:
  language: de
  text: Als die Feinde des Stammes Juda und Benjamin[a] das hörten, kamen sie, um herauszufinden, was es mit dem Klang der Trompeten[b] auf sich hatte,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich steht im Griechischen der Singular „des Stammes“ bei „Juda und Benjamin“; sinngemäß kann auch „der Stämme Juda und Benjamin“ übersetzt werden.
    reason: alternative_reading
  - marker: b
    text: 'Wörtlicher: „mit der Stimme der Trompeten“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσαντες
  choice: als … das hörten
  rationale: Das Aoristpartizip bezeichnet den zeitlichen Umstand der Haupthandlung. Die finite Konstruktion mit „als“ ist im Deutschen natürlich; „das“ nimmt den aus dem Zusammenhang vorausgesetzten Gegenstand des Hörens auf.
- source_word: οἱ ἐχθροὶ
  choice: die Feinde
  rationale: Die substantivierte Bezeichnung meint Gegner; ein Possessivpronomen steht im Griechischen nicht und wird daher nicht ergänzt.
- source_word: τῆς φυλῆς Ἰούδα καὶ Βενιαμεὶν
  choice: des Stammes Juda und Benjamin
  rationale: φυλή steht im griechischen Leittext im Singular, obwohl zwei Namen folgen. Die Übersetzung bildet diese auffällige Form ab und erläutert die naheliegende deutsche Alternative in einer Fußnote.
- source_word: ἦλθοσαν
  choice: kamen sie
  rationale: Die schlichte Erzählform des Bewegungsverbs wird ohne zusätzliche Deutung wiedergegeben.
- source_word: ἐπιγνῶναι
  choice: um herauszufinden
  rationale: Der Infinitiv bezeichnet den Zweck ihres Kommens. „Herausfinden“ gibt in diesem Zusammenhang das beabsichtigte Erkennen oder Ermitteln idiomatisch wieder.
- source_word: τίς ἡ φωνὴ τῶν σαλπίγγων
  choice: was es mit dem Klang der Trompeten auf sich hatte
  rationale: Die deutsche Wendung gibt die indirekte Frage natürlich wieder, ohne festzulegen, ob die Gegner nur die Art beziehungsweise Ursache des Schalls oder auch seine Bedeutung ermitteln wollten. φωνή bezeichnet bei Instrumenten gewöhnlich den hörbaren Klang; σάλπιγγες sind hier Trompeten.
