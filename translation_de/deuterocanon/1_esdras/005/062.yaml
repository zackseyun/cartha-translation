base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/062.yaml
  text: so that the people could not hear the trumpets because of the weeping of the people[a]; for the crowd was sounding them loudly[b], so that it was heard from far away.
translation:
  language: de
  text: sodass das Volk wegen seines Weinens[a] die Trompeten[b] nicht hören konnte. Denn die Menge blies laut die Trompeten, sodass man ihren Klang aus der Ferne hören konnte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die hebräische Parallele in Esra 3,11 berichtet, dass das Volk den HERRN mit lautem Jubel pries. 1 Esdras stellt hier dagegen ausführlicher den Klang der Trompeten und das Weinen des Volkes in den Vordergrund.
    reason: cross_reference
  - marker: b
    text: 'Oder: „die Trompetenstöße“. Im Griechischen steht wörtlich „die Trompeten“; gemeint sein kann aber auch ihr Klang.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: sodass
  rationale: Leitet wie im Griechischen einen Folgesatz ein und klingt im modernen Deutschen natürlich.
- source_word: τὸν λαὸν μὴ ἀκούειν
  choice: das Volk … nicht hören konnte
  rationale: Die modale Formulierung gibt die durch den Lärm verursachte Unmöglichkeit des Hörens idiomatisch wieder.
- source_word: τῶν σαλπίγγων
  choice: die Trompeten
  rationale: Bleibt nahe am griechischen Instrumentenbegriff; gemeint sein können metonymisch auch die Trompetenstöße.
- source_word: διὰ τὸν κλαυθμὸν τοῦ λαοῦ
  choice: wegen seines lauten Weinens
  rationale: κλαυθμός bezeichnet hörbares Weinen. Das Possessivpronomen vermeidet im Deutschen eine schwerfällige Wiederholung von „Volk“; „laut“ verdeutlicht die akustische Funktion im Satz.
- source_word: ὁ γὰρ ὄχλος
  choice: Denn die Menge
  rationale: ὄχλος bezeichnet hier die versammelte Menschenmenge; „Denn“ bewahrt die begründende Funktion von γάρ.
- source_word: ἦν ὁ σαλπίζων μεγάλως
  choice: ließ sie laut erschallen
  rationale: Die Umschreibung verbindet das komprimierte griechische Partizip natürlich mit den zuvor genannten Trompeten, ohne die Menge ausdrücklich als einzelne Trompetenbläser darzustellen.
- source_word: ὥστε μακρόθεν ἀκούεσθαι
  choice: sodass man es noch aus der Ferne hören konnte
  rationale: Die unpersönliche deutsche Konstruktion entspricht dem griechischen Passiv. „es“ lässt den genauen Bezug auf den Trompetenklang beziehungsweise den gesamten Lärm offen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederaufnahme durch „sie“ hält den Zusammenhang mit den Trompeten klar; das abschließende „es“ bewahrt die leichte Unbestimmtheit des griechischen Passivs.
