base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/019.yaml
  text: those from Kartatheireios[a], twenty-five; those from Peiras and Berog, seven hundred.
translation:
  language: de
  text: 'Die aus Kartatheireios[a]: fünfundzwanzig; die aus Peiras und Berog: siebenhundert.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die hebräische Parallelüberlieferung weicht hier ab und lautet ungefähr: „die Männer von Netofa: sechsundfünfzig“. 1 Esdras scheint hier eine abweichende griechische Listenform zu bewahren.'
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ ἐκ
  choice: die aus
  rationale: Die elliptische Listenformel bezeichnet Personen, die aus einem Ort stammen. „Die aus“ bleibt knapp und fügt das im Griechischen nicht ausdrücklich stehende „Männer“ nicht hinzu.
- source_word: Καρταθειαρειός
  choice: Kartatheireios
  rationale: Der schwierige griechische Ortsname wird konservativ transliteriert, ohne ihn mit dem abweichenden hebräischen Paralleltext gleichzusetzen.
- source_word: εἴκοσι πέντε
  choice: fünfundzwanzig
  rationale: Eindeutige Kardinalzahl.
- source_word: Πείρας
  choice: Peiras
  rationale: Der Eigenname wird unmittelbar aus dem Griechischen transliteriert; eine spekulative Angleichung an andere Listen wird vermieden.
- source_word: Βηρόγ
  choice: Berog
  rationale: Der griechische Eigenname wird mit einfachem auslautendem „g“ wiedergegeben.
- source_word: ἑπτακόσιοι
  choice: siebenhundert
  rationale: Eindeutige Kardinalzahl.
theological_decisions:
- issue: Starke Abweichung zwischen der griechischen Liste und der hebräischen Parallelüberlieferung
  choice: Die griechischen Ortsnamen und Zahlen werden nach Swete übersetzt; die abweichende hebräische Lesart wird in einer Fußnote dokumentiert.
  alternative: 'Die hebräische Parallelüberlieferung lautet ungefähr: „die Männer von Netofa: sechsundfünfzig“.'
  rationale: Für 1 Esdras ist der griechische Text die primäre Quelle. Eine Harmonisierung würde die eigenständige griechische Listenform und ihre Zahlenangaben beseitigen; zugleich ist die erhebliche Abweichung textgeschichtlich relevant.
translation_notes:
  register: Knappes, würdiges Listenregister in modernem Standarddeutsch. Die Doppelpunkte machen die ergänzten Personenzahlen verständlich, ohne ein im Griechischen nicht ausdrücklich vorhandenes Substantiv einzufügen; die Eigennamen folgen konservativ der griechischen Form.
