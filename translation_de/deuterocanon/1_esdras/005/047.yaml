base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/047.yaml
  text: Then Jeshua son of Jozadak arose[a], along with his brothers the priests, and Zerubbabel son of Shealtiel and his brothers, and they prepared the altar of the God of Israel[b],
translation:
  language: de
  text: Da stand Jeschua[a], der Sohn Jozadaks, zusammen mit seinen Brüdern, den Priestern, sowie Serubbabel, dem Sohn Schealtiëls, und dessen Brüdern auf[b], und sie bereiteten den Altar des Gottes Israels vor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der griechische Name Ἰησοῦς bezeichnet hier Jeschua, die nachexilische priesterliche Gestalt, nicht Jesus von Nazaret. Die semitische Parallelüberlieferung stützt die Namensform Jeschua beziehungsweise Josua.
    reason: cross_reference
  - marker: b
    text: 'Auch möglich: „erhob sich“ oder „hatte sich erhoben“. Das griechische Partizip kennzeichnet den Beginn entschlossenen Handelns.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καταστὰς
  choice: trat … auf
  rationale: Das Aoristpartizip bezeichnet hier den Beginn entschlossenen Handelns. „Trat auf“ ist natürliches Deutsch und lässt zugleich die möglichen Nuancen „stand auf“ und „nahm seine Stellung ein“ offen.
- source_word: Ἰησοῦς
  choice: Jeschua
  rationale: Gemeint ist die nachexilische priesterliche Gestalt Jeschua, nicht Jesus von Nazaret. Die Namensform entspricht dem semitischen Hintergrund und dem deutschsprachigen biblischen Gebrauch in diesem Zusammenhang.
- source_word: ὁ τοῦ Ἰωσεδὲκ
  choice: der Sohn Jozadaks
  rationale: Der Genitiv bezeichnet das Vatersverhältnis; die idiomatische deutsche Wiedergabe lautet „Sohn Jozadaks“.
- source_word: οἱ ἀδελφοὶ αὐτοῦ οἱ ἱερεῖς
  choice: seine Brüder, die Priester
  rationale: Die Apposition des Griechischen bleibt sichtbar und ἀδελφοί wird ohne unnötige Verallgemeinerung wörtlich als „Brüder“ wiedergegeben.
- source_word: Ζοροβαβὲλ
  choice: Serubbabel
  rationale: Dies ist die gebräuchliche deutsche biblische Namensform.
- source_word: ὁ τοῦ Σαλαθιὴλ
  choice: dem Sohn Schealtiëls
  rationale: Das Patronym wird idiomatisch wiedergegeben; „Schealtiël“ folgt der geläufigen semitisch geprägten deutschen Namensform.
- source_word: οἱ τούτου ἀδελφοὶ
  choice: dessen Brüder
  rationale: „Dessen“ macht eindeutig, dass diese Brüder zu Serubbabel gehören, und bewahrt den Bezug des griechischen Demonstrativpronomens.
- source_word: ἡτοίμασαν
  choice: machten … bereit
  rationale: Die Formulierung gibt „vorbereiten, bereitmachen“ direkt wieder, ohne wie „errichteten“ einen baulichen Vorgang festzulegen.
- source_word: τὸ θυσιαστήριον τοῦ θεοῦ Ἰσραήλ
  choice: den Altar des Gottes Israels
  rationale: „Altar“ ist die übliche Wiedergabe von θυσιαστήριον; der Genitiv bezeichnet Zugehörigkeit beziehungsweise Widmung und bleibt als „des Gottes Israels“ erhalten.
theological_decisions:
- issue: Identität der mit Ἰησοῦς bezeichneten Person
  choice: Jeschua
  alternative: Jesus / Josua
  rationale: Der priesterliche, nachexilische Kontext und das Patronym Jozadak weisen auf Jeschua hin. So wird eine Verwechslung mit Jesus von Nazaret vermieden, ohne eine theologische Deutung hinzuzufügen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die koordinierte Satzstruktur des Griechischen bleibt erkennbar, wird aber durch „zusammen mit“ und „sowie“ lesbar gegliedert. „Machten … bereit“ vermeidet die im Griechischen nicht ausdrücklich enthaltene Festlegung auf eine Neuerrichtung des Altars.
