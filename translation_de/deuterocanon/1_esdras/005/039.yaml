base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/039.yaml
  text: and he was called by his name[a]. And from these[b], those who were searched for in the genealogical record in the enrollment, and were not found, were excluded from serving as priests.
translation:
  language: de
  text: Und er wurde nach seinem Namen benannt[a]. Unter diesen[b] suchte man bei der Eintragung im genealogischen Register nach ihnen; da ihr Eintrag nicht gefunden wurde, wurden sie vom Priesterdienst ausgeschlossen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »wurde mit seinem Namen bezeichnet«. Die griechische Wendung ist knapp; worauf sich »seinem« unmittelbar bezieht, ist allein aus diesem Vers nicht völlig eindeutig.'
    reason: lexical_alternative
  - marker: b
    text: Ihr genealogischer Nachweis ließ sich im amtlichen Register nicht bestätigen; deshalb durften sie keinen Priesterdienst ausüben.
    reason: cultural_note
lexical_decisions:
- source_word: ἐκλήθη ἐπὶ τῷ ὀνόματι αὐτοῦ
  choice: wurde nach seinem Namen genannt
  rationale: Die Wendung bezeichnet hier am ehesten eine Benennung oder Identifikation durch einen Namen. Die knappe Formulierung lässt den unmittelbaren Bezug von αὐτοῦ offen; die Übersetzung erweitert ihn daher nicht.
- source_word: τούτων
  choice: unter diesen
  rationale: Im Zusammenhang führt der Genitiv eine Teilgruppe innerhalb der zuvor Genannten ein. „Unter diesen“ ist im Deutschen natürlicher als das formal nähere, aber missverständliche „von diesen“.
- source_word: ἐζητήθησαν
  choice: suchte man … nach ihnen
  rationale: Die unpersönliche deutsche Aktivkonstruktion gibt den griechischen Passivvorgang wieder, ohne die genannten Personen selbst zu Suchenden zu machen.
- source_word: τῆς γενικῆς γραφῆς
  choice: im Geschlechtsregister
  rationale: Die Wendung bezeichnet den schriftlichen genealogischen Nachweis, der für die priesterliche Zulassung geprüft wurde.
- source_word: ἐν τῷ καταλοχισμῷ
  choice: bei der Erfassung
  rationale: Gemeint ist die administrative Aufnahme beziehungsweise Eintragung in eine Liste. „Erfassung“ ist verständlich und vermeidet einen unnötig militärischen Beiklang.
- source_word: μὴ εὑρεθείσης
  choice: da ihr Eintrag nicht gefunden wurde
  rationale: Das feminine Singularpartizip bezieht sich grammatisch auf γραφή. „Ihr Eintrag“ verdeutlicht im Deutschen knapp den fehlenden genealogischen Beleg, ohne eine endgültige Aussage über ihre tatsächliche Abstammung zu machen.
- source_word: ἐχωρίσθησαν τοῦ ἱερατεύειν
  choice: wurden sie vom Priesterdienst ausgeschlossen
  rationale: Die Formulierung beschreibt die praktische Ausschließung von der Ausübung priesterlicher Aufgaben und nicht notwendig eine absolute theologische Aussage über ihren Status.
theological_decisions:
- issue: Art des Ausschlusses vom priesterlichen Dienst
  choice: Ausschluss vom Priesterdienst wegen des nicht auffindbaren genealogischen Nachweises
  alternative: endgültiger Ausschluss aus der Priesterschaft als solcher
  rationale: Der Text schildert ein administratives Ergebnis der fehlenden urkundlichen Bestätigung. Er sagt weder ausdrücklich, dass ihre Abstammung widerlegt war, noch, dass der Ausschluss unter allen Umständen endgültig blieb.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die erste Klausel bleibt bewusst knapp. Im zweiten Satz wahrt die unpersönliche Konstruktion den passiven Sinn von ἐζητήθησαν, während „ihr Eintrag“ den grammatischen Bezug des singularischen μὴ εὑρεθείσης verständlich macht.
