  source_fidelity: Der Entwurf gibt die passive Verfahrenssprache von ἐζητήθησαν sowie den Ausschluss vom Ausüben des Priesterdienstes zutreffend wieder. Die Singularform von μὴ εὑρεθείσης bezieht sich auf die γραφή, also den genealogischen Nachweis bzw. Registereintrag; dies sollte im deutschen Text etwas unmittelbarer erkennbar sein.
  naturalness: „wurde nach seinem Namen genannt“ ist im heutigen Standarddeutsch unnötig schwerfällig und klingt semantisch irritierend. „wurde nach seinem Namen benannt“ ist die idiomatischere knappe Entsprechung. „bei der Erfassung im Geschlechtsregister“ lässt zudem die Beziehung von Register und Eintragung weniger klar erkennen als eine Formulierung mit „Eintragung im genealogischen Register“.
  terminology: „Genealogisches Register“ ist im modernen Standarddeutsch klarer als „Geschlechtsregister“, dessen heutiger Gebrauch missverständlich sein kann. „Priesterdienst“ bewahrt die handlungsbezogene Bedeutung von τοῦ ἱερατεύειν.
