base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/069.yaml
  text: But the nations of the land, joining themselves to those in Judea and besieging them, hindered the building of the house.
translation:
  language: de
  text: Doch die Völker des Landes bedrängten[a] die Menschen in Judäa, belagerten sie und hinderten sie am Bauen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das zugrunde liegende griechische Wort ist ungewöhnlich und schwer zu deuten. Es kann auch bedeuten, dass sie sich den Menschen in Judäa anschlossen, sich unter ihnen niederließen oder gegen sie andrängten; der folgende Ausdruck „belagerten sie“ zeigt den feindlichen Zusammenhang.
    reason: lexical_alternative
  - marker: b
    text: Wörtlich steht im Griechischen nur „zu bauen“; dass es um den Tempel beziehungsweise das Haus Gottes geht, ergibt sich aus dem Zusammenhang.
    reason: cross_reference
lexical_decisions:
- source_word: τὰ ... ἔθνη τῆς γῆς
  choice: die Völker des Landes
  rationale: Bewahrt den pluralischen ethnisch-politischen Sinn von ἔθνη, ohne den neutestamentlich geprägten Ausdruck „Heiden“ einzutragen.
- source_word: ἐπικοιμώμενα
  choice: bedrängten
  rationale: Das seltene und schwierige Partizip kann ein Sich-Anschließen, Sich-Niederlassen bei oder feindliches Andrängen bezeichnen. Im Zusammenhang mit πολιορκοῦντες gibt „bedrängten“ die feindliche Stoßrichtung natürlich wieder, ohne die lexikalische Unsicherheit zu verschweigen.
- source_word: τοῖς ἐν τῇ Ἰουδαίᾳ
  choice: die Menschen in Judäa
  rationale: Die substantivierte Wendung bleibt allgemein; „die Menschen in Judäa“ ist im Deutschen verständlicher als das knappe „die in Judäa“ und vermeidet eine engere Bestimmung.
- source_word: πολιορκοῦντες
  choice: belagerten sie
  rationale: Gibt die militärische Grundbedeutung von πολιορκέω unmittelbar wieder und wahrt die Stärke des griechischen Ausdrucks.
- source_word: εἶργον
  choice: hinderten sie
  rationale: Der Imperfekt bezeichnet fortdauernde Behinderung. „Hinderten“ behauptet nicht zwingend, dass das Vorhaben vollständig vereitelt wurde.
- source_word: τοῦ οἰκοδομεῖν
  choice: am Bauen
  rationale: Der griechische Text nennt kein ausdrückliches Objekt. „Am Bauen“ bewahrt diese Offenheit; der Tempelbau ergibt sich aus dem Erzählzusammenhang.
theological_decisions:
- issue: Unausgesprochenes Objekt des Bauens
  choice: am Bauen
  alternative: am Bau des Hauses
  rationale: Obwohl der Zusammenhang den Tempelbau meint, steht im griechischen Satz nur „zu bauen“. Die Übersetzung ergänzt daher kein ausdrücklich ungenanntes Objekt und bewahrt die formale Offenheit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nah am Griechischen, wird aber durch finite Verben natürlich lesbar gemacht. Die schwierige Bedeutung von ἐπικοιμώμενα und das fehlende Objekt zu οἰκοδομεῖν werden in Fußnoten transparent gehalten.
