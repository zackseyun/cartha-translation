base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/001.yaml
  text: After these things[a], the heads of ancestral houses, according to their tribes, were chosen to go up, along with their wives and their sons and daughters, and their male servants and female servants, and their livestock.
translation:
  language: de
  text: Nach diesen Ereignissen wurden die Oberhäupter der Vaterhäuser, nach ihren Stämmen geordnet, ausgewählt, hinaufzuziehen – zusammen mit ihren Frauen, ihren Söhnen und Töchtern, ihren Dienern und Dienerinnen[a] sowie ihrem Vieh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihren Sklaven und Sklavinnen“. Die griechischen Bezeichnungen können sowohl Dienende als auch versklavte Menschen meinen; aus diesem Vers allein lässt sich ihr rechtlicher Status nicht eindeutig bestimmen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ ταῦτα
  choice: Nach diesen Ereignissen
  rationale: Gibt den zeitlichen Übergang und den pluralischen Rückverweis natürlich wieder.
- source_word: ἐξελέγησαν
  choice: wurden ... ausgewählt
  rationale: Entspricht dem Passiv von ἐκλέγω, ohne eine förmliche Amtsbestellung vorauszusetzen.
- source_word: ἀναβῆναι
  choice: hinaufzuziehen
  rationale: Bewahrt die biblische Vorstellung des Hinaufziehens, ohne ein im Vers nicht ausdrücklich genanntes Ziel einzufügen.
- source_word: ἀρχηγοὶ οἴκου πατριῶν
  choice: die Oberhäupter der Vaterhäuser
  rationale: Bezeichnet die leitenden Personen der väterlich beziehungsweise genealogisch bestimmten Großfamilien; „Vaterhäuser“ ist im biblischen Zusammenhang präzise und verständlich.
- source_word: κατὰ φυλὰς αὐτῶν
  choice: nach ihren Stämmen geordnet
  rationale: Macht den distributiven beziehungsweise organisatorischen Sinn von κατά deutlich.
- source_word: αἱ γυναῖκες αὐτῶν
  choice: ihre Frauen
  rationale: Im Zusammenhang der aufgezählten Haushaltsangehörigen sind die Ehefrauen gemeint; „Frauen“ ist im Deutschen dafür natürlich.
- source_word: οἱ υἱοὶ καὶ αἱ θυγατέρες
  choice: ihre Söhne und Töchter
  rationale: Bewahrt die ausdrückliche Nennung beider Gruppen.
- source_word: οἱ παῖδες αὐτῶν
  choice: ihre Diener
  rationale: Da Söhne und Töchter bereits genannt sind, bezeichnet παῖδες hier wahrscheinlich männliche Angehörige des dienenden Hausstands; die Rechtsstellung bleibt im Haupttext offen.
- source_word: αἱ παιδίσκαι
  choice: Dienerinnen
  rationale: Gibt die feminine Entsprechung zu παῖδες wieder, ohne den möglichen Sklavenstatus als sicher festzulegen.
- source_word: τὰ κτήνη αὐτῶν
  choice: ihr Vieh
  rationale: κτήνη bezeichnet hier im Rahmen des ziehenden Hausstands am ehesten Nutz- und Lasttiere.
