base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/041.yaml
  text: 'All these were Israelites[a], from twelve years old and upward, apart from male and female servants: forty-two thousand three hundred sixty. Their male and female servants were seven thousand three hundred thirty-seven[b]; and the singers and songstresses were two hundred forty-five.'
translation:
  language: de
  text: 'Sie alle waren Israeliten[a] im Alter von zwölf Jahren an, ihre männlichen und weiblichen Bediensteten[b] nicht mitgerechnet: zweiundvierzigtausenddreihundertsechzig. Die Zahl ihrer männlichen und weiblichen Bediensteten betrug siebentausenddreihundertsiebenunddreißig; Sänger und Sängerinnen: zweihundertfünfundvierzig.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Sie alle waren Israel“.'
    reason: Die griechische Formulierung verwendet den korporativen Namen „Israel“ als Prädikatsnomen; der Haupttext gibt sie im Deutschen idiomatisch wieder.
  - marker: b
    text: 'Oder: „Sklaven und Sklavinnen“; die griechischen Wörter können auch Jungen und Mädchen bezeichnen. Hier spricht die gesonderte Zählung für Personen in abhängiger häuslicher Stellung.'
    reason: Die griechischen Bezeichnungen παῖδες und παιδίσκαι sind hinsichtlich Alter und sozialem beziehungsweise rechtlichem Status mehrdeutig.
lexical_decisions:
- source_word: Οἱ δὲ πάντες
  choice: Sie alle
  rationale: Die Wendung fasst die zuvor aufgezählten Rückkehrer zusammen. Das schwach weiterführende δέ muss im Deutschen nicht eigens wiedergegeben werden.
- source_word: ἦσαν Ἰσραήλ
  choice: waren Israeliten
  rationale: Das griechische Prädikatsnomen lautet wörtlich „Israel“, bezeichnet hier aber idiomatisch die Zugehörigkeit des gezählten Volkes zu Israel. Die wörtliche Form bleibt in einer Fußnote sichtbar.
- source_word: ἀπὸ δωδεκαετοῦς
  choice: im Alter von zwölf Jahren an
  rationale: Die Formulierung bezeichnet eine einschließlich verstandene Altersuntergrenze für die Zählung.
- source_word: χωρὶς παίδων καὶ παιδισκῶν
  choice: ihre männlichen und weiblichen Bediensteten nicht mitgerechnet
  rationale: παῖδες und παιδίσκαι können Kinder, Dienende oder versklavte Personen bezeichnen. Die gesonderte anschließende Zahl spricht hier für abhängige Hausangehörige beziehungsweise Bedienstete; das Besitzverhältnis wird durch das folgende τούτων bestätigt.
- source_word: μυριάδες τέσσαρες δισχίλιοι τριακόσιοι ἑξήκοντα
  choice: zweiundvierzigtausenddreihundertsechzig
  rationale: Direkte Wiedergabe der Gesamtzahl 42.360.
- source_word: παῖδες τούτων καὶ παιδίσκαι
  choice: Ihre männlichen und weiblichen Bediensteten
  rationale: τούτων bezeichnet die Zugehörigkeit zu den zuvor Gezählten; die geschlechtliche Unterscheidung der beiden griechischen Begriffe wird bewahrt.
- source_word: ἑπτακισχίλιοι τριακόσιοι τριάκοντα ἑπτά
  choice: siebentausenddreihundertsiebenunddreißig
  rationale: Direkte Wiedergabe der Zahl 7.337.
- source_word: ψάλται καὶ ψαλτῳδοί
  choice: Sänger und Sängerinnen
  rationale: Die beiden griechischen Bezeichnungen unterscheiden männliche und weibliche Singende; das Deutsche kann diese Unterscheidung natürlich wiedergeben.
- source_word: διακόσιοι τεσσεράκοντα πέντε
  choice: zweihundertfünfundvierzig
  rationale: Direkte Wiedergabe der Zahl 245.
theological_decisions:
- issue: Korporative Identitätsformel ἦσαν Ἰσραήλ
  choice: waren Israeliten
  alternative: waren Israel
  rationale: „Israeliten“ ist im Deutschen die natürliche Personenbezeichnung und wahrt die ethnische beziehungsweise bundesbezogene Zugehörigkeit. Die wörtliche korporative Form „Israel“ wird in der Fußnote offengelegt, statt stillschweigend zu verschwinden.
- issue: Sozialer Status bei παῖδες und παιδίσκαι
  choice: männliche und weibliche Bedienstete
  alternative: Sklaven und Sklavinnen; Jungen und Mädchen
  rationale: Der Zählungskontext und die gesonderte Gesamtzahl legen Personen in abhängiger häuslicher Stellung nahe. „Bedienstete“ legt den genauen Rechtsstatus nicht fest; die mögliche Bedeutung „Sklaven und Sklavinnen“ wird ausdrücklich vermerkt. Die Lesart „Jungen und Mädchen“ ist lexikalisch möglich, im Kontext aber weniger wahrscheinlich.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Zahlen sind ausgeschrieben. „Dazu kamen“ verbindet den abschließenden, syntaktisch knappen Zählposten natürlich mit dem Vorhergehenden, ohne eine sachliche Beziehung über die Addition hinaus einzutragen.
