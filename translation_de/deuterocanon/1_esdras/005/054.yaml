base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/054.yaml
  text: And in the second year[a], when they had come to the house of God in Jerusalem, in the second month, Zerubbabel son of Shealtiel and Jeshua son of Jozadak began, along with their brothers, the priests, the Levites, and all who had come from the captivity to Jerusalem[b],
translation:
  language: de
  text: Im zweiten Jahr, nachdem sie zum Tempel Gottes[a] in Jerusalem gekommen waren, begannen im zweiten Monat Serubbabel, der Sohn Schealtiëls, und Jeschua, der Sohn Jozadaks, ihre Brüder, die Priester, die Leviten und alle, die aus der Gefangenschaft nach Jerusalem gekommen waren[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Heiligtum Gottes“. Das griechische Wort kann auch den gesamten heiligen Tempelbereich bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Sinngemäß auch: „die aus dem Exil zurückgekehrt waren“. Wörtlicher steht im Griechischen „aus der Gefangenschaft“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τῷ δευτέρῳ ἔτει
  choice: Im zweiten Jahr
  rationale: Der temporale Dativ wird im Deutschen natürlich und quellennah wiedergegeben.
- source_word: παραγενόμενοι
  choice: nachdem sie ... gekommen waren
  rationale: Das Partizip bezeichnet eine dem Beginn vorausgehende Ankunft; der deutsche Nebensatz macht diese zeitliche Beziehung klar.
- source_word: τὸ ἱερὸν τοῦ θεοῦ
  choice: zum Tempel Gottes
  rationale: ἱερόν bezeichnet hier im Zusammenhang der Wiederherstellung den Tempel beziehungsweise den heiligen Tempelbereich. „Tempel Gottes“ ist im modernen Deutsch klar, ohne den Ausdruck unnötig auf ein einzelnes Gebäude einzuengen.
- source_word: μηνὸς δευτέρου
  choice: im zweiten Monat
  rationale: Natürliche Wiedergabe des temporalen Genitivs.
- source_word: Ζοροβαβὲλ ὁ τοῦ Σαλαθιήλ
  choice: Serubbabel, der Sohn Schealtiëls
  rationale: Verwendet die im Deutschen geläufigen biblischen Namensformen und löst das griechische Patronym aus.
- source_word: Ἰησοῦς ὁ τοῦ Ἰωσεδέκ
  choice: Jeschua, der Sohn Jozadaks
  rationale: Die nachexilische Namensform „Jeschua“ identifiziert die Gestalt im Esra-Kontext klar und vermeidet eine sachlich irreführende Gleichsetzung der Namensform mit dem neutestamentlichen Jesus.
- source_word: οἱ ἀδελφοὶ αὐτῶν
  choice: ihren Brüdern
  rationale: Bewahrt die konkrete maskuline Verwandtschafts- beziehungsweise Gemeinschaftsbezeichnung des griechischen Textes.
- source_word: οἱ ἱερεῖς οἱ Λευεῖται
  choice: den Priestern, den Leviten
  rationale: Gibt die beiden im griechischen Wortlaut nebeneinandergestellten Gruppen getrennt wieder und vermeidet die Festlegung auf den zusammengesetzten Titel „levitische Priester“.
- source_word: πάντες οἱ παραγενόμενοι ἐκ τῆς αἰχμαλωσίας
  choice: allen, die aus der Gefangenschaft ... gekommen waren
  rationale: „Gefangenschaft“ bewahrt die konkrete Bedeutung von αἰχμαλωσία; der Relativsatz ist im Deutschen flüssig und erhält den vollendeten Aspekt der Ankunft.
theological_decisions:
- issue: Bezeichnung des heiligen Ortes mit τὸ ἱερὸν τοῦ θεοῦ
  choice: Tempel Gottes
  alternative: Heiligtum Gottes; Tempelbezirk Gottes
  rationale: „Tempel“ ist die verständlichste deutsche Bezeichnung, während die Fußnote die mögliche breitere Bedeutung des griechischen Ausdrucks offenhält.
- issue: Verhältnis von Priestern und Leviten in οἱ ἱερεῖς οἱ Λευεῖται
  choice: die Priester, die Leviten
  alternative: die levitischen Priester
  rationale: Die Übersetzung erhält die formale Mehrdeutigkeit der griechischen Reihung und legt nicht fest, dass nur eine einzige zusammengesetzte Gruppe gemeint ist.
- issue: Bedeutung von ἀδελφοί
  choice: Brüder
  alternative: Verwandte; Volksgenossen
  rationale: Die konkrete familiäre beziehungsweise gemeinschaftliche Ausdrucksweise des Ausgangstextes wird beibehalten, ohne sie konfessionell oder sozial näher zu bestimmen.
translation_notes:
  register: Moderne, würdige Standardsprache. Die ungewöhnlich lange Satzperiode und das abschließende Komma bleiben erhalten, weil der Gedanke im folgenden Vers fortgesetzt wird. Die Eigennamen folgen geläufigen deutschen Bibelformen.
