base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/060.yaml
  text: And from the priests[a], the Levites, and the heads of their ancestral houses came the elders who had seen the former house, and at the building of this one they cried out with a loud cry and great weeping[b],
translation:
  language: de
  text: Und von den Priestern, den Leviten und den Vorstehern ihrer Sippen kamen die Ältesten, die das frühere Haus[a] noch gesehen hatten. Als dieses Haus errichtet wurde, brachen sie in Geschrei und heftiges Weinen aus,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit dem „früheren Haus“ ist der frühere Tempel gemeint; „dieses Haus“ bezeichnet den Tempel, der nun errichtet wurde.
    reason: cultural_note
lexical_decisions:
- source_word: προκαθημένων
  choice: Vorstehern
  rationale: Das substantivierte Partizip bezeichnet Personen, die einer Gruppe vorstehen. „Vorsteher“ gibt diese leitende Stellung präziser wieder als das allgemeinere „Führer“.
- source_word: κατὰ τὰς πατριὰς αὐτῶν
  choice: ihrer Sippen
  rationale: πατριά bezeichnet eine durch väterliche Abstammung bestimmte Großfamilie oder Sippe. Die knappe deutsche Formulierung ist verständlich und bewahrt die genealogische Gliederung.
- source_word: οἱ πρεσβύτεροι
  choice: die Ältesten
  rationale: „Älteste“ lässt sowohl das hohe Alter der Männer als auch ihre angesehene Stellung in der Gemeinschaft anklingen, ohne sich auf ein förmliches Amt festzulegen.
- source_word: ἑωρακότες
  choice: die … noch gesehen hatten
  rationale: Das Perfektpartizip verweist auf eine frühere eigene Anschauung, die für ihre gegenwärtige Reaktion bedeutsam bleibt; „noch“ unterstreicht verständlich, dass sie Augenzeugen des früheren Hauses gewesen waren.
- source_word: τὸν πρὸ τοῦ οἶκον
  choice: das frühere Haus
  rationale: Die Wiedergabe bewahrt die griechische Tempelbezeichnung „Haus“ und macht zugleich den zeitlichen Gegensatz zum gegenwärtigen Bau deutlich.
- source_word: πρὸς τὴν τούτου οἰκοδομήν
  choice: Als dieses Haus errichtet wurde
  rationale: Die griechische Wendung ist gedrängt und verbindet ihre Reaktion mit der Errichtung des jetzigen Hauses. Der temporale deutsche Nebensatz gibt diesen Zusammenhang natürlich wieder.
- source_word: μετὰ κραυγῆς καὶ κλαυθμοῦ μεγάλου
  choice: brachen sie in lautes Schreien und heftiges Weinen aus
  rationale: Im Griechischen werden sowohl der hörbare Aufschrei als auch das Weinen ausdrücklich genannt. Die verbale Fassung macht den gedrängten Satz im Deutschen verständlich und erhält seine emotionale Intensität.
theological_decisions:
- issue: Bezeichnung des Heiligtums als οἶκος
  choice: Haus
  alternative: Tempel
  rationale: „Haus“ bewahrt die bildhafte und theologisch offene Ausdrucksweise des griechischen Textes; eine Fußnote erklärt den konkreten Bezug auf den Tempel.
- issue: Art der Reaktion der Ältesten
  choice: lautes Schreien und heftiges Weinen ohne eindeutige Deutung des Gefühls
  alternative: Trauerklage über den geringeren neuen Tempel
  rationale: Der Vers nennt Aufschrei und Weinen, erklärt hier aber nicht abschließend, ob darin ausschließlich Trauer oder eine gemischte öffentliche Reaktion zum Ausdruck kommt. Die Übersetzung löst diese Spannung nicht auf.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzgliederung in zwei Sätze löst die stark gedrängte griechische Konstruktion, ohne ihren Inhalt zu verkürzen. Das abschließende Komma bleibt stehen, weil der Vers syntaktisch in den folgenden Vers weiterführt.
