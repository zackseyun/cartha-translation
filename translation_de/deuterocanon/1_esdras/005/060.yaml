  to: Und von den Priestern, den Leviten und den Vorstehern ihrer Sippen kamen die Ältesten, die das frühere Haus[a] noch gesehen hatten. Als dieses Haus errichtet wurde, brachen sie in Geschrei und heftiges Weinen aus,
