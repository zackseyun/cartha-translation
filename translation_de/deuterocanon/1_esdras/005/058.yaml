base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/058.yaml
  text: And they cried out with hymns[a], blessing the Lord, because his goodness and his glory are forever for all Israel.
translation:
  language: de
  text: Und sie erhoben ihre Stimme mit Lobgesängen und segneten den Herrn, denn seine Güte und Herrlichkeit gelten ganz Israel für immer.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher und der knappen griechischen Form entsprechend auch: „Denn seine Güte und seine Herrlichkeit sind in Ewigkeit für ganz Israel.“ Die griechische Schlussklausel enthält kein ausdrückliches Verb; auch die Beziehung von „ganz Israel“ zur Aussage ist syntaktisch gedrängt.'
    reason: Die knappe, elliptische griechische Schlussklausel lässt unterschiedliche idiomatische deutsche Auflösungen zu.
lexical_decisions:
- source_word: ἐφώνησαν
  choice: sie erhoben ihre Stimme
  rationale: Die Wendung gibt das laute, öffentliche Ertönen der Stimme wieder, ohne bereits festzulegen, ob gerufen oder gesungen wurde.
- source_word: δι’ ὕμνων
  choice: mit Lobgesängen
  rationale: διά mit Genitiv bezeichnet hier das Mittel; „mit Lobgesängen“ ist im Deutschen natürlich und bewahrt den gottesdienstlichen Zusammenhang.
- source_word: εὐλογοῦντες
  choice: und segneten
  rationale: „Segneten“ entspricht dem Partizip εὐλογοῦντες eng und bewahrt die biblische Redeweise vom Segnen Gottes; die Beiordnung ergibt einen flüssigen deutschen Satz.
- source_word: τῷ κυρίῳ
  choice: den Herrn
  rationale: κύριος wird in diesem griechischen Text quellengetreu als „der Herr“ wiedergegeben.
- source_word: χρηστότης
  choice: Güte
  rationale: „Güte“ umfasst die wohltätige und freundliche Zuwendung des Herrn und entspricht dem breiten Sinn von χρηστότης.
- source_word: δόξα
  choice: Herrlichkeit
  rationale: „Herrlichkeit“ ist die etablierte und kontextgerechte Wiedergabe von δόξα in einer liturgischen Lobformel.
- source_word: εἰς τοὺς αἰῶνας
  choice: in Ewigkeit
  rationale: Die idiomatische Wendung bezeichnet unbegrenzte Dauer; „in Ewigkeit“ bewahrt zugleich den feierlichen Ton.
- source_word: παντὶ Ἰσραήλ
  choice: für ganz Israel
  rationale: Der Dativ ist in der verkürzten griechischen Formel nicht eindeutig. „Für ganz Israel“ gibt die Beziehung zu dem gesamten Volk natürlich wieder, ohne eine räumliche Vorstellung aufzudrängen.
theological_decisions:
- issue: Wiedergabe von κύριος im griechischen deuterokanonischen Text
  choice: der Herr
  alternative: der HERR
  rationale: Da die unmittelbare Quelle κύριος und nicht den hebräischen Gottesnamen bietet, bleibt „der Herr“ die quellennahe, konfessionell unaufgeladene Wiedergabe.
- issue: Ergänzung eines Verbs in der elliptischen Schlussklausel
  choice: bleiben für ganz Israel in Ewigkeit
  alternative: sind für ganz Israel in Ewigkeit
  rationale: Im Griechischen fehlt ein ausdrückliches Verb. „Bleiben“ macht die durative Bedeutung im natürlichen Deutschen verständlich, ohne die Aussage auf eine bestimmte dogmatische Deutung festzulegen; die Ellipse und eine formal engere Alternative werden in der Fußnote kenntlich gemacht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst biblischem „den Herrn segnen“. Die Satzstruktur bleibt liturgisch, ist aber für heutige Leser verständlich.
