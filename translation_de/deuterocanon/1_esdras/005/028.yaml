  text: the gatekeepers[a], four hundred; the sons of Ishmael, sons of Lakubath[b], one thousand.
translation:
  language: de
  text: Die Torwächter, vierhundert; die Nachkommen Ismaels, Söhne Lakubats[a], tausend.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die anschließende griechische Namensfolge lautet: „die Nachkommen Ismaels, Söhne Lakubats, tausend“. Die hebräische Parallele in Nehemia 7 stimmt an dieser Stelle nicht damit überein. Daher folgt die Übersetzung dem griechischen Text, ohne ihn an die masoretische Liste anzugleichen. Lakubat könnte eine Namensform sein, die mit dem aus parallelen Rückkehrerlisten bekannten Akkub oder Lakkub zusammenhängt.'
    reason: textual_variant
lexical_decisions:
- source_word: οἱ θυρωροί
  choice: die Torwächter
  rationale: θυρωρός bezeichnet jemanden, der einen Eingang oder ein Tor bewacht. Im Zusammenhang einer Tempel- und Rückkehrerliste ist „Torwächter“ die klare, gegenwärtige Bezeichnung der institutionellen Aufgabe.
- source_word: τετρακόσιοι
  choice: vierhundert
  rationale: Direkte Wiedergabe der Kardinalzahl für die unmittelbar zuvor genannte Gruppe.
- source_word: οἱ Ἰσμαήλου
  choice: die Nachkommen Ismaels
  rationale: Die substantivierte Genitivfügung bedeutet wörtlich „die des Ismael“. In einer Geschlechterliste gibt „Nachkommen Ismaels“ die Zugehörigkeit natürlich wieder, ohne ausschließlich unmittelbare leibliche Söhne vorauszusetzen.
- source_word: υἱοὶ Λακουβάτου
  choice: Söhne Lakubats
  rationale: υἱοί bedeutet ausdrücklich „Söhne“. Der im maßgeblichen griechischen Text überlieferte Name Λακουβάτου wird als „Lakubat“ transliteriert und im deutschen Genitiv als „Lakubats“ wiedergegeben, statt ihn an parallele Listen anzugleichen.
- source_word: χίλιοι
  choice: tausend
  rationale: Direkte Wiedergabe der Kardinalzahl, die sich im griechischen Satz auf die unmittelbar vorausgehende Familienbezeichnung bezieht.
theological_decisions: []
translation_notes:
  register: Moderne, sachliche und würdevolle Listensprache. „Torwächter“ ist gegenüber dem engeren „Türhüter“ im kultisch-institutionellen Kontext vorzuziehen. Die doppelte Abstammungsbezeichnung bleibt erhalten, da ihre genaue Beziehung im griechischen Text nicht eindeutig erklärt wird.
