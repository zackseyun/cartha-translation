base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/026.yaml
  text: 'The Levites: the sons of Jesueis[a], Koddelou, Bannou, and Soudiou, seventy-four.'
translation:
  language: de
  text: 'Die Leviten: die Söhne von Jesueis[a], Koddelu, Bannu und Sudiu, vierundsiebzig.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mehrere Namen in diesem Vers weichen von den bekannteren Parallelstellen in Esra und Nehemia ab. Die Übersetzung folgt dem griechischen Text von 1 Esdras und gleicht ihn nicht an die hebräische Überlieferung an.
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ Λευεῖται
  choice: Die Leviten
  rationale: Die Wortgruppe bildet in diesem Verzeichnis eine Überschrift im Nominativ. „Die Leviten“ gibt sie ohne einen im Griechischen nicht vorhandenen Zusatz natürlich wieder.
- source_word: υἱοὶ
  choice: die Söhne von
  rationale: In genealogischen Listen bezeichnet υἱοὶ Söhne beziehungsweise Angehörige einer Abstammungsgruppe. Die formale Wiedergabe bewahrt den Listenstil und lässt die mögliche weitere Bedeutung offen.
- source_word: Ἰησουείς
  choice: Jesueis
  rationale: Der Eigenname wird nach der überlieferten griechischen Form transliteriert und nicht an bekanntere Namen aus Esra-Nehemia angeglichen.
- source_word: Κοδδηλοῦ
  choice: Koddelu
  rationale: Die deutsche Umschrift folgt der griechischen Namensform; die Endung -ου wird hier lautnah als -u wiedergegeben. Eine Angleichung an „Kadmiel“ wäre eine Rekonstruktion aus der Parallelüberlieferung.
- source_word: Βάννου
  choice: Bannu
  rationale: Die Form wird unmittelbar aus dem Griechischen ins Deutsche umgeschrieben, ohne sie zu „Bani“ zu harmonisieren.
- source_word: Σουδίου
  choice: Sudiu
  rationale: Der ungewöhnliche Name bleibt entsprechend dem griechischen Text erhalten. „Hodawja“ oder eine ähnliche Form würde eine nicht ausdrücklich bezeugte Rückübersetzung voraussetzen.
- source_word: ἑβδομήκοντα τέσσαρες
  choice: vierundsiebzig
  rationale: Dies ist die direkte und idiomatische Wiedergabe der griechischen Kardinalzahl.
theological_decisions: []
translation_notes:
  register: Knappes, würdevolles Verzeichnisdeutsch. Der Doppelpunkt markiert „Die Leviten“ als Listenüberschrift. Die Eigennamen werden in einer für das Deutsche geeigneten Umschrift der griechischen Formen wiedergegeben; die syntaktische Mehrdeutigkeit, ob alle folgenden Namen von „Söhne von“ abhängen, bleibt entsprechend dem griechischen Katalogstil bestehen.
