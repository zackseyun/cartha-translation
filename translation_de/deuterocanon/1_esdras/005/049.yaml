base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/049.yaml
  text: And they gathered themselves to them from the other nations of the land[a], and they were strengthened at the altar in its place; for they were in hostility toward them. All the nations on the land prevailed against them, and they offered sacrifices at the appointed time, and whole burnt offerings to the Lord[c][b], morning and evening.
translation:
  language: de
  text: Und aus den anderen Völkern des Landes schlossen sie sich ihnen an[a], und sie wurden am Altar an seiner Stätte gefestigt; denn sie waren ihnen feindlich gesinnt. Alle Völker im Land gewannen die Oberhand über sie, und sie brachten zur festgesetzten Zeit Opfer und Ganzbrandopfer[c] dem Herrn dar, morgens und abends.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wurden ihnen angeschlossen“. Das griechische Verb kann sowohl ein Versammeltwerden als auch den Anschluss an eine Gruppe ausdrücken.'
    reason: lexical_alternative
  - marker: b
    text: 'Der griechische Text ist hier ausführlicher als der ungefähre hebräische Paralleltext in Esra 3,2: Er erwähnt zusätzlich die Feindschaft und Überlegenheit der Völker des Landes sowie die regelmäßigen Opfer am Morgen und am Abend.'
    reason: cross_reference
  - marker: c
    text: 'Oder: „Brandopfer“. Der griechische Ausdruck bezeichnet genauer Opfer, die vollständig im Feuer verbrannt wurden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπισυνήχθησαν αὐτοῖς
  choice: schlossen sie sich ihnen an
  rationale: Die mediale beziehungsweise passive Form kann hier den Anschluss an eine Gruppe bezeichnen. Die Formulierung ist natürlich und bewahrt diese mögliche reflexive Bedeutung; eine passive Alternative wird in der Fußnote genannt.
- source_word: ἐκ τῶν ἄλλων ἐθνῶν τῆς γῆς
  choice: aus den anderen Völkern des Landes
  rationale: ἔθνη bezeichnet Völker oder Nationen. Die Wiedergabe bleibt eng am Griechischen und deutet die geografische Beziehung nicht als bloßes Umland aus.
- source_word: κατωρθώθησαν
  choice: sie wurden … gefestigt
  rationale: Das Verb kann ein Aufrichten, Festigen oder erfolgreiches Etablieren ausdrücken. „Gefestigt“ wahrt die schwierige und im Kontext ungewöhnliche Aussage, ohne eine konkrete Rekonstruktion stillschweigend festzulegen.
- source_word: ἐπὶ τὸ θυσιαστήριον ἐπὶ τοῦ τόπου αὐτῶν
  choice: am Altar an seiner Stätte
  rationale: Die Formulierung erhält sowohl den Bezug auf den Altar als auch die Betonung seines Ortes. Das griechische αὐτῶν ist formal pluralisch und textlich schwierig; im Zusammenhang liegt die Stätte des Altars nahe.
- source_word: ἐν ἔχθρᾳ ἦσαν αὐτοῖς
  choice: sie waren ihnen feindlich gesinnt
  rationale: Die Wiedergabe drückt die relationale Feindschaft aus und lässt die im griechischen Pronomengebrauch bestehende Unklarheit der Bezugsgruppen bestehen.
- source_word: κατίσχυσαν αὐτοὺς
  choice: gewannen die Oberhand über sie
  rationale: κατισχύω bezeichnet das Starksein gegen jemanden beziehungsweise das Überwältigen. Die gewählte Wendung ist gegenwärtiges, würdevolles Deutsch und bewahrt den gegnerischen Sinn.
- source_word: κατὰ τὸν καιρὸν
  choice: zur festgesetzten Zeit
  rationale: Die Wendung verweist auf die richtige oder vorgeschriebene Zeit des Opfers, ohne genauer festzulegen, welche kultische Vorschrift gemeint ist.
- source_word: θυσίας
  choice: Opfer
  rationale: Das allgemeine „Opfer“ gibt θυσία angemessen wieder und lässt die genaue Opferart offen.
- source_word: ὁλοκαυτώματα
  choice: Ganzbrandopfer
  rationale: Der Ausdruck bezeichnet Opfer, die vollständig im Feuer verbrannt werden. „Ganzbrandopfer“ bildet diese Besonderheit präziser ab als das allgemeinere „Brandopfer“.
- source_word: Κυρίῳ
  choice: für den Herrn
  rationale: Κύριος wird in diesem kultischen Zusammenhang traditionell und verständlich mit „der Herr“ wiedergegeben.
- source_word: τὸ πρωϊνὸν καὶ τὸ δειλινόν
  choice: morgens und abends
  rationale: Die knappe deutsche Zeitangabe entspricht dem regelmäßigen zeitlichen Paar des griechischen Textes.
theological_decisions:
- issue: Verhältnis des ausführlicheren griechischen Textes zum kürzeren ungefähren hebräischen Paralleltext in Esra 3,2
  choice: Der vollständigere griechische Wortlaut wird übersetzt, einschließlich der Aussagen über Feindschaft, Überlegenheit und regelmäßige Opfer.
  alternative: Den Vers an Esra 3,2 angleichen und die zusätzlichen griechischen Aussagen auslassen oder abschwächen.
  rationale: Für 1 Esdras ist der griechische Text die primäre Quelle. Der hebräische Paralleltext dient nur als Kontrollzeuge und darf die eigenständige griechische Fassung nicht verdrängen.
- issue: Identität der feindlichen Gruppen und Bezug der mehrfachen Pronomen
  choice: Die Pronomen und die Bezeichnung „Völker“ werden ohne zusätzliche Identifizierung wiedergegeben.
  alternative: Die Gruppen ausdrücklich als Heimkehrer, Fremde oder Feinde benennen.
  rationale: Der griechische Wortlaut enthält auffällige und teils unklare Pronomenbezüge. Eine ausdrückliche Identifizierung würde die vorhandene Mehrdeutigkeit auflösen und möglicherweise ethnische oder theologische Kategorien eintragen, die der Vers selbst nicht nennt.
- issue: Logisches Verhältnis zwischen der Überlegenheit der Völker und der Fortsetzung der Opfer
  choice: Die Sätze werden wie im Griechischen mit „und“ verbunden.
  alternative: Mit „dennoch“ einen ausdrücklichen Gegensatz herstellen.
  rationale: Ein konzessiver Sinn ist im Zusammenhang möglich, doch das griechische καί bezeichnet ihn nicht ausdrücklich. Die Übersetzung fügt daher keinen eindeutigen Gegensatz ein.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die ungewöhnliche Abfolge und die mehrdeutigen Pronomen des griechischen Textes werden nicht durch ergänzte Gruppennamen oder einen nicht ausdrücklich markierten Gegensatz geglättet. „Ganzbrandopfer“ ist fachlich präzise, bleibt aber auch für heutige Leser aus dem Wort selbst verständlich.
