base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/015.yaml
  text: The sons of Azeir Ezekias[a], the sons of Keilan and Azetas, sixty-seven; the sons of Azaros, four hundred thirty-two.
translation:
  language: de
  text: 'Die Söhne von Azeir Ezekias[a], die Söhne von Keilan und Azetas: siebenundsechzig; die Söhne von Azaros: vierhundertzweiunddreißig.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechischen Namen in diesem Vers weichen deutlich von der annähernd entsprechenden Stelle im masoretischen Text ab. Dort steht an dieser Position der Liste stattdessen: „die Söhne Adins: vierhundertvierundfünfzig“. Da das 1. Buch Esdras solche Rückkehrerlisten teilweise anders anordnet oder gestaltet, folgt die Übersetzung hier dem griechischen Text, statt ihn an die hebräische Parallelüberlieferung anzugleichen.'
    reason: textual_variant
lexical_decisions:
- source_word: υἱοὶ
  choice: die Söhne von
  rationale: Die Wendung bezeichnet in dieser Rückkehrerliste eine genealogische beziehungsweise familiäre Zugehörigkeit. „Söhne von“ bewahrt die Form des Griechischen und bleibt im Deutschen verständlich.
- source_word: Ἀζὴρ Ἐζεκίου
  choice: Aser Esekias
  rationale: Die griechischen Namensformen werden beibehalten und nicht an den abweichenden masoretischen Paralleltext angeglichen. Die knappe, syntaktisch nicht völlig eindeutige Verbindung beider Namen bleibt auch in der Übersetzung offen.
- source_word: Κειλὰν
  choice: Keilan
  rationale: Der Eigenname wird unmittelbar aus dem griechischen Text transliteriert.
- source_word: Ἀζητάς
  choice: Azetas
  rationale: Der Eigenname wird nach dem griechischen Hauptzeugen wiedergegeben, ohne Harmonisierung mit einer anderen Listenüberlieferung.
- source_word: ἐξήκοντα ἑπτά
  choice: siebenundsechzig
  rationale: Die Zahl wird vollständig ausgeschrieben und genau wiedergegeben.
- source_word: Ἀζάρου
  choice: Azaros
  rationale: Die griechische Genitivform wird mit der erschlossenen Grundform des Eigennamens wiedergegeben.
- source_word: τετρακόσιοι τριάκοντα δύο
  choice: vierhundertzweiunddreißig
  rationale: Die Zahl wird genau und in natürlicher deutscher Schreibweise wiedergegeben.
