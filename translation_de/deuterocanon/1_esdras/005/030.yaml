base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/030.yaml
  text: the sons of Akoud[a], the sons of Outa, the sons of Ketab, the sons of Akkaba, the sons of Sybaei, the sons of Anan, the sons of Koua, the sons of Keddour,
translation:
  language: de
  text: die Söhne Akuds[a], die Söhne Utas, die Söhne Ketabs, die Söhne Akkabas, die Söhne Sybaeis, die Söhne Anans, die Söhne Kuas, die Söhne Keddurs,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die hebräische Parallele in Nehemia 7,45 bietet eine andere Liste von Torhüterfamilien, darunter Schallum, Ater, Talmon, Akkub, Hatita und Schobai. 1 Esdras bewahrt hier eine abweichende griechische Liste; deshalb folgt die Übersetzung dem griechischen Text, ohne ihn an den hebräischen anzugleichen.
    reason: alternative_reading
lexical_decisions:
- source_word: υἱοὶ
  choice: die Söhne
  rationale: In diesem genealogischen Listenkontext bezeichnet die wiederkehrende Wendung eine Familie oder Sippe. „Die Söhne“ bewahrt die Struktur des griechischen Textes transparenter als das deutendere „die Nachkommen“.
- source_word: Ἀκούδ
  choice: Akud
  rationale: Direkte, an deutsche Laut- und Schreibgewohnheiten angepasste Umschrift der griechischen Namensform; ου wird als „u“ wiedergegeben.
- source_word: Οὐτά
  choice: Uta
  rationale: Die griechische Namensform wird in geläufiger deutscher Umschrift wiedergegeben; initiales ου entspricht „u“.
- source_word: Κητάβ
  choice: Ketab
  rationale: Nahe Umschrift der im griechischen Hauptzeugen überlieferten Form, ohne Angleichung an die abweichende hebräische Parallelliste.
- source_word: Ἀκκαβά
  choice: Akkaba
  rationale: Direkte Umschrift, die das doppelte Kappa durch „kk“ bewahrt.
- source_word: Συβαεί
  choice: Sybaei
  rationale: Quellennahe Umschrift der eigenständigen griechischen Namensform; sie wird nicht an Namen der hebräischen Parallele angeglichen.
- source_word: Ἀνάν
  choice: Anan
  rationale: Schlichte direkte Umschrift der griechischen Namensform.
- source_word: Κουά
  choice: Kua
  rationale: Deutsche Umschrift der griechischen Namensform, wobei ου als „u“ wiedergegeben wird.
- source_word: Κεδδούρ
  choice: Keddur
  rationale: Quellennahe deutsche Umschrift; das doppelte Delta bleibt als „dd“ erhalten und ου wird als „u“ wiedergegeben.
theological_decisions:
- issue: Verhältnis der griechischen Namensliste zur ungefähren masoretischen Parallele in Nehemia 7,45
  choice: Die griechische Liste wird unverändert übersetzt und nicht mit der hebräischen Liste harmonisiert.
  alternative: Einzelne Namen könnten an die masoretischen Formen wie Schallum, Ater, Talmon, Akkub, Hatita und Schobai angeglichen werden.
  rationale: Für 1 Esdras ist der griechische Text der maßgebliche Ausgangstext. Die hebräische Parallele weicht in Namen und Aufbau ab und dient daher nur als Vergleichszeuge, nicht als Grundlage einer Rekonstruktion.
translation_notes:
  register: Wiederholte, würdige Listenformel in modernem Standarddeutsch. Die Eigennamen werden quellengetreu, aber nach deutschen Umschriftgewohnheiten wiedergegeben. Das abschließende Komma bleibt erhalten, da der vorgelegte Vers als fortlaufendes Listensegment endet.
