base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/052.yaml
  text: And all who had vowed a vow to God began[a], from the new moon of the first month, to offer sacrifices to God[b], though the temple of God had not yet been built.
translation:
  language: de
  text: Und alle, die Gott ein Gelübde abgelegt hatten, begannen vom Neumond des ersten Monats an, Gott Opfer darzubringen, obwohl der Tempel Gottes noch nicht gebaut war.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „und der Tempel Gottes war noch nicht gebaut“. Das „obwohl“ im Haupttext gibt den wahrscheinlich einräumenden Sinn der griechischen Verknüpfung wieder.'
    reason: lexical_alternative
  - marker: b
    text: 'Der hebräische Paralleltext im Buch Esra weicht hier ab: Er spricht vom Laubhüttenfest und von den vorgeschriebenen täglichen Brandopfern. Der Haupttext folgt dem eigenständigen griechischen Wortlaut von 1 Esdras.'
    reason: cross_reference
lexical_decisions:
- source_word: ὅσοι
  choice: alle, die
  rationale: Gibt den unbestimmt-relativen Ausdruck natürlich wieder und bewahrt seinen umfassenden Sinn.
- source_word: εὔξαντο εὐχὴν τῷ θεῷ
  choice: Gott ein Gelübde abgelegt hatten
  rationale: Die Verbindung aus stammverwandtem Verb und Objekt bezeichnet das Ablegen eines Gelübdes. Natürliches modernes Deutsch vermeidet hier die unübliche wörtliche Nachbildung „ein Gelübde gelobt“.
- source_word: ἀπὸ τῆς νουμηνίας τοῦ πρώτου μηνός
  choice: vom Neumond des ersten Monats an
  rationale: νουμηνία bezeichnet den Neumond beziehungsweise den dadurch markierten Monatsanfang; „vom … an“ macht den Beginn des Zeitraums klar.
- source_word: ἤρξαντο προσφέρειν θυσίας τῷ θεῷ
  choice: begannen … Gott Opfer darzubringen
  rationale: Bewahrt den Beginn der Handlung und gibt θυσίας präzise als kultische Opfer wieder. „Darbringen“ entspricht dem würdigen Erzählregister.
- source_word: ὁ ναὸς τοῦ θεοῦ οὔπω ᾠκοδόμητο
  choice: der Tempel Gottes noch nicht gebaut war
  rationale: „Gebaut“ folgt dem griechischen Wortlaut; „wiederaufgebaut“ würde den historischen Kontext ausdrücklich in den Text eintragen.
theological_decisions:
- issue: Sinnverhältnis des abschließenden καί-Satzes
  choice: konzessiv mit „obwohl“
  alternative: 'einfache Beiordnung: „und der Tempel Gottes war noch nicht gebaut“'
  rationale: Das griechische καί koordiniert formal, doch der Zusammenhang hebt hervor, dass die Opfer bereits vor dem Tempelbau dargebracht wurden. Die Fußnote bewahrt die formale Alternative.
- issue: Verhältnis zum abweichenden hebräischen Paralleltext
  choice: Die eigenständige griechische Aussage über Gelübde und den noch nicht gebauten Tempel bleibt maßgeblich.
  alternative: Angleichung an Esra 3 mit Laubhüttenfest und vorgeschriebenen täglichen Brandopfern
  rationale: Für 1 Esdras ist der griechische Text die primäre Quelle; der hier deutlich abweichende hebräische Paralleltext darf ihn nicht harmonisierend ersetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Gelübde ablegen“ und „Opfer darbringen“ sind verständliche, im religiös-kultischen Zusammenhang präzise Wendungen. Die Satzstellung hält die Zeitangabe eng beim Beginn des Opferdienstes.
