revisions:
- from: Und sie gaben den Steinmetzen und Zimmerleuten Silber und den Sidoniern und Tyrern Getränke, Lebensmittel und Vorräte[a], damit sie Zedernholz vom Libanon herbeischafften und es auf Flößen zum Hafen von Joppe transportierten, gemäß dem schriftlichen Erlass, den ihnen Kyrus, der König der Perser, erteilt hatte.
  to: Und sie gaben den Steinmetzen und Zimmerleuten Silber und den Sidoniern und Tyrern Getränke, Lebensmittel und Vorräte[a], um Zedernholz vom Libanon herbeizuschaffen und es auf Flößen zum Hafen von Joppe zu transportieren, gemäß dem schriftlichen Erlass, den ihnen Kyros, der König der Perser, erteilt hatte.
  rationale: Die Revision macht die finale Infinitivkonstruktion im Deutschen klarer und ersetzt die weniger übliche Namensform „Kyrus“ durch „Kyros“. Die vorsichtige Wiedergabe von χάρα als „Vorräte“ sowie die erläuternde Fußnote bleiben unverändert, da der griechische Wortlaut keine sichere Spezifizierung als „Öl“ erlaubt.
  reviewer_model: gpt-5.6-terra
