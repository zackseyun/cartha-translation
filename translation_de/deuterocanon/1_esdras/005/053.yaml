base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/053.yaml
  text: And they gave silver to the stonecutters and carpenters[a], and drink and food and provisions to the Sidonians and Tyrians, to bring cedar logs from Lebanon, transporting them by rafts to the harbor of Joppa, according to the written decree given to them by Cyrus king of the Persians.
translation:
  language: de
  text: Und sie gaben den Steinmetzen und Zimmerleuten Silber und den Sidoniern und Tyrern Getränke, Lebensmittel und Vorräte[a], um Zedernholz vom Libanon herbeizuschaffen und es auf Flößen zum Hafen von Joppe zu transportieren, gemäß dem schriftlichen Erlass, den ihnen Kyros, der König der Perser, erteilt hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hier mit „Vorräte“ wiedergegebene griechische Wort ist an dieser Stelle schwierig; die hebräische Parallele in Esra 3,7 nennt „Öl“.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀργύριον
  choice: Silber
  rationale: Bewahrt die konkrete Bedeutung des griechischen Wortes; im Zusammenhang dient das Silber als Bezahlung.
- source_word: λατόμοις
  choice: Steinmetzen
  rationale: Bezeichnet Arbeiter, die Steine behauen; diese geläufige deutsche Bezeichnung ist präziser als das allgemeinere „Bauleute“.
- source_word: τέκτοσι
  choice: Zimmerleuten
  rationale: Im Zusammenhang des Tempelbaus sind Holzhandwerker gemeint; „Zimmerleute“ ist im Deutschen natürlich und sachgerecht.
- source_word: ποτὰ καὶ βρωτὰ
  choice: Getränke, Lebensmittel
  rationale: Gibt die beiden konkreten Versorgungsgüter klar und in natürlichem Deutsch wieder.
- source_word: χάρα
  choice: Vorräte
  rationale: Die überlieferte Form ist im Kontext schwierig. „Vorräte“ wahrt den Sinn einer Versorgungsliste, ohne das im griechischen Text nicht ausdrücklich genannte „Öl“ einzusetzen.
- source_word: παράγειν
  choice: herbeischafften
  rationale: Drückt die zweckgerichtete Verbringung des Holzes vom Libanon idiomatisch aus.
- source_word: ξύλα κέδρινα
  choice: Zedernholz
  rationale: Bezeichnet für den Bau bestimmtes Zedernholz, ohne die Form als bereits zugerichtete Balken oder bloße Stämme festzulegen.
- source_word: διαφέρειν σχεδίαις
  choice: es auf Flößen ... transportierten
  rationale: Gibt sowohl den Transportvorgang als auch das verwendete Mittel ausdrücklich wieder.
- source_word: Ἰόππης λιμένα
  choice: Hafen von Joppe
  rationale: Natürliche deutsche Wiedergabe der Orts- und Hafenbezeichnung.
- source_word: πρόσταγμα τὸ γραφέν
  choice: schriftlichen Erlass
  rationale: Trifft den amtlichen Charakter der königlichen Anordnung und ihre schriftliche Form.
theological_decisions:
- issue: Verhältnis des griechischen Textes zur Parallele in Esra 3,7
  choice: Der griechische Text bleibt maßgeblich; χάρα wird vorsichtig als „Vorräte“ wiedergegeben.
  alternative: Nach der hebräischen Parallele ausdrücklich „Öl“ schreiben oder die schwierige griechische Form wörtlich als „Freude“ wiedergeben.
  rationale: Die Parallele kann den Versorgungskontext erhellen, rechtfertigt aber nicht, eine spezifische Ware in den Haupttext einzutragen, die in der vorliegenden griechischen Form nicht eindeutig genannt wird.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der lange Satzbau des griechischen Textes bleibt erkennbar, wird jedoch durch klare Zuordnung der Empfänger und eine natürliche deutsche Zweckkonstruktion lesbar gemacht.
