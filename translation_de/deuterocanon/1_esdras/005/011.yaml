  naturalness: „Die Söhne …, von den Söhnen …“ ist im heutigen Deutsch außerhalb einer Listenformel zwar leicht repetitiv, für einen genealogischen Zensus aber verständlich, idiomatisch genug und näher am wiederholten υἱοὶ als die interpretierende Umschreibung „und zwar“.
  terminology: „Söhne“ ist in dieser genealogischen Listenformel die quellennahe Bezeichnung und kann hier kollektiv verstanden werden. Jeschua ist im nachexilischen Kontext angemessen; Roboab muss im Haupttext als griechisch bezeugte Form stehen. Die Fußnoten trennen die hebräische Parallele und die abweichende Namensform ausreichend vom Haupttext.
