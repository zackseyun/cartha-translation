base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/011.yaml
  text: The sons of Phath-moab[a], of the sons of Jeshua and Joab[b], two thousand eight hundred and two.
translation:
  language: de
  text: 'Die Söhne Phthalemoabs[a], von den Söhnen Jeschuas und Roboabs[b]: zweitausendachthundertzwei.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Griechisch Phthalemoab; in der hebräischen Parallelüberlieferung steht gewöhnlich Pahat-Moab.
    reason: alternative_reading
  - marker: b
    text: Der griechische Text hat „Jeschua und Roboab“. Die entsprechende Namensfolge in den parallelen Listen von Esra und Nehemia wird gewöhnlich mit „Jeschua und Joab“ verbunden. Da 1 Esdras sein Quellenmaterial mitunter anders anordnet oder gestaltet, bleibt hier die griechische Form im Haupttext erhalten.
    reason: textual_variant
lexical_decisions:
- source_word: υἱοὶ
  choice: die Nachkommen
  rationale: In der Listenformel bezeichnet υἱοὶ nicht nur unmittelbare Söhne, sondern Angehörige einer Sippe oder Abstammungslinie. „Nachkommen“ ist im modernen Deutschen hier klar und natürlich.
- source_word: Φθαλεμωάβ
  choice: Phthalemoab
  rationale: Die Form folgt dem maßgeblichen griechischen Text, statt sie stillschweigend an die hebräische Parallelüberlieferung anzugleichen.
- source_word: εἰς τοὺς υἱοὺς
  choice: und zwar die Nachkommen
  rationale: εἰς kennzeichnet in dieser Listenformel die nähere Zuordnung innerhalb der zuvor genannten Gruppe. „Und zwar“ gibt diese Spezifizierung idiomatisch wieder, ohne eine räumliche Bedeutung einzutragen.
- source_word: Ἰησοῦ
  choice: Jeschua
  rationale: Im nachexilischen genealogischen Zusammenhang ist „Jeschua“ die übliche deutsche Wiedergabe des Namens und vermeidet eine sachlich irreführende Assoziation mit dem neutestamentlichen Jesus.
- source_word: Ῥοβοάβ
  choice: Roboab
  rationale: Die Transliteration folgt dem tatsächlich überlieferten griechischen Namen. Eine Angleichung an Joab gehört wegen der erheblichen Abweichungen der Parallelüberlieferung nicht unmarkiert in den Haupttext.
- source_word: δισχίλιοι ὀκτακόσιοι δύο
  choice: zweitausendachthundertzwei
  rationale: Wörtliche und eindeutige Wiedergabe der Kardinalzahl 2.802; die ausgeschriebene Form entspricht dem würdevollen Listenstil.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdig-knapper Listenform. „Nachkommen“ verdeutlicht die genealogische Gruppenbezeichnung; die griechischen Eigennamen bleiben als primäre Textformen erhalten. Alle Fußnotenmarker stehen im Haupttext.
