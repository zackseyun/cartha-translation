  source_fidelity: 'Die Übersetzung folgt dem griechischen Primärtext genau: ἀριθμός ist als „Zahl“ wiedergegeben, τῶν ἀπὸ τοῦ ἔθνους als „derer aus dem Volk“, προηγούμενοι im listen- und verwaltungssprachlichen Sinn als „Anführer“, υἱοὶ Φορός als „die Söhne des Phoros“ und ἑβδομήκοντα δύο χιλιάδες als „zweiundsiebzigtausend“. Der auffällige griechische Wortlaut wird weder an die masoretische Parallelüberlieferung noch an erwartbare Listenwerte angeglichen.'
