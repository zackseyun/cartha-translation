base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/009.yaml
  text: 'The number of those from the nation[a], and their leaders: the sons of Phoros[b], seventy-two thousand.'
translation:
  language: de
  text: 'Die Zahl derer aus dem Volk und ihre Anführer: die Söhne des Phoros[a], zweiundsiebzigtausend[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Griechisch: »Phoros«. Die parallele hebräische Listenüberlieferung weicht an dieser Stelle sowohl beim Namen als auch bei der Zahl ab; der griechische Text von 1 Esdras scheint eine abweichende Listenform zu bewahren.'
    reason: alternative_reading
  - marker: b
    text: Der griechische Text lautet »zweiundsiebzigtausend«. Diese ungewöhnlich hohe Zahl weicht stark von der annähernd parallelen masoretischen Überlieferung ab und könnte auf eine Textstörung oder eine andere Listenüberlieferung zurückgehen.
    reason: textual_variant
lexical_decisions:
- source_word: ἀριθμὸς
  choice: Die Zahl
  rationale: Gibt die Überschrift einer Zählungs- oder Namensliste unmittelbar und idiomatisch wieder.
- source_word: τῶν ἀπὸ τοῦ ἔθνους
  choice: derer aus dem Volk
  rationale: ἔθνος kann »Volk« oder »Nation« bedeuten. Im Zusammenhang einer Rückkehrer- und Sippenliste ist »Volk« natürlich, ohne die Zugehörigkeit näher zu bestimmen als der griechische Text.
- source_word: οἱ προηγούμενοι αὐτῶν
  choice: ihre Anführer
  rationale: Das substantivierte Partizip bezeichnet wörtlich die ihnen Vorangehenden; im administrativen Listenrahmen sind damit die führenden Männer beziehungsweise Anführer gemeint. Der auffällige Wechsel der griechischen Konstruktion bleibt in der knappen Reihung erkennbar.
- source_word: υἱοὶ
  choice: die Söhne des
  rationale: Bewahrt die traditionelle genealogische Ausdrucksweise; in einer Sippenliste kann die Wendung auch Nachkommen oder Angehörige eines Hauses bezeichnen.
- source_word: Φορὸς
  choice: Phoros
  rationale: Transliteriert den Namen des maßgeblichen griechischen Textes, statt ihn nach einer abweichenden Parallelüberlieferung anzugleichen.
- source_word: ἑβδομήκοντα δύο χιλιάδες
  choice: zweiundsiebzigtausend
  rationale: Entspricht dem eindeutig überlieferten Wortlaut des griechischen Primärtextes; die auffällige Abweichung von parallelen Listen wird in einer Fußnote kenntlich gemacht.
