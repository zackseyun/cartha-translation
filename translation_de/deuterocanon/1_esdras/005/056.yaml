base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/056.yaml
  text: And they appointed the Levites[a], from twenty years old and upward, over the works of the Lord. Then Jeshua stood with his sons and brothers, and Kadmiel his brother, and the sons of Jeshua son of Henadad, and the sons of Judah son of Eliadun, together with their sons and brothers—all the Levites, united as supervisors of the work, carrying on the works in the house of the Lord[d][c][b]. And the builders built the temple of the Lord.
translation:
  language: de
  text: Und sie setzten die Leviten im Alter von zwanzig Jahren und darüber als Aufseher über die Arbeiten des Herrn ein. Da trat Jeschua an, mit den Söhnen und Brüdern sowie Kadmiël[a], dem Bruder, den Söhnen Jeschuas, des Sohnes Henadads[b], und den Söhnen Judas, des Sohnes Eliaduns, mit ihren Söhnen und Brüdern. Alle Leviten wirkten einmütig als Arbeitsaufseher[c] an den Arbeiten im Haus des Herrn mit.[d] Und die Bauleute bauten den Tempel des Herrn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im griechischen Text steht Damadiël; die parallele Esra-Überlieferung nennt diesen Leviten Kadmiël.
    reason: alternative_reading
  - marker: b
    text: Die griechische Namensform Hemadabun entspricht wahrscheinlich Henadad in der parallelen hebräischen Überlieferung.
    reason: alternative_reading
  - marker: c
    text: „Arbeitsaufseher“ gibt ein seltenes griechisches Wort für Menschen wieder, die Arbeiten leiten oder vorantreiben.
    reason: lexical_alternative
  - marker: d
    text: Der griechische Text verwendet in diesem Vers an beiden Stellen den Plural „Arbeiten“.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔστησαν ... ἐπὶ τῶν ἔργων
  choice: setzten ... als Aufseher über die Arbeiten ... ein
  rationale: Die Wendung bezeichnet hier die Beauftragung der Leviten mit Verantwortung für die Tempelarbeiten, nicht nur ein körperliches Hinstellen.
- source_word: ἀπὸ εἰκοσαετοῦς
  choice: im Alter von zwanzig Jahren und darüber
  rationale: Die Formulierung gibt eine Altersuntergrenze an; „und darüber“ macht diesen Schwellenwert im Deutschen idiomatisch deutlich.
- source_word: ὁμοθυμαδόν
  choice: einmütig
  rationale: Das Adverb bezeichnet gemeinsames, gleichgerichtetes Handeln und bleibt mit „einmütig“ prägnant und würdig.
- source_word: ἐργοδιῶκται
  choice: Arbeitsaufseher
  rationale: Das seltene Kompositum bezeichnet Personen, die die Arbeit leiten oder vorantreiben; „Arbeitsaufseher“ bewahrt den Aufsichtsaspekt ohne die Härte von „Antreiber“.
- source_word: ποιοῦντες εἰς τὰ ἔργα
  choice: wirkten ... an den Arbeiten ... mit
  rationale: Die griechische Wendung ist ungewöhnlich; die Übersetzung gibt ihre aktive Beteiligung wieder und erhält zugleich den Plural „Arbeiten“.
- source_word: οἰκοδόμησαν οἱ οἰκοδόμοι
  choice: die Bauleute bauten
  rationale: Die Wiederholung des Wortstamms entspricht der auffälligen griechischen Formulierung und ist auch im Deutschen verständlich.
- source_word: ναὸν τοῦ κυρίου
  choice: Tempel des Herrn
  rationale: ναός bezeichnet hier den Tempel beziehungsweise das Heiligtum und wird von οἶκος, zuvor als „Haus“ übersetzt, unterschieden.
- source_word: Ἰούδα τοῦ Εἰλιαδοὺν
  choice: Judas, des Sohnes Eliaduns
  rationale: Der Genitiv wird in der Namensreihe plausibel als Abstammungsangabe verstanden; die unsicheren Namen bleiben eng am griechischen Text.
theological_decisions:
- issue: Wiedergabe von κύριος im griechischen Tempelbaukontext
  choice: Herr
  alternative: HERR
  rationale: Die unmittelbare Vorlage lautet κύριος. „Herr“ übersetzt den griechischen Gottesnamen-Titel, ohne stillschweigend den hebräischen Gottesnamen in den Haupttext zurückzuübertragen.
- issue: Normalisierung offenbar entstellter oder stark hellenisierter Personennamen
  choice: Kadmiël und Henadad im Haupttext, mit Nachweis der griechischen Formen in Fußnoten
  alternative: Damadiël und Hemadabun entsprechend der erhaltenen griechischen Schreibweise
  rationale: Die Parallelüberlieferung macht die Identifizierung dieser beiden Namen hinreichend wahrscheinlich; die Fußnoten erhalten dennoch die konkrete Lesart der griechischen Hauptquelle.
- issue: Beziehung des als ὁ ἀδελφός bezeichneten Kadmiël
  choice: sein Bruder Kadmiël
  alternative: Kadmiël, der Bruder
  rationale: Der bestimmte Ausdruck steht in der auf Jeschua bezogenen Personenreihe und wird idiomatisch als Verwandtschaftsangabe zu ihm verstanden. Das Griechische nennt das Possessivpronomen jedoch nicht ausdrücklich.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Die Namensformen Jeschua und Kadmiël werden zur deutlichen Unterscheidung und nach gängiger deutscher Transliterationspraxis verwendet. Die schwerfällige griechische Personenliste wurde behutsam gegliedert, ohne ihre Gruppen oder den wiederholten Plural „Arbeiten“ zu beseitigen.
