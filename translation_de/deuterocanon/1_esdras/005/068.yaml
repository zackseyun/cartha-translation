base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/068.yaml
  text: For we alone will build for the Lord of Israel[a], in accordance with what Cyrus king of the Persians commanded us.
translation:
  language: de
  text: Denn wir allein werden für den Herrn Israels bauen, entsprechend dem, was uns Kyros, der König der Perser, befohlen hat.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡμεῖς γὰρ μόνοι
  choice: Denn wir allein
  rationale: Das ausdrückliche Pronomen und μόνοι betonen, dass ausschließlich die Sprecher bauen werden; γάρ begründet die vorausgehende Ablehnung.
- source_word: οἰκοδομήσομεν
  choice: werden … bauen
  rationale: Die einfache Zukunft gibt den griechischen Wortlaut wieder. „Wiederaufbauen“ wäre sachlich möglich, ist hier aber nicht ausdrücklich bezeichnet.
- source_word: τῷ κυρίῳ τοῦ Ἰσραήλ
  choice: für den Herrn Israels
  rationale: Der Dativ bezeichnet den, für den beziehungsweise zu dessen Ehre gebaut wird; κύριος bildet hier den göttlichen Titel „Herr“.
- source_word: ἀκολούθως οἷς προσέταξεν ἡμῖν
  choice: wie es uns … befohlen hat
  rationale: Die natürliche deutsche Wendung bewahrt den Sinn „entsprechend dem, was uns befohlen wurde“, ohne den Inhalt des Befehls näher festzulegen.
- source_word: Κῦρος ὁ βασιλεὺς Περσῶν
  choice: Kyrus, der König der Perser
  rationale: Περσῶν ist ein pluralischer Volksname und wird daher quellennah mit „der Perser“ wiedergegeben.
theological_decisions:
- issue: Wiedergabe von κύριος als Gottesbezeichnung
  choice: Herr
  alternative: Gebieter
  rationale: In der Verbindung „Herr Israels“ ist κύριος ein göttlicher Titel; „Herr“ ist die sachgerechte und geläufige deutsche Wiedergabe.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die exklusive Betonung liegt natürlich auf „wir allein“. Keine Fußnote nötig, da „König der Perser“ den griechischen Plural unmittelbar und verständlich wiedergibt.
