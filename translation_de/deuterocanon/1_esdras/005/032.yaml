translation:
  language: de
  text: die Nachkommen Deddas[a], die Nachkommen Bachus, die Nachkommen Serars, die Nachkommen Thomtheis, die Nachkommen Naseis[b], die Nachkommen Hatephas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Text nennt hier sechs Familiennamen: Dedda, Bachus, Serar, Thomthei, Nasei und Hatepha. Der ungefähr entsprechende hebräische Text nennt dagegen drei andere Namen: Lebana, Hagaba und Akkub. Da hier der griechische Text von 1 Esdras die Übersetzungsgrundlage ist, werden dessen Namen beibehalten und nicht an den hebräischen Paralleltext angeglichen.'
    reason: alternative_reading
  - marker: b
    text: Mehrere Namen in diesem Vers sind selten und könnten auf Schwankungen im Text oder auf unterschiedliche Umschriften innerhalb der griechischen Überlieferung zurückgehen. Die Übersetzung folgt dem vorliegenden griechischen Text daher zurückhaltend und möglichst genau.
    reason: textual_variant
lexical_decisions:
- source_word: υἱοὶ
  choice: die Nachkommen
  rationale: In dieser listenartigen Aufzählung bezeichnet υἱοὶ Familien- oder Sippengruppen und nicht nur unmittelbare leibliche Söhne. „Die Nachkommen“ gibt diesen Sinn in natürlichem modernem Deutsch wieder; die Wiederholung bewahrt zugleich die Struktur des griechischen Textes.
- source_word: Δεδδά
  choice: Dedda
  rationale: Der Eigenname wird eng nach dem griechischen Hauptzeugen wiedergegeben und nicht an den abweichenden hebräischen Paralleltext angeglichen.
- source_word: Βαχούς
  choice: Bachus
  rationale: Die griechische Namensform wird nach üblicher deutscher Umschrift wiedergegeben, wobei ου als „u“ erscheint. Der abweichende Name des ungefähren hebräischen Paralleltexts wird nicht eingesetzt.
- source_word: Σεράρ
  choice: Serar
  rationale: Konservative Umschrift des im griechischen Haupttext gebotenen Eigennamens.
- source_word: Θόμθει
  choice: Thomthei
  rationale: Der seltene Eigenname wird eng an der griechischen Form transliteriert, ohne spekulative Normalisierung.
- source_word: Νασεί
  choice: Nasei
  rationale: Direkte, konservative Umschrift der griechischen Namensform; die vorliegenden Quellen bieten keinen hinreichenden Grund für eine Änderung.
- source_word: Ἁτεφά
  choice: Hatepha
  rationale: Konservative Umschrift; das anlautende H bildet den Spiritus asper ab, und „ph“ gibt φ transparent wieder.
