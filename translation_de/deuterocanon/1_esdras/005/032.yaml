translation_notes:
  register: Moderne, würdige Listensprache. „Nachkommen“ macht den Sippencharakter von υἱοὶ verständlich. Die wechselnden deutschen Genitivkonstruktionen („Deddas“, „des …“, „der …“) dienen der natürlichen Grammatik, ohne das Geschlecht oder die Identität der Namen dogmatisch festzulegen; bei den seltenen Namen sind solche Zuordnungen lediglich sprachliche Konventionen.
