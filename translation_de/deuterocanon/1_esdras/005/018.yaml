lexical_decisions:
- source_word: οἱ ἐκ
  choice: die aus
  rationale: Die Wendung bezeichnet in dieser Listenform Gruppen nach ihrer Herkunft. „Die aus“ bewahrt den örtlichen Bezug, ohne aus dem nur annähernden hebräischen Paralleltext „Söhne von“ einzutragen.
- source_word: Νετέβας
  choice: Netebas
  rationale: Der Eigenname wird eng nach dem maßgeblichen griechischen Text transliteriert und nicht an den abweichenden hebräischen Paralleltext angeglichen.
- source_word: πεντήκοντα πέντε
  choice: fünfundfünfzig
  rationale: Direkte Wiedergabe der Kardinalzahl.
- source_word: Ἐνάτου
  choice: Enatos
  rationale: Der griechische Genitiv wird als lesbare Grundform eines Ortsnamens wiedergegeben.
- source_word: ἑκατὸν πεντήκοντα ὀκτώ
  choice: einhundertachtundfünfzig
  rationale: Direkte Wiedergabe der Kardinalzahl in moderner deutscher Zahlenschreibung.
- source_word: Βαιτασμῶν Ζαμμώθ
  choice: Baitasmon-Samoth
  rationale: Die schwierige griechische Namensfolge wird zurückhaltend transliteriert. Der Bindestrich kennzeichnet sie als zusammengehörige Ortsbezeichnung, ohne eine unsichere Identifizierung vorzunehmen; griechisches Ζ wird in deutscher Namenstransliteration mit S wiedergegeben.
