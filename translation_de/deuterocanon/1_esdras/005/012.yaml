base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/012.yaml
  text: the sons of Iolamus[a], two; the sons of Zatou, nine hundred seventy; the sons of Chorbe, seven hundred five; the sons of Banei, six hundred forty-eight[c][b];
translation:
  language: de
  text: 'Die Söhne des Jolamos: zwei; die Söhne des Zatu[a]: neunhundertsiebzig; die Söhne des Chorbe[b]: siebenhundertfünf; die Söhne des Banei[c]: sechshundertachtundvierzig;'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Griechisch Ζατοῦ (Zatu); die hebräische Parallelüberlieferung hat Zattu.
    reason: alternative_reading
  - marker: b
    text: Wie der griechische Name Χορβέ (Chorbe) zu den Namen der hebräischen Parallellisten gehört, ist unsicher; einige parallele Listen nennen hier eine andere Familie.
    reason: textual_variant
  - marker: c
    text: Griechisch Βανεί (Banei); die hebräische Parallelliste hat Bani und nennt dort eine andere Gesamtzahl.
    reason: alternative_reading
lexical_decisions:
- source_word: υἱοὶ
  choice: die Söhne des
  rationale: Die wiederkehrende Abstammungsformel bezeichnet in dieser Namensliste die Angehörigen einer Familie oder Sippe. „Die Söhne des“ bewahrt die konkrete griechische Ausdrucksweise und ist im biblischen Listenstil verständlich.
- source_word: Ἰωλάμου
  choice: Jolamos
  rationale: Der Name wird nach seiner griechischen Form wiedergegeben; anlautendes Ι vor einem Vokal erscheint in deutscher Umschrift natürlich als J.
- source_word: δύο
  choice: zwei
  rationale: Unmittelbare Wiedergabe der Kardinalzahl.
- source_word: Ζατοῦ
  choice: Zatu
  rationale: Die Hauptlesart folgt dem griechischen Namen. Die im hebräischen Paralleltext vertrautere Form Zattu wird in einer Fußnote genannt, ohne sie in den griechischen Text einzusetzen.
- source_word: ἐννακόσιοι ἑβδομήκοντα
  choice: neunhundertsiebzig
  rationale: Die Zahl 970 wird vollständig und nach heutiger deutscher Rechtschreibung wiedergegeben.
- source_word: Χορβέ
  choice: Chorbe
  rationale: Die Umschrift folgt dem überlieferten griechischen Text. Da die Zuordnung zu Namen in hebräischen Parallellisten unsicher ist, wird keine harmonisierende Namensform in den Haupttext übernommen.
- source_word: ἑπτακόσιοι πέντε
  choice: siebenhundertfünf
  rationale: Die Zahl 705 wird genau und in natürlicher deutscher Form wiedergegeben.
- source_word: Βανεί
  choice: Banei
  rationale: Der Haupttext gibt die griechische Namensform wieder; die hebräische Parallelform Bani und deren abweichende Zahl werden in der Fußnote dokumentiert.
- source_word: ἑξακόσιοι τεσσεράκοντα ὀκτώ
  choice: sechshundertachtundvierzig
  rationale: Die Zahl 648 wird exakt nach der griechischen Vorlage wiedergegeben.
