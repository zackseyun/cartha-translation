base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/005.yaml
  text: 'The priests[a], the sons of Phinehas, the sons of Aaron: Jeshua son of Jozadak son of Seraiah, and Joakim son of Zerubbabel son of Shealtiel, from the house of David, from the family line of Perez[b],'
translation:
  language: de
  text: 'Die Priester, die Söhne[a] des Pinhas, die Söhne Aarons: Jeschua[b], der Sohn Jozadaks, des Sohnes Serajas, und Jojakim, der Sohn Serubbabels, des Sohnes Schealtiëls, aus dem Haus Davids, aus der Sippe des Perez,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: In genealogischen Aufzählungen kann das griechische Wort für »Söhne« auch »Nachkommen« bedeuten, nicht nur unmittelbare Söhne.
    reason: lexical_alternative
  - marker: b
    text: Der griechische Name Ἰησοῦς kann je nach Zusammenhang auch mit »Josua« oder »Jesus« wiedergegeben werden; hier bezeichnet er den nachexilischen Priester Jeschua.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ ἱερεῖς
  choice: Die Priester
  rationale: Der bestimmte substantivierte Plural bezeichnet hier die als genealogische Gruppe eingeführten Priester.
- source_word: υἱοὶ Φινεὲς υἱοὶ Ἀαρών
  choice: die Söhne des Pinhas, die Söhne Aarons
  rationale: Die wiederholte Abstammungsformel des Griechischen bleibt erhalten; »Söhne« kann in einer Genealogie auch spätere Nachkommen bezeichnen.
- source_word: Ἰησοῦς
  choice: Jeschua
  rationale: Für den nachexilischen priesterlichen Namensträger ist »Jeschua« im Deutschen eindeutig und traditionsgemäß; es vermeidet eine irreführende Gleichsetzung mit Jesus.
- source_word: ὁ τοῦ Ἰωσεδὲκ τοῦ Σαραιοῦ
  choice: der Sohn Jozadaks, des Sohnes Serajas
  rationale: Die elliptische griechische Genitivkette wird im Deutschen durch die genealogische Ergänzung »Sohn« verständlich gemacht, ohne die Abfolge zu verändern.
- source_word: Ἰωακεὶμ
  choice: Jojakim
  rationale: Die Form ist eine geläufige deutsche Wiedergabe des biblischen Namens und entspricht dem griechischen Ἰωακείμ.
- source_word: ὁ τοῦ Ζοροβαβὲλ τοῦ Σαλαθιὴλ
  choice: der Sohn Serubbabels, des Sohnes Schealtiëls
  rationale: Die genealogischen Genitive werden natürlich und ausdrücklich wiedergegeben.
- source_word: ἐκ τοῦ οἴκου τοῦ Δαυείδ
  choice: aus dem Haus Davids
  rationale: »Haus« bezeichnet in diesem Zusammenhang die Familie beziehungsweise Dynastie Davids und bewahrt die feste biblische Ausdrucksweise.
- source_word: ἐκ τῆς γενεᾶς Φάρες
  choice: aus der Sippe des Perez
  rationale: γενεά bezeichnet hier die Abstammungslinie, nicht eine zeitliche Generation; »Sippe« ist knapp und verständlich.
theological_decisions:
- issue: Genealogische Reichweite von υἱοί
  choice: Die Quellform »Söhne« wird beibehalten und ihre mögliche weitere Bedeutung in einer Fußnote erklärt.
  alternative: Durchgehend »Nachkommen« schreiben.
  rationale: So bleibt die konkrete Bildsprache des griechischen Textes erhalten, ohne unmittelbare Vaterschaft für jedes Glied zwingend vorauszusetzen.
- issue: Syntaktische Zuordnung von Jojakim zur einleitenden Bezeichnung »die Priester«
  choice: Die appositionale Reihung und damit die Spannung des griechischen Satzes bleiben erhalten.
  alternative: Jojakim durch Umstellung oder einen neuen Satz aus der Gruppe der Priester herauslösen.
  rationale: Der griechische Wortlaut stellt die Namen in einer fortlaufenden Nominativreihe zusammen. Eine Glättung würde eine nicht ausdrücklich markierte Auslegung in den Text eintragen.
translation_notes:
  register: Moderne, würdige Standardsprache mit den im Deutschen geläufigen biblischen Namensformen. Die wiederholten Abstammungsangaben und das abschließende Komma wurden beibehalten, weil der Vers syntaktisch in den folgenden Zusammenhang weiterführt.
