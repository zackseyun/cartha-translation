base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/038.yaml
  text: 'And from the priests[a], those who claimed the priesthood, but were not found: the sons of Obbeia, the sons of Akbos, the sons of Iaddous, who had taken Augia as a wife from the daughters of Phaexeldai[b],'
translation:
  language: de
  text: 'Und unter den Priestern[a] waren diejenigen, die Anspruch auf das Priesteramt erhoben, aber nicht gefunden wurden: die Söhne Obbeias, die Söhne Akbos und die Söhne Iaddous, der eine Tochter Phaexeldais, Augia, zur Frau genommen hatte[b],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das Griechische ist verkürzt formuliert: „nicht gefunden“ bedeutet wahrscheinlich, dass ihr genealogischer Nachweis oder ihre Eintragung als Priester nicht gefunden wurde, wie in der Parallele im Esrabuch.'
    reason: lexical_alternative
  - marker: b
    text: Die Eigennamen weichen hier von der ungefähr entsprechenden masoretischen Parallelüberlieferung ab. Die Übersetzung folgt dem griechischen Text von 1 Esdras und gleicht die Namen nicht an Esra oder Nehemia an.
    reason: textual_variant
lexical_decisions:
- source_word: ἐκ τῶν ἱερέων
  choice: von den Priestern
  rationale: Gibt ἐκ mit dem Genitiv eng wieder und kennzeichnet die folgende Gruppe als Teil der Priesterschaft.
- source_word: οἱ ἐμποιούμενοι ἱερωσύνης
  choice: diejenigen, die Anspruch auf das Priesteramt erhoben
  rationale: Das Partizip bezeichnet hier das Geltendmachen eines Anspruchs; „Priesteramt“ gibt ἱερωσύνη im Zusammenhang der genealogischen Amtsberechtigung natürlich wieder.
- source_word: οὐχ εὑρέθησαν
  choice: aber nicht gefunden wurden
  rationale: Die formnahe Wiedergabe bewahrt die Ellipse des Griechischen und ergänzt weder ausdrücklich ein Register noch einen Abstammungsnachweis.
- source_word: υἱοὶ Ὀββειά
  choice: die Söhne Obbeias
  rationale: Die genealogische Listenformel bleibt erhalten; der Name folgt der griechischen Form.
- source_word: υἱοὶ Ἀκβώς
  choice: die Söhne des Akbos
  rationale: „Söhne“ bewahrt die Listenstruktur und kann genealogisch auch Nachkommen umfassen; die Artikelform sorgt im Deutschen für einen natürlichen Genitiv des griechisch überlieferten Namens.
- source_word: υἱοὶ Ἰαδδοὺς
  choice: die Söhne des Iaddous
  rationale: Der Eigenname wird nach dem griechischen Text transliteriert und nicht an eine Parallelüberlieferung angeglichen.
- source_word: τοῦ λαβόντος Αὐγίαν γυναῖκα
  choice: der Augia … zur Frau genommen hatte
  rationale: Die idiomatische Verbindung von λαμβάνω und γυνή bezeichnet die Eheschließung; das Plusquamperfekt bildet das vorzeitige Aoristpartizip im Relativsatz ab.
- source_word: τῶν θυγατέρων Φαηξελδαίου
  choice: eine von den Töchtern Phaexeldais
  rationale: Die Formulierung bezieht Augia natürlich auf die Gruppe der Töchter und folgt beim Namen dem griechischen Hauptzeugen.
theological_decisions:
- issue: Worauf sich „nicht gefunden wurden“ bezieht
  choice: Die Ellipse bleibt im Vers erhalten.
  alternative: „deren Eintrag/Abstammungsnachweis nicht gefunden wurde“
  rationale: Der griechische Text nennt das Fehlende nicht ausdrücklich. Eine Ergänzung würde die wahrscheinliche Bedeutung erklären, aber die vorhandene Mehrdeutigkeit auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit formnaher Listenstruktur. Die schwerfällige, aber bedeutungstragende Ellipse des Ausgangstextes wird im Haupttext bewahrt und in einer Fußnote erläutert. Die Namen werden nach dem griechischen Hauptzeugen wiedergegeben.
