base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/070.yaml
  text: And by plots and by stirring up the crowds and by forming factions[a], they hindered the building from being completed all the time of the life of King Cyrus; and the building was halted for two years[b], until the reign of Darius.
translation:
  language: de
  text: Durch Ränke, durch Aufwiegelung des Volkes und durch die Bildung gegnerischer Gruppen verhinderten sie, dass der Bau vollendet wurde, solange König Kyrus lebte.[a] Und die Bauleute wurden zwei Jahre lang am Weiterbauen gehindert,[b] bis zur Regierungszeit des Darius.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »während der ganzen Zeit des Lebens des Königs Kyrus«. Im Zusammenhang kann damit seine gesamte hier relevante Lebens- oder Regierungszeit gemeint sein.'
    reason: lexical_alternative
  - marker: b
    text: Das griechische Verb steht im Plural, nennt sein Subjekt aber nicht ausdrücklich. Die Übersetzung versteht es im Zusammenhang als die am Bau Arbeitenden.
    reason: alternative_reading
lexical_decisions:
- source_word: βουλάς
  choice: Ränke
  rationale: Der feindselige Zusammenhang verlangt hier eher nach »Ränke« oder »Intrigen« als nach dem neutralen »Pläne«.
- source_word: δημαγωγοῦντες
  choice: Aufwiegelung des Volkes
  rationale: Das Partizip bezeichnet das beeinflussende oder aufrührerische Mobilisieren der Bevölkerung; die Formulierung ist verständlich und bewahrt den negativen Sinn.
- source_word: συστάσεις ποιούμενοι
  choice: die Bildung gegnerischer Gruppen
  rationale: Die Wendung bezeichnet organisierte Zusammenschlüsse oder Parteiungen. »Gegnerische Gruppen« macht ihre gegen den Bau gerichtete Funktion deutlich, ohne eine bestimmte politische Organisationsform vorauszusetzen.
- source_word: ἀπεκώλυσαν τοῦ ἀποτελεσθῆναι
  choice: verhinderten sie, dass … vollendet wurde
  rationale: Die Konstruktion bezeichnet aktive Behinderung mit Blick auf die Vollendung; im Deutschen ist ein dass-Satz natürlich und präzise.
- source_word: τὴν οἰκοδομήν
  choice: der Bau
  rationale: Das Substantiv bezeichnet hier das Bauvorhaben beziehungsweise die Bautätigkeit, nicht bloß das fertige Gebäude.
- source_word: πάντα τὸν χρόνον τῆς ζωῆς τοῦ βασιλέως Κύρου
  choice: solange König Kyrus lebte
  rationale: Dies gibt die zeitliche Aussage des griechischen Wortlauts natürlich wieder, ohne »Leben« stillschweigend durch »Regierungszeit« zu ersetzen.
- source_word: εἰρχθησαν τῆς οἰκοδομῆς
  choice: die Bauleute wurden … am Weiterbauen gehindert
  rationale: Die pluralische Passivform legt ein persönliches Subjekt nahe. »Bauleute« erschließt dieses aus dem Zusammenhang; »Weiterbauen« vermeidet die missverständliche Vorstellung, der Bau habe noch gar nicht begonnen.
- source_word: ἔτη δύο
  choice: zwei Jahre lang
  rationale: Die adverbiale Zeitangabe ist im Deutschen idiomatisch.
- source_word: ἕως τῆς Δαρείου βασιλείας
  choice: bis zur Regierungszeit des Darius
  rationale: βασιλεία bezeichnet in diesem zeitlichen Zusammenhang die Herrschafts- beziehungsweise Regierungszeit des Königs.
theological_decisions:
- issue: Bezug und Aussage der abschließenden Passivkonstruktion
  choice: 'Die pluralische Verbform wird persönlich auf die Bauleute bezogen: Sie wurden zwei Jahre lang am Weiterbauen gehindert.'
  alternative: 'Die Aussage kann unpersönlicher auf das Bauvorhaben bezogen werden: Der Bau ruhte zwei Jahre lang.'
  rationale: εἰρχθησαν steht im Plural und spricht grammatisch eher für Personen als Subjekt; diese sind jedoch nicht ausdrücklich genannt. Da der unmittelbare Satzgegenstand auch der Bau ist, wird die sachlich naheliegende unpersönliche Deutung in einer Fußnote bewahrt.
- issue: Lebenszeit oder Regierungszeit des Kyrus
  choice: 'Der Haupttext folgt ausdrücklich τῆς ζωῆς und sagt: »solange König Kyrus lebte«.'
  alternative: Im erzählerischen Zusammenhang könnte die relevante Zeit seine Regierungszeit sein.
  rationale: Der griechische Text nennt ausdrücklich das Leben des Kyrus. Die Übersetzung ersetzt dies nicht durch eine historisch interpretierende Angabe, weist aber auf die mögliche kontextuelle Auffassung hin.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die dreifache Beschreibung der gegnerischen Maßnahmen bleibt rhetorisch parallel. Historische Königsnamen folgen den im Deutschen üblichen Formen Kyrus und Darius. Beide Fußnotenmarker stehen unmittelbar bei der jeweils erklärten Wendung.
