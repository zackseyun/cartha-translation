source:
  edition: lxx-swete-1909
  text: καὶ καταστὰς Ἰησοῦς ὁ τοῦ Ἰωσεδὲκ καὶ οἱ ἀδελφοὶ αὐτοῦ οἱ ἱερεῖς καὶ Ζοροβαβὲλ ὁ τοῦ Σαλαθιὴλ καὶ οἱ τούτου ἀδελφοὶ ἡτοίμασαν τὸ θυσιαστήριον τοῦ θεοῦ Ἰσραήλ,
  language: Greek
  pages: []
  confidence: high
base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/145.yaml
  text: And Jeshua son of Josedec arose[a], with his brothers the priests, and Zerubbabel son of Salathiel, with his brothers, and they prepared the altar of the God of Israel[b],
translation:
  language: de
  text: Da trat Jeschua[a], der Sohn Jozadaks, zusammen mit seinen Brüdern, den Priestern, und Serubbabel, dem Sohn Schealtiëls[b], zusammen mit dessen Brüdern, hervor; und sie bereiteten den Altar des Gottes Israels vor,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der griechische Name Ἰησοῦς kann je nach Zusammenhang auch mit „Josua“ oder „Jesus“ wiedergegeben werden.
    reason: lexical_alternative
  - marker: b
    text: Im Griechischen lautet der Name Σαλαθιήλ (Salathiël); „Schealtiël“ entspricht der geläufigen hebräischen Namensform.
    reason: lexical_alternative
lexical_decisions:
- source_word: καταστὰς
  choice: trat … hervor
  rationale: Das aoristische Partizip bezeichnet hier das entschlossene Auftreten Jeschuas zu Beginn der gemeinsamen Handlung. „Trat … hervor“ gibt die narrative Bewegung natürlich wieder, ohne das Verb bereits als „errichten“ zu deuten.
- source_word: Ἰησοῦς
  choice: Jeschua
  rationale: Im nachexilischen Zusammenhang ist die im Deutschen übliche historische Namensform „Jeschua“ angemessen; die griechische Form kann je nach Kontext auch als „Josua“ oder „Jesus“ wiedergegeben werden.
- source_word: ὁ τοῦ Ἰωσεδὲκ
  choice: der Sohn Jozadaks
  rationale: Die griechische Zugehörigkeitskonstruktion bezeichnet hier die Abstammung. „Jozadak“ ist die geläufige deutsche Namensform des Vaters.
- source_word: οἱ ἀδελφοὶ αὐτοῦ οἱ ἱερεῖς
  choice: seine Brüder, die Priester
  rationale: Die Apposition identifiziert Jeschuas Brüder als Priester. Die konkrete männliche Verwandtschafts- beziehungsweise Gruppensprache des Griechischen bleibt erhalten.
- source_word: Ζοροβαβὲλ
  choice: Serubbabel
  rationale: „Serubbabel“ ist die etablierte deutsche Namensform des nachexilischen Statthalters.
- source_word: ὁ τοῦ Σαλαθιὴλ
  choice: der Sohn Schealtiëls
  rationale: Die Konstruktion bezeichnet die Sohnschaft. „Schealtiël“ ist die geläufige deutsche Form des Namens; die unmittelbar griechische Form wird in einer Fußnote genannt.
- source_word: οἱ τούτου ἀδελφοὶ
  choice: dessen Brüder
  rationale: Das Demonstrativpronomen bezieht sich eindeutig auf Serubbabel. „Dessen“ verhindert im Deutschen eine mehrdeutige Zuordnung.
- source_word: ἡτοίμασαν
  choice: bereiteten … vor
  rationale: Das Verb bedeutet „vorbereiten“ oder „bereitmachen“. Die Wiedergabe lässt offen, welche konkreten Bau- oder Einrichtungsarbeiten damit verbunden waren.
- source_word: τὸ θυσιαστήριον
  choice: den Altar
  rationale: „Altar“ ist die gewöhnliche und hinreichend klare Wiedergabe von θυσιαστήριον.
- source_word: τοῦ θεοῦ Ἰσραήλ
  choice: des Gottes Israels
  rationale: Der Genitiv bezeichnet die Zugehörigkeit beziehungsweise Widmung des Altars und wird formal entsprechend wiedergegeben.
theological_decisions:
- issue: Wiedergabe von ἀδελφοί innerhalb priesterlicher und familiärer Gruppen
  choice: Brüder
  alternative: Verwandte; Gefährten
  rationale: Der griechische Text verwendet ausdrücklich die männliche Verwandtschaftsbezeichnung. Eine allgemeinere Deutung als Verwandte oder Gruppenangehörige ist möglich, soll aber nicht stillschweigend in den Haupttext eingetragen werden.
- issue: Namensform Ἰησοῦς im nachexilischen Kontext
  choice: Jeschua
  alternative: Josua; Jesus
  rationale: Die griechische Namensform ist dieselbe wie andernorts bei Josua oder Jesus. „Jeschua“ kennzeichnet den hier gemeinten nachexilischen Priester in verständlicher deutscher Tradition, ohne die sprachliche Identität der Namensformen zu verschweigen.
- issue: Bedeutungsumfang von ἡτοίμασαν beim Altar
  choice: bereiteten … vor
  alternative: richteten … her; errichteten
  rationale: „Vorbereiten“ wahrt den lexikalischen Umfang des Verbs. „Errichten“ würde eine konkrete Bautätigkeit stärker festlegen, als es dieses Verb für sich genommen tut.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit geläufigen deutschen Formen biblischer Namen. Die Satzstruktur bewahrt den feierlichen Aufzählungscharakter des Griechischen, bleibt aber durch „dessen“ und eine klare Zeichensetzung gut verständlich.
