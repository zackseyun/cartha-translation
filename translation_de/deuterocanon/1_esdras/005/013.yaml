base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/013.yaml
  text: the sons of Bebai[a], six hundred thirty-three; the sons of Argai, one thousand three hundred twenty-two.
translation:
  language: de
  text: 'die Nachkommen Bebais: sechshundertdreiunddreißig; die Nachkommen Argais[a]: eintausenddreihundertzweiundzwanzig.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der griechische Text lautet „Argai“. Im annähernden masoretischen Paralleltext steht „Asgad“ und eine andere Gesamtzahl (1.222); die beiden Listen stimmen an dieser Stelle also nicht genau überein.
    reason: alternative_reading
lexical_decisions:
- source_word: υἱοὶ
  choice: die Nachkommen
  rationale: In der listenartigen Zählung bezeichnet υἱοὶ eine nach dem genannten Vorfahren benannte Familien- oder Sippengruppe. „Nachkommen“ gibt diese Funktion im modernen Deutschen natürlicher und eindeutiger wieder als das wörtliche „Söhne“.
- source_word: Βηβαί
  choice: Bebai
  rationale: Der Eigenname wird entsprechend der griechischen Form Βηβαί als „Bebai“ wiedergegeben.
- source_word: ἑξακόσιοι τριάκοντα τρεῖς
  choice: sechshundertdreiunddreißig
  rationale: Die griechische Kardinalzahl wird vollständig und nach heutiger deutscher Schreibweise wiedergegeben.
- source_word: Ἀργαί
  choice: Argai
  rationale: Die Übersetzung folgt dem maßgeblichen griechischen Text mit Ἀργαί. Die abweichende Namensform des masoretischen Paralleltexts wird nicht in den Haupttext übernommen, sondern in einer Fußnote dokumentiert.
- source_word: χίλιοι τριακόσιοι εἴκοσι δύο
  choice: eintausenddreihundertzweiundzwanzig
  rationale: Die Zahl 1322 wird unmittelbar aus dem griechischen Text übernommen und nach heutiger deutscher Schreibweise ausgeschrieben.
