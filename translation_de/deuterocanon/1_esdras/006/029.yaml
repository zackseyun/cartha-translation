base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/029.yaml
  text: Likewise also wheat and salt and wine and oil continually year by year[a], as the priests in Jerusalem may direct, are to be used up day by day without dispute,
translation:
  language: de
  text: Ebenso sollen auch Weizen, Salz, Wein und Öl fortlaufend Jahr für Jahr, wie die Priester in Jerusalem es anordnen, Tag für Tag ohne Widerspruch[a] verbraucht werden,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ohne Ausbleiben“ beziehungsweise „zuverlässig“. Das griechische Adverb kann sowohl das Fehlen von Widerspruch als auch die Gewissheit der Ausführung betonen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πυρὸν
  choice: Weizen
  rationale: πυρός bezeichnet hier konkret Weizen als Bestandteil der für den Opferdienst bestimmten Vorräte, nicht Feuer (πῦρ).
- source_word: ἅλα
  choice: Salz
  rationale: Die übliche und im kultischen Versorgungskontext eindeutige Bedeutung.
- source_word: οἶνον
  choice: Wein
  rationale: Die direkte, natürliche Entsprechung innerhalb der Liste von Opfergaben und Vorräten.
- source_word: ἔλαιον
  choice: Öl
  rationale: Gemeint ist im Kontext Olivenöl; das natürliche deutsche Wort „Öl“ ist hier ausreichend eindeutig.
- source_word: ἐνδελεχῶς κατʼ ἐνιαυτόν
  choice: Jahr für Jahr fortlaufend
  rationale: Die Formulierung bewahrt sowohl den Gedanken regelmäßiger, ununterbrochener Bereitstellung als auch den distributiven Bezug auf jedes Jahr.
- source_word: ὑπαγορεύσωσιν
  choice: es anordnen
  rationale: Das Verb bezeichnet hier das Erteilen oder genaue Vorgeben der erforderlichen Anweisungen durch die Priester.
- source_word: ἀναλίσκεσθαι
  choice: verbraucht werden
  rationale: Das Passiv bezeichnet den bestimmungsgemäßen Verbrauch der Vorräte und ist weiter als „verzehrt werden“, das fälschlich nur an Essen denken ließe.
- source_word: καθʼ ἡμέραν
  choice: Tag für Tag
  rationale: Die distributive Wendung gibt die tägliche, wiederkehrende Verwendung ausdrücklich wieder.
- source_word: ἀναμφισβητήτως
  choice: ohne Widerspruch
  rationale: Die Wiedergabe erhält den Grundsinn „unbestritten, ohne Einwand“; die im Verwaltungskontext mögliche Nuance zuverlässiger Erfüllung wird in der Fußnote offengehalten.
