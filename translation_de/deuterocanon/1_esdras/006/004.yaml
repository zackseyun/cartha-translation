base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/004.yaml
  text: By whose authorization are you building this house and completing this roof and all the rest? And who are the builders carrying out these things?[a][b]
translation:
  language: de
  text: Auf wessen Anordnung baut ihr dieses Haus, vollendet dieses Dach und führt alles Übrige aus?[a][b] Und wer sind die Bauleute, die dies ausführen?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Mit wessen Ermächtigung baut ihr dieses Haus …?“ Das griechische Partizip kann die Weisung oder Bevollmächtigung hinter den Arbeiten hervorheben.'
    reason: lexical_alternative
  - marker: b
    text: Mit „Haus“ ist hier der Tempel gemeint; die Übersetzung behält jedoch den gewöhnlichen griechischen Ausdruck bei.
    reason: cultural_note
lexical_decisions:
- source_word: Τίνος … συντάξαντος
  choice: Auf wessen Anordnung
  rationale: Die Genitivkonstruktion mit dem Aoristpartizip von συντάσσω fragt nach der Person, die den Auftrag oder die Weisung erteilt hat. „Auf wessen Anordnung“ gibt dies im Deutschen natürlich wieder, ohne ausdrücklich einen förmlichen Erlass vorauszusetzen.
- source_word: οἰκοδομεῖτε
  choice: baut ihr
  rationale: Das Präsens bezeichnet die laufende Bautätigkeit; „baut ihr“ ist im Deutschen in diesem Zusammenhang natürlich und bewahrt den einfachen Sinn, ohne „wieder aufbauen“ einzutragen.
- source_word: οἶκον
  choice: Haus
  rationale: Der griechische Text verwendet das gewöhnliche Wort für „Haus“. Gemeint ist im Zusammenhang der Tempel, doch diese Deutung wird nicht in den Haupttext eingesetzt.
- source_word: στέγην
  choice: Dach
  rationale: στέγη bezeichnet hier das Dach beziehungsweise die Abdeckung des Gebäudes; „Dach“ ist die konkrete und natürliche Entsprechung.
- source_word: τἄλλα πάντα
  choice: alles Übrige
  rationale: Die Wendung umfasst sämtliche weiteren Arbeiten oder Gebäudeteile, ohne sie näher zu bestimmen.
- source_word: ἐπιτελεῖτε
  choice: führt … aus
  rationale: Das Verb bezeichnet das Ausführen beziehungsweise Zuendebringen der übrigen Arbeiten. Diese Wiedergabe vermeidet die im Deutschen unnatürliche Vorstellung, ein bereits bezeichnetes Dach zu „vollenden“, und hält den Bezug auf das ganze Vorhaben offen.
- source_word: οἰκοδόμοι
  choice: Bauleute
  rationale: Der Ausdruck bezeichnet allgemein die mit dem Bau Beschäftigten. „Bauleute“ ist idiomatisch und legt kein bestimmtes Handwerk fest.
- source_word: τελοῦντες
  choice: die dies ausführen
  rationale: Das Partizip beschreibt diejenigen, die diese Arbeiten tatsächlich durchführen. „Ausführen“ bewahrt den Vollzugssinn des Verbs.
