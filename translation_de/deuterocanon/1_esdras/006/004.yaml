translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die amtliche Kontrollfrage bleibt direkt formuliert. „Haus“ bewahrt die Bild- und Wortwahl des griechischen Textes; die kontextuelle Bedeutung „Tempel“ wird in einer Fußnote erläutert.
