base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/007.yaml
  text: 'A copy of the letter that Sisinnes[a], the governor of Syria and Phoenicia, and Sathrabuzanes, and their associates, the rulers in Syria and Phoenicia, wrote and sent to King Darius: Greetings.'
translation:
  language: de
  text: 'Abschrift des Briefes, den Sisinnes[a], der Statthalter von Syrien und Phönizien, Sathrabuzanes und ihre Amtskollegen, die führenden Amtsträger in Syrien und Phönizien, an König Darius schrieben und absandten: Grüße!'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Griechischen wechselt die Formulierung vom Singular („schrieb“) zum Plural („sandten ab“). Der Haupttext gibt die Handlung der genannten Amtsträger in flüssigem Deutsch gemeinsam im Plural wieder.
    reason: textual_variant
lexical_decisions:
- source_word: Ἀντίγραφον ἐπιστολῆς
  choice: Abschrift des Briefes
  rationale: Ἀντίγραφον bezeichnet die Abschrift oder Kopie eines Schriftstücks; „Abschrift“ passt zum amtlichen Briefkontext und gibt die Genitivverbindung knapp wieder.
- source_word: ἧς ἔγραφεν ... καὶ ἀπέστειλαν
  choice: den ... schrieben und absandten
  rationale: Die koordinierte Pluralformulierung gibt die gemeinsame amtliche Handlung der genannten Absender in natürlichem Deutsch wieder; der Numeruswechsel im Griechischen wird in einer Fußnote offengelegt.
- source_word: Σισίννης
  choice: Sisinnes
  rationale: Der Personenname wird in enger Anlehnung an die griechische Form transkribiert.
- source_word: ὁ ἔπαρχος
  choice: der Statthalter
  rationale: ἔπαρχος bezeichnet hier einen hohen regionalen Verwaltungsbeamten; „Statthalter“ ist im historischen Kontext verständlich und präzise.
- source_word: Συρίας καὶ Φοινίκης
  choice: von Syrien und Phönizien
  rationale: Die Genitive benennen den Zuständigkeitsbereich des Statthalters.
- source_word: Σαθραβουζάνης
  choice: Sathrabuzanes
  rationale: Der Eigenname wird direkt nach der griechischen Namensform transkribiert.
- source_word: οἱ συνέταιροι
  choice: ihre Amtskollegen
  rationale: συνέταιροι meint verbundene Gefährten oder Teilhaber; im behördlichen Zusammenhang vermittelt „Amtskollegen“ die administrative Beziehung am klarsten.
- source_word: ἡγεμόνες
  choice: die führenden Amtsträger
  rationale: ἡγεμόνες bezeichnet Personen mit Leitungs- oder Regierungsgewalt. Die Wiedergabe wahrt den amtlichen Sinn, ohne sie mit dem zuvor genannten einzelnen ἔπαρχος gleichzusetzen.
- source_word: Βασιλεῖ Δαρείῳ
  choice: an König Darius
  rationale: Der Dativ bezeichnet den Adressaten des Briefes; im Deutschen ist „an“ dafür die natürliche Form.
- source_word: χαίρειν
  choice: Grüße!
  rationale: χαίρειν ist die übliche griechische Briefformel. „Grüße!“ gibt ihre kommunikative Funktion knapp und verständlich wieder.
