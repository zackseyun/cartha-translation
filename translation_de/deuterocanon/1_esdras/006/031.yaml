base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/031.yaml
  text: And issue an order that if anyone transgresses any part of what has been written and nullifies it[a], a beam shall be taken from his own property and he shall be hanged on it, and his possessions shall become royal property.
translation:
  language: de
  text: 'Und es soll angeordnet werden: Wenn jemand gegen irgendeine der schriftlich festgehaltenen Bestimmungen verstößt und sie außer Kraft setzt, soll ein Balken aus seinem eigenen Besitz genommen und er daran aufgehängt werden[a]; sein Hab und Gut aber soll dem König zufallen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „daran gepfählt“ oder „daran öffentlich aufgehängt“. Das griechische Wort bedeutet „aufgehängt werden“. Die Art der in diesem Strafzusammenhang gemeinten Hinrichtung ist historisch nicht eindeutig; sie kann Pfählung oder öffentliches Aufhängen an einem Holzbalken umfasst haben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προστάξαι
  choice: es soll angeordnet werden
  rationale: Der Infinitiv setzt die amtlich-verfügende Aussage fort; die unpersönliche Form gibt den administrativen Charakter im Deutschen natürlich wieder.
- source_word: παραβῶσίν τι τῶν γεγραμμένων
  choice: gegen irgendeine der schriftlich festgehaltenen Bestimmungen verstößt
  rationale: Die Wendung bezeichnet die Verletzung eines beliebigen Teils des schriftlich Erlassenen; „Bestimmungen“ bringt den rechtlichen Zusammenhang zum Ausdruck, ohne den Umfang näher festzulegen.
- source_word: ἀκυρώσωσιν
  choice: sie außer Kraft setzt
  rationale: Das Verb bedeutet, etwas ungültig oder unwirksam zu machen. Die Formulierung ist im modernen deutschen Rechts- und Verwaltungsstil klar.
- source_word: λημφθῆναι ξύλον
  choice: ein Balken ... genommen
  rationale: ξύλον kann Holz, Baum oder Holzbalken bedeuten. Im Zusammenhang der Strafe bezeichnet „Balken“ am plausibelsten das verwendete Holzstück.
- source_word: ἐκ τῶν ἰδίων αὐτοῦ
  choice: aus seinem eigenen Besitz
  rationale: Die griechische Wendung ist weiter als „aus seinem Haus“ und bezeichnet das, was dem Täter selbst gehört.
- source_word: κρεμασθῆναι
  choice: daran aufgehängt werden
  rationale: Dies ist die direkte Bedeutung des griechischen Verbs. Ob die historische Strafe Hängen, Pfählung oder öffentliche Aufhängung meinte, bleibt im Haupttext offen und wird in der Fußnote erläutert.
- source_word: τὰ ὑπάρχοντα αὐτοῦ
  choice: sein Hab und Gut
  rationale: Die Wendung umfasst den materiellen Besitz des Betroffenen; „Hab und Gut“ ist verständlich, umfassend und dem würdigen Register angemessen.
- source_word: εἶναι βασιλικά
  choice: dem König zufallen
  rationale: Das Prädikatsadjektiv erklärt den Besitz zum königlichen Eigentum. „Dem König zufallen“ gibt die rechtliche Konfiskation idiomatisch wieder.
theological_decisions:
- issue: Art der mit κρεμασθῆναι bezeichneten Strafe
  choice: daran aufgehängt werden
  alternative: daran gepfählt oder öffentlich daran zur Schau gestellt werden
  rationale: Das griechische Verb bezeichnet unmittelbar ein Hängen oder Aufhängen, während der historische persische Strafkontext auch Pfählung oder die Befestigung eines Körpers an einem Balken zulässt. Der Haupttext bleibt beim lexikalisch direkten Sinn; die Fußnote bewahrt die historische Mehrdeutigkeit.
translation_notes:
  register: Moderner, würdiger deutscher Verwaltungs- und Rechtston. Die Satzstruktur bewahrt den Erlasscharakter; altertümliche oder konfessionell geprägte Sprache wird vermieden.
