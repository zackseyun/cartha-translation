base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/009.yaml
  text: with costly hewn stones[a], with timber laid in the buildings, and those works being done with diligence, and the work prospering in their hands[b], being completed with all glory and care.
translation:
  language: de
  text: mit kostbaren behauenen Steinen und Bauholz, das in den Gebäuden verbaut wurde; jene Arbeiten wurden mit Eifer[a] ausgeführt, das Werk gedieh unter ihren Händen, und die Arbeiten wurden mit aller Pracht[b] und Sorgfalt vollendet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit großer Dringlichkeit“. Das griechische ἐπὶ σπουδῆς kann sowohl eifrige Sorgfalt als auch Eile ausdrücken.'
    reason: lexical_alternative
  - marker: b
    text: „Pracht“ bezeichnet hier wahrscheinlich die eindrucksvolle, prächtige Ausführung der Bauarbeiten, nicht nur Ehre in einem abstrakten Sinn.
    reason: cultural_note
lexical_decisions:
- source_word: λίθων ξυστῶν πολυτελῶν
  choice: kostbaren behauenen Steinen
  rationale: ξυστός bezeichnet hier bearbeiteten beziehungsweise behauenen Stein; πολυτελής hebt dessen kostbare, aufwendige Qualität hervor.
- source_word: ξύλων τιθεμένων ἐν τοῖς οἴκοις
  choice: wobei Bauholz in den Gebäuden verlegt wurde
  rationale: ξύλα meint im Bauzusammenhang Bauholz; οἶκοι bezeichnet hier eher die Bauwerke beziehungsweise Gebäudeteile als private Wohnhäuser.
- source_word: τὰ ἔργα ἐκεῖνα ἐπὶ σπουδῆς γινόμενα
  choice: jene Arbeiten mit Eifer ausgeführt wurden
  rationale: σπουδή kann Eifer, Sorgfalt oder Dringlichkeit ausdrücken. „Mit Eifer“ bewahrt die energische Ausführung, ohne vorschnell bloße Hast anzunehmen.
- source_word: εὐοδούμενον τὸ ἔργον ἐν ταῖς χερσὶν αὐτῶν
  choice: das Werk gedieh unter ihren Händen
  rationale: εὐοδόω bezeichnet Gelingen oder Gedeihen. „Unter ihren Händen“ gibt das griechische Bild verständlich wieder und bezeichnet zugleich ihre tätige Verantwortung.
- source_word: ἐν πάσῃ δόξῃ καὶ ἐπιμελείᾳ συντελούμενα
  choice: die Arbeiten wurden mit aller Pracht und Sorgfalt vollendet
  rationale: Das neutrale Pluralpartizip συντελούμενα greift wahrscheinlich τὰ ἔργα auf. δόξα bezeichnet im Baukontext Pracht oder Herrlichkeit, ἐπιμέλεια sorgfältige Aufmerksamkeit.
