  naturalness: Der Satzfragmentcharakter kann erhalten bleiben, sollte im Deutschen aber syntaktisch klarer und weniger verschachtelt sein. „Bauholz … verlegt“ ist möglich, doch „verbaut“ ist im gegebenen Baukontext idiomatischer.
  terminology: „Kostbare behauene Steine“, „Bauholz“, „Eifer“, „unter ihren Händen“, „Pracht“ und „Sorgfalt“ sind angemessen. Die Fußnoten geben die lexikalische Spannweite von σπουδή und den kontextuellen Sinn von δόξα zutreffend wieder.
