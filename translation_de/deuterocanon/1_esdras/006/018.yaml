base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/018.yaml
  text: And he was commanded to bring back all these vessels[a], to put them in the temple in Jerusalem, and that the temple of the Lord should be built on its site.
translation:
  language: de
  text: Und ihm wurde befohlen, alle diese Geräte zurückzubringen und sie im Tempel in Jerusalem niederzulegen; und der Tempel des Herrn sollte an dieser Stätte gebaut werden.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπετάγη αὐτῷ
  choice: ihm wurde befohlen
  rationale: Die unpersönliche Passivform und der Dativ des Befehlsempfängers werden eng am Griechischen wiedergegeben, ohne den nicht genannten Befehlenden zu ergänzen.
- source_word: ἀπήνεγκεν
  choice: zurückzubringen
  rationale: Der Kontext betrifft die Rückführung zuvor entfernter Tempelgeräte; „zurückbringen“ gibt diese Bewegungsrichtung natürlich wieder.
- source_word: σκεύη
  choice: Geräte
  rationale: „Geräte“ ist im Deutschen eine verständliche und etablierte Bezeichnung für die zum Tempeldienst gehörenden Gegenstände.
- source_word: ἀποθεῖναι
  choice: niederzulegen
  rationale: Das Verb bezeichnet das Ablegen beziehungsweise Deponieren der Geräte im Tempel; die aktive Infinitivkonstruktion bewahrt die griechische Satzfügung.
- source_word: ναός
  choice: Tempel
  rationale: Im Jerusalemer Kontext ist „Tempel“ die klare, allgemein verständliche Wiedergabe, auch wenn das griechische Wort enger das Heiligtum bezeichnen kann.
- source_word: κυρίου
  choice: des Herrn
  rationale: Die traditionelle und sachgerechte Wiedergabe von κύριος bezeichnet hier den Gott Israels.
- source_word: οἰκοδομηθῆναι
  choice: gebaut werden
  rationale: Die passive Form wird formal bewahrt. „Wiederaufgebaut“ ist kontextuell naheliegend, aber im griechischen Verb nicht ausdrücklich markiert.
- source_word: ἐπὶ τοῦ τόπου
  choice: an dieser Stätte
  rationale: Die Formulierung gibt den bestimmten Ort des Tempelbaus wieder, ohne ein im Griechischen nicht ausdrücklich gesetztes Possessivpronomen einzuführen.
theological_decisions:
- issue: Wiedergabe von κύριος im Zusammenhang mit dem Jerusalemer Tempel
  choice: des Herrn
  alternative: des HERRN
  rationale: „Herr“ entspricht κύριος unmittelbar und bezeichnet im Kontext Israels Gott, ohne durch eine typografische Gottesnamenkonvention zusätzliche textliche Information einzutragen.
- issue: Ob der Tempel „gebaut“ oder „wiederaufgebaut“ werden soll
  choice: gebaut werden
  alternative: wiederaufgebaut werden
  rationale: Der historische Zusammenhang legt einen Wiederaufbau nahe; die Übersetzung folgt jedoch dem einfachen οἰκοδομηθῆναι und lässt die kontextuelle Nuance offen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die amtliche Sprache des Befehls bleibt erkennbar; altertümliche Wörter wie „Gefäße“ oder „daselbst“ werden vermieden. Die Koordination des letzten Infinitivs wird mit „auch sollte“ natürlich wiedergegeben.
