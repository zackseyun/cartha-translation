base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/030.yaml
  text: so that libations may be offered to God Most High for the king and his sons[b][a], and that they may pray for them.
translation:
  language: de
  text: damit dem höchsten Gott Trankopfer[a] für den König und seine Kinder[b] dargebracht werden und man für sie betet.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Libationen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: seine Söhne.'
    reason: lexical_ambiguity
  - marker: c
    text: 'Der griechische Ausdruck ist unvollständig beziehungsweise elliptisch; gemeint sein kann: für ihr Wohlergehen.'
    reason: textual_ambiguity
lexical_decisions:
- source_word: ὅπως
  choice: damit
  rationale: Leitet den Zweck ein und gibt den finalen Sinn im Deutschen natürlich wieder.
- source_word: προσφέρωνται
  choice: dargebracht werden
  rationale: Bewahrt die passive Form und den kultischen Sinn des Verbs.
- source_word: σπονδαὶ
  choice: Trankopfer
  rationale: Bezeichnet präzise kultische Ausgüsse; „Trankopfer“ ist im modernen Deutschen verständlicher als „Libationen“.
- source_word: τῷ θεῷ τῷ ὑψίστῳ
  choice: dem höchsten Gott
  rationale: Bewahrt sowohl θεός als auch den Hoheitstitel ὕψιστος in natürlicher deutscher Wortstellung.
- source_word: ὑπὲρ τοῦ βασιλέως καὶ τῶν παίδων
  choice: für den König und seine Kinder
  rationale: ὑπέρ hat hier benefaktiven Sinn. παῖδες kann Kinder oder Söhne bedeuten; „Kinder“ erhält die lexikalische Breite.
- source_word: προσεύχωνται
  choice: man … betet
  rationale: Das unbestimmte deutsche „man“ gibt die nicht ausdrücklich genannten Handelnden idiomatisch wieder, ohne sie näher zu bestimmen.
- source_word: περὶ τῆς αὐτῶν
  choice: für sie
  rationale: Die griechische Wendung ist elliptisch. „Für sie“ bewahrt den naheliegenden Bezug auf den König und seine Kinder, ohne einen ergänzten Begriff wie „Wohlergehen“ in den Haupttext einzuführen.
theological_decisions:
- issue: Wiedergabe des Gottestitels ὁ ὕψιστος
  choice: der höchste Gott
  alternative: Gott, der Höchste
  rationale: Die gewählte Form bewahrt den Hoheitstitel ohne zusätzliche dogmatische Präzisierung und klingt im Deutschen natürlich.
- issue: Gegenstand des Gebets in περὶ τῆς αὐτῶν
  choice: für sie
  alternative: für ihr Wohlergehen
  rationale: Der griechische Text ist elliptisch. Die kürzere Fassung erhält diese Offenheit und vermeidet, den wahrscheinlich gemeinten, aber nicht ausdrücklich genannten Gegenstand des Gebets in den Haupttext einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Kultische Fachsprache wird verständlich wiedergegeben; die Ellipse am Versende wird im Haupttext nicht überdeutet.
