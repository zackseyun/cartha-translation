base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/013.yaml
  text: And the house was being built over many years before the time of a great and mighty king of Israel[b][a], and it was completed.
translation:
  language: de
  text: Und das Haus[a] wurde vor vielen Jahren von einem großen und mächtigen König Israels erbaut und vollendet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit dem „Haus“ ist der Tempel gemeint.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἰκοδομεῖτο
  choice: wurde … erbaut
  rationale: Das Imperfekt Passiv bezeichnet den damaligen Bauvorgang. Im Deutschen gibt die Präteritumsform im Zusammenhang mit dem anschließenden Abschlussverb den Sinn natürlich wieder, ohne einen noch andauernden Bau anzudeuten.
- source_word: ὁ οἶκος
  choice: das Haus
  rationale: Die wörtliche Bezeichnung bleibt erhalten; aus dem Zusammenhang ist der Tempel gemeint, was die Fußnote erläutert.
- source_word: ἔμπροσθεν ἐτῶν πλειόνων
  choice: vor vielen Jahren
  rationale: Die Wendung bezeichnet hier eine weit zurückliegende Zeit. Diese Fassung ist idiomatisches modernes Deutsch und entspricht auch dem historischen Zusammenhang.
- source_word: διὰ βασιλέως τοῦ Ἰσραὴλ μεγάλου καὶ ἰσχυροῦ
  choice: von einem großen und mächtigen König Israels
  rationale: διά mit Genitiv bezeichnet den Handelnden beziehungsweise Vermittler. Zusammen mit den Bauverben ergibt sich die natürliche agentive Lesart.
- source_word: ἐπετέλεσθη
  choice: vollendet
  rationale: Das Aorist Passiv bezeichnet den erreichten Abschluss des Baus. Das gemeinsame Hilfsverb „wurde“ kann im Deutschen ohne Bedeutungsverlust für beide Passivformen gelten.
theological_decisions:
- issue: Bezug von „das Haus“
  choice: Der Tempel ist gemeint, doch der Ausdruck wird wörtlich als „das Haus“ wiedergegeben.
  alternative: der Tempel
  rationale: So bleibt die biblische Ausdrucksweise sichtbar, während die Fußnote den gemeinten Bau eindeutig benennt.
- issue: Funktion der Wendung mit dem König Israels
  choice: 'Agentive Lesart: Der König ließ beziehungsweise führte den Bau aus.'
  alternative: 'Temporale Lesart: „vor der Zeit eines großen und mächtigen Königs Israels“'
  rationale: διά mit Genitiv spricht für die agentive Deutung, und ἔμπροσθεν ἐτῶν πλειόνων bildet am schlüssigsten die Zeitangabe „vor vielen Jahren“. Dadurch bleibt der Satz sowohl grammatisch als auch historisch kohärent, ohne den König ausdrücklich mit Salomo gleichzusetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Satzstruktur bewahrt den sachlichen Berichtston; „erbaut und vollendet“ vermeidet unnötige Wiederholung und gibt die Abfolge von Bauvorgang und Abschluss klar wieder.
