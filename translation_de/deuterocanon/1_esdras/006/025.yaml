    issue: »wo sie gestanden hatten« übersetzt κείμενα zu spezifisch
    rationale: κείμενα kann zwar je nach Gegenstand eine Lage oder Aufstellung bezeichnen, legt aber keine aufrechte Stellung fest. Bei der nicht näher bestimmten Gesamtheit der Tempelgeräte ist »sich befunden hatten« genauer und formneutral.
  - severity: low
    issue: »wieder« in der Schlussklausel ist eine zusätzliche Explikation
    rationale: Die Rückkehr wird bereits durch ἀποκατασταθῆναι und »zurückgebracht« ausgedrückt. τεθῇ besagt lediglich die anschließende Platzierung; ohne »wieder« bleibt die Wiedergabe enger am Wortlaut.
  - severity: low
