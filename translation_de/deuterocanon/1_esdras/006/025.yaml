    rationale: Die Singularform von τεθῇ ist im Kontext auffällig, doch ihr genauer Bezug ist nicht ausdrücklich genannt. Die Anmerkung sollte die grammatische Beobachtung nennen, ohne einen bestimmten singulären Referenten zu behaupten.
