base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/025.yaml
  text: And the holy vessels of the house of the Lord[a], both the gold and the silver ones, which Nebuchadnezzar carried out from the house in Jerusalem and took to Babylon, are to be restored to the house in Jerusalem where they were placed[b], so that they may be set there.
translation:
  language: de
  text: Und die heiligen Geräte des Hauses des Herrn[a], die goldenen wie die silbernen, die Nebukadnezar aus dem Haus in Jerusalem weggeführt und nach Babylon gebracht hatte, sollen in das Haus in Jerusalem zurückgebracht werden, wo sie sich befunden hatten, damit sie dort aufgestellt werden.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit dem »Haus des Herrn« ist der Tempel gemeint.
    reason: lexical_alternative
  - marker: b
    text: Das griechische Verb »aufgestellt werde« steht in der Einzahl. Im Zusammenhang bezieht es sich offenbar zusammenfassend auf die Tempelgeräte.
    reason: textual_ambiguity
lexical_decisions:
- source_word: ἱερὰ σκεύη
  choice: heilige Geräte
  rationale: σκεύη bezeichnet hier die für den heiligen Gebrauch bestimmten Tempelgeräte; »Geräte« ist im Deutschen weiter und treffender als das auf Gefäße verengte »Gefäße«.
- source_word: οἴκου Κυρίου
  choice: Haus des Herrn
  rationale: Bewahrt die konkrete Bildsprache von οἶκος und den biblischen Klang; gemeint ist der Tempel.
- source_word: τά τε χρυσᾶ καὶ ἀργυρᾶ
  choice: die goldenen wie die silbernen
  rationale: Die substantivierten Adjektive beziehen sich auf die zuvor genannten Geräte; die Formulierung vermeidet eine unnötige Wiederholung.
- source_word: ἐξήνεγκεν ... ἀπήνεγκεν εἰς Βαβυλῶνα
  choice: aus ... weggeführt und nach Babylon gebracht hatte
  rationale: Gibt sowohl das Herausnehmen aus dem Jerusalemer Haus als auch den Transport nach Babylon wieder und ordnet den Vorgang zeitlich natürlich vor der angeordneten Rückgabe ein.
- source_word: ἀποκατασταθῆναι
  choice: sollen ... zurückgebracht werden
  rationale: Im Zusammenhang des Erlasses drückt der Infinitiv die angeordnete Rückführung an den früheren Ort aus; »zurückgebracht« ist hier natürlicher als »wiederhergestellt«.
- source_word: οὗ ἦν κείμενα
  choice: wo sie gestanden hatten
  rationale: κείμενα kann »gelegen«, »gestanden« oder »aufgestellt« bedeuten. Bei Tempelgeräten bezeichnet »gestanden hatten« ihren früheren Standort, ohne ihre genaue Form festzulegen.
- source_word: ὅπως τεθῇ ἐκεῖ
  choice: damit sie dort wieder aufgestellt werden
  rationale: Die singularische Verbform hat im Zusammenhang offenbar die Gesamtheit der Geräte im Blick. Der deutsche Plural folgt dem sachlichen Bezugswort; »wieder« verdeutlicht die Rückkehr an den früheren Ort.
- source_word: Ναβουχοδονοσόρ
  choice: Nebukadnezar
  rationale: Die im modernen deutschen Bibelgebrauch etablierte Namensform.
theological_decisions:
- issue: Wiedergabe von κύριος in der Tempelbezeichnung
  choice: Herr
  alternative: HERR
  rationale: Der griechische Ausgangstext hat Κύριος. »Herr« folgt diesem unmittelbar, ohne durch die Schreibweise »HERR« ausdrücklich eine nicht im griechischen Wortlaut sichtbare Wiedergabe des Gottesnamens zu behaupten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt dem griechischen Erlassstil nahe, wird aber durch idiomatische deutsche Zeitformen und klare Richtungsangaben lesbar gehalten.
