base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/017.yaml
  text: And the holy vessels[a], the gold and the silver ones, which Nebuchadnezzar had carried out from the house in Jerusalem and deposited in his own temple—Cyrus the king again brought them out from the temple in Babylon, and they were handed over to Zerubbabel and to Sanabassar the governor.
translation:
  language: de
  text: Und die heiligen Geräte aus Gold und Silber, die Nebukadnezar aus dem Haus in Jerusalem weggebracht und in seinem eigenen Tempel niedergelegt hatte, brachte König Kyros wieder aus dem Tempel in Babylon heraus; und sie wurden Serubbabel und dem Statthalter Sanabassar[a] übergeben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Griechisch Σαβανασσάρ; möglicherweise entspricht diese Namensform dem in Esra meist „Scheschbazzar“ genannten Namen.
    reason: alternative_reading
lexical_decisions:
- source_word: ἱερὰ σκεύη
  choice: die heiligen Geräte
  rationale: „Heilig“ bewahrt die kultische Bedeutung von ἱερά; „Geräte“ ist im Deutschen für Tempelgegenstände natürlicher und weiter als „Gefäße“.
- source_word: τὰ χρυσᾶ καὶ τὰ ἀργυρᾶ
  choice: aus Gold und Silber
  rationale: Die substantivierten Adjektive beziehen sich auf die Geräte. Die idiomatische deutsche Formulierung benennt beide Materialgruppen klar, ohne schwerfällige Wiederholung.
- source_word: ἐξήνεγκεν
  choice: weggebracht / herausholte
  rationale: Das Verb bezeichnet das Herausbringen. Beim ersten Vorkommen gibt „weggebracht hatte“ die zeitliche Vorordnung wieder; beim zweiten bringt „herausholte“ die Umkehrung der früheren Handlung zum Ausdruck.
- source_word: οἴκου τοῦ ἐν Ἰερουσαλήμ
  choice: dem Haus in Jerusalem
  rationale: „Haus“ bewahrt die vom griechischen Text gesetzte Unterscheidung zwischen οἶκος und dem späteren ναός, obwohl sachlich der Tempel gemeint ist.
- source_word: ἀπηρείσατο
  choice: niedergelegt hatte
  rationale: Die Wiedergabe bezeichnet eine bewusste Platzierung beziehungsweise Verwahrung und bleibt gegenüber spezielleren Deutungen wie „eingelagert“ zurückhaltend.
- source_word: ἐν τῷ αὐτοῦ ναῷ
  choice: in seinem eigenen Tempel
  rationale: „Eigenen“ gibt die betonte Besitzangabe αὐτοῦ wieder und hebt den Kontrast zum Haus in Jerusalem hervor.
- source_word: πάλιν
  choice: wieder
  rationale: „Wieder“ markiert die erneute Herausnahme und damit die Umkehrung des früheren Vorgangs.
- source_word: τοῦ ναοῦ τοῦ ἐν Βαβυλωνίᾳ
  choice: aus dem Tempel in Babylon
  rationale: „Tempel“ ist die natürliche Entsprechung für ναός. „Babylon“ ist im Erzählzusammenhang eine verständliche Ortsangabe für Βαβυλωνία.
- source_word: παρεδόθη
  choice: sie wurden ... übergeben
  rationale: Die passive Form bezeichnet die formelle Übergabe der Gegenstände in die Obhut der genannten Personen.
- source_word: Ζοροβαβὲλ
  choice: Serubbabel
  rationale: Dies ist die geläufige deutsche biblische Namensform und entspricht der semitischen Namenstradition.
- source_word: Σαβανασσάρῳ
  choice: Sanabassar
  rationale: Die Hauptlesart folgt der griechischen Namensform, ohne sie stillschweigend an die bekanntere Form aus Esra anzugleichen.
- source_word: τῷ ἐπάρχῳ
  choice: dem Statthalter
  rationale: „Statthalter“ ist im Deutschen eine klare und historisch passende Bezeichnung für den Verwaltungsamtsträger.
theological_decisions:
- issue: Unterscheidung der Bezeichnungen für die Heiligtümer
  choice: οἶκος wird mit „Haus“, ναός mit „Tempel“ wiedergegeben.
  alternative: Beide Begriffe könnten zur leichteren Verständlichkeit mit „Tempel“ übersetzt werden.
  rationale: Die unterschiedliche Wortwahl des griechischen Textes bleibt sichtbar, ohne die sachliche Bedeutung zu verfälschen.
- issue: Namensform Σαβανασσάρ
  choice: Im Haupttext steht „Sanabassar“; die mögliche Entsprechung „Scheschbazzar“ wird in einer Fußnote genannt.
  alternative: Im Haupttext könnte die aus dem Buch Esra geläufige Form „Scheschbazzar“ stehen.
  rationale: Da der griechische Text die primäre Grundlage ist, wird seine Namensform nicht harmonisiert; zugleich hilft die Fußnote bei der Identifikation.
- issue: Zuordnung des Amtstitels τῷ ἐπάρχῳ
  choice: Durch die Wortstellung „dem Statthalter Sanabassar“ wird der Titel Sanabassar zugeordnet.
  alternative: Eine strukturell engere Nachbildung der griechischen Reihenfolge könnte „Serubbabel und Sanabassar, dem Statthalter“ lauten.
  rationale: Beide Fassungen ordnen den Titel grammatisch Sanabassar zu; die gewählte deutsche Wortstellung ist flüssiger und eindeutig.
translation_notes:
  register: Moderne, würdige Standardsprache. Der Satzbau bleibt erzählerisch klar; der Wechsel von „Haus“ zu „Tempel“ folgt bewusst der griechischen Wortwahl. Die Materialangabe wird idiomatisch als „aus Gold und Silber“ formuliert.
