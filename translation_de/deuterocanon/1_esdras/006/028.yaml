base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/028.yaml
  text: and from the tribute of Coele-Syria and Phoenicia[a], support is to be given carefully to these men for sacrifice to the Lord, to Zerubbabel the governor, for bulls and rams and lambs[c][b],
translation:
  language: de
  text: und aus den Steuereinnahmen von Koilesyrien[a] und Phönizien soll diesen Männern gewissenhaft eine Zuwendung[b] zum Opfer für den Herrn gegeben werden, Serubbabel, dem Statthalter[c], für Stiere, Widder und Lämmer,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Koilesyrien“ ist der herkömmliche griechische Name der Region; wörtlich bedeutet die Bezeichnung „Hohlsyrien“.
    reason: cultural_note
  - marker: b
    text: 'Oder: „eine Zuteilung“ beziehungsweise „Unterhalt“. Das griechische σύνταξιν δίδοσθαι bezeichnet eine amtliche Zuwendung oder Versorgung aus den Einnahmen der Provinz.'
    reason: lexical_alternative
  - marker: c
    text: Die griechische Satzfügung bei „Serubbabel, dem Statthalter“ ist gedrängt. Serubbabel kann als Empfänger beziehungsweise Verwalter der Zuwendung gemeint sein; möglich ist auch eine appositionelle Einordnung innerhalb des Erlasses.
    reason: alternative_reading
lexical_decisions:
- source_word: φορολογίας
  choice: Steuereinnahmen
  rationale: Die Wendung ἀπὸ τῆς φορολογίας bezeichnet Mittel aus dem provinzialen Steueraufkommen. „Steuereinnahmen“ gibt die finanzielle Quelle im Deutschen klarer wieder als das enger oder altertümlicher wirkende „Tribut“.
- source_word: κοίλης Συρίας
  choice: Koilesyrien
  rationale: Es handelt sich um einen etablierten griechischen Gebiets- beziehungsweise Provinznamen, nicht um eine frei zu übersetzende Beschreibung.
- source_word: ἐπιμελῶς
  choice: gewissenhaft
  rationale: Das Adverb fordert eine sorgfältige und verlässliche Ausführung der angeordneten Bereitstellung. „Gewissenhaft“ klingt in einem amtlichen Erlass natürlich und bewahrt den Nachdruck.
- source_word: σύνταξιν δίδοσθαι
  choice: eine Zuwendung soll gegeben werden
  rationale: σύνταξις bezeichnet hier eine amtlich festgesetzte Zuteilung oder finanzielle Versorgung. „Zuwendung“ wahrt diesen Verwaltungssinn, ohne die konkrete Form der Leistung zu eng festzulegen.
- source_word: τούτοις τοῖς ἀνθρώποις
  choice: diesen Männern
  rationale: Der griechische Ausdruck steht im maskulinen Plural und bezieht sich im Zusammenhang wahrscheinlich auf bestimmte männliche Amtsträger oder Tempelverantwortliche.
- source_word: εἰς θυσίαν τῷ κυρίῳ
  choice: für Opfer für den Herrn
  rationale: εἰς θυσίαν bezeichnet den Zweck der Mittel. Der Plural „Opfer“ ist im Deutschen für die anschließend aufgezählten Opfertiere natürlich; κυρίῳ wird entsprechend der griechischen Vorlage mit „dem Herrn“ wiedergegeben.
- source_word: Ζοροβάβελ ἐπάρχῳ
  choice: an Serubbabel, den Statthalter
  rationale: Die Wiedergabe lässt Serubbabel als Empfänger oder verwaltenden Amtsträger der Zuwendung erkennen. Eine Fußnote bewahrt die Unsicherheit der gedrängten Dativkonstruktion.
- source_word: ταύρους καὶ κριοὺς καὶ ἄρνας
  choice: Stiere, Widder und Lämmer
  rationale: Die drei Arten von Opfertieren werden einzeln und in derselben Reihenfolge wie im Griechischen genannt.
theological_decisions:
- issue: Wiedergabe von κύριος im judäischen Opferkontext
  choice: der Herr
  alternative: der HERR
  rationale: Die unmittelbare griechische Vorlage hat κυρίῳ. „Der Herr“ folgt diesem Wortlaut, ohne aufgrund des religiösen Zusammenhangs stillschweigend die hebräische Gottesnamenschreibung einzutragen.
- issue: Geschlechtsspezifische Wiedergabe von ἀνθρώποις
  choice: diesen Männern
  alternative: diesen Menschen
  rationale: Der Ausdruck ist grammatisch maskulin und bezeichnet im Zusammenhang wahrscheinlich konkrete männliche Tempel- oder Verwaltungsverantwortliche; die Übersetzung neutralisiert dies daher nicht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit leicht amtlichem Ton, passend zum Charakter eines königlichen Erlasses. Die Satzstruktur bleibt nahe am fortlaufenden griechischen Satz; das abschließende Komma zeigt, dass der Vers syntaktisch in die folgende Bestimmung weiterführt.
