base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/011.yaml
  text: So we questioned them in order to make it known to you and to write to you the names of the men who were leading them[b][a], and we asked them for the list of names of those who were at their head.
translation:
  language: de
  text: Darum befragten wir sie, um dich zu informieren und dir die Namen der Männer aufzuschreiben, die führend waren[a]; und wir baten sie um ein Namensverzeichnis[b] derer, die an ihrer Spitze standen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Bericht erstatteten“. Das griechische Partizip ist ungewöhnlich und kann sowohl das Anführen bzw. Leiten als auch das Darlegen eines Berichts hervorheben.'
    reason: lexical_alternative
  - marker: b
    text: Gemeint ist ein schriftliches Verzeichnis der Namen von Personen, die an der Spitze standen.
    reason: cultural_note
lexical_decisions:
- source_word: ἐπερωτήσαμεν
  choice: befragten wir
  rationale: Das Verb bezeichnet hier ein förmliches Erfragen im Rahmen eines amtlichen Berichts; „befragten“ gibt diesen Ton genauer wieder als das allgemeinere „fragten“.
- source_word: ἕνεκεν τοῦ γνωρίσαι σοι
  choice: um dich zu informieren
  rationale: Die Wendung bezeichnet den Zweck der Befragung. Die Übersetzung ist modernes, natürliches Deutsch und bewahrt die finale Bedeutung.
- source_word: γράψαι σοι τοὺς ἀνθρώπους
  choice: dir schriftlich die Männer zu nennen
  rationale: Das Griechische verbindet das Schreiben unmittelbar mit den Männern. Im Deutschen macht „schriftlich nennen“ verständlich, dass ihre Identität übermittelt werden sollte, ohne ausdrücklich ein im Satz nicht stehendes Wort für „Namen“ einzufügen.
- source_word: τοὺς ἀφηγουμένους
  choice: die die Sache leiteten
  rationale: Das schwierige Partizip kann ein Anführen beziehungsweise Leiten, möglicherweise aber auch das Darlegen eines Berichts bezeichnen. Im Baukontext ist Leitung wahrscheinlich; die verbleibende Mehrdeutigkeit wird in der Fußnote offengelegt.
- source_word: ὀνοματογραφίαν
  choice: Namensverzeichnis
  rationale: Der seltene Ausdruck bezeichnet eine schriftliche Erfassung von Namen. „Namensverzeichnis“ ist präzise, idiomatisch und passt zum amtlichen Zusammenhang.
- source_word: τῶν προκαθηγουμένων
  choice: derer, die an ihrer Spitze standen
  rationale: Das Partizip bezeichnet Personen, die anderen vorstehen. Die relationale Bildsprache des griechischen Ausdrucks bleibt so erhalten.
