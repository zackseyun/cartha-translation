  register: Modernes, würdiges Standarddeutsch mit dem sachlich-amtlichen Ton eines Verwaltungsberichts. Die schwierige Bedeutung von ἀφηγουμένους wird nicht stillschweigend vereindeutigt, sondern durch eine Fußnote transparent gehalten.
