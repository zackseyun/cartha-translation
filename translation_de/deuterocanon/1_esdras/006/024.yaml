base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/024.yaml
  text: Let them offer sacrifices with continual fire, whose height is sixty cubits and width sixty cubits, with three courses of polished stone and one course of new local timber; and let the expense be given from the house of Cyrus the king.
translation:
  language: de
  text: Sie sollen Opfer mit beständigem Feuer darbringen. Seine Höhe soll sechzig Ellen und seine Breite sechzig Ellen betragen.[a] Es soll aus drei Lagen behauener Steine und einer Lage neuen einheimischen Holzes bestehen; die Kosten sollen aus dem Haus des Königs Kyros bestritten werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der griechische Text hat vor den Maßen ein syntaktisch schwer verständliches Relativpronomen. Die folgenden Angaben zu Stein- und Holzlagen zeigen, dass sich Höhe und Breite auf das Bauwerk beziehen.
    reason: Kennzeichnet die auffällige und textkritisch beziehungsweise syntaktisch unsichere Bezugnahme, ohne den vermuteten Bezug als sichere Lesart auszugeben.
lexical_decisions:
- source_word: θύουσιν
  choice: sie sollen Opfer darbringen
  rationale: Im Zusammenhang des königlichen Erlasses ist die griechische Präsensform als Anweisung wiedergegeben; »Opfer darbringen« bezeichnet die kultische Handlung klar und würdig.
- source_word: διὰ πυρὸς ἐνδελεχοῦς
  choice: mit beständigem Feuer
  rationale: Bewahrt die instrumentale Präposition und den Gedanken eines fortdauernden Feuers, ohne ihn näher kultisch auszudeuten.
- source_word: πηχέων ἑξήκοντα
  choice: sechzig Ellen
  rationale: Die antike Maßeinheit πήχυς wird traditionsgemäß und verständlich mit »Elle« wiedergegeben.
- source_word: δόμων λιθίνων ξυστῶν τριῶν
  choice: drei Lagen behauener Steine
  rationale: δόμος bezeichnet hier eine bauliche Lage beziehungsweise Reihe; ξυστός meint bearbeitet oder behauen, nicht zwingend im modernen Sinn poliert.
- source_word: δόμου ξυλίνου ἐγχωρίου καινοῦ ἑνός
  choice: einer Lage neuen einheimischen Holzes
  rationale: Gibt Anzahl, Material, Herkunft und Neuheit des Holzes vollständig wieder; »Lage« stellt die Parallelität zu den Steinlagen her.
- source_word: τὸ δαπάνημα δοθῆναι ἐκ τοῦ οἴκου Κύρου τοῦ βασιλέως
  choice: die Kosten sollen aus dem Haus des Königs Kyros bestritten werden
  rationale: »Haus« bewahrt οἶκος und kann hier den königlichen Haushalt beziehungsweise Schatz bezeichnen; »bestritten werden« ist im Deutschen die natürliche Wendung für die Finanzierung.
theological_decisions:
- issue: Bezug des Maßsatzes nach οὓ
  choice: Das implizit aus dem Kontext vorausgesetzte Bauwerk wird mit »seine Höhe« und »seine Breite« aufgenommen.
  alternative: Das griechische Relativpronomen mechanisch mit »deren« oder »welche« wiedergeben.
  rationale: Die überlieferte Form οὓ ist syntaktisch schwierig und kann nicht sinnvoll auf die Opfernden oder Opfer bezogen werden. Der parallele Erlasstext und die folgenden Bauangaben zeigen, dass die Maße dem Gotteshaus gelten; die Übersetzung macht nur den für deutsches Verständnis nötigen Anschluss sichtbar, ohne eine zusätzliche theologische Deutung einzuführen.
- issue: Bedeutung des beständigen Feuers
  choice: Die Wendung bleibt sachlich als »beständiges Feuer« stehen.
  alternative: Sie ausdrücklich als tägliches, ewiges oder ununterbrochenes Opferfeuer bestimmen.
  rationale: Der griechische Ausdruck bezeichnet Fortdauer, legt aber die genauere kultische Einordnung nicht eindeutig fest.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die langen griechischen Satzglieder werden zur besseren Verständlichkeit in drei Sätze gegliedert. Die altertümliche Maßeinheit »Elle« und der Titel »König« bleiben erhalten; unnötige Verwaltungs- oder Fachsprache wird vermieden.
