base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/012.yaml
  text: But they answered us[a], saying, “We are servants of the Lord, who created heaven and earth.”
translation:
  language: de
  text: 'Sie aber antworteten uns: „Wir sind Diener des Herrn, der Himmel und Erde erschaffen hat.“[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wir sind Kinder des Herrn, der Himmel und Erde erschaffen hat.“ Das griechische Wort kann sowohl „Kinder“ als auch „Diener“ bedeuten; hier spricht der Zusammenhang eher für den Dienst als für die Kindschaft.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθησαν ἡμῖν λέγοντες
  choice: antworteten uns
  rationale: Die geläufige deutsche Erzählform gibt das Antworten und den Adressaten vollständig wieder; λέγοντες muss dabei nicht zusätzlich mit „und sagten“ ausgedrückt werden.
- source_word: παῖδες
  choice: Diener
  rationale: Das Wort kann sowohl Kinder als auch Diener bezeichnen. Im administrativen Zusammenhang kennzeichnen sich die Sprecher als Menschen, die im Dienst Gottes stehen; „Diener“ ist daher im Haupttext am wahrscheinlichsten.
- source_word: τοῦ κυρίου
  choice: des Herrn
  rationale: „Herr“ entspricht dem jüdisch-schriftsprachlichen Gebrauch von κύριος für Gott und wahrt den würdevollen Registerton.
- source_word: τοῦ κτίσαντος
  choice: der … erschaffen hat
  rationale: Das substantivisch bezogene Partizip bestimmt den Herrn durch sein Schöpfungshandeln näher; der deutsche Relativsatz ist klar und quellennah.
- source_word: τὸν οὐρανὸν καὶ τὴν γῆν
  choice: Himmel und Erde
  rationale: Die feste biblische Wortverbindung bezeichnet die gesamte geschaffene Welt und klingt im Deutschen natürlich.
theological_decisions:
- issue: Bedeutung von παῖδες in der Beziehung zu Gott
  choice: Diener
  alternative: Kinder
  rationale: Der Zusammenhang legt Dienstzugehörigkeit näher als eine Aussage über Kindschaft. Da der griechische Ausdruck beide Bedeutungen zulässt, wird die Alternative in einer Fußnote bewahrt.
- issue: Wiedergabe von κύριος als Gottesbezeichnung
  choice: Herr
  alternative: Gebieter
  rationale: „Herr“ wahrt die etablierte biblische Gottesbezeichnung, ohne eine zusätzliche konfessionelle Deutung einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das einleitende δέ wird mit „aber“ wiedergegeben; λέγοντες ist idiomatisch in den Doppelpunkt und die direkte Rede integriert. Die echte Mehrdeutigkeit von παῖδες bleibt durch die Fußnote sichtbar.
