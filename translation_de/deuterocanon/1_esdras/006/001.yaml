base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/001.yaml
  text: In the second year of the reign of Darius[a], Haggai and Zechariah son of Iddo, the prophets, prophesied to the Jews who were in Judea and Jerusalem in the name of the Lord God of Israel[c][b], to them.
translation:
  language: de
  text: Im zweiten Jahr der Herrschaft des Darius prophezeiten Haggai und Sacharja, der Sohn Iddos, die Propheten,[c] den Juden in Judäa[a] und Jerusalem im Namen des Herrn, des Gottes Israels, über sie.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in Juda und Jerusalem“, entsprechend dem aramäischen Paralleltext; der griechische Text hat „Judäa und Jerusalem“.'
    reason: lexical_alternative
  - marker: b
    text: Die knappe Schlusswendung „über sie“ kann auch im Sinn von „an sie“ oder „sie betreffend“ verstanden werden. Sowohl der griechische als auch der aramäische Paralleltext bewahren hier eine mehrdeutige Formulierung.
    reason: alternative_reading
  - marker: c
    text: Im griechischen Text steht der Artikel vor „Propheten“ doppelt („die die Propheten“), wahrscheinlich aufgrund einer Unregelmäßigkeit der Textüberlieferung. Übersetzt ist der erkennbare Sinn.
    reason: textual_variant
lexical_decisions:
- source_word: Ἐν δὲ τῷ δευτέρῳ ἔτει τῆς Δαρείου βασιλείας
  choice: Im zweiten Jahr der Herrschaft des Darius
  rationale: Die temporale Angabe wird direkt wiedergegeben. δέ ist hier nur leicht verbindend und braucht im Deutschen kein eigenes Wort; βασιλεία bezeichnet in diesem Zusammenhang die Herrschaftszeit.
- source_word: ἐπροφήτευσεν
  choice: prophezeiten
  rationale: Das Verb bezeichnet die Tätigkeit prophetischen Redens. Trotz des griechischen Singulars verlangt das zusammengesetzte Subjekt im natürlichen Deutschen den Plural.
- source_word: Ἀγγαῖος καὶ Ζαχαρίας ὁ τοῦ Ἐδδεὶν
  choice: Haggai und Sacharja, der Sohn Iddos
  rationale: Die Vatersangabe bezieht sich grammatisch am ehesten nur auf Sacharja. Die Namen folgen den geläufigen deutschen biblischen Formen; der semitische Paralleltext bestätigt Iddo.
- source_word: οἱ οἱ προφῆται
  choice: die Propheten
  rationale: Der doppelte Artikel ist offenbar eine Überlieferungsunregelmäßigkeit. Gemeint ist eine pluralische Apposition zu Haggai und Sacharja.
- source_word: ἐπὶ τοὺς Ἰουδαίους
  choice: den Juden
  rationale: Bei prophetischem Reden bezeichnet ἐπί hier die Adressaten. Der Dativ ist im Deutschen die natürlichste Wiedergabe und vermeidet die unbegründet feindselige Lesart „gegen die Juden“.
- source_word: τοὺς ἐν τῇ Ἰουδαίᾳ καὶ Ἰερουσαλήμ
  choice: in Judäa und Jerusalem
  rationale: Ἰουδαία wird nach dem griechischen Haupttext als „Judäa“ wiedergegeben; der aramäische Paralleltext hat „Juda“.
- source_word: ἐπὶ τῷ ὀνόματι Κυρίου θεοῦ Ἰσραήλ
  choice: im Namen des Herrn, des Gottes Israels
  rationale: Die Wendung bezeichnet die göttliche Beauftragung. „des Gottes Israels“ wird als Apposition zu „des Herrn“ verstanden, ohne die Titel zu verschmelzen.
- source_word: ἐπ’ αὐτούς
  choice: über ihnen
  rationale: Die knappe Schlusswendung wird bewusst formal und mehrdeutig wiedergegeben. Sie kann eine über ihnen stehende prophetische beziehungsweise göttliche Autorität anzeigen, lässt sich aber auch adressatenbezogen oder thematisch verstehen.
theological_decisions:
- issue: Wiedergabe von Κυρίου im jüdisch-schriftlichen griechischen Kontext
  choice: Herrn
  alternative: HERRN; Gebieters
  rationale: Der griechische Haupttext hat κύριος. „Herr“ ist die direkte, konfessionell neutrale deutsche Wiedergabe; die typografische Form „HERR“ würde die hebräische Ausgangsform ausdrücklich voraussetzen.
- issue: Beziehung der Prophetie zu den Juden in den beiden ἐπί-Wendungen
  choice: den Juden … über ihnen
  alternative: gegen die Juden …; über die Juden; zu ihnen
  rationale: Die erste Wendung wird als Angabe der Adressaten wiedergegeben. Bei der wiederholten Schlusswendung bleibt die verdichtete und theologisch offene Form des griechischen und aramäischen Zeugnisses erhalten, statt sie eindeutig als Anrede, Thema oder Herrschaftsverhältnis festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit weitgehend formaler Satzführung. Die ungewöhnliche Schlussformulierung bleibt zur Wahrung der echten Mehrdeutigkeit stehen und wird durch eine Fußnote erläutert.
