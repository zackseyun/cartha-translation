base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/021.yaml
  text: And if it is found that the building of the house of the Lord in Jerusalem was done with the approval of Cyrus the king[a], and if it seems good to our lord the king, let him send us word about these matters.
translation:
  language: de
  text: Und wenn sich herausstellt, dass der Bau des Hauses des Herrn in Jerusalem mit der Zustimmung des Königs Kyros ausgeführt wurde[a], und wenn unser Herr, der König, es für gut befindet, soll er uns darüber Nachricht geben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Griechisch wörtlich etwa: »der Bau des Herrn in Jerusalem«; dem Zusammenhang nach ist der Bau des Hauses beziehungsweise Tempels des Herrn gemeint.'
    reason: Der griechische Text nennt nach »Bau« nicht ausdrücklich »Haus« oder »Tempel«; die Ergänzung dient der Verständlichkeit und wird transparent gemacht.
lexical_decisions:
- source_word: ἐὰν εὑρίσκηται
  choice: wenn sich herausstellt
  rationale: Gibt die bedingte Passivform natürlich wieder und passt zu einer amtlichen Feststellung durch Nachforschung oder Akteneinsicht.
- source_word: μετὰ τῆς γνώμης Κύρου τοῦ βασιλέως
  choice: mit der Zustimmung des Königs Kyros
  rationale: γνώμη bezeichnet hier im königlich-administrativen Zusammenhang Zustimmung oder Autorisierung, nicht bloß eine private Meinung.
- source_word: γενομένην τὴν οἰκοδομήν
  choice: dass der Bau … ausgeführt wurde
  rationale: Bewahrt den Bezug auf das Bauvorhaben und gibt das Partizip γενομένην idiomatisch als vollzogene Handlung wieder, ohne ausdrücklich einen Wiederaufbau einzutragen.
- source_word: τοῦ κυρίου τοῦ ἐν Ἰερουσαλήμ
  choice: des Hauses des Herrn in Jerusalem
  rationale: Der überlieferte griechische Wortlaut lautet wörtlich etwa »des Herrn in Jerusalem«; aus dem Tempelbaukontext wird zur Verständlichkeit »Hauses« ergänzt.
- source_word: κρίνηται τῷ κυρίῳ βασιλεῖ ἡμῶν
  choice: wenn unser Herr, der König, es für gut befindet
  rationale: κρίνηται bezeichnet hier, was der König für angemessen hält; die Formulierung erhält zugleich den höfischen Ehrentitel κύριος.
- source_word: προσφωνησάτω ἡμῖν περὶ τούτων
  choice: soll er uns darüber Nachricht geben
  rationale: Im amtlichen Briefkontext bedeutet das Verb, eine Mitteilung oder Antwort zukommen zu lassen; »darüber« nimmt die genannten Angelegenheiten knapp auf.
theological_decisions:
- issue: κύριος bezeichnet im selben Vers sowohl Gott als auch den König
  choice: »Herr« als Gottesbezeichnung und »Herr« als königlicher Ehrentitel, durch Satzbau und Bezug unterschieden
  alternative: Für den König »Gebieter« oder »Herrscher«, für Gott »Herr«
  rationale: Das Deutsche kann denselben lexikalischen Ausdruck in beiden Funktionen bewahren. »Unser Herr, der König« macht den weltlichen Bezug eindeutig, während »Haus des Herrn« die Gottesbezeichnung trägt.
- issue: Ergänzung von »Haus« beim Bau des Herrn
  choice: »Bau des Hauses des Herrn« im Haupttext, mit textkritisch-lexikalischer Fußnote
  alternative: Wörtlicher »Bau des Herrn« oder deutender »Bau des Tempels des Herrn«
  rationale: Der griechische Wortlaut ist verkürzt oder elliptisch. Der Zusammenhang verlangt ein Bauwerk des Herrn; »Haus« wahrt biblische Ausdrucksweise und deutet weniger eng als »Tempel«, während die Fußnote die Form des Ausgangstextes offenlegt.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit amtlich-höfischem Ton. »Kyros« folgt der geläufigen deutschen Namensform. Der Satzbau bewahrt die beiden Bedingungen und die anschließende Bitte des griechischen Textes.
