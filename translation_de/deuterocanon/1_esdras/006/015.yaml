base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/015.yaml
  text: They also tore down the house and burned it[a], and they took the people captive to Babylon.
translation:
  language: de
  text: Sie rissen auch das Haus[a] nieder und steckten es in Brand; das Volk führten sie gefangen nach Babylon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint ist das Haus Gottes, also der Tempel.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἶκον
  choice: das Haus
  rationale: Die wörtliche Wiedergabe bewahrt den griechischen Ausdruck und den biblischen Sprachgebrauch für das Haus Gottes; gemeint ist in diesem Zusammenhang der Tempel.
- source_word: καθελόντες
  choice: rissen … nieder
  rationale: Das Partizip bezeichnet das Niederreißen oder Abtragen eines Bauwerks. „Niederreißen“ ist im modernen Deutschen natürlich und gibt die gewaltsame Zerstörung deutlich wieder.
- source_word: ἐνεπύρισαν
  choice: steckten es in Brand
  rationale: Das Verb bedeutet, etwas in Brand zu setzen oder zu verbrennen. Die gewählte Formulierung gibt die gezielte Handlung präzise und idiomatisch wieder.
- source_word: λαὸν
  choice: das Volk
  rationale: Die kollektive Bezeichnung wird direkt und im Deutschen bibelsprachlich vertraut wiedergegeben.
- source_word: ᾐχμαλώτευσαν
  choice: führten sie gefangen
  rationale: Die Wendung bewahrt das Bild der Gefangennahme und Wegführung, ohne es auf den abstrakteren Begriff „ins Exil schicken“ zu verengen.
- source_word: εἰς Βαβυλῶνα
  choice: nach Babylon
  rationale: Dies ist die übliche deutsche Richtungsangabe und passt zum Zusammenhang der Wegführung.
theological_decisions:
- issue: Bezug von „das Haus“
  choice: Im Haupttext steht „das Haus“; gemeint ist das Haus Gottes, also der Tempel.
  alternative: den Tempel
  rationale: Der griechische Text verwendet οἶκος („Haus“) und nicht eine ausdrücklichere Bezeichnung für den Tempel. Die wörtliche Form bewahrt den biblischen Ausdruck, während die Fußnote den Bezug erläutert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Parallelismus der beiden Zerstörungshandlungen wird durch das Semikolon klar gegliedert; die vorangestellte Objektphrase „das Volk“ wahrt die enge Anlehnung an die griechische Satzstruktur, ohne unnatürlich zu wirken.
