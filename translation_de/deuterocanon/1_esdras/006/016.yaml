base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/016.yaml
  text: In the first year of Cyrus reigning over the land of Babylonia, King Cyrus wrote that this house should be built,
translation:
  language: de
  text: Im ersten Jahr, als Kyros über das Land Babylonien herrschte, schrieb[a] König Kyros, dieses Haus[b] solle gebaut werden,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder sinngemäß: »ordnete König Kyros schriftlich an«. Wörtlich steht im Griechischen »schrieb … zu bauen«; im Zusammenhang ist damit eine königliche schriftliche Anordnung gemeint.'
    reason: lexical_alternative
  - marker: b
    text: Mit »dieses Haus« ist der Tempel in Jerusalem gemeint.
    reason: cross_reference
lexical_decisions:
- source_word: ἐν δὲ τῷ πρώτῳ ἔτει
  choice: Im ersten Jahr
  rationale: ἐν mit dem Dativ bezeichnet den Zeitpunkt. Das leicht verbindende δέ braucht hier im Deutschen kein eigenes Wort.
- source_word: βασιλεύοντος Κύρου χώρας Βαβυλωνίας
  choice: als Kyros über das Land Babylonien herrschte
  rationale: Der Genitivus absolutus wird als natürlicher temporaler Nebensatz wiedergegeben. χώρα bezeichnet das Land beziehungsweise Herrschaftsgebiet, nicht nur die Stadt Babylon.
- source_word: ἔγραψεν βασιλεὺς Κῦρος
  choice: schrieb König Kyros
  rationale: Die einfache Bedeutung von ἔγραψεν bleibt erhalten; der amtliche Charakter des Schreibens wird nicht durch einen ausdrücklich ungenannten Begriff wie »Erlass« in den Haupttext eingetragen.
- source_word: οἰκοδομῆσαι
  choice: solle gebaut werden
  rationale: Der Infinitiv gibt im Zusammenhang den Inhalt der königlichen schriftlichen Anordnung wieder. Der deutsche Konjunktiv I macht diese abhängige Aussage idiomatisch deutlich.
- source_word: τὸν οἶκον τοῦτον
  choice: dieses Haus
  rationale: οἶκος bedeutet wörtlich »Haus«. Der Tempel ist gemeint, doch die kultische Redeweise des griechischen Textes bleibt im Haupttext erhalten.
theological_decisions:
- issue: Bezug von »dieses Haus«
  choice: Im Haupttext steht »dieses Haus«.
  alternative: »dieser Tempel«
  rationale: Der Zusammenhang bezeichnet den Tempel in Jerusalem, aber das griechische οἶκος wird nicht erklärend aufgelöst.
- issue: Amtliche Tragweite des Schreibens
  choice: Das Verb wird mit »schrieb« wiedergegeben.
  alternative: »erließ den Befehl« oder »ordnete schriftlich an«
  rationale: Das königliche Schreiben hat im Zusammenhang Anordnungscharakter; dennoch nennt der griechische Wortlaut ausdrücklich nur das Schreiben. Die Fußnote erläutert die mögliche sinngemäße Wiedergabe.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der temporale Genitivus absolutus ist zur besseren Verständlichkeit als Nebensatz formuliert; der schlichte Wortlaut »schrieb« und die Bezeichnung »Haus« bewahren zugleich die Ausdrucksweise und Spannung des griechischen Textes.
