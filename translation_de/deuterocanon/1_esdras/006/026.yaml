base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/026.yaml
  text: He also ordered Sisinnes[a], governor of Syria and Phoenicia, and Sathrabuzanes and their associates and the appointed governors in Syria and Phoenicia, to keep away from the place, but to leave Zerubbabel, the servant of the Lord and governor of Judea, and the elders of the Jews alone.
translation:
  language: de
  text: Außerdem befahl er Sisinnes, dem Statthalter von Syrien und Phönizien, Sathrabuzanes, ihren Amtsgenossen und den in Syrien und Phönizien eingesetzten Statthaltern, sich von dem Ort fernzuhalten und Serubbabel, den Diener des Herrn und Statthalter von Judäa, sowie die Ältesten der Juden gewähren zu lassen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „… und Serubbabel, den Diener des Herrn und Statthalter von Judäa, sowie die Ältesten der Juden in Ruhe zu lassen.“ Das griechische Wort bedeutet wörtlich „lassen“ oder „erlauben“; im Zusammenhang geht es darum, dass die Amtsträger nicht eingreifen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσετάξεν ... ἐπιμεληθῆναι
  choice: trug ... auf, dafür zu sorgen
  rationale: Die Wendung bezeichnet einen verbindlichen amtlichen Auftrag. Die deutsche Fassung gibt beide griechischen Verben idiomatisch wieder, ohne die Konstruktion unnötig zu verdoppeln.
- source_word: ἐπάρχῳ
  choice: Statthalter
  rationale: Das Wort bezeichnet hier den Verwalter beziehungsweise Herrscher einer Provinz; „Statthalter“ ist im historischen Verwaltungskontext verständlich und angemessen.
- source_word: συνεταίροις
  choice: Amtsgenossen
  rationale: Im behördlichen Zusammenhang sind Mitwirkende oder Kollegen gemeint, nicht persönliche Gefährten.
- source_word: ἀποτεταγμένοις ... ἡγεμόσιν
  choice: eingesetzten Statthaltern
  rationale: „Eingesetzt“ bewahrt den Sinn des Partizips, während „Statthalter“ die amtliche Leitungsfunktion der ἡγεμόνες ausdrückt.
- source_word: ἀπέχεσθαι τοῦ τόπου
  choice: sich von dem Ort fernhalten
  rationale: Die Übersetzung bewahrt die räumliche Ausdrucksweise des Griechischen; im Kontext schließt sie amtliche Nichteinmischung ein.
- source_word: ἐᾶσαι
  choice: gewähren lassen
  rationale: ἐάω kann „lassen“, „erlauben“ oder „in Ruhe lassen“ bedeuten. „Gewähren lassen“ bringt die geforderte Nichteinmischung natürlich zum Ausdruck, ohne den Fortgang ausdrücklich zu ergänzen.
- source_word: παῖδα Κυρίου
  choice: Diener des Herrn
  rationale: παῖς kann Kind oder Diener bedeuten; in dieser ehrenden biblisch-amtlichen Bezeichnung ist „Diener“ kontextuell am wahrscheinlichsten.
- source_word: ὕπαρχον
  choice: Statthalter
  rationale: Das Wort bezeichnet Serubbabel als Amtsträger mit Herrschafts- beziehungsweise Verwaltungsgewalt in Judäa.
- source_word: πρεσβυτέρους
  choice: Ältesten
  rationale: Gemeint sind anerkannte jüdische Gemeindeleiter, nicht lediglich ältere Männer.
theological_decisions:
- issue: Wiedergabe von κύριος in παῖδα Κυρίου
  choice: Herr
  alternative: Gebieter
  rationale: „Herr“ bewahrt die ehrfürchtige biblische Gottesbezeichnung und entspricht dem jüdisch-schriftlichen Kontext.
- issue: Bedeutung von παῖς als Bezeichnung Serubbabels
  choice: Diener
  alternative: Kind
  rationale: Die Bezeichnung ist hier ehrenvoll und auf das Verhältnis zu Gott bezogen, nicht als biologische Alters- oder Abstammungsangabe zu verstehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit historisch-administrativem Wortschatz. Die verschachtelte griechische Amtsliste wurde in einer gut lesbaren deutschen Satzstruktur bewahrt. Der Fußnotenmarker steht unmittelbar bei der inhaltlich mehrdeutigen Wiedergabe von ἐᾶσαι.
