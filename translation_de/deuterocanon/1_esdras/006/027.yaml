base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/027.yaml
  text: And I also gave orders that it be fully rebuilt[a], and that attention be given so that they may work together with those from the captivity of Judea until the house of the Lord is finished[b];
translation:
  language: de
  text: Auch habe ich angeordnet, den Bau vollständig auszuführen und darauf zu achten,[a] dass sie mit denen aus der Gefangenschaft Judäas[b] zusammenarbeiten, bis das Haus des Herrn vollendet ist;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich bedeutet das hier verwendete Verb „aufmerksam hinsehen“; in diesem Zusammenhang kann es heißen: „darauf achten“ oder „dafür Sorge tragen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „mit den Verbannten aus Judäa“. Der griechische Ausdruck bezeichnet wörtlich diejenigen, die aus der Gefangenschaft beziehungsweise dem Exil Judäas stammen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀγὼ δὲ
  choice: Auch habe ich
  rationale: Gibt den weiterführenden und zugleich additiven Sinn der königlichen Ich-Aussage in natürlichem Deutsch wieder.
- source_word: ἐπέταξα
  choice: habe ich angeordnet
  rationale: Bezeichnet einen verbindlichen, autoritativen Befehl, ohne zwingend einen förmlichen Erlass vorauszusetzen.
- source_word: ὁλοσχερῶς οἰκοδομῆσαι
  choice: dass es vollständig wieder aufgebaut wird
  rationale: Bewahrt den Gedanken der vollständigen Ausführung; „wieder aufgebaut“ entspricht dem Zusammenhang des bereits begonnenen Tempelbaus, während das Objekt aus dem Kontext erschlossen bleibt.
- source_word: ἀτενίσαι
  choice: dass man dafür sorgt
  rationale: Das Verb bedeutet wörtlich „aufmerksam hinsehen“, hat hier aber plausibel den administrativen Sinn, auf die Durchführung zu achten.
- source_word: ἵνα συνποιῶσιν
  choice: dass sie … zusammenarbeiten
  rationale: Wahrt sowohl den Zweck-/Inhaltssatz als auch den gemeinschaftlichen Sinn des zusammengesetzten Verbs, ohne die nicht ausdrücklich genannten Handelnden näher festzulegen.
- source_word: τοῖς ἐκ τῆς αἰχμαλωσίας τῆς Ἰουδαίας
  choice: mit denen aus der Gefangenschaft Judäas
  rationale: Folgt der griechischen Formulierung eng und bezeichnet die aus dem judäischen Exil beziehungsweise der Gefangenschaft Gekommenen.
- source_word: μέχρι τοῦ ἐπιτελεσθῆναι
  choice: bis … vollendet ist
  rationale: Drückt die zeitliche Fortdauer bis zum vollständigen Abschluss aus.
- source_word: τὸν οἶκον τοῦ κυρίου
  choice: das Haus des Herrn
  rationale: Bewahrt das biblische Bild „Haus“ für den Tempel und gibt das griechische κύριος mit „Herr“ wieder.
theological_decisions:
- issue: Wiedergabe von κύριος in der Bezeichnung des Tempels
  choice: Herr
  alternative: HERR
  rationale: Die griechische Textgrundlage hat κυρίου. Da hier nicht unmittelbar das hebräische Tetragramm als Ausgangstext vorliegt, wird „Herr“ verwendet, ohne die Form „HERR“ aus einer hebräischen Vorlage einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die königliche Anordnung bleibt verbindlich formuliert; das unbestimmte „sie“ wird beibehalten, statt die im Vers nicht ausdrücklich genannten Handelnden zu identifizieren. Die beiden Fußnotenmarker stehen unmittelbar bei den jeweils erläuterten Ausdrücken.
