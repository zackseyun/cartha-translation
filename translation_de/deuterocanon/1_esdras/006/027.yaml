  to: Auch habe ich angeordnet, den Bau vollständig auszuführen und darauf zu achten,[a] dass sie mit denen aus der Gefangenschaft Judäas[b] zusammenarbeiten, bis das Haus des Herrn vollendet ist;
  rationale: Die Revision entfernt ausschließlich die nicht ausdrücklich im griechischen Wortlaut enthaltene Aussage eines Wiederaufbaus. „Den Bau vollständig auszuführen“ macht das aus dem Kontext erschließbare, aber im ersten Infinitiv nicht erneut genannte Bauobjekt im Deutschen verständlich, ohne eine zusätzliche historische Behauptung einzuführen. Die Fußnotenanker bleiben unmittelbar bei den erläuterten Wendungen.
