base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/023.yaml
  text: In the first year of the reign of Cyrus[a], King Cyrus gave orders that the house of the Lord in Jerusalem should be built, where they offer continual sacrifices by fire,
translation:
  language: de
  text: Im ersten Jahr der Herrschaft des Kyrus befahl König Kyrus, das Haus des Herrn in Jerusalem zu bauen, wo man mit unablässigem Feuer Opfer darbringt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wo man fortwährend Feueropfer darbringt“. Die griechische Wendung ist knapp und kann den Ort als Stätte regelmäßig fortgesetzter Feueropfer beschreiben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔτους πρώτου βασιλεύοντος Κύρου
  choice: Im ersten Jahr der Herrschaft des Kyrus
  rationale: Die griechische Zeitangabe wird als im Deutschen übliche Datierung nach dem Regierungsjahr wiedergegeben.
- source_word: βασιλεὺς Κῦρος
  choice: König Kyrus
  rationale: Die deutsche Titel-Namen-Folge gibt den ausdrücklich genannten Königstitel natürlich wieder.
- source_word: προσέταξεν
  choice: befahl
  rationale: Das Verb bezeichnet eine verbindliche Anordnung; „befahl“ ist prägnant und legt nicht eigens einen förmlichen Erlass nahe.
- source_word: τὸν οἶκον τοῦ κυρίου
  choice: das Haus des Herrn
  rationale: „Haus“ bewahrt das Bild des griechischen οἶκος, das hier den Tempel bezeichnet; κύριος wird quellennah mit „Herr“ wiedergegeben.
- source_word: τὸν ἐν Ἰερουσαλήμ
  choice: in Jerusalem
  rationale: Die attributive Ortsangabe wird in natürlicher deutscher Wortstellung wiedergegeben.
- source_word: οἰκοδομῆσαι
  choice: zu bauen
  rationale: Der Infinitiv bezeichnet den Inhalt des Befehls. Da das Haus grammatisch als Akkusativobjekt vorangeht, ist die deutsche Konstruktion eindeutig und flüssig.
- source_word: ὅπου
  choice: wo
  rationale: Die einfache Ortsrelation des griechischen Relativadverbs bleibt erhalten.
- source_word: ἐπιθύουσιν
  choice: man … Opfer darbringt
  rationale: Die unbestimmte dritte Person Plural wird im Deutschen idiomatisch mit „man“ wiedergegeben; „Opfer darbringen“ macht den kultischen Sinn des Verbs deutlich.
- source_word: διὰ πυρὸς ἐνδελεχοῦς
  choice: mit unablässigem Feuer
  rationale: 'Die kompakte griechische Wendung wird eng an ihrer grammatischen Form wiedergegeben: ἐνδελεχοῦς bestimmt „Feuer“ und bezeichnet dessen fortdauernden Charakter. Die Fußnote wahrt eine alternative syntaktisch-sachliche Auffassung.'
theological_decisions:
- issue: Wiedergabe von κύριος im Tempelkontext
  choice: Herr
  alternative: HERR
  rationale: Die griechische Vorlage hat κύριος. Da hier ein griechischer deuterokanonischer Text und nicht unmittelbar das hebräische Tetragramm übersetzt wird, steht im Haupttext „Herr“.
- issue: Bezug von ἐνδελεχοῦς in der Opferformel
  choice: unablässiges Feuer
  alternative: fortwährend dargebrachte Feueropfer
  rationale: Grammatisch stimmt das Adjektiv mit πυρός („Feuer“) überein. Zugleich kann die knappe kultische Formulierung sachlich auf regelmäßig fortgesetzte Feueropfer zielen; diese Spannung wird nicht dogmatisch aufgelöst, sondern in der Fußnote kenntlich gemacht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kultische Sprache bleibt verständlich und quellennah; die ungewöhnlich knappe Schlusswendung wird im Haupttext formal bewahrt und durch eine Fußnote erläutert.
