base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/014.yaml
  text: And because our fathers[a], having provoked him, sinned against the Lord of Israel, the heavenly One, he gave them into the hands of Nebuchadnezzar king of Babylon, king of the Chaldeans;
translation:
  language: de
  text: Und weil unsere Väter ihn zum Zorn gereizt und gegen den Herrn Israels, den Himmlischen[a], gesündigt hatten, gab er sie in die Hände Nebukadnezars, des Königs von Babylon, des Königs der Chaldäer;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den Gott des Himmels“. Im Griechischen steht wörtlich „den Himmlischen“; verwandte Esra-Überlieferungen verwenden häufig den ausführlicheren Titel „Gott des Himmels“.'
    reason: Bewahrt die ungewöhnliche Form des griechischen Haupttextes und dokumentiert zugleich die traditionsgeschichtlich naheliegende Alternative.
lexical_decisions:
- source_word: ἐπεὶ
  choice: weil
  rationale: Die Konjunktion leitet hier den Grund für das folgende Gericht und Exil ein.
- source_word: οἱ πατέρες ἡμῶν
  choice: unsere Väter
  rationale: Bewahrt die familiär-geschichtliche Ausdrucksweise des Griechischen und ist im biblischen Erzählregister verständlich.
- source_word: παραπικράναντες
  choice: ihn erbitterten
  rationale: Gibt das aktive Partizip mit seiner Bedeutung des Reizens beziehungsweise Erbitterens wieder. Das im Griechischen unausgesprochene Objekt wird aus dem Zusammenhang als Gott erschlossen.
- source_word: ἥμαρτον εἰς
  choice: sündigten gegen
  rationale: Im Deutschen ist „gegen jemanden sündigen“ die natürliche Wiedergabe dieser Verbindung.
- source_word: τὸν κύριον τοῦ Ἰσραήλ
  choice: den Herrn Israels
  rationale: Folgt dem griechischen Wortlaut, ohne aus verwandten Überlieferungen zusätzlich „Gott“ einzufügen.
- source_word: τὸν οὐράνιον
  choice: den Himmlischen
  rationale: Das substantivierte Adjektiv steht appositionell zu „Herrn Israels“. Die Wiedergabe bewahrt die ungewöhnliche, aber verständliche Form des griechischen Hauptzeugen.
- source_word: παρέδωκεν αὐτοὺς εἰς χεῖρας
  choice: gab er sie in die Hände
  rationale: Bewahrt das klare biblische Idiom für die Auslieferung in fremde Gewalt.
- source_word: Ναβουχοδονοσόρ
  choice: Nebukadnezar
  rationale: Verwendet die im Deutschen übliche Namensform des babylonischen Königs.
- source_word: βασιλέως Βαβυλῶνος, βασιλέως τῶν Χαλδαίων
  choice: des Königs von Babylon, des Königs der Chaldäer
  rationale: Behält beide im Griechischen wiederholten Königstitel bei.
theological_decisions:
- issue: Gottesbezeichnung τὸν οὐράνιον
  choice: den Himmlischen
  alternative: den Gott des Himmels
  rationale: Der maßgebliche griechische Text enthält ein substantiviertes Adjektiv und nicht ausdrücklich das Wort „Gott“. Die Hauptübersetzung bewahrt diese Form; die aus verwandter Esra-Überlieferung bekannte ausführlichere Bezeichnung wird in der Fußnote genannt.
- issue: Wiedergabe von κύριος
  choice: Herr
  alternative: HERR
  rationale: „Herr“ entspricht dem griechischen κύριος, ohne eine im vorliegenden griechischen Wortlaut nicht ausdrücklich markierte Rückübertragung auf den Gottesnamen vorzunehmen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst bewahrter biblischer Wendung „in die Hände geben“. Die doppelte Königsbezeichnung und die ungewöhnliche Gottesbezeichnung bleiben entsprechend dem griechischen Text erhalten.
