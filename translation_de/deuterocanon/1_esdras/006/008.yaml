base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/008.yaml
  text: 'Let everything be known to our lord the king: when we came into the land of Judea and to Jerusalem[a], the city, we found the elders of the captivity of the Jews in Jerusalem, the city, building a great new house for the Lord[b],'
translation:
  language: de
  text: 'Unserem Herrn, dem König, sei alles bekannt: Als wir in das Land Judäa und in die Stadt Jerusalem kamen, trafen wir in Jerusalem, der Stadt, die Ältesten der Juden aus der Gefangenschaft[a] an, wie sie ein großes neues Haus für den Herrn[b] bauten,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich steht hier eine gedrängte Genitivverbindung: »die Ältesten der Gefangenschaft der Juden«. Sie bezieht sich offenbar auf die Führung der jüdischen Gemeinschaft im Zusammenhang mit dem Exil, ohne die genaue Zuordnung der Genitive näher auszuführen.'
    reason: lexical_alternative
  - marker: b
    text: Mit dem »Haus für den Herrn« ist der Tempel gemeint.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα γνωστὰ ἔστω
  choice: soll über alles unterrichtet sein
  rationale: Gibt die förmliche Berichtswendung und die Aufforderungskraft von ἔστω in natürlichem modernem Deutsch wieder.
- source_word: τῷ κυρίῳ ἡμῶν τῷ βασιλεῖ
  choice: Unser Herr, der König
  rationale: Bewahrt beide Titel und kennzeichnet κύριος hier als höfische Anrede für den König, nicht als Gottesbezeichnung.
- source_word: παραγενόμενοι
  choice: Als wir ... kamen
  rationale: Das Partizip beschreibt temporal die Umstände des anschließenden Fundes.
- source_word: εἰς τὴν χώραν τῆς Ἰουδαίας καὶ Ἰερουσαλὴμ τὴν πόλιν
  choice: in das Land Judäa und in die Stadt Jerusalem
  rationale: χώρα bleibt allgemein als Land beziehungsweise Gebiet wiedergegeben; die Apposition wird im Deutschen natürlich in die Wortgruppe integriert.
- source_word: κατελάβομεν
  choice: fanden wir dort
  rationale: Im Zusammenhang bedeutet das Verb, dass die Berichtenden die Ältesten bei ihrer Tätigkeit antrafen, nicht dass sie sie ergriffen.
- source_word: τῆς αἰχμαλωσίας τοὺς πρεσβυτέρους τῶν Ἰουδαίων
  choice: die Ältesten der Juden aus der Gefangenschaft
  rationale: Bewahrt die gedrängte Genitivfügung und lässt offen, ob die Gefangenschaft näher den Juden beziehungsweise ihrer Gemeinschaft oder den Ältesten zugeordnet wird.
- source_word: οἰκοδομοῦντας οἶκον
  choice: dabei, ... ein ... Haus ... zu bauen
  rationale: Gibt das prädikative Partizip als gleichzeitig beobachtete Tätigkeit wieder und behält die konkrete Haus-Metapher bei.
- source_word: τῷ κυρίῳ
  choice: für den Herrn
  rationale: κύριος bezeichnet hier Israels Gott; die Großschreibung unterscheidet diesen Bezug vom höfischen Titel am Versanfang.
- source_word: μέγαν καινόν
  choice: ein großes, neues
  rationale: Beide Adjektive werden ohne die stärkere Deutung „prächtig“ wiedergegeben.
theological_decisions:
- issue: κύριος bezeichnet im selben Vers zuerst den persischen König und dann Gott.
  choice: „Herr“ für beide Bezüge, bei Gott durch den bestimmten Artikel und den Kontext erkennbar
  alternative: Für den König „Gebieter“ oder „Majestät“, für Gott „Herr“
  rationale: Die gemeinsame griechische Wortwahl bleibt sichtbar, während Syntax und Kontext die Referenten unterscheiden.
- issue: οἶκος als Bezeichnung des Tempels
  choice: „Haus für den Herrn“ im Haupttext, mit erläuternder Fußnote
  alternative: „Tempel des Herrn“
  rationale: „Haus“ übersetzt οἶκος unmittelbar und bewahrt die biblische Metapher; die Fußnote sichert das sachliche Verständnis.
- issue: Zuordnung der Gefangenschaft in der gedrängten Genitivfolge
  choice: „die Ältesten der Juden aus der Gefangenschaft“
  alternative: „die Ältesten der jüdischen Heimkehrergemeinschaft“
  rationale: Die gewählte Fassung bewahrt die formale und historische Spannung, statt Gefangene, Exilierte oder Heimkehrer ausdrücklich festzulegen.
translation_notes:
  register: Förmlicher Berichtsstil in modernem, gut verständlichem Standarddeutsch. Die lange griechische Periode ist zur Lesbarkeit in zwei Sätze gegliedert; das abschließende Komma zeigt, dass der Bericht im folgenden Vers weitergeht.
