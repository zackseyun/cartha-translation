base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/020.yaml
  text: Now then[a], let it be determined, O king; let a search be made in the royal archives of my lord the king in Babylon,
translation:
  language: de
  text: Nun denn soll entschieden werden, o König; in den königlichen Archiven des Herrn, des Königs, in Babylon soll nachgeforscht werden,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Nun denn werde entschieden, o König; in den königlichen Schriftensammlungen des Herrn, des Königs, in Babylon soll eine Untersuchung vorgenommen werden.“'
    reason: Die griechischen Verwaltungsbegriffe lassen sowohl eine stärker formale Wiedergabe mit „entscheiden“ und „untersuchen“ als auch eine funktionale Übersetzung mit „Archive“ und „nachforschen“ zu.
lexical_decisions:
- source_word: νῦν οὖν
  choice: Nun also
  rationale: Die Wortverbindung markiert sowohl den zeitlichen Übergang als auch die Folgerung und wird im Deutschen natürlich mit „Nun also“ wiedergegeben.
- source_word: κρίνεται
  choice: soll entschieden werden
  rationale: Die unpersönliche Passivform bezeichnet hier eine amtliche Entscheidung. Die Wiedergabe bewahrt die passive Form und vermeidet eine unnötige Festlegung darauf, wer entscheidet.
- source_word: βασιλεῦ
  choice: o König
  rationale: Der Vokativ ist eine förmliche direkte Anrede; „o König“ erhält den würdevollen Ton der Eingabe.
- source_word: ἐπισκεπτήτω
  choice: soll nachgeforscht werden
  rationale: Der passive Imperativ verlangt eine amtliche Prüfung beziehungsweise Suche in den Akten. „Nachforschen“ passt zum administrativen Zusammenhang.
- source_word: βασιλικοῖς βιβλιοφυλακίοις
  choice: königlichen Archiven
  rationale: Das Wort bezeichnet Aufbewahrungsorte für Bücher oder Schriftstücke. Im persischen Verwaltungskontext gibt „Archive“ die Funktion treffender wieder als „Bibliotheken“.
- source_word: τοῦ κυρίου βασιλέως
  choice: meines Herrn, des Königs
  rationale: κύριος ist hier Bestandteil einer höfischen Ehrenformel für den weltlichen Herrscher, kein Gottesname. Die deutsche Formulierung macht das respektvolle Verhältnis des Sprechers zum König verständlich.
- source_word: τοῖς ἐν Βαβυλῶνι
  choice: in Babylon
  rationale: Die Wendung bestimmt den Standort der Archive; eine zusätzliche Wiedergabe mit „dort“ ist im Deutschen nicht erforderlich.
theological_decisions:
- issue: Bedeutung von κύριος in der höfischen Formel τοῦ κυρίου βασιλέως
  choice: meines Herrn, des Königs
  alternative: des Herrn Königs
  rationale: Im Kontext bezeichnet κύριος den König als weltlichen Herrn und nicht Gott. Die gewählte Kleinschreibung und Apposition verhindern einen falschen theologischen Bezug und ergeben zugleich verständliches Deutsch.
translation_notes:
  register: Förmliche, würdevolle Verwaltungssprache in modernem Standarddeutsch. Die wiederholten Passivformen spiegeln den amtlichen Ton des griechischen Textes; die abschließende Interpunktion bleibt offen, weil der Satz im folgenden Vers weitergeführt wird.
