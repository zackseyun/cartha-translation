base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/032.yaml
  text: Therefore may the Lord[a], whose name has been invoked there, destroy every king and nation that stretches out its hand to hinder or to harm that house of the Lord there in Jerusalem.
translation:
  language: de
  text: Darum möge der Herr[a], dessen Name dort angerufen worden ist, jeden König und jedes Volk vernichten, die ihre Hand ausstrecken, um jenes Haus des Herrn dort in Jerusalem zu behindern oder ihm Schaden zuzufügen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dessen Name dort genannt wird“. Das Griechische lässt sich wörtlicher so wiedergeben; „angerufen worden ist“ hebt den kultischen Sinn im Zusammenhang hervor.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ ταῦτα
  choice: Darum
  rationale: Gibt die folgernde Kraft der Wendung knapp und natürlich wieder.
- source_word: ὁ κύριος
  choice: der Herr
  rationale: Bezeichnet hier den Gott Israels und wahrt die traditionelle, kontextgemäße Wiedergabe von κύριος.
- source_word: οὗ τὸ ὄνομα αὐτοῦ ἐπικέκληται ἐκεῖ
  choice: dessen Name dort angerufen worden ist
  rationale: Bewahrt den perfektisch-passiven Sinn und bringt zugleich den kultischen Bezug des Namens Gottes auf den Tempel zum Ausdruck, ohne eine Wohnen-Formel in den Text einzutragen.
- source_word: ἀφανίσαι
  choice: möge ... vernichten
  rationale: Der Infinitiv hat im Erlass imprekativ-jussive Kraft; die deutsche Wunschform gibt dies natürlicher wieder als ein bloßer Infinitiv oder ein bestimmter Zukunftssatz.
- source_word: πάντα βασιλέα καὶ ἔθνος
  choice: jeden König und jedes Volk
  rationale: Erhält den distributiven Singular und gibt sowohl βασιλεύς als auch ἔθνος unmittelbar wieder.
- source_word: ὃς ἐκτενεῖ χεῖρα αὐτοῦ
  choice: die ihre Hand ausstrecken
  rationale: Bewahrt das biblische Bild tätiger feindlicher Einflussnahme. Der deutsche Plural des Relativsatzes bezieht sich grammatisch natürlich auf die verbundene Wortgruppe „jeden König und jedes Volk“.
- source_word: κωλῦσαι ἢ κακοποιῆσαι
  choice: zu behindern oder ihm Schaden zuzufügen
  rationale: Unterscheidet zwischen dem Verhindern beziehungsweise Stören und der weitergehenden Schädigung, ohne κακοποιέω auf bloße Sachbeschädigung zu verengen.
- source_word: τὸν οἶκον Κυρίου ἐκεῖνον τὸν ἐν Ἰερουσαλήμ
  choice: jenes Haus des Herrn dort in Jerusalem
  rationale: Erhält das Tempelidiom „Haus des Herrn“, den demonstrativen Nachdruck und die Ortsangabe.
theological_decisions:
- issue: Tempelformel vom Namen Gottes
  choice: dessen Name dort angerufen worden ist
  alternative: dessen Name dort genannt wird
  rationale: Die gewählte Fassung lässt sowohl das kultische Anrufen als auch die bleibende Zuordnung des göttlichen Namens zum Tempel anklingen. Die wörtlichere Alternative wird in der Fußnote offengehalten.
- issue: Aussageweise von ἀφανίσαι im königlichen Erlass
  choice: möge der Herr ... vernichten
  alternative: der Herr wird ... vernichten
  rationale: Die Wunsch- beziehungsweise Fluchform wahrt die imprekative Spannung des griechischen Infinitivs; ein Futur würde die Formulierung zu einer eindeutigen Vorhersage machen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewahrtem biblischem Tempelidiom. Die ungewöhnliche Hand-Metapher bleibt erhalten; der Relativsatz steht im Deutschen wegen des zusammengesetzten Bezugs im Plural.
