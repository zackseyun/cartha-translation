base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/003.yaml
  text: At that time Sisinnes[a], the governor of Syria and Phoenicia, was present with them, along with Sathrabuzanes and his associates; and he said to them,
translation:
  language: de
  text: 'Zu jener Zeit war Sisinnes, der Statthalter von Syrien und Phönizien, bei ihnen, zusammen mit Sathrabuzanes und seinen Gefährten. Er sagte zu ihnen:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν αὐτῷ τῷ χρόνῳ
  choice: Zu jener Zeit
  rationale: Eine natürliche deutsche Zeitangabe, die die erzählerische Verknüpfung wiedergibt, ohne αὐτῷ unnötig zu verstärken.
- source_word: παρῆν πρὸς αὐτούς
  choice: war bei ihnen
  rationale: παρῆν bezeichnet primär Anwesenheit, nicht ausdrücklich ein Kommen oder Eintreffen; mit πρὸς αὐτούς ergibt sich idiomatisch „war bei ihnen“.
- source_word: Σισίννης
  choice: Sisinnes
  rationale: Der Personenname wird eng nach der griechischen Form transliteriert.
- source_word: ὁ ἔπαρχος
  choice: der Statthalter
  rationale: ἔπαρχος bezeichnet hier einen regionalen Verwaltungsbeamten; „Statthalter“ ist im historischen Kontext verständlich und würdevoll.
- source_word: Συρίας καὶ Φοινίκης
  choice: von Syrien und Phönizien
  rationale: Die Genitive bezeichnen die Amtsgebiete.
- source_word: Σαθραβουζάνης
  choice: Sathrabuzanes
  rationale: Der Personenname wird nach der griechischen Form transliteriert.
- source_word: οἱ συνέταιροι
  choice: die anderen Amtsträger
  rationale: συνέταιροι meint Mitwirkende oder Verbündete. Im behördlichen Zusammenhang bezeichnet „Amtsträger“ die begleitenden Funktionsträger natürlicher als „Gefährten“; „anderen“ macht deutlich, dass sie zu den genannten Behördenvertretern gehören, ohne einen im Griechischen nicht ausgedrückten Possessivbezug festzulegen.
- source_word: καὶ εἶπεν αὐτοῖς
  choice: 'Er sagte zu ihnen:'
  rationale: Das singularische εἶπεν bezeichnet einen einzelnen Sprecher, am natürlichsten Sisinnes als den zuerst genannten und ranghöchsten Amtsträger. Der Doppelpunkt leitet die folgende direkte Rede ein.
