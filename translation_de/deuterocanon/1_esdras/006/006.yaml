base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/006.yaml
  text: and they were not hindered from building until word about them should be sent to Darius and a reply should be returned[a].
translation:
  language: de
  text: Und sie wurden am Weiterbau nicht gehindert, bis Darius über sie Bericht erstattet und eine Antwort erteilt worden wäre.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »und sie angesprochen worden wären«. Das griechische Verb kann bedeuten, dass jemand angesprochen wird oder eine amtliche Antwort erhält; im Zusammenhang liegt eine Antwort auf den Bericht an Darius nahe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἐκωλύθησαν
  choice: sie wurden ... nicht gehindert
  rationale: Das Passiv von κωλύω bezeichnet, dass jemand nicht aufgehalten oder an etwas gehindert wurde; die passive Form bleibt im Deutschen erhalten.
- source_word: τῆς οἰκοδομῆς
  choice: am Weiterbau
  rationale: Der Genitiv bezeichnet nach κωλύω die Tätigkeit, an der sie nicht gehindert wurden. »Weiterbau« gibt im Kontext knapp und natürlich die fortdauernde Bautätigkeit wieder.
- source_word: μέχρις οὗ
  choice: bis
  rationale: Die übliche und klare deutsche Wiedergabe der temporalen Verbindung.
- source_word: ὑποσημανθῆναι
  choice: Bericht erstattet
  rationale: Das Verb kann ein Anzeigen, Melden oder amtliches Berichten bezeichnen. Der Verwaltungskontext legt eine offizielle Mitteilung an Darius nahe.
- source_word: Δαρείῳ
  choice: Darius
  rationale: Der Eigenname wird nach der im Deutschen üblichen Form wiedergegeben.
- source_word: περὶ αὐτῶν
  choice: über sie
  rationale: Die Wendung bezieht sich auf die betreffenden Personen beziehungsweise ihre Angelegenheit und bleibt entsprechend offen.
- source_word: προσφωνηθῆναι
  choice: eine Antwort gegeben würde
  rationale: Im Zusammenhang mit dem Bericht an Darius bezeichnet das Verb wahrscheinlich die anschließende amtliche Antwort; die mögliche wörtlichere Auffassung wird in der Fußnote bewahrt.
