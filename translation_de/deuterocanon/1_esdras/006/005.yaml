base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/005.yaml
  text: And the elders of the Jews found favor from the Lord[a], having come to oversee the captivity.
translation:
  language: de
  text: Und die Ältesten der Juden fanden Gunst beim Herrn, als sie die Aufsicht über die Gefangenschaft übernahmen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „als sie zur Aufsicht über die Verbannten eingesetzt wurden“. Die griechische Formulierung ist stark verdichtet; sie kann eine Einsetzung zur Aufsicht meinen, und „Gefangenschaft“ kann hier kollektiv die davon Betroffenen bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἔσχον χάριν
  choice: fanden Gunst
  rationale: Die idiomatische Wendung bezeichnet empfangene Gunst beziehungsweise Wohlwollen; „fanden Gunst“ ist im Deutschen natürlich und bewahrt den narrativen Sinn.
- source_word: ἐπισκοπῆς
  choice: die Aufsicht
  rationale: ἐπισκοπή kann Aufsicht, Beaufsichtigung oder eine entsprechende Aufgabe bezeichnen. „Aufsicht“ erhält den administrativen Gehalt.
- source_word: γενόμενοι ἐπὶ τὴν αἰχμαλωσίαν
  choice: als sie die Aufsicht über die Gefangenschaft übernahmen
  rationale: Die komprimierte Konstruktion kann das Eintreten in eine verantwortliche Stellung ausdrücken. „übernahmen“ vermeidet die irreführende Vorstellung einer bloßen räumlichen Ankunft, ohne eine förmliche Einsetzung ausdrücklich zu behaupten.
- source_word: παρὰ τοῦ κυρίου
  choice: beim Herrn
  rationale: παρά mit Genitiv bezeichnet hier den Ursprung beziehungsweise Geber der Gunst. Im deutschen Idiom „Gunst bei jemandem finden“ wird dies natürlich mit „beim Herrn“ ausgedrückt.
- source_word: οἱ πρεσβύτεροι τῶν Ἰουδαίων
  choice: die Ältesten der Juden
  rationale: Die Formulierung folgt der griechischen Struktur und bezeichnet die Ältesten der jüdischen Gemeinschaft.
theological_decisions:
- issue: Wiedergabe von κύριος
  choice: Herr
  alternative: der HERR
  rationale: Der griechische Ausgangstext hat κύριος. „Herr“ gibt diesen Titel direkt wieder, ohne die hebräische Gottesnamenschreibung in den griechischen Text einzutragen.
- issue: Deutung von αἰχμαλωσία
  choice: Gefangenschaft
  alternative: die Verbannten
  rationale: Das Substantiv bezeichnet wörtlich Gefangenschaft beziehungsweise Exil, kann im Zusammenhang jedoch auch kollektiv auf die davon betroffenen Menschen zielen. Der Haupttext wahrt mit „Gefangenschaft“ die Ausdrucksweise des griechischen Textes; die Fußnote nennt die mögliche personenbezogene Deutung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die schwer aufzulösende griechische Konstruktion wird lesbar wiedergegeben; ihre mögliche Bedeutung als förmliche Einsetzung und der kollektive Sinn von „Gefangenschaft“ bleiben in der Fußnote sichtbar.
