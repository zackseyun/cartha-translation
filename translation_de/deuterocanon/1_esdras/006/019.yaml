base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/019.yaml
  text: Then Sanabassar came and laid the foundations of the house of the Lord in Jerusalem[a], and from that time until now it has been under construction and has not reached completion.
translation:
  language: de
  text: Da kam Sanabassar und legte die Fundamente des Hauses des Herrn in Jerusalem[a]. Seit jener Zeit bis heute wird daran gebaut, doch es ist noch nicht vollendet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sanabassar wird gewöhnlich mit Scheschbazzar in der Esra-Überlieferung gleichgesetzt.
    reason: Alternative Namensform und traditionsgeschichtliche Identifizierung.
lexical_decisions:
- source_word: Σαναβάσσαρος
  choice: Sanabassar
  rationale: Der Personenname wird entsprechend der griechischen Form transliteriert; die in der Esra-Überlieferung geläufige Form Scheschbazzar wird in der Fußnote genannt.
- source_word: παραγενόμενος
  choice: Da kam
  rationale: Das Partizip bezeichnet Sanabassars Eintreffen vor der anschließenden Handlung; „Da kam“ gibt den erzählerischen Anschluss natürlich wieder.
- source_word: εἰσεβάλλετο τοὺς θεμελίους
  choice: legte die Fundamente
  rationale: Im Bauzusammenhang bezeichnet die Wendung idiomatisch das Legen beziehungsweise Setzen der Fundamente.
- source_word: τοῦ οἴκου Κυρίου
  choice: für das Haus des Herrn
  rationale: „Haus des Herrn“ bewahrt die biblische Ausdrucksweise und bleibt näher am Griechischen als das kontextuell mögliche „Tempel“.
- source_word: τοῦ ἐν Ἰερουσαλήμ
  choice: in Jerusalem
  rationale: Die knappe Ortsangabe gibt die griechische attributive Konstruktion im Deutschen natürlich wieder.
- source_word: ἀπ᾽ ἐκείνου μέχρι τοῦ νῦν
  choice: Seit jener Zeit bis heute
  rationale: Die Formulierung erhält den hervorgehobenen zeitlichen Fortgang bis zum Bezugszeitpunkt.
- source_word: οἰκοδομουμένου
  choice: wird daran gebaut
  rationale: Das passive Partizip bezeichnet den fortdauernden Bauvorgang; die deutsche Wendung ist natürlich und lässt das Haus als Bezug klar erkennen.
- source_word: οὐκ ἔλαβεν συντέλειαν
  choice: doch es ist noch nicht vollendet
  rationale: Die resultative Aussage „erlangte keine Vollendung“ wird in klarem, gegenwärtigem Deutsch wiedergegeben; „noch“ entspricht dem Zusammenhang des Bauens bis zum jetzigen Zeitpunkt.
theological_decisions:
- issue: Wiedergabe von Κυρίου in der Bezeichnung des Heiligtums
  choice: des Herrn
  alternative: des HERRN
  rationale: Die primäre griechische Quelle hat Κυρίου. Daher wird „Herr“ verwendet, ohne aus einer möglichen semitischen Vorlage die typografische Wiedergabe des Gottesnamens einzutragen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Die Syntax ist geglättet, ohne den fortdauernden Bauvorgang oder die ausstehende Vollendung abzuschwächen.
