base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/002.yaml
  text: Then Zerubbabel son of Salathiel and Jeshua son of Josedek stood up and began to build the house of the Lord in Jerusalem[a], while the prophets of the Lord were with them[c][b], helping them.
translation:
  language: de
  text: Da erhoben sich Serubbabel, der Sohn Salathiëls, und Jeschua, der Sohn Josedeks, und begannen, das Haus des Herrn in Jerusalem zu bauen,[a] während die Propheten des Herrn bei ihnen waren und ihnen halfen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Erhoben sich“ kann hier sowohl das tatsächliche Aufstehen als auch den entschlossenen Beginn des Handelns bezeichnen.
    reason: lexical_alternative
  - marker: b
    text: Im parallelen Überlieferungszusammenhang werden Haggai und Sacharja als die Propheten genannt; der griechische Vers selbst spricht allgemein von „den Propheten des Herrn“.
    reason: cross_reference
lexical_decisions:
- source_word: τότε στάς
  choice: Da erhoben sich
  rationale: τότε führt die Erzählung zeitlich beziehungsweise folgernd weiter; στάς bezeichnet hier idiomatisch das Aufstehen oder entschlossene Tätigwerden. Der deutsche Plural richtet sich natürlich nach dem zusammengesetzten Subjekt.
- source_word: Ζοροβαβὲλ ὁ τοῦ Σαλαθιὴλ
  choice: Serubbabel, der Sohn Schealtiëls
  rationale: Die im Deutschen etablierten biblischen Namensformen machen die Personen wiedererkennbar; die Abstammungsangabe wird ausdrücklich wiedergegeben.
- source_word: Ἰησοῦς ὁ τοῦ Ἰωσεδὲκ
  choice: Jeschua, der Sohn Jozadaks
  rationale: Jeschua ist für den nachexilischen Hohenpriester die übliche unterscheidende Namensform und vermeidet eine Verwechslung mit Jesus von Nazaret. Jozadak folgt der im deutschen Bibelgebrauch vertrauten semitischen Namensform.
- source_word: ἤρξαντο οἰκοδομεῖν
  choice: begannen, … zu bauen
  rationale: Die inchoative Konstruktion aus ἄρχομαι und Infinitiv wird direkt und idiomatisch wiedergegeben.
- source_word: τὸν οἶκον τοῦ κυρίου
  choice: das Haus des Herrn
  rationale: Die konkrete Tempelbezeichnung des Griechischen bleibt erhalten, ohne sie im Haupttext interpretierend zu ‚Tempel‘ zu verkürzen.
- source_word: τὸν ἐν Ἰερουσαλήμ
  choice: in Jerusalem
  rationale: Die attributive Ortsangabe lässt sich im Deutschen knapp und natürlich nachstellen.
- source_word: συνόντων τῶν προφητῶν τοῦ κυρίου βοηθούντων αὐτοῖς
  choice: während die Propheten des Herrn bei ihnen waren und ihnen halfen
  rationale: Die Genitivus-absolute-Konstruktion bezeichnet einen begleitenden Umstand; beide Partizipien werden als gleichzeitige, fortdauernde Begleitung und Hilfe ausgedrückt.
theological_decisions:
- issue: Wiedergabe von κύριος
  choice: Herr
  alternative: HERR
  rationale: Der griechische Primärtext hat κύριος. „Herr“ gibt diesen Ausdruck direkt wieder, ohne im Haupttext eine nicht ausdrücklich geschriebene Wiedergabe des Tetragramms einzuführen.
- issue: Allgemeine Bezeichnung der Propheten gegenüber dem semitischen Paralleltext
  choice: die Propheten des Herrn
  alternative: Haggai und Sacharja
  rationale: Der griechische Vers nennt keine einzelnen Propheten. Die Namen aus dem Parallelzusammenhang werden daher nicht in den Haupttext eingefügt, können aber erklärend genannt werden.
- issue: Namensform Ἰησοῦς in diesem historischen Zusammenhang
  choice: Jeschua
  alternative: Jesus
  rationale: Gemeint ist der nachexilische Hohepriester. „Jeschua“ wahrt die historische Identität und verhindert eine sachlich irreführende Assoziation mit Jesus von Nazaret.
translation_notes:
  register: Moderne, würdige Standardsprache mit vertrauten deutschen biblischen Namensformen. Der Satzbau bleibt nahe an der griechischen Erzählfolge, wird jedoch durch einen deutschen Nebensatz für den Genitivus absolutus natürlich lesbar gemacht.
