base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/010.yaml
  text: Then we questioned these elders[a], saying[b], ‘Who commanded you to build this house and—’
translation:
  language: de
  text: 'Dann befragten wir diese Ältesten und sagten: »Wer hat euch befohlen, dieses Haus zu bauen und—«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit »dieses Haus« ist der Tempel in Jerusalem gemeint. Der überlieferte griechische Text bricht an dieser Stelle nach »und« ab; der Satz wird im nächsten Vers fortgesetzt.
    reason: cultural_note; textual_variant
lexical_decisions:
- source_word: ἐπυνθανόμεθα
  choice: befragten wir
  rationale: Das Imperfekt bezeichnet hier das Einholen von Auskunft in einem amtlichen Untersuchungskontext; »befragen« ist präziser als das neutralere »fragen«.
- source_word: τῶν πρεσβυτέρων τούτων
  choice: diese Ältesten
  rationale: πρεσβύτεροι bezeichnet hier anerkannte Vertreter beziehungsweise führende Männer der Gemeinschaft, nicht bloß ältere Menschen.
- source_word: Τίνος ὑμῖν προστάξαντος
  choice: Wer hat euch befohlen
  rationale: Der Genitivus absolutus fragt nach der Person, von der die Anordnung ausging. Die Formulierung ist im Deutschen natürlich und gibt προστάσσω direkt wieder.
- source_word: οἰκοδομεῖτε
  choice: zu bauen
  rationale: Nach »befohlen« verlangt natürliches Deutsch den Infinitiv. Obwohl es sich dem Zusammenhang nach um einen Wiederaufbau handelt, bedeutet das griechische Verb hier schlicht »bauen«.
- source_word: τὸν οἶκον τοῦτον
  choice: dieses Haus
  rationale: »Haus« bewahrt die konkrete Wortwahl von οἶκος und die biblische Bezeichnung des Tempels, ohne die kontextuelle Bedeutung in den Haupttext einzutragen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die amtliche Färbung der Befragung bleibt erhalten. Der abrupte Satzabbruch des griechischen Ausgangstextes wird sichtbar bewahrt; der Fußnotenmarker steht unmittelbar nach dem unvollständigen Zitat.
