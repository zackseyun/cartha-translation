base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/033.yaml
  text: I, King Darius, have decreed that this be done carefully according to these instructions.
translation:
  language: de
  text: Ich, König Darius, habe angeordnet, dass dies sorgfältig nach diesen Bestimmungen ausgeführt wird.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „nach diesen Dingen“. Gemeint sind die zuvor genannten Bestimmungen des Erlasses.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγὼ βασιλεὺς Δαρεῖος
  choice: Ich, König Darius
  rationale: Das ausdrücklich gesetzte ἐγώ bewahrt den nachdrücklichen königlichen Selbstausweis; Titel und Name folgen in natürlichem, würdigem Deutsch.
- source_word: δεδογμάτικα
  choice: habe angeordnet
  rationale: Das Perfekt bezeichnet eine förmliche königliche Entscheidung, die weiterhin gilt. „Habe angeordnet“ ist im Deutschen idiomatischer als „habe dekretiert“ und wahrt den amtlichen Ton.
- source_word: ἐπιμελῶς
  choice: sorgfältig
  rationale: Das Adverb betont die gewissenhafte und genaue Durchführung, ohne zusätzlich Eifer oder Geschwindigkeit einzutragen.
- source_word: κατὰ ταῦτα
  choice: nach diesen Bestimmungen
  rationale: Wörtlich steht „nach diesen Dingen“; im Zusammenhang verweist die Wendung auf die zuvor genannten Regelungen des Erlasses. „Bestimmungen“ gibt diesen Bezug in natürlichem Verwaltungsdeutsch wieder.
- source_word: γίνεσθαι
  choice: dass dies … ausgeführt wird
  rationale: Der Infinitiv bezeichnet hier die Verwirklichung beziehungsweise Durchführung des Angeordneten. Die passive Formulierung passt zum amtlichen Zusammenhang.
