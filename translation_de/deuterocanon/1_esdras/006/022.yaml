base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/022.yaml
  text: 'Then King Darius ordered a search to be made in the archives kept in Babylon[a], and in Ecbatana, the fortress in the land of Media[b], a scroll was found in which these things had been recorded:'
translation:
  language: de
  text: Da befahl König Darius, die in Babylon aufbewahrten Archive zu durchsuchen. Und in Ekbatana, der Festung im Land Medien[a], wurde eine Stelle gefunden, an der Folgendes vermerkt war:[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »der Zitadelle im Land Medien«.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »wurde eine Stelle gefunden, an der dies vermerkt war«; gemeint sein kann eine Fundstelle im Archiv oder eine Stelle in einem Schriftstück.'
    reason: source_ambiguity
lexical_decisions:
- source_word: προσέταξεν
  choice: befahl
  rationale: Gibt die autoritative königliche Anordnung knapp und natürlich wieder.
- source_word: ἐπισκέψασθαι
  choice: zu durchsuchen
  rationale: Bezeichnet hier die amtliche Prüfung beziehungsweise Suche in den Archiven.
- source_word: βιβλιοφυλακίοις
  choice: Archive
  rationale: Im Zusammenhang geht es um Aufbewahrungsorte amtlicher Schriftstücke, nicht um allgemeine Bibliotheken.
- source_word: τοῖς κειμένοις
  choice: aufbewahrten
  rationale: Natürliches Deutsch für die in Babylon gelagerten beziehungsweise verwahrten Archive.
- source_word: Ἐκβατάνοις
  choice: Ekbatana
  rationale: Gebräuchliche deutsche Form des Ortsnamens.
- source_word: τῇ βάρει
  choice: der Festung
  rationale: Bewahrt den Sinn eines befestigten Verwaltungszentrums; »Zitadelle« ist ebenfalls möglich.
- source_word: ἐν Μηδείᾳ χώρᾳ
  choice: im Land Medien
  rationale: Gibt die geografische Bedeutung von χώρα wieder, ohne eine bestimmte Verwaltungsordnung vorauszusetzen.
- source_word: τόπος
  choice: eine Stelle
  rationale: Bewahrt das ungewöhnliche τόπος und lässt offen, ob eine Fundstelle im Archiv oder eine Textstelle gemeint ist, statt unbelegt »Schriftrolle« einzusetzen.
- source_word: ὑπομνημάτιστο τάδε
  choice: an der Folgendes vermerkt war
  rationale: Vermittelt den amtlichen Aufzeichnungscharakter und leitet idiomatisch den nachfolgenden Wortlaut ein.
