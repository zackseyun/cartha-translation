base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/007/003.yaml
  text: And the holy works prospered[a], while Haggai and Zechariah the prophets were prophesying.
translation:
  language: de
  text: Und die heiligen Arbeiten gingen gut voran[a], während die Propheten Haggai und Sacharja weissagten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Arbeiten am Heiligtum hatten Erfolg“; gemeint sind die Arbeiten am Tempel.'
    reason: Die griechische Wendung kann sowohl den günstigen Fortgang als auch den Erfolg der heiligen Arbeiten bezeichnen; der Tempelbezug ergibt sich aus dem Zusammenhang.
lexical_decisions:
- source_word: εὐόδα ἐγίνετο
  choice: gingen gut voran
  rationale: Die Wendung bezeichnet günstigen Fortgang oder Erfolg. „Gingen gut voran“ ist im modernen Deutsch natürlich und gibt den fortlaufenden Verlauf wieder.
- source_word: τὰ ἱερὰ ἔργα
  choice: die heiligen Arbeiten
  rationale: Die Formulierung bleibt nahe am griechischen Wortlaut und legt nicht ausdrücklich „Tempelarbeiten“ fest, obwohl diese im Zusammenhang gemeint sind.
- source_word: προφητευόντων
  choice: während … weissagten
  rationale: Der Genitivus absolutus drückt eine gleichzeitig andauernde Handlung aus. Der mit „während“ gebildete Nebensatz macht dieses Verhältnis deutlich.
- source_word: Ἁγγαίου
  choice: Haggai
  rationale: Im Deutschen übliche biblische Namensform.
- source_word: Ζαχαρίου
  choice: Sacharja
  rationale: Im Deutschen übliche biblische Namensform.
- source_word: τῶν προφητῶν
  choice: die Propheten
  rationale: Die Apposition wird ausdrücklich wiedergegeben und vor die Namen gestellt, wie es im Deutschen natürlich ist.
theological_decisions:
- issue: Ob τὰ ἱερὰ ἔργα ausdrücklich als Tempelbauarbeiten bezeichnet werden soll
  choice: Die allgemeinere Formulierung „die heiligen Arbeiten“ bleibt im Haupttext erhalten.
  alternative: „die Tempelarbeiten“ oder „die Arbeiten am Haus Gottes“
  rationale: Der griechische Primärtext nennt den Tempel in diesem Vers nicht ausdrücklich. Der Zusammenhang legt ihn zwar nahe, doch der Haupttext soll die Formulierung nicht über den griechischen Wortlaut hinaus verengen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Weissagten“ bewahrt den prophetischen Sinn von προφητεύω; „gingen gut voran“ ist verständlicher und idiomatischer als eine steife Wiedergabe mit „gediehen“.
