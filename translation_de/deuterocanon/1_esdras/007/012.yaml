base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/007/012.yaml
  text: And they sacrificed the Passover for all the sons of the captivity[a], and for their brothers the priests[b], and for themselves.
translation:
  language: de
  text: Und sie schlachteten das Passahopfer für alle Angehörigen der Exilgemeinschaft[a], für ihre Brüder, die Priester, und für sich selbst.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „für alle Söhne der Gefangenschaft“. Gemeint ist die Gemeinschaft der von der Gefangenschaft Betroffenen; auch möglich: „für alle Exilierten“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔθυσαν
  choice: schlachteten
  rationale: θύω bezeichnet hier das kultische Schlachten eines Opfertiers. Zusammen mit „Passahopfer“ gibt „schlachteten“ die konkrete Handlung präzise und natürlich wieder.
- source_word: τὸ πάσχα
  choice: das Passahopfer
  rationale: Als direktes Objekt von ἔθυσαν bezeichnet πάσχα hier das zum Passah gehörende Opfer. „Passahopfer“ wahrt den Zusammenhang mit dem Fest, ohne ausdrücklich ein „Lamm“ einzutragen, das im Griechischen nicht genannt wird.
- source_word: πᾶσιν τοῖς υἱοῖς τῆς αἰχμαλωσίας
  choice: für alle Angehörigen der Wegführung
  rationale: Die wörtliche Wendung „Söhne der Wegführung“ ist im heutigen Deutsch missverständlich und unnatürlich. „Angehörige der Wegführung“ bewahrt den korporativen Bezug auf die aus dem Exil zurückgekehrte Gemeinschaft; eine Fußnote dokumentiert die griechische Ausdrucksweise und die mögliche Wiedergabe „Exilierte“.
- source_word: ἀδελφοῖς
  choice: Brüder
  rationale: „Brüder“ erhält die familiäre und gemeinschaftliche Sprache des griechischen Textes. Der folgende Ausdruck „die Priester“ bestimmt näher, welche Brüder gemeint sind.
- source_word: ἱερεῦσιν
  choice: die Priester
  rationale: Die appositionelle Wiedergabe „ihre Brüder, die Priester“ macht den griechischen Bezug im Deutschen klar.
- source_word: ἑαυτοῖς
  choice: für sich selbst
  rationale: Dies ist die direkte und idiomatische Wiedergabe des reflexiven Dativs und bewahrt die abschließende Gruppe der Begünstigten.
theological_decisions:
- issue: Geschlechtsspezifische korporative Sprache in τοῖς υἱοῖς und ἀδελφοῖς
  choice: Die Exilsgemeinschaft wird mit „Angehörige“ bezeichnet; „Brüder“ bleibt erhalten.
  alternative: „Söhne der Wegführung“ beziehungsweise durchgehend geschlechtsneutrale Formulierungen
  rationale: „Angehörige“ gibt die korporative Bedeutung von „Söhne der Wegführung“ im modernen Deutsch verständlich wieder, ohne die Gruppe unnötig auf männliche Einzelpersonen festzulegen. Bei ἀδελφοῖς ist „Brüder“ dagegen natürlich und bewahrt die ausdrückliche familiäre Bezeichnung; die betreffenden Personen werden als Priester identifiziert.
- issue: Bedeutungsumfang von τὸ πάσχα
  choice: Passahopfer
  alternative: Passah; Passahlamm
  rationale: Der Zusammenhang mit ἔθυσαν aktiviert den Opferaspekt. „Passahopfer“ vermeidet zugleich die nicht ausdrücklich belegte Festlegung auf ein Lamm und hält Fest und Opfer begrifflich verbunden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Wegführung“ erhält den biblisch-historischen Gemeinschaftsbegriff, während „Angehörige“ die im Deutschen sperrige wörtliche Formulierung verständlich macht. Die Satzstruktur folgt eng der dreigliedrigen griechischen Aufzählung.
