base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/007/015.yaml
  text: because he had turned the counsel of the king of Assyria toward them[a], to strengthen their hands in the work of the Lord, the God of Israel.
translation:
  language: de
  text: denn er hatte den Entschluss des Königs von Assyrien ihnen zugewandt[a], um ihre Hände für die Werke des Herrn, des Gottes Israels, zu stärken.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der griechische Text und die hebräische Parallelstelle lesen beide „König von Assyrien“, obwohl es im weiteren Zusammenhang des Esrabuches um den persischen Herrscher geht. Die Übersetzung bewahrt den Wortlaut der Quelle, statt ihn anzugleichen.
    reason: alternative_reading
lexical_decisions:
- source_word: μετέστρεψεν
  choice: hatte … zugewandt
  rationale: Das Verb bezeichnet ein Wenden oder Umlenken. Das Plusquamperfekt passt zum begründenden Rückblick mit ὅτι; „zuwenden“ bewahrt zudem die gerichtete Bewegung von ἐπ’ αὐτούς.
- source_word: τὴν βουλήν
  choice: den Entschluss
  rationale: βουλή kann Rat, Absicht, Plan oder Entschluss bedeuten. „Entschluss“ gibt hier die königliche Willensausrichtung natürlich und würdig wieder, ohne sie auf ein bloßes Gefühl zu verengen.
- source_word: τοῦ βασιλέως Ἀσσυρίων
  choice: des Königs von Assyrien
  rationale: Die griechische Formulierung und die hebräische Parallelstelle nennen den „König von Assyrien“. Diese Quellenangabe wird trotz der persischen Rahmenhandlung nicht harmonisiert.
- source_word: ἐπ’ αὐτούς
  choice: ihnen zugewandt
  rationale: Die Präposition bezeichnet die Richtung auf die Menschen hin. Die Einbindung in „ihnen zugewandt“ ist im Deutschen idiomatisch und lässt die aus dem Zusammenhang erkennbare günstige Ausrichtung bestehen, ohne ausdrücklich „zu ihren Gunsten“ einzutragen.
- source_word: κατισχῦσαι τὰς χεῖρας αὐτῶν
  choice: um ihre Hände … zu stärken
  rationale: Die wörtliche Wiedergabe bewahrt das auch durch die hebräische Parallelstelle bestätigte biblische Bild für Befähigung und Ermutigung.
- source_word: ἐπὶ τὰ ἔργα Κυρίου θεοῦ Ἰσραήλ
  choice: bei den Werken des Herrn, des Gottes Israels
  rationale: Der griechische Text hat den Plural τὰ ἔργα. „Bei den Werken“ bezeichnet ihre tätige Mitwirkung und folgt der griechischen Quelle, ohne die in der hebräischen Parallele ausdrücklich genannte Arbeit am Haus Gottes in den Haupttext einzutragen.
theological_decisions:
- issue: Wiedergabe von κύριος
  choice: Herr
  alternative: HERR
  rationale: Die primäre griechische Quelle bietet Κυρίου. Daher wird „Herr“ verwendet; die Wiedergabe „HERR“ wäre bei einer unmittelbaren Übersetzung des hebräischen Gottesnamens naheliegend.
- issue: Historischer Titel „König von Assyrien“
  choice: im Haupttext beibehalten
  alternative: König von Persien
  rationale: Sowohl die griechische Quelle als auch die hebräische Parallelstelle lesen „König von Assyrien“. Eine Änderung zu „Persien“ würde den überlieferten Wortlaut historisch harmonisieren.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das traditionelle, weiterhin verständliche Bild „die Hände stärken“ bleibt erhalten. Die Satzform wahrt den Charakter eines begründenden Nebensatzes, da der vorgelegte Vers mit ὅτι einsetzt.
