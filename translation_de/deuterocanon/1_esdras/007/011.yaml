base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/007/011.yaml
  text: and all the sons of the captivity[a], because they had purified themselves. For all the Levites together had purified themselves, all of them[b],
translation:
  language: de
  text: und alle Angehörigen der Exilsgemeinschaft[a], denn sie hatten sich gereinigt. Denn die Leviten hatten sich alle gemeinsam gereinigt[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Söhne der Gefangenschaft«; gemeint sein können auch »die Kinder des Exils« oder schlicht »die Exilierten«.'
    reason: lexical_alternative
  - marker: b
    text: Der griechische Satz wirkt an dieser Stelle inhaltlich unvollständig und wird offenbar im folgenden Satzteil fortgesetzt. »Hatten sich gereinigt« kann auch mit »waren gereinigt« wiedergegeben werden.
    reason: textual_variant
lexical_decisions:
- source_word: υἱοὶ τῆς αἰχμαλωσίας
  choice: Angehörige der Exilsgemeinschaft
  rationale: Die griechische Wendung lautet wörtlich »Söhne der Gefangenschaft«. Die gewählte Formulierung gibt die traditionelle Bezeichnung der nachexilischen Gemeinschaft in verständlichem, heutigem Deutsch wieder, ohne ausdrücklich eine Rückkehr zu ergänzen.
- source_word: ἡγνίσθησαν
  choice: hatten sich gereinigt
  rationale: ἁγνίζω bezeichnet hier die rituelle Reinigung zur Vorbereitung auf den Gottesdienst. Die mediale/passive Form lässt auch »waren gereinigt worden« zu; die reflexive Wiedergabe ist im Kontext natürlich und bewahrt den Gedanken bewusster kultischer Vorbereitung.
- source_word: λευεῖται
  choice: die Leviten
  rationale: Dies ist die geläufige deutsche Bezeichnung für die im Griechischen genannte Gruppe.
- source_word: ἅμα πάντες
  choice: alle gemeinsam
  rationale: Die Formulierung bewahrt sowohl die Gesamtheit als auch das gemeinsame Handeln der Leviten und klingt im Deutschen natürlich.
theological_decisions:
- issue: Bedeutung der Reinigung
  choice: hatten sich gereinigt
  alternative: waren gereinigt worden
  rationale: Gemeint ist zunächst die kultische beziehungsweise rituelle Vorbereitung, nicht ausdrücklich eine abstrakte innere Erneuerung. Die reflexive Fassung ist kontextgerecht, während die grammatisch mögliche passive Deutung in der Fußnote offengehalten wird.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnliche griechische Gemeinschaftsbezeichnung wird im Haupttext verständlich wiedergegeben und in der Fußnote formal erschlossen. Das abschließende Komma hält den fragmentarischen, in den nächsten Satzteil weiterführenden Charakter der Vorlage sichtbar.
