base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/007/005.yaml
  text: The house was completed by the twenty-third day of the month Adar[b][a], in the sixth year of King Darius.
translation:
  language: de
  text: Das Haus[a] wurde bis zum dreiundzwanzigsten Tag des Monats Adar[b] vollendet, im sechsten Regierungsjahr des Königs Darius.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint ist der Tempel; im griechischen Text steht einfach „das Haus“.
    reason: cross_reference
  - marker: b
    text: 'Wörtlicher: „bis zum dritten und zwanzigsten des Monats Adar“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: συνετελέσθη
  choice: wurde … vollendet
  rationale: Der Aorist Passiv von συντελέω bezeichnet den erreichten Abschluss und wird durch die passive Form natürlich und genau wiedergegeben.
- source_word: ὁ οἶκος
  choice: das Haus
  rationale: Der griechische Text sagt wörtlich „das Haus“. Gemeint ist im Zusammenhang der Tempel; die Ausgangsformulierung bleibt im Haupttext erhalten und wird in einer Fußnote erläutert.
- source_word: ἕως τρίτης καὶ εἰκάδος
  choice: bis zum dreiundzwanzigsten Tag
  rationale: Die Wendung bedeutet wörtlich „bis zum dritten und zwanzigsten“ und bezeichnet den dreiundzwanzigsten Tag. „Bis zum“ bewahrt den Wert von ἕως und lässt offen, ob der Abschluss genau an diesem Tag oder spätestens bis dahin erfolgte.
- source_word: μηνὸς Ἀδὰρ
  choice: des Monats Adar
  rationale: Die genitivische Datumsangabe wird direkt wiedergegeben; Adar bleibt als Monatsname transliteriert.
- source_word: τοῦ ἕκτου ἔτους
  choice: im sechsten Regierungsjahr
  rationale: Die Ergänzung „Regierungs-“ macht die übliche Datierung nach Herrscherjahren im Deutschen eindeutig, ohne den Sinn zu erweitern.
- source_word: βασιλέως Δαρείου
  choice: des Königs Darius
  rationale: Die Genitivverbindung bezeichnet den Herrscher, nach dessen Regierungsjahr datiert wird; die deutsche Form ist würdig und idiomatisch.
theological_decisions:
- issue: Bezeichnung des Tempels als „Haus“
  choice: „Haus“ im Haupttext beibehalten und den Bezug auf den Tempel in einer Fußnote erklären
  alternative: „Tempel“ unmittelbar in den Haupttext setzen
  rationale: So bleibt die konkrete Wortwahl des griechischen Textes sichtbar, während der sachliche Bezug für heutige Leser geklärt wird.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die knappe chronologische Satzstruktur des Griechischen bleibt erhalten; „Regierungsjahr“ verdeutlicht idiomatisch die antike Datierungsweise.
