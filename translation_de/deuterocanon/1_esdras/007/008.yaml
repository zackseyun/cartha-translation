base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/007/008.yaml
  text: twelve goats for the sin of all Israel[a], according to the number of the twelve tribal leaders of Israel.
translation:
  language: de
  text: zwölf Ziegenböcke als Sündopfer für ganz Israel[a], entsprechend der Zahl der zwölf Stammesoberhäupter Israels.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »für Sünde ganz Israels«; die griechische Opferformel bezeichnet hier ein Sündopfer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: χιμάρους
  choice: Ziegenböcke
  rationale: χίμαρος bezeichnet hier männliche Ziegen; „Ziegenböcke“ gibt Geschlecht und Tierart im Opferzusammenhang klar und natürlich wieder.
- source_word: ὑπὲρ ἁμαρτίας
  choice: für die Sünde
  rationale: Die knappe griechische Opferformel wird eng wiedergegeben, ohne den impliziten Opferbegriff in den Haupttext einzutragen; die ausdrücklichere Deutung als Sündopfer steht in der Fußnote.
- source_word: παντὸς τοῦ Ἰσραήλ
  choice: ganz Israels
  rationale: Der Genitiv wird bewahrt und bezeichnet Israel in seiner Gesamtheit.
- source_word: πρὸς ἀριθμόν
  choice: entsprechend der Zahl
  rationale: Die Wendung bezeichnet eine zahlenmäßige Entsprechung und wird in idiomatischem Standarddeutsch wiedergegeben.
- source_word: φυλάρχων
  choice: Stammesoberhäupter
  rationale: φυλάρχης bezeichnet das Oberhaupt beziehungsweise den Führer eines Stammes; „Stammesoberhäupter“ ist würdig, präzise und allgemein verständlich.
theological_decisions:
- issue: Soll die Opferformel ausdrücklich als „Sündopfer“ wiedergegeben werden?
  choice: für die Sünde ganz Israels
  alternative: als Sündopfer für ganz Israel
  rationale: Die engere Fassung erhält die Kürze und formale Spannung des griechischen ὑπὲρ ἁμαρτίας mit folgendem Genitiv. Da die Wendung im Opferzusammenhang idiomatisch ein Sündopfer bezeichnen kann, wird diese deutlichere Lesart in einer Fußnote angeboten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz ist ein Versfragment; seine aufzählende Struktur wurde beibehalten. Die zweimalige Nennung von „zwölf“ folgt dem griechischen Text.
