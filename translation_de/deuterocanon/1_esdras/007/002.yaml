base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/007/002.yaml
  text: They supervised the holy works more diligently[a], working together with the elders of the Jews and the temple overseers.
translation:
  language: de
  text: Sie beaufsichtigten die Arbeiten am Heiligtum mit größerer Sorgfalt[a] und arbeiteten dabei mit den Ältesten der Juden und den Aufsehern des Heiligtums zusammen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die heiligen Arbeiten“; auch möglich: „die sakralen Arbeiten“. Die hebräische Parallele spricht von „der Arbeit am Haus Gottes“.'
    reason: Die Fußnote bewahrt die formale Bedeutung der griechischen Wendung und zeigt zugleich den durch die hebräische Parallele bestätigten Tempelbezug.
lexical_decisions:
- source_word: ἐπεστάτουν
  choice: sie beaufsichtigten
  rationale: Das Imperfekt bezeichnet eine fortdauernde Aufsichtstätigkeit; „beaufsichtigten“ ist im Deutschen natürlich und wahrt den leitenden Sinn des Verbs.
- source_word: τῶν ἱερῶν ἔργων
  choice: die Arbeiten am Heiligtum
  rationale: Die Wendung lautet wörtlich „die heiligen Arbeiten“. Im Kontext sind Arbeiten am Haus Gottes gemeint; die gewählte Formulierung ist verständlich, ohne den Tempelbezug übermäßig einzuengen. Die wörtlichere Lesart bleibt in der Fußnote erhalten.
- source_word: ἐπιμελέστερον
  choice: mit größerer Sorgfalt
  rationale: Der Komparativ wird ausdrücklich wiedergegeben und bezeichnet ein gesteigertes Maß an Umsicht und Aufmerksamkeit.
- source_word: συνεργοῦντες
  choice: arbeiteten dabei ... zusammen
  rationale: Das Partizip bezeichnet aktive Zusammenarbeit mit den beiden im Dativ genannten Gruppen. „Dabei“ bindet diese Tätigkeit natürlich an die Aufsicht an.
- source_word: τοῖς πρεσβυτέροις τῶν Ἰουδαίων
  choice: mit den Ältesten der Juden
  rationale: Die Formulierung bewahrt die griechische Genitivverbindung und bezeichnet die anerkannten Ältesten der jüdischen Gemeinschaft.
- source_word: ἱεροστάταις
  choice: den Aufsehern des Heiligtums
  rationale: Das seltene Substantiv bezeichnet Personen, denen heilige beziehungsweise tempelbezogene Angelegenheiten anvertraut sind. Die Übersetzung gibt ihre Aufsichtsfunktion wieder, ohne sie unbegründet mit Priestern gleichzusetzen.
theological_decisions:
- issue: Verhältnis des griechischen Wortlauts zur hebräischen Parallele in Esra 6,22
  choice: Die besonderen Angaben des griechischen Textes zur Zusammenarbeit mit den Ältesten und den Aufsehern des Heiligtums werden beibehalten; die hebräische Parallele bestätigt lediglich den Bezug auf die Arbeit am Haus Gottes.
  alternative: 'Nach der hebräischen Parallele freier formulieren: „ihre Hände bei der Arbeit am Haus Gottes stärken“.'
  rationale: Für 1 Esdras ist der griechische Text die primäre Übersetzungsgrundlage. Seine eigenständige Aussage darf nicht durch die anders lautende hebräische Parallele ersetzt werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Arbeiten am Heiligtum“ ist für heutige Leser klarer als „heilige Arbeiten“; der seltene Funktionstitel ἱεροστάται wird sachlich und ohne konfessionelle Festlegung als „Aufseher des Heiligtums“ wiedergegeben.
