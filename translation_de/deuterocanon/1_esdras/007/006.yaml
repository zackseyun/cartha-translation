base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/007/006.yaml
  text: And the sons of Israel[a], and the priests, and the Levites, and the rest from the captivity who had been brought back[b], did according to what is in the book of Moses.
translation:
  language: de
  text: Und die Israeliten, die Priester, die Leviten und die Übrigen, die aus der Gefangenschaft zurückgebracht worden waren,[a] handelten nach dem, was im Buch des Mose steht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die aus der Gefangenschaft zurückgekehrt waren«. Das griechische Partizip ist passiv und kann in diesem Zusammenhang die Heimführung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ υἱοὶ Ἰσραήλ
  choice: die Israeliten
  rationale: Die natürliche moderne deutsche Bezeichnung gibt den festen biblischen Ausdruck genau wieder, ohne das griechische Maskulinum mit dem heute missverständlichen »Söhne Israels« unnötig einzuengen.
- source_word: οἱ λοιποί
  choice: die übrigen
  rationale: Dies gibt das substantivierte Adjektiv knapp wieder und unterscheidet diese Gruppe von den zuvor genannten Priestern und Leviten.
- source_word: οἱ ἐκ τῆς αἰχμαλωσίας
  choice: aus der Gefangenschaft
  rationale: Die Wendung bleibt nahe am griechischen Wortlaut; gemeint ist die babylonische Exils- beziehungsweise Gefangenschaftssituation.
- source_word: οἱ προσενεχθέντες
  choice: die zurückgebracht worden waren
  rationale: Die passive Form bewahrt die im griechischen Partizip erkennbare Fremdveranlassung; im Wiederherstellungskontext bezeichnet sie die Heimführung aus der Gefangenschaft.
- source_word: ἀκολούθως
  choice: nach
  rationale: Zusammen mit dem folgenden Dativ bezeichnet das Adverb die Übereinstimmung des Handelns mit dem schriftlich vorgegebenen Maßstab.
- source_word: τοῖς ἐν τῇ Μωσέως βίβλῳ
  choice: dem, was im Buch des Mose steht
  rationale: Die Formulierung ist gegenwärtiges, würdiges Deutsch und vermeidet es, über den griechischen Ausdruck hinaus ausdrücklich »Gesetz« oder »Vorschriften« einzusetzen.
theological_decisions:
- issue: Handlungsträgerschaft bei οἱ προσενεχθέντες
  choice: die zurückgebracht worden waren
  alternative: die zurückgekehrt waren
  rationale: Das passive Partizip legt ein Zurückgebrachtwerden näher als eine rein aktive Rückkehr. Die Übersetzung bewahrt diese mögliche Fremdveranlassung, ohne deren Urheber ausdrücklich zu bestimmen.
- issue: Bezeichnung der mosaischen Schrift
  choice: Buch des Mose
  alternative: Gesetz des Mose
  rationale: Der griechische Text sagt ausdrücklich »Buch« und lässt offen, ob damit enger gesetzliche Vorschriften oder umfassender die mosaische Schrift gemeint ist.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem biblischem Register. Die lange Aufzählung des griechischen Satzes bleibt erhalten; »Israeliten« vermeidet eine unnötig geschlechtsspezifische Wiedergabe des festen Volksnamens.
