base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/007/004.yaml
  text: And they completed these things by the decree of the Lord[a], the God of Israel, and with the approval of Cyrus and Darius and Artaxerxes[b], kings of the Persians.
translation:
  language: de
  text: Und sie vollendeten dies alles auf Anordnung des Herrn, des Gottes Israels, und mit Zustimmung[a] von Kyrus, Darius und Artaxerxes, dem König der Perser.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »mit Billigung« beziehungsweise »entsprechend dem Beschluss«.'
    reason: lexical_alternative
  - marker: b
    text: 'Im Griechischen steht der Singular: »des Königs der Perser«. Der Titel folgt formal auf »Artaxerxes«, kann dem Sinn nach jedoch alle drei genannten Herrscher als persische Könige bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: συνετέλεσαν
  choice: sie vollendeten
  rationale: Das Verb bezeichnet das Zu-Ende-Bringen einer Sache. »Vollendeten« ist würdig und bewahrt den Abschlussgedanken, ohne den Umfang des Vollendeten näher festzulegen.
- source_word: ταῦτα
  choice: dies alles
  rationale: Die natürliche deutsche Sammelformulierung gibt den griechischen Plural wieder, ohne ihn interpretierend auf bestimmte Arbeiten einzuengen.
- source_word: διὰ προτάγματος
  choice: auf Anordnung
  rationale: πρόταγμα bezeichnet eine verbindliche Anordnung oder einen Erlass; »auf Anordnung« gibt den instrumentalen Sinn von διά idiomatisch wieder.
- source_word: τοῦ κυρίου θεοῦ Ἰσραήλ
  choice: des Herrn, des Gottes Israels
  rationale: Die Apposition »des Gottes Israels« bleibt ausdrücklich erhalten und erläutert »des Herrn«.
- source_word: μετὰ τῆς γνώμης
  choice: mit Zustimmung
  rationale: γνώμη kann Meinung, Absicht, Beschluss oder Billigung bezeichnen. Im königlich-administrativen Zusammenhang ist »Zustimmung« natürlich, während eine Fußnote die Bedeutungsbreite offenhält.
- source_word: Κύρου καὶ Δαρείου καὶ Ἀρταξέρξου
  choice: Kyrus, Darius und Artaxerxes
  rationale: Die Eigennamen folgen den etablierten deutschen Formen.
- source_word: βασιλέως Περσῶν
  choice: den Königen der Perser
  rationale: Die sinngemäße Mehrzahl bezieht den Titel auf alle drei genannten Herrscher. Da der griechische Text formal den Singular hat, wird dies ausdrücklich in einer Fußnote kenntlich gemacht.
theological_decisions:
- issue: Verhältnis zwischen göttlicher Anordnung und königlicher Zustimmung
  choice: Die Vollendung geschieht auf Anordnung des Herrn und zugleich mit Zustimmung der persischen Herrscher.
  alternative: Die königliche Zustimmung könnte lediglich als untergeordnete Ausführung der göttlichen Anordnung verstanden werden.
  rationale: Der griechische Text koordiniert διὰ προτάγματος und μετὰ τῆς γνώμης. Die Übersetzung erhält beide Aussagen nebeneinander und löst ihr theologisches Verhältnis nicht weiter auf.
- issue: Bezug des Titels βασιλέως Περσῶν
  choice: Der Titel wird sinngemäß auf alle drei genannten persischen Könige bezogen.
  alternative: Der grammatische Singular kann formal allein auf Artaxerxes bezogen werden.
  rationale: 'Die Formulierung ist syntaktisch mehrdeutig: Der Singular steht unmittelbar nach Artaxerxes, doch sachlich sind alle drei Genannten persische Könige. Die Hauptübersetzung bietet den naheliegenden Gesamtsinn; die Fußnote bewahrt die formale Lesart.'
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. »Dies alles« und »auf Anordnung« vermeiden unnötige Schwerfälligkeit; die Fußnoten bewahren die lexikalische und syntaktische Mehrdeutigkeit des Griechischen.
