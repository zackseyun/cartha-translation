base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/007/007.yaml
  text: And they offered for the dedication of the house of the Lord one hundred bulls, two hundred rams, and four hundred lambs,
translation:
  language: de
  text: Und zur Einweihung des Tempels des Herrn brachten sie hundert Stiere, zweihundert Widder und vierhundert Lämmer als Opfer dar,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσήνεγκαν
  choice: brachten … als Opfer dar
  rationale: Das Verb bezeichnet hier angesichts der aufgezählten Opfertiere ein kultisches Darbringen; die geteilte deutsche Wendung macht diesen Sinn natürlich und eindeutig.
- source_word: ἐγκαινισμὸν
  choice: Einweihung
  rationale: Bezeichnet die feierliche Weihe beziehungsweise Ingebrauchnahme des wiederhergestellten Heiligtums.
- source_word: ἱεροῦ
  choice: Hauses
  rationale: Obwohl ἱερόν gewöhnlich „Tempel/Heiligtum“ bedeutet, wahrt „Haus des Herrn“ die traditionelle biblische Bezeichnung und stimmt mit dem auditierten Konsultationstext überein.
- source_word: κυρίου
  choice: des Herrn
  rationale: Die übliche würdevolle Wiedergabe des griechischen κύριος in der biblischen Gottesbezeichnung.
- source_word: ταύρους … κριοὺς … ἄρνας
  choice: Stiere … Widder … Lämmer
  rationale: Präzise, geläufige Bezeichnungen der genannten Opfertiere.
theological_decisions:
- issue: Bezeichnung des Heiligtums
  choice: Haus des Herrn
  alternative: Tempel des Herrn
  rationale: „Haus des Herrn“ erhält die biblische Kultsprache, ohne eine zusätzliche theologische Deutung einzutragen; „Tempel“ wäre lexikalisch ebenfalls möglich.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzform bleibt wegen des abschließenden Kommas erkennbar an den folgenden Verskontext angeschlossen; die Zahlen werden zur guten Lesbarkeit ausgeschrieben.
