base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/007/014.yaml
  text: And they kept the Feast of Unleavened Bread for seven days[a], rejoicing before the Lord,
translation:
  language: de
  text: Und sie feierten das Fest der Ungesäuerten Brote sieben Tage lang und freuten sich vor dem Herrn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die griechische Fassung sagt »vor dem Herrn«. Die hebräische Parallelstelle sagt »mit Freude«, denn der HERR hatte ihnen Freude geschenkt.
    reason: Die Fußnote dokumentiert die unterschiedliche, aber verwandte Formulierung des griechischen Haupttextes und der hebräischen Parallelstelle.
lexical_decisions:
- source_word: ἤγαγον τὴν ἑορτήν
  choice: sie feierten das Fest
  rationale: ἄγω bezeichnet in Verbindung mit einem Fest dessen Begehung oder Feier. »Sie feierten« gibt die Wendung im heutigen Deutsch natürlich und präzise wieder.
- source_word: τῶν ἀζύμων
  choice: der ungesäuerten Brote
  rationale: Dies ist die geläufige deutsche Bezeichnung des jüdischen Festes; die hebräische Parallelstelle חַג־מַצּוֹת bestätigt den Festnamen.
- source_word: ἑπτὰ ἡμέρας
  choice: sieben Tage lang
  rationale: Der Akkusativ bezeichnet die zeitliche Ausdehnung; »lang« macht diese Funktion im Deutschen idiomatisch deutlich.
- source_word: εὐφραινόμενοι
  choice: und freuten sich
  rationale: Das begleitende Partizip beschreibt die Freude während der Festfeier. Die finite deutsche Form ist klar und bewahrt den verbalen Charakter.
- source_word: ἔναντι Κυρίου
  choice: vor dem Herrn
  rationale: ἔναντι bezeichnet das Sein in Gottes Gegenwart. »Vor dem Herrn« ist eine formnahe, verständliche Wiedergabe von Κυρίου.
theological_decisions:
- issue: Wiedergabe von Κυρίου bei einer hebräischen Parallelstelle mit dem Gottesnamen JHWH
  choice: dem Herrn
  alternative: vor JHWH; vor dem HERRN
  rationale: Der primäre griechische Text bietet Κυρίου. »Herrn« folgt diesem Wortlaut, während die Fußnote transparent auf die abweichende Formulierung der hebräischen Parallelstelle hinweist.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Festname bleibt in seiner geläufigen biblischen Form erhalten; die Satzstruktur ist natürlich und eng am griechischen Wortlaut.
