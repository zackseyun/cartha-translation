base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/007/013.yaml
  text: And the sons of Israel who were from the captivity ate[a], all those who had separated themselves from the abominations of the nations of the land[b], seeking the Lord.
translation:
  language: de
  text: Und die Söhne Israels, die aus der Gefangenschaft stammten, aßen[a], alle, die sich von den Gräueln der Völker des Landes[b] abgesondert hatten und den Herrn suchten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Gemeint ist: Sie aßen das Passamahl. Der Gegenstand des Verbs ergibt sich aus dem vorhergehenden Zusammenhang, bleibt im Griechischen hier aber unausgesprochen.'
    reason: cross_reference
  - marker: b
    text: „Völker des Landes“ kann auch „Bewohner des Landes“ bedeuten. Gemeint sind die umliegenden Menschen beziehungsweise Volksgruppen, deren Praktiken als verunreinigend galten.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐφάγοσαν
  choice: aßen
  rationale: Das Verb bedeutet schlicht „aßen“. Sein Gegenstand, das Passamahl, ergibt sich aus dem vorangehenden Zusammenhang, wird im griechischen Vers selbst aber nicht genannt.
- source_word: οἱ υἱοὶ Ἰσραήλ
  choice: die Söhne Israels
  rationale: Die formnahe Wiedergabe bewahrt die genealogische und bundesbezogene Ausdrucksweise des Griechischen; „Israeliten“ wäre natürlicher, würde aber die Bildsprache einebnen.
- source_word: οἱ ἐκ τῆς αἰχμαλωσίας
  choice: die aus der Gefangenschaft gekommen waren
  rationale: Die Wendung bezeichnet diejenigen, die aus der Gefangenschaft beziehungsweise dem Exil stammten. „gekommen waren“ macht den Bezug im Deutschen verständlich, ohne ausdrücklich „zurückgekehrt“ hinzuzufügen.
- source_word: χωρισθέντες
  choice: die sich ... abgesondert hatten
  rationale: Das passive Partizip lässt hier eine reflexive beziehungsweise mediale Wiedergabe zu und bezeichnet eine vollzogene Trennung von verunreinigenden Praktiken.
- source_word: βδελυγμάτων
  choice: Gräueln
  rationale: „Gräuel“ bewahrt die starke kultisch-moralische Wertung des griechischen Wortes, ohne sie erklärend auf bestimmte Praktiken einzuengen.
- source_word: τῶν ἐθνῶν τῆς γῆς
  choice: der Völker des Landes
  rationale: „Völker“ gibt ἐθνῶν neutral wieder und vermeidet die spätere technische Färbung von „Heiden“. Die Genitivverbindung bleibt bewusst mehrdeutig.
- source_word: ζητοῦντες τὸν κύριον
  choice: und den Herrn suchten
  rationale: Die finite Koordination ist im Deutschen natürlicher als ein angehängtes Partizip und bewahrt die fortdauernde religiöse Ausrichtung der bezeichneten Personen.
theological_decisions:
- issue: Soll der unausgesprochene Gegenstand des Essens ergänzt werden?
  choice: 'Im Haupttext bleibt der Gegenstand unausgesprochen: „aßen“.'
  alternative: „aßen das Passamahl“
  rationale: Der vorherige Zusammenhang erschließt das Passamahl, doch der griechische Vers nennt keinen Gegenstand. Die Fußnote erläutert ihn, ohne ihn in den Text einzutragen.
- issue: Wie ist die Absonderung von den Gräueln zu verstehen?
  choice: „die sich von den Gräueln ... abgesondert hatten“
  alternative: „die von der Unreinheit ... abgesondert worden waren“
  rationale: Die reflexive Wiedergabe lässt die bewusste Abkehr erkennen und erhält zugleich das kultisch-moralische Gewicht, ohne eine bloß ethnische Abgrenzung zu behaupten.
- issue: Bezugsbereich von τῶν ἐθνῶν τῆς γῆς
  choice: „der Völker des Landes“
  alternative: „der Bewohner des Landes“
  rationale: Die wörtlichere Fassung bewahrt, ob die Wendung die umliegenden Volksgruppen oder allgemeiner die Bewohner des Landes bezeichnet; die Fußnote nennt die mögliche Alternative.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit formnaher biblischer Ausdrucksweise. Der Gedankenstrich gliedert die nachgestellte nähere Bestimmung. Sämtliche Fußnotenmarker stehen im Haupttext.
