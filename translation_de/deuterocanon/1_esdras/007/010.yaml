base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/007/010.yaml
  text: And the sons of Israel from the captivity kept the Passover on the fourteenth day of the first month[b][a], when the priests and the Levites had purified themselves together.
translation:
  language: de
  text: Und die Söhne Israels aus der Gefangenschaft[a] feierten am vierzehnten Tag des ersten Monats das Passafest, als die Priester und die Leviten sich gemeinsam gereinigt hatten.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „aus dem Exil“. Wörtlich steht im Griechischen „aus der Gefangenschaft“; gemeint sind die Israeliten, die mit der Rückkehr aus dem Exil verbunden waren.'
    reason: lexical_alternative
  - marker: b
    text: Gemeint ist die rituelle Reinigung der Priester und Leviten zur Vorbereitung auf das Passafest. Das Griechische kann formal auch mit „gemeinsam gereinigt worden waren“ wiedergegeben werden.
    reason: cultural_and_textual_note
lexical_decisions:
- source_word: ἤγαγον … τὸ πάσχα
  choice: feierten … das Passafest
  rationale: ἄγω bedeutet grundsätzlich „führen“ oder „bringen“, bezeichnet mit πάσχα im kultischen Zusammenhang hier jedoch die Feier beziehungsweise Begehung des Passafestes. „Feierten“ gibt den idiomatischen Sinn in natürlichem Deutsch wieder.
- source_word: οἱ υἱοὶ Ἰσραήλ
  choice: die Söhne Israels
  rationale: Die traditionelle korporative Bezeichnung wird formal transparent bewahrt und bringt die gemeinsame Abstammungsidentität zum Ausdruck; „die Israeliten“ wäre eine flüssigere Alternative.
- source_word: τῶν ἐκ τῆς αἰχμαλωσίας
  choice: aus der Gefangenschaft
  rationale: Die Wendung bezeichnet die zu den Verschleppten beziehungsweise Heimkehrern gehörenden Israeliten. „Aus der Gefangenschaft“ bleibt nahe am griechischen Wortlaut; die im Kontext naheliegende Bedeutung „aus dem Exil“ wird in der Fußnote genannt.
- source_word: ἐν τῇ τεσσαρεσκαιδεκάτῃ τοῦ πρώτου μηνός
  choice: am vierzehnten Tag des ersten Monats
  rationale: Natürliche deutsche Datumsangabe, die sämtliche zeitlichen Angaben des Griechischen erhält.
- source_word: ὅτε
  choice: als
  rationale: Die Konjunktion stellt einen zeitlichen Zusammenhang her. „Als“ bewahrt diesen, ohne zusätzlich eine kausale oder strikt nachzeitige Beziehung festzulegen.
- source_word: ἡγνίσθησαν
  choice: sich … gereinigt hatten
  rationale: Das Verb bezeichnet hier die für den Gottesdienst erforderliche rituelle Reinigung. Die vorzeitige deutsche Form macht die abgeschlossene Vorbereitung im Verhältnis zur Passafeier deutlich.
- source_word: ἅμα
  choice: gemeinsam
  rationale: Das Adverb kann Gemeinsamkeit oder Gleichzeitigkeit ausdrücken. „Gemeinsam“ ist knapp und lässt den zeitlichen Aspekt im Kontext offen.
theological_decisions:
- issue: Korporative Bezeichnung οἱ υἱοὶ Ἰσραήλ
  choice: die Söhne Israels
  alternative: die Israeliten
  rationale: Die konkrete, abstammungsbezogene Bildsprache der Vorlage bleibt erhalten, ohne sie zu einer rein allgemeinen Volksbezeichnung zu glätten.
- issue: Kultische Reinigung
  choice: sich gemeinsam gereinigt hatten
  alternative: gemeinsam gereinigt worden waren
  rationale: Der Zusammenhang betrifft die rituelle Vorbereitung auf das Passafest, nicht eine abstrakte moralische Reinigung. Die reflexive Wiedergabe ist im Deutschen natürlich und sachlich passend; die passive Form des Griechischen lässt formal auch eine passive Übersetzung zu.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit moderat formaler biblischer Prägung. Die ungewöhnliche Wendung „Söhne Israels aus der Gefangenschaft“ bewahrt die Struktur des griechischen Textes; die Fußnote erläutert ihre historische Bedeutung.
