base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/007/001.yaml
  text: Then Sisinnes[a], governor of Coele-Syria and Phoenicia, and Sathrabuzanes and their associates, following what had been commanded by King Darius[b],
translation:
  language: de
  text: Da befolgten Sisinnes, der Statthalter von Koilesyrien[a] und Phönizien, Sathrabuzanes und ihre Gefährten[b] die Befehle, die König Darius erteilt hatte,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Koilesyrien ist ein antiker Gebietsname; die griechische Bezeichnung ist nicht einfach als „hohles Syrien“ zu verstehen.
    reason: cultural_note
  - marker: b
    text: 'Oder: „ihre Mitarbeiter“ beziehungsweise „ihre Verbündeten“. Das griechische Wort kann Gefährten, Teilhaber oder Verbündete bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Da
  rationale: Leitet in einem knappen, natürlichen Erzählstil die anschließende Handlung ein.
- source_word: Σισίννης
  choice: Sisinnes
  rationale: Der griechische Personenname wird in einer im Deutschen gut lesbaren Form transliteriert.
- source_word: ἔπαρχος
  choice: Statthalter
  rationale: Bezeichnet hier ein ziviles Verwaltungsamt; „Statthalter“ ist im historischen deutschen Erzählstil klar, ohne eine speziell römische Amtsbezeichnung einzutragen.
- source_word: κοίλης Συρίας
  choice: Koilesyrien
  rationale: Die Wortgruppe ist als formaler antiker Gebietsname zu verstehen und wird daher nicht wörtlich als „hohles Syrien“ wiedergegeben.
- source_word: Φοινίκης
  choice: Phönizien
  rationale: Übliche deutsche Form des Ortsnamens.
- source_word: Σαθραβούζανης
  choice: Sathrabuzanes
  rationale: Der im griechischen Ausgangstext bezeugte Personenname wird transliteriert.
- source_word: οἱ συνέταιροι
  choice: ihre Gefährten
  rationale: Das Wort bezeichnet Gefährten, Teilhaber oder Verbündete. „Ihre Gefährten“ ist verständlich und lässt die genaue amtliche oder persönliche Beziehung offen.
- source_word: κατακολουθήσαντες
  choice: befolgten
  rationale: Im Zusammenhang mit königlichen Befehlen drückt das Partizip aus, dass die Genannten sich danach richteten; die finite Wiedergabe ergibt im Deutschen einen natürlichen Satz.
- source_word: τοῖς ... προσταγεῖσιν
  choice: die Befehle, die ... erteilt hatte
  rationale: Gibt die substantivierte passive Form idiomatisch wieder und wahrt den Sinn bereits ergangener königlicher Anordnungen.
- source_word: τοῦ βασιλέως Δαρείου
  choice: König Darius
  rationale: Die Urheberschaft der Befehle wird im deutschen Relativsatz natürlich mit dem handelnden Subjekt ausgedrückt.
