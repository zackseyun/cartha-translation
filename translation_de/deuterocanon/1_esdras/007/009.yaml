revisions:
- from: Und die Priester und die Leviten traten an, bekleidet und nach Abteilungen[a] geordnet, um die Aufgaben für den Herrn, den Gott Israels, wahrzunehmen, wie es dem Buch des Mose entsprach[b]; und die Torhüter standen an jedem Tor.
  to: Und die Priester und die Leviten standen, festlich gekleidet und nach Abteilungen[a] geordnet, bei den Arbeiten für den Herrn, den Gott Israels, gemäß dem Buch Mose[b]; die Torhüter standen an jedem Tor.
  rationale: Die Revision gibt die Stellungnahme der Priester, Leviten und Torhüter mit „standen“ unmittelbar wieder und wahrt den Bezug der Priester und Leviten zu den „Arbeiten“ des Herrn. „Festlich gekleidet“ gibt ἐστολισμένοι als formelle, geschmückte Aufmachung wieder, ohne bestimmte priesterliche Gewänder zu behaupten. Die Fußnote zum hebräischen Paralleltext wurde sachlich berichtigt.
