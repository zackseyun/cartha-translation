base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/007/009.yaml
  text: And the priests and the Levites stood arrayed by divisions for the works of the Lord God of Israel[a], in accordance with the book of Moses[b], and the gatekeepers at each gate.
translation:
  language: de
  text: Und die Priester und die Leviten standen, festlich gekleidet und nach Abteilungen[a] geordnet, bei den Arbeiten für den Herrn, den Gott Israels, gemäß dem Buch Mose[b]; die Torhüter standen an jedem Tor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „nach Stämmen“. Gemeint sind hier wahrscheinlich die geordneten Abteilungen des priesterlichen und levitischen Dienstes.'
    reason: lexical_alternative
  - marker: b
    text: Die angeführte hebräische Parallelüberlieferung beschreibt stattdessen das Fest der ungesäuerten Brote und sagt, dass der Herr das Herz des Königs von Assyrien ihnen zuwandte, damit dieser ihre Hände bei der Arbeit am Haus Gottes stärkte. Der griechische Text beschreibt hier die geordnete Aufstellung der Priester und Leviten gemäß dem Buch Mose.
    reason: cross_reference
lexical_decisions:
- source_word: ἔστησαν
  choice: traten an
  rationale: Das Verb bezeichnet hier nicht nur das Stehen, sondern auch das Einnehmen des zugewiesenen Platzes; „traten an“ gibt dies in natürlichem Deutsch wieder.
- source_word: ἐστολισμένοι
  choice: bekleidet
  rationale: Die zurückhaltende Wiedergabe wahrt den Hinweis auf die angemessene Kleidung, ohne ausdrücklich priesterliche Gewänder oder Schmuck anzunehmen.
- source_word: κατὰ φυλάς
  choice: nach Abteilungen geordnet
  rationale: Wörtlich steht „nach Stämmen“. Im Zusammenhang des geordneten priesterlichen und levitischen Dienstes sind wahrscheinlich Dienstgruppen gemeint; die wörtliche Möglichkeit bleibt in der Fußnote erhalten.
- source_word: ἐπὶ τῶν ἔργων
  choice: um die Aufgaben … wahrzunehmen
  rationale: ἐπί mit Genitiv kann einen Zuständigkeitsbereich bezeichnen. Die Formulierung gibt den Dienst- beziehungsweise Aufgabencharakter idiomatisch wieder, ohne ihn auf eine einzelne Tätigkeit einzuengen.
- source_word: Κυρίου θεοῦ Ἰσραήλ
  choice: des Herrn, des Gottes Israels
  rationale: Die Apposition macht die griechische Titelfolge im Deutschen klar und bewahrt „Herr“ als Wiedergabe von κύριος.
- source_word: ἀκολούθως τῇ Μωσέως βίβλῳ
  choice: wie es dem Buch des Mose entsprach
  rationale: Die Formulierung drückt aus, dass die Ordnung mit der schriftlich überlieferten mosaischen Weisung übereinstimmte.
- source_word: θυρωροί
  choice: Torhüter
  rationale: „Torhüter“ ist die klare moderne Bezeichnung für das an den Tempeleingängen eingesetzte Personal.
- source_word: ἐφʼ ἑκάστου πυλῶνος
  choice: an jedem Tor
  rationale: Dies ist eine knappe und natürliche Wiedergabe der Ortsangabe im Tempelzusammenhang.
theological_decisions:
- issue: Wiedergabe von κύριος in der griechischen deuterokanonischen Überlieferung
  choice: Herr
  alternative: HERR
  rationale: Der maßgebliche griechische Text bietet Κύριος. Daher wird „Herr“ übersetzt, statt die typografische Wiedergabe des hebräischen Gottesnamens aus einer Parallelüberlieferung in den Haupttext zu übernehmen.
- issue: Art der von κατὰ φυλάς bezeichneten Ordnung
  choice: Abteilungen
  alternative: Stämme
  rationale: Der kultische Zusammenhang legt organisierte Dienstgruppen nahe. Da φυλή jedoch wörtlich „Stamm“ bedeuten kann, wird diese echte lexikalische Spannung in einer Fußnote offengelegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur folgt dem griechischen Ablauf, wird aber durch „traten an“ und „wahrzunehmen“ idiomatisch geglättet. Die Formulierung vermeidet konfessionell geprägte Fachbegriffe und übermäßige Präzisierungen zur Kleidung oder zu den Dienstgruppen.
