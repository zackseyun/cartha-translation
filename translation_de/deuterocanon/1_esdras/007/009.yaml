  naturalness: Der Entwurf ist insgesamt verständlich und registergerecht. Die Revision bleibt modernes, würdiges Standarddeutsch, folgt aber der griechischen Satzbewegung unmittelbarer.
  terminology: „Herr, der Gott Israels“, „Torhüter“ und „Buch Mose“ sind passend. „Abteilungen“ ist als kontextuelle Deutung von κατὰ φυλάς vertretbar, sofern die wörtliche Alternative „Stämmen“ in der Fußnote erhalten bleibt. Die Paralleltextfußnote muss präzisieren, dass der hebräische Text das Stärken ihrer Hände als Zweck der Zuwendung des assyrischen Königs nennt, nicht als unmittelbares Handeln Gottes formuliert.
