base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/080.yaml
  text: saying that the land into which you are entering to inherit is a land defiled by the defilement of the foreigners of the land[b][a], and they have filled it with their uncleanness.
translation:
  language: de
  text: 'mit den Worten: »Das Land, in das ihr einzieht, um es als Erbe zu empfangen, ist ein Land, das durch die Verunreinigung der Fremden des Landes[a] verunreinigt ist; sie haben es mit ihrer Unreinheit[b] erfüllt.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder nach der Ausdrucksweise der hebräischen Parallelüberlieferung: »der Völker des Landes«. Das Griechische bezeichnet sie genauer als Fremde.'
    reason: alternative_reading
  - marker: b
    text: „Unreinheit“ kann hier sowohl rituelle als auch moralische Bedeutung haben; der Wortlaut legt sich nicht auf nur einen dieser Aspekte fest.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγων ὅτι
  choice: 'mit den Worten:'
  rationale: Leitet den Inhalt des zuvor erwähnten Redens natürlich als direktes Zitat ein, ohne die syntaktische Verbindung zum vorhergehenden Vers aufzulösen.
- source_word: ἡ γῆ
  choice: das Land
  rationale: Gemeint ist das bestimmte Gebiet, in das Israel einzieht, nicht die Erde im allgemeinen Sinn.
- source_word: εἰς ἣν εἰσέρχεσθε
  choice: in das ihr einzieht
  rationale: „Einziehen“ bewahrt die Richtungsangabe und passt natürlich zum Eintritt in ein Land.
- source_word: κληρονομῆσαι
  choice: um es als Erbe zu empfangen
  rationale: Bewahrt ausdrücklich den Erbgedanken von κληρονομέω; die bloße Wiedergabe „in Besitz nehmen“ würde diese heilsgeschichtlich wichtige Nuance abschwächen.
- source_word: μεμολυσμένη μολυσμῷ
  choice: durch die Befleckung … befleckt
  rationale: Die Wiederholung desselben Wortstamms gibt die nachdrückliche figura etymologica des Griechischen wieder. „Befleckung“ kann sowohl kultische als auch sittliche Verunreinigung bezeichnen.
- source_word: τῶν ἀλλογενῶν τῆς γῆς
  choice: der Fremden im Land
  rationale: ἀλλογενής bezeichnet Menschen anderer Herkunft. Die Formulierung wahrt diesen Fremdheitsaspekt, während „im Land“ den griechischen Genitiv in verständlichem modernem Deutsch wiedergibt.
- source_word: τῆς ἀκαθαρσίας αὐτῶν
  choice: mit ihrer Unreinheit
  rationale: „Unreinheit“ lässt wie ἀκαθαρσία sowohl rituelle als auch moralische Bezüge offen.
- source_word: ἐνέπλησαν αὐτήν
  choice: sie haben es … erfüllt
  rationale: Gibt das aktive „füllen/erfüllen“ und den daraus hervorgegangenen Zustand wieder; das Pronomen bezieht sich auf das Land.
theological_decisions:
- issue: Rituelle oder moralische Bedeutung der Verunreinigung
  choice: Befleckung und Unreinheit ohne Einschränkung auf nur einen Bereich
  alternative: rituelle Verunreinigung beziehungsweise sittliche Verderbtheit ausdrücklich festlegen
  rationale: μολυσμός und ἀκαθαρσία können kultische wie ethische Bedeutung tragen. Die Übersetzung bewahrt diese Spannung.
- issue: Wiedergabe von ἀλλογενῶν gegenüber der hebräischen Parallelformulierung
  choice: Fremde im Land
  alternative: Völker des Landes
  rationale: Für 1 Esdras ist der griechische Text maßgeblich; ἀλλογενῶν hebt ausdrücklich die fremde Herkunft hervor. Die aus der hebräischen Überlieferung bekannte Wendung bleibt als Fußnotenalternative sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die auffällige Wiederholung „Befleckung … befleckt“ ist bewusst beibehalten, weil sie die emphatische Wortstammwiederholung des griechischen Textes spiegelt. Der Versanfang bleibt als syntaktische Fortsetzung des vorhergehenden Zusammenhangs kleingeschrieben.
