base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/024.yaml
  text: And all who transgress both the law of your God and the king’s law shall be diligently punished[a], whether by death or by punishment[c][b], by a fine of silver or by confiscation.
translation:
  language: de
  text: Und alle, die sowohl das Gesetz deines Gottes als auch das Gesetz des Königs übertreten, sollen mit aller Sorgfalt bestraft werden[a] – sei es durch Todesstrafe, durch eine Strafe, durch eine Geldbuße oder durch Beschlagnahme[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die hier zugrunde liegende griechische Fassung weicht erheblich von der mitgelieferten aramäischen MT-Parallele ab, die zu einem anderen Verszusammenhang gehört. Daher folgt die Übersetzung dem griechischen Text.
    reason: textual_variant
  - marker: b
    text: Das griechische Wort kann wörtlich auch „Wegführung“ oder „Fortschaffung“ bedeuten und daher als Abführung oder Verbannung verstanden werden. Im vorliegenden strafrechtlichen Zusammenhang ist jedoch Beschlagnahme beziehungsweise Einziehung von Besitz am naheliegendsten.
    reason: lexical_ambiguity
lexical_decisions:
- source_word: παραβαίνωσι
  choice: übertreten
  rationale: Das Verb bezeichnet im rechtlichen Zusammenhang die Verletzung einer verbindlichen Vorschrift; „übertreten“ bewahrt diesen gehobenen Rechtscharakter.
- source_word: καὶ τὸν νόμον τοῦ θεοῦ σου καὶ τοῦ βασιλικοῦ
  choice: sowohl das Gesetz deines Gottes als auch das Gesetz des Königs
  rationale: Die doppelte καί-Konstruktion drückt die gemeinsame Nennung beider Rechtsordnungen aus. Das substantivierte βασιλικοῦ enthält eine Ellipse, die im Deutschen durch die Wiederholung von „Gesetz“ verständlich gemacht wird.
- source_word: ἐπιμελῶς
  choice: mit aller Sorgfalt
  rationale: Das Adverb bezeichnet gewissenhafte, nachdrückliche Durchführung. Die Formulierung ist im Deutschen natürlicher als „sorgfältig bestraft“, ohne die Bedeutung vorschnell auf „streng“ zu verengen.
- source_word: κολασθήσονται
  choice: sollen … bestraft werden
  rationale: Das Futur Passiv kündigt im Erlass die verbindliche Vollstreckung einer gerichtlichen Strafe an; deutsches „sollen“ gibt diesen normativen Zukunftssinn natürlich wieder.
- source_word: θανάτῳ
  choice: mit dem Tod
  rationale: Der Dativ bezeichnet hier die Art oder das Mittel der Bestrafung.
- source_word: τιμωρίᾳ
  choice: mit einer anderen Strafe
  rationale: Das Wort bezeichnet Strafe allgemein. „Andere“ macht im Deutschen verständlich, dass neben der bereits genannten Todesstrafe eine weitere, nicht näher bestimmte Strafart gemeint ist, ohne sie etwa als Körperstrafe festzulegen.
- source_word: ἀργυρίῳ ζημίᾳ
  choice: mit einer Geldbuße
  rationale: Die Verbindung bezeichnet eine Vermögens- beziehungsweise Geldstrafe; „Geldbuße“ ist die natürliche moderne Rechtsformulierung.
- source_word: ἀπαγωγῇ
  choice: mit Wegführung
  rationale: Das Substantiv bezeichnet grundlegend ein Wegführen oder Fortschaffen. Die relativ offene Wiedergabe vermeidet eine nicht eindeutig im griechischen Wort festgelegte Entscheidung zwischen Abführung, Verbannung und möglicher Wegnahme.
theological_decisions:
- issue: Verhältnis zwischen göttlichem und königlichem Gesetz
  choice: sowohl das Gesetz deines Gottes als auch das Gesetz des Königs
  alternative: das Gesetz deines Gottes oder das Gesetz des Königs
  rationale: καὶ … καὶ bezeichnet hier am natürlichsten die doppelte rechtliche Bindung. Die Übersetzung löst eine mögliche Spannung zwischen beiden Rechtsordnungen nicht konfessionell auf.
- issue: Abweichung der griechischen Vorlage von der mitgelieferten MT-Parallele
  choice: Der griechischen Hauptvorlage folgen
  alternative: Den Wortlaut an die aramäische MT-Parallele angleichen
  rationale: Die angegebene MT-Stelle entspricht inhaltlich einem anderen Verszusammenhang. Deshalb bestimmt der griechische Text die Übersetzung; eine Harmonisierung würde den überlieferten Unterschied verdecken.
- issue: Uneindeutige Reihe der Strafarten
  choice: Die Strafarten offen und in der Reihenfolge des Griechischen wiedergeben
  alternative: Die Reihe gemäß Esra 7,26 eindeutig als Tod, Verbannung, Vermögenseinzug und Gefängnis ordnen
  rationale: Der vorliegende griechische Wortlaut ist syntaktisch auffällig und benennt die letzte Sanktion nicht eindeutig. Die Übersetzung soll diese Unsicherheit nicht durch Rückübersetzung aus einer Parallelüberlieferung beseitigen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit rechtlich-administrativem Ton. Die Strafaufzählung bleibt knapp; sachlich notwendige Unsicherheiten des griechischen Wortlauts werden in den Fußnoten offengelegt.
