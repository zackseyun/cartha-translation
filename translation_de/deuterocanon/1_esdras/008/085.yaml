  terminology: „Herr“, „Gesetz“, „Unreinheit“ und „Völker des Landes“ sind registergerecht und textnah. Die Fußnote zu „Wurzel“ bewahrt die Metapher und erläutert sie, ohne sie im Text durch eine theologisch oder kontextuell engere Deutung wie „Rest“ zu ersetzen.
