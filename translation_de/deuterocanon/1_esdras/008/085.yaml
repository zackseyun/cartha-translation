base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/085.yaml
  text: For you, Lord, who have lightened our sins, have given us such a root; yet we have turned back to transgress your law by mingling with the uncleanness of the nations of the land.
translation:
  language: de
  text: Denn du, Herr, hast die Last unserer Sünden erleichtert und uns eine solche Wurzel[a] gegeben. Dennoch haben wir uns wieder dazu gewandt, dein Gesetz zu übertreten und uns mit der Unreinheit der Völker des Landes zu vermischen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Wurzel«; gemeint sein kann eine neu gewährte Lebensgrundlage, aus der das Volk wieder wachsen kann.'
    reason: Die Metapher ist im Deutschen erklärungsbedürftig, soll aber wegen des eindeutigen griechischen Wortlauts nicht durch »Rest« ersetzt werden.
lexical_decisions:
- source_word: κουφίσας τὰς ἁμαρτίας ἡμῶν
  choice: die Last unserer Sünden erleichtert
  rationale: κουφίζω bezeichnet ein Leichtermachen oder Erleichtern. Die deutsche Formulierung macht das im Griechischen bildhaft ausgedrückte Erleichtern verständlich, ohne genauer festzulegen, ob Schuld, Strafe oder Not gelindert wurde.
- source_word: ῥίζαν
  choice: Wurzel
  rationale: Die konkrete Metapher des griechischen Textes wird bewahrt; eine Deutung als »Rest« wäre kontextuell möglich, steht hier aber nicht ausdrücklich.
- source_word: πάλιν ἀνεκάμψαμεν
  choice: Dennoch haben wir uns wieder dazu gewandt
  rationale: Gibt die Rückwendung zu einem früheren Fehlverhalten wieder und bewahrt den beklagenden Gegensatz zum vorausgehenden göttlichen Handeln.
- source_word: ἐπιμιγῆναι
  choice: uns … zu vermischen
  rationale: Entspricht dem passivischen Infinitiv im Sinn einer Vermischung beziehungsweise Verbindung, ohne diese im Haupttext enger als Eheschließung auszulegen.
- source_word: τῶν ἐθνῶν τῆς γῆς
  choice: der Völker des Landes
  rationale: Bewahrt die übliche biblische Wendung; γῆ kann je nach Zusammenhang »Land« oder »Erde« bedeuten.
theological_decisions:
- issue: Bedeutung der gegebenen »Wurzel«
  choice: Die Metapher »Wurzel« bleibt im Haupttext stehen.
  alternative: »Rest« oder »Nachkommenschaft«
  rationale: Der griechische Primärtext hat ausdrücklich ῥίζα. Eine interpretierende Ersetzung würde das Bild und seine mögliche Mehrdeutigkeit beseitigen.
- issue: Gegenstand der Vermischung mit den Völkern
  choice: Allgemein »uns … zu vermischen«
  alternative: »Mischehen mit ihnen einzugehen«
  rationale: Der weitere Kontext kann Eheschließungen meinen, doch dieser Vers verwendet nur das allgemeinere ἐπιμιγῆναι. Die Übersetzung legt die konkrete Form daher nicht stillschweigend fest.
- issue: Was durch Gott erleichtert wurde
  choice: »die Last unserer Sünden erleichtert«
  alternative: »unsere Strafe für die Sünden gemildert«
  rationale: Das Griechische nennt die Sünden, nicht ausdrücklich die Strafe. Die gewählte bildhafte Form ist natürliches Deutsch und lässt die genaue theologische Beziehung offen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau wurde für gute Lesbarkeit in zwei Sätze gegliedert; die zentrale Wurzelmetapher und die Mehrdeutigkeit des Erleichterns bleiben erhalten.
