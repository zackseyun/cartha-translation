base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/064.yaml
  text: And they delivered the king’s decrees to the royal stewards and to the governors of Syria and Phoenicia[a], and they honored the nation and the sanctuary of the Lord.
translation:
  language: de
  text: Und sie übergaben die Anordnungen des Königs den königlichen Verwaltern und den Statthaltern von Syrien und Phönizien und erwiesen dem Volk und dem Heiligtum des Herrn Ehre.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: „Und sie verherrlichten das Volk und das Heiligtum des Herrn.“ Das griechische Verb kann sowohl „verherrlichen“ als auch „ehren“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέδωκαν
  choice: sie übergaben
  rationale: Das Verb bezeichnet hier die ordnungsgemäße Übergabe amtlicher Anordnungen an zuständige Amtsträger; „übergaben“ ist natürlich und wahrt den administrativen Sinn.
- source_word: τὰ προστάγματα
  choice: die Anordnungen
  rationale: πρόσταγμα bezeichnet eine verbindliche amtliche Weisung. „Anordnungen“ gibt die staatliche Autorität wieder, ohne eine bestimmte Rechtsform wie „Erlasse“ vorauszusetzen.
- source_word: τοῖς βασιλικοῖς οἰκονόμοις
  choice: den königlichen Verwaltern
  rationale: οἰκονόμος meint einen mit Verwaltung betrauten Haushalter oder Amtsträger. „Verwalter“ bewahrt den Bedeutungskern und passt zum königlichen Verwaltungszusammenhang.
- source_word: τοῖς ἐπάρχοις
  choice: den Statthaltern
  rationale: ἔπαρχος bezeichnet einen leitenden regionalen oder provinzialen Amtsträger; „Statthalter“ ist im historischen Kontext präzise und verständlich.
- source_word: Συρίας καὶ Φοινίκης
  choice: von Syrien und Phönizien
  rationale: Die Genitive bezeichnen die Amtsgebiete der Statthalter. Die deutsche Verbindung mit „von“ gibt dies idiomatisch wieder.
- source_word: ἐδόξασαν
  choice: erwiesen … Ehre
  rationale: δοξάζω kann „verherrlichen“ oder „ehren“ bedeuten. Bei „Volk“ und „Heiligtum“ als Objekten bezeichnet es hier plausibel öffentliche Ehrung oder besondere Anerkennung; die Fußnote bewahrt die wörtlichere Alternative.
- source_word: τὸ ἔθνος
  choice: dem Volk
  rationale: ἔθνος bezeichnet hier das jüdische Volk als kollektive Gemeinschaft. Im Deutschen ist „Volk“ natürlicher und weniger modern-staatlich als „Nation“.
- source_word: τὸ ἱερὸν
  choice: dem Heiligtum
  rationale: ἱερόν bezeichnet den heiligen Tempelbereich. „Heiligtum“ bewahrt die sakrale Bedeutung, ohne den Ausdruck unnötig auf das Tempelgebäude zu verengen.
- source_word: τοῦ κυρίου
  choice: des Herrn
  rationale: Da die maßgebliche Quelle griechisch ist und κύριος bietet, wird entsprechend der Projektkonvention „Herr“ verwendet.
theological_decisions:
- issue: Wiedergabe von κύριος im griechischen deuterokanonischen Text
  choice: des Herrn
  alternative: des HERRN
  rationale: Die Primärquelle hat κύριος und nicht unmittelbar das hebräische Tetragramm. Daher wird die genuine griechische Form mit „Herr“ wiedergegeben.
- issue: Bedeutung von ἐδόξασαν bei nichtgöttlichen Objekten
  choice: erwiesen dem Volk und dem Heiligtum … Ehre
  alternative: verherrlichten das Volk und das Heiligtum
  rationale: Die gewählte Fassung vermeidet eine vorschnelle kultische Deutung, während die Fußnote die wörtlichere und theologisch spannungsreichere Wiedergabe offenhält.
- issue: Subjektwechsel im zweiten Satz
  choice: Diese erwiesen … Ehre
  alternative: und sie erwiesen … Ehre
  rationale: Das griechische Subjekt von ἐδόξασαν ist formal nicht eigens genannt und kann grammatisch auf die zuvor genannten Amtsträger oder auf das frühere „sie“ bezogen werden. Der unmittelbare Kontext legt die Amtsträger nahe; „Diese“ macht diese syntaktische Lesart transparent, ohne zusätzliche Akteure einzuführen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Verwaltungsterminologie bleibt historisch passend und allgemein verständlich. Der lange griechische Satz wird zur besseren Lesbarkeit in zwei Sätze gegliedert; „Diese“ nimmt die unmittelbar zuvor genannten königlichen Verwalter und Statthalter auf.
