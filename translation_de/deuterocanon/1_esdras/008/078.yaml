base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/078.yaml
  text: but he has shown us favor before the kings of Persia[a], to give us sustenance and to glorify our sanctuary and to raise up desolate Zion, to give us a stronghold in Judea and Jerusalem.
translation:
  language: de
  text: Doch er hat uns bei den Königen Persiens Gunst erwiesen, um uns Versorgung zu geben, unser Heiligtum zu verherrlichen, das verödete Zion wieder aufzurichten und uns in Judäa und Jerusalem festen Halt[a] zu geben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: eine feste Stätte; oder: Sicherheit.'
    reason: στερέωμα kann eine feste Grundlage, einen gesicherten Ort oder abstrakt Festigkeit und Sicherheit bezeichnen.
lexical_decisions:
- source_word: ἐποίησεν ἡμᾶς ἐν χάριτι ἐνώπιον
  choice: hat bewirkt, dass wir bei … Gunst fanden
  rationale: Die griechische Wendung bezeichnet, dass jemand in den Augen anderer in eine begünstigte Stellung versetzt wird. Die Formulierung ist im Deutschen natürlich und bewahrt zugleich Gottes Wirken als Ursache.
- source_word: τῶν βασιλέων Περσῶν
  choice: den Königen der Perser
  rationale: Die Genitivverbindung wird eng am griechischen Wortlaut wiedergegeben und bezeichnet die persischen Herrscher.
- source_word: δοῦναι ἡμῖν τροφήν
  choice: damit sie uns Lebensunterhalt gewährten
  rationale: τροφή kann Nahrung, Unterhalt oder Versorgung bezeichnen. „Lebensunterhalt“ passt zur königlichen Unterstützung, ohne den Ausdruck auf einzelne Lebensmittel zu verengen. Das Subjekt „sie“ bezieht sich sinngemäß auf die Könige.
- source_word: δοξάσαι τὸ ἱερὸν ἡμῶν
  choice: unser Heiligtum zu Ehren brachten
  rationale: δοξάζω bezeichnet hier, dem Heiligtum Ehre beziehungsweise Glanz zu verleihen. „Zu Ehren bringen“ ist würdig und vermeidet die im Deutschen leicht missverständliche Aussage, Menschen würden das Heiligtum im theologischen Sinn „verherrlichen“.
- source_word: ἐγεῖραι τὴν ἔρημον Σειών
  choice: das verwüstete Zion wieder aufrichteten
  rationale: ἐγείρω bedeutet aufrichten oder wiederherstellen, während ἔρημος den verwüsteten beziehungsweise verödeten Zustand bezeichnet. „Wieder aufrichten“ erhält das Bild und macht den Wiederherstellungszusammenhang deutlich.
- source_word: στερέωμα
  choice: festen Halt
  rationale: Das Wort bezeichnet Festigkeit, eine feste Grundlage oder gesicherte Stellung. „Festen Halt“ wahrt diese Breite besser als das konkretere „Festung“.
- source_word: ἐν τῇ Ἰουδαίᾳ καὶ Ἰερουσαλήμ
  choice: in Judäa und Jerusalem
  rationale: Ἰουδαία wird als historische Gebietsbezeichnung mit „Judäa“ wiedergegeben; Jerusalem bleibt als übliche deutsche Namensform unverändert.
theological_decisions:
- issue: Bezug der Infinitive δοῦναι, δοξάσαι und ἐγεῖραι
  choice: als Wirkung der von Gott gewährten Gunst, ausgeführt durch die persischen Könige
  alternative: Gott selbst als unmittelbares Subjekt aller Handlungen
  rationale: Grammatisch bleibt das handelnde Subjekt der Infinitive unausgesprochen. Der Zusammenhang mit der Gunst bei den persischen Königen legt deren konkrete Mitwirkung nahe, während Gott als eigentliche Ursache der Begünstigung gewahrt bleibt. Die Übersetzung macht diese Lesart transparent, ohne Gottes Wirken auszublenden.
- issue: Bedeutungsbreite von στερέωμα im Wiederherstellungszusammenhang
  choice: festen Halt
  alternative: eine Festung; Sicherheit; eine feste Stätte
  rationale: Der Ausdruck kann sowohl konkrete Befestigung als auch eine gesicherte, beständige Stellung meinen. Da der griechische Text die konkrete Bedeutung nicht eindeutig festlegt, steht im Haupttext eine offene Formulierung; Alternativen werden in der Fußnote bewahrt.
- issue: Wiedergabe von Σειών
  choice: Zion
  alternative: Sion
  rationale: „Zion“ ist die etablierte deutsche biblische Namensform und enthält keine zusätzliche konfessionelle Deutung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur folgt dem griechischen Gedankengang, wird aber durch finite Nebensätze verständlich gemacht. „Doch“ gibt den adversativen Anschluss von ἀλλά wieder. Der Fußnotenmarker steht unmittelbar bei dem mehrdeutigen Ausdruck „festen Halt“.
