  naturalness: »Stellte ich ihnen ... bereit« ist modernes, verständliches Standarddeutsch und erhält die offene bzw. übergabenahe Bedeutung des Griechischen. Die einleitende elliptische Wortgruppe wird mit »waren« minimal zu einem vollständigen deutschen Satz ergänzt.
  terminology: »heilige Geräte«, »Haus unseres Herrn«, »Ratgeber« und »Vornehmen« sind treffend und registergerecht. »Aus dem Kreis ihrer Brüder« wahrt die offene Gruppenbezeichnung des Griechischen, ohne eine spezifische Amts- oder Verwandtschaftsbeziehung festzulegen.
