base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/056.yaml
  text: And with them[a], from among their brothers, ten men. And I weighed out to them the silver and the gold and the holy vessels of the house of our Lord[b], which the king and his counselors and the nobles and all Israel had given as a gift.
translation:
  language: de
  text: Und mit ihnen waren zehn Männer aus dem Kreis ihrer Brüder. Ihnen stellte ich das Silber, das Gold und die heiligen Geräte des Hauses unseres Herrn bereit[a]; dies hatten der König, seine Ratgeber, die Vornehmen und ganz Israel geschenkt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Text lautet wörtlich: »Ihnen stellte/setzte ich das Silber, das Gold und die heiligen Geräte hin.« Der hebräische Paralleltext hat: »Ich wog ihnen ... ab«, was zum Zusammenhang der anvertrauten Kostbarkeiten passt.'
    reason: textual_variant
lexical_decisions:
- source_word: μετʼ αὐτῶν ἐκ τῶν ἀδελφῶν αὐτῶν ἄνδρας δέκα
  choice: Und mit ihnen zehn Männer aus dem Kreis ihrer Brüder
  rationale: Die etwas abrupte griechische Fügung bleibt erkennbar, wird aber in natürliches Deutsch gebracht. »Aus dem Kreis ihrer Brüder« wahrt ἐκ τῶν ἀδελφῶν αὐτῶν, ohne vorschnell eine engere Verwandtschaft oder ausschließlich levitische Amtsbrüder festzulegen.
- source_word: ἔστησα αὐτοῖς
  choice: Ihnen wog ich … ab
  rationale: Der überlieferte griechische Wortlaut bedeutet wörtlich eher »ich stellte/setzte ihnen hin«; der semitische Paralleltext und der Zusammenhang mit Edelmetallen und Tempelgeräten sprechen jedoch für ein Abwiegen und Übergeben. Die Spannung wird in einer Fußnote offengelegt.
- source_word: τὸ ἀργύριον καὶ τὸ χρυσίον
  choice: das Silber und das Gold
  rationale: Die konkreten Stoffbezeichnungen passen zu den abgewogenen Kostbarkeiten besser als eine monetäre Wiedergabe von ἀργύριον.
- source_word: τὰ ἱερὰ σκεύη
  choice: die heiligen Geräte
  rationale: »Geräte« ist im Deutschen für Tempelutensilien natürlicher und weiter als »Gefäße«; »heilig« bewahrt den kultischen Gehalt von ἱερά.
- source_word: τοῦ οἴκου τοῦ κυρίου ἡμῶν
  choice: des Hauses unseres Herrn
  rationale: Die Übersetzung folgt dem ausdrücklichen griechischen κυρίου ἡμῶν und bewahrt zugleich die traditionelle Tempelbezeichnung »Haus«.
- source_word: οὕτως ἐδωρήσατο
  choice: dies hatten … geschenkt
  rationale: οὕτως verweist hier am natürlichsten auf die genannten Kostbarkeiten; das Plusquamperfekt verdeutlicht, dass die Schenkung der nun beschriebenen Übergabe vorausging.
- source_word: οἱ σύμβουλοι αὐτοῦ καὶ οἱ μεγιστᾶνες
  choice: seine Ratgeber, die Vornehmen
  rationale: »Ratgeber« bezeichnet die königlichen Berater klar; »die Vornehmen« gibt den hohen gesellschaftlichen Rang der μεγιστᾶνες in verständlichem, würdigem Deutsch wieder.
theological_decisions:
- issue: Wiedergabe von κύριος in der Tempelbezeichnung
  choice: unseres Herrn
  alternative: des HERRN; unseres Gebieters
  rationale: Der griechische Text hat κυρίου ἡμῶν. Da hier nicht unmittelbar das hebräische Tetragramm vorliegt, wird weder »HERR« typografisch markiert noch »Gott« ergänzt.
- issue: Abweichung zwischen ἔστησα und dem semitischen Paralleltext
  choice: wog … ab
  alternative: stellte ihnen hin; übergab ihnen
  rationale: Die Primärlesart des Griechischen wird nicht verschwiegen, doch der Zusammenhang und das hebräische וָאֶשְׁקֲלָה stützen als gemeinten Vorgang das Abwiegen. Eine Fußnote bewahrt die Textspannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung hält den Anschlusscharakter des ersten griechischen Satzteils fest. Kultische Begriffe bleiben konkret, ohne konfessionelle Zusätze. Der Fußnotenmarker [a] steht unmittelbar bei der von der griechischen Oberflächenlesart abweichenden Wiedergabe.
