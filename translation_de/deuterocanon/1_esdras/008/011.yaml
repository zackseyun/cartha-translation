  verdict: revise
  source_fidelity: Die Grundübersetzung gibt ὅσοι οὖν, ἐνθυμοῦνται und συνεξορμάσθωσαν treffend wieder. Bei δέδοκται ist jedoch die deutsche Konstruktion „wie es mir und meinen sieben Freunden … beschlossen worden ist“ grammatisch nicht tragfähig und verdeckt die handelnden Entscheidungsträger. Das im Entwurf ergänzte „meinen“ hat im Griechischen keine ausdrückliche Entsprechung; der Artikel bezeichnet vielmehr „die sieben Freunde“.
  naturalness: „Darum sollen alle, die es beabsichtigen, gemeinsam aufbrechen“ ist modernes, verständliches Deutsch mit angemessen amtlichem Ton. Die beschlussbezogene Präpositionalfügung „von mir und den sieben Freunden“ ist erforderlich, damit der Schlussteil natürlich und eindeutig formuliert ist.
  terminology: „Freunde“ und „Ratgeber“ bewahren die doppelte Funktion von φίλοι und συμβουλευταίς. Die Fußnote erläutert sachgerecht, dass „Freunde“ eine höfische Rangbezeichnung sein kann, ohne diese Deutung zwingend zu machen.
