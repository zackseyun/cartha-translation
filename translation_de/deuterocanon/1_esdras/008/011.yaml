    rationale: Das Griechische lautet τοῖς ἑπτὰ φίλοις συμβουλευταῖς, „den sieben Freunden/Ratgebern“. Ein Besitzverhältnis kann im Kontext naheliegen, ist aber nicht markiert und sollte nicht ergänzt werden.
