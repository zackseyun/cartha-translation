base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/011.yaml
  text: Therefore[a], let all who are so minded set out together, just as it has been decided by me and my seven friends who are counselors[b];
translation:
  language: de
  text: Darum sollen alle, die es beabsichtigen[a], gemeinsam aufbrechen, wie es von mir und den sieben Freunden, den Ratgebern[b], beschlossen worden ist;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die es im Sinn haben“. Das griechische Verb kann ein Vorhaben oder eine Absicht bezeichnen.'
