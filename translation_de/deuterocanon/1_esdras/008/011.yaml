    rationale: 'δέδοκται ist hier ein unpersönliches administratives Perfekt. Im Deutschen benötigt die passive Formulierung für die Entscheidenden eine von-Phrase (oder eine aktive Umformung), nicht bloß den Dativ: „wie es von mir und den sieben Freunden … beschlossen worden ist“.'
  - severity: low
