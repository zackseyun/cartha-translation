  - marker: b
    text: „Freunde“ kann hier eine offizielle Rangbezeichnung am Königshof sein und muss nicht nur persönliche Vertraute meinen.
    reason: cultural_note
lexical_decisions:
- source_word: ὅσοι οὖν
  choice: Darum sollen alle, die
  rationale: ὅσοι bezeichnet die gesamte betreffende Personengruppe; οὖν führt folgernd bzw. fortführend aus dem vorausgehenden Erlass weiter. Die deutsche Fassung bewahrt beides in natürlicher Satzstellung.
- source_word: ἐνθυμοῦνται
  choice: es beabsichtigen
  rationale: Das Verb bezeichnet hier ein Erwägen oder Vorhaben. „Es beabsichtigen“ erhält den Bezug auf die geplante Reise, ohne bloße Bereitschaft zu unterstellen.
- source_word: συνεξορμάσθωσαν
  choice: sollen … gemeinsam aufbrechen
  rationale: Der Imperativ bezeichnet das Aufbrechen zusammen mit anderen; „gemeinsam aufbrechen“ gibt sowohl die Bewegung als auch die durch συν- ausgedrückte Gemeinsamkeit wieder.
- source_word: καθάπερ δέδοκται
  choice: wie … beschlossen worden ist
  rationale: In diesem administrativen Zusammenhang drückt das unpersönliche Perfekt einen gefassten Beschluss aus. Die Passivform wahrt zugleich die griechische Konstruktion.
- source_word: ἐμοί τε καὶ τοῖς ἑπτὰ φίλοις συμβουλευταῖς
  choice: mir und meinen sieben Freunden, den Ratgebern
  rationale: Die Dative bezeichnen diejenigen, denen der Beschluss gut bzw. beschlossen erschien. „Freunde“ bleibt als mögliche höfische Rangbezeichnung sichtbar; die Apposition „den Ratgebern“ gibt συμβουλευταῖς wieder, ohne es in einen Relativsatz umzudeuten.
