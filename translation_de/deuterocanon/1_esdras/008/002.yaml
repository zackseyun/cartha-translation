base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/002.yaml
  text: son of Saddoulouk[a], son of Acheitob, son of Amartheios, son of Ozeias, son of Bokka, son of Abeisai, son of Phinees, son of Eleazar[c][b], son of Aaron the chief priest.
translation:
  language: de
  text: Sohn Sadduluks[a], Sohn Acheitobs, Sohn Amartheios’, Sohn Oseias’, Sohn Bokkas, Sohn Abeisais, Sohn Phinees’[b], Sohn Eleasars, Sohn Aarons, des ersten Priesters.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Text bietet hier einen ausführlicheren Stammbaum als der kurze hebräische Paralleltext; dieser lautet: „Sohn Schallums, Sohn Zadoks, Sohn Ahitubs.“'
    reason: alternative_reading
  - marker: b
    text: 'Mehrere Namen werden hier nach ihrer griechischen Form wiedergegeben. Geläufigere, vom Hebräischen geprägte Formen sind: Acheitob = Ahitub, Oseias = Usi, Bokka = Bukki, Abeisai = Abischua und Phinees = Pinhas.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder möglicherweise: „des obersten Priesters“. Das griechische Wort bedeutet wörtlich „erster“; es steht jedoch „Priester“, nicht ausdrücklich „Hohepriester“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦ
  choice: Sohn … / Sohn des …
  rationale: Die wiederholten Genitive bezeichnen in dieser Abstammungsreihe elliptisch das Sohnesverhältnis. Das parallele Hebräisch verwendet ausdrücklich בֶּן־ („Sohn von“). Die deutsche Wiedergabe macht die Beziehung verständlich, ohne die griechische Konstruktion umzudeuten.
- source_word: Σαδδουλούκου
  choice: Sadduluk
  rationale: Der im griechischen Hauptzeugen überlieferte Name wird deutsch transliteriert und nicht an das abweichende „Schallum“ des kürzeren hebräischen Paralleltextes angeglichen.
- source_word: Ἀχειτὼβ
  choice: Acheitob
  rationale: Nahe Transliteration der griechischen Namensform; die geläufigere hebräische Form Ahitub wird in der Fußnote genannt.
- source_word: Ἀμαρθείου
  choice: Amartheios
  rationale: Die zusätzliche Person des griechischen Stammbaums bleibt erhalten; der Name wird nicht mit einer anderen Überlieferung harmonisiert.
- source_word: Ὀζείου
  choice: Oseias
  rationale: Deutsche Transliteration der griechischen Form; die hebräisch geprägte Form Usi wird nur als Namensentsprechung in der Fußnote geboten.
- source_word: Βοκκὰ
  choice: Bokka
  rationale: Transliteration der griechischen Namensform; Bukki ist die geläufigere hebräische Entsprechung.
- source_word: Ἀβεισαὶ
  choice: Abeisai
  rationale: Der griechische Name wird im Haupttext bewahrt; Abischua wird als hebräische Entsprechung vermerkt.
- source_word: Φεινεὲς
  choice: Phinees
  rationale: Die griechische Namensform wird transliteriert; die im Deutschen geläufige hebräische Form Pinhas erscheint in der Fußnote.
- source_word: Ἐλεαζὰρ
  choice: Eleasar
  rationale: Verwendet die im Deutschen geläufige Form des Namens, die der griechischen Form eng entspricht.
- source_word: Ἀαρὼν
  choice: Aaron
  rationale: Verwendet die etablierte deutsche Form des bekannten Namens.
- source_word: τοῦ πρώτου ἱερέως
  choice: des ersten Priesters
  rationale: πρῶτος bedeutet „erster“, ἱερεύς „Priester“. Die wörtlich klare Wiedergabe vermeidet den nicht ausdrücklich dastehenden Titel „Hohepriester“ und lässt offen, ob „erster“ zeitlich oder rangbezogen verstanden wird.
theological_decisions:
- issue: Soll der ausführlichere griechische Stammbaum an den kürzeren hebräischen Paralleltext angeglichen werden?
  choice: Der ausführlichere griechische Stammbaum bleibt im Haupttext erhalten.
  alternative: Angleichung an „Sohn Schallums, Sohn Zadoks, Sohn Ahitubs“
  rationale: Für 1 Esdras ist der griechische Text der primäre Zeuge. Seine Namenfolge darf nicht stillschweigend durch die kürzere hebräische Parallele ersetzt werden; die Abweichung wird transparent in einer Fußnote dokumentiert.
- issue: Bedeutung von τοῦ πρώτου ἱερέως bei Aaron
  choice: des ersten Priesters
  alternative: des obersten Priesters / des ersten Hohepriesters
  rationale: Der griechische Text hat ἱερεύς („Priester“), nicht ἀρχιερεύς („Hohepriester“). „Erster“ bewahrt zudem die mögliche zeitliche wie auch rangbezogene Nuance von πρῶτος, ohne sie dogmatisch festzulegen.
translation_notes:
  register: Moderne, würdige Standardsprache. Die genealogische Wiederholung wird bewusst beibehalten. Bei Namen folgt der Haupttext grundsätzlich dem griechischen Zeugen, verwendet jedoch bei Eleasar und Aaron die fest etablierten deutschen Formen. Die Genitivformen werden nach natürlichem deutschem Namensgebrauch gebildet.
