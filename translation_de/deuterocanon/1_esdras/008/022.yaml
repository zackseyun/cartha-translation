  terminology: „Priester“, „Leviten“, „Tempelsänger“, „Torwächter“ und „Tempeldiener“ sind treffend. „Steuer“ und „andere Belastung“ geben φορολογία und die in diesem Kontext wahrscheinlich als zusätzliche Auflage verstandene ἐπιβουλή angemessen wieder. Für πραγματικοῖς ist eine offene Umschreibung ohne die zusätzliche Amts- oder Auftragskonnotation von „Beauftragte“ vorzuziehen.
