  source_fidelity: 'Der Entwurf gibt die Abfolge und den administrativ-rechtlichen Sinn des griechischen Textes insgesamt zuverlässig wieder: amtliche Mitteilung, vollständige Aufzählung des Tempelpersonals, Befreiung von Steuer und einer weiteren Belastung sowie das Fehlen einer Befugnis zur Auferlegung. Der ungefähre MT-Paralleltext ist für diesen griechischen Wortlaut nicht maßgeblich. „Beauftragten“ fügt bei πραγματικοῖς jedoch unnötig den Gedanken einer ausdrücklichen Beauftragung hinzu; das griechische Wort bezeichnet allgemeiner Personen, die mit den Angelegenheiten des Tempels befasst sind.'
