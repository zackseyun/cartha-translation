  register: Moderner, würdiger Verwaltungston. Der Doppelpunkt verdeutlicht den Erlasscharakter. Die Gruppenbezeichnungen bleiben allgemein verständlich; „hiermit“ markiert die amtliche Bekanntgabe. Der ungefähre aramäische MT-Parallelvers entspricht inhaltlich nicht diesem griechischen Satz und wurde daher nicht als Übersetzungsgrundlage verwendet.
