base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/022.yaml
  text: And it is also declared to you that no tax or other burden is to be imposed on any of the priests[a], Levites, temple singers, gatekeepers, temple servants, or workers of this temple[b], and that no one is to have authority to impose it on them.
translation:
  language: de
  text: 'Auch euch wird hiermit mitgeteilt: Keinem der Priester, Leviten, Tempelsänger, Torwächter, Tempeldiener und derjenigen, die mit den Angelegenheiten dieses Tempels befasst sind[b], darf eine Steuer oder eine andere Belastung[a] auferlegt werden; niemand ist befugt, ihnen etwas Derartiges aufzuerlegen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eine andere Abgabe“ beziehungsweise „eine andere Auflage“. Das griechische Wort kann auch einen feindseligen Anschlag bezeichnen; in diesem fiskalischen Zusammenhang liegt jedoch eine zusätzlich auferlegte Belastung nahe.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „den mit den Angelegenheiten dieses Tempels Befassten“. Gemeint sind Personen, die sich um seine Geschäfte oder Verwaltungsangelegenheiten kümmern; auch „Bedienstete“ oder „Amtsträger“ ist möglich.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγεται
  choice: wird hiermit mitgeteilt
  rationale: Das Passiv steht im Zusammenhang eines amtlichen Erlasses. „Hiermit mitgeteilt“ gibt den offiziellen Ton wieder, ohne die stärkere Bedeutung „befohlen“ einzutragen.
- source_word: πᾶσι τοῖς ἱερεῦσιν
  choice: allen Priestern
  rationale: Die Formulierung bewahrt den umfassenden Geltungsbereich des griechischen πᾶσι in natürlichem Deutsch.
- source_word: Λευείταις
  choice: Leviten
  rationale: Übliche deutsche Bezeichnung dieser Gruppe des Tempelpersonals.
- source_word: ἱεροψάλταις
  choice: Tempelsängern
  rationale: Das Kompositum bezeichnet Sänger in kultischer beziehungsweise tempelbezogener Funktion.
- source_word: θυρωροῖς
  choice: Torwächtern
  rationale: Natürliche und sachgerechte Bezeichnung für das Personal an den Tempelzugängen.
- source_word: ἱεροδούλοις
  choice: Tempeldienern
  rationale: Die Wiedergabe bezeichnet den Dienst am Heiligtum, ohne den möglichen Status als Unfreie stärker festzulegen, als es der Zusammenhang verlangt.
- source_word: πραγματικοῖς τοῦ ἱεροῦ τούτου
  choice: den mit den Angelegenheiten dieses Tempels Beauftragten
  rationale: πραγματικοί bezeichnet hier Personen, die mit den Geschäften oder Angelegenheiten des Tempels befasst sind. „Beauftragte“ bleibt weiter als „Beamte“ und ist präziser als das sehr allgemeine „Arbeiter“.
- source_word: μηδεμία φορολογία
  choice: weder eine Steuer
  rationale: φορολογία bezeichnet eine Steuer- oder Abgabenpflicht; „Steuer“ ist im Deutschen klar und idiomatisch.
- source_word: μηδὲ ἄλλη ἐπιβουλή
  choice: noch eine andere Belastung
  rationale: Im fiskalisch-administrativen Zusammenhang bezeichnet ἐπιβουλή wahrscheinlich eine weitere auferlegte Last. „Belastung“ erhält die Breite des Ausdrucks und verengt ihn nicht auf eine zusätzliche Steuer.
- source_word: γίγνηται
  choice: darf ... auferlegt werden
  rationale: Der Kontext und das folgende ἐπιβαλεῖν zeigen, dass es um das rechtliche Auferlegen von Lasten geht.
- source_word: μηδένα ἔχειν ἐξουσίαν ἐπιβαλεῖν τούτοις
  choice: niemand ist befugt, ihnen so etwas aufzuerlegen
  rationale: Die Formulierung gibt das Fehlen rechtlicher Vollmacht wieder und bezieht sich gleichermaßen auf Steuer und sonstige Belastung.
