revisions:
- from: 'Auch euch wird hiermit mitgeteilt: Allen Priestern, Leviten, Tempelsängern, Torwächtern, Tempeldienern und den mit den Angelegenheiten dieses Tempels Beauftragten[b] darf weder eine Steuer noch eine andere Belastung[a] auferlegt werden; niemand ist befugt, ihnen so etwas aufzuerlegen.'
  to: 'Auch euch wird hiermit mitgeteilt: Keinem der Priester, Leviten, Tempelsänger, Torwächter, Tempeldiener und derjenigen, die mit den Angelegenheiten dieses Tempels befasst sind[b], darf eine Steuer oder eine andere Belastung[a] auferlegt werden; niemand ist befugt, ihnen etwas Derartiges aufzuerlegen.'
  rationale: Die Revision entfernt die nicht ausdrücklich im Griechischen enthaltene Konnotation einer formellen Beauftragung, verdeutlicht die auf jede genannte Person bezogene Befreiung und glättet die Registerdifferenz im Schlusssatz. Bedeutung, Ambiguität von ἐπιβουλή und alle Fußnotenanker bleiben erhalten.
