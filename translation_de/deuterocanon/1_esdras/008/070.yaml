base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/070.yaml
  text: And rising from the fasting[a], with his garments and the holy robe torn, he bent his knees and stretched out his hands to the Lord, saying[b],
translation:
  language: de
  text: Und als er sich vom Fasten erhob, mit zerrissenen Gewändern und zerrissenem heiligem Gewand, beugte er die Knie, streckte seine Hände zum Herrn aus und sprach:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der griechische Text hat hier eine auffällige Form, die wörtlich „ich sagte“ oder „sie sagten“ bedeuten kann. Der Zusammenhang weist jedoch darauf, dass Esra sein Gebet beginnt; daher steht im Text „sprach“.
    reason: textual_variant
lexical_decisions:
- source_word: ἐξεγερθεὶς ἐκ τῆς νηστείας
  choice: nachdem er sich vom Fasten erhoben hatte
  rationale: Gibt den Übergang vom Fasten zum Gebet natürlich wieder und bewahrt die partizipiale Abfolge des Griechischen.
- source_word: διερρηγμένα ἔχων τὰ ἱμάτια
  choice: die Gewänder … zerrissen
  rationale: Bewahrt den resultativen Sinn der Konstruktion; „Gewänder“ passt zum würdevollen Kontext und bleibt allgemein.
- source_word: τὴν ἱερὰν ἐσθῆτα
  choice: das heilige Gewand
  rationale: Gibt die ausdrückliche sakrale Kennzeichnung wieder, ohne das Gewand über den griechischen Wortlaut hinaus als priesterlich festzulegen.
- source_word: κάμψας τὰ γόνατα
  choice: beugte er die Knie
  rationale: Nahe am griechischen Ausdruck und im Deutschen als Gebetshaltung verständlich.
- source_word: ἐκτείνας τὰς χεῖρας
  choice: streckte die Hände … aus
  rationale: Eine natürliche und anschauliche Wiedergabe der Gebetshaltung.
- source_word: πρὸς τὸν κύριον
  choice: zum Herrn
  rationale: Bewahrt κύριος als ehrfürchtigen Gottesnamen und gibt die Ausrichtung der Geste idiomatisch wieder.
- source_word: ἔλεγον
  choice: sprach
  rationale: Der Kontext verlangt die Einleitung von Esras folgendem Gebet; die auffällige Form des überlieferten griechischen Textes wird in einer Fußnote offengelegt.
theological_decisions:
- issue: Wiedergabe von κύριος
  choice: Herr
  alternative: Gebieter
  rationale: Im Gebetskontext ist „Herr“ die natürliche ehrfürchtige Gottesbezeichnung.
- issue: Bestimmung des heiligen Gewandes
  choice: das heilige Gewand
  alternative: das priesterliche Gewand
  rationale: Der griechische Text bezeichnet das Gewand als heilig, nennt es aber nicht ausdrücklich priesterlich; die Übersetzung vermeidet diese zusätzliche Festlegung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzfolge hält sich eng an die griechischen Partizipien, ohne im Deutschen schwerfällig zu werden. „Heiliges Gewand“ wahrt die Abgrenzung zu den allgemeinen „Gewändern“ und vermeidet eine nicht ausdrücklich genannte priesterliche Spezifizierung.
