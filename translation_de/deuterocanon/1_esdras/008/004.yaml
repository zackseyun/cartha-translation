translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht biblischem Ton. Die Satzstruktur bleibt nahe am Griechischen, während »erwies ihm Ehre« und »in allen seinen Anliegen« idiomatisches Deutsch bieten. Die sachlich bedeutsame Mehrdeutigkeit von ἀξιώματα wird in der Fußnote bewahrt.
