  text: And the king gave him honor, because he had found favor before him in regard to all his offices.
translation:
  language: de
  text: Und der König erwies ihm Ehre[a], weil er vor ihm in allen seinen Anliegen Gunst gefunden hatte.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Auszeichnung« beziehungsweise »Herrlichkeit«. Das griechische Wort bezeichnet hier wahrscheinlich die öffentliche Anerkennung durch den König.'
    reason: lexical_alternative
  - marker: b
    text: Die griechische Wendung ist knapp und mehrdeutig. Statt »in allen seinen Anliegen« kann sie auch auf seine Ansprüche, Würden oder Ämter bezogen werden.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔδωκεν αὐτῷ ... δόξαν
  choice: erwies ihm Ehre
  rationale: Wörtlich steht »gab ihm Ehre/Herrlichkeit«. Im höfischen Zusammenhang bezeichnet δόξα öffentliche Anerkennung oder Auszeichnung; »erwies ihm Ehre« ist im Deutschen natürlich und vermeidet eine unnötig theologische Färbung.
- source_word: εὑρόντος χάριν
  choice: weil er ... Gunst gefunden hatte
  rationale: Der Genitivus absolutus wird als Begründung verstanden. »Gunst finden« bewahrt die biblische Wendung und bezeichnet hier das Wohlwollen des Königs.
- source_word: ἐναντίον αὐτοῦ
  choice: vor ihm
  rationale: Die räumliche Grundbedeutung und der höfisch-biblische Sprachgebrauch bleiben erhalten; gemeint ist die Gunst in den Augen des Königs.
- source_word: ἐπὶ πάντα τὰ ἀξιώματα αὐτοῦ
  choice: in allen seinen Anliegen
  rationale: ἀξίωμα kann neben Rang oder Amt auch Anspruch, Forderung oder Ersuchen bezeichnen. In Verbindung mit königlicher Gunst passt hier »Anliegen« gut, ohne die mehrdeutige Wendung unnötig eng auf formelle Bitten festzulegen.
