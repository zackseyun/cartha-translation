base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/023.yaml
  text: And you[a], Ezra, according to the wisdom of your God, appoint judges and magistrates, so that they may judge throughout all Syria and Phoenicia all those who know the law of your God; and you shall teach those who do not know it.
translation:
  language: de
  text: Und du, Esra, setze gemäß der Weisheit deines Gottes Richter und Gerichtsbeamte ein, damit sie in ganz Syrien und Phönizien[a] über alle richten, die das Gesetz deines Gottes kennen; und diejenigen, die es nicht kennen, sollst du lehren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die griechische Fassung nennt ausdrücklich „Syrien und Phönizien“; die entsprechende Verwaltungssprache im hebräisch-aramäischen Esrabuch ist anders gefasst.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνάδειξον
  choice: setze … ein
  rationale: Der Imperativ bezeichnet die förmliche Bestellung von Amtsträgern; „einsetzen“ ist im modernen Deutschen natürlich und präzise.
- source_word: κριτὰς καὶ δικαστάς
  choice: Richter und Gerichtsbeamte
  rationale: Die zwei griechischen Amtsbezeichnungen bleiben unterschieden. „Gerichtsbeamte“ gibt für δικαστάς die rechtlich-administrative Funktion wieder, ohne beide Begriffe einfach mit „Richter“ gleichzusetzen.
- source_word: ὅπως δικάζωσιν
  choice: damit sie … richten
  rationale: Die Zweckbeziehung wird ausdrücklich wiedergegeben; „richten“ bewahrt zudem die Wortverbindung zu κριτάς.
- source_word: ἐν ὅλῃ Συρίᾳ καὶ Φοινίκῃ
  choice: in ganz Syrien und Phönizien
  rationale: Die territoriale Reichweite und die ausdrücklichen geografischen Namen der griechischen Vorlage werden beibehalten.
- source_word: πάντας τοὺς ἐπισταμένους
  choice: über alle …, die … kennen
  rationale: ἐπίσταμαι bezeichnet hier Kenntnis beziehungsweise Vertrautheit mit dem Gesetz; „kennen“ ist klar und idiomatisch.
- source_word: τὸν νόμον τοῦ θεοῦ σου
  choice: das Gesetz deines Gottes
  rationale: Die Genitivverbindung einschließlich σου wird vollständig und direkt wiedergegeben.
- source_word: καὶ τοὺς μὴ ἐπισταμένους διδάξεις
  choice: und diejenigen, die es nicht kennen, sollst du lehren
  rationale: Das im zweiten Teilsatz ausgelassene Objekt wird durch „es“ aufgenommen. „Sollst du“ gibt den anweisenden Sinn des Futurs im Erlassstil natürlich wieder.
theological_decisions:
- issue: Griechische Gebietsbezeichnung oder Angleichung an die Verwaltungssprache der hebräisch-aramäischen Esraüberlieferung
  choice: „Syrien und Phönizien“ im Haupttext beibehalten
  alternative: Eine harmonisierte Gebietsbezeichnung nach dem masoretischen Esrabuch
  rationale: Für 1 Esdras ist die griechische Vorlage maßgeblich. Da sie ausdrücklich Συρίᾳ καὶ Φοινίκῃ liest, darf ihre geografische Rahmung nicht stillschweigend harmonisiert werden.
translation_notes:
  register: Moderner, würdiger Erlassstil. Die Satzstruktur bleibt nahe am Griechischen, wird aber durch „setze … ein“, „damit“ und „sollst du“ idiomatisch deutsch gestaltet. Die beiden Justizämter werden lexikalisch unterschieden.
