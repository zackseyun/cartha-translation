base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/049.yaml
  text: 'And from the temple servants whom David and the leaders had assigned to the service of the Levites: temple servants[a], two hundred twenty[b]; all of them were listed by name.'
translation:
  language: de
  text: 'Und von den Tempeldienern, die David und die führenden Männer für den Dienst der Leviten bestimmt hatten: 220 Tempeldiener[a]; sie alle waren namentlich verzeichnet.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Netinim«. So lautet der aus dem Hebräischen stammende Fachbegriff für diese Tempeldiener. Im griechischen Text steht »Tempeldiener« (ἱερόδουλοι), im hebräischen Paralleltext נְתִינִים.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »sie alle wurden namentlich registriert«. Die griechische Wendung weist auf eine förmliche Erfassung nach Namen hin.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἱεροδούλων / ἱερόδουλοι
  choice: Tempeldiener
  rationale: Das griechische Wort bezeichnet Menschen, die einem Heiligtum beziehungsweise dem Tempeldienst zugeordnet sind. »Tempeldiener« ist im heutigen Deutsch verständlich und gibt ihre Funktion wieder, ohne mit »Tempelsklaven« einen rechtlichen Status stärker zu betonen, als es der Zusammenhang verlangt.
- source_word: ἔδωκεν
  choice: bestimmt hatten
  rationale: Wörtlich bedeutet das Verb »gab«. Zusammen mit der Zweckangabe und dem hebräischen Paralleltext bezeichnet es hier die Zuweisung von Personen zu einer Aufgabe; »bestimmt hatten« gibt diesen administrativen Sinn natürlich wieder.
- source_word: οἱ ἡγούμενοι
  choice: die führenden Männer
  rationale: Der Ausdruck meint leitende Personen oder Amtsträger. »Die führenden Männer« ist würdig und hinreichend weit, ohne einen bestimmten politischen Rang vorauszusetzen.
- source_word: εἰς τὴν ἐργασίαν τῶν Λευειτῶν
  choice: für den Dienst der Leviten
  rationale: ἐργασία kann Arbeit, Tätigkeit oder Dienst bedeuten. Im kultisch-administrativen Zusammenhang ist »Dienst« die natürliche deutsche Wiedergabe.
- source_word: διακόσιοι εἴκοσι
  choice: '220'
  rationale: Direkte Wiedergabe der Zahl in geläufiger moderner Schreibweise.
- source_word: πάντων ἐσημάνθη ὀνοματογραφία
  choice: sie alle waren namentlich verzeichnet
  rationale: Die ungewöhnliche griechische Formulierung spricht von einer namentlichen schriftlichen Erfassung. »Namentlich verzeichnet« bewahrt den amtlichen Charakter und ist zugleich natürliches Deutsch.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Doppelpunkt bewahrt die aufzählende Struktur des griechischen Satzes. Die wiederholte Bezeichnung »Tempeldiener« wurde beibehalten, weil sie auch im griechischen Text wiederholt wird.
