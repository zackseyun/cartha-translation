base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/072.yaml
  text: For our sins have multiplied beyond our heads[a], and our offenses have risen up to heaven.
translation:
  language: de
  text: Denn unsere Sünden sind uns über den Kopf gewachsen, und unsere Verfehlungen aus Unwissenheit[a] haben bis zum Himmel gereicht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »unsere Irrtümer«, »unsere unwissentlich begangenen Verfehlungen« oder »unsere Unwissenheit«. Das griechische Wort unterscheidet sich von »Sünden« im ersten Satzteil.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἁμαρτίαι
  choice: Sünden
  rationale: Die übliche und direkte Wiedergabe für moralische Verfehlungen; sie wahrt zudem den Unterschied zum zweiten Substantiv.
- source_word: ἐπλεόνασαν
  choice: sind … gewachsen
  rationale: Das Verb bezeichnet eine mengenmäßige Zunahme. Zusammen mit »über den Kopf« ergibt sich im Deutschen ein natürliches, eindringliches Bild überwältigender Schuld.
- source_word: ὑπὲρ τὰς κεφαλὰς ἡμῶν
  choice: uns über den Kopf
  rationale: Die idiomatische deutsche Wendung bewahrt sowohl die Aufwärtsbewegung als auch das Bild einer überwältigenden Menge.
- source_word: ἄγνοιαι
  choice: unwissentlich begangene Verfehlungen
  rationale: Der Ausdruck gibt den möglichen Sinn von aus Unwissenheit begangenem Unrecht wieder und unterscheidet den Begriff von »Sünden«, ohne das unnatürliche »Unwissenheiten« zu verwenden.
- source_word: ὑπερήνεγκαν
  choice: reichen
  rationale: Im Zusammenhang bezeichnet das Verb eine Erstreckung nach oben; »reichen bis« ist dafür im Deutschen natürlich und bewahrt das räumliche Bild.
- source_word: ἕως τοῦ οὐρανοῦ
  choice: bis zum Himmel
  rationale: Eine natürliche, würdevolle Wiedergabe, die das vertikale und theologische Bild erhält.
theological_decisions:
- issue: Ob ἁμαρτίαι und ἄγνοιαι als dieselbe Kategorie von Schuld wiederzugeben sind
  choice: Die Begriffe werden als »Sünden« und »unwissentlich begangene Verfehlungen« unterschieden.
  alternative: Beide Begriffe allgemein mit »Sünden«, »Verfehlungen« oder »Schuld« wiedergeben.
  rationale: Der griechische Text verwendet zwei verschiedene Wörter. Die gewählte Fassung erhält die mögliche Spannung zwischen Sünde allgemein und aus Unwissenheit begangenem Unrecht, ohne zu behaupten, diese Unterscheidung sei eindeutig.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch in würdigem biblischem Ton. Die idiomatische Wendung »über den Kopf gewachsen« vermittelt das griechische Mengen- und Höhenbild natürlich; die Fußnote wahrt die Bedeutungsbreite von ἄγνοιαι.
