base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/084.yaml
  text: And everything that happens to us comes because of our evil deeds and our great sins[a].
translation:
  language: de
  text: Und alles, was uns widerfährt, geschieht wegen unserer bösen Taten und unserer großen Sünden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Und alles, was uns zustößt, kommt wegen unserer bösen Taten und unserer großen Sünden über uns.“'
    reason: Lexikalische Alternative für τὰ συμβαίνοντα πάντα und γίνεται; sie verdeutlicht das Betroffensein, klingt aber schwerer als der Haupttext.
lexical_decisions:
- source_word: τὰ συμβαίνοντα πάντα
  choice: alles, was uns widerfährt
  rationale: Die substantivierte Partizipialfügung bezeichnet umfassend alles, was geschieht bzw. jemanden trifft. „Widerfährt“ gibt zusammen mit ἡμῖν die Betroffenheit natürlich und würdig wieder.
- source_word: ἡμῖν
  choice: uns
  rationale: Der Dativ bezeichnet diejenigen, denen die Ereignisse widerfahren; im Deutschen wird er idiomatisch unmittelbar mit „widerfährt“ verbunden.
- source_word: γίνεται
  choice: geschieht
  rationale: Das weit gefasste γίνομαι bezeichnet hier das Eintreten bzw. Geschehen und verbindet dieses ausdrücklich mit seiner Ursache.
- source_word: διὰ
  choice: wegen
  rationale: διά mit Akkusativ bezeichnet eindeutig den Grund bzw. die Ursache. „Wegen“ bewahrt diesen ausdrücklichen Kausalzusammenhang.
- source_word: τὰ ἔργα ἡμῶν τὰ πονηρά
  choice: unsere bösen Taten
  rationale: ἔργα bezeichnet Werke oder Taten, πονηρά ihre moralische Bosheit. „Böse Taten“ ist klar, gegenwärtig und nicht unnötig altertümlich.
- source_word: τὰς μεγάλας ἁμαρτίας
  choice: unsere großen Sünden
  rationale: μεγάλας bedeutet wörtlich „groß“ und hebt Ausmaß oder Schwere der Sünden hervor, ohne es als „viele“ umzudeuten. Das possessive „unsere“ wird aus dem parallelen ἡμῶν und dem Zusammenhang im Deutschen natürlich ergänzt.
theological_decisions:
- issue: Ursächliche Zuordnung des erlittenen Geschehens
  choice: Der Satz führt alles, was der Gemeinschaft widerfährt, ausdrücklich auf ihre bösen Taten und großen Sünden zurück.
  alternative: Eine weichere Formulierung, die den ursächlichen Zusammenhang nur andeutet.
  rationale: διά mit Akkusativ bezeichnet ausdrücklich die Ursache. Die Übersetzung bewahrt das Schuldbekenntnis des Verses, ohne daraus eine allgemeine Lehre über jedes Leiden abzuleiten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wortstellung bleibt nah am griechischen Gedankengang, während „widerfährt“ die Verbindung von τὰ συμβαίνοντα und ἡμῖν idiomatisch bündelt. Der ausdrückliche Kausalzusammenhang und die volle Stärke von „böse“ und „groß“ bleiben erhalten.
