  source_fidelity: Der Haupttext gibt τὰ λοιπὰ, die kontingente Wendung ὅσα ἂν ὑποπίπτῃ σοι, den Bedarf für das ἱερόν und die königliche Schatzkammer grundsätzlich zutreffend wieder. „für den Tempel deines Gottes“ folgt angemessen dem griechischen Primärtext; der semitische Parallelzeuge wird lediglich als Variante kenntlich gemacht.
