base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/018.yaml
  text: And whatever else may come up as a need for the house of your God[a], you shall give from the royal treasury.
translation:
  language: de
  text: Und alles Weitere, was darüber hinaus für den Tempel deines Gottes[a] benötigt wird, sollst du aus der königlichen Schatzkammer geben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „für das Heiligtum deines Gottes“. Der griechische Text bezeichnet den Tempel oder den Tempelbezirk; der parallele semitische Text hat „das Haus deines Gottes“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ λοιπὰ
  choice: alles Weitere
  rationale: Die Wendung bezeichnet umfassend zusätzliche Dinge oder Ausgaben; „alles Weitere“ ist im Deutschen natürlich und bewahrt den Sammelcharakter.
- source_word: ὅσα ἂν ὑποπίπτῃ σοι
  choice: was sich … ergibt
  rationale: Die idiomatische Formulierung gibt das mögliche Auftreten weiterer Erfordernisse wieder und bewahrt mit „sich ergibt“ den durch ἄν angezeigten kontingenten Sinn.
- source_word: εἰς τὴν χρείαν
  choice: als Bedarf
  rationale: χρεία bezeichnet hier einen praktischen Bedarf oder eine Notwendigkeit im administrativen Zusammenhang.
- source_word: τοῦ ἱεροῦ τοῦ θεοῦ σου
  choice: für den Tempel deines Gottes
  rationale: ἱερόν bezeichnet im griechischen Primärtext unmittelbar den Tempel beziehungsweise Tempelbezirk. „Tempel“ ist daher die präziseste Haupttextwiedergabe; der semitische Parallelzeuge mit „Haus deines Gottes“ wird in der Fußnote berücksichtigt.
- source_word: δώσεις
  choice: sollst du … geben
  rationale: Das Futur hat im Kontext eines königlichen Erlasses anweisende Kraft; „sollst“ klingt im modernen Deutschen würdig und verbindlich.
- source_word: ἐκ τοῦ βασιλικοῦ γαζοφυλακίου
  choice: aus der königlichen Schatzkammer
  rationale: γαζοφυλάκιον ist die Schatzkammer; die Formulierung bewahrt den offiziellen Verwaltungskontext.
theological_decisions:
- issue: Wiedergabe von τοῦ ἱεροῦ τοῦ θεοῦ σου gegenüber dem semitischen Parallelzeugen בית אלהך
  choice: für den Tempel deines Gottes
  alternative: für das Haus deines Gottes; für das Heiligtum deines Gottes
  rationale: Da der griechische Text der primäre Übersetzungsanker ist, steht die direkte Bedeutung „Tempel“ im Haupttext. Die Lesart „Haus“ des parallelen semitischen Zeugen und die mögliche Nuance „Heiligtum/Tempelbezirk“ bleiben durch die Fußnote sichtbar, ohne die Zeugnisse stillschweigend anzugleichen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Verwaltungssprache. Die Satzstruktur folgt dem Griechischen, ohne im Deutschen steif zu wirken; die Abweichung zwischen griechischem Primärtext und semitischem Parallelzeugen wird offengelegt.
