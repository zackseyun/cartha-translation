base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/087.yaml
  text: Lord of Israel, you are true; for we have been left as a root to this day.
translation:
  language: de
  text: Herr Israels, du bist wahrhaftig; denn heute sind wir als Wurzel übrig geblieben.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κύριε τοῦ Ἰσραήλ
  choice: Herr Israels
  rationale: Gibt die griechische Anrede formal und würdevoll wieder, ohne ein im Text nicht ausdrücklich stehendes „Gott“ zu ergänzen.
- source_word: ἀληθινὸς
  choice: wahrhaftig
  rationale: Bezeichnet in der prädikativen Aussage Gottes Wahrhaftigkeit beziehungsweise Treue; „wahrhaftig“ ist im Deutschen als Personenprädikat natürlicher als „wahr“ und wahrt die Bedeutungsbreite.
- source_word: κατελείφθημεν
  choice: sind wir … übrig geblieben
  rationale: Das Passiv von καταλείπω bezeichnet, dass die Sprechenden zurück- beziehungsweise übrig geblieben sind; die deutsche Form vermeidet eine unnötige Festlegung darauf, wer sie bewahrt hat.
- source_word: ῥίζα
  choice: als Wurzel
  rationale: Bewahrt das konkrete griechische Bild „Wurzel“ und ersetzt es nicht deutend durch „Rest“.
- source_word: ἐν τῇ σήμερον
  choice: bis zum heutigen Tag
  rationale: Die substantivierte Zeitangabe meint idiomatisch die Gegenwart beziehungsweise „heute“; diese deutsche Wendung entspricht dem natürlichen Zeitsinn.
theological_decisions:
- issue: Bild von ῥίζα
  choice: Wurzel
  alternative: Rest / Überrest
  rationale: Obwohl der Kontext einen überlebenden Rest nahelegt, steht im griechischen Hauptzeugen ausdrücklich ῥίζα. Das Bild wird deshalb nicht durch seine mögliche Deutung ersetzt.
- issue: Bedeutung von ἀληθινός für Gott
  choice: wahrhaftig
  alternative: treu
  rationale: „Treu“ ist sachlich möglich, würde jedoch eine bestimmte Nuance hervorheben. „Wahrhaftig“ wahrt die Spannung zwischen Wahrheit, Echtheit und Verlässlichkeit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit enger Bindung an den griechischen Haupttext. Die ungewöhnliche Metapher „als Wurzel“ bleibt bewusst erhalten; keine Fußnote ist erforderlich.
