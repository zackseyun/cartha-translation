  terminology: Die Gottesanrede und das Bildfeld werden ohne konfessionelle Einengung wiedergegeben. „Wurzel“ ist gegenüber dem kontextuell möglichen „Rest/Überrest“ beizubehalten, da ῥίζα im griechischen Text steht. „Wahrhaftig“ gibt ἀληθινός ausreichend breit wieder.
