base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/014.yaml
  text: together with what was freely given by the nation for the temple of their Lord in Jerusalem[a], and the gold and silver to be gathered for bulls and rams and lambs and what goes with them[b],
translation:
  language: de
  text: zusammen mit dem, was vom Volk für den Tempel ihres Herrn in Jerusalem gespendet worden ist,[a] sowie mit dem Gold und Silber, das für Stiere, Widder und Lämmer und das, was dazugehört,[b] gesammelt werden soll,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der aramäische Paralleltext in Esra 7,16 weicht hier deutlich ab. Er spricht von Silber und Gold, das der König und seine Ratgeber dem Gott Israels freiwillig gegeben haben, dessen Wohnung in Jerusalem ist. Der griechische Wortlaut von 1 Esdras ist anders und wird hier so übersetzt, wie er überliefert ist.
    reason: textual_variant
  - marker: b
    text: 'Oder: „die dazugehörigen Dinge“; wahrscheinlich sind die weiteren für die Opfer benötigten Gaben gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σὺν τῷ δεδωρημένῳ
  choice: zusammen mit dem, was … gespendet worden ist
  rationale: Die Formulierung bewahrt den additiven Sinn von σύν und den Geschenkcharakter des Perfektpartizips, ohne über den griechischen Text hinauszugehen.
- source_word: ὑπὸ τοῦ ἔθνους
  choice: vom Volk
  rationale: ἔθνος bezeichnet hier das Volk als Kollektiv. „Volk“ ist im Deutschen natürlicher als „Nation“ und vermeidet moderne staatspolitische Nebenbedeutungen.
- source_word: εἰς τὸ ἱερὸν τοῦ κυρίου αὐτῶν τὸ ἐν Ἰερουσαλήμ
  choice: für den Tempel ihres Herrn in Jerusalem
  rationale: „Für“ entspricht im Spendenkontext der Zielrichtung von εἰς; ἱερόν wird als „Tempel“ wiedergegeben. Das Possessivpronomen bleibt erhalten, ohne „Gott“ aus dem Paralleltext einzufügen.
- source_word: συναχθῆναι
  choice: gesammelt werden soll
  rationale: Der Infinitiv bezeichnet das Einsammeln von Gold und Silber. Die deutsche Modalkonstruktion fügt sich natürlich in den größeren Satz ein.
- source_word: τό τε χρυσίον καὶ ἀργύριον
  choice: sowie dem Gold und Silber
  rationale: „Sowie“ gibt die verknüpfende Kraft von τε … καί im fortlaufenden Satz idiomatisch wieder.
- source_word: εἰς ταύρους καὶ κριοὺς καὶ ἄρνας
  choice: für Stiere, Widder und Lämmer
  rationale: Die konkreten Opfertiere werden präzise und in geläufiger kultischer Terminologie benannt.
- source_word: τὰ τούτοις ἀκόλουθα
  choice: das, was dazugehört
  rationale: Die allgemeine griechische Wendung bleibt bewusst offen und wird nicht auf bestimmte begleitende Opfergaben eingeengt.
theological_decisions:
- issue: Verhältnis des griechischen Wortlauts zum aramäischen Paralleltext in Esra 7,15–16
  choice: Der griechische Text wird mit „vom Volk … für den Tempel ihres Herrn in Jerusalem“ eigenständig wiedergegeben.
  alternative: 'Harmonisierung mit dem Paralleltext: Gold und Silber, das der König und seine Ratgeber dem Gott Israels freiwillig gegeben haben, dessen Wohnung in Jerusalem ist.'
  rationale: Für 1 Esdras ist der griechische Text die primäre Grundlage. Die erhebliche Abweichung des Paralleltextes wird kenntlich gemacht, aber nicht in den Haupttext eingetragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Text bleibt als Satzteil mit abschließendem Komma gestaltet, da der griechische Vers syntaktisch in den größeren Zusammenhang eingebunden ist. Die Wiederholung von „und“ bei den Opfertieren spiegelt die Aufzählung nicht mechanisch, sondern wird im Deutschen idiomatisch gesetzt.
