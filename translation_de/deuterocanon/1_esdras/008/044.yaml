base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/044.yaml
  text: I sent for Eleazar[a], Iduel, Maasman, Enaathan, Shemaiah, Jorib, Nathan, Ennathan, Zechariah, and Mesholabon, the leaders and men of understanding,
translation:
  language: de
  text: Ich schickte nach Eleasar[a], Iduel, Maasman, Enaatan, Samaia, Jorib, Natan, Ennatan, Sacharja und Mesolabon, den führenden und sachkundigen Männern,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mehrere Personennamen dieses Verses sind im Griechischen in Formen überliefert, die sich den Namensformen der hebräischen Esra-Überlieferung nicht sicher zuordnen lassen. Die Wiedergabe folgt daher dem griechischen Text, ohne die Namen vollständig an andere Überlieferungen anzugleichen.
    reason: textual_variant
lexical_decisions:
- source_word: ἀπέστειλα πρὸς
  choice: Ich sandte zu
  rationale: Die Grundbedeutung lautet „ich sandte zu“. Der griechische Wortlaut nennt keinen ausdrücklichen Zweck wie „um sie holen zu lassen“; daher bleibt die deutsche Fassung nahe am Text und bewahrt die mögliche Offenheit der Konstruktion.
- source_word: Ἐλεάζαρον καὶ Ἰδούηλον καὶ Μαασμὰν καὶ Ἐναατὰν καὶ Σαμαίαν καὶ Ἰώριβον, Ναθάν, Ἐννατάν, Ζαχαρίαν καὶ Μεσολαβών
  choice: Eleasar, Iduel, Maasman, Enaatan, Samaia, Jorib, Natan, Ennatan, Sacharia und Mesolabon
  rationale: Die Personennamen werden in gut lesbaren, im Deutschen üblichen beziehungsweise griechentextnahen Formen wiedergegeben. Eine vollständige Angleichung an die Namensformen anderer Esra-Überlieferungen wird wegen der erheblichen textlichen Abweichungen vermieden.
- source_word: τοὺς ἡγουμένους
  choice: den führenden … Männern
  rationale: Das substantivierte Partizip bezeichnet Personen, die führen oder eine hervorgehobene Stellung innehaben. „führende Männer“ gibt dies natürlich und ohne eine nicht ausdrücklich genannte Amtsbezeichnung wieder.
- source_word: ἐπιστήμονας
  choice: sachkundigen
  rationale: Das Wort bezeichnet verständige, kenntnisreiche oder erfahrene Personen. „sachkundig“ ist gegenwärtiges, gut verständliches Deutsch und vermeidet sowohl eine übermäßig technische Bedeutung („Experten“) als auch eine altertümliche Ausdrucksweise.
