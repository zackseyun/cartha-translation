  register: Modernes, würdiges Standarddeutsch. Die Satzstellung stellt die Herkunft aus Babylon näher zum Verb und vermeidet eine missverständliche Zuordnung zur Regierungszeit. Die Fußnotenmarker folgen der vom englischen Konsultationstext vorgegebenen Reihenfolge [b][a].
