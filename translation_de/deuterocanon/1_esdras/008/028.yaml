base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/028.yaml
  text: And these are the leaders according to their fathers’ houses and their divisions[b][a], who went up with me from Babylon in the reign of Artaxerxes the king.
translation:
  language: de
  text: Und dies sind die führenden Männer nach ihren Sippen und ihren Abteilungen[b][a], die während der Regierungszeit des Königs Artaxerxes mit mir aus Babylon heraufzogen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die Oberhäupter« beziehungsweise »die Anführer nach ihren Sippen«. Das griechische προηγούμενοι kann Personen an der Spitze bezeichnen; der hebräische Paralleltext stützt den Sinn von Sippenoberhäuptern.'
    reason: lexical_alternative
  - marker: b
    text: Im Griechischen steht »ihre Abteilungen«; der hebräische Paralleltext verwendet dagegen einen genealogischen Ausdruck (etwa »ihre genealogische Erfassung« beziehungsweise »ihre Abstammung«). Die Übersetzung folgt dem Griechischen als dem Haupttext für 1 Esdras.
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ προηγούμενοι
  choice: die führenden Männer
  rationale: Das Partizip bezeichnet hier aufgrund des Zusammenhangs Personen an der Spitze; die hebräische Parallelüberlieferung stützt den Sinn von Sippenoberhäuptern. „Führende Männer“ wahrt diesen Status, ohne ein bestimmtes Amt festzulegen.
- source_word: κατὰ τὰς πατριὰς αὐτῶν
  choice: nach ihren Sippen
  rationale: πατριά bezeichnet abstammungsbezogene Großfamilien oder Sippen. „Sippen“ ist im Deutschen präziser und natürlicher als die wörtliche Wendung „Vaterhäuser“.
- source_word: καὶ τὰς μεριδαρχίας
  choice: und ihren Abteilungen
  rationale: Die griechische Lesart bezeichnet gegliederte Gruppen oder Abteilungen. Die Übersetzung folgt dem primären griechischen Zeugen und macht die abweichende genealogische Ausdrucksweise des hebräischen Paralleltexts in einer Fußnote kenntlich.
- source_word: οἱ ἀναβάντες
  choice: die … hinaufzogen
  rationale: Bewahrt die übliche biblische und geografische Redeweise für die Reise von Babylon nach Jerusalem.
- source_word: ἐν τῇ βασιλείᾳ Ἀρταξέρξου τοῦ βασιλέως
  choice: während der Regierungszeit des Königs Artaxerxes
  rationale: βασιλεία hat hier zeitlichen Sinn. Die deutsche Formulierung ist natürlich und gibt zugleich den ausdrücklich wiederholten Königstitel wieder.
