  source_fidelity: Der zeitliche Sinn von κατὰ πόσον τι („für eine kurze Zeit“) und die auffällige Wiederholung in παρὰ τοῦ κυρίου Κυρίου sind im Entwurf zutreffend bewahrt. ῥίζαν wird zu Recht nicht ausdeutend als „Rest“ wiedergegeben. Das aoristische Passivinfinitiv καταλειφθῆναι bezeichnet jedoch das Zurückgelassenwerden als Folge bzw. Ziel des erwiesenen Erbarmens; „geblieben sind“ setzt stattdessen einen gegenwärtigen Bestandszustand und ein Perfekt voraus.
  naturalness: Der Satz ist insgesamt würdig und gut verständlich. „eine Wurzel und ein Name“ ist als bewusst beibehaltene Bildsprache vertretbar. Die Wiederholung „vom Herrn, dem Herrn“ bleibt im Deutschen markiert, bildet aber die markierte griechische Überlieferung angemessen ab.
  terminology: „Erbarmen“ gibt ἔλεος passend wieder. „Heiliger Ort“ ist für τόπος ἁγιάσματος eine natürliche, nicht überinterpretierende Wiedergabe. Keine konfessionell einengende Terminologie wurde eingeführt.
