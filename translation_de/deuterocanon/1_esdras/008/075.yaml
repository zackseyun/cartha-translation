base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/075.yaml
  text: And now, for a little while, mercy has come to us from the Lord, the Lord, to leave us a root and a name in this holy place,
translation:
  language: de
  text: Und nun ist uns für eine kurze Zeit Erbarmen vom Herrn, dem Herrn, zuteilgeworden, um uns an diesem heiligen Ort eine Wurzel und einen Namen zurückzulassen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατὰ πόσον τι
  choice: für eine kurze Zeit
  rationale: Die Wendung bezeichnet hier einen begrenzten Zeitraum; die natürliche deutsche Formulierung bewahrt den zeitlichen Sinn.
- source_word: ἔλεος
  choice: Erbarmen
  rationale: Gibt die zugewandte, unverdiente Barmherzigkeit Gottes in würdigem, allgemein verständlichem Deutsch wieder.
- source_word: παρὰ τοῦ κυρίου Κυρίου
  choice: vom Herrn, dem Herrn
  rationale: Bewahrt die auffällige doppelte Herr-Anrede des griechischen Textes, ohne sie stillschweigend zu glätten.
- source_word: ῥίζαν καὶ ὄνομα
  choice: eine Wurzel und ein Name
  rationale: Übersetzt beide Bilder formal und erhält insbesondere das konkrete, möglicherweise metaphorische ῥίζα, statt es als »Rest« auszulegen.
- source_word: ἐν τῷ τόπῳ τούτῳ ἁγιάσματος
  choice: an diesem heiligen Ort
  rationale: Versteht ἁγιάσματος als nähere Bestimmung des Ortes und gibt den Sinn idiomatisch wieder.
theological_decisions:
- issue: Bedeutung von ῥίζα
  choice: Wurzel
  alternative: Rest / Nachkommenschaft
  rationale: Die wörtliche Bildsprache bleibt erhalten; eine Festlegung auf eine bestimmte heilsgeschichtliche Deutung wird vermieden.
- issue: Doppeltes κυρίου Κυρίου
  choice: Herrn, dem Herrn
  alternative: Herrn
  rationale: Die Wiederholung ist im griechischen Primärtext belegt und kann rhetorisch oder textgeschichtlich bedeutsam sein; sie wird daher nicht beseitigt.
- issue: Charakter des heiligen Ortes
  choice: dieser heilige Ort
  alternative: dieser Ort des Heiligtums
  rationale: Die idiomatische Hauptfassung versteht den Genitiv qualitativ; die Alternative wäre formaler, aber im Deutschen sperriger.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau bleibt nahe am Griechischen, wird jedoch so geordnet, dass Zweck beziehungsweise Folge mit »sodass« klar und natürlich verständlich ist.
