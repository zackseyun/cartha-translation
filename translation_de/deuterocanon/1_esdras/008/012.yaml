base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/012.yaml
  text: so that they may inspect Judea and Jerusalem[a], according to the law of the Lord that is in your hand[b],
translation:
  language: de
  text: damit sie die Verhältnisse in Judäa und Jerusalem untersuchen[a], gemäß dem Gesetz des Herrn, das er hat.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „damit sie Judäa und Jerusalem beaufsichtigen“ oder „dort Nachforschungen anstellen“. Das griechische Verb kann eine amtliche Besichtigung, Aufsicht oder Untersuchung bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „das er hat“. Die griechische Formulierung ist knapp, und wer mit „er“ gemeint ist, wird nicht ausdrücklich gesagt. Die Parallelstelle in Esra 7,14 spricht vom Gesetz Gottes, das „in deiner Hand“ ist, also dem Beauftragten anvertraut beziehungsweise bei ihm vorhanden ist.'
    reason: textual_and_cross_reference
lexical_decisions:
- source_word: ὅπως
  choice: damit
  rationale: Leitet einen Zwecksatz ein und gibt die finale Bedeutung im modernen Deutschen natürlich wieder.
- source_word: ἐπισκέψωνται
  choice: die Verhältnisse … untersuchen
  rationale: Das Verb bezeichnet hier im Zusammenhang eines königlichen Auftrags eine amtliche Prüfung oder Erkundung, nicht lediglich einen Besuch.
- source_word: κατὰ τὴν Ἰουδαίαν καὶ κατὰ Ἰερουσαλήμ
  choice: die Verhältnisse in Judäa und Jerusalem
  rationale: Das wiederholte κατά bezeichnet den Bereich beziehungsweise Gegenstand der amtlichen Untersuchung. Die Ergänzung „die Verhältnisse“ macht diesen Sinn im Deutschen verständlich, ohne einen bloßen Ortsbesuch nahezulegen.
- source_word: ἀκολούθως
  choice: und zwar nach
  rationale: Drückt Übereinstimmung mit einem maßgeblichen Standard aus; „und zwar“ verdeutlicht den Anschluss an den vorhergehenden Untersuchungsauftrag.
- source_word: ᾧ ἔχει νόμῳ Κυρίου
  choice: dem Gesetz des Herrn, das ihm vorliegt
  rationale: Die griechische Formulierung ist knapp und syntaktisch auffällig; sinngemäß bezeichnet sie das Gesetz des Herrn, das der beauftragten Person zur Verfügung steht. „Ihm vorliegt“ bewahrt die dritte Person von ἔχει und vermeidet, die im vorgelegten griechischen Text nicht ausdrücklich enthaltene Wendung „in deiner Hand“ in den Haupttext einzutragen.
- source_word: Κυρίου
  choice: des Herrn
  rationale: In diesem jüdischen Schriftkontext bezeichnet κύριος den Gott Israels; die übliche und würdige deutsche Wiedergabe ist „der Herr“.
theological_decisions:
- issue: Wiedergabe von Κυρίου im jüdischen Schriftkontext
  choice: des Herrn
  alternative: des HERRN
  rationale: Der griechische Ausgangstext bietet Κυρίου. „des Herrn“ gibt diesen Titel unmittelbar wieder, ohne eine typografische Konvention aus einer rekonstruierten hebräischen Gottesnamensform einzutragen.
- issue: Das Gesetz als Maßstab der amtlichen Untersuchung
  choice: nach dem Gesetz des Herrn
  alternative: gemäß dem Gesetz deines Gottes, das in deiner Hand ist
  rationale: Die Übersetzung hält sich an den vorgelegten griechischen Wortlaut, der Κυρίου hat und keine ausdrückliche Formulierung „deines Gottes“ oder „in deiner Hand“ enthält. Die Nähe zur hebräischen Parallelüberlieferung wird in der Fußnote kenntlich gemacht, nicht stillschweigend in den Haupttext übernommen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Die Verhältnisse … untersuchen“ kennzeichnet den amtlichen Charakter des Auftrags. Die ungewöhnlich knappe griechische Wendung am Versende wird lesbar wiedergegeben, während ihre grammatische Unschärfe und die abweichende Formulierung der Parallelüberlieferung in Fußnote [b] offengelegt werden.
