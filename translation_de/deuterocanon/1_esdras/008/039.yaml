base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/039.yaml
  text: 'From the sons of Adoniakim[a], the last ones, and these are their names: Eliphala son of Geuel, and Shemaiah[b],'
translation:
  language: de
  text: 'Dies sind die Namen der Letzten[a] unter den Söhnen Adoniakims: Eliphala, Sohn Geuëls, und Samaias[b],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die Letzten“. Gemeint sein kann die letzte Teilgruppe oder eine spätere Gruppe von Nachkommen; die genaue Bedeutung bleibt unsicher.'
    reason: lexical_alternative
  - marker: b
    text: Der entsprechende Abschnitt der masoretischen Esra-Überlieferung nennt an dieser Stelle eine andere Familie und eine andere Zahl. Da 1 Esdras seine hebräischen Parallelen mitunter anders anordnet oder gestaltet, folgt die Übersetzung hier dem griechischen Text als Hauptquelle.
    reason: textual_variant
lexical_decisions:
- source_word: ἐκ τῶν υἱῶν Ἀδωνιακαὶμ
  choice: Von den Söhnen Adoniakims
  rationale: ἐκ bezeichnet hier die Herkunft beziehungsweise Zugehörigkeit innerhalb einer Familienliste. Der Eigenname wird nach der griechischen Überlieferung wiedergegeben.
- source_word: οἱ ἔσχατοι
  choice: die Letzten
  rationale: Die wörtliche Bedeutung „die Letzten“ lässt offen, ob eine letzte Teilgruppe oder spätere Nachkommen gemeint sind, und vermeidet eine unbelegte Präzisierung.
- source_word: καὶ ταῦτα τὰ ὀνόματα αὐτῶν
  choice: Und dies sind ihre Namen
  rationale: Die im Griechischen nominal formulierte Einleitung wird im Deutschen mit dem ergänzten Verb natürlich und quellennah wiedergegeben.
- source_word: Ἐλειφάλα
  choice: Eliphala
  rationale: Der Personenname wird eng nach der griechischen Namensform transliteriert.
- source_word: τοῦ Γεουὴλ
  choice: der Sohn Geuëls
  rationale: Der Genitiv eines Personennamens bezeichnet in dieser genealogischen Liste die Abstammung. Die explizite Wiedergabe als „Sohn“ ist im Deutschen verständlich und idiomatisch.
- source_word: Σαμαίας
  choice: Samaias
  rationale: Die Form folgt dem griechischen Text unmittelbar, statt die vermutlich zugrunde liegende semitische Namensform stillschweigend einzusetzen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Listenform und die Unbestimmtheit von οἱ ἔσχατοι bleiben erhalten. Die griechischen Namensformen haben gegenüber harmonisierenden Formen aus der masoretischen Parallelüberlieferung Vorrang.
