base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/073.yaml
  text: From the times of our fathers[b][a], we have been in great sin until this day.
translation:
  language: de
  text: Seit den Zeiten unserer Väter[a] sind wir bis zum heutigen Tag in großer Sünde[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „unserer Vorfahren“. Wörtlich steht im Griechischen „unserer Väter“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „in großer Schuld“. Das griechische Wort bedeutet gewöhnlich „Sünde“, kann hier aber zugleich den daraus entstandenen Schuldzustand einschließen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ τῶν χρόνων
  choice: Seit der Zeit
  rationale: Die Wendung bezeichnet den zeitlichen Ausgangspunkt eines Zustands, der bis in die Gegenwart reicht. Im Deutschen gibt „seit“ diesen fortdauernden Zusammenhang natürlicher wieder als das wörtlichere „von … an“.
- source_word: τῶν πατέρων ἡμῶν
  choice: unserer Väter
  rationale: Dies bewahrt die ausdrücklich maskuline Ahnenbezeichnung des Griechischen; „Vorfahren“ ist eine mögliche idiomatische Alternative.
- source_word: ἐσμεν
  choice: sind wir
  rationale: Die griechische Form steht im Präsens. Zusammen mit „seit“ und „bis zum heutigen Tag“ bezeichnet das deutsche Präsens idiomatisch einen von früher bis jetzt andauernden Zustand.
- source_word: ἐν μεγάλῃ ἁμαρτίᾳ
  choice: in großer Sünde
  rationale: Die Formulierung bleibt nahe bei ἁμαρτία und vermeidet die stärker rechtlich deutende Wiedergabe „Schuld“.
- source_word: ἕως τῆς ἡμέρας ταύτης
  choice: bis zum heutigen Tag
  rationale: Eine natürliche, würdevolle deutsche Wiedergabe der zeitlichen Grenze bis zur Gegenwart des Sprechers.
theological_decisions:
- issue: Geschlechtsspezifische Ahnenbezeichnung
  choice: unserer Väter
  alternative: unserer Vorfahren
  rationale: Das Griechische verwendet πατέρων, wörtlich „Väter“. Der Haupttext bewahrt diese Form, während die idiomatische, geschlechtsübergreifend verstandene Alternative in der Fußnote genannt wird.
- issue: Sünde oder Schuld
  choice: in großer Sünde
  alternative: in großer Schuld
  rationale: ἁμαρτία bezeichnet hier unmittelbar Sünde. Obwohl der Ausdruck auch einen Zustand schwerer Schuld einschließt, soll diese rechtliche Nuance nicht an die Stelle des griechischen Begriffs treten.
- issue: Fortdauernder Zustand und griechisches Präsens
  choice: sind wir
  alternative: befinden wir uns
  rationale: Das Präsens wird formal bewahrt; die Verbindung mit „seit“ macht im Deutschen deutlich, dass der Zustand in der Vergangenheit begann und bis heute anhält.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die zeitliche Konstruktion ist idiomatisch deutsch gefasst, während Schlüsselbegriffe und die Spannung zwischen Sünde und Schuld quellentreu erhalten bleiben.
