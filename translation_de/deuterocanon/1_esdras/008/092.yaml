  source_fidelity: 'Der erste Satzteil gibt ἀναστὰς ἐπίτελει und die Verantwortungswendung πρὸς σὲ ... τὸ πρᾶγμα treffend wieder. Die bisherige Satzteilung „Wir stehen dir bei: Handle mit Kraft“ löst jedoch ἰσχὺν ποιεῖν zu stark aus der mit καὶ ἡμεῖς μετὰ σοῦ verbundenen Konstruktion und macht daraus eine eigenständige Anrede an Esra. Die Revision bewahrt den im Griechischen naheliegenden Bezug auf „wir“ und hält die knappe Syntax durch eine Anmerkung transparent.'
