base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/092.yaml
  text: Rise up and carry it through[a], for the matter is yours, and we are with you; be strong and act.
translation:
  language: de
  text: Steh auf und führe es zu Ende; denn diese Sache liegt bei dir, und wir stehen dir bei, um entschlossen zu handeln.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die knappe griechische Wendung lautet wörtlich etwa „Kraft tun“ und ist syntaktisch verdichtet. Sie kann die Bereitschaft der anderen zum entschlossenen Handeln ausdrücken; sie wird auch als abschließende Ermutigung verstanden: „Sei stark und handle.“ Der nur annähernd parallele hebräische Text in Esra 10,4 hat diese letztgenannte Formulierung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστὰς
  choice: Steh auf
  rationale: Das Aoristpartizip von ἀνίστημι hat hier auffordernde Kraft. „Steh auf“ gibt den unmittelbaren Handlungsaufruf natürlich und würdig wieder.
- source_word: ἐπίτελει
  choice: führe es zu Ende
  rationale: Der Imperativ von ἐπιτελέω bezeichnet das Vollenden oder konsequente Durchführen einer Sache. „Führe es zu Ende“ bewahrt sowohl den Abschlussgedanken als auch den Aufruf zum Handeln.
- source_word: πρὸς σὲ γὰρ τὸ πρᾶγμα
  choice: denn diese Sache liegt bei dir
  rationale: Die wörtlich ungewöhnliche Wendung „die Sache ist zu dir hin“ weist auf Zuständigkeit oder Verantwortung. „Liegt bei dir“ lässt offen, ob vor allem Verantwortung oder Betroffenheit gemeint ist.
- source_word: ἡμεῖς μετὰ σοῦ
  choice: Wir stehen dir bei
  rationale: Die Wendung bekundet Solidarität und Unterstützung. „Wir stehen dir bei“ ist im Deutschen natürlicher als das räumlich klingende „wir sind mit dir“.
- source_word: ἰσχὺν ποιεῖν
  choice: Handle mit Kraft
  rationale: Die knappe griechische Verbindung bedeutet annähernd „Kraft tun/ausüben“ und ist mehrdeutig. „Handle mit Kraft“ wahrt den Handlungsbezug, ohne ein im Griechischen nicht genanntes Objekt einzuführen.
theological_decisions:
- issue: Bezug und Funktion von ἰσχὺν ποιεῖν
  choice: 'Als abschließende Aufforderung wiedergegeben: „Handle mit Kraft.“'
  alternative: 'Als Zweck oder Inhalt der Unterstützung: „Wir sind bei dir, um kraftvoll zu handeln“; nach Esra 10,4 auch: „Sei stark und handle.“'
  rationale: Die griechische Syntax ist knapp und nicht völlig eindeutig. Die gewählte Fassung bewahrt die Aufforderung zur entschlossenen Tat, während die Fußnote die syntaktischen und semitischen Alternativen offenhält.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Aufforderungston. Der Doppelpunkt markiert die mögliche abschließende Ermutigung, ohne die Mehrdeutigkeit der knappen griechischen Schlusswendung zu verschweigen.
