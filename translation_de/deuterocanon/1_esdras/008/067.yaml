base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/067.yaml
  text: They took some of their daughters as wives for themselves and for their sons[a], and the holy seed was mixed with the foreign nations of the land[b]; and the leaders and the nobles shared in this lawlessness from the beginning of the matter.
translation:
  language: de
  text: Sie nahmen einige von deren Töchtern für sich und ihre Söhne zu Frauen[a], und die heilige Nachkommenschaft[b] vermischte sich mit den fremden Völkern des Landes. Auch die führenden Männer und die Würdenträger waren von Anfang dieser Sache an dieser Gesetzlosigkeit[c] beteiligt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ließen einige von deren Töchtern mit sich und ihren Söhnen zusammenleben“. Das griechische Verb kann das Zusammenwohnen oder die Eheschließung bezeichnen; hier weist der Zusammenhang auf eine eheliche Verbindung.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „der heilige Same“; auch „die heilige Linie“. Gemeint ist bildhaft die für Gott ausgesonderte Nachkommenschaft.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „an dieser Übertretung“. Das griechische Wort bedeutet wörtlich „Gesetzlosigkeit“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: συνῴκισαν
  choice: nahmen … zu Frauen
  rationale: Das Verb bezeichnet wörtlich das Zusammenwohnen beziehungsweise die eheliche Verbindung. Im Zusammenhang der Mischehen gibt „zu Frauen nehmen“ den Sinn natürlich und deutlich wieder, ohne über den Text hinauszugehen.
- source_word: τινας τῶν θυγατέρων αὐτῶν
  choice: einige von deren Töchtern
  rationale: Die partitive Wendung begrenzt die Aussage ausdrücklich auf einen Teil der Töchter. „Deren“ macht im Deutschen deutlich, dass die Töchter zu den zuvor genannten fremden Völkern gehören.
- source_word: καὶ αὐτοὶ καὶ οἱ υἱοὶ αὐτῶν
  choice: für sich und ihre Söhne
  rationale: Die koordinierte griechische Formulierung nennt die Männer selbst und ihre Söhne als Beteiligte. Die deutsche Fassung ergänzt die eheliche Beziehung idiomatisch.
- source_word: ἐπεμίγη
  choice: vermischte sich
  rationale: Die mediale beziehungsweise passive Vorstellung des Mischens bleibt erhalten. Der unmittelbare Zusammenhang erklärt die Metapher, sodass keine auslegende Umschreibung nötig ist.
- source_word: τὸ σπέρμα τὸ ἅγιον
  choice: die heilige Nachkommenschaft
  rationale: „Nachkommenschaft“ ist im heutigen Deutsch verständlicher als das wörtliche „Same“, bewahrt aber die gemeinschaftlich-genealogische Metapher. Die wörtliche Form wird in einer Fußnote genannt.
- source_word: εἰς τὰ ἀλλογενῆ ἔθνη τῆς γῆς
  choice: mit den fremden Völkern des Landes
  rationale: Bei „sich vermischen“ verlangt natürliches Deutsch „mit“. ἀλλογενής bezeichnet fremde beziehungsweise andersstämmige Herkunft; „fremde Völker“ wahrt diese Bedeutung ohne unnötig abwertende Sprache.
- source_word: μετεῖχον
  choice: waren … beteiligt
  rationale: Die Formulierung gibt den Gedanken aktiver Teilhabe klar und idiomatisch wieder.
- source_word: οἱ προηγούμενοι καὶ οἱ μεγιστᾶνες
  choice: die führenden Männer und die Würdenträger
  rationale: 'Die beiden Gruppen gesellschaftlich maßgeblicher Personen bleiben unterschieden: die Anführer einerseits und hochgestellte Amtsträger beziehungsweise Vornehme andererseits.'
- source_word: τῆς ἀνομίας ταύτης
  choice: an dieser Gesetzlosigkeit
  rationale: „Gesetzlosigkeit“ erhält die rechtliche und bundesbezogene Schärfe von ἀνομία und schwächt die ausdrückliche Verurteilung nicht ab.
- source_word: ἀπὸ τῆς ἀρχῆς τοῦ πράγματος
  choice: von Anfang dieser Sache an
  rationale: Die Wendung bleibt eng am Griechischen und lässt offen, ob πρᾶγμα hier die Angelegenheit, den Vorgang oder das Unternehmen bezeichnet.
theological_decisions:
- issue: Bedeutung von τὸ σπέρμα τὸ ἅγιον im Zusammenhang der Mischehen
  choice: die heilige Nachkommenschaft
  alternative: der heilige Same; die heilige Linie
  rationale: Die Übersetzung bewahrt die Vorstellung eines für Gott ausgesonderten Volkes, ohne sie zu einer Aussage über eine bestimmte ethnische, sakramentale oder genealogische Lehre auszubauen. Die wörtliche Metapher bleibt durch die Fußnote sichtbar.
- issue: Moralische Kennzeichnung des Verhaltens
  choice: Gesetzlosigkeit
  alternative: Übertretung; Unrecht
  rationale: Der griechische Text verurteilt das Handeln ausdrücklich mit ἀνομία. „Gesetzlosigkeit“ erhält dessen rechtlich-theologische Spannung, statt sie zu einem allgemeinen Fehlverhalten abzuschwächen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau wurde für gute Verständlichkeit in zwei Hauptsätze gegliedert. Die bildhafte und rechtlich-theologische Sprache des griechischen Textes bleibt erhalten; schwer verständliches wörtliches Deutsch wird in den Fußnoten dokumentiert.
