  verdict: revise
  source_fidelity: 'Der Entwurf gibt den griechischen Grundtext insgesamt zutreffend wieder: Es geht um einen Eid gegenüber dem Herrn und um das Wegschicken der Ehefrauen anderer Volkszugehörigkeit zusammen mit ihren Kindern. Die Schlusskonstruktion ὡς ἐκρίθη σοι, καὶ ὅσοι πειθαρχήσουσιν τοῦ νόμου τοῦ κυρίου ist jedoch syntaktisch stark verdichtet. Die deutsche Wiedergabe darf ihren ergänzten Bezug nicht als eindeutig ausgeben. Außerdem ist „soll dies unser Eid ... sein“ weniger nah an γενέσθω ἡμῖν als eine Formulierung mit „für uns“.'
  naturalness: „Soll für uns ein Eid vor dem Herrn gelten“ ist modernes, würdiges und idiomatisches Standarddeutsch. „Ehefrauen“ vermeidet die im heutigen Deutsch mögliche Missdeutung von „unsere Frauen“ als eine allgemeine Gruppe von Frauen. Die Satzfügung bleibt trotz des schwierigen Schlusses gut lesbar.
  terminology: „Herr“, „Eid“, „Ehefrauen aus fremden Völkern“, „Kinder“ und „Gesetz des Herrn“ sind sachgerecht. „Fortzuschicken“ gibt ἐκβαλεῖν in diesem Zusammenhang vertretbar wieder; die Fußnote nennt die stärkeren möglichen Lesarten. Der Zusatz „von allen beschlossen“ beruht auf einer notwendigen syntaktischen Ergänzung und muss deshalb in der Anmerkung als solche kenntlich gemacht werden.
