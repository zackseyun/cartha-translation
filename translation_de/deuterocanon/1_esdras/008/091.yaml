base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/091.yaml
  text: In this matter let there be for us an oath to the Lord[a], to send away all our wives from among the foreigners, together with their children, as it has been decided by you[b], and by all who obey the law of the Lord.
translation:
  language: de
  text: 'In dieser Sache soll für uns ein Eid vor dem Herrn gelten: alle unsere Ehefrauen aus fremden Völkern samt ihren Kindern fortzuschicken[a], wie es von dir und von allen beschlossen wurde, die dem Gesetz des Herrn gehorchen werden.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wegzuschicken“, „zu verstoßen“ oder „hinauszuwerfen“.'
    reason: Das griechische ἐκβαλεῖν kann je nach Zusammenhang unterschiedlich stark als Wegschicken, Verstoßen oder Hinauswerfen verstanden werden.
  - marker: b
    text: 'Der griechische Satz ist hier syntaktisch verkürzt; wörtlicher etwa: „wie für/von dir entschieden wurde, und alle, die dem Gesetz des Herrn gehorchen werden“. Die Wiedergabe „von dir und von allen beschlossen“ ergänzt den wahrscheinlich gemeinten Zusammenhang.'
    reason: Die Bedeutung des Dativs σοι („für dich“ oder kontextuell „von dir“) und die Anbindung des mit καί eingeleiteten Schlussteils sind in der griechischen Überlieferung nicht vollständig eindeutig.
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: In dieser Sache
  rationale: Die Wendung bezeichnet die konkret verhandelte Angelegenheit; „in dieser Sache“ ist im Deutschen klar und idiomatisch.
- source_word: γενέσθω ἡμῖν ὁρκωμοσία πρὸς τὸν κύριον
  choice: soll dies unser Eid vor dem Herrn sein
  rationale: Die Formulierung bewahrt den auffordernden Charakter von γενέσθω und gibt die etwas sperrige griechische Konstruktion in würdigem, natürlichem Deutsch wieder. „Vor dem Herrn“ bezeichnet den Herrn als Zeugen und Adressaten der eidlichen Verpflichtung.
- source_word: ἐκβαλεῖν
  choice: fortzuschicken
  rationale: Der Infinitiv nennt den Inhalt des Eides. „Fortschicken“ wahrt den deutlichen Trennungscharakter, ohne die im Deutschen stärker gewaltsam klingende Bedeutung von „hinauswerfen“ zwingend einzutragen.
- source_word: πάσας τὰς γυναῖκας ἡμῶν τὰς ἐκ τῶν ἀλλογενῶν
  choice: alle unsere Frauen aus fremden Völkern
  rationale: γυναῖκες bezeichnet im Zusammenhang Ehefrauen; ἀλλογενεῖς meint Menschen anderer Volkszugehörigkeit, nicht den später theologisch aufgeladenen Begriff „Heiden“.
- source_word: σὺν τοῖς τέκνοις αὐτῶν
  choice: samt ihren Kindern
  rationale: „Samt“ gibt die ausdrückliche Einbeziehung der Kinder knapp und deutlich wieder.
- source_word: ὡς ἐκρίθη σοι
  choice: wie es von dir beschlossen wurde
  rationale: Die passive Form von κρίνω hat hier den Sinn einer Entscheidung oder Festlegung. Die deutsche Passivkonstruktion hält sich eng an die überlieferte Form.
- source_word: καὶ ὅσοι πειθαρχήσουσιν τοῦ νόμου τοῦ κυρίου
  choice: und von allen, die dem Gesetz des Herrn gehorchen werden
  rationale: Der griechische Satz ist syntaktisch verkürzt. Die Ergänzung „von“ stellt im Deutschen die naheliegende Parallele zu „von dir“ her; das Futur von πειθαρχήσουσιν bleibt erhalten.
theological_decisions:
- issue: Wiedergabe von κύριος im jüdischen Bundes- und Gesetzeskontext
  choice: Herr
  alternative: Gebieter
  rationale: „Herr“ ist die übliche und kontextgerechte Wiedergabe für Israels Gott und bewahrt den biblischen Sprachgebrauch ohne zusätzliche konfessionelle Festlegung.
- issue: Bezeichnung der aus anderen Völkern stammenden Frauen
  choice: aus fremden Völkern
  alternative: fremdstämmig; heidnisch
  rationale: Die Formulierung gibt die ethnische Fremdzugehörigkeit von ἀλλογενῶν wieder, ohne eine spätere religiöse Kategorie einzutragen.
- issue: Syntaktische Zuordnung des abschließenden Satzteils
  choice: Die Entscheidung wird „dir und allen“ zugeschrieben, die dem Gesetz gehorchen werden.
  alternative: Nur „dir“ wird die Entscheidung zugeschrieben; die Gesetzestreuen bilden eine unverbundene weitere Gruppe.
  rationale: Der überlieferte griechische Text ist nach καί syntaktisch komprimiert. Die gewählte Ergänzung ergibt den naheliegenden Zusammenhang, während eine Fußnote die formale Unebenheit offenlegt.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem biblischem Register. Der Hauptsatz bleibt nahe an der griechischen Aufforderungsform; sachliche Härte und syntaktische Unsicherheit werden nicht durch konfessionelle oder harmonisierende Zusätze verdeckt.
