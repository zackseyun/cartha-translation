base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/054.yaml
  text: And again we prayed to our Lord about all these things[b][a], and we found him favorable.
translation:
  language: de
  text: Und wieder baten wir unseren Herrn in all diesen Angelegenheiten[a], und wir fanden ihn uns wohlgesinnt[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Text besagt hier: „Und wieder baten wir unseren Herrn in all diesen Angelegenheiten, und wir fanden ihn uns wohlgesinnt.“ Der für diesen Vers angegebene hebräische bzw. masoretische Paralleltext stimmt damit nicht überein und scheint aus einem anderen Zusammenhang zu stammen. Die Übersetzung folgt daher dem griechischen Text als dem primären Textzeugen.'
    reason: textual_variant
  - marker: b
    text: 'Oder: „gnädig“. Das griechische Adjektiv bezeichnet eine gütige, geneigte oder günstige Haltung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν
  choice: wieder
  rationale: Das Adverb bezeichnet eine Wiederholung; „wieder“ ist im heutigen Deutsch knapp und natürlich.
- source_word: ἐδεήθημεν
  choice: baten wir
  rationale: δέομαι bezeichnet eine dringliche Bitte oder ein Flehen. „baten wir“ ist verständlich und wahrt im Zusammenhang mit dem Herrn den Gebetscharakter, ohne die Intensität unnötig zu steigern.
- source_word: τοῦ κυρίου ἡμῶν
  choice: unseren Herrn
  rationale: Der Genitiv bezeichnet bei δέομαι die angerufene Person. In diesem Gebetszusammenhang ist κύριος mit „Herr“ wiederzugeben.
- source_word: πάντα ταῦτα
  choice: wegen all dieser Dinge
  rationale: Die Wendung nimmt umfassend auf die zuvor genannten Angelegenheiten Bezug. „all dieser Dinge“ bewahrt den Plural; „wegen“ gibt den sachlichen Bezug der Bitte idiomatisch wieder.
- source_word: ἐτύχομεν
  choice: wir fanden ihn
  rationale: τυγχάνω kann hier das Erlangen oder Erfahren einer bestimmten Haltung bezeichnen. Mit dem folgenden Adjektiv ist „wir fanden ihn …“ eine quellennah bleibende deutsche Formulierung.
- source_word: εὐιλάτου
  choice: uns wohlgesinnt
  rationale: Das Adjektiv bezeichnet eine gütige, geneigte oder günstige Haltung. „wohlgesinnt“ gibt dies verständlich wieder; „uns“ verdeutlicht die im Deutschen erforderliche Beziehung, ohne eine zusätzliche theologische Aussage einzutragen.
theological_decisions:
- issue: Wiedergabe von κύριος im Gebetszusammenhang
  choice: Herr
  alternative: Gebieter
  rationale: Da hier Gott im Gebet angerufen wird, entspricht „Herr“ sowohl dem griechischen κύριος als auch dem etablierten biblischen Sprachgebrauch, ohne eine konfessionelle Sonderdeutung einzuführen.
- issue: Erhebliche Abweichung der angegebenen masoretischen Parallelstelle
  choice: Der griechische Gebetssatz bildet den Haupttext
  alternative: Anpassung an den hebräischen Text über das Aussondern von Priestern
  rationale: Der bereitgestellte hebräische Paralleltext gehört offenkundig zu einem anderen Wortlaut und Kontext. Da die Septuaginta-Ausgabe als primärer Textzeuge bestimmt ist, wird ihr Wortlaut übersetzt und die Abweichung transparent in einer Fußnote vermerkt.
- issue: Deutung von εὐιλάτου
  choice: wohlgesinnt
  alternative: gnädig
  rationale: „wohlgesinnt“ bewahrt die Bedeutung einer günstigen oder gütigen Haltung. „gnädig“ ist ebenfalls möglich, kann im Deutschen jedoch eine stärker theologisch geprägte Nuance tragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz bleibt nah an der griechischen Struktur, wird aber durch „wegen“ und „uns wohlgesinnt“ idiomatisch verständlich gemacht. Die echte Bedeutungsbreite des Schlussadjektivs wird in der Fußnote offengehalten.
