base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/063.yaml
  text: 'And those who had come from the captivity offered sacrifices to the Lord[a], the God of Israel: ninety-six rams, seventy-six lambs, and twelve male goats for a peace offering; all of them as a sacrifice to the Lord.'
translation:
  language: de
  text: 'Diejenigen, die aus der Gefangenschaft gekommen waren, brachten dem Gott Israels, dem Herrn, Opfer dar: sechsundneunzig [Widder][a], sechsundsiebzig Lämmer und zwölf Ziegenböcke für ein Heilsopfer[b] – alle als Opfer für den Herrn.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im erhaltenen griechischen Wortlaut folgt auf „sechsundneunzig“ kein Tiername. „Widder“ ist sinngemäß ergänzt.
    reason: textual_ellipsis
  - marker: b
    text: Wörtlich kann der griechische Ausdruck auch „für Heil“, „für Rettung“ oder „für Wohlergehen“ bedeuten; hier steht er in einem Opferzusammenhang.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ παραγενόμενοι ἐκ τῆς αἰχμαλωσίας
  choice: Die aus der Gefangenschaft Angekommenen
  rationale: Gibt sowohl das Ankommen (παραγενόμενοι) als auch die Gefangenschaft bzw. Verschleppung (αἰχμαλωσία) knapp und quellenah wieder.
- source_word: προσήνεγκαν θυσίας
  choice: brachten … Opfer dar
  rationale: „Opfer darbringen“ ist im Deutschen die natürliche kultische Entsprechung von προσφέρειν θυσίας.
- source_word: τῷ θεῷ τοῦ Ἰσραὴλ Κυρίῳ
  choice: dem Gott Israels, dem Herrn
  rationale: Bewahrt die griechische Reihenfolge und versteht Κυρίῳ als appositionelle Bezeichnung zu „dem Gott Israels“.
- source_word: ἐνενήκοντα ἕξ
  choice: sechsundneunzig [Widder]
  rationale: Im überlieferten griechischen Wortlaut steht nach der Zahl kein Tiername. „Widder“ wird aufgrund des Opferinventars und der englischen Konsultationsschicht ergänzt, aber durch eckige Klammern als Ergänzung kenntlich gemacht.
- source_word: ἄρνας ἑβδομήκοντα ἕξ
  choice: sechsundsiebzig Lämmer
  rationale: ἀρήν/ἄρνας bezeichnet Lämmer bzw. junge Schafe; „Lämmer“ ist die direkte und natürliche Wiedergabe.
- source_word: τράγους
  choice: Ziegenböcke
  rationale: τράγος bezeichnet ausdrücklich ein männliches Tier der Ziege.
- source_word: ὑπὲρ σωτηρίου
  choice: für ein Heilsopfer
  rationale: „Heilsopfer“ erhält sowohl den kultischen Zusammenhang als auch den Bedeutungsbereich von σωτήριον (Heil, Rettung, Wohlergehen), ohne ihn vorschnell auf „Friedensopfer“ festzulegen.
- source_word: ἅπαντα θυσίαν τῷ κυρίῳ
  choice: alle als Opfer für den Herrn
  rationale: Gibt die zusammenfassende Aussage über sämtliche genannten Tiere klar und nah am Griechischen wieder.
theological_decisions:
- issue: Deutung von ὑπὲρ σωτηρίου als kultischer Ausdruck
  choice: für ein Heilsopfer
  alternative: für ein Friedensopfer; für Heil/Rettung; für Wohlergehen
  rationale: Der Opferkontext legt eine kultische Bedeutung nahe, doch σωτήριον trägt weiterhin die Bedeutungen Heil, Rettung und Wohlergehen. „Heilsopfer“ wahrt diese Spannung besser als die stärker festgelegte Bezeichnung „Friedensopfer“.
- issue: Bezeichnung des Opferempfängers in τῷ θεῷ τοῦ Ἰσραὴλ Κυρίῳ
  choice: dem Gott Israels, dem Herrn
  alternative: dem Herrn, dem Gott Israels
  rationale: Die gewählte Fassung folgt der belegten griechischen Wortfolge und behandelt „dem Herrn“ als Apposition, ohne einen theologischen Unterschied zwischen den Bezeichnungen einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kultische Sprache bleibt verständlich, ohne konfessionell geprägte Fachterminologie unnötig festzuschreiben. Eckige Klammern markieren transparent die im griechischen Ausgangstext fehlende Tierbezeichnung.
