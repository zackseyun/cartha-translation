base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/032.yaml
  text: 'From the sons of Zathoes: Eiechonias son of Jethel[a], and with him two hundred men; from the sons of Adin: Obeth son of Jonathan[b], and with him two hundred fifty men.'
translation:
  language: de
  text: 'Von den Söhnen des Zathoes[a]: Eiechonias, der Sohn Jethels, und mit ihm zweihundert Männer; von den Söhnen Adins: Uben[b], der Sohn Jonathans, und mit ihm zweihundertfünfzig Männer.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Familienname »Zathoes« folgt dem griechischen Hauptzeugen; die nur ungefähre masoretische Parallele bietet eine andere Namensform.
    reason: alternative_reading
  - marker: b
    text: Die ungewöhnliche griechische Namensform Οὐβὴν ist in ihrer genauen Wiedergabe unsicher; möglich wären auch Transliterationen wie »Oben« oder »Ouben«.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ τῶν υἱῶν
  choice: von den Söhnen
  rationale: Die Wendung leitet Personen ein, die einer Familie oder Sippe entstammen. Die wiederholte Listenform und das genealogische Bild des Griechischen bleiben erhalten.
- source_word: Ζαθόης
  choice: Zathoes
  rationale: Der Name wird nach dem primären griechischen Text wiedergegeben und nicht an die abweichende Namensform der nur ungefähren masoretischen Parallele angeglichen.
- source_word: Εἰεχονίας
  choice: Eiechonias
  rationale: Die Transliteration bleibt eng bei der im griechischen Hauptzeugen überlieferten Namensform.
- source_word: Ἰεθήλου
  choice: der Sohn Jethels
  rationale: Der Genitiv bezeichnet in diesem Listenaufbau den Vater. Die Ergänzung »der Sohn« macht die Beziehung im Deutschen eindeutig, ohne den Sinn zu erweitern.
- source_word: μετʼ αὐτοῦ
  choice: und mit ihm
  rationale: Die knappe Zählungsformel wird unmittelbar und natürlich wiedergegeben.
- source_word: ἄνδρες
  choice: Männer
  rationale: Das griechische Wort bezeichnet ausdrücklich Männer und nicht allgemein Personen.
- source_word: διακόσιοι
  choice: zweihundert
  rationale: Direkte Wiedergabe der Kardinalzahl.
- source_word: Ἀδείν
  choice: Adin
  rationale: Nahe Transliteration des griechischen Familiennamens.
- source_word: Οὐβὴν
  choice: Uben
  rationale: Die Schreibung gibt die griechischen Laute möglichst unmittelbar wieder. Da die überlieferte Namensform ungewöhnlich und ihre Identifizierung unsicher ist, wird dies in einer Fußnote kenntlich gemacht.
- source_word: Ἰωνάθου
  choice: der Sohn Jonathans
  rationale: Wie beim vorherigen Namenspaar wird die patronymische Beziehung, die im Griechischen durch den Genitiv ausgedrückt ist, im Deutschen ausdrücklich benannt.
- source_word: διακόσιοι πεντήκοντα
  choice: zweihundertfünfzig
  rationale: Direkte und im modernen Deutschen übliche Wiedergabe der Zahl.
