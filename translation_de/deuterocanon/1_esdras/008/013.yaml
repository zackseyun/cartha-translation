base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/013.yaml
  text: and to bring to Jerusalem gifts for the Lord[a], which I and my friends have vowed, and all the gold and silver that may be found in the land of Babylonia for the Lord in Jerusalem[b],
translation:
  language: de
  text: und die Gaben für den Herrn[a], die ich und meine Freunde gelobt haben, nach Jerusalem zu bringen sowie alles Gold und Silber, das sich im Land Babylonien finden lässt, für den Herrn nach Jerusalem zu bringen[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Opfergaben“. Das griechische Wort kann hier einen kultischen Sinn haben.'
    reason: lexical_alternative
  - marker: b
    text: 'Die griechische Schlusswendung ist knapp: wörtlich etwa „für den Herrn nach Jerusalem“. Das Deutsche wiederholt „zu bringen“, um die vom griechischen Infinitiv abhängige Zielrichtung deutlich zu machen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπενεγκεῖν
  choice: zu bringen
  rationale: Der Infinitiv bezeichnet das Hinbringen der Gaben an ihr Ziel; im Deutschen gibt „nach Jerusalem zu bringen“ die Bewegungsrichtung natürlich wieder.
- source_word: δῶρα
  choice: Gaben
  rationale: „Gaben“ bewahrt den allgemeinen Sinn und lässt zugleich den im Zusammenhang vorhandenen kultischen Anklang offen.
- source_word: τῷ κυρίῳ
  choice: für den Herrn
  rationale: Der Dativ bezeichnet hier die Bestimmung der Gaben für Gott; „Herr“ ist in diesem jüdisch-schriftlichen Kontext die angemessene Wiedergabe von κύριος.
- source_word: ἃ ηὔξαμην
  choice: die ich … gelobt habe
  rationale: εὔχομαι kann bei materiellen Gaben das Ablegen eines Gelübdes bezeichnen; die deutsche Wendung „Gaben geloben“ bewahrt diesen kultisch-verbindlichen Sinn.
- source_word: οἱ φίλοι
  choice: meine Freunde
  rationale: Dies entspricht dem unmarkierten Wortsinn; eine speziellere Deutung als Hofleute oder Gefährten ist im Griechischen nicht zwingend.
- source_word: πᾶν χρυσίον καὶ ἀργύριον
  choice: alles Gold und Silber
  rationale: Die kollektive Formulierung gibt die umfassende Aussage des griechischen Textes klar und idiomatisch wieder.
- source_word: ὃ ἐὰν εὑρεθῇ
  choice: das sich … finden lässt
  rationale: Die Formulierung bewahrt den offenen, kontingenten Sinn der Relativkonstruktion mit ἐάν und Konjunktiv.
- source_word: ἐν τῇ χώρᾳ τῆς Βαβυλωνίας
  choice: im Land Babylonien
  rationale: χώρα bezeichnet hier allgemein ein Land oder Gebiet; eine engere verwaltungstechnische Bedeutung wie „Provinz“ ist nicht erforderlich.
- source_word: τῷ κυρίῳ εἰς Ἰερουσαλήμ
  choice: für den Herrn in Jerusalem
  rationale: Die knappe griechische Schlusswendung wird bewusst eng wiedergegeben und bezeichnet wohl für den Herrn bestimmte Mittel mit Jerusalem als kultischem Ziel oder Ort.
theological_decisions:
- issue: Wiedergabe von κύριος
  choice: Herr
  alternative: Gebieter
  rationale: Im jüdisch-schriftlichen Zusammenhang bezeichnet κύριος den Gott Israels; „Herr“ ist die natürliche und traditionsfähige deutsche Entsprechung.
- issue: Kultischer Gehalt von δῶρα und ηὔξαμην
  choice: Gaben … gelobt haben
  alternative: Opfergaben … versprochen haben
  rationale: Die gewählte Formulierung erhält den religiösen und verpflichtenden Sinn, ohne eine bestimmte Opferhandlung zu behaupten, die der griechische Text nicht ausdrücklich nennt.
- issue: Bezug der komprimierten Schlusswendung
  choice: für den Herrn in Jerusalem
  alternative: für den Herrn nach Jerusalem
  rationale: Das Griechische lässt das Verhältnis von Bestimmung und Ziel knapp nebeneinanderstehen. Die Hauptfassung wahrt diese Spannung, während die Fußnote die mögliche Zielrichtung erläutert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzform bleibt als Fortsetzung des vorausgehenden Kontexts offen. Die Wiederholung „für den Herrn“ und die komprimierte Orts- beziehungsweise Richtungsangabe des Griechischen werden bewahrt und durch eine Fußnote erläutert.
