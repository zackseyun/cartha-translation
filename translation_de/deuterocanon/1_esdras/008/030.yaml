base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/030.yaml
  text: 'Of the sons of Pharez: Zechariah[a], and with him, according to the record[b], one hundred fifty men.'
translation:
  language: de
  text: 'Von den Nachkommen des Phares: Sacharja[a] und mit ihm, laut dem Verzeichnis[b], 150 Männer.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die hebräische Parallelstelle liest „Parosch“ statt „Phares“. Der Haupttext folgt dem griechischen Text von 1 Esdras.
    reason: alternative_reading
  - marker: b
    text: 'Oder: „nach der schriftlichen Aufzeichnung“ beziehungsweise „aus dem Register“; gemeint ist offenbar die genealogische Erfassung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Φαρές
  choice: Phares
  rationale: Der Name wird nach der griechischen Hauptquelle wiedergegeben. Die hebräische Parallelstelle bietet dagegen Parosch.
- source_word: Ζαχαρίας
  choice: Sacharja
  rationale: Die im modernen deutschen Bibelgebrauch geläufige Form des Namens; sie entspricht dem griechischen Ζαχαρίας und dem hebräischen Parallelzeugen.
- source_word: μετʼ αὐτοῦ
  choice: mit ihm
  rationale: Direkte und natürliche Wiedergabe der Begleitung.
- source_word: ἀπὸ γραφῆς
  choice: laut dem Verzeichnis
  rationale: Die Wendung bezeichnet hier einen schriftlichen Nachweis beziehungsweise eine registrierte Aufstellung. „Verzeichnis“ wahrt den Bezug zum Schriftstück, ohne den griechischen Ausdruck vorschnell ausschließlich als Stammbaum zu bestimmen.
- source_word: ἄνδρες
  choice: Männer
  rationale: Das griechische Wort bezeichnet ausdrücklich Männer; auch die hebräische Parallelstelle spricht von männlichen Personen.
- source_word: ἑκατὸν πεντήκοντα
  choice: '150'
  rationale: Klare, moderne Wiedergabe der Kardinalzahl.
