base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/060.yaml
  text: And the priests and the Levites who had received the silver and the gold and the vessels brought them to Jerusalem, into the temple of the Lord.
translation:
  language: de
  text: Und die Priester und die Leviten, die das Silber, das Gold und die Gefäße in Empfang genommen hatten, brachten sie in Jerusalem in den Tempel des Herrn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die hebräische Parallele lautet: „um sie nach Jerusalem zum Haus unseres Gottes zu bringen“. Der griechische Text von 1 Esdras hat dagegen: „brachten sie … in den Tempel des Herrn“.'
    reason: alternative_reading
lexical_decisions:
- source_word: παραλαβόντες
  choice: in Empfang genommen hatten
  rationale: Das Aoristpartizip bezeichnet die vorausgehende Übernahme der anvertrauten Gegenstände; die Formulierung macht die zeitliche Abfolge im Deutschen natürlich deutlich.
- source_word: οἱ ἱερεῖς καὶ οἱ Λευεῖται
  choice: die Priester und die Leviten
  rationale: Die beiden bestimmten Artikel kennzeichnen zwei anerkannte Gruppen des Tempelpersonals und werden im Deutschen entsprechend wiedergegeben.
- source_word: τὸ ἀργύριον καὶ τὸ χρυσίον
  choice: das Silber, das Gold
  rationale: Der griechische Text nennt ausdrücklich die Metalle; auch die hebräische Parallele bestätigt diese Bedeutung.
- source_word: τὰ σκεύη
  choice: die Gefäße
  rationale: Im Tempelzusammenhang ist „Gefäße“ eine geläufige, hinreichend weite Bezeichnung für die heiligen Geräte und Behältnisse.
- source_word: ἤνεγκαν
  choice: brachten
  rationale: Dies gibt die Bewegung zum Ziel knapp und natürlich wieder, ohne die Art des Transports näher festzulegen.
- source_word: ἐν Ἰερουσαλήμ
  choice: nach Jerusalem
  rationale: Obwohl ἐν gewöhnlich „in“ bedeutet, legt der Bewegungskontext hier Jerusalem als Ziel nahe; die hebräische Parallele formuliert ausdrücklich „nach Jerusalem zu bringen“.
- source_word: εἰς τὸ ἱερὸν τοῦ κυρίου
  choice: in den Tempel des Herrn
  rationale: ἱερόν bezeichnet hier den Tempel beziehungsweise Tempelbezirk; εἰς wird richtungsbezogen mit „in“ wiedergegeben, und κυρίου entsprechend dem griechischen Hauptzeugen als „des Herrn“.
theological_decisions:
- issue: Gottesbezeichnung κυρίου
  choice: des Herrn
  alternative: unseres Gottes
  rationale: Der griechische Haupttext lautet „Tempel des Herrn“, während die hebräische Parallele „Haus unseres Gottes“ bietet. Der Haupttext folgt dem Griechischen; die abweichende Lesart wird in der Fußnote transparent bewahrt.
- issue: Verhältnis von Jerusalem und Tempel als Zielangaben
  choice: nach Jerusalem in den Tempel
  alternative: in Jerusalem in den Tempel
  rationale: Die Formulierung wahrt die im überlieferten griechischen Satz angelegte Bewegung in den Tempel und berücksichtigt zugleich die zielgerichtete Fassung der hebräischen Parallele, ohne beide Angaben gegeneinander auszuspielen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „In Empfang genommen hatten“ verdeutlicht die vorausgehende Übernahme der anvertrauten Kostbarkeiten; „Gefäße“ bewahrt den traditionellen kultischen Sinn, ohne unnötig altertümlich zu wirken.
