base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/058.yaml
  text: And I said to them[a], “You also are holy to the Lord, and the vessels are holy, and the silver and the gold are a vow offering to the Lord[b], the Lord of our fathers.”
translation:
  language: de
  text: 'Und ich sagte zu ihnen: »Auch ihr seid dem Herrn heilig, ebenso sind die Geräte heilig; und das Silber und das Gold sind eine Gelübdegabe[a] für den Herrn, den Herrn unserer Väter.[b]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort kann »Gelübde« oder eine aufgrund eines Gelübdes dargebrachte Gabe bedeuten. Im hebräischen Paralleltext steht dagegen »freiwillige Gabe«.
    reason: lexical_alternative
  - marker: b
    text: Der griechische Text lautet »den Herrn unserer Väter«; der hebräische Paralleltext hat »den HERRN, den Gott eurer Väter«.
    reason: textual_variant
lexical_decisions:
- source_word: ἅγιοί
  choice: heilig
  rationale: Bewahrt die unmittelbare kultische und theologische Aussage des griechischen Adjektivs; »geweiht« wäre bereits stärker deutend.
- source_word: τῷ κυρίῳ
  choice: dem Herrn
  rationale: Der Dativ bezeichnet hier Zugehörigkeit beziehungsweise Weihe. Die natürliche deutsche Wendung »dem Herrn heilig« bleibt nahe am Griechischen und am hebräischen Paralleltext.
- source_word: σκεύη
  choice: Geräte
  rationale: Im Tempelzusammenhang sind kultische Gerätschaften gemeint. »Geräte« ist im heutigen Deutsch klarer und natürlicher als »Gefäße«, ohne die Bedeutung unnötig einzuengen.
- source_word: ἀργύριον καὶ τὸ χρυσίον
  choice: das Silber und das Gold
  rationale: Die Paarung bezeichnet die Materialien beziehungsweise die entsprechenden Wertbestände, nicht allgemein Geld.
- source_word: εὐχή
  choice: Gelübdegabe
  rationale: Das griechische Wort bezeichnet hier am ehesten eine aufgrund eines Gelübdes dargebrachte Gabe. Diese Wiedergabe folgt dem primären griechischen Text; die abweichende Nuance des hebräischen Paralleltexts wird in der Fußnote bewahrt.
- source_word: κυρίῳ τῶν πατέρων ἡμῶν
  choice: den Herrn unserer Väter
  rationale: Gibt den vorliegenden griechischen Wortlaut formal und verständlich wieder, ohne die im hebräischen Paralleltext vorhandene Bezeichnung »Gott« in den Haupttext einzutragen.
theological_decisions:
- issue: Bedeutung von εὐχή gegenüber dem hebräischen Parallelwort נְדָבָה
  choice: Gelübdegabe
  alternative: freiwillige Gabe
  rationale: Da der griechische Text die primäre Grundlage ist, bleibt seine Gelübde-Nuance im Haupttext erhalten. Der hebräische Paralleltext bezeugt dagegen eine freiwillige Gabe; diese echte Spannung wird in einer Fußnote offengelegt.
- issue: Abweichender Gottesname am Versende
  choice: den Herrn unserer Väter
  alternative: den Herrn, den Gott eurer Väter
  rationale: Der Haupttext folgt dem griechischen Wortlaut κυρίῳ τῶν πατέρων ἡμῶν einschließlich »unserer«. Die vollere und hinsichtlich des Pronomens abweichende hebräische Lesart wird nicht mit dem Griechischen vermischt, sondern transparent als Variante genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der kultische Ausdruck »heilig« bleibt erhalten; »Geräte« macht den Tempelkontext verständlich. Der Doppelpunkt und die direkte Rede sorgen für einen natürlichen deutschen Satzfluss, während die Wiederholungen des Ausgangstextes weitgehend bewahrt werden.
