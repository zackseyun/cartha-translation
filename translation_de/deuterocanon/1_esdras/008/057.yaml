base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/057.yaml
  text: And he handed over to them[a], after weighing it out, six hundred fifty talents of silver, and silver vessels worth a hundred talents, and a hundred talents of gold, and twenty golden bowls[b], and ten vessels of fine gleaming bronze.
translation:
  language: de
  text: Und nachdem er alles abgewogen hatte, übergab er ihnen[a] sechshundertfünfzig Talente Silber, silberne Gefäße im Gewicht von hundert Talenten, hundert Talente Gold, zwanzig goldene Schalen[b] und zehn Gefäße aus hochwertiger, glänzender Bronze.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der griechische Text weicht hier deutlich vom hebräischen Paralleltext in Esra 8,27 ab. Dort werden zwei Gefäße aus feiner Bronze genannt und für die goldenen Schalen wird ein Wert angegeben. Da 1 Esdras hier nach dem griechischen Text übersetzt wird, folgt der Haupttext dessen Aufzählung.
    reason: textual_variant
  - marker: b
    text: 'Vielleicht auch: „zwanzig goldene Gegenstände“. Das griechische Wort ist selten; der hebräische Paralleltext stützt die Deutung als Schalen oder Becken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρέδωκεν
  choice: übergab
  rationale: Bezeichnet hier sachlich die Übergabe der Tempelschätze an die Empfänger und entspricht dem formellen Inventarkontext.
- source_word: στήσας
  choice: nachdem er alles abgewogen hatte
  rationale: Das Partizip bezeichnet im Zusammenhang mit den genannten Metallgewichten am ehesten das vorherige Abwiegen; „alles“ macht den nicht ausdrücklich genannten Gegenstand im Deutschen verständlich.
- source_word: τάλαντα ἀργυρίου ἑξακόσια πεντήκοντα
  choice: sechshundertfünfzig Talente Silber
  rationale: Die antike Gewichtseinheit bleibt erhalten; eine moderne Umrechnung würde eine nicht belegte Genauigkeit vortäuschen.
- source_word: σκεύη ἀργυρᾶ ταλάντων ἑκατόν
  choice: silberne Gefäße im Gewicht von hundert Talenten
  rationale: Der griechische Genitiv der Gewichtsangabe wird ausdrücklich als Gewicht wiedergegeben, statt mehrdeutig einen Geldwert zu unterstellen.
- source_word: χρυσίου ταλάντων ἑκατόν
  choice: hundert Talente Gold
  rationale: Direkte und natürliche Wiedergabe der Mengenangabe.
- source_word: χρυσώματα
  choice: goldene Schalen
  rationale: Das seltene Wort ist nicht völlig eindeutig; der hebräische Paralleltext stützt jedoch die Deutung als Schalen oder Becken. Die Unsicherheit wird in einer Fußnote offengelegt.
- source_word: σκεύη χαλκᾶ ἀπὸ χαλκοῦ χρηστοῦ στίλβοντα
  choice: Gefäße aus hochwertiger, glänzender Bronze
  rationale: Bewahrt Material, Güte und Glanz der Gefäße in idiomatischem Deutsch, ohne die griechische Wiederholung von „Bronze“ unnötig nachzubilden.
- source_word: δέκα
  choice: zehn
  rationale: Direkte Wiedergabe der griechischen Zahl, auch wenn der hebräische Paralleltext abweicht.
