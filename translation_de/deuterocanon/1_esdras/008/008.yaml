  naturalness: „Vorleser im Gesetz“ ist im modernen Standarddeutsch weder die natürliche noch die präzise Verbindung. „Vorleser des Gesetzes des Herrn“ ist idiomatisch und bewahrt die griechische, gegenüber dem hebräischen Paralleltext abweichende Amtsbezeichnung. Die übrige Überschriftsformulierung ist als bewusst geglättete Wiedergabe der schwierigen Vorlage verständlich.
