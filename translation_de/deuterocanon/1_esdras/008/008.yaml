base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/008.yaml
  text: A copy of the document presented by King Artaxerxes to Ezra the priest and reader of the law of the Lord is set out below:[a][b]
translation:
  language: de
  text: Eine Abschrift des Schreibens, das König Artaxerxes Esra, dem Priester und Vorleser des Gesetzes des Herrn, übergab, folgt:[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Griechischen steht „Vorleser des Gesetzes des Herrn“. Der hebräische Paralleltext in Esra 7,11 bezeichnet Esra dagegen als „Schriftgelehrten“.
    reason: alternative_reading
  - marker: b
    text: Die griechische Formulierung dieser Überschrift ist etwas schwerfällig. Gemeint ist, dass im Folgenden eine Abschrift des königlichen Schreibens an Esra wiedergegeben wird.
    reason: textual_variant
lexical_decisions:
- source_word: Προσπεσόντος
  choice: übergab
  rationale: Die überlieferte griechische Formulierung ist schwierig. Im Zusammenhang einer dokumentarischen Überschrift gibt „übergab“ den Vorgang verständlich wieder, ohne eine präzisere, im Wortlaut nicht sicher erkennbare Art der Übermittlung festzulegen.
- source_word: παρὰ Ἀρταξέρξου βασιλέως
  choice: König Artaxerxes
  rationale: παρά mit dem Genitiv bezeichnet hier die königliche Herkunft des Schreibens; im deutschen Satz wird dies durch das Subjekt „König Artaxerxes“ ausgedrückt.
- source_word: πρὸς Ἔσραν
  choice: dem … Esra
  rationale: πρός bezeichnet im dokumentarischen Zusammenhang den Adressaten; der deutsche Dativ nach „übergab“ gibt diese Richtung natürlich wieder.
- source_word: τὸν ἱερέα
  choice: dem Priester
  rationale: Die Amtsbezeichnung wird unmittelbar und formal wiedergegeben.
- source_word: ἀναγνώστην τοῦ νόμου Κυρίου
  choice: dem Vorleser im Gesetz des Herrn
  rationale: ἀναγνώστης bezeichnet wörtlich einen Leser oder Vorleser. „Vorleser“ bewahrt die besondere Lesart des griechischen Zeugen und vermeidet eine Angleichung an „Schriftgelehrter“ im hebräischen Paralleltext.
- source_word: Κυρίου
  choice: des Herrn
  rationale: Die traditionelle und im modernen Standarddeutsch verständliche Wiedergabe für κύριος, wenn damit der Gott Israels bezeichnet wird.
- source_word: ἀντίγραφον
  choice: Abschrift
  rationale: „Abschrift“ ist ein präziser und natürlicher deutscher Ausdruck für die dokumentarische Kopie eines Schreibens.
- source_word: τὸ ὑποκείμενον
  choice: folgt hier
  rationale: Wörtlich ist das darunter oder nachfolgend Stehende gemeint. „Folgt hier“ entspricht der Funktion als Überschrift und ist im Deutschen idiomatisch.
theological_decisions:
- issue: Verhältnis der griechischen Amtsbezeichnung zum hebräischen Paralleltext in Esra 7,11
  choice: Die griechische Bezeichnung „Vorleser im Gesetz des Herrn“ bleibt im Haupttext erhalten.
  alternative: „Schriftgelehrter im Gesetz des Herrn“ oder „Schriftgelehrter im Gesetz des Gottes des Himmels“
  rationale: Für 1 Esdras ist der griechische Text die primäre Quelle. Die abweichende Bezeichnung des hebräischen Paralleltexts darf daher nicht in den Haupttext eingetragen werden, wird aber wegen ihrer textgeschichtlichen Bedeutung in einer Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die dokumentarische Überschrift wird natürlich formuliert, während die eigenständige griechische Amtsbezeichnung „Vorleser“ bewusst erhalten bleibt.
