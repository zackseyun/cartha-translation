base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/010.yaml
  text: And having judged what is humane[a], I ordered that those of the nation of the Jews who are willing, and of their own choice, and the priests and the Levites and these others in our kingdom[b], should go with you to Jerusalem.
translation:
  language: de
  text: Nachdem ich ein menschenfreundliches Vorgehen für richtig befunden hatte, ordnete ich an, dass diejenigen aus dem Volk der Juden, die willens sind und sich freiwillig dafür entscheiden[a], ebenso die Priester, die Leviten und diese hier in unserem Königreich mit dir nach Jerusalem ziehen sollen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die seltene griechische Form kann auch im Sinn von „die selbst wählen“ verstanden werden; zusammen mit „willens sind“ unterstreicht sie vermutlich die freiwillige Teilnahme.
    reason: lexical_alternative
  - marker: b
    text: Die überlieferte hebräische Parallele hat an dieser Stelle einen erheblich anderen Wortlaut über Esras Hinwendung zum Gesetz des HERRN. Hier wird dem griechischen Text von 1 Esdras gefolgt.
    reason: textual_variant
lexical_decisions:
- source_word: τὰ φιλάνθρωπα
  choice: das Menschenfreundliche
  rationale: Das substantivierte Neutrum Plural bezeichnet ein menschenfreundliches oder wohlwollendes Vorgehen. Die Wiedergabe wahrt den moralischen Gehalt, ohne ihn zu einer konkreteren Aussage wie „was mir gut erschien“ auszuweiten.
- source_word: κρίνας
  choice: da ich ... für richtig hielt
  rationale: Das Aoristpartizip beschreibt die vorausgehende abwägende Entscheidung des Königs. Die deutsche Formulierung ist idiomatischer als „nachdem ich geurteilt hatte“, bewahrt aber den deliberativen Sinn.
- source_word: προσέταξα
  choice: ordnete ich an
  rationale: Die Wendung gibt eine verbindliche königliche Anweisung in natürlichem modernem Deutsch wieder.
- source_word: τοὺς βουλομένους
  choice: die dazu bereit sind
  rationale: Das Partizip bezeichnet Personen, die willens sind, und betont damit die Freiwilligkeit der Teilnahme.
- source_word: αἱρετίζοντας
  choice: sich aus freiem Entschluss entscheiden
  rationale: Die seltene Form scheint das freiwillige Wählen oder Sichentscheiden zusätzlich hervorzuheben. Die eigenständige Wiedergabe bewahrt diese auffällige Doppelung mit βουλομένους.
- source_word: ἐκ τοῦ ἔθνους τῶν Ἰουδαίων
  choice: aus dem Volk der Juden
  rationale: ἔθνος bezeichnet hier die Volksgemeinschaft. „Volk der Juden“ entspricht dem formellen Ton, ohne das im heutigen Deutsch missverständliche „Nation“ zu erzwingen.
- source_word: τῶν ἱερέων καὶ τῶν Λευειτῶν
  choice: die Priester und die Leviten
  rationale: Die kultischen Gruppenbezeichnungen werden in ihrer geläufigen deutschen Form wiedergegeben; der Satzbau behandelt sie entsprechend dem griechischen Reihungsgefüge als weitere Genannte.
- source_word: τῶνδε
  choice: diese hier
  rationale: Das Demonstrativpronomen ist im Griechischen unvermittelt und elliptisch. „Diese hier“ erhält seinen deiktischen und etwas abrupten Charakter, statt eine nicht ausdrücklich bezeichnete Personengruppe zu ergänzen.
- source_word: συμπορεύεσθαί σοι
  choice: mit dir ... ziehen sollen
  rationale: Der Infinitiv bezeichnet gemeinsames Reisen beziehungsweise Begleiten; „mit dir ziehen“ passt zum Reiseweg nach Jerusalem und zum würdigen Erzählregister.
theological_decisions:
- issue: Stark abweichende masoretische Parallelüberlieferung
  choice: Der Haupttext folgt dem griechischen königlichen Erlass und erwähnt die textliche Abweichung in einer Fußnote.
  alternative: Den griechischen Wortlaut durch die hebräische Aussage ersetzen, dass Esra sein Herz darauf richtete, das Gesetz des HERRN zu erforschen, zu tun und zu lehren.
  rationale: Der vorgelegte griechische Text ist für 1 Esdras die maßgebliche Ausgangsquelle und enthält eindeutig eine königliche Reisegenehmigung. Die erheblich abweichende hebräische Parallele darf daher nicht harmonisierend in den Haupttext eingetragen werden.
- issue: Freiwilligkeit der Mitreisenden
  choice: Sowohl βουλομένους als auch das seltene αἱρετίζοντας werden wiedergegeben.
  alternative: Nur allgemein „die mitreisen wollen“ zu übersetzen.
  rationale: Die griechische Doppelung hebt offenbar die freie Entscheidung hervor. Sie wird bewahrt, ohne daraus eine weitergehende theologische Lehre über den menschlichen Willen abzuleiten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht formellem Verwaltungston. Die ungewöhnliche Reihung des griechischen Satzes und das abrupte „diese hier“ bleiben erkennbar, werden aber so geglättet, dass der Vers für heutige Leser verständlich bleibt.
