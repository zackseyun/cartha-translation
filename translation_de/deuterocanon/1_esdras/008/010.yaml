  naturalness: „Das Menschenfreundliche“ wirkt im modernen Deutsch unnötig abstrakt und nominalisiert; „ein menschenfreundliches Vorgehen“ ist idiomatischer. „Sich aus freiem Entschluss entscheiden“ lässt offen, wofür die Entscheidung erfolgt; „sich freiwillig dafür entscheiden“ stellt den erforderlichen Bezug zur anschließenden Reise her. „Willens sind“ wahrt zugleich den gehobenen Verwaltungston.
  terminology: „Volk der Juden“, „Priester“, „Leviten“, „Königreich“ und „Jerusalem“ sind angemessen. „Menschenfreundlich“ gibt φιλάνθρωπα ohne konfessionelle oder überdeutende Färbung wieder. Die Gottesbezeichnung in der Variantenfußnote betrifft ausschließlich die abweichende hebräische Parallelüberlieferung und wird nicht in den griechischen Haupttext eingetragen.
