base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/086.yaml
  text: Were you not angry with us[a], to destroy us, leaving no root or seed or name of ours?
translation:
  language: de
  text: Warst du nicht zornig auf uns, um uns zu vernichten, bis keine Wurzel, kein Same und kein Name von uns übrig bliebe?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder sinngemäßer: »… bis von uns kein Überrest, keine Nachkommenschaft und kein Name mehr übrig bliebe.« Wörtlich steht im Griechischen: »Wurzel und Same und Name«.'
    reason: Erläutert die übertragene Bedeutung der wörtlich beibehaltenen Bildwörter, ohne den griechischen Ausdruck im Haupttext zu interpretieren.
lexical_decisions:
- source_word: οὐχὶ
  choice: Warst du nicht
  rationale: Die rhetorische Frage erwartet Zustimmung; die deutsche Frageform bewahrt diese Wirkung, ohne ein verstärkendes »gewiss« hinzuzufügen.
- source_word: ὠργίσθης ἡμῖν
  choice: warst du zornig auf uns
  rationale: Die Verbindung aus dem Verb des Zornigseins und dem Dativ wird im modernen Deutschen natürlich mit »zornig auf uns« wiedergegeben.
- source_word: ἀπολέσαι ἡμᾶς
  choice: um uns zu vernichten
  rationale: Der Infinitiv wird als Ziel beziehungsweise Folge des Zorns eng am griechischen Satzbau wiedergegeben; »vernichten« erhält die umfassende Gerichtssprache.
- source_word: ἕως τοῦ μὴ καταλιπεῖν
  choice: und keine … übrig zu lassen
  rationale: Die Wendung bezeichnet den äußersten Endpunkt der Vernichtung. Die koordinierte Infinitivkonstruktion klingt im Deutschen natürlicher als eine wörtliche Formulierung mit »bis zum Nicht-Übriglassen«.
- source_word: ῥίζαν καὶ σπέρμα καὶ ὄνομα
  choice: Wurzel, Samen und Namen
  rationale: Die konkrete dreigliedrige Bildsprache wird beibehalten. »Samen« kann hier die fortbestehende Nachkommenschaft bezeichnen, während »Name« die bleibende Identität umfasst.
- source_word: ἡμῶν
  choice: von uns
  rationale: Die nachgestellte Genitivangabe bezieht sich auf alle drei Glieder und wird entsprechend nach der gesamten Reihe platziert.
theological_decisions:
- issue: Reichweite der Vernichtung in der rhetorischen Frage
  choice: Die konkrete Reihe »Wurzel, Samen und Namen« bleibt stehen und beschreibt die Vernichtung bis zum völligen Verlust von Fortbestand und Identität.
  alternative: Die Bilder könnten deutend als »Überrest, Nachkommenschaft und Name« wiedergegeben werden.
  rationale: Der griechische Text nennt keinen abstrakten »Überrest«, sondern bewahrt die Spannung durch seine konkrete Bildsprache. Die Übersetzung macht die theologische Folgerung daher nicht ausdrücklicher als die Vorlage.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Formulierung bleibt nahe an der griechischen Infinitivstruktur, vermeidet jedoch unnatürliche Nominalkonstruktionen. Die dreifache Verneinung mit wiederholtem »keine/keinen« unterstreicht die Totalität, ohne zusätzliche Lehrbegriffe einzuführen.
