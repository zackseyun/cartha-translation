base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/051.yaml
  text: to seek from him a prosperous journey for us and for our children and livestock[a].
translation:
  language: de
  text: um von ihm eine gute Reise für uns, unsere Kinder und unser Vieh zu erbitten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „gutes Vorankommen auf dem Weg“, „eine erfolgreiche Reise“ oder „eine sichere Reise“. Das griechische Wort bezeichnet einen günstigen Verlauf der Reise; im parallelen hebräischen Kontext ist auch von Hilfe gegenüber Feinden auf dem Weg die Rede.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ζητῆσαι
  choice: zu erbitten
  rationale: Das Verb kann „suchen“ oder im Zusammenhang einer Bitte „erbitten“ bedeuten. Hier gibt „erbitten“ die an Gott gerichtete Bitte im natürlichen modernen Deutsch wieder.
- source_word: παρʼ αὐτοῦ
  choice: von ihm
  rationale: παρά mit dem Genitiv bezeichnet bei ζητῆσαι die Person, von der das Erbetene erwartet wird.
- source_word: εὐοδίαν
  choice: eine gute Reise
  rationale: Das Substantiv bezeichnet günstiges Vorankommen beziehungsweise Gelingen auf einem Weg. „Eine gute Reise“ wahrt die Breite des Ausdrucks, ohne ihn ausschließlich auf Sicherheit zu verengen.
- source_word: ἡμῖν τε καὶ τοῖς τέκνοις ἡμῶν καὶ κτήνεσιν
  choice: für uns, unsere Kinder und unser Vieh
  rationale: τέκνα bezeichnet allgemein Kinder; κτήνη meint gehaltene Nutz- oder Lasttiere. „Vieh“ ist hier knapp, verständlich und dem Kontext einer Reisegemeinschaft angemessen.
theological_decisions:
- issue: Bedeutungsumfang der von Gott erbetenen Begünstigung der Reise
  choice: eine gute Reise
  alternative: eine sichere Reise; gutes Vorankommen auf dem Weg
  rationale: Der griechische Text spricht allgemein von günstigem Verlauf oder Gelingen der Reise und nennt Schutz nicht ausdrücklich. Der parallele hebräische Kontext erwähnt zwar Hilfe gegenüber Feinden auf dem Weg, doch diese Präzisierung wird nicht in den griechischen Wortlaut hineingetragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz ist als Infinitivsatz wiedergegeben, entsprechend dem vorliegenden griechischen Fragment. „Vieh“ bezeichnet hier die mitgeführten Nutz- und Lasttiere.
