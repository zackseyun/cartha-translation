base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/050.yaml
  text: And there I proclaimed a fast before our Lord for the young men[b][a],
translation:
  language: de
  text: Und dort gelobte ich vor unserem Herrn ein Fasten für die jungen Männer.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das griechische Verb bedeutet gewöhnlich „ich betete“ oder „ich gelobte“; seine genaue Bedeutung in dieser Verbindung ist unsicher. Der hebräische Paralleltext lautet dagegen: „Und dort rief ich ein Fasten aus … vor unserem Gott.“ Dies erklärt möglicherweise die abweichende Formulierung des Paralleltexts, kann die griechische Lesart jedoch nicht ersetzen.'
    reason: alternative_reading
  - marker: b
    text: 'Der hebräische Paralleltext zu Esra 8,21 enthält weitere Angaben, die in dieser griechischen Zeile fehlen: Das Fasten wird am Fluss Ahawa ausgerufen, damit sie sich vor Gott demütigen und ihn um einen geraden Weg für sich, ihre Kinder und ihren ganzen Besitz bitten.'
    reason: cross_reference
lexical_decisions:
- source_word: εὐξάμην
  choice: rief … aus
  rationale: Das griechische Verb bedeutet gewöhnlich „beten“ oder „geloben“, ist mit νηστείαν als direktem Objekt jedoch auffällig. Der hebräische Paralleltext hat וָאֶקְרָא („ich rief aus“) und erklärt wahrscheinlich den hier gemeinten Sinn. Die wörtlicheren griechischen Möglichkeiten werden in Fußnote [a] bewahrt.
- source_word: ἐκεῖ
  choice: dort
  rationale: Natürliche und genaue Wiedergabe des Ortsadverbs.
- source_word: νηστείαν
  choice: ein Fasten
  rationale: Als Gegenstand von „ausrufen“ idiomatisch und durch das hebräische צוֹם gestützt.
- source_word: τοῖς νεανίσκοις
  choice: für die jungen Männer
  rationale: Bewahrt das im griechischen Primärtext vorhandene Dativglied. „Junge Männer“ gibt νεανίσκοις direkt und modern wieder, ohne es mit dem im Hebräischen folgenden Hinweis auf die Kinder gleichzusetzen.
- source_word: ἔναντι
  choice: vor
  rationale: Knappes, idiomatisches Deutsch für „vor / in Gegenwart von“.
- source_word: κυρίου ἡμῶν
  choice: unserem Herrn
  rationale: Folgt dem griechischen Primärtext; der hebräische Paralleltext liest dagegen „unserem Gott“.
theological_decisions:
- issue: Abweichung zwischen griechischem Verb und hebräischem Paralleltext
  choice: εὐξάμην kontextuell mit „rief … aus“ wiedergeben
  alternative: „betete“ oder „gelobte“
  rationale: Eine rein lexikalische Wiedergabe des griechischen Verbs ergibt mit „ein Fasten“ eine ungewöhnliche Formulierung. Der hebräische Paralleltext bietet die kohärente Wendung „ein Fasten ausrufen“. Die echte Spannung zwischen den Zeugen wird nicht verschwiegen, sondern in Fußnote [a] offengelegt.
- issue: Gottesbezeichnung
  choice: „unserem Herrn“
  alternative: „unserem Gott“
  rationale: κύριος ἡμῶν ist als Lesart des griechischen Primärtextes maßgeblich. Die abweichende hebräische Gottesbezeichnung wird in Fußnote [a] genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung hält „vor unserem Herrn“ nahe beim Fasten und bewahrt zugleich das griechische „für die jungen Männer“. Die Textabweichungen werden in den Fußnoten transparent gemacht.
