  text: And when these things had been completed, the leaders came to me, saying,
translation:
  language: de
  text: 'Als dies abgeschlossen war, kamen die führenden Männer zu mir und sagten:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τούτων τελεσθέντων
  choice: Als dies abgeschlossen war
  rationale: Der Genitivus absolutus bezeichnet eine zuvor vollendete Handlung. „Als dies abgeschlossen war“ ist natürliches modernes Deutsch und bewahrt den Abschlussaspekt von τελέω.
- source_word: προσηλθόσαν μοι
  choice: kamen ... zu mir
  rationale: προσέρχομαι mit dem Dativ μοι bedeutet hier, dass sich die betreffenden Personen dem Sprecher näherten; „kamen zu mir“ gibt dies idiomatisch wieder.
- source_word: οἱ ἡγούμενοι
  choice: die führenden Männer
  rationale: Das substantivierte Partizip bezeichnet Personen in leitender Stellung, ohne zwingend ein bestimmtes Amt zu benennen. „Die führenden Männer“ wahrt diesen Sinn und passt zum historischen Erzählkontext.
- source_word: λέγοντες
  choice: und sagten
  rationale: Das präsentische Partizip leitet die im folgenden Vers fortgesetzte direkte Rede ein. Im Deutschen ist die koordinierte finite Form natürlicher als „sagend“, während der Doppelpunkt die Fortsetzung signalisiert.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung bleibt eng am griechischen Hauptzeugen; der nur näherungsweise zugeordnete masoretische Paralleltext bietet für diesen Satz keine belastbare Übersetzungshilfe.
