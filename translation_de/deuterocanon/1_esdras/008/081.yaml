lexical_decisions:
- source_word: καὶ νῦν
  choice: Und nun
  rationale: Bewahrt sowohl die verbindende Konjunktion als auch den zeitlichen Übergang, ohne eine stärkere Folgerung wie „darum“ einzutragen.
- source_word: τὰς θυγατέρας ὑμῶν
  choice: eure Töchter
  rationale: Direkte und natürliche Wiedergabe der bestimmten Nominalphrase mit Possessivpronomen.
- source_word: μὴ συνοικίσητε
  choice: verheiratet ... nicht
  rationale: Das kausative συνοικίζω bezeichnet hier, Töchter und Söhne als Ehepartner zusammenzubringen. „Verheiraten“ gibt den sozialen und rechtlichen Sinn im heutigen Deutsch knapp und verständlich wieder.
- source_word: τοῖς υἱοῖς αὐτῶν
  choice: mit ihren Söhnen
  rationale: Beim deutschen Verb „verheiraten“ bezeichnet „mit“ idiomatisch den jeweiligen Ehepartner; „ihren“ verweist wie im Griechischen auf die zuvor genannten Völker.
theological_decisions:
- issue: Formulierung des Verbots der Heirat
  choice: verheiratet eure Töchter nicht mit ihren Söhnen
  alternative: lasst eure Töchter nicht mit ihren Söhnen als Ehefrauen zusammenleben
  rationale: Die gewählte Fassung wahrt die im Griechischen ausgedrückte Veranlassung einer ehelichen Verbindung, ohne zusätzliche Erläuterungen oder konfessionelle Deutungen einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Imperativ im Plural und die familiären Bezeichnungen bleiben ausdrücklich erhalten; die Fußnote macht die konkrete Grundbedeutung des Verbs sichtbar.
