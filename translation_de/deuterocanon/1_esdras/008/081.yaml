base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/081.yaml
  text: And now do not give your daughters in marriage to their sons,[a]
translation:
  language: de
  text: Und nun verheiratet eure Töchter nicht mit ihren Söhnen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Verbindet eure Töchter nicht durch Heirat mit ihren Söhnen.“'
