base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/069.yaml
  text: And all who were ever stirred by the word of the Lord[a], the God of Israel, gathered to me while I was mourning over the lawlessness, and I sat grieved until the evening sacrifice.
translation:
  language: de
  text: Da versammelten sich bei mir alle, die jemals durch das Wort des Herrn Israels[a] bewegt worden waren, während ich über die Gesetzlosigkeit trauerte. Und ich saß tief bekümmert da bis zum Abendopfer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „des Herrn Israels“. Möglich ist auch die Deutung: „des Herrn, des Gottes Israels“.'
    reason: Der griechische Ausdruck ist knapp und kann als Titel „Herr Israels“ verstanden werden; eine geläufige biblische Formulierung legt alternativ die ergänzende Deutung „Gott Israels“ nahe.
lexical_decisions:
- source_word: ἐπισυνήχθησαν πρὸς μέ
  choice: Da versammelten sich bei mir
  rationale: Das Verb bezeichnet das Zusammenkommen einer Gruppe; „bei mir“ gibt die Bewegung zu Esra in natürlichem Deutsch wieder.
- source_word: ὅσοι ποτὲ ἐπεκινοῦντο
  choice: alle, die sich je … aufrütteln ließen
  rationale: Die Form beschreibt Menschen, die innerlich bewegt oder aufgerüttelt wurden. Die reflexive Wendung klingt im Deutschen natürlich und bewahrt den Gedanken ihrer empfänglichen Reaktion.
- source_word: τῷ ῥήματι Κυρίου τοῦ Ἰσραήλ
  choice: durch das Wort des Herrn Israels
  rationale: Dies folgt dem überlieferten griechischen Wortlaut, ohne die im Text nicht ausdrücklich vorhandene Bezeichnung „Gott“ stillschweigend einzufügen. Eine mögliche idiomatische Deutung wird in der Fußnote genannt.
- source_word: ἐμοῦ πενθοῦντος ἐπὶ τῇ ἀνομίᾳ
  choice: während ich über die Gesetzlosigkeit trauerte
  rationale: Der Genitivus absolutus bezeichnet eine gleichzeitige Handlung. „Gesetzlosigkeit“ gibt ἀνομία transparent als Missachtung des göttlichen Gesetzes wieder.
- source_word: ἐκαθήμην περίλυπος
  choice: ich saß tief bekümmert da
  rationale: Die Wiedergabe bewahrt sowohl die sitzende Haltung als auch den starken, anhaltenden Kummer.
- source_word: ἕως τῆς δειλινῆς θυσίας
  choice: bis zum Abendopfer
  rationale: „Abendopfer“ ist die klare und gebräuchliche Bezeichnung für das regelmäßige Opfer am Abend.
theological_decisions:
- issue: Wiedergabe von κύριος
  choice: Herr
  alternative: HERR
  rationale: „Herr“ entspricht dem griechischen κύριος und vermeidet es, den hebräischen Gottesnamen in einen griechischen Text einzutragen.
- issue: Deutung von Κυρίου τοῦ Ἰσραήλ
  choice: des Herrn Israels
  alternative: des Herrn, des Gottes Israels
  rationale: Der Haupttext folgt der formal möglichen und unmittelbar bezeugten Lesart „Herr Israels“. Die erweiterte Deutung ist aufgrund geläufiger biblischer Titelformeln möglich, setzt aber ein im erhaltenen griechischen Wortlaut nicht stehendes „Gott“ voraus und wird deshalb nur in der Fußnote angegeben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau wurde zur besseren Lesbarkeit in zwei Sätze gegliedert; die starke Trauer und der kultische Bezug des Abendopfers bleiben erhalten.
