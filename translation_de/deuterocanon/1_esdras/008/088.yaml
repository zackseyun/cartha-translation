base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/088.yaml
  text: Look, we are before you in our lawless deeds, for it is no longer possible to stand before you because of these things.
translation:
  language: de
  text: Sieh, wir sind mit unseren Verfehlungen vor dir,[a] denn ihretwegen können wir nicht länger vor dir bestehen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: »in unseren gesetzlosen Taten«. Das griechische Wort bezeichnet Gesetzesübertretungen und kann je nach Zusammenhang auch die daraus entstandene Schuld meinen.'
    reason: lexical_alternative
  - marker: b
    text: 'Die hebräische Parallele in Esra 9,14 formuliert die Krise anders: Sie spricht von Gottes Zorn und davon, dass kein Rest und kein Entrinnen bleiben könnte. 1 Esdras sagt hier, dass man wegen dieser Sünden nicht länger vor Gott bestehen kann.'
    reason: cross_reference
lexical_decisions:
- source_word: ἰδοὺ
  choice: Sieh
  rationale: Bewahrt den nachdrücklichen, hinweisenden Auftakt in natürlichem, würdigem Deutsch.
- source_word: ἐσμὲν ἐνώπιόν σου
  choice: wir stehen vor dir
  rationale: Gibt die Gegenwart vor Gott idiomatisch wieder; die Wiederaufnahme von „stehen/bestehen“ bildet zugleich den Zusammenhang mit στῆναι ab, ohne eine Ortsangabe zu überdehnen.
- source_word: ἐν ταῖς ἀνομίαις ἡμῶν
  choice: mit unseren Verfehlungen
  rationale: Bezeichnet verständlich sowohl die gesetzwidrigen Taten als auch die dadurch geprägte schuldhafte Lage vor Gott; die mögliche Wiedergabe „in unserer Gesetzlosigkeit“ bleibt in der Fußnote erhalten.
- source_word: οὐ γάρ ἐστιν στῆναι ἔτι
  choice: denn … können wir nicht länger … bestehen
  rationale: Das unpersönliche griechische Gefüge wird natürlich deutsch wiedergegeben. „Bestehen“ wahrt den gerichtlichen Sinn des Standhaltens vor Gott.
- source_word: ἔμπροσθέν σου
  choice: vor dir
  rationale: Bewahrt die unmittelbare Ausrichtung auf Gott und den feierlich-gerichtlichen Kontext.
- source_word: ἐπὶ τούτοις
  choice: ihretwegen
  rationale: Gibt den im Kontext naheliegenden kausalen Sinn knapp wieder und bezieht sich auf die zuvor genannten Verfehlungen.
theological_decisions:
- issue: Bedeutung von ἀνομίαις im Sündenbekenntnis
  choice: mit unseren Verfehlungen
  alternative: in unserer Gesetzlosigkeit / in unseren gesetzlosen Taten
  rationale: „Verfehlungen“ ist für heutige Leser verständlich und umfasst Taten wie Schuldzustand, ohne eine engere dogmatische Deutung einzutragen. Die gesetzesbezogene Nuance wird in der Fußnote kenntlich gemacht.
- issue: Abweichung von der hebräischen Parallele in Esra 9,14
  choice: Die Aussage des griechischen Textes über das Nicht-bestehen-Können vor Gott bleibt maßgeblich.
  alternative: Erweiterung um Gottes Zorn und die Vernichtung des Überrests nach der hebräischen Parallele
  rationale: Für 1 Esdras ist hier der griechische Text die primäre Grundlage. Die hebräische Parallele beschreibt die Krise anders und darf den griechischen Wortlaut nicht ersetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Sieh“ trägt den Nachdruck von ἰδοὺ, ohne das altertümlichere „Siehe“. Die Kombination „vor dir stehen“ und „vor dir bestehen“ erhält die Wiederholung im Griechischen und macht zugleich den gerichtlichen Ernst idiomatisch deutlich.
