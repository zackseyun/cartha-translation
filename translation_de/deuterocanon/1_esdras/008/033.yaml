  text: 'From the sons of Lam: Esias son of Gotholias[a], and with him seventy men.'
translation:
  language: de
  text: 'Von den Nachkommen Lams: Esias, Sohn des Gotholias, und mit ihm siebzig Männer.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκ τῶν υἱῶν
  choice: Von den Nachkommen
  rationale: Die Wendung leitet in der Liste eine Familien- oder Sippenzugehörigkeit ein. „Nachkommen“ ist im heutigen Deutsch natürlicher als das wörtliche „Söhne“ und bezeichnet hier die betreffende Abstammungsgruppe.
- source_word: Λάμ
  choice: Lam
  rationale: Der Eigenname wird nach der griechischen Form wiedergegeben und nicht an den abweichenden masoretischen Paralleltext angeglichen.
- source_word: Ἐσίας
  choice: Esias
  rationale: Der Eigenname wird unmittelbar aus dem griechischen Text transliteriert.
- source_word: Γοθολίου
  choice: der Sohn Gotholias’
  rationale: Der bloße Genitiv bezeichnet in dieser Listenformel wahrscheinlich die Abstammung. Die explizite Wiedergabe als Sohnschaft ist im Deutschen klar und natürlich, ohne den griechischen Namensbestand zu harmonisieren.
- source_word: καὶ μετʼ αὐτοῦ
  choice: und mit ihm
  rationale: Direkte und idiomatische Wiedergabe der Begleitung in einer Aufzählung.
- source_word: ἄνδρες ἑβδομήκοντα
  choice: siebzig Männer
  rationale: ἄνδρες bezeichnet hier Männer; die Wortstellung wird dem natürlichen deutschen Ausdruck angepasst.
