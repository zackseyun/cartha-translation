  footnotes:
  - marker: a
    text: 'Der bereitgestellte griechische Text dieses Verses besteht nur aus dem Satzfragment ὑπὸ τοῦ κυρίου ἡμῶν („durch/unserem Herrn zufolge“ bzw. wörtlicher: „durch unseren Herrn“). Der angegebene hebräische Paralleltext stimmt mit dieser Wendung nicht unmittelbar überein; deshalb wurde hier kein vollständigerer Satz rekonstruiert.'
