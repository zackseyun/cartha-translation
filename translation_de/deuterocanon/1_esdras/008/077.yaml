lexical_decisions:
- source_word: ὑπό
  choice: von
  rationale: Mit dem Genitiv bezeichnet ὑπό gewöhnlich den Urheber oder Handelnden. Im isoliert überlieferten Fragment gibt „von“ die mögliche Herkunfts- oder Urheberbeziehung wieder, ohne den fehlenden Satz zu ergänzen.
- source_word: τοῦ κυρίου
  choice: Herrn
  rationale: κύριος wird in diesem wahrscheinlich gebets- oder bekenntnisartigen Zusammenhang würdig und geläufig mit „Herr“ wiedergegeben; der deutsche Kasus folgt der Präposition „von“.
- source_word: ἡμῶν
  choice: unserem
  rationale: Das Possessivpronomen der ersten Person Plural wird ausdrücklich beibehalten und nach „von“ im Dativ wiedergegeben.
theological_decisions:
- issue: Wiedergabe von κύριος
  choice: Herr
  alternative: Gebieter
  rationale: „Herr“ ist die natürliche und etablierte Wiedergabe, während „Gebieter“ die Bedeutung in diesem knappen Kontext unnötig verengen würde.
- issue: Umgang mit der erheblichen Abweichung und dem fragmentarischen griechischen Zeugen
  choice: Nur das vorliegende griechische Satzfragment zurückhaltend übersetzen
  alternative: Aus dem annähernden hebräischen Paralleltext einen vollständigen Satz rekonstruieren
  rationale: Der angegebene griechische Primärtext enthält lediglich ὑπὸ τοῦ κυρίου ἡμῶν; der hebräische Paralleltext entspricht diesem Wortlaut nicht unmittelbar. Deshalb wird kein im griechischen Beleg nicht vorhandener Satz ergänzt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Kleinschreibung am Anfang wahrt den fragmentarischen Charakter des überlieferten Wortlauts; die Fußnote macht die Textunsicherheit transparent.
