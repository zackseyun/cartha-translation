base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/035.yaml
  text: 'From the sons of Joab: Abadias son of Iezelus[a], and with him two hundred twelve men.'
translation:
  language: de
  text: 'Von den Söhnen Joabs: Abadias, der Sohn des Iezelus[a], und mit ihm zweihundertzwölf Männer.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hebräische Paralleltext in Esra 8,12 weicht hier ab: Er nennt einen Nachkommen Elams und siebzig männliche Personen. Da 1 Esdras hier nach dem griechischen Text übersetzt wird, folgt die Übersetzung diesem Wortlaut, ohne ihn an den hebräischen Paralleltext anzugleichen.'
    reason: textual_variant
lexical_decisions:
- source_word: ἐκ τῶν υἱῶν Ἰωάβ
  choice: Von den Söhnen Joabs
  rationale: Die formale Listenform des Griechischen bleibt erhalten; »Söhne« kann hier zugleich Angehörige einer Nachkommenlinie bezeichnen.
- source_word: Ἀβαδίας
  choice: Abadias
  rationale: Der Personenname wird nach der griechischen Form transliteriert und nicht an eine hebräische Namensform angeglichen.
- source_word: Ἰεζήλου
  choice: Iezelus
  rationale: Der griechische Genitiv bezeichnet die Abstammung; im Deutschen wird er mit »der Sohn des Iezelus« natürlich und eindeutig wiedergegeben. Die Namensform folgt dem griechischen Hauptzeugen.
- source_word: καὶ μετʼ αὐτοῦ
  choice: und mit ihm
  rationale: Direkte und im Kontext einer Aufzählung natürliche Wiedergabe.
- source_word: ἄνδρες
  choice: Männer
  rationale: Das griechische ἄνδρες bedeutet hier gewöhnlich »Männer«; die abweichende biologischere Ausdrucksweise des hebräischen Paralleltexts wird nicht eingetragen.
- source_word: διακόσιοι δέκα δύο
  choice: zweihundertzwölf
  rationale: Gibt den Zahlenwert des griechischen Textes in üblicher deutscher Schreibweise wieder.
