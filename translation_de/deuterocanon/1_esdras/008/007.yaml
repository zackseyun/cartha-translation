base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/007.yaml
  text: For Apsaras had great learning[a], so as to leave out nothing from the law of the Lord and from the commandments[b], teaching all Israel the statutes and the judgments.
translation:
  language: de
  text: Denn Apsaras[a] besaß große Gelehrsamkeit, sodass er nichts von dem Gesetz des Herrn und von den Geboten ausließ; er lehrte ganz Israel die Satzungen und die Rechtsbestimmungen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Griechisch: „Apsaras“. Der hebräische Parallelzusammenhang weist auf Esra, doch der hier maßgebliche griechische Text bewahrt den Namen in dieser Form.'
    reason: alternative_reading
  - marker: b
    text: 'Der griechische Wortlaut ist am Ende stark verdichtet; annähernd wörtlich: „… nichts von dem Gesetz des Herrn und von den Geboten auszulassen, ganz Israel, Satzungen und Rechtsbestimmungen“. Die Übersetzung ergänzt „er lehrte“, um den wahrscheinlich gemeinten Sinn verständlich auszudrücken.'
    reason: textual_variant
lexical_decisions:
- source_word: Ἀψάρας
  choice: Apsaras
  rationale: Der Personenname wird nach dem maßgeblichen griechischen Zeugen transliteriert und nicht an den abweichenden hebräischen Parallelzusammenhang angeglichen.
- source_word: πολλὴν ἐπιστήμην περιεῖχεν
  choice: besaß große Gelehrsamkeit
  rationale: ἐπιστήμη bezeichnet hier umfassendes Wissen beziehungsweise gelehrte Kenntnis; περιεῖχεν drückt deren Besitz aus.
- source_word: εἰς τὸ μηδὲν παραλείπειν
  choice: sodass er nichts … ausließ
  rationale: Die Konstruktion kann Zweck oder Folge ausdrücken. „Sodass“ wahrt diese Offenheit hinreichend natürlich; „nichts ausließ“ gibt den umfassenden Sinn von παραλείπειν wieder.
- source_word: τῶν ἐκ τοῦ νόμου Κυρίου καὶ ἐκ τῶν ἐντολῶν
  choice: von dem Gesetz des Herrn und von den Geboten
  rationale: Die wiederholte griechische Präposition wird beibehalten; „Gesetz“, „Herr“ und „Gebote“ entsprechen dem rechtlich-biblischen Register.
- source_word: πάντα τὸν Ἰσραήλ
  choice: ganz Israel
  rationale: Dies ist eine natürliche und zugleich quellnahe Wiedergabe des Akkusativs.
- source_word: δικαιώματα καὶ κρίματα
  choice: die Satzungen und die Rechtsbestimmungen
  rationale: Beide Rechtstermini werden unterschieden wiedergegeben. „Rechtsbestimmungen“ vermeidet das im Deutschen mögliche Missverständnis, κρίματα bezeichne hier einzelne Gerichtsurteile.
theological_decisions:
- issue: Komprimierte Syntax am Versende
  choice: Die abschließenden Rechtstermini werden als Gegenstand dessen verstanden, was Apsaras ganz Israel lehrte; „er lehrte“ wird ausdrücklich ergänzt.
  alternative: 'Eine formal noch engere, aber schwer verständliche Wiedergabe ohne ergänztes Verb: „… nichts … auszulassen, ganz Israel, Satzungen und Rechtsbestimmungen.“'
  rationale: Der überlieferte griechische Satz ist am Ende syntaktisch stark verdichtet. Die Ergänzung schafft einen verständlichen deutschen Satz und gibt die wahrscheinlich gemeinte Unterweisung wieder, ohne die Unsicherheit zu verschweigen.
- issue: Identität des genannten Mannes
  choice: Apsaras
  alternative: Esra
  rationale: Der primäre griechische Text bietet ausdrücklich Ἀψάρας. Eine Harmonisierung mit dem abweichenden hebräischen Parallelzusammenhang würde den maßgeblichen Zeugen stillschweigend korrigieren.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit rechtlich-biblischem Wortfeld. Die Namensform und die syntaktische Unsicherheit des griechischen Hauptzeugen werden nicht harmonisiert, sondern durch Fußnoten offengelegt.
