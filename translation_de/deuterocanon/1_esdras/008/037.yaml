  yaml_path: translation/deuterocanon/1_esdras/008/037.yaml
  text: 'From the sons of Baer: Zechariah son of Bemaiah[a], and with him twenty-eight men.'
translation:
  language: de
  text: 'Aus dem Geschlecht Baers: Sacharja Bemai,[a] und mit ihm achtundzwanzig Männer.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Im Griechischen stehen „Sacharja“ und „Bemai“ ohne ausdrückliche Verwandtschaftsbezeichnung nebeneinander. Bemai kann im Zusammenhang der Liste als Vatername zu Sacharja verstanden werden; der griechische Wortlaut legt dies jedoch nicht ausdrücklich fest. Der ungefähr entsprechende hebräische Text in Esra 8,9 weicht deutlich ab: Dort stehen „von den Nachkommen Joabs: Obadja, der Sohn Jehiëls, und mit ihm 218 männliche Personen“. Da hier der griechische Text von 1 Esdras übersetzt wird, folgt der Haupttext dessen Namen und Zahl.'
    reason: textual_and_translational_ambiguity
lexical_decisions:
- source_word: ἐκ τῶν Βαήρ
  choice: Aus dem Geschlecht Baers
  rationale: Die wörtlich ungewöhnliche Wendung „aus den Baer“ bezeichnet im Zusammenhang dieser Liste eine Familie oder Sippe. „Aus dem Geschlecht Baers“ gibt diese Funktion natürlich und ohne Abhängigkeit vom abweichenden hebräischen Paralleltext wieder.
- source_word: Ζαχαρίαι
  choice: Sacharja
  rationale: Die im Deutschen geläufige alttestamentliche Namensform wird für die griechische Form des Namens verwendet.
- source_word: Βημαί
  choice: der Sohn Bemais
  rationale: Der zweite, unmittelbar folgende Eigenname fungiert im genealogischen Listenzusammenhang wahrscheinlich als Vatername. Die Beziehung ist im Griechischen jedoch nicht ausdrücklich bezeichnet und wird deshalb in der Fußnote offengelegt.
- source_word: καὶ μετʼ αὐτοῦ
  choice: und mit ihm
  rationale: Direkte und natürliche Wiedergabe der Begleitung in einer Aufzählung.
- source_word: ἄνδρες εἴκοσι ὀκτώ
  choice: achtundzwanzig Männer
  rationale: ἄνδρες bezeichnet hier männliche Personen; „Männer“ wahrt diese Spezifizierung und entspricht dem deutschen Listenstil.
