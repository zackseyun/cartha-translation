base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/038.yaml
  text: 'the sons of Astad: Joanes son of Akatan[a], and with him one hundred ten men[b];'
translation:
  language: de
  text: 'Von den Söhnen Astads: Joanes, Sohn Akatans[a], und mit ihm hundertzehn Männer[b];'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder möglicherweise: „Joanes Akatan“. Im Griechischen stehen die beiden Namen ohne ein ausdrückliches „Sohn des“ nebeneinander; der Zusammenhang der Geschlechterliste spricht jedoch für die patronymische Deutung.'
    reason: alternative_reading
  - marker: b
    text: Die hebräische Parallelstelle in Esra 8,10 bietet hier eine deutlich andere Familien- und Namensfolge und nennt 160 männliche Personen. Da für 1 Esdras der griechische Text maßgeblich ist, bleiben hier dessen Namen und Gesamtzahl stehen.
    reason: textual_variant
lexical_decisions:
- source_word: υἱοὶ Ἀστάδ
  choice: Von den Nachkommen Astads
  rationale: In einer genealogischen Liste bezeichnet υἱοί häufig nicht nur unmittelbare Söhne, sondern die Angehörigen beziehungsweise Nachkommen einer Familie. Die Formulierung gibt zugleich den partitiv-listenartigen Sinn natürlich wieder.
- source_word: Ἰωάνης
  choice: Joanes
  rationale: Der Personenname wird entsprechend der maßgeblichen griechischen Textform transliteriert, ohne ihn durch einen abweichenden Namen aus der hebräischen Parallelüberlieferung zu ersetzen.
- source_word: Ἀκατάν
  choice: Akatans
  rationale: Die Form wird als Eigenname und im Zusammenhang der Liste wahrscheinlich als Patronym verstanden. Der Genitiv folgt aus der erläuternden Wiedergabe „der Sohn Akatans“; die im Griechischen verbleibende Mehrdeutigkeit wird in einer Fußnote festgehalten.
- source_word: μετʼ αὐτοῦ
  choice: und mit ihm
  rationale: Das singularische αὐτοῦ bezieht sich am natürlichsten auf den zuvor genannten Joanes und wird in Numerus und Satzverknüpfung genau wiedergegeben.
- source_word: ἄνδρες
  choice: Männer
  rationale: Die gewöhnliche Bedeutung von ἄνδρες ist „Männer“. Das biologischere „männliche Personen“ wäre weniger natürlich und würde sich stärker an die abweichende hebräische Parallelstelle anlehnen.
- source_word: ἑκατὸν δέκα
  choice: hundertzehn
  rationale: Dies gibt die Zahl des griechischen Haupttextes unmittelbar und in gegenwärtigem Standarddeutsch wieder.
theological_decisions: []
translation_notes:
  register: Natürliches, knappes und würdiges Listendeutsch. „Nachkommen“ vermeidet die mögliche Fehlannahme, es seien ausschließlich unmittelbare leibliche Söhne gemeint. Die Eigennamen folgen dem griechischen Zeugen; die abweichende hebräische Überlieferung und die syntaktische Mehrdeutigkeit werden nicht in den Haupttext eingetragen, sondern transparent in den Fußnoten dokumentiert.
