base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/090.yaml
  text: And Jechonias son of Jeelus[a], of the sons of Israel, cried out and said to Ezra, “We have sinned against the Lord, and foreign women from the nations of the land have dwelt among us[b]; and now there is still hope for all Israel.”
translation:
  language: de
  text: 'Und Jechonias, Sohn Jeelus’, einer der Israeliten, rief laut und sagte zu Esra: »Wir haben gegen den Herrn gesündigt, und fremde Frauen aus den Völkern des Landes haben unter uns gewohnt[b]. Und nun gibt es noch Hoffnung für ganz Israel[a].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Schlusssatz ist schwierig und lässt sich nicht sicher wörtlich verstehen. Die Übersetzung orientiert sich für den Sinn an dem Paralleltext in Esra 10,2: »Doch nun gibt es in dieser Sache noch Hoffnung für Israel.«'
    reason: textual_variant
  - marker: b
    text: 'Der hebräische Paralleltext in Esra 10,2 sagt ausdrücklicher: »Wir haben fremde Frauen aus den Völkern des Landes geheiratet.« Der griechische Text spricht hier dagegen davon, dass die Frauen »gewohnt« haben.'
    reason: alternative_reading
lexical_decisions:
- source_word: φωνήσας
  choice: rief laut
  rationale: Das Partizip bezeichnet ein vernehmliches Rufen bzw. das Erheben der Stimme und gibt die öffentliche, dringliche Äußerung natürlich wieder.
- source_word: Ἰεχονίας Ἰεήλου
  choice: Jechonias, der Sohn Jeelus’
  rationale: Die griechischen Namensformen werden beibehalten. Der zweite Genitivname wird aufgrund der üblichen Abstammungsangabe und des Paralleltexts als Vatername verstanden.
- source_word: τῶν υἱῶν Ἰσραήλ
  choice: aus den Söhnen Israels
  rationale: Die formale, genealogisch und bundesgeschichtlich geprägte Wendung des Griechischen bleibt erhalten.
- source_word: ἡμάρτομεν εἰς τὸν κύριον
  choice: Wir haben gegen den Herrn gesündigt
  rationale: Die idiomatische Bedeutung von ἁμαρτάνω εἰς wird im Deutschen als Sünde gegen jemanden ausgedrückt; das Perfekt passt zum gegenwärtigen Bekenntnis.
- source_word: γυναῖκες ἀλλογενεῖς
  choice: fremde Frauen
  rationale: ἀλλογενής bezeichnet Menschen anderer Volkszugehörigkeit. »Fremde Frauen« ist verständlich und vermeidet spätere, hier nicht erforderliche religiöse Konnotationen.
- source_word: ἐκ τῶν ἐθνῶν τῆς γῆς
  choice: aus den Völkern des Landes
  rationale: »Völker« gibt ἔθνη in diesem Zusammenhang natürlicher als »Nationen« wieder und bewahrt den Gegensatz zu Israel.
- source_word: κατῴκησαν
  choice: haben unter uns gewohnt
  rationale: Das Verb bedeutet »wohnen« oder »sich niederlassen«. »Unter uns« macht die im Kontext vorausgesetzte Eingliederung deutlich, ohne die abweichende hebräische Lesart »heiraten« in den griechischen Text einzutragen.
- source_word: καὶ νῦν ἔστιν ἐπάνω πᾶς Ἰσραήλ
  choice: Doch nun gibt es noch Hoffnung für ganz Israel
  rationale: Der überlieferte griechische Satz ist semantisch schwierig. Die Fassung folgt dem wahrscheinlichen Sinn, den der Paralleltext Esra 10,2 stützt, während eine Fußnote die Unsicherheit offenlegt.
theological_decisions:
- issue: Wiedergabe des Gottestitels κύριον
  choice: der Herr
  alternative: der HERR
  rationale: Die unmittelbare Quelle ist griechisch und bietet κύριον. »Herr« wahrt diesen Befund; die besondere Schreibweise »HERR« wäre an eine ausdrückliche Wiedergabe des hebräischen Gottesnamens gebunden.
- issue: Deutung der schwierigen Schlussklausel
  choice: Doch nun gibt es noch Hoffnung für ganz Israel
  alternative: eine wörtliche, aber unverständliche Wiedergabe wie »und nun ist ganz Israel darüber«
  rationale: Die griechische Überlieferung ist hier offenbar verdorben oder stark verkürzt. Der sachlich passende Parallelwortlaut von Esra 10,2 hilft bei der Sinnbestimmung, ohne dass die textliche Spannung verschwiegen wird.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit leicht formaler biblischer Färbung. Die Namen folgen der griechischen Quelle; die ungewohnte Wendung »Söhne Israels« bewahrt bewusst deren genealogischen Charakter. Die textkritisch schwierige Schlussaussage wird verständlich formuliert und transparent erläutert.
