base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/001.yaml
  text: And after these things[a], in the reign of Artaxerxes king of the Persians, Ezra son of Azariah, son of Zechariah, son of Chelkiah, son of Shallum[b], came up.
translation:
  language: de
  text: Nach diesen Ereignissen, als Artaxerxes, der König der Perser[a], regierte, zog Esra, der Sohn Asarjas, des Sohnes Sechris, des Sohnes Chelkijas[b], des Sohnes Schallums, hinauf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich nach dem Griechischen: »König der Perser«; die hebräische Parallelstelle in Esra 7,1 hat »König von Persien«.'
    reason: alternative_reading
  - marker: b
    text: Die griechische Namensform »Chelkija« entspricht dem Namen, der in der hebräischen Parallelstelle als »Hilkija« erscheint.
    reason: lexical_alternative
lexical_decisions:
- source_word: μεταγενέστερος τούτων ἐστίν
  choice: Nach diesen Ereignissen
  rationale: Die verdichtete griechische Wendung leitet einen späteren Erzählabschnitt ein. Die hebräische Parallelstelle וְאַחַר הַדְּבָרִים הָאֵלֶּה bestätigt diese natürliche zeitliche Wiedergabe.
- source_word: βασιλεύοντος Ἀρταξέρξου
  choice: als Artaxerxes … regierte
  rationale: Der Genitivus absolutus gibt den zeitlichen Rahmen an; die Nebensatzform ist im heutigen Deutsch klar und natürlich.
- source_word: τοῦ βασιλέως Περσῶν
  choice: der König der Perser
  rationale: Der griechische Text hat ausdrücklich den Plural »der Perser« und wird nicht an das singularische »von Persien« der hebräischen Parallelstelle angeglichen.
- source_word: προσέβη
  choice: zog … hinauf
  rationale: Das Verb bezeichnet hier die Reise hinauf, dem Zusammenhang nach nach Jerusalem. »zog hinauf« bewahrt die Richtungsangabe und klingt im Deutschen idiomatisch.
- source_word: Ἔσρας
  choice: Esra
  rationale: Eingebürgerte deutsche Form des biblischen Namens.
- source_word: Ἀζαραίου
  choice: Asarja
  rationale: Die übliche deutsche Form des entsprechenden semitischen biblischen Namens; sie gibt die Identität des Namens verständlicher wieder als eine rein griechische Umschrift.
- source_word: Ζεχρίου
  choice: Secharja
  rationale: Verwendet die im Deutschen geläufige Form des biblischen Namens, den die griechische Namensform wiedergibt.
- source_word: Χελκείου
  choice: Chelkija
  rationale: Die Form hält sich sichtbar an den primären griechischen Zeugen; die geläufigere, von der hebräischen Parallelüberlieferung her bekannte Form »Hilkija« wird in einer Fußnote genannt.
- source_word: Σαλήμου
  choice: Schallum
  rationale: Die griechische Form wird als der bekannte biblische Name Schallum identifiziert; dies entspricht der genealogischen Namenstradition.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die verschachtelte Abstammungsreihe bleibt erhalten, wird aber durch die wiederholte Wendung »des Sohnes« eindeutig gemacht. Die Richtungsbedeutung von προσέβη bleibt bewusst offen hinsichtlich des nicht ausdrücklich genannten Zielorts; Jerusalem wird daher nicht in den Haupttext ergänzt.
