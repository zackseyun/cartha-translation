  terminology: „Haus des Herrn“ gibt ἐν τῷ οἴκῳ Κυρίου angemessen wieder. Die griechischen Namensformen werden im Haupttext grundsätzlich gewahrt; „Eleazar“ ist dabei die nähere Transliteration von Ἐλεαζάρ als „Eleasar“. Die Fußnote muss die MT-parallele Namensform Jozabad statt „Jonatan“ nennen; die dortige Nennung von Jonatan ist weder durch den griechischen Namen Ἰωσαβεές noch durch die einschlägige MT-Parallele gedeckt.
