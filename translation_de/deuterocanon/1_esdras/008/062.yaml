base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/062.yaml
  text: And when the third day came there, the silver and the gold were weighed out and handed over in the house of the Lord to Marmothi son of Ourias the priest, and with him was Eleazar son of Phinehas; and with them were Josabees son of Jesous and Moeth son of Sabannus, the Levites, by number and by weight, all of it; and the whole weight was recorded at that very time.
translation:
  language: de
  text: Als dort der dritte Tag gekommen war, wurden das Silber und das Gold gewogen und im Haus des Herrn dem Priester Marmothi, dem Sohn des Ourias, übergeben. Bei ihm war Eleazar, der Sohn des Phinehas; und bei ihnen waren die Leviten Josabees, der Sohn des Jesous, und Moeth, der Sohn des Sabannus.[a] Dabei wurde alles nach Zahl und Gewicht erfasst, und das gesamte Gewicht wurde noch zur selben Stunde schriftlich festgehalten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Namen im griechischen Text weichen von der masoretischen Parallelüberlieferung ab. Dort stehen entsprechende Formen wie Meremot, der Sohn Urias, Eleazar, der Sohn des Pinhas, sowie die Leviten Jozabad, der Sohn Jeschuas, und Noadja, der Sohn Binnuis. Der Haupttext folgt den griechischen Namensformen von 1 Esdras.
    reason: alternative_reading
lexical_decisions:
- source_word: γενομένης αὐτόθι ἡμέρας τρίτης
  choice: Als dort der dritte Tag gekommen war
  rationale: Der Genitivus absolutus bezeichnet den zeitlichen Umstand; die Formulierung bewahrt sowohl αὐτόθι als auch die ausdrückliche Ankunft des dritten Tages.
- source_word: σταθὲν τὸ ἀργύριον καὶ τὸ χρυσίον παρεδόθη
  choice: wurden das Silber und das Gold gewogen und … übergeben
  rationale: Das passive Partizip bezeichnet das Wiegen vor beziehungsweise bei der förmlichen Übergabe; „gewogen“ vermeidet die zusätzliche Nuance von „abgewogen“.
- source_word: ἐν τῷ οἴκῳ Κυρίου
  choice: im Haus des Herrn
  rationale: Bewahrt die geläufige biblische Tempelbezeichnung und gibt κύριος mit „Herr“ wieder.
- source_word: Μαρμωθὶ Οὐρείᾳ ἱερεῖ
  choice: dem Priester Marmothi, dem Sohn des Ourias
  rationale: Die Dativfolge wird als Empfänger mit Amts- und Herkunftsangabe verstanden; die griechischen Namensformen bleiben erhalten.
- source_word: μετʼ αὐτοῦ Ἐλεαζὰρ ὁ τοῦ Φεινεές
  choice: Bei ihm war Eleasar, der Sohn des Phinehas
  rationale: Die Artikel-Genitiv-Konstruktion bezeichnet die Abstammung; „Sohn des“ ist im Deutschen eindeutig und natürlich.
- source_word: ἦσαν μετʼ αὐτῶν Ἰωσαβεὲς Ἰησοῦς καὶ Μωὲθ Σαβάννου, οἱ Λευεῖται
  choice: bei ihnen waren die Leviten Josabees, der Sohn des Jesous, und Moeth, der Sohn des Sabannus
  rationale: Die Begleitpersonen und ihre levitische Stellung werden klar wiedergegeben; die Genitive werden entsprechend dem Parallelzusammenhang als Patronyme verstanden.
- source_word: πρὸς ἀριθμὸν καὶ ὁλκὴν πάντα
  choice: Alles wurde nach Zahl und Gewicht übergeben
  rationale: Die Wendung betont die vollständige und genaue administrative Erfassung; das Verb „übergeben“ wird aus dem vorausgehenden Satz sinngemäß ergänzt.
- source_word: ἐγράφη πᾶσα ἡ ὁλκὴ αὐτῇ τῇ ὥρᾳ
  choice: das gesamte Gewicht wurde noch zur selben Stunde schriftlich festgehalten
  rationale: ἐγράφη bezeichnet eine schriftliche Aufzeichnung, während αὐτῇ τῇ ὥρᾳ deren unverzügliche Anfertigung hervorhebt.
theological_decisions:
- issue: Wiedergabe von κύριος in der Tempelformel
  choice: Herr
  alternative: HERR
  rationale: „Haus des Herrn“ ist eine natürliche und traditionsnahe Wiedergabe der griechischen Formulierung, ohne eine vom griechischen Text nicht ausdrücklich markierte typografische Gleichsetzung einzuführen.
- issue: Eigennamen bei Abweichungen zwischen dem griechischen Text und der masoretischen Parallelüberlieferung
  choice: Griechische Namensformen im Haupttext
  alternative: An die masoretische Parallelüberlieferung angeglichene Formen wie Meremot, Uria, Jonatan, Jeschua, Noadja und Binnui
  rationale: Für 1 Esdras ist der griechische Text die primäre Vorlage. Die abweichenden Parallelformen werden transparent in einer Fußnote genannt, statt den Haupttext stillschweigend anzugleichen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die lange griechische Satzperiode wurde zur besseren Verständlichkeit behutsam gegliedert; die genaue Abfolge von Wiegen, Übergabe und schriftlicher Erfassung bleibt erhalten.
