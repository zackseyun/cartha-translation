  to: Als dort der dritte Tag gekommen war, wurden das Silber und das Gold gewogen und im Haus des Herrn dem Priester Marmothi, dem Sohn des Ourias, übergeben. Bei ihm war Eleazar, der Sohn des Phinehas; und bei ihnen waren die Leviten Josabees, der Sohn des Jesous, und Moeth, der Sohn des Sabannus.[a] Dabei wurde alles nach Zahl und Gewicht erfasst, und das gesamte Gewicht wurde noch zur selben Stunde schriftlich festgehalten.
