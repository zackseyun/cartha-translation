  - severity: medium
    issue: Unzutreffende MT-parallele Namensform „Jonatan“ in der Fußnote
    rationale: Für den hier genannten Leviten entspricht die MT-parallele Überlieferung Jozabad, Sohn Jeschuas; „Jonatan“ ist an dieser Stelle nicht die passende Vergleichsform.
