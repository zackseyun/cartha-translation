  terminology: „Kammern“ passt zu παστοφορίοις; „Haus unseres Herrn“ gibt sowohl οἶκος als auch das ausdrückliche ἡμῶν wieder. „Vaterhäuser“ bewahrt den technischen Charakter von πατρίαι. In der Fußnotenbegründung ist jedoch das griechische Stichwort durch ein fehlerhaftes Zeichen verfälscht und muss zu „παστοφορίοις“ berichtigt werden.
