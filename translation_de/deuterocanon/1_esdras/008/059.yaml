  source_fidelity: 'Der Vers gibt die griechische Vorlage im Wesentlichen präzise wieder: ἀγρυπνεῖτε und φυλάσσετε bleiben als zwei nachdrückliche Aufforderungen erhalten; die Übergabe, die führenden Priester und Leviten, die Oberhäupter der Vaterhäuser Israels sowie die Kammern des Hauses unseres Herrn sind sachgerecht wiedergegeben. Die Stellung der Ortsangaben bewahrt die syntaktische Offenheit der Vorlage.'
