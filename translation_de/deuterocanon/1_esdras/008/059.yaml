base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/059.yaml
  text: Stay awake and guard them until you hand them over to the chiefs of the priests and the Levites and to the heads of the fathers’ houses of Israel in Jerusalem[b][a], in the chambers of the house of our Lord.
translation:
  language: de
  text: Seid wachsam und bewacht sie, bis ihr sie den Obersten der Priester und der Leviten und den Oberhäuptern der Vaterhäuser Israels in Jerusalem übergebt, in den Kammern[a] des Hauses unseres Herrn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die „Kammern“ waren Räume im Tempelkomplex.
    reason: Begriffserklärung zum historischen Tempelwort παστοφορίοις und Bestätigung durch die hebräische Parallelüberlieferung.
lexical_decisions:
- source_word: ἀγρυπνεῖτε
  choice: Seid wachsam
  rationale: Das Verb bezeichnet waches, unablässiges Aufpassen. „Seid wachsam“ gibt diesen Sinn in natürlichem Deutsch wieder, ohne zwingend buchstäbliche Schlaflosigkeit zu behaupten.
- source_word: φυλάσσετε
  choice: bewacht sie
  rationale: Im Zusammenhang mit anvertrauten Heiligtumsgütern geht es um schützende Verwahrung. Das Pronomen bezieht sich auf die zuvor genannten Gegenstände.
- source_word: ἕως τοῦ παραδοῦναι αὐτὰ ὑμᾶς
  choice: bis ihr sie … übergebt
  rationale: Die Konstruktion bezeichnet den Zeitpunkt, bis zu dem die Bewachung dauern soll; „übergeben“ passt zur Übertragung der Verantwortung.
- source_word: φυλάρχοις
  choice: den Obersten
  rationale: Der Ausdruck bezeichnet hier führende Amtsträger unter den Priestern und Leviten. „Oberste“ wahrt den Rang, ohne eine Stammesorganisation einzutragen, die der Zusammenhang nicht verlangt.
- source_word: ἡγουμένοις τῶν πατριῶν
  choice: den Oberhäuptern der Vaterhäuser
  rationale: Die Wendung meint die Leiter der väterlich geordneten Großfamilien beziehungsweise Sippen. „Vaterhäuser“ erhält den gesellschaftlichen Fachbegriff.
- source_word: παστοφορίοις
  choice: Kammern
  rationale: Gemeint sind Räume innerhalb des Tempelkomplexes. Auch die hebräische Parallelüberlieferung spricht von Kammern beziehungsweise Räumen.
- source_word: τοῦ οἴκου τοῦ κυρίου ἡμῶν
  choice: des Hauses unseres Herrn
  rationale: „Haus“ bewahrt die Tempelbezeichnung der griechischen Vorlage, und „unseres Herrn“ gibt deren ausdrückliches Possessivpronomen wieder.
theological_decisions:
- issue: Bezeichnung des Tempels in τοῦ οἴκου τοῦ κυρίου ἡμῶν
  choice: des Hauses unseres Herrn
  alternative: des Tempels unseres Herrn; des Hauses des HERRN
  rationale: Die griechische Hauptvorlage hat wörtlich „Haus unseres Herrn“. Die hebräische Parallelstelle bestätigt den Tempelbezug, ersetzt aber nicht die abweichende griechische Formulierung.
- issue: Soziale Gliederung in τῶν πατριῶν
  choice: der Vaterhäuser Israels
  alternative: der Sippen Israels; der Familien Israels
  rationale: „Vaterhäuser“ erhält die formale Abstammungs- und Haushaltsstruktur, statt sie zum allgemeinen Begriff „Familien“ zu verflachen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die doppelte Aufforderung „Seid wachsam und bewacht“ erhält den Nachdruck des griechischen Verbenpaars. Die Stellung von „in Jerusalem“ und „in den Kammern“ bleibt nahe an der Vorlage; die Formulierung lässt offen, ob die Ortsangabe besonders die Empfänger oder den Übergabevorgang bestimmt.
