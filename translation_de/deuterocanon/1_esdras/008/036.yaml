base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/036.yaml
  text: 'From the sons of Bani: Salimoth son of Josaphias[a], and with him one hundred sixty men;'
translation:
  language: de
  text: 'Von den Söhnen Banis: Salimot, der Sohn Josafias[a], und mit ihm 160 Männer;'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die hebräische Parallelstelle in Esra 8,8 weicht hier erheblich ab: Sie nennt eine andere Sippe, einen anderen Anführer und eine andere Zahl. Da 1 Esdras hier nach dem griechischen Text übersetzt wird, folgt der Haupttext dessen Lesart: „Bani … Salimot, der Sohn Josafias … 160 Männer“.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκ τῶν υἱῶν Βανίας
  choice: Von den Söhnen Banis
  rationale: υἱοί kann in einer genealogischen Liste auch Nachkommen oder Angehörige einer Sippe bezeichnen. Die traditionelle, knappe Listenformel „Söhne Banis“ bewahrt die Ausdrucksweise des Griechischen.
- source_word: Σαλειμὼθ
  choice: Salimot
  rationale: Der Eigenname wird nach der griechischen Form wiedergegeben; das auslautende griechische Theta erscheint in eingedeutschter biblischer Namensform als t.
- source_word: Ἰωσαφίου
  choice: der Sohn Josafias
  rationale: Der bloße Genitiv bezeichnet im genealogischen Zusammenhang am natürlichsten die Abstammung. „Der Sohn Josafias“ macht die im Griechischen implizite Beziehung verständlich, ohne sie umzudeuten.
- source_word: καὶ μετʼ αὐτοῦ
  choice: und mit ihm
  rationale: Die knappe Wiedergabe erhält den elliptischen Stil der Aufzählung.
- source_word: ἄνδρες
  choice: Männer
  rationale: ἄνδρες bezeichnet hier ausdrücklich Männer, nicht allgemein Personen.
- source_word: ἑκατὸν ἑξήκοντα
  choice: '160'
  rationale: Die Ziffernschreibung ist in einer zahlenreichen Liste übersichtlich und gibt den griechischen Zahlenwert genau wieder.
