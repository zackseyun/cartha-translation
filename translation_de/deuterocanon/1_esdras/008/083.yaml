lexical_decisions:
- source_word: τοῖς υἱοῖς ὑμῶν
  choice: euren Söhnen
  rationale: Die Dativphrase wird direkt mit „euren Söhnen“ wiedergegeben. „Söhne“ bewahrt die ausdrücklich maskuline Pluralform υἱοῖς; der fragmentarische Kontext bietet keinen sicheren Grund für eine Erweiterung zu „Kindern“.
- source_word: ἕως αἰῶνος
  choice: für immer
  rationale: Die idiomatische Wendung bezeichnet eine unbegrenzte beziehungsweise bleibende Dauer. „Für immer“ ist im modernen Deutsch natürlich und gibt den Sinn klar wieder.
theological_decisions:
- issue: Fragmentarischer Text und erhebliche Abweichung der Parallelüberlieferung
  choice: 'Das erhaltene griechische Fragment wird unmittelbar als Satzbruchstück übersetzt: „euren Söhnen für immer.“'
  alternative: Aus dem längeren masoretischen Paralleltext einen vollständigen Satz rekonstruieren.
  rationale: Der angegebene griechische Primärtext besteht nur aus τοῖς υἱοῖς ὑμῶν ἕως αἰῶνος. Der hebräische Paralleltext gehört zu einem abweichenden, längeren Zusammenhang und bietet keine ausreichende Grundlage, fehlenden griechischen Wortlaut zu rekonstruieren. Daher bleibt der fragmentarische Charakter transparent erhalten.
translation_notes:
