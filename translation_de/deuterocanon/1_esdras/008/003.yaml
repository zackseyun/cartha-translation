base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/003.yaml
  text: This Ezra went up from Babylon[a], being a skillful scribe in the law of Moses that had been given by the God of Israel,
translation:
  language: de
  text: Dieser Esra zog von Babylon hinauf. Er war ein kundiger[a] Schriftgelehrter im Gesetz des Mose, das der Gott Israels gegeben hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: fähiger; das griechische Wort kann Begabung, Einsicht oder erworbene Tüchtigkeit bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέβη
  choice: zog … hinauf
  rationale: Bewahrt die übliche biblische Richtungsangabe für die Reise von Babylon nach Jerusalem beziehungsweise in das Land Israel und klingt im Deutschen natürlich.
- source_word: γραμματεὺς
  choice: Schriftgelehrter
  rationale: Bezeichnet im jüdischen Schriftkontext einen mit den heiligen Schriften und dem Gesetz vertrauten Fachkundigen; „Schreiber“ wäre im modernen Deutschen zu eng.
- source_word: εὐφυὴς
  choice: kundiger
  rationale: Gibt die ausgesagte Befähigung und Sachkompetenz verständlich wieder, ohne eine bestimmte formale Ausbildung vorauszusetzen.
- source_word: ἐν τῷ Μωυσέως νόμῳ
  choice: im Gesetz des Mose
  rationale: Gibt den Bereich wieder, in dem Esra als Schriftgelehrter kundig war, und folgt der griechischen Fügung eng.
- source_word: ἐκδεδομένῳ
  choice: gegeben hatte
  rationale: Drückt die passive Bedeutung des Aushändigens beziehungsweise Übergebens idiomatisch aus; im deutschen Relativsatz wird das Passiv natürlich ins Aktiv umgeformt, wobei Gott ausdrücklich der Handelnde bleibt.
- source_word: τοῦ θεοῦ τοῦ Ἰσραήλ
  choice: der Gott Israels
  rationale: Direkte und im Deutschen etablierte Wiedergabe der griechischen Genitivverbindung.
theological_decisions:
- issue: Verhältnis von Esras Befähigung zum Gesetz des Mose
  choice: ein kundiger Schriftgelehrter im Gesetz des Mose
  alternative: ein fähiger Schriftgelehrter im Gesetz des Mose
  rationale: Die Formulierung bewahrt sowohl Esras Rolle als γραμματεύς als auch seine Befähigung und den durch ἐν bezeichneten Wissensbereich, ohne mehr als der Text über seine Ausbildung zu behaupten.
- issue: Göttlicher Ursprung des Gesetzes
  choice: das der Gott Israels gegeben hatte
  alternative: das vom Gott Israels übergeben worden war
  rationale: Die Formulierung hält ausdrücklich fest, dass das mosaische Gesetz von Israels Gott stammt, ohne daraus weitere theologische Folgerungen abzuleiten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die lange griechische Satzfügung wurde zur besseren Verständlichkeit in zwei Sätze gegliedert. Der Fußnotenmarker steht unmittelbar bei dem Wort, auf das sich die lexikalische Alternative bezieht.
