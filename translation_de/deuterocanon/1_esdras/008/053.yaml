base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/053.yaml
  text: For we had told the king that the strength of our Lord would be with those who seek him for every restoration[a][b].
translation:
  language: de
  text: Denn wir hatten dem König gesagt, dass die Kraft unseres Herrn mit denen sein werde, die ihn suchen, für jede Wiederherstellung.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zu aller Wiederherstellung“. Der griechische Ausdruck ist ungewöhnlich und kann weiter gefasst auch „für jedes gute Gelingen“ oder „für einen guten Ausgang“ bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Die hebräische Parallelüberlieferung weicht an dieser Stelle erheblich ab: Dort ist vom Fasten und davon die Rede, Gott zu suchen, nicht aber von einer wiederholten Mitteilung an den König. Die Übersetzung folgt hier dem griechischen Text von 1 Esdras als der maßgeblichen Textgrundlage.'
    reason: textual_variant
lexical_decisions:
- source_word: εἴπαμεν
  choice: wir hatten … gesagt
  rationale: Das Plusquamperfekt macht im deutschen Erzählzusammenhang deutlich, dass diese Aussage gegenüber dem König bereits zuvor gemacht worden war. „Jemandem sagen“ bildet den persönlichen Adressaten natürlich ab.
- source_word: Ἰσχὺς
  choice: Kraft
  rationale: Ἰσχύς bezeichnet Stärke oder Macht. „Kraft“ ist im modernen Deutsch klar und gibt hier die wirksame göttliche Stärke wieder, ohne den Ausdruck unnötig zu abstrahieren.
- source_word: τοῦ κυρίου ἡμῶν
  choice: unseres Herrn
  rationale: κύριος bezieht sich in diesem jüdisch-griechischen Kontext ehrfürchtig auf Gott. „Unser Herr“ bewahrt diesen Gottesbezug und den üblichen Sprachgebrauch der Septuaginta.
- source_word: μετὰ τῶν ἐπιζητούντων αὐτόν
  choice: mit denen …, die ihn suchen
  rationale: ἐπιζητέω kann ein nachdrückliches Suchen bezeichnen; das schlichte „suchen“ ist hier jedoch idiomatisch und bewahrt den Sinn, ohne eine nicht ausdrücklich markierte Intensität einzutragen.
- source_word: εἰς πᾶσαν ἐπανόρθωσιν
  choice: bei jeder Wiederherstellung
  rationale: ἐπανόρθωσις bezeichnet Wiederherstellung, Aufrichtung oder das Wieder-in-Ordnung-Bringen. Die bewusst eng am ungewöhnlichen griechischen Ausdruck bleibende Wiedergabe vermeidet eine vorschnelle Deutung als bloßen Erfolg oder Wohlstand.
theological_decisions:
- issue: Wiedergabe von κύριος als Gottesbezeichnung
  choice: Herr
  alternative: Gebieter
  rationale: Der Zusammenhang bezeichnet den Gott Israels. „Herr“ wahrt Ehrfurcht und Kontinuität mit dem Sprachgebrauch der Septuaginta, ohne eine konfessionelle Sonderdeutung einzutragen.
- issue: Deutung von εἰς πᾶσαν ἐπανόρθωσιν
  choice: bei jeder Wiederherstellung
  alternative: für jedes gute Gelingen
  rationale: Da die griechische Primärquelle ausdrücklich ἐπανόρθωσις enthält, bleibt die Übersetzung bei dessen konkretem Bedeutungsfeld. Die ungewöhnliche Formulierung und die breitere mögliche Deutung werden in der Fußnote offengelegt, statt harmonisierend aufgelöst zu werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Konjunktiv „sein werde“ kennzeichnet die indirekte Rede. Die etwas ungewohnte Wendung „bei jeder Wiederherstellung“ bewahrt bewusst die Spannung und Mehrdeutigkeit des griechischen Ausdrucks; beide Fußnotenmarker stehen im Haupttext.
