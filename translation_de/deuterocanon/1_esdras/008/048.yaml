  text: from the sons of Hanunai and their sons[a], twenty men;
translation:
  language: de
  text: 'von den Söhnen Hanunais und ihren Söhnen[a]: zwanzig Männer;'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der erhaltene griechische Text lautet: „von den Söhnen Hanunais und ihren Söhnen: zwanzig Männer“. Der ungefähre hebräische Paralleltext in Esra 8,19 nennt dagegen Haschabja und Jeschaja aus den Söhnen Meraris sowie seine Brüder und ihre Söhne, insgesamt zwanzig.'
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ ἐκ τῶν υἱῶν Χανουναίου
  choice: von den Söhnen Hanunais
  rationale: Die Konstruktion οἱ ἐκ mit Genitiv bezeichnet Angehörige, die aus einer Familiengruppe stammen. Die knappe deutsche Wiedergabe wahrt den genealogischen Sinn; der Eigenname wird als „Hanunai“ transliteriert.
- source_word: οἱ υἱοὶ αὐτῶν
  choice: und ihren Söhnen
  rationale: Das griechische αὐτῶν steht im Plural und wird daher unmittelbar mit „ihren“ wiedergegeben. Eine Angleichung an den abweichenden hebräischen Paralleltext unterbleibt.
- source_word: εἴκοσι ἄνδρες
  choice: zwanzig Männer
  rationale: ἄνδρες bezeichnet in dieser listenartigen Zählung männliche Personen; „Männer“ ist präzise und natürlich.
theological_decisions:
- issue: Abweichung zwischen griechischer Überlieferung und masoretischem Paralleltext in der Personenliste
  choice: 'Im Haupttext steht gemäß dem griechischen Primärtext die Familienangabe „von den Söhnen Hanunais und ihren Söhnen: zwanzig Männer“.'
  alternative: Der ungefähre hebräische Paralleltext nennt Haschabja und Jeschaja aus den Söhnen Meraris sowie seine Brüder und ihre Söhne, insgesamt zwanzig.
  rationale: Die griechische Fassung von 1 Esdras ist die maßgebliche Textgrundlage und weicht hier erheblich vom masoretischen Paralleltext ab. Die Abweichung wird nicht harmonisiert, sondern wegen ihrer Bedeutung für die Identifizierung der Gruppe in einer Fußnote dokumentiert.
translation_notes:
  register: Moderner, würdiger Listenstil. Der Doppelpunkt gibt die anschließende Gesamtzahl im Deutschen natürlich wieder; das abschließende Semikolon bewahrt den Charakter einer fortlaufenden Aufzählung.
