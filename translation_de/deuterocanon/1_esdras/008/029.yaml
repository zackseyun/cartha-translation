base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/029.yaml
  text: From the sons of Phoros[a], Tarosotomos; from the sons of Ietamar, Gamelos; from the sons of David[b],
translation:
  language: de
  text: 'Von den Söhnen des Phoros[a]: Tarosotomos; von den Söhnen des Ietamar: Gamelos; von den Söhnen Davids[b],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechischen Namen weichen hier deutlich von der ungefähren hebräischen Parallele in Esra 8,2 ab. Dort steht: »von den Söhnen des Pinhas: Gerschom; von den Söhnen Itamars: Daniel; von den Söhnen Davids: Hattusch.« Da für 1 Esdras der griechische Text maßgeblich ist, werden im Haupttext dessen Namensformen bewahrt und nicht an die hebräische Parallele angeglichen.'
    reason: alternative_reading
  - marker: b
    text: Die mit »von den Söhnen Davids« begonnene Angabe wird im folgenden Vers fortgesetzt.
    reason: cross_reference
lexical_decisions:
- source_word: ἐκ τῶν υἱῶν
  choice: von den Söhnen
  rationale: Die wiederkehrende griechische Listenformel wird knapp und strukturgleich wiedergegeben; im Deutschen bezeichnet sie die Herkunft aus einer Familie oder Sippe.
- source_word: Φορός
  choice: Phoros
  rationale: Da der griechische Text die maßgebliche Vorlage ist, bleibt dessen Namensform erhalten, statt sie an eine abweichende hebräische Parallelüberlieferung anzugleichen.
- source_word: Ταροσότομος
  choice: Tarosotomos
  rationale: Der im Griechischen sicher bezeugte, aber von der hebräischen Parallelüberlieferung abweichende Name wird transliteriert und nicht stillschweigend harmonisiert.
- source_word: Ἰεταμάρου
  choice: Jetamar
  rationale: Jetamar gibt die griechische Namensform in natürlicher deutscher Umschrift wieder; die geläufige hebräische Form Itamar wird nicht in den Haupttext eingesetzt.
- source_word: Γάμηλος
  choice: Gamelos
  rationale: Die griechische Namensform wird bewahrt, obwohl die ungefähre hebräische Parallele einen anderen Namen bietet.
- source_word: τῶν υἱῶν Δαυείδ
  choice: von den Söhnen Davids
  rationale: Das im letzten Glied nicht wiederholte ἐκ wird aus der parallelen Listenstruktur sinngemäß ergänzt. Der deutsche Genitiv „Davids“ ist natürlich und genau.
