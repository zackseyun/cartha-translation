base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/046.yaml
  text: having commanded them to speak with Lodaios and his brothers and the treasurers in that place[a], to send us those who would serve as priests in the house of our Lord[d][c][b],
translation:
  language: de
  text: Ich trug ihnen auf, mit Lodaios[a], seinen Brüdern und den Schatzverwaltern an jenem Ort zu sprechen, damit sie uns[c] Männer schickten, die im Haus unseres Herrn[b] als Priester dienen sollten[d],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der griechische Text hat „Lodaios“; im hebräischen Paralleltext in Esra 8,17 steht „Iddo“.
    reason: alternative_reading
  - marker: b
    text: Der griechische Text hat „unser Herr“; der hebräische Paralleltext liest „unser Gott“.
    reason: alternative_reading
  - marker: c
    text: Der griechische Text sagt „uns … schickten“; der hebräische Paralleltext hat „zu uns bringen“.
    reason: alternative_reading
  - marker: d
    text: Der griechische Text bezeichnet ausdrücklich Männer, die als Priester dienen sollten; der hebräische Paralleltext spricht allgemeiner von „Dienern“ oder „Diensttuenden“.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐντειλάμενος
  choice: Nachdem er ihnen aufgetragen hatte
  rationale: Die vorzeitige Partizipialkonstruktion wird im Deutschen natürlich als temporaler Nebensatz wiedergegeben. „Aufgetragen“ bewahrt den verbindlichen Weisungscharakter, ohne unnötig scharf zu klingen.
- source_word: διαλεχθῆναι
  choice: zu sprechen
  rationale: Das Verb bezeichnet hier das Sprechen beziehungsweise Verhandeln mit den genannten Personen; „zu sprechen“ ist klar und lässt die genaue Art des Gesprächs offen.
- source_word: Λοδαίῳ
  choice: Lodaios
  rationale: Der Name folgt dem griechischen Primärtext und wird nicht an das hebräische Parallelzeugnis angeglichen.
- source_word: τοῖς ἀδελφοῖς αὐτοῦ
  choice: seinen Brüdern
  rationale: Dies gibt die gewöhnliche Bedeutung von ἀδελφοί direkt wieder; der Kontext erzwingt keine allgemeinere Wiedergabe wie „Verwandten“.
- source_word: γαζοφύλαξιν
  choice: Schatzverwaltern
  rationale: Das Wort bezeichnet die mit dem Schatz beziehungsweise der Schatzkammer betrauten Amtsträger. „Schatzverwalter“ ist verständlich und genauer als das im heutigen Deutsch leicht missverständliche „Schatzmeister“.
- source_word: ἀποστεῖλαι ἡμῖν
  choice: damit sie uns Männer schickten
  rationale: „Schickten“ folgt dem griechischen ἀποστέλλω. Der Finalsatz macht den Zweck des Gesprächs im Deutschen deutlich; „Männer“ dient als natürliches Bezugswort für das substantivierte Partizip.
- source_word: τοὺς ἱερατεύσαντας
  choice: Männer, die … als Priester dienen sollten
  rationale: ἱερατεύω bezeichnet ausdrücklich priesterlichen Dienst. Die Formulierung gibt die beabsichtigte künftige Aufgabe natürlich wieder, ohne sie zum allgemeineren „Dienen“ des hebräischen Paralleltextes abzuschwächen.
- source_word: ἐν τῷ οἴκῳ τοῦ κυρίου ἡμῶν
  choice: im Haus unseres Herrn
  rationale: „Haus“ bewahrt die biblische Tempelbezeichnung, und „unseres Herrn“ folgt dem griechischen κυρίου ἡμῶν.
theological_decisions:
- issue: κύριος gegenüber אֱלֹהֵינוּ im hebräischen Paralleltext
  choice: unser Herr
  alternative: unser Gott
  rationale: Der griechische Primärtext liest κύριος („Herr“). Die abweichende hebräische Parallele wird nicht harmonisierend in den Haupttext übernommen, sondern in einer Fußnote dokumentiert.
- issue: Spezifisch priesterlicher Dienst gegenüber allgemeinerem Dienst im hebräischen Paralleltext
  choice: als Priester dienen
  alternative: als Diener dienen / Dienst tun
  rationale: Das griechische ἱερατεύω bezeichnet ausdrücklich die Ausübung priesterlichen Dienstes. Diese Spezifizierung bleibt erhalten, während die breitere Formulierung des Paralleltextes vermerkt wird.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzform bleibt als Anschluss an den vorangehenden Kontext offen und endet daher mit einem Komma. Die griechischen Eigenheiten und die Abweichungen vom hebräischen Paralleltext werden bewahrt, ohne den Haupttext an diesen anzugleichen.
