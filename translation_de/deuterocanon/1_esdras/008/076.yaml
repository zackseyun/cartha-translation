revisions:
- from: und uns im Haus unseres Herrn[a] ein Licht aufzudecken[b], uns in der Zeit unserer Sklaverei Nahrung zu geben; und als wir Sklavendienst leisten mussten[c], wurden wir nicht verlassen.
  to: und uns im Haus unseres Herrn[a] eine Leuchte zu enthüllen[b] und uns in der Zeit unserer Sklaverei Nahrung zu geben; und während wir versklavt waren[c], wurden wir nicht verlassen.
  rationale: Die Überarbeitung beseitigt die unnatürliche deutsche Wortverbindung „Licht aufzudecken“, wählt mit „Leuchte“ die konkretere Entsprechung zu φωστήρ und vermeidet die nicht ausdrücklich im Griechischen enthaltene Modalität von „leisten mussten“. Die koordinierte Infinitivkonstruktion, das offene einleitende „und“, die Tempelbezeichnung als „Haus“ und die Wiederholung der Sklaverei-Terminologie bleiben erhalten.
