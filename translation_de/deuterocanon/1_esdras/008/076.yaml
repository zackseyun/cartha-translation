review_pass:
  verdict: revise
  source_fidelity: Der Entwurf gibt die Satzglieder und die wiederholte δουλεία-Wortgruppe im Wesentlichen zutreffend wieder. „Sklavendienst leisten mussten“ fügt beim Infinitiv δουλεύειν jedoch das Modalverb „mussten“ hinzu und verschiebt die knappe Zustands-/Umstandsangabe des Griechischen unnötig in eine konkrete Tätigkeitsumschreibung.
  naturalness: „Ein Licht aufzudecken“ ist im modernen Deutschen missverständlich und wenig idiomatisch; aufgedeckt wird gewöhnlich etwas Verborgenes, nicht „Licht“ als solches. Mit „eine Leuchte zu enthüllen“ bleibt das ungewöhnliche Bild des griechischen Ausdrucks erhalten, ist aber klarer und natürlicher.
  terminology: „Haus unseres Herrn“, „Nahrung“, „Sklaverei“ und „nicht verlassen“ sind angemessen. „Leuchte“ gibt den konkreten Lichtträger φωστήρ genauer wieder als das abstraktere „Licht“. „versklavt waren“ stellt die lexikalische Verbindung zu „Sklaverei“ klar her, ohne zusätzliche Modalität einzutragen.
