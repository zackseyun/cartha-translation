base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/076.yaml
  text: and to reveal a lamp for us in the house of our Lord[a], to give us food in the time of our slavery; and while we were enslaved[c][b], we were not forsaken
translation:
  language: de
  text: und uns im Haus unseres Herrn[a] eine Leuchte zu enthüllen[b] und uns in der Zeit unserer Sklaverei Nahrung zu geben; und während wir versklavt waren[c], wurden wir nicht verlassen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit dem „Haus unseres Herrn“ ist der Tempel gemeint.
    reason: cultural_note
  - marker: b
    text: 'Oder: „ein Licht“. Das Griechische sagt wörtlich „eine Leuchte aufzudecken/zu enthüllen“ und verwendet das Bild eines neu sichtbar werdenden Lichts im Haus des Herrn.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „während wir dienten“ beziehungsweise „während unserer Dienstbarkeit“. Das Griechische verwendet hier dieselbe Wortgruppe wie zuvor bei „Sklaverei“.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνακαλύψαι
  choice: aufzudecken
  rationale: Das Verb bedeutet wörtlich „aufdecken“ oder „enthüllen“. Die Wiedergabe bewahrt das konkrete Bild, auch wenn „sichtbar zu machen“ im Deutschen glatter wäre.
- source_word: φωστῆρα
  choice: ein Licht
  rationale: Das Substantiv bezeichnet einen Lichtträger oder eine Leuchte. „Licht“ ist in Verbindung mit „aufdecken“ natürlich verständlich und lässt die Bildsprache offen; „Leuchte“ ist ebenfalls möglich.
- source_word: οἴκῳ τοῦ κυρίου ἡμῶν
  choice: im Haus unseres Herrn
  rationale: Die direkte Wiedergabe bewahrt die griechische Bezeichnung. Gemeint ist in diesem Zusammenhang der Tempel.
- source_word: τροφὴν
  choice: Nahrung
  rationale: Das Wort bezeichnet Nahrung oder Unterhalt. „Nahrung“ ist konkret und zugleich für den würdevollen Erzählton geeignet.
- source_word: δουλείας
  choice: Sklaverei
  rationale: Die Form bezeichnet einen Zustand der Unfreiheit. „Sklaverei“ gibt dessen Schwere deutlicher wieder als das mildere „Dienstbarkeit“.
- source_word: ἐν τῷ δουλεύειν ἡμᾶς
  choice: als wir Sklavendienst leisten mussten
  rationale: Die Formulierung hält die Verbindung zur Wortgruppe δουλεία fest, wahrt aber die mögliche aktive Bedeutung von δουλεύειν („dienen“) und vermeidet die eindeutiger passive Festlegung „versklavt sein“.
- source_word: ἐγκατελείφθημεν
  choice: wurden wir nicht verlassen
  rationale: Das Verb bedeutet „verlassen“ oder „im Stich lassen“. Die gewählte Form ist klar und bewahrt den Gedanken, dass Gott sein Volk nicht aufgab.
theological_decisions:
- issue: Wiedergabe der Wortgruppe δουλεία / δουλεύειν
  choice: Sklaverei / Sklavendienst leisten mussten
  alternative: Dienstbarkeit / dienen; Sklaverei / versklavt sein
  rationale: Die Übersetzung macht die erzwungene Unterordnung sichtbar, ohne beim Verb die mögliche aktive Formulierung des Griechischen vollständig in ein Passiv umzudeuten.
- issue: Deutung von οἶκος τοῦ κυρίου als Tempel
  choice: Haus unseres Herrn
  alternative: Tempel unseres Herrn
  rationale: Der griechische Wortlaut sagt „Haus“. Die konkrete Identifikation mit dem Tempel wird in einer Fußnote erläutert, statt sie in den Haupttext einzutragen.
- issue: Bild von ἀνακαλύψαι φωστῆρα
  choice: ein Licht aufzudecken
  alternative: eine Leuchte sichtbar zu machen; ein Licht zu enthüllen
  rationale: Die ungewöhnliche Verbindung des Originals bleibt erkennbar und wird nicht vorschnell als „Hoffnung wiederherstellen“ oder ähnlich ausgelegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzform bleibt als Fortsetzung des vorausgehenden Zusammenhangs mit „und“ offen. Das auffällige Lichtbild und die Wiederholung der δουλεία-Wortgruppe werden bewahrt; die Fußnotenmarker erscheinen jeweils im Haupttext.
