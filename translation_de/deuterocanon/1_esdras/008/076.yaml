    issue: „als wir Sklavendienst leisten mussten“
    rationale: „mussten“ steht nicht im griechischen Text; zudem ist die Umschreibung weniger direkt als die durch den Kontext nahegelegte Zustandsangabe „während wir versklavt waren“.
