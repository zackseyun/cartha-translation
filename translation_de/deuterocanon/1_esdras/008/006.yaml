review_pass:
  verdict: revise
  source_fidelity: 'Die Übersetzung gibt Datierung, Plural bei der Ankunft und den Neumond zutreffend wieder. Sie verschiebt jedoch die Struktur des Schlussteils: κατὰ („gemäß/entsprechend“) wird zu einer kausalen Aussage über das Gelingen der Reise, und „dessen Beistand“ ergänzt ein im griechischen Text nicht genanntes Substantiv. Die schwierige Schlusswendung ἐπʼ αὐτῷ muss als solche erkennbar bleiben.'
  naturalness: Der bisherige Text ist überwiegend gut lesbar. „Ihre Reise gelang so gut, wie …“ wirkt jedoch freier als der griechische Wortlaut; außerdem ist „dessen Beistand“ wegen des unmittelbar vorhergehenden „Herrn“ zwar verständlich, aber eine interpretierende Ergänzung. Die revidierte Fassung bleibt idiomatisch und markiert die auffällige Schlussfügung mit einem Gedankenstrich.
  terminology: „Regierungsjahr“, „Neumond“, „Herr“ und „Esra“ entsprechen dem Register und den Vorgaben. „Günstiger Reiseverlauf“ gibt εὐοδία im Reisekontext angemessen wieder, ohne ein theologisches Deutungswort wie „Beistand“ in den Haupttext einzutragen.
  issues:
  - severity: medium
    issue: Die Wiedergabe von κατὰ τὴν δοθεῖσαν αὐτοῖς εὐοδίαν ist zu frei.
    rationale: „Ihre Reise gelang so gut, wie …“ macht aus „gemäß dem ihnen gewährten günstigen Reiseverlauf“ eine Vergleichs- bzw. Kausalaussage und gibt κατὰ nicht hinreichend wieder.
  - severity: medium
    issue: „dessen Beistand“ ist eine nicht ausdrücklich im griechischen Text vorhandene Ergänzung.
    rationale: Der Text enthält am Schluss nur ἐπʼ αὐτῷ („auf/über ihm“), dessen genaue syntaktische Anbindung schwierig ist. Die wahrscheinlich gemeinte göttliche Zuwendung soll in der Fußnote erläutert, nicht als „Beistand“ in den Haupttext eingeführt werden.
  - severity: low
    issue: Die Fußnote b überzeichnet den Befund des hebräischen Paralleltexts.
    rationale: Esra 7,6–9 verwendet für Esra in den einschlägigen Sätzen Singularformen; eine Reisegruppe wird dort nicht ausdrücklich als Subjekt der Reisehandlung genannt. Die Fußnote sollte sich auf den belegbaren Singular-Plural-Kontrast beschränken.
  revised_text: Im siebten Regierungsjahr des Artaxerxes, im fünften Monat,[a] kamen sie in Jerusalem an; denn er war am Neumond des ersten Monats aus Babylon aufgebrochen, und sie kamen nach Jerusalem, entsprechend dem ihnen vom Herrn gewährten günstigen Reiseverlauf – über ihm.[b][c]
  revised_footnotes:
  - marker: a
    text: 'Der griechische Text fügt hier den schwierigen Satz hinzu: „Dieses Jahr war für den König das zweite.“ Das widerspricht der Datierung ins siebte Regierungsjahr und fehlt im hebräischen Paralleltext (Esra 7,6–9); vermutlich ist der Satz entstellt oder an die falsche Stelle geraten.'
    reason: textual_variant
  - marker: b
    text: Der griechische Text wechselt unvermittelt vom Singular („er war … aufgebrochen“) zum Plural („sie kamen … an“). Der hebräische Paralleltext (Esra 7,6–9) spricht an den entsprechenden Stellen von Esra im Singular.
    reason: alternative_reading
  - marker: c
    text: Wörtlich endet der griechische Satz mit „vom Herrn über/auf ihm“. Die Anbindung dieser Worte ist im griechischen Text schwierig. Wahrscheinlich ist Gottes günstige Hand oder Zuwendung gegenüber Esra gemeint; der hebräische Paralleltext spricht von der Hand des HERRN, seines Gottes, über ihm.
    reason: lexical_alternative
  revision_rationale: Die problematische, im Haupttext ausgelassene Regnaljahresklausel bleibt in Fußnote a dokumentiert. Der Singular des Partizips und der Plural der beiden Ankunftsformen werden im Haupttext beibehalten. Der Schlussteil wird näher am griechischen κατὰ wiedergegeben; die überlieferte, schwer anschließbare Wendung ἐπʼ αὐτῷ wird nicht durch das ergänzte Wort „Beistand“ harmonisiert, sondern bewusst markiert und in einer Fußnote vorsichtig erklärt.
