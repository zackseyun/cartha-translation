base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/006.yaml
  text: In the seventh year of the reign of Artaxerxes[a], in the fifth month—they arrived at Jerusalem; for they had set out from Babylon on the new moon of the first month[c][b], and they came to Jerusalem according to the prosperity of the journey given to them by the Lord upon him.
translation:
  language: de
  text: Im siebten Regierungsjahr des Artaxerxes, im fünften Monat,[a] kamen sie in Jerusalem an; denn er war am Neumond des ersten Monats aus Babylon aufgebrochen.[b] Ihre Reise gelang so gut, wie der Herr es ihnen gewährt hatte, dessen Beistand auf ihm ruhte.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Text fügt hier den schwierigen Satz hinzu: „Dieses Jahr war für den König das zweite.“ Das widerspricht der Datierung ins siebte Regierungsjahr und fehlt im hebräischen Paralleltext (Esra 7,6–9); vermutlich ist der Satz entstellt oder an die falsche Stelle geraten.'
    reason: textual_variant
  - marker: b
    text: Der griechische Text wechselt unvermittelt vom Singular („er war … aufgebrochen“) zum Plural („sie kamen … an“). Der hebräische Paralleltext stellt Esra in den Mittelpunkt, nennt im weiteren Verlauf aber auch seine Reisegruppe.
    reason: alternative_reading
  - marker: c
    text: Wörtlich endet der griechische Satz mit „vom Herrn über/auf ihm“. Wahrscheinlich ist gemeint, dass die Gunst oder der Beistand des Herrn auf Esra ruhte; der hebräische Paralleltext spricht entsprechend von der Hand des HERRN, seines Gottes, über ihm.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔτους ἑβδόμου βασιλεύοντος Ἀρταξέρξου
  choice: Im siebten Regierungsjahr des Artaxerxes
  rationale: Die zeitbestimmende Genitivkonstruktion wird knapp und idiomatisch als Regierungsjahr wiedergegeben.
- source_word: ἐν τῷ πέμπτῳ μηνί
  choice: im fünften Monat
  rationale: Direkte und natürliche Wiedergabe der Monatsangabe.
- source_word: ἐξελθόντος ... ἐκ Βαβυλῶνος
  choice: er war ... aus Babylon aufgebrochen
  rationale: Das Partizip steht im Singular und bezeichnet eine der Ankunft vorausgehende Handlung; im Zusammenhang ist Esra gemeint, ohne dass sein Name im griechischen Satz ausdrücklich genannt wird.
- source_word: τῇ νουμηνίᾳ τοῦ πρώτου μηνός
  choice: am Neumond des ersten Monats
  rationale: νουμηνία bezeichnet ausdrücklich den Neumond beziehungsweise den Neumondstag; die Formulierung wahrt den Wortlaut des griechischen Hauptzeugen.
- source_word: παρεγένοντο εἰς Ἰερουσαλήμ
  choice: kamen sie in Jerusalem an
  rationale: Der Plural des griechischen Verbs wird beibehalten; „ankommen“ drückt das erreichte Reiseziel natürlich aus.
- source_word: κατὰ τὴν δοθεῖσαν αὐτοῖς εὐοδίαν
  choice: Ihre Reise gelang so gut, wie ... es ihnen gewährt hatte
  rationale: εὐοδία bezeichnet hier gutes Gelingen beziehungsweise einen günstigen Reiseverlauf. Die verbale deutsche Fassung ist verständlicher als eine schwerfällige nominale Nachbildung.
- source_word: παρὰ τοῦ κυρίου
  choice: der Herr ... ihnen gewährt hatte
  rationale: παρά mit Genitiv bezeichnet die Quelle; im Deutschen passt bei „gewähren“ eine aktive Formulierung mit „der Herr“.
- source_word: ἐπʼ αὐτῷ
  choice: dessen Beistand auf ihm ruhte
  rationale: Die wörtliche räumliche Wendung „auf ihm“ bleibt erkennbar, während „Beistand“ den im Kontext wahrscheinlichen Sinn göttlicher Gunst ausdrückt. Die genaue syntaktische Beziehung wird in der Fußnote offengelegt.
- source_word: οὗτος ἐνιαυτὸς ὁ δεύτερος βασιλεῖ
  choice: nicht im Haupttext wiedergegeben
  rationale: Der überlieferte Satz „Dieses Jahr war für den König das zweite“ widerspricht der unmittelbar vorausgehenden Datierung ins siebte Regierungsjahr und fehlt im hebräischen Paralleltext; er wird deshalb als wahrscheinlich gestörter Text in Fußnote [a] dokumentiert.
theological_decisions:
- issue: Wiedergabe von κύριος bei einem griechischen Text mit hebräischem JHWH-Paralleltext
  choice: der Herr
  alternative: der HERR
  rationale: Der primäre griechische Text hat κύριος. Daher wird die übliche deutsche Entsprechung „Herr“ verwendet, ohne die Schreibweise des hebräischen Gottesnamens aus dem Paralleltext in den Haupttext zu übertragen.
- issue: Deutung von ἐπʼ αὐτῷ als Ausdruck göttlicher Zuwendung
  choice: dessen Beistand auf ihm ruhte
  alternative: 'wörtlich: „über/auf ihm“'
  rationale: Der wahrscheinliche Bezug auf Gottes hilfreiche Gegenwart wird verständlich ausgedrückt, aber die ungewöhnliche und mehrdeutige griechische Formulierung wird in Fußnote [c] ausdrücklich bewahrt.
translation_notes:
  register: 'Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die gestörte Überlieferung wird nicht geglättet, ohne sie kenntlich zu machen: Die problematische Regnaljahresklausel sowie der Wechsel zwischen Singular und Plural werden in den Fußnoten dokumentiert.'
