base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/009.yaml
  text: King Artaxerxes to Ezra the priest and reader of the law of the Lord[a], greetings.
translation:
  language: de
  text: König Artaxerxes grüßt Esra, den Priester und Vorleser des Gesetzes des Herrn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Griechischen steht „Vorleser des Gesetzes des Herrn“; der hebräische Paralleltext in Esra 7,12 hat „Schriftgelehrter des Gesetzes des Gottes des Himmels“.
    reason: alternative_reading
lexical_decisions:
- source_word: Βασιλεὺς
  choice: König
  rationale: Der artikellose Titel steht in einer brieflichen Anschrift unmittelbar vor dem Eigennamen; im Deutschen ist „König Artaxerxes“ natürlich und quellennah.
- source_word: Ἀρταξέρξης
  choice: Artaxerxes
  rationale: Gebräuchliche deutsche Form des persischen Königsnamens.
- source_word: Ἔσρᾳ
  choice: Esra
  rationale: Die griechische Namensform entspricht dem im Deutschen etablierten biblischen Namen Esra.
- source_word: τῷ ἱερεῖ
  choice: den Priester
  rationale: Der Dativ bezeichnet Esra in der Anschrift mit seinem Amt; in der deutschen Satzgestaltung nach „grüßt“ steht der Akkusativ.
- source_word: ἀναγνώστῃ
  choice: Vorleser
  rationale: Das Substantiv bezeichnet einen Leser, besonders jemanden, der vorliest. „Vorleser“ gibt das griechische Wort genauer wieder als eine Angleichung an „Schriftgelehrter“ im hebräischen Paralleltext.
- source_word: τοῦ νόμου
  choice: des Gesetzes
  rationale: Der Genitiv hängt von „Vorleser“ ab und wird direkt wiedergegeben.
- source_word: Κυρίου
  choice: des Herrn
  rationale: Κύριος wird traditionsgemäß und verständlich mit „Herr“ wiedergegeben; der deutsche bestimmte Artikel ist grammatisch erforderlich.
- source_word: χαίρειν
  choice: grüßt
  rationale: In Briefanfängen ist χαίρειν eine feste Grußformel. Die verbale Wiedergabe „grüßt“ bildet zusammen mit Absender und Empfänger eine natürliche deutsche Anschrift.
theological_decisions:
- issue: Griechisch ἀναγνώστῃ gegenüber „Schriftgelehrter“ in Esra 7,12 nach dem hebräischen Text
  choice: Vorleser
  alternative: Schriftgelehrter
  rationale: Für 1 Esdras ist der griechische Text maßgeblich und bezeichnet Esra ausdrücklich als ἀναγνώστης. Der abweichende hebräische Paralleltext wird nicht in den Haupttext eingetragen, sondern in einer Fußnote dokumentiert.
translation_notes:
  register: Moderne, würdevolle Briefsprache. Die griechische Anschrift wird für natürliches Deutsch als vollständiger Satz mit „grüßt“ gestaltet; die ungewöhnliche Amtsbezeichnung „Vorleser“ bleibt zur Wahrung des griechischen Wortlauts erhalten.
