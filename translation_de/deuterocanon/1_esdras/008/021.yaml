base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/021.yaml
  text: Let it be done according to the law of God for God Most High[b][a], so that wrath may not come upon the kingdom of the king and his sons.
translation:
  language: de
  text: Nach dem Gesetz Gottes soll es für Gott, den Höchsten, ausgeführt werden,[a] damit kein Zorn über das Reich des Königs und seiner Söhne kommt.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Nach dem Gesetz Gottes soll es für Gott, den Höchsten, vollzogen werden.“ Das griechische Verb kann die Ausführung, Erfüllung oder den Vollzug des Angeordneten bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Der hebräisch-aramäische Paralleltext in Esra 7,22–23 weicht hier erheblich ab und nennt festgelegte Höchstmengen für den Tempeldienst. 1 Esdras bietet an dieser Stelle eine kürzere griechische Formulierung; die Übersetzung folgt dem griechischen Text als Hauptzeugen.
    reason: textual_variant
lexical_decisions:
- source_word: κατὰ τὸν τοῦ θεοῦ νόμον
  choice: nach dem Gesetz Gottes
  rationale: Gibt die Übereinstimmung mit dem verbindlichen göttlichen Maßstab knapp und natürlich wieder.
- source_word: ἐπιτελεσθήτω
  choice: soll es ausgeführt werden
  rationale: Der passive Imperativ fordert die Durchführung des Angeordneten; die Wiedergabe vermeidet den im Griechischen nicht ausdrücklich enthaltenen Zusatz „genau“.
- source_word: τῷ θεῷ τῷ ὑψίστῳ
  choice: für Gott, den Höchsten
  rationale: Der Dativ bezeichnet hier am natürlichsten den Empfänger beziehungsweise den Bezug des Dienstes. Die Apposition bewahrt die griechische Wortfolge und den Titel.
- source_word: ἕνεκα τοῦ μὴ γενέσθαι
  choice: damit kein … kommt
  rationale: Die Konstruktion bezeichnet den vorbeugenden Zweck und wird im Deutschen idiomatisch mit einem negativen Finalsatz wiedergegeben.
- source_word: ὀργὴν
  choice: Zorn
  rationale: Bewahrt Gewicht und mögliche göttliche Gerichtsandrohung, ohne diese im Haupttext ausdrücklich zu ergänzen.
- source_word: εἰς τὴν βασιλείαν τοῦ βασιλέως καὶ τῶν υἱῶν
  choice: über das Königreich des Königs und seiner Söhne
  rationale: „Über … kommen“ ist eine natürliche deutsche Verbindung für drohenden Zorn; „Söhne“ entspricht der konkreten maskulinen Bezeichnung des griechischen Textes.
theological_decisions:
- issue: Ursprung des angedrohten Zorns
  choice: Der Zorn bleibt im Haupttext ohne ausdrücklich genanntes Subjekt.
  alternative: „Gottes Zorn“ ausdrücklich ergänzen.
  rationale: Der Zusammenhang legt göttlichen Zorn nahe, doch das Griechische nennt Gott in dieser Wendung nicht ausdrücklich als Urheber; die Übersetzung bewahrt diese formale Offenheit.
- issue: Bezug der Handlung auf Gott, den Höchsten
  choice: „für Gott, den Höchsten“
  alternative: „dem höchsten Gott“ beziehungsweise „an Gott, dem Höchsten“
  rationale: „Für“ passt zum administrativ-kultischen Zusammenhang und gibt die Ausrichtung auf Gottes Dienst wieder, ohne eine engere syntaktische Deutung zu erzwingen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung bleibt nahe am Griechischen, ist aber natürlich lesbar. „Königreich des Königs“ erhält die auffällige Wiederholung des Ausgangstextes; „Reich des Königs“ wäre stilistisch glatter, aber lexikalisch weniger transparent.
