base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/045.yaml
  text: And I told them to go to Laddaeus[a], the leader at the place of the treasury[b],
translation:
  language: de
  text: Und ich sagte ihnen, sie sollten zu Laddaios[a] gehen, dem Vorsteher am Ort der Schatzkammer[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Griechischen wird hier nur Laddaios genannt. Der hebräische Parallelbericht in Esra 8,16 führt dagegen mehrere Männer auf, zu denen Esra sendet. Das 1. Esdrasbuch gestaltet den Parallelbericht an dieser Stelle offenbar verkürzt oder abweichend.
    reason: alternative_reading
  - marker: b
    text: 'Auch möglich: „dem Vorsteher des Ortes der Schatzkammer“ oder „dem Verantwortlichen in der Schatzkammer“. Die knappe griechische Formulierung lässt mehrere syntaktische Zuordnungen zu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπα … ἐλθεῖν
  choice: ich sagte ihnen, sie sollten … gehen
  rationale: Der Aorist von λέγω mit dem Infinitiv ἐλθεῖν drückt hier eine Anweisung aus. Die Konstruktion mit „sollten“ gibt dies in natürlichem Deutsch wieder, ohne das stärkere „befahl“ einzutragen.
- source_word: ἐλθεῖν πρὸς
  choice: zu … gehen
  rationale: Die Bewegung richtet sich auf Laddaios. Aus der Erzählperspektive ist „zu … gehen“ im Deutschen idiomatischer als „zu … kommen“.
- source_word: Λαδδαῖον
  choice: Laddaios
  rationale: Der Personenname wird nach der griechischen Nominativform Λαδδαῖος deutsch transliteriert; die überlieferte griechische Form bleibt maßgeblich.
- source_word: τὸν ἡγούμενον
  choice: dem Vorsteher
  rationale: Das substantivierte Partizip bezeichnet neutral einen leitenden beziehungsweise verantwortlichen Mann. „Vorsteher“ vermeidet die unbelegte Festlegung auf ein staatliches Amt.
- source_word: τὸν ἐν τῷ τόπῳ γαζοφυλακίου
  choice: an dem Ort der Schatzkammer
  rationale: Die knappe griechische Wortfolge wird eng nachgebildet. „An dem Ort“ kann sowohl den Aufenthaltsort als auch den Zuständigkeitsbereich des Vorstehers bezeichnen.
- source_word: γαζοφυλακίου
  choice: der Schatzkammer
  rationale: γαζοφυλάκιον bezeichnet eine Schatzkammer beziehungsweise einen Raum zur Aufbewahrung von Wertgegenständen; „Schatzkammer“ ist präzise und verständlich.
