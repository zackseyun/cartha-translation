  register: Modernes, würdevolles Standarddeutsch. Die Befehlsnuance wird idiomatisch durch „sie sollten“ ausgedrückt. Die ungewöhnlich kompakte Orts- und Amtsbezeichnung bleibt im Haupttext bewusst nahe am Griechischen; ihre Mehrdeutigkeit wird in der Fußnote offengelegt.
