  text: And concerning your holy vessels that are being given for the use of the house of your God in Jerusalem,[a]
translation:
  language: de
  text: Und was deine heiligen Gefäße betrifft, die für den Gebrauch im Tempel deines Gottes in Jerusalem übergeben werden,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατὰ
  choice: was … betrifft
  rationale: Die Präposition leitet hier in einem Verwaltungsschreiben den betreffenden Sachverhalt ein; die deutsche Wendung gibt diese thematische Funktion natürlich wieder.
- source_word: τὰ ἱερὰ σκεύη σου
  choice: deine heiligen Gefäße
  rationale: σκεύη bezeichnet Geräte oder Gefäße; ἱερά kennzeichnet sie als dem Kult geheiligt. „Gefäße“ bewahrt die gegenständliche, aber nicht näher bestimmte Bedeutung.
- source_word: τὰ διδόμενα
  choice: die … übergeben werden
  rationale: Das präsentische Passivpartizip beschreibt die Gefäße als solche, die zurzeit ausgehändigt beziehungsweise übergeben werden. „Übergeben“ passt zum administrativen Zusammenhang.
- source_word: εἰς τὴν χρείαν
  choice: für den Gebrauch
  rationale: χρεία bezeichnet hier Zweck, Verwendung oder praktischen Bedarf; „für den Gebrauch“ ist präzise und idiomatisch.
- source_word: τοῦ ἱεροῦ
  choice: im Tempel
  rationale: ἱερόν bezeichnet unmittelbar den Tempel beziehungsweise Tempelbezirk. Da der griechische Text die primäre Übersetzungsgrundlage ist, wird nicht die semitische Parallelformulierung „Haus“ übernommen.
- source_word: τοῦ θεοῦ σου τοῦ ἐν Ἰερουσαλήμ
  choice: deines Gottes in Jerusalem
  rationale: Die Genitivfolge ordnet den Tempel dem angesprochenen „deinem Gott“ zu und lokalisiert ihn in Jerusalem; die knappe deutsche Form ist natürlich und erhält den Bezug.
