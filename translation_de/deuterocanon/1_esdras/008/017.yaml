translation_notes:
  register: Moderner, würdiger Verwaltungsstil. Der Vers bleibt wie im griechischen Ausgangstext syntaktisch ein Satzglied, das in den weiteren Kontext hineinführt. „Heilige Gefäße“ wahrt die kultische Sprache, während „Tempel“ den griechischen Primärtext genauer abbildet als „Haus“.
