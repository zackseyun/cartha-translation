base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/071.yaml
  text: Lord[a], I am ashamed and disgraced before your face.
translation:
  language: de
  text: Herr, ich schäme mich und bin beschämt vor deinem Angesicht.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „vor deinem Gesicht“; auch: „vor dir“ oder „in deiner Gegenwart“.'
    reason: Die Fußnote erklärt die konkrete, semitisch geprägte Wendung und nennt natürliche deutsche Alternativen.
lexical_decisions:
- source_word: Κύριε
  choice: Herr
  rationale: Der Vokativ von κύριος ist eine direkte Anrede an Gott. „Herr“ ist im modernen Standarddeutsch natürlich und bewahrt den feierlichen Gebetscharakter.
- source_word: ᾔσχυμμαι
  choice: ich schäme mich
  rationale: Die Perfektform bezeichnet einen gegenwärtigen, aus der Beschämung hervorgegangenen Zustand. „Ich schäme mich“ gibt diesen Zustand idiomatisch und unmittelbar wieder.
- source_word: ἐντέτραμμαι
  choice: bin beschämt
  rationale: Die zweite Perfektform verstärkt die Aussage durch einen verwandten Ausdruck von Scham und Beschämung. „Bin beschämt“ bewahrt die bewusste Doppelung, ohne eine von außen bewirkte Erniedrigung festzulegen.
- source_word: κατὰ πρόσωπόν σου
  choice: vor deinem Angesicht
  rationale: Die Wendung bezeichnet das unmittelbare Stehen in Gottes Gegenwart und behält zugleich das konkrete Bild des griechischen, semitisch geprägten Ausdrucks bei.
theological_decisions:
- issue: Wiedergabe der göttlichen Anrede Κύριε
  choice: Herr
  alternative: O Herr
  rationale: Das Griechische enthält den Vokativ, aber keine eigene Interjektion, die im Deutschen zwingend mit „O“ wiederzugeben wäre. „Herr“ wahrt direkte Anrede und Würde.
- issue: Konkretheit von κατὰ πρόσωπόν σου
  choice: vor deinem Angesicht
  alternative: vor dir / in deiner Gegenwart
  rationale: Die konkrete Formulierung bewahrt die Aussage, dass der Beter unmittelbar vor Gott steht, statt das Bild durch eine abstraktere Paraphrase einzuebnen.
- issue: Verhältnis der beiden Schamverben
  choice: ich schäme mich und bin beschämt
  alternative: ich schäme mich und bin gedemütigt
  rationale: Die griechischen Verben sind bedeutungsnah und bilden eine intensive Doppelung. Die Übersetzung erhält diese Nähe und vermeidet es, mit „gedemütigt“ eine ausdrücklich äußere Erniedrigung einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die bewusste Wiederholung von „schämen“ und „beschämt“ spiegelt die beiden bedeutungsnahen griechischen Perfektformen; „Angesicht“ erhält das konkrete Gebetsbild, obwohl es gehobener als „Gesicht“ ist.
