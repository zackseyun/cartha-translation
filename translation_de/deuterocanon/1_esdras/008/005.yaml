base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/005.yaml
  text: And some of the sons of Israel[a], and of the priests, Levites, temple singers, gatekeepers, and temple servants, went up to Jerusalem[b],
translation:
  language: de
  text: Und einige aus den Söhnen Israels[a] sowie aus den Priestern, Leviten, Tempelsängern, Torwächtern und Tempeldienern[b] zogen gemeinsam nach Jerusalem hinauf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Israeliten“. Wörtlich heißt es im Griechischen: „Söhne Israels“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Tempelsklaven“. Der griechische Ausdruck kann Menschen bezeichnen, die in gebundenem Dienst für ein Heiligtum stehen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: συνανέβησαν
  choice: zogen einige gemeinsam … hinauf
  rationale: Das Verb bezeichnet ein gemeinsames Hinaufziehen. „Nach Jerusalem hinaufziehen“ entspricht dem biblischen Reiseidiom; „gemeinsam“ gibt die συν-Komponente wieder.
- source_word: ἐκ τῶν υἱῶν Ἰσραήλ
  choice: von den Söhnen Israels … einige
  rationale: Die Konstruktion mit ἐκ bezeichnet Personen, die aus der genannten Gruppe stammen. Die deutsche Satzstellung macht diesen partitiven Sinn verständlich und bewahrt zugleich die wörtliche familiäre Bezeichnung.
- source_word: ἱερέων
  choice: Priestern
  rationale: Die übliche deutsche Bezeichnung für die priesterliche Gruppe.
- source_word: Λευειτῶν
  choice: Leviten
  rationale: Die etablierte deutsche Wiedergabe der levitischen Gruppe.
- source_word: ἱεροψαλτῶν
  choice: Tempelsängern
  rationale: Das Kompositum bezeichnet Sänger im heiligen beziehungsweise kultischen Dienst; „Tempelsänger“ ist im Deutschen klar und prägnant.
- source_word: θυρωρῶν
  choice: Torwächtern
  rationale: Bezeichnet die für die Tore zuständigen Wächter oder Hüter; „Torwächter“ ist eine natürliche moderne Wiedergabe.
- source_word: ἱεροδούλων
  choice: Tempeldienern
  rationale: Der Ausdruck bezeichnet Personen, die dem Tempeldienst zugeordnet sind. „Tempeldiener“ gibt ihre institutionelle Funktion wieder, ohne ihren rechtlichen Status stärker festzulegen, als es der Zusammenhang erlaubt.
- source_word: εἰς Ἰερουσαλήμ
  choice: nach Jerusalem
  rationale: Natürliche deutsche Richtungsangabe bei Städtenamen.
theological_decisions:
- issue: Wiedergabe von υἱῶν Ἰσραήλ in der Liste der Hinaufziehenden
  choice: Söhne Israels
  alternative: Israeliten
  rationale: Die Hauptfassung bewahrt die konkrete familiär-korporative Ausdrucksweise des Griechischen. „Israeliten“ ist als idiomatische, geschlechtsübergreifend verstandene Alternative in der Fußnote angegeben.
- issue: Wiedergabe von ἱερόδουλοι
  choice: Tempeldiener
  alternative: Tempelsklaven
  rationale: Im Zusammenhang einer Liste von Gruppen im Tempeldienst bezeichnet „Tempeldiener“ die erkennbare Funktion, ohne einen bestimmten Rechtsstatus vorauszusetzen. Da das Grundwort δοῦλος jedoch einen unfreien oder gebundenen Status ausdrücken kann, bleibt die stärkere Alternative in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung von „von“ verdeutlicht die partitive Listenstruktur; „einige“ wird im Deutschen ergänzt, um den durch ἐκ ausgedrückten Sinn natürlich wiederzugeben. Die Fußnotenmarker stehen unmittelbar bei den jeweils erläuterten Ausdrücken.
