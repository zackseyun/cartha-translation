base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/025.yaml
  text: Blessed be the Lord alone[a], who put these things into the heart of the king,
translation:
  language: de
  text: Gepriesen sei allein der Herr, der dies dem König ins Herz gelegt hat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der überlieferte griechische Wortlaut ist hier schwierig; wörtlich steht etwa „in das Herz von mir/des Königs“. Wahrscheinlich ist gemeint, dass Gott dem König diesen Entschluss ins Herz legte.
    reason: textual_variant
lexical_decisions:
- source_word: εὐλογητὸς
  choice: Gepriesen sei
  rationale: Das prädikative Adjektiv steht in einer Segens- und Lobformel; „Gepriesen sei“ gibt diesen Ausruf im Deutschen würdig und natürlich wieder.
- source_word: μόνος
  choice: allein
  rationale: „Allein“ bewahrt die ausschließende Betonung des griechischen μόνος, ohne festzulegen, ob sie vorrangig die einzigartige Würdigkeit des Herrn oder sein alleiniges Handeln hervorhebt.
- source_word: ὁ κύριος
  choice: der Herr
  rationale: Die übliche und kontextgemäße Wiedergabe des göttlichen Titels κύριος lautet „der Herr“.
- source_word: ὁ δοὺς
  choice: der … gelegt hat
  rationale: δίδωμι bedeutet wörtlich „geben“, bildet mit εἰς τὴν καρδίαν jedoch die idiomatische Wendung, jemandem etwas ins Herz zu legen.
- source_word: ταῦτα
  choice: dies
  rationale: Das griechische Neutrum Plural kann im natürlichen Deutschen zusammenfassend mit „dies“ wiedergegeben werden; der Bezug bleibt ebenso offen wie im Ausgangstext.
- source_word: εἰς τὴν καρδίαν
  choice: ins Herz
  rationale: Die Formulierung bewahrt das Bild einer inneren Eingebung oder eines eingegebenen Entschlusses und ist zugleich idiomatisches Deutsch.
- source_word: μου τοῦ βασιλέως
  choice: dem König
  rationale: Die überlieferte Wortfolge ist syntaktisch schwierig. Der Zusammenhang legt nahe, dass der Herr dem König den betreffenden Entschluss ins Herz gab; die Unsicherheit wird in einer Fußnote offengelegt.
theological_decisions:
- issue: Exklusivität von μόνος in der Lobformel
  choice: allein der Herr
  alternative: der Herr allein / einzig der Herr
  rationale: Die Stellung bewahrt die Exklusivität der griechischen Aussage, ohne sie unnötig dogmatisch auszudeuten.
- issue: Deutung der schwierigen Folge μου τοῦ βασιλέως
  choice: dem König ins Herz
  alternative: in mein Herz / in das Herz meines Herrn, des Königs
  rationale: Die gewählte Fassung gibt den wahrscheinlich gemeinten Vorgang verständlich wieder, während die Fußnote die erhebliche syntaktische Schwierigkeit des überlieferten Griechisch ausdrücklich festhält.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die Segensformel bleibt knapp; die schwer verständliche griechische Syntax wird nicht in den Haupttext übernommen, sondern transparent in der Fußnote dokumentiert.
