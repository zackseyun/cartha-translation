base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/068.yaml
  text: And as soon as I heard these things[a], I tore my garments and the holy robe, and I pulled out hair from my head and beard[b], and I sat down stunned and deeply grieved.
translation:
  language: de
  text: Und sobald ich das hörte, zerriss ich meine Gewänder und das heilige Gewand[a], riss mir Haare vom Kopf und aus dem Bart und setzte mich wie betäubt[b] und tief betrübt hin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das geheiligte Gewand“; möglicherweise ist ein amtliches Priestergewand gemeint, doch der griechische Text sagt dies nicht ausdrücklich.'
    reason: lexical_alternative
  - marker: b
    text: „Wie betäubt“ kann hier auch mit „fassungslos“ oder „bestürzt“ wiedergegeben werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἅμα τῷ ἀκοῦσαί με ταῦτα
  choice: sobald ich das hörte
  rationale: Die Konstruktion bezeichnet die unmittelbar auf das Hören folgende Reaktion; die deutsche Wendung ist natürlich und bewahrt diese zeitliche Unmittelbarkeit.
- source_word: ἔρρηξα τὰ ἱμάτια
  choice: zerriss ich meine Gewänder
  rationale: Das Zerreißen der Kleidung als Ausdruck der Trauer wird klar wiedergegeben. Das im Deutschen idiomatisch nötige Possessivpronomen ist aus dem Zusammenhang ergänzt.
- source_word: τὴν ἱερὰν ἐσθῆτα
  choice: das heilige Gewand
  rationale: Die Übersetzung bewahrt die ausdrücklich bezeichnete Heiligkeit des Gewandes, ohne es enger als Priestergewand zu bestimmen.
- source_word: κατέτειλον τοῦ τριχώματος τῆς κεφαλῆς καὶ τοῦ πώγωνος
  choice: riss mir Haare vom Kopf und aus dem Bart
  rationale: Die Formulierung gibt das gewaltsame Entfernen von Haar als Zeichen tiefen Entsetzens anschaulich und idiomatisch wieder.
- source_word: σύννους
  choice: wie betäubt
  rationale: Das Wort bezeichnet einen Zustand mentaler Erschütterung oder Fassungslosigkeit; „wie betäubt“ trifft diesen negativen Kontext besser als das möglicherweise neutrale „erstaunt“.
- source_word: περίλυπος
  choice: tief betrübt
  rationale: Die Wiedergabe drückt die vom griechischen Ausdruck bezeichnete starke Trauer in geläufigem, würdigem Deutsch aus.
theological_decisions:
- issue: Bestimmung von τὴν ἱερὰν ἐσθῆτα
  choice: das heilige Gewand
  alternative: das Priestergewand
  rationale: Der griechische Text nennt das Gewand heilig, legt seine genaue amtliche Funktion jedoch nicht ausdrücklich fest. Die Übersetzung vermeidet daher eine unnötige priesteramtliche Präzisierung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Trauergesten werden anschaulich, aber ohne altertümliche Wendungen wiedergegeben. Beide Fußnotenmarker stehen im Haupttext; Marker [b] ist an die Wendung gesetzt, auf die sich die entsprechende Anmerkung bezieht.
