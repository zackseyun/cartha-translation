base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/031.yaml
  text: From the sons of Pahath-moab[a], Eliaonias son of Zareou, and with him two hundred men;
translation:
  language: de
  text: 'Von den Nachkommen Pahat-Moabs: Elialonias, Sohn des Zareu[a], und mit ihm zweihundert Männer;'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der griechische Text hat „Elialonias, Sohn des Zareu“; im hebräischen Paralleltext in Esra 8,4 steht „Elihoenai, Sohn Serachjas“.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκ τῶν Μααθμωάβ
  choice: Von den Nachkommen Pahat-Moabs
  rationale: Die griechische Namensform Μααθμωάβ bezeichnet hier im Licht des ungefähren hebräischen Paralleltexts die Sippe Pahat-Moab. „Nachkommen“ gibt die Zugehörigkeit in einer modernen deutschen Personenliste natürlicher wieder als das wörtliche „Söhne“.
- source_word: Ἐλιαλωνίας
  choice: Elialonias
  rationale: Der Personenname wird nach dem vorrangigen griechischen Text transliteriert; die abweichende hebräische Namensform wird in der Fußnote bewahrt.
- source_word: Ζαραιου
  choice: Saraius
  rationale: Der griechische Genitiv Ζαραιου wird als „Sohn Saraius“ wiedergegeben, mit einer im Deutschen lesbaren, griechisch orientierten Namensform. Die abweichende hebräische Form wird in der Fußnote genannt.
- source_word: καὶ μετʼ αὐτοῦ
  choice: und mit ihm
  rationale: Die schlichte Präpositionalfügung erhält die knappe Struktur der Aufzählung.
- source_word: ἄνδρες διακόσιοι
  choice: zweihundert Männer
  rationale: Dies entspricht unmittelbar dem griechischen Wortlaut und passt zum Kontext einer Aufstellung von Rückkehrern.
