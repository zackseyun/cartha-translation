base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/074.yaml
  text: And because of our sins and the sins of our fathers[a], we were handed over, together with our brothers, our kings, and our priests, to the kings of the earth, to the sword and captivity and plundering with shame[b], to this present day.
translation:
  language: de
  text: 'Und wegen unserer Sünden und der Sünden unserer Väter wurden wir zusammen mit unseren Brüdern, unseren Königen und unseren Priestern den Königen der Erde[a] ausgeliefert: dem Schwert, der Gefangenschaft und der Plünderung[b] mit Schande – bis zum heutigen Tag.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den Königen des Landes“. Das griechische Wort γῆ kann „Erde“ oder „Land“ bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „dem Raub“ beziehungsweise „der Preisgabe zur Plünderung“. Das griechische Wort bezeichnet das Ausplündern oder die dabei erlangte Beute.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τὰς ἁμαρτίας ἡμῶν καὶ τῶν πατέρων ἡμῶν
  choice: wegen unserer Sünden und der Sünden unserer Väter
  rationale: διά mit Akkusativ bezeichnet hier den Grund. „Wegen“ gibt die kausale Aussage knapp und natürlich wieder; die ausdrückliche Nennung der gegenwärtigen Gemeinschaft und ihrer Vorfahren bleibt erhalten.
- source_word: παρεδόθημεν
  choice: wurden wir … ausgeliefert
  rationale: Das Passiv von παραδίδωμι bezeichnet die Übergabe in fremde Gewalt. „Ausgeliefert“ bewahrt sowohl die Härte des Vorgangs als auch seinen gerichtlichen Klang.
- source_word: σὺν τοῖς ἀδελφοῖς ἡμῶν
  choice: zusammen mit unseren Brüdern
  rationale: ἀδελφοί bedeutet wörtlich „Brüder“ und kann im nationalen Zusammenhang die israelitischen Volksgenossen bezeichnen. Die konkrete Formulierung des Griechischen wird beibehalten.
- source_word: σὺν τοῖς βασιλεῦσιν ἡμῶν καὶ σὺν τοῖς ἱερεῦσιν ἡμῶν
  choice: unseren Königen und unseren Priestern
  rationale: Die Gruppen werden parallel zu „unseren Brüdern“ koordiniert. Im Deutschen genügt das einmalige „zusammen mit“, ohne den Einschluss einer Gruppe abzuschwächen.
- source_word: τοῖς βασιλεῦσιν τῆς γῆς
  choice: den Königen der Erde
  rationale: γῆ kann „Erde“ oder „Land“ bedeuten. Im Zusammenhang ausländischer Herrscher ist „Könige der Erde“ eine natürliche biblische Wendung; die engere Möglichkeit wird in einer Fußnote genannt.
- source_word: εἰς ῥομφαίαν
  choice: dem Schwert
  rationale: ῥομφαία bezeichnet ein Schwert und steht hier metonymisch für gewaltsamen Tod. Nach „ausgeliefert“ lässt sich die griechische εἰς-Reihe im Deutschen idiomatisch mit dem Dativ fortführen.
- source_word: αἰχμαλωσίαν
  choice: der Gefangenschaft
  rationale: Das Wort bezeichnet den Zustand beziehungsweise das Los der Verschleppung als Gefangene. „Gefangenschaft“ wahrt diesen Sinn, ohne ihn vorschnell auf den umfassenderen Begriff „Exil“ festzulegen.
- source_word: προνομὴν
  choice: der Plünderung
  rationale: προνομή bezeichnet Plünderung, Raub oder Beute. „Plünderung“ ist im modernen Deutsch unmittelbar verständlich und passt zur Reihe der erlittenen Gerichte.
- source_word: μετὰ αἰσχύνης
  choice: unter Schande
  rationale: Die Wendung drückt die mit dem Geschick verbundene öffentliche Erniedrigung aus. „Unter Schande“ lässt offen, ob sie besonders auf die Plünderung oder auf die gesamte vorausgehende Not bezogen ist.
- source_word: μέχρι τῆς σήμερον ἡμέρας
  choice: bis zum heutigen Tag
  rationale: Die feste Wendung betont, dass die geschilderte Lage bis in die Gegenwart des Sprechers fortbesteht.
theological_decisions:
- issue: Gemeinschaftliche Schuld über Generationen hinweg
  choice: „unsere Sünden und die Sünden unserer Väter“ wird ausdrücklich beibehalten.
  alternative: Die Aussage könnte verallgemeinernd als „unsere Sünden und die Sünden derer vor uns“ wiedergegeben werden.
  rationale: Der griechische Text nennt sowohl die gegenwärtige Gemeinschaft als auch ihre Väter als Ursache des Gerichts. Diese Spannung gemeinschaftlicher und generationenübergreifender Verantwortung darf nicht abgeschwächt werden.
- issue: Reichweite der Schande
  choice: „unter Schande“ steht nach der gesamten Reihe und bleibt syntaktisch offen.
  alternative: 'Die Wendung könnte enger nur mit „Plünderung“ verbunden werden: „Plünderung samt Schande“.'
  rationale: Die griechische Stellung nach προνομή erlaubt einen engen Bezug, doch inhaltlich kann die Schande auch das gesamte Los von Schwert, Gefangenschaft und Plünderung kennzeichnen. Die deutsche Fassung entscheidet diese Mehrdeutigkeit nicht unnötig.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Aufzählung behält den feierlichen Klagecharakter des griechischen Textes, während „ausgeliefert“ und „bis zum heutigen Tag“ heutigen Leserinnen und Lesern unmittelbar verständlich bleiben. Der Gedankenstrich vor dem Schlussglied hebt das Fortdauern des Zustands hervor, ohne zusätzliche Deutung einzutragen.
