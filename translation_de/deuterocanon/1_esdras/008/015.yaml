base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/015.yaml
  text: so as to bring sacrifices upon the altar of their Lord[a], the one in Jerusalem.
translation:
  language: de
  text: um Opfer auf dem Altar ihres Herrn[a] darzubringen, dem Altar in Jerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der aramäische Paralleltext spricht in diesem Zusammenhang vom „Haus ihres Gottes, das in Jerusalem ist“. Damit bestätigt er, dass Israels Gott gemeint ist; der griechische Text lautet hier jedoch ausdrücklich: „der Altar ihres Herrn, der in Jerusalem ist“.'
    reason: Abweichende Lesart des Paralleltextes und Klärung des Bezugsworts
lexical_decisions:
- source_word: ὥστε
  choice: um … zu
  rationale: Die deutsche Infinitivkonstruktion gibt den hier naheliegenden Zweck natürlich wieder, ohne einen tatsächlich eingetretenen Erfolg zu behaupten.
- source_word: προσενεγκεῖν
  choice: darzubringen
  rationale: Im kultischen Zusammenhang bezeichnet das Verb das Heranbringen beziehungsweise Darbringen eines Opfers; „darbringen“ ist im Deutschen präzise und idiomatisch.
- source_word: θυσίας
  choice: Opfer
  rationale: „Opfer“ ist die geläufige deutsche Wiedergabe des kultischen Plurals und kann hier kollektiv beziehungsweise als Mehrzahl verstanden werden.
- source_word: ἐπὶ τὸ θυσιαστήριον
  choice: auf dem Altar
  rationale: Die Wendung bezeichnet die auf den Altar gerichtete Opferhandlung. Natürliches Deutsch verwendet bei „Opfer darbringen“ hier „auf dem Altar“.
- source_word: τοῦ κυρίου αὐτῶν
  choice: ihres Herrn
  rationale: Die Übersetzung hält sich an den griechischen Wortlaut mit κύριος und αὐτῶν und ergänzt nicht das im aramäischen Paralleltext stehende „Gott“.
- source_word: τὸ ἐν Ἰερουσαλήμ
  choice: dem Altar in Jerusalem
  rationale: Das substantivierte Präpositionalattribut nimmt den Altar wieder auf. Die explizite Wiederholung verhindert im Deutschen eine mögliche falsche Zuordnung zu „Herrn“.
theological_decisions:
- issue: Wiedergabe von κύριος im kultischen Kontext
  choice: Herr
  alternative: Gebieter
  rationale: Im Tempelkontext ist κύριος ein ehrfürchtiger Titel für Israels Gott; „Herr“ ist dafür die natürliche und traditionsübergreifend verständliche Wiedergabe.
- issue: Griechischer Wortlaut gegenüber dem abweichenden aramäischen Paralleltext
  choice: „ihres Herrn“ im Haupttext
  alternative: „ihres Gottes“
  rationale: Der griechische Primärtext nennt ausdrücklich „ihren Herrn“. Der aramäische Paralleltext bestätigt zwar den Gottesbezug, rechtfertigt aber nicht, θεός in den griechischen Wortlaut einzutragen; die Abweichung wird deshalb in der Fußnote dokumentiert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Darbringen“ bewahrt den kultischen Sinn, ohne unnötig altertümlich zu wirken. Die Wiederholung „dem Altar“ löst die im Griechischen grammatisch klare, im Deutschen aber sonst missverständliche Rückbeziehung auf.
