base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/079.yaml
  text: And now what shall we say[a], Lord, having these things? They have transgressed your commandments[b], which you gave by the hand of your servants the prophets.
translation:
  language: de
  text: Und nun, was sollen wir sagen, Herr, da wir dies alles haben?[a] Sie haben deine Gebote übertreten, die du durch die Hand deiner Diener, der Propheten, gegeben hast.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die griechische Wendung „da wir dies alles haben“ ist knapp; sie verweist wahrscheinlich auf die zuvor im Gebet genannten Gaben oder Umstände.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich „durch die Hand deiner Diener, der Propheten“; sinngemäß: „durch deine Diener, die Propheten“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ νῦν
  choice: Und nun
  rationale: Bewahrt sowohl die verbindende Kraft von καί als auch den Übergang zu einer erneuten, feierlichen Frage im Gebet.
- source_word: τί ἐροῦμεν
  choice: was sollen wir sagen
  rationale: Gibt die rhetorische Frage im Futur natürlich und mit ihrem abwägenden, ernsten Ton wieder.
- source_word: Κύριε
  choice: Herr
  rationale: Direkte vokativische Anrede; eine zusätzliche Interjektion wie „o“ ist im Griechischen nicht vorhanden.
- source_word: ἔχοντες αὐτά
  choice: da wir dies alles haben
  rationale: Die knappe und in ihrem Bezug offene Partizipialwendung bleibt weitgehend unbestimmt. „Dies alles“ gibt das neutrale Pluralpronomen idiomatisch wieder, ohne seinen Rückbezug genauer festzulegen.
- source_word: παρέβησαν
  choice: Sie haben … übertreten
  rationale: Die dritte Person Plural wird ausdrücklich beibehalten. „Übertreten“ wahrt die moralisch-rechtliche Bedeutung des Verbs.
- source_word: τὰ προστάγματά σου
  choice: deine Gebote
  rationale: „Gebote“ ist in diesem Bundes- und Gesetzeskontext klar, würdig und für heutige Leser unmittelbar verständlich.
- source_word: ἃ ἔδωκας
  choice: die du … gegeben hast
  rationale: Direkte Wiedergabe von δίδωμι; die anschließende Wendung bezeichnet die vermittelnde Weitergabe.
- source_word: ἐν χειρὶ
  choice: durch die Hand
  rationale: Bewahrt die biblische Vermittlungsformel des griechischen Textes; eine idiomatischere Alternative wird in der Fußnote genannt.
- source_word: τῶν παίδων σου τῶν προφητῶν
  choice: deiner Diener, der Propheten
  rationale: παῖς bezeichnet hier im Zusammenhang prophetischer Beauftragung „Diener“. Die Apposition „der Propheten“ bleibt sichtbar.
theological_decisions:
- issue: Unausgesprochenes Subjekt von παρέβησαν
  choice: Sie haben … übertreten
  alternative: Wir haben … übertreten
  rationale: Das griechische Verb steht in der dritten Person Plural. Obwohl Esra sich im Gebetszusammenhang mit dem Volk identifiziert, darf die grammatische Perspektive dieses Satzes nicht in die erste Person geändert werden.
- issue: Biblische Vermittlungsformel ἐν χειρὶ
  choice: durch die Hand deiner Diener
  alternative: durch deine Diener
  rationale: Die gewählte Fassung erhält das konkrete biblische Sprachbild, ohne eine besondere Lehraussage über die Art prophetischer Vermittlung hinzuzufügen.
- issue: Offener Bezug von ἔχοντες αὐτά
  choice: da wir dies alles haben
  alternative: angesichts all dessen
  rationale: Der griechische Rückbezug ist knapp und nicht ausdrücklich bestimmt. Die Übersetzung lässt offen, ob die zuvor genannten Gaben, Umstände oder beides gemeint sind.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht biblischem Klang. Die ungewöhnliche Formel „durch die Hand“ wurde wegen ihrer Bedeutung als Vermittlungsformel beibehalten und erläutert. Die Zeichensetzung macht „der Propheten“ als Apposition zu „deiner Diener“ deutlich.
