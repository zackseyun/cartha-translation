  - marker: b
    text: Der griechische Text wechselt von »wir lagerten« zu »ich musterte«. Dieser Personenwechsel wird in der Übersetzung beibehalten.
    reason: alternative_reading
lexical_decisions:
- source_word: συναγαγών
  choice: Nachdem ich sie … versammelt hatte
  rationale: Das Aoristpartizip bezeichnet eine der Haupthandlung vorausgehende Handlung. Die finite deutsche Form gibt Abfolge und das im Kontext vorausgesetzte Ich-Subjekt natürlich wieder.
- source_word: ἐπὶ τὸν λεγόμενον Ποταμόν
  choice: an dem Fluss, der »der Fluss« genannt wird
  rationale: λεγόμενον bedeutet »genannt«; Ποταμόν heißt wörtlich »Fluss«, dürfte hier aber zugleich eine Orts- oder Gewässerbezeichnung sein. Die auffällige griechische Formulierung bleibt daher erhalten.
- source_word: παρενεβάλομεν
  choice: lagerten wir
  rationale: Das Verb bezeichnet das Aufschlagen eines Lagers. »lagerten wir« ist knapp, würdig und im modernen Deutschen natürlich.
- source_word: αὐτόθι
  choice: dort
  rationale: Direkte und natürliche Wiedergabe des Ortsadverbs.
- source_word: ἡμέρας τρεῖς
  choice: drei Tage lang
  rationale: Der Akkusativ drückt eine Zeitdauer aus; »drei Tage lang« macht dies idiomatisch deutlich.
- source_word: κατέμαθον αὐτούς
  choice: ich musterte sie
  rationale: καταμανθάνω kann ein genaues Betrachten oder Prüfen bezeichnen. Im Zusammenhang geht es um die Überprüfung der versammelten Gruppe; »musterte« ist prägnant und bewahrt den Wechsel zur ersten Person Singular.
theological_decisions:
- issue: Wechsel der Erzählperson innerhalb des Verses
  choice: Den Wechsel von »wir lagerten« zu »ich musterte« beibehalten.
  alternative: Zur stilistischen Angleichung »wir musterten sie« übersetzen.
  rationale: Der griechische Text wechselt ausdrücklich von der ersten Person Plural zur ersten Person Singular. Die Übersetzung harmonisiert diesen Wechsel nicht.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die ungewöhnliche Bezeichnung »der Fluss« und der Wechsel zwischen Wir- und Ich-Erzählung werden quellennah bewahrt.
