  text: And after gathering them to the river called the River[a], we camped there for three days[b], and I examined them.
translation:
  language: de
  text: Nachdem ich sie zu dem Fluss zusammengeführt hatte, der »der Fluss« genannt wird[a], lagerten wir dort drei Tage lang, und ich musterte sie[b].
  philosophy: optimal-equivalence
  footnotes:
