  text: Likewise[b][a], up to one hundred cors of wheat and one hundred measures of wine.
translation:
  language: de
  text: Ebenso[a] bis zu hundert Kor Weizen und hundert Maß Wein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Vgl. Esra 7,22. Dort erscheinen diese Angaben als festgesetzte Höchstmengen. Ein Kor war ein großes Trockenmaß; das hier mit „Maß“ wiedergegebene griechische Wort bezeichnet ein Flüssigkeitsmaß.
    reason: Sachhinweis und Querverweis zur Erklärung der antiken Maße und des administrativen Zusammenhangs.
lexical_decisions:
- source_word: ὁμοίως
  choice: Ebenso
  rationale: Bewahrt die knappe additive Verknüpfung mit der vorausgehenden Aufzählung.
- source_word: ἕως
  choice: bis zu
  rationale: Kennzeichnet in diesem Verwaltungskontext eine Mengenobergrenze.
- source_word: πυροῦ
  choice: Weizen
  rationale: πυρός bezeichnet hier spezifisch Weizen, nicht Getreide allgemein.
- source_word: κόρων ἑκατόν
  choice: hundert Kor
  rationale: Kor gibt die ausdrücklich genannte antike Trockenmaßeinheit wieder, ohne sie in ein unspezifisches Maß aufzulösen.
- source_word: οἴνου
  choice: Wein
  rationale: Direkte und kontextgemäße Wiedergabe.
- source_word: μετρητῶν ἑκατόν
  choice: hundert Maß
  rationale: Das griechische μετρητής bezeichnet ein Flüssigkeitsmaß, nennt hier aber nicht ausdrücklich die spezifischere Einheit Bat; daher bleibt die Übersetzung beim quellennahen „Maß“.
