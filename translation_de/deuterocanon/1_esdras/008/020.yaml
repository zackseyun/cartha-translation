translation_notes:
  register: Knappes, würdevolles Standarddeutsch. Die elliptische Form der griechischen Aufzählung bleibt erhalten. „Kor“ bewahrt die konkrete antike Einheit; „Maß“ vermeidet es, gegen den Wortlaut des griechischen Hauptzeugen die spezifische Einheit „Bat“ in den Haupttext einzutragen.
