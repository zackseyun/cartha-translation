base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/066.yaml
  text: The rulers and the priests and the Levites have not separated themselves from the foreign nations of the land, with their uncleannesses—from the Canaanites and Hittites and Perizzites and Jebusites and Moabites and Egyptians and Edomites.
translation:
  language: de
  text: 'Auch die Obersten, die Priester und die Leviten haben sich nicht von den fremden Völkern des Landes mit ihren Unreinheiten abgesondert[a]: von den Kanaanitern, Hetitern, Perisitern, Jebusitern, Moabitern, Ägyptern und Edomitern.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Wortlaut ist stark gedrängt. Die genaue syntaktische Beziehung von „mit ihren Unreinheiten“ zu „den fremden Völkern des Landes“ bleibt offen. Möglich ist auch: „haben sich nicht von den fremden Völkern des Landes und ihren Unreinheiten abgesondert“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐκ ἐχώρισαν
  choice: haben sich nicht … abgesondert
  rationale: Das Perfekt passt zum berichtenden Zusammenhang und gibt den aus dem Kontext erschlossenen reflexiven Sinn wieder. „Absondern“ bewahrt zudem den religiös-ethischen Klang der Trennung.
- source_word: οἱ ἄρχοντες
  choice: die Obersten
  rationale: ἄρχοντες bezeichnet Amtsträger oder Personen mit öffentlicher Autorität. „Obersten“ ist im biblisch-historischen Zusammenhang präziser als das allgemeinere „Führenden“ und vermeidet die monarchische Nebenbedeutung von „Herrscher“.
- source_word: οἱ ἱερεῖς
  choice: die Priester
  rationale: Die geläufige und genaue deutsche Entsprechung.
- source_word: οἱ Λευεῖται
  choice: die Leviten
  rationale: Die übliche Bezeichnung der kultisch und stammesgeschichtlich bestimmten Gruppe.
- source_word: ἀλλογενῆ ἔθνη
  choice: die fremden Völker
  rationale: Die Wendung bezeichnet nichtisraelitische Volksgruppen. „Fremde Völker“ ist verständlich und vermeidet moderne rassische Kategorien.
- source_word: τῆς γῆς
  choice: des Landes
  rationale: γῆ meint hier das örtliche Land, nicht die gesamte Erde.
- source_word: ἀκαθαρσίας αὐτῶν
  choice: deren Unreinheiten
  rationale: „Unreinheiten“ erhält den kultisch-moralischen Bedeutungsbereich von ἀκαθαρσία. „Deren“ ordnet die Unreinheiten den fremden Völkern zu, ohne sie in der Übersetzung näher zu definieren.
- source_word: Χαναναίων … Ἰδουμαίων
  choice: von den Kanaanitern … und Edomitern
  rationale: Die Genitivreihe erläutert die zuvor genannten fremden Völker. Das deutsche „von“ bindet die Aufzählung natürlich an „abgesondert“ an; Ἰδουμαῖοι wird traditionsgemäß mit „Edomiter“ wiedergegeben.
theological_decisions:
- issue: Charakter der Unreinheit
  choice: Unreinheiten
  alternative: Gräuel; Verunreinigungen
  rationale: „Unreinheiten“ bewahrt die kultisch-moralische Spannung des griechischen ἀκαθαρσία, ohne die Aussage zu bloß sozialer Abgrenzung abzuschwächen oder sie durch das stärkere „Gräuel“ zu verschärfen.
- issue: Verhältnis zwischen Absonderung, Völkern und Unreinheiten
  choice: Nichtabsonderung von den fremden Völkern und deren Unreinheiten
  alternative: 'Die fremden Völker hätten sich nicht abgesondert; oder: Nichtabsonderung nur von den Unreinheiten'
  rationale: Der überlieferte griechische Satz ist gedrängt und syntaktisch schwierig. Der Zusammenhang sowie die erläuternde Völkerliste stützen die Lesart, dass die Obersten, Priester und Leviten die gebotene Absonderung von den Völkern und ihren verunreinigenden Praktiken nicht vollzogen haben. Die Fußnote hält die sprachliche Mehrdeutigkeit sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit leicht biblisch-historischem Klang. Die wiederholten Gruppenbezeichnungen und die vollständige Völkerliste bleiben erhalten; der Gedankenstrich kennzeichnet die Liste als Erläuterung.
