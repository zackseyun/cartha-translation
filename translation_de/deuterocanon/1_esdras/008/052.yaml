base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/052.yaml
  text: For I was ashamed to ask for horsemen and foot soldiers as an escort for safety against those hostile to us[a].
translation:
  language: de
  text: Denn ich schämte mich, Reiter und Fußsoldaten als Eskorte zum Schutz vor unseren Gegnern zu erbitten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Reiterei und Fußtruppen als Eskorte“.'
    reason: Lexikalische Alternative für ἵππεις καὶ πεζούς sowie προπομπήν.
lexical_decisions:
- source_word: ἐνετράπην
  choice: ich schämte mich
  rationale: Die Wendung gibt das Schamgefühl und die daraus folgende Scheu vor der Bitte natürlich und quellennah wieder.
- source_word: αἰτῆσαι
  choice: zu erbitten
  rationale: Das Infinitiv bezeichnet eine Bitte; „erbitten“ passt zum höfischen Kontext und bleibt in modernem Deutsch verständlich.
- source_word: ἵππεις καὶ πεζούς
  choice: Reiter und Fußsoldaten
  rationale: Die konkrete militärische Gegenüberstellung von berittenen und zu Fuß kämpfenden Truppen bleibt erhalten.
- source_word: προπομπήν
  choice: als Begleitschutz
  rationale: Das Substantiv bezeichnet hier eine schützende Eskorte für Reisende; „Begleitschutz“ gibt Funktion und Zusammenhang idiomatisch wieder.
- source_word: ἕνεκεν ἀσφαλείας
  choice: damit wir … sicher wären
  rationale: Die finale Bedeutung wird als natürlicher deutscher Zwecksatz ausgedrückt.
- source_word: τῆς πρὸς τοὺς ἐναντίους ἡμῖν
  choice: vor denen …, die uns feindlich gesinnt waren
  rationale: Die schwierige Konstruktion wird sinngerecht auf die Sicherheit gegenüber feindlich eingestellten Personen bezogen, ohne sie zwingend als formelle Kriegsgegner festzulegen.
theological_decisions:
- issue: Verhältnis zum angegebenen masoretischen Paralleltext
  choice: Die Aussage des griechischen Textes über den erbetenen militärischen Begleitschutz wird unmittelbar übersetzt.
  alternative: Den Wortlaut an die im hebräischen Paralleltext genannte Fasten- und Gebetsaussage angleichen.
  rationale: Der griechische Text ist für 1 Esdras die maßgebliche Ausgangsbasis; der angegebene hebräische Text entspricht inhaltlich nicht diesem Satz und darf ihn daher nicht ersetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Begleitschutz“ ist allgemein verständlich; „Reiter und Fußsoldaten“ bewahrt die anschauliche Ausdrucksweise des Griechischen. Der abschließende Relativsatz vermeidet eine unnötig starre Festlegung von ἐναντίοι auf den Fachbegriff „Feinde“.
