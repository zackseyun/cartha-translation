  source_fidelity: 'Der Entwurf gibt die wesentlichen Bestandteile des griechischen Satzes zutreffend wieder: Scham über die Bitte, berittene und unberittene Truppen, Eskorte und Schutz gegenüber feindlich Gesinnten. Der finale Nebensatz „damit wir vor denen sicher wären“ ist jedoch umständlich und schwächt die direkte Zuordnung von ἕνεκεν ἀσφαλείας zu der erbetenen Eskorte.'
