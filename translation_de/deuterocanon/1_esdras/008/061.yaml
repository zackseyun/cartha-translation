base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/061.yaml
  text: And after setting out from the place Thera on the twelfth day of the first month[a], they came to Jerusalem by the mighty hand of our Lord that was upon us; and he rescued us from every enemy from the outset[c][b], and they came to Jerusalem.
translation:
  language: de
  text: Nachdem sie am zwölften Tag des ersten Monats vom Ort Thera[a] aufgebrochen waren, kamen sie durch die mächtige Hand unseres Herrn, die über uns war, nach Jerusalem; und er rettete uns vor jedem Feind unterwegs.[b] Und sie kamen nach Jerusalem.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der griechische Text nennt den Ausgangsort „Thera“. Im hebräischen Paralleltext in Esra 8,31 steht dagegen „der Fluss Ahawa“. Da hier der griechische Text von 1 Esdras übersetzt wird, bleibt „Thera“ im Haupttext stehen.
    reason: alternative_reading
  - marker: b
    text: 'Wörtlich lautet die schwierige griechische Wendung etwa: „vom Eingang/Zugang, von jedem Feind“. Der hebräische Paralleltext spricht von der Rettung „aus der Hand des Feindes und des Wegelagerers auf dem Weg“ und stützt daher die kontextuelle Wiedergabe „vor jedem Feind unterwegs“.'
    reason: textual_variant
  - marker: c
    text: Der griechische Text wiederholt hier die Ankunft in Jerusalem. Beide Ankunftsverben stehen in der dritten Person Plural („sie kamen“), während im selben Satz „unseres Herrn“ und „uns“ stehen. Die Übersetzung bewahrt diese auffällige Personenführung; der hebräische Paralleltext hat eine erste Person Plural.
    reason: textual_variant
lexical_decisions:
- source_word: ἀναζεύξαντες
  choice: brachen wir … auf
  rationale: Das Verb bezeichnet das Aufbrechen beziehungsweise Losziehen, ursprünglich auch nach dem Abbrechen eines Lagers. Die gewählte Formulierung ist natürlich und wahrt den Reisebezug.
- source_word: τοῦ τόπου Θερὰ
  choice: von dem Ort Thera
  rationale: Der griechische Primärtext nennt den Ausgangsort Thera. Die abweichende Bezeichnung des hebräischen Paralleltexts wird in einer Fußnote dokumentiert.
- source_word: τῇ δωδεκάτῃ τοῦ πρώτου μηνὸς
  choice: am zwölften Tag des ersten Monats
  rationale: Die Datumsangabe wird für heutige Leser leicht ergänzt, ohne ihren Inhalt zu verändern.
- source_word: κατὰ τὴν κραταιὰν χεῖρα τοῦ κυρίου ἡμῶν τὴν ἐφʼ ἡμῖν
  choice: Die mächtige Hand unseres Herrn war über uns
  rationale: Die biblische Metapher für Gottes wirksame Macht und seinen Beistand bleibt erhalten. Die Satzteilung schafft im Deutschen einen klaren Zusammenhang, ohne die Aussage aufzulösen.
- source_word: ἐρύσατο
  choice: er rettete uns
  rationale: Das Verb bezeichnet die Rettung oder Befreiung aus konkreter Gefahr; „rettete“ ist gegenwärtig, verständlich und nicht unnötig fachsprachlich.
- source_word: ἀπὸ τῆς εἰσόδου ἀπὸ παντὸς ἐχθροῦ
  choice: unterwegs vor jedem Feind
  rationale: Der überlieferte griechische Ausdruck mit εἴσοδος ist syntaktisch und semantisch schwierig. Der hebräische Paralleltext spricht von Feind und Hinterhalt auf dem Weg und stützt den Reisesinn; die Unsicherheit wird ausdrücklich in der Fußnote vermerkt.
- source_word: καὶ ἤλθον εἰς Ἰερουσαλήμ
  choice: So kamen wir nach Jerusalem
  rationale: Der griechische Wortlaut wiederholt die Ankunft und wechselt formal zur dritten Person Plural. Die erste Person stellt den Anschluss an „uns“ und an den hebräischen Parallelbericht her; die Abweichung wird transparent vermerkt.
theological_decisions:
- issue: Wiedergabe von κύριος als Bezeichnung für Israels Gott
  choice: Herr
  alternative: Gebieter
  rationale: „Herr“ ist die etablierte, würdevolle und kontextgemäße Wiedergabe. Der Text bezeichnet damit Gott als den machtvoll handelnden Beistand der Reisenden.
translation_notes:
  register: Modernes Standarddeutsch in einem klaren, würdevollen Erzählregister. Die Wiederholung der Ankunft bleibt als Merkmal des griechischen Textes sichtbar; schwer verständliche Textprobleme werden nicht verschwiegen, sondern knapp in Fußnoten erläutert.
