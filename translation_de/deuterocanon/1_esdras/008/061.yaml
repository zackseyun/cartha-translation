- from: Und am zwölften Tag des ersten Monats brachen wir von dem Ort Thera[a] auf und zogen nach Jerusalem. Die mächtige Hand unseres Herrn war über uns, und er rettete uns unterwegs vor jedem Feind.[b] So kamen wir nach Jerusalem.[c]
  to: Nachdem sie am zwölften Tag des ersten Monats vom Ort Thera[a] aufgebrochen waren, kamen sie durch die mächtige Hand unseres Herrn, die über uns war, nach Jerusalem; und er rettete uns vor jedem Feind unterwegs.[b] Und sie kamen nach Jerusalem.[c]
  rationale: 'Die Revision folgt dem griechischen Primärtext genauer: Sie bewahrt sowohl die zweimalige Ankunft in Jerusalem als auch die dritte Person Plural der beiden Ankunftsverben. Die textlich schwierige Rettungsformel wird weiterhin vorsichtig und idiomatisch wiedergegeben, aber durch eine präzisierte Fußnote als unsicher kenntlich gemacht. Die hebräische Parallele informiert die Anmerkungen, ersetzt jedoch nicht den griechischen Wortlaut.'
