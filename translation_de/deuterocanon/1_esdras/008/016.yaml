base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/016.yaml
  text: And whatever you and your brothers wish to do with the silver and gold[a], carry it out according to the will of your God.
translation:
  language: de
  text: Und alles, was du mit dem Gold und Silber zusammen mit deinen Brüdern tun willst,[a] führe nach dem Willen deines Gottes aus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Parallelstelle in Esra 7,18 spricht genauer davon, mit dem übrigen Silber und Gold zu tun, was gut erscheint. Der griechische Text von 1 Esdras ist hier allgemeiner formuliert.
    reason: alternative_reading
lexical_decisions:
- source_word: πάντα ὅσα ἂν βούλῃ
  choice: alles, was du ... tun willst
  rationale: Die offene Relativkonstruktion mit ἄν und Konjunktiv bezeichnet umfassend, was der Angesprochene beabsichtigt; die deutsche Formulierung ist natürlich und bewahrt den Willensaspekt.
- source_word: μετὰ τῶν ἀδελφῶν σου
  choice: zusammen mit deinen Brüdern
  rationale: Dies bildet die Begleitung beziehungsweise gemeinsame Beteiligung eng am Griechischen ab. »Brüder« wahrt die maskuline Pluralform, ohne den möglichen weiteren Sinn von Verwandten oder Volksgenossen auszuschließen.
- source_word: χρυσίῳ καὶ ἀργυρίῳ
  choice: mit dem Gold und Silber
  rationale: Der Dativ wird hier instrumental beziehungsweise sachbezogen verstanden. Der bestimmte Artikel weist auf die im Zusammenhang genannten Mittel, während die koordinierte deutsche Wendung idiomatisch nur einen Artikel benötigt.
- source_word: ἐπιτέλει
  choice: führe ... aus
  rationale: ἐπιτελέω bezeichnet die tatsächliche Ausführung oder Vollendung des beabsichtigten Handelns; »ausführen« unterscheidet den Hauptbefehl klar vom allgemeineren ποιῆσαι.
- source_word: κατὰ τὸ θέλημα τοῦ θεοῦ σου
  choice: nach dem Willen deines Gottes
  rationale: Die Formulierung gibt den normgebenden Maßstab direkt, würdig und in geläufigem Deutsch wieder.
theological_decisions:
- issue: Verhältnis der breiten griechischen Ermächtigung zur engeren Formulierung der hebräisch-aramäischen Parallelüberlieferung in Esra 7,18
  choice: Die breitere griechische Formulierung wird direkt übersetzt und allein durch den ausdrücklichen Maßstab des Willens Gottes begrenzt.
  alternative: 'Harmonisierend ergänzen: »was euch mit dem übrigen Silber und Gold gut erscheint«.'
  rationale: Für 1 Esdras ist der griechische Text die primäre Grundlage. Er enthält hier weder ausdrücklich »das Übrige« noch »was gut erscheint«; diese Einzelheiten dürfen daher nicht stillschweigend aus der Parallelüberlieferung eingetragen werden.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die Satzstellung hält die offene Ermächtigung und ihre Begrenzung durch Gottes Willen klar auseinander.
