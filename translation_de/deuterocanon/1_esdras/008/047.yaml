lexical_decisions:
- source_word: ἄνδρα ἐπιστήμονα
  choice: einen verständigen Mann
  rationale: ἄνδρα bezeichnet ausdrücklich einen Mann; ἐπιστήμονα beschreibt ihn als einsichtig, kundig oder verständig. „verständig“ gibt den allgemeinen Sinn natürlich wieder und entspricht zugleich dem hebräischen Parallelwort שֶׂכֶל.
- source_word: τῶν υἱῶν Μοολὶ
  choice: von den Söhnen Moolis
  rationale: Die formelhafte genealogische Wendung wird nahe am Griechischen wiedergegeben. Der Name folgt der griechischen Primärquelle; die abweichende hebräische Namensform steht in der Fußnote.
- source_word: τοῦ Λευὶ τοῦ Ἰσραήλ
  choice: des Sohnes Levis, des Sohnes Israels
  rationale: Die wiederholte Ergänzung „des Sohnes“ macht die genealogische Kette im Deutschen eindeutig und wird vom hebräischen Paralleltext gestützt.
- source_word: Ἀσεβηβίαν
  choice: Asebebias
  rationale: Der Eigenname wird nach der griechischen Primärquelle transliteriert; die deutlich abweichende Form des hebräischen Paralleltextes wird dokumentiert.
- source_word: τοὺς υἱοὺς καὶ τοὺς ἀδελφοὺς
  choice: seine Söhne und seine Brüder
  rationale: Der Zusammenhang bezieht beide Gruppen natürlich auf Asebebias. Die maskulinen genealogischen Bezeichnungen des Griechischen bleiben erhalten.
- source_word: δέκα
  choice: insgesamt zehn
  rationale: Der griechische Text nennt zehn. „insgesamt“ verdeutlicht idiomatisch, dass die Zahl die genannten Begleiter zusammenfasst; die Variante „achtzehn“ des hebräischen Paralleltextes erscheint in der Fußnote.
