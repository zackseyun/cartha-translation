base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/027.yaml
  text: And I took courage according to the help of the Lord my God[a], and I gathered from Israel men to go up with me.
translation:
  language: de
  text: Und ich fasste Mut durch die Hilfe des Herrn, meines Gottes, und versammelte Männer[a] aus Israel, um mit mir hinaufzuziehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der hebräische Paralleltext in Esra 7,28 hat hier „Oberhäupter“ oder „Anführer“ statt „Männer“. 1 Esdras folgt an dieser Stelle dem griechischen Wortlaut.
    reason: alternative_reading
lexical_decisions:
- source_word: εὐθαρσὴς ἐγενόμην
  choice: ich fasste Mut
  rationale: Die Wendung bezeichnet ein Mutig- oder Zuversichtlichwerden. „Ich fasste Mut“ ist im modernen Deutsch idiomatisch und bewahrt den Gedanken innerer Stärkung.
- source_word: κατὰ τὴν ἀντίλημψιν
  choice: durch die Hilfe
  rationale: ἀντίλημψις bezeichnet Hilfe, Beistand oder Unterstützung. „Durch die Hilfe“ gibt den gemeinten Grund beziehungsweise das Mittel natürlich wieder, ohne das im griechischen Text nicht verwendete Bild der „Hand“ aus dem hebräischen Paralleltext einzutragen.
- source_word: Κυρίου θεοῦ μου
  choice: des Herrn, meines Gottes
  rationale: Die Wiedergabe folgt dem griechischen Κυρίου und lässt die enge Verbindung von „Herr“ und „mein Gott“ klar erkennen.
- source_word: συνήγαγον
  choice: versammelte
  rationale: Das Verb bedeutet, Menschen zusammenzubringen. „Versammelte“ ist hier präzise, natürlich und dem würdigen Erzählstil angemessen.
- source_word: ἐκ τοῦ Ἰσραὴλ
  choice: aus Israel
  rationale: Die Wendung bezeichnet die Gruppe, aus der die Männer ausgewählt und zusammengebracht wurden.
- source_word: ἄνδρας
  choice: Männer
  rationale: Der griechische Haupttext nennt ausdrücklich Männer. Die abweichende Bezeichnung „Oberhäupter“ beziehungsweise „Anführer“ im hebräischen Paralleltext wird nicht in den Haupttext übernommen, sondern in einer Fußnote dokumentiert.
- source_word: ὥστε συναναβῆναί μοι
  choice: damit sie mit mir hinaufzogen
  rationale: Die Konstruktion kann Zweck oder Folge ausdrücken. „Damit sie mit mir hinaufzogen“ bewahrt diese leichte Offenheit und den traditionellen Reiseausdruck des Hinaufziehens.
theological_decisions:
- issue: Bezeichnung der aus Israel Versammelten im griechischen Text gegenüber dem hebräischen Paralleltext
  choice: Männer
  alternative: Oberhäupter / Anführer
  rationale: Für 1 Esdras ist hier der griechische Text maßgeblich; er liest ἄνδρας. Der hebräische Paralleltext in Esra 7,28 hat רָאשִׁים, „Oberhäupter“ oder „Anführer“. Die Übersetzung folgt dem griechischen Wortlaut und weist transparent auf die Variante hin.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung bleibt nah am griechischen Ausgangstext, vermeidet jedoch unnötig fremdartiges Deutsch. Der Fußnotenmarker steht nach dem Satz, da die Anmerkung den Ausdruck „Männer“ im Satz erläutert.
