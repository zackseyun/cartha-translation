base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/041.yaml
  text: 'From the sons of Banai: Outu son of Istakalkou, and with him seventy men.'
translation:
  language: de
  text: 'Von den Söhnen Banai: Outu, Sohn des Istakalkus, und mit ihm siebzig Männer.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκ τῶν υἱῶν Βαναί
  choice: Von den Söhnen Banaïs
  rationale: Gibt die griechische Herkunftsformel direkt wieder; der Genitiv des Namens wird im Deutschen durch die Endung -s kenntlich gemacht.
- source_word: Οὐτοῦ Ἰστακάλκου
  choice: Outu, der Sohn Istakalkus
  rationale: Die Namensformen folgen dem griechischen Hauptzeugen. Die im Griechischen nur durch zwei aufeinanderfolgende Genitive ausgedrückte Abstammungsbeziehung wird für verständliches Deutsch ausdrücklich mit »der Sohn« wiedergegeben.
- source_word: ἄνδρες ἑβδομήκοντα
  choice: siebzig Männer
  rationale: Natürliche deutsche Wortstellung bei genauer Wiedergabe von Zahl und Personenbezeichnung.
