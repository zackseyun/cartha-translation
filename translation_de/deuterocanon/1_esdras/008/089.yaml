base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/089.yaml
  text: And while Ezra was praying and making confession[a], weeping as he lay prostrate before the temple[b], a very great crowd gathered to him from Jerusalem—men and women and young men—for there was great weeping among the multitude.
translation:
  language: de
  text: 'Und während Esra betete und seine Schuld bekannte[a], weinte und vor dem Tempel ausgestreckt auf dem Boden lag, versammelte sich aus Jerusalem eine überaus große Menge bei ihm: Männer, Frauen und junge Männer[b]. Denn die Menge weinte sehr.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Dank sagte“. Das griechische Verb kann beides bedeuten; der Bußzusammenhang spricht hier eher für ein Schuldbekenntnis.'
    reason: lexical_alternative
  - marker: b
    text: Wörtlich ist von jungen Männern die Rede; das griechische Wort ist maskulin.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσευχόμενος
  choice: während Esra betete
  rationale: Das präsentische Partizip bezeichnet eine fortdauernde Handlung, die gleichzeitig mit dem Bekennen und Weinen geschieht.
- source_word: ἀνθωμολογεῖτο
  choice: seine Schuld bekannte
  rationale: Das Verb kann auch Danken oder Lobpreisen bedeuten; Gebet, Tränen und Niederwerfung sprechen hier jedoch für ein öffentliches Schuldbekenntnis.
- source_word: κλαίων
  choice: weinte
  rationale: Die schlichte Wiedergabe bewahrt den feierlichen Bußzusammenhang und verbindet sich natürlich mit der folgenden Aussage über das Weinen der Menge.
- source_word: χαμαιπετής
  choice: ausgestreckt auf dem Boden lag
  rationale: Die Formulierung gibt die körperliche Haltung der Erniedrigung konkret wieder, ohne ein unnötig fachsprachliches Wort zu verwenden.
- source_word: ἔμπροσθεν τοῦ ἱεροῦ
  choice: vor dem Tempel
  rationale: ἱερόν bezeichnet hier den Tempel beziehungsweise den Tempelbereich, nicht ausschließlich das innere Heiligtum.
- source_word: ἐπισυνήχθησαν πρὸς αὐτόν
  choice: versammelte sich … bei ihm
  rationale: Dies bewahrt sowohl das Zusammenkommen als auch die auf Esra gerichtete Bewegung in natürlichem Deutsch.
- source_word: ὄχλος πολὺς σφόδρα
  choice: eine überaus große Menge
  rationale: Die Wiedergabe bringt sowohl πολὺς als auch die Verstärkung σφόδρα zum Ausdruck.
- source_word: νεανίαι
  choice: junge Männer
  rationale: Das griechische Substantiv ist maskulin und bezeichnet hier ausdrücklich junge männliche Personen.
- source_word: κλαυθμὸς γὰρ ἦν μέγας ἐν τῷ πλήθει
  choice: Denn die Menge weinte sehr
  rationale: Die verbale deutsche Formulierung gibt das starke gemeinsame Weinen idiomatisch wieder, ohne den Sinn des nominalen griechischen Ausdrucks zu verändern.
theological_decisions:
- issue: Bedeutung von ἀνθωμολογεῖτο im Bußzusammenhang
  choice: 'Schuldbekenntnis: „seine Schuld bekannte“'
  alternative: 'Dank oder Lobpreis: „Dank sagte“'
  rationale: Obwohl das Verb beide Bedeutungsfelder haben kann, machen Gebet, Weinen und das ausgestreckte Liegen vor dem Tempel ein Schuldbekenntnis im Kontext wahrscheinlicher; die andere Möglichkeit wird in der Fußnote erhalten.
- issue: Personenkreis von νεανίαι
  choice: „junge Männer“
  alternative: „junge Leute“ oder „Jugendliche“
  rationale: Die grammatisch maskuline Bezeichnung soll nicht zu einer geschlechtsneutralen Gruppe erweitert werden.
- issue: Bedeutungsumfang von ἱερόν
  choice: „Tempel“
  alternative: „Heiligtum“ oder „Tempelbezirk“
  rationale: „Tempel“ ist im Deutschen verständlich und weit genug, um den Tempelkomplex zu bezeichnen, ohne den Ausdruck auf das innere Heiligtum einzuengen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Erzählstruktur. Die Wiederholung des Weinens bleibt in leicht variierter, natürlicher Form erhalten. Die griechische Quelle ist der Übersetzungsanker; der angeführte masoretische Paralleltext entspricht offenbar einem anderen Vers und wurde daher nicht zur inhaltlichen Steuerung herangezogen.
