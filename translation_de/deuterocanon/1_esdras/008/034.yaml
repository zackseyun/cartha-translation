base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/034.yaml
  text: 'From the sons of Sophotius: Zaraias son of Michael[a], and with him seventy men.'
translation:
  language: de
  text: 'Von den Söhnen des Sophotios: Zaraias, der Sohn Michaels,[a] und mit ihm siebzig Männer.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechischen Namen und die Zahl weichen von der ungefähren hebräischen Parallele in Esra 8,6 ab. Dort steht: „von den Söhnen Adins: Ebed, der Sohn Jonatans, und mit ihm fünfzig männliche Personen“. Da 1 Esdras hier nach dem griechischen Text übersetzt wird, folgt der Haupttext dessen Namen und Zahl.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκ τῶν υἱῶν
  choice: Von den Söhnen
  rationale: ἐκ mit dem Genitiv bezeichnet hier die Auswahl aus einer Sippe oder Familiengruppe; die knappe Listenformel ist im Deutschen natürlich und quellennah.
- source_word: Σοφοτίου
  choice: Sophotios
  rationale: Der Personenname wird unmittelbar nach der griechischen Form transkribiert, ohne Angleichung an die abweichende hebräische Parallelüberlieferung.
- source_word: Ζαραίας
  choice: Zaraias
  rationale: Die griechische Namensform wird bewahrt und nicht anhand des ungefähren hebräischen Paralleltextes harmonisiert.
- source_word: Μειχαήλου
  choice: der Sohn Michaels
  rationale: Der bloße Genitiv bezeichnet in dieser genealogischen Liste am natürlichsten die Abstammung. Die Ergänzung „der Sohn“ macht die im Griechischen elliptische Beziehung auf Deutsch verständlich.
- source_word: καὶ μετʼ αὐτοῦ
  choice: und mit ihm
  rationale: Die übliche Begleitformel verbindet den genannten Anführer mit der nachfolgenden Zahl.
- source_word: ἄνδρες
  choice: Männer
  rationale: ἄνδρες bezeichnet hier männliche Personen innerhalb der gezählten Gruppe; „Männer“ ist die natürliche und genaue deutsche Wiedergabe.
- source_word: ἑβδομήκοντα
  choice: siebzig
  rationale: Direkte Wiedergabe der griechischen Kardinalzahl.
