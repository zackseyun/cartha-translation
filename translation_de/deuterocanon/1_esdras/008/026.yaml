  text: and he honored me before the kings and all his friends and nobles[a][b].
translation:
  language: de
  text: Und er ehrte mich vor den Königen[a] und allen seinen Freunden[b] und Würdenträgern.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „vor den als Könige Herrschenden“; im Griechischen steht eine Partizipialform und nicht einfach das Substantiv „Könige“.'
    reason: lexical_alternative
  - marker: b
    text: „Freunde“ kann hier königliche Vertraute oder Angehörige des Hofes bezeichnen, nicht nur persönliche Freunde im heutigen Sinn.
    reason: cultural_note
lexical_decisions:
- source_word: ἐτίμησεν
  choice: erwies mir Ehre
  rationale: Gibt das aktive τιμάω natürlich und würdevoll wieder, ohne eine materielle Belohnung anzudeuten.
- source_word: ἔναντι
  choice: vor
  rationale: Bezeichnet hier den öffentlichen Rahmen beziehungsweise die Gegenwart der genannten Personen.
- source_word: τῶν βασιλευόντων
  choice: denen, die als Könige herrschten
  rationale: Bewahrt die partizipiale Form und den königlichen Sinn des Verbs βασιλεύω sowie den griechischen Plural.
- source_word: φίλων
  choice: Freunden
  rationale: Entspricht dem Grundsinn; eine mögliche höfische Bedeutung wird in einer Fußnote erläutert, statt sie in den Haupttext einzutragen.
- source_word: μεγιστάνων
  choice: Würdenträgern
  rationale: Bezeichnet ranghohe, einflussreiche Männer und ist im modernen Deutschen natürlicher und breiter verständlich als „Magnaten“.
