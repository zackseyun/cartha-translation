base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/082.yaml
  text: and do not take their daughters for your sons[a], and do not seek peace with them all your days, so that, having become strong, you may eat the good things of the land and inherit it
translation:
  language: de
  text: und nehmt ihre Töchter nicht für eure Söhne, und sucht für alle Zeit keinen Frieden mit ihnen[a], damit ihr, stark geworden, die guten Dinge des Landes essen und es als Erbe besitzen könnt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, im umfassenderen Sinn der hebräischen Parallelüberlieferung: »Sucht niemals ihren Frieden oder ihr Wohlergehen.«'
    reason: alternative_reading
lexical_decisions:
- source_word: λάβητε
  choice: nehmt
  rationale: Die wörtliche Bedeutung „nehmen“ bleibt erhalten; zusammen mit „ihre Töchter … für eure Söhne“ ist der Heiratskontext im Deutschen klar.
- source_word: ζητήσετε
  choice: sucht
  rationale: „Suchen“ gibt das Verb direkt wieder und wahrt die breite Aussage des Verbots.
- source_word: εἰρηνεῦσαι τὰ πρὸς αὐτούς
  choice: Frieden mit ihnen
  rationale: Die knappe griechische Wendung bezeichnet friedliche Beziehungen zu ihnen. Die mögliche weiter gefasste Bedeutung „Frieden und Wohlergehen“ wird in der Fußnote bewahrt.
- source_word: τὸν ἅπαντα χρόνον
  choice: für alle Zeit
  rationale: Die Formulierung gibt den umfassenden zeitlichen Sinn von „die ganze Zeit“ würdig und natürlich wieder.
- source_word: ἵνα ἰσχύσαντες
  choice: damit ihr stark werdet
  rationale: Die deutsche Zweckkonstruktion gibt sowohl ἵνα als auch das vorausgehende Erstarken des Partizips natürlich wieder.
- source_word: φάγητε τὰ ἀγαθὰ τῆς γῆς
  choice: die guten Gaben des Landes esst
  rationale: „Gute Gaben“ bewahrt die breite Bedeutung von ἀγαθά und klingt im Zusammenhang mit „essen“ natürlicher als das abstrakte „das Gute“.
- source_word: κατακληρονομήσητε
  choice: es als Erbe in Besitz nehmt
  rationale: Die Wiedergabe erhält die Erbschaftssprache des Verbs; „es“ nimmt das zuvor genannte Land als unausgesprochenes Objekt auf.
theological_decisions:
- issue: Verhältnis der knappen griechischen Friedensformel zur ausführlicheren semitischen Parallele
  choice: Den überlieferten griechischen Wortlaut im Haupttext knapp als „Frieden mit ihnen“ wiedergeben und die mögliche umfassendere Bedeutung in einer Fußnote nennen.
  alternative: Im Haupttext erweitern zu „ihren Frieden und ihr Wohlergehen“.
  rationale: Für 1 Esdras bleibt der griechische Text maßgeblich. Die Parallele kann die idiomatische Bedeutung erhellen, darf den Haupttext aber nicht unmarkiert erweitern.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Klang. Die Satzstruktur folgt dem griechischen Gedankengang, ohne im Deutschen schwerfällig zu wirken.
