review_pass:
  verdict: revise
  source_fidelity: Die Übersetzung folgt dem griechischen Text im Wesentlichen zuverlässig. Die partizipiale Vorzeitigkeit von ἰσχύσαντες („stark geworden“) sollte jedoch gegenüber dem bloßen „stark werdet“ erkennbar bleiben. κατακληρονομήσητε bezeichnet das Erben bzw. den Erbbesitz des impliziten Landes.
  naturalness: „Die guten Dinge des Landes“ ist im Deutschen mit „essen“ idiomatischer als „die guten Gaben des Landes“. Die Stellung „stark geworden“ lässt sich in der Zweckkonstruktion natürlich und zugleich quellennah wiedergeben.
  terminology: „Nehmt ihre Töchter nicht für eure Söhne“ wahrt den im Kontext erkennbaren Heiratsbezug ohne den griechischen Wortlaut unnötig zu explizieren. „Frieden mit ihnen“ bewahrt die knappe griechische Formulierung; die Fußnote kennzeichnet die weitergehende Deutung anhand der hebräischen Parallele.
  issues:
  - severity: low
    issue: Die Abfolge von ἰσχύσαντες wird im Entwurf nicht ausdrücklich abgebildet.
    rationale: „Damit ihr stark werdet, ... esst“ macht das Starkwerden zu einem gleichgeordneten Zweck. Das griechische Aoristpartizip stellt das Starkgewordensein als dem Essen und Erben vorausgehend bzw. begleitend dar.
  - severity: low
    issue: „Gaben des Landes“ ist mit dem Verb „essen“ semantisch etwas weniger unmittelbar.
    rationale: ἀγαθά kann zwar Gaben beziehungsweise Güter meinen, doch „die guten Dinge des Landes essen“ gibt den griechischen Ausdruck direkter und im Deutschen flüssiger wieder.
  revised_text: und nehmt ihre Töchter nicht für eure Söhne, und sucht für alle Zeit keinen Frieden mit ihnen[a], damit ihr, stark geworden, die guten Dinge des Landes essen und es als Erbe besitzen könnt.
