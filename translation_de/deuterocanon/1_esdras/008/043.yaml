  text: And from the priests and from the Levites I found no one there[a].
translation:
  language: de
  text: Und unter den Priestern und den Leviten fand ich dort niemanden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die für diese Stelle angegebene hebräische beziehungsweise masoretische Parallele stimmt mit dem griechischen Text nicht eng überein; daher folgt die Übersetzung hier dem Griechischen als dem primären Textzeugen.
    reason: textual_variant
lexical_decisions:
- source_word: ἐκ τῶν ἱερέων
  choice: unter den Priestern
  rationale: Im Deutschen gibt „unter den Priestern“ den Sinn einer Suche innerhalb dieser Gruppe natürlicher wieder als das wörtlichere „von den Priestern“.
- source_word: ἐκ τῶν Λευειτῶν
  choice: unter den Leviten
  rationale: Die Wendung wird parallel zum ersten Ausdruck wiedergegeben; „Leviten“ ist die übliche deutsche Bezeichnung.
- source_word: οὐχ εὗρον
  choice: fand ich … niemanden
  rationale: Die Verbform ist erste Person Singular. Das im Griechischen nicht ausdrücklich genannte Objekt wird für klares, idiomatisches Deutsch mit „niemanden“ ergänzt.
- source_word: ἐκεῖ
  choice: dort
  rationale: „Dort“ ist die schlichte und natürliche Wiedergabe des lokalen Adverbs.
theological_decisions:
- issue: Deutliche Abweichung zwischen dem griechischen Textzeugen und der angegebenen ungefähren MT-Parallele
  choice: 'Der griechische Text wird als Hauptzeuge übersetzt: „Und unter den Priestern und den Leviten fand ich dort niemanden.“'
  alternative: Die angegebene MT-Parallele nennt Nachkommen Bigvais und bietet für die Rekonstruktion dieses griechischen Satzes keine eng entsprechende Lesart.
  rationale: Da die griechische Fassung als primäre Textgrundlage ausgewiesen ist und die hebräische Parallele offenbar anderes Listenmaterial enthält, bleibt die Übersetzung beim überlieferten griechischen Wortlaut; die Abweichung wird transparent in einer Fußnote vermerkt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung wahrt den Parallelismus der beiden Gruppenbezeichnungen, während „unter“ und das ergänzte „niemanden“ für natürliches Deutsch sorgen.
