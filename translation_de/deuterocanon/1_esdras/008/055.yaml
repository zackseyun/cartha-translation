base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/055.yaml
  text: And I set apart twelve men from the leaders of the priests[a], and Eserebias and Asoamias[c][b],
translation:
  language: de
  text: Und ich sonderte aus den Oberhäuptern der Priester zwölf Männer aus, Eserebias[a] und Asoamias[b].[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Eserebias entspricht wahrscheinlich dem Namen Scherebja im hebräischen Paralleltext.
    reason: alternative_reading
  - marker: b
    text: Asoamias entspricht wahrscheinlich dem Namen Haschabja im hebräischen Paralleltext.
    reason: alternative_reading
  - marker: c
    text: Der griechische Text ist hier kürzer als der hebräische Paralleltext in Esra 8,24; dort folgen weitere Personenangaben, bevor in Esra 8,25 das Abwiegen von Silber, Gold und Gefäßen berichtet wird.
    reason: cross_reference
lexical_decisions:
- source_word: ἐχώρισα
  choice: sonderte … aus
  rationale: Die Wendung gibt sowohl das Trennen von einer Gruppe als auch die Auswahl für eine besondere Aufgabe wieder und klingt im modernen Deutschen natürlich.
- source_word: φυλάρχων
  choice: Oberhäuptern
  rationale: Das Wort bezeichnet Anführer eines Stammes oder einer Sippe. Im Zusammenhang sind leitende Männer der Priesterschaft gemeint; „Oberhäupter“ bewahrt diese soziale Leitungsfunktion, ohne eine genauere Amtsbezeichnung einzutragen.
- source_word: τῶν ἱερέων
  choice: der Priester
  rationale: 'Der Genitiv bestimmt am natürlichsten die vorangehenden Oberhäupter näher: Es handelt sich um Oberhäupter, die zur Priesterschaft gehören.'
- source_word: ἄνδρας δέκα δύο
  choice: zwölf Männer
  rationale: ἄνδρας bezeichnet hier ausdrücklich männliche Personen; die schlichte Wiedergabe folgt der griechischen Formulierung.
- source_word: Ἐσερεβίαν
  choice: Eserebias
  rationale: Der Name wird entsprechend dem griechischen Haupttext transliteriert. Die mögliche Entsprechung zum hebräischen Namen Scherebja wird in einer Fußnote genannt.
- source_word: Ἀσοαμίαν
  choice: Asoamias
  rationale: Der Name wird entsprechend dem griechischen Haupttext transliteriert. Die mögliche Entsprechung zum hebräischen Namen Haschabja wird in einer Fußnote genannt.
- source_word: καὶ … καὶ
  choice: dazu … und
  rationale: „Dazu“ macht die koordinierende Fortsetzung mit den beiden Namen idiomatisch verständlich, ohne die im verkürzten griechischen Text nicht völlig klare Beziehung zu den zwölf Männern näher festzulegen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nahe am griechischen Text; insbesondere wird die durch dessen Kürze entstehende Unklarheit über das genaue Verhältnis der beiden Genannten zu den zwölf Männern nicht aufgelöst.
