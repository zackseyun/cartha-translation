base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/019.yaml
  text: And I[a], King Artaxerxes, have given orders to the treasurers of Syria and Phoenicia, that whatever Ezra the priest and reader of the law of God Most High may send for, they are to give him carefully, up to one hundred talents of silver[b],
translation:
  language: de
  text: Und ich, König Artaxerxes, habe den Schatzmeistern Syriens und Phöniziens befohlen, Esra, dem Priester und Vorleser[b] des Gesetzes Gottes, des Höchsten, gewissenhaft alles zu geben, was er anfordert[a], bis zu hundert Talenten Silber.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „was Esra sendet“. Im Zusammenhang ist wahrscheinlich eine von ihm übersandte Anforderung oder Bitte gemeint.'
    reason: lexical_alternative
  - marker: b
    text: 'Griechisch: „Vorleser des Gesetzes“. In parallelen Esraüberlieferungen wird Esra häufig als Schriftgelehrter bezeichnet; der griechische Text nennt ihn hier ausdrücklich „Vorleser“.'
    reason: alternative_reading
lexical_decisions:
- source_word: προσέταξα
  choice: habe ... befohlen
  rationale: Der Aorist von προστάσσω bezeichnet eine verbindliche königliche Anordnung. „Habe ... befohlen“ wahrt die Autorität und klingt in modernem Deutsch natürlich.
- source_word: γαζοφύλαξι
  choice: Schatzmeistern
  rationale: Das Wort bezeichnet Amtsträger, die für die Bestände einer Schatzkammer verantwortlich sind. „Schatzmeister“ ist knapp und idiomatisch.
- source_word: Συρίας καὶ Φοινίκης
  choice: Syriens und Phöniziens
  rationale: Die Genitive geben die Amtsgebiete der Schatzmeister wieder; die etablierten deutschen Namensformen werden verwendet.
- source_word: ἀποστείλῃ
  choice: anfordern lässt
  rationale: Das Verb bedeutet wörtlich „sendet“. Im Versorgungskontext ist offenbar gemeint, dass Esra eine Nachricht oder Anforderung übermitteln lässt. Die Formulierung macht diese kontextuelle Ellipse verständlich, ohne sie als einzig mögliche Bedeutung auszugeben.
- source_word: ἀναγνώστης
  choice: Vorleser
  rationale: Die griechische Bezeichnung bedeutet ausdrücklich „Leser/Vorleser“. „Vorleser“ bezeichnet hier eine öffentliche beziehungsweise amtliche Funktion und vermeidet die Angleichung an die parallele Bezeichnung Esras als Schriftgelehrter.
- source_word: τοῦ νόμου τοῦ θεοῦ τοῦ ὑψίστου
  choice: des Gesetzes Gottes, des Höchsten
  rationale: Die Wiedergabe folgt der griechischen Abfolge und bezieht „des Höchsten“ als Gottesbezeichnung eindeutig auf Gott, ohne den Titel in eine andere Wortstellung umzuformen.
- source_word: ἐπιμελῶς
  choice: gewissenhaft
  rationale: Das Adverb fordert sorgfältige, pflichtbewusste Ausführung. „Gewissenhaft“ passt besonders gut zu einer amtlichen Anweisung und legt nicht zusätzlich Schnelligkeit nahe.
- source_word: ἕως ἀργυρίου τάλαντων ἑκατόν
  choice: bis zu hundert Talenten Silber
  rationale: ἕως bezeichnet die genehmigte Obergrenze. „Bis zu“ gibt diese Begrenzung klar wieder; „Talente“ bewahrt die antike Gewichtseinheit.
- source_word: ἰδοὺ
  choice: nicht eigens wiedergegeben
  rationale: Die Diskurspartikel hebt die königliche Selbstaussage hervor. Ein wörtliches „siehe“ wäre im heutigen deutschen Erlassstil unnatürlich; die betonte Voranstellung „Und ich, König Artaxerxes“ trägt ihre Funktion ausreichend.
theological_decisions:
- issue: Gottesbezeichnung τοῦ θεοῦ τοῦ ὑψίστου
  choice: Gottes, des Höchsten
  alternative: des höchsten Gottes
  rationale: Die gewählte Fassung bewahrt sowohl die eigenständige Titelfunktion „der Höchste“ als auch die griechische Reihenfolge. Sie identifiziert den Höchsten klar mit Gott, ohne eine weitergehende konfessionelle Deutung einzutragen.
- issue: Amtsbezeichnung Esras als ἀναγνώστης
  choice: Vorleser
  alternative: Schriftgelehrter
  rationale: Obwohl parallele Esraüberlieferungen ihn als Schriftgelehrten bezeichnen, nennt dieser griechische Text ihn ausdrücklich einen Leser beziehungsweise Vorleser. Die Übersetzung erhält diese textliche Besonderheit.
translation_notes:
  register: Moderner, würdiger Verwaltungston mit klarer Syntax. Die königliche Autorität bleibt hörbar, ohne archaische Formeln wie „siehe“ zu verwenden. „Vorleser“ und „Talente“ bewahren bewusst die historische und textliche Eigenart.
