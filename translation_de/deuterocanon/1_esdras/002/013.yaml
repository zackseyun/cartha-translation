base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/013.yaml
  text: And all the vessels were brought up[a], the gold and silver ones[b], five thousand four hundred and sixty-nine in all.
translation:
  language: de
  text: Alle goldenen und silbernen Geräte wurden gebracht[a], insgesamt 5.469.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das Griechische sagt wörtlich: „wurden gebracht“ beziehungsweise „wurden überführt“. „Wurden heraufgebracht“ ist als kontextbezogene Wiedergabe möglich, etwa im Blick auf Jerusalem; ein Ziel wird im Vers jedoch nicht genannt.'
    reason: lexical_alternative
  - marker: b
    text: Das parallele hebräische Verzeichnis in Esra 1,9–10 weicht bei der Aufzählung und den Zahlen ab. Hier folgt die Übersetzung dem griechischen Text von 1 Esdras.
    reason: alternative_reading
lexical_decisions:
- source_word: τὰ δὲ πάντα σκεύη
  choice: Und alle Geräte
  rationale: σκεύη bezeichnet hier die zum Tempelschatz gehörenden Geräte beziehungsweise Gefäße. „Geräte“ ist im Deutschen umfassend, verständlich und weniger eng als „Gefäße“.
- source_word: ἐκομίσθη
  choice: wurden heraufgebracht
  rationale: Der griechische Aorist Passiv bezeichnet den Transport. „Heraufgebracht“ bewahrt die mögliche räumliche Ausrichtung auf Jerusalem beziehungsweise den Tempel, ohne eine Rückgabe ausdrücklich in den Text hineinzulesen.
- source_word: χρυσᾶ καὶ ἀργυρᾶ
  choice: die goldenen und die silbernen
  rationale: Die substantivierten Adjektive beziehen sich auf die zuvor genannten Geräte. Die elliptische deutsche Form erhält die knappe Ausdrucksweise des Griechischen.
- source_word: πεντακισχίλια τετρακόσια ἑξήκοντα ἐννέα
  choice: insgesamt 5.469
  rationale: Die griechische Zahl ist eindeutig. Die Ziffernschreibung macht die Inventarsumme unmittelbar erfassbar; „insgesamt“ verdeutlicht ihre Funktion im Satz.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nahe am knappen griechischen Inventarstil; der Gedankenstrich hebt die abschließende Gesamtsumme natürlich hervor.
