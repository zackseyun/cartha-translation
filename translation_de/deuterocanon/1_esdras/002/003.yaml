base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/003.yaml
  text: 'Thus says Cyrus king of the Persians: The Lord of Israel[a], the Most High Lord, has appointed me king of the world,'
translation:
  language: de
  text: 'So spricht Kyros, der König der Perser: Der Herr Israels[a], der Herr, der Höchste, hat mich zum König der Welt eingesetzt,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die hebräische Parallelstelle in Esra 1,2 lautet: »DER HERR, der Gott des Himmels«, statt: »der Herr Israels, der Herr, der Höchste«. 1 Esdras folgt hier der griechischen Gestalt der Bekanntmachung.'
    reason: alternative_reading
lexical_decisions:
- source_word: Τάδε λέγει
  choice: So spricht
  rationale: Bewahrt die feierliche Proklamationsformel in geläufigem, würdigem Deutsch.
- source_word: ὁ βασιλεὺς Περσῶν Κῦρος
  choice: Kyrus, der König der Perser
  rationale: Folgt dem griechischen Plural Περσῶν und gibt die Apposition natürlich wieder.
- source_word: Ἐμὲ ἀνέδειξεν βασιλέα
  choice: hat mich zum König eingesetzt
  rationale: ἀναδείκνυμι bezeichnet hier die Einsetzung beziehungsweise Bestimmung zu einem Amt.
- source_word: τῆς οἰκουμένης
  choice: der Welt
  rationale: Gibt den umfassenden Anspruch der bewohnten beziehungsweise imperial verstandenen Welt knapp und natürlich wieder.
- source_word: ὁ κύριος τοῦ Ἰσραήλ
  choice: Der Herr Israels
  rationale: Folgt unmittelbar dem griechischen Wortlaut, ohne aus der hebräischen Parallelstelle »Gott des Himmels« einzutragen.
- source_word: Κύριος ὁ ὕψιστος
  choice: der Herr, der Höchste
  rationale: Bewahrt κύριος und ὕψιστος als appositionelle Gottestitel und klingt im Deutschen natürlicher als »der höchste Herr«.
theological_decisions:
- issue: Der Gottestitel weicht von der hebräischen Parallelstelle Esra 1,2 ab.
  choice: Der Herr Israels, der Herr, der Höchste
  alternative: DER HERR, der Gott des Himmels
  rationale: Der griechische Text von 1 Esdras ist die maßgebliche Vorlage. Die abweichende hebräische Lesart wird zur Transparenz in einer Fußnote dokumentiert.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit feierlichem Bekanntmachungston. Die Satzstellung bleibt nah am Griechischen, ohne unnatürlich zu wirken; das abschließende Komma zeigt, dass der Satz im folgenden Vers weitergeht.
