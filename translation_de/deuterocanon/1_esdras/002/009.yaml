base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/009.yaml
  text: And King Cyrus brought out the holy vessels of the Lord[a], which Nebuchadnezzar had carried away from Jerusalem and deposited in the house of his god.
translation:
  language: de
  text: Und König Kyros holte die heiligen Geräte des Herrn heraus, die Nebukadnezzar aus Jerusalem weggebracht und in seinem Götzentempel[a] niedergelegt hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das griechische Wort kann auch „Götzenheiligtum“ bedeuten. Der hebräische Paralleltext lautet: „im Haus seines Gottes“.'
    reason: Die Fußnote bewahrt sowohl die Bedeutungsbreite des griechischen Ausdrucks als auch die abweichende Formulierung des hebräischen Paralleltexts.
lexical_decisions:
- source_word: ἐξήνεγκεν
  choice: holte … heraus
  rationale: Die Wendung gibt das Hervorholen der zuvor verwahrten Tempelgeräte natürlich und präzise wieder.
- source_word: τὰ ἅγια σκεύη
  choice: die heiligen Geräte
  rationale: σκεύη bezeichnet hier die für den Tempeldienst bestimmten Gefäße und Gerätschaften. „Geräte“ ist umfassend und vermeidet eine unnötige Beschränkung auf Gefäße.
- source_word: τοῦ κυρίου
  choice: des Herrn
  rationale: Die Genitivverbindung bezeichnet die Zugehörigkeit zum Herrn und wahrt die übliche Wiedergabe von κύριος.
- source_word: μετήγαγεν
  choice: weggebracht
  rationale: Das Verb bezeichnet die Verbringung von einem Ort an einen anderen; im Zusammenhang der Eroberung passt „weggebracht“ idiomatisch.
- source_word: ἀπηρείσατο
  choice: niedergelegt hatte
  rationale: Die Form beschreibt die Unterbringung beziehungsweise Ablage der erbeuteten heiligen Geräte an einem kultischen Ort. Das Plusquamperfekt verdeutlicht die Vorzeitigkeit.
- source_word: ἐν τῷ εἰδώλιῳ αὐτοῦ
  choice: in seinem Götzentempel
  rationale: εἰδώλιον bezeichnet ein Heiligtum oder Tempelgebäude, das mit einem Götzenbild verbunden ist. „Götzentempel“ hält die gegenüber dem hebräischen Paralleltext schärfere griechische Ausdrucksweise im Haupttext fest.
theological_decisions:
- issue: Wiedergabe von κύριος im griechischen Tempelkontext
  choice: Herr
  alternative: HERR
  rationale: Da der primäre Quelltext κύριος liest, wird der Titel als „Herr“ wiedergegeben. Die Schreibweise „HERR“ würde die hebräische Gottesnamenskonvention in den griechischen Ausgangstext eintragen.
- issue: Verhältnis von εἰδώλιον zum hebräischen Paralleltext
  choice: Götzentempel
  alternative: Haus seines Gottes
  rationale: Der griechische Text ist die primäre Übersetzungsgrundlage und verwendet einen Ausdruck mit deutlicher Götzenkonnotation. Die abweichende, neutralere Lesart des hebräischen Paralleltexts wird in der Fußnote dokumentiert, nicht in den Haupttext verlagert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nahe am griechischen Erzählfluss; geläufige deutsche Namensformen und ein verständlicher Tempelwortschatz sorgen für natürliche Lesbarkeit.
