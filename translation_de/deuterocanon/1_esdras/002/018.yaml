base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/018.yaml
  text: Therefore, if this city is rebuilt and the walls are completed, they will certainly not endure to pay tribute, but will even oppose kings.
translation:
  language: de
  text: Wenn nun diese Stadt wieder aufgebaut und die Mauern vollendet werden, werden sie keinesfalls weiterhin Tribut zahlen,[a] sondern sich sogar den Königen widersetzen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „werden sie es keinesfalls ertragen, Tribut zu zahlen“. Das griechische Verb kann das Ausharren unter einer Last oder das Fortbestehen in einem Zustand bezeichnen; gemeint ist wahrscheinlich die Weigerung, weiterhin Tribut zu zahlen.'
    reason: lexical_alternative
  - marker: b
    text: Die Übersetzung folgt hier unmittelbar dem griechischen Text. Das angegebene masoretische Parallelmaterial stimmt mit diesem Vers nicht eng überein.
    reason: textual_variant
lexical_decisions:
- source_word: ἐὰν οὖν
  choice: Wenn nun
  rationale: οὖν führt die Folgerung aus der vorausgehenden Anklage fort; „wenn nun“ verbindet diese argumentative Funktion natürlich mit dem Konditionalsatz.
- source_word: ἡ πόλις αὕτη
  choice: diese Stadt
  rationale: Die Wiedergabe erhält den proximalen Bezug des griechischen Demonstrativpronomens.
- source_word: οἰκοδομηθῇ
  choice: wieder aufgebaut
  rationale: Der Kontext betrifft die Wiederherstellung Jerusalems; daher ist „wieder aufgebaut“ treffender als das isoliert mögliche „gebaut“.
- source_word: τὰ τείχη συντελεσθῇ
  choice: die Mauern vollendet werden
  rationale: συντελέω bezeichnet das Zu-Ende-Bringen; die deutsche Form gibt den Sinn trotz der griechischen Singularform beim neutralen Pluralsubjekt klar wieder.
- source_word: φορολογίαν
  choice: Tribut
  rationale: Das Wort bezeichnet hier eine Abgabe an die Reichsgewalt; „Tribut“ wahrt den politischen Zusammenhang besser als „Steuer“.
- source_word: οὐ μὴ ὑπομείνωσιν δοῦναι
  choice: werden sie sich keinesfalls weiterhin dazu bereitfinden, Tribut zu zahlen
  rationale: οὐ μή mit dem Konjunktiv ist nachdrücklich verneinend. ὑπομένω kann das Ausharren beziehungsweise Verbleiben unter einer Last bezeichnen; die Formulierung wahrt den Gedanken fortgesetzter Zahlung und klingt im Deutschen natürlicher als „es ertragen zu zahlen“.
- source_word: ἀλλὰ καὶ
  choice: sondern ... sogar
  rationale: Die Wendung steigert die Anschuldigung von der Tributverweigerung zum Widerstand gegen Herrscher.
- source_word: βασιλεῦσιν ἀντιστήσονται
  choice: sich den Königen widersetzen
  rationale: ἀνθίστημι bedeutet, sich entgegenzustellen oder Widerstand zu leisten; die reflexive deutsche Wendung erhält die politische Schärfe.
