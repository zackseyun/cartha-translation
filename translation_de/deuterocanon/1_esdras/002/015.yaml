  to: 'Zur Zeit des Artaxerxes, des Königs der Perser, schrieben Belemos, Mithradates, Tabellios, Rhathymos, Beeltethmos und der Schreiber Samellios sowie die übrigen, die mit ihnen verbunden waren, gegen die Bewohner von Judäa und Jerusalem[b] den folgenden Brief[a]: Sie wohnten in Samaria und an den anderen Orten.'
