    rationale: In „die übrigen, die sich ihnen angeschlossen hatten und in Samaria ... wohnten“ bezieht sich das Wohnen grammatisch nur auf „die übrigen“. Das griechische οἰκοῦντες kann und soll hier die gesamte genannte Absendergruppe charakterisieren. Eine Satzteilung bewahrt diesen Bezug ohne deutsche Mehrdeutigkeit.
