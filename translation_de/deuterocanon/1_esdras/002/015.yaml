base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/015.yaml
  text: 'In the time of Artaxerxes king of the Persians[a], Belemus and Mithradates and Tabelius and Rathymus and Beeltethmus and Samellius the scribe, and the rest who were associated with them, living in Samaria and the other places[b], wrote the following letter against the inhabitants of Judea and Jerusalem:'
translation:
  language: de
  text: 'Zur Zeit des Artaxerxes, des Königs der Perser, schrieben Belemos, Mithradates, Tabellios, Rhathymos, Beeltethmos und der Schreiber Samellios sowie die übrigen, die mit ihnen verbunden waren, gegen die Bewohner von Judäa und Jerusalem[b] den folgenden Brief[a]: Sie wohnten in Samaria und an den anderen Orten.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „den unten geschriebenen Brief“ oder „den nachstehenden Brief“.'
    reason: lexical_alternative
  - marker: b
    text: Die griechische Satzfügung bei „gegen die Bewohner von Judäa und Jerusalem“ ist stark verdichtet und enthält zudem ein syntaktisch schwieriges Pronomen. Gemeint ist offenbar ein gegen diese Bewohner gerichtetes Schreiben beziehungsweise eine schriftliche Beschwerde.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐν δὲ τοῖς ἐπʼ Ἀρταξέρξου τοῦ Περσῶν βασιλέως χρόνοις
  choice: Zur Zeit des Artaxerxes, des Königs der Perser
  rationale: „Zur Zeit“ gibt χρόνοις natürlich wieder, ohne ausdrücklich „Regierungszeit“ einzuführen. Das leicht weiterführende δέ muss im Deutschen hier nicht eigens mit „aber“ markiert werden. Der Genitiv Περσῶν bleibt als „der Perser“ erhalten.
- source_word: κατέγραψεν
  choice: schrieben
  rationale: Das Verb bezeichnet ein schriftliches Niederlegen oder Aufzeichnen. Wegen des nachfolgenden Objekts „Brief“ ist „schrieben“ klar und idiomatisch. Der griechische Singular steht trotz des mehrgliedrigen Subjekts; im Deutschen verlangt dieses den Plural.
- source_word: αὐτῶν κατὰ τῶν κατοικούντων ἐν τῇ Ἰουδαίᾳ καὶ Ἱερουσαλήμ
  choice: gegen die Bewohner von Judäa und Jerusalem
  rationale: κατά mit Genitiv hat hier eine gegen jemanden gerichtete, anklagende Bedeutung. Das syntaktisch schwierige αὐτῶν lässt sich nicht ohne Härte isoliert wiedergeben; die Fußnote weist auf die Verdichtung des griechischen Ausdrucks hin.
- source_word: Βήλεμος καὶ Μιθραδάτης καὶ Ταβέλλιος καὶ Ῥάθυμος καὶ Βεέλτεθμος καὶ Σαμέλλιος
  choice: Belemos, Mithradates, Tabellios, Rhathymos, Beeltethmos und Samellios
  rationale: Die Namen werden nach ihren griechischen Formen in einer für deutsche Leser erkennbaren Umschrift wiedergegeben.
- source_word: ὁ γραμματεύς
  choice: der Schreiber
  rationale: γραμματεύς kann einen Schreiber oder amtlichen Sekretär bezeichnen. „Schreiber“ ist die formnähere und im historischen Zusammenhang verständliche Wiedergabe.
- source_word: οἱ λοιποὶ οἱ τούτοις συντασσόμενοι
  choice: die übrigen, die sich ihnen angeschlossen hatten
  rationale: συντασσόμενοι bezeichnet ihre Zuordnung oder Verbindung mit den Genannten, ohne zwingend eine militärische Bedeutung zu haben.
- source_word: οἰκοῦντες δὲ ἐν Σαμαρείᾳ καὶ τοῖς ἄλλοις τόποις
  choice: die ... in Samaria und an den anderen Orten wohnten
  rationale: Die Formulierung bleibt nahe bei „wohnen“ und bewahrt die unbestimmte Bezeichnung „die anderen Orte“.
- source_word: τὴν ὑπογεγραμμένην ἐπιστολήν
  choice: den folgenden Brief
  rationale: ὑπογεγραμμένην bedeutet wörtlich „unten geschrieben“ beziehungsweise „nachstehend“. „Der folgende Brief“ gibt die Textfunktion im modernen Deutsch natürlich wieder.
