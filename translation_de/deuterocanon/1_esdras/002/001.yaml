base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/001.yaml
  text: In the first year of Cyrus king of Persia[a], for the fulfillment of the word of the Lord by the mouth of Jeremiah,
translation:
  language: de
  text: Im ersten Jahr des Kyros, des Königs von Persien, zur Erfüllung des Wortes des Herrn, das durch Jeremia ergangen war,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Βασιλεύοντος Κύρου Περσῶν ἔτους πρώτου
  choice: Im ersten Jahr des Kyrus, des Königs der Perser
  rationale: Der Genitivus absolutus bezeichnet zusammen mit ἔτους πρώτου den zeitlichen Rahmen. Die Wiedergabe ist im Deutschen natürlich und lässt »der Perser« als zum Königstitel gehörige Bezeichnung erkennen; der hebräische Paralleltext bestätigt den Bezug auf den König von Persien.
- source_word: εἰς συντέλειαν
  choice: zur Erfüllung kommen sollte
  rationale: Die Wendung bezeichnet das Eintreten der angekündigten Erfüllung beziehungsweise Vollendung. Die deutsche Verbalkonstruktion gibt die Zielrichtung idiomatisch wieder, ohne über den vorliegenden Satzanfang hinaus ein handelndes Subjekt vorwegzunehmen.
- source_word: ῥήματος Κυρίου
  choice: das Wort des Herrn
  rationale: Dies entspricht dem griechischen Κυρίου und wahrt die geläufige biblische Ausdrucksweise.
- source_word: ἐν στόματι Ἰερεμίου
  choice: aus dem Mund Jeremias
  rationale: Die konkrete prophetische Formel des Griechischen bleibt erhalten. »Aus dem Mund« bezeichnet hier das durch Jeremia ausgesprochene Wort und entspricht zugleich eng dem semitischen Paralleltext.
theological_decisions:
- issue: Wiedergabe von Κυρίου bei einem hebräischen Paralleltext mit dem Gottesnamen JHWH
  choice: des Herrn
  alternative: des HERRN
  rationale: Primärer Textzeuge ist das Griechische mit Κυρίου; daher steht im Haupttext »des Herrn«. Die typografisch besondere Wiedergabe »HERR« wäre eine am hebräischen Paralleltext orientierte Entscheidung, die für die Übersetzung des griechischen Textes nicht erforderlich ist.
- issue: Verhältnis des Wortes des Herrn zu Jeremia
  choice: das Wort des Herrn aus dem Mund Jeremias
  alternative: das durch Jeremia ergangene Wort des Herrn
  rationale: Die wörtlich-konkrete Formulierung bewahrt sowohl den göttlichen Ursprung als auch Jeremias Rolle als Sprecher, ohne das Verhältnis stärker systematisch auszudeuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz bleibt entsprechend der griechischen Vorlage offen und endet mit einem Komma, da der vorgelegte Versausschnitt nur den einleitenden Zeit- und Zwecksatz enthält. Keine Fußnote ist nötig, weil die angegebene englische Fußnote inhaltlich nicht mit ihrem Marker übereinstimmt und die relevante Variante Κυρίου/JHWH den deutschen Haupttext nicht zwingend ergänzungsbedürftig macht.
