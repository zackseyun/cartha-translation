base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/026.yaml
  text: They began to hinder those who were building[a], and the building of the temple in Jerusalem was stopped until the second year of the reign of Darius, king of the Persians.
translation:
  language: de
  text: Sie begannen, diejenigen zu behindern, die bauten; und der Bau des Tempels in Jerusalem ruhte[a] bis zum zweiten Regierungsjahr des Darius, des Königs der Perser.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: lag still; das griechische Verb bezeichnet hier, dass die Bauarbeiten nicht weitergingen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤρξαντο κωλύειν
  choice: Sie begannen, … zu behindern
  rationale: Die Verbindung aus dem Aorist von ἄρχω und dem Infinitiv bezeichnet den Beginn fortgesetzter Behinderung. „Behindern“ gibt die aktive Störung wieder, ohne bereits in diesem Satzteil eine vollständige Verhinderung vorwegzunehmen.
- source_word: τοὺς οἰκοδομοῦντας
  choice: die Bauenden
  rationale: Das substantivierte Präsenspartizip bezeichnet die Menschen, die gerade mit dem Bauen beschäftigt waren. „Die Bauenden“ bewahrt diesen verbalen Aspekt knapp und verständlich.
- source_word: ἤργει
  choice: ruhte
  rationale: Das Imperfekt beschreibt, dass das Bauvorhaben stilllag bzw. nicht weiterbetrieben wurde. „Ruhte“ ist im Deutschen idiomatisch und bewahrt den Zustandscharakter, ohne eine im Griechischen nicht ausdrücklich genannte handelnde Ursache in die Verbform einzutragen.
- source_word: ἡ οἰκοδομὴ τοῦ ἱεροῦ
  choice: der Bau des Tempels
  rationale: οἰκοδομή bezeichnet hier den Bauvorgang beziehungsweise das Bauvorhaben; ἱερόν wird im Jerusalemer Kontext natürlich mit „Tempel“ wiedergegeben.
- source_word: τοῦ ἐν Ἰερουσαλήμ
  choice: in Jerusalem
  rationale: Die griechische attributive Fügung lokalisiert den Tempel und wird im Deutschen am natürlichsten durch die knappe Ortsangabe wiedergegeben.
- source_word: μέχρι τοῦ δευτέρου ἔτους τῆς βασιλείας Δαρείου
  choice: bis zum zweiten Regierungsjahr des Darius
  rationale: μέχρι mit Genitiv bezeichnet den zeitlichen Endpunkt; βασιλεία meint hier die Herrschafts- bzw. Regierungszeit des Darius.
- source_word: τοῦ Περσῶν βασιλέως
  choice: des Königs der Perser
  rationale: Die Wiedergabe folgt der griechischen Genitivfügung genau und bleibt in modernem Deutsch verständlich.
