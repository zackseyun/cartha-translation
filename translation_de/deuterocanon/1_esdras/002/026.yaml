translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die zwei griechischen Hauptsätze sind durch „So“ verbunden, um den Zusammenhang zwischen Behinderung und Stillstand natürlich auszudrücken, ohne eine stärkere Kausalbehauptung einzuführen. Die Formulierung „des Darius, des Königs der Perser“ bewahrt den feierlich-historischen Ton der Vorlage.
