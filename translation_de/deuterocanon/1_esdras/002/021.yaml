base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/021.yaml
  text: 'Then the king wrote back to Rathymus[a], the recorder of the complaints, and to Beeltethmus, and to Samellius the scribe, and to the rest of their associates who lived in Samaria and Syria and Phoenicia[b], as follows:'
translation:
  language: de
  text: 'Darauf schrieb der König an Rathymus[a], den Aufzeichner der vorgebrachten Angelegenheiten[b], an Beeltethmus, an Samellius, den Schreiber, und an die übrigen mit ihnen Verbundenen, die in Samaria, Syrien und Phönizien wohnten, Folgendes zurück:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der griechische Text nennt hier Rathymus und im weiteren Satz Beeltethmus und Samellius sowie Samaria, Syrien und Phönizien. Die aramäische Parallelüberlieferung im Esrabuch weicht bei den Namen und im Wortlaut ab; die Übersetzung folgt dem griechischen Text von 1 Esdras.
    reason: textual_variant
  - marker: b
    text: Die griechische Wendung kann auch als Amtsbezeichnung verstanden werden, etwa „der Protokollführer“. Wörtlicher bezeichnet sie jemanden, der die bei ihm vorgebrachten Angelegenheiten aufzeichnete.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀντέγραψεν
  choice: schrieb … zurück
  rationale: Das Verb bezeichnet hier eine schriftliche Antwort. Die trennbare deutsche Wendung ist natürlich und bewahrt den brieflichen Sinn.
- source_word: Ῥαθύμῳ
  choice: Rathymus
  rationale: Der Name wird nach der griechischen Textgestalt wiedergegeben und nicht an die abweichende aramäische Parallelüberlieferung angeglichen.
- source_word: τῷ γράφοντι τὰ προσπίπτοντα
  choice: der die vorgebrachten Angelegenheiten niederschrieb
  rationale: Die Wiedergabe bildet sowohl das Schreiben beziehungsweise Aufzeichnen als auch die bei dem Amtsträger vorgebrachten Sachen ab, ohne einen nicht ausdrücklich genannten Amtstitel festzulegen.
- source_word: Βεελτέθμῳ
  choice: Beeltethmus
  rationale: Die griechische Namensform wird transliteriert, statt sie mit einer abweichenden Person der Parallelüberlieferung zu harmonisieren.
- source_word: Σαμελλίῳ γραμματεῖ
  choice: dem Schreiber Samellius
  rationale: „Schreiber“ gibt γραμματεύς in diesem Verwaltungszusammenhang direkt und allgemein verständlich wieder.
- source_word: τοῖς λοιποῖς τοῖς συντασσομένοις
  choice: ihren übrigen Gefährten
  rationale: Die Formulierung bezeichnet die mit den genannten Männern verbundenen oder zusammenwirkenden Personen, ohne ihren amtlichen Rang näher festzulegen.
- source_word: οἰκοῦσιν
  choice: die … wohnten
  rationale: Der Relativsatz gibt das griechische Partizip in natürlichem Deutsch wieder.
- source_word: ἐν Σαμαρείᾳ καὶ Συρίᾳ καὶ Φοινίκῃ
  choice: in Samaria, Syrien und Phönizien
  rationale: Alle drei im griechischen Hauptzeugen genannten Gebiete werden beibehalten.
- source_word: τὰ ὑπογεγραμμένα
  choice: Folgendes
  rationale: Die knappe deutsche Briefformel gibt idiomatisch das wörtlich „unten Geschriebene“ wieder.
