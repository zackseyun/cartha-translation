base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/012.yaml
  text: 'And this was their number: a thousand gold libation bowls[a], a thousand silver libation bowls, twenty-nine silver censers, thirty gold bowls, two hundred and ten silver bowls[b], and a thousand other vessels.'
translation:
  language: de
  text: 'Und dies war ihre Anzahl: tausend goldene Schalen für Trankopfer, tausend silberne Schalen für Trankopfer, neunundzwanzig silberne Räuchergefäße, dreißig goldene Schalen, zweitausendvierhundertzehn silberne Schalen[a] und tausend weitere Gefäße.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die griechische Zahlenschreibung ,βυʹ δέκα wird als 2.410 verstanden, also 2.400 plus 10.
    reason: translation_clarity
  - marker: b
    text: Die hebräische Parallele in Esra 1,9–10 nennt an dieser Stelle teilweise andere Gegenstände und Zahlen. 1 Esdras bietet hier eine abweichende, erweiterte griechische Inventarliste.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ δὲ τούτων ἀριθμὸς ἦν
  choice: Und dies war ihre Anzahl
  rationale: Gibt die einleitende Zählformel natürlich und eng am Griechischen wieder.
- source_word: σπονδεῖα
  choice: Schalen für Trankopfer
  rationale: Macht die von σπονδή her bestimmte kultische Funktion für heutige Leser unmittelbar verständlich.
- source_word: θυίσκαι ἀργυραῖ
  choice: silberne Räuchergefäße
  rationale: Bezeichnet vorsichtig Geräte zum Räuchern, ohne ihre konkrete Form über das griechische Wort hinaus festzulegen.
- source_word: φιάλαι
  choice: Schalen
  rationale: φιάλη bezeichnet hier flache kultische Gefäße; „Schalen“ ist verständlich und vermeidet das veraltete „Phiolen“.
- source_word: ἀργυραῖ ,βυʹ δέκα
  choice: zweitausendvierhundertzehn silberne Schalen
  rationale: Die griechische Zahlenschreibung ,βυʹ bezeichnet 2400; das folgende δέκα fügt zehn hinzu. So ergibt sich 2410, was auch zur Gesamtsumme des anschließenden Verses passt.
- source_word: ἄλλα σκεύη
  choice: weitere Gefäße
  rationale: Im Zusammenhang eines Tempelinventars bezeichnet σκεύη allgemein Gefäße oder Geräte; „Gefäße“ hält den Inventarcharakter fest.
theological_decisions: []
