  register: Moderner, würdiger Inventarstil mit ausgeschriebenen Zahlen. Kultische Fachsprache wird verständlich wiedergegeben; „Räuchergefäße“ wahrt gegenüber einer genaueren Formbestimmung die lexikalische Vorsicht.
