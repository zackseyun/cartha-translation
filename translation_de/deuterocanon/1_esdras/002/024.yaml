  register: Moderne, allgemein verständliche Standardsprache mit würdigem amtlichem Ton. Die Satzteilung verbessert die Lesbarkeit, ohne die logische Folge des griechischen Satzes aufzulösen. Die echten Mehrdeutigkeiten bei „bauen/wiederaufbauen“, παρὰ ταῦτα und ἐνοχλέω werden in Fußnoten offengehalten.
