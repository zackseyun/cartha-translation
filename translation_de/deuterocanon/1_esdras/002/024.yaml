base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/024.yaml
  text: So now I have ordered that those men be stopped from building the city[a], and that care be taken that nothing further be done beyond this[c][b], and that the evil matter may not advance any more to the harm of kings.
translation:
  language: de
  text: Daher habe ich nun angeordnet, jene Männer daran zu hindern, die Stadt zu bauen[a]. Es soll dafür gesorgt werden, dass nichts über diese Anordnung hinaus geschieht[b] und dass das Unheil nicht weiter fortschreitet und Königen Schwierigkeiten bereitet[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dem Zusammenhang nach ist wahrscheinlich der Wiederaufbau gemeint; im Griechischen steht jedoch schlicht „die Stadt zu bauen“.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „dass nichts entgegen dieser Anordnung geschieht“. Die griechische Wendung kann sowohl ein Handeln über den Erlass hinaus als auch ein Handeln gegen ihn bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „und Könige behelligt“. Gemeint ist, dass das schädliche Geschehen den Königen weitere Schwierigkeiten oder Störungen verursacht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέταξα
  choice: habe ich … angeordnet
  rationale: Das Aorist bezeichnet den ergangenen königlichen Befehl; das deutsche Perfekt klingt in der Mitteilung natürlich und bewahrt die abgeschlossene Verfügung.
- source_word: ἀποκωλῦσαι
  choice: daran zu hindern
  rationale: 'Gibt den Inhalt des Befehls idiomatisch wieder: Die genannten Männer sollen vom weiteren Bauen abgehalten werden.'
- source_word: τοὺς ἀνθρώπους ἐκείνους
  choice: jene Männer
  rationale: Bezeichnet die konkrete, zuvor genannte Personengruppe und hält die maskuline Form des griechischen Ausdrucks fest.
- source_word: τοῦ οἰκοδομῆσαι τὴν πόλιν
  choice: die Stadt zu bauen
  rationale: Folgt dem ausdrücklichen Wortlaut; der Kontext kann einen Wiederaufbau meinen, doch ein entsprechendes Präfix steht nicht im Griechischen.
- source_word: προνοηθῆναι
  choice: Es soll dafür gesorgt werden
  rationale: Bewahrt den amtlichen Ton und drückt die geforderte Vorsorge beziehungsweise Aufsicht klar aus.
- source_word: ὅπως μηθὲν παρὰ ταῦτα γένηται
  choice: dass nichts über diese Anordnung hinaus geschieht
  rationale: παρὰ ταῦτα kann eine Überschreitung des Erlasses oder einen Verstoß dagegen bezeichnen. Die Hauptfassung gibt die erste Möglichkeit natürlich wieder; die zweite steht in der Fußnote.
- source_word: τὰ τῆς κακίας
  choice: das Unheil
  rationale: Der substantivierte Ausdruck bezeichnet das schädliche Geschehen beziehungsweise die böse Angelegenheit; „Unheil“ ist knapp, würdig und im Deutschen natürlich.
- source_word: προβῇ ἐπὶ πλεῖον
  choice: nicht weiter fortschreitet
  rationale: Bewahrt das Bild einer sich weiterentwickelnden oder ausweitenden schädlichen Lage.
- source_word: εἰς τὸ βασιλεῖς ἐνοχλῆσαι
  choice: und Königen Schwierigkeiten bereitet
  rationale: ἐνοχλέω bedeutet belästigen, behelligen oder Schwierigkeiten bereiten. Die Formulierung erhält den Bezug auf die Könige selbst, ohne die Wendung abstrakt auf königliche Autorität umzudeuten.
