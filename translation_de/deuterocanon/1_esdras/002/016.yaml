base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/016.yaml
  text: 'To King Artaxerxes our lord: your servants[a], Rathymus, the one over records, and Samellius the scribe, and the rest of their council[c][b], and those in Coele-Syria and Phoenicia.'
translation:
  language: de
  text: 'An König Artaxerxes, unserem Herrn: Deine Diener, Rathymus, der für die vorgebrachten Angelegenheiten zuständig ist,[a] und der Schreiber Samellius sowie die übrigen Mitglieder ihres Rates und diejenigen in Koilesyrien und Phönizien.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Amtsbezeichnung ist nicht eindeutig; wörtlich etwa: „der für das Vorgebrachte zuständig ist“.'
    reason: lexical_alternative
  - marker: b
    text: Koilesyrien ist der historische Landschaftsname im griechischen Text.
    reason: cultural_note
lexical_decisions:
- source_word: Βασιλεῖ Ἀρταξέρξῃ κυρίῳ
  choice: An König Artaxerxes, unseren Herrn
  rationale: Der Dativ eröffnet die briefliche Anschrift. κυρίῳ ist hier ein ehrerbietiger Hoheitstitel; „unseren“ ist im Griechischen nicht ausdrücklich gesetzt, ergibt sich aber natürlich aus dem anschließenden „deine Diener“.
- source_word: οἱ παῖδές σου
  choice: deine Diener
  rationale: παῖς bezeichnet in königlicher Korrespondenz untergeordnete Amtsträger, nicht Kinder; „Diener“ wahrt den höfischen Ton.
- source_word: Ῥάθυμος
  choice: Rathymus
  rationale: Die Namensform folgt dem griechischen Hauptzeugen; die ungefähr entsprechende Form Rehum im masoretischen Paralleltext wird nicht an ihre Stelle gesetzt.
- source_word: ὁ τὰ προσπίπτοντα
  choice: der für die vorgebrachten Angelegenheiten zuständig ist
  rationale: Die schwierige Amtsbezeichnung bedeutet wörtlich ungefähr „der über das Vorgebrachte“. Die Übersetzung bewahrt diese administrative Grundbedeutung, ohne einen bestimmten Amtstitel wie „Kanzler“ oder „Archivar“ vorauszusetzen.
- source_word: Σαμέλλιος ὁ γραμματεὺς
  choice: der Schreiber Samellius
  rationale: γραμματεύς bezeichnet hier einen administrativen Schreiber beziehungsweise Sekretär. „Schreiber“ bleibt quellennah und ist im historischen Zusammenhang verständlich.
- source_word: οἱ ἐπίλοιποι τῆς βουλῆς αὐτῶν
  choice: die übrigen Mitglieder ihres Rates
  rationale: Die explizite Wiedergabe der Mitglieder macht den kollektiven Sinn von βουλή in natürlichem Deutsch deutlich.
- source_word: οἱ ἐν κοίλῃ Συρίᾳ καὶ Φοινίκῃ
  choice: die Bewohner von Koilesyrien und Phönizien
  rationale: οἱ ἐν bezeichnet die dort befindlichen Personen. Koilesyrien ist die etablierte deutsche Form des historischen Landschaftsnamens Κοίλη Συρία.
