translation_notes:
  register: Moderne, würdevolle Briefsprache mit höfischer Anrede. Die griechischen Namensformen und der historische Gebietsname bleiben erhalten; die unsichere Amtsbezeichnung wird bewusst nicht auf einen spezifischen Amtstitel festgelegt.
