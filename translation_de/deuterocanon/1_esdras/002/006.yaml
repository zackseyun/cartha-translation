base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/006.yaml
  text: Therefore[a], as many as live in the various places, let the men in his place help him with gold and silver, with gifts, with horses and livestock[b], along with the other things added as vowed offerings for the temple of the Lord in Jerusalem.
translation:
  language: de
  text: Wer also an verschiedenen Orten wohnt, dem sollen die Menschen an seinem Wohnort mit Gold und Silber, mit Gaben, mit Pferden und Vieh[a] helfen, samt den anderen Gaben, die aufgrund von Gelübden zusätzlich für den Tempel des Herrn in Jerusalem beigesteuert werden.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der griechische Text nennt ausdrücklich „Pferde und Vieh“. Der hebräische Paralleltext in Esra 1,4–6 weicht davon ab und nennt Besitz beziehungsweise Güter und Vieh.
    reason: alternative_reading
  - marker: b
    text: 'Oder: „samt den anderen Gaben, die gemäß Gelübden zusätzlich für den Tempel des Herrn in Jerusalem gegeben werden“. Der griechische Ausdruck verbindet die zusätzlichen Gaben mit Gelübden, ohne die genaue Art dieser Verbindung näher festzulegen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅσοι οὖν κατὰ τοὺς τόπους οἰκοῦσιν
  choice: Wer also an einem der verschiedenen Orte wohnt
  rationale: Die indefinite Konstruktion ὅσοι wird im Deutschen natürlich mit „wer“ wiedergegeben; οὖν bleibt als folgerndes „also“ erhalten. Die Ortsangabe wird distributiv verstanden.
- source_word: βοηθείτωσαν αὐτῷ οἱ ἐν τῷ τόπῳ αὐτοῦ
  choice: dem sollen die Menschen an seinem Wohnort ... helfen
  rationale: Die deutsche Satzstellung macht den singularischen Bezug von αὐτῷ auf den jeweils Betroffenen deutlich. „Menschen“ gibt die substantivierte Ortsangabe geschlechtsneutral und natürlich wieder.
- source_word: ἐν χρυσίῳ καὶ ἐν ἀργυρίῳ, ἐν δόσεσιν
  choice: mit Gold und Silber, mit Gaben
  rationale: ἐν bezeichnet hier die Mittel der Unterstützung. „Gaben“ wahrt die allgemeine Bedeutung von δόσεις, ohne schon kultische Opfer zu unterstellen.
- source_word: μεθʼ ἵππων καὶ κτηνῶν
  choice: mit Pferden und Vieh
  rationale: Die Übersetzung folgt dem griechischen Hauptzeugen ausdrücklich mit „Pferden“; κτήνη bezeichnet Nutz- beziehungsweise Haustiere und wird knapp als „Vieh“ wiedergegeben.
- source_word: σὺν τοῖς ἄλλοις τοῖς κατʼ εὐχὰς προστεθειμένοις
  choice: samt den anderen Dingen, die ... als Weihegaben hinzugefügt werden
  rationale: „Samt“ bewahrt den additiven Sinn von σύν. κατʼ εὐχάς bezeichnet aufgrund eines Gelübdes geweihte Gaben; „Weihegaben“ ist im Deutschen verständlich und lässt offen, ob sie bei der Reise oder am Tempel hinzugefügt werden.
- source_word: εἰς τὸ ἱερὸν τοῦ κυρίου τὸ ἐν Ἱερουσαλήμ
  choice: dem Tempel des Herrn in Jerusalem
  rationale: ἱερόν wird entsprechend dem griechischen Wortlaut direkt als „Tempel“ übersetzt. Der Dativ nach „hinzufügen“ gibt die Zielrichtung von εἰς idiomatisch wieder; κύριος erscheint gemäß der griechischen Vorlage als „Herr“.
theological_decisions:
- issue: Wiedergabe von κύριος im Bezug auf Israels Gott
  choice: Herr
  alternative: HERR
  rationale: Der primäre Textzeuge bietet κύριος und nicht unmittelbar das Tetragramm; daher folgt die Übersetzung der griechischen Form mit „Herr“.
- issue: Ziel und Charakter der zusätzlich gegebenen Dinge
  choice: dem Tempel ... als Weihegaben hinzugefügt
  alternative: für den Tempel ... aufgrund von Gelübden beigesteuert
  rationale: Die Formulierung wahrt den votiven Sinn von κατʼ εὐχάς und die Zielrichtung von εἰς, ohne genauer festzulegen, wann oder durch wen die zusätzlichen Gaben beigesteuert werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz bleibt nah an der griechischen Struktur, wird aber durch eine deutsche indefinite Relativkonstruktion und idiomatische Kasusführung lesbar gemacht. Die beiden Fußnotenmarker [a] und [b] stehen im Haupttext.
