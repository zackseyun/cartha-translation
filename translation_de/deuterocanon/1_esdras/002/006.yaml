revisions:
- from: Wer also an einem der verschiedenen Orte wohnt, dem sollen die Menschen an seinem Wohnort mit Gold und Silber, mit Gaben, mit Pferden und Vieh[a] helfen, samt den anderen Dingen, die dem Tempel des Herrn in Jerusalem als Weihegaben hinzugefügt werden.[b]
  to: Wer also an verschiedenen Orten wohnt, dem sollen die Menschen an seinem Wohnort mit Gold und Silber, mit Gaben, mit Pferden und Vieh[a] helfen, samt den anderen Gaben, die aufgrund von Gelübden zusätzlich für den Tempel des Herrn in Jerusalem beigesteuert werden.[b]
