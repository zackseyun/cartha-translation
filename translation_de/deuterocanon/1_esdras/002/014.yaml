base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/014.yaml
  text: and it was brought up by Sheshbazzar together with those from the captivity[b][a], from Babylon to Jerusalem.
translation:
  language: de
  text: Und es[b] wurde von Samanassar[a] zusammen mit denen aus der Gefangenschaft aus Babylon nach Jerusalem hinaufgebracht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die griechische Namensform lautet „Samanassar“. Im entsprechenden Esra-Zusammenhang wird sie häufig mit Scheschbazzar in Verbindung gebracht.
    reason: alternative_reading
  - marker: b
    text: Das griechische Verb steht im Singular („es wurde hinaufgebracht“), doch das gemeinte Subjekt wird hier nicht erneut genannt; vermutlich ist ein zuvor erwähnter Gegenstand, etwa ein Tempelgerät, gemeint.
    reason: cross_reference
lexical_decisions:
- source_word: ἀνηνέχθη
  choice: wurde … hinaufgebracht
  rationale: Der Aorist Passiv von ἀναφέρω bezeichnet hier das Hinaufbringen nach Jerusalem. Die Übersetzung bewahrt sowohl das Passiv als auch die im biblischen Sprachgebrauch übliche Vorstellung des Hinaufziehens nach Jerusalem.
- source_word: ὑπὸ Σαμανασσάρου
  choice: von Scheschbazzar
  rationale: Die griechische Namensform bezeichnet im entsprechenden Esra-Zusammenhang offenbar Scheschbazzar. Die im Deutschen geläufige biblische Namensform macht den Bezug deutlich; die griechische Form wird in einer Fußnote dokumentiert.
- source_word: ἅμα τοῖς ἐκ τῆς αἰχμαλωσίας
  choice: zusammen mit denen, die aus der Gefangenschaft kamen
  rationale: ἅμα mit dem Dativ bedeutet „zusammen mit“. Die Formulierung gibt ἐκ τῆς αἰχμαλωσίας eng wieder und ist zugleich in modernem Deutsch verständlich; das im Deutschen ergänzte „kamen“ macht die Herkunftsangabe idiomatisch.
- source_word: ἐκ Βαβυλῶνος
  choice: von Babylon
  rationale: Gibt den Ausgangsort der Bewegung direkt wieder.
- source_word: εἰς Ἱερουσαλήμ
  choice: nach Jerusalem
  rationale: Natürliche deutsche Richtungsangabe; zusammen mit „hinaufgebracht“ bleibt die räumliche Perspektive des griechischen Textes erhalten.
theological_decisions:
- issue: Identifizierung der Namensform Σαμανασσάρου
  choice: Scheschbazzar im Haupttext
  alternative: Samanassar als unmittelbare Transliteration der griechischen Form
  rationale: Der entsprechende Esra-Kontext legt nahe, dass dieselbe Amtsperson gemeint ist. Die vertraute deutsche Namensform erleichtert die Identifizierung, ohne die abweichende griechische Überlieferungsform zu verschweigen.
- issue: Nicht ausdrücklich genanntes Subjekt von ἀνηνέχθη
  choice: Das grammatisch erforderliche Pronomen „es“ verwenden und seine Unbestimmtheit bewahren
  alternative: Ein bestimmtes Gefäß oder einen Sammelbegriff wie „die Geräte“ in den Text einsetzen
  rationale: Die griechische Verbform ist Singular, nennt das Subjekt an dieser Stelle jedoch nicht erneut. Eine konkrete Ergänzung würde die im Ausgangstext bestehende Unbestimmtheit unnötig auflösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung bleibt nahe am griechischen Bewegungsablauf, ohne unnatürlich zu wirken. „Gefangenschaft“ bewahrt die konkrete Bedeutung von αἰχμαλωσία; die Fußnoten legen sowohl die Namensfrage als auch das ausgelassene Subjekt offen.
