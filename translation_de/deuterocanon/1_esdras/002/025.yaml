base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/025.yaml
  text: Then[a], when what had been written by King Artaxerxes was read, Rathymus and Samellius the scribe, and those aligned with them[b], hurried up to Jerusalem with horsemen and a battle formation of a crowd.
translation:
  language: de
  text: Als dann vorgelesen worden war, was von König Artaxerxes geschrieben worden war, zogen Rathymus und der Schreiber Samellius[a] sowie die, die sich ihnen anschlossen, eilig nach Jerusalem hinauf, mit Reitern und einer zum Kampf aufgestellten Menge[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die griechischen Namensformen lauten „Rathymus“ und „Samellius“; im aramäischen Parallelbericht entsprechen ihnen Rehum und Schimschai.
    reason: alternative_reading
  - marker: b
    text: 'Oder: „mit Reiterei und einer in Schlachtordnung aufgestellten Menge“. Die griechische Wendung ist stark verdichtet und kann eine bewaffnete Begleitung oder ein zum gewaltsamen Vorgehen aufgebotenes Gefolge bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναγνωσθέντων
  choice: als … vorgelesen worden war
  rationale: Der passive Aoristpartizip im Genitivus absolutus bezeichnet einen vorausgehenden zeitlichen Umstand. „Vorgelesen“ passt zum amtlichen Schreiben und gibt den passiven Sinn wieder.
- source_word: τῶν παρὰ τοῦ βασιλέως Ἀρταξέρξου γραφέντων
  choice: was von König Artaxerxes geschrieben worden war
  rationale: Die griechische Formulierung spricht allgemein vom Geschriebenen und verwendet keinen ausdrücklichen Fachbegriff für einen Brief. Die passive Form bleibt erhalten.
- source_word: Ῥάθυμος; Σαμέλλιος
  choice: Rathymus; Samellius
  rationale: Die Namensformen werden gemäß dem griechischen Hauptzeugen wiedergegeben; die entsprechenden semitischen Namen stehen in der Fußnote.
- source_word: ὁ γραμματεύς
  choice: der Schreiber
  rationale: „Schreiber“ bewahrt die amtliche und schriftkundige Funktion, ohne die Stelle enger als „Sekretär“ festzulegen.
- source_word: οἱ τούτοις συντασσόμενοι
  choice: alle, die auf ihrer Seite standen
  rationale: Die Wendung bezeichnet Personen, die sich diesen Männern anschlossen oder mit ihnen Partei ergriffen. Die deutsche Formulierung ist verständlich und lässt die genaue Art der Verbindung offen.
- source_word: ἀναζεύξαντες κατὰ σπουδήν
  choice: zogen … eilig … hinauf
  rationale: ἀναζεύγω bezeichnet hier das Aufbrechen beziehungsweise Losziehen; κατὰ σπουδήν bringt die Eile zum Ausdruck. „Hinauf“ entspricht der üblichen Bewegungsangabe nach Jerusalem.
- source_word: μεθ’ ἵππου
  choice: mit Reitern
  rationale: ἵππος steht im Singular, ist hier aber wahrscheinlich kollektiv gebraucht. „Reiter“ vermittelt die berittene Begleitung, ohne sie zwingend als reguläre Kavallerie zu bestimmen.
- source_word: ὄχλου παρατάξεως
  choice: einer zum Kampf aufgestellten Menge
  rationale: Die gedrängte griechische Verbindung vereint ὄχλος („Menge“) mit παράταξις („Aufstellung“, besonders zur Schlacht). Die Übersetzung bewahrt beide Bestandteile und ihren militärischen Klang.
