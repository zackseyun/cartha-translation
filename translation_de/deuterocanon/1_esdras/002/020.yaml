base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/020.yaml
  text: Now therefore we make known to you[a], lord king, that if this city is built and its walls are raised up, there will no longer be for you passage into Coele-Syria and Phoenicia.
translation:
  language: de
  text: 'Nun weisen wir dich, Herr und König, darauf hin: Wenn diese Stadt gebaut und ihre Mauern aufgerichtet werden, wird es für dich keinen Weg mehr nach Koilesyrien und Phönizien geben.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „wird es für dich keinen Ausgang mehr nach Koilesyrien und Phönizien geben“. Das griechische Wort kann hier einen Weg hinaus, einen Durchgang oder einen Zugang zu diesen Gebieten bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑποδεικνύομέν
  choice: weisen wir dich … darauf hin
  rationale: Das Verb leitet hier eine förmliche Mitteilung an den König ein. Die Wendung ist im modernen Deutschen natürlich und bewahrt den Hinweischarakter des griechischen Verbs.
- source_word: κύριε βασιλεῦ
  choice: Herr und König
  rationale: Die Anrede bewahrt beide griechischen Titel. Das verbindende „und“ macht sie im Deutschen idiomatisch, ohne ein im Ausgangstext nicht ausdrücklich vorhandenes „mein“ hinzuzufügen.
- source_word: οἰκοδομηθῇ
  choice: gebaut
  rationale: Das griechische Verb bezeichnet schlicht das Bauen; „wiederaufgebaut“ wäre kontextuell möglich, ist aber morphologisch nicht ausdrücklich markiert.
- source_word: τὰ ταύτης τείχη ἀνασταθῇ
  choice: ihre Mauern wieder aufgerichtet werden
  rationale: „Aufgerichtet“ bildet die Bauvorstellung von ἀνίστημι ab. „Wieder“ gibt bei bereits vorhandenen Stadtmauern den natürlichen deutschen Sinn der erneuten Errichtung wieder, ohne das vorherige οἰκοδομηθῇ ebenfalls entsprechend zu präzisieren.
- source_word: ἔξοδός
  choice: Zugang
  rationale: Wörtlich bezeichnet das Wort einen Ausgang oder Weg hinaus. Im Zusammenhang geht es um den Verlust eines Weges beziehungsweise politisch-militärischen Zugriffs auf die genannten Gebiete; „Zugang“ ist dafür im Deutschen klar und natürlich.
- source_word: κοίλην Συρίαν
  choice: Koilesyrien
  rationale: Dies ist die gebräuchliche deutsche Form des hellenistischen geografischen Namens; eine Übersetzung als „Hohlsyrien“ wäre missverständlich.
- source_word: Φοινίκην
  choice: Phönizien
  rationale: Gebräuchliche deutsche Form des geografischen Namens.
