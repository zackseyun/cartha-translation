base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/011.yaml
  text: And through him they were handed over to Sanamassar[c][b][a], governor of Judea.
translation:
  language: de
  text: Durch ihn[a] aber wurden sie Sanamassar[b], dem Vorsteher von Judäa[c], übergeben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „durch diesen“; gemeint ist die vermittelnde Mitwirkung bei der Übergabe.'
    reason: lexical_alternative
  - marker: b
    text: In der hebräischen Parallelstelle (Esra 1,8) steht der Name „Scheschbazzar“.
    reason: alternative_reading
  - marker: c
    text: Griechisch „Judäa“; die hebräische Parallele hat „Juda“.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ δὲ τούτου
  choice: Durch ihn aber
  rationale: Die Präposition διά mit Genitiv bezeichnet hier Vermittlung beziehungsweise handelnde Mitwirkung; τούτου verweist auf die zuvor genannte männliche Person. Das nachgestellte „aber“ gibt δέ wieder, ohne einen stärkeren Gegensatz zu behaupten.
- source_word: παρεδόθησαν
  choice: wurden … übergeben
  rationale: Der Passiv von παραδίδωμι bezeichnet hier die Übergabe der im Kontext genannten Gegenstände und bewahrt sowohl den Vorgang als auch die passive Form.
- source_word: Σαναμασσάρῳ
  choice: Sanamassar
  rationale: Der Name wird entsprechend der maßgeblichen griechischen Form wiedergegeben; die abweichende hebräische Namensform wird in einer Fußnote dokumentiert.
- source_word: προστάτῃ
  choice: Vorsteher
  rationale: προστάτης bezeichnet einen vorgesetzten Leiter oder Amtsträger. „Vorsteher“ bewahrt diese Breite besser als das spezifischere „Statthalter“ und passt zum administrativen Zusammenhang.
- source_word: τῆς Ἰουδαίας
  choice: von Judäa
  rationale: Die griechische Gebietsbezeichnung Ἰουδαία wird unmittelbar als „Judäa“ wiedergegeben; die hebräische Parallele hat „Juda“.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung ist natürlich deutsch, bewahrt aber den vermittelnden Ausdruck am Satzanfang und die passive Übergabe. „Vorsteher“ vermeidet eine unnötige Festlegung auf einen exakt definierten Verwaltungstitel.
