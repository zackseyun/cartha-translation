base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/022.yaml
  text: I read the letter that you sent to me. Therefore I gave orders to investigate[a], and it was found that that city has from ancient times set itself in opposition to kings,
translation:
  language: de
  text: Ich habe den Brief gelesen, den ihr mir geschickt habt. Daraufhin ordnete ich eine Untersuchung an. Dabei wurde festgestellt, dass jene Stadt sich von alters her gegen Könige stellt,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀνέγνων
  choice: Ich habe … gelesen
  rationale: Der Aorist bezeichnet hier das abgeschlossene Lesen des eingegangenen Briefes. Das deutsche Perfekt klingt in einer berichtenden Antwort natürlich und gegenwartsbezogen.
- source_word: ἐπιστολήν
  choice: Brief
  rationale: Dies ist die gewöhnliche und im Verwaltungskontext passende Bedeutung.
- source_word: ἣν πέμψατε πρὸς ἐμέ
  choice: den ihr mir geschickt habt
  rationale: Die Formulierung gibt Adressat und abgeschlossene Sendung idiomatisch wieder.
- source_word: ἐπέταξα
  choice: ordnete ich … an
  rationale: Das Verb bezeichnet das Erteilen eines verbindlichen Befehls; die Wendung wahrt den königlich-administrativen Ton.
- source_word: ἐπισκέψασθαι
  choice: eine Untersuchung
  rationale: Im behördlichen Zusammenhang geht es um eine angeordnete Prüfung oder Nachforschung, nicht nur um ein bloßes Ansehen.
- source_word: εὑρέθη
  choice: Dabei wurde festgestellt
  rationale: Die unpersönliche Passivform ist eine amtliche Ergebnisformel; „festgestellt“ entspricht diesem Register im modernen Deutsch.
- source_word: ἐξ αἰῶνος
  choice: seit alters
  rationale: Die Wendung meint hier eine seit langer Vergangenheit bestehende historische Lage, nicht metaphysische Ewigkeit.
- source_word: ἀντιπαρατάσσουσα
  choice: sich … entgegenstellt
  rationale: Das Partizip beschreibt ein aktives Stellungnehmen gegen jemanden. Die Wiedergabe erhält die fortdauernde und reflexive Nuance, ohne sie zwingend als offenen Aufstand zu deuten.
- source_word: βασιλεῦσιν
  choice: den Königen
  rationale: Der Dativ Plural bezeichnet die Herrscher, gegen die sich die Stadt nach dem Untersuchungsbefund seit alters stellt.
