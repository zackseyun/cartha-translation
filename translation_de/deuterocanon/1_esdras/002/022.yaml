translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit leicht amtlichem Ton. Der Satzschluss bleibt mit Komma offen, da der griechische Vers syntaktisch in den folgenden Zusammenhang weiterführt. Keine Fußnote ist erforderlich; die wesentlichen Bedeutungsnuancen lassen sich im Haupttext bewahren.
