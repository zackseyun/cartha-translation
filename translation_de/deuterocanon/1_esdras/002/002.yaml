- from: 'Da weckte der Herr den Geist des Kyrus, des Königs der Perser,[a] und dieser ließ in seinem ganzen Königreich einen Aufruf ergehen, zugleich auch schriftlich. Er lautete:'
  to: 'Der Herr regte den Geist des Kyrus, des Königs der Perser,[a] an, und dieser erließ in seinem ganzen Königreich eine Proklamation und ließ sie zugleich in Schriftform verbreiten. Er sagte:'
  rationale: Die Revision wahrt die griechische Aussagefolge und die Ambiguität von πνεῦμα, verwendet aber idiomatischeres modernes Deutsch. Sie gibt ἅμα als „zugleich“ wieder und lässt διὰ γραπτῶν als schriftliche Verbreitung erkennbar werden. Die Einleitung „Er sagte:“ hält die syntaktische Bezugnahme von λέγων auf Kyrus aufrecht und führt offen in den folgenden Vers.
