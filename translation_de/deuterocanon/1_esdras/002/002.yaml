base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/002.yaml
  text: the Lord stirred up the spirit of Cyrus king of the Persians[a], and he made a proclamation throughout all his kingdom, and also in writing, saying,
translation:
  language: de
  text: 'Der Herr regte den Geist des Kyrus, des Königs der Perser,[a] an, und dieser erließ in seinem ganzen Königreich eine Proklamation und ließ sie zugleich in Schriftform verbreiten. Er sagte:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Griechisch: „König der Perser“; im hebräischen Paralleltext in Esra 1,1 steht „König von Persien“.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἤγειρεν
  choice: weckte
  rationale: ἐγείρω bezeichnet hier Gottes Einwirken auf die innere Haltung des Kyrus. „Weckte“ ist im Deutschen natürlich und bewahrt die Vorstellung eines von Gott ausgelösten inneren Antriebs.
- source_word: Κύριος
  choice: der Herr
  rationale: Das griechische Κύριος wird transparent als „der Herr“ wiedergegeben. Der Paralleltext identifiziert ihn mit dem Gott Israels, doch die Übersetzung bleibt bei der Form des griechischen Haupttextes.
- source_word: τὸ πνεῦμα
  choice: den Geist
  rationale: Der griechische Text enthält kein ausdrückliches Possessivpronomen. „Den Geist des Kyrus“ ergibt sich durch die nachfolgende Genitivverbindung und wahrt zugleich die anthropologische Bildsprache.
- source_word: Κύρου
  choice: Kyrus
  rationale: „Kyrus“ ist die im Deutschen etablierte Form des Königsnamens und wird durch den hebräischen Paralleltext bestätigt.
- source_word: βασιλέως Περσῶν
  choice: des Königs der Perser
  rationale: Der griechische Text hat ausdrücklich den Plural „der Perser“. Diese Form wird beibehalten und nicht an „König von Persien“ im hebräischen Paralleltext angeglichen.
- source_word: ἐκήρυξεν
  choice: ließ … einen Aufruf ergehen
  rationale: Das Verb bezeichnet eine öffentlich bekannt gemachte Botschaft. Die kausative deutsche Wendung passt dazu, dass Kyrus als König die Bekanntmachung veranlasst.
- source_word: ὅλῃ τῇ βασιλείᾳ αὐτοῦ
  choice: in seinem ganzen Königreich
  rationale: Die Dativverbindung bezeichnet den gesamten Herrschaftsbereich, in dem der Aufruf bekannt gemacht wurde.
- source_word: ἅμα
  choice: zugleich auch
  rationale: Die Wendung bewahrt sowohl den gleichzeitigen als auch den hinzufügenden Sinn und verbindet die öffentliche Bekanntmachung mit ihrer schriftlichen Form.
- source_word: διὰ γραπτῶν
  choice: schriftlich
  rationale: Die knappe deutsche Wiedergabe bezeichnet die schriftliche Übermittlung, ohne das nicht näher bestimmte Medium als Briefe oder Urkunden zu präzisieren.
- source_word: λέγων
  choice: 'Er lautete:'
  rationale: Das Partizip führt den Wortlaut des anschließenden Erlasses ein. „Er lautete:“ ist im Deutschen natürlicher als „indem er sagte“ und hält den Satz zum folgenden Vers hin offen.
theological_decisions:
- issue: Göttliches Handeln beim Erlass des Kyrus
  choice: Der Herr weckt unmittelbar den Geist des Kyrus.
  alternative: Der Herr lässt das Handeln des Kyrus lediglich zu oder Kyrus handelt ausschließlich aus politischen Beweggründen.
  rationale: Der griechische Text schreibt den inneren Anstoß ausdrücklich dem Herrn zu. Diese direkte göttliche Initiative wird weder abgeschwächt noch über die Aussage des Textes hinaus erklärt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung stellt die göttliche Initiative heraus, während „Aufruf“ und „schriftlich“ allgemein verständlich bleiben. Die Interpunktion führt unmittelbar in den Wortlaut des folgenden Verses.
