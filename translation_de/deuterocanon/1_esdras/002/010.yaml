base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/010.yaml
  text: Then Cyrus king of the Persians brought them out and handed them over to Mithridates[b][a], his treasurer.
translation:
  language: de
  text: Da holte Kyros, der König der Perser, sie[a] heraus und übergab sie Mithridates, seinem Schatzmeister.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint sind die im vorigen Vers genannten Tempelgeräte.
    reason: cross_reference
  - marker: b
    text: 'Oder: „dem Hüter seiner Schatzkammer“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξήνεγκεν
  choice: holte … heraus
  rationale: Das Verb bezeichnet das Herausbringen oder Herausholen. „Holte … heraus“ ist im Deutschen natürlich und gibt die Bewegung aus der Verwahrung in die anschließende Übergabe wieder.
- source_word: Κῦρος ὁ βασιλεὺς Περσῶν
  choice: Kyros, der König der Perser
  rationale: Die Formulierung folgt dem griechischen Titel und bewahrt den ethnischen Plural Περσῶν. „Kyros“ ist die im Deutschen übliche Namensform.
- source_word: παρέδωκεν
  choice: übergab
  rationale: Das Verb bezeichnet hier eine förmliche Übergabe in die Obhut eines zuständigen Beamten; „übergab“ trifft diesen amtlichen Vorgang präzise.
- source_word: Μιθριδάτῃ
  choice: Mithridates
  rationale: Der Eigenname wird in seiner geläufigen deutschen Form wiedergegeben.
- source_word: τῷ ἑαυτοῦ γαζοφύλακι
  choice: seinem Schatzmeister
  rationale: γαζοφύλαξ bezeichnet einen für den Schatz beziehungsweise die Schatzkammer zuständigen Beamten. „Schatzmeister“ ist knapp, verständlich und wahrt den administrativen Sinn; ἑαυτοῦ wird mit „seinem“ wiedergegeben.
- source_word: αὐτά
  choice: sie
  rationale: Das sächliche Pluralpronomen verweist auf die im vorigen Vers genannten Tempelgeräte. Das deutsche Pronomen richtet sich grammatisch nach „Geräte“ und vermeidet eine erklärende Ergänzung im Haupttext.
- source_word: δέ
  choice: Da
  rationale: δέ verbindet den Satz mit dem vorherigen Zusammenhang. Das einleitende „Da“ gibt die fortschreitende Erzählung im Deutschen flüssig wieder, ohne einen starken Gegensatz einzuführen.
