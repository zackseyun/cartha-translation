base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/007.yaml
  text: Then the heads of the ancestral houses of the tribes of Judah and Benjamin[a], and the priests and the Levites, and everyone whose spirit the Lord had stirred up, arose to go up to build the house of the Lord that is in Jerusalem.
translation:
  language: de
  text: Da machten sich die Oberhäupter der Sippen aus den Stämmen Juda und Benjamin, die Priester und die Leviten sowie alle, deren Geist der Herr[a] geweckt hatte, auf, um hinaufzuziehen und das Haus des Herrn in Jerusalem zu bauen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die hebräische Parallelstelle in Esra 1,5 lautet: „alle, deren Geist Gott geweckt hatte“. Hier steht in 1 Esdras: „der Herr“.'
    reason: alternative_reading
lexical_decisions:
- source_word: καταστήσαντες
  choice: machten sich … auf
  rationale: Die überlieferte griechische Form ist im Zusammenhang schwierig. Die hebräische Parallelstelle hat וַיָּקוּמוּ („sie erhoben sich“). „Sich aufmachen“ gibt zusammen mit dem folgenden Bewegungsinfinitiv den kontextuellen Sinn natürlich wieder, ohne die nicht gestützte Bedeutung „wurden eingesetzt“ zu wählen.
- source_word: οἱ ἀρχίφυλοι τῶν πατριῶν
  choice: die Oberhäupter der Sippen
  rationale: Gemeint sind die führenden Männer größerer verwandtschaftlicher Einheiten. „Sippen“ ist im modernen Deutschen verständlicher als „Vaterhäuser“ und bewahrt dennoch die familiengeschichtliche Struktur.
- source_word: τῆς Ἰούδα καὶ Βενιαμεὶν φυλῆς
  choice: aus den Stämmen Juda und Benjamin
  rationale: Die griechische Formulierung ist gedrängt; der Plural „Stämme“ gibt den erkennbaren Bezug auf Juda und Benjamin verständlich wieder.
- source_word: ἤγειρεν … τὸ πνεῦμα
  choice: deren Geist … geweckt hatte
  rationale: Die Wendung beschreibt einen inneren göttlichen Anstoß. „Den Geist wecken“ erhält das Bild des Ausgangstextes und ist in würdigem modernem Deutsch verständlich.
- source_word: Κύριος
  choice: der Herr
  rationale: Der griechische Primärtext hat Κύριος. Die abweichende Gottesbezeichnung der hebräischen Parallelstelle wird in der Fußnote dokumentiert.
- source_word: ἀναβῆναι
  choice: hinaufzuziehen
  rationale: Das Verb bewahrt die herkömmliche räumlich-theologische Rede vom Hinaufziehen nach Jerusalem und klingt im Kontext natürlich.
- source_word: οἰκοδομῆσαι οἶκον
  choice: das Haus … zu bauen
  rationale: Der griechische Text sagt ausdrücklich „bauen“, nicht „wiederaufbauen“. „Haus“ bewahrt die Tempelbezeichnung des Ausgangstextes.
- source_word: τῷ κυρίῳ τὸν ἐν Ἱερουσαλήμ
  choice: das Haus des Herrn in Jerusalem
  rationale: Die Formulierung bezeichnet das dem Herrn gehörende Haus und verortet es in Jerusalem; die knappe deutsche Fassung bildet beides ohne unnötige Ergänzungen ab.
theological_decisions:
- issue: Die Gottesbezeichnung unterscheidet sich zwischen dem griechischen Primärtext und der hebräischen Parallelstelle.
  choice: der Herr hatte … geweckt
  alternative: Gott hatte … geweckt
  rationale: Für 1 Esdras ist der griechische Text maßgeblich und liest Κύριος. Die hebräische Parallelstelle in Esra 1,5 liest אֱלֹהִים („Gott“); diese Variante wird transparent in der Fußnote bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Sippen“ vermeidet das heute schwer verständliche „Vaterhäuser“, während „hinaufziehen“ und „Haus des Herrn“ die biblische Bild- und Begriffswelt erhalten.
