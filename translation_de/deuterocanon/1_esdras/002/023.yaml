base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/023.yaml
  text: and its people were carrying out rebellions and wars within it[a], and strong and harsh kings were in Jerusalem, ruling and exacting tribute from Coele-Syria and Phoenicia.
translation:
  language: de
  text: Und die Menschen zettelten in ihr Aufstände und Kriege an.[a] In Jerusalem gab es mächtige und harte Könige, die herrschten und von Koilesyrien und Phönizien Tribut einzogen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die aramäische Parallele in Esra 4,20 beschreibt Jerusalem als eine aufrührerische Stadt, die Königen und Provinzen Schaden zufügte und in der man seit alters Aufruhr verübte. 1 Esdras erweitert die Darstellung um „Aufstände und Kriege“ sowie um den Tribut aus Koilesyrien und Phönizien.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποστάσεις
  choice: Aufstände
  rationale: Bezeichnet im politischen Zusammenhang Erhebungen oder Rebellionen; „Aufstände“ wahrt den Plural und ist in modernem Deutsch natürlich.
- source_word: πολέμους
  choice: Kriege
  rationale: Gibt den griechischen Plural direkt wieder, ohne ihn auf einzelne Schlachten einzuengen.
- source_word: συντελοῦντες
  choice: zettelten … an
  rationale: Drückt die aktive Verursachung beziehungsweise Durchführung von Aufständen und Kriegen idiomatisch aus.
- source_word: ἰσχυροὶ καὶ σκληροὶ
  choice: starke und harte
  rationale: 'Bewahrt beide Charakterisierungen: politische Macht und strenge beziehungsweise rücksichtslose Herrschaft.'
- source_word: κυριεύοντες
  choice: hatten … geherrscht
  rationale: Bezeichnet die Ausübung von Herrschaft; das Plusquamperfekt passt zum berichteten historischen Rückblick des Briefes.
- source_word: φορολογοῦντες
  choice: Tribut eingezogen
  rationale: Gibt die herrschaftliche Erhebung von Abgaben präziser wieder als das neutralere „besteuert“.
- source_word: κοίλην Συρίαν
  choice: Koilesyrien
  rationale: Eingebürgerte deutsche Form des hellenistischen geografischen Namens.
- source_word: Φοινίκην
  choice: Phönizien
  rationale: Übliche deutsche Bezeichnung der Region.
- source_word: ἐν αὐτῇ
  choice: in ihr
  rationale: Bezieht sich auf die zuvor genannte Stadt Jerusalem und erhält die feminine Rückverweisung.
theological_decisions:
- issue: Verhältnis der ausführlicheren griechischen Fassung zur aramäischen Parallele in Esra 4,19–20
  choice: Die Angaben über Aufstände, Kriege sowie den Tribut aus Koilesyrien und Phönizien stehen vollständig im Haupttext.
  alternative: Eine an die aramäische Parallele angeglichene Fassung würde Jerusalem allgemein als rebellische, Königen und Provinzen schädliche Stadt beschreiben, in der seit alters Aufruhr herrschte.
  rationale: Für 1 Esdras ist der griechische Text die maßgebliche Vorlage. Die abweichende und ausführlichere Formulierung darf daher nicht stillschweigend an den masoretischen Paralleltext angeglichen werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Zettelten … an“ gibt die aktive Rolle der Menschen verständlich wieder; „harte Könige“ wahrt die knappe und wertende Doppelbeschreibung des Griechischen. Die Satzteilung vermeidet einen schwerfälligen deutschen Periodensatz.
