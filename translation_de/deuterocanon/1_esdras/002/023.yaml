  naturalness: Die Satzteilung und die Wortwahl sind modernes, verständliches Standarddeutsch. „Harte Könige“ ist knapp, aber in diesem wertenden politischen Kontext verständlich. Die Relativsatzkonstruktion verbessert die deutsche Satzführung und bildet die griechischen Partizipien natürlich ab.
