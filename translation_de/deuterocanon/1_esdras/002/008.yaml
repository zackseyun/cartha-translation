revisions:
- from: Und die Menschen in ihrer Umgebung unterstützten sie in jeder Hinsicht mit Silber und Gold, mit Pferden, Vieh und sehr vielen Gebeten[a] – viele, deren Sinn dazu angeregt worden war.[b]
  to: Und die Menschen in ihrer Umgebung unterstützten sie in jeder Hinsicht mit Silber und Gold, mit Pferden, Vieh und sehr zahlreichen Gelübden von vielen, deren Sinn geweckt worden war.[a]
  rationale: Die Revision beseitigt die syntaktische Unklarheit, gibt die Genitivverbindung des griechischen Satzes nachvollziehbar wieder und wahrt bei εὐχαί die quellenbedingte Mehrdeutigkeit. Die Abweichungen der hebräischen Parallele bleiben ausschließlich in der Fußnote dokumentiert.
