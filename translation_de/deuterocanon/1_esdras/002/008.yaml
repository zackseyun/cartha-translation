review_pass:
  verdict: revise
  source_fidelity: 'Der griechische Haupttext ist in der Sachliste grundsätzlich getroffen. Die Verbindung von εὐχαῖς mit der folgenden Genitivgruppe sollte jedoch klarer wiedergegeben werden: Die sehr zahlreichen εὐχαί stammen von vielen Personen, deren νοῦς geweckt/angeregt worden war. „Gebete“ ist für εὐχαί möglich, im materiellen Kontext aber nicht die einzig naheliegende Bedeutung; „Gelübde“ wahrt die griechische Mehrdeutigkeit besser als eine Harmonisierung zu „freiwilligen Gaben“.'
  naturalness: Der Gedankenstrich in „mit sehr vielen Gebeten – viele“ erzeugt einen unvollständigen und syntaktisch unklaren Anschluss. „von vielen, deren Sinn geweckt worden war“ stellt die Beziehung verständlich und in modernem Standarddeutsch her. „Sinn geweckt“ ist dabei idiomatischer als „dazu angeregt worden war“, dessen ergänztes „dazu“ im Griechischen nicht ausgedrückt ist.
  terminology: „Menschen in ihrer Umgebung“, „unterstützten“, „Pferden“ und „Vieh“ sind angemessen. Für εὐχαῖς wird „Gelübden“ gewählt und mit einer Anmerkung abgesichert; die Fußnote dokumentiert sowohl die mögliche Bedeutung „Gebete“ als auch die abweichende hebräische Parallele, ohne deren Lesart in den Haupttext einzutragen.
  issues:
  - severity: medium
    issue: Unklarer syntaktischer Anschluss der Schlussgruppe
    rationale: Die Fassung „mit sehr vielen Gebeten[a] – viele, deren Sinn dazu angeregt worden war“ lässt offen, wie „viele“ grammatisch an den Satz angeschlossen ist. Das griechische πολλῶν ὧν verbindet die vielen Personen mit den εὐχαί.
  - severity: medium
    issue: „Gebete“ legt εὐχαῖς im Kontext zu eng fest
    rationale: εὐχή kann Gebet oder Gelübde bezeichnen. Angesichts der unmittelbar vorausgehenden materiellen Unterstützungsleistungen ist „Gelübde“ als quellennahe, weniger kontextfremde Wiedergabe vorzuziehen; die verbleibende Unsicherheit wird in der Fußnote erhalten.
  - severity: low
    issue: Das ergänzte „dazu“ ist nicht im griechischen Wortlaut markiert
    rationale: Die Wendung erleichtert zwar das Verständnis, konkretisiert aber den Bezug stärker als nötig. „deren Sinn geweckt worden war“ gibt die passive Form ἠγέρθη unmittelbar wieder.
  revised_text: Und die Menschen in ihrer Umgebung unterstützten sie in jeder Hinsicht mit Silber und Gold, mit Pferden, Vieh und sehr zahlreichen Gelübden von vielen, deren Sinn geweckt worden war.[a]
