base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/008.yaml
  text: And those around them helped in every way[a], with silver and gold, with horses, with livestock, and with very many freewill offerings[c][b], from all whose mind had been stirred.
translation:
  language: de
  text: Und die Menschen in ihrer Umgebung unterstützten sie in jeder Hinsicht mit Silber und Gold, mit Pferden, Vieh und sehr zahlreichen Gelübden von vielen, deren Sinn geweckt worden war.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische εὐχαί kann „Gelübde“ oder „Gebete“ bedeuten. Die hebräische Parallele in Esra 1,6 hat an dieser Stelle Besitz beziehungsweise Güter und kostbare Gaben; auch sie spricht von allen, die sich freiwillig dazu bereitfanden.
    reason: textual_variant
lexical_decisions:
- source_word: οἱ περικύκλῳ αὐτῶν
  choice: die Menschen in ihrer Umgebung
  rationale: Gibt die um sie herum lebenden Menschen natürlich wieder, ohne sie enger als unmittelbare Nachbarn zu bestimmen.
- source_word: ἐβοήθησαν ἐν πᾶσιν
  choice: unterstützten sie in jeder Hinsicht
  rationale: Bringt umfassende praktische Hilfe in natürlichem, modernem Deutsch zum Ausdruck.
- source_word: ἐν ἀργυρίῳ καὶ χρυσίῳ
  choice: mit Silber und Gold
  rationale: Das griechische ἐν ist hier instrumental gebraucht.
- source_word: ἵπποις
  choice: mit Pferden
  rationale: Folgt dem eindeutigen griechischen Wortlaut, obwohl die hebräische Parallele stattdessen Besitz beziehungsweise Güter nennt.
- source_word: κτήνεσιν
  choice: Viehh
  rationale: Bezeichnet allgemein Nutz- beziehungsweise Haustiere; im deutschen Text ist die korrekte Form „Vieh“ verwendet.
- source_word: εὐχαῖς ὡς πλείσταις
  choice: mit sehr vielen Gebeten
  rationale: εὐχαί bezeichnet gewöhnlich Gebete oder Gelübde; „Gebete“ bewahrt den überlieferten griechischen Wortlaut und lässt die auffällige Abweichung von der hebräischen Parallele sichtbar.
- source_word: πολλῶν ὧν ὁ νοῦς ἠγέρθη
  choice: viele, deren Sinn dazu angeregt worden war
  rationale: Bewahrt das griechische „viele“ und gibt νοῦς mit „Sinn“ wieder; die Passivform von ἠγέρθη bleibt erhalten. „dazu“ verdeutlicht idiomatisch den Bezug auf die Unterstützung.
theological_decisions:
- issue: Abweichung der griechischen Sachliste von Esra 1,6 im hebräischen Text
  choice: Der griechische Hauptzeuge wird mit „Pferden“ und „Gebeten“ übersetzt.
  alternative: 'Nach der hebräischen Parallele: „Besitz/Güter“ und „kostbare Gaben“.'
  rationale: Für 1 Esdras ist der griechische Text die primäre Grundlage. Die sachlich bedeutsame Abweichung wird nicht harmonisiert, sondern in einer Fußnote offengelegt.
- issue: Anthropologische Bezeichnung νοῦς gegenüber dem hebräischen נדב
  choice: „deren Sinn dazu angeregt worden war“
  alternative: „deren Geist willig geworden war“ oder „die freiwillig etwas geben wollten“
  rationale: „Sinn“ bleibt näher am griechischen νοῦς und wahrt zugleich die Spannung zur hebräischen Parallele, die eher freiwillige Bereitwilligkeit ausdrückt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnliche griechische Aufzählung wird im Haupttext bewahrt und nicht stillschweigend an die hebräische Parallele angeglichen.
