  source_fidelity: 'Die Übersetzung gibt die zentrale Abfolge und die politischen Anschuldigungen des griechischen Textes zuverlässig wieder: amtliche Aufzeichnungen, Rebellion der Stadt, Beunruhigung von Königen und Städten, aufständische Juden, seit Langem bestehende Belagerungstätigkeit und die Verwüstung der Stadt. „Jene Stadt“ und „diese Stadt“ bilden ἐκείνη bzw. αὕτη angemessen ab. Für πολιορκίας συνεσταμένοι ist „Belagerungen organisiert“ jedoch im Deutschen weniger präzise und klingt, besonders mit „dort“, semantisch ungeschickt; der Plural kann hier allgemeinere organisierte Belagerungs- bzw. Einschließungsmaßnahmen bezeichnen.'
