base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/019.yaml
  text: And you will find in the records what has been written about these things[a], and you will know that that city was rebellious, troubling kings and cities, and that the Jews in it were rebels and had established blockades from of old; for this reason that city was laid waste.
translation:
  language: de
  text: Und du wirst in den Aufzeichnungen finden, was über diese Dinge geschrieben steht. Dann wirst du erkennen, dass jene Stadt aufrührerisch war und Königen und Städten Unruhe bereitete und dass die Juden in ihr Aufständische waren und dort seit alters her Belagerungsmaßnahmen[a] organisiert hatten. Aus diesem Grund wurde diese Stadt verwüstet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Belagerungen“; das griechische Wort kann Belagerungstätigkeit in einem weiteren Sinn bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπομνηματισμοῖς
  choice: Aufzeichnungen
  rationale: Im Verwaltungskontext sind amtliche schriftliche Unterlagen oder Archivaufzeichnungen gemeint; „Aufzeichnungen“ ist natürlich und hinreichend weit.
- source_word: γεγραμμένα
  choice: was … geschrieben steht
  rationale: Gibt das Perfektpartizip als bereits schriftlich festgehaltenen Inhalt idiomatisch wieder.
- source_word: ἀποστάτις
  choice: aufrührerisch
  rationale: Bezeichnet hier politischen Aufruhr gegen die Herrschaft, nicht religiösen Abfall.
- source_word: ὀχλοῦσα
  choice: Unruhe bereitete
  rationale: Erfasst das fortgesetzte Stören oder Beunruhigen in natürlichem Verwaltungsdeutsch.
- source_word: ἀποστᾶται
  choice: Aufständische
  rationale: Der Kontext verlangt eine politische Bezeichnung; „Abtrünnige“ könnte unnötig religiös verstanden werden.
- source_word: πολιορκίας
  choice: Belagerungen
  rationale: Die Grundbedeutung ist Belagerung beziehungsweise Belagerungstätigkeit; die mögliche weitere Bedeutung wird in der Fußnote bewahrt.
- source_word: συνεσταμένοι
  choice: organisiert hatten
  rationale: Das Partizip bezeichnet hier etwas Zusammengestelltes oder Organisiertes und bewahrt den perfektischen Aspekt.
- source_word: ἔτι ἐξ αἰῶνος
  choice: seit alters her
  rationale: Gibt die lange geschichtliche Dauer in würdigem, verständlichem Deutsch wieder.
- source_word: ἠρημώθη
  choice: wurde … verwüstet
  rationale: Vermittelt die passive Verheerung der Stadt prägnant und natürlich.
theological_decisions:
- issue: Art des Vorwurfs gegen die Stadt und die Juden
  choice: Politischer Aufruhr und feindliche Tätigkeit
  alternative: Religiöser Abfall
  rationale: ἀποστάτις und ἀποστᾶται können anderswo religiösen Abfall bezeichnen; im persischen Verwaltungsschreiben geht es jedoch um Widerstand gegen königliche Herrschaft. Daher stehen „aufrührerisch“ und „Aufständische“.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzfolge wurde leicht gegliedert, ohne die argumentative Abfolge des griechischen Textes zu verändern. „Jene Stadt“ folgt ἐκείνη, „diese Stadt“ folgt αὕτη.
