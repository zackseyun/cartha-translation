- from: Und du wirst in den Aufzeichnungen finden, was über diese Dinge geschrieben steht. Dann wirst du erkennen, dass jene Stadt aufrührerisch war und Königen und Städten Unruhe bereitete und dass die Juden in ihr Aufständische waren und dort seit alters her Belagerungen[a] organisiert hatten. Aus diesem Grund wurde diese Stadt verwüstet.
  to: Und du wirst in den Aufzeichnungen finden, was über diese Dinge geschrieben steht. Dann wirst du erkennen, dass jene Stadt aufrührerisch war und Königen und Städten Unruhe bereitete und dass die Juden in ihr Aufständische waren und dort seit alters her Belagerungsmaßnahmen[a] organisiert hatten. Aus diesem Grund wurde diese Stadt verwüstet.
