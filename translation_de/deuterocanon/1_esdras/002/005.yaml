lexical_decisions:
- source_word: εἴ τις ἐστὶν οὖν ὑμῶν ἐκ τοῦ ἔθνους αὐτοῦ
  choice: Wenn also jemand unter euch aus seinem Volk ist
  rationale: „Also“ gibt den folgernden Übergang οὖν wieder. „Volk“ bezeichnet hier natürlicher eine Volkszugehörigkeit als das moderne politische Wort „Nation“; das mehrdeutige Pronomen „seinem“ bleibt erhalten.
- source_word: ἔστω ὁ κύριος αὐτοῦ μετʼ αὐτοῦ
  choice: so sei sein Herr mit ihm
  rationale: Der deutsche Jussiv „sei“ bewahrt die wünschende bzw. auffordernde Kraft von ἔστω. „Sein Herr“ folgt dem tatsächlich überlieferten αὐτοῦ, ohne „Gott“ aus einer Parallelüberlieferung einzufügen.
- source_word: ἀναβὰς εἰς τὴν Ἰερουσαλὴμ τὴν ἐν τῇ Ἰουδαίᾳ
  choice: Er ziehe hinauf nach Jerusalem in Judäa
  rationale: „Hinaufziehen“ bewahrt die herkömmliche räumliche und religiöse Vorstellung des Aufstiegs nach Jerusalem. Der abhängige Partizipialgedanke wird für verständliches Deutsch als jussivischer Satz wiedergegeben.
- source_word: οἰκοδομείτωσαν
  choice: sie sollen … bauen
  rationale: Die Pluralform des griechischen Imperativs wird nicht an die vorausgehenden Singularformen angeglichen. So bleibt der auffällige Numeruswechsel des überlieferten Textes sichtbar.
- source_word: τὸν οἶκον τοῦ κυρίου τοῦ Ἰσραήλ
  choice: das Haus des Herrn Israels
  rationale: Die ungewöhnliche griechische Formulierung wird eng nachgebildet. Da θεός fehlt, wird nicht zur geläufigeren Wendung „des Herrn, des Gottes Israels“ harmonisiert.
- source_word: οὗτος ὁ κύριος ὁ κατασκηνώσας ἐν Ἰερουσαλήμ
  choice: dieser ist der Herr, der in Jerusalem Wohnung genommen hat
  rationale: „Dieser“ bewahrt die hervorhebende Identifikation durch οὗτος. „Wohnung genommen hat“ gibt das aoristische Partizip von κατασκηνόω natürlich wieder und lässt zugleich dessen Bildfeld von Niederlassen und Wohnen erkennen.
theological_decisions:
- issue: Wiedergabe von κύριος im göttlichen Bezug
  choice: Herr
  alternative: HERR; Gebieter
  rationale: Die griechische Vorlage verwendet κύριος. „Herr“ ist im Deutschen die angemessene Gottesbezeichnung, ohne die besondere Schreibung „HERR“ aus einer hebräischen Wiedergabetradition einzuführen.
- issue: Harmonisierung der Schlussaussage mit der hebräischen Esra-Überlieferung
  choice: Die griechische Aussage über den Herrn, der in Jerusalem Wohnung genommen hat, bleibt erhalten.
  alternative: Er ist der Gott, der in Jerusalem ist.
  rationale: Die griechische Primärquelle enthält ausdrücklich das Partizip κατασκηνώσας. Eine Angleichung an eine anderslautende hebräische Form würde diesen eigenständigen Wortlaut verdecken.
- issue: Auffälliger Wechsel vom Singular zum Plural
  choice: Singular beim Hinaufziehen, Plural beim Bauen
  alternative: Beide Handlungen im Singular; beide Handlungen im Plural
  rationale: Die Spannung zwischen dem singularischen τις, ἔστω und ἀναβάς einerseits und dem pluralischen οἰκοδομείτωσαν andererseits gehört zum überlieferten griechischen Text und wird nicht stillschweigend beseitigt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die ungewöhnliche Wendung „Herr Israels“, das mehrdeutige „seinem“ und der Numeruswechsel werden aus Gründen der Quellentreue bewahrt; erläuternde Fußnoten verhindern, dass diese Eigenheiten wie bloße deutsche Fehler wirken.
