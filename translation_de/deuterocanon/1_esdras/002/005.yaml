    reason: textual_variant
  - marker: b
    text: 'Der angeführte hebräische Paralleltext weicht an dieser Stelle deutlich ab: Er spricht stattdessen von Unterstützung durch Silber, Gold, Besitz und Vieh sowie von einer freiwilligen Gabe für das Haus Gottes in Jerusalem. Der griechische Text von 1 Esdras bewahrt hier eine andere Form der Überlieferung.'
