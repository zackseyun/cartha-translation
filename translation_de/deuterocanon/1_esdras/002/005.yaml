base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/005.yaml
  text: Therefore[a], if any of you is from his people, may his Lord be with him[c][b], and let him go up to Jerusalem in Judea and build the house of the Lord of Israel—he is the Lord who dwells in Jerusalem.
translation:
  language: de
  text: Wenn also jemand von euch aus seinem Volk stammt, sei sein Herr mit ihm. Er ziehe hinauf nach Jerusalem in Judäa, und sie sollen das Haus des Herrn Israels bauen[a] – er ist der Herr, der in Jerusalem Wohnung genommen hat.[c][b]
  philosophy: optimal-equivalence
  footnotes:
