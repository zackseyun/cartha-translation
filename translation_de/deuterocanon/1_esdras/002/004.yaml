base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/004.yaml
  text: and he has appointed me to build a house for him in Jerusalem[b][a], which is in Judea.
translation:
  language: de
  text: und er hat mir zu erkennen gegeben[a], dass ich ihm in Jerusalem, das in Judäa liegt, ein Haus[b] bauen soll.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »hat mir aufgetragen« oder »hat mich beauftragt«. Das griechische Verb kann »anzeigen«, »zu erkennen geben« oder, je nach Zusammenhang, eine Beauftragung ausdrücken.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder sinngemäß: »einen Tempel«. Wörtlich steht im Griechischen »ein Haus«, eine in der Bibel übliche Bezeichnung für den Tempel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσήμανέν μοι
  choice: er hat mir aufgetragen
  rationale: σημαίνω kann »anzeigen«, »bekannt machen« oder im Zusammenhang einer Beauftragung »auftragen« bedeuten. Mit dem Infinitiv οἰκοδομῆσαι gibt »hat mir aufgetragen« den Auftrag natürlich wieder, ohne zwingend einen ausdrücklichen Befehl anzunehmen.
- source_word: οἰκοδομῆσαι
  choice: zu bauen
  rationale: Das griechische Verb bedeutet hier schlicht »bauen«. Obwohl der Zusammenhang einen Wiederaufbau betrifft, steht im Griechischen kein ausdrücklich mit »wieder-« markiertes Verb.
- source_word: αὐτῷ
  choice: ihm
  rationale: Der Dativ bezeichnet denjenigen, für den beziehungsweise zu dessen Ehre das Haus gebaut werden soll.
- source_word: οἶκον
  choice: ein Haus
  rationale: Das Griechische verwendet das gewöhnliche Wort für »Haus«. Gemeint ist der Tempel, doch »Haus« bewahrt die biblische Ausdrucksweise und vermeidet eine unausgewiesene Präzisierung im Haupttext.
- source_word: Ἰερουσαλήμ
  choice: Jerusalem
  rationale: Gebräuchliche deutsche Form des Ortsnamens.
- source_word: τῇ ἐν τῇ Ἰουδαίᾳ
  choice: das in Judäa liegt
  rationale: Die attributive Präpositionalfügung bestimmt Jerusalem erläuternd als die in Judäa gelegene Stadt; die Relativkonstruktion ist im Deutschen klar und natürlich.
theological_decisions:
- issue: Wiedergabe von οἶκον als »Haus« oder ausdrücklich als »Tempel«
  choice: Haus
  alternative: Tempel
  rationale: Der griechische Ausgangstext sagt »Haus«; der Tempelbezug ist aus dem Kontext ersichtlich. Die offenere Quellensprache bleibt daher im Haupttext erhalten.
- issue: Stärke des in ἐσήμανέν ausgedrückten göttlichen Auftrags
  choice: hat mir aufgetragen
  alternative: hat mir befohlen; hat mir zu erkennen gegeben
  rationale: Die Formulierung wahrt den Gedanken göttlicher Beauftragung, legt sich aber nicht unnötig auf einen ausdrücklichen Befehl fest. Die mögliche Bedeutungsbreite wird in der Fußnote kenntlich gemacht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung ist natürlich, bewahrt aber den einleitenden Anschluss mit »und«. »Judäa« folgt der etablierten deutschen Namensform; »Haus« erhält bewusst die bildhafte biblische Ausdrucksweise.
