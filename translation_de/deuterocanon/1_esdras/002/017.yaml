base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/017.yaml
  text: And now let it be known to my lord the king that the Judeans who came up from you to us have come to Jerusalem and are living in that rebellious and wicked city[a]; they are repairing its marketplaces and walls[c][b], and are laying the foundation of a temple.
translation:
  language: de
  text: 'Und nun sei dem Herrn, dem König, bekannt: Die Judäer[a], die von euch zu uns heraufgezogen und nach Jerusalem gekommen sind, bewohnen die aufrührerische und böse Stadt. Sie setzen ihre Marktplätze[b] und Mauern instand und legen den Grund für einen Tempel[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Juden“. Das griechische Wort Ἰουδαῖοι kann Menschen aus Juda beziehungsweise Judäa oder Juden im weiteren Sinn bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Das griechische Wort kann „Marktplätze“ oder „öffentliche Plätze“ bedeuten. Einige Parallelüberlieferungen im Esrabuch sprechen allgemeiner von Straßen beziehungsweise vom Wiederaufbau der Stadt.
    reason: alternative_reading
  - marker: c
    text: 'Auch möglich: „nehmen den Bau des Tempels in Angriff“ oder „bauen den Tempel wieder auf“. Die griechische Wendung ist knapp und kann den Beginn der Tempelarbeiten, besonders das Anlegen des Unterbaus, bezeichnen. Obwohl „Tempel“ im Griechischen ohne Artikel steht, ist im Zusammenhang der Tempel von Jerusalem gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γνωστὸν ἔστω
  choice: sei … bekannt
  rationale: Bewahrt die förmliche Mitteilungsformel des griechischen Verwaltungsschreibens in knappem, verständlichem Deutsch.
- source_word: τῷ κυρίῳ βασιλεῖ
  choice: dem Herrn König
  rationale: κύριος ist hier eine höfische Anrede für einen menschlichen Herrscher, kein Gottesprädikat. Die Formulierung bleibt eng am Griechischen und vermeidet ein im Ausgangstext nicht ausdrücklich vorhandenes Possessivpronomen.
- source_word: Ἰουδαῖοι
  choice: Judäer
  rationale: Im perserzeitlichen Zusammenhang steht die ethnogeografische Zugehörigkeit zu Juda/Judäa im Vordergrund; „Juden“ bleibt lexikalisch möglich.
- source_word: ἀναβάντες παρ' ὑμῶν πρὸς ἡμᾶς
  choice: die von euch zu uns heraufgezogen
  rationale: „Heraufziehen“ erhält die räumliche Perspektive des Verbs ἀναβαίνω und die administrative Gegenüberstellung „von euch zu uns“.
- source_word: τὴν πόλιν τὴν ἀποστάτιν καὶ πονηρὰν
  choice: die aufrührerische und böse Stadt
  rationale: ἀποστάτις bezeichnet in dieser politischen Anklage eine zum Aufstand neigende Stadt; πονηρά bewahrt die feindselige moralische Wertung.
- source_word: οἰκοῦσιν
  choice: bewohnen
  rationale: Das Präsens bezeichnet fortdauernde Ansiedlung; „bewohnen“ ist im Deutschen natürlich und präzise.
- source_word: ἀγοράς
  choice: Marktplätze
  rationale: ἀγορά bezeichnet gewöhnlich einen Markt- oder öffentlichen Platz. Diese Bedeutung hat gegenüber den abweichenden „Straßen“ mancher Parallelüberlieferungen Vorrang, da der griechische Text die primäre Grundlage ist.
- source_word: θεραπεύουσιν
  choice: setzen … instand
  rationale: Das Verb kann „pflegen“, „sich kümmern um“ oder „wiederherstellen“ bedeuten; im Zusammenhang mit Plätzen und Mauern bezeichnet es plausibel praktische Ausbesserungsarbeiten.
- source_word: ναὸν ὑποβάλλονται
  choice: legen den Grund für einen Tempel
  rationale: Die gedrängte Wendung weist wahrscheinlich auf den Beginn beziehungsweise die Unterkonstruktion eines Tempelbaus. Der unbestimmte Artikel bildet das artikellose ναόν ab, ohne die kontextuelle Beziehung zum Jerusalemer Tempel zu leugnen.
theological_decisions:
- issue: κύριος als Titel eines menschlichen Königs
  choice: Herrn König
  alternative: Herrn / meinem Herrn, dem König
  rationale: Im Kontext ist κύριος eindeutig eine höfische Anrede an den König und kein göttlicher Titel. Daher wird keine theologische Bedeutung von „Herr“ oder „HERR“ nahegelegt.
- issue: Bestimmtheit des Tempels in ναὸν ὑποβάλλονται
  choice: einen Tempel
  alternative: den Tempel
  rationale: Das Griechische hat keinen Artikel und lässt formal „einen Tempel“ zu, während der Zusammenhang den Jerusalemer Tempel nahelegt. Der Haupttext wahrt die Form des griechischen Ausdrucks; die Fußnote benennt die kontextuelle Alternative.
translation_notes:
  register: Moderne, würdige Standardsprache mit dem förmlichen Ton eines amtlichen Beschwerdeschreibens. Die leicht ungewöhnliche Anrede „dem Herrn König“ hält sich eng an den griechischen Wortlaut; der übrige Satzbau wurde für heutige Leser in zwei Hauptsätze gegliedert.
