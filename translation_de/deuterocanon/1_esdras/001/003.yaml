base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/003.yaml
  text: And he said to the Levites[a], the holy servants of Israel, “Sanctify yourselves to the Lord in the place of the holy ark of the Lord, in the house that Solomon son of David the king built.”
translation:
  language: de
  text: 'Und er sagte zu den Leviten, den heiligen Dienern Israels: »Heiligt sie[a] für den Herrn an der Stätte der heiligen Lade des Herrn, in dem Haus, das Salomo, der Sohn Davids, der König, baute.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich steht im Griechischen: „Heiligt sie für den Herrn“; worauf „sie“ verweist, ist unklar. Der hebräische Paralleltext lautet stattdessen: „Stellt die heilige Lade in das Haus, das Salomo, der Sohn Davids, der König von Israel, gebaut hat.“'
    reason: Die griechische Lesart ist grammatisch eindeutig, aber in ihrem Bezug unklar; der hebräische Paralleltext bietet eine deutlich abweichende Aussage.
lexical_decisions:
- source_word: Λευείταις
  choice: Leviten
  rationale: Die übliche deutsche Bezeichnung für die Angehörigen des Stammes Levi; sie entspricht auch dem hebräischen Paralleltext.
- source_word: ἱεροδούλοις
  choice: heiligen Dienern
  rationale: Die appositionelle Bezeichnung meint Menschen, die dem heiligen Dienst geweiht sind. „Heilige Diener“ bewahrt den sakralen Sinn, ohne sie enger als Tempeldiener einzuordnen.
- source_word: ἁγιάσατε
  choice: Heiligt
  rationale: Das kultisch geprägte Verb wird formal und zugleich verständlich wiedergegeben.
- source_word: αὐτούς
  choice: sie
  rationale: Der überlieferte griechische Text hat ein maskulines Pronomen im Plural. Da sein Bezug unklar ist, wird es nicht stillschweigend in „euch“ umgedeutet.
- source_word: τῷ κυρίῳ
  choice: für den Herrn
  rationale: In Verbindung mit „heiligen“ bezeichnet der Dativ die Widmung für den Herrn; κύριος wird entsprechend der griechischen Vorlage als „Herr“ wiedergegeben.
- source_word: ἐν τῇ θέσει
  choice: an der Stätte
  rationale: „Stätte“ gibt den Ort in würdigem, kultisch passendem Deutsch wieder.
- source_word: τῆς ἁγίας κιβωτοῦ
  choice: der heiligen Lade
  rationale: Im kultischen Zusammenhang bezeichnet κιβωτός die Lade; ἁγία wird direkt mit „heilig“ wiedergegeben.
- source_word: οἴκῳ
  choice: Haus
  rationale: Die wörtliche Bezeichnung „Haus“ bleibt erhalten, statt den gemeinten Tempel ausdrücklich in den Text einzutragen.
- source_word: ᾧ ᾠκοδόμησεν Σαλωμὼν ὁ τοῦ Δαυεὶδ ὁ βασιλεύς
  choice: das Salomo, der Sohn Davids, der König, gebaut hatte
  rationale: Die ungewöhnliche griechische Folge der Bezeichnungen wird nachvollziehbar wiedergegeben, ohne den im Griechischen nicht ausdrücklich genannten Titel „König von Israel“ zu ergänzen.
theological_decisions:
- issue: Wiedergabe von κύριος bei einem griechischen Text mit hebräischem Paralleltext, der den Gottesnamen enthält
  choice: Herr
  alternative: HERR
  rationale: Da die primäre Vorlage griechisch κύριος liest, wird „Herr“ verwendet; die Schreibweise „HERR“ würde die Form des hebräischen Paralleltextes in den Haupttext importieren.
- issue: Unklarer Gegenstand von ἁγιάσατε αὐτούς und Abweichung vom hebräischen Paralleltext
  choice: Die griechische Formulierung „Heiligt sie“ samt ihrer Unklarheit bewahren
  alternative: „Stellt die heilige Lade in das Haus“ nach dem hebräischen Paralleltext oder „Heiligt euch“ als kontextuelle Deutung
  rationale: Der griechische Ausgangstext ist die primäre Grundlage und enthält ausdrücklich das maskuline Pluralpronomen αὐτούς. Weder eine reflexive Deutung noch die abweichende hebräische Aussage soll ohne Kennzeichnung in den Haupttext eingesetzt werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der kultische Ton wird durch „heiligen“, „Diener“, „Stätte“ und „Lade“ erhalten. Die echte Unklarheit des griechischen Pronomens bleibt im Haupttext sichtbar und wird in der Fußnote erläutert.
