base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/053.yaml
  text: And they brought all her splendor to ruin[b][a], and he carried the survivors away with the sword to Babylon.
translation:
  language: de
  text: Und sie machten all ihre Pracht völlig zunichte; und er führte die Überlebenden[a] unter dem Schwert[b] nach Babylon weg.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Übriggebliebenen“ beziehungsweise „den Rest“.'
    reason: Lexikalische Alternative zu τοὺς ἐπιλοίπους.
  - marker: b
    text: 'Die knappe Wendung kann auch enger auf die vorangehende Verwüstung bezogen werden: Die Übrigen wurden infolge gewaltsamer Eroberung weggeführt. Der hebräische Paralleltext betont das Töten durch das Schwert.'
    reason: Die genaue syntaktische und semantische Beziehung von μετὰ ῥομφαίας ist mehrdeutig.
lexical_decisions:
- source_word: συνετέλεσαν ... ἀχρειῶσαι
  choice: sie vollendeten die Verwüstung, indem sie ... unbrauchbar machten
  rationale: Die Formulierung bewahrt den Vollendungsaspekt von συνετέλεσαν und die Grundbedeutung von ἀχρειόω, etwas unbrauchbar oder wertlos zu machen. „Die Verwüstung“ wird zur natürlichen Ergänzung im Deutschen aus dem Zusammenhang erschlossen.
- source_word: πάντα τὰ ἔνδοξα αὐτῆς
  choice: alles, was ihr Glanz verlieh
  rationale: Das substantivierte Neutrum bezeichnet kollektiv ihre herrlichen oder prächtigen Dinge. Die Wiedergabe ist idiomatisch und lässt den Bezug des femininen αὐτῆς auf die zuvor genannte Stadt beziehungsweise den Heiligtumskomplex bestehen.
- source_word: τοὺς ἐπιλοίπους
  choice: die Überlebenden
  rationale: Gemeint sind die nach der Zerstörung Übriggebliebenen. „Überlebende“ ist im Deutschen klar und vermeidet die hier nicht zwingende theologische Färbung von „Rest“.
- source_word: ἀπήγαγεν
  choice: er führte ... weg
  rationale: Der Singular bleibt erhalten und verweist im Erzählzusammenhang am ehesten auf den babylonischen Herrscher. „Wegführen“ gibt die erzwungene Verschleppung wieder, ohne sie technisch zu überformen.
- source_word: μετὰ ῥομφαίας
  choice: unter dem Schwert
  rationale: Die ungewöhnlich verdichtete Wendung wird bewusst nicht eindeutig als Tötung oder bloße Begleitung aufgelöst. „Unter dem Schwert“ vermittelt gewaltsame Eroberung und hält die syntaktische Spannung offen.
- source_word: εἰς Βαβυλῶνα
  choice: nach Babylon
  rationale: Natürliche deutsche Richtungsangabe für das Ziel der Wegführung.
theological_decisions:
- issue: Wechsel vom pluralischen συνετέλεσαν zum singularischen ἀπήγαγεν
  choice: Der Numeruswechsel wird als „sie ...; und er ...“ sichtbar bewahrt.
  alternative: Beide Verben könnten vereinheitlichend auf das gesamte Invasionsheer bezogen werden.
  rationale: Der griechische Text wechselt ausdrücklich vom Plural zum Singular. Der Zusammenhang legt für den Singular den babylonischen König nahe, nennt ihn in diesem Satzteil aber nicht erneut.
- issue: Wiedergabe von τοὺς ἐπιλοίπους
  choice: die Überlebenden
  alternative: die Übriggebliebenen / der Rest
  rationale: „Überlebende“ entspricht der historischen Situation nach der Gewalttat, ohne ein besonderes theologisches Rest-Motiv einzutragen.
- issue: Bezug von μετὰ ῥομφαίας
  choice: Die Wendung wird im Haupttext eng mit der Wegführung verbunden, aber semantisch offengehalten.
  alternative: Sie könnte stärker auf die vorangehende Verwüstung und Tötung durch das Schwert bezogen werden.
  rationale: Die griechische Wortstellung verbindet die Wendung zunächst mit ἀπήγαγεν, während der hebräische Paralleltext die Tötung durch das Schwert hervorhebt. Eine Fußnote erhält diese Spannung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der griechische Numeruswechsel und die Mehrdeutigkeit der Schwert-Wendung bleiben erhalten; unnötige konfessionelle oder technische Ausdrucksweisen werden vermieden.
