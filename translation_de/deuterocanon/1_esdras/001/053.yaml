  rationale: Die Revision entfernt die nicht ausdrücklich im griechischen Text genannte „Verwüstung“ und gibt πάντα τὰ ἔνδοξα αὐτῆς unmittelbarer als „all ihre Pracht“ wieder. „Völlig zunichtemachen“ verbindet den abschließenden Nachdruck von συνετέλεσαν mit dem Gedanken des Unbrauchbar- bzw. Wertlosmachens in ἀχρειῶσαι. Numeruswechsel, Ziel der Wegführung und die vorsichtig beibehaltene Schwert-Metaphorik bleiben erhalten.
