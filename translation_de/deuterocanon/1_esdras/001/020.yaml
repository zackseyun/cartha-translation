base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/020.yaml
  text: In the eighteenth year of Iosias's reign[b][a], this Passover was held.
translation:
  language: de
  text: Im achtzehnten Regierungsjahr des Josias wurde dieses Passafest begangen.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Dieses Passa wurde geführt/gebracht.“ Gemeint ist, dass die Passafeier zu dieser Zeit durchgeführt wurde.'
    reason: lexical_alternative
  - marker: b
    text: Die hebräische Parallele in 2. Chronik 35 berichtet, dass Israel zu dieser Zeit das Passa beging. Der griechische Text fasst diese Feier hier knapp zusammen.
    reason: cross_reference
lexical_decisions:
- source_word: ὀκτωκαιδεκάτῳ ἔτει
  choice: im achtzehnten Regierungsjahr
  rationale: Der Dativ bezeichnet den Zeitpunkt. Zusammen mit dem folgenden Genitivus absolutus ergibt sich im Deutschen natürlich die zeitliche Angabe „im achtzehnten Regierungsjahr“.
- source_word: βασιλεύοντος Ἰωσείου
  choice: des Josias
  rationale: Der Genitivus absolutus bedeutet wörtlich „als Josias regierte“. Die Verbindung „im achtzehnten Regierungsjahr des Josias“ gibt den zeitlichen Sinn knapp und idiomatisch wieder und folgt bei der Namensform dem griechischen Ausgangstext.
- source_word: ἤχθη
  choice: wurde … begangen
  rationale: Das Verb bedeutet zunächst „wurde geführt/gebracht“, bezeichnet hier in Verbindung mit πάσχα aber die Durchführung der Passafeier. „Wurde begangen“ ist natürliches Deutsch und bleibt zurückhaltender als das stärker festlich gefärbte „wurde gefeiert“.
- source_word: τὸ πάσχα
  choice: das Passafest
  rationale: „Passafest“ ist eine geläufige deutsche Bezeichnung für das jüdische Fest und macht deutlich, dass hier die Festbegehung gemeint ist.
- source_word: τοῦτο
  choice: dieses
  rationale: Das Demonstrativpronomen verweist auf das zuvor geschilderte Passafest und wird im Deutschen direkt mit „dieses“ wiedergegeben.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Satzstruktur des griechischen Textes bleibt erhalten; „begangen“ gibt den kultischen Vollzug idiomatisch wieder, ohne zusätzliche Festlichkeit oder theologische Deutung einzutragen.
