base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/041.yaml
  text: And Jehoiakim his son reigned in his place; for when he was appointed[a], he was eight years old.
translation:
  language: de
  text: Und an seiner Stelle wurde sein Sohn Jojakim König. Denn als er eingesetzt wurde,[a] war er acht Jahre alt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im griechischen Text heißt es, dass er bei seiner Einsetzung acht Jahre alt war. Andere biblische Überlieferungen weichen hinsichtlich der Identität des Königs oder seines Alters beim Regierungsantritt ab; hier wird der Wortlaut des griechischen Textes von 1 Esdras beibehalten.
    reason: textual_variant
lexical_decisions:
- source_word: ἐβασίλευσεν
  choice: wurde … König
  rationale: Im historischen Erzählzusammenhang bezeichnet der Aorist den Regierungsantritt. Die deutsche Formulierung verbindet die Thronfolge natürlich mit ἀντ᾽ αὐτοῦ, ohne eine längere Regierungsdauer eigens zu betonen.
- source_word: ἀντ᾽ αὐτοῦ
  choice: an seiner Stelle
  rationale: Die Wendung bezeichnet die Nachfolge beziehungsweise Ersetzung auf dem Thron und wird im Deutschen idiomatisch wiedergegeben.
- source_word: Ἰωακεὶμ
  choice: Jojakim
  rationale: Die geläufige deutsche biblische Namensform entspricht dem hebräischen Königsnamen; der griechische Text bietet die Form Ἰωακείμ.
- source_word: ὁ υἱὸς αὐτοῦ
  choice: sein Sohn
  rationale: Direkte und natürliche Wiedergabe der Verwandtschaftsangabe.
- source_word: ἀνεδείχθη
  choice: eingesetzt wurde
  rationale: Das Passiv von ἀναδείκνυμι bezeichnet hier die formelle Bestimmung oder Einsetzung in ein Amt. „Eingesetzt“ bewahrt das Passiv und vermeidet die stärker deutende Ergänzung „zum König gemacht“.
- source_word: ἐτῶν ὀκτώ
  choice: acht Jahre alt
  rationale: Natürliche deutsche Wiedergabe der griechischen Altersangabe.
theological_decisions:
- issue: Die Altersangabe und möglicherweise auch die Identität des Königs weichen von bekannteren biblischen Parallelüberlieferungen ab.
  choice: Die eindeutige Aussage des griechischen Primärtextes „acht Jahre alt“ bleibt im Haupttext unverändert erhalten.
  alternative: Den Königsnamen oder das Alter nach einer anderen biblischen Überlieferung harmonisieren.
  rationale: Übersetzt wird der griechische Text von 1 Esdras. Die Spannung zu anderen Überlieferungen darf nicht stillschweigend beseitigt werden; eine Fußnote macht sie transparent.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzfolge folgt dem griechischen Text, während „wurde … König“ im Deutschen natürlicher klingt als das wörtlichere „regierte“. Der Fußnotenmarker steht unmittelbar nach der strittigen Einsetzungsformulierung.
