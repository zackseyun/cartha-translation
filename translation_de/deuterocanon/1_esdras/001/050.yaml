base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/050.yaml
  text: These men killed their young men with the sword around the holy temple[a], and they showed no mercy to young man or virgin, old man or youth[b],
translation:
  language: de
  text: Diese Männer töteten ihre jungen Männer mit dem Schwert rings um den heiligen Tempel[a] und verschonten weder einen jungen Mann noch eine Jungfrau, weder einen alten Mann noch einen Jüngeren.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort kann den Tempel samt seinem gesamten Tempelbezirk bezeichnen.
    reason: lexical_alternative
  - marker: b
    text: Die für diese Stelle angegebene hebräische Parallele entspricht dem griechischen Wortlaut nur ungefähr und enthält eine andere Aussage; der griechische Text berichtet hier ausdrücklich vom Töten rings um den Tempel.
    reason: cross_reference
lexical_decisions:
- source_word: οὗτοι
  choice: Diese Männer
  rationale: Das Demonstrativpronomen verweist auf die zuvor genannten Angreifer; „Männer“ verdeutlicht den Bezug, ohne den Sinn wesentlich zu erweitern.
- source_word: ἀπέκτειναν
  choice: töteten
  rationale: Die schlichte Vergangenheitsform gibt die unmittelbare Erzählweise des griechischen Textes natürlich und ungeschönt wieder.
- source_word: τοὺς νεανίσκους αὐτῶν
  choice: ihre jungen Männer
  rationale: νεανίσκους bezeichnet männliche Jugendliche beziehungsweise junge Männer; αὐτῶν wird als Possessivangabe beibehalten.
- source_word: ἐν ῥομφαίᾳ
  choice: mit dem Schwert
  rationale: Die Wendung bezeichnet das Werkzeug des Tötens und entspricht dem geläufigen biblischen Sprachgebrauch.
- source_word: περικύκλῳ
  choice: rings um
  rationale: Die Form bezeichnet den umliegenden Bereich; „rings um“ ist präzise, natürlich und bewahrt die räumliche Aussage.
- source_word: τοῦ ἁγίου ἱεροῦ
  choice: den heiligen Tempel
  rationale: ἱερόν kann den Tempel einschließlich seines Bezirks bezeichnen; „Tempel“ ist im Deutschen die klare und geläufige Wiedergabe.
- source_word: οὐκ ἐφείσαντο
  choice: verschonten weder … noch
  rationale: Das Verb bedeutet, jemanden zu verschonen. Die deutsche weder-noch-Konstruktion gibt die verneinte Aufzählung idiomatisch wieder.
- source_word: νεανίσκου καὶ παρθένου καὶ πρεσβύτου καὶ νεωτέρου
  choice: einen jungen Mann noch eine Jungfrau, weder einen alten Mann noch einen Jüngeren
  rationale: Die einzelnen Personenbezeichnungen sowie der Kontrast der Altersgruppen bleiben erhalten. „Jüngeren“ wahrt den substantivierten Komparativ von νεωτέρου und legt dessen genaue Altersabgrenzung nicht künstlich fest.
theological_decisions:
- issue: Verhältnis des griechischen Textes zur angegebenen masoretischen Parallele
  choice: Die griechische Schilderung des Tötens rings um den Tempel wird unmittelbar übersetzt.
  alternative: Den Wortlaut an die nur ungefähr entsprechende hebräische Stelle über die Verfehlungen des Volkes und die Verunreinigung des Hauses des HERRN angleichen.
  rationale: Für 1 Esdras ist hier der griechische Text die maßgebliche Quelle. Die angegebene hebräische Parallele bietet einen anderen Inhalt und darf die konkrete Aussage des griechischen Verses nicht verdrängen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer erzählerischer Syntax. Archaische Ausdrücke werden vermieden; die harte Aussage und die auffällige Aufzählung der Personengruppen bleiben erhalten.
