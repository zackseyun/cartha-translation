  terminology: „Heiliger Tempel“ ist passend für τὸ ἅγιον ἱερόν; die Fußnote erläutert vorsichtig, dass ἱερόν auch den Tempelbezirk bezeichnen kann. „Jungfrau“ gibt παρθένος direkt wieder, ohne darüber hinausgehende theologische Deutung. „einen Jüngeren“ bewahrt die substantivische Komparativform νεωτέρου, ohne eine engere Alterseinstufung festzulegen.
