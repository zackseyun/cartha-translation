  source_fidelity: 'Der deutsche Text folgt dem griechischen Wortlaut zuverlässig: οὗτοι wird angemessen als „Diese Männer“ konkretisiert, τοὺς νεανίσκους αὐτῶν als „ihre jungen Männer“ wiedergegeben, und die Tötung „mit dem Schwert rings um den heiligen Tempel“ bildet ἐν ῥομφαίᾳ περικύκλῳ τοῦ ἁγίου ἱεροῦ sachgerecht ab. Die viergliedrige Gruppe der Nichtverschonten bleibt vollständig erhalten. Die nur näherungsweise hebräische Parallele wird zu Recht nicht zur Umformung des griechischen Textes herangezogen.'
