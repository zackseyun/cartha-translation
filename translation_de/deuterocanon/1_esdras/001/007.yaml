base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/007.yaml
  text: And Josiah gave to the people who were present thirty thousand lambs and young goats[b][a], and three thousand calves.
translation:
  language: de
  text: Und Josia schenkte dem anwesenden Volk[a][b] dreißigtausend Lämmer und junge Ziegen sowie dreitausend Kälber.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „dem Volk, den Vorgefundenen“. Gemeint sind wahrscheinlich diejenigen, die dort anwesend oder zusammengekommen waren.'
    reason: lexical_alternative
  - marker: b
    text: Der angegebene hebräische Paralleltext stimmt mit diesem griechischen Vers nicht eng überein; die Übersetzung folgt daher dem griechischen Text als primärer Übersetzungsgrundlage.
    reason: textual_variant
lexical_decisions:
- source_word: ἐδωρήσατο
  choice: schenkte
  rationale: Die mediale Form von δωρέομαι bezeichnet das Geben als Geschenk oder freiwillige Zuwendung. „Schenkte“ gibt dies im Deutschen knapp und natürlich wieder.
- source_word: τῷ λαῷ
  choice: dem Volk
  rationale: Der Dativ bezeichnet die Empfänger von Josias Gabe.
- source_word: τοῖς εὑρεθέντι
  choice: anwesenden
  rationale: Die griechische Formulierung bedeutet wörtlich etwa „den/die Vorgefundenen“, bezeichnet hier aber wahrscheinlich das Volk, das sich vor Ort befand. „Anwesend“ ist idiomatisch und bewahrt diese Bedeutung, ohne eine förmliche Versammlung vorauszusetzen.
- source_word: ἀρνῶν καὶ ἐρίφων
  choice: Lämmer und junge Ziegen
  rationale: ἀρνῶν bezeichnet Lämmer, ἐρίφων junge Ziegen. Die Wiedergabe hält beide Tierarten und die Altersbezeichnung auseinander.
- source_word: τριακοντα χιλιάδας
  choice: dreißigtausend
  rationale: Direkte Wiedergabe der Zahl.
- source_word: μόσχους
  choice: Kälber
  rationale: μόσχος bezeichnet ein junges Rind; „Kälber“ ist die direkte Entsprechung und legt das Geschlecht nicht fest.
- source_word: τρισχιλίους
  choice: dreitausend
  rationale: Direkte Wiedergabe der Zahl.
theological_decisions:
- issue: Umgang mit der stark abweichenden masoretischen Parallelstelle
  choice: Der Haupttext folgt dem griechischen Text und beschreibt Josias Gabe von Tieren.
  alternative: Eine an 2. Chronik 35 angeglichene Fassung mit Anweisungen zum Schlachten und Vorbereiten des Passahmahls.
  rationale: Der angegebene hebräische Paralleltext entspricht dem griechischen Vers weder in Handlung noch Wortlaut hinreichend. Da für 1 Esdras der griechische Text die primäre Grundlage ist, wird die abweichende Handlungsfolge nicht in den Haupttext übernommen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Schenkte“ bewahrt den Charakter einer freiwilligen königlichen Gabe; „anwesenden“ löst die schwerfällige und grammatisch auffällige griechische Wendung zurückhaltend idiomatisch auf. „Sowie“ gliedert die beiden Zahlenangaben klar.
