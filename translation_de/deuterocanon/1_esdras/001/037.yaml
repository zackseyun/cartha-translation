base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/037.yaml
  text: Jehoiakim was twenty-five years old when he became king of Judea and Jerusalem[a], and he did what was evil before the Lord.
translation:
  language: de
  text: Jojakim war fünfundzwanzig Jahre alt, als er König von Judäa und Jerusalem wurde[a], und er tat, was böse war vor dem Herrn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Juda und Jerusalem«. Der griechische Text hat »Judäa und Jerusalem«; in der hebräischen Parallelüberlieferung ist gewöhnlich von »Juda und Jerusalem« die Rede.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐτῶν δὲ ἦν εἴκοσι πέντε
  choice: war fünfundzwanzig Jahre alt
  rationale: Die übliche griechische Altersangabe wird in natürlichem modernem Deutsch wiedergegeben.
- source_word: Ἰωακεὶμ
  choice: Jojakim
  rationale: Die im Deutschen gebräuchliche biblische Namensform bezeichnet dieselbe Person wie im hebräischen Parallelbericht.
- source_word: ὅτε ἐβασίλευσεν
  choice: als er König wurde
  rationale: Der Aorist bezeichnet in dieser Altersformel sinnvoll den Regierungsantritt.
- source_word: τῆς Ἰουδαίας καὶ Ἰερουσαλήμ
  choice: von Judäa und Jerusalem
  rationale: Die Wiedergabe folgt dem griechischen Ἰουδαίας und bewahrt die genitivische Herrschaftsangabe; „Juda“ wird als textgeschichtlich relevante Alternative in der Fußnote genannt.
- source_word: ἐποίησεν τὸ πονηρὸν
  choice: er tat, was böse war
  rationale: Diese Formulierung gibt die biblische Wendung verständlich und zugleich würdevoll wieder.
- source_word: ἐνώπιον Κυρίου
  choice: vor dem Herrn
  rationale: Die knappe Wendung bildet das griechische ἐνώπιον Κυρίου unmittelbar ab, ohne einen hebräischen Gottesnamen in den griechischen Ausgangstext einzutragen.
theological_decisions:
- issue: Wiedergabe von Κυρίου
  choice: dem Herrn
  alternative: vor Jahwe / vor dem HERRN
  rationale: Primärtext ist das griechische κύριος. Daher wird „Herr“ verwendet; eine Wiedergabe mit dem hebräischen Gottesnamen würde über den vorliegenden Wortlaut hinausgehen.
- issue: Geografisch-politische Bezeichnung Ἰουδαίας
  choice: Judäa
  alternative: Juda
  rationale: „Judäa“ folgt dem griechischen Ausgangstext. „Juda“ bleibt aufgrund der hebräischen Parallelüberlieferung als Fußnotenalternative erhalten.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Der Satzbau bleibt nahe am griechischen Ausgangstext, ohne im Deutschen steif zu wirken.
