base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/008.yaml
  text: These things were given from the royal possessions[a], according to the promise, to the people and to the priests and Levites. And Helkias, Zechariah, and Esyelos, the overseers of the sanctuary, gave to the priests for the Passover two thousand six hundred sheep[c][b], and three hundred calves.
translation:
  language: de
  text: Dies wurde gemäß der Zusage[a] aus dem königlichen Besitz dem Volk sowie den Priestern und Leviten gegeben. Und Helkias, Zacharias und Hesyelos[b], die Aufseher des Heiligtums, gaben den Priestern für das Passafest 2.600 Schafe[c] und 300 Kälber.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wie zugesagt“. Wörtlich lautet die griechische Wendung „gemäß der Zusage“; wer die Zusage gab, bleibt offen.'
    reason: lexical_alternative
  - marker: b
    text: Der griechische Text von 1 Esdras nennt Helkias, Zacharias und Hesyelos. Im hebräischen Parallelbericht in 2. Chronik 35,8 stehen entsprechende Namen in hebräischer Form, gewöhnlich als Hilkija, Secharja und Jehiël wiedergegeben.
    reason: alternative_reading
  - marker: c
    text: Der hebräische Parallelbericht nennt genauer Schafe, Lämmer und junge Ziegen; der griechische Text verwendet hier den allgemeinen Ausdruck „Schafe“.
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα
  choice: Diese Gaben
  rationale: Das Demonstrativpronomen verweist auf die zuvor genannten bereitgestellten Tiere beziehungsweise Mittel. „Gaben“ macht den Bezug im Deutschen verständlich, ohne die Art der Dinge enger als der Zusammenhang festzulegen.
- source_word: ἐκ τῶν βασιλικῶν
  choice: aus dem königlichen Besitz
  rationale: Die substantivierte Wendung bezeichnet das, was dem König beziehungsweise der Krone gehört; dies stimmt auch mit dem ungefähren hebräischen Paralleltext überein.
- source_word: κατʼ ἐπαγγελίαν
  choice: gemäß der Zusage
  rationale: Bewahrt die nominale Form und lässt offen, von wem die Zusage stammt. „Wie zugesagt“ wäre ebenfalls möglich.
- source_word: τῷ λαῷ καὶ τοῖς ἱερεῦσιν καὶ Λευίταις
  choice: dem Volk sowie den Priestern und Leviten
  rationale: Die Dative werden als Empfängerangaben wiedergegeben; „sowie“ gliedert die Gruppen natürlich.
- source_word: οἱ ἐπιστάται τοῦ ἱεροῦ
  choice: die Aufseher des Heiligtums
  rationale: ἐπιστάται bezeichnet Verantwortliche oder Aufseher; ἱερόν wird mit „Heiligtum“ in seiner sakralen Bedeutung wiedergegeben.
- source_word: εἰς πάσχα
  choice: für das Passafest
  rationale: Die Wendung bezeichnet den vorgesehenen Gebrauch beim Passa. „Passafest“ ist im modernen Deutschen eindeutig und natürlich.
- source_word: πρόβατα
  choice: Schafe
  rationale: Direkte Wiedergabe des griechischen Sammelbegriffs. Die genauere Aufzählung des hebräischen Paralleltexts wird nicht in den Haupttext eingetragen.
- source_word: μόσχους
  choice: Kälber
  rationale: μόσχος bezeichnet ein junges Rind; „Kälber“ bewahrt diese Altersangabe, ohne ein männliches Geschlecht hinzuzufügen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nahe am Griechischen, wird aber durch „Diese Gaben“ und „sowie“ natürlich lesbar. Eigennamen folgen dem maßgeblichen griechischen Text; Abweichungen des hebräischen Parallelberichts werden in Fußnoten dokumentiert.
