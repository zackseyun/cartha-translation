  naturalness: Die Satzfügung ist verständlich, doch „Diese Gaben wurden ... gegeben“ wirkt wegen der Wiederholung schwerfällig. „Dies wurde ... gegeben“ ist modernes, würdiges Deutsch und wahrt den kollektivischen Bezug des griechischen Neutrums.
  terminology: „königlicher Besitz“, „Zusage“, „Priester und Leviten“, „Aufseher des Heiligtums“, „Passafest“, „Schafe“ und „Kälber“ sind angemessen. Die Namen werden am griechischen Text ausgerichtet; daher ist „Hesyelos“ gegenüber „Esyelos“ vorzuziehen.
