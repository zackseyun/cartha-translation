revisions:
- from: Diese Gaben wurden gemäß der Zusage[a] aus dem königlichen Besitz dem Volk sowie den Priestern und Leviten gegeben. Und Helkias, Zacharias und Esyelos[b], die Aufseher des Heiligtums, gaben den Priestern für das Passafest 2.600 Schafe[c] und 300 Kälber.
