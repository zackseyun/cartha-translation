base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/027.yaml
  text: But he arrayed himself for war against him in the plain of Megiddo[a], and the commanders came down against King Josiah.
translation:
  language: de
  text: Doch er stellte sich ihm zum Kampf entgegen[a] in der Ebene von Megiddo, und die Befehlshaber zogen zu König Josia hinab.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hebräische Paralleltext in 2. Chronik 35,22 lautet abweichend: „Er verkleidete sich, um gegen ihn zu kämpfen.“'
    reason: alternative_reading
lexical_decisions:
- source_word: συνεστήσατο πρὸς αὐτὸν πόλεμον
  choice: er stellte sich ihm zum Kampf entgegen
  rationale: Die Form im Medium wird reflexiv wiedergegeben und der militärische Sinn von πόλεμον bewahrt. Die Formulierung klingt im modernen Deutschen natürlicher als eine wörtliche Rede vom Aufstellen eines Krieges und folgt gegenüber dem abweichenden hebräischen Paralleltext dem griechischen Hauptzeugen.
- source_word: ἐν τῷ πεδίῳ Μετααδδούς
  choice: in der Ebene von Megiddo
  rationale: πεδίον bezeichnet eine Ebene oder offenes Flachland. Der standardisierte Ortsname Megiddo wird durch den hebräischen Paralleltext bestätigt.
- source_word: κατέβησαν
  choice: zogen ... hinab
  rationale: Die Übersetzung erhält die konkrete Richtungsangabe des Verbs und verwendet ein im erzählenden militärischen Kontext natürliches deutsches Bewegungsverb.
- source_word: οἱ ἄρχοντες
  choice: die Befehlshaber
  rationale: Im unmittelbaren Kriegskontext bezeichnet ἄρχοντες am ehesten führende militärische Personen; die Wiedergabe vermeidet eine unnötige Festlegung auf zivile Herrscher.
- source_word: πρὸς βασιλέα Ἰωσίαν
  choice: zu König Josia
  rationale: Bei einem Verb der Bewegung gibt πρός mit Akkusativ zunächst die Richtung auf eine Person hin an. Da der Satz nicht ausdrücklich sagt, wessen Befehlshaber gemeint sind, wird die mögliche feindliche Bedeutung nicht zusätzlich in die Präposition eingetragen.
theological_decisions:
- issue: Verwendung des abweichenden masoretischen Paralleltextes
  choice: 'Im Haupttext der griechischen Lesart folgen: Josia stellt sich zum Kampf entgegen.'
  alternative: 'Nach 2. Chronik 35,22: Josia verkleidete sich, um gegen ihn zu kämpfen.'
  rationale: Für 1 Esdras ist der angegebene griechische Text der primäre Übersetzungszeuge. Der hebräische Paralleltext dient zur Kontrolle, darf aber die deutlich abweichende griechische Verbalaussage nicht ersetzen.
- issue: Deutung von πρὸς βασιλέα Ἰωσίαν
  choice: 'Räumlich-direktional: „zu König Josia“'
  alternative: 'Feindlich-adversativ: „gegen König Josia“'
  rationale: Beide Nuancen sind im Kriegskontext möglich. In Verbindung mit κατέβησαν ist die direktionale Wiedergabe jedoch formal näher und bewahrt die Ambiguität bezüglich der Befehlshaber, statt ihre Gegnerschaft ausdrücklich festzuschreiben.
translation_notes:
  register: Moderne, würdige Erzählsprache. „Stellte sich ... zum Kampf entgegen“ bewahrt die reflexive Nuance des griechischen Mediums, ohne altertümlich zu wirken; „zogen ... hinab“ erhält die räumliche Bewegung. Der Fußnotenmarker [a] steht unmittelbar beim zugehörigen griechischen Satzteil.
