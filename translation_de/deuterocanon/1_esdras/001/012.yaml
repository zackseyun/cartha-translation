base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/012.yaml
  text: After this they prepared for themselves and for the priests[a], their brothers[b], the sons of Aaron.
translation:
  language: de
  text: Danach trafen sie sowohl für sich selbst als auch für die Priester, ihre Brüder, die Söhne Aarons, Vorbereitungen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετὰ δὲ ταῦτα
  choice: Danach
  rationale: Gibt den zeitlichen Übergang knapp und in natürlichem modernem Deutsch wieder.
- source_word: ἡτοίμασαν
  choice: bereiteten … vor
  rationale: Bewahrt die transitive Grundbedeutung »vorbereiten/zurichten« und passt zum Zusammenhang der Opfer- und Mahlvorbereitung.
- source_word: ἑαυτοῖς
  choice: für sich selbst
  rationale: Entspricht unmittelbar dem reflexiven Dativ.
- source_word: τε καὶ
  choice: wie auch
  rationale: Macht die Verknüpfung beider Empfängergruppen deutlich, ohne das Deutsche unnötig zu beschweren.
- source_word: τοῖς ἱερεῦσιν
  choice: für die Priester
  rationale: Der Dativ bezeichnet hier die Empfänger beziehungsweise Begünstigten der Vorbereitung.
- source_word: ἀδελφοῖς αὐτῶν
  choice: ihre Brüder
  rationale: Bewahrt die ausdrücklich männliche Verwandtschafts- beziehungsweise Gemeinschaftsbezeichnung des griechischen Textes.
- source_word: υἱοῖς Ἀαρών
  choice: die Söhne Aarons
  rationale: Gibt die appositionelle Bezeichnung wörtlich und in geläufiger biblischer Ausdrucksweise wieder, ohne sie deutend zu »Nachkommen« zu erweitern.
theological_decisions:
- issue: Verhältnis von »ihre Brüder« und »die Söhne Aarons« zu »die Priester«
  choice: 'Alle drei Bezeichnungen werden als aufeinanderfolgende Appositionen wiedergegeben: »die Priester, ihre Brüder, die Söhne Aarons«.'
  alternative: 'Deutender: »ihre Brüder, die Priester aus den Söhnen Aarons« oder »ihre Brüder, die Priester, die Söhne Aarons waren«.'
  rationale: Der griechische Text setzt die Ausdrücke ohne Relativsatz nebeneinander. Die appositionelle Wiedergabe erhält diese Struktur und lässt die genaue Nuance des Bruderverhältnisses offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung hält die appositionelle Reihung des Griechischen sichtbar; »alles« wird lediglich ergänzt, damit das transitive Verb im Deutschen natürlich verständlich ist.
