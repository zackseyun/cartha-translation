base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/018.yaml
  text: And no Passover like this had been held in Israel since the days of Samuel the prophet.
translation:
  language: de
  text: Und seit den Tagen des Propheten Samuel war in Israel kein solches Passafest mehr gehalten worden.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤχθη
  choice: war … gehalten worden
  rationale: Das Passiv von ἄγω bezeichnet hier idiomatisch das Abhalten eines Festes. Die Formulierung wahrt das Passiv und ist im Deutschen natürlich.
- source_word: τὸ πάσχα
  choice: Passafest
  rationale: Im kultischen Zusammenhang bezeichnet πάσχα die Passafeier; „Passafest“ ist eindeutig und allgemein verständlich.
- source_word: τοιοῦτο
  choice: kein solches
  rationale: Im negierten Vergleich gibt „kein solches Passafest“ die Bedeutung knapp und idiomatisch wieder.
- source_word: ἐν τῷ Ἰσραήλ
  choice: in Israel
  rationale: Die Wendung bezeichnet den Bereich beziehungsweise die Gemeinschaft, in der das Fest gehalten wurde.
- source_word: ἀπὸ τῶν χρόνων
  choice: seit den Tagen
  rationale: Dies ist eine natürliche deutsche Wiedergabe der zeitlichen Ausgangsangabe und entspricht dem historischen Erzählstil.
- source_word: Σαμουὴλ τοῦ προφήτου
  choice: des Propheten Samuel
  rationale: Die griechische Vorlage nennt Samuel ausdrücklich Propheten; die deutsche Wortstellung ist idiomatisch und bewahrt diese Bezeichnung.
theological_decisions:
- issue: Historische Vergleichsformel gegenüber der hebräischen Parallelüberlieferung
  choice: seit den Tagen des Propheten Samuel
  alternative: seit der Zeit des Propheten Samuel
  rationale: Die griechische Hauptvorlage nennt Samuel ausdrücklich und setzt bei seinen Tagen den zeitlichen Vergleichspunkt. Die nur ungefähre masoretische Parallele darf diese Lesart nicht verdrängen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die vorzeitige Passivform bringt zum Ausdruck, dass innerhalb des rückblickend betrachteten Zeitraums kein vergleichbares Passafest stattgefunden hatte.
