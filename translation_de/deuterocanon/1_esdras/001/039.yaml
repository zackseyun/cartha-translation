base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/039.yaml
  text: And Nebuchadnezzar took some of the sacred vessels of the Lord and carried them away and deposited them in his temple in Babylon[a].
translation:
  language: de
  text: Und Nebukadnezzar nahm einige der heiligen Geräte des Herrn, brachte sie fort und legte sie in seinem Tempel in Babylon nieder.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder wörtlicher: „von den heiligen Geräten des Herrn“. Die griechische Wendung ist wahrscheinlich partitiv gemeint: Er nahm einige der Geräte, nicht notwendigerweise alle.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ τῶν ἱερῶν σκευῶν
  choice: einige von den heiligen Geräten
  rationale: 'ἀπό mit dem Genitiv kann hier partitiven Sinn haben: Nebukadnezzar nahm aus der Gesamtheit der geheiligten Geräte einige an sich. „Geräte“ bezeichnet im Deutschen natürlich die kultischen Gegenstände; „heilig“ bewahrt ihre kultische Zuordnung.'
- source_word: τοῦ κυρίου
  choice: des Herrn
  rationale: Der griechische Ausgangstext hat κύριος; daher wird die übliche deutsche Wiedergabe „Herr“ verwendet, ohne die hebräische Schreibkonvention „HERR“ einzuführen.
- source_word: λαβὼν
  choice: nahm
  rationale: Das Partizip wird im flüssigen deutschen Erzählstil als finite Verbform wiedergegeben.
- source_word: ἀπενέγκας
  choice: brachte sie fort
  rationale: Die Form bezeichnet das Wegbringen der zuvor genommenen Geräte und wahrt die Abfolge der Handlungen.
- source_word: ἀπηνείσατο
  choice: verwahrte sie
  rationale: Das Verb bezeichnet hier das Unterbringen beziehungsweise Deponieren der erbeuteten Gegenstände. „Verwahrte“ klingt würdig und bringt die Aufbewahrung im Tempel zum Ausdruck, ohne eine genauere Funktion zu behaupten.
- source_word: ἐν τῷ ναῷ αὐτοῦ
  choice: in seinem Tempel
  rationale: ναός bezeichnet hier Nebukadnezzars Tempel in Babylon; das Possessivpronomen bleibt erhalten.
- source_word: ἐν Βαβυλῶνι
  choice: in Babylon
  rationale: Übliche deutsche Form des Ortsnamens.
theological_decisions:
- issue: Wiedergabe von κύριος in einer griechischen deuterokanonischen Geschichtserzählung
  choice: Herr
  alternative: HERR
  rationale: Da der maßgebliche griechische Text κύριος bietet, wird „Herr“ gewählt. „HERR“ würde als deutsche Konvention eine ausdrückliche Wiedergabe des hebräischen Gottesnamens nahelegen, die dieser griechische Wortlaut nicht erkennen lässt.
- issue: Umfang der weggenommenen heiligen Geräte
  choice: einige von den heiligen Geräten
  alternative: von den heiligen Geräten
  rationale: Die Konstruktion ἀπό mit Genitiv lässt sich partitiv verstehen, ohne zu besagen, dass sämtliche Geräte genommen wurden. Da der griechische Ausdruck auch wörtlicher wiedergegeben werden kann, wird die Alternative in einer Fußnote bewahrt.
translation_notes:
  register: Moderner, würdiger Erzählstil. Die drei aufeinanderfolgenden griechischen Handlungen werden als koordinierte deutsche Verben wiedergegeben. „Heilige Geräte“ ist verständlich und bewahrt den kultischen Sinn; die echte Mehrdeutigkeit der partitiven Konstruktion wird durch die Fußnote offengehalten.
