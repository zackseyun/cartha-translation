base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/022.yaml
  text: And the things concerning him also have been recorded in former times[a], concerning those who sinned and acted wickedly against the Lord beyond every nation and kingdom, and grieved him greatly[b]; and the words of the Lord rose up against Israel.
translation:
  language: de
  text: 'Auch das, was ihn betrifft, ist in früheren Zeiten aufgezeichnet: über diejenigen, die sündigten und gegen den Herrn gottlos handelten, mehr als jedes Volk und jedes Königreich, und ihn tief betrübten[a]. Und die Worte des Herrn erhoben sich gegen Israel.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das nach „betrübten“ überlieferte griechische Wort ἔστω („es sei“) ist an dieser Stelle schwer verständlich. Die Übersetzung fasst es als Verstärkung auf; möglicherweise liegt eine geringfügige Textstörung vor.
    reason: textual_variant
  - marker: b
    text: 'Wörtlich auch möglich: „Die Worte des Herrn standen gegen Israel auf.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ κατʼ αὐτόν
  choice: was ihn betrifft
  rationale: Bewahrt die allgemeine, zusammenfassende Bedeutung der Wendung, ohne sie auf Taten einzuengen.
- source_word: ἀναγέγραπται
  choice: ist ... aufgezeichnet
  rationale: Das Perfekt Passiv bezeichnet eine erfolgte und weiterhin vorliegende schriftliche Aufzeichnung.
- source_word: ἐν τοῖς ἔμπροσθεν χρόνοις
  choice: für die früheren Zeiten
  rationale: Gibt die zeitliche Wendung wieder, ohne ein im Griechischen nicht ausdrücklich genanntes Buch oder Geschichtswerk einzuführen.
- source_word: περὶ τῶν ἡμαρτηκότων καὶ ἠσεβηκότων
  choice: über die, die sündigten und ... gottlos handelten
  rationale: Unterscheidet Sünde von gottlosem beziehungsweise frevelhaftem Handeln und bleibt zugleich allgemein verständlich.
- source_word: εἰς τὸν κύριον
  choice: gegen den Herrn
  rationale: Im feindlichen moralischen Zusammenhang hat εἰς adversative Bedeutung.
- source_word: παρὰ ἅπαν ἔθνος καὶ βασιλείαν
  choice: mehr als jedes Volk und Königreich
  rationale: παρά mit Akkusativ drückt hier wahrscheinlich einen Vergleich beziehungsweise ein Übermaß aus; die Formulierung bewahrt diese schwierige Aussage.
- source_word: ἐλύπησαν αὐτόν
  choice: ihn tief betrübten
  rationale: Bewahrt die persönliche Sprache über Gottes Betrübnis; „tief“ gibt versuchsweise die verstärkende Funktion des schwierigen ἔστω wieder.
- source_word: ἔστω
  choice: tief
  rationale: Die überlieferte Form ist syntaktisch auffällig. Eine verstärkende Wiedergabe folgt der plausiblen Wirkung im Satz, wird aber in einer Fußnote als textlich unsicher gekennzeichnet.
- source_word: οἱ λόγοι τοῦ κυρίου ἀνέστησαν ἐπʼ Ἰσραήλ
  choice: die Worte des Herrn erhoben sich gegen Israel
  rationale: Erhält die lebhafte Personifikation der Worte des Herrn und den gerichtlichen, gegnerischen Sinn von ἀνέστησαν ἐπί.
theological_decisions:
- issue: Wiedergabe von κύριος
  choice: der Herr
  alternative: der HERR; der Gebieter
  rationale: „Der Herr“ ist die natürliche Standardwiedergabe des griechischen κύριος; der griechische Text selbst verlangt hier keine typografische Kennzeichnung des Gottesnamens.
- issue: Anthropopathische Rede in ἐλύπησαν αὐτόν
  choice: ihn ... betrübten
  alternative: ihn erzürnten; ihm Kummer bereiteten
  rationale: Die Übersetzung bewahrt die ausdrückliche Aussage, dass Gott betrübt wurde, statt sie in eine weniger persönliche Reaktion umzudeuten.
- issue: Gerichtswirksamkeit der Worte Gottes
  choice: die Worte des Herrn erhoben sich gegen Israel
  alternative: die Worte des Herrn kamen über Israel
  rationale: Die gewählte Fassung erhält die Personifikation und lässt offen, auf welche konkrete Weise die Worte gegen Israel wirksam wurden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst beibehaltener Satzspannung. Die ungewöhnliche vergleichende Aussage und die Personifikation der Worte des Herrn werden nicht geglättet. Alle Fußnotenmarker stehen im Haupttext.
