base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/052.yaml
  text: And they burned the house of the Lord[a], and tore down the walls of Jerusalem, and burned its towers with fire[b],
translation:
  language: de
  text: Und sie setzten das Haus des Herrn[a] in Brand[b], rissen die Mauern Jerusalems nieder und setzten seine Türme mit Feuer in Brand,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit dem „Haus des Herrn“ ist der Tempel in Jerusalem gemeint.
    reason: cross_reference
  - marker: b
    text: 'Oder: „verbrannten das Haus des Herrn“ und später „verbrannten seine Türme mit Feuer“. Im Griechischen steht an beiden Stellen dasselbe Verb.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνεπύρισαν
  choice: steckten … in Brand / verbrannten
  rationale: Das Verb bezeichnet das Verbrennen oder Inbrandsetzen. Die beiden natürlichen deutschen Wiedergaben vermeiden eine schwerfällige Wiederholung, ohne eine vollständige Zerstörung ausdrücklich zu behaupten.
- source_word: τὸν οἶκον τοῦ κυρίου
  choice: das Haus des Herrn
  rationale: οἶκος bedeutet wörtlich „Haus“ und bezeichnet hier den Tempel. Die formnahe Wendung bleibt im Deutschen verständlich; die Fußnote erklärt den Bezug.
- source_word: κατέλυσαν
  choice: rissen … nieder
  rationale: Das Verb bezeichnet hier das Niederreißen beziehungsweise Abtragen eines Bauwerks und passt anschaulich zu den Stadtmauern.
- source_word: τὰ τείχη Ἰερουσαλήμ
  choice: die Mauern Jerusalems
  rationale: Direkte und idiomatische Wiedergabe der griechischen Genitivverbindung.
- source_word: τοὺς πύργους αὐτῆς
  choice: seine Türme
  rationale: πύργοι sind „Türme“. Das Pronomen bezieht sich auf Jerusalem; im modernen Deutschen ist bei einem Städtenamen das sächliche Possessivpronomen natürlich.
- source_word: ἐν πυρί
  choice: mit Feuer
  rationale: Die Wendung wird formal und verständlich wiedergegeben und bewahrt den instrumentalen beziehungsweise verstärkenden Charakter.
theological_decisions:
- issue: Wiedergabe von κύριος im Zusammenhang mit der Zerstörung des Tempels
  choice: Herr
  alternative: HERR
  rationale: Die maßgebliche griechische Vorlage hat κυρίου. Daher wird κύριος als „Herr“ wiedergegeben; die mögliche Rückbindung an den Gottesnamen in einer semitischen Tradition rechtfertigt hier nicht, die griechische Ausgangsform durch „HERR“ zu ersetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau folgt dem koordinierenden Stil des griechischen Textes. „Haus des Herrn“ bewahrt die Bildsprache der Vorlage; „steckten … in Brand“ und „verbrannten“ sind natürlich, ohne den Umfang der Zerstörung über den griechischen Wortlaut hinaus festzulegen.
