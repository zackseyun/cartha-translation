base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/042.yaml
  text: He reigned three months and ten days in Jerusalem[a], and he did what was evil before the Lord.
translation:
  language: de
  text: Er regierte drei Monate und zehn Tage in Jerusalem und tat, was böse war vor dem Herrn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »in den Augen des Herrn«.'
    reason: Lexikalische Alternative für ἔναντι Κυρίου, die den Gedanken der göttlichen Beurteilung ausdrücklich hervorhebt.
lexical_decisions:
- source_word: βασιλεύει
  choice: Er regierte
  rationale: Das historische Präsens bezeichnet hier seine Regierungszeit; im natürlichen deutschen Erzählstil steht dafür das Präteritum.
- source_word: μῆνας τρεῖς καὶ ἡμέρας δέκα
  choice: drei Monate und zehn Tage
  rationale: Die Zeitangabe wird direkt und ohne ergänzende Präposition wiedergegeben.
- source_word: ἐν Ἰερουσαλήμ
  choice: in Jerusalem
  rationale: Die Wendung bezeichnet den Ort beziehungsweise Sitz seiner Herrschaft.
- source_word: ἐποίησεν τὸ πονηρόν
  choice: tat, was böse war
  rationale: Die substantivierte neutrale Form τὸ πονηρόν bezeichnet moralisch Böses; die Formulierung bewahrt den biblischen Aussagecharakter und ist zugleich verständlich.
- source_word: ἔναντι Κυρίου
  choice: vor dem Herrn
  rationale: Die Wendung drückt die Beurteilung in Gottes Gegenwart beziehungsweise aus seiner Sicht aus; »vor dem Herrn« wahrt die knappe griechische Ausdrucksweise.
theological_decisions:
- issue: Wiedergabe von Κυρίου
  choice: dem Herrn
  alternative: dem HERRN
  rationale: Da die griechische Hauptquelle Κυρίου liest, wird κύριος regulär mit »Herr« wiedergegeben. Die Schreibweise »HERR« würde die zugrunde liegende Wiedergabe des Gottesnamens aus einer hebräischen Vorlage stärker markieren, als es der maßgebliche griechische Text selbst tut.
- issue: Bedeutung von ἔναντι Κυρίου
  choice: vor dem Herrn
  alternative: in den Augen des Herrn
  rationale: »Vor dem Herrn« erhält die Mehrdeutigkeit zwischen Gegenwart und göttlicher Beurteilung. Die alternative Wendung macht den Aspekt der Beurteilung deutlicher, ist aber interpretierender.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper biblischer Erzählweise. Das historische Präsens des Griechischen wird idiomatisch im Präteritum wiedergegeben; die Fußnote bewahrt die Bedeutungsbreite der abschließenden Wendung.
