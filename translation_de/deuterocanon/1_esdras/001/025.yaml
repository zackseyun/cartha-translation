base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/025.yaml
  text: Was I not sent against you by the Lord God? For my war is on the Euphrates[a], and now the Lord is with me, and the Lord is with me, urging me on. Stand aside[b], and do not oppose the Lord.
translation:
  language: de
  text: „Ich bin nicht gegen dich von Gott, dem Herrn, ausgesandt worden. Denn mein Krieg ist am Euphrat[a]. Nun ist der Herr mit mir, und der Herr ist mit mir und drängt mich voran[b]. Tritt zurück und stell dich nicht gegen den Herrn!“
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „beim Euphrat“ beziehungsweise „am Ufer des Euphrat“. Die griechische Wendung bezeichnet den Schauplatz des Feldzugs; die hebräische Parallelüberlieferung nennt Karkemisch am Euphrat.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „beschleunigt mich“ beziehungsweise „drängt mich voranzueilen“. Das griechische Partizip bezeichnet ein Antreiben oder Beschleunigen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχὶ … ἐξαπέσταλμαι
  choice: Bin ich etwa … ausgesandt worden?
  rationale: Die rhetorische Frage erwartet eine verneinende Antwort auf den Wortlaut und unterstreicht, dass sich der göttliche Auftrag nicht gegen Josia richtet. Das Perfekt Passiv wird im Deutschen natürlich als Zustand bzw. vollzogene Sendung wiedergegeben.
- source_word: πρὸς σὲ
  choice: gegen dich
  rationale: 'Im militärischen Zusammenhang hat πρός mit Akkusativ adversative Bedeutung: Nechos Feldzug gilt nicht Josia.'
- source_word: ὑπὸ Κυρίου τοῦ θεοῦ
  choice: vom Herrn, dem Gott
  rationale: Die appositionale Formulierung bildet Κυρίου τοῦ θεοῦ genauer ab als die im Deutschen leicht als fester Gottesname verstandene Verbindung „Herrn Gott“ und ergänzt kein nicht vorhandenes Possessivpronomen.
- source_word: ἐπὶ … τοῦ Εὐφράτου
  choice: am Euphrat
  rationale: ἐπί mit Genitiv bezeichnet hier den Schauplatz des Feldzugs. „Am Euphrat“ ist eine natürliche geografische Wiedergabe, ohne einen genauer bezeichneten Ort wie Karkemisch aus der Parallelüberlieferung in den griechischen Text einzutragen.
- source_word: ὁ πόλεμός μού ἐστιν
  choice: mein Krieg ist
  rationale: Die direkte Wiedergabe erhält den possessiven Nachdruck und bezeichnet Nechos eigenen Feldzug.
- source_word: μετʼ ἐμοῦ
  choice: mit mir
  rationale: Die schlichte Formulierung bewahrt die zweimalige Aussage göttlicher Gegenwart, ohne sie ausdrücklich als Parteinahme auszulegen.
- source_word: ἐπισπεύδων
  choice: treibt mich zur Eile
  rationale: Das Partizip bezeichnet ein Drängen oder Beschleunigen. Die Formulierung ist verständlich und bewahrt den aktiven Druck, unter dem Necho seinen Feldzug vorantreibt.
- source_word: ἀπόστηθι
  choice: Tritt zurück
  rationale: Der Imperativ fordert Josia auf, von seinem Eingreifen abzulassen; „Tritt zurück“ ist prägnant und dem ernsten militärischen Kontext angemessen.
- source_word: μὴ ἐναντίου τῷ κυρίῳ
  choice: stell dich nicht gegen den Herrn
  rationale: Die Wendung gibt die feindliche Gegenstellung klar wieder und erhält die Behauptung, Josias Widerstand gegen Necho richte sich gegen den Herrn.
theological_decisions:
- issue: Bezug von κύριος in Nechos Rede
  choice: Alle Vorkommen werden als „der Herr“ wiedergegeben.
  alternative: Die Bezeichnung generisch als „ein Herr“ oder als Nechos eigene Gottheit verstehen.
  rationale: Der griechische Wortlaut lautet Κυρίου τοῦ θεοῦ und danach zweimal Κύριος. Die Übersetzung bewahrt Nechos Anspruch auf göttliche Beauftragung, ohne über die Identität oder Gültigkeit dieses Anspruchs hinauszugehen.
- issue: Bewertung von Nechos Anspruch auf göttliche Sendung
  choice: Der Anspruch wird als direkte Rede unverändert stehen gelassen.
  alternative: Durch Zusätze kenntlich machen, dass Necho wahrhaftig oder irrtümlich spricht.
  rationale: Der Vers selbst spricht keine ausdrückliche Bewertung aus. Eine Präzisierung würde die im Text vorhandene theologische Spannung auflösen.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die Wiederholung „der Herr ist mit mir“ bleibt erhalten, obwohl sie stilistisch auffällig ist, da sie im Griechischen ausdrücklich wiederholt wird. Die direkte Rede wahrt sowohl den militärischen Ernst als auch die ungelöste Spannung von Nechos Anspruch auf göttliche Autorisierung.
