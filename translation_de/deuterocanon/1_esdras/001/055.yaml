base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/055.yaml
  text: until the land had enjoyed its Sabbaths; all the time of its desolation it kept Sabbath[a], to complete seventy years.
translation:
  language: de
  text: Bis das Land Gefallen an seinen Sabbaten gefunden hat, wird es während der ganzen Zeit seiner Verwüstung Sabbat halten, bis zur Vollendung von siebzig Jahren.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „bis das Land seine Sabbate genossen hat“. Wörtlicher: „bis das Land an seinen Sabbaten Gefallen gefunden hat“. Der griechische Text personifiziert das Land.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἕως τοῦ εὐδοκῆσαι
  choice: bis … Gefallen gefunden hat
  rationale: Die Verbindung mit dem substantivierten Aoristinfinitiv bezeichnet den Zielpunkt einer Zeitspanne. „Gefallen gefunden hat“ bewahrt die Personifizierung und den Bedeutungsgehalt von εὐδοκέω in natürlichem, gehobenem Deutsch.
- source_word: τὴν γῆν
  choice: das Land
  rationale: Gemeint ist in diesem Exilzusammenhang das Land Juda, nicht die ganze Erde oder lediglich der Erdboden.
- source_word: τὰ σάββατα αὐτῆς
  choice: seine Sabbate
  rationale: Die wörtliche Pluralform erhält die Verbindung zu den Sabbatjahren und zur Ruhe des Landes.
- source_word: πάντα τὸν χρόνον τῆς ἐρημώσεως αὐτῆς
  choice: während der ganzen Zeit seiner Verwüstung
  rationale: Die Wendung bezeichnet die vollständige Dauer des verwüsteten Zustands; „Verwüstung“ entspricht dem ernsten historischen Kontext.
- source_word: σαββατιεῖ
  choice: wird es Sabbat halten
  rationale: Das Futur des griechischen Verbs wird beibehalten. „Sabbat halten“ macht zudem die Wiederholung des Sabbat-Wortstamms sichtbar und vermeidet die Verflachung zu allgemeinem Ruhen.
- source_word: εἰς συμπλήρωσιν ἐτῶν ἑβδομήκοντα
  choice: bis siebzig Jahre vollendet sind
  rationale: 'Die idiomatische deutsche Formulierung gibt den Ziel- beziehungsweise Ergebnissinn wieder: Die festgesetzte Zeitspanne von siebzig Jahren gelangt zur Vollendung.'
theological_decisions:
- issue: Sabbatsprache für das personifizierte Land während der Verwüstung
  choice: „seine Sabbate“ und „Sabbat halten“
  alternative: „seine Ruhezeiten“ und „ruhen“
  rationale: Der griechische Text verwendet bewusst zweimal Wörter desselben Sabbat-Wortstamms. Diese Wiederholung bewahrt den Bezug auf die dem Land vorenthaltene Sabbatruhe und lässt die theologische Spannung des Bildes stehen.
- issue: Personifizierung des Landes
  choice: „an seinen Sabbaten Gefallen gefunden hat“
  alternative: „seine Sabbate nachgeholt hat“
  rationale: Die gewählte Form gibt εὐδοκέω vergleichsweise nah wieder und lässt das Land als handelnd beziehungsweise empfindend erscheinen, statt die Bildsprache erklärend aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzfolge bewahrt das griechische Futur und die auffällige Personifizierung; die wiederholte Sabbatsprache bleibt ausdrücklich erhalten.
