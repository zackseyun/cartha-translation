  register: Modernes, würdiges Standarddeutsch. Die feste Volksbezeichnung „Israeliten“ und die kontextuelle Wiedergabe „anwesend waren“ vermeiden unnatürliche Wörtlichkeit; die Fußnoten dokumentieren jeweils die griechische Form.
