base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/017.yaml
  text: And the sons of Israel who were found at that time kept the Passover and the feast of unleavened bread for seven days[a][b].
translation:
  language: de
  text: Und die Israeliten, die zu jener Zeit anwesend waren, feierten das Passafest und sieben Tage lang das Fest der ungesäuerten Brote.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die Söhne Israels“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „die zu jener Zeit gefunden wurden“; gemeint sind die damals Anwesenden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤγαγοσαν
  choice: feierten
  rationale: Wörtlich bezeichnet das Verb ein Bringen oder Führen; mit Festen als Objekten ist hier jedoch idiomatisch deren Durchführung bzw. Feier gemeint. „Feierten“ ist im modernen Deutschen natürlich.
- source_word: οἱ υἱοὶ Ἰσραήλ
  choice: die Israeliten
  rationale: Die wörtliche Form lautet „die Söhne Israels“. „Die Israeliten“ gibt die feste Volksbezeichnung im Deutschen klar und ohne den möglichen Eindruck einer ausschließlich männlichen Gruppe wieder.
- source_word: οἱ εὑρεθέντες
  choice: die … anwesend waren
  rationale: Das Partizip bedeutet wörtlich „die Gefundenen“ bzw. „die vorgefunden wurden“; im Zusammenhang bezeichnet es diejenigen, die damals zugegen waren.
- source_word: ἐν τῷ καιρῷ τούτῳ
  choice: zu jener Zeit
  rationale: καιρός bezeichnet hier den betreffenden Zeitpunkt oder Anlass; „zu jener Zeit“ entspricht dem deiktischen Rückbezug des griechischen τούτῳ.
- source_word: τὸ πάσχα
  choice: das Passafest
  rationale: Eingebürgerte deutsche Bezeichnung des jüdischen Festes; der Zusatz „-fest“ macht die syntaktische Verbindung mit „feierten“ deutlich.
- source_word: τὴν ἑορτὴν τῶν ἀζύμων
  choice: das Fest der ungesäuerten Brote
  rationale: Sachlich genaue und im Deutschen geläufige Wiedergabe des Festnamens.
- source_word: ἡμέρας ἑπτά
  choice: sieben Tage lang
  rationale: Der Akkusativ bezeichnet die Dauer. Die Stellung unmittelbar vor dem zweiten Fest macht deutlich, dass die Sieben-Tage-Angabe zum Fest der ungesäuerten Brote gehört.
