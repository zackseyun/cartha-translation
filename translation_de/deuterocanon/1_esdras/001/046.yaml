  source_fidelity: Die einleitende Konjunktion „Obwohl“ ist nicht durch das griechische καί gedeckt und macht aus der Partizipialkonstruktion einen unangezeigten Gegensatz. Der Eid als von Nebukadnezar auferlegte Vereidigung, die Anrufung des Namens des Herrn, der Eidbruch, die Rebellion mit unausgesprochenem Bezugsobjekt sowie das Übertreten der göttlichen Satzungen sind ansonsten zutreffend wiedergegeben.
  naturalness: Die Formulierungen sind überwiegend idiomatisches, würdiges modernes Standarddeutsch. Mit „Nachdem“ statt „Obwohl“ wird der zeitliche Vorbezug des aoristischen Partizips klar und ohne zusätzlichen konzessiven Sinn ausgedrückt. Die biblische Bildsprache von Nacken und Herz kann beibehalten werden.
  terminology: „Herr“, „Gott Israels“, „Eid“, „Satzungen“ und „übertrat“ sind sachgerecht. „Satzungen“ passt für νόμιμα; die lexikalischen Alternativen in der Fußnote sind angemessen. „beim Namen des Herrn“ ist als deutsche Eidformel vertretbar.
