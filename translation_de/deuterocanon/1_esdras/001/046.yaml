base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/046.yaml
  text: And though he had sworn by the name of the Lord to King Nebuchadnezzar[a], he broke his oath and rebelled; and, stiffening his neck and his heart[c][b], he transgressed the laws of the Lord God of Israel.
translation:
  language: de
  text: Nachdem König Nebukadnezar ihn beim Namen des Herrn hatte schwören lassen[a], brach er seinen Eid und lehnte sich auf[b]. Er verhärtete seinen Nacken und sein Herz und übertrat die Satzungen[c] des Herrn, des Gottes Israels.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Nachdem er von König Nebukadnezar beim Namen des Herrn unter Eid gestellt worden war.“'
    reason: lexical_alternative
  - marker: b
    text: Gemeint ist wahrscheinlich seine Auflehnung gegen Nebukadnezar; im Griechischen wird das Bezugsobjekt nicht ausdrücklich genannt.
    reason: alternative_reading
  - marker: c
    text: 'Oder: „Ordnungen“ beziehungsweise „Gesetze“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁρκισθεὶς ἀπὸ τοῦ βασιλέως Ναβουχοδονόσορ
  choice: König Nebukadnezar ihn … hatte schwören lassen
  rationale: Das passive Partizip mit ἀπό bezeichnet hier am natürlichsten, dass Nebukadnezar ihn einen Eid ablegen ließ. Diese Wiedergabe wahrt die ungewöhnliche griechische Konstruktion dem Sinn nach, ohne den König zum Adressaten des Eides zu machen.
- source_word: τῷ ὀνόματι τοῦ κυρίου
  choice: beim Namen des Herrn
  rationale: Der Dativ bezeichnet die feierliche Anrufung, durch die der Eid bekräftigt wurde; „beim Namen“ ist dafür im Deutschen idiomatisch.
- source_word: ἐφιορκήσας
  choice: brach er seinen Eid
  rationale: Das Verb bezeichnet die Verletzung eines geleisteten Eides. Die Formulierung ist klarer und natürlicher als „beging Meineid“.
- source_word: ἀπέστη
  choice: lehnte sich auf
  rationale: Im königlich-politischen Zusammenhang bezeichnet das Verb Abfall oder Rebellion. Die Wendung hält das im Griechischen nicht genannte Objekt offen.
- source_word: σκληρύνας αὐτοῦ τὸν τράχηλον καὶ τὴν καρδίαν αὐτοῦ
  choice: Er verhärtete seinen Nacken und sein Herz
  rationale: Die konkrete biblische Bildsprache bleibt erhalten. „Verhärtete“ lässt sich im Deutschen natürlich sowohl auf Nacken als auch auf Herz beziehen.
- source_word: παρέβη τὰ νόμιμα
  choice: übertrat die Satzungen
  rationale: „Übertrat“ bewahrt den rechtlich-bundestheologischen Ton; „Satzungen“ gibt νόμιμα als festgesetzte Ordnungen präziser wieder als das allgemeinere „Gesetze“.
- source_word: Κυρίου θεοῦ Ἰσραήλ
  choice: des Herrn, des Gottes Israels
  rationale: Die Apposition macht im Deutschen klar, dass „Herr“ und „Gott Israels“ denselben bezeichnen, und wahrt die Struktur des griechischen Titels.
theological_decisions:
- issue: Wiedergabe von κύριος in Eidformel und Gottestitel
  choice: Herr
  alternative: HERR
  rationale: Da der griechische Ausgangstext κύριος bietet, wird „Herr“ verwendet, ohne die typografische Wiedergabe des hebräischen Gottesnamens in den Text einzutragen.
- issue: Nicht genanntes Bezugsobjekt von ἀπέστη
  choice: lehnte sich auf
  alternative: lehnte sich gegen Nebukadnezar auf
  rationale: Der politische Bezug auf Nebukadnezar liegt nahe, doch das griechische Verb nennt kein Objekt. Der Haupttext bewahrt diese Ellipse; eine Fußnote erläutert den wahrscheinlichen Bezug.
- issue: Handelnder beim auferlegten Eid
  choice: Nebukadnezar ließ ihn schwören
  alternative: er schwor König Nebukadnezar
  rationale: Die passive Form ὁρκισθείς und ἀπό mit dem König als Quelle bzw. Veranlasser sprechen unmittelbar dafür, dass Nebukadnezar ihn unter Eid stellte. Der Eid wurde „beim Namen des Herrn“ geleistet; ein ausdrücklicher Adressat wird nicht genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die traditionelle Bildsprache von verhärtetem Nacken und Herz bleibt erhalten. Der Vers wird zur besseren Lesbarkeit in zwei Sätze gegliedert; alle erklärenden Fußnotenmarker stehen an den einschlägigen Stellen im Haupttext.
