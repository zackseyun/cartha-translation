  text: having stationed the priests in their divisions[c][b][a], arrayed in the temple of the Lord.
translation:
  language: de
  text: Nachdem er die Priester nach ihren Dienstabteilungen[a], prächtig gekleidet[b], im Tempel[c] des Herrn aufgestellt hatte,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „nach ihren Dienstordnungen“ beziehungsweise „nach ihren turnusmäßigen Dienstgruppen“. Gemeint sind die geordneten Abteilungen des priesterlichen Dienstes.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „geschmückt“ oder „angetan“. Das griechische Wort bezeichnet ein geschmücktes beziehungsweise prächtiges Auftreten; priesterliche Gewänder sind im Zusammenhang naheliegend, werden aber nicht ausdrücklich genannt.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich kann ἐν τῷ ἱερῷ „im Heiligtum“ oder „im Tempel“ bedeuten. Der hebräische Paralleltext hat: „zum Dienst am Haus des HERRN“. Im Griechischen kann die Ortsangabe entweder zum Aufstellen oder zum Bekleidetsein der Priester gehören.'
    reason: alternative_reading
lexical_decisions:
- source_word: στήσας
  choice: Nachdem er … aufgestellt hatte
  rationale: Das Aoristpartizip von ἵστημι wird als vorzeitiger deutscher Nebensatz wiedergegeben. „Aufgestellt“ wahrt sowohl den räumlichen als auch den amtlich-organisatorischen Sinn und entspricht dem hebräischen Parallelverb וַיַּעֲמֵד.
- source_word: τοὺς ἱερεῖς
  choice: die Priester
  rationale: Direkte und übliche Wiedergabe des griechischen Akkusativobjekts.
- source_word: κατʼ ἐφημερίας
  choice: nach ihren Dienstabteilungen
  rationale: ἐφημερία bezeichnet hier die geordneten priesterlichen Abteilungen beziehungsweise turnusmäßigen Dienstgruppen. „Dienstabteilungen“ ist im heutigen Deutsch verständlich und vermeidet das missverständliche „Tagesschichten“.
- source_word: ἐστολισμένους
  choice: in Gewänder gekleidet
  rationale: Das Partizip bezeichnet ein Bekleiden oder Ausstatten, wahrscheinlich mit priesterlichen Gewändern. Die Formulierung hält diese naheliegende Bedeutung fest, ohne „Pracht“, „Fest-“ oder „Amtskleidung“ ausdrücklich in den griechischen Wortlaut hineinzulesen.
- source_word: ἐν τῷ ἱερῷ
  choice: im Tempel
  rationale: ἱερόν bezeichnet hier den Tempel beziehungsweise den heiligen Tempelbezirk. „Tempel“ folgt unmittelbar dem griechischen Hauptzeugen; der hebräische Paralleltext hat „Haus des HERRN“.
- source_word: τοῦ κυρίου
  choice: des Herrn
  rationale: κύριος wird entsprechend dem griechischen Primärtext mit „Herr“ wiedergegeben. Der hebräische Paralleltext bietet an dieser Stelle den Gottesnamen.
theological_decisions:
- issue: Wiedergabe von κύριος bei יהוה im hebräischen Paralleltext
  choice: des Herrn
  alternative: des HERRN
  rationale: Da der griechische Text der primäre Übersetzungsanker ist und κυρίου liest, steht „Herr“ im Haupttext. „HERR“ würde stärker den hebräischen Parallelzeugen als den griechischen Ausgangstext abbilden.
- issue: Grad der Bestimmtheit bei der priesterlichen Kleidung
  choice: in Gewänder gekleidet
  alternative: in ihre priesterlichen Amtsgewänder gekleidet
  rationale: Der Zusammenhang legt priesterliche Gewänder nahe, doch ἐστολισμένους benennt sie nicht ausdrücklich als Amtsgewänder. Die Hauptfassung vermeidet daher eine unnötige dogmatische oder kultische Präzisierung.
- issue: Bezug von ἐν τῷ ἱερῷ
  choice: auf das Aufstellen der Priester bezogen
  alternative: auf ihr Bekleidetsein bezogen
  rationale: Die griechische Wortstellung lässt den syntaktischen Bezug nicht völlig eindeutig erkennen. Im Deutschen ist der Bezug auf das Aufstellen im Tempel natürlicher; die Fußnote bewahrt die mögliche andere Verbindung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der vorzeitige Nebensatz erhält die partizipiale Verknüpfung mit dem umgebenden Erzählzusammenhang; das abschließende Komma zeigt, dass der Satz im folgenden Vers beziehungsweise Kontext weitergeführt wird. Die eingeschobene Kleidungsangabe bleibt lesbar, ohne den griechischen Text kultisch zu überpräzisieren.
