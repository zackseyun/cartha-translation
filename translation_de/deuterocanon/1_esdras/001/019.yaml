base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/019.yaml
  text: And all the kings of Israel had not kept such a Passover as Josias kept[c][b][a], and the priests and the Levites and the Judeans and all Israel who were found dwelling in Jerusalem.
translation:
  language: de
  text: Und keiner von allen Königen Israels hatte ein solches Passafest gefeiert wie Josia[a], die Priester, die Leviten, die Judäer[b] und ganz Israel, soweit es in Jerusalem ansässig war.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Griechisch Iōseias; gemeint ist König Josia.
    reason: cross_reference
  - marker: b
    text: „Judäer“ kann auch mit „Juden“ wiedergegeben werden; hier dürfte die ethnisch-geografische Zugehörigkeit zu Juda beziehungsweise Judäa im Vordergrund stehen.
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlicher etwa: „ganz Israel, das in seiner Wohnstätte in Jerusalem vorgefunden wurde“. Die griechische Formulierung ist ungewöhnlich; sie kann auch allgemeiner die in Jerusalem Anwesenden bezeichnen.'
    reason: textual_ambiguity
lexical_decisions:
- source_word: ἤγαγον πάσχα
  choice: hatte ein ... Passafest gefeiert
  rationale: ἄγω bedeutet wörtlich „führen/bringen“, bezeichnet mit πάσχα hier jedoch idiomatisch das Begehen des Passafestes. „feiern“ gibt diesen kultischen Sinn in natürlichem Deutsch wieder.
- source_word: τοιοῦτον οἷον
  choice: ein solches ... wie
  rationale: Die deutsche Korrelativkonstruktion bewahrt den ausdrücklichen Vergleich des griechischen τοιοῦτον οἷον.
- source_word: Ἰωσείας
  choice: Josia
  rationale: „Josia“ ist die im modernen Deutschen etablierte Form für den in der griechischen Namensform Ἰωσείας bezeichneten König; die Fußnote weist auf die griechische Form hin.
- source_word: Ἰουδαῖοι
  choice: Judäer
  rationale: Im historischen Zusammenhang steht die ethnisch-geografische Zugehörigkeit zu Juda/Judäa im Vordergrund. „Judäer“ vermeidet eine vorschnelle Verengung auf eine spätere religiöse Bezeichnung.
- source_word: πᾶς Ἰσραὴλ
  choice: ganz Israel
  rationale: Die kollektive Wendung wird direkt wiedergegeben und nicht auf Juda eingeschränkt.
- source_word: οἱ εὑρεθέντες
  choice: die sich ... vorfanden
  rationale: Dies bewahrt die Bedeutung des partizipialen „die Vorgefundenen“, klingt aber im Deutschen weniger schwerfällig.
- source_word: ἐν τῇ κατοικήσει αὐτῶν ἐν Ἰερουσαλήμ
  choice: in Jerusalem als Bewohner
  rationale: Die schwierige griechische Wendung verbindet ihr Wohnen beziehungsweise ihren Wohnsitz mit Jerusalem. Die Formulierung wahrt diesen Residenzaspekt, ohne ihn nur zu „anwesend“ abzuschwächen.
theological_decisions:
- issue: Umfang von „alle Könige Israels“
  choice: Die umfassende historische Aussage über alle Könige Israels bleibt erhalten.
  alternative: Die Aussage auf die Könige Judas oder auf frühere Könige einzugrenzen.
  rationale: Der griechische Text sagt ausdrücklich πάντες οἱ βασιλεῖς τοῦ Ἰσραήλ. Eine historische oder konfessionelle Harmonisierung wäre nicht textgemäß.
- issue: Zuordnung der mit Josia genannten Gruppen
  choice: Der Gedankenstrich und „zusammen mit“ machen deutlich, dass Priester, Leviten, Judäer und ganz Israel gemeinsam mit Josia das Passa feierten.
  alternative: Die einfache griechische Reihung mit wiederholtem „und“ syntaktisch unaufgelöst wiederzugeben.
  rationale: Die griechische Koordination ist formal mehrdeutig beziehungsweise sperrig; im Zusammenhang sind die Gruppen am Feiern beteiligt. Die Übersetzung macht den naheliegenden syntaktischen Bezug lesbar, ohne den Umfang der Beteiligten zu verändern.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Passafest“ ist für gewöhnliche Leser klarer als das alleinstehende „Passa“. Die Vorvergangenheit bildet den griechischen Aorist im Vergleich mit Josias damaliger Feier idiomatisch ab. Der Satzbau wird gegenüber der sperrigen griechischen Reihung behutsam gegliedert.
