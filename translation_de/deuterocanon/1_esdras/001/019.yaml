revisions:
- from: Und keiner von allen Königen Israels hatte ein solches Passafest gefeiert wie Josia[a] – zusammen mit den Priestern, den Leviten, den Judäern[b] und ganz Israel, die sich in Jerusalem als Bewohner vorfanden.[c]
  to: Und keiner von allen Königen Israels hatte ein solches Passafest gefeiert wie Josia[a], die Priester, die Leviten, die Judäer[b] und ganz Israel, soweit es in Jerusalem ansässig war.[c]
  rationale: Die Revision ersetzt die semantisch fehlerhafte reflexive Formulierung durch „soweit es in Jerusalem ansässig war“. Damit wird der Wohnbezug von ἐν τῇ κατοικήσει ... ἐν Ἰερουσαλήμ idiomatisch wiedergegeben; die Fußnote hält zugleich die passive Nuance von οἱ εὑρεθέντες und die Schwierigkeit der griechischen Formulierung fest. Die direkte Reihung statt Gedankenstrich folgt dem griechischen Satzbau enger.
