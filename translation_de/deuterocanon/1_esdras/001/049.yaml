base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/049.yaml
  text: But they mocked his messengers[a], and whenever the Lord spoke, they were making sport of his prophets, until, in his anger against his nation because of their ungodly deeds[b], he commanded the kings of the Chaldeans to come up against them.
translation:
  language: de
  text: Sie aber verhöhnten seine Boten[a], und sooft der Herr redete, verspotteten sie seine Propheten, bis er, über sein Volk wegen dessen gottloser Taten erzürnt, befahl, die Könige der Chaldäer gegen sie heraufziehen zu lassen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „seine Engel“. Hier sind im Zusammenhang, besonders aufgrund der parallelen Erwähnung der Propheten, wahrscheinlich menschliche Boten Gottes gemeint.'
    reason: lexical_alternative
  - marker: b
    text: Der griechische Text hat „die Könige der Chaldäer“ im Plural. Die hebräische Parallelüberlieferung in 2. Chronik 36 hebt dagegen den König von Babylon beziehungsweise Nebukadnezar hervor. Die Übersetzung folgt hier dem griechischen Text von 1 Esdras.
    reason: textual_variant
lexical_decisions:
- source_word: ἐμυκτήρισαν
  choice: verhöhnten
  rationale: Das Verb bezeichnet höhnische, verächtliche Verspottung; „verhöhnten“ ist würdig und im heutigen Deutsch klar.
- source_word: ἐν τοῖς ἀγγέλοις αὐτοῦ
  choice: seine Boten
  rationale: ἄγγελοι meint im geschichtlich-prophetischen Zusammenhang am ehesten menschliche Boten Gottes; die mögliche Bedeutung „Engel“ wird in einer Fußnote bewahrt.
- source_word: ᾗ ἡμέρᾳ ἐλάλησεν Κύριος
  choice: wenn der Herr redete
  rationale: Die temporale Wendung wird hier idiomatisch iterativ verstanden; dies passt zum fortgesetzten Verhalten im folgenden Imperfekt.
- source_word: ἐκπαίζοντες
  choice: verspotteten
  rationale: Das Partizip beschreibt fortgesetztes Lächerlichmachen; „verspotteten“ gibt dies natürlich wieder, ohne die seltenere Wendung „zum Gespött machen“ zu erzwingen.
- source_word: θυμῶντα αὐτὸν
  choice: von Zorn ... erfüllt
  rationale: Die partizipiale Konstruktion wird idiomatisch wiedergegeben, wobei Gottes Zorn als Übergang zum Gerichtsbefehl erhalten bleibt.
- source_word: ἐπὶ τῷ ἔθνει αὐτοῦ
  choice: über sein Volk
  rationale: Obwohl ἔθνος wörtlich „Nation“ heißen kann, bezeichnet es hier Gottes eigenes Bundesvolk; „Volk“ ist im Deutschen kontextgerecht und natürlich.
- source_word: δυσσεβήματα
  choice: gottlose Taten
  rationale: Der Ausdruck bewahrt sowohl den Handlungscharakter als auch die religiöse Dimension der Verfehlungen.
- source_word: προστάξαι ἀναβιβάσαι ἐπ᾽ αὐτοὺς
  choice: befahl ... gegen sie heraufziehen zu lassen
  rationale: Die abhängige Infinitivkonstruktion bezeichnet den göttlichen Befehl zu einem militärischen Aufmarsch.
- source_word: τοὺς βασιλεῖς τῶν Χαλδαίων
  choice: die Könige der Chaldäer
  rationale: Der griechische Primärtext steht ausdrücklich im Plural und wird nicht an die anderslautende hebräische Parallelüberlieferung angeglichen.
theological_decisions:
- issue: Bezug von ἀγγέλοις im Gerichtskontext
  choice: menschliche Boten Gottes
  alternative: himmlische Engel
  rationale: Die unmittelbare Parallele zu „seinen Propheten“ spricht für menschliche Gesandte; die lexikalisch mögliche andere Deutung bleibt in der Fußnote sichtbar.
- issue: Plural „Könige der Chaldäer“ gegenüber der hebräischen Parallelüberlieferung
  choice: Plural des griechischen Textes beibehalten
  alternative: der König von Babylon beziehungsweise Nebukadnezar
  rationale: Für 1 Esdras ist der griechische Text die primäre Übersetzungsgrundlage. Die Abweichung wird nicht harmonisiert, sondern transparent vermerkt.
- issue: Logisches Subjekt von προστάξαι
  choice: Gott befiehlt den Aufmarsch
  alternative: eine unpersönlichere Wiedergabe des Gerichtsgeschehens
  rationale: Die griechische Konstruktion führt Gottes Zorn unmittelbar zu seinem Befehl; diese Spannung zwischen menschlicher Gottlosigkeit und göttlichem Gericht bleibt erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der lange griechische Satz wird zur besseren Verständlichkeit in zwei Sätze gegliedert. Wiederholte Verben des Spottes werden differenziert, und die militärische Bedeutung von ἀναβιβάσαι bleibt durch „heraufziehen“ erkennbar.
