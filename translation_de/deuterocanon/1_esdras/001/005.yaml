base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/005.yaml
  text: according to the writing of David king of Israel[a], and according to the greatness of Solomon his son; and standing in the sanctuary according to your ancestral division, O Levites, before your brothers, the sons of Israel[c][b],
translation:
  language: de
  text: nach der schriftlichen Anordnung Davids, des Königs von Israel, und nach der Größe Salomos, seines Sohnes[a]. Stellt euch im Heiligtum[b] auf, ihr Leviten, nach eurer angestammten Abteilung[c], vor euren Brüdern, den Söhnen Israels.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »nach der Hoheit« beziehungsweise »nach der Großartigkeit Salomos«. Der griechische Ausdruck kann Größe, Hoheit oder Pracht bezeichnen; möglicherweise ist die Würde oder das Ausmaß seiner Regelung gemeint.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »im Heiligen«; auch möglich: »an der heiligen Stätte«.'
    reason: lexical_alternative
  - marker: c
    text: 'Die griechische Wendung ist gedrängt. Der hebräische Paralleltext formuliert ausführlicher: »nach euren Vaterhäusern, gemäß euren Abteilungen«.'
    reason: alternative_reading
lexical_decisions:
- source_word: γραφήν
  choice: schriftliche Anordnung
  rationale: Hier bezeichnet γραφή eine mit David verbundene schriftliche Weisung oder Festlegung, nicht »Schrift« im späteren technischen Sinn. »Schriftliche Anordnung« gibt die konkrete und in diesem Zusammenhang autoritative Funktion natürlich wieder; das hebräische Parallelzeugnis בכתב bestätigt den Bezug auf etwas Geschriebenes.
- source_word: μεγαλειότητα
  choice: Größe
  rationale: Das Substantiv bezeichnet Größe, Hoheit oder Herrlichkeit. »Größe« bleibt nahe am ungewöhnlichen griechischen Ausdruck und vermeidet, stillschweigend eine im Text nicht ausdrücklich genannte »Anordnung« Salomos einzusetzen.
- source_word: στᾶντες
  choice: Stellt euch … auf
  rationale: Das Partizip hat im Zusammenhang auffordernde Kraft. Die deutsche Imperativform stellt diese Funktion idiomatisch dar, während »sich aufstellen« den räumlichen und geordneten Sinn wahrt.
- source_word: ἐν τῷ ἁγίῳ
  choice: im Heiligtum
  rationale: Wörtlich steht »im Heiligen«. »Im Heiligtum« ist im Tempelkontext die natürliche deutsche Wiedergabe, ohne einen bestimmten architektonischen Bereich festzulegen.
- source_word: μεριδαρχίαν τὴν πατρικήν
  choice: ererbte Abteilung
  rationale: Der seltene Ausdruck verweist auf eine geordnete, nach Abstammung bestimmte Einteilung. »Ererbte Abteilung« hält sowohl den organisatorischen als auch den väterlich-ancestralen Aspekt fest, ohne den nicht ausdrücklich genannten Zusatz »Dienst« in den Haupttext aufzunehmen.
- source_word: τῶν ἔμπροσθεν τῶν ἀδελφῶν ὑμῶν
  choice: vor euren Brüdern
  rationale: ἔμπροσθεν kann räumlich »vor« oder allgemeiner »in Gegenwart von« bedeuten. Die knappe Wiedergabe bewahrt diese Möglichkeit im Kontext des levitischen Dienstes.
- source_word: υἱῶν Ἰσραήλ
  choice: den Söhnen Israels
  rationale: Die griechische familiäre und stammesbezogene Bezeichnung wird bewusst erhalten, statt sie zu »Israeliten« oder »Volk Israel« zu verallgemeinern.
theological_decisions:
- issue: Geschlechtlich und familiär markierte Bundesbezeichnung υἱῶν Ἰσραήλ
  choice: den Söhnen Israels
  alternative: den Israeliten
  rationale: Der Ausgangstext verwendet ausdrücklich eine männliche familiäre Wendung. Ihre Beibehaltung wahrt die stammes- und bundesgeschichtliche Ausdrucksweise, ohne eine weitergehende theologische Deutung einzutragen.
- issue: Heranziehung des hebräischen Paralleltextes zur gedrängten griechischen Formulierung
  choice: nach eurer ererbten Abteilung
  alternative: nach euren Vaterhäusern und euren Abteilungen
  rationale: Der griechische Text bleibt die Übersetzungsgrundlage. Das hebräische Parallelzeugnis erklärt den familiären Hintergrund, darf aber seine ausführlichere Doppelbestimmung nicht vollständig in den griechischen Haupttext eintragen.
- issue: Ungewöhnliche Aussage über Salomo
  choice: nach der Größe Salomos
  alternative: nach der Anordnung Salomos
  rationale: Die griechische Lesart μεγαλειότητα ist semantisch ungewöhnlich, bezeichnet aber Größe, Hoheit oder Pracht. Die Übersetzung bewahrt diese Spannung; die glattere Alternative würde wahrscheinlich Gemeintes ausdrücken, jedoch ein nicht vorhandenes Substantiv ergänzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der auffordernde Sinn des griechischen Partizips wird idiomatisch als Imperativ wiedergegeben. Die ungewöhnliche Formulierung »nach der Größe Salomos« bleibt bewusst erhalten und wird in der Fußnote erläutert; so wird die textliche Spannung nicht durch eine stillschweigende Konjektur geglättet.
