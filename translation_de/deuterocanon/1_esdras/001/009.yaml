base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/009.yaml
  text: And Iechonias and Samaias and Nathanael his brother, and Sabias and Ochielos and Joram, commanders of thousands, gave to the Levites for the Passover one thousand sheep and seven hundred calves.
translation:
  language: de
  text: Und Jechonias, Samaias und sein Bruder Nathanael sowie Sabias, Ochiëlos und Joram, die Befehlshaber über Tausend, gaben den Leviten für das Passa tausend Schafe und siebenhundert Kälber.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hebräische Paralleltext in 2. Chronik 35,9 nennt andere Amtsträger und andere Zahlen: 2.600 Tiere für das Passa und 300 Rinder. Da 1. Esdras hier nach dem griechischen Text übersetzt wird, stehen dessen Namen und Zahlen im Haupttext.'
    reason: textual_variant
lexical_decisions:
- source_word: χιλίαρχοι
  choice: die Führer über Tausend
  rationale: Die Amtsbezeichnung bedeutet wörtlich Führer über tausend Personen. Diese Wiedergabe bewahrt den formalen Gehalt, ohne eine speziell römische Rangbezeichnung einzuführen.
- source_word: εἰς πάσχα
  choice: für das Passa
  rationale: Die Wendung bezeichnet den Zweck beziehungsweise die Bestimmung der Tiere für das Passa, ohne die kultische Einzelheit stärker festzulegen als der griechische Text.
- source_word: πρόβατα
  choice: Schafe
  rationale: πρόβατα bezeichnet allgemein Schafe beziehungsweise Kleinvieh. „Schafe“ ist hier die direkte und gut verständliche Wiedergabe.
- source_word: μόσχους
  choice: Kälber
  rationale: μόσχος bezeichnet ein Kalb oder Jungrind. „Kälber“ gibt den Ausdruck direkt wieder, ohne das Geschlecht der Tiere festzulegen.
- source_word: ὁ ἀδελφὸς
  choice: sein Bruder
  rationale: Der bestimmte Artikel kann im Griechischen in einer verwandtschaftlichen Apposition einen im Deutschen erforderlichen Possessivbezug vertreten. Die Stellung legt nahe, Nathanael als Bruder des unmittelbar zuvor genannten Samaias zu bezeichnen, auch wenn der Bezug nicht ausdrücklich ausformuliert ist.
- source_word: ἔδωκαν τοῖς Λευείταις
  choice: gaben den Leviten
  rationale: Die schlichte Konstruktion aus „geben“ und indirektem Objekt wird unmittelbar und idiomatisch wiedergegeben.
