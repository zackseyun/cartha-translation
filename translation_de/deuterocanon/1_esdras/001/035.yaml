  source_fidelity: Die Wiedergabe von ἀνέδειξεν mit „setzte … als König … ein“ trifft die amtseinsetzende Bedeutung präzise. Auch „über Judäa und Jerusalem“ gibt die territorialen Genitive idiomatisch wieder. Das Possessivpronomen αὐτοῦ bezieht sich im Kontext auf Joachaz, nicht auf den König von Ägypten.
