base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/035.yaml
  text: And the king of Egypt made Joakim his brother king over Judea and Jerusalem[a].
translation:
  language: de
  text: Und der König von Ägypten setzte Joakim[a], den Bruder Joachas, als König über Judäa und Jerusalem ein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Name lautet im griechischen Text hier „Joakim“; in der hebräischen Parallelüberlieferung wird er gewöhnlich „Jojakim“ genannt.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέδειξεν
  choice: setzte … als König … ein
  rationale: Das Verb bezeichnet hier die Einsetzung in ein Amt. Die deutsche Wendung gibt sowohl den verursachenden Charakter als auch den königlichen Amtsantritt natürlich und präzise wieder.
- source_word: ὁ βασιλεὺς Αἰγύπτου
  choice: der König von Ägypten
  rationale: Die Genitivverbindung wird in klarem, idiomatischem Deutsch als Herrschertitel wiedergegeben.
- source_word: Ἰωακεὶμ
  choice: Joakim
  rationale: Die Namensform folgt unmittelbar der griechischen Textgrundlage, ohne sie stillschweigend an die hebräische Parallelüberlieferung anzugleichen.
- source_word: τὸν ἀδελφὸν αὐτοῦ
  choice: seinen Bruder
  rationale: Die knappe Wiedergabe bewahrt den Bezug des griechischen Possessivpronomens; aus dem Zusammenhang ist der Bruder des zuvor genannten Joachaz gemeint.
- source_word: βασιλέα
  choice: als König
  rationale: Die Amtsbezeichnung wird ausdrücklich bewahrt und fügt sich idiomatisch in die deutsche Konstruktion „als König einsetzen“ ein.
- source_word: τῆς Ἰουδαίας καὶ Ἰερουσαλήμ
  choice: über Judäa und Jerusalem
  rationale: „Über“ bezeichnet im Deutschen natürlich den Herrschaftsbereich des eingesetzten Königs.
