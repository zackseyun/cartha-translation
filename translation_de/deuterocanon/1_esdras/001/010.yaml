base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/010.yaml
  text: And when these things had taken place[a], the priests and the Levites stood in proper order, holding the unleavened bread, according to the tribes and according to the family divisions of the fathers, before the people, to offer to the Lord according to what is written in the book of Moses[b]; and so they did in the morning.
translation:
  language: de
  text: Und nachdem dies geschehen war, stellten sich die Priester und die Leviten in angemessener Ordnung auf. Mit den ungesäuerten Broten standen sie nach den Stämmen und nach den Abteilungen der Vaterhäuser[a] vor dem Volk, um sie dem Herrn darzubringen, wie es im Buch des Mose geschrieben steht[b]. Und so taten sie es am Morgen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „nach den Abteilungen der Väter“ beziehungsweise „nach ihren Vaterhäusern“.'
    reason: lexical_alternative
  - marker: b
    text: Der griechische Text weicht hier deutlich vom annähernden hebräischen Paralleltext in 2. Chronik 35,10 ab, der davon berichtet, dass führende Leviten Passahtiere bereitstellten. Die Übersetzung folgt dem griechischen Text von 1. Esra.
    reason: textual_variant
lexical_decisions:
- source_word: εὐπρεπῶς
  choice: in angemessener Ordnung
  rationale: Das Adverb bezeichnet hier ein geziemendes und geordnetes Auftreten im gottesdienstlichen Zusammenhang; die Wiedergabe wahrt sowohl die Würde als auch den Ordnungsgedanken.
- source_word: ἔστησαν
  choice: stellten sich ... auf
  rationale: Die mediale deutsche Form gibt das Einnehmen einer geordneten Stellung natürlicher wieder als ein bloßes „standen“.
- source_word: τὰ ἄζυμα
  choice: die ungesäuerten Brote
  rationale: Der substantivierte Plural bezeichnet im Passahzusammenhang natürlich ungesäuertes Brot; der deutsche Plural entspricht dabei der griechischen Form.
- source_word: φυλάς
  choice: Stämme
  rationale: Dies ist die übliche und sachlich genaue Bezeichnung für die Stammesgliederung Israels.
- source_word: μεριδαρχίας τῶν πατέρων
  choice: Abteilungen der Vaterhäuser
  rationale: μεριδαρχία bezeichnet gegliederte Abteilungen; der Genitiv τῶν πατέρων weist wahrscheinlich auf die überlieferten Vaterhausverbände. Die knappe griechische Formulierung bleibt in einer Fußnote als Übersetzungsfrage sichtbar.
- source_word: προσενεγκεῖν
  choice: darzubringen
  rationale: Im kultischen Zusammenhang bezeichnet das Verb das Heranbringen beziehungsweise Darbringen einer Gabe; „darbringen“ ist würdig und lässt den Gegenstand des Opfers offen.
- source_word: τῷ κυρίῳ
  choice: dem Herrn
  rationale: κύριος wird unmittelbar als „Herr“ wiedergegeben; der griechische Text, nicht eine rekonstruierte Form des Gottesnamens, ist die Übersetzungsgrundlage.
- source_word: κατὰ τὰ γεγραμμένα ἐν βιβλίῳ Μωυσῆ
  choice: wie es im Buch des Mose geschrieben steht
  rationale: Die Formulierung gibt den Beruf auf die schriftlich überlieferte mosaische Weisung klar und idiomatisch wieder.
- source_word: καὶ οὕτω τὸ πρωϊνόν
  choice: Und so taten sie es am Morgen
  rationale: Der griechische Ausdruck ist elliptisch. Die Ergänzung „taten sie es“ macht den deutschen Satz verständlich, ohne τὸ πρωϊνόν als technischen Ausdruck für ein Morgenopfer festzulegen.
theological_decisions:
- issue: Verhältnis zum abweichenden hebräischen Paralleltext in 2. Chronik 35,10
  choice: Die im griechischen 1. Esra geschilderte Ordnung der Priester und Leviten mit den ungesäuerten Broten bleibt maßgeblich.
  alternative: Den Vers an den hebräischen Bericht über die Bereitstellung von Passahtieren durch levitische Oberste angleichen.
  rationale: Für 1. Esra ist der griechische Text die primäre Quelle. Der nur annähernde hebräische Paralleltext darf die deutlich andere griechische Aussage nicht verdrängen oder harmonisieren.
- issue: Deutung von τῶν πατέρων
  choice: „der Vaterhäuser“ im Haupttext
  alternative: „der Väter“ oder „ihrer Vaterhäuser“
  rationale: Die Formulierung bewahrt die väterlich-ancestrale Sozialstruktur und ergibt zusammen mit „Abteilungen“ verständliches Deutsch, ohne sie geschlechtsneutral einzuebnen.
- issue: Deutung des elliptischen τὸ πρωϊνόν
  choice: als Zeitangabe „am Morgen“
  alternative: als technischer Hinweis auf „das Morgenopfer“
  rationale: Der griechische Wortlaut nennt kein Opfer ausdrücklich. Die zeitliche Wiedergabe wahrt daher die vorhandene Mehrdeutigkeit und vermeidet eine theologische oder kultische Präzisierung über den Text hinaus.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzgliederung wurde gegenüber dem langen griechischen Satz behutsam aufgelöst. Kultische Begriffe bleiben erkennbar, während die elliptische Schlusswendung verständlich, aber nicht als technischer Opferbegriff überdeutet wird.
