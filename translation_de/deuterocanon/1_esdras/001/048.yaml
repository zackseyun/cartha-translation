base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/048.yaml
  text: And the God of their fathers sent by his angel to visit their people and to call them back[b][a], because he had compassion on them and on his dwelling place.
translation:
  language: de
  text: Und der König ihrer Väter, der Gott ihrer Väter, sandte durch seinen Engel[a], um ihr Volk aufzusuchen und sie zurückzurufen, denn er schonte sie und seine Wohnstätte.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „durch seinen Boten“. Das griechische Wort ἄγγελος kann „Engel“ oder „Bote“ bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Der griechische Wortlaut am Satzanfang ist ungewöhnlich und lautet wörtlich: „der König ihrer Väter, der Gott ihrer Väter“. Beide Bezeichnungen wurden im Text beibehalten.'
    reason: textual_variant
lexical_decisions:
- source_word: ὁ βασιλεὺς τῶν πατέρων αὐτῶν ὁ θεὸς τῶν πατέρων αὐτῶν
  choice: der König ihrer Väter, der Gott ihrer Väter
  rationale: Bewahrt die ungewöhnliche doppelte Gottesbezeichnung des überlieferten griechischen Textes als Apposition, statt βασιλεύς stillschweigend zu tilgen oder den Text zu glätten.
- source_word: ἀπέστειλεν
  choice: sandte
  rationale: Entspricht der schlichten Erzählform des Aorists und klingt in würdigem modernem Deutsch natürlich.
- source_word: ἐπισκέψασθαι τὸν λαὸν αὐτῶν
  choice: um ihr Volk aufzusuchen
  rationale: „Aufsuchen“ wahrt den Gedanken eines zugewandten, eingreifenden Besuchs; „ihr Volk“ gibt das ungewöhnliche griechische Possessivpronomen im Plural wieder.
- source_word: διὰ τοῦ ἀγγέλου αὐτοῦ
  choice: seinen Engel
  rationale: Bei göttlicher Sendung ist „Engel“ die naheliegende Wiedergabe; die ebenfalls mögliche Bedeutung „Bote“ wird in einer Fußnote erhalten.
- source_word: μετακαλέσαι αὐτούς
  choice: sie zurückzurufen
  rationale: Gibt die rückholende Bedeutung des zusammengesetzten Verbs im Wiederherstellungskontext wieder, ohne eine ausdrückliche Bekehrungsaussage einzutragen.
- source_word: καθὸ ἐφείδετο αὐτῶν
  choice: denn er hatte Erbarmen mit ihnen
  rationale: φείδομαι kann „schonen“ oder „sich erbarmen“ bedeuten; hier bezeichnet es Gottes fürsorgliche Beweggrundlage gegenüber Volk und Heiligtum.
- source_word: τοῦ σκηνώματος αὐτοῦ
  choice: mit seiner Wohnstätte
  rationale: „Wohnstätte“ wahrt die Grundbedeutung von σκήνωμα und lässt den Bezug auf Gottes heilige Wohnung bestehen, ohne vorschnell „Stiftshütte“ oder „Tempel“ festzulegen.
theological_decisions:
- issue: Die ungewöhnliche doppelte Bezeichnung Gottes am Satzanfang
  choice: 'Beide Wendungen werden als aufeinander bezogene Gottestitel wiedergegeben: „der König ihrer Väter, der Gott ihrer Väter“.'
  alternative: βασιλεύς als Textstörung behandeln und nur „der Gott ihrer Väter“ übersetzen.
  rationale: Der griechische Hauptzeuge enthält beide Wendungen. Ihre Beibehaltung folgt der Quellenpriorität und macht die textliche Schwierigkeit sichtbar, ohne sie durch Konjektur zu beseitigen.
- issue: Bedeutungsumfang von ἄγγελος
  choice: Engel
  alternative: Bote
  rationale: Im Kontext göttlichen Sendens ist „Engel“ wahrscheinlich, doch das griechische Wort entscheidet nicht zwingend zwischen einem himmlischen Engel und einem Boten; die Alternative steht daher in der Fußnote.
- issue: Referenz von σκήνωμα
  choice: Wohnstätte
  alternative: Heiligtum oder Stiftshütte
  rationale: Die allgemeinere Wiedergabe bewahrt die Bildsprache von Gottes Wohnen und vermeidet eine unnötige Festlegung auf eine bestimmte Kultstätte.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht biblischem Ton. Die Syntax wurde lesbar gestaltet, während die ungewöhnliche Gottesbezeichnung, das Pronomen „ihr“ und die Mehrdeutigkeit von ἄγγελος ausdrücklich erhalten bleiben.
