  source_fidelity: Die doppelte, ungewöhnliche Gottesbezeichnung wird zutreffend bewahrt. Die Präpositionalphrase διὰ τοῦ ἀγγέλου αὐτοῦ bezeichnet jedoch das Mittel der Sendung und sollte im Deutschen ausdrücklich mit „durch“ wiedergegeben werden, nicht als direktes Objekt von „sandte“. Für ἐφείδετο mit sowohl dem Volk als auch der Wohnstätte ist „schonte“ die präzisere und im Deutschen idiomatischere Wiedergabe.
  naturalness: Der Satz bleibt in modernem, würdigem Standarddeutsch klar lesbar. „Durch seinen Engel sandte …“ bildet die griechische Konstruktion natürlich ab; „schonte“ vermeidet das etwas unpassende „Erbarmen mit einer Wohnstätte“.
  terminology: „König“, „Gott“, „Engel“, „zurückrufen“ und „Wohnstätte“ sind angemessen. Die Fußnoten erklären die lexikalische Alternative bei ἄγγελος sowie die auffällige überlieferte Doppelbezeichnung transparent.
