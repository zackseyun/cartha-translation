    rationale: φείδομαι kann zwar Mitleid/Erbarmen ausdrücken, meint bei der Verbindung mit Volk und heiliger Wohnstätte besonders naheliegend „schonen“. „Er schonte sie und seine Wohnstätte“ gibt beide Genitivobjekte kohärent wieder.
