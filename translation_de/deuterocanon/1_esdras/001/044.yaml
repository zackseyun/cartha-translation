base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/044.yaml
  text: And he appointed Zedekiah king of Judea and Jerusalem; Zedekiah was twenty-one years old[a], and he reigned eleven years.
translation:
  language: de
  text: Und er setzte Zedekia zum König über Judäa und Jerusalem[a] ein. Zedekia war einundzwanzig Jahre alt und regierte elf Jahre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Griechischen steht „Judäa und Jerusalem“. Die hebräische Parallelüberlieferung hat in diesem Zusammenhang gewöhnlich „Juda und Jerusalem“. Der Haupttext folgt der griechischen Quelle des 1. Esdrasbuches und gleicht sie nicht an die hebräische Parallelüberlieferung an.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνέδειξεν
  choice: setzte … ein
  rationale: Das Verb bezeichnet hier die förmliche Einsetzung in ein Amt; „setzte … ein“ ist im Deutschen natürlich und gibt den königlichen Kontext klar wieder.
- source_word: Σεδεκίαν
  choice: Zedekia
  rationale: Gebräuchliche deutsche Form des Königsnamens.
- source_word: βασιλέα τῆς Ἰουδαίας καὶ Ἰερουσαλήμ
  choice: zum König über Judäa und Jerusalem
  rationale: „Zum König … einsetzen“ entspricht natürlichem deutschem Sprachgebrauch. „Über“ verdeutlicht den Herrschaftsbereich, während „Judäa und Jerusalem“ die griechische Ortsbezeichnung bewahrt.
- source_word: ὄντα ἐτῶν εἴκοσι ἑνός
  choice: war einundzwanzig Jahre alt
  rationale: Idiومatische deutsche Wiedergabe der griechischen Altersangabe.
- source_word: βασιλεύει δὲ ἔτη ἕνδεκα
  choice: und regierte elf Jahre
  rationale: Die präsentische griechische Erzählform wird im deutschen Vergangenheitskontext idiomatisch mit Präteritum wiedergegeben; δέ verbindet hier fortführend.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzteilung vermeidet eine schwerfällige Partizipialkonstruktion; die geografische Form des griechischen Primärtextes bleibt erhalten.
