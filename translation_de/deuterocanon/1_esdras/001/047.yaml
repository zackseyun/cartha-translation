base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/047.yaml
  text: And the leaders of the people and of the priests also committed much impiety and lawlessness[a], beyond all the uncleannesses of all the nations, and they defiled the sanctuary of the Lord[c][b], which had been sanctified in Jerusalem.
translation:
  language: de
  text: Auch die Führenden des Volkes und der Priester handelten vielfach gottlos und gesetzlos, in einem Maß, das alle Unreinheiten sämtlicher Völker übertraf.[a] Sie entweihten das Heiligtum des Herrn[b], das in Jerusalem geweiht ist.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich steht hier eine Wendung des Übertreffens: „über alle Unreinheiten sämtlicher Völker hinaus“. Sie kann das Ausmaß ihres gottlosen und gesetzlosen Handelns bezeichnen.'
    reason: Die ungewöhnliche griechische Vergleichskonstruktion und ihre mögliche Zuordnung sollen erkennbar bleiben.
  - marker: b
    text: 'Oder: „den Tempel des Herrn“. Das griechische Wort ἱερόν kann das Heiligtum oder den Tempelbereich insgesamt bezeichnen.'
    reason: Lexikalische Bedeutungsbreite von ἱερόν.
  - marker: c
    text: 'Wörtlich: „das in Jerusalem geheiligt werdende“ beziehungsweise „das in Jerusalem geheiligt ist“. Die Form kann das Heiligtum als den dort geweihten heiligen Ort kennzeichnen.'
    reason: Die Aspekt- und Zeitbedeutung des griechischen Präsenspartizips ist nicht völlig eindeutig.
lexical_decisions:
- source_word: οἱ ἡγούμενοι
  choice: die Führenden
  rationale: Das substantivierte Partizip bezeichnet diejenigen, die führen oder leiten. „Die Führenden“ bleibt nahe am Griechischen, ohne ein bestimmtes Amt vorauszusetzen.
- source_word: τοῦ λαοῦ καὶ τῶν ἱερέων
  choice: des Volkes und der Priester
  rationale: Die beiden Genitive beziehen die Führenden auf das Volk und auf die Priesterschaft und lassen beide Gruppen ausdrücklich genannt.
- source_word: πολλὰ ἠσέβησαν καὶ ἠνόμησαν
  choice: handelten vielfach gottlos und gesetzlos
  rationale: Die zwei griechischen Verben werden parallel wiedergegeben. „Vielfach“ nimmt πολλά auf; „gottlos“ bewahrt den religiösen und „gesetzlos“ den rechtlich-moralischen Aspekt.
- source_word: ὑπὲρ πάσας τὰς ἀκαθαρσίας πάντων τῶν ἐθνῶν
  choice: übertrafen damit alle Unreinheiten sämtlicher Völker
  rationale: ὑπέρ bezeichnet hier ein Überschreiten oder Übertreffen. „Unreinheiten“ erhält den kultisch-moralischen Klang von ἀκαθαρσίαι; „Völker“ ist im historischen Zusammenhang neutraler als „Heiden“.
- source_word: ἐμίαναν
  choice: sie entweihten
  rationale: Im Zusammenhang mit dem Heiligtum gibt „entweihten“ die kultische Verunreinigung durch μιαίνω natürlich und präzise wieder.
- source_word: τὸ ἱερὸν τοῦ κυρίου
  choice: das Heiligtum des Herrn
  rationale: ἱερόν kann das Heiligtum oder den weiteren Tempelbereich bezeichnen. „Heiligtum“ passt zum kultischen Kontext; κύριος wird entsprechend dem griechischen Text mit „Herr“ wiedergegeben.
- source_word: τὸ ἁγιαζόμενον ἐν Ἰερουσαλήμ
  choice: das in Jerusalem geheiligt ist
  rationale: Die Formulierung bildet das passive Präsenspartizip als gegenwärtige Zustandsbeschreibung ab, ohne es stillschweigend in ein eindeutig abgeschlossenes vergangenes Geschehen umzudeuten.
theological_decisions:
- issue: Wiedergabe von κύριος für Israels Gott
  choice: Herr
  alternative: HERR
  rationale: „Herr“ folgt unmittelbar dem griechischen κύριος und trägt nicht ohne ausdrückliche hebräische Textgrundlage die typografische Wiedergabe des Gottesnamens ein.
- issue: Kultisch-moralischer Sinn von ἀκαθαρσίαι
  choice: Unreinheiten
  alternative: Verunreinigungen
  rationale: „Unreinheiten“ wahrt die Spannung zwischen kultischer und moralischer Bedeutung und verbindet sich sachlich mit der anschließenden Entweihung des Heiligtums.
- issue: Zeitbezug von τὸ ἁγιαζόμενον
  choice: das in Jerusalem geheiligt ist
  alternative: das in Jerusalem geheiligt worden war
  rationale: Das griechische Präsenspartizip lässt sich als charakterisierende beziehungsweise resultative Aussage verstehen. Die Hauptfassung bewahrt dessen Form; die Alternative legt stärker eine abgeschlossene Weihehandlung in der Vergangenheit fest.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die Satzstruktur wurde zur besseren Verständlichkeit in zwei Sätze gegliedert. Kultische Schlüsselbegriffe wie „Unreinheiten“, „entweihten“ und „Heiligtum“ wurden beibehalten; unnötig konfessionell geprägte Terminologie wurde vermieden.
