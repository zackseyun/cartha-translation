base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/001.yaml
  text: And Josiah kept the Passover in Jerusalem to the Lord his God[a], and they slaughtered the Passover on the fourteenth day of the first month,
translation:
  language: de
  text: Und Josia feierte in Jerusalem das Passafest für seinen Herrn[a], und am vierzehnten Tag des ersten Monats schlachteten sie das Passaopfer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Griechisch: „für seinen Herrn“; die hebräische Parallele in 2. Chronik 35,1 lautet: „für den HERRN“.'
    reason: Die Fußnote dokumentiert die bedeutsame Abweichung zwischen dem griechischen Primärtext mit Possessivpronomen und der hebräischen Parallele mit dem Gottesnamen.
lexical_decisions:
- source_word: ἤγαγεν
  choice: feierte
  rationale: Wörtlich bedeutet das Verb „führte/brachte“; zusammen mit πάσχα bezeichnet es hier idiomatisch das Begehen des Passafestes. „Feierte“ ist im heutigen Deutsch natürlich und wird durch die hebräische Parallele ויעשׂ gestützt.
- source_word: τὸ πάσχα (erste Nennung)
  choice: das Passafest
  rationale: Die erste Nennung meint die gesamte Festbegehung; „Passafest“ macht diesen Bezug im Deutschen eindeutig.
- source_word: τῷ κυρίῳ αὐτοῦ
  choice: für seinen Herrn
  rationale: Der griechische Primärtext enthält ausdrücklich das Possessivpronomen αὐτοῦ. Der Dativ wird im kultischen Zusammenhang natürlich mit „für“ wiedergegeben, ohne das im griechischen Text nicht vorhandene „Gott“ einzufügen.
- source_word: ἔθυσαν
  choice: schlachteten
  rationale: Das Verb bezeichnet hier die kultische Schlachtung und entspricht sachlich dem hebräischen וישחטו.
- source_word: τὸ πάσχα (zweite Nennung)
  choice: das Passaopfer
  rationale: Als Objekt von ἔθυσαν bezeichnet πάσχα hier das Opfertier beziehungsweise Passaopfer. „Passaopfer“ wahrt den impliziten Opferbezug, ohne das Tier enger als „Lamm“ zu bestimmen.
- source_word: τῇ τεσσαρεσκαιδεκάτῃ ἡμέρᾳ τοῦ μηνὸς τοῦ πρώτου
  choice: am vierzehnten Tag des ersten Monats
  rationale: Natürliche deutsche Wiedergabe des temporalen Dativs und der anschließenden Genitivverbindung.
theological_decisions:
- issue: Wiedergabe von κύριος bei einer hebräischen Parallele mit dem Gottesnamen JHWH
  choice: Herr
  alternative: HERR
  rationale: Da der griechische Text die primäre Übersetzungsgrundlage ist und κυρίῳ αὐτοῦ („seinem Herrn“) liest, wird nicht die Schreibweise „HERR“ aus der hebräischen Parallele in den Haupttext importiert.
- issue: Zusatz „Gott“ in „der Herr, sein Gott“
  choice: nicht in den Haupttext aufgenommen
  alternative: für den Herrn, seinen Gott
  rationale: Das griechische τοῦ ist ein Possessivpronomen („sein“), kein Wort für „Gott“. Die Erweiterung würde die griechische Lesart verdeutlichen wollen, fügte aber nicht ausdrücklich vorhandenen Inhalt ein.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Passafest“ unterscheidet die Festbegehung von „Passaopfer“ bei der kultischen Schlachtung; der abschließende Satzpunkt ersetzt das fragmentarische Komma des isoliert überlieferten Versauszugs.
