base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/034.yaml
  text: And he fined the nation one hundred talents of silver and one talent of gold[a].
translation:
  language: de
  text: Und er belegte das Volk mit einer Geldstrafe von hundert Talenten Silber und einem Talent Gold.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Und er erlegte dem Volk eine Zahlung von hundert Talenten Silber und einem Talent Gold auf.“ Das griechische Verb kann bedeuten, jemandem einen Verlust zuzufügen oder eine Geldstrafe aufzuerlegen; hier geht es um eine strafweise eingeforderte Zahlung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐζημίωσεν
  choice: belegte … mit einer Geldstrafe
  rationale: Das Verb bezeichnet hier angesichts der genannten Silber- und Goldmengen das Auferlegen einer finanziellen Strafe. Die Formulierung ist im modernen Deutschen natürlich und bewahrt den Strafcharakter.
- source_word: τὸ ἔθνος
  choice: das Volk
  rationale: ἔθνος bezeichnet hier kollektiv die unterworfene Bevölkerung. „Das Volk“ ist in diesem historischen Kontext natürlicher als „die Nation“.
- source_word: ἀργυρίου τάλαντοις ἑκατόν
  choice: von hundert Talenten Silber
  rationale: Die Wendung gibt Höhe und Metall der auferlegten Zahlung an; „Talente“ bleibt als antike Gewichts- und Werteinheit erhalten.
- source_word: χρυσίου ταλάντῳ ἑνί
  choice: und einem Talent Gold
  rationale: Die Wiedergabe wahrt den deutlichen Gegensatz zwischen hundert Talenten Silber und einem Talent Gold.
