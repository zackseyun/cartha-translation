base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/006.yaml
  text: In order[a], sacrifice the Passover, and prepare the sacrifices for your brothers[b], and keep the Passover according to the command of the Lord that was given to Moses.
translation:
  language: de
  text: Opfert das Passa in geordneter Weise[a], bereitet die Opfer für eure Brüder[b] vor und feiert das Passa nach dem Gebot des Herrn, das dem Mose gegeben wurde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »in der rechten Ordnung« oder »nach Rang«. Die Wendung bezeichnet ein geordnetes Vorgehen beziehungsweise eine geordnete Einteilung.'
    reason: lexical_alternative
  - marker: b
    text: Mit »Brüder« sind hier Angehörige des Volkes gemeint, nicht nur leibliche Brüder.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τάξει
  choice: Geordnet
  rationale: Die knappe adverbiale Wendung bezeichnet ein Handeln in geordneter Aufstellung oder Einteilung. „Geordnet“ bewahrt diese Offenheit; der hebräische Paralleltext stützt den Gedanken gegliederter Gruppen.
- source_word: θύσατε τὸ πάσχα
  choice: opfert das Passa
  rationale: θύω ist hier kultisch und bezeichnet das Opfern beziehungsweise Schlachten des Passaopfers. „Das Passa“ lässt wie das Griechische offen, ob vor allem das Opfertier oder das Fest im Blick ist.
- source_word: τὰς θυσίας ἑτοιμάσατε
  choice: bereitet die Opfer … vor
  rationale: Die Wiedergabe ist im Deutschen natürlich und erhält den kultischen Sinn von θυσίαι.
- source_word: τοῖς ἀδελφοῖς ὑμῶν
  choice: für eure Brüder
  rationale: „Brüder“ bildet die maskuline Verwandtschafts- und Gemeinschaftsbezeichnung formal ab; im Kontext sind Angehörige des Volkes gemeint, nicht bloß leibliche Brüder.
- source_word: ποιήσατε τὸ πάσχα
  choice: feiert das Passa
  rationale: ποιεῖν τὸ πάσχα ist eine feste Wendung für das Begehen des Passafestes. „Feiert“ ist im heutigen Deutsch verständlich und unterscheidet diese Handlung vom vorherigen Opfern.
- source_word: κατὰ τὸ πρόσταγμα τοῦ κυρίου
  choice: nach dem Gebot des Herrn
  rationale: πρόσταγμα bezeichnet eine verbindliche Anordnung; κύριος wird entsprechend dem unmittelbar vorliegenden griechischen Text mit „Herr“ wiedergegeben.
- source_word: τὸ δοθὲν τῷ Μωυσῇ
  choice: das Mose gegeben wurde
  rationale: Die Relativkonstruktion gibt das substantivbezogene Partizip direkt wieder und lässt Mose als Empfänger des Gebots erkennen.
theological_decisions:
- issue: Gemeinschaftlicher Umfang von ἀδελφοῖς
  choice: Brüder
  alternative: Angehörige eures Volkes
  rationale: Die Hauptübersetzung wahrt die maskuline Form des griechischen Ausdrucks; eine Fußnote erklärt dessen weiteren gemeinschaftlichen Bezug, ohne ihn im Text einzuengen.
- issue: Wiedergabe von κύριος
  choice: Herr
  alternative: HERR
  rationale: Die primäre Quelle bietet κύριος. Eine Rückübertragung auf den Gottesnamen wäre an dieser Stelle nicht durch den vorliegenden griechischen Wortlaut begründet.
- issue: Bedeutungsumfang von τὸ πάσχα
  choice: das Passa
  alternative: das Passalamm
  rationale: Der Ausdruck kann sowohl das Fest als auch das Passaopfer bezeichnen. Die Übersetzung vermeidet eine unnötige Festlegung und bewahrt die Spannung zwischen „opfern“ und „feiern“.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz bleibt befehlend und kultisch geprägt, wird aber durch geläufige Verben verständlich gehalten. „Passa“ entspricht dem üblichen deutschen Bibelwortschatz.
