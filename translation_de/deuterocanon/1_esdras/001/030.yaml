base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/030.yaml
  text: And throughout all Judea they mourned for Josiah[a]; and Jeremiah the prophet lamented over Josiah, and the leaders together with the women kept lamenting him to this day[b]; and this was ordained to be done forever.
translation:
  language: de
  text: Und in ganz Judäa trauerte man um Josia. Auch der Prophet Jeremia stimmte eine Totenklage über Josia an, und die Vorsteher klagten zusammen mit den Frauen bis zum heutigen Tag um ihn.[a] Es wurde verfügt, dies für alle Zeit zu tun.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die hebräische Parallele in 2. Chronik 35,24–25 berichtet, dass ganz Juda und Jerusalem um Josia trauerten und Jeremia eine Totenklage über ihn anstimmte. 1 Esdras erweitert die Darstellung um die Vorsteher und die Frauen, die „bis zum heutigen Tag“ klagen.
    reason: cross_reference
  - marker: b
    text: 'Oder: „Dies wurde als dauernder Brauch festgesetzt.“ Das griechische Verb kann eine formelle Bekanntgabe, Anordnung oder Festsetzung bezeichnen; die genaue verwaltungsmäßige Bedeutung bleibt offen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ὅλῃ τῇ Ἰουδαίᾳ
  choice: in ganz Judäa
  rationale: Die Wendung bezeichnet den umfassenden räumlichen Bereich. „In ganz Judäa“ ist im Deutschen natürlich und bewahrt den Umfang von ὅλῃ.
- source_word: ἐπένθησαν
  choice: trauerte man
  rationale: πενθέω bezeichnet besonders die Trauer um einen Verstorbenen. Das unpersönliche „man“ gibt das nicht näher bestimmte pluralische Subjekt im Deutschen flüssig wieder.
- source_word: ἐθρήνησεν
  choice: stimmte eine Totenklage … an
  rationale: θρηνέω bezeichnet spezifischer als allgemeines Trauern das Vortragen einer Klage oder eines Klageliedes. „Totenklage“ macht den Zusammenhang deutlich, ohne zwingend eine gesungene Form festzulegen.
- source_word: ὑπὲρ Ἰωσείου
  choice: über Josia
  rationale: ὑπέρ kann im Zusammenhang einer Totenklage „über“ oder „für“ bedeuten. „Eine Totenklage über Josia“ ist idiomatisches Deutsch.
- source_word: οἱ προκαθήμενοι
  choice: die Vorsteher
  rationale: Das Wort bezeichnet Personen, die anderen vorstehen oder eine führende Stellung innehaben. „Vorsteher“ bewahrt diese Bedeutung, ohne ein bestimmtes Amt wie „Älteste“ vorauszusetzen.
- source_word: σὺν γυναιξὶν
  choice: zusammen mit den Frauen
  rationale: σύν bezeichnet Begleitung beziehungsweise gemeinsames Handeln. Die Formulierung erhält die ausdrückliche Beteiligung der Frauen.
- source_word: ἐθρηνοῦσαν
  choice: klagten
  rationale: Der Imperfekt beschreibt eine fortdauernde oder wiederholte Handlung; zusammen mit „bis auf den heutigen Tag“ wird diese Dauer im Deutschen hinreichend deutlich.
- source_word: ἕως τῆς ἡμέρας ταύτης
  choice: bis auf den heutigen Tag
  rationale: Die geläufige deutsche Wendung bewahrt den Bezug auf die Gegenwart des Erzählers.
- source_word: ἐξεδόθη τοῦτο γενέσθαι ἀεί
  choice: Es wurde verfügt, dies für alle Zeit zu tun
  rationale: ἐξεδόθη kann eine formelle Bekanntgabe, Anordnung oder Festsetzung bezeichnen. „Verfügt“ erhält den formellen Charakter, während „für alle Zeit“ die fortdauernde Geltung von ἀεί wiedergibt.
theological_decisions:
- issue: Formeller und dauerhafter Charakter der abschließenden Anordnung
  choice: Es wurde verfügt, dies für alle Zeit zu tun
  alternative: Dies wurde als dauernder Brauch festgesetzt
  rationale: Der griechische Text legt eine formelle und fortgeltende Festsetzung nahe, nennt aber weder den Urheber noch ihre genaue rechtliche oder kultische Form. Die Übersetzung lässt diese Punkte offen und vermeidet es, eine bestimmte liturgische Verpflichtung einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzfolge folgt dem griechischen Aufbau, wird jedoch durch zwei Hauptsätze lesbarer gegliedert. „Totenklage“ unterscheidet θρηνέω vom allgemeineren πενθέω; „Vorsteher“ vermeidet die unbelegte Festlegung auf ein bestimmtes Amt.
