base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/029.yaml
  text: And he got onto his second chariot[a]; and after being brought back to Jerusalem[b], he ended his life and was buried in his ancestral tomb.
translation:
  language: de
  text: Und er stieg auf seinen zweiten Wagen. Nachdem er nach Jerusalem zurückgebracht worden war, verschied er[a] und wurde im Grab seiner Vorfahren bestattet.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „Er wechselte/beendete sein Leben“; die griechische Wendung ist eine Umschreibung für seinen Tod.'
    reason: lexical_alternative
  - marker: b
    text: Die hebräische Parallele in 2. Chronik 35,24 spricht vom „zweiten Wagen“ und fügt hinzu, dass ganz Juda und Jerusalem um Josia trauerten. 1. Esdras ist hier kürzer und verwendet für das Grab die Einzahl.
    reason: cross_reference
lexical_decisions:
- source_word: ἀνέβη ἐπὶ τὸ ἅρμα τὸ δεύτερον αὐτοῦ
  choice: stieg auf seinen zweiten Wagen
  rationale: ἀναβαίνω mit ἐπί bezeichnet hier das Besteigen eines Wagens. „Stieg auf“ bewahrt die Bewegungsrichtung des Griechischen und klingt im Deutschen natürlich; δεύτερον wird attributiv als „zweiten“ wiedergegeben.
- source_word: ἀποκατασταθεὶς εἰς Ἰερουσαλήμ
  choice: nachdem er nach Jerusalem zurückgebracht worden war
  rationale: Das passive Partizip bezeichnet im Zusammenhang nicht bloß eine Rückkehr aus eigener Kraft, sondern dass er nach Jerusalem zurückgebracht wurde.
- source_word: μετήλλαξεν τὸν βίον αὐτοῦ
  choice: verschied er
  rationale: Die griechische Wendung bedeutet idiomatisch, dass er starb. „Verschied“ wahrt den würdevollen, verhüllenden Charakter der Formulierung, ohne im Deutschen den irreführenden Eindruck zu erwecken, er habe sein Leben bewusst beendet.
- source_word: ἐτάφη
  choice: wurde … bestattet
  rationale: Natürliche und würdige Wiedergabe des passiven Bestattungsverbs.
- source_word: ἐν τῷ πατρικῷ τάφῳ
  choice: im Grab seiner Vorfahren
  rationale: πατρικός bezeichnet das den Vätern beziehungsweise Vorfahren zugehörige Grab. Die Einzahl τάφος bleibt durch „Grab“ erhalten, während „seiner Vorfahren“ den familiär-ancestralen Sinn ausdrückt.
