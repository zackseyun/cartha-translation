base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/011.yaml
  text: And they roasted the Passover with fire[a], as was proper, and they boiled the sacrifices in the bronze pots and kettles with a pleasing aroma[b], and brought them to all the people.
translation:
  language: de
  text: Und sie brieten das Passah am Feuer, wie es sich gehörte. Die Opfer kochten sie in den bronzenen Töpfen und Kesseln mit Wohlgeruch[a] und brachten sie allen aus dem Volk[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich bezeichnet die griechische Wendung einen angenehmen Duft oder Wohlgeruch; im Zusammenhang mit Opfern kann dabei der Duft einer Opfergabe anklingen.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „allen, die aus dem Volk waren“. Gemeint sein können besonders die Angehörigen des Volkes im Unterschied zu den Priestern und Leviten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὤπτησαν
  choice: brieten
  rationale: Das Verb bezeichnet hier ausdrücklich das Braten; zusammen mit ἐν πυρί bleibt so die besondere Zubereitung des Passahs erhalten.
- source_word: τὸ πάσχα
  choice: das Passah
  rationale: Die knappe griechische Bezeichnung kann das Passahopfer beziehungsweise die Passahmahlzeit meinen. „Das Passah“ bewahrt diese Offenheit, ohne im Haupttext vorschnell „Passahlamm“ einzusetzen.
- source_word: ἐν πυρί
  choice: über dem Feuer
  rationale: Die Formulierung gibt die Zubereitungsweise in natürlichem Deutsch wieder und entspricht dem Braten am Feuer.
- source_word: ὡς καθήκει
  choice: wie es sich gehörte
  rationale: Dies wahrt den normativen Sinn, ohne festzulegen, ob ausdrücklich eine gesetzliche, rituelle oder herkömmliche Vorschrift gemeint ist.
- source_word: τὰς θυσίας
  choice: die Opfer
  rationale: Der breite Opferbegriff wird beibehalten; eine Einengung auf bestimmte Opferstücke wäre stärker als der griechische Text.
- source_word: ἥψησαν
  choice: kochten
  rationale: Das Verb bezeichnet Kochen, häufig in Flüssigkeit. Die genannten Gefäße stützen diese Bedeutung und unterscheiden die Zubereitung vom vorherigen Braten.
- source_word: ἐν τοῖς χαλκίοις καὶ λέβησιν
  choice: in den bronzenen Töpfen und Kesseln
  rationale: Die Wiedergabe unterscheidet die beiden Gefäßarten und verwendet verständliche moderne Bezeichnungen.
- source_word: μετʼ εὐωδίας
  choice: mit lieblichem Duft
  rationale: Die Wendung bezeichnet wörtlich einen angenehmen Duft oder Wohlgeruch und kann im Opferzusammenhang zugleich kultische Anklänge tragen.
- source_word: ἀπήνεγκαν
  choice: brachten
  rationale: Das Verb bezeichnet das Hin- beziehungsweise Wegtragen. Eine ausdrückliche Übersetzung mit „verteilten“ würde den im Zusammenhang naheliegenden Vorgang stärker ausdeuten.
- source_word: πᾶσι τοῖς ἐκ τοῦ λαοῦ
  choice: zu allen aus dem Volk
  rationale: Diese relativ formnahe Wiedergabe erhält eher als „zum ganzen Volk“ die mögliche Abgrenzung der Empfänger von Priestern und Leviten.
theological_decisions:
- issue: Unterschiedliche Zubereitung von Passah und Opfern
  choice: Das Passah wird „gebraten“, die Opfer werden „gekocht“.
  alternative: Beide Verben allgemein mit „zubereiten“ oder „kochen“ wiedergeben.
  rationale: Der griechische Text verwendet bewusst verschiedene Verben. Ihre Unterscheidung bewahrt die rituelle Einzelheit, ohne sie lehrmäßig auszubauen.
- issue: Bedeutungsumfang von τὸ πάσχα
  choice: „das Passah“
  alternative: „das Passahlamm“ oder „das Passahopfer“
  rationale: Im Zusammenhang ist ein Opfer beziehungsweise dessen Fleisch gemeint; die griechische Kurzbezeichnung lässt den genauen Bezug jedoch unausgesprochen. Die Übersetzung bewahrt diese Spannung.
- issue: Empfängerkreis von πᾶσι τοῖς ἐκ τοῦ λαοῦ
  choice: „zu allen aus dem Volk“
  alternative: „zum ganzen Volk“ oder „zu allen Laien“
  rationale: Die Formulierung kann die nichtpriesterliche Bevölkerung von den amtierenden Priestern und Leviten unterscheiden. Der Haupttext lässt diese mögliche Abgrenzung bestehen, ohne den späteren Fachbegriff „Laien“ einzuführen.
- issue: Opferbezogener Klang von εὐωδία
  choice: „mit lieblichem Duft“
  alternative: „mit Wohlgeruch“ oder eine bloß adverbiale Wiedergabe wie „sorgfältig“
  rationale: Die sinnliche Bedeutung des angenehmen Duftes und ihr möglicher kultischer Anklang bleiben erhalten, ohne ausdrücklich zu behaupten, der Duft werde hier als Gott wohlgefällig bezeichnet.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzteilung erleichtert das Verständnis, während die Abfolge des griechischen Textes erhalten bleibt. „Passah“ bewahrt die traditionelle biblische Bezeichnung und die Mehrdeutigkeit des Ausgangstextes; die beiden Zubereitungsverben bleiben klar unterschieden.
