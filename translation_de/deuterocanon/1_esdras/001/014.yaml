  to: Auch die Tempelsänger, die Söhne Asafs, standen an ihren Plätzen nach den Anordnungen Davids. Asaf, Sacharja und Eddinus kamen vom König.[a][b]
  rationale: Die Revision stellt David eindeutig als denjenigen dar, dessen Anordnungen befolgt werden, und ordnet die drei genannten Personen dem anschließenden, elliptischen Ausdruck οἱ παρὰ τοῦ βασιλέως zu. „Kamen vom König“ ist eine idiomatische knappe Wiedergabe, die keine bestimmte Art des königlichen Verhältnisses festlegt; die Fußnote wahrt die verbleibende Mehrdeutigkeit. Die Fußnotenanker bleiben erhalten.
