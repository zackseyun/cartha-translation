base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/014.yaml
  text: And the temple singers[a], the sons of Asaph, were at their stations according to what had been appointed by David, and Asaph and Zechariah and Eddinous[b], who were from the king.
translation:
  language: de
  text: Auch die Tempelsänger, die Söhne Asafs, standen an ihren Plätzen nach den Anordnungen Davids. Asaf, Sacharja und Eddinus kamen vom König.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »die vom König her waren«. Die knappe griechische Formulierung kann eine Beauftragung durch den König oder eine Zugehörigkeit zu seinem Dienst bezeichnen.'
    reason: alternative_reading
  - marker: b
    text: Der hier angeführte ungefähre hebräische Paralleltext behandelt an dieser Stelle die Verteilung des Brandopfers. 1 Esdras überliefert dagegen eine erweiterte Notiz über die Sänger und nennt mehrere Personen.
    reason: cross_reference
lexical_decisions:
- source_word: ἱεροψάλται
  choice: Tempelsänger
  rationale: Das Kompositum bezeichnet Sänger im Tempelkult. »Tempelsänger« ist im modernen Deutschen natürlich und gibt den sakralen Zusammenhang klar wieder.
- source_word: υἱοὶ Ἀσάφ
  choice: die Söhne Asafs
  rationale: Die formale Wendung bezeichnet hier die anerkannte Sängergruppe beziehungsweise Gilde, die auf Asaf zurückgeführt wurde.
- source_word: ἐπὶ τῆς τάξεως αὐτῶν
  choice: an ihren zugewiesenen Plätzen
  rationale: τάξις bezeichnet in diesem gottesdienstlichen Zusammenhang die geordnete Stellung oder Aufgabe. Die Wiedergabe macht die funktionale Einteilung verständlich.
- source_word: κατὰ τὰ ὑπὸ Δαυεὶδ τεταγμένα
  choice: entsprechend den Anordnungen Davids
  rationale: τεταγμένα bezeichnet festgelegte oder angeordnete Regelungen; die Formulierung wahrt Davids Rolle als Urheber der Ordnung.
- source_word: καὶ Ἀσὰφ καὶ Ζαχαρίας καὶ Ἐδδεινοὺς
  choice: sowie Asafs, Secharjas und Eddinus’
  rationale: Die Namen werden als weitere Urheber der Anordnungen verstanden; die griechische Reihung nach τεταγμένα ist knapp und leicht elliptisch. »Secharja« folgt der üblichen deutschen Namensform, während »Eddinus« die überlieferte griechische Form eng wiedergibt.
- source_word: οἱ παρὰ τοῦ βασιλέως
  choice: die im Auftrag des Königs handelten
  rationale: παρά mit Genitiv bezeichnet eine Beziehung oder Herkunft vom König. »Im Auftrag des Königs« ist idiomatisches Deutsch, ohne die knappe griechische Wendung als eindeutiges Amtsverhältnis auszugeben; die wörtlichere Möglichkeit wird in der Fußnote genannt.
theological_decisions:
- issue: Zuordnung von Asaf, Secharja und Eddinus zur vorangehenden Anordnung
  choice: Die Namen werden zusammen mit David als Urheber beziehungsweise Träger der Anordnungen verstanden.
  alternative: Die Anordnung wird allein David zugeschrieben; Asaf, Secharja und Eddinus werden anschließend als gesonderte königliche Beauftragte genannt.
  rationale: Die griechische Syntax ist gedrängt. Die Fortsetzung mit καί erlaubt eine elliptische Koordination der Namen mit David, doch die alternative Gliederung bleibt möglich und wird nicht zu einer theologischen Aussage ausgebaut.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die kultische Funktion wird klar benannt, während die gedrängte griechische Syntax und die mehrdeutige Beziehung zum König durch eine idiomatische Haupttextfassung mit erklärender Fußnote transparent bleiben.
