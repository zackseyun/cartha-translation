base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/054.yaml
  text: And they were servants to him and to his sons until the Persians came to reign, to fulfill the word of the Lord by the mouth of Jeremiah.
translation:
  language: de
  text: Und sie waren ihm und seinen Söhnen dienstbar, bis die Perser zur Herrschaft kamen, zur Erfüllung des Wortes des Herrn, das durch Jeremia ergangen war.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παῖδες
  choice: mussten … dienen
  rationale: Im Zusammenhang der Unterwerfung bezeichnet παῖδες Menschen im Dienst des Königs, nicht leibliche Kinder. Die verbale Wiedergabe ist im Deutschen natürlich und lässt den genauen rechtlichen Status offen.
- source_word: μέχρι οὗ βασιλεῦσαι Πέρσας
  choice: bis die Perser zur Herrschaft kamen
  rationale: Die Konstruktion bezeichnet den Beginn der persischen Herrschaft. Diese Wiedergabe macht den politischen Machtwechsel klar, ohne mehr auszusagen als der griechische Text.
- source_word: εἰς ἀναπλήρωσιν
  choice: damit … erfüllt wurde
  rationale: Die Wendung kann Ziel beziehungsweise Ergebnis ausdrücken. Der deutsche Finalsatz gibt diesen Zusammenhang knapp und idiomatisch wieder.
- source_word: τοῦ ῥήματος τοῦ κυρίου
  choice: das Wort des Herrn
  rationale: ῥῆμα meint hier den prophetischen Ausspruch Gottes. „Wort des Herrn“ ist die geläufige und sachlich passende Wiedergabe.
- source_word: ἐν στόματι Ἰερεμίου
  choice: das durch Jeremia ergangen war
  rationale: Die Formulierung bewahrt Jeremia als Vermittler des göttlichen Wortes, vermeidet jedoch das im heutigen Deutsch schwerfällige „im Mund Jeremias“.
theological_decisions:
- issue: Wiedergabe von κύριος
  choice: Herr
  alternative: HERR
  rationale: Übersetzt wird der griechische Text mit κύριος. Daher steht „Herr“, auch wenn der prophetische Hintergrund letztlich auf den Gottesnamen im Hebräischen zurückgehen kann.
- issue: Verhältnis zum hebräischen Paralleltext
  choice: Der griechische Text wird als Aussage über den Dienst bis zum Beginn der persischen Herrschaft übersetzt.
  alternative: Angleichung an den angegebenen MT-Paralleltext über die nach Babylon gebrachten Tempelgeräte
  rationale: Der angegebene hebräische Paralleltext entspricht dem vorliegenden griechischen Vers inhaltlich nicht und ist ausdrücklich nur als ungefährer Parallelzeuge gekennzeichnet. Für 1 Esdras bleibt daher der griechische Text maßgeblich.
- issue: Ziel oder Ergebnis der Erfüllungsaussage
  choice: damit das Wort … erfüllt wurde
  alternative: sodass das Wort … erfüllt wurde
  rationale: εἰς ἀναπλήρωσιν kann Ziel und Ergebnis verbinden. „Damit“ folgt der üblichen teleologischen Ausdrucksweise biblischer Erfüllungsaussagen, ohne die geschichtliche Verwirklichung auszuschließen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz bleibt für heutige Leser verständlich; die prophetische Formel wird natürlich wiedergegeben, ohne konfessionelle Zusätze oder eine Angleichung an den abweichenden hebräischen Paralleltext.
