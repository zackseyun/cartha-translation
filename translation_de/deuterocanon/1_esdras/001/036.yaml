  terminology: „Jojakim“ ist die übliche deutsche biblische Namensform. „Zarios“ folgt der vorliegenden griechischen Namensform. „Fesselte“ bewahrt die konkrete Bedeutung von ἔδησεν, ohne Haftbedingungen zu behaupten.
