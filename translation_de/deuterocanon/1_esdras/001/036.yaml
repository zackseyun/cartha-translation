base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/036.yaml
  text: And he bound Jehoiakim’s nobles[a], and after seizing Zarius his brother[b], he brought him up from Egypt.
translation:
  language: de
  text: Und er fesselte Jojakims führende Männer; Zarios aber, seinen Bruder, ergriff er und führte ihn aus Ägypten herauf.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Name Jojakim ist nicht flektiert. Die Wortgruppe kann daher formal auch als „Jojakim fesselte die führenden Männer“ verstanden werden. Im Zusammenhang und nach der naheliegenden Verbindung mit „führende Männer“ ist jedoch gemeint: „Jojakims führende Männer.“ Auch der Bezug von „seinen Bruder“ bleibt im Griechischen knapp.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἔδησεν
  choice: ließ … fesseln
  rationale: Das Verb δέω bezeichnet konkret das Binden oder Fesseln. Die deutsche Wendung bewahrt diese Bedeutung, ohne eine bestimmte Art der Haft hinzuzufügen.
- source_word: Ἰωακεὶμ τοὺς μεγιστᾶνας
  choice: Jojakim und die führenden Männer
  rationale: Ἰωακείμ wird im Zusammenhang als erstes Objekt des ägyptischen Königs verstanden; τοὺς μεγιστᾶνας bezeichnet die führenden oder ranghöchsten Männer. Das im Griechischen fehlende Bindewort wird im Deutschen zur verständlichen Wiedergabe der gedrängten Konstruktion ergänzt.
- source_word: τοὺς μεγιστᾶνας
  choice: die führenden Männer
  rationale: μεγιστᾶνες sind hochgestellte, einflussreiche Männer. „Die führenden Männer“ ist natürliches modernes Deutsch und legt keinen erblichen Adelsstand nahe.
- source_word: Ζάριον
  choice: Zarios
  rationale: Der Name wird aus der griechischen Akkusativform Ζάριον mit der erschlossenen Nominativform Ζάριος ins Deutsche übertragen.
- source_word: συλλαβών
  choice: nahm er fest
  rationale: συλλαμβάνω bedeutet hier ergreifen oder in Gewahrsam nehmen. „Festnehmen“ gibt den Vorgang idiomatisch wieder, ohne ein förmliches Gerichtsverfahren vorauszusetzen.
- source_word: ἀνήγαγεν
  choice: brachte ihn … herauf
  rationale: ἀνάγω enthält eine Aufwärtsrichtung. „Heraufbringen“ bewahrt diese in biblisch-geografischen Reiseangaben übliche Nuance.
- source_word: ἐξ Αἰγύπτου
  choice: aus Ägypten
  rationale: Die Präposition ἐκ bezeichnet den Ausgangspunkt beziehungsweise die Bewegung aus einem Gebiet heraus.
theological_decisions:
- issue: Subjekt und Objekte in der gedrängten Satzkonstruktion
  choice: Der aus dem Zusammenhang erschlossene ägyptische König bleibt durch „er“ Subjekt; Jojakim und die führenden Männer werden als seine Objekte wiedergegeben.
  alternative: 'Ἰωακείμ als Subjekt auffassen: „Und Jojakim ließ die führenden Männer fesseln.“'
  rationale: Die griechische Wortfolge ist wegen der undeklinierten Namensform mehrdeutig. Der weitere Erzählzusammenhang spricht dafür, dass der ägyptische König handelt und Jojakim betroffen ist. Die Fußnote bewahrt die grammatische Alternative, statt die Spannung zu verschweigen.
- issue: Bezug von αὐτοῦ in τὸν ἀδελφὸν αὐτοῦ
  choice: „dessen Bruder“ bezieht sich auf Jojakim.
  alternative: „seinen Bruder“ mit Bezug auf das handelnde Subjekt
  rationale: Der nächstliegende sachliche Bezug ist Jojakim; „dessen“ macht diesen Bezug im Deutschen deutlich, ohne Zarios zum Bruder des ägyptischen Königs zu erklären.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Führende Männer“ ist allgemein verständlicher als „Magnaten“ und weniger standesspezifisch als „Adlige“. „Herauf“ erhält die Richtungsnuance des griechischen Verbs.
