revisions:
- from: Was aber über ihn, seine Unreinheit und seine Gottlosigkeit berichtet wurde,[a] steht im Buch der Chronik der Könige geschrieben.
  to: Was über ihn und über seine Unreinheit und Gottlosigkeit berichtet wurde,[a] ist im Buch der Chroniken der Könige verzeichnet.
