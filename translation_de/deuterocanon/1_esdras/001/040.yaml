base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/040.yaml
  text: The recorded accounts concerning him, and his uncleanness and impiety, are written in the book of the chronicles of the kings.
translation:
  language: de
  text: Was über ihn und über seine Unreinheit und Gottlosigkeit berichtet wurde,[a] ist im Buch der Chroniken der Könige verzeichnet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „aufgezeichnet wurde“. Das griechische Wort kann sowohl das Berichten als auch das schriftliche Festhalten bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἱστορηθέντα
  choice: berichtet wurde
  rationale: Das substantivierte Partizip bezeichnet das, was über ihn erzählt beziehungsweise schriftlich festgehalten wurde. Die Formulierung bleibt im Deutschen natürlich und bewahrt beide möglichen Nuancen.
- source_word: ἀκαθαρσίας
  choice: Unreinheit
  rationale: „Unreinheit“ erhält die moralisch-religiöse Schärfe des Ausdrucks, ohne ihn ausschließlich auf kultische Unreinheit festzulegen.
- source_word: δυσσεβείας
  choice: Gottlosigkeit
  rationale: Der Ausdruck bezeichnet mangelnde Ehrfurcht beziehungsweise fehlende Frömmigkeit gegenüber Gott. „Gottlosigkeit“ ist im modernen Deutsch verständlich und deutlich.
- source_word: ἀναγέγραπται
  choice: steht … geschrieben
  rationale: 'Die deutsche Wendung gibt den perfektischen Sinn wieder: Das Genannte wurde niedergeschrieben und ist weiterhin dokumentiert.'
- source_word: βίβλῳ τῶν χρόνων τῶν βασιλέων
  choice: Buch der Chronik der Könige
  rationale: Die Wendung bezeichnet ein königliches Annalen- oder Chronikbuch; diese Wiedergabe erhält die archivalische Formel und klingt würdig.
theological_decisions:
- issue: Moralisch-religiöse Charakterisierung durch ἀκαθαρσίας καὶ δυσσεβείας
  choice: Unreinheit und Gottlosigkeit
  alternative: Unreinheit und Frevelhaftigkeit
  rationale: Beide griechischen Begriffe werden als eigenständige Vorwürfe bewahrt und nicht zu einem allgemeinen Urteil zusammengezogen. „Gottlosigkeit“ macht den religiösen Bezug des zweiten Begriffs verständlich, ohne eine konfessionelle Deutung einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung mit vorangestelltem „Was aber …“ bildet die griechische Themenkonstruktion natürlich nach; die traditionelle Archivformel „steht … geschrieben“ wahrt den dokumentarischen Ton.
