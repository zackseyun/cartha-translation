  source_fidelity: Die griechische Konstruktion τὰ ... ἱστορηθέντα περὶ αὐτοῦ καὶ τῆς αὐτοῦ ἀκαθαρσίας καὶ δυσσεβείας bezieht das Berichtete auf den König und auf seine Unreinheit und Gottlosigkeit. Die deutsche Fassung sollte diesen Bezug ohne die syntaktische Unklarheit der eingeschobenen Reihung ausdrücken. βίβλος τῶν χρόνων τῶν βασιλέων verlangt zudem eine pluralische Chronik-/Annalenbezeichnung.
  naturalness: „Buch der Chronik der Könige“ klingt im heutigen Standarddeutsch sowohl idiomatisch als auch numerisch weniger passend. „Buch der Chroniken der Könige“ ist natürlich, verständlich und bewahrt den archivischen Ton. Die Umstellung zu einem klaren Relativsatz ergibt einen flüssigen Satz.
  terminology: „Unreinheit“ und „Gottlosigkeit“ geben ἀκαθαρσία und δυσσέβεια differenziert und angemessen wieder. „Verzeichnet“ gibt ἀναγέγραπται als fortgeltenden schriftlichen Eintrag wieder, ohne die Nuance von ἱστορηθέντα mit dem nachfolgenden Verb zu vermischen.
  issues:
  - severity: medium
    issue: „Buch der Chronik der Könige“ gibt den pluralischen Ausdruck τῶν χρόνων nur unzureichend wieder.
    rationale: Die griechische Formel bezeichnet ein Buch der Chroniken bzw. Annalen der Könige. Im Deutschen ist der Plural „Chroniken“ hier die klare und übliche Entsprechung.
  - severity: low
    issue: Die bisherige Wortstellung lässt den syntaktischen Bezug von „berichtet wurde“ zu „seine Unreinheit und seine Gottlosigkeit“ unnötig verschwimmen.
    rationale: Der griechische Text nennt das Berichtete bezüglich des Königs und seiner Unreinheit und Gottlosigkeit. Eine explizite Wiederholung von „über“ bildet diese Struktur klarer ab.
  revised_text: Was über ihn und über seine Unreinheit und Gottlosigkeit berichtet wurde,[a] ist im Buch der Chroniken der Könige verzeichnet.
