base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/051.yaml
  text: But he handed everything over into their hands. And after taking all the holy vessels of the Lord, the great and the small, and the chests of the Lord and the royal storehouses, they carried them away to Babylon.
translation:
  language: de
  text: Doch er gab alles in ihre Hände. Sie nahmen alle heiligen Geräte des Herrn, die großen wie die kleinen, dazu die Truhen des Herrn und die königlichen Vorratskammern und brachten sie nach Babylon.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρέδωκεν εἰς τὰς χεῖρας αὐτῶν
  choice: gab alles in ihre Hände
  rationale: Bewahrt das griechische Handlungsbild und bleibt in modernem Deutsch verständlich; das Subjekt bleibt wie im Kontext männlich und unausgesprochen bestimmt.
- source_word: ἱερὰ σκεύη
  choice: heiligen Geräte
  rationale: „Geräte“ ist die übliche sachgerechte Bezeichnung für kultische Gefäße und Gegenstände und schränkt den Ausdruck nicht auf Gefäße ein.
- source_word: τὰ μεγάλα καὶ τὰ μικρά
  choice: die großen wie die kleinen
  rationale: Gibt die umfassende Gegenüberstellung idiomatisch wieder.
- source_word: κιβωτούς
  choice: Truhen
  rationale: Der Plural bezeichnet hier transportierbare Behältnisse; „Truhen“ bewahrt den konkreten Sinn, ohne sie als Schatzkammern umzudeuten.
- source_word: βασιλικὰς ἀποθήκας
  choice: königlichen Vorratskammern
  rationale: ἀποθήκη bezeichnet Lager- oder Vorratsräume; diese Wiedergabe unterscheidet sie klar von den zuvor genannten Truhen.
- source_word: ἀπήνεγκαν εἰς Βαβυλῶνα
  choice: brachten alles nach Babylon
  rationale: Natürliches Deutsch für das Wegschaffen an einen Zielort; „alles“ macht den im Griechischen aus der Aufzählung erschließbaren Gesamtbezug deutlich.
theological_decisions:
- issue: Referenz von κύριος
  choice: Herr
  alternative: HERR/JHWH
  rationale: Der griechische Haupttext hat κύριος ohne ausdrücklichen Gottesnamen; „Herr“ folgt diesem Befund, ohne eine besondere Wiedergabe des Tetragramms zu importieren.
- issue: Deutung von κιβωτοί
  choice: konkrete Truhen des Herrn
  alternative: Schatzkammern des Herrn
  rationale: Die konkrete Behälterbedeutung wird bewahrt und nicht mit den unmittelbar folgenden königlichen Lagerräumen verschmolzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzführung. Die parataktische Eröffnung des Griechischen bleibt erhalten; das Partizip ἀναλαβόντες wird zugunsten eines natürlichen deutschen Hauptsatzes wiedergegeben.
