  - severity: low
    issue: Fußnote sprachlich und lexikalisch präzisieren
    rationale: „Das ... Verb kann auch ‚wiederherstellen‘ bedeuten“ dokumentiert die relevante Alternative klarer als „kann sonst auch ... ‚wieder einsetzen‘ bedeuten“. Die kontextuelle Absetzungsdeutung bleibt ausdrücklich erhalten.
