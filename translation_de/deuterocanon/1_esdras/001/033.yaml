base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/033.yaml
  text: And he reigned over Israel and Jerusalem for three months[a]; and the king of Egypt deposed him from reigning in Jerusalem[b],
translation:
  language: de
  text: Und er regierte drei Monate lang über Israel und Jerusalem; und der König von Ägypten setzte ihn als König in Jerusalem ab.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das mit »setzte ihn … ab« wiedergegebene griechische Verb kann auch »wiederherstellen« bedeuten; der Erzählzusammenhang weist hier jedoch auf seine Absetzung hin.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐβασίλευσεν ἐν Ἰσραὴλ καὶ Ἰερουσαλήμ
  choice: er regierte … über Israel und Jerusalem
  rationale: βασιλεύω bezeichnet hier die Ausübung der Königsherrschaft. Das griechische ἐν wird mit »über« wiedergegeben, weil dies im Deutschen bei einem Herrschaftsgebiet idiomatisch ist; »Israel und Jerusalem« bleibt gemäß dem griechischen Primärtext erhalten.
- source_word: μῆνας τρεῖς
  choice: drei Monate lang
  rationale: Die Ergänzung »lang« drückt die Zeitdauer im Deutschen natürlich und genau aus.
- source_word: ἀπεκατέστησεν αὐτὸν … βασιλεύειν
  choice: setzte ihn … als König … ab
  rationale: Obwohl ἀποκαθίστημι gewöhnlich »wiederherstellen« bedeuten kann, verlangt der Erzählzusammenhang hier den privativ verstandenen Sinn einer Absetzung. Die deutsche Formulierung gibt die Beendigung seiner Königsherrschaft knapp und klar wieder.
- source_word: βασιλεὺς Αἰγύπτου
  choice: der König von Ägypten
  rationale: Transparente und natürliche Wiedergabe des griechischen Titels.
- source_word: ἐν Ἰερουσαλήμ
  choice: in Jerusalem
  rationale: Die Ortsangabe wird unmittelbar und idiomatisch wiedergegeben.
theological_decisions:
- issue: Bedeutung von ἀπεκατέστησεν mit βασιλεύειν
  choice: Der König von Ägypten setzte ihn ab und beendete damit seine Herrschaft in Jerusalem.
  alternative: Der König von Ägypten stellte ihn wieder her beziehungsweise setzte ihn ein, damit er in Jerusalem regiere.
  rationale: Die lexikalisch mögliche Bedeutung »wiederherstellen« passt nicht zum unmittelbaren historischen Erzählzusammenhang nach der dreimonatigen Herrschaft. Da die griechische Form dennoch ungewöhnlich ist, wird die echte lexikalische Alternative in einer Fußnote offengelegt.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die Satzverbindung mit »dann« macht die zeitliche Abfolge natürlich verständlich. Die ungewöhnliche griechische Wortwahl bei der Absetzung wird nicht verschwiegen, sondern in der Fußnote dokumentiert.
