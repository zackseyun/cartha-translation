base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/013.yaml
  text: For the priests were offering up the fat until evening[a], and the Levites prepared for themselves and for the priests, their brothers, the sons of Aaron.
translation:
  language: de
  text: Denn die Priester brachten das Fett bis zum Abend als Opfer dar,[a] und die Leviten bereiteten für sich selbst und für die Priester, ihre Brüder, die Söhne Aarons, vor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »das Fett«. Gemeint ist das Opferfett, das auf dem Altar dargebracht wurde.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέφερον
  choice: brachten … als Opfer dar
  rationale: Im Opferkontext bezeichnet ἀναφέρω das Darbringen auf dem Altar. Die fortdauernde Handlung des Imperfekts wird zusammen mit »bis zum Abend« im Deutschen hinreichend deutlich.
- source_word: τὰ στέατα
  choice: das Fett
  rationale: στέαρ bezeichnet hier das für den Altar bestimmte Opferfett. Die knappe Wiedergabe bewahrt die Ausdrucksweise des Griechischen; eine Fußnote erläutert den kultischen Sinn.
- source_word: ἕως ὀψίας
  choice: bis zum Abend
  rationale: Dies ist die direkte und natürliche Wiedergabe der zeitlichen Grenze, ohne die Bedeutung zu »bis in die Nacht« zu erweitern.
- source_word: ἡτοίμασαν
  choice: bereiteten … alles vor
  rationale: Das Verb bedeutet »bereiteten vor«; sein Gegenstand bleibt im Griechischen unausgesprochen. Das deutsche »alles« fungiert nur als idiomatische Ergänzung und legt nicht fest, ob Speisen oder Anteile gemeint sind.
- source_word: ἑαυτοῖς
  choice: für sich selbst
  rationale: Die reflexive Dativform wird ausdrücklich wiedergegeben und den weiteren Empfängern gegenübergestellt.
- source_word: τοῖς ἱερεῦσιν ἀδελφοῖς αὐτῶν
  choice: für die Priester, ihre Brüder
  rationale: Die appositionelle Struktur und die ausdrücklich männliche Verwandtschafts- beziehungsweise Gemeinschaftsbezeichnung bleiben erhalten.
- source_word: υἱοῖς Ἀαρών
  choice: die Söhne Aarons
  rationale: Die traditionelle priesterliche Bezeichnung wird formal und eindeutig wiedergegeben.
theological_decisions:
- issue: Bedeutung von ἀδελφοῖς im levitisch-priesterlichen Zusammenhang
  choice: ihre Brüder
  alternative: ihre Verwandten / ihre Mitbrüder
  rationale: Das Griechische verwendet ausdrücklich den männlichen Verwandtschaftsbegriff. Die Übersetzung bewahrt die familiäre beziehungsweise stammesbezogene Sprache, ohne sie konfessionell auszudeuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau folgt dem griechischen Zusammenhang, wird aber idiomatisch geglättet. Das etwas missverständliche »ihre Brüder« bleibt wegen der ausdrücklichen Quellenformulierung erhalten; »die Söhne Aarons« erläutert appositionell, wer mit den Priestern gemeint ist.
