base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/043.yaml
  text: And after a year[a], Nebuchadnezzar sent and brought him away to Babylon, together with the holy vessels of the Lord,
translation:
  language: de
  text: Ein Jahr später sandte Nebukadnezar aus und brachte ihn zusammen mit den heiligen Gefäßen des Herrn nach Babylon[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »führte ihn nach Babylon weg« beziehungsweise »verschleppte ihn nach Babylon«.'
    reason: Das griechische Verb kann allgemein die Überführung an einen anderen Ort, im Zusammenhang aber auch eine gewaltsame Wegführung oder Deportation bezeichnen.
lexical_decisions:
- source_word: μετ᾽ ἐνιαυτόν
  choice: Ein Jahr später
  rationale: Die Wendung bezeichnet einen Zeitpunkt nach Ablauf eines Jahres. »Ein Jahr später« ist im modernen deutschen Erzählstil natürlich und inhaltlich eng am Griechischen.
- source_word: ἀποστείλας
  choice: sandte … Männer aus
  rationale: Das Partizip bedeutet »nachdem er ausgesandt hatte«. Da das griechische Objekt unausgesprochen bleibt, macht »Männer« die im Deutschen notwendige Vorstellung von Beauftragten knapp deutlich, ohne bestimmte Personen zu behaupten.
- source_word: μετήγαγεν αὐτόν
  choice: ließ ihn … nach Babylon bringen
  rationale: Das Verb bezeichnet die Verbringung oder Überführung an einen anderen Ort. Die Konstruktion mit »ließ« gibt im Zusammenhang mit dem zuvor genannten Aussenden natürlich wieder, dass Nebukadnezar die Maßnahme veranlasste; das Pronomen »ihn« bleibt entsprechend dem griechischen Text erhalten.
- source_word: ἅμα τοῖς ἱεροῖς σκεύεσιν
  choice: zusammen mit den heiligen Gefäßen
  rationale: ἅμα bezeichnet hier Begleitung; ἱερά σκεύη sind heilige beziehungsweise geweihte Gefäße. Die Wiedergabe vermeidet die kontextuell mögliche, aber im Wortlaut nicht ausdrückliche Präzisierung »Tempelgefäße«.
- source_word: τοῦ κυρίου
  choice: des Herrn
  rationale: Der griechische Genitiv ist possessiv. κύριος wird gemäß dem griechischen Primärtext als »Herr« wiedergegeben.
theological_decisions:
- issue: Wiedergabe von κύριος im deuterokanonischen Geschichtsbericht
  choice: Herr
  alternative: HERR
  rationale: Der maßgebliche griechische Text hat κυρίου und schreibt an dieser Stelle nicht ausdrücklich den hebräischen Gottesnamen. Daher wird die griechische Form mit »Herr« wiedergegeben, ohne aus einer möglichen hebräischen Vorlage »HERR« einzutragen.
translation_notes:
  register: Moderner, würdiger Erzählstil. Der Satzschluss mit Komma bleibt erhalten, da der vorgelegte Vers syntaktisch in den folgenden Zusammenhang weiterführt. Die königliche Veranlassung wird idiomatisch mit »ließ … bringen« ausgedrückt; die im Griechischen unausgesandten Beauftragten werden zurückhaltend als »Männer« bezeichnet.
