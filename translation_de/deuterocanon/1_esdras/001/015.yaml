base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/015.yaml
  text: And the gatekeepers were at each gate; no one could leave his own appointed duty[a], for their brothers the Levites had prepared for them.
translation:
  language: de
  text: Und die Torhüter standen an jedem Tor. Keiner konnte seinen eigenen eingeteilten Dienst verlassen, denn ihre Brüder, die Leviten, hatten für sich selbst Vorbereitungen getroffen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „hatten für sich selbst vorbereitet“. Das Reflexivpronomen bezieht sich formal auf die Leviten. Im Zusammenhang kann jedoch gemeint sein, dass sie die nötigen Vorbereitungen für die Torhüter trafen, damit diese ihren eingeteilten Dienst nicht verlassen mussten.'
    reason: Bewahrt die formale, im Zusammenhang schwierige reflexive Lesart und nennt die mögliche kontextuelle Deutung, ohne sie im Haupttext festzulegen.
lexical_decisions:
- source_word: θυρωροὶ
  choice: Torhüter
  rationale: Bezeichnet im Tempelzusammenhang diejenigen, die die Tore bewachen; „Torhüter“ ist im Deutschen klar und idiomatisch.
- source_word: ἐφʼ ἑκάστου πυλῶνος
  choice: an jedem Tor
  rationale: Gibt die örtliche Zuweisung und den distributiven Sinn von ἑκάστου natürlich wieder.
- source_word: οὐκ ἔστιν παραβῆναι
  choice: durfte … nicht verlassen
  rationale: Das griechische Verb bedeutet wörtlich etwa „beiseitetreten/abweichen“; im Zusammenhang ist das Verlassen des zugewiesenen Dienstes gemeint. „Durfte nicht“ gibt die dienstliche Bindung natürlicher wieder als eine Aussage über bloße Unfähigkeit.
- source_word: ἕκαστον τὴν ἑαυτοῦ ἐφημερίαν
  choice: Keiner … seinen eigenen Dienst
  rationale: ἐφημερία bezeichnet einen festgelegten turnusmäßigen Dienst. „Dienst“ ist würdig und verständlich; „Keiner“ bildet die distributive Aussage idiomatisch ab.
- source_word: οἱ γὰρ ἀδελφοὶ αὐτῶν οἱ Λευεῖται
  choice: denn ihre Brüder, die Leviten
  rationale: Bewahrt sowohl die korporative Verwandtschaftsbezeichnung als auch die appositionelle Identifikation mit den Leviten.
- source_word: ἡτοίμασαν ἑαυτοῖς
  choice: hatten für sie alles vorbereitet
  rationale: Der griechische Text hat formal das Reflexivpronomen „für sich selbst“. Der Satzlogik nach bereiteten die Leviten jedoch das Nötige für die Torhüter vor, damit diese ihren Dienst nicht verlassen mussten. „Alles“ macht das ungenannte Objekt idiomatisch sichtbar, ohne es näher zu bestimmen; die formale Lesart wird in der Fußnote bewahrt.
theological_decisions:
- issue: Bezug des Reflexivpronomens in ἡτοίμασαν ἑαυτοῖς
  choice: Die Leviten bereiteten das Nötige für die Torhüter vor.
  alternative: Die Leviten bereiteten für sich selbst vor.
  rationale: Die streng reflexive Wiedergabe entspricht der Form des überlieferten Griechisch, lässt aber die Begründung mit γάρ schwer verständlich erscheinen. Die kontextuelle Wiedergabe wahrt den Zusammenhang; die echte textliche Spannung bleibt durch die Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Kurze Hauptsätze sorgen für Verständlichkeit; „Torhüter“ und „Dienst“ entsprechen dem kultischen Zusammenhang, ohne altertümlich zu wirken.
