base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/038.yaml
  text: After him Nebuchadnezzar king of Babylon came up[a], and he bound him with bronze chains and carried him away to Babylon.
translation:
  language: de
  text: Nach ihm zog Nebukadnezar, der König von Babylon, herauf[a]; er band ihn mit bronzenen Fesseln und führte ihn nach Babylon fort.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »zog hinauf«. Das griechische Verb bezeichnet eine Aufwärtsbewegung und kann beim Vorrücken eines Königs aus Sicht des Erzählers mit »heraufziehen« oder »hinaufziehen« wiedergegeben werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μετʼ αὐτὸν
  choice: Nach ihm
  rationale: Gibt die zeitliche Abfolge wieder und bewahrt zugleich den persönlichen Bezug des griechischen Ausdrucks.
- source_word: ἀνέβη
  choice: zog ... herauf
  rationale: Bewahrt das griechische Bewegungsbild und passt natürlich zum Vorrücken eines Königs, ohne einen ausdrücklich nicht genannten Feldzug hinzuzufügen.
- source_word: Ναβουχοδονόσορ
  choice: Nebukadnezar
  rationale: Verwendet die im modernen Deutschen geläufige Namensform des babylonischen Königs.
- source_word: βασιλεὺς Βαβυλῶνος
  choice: der König von Babylon
  rationale: Übersetzt den Titel klar und idiomatisch; der bestimmte Artikel ist im Deutschen bei dieser Apposition natürlich.
- source_word: ἔδησεν αὐτὸν ἐν χαλκεῖς δεσμοῖς
  choice: er legte ihn in bronzene Fesseln
  rationale: Gibt sowohl das Binden als auch Art und Material der Fesseln wieder. „Bronzen“ ist historisch angemessener als „messingen“.
- source_word: ἀπήγαγεν
  choice: führte ihn ... fort
  rationale: Drückt die gewaltsame Wegführung eines Gefangenen aus, ohne über den klaren Sinn des Verbs hinauszugehen.
- source_word: εἰς Βαβυλῶνα
  choice: nach Babylon
  rationale: Gibt die Zielrichtung in natürlichem modernem Deutsch wieder.
theological_decisions:
- issue: Verhältnis des griechischen Wortlauts zum abweichenden beziehungsweise nur ungefähren masoretischen Paralleltext
  choice: 'Die griechische Abfolge wird übersetzt: Nebukadnezar zieht herauf, bindet den König und führt ihn nach Babylon fort.'
  alternative: Den Vers an die abweichende Erzählfolge oder Namensgebung der hebräischen Parallelüberlieferung angleichen.
  rationale: Für 1 Esdras ist der griechische Text der maßgebliche Ausgangstext. Der hebräische Paralleltext dient nur zur Kontrolle und darf die klare griechische Lesart nicht harmonisierend ersetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Zog herauf“ erhält die traditionelle Richtungsmetapher, während „in bronzene Fesseln legen“ die konkrete Gefangennahme natürlich ausdrückt.
