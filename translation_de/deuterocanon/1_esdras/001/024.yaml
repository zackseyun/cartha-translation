translation:
  language: de
  text: 'Josia trat ihm entgegen. Und der König von Ägypten ließ ihm ausrichten: »Was habe ich mit dir zu schaffen[a], König von Judäa[b]?«'
  philosophy: optimal-equivalence
  footnotes:
