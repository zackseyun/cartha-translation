lexical_decisions:
- source_word: ἀπάντησιν αὐτῷ Ἰωσείας
  choice: Josia trat ihm entgegen
  rationale: Das Substantiv ἀπάντησις bezeichnet eine Begegnung beziehungsweise das Entgegengehen. Wegen der knappen, fragmentarischen griechischen Formulierung ist im Deutschen eine verbale Wiedergabe erforderlich; »trat ihm entgegen« erhält zudem den konfrontativen Kontext, ohne einen Kampf vorwegzunehmen.
- source_word: διεπέμψατο ... πρὸς αὐτὸν λέγων
  choice: ließ ihm ... ausrichten
  rationale: Das Verb bezeichnet ein Übermitteln, gewöhnlich durch ausgesandte Boten. Die deutsche Wendung gibt den vermittelten Kommunikationsvorgang natürlich wieder, ohne ausdrücklich Boten in den Text einzufügen.
- source_word: βασιλεὺς Αἰγύπτου
  choice: der König von Ägypten
  rationale: Direkte und im modernen Standarddeutsch übliche Wiedergabe des Herrschertitels mit Gebietsangabe.
- source_word: Τί ἐμοὶ καὶ σοὶ ἐστίν
  choice: Was habe ich mit dir zu schaffen
  rationale: Die semitisch geprägte Wendung grenzt den Sprecher vom Angeredeten ab. Diese idiomatische deutsche Formulierung ist klar und würdevoll; die stärker formale Oberflächenstruktur bleibt in der Fußnote sichtbar.
- source_word: βασιλεῦ τῆς Ἰουδαίας
  choice: König von Judäa
  rationale: Der griechische Text verwendet Ἰουδαία. »Judäa« folgt diesem unmittelbaren Sprachzeugnis; »Juda« wird wegen des historischen Bezugs und der Chronikparallele als Alternative dokumentiert.
theological_decisions:
- issue: Wiedergabe der Abgrenzungsformel Τί ἐμοὶ καὶ σοὶ ἐστίν
  choice: Was habe ich mit dir zu schaffen
  alternative: Was ist zwischen mir und dir?
  rationale: Die idiomatische Haupttextfassung vermittelt die beabsichtigte Distanzierung, ohne den Grad der Feindseligkeit weiter festzulegen. Die wörtlichere Form wird als Fußnote bewahrt, damit die offene Struktur des Griechischen erkennbar bleibt.
- issue: Gebiets- und Herrschertitel Ἰουδαίας
  choice: Judäa
  alternative: Juda
  rationale: Die Übersetzung folgt vorrangig dem vorliegenden griechischen Zeugnis. Die historisch beziehungsweise aus der Chronikparallele naheliegende Form »Juda« wird nicht stillschweigend in den Haupttext eingesetzt, sondern als Alternative vermerkt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Da ließ ihm ... ausrichten« verbindet die beiden kurzen Sätze flüssig, ohne zusätzliche Handlungsträger einzuführen. Beim Vokativ ist im Deutschen kein künstliches »o« nötig; die direkte Anrede bleibt durch Wortstellung und Zeichensetzung deutlich.
