base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/004.yaml
  text: You will not need to carry it on your shoulders[a]. Now serve the Lord your God, and minister to his people Israel, and prepare yourselves by your fathers' houses and your divisions[b],
translation:
  language: de
  text: Ihr braucht sie nicht auf euren Schultern zu tragen.[a] Dient nun dem Herrn, eurem Gott, und leistet seinem Volk Israel Dienst. Macht euch nach euren Sippen und Stämmen bereit.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit „sie“ ist die Bundeslade gemeint; sie wird in diesem Vers nicht erneut ausdrücklich genannt, sondern aus dem Zusammenhang erschlossen.
    reason: cross_reference
  - marker: b
    text: 'Griechisch: „Stämme“. Der hebräische Paralleltext in 2. Chronik 35,4 hat „Abteilungen“ und bezieht sich damit wahrscheinlich auf die Ordnung der Dienstgruppen.'
    reason: textual_parallel
lexical_decisions:
- source_word: Οὐκ ἔσται ὑμῖν ἆραι ἐπʼ ὤμων αὐτήν
  choice: Ihr braucht sie nicht auf euren Schultern zu tragen
  rationale: Die Konstruktion mit dem Futur von εἰμί und Dativ bezeichnet hier, dass diese Aufgabe nicht mehr bei den Angesprochenen liegt. „tragen“ gibt das konkrete Befördern auf den Schultern natürlich wieder; das feminine „sie“ verweist im Deutschen passend auf die aus dem Kontext erschlossene Bundeslade.
- source_word: λατρεύετε
  choice: Dient
  rationale: Das Verb bezeichnet den kultischen Dienst für Gott. „dienen“ wahrt sowohl den gottesdienstlichen als auch den priesterlichen Bezug, ohne ihn unnötig zu verengen.
- source_word: τῷ κυρίῳ θεῷ ὑμῶν
  choice: dem Herrn, eurem Gott
  rationale: Die Formulierung gibt die griechische Gottesbezeichnung und die Zugehörigkeitsangabe klar und in würdigem modernem Deutsch wieder.
- source_word: θεραπεύετε
  choice: tut Dienst an
  rationale: Eine andere Wendung als bei λατρεύετε erhält die Unterscheidung zwischen dem Dienst für Gott und dem Dienst am Volk. „Dienst an“ ist hier verständlich und passt zum priesterlichen Zusammenhang.
- source_word: τὸ ἔθνος αὐτοῦ Ἰσραήλ
  choice: seinem Volk Israel
  rationale: ἔθνος kann „Volk“ oder „Nation“ bedeuten. Im vorliegenden Bundes- und Kultzusammenhang ist „Volk Israel“ die natürlichere deutsche Wiedergabe; αὐτοῦ bleibt durch „seinem“ erhalten.
- source_word: ἑτοιμάσατε
  choice: Macht euch bereit
  rationale: Der Imperativ fordert zum Bereitmachen für den folgenden Dienst auf. Die reflexive deutsche Formulierung macht den im Zusammenhang vorausgesetzten Bezug auf die Angesprochenen deutlich.
- source_word: κατὰ τὰς πατριὰς
  choice: nach euren Sippen
  rationale: πατριά bezeichnet eine durch gemeinsame Abstammung bestimmte Familien- oder Sippengruppe. „Sippen“ ist im Deutschen knapper und verständlicher als „Vaterhäuser“, ohne die genealogische Gliederung aufzugeben.
- source_word: καὶ τὰς φυλὰς ὑμῶν
  choice: und Stämmen
  rationale: φυλή bedeutet regulär „Stamm“. Da der griechische Text die primäre Übersetzungsgrundlage ist, steht diese formale Bedeutung im Haupttext; die abweichende organisatorische Lesart des hebräischen Paralleltexts wird in einer Fußnote dokumentiert.
theological_decisions:
- issue: Unterscheidung der beiden Verben für den Dienst an Gott und am Volk
  choice: „Dient“ für λατρεύετε und „tut Dienst an“ für θεραπεύετε
  alternative: Beide Verben mit „dienen“ wiedergeben
  rationale: Der griechische Text verwendet bewusst verschiedene Verben. Die unterschiedliche Wiedergabe bewahrt die Spannung zwischen dem kultischen Dienst für Gott und dem Dienst an Israel, ohne daraus eine weitergehende Lehrentscheidung abzuleiten.
- issue: Deutung von φυλάς im Verhältnis zum hebräischen Paralleltext
  choice: Im Haupttext „Stämmen“ nach dem griechischen φυλάς
  alternative: „Abteilungen“ nach dem hebräischen Paralleltext in 2. Chronik 35,4
  rationale: Die griechische Vorlage ist der maßgebliche Text und nennt „Stämme“. Der hebräische Paralleltext kann auf priesterliche Dienstabteilungen weisen, soll die echte Abweichung der Zeugen jedoch nicht stillschweigend beseitigen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Kurze Hauptsätze halten die Anweisung klar. „Sippen“ vermeidet das heute ungebräuchliche „Vaterhäuser“, während „Stämme“ die griechische Primärvorlage sichtbar wahrt.
