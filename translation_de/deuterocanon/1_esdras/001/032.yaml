base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/032.yaml
  text: And those from the nation took Jechoniah son of Josiah and made him king in place of Josiah his father, when he was twenty-three years old.
translation:
  language: de
  text: Und die Leute aus dem Volk nahmen Jechonja[a], den Sohn Josias, und machten ihn anstelle seines Vaters Josia zum König. Er war dreiundzwanzig Jahre alt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im griechischen Text steht „Jechonja“; der Parallelbericht in 2. Chronik 36,1 nennt Joahas.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀναλαβόντες
  choice: nahmen
  rationale: Das Partizip bezeichnet hier die Handlung, durch die Jechonja zur Königsherrschaft erhoben wird. „Nahmen“ bewahrt den konkreten Ausdruck des Griechischen, ohne eine bestimmte Zeremonie hinzuzufügen.
- source_word: οἱ ἐκ τοῦ ἔθνους
  choice: die Männer aus dem Volk
  rationale: Wörtlich steht „die aus dem Volk“. Die Ergänzung „Männer“ macht die substantivierte Wendung im Deutschen natürlich und vermeidet die aus einem hebräischen Parallelidiom importierte Übersetzung „Volk des Landes“.
- source_word: ἀνέδειξαν βασιλέα
  choice: machten ihn … zum König
  rationale: Die Wendung gibt die Einsetzung in das Königsamt klar und idiomatisch wieder, ohne eine ausdrückliche Proklamation oder besondere Zeremonie vorauszusetzen.
- source_word: ἀντὶ Ἰωσείου τοῦ πατρὸς αὐτοῦ
  choice: anstelle seines Vaters Josia
  rationale: „Anstelle“ bewahrt den Sinn von Ersatz beziehungsweise Nachfolge; die deutsche Wortstellung vermeidet die schwerfällige Wiederholung „anstelle Josias, seines Vaters“.
- source_word: ὄντα ἐτῶν εἴκοσι τριῶν
  choice: Er war dreiundzwanzig Jahre alt
  rationale: Ein selbstständiger Satz gibt die griechische Altersangabe in natürlichem, klarem Deutsch wieder, ohne ihren Bezug auf Jechonja zu verändern.
- source_word: Ἰεχονίαν
  choice: Jechonja
  rationale: Der Name folgt ausdrücklich dem griechischen Hauptzeugen. „Jechonja“ ist die im Deutschen geläufige biblische Namensform; die abweichende Identifizierung im Parallelbericht wird in einer Fußnote genannt.
theological_decisions:
- issue: Abweichender Eigenname gegenüber dem historischen Parallelbericht
  choice: Jechonja im Haupttext
  alternative: Joahas
  rationale: Der griechische Primärtext von 1 Esdras nennt eindeutig Jechonja. Eine Angleichung an 2 Chronik 36,1 würde die Textabweichung verdecken; deshalb bleibt sie durch eine Fußnote sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Formulierung bleibt dem griechischen Satz eng verbunden, löst jedoch die abschließende partizipiale Altersangabe zugunsten natürlicher deutscher Syntax in einen eigenen Satz auf.
