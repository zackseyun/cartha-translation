base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/016.yaml
  text: 'And the matters of the Lord’s sacrifice were completed on that day: the Passover was offered[a], and the sacrifices were brought up onto the altar of the Lord[b], according to the command of King Josias.'
translation:
  language: de
  text: 'Und an jenem Tag wurde alles vollendet, was den Opferdienst für den Herrn betraf: Das Passa wurde dargebracht[a], und die Opfer wurden auf den Altar des Herrn gebracht, nach dem Befehl des Königs Josias[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: „Das Passa wurde gebracht“; das griechische Verb kann in diesem Opferzusammenhang „gebracht“, „vorgebracht“ oder „dargebracht“ bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: Josias ist die griechische Namensform; die entsprechende hebräische Namensform lautet Joschija.
    reason: alternative_reading
lexical_decisions:
- source_word: συνετελέσθη
  choice: wurde … vollendet
  rationale: Der passive Aorist bezeichnet den Abschluss der Opferhandlungen; „vollendet“ gibt den formalen Sinn wieder und klingt zugleich würdig.
- source_word: τὰ τῆς θυσίας τοῦ κυρίου
  choice: alles …, was zum Opfer für den Herrn gehörte
  rationale: Die substantivierte Wendung bezeichnet umfassend die zum Opfer gehörenden Angelegenheiten oder Handlungen, ohne sie vorschnell auf einzelne Riten einzuengen.
- source_word: ἀχθῆναι τὸ πάσχα
  choice: das Passa wurde dargebracht
  rationale: ἀχθῆναι bedeutet wörtlich „gebracht werden“, hat hier jedoch einen Opferkontext. „Dargebracht“ ist im Deutschen natürlich und bewahrt den kultischen Sinn; die wörtlichere Möglichkeit wird in einer Fußnote genannt.
- source_word: προσαχθῆναι τὰς θυσίας
  choice: die Opfer wurden … gebracht
  rationale: Die Wiedergabe erhält die im Verb enthaltene Bewegung zum Altar, statt den Ausdruck lediglich mit „geopfert“ zusammenzufassen.
- source_word: ἐπὶ τὸ τοῦ κυρίου θυσιαστήριον
  choice: auf den Altar des Herrn
  rationale: ἐπί mit Akkusativ bezeichnet hier die Bewegung hin zum beziehungsweise auf den Altar; „auf den Altar“ bewahrt diese Richtung.
- source_word: κατὰ τὴν ἐπιταγὴν
  choice: nach dem Befehl
  rationale: ἐπιταγή bezeichnet eine verbindliche Anordnung; im königlichen Zusammenhang ist „Befehl“ die klare moderne Entsprechung.
- source_word: τοῦ βασιλέως Ἰωσείου
  choice: König Josias’
  rationale: „Josias“ folgt der griechischen Namensform des primären Textzeugen; die geläufige, vom Hebräischen her bestimmte deutsche Form wird in der Fußnote angegeben.
theological_decisions:
- issue: Wiedergabe von κύριος im alttestamentlich-kultischen Zusammenhang
  choice: Herr
  alternative: HERR
  rationale: Der primäre Ausgangstext bietet κύριος. „Herr“ übersetzt diesen griechischen Ausdruck unmittelbar, ohne die Lesart des hebräischen Paralleltextes typografisch in den griechischen Text einzutragen.
- issue: Namensform Ἰωσείου
  choice: Josias
  alternative: Joschija
  rationale: Da der griechische Text von 1 Esdras die primäre Übersetzungsgrundlage bildet, steht dessen Namensform im Haupttext. Die aus dem hebräischen Paralleltext vertraute Form bleibt als Fußnotenalternative sichtbar.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Die Satzstruktur wahrt den zusammenfassenden Charakter des griechischen Satzes; kultische Fachsprache wird sparsam und verständlich eingesetzt.
