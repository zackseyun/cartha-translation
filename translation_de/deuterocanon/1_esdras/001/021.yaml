revisions:
- from: Und die Taten Josias erwiesen sich vor seinem Herrn als recht[a], mit einem Herzen voller Gottesfurcht[b].
  to: Und die Taten Josias wurden vor seinem Herrn als recht befunden[a], und er handelte mit einem Herzen voller Gottesfurcht[b].
  rationale: Die Revision wahrt die passive Form und die bewertende Bedeutung von ὠρθώθη mit „wurden ... als recht befunden“. Die explizite Fortführung „und er handelte“ macht im Deutschen deutlich, dass die volle Gottesfurcht Josias’ innere Haltung bezeichnet, ohne einen zusätzlichen inhaltlichen Sachverhalt einzuführen. Die Fußnote wurde idiomatischer formuliert.
