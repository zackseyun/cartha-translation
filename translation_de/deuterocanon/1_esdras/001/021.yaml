base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/021.yaml
  text: And the deeds of Josiah were upright before his Lord[b][a], with a heart full of godliness.
translation:
  language: de
  text: Und die Taten Josias wurden vor seinem Herrn als recht befunden[a], und er handelte mit einem Herzen voller Gottesfurcht[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wurden vor seinem Herrn zurechtgebracht“ oder „wurden vor seinem Herrn als richtig erwiesen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Frömmigkeit“ oder „Ehrfurcht“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὠρθώθη
  choice: erwiesen sich als recht
  rationale: Das Passiv von ὀρθόω bezeichnet hier, dass Josias Taten als recht beziehungsweise richtig dastehen. Die Formulierung bewahrt den bewertenden Sinn, ohne im Deutschen eine unnatürliche Wendung wie „wurden aufgerichtet“ zu verwenden.
- source_word: τὰ ἔργα
  choice: die Taten
  rationale: Gemeint sind Josias konkrete Handlungen; „Taten“ ist im Deutschen natürlich und vermeidet mögliche abstrakte oder werkgerechte Nebenbedeutungen von „Werke“.
- source_word: Ἰωσείου
  choice: Josias
  rationale: „Josias“ ist die etablierte deutsche Namensform für den König, der im Hebräischen יֹאשִׁיָּהוּ heißt.
- source_word: ἐνώπιον
  choice: vor
  rationale: „Vor“ gibt knapp und idiomatisch wieder, dass die Taten in den Augen beziehungsweise in der Gegenwart seines Herrn beurteilt werden.
- source_word: τοῦ κυρίου αὐτοῦ
  choice: seinem Herrn
  rationale: Die Übersetzung folgt dem griechischen Wortlaut „seines Herrn“ und erweitert ihn nicht unter Einfluss einer nur ungefähren hebräischen Parallele zu „dem HERRN, seinem Gott“.
- source_word: ἐν καρδίᾳ πλήρει
  choice: mit einem Herzen voller
  rationale: Diese natürliche deutsche Wendung beschreibt die innere Haltung, aus der Josias handelte.
- source_word: εὐσεβείας
  choice: Gottesfurcht
  rationale: εὐσέβεια bezeichnet religiöse Ehrfurcht und Frömmigkeit. „Gottesfurcht“ ist heute verständlich, würdig und macht den Gottesbezug deutlich, ohne bloße Angst auszudrücken.
theological_decisions:
- issue: Ob κύριος aufgrund der hebräischen Parallelüberlieferung zu „der HERR“ oder „der Herr, sein Gott“ erweitert werden soll
  choice: seinem Herrn
  alternative: dem HERRN; seinem Gott, dem Herrn
  rationale: Der griechische Primärtext bietet τοῦ κυρίου αὐτοῦ ohne θεός. Die begrenztere Ausdrucksweise wird deshalb bewahrt.
- issue: Bedeutung von εὐσέβεια als innere religiöse Haltung
  choice: Gottesfurcht
  alternative: Frömmigkeit; Ehrfurcht
  rationale: „Gottesfurcht“ wahrt den religiösen Bezug und die Spannung zwischen ehrfürchtiger Haltung und gelebter Frömmigkeit; die Alternativen werden in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz bleibt eng am griechischen Aufbau, wird aber mit „erwiesen sich als recht“ und „mit einem Herzen voller“ idiomatisch formuliert. Die Fußnotenmarker stehen unmittelbar bei den jeweils erläuterten Ausdrücken.
