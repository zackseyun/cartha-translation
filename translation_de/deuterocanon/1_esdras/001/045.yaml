base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/045.yaml
  text: And he did what was evil before the Lord[a], and he was not ashamed at the words spoken by Jeremiah the prophet from the mouth of the Lord.
translation:
  language: de
  text: Und er tat, was böse war vor dem Herrn, und schämte sich nicht[a] angesichts der Worte, die der Prophet Jeremia aus dem Mund des Herrn gesprochen hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ließ sich angesichts der Worte, die der Prophet Jeremia aus dem Mund des Herrn gesprochen hatte, nicht beschämen.“ Das griechische Verb kann sowohl „sich schämen“ als auch „beschämt werden“ ausdrücken.'
    reason: Die mittlere beziehungsweise passive Bedeutung von ἐνετράπη und der Anschluss mit ἀπό lassen mehr als eine natürliche deutsche Nuance zu.
lexical_decisions:
- source_word: ἐποίησεν τὸ πονηρόν
  choice: er tat, was böse war
  rationale: Die biblische Wendung wird in natürlichem Deutsch wiedergegeben und behält den moralischen Aussagegehalt des substantivierten Adjektivs bei.
- source_word: ἐνώπιον Κυρίου
  choice: vor dem Herrn
  rationale: „Vor dem Herrn“ gibt die räumlich-gerichtliche Bedeutung von ἐνώπιον knapp wieder; κύριος wird gemäß dem griechischen Haupttext als „Herr“ übersetzt.
- source_word: οὐκ ἐνετράπη
  choice: schämte sich nicht
  rationale: Die mediale beziehungsweise passive Form von ἐντρέπω kann bedeuten, dass jemand sich schämt, beschämt ist oder Scheu zeigt. „Schämte sich nicht“ ist hier klar und quellennah.
- source_word: ἀπὸ τῶν ῥηθέντων λόγων
  choice: angesichts der Worte
  rationale: ἀπό bezeichnet hier den Anlass der erwarteten Scham. „Angesichts“ klingt im Deutschen natürlicher als ein wörtliches „von“ und legt die Wirkung nicht stärker kausal fest als der griechische Ausdruck.
- source_word: ὑπὸ Ἰερεμίου τοῦ προφήτου
  choice: die der Prophet Jeremia … gesprochen hatte
  rationale: Die deutsche Aktivkonstruktion gibt den im Griechischen genannten Urheber natürlich wieder und bewahrt Jeremias Bezeichnung als Prophet.
- source_word: ἐκ στόματος τοῦ κυρίου
  choice: aus dem Mund des Herrn
  rationale: Die anschauliche biblische Formel für eine göttliche Botschaft bleibt erhalten, statt zu dem allgemeineren „vom Herrn“ verflacht zu werden.
theological_decisions:
- issue: Wiedergabe von κύριος im griechischen deuterokanonischen Text
  choice: Herr
  alternative: HERR
  rationale: Der maßgebliche Text bietet κύριος. „Herr“ folgt daher unmittelbar dem griechischen Zeugnis, ohne aus einer möglichen hebräischen Vorlage den Gottesnamen in die Übersetzung einzutragen.
- issue: Bedeutungsnuance von οὐκ ἐνετράπη
  choice: schämte sich nicht
  alternative: ließ sich nicht beschämen / zeigte keine Scheu
  rationale: Der griechische Text spricht ausdrücklich von fehlender Scham oder Scheu. Eine Wiedergabe mit „demütigte sich nicht“ würde eine Formulierung aus einer abweichenden hebräischen Parallelüberlieferung eintragen und wird deshalb nicht in den Haupttext übernommen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst biblischer Bildsprache in „aus dem Mund des Herrn“. Die Satzstruktur wurde leicht ins Deutsche umgestellt, ohne Inhalt oder Mehrdeutigkeit des griechischen Haupttextes zu glätten.
