base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/026.yaml
  text: And Josiah did not turn back to his chariot[a], but attempted to fight him, not paying attention to the words of Jeremiah the prophet from the mouth of the Lord.
translation:
  language: de
  text: Und Josia wandte sich nicht zu seinem Streitwagen zurück[a], sondern versuchte, gegen ihn zu kämpfen, ohne auf die Worte des Propheten Jeremia aus dem Mund des Herrn zu achten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »zog sich nicht zu seinem Streitwagen zurück«. Der griechische Ausdruck ist knapp und kann eine verweigerte Rückzugsbewegung zum Streitwagen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἀπέστρεψεν ἑαυτὸν
  choice: wandte sich nicht … zurück
  rationale: Die reflexive Konstruktion bezeichnet ein Sich-Zurückwenden oder Zurückziehen. Die gewählte Formulierung ist im Deutschen natürlich und legt den genauen militärischen Vorgang nicht unnötig fest.
- source_word: ἐπὶ τὸ ἅρμα αὐτοῦ
  choice: zu seinem Streitwagen
  rationale: ἐπί mit Akkusativ gibt hier die Richtung an. Zusammen mit ἀπέστρεψεν ist eine Rückbewegung zum Streitwagen gemeint; der griechische Ausdruck bleibt jedoch gedrängt.
- source_word: πολεμεῖν αὐτὸν ἐπεχείρει
  choice: versuchte, gegen ihn zu kämpfen
  rationale: ἐπιχειρέω mit Infinitiv bedeutet, etwas zu versuchen oder zu unternehmen. Das Pronomen αὐτόν wird als persönlicher Gegner wiedergegeben, ohne ihn im Vers ausdrücklich zu identifizieren.
- source_word: οὐ προσέχων
  choice: ohne … zu achten
  rationale: προσέχω mit Dativ bedeutet, auf etwas zu achten oder ihm Gehör zu schenken. Die deutsche Konstruktion gibt den begleitenden Partizipialsatz flüssig wieder.
- source_word: ῥήμασιν
  choice: die Worte
  rationale: Die Wiedergabe bewahrt den Bezug auf konkrete Äußerungen und reduziert den Ausdruck nicht auf eine allgemeinere Botschaft.
- source_word: Ἰερεμίου προφήτου
  choice: des Propheten Jeremia
  rationale: Diese Wortstellung entspricht natürlichem modernem Deutsch und bewahrt sowohl Namen als auch prophetische Amtsbezeichnung.
- source_word: ἐκ στόματος Κυρίου
  choice: aus dem Mund des Herrn
  rationale: Die wörtliche Metapher kennzeichnet die Worte ausdrücklich als vom Herrn ausgehend und bewahrt die theologische Aussagekraft des griechischen Textes.
theological_decisions:
- issue: Prophetische Autorität in ἐκ στόματος Κυρίου
  choice: Die ausdrückliche Wendung „aus dem Mund des Herrn“ wird beibehalten.
  alternative: „vom Herrn“
  rationale: Der griechische Text stellt Jeremias Worte als unmittelbar aus dem Mund des Herrn kommend dar. Eine Verkürzung würde dieses Bild und seine Betonung prophetischer Autorität abschwächen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Streitwagen“ ist gegenüber dem allgemeineren „Wagen“ im militärischen Zusammenhang präzise. Die syntaktische Spannung und das ausdrückliche Bild „aus dem Mund des Herrn“ bleiben erhalten.
