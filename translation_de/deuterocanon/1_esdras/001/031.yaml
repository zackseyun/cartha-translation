base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/031.yaml
  text: for all the family of Israel[a]. Now these things have been recorded in the book of the histories concerning the kings of Judah, and each deed of Josiah, and his glory, and his understanding in the law of the Lord, and the things done by him, both the former things and those now recounted[b], are recorded in the book of the Kings of Israel and Judah.
translation:
  language: de
  text: 'für das ganze Geschlecht Israel. Dies aber ist im Buch der geschichtlichen Berichte über die Könige von Judäa[a] aufgezeichnet: jede einzelne Tat aus Josias Wirken, sein Ruhm und seine Einsicht in das Gesetz des Herrn. Sowohl die von ihm vollbrachten Taten als auch das, was jetzt berichtet wird[b], sind im Buch der Könige Israels und Judas aufgezeichnet.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „im Buch der geschichtlich berichteten Dinge über die Könige von Judäa“. Gemeint ist wahrscheinlich ein historisches oder königliches Quellenwerk; auch „Buch der Aufzeichnungen“ ist möglich.'
    reason: lexical_alternative
  - marker: b
    text: 'Der griechische Wortlaut am Ende ist syntaktisch ungewöhnlich: „die von ihm vollbrachten Dinge und das, was jetzt berichtet wird“. Die Übersetzung versteht dies als Hinweis sowohl auf Josias Taten als auch auf die gegenwärtig erzählten Ereignisse.'
    reason: textual_difficulty
lexical_decisions:
- source_word: γένος
  choice: Geschlecht
  rationale: In εἰς πᾶν τὸ γένος Ἰσραήλ bezeichnet das Wort die gesamte von Israel abstammende Gemeinschaft. „Geschlecht“ bewahrt den Verwandtschafts- und Abstammungsbezug besser als das allgemeinere „Volk“.
- source_word: ἀναγέγραπται
  choice: ist aufgezeichnet
  rationale: Das Perfekt Passiv bezeichnet eine abgeschlossene schriftliche Aufzeichnung, die weiterhin vorliegt.
- source_word: βίβλῳ τῶν ἱστορουμένων
  choice: Geschichtsbuch
  rationale: Die Wendung bezeichnet ein Buch mit geschichtlich berichteten beziehungsweise archivalisch festgehaltenen Inhalten. „Geschichtsbuch“ ist im Deutschen knapp und verständlich; „Buch der Aufzeichnungen“ bleibt möglich.
- source_word: τὸ καθʼ ἓν πραχθὲν
  choice: jede einzelne Tat
  rationale: καθʼ ἕν trägt den Sinn „je einzeln“ oder „im Einzelnen“; zusammen mit dem Partizip von πράσσω ergibt sich natürlich „jede einzelne Tat“.
- source_word: δόξης
  choice: Ruhm
  rationale: Im Zusammenhang mit Josia bezeichnet δόξα seinen ausgezeichneten Ruf beziehungsweise seine Herrlichkeit. „Ruhm“ ist hier im modernen Deutschen natürlicher als „Herrlichkeit“.
- source_word: συνέσεως
  choice: Einsicht
  rationale: Das Wort bezeichnet verständige Einsicht und ist ausdrücklich auf das Gesetz des Herrn bezogen.
- source_word: νόμῳ Κυρίου
  choice: Gesetz des Herrn
  rationale: Dies ist die sachlich und stilistisch angemessene deutsche Wiedergabe der griechischen Wendung.
- source_word: τά τε πραχθέντα ὑπʼ αὐτοῦ
  choice: seine Taten
  rationale: Die kompakte Wiedergabe erhält den Bezug auf das von Josia Getane, ohne im Deutschen das schwerfällige Passiv „die von ihm getanen Dinge“ zu verwenden.
- source_word: τὰ νῦν ἱστόρηται
  choice: das, was soeben berichtet wurde
  rationale: Die überlieferte Formulierung ist syntaktisch auffällig. Die Übersetzung wahrt den naheliegenden Bezug auf die unmittelbar zuvor erzählten Ereignisse, ohne die Schwierigkeit zu verschweigen.
- source_word: βυβλίῳ τῶν Βασιλέων Ἰσραὴλ καὶ Ἰούδα
  choice: Buch der Könige Israels und Judas
  rationale: Die Formulierung wird als Bezeichnung des genannten Quellenbuches wiedergegeben; die Genitive bleiben erhalten.
theological_decisions:
- issue: Wiedergabe von κύριος in νόμῳ Κυρίου
  choice: Herr
  alternative: HERR
  rationale: Die griechische Vorlage bietet κύριος. „Herr“ gibt diese Form direkt wieder, ohne die Schreibung des hebräischen Gottesnamens aus einer anderen Textgrundlage einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der fragmentarische Versanfang bleibt erhalten, da er den vorausgehenden Satz fortsetzt. Wiederholtes „aufgezeichnet“ spiegelt den dokumentarischen Charakter des griechischen Textes; sperrige substantivische und passive Wendungen werden maßvoll geglättet.
