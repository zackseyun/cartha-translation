base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/023.yaml
  text: And after all this activity of Josias[a], it happened that Pharaoh king of Egypt came to stir up war at Carchemish on the Euphrates[b]; and Josias went out against him.
translation:
  language: de
  text: Und nach all diesem Tun des Josias geschah es, dass Pharao, König von Ägypten, kam, um in Karkemisch am Euphrat Krieg zu entfachen; und Josias zog gegen ihn[a] aus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die zugrunde gelegte griechische Textausgabe bricht am Versende nach „und er zog aus gegen/nach …“ (καὶ ἐξῆλθεν εἰς) ab. „gegen ihn“ ist eine aus dem unmittelbaren Zusammenhang erschlossene Ergänzung der unvollständigen Wendung.
    reason: textual_variant
lexical_decisions:
- source_word: μετὰ πᾶσαν τὴν πρᾶξιν ταύτην Ἰωσείου
  choice: nach all diesem Tun des Josias
  rationale: „Tun“ gibt die zusammenfassende Bedeutung von πρᾶξις natürlich und würdevoll wieder, ohne sie auf eine einzelne Tat oder eine bloße Folge von Ereignissen einzuengen.
- source_word: συνέβη
  choice: geschah es
  rationale: Bewahrt die griechische Erzählformel in verständlichem, gehobenem modernem Deutsch.
- source_word: Φαραὼ βασιλέα Αἰγύπτου
  choice: der Pharao, der König von Ägypten
  rationale: Die Apposition wird im Deutschen mit Artikeln und Kommas klar und natürlich wiedergegeben.
- source_word: ἐλθόντα πόλεμον ἐγείραι
  choice: kam, um … Krieg zu entfachen
  rationale: Das Partizip wird idiomatisch als finites Verb wiedergegeben; „Krieg entfachen“ erhält das Bild von ἐγείρω besser als das neutralere „Krieg führen“.
- source_word: ἐν Χαρκαμυς ἐπὶ τοῦ Εὐφράτου
  choice: in Karkemisch am Euphrat
  rationale: „In“ entspricht ἐν und ist für eine Stadt im Deutschen natürlich; „am Euphrat“ bezeichnet idiomatisch ihre Lage am Fluss.
- source_word: καὶ ἐξῆλθεν εἰς
  choice: und Josias zog gegen ihn aus
  rationale: Das überlieferte Zitat bricht nach εἰς ab. Die Ergänzung „gegen ihn“ ist die kleinste kontextgemäße Vervollständigung; der ausdrücklich wiederholte Name klärt das im Griechischen nur erschlossene Subjekt.
- source_word: Ἰωσείου
  choice: Josias
  rationale: Die Namensform folgt unmittelbar der griechischen Form und der im Deutschen geläufigen Septuaginta-/Vulgataform, statt an „Josia“ anzugleichen.
theological_decisions:
- issue: Namensform des Königs
  choice: Josias
  alternative: Josia
  rationale: Die griechische Ausgangsform wird transliterierend bewahrt. Die Entscheidung ist textlich, nicht konfessionell.
- issue: Vervollständigung der abgebrochenen Schlusswendung
  choice: gegen ihn
  alternative: den Satz nach „zog“ als unvollständig stehen lassen
  rationale: Der unmittelbare Erzählzusammenhang legt den Bezug auf den Pharao nahe; da die bereitgestellte griechische Fassung jedoch nach εἰς abbricht, wird die Ergänzung ausdrücklich in einer Fußnote kenntlich gemacht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit moderat formaler biblischer Erzählweise. Die Satzstruktur bleibt nahe am Griechischen, wird aber deutsch idiomatisch gegliedert. Der einzige Fußnotenmarker [a] steht unmittelbar bei der kenntlich gemachten Ergänzung.
