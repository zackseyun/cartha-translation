base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/028.yaml
  text: And the king said to his servants[a], “Take me away from the battle, for I am very weak.” And immediately his servants took him away from the battle line,
translation:
  language: de
  text: 'Und der König sagte zu seinen Dienern[a]: »Bringt mich aus der Schlacht fort, denn ich bin sehr schwach geworden.« Sofort führten ihn seine Diener aus der Schlachtreihe heraus,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder »Begleitern«. Das griechische Wort παῖδες kann »Diener«, »Begleiter« oder »junge Männer« bedeuten; im hebräischen Paralleltext steht »seine Diener«.
    reason: lexical_alternative
lexical_decisions:
- source_word: παῖς / παισίν / παῖδες
  choice: Diener
  rationale: Im königlichen und militärischen Zusammenhang sind persönliche Diener oder Begleiter gemeint, nicht Kinder. Das hebräische Parallelzeugnis עֲבָדָיו stützt »seine Diener«.
- source_word: Ἀποστήσατέ με
  choice: Bringt mich weg
  rationale: Der Imperativ verlangt, den König körperlich aus dem Kampfgeschehen zu entfernen; die Formulierung ist natürlich und gibt den kausativen Sinn klar wieder.
- source_word: ἀπὸ τῆς μάχης
  choice: aus der Schlacht
  rationale: μάχη bezeichnet den Kampf beziehungsweise die Schlacht selbst. »Aus der Schlacht« drückt im Deutschen die Entfernung aus dem laufenden Kampf idiomatisch aus.
- source_word: ἠσθένησα
  choice: ich bin schwach
  rationale: Das Verb bezeichnet Schwäche oder Erkrankung, ohne für sich genommen ausdrücklich eine Verwundung festzustellen. Das Präsens gibt den unmittelbar bestehenden Zustand natürlich wieder.
- source_word: λίαν
  choice: sehr
  rationale: Das Adverb verstärkt die Schwäche und wird mit dem üblichen modernen Intensivwort wiedergegeben.
- source_word: εὐθέως
  choice: sogleich
  rationale: Das Wort bezeichnet die unverzügliche Reaktion der Diener; »sogleich« ist knapp, würdig und gegenwärtig verständlich.
- source_word: παράταξις
  choice: Schlachtreihe
  rationale: παράταξις bezeichnet die geordnete militärische Aufstellung beziehungsweise Kampflinie. »Schlachtreihe« wahrt diesen präziseren Sinn und vermeidet eine bloße Wiederholung von »Schlacht«.
theological_decisions: []
