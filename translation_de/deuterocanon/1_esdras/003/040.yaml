base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/003/040.yaml
  text: And these make the garments of men[a], and these bring glory to men, and men cannot exist apart from women.
translation:
  language: de
  text: Und sie fertigen die Gewänder der Männer an, und sie verschaffen den Männern Ansehen, und die Männer können nicht ohne die Frauen sein.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „können nicht ohne Frauen sein“; wörtlich steht im Griechischen „sein“.'
    reason: Die Anmerkung nennt eine idiomatische Alternative für χωρίς, ohne εἶναι durch die enger auslegende Wiedergabe „leben“ zu ersetzen.
lexical_decisions:
- source_word: αὗται
  choice: sie
  rationale: Das feminine Demonstrativpronomen verweist auf die Frauen im vorausgehenden Zusammenhang. Im Deutschen nimmt „sie“ diesen Bezug natürlich auf; die Wiederholung bewahrt den rhetorischen Parallelismus.
- source_word: ποιοῦσιν
  choice: fertigen … an / verschaffen
  rationale: ποιέω bedeutet grundsätzlich „machen, hervorbringen“. Bei Gewändern ist „anfertigen“ idiomatisch; bei δόξαν gibt „verschaffen“ die bewirkende Bedeutung natürlich wieder, ohne den Sinn zu erweitern.
- source_word: στολὰς
  choice: Gewänder
  rationale: στολή bezeichnet ein Kleidungsstück oder Gewand. „Gewänder“ bewahrt den konkreten und leicht gehobenen Ausdruck, ohne ausschließlich zeremonielle Roben anzudeuten.
- source_word: δόξαν
  choice: Ansehen
  rationale: δόξα kann hier Ruhm, Ehre, Glanz oder gesellschaftliches Ansehen bezeichnen. „Ansehen“ passt idiomatisch zu dem, was Frauen den Männern verschaffen, und vermeidet das im heutigen Deutsch stärker theologisch geprägte „Herrlichkeit“.
- source_word: οὐ δύνανται
  choice: können nicht
  rationale: Direkte und idiomatische Wiedergabe der ausgedrückten Unmöglichkeit beziehungsweise Unfähigkeit.
- source_word: εἶναι
  choice: sein
  rationale: Die formale Entsprechung „sein“ erhält die Breite und mögliche Unbestimmtheit des griechischen Infinitivs; eine Übersetzung mit „existieren“ würde die Aussage stärker auf bloße Existenz oder Fortpflanzung festlegen.
- source_word: χωρὶς τῶν γυναικῶν
  choice: ohne die Frauen
  rationale: χωρίς mit Genitiv bedeutet „ohne, getrennt von“. Der bestimmte Artikel wird mit „die Frauen“ wiedergegeben und nimmt die im Kontext behandelte Gruppe auf.
- source_word: οἱ ἄνθρωποι
  choice: die Männer
  rationale: Obwohl ἄνθρωποι auch allgemein „Menschen“ bedeuten kann, legt der ausdrückliche Gegenüberstellung zu τῶν γυναικῶν hier die geschlechtsspezifische Bedeutung „Männer“ nahe.
theological_decisions:
- issue: Geschlechtsbezug von οἱ ἄνθρωποι gegenüber τῶν γυναικῶν
  choice: die Männer
  alternative: die Menschen
  rationale: Die unmittelbare Gegenüberstellung mit „den Frauen“ rückt Männer als Bezugsgruppe in den Vordergrund. Die Übersetzung vermeidet daher eine inklusive Verallgemeinerung, ohne eine weitergehende Aussage über das Verhältnis der Geschlechter einzutragen.
- issue: Reichweite der Aussage εἶναι χωρὶς τῶν γυναικῶν
  choice: nicht ohne die Frauen sein
  alternative: nicht ohne Frauen existieren
  rationale: Das griechische εἶναι ist semantisch breit. „Sein“ erhält die mögliche Spannung zwischen Existenz, Lebensführung und gesellschaftlicher Abhängigkeit, statt den Satz ausschließlich biologisch zu deuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die dreifache Satzverknüpfung mit „und“ sowie die Wiederholung von „sie“ und „die Männer“ bewahren den rhetorischen Nachdruck des Griechischen. „Ansehen“ klingt natürlich und gibt δόξα im gesellschaftlichen Kontext wieder.
