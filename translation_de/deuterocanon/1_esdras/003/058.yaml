translation:
  language: de
  text: Und wieder läuft es innerhalb eines Tages an seinen eigenen Ort zurück.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Und wieder kehrt es innerhalb eines Tages an seinen eigenen Ort zurück.“ Das griechische Verb stellt die rasche Bewegung anschaulich dar; deshalb steht im Haupttext „läuft … zurück“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν
  choice: wieder
  rationale: Das Adverb bezeichnet hier Wiederholung beziehungsweise Rückkehr und verbindet sich im Deutschen natürlich mit „zurückläuft“.
- source_word: ἀποτρέχει
  choice: läuft … zurück
  rationale: Das Bewegungsverb bezeichnet eine rasche Bewegung fort beziehungsweise zurück. „Läuft … zurück“ bewahrt die Anschaulichkeit des griechischen Ausdrucks besser als das neutralere „kehrt zurück“.
- source_word: εἰς τὸν ἑαυτοῦ τόπον
  choice: an seinen eigenen Ort
  rationale: „Ort“ gibt τόπος direkt wieder; „seinen eigenen“ erhält die reflexive Besitzangabe ἑαυτοῦ.
- source_word: ἐν μιᾷ ἡμέρᾳ
  choice: innerhalb eines einzigen Tages
  rationale: Die Formulierung drückt aus, dass die Bewegung im Zeitraum eines Tages erfolgt; „einzigen“ hebt wie μία die Einheit dieses Zeitraums hervor.
