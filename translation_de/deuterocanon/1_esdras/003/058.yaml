translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das im Griechischen nur mitgedachte Subjekt wird entsprechend der vorliegenden englischen Konsultationsfassung mit dem neutralen Pronomen „es“ aufgenommen; die knappe Satzstruktur des Ausgangstextes bleibt erhalten.
