translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau wurde für gute Verständlichkeit leicht geglättet; die Wiederaufnahme durch »demjenigen« bewahrt die Hervorhebung des Siegers. Sämtliche Fußnotenmarker stehen unmittelbar bei der betreffenden Formulierung.
