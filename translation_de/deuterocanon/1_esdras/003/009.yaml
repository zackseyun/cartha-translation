revisions:
- from: 'Und sie sagten: »Wenn der König aufsteht, soll man ihm das Schriftstück[a] geben. Und demjenigen, von dem der König und die drei Großen Persiens urteilen, dass sein Wort das weiseste ist[b], soll der Sieg zuerkannt werden, wie es geschrieben steht.«'
  to: 'Und sie sagten: »Wenn der König aufsteht, werden sie ihm das Schriftstück[a] geben; und demjenigen, dessen Wort der König und die drei hohen Würdenträger Persiens für weiser halten[b], wird der Sieg zuerkannt werden, wie es geschrieben steht.«'
  rationale: Die notwendige Korrektur ersetzt den unzutreffenden Superlativ durch den griechischen Komparativ. Die Satzfügung wurde behutsam geglättet; sie bewahrt, dass König und persische Würdenträger gemeinsam über denjenigen entscheiden, dessen λόγος als weiser beurteilt wird. Die Fußnotenanker und ihre Zuordnung bleiben vollständig erhalten.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T10:07:26Z'
review_pass:
  verdict: revise
  source_fidelity: 'Eine sachliche Korrektur ist nötig: σοφώτερος ist ein Komparativ („weiser“), nicht ein Superlativ („das weiseste“). Die überarbeitete Fassung wahrt zudem die offene, im Griechischen nur implizite Vergleichsbasis.'
  naturalness: Die Umschreibung mit „dessen Wort ... für weiser halten“ ist modernes, flüssiges Standarddeutsch und gibt die wertende Gerichtsentscheidung natürlich wieder. „Hohe Würdenträger“ ist hier verständlicher und idiomatischer als der substantivierte Rangtitel „die Großen“.
  terminology: „Schriftstück“, „Wort“, „Sieg“ und „wie es geschrieben steht“ sind quellentreu. Die Fußnote zu λόγος erhält die möglichen kontextuellen Bedeutungen, ohne die Übersetzung einseitig auf „Argument“ festzulegen.
  issues:
  - severity: medium
    issue: „das weiseste“ statt „weiser“
    rationale: Das griechische σοφώτερος steht im Komparativ. Der deutsche Superlativ verändert die Aussage, indem er den Gewinner ausdrücklich als den Weisesten aller Beteiligten bezeichnet; der griechische Vergleich bleibt formal offen bzw. kontextuell erschlossen.
  - severity: low
    issue: „die drei Großen Persiens“
    rationale: Die Wiedergabe ist zwar möglich, klingt im modernen Standarddeutsch jedoch rangtitelhaft und ungewohnt. „die drei hohen Würdenträger Persiens“ vermittelt μεγιστᾶνες klar und natürlich.
