base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/003/009.yaml
  text: And they said[a], “When the king rises, they will give him the writing; and the one whom the king and the three nobles of Persia judge to be the one whose word is wiser, to him the victory will be given[b], as it is written.”
translation:
  language: de
  text: 'Und sie sagten: »Wenn der König aufsteht, werden sie ihm das Schriftstück[a] geben; und demjenigen, dessen Wort der König und die drei hohen Würdenträger Persiens für weiser halten[b], wird der Sieg zuerkannt werden, wie es geschrieben steht.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »das Schreiben« beziehungsweise »das Dokument«.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »dass sein λόγος weiser ist«. λόγος kann hier »Wort«, »Aussage« oder »Argument« bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγερθῇ
  choice: aufsteht
  rationale: Das Verb bezeichnet hier das Aufstehen beziehungsweise Sich-Erheben des Königs, wahrscheinlich vom Schlaf oder Lager, ohne dies ausdrücklich festzulegen.
- source_word: τὸ γράμμα
  choice: das Schriftstück
  rationale: γράμμα bezeichnet hier die schriftlich festgehaltene Antwort oder Erklärung. »Schriftstück« ist im Deutschen natürlich und vermeidet die Engführung auf einen Brief.
- source_word: κρίνῃ
  choice: urteilen
  rationale: Das Verb bezeichnet eine prüfende, wertende Entscheidung im Rahmen des Wettstreits.
- source_word: μεγιστᾶνες
  choice: die drei Großen
  rationale: Der Ausdruck bezeichnet hochrangige persische Würdenträger. »Große« bewahrt den Rangtitel und den feierlichen Hofkontext.
- source_word: Περσίδος
  choice: Persiens
  rationale: Der Genitiv verweist auf das persische Reich beziehungsweise den persischen Hof.
- source_word: ὁ λόγος αὐτοῦ σοφώτερος
  choice: dass sein Wort das weiseste ist
  rationale: λόγος kann Wort, Aussage oder Argument bedeuten. »Sein Wort« erhält die lexikalische Offenheit; der deutsche Superlativ entspricht idiomatisch dem Vergleich innerhalb der Gruppe der Teilnehmer.
- source_word: τὸ νῖκος
  choice: der Sieg
  rationale: νῖκος bezeichnet unmittelbar den Sieg beziehungsweise den Ausgang als Gewinner.
- source_word: καθὼς γέγραπται
  choice: wie es geschrieben steht
  rationale: Die Formulierung gibt den griechischen Perfektpassiv wieder und verweist hier auf die schriftlich festgelegten Bedingungen.
