lexical_decisions:
- source_word: ὁ ἕτερος
  choice: Der andere
  rationale: Der substantivierte Ausdruck mit Artikel bezeichnet den anderen beziehungsweise nächsten der bereits eingeführten Schreiber. »Der andere« ist im Deutschen knapp und natürlich, ohne ausdrücklich »der zweite« in den Text einzutragen.
- source_word: ἔγραψεν
  choice: schrieb
  rationale: Der Aorist von γράφω bezeichnet hier schlicht den vollzogenen Schreibakt; eine speziellere Wiedergabe wie »schrieb nieder« oder »ritzte ein« ist nicht erforderlich.
- source_word: Ὑπερισχύει
  choice: ist stärker
  rationale: ὑπερισχύω drückt überlegene Stärke beziehungsweise das Sich-Durchsetzen aus. Im Zusammenhang der konkurrierenden Thesen bewahrt »ist stärker« die vergleichende Aussage, ohne sie ausdrücklich zum Superlativ »ist am stärksten« zu steigern.
- source_word: ὁ βασιλεύς
  choice: der König
  rationale: βασιλεύς ist die gewöhnliche und präzise Bezeichnung für einen König; das allgemeinere »Herrscher« wäre weniger genau.
