  yaml_path: translation/deuterocanon/1_esdras/003/022.yaml
  text: And when they rise from the wine[a], they do not remember what they did.
translation:
  language: de
  text: Und wenn sie sich vom Wein erheben[a], erinnern sie sich nicht an das, was sie getan haben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „wenn sie sich vom Wein erheben“. Gemeint ist das Aufstehen, nachdem sie unter der Wirkung des Weins gestanden haben; die Formulierung besagt nicht ausdrücklich, dass sie bereits völlig nüchtern sind.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν
  choice: wenn
  rationale: Leitet hier einen allgemein geltenden temporalen Nebensatz ein; „wenn“ ist im modernen Deutsch natürlich und bewahrt den Sinn, ohne das stärker distributive „wann immer“ aufzudrängen.
- source_word: ἀπὸ τοῦ οἴνου
  choice: vom Wein
  rationale: Bewahrt das konkrete griechische Bild „vom Wein“ und vermeidet die interpretierende Festlegung auf „Trunkenheit“ oder vollständige Ernüchterung.
- source_word: ἐγερθῶσιν
  choice: sie sich erheben
  rationale: Gibt ἐγείρω als Aufstehen beziehungsweise Sich-Erheben wieder. Die reflexive deutsche Form ist idiomatisch; „nüchtern werden“ würde die Aussage überinterpretieren.
- source_word: οὐ μέμνηται
  choice: sie sich nicht erinnern
  rationale: Trotz der Singularform μέμνηται im überlieferten Text verlangt der pluralische Zusammenhang im Deutschen eine sinngemäße Pluralwiedergabe.
- source_word: ἃ ἔπραξαν
  choice: an das, was sie getan haben
  rationale: Gibt den Relativsatz klar und natürlich wieder; das Perfekt entspricht im gegenwärtigen Standarddeutsch dem Rückblick auf ihre zuvor vollzogenen Handlungen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnliche konkrete Wendung „sich vom Wein erheben“ bleibt erhalten und wird in der Fußnote erläutert, damit die Bildsprache und ihre begrenzte Aussageweite nicht eingeebnet werden.
