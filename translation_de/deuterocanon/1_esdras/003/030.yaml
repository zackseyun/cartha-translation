  text: And he alone[a], if he says to kill, they kill; if he says to release, they release.
translation:
  language: de
  text: 'Und obwohl er nur einer ist: Wenn er befiehlt, zu töten, töten sie; wenn er befiehlt, freizulassen[a], lassen sie frei.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „gehen zu lassen“; je nach Zusammenhang kann das griechische Verb auch „erlassen“ oder „vergeben“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ αὐτὸς εἰ μόνος ἐστίν
  choice: Und obwohl er selbst nur einer ist
  rationale: Die Wendung hebt den Gegensatz zwischen dem einen Herrscher und den vielen Ausführenden hervor. Das konditionale εἰ hat hier im Zusammenhang einen konzessiven Sinn; „obwohl“ gibt diesen Gegensatz in natürlichem Deutsch wieder.
- source_word: ἐὰν εἴπῃ
  choice: wenn er sagt
  rationale: Die Konstruktion bezeichnet allgemein den Fall, dass er einen Befehl ausspricht. Die schlichte Wiedergabe bewahrt die knappe Formulierung des Griechischen.
- source_word: ἀποκτεῖναι / ἀποκτέννουσιν
  choice: man solle töten / töten sie
  rationale: „Töten“ gibt das griechische Verb direkt wieder, ohne es unnötig auf eine gerichtliche Hinrichtung einzuengen. „Man solle“ macht im Deutschen deutlich, dass der Infinitiv den Inhalt seiner Anordnung bezeichnet.
- source_word: ἀφεῖναι / ἀφίουσιν
  choice: man solle freilassen / lassen sie frei
  rationale: Im Gegensatz zum Töten bezeichnet das Verb hier am ehesten die Freilassung einer Person. Die deutsche Formulierung bleibt verständlich, ohne den Sinn ausdrücklich auf Begnadigung festzulegen.
