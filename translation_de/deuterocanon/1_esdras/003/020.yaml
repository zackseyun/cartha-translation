base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/003/020.yaml
  text: and it makes every heart rich[a], and it remembers neither king nor satrap; and it makes everything speak in terms of talents.
translation:
  language: de
  text: und es macht alle Herzen reich und denkt weder an König noch an Satrap; und es bringt alle dazu, in Talenten zu reden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher kann der letzte Satzteil lauten: »und es lässt alles durch Talente reden«. Das griechische πάντα kann »alle« oder »alles« bedeuten; Talente waren Gewichts- und Geldeinheiten. Sinngemäß kann die Aussage bedeuten, dass es alle dazu bringt, in Geldbeträgen zu reden.'
    reason: Die ungewöhnliche griechische Wendung, die Mehrdeutigkeit von πάντα und die wirtschaftliche Bedeutung von Talenten sollen sichtbar bleiben, ohne den Haupttext unnötig schwer verständlich zu machen.
lexical_decisions:
- source_word: πάσας καρδίας ποιεῖ πλουσίας
  choice: es macht alle Herzen reich
  rationale: Die Formulierung bewahrt sowohl die einfache griechische Konstruktion als auch das Bild vom Herzen als innerem Menschen und die wirtschaftliche Bildsprache von »reich«.
- source_word: οὐ μέμνηται
  choice: denkt weder an
  rationale: μέμνημαι bedeutet wörtlich »sich erinnern, im Sinn haben«. »Denkt weder an« bleibt diesem Bild nahe und drückt im Zusammenhang zugleich fehlende Rücksichtnahme aus.
- source_word: βασιλέα οὐδὲ σατράπην
  choice: weder an einen König noch an einen Satrapen
  rationale: »Satrap« bewahrt den konkreten persischen Amtstitel und damit das historische Kolorit.
- source_word: πάντα
  choice: alle
  rationale: Das formal sächliche Pluralwort kann »alles« oder im Zusammenhang Personen kollektiv bezeichnen. Da λαλεῖν menschliches Reden meint, ist »alle« im Haupttext natürlich; die formale Mehrdeutigkeit wird in der Fußnote offengelegt.
- source_word: διὰ ταλάντων
  choice: von Talenten
  rationale: τάλαντον bezeichnet hier eine Gewichts- und Geldeinheit. »Von Talenten reden« wahrt den historischen Begriff und vermittelt den wahrscheinlichen Bezug des Redens auf Geldbeträge.
- source_word: ποιεῖ λαλεῖν
  choice: bringt ... dazu, ... zu reden
  rationale: Diese deutsche Kausativkonstruktion gibt ποιεῖ mit ergänzendem Infinitiv natürlich und genau wieder.
