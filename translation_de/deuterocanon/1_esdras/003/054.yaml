  yaml_path: translation/deuterocanon/1_esdras/003/054.yaml
  text: And besides this[a], the king stared at her with his mouth open; and if she laughs at him, he laughs; but if she becomes angry with him, he flatters her so that she may be reconciled to him.
translation:
  language: de
  text: Und außerdem starrte der König sie mit offenem Mund an. Wenn sie ihn anlacht,[a] lacht er; wenn sie ihm aber böse wird, schmeichelt er ihr, damit sie sich mit ihm versöhnt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wenn sie mit ihm lacht, lacht er.“ Der griechische Dativ nach „lacht“ lässt hier mehr als eine relationale Deutung zu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸς τούτοις
  choice: außerdem
  rationale: Gibt den hinzufügenden, steigernden Übergang idiomatisch und knapp wieder.
- source_word: χάσκων τὸ στόμα
  choice: mit offenem Mund
  rationale: Bewahrt das anschauliche körperliche Bild, ohne durch eine wertende Wiedergabe wie „gaffend“ einen zusätzlichen abfälligen Ton einzutragen.
- source_word: ἐθεώρει
  choice: betrachtet
  rationale: Bezeichnet ein anhaltendes, aufmerksames Anschauen und passt im Deutschen zum präsentischen Fortgang der Aussage.
- source_word: ἐὰν γελάσῃ αὐτῷ, γελᾷ
  choice: Wenn sie ihn anlacht, lacht er
  rationale: Bewahrt die Wiederholung von γελάω und gibt den relationalen Dativ αὐτῷ natürlich wieder; die mögliche Bedeutung „mit ihm“ wird in der Fußnote offengehalten.
- source_word: πικρανθῇ ἐπʼ αὐτόν
  choice: wenn sie ihm aber böse wird
  rationale: Natürliches modernes Deutsch für das gegen ihn gerichtete Bitter- oder Zornigwerden.
- source_word: κολακεύει αὐτήν
  choice: schmeichelt er ihr
  rationale: Direkte und transparente Wiedergabe des werbenden, auf Gunst zielenden Verhaltens.
- source_word: ὅπως διαλλαγῇ αὐτῷ
  choice: damit sie sich wieder mit ihm versöhnt
  rationale: Gibt die beabsichtigte Wiederherstellung des Einvernehmens wieder; „wieder“ macht den in διαλλάσσομαι liegenden Gedanken erneuter Aussöhnung idiomatisch deutlich.
