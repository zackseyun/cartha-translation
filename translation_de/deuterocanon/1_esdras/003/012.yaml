  yaml_path: translation/deuterocanon/1_esdras/003/012.yaml
  text: The third wrote[a], “Women are stronger, but above all things truth is victorious.”
translation:
  language: de
  text: 'Der Dritte schrieb[a]: »Die Frauen sind stärker, doch die Wahrheit siegt über alles.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Die Frauen setzen sich durch, doch die Wahrheit bezwingt alles.«'
    reason: Lexikalische Alternative für ὑπερισχύουσιν und die Verbindung von ὑπὲρ πάντα mit νικᾷ.
lexical_decisions:
- source_word: ὁ τρίτος
  choice: Der Dritte
  rationale: Der Artikel mit der Ordnungszahl wird substantivisch gebraucht und bezeichnet den dritten Teilnehmer.
- source_word: ἔγραψεν
  choice: schrieb
  rationale: Der Aorist von γράφω bezeichnet hier schlicht das Niederschreiben des Ausspruchs.
- source_word: Ὑπερισχύουσιν
  choice: sind stärker
  rationale: Die Wiedergabe drückt die überlegene Stärke aus und hält den Ausdruck von νικᾷ im zweiten Satzteil auseinander.
- source_word: αἱ γυναῖκες
  choice: die Frauen
  rationale: Der allgemeine, sprichwortartige Zusammenhang spricht für »Frauen«, nicht für die mögliche engere Bedeutung »Ehefrauen«.
- source_word: ὑπὲρ δὲ πάντα
  choice: doch über alles
  rationale: Die Formulierung bewahrt den steigernden Gegensatz und lässt zugleich offen, ob die Wahrheit alles überragt oder über alles triumphiert.
- source_word: νικᾷ
  choice: siegt
  rationale: νικάω bedeutet »siegen« oder »bezwingen«; »siegt« ist mit dem abstrakten Subjekt »Wahrheit« natürlich und bewahrt den triumphalen Sinn.
- source_word: ἡ ἀλήθεια
  choice: die Wahrheit
  rationale: Im Deutschen verlangt das abstrakte Substantiv in dieser Aussage gewöhnlich den bestimmten Artikel, der zugleich dem griechischen Artikel entspricht.
theological_decisions:
- issue: Bezug und Aussagekraft von ὑπὲρ πάντα bei der Wahrheit
  choice: über alles siegt die Wahrheit
  alternative: die Wahrheit bezwingt alles
  rationale: Die gewählte Fassung erhält die ungewöhnliche, emphatische Stellung der Präpositionalphrase und die Spannung zwischen Überlegenheit und Sieg, ohne sie auf ein ausdrückliches direktes Objekt festzulegen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, knappem Spruchstil. Die beiden griechischen Verben werden durch »sind stärker« und »siegt« unterschieden.
