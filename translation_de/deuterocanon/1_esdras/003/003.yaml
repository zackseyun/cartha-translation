base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/003/003.yaml
  text: And they ate and drank[a], and when they were filled, they departed. But Darius the king went into his bedchamber and slept[b], and then awoke.
translation:
  language: de
  text: Sie aßen und tranken, und als sie satt waren, gingen sie fort.[a] König Darius aber zog sich in sein Schlafgemach zurück, schlief und wachte auf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „brachen sie auf“; das griechische Verb kann hier das Auseinandergehen der Gesellschaft nach dem Mahl bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐφάγοσαν καὶ ἐπίοσαν
  choice: sie aßen und tranken
  rationale: Die beiden Aoristformen bezeichnen schlichte, aufeinander bezogene Erzählhandlungen; die einfache Vergangenheitsform gibt dies im Deutschen natürlich wieder.
- source_word: ἐμπλησθέντες
  choice: als sie satt waren
  rationale: Das Partizip bezeichnet konkret, dass sie nach dem Essen und Trinken gesättigt waren. „Satt“ ist natürlich und bewahrt den körperlichen Sinn.
- source_word: ἀνέλυσαν
  choice: gingen sie fort
  rationale: Im Zusammenhang mit dem Ende des Mahls bedeutet das Verb, dass die Versammelten aufbrachen beziehungsweise weggingen.
- source_word: ἀνέλυσεν εἰς τὸν κοιτῶνα
  choice: zog sich in sein Schlafgemach zurück
  rationale: Beim König bezeichnet dasselbe Verb die Bewegung in das Schlafgemach. „Zog sich … zurück“ passt idiomatisch zum Wechsel von der Gesellschaft in den privaten Raum.
- source_word: κοιτῶνα
  choice: Schlafgemach
  rationale: Das Wort bezeichnet einen Schlafraum. „Schlafgemach“ wahrt den königlichen Erzählton, ohne unverständlich zu wirken.
- source_word: ἐκοιμήθη
  choice: schlief
  rationale: In diesem Zusammenhang hat die Form den einfachen Sinn „schlafen“; die Übersetzung vermeidet die zusätzliche Festlegung, ob ausdrücklich das Einschlafen gemeint ist.
- source_word: ἔξυπνος ἐγένετο
  choice: wachte wieder auf
  rationale: Wörtlich heißt die Wendung „wurde wach“. „Wachte wieder auf“ ist im Deutschen die natürliche Wiedergabe der folgenden Zustandsänderung.
- source_word: ὁ δὲ Δαρεῖος ὁ βασιλεύς
  choice: König Darius aber
  rationale: δέ markiert den Übergang von der Gesellschaft zum König und einen leichten Gegensatz; die Nachstellung von „aber“ ist im Deutschen natürlich.
