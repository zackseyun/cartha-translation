base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/003/008.yaml
  text: And then[a], after each had written his own statement, they sealed them and placed them under the pillow of Darius the king,
translation:
  language: de
  text: Dann, nachdem jeder seine eigene Aussage aufgeschrieben hatte, versiegelten sie die Schriftstücke und legten sie unter das Kopfkissen[a] des Königs Darius.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „unter die Kopfstütze des Königs Darius“. Das griechische Wort kann ein Kopfkissen oder eine Kopfstütze bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Dann
  rationale: Das temporale Adverb kennzeichnet den nächsten Schritt der Erzählung; „Dann“ ist knapp und natürlich.
- source_word: γράψαντες ἕκαστος
  choice: nachdem jeder … aufgeschrieben hatte
  rationale: Der Aoristpartizip drückt eine Handlung aus, die den beiden finiten Verben vorausgeht; der deutsche temporale Nebensatz bildet diese Abfolge klar ab.
- source_word: τὸν ἑαυτοῦ λόγον
  choice: seine eigene Aussage
  rationale: λόγος bezeichnet hier den schriftlich festgehaltenen Satz oder Standpunkt jedes Teilnehmers. „Aussage“ bewahrt den Sinn, ohne ihn stärker als „Argument“ auszudeuten.
- source_word: ἐσφραγίσαντο
  choice: versiegelten sie die Schriftstücke
  rationale: Das im Griechischen nicht ausdrücklich wiederholte Objekt ergibt sich aus dem zuvor Geschriebenen. „die Schriftstücke“ macht den Bezug im Deutschen verständlich.
- source_word: ἔθηκαν
  choice: legten sie
  rationale: Das schlichte Erzählverb wird im Zusammenhang mit einem Gegenstand unter einem Kissen idiomatisch durch „legen“ wiedergegeben.
- source_word: ὑπὸ τὸ προσκεφάλαιον
  choice: unter das Kopfkissen
  rationale: προσκεφάλαιον kann ein Kissen oder eine Kopfstütze bezeichnen. „Kopfkissen“ ist die verständlichste Wiedergabe; die mögliche Alternative wird in der Fußnote genannt.
- source_word: Δαρείου τοῦ βασιλέως
  choice: des Königs Darius
  rationale: Die deutsche Genitivfügung gibt den griechischen Ausdruck natürlich und in würdigem Erzählstil wieder.
