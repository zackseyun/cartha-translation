  text: And a man takes his sword and goes out to campaign and to plunder and to steal[a], and to sail on the sea and rivers,
translation:
  language: de
  text: Und ein Mann nimmt sein Schwert und zieht aus, um Feldzüge zu unternehmen[a], zu plündern und zu stehlen und zur See und auf Flüssen zu fahren,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „auf Kriegszug zu gehen“, „zu einer Unternehmung auszuziehen“ oder allgemeiner: „Krieg zu führen“; so kann das griechische ἐξοδεύειν verstanden werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λαμβάνει
  choice: nimmt
  rationale: Das gewöhnliche Verb „nehmen“ gibt die konkrete Handlung schlicht und natürlich wieder.
- source_word: ἄνθρωπος
  choice: ein Mann
  rationale: Der griechische Singular bezeichnet in diesem rhetorischen Zusammenhang einen einzelnen Mann; „ein Mann“ bewahrt diese Form.
- source_word: ῥομφαίαν αὐτοῦ
  choice: sein Schwert
  rationale: ῥομφαία kann eine größere Schwertart bezeichnen; „Schwert“ ist im Deutschen klar und vermeidet eine unbelegte Spezifizierung.
- source_word: ἐκπορεύεται
  choice: zieht aus
  rationale: „Zieht aus“ bewahrt die konkrete Bewegung des Verbs und passt idiomatisch zum folgenden Feldzug.
- source_word: ἐξοδεύειν
  choice: Feldzüge zu unternehmen
  rationale: Das Verb bezeichnet hier wahrscheinlich das Ausziehen zu einem militärischen Unternehmen. Die Wiedergabe ist natürlich, ohne die mögliche Bedeutung unnötig auf das eigentliche Kriegführen zu verengen.
- source_word: λῃστεύειν
  choice: zu plündern
  rationale: Im Zusammenhang mit bewaffneten Unternehmungen bezeichnet das Verb gewaltsames Rauben; „plündern“ trifft diesen Sinn besser als das allgemeinere „rauben“.
- source_word: κλέπτειν
  choice: zu stehlen
  rationale: Dies ist die übliche Bedeutung und erhält den Unterschied zum offenen, gewaltsamen Plündern.
- source_word: εἰς τὴν θάλασσαν πλεῖν καὶ ποταμούς
  choice: zur See und auf Flüssen zu fahren
  rationale: Die idiomatische deutsche Wendung gibt das Befahren des Meeres und der Flüsse klar wieder; „fahren“ kann hier die Seefahrt wie auch die Fahrt auf Flüssen umfassen.
