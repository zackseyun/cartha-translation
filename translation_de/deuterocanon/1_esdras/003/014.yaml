  text: And he sent and summoned all the nobles of Persia and Media[a], and the satraps and generals and local rulers and governors[b],
translation:
  language: de
  text: Und er sandte aus[a] und berief alle Großen Persiens und Mediens sowie die Satrapen, Heerführer, Bezirksvorsteher und obersten Amtsträger.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, formaler: »Nachdem er ausgesandt hatte, berief er …« Das Griechische nennt nicht ausdrücklich, wen oder was er aussandte; gemeint sein können etwa Boten oder Anordnungen.'
    reason: lexical_alternative
  - marker: b
    text: Die Reihe nennt Titel der persischen Reichsverwaltung. Das mit »Bezirksvorsteher« wiedergegebene Wort kann auch als »Toparchen« übertragen werden; bei den »obersten Amtsträgern« ist die genaue Amtsbezeichnung unsicher.
    reason: cultural_note
lexical_decisions:
- source_word: ἐξαποστείλας
  choice: er sandte Boten aus
  rationale: Das Aoristpartizip bezeichnet eine dem Zusammenrufen vorausgehende Aussendung. »Boten« ist im Griechischen nicht ausdrücklich genannt, ergibt sich aber als naheliegendes Objekt aus dem Vorgang; die Ergänzung wird in der Fußnote offengelegt.
- source_word: ἐκάλεσεν
  choice: ließ … zusammenrufen
  rationale: Bei einem Herrscher und seinen Amtsträgern ist ein offizielles Zusammenrufen gemeint, nicht eine unverbindliche Einladung. Die Konstruktion verbindet sich im Deutschen natürlich mit dem vorausgehenden Aussenden von Boten.
- source_word: μεγιστᾶνας
  choice: Großen
  rationale: Der Ausdruck bezeichnet die ranghöchsten oder vornehmsten Männer des Reiches. »Großen« ist knapp, historisch passend und vermeidet eine zu enge Festlegung auf erblichen Adel.
- source_word: Περσίδος καὶ τῆς Μηδείας
  choice: Persiens und Mediens
  rationale: Übliche deutsche Namen der beiden Länder beziehungsweise Regionen.
- source_word: σατράπας
  choice: Satrapen
  rationale: Der historisch spezifische persische Amtstitel wird als im Deutschen geläufiges Lehnwort beibehalten.
- source_word: στρατηγοὺς
  choice: Heerführer
  rationale: Gibt die militärische Leitungsfunktion klar wieder, ohne einen neuzeitlichen Dienstrang wie »General« vorauszusetzen.
- source_word: τοπάρχας
  choice: Bezirksvorsteher
  rationale: Bezeichnet Leiter örtlicher Verwaltungsgebiete. Die funktionale Wiedergabe ist verständlicher als das seltene Fremdwort »Toparchen«.
- source_word: ὑπάτους
  choice: höchsten Amtsträger
  rationale: Das Wort bezeichnet hier wahrscheinlich hochrangige Amtspersonen. Diese Wiedergabe vermeidet, die römisch geprägte Bedeutung »Konsuln« oder erneut die Bezeichnung »Statthalter« in die persische Verwaltung hineinzulesen.
