  text: And he said[a], “Call the young men, and they will declare their words.” And they were called, and they entered.
translation:
  language: de
  text: 'Und er sagte: „Ruft die jungen Männer, und sie werden ihre Worte[a] darlegen.“ Da wurden sie gerufen und traten ein.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „ihre Aussagen bekannt machen“ beziehungsweise „ihre Argumente vortragen“. Das griechische λόγους kann Worte, Aussagen oder Argumente bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καλέσατε
  choice: Ruft
  rationale: Der Aoristimperativ Plural von καλέω verlangt hier eine unmittelbare Aufforderung. „Ruft“ ist im Deutschen natürlich und bewahrt durch „gerufen“ im Folgesatz die Wiederholung des griechischen Verbs.
- source_word: τοὺς νεανίσκους
  choice: die jungen Männer
  rationale: νεανίσκους bezeichnet junge Männer; im Zusammenhang sind die männlichen Teilnehmer am Hof gemeint. „Junge Männer“ ist heute klarer und natürlicher als „Jünglinge“.
- source_word: δηλώσουσιν
  choice: sie werden … darlegen
  rationale: Das Futur von δηλόω bedeutet, etwas deutlich oder bekannt zu machen. „Darlegen“ passt zur öffentlichen Vorstellung ihrer Aussagen und bewahrt den Zukunftsbezug.
- source_word: τοὺς λόγους αὐτῶν
  choice: ihre Worte
  rationale: λόγους kann Worte, Aussagen oder Argumente bezeichnen. „Ihre Worte“ erhält die Weite des griechischen Ausdrucks; mögliche kontextuelle Präzisierungen werden in der Fußnote genannt.
- source_word: ἐκλήθησαν
  choice: sie wurden gerufen
  rationale: Der Aorist Passiv von καλέω wird mit demselben deutschen Verbstamm wie der vorangehende Imperativ wiedergegeben, sodass die Wiederholung des Griechischen sichtbar bleibt.
- source_word: εἰσήλθοσαν
  choice: traten ein
  rationale: Der Aorist von εἰσέρχομαι bezeichnet ihr Eintreten. „Traten ein“ ist knapp, natürlich und dem höfischen Erzählzusammenhang angemessen.
