  yaml_path: translation/deuterocanon/1_esdras/003/002.yaml
  text: and to all the satraps and generals and governors under him[a], from India to Ethiopia, in the one hundred twenty-seven satrapies.
translation:
  language: de
  text: und an alle Satrapen, Heerführer und Bezirksvorsteher, die ihm unterstanden, in den hundertsiebenundzwanzig Satrapien von Indien bis Äthiopien.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in den hundertsiebenundzwanzig Provinzen“. Das Griechische verwendet einen persischen Verwaltungsbegriff, der hier entsprechend mit „Satrapien“ wiedergegeben wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σατράπαις
  choice: Satrapen
  rationale: Der etablierte deutsche Titel bewahrt die spezifisch persische Amtsbezeichnung.
- source_word: στρατηγοῖς
  choice: Heerführer
  rationale: Das Wort bezeichnet hier am natürlichsten militärische Befehlshaber; „Heerführer“ ist verständlich und würdevoll.
- source_word: τοπάρχαις
  choice: Bezirksvorsteher
  rationale: Gemeint sind Leiter örtlicher Verwaltungsgebiete; die Wiedergabe unterscheidet dieses Amt klar von den Satrapen.
- source_word: τοῖς ὑπʼ αὐτόν
  choice: die ihm unterstanden
  rationale: Die Formulierung gibt die politische Unterordnung unter den König natürlich und präzise wieder.
- source_word: ἀπὸ τῆς Ἰνδικῆς μέχρι Αἰθιοπίας
  choice: von Indien bis Äthiopien
  rationale: Dies ist die idiomatische deutsche Wiedergabe der geografischen Spannweite.
- source_word: ἐν ταῖς ἑκατὸν εἴκοσι ἑπτὰ σατραπείαις
  choice: in den hundertsiebenundzwanzig Satrapien
  rationale: „Satrapien“ wahrt den persischen Verwaltungsbezug und entspricht dem zuvor verwendeten Titel „Satrapen“.
