lexical_decisions:
- source_word: ἐθεώρουν
  choice: Ich sah
  rationale: Die kontrahierte Imperfektform kann formal sowohl die 1. Person Singular als auch die 3. Person Plural bezeichnen. Im Zusammenhang einer Rede passt die erste Person Singular; das deutsche Präteritum gibt den erzählenden Verlauf natürlich wieder.
- source_word: Ἀπάμην
  choice: Apame
  rationale: Der griechische Akkusativ wird als im Deutschen deklinierter Eigenname Apame wiedergegeben; Apama ist eine ebenfalls gebräuchliche Namensform.
- source_word: θυγατέρα
  choice: Tochter
  rationale: Die unmittelbare Verwandtschaftsbezeichnung wird ohne Umschreibung beibehalten.
- source_word: Βαρτάκου
  choice: Bartakus
  rationale: Der Personenname wird in einer dem Deutschen angepassten Transliteration wiedergegeben.
- source_word: τοῦ θαυμαστοῦ
  choice: des bewundernswerten
  rationale: Das Epitheton bezeichnet Bartakus als bewundernswert oder bemerkenswert. Die Wiedergabe erhält den beschreibenden Charakter, ohne daraus einen amtlichen Titel zu machen.
- source_word: παλλακὴν
  choice: Nebenfrau
  rationale: Das Wort bezeichnet spezifisch eine Frau in einer der Ehefrau nachgeordneten Verbindung. „Nebenfrau“ ist präzise und im Deutschen verständlicher als das Fremdwort „Konkubine“.
- source_word: καθημένην
  choice: sitzen
  rationale: Das feminine Partizip bezieht sich auf Apame und bezeichnet ihre Haltung; in Verbindung mit „sah“ ist der deutsche Infinitiv natürlich.
- source_word: ἐν δεξιᾷ τοῦ βασιλέως
  choice: zur Rechten des Königs
  rationale: Die feste deutsche Wendung bewahrt sowohl die räumliche Angabe als auch den möglichen Rang- und Ehrenaspekt.
