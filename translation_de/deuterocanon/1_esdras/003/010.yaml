lexical_decisions:
- source_word: ὁ εἷς
  choice: Der eine
  rationale: Die Wendung bezeichnet einen aus der Gruppe der Teilnehmer. »Der eine« gibt den griechischen Ausdruck knapp und im Deutschen natürlich wieder.
- source_word: ἔγραψεν
  choice: schrieb
  rationale: Der Aorist berichtet eine einzelne Handlung in der Erzählfolge; das deutsche Präteritum ist dafür angemessen.
- source_word: Ὑπερισχύει
  choice: ist stärker
  rationale: Das Verb bezeichnet Überlegenheit beziehungsweise das Sich-Durchsetzen. Die komparative Wiedergabe vermeidet es, den nicht ausdrücklich vorhandenen Superlativ »am stärksten« in den Text einzutragen.
- source_word: ὁ οἶνος
  choice: der Wein
  rationale: Der Artikel kann hier eine Gattung bezeichnen. Im Deutschen ist »der Wein« als allgemeine Aussage idiomatisch und bewahrt die Form des griechischen Ausdrucks.
