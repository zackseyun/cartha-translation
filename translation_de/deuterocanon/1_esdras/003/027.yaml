base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/003/027.yaml
  text: If she tells them to make war[a], one against another, they do it; but if she sends them out against the enemies, they go and tear down the mountains and the walls and the towers.
translation:
  language: de
  text: Wenn sie ihnen sagt, sie sollen gegeneinander Krieg führen, tun sie es; wenn sie sie aber gegen die Feinde aussendet, ziehen sie los und reißen die Berge, die Mauern und die Türme nieder[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »bezwingen« oder »zerstören«. Das griechische Verb κατεργάζονται bezeichnet hier eine gewaltsame Einwirkung auf Gelände und Befestigungen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν εἴπῃ αὐτοῖς
  choice: Wenn sie ihnen sagt
  rationale: Die Konstruktion mit ἐάν und Konjunktiv beschreibt einen allgemeinen Fall. »Sagt« gibt εἴπῃ ohne die zusätzliche Förmlichkeit von »befiehlt« wieder; der folgende Inhalt macht den auffordernden Sinn deutlich.
- source_word: ποιῆσαι πόλεμον
  choice: sie sollen … Krieg führen
  rationale: »Krieg führen« ist die natürliche deutsche Entsprechung des griechischen Idioms; die Infinitivkonstruktion wird idiomatisch durch einen mit »sollen« eingeleiteten Inhaltssatz wiedergegeben.
- source_word: ἕτερος πρὸς τὸν ἕτερον
  choice: gegeneinander
  rationale: Das kompakte deutsche Adverb gibt den wechselseitigen Sinn der griechischen Wendung klar und natürlich wieder.
- source_word: ποιοῦσιν
  choice: tun sie es
  rationale: Das allgemeine Verb greift die zuvor genannte Aufforderung wieder auf. Die knappe Formulierung bewahrt diese Wiederaufnahme.
- source_word: ἐξαποστείλῃ αὐτούς
  choice: sie sie … aussendet
  rationale: '»Aussendet« spiegelt die Bedeutung des zusammengesetzten Verbs, jemanden hinaus- beziehungsweise fortzusenden. Die doppelte Form »sie sie« ist grammatisch eindeutig: zuerst Subjekt, dann Objekt.'
- source_word: πρὸς τοὺς πολεμίους
  choice: gegen die Feinde
  rationale: Im militärischen Zusammenhang gibt »gegen« die feindliche Ausrichtung idiomatisch wieder.
- source_word: βαδίζουσιν
  choice: ziehen sie los
  rationale: Das Verb bezeichnet das Gehen oder Voranschreiten. »Ziehen los« ist in diesem militärischen Zusammenhang natürlich, ohne ausdrücklich das stärker spezifizierende »marschieren« einzutragen.
- source_word: κατεργάζονται
  choice: reißen … nieder
  rationale: Bei Bergen, Mauern und Türmen bezeichnet das Verb eine gewaltsame, zerstörerische Einwirkung. »Niederreißen« ist anschaulich, während eine Fußnote die semantische Breite des Verbs offenhält.
- source_word: τὰ ὄρη
  choice: die Berge
  rationale: Dies ist die unmittelbare lexikalische Bedeutung. Sie wird trotz der ungewöhnlichen Verbindung mit »niederreißen« nicht zu »Befestigungen« umgedeutet.
- source_word: τὰ τείχη
  choice: die Mauern
  rationale: Das Wort bezeichnet besonders Wehr- oder Stadtmauern; »Mauern« wahrt die knappe Aufzählung.
- source_word: τοὺς πύργους
  choice: die Türme
  rationale: Die gewöhnliche Bedeutung passt zu den in der militärischen Aufzählung genannten Verteidigungsanlagen.
theological_decisions:
- issue: Bezug des unausgesprochenen femininen Subjekts
  choice: Durchgehend »sie«, bezogen auf die Frau im umgebenden Gedankengang
  alternative: Das Subjekt ausdrücklich als »die Frau« wiederholen
  rationale: Die griechischen Verbformen nennen in diesem Vers kein ausdrückliches Subjekt; aus dem unmittelbaren Kontext ist jedoch die Frau gemeint. Das Pronomen bewahrt den Zusammenhang, ohne eine im Vers nicht wiederholte Bezeichnung einzufügen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnliche Aussage, Berge würden niedergerissen, bleibt entsprechend dem griechischen Wortlaut erhalten; die Fußnote weist auf die Bedeutungsbreite des Verbs hin.
