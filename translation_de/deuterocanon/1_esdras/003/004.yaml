  language: de
  text: 'Da sagten die drei jungen Männer, die Leibwächter, die den König persönlich bewachten, zueinander:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τότε
  choice: Da
  rationale: Gibt den zeitlich-fortschreitenden Erzählanschluss im modernen Deutschen natürlich wieder.
- source_word: οἱ τρεῖς νεανίσκοι
  choice: die drei jungen Männer
  rationale: νεανίσκοι bezeichnet junge Männer; diese Wiedergabe ist heute klarer und natürlicher als „Jünglinge“.
- source_word: οἱ σωματοφύλακες
  choice: die Leibwächter
  rationale: Entspricht der konkreten Funktion der σωματοφύλακες und ist im Deutschen idiomatisch.
- source_word: οἱ φυλάσσοντες τὸ σῶμα τοῦ βασιλέως
  choice: die den König persönlich bewachten
  rationale: Bewahrt die erklärende Wiederaufnahme des Wachauftrags, ohne das griechische σῶμα unidiomatisch als einen vom König getrennten „Körper“ erscheinen zu lassen.
- source_word: εἶπαν ἕτερος πρὸς τὸν ἕτερον
  choice: sagten … zueinander
  rationale: Natürliche deutsche Wiedergabe der reziproken griechischen Wendung.
