  source_fidelity: 'Die Übersetzung gibt die Satzglieder und den argumentativen Anschluss des Griechischen zuverlässig wieder: πᾶς ὁ λαὸς αὐτοῦ ist angemessen als „sein ganzes Volk“ wiedergegeben, αἱ δυνάμεις αὐτοῦ als „seine Streitkräfte“ ohne unnötige Einengung, und ἐνακούουσιν im königlichen Kontext treffend als „gehorchen ihm“. „Außerdem“ wahrt die additive Funktion von πρὸς δὲ τούτοις. „liegt ... zu Tisch“ vermittelt für ἀνάκειται sachgerecht die im Zusammenhang mit Essen und Trinken naheliegende Liegehaltung. Die abschließende Reihung entspricht dem Griechischen.'
