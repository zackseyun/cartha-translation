  yaml_path: translation/deuterocanon/1_esdras/003/033.yaml
  text: and all his people and his forces obey him[a]. Besides this, he himself reclines and eats and drinks and sleeps[b];
translation:
  language: de
  text: Und sein ganzes Volk und seine Streitkräfte gehorchen ihm.[a] Außerdem liegt er selbst zu Tisch, isst und trinkt und schläft.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »seine Heere« statt »seine Streitkräfte«; das griechische Wort δυνάμεις kann in einem königlichen Zusammenhang militärische Verbände bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Das mit »liegt zu Tisch« übersetzte Verb kann auch »ruht« oder »liegt da« bedeuten. Da unmittelbar »isst und trinkt« folgt, ist wahrscheinlich die damals übliche Liegehaltung bei Tisch gemeint.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς ὁ λαὸς αὐτοῦ
  choice: sein ganzes Volk
  rationale: λαός bezeichnet hier das Volk beziehungsweise die Bevölkerung unter der Herrschaft des Königs; „Volk“ ist natürlich und vermeidet eine unnötige Festlegung auf „Untertanen“.
- source_word: αἱ δυνάμεις αὐτοῦ
  choice: seine Streitkräfte
  rationale: δυνάμεις meint im königlichen Zusammenhang am ehesten die militärischen Kräfte; „Streitkräfte“ bewahrt die Breite des Ausdrucks besser als „Heere“ oder „Truppen“.
- source_word: ἐνακούουσιν
  choice: gehorchen ihm
  rationale: Das Verb kann wörtlich das Hören beziehungsweise Beachten ausdrücken, bezeichnet hier angesichts königlicher Autorität jedoch sachgerecht den Gehorsam.
- source_word: πρὸς δὲ τούτοις
  choice: Außerdem
  rationale: Die Wendung fügt dem Argument einen weiteren Gesichtspunkt hinzu; „Außerdem“ gibt dies knapp und idiomatisch wieder.
- source_word: ἀνάκειται
  choice: liegt zu Tisch
  rationale: ἀνάκειμαι bezeichnet häufig das Liegen, besonders die antike Liegehaltung beim Essen. Die unmittelbar folgenden Verben „isst und trinkt“ stützen diese Bedeutung.
- source_word: ἐσθίει καὶ πίνει καὶ καθεύδει
  choice: isst und trinkt und schläft
  rationale: Die einfache Reihung mit wiederholtem „und“ bildet die koordinierte Folge der griechischen Präsensformen ab.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die polysyndetische Folge „isst und trinkt und schläft“ bleibt erhalten; „liegt zu Tisch“ vermittelt den historischen Tischbrauch verständlich, ohne die mögliche allgemeinere Bedeutung des Verbs in der Fußnote zu verschweigen.
