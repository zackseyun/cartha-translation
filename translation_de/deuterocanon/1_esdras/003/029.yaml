base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/003/029.yaml
  text: And those who do not serve in the army or fight[a], but farm the land, again, when they sow, after reaping they bring tribute to the king; and by compelling one another[b], they bring the taxes to the king.
translation:
  language: de
  text: Und alle, die weder Kriegsdienst leisten noch kämpfen, sondern das Land bebauen, bringen, wenn sie gesät und dann geerntet haben, wiederum dem König Abgaben[a]. Und indem sie einander dazu zwingen[b], bringen sie dem König die Steuern.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich steht hier nur „bringen sie dem König“; aus dem Zusammenhang ist die Ablieferung von Abgaben oder Erträgen gemeint.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „einer den anderen zwingend“. Gemeint ist offenbar, dass sie einander zur Ablieferung der königlichen Steuern anhalten; der genaue Vorgang bleibt offen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: στρατεύονται
  choice: Kriegsdienst leisten
  rationale: Bezeichnet militärischen Dienst oder die Teilnahme an einem Feldzug und bleibt vom folgenden πολεμοῦσιν unterschieden.
- source_word: πολεμοῦσιν
  choice: kämpfen
  rationale: Gibt die konkrete Kriegstätigkeit schlicht und natürlich wieder.
- source_word: γεωργοῦσιν τὴν γῆν
  choice: das Land bebauen
  rationale: Eine natürliche, würdige Wiedergabe landwirtschaftlicher Arbeit, die nahe am griechischen Ausdruck bleibt.
- source_word: ὅταν σπείρωσιν, θερίσαντες
  choice: wenn sie gesät und dann geerntet haben
  rationale: Gibt die wiederkehrende zeitliche Abfolge von Aussaat, Ernte und Ablieferung klar wieder.
- source_word: ἀναφέρουσιν
  choice: bringen
  rationale: Bewahrt die konkrete Bedeutung des Hinbringens beziehungsweise Ablieferns an einen Höhergestellten; der fiskalische Sinn ergibt sich aus dem Zusammenhang.
- source_word: ἕτερος τὸν ἕτερον ἀναγκάζοντες
  choice: indem einer den anderen dazu zwingt
  rationale: Bewahrt sowohl die distributive Formulierung als auch den Zwangscharakter, ohne den genauen Mechanismus näher festzulegen.
- source_word: τοὺς φόρους
  choice: die Steuern
  rationale: φόροι bezeichnet hier verpflichtende Zahlungen an den Herrscher; „Steuern“ ist im modernen Deutsch klar und sachgerecht.
theological_decisions:
- issue: Fiskalische Sprache im königlichen Kontext
  choice: Die erste, nur aus dem Kontext erschlossene Zahlung als „Abgaben“, φόρους ausdrücklich als „Steuern“ wiedergeben
  alternative: Beide Zahlungen einheitlich als „Tribut“ oder „Steuern“ wiedergeben
  rationale: Im ersten Satzteil steht kein ausdrückliches Substantiv für die Zahlung, während im zweiten φόρους genannt wird. Die Unterscheidung wahrt diese Abstufung und vermeidet, ein im Griechischen nicht vorhandenes Objekt als völlig eindeutig erscheinen zu lassen.
- issue: Bezug und Funktion von ἀναγκάζοντες
  choice: Modal als „indem einer den anderen dazu zwingt“ wiedergeben
  alternative: 'Als bloß beigeordnete Handlung formulieren: „und einer zwingt den anderen“'
  rationale: Das Partizip kann die Art und Weise der Steuerabl fierung anzeigen. Die deutsche Formulierung bewahrt diesen syntaktischen Zusammenhang, ohne zu bestimmen, wer konkret wen zur Zahlung anhält.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur folgt dem griechischen Gedankengang, wird aber für gute Verständlichkeit leicht gegliedert. „Abgaben“ vermeidet im ersten Satzteil eine zu starke Festlegung, da dort im Griechischen kein ausdrückliches Zahlungsobjekt steht.
