  to: Und alle, die weder Kriegsdienst leisten noch kämpfen, sondern das Land bebauen, bringen, wenn sie gesät und dann geerntet haben, wiederum dem König Abgaben[a]. Und indem sie einander dazu zwingen[b], bringen sie dem König die Steuern.
