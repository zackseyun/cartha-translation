base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/003/064.yaml
  text: and in her judgment there is nothing unjust[a]. And this is the strength and the kingdom and the authority and the majesty of all the ages[b]. Blessed is the God of truth.
translation:
  language: de
  text: Und in ihrem Urteil ist nichts ungerecht.[a] Und dies ist die Stärke, das Königtum, die Vollmacht und die Majestät aller Zeitalter.[b] Gepriesen sei der Gott der Wahrheit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder unpersönlich: »in seinem Urteil«, wenn die Personifikation der Wahrheit nicht beibehalten wird.'
    reason: lexical_alternative
  - marker: b
    text: Wörtlich »aller Zeitalter«; idiomatischer kann die Wendung »für immer und ewig« wiedergegeben werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: κρίσις
  choice: Urteil
  rationale: Bewahrt den forensischen Sinn des griechischen Ausdrucks und passt zu ἄδικον, ohne ihn zur abstrakten »Gerechtigkeit« umzudeuten.
- source_word: αὐτῆς
  choice: ihrem
  rationale: Das feminine Pronomen nimmt die im Kontext personifizierte ἀλήθεια (Wahrheit) auf; das Deutsche kann diese feminine Personifikation natürlich bewahren.
- source_word: ἄδικον
  choice: ungerecht
  rationale: Gibt den rechtlich-ethischen Sinn in enger Verbindung mit »Urteil« präzise wieder.
- source_word: ἰσχύς
  choice: Stärke
  rationale: Eine direkte und verständliche Wiedergabe für Kraft beziehungsweise Macht.
- source_word: βασίλειον
  choice: Königtum
  rationale: Der substantivische Ausdruck bezeichnet hier am ehesten königliche Herrschaft; »Königtum« bewahrt diesen Sinn besser als ein räumlich verstandenes »Königreich«.
- source_word: ἐξουσία
  choice: Vollmacht
  rationale: Hebt rechtmäßige Autorität und Verfügungsgewalt hervor und unterscheidet sie von bloßer Stärke.
- source_word: μεγαλειότης
  choice: Majestät
  rationale: Entspricht dem erhabenen, doxologischen Register des griechischen Ausdrucks.
- source_word: τῶν πάντων αἰώνων
  choice: aller Zeitalter
  rationale: Bewahrt die ungewöhnliche wörtliche Formulierung und ihre mögliche zeitliche Weite, statt sie auf die idiomatische Bedeutung »für immer und ewig« festzulegen.
- source_word: εὐλογητός
  choice: Gepriesen sei
  rationale: Eine natürliche deutsche doxologische Formel; das wörtliche »gesegnet« wäre bei Gott als Empfänger der Huldigung weniger idiomatisch.
- source_word: ὁ θεὸς τῆς ἀληθείας
  choice: der Gott der Wahrheit
  rationale: Bewahrt die Genitivkonstruktion und vermeidet die Bedeutungsverschiebung zu »der wahre Gott«.
theological_decisions:
- issue: Personifikation der Wahrheit durch das feminine Pronomen
  choice: Die feminine Personifikation wird mit »ihrem Urteil« beibehalten.
  alternative: »in dessen Urteil« beziehungsweise »in ihrem Urteil« ohne personifizierenden Bezug
  rationale: Das griechische feminine Pronomen verweist auf ἀλήθεια, und der Kontext stellt die Wahrheit personifiziert dar. Das Deutsche erlaubt dieselbe Form, ohne zusätzliche Lehre einzutragen.
- issue: Bedeutung von αἰώνων in der Doxologie
  choice: Wörtlich »aller Zeitalter«
  alternative: »für immer und ewig« oder »in alle Ewigkeit«
  rationale: Die wörtliche Fassung wahrt die Bild- und Zeitstruktur des Griechischen und lässt offen, ob primär sämtliche Weltzeiten oder idiomatisch ewige Dauer gemeint sind.
- issue: Bezugsrichtung von »dies« in der Aufzählung
  choice: »dies sind« mit kollektivem Bezug auf die folgende Reihe
  alternative: Singularisch »dies ist die Stärke und das Königtum ...«
  rationale: Das griechische αὕτη steht zwar formal im Singular und stimmt mit ἰσχύς überein; im natürlichen Deutschen wird die mehrgliedrige Prädikatsreihe idiomatisch mit dem Plural aufgenommen, ohne ihren gemeinsamen Bezug zur Wahrheit zu verändern.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit doxologischem Klang. Die feminine Personifikation der Wahrheit und die wörtliche Zeitformel bleiben erhalten; »Königtum« und »Vollmacht« unterscheiden königliche Herrschaft von rechtmäßiger Autorität.
