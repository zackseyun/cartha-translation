  terminology: Die Luxus- und Statusbegriffe sind sachgerecht und ohne konfessionelle Überformung wiedergegeben. „Purpur“, „feines Leinen“, „Zaumzeug“ und „Halsreif“ sind registergerecht. Die Fußnoten markieren die drei tatsächlich erläuterungsbedürftigen, im Griechischen komprimierten oder mehrdeutigen Ausdrücke an den passenden Stellen.
