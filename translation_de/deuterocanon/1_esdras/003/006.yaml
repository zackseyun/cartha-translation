base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/003/006.yaml
  text: and to put on purple[a], and to drink from gold vessels, and to sleep on gold, and to have a chariot with gold bridles, and a turban of fine linen, and a necklace around the neck[c][b],
translation:
  language: de
  text: und sich in Purpur zu kleiden, aus goldenen Gefäßen zu trinken[a], auf Gold zu schlafen[b], einen Wagen mit goldenem Zaumzeug zu haben[c], einen Turban aus feinem Leinen und einen Halsreif um den Hals,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Griechische spricht allgemein von goldenen Gegenständen, aus beziehungsweise mithilfe derer getrunken wird; eine bestimmte Gefäßart wird nicht genannt.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „auf Gold zu schlafen“; vermutlich ist ein mit Gold ausgestattetes Bett oder Ruhelager gemeint, doch das Griechische bleibt knapp und unbestimmt.'
    reason: lexical_alternative
  - marker: c
    text: 'Auch möglich: „einen goldgezügelten Wagen“; das zusammengesetzte Adjektiv bezieht das Gold auf Zügel oder Zaumzeug.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πορφύραν περιβαλέσθαι
  choice: sich in Purpur zu kleiden
  rationale: Das Medium von περιβάλλω bezeichnet hier das Anlegen beziehungsweise Umhüllen mit Kleidung; πορφύρα kann Purpurstoff und daraus gefertigte Kleidung bezeichnen. „Sich in Purpur kleiden“ ist idiomatisch und bewahrt die knappe Status- und Luxusangabe.
- source_word: ἐν χρυσώμασιν πίνειν
  choice: aus goldenen Gefäßen zu trinken
  rationale: χρυσώματα bezeichnet goldene Gegenstände, ohne die konkrete Gefäßform ausdrücklich zu nennen. „Gefäße“ vermeidet die unbelegte Festlegung auf Becher oder Kelche.
- source_word: ἐπὶ χρυσῷ καθεύδειν
  choice: auf Gold zu schlafen
  rationale: Die ungewöhnlich knappe griechische Wendung wird bewusst nicht zu „auf einem goldenen Bett“ ergänzt. So bleiben Bildhaftigkeit und sachliche Unbestimmtheit erhalten.
- source_word: ἅρμα χρυσοχάλινον
  choice: einen Wagen mit goldenem Zaumzeug
  rationale: Das Kompositum χρυσοχάλινος verbindet Gold mit Zügelung beziehungsweise Zaumzeug. Die Formulierung ist verständlich, ohne den Wagen selbst als vollständig golden darzustellen.
- source_word: κίδαριν βυσσίνην
  choice: einen Turban aus feinem Leinen
  rationale: κίδαρις bezeichnet eine turbanartige Kopfbedeckung; βύσσινος feines Leinen beziehungsweise Byssus. Die Wiedergabe ist konkret und im Deutschen gut verständlich.
- source_word: μανιάκην περὶ τὸν τράχηλον
  choice: einen Halsreif um den Hals
  rationale: μανιάκης bezeichnet einen am Hals getragenen Schmuck, etwa Reif, Kette oder Halsband. „Halsreif“ bewahrt den antiken Schmuckcharakter; die Ortsangabe „um den Hals“ gibt die ausdrückliche griechische Ergänzung wieder.
