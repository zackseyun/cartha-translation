  source_fidelity: Die Übersetzung gibt alle griechischen Satzglieder in ihrer Reihenfolge und als fortlaufende Infinitivaufzählung wieder. „Sich in Purpur kleiden“, „aus goldenen Gefäßen trinken“ und „auf Gold schlafen“ bewahren sowohl die Bildlichkeit als auch die knappe Formulierung. „Wagen mit goldenem Zaumzeug“ trifft χρυσοχάλινον, ohne den Wagen selbst unzulässig als golden festzulegen. „Turban aus feinem Leinen“ und „Halsreif um den Hals“ entsprechen κίδαριν βυσσίνην bzw. μανιάκην περὶ τὸν τράχηλον.
