base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/003/061.yaml
  text: Wine is unjust[a], the king is unjust, women are unjust, all the sons of men are unjust, and all their works are unjust—all such things. And there is no truth in them[b], and in their injustice they will perish.
translation:
  language: de
  text: Ungerecht ist der Wein, ungerecht ist der König, ungerecht sind die Frauen, ungerecht sind alle Menschensöhne[a], und ungerecht sind alle ihre Werke – alles Derartige[b]. In ihnen ist keine Wahrheit, und in ihrer Ungerechtigkeit werden sie zugrunde gehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „Söhne der Menschen“; die griechische Wendung bezeichnet hier die Menschen insgesamt.
    reason: cultural_note
  - marker: b
    text: 'Auch möglich: „all diese Dinge“ oder „alles von dieser Art“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄδικος / ἄδικοι / ἄδικα
  choice: ungerecht
  rationale: Die wiederholte Wiedergabe bewahrt die eindringliche Anapher und stellt die begriffliche Verbindung zu ἀδικία („Ungerechtigkeit“) am Versende her.
- source_word: οἶνος
  choice: der Wein
  rationale: Direkte Wiedergabe des personifiziert dargestellten Getränks; der griechische Artikel wird beibehalten.
- source_word: βασιλεύς
  choice: der König
  rationale: Entspricht dem bestimmten Artikel und der repräsentativen Einzahl im griechischen Text.
- source_word: γυναῖκες
  choice: die Frauen
  rationale: Der Kontext beschränkt den Ausdruck nicht auf Ehefrauen.
- source_word: υἱοὶ τῶν ἀνθρώπων
  choice: Menschensöhne
  rationale: Die bewusst quellennah gehaltene Form bewahrt das bildhafte, geschlechtlich markierte griechische Idiom; eine Fußnote erläutert seine umfassende Bedeutung.
- source_word: ἔργα
  choice: Werke
  rationale: Breite, würdevolle Wiedergabe dessen, was Menschen tun oder hervorbringen.
- source_word: πάντα τὰ τοιαῦτα
  choice: all dergleichen
  rationale: Gibt die qualitative Bedeutung von τοιαῦτα wieder und erhält zugleich die etwas abrupte, zusammenfassende Formulierung des Ausgangstextes.
- source_word: ἀλήθεια
  choice: Wahrheit
  rationale: Direkte Wiedergabe, die den Gegensatz zur Ungerechtigkeit offenhält.
- source_word: ἀδικίᾳ
  choice: Ungerechtigkeit
  rationale: Bewahrt die lexikalische und rhetorische Verbindung zum wiederholten „ungerecht“.
- source_word: ἀπολοῦνται
  choice: werden sie zugrunde gehen
  rationale: Gibt die Zukunftsform natürlich wieder, ohne einen äußeren Urheber ihres Untergangs einzutragen.
theological_decisions:
- issue: Geschlechtlich markierter Ausdruck für die Menschheit
  choice: alle Menschensöhne
  alternative: alle Menschen
  rationale: Die Übersetzung bewahrt zunächst die ausdrücklich bildhafte Form des Griechischen; die Fußnote verdeutlicht, dass der Ausdruck die Menschen insgesamt bezeichnet.
- issue: Bezug von αὐτοῖς und des folgenden Possessivpronomens
  choice: in ihnen / in ihrer Ungerechtigkeit
  alternative: in all dem / durch all diese Ungerechtigkeit
  rationale: Das maskuline Pluralpronomen verweist am natürlichsten auf die zuvor genannten Menschen, doch die Nähe der zusammenfassenden Sachbezeichnung lässt eine gewisse rhetorische Offenheit bestehen. Die deutsche Pronomenform folgt dem Griechischen, ohne den Bezug zusätzlich auszudeuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wiederholte Satzstellung „ungerecht ist/sind“ erhält den rhetorischen Nachdruck des Griechischen. „Menschensöhne“ ist bewusst markiert und wird deshalb erläutert; „zugrunde gehen“ ist natürlicher als das stärker fremdbestimmte „vernichtet werden“.
