  yaml_path: translation/deuterocanon/1_esdras/003/036.yaml
  text: But the third[a], the one who spoke about women and about the truth—this was Zorobabel—began to speak,
translation:
  language: de
  text: 'Der Dritte aber, der über die Frauen und über die Wahrheit gesprochen hatte – es war Zorobabel[a] –, begann zu reden:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Griechisch: »Zorobabel«; die im Deutschen geläufigere Namensform ist »Serubbabel«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὁ δὲ τρίτος
  choice: Der Dritte aber
  rationale: Bewahrt sowohl die Ordnungszahl als auch den durch δέ markierten Anschluss beziehungsweise Gegensatz, ohne ein im Griechischen nicht ausdrücklich stehendes Substantiv wie »Mann« einzufügen.
- source_word: ὁ εἴπας
  choice: der … gesprochen hatte
  rationale: Das substantivierte Aoristpartizip kennzeichnet den Dritten anhand seiner vorausgegangenen Äußerung. Das deutsche Plusquamperfekt macht dieses zeitliche Verhältnis natürlich deutlich.
- source_word: περὶ τῶν γυναικῶν καὶ τῆς ἀληθείας
  choice: über die Frauen und über die Wahrheit
  rationale: περί mit Genitiv bezeichnet hier die Themen seiner Rede. Die Wiederholung von »über« hält beide Themen klar auseinander und entspricht der ausgewogenen griechischen Formulierung.
- source_word: οὗτός ἐστιν Ζοροβαβέλ
  choice: es war Zorobabel
  rationale: Die eingeschobene Identifizierung wird im deutschen Erzählzusammenhang idiomatisch in der Vergangenheit wiedergegeben; ihre Aussagefunktion bleibt unverändert.
- source_word: Ζοροβαβέλ
  choice: Zorobabel
  rationale: Die Form folgt unmittelbar der griechischen Namensform Ζοροβαβέλ. Die geläufigere deutsche, vom Hebräischen geprägte Form wird in einer Fußnote genannt.
- source_word: ἤρξατο λαλεῖν
  choice: begann zu reden
  rationale: Gibt die inchoative Konstruktion ἄρχομαι mit Infinitiv klar und idiomatisch wieder. Der Doppelpunkt weist natürlich auf die unmittelbar folgende Rede hin.
