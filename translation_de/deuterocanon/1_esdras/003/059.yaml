base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/003/059.yaml
  text: Is not the one who does these things great? And truth is great, and stronger than everything[a][b].
translation:
  language: de
  text: Ist derjenige, der dies tut, nicht groß?[a] Und die Wahrheit ist groß und stärker als alles.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der griechische Text nennt den Handelnden nicht ausdrücklich; der weitere Zusammenhang kann auf Gott weisen.
    reason: alternative_reading
  - marker: b
    text: 'Oder: „stärker als alle Dinge“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχὶ
  choice: nicht …?
  rationale: Kennzeichnet eine rhetorische Frage, die eine bejahende Antwort erwartet; die deutsche Wortstellung gibt diese Funktion natürlich wieder.
- source_word: μέγας
  choice: groß
  rationale: Bewahrt die direkte Aussage über Größe beziehungsweise Bedeutung und nimmt zugleich die Wiederholung von μεγάλη auf.
- source_word: ὃς
  choice: der, der
  rationale: Das substantivisch gebrauchte Relativpronomen bezeichnet eine einzelne Person, ohne ihren Bezug ausdrücklich als Gott festzulegen.
- source_word: ταῦτα ποιεῖ
  choice: dies tut
  rationale: Das neutrale Pluralpronomen kann im Deutschen idiomatisch kollektiv mit „dies“ wiedergegeben werden; ποιεῖ bezeichnet hier das Vollbringen der zuvor genannten Taten.
- source_word: ἡ ἀλήθεια
  choice: die Wahrheit
  rationale: Der bestimmte Artikel wird ausdrücklich wiedergegeben; im weisheitlichen Ausspruch bezeichnet ἀλήθεια Wahrheit beziehungsweise Wirklichkeit.
- source_word: ἰσχυροτέρα
  choice: stärker
  rationale: Gibt den Komparativ knapp und unmittelbar wieder.
- source_word: παρὰ πάντα
  choice: als alles
  rationale: παρά mit Akkusativ markiert hier den Vergleich; πάντα hat umfassenden, sachlich kollektiven Sinn.
theological_decisions:
- issue: Bezug von „der, der dies tut“
  choice: Der Bezug bleibt im Haupttext unausgesprochen.
  alternative: Die handelnde Person ausdrücklich als Gott benennen.
  rationale: ὃς bezeichnet zwar einen persönlichen Handelnden, nennt ihn aber nicht. Auch wenn der weitere Zusammenhang Gott nahelegen kann, soll die Übersetzung diese Offenheit nicht auflösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die rhetorische Frage und die wiederholte Bezeichnung „groß“ bleiben erhalten; die Formulierung vermeidet eine ausdrückliche theologisierende Identifikation des Handelnden.
