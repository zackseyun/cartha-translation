  yaml_path: translation/deuterocanon/1_esdras/003/023.yaml
  text: Men[a], does not wine prevail, since it compels one to act this way? And he became silent after saying this.
translation:
  language: de
  text: Ihr Männer, hat der Wein nicht die Oberhand, weil er einen zwingt, so zu handeln? Nachdem er dies gesagt hatte, schwieg er.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὦ ἄνδρες
  choice: Ihr Männer
  rationale: Gibt die direkte Anrede an männliche Zuhörer wieder; im modernen Deutschen klar und näher am griechischen Vokativ als eine höflichkeitsbetonte Wiedergabe wie „Meine Herren“.
- source_word: οὐχ ὑπερισχύει
  choice: ist ... nicht übermächtig
  rationale: ὑπερισχύω bezeichnet überlegene Stärke bzw. das Überwiegen. „Übermächtig“ bewahrt im Kontext der Rede die Aussage über die große Macht des Weins und die rhetorische Frage.
- source_word: ὁ οἶνος
  choice: der Wein
  rationale: Direkte und eindeutige lexikalische Entsprechung.
- source_word: ὅτι οὕτως ἀναγκάζει ποιεῖν
  choice: weil er einen zwingt, so zu handeln
  rationale: ἀναγκάζει drückt Zwang aus; das unbestimmte „einen“ ergänzt im Deutschen idiomatisch das im Griechischen unausgedrückte Objekt, ohne dessen Personenkreis einzuengen. „So zu handeln“ wahrt die allgemeine Bedeutung von ποιεῖν und den Rückbezug von οὕτως.
- source_word: καὶ ἐσίγησεν
  choice: schwieg er
  rationale: Der Aorist beendet die Redehandlung. „Schwieg er“ ist knapp, würdig und im Erzählzusammenhang natürlich.
- source_word: οὕτως εἴπας
  choice: Nachdem er dies gesagt hatte
  rationale: Gibt das vorzeitige aoristische Partizip klar wieder; „dies“ bezieht sich natürlich auf die unmittelbar vorausgehende Aussage.
