  yaml_path: translation/deuterocanon/1_esdras/003/041.yaml
  text: But if they gather gold and silver and every beautiful thing[a], and see one woman beautiful in appearance and beauty,
translation:
  language: de
  text: Wenn sie aber Gold und Silber und alle schönen Dinge zusammentragen und eine einzige Frau sehen, die schön ist in Aussehen und Schönheit,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Wortlaut wiederholt die Beschreibung nahezu wörtlich: „schön … in Aussehen und Schönheit“. Damit wird ihre körperliche Schönheit nachdrücklich hervorgehoben.'
    reason: Die im Deutschen auffällige Wiederholung gibt eine entsprechende rhetorische Wiederholung im Griechischen wieder.
lexical_decisions:
- source_word: ἐὰν δὲ
  choice: Wenn sie aber
  rationale: Gibt sowohl die Bedingung durch ἐάν als auch den leichten Gegensatz durch δέ in natürlichem Deutsch wieder.
- source_word: συναγάγωσιν
  choice: zusammentragen
  rationale: Bewahrt den konkreten Sinn des Sammelns beziehungsweise Zusammenbringens, ohne einen Erwerbsvorgang hineinzulesen.
- source_word: χρυσίον καὶ ἀργύριον
  choice: Gold und Silber
  rationale: Die gewöhnlichen und sachlich genauen deutschen Bezeichnungen.
- source_word: πᾶν πρᾶγμα ὡραῖον
  choice: alles Schöne
  rationale: Gibt den weiten Ausdruck πᾶν πρᾶγμα knapp und idiomatisch wieder; im Zusammenhang sind schöne beziehungsweise begehrenswerte Dinge gemeint.
- source_word: ἴδωσιν
  choice: sehen
  rationale: Die schlichte, nicht interpretierende Entsprechung des Verbs.
- source_word: γυναῖκα μίαν
  choice: eine einzige Frau
  rationale: „Einzige“ macht das ausdrücklich gesetzte μίαν sichtbar und hebt die eine Frau gegenüber den angesammelten Kostbarkeiten hervor.
- source_word: καλὴν τῷ εἴδει καὶ τῷ κάλλει
  choice: die schön ist in Aussehen und Schönheit
  rationale: Die bewusst nachdrückliche und im Deutschen ungewöhnliche Wiederholung von „schön“ und „Schönheit“ bleibt erhalten; εἶδος wird als äußeres Aussehen verstanden.
