base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/003/037.yaml
  text: Men[a], is not the king great, and are not men many, and does not wine have strength? Who then is the one who rules over them[b], or who is the one who has mastery over them? Is it not women?
translation:
  language: de
  text: Ihr Männer, ist der König nicht groß, sind die Männer[a] nicht zahlreich und ist der Wein nicht stark? Wer also herrscht über sie, oder wer hat Macht über sie? Sind es nicht die Frauen?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Menschen“. Das griechische Wort kann alle Menschen bezeichnen; der folgende Gegensatz zu den Frauen spricht hier jedoch für „Männer“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄνδρες
  choice: Ihr Männer
  rationale: Der Vokativ Plural bezeichnet die männlichen Zuhörer unmittelbar; „Ihr Männer“ ist im Deutschen eine natürliche, würdige Anrede.
- source_word: ἄνθρωποι
  choice: die Männer
  rationale: Das Wort kann allgemein „Menschen“ bedeuten. Der ausdrückliche Gegensatz zu den Frauen am Versende legt hier jedoch die geschlechtsspezifische Wiedergabe „Männer“ nahe.
- source_word: ἰσχύει
  choice: ist stark
  rationale: Das Verb bedeutet, stark oder wirksam zu sein. „Ist stark“ gibt es direkt wieder und bewahrt die knappe dreigliedrige Steigerung.
- source_word: δεσπόζων
  choice: herrscht über
  rationale: Das Partizip bezeichnet die Ausübung von Herrschaft oder Verfügungsgewalt. „Herrscht über“ ist präzise und im rhetorischen Zusammenhang natürlich.
- source_word: κυριεύων
  choice: hat Macht über
  rationale: Die Form bezeichnet Herrschaft oder maßgebliche Gewalt. Die leicht abweichende Wiedergabe erhält die rhetorische Paarung mit δεσπόζων, ohne einen scharfen Bedeutungsunterschied zu behaupten.
- source_word: γυναῖκες
  choice: die Frauen
  rationale: Der Plural bedeutet hier allgemein „Frauen“; der Kontext bietet keinen Grund für die engere Wiedergabe „Ehefrauen“.
theological_decisions:
- issue: Geschlechtsspezifischer Gegensatz zwischen ἄνθρωποι und γυναῖκες
  choice: „Männer“ und „Frauen“
  alternative: „Menschen“ und „Frauen“
  rationale: Obwohl ἄνθρωποι lexikalisch „Menschen“ heißen kann, beruht das Argument des Verses auf dem Gegensatz zwischen Männern und Frauen. Die neutrale Wiedergabe würde diesen Gedankengang abschwächen.
- issue: Verhältnis von δεσπόζων und κυριεύων
  choice: „herrscht über“ und „hat Macht über“
  alternative: Beide Partizipien gleichlautend mit „herrscht über“ wiedergeben
  rationale: Die beiden nahezu synonymen Partizipien verstärken einander rhetorisch. Eine behutsame Differenzierung erhält diese Paarung, ohne daraus eine besondere theologische Rangordnung abzuleiten.
translation_notes:
  register: Moderne, würdige Standardsprache. Die Folge „groß – zahlreich – stark“ bewahrt den knappen rhetorischen Parallelismus des Griechischen; die abschließenden Fragen bleiben bewusst zugespitzt.
