  text: and it turns every mind to feasting and gladness[b][a], and one remembers no sorrow and no debt.
translation:
  language: de
  text: und es lenkt jeden Sinn[a] auf Festgelage und Freude, und man erinnert sich an keinen Kummer und keine Schuld[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „jeden Gedanken“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „nichts Geschuldetes“ beziehungsweise „keine Verpflichtung“. Das griechische Wort bezeichnet wörtlich eine Schuld, kann aber auch weiter gefasst sein.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶσαν διάνοιαν
  choice: jeden Sinn
  rationale: διάνοια bezeichnet den Sinn, das Denken oder den Gedanken. „Jeden Sinn“ bewahrt die verallgemeinernde, distributive Aussage und klingt im Deutschen würdevoll und verständlich.
- source_word: μεταστρέφει
  choice: lenkt
  rationale: Das Verb bezeichnet ein Wenden oder Verändern. „Lenkt … auf“ gibt die bildhafte Ausrichtung auf einen neuen Gegenstand wieder, ohne eine vollständige innere Verwandlung zu behaupten.
- source_word: εἰς εὐωχίαν
  choice: auf Festgelage
  rationale: εὐωχία meint festliches Essen beziehungsweise ein Bankett. „Festgelage“ erhält den konkreten festlichen Sinn, ohne ihn auf bloße Heiterkeit zu verengen.
- source_word: καὶ εὐφροσύνην
  choice: und Freude
  rationale: εὐφροσύνη bezeichnet Freude, Fröhlichkeit oder Frohsinn. „Freude“ ist natürlich, positiv und bildet eine klare Ergänzung zu „Festgelage“.
- source_word: οὐ μέμνηται
  choice: man erinnert sich an keinen
  rationale: Die singularische Form wird hier als allgemeine Aussage über den Menschen verstanden. Das unpersönliche „man“ vermeidet ein unbegründet männliches Subjekt und wahrt den sprichwortartigen Charakter.
- source_word: πᾶσαν λύπην
  choice: keinen Kummer
  rationale: λύπη kann Kummer, Trauer oder Schmerz bezeichnen. „Kummer“ ist breit genug für die hier gemeinte seelische Belastung.
- source_word: πᾶν ὀφείλημα
  choice: keine Schuld
  rationale: ὀφείλημα bezeichnet wörtlich eine Schuld beziehungsweise etwas Geschuldetes. „Schuld“ bewahrt die konkrete Bedeutung, kann im Deutschen jedoch wie im Griechischen auch eine weiter gefasste Verpflichtung anklingen lassen.
