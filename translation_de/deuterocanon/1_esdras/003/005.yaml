base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/003/005.yaml
  text: Let each of us speak one word that will prevail[a]; and whoever's statement is shown to be wiser than the other's, Darius the king will give him great gifts and great victory honors[b],
translation:
  language: de
  text: Jeder von uns soll je einen Ausspruch äußern, der sich durchsetzen wird[a]. Und wessen Aussage sich als weiser als die des anderen erweist, dem wird König Darius große Geschenke und große Siegespreise geben[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „je eine Aussage, die sich durchsetzen wird“. λόγος kann hier einen Ausspruch, eine Aussage oder ein Argument bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: „Siegespreise“ gibt ἐπινίκια wieder, also Preise oder Ehrungen für einen Sieg; sie sind von den zuvor genannten „Geschenken“ unterschieden.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἴπωμεν ἕκαστος ἡμῶν
  choice: Jeder von uns soll … tun
  rationale: Der hortative Konjunktiv mit der distributiven Wendung ἕκαστος ἡμῶν wird durch eine natürliche deutsche Aufforderung wiedergegeben.
- source_word: ἕνα λόγον
  choice: einen Ausspruch
  rationale: λόγος bezeichnet hier den einzelnen Beitrag im Wettstreit. „Ausspruch“ bewahrt die knappe Form besser als „Argument“, ohne auf das missverständliche wörtliche „ein Wort“ festgelegt zu sein.
- source_word: ὃς ὑπερισχύσει
  choice: der sich als überlegen erweisen wird
  rationale: ὑπερισχύω trägt den Sinn des Überwiegens oder Sich-als-stärker-Erweisens; die Wiedergabe erhält den Wettstreitcharakter.
- source_word: οὗ ἂν φανῇ τὸ ῥῆμα αὐτοῦ
  choice: wessen Aussage sich … erweist
  rationale: Die indefinite Relativkonstruktion wird im Deutschen idiomatisch mit „wessen“ ausgedrückt; ῥῆμα meint hier das Gesagte und wird als „Aussage“ wiedergegeben.
- source_word: σοφώτερον τοῦ ἑτέρου
  choice: weiser als die des anderen
  rationale: Der Genitiv des Vergleichs wird natürlich wiedergegeben. „Des anderen“ bewahrt die griechische Vergleichsform, auch wenn mehrere Teilnehmer im Kontext stehen.
- source_word: δώσει αὐτῷ Δαρεῖος ὁ βασιλεὺς
  choice: dem wird König Darius … geben
  rationale: Die Wortstellung stellt den Empfänger klar heraus und gibt den einfachen Futursinn wieder.
- source_word: δωρεὰς μεγάλας
  choice: große Geschenke
  rationale: Formnahe und im Deutschen natürliche Wiedergabe von δωρεά und μέγας.
- source_word: ἐπινίκια μεγάλα
  choice: hohe Siegesauszeichnungen
  rationale: ἐπινίκια bezeichnet Ehrungen oder Preise für einen Sieg. „Siegesauszeichnungen“ hält sie von den zuvor genannten materiellen Geschenken unterscheidbar.
