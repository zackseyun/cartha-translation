  yaml_path: translation/deuterocanon/1_esdras/003/062.yaml
  text: And truth remains and is strong forever[b][a], and lives and prevails forever and ever.
translation:
  language: de
  text: Und die Wahrheit bleibt und ist stark in Ewigkeit; sie lebt und setzt sich durch für immer und ewig.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „in das Zeitalter des Zeitalters“; eine verstärkte Wendung für unbegrenzte Dauer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡ ἀλήθεια
  choice: die Wahrheit
  rationale: Der bestimmte Artikel und das Substantiv werden direkt wiedergegeben; die folgenden Verben bewahren die Personifizierung der Wahrheit.
- source_word: μένει
  choice: bleibt
  rationale: „Bleibt“ ist eine klare, gegenwärtige Wiedergabe des fortdauernden Bestehens, ohne die Bedeutung durch „besteht fort“ auszudeuten.
- source_word: ἰσχύει
  choice: ist stark
  rationale: Die direkte Formulierung bewahrt den Unterschied zum späteren κρατεῖ, das wirksames Überwiegen bezeichnet.
- source_word: εἰς τὸν αἰῶνα
  choice: in Ewigkeit
  rationale: Die geläufige deutsche Wendung gibt die unbegrenzte zeitliche Dauer idiomatisch wieder.
- source_word: ζῇ
  choice: lebt
  rationale: Die direkte Wiedergabe erhält die lebendige Personifizierung der Wahrheit.
- source_word: κρατεῖ
  choice: setzt sich durch
  rationale: Die Wendung bringt die wirksame Überlegenheit zum Ausdruck und unterscheidet sich zugleich von „ist stark“ für ἰσχύει.
- source_word: εἰς τὸν αἰῶνα τοῦ αἰῶνος
  choice: für immer und ewig
  rationale: Diese natürliche, verstärkte deutsche Dauerformel entspricht der emphatischen griechischen Wendung.
theological_decisions:
- issue: Personifizierung der Wahrheit
  choice: Die personifizierenden Prädikate „bleibt“, „ist stark“, „lebt“ und „setzt sich durch“ werden beibehalten.
  alternative: Die Aussage abstrakter als bloße Beschreibung der Beständigkeit und Macht der Wahrheit formulieren.
  rationale: Der griechische Text reiht finite Verben an ἡ ἀλήθεια und verleiht der Aussage dadurch eine rhetorisch-personifizierende Kraft. Die Übersetzung bewahrt diese Spannung, ohne die Wahrheit ausdrücklich als Person zu bestimmen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das Semikolon macht die parallele Satzstruktur sichtbar; die wiederholten Verben erhalten den beinahe hymnischen Rhythmus des Griechischen.
