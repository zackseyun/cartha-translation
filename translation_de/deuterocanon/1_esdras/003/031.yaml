translation:
  language: de
  text: Er sagte, sie sollten zuschlagen, und sie schlagen zu; er sagte, sie sollten verwüsten, und sie verwüsten; er sagte, sie sollten bauen, und sie bauen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπε
  choice: er sagte, sie sollten
  rationale: Das Verb ist Aorist von λέγω. Die Konstruktion mit folgendem Aoristinfinitiv bezeichnet hier den Inhalt der Weisung. „Er sagte, sie sollten“ bleibt näher am schlichten λέγω als „er befahl“ und ist im modernen Deutschen natürlich.
- source_word: πατάξαι / τύπτουσιν
  choice: zuschlagen / sie schlagen zu
  rationale: Beide Verben bezeichnen gewaltsames Schlagen. Die einheitliche deutsche Wortwahl bewahrt den rhetorischen Zusammenhang zwischen Weisung und Ausführung, ohne ein bestimmtes Ziel oder eine besondere Art des Angriffs hinzuzufügen.
- source_word: ἐρημῶσαι / ἐρημοῦσιν
  choice: verwüsten / sie verwüsten
  rationale: ἐρημόω bedeutet, etwas wüst oder verödet zu machen. „Verwüsten“ ist im militärisch-politischen Zusammenhang prägnant und wahrt in beiden Satzhälften dieselbe Wortwahl.
- source_word: οἰκοδομῆσαι / οἰκοδομοῦσιν
  choice: bauen / sie bauen
  rationale: οἰκοδομέω bedeutet grundsätzlich „bauen“. „Wiederaufbauen“ wäre im Kontext denkbar, ist hier aber im griechischen Wortlaut nicht ausdrücklich markiert.
theological_decisions:
- issue: Ausmaß der königlichen Autorität in εἶπε mit Infinitiv
  choice: „Er sagte, sie sollten …, und sie …“
  alternative: „Er befahl …, und sie gehorchten“ oder „Auf sein Wort hin …“
  rationale: Die Wirksamkeit seines Wortes ergibt sich aus der wiederholten Gegenüberstellung von Weisung und unmittelbarer Ausführung. Die Übersetzung macht die syntaktische Funktion des Infinitivs im Deutschen deutlich, ohne λέγω zu „befehlen“ zu verstärken oder Gehorsam ausdrücklich hinzuzufügen.
translation_notes:
  register: Knapper, würdiger und moderner Erzählstil. Die dreigliedrige, parataktische Wiederholung des griechischen Textes bleibt erhalten; das historische Präsens in den Ausführungssätzen wird als „sie schlagen zu / verwüsten / bauen“ wiedergegeben.
