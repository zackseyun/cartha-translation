  text: and he watches for the lion[a], and walks in darkness; and whenever he steals and snatches and breaks in[c][b], he brings it to his beloved.
translation:
  language: de
  text: Er beobachtet den Löwen[a] und geht in der Dunkelheit. Und sooft er stiehlt, raubt und einbricht[b], bringt er es seiner Geliebten[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Er hält nach dem Löwen Ausschau.“ Das griechische Verb kann aufmerksames Betrachten oder Beobachten bezeichnen; im Zusammenhang ist auch ein zielgerichtetes Ausschauhalten möglich.'
    reason: lexical_alternative
  - marker: b
    text: Das hier verwendete seltene griechische Verb bezeichnet einen heimlich begangenen Diebstahl, besonders durch Eindringen in ein Haus.
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „der Frau, die er liebt“. Das griechische Wort bezeichnet eine geliebte Frau im romantischen Sinn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: θεωρεῖ
  choice: hält … Ausschau
  rationale: Das Verb bezeichnet ein aufmerksames Betrachten oder Beobachten. „Hält … Ausschau“ gibt im Zusammenhang das zielgerichtete, wachsame Beobachten natürlich wieder, ohne die wörtlichere Möglichkeit „betrachtet“ zu verschweigen.
- source_word: τὸν λέοντα
  choice: nach dem Löwen
  rationale: Der bestimmte Artikel des Griechischen wird beibehalten; so bleibt auch die anschauliche Bestimmtheit des Bildes erhalten.
- source_word: ἐν σκότει βαδίζει
  choice: geht in der Dunkelheit
  rationale: Die Formulierung bewahrt das griechische Bild und klingt zugleich in modernem Deutsch natürlich und würdig.
- source_word: κλέψῃ
  choice: stiehlt
  rationale: 'Das schlichte Verb entspricht der allgemeinen Zeitkonstruktion mit ὅταν: „sooft er stiehlt“.'
- source_word: ἁρπάσῃ
  choice: raubt
  rationale: ἁρπάζω bezeichnet gewaltsames Ergreifen oder Wegnehmen. „Raubt“ hebt diesen Aspekt gegenüber dem heimlichen „stiehlt“ hervor.
- source_word: κλωποδυτήσῃ
  choice: einbricht
  rationale: Das seltene Verb bezeichnet heimlichen Diebstahl, insbesondere durch Eindringen in ein Haus. „Einbricht“ ist eine klare, gegenwärtige deutsche Wiedergabe.
- source_word: τῇ ἐρωμένῃ
  choice: seiner Geliebten
  rationale: Die feminine Form bezeichnet eine romantisch geliebte Frau. „Seiner Geliebten“ ist knapp und würdig und legt keine weitergehende sexuelle Bedeutung fest.
- source_word: ἀποφέρει
  choice: bringt er es
  rationale: Das Verb bezeichnet das Weg- oder Hinbringen zu jemandem. Das im Griechischen unausgesprochene Objekt wird im Deutschen mit „es“ aufgenommen und bezieht sich auf das Gestohlene.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die dreigliedrige Folge „stiehlt, raubt und einbricht“ erhält die unterschiedlichen Arten des Wegnehmens im Griechischen; die lexikalische Mehrdeutigkeit bei θεωρεῖ und ἐρωμένη wird in Fußnoten offengehalten.
