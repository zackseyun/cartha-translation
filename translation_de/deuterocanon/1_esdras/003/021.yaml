  source_fidelity: Die Übersetzung gibt den generischen Sinn des singularischen οὐ μέμνηται im Deutschen angemessen mit pluralischem Bezug wieder. Der wiederkehrende Zeitumstand ὅταν πίνωσιν, der Infinitiv φιλάζειν mit seinen Empfängern sowie die zeitliche Abfolge μετʼ οὐ πολύ und das Ziehen der Waffen sind vollständig und ohne unzulässige Konkretisierung wiedergegeben.
  naturalness: Der Satz ist idiomatisches modernes Standarddeutsch. Die Voranstellung von „wenn sie trinken“ ist klar; Semikolon und „schon bald“ geben den jähen Übergang zur Gewalt wirksam und natürlich wieder.
  terminology: „Freunden und Brüdern“ wahrt die Paarung φίλοις καὶ ἀδελφοῖς. „Zuneigung zu zeigen“ ist für φιλάζειν eine vorsichtige, kontextgerechte Wiedergabe, ohne die mögliche Bedeutung „küssen“ in den Haupttext zu verengen. „Schwerter ziehen“ ist eine etablierte deutsche Entsprechung für σπῶνται μαχαίρας.
