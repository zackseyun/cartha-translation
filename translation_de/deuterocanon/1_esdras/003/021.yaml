  yaml_path: translation/deuterocanon/1_esdras/003/021.yaml
  text: and they do not remember[a], when they are drinking, to show affection to friends and brothers[b], and before long they draw swords.
translation:
  language: de
  text: Und wenn sie trinken, denken sie nicht daran[a], Freunden und Brüdern Zuneigung zu zeigen[b]; und schon bald ziehen sie Schwerter.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »denkt er nicht daran«; das griechische Verb steht im Singular, wird hier im Zusammenhang aber allgemein auf die Trinkenden bezogen.'
    reason: lexical_alternative
  - marker: b
    text: Das Verb kann auch konkreter »sich Freunden und Brüdern gegenüber liebevoll verhalten« und möglicherweise »Freunde und Brüder küssen« bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ μέμνηται
  choice: sie denken nicht daran
  rationale: Das griechische Verb steht im Singular, hat im Zusammenhang jedoch generischen Sinn; wegen des pluralischen πίνωσιν und der gemeinten Gruppe wird im Deutschen der natürliche Plural verwendet. »An etwas denken« gibt hier den Sinn von »sich erinnern / im Sinn behalten« idiomatisch wieder.
- source_word: ὅταν πίνωσιν
  choice: wenn sie trinken
  rationale: ὅταν mit Konjunktiv bezeichnet einen allgemein wiederkehrenden zeitlichen Umstand. Die schlichte Formulierung ist im Deutschen natürlich und lässt offen, wie stark der Rausch ist.
- source_word: φιλάζειν
  choice: Zuneigung zu zeigen
  rationale: Das Verb bezeichnet ein liebevolles oder freundschaftliches Verhalten. Die Wiedergabe wahrt den relationalen Sinn, ohne ihn vorschnell auf einen Kuss einzuengen.
- source_word: φίλοις καὶ ἀδελφοῖς
  choice: Freunden und Brüdern
  rationale: Die beiden maskulinen Pluralformen werden direkt wiedergegeben; so bleibt die rhetorische Paarung von Freunden und männlichen Angehörigen beziehungsweise Glaubens- oder Gemeinschaftsbrüdern erhalten.
- source_word: μετʼ οὐ πολὺ
  choice: schon bald
  rationale: Die Wendung bedeutet »nach nicht langer Zeit«. »Schon bald« bringt den raschen Umschlag zur Gewalt knapp und idiomatisch zum Ausdruck.
- source_word: σπῶνται μαχαίρας
  choice: ziehen sie Schwerter
  rationale: σπάω bezeichnet hier das Ziehen einer Waffe; μάχαιρα kann ein Schwert oder größeres Messer bezeichnen. »Schwerter ziehen« ist die natürliche deutsche Wendung.
