lexical_decisions:
- source_word: ἐκάθισεν
  choice: setzte sich
  rationale: Der narrative Aorist bezeichnet schlicht das Sichsetzen. „Nahm Platz“ wäre ebenfalls möglich, doch „setzte sich“ bleibt unmittelbar und fügt keine besondere Amtsnuance hinzu.
- source_word: χρηματιστηρίῳ
  choice: Amtssaal
  rationale: Das Wort bezeichnet einen offiziellen Raum für Beratungen, Entscheidungen oder gerichtliche beziehungsweise administrative Geschäfte. „Amtssaal“ wahrt diese institutionelle Breite; mögliche engere Deutungen stehen in der Fußnote.
- source_word: ἀνεγνώσθη
  choice: wurde verlesen
  rationale: Der passive Aorist bedeutet, dass der Text gelesen wurde. Im Deutschen bringt „verlesen“ die öffentliche Lesung in Gegenwart einer Gruppe natürlich zum Ausdruck, ohne ausdrücklich „laut“ hinzuzufügen.
- source_word: γράμμα
  choice: Brief
  rationale: γράμμα bezeichnet hier eine schriftliche Mitteilung oder Urkunde. Im erzählerischen Zusammenhang ist „Brief“ die natürlichste Wiedergabe.
- source_word: ἐνώπιον αὐτῶν
  choice: vor ihnen
  rationale: Die knappe Wendung entspricht der griechischen Orts- und Gegenwartsangabe und bewahrt den formellen Erzählton.
