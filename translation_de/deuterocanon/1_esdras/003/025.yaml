  yaml_path: translation/deuterocanon/1_esdras/003/025.yaml
  text: O men[a], do not men prevail, since they rule over the earth and the sea and everything in them?
translation:
  language: de
  text: Ihr Männer, haben die Menschen nicht die Oberhand, da sie über die Erde und das Meer und alles darin herrschen?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Näher am griechischen Partizip: „Ihr Männer, haben die Menschen nicht die Oberhand, indem sie über die Erde und das Meer und alles darin herrschen?“ Die rhetorische Frage erwartet eine bejahende Antwort.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὦ ἄνδρες
  choice: Ihr Männer
  rationale: Der pluralische Vokativ wird als direkte, ausdrücklich männliche Anrede wiedergegeben. „Ihr Männer“ klingt im modernen Deutschen würdig und rhetorisch, ohne das heute unnatürliche „O Männer“ zu erzwingen.
- source_word: οὐχ ὑπερισχύουσιν
  choice: sind ... nicht überlegen
  rationale: ὑπερισχύω bezeichnet hier das Überlegen- bzw. Stärkersein. Die mit οὐχ eingeleitete rhetorische Frage bleibt erhalten und erwartet eine bejahende Antwort.
- source_word: οἱ ἄνθρωποι
  choice: die Menschen
  rationale: ἄνθρωποι bezeichnet hier die Menschheit allgemein. „Die Menschen“ wahrt den Unterschied zur ausdrücklich männlichen Anrede ἄνδρες.
- source_word: κατακρατοῦντες
  choice: da sie ... herrschen
  rationale: Das Partizip kann begleitend oder begründend verstanden werden. „Da sie“ gibt im Zusammenhang den naheliegenden begründenden Sinn wieder; die formalere partizipiale Alternative wird in der Fußnote genannt.
- source_word: τὴν γῆν καὶ τὴν θάλασσαν
  choice: die Erde und das Meer
  rationale: Die Verbindung bildet eine umfassende Gegenüberstellung der Weltbereiche; deshalb ist „Erde“ hier angemessener als das enger mögliche „Land“.
- source_word: πάντα τὰ ἐν αὐτοῖς
  choice: alles, was darin ist
  rationale: Die Formulierung bewahrt den umfassenden Sinn von πάντα und bezieht sich natürlich auf Erde und Meer.
