revisions:
- from: Ihr Männer, sind die Menschen nicht überlegen, da sie über die Erde und das Meer und alles, was darin ist, herrschen?[a]
  to: Ihr Männer, haben die Menschen nicht die Oberhand, da sie über die Erde und das Meer und alles darin herrschen?[a]
  rationale: Die Revision ersetzt die zu allgemeine Aussage „überlegen sein“ durch „die Oberhand haben“, was ὑπερισχύω im gegebenen Argument präziser und zugleich idiomatisch wiedergibt. Die Fußnote unterscheidet zwischen einer näheren partizipialen Wiedergabe und der im Haupttext gewählten begründenden Anbindung, ohne eine über das Griechische hinausgehende Deutung festzulegen.
