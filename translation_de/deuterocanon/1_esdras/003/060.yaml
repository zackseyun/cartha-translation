base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/003/060.yaml
  text: All the earth calls on truth[a], and heaven blesses her; and all works shake and tremble[b], and with her there is nothing unjust.
translation:
  language: de
  text: Die ganze Erde ruft die Wahrheit an[a], und der Himmel segnet sie; alle Werke erbeben und zittern, und bei ihr ist nichts Ungerechtes.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich kann das Griechische auch heißen: »ruft die Wahrheit«; das Verb lässt sich als Akklamation oder als Anrufung der personifizierten Wahrheit verstehen.'
    reason: lexical_alternative
  - marker: b
    text: 'Im letzten Satz steht im griechischen Text eine maskuline oder neutrale Genitivform (μετʼ αὐτοῦ; wörtlich: »mit ihm«), obwohl die vorausgehenden Bezüge auf »Wahrheit« feminin sind. Die Übersetzung folgt dem naheliegenden Bezug auf die personifizierte Wahrheit.'
    reason: textual_variant
lexical_decisions:
- source_word: πᾶσα ἡ γῆ
  choice: die ganze Erde
  rationale: Im Gegensatzpaar mit dem Himmel bezeichnet γῆ hier die Erde in kosmischer Weite, nicht nur ein einzelnes Land.
- source_word: τὴν ἀλήθειαν καλεῖ
  choice: ruft die Wahrheit an
  rationale: καλεῖ mit direktem Objekt kann wörtlich »ruft« bedeuten, lässt hier aber auch den Sinn des Anrufens oder Akklamierens der personifizierten Wahrheit zu. »ruft … an« ist im Deutschen verständlich und bewahrt diese Spannung; die engere wörtliche Möglichkeit wird in der Fußnote genannt.
- source_word: ὁ οὐρανὸς αὐτὴν εὐλογεῖ
  choice: der Himmel segnet sie
  rationale: »Himmel« entspricht dem Singular οὐρανός und »sie« bewahrt den durch das feminine ἀλήθεια getragenen personifizierenden Ausdruck.
- source_word: πάντα τὰ ἔργα
  choice: alle Werke
  rationale: ἔργα wird formal als »Werke« wiedergegeben. Der Ausdruck kann in diesem kosmischen Zusammenhang umfassend auf alles Gewirkte oder Geschaffene zielen, ohne dass dies im Haupttext näher festgelegt wird.
- source_word: σείεται καὶ τρέμει
  choice: erbeben und zittern
  rationale: Das Verbpaar bezeichnet eine verstärkte erschütterte Reaktion. Der Plural folgt im Deutschen dem pluralischen Subjekt, obwohl der überlieferte griechische Wortlaut Singularformen bietet.
- source_word: μετʼ αὐτοῦ
  choice: bei ihr
  rationale: Der Sinnzusammenhang weist auf die personifizierte Wahrheit zurück. »bei ihr« gibt μετά in diesem Zusammenhang natürlich wieder; die grammatische Abweichung des griechischen Pronomens wird offengelegt.
- source_word: ἄδικον οὐδέν
  choice: nichts Ungerechtes
  rationale: Die substantivierte Form bewahrt knapp die Bedeutung von etwas Unrechtem oder Ungerechtem und klingt in modernem, würdigem Deutsch natürlich.
theological_decisions:
- issue: Personifikation der Wahrheit
  choice: Die feminine Bezugnahme wird mit »sie/ihr« beibehalten.
  alternative: Die Wahrheit unpersönlich behandeln oder mit »es« auf sie zurückverweisen.
  rationale: Das feminine Substantiv und die kosmische Segnung verleihen der Wahrheit im griechischen Zusammenhang personifizierende Züge. Die Übersetzung bewahrt diese literarische Spannung, ohne die Wahrheit ausdrücklich zu einer eigenständigen Person zu erklären.
- issue: Abweichendes Pronomen im Schlusssatz
  choice: 'Im Haupttext wird sinngemäß auf die Wahrheit bezogen: »bei ihr«; die Form des Ausgangstextes wird in einer Fußnote dokumentiert.'
  alternative: Formal »bei ihm/ihm« oder unpersönlich »bei ihm/ihm« übersetzen beziehungsweise die Abweichung stillschweigend angleichen.
  rationale: μετʼ αὐτοῦ ist maskulin beziehungsweise neutrum und stimmt nicht mit der femininen ἀλήθεια überein. Der Kontext legt dennoch den Rückbezug auf die Wahrheit nahe; Haupttext und Fußnote halten Sinn und formale Schwierigkeit gemeinsam fest.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Klang. Die Parallelstruktur und die Personifikation bleiben erhalten; unnötig altertümliche Wörter werden vermieden.
