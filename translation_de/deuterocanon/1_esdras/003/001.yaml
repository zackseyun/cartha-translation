base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/003/001.yaml
  text: And King Dareios made a great banquet for all who were under him[a], and for all his household, and for all the nobles of Media and Persia[b],
translation:
  language: de
  text: Und König Dareios veranstaltete ein großes Festmahl[a] für alle, die ihm unterstanden[b], für alle Mitglieder seines Haushalts und für alle Großen Mediens und Persiens,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Gastmahl«. Das griechische Wort bezeichnet eine förmliche Bewirtung beziehungsweise ein Bankett.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »die unter ihm waren«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δοχήν
  choice: Festmahl
  rationale: Das Wort bezeichnet hier eine förmliche Bewirtung, besonders ein Mahl oder Bankett. »Festmahl« klingt im königlichen Zusammenhang natürlich und würdig, ohne den Vorgang als bloßen Empfang erscheinen zu lassen.
- source_word: τοῖς ὑπʼ αὐτόν
  choice: die ihm unterstanden
  rationale: Die Formulierung bewahrt das hierarchische Verhältnis des griechischen Ausdrucks, ohne die Gruppe enger als politische »Untertanen« zu bestimmen.
- source_word: οἰκογενέσιν αὐτοῦ
  choice: Mitglieder seines Haushalts
  rationale: Der Ausdruck bezeichnet die zu seinem Haus gehörenden Personen und kann mehr umfassen als die engere Familie. »Mitglieder seines Haushalts« gibt diesen weiteren Sinn verständlich wieder.
- source_word: μεγιστᾶσιν
  choice: Großen
  rationale: Gemeint sind führende, hochgestellte Männer. »Großen« bewahrt die rangbezogene, nicht genauer festgelegte Bezeichnung des Ausgangstextes; »Beamte« wäre zu eng.
- source_word: Μηδείας καὶ τῆς Περσίδος
  choice: Mediens und Persiens
  rationale: Der griechische Text nennt die beiden Länder beziehungsweise Regionen, nicht ausdrücklich deren Völker.
- source_word: βασιλεὺς Δαρεῖος
  choice: König Dareios
  rationale: »Dareios« bildet die griechische Namensform Δαρεῖος transparent und in deutscher Umschrift ab.
