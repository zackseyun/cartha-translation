  yaml_path: translation/deuterocanon/1_esdras/003/051.yaml
  text: And now you do not believe me[a]. Is not the king great in his authority? Do not all the lands fear to touch him?
translation:
  language: de
  text: Und nun glaubt ihr mir nicht. Ist der König nicht groß in seiner Macht? Fürchten sich nicht alle Länder davor, ihn zu berühren[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder sinngemäßer: „Hand an ihn zu legen“. Das griechische Wort bedeutet wörtlich „berühren“ oder „anfassen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πιστεύετέ
  choice: glaubt
  rationale: πιστεύω bedeutet „glauben“ oder „vertrauen“. In der direkten Wendung πιστεύετέ μοι ist „ihr glaubt mir“ im Deutschen natürlich und bewahrt den argumentativen Vorwurf.
- source_word: μέγας
  choice: groß
  rationale: μέγας bezeichnet hier die Größe beziehungsweise herausragende Stellung des Königs. „Groß“ erhält die rhetorische Form, ohne den Ausdruck vorschnell auf bloße Stärke einzuengen.
- source_word: ἐξουσίᾳ
  choice: Macht
  rationale: ἐξουσία kann Befugnis, Autorität oder Macht bezeichnen. „Macht“ ist in Verbindung mit einem König natürlich und umfasst hier sowohl Herrschaftsbefugnis als auch wirksame Gewalt.
- source_word: χῶραι
  choice: Länder
  rationale: χῶραι meint Länder, Gebiete oder Territorien. „Länder“ bewahrt den weiten geopolitischen Sinn, ohne ausdrücklich moderne Nationalstaaten vorauszusetzen.
- source_word: εὐλαβοῦνται
  choice: fürchten sich davor
  rationale: Das Verb kann Furcht, ehrfürchtige Scheu oder vorsichtige Zurückhaltung ausdrücken. „Fürchten sich davor“ gibt in diesem Zusammenhang die durch die Macht des Königs bewirkte Scheu klar wieder.
- source_word: ἅψασθαι
  choice: zu berühren
  rationale: ἅπτομαι bedeutet unmittelbar „berühren“ oder „anfassen“. Die wörtliche Fassung bleibt im Haupttext stehen; die wahrscheinlich gemeinte feindselige Bedeutung wird als idiomatische Möglichkeit in der Fußnote genannt.
theological_decisions: []
