  text: 'And they said to them[a], “Tell us about what has been written.” And the first, who had spoken about the strength of wine[b], began and said thus:'
translation:
  language: de
  text: 'Und sie sagten zu ihnen: „Berichtet uns über das Geschriebene.“ Da begann der Erste, der über die Stärke des Weines gesprochen hatte, und sagte Folgendes:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀπαγγείλατε
  choice: Berichtet
  rationale: Der Imperativ von ἀπαγγέλλω bezeichnet ein Mitteilen oder Berichten; „Berichtet“ passt zum förmlichen Rahmen und bleibt im heutigen Deutsch verständlich.
- source_word: περὶ τῶν γεγραμμένων
  choice: über das Geschriebene
  rationale: Das substantivierte Perfektpartizip bezeichnet das bereits schriftlich Festgehaltene. „Das Geschriebene“ bewahrt den passiven und resultativen Sinn, ohne die Verfasser ausdrücklich zu bestimmen.
- source_word: ἤρξατο
  choice: begann
  rationale: Direkte, natürliche Wiedergabe von ἄρχομαι.
- source_word: ὁ πρῶτος
  choice: der Erste
  rationale: Das substantivierte Ordinalzahlwort bezeichnet den ersten Teilnehmer beziehungsweise Redner.
- source_word: ὁ εἴπας
  choice: der … gesprochen hatte
  rationale: Der vorausgehende Aoristpartizipialsatz identifiziert den ersten Redner anhand seiner zuvor genannten These; das Plusquamperfekt macht diese zeitliche Beziehung im Deutschen klar.
- source_word: περὶ τῆς ἰσχύος τοῦ οἴνου
  choice: über die Stärke des Weines
  rationale: ἰσχύς kann Stärke, Kraft oder Macht bedeuten. „Stärke“ bewahrt die Grundbedeutung und passt zum Thema des Wettstreits.
- source_word: ἔφη οὕτως
  choice: sagte Folgendes
  rationale: Die Formel leitet die anschließende Rede ein. „Sagte Folgendes“ gibt οὕτως in natürlichem, würdigem Deutsch wieder.
