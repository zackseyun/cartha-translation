base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/003/057.yaml
  text: Men[a], are not women strong? Great is the earth, and high is heaven, and swift in its course is the sun, because it turns in the circuit of heaven.
translation:
  language: de
  text: Ihr Männer, sind Frauen nicht stark? Groß ist die Erde, hoch ist der Himmel, und schnell auf ihrer Bahn ist die Sonne, denn sie dreht sich im Kreis des Himmels.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἄνδρες
  choice: Ihr Männer
  rationale: Der Vokativ Plural richtet sich unmittelbar und ausdrücklich an die männlichen Zuhörer; „Ihr Männer“ bewahrt diese Anrede und ihre rhetorische Kraft.
- source_word: οὐκ ἰσχυραὶ αἱ γυναῖκες
  choice: sind Frauen nicht stark?
  rationale: Die Wortfolge ist im Zusammenhang am besten als rhetorische Frage zu verstehen. „Stark“ gibt ἰσχυραί grundlegend und natürlich wieder; der Artikel bezeichnet Frauen allgemein.
- source_word: μεγάλη ἡ γῆ
  choice: Groß ist die Erde
  rationale: Die vorangestellte Prädikatsbestimmung wird bewahrt und trägt zum feierlichen Parallelismus bei.
- source_word: ὑψηλὸς ὁ οὐρανός
  choice: hoch ist der Himmel
  rationale: „Himmel“ entspricht dem kosmologischen Zusammenhang und wird in der abschließenden Wendung konsequent beibehalten; die griechische Wortstellung bleibt erkennbar.
- source_word: ταχὺς τῷ δρόμῳ ὁ ἥλιος
  choice: schnell auf seiner Bahn ist die Sonne
  rationale: δρόμος bezeichnet hier den Lauf beziehungsweise die Bahn der Sonne. „Auf seiner Bahn“ vermittelt das Bewegungsbild in natürlichem Deutsch.
- source_word: ὅτι στρέφεται
  choice: denn sie dreht sich
  rationale: ὅτι leitet hier eine Begründung ein; „denn“ wahrt den fließenden rhetorischen Zusammenhang. στρέφεται bleibt mit „dreht sich“ bewusst allgemein und wird nicht stärker astronomisch festgelegt.
- source_word: ἐν τῷ κύκλῳ τοῦ οὐρανοῦ
  choice: im Kreis des Himmels
  rationale: κύκλος bedeutet „Kreis“ oder „Umlauf“. „Im Kreis des Himmels“ bildet die konkrete antike kosmologische Ausdrucksweise ab, ohne sie modernisierend umzudeuten.
