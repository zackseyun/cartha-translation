lexical_decisions:
- source_word: ἤρξατο … λαλεῖν
  choice: begann … zu sprechen
  rationale: Die Verbindung bezeichnet den Beginn einer Redehandlung; die deutsche Konstruktion ist natürlich und wahrt den erzählerischen Stil.
- source_word: ὁ δεύτερος
  choice: der Zweite
  rationale: Der substantivierte Ordinalausdruck bezeichnet den zweiten Teilnehmer beziehungsweise Redner, ohne das im Griechischen nicht ausdrücklich genannte Wort „Mann“ einzufügen.
- source_word: ὁ εἴπας
  choice: der … gesprochen hatte
  rationale: Das substantivierte Aoristpartizip verweist auf seine frühere Äußerung. Das Plusquamperfekt macht dieses zeitliche Verhältnis im Deutschen klar.
- source_word: περὶ τῆς ἰσχύος
  choice: über die Stärke
  rationale: περί mit Genitiv bezeichnet das Thema; ἰσχύς meint hier Stärke oder Macht. „Stärke“ ist die direkte, im Kontext verständliche Wiedergabe.
- source_word: τοῦ βασιλέως
  choice: des Königs
  rationale: βασιλεύς bezeichnet in diesem Hofkontext eindeutig den König.
