  yaml_path: translation/deuterocanon/1_esdras/003/053.yaml
  text: and she would take the crown from the king’s head and put it on herself[b][a], and she would strike the king with her left hand.
translation:
  language: de
  text: Und sie nahm dem König die Krone[a] vom Kopf und setzte sie sich selbst auf; und sie schlug den König mit der linken Hand.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, formaler: das Diadem.'
    reason: lexical_alternative
  - marker: b
    text: Das griechische Verb kann insbesondere einen Schlag mit der Hand, also auch eine Ohrfeige, bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφαιροῦσαν
  choice: nahm … vom Kopf
  rationale: Das Partizip schildert die Handlung der Frau innerhalb einer fortlaufenden Szene. Die finite Form ist im Deutschen natürlich; die Verbindung mit „vom Kopf“ gibt die Trennung klar wieder.
- source_word: τὸ διάδημα
  choice: die Krone
  rationale: διάδημα bezeichnet das königliche Diadem beziehungsweise die Krone. „Krone“ ist im heutigen Deutsch allgemein verständlich; die formnähere Alternative wird in einer Fußnote genannt.
- source_word: ἀπὸ τῆς κεφαλῆς τοῦ βασιλέως
  choice: dem König … vom Kopf
  rationale: Die deutsche Dativkonstruktion gibt die Zugehörigkeit idiomatisch und genau wieder.
- source_word: ἐπιτιθοῦσαν αὐτῇ
  choice: setzte sie sich selbst auf
  rationale: Der Dativ αὐτῇ bezieht sich auf die Frau. „Sich selbst“ bewahrt diese rückbezügliche Aussage, ohne „auf den eigenen Kopf“ ausdrücklich in den Text hineinzulesen.
- source_word: ἐράπιζεν
  choice: schlug
  rationale: ῥαπίζω bezeichnet einen Schlag, häufig mit der Hand und möglicherweise eine Ohrfeige. „Schlug“ wahrt den breiteren Bedeutungsumfang; die engere Möglichkeit wird in der Fußnote erläutert.
- source_word: τῇ ἀριστερᾷ
  choice: mit der linken Hand
  rationale: Das substantivierte feminine Adjektiv meint hier die linke Hand als Werkzeug des Schlages. Das Ergänzen von „Hand“ ist im Deutschen für eine klare Wiedergabe erforderlich.
- source_word: καὶ … καὶ
  choice: und … und
  rationale: Die wiederholte Konjunktion koordiniert die Handlungen schlicht und bewahrt den additiven Erzählfluss des Griechischen.
