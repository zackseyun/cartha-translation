  yaml_path: translation/deuterocanon/1_esdras/003/034.yaml
  text: But they stand guard around him, and each one cannot go away and do his work, nor do they disobey him.
translation:
  language: de
  text: Sie aber halten rings um ihn Wache, und keiner von ihnen kann weggehen und seine Arbeit tun; auch sind sie ihm nicht ungehorsam.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τηροῦσιν κύκλῳ περὶ αὐτόν
  choice: halten rings um ihn Wache
  rationale: τηρέω bezeichnet hier im Zusammenhang das Bewachen beziehungsweise Wachehalten; κύκλῳ περὶ αὐτόν wird natürlich und räumlich mit „rings um ihn“ wiedergegeben.
- source_word: οὐ δύνανται ἕκαστος ἀπελθεῖν
  choice: keiner von ihnen kann weggehen
  rationale: 'Das distributive ἕκαστος steht unter der Verneinung und meint jeden Einzelnen: Keiner kann seinen Posten verlassen.'
- source_word: ποιεῖν τὰ ἔργα αὐτοῦ
  choice: seine Arbeit tun
  rationale: Das pluralische τὰ ἔργα kann kollektiv die eigene Arbeit beziehungsweise die eigenen Aufgaben bezeichnen; im Deutschen ist der Singular hier idiomatisch.
- source_word: οὐδὲ παρακούουσιν αὐτοῦ
  choice: auch widersetzen sie sich ihm nicht
  rationale: παρακούω mit Genitiv bezeichnet hier, jemandem nicht zu gehorchen beziehungsweise sich seinem Befehl zu widersetzen. Die gewählte Formulierung ist natürlich und bewahrt den Gehorsamsgedanken.
