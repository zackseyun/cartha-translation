  yaml_path: translation/deuterocanon/1_esdras/003/050.yaml
  text: And many perished and were led astray and sinned because of women[a].
translation:
  language: de
  text: Und viele kamen um, gerieten auf Abwege und sündigten wegen der Frauen[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »wegen der Ehefrauen«. Das griechische Wort kann je nach Zusammenhang sowohl »Frauen« als auch »Ehefrauen« bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπώλοντο
  choice: kamen um
  rationale: Das aoristische ἀπόλλυμι bezeichnet hier den Untergang oder das Verderben. »Kamen um« gibt die Schwere knapp und natürlich wieder, ohne eine handelnde Ursache hinzuzufügen.
- source_word: ἐσφάλησαν
  choice: gerieten auf Abwege
  rationale: Das passive σφάλλω kann ein Zu-Fall-Kommen oder Irregehen bezeichnen. Im Zusammenhang mit Untergang und Sünde ist eine moralische Verirrung gemeint; »gerieten auf Abwege« bewahrt zugleich, dass kein bestimmter Urheber des Irreführens genannt wird.
- source_word: ἡμάρτοσαν
  choice: sündigten
  rationale: In diesem moralisch-religiösen Zusammenhang ist »sündigten« die direkte und geläufige Wiedergabe von ἁμαρτάνω.
- source_word: διὰ τὰς γυναῖκας
  choice: wegen Frauen
  rationale: διά mit Akkusativ bezeichnet hier die Ursache. γυναῖκες kann sowohl »Frauen« als auch »Ehefrauen« bedeuten; die allgemeinere Wiedergabe »Frauen« engt den Bezug nicht ohne textliche Grundlage ein.
theological_decisions:
- issue: Mögliche abwertende Verallgemeinerung durch γυναῖκες
  choice: Frauen
  alternative: Ehefrauen
  rationale: Die griechische Mehrzahl γυναῖκες ist zwischen »Frauen« und »Ehefrauen« lexikalisch mehrdeutig. Der Satz selbst beschränkt den Bezug nicht eindeutig auf Ehepartnerinnen. Deshalb bleibt die breitere und rhetorisch schärfere Aussage im Haupttext erhalten; die engere Möglichkeit wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die dreigliedrige Folge des Griechischen bleibt erhalten. »Gerieten auf Abwege« ist verständlicher als das wörtlichere »kamen zu Fall« und vermeidet gegenüber »wurden verführt« eine im Griechischen nicht ausdrücklich genannte handelnde Instanz.
