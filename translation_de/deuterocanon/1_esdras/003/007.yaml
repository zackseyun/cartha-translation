  yaml_path: translation/deuterocanon/1_esdras/003/007.yaml
  text: And he will be seated second to Darius because of his wisdom[b][a], and he will be called a kinsman of Darius.
translation:
  language: de
  text: Und wegen seiner Weisheit wird er den zweiten Platz nach Darius erhalten[a], und er wird ein Verwandter des Darius genannt werden.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wird als Zweiter nach Darius sitzen“. Das griechische Verb kann sowohl das Platznehmen als auch die Einsetzung in eine Rangstellung bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: „Verwandter“ kann einen tatsächlichen Angehörigen der Familie oder einen höfischen Ehrentitel für einen besonders engen Vertrauten des Königs bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: δεύτερος
  choice: den zweiten Platz nach Darius
  rationale: Das Adjektiv bezeichnet hier Rang oder Reihenfolge. Im höfischen Zusammenhang geht es am ehesten um die Stellung unmittelbar nach Darius.
- source_word: καθιεῖται
  choice: wird ... erhalten
  rationale: Die Form bezeichnet im Zusammenhang das Einsetzen oder Platzieren in eine Rangstellung. Die deutsche Wendung gibt den Sinn natürlich wieder; die konkretere Vorstellung des Sitzens bleibt in der Fußnote erhalten.
- source_word: διὰ τὴν σοφίαν αὐτοῦ
  choice: wegen seiner Weisheit
  rationale: διά mit Akkusativ bezeichnet den Grund; „wegen seiner Weisheit“ ist direkt und idiomatisch.
- source_word: συγγενής
  choice: Verwandter
  rationale: Das Wort bezeichnet grundsätzlich einen Angehörigen derselben Familie, kann am Königshof aber auch ein Ehrentitel für besondere Nähe zum Herrscher sein. „Verwandter“ bewahrt zunächst die familiäre Aussage.
- source_word: κληθήσεται
  choice: wird ... genannt werden
  rationale: Dies ist die direkte und natürliche Wiedergabe des Futur Passiv von καλέω.
