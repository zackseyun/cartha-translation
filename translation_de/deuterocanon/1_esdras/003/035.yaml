  register: Modernes, gehobenes Standarddeutsch mit klarer rhetorischer Anrede. Die Formulierung wahrt die genuine Bedeutungsbreite von ἐπάκουστος, während die Fußnote die im königlichen Kontext naheliegende Gehorsamsnuance ausdrücklich nennt.
