base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/003/035.yaml
  text: O men[a], how does the king not prevail, since he is so obeyed? And he was silent.
translation:
  language: de
  text: Ihr Männer, wie sollte der König nicht die Oberhand haben, da man so sehr auf ihn hört?[a] Und er schwieg.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „da man ihm so sehr gehorcht“. Das griechische Adjektiv kann sowohl bedeuten, dass jemand gehört und beachtet wird, als auch, dass man ihm gehorcht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὦ ἄνδρες
  choice: Ihr Männer
  rationale: Die ausdrückliche männliche Pluralanrede bleibt erhalten; „Ihr Männer“ ist im Deutschen als rhetorische Anrede natürlich und würdig.
- source_word: πῶς οὐχ ὑπερισχύει
  choice: wie sollte ... nicht die Oberhand behalten
  rationale: Die rhetorische Frage wird idiomatisch wiedergegeben. „Die Oberhand behalten“ vermittelt die überlegene Stärke beziehungsweise das Obsiegen von ὑπερισχύει, ohne körperliche Gewalt vorauszusetzen.
- source_word: ὁ βασιλεύς
  choice: der König
  rationale: Direkte Entsprechung des griechischen Subjekts.
- source_word: ὅτι
  choice: da
  rationale: Gibt die hier begründende Funktion der Konjunktion knapp und natürlich wieder.
- source_word: οὕτως ἐπάκουστός ἐστιν
  choice: man so sehr auf ihn hört
  rationale: Bewahrt die Bedeutungsbreite von ἐπάκουστος zwischen Beachtung und Gehorsam. Die unpersönliche Formulierung ist im Deutschen idiomatischer als ein Passiv wie „er wird so gehört“.
- source_word: καὶ ἐσίγησεν
  choice: Und er schwieg
  rationale: Gibt den Aorist von σιγάω knapp wieder und markiert im Zusammenhang das Ende seiner Rede, ohne zusätzliche Bildlichkeit einzutragen.
