  yaml_path: translation/deuterocanon/1_esdras/003/056.yaml
  text: And then the king and the nobles looked at one another, and he began to speak about the truth.
translation:
  language: de
  text: Da sahen der König und die hohen Würdenträger einander an. Und er begann, über die Wahrheit zu sprechen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μεγιστᾶνες
  choice: hohen Würdenträger
  rationale: Das Wort bezeichnet hochrangige Männer am königlichen Hof. „Hohe Würdenträger“ ist im modernen Deutschen verständlich und bildet die Stellung ab, ohne sie enger als Fürsten oder Angehörige eines bestimmten Adelsstands festzulegen.
- source_word: ἔβλεπον εἰς τὸν ἕτερον
  choice: sahen … einander an
  rationale: Bei dem pluralischen Subjekt hat die Wendung reziproken Sinn. „Einander ansehen“ gibt den ausgetauschten Blick natürlich wieder.
- source_word: ἤρξατο λαλεῖν
  choice: begann … zu sprechen
  rationale: Die ingressive Konstruktion wird direkt und idiomatisch wiedergegeben.
- source_word: ἀλήθεια
  choice: die Wahrheit
  rationale: Der griechische Artikel und der Zusammenhang weisen auf die Wahrheit als den nun behandelten Gegenstand.
theological_decisions: []
translation_notes:
  register: Natürliches, würdevolles modernes Standarddeutsch. Das einleitende καὶ τότε wird mit „Da“ erzählerisch knapp wiedergegeben; der zweite Satz bewahrt das griechische καί durch „Und“. Das im Griechischen nur durch die Verbform bezeichnete Subjekt bleibt als „er“ erhalten, ohne seine Identität im Text ausdrücklich festzulegen.
