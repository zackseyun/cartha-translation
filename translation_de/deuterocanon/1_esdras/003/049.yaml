  yaml_path: translation/deuterocanon/1_esdras/003/049.yaml
  text: And many lost their senses because of women[a], and became servants because of them;
translation:
  language: de
  text: Und viele verloren wegen der Frauen den Verstand[a] und wurden ihretwegen zu Sklaven.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Viele gerieten wegen der Frauen in ihrem eigenen Denken auf Abwege.“ Die griechische Wendung ist ungewöhnlich und verbindet den Verlust vernünftigen Denkens mit „ihren eigenen Gedanken/ihrem eigenen Denken“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπενοήθησαν ταῖς ἰδίαις διανοίαις
  choice: verloren den Verstand
  rationale: Die Verbindung aus ἀπενοήθησαν und ταῖς ἰδίαις διανοίαις bezeichnet idiomatisch den Verlust vernünftigen Urteilens. Die natürliche deutsche Wendung bewahrt die starke Aussage, während die wörtlicheren Bestandteile in der Fußnote dokumentiert werden.
- source_word: διὰ τὰς γυναῖκας
  choice: wegen der Frauen
  rationale: διά mit Akkusativ bezeichnet hier den Grund oder Anlass; „wegen der Frauen“ gibt dies knapp und natürlich wieder.
- source_word: δοῦλοι
  choice: Sklaven
  rationale: δοῦλοι bezeichnet hier eine wirkliche Unterordnung beziehungsweise Unfreiheit. „Sklaven“ bewahrt diese Schärfe besser als das mildere „Diener“.
- source_word: ἐγένοντο
  choice: wurden
  rationale: Das Verb bezeichnet den Eintritt in einen neuen Zustand; im Deutschen ist „wurden zu Sklaven“ idiomatisch.
- source_word: διʼ αὐτάς
  choice: ihretwegen
  rationale: Das Pronomen verweist auf die Frauen zurück, und διά mit Akkusativ ist erneut kausal. „ihretwegen“ bewahrt sowohl den Bezug als auch die Wiederholung des Kausalgedankens.
theological_decisions:
- issue: Wiedergabe von δοῦλοι
  choice: Sklaven
  alternative: Diener; Knechte
  rationale: Der Zusammenhang betont Unterwerfung und Unfreiheit. „Sklaven“ wahrt die soziale Schärfe des griechischen Ausdrucks, ohne den Sachverhalt konfessionell auszudeuten.
translation_notes:
  register: Modernes, klares und würdiges Standarddeutsch. Die zweimalige kausale Aussage des Griechischen bleibt durch „wegen der Frauen“ und „ihretwegen“ erhalten; „zu Sklaven“ gibt die starke soziale Unterordnung unverharmlost wieder.
