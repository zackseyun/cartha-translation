  source_fidelity: 'Der Entwurf gibt die parallele Struktur von εἶπεν + Aoristinfinitiv und die anschließenden Präsensformen zutreffend wieder. Die Ergänzung von »es« ist jedoch nicht quellentreu genug: Das griechische Objekt bleibt in beiden Befehls-Ausführungs-Paaren ungenannt, und ein einheitliches deutsches »es« kann fälschlich nahelegen, derselbe Gegenstand werde gefällt und anschließend gepflanzt.'
  naturalness: Die imperativischen Wiedergaben sind knapp und idiomatisch. Ohne ergänztes Objekt sind »Fällt! … sie fällen« und »Pflanzt! … sie pflanzen« im gegebenen elliptischen, allgemein formulierenden Kontext natürlich und bewahren die Prägnanz besser.
  terminology: »fällen« ist für ἐκκόπτειν in diesem Kontext eine mögliche, idiomatische Konkretisierung, ohne die Aussage wesentlich zu verengen. »pflanzen« entspricht φυτεύειν direkt. »Er sagte« gibt εἶπεν zurück, ohne die Anweisung über das im Kontext Erkennbare hinaus als förmlichen Befehl zu etikettieren.
