translation:
  language: de
  text: 'Er sagte: »Fällt!«, und sie fällen. Er sagte: »Pflanzt!«, und sie pflanzen.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπεν
  choice: Er sagte
  rationale: Der Aorist von λέγω leitet jeweils die königliche Anweisung ein. „Er sagte“ bewahrt den schlichten, knappen und wiederholenden Stil, ohne ausdrücklich einen formellen Befehl anzunehmen.
- source_word: ἐκκόψαι
  choice: Fällt es!
  rationale: Der Aoristinfinitiv von ἐκκόπτω gibt nach εἶπεν den Inhalt der Anweisung wieder. „Fällen“ bezeichnet im vorausgesetzten Zusammenhang natürlich das Abschlagen eines Baumes oder Gewächses.
- source_word: ἐκκόπτουσιν
  choice: sie fällen es
  rationale: Das Präsens im Plural schildert die Ausführung der Anweisung und wahrt den Tempuswechsel des Griechischen. Das Objektpronomen wird im Deutschen der Natürlichkeit halber ergänzt.
- source_word: φυτεῦσαι
  choice: Pflanzt es!
  rationale: Der Aoristinfinitiv von φυτεύω steht parallel zu ἐκκόψαι und wird als Inhalt der knappen Anweisung wiedergegeben.
- source_word: φυτεύουσιν
  choice: sie pflanzen es
  rationale: Das Präsens im Plural entspricht parallel ἐκκόπτουσιν und beschreibt die Befolgung. Das im Griechischen unausgesprochene Objekt wird für idiomatisches Deutsch ergänzt.
theological_decisions: []
translation_notes:
  register: Knappes, würdiges modernes Standarddeutsch. Die Wiederholung und der Wechsel vom Aorist bei der Rede zum Präsens bei ihrer Ausführung bleiben erhalten; die Infinitive nach εἶπεν werden als direkte Befehle idiomatisch wiedergegeben.
