  yaml_path: translation/deuterocanon/1_esdras/003/039.yaml
  text: and from them they came to be[a], and these women nourished the very men who planted the vineyards from which wine comes[b],
translation:
  language: de
  text: Und aus ihnen gingen sie hervor,[a] und diese Frauen ernährten ebendie Männer, die die Weinberge pflanzten, aus denen der Wein entsteht.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Und von ihnen wurden sie geboren.“ Wörtlicher sagt das Griechische: „Und aus ihnen gingen sie hervor.“'
    reason: lexical_alternative
  - marker: b
    text: Das griechische Demonstrativpronomen ist feminin und meint hier ausdrücklich „diese Frauen“, nicht bloß „diese Dinge“.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξ αὐτῶν ... ἐγένοντο
  choice: aus ihnen gingen sie hervor
  rationale: ἐξ mit Genitiv bezeichnet hier die Herkunft; ἐγένοντο bleibt weiter gefasst als eine ausdrückliche Aussage über die Geburt. „gingen ... hervor“ ist im Deutschen natürlich und wahrt diese Breite.
- source_word: αὗται
  choice: diese Frauen
  rationale: Das feminine Demonstrativpronomen verweist im Zusammenhang ausdrücklich auf die Frauen; das ergänzte Substantiv macht den Bezug im Deutschen klar.
- source_word: ἐξέθρεψαν
  choice: ernährten
  rationale: Das Verb kann das Ernähren und Aufziehen bezeichnen. „ernährten“ bewahrt den konkreten Gedanken der Versorgung, ohne den Sinn unnötig auszuweiten.
- source_word: αὐτοὺς τοὺς φυτεύσαντας
  choice: ebendie Männer, die ... pflanzten
  rationale: Die Verbindung aus Pronomen und substantiviertem Partizip ist hervorgehoben. „ebendie Männer“ gibt diesen rückbezüglichen Nachdruck idiomatisch wieder.
- source_word: τοὺς ἀμπελῶνας
  choice: die Weinberge
  rationale: „Weinberge“ ist die übliche und sachlich genaue Wiedergabe von ἀμπελῶνας.
- source_word: ἐξ ὧν ὁ οἶνος γίνεται
  choice: aus denen der Wein entsteht
  rationale: Die Formulierung erhält die Herkunftsbeziehung und die breite Bedeutung von γίνεται, statt ausdrücklich einen menschlichen Herstellungsprozess einzutragen.
theological_decisions:
- issue: Bezug und rhetorische Kraft des femininen Demonstrativpronomens αὗται
  choice: Das Subjekt wird als „diese Frauen“ ausdrücklich bezeichnet.
  alternative: Nur „diese“ oder „sie“ verwenden.
  rationale: Der feminine Bezug gehört zur Argumentation über Herkunft und Versorgung durch Frauen. Die ausdrückliche Bezeichnung verhindert im Deutschen einen unklaren Rückbezug, ohne eine zusätzliche Lehraussage einzuführen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „hervorgingen“, „ernährten“ und „entsteht“ wahren die knappe Satzfolge und die wiederholte Herkunftssprache des Griechischen; „ebendie“ erhält den rhetorischen Nachdruck.
