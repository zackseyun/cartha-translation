  text: And when the king awoke, they took the letter and gave it to him, and he read it.
translation:
  language: de
  text: Und als der König erwachte, nahmen sie das Schreiben, gaben es ihm und er las es.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξηγέρθη
  choice: erwachte
  rationale: Der Aorist Passiv von ἐξεγείρω wird hier intransitiv im Sinn des Erwachens aus dem Schlaf gebraucht. „Erwachte“ ist im modernen Deutschen natürlich und entspricht dem Erzählzusammenhang.
- source_word: λαβόντες
  choice: nahmen sie
  rationale: Das vorzeitige Partizip wird für einen flüssigen deutschen Erzählstil als finites Verb wiedergegeben, ohne die Abfolge der Handlungen zu verändern.
- source_word: τὸ γράμμα
  choice: das Schreiben
  rationale: γράμμα bezeichnet hier die zuvor verfasste schriftliche Äußerung. „Schreiben“ bewahrt die Offenheit zwischen Brief, Schriftstück und Dokument besser als das enger gefasste „Brief“.
- source_word: ἔδωκαν αὐτῷ
  choice: gaben es ihm
  rationale: Dies ist eine direkte, klare Wiedergabe des Aorists mit indirektem Objekt; das Pronomen „es“ nimmt „das Schreiben“ auf.
- source_word: ἀνέγνω
  choice: er las es
  rationale: Das im Griechischen nur aus dem Zusammenhang erschlossene Objekt wird im Deutschen zur natürlichen und eindeutigen Formulierung als „es“ ergänzt.
