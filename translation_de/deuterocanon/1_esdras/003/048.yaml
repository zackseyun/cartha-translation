  text: And a man loves his own wife more than his father and mother.
translation:
  language: de
  text: Und ein Mann liebt seine eigene Frau mehr als seinen Vater und seine Mutter.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πλεῖον ... μᾶλλον ἢ
  choice: mehr als
  rationale: Die vergleichenden Ausdrücke bezeichnen hier einen höheren Grad der Liebe. Das natürliche deutsche Vergleichsgefüge „mehr als“ gibt dies klar wieder, ohne eine ausschließliche Entscheidung im Sinn von „lieber als“ zu behaupten.
- source_word: ἀγαπᾷ
  choice: liebt
  rationale: „Liebt“ entspricht der gewöhnlichen Bedeutung von ἀγαπάω und bewahrt die schlichte Aussage des griechischen Textes.
- source_word: ἄνθρωπος
  choice: ein Mann
  rationale: ἄνθρωπος kann allgemein „Mensch“ bedeuten; im unmittelbaren Zusammenhang bezeichnet es jedoch einen Mann im Verhältnis zu seiner Frau. Daher ist „ein Mann“ hier sachlich und kontextgerecht.
- source_word: τὴν ἰδίαν γυναῖκα
  choice: seine eigene Frau
  rationale: γυνή bedeutet in diesem familiären Vergleich „Ehefrau“, und ἰδίαν hebt die Zugehörigkeit ausdrücklich hervor. „Seine eigene Frau“ erhält diese Betonung.
- source_word: τὸν πατέρα καὶ τὴν μητέρα
  choice: seinen Vater und seine Mutter
  rationale: Die beiden einzelnen Verwandtschaftsbezeichnungen werden beibehalten; die Possessivpronomen ergeben sich aus dem Zusammenhang und sind im Deutschen für einen natürlichen, eindeutigen Satz erforderlich.
