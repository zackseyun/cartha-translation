translation_notes:
  register: Modernes Standarddeutsch in schlichter, würdiger Satzform. Die doppelte griechische Komparativmarkierung wird idiomatisch nur einmal mit „mehr als“ ausgedrückt; eine wörtliche Verdopplung wäre im Deutschen schwerfällig.
