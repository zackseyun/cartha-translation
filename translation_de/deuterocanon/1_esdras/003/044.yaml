  text: and with the woman he gives up his life[b][a], and remembers neither father nor mother nor homeland.
translation:
  language: de
  text: Und mit der Frau[b] gibt er sein Leben[a] preis und denkt weder an Vater noch an Mutter noch an die Heimat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „verlässt er seine Seele“ beziehungsweise „gibt er sich selbst auf“. Das griechische Wort ψυχή kann je nach Zusammenhang Leben, Seele oder das eigene Selbst bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: „Frau“ kann hier auch „Ehefrau“ bedeuten; das griechische Wort γυνή lässt beide Bedeutungen zu.
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ τῆς γυναικός
  choice: bei der Frau
  rationale: μετά mit dem Genitiv bezeichnet gewöhnlich Gemeinschaft oder Begleitung. „Bei der Frau“ gibt den Zusammenhang im Deutschen natürlich wieder, ohne eine Ursache („wegen“) in den Text hineinzulesen.
- source_word: γυνή
  choice: Frau
  rationale: γυνή kann sowohl „Frau“ als auch „Ehefrau“ bedeuten. Der weitere Sinn bleibt hier erhalten; der Kontext legt eine rechtmäßige Ehe nicht eindeutig fest.
- source_word: ἀφίησι τὴν ψυχήν
  choice: gibt er sein Leben preis
  rationale: ἀφίημι kann „loslassen“, „verlassen“ oder „preisgeben“ bedeuten, ψυχή „Leben“, „Seele“ oder „Selbst“. Die Verbindung beschreibt eine weitgehende Selbsthingabe; „sein Leben preisgeben“ ist idiomatisch, wahrt aber die Stärke des griechischen Ausdrucks.
- source_word: μέμνηται
  choice: denkt … an
  rationale: 'Das Perfekt μέμνηται hat präsentische Bedeutung: „sich erinnern“, „bedenken“, „an jemanden oder etwas denken“. In dieser Verneinungsreihe klingt „denkt weder an …“ im modernen Deutschen am natürlichsten.'
- source_word: χώραν
  choice: Heimat
  rationale: χώρα kann Land, Gegend oder Heimatland bezeichnen. Neben Vater und Mutter ist die persönliche Bindung an das Herkunftsland gemeint; „Heimat“ bringt dies knapp zum Ausdruck.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die dreifache Verneinungsreihe des Griechischen wird mit „weder … noch … noch“ bewahrt. „Bei der Frau“ erhält die mit μετά ausgedrückte Gemeinschaft, während die Fußnoten die echte Mehrdeutigkeit von γυνή und ψυχή offenhalten.
