  yaml_path: translation/deuterocanon/1_esdras/003/026.yaml
  text: But the king prevails over them and rules over them, and he is master over them, and whatever he says to them, they will obey.
translation:
  language: de
  text: Der König aber ist ihnen überlegen und herrscht über sie; er ist ihr Gebieter, und auf alles, was er ihnen sagt, werden sie hören.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: werden sie ihm gehorchen.'
    reason: Das griechische ἐνακούσουσιν bezeichnet wörtlich das Hören auf jemanden und kann kontextuell Gehorsam ausdrücken.
lexical_decisions:
- source_word: ὑπερισχύει
  choice: ist ihnen überlegen
  rationale: Gibt die verstärkte Bedeutung des Verbs als Überlegenheit bzw. Übermacht wieder, ohne sie unnötig auf einen einzelnen Sieg zu verengen.
- source_word: κυριεύει αὐτῶν
  choice: herrscht über sie
  rationale: Natürliche und genaue Wiedergabe der Ausübung von Herrschaft.
- source_word: δεσπόζει αὐτῶν
  choice: ist ihr Gebieter
  rationale: Bewahrt gegenüber »herrscht« die gesteigerte Aussage persönlicher Verfügungsgewalt und erhält die dreifache Beschreibung der königlichen Macht.
- source_word: ἐνακούσουσιν
  choice: werden sie hören
  rationale: Bewahrt die konkrete Hörsprache des griechischen Verbs; im Zusammenhang bedeutet sie Gehorchen bzw. Folge leisten.
