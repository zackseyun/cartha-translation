  yaml_path: translation/deuterocanon/1_esdras/003/045.yaml
  text: And from this you must know that women rule over you. Do you not labor and toil[a], and give and bring everything to women?
translation:
  language: de
  text: Und daran müsst ihr erkennen, dass die Frauen[a] über euch herrschen. Arbeitet ihr nicht hart und müht euch ab, und gebt und bringt alles den Frauen?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ehefrauen“. Der griechische Plural kann je nach Zusammenhang sowohl „Frauen“ als auch „Ehefrauen“ bedeuten; hier ist die allgemeinere Wiedergabe im Haupttext gewählt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐντεῦθεν
  choice: Daran
  rationale: Bezeichnet hier die Grundlage für die aus den vorausgehenden Beispielen gezogene Erkenntnis und bewahrt den rückverweisenden Charakter.
- source_word: δεῖ ὑμᾶς γνῶναι
  choice: müsst ihr erkennen
  rationale: Gibt die ausgedrückte Notwendigkeit wieder; „erkennen“ passt im Deutschen natürlich zu einer Schlussfolgerung aus zuvor Genanntem.
- source_word: γυναῖκες
  choice: Frauen
  rationale: Der griechische Plural bezeichnet allgemein Frauen. Obwohl im Kontext auch Ehefrauen gemeint sein können, ist die Aussage hier nicht ausdrücklich auf sie begrenzt.
- source_word: κυριεύουσιν ὑμῶν
  choice: über euch herrschen
  rationale: Bewahrt die starke Bedeutung der Ausübung von Herrschaft und entspricht der Genitivrektion des griechischen Verbs.
- source_word: πονεῖτε καὶ μοχθεῖτε
  choice: arbeitet ihr nicht hart und müht euch ab
  rationale: Die beiden Verben werden getrennt wiedergegeben; die Formulierung bewahrt die rhetorische Häufung und klingt zugleich in modernem Deutsch natürlich.
- source_word: πάντα
  choice: alles
  rationale: Gibt den umfassenden Sinn knapp und idiomatisch wieder.
- source_word: δίδοτε καὶ φέρετε
  choice: gebt und bringt
  rationale: Beide griechischen Verben bleiben sichtbar, ohne ihre mögliche Bedeutungsdifferenz einzuebnen.
