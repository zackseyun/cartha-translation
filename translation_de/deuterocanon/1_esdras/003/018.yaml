  yaml_path: translation/deuterocanon/1_esdras/003/018.yaml
  text: It makes the mind of the king and of the orphan one[a], and that of the servant and that of the free, and that of the poor and that of the rich;
translation:
  language: de
  text: Es macht die Denkweise des Königs und des Waisen gleich, ebenso die des Sklaven[a] und des Freien, die des Armen und des Reichen;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Diener“ oder „Hausdiener“. Das griechische Wort οἰκέτης kann einen Diener oder Sklaven eines Haushalts bezeichnen; der Gegensatz zum Freien spricht hier eher für „Sklave“.
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιεῖ
  choice: macht
  rationale: Gibt das aktive Verursachen im Präsens schlicht und unmittelbar wieder.
- source_word: διάνοιαν μίαν
  choice: eines Sinnes
  rationale: Die idiomatische deutsche Wendung bewahrt den Gedanken, dass Menschen aus gegensätzlichen gesellschaftlichen Gruppen in denselben inneren Zustand versetzt werden.
- source_word: βασιλέως ... ὀρφανοῦ
  choice: den König und den Waisen
  rationale: Die direkten deutschen Entsprechungen erhalten den scharfen Gegensatz zwischen höchstem Rang und sozialer Schutzlosigkeit.
- source_word: οἰκέτου
  choice: Sklaven
  rationale: οἰκέτης kann einen Hausdiener oder Haussklaven bezeichnen; der ausdrückliche Gegensatz zu ἐλεύθερος legt hier einen unfreien Status nahe.
- source_word: ἐλευθέρου
  choice: Freien
  rationale: Bezeichnet im Gegensatz zum Sklaven den rechtlich freien Menschen.
- source_word: πένητος ... πλουσίου
  choice: den Armen ... den Reichen
  rationale: Bewahrt den klaren wirtschaftlichen Gegensatz des griechischen Textes in natürlichem Deutsch.
theological_decisions:
- issue: Wiedergabe von οἰκέτου im Gegensatz zu ἐλευθέρου
  choice: Sklave
  alternative: Diener; Hausdiener
  rationale: Da der Vers ausdrücklich unfreien und freien Status gegenüberstellt, bildet „Sklave“ den sozialen Gegensatz genauer ab, ohne die mögliche weitere Bedeutung des griechischen Wortes in der Fußnote zu verschweigen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wendung „eines Sinnes“ bildet διάνοιαν μίαν knapp und idiomatisch ab; die parallelen Gegensatzpaare und der abschließende Strichpunkt des Ausgangstextes bleiben erhalten.
