revisions:
- from: Und sie lassen dies alles beiseite und gaffen sie an; mit aufgesperrtem Mund betrachten sie sie, und alle ziehen sie Gold und Silber und allem Schönen vor.
  to: Und sie lassen dies alles beiseite und gaffen sie an; mit offenem Mund starren sie die Frau an, und alle ziehen sie Gold und Silber und alles Schöne vor.
  rationale: Die Revision korrigiert den erforderlichen Akkusativ in der Vergleichsreihe und glättet die deutsche Wiedergabe der Mund-Metapher. „Starren“ bringt θεωροῦσιν im Kontext des wiederholten Gaffens treffend zur Geltung, ohne den Sinn zu erweitern. Die rhetorische Wiederholung der auf die Frau gerichteten Aufmerksamkeit und die umfassende Aussage „alles Schöne“ bleiben erhalten.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T10:21:40Z'
review_pass:
  verdict: revise
  source_fidelity: 'Der Entwurf gibt die Abfolge und die bildhafte Doppelung des griechischen Textes grundsätzlich treffend wieder. Bei αἱρετίζουσιν μᾶλλον ἢ verlangt die deutsche Vergleichskonstruktion jedoch den Akkusativ: „sie [wen] Gold und Silber ... vorziehen“, nicht den Dativ „allem Schönen“ in der vorliegenden Reihung.'
  naturalness: „Mit aufgesperrtem Mund“ ist verständlich, wirkt in diesem Kontext jedoch etwas unidiomatisch; „mit offenem Mund“ ist modernes, natürliches Standarddeutsch und erhält das Bild. Die Wiederaufnahme „sie ... sie“ ist wegen des griechischen Nachdrucks vertretbar, kann aber durch „die Frau“ beim zweiten Bezug klarer und stilistisch flüssiger sein.
  terminology: „gaffen“ gibt κέχηναν angemessen kräftig wieder und ist hier nicht zu umgangssprachlich. „betrachten“ gibt θεωροῦσιν wieder, wobei „starren“ die im Kontext fixierte, offene Mundhaltung noch unmittelbarer ausdrückt. „alles Schöne“ bewahrt die weite Bedeutung von πᾶν πρᾶγμα ὡραῖον besser als eine Dativform.
  issues:
  - severity: medium
    issue: Kasusfehler in der Vorzugsreihe
    rationale: Nach „jemanden/etwas vorziehen“ stehen sowohl die bevorzugte Person als auch die Vergleichsobjekte im Akkusativ. „allem Schönen“ steht fälschlich im Dativ; korrekt ist „alles Schöne“.
  - severity: low
    issue: Formulierung „mit aufgesperrtem Mund“
    rationale: Sie ist zwar verständlich, aber weniger idiomatisch als „mit offenem Mund“ und kann im Deutschen eher ein willentliches Aufsperren nahelegen. Der griechische Ausdruck beschreibt schlicht das offene, gaffende Mundbild.
  revised_text: Und sie lassen dies alles beiseite und gaffen sie an; mit offenem Mund starren sie die Frau an, und alle ziehen sie Gold und Silber und alles Schöne vor.
  revised_footnotes: []
