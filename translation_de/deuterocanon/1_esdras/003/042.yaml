base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/003/042.yaml
  text: And leaving all these things behind[a], they gape at her; with mouths hanging open they stare at her, and all choose her rather than gold and silver and every beautiful thing.
translation:
  language: de
  text: Und sie lassen dies alles beiseite und gaffen sie an; mit offenem Mund starren sie die Frau an, und alle ziehen sie Gold und Silber und alles Schöne vor.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀφέντες
  choice: lassen … beiseite
  rationale: Das Aoristpartizip von ἀφίημι bezeichnet hier das Zurück- oder Beiseitelassen; die deutsche Partizipialbeziehung wird natürlich durch einen koordinierten Hauptsatz wiedergegeben.
- source_word: ταῦτα πάντα
  choice: dies alles
  rationale: Der substantivierte neutrale Plural verweist zusammenfassend auf die zuvor genannten Dinge; „dies alles“ ist im Deutschen idiomatisch und wahrt den Rückbezug.
- source_word: εἰς αὐτὴν κέχηναν
  choice: gaffen sie an
  rationale: Die Wendung beschreibt ein auf die Frau gerichtetes, offenen Mundes erfolgendes Staunen oder Gaffen. „gaffen sie an“ gibt das lebhafte und leicht zugespitzte Bild knapp wieder.
- source_word: χάσκοντες τὸ στόμα
  choice: mit aufgesperrtem Mund
  rationale: Die Partizipialwendung wiederholt und verstärkt bewusst das Bild des offenen Mundes; „aufgesperrt“ bewahrt diese körperlich anschauliche Wirkung.
- source_word: θεωροῦσιν αὐτήν
  choice: betrachten sie sie
  rationale: θεωρέω bezeichnet ein anhaltendes Anschauen oder Betrachten. Die Formulierung erhält das feminine Pronomen und vermeidet eine unnötige Deutung ihrer inneren Haltung.
- source_word: αἱρετίζουσιν μᾶλλον ἢ
  choice: ziehen … vor
  rationale: Das Verb bezeichnet in Verbindung mit μᾶλλον ἢ eine Wahl beziehungsweise Präferenz. „vorziehen“ bildet diese vergleichende Bedeutung im Deutschen unmittelbar ab.
- source_word: πᾶν πρᾶγμα ὡραῖον
  choice: allem Schönen
  rationale: Die Wendung ist weit gefasst und meint jedes schöne oder begehrenswerte Ding. Das substantivierte „allem Schönen“ klingt natürlich und bewahrt die umfassende Aussage.
theological_decisions: []
translation_notes:
  register: Moderne, allgemein verständliche Standardsprache mit bewusster Wahrung der rhetorischen Wiederholung des offenen Mundes. „Gaffen“ ist kräftig, aber hier durch das anschauliche griechische Verb gerechtfertigt; der Satz bleibt würdevoll und direkt.
