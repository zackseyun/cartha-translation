  yaml_path: translation/deuterocanon/1_esdras/003/028.yaml
  text: They kill and are killed[a], and they do not disobey the king’s word; and if they are victorious, they bring everything to the king[b], and whatever else they plunder.
translation:
  language: de
  text: Sie töten und werden getötet, und sie missachten den Befehl des Königs nicht. Wenn sie aber siegen, bringen sie dem König alles, sowohl die Beute als auch alles Übrige.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Schlussteil ist knapp und syntaktisch schwierig; wörtlich etwa: „und wenn sie Beute machen, und alles Übrige“. Die Übersetzung versteht dies als Aufzählung dessen, was sie dem König bringen.'
    reason: textual_or_syntactic_ambiguity
lexical_decisions:
- source_word: φονεύουσιν καὶ φονεύονται
  choice: Sie töten und werden getötet
  rationale: Die aktive und passive Form des Griechischen wird parallel wiedergegeben. „Ermorden“ wäre im militärischen Zusammenhang moralisch und rechtlich zu eng, „erschlagen“ unnötig altertümlich.
- source_word: τὸν λόγον τοῦ βασιλέως
  choice: dem Befehl des Königs
  rationale: λόγος bedeutet wörtlich „Wort“, bezeichnet hier aber idiomatisch die Weisung oder den Befehl des Königs. „Befehl“ ist im modernen Deutschen eindeutig und natürlich.
- source_word: οὐ παραβαίνουσιν
  choice: sie widersetzen sich ... nicht
  rationale: Das Verb bezeichnet das Übertreten oder Zuwiderhandeln. In Verbindung mit einem königlichen Befehl gibt „sich nicht widersetzen“ den Sinn verständlich wieder, ohne den Ausdruck unnötig zu verrechtlichen.
- source_word: ἐὰν δὲ νικήσωσιν
  choice: Wenn sie aber siegen
  rationale: νικάω bezeichnet das Erringen des Sieges. „Siegen“ ist präzise, würdig und im Deutschen natürlicher als „siegreich sein“.
- source_word: τῷ βασιλεῖ κομίζουσιν πάντα
  choice: bringen sie dem König alles
  rationale: Die Dativbeziehung und der umfassende Sinn von πάντα bleiben erhalten; κομίζω wird im Zusammenhang mit Kriegsbeute natürlich durch „bringen“ wiedergegeben.
- source_word: προνομεύσωσιν
  choice: was sie erbeuten
  rationale: Das seltene Verb bezeichnet das Erbeuten beziehungsweise Plündern im Krieg. „Erbeuten“ passt als Objekt zu „bringen“ und vermeidet die im Deutschen mögliche Betonung zerstörerischen Plünderns.
- source_word: τὰ ἄλλα πάντα
  choice: auch alles Übrige
  rationale: Die umfassende Bedeutung von πάντα und die Unterscheidung zwischen Beute und den übrigen Dingen werden bewahrt.
