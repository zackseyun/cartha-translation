  yaml_path: translation/deuterocanon/1_esdras/003/043.yaml
  text: A man leaves his own father[a], who raised him, and his own country, and clings to his own wife,
translation:
  language: de
  text: Ein Mann verlässt seinen eigenen Vater[a], der ihn großgezogen hat, und sein eigenes Land und bindet sich an seine eigene Frau.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „lässt seinen eigenen Vater im Stich“. Das griechische Verb kann stärker als bloßes Weggehen verstanden werden; hier beschreibt es wahrscheinlich das Verlassen von Vater und Land, um sich an die eigene Frau zu binden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄνθρωπος
  choice: Ein Mann
  rationale: Der Singular bezeichnet hier in einem sprichwortartigen Satz einen repräsentativen Mann; der Bezug auf seine Frau macht die männliche Rolle im Satz ausdrücklich.
- source_word: τὸν ἑαυτοῦ πατέρα
  choice: seinen eigenen Vater
  rationale: Das reflexive ἑαυτοῦ betont die Zugehörigkeit; „seinen eigenen Vater“ bewahrt diesen Nachdruck.
- source_word: ἐγκαταλείπει
  choice: verlässt
  rationale: Das Verb kann stärker „im Stich lassen“ oder „verlassen“ im Sinn von Aufgeben bedeuten. Im Zusammenhang mit dem Weggang von Vater und Land zugunsten der Bindung an die Frau gibt „verlässt“ den Sinn natürlich wieder, ohne unnötig moralische Schuld einzutragen.
- source_word: ὃς ἐξέθρεψεν αὐτόν
  choice: der ihn großgezogen hat
  rationale: ἐκτρέφω bezeichnet hier das Aufziehen und Versorgen eines Kindes; die Formulierung ist im modernen Deutsch natürlich und präzise.
- source_word: τὴν ἰδίαν χώραν
  choice: sein eigenes Land
  rationale: χώρα kann Land, Gebiet oder Heimatland bezeichnen. „Sein eigenes Land“ erhält die emphatische Besitzangabe und vermeidet eine unnötige Festlegung auf den emotionaleren Begriff „Heimat“.
- source_word: πρὸς τὴν ἰδίαν γυναῖκα
  choice: an seine eigene Frau
  rationale: γυνή bedeutet Frau oder Ehefrau; der eheliche Zusammenhang verlangt hier „Frau“ im Sinn von Ehefrau. Die Präposition πρὸς gehört semantisch zur Ausrichtung der engen Bindung.
- source_word: κολλᾶται
  choice: hält sich an
  rationale: Das mediale Verb bezeichnet enge, beständige Bindung. „Hält sich an“ ist würdig und verständlich und bewahrt zugleich die relationale Stärke des griechischen Ausdrucks.
theological_decisions:
- issue: Generisches Maskulinum in einer Aussage über die Ehe
  choice: Ein Mann
  alternative: Ein Mensch
  rationale: Obwohl ἄνθρωπος grundsätzlich „Mensch“ heißen kann, konkretisiert die anschließende Wendung „seine Frau“ die Aussage als männliches Eheszenario. „Ein Mann“ bildet diese im griechischen Satz vorhandene Geschlechtsreferenz ab.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, sprichwortartigem Satzbau. Die Wiederholung von „eigenen/eigenes/eigene“ gibt die dreifache griechische Besitzbetonung bewusst wieder.
