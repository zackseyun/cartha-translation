base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/003/063.yaml
  text: and with her there is no partiality or distinction, but she does what is righteous apart from all that is unjust and evil; and all approve of her works,
translation:
  language: de
  text: Und bei ihr gibt es weder Parteilichkeit[a] noch Unterschiede, sondern sie tut, was recht ist, fern von allem Unrechten und Bösen[b]; und alle finden Gefallen an ihren Werken.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Gesichter anzunehmen«; eine Redewendung für parteiische Begünstigung.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »getrennt von allen Ungerechten und Bösen«. Die griechische Formulierung kann sich auf unrechte und böse Dinge oder Handlungen, aber auch auf unrechte und böse Menschen beziehen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρʼ αὐτῇ
  choice: bei ihr
  rationale: Gibt die relationale Bedeutung natürlich wieder und bewahrt die weibliche Personifikation des Zusammenhangs.
- source_word: λαμβάνειν πρόσωπα
  choice: Parteilichkeit
  rationale: Die Wendung bedeutet wörtlich »Gesichter annehmen« und bezeichnet parteiische Begünstigung.
- source_word: διαφορά
  choice: Bevorzugung
  rationale: Im Parallelismus mit λαμβάνειν πρόσωπα bezeichnet das Wort eine unterscheidende Behandlung; »Bevorzugung« macht diesen ethischen Sinn verständlich, ohne das bereits verwendete »Parteilichkeit« bloß zu wiederholen.
- source_word: τὰ δίκαια ποιεῖ
  choice: sie tut das Rechte
  rationale: Gibt den substantivierten neutralen Plural und das einfache ποιεῖ in natürlichem, würdevollem Deutsch wieder.
- source_word: ἀπὸ πάντων τῶν ἀδίκων καὶ πονηρῶν
  choice: fern von allem Unrechten und Bösen
  rationale: ἀπό bezeichnet Trennung beziehungsweise Abstand. Die substantivierten Formen können sachlich oder persönlich verstanden werden; der Haupttext lässt den Bezug möglichst offen.
- source_word: εὐδοκοῦσι τοῖς ἔργοις αὐτῆς
  choice: finden Gefallen an ihren Werken
  rationale: εὐδοκέω kann Zustimmung oder Wohlgefallen ausdrücken; diese Wiedergabe bewahrt beide Nuancen weitgehend.
theological_decisions:
- issue: Weibliche Personifikation des Subjekts
  choice: Die weiblichen Pronomen werden beibehalten.
  alternative: Das Subjekt unpersönlich mit »es« wiedergeben oder als »Wahrheit« beziehungsweise »Weisheit« ausdrücklich ergänzen.
  rationale: Die griechischen Formen sind weiblich, und der Kontext personifiziert das Subjekt. Eine ausdrückliche Benennung würde mehr festlegen, als dieser Vers selbst sagt.
- issue: Sachlicher oder persönlicher Bezug von τῶν ἀδίκων καὶ πονηρῶν
  choice: »allem Unrechten und Bösen«
  alternative: »allen Ungerechten und Bösen«
  rationale: Die griechischen substantivierten Adjektive lassen sowohl Dinge beziehungsweise Handlungen als auch Menschen als Bezug zu. Die sachliche Haupttextfassung passt zum Kontrast mit »das Rechte«; die persönliche Möglichkeit bleibt in der Fußnote erhalten.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Die feminine Personifikation und die Mehrdeutigkeit des griechischen Trennungsausdrucks bleiben erhalten.
