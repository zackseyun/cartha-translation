  yaml_path: translation/deuterocanon/1_esdras/004/002.yaml
  text: and to all the satraps and generals and local rulers under him[a], from India to Ethiopia, throughout the one hundred twenty-seven satrapies.
translation:
  language: de
  text: und an alle Satrapen, Heerführer und Gebietsherrscher, die ihm unterstanden, von Indien bis Äthiopien, in den einhundertsiebenundzwanzig Satrapien.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in den einhundertsiebenundzwanzig Provinzen“. Das Griechische verwendet hier den persischen Verwaltungsbegriff „Satrapien“, der dem zuvor genannten „Satrapen“ entspricht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σατράπαις
  choice: Satrapen
  rationale: Die Transliteration bewahrt den konkreten persischen Amtstitel und zugleich den Wortzusammenhang mit σατραπείαις.
- source_word: στρατηγοῖς
  choice: Heerführer
  rationale: Das Wort bezeichnet hier militärische Befehlshaber; „Heerführer“ ist verständlich und grenzt sie von den übrigen Amtsträgern ab.
- source_word: τοπάρχαις
  choice: Gebietsherrscher
  rationale: Gemeint sind Herrscher über kleinere Gebiete oder Bezirke. „Gebietsherrscher“ gibt diese Verwaltungsebene verständlich wieder, ohne den wenig geläufigen Fachausdruck „Toparchen“ einzuführen.
- source_word: τοῖς ὑπʼ αὐτὸν
  choice: die ihm unterstanden
  rationale: Die Relativkonstruktion gibt die politische Unterordnung klar und natürlich wieder und kann sich auf alle drei zuvor genannten Gruppen beziehen.
- source_word: ἀπὸ τῆς Ἰνδικῆς μέχρι Αἰθιοπίας
  choice: von Indien bis Äthiopien
  rationale: Dies ist die natürliche deutsche Wiedergabe der geografischen Ausdehnungsformel.
- source_word: ἐν ταῖς ἑκατὸν εἴκοσι ἑπτὰ σατραπείαις
  choice: in den einhundertsiebenundzwanzig Satrapien
  rationale: Die Wiedergabe mit „Satrapien“ bewahrt die Verbindung zum vorausgehenden „Satrapen“ und die spezifisch persische Verwaltungsbezeichnung; „in“ lässt die schlichte griechische Konstruktion stehen.
