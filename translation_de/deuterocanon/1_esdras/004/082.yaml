  yaml_path: translation/deuterocanon/1_esdras/004/082.yaml
  text: Blessed are you[a], who have given me wisdom; and to you I give thanks, Master of the fathers.
translation:
  language: de
  text: Gepriesen bist du, der du mir Weisheit gegeben hast; und dir danke ich[a], Gebieter der Väter.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »dir bekenne ich« beziehungsweise »dich erkenne ich an«. Das griechische Verb kann offenes Bekennen, Anerkennen oder lobendes Danken ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλογητὸς εἶ
  choice: Gepriesen bist du
  rationale: Die doxologische Anrede wird im Deutschen natürlich und würdig mit »Gepriesen bist du« wiedergegeben; »Gesegnet bist du« könnte missverständlich so klingen, als empfange Gott einen Segen von einem Höheren.
- source_word: ὃς ἔδωκάς μοι σοφίαν
  choice: der du mir Weisheit gegeben hast
  rationale: Die Relativkonstruktion und der Dativ werden bewahrt. Das Perfekt bezeichnet im Deutschen eine vollzogene Gabe mit gegenwärtiger Bedeutung.
- source_word: σοὶ ὁμολογῶ
  choice: dir danke ich
  rationale: ὁμολογέω kann bekennen, anerkennen oder in einem Gebetszusammenhang dankend preisen bedeuten. Hier entspricht »danken« dem Lob- und Dankkontext, ohne moderne Leser an ein Sündenbekenntnis denken zu lassen.
- source_word: δέσποτα
  choice: Gebieter
  rationale: »Gebieter« bewahrt gegenüber κύριος (»Herr«) die besondere Bedeutung unumschränkter Autorität und eignet sich als würdige direkte Anrede.
- source_word: τῶν πατέρων
  choice: der Väter
  rationale: Die Wiedergabe bleibt nahe am griechischen Wortlaut und ergänzt kein im Text fehlendes Possessivpronomen; gemeint sein können die Vorfahren.
theological_decisions:
- issue: Göttliche Anrede δέσποτα
  choice: Gebieter
  alternative: Herr; Herrscher
  rationale: »Gebieter« hält die lexikalische Unterscheidung zu κύριος offen und vermittelt die stärkere Aussage von Autorität, ohne zusätzliche konfessionelle Deutung.
- issue: Bedeutung von ὁμολογῶ im Gebet
  choice: dir danke ich
  alternative: dir bekenne ich; dich erkenne ich an; dich preise ich
  rationale: Der doxologische Zusammenhang spricht für dankende Anerkennung. Die alternative Bedeutungsbreite wird in einer Fußnote offengehalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst biblisch-doxologischem Klang. Die Anrede »Gebieter der Väter« bleibt quellennah; die ungewöhnliche Formulierung wird nicht durch »unserer Vorfahren« vereindeutigt.
