base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/004/028.yaml
  text: And now[a], do you not believe me? Is not the king great in his authority? Do not all the lands fear to touch him?
translation:
  language: de
  text: Und nun glaubt ihr mir nicht? Ist der König nicht groß in seiner Macht? Scheuen sich nicht alle Länder, ihn anzurühren?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Haben nicht alle Länder Angst, ihn anzurühren?“ Das griechische Wort für „Länder“ kann auch „Gebiete“ oder „Regionen“ bedeuten; das mit „scheuen sich“ wiedergegebene Verb bezeichnet furchtsame Vorsicht oder ehrfürchtige Zurückhaltung.'
    reason: Lexikalische Bedeutungsbreite bei χῶραι und εὐλαβοῦνται.
lexical_decisions:
- source_word: πιστεύετέ (πιστεύω)
  choice: glaubt
  rationale: Das Verb hat hier den Sprecher als Objekt und bezeichnet, dass seine Aussage für wahr gehalten wird. „Ihr glaubt mir“ gibt die rhetorische Frage im Deutschen natürlich wieder.
- source_word: μέγας
  choice: groß
  rationale: „Groß“ bewahrt die direkte Aussage über Rang und Bedeutung des Königs, ohne sie enger als „mächtig“ auszulegen.
- source_word: ἐξουσίᾳ
  choice: Macht
  rationale: ἐξουσία bezeichnet hier die Herrschafts- oder Verfügungsgewalt des Königs. „Macht“ ist im Satz idiomatischer als „Autorität“, lässt aber den Bezug auf seine Herrschaft erkennen.
- source_word: χῶραι
  choice: Länder
  rationale: χώρα kann Land, Gebiet oder Region bezeichnen. Der Plural „Länder“ passt zum umfassenden politisch-geografischen Sinn, ohne ausdrücklich moderne Nationalstaaten vorauszusetzen.
- source_word: εὐλαβοῦνται
  choice: scheuen sich
  rationale: Das Verb drückt furchtsame Vorsicht oder ehrfürchtige Zurückhaltung aus. „Sich scheuen“ verbindet diese Nuancen natürlich mit dem folgenden Infinitiv.
- source_word: ἅψασθαι (ἅπτομαι)
  choice: anzurühren
  rationale: Der Aoristinfinitiv bedeutet wörtlich „berühren“ oder „ergreifen“. „Ihn anzurühren“ bewahrt das konkrete Bild und kann zugleich den Gedanken einschließen, Hand an den König zu legen.
