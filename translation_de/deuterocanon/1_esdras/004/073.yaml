  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „für die Errichtung des Heiligtums“. Das griechische Wort ἱερόν ist eine übliche Bezeichnung für den Tempel oder die Tempelanlage.'
