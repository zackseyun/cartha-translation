lexical_decisions:
- source_word: οἰκοδομή
  choice: Bau
  rationale: Die Wendung bezeichnet die für den Tempelbau bestimmte Zuwendung. „Bau“ ist knapp, natürlich und bewahrt den substantivischen Ausdruck.
- source_word: ἱερόν
  choice: Tempel
  rationale: ἱερόν bezeichnet hier den heiligen Tempel beziehungsweise die Tempelanlage; im Zusammenhang des Wiederaufbaus ist „Tempel“ die klare Standardwiedergabe.
- source_word: δοθῆναι
  choice: bereitzustellen
  rationale: Der passive Infinitiv steht im Zusammenhang einer behördlichen Anordnung über finanzielle Mittel. „Bereitzustellen“ gibt den Zuweisungscharakter im Deutschen natürlicher wieder als ein bloßes „zu geben“.
- source_word: κατ’ ἐνιαυτόν
  choice: jedes Jahr
  rationale: Die distributive Wendung bezeichnet eine jährlich wiederkehrende Leistung; „jedes Jahr“ ist allgemeinverständlich und präzise.
- source_word: τάλαντα εἴκοσι
  choice: zwanzig Talente
  rationale: Das Talent war eine große Gewichtseinheit und konnte dadurch als Wert- oder Geldmaß dienen. Die traditionelle Bezeichnung bleibt erhalten und wird in der Fußnote erläutert.
- source_word: μέχρι τοῦ οἰκοδομηθῆναι
  choice: bis er fertig gebaut ist
  rationale: Die Konstruktion bezeichnet die Dauer bis zur Vollendung des Baus. Das Pronomen bezieht sich natürlich auf den Tempel, und „fertig gebaut“ macht den Abschlussaspekt deutlich.
