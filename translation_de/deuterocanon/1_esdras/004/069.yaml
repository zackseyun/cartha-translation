  yaml_path: translation/deuterocanon/1_esdras/004/069.yaml
  text: Then King Darius stood up and kissed him, and he wrote letters for him to all the stewards and local rulers and generals and satraps, that they should send him on his way, along with all those with him who were going up to rebuild Jerusalem.
translation:
  language: de
  text: Da stand König Darius auf, küsste ihn herzlich und stellte für ihn Schreiben an alle Verwalter, Statthalter, Heerführer und Satrapen aus. Darin ordnete er an, dass sie ihn und alle, die mit ihm hinaufzogen, um Jerusalem aufzubauen, weitergeleiten sollten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατεφίλησεν
  choice: küsste ihn herzlich
  rationale: Das mit κατά verstärkte Verb bezeichnet einen nachdrücklichen oder herzlichen Kuss; die Wiedergabe vermeidet zugleich die im Deutschen missverständliche Vorstellung wiederholten Küssens.
- source_word: οἰκονόμους
  choice: Verwalter
  rationale: Bezeichnet Amtsträger mit Verwaltungsverantwortung; „Verwalter“ ist im modernen Deutschen klarer und breiter verständlich als „Haushalter“.
- source_word: τοπάρχας
  choice: Statthalter
  rationale: Gemeint sind Herrscher beziehungsweise Amtsträger regionaler Gebiete. „Statthalter“ gibt die Funktion natürlich wieder, auch wenn sich der Rang mit anderen Provinzämtern überschneiden kann.
- source_word: στρατηγοὺς
  choice: Heerführer
  rationale: Bewahrt die militärische Bedeutung des griechischen Titels in verständlichem, würdigem Deutsch.
- source_word: σατράπας
  choice: Satrapen
  rationale: Der etablierte historische Amtstitel wird beibehalten.
- source_word: προπέμψωσιν
  choice: sicher weiterziehen ließen
  rationale: Das Verb meint, jemanden für die Weiterreise auszustatten, zu geleiten oder ihm sicheres Fortkommen zu ermöglichen. Die Formulierung passt zum behördlichen Adressatenkreis, ohne eine bestimmte Art der Hilfe festzulegen.
- source_word: οἰκοδομῆσαι
  choice: aufzubauen
  rationale: Das Grundverb bedeutet „bauen/aufbauen“. Im Kontext ist die Wiederherstellung Jerusalems gemeint; „aufbauen“ lässt dies erkennen, ohne ausdrücklich ein „wieder-“ in den griechischen Wortlaut einzutragen.
theological_decisions:
- issue: Bau beziehungsweise Wiederaufbau Jerusalems
  choice: Jerusalem aufzubauen
  alternative: Jerusalem wiederaufzubauen
  rationale: Der geschichtliche Zusammenhang spricht vom Wiederaufbau, doch das griechische οἰκοδομῆσαι sagt formal „bauen/aufbauen“. Die gewählte Form bewahrt den Wortlaut und ist zugleich im Wiederherstellungskontext natürlich verständlich.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die lange griechische Satzperiode wurde zur besseren Verständlichkeit in zwei Sätze gegliedert. „Darin ordnete er an“ macht die Zweckkonstruktion der Schreiben idiomatisch deutlich, ohne zusätzliche inhaltliche Festlegung.
