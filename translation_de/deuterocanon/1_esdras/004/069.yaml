review_pass:
  verdict: revise
  source_fidelity: Der Entwurf gibt den Satzbau, die Amtsgruppen und das Ziel des Hinaufziehens zur Errichtung Jerusalems grundsätzlich zutreffend wieder. Allerdings fügt „sicher“ eine im griechischen προπέμψωσιν nicht ausgedrückte Sicherheit zu, während „weiterziehen ließen“ eher bloße Reiseerlaubnis als das veranlasste Weitergeleiten bezeichnet.
  naturalness: Modernes, würdiges Deutsch. „Weitergeleiten“ ist hier eine knappe, sachgerechte Wiedergabe der behördlich veranlassten Weiterreise.
  terminology: „Verwalter, Statthalter, Heerführer und Satrapen“ gibt οἰκονόμους, τοπάρχας, στρατηγούς und σατράπας angemessen wieder. „Herzlich küsste“ ist als Wiedergabe des verstärkten κατεφίλησεν vertretbar. „Jerusalem aufzubauen“ wahrt die Formulierung οἰκοδομῆσαι, ohne den im Kontext naheliegenden Wiederaufbau zwingend in den Wortlaut einzutragen.
  issues:
  - severity: medium
    issue: Zusatz „sicher“
    rationale: Der griechische Text sagt, dass die Amtsträger Serubbabel und seine Begleiter weitergeleiten sollen; eine ausdrückliche Zusage sicheren Geleits enthält er nicht.
  - severity: medium
    issue: „weiterziehen ließen“ ist zu permissiv
    rationale: προπέμψωσιν bezeichnet aktives Aussenden, Weitergeleiten oder Fördern der Reise, nicht lediglich das Gewähren einer Erlaubnis.
