  text: Then King Darius stood up and kissed him[a], and wrote letters for him to all the stewards and regional governors and generals and satraps[b], that they should escort him and all those with him who were going up to build Jerusalem.
translation:
  language: de
  text: Da stand König Darius auf, küsste ihn und schrieb für ihn Briefe an alle Verwalter, Vorsteher der Bezirke, Heerführer und Satrapen, damit sie ihm und allen, die mit ihm hinaufzogen, um Jerusalem zu bauen, Geleit gäben.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „damit sie ihn und alle, die mit ihm hinaufzogen, auf den Weg schickten und unterstützten“. Das griechische Verb kann Geleitgeben oder Entsenden einschließen und außerdem Unterstützung für die Reise bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε ἀναστὰς
  choice: Da stand … auf
  rationale: Gibt die zeitliche Fortführung und das konkrete Aufstehen in natürlichem deutschem Erzählstil wieder.
- source_word: κατεφίλησεν
  choice: küsste
  rationale: Bewahrt die konkrete Geste, ohne die mögliche Intensität des zusammengesetzten Verbs unnötig auszudeuten.
- source_word: ἔγραψεν αὐτῷ τὰς ἐπιστολάς
  choice: schrieb für ihn Briefe
  rationale: Das Dativpronomen bezeichnet hier am ehesten die begünstigte Person; der unbestimmte deutsche Plural ist idiomatisch.
- source_word: οἰκονόμους
  choice: Verwalter
  rationale: Bezeichnet im amtlichen Zusammenhang Personen, die Güter oder Mittel verwalten; vermeidet die zu enge Festlegung auf Schatzmeister.
- source_word: τοπάρχας
  choice: Regionalherrscher
  rationale: Übersetzt den lokalen beziehungsweise regionalen Herrschaftstitel verständlich, ohne ihn mit Satrapen oder gewöhnlichen Statthaltern gleichzusetzen.
- source_word: στρατηγοὺς
  choice: Heerführer
  rationale: Gibt den militärischen Amtstitel klar und in historisch passendem Deutsch wieder.
- source_word: σατράπας
  choice: Satrapen
  rationale: Bewahrt den spezifischen persischen Verwaltungstitel.
- source_word: ἵνα προπέμψωσιν
  choice: damit sie … auf dem Weg unterstützten
  rationale: προπέμπω kann sowohl Geleit als auch praktische Reisehilfe bezeichnen; die Formulierung erhält diese semantische Breite.
- source_word: ἀναβαίνοντας
  choice: hinaufzogen
  rationale: Bewahrt die traditionelle räumliche Vorstellung des Hinaufziehens nach Jerusalem und passt zur erzählten Reise.
- source_word: οἰκοδομῆσαι τὴν Ἰερουσαλήμ
  choice: um Jerusalem zu bauen
  rationale: Übersetzt das einfache οἰκοδομέω ohne den aus dem Kontext möglichen, aber im Verb nicht ausdrücklich enthaltenen Zusatz „wieder“.
theological_decisions:
- issue: Bauen oder Wiederaufbauen Jerusalems
  choice: Jerusalem zu bauen
  alternative: Jerusalem wiederaufzubauen
  rationale: Der weitere Zusammenhang legt Wiederaufbau nahe, doch der griechische Wortlaut sagt lediglich „bauen“; diese Spannung wird nicht stillschweigend aufgelöst.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Reihung der Amtsträger bleibt erhalten; historisch spezifische Titel werden entweder verständlich übersetzt oder, bei „Satrapen“, als etablierter Fachbegriff beibehalten.
