base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/004/064.yaml
  text: Then the king said to him, “Ask for whatever you want beyond what has been written, and we will give it to you, since you have been found wiser; and you shall sit next to me, and you shall be called my kinsman.”
translation:
  language: de
  text: 'Da sagte der König zu ihm: »Bitte um alles, was du über das Geschriebene hinaus willst, und wir werden es dir geben, weil du als weiser befunden worden bist. Du sollst neben mir sitzen und mein Verwandter genannt werden.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Αἴτησαι
  choice: Bitte
  rationale: Der Aorist-Imperativ fordert unmittelbar dazu auf, eine Bitte auszusprechen; »Bitte« ist im Deutschen natürlich und wahrt den Aufforderungscharakter.
- source_word: πλείω τῶν γεγραμμένων
  choice: alles, was du über das Geschriebene hinaus willst
  rationale: Die Formulierung gibt den komparativen Sinn »mehr als das Geschriebene« idiomatisch wieder, ohne festzulegen, worauf genau das zuvor Geschriebene verweist.
- source_word: ὃν τρόπον εὑρέθης σοφώτερος
  choice: weil du als weiser befunden worden bist
  rationale: Die kausale Verbindung und die passive Feststellung des griechischen Textes bleiben erhalten; der Komparativ »weiser« wird nicht durch einen ausdrücklich genannten Vergleich ergänzt.
- source_word: ἐχόμενός μου καθήσῃ
  choice: Du sollst neben mir sitzen
  rationale: ἐχόμενος bezeichnet hier räumliche Nähe; »neben mir« ist die natürliche deutsche Wiedergabe.
- source_word: συγγενής μου
  choice: mein Verwandter
  rationale: »Verwandter« bewahrt den familiären beziehungsweise rangbezogenen Ausdruck, ohne eine genauere Verwandtschaftsbeziehung zu behaupten.
theological_decisions:
- issue: Bedeutung der Ernennung zum συγγενής des Königs
  choice: mein Verwandter genannt werden
  alternative: zu meinem Vertrauten ernannt werden
  rationale: Der Ausgangstext verwendet ausdrücklich einen Verwandtschaftsbegriff. Die Übersetzung lässt offen, ob eine tatsächliche, ehrenhalber verliehene oder höfische Beziehung gemeint ist.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit direkter königlicher Rede. Das Passiv »als weiser befunden worden bist« wurde trotz seiner leichten Förmlichkeit bewahrt, weil es die Aussageform des griechischen Textes präzise wiedergibt.
