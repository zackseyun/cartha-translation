    reason: lexical_alternative
lexical_decisions:
- source_word: παρʼ αὐτὴν
  choice: bei ihr
  rationale: Die Wendung bezeichnet, was im Bereich der personifizierten Wahrheit keinen Platz hat. „Bei ihr“ ist knapp, natürlich und bewahrt den persönlichen Bezug.
- source_word: λαμβάνειν πρόσωπα
  choice: Ansehen der Person
  rationale: Das griechische Idiom bedeutet, jemanden nach seiner Person oder Stellung zu bevorzugen. Die im Deutschen geläufige Wendung gibt den Sinn wieder, ohne das undurchsichtige Bild vom „Nehmen von Gesichtern“ wörtlich zu übertragen.
- source_word: διάφορα
  choice: Annahme von Geschenken
  rationale: Das substantivierte Neutrum Plural kann hier Vorteile, Gewinne oder Zuwendungen bezeichnen. In der Verbindung mit λαμβάνειν und dem unmittelbar vorausgehenden Verbot parteiischer Behandlung liegt die Annahme von Geschenken als Mittel unlauterer Einflussnahme nahe; eine Fußnote wahrt die lexikalische Spannweite.
- source_word: τὰ δίκαια
  choice: das Rechte
  rationale: Der substantivierte Plural bezeichnet das, was gerecht oder recht ist. „Das Rechte“ ist im Deutschen idiomatisch und behält den ethisch-rechtlichen Klang.
- source_word: ἀπὸ πάντων τῶν ἀδίκων καὶ πονηρῶν
  choice: fern von allem Ungerechten und Bösen
  rationale: ἀπό drückt hier Trennung oder Abstand aus. „Fern von“ bewahrt diese separative Kraft besser als ein bloßer Vergleich wie „eher als“.
- source_word: εὐδοκοῦσι
  choice: haben Gefallen an
  rationale: Das Verb kann Wohlgefallen, Zustimmung oder Billigung ausdrücken. „Gefallen haben an“ passt zur Verbindung mit den Werken und lässt den positiven Bedeutungsumfang offen.
- source_word: αὐτὴν / αὐτῆς
  choice: ihr / ihren
  rationale: Die Pronomen beziehen sich auf die grammatisch feminine und im Kontext personifizierte Wahrheit. Der feminine Bezug erhält die rhetorische Gestalt des griechischen Textes.
theological_decisions:
- issue: Personifizierung der Wahrheit
  choice: Den femininen persönlichen Bezug mit „ihr“ und „ihren“ beibehalten
  alternative: Die Wahrheit unpersönlich mit „sie“ nur als grammatischem Genus oder mit einer Umformulierung wiedergeben
  rationale: Der Kontext stellt die Wahrheit rhetorisch als handelnde weibliche Gestalt dar. Die Beibehaltung erhält diese literarische Spannung, ohne daraus eine zusätzliche Lehraussage abzuleiten.
- issue: Bedeutung von διάφορα im Zusammenhang unparteiischen Handelns
  choice: Als angenommene Geschenke beziehungsweise Vorteile wiedergeben
  alternative: „Unterschiede“ oder „Bevorzugungen“
  rationale: Die Koordination unter λαμβάνειν sowie der gerichtliche und ethische Zusammenhang sprechen für materielle Vorteile oder Zuwendungen. Da das Wort breiter sein kann, wird die Alternative in einer Fußnote kenntlich gemacht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt rhetorisch knapp; „Ansehen der Person“ ist eine verständliche, im Deutschen etablierte Rechts- und Bibelwendung. Die Personifizierung der Wahrheit und die Trennungsaussage von ἀπό werden bewahrt.
