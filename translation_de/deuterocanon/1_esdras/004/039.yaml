  text: and with her there is no partiality or favoritism[a], but she does what is just rather than all that is unjust and wicked; and all approve of her works[b],
translation:
  language: de
  text: Bei ihr gibt es weder Ansehen der Person[a] noch Bevorzugung[b]; vielmehr tut sie das Rechte, fern von allem Ungerechten und Bösen, und alle haben Gefallen an ihren Werken.
  philosophy: optimal-equivalence
  footnotes:
