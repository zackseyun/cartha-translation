base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/004/005.yaml
  text: Let each of us speak one word that will prevail[a]; and whoever’s statement appears wiser than the other’s, Darius the king will give him great gifts and great honors of victory[b],
translation:
  language: de
  text: Jeder von uns soll einen Ausspruch vorbringen, der sich durchsetzen wird.[a] Und wessen Aussage weiser erscheint als die des anderen, dem wird König Darius große Geschenke und große Siegesauszeichnungen geben.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eine Aussage“, „eine These“. Das griechische λόγος ist knapp und kann den Ausspruch oder den gedanklichen Beitrag zum Wettstreit bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: „Siegesauszeichnungen“ gibt ἐπινίκια wieder, also Ehrungen oder Belohnungen, die dem Sieger zuteilwerden.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἴπωμεν ἕκαστος ἡμῶν
  choice: Jeder von uns soll … vorbringen
  rationale: Der hortative Konjunktiv der ersten Person Plural wird als gemeinsamer Vorschlag wiedergegeben; die deutsche Soll-Konstruktion ist natürlich und bewahrt den auffordernden Sinn.
- source_word: ἕνα λόγον
  choice: einen Ausspruch
  rationale: λόγος bezeichnet hier den einzelnen Beitrag zum Wettstreit, möglicherweise eine Aussage oder These. „Ausspruch“ bleibt knapp, ohne ihn bereits als ausgeführtes Argument festzulegen.
- source_word: ὃς ὑπερισχύσει
  choice: der sich als überlegen erweisen wird
  rationale: ὑπερισχύω bedeutet, die Oberhand zu gewinnen beziehungsweise stärker zu sein. Die Wiedergabe passt zum anschließenden Vergleich und zum Wettbewerbsrahmen.
- source_word: τὸ ῥῆμα αὐτοῦ
  choice: dessen Aussage
  rationale: ῥῆμα meint hier den geäußerten Inhalt. „Aussage“ ist im modernen Deutsch klar und vermeidet eine unnatürliche Wiederholung von „Ausspruch“.
- source_word: φανῇ … σοφώτερον
  choice: weiser erscheint
  rationale: Die Form von φαίνω lässt offen, ob etwas bloß den Anschein erweckt oder bei der Beurteilung als solches erkannt wird; „erscheint“ bewahrt diese Offenheit.
- source_word: τοῦ ἑτέρου
  choice: als die des anderen
  rationale: Der elliptische Vergleich wird im Deutschen durch das Pronomen „die“ verständlich ergänzt, ohne einen zusätzlichen Referenten einzuführen.
- source_word: δωρεὰς μεγάλας
  choice: große Geschenke
  rationale: Eine direkte und natürliche Wiedergabe von δωρεά, das Gabe oder Geschenk bezeichnet.
- source_word: ἐπινίκια μεγάλα
  choice: hohe Siegesauszeichnungen
  rationale: ἐπινίκια bezeichnet Auszeichnungen oder Belohnungen für einen Sieg. „Siegesauszeichnungen“ erhält den Siegesbezug, ohne die Form der Ehrung materiell festzulegen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur folgt dem Griechischen, wird jedoch in zwei Sätze gegliedert. Die unterschiedlichen Wörter λόγος und ῥῆμα werden mit „Ausspruch“ und „Aussage“ wiedergegeben; die semantische Nähe bleibt erkennbar. Das abschließende Komma des Quellenausschnitts wird als Satzpunkt behandelt.
