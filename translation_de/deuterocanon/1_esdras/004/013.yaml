  text: And when the king awoke[a], they took the letter and gave it to him[b], and he read it.
translation:
  language: de
  text: Und als der König erwachte, nahmen sie das Schriftstück und gaben es ihm; und er las es.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτε ἐξηγέρθη
  choice: als der König erwachte
  rationale: Das passivische Aoristverb kann intransitiv das Erwachen oder Aufstehen bezeichnen. Im erzählerischen Zusammenhang ist „erwachte“ natürlich und legt nicht unnötig nahe, dass jemand den König weckte.
- source_word: λαβόντες
  choice: nahmen sie
  rationale: Das Partizip bezeichnet eine der Übergabe vorausgehende bzw. sie begleitende Handlung. Ein finites Verb gibt die Abfolge im Deutschen flüssig wieder.
- source_word: τὸ γράμμα
  choice: das Schriftstück
  rationale: γράμμα bezeichnet hier das Geschriebene bzw. ein Dokument. „Schriftstück“ bewahrt diese Breite besser als „Brief“, da der griechische Text keine Briefform voraussetzt.
- source_word: ἔδωκαν αὐτῷ
  choice: gaben es ihm
  rationale: Dies entspricht der schlichten Bedeutung des griechischen Ausdrucks und ergänzt das im Deutschen notwendige Objektpronomen.
- source_word: ἀνέγνω
  choice: er las es
  rationale: Das Verb kann je nach Zusammenhang „lesen“ oder „vorlesen“ bedeuten. Da hier kein lautes Lesen ausdrücklich bezeichnet wird, bleibt „las es“ angemessen offen.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle Erzählsprache. Die parataktische Struktur des Griechischen bleibt durch das Semikolon und das anschließende „und“ erkennbar, ohne im Deutschen schwerfällig zu wirken.
