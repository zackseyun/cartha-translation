  source_fidelity: 'Die Übersetzung gibt die Satzfolge und den Inhalt des Griechischen zuverlässig wieder: das Aufhören des Redens, den kollektiven Ausruf des Volkes und die anschließende Akklamation. »hörte auf zu reden« entspricht ἐσιώπησεν τοῦ λαλεῖν idiomatisch. »das ganze Volk« wahrt den kollektiven Singular von πᾶς ὁ λαός; der anschließende Plural »sie sagten« bildet den griechischen Wechsel zu εἶπον angemessen ab. »sie setzt sich durch« ist eine treffende Wiedergabe von ὑπερισχύει.'
