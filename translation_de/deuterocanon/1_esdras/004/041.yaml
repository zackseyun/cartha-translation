  yaml_path: translation/deuterocanon/1_esdras/004/041.yaml
  text: And he stopped speaking; and then all the people cried out[a], and then they said, “Great is the truth, and it prevails.”
translation:
  language: de
  text: 'Und er hörte auf zu reden. Da rief das ganze Volk, und dann sagten sie: »Groß ist die Wahrheit, und sie setzt sich durch.[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »sie ist überlegen«; auch: »sie siegt«. Das griechische Verb kann ausdrücken, dass etwas stärker ist, die Oberhand behält oder überwindet.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσιώπησεν τοῦ λαλεῖν
  choice: hörte auf zu reden
  rationale: Die Verbindung aus ἐσιώπησεν und dem articularen Infinitiv τοῦ λαλεῖν bezeichnet das Ende des Redens. Die gewählte Formulierung ist im Deutschen natürlich und gibt den abgeschlossenen Vorgang klar wieder.
- source_word: πᾶς ὁ λαός
  choice: das ganze Volk
  rationale: λαός bezeichnet hier die versammelte Bevölkerung; »das ganze Volk« bewahrt den kollektiven Charakter und entspricht dem griechischen Singular.
- source_word: ἐφώνησεν
  choice: rief
  rationale: Das Verb bezeichnet einen hörbaren öffentlichen Ausruf. »Rief« ist würdig und präzise, ohne Lautstärke oder Gefühlslage unnötig festzulegen.
- source_word: Μεγάλη ἡ ἀλήθεια
  choice: Groß ist die Wahrheit
  rationale: Die vorangestellte Prädikatsangabe wird als feierlicher, sprichwortartiger Ausruf bewahrt; der bestimmte Artikel von ἡ ἀλήθεια wird mit »die Wahrheit« wiedergegeben.
- source_word: ὑπερισχύει
  choice: sie setzt sich durch
  rationale: Das Verb drückt Überlegenheit beziehungsweise erfolgreiches Obsiegen aus. »Sie setzt sich durch« ist gegenwärtiges, verständliches Deutsch und erhält die dynamische Aussage, ohne eine mögliche Nuance endgültig festzulegen.
theological_decisions:
- issue: Personifikation und Vorrang der Wahrheit in der öffentlichen Akklamation
  choice: die Wahrheit … sie setzt sich durch
  alternative: Wahrheit … ist am stärksten / siegt
  rationale: Der bestimmte Artikel und das feminine Verbsubjekt werden nachvollziehbar bewahrt. Die Übersetzung gibt die behauptete Überlegenheit der Wahrheit wieder, ohne daraus eine weitergehende dogmatische Identifikation abzuleiten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die zweimalige zeitliche Markierung τότε wird mit »Da« und »dann« wiedergegeben. Der Wechsel vom kollektiven Singular (»das ganze Volk rief«) zum griechischen Plural (»sie sagten«) bleibt im Deutschen sichtbar. Der Fußnotenmarker steht unmittelbar bei der mehrdeutigen Wiedergabe von ὑπερισχύει.
