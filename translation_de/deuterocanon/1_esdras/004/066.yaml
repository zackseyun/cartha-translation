  yaml_path: translation/deuterocanon/1_esdras/004/066.yaml
  text: and all the vessels taken from Jerusalem are to be sent back there—those that Cyrus set apart when he vowed to destroy Babylon[c][b][a], and vowed to send there.
translation:
  language: de
  text: und alle Geräte, die aus Jerusalem weggenommen worden waren und die Kyrus ausgesondert hatte, dorthin zurückzuschicken[a], als er gelobte[b], Babylon zu vernichten[c], und gelobte, sie dorthin zu senden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „dorthin zu schicken“; „zurück“ ergibt sich aus dem Zusammenhang, da die Geräte aus Jerusalem weggenommen worden waren.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „betete“.'
    reason: alternative_reading
  - marker: c
    text: 'Wörtlich: „Babylon abzuschneiden“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σκεύη
  choice: Geräte
  rationale: Im Tempelzusammenhang bezeichnet das Wort die zum Kult gehörenden Gefäße und sonstigen Gegenstände. „Geräte“ ist der geläufige deutsche Sammelbegriff, ohne die Art der Gegenstände unnötig einzuengen.
- source_word: τὰ λημφθέντα ἐξ Ἰερουσαλήμ
  choice: die aus Jerusalem weggenommen worden waren
  rationale: Das Partizip bezeichnet bereits zuvor aus Jerusalem entfernte Gegenstände; das Plusquamperfekt macht dieses zeitliche Verhältnis im Deutschen deutlich.
- source_word: ἐκπέμψαι
  choice: dorthin zurückzuschicken
  rationale: Wörtlich geht es um ein Hinsenden. Da die Geräte aus Jerusalem weggenommen worden waren, macht „zurück“ die im Zusammenhang erkennbare Rückführung deutlich; die wörtlichere Form wird in einer Fußnote bewahrt.
- source_word: ἃ ἐχώρισεν
  choice: jene, die ... ausgesondert hatte
  rationale: χωρίζω bezeichnet hier das Absondern oder gesonderte Bereitstellen der Geräte. „Ausgesondert“ wahrt diesen Sinn, ohne einen ausdrücklich sakralen Akt zu unterstellen.
- source_word: ηὔξατο
  choice: gelobte
  rationale: Mit den folgenden Infinitiven bezeichnet das Verb wahrscheinlich ein Gelübde oder eine feierliche Verpflichtung. Die ebenfalls mögliche Bedeutung „betete“ bleibt als Fußnote erhalten.
- source_word: ἐκκόψαι Βαβυλῶνα
  choice: Babylon zu vernichten
  rationale: Das wörtliche „Babylon abzuschneiden“ ist im heutigen Deutsch bei einer Stadt schwer verständlich. „Vernichten“ gibt den wahrscheinlich gemeinten bildlichen Sinn natürlich wieder, während die Metapher in einer Fußnote dokumentiert wird.
- source_word: ἐξαποστεῖλαι ἐκεῖ
  choice: sie dorthin zu senden
  rationale: Das im Deutschen ergänzte Pronomen hat die ausgesonderten Geräte als naheliegenden Bezug und ergibt einen vollständigen, verständlichen Satz. „Dorthin“ bildet ἐκεῖ formal ab.
theological_decisions:
- issue: Bedeutung von ηὔξατο für das Handeln des Kyrus
  choice: gelobte
  alternative: betete
  rationale: Die Konstruktion mit Infinitiven spricht eher für ein Gelübde oder eine feierliche Zusage als für ein allgemeines Gebet. Da beide Bedeutungen lexikalisch möglich sind und die Darstellung von Kyrus’ Handeln berühren, wird die Alternative nicht stillschweigend ausgeschlossen.
- issue: Explizite Wiedergabe der Rückführung in ἐκπέμψαι ... ἐκεῖ
  choice: dorthin zurückzuschicken
  alternative: dorthin zu schicken
  rationale: Der Zusammenhang macht deutlich, dass die zuvor aus Jerusalem weggenommenen Geräte wieder dorthin gelangen sollen. Das Deutsche darf diese Zielrichtung zur Verständlichkeit ausdrücken, doch die Tatsache, dass im Griechischen kein eigenes Wort für „zurück“ steht, wird vermerkt.
- issue: Bildsprache in ἐκκόψαι Βαβυλῶνα
  choice: Babylon zu vernichten
  alternative: Babylon abzuschneiden
  rationale: Die wörtliche Bildsprache ist im Deutschen bei einer Stadt unklar. Die Hauptfassung gibt den naheliegenden Sinn wieder, während die ungewöhnliche griechische Formulierung in der Fußnote erhalten bleibt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzform bleibt wegen des fragmentarischen Anschlusses im griechischen Ausgangstext mit „und“ eröffnet. Der Gedankenstrich gliedert den langen Nachtrag zu den Geräten; die Pronomenreferenz wird zur deutschen Verständlichkeit verdeutlicht.
