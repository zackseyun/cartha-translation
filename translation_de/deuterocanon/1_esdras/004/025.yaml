base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/004/025.yaml
  text: But the king prevails over them and rules over them[a], and is master over them, and whatever he says to them, they obey.
translation:
  language: de
  text: Doch der König ist stärker als sie, herrscht über sie und ist ihr Herr; und allem, was er ihnen sagt, gehorchen sie.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „auf ihn hören sie“ beziehungsweise „das befolgen sie“. Das griechische Verb bezeichnet wörtlich ein Hören, hat hier aber den Sinn, einem königlichen Befehl Folge zu leisten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ βασιλεὺς
  choice: Doch der König
  rationale: δέ führt den Gegensatz im Gedankengang fort; „doch“ gibt diese leicht adversative Funktion natürlich wieder.
- source_word: ὑπερισχύει
  choice: ist stärker als sie
  rationale: Das Verb bezeichnet ein Überlegen- oder Stärkersein. Die vergleichende Bedeutung wird so unmittelbar bewahrt.
- source_word: κυριεύει αὐτῶν
  choice: herrscht über sie
  rationale: κυριεύω bezeichnet die Ausübung von Herrschaft; „herrscht über“ ist gegenwärtiges, würdevolles Standarddeutsch.
- source_word: δεσπόζει αὐτῶν
  choice: gebietet über sie
  rationale: δεσπόζω drückt eine starke, herrschaftliche Verfügungsgewalt aus. „Gebietet über“ wahrt die Steigerung gegenüber „herrscht“, ohne unnatürlich zu klingen.
- source_word: πᾶν ὃ ἐὰν εἴπῃ αὐτοῖς
  choice: was immer er ihnen sagt
  rationale: Die indefinite Konstruktion wird idiomatisch und vollständig wiedergegeben.
- source_word: ἐνακούουσιν
  choice: dem gehorchen sie
  rationale: Das hörbezogene Verb bezeichnet im Zusammenhang königlicher Weisungen das befolgende Hören, also Gehorsam; das vorangestellte „dem“ bindet sich an alles, was der König sagt.
theological_decisions: []
translation_notes:
  register: Modernes, verständliches und zugleich würdevolles Standarddeutsch. Die drei Aussagen über die Überlegenheit und Herrschaft des Königs bleiben als eigenständige, sich steigernde Glieder erhalten.
