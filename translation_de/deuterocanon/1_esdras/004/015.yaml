translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die kurzen Satzfolgen des griechischen Berichts bleiben erkennbar, werden aber durch »Dann« und »Da« natürlich verbunden. Die institutionelle Unschärfe von χρηματιστήριον wird im Haupttext nicht überbestimmt und in der Fußnote ausgewiesen.
