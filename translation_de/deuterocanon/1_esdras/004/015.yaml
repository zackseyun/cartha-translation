  yaml_path: translation/deuterocanon/1_esdras/004/015.yaml
  text: And he sat in the council chamber[a], and the letter was read before them. And he said, “Call the young men, and they will explain their words.” And they were called, and they entered.
translation:
  language: de
  text: 'Und er setzte sich in den Ratssaal[a], und das Schreiben wurde vor ihnen verlesen. Dann sagte er: »Ruft die jungen Männer! Sie werden ihre Worte erklären.« Da wurden sie gerufen und traten ein.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder »Gerichtssaal« beziehungsweise »Verhandlungssaal«. Das griechische Wort bezeichnet einen offiziellen Ort der Beratung oder Rechtsprechung; die genaue institutionelle Bedeutung ist nicht eindeutig.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκάθισεν
  choice: setzte sich
  rationale: Die aoristische Erzählform bezeichnet hier schlicht das Sichsetzen; die Wiedergabe vermeidet eine zusätzliche zeremonielle Nuance.
- source_word: χρηματιστηρίῳ
  choice: Ratssaal
  rationale: Das Wort bezeichnet einen offiziellen Ort der Beratung oder Rechtsprechung. »Ratssaal« passt zum Kontext, ohne die genaue institutionelle Funktion enger festzulegen, als es der griechische Ausdruck erlaubt.
- source_word: ἀνεγνώσθη
  choice: wurde verlesen
  rationale: Das Passiv bezeichnet das Lesen vor der Versammlung. »Verlesen« gibt diesen öffentlichen Vorgang natürlich wieder, ohne ein nicht genanntes Subjekt hinzuzufügen.
- source_word: γράμμα
  choice: Schreiben
  rationale: Der Ausdruck meint hier ein schriftlich eingereichtes Stück. »Schreiben« ist weiter als »Brief« und passt zu der im Zusammenhang vorgelesenen Aussage.
- source_word: νεανίσκους
  choice: jungen Männer
  rationale: Gemeint sind die drei männlichen Teilnehmer; die Formulierung ist klar, modern und dem griechischen Ausdruck entsprechend.
- source_word: δηλώσουσιν
  choice: sollen ... erklären
  rationale: 'Das Futur hat nach dem vorausgehenden Aufruf sinngemäß auffordernde Kraft: Die jungen Männer werden beziehungsweise sollen ihre eigenen Aussagen erläutern.'
- source_word: λόγους
  choice: Worte
  rationale: Die grundlegende Bedeutung bleibt erhalten; das Verb »erklären« macht deutlich, dass es um die Darlegung ihrer schriftlichen Aussagen geht.
- source_word: εἰσῆλθοσαν
  choice: traten ein
  rationale: Die Wendung gibt die abgeschlossene Bewegung in den offiziellen Versammlungsraum in natürlichem, würdigem Deutsch wieder.
