  text: And many were destroyed and were led astray and sinned because of women[a].
translation:
  language: de
  text: Und viele gingen zugrunde, gerieten auf Abwege und sündigten wegen der Frauen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wegen der Ehefrauen“. Das griechische Wort kann je nach Zusammenhang „Frauen“ oder „Ehefrauen“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  choice: viele
  rationale: Die schlichte Mengenangabe entspricht dem griechischen Adjektiv natürlich und präzise.
- source_word: ἀπώλοντο
  choice: kamen um
  rationale: Die mediale Form von ἀπόλλυμι bezeichnet hier schweres Verderben bzw. Zugrundegehen. „Kamen um“ gibt die Schärfe idiomatisch wieder, ohne ausdrücklich nur eine gewaltsame Tötung zu behaupten.
- source_word: ἐσφάλησαν
  choice: gerieten auf Abwege
  rationale: Die intransitive/passive Bedeutung von σφάλλω beschreibt ein Abkommen vom richtigen Weg oder Fehlgehen. Die Formulierung passt zum moralischen Zusammenhang, ohne eine ausdrückliche Täuschung einzutragen.
- source_word: ἡμάρτοσαν
  choice: sündigten
  rationale: Im moralisch-religiösen Zusammenhang ist dies die direkte und geläufige Wiedergabe von ἁμαρτάνω.
- source_word: διὰ
  choice: wegen
  rationale: διά mit Akkusativ bezeichnet hier Ursache oder Anlass; „wegen“ erhält die direkte Kausalbehauptung des Ausgangstextes.
- source_word: τὰς γυναῖκας
  choice: der Frauen
  rationale: γυνή kann je nach Zusammenhang „Frau“ oder „Ehefrau“ bedeuten. Der generisch-sentenziöse Kontext spricht eher für „Frauen“; die andere Möglichkeit wird in der Fußnote bewahrt.
theological_decisions:
- issue: Die kausale Aussage kann frauenfeindlich wirken
  choice: wegen der Frauen
  alternative: wegen ihrer Ehefrauen
  rationale: Der griechische Text formuliert mit διά und Akkusativ ausdrücklich kausal und verwendet den allgemeinen Plural γυναῖκας. Die problematische Spannung wird nicht abgeschwächt oder erklärend aufgelöst; zugleich dokumentiert die Fußnote die echte lexikalische Mehrdeutigkeit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die dreigliedrige Folge des Griechischen bleibt erhalten; „gerieten auf Abwege“ ist idiomatisch und wahrt den moralischen Sinn, ohne eine nicht ausdrücklich genannte Täuschung vorauszusetzen.
