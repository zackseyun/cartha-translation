  terminology: „Sündigten“ ist die angemessene Wiedergabe von ἡμάρτοσαν. „Frauen“ wahrt die generische, im Kontext polemisch-sentenziöse Formulierung von γυναῖκες. Die Fußnotenalternative darf jedoch kein im Griechischen fehlendes Possessivpronomen („ihrer“) ergänzen.
