lexical_decisions:
- source_word: λέγων
  choice: und sagte
  rationale: Das griechische Präsenspartizip leitet die direkte Rede ein. Im Deutschen gibt eine finite Form den Erzählanschluss natürlicher wieder.
- source_word: Παρὰ σοῦ
  choice: Von dir kommt
  rationale: παρά mit dem Genitiv bezeichnet hier am ehesten Ursprung oder Quelle. Die Wiederholung wird beibehalten und durch das im Deutschen nötige Verb „kommt“ verdeutlicht.
- source_word: νίκη
  choice: der Sieg
  rationale: „Sieg“ ist die direkte und kontextgerechte Entsprechung.
- source_word: σοφία
  choice: die Weisheit
  rationale: „Weisheit“ bewahrt den allgemeinen Sinn des griechischen Begriffs, ohne ihn auf Geschick oder Einsicht einzuengen.
- source_word: σὴ ἡ δόξα
  choice: dein ist die Herrlichkeit
  rationale: Die vorangestellte possessive Aussage ist im Griechischen betont. Die würdevolle deutsche Wendung bewahrt diese Hervorhebung.
- source_word: οἰκέτης
  choice: Diener
  rationale: Der Begriff bezeichnet einen Hausdiener und kann auch einen versklavten Angehörigen des Haushalts meinen. „Diener“ passt zur demütigen Bekenntnissprache; die stärkeren möglichen Bedeutungen werden in der Fußnote offengelegt.
theological_decisions:
- issue: Wiedergabe von οἰκέτης als Ausdruck der Unterordnung
  choice: Diener
  alternative: Hausdiener; Sklave
  rationale: Der Vers bekennt Zugehörigkeit und Unterordnung. „Diener“ wahrt den würdevollen Ton, ohne die lexikalisch mögliche stärkere soziale Bindung im Haupttext festzulegen; diese bleibt durch die Fußnote sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wiederholte Herkunftsformel und die betonte Besitzformel bleiben erhalten; das griechische Partizip wird für einen natürlichen deutschen Erzählanschluss finit wiedergegeben.
