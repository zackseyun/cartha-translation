base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/004/003.yaml
  text: And they ate and drank[a], and when they were filled they departed. But Darius the king went into his bedchamber and slept, and then awoke.
translation:
  language: de
  text: Und sie aßen und tranken, und als sie satt waren, gingen sie fort. König Darius aber ging in sein Schlafgemach, schlief und wachte wieder auf.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐφάγοσαν
  choice: sie aßen
  rationale: Der Aorist von ἐσθίω bezeichnet hier schlicht das Essen; die natürliche deutsche Erzählform gibt dies genau wieder.
- source_word: ἐπίοσαν
  choice: tranken
  rationale: Der Aorist von πίνω wird in der koordinierten Wendung idiomatisch ohne erneute Nennung des Subjekts wiedergegeben.
- source_word: ἐμπλησθέντες
  choice: als sie satt waren
  rationale: Das Partizip bezeichnet, dass sie nach dem Essen und Trinken gesättigt waren. »Satt« ist im modernen Deutsch natürlich und bewahrt den Bezug auf die Mahlzeit.
- source_word: ἀνέλυσαν
  choice: gingen sie fort
  rationale: Im Zusammenhang bezeichnet das Verb das Aufbrechen beziehungsweise Fortgehen nach der Mahlzeit; diese Wiedergabe ist klar und ungekünstelt.
- source_word: ὁ Δαρεῖος ὁ βασιλεύς
  choice: König Darius
  rationale: Die deutsche Titelfügung gibt Name und königliche Stellung natürlich und präzise wieder.
- source_word: κοιτών
  choice: Schlafgemach
  rationale: Das Wort bezeichnet einen inneren Schlafraum; »Schlafgemach« passt zum königlichen Umfeld, ohne unverständlich zu wirken.
- source_word: ἐκοιμήθη
  choice: schlief
  rationale: Der Aorist stellt schlicht fest, dass Darius schlief; eine stärker deutende Wiedergabe wie »schlief ein« ist nicht erforderlich.
- source_word: ἔξυπνος ἐγένετο
  choice: wachte wieder auf
  rationale: Die idiomatische Wendung bedeutet wörtlich, dass er wach wurde. »Wachte wieder auf« ist natürliches Deutsch und gibt den Übergang vom Schlaf zum Wachsein wieder.
theological_decisions: []
translation_notes:
  register: 'Moderne, würdige und gut verständliche Erzählsprache. Die wiederholte Verwendung von ἀναλύω wird kontextgemäß unterschieden: Die Gäste gehen fort, Darius begibt sich in sein Schlafgemach. Keine Fußnote ist nötig, da »als sie satt waren« die Bedeutung von ἐμπλησθέντες knapp und angemessen erfasst.'
