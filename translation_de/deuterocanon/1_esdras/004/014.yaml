  terminology: „Satrapen“ erhält den spezifischen persischen Titel. „Oberste Beamte“ gibt ὑπάτους im nicht-römischen Verwaltungskontext angemessen wieder, ohne die mögliche Bedeutung „Konsuln“ zu verschweigen. Die Fußnote zu τοπάρχας ist zutreffend.
