lexical_decisions:
- source_word: ἐξαποστείλας
  choice: er sandte Boten aus
  rationale: Das Aoristpartizip bedeutet wörtlich „nachdem er ausgesandt hatte“. Da das Objekt nicht genannt ist, macht „Boten“ die im Zusammenhang naheliegende Durchführung der Einberufung verständlich, ohne sie mit dem folgenden Verb gleichzusetzen.
- source_word: ἐκάλεσεν
  choice: ließ … zusammenrufen
  rationale: Im königlichen Verwaltungskontext bezeichnet das Verb eine offizielle Einberufung. Die deutsche Konstruktion verbindet sich natürlich mit dem vorausgehenden Aussenden von Boten.
- source_word: μεγιστᾶνας
  choice: Großen
  rationale: Gemeint sind hochrangige Würdenträger oder Magnaten. „Großen“ bewahrt den rangbezogenen Ausdruck des Griechischen und klingt in einer würdevollen historischen Erzählung natürlich.
- source_word: Περσίδος καὶ τῆς Μηδείας
  choice: Persiens und Mediens
  rationale: Standardmäßige Wiedergabe der beiden Gebietsbezeichnungen im Genitiv.
- source_word: σατράπας
  choice: Satrapen
  rationale: Der historisch spezifische persische Amtstitel sollte erhalten bleiben und ist im Deutschen hinreichend etabliert.
- source_word: στρατηγοὺς
  choice: Heerführer
  rationale: Gibt die militärische Leitungsfunktion klar und historisch passend wieder; „Generäle“ wäre verständlich, klänge jedoch moderner.
- source_word: τοπάρχας
  choice: Bezirksvorsteher
  rationale: Bezeichnet Amtsträger, die über örtliche Gebiete oder Bezirke gesetzt waren. Die Wiedergabe ist verständlicher als das fachsprachliche „Toparchen“.
- source_word: ὑπάτους
  choice: höchsten Beamten
  rationale: Das Wort kann „Konsuln“ oder allgemein höchstrangige Amtsträger bezeichnen. Im persischen Verwaltungsrahmen vermeidet diese Wiedergabe einen unpassenden spezifisch römischen Titel und bewahrt zugleich den Rangbegriff.
