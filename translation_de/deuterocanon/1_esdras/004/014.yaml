translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Verwaltungsämter werden teils historisch spezifisch („Satrapen“), teils transparent funktional wiedergegeben. Die Aufzählung nach dem Doppelpunkt bildet ab, dass die folgenden Amtsgruppen die zuvor genannten Großen näher bestimmen können, ohne diese syntaktische Beziehung dogmatisch festzulegen.
