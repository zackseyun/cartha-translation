  yaml_path: translation/deuterocanon/1_esdras/004/020.yaml
  text: And it makes all hearts rich[a], and it remembers neither king nor satrap; and it makes everything speak in terms of talents.
translation:
  language: de
  text: Und es macht alle Herzen reich und denkt weder an einen König noch an einen Satrapen; und es bringt alle dazu, in Geldsummen zu reden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „in Talenten“. Ein Talent war eine große Gewichts- und Geldeinheit. Gemeint ist, dass alle in Geldbeträgen reden, nicht von natürlichen Begabungen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάσας καρδίας
  choice: alle Herzen
  rationale: Die konkrete anthropologische Redeweise des Griechischen bleibt erhalten; „Herz“ bezeichnet hier den inneren Sitz von Empfinden, Begehren und Denken.
- source_word: ποιεῖ πλουσίας
  choice: macht … reich
  rationale: Die Konstruktion ποιέω mit Adjektiv wird direkt und natürlich wiedergegeben.
- source_word: οὐ μέμνηται
  choice: denkt … nicht an
  rationale: Dies bewahrt das Bild des Erinnerns beziehungsweise Im-Sinn-Habens, ohne es vorschnell zum deutenderen „nimmt keine Rücksicht auf“ aufzulösen.
- source_word: βασιλέα οὐδὲ σατράπην
  choice: weder an einen König noch an einen Satrapen
  rationale: „Satrap“ erhält die konkrete persische Amtsbezeichnung und damit das historische Kolorit.
- source_word: πάντα
  choice: alle
  rationale: Obwohl πάντα formal ein neutrales Plural ist, verlangt das Reden im Deutschen einen persönlichen Bezug. Das alleinstehende „alle“ gibt diesen kontextuellen Sinn wieder, ohne eine zusätzliche Personengruppe zu benennen.
- source_word: διὰ ταλάντων
  choice: in Talenten
  rationale: Die knappe, ungewöhnliche Ausdrucksweise bleibt sichtbar. „Talente“ bezeichnet hier Geldbeträge beziehungsweise Gewichtseinheiten, nicht natürliche Begabungen.
- source_word: ποιεῖ λαλεῖν
  choice: bringt … dazu, … zu reden
  rationale: Die deutsche Kausativform gibt den Sinn idiomatisch wieder; eine mechanische Wiederholung von „macht“ wäre an dieser Stelle unnatürlich.
theological_decisions:
- issue: Unausgesprochenes Subjekt der Verben
  choice: Das aus dem Zusammenhang übernommene feminine Bezugswort wird im Deutschen nur mit „es“ aufgenommen.
  alternative: „Der Wein“ ausdrücklich als Subjekt ergänzen.
  rationale: Das Griechische nennt das Subjekt in diesem Vers nicht erneut. Die pronominale Wiedergabe wahrt den Zusammenhang, ohne eine ausdrückliche Ergänzung in den Vers einzutragen.
- issue: Bezug von πάντα
  choice: Als Personenbezug „alle“ wiedergegeben.
  alternative: Formal-neutrales „alles“ beziehungsweise „alle Dinge“.
  rationale: Das folgende λαλεῖν („reden“) legt im Kontext redende Menschen nahe. „Alle“ wahrt zugleich mehr Offenheit als das explizitere „alle Menschen“.
translation_notes:
  register: Moderne, würdige Standardsprache. Der parallele Satzbau und das Bild der „reichen Herzen“ bleiben erhalten; die ungewöhnliche Rede von Talenten wird im Text nicht geglättet, sondern in der Fußnote erläutert.
