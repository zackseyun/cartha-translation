  source_fidelity: Der Entwurf gibt die drei parallelen Aussagen, das unausgesprochene feminine Subjekt, „König“ und den historisch bestimmten „Satrapen“ insgesamt treffend wieder. Bei διὰ ταλάντων bezeichnet die Präposition jedoch eher das Sprechen in bzw. nach Geldbeträgen als ein Gesprächsthema. „in Talenten reden“ ist zwar eng am Griechischen, im heutigen Deutsch aber zu missverständlich und unidiomatisch.
  naturalness: „Es bringt alle dazu, in Talenten zu reden“ wirkt im modernen Standarddeutsch künstlich und kann an natürliche Begabungen denken lassen. „in Geldsummen zu reden“ ist idiomatisch und gibt die beabsichtigte monetäre Ausdrucksweise wieder; die Fußnote dokumentiert dabei das zugrunde liegende Wort „Talente“.
  terminology: '„Herzen“, „reich“, „König“ und „Satrapen“ sind angemessen. Die Fußnote erläutert „Talent“ sachlich, sollte aber die Aussage nicht unnötig auf „große Geldsummen“ verengen: Ein Talent ist selbst eine große Rechnungs- bzw. Geldeinheit, doch die Wendung bedeutet allgemein Sprechen in Geldbeträgen.'
