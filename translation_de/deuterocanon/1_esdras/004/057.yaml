  yaml_path: translation/deuterocanon/1_esdras/004/057.yaml
  text: And he sent back all the vessels that Cyrus had set apart from Babylon; and everything that Cyrus had said to do[a], he himself also ordered to be done and sent to Jerusalem.
translation:
  language: de
  text: Und er sandte alle Geräte zurück[a], die Kyrus aus Babylon ausgesondert hatte. Auch er selbst befahl, alles, was Kyrus zu tun angeordnet hatte[b], auszuführen und nach Jerusalem zu senden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »hinaus« beziehungsweise »fort«. Das Verb bezeichnet an sich das Aussenden; der Zusammenhang mit den Tempelgeräten legt »zurück« nahe.'
    reason: Das Präfixverb ἐξαποστέλλω bedeutet nicht für sich allein zwingend „zurücksenden“; die Rückrichtung ergibt sich aus dem Kontext.
  - marker: b
    text: 'Wörtlich: »alles, was Kyrus zu tun gesagt hatte«. Die knappe griechische Formulierung kann eine allgemeine Anordnung bezeichnen.'
    reason: Die Wendung πάντα ὅσα εἶπεν Κῦρος ποιῆσαι enthält weder ausdrücklich ein Wollen noch ein Anfertigenlassen. Die Anmerkung wahrt die knappe Syntax und den allgemeinen Sinn von ποιῆσαι.
lexical_decisions:
- source_word: ἐξαπέστειλεν
  choice: sandte … zurück
  rationale: Das Verb bedeutet zunächst »hinaussenden/absenden«; im Zusammenhang mit den aus Babylon zurückgeführten Tempelgeräten bringt »zurücksenden« die gemeinte Richtung natürlich zum Ausdruck, ohne sie im griechischen Verb selbst vorauszusetzen.
- source_word: τὰ σκεύη
  choice: die Geräte
  rationale: σκεύη bezeichnet hier die für den Tempeldienst bestimmten Gegenstände. »Geräte« ist im Deutschen verständlicher und weiter als »Gefäße«, das den möglichen Umfang unnötig einschränken würde.
- source_word: ἃ ἐχώρισεν Κῦρος ἀπὸ Βαβυλῶνος
  choice: die Kyrus aus Babylon ausgesondert hatte
  rationale: χωρίζω bezeichnet ein Trennen oder Aussondern. Die Formulierung wahrt die bewusste Absonderung der Gegenstände und gibt ἀπό als Herkunftsangabe wieder.
- source_word: πάντα ὅσα εἶπεν Κῦρος ποιῆσαι
  choice: alles, was Kyrus hatte anfertigen lassen wollen
  rationale: Die knappe griechische Infinitivkonstruktion kann sich auf Dinge beziehen, die hergestellt werden sollten, oder allgemeiner auf das, was getan werden sollte. Da dasselbe »alles« anschließend nach Jerusalem gesandt wird, ist die gegenständliche Bedeutung »anfertigen« im Kontext wahrscheinlich; eine Fußnote bewahrt die weitere Möglichkeit.
- source_word: καὶ αὐτός
  choice: Auch er selbst
  rationale: Die Formulierung erhält sowohl das additive καί als auch die Betonung durch das ausdrücklich gesetzte Pronomen.
- source_word: ἐπέταξεν
  choice: befahl
  rationale: ἐπιτάσσω bezeichnet eine verbindliche Anordnung; »befahl« gibt deren Nachdruck prägnant wieder.
- source_word: ποιῆσαι καὶ ἐξαποστεῖλαι εἰς Ἰερουσαλήμ
  choice: anzufertigen und nach Jerusalem zu senden
  rationale: Die beiden koordinierten Infinitive werden parallel wiedergegeben. »Nach Jerusalem« ist die natürliche deutsche Richtungsangabe für εἰς Ἰερουσαλήμ.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzteilung verbessert die Verständlichkeit des langen griechischen Satzes. »Geräte« vermeidet das heute missverständliche oder zu enge »Gefäße«; die beiden Fußnoten erhalten die echten lexikalischen Spielräume des Ausgangstextes.
