    issue: „hatte anfertigen lassen wollen“ überträgt πάντα ὅσα εἶπεν Κῦρος ποιῆσαι nicht quellentreu.
    rationale: εἶπεν ποιῆσαι besagt, dass Kyrus etwas zu tun bzw. auszuführen sagte/anordnete. Weder ein Modalverb („wollen“) noch eine kausative Konstruktion („anfertigen lassen“) ist im griechischen Text ausgedrückt.
  - severity: medium
    issue: Die Fußnote b stützt eine zu enge und im Haupttext zusätzlich überdehnte Deutung von ποιεῖν.
    rationale: ποιεῖν kann in bestimmten Zusammenhängen „anfertigen“ heißen, doch die vorliegende Konstruktion bezeichnet ohne näheren Gegenstand allgemein das Tun/Ausführen dessen, was Kyrus angeordnet hatte. Die Fußnote soll diese offene, knappe Syntax erklären, nicht die Herstellung als Hauptsinn nahelegen.
  revised_text: Und er sandte alle Geräte zurück[a], die Kyrus aus Babylon ausgesondert hatte. Auch er selbst befahl, alles, was Kyrus zu tun angeordnet hatte[b], auszuführen und nach Jerusalem zu senden.
