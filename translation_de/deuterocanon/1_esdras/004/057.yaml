- from: Und er sandte alle Geräte zurück[a], die Kyrus aus Babylon ausgesondert hatte. Auch er selbst befahl, alles, was Kyrus hatte anfertigen lassen wollen[b], anzufertigen und nach Jerusalem zu senden.
  to: Und er sandte alle Geräte zurück[a], die Kyrus aus Babylon ausgesondert hatte. Auch er selbst befahl, alles, was Kyrus zu tun angeordnet hatte[b], auszuführen und nach Jerusalem zu senden.
  rationale: Die Revision entfernt die unbelegten Zusätze „wollen“ und „lassen“ und vermeidet die sachlich nicht erforderliche Einengung auf das Anfertigen von Gegenständen. Sie erhält die Betonung und Hinzufügung in „Auch er selbst“, die administrative Kraft von ἐπέταξεν sowie die im Kontext plausible Rücksendung der Geräte. Beide Fußnoten sind an den jeweiligen Stellen verankert und erläutern nur tatsächlich vorhandene lexikalische bzw. syntaktische Spielräume.
