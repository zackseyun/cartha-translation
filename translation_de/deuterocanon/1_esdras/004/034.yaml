base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/004/034.yaml
  text: Men[a], are not women strong? Great is the earth, and high is heaven, and swift in its course is the sun[b], because it turns in the circle of heaven and again runs back to its own place in one day.
translation:
  language: de
  text: Ihr Männer, sind Frauen nicht stark? Groß ist die Erde, hoch der Himmel, und schnell in ihrem Lauf ist die Sonne[a]; denn sie dreht sich im Kreis des Himmels und läuft an einem Tag wieder an ihren eigenen Ort zurück.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „schnell auf ihrer Bahn“. Das Griechische stellt den raschen Lauf der Sonne anschaulich dar.'
    reason: lexical_alternative
  - marker: b
    text: Der Vers spricht in gewöhnlicher Beobachtungssprache vom täglichen Lauf der Sonne über den Himmel.
    reason: cultural_note
lexical_decisions:
- source_word: Ἄνδρες
  choice: Ihr Männer
  rationale: Der Vokativ Plural wird als unmittelbare, ausdrücklich männliche Anrede bewahrt; „ihr“ macht den Vokativ im heutigen Deutschen klar und natürlich.
- source_word: ἰσχυραὶ
  choice: stark
  rationale: Das Adjektiv bezeichnet Stärke oder Macht. „Stark“ ist im Deutschen die direkteste und im argumentativen Zusammenhang natürlichste Entsprechung.
- source_word: γυναῖκες
  choice: Frauen
  rationale: Der allgemeine Sinn ist „Frauen“; der Kontext bietet keinen Grund für die engere Wiedergabe „Ehefrauen“.
- source_word: μεγάλη ἡ γῆ
  choice: Groß ist die Erde
  rationale: Die vorangestellte prädikative Formulierung bewahrt den feierlich-rhetorischen Parallelismus des Griechischen.
- source_word: ὑψηλὸς ὁ οὐρανός
  choice: hoch der Himmel
  rationale: „Hoch“ gibt ὑψηλός schlicht wieder; die artikellose deutsche Prädikatskonstruktion erhält den knappen Parallelismus.
- source_word: ταχὺς τῷ δρόμῳ
  choice: schnell in ihrem Lauf
  rationale: Die Dativwendung beschreibt die rasche Bewegung der Sonne auf ihrer Bahn. „Lauf“ bewahrt das anschauliche Bewegungsbild, ohne es technisch zu deuten.
- source_word: στρέφεται ἐν τῷ κύκλῳ τοῦ οὐρανοῦ
  choice: sie dreht sich im Kreis des Himmels
  rationale: Die Wiedergabe folgt der gewöhnlichen Anschauungssprache des Textes und legt keine präzisere astronomische Theorie fest.
- source_word: πάλιν ἀποτρέχει
  choice: läuft … wieder … zurück
  rationale: Das zusammengesetzte Verb enthält sowohl die lebhafte Vorstellung des Laufens als auch die Rückbewegung; beides bleibt erhalten.
- source_word: εἰς τὸν ἑαυτοῦ τόπον
  choice: an ihren eigenen Ort
  rationale: „Ort“ ist die breite, formnahe Entsprechung und vermeidet die technischere Festlegung auf „Position“ oder „Standort“.
- source_word: ἐν μιᾷ ἡμέρᾳ
  choice: an einem einzigen Tag
  rationale: „Einzigen“ lässt die Betonung der Zahl μιᾷ hörbar werden und passt zum rhetorischen Staunen über die Schnelligkeit.
theological_decisions:
- issue: Kosmologische Beschreibung der täglichen Sonnenbewegung
  choice: Die beobachtungsnahe Rede von Drehen und Zurücklaufen wird beibehalten.
  alternative: Die Aussage als bloß scheinbare Bewegung in moderner astronomischer Sprache umformulieren.
  rationale: Der griechische Text beschreibt den sichtbaren täglichen Lauf der Sonne in gewöhnlicher Anschauungssprache. Die Übersetzung bewahrt diese Bildwelt, ohne sie wissenschaftlich zu korrigieren oder zu einem Lehrsatz über ein bestimmtes Weltmodell auszubauen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst beibehaltenem rhetorischem Parallelismus. Die Formulierung „Ihr Männer“ ist als direkte Anrede klar; die kosmologische Bildsprache bleibt anschaulich und wird nicht modernisiert.
