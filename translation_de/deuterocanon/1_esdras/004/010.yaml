  text: 'Einer schrieb: »Der Wein ist stärker.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Der Wein behält die Oberhand.« Das griechische Verb kann bedeuten, stärker beziehungsweise überlegen zu sein oder sich durchzusetzen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ εἷς
  choice: Der eine
  rationale: Die Wendung bezeichnet hier einen der Teilnehmer. »Der eine« gibt den bestimmten griechischen Ausdruck knapp und im Zusammenhang natürlich wieder.
- source_word: ἔγραψεν
  choice: schrieb
  rationale: Der Aorist von γράφω bezeichnet schlicht die abgeschlossene Handlung des Schreibens; das deutsche Präteritum passt zur Erzählfolge.
- source_word: Ὑπερισχύει
  choice: ist stärker
  rationale: Das Verb kann Überlegenheit an Stärke oder das Obsiegen ausdrücken. Im Kontext der Frage nach dem Stärksten ist »ist stärker« unmittelbar verständlich, ohne die mögliche Bedeutung »behält die Oberhand« zu verschweigen.
- source_word: ὁ οἶνος
  choice: der Wein
  rationale: Der Artikel steht im Griechischen; im Deutschen ist »der Wein« auch als allgemeine Gattungsbezeichnung idiomatisch.
