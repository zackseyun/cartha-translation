  text: And he took the letters and went out to Babylon[a], and reported to all his brothers.
translation:
  language: de
  text: Und er nahm die Briefe, brach nach Babylon auf und berichtete allen seinen Brüdern[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit „Brüdern“ können hier auch seine Verwandten oder Volksgenossen gemeint sein.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλαβεν
  choice: nahm
  rationale: Der Aorist von λαμβάνω bezeichnet hier in der fortlaufenden Erzählung das An-sich-Nehmen beziehungsweise Entgegennehmen der Briefe; „nahm“ bleibt knapp und quellennah.
- source_word: τὰς ἐπιστολάς
  choice: die Briefe
  rationale: ἐπιστολή bezeichnet gewöhnlich einen Brief oder ein schriftliches Mitteilungsschreiben. Der bestimmte Plural wird direkt wiedergegeben.
- source_word: ἐξῆλθεν εἰς Βαβυλῶνα
  choice: zog nach Babylon
  rationale: ἐξέρχομαι bezeichnet das Hinausgehen oder Aufbrechen. „zog nach Babylon“ gibt sowohl die Bewegung als auch das Ziel in natürlichem, würdigem Deutsch wieder, ohne das griechische Verb auf ein bloßes „war dort“ abzuschwächen.
- source_word: ἀπήγγειλεν
  choice: berichtete … davon
  rationale: ἀπαγγέλλω bedeutet „berichten, melden, verkünden“. Das im Griechischen unausgesprochene Berichtete wird im Deutschen durch das anaphorische „davon“ natürlich aufgenommen, ohne seinen Inhalt näher festzulegen.
- source_word: τοῖς ἀδελφοῖς αὐτοῦ πᾶσιν
  choice: allen seinen Brüdern
  rationale: Die maskuline Pluralform ἀδελφοῖς wird formal als „Brüdern“ wiedergegeben; πᾶσιν steht im Deutschen idiomatisch vor der Wortgruppe als „allen“.
theological_decisions:
- issue: Gemeinschaftliche oder verwandtschaftliche Bedeutung von ἀδελφοῖς
  choice: Brüdern
  alternative: Verwandten; Volksgenossen
  rationale: Der Haupttext bewahrt die konkrete griechische Bezeichnung und legt nicht fest, ob leibliche Brüder, weitere Verwandte oder Angehörige seines Volkes gemeint sind. Die mögliche weitere Bedeutung wird in der Fußnote offengehalten.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. „Zog nach Babylon“ wahrt die Bewegungsnuance von ἐξῆλθεν; die Satzstruktur bleibt eng am griechischen Erzählfluss. Das ergänzte „davon“ dient nur der deutschen Idiomatik und bestimmt den im Griechischen unausgesprochenen Gegenstand des Berichts nicht näher.
