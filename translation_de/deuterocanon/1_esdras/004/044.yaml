  text: and all the vessels taken from Jerusalem are to be sent back[a], which Cyrus set apart when he vowed to destroy Babylon[b], and vowed to send there.
translation:
  language: de
  text: und alle Geräte, die aus Jerusalem weggenommen worden waren und die Kyrus ausgesondert hatte, zurückzuschicken, als er gelobte, Babylon zu vernichten[b], und gelobte, sie dorthin zu senden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'Wörtlich kann es auch heißen: „Babylon abzuhauen“ oder „auszurotten“. Der griechische Satz ist gedrängt und durch die zweimalige Formulierung „gelobte“ ungewöhnlich. „Dorthin“ bezeichnet wahrscheinlich Jerusalem, wird im Griechischen aber nicht ausdrücklich erklärt.'
    reason: alternative_reading
lexical_decisions:
- source_word: σκεύη
  choice: Geräte
  rationale: Im Tempelkontext bezeichnet σκεύη Gefäße und sonstige kultische Gerätschaften. „Geräte“ ist im Deutschen umfassend genug und vermeidet die Verengung auf bloße Gefäße.
- source_word: τὰ λημφθέντα ἐξ Ἰερουσαλήμ
  choice: die aus Jerusalem weggenommen worden waren
  rationale: Das substantivierte Partizip bezeichnet die zuvor aus Jerusalem fortgenommenen Gegenstände; das Plusquamperfekt macht diese Vorzeitigkeit verständlich.
- source_word: ἐκπέμψαι
  choice: zurückzuschicken
  rationale: Wörtlich bedeutet das Verb „hinaussenden“. Der Zusammenhang ist die Rückführung der Tempelgeräte nach Jerusalem; „zurückzuschicken“ gibt diese Richtung natürlich wieder.
- source_word: ἐχώρισεν
  choice: ausgesondert hatte
  rationale: Das Verb bedeutet „trennen, absondern“. „Ausgesondert“ bewahrt den konkreten Sinn und kann zugleich eine Bestimmung für einen besonderen Zweck ausdrücken.
- source_word: ηὔξατο
  choice: gelobte
  rationale: ηὔξατο kann ein Gebet oder Gelübde bezeichnen. Mit den folgenden Infinitiven liegt hier eine feierliche Selbstverpflichtung nahe; die ungewöhnliche Wiederholung wird beibehalten.
- source_word: ἐκκόψαι Βαβυλῶνα
  choice: Babylon zu vernichten
  rationale: ἐκκόπτω heißt wörtlich „abhauen, ausrotten“. Bei einer Stadt gibt „vernichten“ die zerstörerische Bedeutung im natürlichen Deutschen wieder.
- source_word: ἐξαποστεῖλαι ἐκεῖ
  choice: sie dorthin zu senden
  rationale: Das im Griechischen unausgesprochene Objekt wird im Deutschen durch „sie“ aufgenommen. „Dorthin“ bewahrt den knappen und nicht ausdrücklich aufgelösten Ortsverweis.
theological_decisions:
- issue: Mehrdeutigkeit und gedrängte Syntax der Aussagen über das Gelübde des Kyrus
  choice: Die zweimalige Gelübdeformulierung wird bewahrt, während die Satzbezüge durch Gedankenstrich und Pronomen lesbar gemacht werden.
  alternative: ηὔξατο mit „beschloss“ wiedergeben und die Aussagen zu einer glatten historischen Paraphrase verbinden.
  rationale: Die Schwierigkeit ist textlich und lexikalisch, nicht dogmatisch. „Gelobte“ wahrt die mögliche kultisch-feierliche Färbung, ohne die historische Spannung stillschweigend aufzulösen.
- issue: Bezug von ἐκεῖ („dorthin“)
  choice: Der Ortsverweis bleibt als „dorthin“ stehen.
  alternative: Explizit „nach Jerusalem“ schreiben.
  rationale: Jerusalem ist im Zusammenhang wahrscheinlich gemeint, doch das griechische Pronomen benennt den Ort nicht erneut. Die Übersetzung erhält diese knappe Ausdrucksweise.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Geräte“ passt zum Tempelkontext, ohne nur Gefäße anzunehmen. Die leichte Sperrigkeit der wiederholten Gelübdeformel bleibt als Merkmal des griechischen Ausgangstextes erkennbar.
