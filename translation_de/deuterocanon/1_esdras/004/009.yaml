- from: 'Und sie sagten: »Wenn der König aufsteht, soll man ihm das Schriftstück geben. Und wem nach dem Urteil des Königs und der drei höchsten Würdenträger Persiens die weiseste Darlegung gelungen ist, dem soll der Sieg zugesprochen werden[a], wie es geschrieben steht.«'
  to: 'Und sie sagten: »Wenn der König aufsteht, werden sie ihm das Schriftstück geben. Und wen der König und die drei höchsten Würdenträger Persiens dafür halten, dass seine Darlegung weiser ist, dem wird der Sieg gegeben werden, wie es geschrieben steht.«'
