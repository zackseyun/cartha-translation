base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/004/009.yaml
  text: And they said[a], “When the king rises, they will give him the writing; and whoever the king and the three nobles of Persia judge that his argument is wiser, to him the victory will be given[b], as it is written.”
translation:
  language: de
  text: 'Und sie sagten: »Wenn der König aufsteht, werden sie ihm das Schriftstück geben. Und wen der König und die drei höchsten Würdenträger Persiens dafür halten, dass seine Darlegung weiser ist, dem wird der Sieg gegeben werden, wie es geschrieben steht.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγερθῇ
  choice: aufsteht
  rationale: Das Verb bezeichnet hier wahrscheinlich das Aufstehen des Königs, ohne ausdrücklich festzulegen, ob er aus dem Schlaf erwacht oder sich von seinem Platz erhebt.
- source_word: τὸ γράμμα
  choice: das Schriftstück
  rationale: Im Zusammenhang ist ein zur königlichen Prüfung bestimmtes schriftliches Dokument gemeint. »Schriftstück« ist natürlich und legt sich nicht unnötig auf einen Brief fest.
- source_word: κρίνῃ
  choice: nach dem Urteil
  rationale: Die Wendung gibt den Vorgang des Prüfens und Entscheidens wieder und fügt sich idiomatisch in den deutschen Satzbau.
- source_word: μεγιστᾶνες
  choice: höchsten Würdenträger
  rationale: Der Ausdruck bezeichnet hochrangige persische Große oder Amtsträger; »höchste Würdenträger« vermittelt Rang und öffentliche Stellung in verständlichem Deutsch.
- source_word: ὁ λόγος αὐτοῦ σοφώτερος
  choice: die weiseste Darlegung
  rationale: λόγος bezeichnet im Wettbewerb die vorgetragene Aussage, Begründung oder Rede. »Darlegung« bewahrt diese Bedeutungsbreite besser als das möglicherweise streitbetonte »Argument«; der Superlativ ist im Vergleich der drei Beiträge im Deutschen idiomatisch.
- source_word: τὸ νῖκος
  choice: der Sieg
  rationale: νῖκος bezeichnet den Sieg im Wettbewerb; »Sieg« ist die direkte und klare Entsprechung.
- source_word: καθὼς γέγραπται
  choice: wie es geschrieben steht
  rationale: Die Perfektform verweist auf eine bestehende schriftliche Festlegung; die deutsche Formel gibt dies präzise wieder.
