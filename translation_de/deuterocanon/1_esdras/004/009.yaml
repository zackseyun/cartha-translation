translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der schwerfällige griechische Relativsatz wurde idiomatisch geordnet, ohne den Kreis der Urteilenden, den Vergleich der Beiträge oder die Zuerkennung des Sieges zu verändern.
