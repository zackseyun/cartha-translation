base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/004/016.yaml
  text: 'And they said to them[a], “Report to us about what has been written.” And the first, the one who had spoken about the strength of wine, began and said thus:'
translation:
  language: de
  text: 'Und sie sagten zu ihnen: »Berichtet uns über das, was geschrieben worden ist.« Da begann der Erste, der über die Kraft[a] des Weines gesprochen hatte, und sagte Folgendes:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Stärke« oder »Macht«. Das griechische Wort kann Kraft, Stärke oder Macht bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπαγγείλατέ
  choice: Berichtet
  rationale: Der pluralische Imperativ von ἀπαγγέλλω bezeichnet ein Berichten oder Verkünden. »Berichtet« passt zum förmlichen, öffentlichen Rahmen und ist präziser als das umgangssprachlichere »Erzählt«.
- source_word: περὶ τῶν γεγραμμένων
  choice: über das, was geschrieben worden ist
  rationale: Die Formulierung bewahrt die Präposition περὶ und den perfektisch-passiven Ergebnissinn von γεγραμμένων, ohne ausdrücklich festzulegen, wer das Geschriebene verfasst hat.
- source_word: ἤρξατο
  choice: begann
  rationale: Natürliche und genaue Wiedergabe des inchoativen Erzählverbs.
- source_word: ὁ πρῶτος ὁ εἴπας
  choice: der Erste, der … gesprochen hatte
  rationale: »Der Erste« gibt das substantivierte Ordinalzahlwort wieder; der Relativsatz wahrt den rückbezüglichen Charakter des Aoristpartizips und klingt im Deutschen natürlich.
- source_word: περὶ τῆς ἰσχύος τοῦ οἴνου
  choice: über die Kraft des Weines
  rationale: ἰσχύς kann Kraft, Stärke oder Macht bezeichnen. »Kraft« passt zur vergleichenden Frage nach der Wirkmacht des Weines und bleibt im Deutschen natürlich, während die Bedeutungsbreite in einer Fußnote sichtbar bleibt.
- source_word: καὶ ἔφη οὕτως
  choice: und sagte Folgendes
  rationale: Die deutsche Einleitungsformel »sagte Folgendes« gibt οὕτως vor einer anschließenden Rede idiomatisch und würdevoll wieder.
