  yaml_path: translation/deuterocanon/1_esdras/004/008.yaml
  text: And then[a], after each had written his own statement, they sealed them and placed them under the pillow of Darius the king,
translation:
  language: de
  text: Dann, nachdem jeder seine eigene Aussage aufgeschrieben hatte, versiegelten sie die Schriftstücke und legten sie unter das Kopfkissen[a] des Königs Darius.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „unter die Kopfstütze des Königs Darius“. Das griechische Wort προσκεφάλαιον kann ein Kopfkissen oder eine Kopfstütze bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Dann
  rationale: Das temporale Adverb führt den nächsten Schritt der Erzählung ein; „Dann“ ist natürlich und bewahrt die zeitliche Abfolge.
- source_word: γράψαντες
  choice: nachdem ... aufgeschrieben hatte
  rationale: Das Aoristpartizip bezeichnet hier eine Handlung, die den beiden Hauptverben vorausgeht. Die finite deutsche Konstruktion gibt diese Abfolge klar wieder.
- source_word: ἕκαστος
  choice: jeder
  rationale: Die distributive Bedeutung wird knapp und idiomatisch wiedergegeben.
- source_word: τὸν ἑαυτοῦ λόγον
  choice: seine eigene Aussage
  rationale: λόγος bezeichnet in diesem Zusammenhang den schriftlich eingereichten Satz beziehungsweise Beitrag jedes Teilnehmers. „Aussage“ bleibt neutraler als „Argument“ und meint nicht bloß ein einzelnes Wort.
- source_word: ἐσφραγίσαντο
  choice: versiegelten sie die Schriftstücke
  rationale: Das im Deutschen nötige Objekt wird aus dem Zusammenhang ergänzt. „Die Schriftstücke“ macht deutlich, dass die zuvor niedergeschriebenen Aussagen versiegelt wurden, ohne dem Inhalt etwas hinzuzufügen.
- source_word: ἔθηκαν
  choice: legten sie
  rationale: Das schlichte Erzählverb wird im räumlichen Zusammenhang mit „unter“ natürlich durch „legen“ wiedergegeben.
- source_word: ὑπὸ τὸ προσκεφάλαιον
  choice: unter das Kopfkissen
  rationale: προσκεφάλαιον bezeichnet eine Unterlage am oder für den Kopf. „Kopfkissen“ ist im heutigen Deutsch die natürlichste Wiedergabe; die mögliche Bedeutung „Kopfstütze“ bleibt in einer Fußnote erhalten.
- source_word: Δαρείου τοῦ βασιλέως
  choice: des Königs Darius
  rationale: Der Genitiv hängt von „Kopfkissen“ ab. Die Formulierung ist im Deutschen eindeutig und bewahrt sowohl Titel als auch Namen.
