lexical_decisions:
- source_word: ὁ ἕτερος
  choice: Der andere
  rationale: Der substantivierte Ausdruck bezeichnet im gegebenen Zusammenhang den anderen beziehungsweise nächsten Teilnehmer. „Der andere“ wahrt den Kontrast, ohne die Reihenfolge ausdrücklicher festzulegen als der griechische Wortlaut.
- source_word: ἔγραψεν
  choice: schrieb
  rationale: Der Aorist von γράφω bezeichnet hier schlicht die abgeschlossene Handlung innerhalb der Erzählfolge. Das deutsche Präteritum ist dafür natürlich und präzise.
- source_word: Ὑπερισχύει
  choice: ist stärker
  rationale: ὑπερισχύω kann „stärker sein“, „die Oberhand haben“ oder „sich durchsetzen“ bedeuten. In der knappen vergleichenden Behauptung des Wettstreits gibt „ist stärker“ die Grundbedeutung unmittelbar und idiomatisch wieder.
- source_word: ὁ βασιλεύς
  choice: der König
  rationale: βασιλεύς bezeichnet hier eindeutig einen König; der bestimmte Artikel wird im Deutschen natürlich beibehalten.
