  text: And he wrote that support should be given to the Levites until the day when the house is completed and Jerusalem is built[a][b].
translation:
  language: de
  text: Und er schrieb, dass den Leviten Unterhalt gewährt werden sollte, bis zu dem Tag, an dem das Haus[a] vollendet und Jerusalem gebaut wird[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »der Tempel«. Wörtlich steht im Griechischen »das Haus«, eine in diesem Zusammenhang übliche Bezeichnung für den Tempel.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »wiederaufgebaut«. Der Zusammenhang handelt von der Wiederherstellung; das griechische Verb selbst bedeutet jedoch einfach »gebaut werden«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔγραψεν
  choice: er schrieb, dass
  rationale: Gibt die schriftliche Anordnung wieder, ohne das einfache Verb durch »befahl« zu verstärken.
- source_word: δοῦναι
  choice: gewährt werden sollte
  rationale: Der Infinitiv bezeichnet den Inhalt der schriftlichen Anordnung; die passive Form entspricht dem griechischen Sinn und klingt im Deutschen natürlich.
- source_word: τὴν χορηγίαν
  choice: Unterhalt
  rationale: χορηγία bezeichnet die materielle Versorgung beziehungsweise Unterstützung; »Unterhalt« passt besonders zu einer fortlaufenden Versorgung der Leviten, ohne deren konkrete Form festzulegen.
- source_word: τοῖς Λευείταις
  choice: den Leviten
  rationale: Der Dativ bezeichnet die Empfänger der gewährten Versorgung.
- source_word: ἕως τῆς ἡμέρας ἧς
  choice: bis zu dem Tag, an dem
  rationale: Bewahrt die ausdrückliche zeitliche Begrenzung und die Struktur des griechischen Relativsatzes.
- source_word: ἐπιτελεσθῇ
  choice: vollendet
  rationale: Das passive Verb bezeichnet das Zu-Ende-Bringen des Hauses; »vollendet« ist präzise und würdevoll.
- source_word: ὁ οἶκος
  choice: das Haus
  rationale: Bewahrt die wörtliche Bezeichnung; im Zusammenhang ist damit der Tempel gemeint.
- source_word: Ἰερουσαλὴμ οἰκοδομηθῆναι
  choice: Jerusalem gebaut sein würde
  rationale: Gibt das einfache griechische Verb »gebaut werden« wieder und vermeidet, den aus dem Wiederherstellungskontext erschlossenen Gedanken des Wiederaufbaus ungekennzeichnet in den Haupttext einzutragen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die etwas feierliche Wendung »bis zu dem Tag« spiegelt die griechische Zeitangabe; »Unterhalt« bleibt hinsichtlich der konkreten Art der Versorgung bewusst offen. Beide Fußnotenmarker stehen unmittelbar bei den jeweils erklärten Ausdrücken.
