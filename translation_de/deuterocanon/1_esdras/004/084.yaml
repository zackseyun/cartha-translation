  text: and they blessed the God of their fathers[a], because he had given them relief and release.
translation:
  language: de
  text: Und sie priesen den Gott ihrer Väter, weil er ihnen Erleichterung und Befreiung gegeben hatte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ruhe und Freilassung.“ Die griechischen Begriffe können Entlastung von Bedrängnis und Freilassung oder Freiheit bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλόγησαν
  choice: priesen
  rationale: Wenn Gott das Objekt ist, bezeichnet das Verb im biblischen Sprachgebrauch das rühmende Segnen Gottes. „Priesen“ ist im heutigen Deutschen natürlich und würdig; „segneten“ wäre formnäher, wirkt hier aber missverständlich.
- source_word: τὸν θεὸν τῶν πατέρων αὐτῶν
  choice: den Gott ihrer Väter
  rationale: Die traditionelle biblische Wendung bewahrt den Bezug auf Israels Vorfahren und seine Bundesgeschichte, ohne sie paraphrasierend aufzulösen.
- source_word: ἔδωκεν
  choice: geschenkt hatte
  rationale: „Geschenkt“ gibt das gewährende Geben idiomatisch wieder. Das Plusquamperfekt verdeutlicht, dass ihr Lob auf die bereits erfahrene Wohltat antwortet, ohne den griechischen Aorist theologisch zu überdeuten.
- source_word: ἄνεσιν
  choice: Erleichterung
  rationale: Das Wort bezeichnet das Nachlassen von Druck oder Bedrängnis. „Erleichterung“ bildet diesen dynamischen Sinn im modernen Deutschen klar ab.
- source_word: ἄφεσιν
  choice: Befreiung
  rationale: Im Zusammenhang geschichtlicher Entlastung bezeichnet das Wort am ehesten Freilassung oder Freiheit, nicht ausdrücklich Sündenvergebung. „Befreiung“ wahrt diesen historischen Sinn.
theological_decisions:
- issue: Bedeutung von ἄφεσιν in einem nichtkultischen geschichtlichen Zusammenhang
  choice: Befreiung
  alternative: Freilassung; Freiheit; Erlass; Vergebung
  rationale: Obwohl ἄφεσις auch Vergebung oder Erlass bezeichnen kann, spricht der unmittelbare Zusammenhang von erfahrener Entlastung und Freiheit. „Befreiung“ vermeidet eine nicht ausdrücklich angezeigte soteriologische Engführung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter biblischer Wendung „Gott ihrer Väter“. „Priesen“ vermeidet die im heutigen Deutsch mögliche Fehlauffassung, Menschen verliehen Gott einen Segen. Die Wortpaarung „Erleichterung und Befreiung“ erhält die zwei unterschiedlichen, einander ergänzenden Begriffe des Griechischen.
