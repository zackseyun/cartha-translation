  yaml_path: translation/deuterocanon/1_esdras/004/078.yaml
  text: And to all who guarded the city[b][a], he wrote to give them allotments and wages.
translation:
  language: de
  text: Und er schrieb, man solle allen, die die Stadt bewachten, Zuteilungen[a] und Sold[b] geben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Lose“ oder „Anteile“. Das griechische Wort kann zugewiesene, möglicherweise durch das Los bestimmte Anteile bezeichnen.
    reason: lexical_alternative
  - marker: b
    text: Oder „Bezahlung“ beziehungsweise „Verpflegung“. Das griechische Wort kann sowohl den Unterhalt als auch die Vergütung für einen Dienst bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: φρουροῦσι (φρουρέω)
  choice: die … bewachten
  rationale: Das Partizip bezeichnet das Bewachen beziehungsweise Schützen der Stadt. Die Vergangenheitsform fügt sich natürlich in den Erzählzusammenhang ein.
- source_word: πόλιν (πόλις)
  choice: die Stadt
  rationale: Die gewöhnliche und kontextgemäße Bedeutung ist „Stadt“.
- source_word: ἔγραψε δοῦναι
  choice: er schrieb, man solle … geben
  rationale: Die Konstruktion gibt den Inhalt einer schriftlichen Anweisung wieder. Diese Fassung bewahrt „schrieb“, während der deutsche Konjunktiv den anweisenden Sinn des Infinitivs natürlich ausdrückt.
- source_word: κλήρους (κλῆρος)
  choice: Zuteilungen
  rationale: κλῆρος kann ein Los, einen zugelosten Anteil oder allgemeiner einen zugewiesenen Anteil bezeichnen. „Zuteilungen“ lässt den Gegenstand offen und passt zur Verbindung mit der Vergütung.
- source_word: ὀψώνια (ὀψώνιον)
  choice: Sold
  rationale: Das Wort bezeichnet Unterhalt, Verpflegung oder Bezahlung für einen Dienst, häufig im militärischen Bereich. Bei den Stadtwächtern ist „Sold“ eine natürliche Wiedergabe, ohne die mögliche Bedeutung „Verpflegung“ zu verschweigen.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die Formulierung „man solle“ macht den Inhalt der schriftlichen Anweisung idiomatisch deutlich, ohne ἔγραψε zu einer ausdrücklich königlichen Verordnung auszubauen. Die lexikalische Offenheit von κλήρους und ὀψώνια wird durch Fußnoten bewahrt.
