  text: And besides this[a], the king stared at her with his mouth open; and if she laughs at him, he laughs; but if she is offended with him[b], he flatters her so that she may be reconciled to him.
translation:
  language: de
  text: Und außerdem starrte der König sie mit offenem Mund an. Wenn sie ihn anlacht,[a] lacht er; wenn sie aber gegen ihn aufgebracht ist, schmeichelt er ihr, damit sie sich mit ihm versöhnt.
