lexical_decisions:
- source_word: πρὸς τούτοις
  choice: Und außerdem
  rationale: Gibt die additive Fortführung des Arguments natürlich und knapp wieder.
- source_word: χάσκων τὸ στόμα ἐθεώρει αὐτήν
  choice: betrachtete der König sie mit offenem Mund
  rationale: Bewahrt das anschauliche Bild des offenen Mundes und den anhaltenden, gebannten Blick, ohne die Aussage durch ein stärker wertendes Verb zu überzeichnen.
- source_word: ἐὰν γελάσῃ αὐτῷ, γελᾷ
  choice: Wenn sie ihn anlacht, lacht er
  rationale: „Anlachen“ gibt den Dativ αὐτῷ im Kontext als ihr ihm zugewandtes Lachen idiomatisch wieder; die Wiederholung von γελάω bleibt als „lacht“ erhalten.
- source_word: πικρανθῇ ἐπʼ αὐτόν
  choice: gegen ihn aufgebracht ist
  rationale: Drückt die feindselige oder verärgerte Haltung im relationalen Zusammenhang verständlich aus, ohne sie auf bloße Kränkung einzuengen.
- source_word: κολακεύει αὐτὴν
  choice: schmeichelt er ihr
  rationale: Entspricht der üblichen Bedeutung von κολακεύω und bewahrt den kritischen Unterton.
- source_word: ὅπως διαλλαγῇ αὐτῷ
  choice: damit sie sich wieder mit ihm versöhnt
  rationale: Gibt den Zwecksatz und die Wiederherstellung der gestörten Beziehung wieder; „wieder“ ist im deutschen Verbzusammenhang idiomatisch impliziert.
