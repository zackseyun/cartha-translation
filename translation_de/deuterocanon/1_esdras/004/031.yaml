translation_notes:
  register: Moderne, würdige Standardsprache mit anschaulicher Wiedergabe des griechischen Bildes. Die Satzstruktur bleibt eng am Ausgangstext; „anlacht“ vermeidet die im Deutschen naheliegende, aber kontextuell wohl irreführende Deutung „auslacht“.
