translation:
  language: de
  text: Da sahen der König und die Großen[a] einander an, und er begann, über die Wahrheit zu sprechen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Würdenträger“ oder „die Mächtigen“. Das griechische Wort bezeichnet hochrangige Männer am Hof.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μεγιστᾶνες
  choice: die Großen
  rationale: Die Bezeichnung meint hochrangige Männer am Hof. „Die Großen“ bewahrt die statusbezogene, nicht näher spezifizierte Ausdrucksweise des Griechischen; die Fußnote nennt geläufigere mögliche Wiedergaben.
- source_word: ἔβλεπον
  choice: sahen … an
  rationale: Das Imperfekt bezeichnet hier die begleitende Handlung. Zusammen mit dem reziproken Ausdruck ergibt „einander ansehen“ eine natürliche deutsche Wiedergabe, ohne die Verlaufsform unnötig auszubauen.
- source_word: εἷς τὸν ἕτερον
  choice: einander
  rationale: Der griechische Ausdruck ist reziprok und wird im Deutschen idiomatisch mit „einander“ wiedergegeben.
- source_word: ἤρξατο λαλεῖν
  choice: begann, … zu sprechen
  rationale: Dies gibt die einsetzende Handlung direkt und in natürlichem Deutsch wieder.
- source_word: περὶ τῆς ἀληθείας
  choice: über die Wahrheit
  rationale: Der bestimmte Artikel wird bewahrt; im Kontext ist die Wahrheit das nun behandelte Thema.
