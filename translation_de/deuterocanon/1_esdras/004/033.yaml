  source_fidelity: 'Der deutsche Text gibt alle Elemente des griechischen Satzes zutreffend wieder: καὶ τότε ist mit „Da“ idiomatisch erfasst; ὁ βασιλεὺς καὶ οἱ μεγιστᾶνες mit „der König und die Großen“; der reziproke Ausdruck εἷς τὸν ἕτερον mit „einander an“; und ἤρξατο λαλεῖν περὶ τῆς ἀληθείας mit „er begann, über die Wahrheit zu sprechen“. Die Singularreferenz von „er“ entspricht dem griechischen Singular, dessen genauer Bezug sich aus dem weiteren Kontext ergibt.'
