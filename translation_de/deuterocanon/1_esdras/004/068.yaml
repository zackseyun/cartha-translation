base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/004/068.yaml
  text: 'And now this is what I ask, O lord king, and what I request from you, and this is the greatness that comes from you: therefore I beg that you do the vow which I vowed to the King of heaven that it should be done by your mouth.'
translation:
  language: de
  text: Und nun, Herr König, dies ist es, worum ich bitte und was ich von dir erbitte; und dies ist die Größe, die von dir kommt. Darum flehe ich dich an, das Gelübde[a] zu erfüllen, das ich dem König des Himmels abgelegt habe, indem du es durch dein Wort ausführst.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Gebet, das ich zum König des Himmels gesprochen habe“. Das griechische Wort kann sowohl „Gelübde“ als auch „Gebet“ bedeuten; die stammverwandte Formulierung spricht hier eher für ein Gelübde.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „aus deinem Mund“. Gemeint sein kann die Ausführung durch den ausgesprochenen Befehl oder die Ermächtigung des Königs. Die genaue Verbindung des griechischen Infinitivs ist nicht eindeutig.'
    reason: textual_or_syntactic_ambiguity
lexical_decisions:
- source_word: ἀξιῶ … αἰτοῦμαί
  choice: worum ich bitte und was ich von dir erbitte
  rationale: Die beiden Verben werden als rhetorische Doppelung bewahrt. „Erbitten“ gibt dem zweiten Ausdruck einen etwas förmlicheren, dem höfischen Bittton entsprechenden Klang.
- source_word: κύριε βασιλεῦ
  choice: mein Herr und König
  rationale: Eine natürliche, ehrerbietige deutsche Anrede, die beide griechischen Titel wiedergibt.
- source_word: ἡ μεγαλωσύνη ἡ παρὰ σοῦ
  choice: die Größe, die von dir ausgeht
  rationale: Bewahrt sowohl μεγαλωσύνη als „Größe“ als auch die Herkunftsangabe παρὰ σοῦ, ohne sie enger als „Großmut“ oder „Gunst“ auszulegen.
- source_word: δέομαι
  choice: ich flehe dich an
  rationale: Gibt die gegenüber den vorherigen Verben gesteigerte Dringlichkeit der Bitte wieder.
- source_word: ποιήσῃς τὴν εὐχὴν ἣν ηὐξάμην
  choice: das Gelübde, das ich … abgelegt habe, … zu erfüllen
  rationale: Die Verbindung des Substantivs εὐχή mit dem stammverwandten Verb ηὐξάμην spricht hier für Gelübdesprache. „Erfüllen“ gibt das idiomatische ποιεῖν εὐχήν in natürlichem Deutsch wieder.
- source_word: τῷ βασιλεῖ τοῦ οὐρανοῦ
  choice: dem König des Himmels
  rationale: Die formale Gottesbezeichnung wird unmittelbar und ehrfürchtig wiedergegeben.
- source_word: ποιῆσαι ἐκ στόματός σου
  choice: durch deinen Ausspruch zu erfüllen
  rationale: „Ausspruch“ bewahrt das konkrete Bild des Mundes, bezeichnet im Deutschen aber verständlich die mündliche Anordnung oder Ermächtigung des Königs. Die Zuordnung des Infinitivs bleibt im Griechischen syntaktisch schwierig.
theological_decisions:
- issue: Bezug von „König des Himmels“
  choice: Gottesbezeichnung
  alternative: Bezeichnung eines himmlischen Königs ohne ausdrückliche Identifizierung
  rationale: Im jüdischen Kontext bezeichnet der Titel Gott und stellt ihn dem angesprochenen irdischen König gegenüber.
- issue: Bedeutung von εὐχή / ηὐξάμην
  choice: Gelübde / ein Gelübde ablegen
  alternative: Gebet / beten
  rationale: Die stammverwandte Verbindung und die Aufforderung, das Versprochene auszuführen, sprechen stärker für ein Gelübde; die grundsätzlich mögliche Gebetsbedeutung wird in der Fußnote offengelegt.
- issue: Funktion von ἐκ στόματός σου
  choice: Erfüllung durch den königlichen Ausspruch
  alternative: 'wörtlich: aus deinem Mund'
  rationale: Der Zusammenhang legt eine gesprochene königliche Anordnung oder Ermächtigung nahe, ohne den irdischen König mit dem „König des Himmels“ gleichzusetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit höfischem Bittton. Die rhetorische Wiederholung des Griechischen bleibt erhalten; schwer verständliche Wörtlichkeit wird im Haupttext behutsam geglättet und in den Fußnoten transparent gemacht.
