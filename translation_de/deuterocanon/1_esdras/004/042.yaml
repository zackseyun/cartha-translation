  text: Then the king said to him[a], “Ask for whatever more you want beyond what has been written, and we will give it to you, because you have been found wiser; and you shall sit beside me[c][b], and you shall be called my kinsman.”
translation:
  language: de
  text: 'Da sagte der König zu ihm: „Erbitte, was du über das Geschriebene hinaus noch wünschst[a], und wir werden es dir geben, weil du für weiser befunden wurdest. Du sollst neben mir sitzen[b] und mein Verwandter genannt werden[c].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Erbitte, was du mehr als das Geschriebene wünschst.“ Gemeint sind wahrscheinlich Belohnungen, die bereits schriftlich festgehalten oder zugesagt waren.'
    reason: lexical_alternative
  - marker: b
    text: Die griechische Wendung bezeichnet einen Platz in unmittelbarer Nähe des Königs und damit besondere Ehre am Hof.
    reason: cultural_context
  - marker: c
    text: 'Oder: „mein Angehöriger“. Die Bezeichnung drückt königliche Gunst und einen erhöhten Rang aus, nicht unbedingt eine Blutsverwandtschaft.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Αἴτησαι
  choice: Erbitte
  rationale: Der Aoristimperativ ist eine direkte königliche Aufforderung. „Erbitte“ gibt sowohl das Bitten als auch den höfisch-feierlichen Zusammenhang natürlich wieder.
- source_word: ὃ θέλεις πλείω τῶν γεγραμμένων
  choice: was du über das Geschriebene hinaus noch wünschst
  rationale: Die offene Relativkonstruktion und der komparative Sinn von πλείω bleiben erhalten. „Das Geschriebene“ bezeichnet wahrscheinlich bereits schriftlich festgelegte Belohnungen, ohne dass dies im Haupttext ausdrücklich ergänzt wird.
- source_word: δώσομέν σοι
  choice: wir werden es dir geben
  rationale: Die schlichte Zukunftsform von δίδωμι wird direkt wiedergegeben; der königliche Plural des griechischen Textes bleibt erhalten.
- source_word: ὃν τρόπον
  choice: weil
  rationale: Die Wendung führt hier den Grund für das Angebot des Königs an. „Weil“ macht diese kausale Funktion im modernen Deutsch klar.
- source_word: εὑρέθης σοφώτερος
  choice: du für weiser befunden wurdest
  rationale: Die Formulierung bewahrt sowohl das Passiv als auch den nicht näher bestimmten Vergleich des Komparativs σοφώτερος.
- source_word: ἐχόμενός μου καθήσῃ
  choice: du sollst neben mir sitzen
  rationale: ἐχόμενος mit Genitiv bezeichnet hier räumliche Nähe. „Neben mir sitzen“ ist im höfischen Kontext natürlich und vermittelt zugleich die damit verbundene Ehre.
- source_word: συγγενής μου κληθήσῃ
  choice: mein Verwandter genannt werden
  rationale: συγγενής bezeichnet einen Verwandten oder Angehörigen derselben Sippe. Die Übersetzung wahrt die familiäre Ehrensprache, ohne eine tatsächliche Blutsverwandtschaft zu behaupten.
theological_decisions:
- issue: Höfische Ehrenbezeichnung συγγενής μου
  choice: mein Verwandter genannt werden
  alternative: mein Angehöriger genannt werden; mein Freund genannt werden
  rationale: „Verwandter“ entspricht der familiären Bedeutung des griechischen Wortes und bewahrt die Aussage über die Erhöhung am Königshof. „Freund“ würde einen nicht ausdrücklich genannten politischen Titel eintragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht feierlichem Ton. Die Satzstruktur wurde für natürliche deutsche Rede gegliedert; Passiv, Komparativ und königlicher Plural des griechischen Textes bleiben erhalten.
