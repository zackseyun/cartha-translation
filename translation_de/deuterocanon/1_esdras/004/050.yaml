lexical_decisions:
- source_word: χώραν
  choice: Gebiet
  rationale: χώρα bezeichnet Land, Gebiet oder Region. „Gebiet“ passt zum verwaltungsrechtlichen Zusammenhang und lässt den Umfang offen.
- source_word: κρατήσουσιν
  choice: sie in Besitz haben werden
  rationale: Das Futur κρατήσουσιν bezeichnet hier Besitz oder Verfügungsgewalt. Die Wiedergabe wahrt die Zukunftsform und vermeidet die mögliche Verwechslung von „halten“ mit bloßem Festhalten.
- source_word: ἀφορολόγητον
  choice: steuerfrei
  rationale: Das Adjektiv bezeichnet die Befreiung von Steuer beziehungsweise Tribut; „steuerfrei“ ist modern und klar.
- source_word: ὑπάρχειν
  choice: sein soll
  rationale: Im abhängigen infinitivischen Erlassstil bedeutet ὑπάρχειν „sein“; „soll“ gibt den verfügenden Charakter natürlich wieder.
- source_word: Χαλδαῖοι
  choice: Chaldäer
  rationale: Dies ist die direkte, traditionelle Wiedergabe des ausdrücklich verwendeten Χαλδαῖοι und vermeidet die weitergehende Deutung „Babylonier“.
- source_word: ἀφίουσι
  choice: freigeben sollen
  rationale: ἀφίημι bedeutet hier, die beanspruchten Orte loszulassen beziehungsweise die Verfügungsgewalt darüber aufzugeben. „freigeben“ drückt dies im Deutschen präziser aus als das missverständliche „verlassen“.
- source_word: κώμας
  choice: Dörfer
  rationale: κώμη bezeichnet gewöhnlich ein Dorf oder eine ländliche Siedlung; „Dörfer“ ist die transparente Standardentsprechung.
- source_word: διακρατοῦσιν
  choice: sie besetzt halten
  rationale: διακρατέω bezeichnet anhaltendes Festhalten oder Beherrschen. „besetzt halten“ gibt sowohl die fortgesetzte Kontrolle als auch den Gegensatz zur Zugehörigkeit der Dörfer zu den Juden wieder.
