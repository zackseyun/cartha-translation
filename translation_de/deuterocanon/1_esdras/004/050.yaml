  source_fidelity: Der Erlasscharakter von ὑπάρχειν („sein soll“) und ἵνα mit Konjunktiv („sollen“) ist zutreffend wiedergegeben. „Gebiet“ für χώρα, „steuerfrei“ für ἀφορολόγητον, „Chaldäer“ für Χαλδαῖοι und „Dörfer“ für κώμας sind angemessen. Die Zukunft in κρατήσουσιν bleibt in „besitzen werden“ gewahrt.
  naturalness: Die Satzstruktur ist für einen fortlaufenden Erlass natürlich und das abschließende Semikolon sinnvoll. „Innehaben“ ist in diesem administrativ-rechtlichen Kontext idiomatisch und präziser als „besetzt halten“.
