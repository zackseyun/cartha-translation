  text: and that all the land that they hold should be tax-free for them[a]; and that the Chaldeans should leave the villages of the Jews that they occupy;
translation:
  language: de
  text: und dass das ganze Gebiet, das sie besitzen werden, für sie steuerfrei sein soll; und dass die Chaldäer die Dörfer der Juden, die sie innehaben, verlassen sollen;
