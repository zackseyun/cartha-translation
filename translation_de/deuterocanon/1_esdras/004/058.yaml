lexical_decisions:
- source_word: ὅτε ἐξῆλθεν
  choice: als … hinausging
  rationale: Die temporale Konstruktion wird als gleichzeitiger Erzählanschluss wiedergegeben. „Hinausging“ entspricht ἐξέρχομαι natürlich und ohne eine im Griechischen nicht ausdrücklich markierte längere Vorzeitigkeit.
- source_word: ὁ νεανίσκος
  choice: der junge Mann
  rationale: νεανίσκος bezeichnet hier einen jungen Mann; die Formulierung ist im modernen Standarddeutsch klar und legt keine zusätzliche Rolle wie etwa „Diener“ nahe.
- source_word: ἄρας τὸ πρόσωπον
  choice: hob er sein Gesicht
  rationale: Die Wiedergabe bewahrt die konkrete körperliche Geste des Erhebens. „Gesicht“ ist gegenwärtiger und allgemein verständlicher als das gehobene „Angesicht“.
- source_word: εἰς τὸν οὐρανόν
  choice: zum Himmel
  rationale: Im Gebets- und Lobpreiskontext bezeichnet οὐρανός den Himmel; „zum Himmel“ gibt die Ausrichtung der Geste idiomatisch wieder.
- source_word: ἐναντίον Ἰερουσαλήμ
  choice: Jerusalem zugewandt
  rationale: Die Wendung bezeichnet hier die räumliche Ausrichtung auf Jerusalem. Die knappe Formulierung bewahrt diesen Sinn, ohne eine besondere liturgische Vorschrift hinzuzufügen.
- source_word: εὐλόγησεν
  choice: pries
  rationale: Wenn Gott das Objekt ist, bezeichnet εὐλογέω das rühmende Segnen beziehungsweise Preisen. „Pries“ ist im heutigen Deutsch unmittelbar verständlich; die wörtlichere biblische Alternative „segnete“ bleibt in der Fußnote erhalten.
- source_word: τῷ βασιλεῖ τοῦ οὐρανοῦ
  choice: den König des Himmels
  rationale: Die Formulierung folgt dem griechischen Gottesprädikat eng und bewahrt dessen feierlichen Charakter.
theological_decisions:
- issue: Wiedergabe von εὐλογέω mit Gott als Objekt
  choice: pries den König des Himmels
  alternative: segnete den König des Himmels
  rationale: Das griechische Verb kann gegenüber Gott sowohl mit dem traditionellen biblischen „segnen“ als auch sinngemäß mit „preisen“ wiedergegeben werden. Der Haupttext verwendet das heute klarere „pries“, während die Fußnote die theologisch und sprachlich bedeutsame wörtlichere Lesart sichtbar hält.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzführung. Die konkrete Gebetsgeste bleibt erhalten; schwer verständliche oder missverständliche biblische Idiomatik wird im Haupttext behutsam geklärt und in der Fußnote dokumentiert.
