  text: and you vowed to rebuild the temple which the Judeans burned when Judea was laid waste by the Chaldeans[a].
translation:
  language: de
  text: Und du wirst geloben, den Tempel wieder aufzubauen, den die Judäer in Brand setzten, als Judäa von den Chaldäern verwüstet wurde.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich nach dem Griechischen: „den die Judäer in Brand setzten“. Diese schwierige Lesart weicht von der bekannteren Darstellung ab, nach der die Chaldäer beziehungsweise Babylonier den Tempel verbrannten.'
    reason: Die griechische Vorlage schreibt die Brandstiftung ausdrücklich den Judäern zu. Diese historisch auffällige Lesart wird im Haupttext beibehalten und in der Anmerkung transparent erläutert.
lexical_decisions:
- source_word: εὔξω
  choice: du hast gelobt
  rationale: Das Verb εὔχομαι bezeichnet hier mit dem folgenden Infinitiv am ehesten ein Gelübde beziehungsweise eine feierliche Zusage, eine bestimmte Handlung auszuführen.
- source_word: οἰκοδομῆσαι
  choice: wieder aufzubauen
  rationale: Obwohl οἰκοδομέω grundsätzlich „bauen“ bedeutet, macht der Zusammenhang mit dem zuvor zerstörten Tempel deutlich, dass dessen Wiederherstellung gemeint ist.
- source_word: τὸν ναὸν
  choice: den Tempel
  rationale: „Tempel“ ist in diesem Zusammenhang die natürliche deutsche Bezeichnung für das Jerusalemer Heiligtum; eine engere Wiedergabe wie „Tempelhaus“ ist nicht erforderlich.
- source_word: ἐνεπύρισαν
  choice: in Brand setzten
  rationale: Die Form bezeichnet das Anzünden beziehungsweise Verbrennen. „In Brand setzten“ gibt den Vorgang präzise wieder, ohne das vollständige Niederbrennen zusätzlich zu behaupten.
- source_word: οἱ Ἰουδαῖοι
  choice: die Judäer
  rationale: Im historischen und geografischen Zusammenhang bewahrt „Judäer“ den möglichen Bezug auf die Bewohner beziehungsweise das Volk Judäas und vermeidet eine vorschnelle Erweiterung auf spätere Bedeutungsfelder von „Juden“.
- source_word: ἐρημώθη
  choice: verwüstet wurde
  rationale: Die passive Aoristform bezeichnet die Verheerung oder Verödung des Landes. „Verwüstet wurde“ ist natürliches modernes Deutsch und erhält die Schwere der Aussage.
- source_word: ὑπὸ τῶν Χαλδαίων
  choice: von den Chaldäern
  rationale: Die griechische Vorlage nennt ausdrücklich die Chaldäer. Diese Bezeichnung wird beibehalten und nicht stillschweigend durch „Babylonier“ ersetzt.
theological_decisions:
- issue: Historisch schwierige Zuschreibung der Tempelverbrennung an die Judäer
  choice: 'Die ausdrückliche Lesart der griechischen Vorlage wird im Haupttext beibehalten: „den die Judäer in Brand setzten“.'
  alternative: „den die Chaldäer/Babylonier in Brand setzten“
  rationale: In der vorliegenden griechischen Lesart ist οἱ Ἰουδαῖοι eindeutig das Subjekt von ἐνεπύρισαν. Die bekannte Überlieferung, nach der die Chaldäer beziehungsweise Babylonier den Tempel verbrannten, darf diese schwierige Lesart nicht ohne textliche Grundlage ersetzen; die Spannung wird daher in einer Fußnote offengelegt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt nah am Griechischen, klingt jedoch natürlich. „Gelobt“ bewahrt den feierlichen Charakter der Zusage; „Judäer“ und „Chaldäer“ erhalten die historischen Bezeichnungen der Vorlage.
