  text: to go up and rebuild Jerusalem and the temple on which his name had been called; and they celebrated with music and joy for seven days.
translation:
  language: de
  text: hinaufzuziehen und Jerusalem und den Tempel, über dem sein Name genannt worden war,[a] wieder aufzubauen; und sie feierten sieben Tage lang mit Musik und Freude.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »auf dem sein Name genannt worden war« oder »der nach seinem Namen genannt war«. Die griechische Wendung gibt eine semitische Tempelformel wieder, die Gottes Anspruch auf den Tempel und seine Verbindung mit ihm ausdrückt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναβῆναι
  choice: hinaufzuziehen
  rationale: Das Verb bedeutet wörtlich »hinaufgehen/hinaufziehen«. Bei Jerusalem klingt zugleich die Rückkehr aus dem Exil an, ohne dass diese Deutung in den Text eingesetzt wird.
- source_word: οἰκοδομῆσαι
  choice: wieder aufzubauen
  rationale: Das Grundverb bedeutet »bauen«; im Zusammenhang der Wiederherstellung Jerusalems und des Tempels gibt »wieder aufbauen« den kontextuellen Sinn natürlich wieder.
- source_word: ἱερὸν
  choice: Tempel
  rationale: Gemeint ist hier der Jerusalemer Tempel; »Tempel« ist die klare und übliche deutsche Entsprechung.
- source_word: οὗ ὠνομάσθη τὸ ὄνομα αὐτοῦ ἐπ’ αὐτῷ
  choice: über dem sein Name ausgerufen worden war
  rationale: Die Formulierung bewahrt das semitisch geprägte Tempelidiom und lässt Gottes Anspruch auf den Tempel sowie seine Verbindung mit ihm erkennen, ohne es in eine eindeutige Paraphrase aufzulösen.
- source_word: ἐκωθωνίζοντο
  choice: sie feierten
  rationale: Das seltene Verb bezeichnet ausgelassenes beziehungsweise festliches Feiern; »sie feierten« ist gegenwärtig, verständlich und passt zu Musik und Freude.
- source_word: μουσικῶν
  choice: mit Musik
  rationale: Der Genitiv Plural kann musikalische Darbietung oder Musiker bezeichnen. »mit Musik« gibt den Sinn idiomatisch wieder, ohne unnötig festzulegen.
- source_word: χαρᾶς
  choice: Freude
  rationale: Eine direkte, im biblischen Sprachgebrauch geläufige Wiedergabe.
- source_word: ἡμέρας ἑπτά
  choice: sieben Tage lang
  rationale: Diese Formulierung drückt die Zeitdauer im Deutschen natürlich und genau aus.
theological_decisions:
- issue: Tempelformel vom göttlichen Namen
  choice: über dem sein Name ausgerufen worden war
  alternative: auf dem sein Name genannt worden war; der nach seinem Namen genannt war
  rationale: Die gewählte Fassung erhält die bildhafte, theologisch offene Formel für Gottes Anspruch auf den Tempel und seine besondere Verbindung mit ihm. Sie legt die Wendung weder bloß als Namensgebung noch ausschließlich als kultische Anrufung aus.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der einleitende Infinitiv bleibt erhalten, da der Vers als Fortsetzung des vorausgehenden Satzes überliefert ist. Die Wortstellung hält Jerusalem und den Tempel eng als Gegenstände des Wiederaufbaus zusammen; die Tempelformel bleibt bewusst bildhaft.
