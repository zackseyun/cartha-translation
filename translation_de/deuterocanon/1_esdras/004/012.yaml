  text: The third wrote[a], “Women are stronger, but above all things truth is victorious.”
translation:
  language: de
  text: 'Der Dritte schrieb[a]: »Die Frauen sind stärker; doch über alles siegt die Wahrheit.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Die Frauen setzen sich durch; doch die Wahrheit setzt sich gegen alles durch.«'
    reason: Lexikalische Alternative für ὑπερισχύουσιν und νικᾷ, die beide mit »sich durchsetzen« wiedergegeben werden können.
lexical_decisions:
- source_word: ὁ τρίτος
  choice: Der Dritte
  rationale: Der substantivisch gebrauchte Artikel mit Ordinalzahl bezeichnet im Erzählzusammenhang den dritten Teilnehmer; »Der Dritte« ist knapp und natürlich.
- source_word: ἔγραψεν
  choice: schrieb
  rationale: Das Verb bedeutet unmittelbar »schrieb« und leitet hier die schriftlich festgehaltene These ein.
- source_word: Ὑπερισχύουσιν
  choice: sind stärker
  rationale: Das Verb bezeichnet überlegene Stärke beziehungsweise das Gewinnen der Oberhand. »Sind stärker« bewahrt die vergleichende Aussage des Sinnspruchs.
- source_word: αἱ γυναῖκες
  choice: die Frauen
  rationale: γυναῖκες kann Frauen oder Ehefrauen bedeuten; die allgemeine, sprichwortartige Aussage spricht hier für »die Frauen«.
- source_word: ὑπὲρ δὲ πάντα
  choice: doch über alles
  rationale: Die Wendung bezeichnet eine Steigerung über alles andere hinaus. »Doch über alles« gibt die kontrastive und klimaktische Funktion knapp wieder.
- source_word: νικᾷ
  choice: siegt
  rationale: Das Präsens formuliert eine allgemeine Aussage, und »siegt« bewahrt das Bild des Sieges natürlicher als eine nominale Konstruktion.
- source_word: ἡ ἀλήθεια
  choice: die Wahrheit
  rationale: Der griechische Artikel wird im Deutschen bei dem personifiziert dargestellten Abstraktum natürlich mit »die Wahrheit« wiedergegeben.
theological_decisions:
- issue: Wiedergabe der klimaktischen Aussage über ἀλήθεια
  choice: über alles siegt die Wahrheit
  alternative: die Wahrheit behält über alles die Oberhand
  rationale: Die Formulierung bewahrt die Personifikation und das Siegesbild von νικᾷ, ohne die Aussage abstrakt abzuschwächen oder theologisch näher zu bestimmen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der knappe, sprichwortartige Parallelismus bleibt erhalten; das Semikolon verdeutlicht die Steigerung zur Wahrheit.
