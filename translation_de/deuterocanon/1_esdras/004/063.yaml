  verdict: revise
  source_fidelity: Die Grundübersetzung gibt den Infinitivcharakter, das Hinaufziehen, den Wiederaufbau, die siebentägige Dauer sowie die festliche Feier zutreffend wieder. »Ausgerufen« entspricht jedoch der passiven Namensformel ὠνομάσθη nicht präzise; der griechische Ausdruck besagt, dass der Name über/bzw. auf dem Tempel genannt wurde, nicht dass er ausgerufen wurde.
  naturalness: »Hinaufzuziehen« und »sieben Tage lang mit Musik und Freude« sind in modernem, würdigem Standarddeutsch natürlich. »Über dem sein Name ausgerufen worden war« wirkt zugleich semantisch verschoben und stilistisch weniger idiomatisch. »Über dem sein Name genannt worden war« bewahrt die biblische Formel ohne unnötige Ausdeutung.
  terminology: »Tempel«, »wieder aufzubauen«, »Musik« und »Freude« sind angemessen. Die Namensformel soll weder zu einer bloßen kultischen Anrufung noch zu einer modernen Benennungsformel umgedeutet werden; die behutsam formelhafte Wiedergabe mit »genannt worden war« leistet dies besser.
