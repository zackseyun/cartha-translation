  text: to go up and rebuild Jerusalem and the temple on which his name was called[b][a]; and they celebrated with music and joy for seven days.
translation:
  language: de
  text: hinaufzuziehen und Jerusalem und den Tempel wieder aufzubauen, über dem sein Name genannt worden war[a]; und sie feierten sieben Tage lang mit Musik und Freude.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder sinngemäßer: »der seinen Namen trägt«. Möglich ist auch: »wo sein Name angerufen wurde«.'
    reason: lexical_alternative
  - marker: b
    text: Das hier verwendete seltene Verb kann auch mit »sie hielten ein Fest« oder »sie freuten sich beim Feiern« wiedergegeben werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναβῆναι
  choice: hinaufzuziehen
  rationale: Bewahrt die biblisch-geografische Rede vom Hinaufziehen nach Jerusalem, ohne sie als bloße Rückkehr auszulegen.
- source_word: οἰκοδομῆσαι
  choice: wieder aufzubauen
  rationale: Der Kontext der Wiederherstellung nach der Zerstörung rechtfertigt die kontextuelle Wiedergabe »wieder aufbauen«.
- source_word: τὸ ἱερὸν
  choice: den Tempel
  rationale: Ἱερόν bezeichnet hier den Jerusalemer Tempel beziehungsweise Tempelbezirk; »Tempel« ist die natürliche deutsche Entsprechung.
- source_word: οὗ ὠνομάσθη τὸ ὄνομα αὐτοῦ ἐπʼ αὐτῷ
  choice: über dem sein Name ausgerufen worden war
  rationale: Die Wiedergabe bleibt der semitisch geprägten Namensformel und dem griechischen Passiv nahe. »Über dem« nimmt ἐπʼ αὐτῷ auf, während »ausgerufen« die Formel verständlicher macht als das unidiomatische »genannt wurde«.
- source_word: ἐκωθωνίζοντο
  choice: sie feierten
  rationale: Das seltene Verb bezeichnet eine festliche Feier. »Feierten« ist verständlich und vermeidet die möglichen negativen Nebentöne von »schwelgten« oder »zechten«.
- source_word: μετὰ μουσικῶν
  choice: mit Musik
  rationale: Die substantivierte Pluralform kann musikalische Begleitung, Musiker oder Musikinstrumente bezeichnen. »Mit Musik« wahrt diese Unbestimmtheit in natürlichem Deutsch.
- source_word: χαρᾶς
  choice: Freude
  rationale: Direkte und im festlichen Zusammenhang natürliche Wiedergabe.
- source_word: ἡμέρας ἑπτά
  choice: sieben Tage lang
  rationale: Gibt die Dauer idiomatisch und genau wieder.
theological_decisions:
- issue: Die Formel vom göttlichen Namen über dem Tempel
  choice: über dem sein Name ausgerufen worden war
  alternative: der seinen Namen trägt / wo sein Name angerufen wurde
  rationale: Die gewählte Form bewahrt die biblische Formel für Gottes besondere Zuordnung zum Tempel, ohne sie auf bloße Benennung, kultische Anrufung oder eine Aussage über Gottes räumliche Gegenwart festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt dem griechischen Fragmentcharakter entsprechend infinitivisch. Die seltene Festterminologie und die mehrdeutige Namensformel werden durch Fußnoten transparent gemacht.
