  text: and it turns every mind to feasting and gladness[b][a], and one remembers no sorrow and no debt.
translation:
  language: de
  text: und lenkt jedes Denken[a] auf Festgelage und Freude, und man denkt weder an Kummer noch an irgendeine Schuld.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „jeden Gedanken“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „irgendeine Verpflichtung“; das griechische Wort kann allgemein etwas Geschuldetes bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶσαν διάνοιαν
  choice: jeden Sinn
  rationale: διάνοια bezeichnet hier die Gedanken- oder Gemütsausrichtung eines Menschen. „Jeden Sinn“ bewahrt die distributive Kraft von πᾶσαν und passt natürlich zu μεταστρέφει.
- source_word: μεταστρέφει
  choice: wendet … zu
  rationale: Das Verb bezeichnet ein Umwenden oder Verändern. Die Konstruktion „wendet … zu“ gibt zusammen mit εἰς die gerichtete Veränderung wieder.
- source_word: εἰς εὐωχίαν καὶ εὐφροσύνην
  choice: Festgelage und Freude zu
  rationale: εὐωχία meint ein Festmahl beziehungsweise festliches Schmausen, εὐφροσύνη Freude oder Fröhlichkeit. „Festgelage und Freude“ erhält beide Begriffe und den festlichen Ton.
- source_word: οὐ μέμνηται
  choice: man denkt weder an … noch an
  rationale: Das Subjekt bleibt im Griechischen unausgesprochen und ist allgemein auf den vom Wein beeinflussten Menschen bezogen. Das unpersönliche „man“ bildet diese generische Aussage im Deutschen natürlich ab.
- source_word: πᾶσαν λύπην
  choice: Kummer
  rationale: λύπη kann Kummer, Trauer oder Schmerz bezeichnen. „Kummer“ passt hier als allgemeine belastende Gemütslage zum Gegensatz von Freude.
- source_word: πᾶν ὀφείλημα
  choice: irgendeine Schuld
  rationale: ὀφείλημα bezeichnet etwas Geschuldetes, insbesondere eine Schuld, kann aber weiter auch eine Verpflichtung meinen. „Irgendeine Schuld“ bewahrt πᾶν in der verneinten Aussage.
