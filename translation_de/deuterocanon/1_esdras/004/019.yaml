translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz setzt den vorherigen Bezug auf den Wein voraus; das unbestimmte Subjekt des zweiten Teils wird mit „man“ wiedergegeben. Die Markierung [a] steht nach der gesamten Wendung, auf die sich die Alternative bezieht.
