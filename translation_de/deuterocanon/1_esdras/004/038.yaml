  text: And the truth remains and is strong forever, and lives and prevails forever and ever.
translation:
  language: de
  text: Und die Wahrheit bleibt und ist stark in Ewigkeit; sie lebt und setzt sich durch für immer und ewig.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡ ἀλήθεια
  choice: die Wahrheit
  rationale: Der bestimmte Artikel wird beibehalten; zugleich bleibt die im Satz entfaltete Personifizierung der Wahrheit erkennbar.
- source_word: μένει
  choice: bleibt
  rationale: „Bleibt“ gibt die fortdauernde Beständigkeit schlicht und gegenwartssprachlich wieder.
- source_word: ἰσχύει
  choice: ist stark
  rationale: Die Formulierung bezeichnet die Stärke der Wahrheit und hält das Verb bewusst von κρατεῖ auseinander.
- source_word: εἰς τὸν αἰῶνα
  choice: in Ewigkeit
  rationale: Eine natürliche, würdige deutsche Wiedergabe der zeitlichen Wendung, die ihre unbegrenzte Dauer ausdrückt.
- source_word: ζῇ
  choice: lebt
  rationale: Die anschauliche Personifizierung des griechischen Textes wird unmittelbar bewahrt.
- source_word: κρατεῖ
  choice: setzt sich durch
  rationale: Die Wendung vermittelt aktive Überlegenheit und Wirksamkeit, ohne sie mit der zuvor genannten Stärke gleichzusetzen.
- source_word: εἰς τὸν αἰῶνα τοῦ αἰῶνος
  choice: für immer und ewig
  rationale: Die idiomatische deutsche Steigerungsform bewahrt die feierliche und klimaktische Wirkung des griechischen Ausdrucks.
theological_decisions:
- issue: Personifizierung der Wahrheit
  choice: Die persönlichen Aussagen „lebt“ und „setzt sich durch“ werden auf die Wahrheit bezogen beibehalten.
  alternative: 'Die Aussage abstrahieren, etwa: „Die Wahrheit besteht fort und besitzt Macht.“'
  rationale: Der griechische Text schreibt der Wahrheit ausdrücklich Leben und aktives Sich-Durchsetzen zu. Diese Rhetorik wird bewahrt, ohne daraus eine weitergehende dogmatische Identifikation abzuleiten.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, pointiertem Satzrhythmus. Die beiden Ewigkeitsformeln werden unterschiedlich wiedergegeben, damit die Steigerung im Schlussglied hörbar bleibt.
