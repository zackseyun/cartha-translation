base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/004/001.yaml
  text: And King Darius made a great banquet for all who were under him[a], and for all his household, and for all the nobles of Media and Persia,
translation:
  language: de
  text: Und König Darius veranstaltete ein großes Festmahl für alle, die ihm unterstanden, für alle Angehörigen seines Hauses und für alle Großen Mediens und Persiens,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δοχή
  choice: Festmahl
  rationale: Das Wort bezeichnet hier eine ausgerichtete Bewirtung beziehungsweise ein Bankett. „Festmahl“ ist im königlichen Kontext natürlich, würdig und präzise.
- source_word: μεγάλην
  choice: großes
  rationale: Das Adjektiv hebt Umfang oder Pracht des Festmahls hervor; „großes“ gibt dies direkt wieder, ohne zusätzliche Vorstellungen einzutragen.
- source_word: τοῖς ὑπʼ αὐτόν
  choice: alle, die ihm unterstanden
  rationale: Die Formulierung bewahrt den hierarchischen Sinn des wörtlichen „die unter ihm waren“, ohne die Gruppe enger als „Untertanen“ politisch festzulegen.
- source_word: οἰκογενέσιν
  choice: Angehörigen seines Hauses
  rationale: Der Ausdruck umfasst die zum königlichen Haus gehörenden Personen und ist weiter als die unmittelbare Familie. „Angehörige seines Hauses“ wahrt diese Breite besser als „Familie“.
- source_word: μεγιστᾶσιν
  choice: Großen
  rationale: Gemeint sind hochgestellte und einflussreiche Männer. „die Großen“ ist eine würdige, historisch passende Bezeichnung, die weder einen erblichen Adel noch ein bestimmtes Amt voraussetzt.
- source_word: Μηδείας καὶ τῆς Περσίδος
  choice: Mediens und Persiens
  rationale: Die Genitive bezeichnen die Gebiete beziehungsweise Reiche, denen die hochgestellten Personen zugeordnet sind; die deutschen Genitivformen geben die Konstruktion knapp und unmittelbar wieder.
