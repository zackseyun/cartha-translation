lexical_decisions:
- source_word: ὦ ἄνδρες
  choice: Ihr Männer
  rationale: Gibt die direkte Anrede natürlich und würdig wieder; ein zusätzliches »O« wäre im heutigen Deutschen unnötig feierlich.
- source_word: πῶς οὐκ ἰσχυραὶ
  choice: wie sollten … nicht stark sein
  rationale: Bewahrt die rhetorische Frage und die Aussagekraft von ἰσχυραί, ohne sie in eine schlichte Behauptung umzuwandeln.
- source_word: αἱ γυναῖκες
