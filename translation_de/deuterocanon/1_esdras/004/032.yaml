  rationale: Entspricht dem allgemeinen Plural des griechischen Ausdrucks.
- source_word: ὅτι οὕτως πράσσουσιν
  choice: wenn sie so handeln
  rationale: Im Zusammenhang begründet das beobachtete Handeln die rhetorische Folgerung. »Wenn« klingt im Deutschen natürlicher, ohne den begründenden Zusammenhang aufzugeben.
