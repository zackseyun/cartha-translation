  text: He also wrote out the provision and the priestly robe[a]—specifying in what they are to minister in it.
translation:
  language: de
  text: Er schrieb auch die Versorgung und das priesterliche Gewand auf und gab an, worin sie darin dienen werden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Er schrieb auch die Versorgung und das priesterliche Gewand auf und hielt fest, wie sie darin Dienst tun werden.“ Der griechische Wortlaut ist besonders in der Verbindung „worin … darin“ stark gedrängt; „wie“ glättet die offene Bedeutung von ἐν τίνι etwas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔγραψεν
  choice: schrieb … auf
  rationale: Der Aorist von γράφω bezeichnet hier das schriftliche Festhalten administrativer Anordnungen. „Schrieb … auf“ gibt dies natürlich und ohne ein im Griechischen nicht vorhandenes „über“ wieder.
- source_word: χορηγίαν
  choice: Versorgung
  rationale: χορηγία bezeichnet eine für einen bestimmten Zweck bereitgestellte Versorgung oder Ausstattung. „Versorgung“ bleibt weit genug und beschränkt den Sinn nicht auf Geldmittel.
- source_word: ἱερατικὴν στολήν
  choice: priesterliche Gewand
  rationale: στολή bezeichnet ein Gewand, oft ein feierliches Amtsgewand. „Priesterliches Gewand“ ist verständlich und vermeidet stärker konfessionell geprägte Fachausdrücke wie „Ornat“.
- source_word: ἐν τίνι
  choice: worin
  rationale: Die Wendung ist im Griechischen knapp und syntaktisch ungewöhnlich. „Worin“ bewahrt die offene Beziehung, ohne sie als Zweck- oder Verfahrensangabe festzulegen.
- source_word: λατρεύσουσιν
  choice: ihren Dienst tun sollten
  rationale: λατρεύω bezeichnet im Tempelzusammenhang den Gottes- beziehungsweise Kultdienst. Die Formulierung wahrt diesen Bezug, ohne das Verb auf bloßes Dienen oder ausschließlich auf gottesdienstliches Zelebrieren zu verengen.
- source_word: ἐν αὐτῇ
  choice: darin
  rationale: Das feminine Pronomen bezieht sich am ehesten auf στολή, das Gewand. „Darin“ erhält jedoch die gedrängte Ausdrucksweise und legt den Bezug nicht stärker fest als der Ausgangstext.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die leicht ungewöhnliche Folge „worin … darin“ wurde bewusst beibehalten, um die syntaktische Gedrängtheit und mögliche Mehrdeutigkeit des griechischen Textes nicht stillschweigend aufzulösen.
