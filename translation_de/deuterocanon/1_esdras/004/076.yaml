  source_fidelity: Der Entwurf gibt χορηγία und ἱερατικὴ στολή angemessen wieder und erhält die auffällige Doppelung von ἐν τίνι und ἐν αὐτῇ grundsätzlich. „Sollten“ verschiebt όμως das futurische λατρεύσουσιν jedoch zu einer abgeschwächten bzw. normativen Vergangenheitsform. Die explizite Wendung „legte fest“ ist zudem stärker als das bloße schriftliche Festhalten im Griechischen.
  naturalness: „Worin sie darin ihren Dienst tun sollten“ ist zwar absichtlich gedrängt, aber im Deutschen unnötig schwerfällig. Mit „gab an“ wird die im griechischen Satz implizierte Spezifizierung lesbar, ohne den doppelten Ortsbezug zu tilgen.
