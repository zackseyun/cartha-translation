  text: and they do not remember[a], while they are drinking, to show affection to friends and brothers, and before long they draw swords.
translation:
  language: de
  text: Wenn sie trinken, denken sie nicht daran, ihren Freunden und Brüdern Zuneigung zu erweisen[a], und kurz darauf ziehen sie Schwerter.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: sich Freunden und Brüdern gegenüber freundschaftlich zu verhalten. Das griechische Verb kann allgemein liebevolles oder freundschaftliches Verhalten bezeichnen, nicht nur eine bestimmte Geste.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ μέμνηται
  choice: denken sie nicht mehr daran
  rationale: Obwohl die griechische Verbform im Singular steht, folgen pluralische Verbformen und der Zusammenhang beschreibt allgemein das Verhalten von Trinkenden. Der Plural ergibt daher einen natürlichen deutschen Satz; „nicht mehr daran denken“ gibt den Gedanken des Vergessens im Rausch idiomatisch wieder.
- source_word: ὅταν πίνωσιν
  choice: Wenn sie trinken
  rationale: ὅταν mit Konjunktiv bezeichnet einen unbestimmten beziehungsweise wiederkehrenden Fall. Die knappe Formulierung ist im Deutschen natürlich und wahrt diesen allgemeinen Sinn.
- source_word: φιλιάζειν
  choice: Zuneigung zu zeigen
  rationale: Das Verb bezeichnet freundschaftliches oder liebevolles Verhalten und muss nicht auf eine konkrete körperliche Geste wie einen Kuss eingeengt werden.
- source_word: φίλοις καὶ ἀδελφοῖς
  choice: Freunden und Brüdern
  rationale: Die beiden Dative bezeichnen den Personenkreis, dem das freundschaftliche Verhalten gilt. „Brüder“ entspricht der maskulinen griechischen Form, ohne den Ausdruck weiter auszudeuten.
- source_word: μετʼ οὐ πολὺ
  choice: kurz darauf
  rationale: Die Wendung bezeichnet einen nur kurzen zeitlichen Abstand und hebt den raschen Umschlag zur Gewalt hervor.
- source_word: σπῶνται μαχαίρας
  choice: ziehen sie Schwerter
  rationale: σπάω mit μάχαιρα bezeichnet das Ziehen beziehungsweise Herausziehen einer Klinge. „Schwerter ziehen“ ist die geläufige, prägnante deutsche Wiedergabe.
