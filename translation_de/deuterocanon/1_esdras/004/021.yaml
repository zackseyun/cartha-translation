translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem, knappem Erzählton. Der abrupte Gegensatz zwischen Zuneigung und Gewalt bleibt erhalten; die Numerusabweichung der griechischen Form οὐ μέμνηται wird im Deutschen entsprechend dem pluralischen Zusammenhang geglättet.
