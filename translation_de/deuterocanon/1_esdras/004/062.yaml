  text: And they blessed the God of their fathers, because he had given them relief and release.
translation:
  language: de
  text: Und sie priesen den Gott ihrer Vorfahren, weil er ihnen Erleichterung und Befreiung geschenkt hatte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐλόγησαν
  choice: priesen
  rationale: Im Deutschen bezeichnet „Gott preisen“ natürlich und treffend den auf Gott gerichteten Sinn von εὐλογέω; das wörtlichere „segneten“ wäre hier missverständlich.
- source_word: τὸν θεὸν τῶν πατέρων αὐτῶν
  choice: den Gott ihrer Vorfahren
  rationale: Bewahrt die Zugehörigkeitsformulierung des Griechischen, während „Vorfahren“ im heutigen Standarddeutsch natürlicher und inklusiver als „Väter“ klingt.
- source_word: ἄνεσιν
  choice: Ruhe
  rationale: ἄνεσις kann Entlastung, Erleichterung oder Ruhe bezeichnen. „Ruhe“ wahrt hier den offenen Sinn einer gewährten Erholung von Bedrängnis.
- source_word: ἄφεσιν
  choice: Befreiung
  rationale: ἄφεσις hat das Grundfeld Freilassung, Erlass und Loslösung. „Befreiung“ passt zum politischen und sozialen Zusammenhang, ohne die hier nicht ausdrücklich geforderte Bedeutung „Sündenvergebung“ einzutragen.
- source_word: ἔδωκεν
  choice: geschenkt hatte
  rationale: Gibt die gewährende Handlung idiomatisch wieder; das Plusquamperfekt ordnet sie als Grund des anschließenden Preisens ein.
theological_decisions:
- issue: Mögliche religiöse Deutung von ἄφεσις als Vergebung
  choice: Befreiung
  alternative: Vergebung / Erlass
  rationale: Der Vers nennt keinen Gegenstand der Vergebung. Daher bleibt die Übersetzung beim allgemeineren Sinn der Freilassung und vermeidet eine unbelegte soteriologische Festlegung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der knappe Satzbau des Griechischen bleibt erhalten; „weil“ gibt ὅτι als Begründung wieder.
