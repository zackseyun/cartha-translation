  yaml_path: translation/deuterocanon/1_esdras/004/023.yaml
  text: Men[a], does not wine prevail, since it compels one to act thus? And he fell silent after speaking in this way.
translation:
  language: de
  text: Ihr Männer, ist der Wein nicht stärker, weil er dazu zwingt, so zu handeln? Nachdem er dies gesagt hatte, schwieg er.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὦ ἄνδρες
  choice: Ihr Männer
  rationale: Gibt die direkte maskuline Anrede im Plural würdig und quellennah wieder; „Meine Herren“ wäre stärker gesellschaftlich geprägt.
- source_word: οὐχ ὑπερισχύει ὁ οἶνος
  choice: ist der Wein nicht überlegen
  rationale: Bewahrt die rhetorische Frage und den Gedanken der überlegenen Kraft; „überwältigt“ würde ein nicht ausdrücklich genanntes Objekt nahelegen.
- source_word: ὅτι οὕτως ἀναγκάζει ποιεῖν
  choice: da er die Menschen zwingt, so zu handeln
  rationale: ἀναγκάζει bezeichnet Zwang; das generische Objekt „die Menschen“ wird aus dem Zusammenhang ergänzt, während οὕτως durch „so“ wiedergegeben wird.
- source_word: καὶ ἐσίγησεν
  choice: schwieg er
  rationale: Der Aorist bezeichnet hier den Eintritt beziehungsweise den abschließenden Vollzug des Schweigens nach der Rede.
- source_word: οὕτως εἴπας
  choice: Nachdem er dies gesagt hatte
  rationale: Gibt das vorzeitige Partizip idiomatisch wieder. „Dies“ fasst die soeben gesprochenen Worte zusammen, ohne zusätzlichen Inhalt einzuführen.
