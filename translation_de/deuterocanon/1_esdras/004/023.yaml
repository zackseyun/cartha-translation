    rationale: ὑπερισχύει bezeichnet überlegene Stärke beziehungsweise das Überwiegen. Ohne genanntes Vergleichsobjekt klingt „ist ... überlegen“ im Deutschen etwas unvollständig; „ist ... stärker“ wahrt die rhetorische und semantische Funktion natürlicher.
