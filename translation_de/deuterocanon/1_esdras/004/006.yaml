  source_fidelity: Die Übersetzung gibt die griechische Reihung und die elliptische Syntax zuverlässig wieder. „Purpur anzulegen“ entspricht περιβαλέσθαι πορφύραν, „aus goldenen Gefäßen zu trinken“ gibt ἐν χρυσώμασιν πίνειν idiomatisch und ohne unzulässige Festlegung der Gefäßform wieder. Die bewusst knappe Formulierung „auf Gold zu schlafen“ wahrt die im Griechischen vorhandene Ellipse. Auch Wagen samt goldenem Zaumzeug, Turban aus feinem Leinen und Halsschmuck um den Hals entsprechen dem Wortlaut und lassen die jeweils bestehende lexikalische Bandbreite offen.
  naturalness: Modernes, verständliches Standarddeutsch bei angemessen würdigem Register. Die Wiederholung von „und“ sowie das Satzfragment mit den abschließenden Akkusativen sind als kontextgebundene Reihung sachgerecht und folgen dem griechischen Stil. „Halsschmuck um den Hals“ wirkt isoliert leicht pleonastisch, gibt aber die ausdrückliche griechische Ortsangabe korrekt wieder.
  terminology: 'Die Terminologie ist treffend: „Purpur“, „goldene Gefäße“, „Zaumzeug“, „Turban“, „feines Leinen“ und „Halsschmuck“ sind sachlich, zeitgemäß und nicht konfessionell aufgeladen. Insbesondere vermeidet „Halsschmuck“ eine ungerechtfertigte Entscheidung zwischen Halsring, Halsband und Kette.'
