  text: and to put on purple[a], and to drink from gold vessels, and to sleep on gold, and a chariot with gold bridles, and a turban of fine linen, and a necklace around the neck[c][b],
translation:
  language: de
  text: und Purpur anzulegen und aus goldenen Gefäßen zu trinken[a] und auf Gold zu schlafen[b] und einen Wagen mit goldenem Zaumzeug[c] und einen Turban aus feinem Leinen und einen Halsschmuck um den Hals,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „aus goldenen Bechern zu trinken“. Das Griechische nennt goldene Gegenstände zum Trinken, bestimmt aber die genaue Gefäßart nicht.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „auf Gold zu schlafen“. Gemeint sein könnte ein mit Gold verziertes Bett oder Ruhelager; ein entsprechendes Substantiv steht jedoch nicht im griechischen Text.'
    reason: lexical_alternative
  - marker: c
    text: Die Wendung kann auch allgemeiner einen Wagen mit goldenem Geschirr oder goldenen Beschlägen bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: πορφύραν περιβαλέσθαι
  choice: Purpur anzulegen
  rationale: Das Medium von περιβάλλω bezeichnet hier das Anlegen eines Kleidungsstücks; πορφύρα kann Purpurstoff beziehungsweise Purpurkleidung meinen. „Purpur anzulegen“ bewahrt das konkrete Bild, ohne „königlich“ hinzuzufügen.
- source_word: ἐν χρυσώμασιν πίνειν
  choice: aus goldenen Gefäßen zu trinken
  rationale: χρυσώματα bezeichnet hier Gegenstände aus Gold, die zum Trinken verwendet werden. „Gefäße“ ist im Deutschen natürlich, legt aber die genaue Gefäßart nicht fest.
- source_word: ἐπὶ χρυσῷ καθεύδειν
  choice: auf Gold zu schlafen
  rationale: Die knappe griechische Formulierung nennt ausdrücklich Gold, aber kein Bett oder Ruhelager. Die wörtlich nahe Wiedergabe erhält diese Offenheit.
- source_word: ἅρμα χρυσοχάλινον
  choice: einen Wagen mit goldenem Zaumzeug
  rationale: Das zusammengesetzte Adjektiv verbindet den Wagen mit einem goldenen Zaum, Gebiss oder allgemeinerem Geschirr. „Goldenes Zaumzeug“ ist verständlich und wahrt die mögliche kollektive Bedeutung.
- source_word: κίδαριν βυσσίνην
  choice: einen Turban aus feinem Leinen
  rationale: κίδαρις bezeichnet eine turbanartige Kopfbedeckung; βύσσινος bezeichnet Byssus beziehungsweise kostbares feines Leinen. Die gewählte Formulierung ist klar und sachlich.
- source_word: μανιάκην περὶ τὸν τράχηλον
  choice: einen Halsschmuck um den Hals
  rationale: μανιάκης bezeichnet einen Halsring, ein Halsband oder eine andere kostbare Halszier. „Halsschmuck“ lässt die genaue Form offen; die Ortsangabe des Griechischen bleibt ausdrücklich erhalten.
