base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/004/037.yaml
  text: Wine is unjust[a], the king is unjust, women are unjust, and all the sons of men and all their works are unjust—all such things. And there is no truth in them, and in their injustice they will perish.
translation:
  language: de
  text: Ungerecht ist der Wein, ungerecht ist der König, ungerecht sind die Frauen, ungerecht sind alle Söhne der Menschen[a] und ungerecht alle ihre Werke – all diese Dinge. In ihnen ist keine Wahrheit, und in ihrer Ungerechtigkeit werden sie zugrunde gehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »alle Menschen«. Wörtlich: »alle Söhne der Menschen«; die männlich formulierte Wendung bezeichnet hier die Menschheit insgesamt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄδικος / ἄδικοι / ἄδικα
  choice: ungerecht
  rationale: Die durchgängige Wiederholung erhält die rhetorische Wucht und bezeichnet fehlende Gerechtigkeit beziehungsweise rechte Ordnung, ohne den Begriff unnötig dogmatisch einzuengen.
- source_word: οἶνος
  choice: der Wein
  rationale: Direkte und natürliche Entsprechung; der Artikel folgt der bestimmten Formulierung im Griechischen.
- source_word: ὁ βασιλεύς
  choice: der König
  rationale: Der bestimmte Artikel wird wiedergegeben und passt zum konkreten Kontext der Rede.
- source_word: αἱ γυναῖκες
  choice: die Frauen
  rationale: Die gewöhnliche Bedeutung ist hier »Frauen«; »Ehefrauen« wird vom Kontext nicht verlangt.
- source_word: πάντες οἱ υἱοὶ τῶν ἀνθρώπων
  choice: alle Menschensöhne
  rationale: Bewahrt die ausdrücklich männlich formulierte, semitisch geprägte Wendung und lässt zugleich ihren allgemeinen Bezug auf die Menschheit erkennen.
- source_word: ἔργα
  choice: Werke
  rationale: Direkte Entsprechung, die sowohl Taten als auch hervorgebrachte Werke umfassen kann.
- source_word: πάντα τὰ τοιαῦτα
  choice: alles Derartige
  rationale: Gibt die verallgemeinernde Zusammenfassung der vorherigen Reihe knapp wieder, ohne ihren Bezug enger festzulegen.
- source_word: ἀλήθεια
  choice: Wahrheit
  rationale: Natürliche Entsprechung und sachlicher Gegenpol zur Ungerechtigkeit.
- source_word: ἐν τῇ ἀδικίᾳ αὐτῶν
  choice: durch ihre Ungerechtigkeit
  rationale: Das griechische ἐν kann hier instrumental beziehungsweise ursächlich verstanden werden; »durch« ergibt im Deutschen eine klare Aussage über den Grund ihres Untergangs.
- source_word: ἀπολοῦνται
  choice: werden sie zugrunde gehen
  rationale: Gibt das Futur medial/passiv wieder, ohne ausdrücklich einen äußeren Urheber der Vernichtung einzuführen.
theological_decisions:
- issue: Allgemein-menschliche Aussage in ausdrücklich männlicher Wendung
  choice: alle Menschensöhne
  alternative: alle Menschen
  rationale: Die Übersetzung erhält die Form des griechischen Ausdrucks, während eine Fußnote seine idiomatische Bedeutung für die gesamte Menschheit erläutert.
- issue: Wiederholte Charakterisierung mit ἄδικος
  choice: ungerecht
  alternative: frevlerisch / böse
  rationale: »Ungerecht« bewahrt den Leitbegriff und seine Spannung zum anschließenden Begriff »Wahrheit«, ohne eine enger konfessionelle oder dogmatische Deutung einzutragen.
- issue: Verhältnis von Ungerechtigkeit und Untergang
  choice: durch ihre Ungerechtigkeit werden sie zugrunde gehen
  alternative: in ihrer Ungerechtigkeit werden sie zugrunde gehen
  rationale: Die instrumentale beziehungsweise ursächliche Lesart von ἐν ist kontextuell gut möglich; die räumlich-zuständliche Alternative bleibt ebenfalls sprachlich vertretbar.
translation_notes:
  register: Moderne, würdige Standardsprache. Die anaphorische Wiederholung von »ungerecht« bleibt zur Wahrung des argumentativen und rhetorischen Aufbaus vollständig erhalten. »Menschensöhne« ist bewusst formal und wird durch die Fußnote erschlossen.
