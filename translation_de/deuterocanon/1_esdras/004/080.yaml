  yaml_path: translation/deuterocanon/1_esdras/004/080.yaml
  text: And when the young man went out, lifting up his face toward heaven, facing Jerusalem, he blessed the King of heaven, saying,
translation:
  language: de
  text: 'Als der junge Mann hinausging, erhob er sein Gesicht zum Himmel, Jerusalem zugewandt, und pries den König des Himmels mit den Worten:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ νεανίσκος
  choice: der junge Mann
  rationale: Natürliche, genaue Wiedergabe der Bezeichnung für einen jungen Mann.
- source_word: ἄρας τὸ πρόσωπον εἰς τὸν οὐρανόν
  choice: erhob er sein Gesicht zum Himmel
  rationale: Bewahrt das körperliche Bild des griechischen Textes und klingt zugleich verständlich und würdevoll.
- source_word: ἔναντιον Ἰερουσαλήμ
  choice: wandte sich Jerusalem zu
  rationale: Gibt die räumliche Ausrichtung auf Jerusalem idiomatisch wieder, ohne das missverständliche deutsche »gegenüber« zu verwenden.
- source_word: εὐλόγησεν
  choice: pries
  rationale: Im Zusammenhang einer an Gott gerichteten Äußerung bedeutet das Verb, Gott lobend zu preisen; »segnete« wäre im heutigen Deutsch leicht missverständlich.
- source_word: τῷ βασιλεῖ τοῦ οὐρανοῦ
  choice: den König des Himmels
  rationale: Formale und theologisch offene Wiedergabe des göttlichen Titels.
- source_word: λέγων
  choice: 'mit den Worten:'
  rationale: Leitet die folgende direkte Rede in natürlichem modernem Deutsch ein.
theological_decisions:
- issue: Bedeutung von εὐλογέω bei Gott als Objekt
  choice: pries
  alternative: segnete
  rationale: »Pries« bringt die hier gemeinte Lobpreisung Gottes klar zum Ausdruck, ohne die ungewöhnliche Vorstellung nahezulegen, der Mensch verleihe Gott einen Segen.
- issue: Ausrichtung nach Jerusalem
  choice: wandte sich Jerusalem zu
  alternative: Jerusalem gegenüber
  rationale: Die Übersetzung bewahrt die kultisch-räumliche Ausrichtung, ohne daraus eine über den Wortlaut hinausgehende theologische Aussage abzuleiten.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem, erzählerischem Ton. Die Satzstruktur bleibt nahe am griechischen Ablauf, wird jedoch durch finite Verben natürlich lesbar gemacht.
