  text: Then he said to the king[a], “Remember the vow that I made to rebuild Jerusalem on the day when you received your kingdom,”
translation:
  language: de
  text: 'Da sagte er zum König: „Erinnere dich an das Gelübde[a], das ich abgelegt habe, Jerusalem wieder aufzubauen, an dem Tag, als du dein Königreich übernahmst,“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Erinnere dich an das Gebet, in dem ich darum gebetet habe, Jerusalem wieder aufzubauen …“ Die griechischen Wörter εὐχή und ηὐξάμην können sich sowohl auf ein Gelübde als auch auf ein Gebet beziehen; hier spricht der Zusammenhang eher für eine gelobte Verpflichtung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μνήσθητι
  choice: Erinnere dich
  rationale: Der Aoristimperativ formuliert eine unmittelbare Aufforderung an den König; „Erinnere dich“ ist im Deutschen natürlich und wahrt den direkten Ton.
- source_word: εὐχήν / ηὐξάμην
  choice: das Gelübde, das ich abgelegt habe
  rationale: Das Wortpaar kann sowohl Gebet als auch Gelübde bezeichnen. Der Infinitiv „Jerusalem wieder aufzubauen“ beschreibt hier am ehesten den Inhalt einer feierlichen Selbstverpflichtung; die Gebetsdeutung bleibt in der Fußnote erhalten.
- source_word: οἰκοδομῆσαι
  choice: wieder aufzubauen
  rationale: Das Verb bedeutet grundsätzlich „bauen“. Da es um die Wiederherstellung des zerstörten Jerusalem geht, gibt „wieder aufbauen“ den kontextuellen Sinn natürlich wieder.
- source_word: παρέλαβες
  choice: übernahmst
  rationale: παραλαμβάνω bezeichnet hier das Empfangen beziehungsweise Antreten der königlichen Herrschaft. In Verbindung mit „dein Königreich“ ist „übernahmst“ idiomatisches modernes Deutsch, ohne eine gewaltsame Machtergreifung auszudrücken.
- source_word: τὸ βασίλειόν σου
  choice: dein Königreich
  rationale: βασίλειον kann das Königreich oder die Königsherrschaft meinen. „Dein Königreich“ bewahrt die konkrete Ausdrucksweise des Griechischen; das Verb „übernahmst“ lässt zugleich den Bezug auf den Herrschaftsantritt erkennen.
theological_decisions:
- issue: Bedeutung von εὐχή / ηὐξάμην
  choice: Eine vom Sprecher eingegangene feierliche Verpflichtung
  alternative: Ein vom Sprecher gesprochenes Gebet
  rationale: Die griechische Verbindung aus Substantiv und Verb lässt beide Bedeutungen zu. Weil als Inhalt eine konkrete Handlung genannt wird, steht im Haupttext „Gelübde“; die echte lexikalische Mehrdeutigkeit wird jedoch nicht aufgelöst, sondern in der Fußnote ausdrücklich bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit direkter Satzführung. Die Wiederholung „Gelübde … abgelegt“ ist idiomatisch und vermeidet das im Deutschen schwerfällige „Gelübde … gelobt“. Die zeitliche Wendung bleibt eng an der griechischen Formulierung.
