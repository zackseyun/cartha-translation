  source_fidelity: 'Die Übersetzung gibt die drei Erzählhandlungen und ihre Reihenfolge genau wieder: ἔλαβεν („nahm“), τὰς ἐπιστολάς („die Briefe“), ἐξῆλθεν εἰς Βαβυλῶνα („brach nach Babylon auf“) und ἀπήγγειλεν τοῖς ἀδελφοῖς αὐτοῦ πᾶσιν („berichtete allen seinen Brüdern“). Das im Griechischen nicht ausdrücklich gesetzte Berichtsobjekt wird nicht ergänzt.'
