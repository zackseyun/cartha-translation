  yaml_path: translation/deuterocanon/1_esdras/004/083.yaml
  text: And he took the letters and went out to Babylon and reported to all his brothers[a].
translation:
  language: de
  text: Und er nahm die Briefe, brach nach Babylon auf und berichtete allen seinen Brüdern.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich steht kein Gegenstand des Berichtens dabei; was er berichtete, ergibt sich aus dem Zusammenhang.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλαβεν
  choice: nahm
  rationale: Der Aorist von λαμβάνω wird im schlichten Erzählstil direkt mit „nahm“ wiedergegeben; „empfing“ wäre möglich, ist hier aber nicht durch den Wortlaut erzwungen.
- source_word: τὰς ἐπιστολάς
  choice: die Briefe
  rationale: ἐπιστολή bezeichnet gewöhnlich einen Brief; der Plural und der bestimmte Artikel werden unmittelbar wiedergegeben.
- source_word: ἐξῆλθεν εἰς Βαβυλῶνα
  choice: brach nach Babylon auf
  rationale: Die idiomatische deutsche Wendung bewahrt sowohl den Gedanken des Aufbruchs in ἐξῆλθεν als auch das Ziel εἰς Βαβυλῶνα, ohne das unnatürliche „ging hinaus nach Babylon“.
- source_word: ἀπήγγειλεν
  choice: berichtete
  rationale: ἀπαγγέλλω bedeutet „berichten, melden, verkünden“. Da im Griechischen kein direktes Objekt steht, wird auch im Haupttext keines ergänzt.
- source_word: τοῖς ἀδελφοῖς αὐτοῦ πᾶσιν
  choice: allen seinen Brüdern
  rationale: Die Wiedergabe folgt der grammatischen Form und Grundbedeutung von ἀδελφοί. Eine Deutung als Verwandte, Volksgenossen oder Glaubensbrüder wird nicht in den Haupttext eingetragen.
theological_decisions:
- issue: Bezugsgruppe von ἀδελφοῖς
  choice: Brüdern
  alternative: Volksgenossen / Verwandten
  rationale: Der griechische Ausdruck bleibt hinsichtlich der genaueren sozialen oder ethnischen Beziehung offen; die wörtliche familiäre Bezeichnung bewahrt diese Offenheit.
- issue: Nicht genanntes Objekt von ἀπήγγειλεν
  choice: kein Objekt ergänzt
  alternative: „berichtete es“
  rationale: Der Zusammenhang legt einen Inhalt des Berichts nahe, doch der griechische Satz nennt ihn nicht ausdrücklich. Die Übersetzung wahrt diese syntaktische Offenheit.
translation_notes:
  register: Moderner, würdiger Erzählstil. „Brach nach Babylon auf“ ist natürliches Standarddeutsch und bildet den ausdrücklich bezeichneten Aufbruch ab. Die Satzreihung folgt der knappen griechischen Erzählfolge.
