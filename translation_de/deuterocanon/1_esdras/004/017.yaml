lexical_decisions:
- source_word: Ἄνδρες
  choice: Ihr Männer
  rationale: Der Vokativ Plural ist eine ausdrücklich männliche direkte Anrede; „Ihr Männer“ gibt sie im modernen Deutschen klar und mit rhetorischer Kraft wieder.
- source_word: πῶς ὑπερισχύει
  choice: wie mächtig ist doch
  rationale: πῶς bezeichnet hier in einem Ausruf den Grad, während ὑπερισχύει überlegene Stärke oder Macht ausdrückt. Die Partikel „doch“ trägt zur natürlichen deutschen Ausrufewirkung bei, ohne ein nicht genanntes Objekt des Überwältigens einzuführen.
- source_word: ὁ οἶνος
  choice: der Wein
  rationale: Direkte und idiomatische Entsprechung.
- source_word: πάντας τοὺς ἀνθρώπους
  choice: aller Menschen
  rationale: ἄνθρωπος kann hier allgemein Menschen bezeichnen. Anders als die ausdrückliche Anrede Ἄνδρες muss die maskuline grammatische Form in diesem Satzteil nicht auf Männer beschränkt werden.
- source_word: τοὺς πίοντας αὐτόν
  choice: die ihn trinken
  rationale: Das substantivierte Präsenspartizip beschreibt allgemein diejenigen, die Wein trinken; der Relativsatz ist im Deutschen natürlich und bewahrt diesen generellen Sinn.
- source_word: πλανᾷ τὴν διάνοιαν
  choice: führt den Verstand … in die Irre
  rationale: Die Formulierung bewahrt die Bildlichkeit von πλανάω („irreführen“) und gibt διάνοια als Denk- und Urteilsvermögen mit „Verstand“ wieder.
