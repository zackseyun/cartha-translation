lexical_decisions:
- source_word: Μνήσθητι
  choice: Denk an
  rationale: Der Aoristimperativ formuliert eine unmittelbare Aufforderung. »Denk an« ist im modernen Deutschen natürlich und gibt den Sinn von »sich erinnern« im Blick auf eine bestehende Verpflichtung wieder.
- source_word: εὐχὴν ἣν ηὔξω
  choice: das Gelübde, das du abgelegt hast
  rationale: Das Substantiv εὐχή kann »Gebet« oder »Gelübde« bedeuten. In Verbindung mit dem stammverwandten Verb ηὔξω und der königlichen Verpflichtung bezeichnet es hier am wahrscheinlichsten ein Gelübde. Die deutsche Wendung »ein Gelübde ablegen« gibt die griechische Substantiv-Verb-Verbindung idiomatisch wieder.
- source_word: οἰκοδομῆσαι
  choice: wieder aufzubauen
  rationale: Das Verb bedeutet grundsätzlich »bauen«. Da Jerusalem zuvor bestanden hatte und nach seiner Zerstörung wiederhergestellt werden sollte, macht »wieder aufbauen« den kontextuellen Sinn deutlich.
- source_word: τὴν Ἰερουσαλήμ
  choice: Jerusalem
  rationale: Die im Deutschen übliche Form des Ortsnamens.
- source_word: ἐν τῇ ἡμέρᾳ ᾗ
  choice: an dem Tag, als
  rationale: Die Wendung bewahrt die ausdrückliche Zeitangabe des Griechischen und klingt in modernem Deutsch natürlich.
- source_word: τὸ βασίλειόν σου παρέλαβες
  choice: du dein Königreich übernahmst
  rationale: παραλαμβάνω bezeichnet hier das Antreten beziehungsweise Übernehmen der Königsherrschaft. »Dein Königreich übernahmst« ist klarer und idiomatischer als die wörtliche Form »dein Königreich empfingst«.
theological_decisions:
- issue: Bedeutung von εὐχή im königlichen Zusammenhang
  choice: Gelübde
  alternative: Gebet
  rationale: Das stammverwandte Verb ηὔξω und der Kontext einer früher eingegangenen königlichen Verpflichtung sprechen für »Gelübde«. Da εὐχή jedoch auch »Gebet« bedeuten kann, wird diese echte lexikalische Möglichkeit in einer Fußnote bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Anrede ist klar und eindringlich; unnötig altertümliche Wendungen werden vermieden. Die Wiederholung des griechischen Wortstamms wird mit der idiomatischen deutschen Verbindung »ein Gelübde ablegen« wiedergegeben.
