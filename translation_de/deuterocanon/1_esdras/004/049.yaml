    rationale: Die Formulierung ist im Deutschen semantisch schief, da sie Maßnahmen gegen Türen nahelegt. Das Griechische spricht bildhaft vom Herankommen an ihre Türen; eine behutsamere wörtliche Wiedergabe vermeidet diese Fehlassoziation.
