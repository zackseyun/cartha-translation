  verdict: revise
  source_fidelity: Der Satzbau, die Adressaten, die Aufzählung von Amtsträgern und die Verneinung werden im Wesentlichen zutreffend wiedergegeben. Das Possessivpronomen in „ihrer Freiheit“ ist jedoch im Griechischen nicht ausgedrückt, und „wegen“ bezeichnet im Deutschen eher einen Grund als den Gegenstand des Schreibens. Die schwierige Wendung mit den Türen sollte weder überdeutet noch mit „vorgehen gegen ihre Türen“ in eine im Deutschen missverständliche Handlung gegen Gegenstände verwandelt werden.
  naturalness: „Gegen ihre Türen vorgehen“ ist im modernen Standarddeutsch unnatürlich und legt nahe, die Türen selbst seien Gegenstand einer Maßnahme. „Nicht an ihre Türen herantreten“ bewahrt das konkrete Bild und ist als behördliches oder bedrängendes Erscheinen verständlich.
  terminology: „Satrap“, „Toparch“ und „Verwalter“ sind angemessen. „Machthaber“ ist für πάντα δυνατὸν als vorsichtige Haupttextlösung möglich; die Fußnote wahrt die lexikalische Unsicherheit.
