revisions:
- from: Und er schrieb allen Juden, die aus dem Königreich nach Judäa hinaufzogen, wegen ihrer Freiheit, dass kein Machthaber[a], Satrap, Toparch[b] oder Verwalter gegen ihre Türen vorgehen dürfe.[c]
