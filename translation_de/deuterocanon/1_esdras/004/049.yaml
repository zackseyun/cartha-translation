base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/004/049.yaml
  text: And he wrote to all the Jews who were going up from the kingdom to Judea concerning freedom[a], that no official or satrap or toparch or steward should come to their doors[c][b],
translation:
  language: de
  text: Und er schrieb allen Juden, die aus dem Königreich nach Judäa hinaufzogen, hinsichtlich der Freiheit, dass kein Machthaber[a], Satrap, Toparch[b] oder Verwalter an ihre Türen herantreten dürfe.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „keine Amtsperson“ beziehungsweise „kein Mächtiger“. Die griechische Wendung πάντα δυνατὸν ist schwierig und kann allgemein jeden bezeichnen, der Macht oder Amtsgewalt besitzt.
    reason: lexical_alternative
  - marker: b
    text: Ein „Toparch“ war der Herrscher oder Vorsteher eines örtlichen Bezirks; auch „Bezirksvorsteher“ oder „örtlicher Statthalter“.
    reason: cultural_note
  - marker: c
    text: Die Wendung „an ihre Türen herantreten“ meint wahrscheinlich, dass man sie zu Hause nicht bedrängen, bei ihnen nicht eindringen oder dort keine Ansprüche gegen sie erheben durfte.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔγραψεν
  choice: er schrieb
  rationale: Gibt das einfache griechische Verb unmittelbar wieder, ohne den amtlichen Charakter als „Erlass“ ausdrücklich in den Text einzutragen.
- source_word: τοῖς ἀναβαίνουσιν
  choice: die … hinaufzogen
  rationale: Bewahrt das konkrete „Hinaufziehen“, das neben der geografischen Bewegung nach Judäa auch den traditionellen Sprachgebrauch einer Reise dorthin anklingen lässt.
- source_word: ἀπὸ τῆς βασιλείας
  choice: aus dem Königreich
  rationale: Entspricht βασιλεία direkt; „Reich“ oder „Imperium“ wären möglich, aber weniger eng am Wortlaut.
- source_word: ὑπὲρ τῆς ἐλευθερίας
  choice: wegen ihrer Freiheit
  rationale: Gibt den Gegenstand beziehungsweise Zweck des Schreibens knapp wieder. Das ergänzte Possessivpronomen macht im Deutschen deutlich, dass es um die Freiheit der hinaufziehenden Juden geht.
- source_word: πάντα δυνατὸν
  choice: kein Machthaber
  rationale: Die schwierige Wendung bezeichnet im administrativen Zusammenhang wahrscheinlich jeden, der Macht oder Amtsgewalt besitzt. Mit der folgenden Verneinung ist „kein Machthaber“ im Deutschen natürlicher als „jeder Machthaber solle nicht“.
- source_word: σατράπην
  choice: Satrap
  rationale: Bewahrt den spezifischen persischen Amtstitel.
- source_word: τοπάρχην
  choice: Toparch
  rationale: Bewahrt die technische Bezeichnung für den Herrscher beziehungsweise Vorsteher eines örtlichen Bezirks; die Bedeutung wird in der Fußnote erklärt.
- source_word: οἰκονόμον
  choice: Verwalter
  rationale: Ist im amtlichen Zusammenhang eine natürliche Wiedergabe für einen mit Verwaltung oder Haushaltsführung betrauten οἰκονόμος.
- source_word: μὴ ἐπελεύσεσθαι ἐπὶ τὰς θύρας αὐτῶν
  choice: gegen ihre Türen vorgehen dürfe
  rationale: Bewahrt sowohl das Bild der Türen als auch den möglicherweise feindlichen oder bedrängenden Sinn von ἐπέρχομαι mit ἐπί, ohne die konkrete Art des Vorgehens festzulegen.
