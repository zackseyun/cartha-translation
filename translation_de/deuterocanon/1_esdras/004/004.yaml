  language: de
  text: 'Da sagten die drei jungen Männer, die Leibwächter, die über die Person des Königs wachten[a], zueinander:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die den Leib des Königs bewachten“. Das Griechische wiederholt hier die Wortgruppe „Leib“ in „Leibwächter“ und „Leib des Königs“; gemeint ist der Schutz der königlichen Person.'
