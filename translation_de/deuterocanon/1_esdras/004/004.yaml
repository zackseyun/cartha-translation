lexical_decisions:
- source_word: τότε
  choice: Da
  rationale: Gibt den zeitlich-fortführenden Erzählanschluss knapp und natürlich wieder.
- source_word: οἱ τρεῖς νεανίσκοι
  choice: die drei jungen Männer
  rationale: Bewahrt die Altersbezeichnung, ohne das heute leicht missverständliche „Jünglinge“ zu verwenden.
- source_word: οἱ σωματοφύλακες
  choice: die Leibwächter
  rationale: Direkte und idiomatische deutsche Entsprechung für die zum persönlichen Schutz eingesetzten Wächter.
- source_word: οἱ φυλάσσοντες τὸ σῶμα τοῦ βασιλέως
  choice: die den König persönlich bewachten
  rationale: Gibt die fortdauernde Schutzfunktion wieder und versteht „Leib des Königs“ im höfischen Zusammenhang als die Person des Königs selbst.
- source_word: εἶπαν ἕτερος πρὸς τὸν ἕτερον
  choice: sagten ... zueinander
  rationale: Natürliche deutsche Wiedergabe der reziproken griechischen Wendung.
