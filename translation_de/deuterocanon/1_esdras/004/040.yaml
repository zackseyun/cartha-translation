base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/004/040.yaml
  text: And in her judgment there is nothing unjust[a]. And hers is the strength and the kingdom and the authority and the majesty of all the ages. Blessed be the God of truth.
translation:
  language: de
  text: Und in ihrem Urteil ist nichts ungerecht. Ihr gehören die Kraft, das Königtum, die Vollmacht und die Majestät aller Zeitalter.[a] Gepriesen sei der Gott der Wahrheit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder sinngemäß: „für immer und ewig“; wörtlich: „aller Zeitalter“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κρίσις
  choice: Urteil
  rationale: „Urteil“ bewahrt hier den forensischen Sinn des Richtens beziehungsweise der richterlichen Beurteilung und passt zur Aussage, darin sei nichts ungerecht.
- source_word: ἄδικον
  choice: ungerecht
  rationale: Das Adjektiv bezeichnet etwas, das dem Recht oder der Gerechtigkeit widerspricht; „ungerecht“ greift den gerichtlichen Zusammenhang unmittelbar auf.
- source_word: ἰσχύς
  choice: Kraft
  rationale: „Kraft“ gibt die wirksame Stärke des griechischen Ausdrucks knapp wieder und bleibt von ἐξουσία („Vollmacht“) unterscheidbar.
- source_word: βασίλειον
  choice: Königtum
  rationale: „Königtum“ bezeichnet königliche Herrschaft und vermeidet, den Ausdruck ausschließlich als räumliches „Königreich“ zu verstehen.
- source_word: ἐξουσία
  choice: Vollmacht
  rationale: „Vollmacht“ bringt rechtmäßige Befugnis und Herrschaftsgewalt zum Ausdruck und unterscheidet sich semantisch von ἰσχύς („Kraft“).
- source_word: μεγαλειότης
  choice: Majestät
  rationale: Im feierlichen Lobpreis bezeichnet „Majestät“ die erhabene Größe am natürlichsten.
- source_word: τῶν πάντων αἰώνων
  choice: aller Zeitalter
  rationale: Die Formulierung bildet den griechischen Genitiv transparent ab und bewahrt dessen Bild von sämtlichen Weltzeiten; idiomatisch ist damit ewige Dauer gemeint.
- source_word: εὐλογητός
  choice: Gepriesen sei
  rationale: „Gepriesen sei“ ist im heutigen Deutschen eine natürliche doxologische Ausrufform und gibt den Charakter des Lobpreises besser wieder als eine bloße Feststellung.
- source_word: ὁ θεὸς τῆς ἀληθείας
  choice: der Gott der Wahrheit
  rationale: Die Genitivverbindung wird unmittelbar wiedergegeben und bezeichnet Gott als den Gott, der durch Wahrheit gekennzeichnet ist, ohne sie zur abweichenden Aussage „der wahre Gott“ umzuformen.
theological_decisions:
- issue: Bezugswort der femininen Pronomen αὐτῆς und αὕτη
  choice: Die Pronomen werden auf die im unmittelbaren Zusammenhang personifizierte Wahrheit bezogen; im Deutschen erscheint dies durch „ihrem“ und „ihr“ ebenfalls feminin.
  alternative: Die Personifikation könnte durch die wiederholte Nennung von „Wahrheit“ abgeschwächt oder vermieden werden.
  rationale: Der griechische Text führt das personifizierende Lob der Wahrheit fort. Die feminine pronominale Bezugnahme sollte deshalb nicht in eine rein abstrakte Aussage eingeebnet werden.
- issue: Nominalfügung αὕτη ἡ ἰσχὺς καὶ τὸ βασίλειον ... ohne ausdrückliche Kopula
  choice: „Ihr gehören die Kraft ...“ gibt die im Kontext naheliegende Zugehörigkeitsaussage idiomatisch wieder.
  alternative: Wörtlicher wäre etwa „Und diese ist die Kraft und das Königtum ...“, was im Deutschen jedoch unklar und schwer verständlich wäre.
  rationale: Die gewählte Form bewahrt die Wahrheit als Bezugsgröße und den doxologischen Sinn, ohne die mehrdeutige griechische Nominalkonstruktion unnötig dogmatisch auszubauen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem doxologischem Ton. Die Personifikation der Wahrheit bleibt sichtbar. Der Fußnotenmarker steht bei der Wendung, die er tatsächlich erläutert.
