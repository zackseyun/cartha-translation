  text: and on the altar they should offer burnt offerings every day[a], as they have the command to offer seventeen, and another ten talents yearly.
translation:
  language: de
  text: und auf dem Altar täglich Brandopfer darzubringen[a], wie es ihnen geboten ist, siebzehn darzubringen, und weitere zehn Talente jährlich.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der griechische Wortlaut dieses Verses ist schwierig und scheint an mehreren Stellen textlich verkürzt zu sein, besonders beim hier mit »darzubringen« wiedergegebenen Verb und bei der Aussage über die »zehn Talente jährlich«. Die Übersetzung folgt dem erkennbaren Hauptsinn des überlieferten Textes, ohne für jedes Einzelproblem Gewissheit zu beanspruchen.
    reason: textual_variant
lexical_decisions:
- source_word: θυσιαστήριον
  choice: Altar
  rationale: Der übliche kultische Begriff für den Opferaltar; »Altar« ist im Deutschen die natürliche und präzise Entsprechung.
- source_word: ὁλοκαυτώματα
  choice: Brandopfer
  rationale: Eingebürgerte deutsche Bezeichnung für Opfer, die vollständig verbrannt werden.
- source_word: καρποῦσθαι
  choice: darzubringen
  rationale: Das überlieferte Verb ist in diesem Zusammenhang ungewöhnlich. Der Opferkontext legt sinngemäß »darbringen« nahe, ohne die unsichere Formulierung unnötig auszudeuten.
- source_word: καθʼ ἡμέραν
  choice: täglich
  rationale: Gibt die distributive zeitliche Angabe knapp und natürlich wieder.
- source_word: ἐντολήν
  choice: geboten ist
  rationale: Bewahrt die verpflichtende Kraft der autoritativen Anweisung in idiomatischem Deutsch.
- source_word: ἑπτὰ καὶ δέκα
  choice: siebzehn
  rationale: Natürliche deutsche Wiedergabe der griechischen Zahlform »sieben und zehn«.
- source_word: προσφέρειν
  choice: darzubringen
  rationale: Das Verb bezeichnet das Herbeibringen beziehungsweise Darbringen von Opfergaben oder Abgaben; die Wiederholung bleibt erhalten, weil auch der griechische Satz an dieser Stelle wieder Opferterminologie verwendet.
- source_word: ἄλλα τάλαντα, δέκα κατʼ ἐνιαυτόν
  choice: und weitere zehn Talente jährlich
  rationale: Gibt den additiven Sinn von ἄλλα direkt wieder, ohne die aufgrund des komprimierten griechischen Wortlauts unklare Beziehung der jährlichen Talente näher festzulegen.
