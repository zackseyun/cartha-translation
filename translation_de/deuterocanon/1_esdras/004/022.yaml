  yaml_path: translation/deuterocanon/1_esdras/004/022.yaml
  text: And when they rise from the wine[a], they do not remember what they did.
translation:
  language: de
  text: Und wenn sie vom Wein[a] erwachen, erinnern sie sich nicht daran, was sie getan haben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „wenn sie vom Wein erwachen/sich erheben“. Gemeint sein kann das Erwachen nach der Wirkung des Weins.'
    reason: Die Fußnote erläutert die ungewöhnliche griechische Verbindung, ohne die Bedeutung auf „Weinrausch“ festzulegen.
lexical_decisions:
- source_word: ὅταν
  choice: wenn
  rationale: Leitet einen allgemeinen temporalen Nebensatz ein; „wenn“ ist im Deutschen natürlich und kann hier auch den wiederholbaren Fall ausdrücken.
- source_word: ἀπὸ τοῦ οἴνου
  choice: aus dem Weinrausch
  rationale: Die griechische Wendung lautet wörtlich „vom Wein“, bezeichnet im Zusammenhang aber das Erwachen beziehungsweise Sich-Erheben nach der Wirkung des Weins. „Aus dem Weinrausch“ gibt diesen Sinn verständlich wieder, ohne den Bezug zum Wein zu verlieren.
- source_word: ἐγερθῶσιν
  choice: erwachen
  rationale: Das Verb kann „aufstehen“, „sich erheben“ oder „erwachen“ bedeuten. Im Zusammenhang mit dem anschließenden Erinnerungsausfall ist „erwachen“ die natürlichste deutsche Wiedergabe.
- source_word: οὐ μέμνηται
  choice: erinnern sie sich nicht
  rationale: Obwohl die überlieferte Verbform Singular ist, verlangt das vorangehende pluralische Subjekt im Deutschen den Plural. Der Sinn ist kollektiv beziehungsweise distributiv.
- source_word: ἃ ἔπραξαν
  choice: was sie getan haben
  rationale: Gibt den Relativsatz idiomatisch wieder; das Perfekt bezeichnet aus Sicht des späteren Erwachens die zuvor vollzogenen Handlungen.
