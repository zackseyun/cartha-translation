  text: and you vowed to rebuild the temple which the Judeans burned when Judea was laid waste by the Chaldeans[a].
translation:
  language: de
  text: Und du hast gelobt, den Tempel wieder aufzubauen, den die Judäer in Brand gesteckt hatten, als Judäa von den Chaldäern verwüstet wurde.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Griechisch: „den die Judäer in Brand gesteckt hatten“. Aufgrund paralleler historischer Überlieferungen könnte man hier „den die Chaldäer/Babylonier in Brand gesteckt hatten“ erwarten; der vorliegende griechische Text nennt jedoch ausdrücklich die Judäer.'
    reason: alternative_reading
lexical_decisions:
- source_word: εὔξω
  choice: du hast gelobt
  rationale: Die Form von εὔχομαι bezeichnet hier am ehesten ein feierliches Gelübde beziehungsweise eine verbindliche Zusage; „hast gelobt“ bewahrt diesen feierlichen Sinn.
- source_word: οἰκοδομῆσαι
  choice: wieder aufzubauen
  rationale: Das Verb bedeutet wörtlich „bauen“; da der betreffende Tempel verbrannt worden war, gibt „wieder aufbauen“ den kontextuellen Sinn natürlich wieder.
- source_word: τὸν ναὸν
  choice: den Tempel
  rationale: ναός bezeichnet hier das Tempelgebäude in Jerusalem; „Tempel“ ist die klare und übliche deutsche Entsprechung.
- source_word: ἐνεπύρισαν
  choice: in Brand gesteckt hatten
  rationale: Das Verb bezeichnet das Inbrandsetzen oder Verbrennen. Die Formulierung ist präzise, ohne eine vollständige Zerstörung ausdrücklich zu behaupten.
- source_word: οἱ Ἰουδαῖοι
  choice: die Judäer
  rationale: In diesem historischen Zusammenhang bezeichnet Ἰουδαῖοι die Menschen aus Juda beziehungsweise Judäa; „Judäer“ erhält diese ethnogeografische Nuance.
- source_word: ἐρημώθη
  choice: verwüstet wurde
  rationale: Das Passiv drückt aus, dass das Land verödet beziehungsweise verwüstet wurde; „verwüstet wurde“ ist gegenwärtiges, würdevolles Standarddeutsch.
- source_word: ὑπὸ τῶν Χαλδαίων
  choice: von den Chaldäern
  rationale: Der griechische Text nennt ausdrücklich die Chaldäer. Diese historische Bezeichnung wird beibehalten, statt sie deutend durch „Babylonier“ zu ersetzen.
theological_decisions:
- issue: Historische Zuschreibung der Verbrennung des Tempels
  choice: Die Judäer bleiben entsprechend dem vorliegenden griechischen Text das Subjekt von „in Brand gesteckt hatten“.
  alternative: Passivisch „der in Brand gesteckt worden war“ übersetzen oder die Tat aufgrund paralleler historischer Überlieferungen den Chaldäern beziehungsweise Babyloniern zuschreiben.
  rationale: Der griechische Ausgangstext nennt ausdrücklich οἱ Ἰουδαῖοι als Subjekt von ἐνεπύρισαν. Die historische Spannung darf nicht stillschweigend beseitigt werden; eine Fußnote macht sie transparent.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt eng am Griechischen, während „wieder aufbauen“ und „verwüstet wurde“ natürliches Deutsch gewährleisten. Die auffällige historische Zuschreibung wird im Haupttext bewahrt und in der Fußnote erläutert.
