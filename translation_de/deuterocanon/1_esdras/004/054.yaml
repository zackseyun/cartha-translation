translation:
  language: de
  text: Er schrieb auch über die Versorgung und das priesterliche Gewand, in dem sie ihren Dienst verrichten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Wortlaut ist hier auffällig: wörtlich etwa „die Versorgung und das priesterliche Gewand, worin sie darin Dienst verrichten“. Sowohl die Wendung „worin“ als auch das anschließende feminine Pronomen sind ungewöhnlich. Das Pronomen bezieht sich wahrscheinlich auf das Gewand; die Formulierung kann jedoch verkürzt oder textlich unsicher sein.'
    reason: textual_variant
lexical_decisions:
- source_word: ἔγραψεν
  choice: Er schrieb
  rationale: Der Aorist von γράφω bezeichnet schlicht das Schreiben; der Zusammenhang kann eine schriftliche Anordnung nahelegen, doch dies wird im Verb selbst nicht ausdrücklich gesagt.
- source_word: χορηγίαν
  choice: die Versorgung
  rationale: χορηγία bezeichnet eine für einen Zweck bereitgestellte Versorgung oder Unterstützung; die offene Formulierung vermeidet eine unbelegte Festlegung auf Geld, Rationen oder ein festes Entgelt.
- source_word: ἱερατικὴν στολήν
  choice: das priesterliche Gewand
  rationale: στολή bezeichnet ein Gewand oder eine Robe. „Gewand“ ist im modernen Deutschen natürlich und bewahrt den Singular sowie den kultischen Zusammenhang.
- source_word: ἐν τίνι
  choice: in dem
  rationale: Die Wendung bezieht sich wahrscheinlich auf das priesterliche Gewand. Die lokale Bedeutung von ἐν bleibt erhalten, ohne sie zu „mit dem“ umzudeuten.
- source_word: λατρεύουσιν
  choice: sie ihren Dienst verrichten
  rationale: λατρεύω bezeichnet hier angesichts des priesterlichen Gewandes den kultischen Dienst. „Ihren Dienst verrichten“ ist verständlich und enger als das allgemeinere „dienen“.
- source_word: ἐν αὐτῇ
  choice: darin
  rationale: Das feminine Pronomen verweist am ehesten auf στολή. „Darin“ erhält die im Griechischen auffällige Wiederholung, ohne den Bezug stillschweigend zu beseitigen.
theological_decisions:
- issue: Kultischer Sinn von λατρεύουσιν
  choice: „ihren Dienst verrichten“
  alternative: „Gottesdienst halten“ oder „dienen“
  rationale: Der Zusammenhang handelt von priesterlicher Kleidung und Tempeldienst. Die gewählte Formulierung gibt den kultischen Sinn wieder, ohne die Tätigkeit genauer zu bestimmen, als es der Text erlaubt.
- issue: Bezug und Doppelung von ἐν τίνι … ἐν αὐτῇ
  choice: Die auffällige Formulierung „in dem sie darin“ wird bewahrt und erläutert.
  alternative: Glättung zu „in dem sie ihren Dienst verrichten“
  rationale: Der griechische Wortlaut ist redundant oder möglicherweise textlich gestört. Eine vollständige Glättung würde diese echte Unsicherheit verdecken.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnliche Doppelung „in dem … darin“ ist bewusst beibehalten, da sie die Schwierigkeit des griechischen Textes sichtbar macht; die Fußnote erklärt sie.
