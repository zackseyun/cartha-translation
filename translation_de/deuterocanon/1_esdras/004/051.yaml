  text: and for the building of the temple[b][a], that twenty talents be given each year until it is built.
translation:
  language: de
  text: und dass für den Bau des Tempels jedes Jahr zwanzig Talente[a] gegeben werden, bis der Tempel gebaut ist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ein Talent war eine große antike Gewichtseinheit, die besonders bei Edelmetallen auch zur Berechnung von Geldwerten diente.
    reason: cultural_note
lexical_decisions:
- source_word: οἰκοδομήν
  choice: Bau
  rationale: Das Substantiv bezeichnet hier den Bauvorgang beziehungsweise das Bauvorhaben; „für den Bau des Tempels“ ist im Deutschen präzise und idiomatisch.
- source_word: ἱεροῦ
  choice: Tempels
  rationale: ἱερόν bezeichnet in diesem Wiederaufbaukontext den Tempel beziehungsweise den heiligen Tempelbezirk; „Tempel“ ist die klare, geläufige Wiedergabe.
- source_word: δοθῆναι
  choice: gegeben werden
  rationale: Der passive Aoristinfinitiv bezeichnet die Bereitstellung der Mittel, ohne die genaue Zahlungsweise festzulegen; die allgemeine Wiedergabe wahrt dies.
- source_word: κατʼ ἐνιαυτόν
  choice: jedes Jahr
  rationale: Die Wendung bezeichnet eine jährlich wiederkehrende Leistung; „jedes Jahr“ ist modernes, allgemein verständliches Deutsch.
- source_word: τάλαντα εἴκοσι
  choice: zwanzig Talente
  rationale: τάλαντον ist eine antike Gewichts- und daraus abgeleitete Recheneinheit. Die traditionelle Bezeichnung „Talent“ bleibt erhalten und wird in einer Fußnote erklärt.
- source_word: μέχρι τοῦ οἰκοδομηθῆναι
  choice: bis er fertig gebaut ist
  rationale: Die Konstruktion bezeichnet die Dauer bis zum Abschluss des Bauens. Das Pronomen „er“ bezieht sich natürlich auf den Tempel; „fertig“ macht den im Kontext gemeinten Abschluss deutlich.
