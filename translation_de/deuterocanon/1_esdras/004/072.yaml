lexical_decisions:
- source_word: χώραν
  choice: Gebiet
  rationale: Der Ausdruck bezeichnet hier ein räumlich bestimmtes Landgebiet. „Gebiet“ passt zum rechtlich-administrativen Zusammenhang, ohne eine bestimmte politische Einheit vorauszusetzen.
- source_word: κρατήσουσιν
  choice: in Besitz nehmen werden
  rationale: Der Futur von κρατέω bezeichnet hier das Erlangen beziehungsweise Ausüben tatsächlicher Verfügungsgewalt. Die Wiedergabe erhält sowohl den Zukunftsbezug als auch den Besitzaspekt.
- source_word: ἀφορολόγητον
  choice: abgabenfrei
  rationale: Das Adjektiv bezeichnet die Befreiung von Steuern oder Tributen. „Abgabenfrei“ ist im Kontext eines königlichen Erlasses präzise und verständlich.
- source_word: ὑπάρχειν
  choice: sein soll
  rationale: Im Gefüge der Erlassbestimmungen bezeichnet der Infinitiv den rechtlich festgelegten Status des Gebiets. „sein soll“ gibt diese normative Kraft idiomatisch wieder.
- source_word: Χαλδαῖοι
  choice: Chaldäer
  rationale: Die Übersetzung bewahrt die ausdrückliche Volksbezeichnung des griechischen Textes, statt sie historisierend durch „Babylonier“ zu ersetzen.
- source_word: ἀφίουσι
  choice: freigeben sollen
  rationale: ἀφίημι meint hier, die beanspruchten Dörfer aus der eigenen Gewalt zu entlassen beziehungsweise den Besitz daran aufzugeben. „freigeben“ bringt dies deutlicher zum Ausdruck als bloßes „verlassen“.
- source_word: κώμας
  choice: Dörfer
  rationale: κώμη bezeichnet gewöhnlich ein Dorf oder eine kleinere ländliche Siedlung; „Dörfer“ ist die klare Standardentsprechung.
- source_word: διακρατοῦσιν
  choice: besetzt halten
  rationale: Das Verb bezeichnet ein anhaltendes Festhalten oder Beherrschen. „besetzt halten“ macht die fortdauernde tatsächliche Kontrolle über die Dörfer deutlich.
theological_decisions:
- issue: Rechtlich-administrative Aussagekraft der Infinitivkonstruktionen im Zusammenhang eines königlichen Erlasses
  choice: Wiedergabe durch deutsche Soll-Sätze („abgabenfrei sein soll“, „freigeben sollen“)
  alternative: Wörtlichere Infinitivkonstruktionen wie „abgabenfrei zu sein“ und „freizugeben“
  rationale: Die Bestimmungen sind Teil eines Erlasses. Die Soll-Form wahrt ihren verbindlichen Charakter und ergibt zugleich natürliches modernes Deutsch, ohne den Inhalt über den griechischen Text hinaus festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit rechtlich-administrativer Färbung. Die Satzstruktur schließt als fortlaufende Bestimmung mit „und dass“ an den vorausgehenden Kontext an.
