  text: And he wrote that support should be given to the Levites until the day when the house would be completed and Jerusalem built[a][b][c][d].
translation:
  language: de
  text: Und er ordnete schriftlich an, den Leviten Unterhalt zu gewähren, bis zu dem Tag, an dem das Haus vollendet und Jerusalem gebaut werden sollte.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit dem „Haus“ ist der Tempel gemeint.
    reason: cross_reference
  - marker: b
    text: 'Oder: „Versorgung“, „Unterstützung“ beziehungsweise „Zuwendung“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder dem Zusammenhang entsprechend: „Jerusalem wiederaufgebaut“. Der griechische Text sagt wörtlich „gebaut“. Die Formulierung nach „bis zu dem Tag“ ist in der Überlieferung etwas ungewöhnlich; gemeint ist offenbar, dass der Unterhalt bis zur Vollendung des Tempels und zum Bau Jerusalems gewährt werden sollte.'
    reason: textual_variant
lexical_decisions:
- source_word: ἔγραψεν
  choice: er ordnete schriftlich an
  rationale: Das Verb bezeichnet hier eine schriftlich erlassene Anordnung. Diese Wiedergabe macht die Funktion des Schreibens deutlich, ohne einen im Griechischen nicht genannten Adressaten einzuführen.
- source_word: δοῦναι
  choice: zu gewähren
  rationale: Der Infinitiv hängt von ἔγραψεν ab und bezeichnet den angeordneten Vorgang; die deutsche Infinitivkonstruktion gibt dies natürlich wieder.
- source_word: τὴν χορηγίαν
  choice: Unterhalt
  rationale: χορηγία bezeichnet eine bereitgestellte materielle Versorgung oder Unterstützung. „Unterhalt“ passt besonders zu einer fortlaufenden Versorgung der Leviten.
- source_word: τοῖς Λευείταις
  choice: den Leviten
  rationale: Der Dativ bezeichnet die Empfänger der Versorgung.
- source_word: ἕως τῆς ἡμέρας
  choice: bis zu dem Tag
  rationale: Die Formulierung bewahrt die zeitliche Grenzangabe des griechischen Textes.
- source_word: ᾖ ἐπιτελεσθῇ
  choice: an dem … vollendet … sein würde
  rationale: Die überlieferte Konstruktion ist syntaktisch ungewöhnlich; die Wiedergabe bringt den erkennbaren zukünftigen Endpunkt zum Ausdruck, ohne die Unebenheit inhaltlich umzudeuten.
- source_word: ὁ οἶκος
  choice: das Haus
  rationale: Die wörtliche Bezeichnung bewahrt den biblischen Sprachgebrauch; im Zusammenhang ist damit der Tempel gemeint.
- source_word: Ἰερουσαλὴμ οἰκοδομηθῆναι
  choice: Jerusalem gebaut sein würde
  rationale: οἰκοδομηθῆναι bedeutet wörtlich „gebaut werden“. Obwohl der Zusammenhang einen Wiederaufbau beschreibt, wird dieser Zusatz nicht stillschweigend in den Haupttext aufgenommen.
theological_decisions:
- issue: Bezug von „das Haus“
  choice: Die wörtliche Bezeichnung „das Haus“ bleibt im Haupttext stehen; gemeint ist der Tempel.
  alternative: Direkt mit „der Tempel“ übersetzen.
  rationale: Der Wiederherstellungskontext identifiziert das Haus als Tempel. Die wörtliche Wiedergabe bewahrt jedoch die Ausdrucksweise der Quelle und vermeidet eine unnötige interpretierende Ersetzung.
- issue: „gebaut“ oder „wiederaufgebaut“ bei Jerusalem
  choice: „gebaut“ im Haupttext
  alternative: „wiederaufgebaut“
  rationale: Der historische Zusammenhang legt Wiederaufbau nahe, doch das griechische Verb enthält hier nicht ausdrücklich das Präfix oder die Bedeutung „wieder-“. Die Spannung zwischen Wortlaut und Kontext bleibt durch eine Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Schriftlich anordnen“ gibt den amtlichen Charakter wieder; „Unterhalt gewähren“ ist verständlich und nicht unnötig technisch. Die biblische Wendung „das Haus“ bleibt erhalten und wird erläutert.
