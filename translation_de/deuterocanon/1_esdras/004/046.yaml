base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/004/046.yaml
  text: 'And now this is what I ask[a], lord king, and what I request from you, and this is the greatness that comes from you: therefore I beg that you fulfill the vow which I vowed to the King of heaven to accomplish by your mouth.'
translation:
  language: de
  text: 'Und nun ist dies, Herr König, alles, worum ich bitte und was ich von dir erbitte; und das ist die Größe, die von dir ausgeht. Darum flehe ich dich an: Erfülle das Gelübde, das du dem König des Himmels abgelegt hast, indem du es durch dein Wort erfüllst.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich steht am Ende „aus deinem Mund“. Die griechische Schlusswendung kann bedeuten, dass der König das Gelübde durch sein gesprochenes Wort erfüllt; sie kann aber auch das vorherige „abgelegt hast“ näher bestimmen: „das du mit deinem Mund abgelegt hast“.'
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: ἀξιῶ
  choice: ich bitte
  rationale: Im höfischen Bittkontext bezeichnet das Verb eine Bitte, nicht das Geltendmachen eines Anspruchs. Die Wiedergabe bleibt natürlich und steht in bewusster Parallele zu αἰτοῦμαί.
- source_word: κύριε βασιλεῦ
  choice: Herr König
  rationale: Die respektvolle vokativische Anrede an den irdischen König wird eng am Griechischen wiedergegeben und zugleich klar vom göttlichen Titel „König des Himmels“ unterschieden.
- source_word: αἰτοῦμαί σε
  choice: was ich von dir erbitte
  rationale: „Erbitte“ wahrt die rhetorische Doppelung der beiden Verben des Bittens und klingt etwas nachdrücklicher als das vorausgehende „bitte“.
- source_word: μεγαλωσύνη ἡ παρὰ σοῦ
  choice: die Größe, die von dir ausgeht
  rationale: „Größe“ bewahrt die semantische Weite von μεγαλωσύνη zwischen Größe, Hoheit und großmütigem Handeln; der Kontext lässt königliche Großmut mitschwingen, ohne sie ausdrücklich festzulegen.
- source_word: δέομαι
  choice: ich flehe dich an
  rationale: Das Verb steigert die Eindringlichkeit der Bitte. „Anflehen“ entspricht dem feierlichen, demütigen Ton.
- source_word: ποιήσῃς τὴν εὐχήν
  choice: Erfülle das Gelübde
  rationale: Im Zusammenspiel mit ηὔξω bezeichnet εὐχή hier am ehesten ein Gelübde. „Erfüllen“ ist die natürliche deutsche Verbindung für dessen Ausführung.
- source_word: ἣν ηὔξω
  choice: das du … abgelegt hast
  rationale: 'ηὔξω ist zweite Person Singular und bezieht sich auf den angesprochenen König: Er, nicht der Sprecher, hat das Gelübde abgelegt. Damit wird eine wesentliche Abweichung der englischen Konsultationsfassung berichtigt.'
- source_word: τῷ βασιλεῖ τοῦ οὐρανοῦ
  choice: dem König des Himmels
  rationale: Der göttliche Titel wird wörtlich und transparent wiedergegeben; der Gegensatz zwischen dem angeredeten irdischen König und Gott bleibt erhalten.
- source_word: ποιῆσαι ἐκ στόματός σου
  choice: indem du es durch deinen Ausspruch verwirklichst
  rationale: Die Formulierung bewahrt das Bild des königlichen Mundes in natürlichem Deutsch als wirksamen Ausspruch beziehungsweise Erlass. Die syntaktische Mehrdeutigkeit der griechischen Wortfolge wird in der Fußnote genannt.
theological_decisions:
- issue: Bezug des Titels „König des Himmels“
  choice: Der Titel bezeichnet Gott und wird vom angeredeten irdischen König unterschieden.
  alternative: Den Titel allgemeiner als „himmlischer König“ wiederzugeben oder beide Königstitel sprachlich anzugleichen.
  rationale: Der griechische Genitiv τοῦ οὐρανοῦ bezeichnet Gott als König des Himmels. Die Übersetzung erhält den ausdrücklich angelegten Gegensatz, ohne weitere dogmatische Bestimmungen einzutragen.
- issue: Urheber des Gelübdes
  choice: Der angeredete König hat das Gelübde abgelegt.
  alternative: Der Sprecher habe das Gelübde abgelegt.
  rationale: Die Verbform ηὔξω ist eindeutig zweite Person Singular. Die englische Fassung „which I vowed“ widerspricht daher dem griechischen Quelltext.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit höfisch-feierlichem Ton. Die Wiederholung von „bitte“ und „erbitte“ bildet die rhetorische Doppelung des Griechischen ab. „Größe“ bleibt bewusst semantisch offen. Der Fußnotenmarker steht bei der tatsächlich erläuterten Schlusswendung.
