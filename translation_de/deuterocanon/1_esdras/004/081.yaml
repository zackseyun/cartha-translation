  yaml_path: translation/deuterocanon/1_esdras/004/081.yaml
  text: From you are victory and wisdom[a], and yours is the glory, and I am your servant.
translation:
  language: de
  text: Von dir kommen Sieg und Weisheit; dir gehört die Herrlichkeit, und ich bin dein Hausdiener.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Παρά σοῦ
  choice: Von dir kommen
  rationale: παρά mit Genitiv bezeichnet hier Herkunft oder Ursprung. Das im Griechischen nur einmal ausdrücklich stehende Satzglied wird im Deutschen durch das gemeinsame Verb „kommen“ natürlich auf Sieg und Weisheit bezogen.
- source_word: νίκη
  choice: Sieg
  rationale: Direkte und im Kontext natürliche Wiedergabe von νίκη.
- source_word: ἡ σοφία
  choice: Weisheit
  rationale: Die übliche Entsprechung für σοφία; der Kontext verlangt keine engere Bedeutung wie Klugheit oder Geschick.
- source_word: σὴ ἡ δόξα
  choice: dein ist die Herrlichkeit
  rationale: Die prädikative und betonte Besitzanzeige wird in einer würdigen, im Deutschen verständlichen Form bewahrt.
- source_word: οἰκέτης
  choice: Hausdiener
  rationale: οἰκέτης bezeichnet spezifisch einen zum Haushalt gehörenden Diener. „Hausdiener“ erhält diese Bedeutungsnuance, ohne den Begriff pauschal als „Sklave“ festzulegen.
theological_decisions:
- issue: Bezug der Anrede in der zweiten Person
  choice: Die direkte Anrede bleibt ohne ausdrückliche Bestimmung des Angeredeten stehen.
  alternative: Ausdrückliche Identifikation als Gott oder als König im erzählerischen Zusammenhang.
  rationale: Der griechische Satz nennt den Angeredeten nicht, sondern verwendet lediglich Pronomen der zweiten Person. Die Übersetzung löst diese mögliche Spannung nicht auf.
- issue: Status des οἰκέτης
  choice: Hausdiener
  alternative: Diener oder Sklave
  rationale: Der Ausdruck markiert die Zugehörigkeit zu einem Haushalt und ein Dienstverhältnis, legt aber in diesem Satz den rechtlichen Status nicht eindeutig fest. „Hausdiener“ wahrt die Spezifik, ohne stärker zu bestimmen als der Ausgangstext.
translation_notes:
  register: Moderne, würdige Standardsprache mit leicht feierlichem Satzrhythmus. Das semantisch genauere „Hausdiener“ wird im Haupttext verwendet; daher ist keine Fußnote erforderlich.
