base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/004/036.yaml
  text: All the earth calls truth blessed[a], and heaven blesses her; and all works shake and tremble[b], and with her there is nothing unjust.
translation:
  language: de
  text: Die ganze Erde ruft die Wahrheit an, und der Himmel segnet sie; alle Werke erbeben und zittern, und bei ihr[a] gibt es nichts Ungerechtes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Im Griechischen steht hier ein Genitivpronomen in maskuliner oder neutraler Form (wörtlich: „mit ihm/ihm“), obwohl die vorausgehenden Bezüge auf die Wahrheit feminin sind. Dem Zusammenhang nach ist wahrscheinlich weiterhin die Wahrheit gemeint.'
    reason: textual_variant
lexical_decisions:
- source_word: πᾶσα ἡ γῆ
  choice: die ganze Erde
  rationale: In der Verbindung mit dem Himmel bezeichnet γῆ hier die Erde im umfassenden, kosmischen Sinn.
- source_word: τὴν ἀλήθειαν καλεῖ
  choice: ruft die Wahrheit an
  rationale: καλέω mit Akkusativ kann „rufen“ oder „anrufen“ bedeuten. „Ruft … an“ gibt die direkte Hinwendung zur Wahrheit wieder, ohne das im Griechischen nicht ausdrücklich vorhandene „selig/preiswürdig nennen“ einzufügen.
- source_word: ὁ οὐρανὸς αὐτὴν εὐλογεῖ
  choice: der Himmel segnet sie
  rationale: εὐλογέω wird mit „segnen“ wiedergegeben; das feminine Pronomen bleibt erhalten und bewahrt die rhetorische Personifizierung der Wahrheit.
- source_word: πάντα τὰ ἔργα
  choice: alle Werke
  rationale: ἔργα bedeutet wörtlich „Werke“. Der kosmische Zusammenhang kann das Geschaffene einschließen, doch die offenere Formulierung vermeidet eine unnötige Festlegung.
- source_word: σείεται καὶ τρέμει
  choice: erbeben und zittern
  rationale: Die beiden Verben bilden eine verstärkende Paarung. Das Deutsche verwendet idiomatisch Pluralformen, während neutrale Pluralsubjekte im Griechischen häufig mit einem Verb im Singular stehen.
- source_word: μετʼ αὐτοῦ
  choice: bei ihr
  rationale: Der Zusammenhang weist am ehesten zurück auf die Wahrheit. Im überlieferten Griechisch steht jedoch ein maskulines beziehungsweise neutrales Pronomen statt der erwarteten femininen Form; diese Unstimmigkeit wird in einer Fußnote offengelegt.
- source_word: ἄδικον οὐθέν
  choice: nichts Ungerechtes
  rationale: Dies entspricht der substantivierten Bedeutung „nichts, was ungerecht ist“ und bewahrt die ethische Aussage ohne zusätzliche dogmatische Deutung.
theological_decisions:
- issue: Personifizierung der Wahrheit
  choice: Die femininen Bezüge werden mit „sie/ihr“ beibehalten.
  alternative: Die Wahrheit unpersönlich mit „es/ihm“ wiedergeben.
  rationale: Das griechische αὐτήν stimmt feminin mit ἀλήθεια überein und gestaltet die Wahrheit rhetorisch als weibliche Gestalt. Das begründet keine Aussage über eine eigenständige göttliche Person.
- issue: Bezug des Pronomens in μετʼ αὐτοῦ
  choice: Im Haupttext auf die Wahrheit beziehen und die Formabweichung anmerken.
  alternative: Das Pronomen auf den Himmel beziehen oder unpersönlich als „bei ihm“ wiedergeben.
  rationale: Der Gedankengang über die Gerechtigkeit passt am natürlichsten zur Wahrheit; die abweichende grammatische Form bleibt durch die Fußnote sichtbar, sodass die echte textliche Spannung nicht verschwiegen wird.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die poetisch-kosmische Sprache bleibt erhalten; „anrufen“ ist gehoben, aber allgemein verständlich. Die Zeichensetzung macht die parallelen Aussagen klar, ohne die Spannung des griechischen Wortlauts zu glätten.
