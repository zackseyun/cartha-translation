base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/004/024.yaml
  text: 'And the second[a], who had spoken about the king’s strength, began to speak: “Men, do not men prevail, ruling over the land and the sea and everything in them?”'
translation:
  language: de
  text: 'Und der Zweite, der über die Stärke des Königs gesprochen hatte, begann zu reden: „Ihr Männer, haben nicht die Menschen die Oberhand – sie beherrschen das Land und das Meer und alles, was darin ist?“[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Frage ist rhetorisch und erwartet die Antwort: „Ja.“'
    reason: Die durch οὐχ eingeleitete Frage könnte außerhalb des Zusammenhangs als echte Verneinungsfrage missverstanden werden.
lexical_decisions:
- source_word: ἤρξατο ... λαλεῖν
  choice: begann zu reden
  rationale: Gibt die griechische Konstruktion mit ἄρχομαι und Infinitiv eng und zugleich idiomatisch im Deutschen wieder.
- source_word: ὁ δεύτερος
  choice: der Zweite
  rationale: Bezeichnet den zweiten Redner beziehungsweise Wettstreiter in der Abfolge; der substantivierte Ordinalbegriff genügt im Kontext.
- source_word: ὁ εἴπας περὶ τῆς ἰσχύος τοῦ βασιλέως
  choice: der über die Stärke des Königs gesprochen hatte
  rationale: Das Aoristpartizip kennzeichnet ihn durch seine vorausgegangene Aussage. „Stärke“ wahrt die konkrete Bedeutung von ἰσχύς, ohne den Begriff unnötig auszudeuten.
- source_word: Ὦ ἄνδρες
  choice: Ihr Männer
  rationale: Direkte, geschlechtsgenaue Anrede der anwesenden Männer; im heutigen Deutsch würdevoll und verständlich.
- source_word: οὐχ ὑπερισχύουσιν οἱ ἄνθρωποι
  choice: haben nicht die Menschen die Oberhand
  rationale: ὑπερισχύω bezeichnet Überlegenheit beziehungsweise das Sichdurchsetzen. Die deutsche Wendung bewahrt die rhetorische Frage, die eine bejahende Antwort erwartet.
- source_word: τὴν γῆν καὶ τὴν θάλασσαν κατακρατοῦντες
  choice: sie beherrschen das Land und das Meer
  rationale: κατακρατέω bezeichnet das Ausüben von Herrschaft oder Kontrolle. „Beherrschen“ ist kräftig, natürlich und dem Kontext angemessen; γῆ bezeichnet im Gegensatz zum Meer hier das Land.
- source_word: πάντα τὰ ἐν αὐτοῖς
  choice: alles, was darin ist
  rationale: Gibt die umfassende Bezugnahme auf alles im Land und im Meer klar und knapp wieder.
