  text: Is not the one who does these things great? And truth is great, and stronger than everything.
translation:
  language: de
  text: Ist nicht groß, wer diese Dinge tut? Und die Wahrheit ist groß und stärker als alles.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐχὶ μέγας ὃς ταῦτα ποιεῖ
  choice: Ist der, der dies tut, nicht groß?
  rationale: Die rhetorische Frage und der substantivisch gebrauchte Relativsatz werden eng am Griechischen und zugleich in natürlichem modernem Deutsch wiedergegeben. Das Pluralpronomen ταῦτα wird idiomatisch mit dem zusammenfassenden „dies“ übersetzt.
- source_word: ἡ ἀλήθεια
  choice: die Wahrheit
  rationale: Die bestimmte Form des griechischen Ausdrucks wird unmittelbar und ohne zusätzliche Deutung wiedergegeben.
- source_word: ἰσχυροτέρα παρὰ πάντα
  choice: stärker als alles
  rationale: Der Komparativ mit παρά wird als Vergleich übersetzt; πάντα ist neutrischer Plural und bezeichnet umfassend „alles“.
theological_decisions:
- issue: Personifizierung beziehungsweise übergeordnete Macht der Wahrheit
  choice: Auch die Wahrheit ist groß und stärker als alles.
  alternative: Und die Wahrheit ist groß und mächtiger als alle.
  rationale: Die Formulierung bewahrt die umfassende Aussage des Textes, ohne „Wahrheit“ ausdrücklich zu personifizieren oder „alles“ auf Personen beziehungsweise Dinge einzuschränken.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe rhetorische Form und die Steigerung des griechischen Textes bleiben erhalten.
