  yaml_path: translation/deuterocanon/1_esdras/004/071.yaml
  text: And he wrote to all the Jews who were going up from the kingdom to Judea concerning their freedom[a], that no official, satrap, governor, or steward should come against their doors[b],
translation:
  language: de
  text: Und er schrieb allen Juden, die aus dem Königreich nach Judäa hinaufzogen, hinsichtlich ihrer Freiheit[a], dass kein Machthaber, Satrap, Bezirksvorsteher oder Verwalter an ihre Türen herantreten sollte[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wegen ihrer Befreiung von Verpflichtungen“ oder „hinsichtlich ihres Vorrechts“. Das griechische Wort bezeichnet gewöhnlich Freiheit, kann hier im amtlichen Zusammenhang aber eine rechtliche Vergünstigung oder Befreiung meinen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „nicht gegen ihre Türen kommen“. Gemeint ist wahrscheinlich, dass Amtsträger nicht an ihre Häuser herantreten sollten, um dort einzudringen oder Forderungen gegen sie zu erheben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔγραψεν
  choice: er schrieb
  rationale: Die einfache Wiedergabe entspricht dem Aorist von γράφω; der amtliche Charakter ergibt sich aus dem Zusammenhang und muss nicht in das Verb hineingelesen werden.
- source_word: τοῖς ἀναβαίνουσιν
  choice: die ... hinaufzogen
  rationale: Bewahrt das räumliche und traditionsgeschichtlich geprägte Bild des Hinaufziehens nach Judäa, statt es lediglich als Rückkehr zu paraphrasieren.
- source_word: τῆς βασιλείας
  choice: dem Königreich
  rationale: βασιλεία bezeichnet hier den Herrschaftsbereich des Königs; „Königreich“ ist direkt und lässt die genaue territoriale Ausdehnung offen.
- source_word: ὑπὲρ τῆς ἐλευθερίας
  choice: wegen ihrer Freiheit
  rationale: ἐλευθερία bedeutet gewöhnlich „Freiheit“; ὑπέρ mit Genitiv kann den Gegenstand oder Anlass des Schreibens bezeichnen. Die Formulierung wahrt zugleich die mögliche rechtlich-administrative Bedeutung.
- source_word: πάντα δυνατὸν
  choice: kein Machthaber
  rationale: Wörtlich bezeichnet die Wendung jeden Mächtigen beziehungsweise Einflussreichen. „Machthaber“ ist im Deutschen verständlich und bewahrt stärker als das allgemeinere „Beamter“ den Wortlaut δυνατός.
- source_word: σατράπην
  choice: Satrap
  rationale: Der historisch spezifische persische Amtstitel wird als geläufiges deutsches Lehnwort beibehalten.
- source_word: τοπάρχην
  choice: Bezirksvorsteher
  rationale: τοπάρχης bezeichnet den Herrscher oder Vorsteher eines örtlichen Verwaltungsgebiets; die Wahl ist verständlich und spezifischer als „Statthalter“.
- source_word: οἰκονόμον
  choice: Verwalter
  rationale: οἰκονόμος bezeichnet einen Haus-, Güter- oder Verwaltungsbeauftragten; in der amtlichen Aufzählung ist „Verwalter“ natürlich und hinreichend offen.
- source_word: μὴ ἐπελεύσεσθαι ἐπὶ τὰς θύρας αὐτῶν
  choice: gegen ihre Türen vorgehen dürfe
  rationale: Die Formulierung erhält das auffällige Bild der „Türen“ und die gegen sie gerichtete Bewegung von ἐπέρχομαι, klingt aber im Deutschen verständlicher als eine rein wörtliche Wiedergabe.
theological_decisions:
- issue: Bedeutung der Freiheit in einem königlichen Verwaltungserlass
  choice: wegen ihrer Freiheit
  alternative: wegen ihrer Befreiung von Abgaben / hinsichtlich ihres Vorrechts
  rationale: Der Vers handelt von einem königlich gewährten Schutz oder einer rechtlichen Freiheit, nicht ausdrücklich von geistlicher Freiheit. Die Übersetzung hält den Grundsinn von ἐλευθερία fest, ohne die nicht näher bestimmte juristische Ausgestaltung festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Historische Amtsbezeichnungen werden teils beibehalten („Satrap“), teils transparent wiedergegeben. Die ungewöhnliche Tür-Metapher und die rechtliche Mehrdeutigkeit von ἐλευθερία bleiben durch Haupttext und Fußnoten erkennbar.
