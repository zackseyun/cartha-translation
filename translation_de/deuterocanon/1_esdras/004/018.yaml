base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/004/018.yaml
  text: It makes the mind of the king and of the orphan one[a], and that of the servant and that of the free, and that of the poor and that of the rich.
translation:
  language: de
  text: Es macht die Denkweise des Königs und der Waise gleich[a], ebenso die des Sklaven und des Freien und die des Armen und des Reichen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »macht das Denken des Königs und der Waise eins«; sinngemäß auch: »lässt den König und die Waise gleich denken«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιεῖ
  choice: macht
  rationale: Das Präsens bezeichnet schlicht ein Bewirken; »macht« bewahrt diese direkte Aussage.
- source_word: τὴν διάνοιαν μίαν
  choice: macht die Denkweise ... gleich
  rationale: διάνοια kann Denken, Gesinnung oder Denkweise bezeichnen; μίαν drückt hier aus, dass Menschen verschiedener gesellschaftlicher Stellung innerlich gleich ausgerichtet werden. Die Formulierung ist im Deutschen natürlich, ohne die Aussage weiter auszudeuten.
- source_word: βασιλέως
  choice: König
  rationale: Dies ist die gewöhnliche und kontextuell passende Bedeutung.
- source_word: ὀρφανοῦ
  choice: Waisenkind
  rationale: ὀρφανός bezeichnet einen verwaisten beziehungsweise vaterlosen Menschen; »Waisenkind« bildet den sozialen Gegensatz hier klar und in natürlichem Deutsch ab.
- source_word: οἰκέτου
  choice: Sklave
  rationale: οἰκέτης kann Hausdiener oder Haussklave bedeuten. Der ausdrückliche Gegensatz zu ἐλεύθερος hebt den unfreien Rechtsstand hervor, weshalb »Sklave« vorzuziehen ist.
- source_word: ἐλευθέρου
  choice: Freier
  rationale: Der substantivierte Ausdruck bezeichnet den freien Menschen im Gegensatz zum Sklaven.
- source_word: πένητος
  choice: Armer
  rationale: πένης bezeichnet einen armen oder bedürftigen Menschen; »Armer« bewahrt den knappen gesellschaftlichen Gegensatz.
- source_word: πλουσίου
  choice: Reicher
  rationale: »Reicher« ist das direkte und rhetorisch parallele Gegenstück zu »Armer«.
theological_decisions:
- issue: Die gesellschaftlichen Gegensatzpaare werden durch das im Kontext genannte Subjekt hinsichtlich ihrer Denkweise einander gleichgemacht; der Vers selbst erklärt keinen theologischen Mechanismus.
  choice: Die Standesunterschiede werden unverändert wiedergegeben, ohne eine zusätzliche theologische Erklärung einzufügen.
  alternative: 'Freier umschreiben: »lässt den König und das Waisenkind gleich denken ...«'
  rationale: Der griechische Text nennt gegensätzliche soziale Gruppen und erklärt ihre διάνοια für μία. Eine zurückhaltende Wiedergabe wahrt die rhetorische Einebnung, ohne Ursache oder Art dieser Gemeinsamkeit näher zu bestimmen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Reihung der drei sozialen Gegensatzpaare bleibt erhalten; »ebenso« macht im Deutschen deutlich, dass sich das Prädikat auf alle Paare bezieht.
