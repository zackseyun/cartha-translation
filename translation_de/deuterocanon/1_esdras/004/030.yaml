  text: and taking the crown from the king’s head and putting it on herself[a]; and she struck the king with her left hand.
translation:
  language: de
  text: Sie nahm dem König die Krone vom Kopf und setzte sie sich selbst auf; dann schlug[a] sie den König mit der linken Hand.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ohrfeigte“. Das griechische Verb kann einen Schlag, besonders einen Schlag mit der flachen Hand, bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφαιροῦσαν
  choice: nahm … vom Kopf
  rationale: Das Partizip bezeichnet das Abnehmen beziehungsweise Wegnehmen der königlichen Kopfbedeckung. Die deutsche Fügung „jemandem etwas vom Kopf nehmen“ gibt den Vorgang natürlich und genau wieder.
- source_word: διάδημα
  choice: Krone
  rationale: „Krone“ ist die allgemein verständliche Bezeichnung für das königliche Stirn- oder Kopfzeichen; „Diadem“ wäre formaler, im heutigen Deutsch aber enger und weniger natürlich.
- source_word: ἐπιτιθοῦσαν αὐτῇ
  choice: setzte sie sich selbst auf
  rationale: 'Im Zusammenhang bezieht sich αὐτῇ auf die handelnde Frau: Sie nimmt die Krone vom Kopf des Königs und setzt sie auf ihren eigenen. „sich selbst“ macht diesen Bezug eindeutig, ohne den Sinn zu erweitern.'
- source_word: ἐράπιζεν
  choice: schlug
  rationale: Das Verb bezeichnet einen Schlag, häufig insbesondere eine Ohrfeige. „schlug“ bewahrt die allgemeinere Bedeutung; die konkretere Möglichkeit wird in der Fußnote genannt.
- source_word: τῇ ἀριστερᾷ
  choice: mit der linken Hand
  rationale: Der substantivierte feminine Dativ bezeichnet die linke Hand als Mittel des Schlages. Die Ergänzung „Hand“ ist im Deutschen nötig und entspricht dem im Griechischen vorausgesetzten Körperteil.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die griechischen Partizipien werden als koordinierte finite Verben wiedergegeben, damit der Satz als eigenständiger Vers natürlich verständlich ist; „dann“ bildet den Übergang zum finiten Verb ab. Die Fußnotenmarke steht unmittelbar bei dem Wort, auf das sich die lexikalische Alternative bezieht.
