  yaml_path: translation/deuterocanon/1_esdras/004/079.yaml
  text: And he sent back all the vessels that Cyrus had set apart from Babylon; and everything that Cyrus had said should be done[a], he himself also ordered to be done and to be sent to Jerusalem.
translation:
  language: de
  text: Und er sandte alle Geräte zurück, die Kyros aus Babylon ausgesondert hatte.[a] Alles, was Kyros zu tun gesagt hatte, ordnete auch er selbst an auszuführen und nach Jerusalem zu senden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Kyros aus Babylon entfernt hatte“. Das griechische Verb kann „trennen“, „aussondern“ oder „entfernen“ bedeuten; hier geht es um die Tempelgeräte, die zur Rückgabe bestimmt wurden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξαπέστειλεν
  choice: sandte … zurück
  rationale: Das Verb bedeutet zunächst „aussenden“; im Erzählzusammenhang handelt es sich jedoch um die Rücksendung der einst aus Jerusalem fortgebrachten Tempelgeräte.
- source_word: πάντα τὰ σκεύη
  choice: alle Geräte
  rationale: σκεύη bezeichnet hier die für den Tempeldienst bestimmten Gegenstände. „Geräte“ ist im Deutschen verständlich und weiter als das möglicherweise zu enge „Gefäße“.
- source_word: ἃ ἐχώρισεν Κῦρος ἀπὸ Βαβυλῶνος
  choice: die Kyros aus Babylon ausgesondert hatte
  rationale: χωρίζω kann trennen, aussondern oder entfernen bedeuten. „Ausgesondert“ lässt offen, ob die Gegenstände zunächst bestimmt oder bereits fortgebracht wurden.
- source_word: πάντα ὅσα εἶπεν Κῦρος ποιῆσαι
  choice: Alles, wovon Kyros gesagt hatte, es solle getan werden
  rationale: Die Formulierung bildet die indirekte Anweisung mit εἶπεν und dem Infinitiv ab, ohne εἶπεν unnötig zu „befehlen“ zu verstärken.
- source_word: καὶ αὐτὸς
  choice: auch er selbst
  rationale: Die Wiedergabe bewahrt sowohl den additiven Sinn von καί als auch die Betonung durch αὐτός.
- source_word: ἐπέταξεν
  choice: ordnete … an
  rationale: Das Verb bezeichnet eine verbindliche Weisung und passt hier in den Zusammenhang eines königlichen Erlasses.
- source_word: ποιῆσαι καὶ ἐξαποστεῖλαι εἰς Ἰερουσαλήμ
  choice: Es sollte getan und nach Jerusalem gesandt werden
  rationale: Die beiden koordinierten Infinitive bleiben erhalten. Die passive deutsche Form vermeidet die Ergänzung eines im Griechischen nicht genannten Handelnden und bewahrt die etwas gespannte Verbindung von „tun“ und „senden“.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Doppelpunkt gliedert den langen griechischen Satz und erhält zugleich den engen Zusammenhang der beiden königlichen Anweisungen. Die ungewöhnliche sachliche Spannung zwischen „getan“ und „gesandt“ wurde nicht durch eine erklärende Ergänzung aufgelöst.
