base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/004/070.yaml
  text: And he wrote letters to all the local rulers in Coele-Syria and Phoenicia and to those in Lebanon[a], to bring cedar timber from Lebanon to Jerusalem, so that they might build the city with him.
translation:
  language: de
  text: Und er schrieb Briefe an alle Bezirksvorsteher[a] in Koilesyrien und Phönizien sowie an die im Libanon mit dem Auftrag, Zedernholz vom Libanon nach Jerusalem zu bringen und die Stadt gemeinsam mit ihm zu bauen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „örtliche Machthaber“; griechisch „Toparchen“, Herrscher oder Vorsteher örtlicher Bezirke.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοπάρχαις
  choice: Bezirksvorsteher
  rationale: τοπάρχης bezeichnet den Leiter oder Herrscher eines örtlichen Verwaltungsbezirks. „Bezirksvorsteher“ gibt die administrative Funktion in verständlichem Deutsch wieder, ohne den wenig geläufigen Fachausdruck „Toparchen“ in den Haupttext zu setzen.
- source_word: ἐν κοίλῃ Συρίᾳ
  choice: in Koilesyrien
  rationale: Κοίλη Συρία ist hier eine historische Regionsbezeichnung. „Koilesyrien“ bewahrt den Eigennamen, statt ihn zu „Syrien“ zu verallgemeinern oder wörtlich als „Hohlsyrien“ wiederzugeben.
- source_word: ἔγραψεν ἐπιστολάς
  choice: er schrieb Briefe
  rationale: Die Wiedergabe folgt dem ausdrücklich genannten Vorgang des Schreibens; dass die Briefe anschließend übermittelt wurden, wird nicht an die Stelle des griechischen Verbs gesetzt.
- source_word: μεταφέρειν
  choice: bringen
  rationale: Der Infinitiv bezeichnet den beabsichtigten Transport des Holzes vom Libanon nach Jerusalem. „Bringen“ ist natürlich und wahrt die Bewegungsrichtung.
- source_word: ξύλα κέδρινα
  choice: Zedernholz
  rationale: Die Wendung bezeichnet Zedernholz als Baumaterial. Das deutsche Kollektivum „Zedernholz“ ist idiomatisch und legt sich nicht unnötig auf Bretter oder Stämme fest.
- source_word: ὅπως οἰκοδομήσωσιν
  choice: damit sie … bauten
  rationale: ὅπως mit Konjunktiv drückt einen Zweck aus. Die deutsche Konstruktion mit „damit“ gibt diesen Zweck natürlich wieder.
- source_word: μετ’ αὐτοῦ
  choice: gemeinsam mit ihm
  rationale: μετά mit Genitiv bezeichnet Begleitung beziehungsweise gemeinsames Handeln. „Gemeinsam mit ihm“ verdeutlicht diese Bedeutung, ohne daraus „für ihn“ zu machen.
- source_word: τὴν πόλιν
  choice: die Stadt
  rationale: πόλις bezeichnet hier Jerusalem als Stadt. Die Übersetzung bewahrt den ausdrücklich genannten Gegenstand und ersetzt ihn nicht durch „Tempel“.
theological_decisions:
- issue: Gegenstand des Bauvorhabens
  choice: die Stadt
  alternative: der Tempel
  rationale: Obwohl Zedernholz vom Libanon in biblischen Zusammenhängen an den Tempelbau erinnern kann, steht im griechischen Text ausdrücklich τὴν πόλιν („die Stadt“). Eine harmonisierende Ersetzung durch „Tempel“ wäre nicht quellengerecht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der lange griechische Satz wurde nach „Libanon“ geteilt, um die Abfolge von Adressaten und Auftragsinhalt klar lesbar zu machen. „Koilesyrien“ bleibt als historischer Regionsname erhalten.
