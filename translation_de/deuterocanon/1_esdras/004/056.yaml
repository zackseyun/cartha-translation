lexical_decisions:
- source_word: φρουροῦσι
  choice: die … bewachten
  rationale: Das Partizip von φρουρέω bezeichnet das Bewachen oder militärische Sichern. Die finite Wiedergabe ist im Deutschen natürlich und bewahrt den Schutz- beziehungsweise Wachdienst als Sinn.
- source_word: πόλιν
  choice: die Stadt
  rationale: Der bestimmte Artikel des griechischen Textes wird beibehalten.
- source_word: ἔγραψε
  choice: schrieb er, dass
  rationale: Die Übersetzung erhält die Grundbedeutung „schreiben“ und gibt zugleich natürlich wieder, dass der folgende Infinitiv den Inhalt der schriftlichen Verfügung bezeichnet, ohne das Verb zu „befahl“ oder „verordnete“ zu verstärken.
- source_word: δοῦναι
  choice: gegeben werden sollten
  rationale: Der Infinitiv hängt von ἔγραψε ab und bezeichnet den Inhalt der schriftlichen Anweisung. Die unpersönliche passive Form ist im Deutschen idiomatisch und legt nicht fest, wer die Zuwendungen auszuhändigen hatte.
- source_word: κλήρους
  choice: Anteile
  rationale: κλῆρος kann ein Los, aber auch den durch Los oder Zuweisung erhaltenen Anteil bezeichnen. „Anteile“ passt zum administrativen Zusammenhang, ohne die nicht ausdrücklich genannte Art der Zuteilung etwa als Land festzulegen.
- source_word: ὀψώνια
  choice: Sold
  rationale: ὀψώνια bezeichnet besonders im militärischen Zusammenhang Bezahlung beziehungsweise Unterhalt. Da es hier um die Wächter der Stadt geht, ist „Sold“ die präzise und natürliche deutsche Entsprechung; die historisch mögliche Bedeutung „Verpflegung“ wird durch den Kontext nicht erzwungen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bleibt nahe am griechischen Verwaltungssatz, ist aber flüssig lesbar. „Sold“ macht den wahrscheinlichen militärischen Zusammenhang deutlich; „Anteile“ wahrt die Bedeutungsbreite von κλήρους.
