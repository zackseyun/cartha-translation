base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/004/060.yaml
  text: Blessed are you[a], who have given me wisdom; and to you I give thanks[b], Master of the fathers.
translation:
  language: de
  text: Gepriesen bist du, der du mir Weisheit gegeben hast; und dir danke ich[a], Gebieter der Väter[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ich erkenne dich an«, »ich bekenne dich« oder »ich preise dich«. Das griechische Verb kann ein offenes Anerkennen oder Bekennen bezeichnen und hat hier im Gebet wahrscheinlich den Sinn dankbaren Lobens.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Herrscher der Väter«. Das griechische Wort bezeichnet einen Gebieter oder souveränen Herrscher und ist nicht das gewöhnliche Wort für »Herr« (κύριος).'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλογητὸς
  choice: Gepriesen
  rationale: Das prädikative Adjektiv steht in einer an Gott gerichteten Segens- und Lobformel. »Gepriesen« gibt diesen doxologischen Sinn im Deutschen natürlicher wieder als »gesegnet« oder »selig«.
- source_word: ὃς ἔδωκάς μοι σοφίαν
  choice: der du mir Weisheit gegeben hast
  rationale: Der Relativsatz bestimmt den Angeredeten näher. Das deutsche Perfekt bezeichnet die vollendete Gabe, deren Bedeutung für das gegenwärtige Gebet fortbesteht.
- source_word: σοφίαν
  choice: Weisheit
  rationale: »Weisheit« ist die direkte und kontextgemäße Entsprechung; eine Einengung auf »Einsicht« ist nicht erforderlich.
- source_word: ὁμολογῶ
  choice: danke ich
  rationale: ὁμολογέω kann »bekennen«, »anerkennen« oder »preisen« bedeuten. Mit dem Dativ σοὶ in diesem Gebetszusammenhang liegt dankbares Anerkennen nahe; »dir danke ich« ist dafür eine natürliche deutsche Formulierung, während eine Fußnote die echte Bedeutungsbreite bewahrt.
- source_word: δέσποτα
  choice: Gebieter
  rationale: »Gebieter« wahrt den Herrschafts- und Autoritätssinn von δεσπότης und unterscheidet den Titel von κύριος, das gewöhnlich mit »Herr« wiedergegeben wird.
- source_word: τῶν πατέρων
  choice: der Väter
  rationale: Der griechische Text enthält weder ein Possessivpronomen noch eine geschlechtsneutrale Bezeichnung. »Der Väter« bildet den Wortlaut knapp und transparent ab.
theological_decisions:
- issue: Wiedergabe der Gottesanrede δέσποτα
  choice: Gebieter
  alternative: Herr; Herrscher
  rationale: »Gebieter« erhält die lexikalische Unterscheidung von κύριος und bezeichnet Gottes Autorität, ohne den im Griechischen nicht verwendeten Standardtitel »Herr« einzutragen.
- issue: Bedeutungsbreite von ὁμολογῶ im Gebet
  choice: dir danke ich
  alternative: ich bekenne dich; ich erkenne dich an; ich preise dich
  rationale: Der Gebetskontext stützt den Dankessinn, doch die griechische Form bleibt weiter. Die Hauptübersetzung ist idiomatisch, und die Fußnote verhindert, dass die mögliche Nuance des offenen Anerkennens oder Bekennens verloren geht.
- issue: Maskulines πατέρων
  choice: der Väter
  alternative: der Vorfahren
  rationale: Die Form ist ausdrücklich maskulin und dürfte sich auf die Väter beziehungsweise Stammväter beziehen. Die Übersetzung neutralisiert diese Bezeichnung nicht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper Gebetssyntax. »Gepriesen« entspricht dem gottesdienstlichen Ton, ohne altertümlich zu wirken. Die Marker stehen bei den jeweils erklärten Ausdrücken; damit wird die fehlerhafte Zuordnung der englischen Konsultationsfassung nicht übernommen.
