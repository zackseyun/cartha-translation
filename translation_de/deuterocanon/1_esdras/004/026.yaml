lexical_decisions:
- source_word: ἀπενοήθησαν ταῖς ἰδίαις διανοίαις
  choice: verloren den klaren Verstand
  rationale: Die Wendung bezeichnet einen Verlust vernünftigen Urteilens im eigenen Denken. Die deutsche Formulierung ist natürlich und kräftig, ohne zwingend klinischen Wahnsinn auszudrücken.
- source_word: διὰ τὰς γυναῖκας
  choice: wegen der Frauen
  rationale: διά mit Akkusativ gibt hier den Grund beziehungsweise Anlass an.
- source_word: δοῦλοι
  choice: Sklaven
  rationale: Das Wort bezeichnet tatsächliche Unterordnung und wird daher nicht zum schwächeren „Diener“ abgemildert.
- source_word: ἐγένοντο
  choice: wurden
  rationale: In Verbindung mit dem Prädikatsnomen δοῦλοι bezeichnet das Verb den Eintritt in einen neuen Zustand.
- source_word: διʼ αὐτάς
  choice: ihretwegen
  rationale: Das Pronomen verweist auf die Frauen zurück; die kausale Bedeutung von διά bleibt erhalten.
