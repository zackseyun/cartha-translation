  yaml_path: translation/deuterocanon/1_esdras/004/053.yaml
  text: And for all who go up from Babylonia to build the city[a], there shall be freedom for them and for their children, and for all the priests who go up.
translation:
  language: de
  text: Und allen, die aus Babylonien hinaufziehen, um die Stadt zu bauen, soll Freiheit[a] zuteilwerden, ihnen und ihren Kindern sowie allen Priestern, die hinaufziehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Freiheit« kann auch im Sinn von »Libertät« verstanden werden. Im Zusammenhang dieses königlichen Erlasses kann das Wort rechtliche Vorrechte oder die Befreiung von bestimmten Verpflichtungen einschließen; das Griechische legt den genauen Umfang jedoch nicht fest.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσβαίνουσιν
  choice: hinaufziehen
  rationale: Im Zusammenhang der Rückkehr aus dem Exil bezeichnet das Verb das Hinaufziehen nach Jerusalem und bewahrt damit die geografische und religiöse Färbung.
- source_word: ἀπὸ τῆς Βαβυλωνίας
  choice: aus Babylonien
  rationale: Βαβυλωνία bezeichnet die Region Babylonien, nicht nur die Stadt Babylon.
- source_word: κτίσαι τὴν πόλιν
  choice: um die Stadt zu bauen
  rationale: κτίζω kann »gründen« oder »bauen« bedeuten. Obwohl der geschichtliche Zusammenhang einen Wiederaufbau nahelegt, steht dieser Zusatz nicht ausdrücklich im Griechischen.
- source_word: ὑπάρχειν τὴν ἐλευθερίαν
  choice: soll Freiheit gewährt werden
  rationale: Die Infinitivkonstruktion gehört zum Wortlaut des königlichen Erlasses. Die passive deutsche Form gibt den verfügenden Sinn natürlich wieder.
- source_word: ἐλευθερίαν
  choice: Freiheit
  rationale: Der Ausdruck bezeichnet allgemein Freiheit und kann im amtlichen Zusammenhang rechtliche Vorrechte oder Befreiungen einschließen, ohne deren Umfang festzulegen.
- source_word: αὐτοῖς τε καὶ τοῖς τέκνοις αὐτῶν
  choice: ihnen und ihren Kindern
  rationale: τέκνα bedeutet unmittelbar »Kinder«; »Nachkommen« würde den Wortlaut verallgemeinern.
- source_word: πᾶσι τοῖς ἱερεῦσι τοῖς προσβαίνουσιν
  choice: allen Priestern, die hinaufziehen
  rationale: Die Wiederholung von »hinaufziehen« entspricht der griechischen Struktur und bezieht die Priester ausdrücklich in die gewährte Freiheit ein.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur wahrt den Charakter eines königlichen Erlasses, während »soll … gewährt werden« idiomatischer ist als eine wörtliche Wiedergabe mit »vorhanden sein«. Der Fußnotenmarker steht am Satzende, weil er sich auf die rechtliche Bedeutung von »Freiheit« im gesamten gewährenden Satzteil bezieht.
