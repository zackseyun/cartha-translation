base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/004/075.yaml
  text: And to all who go up from Babylonia to build the city[a], freedom is to belong to them and to their children[b], and to all the priests who go up.
translation:
  language: de
  text: 'Und allen, die aus Babylonien[a] hinaufziehen, um die Stadt zu bauen, soll Freiheit[b] zustehen: ihnen und ihren Kindern sowie allen Priestern, die hinaufziehen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich steht hier die Regionsbezeichnung „Babylonien“, nicht der Name der Stadt Babylon.
    reason: lexical_alternative
  - marker: b
    text: Das griechische Wort bezeichnet allgemein „Freiheit“ oder „Libertät“; welche konkreten Rechte oder Befreiungen damit verbunden sind, wird hier nicht näher bestimmt.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶσιν τοῖς προσβαίνουσιν
  choice: allen, die … hinaufziehen
  rationale: Die Verbindung aus πᾶσιν und Partizip bezeichnet umfassend alle betreffenden Personen. „Hinaufziehen“ bewahrt im Zusammenhang der Rückkehr nach Jerusalem die geografisch-biblische Bewegungsrichtung.
- source_word: ἀπὸ τῆς Βαβυλωνίας
  choice: aus Babylonien
  rationale: Βαβυλωνία bezeichnet die Region Babylonien, nicht ausdrücklich nur die Stadt Babylon.
- source_word: κτίσαι τὴν πόλιν
  choice: um die Stadt zu bauen
  rationale: κτίζω kann „gründen“, „errichten“ oder „bauen“ bedeuten. Obwohl der Zusammenhang an einen Wiederaufbau denken lässt, steht das entsprechende Präfix nicht im griechischen Text; „bauen“ hält diese Offenheit fest.
- source_word: ὑπάρχειν τὴν ἐλευθερίαν
  choice: soll Freiheit zustehen
  rationale: Die Infinitivkonstruktion gibt den Inhalt der Anordnung wieder. „Zustehen“ bildet ab, dass die Freiheit den genannten Personen zukommen beziehungsweise gehören soll, und klingt zugleich natürlich im Deutschen.
- source_word: ἐλευθερίαν
  choice: Freiheit
  rationale: „Freiheit“ ist die allgemeinste Bedeutung. Der genaue rechtliche Umfang – etwa Bürgerfreiheit oder Befreiung von bestimmten Pflichten – wird im Vers nicht festgelegt.
- source_word: αὐτοῖς τε καὶ τοῖς τέκνοις αὐτῶν
  choice: ihnen und ihren Kindern
  rationale: Die Dative nennen die Begünstigten. „Kinder“ gibt τέκνα ohne unnötige Einschränkung auf Söhne wieder.
- source_word: καὶ πᾶσι τοῖς ἱερεῦσι τοῖς προσβαίνουσιν
  choice: sowie allen Priestern, die hinaufziehen
  rationale: Die wiederholte Formulierung bezieht die hinaufziehenden Priester ausdrücklich in die Gewährung ein. „Sowie“ verbindet die Gruppen in gut lesbarem modernem Deutsch.
theological_decisions:
- issue: Art und Umfang der gewährten ἐλευθερία
  choice: Die allgemeine Bezeichnung „Freiheit“ bleibt stehen.
  alternative: Eine engere Wiedergabe wie „Abgabenbefreiung“ oder „bürgerliche Immunität“.
  rationale: Der Vers erläutert den rechtlichen oder administrativen Umfang der Freiheit nicht. Eine allgemein gehaltene Übersetzung bewahrt diese Unbestimmtheit und trägt keine besondere institutionelle Deutung ein.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Hinaufziehen“ bewahrt die traditionelle geografische Redeweise für den Weg nach Jerusalem. Der Doppelpunkt macht die im Griechischen wiederholte Nennung der Begünstigten verständlich, ohne sie zu beseitigen.
