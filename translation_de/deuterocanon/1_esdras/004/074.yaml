  text: and on the altar to offer burnt offerings daily[a], as they have been commanded, to offer seventeen, and another ten talents yearly[c][b];
translation:
  language: de
  text: 'und auf dem Altar täglich Brandopfer darzubringen[a], wie es ihnen geboten ist: siebzehn[b] darzubringen und jedes Jahr weitere zehn Talente[c] darzubringen;'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hier mit „darzubringen“ wiedergegebene griechische Verb ist an dieser Stelle ungewöhnlich und kann wörtlicher auch „bereitzustellen“ oder „zu liefern“ bedeuten.
    reason: lexical_alternative
  - marker: b
    text: Worauf sich „siebzehn“ bezieht, wird im Griechischen nicht ausdrücklich wiederholt; wahrscheinlich sind für den täglichen Opferdienst darzubringende Opfergaben gemeint.
    reason: alternative_reading
  - marker: c
    text: Ein Talent war eine große Gewichtseinheit, häufig für Edelmetall. Welches Material hier gemeint ist, sagt der Text nicht.
    reason: cultural_note
lexical_decisions:
- source_word: θυσιαστήριον
  choice: Altar
  rationale: Die übliche und hinreichend genaue Bezeichnung für den kultischen Opferaltar.
- source_word: ὁλοκαυτώματα
  choice: Brandopfer
  rationale: Der etablierte deutsche Ausdruck für Opfer, die vollständig verbrannt werden.
- source_word: καρποῦσθαι
  choice: darzubringen
  rationale: Im Opferkontext gibt dies die beabsichtigte Handlung natürlich wieder; die ungewöhnliche Grundbedeutung des Verbs wird in einer Fußnote kenntlich gemacht.
- source_word: καθ’ ἡμέραν
  choice: täglich
  rationale: Knapp und idiomatisch; die regelmäßige tägliche Darbringung bleibt erhalten.
- source_word: καθὰ ἔχουσιν ἐντολήν
  choice: wie es ihnen geboten ist
  rationale: Gibt die bestehende, weiterhin geltende Verpflichtung in natürlichem modernem Deutsch wieder.
- source_word: ἑπτὰ καὶ δέκα
  choice: siebzehn
  rationale: Idiِomatische deutsche Wiedergabe der Zahl; der im Griechischen unausgesprochene Bezugsgegenstand bleibt offen.
- source_word: προσφέρειν
  choice: darzubringen
  rationale: Passt zum kultischen Zusammenhang und hält die Wiederholung des griechischen Infinitivs sichtbar.
- source_word: ἄλλα τάλαντα δέκα
  choice: zusätzlich ... zehn Talente
  rationale: ἄλλα bezeichnet einen weiteren beziehungsweise zusätzlichen jährlichen Betrag; das Material der Talente wird nicht ergänzt.
- source_word: κατ’ ἐνιαυτόν
  choice: jedes Jahr
  rationale: Natürliche moderne Wiedergabe der jährlichen Regelmäßigkeit.
theological_decisions:
- issue: Unausgesprochenes Bezugswort zu „siebzehn“
  choice: Kein Bezugswort in den Haupttext ergänzen
  alternative: „siebzehn Opfer“ oder „siebzehn Opfertiere“
  rationale: Der griechische Text nennt den Gegenstand nicht ausdrücklich. Eine Ergänzung würde die echte textliche Unbestimmtheit stärker auflösen, als die Quelle erlaubt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der fragmentarische Anschluss mit „und“ sowie die syntaktische Reihung des griechischen Verses werden bewahrt. Die Fußnoten stehen jeweils unmittelbar bei der betreffenden Formulierung.
