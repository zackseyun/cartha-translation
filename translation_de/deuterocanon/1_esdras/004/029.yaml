  yaml_path: translation/deuterocanon/1_esdras/004/029.yaml
  text: They were watching him[a], and Apame, the daughter of the admirable Bartacus, the king’s concubine, sitting at the king’s right hand[b],
translation:
  language: de
  text: Sie beobachteten ihn und Apame, die Tochter des bewundernswerten[a] Bartakos, die Nebenfrau des Königs, die zur Rechten des Königs saß,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „berühmten“ beziehungsweise „angesehenen“.'
    reason: Das griechische θαυμαστός kann je nach Zusammenhang „bewundernswert“, „berühmt“ oder „angesehen“ bedeuten.
lexical_decisions:
- source_word: ἐθεώρουν
  choice: sie beobachteten
  rationale: Der Imperfekt bezeichnet ein andauerndes Betrachten; „beobachteten“ gibt dies im Deutschen natürlich wieder, ohne das nicht ausdrücklich genannte Subjekt näher zu bestimmen.
- source_word: αὐτὸν καὶ Ἀπάμην
  choice: ihn und Apame
  rationale: Beide Akkusative hängen von ἐθεώρουν ab. Die Namensform wird entsprechend dem griechischen Nominativ Ἀπάμη als „Apame“ wiedergegeben.
- source_word: τὴν θυγατέρα Βαρτάκου τοῦ θαυμαστοῦ
  choice: die Tochter des bewundernswerten Bartakos
  rationale: Die Apposition bleibt erhalten. Der Name wird in einer dem Griechischen nahen deutschen Form transliteriert; θαυμαστός wird als beschreibendes Beiwort und nicht als Amtstitel verstanden.
- source_word: τὴν παλλακὴν τοῦ βασιλέως
  choice: die Nebenfrau des Königs
  rationale: „Nebenfrau“ bezeichnet verständlich und historisch angemessen eine Frau mit geringerem Rang als eine Hauptgemahlin; es vermeidet die modernen Nebenbedeutungen von „Geliebte“.
- source_word: καθημένην ἐν δεξιᾷ τοῦ βασιλέως
  choice: die zur Rechten des Königs saß
  rationale: Der griechische Partizipialausdruck wird als natürlicher deutscher Relativsatz wiedergegeben. „Zur Rechten“ bewahrt die traditionelle räumliche Wendung.
theological_decisions:
- issue: Bezug und Subjekt von ἐθεώρουν
  choice: Das unausgesprochene Subjekt bleibt als „sie“ unbestimmt; „ihn und Apame“ sind beide Objekte.
  alternative: Das Subjekt aus dem Zusammenhang ausdrücklich als „die jungen Männer“ benennen oder Apame syntaktisch anders anbinden.
  rationale: Der griechische Satz nennt das Subjekt nicht ausdrücklich und setzt sowohl αὐτόν als auch Ἀπάμην in den Akkusativ. Die Übersetzung ergänzt daher keine kontextuelle Identifizierung.
- issue: Funktion von τοῦ θαυμαστοῦ
  choice: 'beschreibendes Beiwort: „des bewundernswerten Bartakos“'
  alternative: „des berühmten Bartakos“ oder Deutung als förmlicher Ehrenname
  rationale: Das Adjektiv ist ausdrücklich vorhanden, doch der Text weist es nicht eindeutig als offiziellen Titel aus. Die gewählte Fassung erhält die wertende, aber nicht näher festgelegte Aussage.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Kommas und der abschließende Beistrich spiegeln wider, dass der griechische Satz an dieser Stelle syntaktisch weiterläuft. „Nebenfrau“ ist bewusst verständlicher und weniger fremdsprachlich als „Konkubine“, bleibt aber historisch präzise.
