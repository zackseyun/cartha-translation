  yaml_path: translation/deuterocanon/1_esdras/004/048.yaml
  text: And he wrote letters to all the governors in Coele-Syria and Phoenicia and to those in Lebanon[a], to bring cedar timber from Lebanon to Jerusalem[b], so that they might build the city with him.
translation:
  language: de
  text: Und er schrieb Briefe an alle Bezirksstatthalter[a] in Koilesyrien[b] und Phönizien sowie an diejenigen im Libanon, mit der Anweisung, Zedernholz vom Libanon nach Jerusalem zu bringen, um mit ihm die Stadt zu bauen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Gebietsherrscher“ beziehungsweise „örtliche Herrscher“.'
    reason: lexical_alternative
  - marker: b
    text: Koilesyrien ist der historische Name der im griechischen Text genannten Region.
    reason: cultural_note
lexical_decisions:
- source_word: τοπάρχαις
  choice: Bezirksstatthalter
  rationale: Das Wort bezeichnet Amtsträger beziehungsweise Herrscher eines begrenzten Verwaltungsgebiets. „Bezirksstatthalter“ ist im Deutschen verständlich und wahrt den regionalen Verwaltungsbezug.
- source_word: ἐν κοίλῃ Συρίᾳ
  choice: in Koilesyrien
  rationale: Κοίλη Συρία ist hier die historische Gebietsbezeichnung Koilesyrien und keine frei zu übersetzende Beschreibung wie „Hohles Syrien“.
- source_word: Φοινίκῃ
  choice: Phönizien
  rationale: Dies ist die gebräuchliche deutsche Form des historischen Regionsnamens.
- source_word: τοῖς ἐν τῷ Λιβάνῳ
  choice: an diejenigen im Libanon
  rationale: Der griechische Ausdruck wiederholt keinen Amtstitel und lässt die genaue Personengruppe offen. Die Wiedergabe bewahrt diese Unbestimmtheit.
- source_word: μεταφέρειν
  choice: bringen
  rationale: Im Zusammenhang eines schriftlichen Auftrags gibt „bringen“ die Beförderung des Baumaterials natürlich und klar wieder.
- source_word: ξύλα κέδρινα
  choice: Zedernholz
  rationale: Der Ausdruck bezeichnet Zedernholz als Baumaterial; die deutsche Sammelbezeichnung ist idiomatisch und legt nicht unnötig fest, ob Balken oder Stämme gemeint sind.
- source_word: ὅπως οἰκοδομήσωσιν
  choice: damit sie … bauten
  rationale: „Damit“ erhält die Zweckbedeutung von ὅπως; der Konjunktiv im Griechischen wird im deutschen abhängigen Auftrag idiomatisch durch die entsprechende Vergangenheitsform wiedergegeben.
- source_word: μετʼ αὐτοῦ
  choice: mit ihm
  rationale: Die knappe Wiedergabe erhält den Bezug auf gemeinsames beziehungsweise unterstützendes Handeln, ohne die Art der Beteiligung näher festzulegen.
- source_word: τὴν πόλιν
  choice: die Stadt
  rationale: Der griechische Text nennt ausdrücklich die Stadt und nicht den Tempel oder das Haus Gottes.
theological_decisions:
- issue: Umfang des Bauvorhabens
  choice: die Stadt
  alternative: den Tempel beziehungsweise das Haus Gottes
  rationale: τὴν πόλιν bedeutet ausdrücklich „die Stadt“. Eine Angleichung an Tempelbauaussagen verwandter Überlieferungen würde den vorliegenden griechischen Wortlaut verändern.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung wurde gegenüber dem Griechischen maßvoll geordnet, damit Absender, Empfänger und Auftrag klar erkennbar sind. „Diejenigen im Libanon“ bleibt bewusst allgemein, da der griechische Text den Amtstitel dort nicht ausdrücklich wiederholt.
