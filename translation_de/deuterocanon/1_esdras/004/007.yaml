base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/004/007.yaml
  text: And the second will sit beside Darius because of his wisdom[b][a], and he will be called a kinsman of Darius.
translation:
  language: de
  text: Und der Zweite wird wegen seiner Weisheit bei Darius sitzen und ein Verwandter des Darius genannt werden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Verwandter“ kann hier einen tatsächlichen Angehörigen oder eine höfische Ehrenbezeichnung für einen eng mit Darius Verbundenen meinen.
    reason: lexical_alternative
lexical_decisions:
- source_word: δεύτερος
  choice: den zweiten Platz nach Darius
  rationale: Das prädikativ gebrauchte Ordnungszahlwort bezeichnet hier eine Rangstellung. Zusammen mit dem Genitiv Δαρείου wird im Deutschen natürlich ausgedrückt, dass der Betreffende unmittelbar nach Darius steht.
- source_word: καθιεῖται
  choice: wird … einnehmen
  rationale: Das Verb beschreibt hier das Sitzen beziehungsweise Platznehmen in einer ehrenvollen Stellung. „Den zweiten Platz … einnehmen“ gibt im höfischen Zusammenhang sowohl das Sitzen als auch den damit verbundenen Rang verständlich wieder, ohne eine konkrete Amtseinsetzung zu behaupten.
- source_word: διὰ τὴν σοφίαν αὐτοῦ
  choice: wegen seiner Weisheit
  rationale: διά mit Akkusativ ist kausal; „wegen seiner Weisheit“ gibt den Grund knapp und idiomatisch wieder.
- source_word: συγγενής
  choice: Verwandter
  rationale: Das Wort bezeichnet grundsätzlich einen Angehörigen derselben Verwandtschaft, kann im höfischen Umfeld aber auch eine ehrende Bezeichnung für besondere Nähe sein. „Verwandter“ bewahrt den wörtlichen Sinn, während die Fußnote die mögliche titulare Verwendung offenhält.
- source_word: κληθήσεται
  choice: genannt werden
  rationale: Die Passivform bezeichnet das Benennen oder Bezeichnen und lässt offen, ob es sich um tatsächliche Verwandtschaft oder einen Ehrentitel handelt.
