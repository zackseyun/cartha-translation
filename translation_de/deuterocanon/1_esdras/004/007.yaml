  register: Modernes, würdiges Standarddeutsch. Die Rangvorstellung des griechischen Ausdrucks wird natürlich wiedergegeben; bei „Verwandter“ bleibt die mögliche Spannung zwischen familiärer und höfisch-titularer Bedeutung ausdrücklich erhalten.
