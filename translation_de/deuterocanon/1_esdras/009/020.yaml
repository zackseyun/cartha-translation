base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/020.yaml
  text: and they pledged themselves to send away their wives[a], and for atonement[b], rams for their ignorance.
translation:
  language: de
  text: Und sie verpflichteten sich, ihre Frauen fortzuschicken[a], und zur Sühne Widder für ihre Unwissenheit[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher etwa: „sie legten die Hände daran, ihre Frauen fortzuschicken“; die Wendung besagt, dass sie sich dazu verpflichteten oder es verbindlich übernahmen.'
    reason: lexical_alternative
  - marker: b
    text: Im Zusammenhang eines Sühneopfers kann „Unwissenheit“ auch einen Irrtum oder eine unwissentlich begangene Sünde bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέβαλον τὰς χεῖρας
  choice: sie verpflichteten sich
  rationale: Die Wendung bedeutet wörtlich etwa „sie legten die Hände an“, bezeichnet hier mit folgendem Infinitiv jedoch eine verbindliche Übernahme der Handlung; eine körperliche Berührung ist nicht gemeint.
- source_word: ἐκβαλεῖν
  choice: fortzuschicken
  rationale: Das Verb kann „hinauswerfen“ bedeuten, bezeichnet im ehelichen Zusammenhang aber angemessener die Entlassung beziehungsweise Trennung von den Ehefrauen.
- source_word: τὰς γυναῖκας αὐτῶν
  choice: ihre Frauen
  rationale: γυναῖκες bezeichnet hier aufgrund des Zusammenhangs Ehefrauen, nicht Frauen im Allgemeinen.
- source_word: εἰς ἐξιλασμόν
  choice: als Sühne
  rationale: ἐξιλασμός bezeichnet die kultische Sühnung; „als Sühne“ gibt den Zweck beziehungsweise die Funktion der Widder knapp und natürlich wieder.
- source_word: κριούς
  choice: Widder
  rationale: Der griechische Ausdruck bezeichnet ausdrücklich männliche Schafe als Opfertiere.
- source_word: ὑπὲρ τῆς ἀγνοίας αὐτῶν
  choice: für ihre unwissentlich begangene Verfehlung
  rationale: ἀγνοία bedeutet grundsätzlich Unwissenheit, kann im Opferkontext jedoch eine aus Unwissenheit begangene Verfehlung bezeichnen. Die Formulierung bewahrt sowohl das Element des Nichtwissens als auch den kultischen Schuldzusammenhang.
theological_decisions:
- issue: Kultische Bedeutung von ἀγνοία
  choice: unwissentlich begangene Verfehlung
  alternative: Unwissenheit; Irrtum; unbeabsichtigte Sünde
  rationale: Im Zusammenhang mit Sühne und Opfertieren geht es wahrscheinlich nicht um bloßes fehlendes Wissen, sondern um daraus entstandene Schuld. Die Übersetzung macht diesen Zusammenhang verständlich, ohne Absichtslosigkeit stärker zu behaupten, als der griechische Ausdruck erlaubt.
- issue: Idiomatische Bedeutung von ἐπέβαλον τὰς χεῖρας
  choice: sie verpflichteten sich
  alternative: sie legten die Hände an; sie unternahmen es
  rationale: Eine wörtliche Wiedergabe wäre im Deutschen missverständlich und könnte körperlichen Zugriff oder Handauflegung nahelegen. Gemeint ist die verbindliche Übernahme der folgenden Handlung.
- issue: Elliptische Formulierung des Sühneopfers
  choice: und als Sühne Widder für …
  alternative: und brachten als Sühne Widder für … dar
  rationale: Das griechische Satzglied nennt Widder zur Sühne, enthält aber kein ausdrückliches Verb für das Darbringen. Die Ellipse bleibt im Haupttext erhalten, damit nichts stillschweigend ergänzt wird.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Frauen“ ist hier im üblichen biblisch-historischen Sinn von Ehefrauen gebraucht. Die ungewöhnliche Ellipse im zweiten Satzteil wurde entsprechend dem Griechischen bewahrt; die Fußnoten erläutern die beiden semantisch offenen Wendungen.
