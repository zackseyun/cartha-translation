lexical_decisions:
- source_word: ἐκ τῶν
  choice: Von den
  rationale: Die Wendung führt Personen aus einer größeren Gruppe an; „von den“ ist in einer deutschen Aufzählung knapp und natürlich.
- source_word: ἱεροψαλτῶν
  choice: Tempelsängern
  rationale: Das Kompositum bezeichnet Sänger im heiligen beziehungsweise kultischen Dienst. „Tempelsänger“ gibt den institutionellen und sakralen Bezug klar wieder.
- source_word: Ἐλιάσεβος
  choice: Eliasib
  rationale: Der Name wird nach der griechischen Form wiedergegeben. Die hebräisch ausgerichtete Form „Eljaschib“ bleibt als textgeschichtlich bedeutsame Alternative in der Fußnote erhalten.
- source_word: Βάκχουρος
  choice: Bacchurus
  rationale: Der Eigenname wird aus dem Griechischen transliteriert, ohne eine nicht belegte hebräische Entsprechung zu rekonstruieren.
