translation:
  language: de
  text: Denn auch sie wurden von den Worten erfüllt, in denen sie unterwiesen worden waren[a], und sie wurden zusammengeführt.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hier verwendete griechische Verb ist selten und kann auch im Sinn von „wurden von den Worten durchdrungen“, „wurden durch sie angeregt“ oder „gewannen Einsicht“ verstanden werden. Die hebräische Parallele in Nehemia 8,13 spricht davon, Einsicht in die Worte des Gesetzes zu gewinnen.
    reason: lexical_alternative
  - marker: b
    text: 'Das Griechische steht im Passiv: „sie wurden zusammengeführt“. Die hebräische Parallele in Nehemia 8,13 formuliert aktiv: „sie kamen zusammen“.'
    reason: cross_reference
lexical_decisions:
- source_word: ὅτι
  choice: Denn
  rationale: Leitet einen erklärenden beziehungsweise begründenden Satz ein und gibt den Zusammenhang im Deutschen natürlich wieder.
- source_word: καὶ
  choice: auch
  rationale: Bewahrt die additive Bedeutung der Partikel, ohne den Satz mit einem zusätzlichen „und“ zu überladen.
- source_word: ἐνεφυσιώθησαν
  choice: erfüllten sie
  rationale: Das seltene Verb bezeichnet hier wohl ein inneres Erfüllt- oder Durchdrungensein. Die aktive deutsche Formulierung mit den Worten als Subjekt ist idiomatisch, wahrt aber durch die Fußnote die lexikalische Unsicherheit.
- source_word: ἐν τοῖς ῥήμασιν
  choice: die Worte
  rationale: ῥήματα wird im Zusammenhang der Unterweisung transparent als „Worte“ wiedergegeben; die Konstruktion wird für natürliches Deutsch umgestellt.
- source_word: οἷς ἐδιδάχθησαν
  choice: in denen sie unterwiesen worden waren
  rationale: Bewahrt den Rückbezug des Relativpronomens sowie Passiv und Vorzeitigkeit des griechischen Ausdrucks.
- source_word: ἐπισυνήχθησαν
  choice: sie wurden zusammengerufen
  rationale: Gibt das griechische Passiv wieder und klingt im Deutschen natürlicher als das schwerfällige „wurden versammelt“; die mögliche Wiedergabe „kamen zusammen“ wird in der Fußnote genannt.
