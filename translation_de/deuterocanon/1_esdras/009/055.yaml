translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnliche und mehrdeutige Aussage des griechischen Hauptverbs wird im Text verständlich wiedergegeben, aber nicht auf die Lesart der hebräischen Parallele eingeengt. Das griechische Passiv des Schlusssatzes bleibt erhalten.
