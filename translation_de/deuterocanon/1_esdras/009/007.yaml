base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/007.yaml
  text: And Ezra rose and said to them[a], “You have acted lawlessly and have married foreign women, adding sin to Israel.”
translation:
  language: de
  text: 'Und Esra stand auf und sagte zu ihnen: „Ihr habt gegen das Gesetz gehandelt und mit Frauen aus anderen Völkern zusammengelebt[a] und damit Israels Sünde vermehrt.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Frauen aus anderen Völkern geheiratet“ beziehungsweise „als Ehefrauen genommen“. Das griechische Verb bedeutet wörtlich „zusammenleben“; im Zusammenhang geht es um eheliche Verbindungen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστὰς
  choice: stand auf
  rationale: Das Aoristpartizip von ἀνίστημι leitet Esras Rede mit einer knappen erzählerischen Bewegung ein.
- source_word: ἠνομήσατε
  choice: habt gegen das Gesetz gehandelt
  rationale: Die Wendung bewahrt den Gesetzesbezug von ἀνομέω und klingt im modernen Deutschen natürlicher als „gesetzlos gehandelt“.
- source_word: συνῳκίσατε
  choice: habt … zusammengelebt
  rationale: Die Übersetzung folgt dem unmittelbaren Wortsinn „zusammen wohnen/leben“, ohne den im Kontext naheliegenden ehelichen Sinn stillschweigend festzuschreiben.
- source_word: γυναιξὶν ἀλλογενέσιν
  choice: mit Frauen aus anderen Völkern
  rationale: ἀλλογενής bezeichnet Menschen, die einem anderen Volk angehören. Diese Formulierung gibt den ethnisch-sozialen Sinn deutlicher wieder als das moderne, mehrdeutige „ausländisch“.
- source_word: προσθεῖναι ἁμαρτίαν τῷ Ἰσραήλ
  choice: damit Israels Sünde vermehrt
  rationale: Die resultative Aussage des Infinitivs und die kollektive Dimension der Sünde Israels werden in natürlichem Deutsch bewahrt.
theological_decisions:
- issue: Ehelicher Sinn von συνῳκίσατε
  choice: Im Haupttext steht „zusammengelebt“; die mögliche Bedeutung „geheiratet/als Ehefrauen genommen“ wird in der Fußnote genannt.
  alternative: habt Frauen aus anderen Völkern geheiratet
  rationale: Das griechische Verb bezeichnet unmittelbar das Zusammenleben, während der Zusammenhang eheliche Verbindungen nahelegt. Die Übersetzung bewahrt diese Spannung, statt sie eindeutig aufzulösen.
- issue: Kollektive Dimension der Sünde
  choice: Israels Sünde vermehrt
  alternative: Israel weitere Schuld aufgeladen
  rationale: Die Formulierung erhält die Aussage, dass das Handeln die Sünde des Volkes insgesamt vermehrt, ohne das Bild einer aufgeladenen Last in den Text einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Frauen aus anderen Völkern“ vermeidet sowohl archaisches „fremdländische Frauen“ als auch die moderne staatsrechtliche Färbung von „ausländische Frauen“.
