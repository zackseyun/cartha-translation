base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/008.yaml
  text: And now give confession and glory to the Lord God of our fathers[b][a],
translation:
  language: de
  text: Und nun legt dem Herrn, dem Gott unserer Väter, ein Bekenntnis[a] ab und gebt ihm die Ehre.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »eine Anerkennung«. Das griechische Wort kann sowohl ein Bekenntnis als auch eine Anerkennung bezeichnen; der Zusammenhang spricht hier für »Bekenntnis«.'
    reason: lexical_alternative
  - marker: b
    text: Der hier zugrunde liegende griechische Wortlaut ist knapp und weicht in Umfang beziehungsweise Verszuordnung von der überlieferten hebräischen Parallelfassung in Esra ab. Übersetzt wird der griechische Text.
    reason: textual_variant
lexical_decisions:
- source_word: καὶ νῦν
  choice: Und nun
  rationale: Bewahrt sowohl den Anschluss an die vorherige Rede als auch den zeitlichen Nachdruck.
- source_word: δότε
  choice: legt … ab und gebt
  rationale: Das griechische Verb regiert beide Substantive. Im Deutschen verlangt die Verbindung mit »Bekenntnis« eine andere idiomatische Fügung als die mit »Ehre«; die Aufteilung macht den Sinn natürlich verständlich, ohne einen zusätzlichen inhaltlichen Befehl einzuführen.
- source_word: ὁμολογίαν
  choice: ein Bekenntnis
  rationale: ὁμολογία kann ein Bekenntnis oder eine Anerkennung bezeichnen. Im Zusammenhang der Umkehr und des Eingeständnisses von Verfehlung ist »Bekenntnis« angemessen, ohne den nicht ausdrücklich genannten Gegenstand als »Schuld« oder »Sünde« in den Haupttext einzutragen.
- source_word: δόξαν
  choice: die Ehre
  rationale: Die Wendung »jemandem die Ehre geben« ist im heutigen Deutsch natürlicher als »Herrlichkeit geben« und gibt hier den Aufforderungscharakter von δόξαν δότε treffend wieder.
- source_word: τῷ κυρίῳ θεῷ
  choice: vor dem Herrn, dem Gott
  rationale: κύριος wird in diesem jüdisch-schriftlichen Kontext mit »Herr« wiedergegeben. Wegen der im Deutschen idiomatischen Wendung »ein Bekenntnis vor jemandem ablegen« steht der erste Teil mit »vor«; der zweite nimmt den Empfänger mit »ihm« wieder auf.
- source_word: τῶν πατέρων ἡμῶν
  choice: unserer Väter
  rationale: Bewahrt die ausdrücklich maskuline, traditionelle Bundesformel des griechischen Textes; »Vorfahren« wäre möglich, aber weniger formnah.
theological_decisions:
- issue: Bedeutung von ὁμολογίαν im Bußzusammenhang
  choice: Bekenntnis
  alternative: Anerkennung
  rationale: Der Zusammenhang legt ein reuevolles Eingeständnis nahe. »Bekenntnis« wahrt diesen Ernst, ohne im Haupttext ausdrücklich »Sündenbekenntnis« zu ergänzen.
- issue: Verhältnis von Bekenntnis und Ehre
  choice: Zwei koordinierte Handlungen unter einer Aufforderung
  alternative: 'Apposition oder Hendiadyoin: ein Bekenntnis als Ehrung Gottes'
  rationale: Der knappe griechische Wortlaut stellt ὁμολογίαν und δόξαν ohne verbindendes καί nebeneinander. Die deutsche Koordination ist die verständlichste Wiedergabe, legt aber nicht fest, ob die Begriffe im Griechischen enger aufeinander bezogen sind.
- issue: Wiedergabe von πατέρων
  choice: Väter
  alternative: Vorfahren
  rationale: Die feste biblische Formel und die grammatisch maskuline Bezeichnung bleiben erhalten, ohne eine konfessionelle Sonderdeutung einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die etwas unnatürliche wörtliche Verbindung »Bekenntnis und Ehre geben« wurde idiomatisch entfaltet. Dabei bleibt die Wiederholung des göttlichen Adressaten durch »ihm« rein grammatisch und fügt keinen neuen theologischen Gehalt hinzu.
