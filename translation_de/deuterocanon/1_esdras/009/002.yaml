base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/002.yaml
  text: And lodging there[a], he tasted no bread and drank no water[b], mourning over the great lawless deeds of the multitude.
translation:
  language: de
  text: Und nachdem er dort übernachtet hatte[a], kostete er kein Brot und trank kein Wasser. Er trauerte über die schweren Gesetzesverstöße[b] des Volkes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dort sein Nachtlager aufgeschlagen hatte“ beziehungsweise „dort die Nacht verbracht hatte“. Das griechische Partizip bezeichnet das Übernachten an diesem Ort.'
    reason: lexical_alternative
  - marker: b
    text: Die hebräische Parallele in Esra 10 nennt als konkretes Vergehen die Heirat mit fremden Frauen; der griechische Text fasst das Fehlverhalten hier allgemeiner als „Gesetzesverstöße“ zusammen.
    reason: alternative_reading
lexical_decisions:
- source_word: αὐλισθεὶς
  choice: nachdem er dort übernachtet hatte
  rationale: Das Partizip von αὐλίζομαι bezeichnet, dass jemand an einem Ort die Nacht verbringt. „Übernachten“ gibt diesen zeitweiligen Aufenthalt im modernen Deutsch präzise und natürlich wieder.
- source_word: ἄρτον οὐκ ἐγεύσατο
  choice: kostete er kein Brot
  rationale: Die Wiedergabe bewahrt sowohl das konkrete „Brot“ als auch die Grundbedeutung von γεύομαι („kosten“). Im Zusammenhang bezeichnet die Wendung das Fasten.
- source_word: ὕδωρ ἔπιεν
  choice: trank kein Wasser
  rationale: Die konkrete Formulierung des griechischen Textes wird unmittelbar wiedergegeben und bildet mit dem Verzicht auf Brot ein Paar.
- source_word: πενθῶν
  choice: Er trauerte
  rationale: πενθέω bezeichnet tiefe, feierlich-ernste Trauer und passt hier zum bußfertigen Zusammenhang.
- source_word: τῶν ἀνομιῶν τῶν μεγάλων
  choice: über die schweren Gesetzesverstöße
  rationale: ἀνομία bezeichnet ein Handeln gegen Gesetz und Ordnung, nicht bloß allgemeines Fehlverhalten. „Schwer“ gibt die verstärkende Funktion von μεγάλων im natürlichen Deutschen wieder, ohne die Aussage abzuschwächen.
- source_word: τοῦ πλήθους
  choice: der Volksmenge
  rationale: πλῆθος bezeichnet die Menge beziehungsweise Gesamtheit der beteiligten Menschen. „Volksmenge“ bewahrt den kollektiven Sinn enger als eine bloße Auflösung zu „Menschen“.
theological_decisions:
- issue: Moralisch-theologische Aussage von ἀνομία
  choice: Gesetzesverstöße
  alternative: Verfehlungen; Ungerechtigkeiten; Gesetzlosigkeiten
  rationale: „Gesetzesverstöße“ hält fest, dass das Verhalten gegen eine maßgebliche göttliche Ordnung gerichtet ist, ohne spätere dogmatische Kategorien einzutragen. Die allgemeinere Formulierung des griechischen Textes wird nicht anhand der hebräischen Parallele auf ein bestimmtes Vergehen eingeengt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die konkrete Fastensprache des Griechischen („Brot kosten“, „Wasser trinken“) bleibt erhalten. „Volksmenge“ ist bewusst etwas formeller, um den kollektiven Ausdruck πλῆθος abzubilden; die Satzteilung sorgt dennoch für gute Lesbarkeit.
