base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/044.yaml
  text: 'And from the left: Phaladaios[a], Meisael, Melcheias, Lothasoubos, Nabareias[b], Zechariah.'
translation:
  language: de
  text: 'Und von der linken Seite: Phaladaios[a], Meisael, Melcheias, Lothasubos, Nabareias[b] und Sacharja.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „von links“. Die griechische Wendung bezeichnet die Stellung innerhalb der versammelten oder geordneten Gruppe.'
    reason: lexical_alternative
  - marker: b
    text: Mehrere Namen in diesem Vers stehen in den besonderen griechischen Formen des 1. Esdrasbuches. Sie könnten in parallelen Überlieferungen vertrauteren hebräischen Namen entsprechen; im Haupttext werden jedoch die griechischen Formen wiedergegeben.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐξ εὐωνύμων
  choice: auf der linken Seite
  rationale: Die Wendung bezeichnet räumlich die linke Seite einer geordneten Gruppe. Im Deutschen ist „auf der linken Seite“ in diesem Listenabschnitt natürlicher als das wörtlichere „von links“.
- source_word: Φαλαδαῖος
  choice: Phaladaios
  rationale: Der Personenname wird unmittelbar nach seiner griechischen Form transliteriert.
- source_word: Μεισαήλ
  choice: Meisael
  rationale: Die griechische Namensform wird beibehalten, statt sie ohne sichere Grundlage an eine vertrautere hebräische Form anzugleichen.
- source_word: Μελχείας
  choice: Melcheias
  rationale: Die Wiedergabe folgt der griechischen Form des Eigennamens.
- source_word: Λωθάσουβος
  choice: Lothasubos
  rationale: Der seltene Name wird quellennah transliteriert; griechisches ου wird dabei als „u“ wiedergegeben.
- source_word: Ναβαρείας
  choice: Nabareias
  rationale: Die griechische Namensform bleibt erhalten, da eine Identifizierung mit einer geläufigeren hebräischen Form unsicher ist.
- source_word: Ζαχαρίας
  choice: Sacharja
  rationale: Für den geläufigen biblischen Namen wird die im Deutschen etablierte alttestamentliche Form verwendet.
theological_decisions: []
translation_notes:
  register: Knappes, würdevolles Standarddeutsch. Die einleitende Ortsangabe und der Charakter einer Namensliste bleiben erhalten. Seltene Namen folgen dem griechischen Primärtext; nur Sacharja erscheint in seiner etablierten deutschen Bibelform.
