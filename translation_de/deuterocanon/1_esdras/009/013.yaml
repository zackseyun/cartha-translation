base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/013.yaml
  text: the elders and the judges of each place[b][a], until the anger of the Lord over this matter is turned away from us.
translation:
  language: de
  text: die Ältesten und die Richter jedes Ortes[a], bis der Zorn des Herrn wegen dieser Sache von uns abgewendet ist.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der griechische Text ist hier ein Satzfragment, das syntaktisch vom vorausgehenden Vers abhängt.
    reason: textual_note
  - marker: b
    text: 'Oder: „bis der Zorn des Herrn in dieser Sache von uns abgewendet ist“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑκάστου τόπου
  choice: jedes Ortes
  rationale: Der Genitiv bestimmt sowohl „Ältesten“ als auch „Richter“ und bewahrt den distributiven Sinn, ohne den Ort näher als Stadt oder Bezirk festzulegen.
- source_word: πρεσβυτέρους
  choice: die Ältesten
  rationale: Im administrativen Zusammenhang bezeichnet der Ausdruck anerkannte örtliche Autoritäten, nicht lediglich ältere Männer.
- source_word: κριτάς
  choice: die Richter
  rationale: Der rechtliche Kontext spricht für die direkte und verständliche Wiedergabe „Richter“.
- source_word: ἕως τοῦ λῦσαι
  choice: bis … abgewendet ist
  rationale: Bei „Zorn“ als Objekt gibt die idiomatische Wendung das erreichte Ziel des Lösens oder Beseitigens wieder.
- source_word: ὀργὴν Κυρίου
  choice: der Zorn des Herrn
  rationale: „Zorn“ bewahrt den Ernst göttlichen Missfallens und entspricht in würdigem modernem Deutsch dem griechischen ὀργή; κύριος wird als „Herr“ wiedergegeben.
- source_word: ἀφʼ ἡμῶν
  choice: von uns
  rationale: Die Präposition bezeichnet die Trennung des Zorns von der Gemeinschaft.
- source_word: τοῦ πράγματος τούτου
  choice: wegen dieser Sache
  rationale: Der gedrängte Genitiv lässt sich kausal verstehen und bezeichnet die Sache als Anlass des göttlichen Zorns; die mögliche allgemeinere Beziehung bleibt in einer Fußnote sichtbar.
theological_decisions:
- issue: Wiedergabe von κύριος im griechischen deuterokanonischen Text
  choice: Herr
  alternative: HERR
  rationale: Der griechische Ausgangstext bietet κύριος; „Herr“ ist die direkte ehrerbietige Wiedergabe, ohne eine nicht ausdrücklich markierte Rückübersetzung zum Gottesnamen typografisch einzutragen.
- issue: Stärke von ὀργή als Bezeichnung göttlichen Missfallens
  choice: Zorn
  alternative: Ärger
  rationale: „Zorn“ ist im Deutschen natürlich und bewahrt die theologische und gerichtliche Ernsthaftigkeit des Ausdrucks.
- issue: Syntaktische Unvollständigkeit des Verses
  choice: Das Satzfragment bleibt als Fortsetzung des vorausgehenden Verses erhalten.
  alternative: Eine Handlung wie „sollen bestimmen“ im Vers ergänzen.
  rationale: Der griechische Text beginnt mit Akkusativobjekten und hängt syntaktisch vom vorhergehenden Vers ab. Eine Ergänzung im Haupttext würde mehr festlegen, als der vorliegende Wortlaut ausdrückt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die fragmentarische Form des griechischen Verses wird bewahrt und erklärt; keine implizite Handlung wird ergänzt.
