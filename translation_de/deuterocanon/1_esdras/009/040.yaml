base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/040.yaml
  text: And Ezra the chief priest brought the law before all the multitude[a], from man to woman, and all the priests, to hear the law, on the new moon of the seventh month.
translation:
  language: de
  text: Und Esra, der Hohepriester, brachte der gesamten Menge – vom Mann bis zur Frau – sowie allen Priestern das Gesetz, damit sie das Gesetz hörten, am Neumond des siebten Monats.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκόμισεν
  choice: brachte
  rationale: Das Verb bezeichnet hier das Herbeibringen des Gesetzes zur versammelten Menge; „brachte“ bleibt eng am Griechischen, ohne eine feierliche Präsentation zusätzlich auszudeuten.
- source_word: ὁ ἀρχιερεύς
  choice: der Hohepriester
  rationale: „Hohepriester“ ist die natürliche und etablierte deutsche Entsprechung für ἀρχιερεύς und gibt den leitenden priesterlichen Rang wieder.
- source_word: τὸν νόμον
  choice: das Gesetz
  rationale: Der griechische Text nennt schlicht „das Gesetz“. Die im hebräischen Paralleltext erwähnte Gesetzesrolle beziehungsweise das Gesetzbuch wird daher nicht ergänzt.
- source_word: παντὶ τῷ πλήθει
  choice: der ganzen Menge
  rationale: πλῆθος bezeichnet die große versammelte Menschenmenge. „Die ganze Menge“ ist im Deutschen verständlich und bewahrt den kollektiven Ausdruck.
- source_word: ἀπὸ ἀνθρώπου ἕως γυναικός
  choice: vom Mann bis zur Frau
  rationale: Die Formulierung bildet die distributive, geschlechtlich bestimmte Wendung des Griechischen eng nach, ohne sie zu verallgemeinern oder zu neutralisieren.
- source_word: πᾶσιν τοῖς ἱερεῦσιν
  choice: allen Priestern
  rationale: Die maßgebliche griechische Vorlage nennt ausdrücklich „alle Priester“. Die abweichende Beschreibung im hebräischen Paralleltext wird in einer Fußnote dokumentiert.
- source_word: ἀκοῦσαι τὸν νόμον
  choice: damit sie das Gesetz hörten
  rationale: Der Infinitiv bezeichnet den Zweck des Bringens. Der finite Zwecksatz ist natürliches modernes Deutsch und fügt keine ausdrückliche „Lesung“ hinzu, die im Griechischen nicht genannt wird.
- source_word: νουμηνίᾳ τοῦ ἑβδόμου μηνός
  choice: am Neumond des siebten Monats
  rationale: νουμηνία bezeichnet den Neumond beziehungsweise Neumondstag. Die direkte Wiedergabe bewahrt die griechische Zeitangabe.
theological_decisions:
- issue: Geschlechtlich bestimmte Beschreibung der Zuhörerschaft
  choice: vom Mann bis zur Frau
  alternative: Männer wie Frauen
  rationale: Die gewählte Fassung bewahrt die auffällige distributive Formulierung der griechischen Vorlage, statt sie durch eine glattere inklusive Umschreibung zu ersetzen.
- issue: Zusammensetzung der Zuhörerschaft im griechischen Text gegenüber dem masoretischen Paralleltext
  choice: allen Priestern
  alternative: allen, die verstehen konnten
  rationale: Für 1 Esdras ist der griechische Text die primäre Übersetzungsgrundlage. Seine Lesart wird im Haupttext beibehalten; die bedeutsame Abweichung des hebräischen Paralleltexts erscheint in der Fußnote.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau folgt dem griechischen Gedankengang, während der Zwecksatz mit „damit“ die Infinitivkonstruktion idiomatisch wiedergibt. Die bewusst ungewöhnliche Wendung „vom Mann bis zur Frau“ bewahrt die Eigenart der Vorlage.
