base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/053.yaml
  text: And the Levites kept instructing all the people[a], saying, “This day is holy; do not grieve.”
translation:
  language: de
  text: 'Und die Leviten wiesen das ganze Volk immer wieder an und sagten: »Dieser Tag ist heilig; seid nicht traurig.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ Λευεῖται
  choice: die Leviten
  rationale: Die übliche und sachlich genaue deutsche Bezeichnung der kultischen Gruppe.
- source_word: ἐκέλευον
  choice: wiesen … immer wieder an
  rationale: Das Imperfekt bezeichnet eine fortdauernde oder wiederholte Handlung; ἐκέλευον trägt den Sinn verbindlicher Aufforderung bzw. Anweisung.
- source_word: τῷ δήμῳ πάντα
  choice: das ganze Volk
  rationale: δήμῳ bezeichnet hier das Volk bzw. die versammelte Bevölkerung; πάντα wird sinngemäß umfassend beziehungsweise distributiv verstanden.
- source_word: λέγοντες
  choice: und sagten
  rationale: Natürliche deutsche Wiedergabe des Partizips, das die direkte Rede einleitet.
- source_word: Ἡ ἡμέρα αὕτη ἁγία
  choice: Dieser Tag ist heilig
  rationale: Bewahrt sowohl die demonstrative Aussage αὕτη als auch die religiöse Bedeutung von ἁγία.
- source_word: μὴ λυπεῖσθε
  choice: seid nicht traurig
  rationale: Die Form bezeichnet einen Zustand von Trauer oder Betrübnis. Die Formulierung ist im modernen Deutsch natürlich und lässt offen, ob konkrete Trauer, Kummer oder allgemeine Betrübnis gemeint ist.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholte bzw. fortdauernde Nuance des Imperfekts wird durch »immer wieder« sichtbar gemacht; die direkte Rede bleibt knapp und eindringlich.
