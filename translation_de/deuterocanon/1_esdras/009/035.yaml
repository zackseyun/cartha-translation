base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/035.yaml
  text: 'From the sons of Ooma: Zeitias[a], Zabadias, Edos, Ouel[b], and Banaias.'
translation:
  language: de
  text: 'Aus der Sippe Oomas[b]: Zeitias, Zabadaias, Edos, Uel und Banaias.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der griechische Text führt diese Namen einzeln auf. Der ungefähr entsprechende Abschnitt in Esra 10 im masoretischen Text schließt an dieser Stelle stattdessen mit einer zusammenfassenden Aussage.
    reason: cross_reference
  - marker: b
    text: Wörtlich steht im Griechischen elliptisch „von denen Oomas“. Gemeint sind offenbar Angehörige des Hauses oder der Sippe Oomas; ob ausdrücklich „Söhne“ gemeint ist, bleibt unausgesprochen.
    reason: cultural_note
lexical_decisions:
- source_word: ἐκ τῶν Ὀομά
  choice: Aus der Sippe Oomas
  rationale: 'Die griechische Wendung ist elliptisch: Nach ἐκ τῶν steht der Eigenname und bezeichnet offenbar Angehörige eines Hauses oder einer Sippe. „Aus der Sippe Oomas“ macht diese Zugehörigkeit verständlich, ohne sie enger als nötig als leibliche Sohnschaft festzulegen.'
- source_word: Ζειτιάς
  choice: Zeitias
  rationale: Direkte, im Deutschen gut lesbare Umschrift der griechischen Namensform.
- source_word: Ζαβαδαίας
  choice: Zabadaias
  rationale: Die griechische Form wird bewahrt und nicht an eine vermutete hebräische Namensform angeglichen.
- source_word: Ἠδός
  choice: Edos
  rationale: Lesbare deutsche Umschrift der griechischen Namensform ohne Längenzeichen.
- source_word: Οὐὴλ
  choice: Uel
  rationale: Das griechische Οὐ- wird nach deutscher Umschrift als „U“ wiedergegeben; auf eine Angleichung an einen möglichen semitischen Namen wird verzichtet.
- source_word: Βαναίας
  choice: Banaias
  rationale: Direkte Umschrift des griechischen Namens, statt ihn nach einer möglichen hebräischen Entsprechung zu normalisieren.
