base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/022.yaml
  text: 'And from the sons of Phaisour: Elionais[a], Asseias, Ismaēlos, Nathanaēlos, Okaēlēdos[c][b], and Salthas.'
translation:
  language: de
  text: 'Und von den Söhnen Phaisurs[a]: Elionais, Asseias, Ismaelos, Nathanaelos, Okailedos[b][c] und Salthas.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Griechisch Phaisur; die ungefähre hebräische Parallelüberlieferung entspricht Paschhur.
    reason: alternative_reading
  - marker: b
    text: Der Name Okailedos folgt hier dem griechischen Text. Die ungefähre hebräische Parallelüberlieferung könnte auf einen anderen zugrunde liegenden Namen weisen, der bisweilen mit Josabad gleichgesetzt wird.
    reason: textual_variant
  - marker: c
    text: Mehrere Namen dieses Verses stehen im Griechischen in Formen, die nicht genau mit der ungefähren hebräischen Parallelüberlieferung übereinstimmen. Da 1 Esdras hier nach dem griechischen Text übersetzt wird, bleiben dessen Namensformen erhalten.
    reason: cultural_note
lexical_decisions:
- source_word: ἐκ τῶν υἱῶν
  choice: von den Söhnen
  rationale: Die Listenformel bezeichnet Angehörige einer Familie beziehungsweise Sippe. Die knappe Wiedergabe wahrt die genealogische Struktur des Griechischen.
- source_word: Φαισούρ
  choice: Phaisur
  rationale: Der Name wird nach dem maßgeblichen griechischen Text wiedergegeben und nicht stillschweigend an die hebräische Parallelüberlieferung angeglichen.
- source_word: Ἐλιωναίς
  choice: Elionais
  rationale: Direkte, im Deutschen lesbare Umschrift der griechischen Namensform.
- source_word: Ἀσσείας
  choice: Asseias
  rationale: Die Umschrift bewahrt das doppelte Sigma und die griechische Namensform.
- source_word: Ἰσμαήλος
  choice: Ismaelos
  rationale: Die Form folgt dem griechischen Ausgangstext; die geläufigere hebräisch geprägte Form Ismael wird nicht zur Harmonisierung eingesetzt.
- source_word: Ναθανάηλος
  choice: Nathanaelos
  rationale: Die Umschrift folgt der griechischen Namensform, ohne sie an Nethanel oder eine andere Form der Parallelüberlieferung anzugleichen.
- source_word: Ὠκαιληδός
  choice: Okaeledos
  rationale: Der schwierige Eigenname wird unmittelbar aus Swetes griechischem Text umgeschrieben; eine mögliche andere zugrunde liegende Namensform wird in der Fußnote genannt.
- source_word: Σάλθας
  choice: Salthas
  rationale: Die griechische Namensform bleibt erhalten, statt einen vermuteten hebräischen Namen in den Haupttext einzusetzen.
