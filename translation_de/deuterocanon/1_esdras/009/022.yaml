translation_notes:
  register: Knapper, würdiger Listenstil in modernem Standarddeutsch. Die Eigennamen werden lesbar aus dem Griechischen umgeschrieben; Eta wird dabei mit e wiedergegeben. Die Textspannung zwischen der griechischen Hauptquelle und der nur ungefähren hebräischen Parallelüberlieferung bleibt durch Fußnoten sichtbar.
