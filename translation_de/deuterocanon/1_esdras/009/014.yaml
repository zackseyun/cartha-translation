base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/014.yaml
  text: Jonathan son of Azael and Hezekiah son of Thocanus accepted this[c][b][a], and Mosollamus and Levi and Sabbataeus joined in deciding with them.
translation:
  language: de
  text: Jonathan, der Sohn Asaëls, und Hiskia, der Sohn des Thokanus, nahmen dies an[c]; Mosollamus, Levi und Sabbatäus wirkten gemeinsam mit ihnen bei der Entscheidung mit[b][a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die griechischen Namen weichen hier von denen im annähernden hebräischen Paralleltext in Esra 10 ab; dort stehen vergleichbare Formen wie Meschullam für Mosollamus und Schabbetai für Sabbatäus.
    reason: alternative_reading
  - marker: b
    text: Das mit »wirkten gemeinsam mit ihnen bei der Entscheidung mit« wiedergegebene Verb ist selten. Es kann auch bedeuten, dass diese Männer als Beisitzer mitwirkten oder gemeinsam mit ihnen ein Urteil abgaben.
    reason: lexical_alternative
  - marker: c
    text: Der griechische Text von 1 Esdras stimmt hier im Wortlaut nicht eng mit dem masoretischen Paralleltext überein. Namen und Formulierung folgen daher in erster Linie dem griechischen Textzeugen.
    reason: textual_variant
lexical_decisions:
- source_word: ἐπεδέξαντο κατὰ ταῦτα
  choice: nahmen dies an
  rationale: Das Medium ἐπεδέξαντο bezeichnet hier wahrscheinlich die Annahme beziehungsweise Übernahme der zuvor beschriebenen Regelung; κατὰ ταῦτα stellt den Bezug auf diese Regelung her. Die knappe deutsche Wendung bewahrt den Sinn, ohne eine Zustimmung oder Verpflichtung übermäßig zu präzisieren.
- source_word: συνεβράβευσαν αὐτοῖς
  choice: wirkten bei der Entscheidung mit ihnen zusammen
  rationale: Das seltene Verb weist auf gemeinsames Entscheiden, Beurteilen oder Schlichten. Die Formulierung gibt die richterlich-beratende Beteiligung wieder, ohne ein bestimmtes Amt vorauszusetzen.
- source_word: Ἰωνάθας Ἀζαήλου
  choice: Jonathan, der Sohn Asaëls
  rationale: Der griechische Genitiv wird entsprechend dem patronymischen Gebrauch als Abstammungsangabe verstanden. Jonathan ist die geläufige deutsche Namensform; Asaël gibt Ἀζαήλ angemessen wieder.
- source_word: Ἐξειας Θοκάνου
  choice: Hiskia, der Sohn Thokanus’
  rationale: Ἐξειας entspricht dem bekannten semitischen Namen Hiskia. Für Θοκάνος ist keine sichere traditionelle deutsche Entsprechung gegeben, daher wird die griechische Form eingedeutscht transliteriert.
- source_word: Μοσόλλαμος
  choice: Mosollamus
  rationale: Da der griechische Text die primäre Grundlage bildet, wird der dortige Name transliteriert und nicht durch die Form des nur annähernden hebräischen Paralleltextes ersetzt.
- source_word: Λευεὶς
  choice: Levi
  rationale: Die Singularform steht in der Namensliste als Personenname und bezeichnet hier nicht die Leviten als Gruppe.
- source_word: Σαββαταῖος
  choice: Sabbatäus
  rationale: Die Form wird aus dem primären griechischen Zeugen in üblicher deutscher Schreibweise transliteriert; die abweichende hebräische Parallelform wird in der Fußnote genannt.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Syntax bleibt übersichtlich; vertraute biblische Namensformen werden verwendet, soweit sie aus dem Griechischen sicher erkennbar sind. Die seltene rechtlich-administrative Wendung wird verständlich, aber bewusst nicht technisch oder konfessionell festgelegt wiedergegeben.
