base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/045.yaml
  text: And Ezra took up the book before the multitude[a], for he was seated prominently before them all[c][b],
translation:
  language: de
  text: Und Esra nahm das Buch[b] vor der versammelten Menge[a] zur Hand; denn er saß in hervorgehobener Stellung vor ihnen allen[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „vor der Menschenmenge“ beziehungsweise „vor der Versammlung“.'
    reason: lexical_alternative
  - marker: b
    text: Das griechische Wort kann auch eine Buchrolle bezeichnen.
    reason: cultural_note
  - marker: c
    text: 'Oder: „saß ausgezeichnet“ oder „saß ehrenvoll“. Das griechische Adverb bezeichnet eine öffentlich hervorgehobene Stellung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναλαβών
  choice: nahm … zur Hand
  rationale: Das Partizip bezeichnet hier das Aufnehmen beziehungsweise Ergreifen eines Gegenstands. „Zur Hand nehmen“ gibt die konkrete Handlung natürlich wieder, ohne ein zeremonielles Hochheben vorauszusetzen.
- source_word: τὸ βιβλίον
  choice: das Buch
  rationale: βιβλίον bezeichnet ein Buch beziehungsweise eine Buchrolle. „Buch“ entspricht dem griechischen Ausdruck unmittelbar; die historisch mögliche Form einer Schriftrolle wird in der Fußnote erläutert.
- source_word: τοῦ πλήθους
  choice: der versammelten Menge
  rationale: πλῆθος bezeichnet eine große Menge von Menschen. Der Zusatz „versammelt“ verdeutlicht den öffentlichen Zusammenhang, ohne die Menge ausdrücklich als formelle Gemeinde festzulegen.
- source_word: ἐνώπιον
  choice: vor
  rationale: Die Präposition bezeichnet Gegenwart und Sichtbarkeit. Das zweimalige „vor“ bewahrt die Wiederholung des Griechischen.
- source_word: προεκάθητο
  choice: er saß
  rationale: Die Imperfektform beschreibt Esras bereits bestehende Sitzposition. Das Deutsche gibt dies knapp und natürlich mit „er saß“ wieder.
- source_word: ἐπιδόξως
  choice: gut sichtbar und in Ehren
  rationale: Das Adverb kann sowohl eine hervorgehobene, öffentlich erkennbare als auch eine ehrenvolle Stellung ausdrücken. Die Doppelwendung bewahrt diese Spannweite, statt sie nur räumlich oder nur sozial festzulegen.
- source_word: πάντων
  choice: ihnen allen
  rationale: Der Bezug auf sämtliche Anwesenden wird im Deutschen durch das aus dem Kontext ergänzte Pronomen eindeutig und idiomatisch ausgedrückt.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nahe am Griechischen, während „zur Hand nehmen“ und „gut sichtbar und in Ehren“ idiomatisch formuliert sind. Die Wiederholung von „vor“ wahrt die öffentliche Ausrichtung der Szene.
