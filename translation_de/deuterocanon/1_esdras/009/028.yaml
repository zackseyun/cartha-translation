base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/028.yaml
  text: 'And from the sons of Zamoth: Eliadas[a], Eleiasimus, Othonias, Jarimoth, Sabados[b], and Zeralias.'
translation:
  language: de
  text: 'Und von den Söhnen Zamoths: Eliadas[a], Eleiaseimos, Othonias, Jarimoth, Sabados[b] und Zeralias.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mehrere Namen in diesem Vers können griechische Formen wiedergeben, die von der hebräischen Parallelüberlieferung abweichen. Die Übersetzung folgt dem griechischen Text von 1 Esdras und gleicht die Liste nicht an Esra oder Nehemia an.
    reason: alternative_reading
  - marker: b
    text: Da bei der Transkription der Vorlage eine geringfügige Abweichung vermerkt ist, bleibt die Schreibweise einiger Eigennamen etwas unsicher. Hier werden die überlieferten griechischen Formen behutsam umgeschrieben.
    reason: textual_variant
lexical_decisions:
- source_word: ἐκ τῶν υἱῶν Ζαμόθ
  choice: von den Söhnen Zamoths
  rationale: Die Listenformel gibt ἐκ als Zugehörigkeit zu einer Familiengruppe wieder. Der Genitiv „Zamoths“ ist im Deutschen natürlich; der Name wird nach dem griechischen Text wiedergegeben und nicht an eine hebräische Parallele angeglichen.
- source_word: Ἐλιάδας
  choice: Eliadas
  rationale: Konservative Umschrift des griechischen Eigennamens unter Beibehaltung seiner griechischen Namensform.
- source_word: Ἐλειάσειμος
  choice: Eleiasimos
  rationale: Die Umschrift folgt der sichtbaren griechischen Buchstabenfolge; ει wird in der eingedeutschten Namensform als i wiedergegeben, ohne einen mutmaßlichen hebräischen Namen zu rekonstruieren.
- source_word: Ὀθονίας
  choice: Othonias
  rationale: Direkte, im Deutschen gut lesbare Umschrift der griechischen Namensform.
- source_word: Ἰαριμώθ
  choice: Jarimoth
  rationale: Anlautendes griechisches Iota wird entsprechend verbreiteter deutscher Bibelnamenkonvention mit J wiedergegeben.
- source_word: Σάβαδος
  choice: Sabados
  rationale: Die griechische Form wird bewahrt; eine Angleichung an einen möglicherweise verwandten hebräischen Namen wie Zabad wird vermieden.
- source_word: Ζεραλίας
  choice: Zeralias
  rationale: Direkte Umschrift des griechischen Eigennamens, ohne Harmonisierung mit der abweichenden Parallelüberlieferung.
