base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/009.yaml
  text: and do his will[a], and separate yourselves from the nations of the land and from the foreigners.
translation:
  language: de
  text: Und tut seinen Willen[a] und trennt euch von den Völkern des Landes und von den Fremden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die hebräische Parallele in Esra 10 spricht genauer von ausländischen Frauen beziehungsweise Ehefrauen; 1 Esdras verwendet hier die weiter gefasste Bezeichnung „die Fremden“.
    reason: alternative_reading
lexical_decisions:
- source_word: ποιήσατε
  choice: tut
  rationale: Der Aoristimperativ fordert unmittelbar zum Handeln auf; „tut“ ist in Verbindung mit „seinen Willen“ natürlich, knapp und würdig.
- source_word: τὸ θέλημα αὐτοῦ
  choice: seinen Willen
  rationale: Die geläufige und sachlich genaue Wiedergabe bewahrt den Bezug auf Gottes Willen, ohne den Ausdruck auszudeuten.
- source_word: χωρίσθητε
  choice: trennt euch
  rationale: Die mediale/passive Form hat hier auffordernden, reflexiven Sinn und bezeichnet eine bewusste Absonderung.
- source_word: ἀπὸ τῶν ἐθνῶν τῆς γῆς
  choice: von den Völkern des Landes
  rationale: ἔθνη bezeichnet hier die nichtisraelitischen Bevölkerungsgruppen im Land; „Völker“ bleibt quellennah, während γῆ im historischen Zusammenhang das Land meint.
- source_word: ἀπὸ τῶν ἀλλογενῶν
  choice: von den Fremden
  rationale: ἀλλογενεῖς bezeichnet Menschen fremder Herkunft. Der griechische Ausdruck ist breiter als „fremde Frauen“ und wird deshalb nicht entsprechend eingeengt.
theological_decisions:
- issue: Verhältnis der breiten griechischen Formulierung zur engeren hebräischen Parallele in Esra 10
  choice: Die umfassendere griechische Aufforderung wird als Trennung von den Völkern des Landes und den Fremden übersetzt.
  alternative: „und trennt euch von den Völkern des Landes und von den fremden Frauen“
  rationale: Für 1 Esdras ist der griechische Text die primäre Grundlage. Obwohl die hebräische Parallele in Esra 10 ausdrücklich fremde Frauen beziehungsweise Ehefrauen behandelt, nennt der griechische Vers hier allgemein die Fremden. Diese Spannung wird nicht im Haupttext aufgelöst, sondern in einer Fußnote kenntlich gemacht.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem, gut verständlichem biblischem Ton. Die Imperative stehen in der vertraulichen Pluralform und bewahren die direkte Aufforderung des Griechischen. Der Satzanfang mit „und“ erhält den Anschluss an den vorausgehenden Kontext.
