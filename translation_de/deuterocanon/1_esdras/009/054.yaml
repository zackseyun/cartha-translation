  naturalness: „Anteile zu schicken“ klingt im modernen Standarddeutsch ohne nähere Bestimmung unidiomatisch. „Speiseportionen zu schicken“ ist klar, natürlich und wahrt den Kontext. Die Wiederholung von „sich freuen“ ist als bewusste Abbildung der griechischen Wiederholung vertretbar.
