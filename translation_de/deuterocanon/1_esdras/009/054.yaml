base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/054.yaml
  text: And they all went away to eat and drink and rejoice[a], and to send portions to those who had nothing, and to rejoice greatly;
translation:
  language: de
  text: Und alle gingen fort, um zu essen und zu trinken und sich zu freuen, um denen, die nichts hatten[a], Speiseportionen zu schicken und sich sehr zu freuen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „denen, die nicht haben“; der griechische Text lässt offen, was ihnen fehlte. Der hebräische Paralleltext legt als Konkretisierung nahe: „denen, die keine Portionen vorbereitet hatten“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾤχοντο
  choice: gingen fort
  rationale: Das Imperfekt von οἴχομαι bezeichnet das Fortgehen beziehungsweise Auseinandergehen; „gingen fort“ gibt dies natürlich wieder.
- source_word: φαγεῖν καὶ πιεῖν
  choice: um zu essen und zu trinken
  rationale: Die beiden Infinitive bezeichnen Zweck beziehungsweise Inhalt ihres Fortgehens und werden in der geläufigen deutschen Verbindung wiedergegeben.
- source_word: εὐφραίνεσθαι
  choice: sich zu freuen
  rationale: Das Verb bezeichnet freudige, festliche Fröhlichkeit; die Wiedergabe bleibt nah am Griechischen, ohne den Festcharakter übermäßig auszudeuten.
- source_word: δοῦναι ἀποστολὰς
  choice: Anteile zu schicken
  rationale: Im Zusammenhang und im Licht des hebräischen Paralleltextes sind Anteile an den Speisen gemeint. „Anteile schicken“ wahrt sowohl das Geben im griechischen δοῦναι als auch den Sendegedanken des Substantivs ἀποστολάς.
- source_word: τοῖς μὴ ἔχουσιν
  choice: denen, die nichts hatten
  rationale: Wörtlich steht nur „denen, die nicht haben“; das fehlende Objekt bleibt in der Hauptübersetzung entsprechend offen.
- source_word: εὐφρανθῆναι μεγάλως
  choice: sich sehr zu freuen
  rationale: Die abschließende Infinitivverbindung verstärkt die Freude ausdrücklich; die Wiederholung gegenüber εὐφραίνεσθαι wird wie im Griechischen bewahrt.
theological_decisions:
- issue: Ergänzung des im Griechischen unausgesprochenen Objekts bei τοῖς μὴ ἔχουσιν
  choice: denen, die nichts hatten
  alternative: denen, die keine Anteile vorbereitet hatten
  rationale: Der griechische Haupttext lässt offen, was ihnen fehlte. Die allgemeinere Formulierung wahrt diese Offenheit; die wahrscheinlichere Konkretisierung durch den hebräischen Paralleltext wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Infinitivreihe und die doppelte Erwähnung der Freude werden zur Wahrung der griechischen Struktur beibehalten; „Anteile“ wird im Festzusammenhang als Speiseanteile verstanden.
