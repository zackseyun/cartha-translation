base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/031.yaml
  text: 'And from the sons of Addin: Lathos and Moosseias[a], Lakkounos and Naidos, and Beskaspasmos and Sesthel and Balnous and Manasseh.'
translation:
  language: de
  text: 'Und von den Söhnen Addins: Lathos und Moosseias[a], Lakkounos und Naïdos, Beskaspasmos und Sesthel, Balnous und Manasse.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der griechische Text bietet hier eine Liste von Personennamen. Mehrere Namen sind textlich unsicher oder weichen von der ungefähr entsprechenden hebräischen Überlieferung ab. Daher folgt die Übersetzung eng den griechischen Namensformen, statt sie an den masoretischen Text anzugleichen.
    reason: textual_variant
lexical_decisions:
- source_word: καὶ ἐκ τῶν υἱῶν Ἀδδείν
  choice: Und von den Söhnen Addins
  rationale: ἐκ mit dem Genitiv bezeichnet hier die Zugehörigkeit zu einer Familiengruppe. Die in Listen übliche, quellennahe Formel »Söhne« bleibt erhalten.
- source_word: Λάθος καὶ Μοοσσείας
  choice: Lathos und Moosseias
  rationale: Die Personennamen werden eng nach den überlieferten griechischen Formen transliteriert.
- source_word: Λακκοῦνος καὶ Νάιδος
  choice: Lakkunos und Naïdos
  rationale: Die Umschrift bildet die griechischen Namensformen lesbar ab; der Trema in »Naïdos« macht die getrennte Aussprache der Vokale kenntlich.
- source_word: Βεσκασπασμὸς καὶ Σεσθὴλ
  choice: Beskaspasmos und Sesthel
  rationale: Die schwierigen Namen werden nicht an eine mutmaßliche hebräische Vorlage angeglichen, sondern nach dem griechischen Text wiedergegeben.
- source_word: Βαλνοῦς καὶ Μανασσῆς
  choice: Balnus und Manasse
  rationale: »Balnus« ist eine lesbare deutsche Umschrift; für Μανασσῆς wird die im Deutschen etablierte biblische Namensform »Manasse« verwendet.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache mit knapper Listenstruktur. Eigennamen werden grundsätzlich aus dem griechischen Haupttext übertragen; nur bei Manasse wird die fest etablierte deutsche Form gebraucht.
