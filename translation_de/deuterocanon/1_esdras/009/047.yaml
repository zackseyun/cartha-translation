base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/047.yaml
  text: And all the assembly cried out, “Amen, amen,” and lifting up their hands, they fell to the ground and worshiped God.
translation:
  language: de
  text: 'Und die ganze Versammlung rief: »Amen, amen!« Dann hoben sie ihre Hände empor, warfen sich zu Boden und beteten Gott an.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐφώνησεν
  choice: rief
  rationale: Das Verb bezeichnet hier die laute, gemeinsame Antwort der Versammlung. »Rief« ist kraftvoll, ohne die Äußerung unnötig als Schreien zu überzeichnen.
- source_word: πᾶν τὸ πλῆθος
  choice: die ganze Versammlung
  rationale: πλῆθος bezeichnet die gesamte versammelte Menge; im gottesdienstlichen Zusammenhang gibt »Versammlung« den kollektiven und liturgischen Charakter natürlich wieder.
- source_word: Ἀμήν, ἀμήν
  choice: Amen, amen
  rationale: Die überlieferte liturgische Antwort bleibt erhalten; eine Wiedergabe mit »Wahrlich« würde ihre Funktion als zustimmender Gemeinderuf verfehlen.
- source_word: ἄραντες ἄνω τὰς χεῖρας
  choice: hoben sie ihre Hände empor
  rationale: Die Formulierung gibt sowohl die Hebebewegung als auch die durch ἄνω ausdrücklich bezeichnete Richtung nach oben wieder.
- source_word: προσπεσόντες ἐπὶ τὴν γῆν
  choice: warfen sich zu Boden
  rationale: Die Wendung beschreibt eine bewusste körperliche Niederwerfung. »Warfen sich zu Boden« klingt im Deutschen natürlicher und zielgerichteter als »fielen zu Boden«.
- source_word: προσεκύνησαν
  choice: beteten … an
  rationale: Da Gott das Ziel der Handlung ist und die Niederwerfung bereits gesondert genannt wird, bringt »anbeten« den religiösen Gehalt von προσκυνέω klar zum Ausdruck.
- source_word: τῷ θεῷ
  choice: Gott
  rationale: Der Dativ bezeichnet den Empfänger der Anbetung. Im Deutschen steht der Eigengebrauch »Gott« ohne Artikel.
theological_decisions:
- issue: Verhältnis von körperlicher Niederwerfung und προσκυνέω
  choice: Die Niederwerfung wird als »warfen sich zu Boden« beschrieben, die anschließende Handlung als »beteten Gott an« wiedergegeben.
  alternative: »beugten sich vor Gott nieder«
  rationale: Der griechische Text nennt sowohl die körperliche Bewegung als auch die auf Gott gerichtete Verehrung. Die gewählte Fassung hält beides auseinander und bewahrt damit das theologische Gewicht von προσκυνέω.
- issue: Verwendung des griechischen Hauptzeugen gegenüber der angegebenen MT-Parallele
  choice: Die Übersetzung folgt ausschließlich der vollständigen griechischen Szene.
  alternative: Wortlaut aus der angegebenen hebräischen Parallele einarbeiten
  rationale: Der angegebene hebräische Text entspricht inhaltlich nicht diesem Vers und darf daher den hochsicheren griechischen Ausgangstext nicht überformen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer liturgischer Prägung. Die Satzfolge wird durch »Dann« gegliedert, um die griechischen Partizipien natürlich wiederzugeben, ohne die Abfolge der Handlungen zu verändern.
