base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/039.yaml
  text: And he told Ezra the priest and reader to bring the law of Moses that had been given by the God of Israel[a][b].
translation:
  language: de
  text: Und er sagte Esra, dem Priester und Vorleser, er solle das Gesetz des Mose bringen, das vom Gott Israels gegeben worden war.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Schriftleser«. Gemeint ist jemand, der einen Text liest, wahrscheinlich öffentlich vorliest; »Schriftgelehrter« wäre hier weniger unmittelbar.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »das vom Gott Israels übergeben oder überliefert worden war«. Das griechische Wort kann sowohl das Geben als auch die Übergabe beziehungsweise Weitergabe betonen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν
  choice: sagte zu …, er solle
  rationale: Das gewöhnliche Verb bedeutet »sagen«. Zusammen mit dem Infinitiv κομίσαι bezeichnet es hier eine veranlasste Handlung; die Konstruktion mit »er solle« ist natürlich, ohne den Ausdruck zu einem förmlichen Befehl zu verstärken.
- source_word: Ἔσρᾳ
  choice: Esra
  rationale: Im Deutschen gebräuchliche Form des Personennamens.
- source_word: τῷ ἱερεῖ
  choice: dem Priester
  rationale: Der Artikel und die Amtsbezeichnung kennzeichnen Esra ausdrücklich als Priester.
- source_word: ἀναγνώστῃ
  choice: Vorleser
  rationale: Das Substantiv bezeichnet jemanden, der liest beziehungsweise öffentlich vorliest. »Vorleser« bewahrt diese im griechischen Text ausdrücklich genannte Funktion besser als »Schriftgelehrter«.
- source_word: κομίσαι
  choice: herbeibringen
  rationale: Im Zusammenhang geht es darum, das Gesetz herbeizuholen und vor die Versammlung zu bringen. »Herbeibringen« gibt diese Bewegung klar wieder.
- source_word: τὸν νόμον Μωυσέως
  choice: das Gesetz des Mose
  rationale: Transparente und im Deutschen geläufige Wiedergabe der Genitivverbindung, ohne eine nicht ausdrücklich genannte Mittlerschaft einzufügen.
- source_word: τὸν παραδοθέντα
  choice: das … übergeben worden war
  rationale: παραδίδωμι bezeichnet ein Übergeben oder Weitergeben. »Übergeben« erhält den Gedanken der Vermittlung deutlicher als das allgemeinere »gegeben«.
- source_word: ὑπὸ τοῦ θεοῦ Ἰσραήλ
  choice: vom Gott Israels
  rationale: ὑπό bezeichnet beim passiven Partizip den Handelnden; »vom Gott Israels« ist im Deutschen idiomatisch und wahrt diese Agensangabe.
theological_decisions:
- issue: Verhältnis des Gesetzes zu Mose und zu Gott
  choice: das Gesetz des Mose, das vom Gott Israels übergeben worden war
  alternative: das vom Gott Israels durch Mose gegebene Gesetz
  rationale: Der griechische Wortlaut verbindet das Gesetz durch den Genitiv mit Mose und nennt Gott als den Handelnden bei seiner Übergabe. Die Übersetzung bewahrt beide Aussagen, ohne »durch Mose« als nicht ausdrücklich formulierte Mittlerschaft hinzuzufügen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Vorleser« ist allgemein verständlich und bildet die ausdrückliche griechische Amts- oder Funktionsbezeichnung ab. Die etwas feierliche Formulierung »der Gott Israels« entspricht dem Quelltext; »vom Gott Israels« vermeidet zugleich eine schwerfällige Passivkonstruktion mit »durch«.
