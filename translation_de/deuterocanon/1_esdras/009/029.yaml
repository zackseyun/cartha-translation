base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/029.yaml
  text: 'And from the sons of Bebai: Joannes and Ananias and Zabdos and Emathis[a].'
translation:
  language: de
  text: 'Und von den Söhnen Bebais: Johannes, Hananias, Zabdos und Emathis.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Einige Namen können im ungefähren hebräischen Paralleltext anderen hebräischen Namensformen entsprechen. Hier wird jedoch der griechische Text von 1 Esdras zugrunde gelegt; er überliefert die Namen Johannes, Hananias, Zabdos und Emathis.
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ ἐκ τῶν υἱῶν Βηβαί
  choice: Und von den Söhnen Bebais
  rationale: ἐκ bezeichnet die Zugehörigkeit zu einer größeren, hier aufgelisteten Gruppe. υἱοί kann in genealogischen Listen auch Nachkommen bezeichnen; die formnahe Wiedergabe „Söhne“ ist im Deutschen verständlich und bewahrt die Struktur des Griechischen.
- source_word: Ἰωάννης
  choice: Johannes
  rationale: Der griechische Personenname wird in seiner geläufigen deutschen Form wiedergegeben, ohne ihn nach dem ungefähren hebräischen Paralleltext umzuformen.
- source_word: Ἁνανίας
  choice: Hananias
  rationale: Die Wiedergabe folgt der griechischen Namensform mit im Deutschen üblicher Anlautung; eine stärker hebraisierende Form würde den griechischen Primärtext verlassen.
- source_word: Ζάβδος
  choice: Sabdos
  rationale: Die Form ist eine enge deutsche Transliteration des griechischen Namens Ζάβδος; insbesondere wird griechisches Ζ konventionell mit deutschem S wiedergegeben.
- source_word: Ἐμαθίς
  choice: Emathis
  rationale: Der seltene Eigenname wird konservativ aus dem klar bezeugten griechischen Text transliteriert.
