  register: Modernes, würdiges Standarddeutsch. Die Satzstellung hebt zunächst die landesweite Verbreitung hervor; „erging … die Aufforderung“ ist öffentlich und verbindlich, ohne κήρυγμα als förmlichen Erlass zu überdeuten.
