base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/003.yaml
  text: And a proclamation was made throughout all Judea and Jerusalem to all those from the captivity[a], to assemble in Jerusalem.
translation:
  language: de
  text: Und in ganz Judäa und Jerusalem erging an alle aus der Gefangenschaft[a] die Aufforderung, sich in Jerusalem zu versammeln.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „alle aus der Gefangenschaft“. Gemeint sein können „alle Verbannten“ oder, dem Zusammenhang nach, „alle heimgekehrten Verbannten“.'
    reason: Die knappe griechische Herkunftsangabe lässt offen, wie ausdrücklich die Rückkehr aus dem Exil bezeichnet werden soll.
lexical_decisions:
- source_word: ἐγένετο κήρυγμα
  choice: erging … die Aufforderung
  rationale: Die Wendung bezeichnet das öffentliche Ergehen einer Bekanntmachung. Da der folgende Infinitiv ihren auffordernden Inhalt angibt, ist „Aufforderung“ im Deutschen natürlicher als das steifere „Bekanntmachung“, ohne die Aussage zu einem förmlichen Erlass zu machen.
- source_word: ἐν ὅλῃ τῇ Ἰουδαίᾳ καὶ Ἰερουσαλήμ
  choice: in ganz Judäa und Jerusalem
  rationale: Die Übersetzung wahrt die räumliche Reichweite der Bekanntmachung und folgt der auffälligen, aber verständlichen Verbindung von Judäa und Jerusalem im Griechischen.
- source_word: πᾶσι τοῖς ἐκ τῆς αἰχμαλωσίας
  choice: an alle, die aus der Gefangenschaft kamen
  rationale: Die Fassung hält sich eng an die griechische Herkunftsangabe „aus der Gefangenschaft“, macht aber durch „kamen“ die deutsche Syntax vollständig. Sie legt nicht ausdrücklich fest, ob „Verbannte“ oder „heimgekehrte Verbannte“ gemeint sind.
- source_word: συναχθῆναι
  choice: sich … zu versammeln
  rationale: Der passive griechische Infinitiv kann im Deutschen idiomatisch reflexiv wiedergegeben werden. Er bezeichnet hier den Inhalt der öffentlichen Aufforderung.
- source_word: εἰς Ἰερουσαλήμ
  choice: in Jerusalem
  rationale: Obwohl εἰς die Zielrichtung ausdrückt, bezeichnet die deutsche Verbindung „sich in Jerusalem versammeln“ natürlich sowohl den Zielort als auch den Ort der Zusammenkunft.
