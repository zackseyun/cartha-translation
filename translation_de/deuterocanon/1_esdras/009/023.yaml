base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/023.yaml
  text: 'And from the Levites: Jozabad[a], Seneis, Konos (that is, Kalitais), and Pathaios[c][b], and Judas and Jonas.'
translation:
  language: de
  text: 'Und von den Leviten: Jozabad, Seneïs[c], Konos – das heißt Kalitais[a] – und Pathaios[b] und Judas und Jonas.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: »dieser [ist] Kalitais«. Wahrscheinlich wird Konos damit durch einen weiteren Namen näher bestimmt.'
    reason: alternative_reading
  - marker: b
    text: Hinter Pathaios kann eine semitische Namensform stehen; der Haupttext folgt der griechischen Überlieferung.
    reason: lexical_alternative
  - marker: c
    text: Die Schreibung seltener Namen wie Seneïs, Konos und Pathaios ist wegen einer geringfügigen Abweichung in der vorliegenden Quellenerfassung nicht völlig sicher.
    reason: textual_variant
lexical_decisions:
- source_word: ἐκ τῶν Λευειτῶν
  choice: von den Leviten
  rationale: Die Wendung führt eine Teilgruppe innerhalb der Aufzählung ein und bewahrt den partitiven Sinn von ἐκ.
- source_word: Ἰωζάβαδος
  choice: Jozabad
  rationale: Der Personenname wird nach der griechischen Form wiedergegeben; die Schreibung mit J und z ist im Deutschen gut lesbar und bildet die griechischen Laute angemessen ab.
- source_word: Σενεεὶς
  choice: Seneïs
  rationale: Die Umschrift folgt dem seltenen griechischen Namen; das Trema zeigt, dass e und i getrennt gesprochen werden.
- source_word: Κῶνος
  choice: Konos
  rationale: Direkte, im Deutschen verständliche Umschrift der griechischen Namensform mit K für Kappa.
- source_word: οὗτος Καλιταίς
  choice: das heißt Kalitais
  rationale: Die appositionelle Formulierung identifiziert Kalitais wahrscheinlich als weiteren oder erläuternden Namen des zuvor genannten Konos, ohne die Beziehung stärker festzulegen als der griechische Text.
- source_word: Παθαῖος
  choice: Pathaios
  rationale: Der Name wird unmittelbar aus dem griechischen Hauptzeugen umgeschrieben, statt eine mutmaßliche semitische Entsprechung einzusetzen.
- source_word: Ἰούδας
  choice: Judas
  rationale: Judas ist die geläufige deutsche Wiedergabe der griechischen Personennamensform Ἰούδας.
- source_word: Ἰωνάς
  choice: Jonas
  rationale: Jonas entspricht der griechischen Form und ist zugleich die geläufige deutsche Namensform; die hebräisierende Form Jona wird nicht in den griechischen Haupttext eingetragen.
