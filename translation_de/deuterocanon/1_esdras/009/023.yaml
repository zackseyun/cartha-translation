translation_notes:
  register: Moderne, würdige Standardsprache. Die einleitende Listenform und die griechischen Namensformen bleiben erhalten; Gedankenstriche kennzeichnen die erläuternde Namensgleichsetzung, und »sowie« vermeidet eine schwerfällige Häufung von »und«.
