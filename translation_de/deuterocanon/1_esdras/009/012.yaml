lexical_decisions:
- source_word: οὐδὲ δύο
  choice: auch nicht in zwei Tagen
  rationale: Die griechische Wendung ist elliptisch und knüpft an den vorausgehenden Zusammenhang an. Gemeint ist, dass die Angelegenheit auch in zwei Tagen nicht erledigt werden kann.
- source_word: ἐπὶ πλεῖον ἡμάρτομεν
  choice: wir haben ... schwer gesündigt
  rationale: ἐπὶ πλεῖον bezeichnet hier das Ausmaß des Vergehens. „Schwer gesündigt“ bewahrt die moralisch-religiöse Aussage und klingt im Deutschen natürlich.
- source_word: ἐν τούτοις
  choice: in diesen Dingen
  rationale: Die Formulierung bleibt nahe am Griechischen und verweist ohne erklärenden Zusatz auf die behandelten Verhältnisse.
- source_word: οἱ προηγούμενοι τοῦ πλήθους
  choice: die Führenden der Menge
  rationale: προηγούμενοι bezeichnet diejenigen, die der versammelten Menge vorangehen beziehungsweise sie leiten. Die substantivierte Form „die Führenden“ hält diese aktive Nuance offen.
- source_word: στήτωσαν
  choice: sollen bereitstehen
  rationale: Das Verb bedeutet wörtlich „sollen stehen“. „Bereitstehen“ ist im administrativen Zusammenhang verständlich, ohne ausdrücklich eine Ernennung oder ein bestimmtes Amt in den Text einzutragen.
- source_word: οἱ ἐκ τῶν κατοικιῶν ἡμῶν
  choice: alle aus unseren Wohnorten
  rationale: κατοικίαι meint hier die bewohnten Orte oder örtlichen Gemeinschaften, nicht einzelne Wohnungen. „Wohnorte“ ist weit genug, um Dörfer und Städte einzuschließen.
- source_word: γυναῖκας ἀλλογενεῖς
  choice: deren Frauen aus anderen Völkern stammen
  rationale: ἀλλογενής bezeichnet die Zugehörigkeit zu einem anderen Volk oder einer anderen Herkunftsgruppe. Die Formulierung ist in modernem Deutsch natürlich und vermeidet, den Ausdruck auf heutige Staatsangehörigkeit zu verengen.
- source_word: παραγενηθήτωσαν
  choice: sollen ... kommen
  rationale: Das Verb fordert dazu auf, zu erscheinen oder sich einzufinden. „Kommen“ gibt dies schlicht und klar wieder.
- source_word: λαβόντες χρόνου
  choice: zu einem festgesetzten Zeitpunkt
  rationale: Die griechische Formulierung ist knapp und wörtlich etwa „nachdem sie Zeit erhalten haben“. Im organisatorischen Zusammenhang bezeichnet sie einen zugeteilten beziehungsweise festgesetzten Termin.
theological_decisions:
- issue: Moralische Bewertung des Vergehens
  choice: wir haben in diesen Dingen schwer gesündigt
  alternative: wir haben in diesen Dingen viel Unrecht getan
  rationale: ἡμάρτομεν benennt ausdrücklich Sünde. Die Übersetzung bewahrt diese religiös-moralische Wertung, ohne sie zu bloßem administrativem Fehlverhalten abzuschwächen.
- issue: Bezeichnung der Frauen anderer Herkunft
  choice: Frauen aus anderen Völkern
  alternative: ausländische Frauen
  rationale: Die gewählte Fassung hält den Bezug von ἀλλογενής auf Volkszugehörigkeit fest und vermeidet eine moderne staatsrechtliche Engführung. Sie fügt keine konfessionelle Bewertung dieser Ehen hinzu.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz bleibt als Ausschnitt syntaktisch an den vorausgehenden und folgenden Kontext angeschlossen. Die verwaltungssprachlichen Züge des griechischen Textes werden verständlich wiedergegeben, ohne die knappen oder mehrdeutigen Wendungen unnötig festzulegen.
