  text: not in two days, for we have sinned greatly in these matters. But let the leaders of the multitude stand, and let all those from our settlements who have foreign wives come at an appointed time,
translation:
  language: de
  text: auch nicht in zwei Tagen[a], denn wir haben in diesen Dingen in hohem Maß gesündigt. Doch die Leiter der Volksmenge sollen auftreten, und alle aus unseren Wohnorten[b], die Frauen aus anderen Völkern haben, sollen zu einer festgelegten Zeit kommen[c],
