base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/041.yaml
  text: And he was reading in the broad space before the temple gate from dawn until midday in the presence of the men and the women[b][a]; and all of them gave their attention to the law.
translation:
  language: de
  text: Und er las auf dem weiten Platz vor dem Tempeltor vom Morgengrauen bis zum Mittag vor den Männern und den Frauen; und sie richteten ihre ganze Aufmerksamkeit auf das Gesetz.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: »Sie gaben den ganzen Sinn auf das Gesetz hin«; gemeint ist, dass sie ihm ihre ungeteilte Aufmerksamkeit schenkten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνεγίνωσκεν
  choice: er las
  rationale: Der Imperfekt bezeichnet den über den genannten Zeitraum andauernden Vorgang. Im Deutschen kann das Präteritum diese Dauer zusammen mit »vom Morgengrauen bis zum Mittag« natürlich ausdrücken; ein ausdrückliches »laut« steht nicht im Griechischen.
- source_word: ἐν τῷ ... εὐρυχώρῳ
  choice: auf dem weiten Platz
  rationale: εὐρύχωρος bezeichnet einen weiten, geräumigen Ort. »Weiter Platz« ist im Deutschen natürlich und wahrt die räumliche Unbestimmtheit, ohne einen Hof oder Marktplatz ausdrücklich vorauszusetzen.
- source_word: πρὸ τοῦ ἱεροῦ πυλῶνος
  choice: vor dem Tempeltor
  rationale: πρό mit Genitiv bezeichnet die Lage davor; ἱερός kennzeichnet das Tor durch seinen Bezug zum Heiligtum. »Tempeltor« ist klarer und natürlicher als »heiliges Tor«.
- source_word: ἀπὸ ὄρθρου ἕως μεσημβρινοῦ
  choice: vom Morgengrauen bis zum Mittag
  rationale: ὄρθρος meint Morgengrauen oder frühe Morgenzeit, μεσημβρινός hier den Mittag. Die Formulierung ist präzise und idiomatisch.
- source_word: ἐνώπιον τῶν ἀνδρῶν καὶ γυναικῶν
  choice: vor den Männern und den Frauen
  rationale: ἐνώπιον bedeutet »vor« beziehungsweise »in Gegenwart von«. Die ausdrückliche Nennung beider Gruppen und die Artikel werden beibehalten.
- source_word: ἐπέδωκαν πάντα τὸν νοῦν
  choice: sie richteten ihre ganze Aufmerksamkeit
  rationale: Die griechische Wendung lautet wörtlich etwa »sie gaben den ganzen Sinn/Verstand hin« und bezeichnet ungeteilte, konzentrierte Aufmerksamkeit. Die deutsche Fassung bewahrt die Intensität idiomatisch.
- source_word: εἰς τὸν νόμον
  choice: auf das Gesetz
  rationale: Die Präposition εἰς gehört zur Wendung des Hinwendens. »Auf das Gesetz« ist mit dem gewählten deutschen Verb idiomatisch; »Gesetz« gibt νόμος wieder, ohne »Buch« hinzuzufügen.
theological_decisions:
- issue: νόμος als allgemeines Wort oder Titel der Tora
  choice: das Gesetz
  alternative: die Weisung / das Gesetzbuch
  rationale: Der bestimmte Artikel und der Zusammenhang weisen auf das öffentlich gelesene heilige Gesetz, doch der griechische Text nennt weder Mose noch ein Buch. »Das Gesetz« wahrt diese Spannung ohne interpretierende Ergänzung.
- issue: Ausdrückliche Bezeichnung des Publikums nach Geschlecht
  choice: den Männern und den Frauen
  alternative: dem ganzen Volk
  rationale: Der griechische Text nennt beide Gruppen ausdrücklich. Eine Zusammenfassung als »Volk« würde ein im Ausgangstext vorhandenes Merkmal beseitigen.
translation_notes:
  register: Moderne, würdige Standardsprache. Der Satzbau bleibt nah am griechischen Ablauf, während die abschließende Redewendung idiomatisch wiedergegeben wird. »Weiter Platz« vermeidet eine zu genaue architektonische Festlegung.
