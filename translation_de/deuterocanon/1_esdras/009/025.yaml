base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/025.yaml
  text: 'From the gatekeepers: Shallumus and Tobanes[a].'
translation:
  language: de
  text: 'Von den Torwächtern: Sallumos und Tobanes.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Griechisch: „Von den Torwächtern: Sallumos und Tobanes.“ Die parallele hebräische Überlieferung dieses Abschnitts stimmt an dieser Stelle nicht eng mit dem griechischen Text überein und bewahrt diese Namen nicht in derselben Form.'
    reason: textual_variant
lexical_decisions:
- source_word: ἐκ
  choice: Von
  rationale: In diesem listenartigen Zusammenhang bezeichnet ἐκ die Gruppe, aus der die Genannten stammen; „von“ leitet die Kategorie im Deutschen natürlich und knapp ein.
- source_word: τῶν θυρωρῶν
  choice: den Torwächtern
  rationale: θυρωρός bezeichnet einen Tür- oder Torhüter. „Torwächter“ ist im Zusammenhang eines Tempel- beziehungsweise Gemeindedienstes verständlich und gibt die amtliche Funktion angemessen wieder.
- source_word: Σάλλουμος
  choice: Sallumos
  rationale: Der Personenname wird unmittelbar nach der griechischen Form transliteriert. Die Wiedergabe mit S entspricht dem griechischen Sigma und vermeidet eine nicht durch den griechischen Haupttext abgesicherte Hebraisierung.
- source_word: καὶ
  choice: und
  rationale: Einfache verbindende Konjunktion zwischen den beiden Namen.
- source_word: Τοβάνης
  choice: Tobanes
  rationale: Der Name wird direkt aus der griechischen Form transliteriert. Eine Angleichung an einen geläufigeren hebräischen Namen wäre angesichts des maßgeblichen griechischen Textes nicht gerechtfertigt.
