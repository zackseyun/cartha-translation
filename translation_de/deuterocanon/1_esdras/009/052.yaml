base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/052.yaml
  text: For the day is holy to the Lord[a], and do not be grieved; for the Lord will glorify you.
translation:
  language: de
  text: Denn der Tag ist dem Herrn heilig[a]. Seid nicht betrübt; denn der Herr wird euch verherrlichen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hebräische Paralleltext in Nehemia 8,10 lautet an dieser Stelle anders, ungefähr: „Denn die Freude am HERRN ist eure Stärke.“ Im griechischen Text von 1 Esdras heißt es dagegen: „Denn der Herr wird euch verherrlichen.“'
    reason: alternative_reading
lexical_decisions:
- source_word: ἁγία
  choice: heilig
  rationale: Das Adjektiv bezeichnet Heiligkeit beziehungsweise die besondere Zugehörigkeit zu Gott; „heilig“ ist die natürliche und sachlich genaue deutsche Wiedergabe und entspricht zudem dem hebräischen Parallelwort קָדֹשׁ.
- source_word: ἡ ἡμέρα
  choice: der Tag
  rationale: Die bestimmte Nominalphrase wird im Deutschen direkt mit „der Tag“ wiedergegeben.
- source_word: τῷ κυρίῳ
  choice: dem Herrn
  rationale: 'Der Dativ bezeichnet hier die Beziehung beziehungsweise Zugehörigkeit: Der Tag ist dem Herrn geheiligt. Die Formulierung „dem Herrn heilig“ bewahrt die knappe Struktur und die mögliche Nuance der Widmung.'
- source_word: μὴ λυπεῖσθε
  choice: Seid nicht betrübt
  rationale: Das Verb bezeichnet Kummer, Betrübnis oder seelischen Schmerz. „Seid nicht betrübt“ ist würdig, verständlich und gewahrt mehr Gewicht als das leichtere „Seid nicht traurig“.
- source_word: δοξάσει
  choice: wird verherrlichen
  rationale: Das Verb gehört ausdrücklich zum Bedeutungsfeld von Herrlichkeit und Ehre. „Verherrlichen“ gibt den überlieferten griechischen Wortlaut wieder, ohne ihn an den anderslautenden hebräischen Paralleltext anzugleichen.
- source_word: ὑμᾶς
  choice: euch
  rationale: Das Pronomen ist Akkusativ der zweiten Person Plural; „euch“ bildet Numerus und syntaktische Funktion eindeutig ab.
theological_decisions:
- issue: Wiedergabe von κύριος
  choice: Herr
  alternative: Gebieter
  rationale: „Herr“ ist die etablierte und kontextuell passende Wiedergabe. Der Zusammenhang bietet keinen Grund, die stärker soziale Bedeutung „Gebieter“ zu wählen.
- issue: Umgang mit dem abweichenden Schluss des hebräischen Paralleltexts
  choice: Den griechischen Wortlaut mit „der Herr wird euch verherrlichen“ übersetzen
  alternative: 'Nach Nehemia 8,10 harmonisieren: „Die Freude am HERRN ist eure Stärke“'
  rationale: Für 1 Esdras ist der griechische Text die primäre Grundlage. Seine Aussage unterscheidet sich materiell vom masoretischen Paralleltext und darf nicht stillschweigend durch diesen ersetzt werden; die Abweichung wird in einer Fußnote transparent gemacht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung „dem Herrn heilig“ bewahrt die knappe relationale Aussage des griechischen Dativs. Das traditionelle „verherrlichen“ bleibt wegen des ausdrücklich verwendeten δοξάζω erhalten, obwohl es im heutigen Deutsch gehoben klingt.
