base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/051.yaml
  text: Go your way[a], then[b], eat rich foods and send portions to those who have nothing.
translation:
  language: de
  text: Geht nun, esst reichhaltige Speisen[a] und schickt denen Portionen, die nichts haben.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »fette Speisen«. Gemeint sind gehaltvolle, ausgesuchte Speisen für ein Fest.'
    reason: lexical_alternative
  - marker: b
    text: 'Die hebräische Parallelstelle in Nehemia 8,10 lautet genauer: »Schickt Portionen demjenigen, für den nichts bereitet ist.«'
    reason: alternative_reading
lexical_decisions:
- source_word: βαδίσαντες
  choice: Geht
  rationale: Das Partizip bedeutet wörtlich »gehend« bzw. »nachdem ihr gegangen seid«, übernimmt hier im Zusammenhang der Aufforderung aber idiomatisch imperativische Funktion. »Geht« bewahrt den Bewegungssinn und klingt im Deutschen natürlich.
- source_word: οὖν
  choice: also
  rationale: Die Partikel kennzeichnet eine Folgerung oder Fortführung. »Also« gibt dies knapp und idiomatisch wieder.
- source_word: φάγετε
  choice: esst
  rationale: Direkte Wiedergabe des Imperativs Plural.
- source_word: λιπάσματα
  choice: reichhaltige Speisen
  rationale: Das Substantiv bezeichnet fette beziehungsweise gehaltvolle Speisen. »Reichhaltige Speisen« vermittelt den Sinn im heutigen Deutsch, ohne das missverständliche wörtliche »Fettes« in den Haupttext zu setzen. Das hebräische מַשְׁמַנִּים der Parallelstelle stützt diese Bedeutung.
- source_word: ἀποστείλατε
  choice: schickt
  rationale: Schlichte und natürliche Wiedergabe des Imperativs; im Zusammenhang sind Speiseanteile gemeint.
- source_word: ἀποστολάς
  choice: Anteile
  rationale: Im Festkontext bezeichnet das Wort das, was anderen zugeschickt wird, also zugeteilte Speiseanteile. Das hebräische מָנוֹת in der Parallelstelle stützt diese konkrete Bedeutung.
- source_word: τοῖς μὴ ἔχουσιν
  choice: denen, die nichts haben
  rationale: Dies folgt eng dem knappen griechischen Wortlaut »den Nicht-Habenden«, ohne die ausführlichere Formulierung der hebräischen Parallelstelle in den Haupttext einzutragen.
theological_decisions:
- issue: Heranziehung der hebräischen Parallelstelle zur Bestimmung des sozialen Sinns
  choice: Die Aufforderung gilt dem Teilen von Speiseanteilen mit Menschen, die nichts haben.
  alternative: Man könnte allgemeiner an das Übersenden nicht näher bestimmter Dinge an Menschen denken, denen etwas fehlt.
  rationale: Der griechische Text spricht knapp von »Anteilen« für »die nichts haben«; die hebräische Parallelstelle in Nehemia 8,10 nennt Anteile für jemanden, für den nichts bereitet ist. Sie bestätigt den Fest- und Speisekontext, während der Haupttext der kürzeren griechischen Fassung folgt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit direkter Anrede im Plural. Der griechische Text bleibt die primäre Grundlage; die hebräische Parallelstelle wird nur zur sachlichen Einordnung und in einer Fußnote berücksichtigt.
