base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/026.yaml
  text: 'From Israel[a], from the sons of Phoros: Jerma and Jezias and Melcheias and Mielos and Eleazar and Asebeias and Bannaias.'
translation:
  language: de
  text: 'Aus Israel[a], von den Söhnen des Phoros: Jerma, Jezeias, Melcheias, Mielos, Eleasar, Asebeias und Bannaias.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mehrere Namen in diesem Vers entsprechen wahrscheinlich hebräischen Namensformen aus der parallelen Liste in Esra 10, etwa Parosch für Phoros und Benaja für Bannaias. Da hier der griechische Text des 1. Esdrabuchs übersetzt wird, stehen im Haupttext die griechischen Namensformen.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκ τοῦ Ἰσραήλ
  choice: Aus Israel
  rationale: Das erste ἐκ bezeichnet die Zugehörigkeit zur größeren Gruppe, aus der die Genannten stammen; „Aus Israel“ bewahrt die knappe Listenform.
- source_word: ἐκ τῶν υἱῶν Φορός
  choice: von den Söhnen des Phoros
  rationale: υἱοί kann in genealogischen Listen auch Nachkommen oder eine Sippe bezeichnen. Die formnahe Wiedergabe „Söhne“ erhält jedoch die Struktur des griechischen Textes und ist im Zusammenhang verständlich.
- source_word: Φορός
  choice: Phoros
  rationale: Der griechische Name Φορός ist die maßgebliche Textform; eine Angleichung an die hebräische Form Parosch erfolgt daher nicht im Haupttext.
- source_word: Ἰερμά
  choice: Jerma
  rationale: Konservative deutsche Umschrift der griechischen Namensform.
- source_word: Ἰεζείας
  choice: Jezeias
  rationale: Die Schreibung gibt die griechische Form in einer für deutsche Leser gut lesbaren Umschrift wieder.
- source_word: Μελχείας
  choice: Melcheias
  rationale: Die griechische Namensform wird bewahrt, ohne sie an eine vermutete hebräische Entsprechung anzugleichen.
- source_word: Μίηλος
  choice: Mielos
  rationale: Direkte und konservative Umschrift des seltenen griechischen Eigennamens.
- source_word: Ἐλεάζαρος
  choice: Eleasar
  rationale: „Eleasar“ ist die im Deutschen etablierte biblische Form dieses Namens und entspricht dem griechischen Namen sachgerecht.
- source_word: Ἀσεβείας
  choice: Asebeias
  rationale: Die griechische Namensform wird direkt wiedergegeben; eine mögliche semitische Entsprechung ist nicht sicher genug, um sie in den Haupttext einzusetzen.
- source_word: Βανναίας
  choice: Bannaias
  rationale: Die Umschrift folgt dem griechischen Βανναίας; die hebräisch geprägte Form Benaja bleibt eine mögliche Entsprechung, ersetzt aber nicht den Primärtext.
