base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/010.yaml
  text: And the whole assembly cried out and said with a loud voice[a], “So, as you have said[b], we will do.”
translation:
  language: de
  text: 'Und die ganze Versammlung rief mit lauter Stimme: »So, wie du gesagt hast, werden wir es tun.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »Und die ganze Versammlung rief und sagte mit lauter Stimme: So, wie du gesagt hast, werden wir es tun.«'
    reason: Die Fußnote bewahrt die im Griechischen vorhandene Verbindung der beiden Redeverben ἐφώνησαν und εἶπον, die im Haupttext für natürliches Deutsch zusammengezogen wurde.
lexical_decisions:
- source_word: ἐφώνησαν … καὶ εἶπον μεγάλῃ τῇ φωνῇ
  choice: rief mit lauter Stimme
  rationale: Die Formulierung gibt den öffentlichen, nachdrücklichen Zuruf idiomatisch wieder. Das im Griechischen zusätzlich stehende »und sagte« wird im Deutschen durch den Doppelpunkt ausgedrückt, ohne den Inhalt zu verändern oder eine schwerfällige Redundanz zu erzeugen.
- source_word: πᾶν τὸ πλῆθος
  choice: die ganze Versammlung
  rationale: πλῆθος bezeichnet die Gesamtheit der anwesenden Menschen. »Versammlung« passt zum geordneten öffentlichen Zusammenhang besser als »Menschenmenge«, ohne dem Ausdruck eine technische Bedeutung aufzuzwingen.
- source_word: Οὕτως ὡς εἴρηκας
  choice: So, wie du gesagt hast
  rationale: »So« leitet die Zustimmung ein; das Perfekt εἴρηκας wird im Deutschen natürlich mit »gesagt hast« wiedergegeben und lässt die fortwirkende Geltung der Aussage erkennen.
- source_word: ποιήσομεν
  choice: werden wir es tun
  rationale: Die direkte Zukunftsform drückt den gemeinsamen Entschluss aus. Das deutsche Pronomen »es« ergänzt das aus dem Zusammenhang erschlossene Objekt idiomatisch.
theological_decisions:
- issue: Charakter der versammelten Gruppe
  choice: die ganze Versammlung
  alternative: die ganze Menge
  rationale: Der Ausdruck beschreibt hier die gemeinsame öffentliche Antwort der Anwesenden. »Versammlung« vermittelt diesen Kontext, ohne eine bestimmte kirchliche oder konfessionelle Körperschaft vorauszusetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die kollektive und nachdrückliche Antwort bleibt klar; schwerfällige griechische Redundanz wird im Haupttext idiomatisch verdichtet und in der Fußnote transparent gemacht.
