base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/019.yaml
  text: 'From the sons of Jeshua son of Jozadak and his brothers: Maelas[a], Eleazar, Joribus, and Joadanus.'
translation:
  language: de
  text: 'Von den Söhnen Jeschuas, des Sohnes Jozadaks, und von seinen Brüdern: Maëlas[a], Eleasar, Joribus und Joadanus.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der griechische Text nennt hier Maëlas, Joribus und Joadanus. In der ungefähren hebräischen Parallele in Esra 10,18.20–21 lauten die entsprechenden Namen anders; dies spiegelt das freiere Verhältnis zwischen 1 Esdras und dem masoretischen Text in diesen Listen wider.
    reason: textual_variant
lexical_decisions:
- source_word: ἐκ τῶν υἱῶν
  choice: Von den Söhnen
  rationale: Bewahrt die mit ἐκ eingeleitete Auswahl aus einer Gruppe und passt zum Charakter der Namensliste.
- source_word: Ἰησοῦ τοῦ Ἰωσεδὲκ
  choice: Jeschuas, des Sohnes Jozadaks
  rationale: Jeschua ist in diesem nachexilischen Zusammenhang die übliche deutsche Namensform; der Genitiv bezeichnet die Abstammung und wird natürlich als Patronym wiedergegeben.
- source_word: καὶ τῶν ἀδελφῶν αὐτοῦ
  choice: und von seinen Brüdern
  rationale: Das singularische αὐτοῦ bezieht sich am natürlichsten auf Jeschua; die Wiederholung von »von« macht die Zuordnung im Deutschen klar.
- source_word: Μαεήλας
  choice: Maëlas
  rationale: Die griechische Namensform wird nicht an den abweichenden hebräischen Paralleltext angeglichen; das Trema verdeutlicht die getrennte Aussprache der Vokale.
- source_word: Ἐλεάζαρος
  choice: Eleasar
  rationale: Entspricht der etablierten deutschen Form des biblischen Namens.
- source_word: Ἰώριβος
  choice: Joribus
  rationale: Gibt die überlieferte griechische Form wieder, statt sie mit einem Namen aus der nur ungefähren MT-Parallele zu harmonisieren.
- source_word: Ἰωάδανος
  choice: Joadanus
  rationale: Direkte Wiedergabe der griechischen Namensform; mögliche Entsprechungen im hebräischen Paralleltext werden nicht in den Haupttext eingetragen.
