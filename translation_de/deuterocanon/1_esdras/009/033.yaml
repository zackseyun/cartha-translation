base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/033.yaml
  text: 'And from the sons of Asom: Maltannaios[a], Mattathias, Sabannaious, Eleiphalat, Manasseh[b], and Shimei.'
translation:
  language: de
  text: 'Und von den Söhnen Asoms[a]: Maltannaios, Mattathias, Sabannaius[b], Eleiphalat, Manasse und Semei.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Griechisch: »Asom«; in der hebräischen Parallelüberlieferung entspricht dem Namen wahrscheinlich »Haschum«.'
    reason: alternative_reading
  - marker: b
    text: Mehrere Namen in dieser Liste haben im Griechischen Formen, die nicht genau mit der hebräischen Parallelüberlieferung übereinstimmen. Der Haupttext folgt der griechischen Überlieferung von 1 Esdras.
    reason: textual_variant
lexical_decisions:
- source_word: καὶ ἐκ τῶν υἱῶν
  choice: Und von den Söhnen
  rationale: Gibt die Einleitung einer weiteren Familiengruppe in der Namensliste knapp, natürlich und quellennah wieder.
- source_word: Ἀσόμ
  choice: Asom
  rationale: Die griechische Leitquelle hat Ἀσόμ; daher wird diese Form im Haupttext beibehalten und nicht stillschweigend an die hebräische Parallelüberlieferung angeglichen.
- source_word: Μαλτανναῖος
  choice: Maltannaios
  rationale: Quellennahe Umschrift der griechisch überlieferten Namensform.
- source_word: Ματταθίας
  choice: Mattathias
  rationale: Gebräuchliche deutsche Wiedergabe der griechischen Namensform Ματταθίας.
- source_word: Σαβανναιούς
  choice: Sabannaios
  rationale: Die ungewöhnliche griechische Namensform wird bewahrt, statt sie mit einer vermuteten hebräischen Entsprechung zu harmonisieren.
- source_word: Ἐλειφαλὰτ
  choice: Eleiphalat
  rationale: Nahe Umschrift der griechischen Form; eine Hebraisierung zu Elifelet würde die Leitquelle normalisieren.
- source_word: Μανασση
  choice: Manasse
  rationale: Die im Deutschen etablierte biblische Namensform entspricht der griechischen Form und ist gut lesbar.
- source_word: Σεμεεί
  choice: Semei
  rationale: Die Umschrift folgt der griechischen Leitquelle Σεμεεί. Eine Angleichung an die geläufigere hebräische Form Schimi wird vermieden.
