base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/016.yaml
  text: And Ezra the priest selected for himself men who were heads of their fathers’ houses, all of them designated by name, and they convened on the first day of the tenth month to examine the matter.
translation:
  language: de
  text: Und Esra, der Priester, wählte sich Männer aus, die Oberhäupter ihrer Vaterhäuser waren und die alle namentlich bestimmt waren. Am ersten Tag des zehnten Monats[a] kamen sie zusammen, um die Angelegenheit zu untersuchen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: am Neumond des zehnten Monats, also am ersten Tag des Monats.'
    reason: Erläutert die Kalenderbezeichnung νουμηνία und bewahrt zugleich die wörtlichere griechische Ausdrucksweise.
lexical_decisions:
- source_word: ἐπελέξατο αὐτῷ
  choice: wählte … für sich aus
  rationale: Das Medium und αὐτῷ lassen erkennen, dass Esra die Männer für seine Aufgabe beziehungsweise zu seinem Zweck auswählte; die Formulierung bewahrt diese Nuance.
- source_word: ἄνδρας ἡγουμένους
  choice: Männer …, die Oberhäupter … waren
  rationale: ἄνδρας bezeichnet ausdrücklich Männer; ἡγουμένους beschreibt hier ihre leitende Stellung innerhalb der väterlichen Familienverbände.
- source_word: τῶν πατριῶν αὐτῶν
  choice: ihrer Vaterhäuser
  rationale: πατριά meint in diesem genealogisch-administrativen Zusammenhang väterlich gegliederte Familienverbände. »Vaterhäuser« bewahrt diese Struktur knapp und traditionsverständlich.
- source_word: πάντας κατ’ ὄνομα
  choice: alle namentlich bestimmt
  rationale: Die Wendung weist darauf hin, dass sämtliche ausgewählten Männer einzeln mit Namen festgelegt beziehungsweise verzeichnet waren.
- source_word: συνεκλείσθησαν
  choice: kamen sie zusammen
  rationale: Obwohl das Verb wörtlich ein Zusammenschließen oder gemeinsames Eingeschlossensein bezeichnen kann, meint es im Verfahrenszusammenhang plausibel das formelle Zusammenkommen.
- source_word: τῇ νουμηνίᾳ
  choice: am Neumondstag
  rationale: Die direkte Wiedergabe bewahrt die konkrete griechische Kalenderbezeichnung; eine Fußnote erläutert, dass damit der erste Monatstag gemeint ist.
- source_word: ἐτάσαι
  choice: zu untersuchen
  rationale: 'Der Infinitiv bezeichnet den Zweck der Zusammenkunft: eine förmliche Prüfung der vorliegenden Sache.'
- source_word: τὸ πρᾶγμα
  choice: die Angelegenheit
  rationale: Die allgemeine Bezeichnung lässt den Gegenstand der Untersuchung ebenso offen wie das Griechische.
theological_decisions:
- issue: Geschlechtsspezifische Verwaltungssprache
  choice: Männer, die Oberhäupter ihrer Vaterhäuser waren
  alternative: Familienoberhäupter
  rationale: Die Wiedergabe erhält sowohl das ausdrücklich männliche ἄνδρας als auch die väterliche Verwandtschaftsstruktur, ohne sie geschlechtsneutral zu verallgemeinern.
- issue: Kalenderbezeichnung νουμηνία
  choice: am Neumondstag des zehnten Monats
  alternative: am ersten Tag des zehnten Monats
  rationale: Die Hauptübersetzung bildet den griechischen Ausdruck unmittelbar ab; die Fußnote macht seine kalendarische Bedeutung verständlich, ohne einen möglichen kulturellen Beiklang des Neumonds zu beseitigen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz wurde zur besseren Lesbarkeit nach der Namensbestimmung geteilt. Die administrativ-genealogische Sprache des griechischen Textes bleibt erhalten.
