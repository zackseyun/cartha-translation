revisions:
- from: Und Esra, der Priester, wählte Männer für sich aus, die Oberhäupter ihrer Vaterhäuser waren, alle namentlich bestimmt. Am Neumondstag[a] des zehnten Monats kamen sie zusammen, um die Angelegenheit zu untersuchen.
  to: Und Esra, der Priester, wählte sich Männer aus, die Oberhäupter ihrer Vaterhäuser waren und die alle namentlich bestimmt waren. Am ersten Tag des zehnten Monats[a] kamen sie zusammen, um die Angelegenheit zu untersuchen.
  rationale: Die Revision verbessert lediglich idiomatisches modernes Deutsch und die Verständlichkeit der Kalenderangabe. Die Auswahl durch Esra, die männlichen Oberhäupter der Vaterhäuser, ihre namentliche Bestimmung sowie Zweck und Gegenstand der Zusammenkunft bleiben vollständig erhalten.
