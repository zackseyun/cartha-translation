  source_fidelity: 'Der Haupttext gibt die sicheren griechischen Satzelemente zutreffend wieder: τὸ πλῆθος πολὺ als „die Menge ist groß“, ὥρα χειμερινή als „es ist Winterzeit“, die Aussage über das Stehen im Freien sowie die zeitliche Unmöglichkeit, die Angelegenheit an einem Tag zu erledigen. Die problematische, im überlieferten griechischen Wortlaut syntaktisch und semantisch nicht sicher einordenbare Wendung καὶ οὐχ εὕρομεν wird nicht harmonisierend ergänzt, sondern transparent in der Fußnote vermerkt. Das wahrt die Priorität des griechischen Textes und vermeidet eine ungesicherte Übernahme aus der hebräischen Parallele.'
