  terminology: „Menge“, „Winterzeit“, „im Freien“ und „Arbeit“ sind sachgerecht. Die Fußnote zu Winterzeit bietet die naheliegende wetterbezogene Alternative, ohne die saisonale Grundbedeutung des griechischen Ausdrucks aufzugeben.
