base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/011.yaml
  text: But the people are many[a], and it is the rainy season, and we are not able to stand outside[b]; and this is not a task of one day.
translation:
  language: de
  text: Aber die Menge ist groß, und es ist Winterzeit[a]; wir können nicht im Freien stehen[b]. Das ist keine Arbeit für einen einzigen Tag.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „es ist winterliches Wetter“.'
    reason: lexical_alternative
  - marker: b
    text: An dieser Stelle folgen im griechischen Text die schwer verständlichen Worte „und wir fanden nicht“ (καὶ οὐχ εὕρομεν). Ihr Sinn in diesem Zusammenhang ist ungewiss; deshalb werden sie im Haupttext nicht wiedergegeben.
    reason: textual_variant
lexical_decisions:
- source_word: τὸ πλῆθος πολὺ
  choice: die Menge ist groß
  rationale: Gibt die große versammelte Menschenmenge natürlich und nah am griechischen Wortlaut wieder.
- source_word: ὥρα χειμερινή
  choice: es ist Winterzeit
  rationale: Bewahrt die wörtliche saisonale Aussage des Griechischen; der Zusammenhang macht deutlich, dass winterliches, ungünstiges Wetter gemeint ist.
- source_word: οὐκ ἰσχύσομεν στῆναι αἴθριοι
  choice: wir können nicht im Freien stehen
  rationale: ἰσχύω bezeichnet hier das Vermögen beziehungsweise Durchhaltevermögen, αἴθριοι das Verweilen unter freiem Himmel und damit ungeschützt vor dem Wetter.
- source_word: τὸ ἔργον ἡμῖν οὐκ ἔστιν ἡμέρας μιᾶς
  choice: Das ist keine Arbeit für einen einzigen Tag
  rationale: Drückt idiomatisch aus, dass die anstehende Angelegenheit nicht innerhalb eines Tages bewältigt werden kann, und bewahrt zugleich das Bild von ἔργον als Arbeit.
- source_word: καὶ οὐχ εὕρομεν
  choice: im Haupttext nicht wiedergegeben
  rationale: Die überlieferte Wortfolge bedeutet isoliert „und wir fanden nicht“, ergibt hier jedoch keinen klaren syntaktischen oder sachlichen Sinn. Sie wird nicht durch eine spekulative Deutung ergänzt, sondern in einer Fußnote offengelegt.
theological_decisions:
- issue: Umgang mit der schwer verständlichen griechischen Wendung καὶ οὐχ εὕρομεν
  choice: Den sicheren Sinn des griechischen Satzes übersetzen und die unklare Wendung transparent in einer Fußnote dokumentieren
  alternative: Die Worte mechanisch als „und wir fanden nicht“ in den Haupttext aufnehmen oder den Text nach der hebräischen Parallele rekonstruieren
  rationale: Die griechische Überlieferung bleibt die primäre Grundlage. Eine wörtliche Aufnahme wäre im Deutschen ebenso unverständlich, während eine Rekonstruktion nach Esra 10,13 zusätzliche, im vorliegenden griechischen Wortlaut nicht sicher belegte Elemente einführen würde.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Im Freien stehen“ ist allgemein verständlich und wahrt den Gedanken des ungeschützten Aufenthalts draußen. Die schwer verständliche Überlieferung wird nicht stillschweigend harmonisiert, sondern ausdrücklich vermerkt.
