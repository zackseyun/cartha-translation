base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/032.yaml
  text: 'And from the sons of Annan: Eliodas[a], Asaiah, Melchiah, Sabbaias, and Simon Chosamaus.'
translation:
  language: de
  text: 'Und von den Söhnen Annans: Eliodas[a], Asaja, Melchija, Sabbaias und Simon Chosamaos.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Einige Namen in dieser Liste haben in den Überlieferungen von Esra und Nehemia hebräische Entsprechungen, etwa Annan/Hanan und Sabbaias/Schabbetai. Der Haupttext folgt den Namensformen des griechischen 1. Esdras; die hebräischen Parallelen dienen nur zum Vergleich.
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ
  choice: Und
  rationale: Die gewöhnliche Verknüpfung führt den nächsten Eintrag der Aufzählung fort.
- source_word: ἐκ τῶν υἱῶν
  choice: von den Söhnen
  rationale: Die Wendung bezeichnet in diesem Listen- und Familienzusammenhang die Zugehörigkeit zu einer Sippe und bewahrt knapp die griechische Struktur.
- source_word: Ἀννὰν
  choice: Annans
  rationale: Der Name folgt dem maßgeblichen griechischen Text; der Genitiv ergibt sich im Deutschen aus der Konstruktion »von den Söhnen«.
- source_word: Ἐλιωδὰς
  choice: Eliodas
  rationale: Nahe Umschrift der im griechischen Zeugen vorliegenden Namensform.
- source_word: Ἀσαίας
  choice: Asaja
  rationale: Die geläufige deutsche Wiedergabe semitischer Namen auf -jā bewahrt den griechisch erkennbaren Namen in natürlicher deutscher Form.
- source_word: Μελχείας
  choice: Melchija
  rationale: Eine im Deutschen verständliche, am griechischen Μελχείας orientierte Namensform; die stärker hebräisierende Form Malchija wird nicht in den Haupttext übernommen.
- source_word: Σαββαίας
  choice: Sabbaias
  rationale: Nahe Umschrift der griechischen Namensform, ohne sie stillschweigend durch das mögliche hebräische Gegenstück Schabbetai zu ersetzen.
- source_word: Σίμων
  choice: Simon
  rationale: Eingebürgerte deutsche Form des griechischen Personennamens.
- source_word: Χοσάμαος
  choice: Chosamaos
  rationale: Transparente, eng am Griechischen orientierte Umschrift des seltenen und textlich schwer abzugleichenden Namens.
theological_decisions: []
translation_notes:
  register: Knappes, würdiges Listendeutsch. Die Syntax bleibt nahe am Griechischen, während bekannte semitische Namensendungen teilweise in üblicher deutscher Form wiedergegeben werden. Der Fußnotenmarker steht bei Eliodas als frühem Ankerpunkt für die gesamte Namensliste.
