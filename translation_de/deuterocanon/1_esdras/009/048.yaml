base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/048.yaml
  text: Jeshua and Anniuth and Sherebiah[a], Jadinus, Jarsubus, Abteus, Autaias, Maiannas and Kelitas, Azariah, Katezabdus, Annas, Phalias—the Levites—
translation:
  language: de
  text: Jeschua und Anniuth und Scherebja[a], Jadeinos, Jarsuboos, Abtaios, Autaias, Maiannas und Kaleitas, Asarias, Katethzabdos, Annas, Phalias, die Leviten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mehrere Namen in diesem Vers sind in der griechischen Überlieferung unsicher; einige könnten Namen aus der Levitenliste in Nehemia 8,7 entsprechen, etwa Schabbetai, Hodija oder Maaseja. Der Haupttext folgt überwiegend den griechischen Namensformen, sofern die hebräische Entsprechung nicht besonders deutlich ist.
    reason: textual_variant
lexical_decisions:
- source_word: Ἰησοῦς
  choice: Jeschua
  rationale: Im Esra-Nehemia-Zusammenhang entspricht die griechische Form sehr wahrscheinlich dem hebräischen Namen Jeschua; diese Form vermeidet zudem eine Verwechslung mit dem neutestamentlichen Namen Jesus.
- source_word: Σαραβίας
  choice: Scherebja
  rationale: Die aus dem Esra-Nehemia-Zusammenhang bekannte semitische Namensform ist hier hinreichend sicher erkennbar und im Deutschen natürlich wiederzugeben.
- source_word: Ἰάδεινος, Ἰαρσούβοος, Ἀβταῖος, Αὐταίας, Μαιάννας, Καλείτας
  choice: Jadeinos, Jarsuboos, Abtaios, Autaias, Maiannas, Kaleitas
  rationale: Da die Zuordnung dieser Namen zu den Namen der hebräischen Parallelliste unsicher ist, werden die griechischen Formen konservativ und nach deutscher Lautkonvention transliteriert.
- source_word: Ἀζαρίας, Κατέθζαβδος, Ἄννας, Φαλίας
  choice: Asarias, Katethzabdos, Annas, Phalias
  rationale: Die überlieferten griechischen Namensformen werden bewahrt, statt sie durch unsichere Harmonisierungen mit der hebräischen Liste zu ersetzen.
- source_word: οἱ Λευεῖται
  choice: die Leviten
  rationale: Die Wortgruppe kennzeichnet die zuvor genannten Männer als Leviten; dies ist die geläufige und genaue deutsche Wiedergabe.
