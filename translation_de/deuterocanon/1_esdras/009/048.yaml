translation_notes:
  register: Moderne, würdige Standardsprache. Die listenartige Reihung und der unvollständige Satzschluss des griechischen Textes bleiben erhalten. Bekannte semitische Formen werden nur bei hinreichend sicherer Identifizierung verwendet; sonst steht eine konservative deutsche Transliteration des Griechischen.
