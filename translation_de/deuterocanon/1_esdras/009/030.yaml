  yaml_path: translation/deuterocanon/1_esdras/009/030.yaml
  text: 'And from the sons of Mani: Olamus[a], Mamuchus, Jedaeus, Jasubus, Asael[b], and Jeremoth.'
translation:
  language: de
  text: 'Und von den Söhnen Manis[a]: Olamus, Mamuchus, Jedäus, Jasubus, Asael[b] und Jeremoth.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Griechischen steht Mani; die hebräische Parallelliste in Esra wird gewöhnlich Bani zugeordnet.
    reason: alternative_reading
  - marker: b
    text: Mehrere Namen hier entsprechen wahrscheinlich hebräischen Namensformen aus der Parallelliste; der Haupttext folgt jedoch den griechischen Formen von 1 Esdras.
    reason: cross_reference
lexical_decisions:
- source_word: καὶ
  choice: Und
  rationale: Bewahrt den additiven Anschluss innerhalb der fortlaufenden Namensliste.
- source_word: ἐκ τῶν υἱῶν
  choice: von den Söhnen
  rationale: Gibt die Zugehörigkeit zur Familie beziehungsweise Sippe eng am griechischen Ausdruck und zugleich idiomatisch wieder.
- source_word: Μανί
  choice: Mani
  rationale: Folgt der griechischen Namensform des Primärtextes, statt sie stillschweigend an die hebräische Parallelliste anzugleichen.
- source_word: Ὤλαμος
  choice: Olamus
  rationale: Transliteriert die im griechischen Text überlieferte Namensform.
- source_word: Μάμουχος
  choice: Mamuchus
  rationale: Transliteriert die griechische Namensform; eine mögliche Angleichung an Malluch wird nicht in den Haupttext übernommen.
- source_word: Ἰεδαῖος
  choice: Jedäus
  rationale: Deutsch lesbare Transliteration der griechischen Form unter Wiedergabe der Lautfolge αι durch ä.
- source_word: Ἰάσουβος
  choice: Jasubus
  rationale: Bewahrt die vollständige griechische Namensform, ohne sie zur möglichen hebräischen Entsprechung Jaschub zu harmonisieren.
- source_word: Ἀσάηλος
  choice: Asael
  rationale: Gängige deutsch lesbare Wiedergabe des Eigennamens ohne griechische Nominativendung.
- source_word: Ἰερεμώθ
  choice: Jeremoth
  rationale: Direkte Transliteration der griechischen Namensform.
