base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/005.yaml
  text: And those from the tribe of Judah and Benjamin were gathered in Jerusalem within three days; it was the ninth month[a], on the twentieth day of the month.
translation:
  language: de
  text: Diejenigen aus dem Stamm Juda und Benjamin[a] kamen innerhalb von drei Tagen in Jerusalem zusammen. Es war im neunten Monat, am zwanzigsten Tag des Monats.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Im Griechischen steht „Stamm“ in der Einzahl, obwohl Juda und Benjamin genannt werden. Gemeint sind die Menschen, die zu Juda und Benjamin gehören. Die hebräische Parallele in Esra 10,9 lautet: „Alle Männer von Juda und Benjamin versammelten sich innerhalb von drei Tagen in Jerusalem.“'
    reason: Die Fußnote macht die ungewöhnliche griechische Konstruktion transparent und nennt die abweichend formulierte hebräische Parallele.
lexical_decisions:
- source_word: ἐπισυνήχθησαν
  choice: kamen … zusammen
  rationale: Die mediale/passive Form bezeichnet hier das Zusammenkommen der Menschen. Die deutsche Wendung ist natürlich und lässt offen, ob sie aus eigenem Antrieb kamen oder einberufen worden waren.
- source_word: οἱ ἐκ τῆς φυλῆς Ἰούδα καὶ Βενιαμεὶν
  choice: die aus dem Stamm Juda und Benjamin
  rationale: Die Wiedergabe bewahrt den auffälligen Singular φυλῆς („Stamm“) bei den beiden Namen und vermeidet das im Griechischen nicht ausdrücklich enthaltene „Männer“.
- source_word: ἐν τρισὶν ἡμέραις
  choice: innerhalb von drei Tagen
  rationale: Im Zusammenhang bezeichnet die Wendung am ehesten einen Zeitraum beziehungsweise eine Frist, nicht zwingend erst den dritten Tag.
- source_word: εἰς Ἰερουσαλήμ
  choice: in Jerusalem
  rationale: εἰς hat grundsätzlich eine Richtungskomponente; zusammen mit „kamen … zusammen“ bezeichnet „in Jerusalem“ im natürlichen Deutschen zugleich den Ziel- und Versammlungsort.
- source_word: οὗτος ὁ μὴν ἔνατος
  choice: Es war der neunte Monat
  rationale: Diese idiomatische Zeitangabe gibt die identifizierende griechische Klausel klar wieder.
- source_word: τῇ εἰκάδι τοῦ μηνός
  choice: am zwanzigsten Tag des Monats
  rationale: εἰκάς bezeichnet den zwanzigsten Monatstag; die ausgeschriebene Form ist für heutige Leser eindeutig.
