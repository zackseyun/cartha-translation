base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/042.yaml
  text: And Ezra the priest and reader of the law stood on the wooden platform that had been constructed;[a]
translation:
  language: de
  text: Und Esra, der Priester und Vorleser des Gesetzes, stand auf der hölzernen Plattform, die errichtet worden war.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der hebräische Paralleltext in Nehemia 8,4 bezeichnet Esra als „Schriftgelehrten“ und sagt, der hölzerne Aufbau sei „für die Sache“ oder „für diesen Anlass“ angefertigt worden. Der griechische Text von 1 Esdras nennt ihn dagegen „den Priester und Vorleser des Gesetzes“ und sagt lediglich, dass die Plattform errichtet worden war.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔστη
  choice: trat
  rationale: Der narrative Aorist von ἵστημι beschreibt hier, dass Esra seinen Platz auf der Plattform einnahm. „Trat auf“ ist im Deutschen natürlicher als das statische „stand auf“ und bewahrt den erzählerischen Fortgang.
- source_word: Ἔσρας
  choice: Esra
  rationale: Gebräuchliche deutsche Namensform.
- source_word: ὁ ἱερεύς
  choice: der Priester
  rationale: Der griechische Hauptzeuge bezeichnet Esra ausdrücklich als Priester; dies wird nicht an die abweichende Bezeichnung im hebräischen Paralleltext angeglichen.
- source_word: ἀναγνώστης τοῦ νόμου
  choice: Vorleser des Gesetzes
  rationale: ἀναγνώστης bezeichnet einen Leser, besonders einen öffentlichen Vorleser. „Vorleser des Gesetzes“ gibt die im Kontext erkennbare öffentliche Funktion idiomatisch wieder, ohne das griechische Wort durch das hebräische „Schriftgelehrter“ zu ersetzen.
- source_word: ἐπὶ τοῦ ξυλίνου βήματος
  choice: auf die hölzerne Plattform
  rationale: βῆμα kann eine erhöhte Stufe, einen Stand oder eine Plattform bezeichnen. „Hölzerne Plattform“ ist gegenwärtig, verständlich und für die öffentliche Lesung passend.
- source_word: τοῦ κατασκευασθέντος
  choice: die eigens errichtete
  rationale: Das substantivierte Aoristpassiv-Partizip bezeichnet die zuvor errichtete Plattform. „Eigens“ bringt in knapper, natürlicher Form zum Ausdruck, dass sie zu diesem Zweck hergestellt worden war, ohne den im Hebräischen ausdrücklich genannten Anlass in den Haupttext einzutragen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Vorleser“ wahrt die gegenüber dem masoretischen Paralleltext eigenständige Aussage des griechischen Textes; „Plattform“ ist klarer und geläufiger als „Podium“ oder „Tribüne“.
