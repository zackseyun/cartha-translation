base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/043.yaml
  text: And Mattathias[a], Sammou, Ananias, Azarias, Ourias, Ezekias, and Baalsamos stood at his right hand,
translation:
  language: de
  text: Und Mattatias[a], Sammou, Ananias, Asarias, Urias, Ezekias und Baalsamos standen zu seiner Rechten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die griechischen Namen an dieser Stelle weichen von der ungefähr entsprechenden hebräischen Namensliste in Nehemia 8,4 ab. Da 1 Esdras hier nach dem griechischen Text übersetzt wird, bleiben dessen Namensformen erhalten.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔστησεν
  choice: standen
  rationale: Die griechische Form ist formal transitiv und singular („er stellte hin“). Im vorliegenden Satz fehlt jedoch ein ausdrückliches Subjekt, während eine Namensreihe und die Ortsangabe folgen. Daher gibt die idiomatische deutsche Wiedergabe „standen“ die erkennbare Szene klar wieder, ohne einen ungenannten Handelnden einzuführen.
- source_word: αὐτῷ
  choice: seiner
  rationale: Der Dativ bezeichnet hier zusammen mit der räumlichen Wendung die Stellung zu der zuvor genannten Person; im Deutschen ist „zu seiner Rechten“ die natürliche Entsprechung.
- source_word: ἐκ δεξιῶν
  choice: zu seiner Rechten
  rationale: Die feste räumliche Wendung bezeichnet die rechte Seite einer Person. „Zu seiner Rechten“ ist im Deutschen präzise, geläufig und dem würdigen Erzählregister angemessen.
- source_word: Ματταθίας, Σαμμοῦ, Ἀνανίας, Ἀζαρίας, Οὐρείας, Ἐζεκίας, Βαάλσαμος
  choice: Mattatias, Sammou, Ananias, Asarias, Urias, Ezekias und Baalsamos
  rationale: Die Personennamen werden nach den griechischen Formen von 1 Esdras wiedergegeben und nicht an die abweichende Namensliste des hebräischen Paralleltexts in Nehemia 8,4 angeglichen. Dabei folgen „Asarias“ für Ἀζαρίας und „Urias“ für Οὐρείας gebräuchlichen deutschen Laut- und Umschriftkonventionen.
