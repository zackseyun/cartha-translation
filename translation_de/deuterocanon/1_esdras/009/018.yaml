base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/018.yaml
  text: And among the priests there were found some who had taken foreign women[a].
translation:
  language: de
  text: Und unter den Priestern fanden sich einige, die ausländische Frauen genommen hatten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich im Griechischen: „die Versammelten, die ausländische Frauen hatten“. Der überlieferte Wortlaut ist etwas schwierig; die hebräische Parallele stützt den Sinn: „die ausländische Frauen genommen hatten“.'
    reason: textual_variant
lexical_decisions:
- source_word: εὑρέθησαν
  choice: fanden sich
  rationale: Das griechische Aoristpassiv bezeichnet hier das Ergebnis einer Feststellung oder Überprüfung. „Fanden sich“ gibt dies im modernen Deutschen natürlich wieder.
- source_word: τῶν ἱερέων
  choice: unter den Priestern
  rationale: 'Der Genitiv ist partititiv: Die festgestellten Personen gehörten zur Gruppe der Priester.'
- source_word: οἱ ἐπισυναχθέντες
  choice: einige
  rationale: Wörtlich steht „die Versammelten/Zusammengebrachten“. Die Formulierung wirkt im überlieferten griechischen Text syntaktisch und inhaltlich schwierig; „einige“ kennzeichnet zurückhaltend die betreffende Teilgruppe, während die Fußnote den Wortlaut offenlegt.
- source_word: ἀλλογενεῖς γυναῖκας
  choice: ausländische Frauen
  rationale: ἀλλογενής bezeichnet Menschen, die einem anderen Volk oder einer anderen Herkunftsgruppe angehören. „Ausländische Frauen“ ist gegenwärtig und vermeidet das missverständliche „fremde Frauen“.
- source_word: ἔχοντες
  choice: genommen hatten
  rationale: Wörtlich bedeutet das Partizip „habend“. Im Zusammenhang mit Frauen und gestützt durch die hebräische Parallele נָשְׂאוּ liegt die eheliche Wendung „Frauen nehmen“ nahe; sie bleibt näher am Ausgangstext als die ausdrückliche Festlegung „geheiratet hatten“.
theological_decisions:
- issue: Heranziehung der hebräischen Parallele zur Klärung der ehelichen Bedeutung
  choice: „die ausländische Frauen genommen hatten“
  alternative: „die ausländische Frauen hatten“ oder „die versammelten Priester, die ausländische Frauen hatten“
  rationale: Der griechische Text bleibt maßgeblich, doch die hebräische Parallele bestätigt den ehelichen Sinn. Die Übersetzung macht diesen Sinn verständlich, ohne durch „heiraten“ stärker festzulegen, als die Quellen es erfordern.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Ausländische Frauen“ gibt die ethnische Zugehörigkeit zu einem anderen Volk wieder; „Frauen genommen“ bewahrt die biblische Ehewendung, bleibt aber allgemein verständlich.
