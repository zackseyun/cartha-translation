base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/049.yaml
  text: 'And Attarates said to Ezra the chief priest and reader[a], and to the Levites who were teaching the multitude[b], to all of them:'
translation:
  language: de
  text: 'Und Attarates[a] sagte zu Esra, dem Hohepriester und Vorleser[b], und zu den Leviten, die die Menge unterrichteten, an alle:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Attarates entspricht wahrscheinlich der Person, die im hebräischen Paralleltext „Nehemia, der Tirschata“, das heißt der Statthalter, genannt wird.
    reason: alternative_reading
  - marker: b
    text: Griechisch „Vorleser“; der hebräische Paralleltext bezeichnet Esra hier als „Priester und Schriftgelehrten“.
    reason: textual_difference
lexical_decisions:
- source_word: Καὶ εἶπεν
  choice: Und … sagte
  rationale: Bewahrt den einfachen erzählerischen Anschluss des griechischen καί, ohne eine stärkere zeitliche Abfolge einzutragen.
- source_word: Ἀτταρατὴ
  choice: Attarates
  rationale: Die im griechischen Hauptzeugen überlieferte Form wird als Eigenname beziehungsweise Titel transliteriert und nicht stillschweigend durch die abweichende Bezeichnung des hebräischen Paralleltextes ersetzt.
- source_word: Ἔσρᾳ
  choice: Esra
  rationale: Entspricht der im Deutschen üblichen Form des Namens.
- source_word: τῷ ἀρχιερεῖ
  choice: dem Hohepriester
  rationale: ἀρχιερεύς bezeichnet gewöhnlich den Hohepriester; die geläufige deutsche Amtsbezeichnung gibt den griechischen Ausdruck klar und würdig wieder.
- source_word: καὶ ἀναγνώστῃ
  choice: und Vorleser
  rationale: ἀναγνώστης bezeichnet hier denjenigen, der den Text vorliest. Die Wiedergabe folgt dem Griechischen, während die leicht abweichende Bezeichnung im hebräischen Paralleltext in einer Fußnote dokumentiert wird.
- source_word: τοῖς Λευείταις τοῖς διδάσκουσι τὸ πλῆθος
  choice: zu den Leviten, die die Menge unterwiesen
  rationale: Das präsentische Partizip beschreibt die Leviten in ihrer laufenden Lehrtätigkeit; „unterwiesen“ ist im biblischen Kontext natürlich und verständlich.
- source_word: ἐπὶ πάντας
  choice: zu ihnen allen
  rationale: Die isoliert ungewöhnliche Wendung wird als zusammenfassender Bezug auf die zuvor genannten Adressaten verstanden. Die Formulierung bewahrt die Wiederaufnahme, ohne den Satz stärker als nötig an den hebräischen Paralleltext anzugleichen.
theological_decisions:
- issue: Identität von Ἀτταρατὴ im Verhältnis zum hebräischen Paralleltext
  choice: Die griechische Form „Attarates“ bleibt im Haupttext; die mögliche Identifikation mit Nehemia, dem Statthalter, steht in der Fußnote.
  alternative: Im Haupttext „Nehemia, der Statthalter“ oder „der Tirschata“ schreiben.
  rationale: Für 1 Esdras ist der griechische Text der primäre Übersetzungszeuge. Die wichtige, aber abweichende hebräische Überlieferung soll die griechische Namensform nicht verdrängen.
- issue: Bezeichnung Esras als ἀναγνώστης
  choice: „Vorleser“ nach dem griechischen Wortlaut.
  alternative: „Schriftgelehrter“ entsprechend dem hebräischen Paralleltext.
  rationale: Die unterschiedlichen Amtsbezeichnungen der Texttraditionen werden nicht harmonisiert; die griechische Lesart steht im Text, die hebräische Parallele in der Fußnote.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Hohepriester“ und „Vorleser“ geben die griechischen Amtsbezeichnungen unmittelbar wieder. Die etwas ungewöhnliche abschließende Wiederaufnahme „zu ihnen allen“ bleibt erhalten, weil auch der griechische Satzbau an dieser Stelle knapp und sperrig ist.
