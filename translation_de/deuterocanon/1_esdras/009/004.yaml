base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/004.yaml
  text: And whoever does not appear within two or three days[a], according to the judgment of the presiding elders, their livestock will be devoted[b], and he himself will be excluded from the assembly of the captivity.
translation:
  language: de
  text: Und wer nicht innerhalb von zwei oder drei Tagen erscheint, dessen Vieh wird nach dem Urteil der vorsitzenden Ältesten geweiht werden[a], und er selbst wird aus der Gemeinschaft der Weggeführten ausgeschlossen werden[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder sinngemäß: „dessen Vieh wird eingezogen“. Das griechische Verb bedeutet wörtlich „weihen“ oder „einem heiligen Zweck zuordnen“; in diesem rechtlichen Zusammenhang bezeichnet es offenbar eine strafweise Einziehung.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „aus der Menge der Gefangenschaft“; gemeint ist die Gemeinschaft der aus der Gefangenschaft Weggeführten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπαντήσωσιν
  choice: erscheint
  rationale: Im Zusammenhang einer verbindlichen Einberufung bezeichnet das Verb das Erscheinen als Antwort auf den Aufruf; „erscheint“ gibt diesen rechtlichen Sinn natürlich wieder.
- source_word: ἐν δυσὶν ἢ τρισὶν ἡμέραις
  choice: innerhalb von zwei oder drei Tagen
  rationale: „Innerhalb“ macht die im Kontext vorausgesetzte Frist idiomatisch deutlich, ohne ihren ungewöhnlichen Wortlaut zu glätten.
- source_word: κατὰ τὸ κρῖμα
  choice: dem Urteil … entsprechend
  rationale: κρῖμα bezeichnet hier eine verbindliche richterliche Entscheidung; „Urteil“ wahrt den förmlichen Rechtston.
- source_word: τῶν προκαθημένων πρεσβυτέρων
  choice: der vorsitzenden Ältesten
  rationale: Das Partizip bezeichnet Älteste in leitender beziehungsweise vorsitzender Funktion.
- source_word: ἀνιερωθήσονται
  choice: soll dem Heiligtum verfallen
  rationale: Das Verb trägt den Gedanken der Weihung oder Zueignung an das Heilige. In diesem Strafzusammenhang schließt dies wahrscheinlich Einziehung ein; die Formulierung bewahrt beide Aspekte besser als ein bloßes „beschlagnahmt werden“.
- source_word: τὰ κτήνη αὐτῶν
  choice: dessen Vieh
  rationale: κτήνη bezeichnet am unmittelbarsten Nutz- beziehungsweise Herdentiere. Der Numeruswechsel entspricht dem griechischen Wechsel vom unbestimmten Plural zum einzelnen Betroffenen und wird im Deutschen klar aufgelöst.
- source_word: ἀλλοτριωθήσεται
  choice: soll … ausgeschlossen werden
  rationale: In Bezug auf eine Gemeinschaft bezeichnet das Passiv die Entfremdung beziehungsweise den Ausschluss aus ihrer Zugehörigkeit.
- source_word: ἀπὸ τοῦ πλήθους τῆς αἰχμαλωσίας
  choice: aus der Gemeinschaft der Weggeführten
  rationale: πλῆθος meint hier die versammelte Gemeinschaft; αἰχμαλωσία bezeichnet kollektiv diejenigen, die in die Gefangenschaft geführt worden waren. Die Wiedergabe ist natürlicher als „Menge der Gefangenschaft“, ohne die Exilsperspektive aufzugeben.
theological_decisions:
- issue: Art der Sanktion über Vieh und Person
  choice: Das Vieh verfällt dem Heiligtum, und die betreffende Person wird aus der Gemeinschaft ausgeschlossen.
  alternative: Der gesamte Besitz wird ohne kultische Nebenbedeutung eingezogen.
  rationale: Der griechische Primärtext nennt ausdrücklich κτήνη („Vieh“) und verwendet ein Verb der Weihung beziehungsweise sakralen Zueignung. Der rechtliche Zusammenhang legt eine praktische Einziehung nahe, rechtfertigt aber nicht, den kultischen Anklang oder die Beschränkung auf Vieh im Haupttext zu beseitigen.
translation_notes:
  register: Moderne, würdige Rechtssprache. Der Haupttext folgt dem griechischen Primärzeugen auch dort, wo die semitische Parallelüberlieferung einen umfassenderen Besitzverfall nahelegt. Die Fußnoten bewahren die rechtliche und kultische Bedeutungsbreite, ohne sie konfessionell festzulegen.
