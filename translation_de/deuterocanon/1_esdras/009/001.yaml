translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur wurde für einen natürlichen deutschen Erzählfluss leicht umgeformt; die im griechischen Haupttext überlieferten Eigennamen bleiben erhalten.
