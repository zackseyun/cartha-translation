base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/001.yaml
  text: Then Ezra rose up from the court of the temple and went into the chamber of Jona son of Naseib[b][a],
translation:
  language: de
  text: Da stand Esra auf, verließ den Vorhof des Tempels und ging in die Kammer Jonas, des Sohnes Naseibs.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im griechischen Text stehen die Namen „Jona“ und „Naseib“. Der hebräische Paralleltext in Esra 10,6 nennt dagegen „Johanan, den Sohn Eljaschibs“.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀναστὰς
  choice: stand Esra auf
  rationale: Das Aoristpartizip von ἀνίστημι leitet die anschließende Handlung ein; die finite deutsche Form ergibt einen natürlichen Erzählfluss.
- source_word: ἀπὸ τῆς αὐλῆς τοῦ ἱεροῦ
  choice: verließ den Vorhof des Tempels
  rationale: αὐλή bezeichnet hier den Hof des Tempelbezirks, während ἱερόν den Tempelkomplex meint. Mit „verließ“ wird die durch ἀπό bezeichnete Bewegung vom Hof weg idiomatisch ausgedrückt.
- source_word: ἐπορεύθη
  choice: ging
  rationale: Schlichte, natürliche Wiedergabe des üblichen griechischen Verbs der Fortbewegung.
- source_word: παστοφόριον
  choice: Kammer
  rationale: Das Wort bezeichnet einen Nebenraum beziehungsweise eine Kammer innerhalb eines Tempel- oder Gebäudekomplexes; „Kammer“ wahrt den architektonischen und leicht gehobenen Ton.
- source_word: Ἰωνᾶ τοῦ Νασείβου
  choice: Jonas, des Sohnes Naseibs
  rationale: Die Eigennamen werden entsprechend dem vorliegenden griechischen Haupttext wiedergegeben. Die abweichenden Namen des hebräischen Parallelttexts werden in einer Fußnote genannt, nicht stillschweigend in den Text eingesetzt.
