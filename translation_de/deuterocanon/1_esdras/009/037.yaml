base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/037.yaml
  text: And the priests and the Levites and those from Israel lived in Jerusalem and in the country at the new moon of the seventh month[b][a], and the sons of Israel were in their settlements.
translation:
  language: de
  text: Und die Priester, die Leviten und diejenigen aus Israel wohnten[a] in Jerusalem und im Land am Neumond des siebten Monats[b], und die Söhne Israels waren in ihren Siedlungen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ließen sich nieder“.'
    reason: lexical_alternative
  - marker: b
    text: Im Griechischen steht „am Neumond des siebten Monats“. Die hebräische Parallele in Nehemia weicht hier erheblich ab; die Übersetzung folgt daher dem griechisch überlieferten Wortlaut von 1 Esdras.
    reason: alternative_reading
lexical_decisions:
- source_word: κατῴκησαν
  choice: wohnten
  rationale: Der Aorist von κατοικέω bezeichnet das Wohnen oder Ansässigsein an einem Ort. „Wohnten“ ist natürlich und bewahrt den Grundsinn; die mögliche Nuance „ließen sich nieder“ wird in einer Fußnote genannt.
- source_word: οἱ ἐκ τοῦ Ἰσραήλ
  choice: die aus Israel
  rationale: Die knappe Wiedergabe bewahrt die vom späteren Ausdruck „Söhne Israels“ verschiedene griechische Formulierung, ohne sie vorschnell mit „Israeliten“ gleichzusetzen.
- source_word: ἐν Ἰερουσαλὴμ καὶ ἐν τῇ χώρᾳ
  choice: in Jerusalem und im Land
  rationale: χώρα bezeichnet hier das Gebiet außerhalb beziehungsweise neben Jerusalem. „Land“ ist im Deutschen würdig und ausreichend offen, ohne auf Dörfer oder Umland einzuengen.
- source_word: τῇ νουμηνίᾳ τοῦ ἑβδόμου μηνός
  choice: als der Neumond des siebten Monats war
  rationale: νουμηνία bezeichnet den Neumond beziehungsweise den Neumondstag als Monatsbeginn. Diese Formulierung erhält die ausdrückliche Neumondangabe und verbindet sie entsprechend der griechischen Wortfolge mit dem vorausgehenden Wohnen.
- source_word: οἱ υἱοὶ Ἰσραήλ
  choice: die Söhne Israels
  rationale: Die wörtliche familiäre Bezeichnung bleibt erhalten und wahrt zugleich den sprachlichen Unterschied zum vorausgehenden „die aus Israel“.
- source_word: κατοικίαις
  choice: Siedlungen
  rationale: κατοικία kann einen Wohnort oder eine Ansiedlung bezeichnen. Der Plural „Siedlungen“ passt zum kollektiven geografischen Zusammenhang besser als das auf einzelne Gebäude bezogene „Häuser“.
theological_decisions:
- issue: Verhältnis des griechischen Wortlauts zur nur ungefähren masoretischen Parallele in Nehemia 8,1
  choice: Die griechische Abfolge wird einschließlich des Neumonds des siebten Monats übersetzt.
  alternative: Den Vers an die masoretische Darstellung angleichen, wonach sich das Volk wie ein Mann vor dem Wassertor versammelt.
  rationale: Für 1 Esdras ist der griechische Text die maßgebliche Quelle. Die erheblich abweichende hebräische Parallele darf den griechischen Wortlaut nicht verdrängen oder harmonisierend ersetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parataktische Satzführung mit wiederholtem „und“ bildet den griechischen Erzählfluss ab. Die Marker stehen in der vom konsultierten englischen Text vorgegebenen Reihenfolge [b][a].
