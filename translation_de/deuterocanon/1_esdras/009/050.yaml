base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/050.yaml
  text: This day is holy to the Lord[a], and all were weeping when they heard the law.
translation:
  language: de
  text: Dieser Tag ist dem Herrn heilig[a], und alle weinten, als sie das Gesetz hörten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der hebräische Paralleltext in Nehemia 8 spricht von „unserem Herrn“ und fährt mit der Aufforderung fort, zu essen, zu trinken, anderen Anteile zu schicken und nicht traurig zu sein. 1 Esdras bewahrt hier einen kürzeren griechischen Wortlaut.
    reason: cross_reference
lexical_decisions:
- source_word: Ἡ ἡμέρα αὕτη
  choice: Dieser Tag
  rationale: Gibt die demonstrative Wendung direkt und in natürlichem modernem Deutsch wieder.
- source_word: ἁγία τῷ κυρίῳ
  choice: ist dem Herrn heilig
  rationale: Bewahrt die prädikative Konstruktion und gibt den Dativ eng am Griechischen wieder. „Heilig“ erhält den religiösen Gehalt; das im hebräischen Paralleltext stehende „unserem“ wird nicht ergänzt.
- source_word: πάντες
  choice: alle
  rationale: Entspricht dem knappen griechischen Ausdruck, ohne das nicht ausdrücklich genannte Substantiv „Menschen“ oder „Volk“ hinzuzufügen.
- source_word: ἔκλαιον
  choice: weinten
  rationale: Das deutsche Präteritum bezeichnet hier den im Kontext andauernden Vorgang natürlich; eine Umschreibung wie „waren am Weinen“ wäre schwerfällig.
- source_word: ἐν τῷ ἀκοῦσαι
  choice: als sie … hörten
  rationale: Gibt die temporale Funktion des präpositionalen substantivierten Infinitivs idiomatisch wieder.
- source_word: τὸν νόμον
  choice: das Gesetz
  rationale: Ist die direkte Wiedergabe von νόμος und passt zum öffentlich verlesenen Gesetz beziehungsweise zur Tora, ohne die hebräische Bedeutungsnuance „Weisung“ gegen den griechischen Primärtext vorzuziehen.
theological_decisions:
- issue: Ob Angaben aus dem masoretischen Paralleltext, besonders „unserem Herrn“ und die anschließende Aufforderung, nicht traurig zu sein, in den Haupttext aufgenommen werden sollen
  choice: Nur den kürzeren griechischen Wortlaut wiedergeben.
  alternative: Den Text nach Nehemia 8,10 um „unserem“ oder die weiteren Aufforderungen erweitern.
  rationale: Der griechische Text von 1 Esdras ist die primäre Grundlage. Der hebräische Paralleltext bestätigt den Zusammenhang, darf die eigenständige kürzere Fassung jedoch nicht harmonisierend erweitern.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau bleibt nahe am knappen griechischen Wortlaut, ohne unnatürliche Gräzismen oder Ergänzungen aus dem hebräischen Paralleltext.
