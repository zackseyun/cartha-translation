base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/036.yaml
  text: All these had lived with foreign women[a], and they sent them away with the children.
translation:
  language: de
  text: Alle diese hatten mit ausländischen Frauen[a] zusammengelebt und schickten sie samt den Kindern fort.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hebräische Paralleltext formuliert ausdrücklicher: »hatten ausländische Frauen geheiratet« oder »hatten ausländische Frauen zur Frau genommen«.'
    reason: Bewahrt den deutlicher ehelichen Sinn des semitischen Parallelzeugen, ohne ihn in den am Griechischen orientierten Haupttext einzutragen.
lexical_decisions:
- source_word: πάντες οὗτοι
  choice: Alle diese
  rationale: Gibt die demonstrative Wendung unmittelbar wieder, ohne das im Griechischen nicht ausdrücklich stehende »Männer« hinzuzufügen.
- source_word: συνῴκησαν
  choice: hatten … zusammengelebt
  rationale: Bewahrt die Grundbedeutung des gemeinsamen Wohnens beziehungsweise Zusammenlebens. Der eheliche Zusammenhang bleibt erkennbar, wird aber nicht stärker ausgedrückt als im griechischen Hauptzeugen.
- source_word: γυναῖξιν ἀλλογενέσιν
  choice: mit ausländischen Frauen
  rationale: ἀλλογενής bezeichnet Menschen aus einem anderen Volk beziehungsweise fremder Herkunft. »Ausländisch« ist im heutigen Deutsch verständlich; »Frauen« entspricht dem griechischen Wort, während »Ehefrauen« die Beziehung expliziter festlegen würde.
- source_word: ἀπέλυσαν αὐτὰς
  choice: schickten sie … fort
  rationale: Gibt das Entlassen oder Wegschicken idiomatisch wieder, ohne einen späteren technischen Scheidungsbegriff einzutragen.
- source_word: σὺν τέκνοις
  choice: samt den Kindern
  rationale: »Samt« bildet die Begleitung knapp und natürlich ab. Der bestimmte Artikel macht die im Kontext gemeinten Kinder kenntlich, ohne ein im Griechischen nicht ausdrücklich vorhandenes Possessivpronomen einzufügen.
theological_decisions:
- issue: Soll die Beziehung ausdrücklich als Ehe bezeichnet werden?
  choice: Im Haupttext steht »mit ausländischen Frauen zusammengelebt«.
  alternative: »ausländische Frauen geheiratet« oder »ausländische Frauen zur Frau genommen«
  rationale: Der griechische Hauptzeuge verwendet συνῴκησαν, wörtlich ein Zusammenleben. Der hebräische Paralleltext bezeugt deutlicher das Nehmen fremder Frauen und stützt damit den ehelichen Kontext; die Übersetzung bewahrt dennoch die weniger ausdrückliche Formulierung des griechischen Ausgangstextes.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Zusammengelebt« ist natürlich und textnah; »samt den Kindern« vermeidet eine nicht ausdrücklich belegte Besitzangabe.
