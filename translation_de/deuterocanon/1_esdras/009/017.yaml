translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Die Satzstruktur bleibt nahe am griechischen Passiv, ohne unnatürlich zu wirken. Die textliche Schwierigkeit wird nicht verdeckt, sondern in Fußnote [a] ausdrücklich dokumentiert.
