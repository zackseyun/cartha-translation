base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/017.yaml
  text: And the matter concerning the men who had taken foreign women was brought to an end by the new moon of the first month[a][b].
translation:
  language: de
  text: Und die Angelegenheit in Bezug auf die Männer, die fremde Frauen genommen hatten, wurde bis zum Neumond des ersten Monats abgeschlossen.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der griechische Text ist hier schwierig. Das Partizip kann wörtlicher als „die Männer, die versammelt worden waren“ verstanden werden. Der hebräische Paralleltext stützt im Zusammenhang den Sinn „die Männer, die fremde Frauen genommen hatten“, dem der Haupttext folgt.
    reason: alternative_reading
  - marker: b
    text: Der „Neumond des ersten Monats“ bezeichnet den ersten Tag des ersten Monats im Mondkalender.
    reason: cultural_note
lexical_decisions:
- source_word: ἦχθη ἐπὶ πέρας
  choice: wurde … abgeschlossen
  rationale: Die passive Wendung bezeichnet, dass etwas zu Ende beziehungsweise zum Abschluss gebracht wurde. „Wurde abgeschlossen“ gibt den Abschlussgedanken klar und in natürlichem Deutsch wieder.
- source_word: τὰ κατὰ τοὺς ἄνδρας
  choice: die Angelegenheit der Männer
  rationale: Der substantivierte Neutrum-Plural mit κατά bezeichnet hier das, was die Männer betrifft, also ihre Angelegenheit beziehungsweise ihre Fälle. Der Singular „Angelegenheit“ fasst das gemeinsame Untersuchungsverfahren idiomatisch zusammen.
- source_word: τοὺς ἐπισυναχθέντας
  choice: die … genommen hatten
  rationale: Die überlieferte griechische Form bedeutet für sich genommen gewöhnlich „die versammelt worden waren“ und ist im Satz schwierig. Der hebräische Paralleltext und der Zusammenhang handeln jedoch von Männern, die fremde Frauen genommen hatten. Dieser kontextuelle Sinn steht im Haupttext; die formnähere griechische Lesart wird in einer Fußnote bewahrt.
- source_word: γυναῖκας ἀλλογενεῖς
  choice: fremde Frauen
  rationale: ἀλλογενής bezeichnet Menschen aus einem anderen Volk beziehungsweise fremder Herkunft. „Fremde Frauen“ ist in diesem Esra-Kontext klar, knapp und entspricht dem hebräischen Paralleltext נָשִׁים נָכְרִיּוֹת.
- source_word: ἕως τῆς νουμηνίας τοῦ πρώτου μηνός
  choice: bis zum Neumond des ersten Monats
  rationale: νουμηνία bezeichnet den Neumond und damit kalendarisch den ersten Tag eines Mondmonats. „Bis zum“ bewahrt die zeitliche Grenzangabe des griechischen ἕως.
