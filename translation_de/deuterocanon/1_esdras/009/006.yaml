  naturalness: Der Satz ist modernes, flüssiges Standarddeutsch. „Setzte sich gemeinsam … nieder“ ist verständlich, doch „setzte sich … zusammen“ ist die idiomatischere und knappere Wiedergabe des Kompositums συνεκάθισαν.
