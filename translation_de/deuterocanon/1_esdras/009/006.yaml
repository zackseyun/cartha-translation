base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/006.yaml
  text: And the whole assembly sat together in the open court of the temple[b][a], trembling because of the present storm.
translation:
  language: de
  text: Und die ganze Versammlung setzte sich auf dem weiten Platz des Tempels zusammen[a] und zitterte wegen des herrschenden Unwetters[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „im weiten Bereich des Tempels“ oder „an einem geräumigen Ort im Tempelbezirk“. Der griechische Ausdruck bezeichnet einen breiten oder geräumigen Bereich; ob damit ein offener Platz innerhalb des Tempelbezirks gemeint ist, bleibt offen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „wegen des gerade herrschenden Winterwetters“ oder „wegen des gegenwärtigen Sturms“. Das griechische Wort kann „Winter“, „Sturm“ oder allgemein „raues Wetter“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: συνεκάθισαν
  choice: setzte sich gemeinsam … nieder
  rationale: Die Wiedergabe bewahrt sowohl das konkrete Sitzen beziehungsweise Sichniederlassen als auch das durch συν- ausgedrückte gemeinsame Handeln.
- source_word: πᾶν τὸ πλῆθος
  choice: die ganze Versammlung
  rationale: πλῆθος bezeichnet hier die vollständig versammelte Menschenmenge. „Versammlung“ entspricht dem geordneten gemeinschaftlichen Rahmen besser als „Menschenmenge“.
- source_word: ἐν τῇ εὐρυχώρῳ
  choice: auf dem weiten Platz
  rationale: Die substantivierte Form bezeichnet einen geräumigen, offenen Bereich. „Weiter Platz“ bleibt näher am ungewöhnlichen griechischen Ausdruck als das architektonisch stärker festlegende „Vorhof“.
- source_word: τοῦ ἱεροῦ
  choice: des Tempels
  rationale: ἱερόν kann den gesamten heiligen Tempelbezirk bezeichnen. „Tempel“ ist im Deutschen klar und lässt zusammen mit „Platz“ den weiteren Bezirk erkennen.
- source_word: τρέμοντες
  choice: zitterte
  rationale: Das konkrete körperliche Zittern bleibt erhalten. Der unmittelbare Bezug auf das Unwetter legt Kälte und Belastung nahe, ohne mögliche Furcht ausdrücklich auszuschließen.
- source_word: τὸν ἐνεστῶτα χειμῶνα
  choice: wegen des herrschenden Unwetters
  rationale: χειμών kann Winter, Sturm oder raues Wetter bedeuten; im Zusammenhang passt „Unwetter“ am besten. „Herrschend“ gibt ἐνεστῶτα als gegenwärtig eingetretene beziehungsweise auf ihnen lastende Wetterlage wieder.
