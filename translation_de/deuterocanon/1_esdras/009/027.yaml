base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/027.yaml
  text: 'From the sons of Elah: Mattan and Zechariah[a], Jezrikilus and Obadiah and Jeremoth and Aedeias.'
translation:
  language: de
  text: 'Von den Söhnen Elas: Mattan und Sacharja[a], Jesrikilos und Oabdios und Jeremot und Aëdeias.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mehrere Namen in diesem Vers werden eng nach dem Griechischen wiedergegeben, weil 1 Esdras in Schreibweise und Reihenfolge häufig von der hebräischen Parallelüberlieferung abweicht; bei einigen Namen sind vertrautere, am Hebräischen orientierte Formen möglich.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ τῶν υἱῶν
  choice: Von den Söhnen
  rationale: Bewahrt die Präposition ἐκ und die genealogische Listenform in natürlichem Deutsch.
- source_word: Ἠλά
  choice: Ela
  rationale: Nahe Wiedergabe der griechischen Namensform Ἠλά; ein zusätzliches h ist im Deutschen nicht erforderlich.
- source_word: Ματαν
  choice: Mattan
  rationale: Die Schreibung gibt den geläufigen semitischen Namen wieder und bleibt der griechischen Form nahe.
- source_word: Ζαχαρίας
  choice: Sacharja
  rationale: Eingebürgerte deutsche Form des biblischen Namens, die dem griechischen Ζαχαρίας entspricht.
- source_word: Ἰεζρίκιλος
  choice: Jesrikilos
  rationale: Nahe deutsche Transliteration des seltenen und unsicher zuzuordnenden griechischen Namens; vermeidet eine spekulative Angleichung.
- source_word: Ὠαβδίος
  choice: Oabdios
  rationale: Folgt der überlieferten griechischen Form enger als eine Harmonisierung mit dem geläufigen Namen Obadja.
- source_word: Ἱερεμὼθ
  choice: Jeremot
  rationale: Nahe Transliteration der griechischen Namensform in deutscher Schreibweise.
- source_word: Ἀηδείας
  choice: Aëdeias
  rationale: Nahe Transliteration; das Trema macht deutlich, dass A und e getrennt gesprochen werden, ohne den unsicheren Namen an eine hebräische Form anzugleichen.
