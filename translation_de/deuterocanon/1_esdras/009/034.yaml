base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/034.yaml
  text: 'And from the sons of Baanei: Jeremias[a], Momdios, Maeros, Jouna, Mamdai, and Pedias, and Anos, Carabasion, and Enaseibos, and Mamntanaimos, Eliaseis, Bannous, Edialeis, Someis, Selemias, Nathanias; and from the sons of Exora: Seseis, Ezreil, Azaelos, Samatos, Zambrei[b], Phosepos.'
translation:
  language: de
  text: 'Und von den Söhnen Baaneis: Jeremias[a], Momdeios, Maeros, Juna, Mamdai, Pedias, Anos, Karabasion, Enaseibos, Mamntanaimos, Eliaseis, Bannus, Edialeis, Someis, Selemias und Nathanias; und von den Söhnen Exoras: Seseis, Ezreil, Azaelos, Samatos, Zambrei[b] und Phosepos.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mehrere Namen in diesem Vers werden eng nach dem griechischen Text transkribiert und nicht an geläufigere hebräische Formen der Parallelüberlieferung angeglichen, weil für diese Übersetzung der griechische Text von 1 Esdras maßgeblich ist.
    reason: lexical_alternative
  - marker: b
    text: Die ungefähre Parallelüberlieferung im masoretischen Text im Umfeld von Esra 10 bietet diese vollständige Namensfolge nicht in derselben Form; daher folgt die Übersetzung hier der griechischen Liste.
    reason: cross_reference
lexical_decisions:
- source_word: καὶ ἐκ τῶν υἱῶν
  choice: Und von den Söhnen
  rationale: Bewahrt die genealogische Listenstruktur des Griechischen; im Deutschen ist die Zugehörigkeit durch den folgenden Genitiv klar.
- source_word: Βαανεί
  choice: Baaneis
  rationale: Die griechische Namensform bleibt erkennbar; die Genitivendung -s kennzeichnet im Deutschen die Gruppe als Söhne Baaneis, ohne an die ungefähre masoretische Parallelüberlieferung anzugleichen.
- source_word: Ἰερεμίας
  choice: Jeremias
  rationale: Nahe Umschrift der griechischen Namensform und zugleich eine im Deutschen geläufige biblische Form.
- source_word: Ἰουνά
  choice: Juna
  rationale: Die griechische Form wird in einer für deutsche Leser natürlichen Umschrift wiedergegeben; Iota am Wortanfang erscheint als J.
- source_word: Καραβασιὼν
  choice: Karabasion
  rationale: Direkte, deutschsprachig passende Umschrift mit K für griechisches Kappa.
- source_word: Ἐζρείλ
  choice: Esreil
  rationale: Nahe Umschrift des griechischen Namens; Zeta wird gemäß verbreiteter deutscher Aussprachekonvention als s wiedergegeben.
- source_word: Ἀζάηλος
  choice: Asaelos
  rationale: Bewahrt die griechische Form, ohne sie unbelegt an einen bekannteren hebräischen Namen anzugleichen.
- source_word: Ζαμβρεί
  choice: Sambrei
  rationale: Nahe deutsche Umschrift der griechischen Form; Zeta wird als s wiedergegeben.
