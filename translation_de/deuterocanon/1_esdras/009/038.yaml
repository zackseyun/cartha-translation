base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/038.yaml
  text: And all the multitude gathered together with one accord in the open square of the eastern gate of the temple,[a]
translation:
  language: de
  text: Und die ganze Menge versammelte sich einmütig auf dem weiten Platz am östlichen Tor des Tempels.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „auf den geräumigen Platz beim östlichen Tor des Tempels“. Die griechische Wendung ἐπὶ τὸ εὐρύχωρον kann die Bewegung auf einen weiten, offenen Bereich hin ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: συνήχθη
  choice: versammelte sich
  rationale: Das Aoristpassiv von συνάγω bezeichnet hier idiomatisch das Zusammenkommen der Menge; die reflexive deutsche Form ist natürlich und wahrt den kollektiven Vorgang.
- source_word: πᾶν τὸ πλῆθος
  choice: die ganze Menge
  rationale: Die Formulierung gibt πᾶν und das kollektive Substantiv πλῆθος vollständig und in heutigem Deutsch wieder, ohne einen institutionellen Sinn wie bei „Versammlung“ einzutragen.
- source_word: ὁμοθυμαδόν
  choice: einmütig
  rationale: Das Adverb bezeichnet gemeinsames, übereinstimmendes Handeln und nicht nur räumliches Beisammensein.
- source_word: ἐπὶ τὸ εὐρύχωρον
  choice: auf dem freien Platz
  rationale: εὐρύχωρον bezeichnet hier einen weiten, offenen Bereich. „Freier Platz“ ist verständlich und lässt offen, ob ein förmlich angelegter Platz gemeint ist; die Richtungsnuance der Präposition wird in der Fußnote ausgewiesen.
- source_word: τοῦ πρὸς ἀνατολάς
  choice: am östlichen
  rationale: Die wörtliche Richtungsangabe „nach Osten hin“ identifiziert das Tor; „östlich“ ist dafür die natürliche attributive Wiedergabe.
- source_word: ἱεροῦ πυλῶνος
  choice: Tor des Tempels
  rationale: ἱερόν bezeichnet den Tempel beziehungsweise Tempelbezirk, πυλών ein Tor oder Torgebäude. Die Genitivverbindung wird klar und würdig wiedergegeben.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch in würdigem Erzählstil. „Einmütig“ bewahrt die Aussage über die gemeinsame Ausrichtung der Menge; die Ortsangabe bleibt nahe am Griechischen, ohne die Beschaffenheit des Platzes unnötig festzulegen.
