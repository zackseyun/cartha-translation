  text: And those from the captivity did all these things[a].
translation:
  language: de
  text: Und die aus der Gefangenschaft führten all dies aus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Und die zurückgekehrten Verbannten handelten in allem danach.“ Wörtlich bezeichnet der griechische Ausdruck „die aus der Gefangenschaft“ die nachexilische Gemeinschaft.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐποίησαν
  choice: führten … aus
  rationale: ποιέω bezeichnet zusammen mit dem sachlichen Rückverweis hier die Ausführung der zuvor beschriebenen Maßnahmen, nicht das Herstellen von etwas. „führten … aus“ ist im Deutschen natürlicher und präziser als „taten“.
- source_word: κατὰ πάντα ταῦτα
  choice: all dies
  rationale: Die Wendung verweist umfassend auf das zuvor Berichtete. „All dies“ gibt πάντα und ταῦτα knapp und idiomatisch wieder; der Gedanke des Handelns entsprechend den Vorgaben wird durch „führten … aus“ mitgetragen.
- source_word: οἱ ἐκ τῆς αἰχμαλωσίας
  choice: die aus der Gefangenschaft
  rationale: Die bewusst knappe Formulierung folgt dem griechischen Ausdruck und bewahrt seinen Rückbezug auf die nachexilische Gemeinschaft. Eine ausdrückliche Wiedergabe als „die zurückgekehrten Verbannten“ wäre deutender.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe griechische Bezeichnung für die aus der Gefangenschaft stammende Gemeinschaft bleibt im Haupttext erhalten; die verständnisorientierte Alternative steht in der Fußnote. Der stark abweichende masoretische Paralleltext wurde wegen der vorgegebenen griechischen Primärgrundlage nicht in den Vers eingetragen.
