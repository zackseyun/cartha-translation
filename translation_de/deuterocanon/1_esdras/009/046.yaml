base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/046.yaml
  text: And when the law was read[a], they all stood upright; and Azarias blessed the Most High God, the Lord of hosts, the Almighty[c][b],
translation:
  language: de
  text: Als das Gesetz aufgeschlagen wurde[a], standen alle aufrecht. Und Asarias[b] pries den höchsten Gott, den Gott der Heerscharen[c], den Allmächtigen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Als das Gesetz gelöst wurde“. Gemeint ist hier wohl, dass die Gesetzesrolle zur öffentlichen Verlesung geöffnet oder entrollt wurde.'
    reason: lexical_alternative
  - marker: b
    text: Griechisch Asarias; die hebräische Parallelüberlieferung hat Asarja.
    reason: alternative_reading
  - marker: c
    text: Griechisch Sabaoth, traditionell auch Zebaot; der Titel bedeutet „(Gott) der Heerscharen“.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν τῷ λῦσαι τὸν νόμον
  choice: Als das Gesetz verlesen wurde
  rationale: Die substantivierte Infinitivkonstruktion ist temporal. λύω bedeutet wörtlich „lösen“ und kann hier das Öffnen beziehungsweise Entrollen der Gesetzesrolle bezeichnen; im Zusammenhang ist deren öffentliche Verlesung gemeint. Die Fußnote bewahrt die bildnähere Alternative.
- source_word: πάντες ὀρθοὶ ἔστησαν
  choice: standen alle aufrecht da
  rationale: ὀρθοί bezeichnet ausdrücklich die aufrechte Körperhaltung und wird daher nicht auf ein bloßes „standen“ verkürzt.
- source_word: εὐλόγησεν
  choice: pries
  rationale: Bei Gott als Gegenüber bezeichnet εὐλογέω das rühmende Segnen beziehungsweise Preisen. „Pries“ ist im heutigen Deutsch natürlicher als „segnete Gott“, ohne den kultischen Sinn abzuschwächen.
- source_word: Ἀζαρίας
  choice: Asarias
  rationale: Da der griechische Text die Übersetzungsgrundlage bildet, folgt der Haupttext der griechischen Namensform; die hebräische Parallelform wird in einer Fußnote genannt.
- source_word: τῷ ὑψίστῳ θεῷ
  choice: den höchsten Gott
  rationale: Die Formulierung gibt den geläufigen biblischen Hoheitstitel klar und unmittelbar wieder.
- source_word: σαβαὼθ
  choice: den Gott der Heerscharen
  rationale: Das semitische Lehnwort wird seinem Titelsinn nach übersetzt. Die ergänzende Wiederaufnahme von „Gott“ macht die Apposition im Deutschen verständlich, ohne den im Griechischen nicht vorhandenen Titel „Herr“ einzuführen.
- source_word: Παντοκράτορι
  choice: den Allmächtigen
  rationale: „Der Allmächtige“ ist die etablierte und verständliche deutsche Wiedergabe des göttlichen Titels παντοκράτωρ.
theological_decisions:
- issue: Titelreihe τῷ ὑψίστῳ θεῷ σαβαὼθ Παντοκράτορι
  choice: den höchsten Gott, den Gott der Heerscharen, den Allmächtigen
  alternative: den höchsten Gott Zebaot, den Allmächtigen
  rationale: Die gehäufte Abfolge eigenständiger Hoheitstitel bleibt erhalten. σαβαώθ wird semantisch wiedergegeben; „Herr der Heerscharen“ wurde vermieden, weil κύριος im griechischen Text nicht steht.
- issue: Bedeutung von εὐλόγησεν mit Gott als Gegenüber
  choice: pries
  alternative: segnete
  rationale: Die Wiedergabe wahrt, dass der Segen beziehungsweise Lobpreis Gott gilt, verwendet aber eine im modernen Deutschen unmissverständliche Formulierung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzteilung vermeidet eine schwerfällige Reihung, während die feierliche Abfolge der Gottesbezeichnungen erhalten bleibt. Die konkrete Haltung „aufrecht“ und die Mehrdeutigkeit des Öffnens beziehungsweise Verlesens werden bewahrt.
