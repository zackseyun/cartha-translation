base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/026/003.yaml
  text: A good wife is a good gift[a]; she will be given into the bosom of one who fears God.
translation:
  language: de
  text: Eine gute Frau ist eine gute Gabe; in den Schoß eines Menschen, der Gott fürchtet, wird sie gegeben.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Parallele lautet: »Als Anteil derer, die den Herrn fürchten, wird sie gegeben.« Der hebräische Text sagt dagegen: »in den Schoß eines Menschen, der Gott fürchtet«, und verwendet damit ein persönlicheres Bild.'
    reason: alternative_reading
lexical_decisions:
- source_word: אִשָּׁה טוֹבָה
  choice: eine gute Frau
  rationale: אִשָּׁה kann »Frau« oder »Ehefrau« bedeuten. Der Zusammenhang legt die eheliche Bedeutung nahe; im Deutschen kann »Frau« diese Bedeutung tragen, ohne die im Hebräischen vorhandene Mehrdeutigkeit ganz aufzuheben.
- source_word: מַתָּנָה טוֹבָה
  choice: eine gute Gabe
  rationale: »Gabe« gibt מַתָּנָה würdig und natürlich wieder; die Wiederholung von טוֹבָה als »gut« bleibt im knappen Spruchstil erhalten.
- source_word: בְּחֵיק
  choice: in den Schoß
  rationale: Die konkrete und persönliche Bildsprache des hebräischen חֵיק (Schoß/Busen) wird bewahrt. Das deutsche »in den Schoß« ist verständlich und kann zugleich Nähe und Zuteilung ausdrücken.
- source_word: יֵרֵא אֱלֹהִים
  choice: eines Menschen, der Gott fürchtet
  rationale: Die Formulierung bewahrt den singularischen Sinn und das hebräische Gottesprädikat אֱלֹהִים, ohne ein im Ausdruck selbst nicht genanntes männliches Substantiv einzufügen.
- source_word: תִּנָּתֵן
  choice: wird sie gegeben
  rationale: Das Nifal Imperfekt wird als passives Futur wiedergegeben; das Pronomen nimmt »eine gute Frau« als Subjekt eindeutig wieder auf.
theological_decisions:
- issue: Gottesbezeichnung im Schlusssatz
  choice: Gott
  alternative: der Herr
  rationale: Der vorrangige hebräische Text hat אֱלֹהִים (»Gott«), während die griechische Parallele Κύριον (»den Herrn«) liest. Der Haupttext folgt dem Hebräischen; die griechische Abweichung wird in der Fußnote dokumentiert.
- issue: Hebräisches Bild gegenüber der griechischen Zuteilungsformel
  choice: in den Schoß eines Menschen, der Gott fürchtet
  alternative: als Anteil derer, die den Herrn fürchten
  rationale: Das hebräische בְּחֵיק bietet ein intimeres, konkretes Bild und steht im Singular. Die griechische Parallele spricht dagegen vom Anteil der Gottesfürchtigen im Plural. Diese echte Textdifferenz wird nicht harmonisiert.
translation_notes:
  register: Moderner, würdiger Standarddeutsch-Stil mit knapper sprichwörtlicher Satzform. »Gabe« hält den Weisheitston, ohne altertümlich zu wirken. Die ungewöhnliche Wendung »in den Schoß« bleibt bewusst erhalten, weil sie die Bildsprache des hebräischen Primärtextes trägt.
