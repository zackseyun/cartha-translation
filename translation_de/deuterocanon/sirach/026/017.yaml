translation:
  language: de
  text: Wie die aufgehende Sonne in den Höhen des Herrn, so ist die Schönheit einer guten Frau in der Zierde seines Hauses.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „einer guten Ehefrau“. Das griechische Wort kann sowohl „Frau“ als auch „Ehefrau“ bedeuten; der Haushaltskontext legt „Ehefrau“ nahe.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „seines Hauses“. Das griechische Possessivpronomen ist maskulin. Das Wort für „Zierde“ kann auch „Ordnung“ oder „wohlgeordnete Gestaltung“ bedeuten.'
    reason: textual_and_lexical_ambiguity
lexical_decisions:
- source_word: ἥλιος ἀνατέλλων
  choice: die Sonne, die … aufgeht
  rationale: Die Relativsatzkonstruktion gibt das griechische Partizip natürlich und bildhaft wieder.
- source_word: ἐν ὑψίστοις Κυρίου
  choice: in den Höhen des Herrn
  rationale: Die Wiedergabe bewahrt sowohl den Plural von ὑψίστοις als auch den Genitiv Κυρίου, ohne deutend zu „Himmel“ zu glätten.
- source_word: κάλλος
  choice: Schönheit
  rationale: „Schönheit“ ist die direkte, im Vergleich passende Entsprechung.
- source_word: ἀγαθῆς γυναικός
  choice: einer guten Frau
  rationale: γυνή kann „Frau“ oder „Ehefrau“ bedeuten. Der Hauskontext legt „Ehefrau“ nahe, doch „Frau“ bewahrt im Haupttext die lexikalische Mehrdeutigkeit.
- source_word: ἐν κόσμῳ
  choice: in der Zierde
  rationale: κόσμος bezeichnet Ordnung, Schmuck oder Zierde. „Zierde“ ergibt im poetischen Vergleich einen natürlichen Sinn, ohne die mögliche Bedeutung „wohlgeordnete Gestaltung“ auszuschließen.
- source_word: οἰκίας αὐτοῦ
  choice: ihres Hauses
  rationale: Das griechische αὐτοῦ ist formal maskulin und bedeutet wörtlich „seines“. Im unmittelbaren Satzbezug kann das Pronomen jedoch auf die Frau bezogen und nach deutschem Genus als „ihres“ wiedergegeben werden; die formale Lesart wird in einer Fußnote erhalten.
theological_decisions:
- issue: Geschlechtsspezifische Bezeichnung γυνή
  choice: gute Frau
  alternative: gute Ehefrau
  rationale: Der häusliche Zusammenhang lässt an eine Ehefrau denken, aber das griechische Wort selbst bleibt zwischen „Frau“ und „Ehefrau“ mehrdeutig; diese Spannung wird nicht im Haupttext aufgelöst.
- issue: Bezug des Possessivpronomens αὐτοῦ
  choice: ihres Hauses
  alternative: seines Hauses
  rationale: Die syntaktisch naheliegende inhaltliche Zuordnung zur Frau ergibt im Deutschen „ihres“. Da die griechische Form maskulin ist und auch formal „seines“ gelesen werden kann, wird diese echte textliche Spannung in der Fußnote kenntlich gemacht.
translation_notes:
  register: Moderne, würdige und gut verständliche Bildsprache. Der Parallelismus des griechischen Satzes bleibt durch „Wie …, so …“ erhalten; echte Mehrdeutigkeiten werden in den Fußnoten offengelegt.
