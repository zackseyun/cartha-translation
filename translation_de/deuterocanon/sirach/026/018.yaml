  text: A lamp shining brightly on a holy lampstand[a], and the beauty of a face at a steadfast age.
translation:
  language: de
  text: Eine Lampe, die auf einem heiligen Leuchter hell strahlt, und die Schönheit eines Gesichts bei gefestigter Gestalt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »bei gefestigter Reife« oder »in gefestigtem Alter«. Das griechische Wort kann sowohl Gestalt beziehungsweise Körpergröße als auch Alter oder Lebensstufe bezeichnen; »gefestigt« gibt den Gedanken von Beständigkeit wieder.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λύχνος
  choice: Lampe
  rationale: Das Substantiv bezeichnet eine konkrete Öllampe, nicht Licht im abstrakten Sinn.
- source_word: ἐκλάμπων
  choice: hell strahlt
  rationale: Das Partizip bezeichnet ein kräftiges Hervorstrahlen; die Wiedergabe ist anschaulich und im Deutschen natürlich.
- source_word: ἐπὶ λυχνίας ἁγίας
  choice: auf einem heiligen Leuchter
  rationale: Die Ortsangabe wird konkret wiedergegeben; »heilig« bewahrt den möglichen kultischen beziehungsweise geweihten Sinn von ἁγίας.
- source_word: κάλλος προσώπου
  choice: die Schönheit eines Gesichts
  rationale: Die konkrete, poetische Formulierung erhält die Bildsprache und den Parallelismus.
- source_word: ἐπὶ ἡλικίᾳ στασίμῃ
  choice: an einer gefestigten Gestalt
  rationale: ἡλικία kann sowohl Alter beziehungsweise Lebensstufe als auch Körpergröße oder Gestalt bezeichnen. Im Zusammenhang mit der Schönheit des Gesichts und den anschließenden Körperbildern ist »Gestalt« wahrscheinlich; στασίμῃ fügt den Gedanken der Festigkeit und Beständigkeit hinzu. Die Präposition wird idiomatisch mit »an« wiedergegeben.
theological_decisions: []
translation_notes:
  register: Poetisch-bildhafte, würdige Sprache mit weitgehend erhaltener Satzfragmentstruktur und dem verbindenden »und« des griechischen Textes. Die ungewöhnliche Bildspannung wird nicht durch ein ergänztes »wie … so« aufgelöst.
