  text: Like a thirsty traveler she opens her mouth[a], and from every nearby water she will drink; opposite every stake she will sit down[c][b], and before every arrow she will open her quiver.
translation:
  language: de
  text: Wie ein durstiger Wanderer öffnet sie den Mund[a], und von jedem Wasser in der Nähe wird sie trinken; gegenüber jedem Pfahl wird sie sich setzen, und vor einem Pfeil wird sie ihren Köcher öffnen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das Bild ist metaphorisch und bezeichnet im Zusammenhang vermutlich sexuelle Wahllosigkeit: Sie ergreift jede Gelegenheit, die sich in ihrer Nähe bietet.'
    reason: cultural_note
  - marker: b
    text: Die griechischen Wörter „Pfahl“, „Pfeil“ und „Köcher“ sind hier wörtlich wiedergegeben. Die genaue Bedeutung dieser schwer verständlichen Bilder ist umstritten; wahrscheinlich führen sie die sexuelle Metapher des Verses fort.
    reason: lexical_alternative
lexical_decisions:
- source_word: διψῶν ὁδοιπόρος
  choice: ein durstiger Wanderer
  rationale: Die Verbindung bezeichnet anschaulich einen Menschen, der unterwegs Durst hat. „Wanderer“ ist im Deutschen natürlich und bewahrt das Gleichnis.
- source_word: τὸ στόμα ἀνοίγει
  choice: öffnet sie den Mund
  rationale: Die schlichte, konkrete Formulierung entspricht dem Griechischen; eine Verstärkung wie „reißt auf“ wäre nicht ausdrücklich vorgegeben.
- source_word: ἀπὸ παντὸς ὕδατος τοῦ σύνεγγυς πίεται
  choice: trinkt von jedem Wasser in der Nähe
  rationale: Die Wendung hält sowohl die umfassende Aussage von παντός als auch das Bild des jeweils nahen Wassers fest. Das griechische Futur wird im Deutschen idiomatisch als Präsens wiedergegeben, da der ganze Satz ein typisches Verhalten schildert.
- source_word: κατέναντι παντὸς πασσάλου καθίσεται
  choice: Gegenüber jedem Pfahl wird sie sich setzen
  rationale: πάσσαλος bedeutet wörtlich „Pfahl“ oder „Pflock“. Die ungewöhnliche räumliche Wendung und das Futur werden bewahrt, ohne die sexuelle Metapher im Haupttext auszudeuten.
- source_word: ἔναντι βέλους ἀνοίξει φαρέτραν
  choice: vor jedem Pfeil wird sie ihren Köcher öffnen
  rationale: βέλος und φαρέτρα werden mit „Pfeil“ und „Köcher“ konkret wiedergegeben. Obwohl bei βέλους ohne Artikel formal auch „vor einem Pfeil“ denkbar ist, legt der parallele, verallgemeinernde Zusammenhang „jedem“ nahe. Das possessive „ihren“ ist im Deutschen zur natürlichen Zuordnung ergänzt.
theological_decisions:
- issue: Sexuelle Bildsprache in einer Weisheitswarnung
  choice: Die Bilder von Wasser, Pfahl, Pfeil und Köcher bleiben im Haupttext erhalten.
  alternative: Den Vers unmittelbar als Aussage über sexuelle Wahllosigkeit paraphrasieren.
  rationale: Der griechische Text spricht in konkreten, aber schwer eindeutig aufzulösenden Bildern. Ihre Beibehaltung wahrt die Mehrdeutigkeit und vermeidet eine übermäßig explizite konfessionelle oder interpretierende Festlegung.
- issue: Nicht ausdrücklich genanntes weibliches Subjekt
  choice: Das Pronomen „sie“ wird aus dem unmittelbaren Zusammenhang ergänzt.
  alternative: Ein unpersönliches oder generisches Subjekt verwenden.
  rationale: Der Kontext handelt von einer Frau; modernes Deutsch benötigt hier für einen verständlichen Satz ein ausdrückliches Subjekt.
- issue: Zeitform der ersten Bildhälfte
  choice: Das einleitende Gleichnis und das Trinken stehen im idiomatischen Präsens, die beiden folgenden griechischen Future im Futur.
  alternative: Alle Verben einheitlich im Futur wiedergeben.
  rationale: ἀνοίγει ist Präsens, πίεται dagegen Futur. Im Deutschen liest sich „trinkt“ in der typisierenden ersten Hälfte natürlich; der Wechsel zum Futur bleibt in den folgenden Aussagen sichtbar, ohne den Sinn zu glätten.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Weisheitston. Die ungewöhnliche Bildfolge wird bewusst nicht geglättet. Alle Fußnotenmarker stehen im Haupttext; die beiden eng zusammengehörigen Hinweise zur Schwierigkeit und zur sexuellen Metapher sind in Fußnote [b] gebündelt.
