base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/026/029.yaml
  text: A merchant will scarcely be kept from wrongdoing[b][a], and a shopkeeper will not be declared righteous from sin.
translation:
  language: de
  text: Ein Händler wird sich kaum von Unrecht freihalten[a], und ein Kleinhändler[b] wird nicht von Sünde freigesprochen werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wird dem Unrecht kaum entgehen“. Das griechische Verb kann sowohl das Entkommen als auch das Sich-Freihalten bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Das griechische Wort bezeichnet einen Verkäufer im Kleinhandel, manchmal auch einen Schankwirt, und kann abschätzig gefärbt sein.
    reason: cultural_note
lexical_decisions:
- source_word: Μόλις
  choice: kaum
  rationale: Gibt die Bedeutung „nur mit Mühe, kaum“ knapp und sprichwortartig wieder.
- source_word: ἐξελεῖται
  choice: wird sich … freihalten
  rationale: Die mediale Form bezeichnet hier wahrscheinlich, dass man sich einer Verfehlung entzieht oder sich von ihr fernhält. Die gewählte Wendung bewahrt den Bezug auf das eigene Handeln, ohne eine rein äußere Rettung vorauszusetzen.
- source_word: ἔμπορος
  choice: Händler
  rationale: Bezeichnet allgemein einen im Handel tätigen Kaufmann oder Händler; „Händler“ ist im heutigen Deutsch neutral und präzise.
- source_word: πλημμελείας
  choice: Unrecht
  rationale: Das Wort bezeichnet eine Verfehlung oder schuldhaftes Fehlverhalten. „Unrecht“ erhält den breiten moralischen Sinn, ohne ihn auf Handelsbetrug einzuengen.
- source_word: δικαιωθήσεται
  choice: wird … freigesprochen werden
  rationale: Die Passivform hat hier einen rechtlich-moralischen Sinn. „Freigesprochen werden“ ist verständliches heutiges Deutsch und vermeidet eine unnötig dogmatische Färbung.
- source_word: κάπηλος
  choice: Kleinhändler
  rationale: Bezeichnet einen Verkäufer im Kleinhandel, teils auch einen Schankwirt, und kann im antiken Sprachgebrauch abschätzig gefärbt sein. „Kleinhändler“ trifft den wirtschaftlichen Maßstab, ohne die negative Nebenbedeutung in den Haupttext hineinzuzwingen.
- source_word: ἁμαρτίας
  choice: Sünde
  rationale: Bewahrt den ausdrücklichen moralisch-religiösen Begriff des griechischen Textes.
theological_decisions:
- issue: Bedeutung von δικαιωθήσεται im weisheitlichen Zusammenhang
  choice: wird nicht von Sünde freigesprochen werden
  alternative: wird nicht für gerecht erklärt werden
  rationale: Die Übersetzung wahrt den rechtlich-deklarativen Sinn, ohne paulinische oder konfessionelle Rechtfertigungslehren in den Vers einzutragen. Die Verbindung mit ἀπό und „Sünde“ wird im Deutschen mit „von Sünde freigesprochen“ natürlich wiedergegeben.
- issue: Handlungsrichtung von ἐξελεῖται
  choice: wird sich … freihalten
  alternative: wird … entrinnen
  rationale: Die mediale Form lässt sowohl das Sich-Fernhalten als auch das Entkommen anklingen. Der Haupttext wählt die im Kontext beruflicher Versuchung naheliegende Lesart; die echte lexikalische Alternative bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper sprichwortartiger Satzstruktur. „Kleinhändler“ vermeidet das heute altertümlich oder abwertend wirkende „Krämer“, während die historische Nebenbedeutung in der Fußnote erläutert wird.
