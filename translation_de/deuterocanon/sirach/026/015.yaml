  text: A quiet wife is a gift from the Lord[a], and there is no equivalent for a disciplined soul.
translation:
  language: de
  text: Eine stille Ehefrau ist eine Gabe des Herrn, und für eine wohlerzogene Seele gibt es keinen Gegenwert[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „eine gut unterwiesene“ oder „eine disziplinierte Seele“. Das griechische Wort umfasst Unterweisung, Erziehung und charakterliche Formung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δόσις
  choice: Gabe
  rationale: Das Substantiv bezeichnet hier im sprichwörtlichen Zusammenhang etwas, das gegeben wird, nicht den Vorgang des Gebens.
- source_word: Κυρίου
  choice: des Herrn
  rationale: Der Genitiv bezeichnet die Herkunft der Gabe; κύριος wird im biblischen Register mit „Herr“ wiedergegeben.
- source_word: γυνὴ
  choice: Frau
  rationale: γυνή kann „Frau“ oder „Ehefrau“ bedeuten. Der Ehekontext legt die Ehefrau nahe; „Frau“ bewahrt jedoch die im Deutschen ebenfalls mögliche eheliche Bedeutung, ohne die lexikalische Mehrdeutigkeit unnötig einzuengen.
- source_word: σιγηρά
  choice: stille
  rationale: Das Adjektiv bezeichnet eine Frau von ruhigem, zurückhaltendem Wesen beziehungsweise zurückhaltender Rede. „Still“ wahrt den positiven Sinn, ohne völliges Schweigen zu behaupten.
- source_word: ἀντάλλαγμα
  choice: nichts wiegt … auf
  rationale: Die Wendung gibt idiomatisch wieder, dass es keinen gleichwertigen Ersatz oder Gegenwert gibt, und bringt so den unvergleichlichen Wert zum Ausdruck.
- source_word: πεπαιδευμένης
  choice: wohlgebildete
  rationale: Das Partizip von παιδεύω umfasst Unterweisung, Erziehung und charakterliche Formung. „Wohlgebildet“ hält diese Bedeutungsbreite eher offen als rein akademisches „gebildet“ oder eng moralisches „diszipliniert“.
- source_word: ψυχῆς
  choice: Seele
  rationale: ψυχή bezeichnet hier den inneren Menschen beziehungsweise den Charakter; „Seele“ bewahrt das weisheitliche und geistig-moralische Sprachregister.
theological_decisions:
- issue: Bezug und Sinn von πεπαιδευμένης ψυχῆς
  choice: Die zweite Vershälfte preist den unvergleichlichen Wert einer durch Erziehung und Unterweisung geformten Seele, im Parallelismus naheliegend als Charakter der zuvor genannten Frau.
  alternative: Die Formulierung könnte allgemeiner jede wohlgebildete Seele bezeichnen oder enger als „geschulter Verstand“ verstanden werden.
  rationale: Im Griechischen wird γυνή in der zweiten Hälfte nicht wiederholt. Daher wird der Bezug durch den Satzbau nicht ausdrücklich festgelegt; die deutsche Fassung bewahrt diese Offenheit, während der Zusammenhang die Verbindung zur beschriebenen Frau nahelegt.
translation_notes:
  register: Moderne, würdige Spruchsprache. „Still“ ist verständlich und weniger absolut als „schweigsam“; die idiomatische Wendung „nichts wiegt … auf“ vermittelt den Gedanken eines fehlenden Gegenwerts natürlich. Der Fußnotenmarker steht bei der tatsächlich erläuterten Wendung und nicht bei „Herr“.
