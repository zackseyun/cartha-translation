    rationale: γυνή ist lexikalisch mehrdeutig, aber der Abschnitt handelt von der Ehefrau; auch die englische Audit-Fassung entscheidet sich begründet für „wife“. Die deutsche Übersetzung sollte diesen Kontext nicht unnötig abschwächen.
  - severity: medium
    issue: „wohlgebildete Seele“
    rationale: „Wohlgebildet“ ist im modernen Deutsch ungewöhnlich und kann körperliche Gestalt oder allgemeine Bildung nahelegen. πεπαιδευμένης bezeichnet hier eher Erziehung, Unterweisung und charakterliche Formung.
  - severity: low
    issue: „nichts wiegt ... auf“
    rationale: Die Wendung ist verständlich, doch ἀντάλλαγμα bezeichnet präziser einen Gegenwert bzw. etwas zum Austausch. „Es gibt keinen Gegenwert“ bildet dies unmittelbarer ab.
