  text: One who turns back from righteousness to sin—the Lord will prepare him for the sword[a].
translation:
  language: de
  text: Wer von der Gerechtigkeit zur Sünde zurückführt[a] – den wird der Herr für das Schwert bereitmachen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „zurückführt“. Das griechische aktive Partizip bezeichnet gewöhnlich das Zurückführen oder Hinführen; wen der Handelnde von der Gerechtigkeit zur Sünde führt, wird nicht genannt. Im Zusammenhang kann die Aussage auch als Rückwendung des Handelnden selbst zu einem sündigen Weg verstanden werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπανάγων
  choice: zurückkehrt
  rationale: Das substantivierte Partizip bezeichnet hier im Zusammenhang eine Rückwendung von einem gerechten Lebensweg zur Sünde. „Zurückkehrt“ ist im modernen Deutsch natürlich; die mögliche transitive Bedeutung „zurückführt“ bleibt in der Fußnote erhalten.
- source_word: δικαιοσύνης
  choice: Gerechtigkeit
  rationale: Im Gegensatz zu ἁμαρτία bezeichnet das Wort die moralische Rechtschaffenheit beziehungsweise den gerechten Lebensweg. „Gerechtigkeit“ bewahrt den etablierten biblischen Begriff.
- source_word: ἁμαρτίαν
  choice: Sünde
  rationale: Direkte und im moralisch-religiösen Zusammenhang angemessene Wiedergabe.
- source_word: ὁ κύριος
  choice: der Herr
  rationale: In der biblischen Weisheitsliteratur bezeichnet κύριος hier Gott; „der Herr“ entspricht dem üblichen deutschen Bibelregister.
- source_word: ἑτοιμάσει
  choice: wird … bereitmachen
  rationale: Die Wiedergabe erhält die Futurform und das Bild des Vorbereitens, ohne die Art des angekündigten Gerichts näher zu bestimmen.
- source_word: εἰς ῥομφαίαν
  choice: für das Schwert
  rationale: Die Wendung bewahrt das konkrete Bild der ῥομφαία und lässt offen, ob das Schwert wörtlich oder als Bild gewaltsamen Gerichts gemeint ist.
theological_decisions:
- issue: Göttliches Handeln in der Gerichtsankündigung
  choice: Der Herr handelt ausdrücklich, indem er den Abtrünnigen für das Schwert bereitmacht.
  alternative: Die Aussage lediglich als unpersönliche Folge des Abfalls wiederzugeben.
  rationale: ὁ κύριος ist das ausdrückliche Subjekt von ἑτοιμάσει. Die Übersetzung erhält diese göttliche Handlung, ohne daraus eine weitergehende Vergeltungslehre abzuleiten.
- issue: Wer von der Gerechtigkeit zur Sünde zurückgebracht wird
  choice: Im Haupttext wird eine eigene Rückkehr zur Sünde ausgedrückt.
  alternative: Jemand führt einen anderen von der Gerechtigkeit zur Sünde zurück.
  rationale: Der Zusammenhang legt eine moralische Rückwendung nahe, doch die aktive Form ἐπανάγων kann auch transitiv verstanden werden. Diese echte grammatische Mehrdeutigkeit wird durch die Fußnote offengehalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Gedankenstrich bildet den scharfen Übergang von der Handlung zur Gerichtsfolge ab. „Bereitmachen“ ist bewusst bildnah gewählt; eine deutende Formulierung wie „dem Schwert preisgeben“ wurde vermieden.
