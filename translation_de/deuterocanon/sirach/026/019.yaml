translation:
  language: de
  text: Goldene Säulen auf silbernem Sockel – und schöne Füße auf der Brust eines standhaften Menschen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das griechische Bild ist stark verdichtet und in seiner genauen Beziehung schwer verständlich; wörtlich steht etwa: „schöne Füße auf Brüsten eines Standhaften/Festen“. Möglich ist auch die Wiedergabe „Brustkorb“ statt „Brust“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: στύλοι χρύσεοι
  choice: goldene Säulen
  rationale: Die Wendung bezeichnet aufrechte Stützen aus Gold. „Säulen“ bewahrt das konkrete, poetische Bild.
- source_word: ἐπὶ βάσεως ἀργυρᾶς
  choice: auf silbernem Sockel
  rationale: βάσις bezeichnet hier die tragende Grundlage einer Säule. „Sockel“ ist im Deutschen in diesem architektonischen Bild natürlicher und konkreter als „Grundlage“.
- source_word: πόδες ὡραῖοι
  choice: schöne Füße
  rationale: πόδες bedeutet wörtlich „Füße“, und ὡραῖοι bezeichnet ihre Schönheit oder ansprechende Gestalt. Die konkrete Körpermetaphorik bleibt erhalten.
- source_word: ἐπὶ στέρνοις
  choice: auf der Brust
  rationale: στέρνοις ist formal ein Dativ Plural und bezeichnet die Brust- beziehungsweise Brustkorbregion. Im Deutschen ist die kollektive Einzahl „Brust“ idiomatischer; die ungewöhnliche Bildfügung wird nicht geglättet.
- source_word: εὐσταθοῦς
  choice: eines standhaften Menschen
  rationale: Das substantivisch gebrauchte Adjektiv bedeutet „fest, beständig, standhaft“. Die geschlechtsneutrale Ergänzung „Mensch“ macht die substantivische Funktion im Deutschen verständlich, ohne eine im griechischen Ausdruck nicht ausdrücklich genannte Personengruppe festzulegen.
