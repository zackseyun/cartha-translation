translation:
  language: de
  text: Anmut über Anmut ist eine Frau mit Schamgefühl[a], und keine Waage ist einer selbstbeherrschten Seele angemessen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eine schamhafte Frau“ oder „eine zurückhaltende Frau“. Das griechische Wort bezeichnet hier ein angemessenes Schamgefühl beziehungsweise Zurückhaltung als Tugend.'
    reason: lexikalische Alternative und Bewahrung der Bedeutungsbreite von αἰσχυντηρά
lexical_decisions:
- source_word: χάρις ἐπὶ χάριτι
  choice: Anmut über Anmut
  rationale: χάρις bezeichnet hier im Weisheitskontext die anziehende, erfreuliche Ausstrahlung einer Frau. „Anmut“ vermeidet eine unnötig theologische Verengung auf „Gnade“ und bewahrt in der Wiederholung die steigernde, verdichtete Formulierung des Griechischen.
- source_word: γυνὴ
  choice: Frau
  rationale: γυνή kann „Frau“ oder „Ehefrau“ bedeuten. Da der Halbvers keine eindeutige eheliche Zuordnung enthält, bleibt „Frau“ die offenere Wiedergabe.
- source_word: αἰσχυντηρά
  choice: sittsam
  rationale: Das Wort bezeichnet eine von angemessenem Schamgefühl und Zurückhaltung geprägte Person. „Sittsam“ gibt den positiv gemeinten Tugendbegriff wieder, ohne ihn als tatsächliche Beschämung zu verstehen.
- source_word: σταθμός
  choice: Waage
  rationale: σταθμός kann eine Waage, ein Gewicht oder einen Maßstab bezeichnen. „Waage“ erhält das konkrete Bild des Wägens.
- source_word: πᾶς ἄξιος
  choice: keine … ist … angemessen
  rationale: Die griechische Wendung lautet knapp, dass keinerlei Waage würdig beziehungsweise angemessen ist. Die Übersetzung bewahrt diese Aussage, statt den unausgesprochenen Gedanken des Auswägens ihres Wertes in den Haupttext einzutragen.
- source_word: ἐγκρατοῦς ψυχῆς
  choice: einer selbstbeherrschten Seele
  rationale: ἐγκρατής bezeichnet Selbstbeherrschung oder die Herrschaft über sich selbst; ψυχή wird als „Seele“ wiedergegeben, sodass die ethische und anthropologische Ausdrucksweise erhalten bleibt.
theological_decisions:
- issue: Bedeutung von χάρις im Weisheitskontext
  choice: Anmut
  alternative: Gnade
  rationale: „Anmut“ entspricht hier wahrscheinlich der menschlichen Ausstrahlung oder gewinnenden Eigenschaft. „Gnade“ ist lexikalisch möglich, könnte im modernen Deutschen jedoch eine spezifisch theologische Bedeutung nahelegen, die der Kontext nicht verlangt.
- issue: Tugendbegriff αἰσχυντηρά
  choice: sittsam
  alternative: schamhaft oder zurückhaltend
  rationale: Der Vers lobt ein angemessenes Schamgefühl beziehungsweise sittliche Zurückhaltung, nicht Erniedrigung oder schuldhafte Scham. Die Fußnote hält die Bedeutungsbreite offen.
- issue: Wertmetapher im zweiten Halbvers
  choice: keine Waage ist einer selbstbeherrschten Seele angemessen
  alternative: keine Waage kann den Wert einer selbstbeherrschten Seele ermessen
  rationale: Die gewählte Fassung folgt der komprimierten griechischen Aussage enger und vermeidet, den nur implizierten „Wert“ ausdrücklich in den Text aufzunehmen. Das Bild unermesslicher Kostbarkeit bleibt dennoch erkennbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die poetische Wiederholung „Anmut über Anmut“ und die knappe Waagenmetapher des Griechischen bleiben erhalten; „sittsam“ ist leicht gehoben, aber im Weisheitskontext verständlich und präziser als stärker psychologisierende Alternativen.
