base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/026/028.yaml
  text: 'Over two things my heart is grieved[a], and over a third anger has come upon me: a warrior brought low by poverty, and men of understanding if they are treated like refuse[b], and one who turns back from righteousness to sin—the Lord will prepare him for the sword.'
translation:
  language: de
  text: 'Über zwei Dinge ist mein Herz betrübt, und über ein Drittes ist Zorn über mich gekommen: über einen Krieger, der wegen Armut Not leidet, über verständige Männer, wenn sie wie Abfall behandelt werden[a], und über einen, der von der Gerechtigkeit zur Sünde zurückkehrt — der Herr wird ihn für das Schwert bestimmen.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »wenn sie wie Unrat weggeworfen werden«. Das griechische Verb ist von einem Wort für Abfall oder Unrat abgeleitet und bezeichnet eine verächtliche Erniedrigung.'
    reason: lexical_alternative
  - marker: b
    text: Das abschließende »ihn« bezieht sich am ehesten auf denjenigen, der von der Gerechtigkeit zur Sünde zurückkehrt. Die griechische Aufzählung ist jedoch syntaktisch gedrängt, sodass der Gerichtssatz auch als Abschluss des ganzen Spruchs verstanden werden kann.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐπὶ δυτὶ λελύπηται ἡ καρδία μου
  choice: Über zwei Dinge ist mein Herz betrübt
  rationale: Das griechische Perfekt bezeichnet einen fortbestehenden Zustand der Betrübnis; die deutsche Formulierung wahrt zugleich die einleitende Klageformel.
- source_word: θυμός μοι ἐπῆλθεν
  choice: Zorn kommt über mich
  rationale: Die Wendung bewahrt das Bild eines Zorns, der den Sprecher ergreift, ohne θυμός unnötig zu »Raserei« zu steigern.
- source_word: ἀνὴρ πολεμιστὴς ὑστερῶν διʼ ἔνδειαν
  choice: ein Krieger, der durch Armut Mangel leidet
  rationale: ὑστερέω bezeichnet hier das Entbehren oder Mangelhaben; διʼ ἔνδειαν nennt Armut beziehungsweise Not als Ursache. Die Übersetzung bleibt näher am Wortlaut als eine bloße Umschreibung mit sozialer Erniedrigung.
- source_word: ἄνδρες συνετοὶ
  choice: verständige Männer
  rationale: συνετός bezeichnet Einsicht und Urteilsvermögen; »verständig« ist im Deutschen natürlich und erhält den maskulinen Plural.
- source_word: ἐὰν σκυβαλωθῶσιν
  choice: wenn sie wie Abfall behandelt werden
  rationale: Das von σκύβαλον abgeleitete Verb drückt verächtliche Erniedrigung aus und ruft das Bild von Abfall oder Unrat hervor.
- source_word: ἐπανάγων ἀπὸ δικαιοσύνης ἐπὶ ἁμαρτίαν
  choice: einer, der von der Gerechtigkeit zur Sünde zurückkehrt
  rationale: »Zurückkehrt« gibt die rückläufige Bewegung des Partizips wieder. »Gerechtigkeit« bewahrt hier den moralisch-religiösen Gegensatz zu Sünde.
- source_word: ὁ κύριος ἑτοιμάσει εἰς ῥομφαίαν αὐτόν
  choice: der Herr wird ihn für das Schwert bestimmen
  rationale: Die Wendung bezeichnet eine göttliche Bestimmung zum Gericht durch das Schwert. »Bestimmen« gibt den idiomatischen Sinn im Deutschen natürlicher wieder als das formal mögliche »bereiten«.
theological_decisions:
- issue: Bezug des abschließenden Singularpronomens αὐτόν
  choice: »ihn« bezieht sich im Haupttext am ehesten auf den unmittelbar zuvor genannten Menschen, der von der Gerechtigkeit zur Sünde zurückkehrt.
  alternative: Der Gerichtssatz kann wegen der gedrängten Syntax auch als zusammenfassender Abschluss der gesamten Aufzählung gehört werden.
  rationale: Das maskuline Singularpronomen folgt unmittelbar auf die singularische Partizipialwendung. Eine Fußnote erhält jedoch die syntaktische Spannung, statt den weiteren Bezug auszuschließen.
- issue: Wiedergabe von δικαιοσύνη
  choice: Gerechtigkeit
  alternative: Rechtschaffenheit
  rationale: Der Begriff steht im moralisch-religiösen Gegensatz zu ἁμαρτία. »Gerechtigkeit« wahrt die etablierte theologische Breite, während »Rechtschaffenheit« die Bedeutung stärker auf persönliches Verhalten verengt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die dreigliedrige Klageformel und der abrupte Übergang zum göttlichen Gericht bleiben erhalten; konkrete Bilder wie »Abfall« und »Schwert« werden nicht abgeschwächt.
