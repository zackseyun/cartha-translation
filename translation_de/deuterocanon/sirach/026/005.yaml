translation:
  language: de
  text: 'Vor drei Dingen fürchtete sich mein Herz, und angesichts eines vierten Gesichts flehte ich[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Griechisch wörtlich etwa: „bei/angesichts des vierten Gesichts“. „Gesicht“ kann auch „Person“ oder „Anblick/Erscheinung“ bedeuten; die Wendung kann daher eine vierte Person oder einen vierten Fall meinen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ τριῶν
  choice: vor drei Dingen
  rationale: ἀπό bezeichnet hier idiomatisch den Anlass der Furcht. Im Deutschen ist „sich vor etwas fürchten“ natürlich; „Dingen“ wird zur Verdeutlichung ergänzt, ohne die folgenden Referenten näher festzulegen.
- source_word: εὐλαβήθη
  choice: fürchtete sich
  rationale: Im Zusammenhang bezeichnet das Verb keine ehrfürchtige Scheu, sondern Furcht beziehungsweise Beklommenheit angesichts bedrohlicher sozialer Situationen.
- source_word: ἡ καρδία μου
  choice: mein Herz
  rationale: Die Wendung bewahrt das biblische Bild des Herzens als Sitz der inneren Regung und ist auch im Deutschen verständlich.
- source_word: ἐπὶ τῷ τετάρτῳ προσώπῳ
  choice: angesichts des vierten
  rationale: „Angesichts“ nimmt die Bildlichkeit von πρόσωπον („Gesicht“, auch „Person“) auf, ohne im Deutschen die schwer verständliche Formulierung „beim vierten Gesicht“ zu erzwingen. Das substantivierte „des vierten“ wahrt die Unbestimmtheit zwischen Person und Sache.
- source_word: ἐδεήθην
  choice: betete ich
  rationale: δέομαι kann „bitten“, „flehen“ oder „beten“ bedeuten. Hier gibt „betete ich“ die knappe religiöse Aussage natürlich wieder.
theological_decisions:
- issue: Deutung von ἐπὶ τῷ τετάρτῳ προσώπῳ
  choice: „angesichts des vierten“ im Haupttext, mit Erläuterung in der Fußnote
  alternative: „wegen der vierten Person“, „vor dem vierten Gesicht“ oder „wegen des vierten Dinges“
  rationale: Die griechische Formulierung ist ungewöhnlich und lässt offen, ob πρόσωπον konkret „Gesicht“, metonymisch „Person“ oder allgemeiner einen vierten Fall bezeichnet. Die Übersetzung bewahrt diese Spannung, statt sie stillschweigend aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung bleibt nah am griechischen Text; „angesichts des vierten“ ist bewusst leicht ungewöhnlich, um die Mehrdeutigkeit und Bildlichkeit der Vorlage zu erhalten.
