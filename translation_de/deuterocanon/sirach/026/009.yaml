translation:
  language: de
  text: Eine dem Trunk ergebene Frau erregt großen Zorn, und ihre Schande wird sie nicht verbergen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὀργὴ μεγάλη
  choice: erregt großen Zorn
  rationale: Die griechische Nominalformulierung lautet wörtlich „großer Zorn“. Im Deutschen macht die verbale Wiedergabe verständlich, dass die betrunkene Frau großen Zorn hervorruft, ohne den starken Ausdruck abzuschwächen.
- source_word: γυνὴ μέθυσος
  choice: eine betrunkene Frau
  rationale: μέθυσος bezeichnet hier eine dem Trunk ergebene beziehungsweise betrunkene Person; „betrunkene Frau“ gibt den unmittelbaren griechischen Wortlaut natürlich wieder.
- source_word: ἀσχημοσύνην
  choice: Scham
  rationale: Das Wort kann Schändlichkeit, unanständiges Verhalten oder Schande bezeichnen. „Scham“ bewahrt hier die knappe, wertende Aussage und entspricht der vorhandenen Konsultationsfassung.
- source_word: οὐ συγκαλύψει
  choice: wird sie nicht verbergen
  rationale: συγκαλύπτω bedeutet bedecken oder verhüllen. „nicht verbergen“ ist in diesem Zusammenhang idiomatisch und wahrt das Futur.
theological_decisions: []
translation_notes:
  register: Knappe, sprichwortartige Formulierung in modernem, würdigem Standarddeutsch. Die Aussage bleibt so scharf und allgemein wie im griechischen Text; es werden weder mildernde Zusätze noch konfessionelle Deutungen eingeführt.
