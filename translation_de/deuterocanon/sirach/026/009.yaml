  source_fidelity: Die Wiedergabe von γυνὴ μέθυσος als „betrunkene Frau“ kann einen momentanen Zustand bezeichnen, während μέθυσος hier eher eine dem Trunk ergebene bzw. gewohnheitsmäßig trinkende Frau meint. Die Umformung von ὀργὴ μεγάλη zu „erregt großen Zorn“ ist als idiomatische Auslegung des prädikativen Nominalsatzes vertretbar. ἀσχημοσύνη bezeichnet eher Schande bzw. schändliches Verhalten als das innere Gefühl „Scham“.
  naturalness: Der Satz ist knapp und verständlich. „Ihre Scham wird sie nicht verbergen“ ist jedoch mit „Scham“ weniger treffend und stilistisch etwas schwerfällig. „Ihre Schande wird sie nicht verbergen“ ist klar und entspricht dem bildhaften Verb συγκαλύψει („bedecken/verhüllen“) gut.
  terminology: „Dem Trunk ergeben“ gibt die habituelle Bedeutung von μέθυσος ohne die medizinisch oder diagnostisch klingende Zuspitzung von „trunksüchtig“ wieder. „Schande“ trifft ἀσχημοσύνη in diesem Kontext genauer als „Scham“.
