translation:
  language: de
  text: Glücklich[a] ist der Ehemann einer guten Frau, und die Zahl seiner Tage ist doppelt so groß.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Gesegnet ist; oder: Wohl dem.'
    reason: Das hebräische אַשְׁרֵי kann Glück, Begünstigung oder Segen ausdrücken.
lexical_decisions:
- source_word: אִשָּׁה טוֹבָה
  choice: eine gute Frau
  rationale: Die Wendung bedeutet schlicht »eine gute Frau/Ehefrau«. Durch »Ehemann« ist der eheliche Zusammenhang eindeutig; »gut« bewahrt die breite moralische und praktische Wertung, ohne sie durch »tugendhaft« einzuengen.
- source_word: אַשְׁרֵי
  choice: Glücklich ist
  rationale: Das Wort ist ein weisheitlicher Glückwunsch und bezeichnet einen beneidenswert guten Zustand. »Glücklich ist« ist heutiges, verständliches Deutsch; »gesegnet« und »wohl dem« bleiben mögliche Alternativen.
- source_word: בַעֲלָהּ
  choice: der Ehemann
  rationale: Im Zusammenhang bezeichnet das Wort ihren Mann beziehungsweise Ehemann. »Ehemann« gibt die eheliche Beziehung klar wieder und vermeidet die im heutigen Deutsch irreführende Bedeutung »Herr/Besitzer«.
- source_word: וּמִסְפַּר יָמָיו
  choice: und die Zahl seiner Tage
  rationale: Die formnahe Wiedergabe bewahrt das hebräische Bild und den sprichwortartigen Stil; auch die griechische Parallele spricht von der »Zahl seiner Tage«.
- source_word: כִּפְלַיִם
  choice: verdoppelt sich
  rationale: Das hebräische Wort bedeutet »doppelt, zweifach«. Die Formulierung ist natürlich und lässt offen, ob wörtliche Lebensverlängerung oder eine als doppelt reich erfahrene Lebenszeit gemeint ist.
theological_decisions:
- issue: Wiedergabe von אַשְׁרֵי als weisheitlicher Glückwunsch
  choice: Glücklich ist
  alternative: Gesegnet ist; Wohl dem
  rationale: Der Vers preist den beneidenswerten Zustand des Mannes, ohne ausdrücklich Gott als den Handelnden zu nennen. »Glücklich« wahrt diese Zurückhaltung und behält zugleich den Charakter einer Seligpreisung.
- issue: Aussage über die Verdoppelung der Lebenstage
  choice: die Zahl seiner Tage verdoppelt sich
  alternative: die Zahl seiner Tage ist doppelt so groß
  rationale: Die pointierte Aussage des Ausgangstextes wird nicht zu einer bloßen Redensart abgeschwächt. Zugleich wird nicht festgelegt, ob sie mathematisch-wörtlich oder als weisheitliche Aussage über Lebensfülle zu verstehen ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrtem weisheitlichem Parallelismus. »Ehemann einer guten Frau« ist bewusst leicht formell, aber klar und quellennah.
