base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/026/007.yaml
  text: A jealous wife is heartache and grief when set against another woman[b][a], and a scourge of the tongue that associates with everyone.
translation:
  language: de
  text: Herzeleid und Trauer ist eine eifersüchtige Frau gegenüber einer anderen Frau[a] und eine Zungengeißel, die mit allen Umgang hat.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eine rivalisierende Frau gegenüber einer anderen Frau“, möglicherweise im Sinn einer rivalisierenden Ehefrau. Die knappe griechische Formulierung kann sowohl Rivalität als auch gegen eine andere Frau gerichtete Eifersucht bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Der letzte Satzteil ist im Griechischen schwer zu deuten. Wörtlich ist von einer „Zungengeißel“ die Rede, die „mit allen Umgang hat“ bzw. „mit allen kommuniziert“; die Wendung kann auch im Sinn von „allen gemeinsam“ oder „allen mitgeteilt“ verstanden werden. Gemeint sein können Worte, die sich unterschiedslos an alle richten oder auf alle einschlagen.
    reason: alternative_reading
lexical_decisions:
- source_word: ἄλγος καρδίας
  choice: Herzeleid
  rationale: Die feste deutsche Wendung gibt den inneren, seelischen Schmerz natürlich und würdig wieder, ohne καρδία anatomisch zu verengen.
- source_word: πένθος
  choice: Trauer
  rationale: Das Wort bezeichnet Trauer oder tiefen Kummer; „Trauer“ wahrt die prägnante Parallelstellung zu „Herzeleid“.
- source_word: γυνὴ ἀντίζηλος
  choice: eine eifersüchtige Frau
  rationale: ἀντίζηλος kann Eifersucht wie auch Rivalität bezeichnen. „Eifersüchtige Frau“ gibt den allgemeinen Beziehungssinn wieder, ohne zwingend eine Ehe mit mehreren Frauen vorauszusetzen.
- source_word: ἐπὶ γυναικί
  choice: gegenüber einer anderen Frau
  rationale: Die knappe Präpositionalfügung bezeichnet hier wahrscheinlich die rivalisierende oder eifersüchtige Ausrichtung auf eine Frau. „Gegenüber“ hält die Art dieses Verhältnisses bewusst offen.
- source_word: μάστιξ γλώσσης
  choice: eine Geißel der Zunge
  rationale: Die bildhafte Rede von einer Geißel wird bewahrt und bezeichnet verletzende, um sich schlagende Worte.
- source_word: πᾶσιν ἐπικοινωνοῦσα
  choice: die alle trifft
  rationale: Die schwierige Partizipialfügung wird kontextgemäß als eine Zungengeißel verstanden, deren Wirkung unterschiedslos alle erreicht. Die offenere wörtliche Möglichkeit wird in der Fußnote genannt.
