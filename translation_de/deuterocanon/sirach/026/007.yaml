  register: Modernes, würdiges Standarddeutsch. Die knappe sentenzartige Form des Griechischen bleibt erhalten; der Gedankenstrich macht die zweite Bildaussage als nähere Charakterisierung lesbar, ohne die syntaktische Mehrdeutigkeit durch zusätzliche Aussagen aufzulösen.
