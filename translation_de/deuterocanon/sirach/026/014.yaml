translation:
  language: de
  text: Die Anmut einer Frau erfreut ihren Mann, und ihre Einsicht kräftigt seine Gebeine.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »macht seine Gebeine wohlgenährt« oder »lässt seine Gebeine kräftig werden«. Das Griechische gebraucht ein körperliches Bild für die stärkende Wirkung einer verständigen Frau.'
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρις γυναικός
  choice: die Anmut einer Frau
  rationale: χάρις bezeichnet hier die anziehende, liebenswürdige Wesensart der Frau, nicht Heilsgnade. »Anmut« bewahrt den moralisch-ästhetischen Sinn; γυνή wird als »Frau« wiedergegeben, während der folgende Ausdruck »ihren Mann« die eheliche Beziehung erkennen lässt.
- source_word: τέρψει
  choice: erfreut
  rationale: Das Futur von τέρπω bezeichnet das Bereiten von Freude oder Wohlgefallen. Das deutsche Präsens ist in einem allgemeinen Weisheitsspruch natürlich und gibt die Aussage als bleibende Erfahrung wieder.
- source_word: ἐπιστήμη
  choice: Einsicht
  rationale: ἐπιστήμη kann Wissen, Verständnis oder Sachverstand bedeuten. »Einsicht« bezeichnet hier passend praktische, verständige Urteilskraft und vermeidet den Eindruck bloßen Faktenwissens.
- source_word: πιανεῖ
  choice: kräftigt
  rationale: Das Verb bedeutet wörtlich, fett oder wohlgenährt zu machen. In Verbindung mit »Gebeinen« bezeichnet es bildhaft eine stärkende, belebende Wirkung. »Kräftigt« ist natürliches Deutsch, während die Körpermetapher durch »Gebeine« erhalten bleibt.
- source_word: τὰ ὀστᾶ αὐτοῦ
  choice: seine Gebeine
  rationale: Die wörtliche Körperbezeichnung bewahrt das konkrete biblische Bild für körperliche und innere Lebenskraft.
