  yaml_path: translation/deuterocanon/sirach/026/008.yaml
  text: A wicked wife is a shaking yoke for oxen[a]; whoever takes hold of her is like one who grabs a scorpion.
translation:
  language: de
  text: Eine böse Frau ist ein schwankendes Ochsenjoch[a]; wer sie festhält, ist wie einer, der einen Skorpion packt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der griechische Ausdruck βοοζύγιον ist selten und die Bildlichkeit ist schwer zu deuten. Wörtlich bezeichnet er ein Ochsenjoch; „schwankend“ gibt das griechische Partizip wieder, das Bewegung oder Instabilität ausdrückt.
    reason: lexical_alternative
lexical_decisions:
- source_word: βοοζύγιον
  choice: Ochsengespann
  rationale: Das seltene Kompositum bezeichnet wahrscheinlich ein Gespann von Ochsen beziehungsweise die unter einem Joch verbundenen Tiere. „Ochsengespann“ bewahrt das konkrete landwirtschaftliche Bild, ohne vorschnell ausschließlich das Joch als Gerät zu bezeichnen.
- source_word: σαλευόμενον
  choice: schwankendes
  rationale: Das Partizip bezeichnet etwas, das bewegt, erschüttert oder instabil ist. „Schwankendes“ gibt die anschauliche Unruhe des Bildes wieder.
- source_word: γυνὴ πονηρά
  choice: eine böse Frau
  rationale: γυνή kann „Frau“ oder „Ehefrau“ bedeuten. Da der unmittelbare griechische Wortlaut den Ehestatus nicht ausdrücklich festlegt, bleibt „Frau“ bewusst offen; πονηρά erhält mit „böse“ seine deutliche moralische Wertung.
- source_word: ὁ κρατῶν αὐτῆς
  choice: wer sie festhält
  rationale: κρατέω kann ergreifen, festhalten oder beherrschen bedeuten. „Festhält“ wahrt den körperlichen Bezug zur folgenden Skorpion-Metapher und lässt zugleich die mögliche Bedeutung des Bändigens anklingen.
- source_word: δρασσόμενος
  choice: packt
  rationale: Das Verb bezeichnet das Zugreifen oder Ergreifen mit der Hand. „Packt“ ist anschaulich und im heutigen Deutsch natürlich.
- source_word: σκορπίου
  choice: einen Skorpion
  rationale: Direkte und eindeutige Wiedergabe des Tiernamens im Deutschen.
