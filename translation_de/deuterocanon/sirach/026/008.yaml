  source_fidelity: βοοζύγιον bezeichnet als Kompositum primär ein Ochsenjoch, nicht die unter dem Joch gehenden Tiere als Gespann. Die Wiedergabe von σαλευόμενον mit „schwankend“ und die bildhafte Entsprechung von κρατῶν/δρασσόμενος mit „festhält“/„packt“ sind sachgerecht. „Frau“ hält die im Griechischen nicht ausdrücklich festgelegte Bedeutung von γυνή offen.
  naturalness: Der knappe Satzbau und die scharfe Weisheitsspruch-Metapher funktionieren im modernen Standarddeutsch. „Schwankendes Ochsenjoch“ ist konkret und verständlich; die Fußnote erklärt die ungewöhnliche Bildlichkeit ohne sie zu glätten.
  terminology: „Böse Frau“ bewahrt die ethisch negative Wertung von πονηρά, ohne die unmarkierte Ambiguität von γυνή zu einer ausdrücklichen Ehebezeichnung einzuengen. „Ochsenjoch“ entspricht βοοζύγιον genauer als „Ochsengespann“.
