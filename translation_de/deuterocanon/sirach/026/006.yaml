  yaml_path: translation/deuterocanon/sirach/026/006.yaml
  text: Slander in a city[a], and an assembly of a mob, and a false accusation—all these are worse than death.
translation:
  language: de
  text: Verleumdung in einer Stadt[a], eine Versammlung der Menge und eine falsche Anschuldigung – all das ist schlimmer als der Tod.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Text bietet eine knappe Aufzählung mit elliptischen Genitiven: wörtlich etwa »Verleumdung einer/in einer Stadt« und »Versammlung einer Menge«. Die Übersetzung gibt den wahrscheinlichen Sinn in natürlichem Deutsch wieder.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διαβολὴν
  choice: Verleumdung
  rationale: Das Substantiv bezeichnet eine verleumderische Beschuldigung oder üble Nachrede; »Verleumdung« ist im Deutschen prägnant und bewahrt den vorwurfsartigen Charakter.
- source_word: πόλεως
  choice: in einer Stadt
  rationale: Der Genitiv ist in der knappen Aufzählung elliptisch. Die Wiedergabe als Ortsangabe ist im Deutschen verständlich, ohne eine gegen die Stadt selbst gerichtete Handlung zu behaupten.
- source_word: ἐκκλησίαν ὄχλου
  choice: der Auflauf einer Menschenmenge
  rationale: ἐκκλησία bezeichnet hier eine Versammlung, nicht spezifisch eine religiöse Gemeinde; ὄχλος bezeichnet die Menge. »Auflauf« gibt den im Zusammenhang bedrohlich wirkenden Zusammenschluss natürlich wieder, ohne kirchliche Sprache einzutragen.
- source_word: καταψευσμόν
  choice: eine falsche Anschuldigung
  rationale: Der Ausdruck bezeichnet eine gegen jemanden gerichtete unwahre Aussage. »Falsche Anschuldigung« unterscheidet sie von der zuvor genannten Verleumdung und erhält den anklagenden Sinn.
- source_word: ὑπὲρ θάνατον πάντα μοχθηρά
  choice: all das ist schlimmer als der Tod
  rationale: ὑπέρ hat hier vergleichende Bedeutung, und πάντα fasst die vorausgehenden Punkte zusammen. »Schlimmer als der Tod« gibt die Aussage klar und idiomatisch wieder.
