  text: Keep strict watch over a headstrong daughter[a], lest, finding freedom for herself, she make use of it.
translation:
  language: de
  text: Halte über eine Tochter fest Wache, damit sie nicht, wenn sie Freiraum für sich findet, diesen nutzt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort für „Freiraum“ kann auch „Lockerung“ oder „Erleichterung“ bedeuten. Das vorangehende Adverb bezeichnet wörtlich eine unbeirrbare bzw. unnachgiebige Weise; es ist formal nicht als Eigenschaft der Tochter formuliert. „Diesen“ bezieht sich auf den gefundenen Freiraum.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπὶ θυγατρί
  choice: über eine Tochter
  rationale: ἐπί mit Dativ bezeichnet hier den Gegenstand der Bewachung; „über … Wache halten“ gibt dies im Deutschen idiomatisch wieder.
- source_word: ἀδιατρέπτως
  choice: unnachgiebig
  rationale: 'Das Adverb beschreibt am natürlichsten die Art, wie die Wache gefestigt beziehungsweise ausgeübt werden soll: ohne sich abbringen zu lassen. Es wird daher nicht als Eigenschaft der Tochter wiedergegeben.'
- source_word: στερέωσον φυλακήν
  choice: halte … strenge Wache
  rationale: Die Verbindung bedeutet wörtlich etwa „festige eine Wache“. Die deutsche Formulierung bewahrt sowohl den Gedanken der Bewachung als auch deren nachdrückliche, feste Ausübung.
- source_word: ἵνα μή
  choice: damit … nicht
  rationale: Dies gibt den negativen Zwecksatz in natürlichem modernem Deutsch wieder.
- source_word: εὑροῦσα ἄνεσιν ἑαυτῇ
  choice: wenn sie sich Freiraum verschafft
  rationale: ἄνεσις kann Erleichterung, Lockerung oder Freiheit von Beschränkung bezeichnen. Im Zusammenhang mit Bewachung ist „Freiraum“ passend; der reflexive Dativ wird durch „sich“ ausgedrückt.
- source_word: χρήσηται
  choice: diesen ausnutzt
  rationale: χράομαι bedeutet „gebrauchen, nutzen“. „Ausnutzen“ bringt im warnenden Zusammenhang die Nutzung des zuvor gewonnenen Freiraums natürlich zum Ausdruck, ohne eine konkrete Handlung hinzuzufügen.
