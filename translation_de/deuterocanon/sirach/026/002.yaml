translation:
  language: de
  text: Eine tüchtige Frau erfreut ihren Mann, und er wird die Jahre seines Lebens in Wohlergehen[a] verbringen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Griechisch: „und er wird seine Jahre in Frieden vollenden.“'
    reason: alternative_reading
lexical_decisions:
- source_word: אֵשֶׁת חַיִל
  choice: eine tüchtige Frau
  rationale: Die Wendung bezeichnet Stärke, Befähigung und bewährte Qualität. „Tüchtig“ ist im modernen Deutschen idiomatisch und bewahrt diese Bedeutungsbreite, ohne militärischen Mut oder eine bestimmte Tugendlehre in den Vordergrund zu stellen.
- source_word: תְּדַּשֵּׁן
  choice: erfreut
  rationale: Das Verb zeichnet wörtlich das Bild von Fettwerden beziehungsweise Gedeihen und bezeichnet hier bewirktes Wohlergehen. „Erfreut“ gibt die kontextuelle Wirkung natürlich wieder und wird durch das griechische εὐφραίνει gestützt, ohne das Bild mechanisch zu übertragen.
- source_word: לְבַעֲלָהּ
  choice: ihren Mann
  rationale: בעל bedeutet hier eindeutig „Ehemann“; im Deutschen ist „ihren Mann erfreut“ die natürliche Satzfügung.
- source_word: וּשְׁנֵי חַיָּיו
  choice: die Jahre seines Lebens
  rationale: Die Formulierung entspricht der ausdrücklichen hebräischen Wendung und klingt zugleich natürlich und würdevoll.
- source_word: יְבַלֶּה
  choice: wird … verbringen
  rationale: Das Verb bezeichnet in diesem Zusammenhang das Hinbringen beziehungsweise Durchleben einer Zeitspanne; „verbringen“ ist die passende deutsche Entsprechung.
- source_word: בַנְעִימִים
  choice: in Wohlergehen
  rationale: Der hebräische Ausdruck bezeichnet angenehme, erfreuliche Lebensumstände. „In Wohlergehen“ gibt dies flüssig wieder, ohne die abweichende griechische Lesart „in Frieden“ in den Haupttext zu übernehmen.
theological_decisions:
- issue: Abweichung zwischen dem hebräischen und dem griechischen Schlussausdruck
  choice: Der Haupttext folgt dem Hebräischen mit „in Wohlergehen“.
  alternative: „in Frieden“ nach dem Griechischen
  rationale: Der erhaltene hebräische Text ist hier sicher bezeugt und hat bei Sirach Vorrang. Die griechische Fassung kann eine abweichende Vorlage oder eine deutende Wiedergabe spiegeln; deshalb wird sie transparent in einer Fußnote bewahrt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch in würdigem Weisheitsstil. „Tüchtige Frau“ ist bewusst idiomatisch; „Wohlergehen“ bewahrt den positiven, umfassenden Sinn des hebräischen Ausdrucks.
