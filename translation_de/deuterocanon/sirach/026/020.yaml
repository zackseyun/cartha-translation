lexical_decisions:
- source_word: Ἐπὶ δυτὶ
  choice: Über zwei Dinge
  rationale: ἐπί mit dem Dativ bezeichnet hier den Anlass der Betrübnis. Die Formulierung bewahrt den aufzählenden Aufbau und klingt im Deutschen natürlich.
- source_word: λελύπηται
  choice: ist betrübt
  rationale: Das Perfekt von λυπέω bezeichnet einen gegenwärtigen, aus eingetretener Betrübnis hervorgegangenen Zustand. „Ist betrübt“ gibt diesen statischen Sinn knapp wieder.
- source_word: ἡ καρδία μου
  choice: mein Herz
  rationale: Die wörtliche Wiedergabe bewahrt das biblische Bild vom Herzen als Sitz des Empfindens und ist im modernen Deutschen verständlich.
- source_word: ἐπὶ τῷ τρίτῳ
  choice: über das dritte
  rationale: Die Formulierung spiegelt die erste Satzhälfte und erhält die rhetorische Steigerung von zwei Anlässen zu einem dritten.
- source_word: θυμός
  choice: Zorn
  rationale: θυμός bezeichnet hier heftigen Ärger oder Zorn. „Zorn“ entspricht der Intensität und dem würdigen Sprachregister, ohne wie „Wut“ eine unbeherrschte Raserei festzulegen.
- source_word: μοι ἐπῆλθεν
  choice: kam … über mich
  rationale: Die Wendung gibt das Eintreten beziehungsweise Überkommen des Zorns formal nah wieder, ohne zu entscheiden, ob er als äußerer Anfall oder als innere Regung vorgestellt ist.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst beibehaltener biblischer Bildsprache. Der Doppelgebrauch von „über“ folgt der parallelen griechischen Konstruktion; der Doppelpunkt macht kenntlich, dass die angekündigte Aufzählung folgt.
