translation:
  language: de
  text: 'Über zwei Dinge ist mein Herz betrübt[a], und über das Dritte kam Zorn über mich:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der griechische Wortlaut ist eindeutig; für sich allein ist der Satz jedoch unvollständig und leitet die folgende Aufzählung ein.
