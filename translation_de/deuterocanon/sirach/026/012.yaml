translation:
  language: de
  text: Hüte dich vor einem schamlosen Blick[a], und wundere dich nicht, wenn sie dir Unrecht tut[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „Hüte dich hinter/vor einem schamlosen Auge.“ Die griechische Verbindung ist ungewöhnlich und schwer eindeutig wiederzugeben; gemeint ist wahrscheinlich, dass man sich vor einem schamlosen Blick in Acht nehmen soll.'
    reason: lexical_alternative
  - marker: b
    text: Im Griechischen steht hier kein ausdrückliches „sie“. Das weibliche Subjekt ergibt sich aus dem Zusammenhang, der von einer sittlich verwerflichen Frau handelt.
    reason: alternative_reading
lexical_decisions:
- source_word: ὀπίσω … ὀφθαλμοῦ
  choice: vor … Blick
  rationale: Die Verbindung mit ὀπίσω ist ungewöhnlich und wörtlich im Deutschen kaum verständlich. Zusammen mit φύλαξαι bezeichnet sie wahrscheinlich schützende Abwehr oder Meidung. „Sich vor … hüten“ gibt diesen Sinn natürlich wieder; „Blick“ bewahrt zugleich das Bild des Auges in idiomatischer Form.
- source_word: ἀναιδοῦς
  choice: schamlosen
  rationale: ἀναιδής bezeichnet fehlende Scham und dreiste Unverfrorenheit. „Schamlos“ ist präzise, verständlich und erhält die moralische Wertung des griechischen Ausdrucks.
- source_word: φύλαξαι
  choice: Hüte dich
  rationale: Der Aoristimperativ von φυλάσσω fordert hier zu persönlicher Wachsamkeit und Abwehr auf. „Hüte dich“ ist im Deutschen knapp, natürlich und dem Weisheitsstil angemessen.
- source_word: μὴ θαυμάσῃς
  choice: wundere dich nicht
  rationale: θαυμάζω kann „staunen“ oder „sich wundern“ bedeuten. Im Warnzusammenhang meint die Wendung, dass das folgende Verhalten den Angesprochenen nicht überraschen soll.
- source_word: ἐὰν
  choice: wenn
  rationale: ἐάν leitet formal eine Bedingung ein. Deutsches „wenn“ erhält die Offenheit zwischen konditionalem „falls“ und erwartbarem „wenn“, ohne das Geschehen als sicher darzustellen.
- source_word: εἰς σὲ πλημμελήσῃ
  choice: dir Unrecht tut
  rationale: πλημμελέω bezeichnet ein Fehlverhalten oder Vergehen; εἰς σέ kennzeichnet die davon betroffene Person. „Dir Unrecht tut“ bewahrt das moralische Gewicht, ohne den Ausdruck unnötig auf eine bestimmte Art von Sünde festzulegen.
theological_decisions:
- issue: Das Geschlecht des unausgesprochenen Subjekts im zweiten Satzteil
  choice: Das Pronomen „sie“ wird aufgrund des unmittelbaren Zusammenhangs ergänzt und durch eine Fußnote als kontextuelle Ergänzung kenntlich gemacht.
  alternative: 'Den Satz ohne bestimmtes Subjekt wiedergeben, etwa: „wenn dir Unrecht geschieht“.'
  rationale: Im griechischen Satz steht kein ausdrückliches Subjekt; die Verbform bestimmt kein Geschlecht. Der Zusammenhang von Sirach 26 legt jedoch eine Frau als Bezugsperson nahe. Das ergänzte „sie“ macht den deutschen Satz verständlich, während die Fußnote die grammatische Mehrdeutigkeit offenlegt.
- issue: Moralische Reichweite von πλημμελέω
  choice: „Unrecht tun“
  alternative: „gegen dich sündigen“ oder „sich an dir vergehen“
  rationale: Der griechische Ausdruck kann moralisches Verfehlen oder Sündigen bezeichnen, benennt hier aber nicht eindeutig die Art des Vergehens. „Unrecht tun“ erhält die moralische Aussage, ohne eine engere sexuelle, rechtliche oder konfessionell geprägte Deutung einzutragen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit knapper, würdevoller Mahnrede. „Blick“ ist gegenüber dem wörtlichen „Auge“ idiomatischer; die konkrete Bildsprache und die Schwierigkeit der griechischen Wendung werden in der Fußnote transparent gemacht.
