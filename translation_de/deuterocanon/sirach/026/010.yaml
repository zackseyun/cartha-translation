  yaml_path: translation/deuterocanon/sirach/026/010.yaml
  text: A woman's sexual immorality is known by the lifting of her eyes[b][a], and by her eyelids.
translation:
  language: de
  text: Die sexuelle Unmoral einer Frau ist an den unsteten Bewegungen ihrer Augen[a] und an ihren Augenlidern[b] zu erkennen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »an der erhobenen oder schweifenden Bewegung ihrer Augen«. Der griechische Ausdruck ist schwierig und kann eine Erhebung, unstete Bewegung oder ein Umherschweifen der Augen bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »an ihren Augenlidern«. Gemeint sein kann, was sich in ihrem Augenausdruck oder Blick zeigt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πορνεία
  choice: sexuelle Unmoral
  rationale: Das Substantiv bezeichnet hier allgemein unerlaubtes sexuelles Verhalten. »Sexuelle Unmoral« wahrt die Breite des Ausdrucks, ohne ihn auf Prostitution oder einen einzelnen Tatbestand einzuengen.
- source_word: γυναικός
  choice: einer Frau
  rationale: Der artikellose Genitiv ist in der sprichwörtlichen Aussage allgemein zu verstehen und wird im Deutschen natürlich mit »einer Frau« wiedergegeben.
- source_word: ἐν
  choice: an
  rationale: Das wiederholte ἐν bezeichnet hier den wahrnehmbaren Bereich beziehungsweise das äußere Merkmal, an dem etwas erkannt wird. Das deutsche »an … zu erkennen« gibt diese Funktion idiomatisch wieder.
- source_word: μετεωρισμοῖς ὀφθαλμῶν
  choice: am unruhigen Blick ihrer Augen
  rationale: μετεωρισμοί kann Erhebung, unstete Bewegung oder ein Umherschweifen bezeichnen. »Unruhiger Blick« ist verständlich und lässt offen, ob ein erhobener, schweifender oder vielsagender Blick gemeint ist.
- source_word: βλεφάροις
  choice: Augenlidern
  rationale: Die konkrete Körperbezeichnung wird beibehalten, obwohl sie wahrscheinlich stellvertretend für Mimik, Augenbewegung oder Blick steht.
- source_word: γνωσθήσεται
  choice: ist … zu erkennen
  rationale: Das Futur Passiv hat in dieser allgemeinen Weisheitsregel sprichwörtliche Geltung. Die deutsche Präsensform gibt diesen gnomischen Sinn natürlich wieder und bewahrt den Gedanken des Erkanntwerdens.
theological_decisions:
- issue: Bedeutungsumfang von πορνεία in der Weisheitsliteratur
  choice: sexuelle Unmoral
  alternative: Prostitution; Unzucht; außerehelicher Geschlechtsverkehr
  rationale: Die Aussage beschreibt ein moralisches Verhalten allgemein und legt keinen engen rechtlichen oder kommerziellen Tatbestand fest. Die gewählte Formulierung wahrt diese Breite, ohne eine konfessionell geprägte Definition einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Aussage bleibt in ihrer sprichwörtlichen Zuspitzung erhalten; die schwierige Bildsprache des griechischen μετεωρισμοῖς wird im Haupttext lesbar wiedergegeben und in der Fußnote offengehalten.
