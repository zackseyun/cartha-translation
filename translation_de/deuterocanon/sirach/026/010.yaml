  terminology: »Sexuelle Unmoral« ist für πορνεία als weiter moralischer Sammelbegriff vertretbar. »Augenlider« wahrt die konkrete Terminologie des Ausgangstextes; die Fußnote erläutert die wahrscheinliche metonymische Funktion, ohne sie in den Haupttext zu verlagern.
