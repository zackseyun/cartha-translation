    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνὴρ πολεμιστής
  choice: ein Krieger
  rationale: Die knappe Wiedergabe bewahrt den männlichen Singular und bezeichnet natürlich einen zum Kampf gehörenden oder kampferprobten Mann.
- source_word: ὑστερῶν
  choice: der zurückbleibt
  rationale: Das Partizip kann ein Zurückbleiben, Zukurzkommen oder Mangelhaben bezeichnen. „Zurückbleibt“ erhält die offene Bedeutung und vermeidet, die Folge des Mangels vorschnell als körperliche Schwäche festzulegen.
- source_word: διʼ ἔνδειαν
  choice: aus Mangel
  rationale: ἔνδεια bezeichnet Mangel, Not oder Bedürftigkeit; „aus Mangel“ gibt die kausale Wendung knapp wieder, ohne sie ausschließlich auf Armut einzuengen.
- source_word: ἄνδρες συνετοί
  choice: verständige Männer
  rationale: συνετός bezeichnet Einsicht und Urteilsvermögen. Die Übersetzung bewahrt zugleich den ausdrücklich männlichen Plural.
- source_word: ἐὰν σκυβαλωθῶσιν
  choice: wenn sie wie Unrat weggeworfen werden
  rationale: Das Verb ist von σκύβαλον, „Unrat/Abfall“, geprägt und verbindet Erniedrigung mit dem Bild des Wegwerfens. Die Formulierung erhält die drastische Bildsprache.
