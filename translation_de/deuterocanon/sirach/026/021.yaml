translation:
  language: de
  text: Ein Krieger, der aus Mangel zu kurz kommt,[a] und verständige Männer, wenn sie wie Unrat behandelt werden.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der griechische Wortlaut ist für sich genommen syntaktisch unvollständig und scheint in der folgenden Zeile weitergeführt zu werden. Daher bleibt hier die bruchstückhafte Form erhalten.
    reason: textual_variant
  - marker: b
