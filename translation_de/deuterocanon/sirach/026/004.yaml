  source_fidelity: 'Die Vorlage besteht aus zwei knappen Nominalaussagen: Sie nennt Reiche und Arme, ein gutes Herz und ein jederzeit heiteres Gesicht. „zeigt“ macht daraus eine ausdrückliche Manifestations- bzw. Kausalbeziehung, die der griechische Text nicht formuliert. Die revidierte Fassung gibt den spruchhaften, impliziten Zusammenhang idiomatisch wieder, ohne ihn als Ursache-Wirkung-Verhältnis festzulegen.'
  naturalness: '„Ob reich oder arm: Wer ein gutes Herz hat, hat zu jeder Zeit ein heiteres Gesicht“ ist klares, modernes Standarddeutsch und bewahrt den knappen Weisheitsspruchcharakter. Die Wiederholung von „hat“ ist hier natürlich und deutlich.'
