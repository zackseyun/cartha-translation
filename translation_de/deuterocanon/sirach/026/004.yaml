  text: Whether rich or poor[a], a good heart has a cheerful face at all times.
translation:
  language: de
  text: 'Ob reich oder arm: Wer ein gutes Herz hat, hat zu jeder Zeit ein heiteres Gesicht.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πλουσίου δὲ καὶ πτωχοῦ
  choice: Ob reich oder arm
  rationale: Die beiden Genitive bilden einen knappen sozialen Gegensatz. Die idiomatische deutsche Fassung bewahrt den Sinn, ohne die komprimierte griechische Syntax künstlich nachzuahmen; δέ bleibt als schwacher Übergang unübersetzt.
- source_word: καρδία ἀγαθή
  choice: ein gutes Herz
  rationale: Bewahrt das konkrete Bild für die innere moralische und emotionale Verfassung und klingt zugleich natürlich.
- source_word: ἐν παντὶ καιρῷ
  choice: zu jeder Zeit
  rationale: Gibt die allgemeine zeitliche Aussage des Griechischen präzise und in würdigem modernem Deutsch wieder.
- source_word: πρόσωπον ἱλαρόν
  choice: ein heiteres Gesicht
  rationale: πρόσωπον bezeichnet konkret das Gesicht; ἱλαρόν meint eine heitere, frohe Ausstrahlung. „Heiter“ ist hier natürlich und weniger oberflächlich als „fröhlich“.
theological_decisions:
- issue: Verhältnis von innerer Haltung und äußerem Ausdruck in der verblosen griechischen Formulierung
  choice: „Ein gutes Herz zeigt … ein heiteres Gesicht“
  alternative: „Das Herz eines Reichen wie eines Armen ist gut; das Gesicht ist zu jeder Zeit heiter.“
  rationale: „zeigt“ macht die naheliegende Beziehung zwischen Herz und Gesicht im Deutschen verständlich, ohne eine besondere dogmatische Deutung einzutragen. Die Fußnote bewahrt die formale Mehrdeutigkeit der komprimierten Vorlage.
translation_notes:
  register: Modernes, allgemein verständliches und zugleich würdevolles Standarddeutsch. Der knappe Spruchcharakter bleibt erhalten; die ergänzte Verbform „zeigt“ dient der natürlichen deutschen Syntax, während die Fußnote die wörtlichere Lesart dokumentiert.
