  text: Do not debase yourself by the sight of your eyes[b][a], nor be appalled after her house.
translation:
  language: de
  text: Mach dich nicht verächtlich durch das, was deine Augen sehen[a], und geh nicht hinter ihrem Haus her zugrunde[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Parallele weicht erheblich ab: „Betrachte eine Jungfrau nicht eindringlich, damit du nicht durch die mit ihr verbundenen Vorwürfe oder Strafen zu Fall kommst.“'
    reason: alternative_reading
  - marker: b
    text: 'Hebräisch wörtlich etwa: „hinter/nach ihrem Haus“. Die schwierige Wendung kann das Verfolgen ihres Haushalts, das Nachgehen bis zu ihrem Haus oder den Ruin infolge einer Verwicklung mit ihrem häuslichen Bereich meinen. Das Verb kann auch „verwüstet werden“ oder „entsetzt sein“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהִתְנַבֵּל
  choice: erniedrige dich
  rationale: Der reflexive Hitpael von נבל bezeichnet hier, dass man sich selbst herabsetzt oder verächtlich macht. „Erniedrige dich“ bewahrt sowohl die reflexive Form als auch den Charakter der moralischen Warnung.
- source_word: בְּמַרְאֵה עֵינֵיךָ
  choice: wegen dessen, was deine Augen sehen
  rationale: Wörtlich steht „durch/wegen des Anblicks deiner Augen“. Die gewählte Formulierung gibt den hebräischen Blickbezug in verständlichem Deutsch wieder, ohne das Gemeinte ausdrücklich als Begierde zu deuten.
- source_word: וּלְשׁוֹמֵם
  choice: geh … zugrunde
  rationale: שמם kann Verwüstung, Entsetzen oder völligen Ruin bezeichnen. Im Zusammenhang einer Warnung ist „zugrunde gehen“ natürliches Deutsch und erhält die starke Folgeaussage, ohne zwischen äußerer Verwüstung und innerem Entsetzen dogmatisch zu entscheiden.
- source_word: אֲחַר בֵּיתָהּ
  choice: hinter ihrem Haus her
  rationale: Die knappe Wendung bedeutet wörtlich ungefähr „hinter/nach ihrem Haus“. „Hinter ihrem Haus her“ bewahrt das mögliche Motiv des Nachgehens, bleibt aber bewusst ungewöhnlich; die Unsicherheit und weitere Deutungsmöglichkeiten werden in einer Fußnote offengelegt.
theological_decisions:
- issue: Vorrang des erhaltenen hebräischen Textes gegenüber der erheblich abweichenden griechischen Parallele
  choice: Der erhaltene hebräische Text bildet die Grundlage des Haupttextes; die griechische Fassung wird in einer Fußnote vollständig als abweichende Lesart wiedergegeben.
  alternative: 'Nach der griechischen Parallele übersetzen: „Betrachte eine Jungfrau nicht eindringlich, damit du nicht durch die mit ihr verbundenen Vorwürfe oder Strafen zu Fall kommst.“'
  rationale: Da für diesen Vers ein hebräischer Zeuge vorliegt, ist er die primäre Quelle. Die griechische Fassung enthält jedoch eine deutlich andere Warnung und darf deshalb nicht stillschweigend angeglichen oder übergangen werden.
- issue: Mehrdeutigkeit von שמם und אחר ביתה
  choice: Im Haupttext wird ein möglicher Sinn als „hinter ihrem Haus her zugrunde gehen“ formuliert und die Unsicherheit ausdrücklich angemerkt.
  alternative: „Erschrick nicht nach ihrem Haus“ oder „werde wegen ihres Hauses verwüstet“.
  rationale: Der hebräische Ausdruck ist knapp und schwierig. Die Übersetzung soll eine lesbare Aussage bieten, ohne die möglichen Bedeutungen „entsetzt sein“, „verwüstet werden“ oder „durch das Nachgehen ruiniert werden“ als endgültig entschieden auszugeben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Warnung ist direkt und verständlich formuliert; die ungewöhnliche Bildsprache des Hebräischen bleibt erkennbar. Die negativ koordinierte Infinitivkonstruktion wird entsprechend dem Zusammenhang als zweigliedrige Aufforderung wiedergegeben.
