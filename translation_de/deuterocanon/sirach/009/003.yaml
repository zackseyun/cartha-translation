translation:
  language: de
  text: Komm einer fremden Frau[a] nicht nahe, damit du nicht in ihre Fangnetze fällst.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „fremde Frau“. In der Weisheitsliteratur kann damit eine Frau gemeint sein, die außerhalb legitimer ehelicher oder sittlicher Grenzen steht; der griechische Paralleltext weist auf eine sexuell ungehörige Verbindung hin. Gemeint ist daher nicht zwingend eine Frau aus einem anderen Volk.
    reason: lexikalische Mehrdeutigkeit
lexical_decisions:
- source_word: אַל תִּקְרַב
  choice: Komm … nicht nahe
  rationale: Die verneinte Verbform ist ein direktes Verbot. „Nicht nahekommen“ bewahrt die räumliche Bildsprache und kann zugleich das Eingehen einer Beziehung bezeichnen.
- source_word: אִשָּׁה זָרָה
  choice: einer fremden Frau[a]
  rationale: Wörtlich bezeichnet der Ausdruck eine „fremde“ oder „außenstehende“ Frau. In der Weisheitsliteratur kann er eine Frau meinen, die außerhalb legitimer ehelicher oder sittlicher Grenzen steht. Die bewusst offene Wiedergabe vermeidet sowohl eine rein ethnische Deutung als auch die nicht ausdrücklich belegte Festlegung auf „Prostituierte“.
- source_word: פֶּן
  choice: damit … nicht
  rationale: Die Partikel leitet eine Warnung vor einer unerwünschten Folge ein. „Damit … nicht“ ist im modernen Deutsch klar und erhält den warnenden Sinn.
- source_word: תִּפּוֹל
  choice: du … fällst
  rationale: Die Grundbedeutung „fallen“ wird beibehalten; auch die griechische Parallele bestätigt dieses Bild.
- source_word: בִּמְצוּדֹתֶיהָ
  choice: in ihre Fangnetze
  rationale: Das Substantiv bezeichnet Fanggeräte wie Netze oder Schlingen. „Fangnetze“ verbindet sich im Deutschen natürlich mit „fallen“ und bewahrt das Jagdbild.
theological_decisions:
- issue: Bedeutung der „fremden Frau“ im weisheitlichen Zusammenhang
  choice: Die offene Bezeichnung „fremde Frau“ im Haupttext beibehalten und durch eine Fußnote erläutern.
  alternative: „sittenlose Frau“, „Ehebrecherin“ oder „Prostituierte“
  rationale: Der hebräische Ausdruck lässt offen, in welchem genauen Sinn die Frau „fremd“ ist. Der griechische Paralleltext weist auf eine sexuell ungehörige Verbindung hin, rechtfertigt aber keine engere Festlegung. Die Übersetzung bewahrt daher die Mehrdeutigkeit und verhindert zugleich durch die Fußnote ein rein ethnisches Verständnis.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch in knapper Spruchform. Die Formulierung bleibt bildhaft und verständlich; die Fußnote wahrt die semantische und theologische Offenheit des hebräischen Ausdrucks.
