  text: Do not give yourself to a prostitute[b][a], lest you squander your inheritance.
translation:
  language: de
  text: Gib dich nicht einer Prostituierten hin,[a] damit du nicht dein Erbe[b] vergeudest.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Überlieferung bietet hier eine erheblich längere Fassung: „Wende deinen Blick von einer schönen Frau ab und betrachte nicht aufmerksam die Schönheit einer anderen Frau; durch die Schönheit einer Frau sind viele in die Irre gegangen, und daraus entflammt die Liebe wie Feuer.“'
    reason: alternative_reading
  - marker: b
    text: Das hebräische Wort kann das Erbe, den ererbten Besitz oder den Erbanteil bezeichnen. Gemeint ist die Gefahr, durch sexuelles Fehlverhalten zu vergeuden oder zu verlieren, was einem gehört.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּתֵּן
  choice: Gib … nicht hin
  rationale: Die verneinte Aufforderung mit נתן wird im Deutschen zusammen mit נַפְשְׁךָ natürlich durch „Gib dich nicht … hin“ wiedergegeben. Dies bewahrt den Gedanken, sich einer Person auszuliefern, ohne unnötig auszudeuten.
- source_word: לְזוֹנָה
  choice: einer Prostituierten
  rationale: זוֹנָה bezeichnet hier spezifisch eine Prostituierte. Das ist präziser und gegenwärtiger als „Hure“ und enger am Hebräischen als die allgemeinere Wiedergabe „einer sexuell unmoralischen Frau“.
- source_word: נַפְשְׁךָ
  choice: dich
  rationale: נפש bezeichnet häufig die ganze Person beziehungsweise das eigene Selbst, nicht nur eine vom Körper getrennte „Seele“. „Gib dich … hin“ ist daher idiomatisch und sachlich angemessen.
- source_word: פֶּן
  choice: damit … nicht
  rationale: פן leitet eine befürchtete Folge ein. „Damit … nicht“ gibt die Warnung in natürlichem modernem Deutsch wieder; „auf dass nicht“ wäre altertümlich.
- source_word: תָּסֵב
  choice: vergeudest
  rationale: Die Form bezeichnet hier wahrscheinlich das Abwenden, Entziehen oder Verlorengehenlassen des Erbes. Das wörtlichere „abwendest“ wäre im Deutschen missverständlich; „vergeudest“ macht die im Zusammenhang gemeinte wirtschaftliche Folge verständlich, ohne sie als bereits eingetretenen vollständigen Verlust darzustellen.
- source_word: נַחֲלָתֶךָ
  choice: dein Erbe
  rationale: נחלה kann Erbe, ererbten Besitz oder Erbanteil bezeichnen. „Erbe“ bewahrt sowohl den materiellen als auch den familiären Bezug.
theological_decisions:
- issue: Vorrang des erhaltenen hebräischen Textes gegenüber der erheblich längeren griechischen Fassung
  choice: Der Haupttext folgt der erhaltenen kurzen hebräischen Fassung; die abweichende griechische Fassung wird in einer Fußnote vollständig wiedergegeben.
  alternative: 'Die griechische Fassung als Haupttext übersetzen: „Wende deinen Blick von einer schönen Frau ab …“'
  rationale: Da für diese Stelle ein hebräischer Text mit hoher Sicherheit vorliegt, bildet er die Grundlage der Übersetzung. Die griechische Überlieferung bietet offenbar eine längere oder anders gestaltete Textfassung und darf deshalb nicht stillschweigend mit dem Hebräischen verschmolzen werden; als bedeutende Textvariante wird sie jedoch offengelegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper spruchhafter Warnung. „Prostituierte“ ist sachlich und gegenwärtig; „Gib dich … hin“ gibt נַפְשְׁךָ idiomatisch als die ganze Person wieder. Die erhebliche Differenz zwischen hebräischer und griechischer Überlieferung wird nicht harmonisiert, sondern transparent in der Fußnote dokumentiert.
