base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/009/020.yaml
  text: By your strength acquire your friend[b][a], and associate yourself with the wise.
translation:
  language: de
  text: Nach deinen Kräften gewinne dir einen Freund[a], und schließe dich den Weisen an.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Gewinne dir nach deinem Vermögen einen Freund.“ Das hebräische Wort kann Kraft im Sinn von Fähigkeit oder verfügbaren Mitteln bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Die hebräische Verbform ist selten und in ihrer Bedeutung unsicher. Die griechische Überlieferung lautet genauer: „Berate dich mit den Weisen.“'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּכֹחֲךָ
  choice: Nach deinen Kräften
  rationale: Die Wendung bezeichnet die eigene Kraft, Fähigkeit oder die verfügbaren Mittel. „Nach deinen Kräften“ bewahrt dieses Bedeutungsspektrum und entspricht zugleich dem griechischen κατὰ τὴν ἰσχύν σου.
- source_word: קְנֵה
  choice: gewinne dir
  rationale: קנה bedeutet gewöhnlich „erwerben“ oder „kaufen“. Bei einem Freund ist „gewinne dir“ im Deutschen natürlich und gibt den relationalen Sinn wieder, ohne einen tatsächlichen Kauf nahezulegen.
- source_word: רֵעֶךָ
  choice: einen Freund
  rationale: רֵעַ kann Freund, Gefährte oder Nächster bedeuten. Der unmittelbare Zusammenhang empfiehlt hier „Freund“.
- source_word: וְעִם חֲכָמִים
  choice: den Weisen
  rationale: Der maskuline Plural bezeichnet hier allgemein weise Menschen. Die substantivierte Form „die Weisen“ ist präzise, würdig und schränkt die Aussage nicht unnötig auf Männer ein.
- source_word: תִּסְתַּיָּד
  choice: schließe dich … an
  rationale: Die seltene beziehungsweise unsichere Verbform wird im Zusammenhang am ehesten als Umgang oder Verbindung mit den Weisen verstanden. Die Formulierung wahrt diese relationale Bedeutung, ohne die engere griechische Deutung „berate dich“ in den Haupttext zu übernehmen.
theological_decisions:
- issue: Geschlechtsbezug von חֲכָמִים
  choice: den Weisen
  alternative: weisen Männern
  rationale: Der maskuline Plural bezeichnet eine allgemeine Gruppe weiser Personen; der Kontext fordert keine Beschränkung auf Männer.
- issue: Bedeutung der seltenen Form תִּסְתַּיָּד
  choice: schließe dich den Weisen an
  alternative: berate dich mit den Weisen
  rationale: Der hebräische Wortlaut bleibt lexikalisch unsicher. Die Hauptfassung gibt den weiteren relationalen Sinn wieder; die spezifischere Lesart der griechischen Überlieferung wird in einer Fußnote genannt, damit die Spannung der Quellen erhalten bleibt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Weisheitston. „Nach deinen Kräften“ ist idiomatisch, ohne die Aussage zu verstärken; „gewinne dir einen Freund“ vermeidet die im Deutschen kommerziell klingende Formulierung „erwirb einen Freund“.
