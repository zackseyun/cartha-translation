translation:
  language: de
  text: Sei nicht eifersüchtig auf deine Frau in deinen Armen[a][b], sonst lehrst du zu deinem eigenen Schaden Böses.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Beneide deine Frau in deinen Armen nicht.“ Das hebräische Verb kann Eifersucht oder Neid bezeichnen; der eheliche Zusammenhang spricht eher für Eifersucht.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich etwa: „die Frau an deiner Brust“ oder „die Frau in deinem Schoß“ – ein Bild für die eigene, eng vertraute Ehefrau.'
    reason: cultural_note
  - marker: c
    text: Das Hebräische sagt nur „Böses“; die griechische Fassung hat „eine böse Unterweisung“. Eine mögliche Deutung der elliptischen Formulierung ist, dass die Frau durch solche Eifersucht etwas Böses lernt, das sich gegen den Mann selbst richtet.
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תְּקַנֵּא
  choice: Sei nicht eifersüchtig
  rationale: קנא bezeichnet hier im ehelichen Zusammenhang am ehesten Eifersucht; die mögliche Bedeutung „beneiden“ wird in einer Fußnote bewahrt.
- source_word: אֵשֶׁת חֵיקֶךָ
  choice: die Frau in deinen Armen
  rationale: Die Wendung bedeutet wörtlich etwa „die Frau an deiner Brust/in deinem Schoß“ und bezeichnet die eigene, eng vertraute Ehefrau. „In deinen Armen“ bewahrt das Bild in natürlichem modernem Deutsch.
- source_word: פֶּן
  choice: sonst
  rationale: Die Partikel leitet die befürchtete Folge der Warnung ein. „Sonst“ gibt dies im Deutschen knapp und natürlich wieder.
- source_word: תִּלְמַד עָלֶיךָ
  choice: lehrst du zu deinem eigenen Schaden
  rationale: Die Form von למד und die griechische Parallele stützen „lehren“. עליך zeigt, dass das Gelehrte auf den Lehrenden selbst zurückwirkt beziehungsweise sich gegen ihn richtet; „zu deinem eigenen Schaden“ gibt diesen Sinn verständlich wieder, ohne ein im Hebräischen unausgesprochenes Objekt ausdrücklich einzusetzen.
- source_word: רָעָה
  choice: Böses
  rationale: Das Hebräische nennt schlicht „Böses“. Die Übersetzung hält daran fest, während die griechische Verdeutlichung als „böse Unterweisung“ in der Fußnote genannt wird.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die konkrete Nähe des hebräischen Bildes bleibt mit „in deinen Armen“ erhalten, ohne die im Deutschen befremdliche Formulierung „Frau an deiner Brust“ in den Haupttext zu setzen. Die ungewöhnliche Spannung von „Böses lehren“ und der Rückwirkung auf den Lehrenden wird nicht durch ein ausdrücklich ergänztes „ihr“ vorschnell aufgelöst.
