translation:
  language: de
  text: Lass dich nicht mit einer Prostituierten ein, damit du nicht durch ihre Verlockungen[a] gefangen wirst.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch „durch/in ihren leqachot“; der Ausdruck ist schwer deutbar. Die griechische Parallele hat sinngemäß „in ihren Unternehmungen/Versuchen“ und stützt eine Wiedergabe wie „durch ihre Verlockungen“ oder „durch ihre Machenschaften“.
    reason: lexical_alternative
lexical_decisions:
- source_word: עִם זוֹנָה אַל תִּסְתַּיֵּד
  choice: Lass dich nicht mit einer Prostituierten ein
  rationale: זוֹנָה bezeichnet im Hebräischen eine Prostituierte. Das ungewöhnliche Verb תִּסְתַּיֵּד warnt im Zusammenhang vor einer fortgesetzten oder engeren Verbindung; „sich mit jemandem einlassen“ gibt dies in natürlichem modernem Deutsch wieder, ohne die Art der Beziehung unnötig festzulegen.
- source_word: פֶּן תִּלָּכֵד
  choice: damit du nicht … gefangen wirst
  rationale: פֶּן leitet eine unerwünschte mögliche Folge ein, und das passive תִּלָּכֵד bezeichnet das Gefangen- oder Verstricktwerden. Die Formulierung bewahrt das Bild des Fangens und klingt im Deutschen würdig und verständlich.
- source_word: בְּלִקְחֹתֶיהָ
  choice: durch ihre Verlockungen
  rationale: Der hebräische Ausdruck ist schwierig. Die griechische Parallele ἐν τοῖς ἐπιχειρήμασιν αὐτῆς weist auf ihre Unternehmungen, Anschläge oder Mittel hin. Im Kontext gibt „Verlockungen“ den wahrscheinlichen Sinn wieder, ohne die Unsicherheit im Haupttext schwerfällig auszubreiten.
theological_decisions:
- issue: Verhältnis des erhaltenen hebräischen Textes zur griechischen Parallele bei einem unsicheren Ausdruck
  choice: Der hebräische Text bleibt die Grundlage; die Schlusswendung wird mithilfe der griechischen Parallele als „durch ihre Verlockungen“ wiedergegeben.
  alternative: „durch ihre Machenschaften“ oder „in ihren Unternehmungen“
  rationale: Das Hebräische ist an dieser Stelle semantisch unsicher, während das Griechische einen Sinnbereich von Versuchen, Unternehmungen oder Machenschaften bezeugt. „Verlockungen“ passt zur Warnung des Verses, wird aber durch eine Fußnote als auslegungsbedürftige Wiedergabe kenntlich gemacht.
translation_notes:
  register: Modernes, klares Standarddeutsch mit würdigem Weisheitston. „Sich einlassen“ vermeidet archaische oder unnötig derbe Formulierungen; die Fußnote bewahrt die echte textliche und lexikalische Unsicherheit.
