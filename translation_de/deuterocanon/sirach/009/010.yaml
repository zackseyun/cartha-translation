base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/009/010.yaml
  text: Do not abandon an old friend, for a new one is not equal to him; a new friend is like new wine—when it grows old, you will drink it with gladness.
translation:
  language: de
  text: 'Verlass einen alten Freund nicht, denn ein neuer kommt ihm nicht gleich. Ein neuer Freund ist wie neuer Wein: Wenn er alt geworden ist, wirst du ihn mit Freude trinken.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die für diesen Vers angegebene hebräische Zeile gehört offenbar zu einem anderen Spruch und stimmt nicht mit Sirach 9,10 überein. Die Übersetzung folgt daher hier dem griechischen Textzeugen.
    reason: textual_variant
lexical_decisions:
- source_word: Μὴ ἐγκαταλίπης
  choice: Verlass ... nicht
  rationale: Gibt das Verbot einer relationalen Abkehr natürlich und würdig wieder.
- source_word: φίλον ἀρχαῖον
  choice: einen alten Freund
  rationale: ἀρχαῖον bezeichnet hier eine langjährige Freundschaft; der Ausdruck bewahrt zugleich den Gegensatz zum neuen Freund.
- source_word: πρόσφατος
  choice: ein neuer
  rationale: Im Gegensatz zu ἀρχαῖον und im anschließenden Weinbild ist „neu“ die klare und natürliche Wiedergabe.
- source_word: οὐκ ἔστιν ἔφισος αὐτῷ
  choice: kommt ihm nicht gleich
  rationale: Bewahrt den ausdrücklichen Vergleich und klingt im modernen Deutschen idiomatisch.
- source_word: οἶνος νέος φίλος νέος
  choice: Ein neuer Freund ist wie neuer Wein
  rationale: Die knappe griechische Gegenüberstellung wird als ausdrücklicher Vergleich wiedergegeben, ohne ihren sprichwortartigen Charakter zu verlieren.
- source_word: ἐὰν παλαιωθῇ
  choice: Ist er alt geworden
  rationale: Bewahrt die konditionale Form des Griechischen; das Pronomen bezieht sich im Bild auf den Wein.
- source_word: μετ’ εὐφροσύνης πίεσαι αὐτόν
  choice: wirst du ihn mit Freude trinken
  rationale: Gibt Futur, Pronomen und das Substantiv εὐφροσύνη eng und zugleich natürlich wieder.
theological_decisions:
- issue: Textgrundlage für Sirach 9,10
  choice: Übersetzung nach dem griechischen Zeugen
  alternative: Die gelieferte hebräische Zeile als Sirach 9,10 übersetzen
  rationale: Die angegebene hebräische Zeile handelt von der Schönheit einer Frau und gehört offenbar zu einem anderen Spruch. Der griechische Paralleltext bietet dagegen den zu Sirach 9,10 gehörenden Wortlaut. Die Abweichung wird transparent in einer Fußnote dokumentiert.
translation_notes:
  register: Modernes, allgemein verständliches und würdiges Standarddeutsch. Die Anrede bleibt in der vertraulichen Singularform des Weisheitsspruchs. Der Doppelpunkt verdeutlicht das anschließende Weinbild; die konditionale Spannung des griechischen ἐάν bleibt erhalten.
