translation:
  language: de
  text: Lass dich nicht mit Sängerinnen ein[a], sonst verbrennen sie dich mit ihren Mündern.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Griechisch: „Gib deine Seele nicht Prostituierten hin, damit du nicht dein Erbe verlierst.“ Der griechische Text spricht die sexuelle und sittliche Warnung ausdrücklich aus, während der hebräische Text von „Sängerinnen“ und davon redet, dass sie jemanden „mit ihren Mündern verbrennen“.'
    reason: alternative_reading
lexical_decisions:
- source_word: עִם מְנַגְּנוֹת
  choice: mit Sängerinnen
  rationale: עִם bezeichnet Gemeinschaft oder Umgang; מְנַגְּנוֹת ist ein feminines Partizip im Plural von נגן und meint Frauen, die musikalisch auftreten. „Sängerinnen“ bewahrt das konkrete hebräische Bild, ohne die im Griechischen ausdrücklich genannte Prostitution in den Haupttext einzutragen.
- source_word: אַל תִּדְמוֹךְ
  choice: Lass dich nicht … ein
  rationale: Das seltene beziehungsweise unsichere Verb bezeichnet hier offenbar enge persönliche Verbindung oder Umgang. Die deutsche Wendung ist natürlich und lässt sowohl soziale als auch intime Nähe anklingen, ohne die Mehrdeutigkeit vorschnell aufzulösen.
- source_word: פֶּן
  choice: damit … nicht
  rationale: Die Konjunktion leitet die befürchtete Folge ein. „Damit … nicht“ gibt die Warnung im heutigen Standarddeutsch klar wieder.
- source_word: יִשְׂרְפֻךָ
  choice: sie dich … verbrennen
  rationale: Die aktive Verbform mit femininem Pluralsubjekt wird direkt wiedergegeben; das drastische Bild des Verbrennens bleibt erhalten.
- source_word: בְּפִיפִיֹתָם
  choice: mit ihren Mündern
  rationale: Die ungewöhnliche konkrete Wendung bezieht sich auf die Münder der Frauen und bezeichnet wohl die zerstörerische Wirkung ihrer Worte oder ihres Gesangs. Die wörtliche Bildsprache bleibt bewusst stehen.
theological_decisions:
- issue: Abweichung zwischen hebräischem und griechischem Textzeugen
  choice: 'Der erhaltene hebräische Text bildet den Haupttext: Sängerinnen und das Verbrennen mit ihren Mündern.'
  alternative: „Gib deine Seele nicht Prostituierten hin, damit du nicht dein Erbe verlierst.“
  rationale: Wo Sirach auf Hebräisch erhalten ist, hat dieser Text Vorrang. Die griechische Fassung macht die sexuelle und sittliche Warnung ausdrücklich, unterscheidet sich aber in Wortlaut und Bild erheblich; deshalb wird sie nicht in den Haupttext eingemischt, sondern in einer Fußnote dokumentiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Lass dich nicht … ein“ ist allgemein verständlich und gibt die vermutlich enge, möglicherweise intime Verbindung wieder. Die fremdartige Wendung „mit ihren Mündern verbrennen“ bleibt erhalten, um die markante hebräische Metapher und ihre Deutungsoffenheit nicht abzuschwächen.
