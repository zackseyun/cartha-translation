  text: Do not dine with her husband[a], and do not sit drinking with him while drunk.
translation:
  language: de
  text: Iss nicht mit ihrem Mann[a], und setz dich nicht betrunken zu ihm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Parallelüberlieferung lautet: „Beneide nicht den Ruhm eines Sünders; denn du weißt nicht, wie sein Untergang sein wird.“ Der erhaltene hebräische Text weicht hier erheblich von der griechischen Überlieferung ab.'
    reason: alternative_reading
lexical_decisions:
- source_word: עִם בַּעְלָהּ
  choice: mit ihrem Mann
  rationale: עִם bezeichnet Gemeinschaft; בַּעְלָהּ meint in diesem Zusammenhang den Ehemann der zuvor vorausgesetzten Frau.
- source_word: אַל תִּטְעָם
  choice: Iss nicht
  rationale: טעם bedeutet wörtlich „kosten“, kann im Zusammenhang einer gemeinsamen Mahlzeit aber natürlich mit „essen“ wiedergegeben werden.
- source_word: וְאַל תָּסֵב
  choice: und setz dich nicht
  rationale: סב bezeichnet hier das Sichsetzen beziehungsweise Lagern bei Tisch. Die deutsche Formulierung bleibt natürlich, ohne eine ausdrücklich nicht belegte Handlung wie „trinken“ in das Verb einzutragen.
- source_word: עִמּוֹ
  choice: zu ihm
  rationale: Das Pronomen verweist auf den Ehemann zurück; „sich zu ihm setzen“ ist im Deutschen die natürliche Verbindung.
- source_word: שִׁכּוֹר
  choice: betrunken
  rationale: Das Wort bezeichnet einen betrunkenen Zustand. Die knappe Stellung im Hebräischen lässt syntaktischen Spielraum; die Wiedergabe bezieht es naheliegend auf das angesprochene Subjekt.
theological_decisions:
- issue: Starke Abweichung zwischen dem erhaltenen hebräischen Text und der griechischen Überlieferung
  choice: Der Haupttext folgt dem erhaltenen hebräischen Zeugen und gibt eine Warnung vor dem gemeinsamen Essen und betrunkenen Beisammensein mit dem Ehemann wieder.
  alternative: 'Die griechische Parallelüberlieferung lautet: „Beneide nicht den Ruhm eines Sünders; denn du weißt nicht, wie sein Untergang sein wird.“'
  rationale: Da für diese Stelle ein hoch bewerteter hebräischer Text vorliegt, erhält er Vorrang. Die erheblich abweichende griechische Fassung wird zur Wahrung der Überlieferungstransparenz in einer Fußnote dokumentiert.
- issue: Bezug von שִׁכּוֹר
  choice: '„betrunken“ wird auf die angesprochene Person bezogen: „setz dich nicht betrunken zu ihm“.'
  alternative: Das Wort könnte als Bezeichnung des Mannes oder freier als Hinweis auf ein Trinkgelage verstanden werden.
  rationale: Die unvermittelte Endstellung ist knapp und mehrdeutig. Die gewählte Fassung bildet den adjektivischen Zustand unmittelbar ab, ohne „trinken“ ausdrücklich in den Text einzufügen; die Mehrdeutigkeit wird nicht dogmatisch aufgeladen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper Weisheitsspruch-Syntax. „Iss“ ist alltäglicher und genauer als das gehobenere „speise“; „setz dich … zu ihm“ gibt die Tischgemeinschaft idiomatisch wieder.
