translation:
  language: de
  text: Neuer Wein, ein neuer Freund; wenn er alt geworden ist, wirst du ihn vielleicht trinken.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hebräische Wortlaut ist sprichwortartig, in seinem letzten Teil jedoch textlich schwierig. Die griechische Überlieferung bietet hier einen erheblich abweichenden Text: „Erkenne, dass du mitten durch Schlingen gehst und auf den Wehrmauern von Städten umhergehst.“ Die Übersetzung folgt dem erhaltenen hebräischen Zeugen.'
    reason: textual_variant
  - marker: b
    text: 'Wörtlicher etwa: „Neuer Wein, ein neuer Freund; und alt – danach vielleicht wirst du ihn trinken.“ Gemeint ist wohl, dass sich ein Freund wie Wein erst mit der Zeit bewährt; der hebräische Wortlaut spricht dies jedoch nicht ausdrücklich aus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַיִן חָדָשׁ
  choice: Neuer Wein
  rationale: Die direkte Wiedergabe bewahrt das Bild und den knappen Spruchstil.
- source_word: אוֹהֵב חָדָשׁ
  choice: ein neuer Freund
  rationale: Der überlieferte hebräische Wortlaut ist elliptisch. Die nominale Wiedergabe erhält die Parallele zwischen neuem Wein und einem neuen Freund, ohne ein zusätzliches Verb einzuführen.
- source_word: וְיָשָׁן
  choice: ist er alt geworden
  rationale: 'יָשָׁן bezeichnet hier das Alt- beziehungsweise Reifwerden. Die Formulierung lässt den Bezug des maskulinen Pronomens bewusst offen: Im Bild betrifft er den Wein, in der Anwendung den Freund.'
- source_word: אַחַר אוּלַי
  choice: vielleicht
  rationale: Die schwierige Folge enthält ausdrücklich ein Moment der Nachzeitigkeit und Unsicherheit. Die Nachzeitigkeit wird bereits durch „ist er alt geworden“ ausgedrückt; „vielleicht“ bewahrt אוּלַי, statt die Unsicherheit zu glätten.
- source_word: תִּשְׁתֶּינוּ
  choice: wirst du ihn trinken
  rationale: Das Verb bedeutet „trinken“; die überlieferte Endung ist schwierig. „ihn“ folgt dem grammatischen Geschlecht von „Wein“ und vermeidet den nicht ausdrücklich belegten Zusatz „mit Genuss“.
theological_decisions:
- issue: Textgrundlage bei starker Abweichung zwischen hebräischer und griechischer Überlieferung
  choice: Der erhaltene hebräische Spruch über neuen Wein und einen neuen Freund wird übersetzt.
  alternative: Die griechische Warnung vor Schlingen und dem Gehen auf Stadtmauern übersetzen.
  rationale: Da für Sirach ein hebräischer Zeuge vorliegt, hat er hier Vorrang. Die erhebliche Abweichung der griechischen Fassung wird in einer textkritischen Fußnote offengelegt.
- issue: Deutung des gereiften Weins als ausgereifte Freundschaft
  choice: Die Bildübertragung bleibt unausgesprochen und wird nicht als Zusatz in den Vers eingebaut.
  alternative: „Wenn die Freundschaft gereift ist, wirst du sie genießen“ oder „mit Freude trinken“.
  rationale: Der hebräische Spruch legt diese Anwendung nahe, formuliert sie aber nicht ausdrücklich. Die Übersetzung bewahrt daher Bild, Mehrdeutigkeit und Spannung.
translation_notes:
  register: Knapp, würdevoll und sprichwortartig. Die ungewöhnliche Satzfügung bildet die Ellipse des Hebräischen ab, bleibt aber in modernem Standarddeutsch verständlich. „Vielleicht“ bewahrt die Unsicherheit des überlieferten Textes; ein nicht ausdrücklich vorhandenes „mit Genuss“ wurde vermieden.
