translation_notes:
  register: Knappe, mahnende Weisheitssprache in modernem, würdigem Standarddeutsch. Die ungewöhnliche räumliche Wendung „bis an ein Netz“ bleibt bewusst erhalten, während „herangehst“ für einen natürlichen deutschen Satzfluss sorgt.
