translation:
  language: de
  text: 'Wisse: Du schreitest zwischen Fallen und gehst bis an ein Netz.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der erhaltene hebräische Text lautet: „Wisse: Du schreitest zwischen Fallen und gehst bis an ein Netz.“ Die griechische Überlieferung weicht an dieser Stelle erheblich ab: „Ein geschwätziger Mann ist in seiner Stadt gefürchtet, und wer in seiner Rede vorschnell ist, wird gehasst werden.“ Die Übersetzung folgt hier dem erhaltenen hebräischen Text als dem vorrangigen Zeugen.'
    reason: textual_variant
lexical_decisions:
- source_word: דַּע
  choice: Wisse
  rationale: Der Imperativ von ידע ist eine knappe, direkte Aufforderung; „Wisse“ bewahrt diese prägnante Form.
- source_word: בֵין פַּחִים
  choice: zwischen Fallen
  rationale: פח bezeichnet eine Falle oder Schlinge. „Zwischen Fallen“ gibt die räumliche Vorstellung des hebräischen בֵּין unmittelbar wieder.
- source_word: תִּצְעָד
  choice: du einherschreitest
  rationale: צעד bezeichnet das Schreiten oder Setzen von Schritten. „Einherschreitest“ erhält die bewusste Schrittbewegung und passt zum Bild eines gefährlichen Weges.
- source_word: וְעַד רֶשֶׁת
  choice: und bis an ein Netz
  rationale: עַד bezeichnet hier das Herankommen bis zu einem räumlichen Punkt. „Bis an ein Netz“ bewahrt die auffällige konkrete Formulierung, ohne bereits ein Gefangensein auszudrücken.
- source_word: תִּתְהַלָּךְ
  choice: herangehst
  rationale: Der Hitpael von הלך kann fortgesetzte Bewegung ausdrücken. Zusammen mit „bis an“ gibt „herangehst“ die Bewegung auf das Netz zu in natürlichem Deutsch wieder.
- source_word: רֶשֶׁת
  choice: Netz
  rationale: רשת bedeutet wörtlich „Netz“. Die Wiedergabe unterscheidet dieses Bild von den zuvor genannten Fallen.
