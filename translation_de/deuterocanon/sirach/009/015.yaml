    rationale: Das griechische στόχασαι bezeichnet eher Bedenken, Erwägen oder Beurteilen als bloßes Aufpassen oder Achtgeben. Eine entsprechendere deutsche Wiedergabe erhöht die Transparenz der Alternativlesart.
