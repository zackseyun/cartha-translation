lexical_decisions:
- source_word: אַל תְּקַנֵּא
  choice: Beneide nicht
  rationale: Das Verbot mit קנא bezeichnet hier den Neid auf einen anderen Menschen; „beneiden“ ist im Deutschen knapp und idiomatisch.
- source_word: בְּאִישׁ רָשָׁע
  choice: keinen gottlosen Mann
  rationale: אישׁ ist ausdrücklich Singular und maskulin. רָשָׁע bezeichnet im weisheitlichen Zusammenhang einen moralisch verwerflichen Menschen; „gottlos“ bewahrt den traditionellen ethisch-religiösen Bedeutungsumfang.
- source_word: כִּי לֹא תֵּדֵע
  choice: denn du weißt nicht
  rationale: כִּי begründet die Mahnung; „denn“ wahrt den sprichwortartigen, gehobenen Ton.
- source_word: מַה יּוֹמוֹ
  choice: wie sein Tag sein wird
  rationale: Wörtlich steht die knappe und mehrdeutige Wendung „was sein Tag [ist/sein wird]“. Die deutsche Formulierung erhält das Bild des Tages, ohne ausdrücklich „bringen“ oder „Ende“ einzutragen.
theological_decisions:
- issue: Abweichung zwischen hebräischem und griechischem Textzeugen
  choice: Der erhaltene hebräische Text wird als Haupttext übersetzt; die erheblich abweichende griechische Fassung erscheint in einer Fußnote.
  alternative: „Soweit deine Kraft reicht, achte auf deine Nächsten, und berate dich mit den Weisen.“
  rationale: Wo der hebräische Sirachtext erhalten ist, bildet er die primäre Grundlage. Die griechische Fassung bietet hier keine enge Entsprechung, sondern einen anderen Spruch; diese textgeschichtliche Spannung darf nicht stillschweigend beseitigt werden.
- issue: Mehrdeutigkeit von מַה יּוֹמוֹ
  choice: „wie sein Tag sein wird“
  alternative: „was sein Tag bringen wird“ oder „wie sein Ende sein wird“
  rationale: Der hebräische Text nennt weder ausdrücklich ein „Bringen“ noch das „Ende“. Die gewählte Fassung bewahrt seine eigentümliche Offenheit.
translation_notes:
  register: Moderne, würdige Standardsprache mit knapper weisheitlicher Satzform. Die ungewöhnliche Schlusswendung bleibt bewusst etwas offen, um die Mehrdeutigkeit des Hebräischen nicht aufzulösen.
