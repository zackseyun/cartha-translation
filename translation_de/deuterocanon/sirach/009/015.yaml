translation:
  language: de
  text: Beneide keinen bösen Mann[a], denn du weißt nicht, wie sein Tag sein wird.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Textzeuge bietet hier einen anderen Spruch: „Nach deinem Vermögen bedenke deine Nächsten und berate dich mit Weisen.“'
