translation:
  language: de
  text: Und wenn du dich näherst, lade keine Schuld auf dich, sonst verlierst du dein Leben.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Überlieferung bietet hier einen ganz anderen Spruch: „In der Hand von Handwerkern wird ein Werk gelobt, und der Herrscher eines Volkes ist weise in seiner Rede.“'
    reason: alternative_reading
lexical_decisions:
- source_word: וְאִם קָרַבְתָּ
  choice: Und wenn du dich näherst
  rationale: Die hebräische Bedingungswendung und das Verb קרב werden unmittelbar und in natürlichem modernem Deutsch wiedergegeben.
- source_word: לֹא תֶאְשָׁם
  choice: mach dich nicht schuldig
  rationale: Das negative Imperfekt kann hier als Warnung beziehungsweise Verbot verstanden werden. Die Formulierung bewahrt den Gedanken des Schuldauf-sich-Ladens, ohne ihn auf eine bestimmte Art von Vergehen einzuengen.
- source_word: פֶּן תִּקַּח אֶת נִשְׁמָתֶךָ
  choice: damit du nicht dein Leben verlierst
  rationale: נשמה bezeichnet hier das Leben. Die wörtlich schwierige Wendung mit לקח wird als drohender Verlust des Lebens wiedergegeben; dadurch bleibt die Warnung verständlich, ohne eine im isolierten hebräischen Satz nicht eindeutig erkennbare handelnde Person einzuführen.
theological_decisions:
- issue: Starke Abweichung zwischen dem erhaltenen hebräischen Text und der griechischen Überlieferung
  choice: Der hoch eingestufte erhaltene hebräische Text steht im Haupttext; die völlig abweichende griechische Lesart wird in einer Fußnote vollständig dokumentiert.
  alternative: 'Nach dem Griechischen übersetzen: „In der Hand von Handwerkern wird ein Werk gelobt, und der Herrscher eines Volkes ist weise in seiner Rede.“'
  rationale: Die Übersetzung folgt vorrangig dem vorgelegten originalsprachlichen hebräischen Zeugnis. Da die griechische Fassung keinen bloßen Wortlautunterschied, sondern einen anderen Spruch bietet, wird die Spannung zwischen den Überlieferungen nicht harmonisiert oder verschwiegen.
translation_notes:
  register: Natürliches, würdiges Standarddeutsch in knapper sprichwortartiger Form. Die Anrede bleibt in der zweiten Person Singular. Der Fußnotenmarker [a] steht im Haupttext.
