  terminology: „Schuld“ und „Leben“ sind sachgerecht. Die Fußnote dokumentiert die griechische Lesart vollständig und klar. „Herrscher eines Volkes“ sowie „weise in seiner Rede“ sind für den griechischen Alternativtext angemessen.
