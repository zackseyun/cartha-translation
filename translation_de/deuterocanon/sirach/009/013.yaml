  text: Keep far away from a man who has authority to kill, and you will not have to fear death.[a]
translation:
  language: de
  text: Halte dich fern von einem Menschen, der die Macht hat zu töten, dann musst du den Tod nicht fürchten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der erhaltene hebräische Text bietet an dieser Stelle einen anderen Spruch: „Verlass keinen alten Freund, denn ein neuer kommt ihm nicht gleich.“ Die griechische Überlieferung enthält dagegen die Warnung im Haupttext.'
    reason: alternative_reading
lexical_decisions:
- source_word: μακρὰν ἄπεχε
  choice: Halte dich fern
  rationale: Der griechische Imperativ fordert zu bewusster Distanz auf; die deutsche Wendung ist natürlich und bewahrt seine Kraft.
- source_word: ἀπὸ ἀνθρώπου
  choice: von einem Menschen
  rationale: ἄνθρωπος bezeichnet hier eine einzelne Person. „Mensch“ ist im modernen Deutsch idiomatisch und legt das Geschlecht nicht stärker fest als das griechische Wort.
- source_word: ὃς ἔχει ἐξουσίαν
  choice: der die Macht hat
  rationale: ἐξουσία kann sowohl Macht als auch Autorität bezeichnen. „Macht“ wahrt die Offenheit zwischen amtlicher Befugnis und tatsächlicher Verfügungsgewalt.
- source_word: τοῦ φονεῦσαι
  choice: zu töten
  rationale: Die Wendung bezeichnet die Macht, Leben zu nehmen. „Töten“ ist weiter und quellennäher als „ermorden“ oder „hinrichten“.
- source_word: καὶ οὐ μὴ ὑποπτεύσῃς φόβον θανάτου
  choice: dann musst du den Tod nicht fürchten
  rationale: ὑποπτεύω kann Besorgnis oder argwöhnische Erwartung ausdrücken; zusammen mit φόβον θανάτου ergibt sich eine eindringliche Aussage über die Furcht vor dem Tod. „Dann“ gibt den folgernden Zusammenhang natürlich wieder.
theological_decisions:
- issue: Starke Abweichung zwischen dem erhaltenen hebräischen Text und der griechischen Überlieferung
  choice: Die griechische Lesart steht im Haupttext.
  alternative: „Verlass keinen alten Freund, denn ein neuer kommt ihm nicht gleich.“
  rationale: Die beiden Überlieferungen bieten verschiedene Sprüche. Entsprechend der vorgegebenen Textentscheidung wird die griechische Fassung für diesen Vers übersetzt; die gut bezeugte abweichende hebräische Fassung wird zur Transparenz vollständig in der Fußnote wiedergegeben.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Hauptsatz ist knapp und warnend formuliert; die Fußnote macht die erhebliche textgeschichtliche Abweichung offen kenntlich.
