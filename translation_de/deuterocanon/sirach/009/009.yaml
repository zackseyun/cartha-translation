  text: Turn your eyes away from a graceful woman[a], and do not gaze at beauty that is not yours.
translation:
  language: de
  text: Wende deinen Blick von einer anmutigen Frau ab[a], und schau nicht auf Schönheit, die nicht für dich ist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Parallelfassung lautet ausführlicher: „Setz dich überhaupt nicht zu der Frau eines anderen Mannes, und trink nicht mit ihr Wein, damit sich deine Seele nicht zu ihr hinwendet und du in deinem Inneren ins Verderben gleitest.“ Der hebräische Text ist hier kürzer und allgemeiner.'
    reason: alternative_reading
lexical_decisions:
- source_word: הַעֲלִים עַיִן
  choice: Wende deinen Blick … ab
  rationale: Die Wendung bedeutet wörtlich etwa „das Auge verbergen“, ist hier aber idiomatisch als Aufforderung zu verstehen, den Blick abzuwenden. Die deutsche Formulierung ist natürlich und bewahrt den mahnenden Imperativ.
- source_word: אֵשֶׁת חֵן
  choice: eine anmutige Frau
  rationale: חֵן bezeichnet Anmut, Liebreiz oder Charme. „Anmutig“ hält diesen Aspekt von der im zweiten Satzglied ausdrücklich genannten körperlichen Schönheit auseinander.
- source_word: תַּבִּיט
  choice: schau
  rationale: Das Verb bezeichnet ein bewusstes Hinschauen. Zusammen mit dem Kontext und der Präposition אֶל drückt „schau nicht auf“ das begehrliche oder anhaltende Betrachten natürlich aus, ohne die Verbintensität unnötig zu steigern.
- source_word: יֹפִי
  choice: Schönheit
  rationale: „Schönheit“ ist die direkte und im Deutschen natürliche Entsprechung und bewahrt den Bezug auf sichtbare Attraktivität.
- source_word: לֹא לָךְ
  choice: die nicht für dich bestimmt ist
  rationale: Die knappe hebräische Wendung lautet wörtlich „nicht für dich“. Diese Wiedergabe bewahrt ihre mögliche Bedeutung als moralische Grenze, ohne die Frau als Besitz darzustellen oder die breitere hebräische Aussage ausdrücklich auf die Ehefrau eines anderen Mannes einzuengen.
theological_decisions:
- issue: Verhältnis des kurzen hebräischen Wortlauts zur ausführlicheren griechischen Parallelüberlieferung
  choice: Der Haupttext folgt dem erhaltenen Hebräisch; die griechische Fassung wird in einer Fußnote dokumentiert.
  alternative: Den ausführlichen griechischen Text über das Zusammensitzen und Weintrinken mit der Ehefrau eines anderen Mannes als Haupttext wiedergeben.
  rationale: Da ein zuverlässiger hebräischer Wortlaut vorliegt, hat er für den Haupttext Vorrang. Die griechische Parallelfassung konkretisiert die Warnung anders und erheblich ausführlicher; diese echte textliche Differenz darf weder in den hebräischen Haupttext eingetragen noch verschwiegen werden.
- issue: Bedeutung von לֹא לָךְ
  choice: „nicht für dich bestimmt“
  alternative: „die dir nicht gehört“
  rationale: Das Hebräische lässt eine knappe Zuordnungs- oder Grenzaussage stehen. „Nicht für dich bestimmt“ erhält die moralische Spannung, vermeidet jedoch eine unnötig besitzrechtliche Aussage über eine Frau.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit direkter Mahnrede. „Anmutig“ bewahrt den Unterschied zwischen חֵן (Anmut, Liebreiz) und יֹפִי (Schönheit). Die Formulierung bleibt verständlich, ohne die Eigenart des knappen hebräischen Textes durch die ausführlichere griechische Lesart zu ersetzen.
