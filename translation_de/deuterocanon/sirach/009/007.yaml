translation:
  language: de
  text: Blicke eine Jungfrau nicht aufmerksam an, damit du nicht in ihre Strafen[b] verstrickt wirst.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Text lautet: „Blicke nicht in den Straßen einer Stadt umher, und streife nicht an ihren menschenleeren Orten umher.“ Die erhaltenen hebräischen und griechischen Textzeugen unterscheiden sich hier erheblich.'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlich: „damit du nicht in ihren Strafen gefangen wirst“. Die knappe hebräische Wendung kann Strafen oder Folgen meinen, die mit einer Verbindung zu ihr verbunden sind.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּבְתוּלָה
  choice: eine Jungfrau
  rationale: בְּתוּלָה bezeichnet gewöhnlich eine Jungfrau beziehungsweise eine junge unverheiratete Frau. „Jungfrau“ bewahrt die lexikalische Bestimmtheit des Hebräischen.
- source_word: אַל תִּתְבּוֹנֵן
  choice: Schau … nicht aufmerksam an
  rationale: Die Hitpael-Form bezeichnet ein aufmerksames, prüfendes oder anhaltendes Betrachten, nicht bloß einen flüchtigen Blick. Die Formulierung ist im modernen Deutschen natürlich und wahrt diese Nuance.
- source_word: פֶּן
  choice: damit … nicht
  rationale: Die Partikel leitet die befürchtete mögliche Folge der Warnung ein. „Damit … nicht“ gibt diesen Sinn im heutigen Deutsch klar wieder.
- source_word: תִּוָּקֵש
  choice: in eine Falle gerätst
  rationale: Das Verb enthält hier wahrscheinlich die Vorstellung, gefangen oder verstrickt zu werden. Die Wendung bewahrt das Fallenmotiv in natürlichem Deutsch, ohne die genaue Art der Folge näher festzulegen.
- source_word: בַּעֲנָשֶׁיהָ
  choice: durch die Strafen, die mit ihr verbunden sind
  rationale: עֹנֶשׁ bedeutet Strafe oder Strafandrohung. Der Bezug des femininen Suffixes ist im knappen Hebräisch mehrdeutig; die Übersetzung lässt offen, ob es um Strafen wegen einer Verbindung mit ihr oder allgemeiner um sie betreffende Folgen geht.
- source_word: μὴ περιβλέπου ἐν ῥύμαις πόλεως, καὶ ἐν ταῖς ἐρήμοις αὐτῆς μὴ πλανῶ
  choice: nur als abweichende Parallelüberlieferung berücksichtigt
  rationale: Der griechische Text warnt vor dem Umherblicken in den Straßen einer Stadt und dem Umherstreifen an ihren menschenleeren Orten. Da ein gut bezeugter hebräischer Text vorliegt, bestimmt dieser den Haupttext; die erhebliche griechische Abweichung wird in einer Fußnote dokumentiert.
theological_decisions:
- issue: Erhebliche Abweichung zwischen hebräischer und griechischer Überlieferung
  choice: Der erhaltene hebräische Wortlaut steht im Haupttext; die griechische Lesart erscheint in einer Fußnote.
  alternative: Die griechische Warnung vor Stadtstraßen als Haupttext übersetzen oder beide Fassungen zu einer allgemeinen Versuchungswarnung verbinden.
  rationale: Der hebräische Zeuge ist hier mit hoher Sicherheit erhalten. Eine Vermischung würde zwei materiell verschiedene Lesarten harmonisieren und die textliche Spannung verdecken.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Schau … aufmerksam an“ vermeidet das altertümliche „Betrachte“ und macht zugleich deutlich, dass ein anhaltendes oder absichtsvolles Hinsehen gemeint ist. Die Umschreibung bei בַּעֲנָשֶׁיהָ wahrt die Mehrdeutigkeit, klingt jedoch bewusst etwas erklärend.
