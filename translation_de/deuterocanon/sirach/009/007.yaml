  source_fidelity: 'Der Haupttext folgt dem erhaltenen hebräischen Wortlaut: Verbot des anhaltenden Betrachtens einer Jungfrau und Warnung vor dem Verstricktwerden „in ihren Strafen“. Die griechische, deutlich abweichende Fassung wird zutreffend als Variantenlesart belegt. Die bisherige Verbindung „durch die Strafen ... in eine Falle“ verschiebt jedoch die hebräische Präposition und fügt zwei unterschiedliche Bilder zu einer erklärenden Formulierung zusammen.'
  naturalness: „Schau eine Jungfrau nicht aufmerksam an“ ist verständlich, aber „Blicke ... nicht aufmerksam an“ ist im würdevollen modernen Standarddeutsch etwas glatter. „In ihre Strafen verstrickt wirst“ ist idiomatisch und präziser als „durch ... in eine Falle gerätst“.
  terminology: „Jungfrau“ gibt בְּתוּלָה angemessen wieder. „Strafen“ für עֳנָשִׁים ist sachgerecht. Das Possessivpronomen „ihre“ bewahrt die im Hebräischen vorhandene knappe und nicht weiter bestimmte Zuordnung; die Fußnote erläutert sie, ohne sie im Haupttext festzulegen.
