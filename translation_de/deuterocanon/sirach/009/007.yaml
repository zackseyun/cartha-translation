revisions:
- from: Schau eine Jungfrau nicht aufmerksam an, damit du nicht durch die Strafen, die mit ihr verbunden sind, in eine Falle gerätst.[a][b]
  to: Blicke eine Jungfrau nicht aufmerksam an, damit du nicht in ihre Strafen[b] verstrickt wirst.[a]
  rationale: Die Revision beseitigt die im Deutschen hinzugefügte Kombination von instrumentaler Strafe und Fallenbild. Sie gibt die passive Verstrickungs-/Fangvorstellung von תִּוָּקֵש sowie die knappe Verbindung „in ihre Strafen“ enger wieder, ohne die strittige genaue Beziehung des Suffixes auszuinterpretieren. Die abweichende griechische Überlieferung bleibt vollständig in der Fußnote dokumentiert.
