translation:
  language: de
  text: Gib deine Seele nicht einer Frau hin, sodass sie auf deinen Höhen schreitet.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Deine Höhen“ kann bildlich die eigene Stellung, Würde oder Stärke bezeichnen.
    reason: lexical_alternative
  - marker: b
    text: 'Die griechische Fassung lautet sinngemäß: „Gib deine Seele nicht einer Frau, damit sie auf deine Stärke tritt.“ Sie deutet das hebräische Bild als Warnung davor, die eigene Kraft oder Stellung preiszugeben.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תַּקְנֶא
  choice: Gib … nicht hin
  rationale: Die überlieferte hebräische Form ist schwierig. Die griechische Parallele μὴ δῷς („gib nicht“) stützt deutlich den Sinn einer Warnung davor, sich selbst auszuliefern. „Hingeben“ gibt diesen Sinn natürlich wieder, ohne ihn bereits zu „unterwerfen“ oder „beherrschen“ auszudeuten.
- source_word: נַפְשְׁךָ
  choice: deine Seele
  rationale: נפש kann die Seele, das Leben oder die ganze Person bezeichnen. „Deine Seele“ bewahrt das konkrete Bild des Hebräischen und entspricht zugleich dem griechischen ψυχή.
- source_word: לְאִשָּׁה
  choice: einer Frau
  rationale: אשה kann je nach Zusammenhang „Frau“ oder „Ehefrau“ bedeuten. Da kein Besitzverhältnis ausdrücklich markiert ist, wahrt „einer Frau“ die größere Bedeutungsbreite.
- source_word: לְהַדְרִיכָהּ
  choice: sodass sie … schreitet
  rationale: Die Form bezeichnet hier ein Treten beziehungsweise Schreitenlassen; das griechische ἐπιβῆναι bestätigt das Bild des Betretens oder Besteigens. „Sodass“ gibt die drohende Folge idiomatischer wieder als eine deutsche Zweckkonstruktion, die eine beabsichtigte Handlung nahelegen könnte.
- source_word: עַל בָּמוֹתֶיךָ
  choice: über deine Höhen
  rationale: במותיך bedeutet wörtlich „deine Höhen/Anhöhen“. Die bildhafte Wendung bleibt im Haupttext erhalten; ihre mögliche Bedeutung als Stellung, Würde oder Stärke wird in den Fußnoten erläutert.
theological_decisions:
- issue: Ob das Bild zu einer ausdrücklichen Aussage über Herrschaft oder Unterwerfung geglättet werden soll
  choice: Die konkreten Bilder „Seele hingeben“ und „über deine Höhen schreiten“ bleiben erhalten.
  alternative: Liefere dich keiner Frau aus, damit sie keine Macht über dich gewinnt.
  rationale: Der Weisheitsspruch warnt vor dem Verlust der eigenen Stellung oder Kraft, formuliert dies aber bildhaft. Eine ausdrückliche Rede von Herrschaft würde die mögliche Aussage stärker festlegen, als es der hebräische Text erlaubt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnliche Bildsprache des hebräischen Textes wird bewusst bewahrt; „sodass“ macht den Folgesinn verständlich, ohne das Bild durch eine abstrakte Aussage über Kontrolle zu ersetzen.
