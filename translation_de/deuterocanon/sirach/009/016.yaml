translation:
  language: de
  text: Berate dich mit verständigen Menschen, und all dein Reden richte sich nach dem Gesetz des Höchsten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der erhaltene hebräische Text aus der Kairoer Geniza lautet an dieser Stelle stattdessen: „Beneide keinen überheblichen Menschen, der Erfolg hat; denk daran, dass er bis zum Tod nicht ungestraft bleiben wird.“ Diese hebräische Lesart scheint eine abweichende oder versetzte Zeile zu bewahren; deshalb folgt der Haupttext hier der griechischen Überlieferung.'
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ μετὰ συνετῶν
  choice: mit verständigen Menschen
  rationale: συνετοί bezeichnet einsichtige, urteilsfähige Menschen. Die Formulierung ist geschlechtsübergreifend, natürlich und vermeidet eine unnötige Einengung auf „weise Männer“.
- source_word: ἔστω ὁ διαλογισμός σου
  choice: Berate dich
  rationale: διαλογισμός kann Überlegung, Erwägung oder Beratung bezeichnen. Zusammen mit μετὰ („mit“) gibt „Berate dich“ den Gedanken einer Überlegung im Austausch mit Verständigen idiomatisch wieder und bewahrt den auffordernden Sinn von ἔστω.
- source_word: πᾶσα διήγησίς σου
  choice: all dein Reden
  rationale: διήγησις umfasst Rede, Darlegung oder Gespräch. „All dein Reden“ ist breit genug, um die verschiedenen Bedeutungsanteile abzudecken, und klingt im Deutschen würdig und verständlich.
- source_word: ἐν νόμῳ Ὑψίστου
  choice: nach dem Gesetz des Höchsten
  rationale: Das griechische ἐν kann hier den bestimmenden Rahmen bezeichnen. „Nach dem Gesetz“ macht natürlich verständlich, dass das Reden von Gottes Weisung geprägt sein soll; „der Höchste“ bewahrt den göttlichen Titel Ὕψιστος.
theological_decisions:
- issue: Auswahl der Hauptlesart bei voneinander abweichendem hebräischem und griechischem Textzeugen
  choice: Die griechische Zeile steht im Haupttext; die stark abweichende erhaltene hebräische Zeile wird in einer Fußnote vollständig dokumentiert.
  alternative: 'Den erhaltenen hebräischen Text als Haupttext wiedergeben: „Beneide keinen überheblichen Menschen, der Erfolg hat; denk daran, dass er bis zum Tod nicht ungestraft bleiben wird.“'
  rationale: Der vorgelegte hebräische Geniza-Text ist als erhebliche Abweichung gekennzeichnet und entspricht inhaltlich nicht der unter Sirach 9,16 überlieferten griechischen Zeile; möglicherweise liegt eine versetzte oder eigenständige Lesart vor. Die griechische Überlieferung bietet hier den zusammenhängenden Versbezug. Die hebräische Lesart bleibt durch die Fußnote transparent erhalten, ohne die Textunsicherheit zu verschweigen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Berate dich“ vermeidet die im Deutschen schwerfällige wörtliche Form „Deine Überlegung sei mit …“, während „all dein Reden“ den umfassenden Weisheitsspruch knapp bewahrt.
