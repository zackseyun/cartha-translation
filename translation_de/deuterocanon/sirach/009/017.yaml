translation:
  language: de
  text: Halte dich fern von einem Mann, der die Macht hat zu töten[a], und fürchte dich nicht vor den Schrecken des Todes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Textzeuge bietet hier einen wesentlich anderen Spruch: „Rechtschaffene Männer sollen deine Tischgenossen sein, und dein Ruhm soll in der Furcht des Herrn bestehen.“ Der Haupttext folgt dem für diesen Vers erhaltenen hebräischen Text.'
    reason: textual_variant
lexical_decisions:
- source_word: רְחַק
  choice: Halte dich fern
  rationale: Der Imperativ von רחק fordert zu bewusster Distanz auf. „Halte dich fern“ ist im modernen Deutsch natürlich und bewahrt den nachdrücklichen Befehlscharakter.
- source_word: מֵאִישׁ
  choice: von einem Mann
  rationale: אישׁ steht im maskulinen Singular. Die konkrete Form „Mann“ wird beibehalten, statt sie ohne textlichen Anlass zu verallgemeinern.
- source_word: שַׁלִּיט
  choice: der die Macht hat
  rationale: שַׁלִּיט bezeichnet jemanden, der Macht oder Verfügungsgewalt besitzt. Hier liegt der Akzent durch den folgenden Infinitiv auf der tatsächlichen Macht zu töten, nicht zwingend auf einem bestimmten Amtstitel.
- source_word: לַהֲרוֹג
  choice: zu töten
  rationale: Der Infinitiv bezeichnet unmittelbar das Töten. „Zu töten“ bleibt direkt und vermeidet die zusätzliche rechtlich-gerichtliche Nuance von „hinzurichten“.
- source_word: וְאַל תִּפְחַד
  choice: und fürchte dich nicht
  rationale: Die negative Aufforderung wird knapp, idiomatisch und in würdigem Register wiedergegeben.
- source_word: פַּחֲדֵי מַוֶת
  choice: vor den Schrecken des Todes
  rationale: Die pluralische Genitivverbindung meint wörtlich die Ängste oder Schrecken des Todes. „Die Schrecken des Todes“ bewahrt sowohl den Plural als auch die Intensität.
theological_decisions:
- issue: Erhebliche Abweichung zwischen dem hebräischen und dem griechischen Textzeugen
  choice: Der Haupttext folgt dem erhaltenen hebräischen Text; die abweichende griechische Fassung wird in einer Fußnote dokumentiert.
  alternative: 'Griechisch: „Rechtschaffene Männer sollen deine Tischgenossen sein, und dein Ruhm soll in der Furcht des Herrn bestehen.“'
  rationale: Da für diesen Vers ein hebräischer Text erhalten ist, bildet er die Grundlage der Übersetzung. Die griechische Fassung bietet keinen bloßen Wortlautunterschied, sondern einen wesentlich anderen Weisheitsspruch; deshalb darf die Spannung zwischen den Textzeugen nicht harmonisiert oder verschwiegen werden.
translation_notes:
  register: Modernes, verständliches Standarddeutsch in knapper, würdevoller Weisheitssprache. Die parallele Satzstruktur und die direkte Warnung des Hebräischen bleiben erhalten.
