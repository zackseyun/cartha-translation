  terminology: „Grube“ ist für שחת passend und wahrt die mögliche Assoziation von Grab, Tod und Verderben. Die Fußnote zur stark abweichenden griechischen Überlieferung ist sachlich erforderlich; „nicht gerechtfertigt werden“ gibt δικαιωθῶσιν korrekt wieder, klingt im Deutschen jedoch in dieser Kontextnotiz etwas fachsprachlich. „Keine Rechtfertigung finden“ ist natürlicher, ohne den Begriff zu verschieben.
