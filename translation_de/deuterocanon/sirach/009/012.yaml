translation:
  language: de
  text: Damit sich dein Herz ihr nicht zuneigt und du dich im Blut zur Grube neigst.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Überlieferung bietet hier einen deutlich anderen Text: „Habe kein Gefallen am Wohlergehen der Gottlosen; denk daran, dass sie bis zum Totenreich keine Rechtfertigung finden.“'
    reason: Dokumentiert die erhebliche textgeschichtliche Abweichung des griechischen Paralleltextes, ohne ihn mit dem hebräischen Haupttext zu harmonisieren. Die leicht idiomatischere deutsche Formulierung wahrt den Sinn von δικαιωθῶσιν.
lexical_decisions:
- source_word: אֵלֶיהָ
  choice: ihr
  rationale: Das hebräische Suffix ist feminin Singular. Daher folgt die Übersetzung dem sicher bezeugten hebräischen Wortlaut und nicht der englischen Wiedergabe „them“.
- source_word: וּבְדָמִים
  choice: und durch Blutschuld
  rationale: Der Plural דָּמִים bezeichnet häufig vergossenes Blut beziehungsweise die daraus erwachsende Blutschuld. „Durch Blutschuld“ gibt den ethisch-folgenschweren Sinn knapp wieder.
- source_word: שָׁחַת
  choice: der Grube
  rationale: שַׁחַת bezeichnet die Grube und kann zugleich Tod oder Verderben anklingen lassen. Die konkrete Bildsprache bleibt erhalten.
- source_word: תַּטֶּה … תִּטֶּה
  choice: zuneigst … zuwendest
  rationale: Die wiederholte Wurzel נטה bezeichnet ein Sich-Neigen oder Sich-Wenden. Die leicht variierte deutsche Formulierung klingt natürlich, ohne die inhaltliche Wiederholung aufzugeben.
theological_decisions:
- issue: Verhältnis des hebräischen Textes zur stark abweichenden griechischen Überlieferung
  choice: Der hebräische Wortlaut bildet den Haupttext; die griechische Fassung wird in einer Fußnote dokumentiert.
  alternative: Den inhaltlich völlig anderen griechischen Text als Haupttext wiedergeben.
  rationale: Der angegebene hebräische Quellentext ist mit hoher Zuverlässigkeit bezeugt und soll vorrangig übersetzt werden. Die erhebliche Textdifferenz darf jedoch nicht verschwiegen oder harmonisiert werden.
- issue: Bedeutung von שחת
  choice: „Grube“ mit offener Todes- und Verderbensmetaphorik
  alternative: „Verderben“ oder „Totenreich“
  rationale: „Grube“ bewahrt das konkrete Bild und legt nicht abschließend fest, ob Grab, Tod oder allgemeines Verderben gemeint ist.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Warnform פן wird als abhängiges „Damit du nicht …“ wiedergegeben, da der Vers offenbar an den vorausgehenden Zusammenhang anschließt. Das feminine Singularpronomen und die doppelte Bewegungsmetapher des Hebräischen bleiben sichtbar.
