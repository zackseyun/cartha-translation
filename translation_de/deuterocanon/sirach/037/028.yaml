translation:
  language: de
  text: Und es gibt einen Weisen, der sein Volk weise macht; die Frucht seiner Erkenntnis ist in ihren Körpern.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Text weicht hier erheblich ab: „Denn nicht alles ist allen zuträglich, und nicht jeder findet an allem Gefallen.“ Der erhaltene hebräische Text lautet wörtlich etwa: „Und es gibt einen Weisen, der sein Volk weise macht; die Frucht seiner Erkenntnis ist in ihren Körpern.“'
    reason: textual_variant
lexical_decisions:
- source_word: וְיֵשׁ חָכָם
  choice: Und es gibt einen Weisen
  rationale: Gibt die hebräische Existenzwendung und die Bezeichnung חָכָם unmittelbar und in natürlichem Deutsch wieder.
- source_word: לְעַמּוֹ יֶחְכָּם
  choice: der sein Volk weise macht
  rationale: 'Die Verbform wird kausativ verstanden: Der Weise vermittelt seinem Volk Weisheit. Diese Deutung ergibt mit לְעַמּוֹ einen verständlichen deutschen Satz, ohne die Aussage auf bloße persönliche Klugheit zu verengen.'
- source_word: פְּרִי דַעְתּוֹ
  choice: die Frucht seiner Erkenntnis
  rationale: Bewahrt das konkrete hebräische Bild von der Frucht als Wirkung oder Ergebnis seiner Erkenntnis.
- source_word: בִּגְוִיָתָם
  choice: ist in ihrem Leib
  rationale: גְּוִיָּה bezeichnet den Leib bzw. Körper. Das hebräische Suffix verweist auf das Volk als Gemeinschaft; der deutsche Kollektivsingular bewahrt diese Spannung besser als eine freie Umschreibung wie „zeigt sich an ihnen“.
theological_decisions:
- issue: Abweichung zwischen hebräischem und griechischem Textzeugen
  choice: Der Haupttext folgt dem angegebenen hebräischen Text.
  alternative: 'Der griechische Paralleltext: „Denn nicht alles ist für alle zuträglich, und nicht jeder Mensch hat an allem Gefallen.“'
  rationale: Der hebräische Text ist als Originalsprachenquelle mit hoher Zuverlässigkeit angegeben und bildet eine in sich deutbare Aussage. Die erheblich abweichende griechische Überlieferung wird nicht harmonisiert, sondern in der Fußnote vollständig kenntlich gemacht.
- issue: Bezug von „ihrem Leib“
  choice: Die kollektive Ausdrucksweise des Hebräischen bleibt stehen.
  alternative: „in ihren Leibern“ oder deutend „zeigt sich an ihnen“
  rationale: Das Bild kann die verkörperte Wirkung der Erkenntnis im Volk bezeichnen, bleibt aber im Hebräischen ungewöhnlich. Eine erklärende Glättung würde die echte textliche Schwierigkeit verdecken.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das Frucht- und Leibbild des Hebräischen bleibt bewusst erhalten; die stark abweichende griechische Lesart wird transparent in der Fußnote dokumentiert.
