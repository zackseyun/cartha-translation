  text: Do not forget a friend in your heart[b][a], and do not neglect him when you have wealth.
translation:
  language: de
  text: Vergiss einen Freund nicht im Kampf, und verlass ihn nicht, wenn du Beute machst.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das Hebräische kann bei בקרב auch „in deiner Mitte“ verstanden werden. Die griechische Überlieferung liest dagegen: „in deiner Seele.“'
    reason: textual_variant
  - marker: b
    text: 'Die zweite hebräische Zeile ist in ihrer überlieferten Form schwierig. Die griechische Überlieferung lautet: „Sei seiner bei deinem Besitz eingedenk.“'
    reason: textual_variant
lexical_decisions:
- source_word: אל תשכח / μὴ ἐπιλάθῃ
  choice: Vergiss … nicht
  rationale: Die verneinte Aufforderung ist im Hebräischen und in der griechischen Parallele eindeutig; die gewählte Formulierung ist natürliches, modernes Deutsch.
- source_word: חבר / φίλου
  choice: einen Freund
  rationale: Beide Ausdrücke bezeichnen hier einen Freund oder Gefährten; „Freund“ passt am besten zum persönlichen und ethischen Zusammenhang.
- source_word: בקרב / ἐν τῇ ψυχῇ σου
  choice: in deinem Herzen
  rationale: Die griechische Parallele hat ausdrücklich „in deiner Seele“. „In deinem Herzen“ gibt den innerlichen Sinn idiomatisch wieder. Das unvokalisierte Hebräisch בקרב lässt daneben eine Lesart „im Kampf“ zu; diese bedeutende Abweichung wird in einer Fußnote bewahrt.
- source_word: ואל תעזבהן / καὶ μὴ ἀμνημονήσῃς αὐτοῦ
  choice: und denke … an ihn
  rationale: Der überlieferte hebräische Ausdruck ist formal schwierig, während das Griechische wörtlich dazu auffordert, den Freund nicht aus dem Sinn zu verlieren. Die positive deutsche Wendung mit „auch“ vermeidet eine schwerfällige Wiederholung von „vergiss nicht“, ohne den Sinn zu verändern.
- source_word: בשללך / ἐν χρήμασίν σου
  choice: bei deinem Besitz
  rationale: Die griechische Lesart bezeichnet Besitz oder Vermögen. Das Hebräische kann dagegen auf „Beute“ weisen; wegen der erheblichen Textabweichung wird diese Möglichkeit in der Fußnote genannt.
