translation:
  language: de
  text: Wehe, böser Gedanke! Warum wurdest du geschaffen, um die ganze Welt mit Täuschung zu erfüllen?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Paralleltext lautet: „Wehe, böser Gedanke! Woher bist du herangerollt, um das trockene Land mit Täuschung zu bedecken?“ Er stützt das Verständnis des schwierigen hebräischen Ausdrucks als „Gedanke“ oder „Anschlag“ und hat „bedecken“, wo der hebräische Text „füllen“ liest.'
    reason: alternative_reading
lexical_decisions:
- source_word: הוי
  choice: Wehe über
  rationale: Die Klage- und Unheilsinterjektion wird im Deutschen würdig und verständlich mit „Wehe über“ wiedergegeben.
- source_word: רע יאמר
  choice: der böse Gedanke
  rationale: Der überlieferte hebräische Ausdruck ist schwierig; das griechische ὦ πονηρὸν ἐνθύμημα stützt deutlich die Anrede eines personifizierten bösen Gedankens oder Anschlags.
- source_word: מדוע כן נוצרתי
  choice: Warum wurdest du erschaffen
  rationale: Die rhetorische Frage und die personifizierte Anrede werden bewahrt; die Form wird dem angesprochenen Gedanken entsprechend als zweite Person verstanden.
- source_word: למלא
  choice: zu erfüllen
  rationale: Gibt die klare hebräische Bedeutung „füllen“ wieder; die griechische Variante „bedecken“ wird in der Fußnote genannt.
- source_word: פני תבל
  choice: die Erde
  rationale: Das hebräische Idiom „Angesicht der Welt/Erde“ wird in natürlichem modernem Deutsch wiedergegeben, ohne den räumlichen Gesamtsinn zu verlieren.
- source_word: תרמית
  choice: Täuschung
  rationale: Bezeichnet betrügerische Irreführung und entspricht dem griechischen ἐν δολιότητι.
theological_decisions:
- issue: Hebräischer Hauptzeuge und griechische Klärung der schwierigen Lesart
  choice: Anrede an einen „bösen Gedanken“
  alternative: „böser Ausspruch“ oder „böser Gefährte“
  rationale: Das hebräische יאמר ist in diesem Zusammenhang schwer verständlich. Der griechische Paralleltext bietet ausdrücklich „böser Gedanke/Anschlag“ und ergibt zusammen mit der Personifizierung einen kohärenten Sinn. Die Unsicherheit wird nicht als Lehraussage aufgelöst, sondern textkritisch in der Fußnote offengelegt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die schwierige hebräische Lesart wird mithilfe des griechischen Paralleltextes verständlich wiedergegeben; dessen abweichende Bilder und Verben bleiben in der Fußnote sichtbar.
