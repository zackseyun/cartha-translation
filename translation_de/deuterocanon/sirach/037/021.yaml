    issue: Unidiomatische Verbindung „deine Schritte in Wahrheit festigen“
    rationale: Die adverbiale Wendung „in Wahrheit“ ist als Übersetzung von באמת möglich, klingt hier aber im Deutschen gekünstelt und lässt offen, was genau an den Schritten „in Wahrheit“ geschehen soll. „Zuverlässig“ gibt die im Kontext naheliegende Nuance von Wahrheit/Verlässlichkeit natürlich wieder, ohne die Grundbedeutung von יכין („festigen, fest machen“) zu einer bloßen Lenkung umzudeuten.
