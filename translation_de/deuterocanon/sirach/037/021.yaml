translation:
  language: de
  text: Und bei alledem flehe zu Gott, der deine Schritte zuverlässig festigen wird.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Textzeuge lautet: „Denn vom Herrn wurde ihm keine Gnade gegeben, weil ihm alle Weisheit fehlte.“ Der hebräische und der griechische Text unterscheiden sich hier erheblich; der Haupttext folgt dem erhaltenen hebräischen Textzeugen.'
    reason: textual_variant
lexical_decisions:
- source_word: ועם כל אלה
  choice: Und bei alledem
  rationale: Die Wendung bewahrt die anknüpfende und zugleich ergänzende Kraft des Hebräischen und klingt im modernen Deutschen natürlich.
- source_word: עתר
  choice: flehe
  rationale: Das Verb bezeichnet ein eindringliches Bitten oder inständiges Gebet; „flehe zu Gott“ gibt diese Intensität knapp und verständlich wieder.
- source_word: אל אל
  choice: zu Gott
  rationale: Die erste Form ist die Präposition „zu“, die zweite die Gottesbezeichnung „Gott“; im Deutschen ist „zu Gott“ die sachgemäße Wiedergabe.
- source_word: אשר
  choice: der
  rationale: Das Relativpronomen bezieht sich personal auf Gott.
- source_word: יכין
  choice: festigen wird
  rationale: Das Verb kann „fest machen“, „gründen“, „bereiten“ oder im Zusammenhang mit Schritten „lenken“ bedeuten. „Festigen“ erhält die konkrete Grundbedeutung und die Metapher, ohne die Aussage vorschnell auf bloße Führung einzuengen.
- source_word: באמת
  choice: in Wahrheit
  rationale: Die formnahe Wendung bewahrt die mögliche Bedeutungsbreite von Wahrheit, Verlässlichkeit und Treue besser als das enger wirkende „wirklich“.
- source_word: צעדיך
  choice: deine Schritte
  rationale: Die wörtliche Metapher ist auch im Deutschen verständlich und kann sowohl einzelne Entscheidungen als auch den Lebensweg bezeichnen.
theological_decisions:
- issue: Verhältnis des hebräischen und griechischen Textzeugen
  choice: Der erhaltene hebräische Text über Gebet und Gottes Festigung der Schritte steht im Haupttext.
  alternative: 'Der griechische Text lautet: „Denn vom Herrn wurde ihm keine Gnade gegeben, weil ihm alle Weisheit fehlte.“'
  rationale: Wo Sirach auf Hebräisch erhalten ist, hat dieser Text Vorrang. Da der griechische Zeuge hier nicht bloß eine kleine Abweichung, sondern einen wesentlich anderen Satz bietet, wird seine Lesart vollständig in einer textkritischen Fußnote dokumentiert.
- issue: Bedeutung von יכין באמת
  choice: „in Wahrheit festigen wird“
  alternative: „zuverlässig lenken wird“
  rationale: Die gewählte Fassung wahrt sowohl die konkrete Bedeutung „fest machen“ als auch die Mehrdeutigkeit von באמת zwischen Wahrheit, Verlässlichkeit und Treue; eine ausschließlich lenkende Deutung wäre möglich, aber interpretierender.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Bei alledem“ stellt den Zusammenhang mit dem vorausgehenden Rat her; „flehe“ bringt die Eindringlichkeit des Gebets zum Ausdruck. Die ungewöhnlichere, aber verständliche Formulierung „in Wahrheit festigen“ bewahrt bewusst die semantische Offenheit des Hebräischen.
