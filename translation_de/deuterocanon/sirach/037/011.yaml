base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/037/011.yaml
  text: He will speak to you of the good of your way[a], and then stand opposite to watch your downfall.
translation:
  language: de
  text: Er wird dir sagen, wie gut dein Weg ist[a], und sich dir gegenüber aufstellen, um deine Not zu sehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Hebräische ist hier knapp und nicht ganz sicher. Der letzte Ausdruck kann auch mit »dein Unglück« oder »deine Armut« wiedergegeben werden. Die griechische Parallelüberlieferung bietet an dieser Stelle stattdessen eine ausführlichere Warnung davor, sich bei der Beratung auf bestimmte Menschen zu verlassen.
    reason: alternative_reading
lexical_decisions:
- source_word: ואמר לך
  choice: Er wird dir sagen
  rationale: אמר ist das gewöhnliche Verb für »sagen«. Die Wiedergabe bewahrt die direkte persönliche Anrede.
- source_word: מטוב דרכך
  choice: wie gut dein Weg ist
  rationale: Die knappe, nicht völlig eindeutige Wendung wird als zustimmende beziehungsweise schmeichelnde Rede über den eingeschlagenen Weg verstanden. So klingt sie im Deutschen natürlich, ohne das Bild des Weges aufzugeben.
- source_word: דרכך
  choice: dein Weg
  rationale: דרך bezeichnet wörtlich und übertragen einen Weg. Das in der Weisheitsliteratur geläufige Bild bleibt erhalten.
- source_word: וקם מנגד
  choice: sich dann aber dir gegenüberstellen
  rationale: מנגד bezeichnet eine Stellung gegenüber oder abseits im Gegenüber. Das deutsche »gegenüberstellen« bewahrt das räumliche Bild und lässt die im Zusammenhang naheliegende feindselige Distanz erkennen. »Aber« macht den sachlichen Gegensatz idiomatisch sichtbar, obwohl die hebräische Konjunktion für sich genommen auch schlicht »und« heißen kann.
- source_word: להביט
  choice: beobachten
  rationale: הביט meint ein aufmerksames Hinsehen. »Beobachten« gibt den absichtlichen, distanzierten Blick wieder.
- source_word: רישך
  choice: deinen Niedergang
  rationale: Die schwierige Form dürfte einen Begriff für Armut, Not oder Unglück wiedergeben. »Niedergang« erfasst die negative Entwicklung im Kontext, während die möglichen engeren Bedeutungen in der Fußnote genannt werden.
theological_decisions:
- issue: Hebräischer Geniza-Text und abweichende ausführlichere griechische Parallelüberlieferung
  choice: Der erhaltene hebräische Text bildet die Grundlage; das Griechische dient nur als Kontextkontrolle.
  alternative: Die ausführliche griechische Liste von Personen, deren Rat man nicht suchen soll, als Haupttext übersetzen.
  rationale: Da ein hebräischer Zeuge vorliegt und als hoch zuverlässig eingestuft ist, wird er vorrangig übersetzt. Seine sprachliche Unsicherheit und die erhebliche Abweichung der griechischen Überlieferung werden jedoch offengelegt, statt harmonisiert zu werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das traditionelle Weisheitsbild vom »Weg« bleibt erhalten; die schwierige Schlussformulierung wird lesbar wiedergegeben und durch eine Fußnote abgesichert.
