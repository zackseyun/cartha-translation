translation:
  language: de
  text: 'Jeder Ratgeber sagt: »Sieh!«[a] Doch es gibt einen Ratgeber, der auf ihn tritt.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische »Sieh!« ist schwierig. Es kann eine knappe Aufforderung oder den Anspruch ausdrücken, Einsicht und Orientierung zu bieten. Die griechische Parallele warnt ausführlicher davor, sich vor einem Ratgeber zu hüten, weil er auch zu seinem eigenen Vorteil rät.
    reason: alternative_reading
  - marker: b
    text: 'Oder sinngemäß: »der ihn ausnutzt«. Wörtlich steht im Hebräischen »der auf ihn tritt«; gemeint ist wahrscheinlich schädlicher oder eigennütziger Rat. Worauf sich »ihn« genau bezieht, bleibt im knappen hebräischen Wortlaut offen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כל
  choice: Jeder
  rationale: 'Die distributive Wiedergabe passt zum sprichwortartigen Charakter: Gemeint ist jeder einzelne Ratgeber.'
- source_word: יועץ
  choice: Ratgeber
  rationale: Das Wort ist in moderner Standardsprache natürlich und bewahrt die Wiederholung des hebräischen Substantivs.
- source_word: אומר
  choice: sagt
  rationale: Das Präsens gibt die allgemeingültige Aussage schlicht wieder.
- source_word: חזה
  choice: Sieh!
  rationale: Die knappe, schwierige hebräische Form wird als Aufforderung wiedergegeben. So bleiben ihre Abruptheit und die mögliche Behauptung besonderer Einsicht erkennbar.
- source_word: אך
  choice: Doch
  rationale: Kennzeichnet den warnenden Gegensatz zum einleitenden allgemeinen Satz.
- source_word: דורך
  choice: tritt ... herum
  rationale: Die Bildsprache des hebräischen Verbs für Treten wird bewahrt; im Zusammenhang kann sie schädigendes oder eigennütziges Verhalten bezeichnen.
- source_word: עליו
  choice: auf ihm
  rationale: Dies bildet die hebräische Präpositionalfügung und ihr nicht ausdrücklich geklärtes Bezugswort möglichst unmittelbar ab.
theological_decisions:
- issue: Vorrang des erhaltenen hebräischen Textes gegenüber der ausführlicheren griechischen Parallele
  choice: Der Haupttext folgt dem knappen und schwierigen Hebräisch.
  alternative: 'Nach dem Griechischen sinngemäß: »Hüte dich vor einem Ratgeber; denn er wird auch zu seinem eigenen Vorteil raten.«'
  rationale: Wo der hebräische Sirachtext erhalten ist, hat er Vorrang. Die griechische Parallele bestätigt zwar die Warnung vor eigennützigem Rat, soll die mehrdeutige hebräische Formulierung aber nicht ersetzen.
translation_notes:
  register: Moderne, würdige Standardsprache mit sprichwortartiger Kürze. Die ungewöhnliche Bildsprache und der unklare Bezug des Pronomens werden im Haupttext nicht vorschnell geglättet, sondern in den Fußnoten erläutert.
