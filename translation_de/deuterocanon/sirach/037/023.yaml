translation:
  language: de
  text: Ein weiser Mann unterweist sein eigenes Volk, und die Früchte seiner Einsicht sind verlässlich.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der erhaltene hebräische Text ist hier schwer verständlich und weicht deutlich vom Griechischen ab. Der Haupttext folgt dem klareren griechischen Zeugen: „Ein weiser Mann unterweist sein eigenes Volk, und die Früchte seiner Einsicht sind verlässlich.“'
    reason: textual_variant
  - marker: b
    text: 'Der hebräische Zeuge bewahrt eine dunkle Wendung, ungefähr: „[Ausrottung/Krone?] der Pläne des Herzens; vier Schultern(?) werden blühen.“ Der Wortlaut ist unsicher und möglicherweise verderbt oder nur mangelhaft überliefert.'
    reason: alternative_reading
lexical_decisions:
- source_word: עקרת תחבולות לבב
  choice: '[im Haupttext nicht zugrunde gelegt]'
  rationale: Der erhaltene hebräische Wortlaut ist hier äußerst dunkel und ergibt im Zusammenhang keinen hinreichend sicheren Sinn. Daher folgt der Haupttext dem klar verständlichen griechischen Parallelzeugen, während die hebräische Lesart in einer Fußnote dokumentiert wird.
- source_word: ἀνὴρ σοφός
  choice: ein weiser Mann
  rationale: Die griechische Form bezeichnet ausdrücklich einen weisen Mann im Singular; die deutsche Wiedergabe wahrt diese Form und ihren sprichworthaften, repräsentativen Charakter.
- source_word: τὸν ἑαυτοῦ λαόν
  choice: sein eigenes Volk
  rationale: „Volk“ entspricht dem üblichen Sinn von λαός; „sein eigenes“ gibt das betonte ἑαυτοῦ wieder, ohne die Aussage unnötig auf eine politische Nation einzuengen.
- source_word: παιδεύσει
  choice: unterweist
  rationale: Das Präsens gibt den allgemeinen Sinn des Weisheitsspruchs im Deutschen natürlich wieder. „Unterweisen“ erfasst hier den lehrenden Aspekt von παιδεύω besser als das stärker strafend klingende „züchtigen“.
- source_word: οἱ καρποὶ
  choice: die Früchte
  rationale: Der Plural und das Bild des griechischen Textes bleiben erhalten, statt sie durch eine abstrakte Umschreibung wie „Ergebnisse“ einzuebnen.
- source_word: τῆς συνέσεως αὐτοῦ
  choice: seiner Einsicht
  rationale: σύνεσις bezeichnet verstehende Einsicht beziehungsweise Urteilsvermögen; „Einsicht“ ist im Deutschen knapp, verständlich und dem Weisheitskontext angemessen.
- source_word: πιστοί
  choice: verlässlich
  rationale: Das Prädikat beschreibt die Früchte als zuverlässig und bewährt. „Verlässlich“ vermittelt diesen Sinn natürlicher als das in diesem Zusammenhang missverständliche „treu“.
