translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Der sprichwortartige Hauptsatz steht im Präsens; die Fruchtmetapher und die männliche Singularform des griechischen Zeugen bleiben erhalten. Die erhebliche Spannung zwischen dem dunklen Hebräisch und dem klaren griechischen Paralleltext wird ausdrücklich in den Fußnoten offengelegt.
