  text: A vain laborer for his work[a], a vain guard for one who brings forth evil.
translation:
  language: de
  text: Ein vergeblicher Arbeiter bei seiner Arbeit, ein vergeblicher Wächter über einen, der Böses hervorbringt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Text lautet stattdessen: „Und bei all dem bete zum Höchsten, damit er deinen Weg in Wahrheit gerade führt.“ Der hebräische und der griechische Text unterscheiden sich hier erheblich.'
    reason: textual_variant
lexical_decisions:
- source_word: פועל
  choice: Arbeiter
  rationale: Das Wort bezeichnet konkret jemanden, der tätig ist oder arbeitet; „Arbeiter“ bewahrt diesen Personenbezug und den Parallelismus mit „Wächter“.
- source_word: שוא
  choice: vergeblich
  rationale: Das Wort kann Leere, Nichtigkeit oder Vergeblichkeit ausdrücken. „Vergeblich“ gibt hier die Erfolglosigkeit beider Tätigkeiten knapp und parallel wieder, ohne die schwierige Aussage stärker auszudeuten.
- source_word: מלאכתו
  choice: seiner Arbeit
  rationale: Das Substantiv bezeichnet Arbeit, Tätigkeit oder Aufgabe. „Bei seiner Arbeit“ ist im Deutschen verständlich und bleibt nah am hebräischen על מלאכתו.
- source_word: שומר
  choice: Wächter
  rationale: Die Form bezeichnet einen, der wacht oder bewacht. „Wächter“ entspricht der konkreten Personenbezeichnung und steht parallel zu „Arbeiter“.
- source_word: מוציא רע
  choice: einen, der Böses hervorbringt
  rationale: Wörtlich bezeichnet die Wendung jemanden, der Böses heraus- oder hervorbringt. Die relativ wörtliche Wiedergabe bewahrt die unsichere Bedeutungsweite, statt sie etwa auf einen Übeltäter oder Verleumder festzulegen.
theological_decisions:
- issue: Erhebliche Abweichung zwischen dem erhaltenen hebräischen Text und der griechischen Überlieferung
  choice: Der erhaltene hebräische Wortlaut steht im Haupttext; die wesentlich andere griechische Lesart wird vollständig in einer Fußnote geboten.
  alternative: „Und bei all dem bete zum Höchsten, damit er deinen Weg in Wahrheit gerade führt.“
  rationale: Da für diesen Vers ein hebräischer Text vorliegt, bildet er die Grundlage der Übersetzung. Die griechische Fassung bietet jedoch keinen kleinen Variantenunterschied, sondern einen ganz anderen Satz; diese textliche Spannung darf nicht stillschweigend beseitigt werden.
translation_notes:
  register: Knappes, sprichwortartiges und bewusst etwas herbes Deutsch. Die Wiederholung von „vergeblich“ bildet die hebräische Parallelstruktur nach; die schwer verständliche Aussage wird nicht durch eine spekulative Deutung geglättet.
