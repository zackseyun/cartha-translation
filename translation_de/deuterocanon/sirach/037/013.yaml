  text: Consult with a woman about her rival, and with a coward about his warfare;[a]
translation:
  language: de
  text: Hol Rat ein bei einer Frau über ihre Rivalin und bei einem Feigling über seinen Kampf.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hebräische Text ist hier schwierig und weicht stark vom griechischen ab. Das Griechische lautet ungefähr: „jemand, dessen Seele deiner Seele entspricht, und wenn du strauchelst, wird er mit dir leiden“ – also ein Mensch, der dir innerlich verbunden ist und deinen Schmerz teilt. Das mit „Feigling“ wiedergegebene hebräische Wort ist unsicher; auch „Aufrührer“ oder „Deserteur“ wurden vorgeschlagen.'
    reason: textual_variant
lexical_decisions:
- source_word: עִם
  choice: berate dich mit
  rationale: Die Präposition bezeichnet im Zusammenhang die Person, bei der Rat gesucht wird. Die deutsche Formulierung macht diesen impliziten Beratungskontext natürlich deutlich.
- source_word: אִשָּׁה
  choice: einer Frau
  rationale: Das gewöhnliche Substantiv kann „Frau“ oder „Ehefrau“ bedeuten; ohne Possessivangabe ist „einer Frau“ am wenigsten festlegend.
- source_word: צָרָהּ
  choice: ihre Rivalin
  rationale: Das Wort kann eine Nebenfrau oder allgemein eine weibliche Gegnerin bezeichnen. „Rivalin“ bewahrt die Breite, ohne die engere Bedeutung „Nebenfrau“ festzulegen.
- source_word: מָרֵד
  choice: einem Feigling
  rationale: Die hebräische Lesart ist schwierig. Im Zusammenhang mit „seinem Krieg“ bezeichnet das Wort wohl jemanden, der im Kampf zurückweicht oder unzuverlässig ist; „Feigling“ gibt diesen Sinn verständlich wieder, während die Unsicherheit in der Fußnote offengelegt wird.
- source_word: מִלְחַמְתּוֹ
  choice: seinen Krieg
  rationale: Das Substantiv bezeichnet Krieg oder Kampf und trägt ein Suffix der dritten Person Singular. „Seinen Krieg“ erhält den Possessivbezug und klingt im Deutschen natürlicher als „seine Kriegführung“.
theological_decisions:
- issue: Starke Abweichung zwischen dem erhaltenen hebräischen und dem griechischen Textzeugen
  choice: Der erhaltene hebräische Text steht im Haupttext; die erheblich abweichende griechische Lesart wird in einer Fußnote dokumentiert.
  alternative: 'Dem Griechischen folgen: „einer, dessen Seele deiner Seele entspricht, und wenn du strauchelst, wird er mit dir leiden“'
  rationale: Wo ein hebräischer Sirach-Text erhalten ist, hat er für diese Übersetzung Vorrang. Da die griechische Fassung hier jedoch offenbar eine ganz andere Zeile bezeugt, wird die Abweichung nicht eingeebnet, sondern transparent vermerkt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der knappe warnende Parallelismus des Hebräischen bleibt erhalten; die schwerwiegende Textabweichung wird nicht stillschweigend harmonisiert.
