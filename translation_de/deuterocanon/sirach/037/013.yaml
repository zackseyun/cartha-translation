  naturalness: „Berate dich mit“ ist möglich, doch „Hol Rat ein bei“ bezeichnet die hier vorausgesetzte Konsultation im heutigen Standarddeutsch klarer. „Seinen Krieg“ ist mit dem individuellen Possessivbezug im Deutschen unnatürlich; „seinen Kampf“ ist idiomatischer und wahrt den konkreten kriegerischen Bezug. In der Fußnote ist „einer, dessen Seele …“ als selbstständige deutsche Wiedergabe holprig.
  terminology: „Rivalin“ ist für צָרָהּ sinnvoll weit und vermeidet die nicht zwingende Einengung auf eine Mitfrau. „Feigling“ ist als kontextuelle, aber unsichere Wiedergabe von מָרֵד nur mit dem vorhandenen Hinweis vertretbar. „Kampf“ gibt מִלְחַמְתּוֹ im Deutschen natürlich wieder, ohne den militärischen Sinn aufzugeben.
