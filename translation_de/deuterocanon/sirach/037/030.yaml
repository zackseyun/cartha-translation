  text: A wise man for himself will be filled with delight[b][a], and all who see him will call him happy.
translation:
  language: de
  text: Ein Weiser sättigt sich an Freude,[b] und alle, die ihn sehen, werden ihn glücklich preisen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Im Hebräischen steht: „alle, die ihn sehen“. Die überlieferte Form des letzten Wortes ist ungewöhnlich geschrieben; der Sinn ergibt sich jedoch klar aus dem Zusammenhang.'
    reason: textual_variant
  - marker: b
    text: 'Der griechische Text bietet hier eine deutlich andere Zeile: „Denn bei vielerlei Speisen entsteht Schmerz, und Unersättlichkeit führt bis zur Gallenkrankheit.“ Der Haupttext folgt dem erhaltenen hebräischen Zeugnis aus der Kairoer Geniza.'
    reason: alternative_reading
lexical_decisions:
- source_word: חכם
  choice: ein Weiser
  rationale: Das maskuline Singularwort bezeichnet einen weisen Menschen und wird hier entsprechend seiner sprichwörtlichen Form wiedergegeben.
- source_word: לנפשו
  choice: für sich selbst
  rationale: נפש bezeichnet hier den eigenen Menschen beziehungsweise das Selbst, nicht eigens eine vom Körper unterschiedene Seele; die Wiedergabe bewahrt zudem die reflexive Ausrichtung.
- source_word: ישבע
  choice: wird … gesättigt
  rationale: Das Verb שבע bedeutet satt oder erfüllt werden. „Gesättigt“ bewahrt das Bild des hebräischen Ausdrucks und passt zum Zusammenhang von Maßhalten und Genuss.
- source_word: תענוג
  choice: Freude
  rationale: Das Substantiv bezeichnet Freude, Genuss oder Vergnügen. „Freude“ klingt im Deutschen natürlich und würdig, ohne den Ausdruck unnötig auf sinnlichen Genuss einzuengen.
- source_word: ויאשרוהו
  choice: werden ihn glücklich preisen
  rationale: Das Verb אשר bedeutet hier, jemanden glücklich beziehungsweise beneidenswert zu nennen. „Glücklich preisen“ gibt diese öffentliche Anerkennung idiomatisch wieder, ohne daraus einen formellen Segensakt zu machen.
- source_word: כל רואינו
  choice: alle, die ihn sehen
  rationale: Trotz der auffälligen überlieferten Schreibung des letzten Wortes ist aus Syntax und Parallelismus der Sinn „alle, die ihn sehen“ zu erschließen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit sprichwörtlichem Ton. Die Bildlichkeit von שבע bleibt durch „gesättigt“ sichtbar; „für sich selbst“ vermeidet eine unnötige dualistische Deutung von נפש. Die Fußnotenmarker stehen unmittelbar bei den jeweils erläuterten Aussagen.
