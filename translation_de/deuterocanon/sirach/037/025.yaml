translation:
  language: de
  text: Es gibt einen Weisen, der für viele als weise gilt,[a] doch für sich selbst ist er untauglich.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Überlieferung bietet hier einen anderen Spruch: „Das Leben eines Menschen besteht aus einer bestimmten Zahl von Tagen, doch die Tage Israels sind unzählbar.“ Der hebräische und der griechische Text stimmen an dieser Stelle kaum überein.'
    reason: textual_variant
  - marker: b
    text: Das hebräische Wort גוֹאָל ist schwer zu deuten. Es kann etwas Beflecktes, Verunreinigtes oder Abstoßendes bezeichnen. „Untauglich“ gibt hier den Gegensatz im Zusammenhang wieder; möglich wäre auch eine stärker wörtliche Wiedergabe wie „befleckt“.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵשׁ
  choice: Es gibt
  rationale: Die Existenzpartikel leitet eine allgemeine Beobachtung ein; „Es gibt“ ist im modernen Deutschen natürlich und wahrt die sprichwortartige Form.
- source_word: חָכָם
  choice: einen Weisen
  rationale: Das hebräische Substantiv ist maskulin Singular und bezeichnet hier einen repräsentativen Typus. „Weiser“ ist prägnant und würdevoll.
- source_word: לְרַבִּים
  choice: für viele
  rationale: 'Die Präposition ל wird hier als Beziehung beziehungsweise Nutzen verstanden: Seine Weisheit kommt vielen zugute oder gilt ihnen gegenüber. „Für viele“ lässt diese Bedeutungsbreite bestehen.'
- source_word: נֶחְכָּם
  choice: weise ist
  rationale: Die Nifal-Form kann ausdrücken, dass jemand sich als weise erweist oder als weise gilt. Im Zusammenhang vermeidet „weise ist“ die unbelegte Vorstellung eines zeitlichen Werdegangs und erhält den knappen Gegensatz.
- source_word: וּלְנַפְשׁוֹ
  choice: doch für sich selbst
  rationale: נפש bezeichnet hier am ehesten die eigene Person beziehungsweise das eigene Leben, nicht ausdrücklich eine metaphysische Seele. „Für sich selbst“ gibt den praktischen Kontrast idiomatisch wieder.
- source_word: גוֹאָל
  choice: nichts wert
  rationale: Das schwierige Wort kann etwas Beflecktes, Verunreinigtes oder Abstoßendes bezeichnen. Im antithetischen Zusammenhang drückt „nichts wert“ knapp aus, dass die Weisheit dem Betreffenden selbst keinen Nutzen bringt; die Unsicherheit wird in einer Fußnote offengelegt.
theological_decisions: []
translation_notes:
  register: Knappe, sprichwortartige Syntax in modernem Standarddeutsch. Der maskuline Einzelfall des Hebräischen bleibt erhalten. Die Wiederholung von „weise“ bildet die formale Struktur des Ausgangstextes ab, während „doch“ den im Hebräischen angelegten Gegensatz natürlich ausdrückt.
