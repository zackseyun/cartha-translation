  text: Do not bargain with a merchant[a], nor over buying and selling.
translation:
  language: de
  text: Feilsche nicht mit einem Händler[a] und auch nicht über Kauf und Verkauf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Überlieferung lautet: „Richte den Rat deines Herzens fest aus; denn nichts ist dir treuer als dieser Rat.“ Der erhaltene hebräische Text weicht hier erheblich von der griechischen Überlieferung ab.'
    reason: alternative_reading
lexical_decisions:
- source_word: עם סוחר
  choice: mit einem Händler
  rationale: עם bezeichnet hier die Person, mit der man sich einlässt; סוחר ist ein berufsmäßig Handelnder und wird natürlich mit „Händler“ wiedergegeben.
- source_word: אל תתגר
  choice: Feilsche nicht
  rationale: Im unmittelbaren Handelskontext bezeichnet die Form am ehesten das Sich-Einlassen auf ein Aushandeln oder Feilschen. Das allgemeinere „Streite nicht“ bleibt sprachlich möglich, würde den kommerziellen Zusammenhang jedoch weniger deutlich wiedergeben.
- source_word: וממקנה על ממכר
  choice: und auch nicht über Kauf und Verkauf
  rationale: Die knappe, schwer verständliche hebräische Wortfolge verbindet Begriffe aus dem Bereich des Erwerbens und Veräußerns. Die Übersetzung bewahrt den kommerziellen Gegensatz und ergänzt die fortwirkende Verneinung idiomatisch, ohne den elliptischen Satz zu stark auszudeuten.
theological_decisions:
- issue: Starke Abweichung zwischen dem erhaltenen hebräischen Text und der griechischen Überlieferung
  choice: Der Haupttext folgt dem erhaltenen Hebräisch und gibt die Warnung vor dem Feilschen beziehungsweise vor Handelsgeschäften wieder.
  alternative: 'Griechisch: „Halte dich an den Rat deines Herzens; denn niemand ist dir treuer als dieses.“'
  rationale: Da für diese Stelle ein hebräischer Text erhalten ist, bildet er die Grundlage der Übersetzung. Die griechische Fassung bietet keine bloße Detailvariante, sondern einen wesentlich anderen Gedanken und wird deshalb transparent in einer Fußnote dokumentiert.
translation_notes:
  register: Kurzer, mahnender Weisheitsspruch in modernem, würdigem Standarddeutsch. „Feilschen“ stellt den Handelskontext klar heraus; die zweite Satzhälfte bleibt wegen der knappen hebräischen Formulierung bewusst allgemein.
