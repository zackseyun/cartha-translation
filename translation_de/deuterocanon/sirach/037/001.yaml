  text: Every friend says[a], “I love him,” but there is a friend who is a friend in name only.
translation:
  language: de
  text: 'Jeder Freund sagt: »Ich habe ihn lieb.« Doch mancher ist nur dem Namen nach ein Freund.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hebräische Wortlaut ist hier stark verkürzt, etwa: »Doch es gibt einen Freund – dem Namen nach Freund.« Die griechische Überlieferung verdeutlicht den Sinn: »ein Freund nur dem Namen nach«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כל אוהב
  choice: Jeder Freund
  rationale: אוהב kann einen Liebenden oder einen Freund bezeichnen. Das griechische Πᾶς φίλος und der Gegensatz zur bloß nominellen Freundschaft stützen hier »Freund«.
- source_word: אומר
  choice: sagt
  rationale: Die schlichte Wiedergabe bewahrt den knappen Spruchstil, ohne ein prahlerisches »behauptet« einzutragen.
- source_word: אהבתי
  choice: Auch ich bin ihm ein Freund gewesen
  rationale: Die hebräische Perfektform und das griechische Ἐφίλιασα αὐτῷ κἀγώ legen eine rückblickende Aussage mit dem ergänzten Bezug »ihm« und »auch ich« nahe. Die idiomatische deutsche Formulierung gibt den sozialen Sinn von אהב wieder, statt ihn auf emotionale Liebe zu verengen.
- source_word: אך
  choice: Doch
  rationale: Kennzeichnet prägnant den adversativen Übergang vom Bekenntnis zur tatsächlichen Qualität der Freundschaft.
- source_word: יש
  choice: mancher ist
  rationale: Das existentielle יש wird im Deutschen zusammen mit dem folgenden Subjekt natürlich als »mancher ist« ausgedrückt.
- source_word: אהב שם אהב
  choice: mancher ist nur dem Namen nach ein Freund
  rationale: Der hebräische Ausdruck ist stark verdichtet und möglicherweise textlich unsicher. Das griechische ἔστι φίλος ὀνόματι μόνον φίλος bestätigt den Sinn »nur dem Namen nach ein Freund«.
theological_decisions: []
translation_notes:
  register: Knapp, sprichwörtlich und würdevoll. Die direkte Rede bleibt natürlich; »dem Namen nach« bewahrt den Gegensatz zwischen bekundeter und wirklicher Freundschaft. Die Fußnote macht die Verdichtung des Hebräischen transparent.
