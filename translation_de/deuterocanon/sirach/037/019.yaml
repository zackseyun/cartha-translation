lexical_decisions:
- source_word: וגם
  choice: Da ist auch
  rationale: Die hebräische Wendung fügt einen weiteren Fall an; das im elliptischen Satz fehlende Existenzverb wird für natürliches Deutsch ergänzt.
- source_word: עצת לבב הבין
  choice: ein verständiger Mann mit dem Rat seines Herzens
  rationale: Wörtlich steht eine schwierige Verbindung aus „Rat“, „Herz“ und „verständig/einsichtig“. Die Wiedergabe bewahrt sowohl die verständige Person als auch die innere Beratung, ohne beides einfach gleichzusetzen.
- source_word: מי יאמן לך
  choice: Wer wird dir … vertrauen
  rationale: Die rhetorische Frage und der Wechsel zur zweiten Person bleiben erhalten. אמן bezeichnet hier Glauben beziehungsweise Vertrauen, das jemand dem Angeredeten entgegenbringt.
- source_word: אמן ממנו
  choice: mehr … als er
  rationale: Die knappe und schwierige Schlusswendung wird vergleichend verstanden. Das männliche Pronomen bezieht sich in der Übersetzung auf den verständigen Mann; die Ellipse wird nicht weiter ausgedeutet.
theological_decisions:
- issue: Grammatisch männliche Einzahl im Weisheitsspruch
  choice: ein verständiger Mann
  alternative: ein verständiger Mensch
  rationale: Die grammatisch männliche Einzahl des Hebräischen wird sichtbar bewahrt; der Satz beschreibt dabei einen Weisheitstyp.
- issue: Schwieriger hebräischer Text gegenüber der stark abweichenden griechischen Fassung
  choice: Der Haupttext folgt dem erhaltenen Hebräisch und bewahrt Frage, zweite Person und Vergleich.
  alternative: „Da ist ein kluger Mann, der viele unterweist, sich selbst aber nichts nützt.“
  rationale: Wo ein hebräischer Sirach-Text erhalten ist, besitzt er für den Haupttext Vorrang. Die griechische Überlieferung wird wegen ihrer erheblichen Abweichung vollständig in einer Fußnote dokumentiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorische Frage und die zweite Person des schwierigen hebräischen Textes bleiben erhalten; die Satzellipse wird nur so weit ergänzt, wie es für verständliches Deutsch nötig ist.
