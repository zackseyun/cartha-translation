  naturalness: „Berate dich nicht mit deinem Schwiegervater“ ist verständlich, aber im heutigen Standarddeutsch weniger idiomatisch als „Suche nicht Rat bei deinem Schwiegervater“. „Halte dein Geheimnis vor einem Eifersüchtigen verborgen“ ist zudem unnötig schwerfällig und macht das im Hebräischen unbestimmte „ein Geheimnis“ bestimmt und possessiv.
  terminology: „Schwiegervater“ gibt חמיך präzise wieder. Für מקנא ist „eifersüchtiger Mensch“ eine nahe und verständliche Wiedergabe, ohne die mögliche Nuance „neidisch“ dogmatisch oder einengend aufzulösen. „Verbirg ein Geheimnis vor“ bildet העלים סוד angemessen ab.
