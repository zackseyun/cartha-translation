  text: Do not consult with your father-in-law[a], and conceal a secret from one who is jealous.
translation:
  language: de
  text: Suche nicht Rat bei deinem Schwiegervater[a], und verbirg ein Geheimnis vor einem eifersüchtigen Menschen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die griechische Parallelüberlieferung weicht hier erheblich ab. Sie spricht stattdessen davon, sich beständig an einen gottesfürchtigen Mann zu halten, von dem man weiß, dass er die Gebote hält. Der dieser Übersetzung zugrunde liegende hebräische Text warnt davor, den Schwiegervater um Rat zu fragen und einem eifersüchtigen Menschen ein Geheimnis anzuvertrauen.
    reason: textual_variant
lexical_decisions:
- source_word: אל תועץ
  choice: Berate dich nicht
  rationale: Die verneinte Verbform untersagt, bei jemandem Rat zu suchen. Die reflexive deutsche Wendung bildet den hebräischen Sinn knapp und natürlich ab.
- source_word: חמיך
  choice: deinem Schwiegervater
  rationale: Das hebräische Wort bezeichnet hier ausdrücklich den Schwiegervater; Numerus und Possessivbezug bleiben erhalten.
- source_word: וממקנא
  choice: vor einem Eifersüchtigen
  rationale: Die Präposition מן bezeichnet bei העלים die Person, vor der etwas verborgen gehalten wird. מקנא kann einen eifersüchtigen oder neidischen Menschen bezeichnen; „Eifersüchtigen“ wahrt die lexikalische Nähe.
- source_word: העלים סוד
  choice: halte dein Geheimnis ... verborgen
  rationale: Die Wendung fordert dazu auf, ein Geheimnis nicht preiszugeben. Das im Hebräischen unbestimmte סוד wird im Deutschen idiomatisch als das eigene anvertraute oder bewahrte Geheimnis formuliert.
theological_decisions:
- issue: Starke Abweichung zwischen hebräischem Text und griechischer Parallelüberlieferung
  choice: Der erhaltene hebräische Wortlaut wird direkt übersetzt.
  alternative: 'Nach dem Griechischen: „Halte dich vielmehr beständig an einen gottesfürchtigen Mann, von dem du weißt, dass er die Gebote hält.“'
  rationale: Da ein verständlicher hebräischer Text vorliegt, bleibt er die primäre Grundlage. Die wesentlich anders lautende griechische Überlieferung wird nicht harmonisierend in den Haupttext eingearbeitet, sondern in einer Fußnote offengelegt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Berate dich mit“ ist etwas gehobener, aber allgemein verständlich und bildet den Beratungskontext präzise ab. Die Formulierung vermeidet eine Auflösung der Eifersucht zu bloßem Neid.
