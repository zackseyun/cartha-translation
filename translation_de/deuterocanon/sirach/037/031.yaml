  naturalness: „Ein Weiser unter seinem Volk wird Ehre erben“ ist verständliches, würdiges modernes Standarddeutsch und wahrt die bildhafte Sprache. „Sein Name wird für alle Zeit bestehen“ klingt deutlich natürlicher als „im ewigen Leben fortbestehen“ und vermeidet eine unnötig dogmatisch klingende Engführung.
