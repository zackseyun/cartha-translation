translation:
  language: de
  text: Ein Weiser unter seinem Volk wird Ehre erben, und sein Name wird für alle Zeit bestehen.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sein Name wird im Leben der Ewigkeit bestehen.“ Wörtlich heißt es im Hebräischen ungefähr: „Sein Name steht im Leben der Ewigkeit.“ Die Wendung kann bleibendes Andenken bezeichnen, kann aber auch an ewiges Leben anklingen.'
    reason: lexical_alternative
  - marker: b
    text: 'Die griechische Parallelüberlieferung weicht hier erheblich ab: „Durch Habgier sind viele gestorben; wer aber achtsam ist, wird sein Leben verlängern.“ Der Haupttext folgt dem erhaltenen hebräischen Zeugnis.'
    reason: alternative_reading
lexical_decisions:
- source_word: חכם
  choice: ein Weiser
  rationale: Das substantivierte Adjektiv bezeichnet einen weisen Menschen; „ein Weiser“ bewahrt die maskuline Singularform und klingt im Deutschen natürlich und würdevoll.
- source_word: עם
  choice: unter seinem Volk
  rationale: Die Wendung beschreibt den Weisen in Beziehung zu seinem Volk beziehungsweise seiner Gemeinschaft. „Unter seinem Volk“ gibt diesen sozialen Bezug idiomatisch wieder.
- source_word: ינחל
  choice: wird … erben
  rationale: נחל bedeutet gewöhnlich „erben“ oder „als Besitz empfangen“. Die konkrete Metapher, Ehre als bleibenden Besitz zu erhalten, bleibt so erhalten.
- source_word: כבוד
  choice: Ehre
  rationale: Im weisheitlichen Zusammenhang bezeichnet כבוד öffentliche Achtung beziehungsweise Ansehen; „Ehre“ ist hier treffender als das stärker theologisch geprägte „Herrlichkeit“.
- source_word: שמו
  choice: sein Name
  rationale: Die wörtliche Formulierung bleibt erhalten; „Name“ kann zugleich Ruf, Andenken und fortdauernde Erinnerung bezeichnen.
- source_word: עומד
  choice: wird … fortbestehen
  rationale: Wörtlich heißt das Partizip „steht“. Bei einem Namen drückt „fortbestehen“ die zeitliche Dauer im Deutschen natürlicher aus, ohne die Aussage auf bloße Erinnerung zu verengen.
- source_word: בחיי עולם
  choice: im ewigen Leben
  rationale: Die ungewöhnliche hebräische Wendung lautet wörtlich etwa „im Leben der Ewigkeit“. „Im ewigen Leben“ bewahrt sowohl die Lebenssprache als auch die mögliche Spannung zwischen bleibendem Andenken und persönlichem ewigen Leben.
theological_decisions:
- issue: Bedeutung von בחיי עולם
  choice: im ewigen Leben
  alternative: für immer; für alle Zeit; im Leben der Ewigkeit
  rationale: Die Formulierung kann dauernden Nachruhm bezeichnen, besitzt aber zugleich mögliche Anklänge an ewiges Leben. Die Übersetzung bewahrt diese Spannung, während die Fußnote die idiomatische Deutung nennt, ohne eine ausgearbeitete Jenseitslehre in den Vers hineinzulesen.
- issue: Stark abweichende griechische Parallelüberlieferung
  choice: Der Haupttext folgt dem erhaltenen hebräischen Zeugnis.
  alternative: „Durch Unersättlichkeit sind viele gestorben; wer aber achtsam ist, wird sein Leben verlängern.“
  rationale: Da die hebräische Textgrundlage mit hoher Sicherheit bezeugt und als Hauptquelle vorgegeben ist, wird sie übersetzt. Die wesentlich andere griechische Fassung wird aus textgeschichtlicher Transparenz in einer Fußnote dokumentiert.
translation_notes:
  register: Modernes Standarddeutsch in knapper, würdevoller Weisheitssprache. Die Satzstruktur folgt dem hebräischen Parallelismus. „Ein Weiser“ ist allgemein verständlich; „Ehre erben“ bewahrt bewusst die konkrete hebräische Metapher. Die ungewöhnliche Lebensformulierung wird im Haupttext nicht geglättet, sondern in der Fußnote erläutert.
