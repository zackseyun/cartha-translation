  text: And more than all this, pray to the Most High that he may direct your way in truth.
translation:
  language: de
  text: Und bei all dem bete zum Höchsten, dass er deinen Weg in Wahrheit gerade richte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das erhaltene hebräische Fragment ist an dieser Stelle offenbar falsch zugeordnet oder beschädigt und lautet ungefähr: „Mit einem bösen Mann über die Vergeltung von Güte und mit einem Grausamen über das Wohl des Fleisches.“ Auch der hier angeführte griechische Paralleltext spricht stattdessen von der Seele eines Menschen und sieben Wächtern und scheint zu einem benachbarten Vers zu gehören. Der Haupttext folgt der anderweitig für Sirach 37,15 bezeugten griechischen Lesart der Gebetsaufforderung.'
    reason: textual_variant
lexical_decisions:
- source_word: καὶ ἐπὶ πᾶσι τούτοις
  choice: Und bei all dem
  rationale: Gibt die additive Wendung knapp und natürlich wieder, ohne die Steigerung „mehr als all dies“ einzutragen, die im Griechischen nicht ausdrücklich enthalten ist.
- source_word: δεήθητι ὑψίστου
  choice: bete zum Höchsten
  rationale: δεήθητι bezeichnet eine inständige Bitte beziehungsweise ein Gebet; „der Höchste“ bewahrt den jüdischen Gotteshoheitstitel.
- source_word: εὐθύνῃ
  choice: gerade richte
  rationale: Bewahrt das Bild des Ausrichtens beziehungsweise Gerademachens eines Weges deutlicher als das allgemeinere „leiten“.
- source_word: ἐν ἀληθείᾳ
  choice: in Wahrheit
  rationale: Formale und theologisch offene Wiedergabe; sie lässt zu, dass Wahrheit, Wahrhaftigkeit oder die rechte Ordnung des Weges gemeint ist.
- source_word: τὴν ὁδόν σου
  choice: deinen Weg
  rationale: „Weg“ ist im Deutschen natürlich und erhält sowohl die praktische als auch die sittliche Bildbedeutung.
theological_decisions:
- issue: Konflikt und Fehlzuordnung der überlieferten Quellenangaben
  choice: Der Haupttext gibt die in der konsultierten Überlieferung und im englischen Prüftext bezeugte Gebetsaufforderung wieder; die erhebliche Abweichung des vorgelegten hebräischen Fragments wird in einer Fußnote offengelegt.
  alternative: 'Eine wörtliche Wiedergabe des vorgelegten Hebräischen: „Mit einem bösen Mann über die Vergeltung von Güte und mit einem Grausamen über das Wohl des Fleisches.“'
  rationale: Das vorgelegte Hebräisch ist für diesen Vers als „major_mismatch“ gekennzeichnet und ergibt im Zusammenhang keinen verlässlich bestimmbaren Sinn. Auch der ausdrücklich zitierte griechische Paralleltext handelt stattdessen von der Seele eines Menschen und sieben Wächtern und scheint daher ebenfalls einem benachbarten Vers zuzugehören. Eine textkritische Fußnote ist nötig, damit die Unsicherheit nicht verschleiert wird.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Konjunktiv „richte“ hält den Inhalt des Gebets als erbetenes Handeln Gottes fest; „gerade richte“ bewahrt zugleich das Wegbild.
