    text: 'Der hier überlieferte hebräische Text ist an dieser Stelle stark abweichend und lautet ungefähr: „Mit einem bösen Mann über die Vergeltung von Güte und mit einem Grausamen über das Wohl des Fleisches.“ Auch der hier angeführte griechische Paralleltext spricht stattdessen von der Seele eines Menschen und sieben Wächtern und scheint zu einem benachbarten Vers zu gehören. Der Haupttext folgt daher der anderweitig für Sirach 37,15 bezeugten griechischen Lesart einer Gebetsaufforderung.'
