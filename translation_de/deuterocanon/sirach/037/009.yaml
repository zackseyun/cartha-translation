  text: Guard yourself from a counselor[a], and know beforehand what his need is.
translation:
  language: de
  text: Nimm dich vor einem Ratgeber in Acht und erkenne im Voraus, was er braucht.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „was sein Interesse ist“. Das hebräische Wort kann neben „Bedarf“ auch das bezeichnen, was jemanden betrifft oder antreibt. Die griechische Überlieferung gestaltet den Gedanken anders: „Und wenn er dir sagt: Dein Weg ist gut, wird er dir gegenüberstehen, um zu sehen, was dir widerfahren wird.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: מיועץ
  choice: vor einem Ratgeber
  rationale: Die Präposition מן bezeichnet nach שמר, wovor man sich hüten soll. „Ratgeber“ gibt die beratende Funktion von יועץ natürlich und unmittelbar wieder.
- source_word: שמור נפשך
  choice: Nimm dich … in Acht
  rationale: Wörtlich steht „hüte dein Leben/deine Person“. Die deutsche Wendung vermittelt die reflexive Warnung idiomatisch, ohne נפש auf das körperliche Leben zu verengen.
- source_word: ודע לפנים
  choice: und erkenne im Voraus
  rationale: 'לפנים hat hier zeitlichen Sinn: Man soll die Beweggründe des Ratgebers schon vorab durchschauen. „Erkenne“ passt im Kontext besser als das statischere „wisse“.'
- source_word: מה צרכו
  choice: was sein Anliegen ist
  rationale: צרך kann Bedarf, Interesse oder das, worum es jemandem geht, bezeichnen. „Anliegen“ bewahrt diese Spannweite im Deutschen besser als das engere „Bedürfnis“ und vermeidet die stärker negative Festlegung auf „Eigeninteresse“.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. „Nimm dich … in Acht“ ist eine geläufige Warnformel; „Anliegen“ lässt die mögliche Bedeutung zwischen Bedarf, Interesse und Beweggrund bewusst offen.
