  text: And there is a wise man who is wise for himself[b][a]; the fruit of his understanding is upon his own body.
translation:
  language: de
  text: Und es gibt einen Weisen, der für sich selbst klug handelt[a]; die Frucht seiner Einsicht kommt seinem Leib zugute[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „für seine Seele“; hier wohl im Sinn von „für sich selbst“ oder „für sein eigenes Leben“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich etwa: „Die Frucht seiner Einsicht ist auf seinem Leib.“ Das hebräische Wort kann andernorts auch einen Leichnam bezeichnen, meint hier aber den lebenden Menschen, dem seine Einsicht zugutekommt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֵשׁ
  choice: Und es gibt
  rationale: Bewahrt die schlichte hebräische Existenzkonstruktion und führt einen weiteren Typ des Weisen ein.
- source_word: חָכָם
  choice: einen Weisen
  rationale: Gibt das grammatisch maskuline Singularwort in würdigem, natürlichem Deutsch wieder.
- source_word: לְנַפְשׁוֹ
  choice: für sich selbst
  rationale: נפש bezeichnet hier wahrscheinlich reflexiv die eigene Person beziehungsweise das eigene Leben, nicht eine technisch vom Leib getrennte Seele.
- source_word: יֶחְכָּם
  choice: weise ist
  rationale: Die finite Form von חכם wird ohne zusätzliche Deutung als Zustand beziehungsweise Verhalten der Weisheit wiedergegeben.
- source_word: פְּרִי
  choice: die Frucht
  rationale: Erhält das konkrete und im Deutschen verständliche Bild für den Ertrag oder die Folge.
- source_word: דַעְתּוֹ
  choice: seiner Erkenntnis
  rationale: דעת kann Wissen, Erkenntnis oder praktische Einsicht bezeichnen; „Erkenntnis“ wahrt die lexikalische Breite im Weisheitskontext.
- source_word: עַל גְוִיָּתוֹ
  choice: kommt seinem eigenen Leib zugute
  rationale: Das wörtliche Bild „ist auf seinem Leib“ wäre im modernen Deutsch schwer verständlich. Die Formulierung macht den gemeinten Nutzen für die leibliche Person deutlich, ohne den lebenden Referenten als Leichnam misszuverstehen.
theological_decisions:
- issue: Anthropologische Bedeutung von נֶפֶשׁ
  choice: 'reflexiv: „für sich selbst“'
  alternative: „für seine Seele“ oder „für sein eigenes Leben“
  rationale: Der Spruch handelt davon, wem die Weisheit nützt. Die reflexive Wiedergabe vermeidet, dem Hebräischen eine Leib-Seele-Trennung aufzuerlegen.
- issue: Bedeutung von גְוִיָּה
  choice: lebender „Leib“
  alternative: „Leichnam“ oder allgemeiner „Person“
  rationale: Der Ertrag der Erkenntnis kommt hier dem lebenden Menschen zugute; „Leichnam“ ergäbe im Zusammenhang keinen plausiblen Sinn. „Leib“ bewahrt zugleich das konkrete hebräische Körperwort.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnliche hebräische Körpermetapher wird im Haupttext behutsam idiomatisiert und in der Fußnote transparent gemacht; die proverbiale maskuline Einzelform bleibt erhalten.
