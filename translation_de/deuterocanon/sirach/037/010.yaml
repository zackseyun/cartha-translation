translation:
  language: de
  text: 'Denn auch er wird an sich selbst denken: »Warum sollte dies ihm zufallen?«[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hebräische Text ist hier knapp und nicht ganz eindeutig. Die griechische Parallele lautet: »Berate dich nicht mit einem, der dich argwöhnisch ansieht, und verbirg deinen Plan vor denen, die dich beneiden.« Das stützt die Deutung, dass der andere aus Eigennutz oder Missgunst kalkuliert.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: »Denn auch er wird deinetwegen überlegen: ›Warum sollte ihm dies widerfahren?‹« Der hebräische Wortlaut lässt offen, wie לנפשך („für deine Person/dein Leben“) zu verstehen ist, auf wen sich die Pronomen beziehen und ob יפול „zufallen“ oder „widerfahren“ bedeutet.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כי
  choice: Denn
  rationale: Leitet die Begründung für die Warnung im Zusammenhang ein und entspricht dem knappen Stil der Weisheitsliteratur.
- source_word: גם הוא
  choice: auch er
  rationale: Bewahrt die additive Bedeutung und bezeichnet den anderen Ratgeber.
- source_word: לנפשך
  choice: auf seinen eigenen Vorteil bedacht sein
  rationale: Der überlieferte hebräische Ausdruck lautet wörtlich etwa »für deine Seele/dein Leben« und ist schwierig. Der Kontext sowie die griechische Parallele legen eigennütziges Kalkül nahe; die sinngemäße Wiedergabe macht dies verständlich, ohne die Textunsicherheit zu verschweigen.
- source_word: יחשב
  choice: wird ... bedacht sein
  rationale: Gibt das berechnende Erwägen im Zusammenhang mit Eigennutz in natürlichem Deutsch wieder.
- source_word: למה זה
  choice: Warum sollte dies
  rationale: Gibt die rhetorische Frage idiomatisch wieder.
- source_word: אליו יפול
  choice: jenem zufallen
  rationale: Bewahrt das Bild des Fallens beziehungsweise Zufallens und lässt offen, ob ein Los, Vorteil oder Ereignis gemeint ist. »Jenem« markiert die mögliche Bezugnahme auf eine andere Person, ohne sie endgültig festzulegen.
