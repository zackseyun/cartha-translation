  text: A bad friend looks to the table[b][a], but in a time of distress he will stand aloof.
translation:
  language: de
  text: Ein schlechter Freund blickt auf den Tisch, doch in der Not steht er ihm gegenüber.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »steht er gegenüber«. Das kann bedeuten, dass er sich fernhält, oder dass er eine gegnerische Haltung einnimmt.'
    reason: alternative_reading
lexical_decisions:
- source_word: מרע אוהב
  choice: ein schlechter Freund
  rationale: Die Wortverbindung bezeichnet einen Menschen, der sich in der Rolle eines Freundes als schlecht oder schädlich erweist. Die Wiedergabe ist im modernen Deutschen natürlich und bewahrt die moralische Bewertung.
- source_word: מביט אל שלחן
  choice: schaut auf den Tisch
  rationale: Die konkrete Bildsprache des Hebräischen bleibt erhalten. Gemeint ist offenbar das Interesse an Mahlzeit, Gemeinschaft oder Nutzen, ohne dies im Haupttext ausdrücklich auszudeuten.
- source_word: בעת מצוקה
  choice: in der Not
  rationale: מצוקה bezeichnet Bedrängnis oder Not. Die knappe deutsche Wendung gibt den Gegensatz zur Teilnahme am Tisch idiomatisch wieder.
- source_word: מנגד יעמד
  choice: stellt er sich auf die Gegenseite
  rationale: Das Hebräische bedeutet wörtlich, gegenüber zu stehen; auch das griechische ἀπέναντι bestätigt diese räumlich beziehungsweise relational offene Aussage. Die Formulierung lässt sowohl Distanzierung als auch feindliche Opposition anklingen.
theological_decisions:
- issue: Grad der Gegnerschaft des falschen Freundes in der Not
  choice: stellt er sich auf die Gegenseite
  alternative: hält er sich fern / steht er gegenüber
  rationale: Der Text lässt offen, ob der Freund lediglich abseitsbleibt oder aktiv zum Gegner wird. Die gewählte Formulierung bewahrt diese Spannung besser als eine rein passive oder eindeutig feindliche Deutung.
translation_notes:
  register: Knappe, sprichwortartige Formulierung in modernem, würdigem Standarddeutsch. Das Tischbild bleibt konkret; die Mehrdeutigkeit des letzten Halbverses wird im Haupttext möglichst bewahrt und in der Fußnote erläutert.
