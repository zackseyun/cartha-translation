  text: But a man is always fearful[a]; whom you know keeps the commandment.
translation:
  language: de
  text: Am Anfang jedes Werkes steht ein Wort, und jeder Tat geht Überlegung voraus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der erhaltene hebräische Text aus der Kairoer Geniza lautet hier stark abweichend, ungefähr: „Doch ein Mensch fürchtet sich stets, von dem du weißt, dass er das Gebot hält.“ Die hebräische Überlieferung scheint an dieser Stelle gestört zu sein; der Haupttext folgt deshalb der in sich stimmigen griechischen Fassung.'
    reason: textual_variant
lexical_decisions:
- source_word: ἀρχὴ παντὸς ἔργου
  choice: Am Anfang jedes Werkes
  rationale: Die kohärente griechische Parallelüberlieferung bildet angesichts des offenkundig abweichenden hebräischen Textes die Grundlage des Haupttextes. ἀρχή bezeichnet hier den Anfang oder Ausgangspunkt; ἔργον wird mit „Werk“ wiedergegeben.
- source_word: λόγος
  choice: ein Wort
  rationale: λόγος kann Wort, Rede, Erwägung oder Plan bedeuten. „Ein Wort“ bleibt nah an der knappen, sprichwortartigen Form und lässt die genaue Art der vorausgehenden sprachlichen Erwägung offen.
- source_word: πρὸ πάσης πράξεως
  choice: vor jeder Tat
  rationale: πρό bezeichnet zeitlichen Vorrang; πράξις meint Handlung oder Tat. „Tat“ ist knapp und unterscheidet sich sprachlich von „Werk“.
- source_word: βουλή
  choice: eine Beratung
  rationale: βουλή kann Rat, Beratung, Überlegung oder Plan bezeichnen. „Beratung“ drückt hier die bedachte Erwägung vor dem Handeln natürlich aus, ohne sie auf bloß fremden Rat zu beschränken.
theological_decisions:
- issue: Konflikt zwischen der erhaltenen hebräischen Fassung und der griechischen Parallelüberlieferung
  choice: Die kohärente griechische Lesart steht im Haupttext; die stark abweichende hebräische Fassung wird in einer Fußnote dokumentiert.
  alternative: „Doch ein Mensch fürchtet sich stets, von dem du weißt, dass er das Gebot hält.“
  rationale: Der überlieferte hebräische Wortlaut ist zwar lesbar, weicht aber vollständig von der syntaktisch und sprichwörtlich stimmigen griechischen Fassung ab und gilt an dieser Stelle als textuell gestört oder versetzt. Die griechische Überlieferung bietet daher die belastbarere Grundlage, während die Fußnote die echte Textunsicherheit offenhält.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper sprichwortartiger Struktur. Die Ellipse im zweiten Satzglied bewahrt den Parallelismus des Griechischen; „Beratung“ ist alltagssprachlich verständlicher als „Ratschluss“ und weniger missverständlich als bloß „Rat“.
