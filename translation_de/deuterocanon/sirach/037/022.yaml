translation:
  language: de
  text: Der Anfang jeder Tat ist ein Wort[b], und der Anfang jedes Werkes ist ein Gedanke[c].[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Überlieferung bietet hier einen anderen Spruch: „Es gibt einen, der für sich selbst weise ist, und die Früchte seiner Einsicht sind auf seinen Lippen verlässlich.“'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „eine Sache“ beziehungsweise „eine Angelegenheit“; das hebräische Wort dabar kann sowohl „Wort“ als auch „Sache/Angelegenheit“ bedeuten.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „ein Plan“; das hebräische machaschevet kann Gedanke, Überlegung, Absicht oder Plan bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ראש
  choice: der Anfang
  rationale: Im parallelen Spruch bezeichnet ראש das, was jeweils am Beginn steht. „Der Anfang“ ist natürliches Deutsch und bewahrt die Wiederholung beider Satzhälften.
- source_word: כל
  choice: jeder/jedes
  rationale: Die distributive Wiedergabe entspricht der allgemeinen, sprichwortartigen Aussage und wird dem grammatischen Geschlecht der deutschen Substantive angepasst.
- source_word: מעשה
  choice: Tat
  rationale: „Tat“ gibt menschliches Handeln prägnant wieder und hält zugleich einen leichten Bedeutungsunterschied zu פועל („Werk“) aufrecht.
- source_word: דבר
  choice: Wort
  rationale: דבר kann „Wort“, aber auch „Sache/Angelegenheit“ bedeuten. „Wort“ bildet hier einen sinnvollen Bezug zwischen sprachlichem Ausdruck und Tat, ohne die lexikalische Alternative zu verschweigen.
- source_word: פועל
  choice: Werk
  rationale: „Werk“ bewahrt die Nähe zu מעשה, ohne beide Begriffe gleich wiederzugeben, und passt zum knappen Parallelismus.
- source_word: היא
  choice: ist
  rationale: Das feminine Pronomen stimmt mit מחשבת überein und dient hier kopulativ; im Deutschen wird dies natürlich mit „ist“ ausgedrückt.
- source_word: מחשבת
  choice: Gedanke
  rationale: מחשבת kann Gedanke, Überlegung, Absicht oder Plan bezeichnen. „Gedanke“ erhält die Bedeutungsbreite besser als das engere „Plan“.
theological_decisions:
- issue: Abweichung zwischen dem erhaltenen hebräischen Text und der griechischen Überlieferung
  choice: Der Haupttext folgt dem erhaltenen Hebräisch; die deutlich andere griechische Fassung wird in einer Fußnote dokumentiert.
  alternative: 'Griechisch: „Es gibt einen, der für sich selbst weise ist, und die Früchte seiner Einsicht sind auf seinem Mund zuverlässig.“'
  rationale: Da für diese Stelle ein sicher bezeugter hebräischer Text vorliegt, bildet er die Grundlage der Übersetzung. Die griechische Fassung bietet keinen engen Übersetzungsgegenwert, sondern einen anderen Spruch; beide Fassungen dürfen daher nicht stillschweigend harmonisiert werden.
translation_notes:
  register: Knapper, würdevoller Spruch in modernem Standarddeutsch. Die Wiederholung von „der Anfang“ und „ist“ macht den hebräischen Parallelismus klar und gut verständlich; „Tat/Werk“ sowie „Wort/Gedanke“ bewahren die lexikalischen Gegenüberstellungen.
