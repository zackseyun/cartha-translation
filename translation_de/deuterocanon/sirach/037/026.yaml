  text: There is a wise man who is despised for his words[a], and he is deprived of every pleasant food.
translation:
  language: de
  text: Es gibt einen Weisen, der wegen seiner Worte verachtet wird[a], und dem jede köstliche Speise versagt bleibt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Griechisch lautet der Vers: »Der Weise in seinem Volk wird Vertrauen erben, und sein Name wird ewig leben.« Der hebräische und der griechische Text weichen hier erheblich voneinander ab.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְיֵשׁ
  choice: Es gibt
  rationale: Gibt die existenzielle Wendung natürlich wieder; das einleitende וְ wird im Deutschen nicht eigens ausgedrückt.
- source_word: חָכָם
  choice: einen Weisen
  rationale: Bewahrt die substantivierte maskuline Singularform und klingt in einem Weisheitstext würdig und natürlich.
- source_word: בִּדְבָרוֹ
  choice: wegen seiner Worte
  rationale: Die Präposition ב wird hier kausal verstanden; דָּבָר kann kollektiv das Gesagte beziehungsweise die Äußerungen bezeichnen.
- source_word: נִמְאָס
  choice: verachtet wird
  rationale: Der Nifal von מאס bezeichnet hier, dass jemand abgelehnt oder verachtet wird; im sozialen Zusammenhang trifft »verachtet« den Sinn gut.
- source_word: וּמִכָּל מַאֲכָל תַּעֲנוּג
  choice: jede köstliche Speise
  rationale: Die Verbindung bezeichnet genussvolle, begehrenswerte Nahrung; »köstliche Speise« erhält das konkrete Bild in natürlichem Deutsch.
- source_word: נִבְצָר
  choice: versagt bleibt
  rationale: Mit der von מִן bezeichneten Sache drückt das Verb aus, dass diese unerreichbar oder vorenthalten ist; »versagt bleibt« bildet Zustand und Entbehrung idiomatisch ab.
- source_word: ὁ σοφὸς ἐν τῷ λαῷ αὐτοῦ κληρονομήσει πίστιν, καὶ τὸ ὄνομα αὐτοῦ ζήσεται εἰς τὸν αἰῶνα
  choice: nur als textkritische Vergleichslesart berücksichtigt
  rationale: Der griechische Text weicht inhaltlich erheblich vom erhaltenen Hebräisch ab. Daher folgt der Haupttext dem hebräischen Zeugen, während die griechische Lesart in der Fußnote dokumentiert wird.
theological_decisions:
- issue: Erhebliche Abweichung zwischen hebräischer und griechischer Überlieferung in Sirach 37,26
  choice: Der erhaltene hebräische Text bestimmt den Haupttext.
  alternative: Der Weise in seinem Volk wird Vertrauen erben, und sein Name wird ewig leben.
  rationale: Wo ein hebräischer Sirach-Text erhalten ist, wird er als primärer Ausgangstext übersetzt. Da die griechische Fassung hier keine bloße Kleinvariante, sondern einen anderen Gedanken bietet, wird sie transparent in einer Fußnote bewahrt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Weisheitston. Die Satzstruktur bleibt eng am Hebräischen, ohne im Deutschen steif zu wirken; die bedeutende griechische Abweichung wird nicht harmonisiert.
