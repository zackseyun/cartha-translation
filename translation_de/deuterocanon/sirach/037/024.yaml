  text: Good and evil[a], life and death—over them all the tongue rules.
translation:
  language: de
  text: Gutes und Böses,[a] Leben und Tod – über sie alle herrscht die Zunge.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Parallele lautet: »Ein weiser Mann wird mit Segen erfüllt werden, und alle, die ihn sehen, werden ihn glücklich preisen.« Der griechische Text weicht hier erheblich vom erhaltenen hebräischen Text ab.'
    reason: alternative_reading
lexical_decisions:
- source_word: טוב
  choice: Gutes
  rationale: Im Gegensatzpaar mit רעה bezeichnet das Wort umfassend das Gute; die substantivierte Form klingt im Deutschen natürlich und bewahrt die prägnante Gegenüberstellung.
- source_word: רעה
  choice: Böses
  rationale: Die Wiedergabe erhält den umfassenden Gegensatz zu טוב. Engere Bedeutungen wie »Unglück« oder »Unheil« wären möglich, würden die Polarität aber stärker auf äußere Umstände begrenzen.
- source_word: חיים
  choice: Leben
  rationale: Direkte Standardwiedergabe; zusammen mit מות bildet das Wort ein geläufiges umfassendes Gegensatzpaar.
- source_word: מות
  choice: Tod
  rationale: Direkte Standardwiedergabe, die den knappen Parallelismus »Leben und Tod« wahrt.
- source_word: ומושלת
  choice: herrscht
  rationale: Das Verb משל bezeichnet Herrschaft oder bestimmenden Einfluss. »Herrscht« ist prägnant, würdevoll und bewahrt die starke Aussage des Hebräischen.
- source_word: בם כליל
  choice: über sie alle
  rationale: 'Die Formulierung gibt den umfassenden Geltungsbereich wieder: Die Herrschaft der Zunge erstreckt sich auf sämtliche zuvor genannten Größen.'
- source_word: לשון
  choice: die Zunge
  rationale: Das konkrete Bild des Hebräischen bleibt erhalten; wie in der biblischen Weisheitsliteratur steht »Zunge« metonymisch für das Reden und dessen Macht.
theological_decisions:
- issue: Verhältnis des hebräischen Textes zur stark abweichenden griechischen Parallele
  choice: 'Der erhaltene hebräische Text bildet den Haupttext: »Gutes und Böses, Leben und Tod – über sie alle herrscht die Zunge.«'
  alternative: 'Die griechische Parallele lautet stattdessen: »Ein weiser Mann wird mit Segen erfüllt werden, und alle, die ihn sehen, werden ihn glücklich preisen.«'
  rationale: Da für diesen Vers ein sicher bezeugter hebräischer Text vorliegt, hat er Vorrang. Die griechische Fassung ist keine enge Übersetzung dieses Wortlauts, sondern bietet eine wesentlich andere Lesart; sie wird deshalb transparent in einer Fußnote dokumentiert, ohne den hebräischen Haupttext zu verdrängen.
translation_notes:
  register: Knapper, sentenzartiger Weisheitsstil in modernem Standarddeutsch. Die beiden Gegensatzpaare und das konkrete Bild der herrschenden Zunge werden bewahrt; der Gedankenstrich markiert die zugespitzte Schlussaussage.
