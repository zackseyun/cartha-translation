  text: A man's heart tells of his thoughts[b][a], more than seven watchmen on a lookout.
translation:
  language: de
  text: Das Herz eines Menschen verrät seine inneren Sorgen[a] besser als sieben Wächter auf einem Wachposten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das hebräische Wort שעיותיו ist unsicher; möglich sind auch „Gedanken“, „Ängste“ oder „innere Anliegen“. Der griechische Text weicht hier stark ab: Er spricht von jemandem, der sich in Worten klug gibt, aber verhasst ist und jeder Nahrung entbehren muss.'
    reason: textual_variant
lexical_decisions:
- source_word: לב אנוש
  choice: das Herz eines Menschen
  rationale: לב bezeichnet das innere Denken und Empfinden; „Herz“ bewahrt das hebräische Menschenbild. אנוש wird hier als allgemeine Bezeichnung für einen einzelnen Menschen wiedergegeben.
- source_word: יגיד
  choice: verrät
  rationale: Das Hifil von נגד bedeutet „mitteilen, kundtun“. Im Zusammenhang bringt „verrät“ natürlich zum Ausdruck, dass das Herz den inneren Zustand erkennen lässt.
- source_word: שעיותיו
  choice: seine inneren Sorgen
  rationale: Die seltene beziehungsweise unsichere Form dürfte Sorgen, Ängste oder innere Anliegen bezeichnen. „Innere Sorgen“ wahrt diese Bedeutungsbreite besser als das stärker festlegende „Gedanken“ oder „Nöte“.
- source_word: משבעה
  choice: mehr als sieben
  rationale: Die Präposition מן hat hier vergleichende Bedeutung.
- source_word: צופים
  choice: Wächter
  rationale: Das Partizip von צפה bezeichnet Personen, die Ausschau halten oder Wache stehen.
- source_word: על מצפה
  choice: auf einem Wachposten
  rationale: מצפה bezeichnet einen erhöhten Beobachtungs- oder Wachplatz, ohne zwingend einen baulich ausgeführten Turm zu meinen.
