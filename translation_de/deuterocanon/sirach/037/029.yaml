  yaml_path: translation/deuterocanon/sirach/037/029.yaml
  text: A man's life is a numbered span of days, but the life of the people of Israel is days without number.
translation:
  language: de
  text: Das Leben eines Menschen umfasst eine bestimmte Zahl von Tagen; das Leben des Volkes Israel aber[a] umfasst Tage ohne Zahl.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „und das Leben des Volkes Israel: Tage ohne Zahl“. Das hebräische Bindewort kann einfach „und“ bedeuten; der Zusammenhang legt hier jedoch einen Gegensatz nahe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חַיֵּי אִישׁ
  choice: das Leben eines Menschen
  rationale: Die Wendung bezeichnet das Leben beziehungsweise die Lebenszeit eines einzelnen Menschen. „Mensch“ gibt das hier allgemein gebrauchte אִישׁ im modernen Deutschen natürlich wieder, ohne den individuellen Bezug aufzugeben.
- source_word: מִסְפַּר יָמִים
  choice: eine bestimmte Zahl von Tagen
  rationale: מִסְפָּר bezeichnet eine zählbare, begrenzte Anzahl. Die Formulierung bleibt dem Bild der gezählten Tage nahe und klingt zugleich idiomatisch deutsch.
- source_word: וְחַיֵּי עַם יִשְׂרָאֵל
  choice: das Leben des Volkes Israel aber
  rationale: Das hebräische וְ bedeutet zunächst „und“, kann im parallelen Gegensatz jedoch adversativ verstanden werden. Das nachgestellte „aber“ bringt den Kontrast natürlich zum Ausdruck; die wörtlichere Möglichkeit wird in der Fußnote bewahrt.
- source_word: עַם יִשְׂרָאֵל
  choice: das Volk Israel
  rationale: Die Wiedergabe erhält ausdrücklich den kollektiven Sinn des hebräischen Ausdrucks und reduziert ihn nicht auf den Eigennamen allein.
- source_word: יְמֵי אֵין מִסְפָּר
  choice: Tage ohne Zahl
  rationale: Die nahezu wörtliche Wiedergabe bewahrt die prägnante Gegenüberstellung zur bestimmten Zahl der Tage im ersten Satzteil.
theological_decisions:
- issue: Fortdauer Israels als Volk im Gegensatz zur Sterblichkeit des Einzelnen
  choice: Der Text stellt die begrenzte Lebenszeit des einzelnen Menschen den Tagen ohne Zahl des Volkes Israel gegenüber.
  alternative: Die Aussage könnte lediglich eine sehr lange geschichtliche Dauer Israels meinen, ohne eine weitergehende Aussage über seine bleibende Fortdauer zu machen.
  rationale: Die Übersetzung erhält den starken Gegensatz des hebräischen Parallelismus, baut ihn aber nicht zu einer ausdrücklichen dogmatischen Aussage über ewige oder bundesgeschichtliche Fortdauer aus.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe, parallel gebaute Aussage und das Bild der zählbaren beziehungsweise zahllosen Tage bleiben erhalten.
