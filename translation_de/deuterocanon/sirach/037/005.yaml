translation:
  language: de
  text: Ein Freund kämpft mit einem Fremden um etwas Gutes[b], und gegen Städte ergreift er einen Schild.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Griechisch: „Ein Gefährte müht sich mit einem Freund um seines Bauches willen ab, und angesichts des Krieges nimmt er einen Schild.“ Das Hebräische und das Griechische unterscheiden sich besonders im ersten Satzteil sowie bei „Städte“ beziehungsweise „Krieg“. Der Haupttext folgt dem erhaltenen hebräischen Zeugnis; die griechische Fassung ist als wichtige abweichende Lesart vermerkt.'
    reason: alternative_reading
  - marker: b
    text: Das hebräische Wort kann auch „Nutzen“ oder „Vorteil“ bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: אוהב
  choice: Freund
  rationale: Das substantivisch gebrauchte Partizip bezeichnet wörtlich einen Liebenden beziehungsweise jemanden, der Zuneigung zeigt; im weisheitlichen Zusammenhang ist „Freund“ die natürliche deutsche Wiedergabe. Auch die griechische Parallele spricht von einem Gefährten und einem Freund.
- source_word: טוב
  choice: Vorteil
  rationale: טוב kann hier allgemein „Gutes“, aber auch „Nutzen“ oder „Vorteil“ bedeuten. „Um einen Vorteil“ ergibt im Deutschen einen verständlichen Anlass für den Streit, ohne den offenen Sinn auf einen konkreten Gegenstand festzulegen.
- source_word: נלחם עם זר
  choice: kämpft mit einem Fremden
  rationale: עם kann eine Beteiligung oder, wie hier, die gegnerische Beziehung ausdrücken. „Mit einem Fremden kämpfen“ ist im Deutschen idiomatisch und lässt „Fremder“ als Person außerhalb des eigenen Kreises stehen, ohne ethnische Zugehörigkeit zu unterstellen.
- source_word: נגד ערים
  choice: gegen Städte
  rationale: 'נגד hat räumlich-konfrontativen Sinn: „gegenüber“, „vor“ oder „gegen“. Trotz der schwierigen Aussage folgt „gegen Städte“ dem erhaltenen hebräischen Wortlaut; die griechische Lesart „angesichts des Krieges“ wird in der Fußnote dokumentiert.'
- source_word: יחזיק צנה
  choice: erhebt er den Schild
  rationale: Wörtlich wird der Schild ergriffen beziehungsweise festgehalten. „Den Schild erheben“ gibt die militärische Handlung in würdigem, natürlichem Deutsch wieder, ohne die Größe des Schildes eigens festzulegen.
