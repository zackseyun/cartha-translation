  text: Every counselor waves his hand[b][a], but there is a counselor whose advice is for himself.
translation:
  language: de
  text: Jeder Ratgeber hebt die Hand[a]; doch mancher erteilt Rat zu seinem eigenen Vorteil.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder sinngemäßer: „Jeder Ratgeber weiß Rat anzubieten.“ Das Hebräische spricht wörtlich vom Erheben oder Bewegen der Hand.'
    reason: lexical_alternative
  - marker: b
    text: 'Der hebräische Wortlaut am Versende ist in der vorliegenden Überlieferung schwierig. Die griechische Parallele lautet: „Doch es gibt einen, der für sich selbst Rat erteilt“, und stützt den hier wiedergegebenen Sinn.'
    reason: textual_variant
lexical_decisions:
- source_word: כל יועץ
  choice: Jeder Ratgeber
  rationale: 'Die distributive Wiedergabe entspricht dem sprichwortartigen Sinn: Jeder, der als Ratgeber auftritt. „Ratgeber“ bewahrt den Weisheitsliteratur-Ton und ist im modernen Deutsch geläufig.'
- source_word: יניף יד
  choice: hebt die Hand
  rationale: Die hebräische Wendung bezeichnet wörtlich eine Bewegung beziehungsweise ein Erheben der Hand. Die bildhafte, im Zusammenhang etwas dunkle Formulierung bleibt im Haupttext erhalten; der Sinn des bereitwilligen Ratgebens wird durch den folgenden Satzteil erschlossen.
- source_word: אך
  choice: doch
  rationale: „Doch“ gibt den warnenden Gegensatz zur allgemeinen Aussage knapp und natürlich wieder.
- source_word: יש יועץ
  choice: mancher erteilt Rat
  rationale: Die hebräische Existenzkonstruktion wird idiomatisch als Hinweis auf eine bestimmte Art von Ratgeber wiedergegeben.
- source_word: דרך אל לץ
  choice: zu seinem eigenen Vorteil
  rationale: Der überlieferte hebräische Wortlaut ist an dieser Stelle schwierig und im Zusammenhang kaum sicher zu deuten. Die griechische Parallele εἰς αὐτόν („für sich selbst“) stützt die Aussage, dass der Rat dem Ratgeber selbst dient. „Zu seinem eigenen Vorteil“ macht diesen Ziel- beziehungsweise Nutzensinn im Deutschen verständlich.
