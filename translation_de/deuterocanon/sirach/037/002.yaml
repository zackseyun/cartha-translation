  text: Is there not grief that reaches to death[a], when a companion as your own soul turns into an enemy?
translation:
  language: de
  text: Gibt es nicht Kummer, der bis zum Tod reicht, wenn ein Gefährte, der dir so nah ist wie deine eigene Seele,[a] zum Feind wird?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „ein Gefährte wie deine eigene Seele“; die griechische Parallelfassung hat: „ein Gefährte und Freund“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הלא
  choice: Gibt es nicht
  rationale: Leitet eine rhetorische Frage ein, die Zustimmung erwartet; das griechische οὐχί bestätigt den Fragecharakter.
- source_word: דין
  choice: Schmerz
  rationale: Im Zusammenhang mit „bis an den Tod reicht“ bezeichnet das Wort seelischen Schmerz, nicht ein gerichtliches Urteil; das griechische λύπη stützt diese Bedeutung.
- source_word: מגיע אל מות
  choice: bis an den Tod reicht
  rationale: Bewahrt das hebräische Bild einer bis zum Tod reichenden Not und entspricht dem griechischen ἕως θανάτου.
- source_word: רע
  choice: Gefährte
  rationale: Bezeichnet hier einen eng verbundenen Menschen. „Gefährte“ hält die persönliche Nähe fest, ohne כנפשך vorwegzunehmen.
- source_word: כנפשך
  choice: der dir wie dein eigenes Leben ist
  rationale: Gibt das wörtliche Bild „wie deine eigene Seele/dein eigenes Leben“ verständlich wieder und bewahrt die starke persönliche Nähe des Hebräischen.
- source_word: נהפך לצר
  choice: zum Feind wird
  rationale: Bringt sowohl den Umschlag der Beziehung als auch die persönliche Feindschaft natürlich und prägnant zum Ausdruck.
