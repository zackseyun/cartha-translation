translation_notes:
  register: Moderne, würdevolle Standardsprache. Die rhetorische Frage und das Bild einer bis zum Tod reichenden seelischen Not bleiben erhalten; die ungewöhnlich starke Wendung כנפשך wird im Haupttext bewahrt und in der Fußnote erläutert.
