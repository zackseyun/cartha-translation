  text: But with one whose heart is like your heart[a], if you stumble[b], he will be affected also.
translation:
  language: de
  text: 'Doch bei einem, dessen Herz deinem Herzen gleicht[a], gilt: Wenn du strauchelst, wird es ihn erreichen.[b][c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „dessen Herz wie dein Herz ist“. Gemeint sein kann ein Mensch, der dieselbe innere Haltung oder Gesinnung hat wie du.'
    reason: lexical_alternative
  - marker: b
    text: 'Der letzte Satz ist im Hebräischen sehr knapp; wörtlich etwa: „Wenn du strauchelst, wird es ihn erreichen.“ Was genau ihn erreicht, bleibt unausgesprochen — möglicherweise der Fehltritt oder dessen Folgen.'
    reason: ambiguity
  - marker: c
    text: Die griechische Überlieferung hat an dieser Stelle einen grundlegend anderen Text über Veränderungen des Herzens, Gutes und Böses, Leben und Tod sowie die Macht der Zunge.
    reason: textual_variant
lexical_decisions:
- source_word: אך
  choice: Doch
  rationale: Kennzeichnet den Gegensatz beziehungsweise die Einschränkung gegenüber dem vorausgehenden Rat, ohne die knappe hebräische Aussage auszuweiten.
- source_word: עם
  choice: mit einem
  rationale: Die Präposition bezeichnet hier die Person, auf die sich der Rat bezieht. Das im Hebräischen nicht ausdrücklich genannte Personenwort wird im Deutschen durch „einem“ ergänzt.
- source_word: לבבו כלבבך
  choice: dessen Herz deinem Herzen gleicht
  rationale: Bewahrt das hebräische Bild vom „Herzen“ als innerer Haltung, Absicht und Urteilsvermögen, klingt dabei im heutigen Deutschen würdig und verständlich.
- source_word: אם תכשל
  choice: Wenn du strauchelst
  rationale: „Straucheln“ erhält die Bildsprache und lässt offen, ob ein Fehltritt, ein Scheitern oder eine Notlage gemeint ist.
- source_word: יגיע אליו
  choice: wird es auch ihn erreichen
  rationale: Die knappe Formulierung und das unausgesprochene Subjekt des Hebräischen bleiben erhalten. „Es“ verweist auf das Straucheln beziehungsweise dessen Folgen, ohne deren genaue Art festzulegen; „auch“ verdeutlicht, dass die Auswirkung den Gleichgesinnten mitbetrifft.
theological_decisions:
- issue: Bedeutungsumfang von לבב
  choice: Herz
  alternative: Gesinnung; Inneres; Verstand
  rationale: „Herz“ bewahrt die hebräische Anthropologie, in der das Wort nicht nur Gefühle, sondern auch Denken, Wollen und innere Ausrichtung umfasst.
- issue: Unausgesprochenes Subjekt in יגיע אליו
  choice: wird es auch ihn erreichen
  alternative: wird es auch ihn treffen; wird auch er davon betroffen sein
  rationale: Die Übersetzung erhält die Unbestimmtheit des hebräischen Subjekts und löst nicht vorschnell auf, ob der Fehltritt selbst, seine Folgen oder eine daraus entstehende Not den anderen erreicht.
- issue: Stark abweichende griechische Überlieferung
  choice: Der hebräische Text bildet die Grundlage; die Abweichung wird in einer Fußnote kenntlich gemacht.
  alternative: Dem griechischen Paralleltext folgen
  rationale: Der angegebene hebräische Text ist mit hoher Sicherheit bezeugt und ausdrücklich als Primärquelle vorgegeben. Die griechische Fassung bietet an dieser Stelle einen inhaltlich ganz anderen Wortlaut und kann nicht stillschweigend mit dem Hebräischen harmonisiert werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter hebräischer Bildsprache. Die leicht elliptische Eröffnung spiegelt die knappe Form des Ausgangstextes; der Doppelpunkt macht den Zusammenhang im Deutschen lesbar. Die sachliche Unbestimmtheit des Schlusssatzes wird nicht durch eine eindeutige Deutung ersetzt.
