  text: It is easier to carry sand and salt and a lump of iron than a senseless man[a].
translation:
  language: de
  text: Sand, Salz und einen Eisenklumpen kann man leichter tragen als einen unverständigen Menschen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: einen törichten, einsichtslosen oder vernunftlosen Menschen.'
    reason: Lexikalische Alternativen für ἀσύνετον, dessen Bedeutung zwischen fehlender Einsicht, Unvernunft und Torheit liegt.
lexical_decisions:
- source_word: ἄμμον
  choice: Sand
  rationale: Das griechische Substantiv wird als Stoffbezeichnung natürlich mit dem deutschen Massennomen „Sand“ wiedergegeben.
- source_word: ἅλα
  choice: Salz
  rationale: Die griechische Form wird hier kollektiv gebraucht; „Salz“ entspricht dem im Deutschen idiomatisch.
- source_word: βῶλον σιδήρου
  choice: einen Eisenklumpen
  rationale: βῶλος bezeichnet einen Klumpen oder eine Masse; das Kompositum „Eisenklumpen“ bewahrt das konkrete Bild knapp und natürlich.
- source_word: εὔκοπον
  choice: leichter
  rationale: Obwohl das Adjektiv grundsätzlich „leicht“ bedeutet, verlangt der mit ἤ gebildete Vergleich im Deutschen den Komparativ „leichter“.
- source_word: ὑπενεγκεῖν
  choice: tragen
  rationale: Bei den konkret genannten Stoffen erhält „tragen“ das körperliche Lastbild; zugleich klingt die übertragene Bedeutung des Ertragens mit.
- source_word: ἄνθρωπον
  choice: Menschen
  rationale: ἄνθρωπος bezeichnet hier einen einzelnen Menschen. Das deutsche „Mensch“ gibt den Begriff genau wieder, ohne ein biologisches Geschlecht zu behaupten, das die Aussage nicht eigens thematisiert.
- source_word: ἀσύνετον
  choice: unverständigen
  rationale: ἀσύνετος bezeichnet jemanden, dem Einsicht oder Verständnis fehlt. „Unverständig“ bewahrt diese weisheitliche Bedeutung und vermeidet die moderne, auf Intelligenzmessung bezogene Färbung von „unintelligent“.
theological_decisions:
- issue: Bedeutungsnuance von ἀσύνετον
  choice: unverständigen
  alternative: törichten; einsichtslosen; vernunftlosen
  rationale: Der Vers beanstandet mangelnde Einsicht, ohne notwendig moralische Bosheit oder geringe messbare Intelligenz zu behaupten. „Unverständig“ lässt diese Spannung bestehen.
- issue: Wiedergabe von ἄνθρωπον
  choice: einen … Menschen
  alternative: einen … Mann
  rationale: Das griechische ἄνθρωπος kann einen Menschen allgemein bezeichnen; das grammatische Maskulinum allein erzwingt im Deutschen keine geschlechtsspezifische Aussage. Der Singular und der persönliche Bezug bleiben erhalten.
- issue: Konkretes Tragen und übertragenes Ertragen
  choice: tragen
  alternative: ertragen
  rationale: Die Reihe Sand, Salz und Eisenklumpen legt zunächst körperliches Tragen nahe; beim Menschen entsteht zugleich eine übertragene Pointe. „Tragen“ erhält beides, ohne die Metapher aufzulösen.
translation_notes:
  register: Moderne, würdige Spruchsprache mit klarer Satzstellung. „Eisenklumpen“ hält das anschauliche Gewicht der Aufzählung fest; „unverständig“ ist allgemein verständlich, aber nicht umgangssprachlich oder IQ-bezogen.
