  text: Who will set a guard over my mouth, and a shrewd seal over my lips, so that I may not fall because of it, and my tongue destroy me?
translation:
  language: de
  text: Wer gibt mir über meinen Mund eine Wache und über meine Lippen ein kluges Siegel, damit ich nicht durch sie zu Fall komme und meine Zunge mich zugrunde richtet?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische „sie“ ist feminin. Es kann sich auf das zuvor genannte „Siegel“ beziehen oder vorausweisend auf die anschließend genannte „Zunge“; auch die genaue Nuance von „durch sie“ bleibt daher offen.
    reason: Bewahrt die grammatische und sachliche Mehrdeutigkeit von ἀπʼ αὐτῆς, ohne einen sprachlich nicht möglichen maskulinen Bezug auf „Mund“ festzulegen.
lexical_decisions:
- source_word: φυλακήν
  choice: eine Wache
  rationale: Gibt das Bild einer bewachenden Schutzvorrichtung am Mund unmittelbar und natürlich wieder.
- source_word: σφραγῖδα πανοῦργον
  choice: ein kluges Siegel
  rationale: πανοῦργος bezeichnet hier ein zweckmäßig-kluges beziehungsweise raffiniert wirksames Siegel; „klug“ wahrt die positive Bedeutung im Kontext, ohne eine moralisch negative List einzutragen.
- source_word: πέσω
  choice: zu Fall komme
  rationale: Bewahrt die bildhafte Bedeutung von πίπτω und lässt offen, ob ein moralischer Fehltritt oder dessen schädliche Folgen gemeint sind.
- source_word: ἀπολέσῃ με
  choice: mich ins Verderben stürzt
  rationale: Drückt die starke, potenziell umfassende Schädigung durch die Zunge idiomatisch aus, ohne sie zwingend auf den körperlichen Tod einzuengen.
theological_decisions:
- issue: Bezug des Pronomens αὐτῆς
  choice: „durch ihn“ mit Fußnote zur Mehrdeutigkeit
  alternative: „durch sie“ beziehungsweise „wegen meiner Zunge“
  rationale: Das feminine αὐτῆς kann grammatisch auf „Zunge“ bezogen werden, obwohl diese erst im anschließenden Satzglied ausdrücklich genannt wird; inhaltlich ist auch ein Rückbezug auf den Mund beziehungsweise das Reden möglich. Die Übersetzung folgt dem naheliegenden Sinn des Mundes beziehungsweise des Redens und macht die echte Mehrdeutigkeit transparent.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorische Bitte bleibt knapp und bildhaft; „Wer setzt“ ist im heutigen Deutsch natürlicher als das formalere „Wer wird mir geben“ und gibt die idiomatische Funktion von τίς δώσει μοι wieder.
