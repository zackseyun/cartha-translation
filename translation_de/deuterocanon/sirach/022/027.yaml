  - severity: low
    issue: Fußnote nennt den möglichen Bezug auf das Siegel nicht
    rationale: Da σφραγῖς das im griechischen Satz ausdrücklich vorausgehende feminine Substantiv ist, sollte diese naheliegende Möglichkeit neben dem vorausweisenden Bezug auf γλῶσσα genannt werden.
