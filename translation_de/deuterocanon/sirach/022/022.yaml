base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/022/022.yaml
  text: If you open your mouth against a friend[a], do not be afraid, for there can be reconciliation—except in the case of insult and arrogance and the revealing of a secret and a treacherous blow; in these things every friend will flee.
translation:
  language: de
  text: Wenn du gegen einen Freund den Mund aufgetan hast, fürchte dich nicht[a]; denn Versöhnung ist möglich – außer bei Beleidigung, Überheblichkeit, der Preisgabe eines Geheimnisses und einem heimtückischen Schlag. Bei solchen Dingen wird jeder Freund fliehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sei nicht besorgt.“ Das griechische Verb kann Furcht oder vorsichtige Besorgnis ausdrücken. Der Zusammenhang macht deutlich, dass man die Hoffnung auf Versöhnung nicht aufgeben soll.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπὶ φίλον
  choice: gegen einen Freund
  rationale: Bei ἀνοίξῃς στόμα kann ἐπί mit Akkusativ eine gegen jemanden gerichtete Äußerung bezeichnen. Der anschließende Hinweis auf Versöhnung setzt eine Verletzung der Freundschaft voraus.
- source_word: ἀνοίξῃς στόμα
  choice: den Mund aufgetan hast
  rationale: Die konkrete griechische Wendung bleibt erhalten; die Perfektform im deutschen Bedingungssatz verdeutlicht, dass auf eine bereits geschehene Äußerung Versöhnung folgen kann.
- source_word: μὴ εὐλαβηθῇς
  choice: fürchte dich nicht
  rationale: εὐλαβέομαι kann Furcht oder vorsichtige Besorgnis bezeichnen. Die relativ formale Wiedergabe bewahrt diese Bedeutung, ohne die kontextuelle Folgerung ‚verzweifle nicht‘ in den Haupttext einzutragen.
- source_word: διαλλαγή
  choice: Versöhnung
  rationale: Das Wort bezeichnet die Wiederherstellung einer gestörten Beziehung.
- source_word: πλὴν
  choice: außer bei
  rationale: πλήν führt hier die Vergehen ein, die von der zuvor genannten Möglichkeit der Versöhnung ausgenommen werden.
- source_word: ὀνειδισμοῦ
  choice: Beleidigung
  rationale: Gemeint ist eine beschämende oder schmähende Äußerung; ‚Beleidigung‘ ist im modernen Deutschen klar und natürlich.
- source_word: ὑπερηφανίας
  choice: Überheblichkeit
  rationale: Die Wahl bezeichnet Hochmut in seiner verletzenden, auf andere herabsehenden Ausprägung.
- source_word: μυστηρίου ἀποκαλύψεως
  choice: der Preisgabe eines Geheimnisses
  rationale: μυστήριον bezeichnet hier eine vertrauliche Sache, nicht ein theologisches Mysterium; ἀποκάλυψις ist deren Offenlegung.
- source_word: πληγῆς δολίας
  choice: einem heimtückischen Schlag
  rationale: Die Formulierung bewahrt sowohl den Gedanken der Verletzung als auch den der Arglist; ob der Schlag wörtlich oder bildlich gemeint ist, bleibt offen.
- source_word: ἐν τούτοις ἀποφεύξεται πᾶς φίλος
  choice: Bei solchen Dingen wird jeder Freund fliehen
  rationale: Die distributive Kraft von πᾶς φίλος und das starke Sich-Entfernen in ἀποφεύξεται werden knapp wiedergegeben.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die leicht bildhafte Wendung „den Mund auftun“ bewahrt die Ausdrucksweise des Griechischen; die Aufzählung bleibt knapp und parallel. Der Gedankenstrich markiert den scharfen Übergang zu den Ausnahmen.
