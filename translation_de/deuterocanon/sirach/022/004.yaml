    rationale: ἀνήρ bezeichnet hier, wie auch die wörtliche Formulierung mit αὐτῆς nahelegt, einen Ehemann. „Einen Ehemann erlangen“ vermeidet eine unnötige Offenheit von „Mann“ und klingt weniger nach persönlichem Werben als „gewinnen“.
