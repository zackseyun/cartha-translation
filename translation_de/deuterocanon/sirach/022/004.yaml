base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/022/004.yaml
  text: A prudent daughter will obtain a husband[a], but one who brings shame is a grief to the one who fathered her.
translation:
  language: de
  text: Eine verständige Tochter wird einen Ehemann erlangen[a]; eine aber, die Schande bringt, wird ihrem Vater zum Kummer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „wird ihren Mann erben“. Gemeint ist wohl, dass sie einen Ehemann erlangt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: θυγάτηρ
  choice: Tochter
  rationale: Direkte Wiedergabe des griechischen Verwandtschaftsbegriffs.
- source_word: φρονίμη
  choice: verständig
  rationale: Bezeichnet praktische Einsicht und vernünftiges Urteilsvermögen; im heutigen Deutsch natürlicher als „klug“ oder das stärker vorausplanende „umsichtig“.
- source_word: κληρονομήσει
  choice: wird … gewinnen
  rationale: Das Verb bedeutet wörtlich „wird erben“. Mit „einen Mann“ als Objekt ist hier jedoch sinngemäß das Erlangen eines Ehemanns gemeint; „gewinnen“ gibt dies verständlich wieder, ohne die ungewöhnliche Grundbedeutung zu verschweigen.
- source_word: ἄνδρα αὐτῆς
  choice: einen Mann
  rationale: ἀνήρ kann „Mann“ oder „Ehemann“ bedeuten. Im Zusammenhang ist eine eheliche Beziehung gemeint; „einen Mann gewinnen“ ist im Deutschen zugleich natürlich und wahrt etwas von der Ausdrucksweise des Griechischen.
- source_word: ἡ καταισχύνουσα
  choice: eine aber, die Schande macht
  rationale: Das aktive Partizip bezeichnet eine Tochter, die Schande hervorruft beziehungsweise ihrem Umfeld Schande bereitet; die verbale Form erhält diese aktive Aussage.
- source_word: εἰς λύπην
  choice: bereitet … Kummer
  rationale: 'Die Wendung bezeichnet das Ergebnis oder die Wirkung: Sie wird dem Erzeuger zum Kummer. Die gewählte Form ist natürliches modernes Deutsch.'
- source_word: γεννήσαντος
  choice: ihrem Vater
  rationale: Das maskuline singularische Partizip bedeutet wörtlich „dem, der [sie] gezeugt hat“. „Ihrem Vater“ gibt den männlichen Bezug knapp und eindeutig wieder.
theological_decisions:
- issue: Geschlechtsspezifischer Elternbezug in γεννήσαντος
  choice: ihrem Vater
  alternative: dem, der sie gezeugt hat / ihrem Elternteil
  rationale: Das griechische Partizip steht im Maskulinum Singular. „Vater“ bewahrt diesen geschlechtsspezifischen Bezug und vermeidet eine sachlich nicht begründete Neutralisierung.
- issue: Mehrdeutigkeit von κληρονομήσει
  choice: wird … gewinnen, mit Fußnote zur wörtlichen Bedeutung
  alternative: wird ihren Mann erben
  rationale: Eine rein wörtliche Wiedergabe wäre im Deutschen missverständlich. Die idiomatische Haupttextfassung vermittelt den wahrscheinlichen Sinn, während die Fußnote die auffällige griechische Wortwahl transparent erhält.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der zweite Halbvers ist knapp und sprichwortartig formuliert. Der männliche Bezug des griechischen γεννήσαντος bleibt mit „Vater“ erhalten; die ungewöhnliche Bildsprache von κληρονομήσει wird in einer Fußnote offengelegt.
