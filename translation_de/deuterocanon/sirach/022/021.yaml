  text: If you draw a sword against a friend[a], do not despair[b], for there can be a return.
translation:
  language: de
  text: Wenn du gegen einen Freund das Schwert ziehst, verzweifle nicht; denn es gibt einen Weg zurück.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »denn es gibt eine Rückkehr«; auch: »denn Wiederherstellung ist möglich«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπὶ φίλον
  choice: gegen einen Freund
  rationale: Bei einer feindseligen Handlung bezeichnet ἐπί mit Akkusativ hier die Richtung gegen eine Person; die deutsche Wendung gibt dies klar und natürlich wieder.
- source_word: ἐὰν σπάσῃς
  choice: wenn du … ziehst
  rationale: σπάω bedeutet »ziehen« oder »herausziehen« und bildet mit ῥομφαία die übliche Vorstellung, ein Schwert zu ziehen.
- source_word: ῥομφαίαν
  choice: das Schwert
  rationale: ῥομφαία bezeichnet ein Schwert, möglicherweise ein großes oder breites; »Schwert« wahrt das Bild, ohne die Größe unnötig festzulegen.
- source_word: μὴ ἀπελπίσῃς
  choice: verzweifle nicht
  rationale: Die knappe Aufforderung gibt die Bedeutung »nicht verzweifeln, die Hoffnung nicht aufgeben« und die imperativische Kraft des Griechischen wieder.
- source_word: ἔστιν γὰρ ἐπάνοδος
  choice: denn es gibt einen Weg zurück
  rationale: ἐπάνοδος bezeichnet wörtlich eine Rückkehr. »Ein Weg zurück« klingt im Deutschen natürlich, bewahrt die Metapher und lässt offen, ob eine vollständige Versöhnung gemeint ist.
theological_decisions:
- issue: Wiederherstellung einer Freundschaft nach einer schweren Verfehlung
  choice: Die Aussage lässt auch nach dem Ziehen des Schwertes einen Weg zurück offen.
  alternative: Man könnte ἐπάνοδος ausdrücklich als »Versöhnung« oder »Wiederherstellung« deuten.
  rationale: Der Kontext legt eine Wiederherstellung der Beziehung nahe, doch das griechische Wort sagt lediglich »Rückkehr«. Die Übersetzung bewahrt diese Offenheit und löst die Spannung nicht zugunsten einer ausdrücklich garantierten vollständigen Versöhnung auf.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdig-knapper Weisheitssprache. Das konkrete Kampfesbild bleibt erhalten; die abschließende Formulierung ist idiomatisch, ohne die mögliche Rückkehr vorschnell als vollständige Versöhnung festzulegen.
