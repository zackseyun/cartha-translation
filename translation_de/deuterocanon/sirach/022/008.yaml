base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/022/008.yaml
  text: Telling a story to one who is drowsy is like telling it to a fool[a], and at the end he will say, “What was it?”
translation:
  language: de
  text: 'Einem Schläfrigen etwas zu erzählen ist, als erzählte man es einem Toren[a]; am Ende wird er sagen: »Was ist das?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Text ist in seiner Form etwas schwerfällig und wiederholt das Partizip »der Erzählende« (διηγούμενος … ὁ διηγούμενος). Gemeint ist offenbar ein Vergleich: Einem Schläfrigen etwas zu erzählen ist wie einem Toren etwas zu erzählen.'
    reason: textual_variant
lexical_decisions:
- source_word: 'διηγούμενος (Lemma: διηγέομαι)'
  choice: etwas zu erzählen / erzählte man
  rationale: Das Verb bezeichnet ausführliches Erzählen oder Berichten. Die deutsche Formulierung gibt die im Griechischen wiederholte Partizipialkonstruktion als verständlichen Vergleich wieder.
- source_word: νυστάζοντι
  choice: einem Schläfrigen
  rationale: Das Wort bezeichnet jemanden, der schläfrig ist oder einnickt. »Einem Schläfrigen« ist knapp, natürlich und bewahrt das Bild mangelnder Aufmerksamkeit.
- source_word: μωρῷ
  choice: einem Toren
  rationale: In der Weisheitsliteratur bezeichnet μωρός einen Menschen, dem praktische und sittliche Einsicht fehlt. »Tor« entspricht diesem biblischen Bedeutungsfeld besser als eine rein intellektuelle Abwertung.
- source_word: ἐπὶ συντελείᾳ
  choice: am Ende
  rationale: Die Wendung bezeichnet den Abschluss der Erzählung; »am Ende« ist im Deutschen klar und idiomatisch.
- source_word: Τί ἐστιν;
  choice: Was ist es?
  rationale: Die Wiedergabe folgt der knappen Präsensfrage des Griechischen und lässt ihre abrupte, kontextuell leicht mehrdeutige Form bestehen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit einer in der Weisheitsliteratur vertrauten Wortwahl. Die ungewöhnliche griechische Syntax wird im Haupttext verständlich als Vergleich wiedergegeben und in der Fußnote offengelegt.
