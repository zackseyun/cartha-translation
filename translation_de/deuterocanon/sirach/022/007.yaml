translation:
  language: de
  text: Wer einen Toren belehrt, gleicht jemandem, der eine Tonscherbe klebt, und jemandem, der einen Schlafenden aus tiefem Schlaf weckt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Im Griechischen stehen zwei parallele Partizipien: wörtlich etwa „einer, der eine Tonscherbe klebt, [einer, der] einen Schlafenden aus tiefem Schlaf weckt“. Ein ausdrückliches „gleicht“ bzw. „ist wie“ steht dort nicht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: συγκολλῶν
  choice: eine Tonscherbe klebt
  rationale: Das Partizip bezeichnet das Zusammenfügen oder Verkleben. „klebt“ bewahrt das konkrete Bild, ohne mit „repariert“ dessen Deutung vorwegzunehmen.
- source_word: ὄστρακον
  choice: eine Tonscherbe
  rationale: Der griechische Singular bezeichnet hier ein Stück gebrannten Tons beziehungsweise eine Scherbe. Der deutsche Singular folgt der Vorlage und erhält das sprichwörtliche Bild.
- source_word: ὁ διδάσκων
  choice: Wer … belehrt
  rationale: Das substantivierte Partizip bezeichnet allgemein denjenigen, der lehrt. Die Konstruktion mit „Wer“ gibt diese allgemeine Aussage in natürlichem Deutsch wieder.
- source_word: μωρόν
  choice: einen Toren
  rationale: μωρός bezeichnet in der Weisheitsliteratur einen törichten Menschen in sittlicher wie verstandesmäßiger Hinsicht. „Tor“ ist dafür der etablierte, würdige Weisheitsbegriff.
- source_word: ἐξεγείρων
  choice: weckt
  rationale: Das Wort bedeutet aufwecken oder aufrütteln; „weckt“ ist hier die klare und konkrete deutsche Entsprechung.
- source_word: καθεύδοντα
  choice: einen Schlafenden
  rationale: Das Partizip bezeichnet ausdrücklich einen schlafenden Menschen. „einen Schlafenden“ bewahrt diese Bedeutung und passt zur parallelen Bildform.
- source_word: ἐκ βαθέος ὕπνου
  choice: aus tiefem Schlaf
  rationale: Die Wendung bezeichnet einen tiefen Schlaf; die gewählte Form ist knapp, idiomatisch und bedeutungsgetreu.
