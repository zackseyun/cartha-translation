  to: Gewinne in der Armut mit deinem Nächsten Vertrauen[a], damit du dich zusammen mit ihm an seinen Gütern[b] sättigen kannst. Halte in einer Zeit der Bedrängnis zu ihm, damit du mit ihm an seinem Erbe miterbst.
