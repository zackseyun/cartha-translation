  yaml_path: translation/deuterocanon/sirach/022/023.yaml
  text: Gain faith with your neighbor in poverty[a], so that in his good things you may be filled together. In a time of distress remain with him[b], so that you may inherit along with him in his inheritance.
translation:
  language: de
  text: Gewinne in der Armut mit deinem Nächsten Vertrauen[a], damit du dich zusammen mit ihm an seinen Gütern[b] sättigen kannst. Halte in einer Zeit der Bedrängnis zu ihm, damit du mit ihm an seinem Erbe miterbst.
  philosophy: optimal-equivalence
  footnotes:
