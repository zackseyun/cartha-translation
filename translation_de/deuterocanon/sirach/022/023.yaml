review_pass:
  verdict: revise
  source_fidelity: 'Die Übersetzung gibt die Abfolge und den Grundgedanken des griechischen Textes insgesamt zuverlässig wieder: Armut und Bedrängnis stehen den Gütern und dem Erbe gegenüber, und die gemeinsame Teilhabe (ὁμοῦ; συν-) ist erhalten. In der ersten Zeile wird μετὰ τοῦ πλησίον jedoch durch den Genitiv „deines Nächsten“ nur indirekt wiedergegeben. Eine Formulierung mit „mit deinem Nächsten“ bewahrt die ausdrücklich genannte Beziehung klarer. Außerdem gibt „du ... teilhast“ das künftige Ergebnis weniger unmittelbar wieder als „du ... miterben wirst“ bzw. „mit ihm erben wirst“; die Revision behält dabei die Zuordnung „sein Erbe“ bei.'
  naturalness: „Vertrauen ... gewinnen“, „sich an Gütern sättigen“, „zu jemandem halten“ und „an einem Erbe teilhaben“ sind verständliches modernes Standarddeutsch in einem würdevollen Weisheitsspruch. „Gemeinsam mit ihm an seinem Erbe teilhast“ wirkt allerdings wegen der doppelten Umschreibung von Gemeinsamkeit und Teilhabe etwas schwerfällig. „Mit ihm an seinem Erbe beteiligt wirst“ ist flüssiger, wahrt aber die Bildlichkeit des Erbens weniger. Daher wird das Verb „miterben“ verwendet und in der Fußnote erläutert.
  terminology: πίστις ist hier angesichts des zwischenmenschlichen Kontextes angemessen mit „Vertrauen“ wiedergegeben; die mögliche Bedeutung „Treue“ bleibt in der Anmerkung erhalten. πλησίον wird sachgerecht als „Nächster“ wiedergegeben. ἀγαθά als „Güter“, θλῖψις als „Bedrängnis“ und κληρονομία als „Erbe“ sind treffend. „Miterben“ gibt συνκληρονομήσῃς prägnant wieder, ohne eine konfessionelle Deutung einzutragen.
  issues:
  - severity: medium
    issue: μετὰ τοῦ πλησίον wird in der ersten Aussage nicht ausdrücklich abgebildet.
    rationale: „Das Vertrauen deines Nächsten“ kann zwar das intendierte Verhältnis ausdrücken, macht aber aus der mit μετὰ bezeichneten Beziehung eine possessive Genitivkonstruktion. „Mit deinem Nächsten Vertrauen gewinnen“ erhält die Präposition und lässt zugleich die relationale Mehrdeutigkeit von πίστις bestehen.
  - severity: low
    issue: Die Wiedergabe von συνκληρονομήσῃς ist unnötig umschreibend.
    rationale: „Gemeinsam mit ihm an seinem Erbe teilhaben“ vermittelt den Sinn, doch „mit ihm an seinem Erbe miterben“ bildet die gemeinsame Erbschaft unmittelbarer ab und ist im formellen modernen Deutsch verständlich.
