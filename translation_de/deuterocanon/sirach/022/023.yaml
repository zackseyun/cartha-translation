    text: 'Oder: „Gewinne in der Armut mit deinem Nächsten Treue.“ πίστις kann hier Vertrauen oder Treue bezeichnen; „Glaube“ ist lexikalisch möglich, passt aber weniger gut zum zwischenmenschlichen Zusammenhang.'
    reason: lexical_alternative
  - marker: b
    text: „Seine Güter“ kann auch „sein Wohlergehen“ oder „seine guten Gaben“ bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστιν κτῆσαι
  choice: Erwirb dir … das Vertrauen
  rationale: κτάομαι mit Akkusativ bedeutet „erwerben, gewinnen“. Im zwischenmenschlichen Zusammenhang bezeichnet πίστις am natürlichsten das gewonnene Vertrauen; „Glaube“ wäre hier im Deutschen missverständlich, während „Treue“ eher die Eigenschaft als das beim Nächsten erworbene Vertrauen bezeichnet.
- source_word: ἐν πτωχείᾳ
  choice: in der Armut
  rationale: Die Wiedergabe folgt der Präpositionalfügung eng und legt nicht ausdrücklich fest, wessen Armut gemeint ist.
- source_word: μετὰ τοῦ πλησίον
  choice: deines Nächsten
  rationale: Bei der idiomatischen deutschen Fügung „Vertrauen bei/von jemandem gewinnen“ wird die Beziehung mit einem Genitiv ausgedrückt. „Nächster“ wahrt den etablierten, personbezogenen Sinn von πλησίον.
- source_word: ἐν τοῖς ἀγαθοῖς αὐτοῦ
  choice: an seinen Gütern
  rationale: Das substantivierte ἀγαθά kann Güter, gute Dinge oder Wohlergehen bezeichnen. „Güter“ passt zur Gegenüberstellung mit Armut, ohne ausschließlich Bargeld oder Besitz zu meinen.
- source_word: ὁμοῦ πλησθῇς
  choice: damit du dich zusammen mit ihm … sättigen kannst
  rationale: „Sich sättigen“ erhält das Bild von πληρόω, und „zusammen mit ihm“ gibt ὁμοῦ ausdrücklich wieder.
- source_word: ἐν καιρῷ θλίψεως
  choice: in einer Zeit der Bedrängnis
  rationale: θλῖψις bezeichnet Bedrängnis, Not oder Drangsal; „Bedrängnis“ ist würdig und im modernen Standarddeutsch verständlich.
- source_word: διάμενε αὐτῷ
  choice: Halte … zu ihm
  rationale: διαμένω drückt anhaltendes Bleiben aus; mit dem Dativ αὐτῷ geht es hier um beständige Verbundenheit. „Zu ihm halten“ vermittelt diesen loyalen Beistand natürlicher als das räumlich klingende „bei ihm bleiben“.
- source_word: συνκληρονομήσῃς
  choice: damit du gemeinsam mit ihm … teilhast
  rationale: Das mit συν- zusammengesetzte Verb bezeichnet gemeinsames Erben. Die Formulierung bewahrt den Gedanken gemeinsamer Teilhabe, ohne einen späteren theologischen Fachgebrauch von „Miterbe“ aufzurufen.
- source_word: ἐν τῇ κληρονομίᾳ αὐτοῦ
  choice: an seinem Erbe
  rationale: κληρονομία bedeutet Erbe, Erbteil oder Besitzanteil. „An seinem Erbe teilhaben“ ist im Deutschen natürlicher als „in seinem Erbe erben“ und erhält die ausdrückliche Zuordnung αὐτοῦ.
theological_decisions:
- issue: Bedeutung von πίστις in einem zwischenmenschlichen Weisheitsspruch
  choice: Vertrauen
  alternative: Treue; Glaube
  rationale: Der Kontext handelt vom loyalen Verhältnis zum Nächsten in Armut und Bedrängnis. Daher ist der relationale Sinn „Vertrauen“ wahrscheinlicher als der abstrakt-religiöse Sinn „Glaube“. „Treue“ bleibt möglich und wird in der Fußnote bewahrt.
- issue: Bild des gemeinsamen Erbens
  choice: gemeinsam mit ihm an seinem Erbe teilhaben
  alternative: mit ihm miterben
  rationale: Die Übersetzung bewahrt die gemeinsame Teilhabe des συνκληρονομέω, deutet das Erbe aber nicht als technischen heilsgeschichtlichen Begriff.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der parallel gebaute Weisheitsspruch bleibt erkennbar; idiomatische Wendungen wie „zu ihm halten“ und „an seinem Erbe teilhaben“ vermeiden unnötig hölzerne Gräzismen. Die unbestimmten Formulierungen „in der Armut“ und „in einer Zeit der Bedrängnis“ bewahren, dass der griechische Text an diesen Stellen den Betroffenen nicht ausdrücklich durch ein Possessivpronomen benennt.
