base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/022/002.yaml
  text: A lazy man is compared to a lump of dung[a]; everyone who picks it up will shake off his hand.
translation:
  language: de
  text: Ein fauler Mensch wird mit einem Klumpen Kot verglichen[a]; jeder, der ihn aufhebt, wird seine Hand ausschütteln.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, stärker räumlich verstanden: „ist mit einem Klumpen Kot zusammengeworfen worden“. Die hier gewählte vergleichende Bedeutung passt besser zur Form des Sprichworts.'
    reason: lexical_alternative
lexical_decisions:
- source_word: βολβίτῳ κοπρίων
  choice: mit einem Klumpen Kot
  rationale: βολβίς bezeichnet einen rundlichen Klumpen oder Ballen; der Genitiv κοπρίων bestimmt ihn hier als Kot. Die konkrete und absichtlich herabsetzende Bildsprache bleibt dadurch erhalten.
- source_word: συνεβλήθη
  choice: wird … verglichen
  rationale: Das Passiv von συμβάλλω kann in diesem sprichwörtlichen Zusammenhang vergleichend verstanden werden. Das deutsche Präsens gibt die allgemeingültige Aussage natürlich wieder; die mögliche räumlich-physische Lesart wird in der Fußnote bewahrt.
- source_word: ὀκνηρός
  choice: ein fauler Mensch
  rationale: Die Wendung gibt die Bedeutung „faul, träge“ in heutigem Standarddeutsch wieder, ohne das altertümlichere „Faulenzer“ oder „Träger“ zu verwenden.
- source_word: πᾶς ὁ ἀναιρούμενος αὐτόν
  choice: jeder, der ihn aufhebt
  rationale: ἀναιρέω bedeutet hier am ehesten „aufheben, aufnehmen“. Das maskuline Pronomen „ihn“ kann sich im Deutschen sowohl grammatisch auf den Kotklumpen als auch bildlich auf den faulen Menschen beziehen und bewahrt so die Verknüpfung des Vergleichs.
- source_word: ἐκτινάξει χεῖρα
  choice: wird seine Hand ausschütteln
  rationale: Das Futur und der Singular von χείρ werden beibehalten. „Die Hand ausschütteln“ beschreibt anschaulich die abwehrende Bewegung, mit der man anhaftenden Schmutz loswerden will.
