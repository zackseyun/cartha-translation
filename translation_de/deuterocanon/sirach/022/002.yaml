  source_fidelity: Die Übersetzung gibt die proverbiale Vergleichsaussage von συνεβλήθη angemessen wieder und bewahrt die in der Fußnote ausgewiesene, räumlich-physische Alternative. „Klumpen Kot“ trifft βολβίτῳ κοπρίων konkret und ohne die bewusst abwertende Bildlichkeit abzuschwächen. „Ihn“ kann, wie das griechische αὐτόν, sowohl den grammatisch maskulinen Kotklumpen als auch die bildlich gemeinte faule Person aufnehmen und erhält damit die beabsichtigte Verknüpfung.
  naturalness: Der Satz ist knapp, idiomatisch und für modernes Standarddeutsch gut verständlich. „Seine Hand ausschütteln“ ist in diesem bildhaften, sprichwörtlichen Kontext verständlich und bewahrt die knappe Konstruktion des Griechischen, ohne einen im Ausgangstext nicht genannten Gegenstand („den Schmutz“) hinzuzufügen.
  terminology: „Ein fauler Mensch“ ist eine natürliche, nicht unnötig altertümliche Wiedergabe von ὀκνηρός. „Kot“ entspricht dem drastischen κοπρίων besser als eine beschönigende Umschreibung. Es sind keine theologischen Fachbegriffe betroffen.
