translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Parallelstruktur. Die zweimalige Wendung »niemals standhalten« bildet die nachdrückliche griechische Verneinung in beiden Satzhälften ab. Das Bild bleibt konkret, während die Mehrdeutigkeit von διανόημα durch eine Fußnote offengehalten wird.
