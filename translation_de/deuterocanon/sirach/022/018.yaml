base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/022/018.yaml
  text: Stakes set on a height opposite the wind will never hold out[a]; so a timid heart, set on a foolish thought[b], will never hold out against any fear.
translation:
  language: de
  text: Pfähle, die auf einer Anhöhe dem Wind ausgesetzt sind,[a] werden niemals standhalten. Ebenso wird ein furchtsames Herz, das auf einem törichten Gedanken ruht,[b] angesichts jeder Furcht niemals standhalten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »dem Wind gegenüber« oder »gegen den Wind«. Das griechische Bild zeigt Pfähle, die dem Wind unmittelbar ausgesetzt sind.'
    reason: lexical_alternative
  - marker: b
    text: Das griechische Wort kann außer einem Gedanken auch eine Absicht oder einen Plan bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρακες
  choice: Pfähle
  rationale: Das Wort bezeichnet zugespitzte Pfähle oder Pflöcke. »Pfähle« gibt das konkrete Bild natürlich wieder, ohne den militärischen Beiklang von »Palisaden« einzutragen.
- source_word: ἐπὶ μετεώρου κείμενοι
  choice: auf einer Anhöhe … ausgesetzt
  rationale: Die Wendung beschreibt eine erhöhte und dadurch exponierte Lage. »Auf einer Anhöhe« ist im Deutschen anschaulich und vermeidet die missverständliche Vorstellung, die Pfähle schwebten in der Luft.
- source_word: κατέναντι ἀνέμου
  choice: dem Wind ausgesetzt
  rationale: Wörtlich stehen die Pfähle dem Wind gegenüber. Die gewählte Formulierung vermittelt in natürlichem Deutsch ihre unmittelbare Konfrontation mit dem Wind; die räumliche Nuance wird in der Fußnote bewahrt.
- source_word: οὐ μὴ ὑπομείνωσιν / οὐ μὴ ὑπομείνῃ
  choice: werden niemals standhalten / wird … niemals standhalten
  rationale: οὐ μή bezeichnet hier eine nachdrückliche Verneinung. »Niemals standhalten« wahrt diese Verstärkung und passt sowohl zum gegenständlichen Vergleich als auch zu seiner Anwendung auf das Herz.
- source_word: καρδία δειλή
  choice: ein furchtsames Herz
  rationale: δειλή bezeichnet Ängstlichkeit oder Mutlosigkeit. »Furchtsam« passt zum folgenden φόβος und vermeidet die stärker verurteilende Festlegung auf »feige«.
- source_word: ἐπὶ διανοήματος μωροῦ
  choice: das auf einem törichten Gedanken ruht
  rationale: διανόημα kann einen Gedanken, eine Absicht oder einen Plan bezeichnen. »Gedanke« hält diese Bedeutungsbreite weitgehend offen; »ruht auf« bewahrt zudem die bildliche Entsprechung zur unsicheren Lage der Pfähle.
- source_word: παντὸς φόβου
  choice: angesichts jeder Furcht
  rationale: 'Die Formulierung gibt die distributive Aussage wieder: Welche Furcht auch auftritt, das furchtsame Herz hält ihr nicht stand. »Angesichts« spiegelt zugleich das wiederholte κατέναντι, ohne im Deutschen unnatürlich zu klingen.'
