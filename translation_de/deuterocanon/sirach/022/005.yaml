  yaml_path: translation/deuterocanon/sirach/022/005.yaml
  text: A shameless woman brings shame on father and husband[a], and she will be dishonored by both.
translation:
  language: de
  text: Eine schamlose Frau bringt Schande über ihren Vater und ihren Mann[a], und von beiden wird sie entehrt werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Eine dreiste Frau“ oder „eine unverschämte Frau“. Das griechische Wort bezeichnet eine Frau, deren Auftreten von schamloser Dreistigkeit geprägt ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πατέρα
  choice: ihren Vater
  rationale: Das Substantiv ist direktes Objekt von καταισχύνει. Obwohl im Griechischen kein Possessivpronomen steht, macht das Deutsche die natürliche familiäre Beziehung mit „ihren“ idiomatisch deutlich.
- source_word: ἄνδρα
  choice: ihren Mann
  rationale: In der Verbindung mit „Vater“ und im Zusammenhang familiärer Ehre bezeichnet ἀνήρ am wahrscheinlichsten den Ehemann; „Mann“ ist im Deutschen hier natürlich und verständlich.
- source_word: καταισχύνει
  choice: bringt Schande über
  rationale: Die Wendung gibt die verursachende Bedeutung des Verbs wieder und klingt in modernem, würdigem Deutsch natürlich.
- source_word: ἡ θρασεῖα
  choice: eine schamlose Frau
  rationale: Das substantivierte feminine Adjektiv bezeichnet hier negativ eine durch Dreistigkeit oder Unverschämtheit geprägte Frau, nicht lobenswerten Mut.
- source_word: ὑπὸ ἀμφοτέρων
  choice: beide
  rationale: ἀμφότεροι verweist auf die beiden zuvor genannten Personen, Vater und Ehemann. Die aktive deutsche Formulierung benennt beide als Handelnde.
- source_word: ἀτιμασθήσεται
  choice: werden sie verachten
  rationale: Das Futur Passiv bezeichnet die ihr von beiden widerfahrende Entehrung oder Geringschätzung. „verachten“ gibt den konkreten zwischenmenschlichen Sinn natürlich wieder, auch wenn dadurch die formale Passivkonstruktion umgestellt wird.
