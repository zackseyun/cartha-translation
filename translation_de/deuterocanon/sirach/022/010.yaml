  text: Weep more sweetly over the dead[a], because he has found rest,
translation:
  language: de
  text: Weine sanfter[a] über einen Toten, denn er hat Ruhe gefunden,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „angenehmer“ oder „süßer“. Gemeint ist hier wahrscheinlich: weniger bitter oder gemäßigter weinen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἥδιον
  choice: sanfter
  rationale: Der Komparativ bedeutet wörtlich „angenehmer“ oder „süßer“. Beim Weinen wäre das im Deutschen missverständlich; „sanfter“ bewahrt die vergleichende Aussage und bringt zum Ausdruck, dass die Klage angesichts der gefundenen Ruhe weniger bitter ausfallen soll.
- source_word: κλαῦσον
  choice: weine
  rationale: Der Aoristimperativ von κλαίω fordert unmittelbar zum Weinen auf; „weine“ ist die klare und natürliche deutsche Entsprechung.
- source_word: ἐπὶ νεκρῷ
  choice: über einen Toten
  rationale: ἐπί mit dem Dativ bezeichnet hier den Gegenstand der Trauer. „Über einen Toten“ gibt dies idiomatisch wieder und wahrt den substantivierten Singular.
- source_word: ὅτι
  choice: denn
  rationale: Die Konjunktion leitet die Begründung der Aufforderung ein. „Denn“ erhält den kausalen Zusammenhang in einem würdigen, natürlichen Satzfluss.
- source_word: ἀνεπαύσατο
  choice: hat Ruhe gefunden
  rationale: Die mediale Form bezeichnet das Erlangen von Ruhe. „Hat Ruhe gefunden“ gibt den abgeschlossenen Zustand wieder, ohne eine im Griechischen nicht ausdrücklich genannte Bestattungs- oder Jenseitsvorstellung einzutragen.
theological_decisions:
- issue: Der Tod als Ruhe
  choice: hat Ruhe gefunden
  alternative: ist entschlafen / ist zur Ruhe gebettet worden
  rationale: Der Text beschreibt den Zustand des Toten in der Bildsprache der Ruhe, entfaltet aber keine nähere Lehre über das Leben nach dem Tod. Die Übersetzung erhält dieses Bild, ohne es dogmatisch zu präzisieren.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Sanfter“ vermeidet die im Deutschen befremdliche oder missverständliche wörtliche Formulierung „süßer weinen“, während die Fußnote die ungewöhnliche griechische Wortwahl offenlegt. Das abschließende Komma bleibt stehen, weil die vorgelegte griechische Quelle nur den ersten, syntaktisch fortgeführten Teil des Verses enthält.
