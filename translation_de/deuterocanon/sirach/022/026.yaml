base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/022/026.yaml
  text: And if harm comes to me through him[a], everyone who hears will guard himself from him.
translation:
  language: de
  text: Und wenn mir seinetwegen[a] Schlimmes widerfährt, wird jeder, der davon hört, sich vor ihm hüten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: durch ihn.'
    reason: διά mit Akkusativ ist hier vorwiegend kausal, doch „durch ihn“ kann die möglicherweise mitgemeinte Beteiligung der Person enger abbilden.
lexical_decisions:
- source_word: κακά
  choice: Schlimmes
  rationale: Der substantivierte neutrale Plural bezeichnet hier widrige Ereignisse oder Folgen. „Schlimmes“ ist natürlich und lässt offen, welcher Art das Unheil ist.
- source_word: μοι συμβήσεται
  choice: mir … widerfährt
  rationale: Der Dativ bezeichnet die betroffene Person; συμβαίνω meint hier „geschehen“ oder „widerfahren“. Die deutsche Wendung gibt beides knapp und idiomatisch wieder.
- source_word: διʼ αὐτόν
  choice: seinetwegen
  rationale: διά mit Akkusativ bezeichnet gewöhnlich Ursache oder Anlass. „Seinetwegen“ wahrt den Personenbezug, ohne die genaue Art seiner Beteiligung festzulegen.
- source_word: πᾶς ὁ ἀκούων
  choice: jeder, der davon hört
  rationale: Die substantivierte Partizipialkonstruktion ist distributiv und allgemein. „Davon“ macht im Deutschen idiomatisch den aus dem Zusammenhang erschließbaren Gegenstand des Hörens deutlich.
- source_word: φυλάξεται ἀπʼ αὐτοῦ
  choice: wird … sich vor ihm hüten
  rationale: Das Futur Medium mit ἀπό beschreibt eine zum eigenen Schutz eingenommene Vorsicht beziehungsweise Distanz. „Sich vor ihm hüten“ gibt diese reflexive Warnbedeutung natürlich wieder.
theological_decisions:
- issue: Allgemeine Personenbezeichnung in πᾶς ὁ ἀκούων
  choice: jeder, der davon hört
  alternative: alle, die davon hören
  rationale: Der griechische maskuline Singular ist generisch und distributiv. Das deutsche „jeder, der“ bildet diese Form und Bedeutung ab, ohne den Satz ausdrücklich auf Männer zu beschränken.
- issue: Art der durch διʼ αὐτόν bezeichneten Beteiligung
  choice: seinetwegen
  alternative: durch ihn
  rationale: Der Akkusativ nach διά legt eine kausale Bedeutung nahe, lässt aber offen, ob die Person unmittelbarer Urheber oder nur Anlass des Geschehens ist. Die Hauptfassung gibt den kausalen Sinn wieder; die Fußnote bewahrt die instrumentaler klingende Möglichkeit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Schlimmes widerfährt“ bewahrt den weiten Sinn des griechischen Ausdrucks; „sich vor ihm hüten“ ist klar und idiomatisch, ohne die Warnung zu überdeuten.
