  yaml_path: translation/deuterocanon/sirach/022/006.yaml
  text: Music during mourning is an untimely discourse[b][a], but beatings and discipline are wisdom at all times.
translation:
  language: de
  text: Musik während der Trauer ist eine Rede zur Unzeit[a]; Peitschenhiebe und Zurechtweisung aber sind zu jeder Zeit Weisheit.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »eine unpassende Darlegung« beziehungsweise »eine unpassende Erzählung«.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich steht im Griechischen die verkürzte Wendung »Peitschenhiebe und Zurechtweisung … der Weisheit«. Gemeint sein kann auch: »gehören zur Weisheit« oder »sind im Sinne der Weisheit angebracht«.'
    reason: source_ambiguity
lexical_decisions:
- source_word: μουσικὰ
  choice: Musik
  rationale: Der substantivierte neutrale Plural bezeichnet allgemein Musikalisches beziehungsweise Musizieren. »Musik« ist im Deutschen natürlich und engt den Ausdruck nicht auf Gesang ein.
- source_word: ἐν πένθει
  choice: während der Trauer
  rationale: Die Wendung bezeichnet den zeitlichen und situativen Rahmen. »Während der Trauer« gibt diesen klar und idiomatisch wieder.
- source_word: ἄκαιρος
  choice: zur Unzeit
  rationale: Das Adjektiv bezeichnet etwas, das nicht zur rechten Zeit geschieht. Die Wendung bewahrt den zeitlichen Akzent und den Gegensatz zu »zu jeder Zeit«.
- source_word: διήγησις
  choice: Rede
  rationale: Das Wort kann Erzählung, Darlegung oder Rede bedeuten. Im knappen Spruchzusammenhang ist »Rede« weit genug, ohne unnötig auf eine erzählende Gattung festzulegen.
- source_word: μάστιγες
  choice: Peitschenhiebe
  rationale: Der Plural bezeichnet Schläge mit einer Peitsche oder Geißel. »Peitschenhiebe« bewahrt den konkreten körperlichen Sinn deutlicher als das allgemeinere »Schläge«.
- source_word: παιδεία
  choice: Zurechtweisung
  rationale: In der Weisheitsliteratur umfasst παιδεία erziehende Unterweisung und korrigierende Disziplin. Neben »Peitschenhiebe« bringt »Zurechtweisung« den korrektiven Sinn natürlich zum Ausdruck, ohne ihn auf bloße Wissensvermittlung zu beschränken.
- source_word: ἐν παντὶ καιρῷ
  choice: zu jeder Zeit
  rationale: Die Formulierung bewahrt den ausdrücklichen Zeitbezug und bildet einen klaren Gegenpol zu »zur Unzeit«.
- source_word: σοφίας
  choice: sind ... Weisheit
  rationale: Der griechische Genitiv steht in einer stark verkürzten sprichwörtlichen Fügung. Die prädikative Wiedergabe wahrt deren Knappheit, während eine Fußnote die grammatische Mehrdeutigkeit offenlegt.
theological_decisions:
- issue: Ethische Aussage über körperliche Züchtigung
  choice: Den konkreten körperlichen Ausdruck ungemildert als »Peitschenhiebe« wiedergeben.
  alternative: μάστιγες abschwächend und metaphorisch als »Tadel« oder »Rügen« übersetzen.
  rationale: Der griechische Text nennt ausdrücklich Hiebe mit Peitsche oder Geißel und verbindet sie mit erziehender Zurechtweisung. Eine Abschwächung würde eine moderne ethische Bewertung in die Übersetzung eintragen.
- issue: Verhältnis von Zurechtweisung und Weisheit
  choice: Die elliptische Aussage knapp als »sind ... Weisheit« wiedergeben und ihre Offenheit in einer Fußnote erklären.
  alternative: 'Eindeutig paraphrasieren: »gehören zur Weisheit« oder »sind nach der Weisheit angebracht«.'
  rationale: Der Genitiv σοφίας lässt die genaue Beziehung unausgesprochen. Eine eindeutige Paraphrase würde die im Ausgangstext vorhandene Spannung vorschnell auflösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper sprichwörtlicher Struktur. »Rede zur Unzeit« und »zu jeder Zeit« erhalten den zeitlichen Gegensatz; die körperliche Härte des Ausgangstextes wird nicht beschönigt.
