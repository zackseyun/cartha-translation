  text: I will not be ashamed to shelter a friend[a], and from his presence I will certainly not hide myself,
translation:
  language: de
  text: Ich werde mich nicht schämen, einen Freund zu beschützen, und mich vor ihm ganz gewiss nicht verbergen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher kann die zweite Satzhälfte heißen: „Von seinem Angesicht werde ich keinesfalls verborgen sein.“ Das griechische Verb kann hier reflexiv („mich verbergen“) oder passiv („verborgen sein“) verstanden werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: φίλον
  choice: einen Freund
  rationale: Der Akkusativ Singular wird ohne ausdrückliches Possessivpronomen allgemein als Objekt gebraucht; „einen Freund“ bewahrt diese Unbestimmtheit.
- source_word: σκεπάσαι
  choice: zu beschützen
  rationale: σκεπάζω kann „bedecken“, „schützen“ oder „bergen“ bedeuten. Im Zusammenhang bezeichnet es am ehesten den schützenden Beistand für einen Freund; „beschützen“ ist im modernen Deutsch klar und natürlich.
- source_word: οὐκ αἰσχυνθήσομαι
  choice: Ich werde mich nicht schämen
  rationale: Die Form hat hier die geläufige Bedeutung „sich schämen“ und wird direkt und idiomatisch wiedergegeben.
- source_word: ἀπὸ προσώπου αὐτοῦ
  choice: vor ihm
  rationale: Die Wendung bedeutet wörtlich „von seinem Angesicht“ und idiomatisch „aus seiner Gegenwart/vor ihm“. „Vor ihm“ ist knapp, natürlich und erhält die räumlich-relationale Bildlichkeit.
- source_word: οὐ μὴ κρυβῶ
  choice: mich ganz gewiss nicht verbergen
  rationale: οὐ μή mit dem Aorist Konjunktiv drückt eine nachdrückliche Verneinung aus. κρυβῶ kann formal auch passiv verstanden werden; im Zusammenhang liegt die reflexive Bedeutung „mich verbergen“ nahe.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Aussage bleibt in der ersten Person und im Futur; die emphatische Verneinung wird durch „ganz gewiss nicht“ wiedergegeben. Das Komma des griechischen Verses wird als fortlaufender Satz bewahrt.
