  yaml_path: translation/deuterocanon/sirach/022/019.yaml
  text: One who pricks an eye brings forth tears[b][a], and one who pricks a heart reveals feeling.
translation:
  language: de
  text: Wer in ein Auge sticht, bringt Tränen hervor[a]; und wer in ein Herz sticht, macht das Empfinden offenbar[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „lässt Tränen fließen“; im Griechischen ist bildhaft davon die Rede, Tränen herabzubringen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „macht die Wahrnehmung offenbar“ beziehungsweise „bringt die Empfindung ans Licht“; das griechische Wort kann Wahrnehmung, Empfindung oder innere Sensibilität bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ νύσσων
  choice: wer … sticht
  rationale: Das Partizip bezeichnet ein Stechen mit etwas Spitzem. „Stechen“ bewahrt das konkrete Bild und lässt sich in beiden parallelen Satzgliedern natürlich verwenden, ohne die Handlung durch „durchbohren“ unnötig zu verstärken.
- source_word: ὀφθαλμόν
  choice: in ein Auge
  rationale: Der artikellose Singular ist generisch. Die deutsche Fügung „in ein Auge stechen“ gibt die betroffene Körperstelle idiomatisch wieder.
- source_word: κατάξει δάκρυα
  choice: bringt Tränen hervor
  rationale: Das Verb beschreibt hier, dass Tränen herabgebracht beziehungsweise zum Fließen gebracht werden. „Bringt Tränen hervor“ bewahrt die kausative und bildhafte Aussage in natürlichem Deutsch; das griechische Futur wird als allgemeingültige Folge präsentisch wiedergegeben.
- source_word: καρδίαν
  choice: in ein Herz
  rationale: Auch dieser artikellose Singular ist generisch. „Herz“ bezeichnet im Spruch zugleich das konkrete Bild und das Innere des Menschen.
- source_word: ἐκφαίνει
  choice: macht … offenbar
  rationale: Das Verb bedeutet, etwas Verborgenes hervortreten oder sichtbar werden zu lassen. „Macht offenbar“ gibt diesen Sinn klar und würdig wieder.
- source_word: αἴσθησιν
  choice: das Empfinden
  rationale: Das Substantiv kann Wahrnehmung, Empfindung oder innere Sensibilität bezeichnen. Im Zusammenhang mit dem Herzen trifft „Empfinden“ den inneren, gefühlsbezogenen Sinn, ohne die mögliche Bedeutungsbreite ganz auf eine einzelne Emotion zu verengen.
