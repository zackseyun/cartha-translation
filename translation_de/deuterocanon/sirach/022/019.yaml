  source_fidelity: 'Die Übersetzung folgt der griechischen Parallelstruktur genau: νύσσειν wird anschaulich und nicht übersteigert mit „stechen“ wiedergegeben; Auge und Herz bleiben als generische Einzelbilder erhalten. „bringt Tränen hervor“ gibt die bewirkte Tränenreaktion von κατάξει δάκρυα angemessen wieder. „macht das Empfinden offenbar“ entspricht ἐκφαίνει αἴσθησιν und wahrt die hier mögliche Spannweite von innerem Empfinden, Sensibilität und Wahrnehmung.'
