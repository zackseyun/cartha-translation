  terminology: „Empfinden“ ist für αἴσθησις im Zusammenhang mit „Herz“ eine sachgerechte, nicht konfessionell oder psychologisch überfestgelegte Wahl. Die Fußnote nennt die relevanten Alternativen „Wahrnehmung“ und „innere Sensibilität“ und bewahrt damit die lexikalische Offenheit. Die Fußnotenanker stehen jeweils bei der betreffenden Aussage.
