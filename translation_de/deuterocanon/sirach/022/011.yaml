  text: But for a fool[a], an evil life is worse than death.
translation:
  language: de
  text: Doch das schlimme Leben eines Toren[a] ist schlimmer als der Tod.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „das schlimme Leben eines Toren“; „schlimm“ kann hier auch „böse“ oder „elend“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦ δὲ μωροῦ
  choice: Doch … eines Toren
  rationale: δὲ setzt den milden Gegensatz fort und wird mit „Doch“ wiedergegeben. Der Genitiv τοῦ μωροῦ gehört am natürlichsten zu ἡ ζωή und bezeichnet daher das Leben „eines Toren“, nicht lediglich ein Leben „für einen Toren“.
- source_word: ὑπὲρ θάνατον
  choice: schlimmer als der Tod
  rationale: ὑπέρ mit Akkusativ drückt hier in der knappen spruchartigen Gegenüberstellung ein Übertreffen aus. Im Zusammenhang ist gemeint, dass dieses Leben schwerer beziehungsweise schlimmer ist als der Tod.
- source_word: ἡ ζωὴ πονηρά
  choice: das schlimme Leben
  rationale: πονηρά kann sowohl moralische Schlechtigkeit als auch eine leidvolle, üble Beschaffenheit bezeichnen. „Schlimm“ lässt im Deutschen beide Richtungen eher offen als das ausschließlich moralisch klingende „böse“ oder das rein erfahrungsbezogene „elend“.
theological_decisions:
- issue: Bedeutung von πονηρά im weisheitlichen Zusammenhang
  choice: „schlimm“ als bewusst weiter Ausdruck
  alternative: „böse“ oder „elend“
  rationale: Der griechische Wortlaut entscheidet nicht eindeutig zwischen moralischer Verkehrtheit und leidvoller Beschaffenheit. Die Übersetzung bewahrt diese Spannung, statt sie auf eine der beiden Deutungen festzulegen.
translation_notes:
  register: Knapp, spruchhaft und in modernem Standarddeutsch. Die bewusste Wiederholung von „schlimm“ und „schlimmer“ bildet sowohl πονηρά als auch den Vergleichssinn von ὑπὲρ θάνατον transparent ab; sie ist etwas markant, aber klar und würdig.
