base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/022/013.yaml
  text: Do not multiply words with a fool[a], and do not go to an unintelligent man. Keep away from him, so that you may not have trouble and may not be defiled by his shaking-off. Turn aside from him, and you will find rest, and you will not grow weary because of his madness.
translation:
  language: de
  text: Mach mit einem Toren nicht viele Worte, und geh nicht zu einem Einsichtslosen. Halte dich von ihm fern, damit du keine Mühe hast und nicht durch sein Umsichschlagen[a] verunreinigt wirst. Geh ihm aus dem Weg, dann wirst du Ruhe finden und an seinem Wahnsinn nicht müde werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hier mit »Umsichschlagen« wiedergegebene griechische Wort ist selten und schwer zu deuten. Es kann ein Abschütteln, heftiges Ausschlagen oder allgemeiner die störenden Ausbrüche und die verunreinigende Wirkung des Verhaltens bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ ἄφρονος μὴ πληθύνῃς λόγον
  choice: Mach bei einem Toren nicht viele Worte
  rationale: Die Wendung gibt das griechische Bild vom »Vermehren der Worte« als geläufiges, sprichwörtlich klingendes Deutsch wieder; »Tor« bewahrt die Kategorie der Weisheitsliteratur.
- source_word: πρὸς ἀσύνετον μὴ πορεύου
  choice: geh nicht zu einem Einsichtslosen
  rationale: »Geh nicht zu« erhält die im Verb πορεύου enthaltene Bewegung. »Einsichtsloser« bezeichnet fehlendes Verständnis beziehungsweise Urteilsvermögen, nicht bloß geringe Intelligenz.
- source_word: φύλαξαι ἀπʼ αὐτοῦ
  choice: Halte dich von ihm fern
  rationale: Der mediale Imperativ fordert zu selbstschützender Distanz auf; die deutsche Formulierung ist klar und natürlich.
- source_word: κόπον ἔχῃς
  choice: du keine Mühe hast
  rationale: κόπος kann Mühe, Belastung oder Beschwernis bezeichnen. »Mühe haben« bewahrt die knappe Ausdrucksweise.
- source_word: μολυνθῇς
  choice: verunreinigt wirst
  rationale: Das Wort bezeichnet Verunreinigung oder Befleckung und kann auch eine moralisch-soziale Färbung tragen; die starke Bildsprache bleibt erhalten.
- source_word: ἐν τῷ ἐντιναγμῷ αὐτοῦ
  choice: durch sein Umsichschlagen
  rationale: Das seltene Substantiv bezeichnet wohl ein Schütteln, Abschleudern oder heftiges Ausschlagen. »Umsichschlagen« erhält die körperlich-störende Bildlichkeit, ohne die unsichere Einzelbedeutung zu stark festzulegen.
- source_word: ἔκκλινον ἀπʼ αὐτοῦ
  choice: Geh ihm aus dem Weg
  rationale: Die idiomatische deutsche Wendung gibt sowohl das Abwenden als auch das Meiden wieder.
- source_word: ἀνάπαυσιν
  choice: Ruhe
  rationale: »Ruhe« ist die unmittelbare und im Zusammenhang natürliche Entsprechung für ἀνάπαυσις.
- source_word: οὐ μὴ ἀκηδιάσῃς
  choice: wirst ... nicht müde werden
  rationale: Die verstärkte Verneinung wird durch die sichere Zukunftsaussage wiedergegeben. ἀκηδιάω kann Ermüdung, Überdruss oder innere Erschöpfung bezeichnen; »müde werden« lässt diese Spannweite teilweise offen.
- source_word: ἐν τῇ ἀπονοίᾳ αὐτοῦ
  choice: an seinem Wahnsinn
  rationale: ἀπόνοια ist stärker als bloße Unklugheit und kann Torheit, Unvernunft oder Wahnsinn meinen. »Wahnsinn« bewahrt diese Intensität, ohne eine medizinische Diagnose zu behaupten.
