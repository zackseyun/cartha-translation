  yaml_path: translation/deuterocanon/sirach/022/020.yaml
  text: One who throws a stone at birds drives them away[b][a], and one who reproaches a friend will break up friendship.
translation:
  language: de
  text: Wer einen Stein nach Vögeln wirft, scheucht sie fort[a]; und wer einem Freund Vorwürfe macht[b], zerstört die Freundschaft.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „verjagt sie“. Das griechische Verb bezeichnet ein Fortscheuchen oder In-die-Flucht-Treiben.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „einen Freund beleidigt“ oder „schmäht“. Das griechische Verb kann sowohl einen Vorwurf als auch eine herabsetzende Äußerung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: βάλλων λίθον ἐπὶ πετεινὰ
  choice: Wer einen Stein nach Vögeln wirft
  rationale: Das Partizip wird entsprechend dem allgemeinen, sprichwörtlichen Sinn mit einem deutschen Relativsatz wiedergegeben. „Nach Vögeln werfen“ ist natürliches Deutsch für die zielgerichtete Handlung.
- source_word: ἀποσοβεῖ αὐτά
  choice: scheucht sie fort
  rationale: Das Verb bezeichnet das Verjagen oder In-die-Flucht-Treiben; „fortscheuchen“ bewahrt sowohl die Bewegung als auch den möglichen Aspekt des Erschreckens.
- source_word: ὁ ὀνειδίζων φίλον
  choice: wer einem Freund Vorwürfe macht
  rationale: ὀνειδίζω kann vorwerfen, schmähen oder beleidigen bedeuten. Die Formulierung hält den Bereich offen, klingt im Deutschen jedoch natürlich und gibt φίλον ohne unbegründetes Possessivpronomen wieder.
- source_word: διαλύσει φιλίαν
  choice: zerstört die Freundschaft
  rationale: διαλύω bezeichnet hier die Auflösung eines persönlichen Bundes beziehungsweise einer Beziehung. Das deutsche Präsens entspricht dem zeitlos-sprichwörtlichen Sinn des griechischen Futurs; „zerstört“ drückt die Folge klar aus.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer sprichwörtlicher Parallelstruktur. Das generische „wer …“ vermeidet schwerfällige substantivierte Partizipien. Die griechische Bedeutungsbreite von ἀποσοβέω und ὀνειδίζω wird durch Fußnoten offengehalten.
