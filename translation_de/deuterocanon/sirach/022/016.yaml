base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/022/016.yaml
  text: A wooden binding fastened into a building will not be loosened in an earthquake[c][b][a]; so a heart made firm by deliberate counsel will not lose courage in time of trouble.
translation:
  language: de
  text: Eine hölzerne Verbindung, die fest in ein Bauwerk eingebunden ist, wird bei einem Erdbeben nicht auseinanderfallen; ebenso wird ein Herz, das auf wohlüberlegtem Rat gefestigt ist, zur entscheidenden Zeit[a] nicht den Mut verlieren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „zu/in einer Zeit“. Gemeint sein kann der entscheidende Augenblick, besonders eine Zeit der Prüfung oder Not.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἱμάντωσις ξυλίνη
  choice: hölzerne Verstrebung
  rationale: ἱμάντωσις bezeichnet eine bindende oder zusammenhaltende Vorrichtung. Im baulichen Bild gibt „Verstrebung“ ihre tragende, verbindende Funktion natürlicher wieder als das im Deutschen missverständliche „Bindung“, ohne die genaue Konstruktionsform zu stark festzulegen.
- source_word: ἐνδεδεμένη εἰς οἰκοδομήν
  choice: in ein Bauwerk eingefügt
  rationale: Das Perfektpartizip bezeichnet die dauerhaft befestigte Einbindung in eine Konstruktion. „Eingefügt“ bewahrt diesen Gedanken in idiomatischem Deutsch.
- source_word: ἐν συσσεισμῷ
  choice: bei einem Erdbeben
  rationale: συσσεισμός bezeichnet heftige Erschütterung und hier am naheliegendsten ein Erdbeben.
- source_word: οὐ διαλυθήσεται
  choice: wird nicht auseinanderbrechen
  rationale: διαλύω kann lösen, zerlegen oder auseinanderfallen lassen bedeuten. Im Baukontext drückt „auseinanderbrechen“ das Versagen des verbundenen Bauteils anschaulich aus.
- source_word: καρδία
  choice: Herz
  rationale: „Herz“ bewahrt die biblische Bezeichnung für das innere Zentrum von Denken, Wollen und Mut.
- source_word: ἐστηριγμένη
  choice: gefestigt
  rationale: Das Perfektpartizip beschreibt einen hergestellten und fortdauernden Zustand innerer Festigkeit und führt zugleich das konstruktive Bild weiter.
- source_word: ἐπὶ διανοήματος βουλῆς
  choice: auf wohlüberlegtem Rat
  rationale: Die verdichtete Genitivverbindung verbindet den Gedanken des Überlegens bzw. Vorhabens mit Rat, Entschluss oder Planung. „Wohlüberlegter Rat“ bewahrt beide Aspekte, ohne eine einzige syntaktische Deutung absolut zu setzen.
- source_word: ἐν καιρῷ
  choice: zur entscheidenden Zeit
  rationale: καιρός meint eine bestimmte, passende oder kritische Zeit. Die Wiedergabe bleibt näher am ausdrücklichen Wortlaut als „in der Zeit der Not“, lässt aber den Kontext einer Bewährungsprobe anklingen.
- source_word: οὐ δειλιάσει
  choice: wird nicht den Mut verlieren
  rationale: Das Verb bezeichnet Furchtsam- oder Kleinmütigwerden. „Den Mut verlieren“ ist natürliches Deutsch und trifft den eintretenden Verlust innerer Standhaftigkeit.
theological_decisions:
- issue: Anthropologische Bedeutung von καρδία
  choice: Herz
  alternative: Inneres; Sinn
  rationale: Die traditionelle biblische Bildsprache bleibt erhalten und wird nicht auf bloßen Verstand oder bloßes Gefühl verengt.
- issue: Deutung von ἐν καιρῷ
  choice: zur entscheidenden Zeit
  alternative: in der Zeit der Not
  rationale: Der griechische Text nennt ausdrücklich nur die Zeit bzw. den entscheidenden Zeitpunkt. Die kontextuell mögliche Notlage wird nicht unmarkiert in den Haupttext aufgenommen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das Gleichnis bleibt strukturell parallel; technische Überpräzision wird vermieden. Der einzige Fußnotenmarker [a] steht unmittelbar bei der auslegungsbedürftigen Zeitangabe.
