base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/022/001.yaml
  text: A lazy man is compared to a filthy stone[b][a], and everyone will whistle at his disgrace.
translation:
  language: de
  text: Ein Fauler wird mit einem beschmutzten Stein verglichen[a], und jeder wird ihn wegen seiner Schande auspfeifen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit einem verdreckten/besudelten Stein“. Das seltene griechische Wort für den Zustand des Steins ist schwer zu bestimmen, bezeichnet aber eindeutig eine Verunreinigung.'
    reason: lexical_alternative
  - marker: b
    text: Das griechische Verb kann auch „auszischen“ bedeuten; gemeint ist jedenfalls eine verächtliche Reaktion.
    reason: lexical_alternative
lexical_decisions:
- source_word: Λίθῳ
  choice: mit einem Stein
  rationale: Der Dativ steht beim Vergleich und bezeichnet einen einzelnen Stein; „Stein“ ist im Deutschen die natürliche Entsprechung.
- source_word: ἠρδαλωμένῳ
  choice: beschmutzten
  rationale: Das seltene Partizip beschreibt den Stein in deutlich negativem Sinn als verunreinigt oder besudelt. „Beschmutzt“ wahrt diese Bedeutung, ohne den unsicheren Grad der Verunreinigung zu überzeichnen.
- source_word: συνεβλήθη
  choice: wird … verglichen
  rationale: Im sprichwörtlichen Zusammenhang bezeichnet das Verb ein Zusammenstellen zum Vergleich, nicht ein buchstäbliches Zusammenwerfen.
- source_word: ὀκνηρός
  choice: ein Fauler
  rationale: Das substantivierte maskuline Adjektiv bezeichnet einen trägen oder faulen Mann. „Ein Fauler“ ist knapp, gegenwärtig verständlich und bewahrt die grammatische Form.
- source_word: πᾶς
  choice: jeder
  rationale: Das Wort bezeichnet hier allgemein jeden, der auf die Schande des Faulen reagiert.
- source_word: ἐκσυριεῖ
  choice: wird … auspfeifen
  rationale: Das Verb bezeichnet einen verächtlichen Pfeif- oder Zischlaut. „Auspfeifen“ gibt die öffentliche, spöttische Reaktion idiomatisch und bildhaft wieder.
- source_word: ἐπὶ τῇ ἀτιμίᾳ αὐτοῦ
  choice: wegen seiner Schande
  rationale: ἀτιμία bezeichnet Ehrverlust, Schmach oder Schande; die Präpositionalfügung nennt hier den Anlass der verächtlichen Reaktion.
theological_decisions:
- issue: Maskulines substantiviertes Adjektiv ὀκνηρός
  choice: ein Fauler
  alternative: ein fauler Mensch
  rationale: Obwohl der Spruch allgemein anwendbar ist, steht im Griechischen die maskuline Singularform. Die Übersetzung bewahrt diese Form, ohne eine weitergehende Aussage über das Geschlecht zu konstruieren.
translation_notes:
  register: Knappes, sprichwortartiges Deutsch mit allgemein verständlichem Wortschatz. „Auspfeifen“ erhält das konkrete Lautbild und wirkt natürlicher als das wörtlichere „über seine Schande pfeifen“.
