base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/022/003.yaml
  text: A father’s shame is the birth of an undisciplined son[b][a], and a daughter is born for loss.
translation:
  language: de
  text: Die Schande eines Vaters ist, einen unerzogenen Sohn zu zeugen[a]; eine Tochter aber wird zum Verlust[b] geboren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: »bei der Zeugung eines Unerzogenen«. Das griechische Adjektiv ist männlich; »Sohn« ist sinngemäß ergänzt.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: »zur Einbuße« oder, aus dem Zusammenhang ergänzt, »zum Verlust ihres Vaters«. Die griechische Wendung bezeichnet eine Verminderung oder einen Verlust, lässt aber dessen genaue Art und Bezug offen.'
    reason: alternative_reading
lexical_decisions:
- source_word: αἰσχύνη πατρὸς
  choice: die Schande eines Vaters
  rationale: Die Genitivverbindung wird direkt und sprichwortartig wiedergegeben; „Schande“ bewahrt den starken sozialen und persönlichen Sinn von αἰσχύνη.
- source_word: ἐν γεννήσει
  choice: ist, … zu zeugen
  rationale: Die griechische Wendung bezeichnet das Zeugen beziehungsweise Hervorbringen. Die Infinitivkonstruktion ist im Deutschen natürlich und bewahrt stärker als bloßes „Geburt“ den möglichen Bezug auf den väterlichen Zeugungsakt.
- source_word: ἀπαιδεύτου
  choice: einen unerzogenen Sohn
  rationale: Das maskuline substantivierte Adjektiv bezeichnet hier im Gegenüber zur ausdrücklich genannten Tochter einen männlichen Nachkommen. „Unerzogen“ erfasst im Kontext der Weisheitsliteratur den Mangel an Unterweisung und sittlicher Disziplin.
- source_word: θυγάτηρ
  choice: eine Tochter
  rationale: Direkte Wiedergabe des ausdrücklich weiblichen Verwandtschaftsbegriffs.
- source_word: ἐπʼ ἐλαττώσει
  choice: zum Verlust
  rationale: Die knappe Wendung bezeichnet Verminderung, Einbuße oder Verlust. „Zum Verlust“ erhält die Härte und Unbestimmtheit der Aussage, ohne eine bestimmte wirtschaftliche oder soziale Deutung festzuschreiben.
- source_word: γίνεται
  choice: wird … geboren
  rationale: γίνομαι kann allgemein „werden“ oder „entstehen“ bedeuten; im Zusammenhang mit Nachkommenschaft gibt „geboren werden“ den Sinn verständlich wieder und hält die Parallele zum ersten Satzteil aufrecht.
theological_decisions:
- issue: Geschlechtsspezifische Bezeichnungen für die Nachkommen
  choice: „Vater“, der implizierte „Sohn“ und „Tochter“ bleiben geschlechtsspezifisch erhalten.
  alternative: Geschlechtsneutrale Wiedergabe mit „Elternteil“ und „Kind“.
  rationale: Der griechische Text nennt Vater und Tochter ausdrücklich; das maskuline ἀπαιδεύτου bezeichnet im parallelen ersten Satzteil einen Sohn. Eine Neutralisierung würde die konkrete Form des Spruchs verändern.
- issue: Negative gesellschaftliche Wertung einer Tochter
  choice: Die anstößige Aussage wird ohne beschönigende Umdeutung wiedergegeben.
  alternative: Die Zeile allgemein als familiäre Sorge oder als mögliche wirtschaftliche Belastung paraphrasieren.
  rationale: Der Vers spiegelt eine antike patriarchalische Wertung. Die Übersetzung soll diese weder billigen noch stillschweigend korrigieren, sondern als Aussage des Textes erkennbar lassen.
- issue: Bezug der Einbuße
  choice: „zum Verlust“ bleibt ohne ausdrücklich genanntes Bezugswort.
  alternative: „zum Verlust ihres Vaters“ beziehungsweise „zu seinem Verlust“.
  rationale: Der Vater kann aus dem Parallelismus als Betroffener verstanden werden, wird im zweiten Satzteil jedoch nicht ausdrücklich genannt. Die knappe deutsche Form bewahrt diese grammatische Offenheit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit der knappen Schärfe eines Weisheitsspruchs. Die ungewöhnliche Formulierung „zum Verlust geboren“ ist bewusst beibehalten, weil eine glattere Paraphrase die offene und harte Aussage des Griechischen stärker deuten oder abschwächen würde.
