base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/022/009.yaml
  text: Weep over the dead[a], for the light has failed; and weep over the fool[b], for understanding has failed.
translation:
  language: de
  text: Weine über einen Toten, denn er hat das Licht verloren; und weine über einen Toren, denn er hat die Einsicht verloren.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κλαῦσον
  choice: weine
  rationale: Der Imperativ von κλαίω bezeichnet hörbares Weinen und Klagen. „Weine“ gibt die unmittelbare emotionale Kraft wieder und lässt sich in beiden parallelen Satzteilen gleich übersetzen.
- source_word: νεκρῷ
  choice: einen Toten
  rationale: Der Dativ Singular mit ἐπί bezeichnet hier die Person, über die geklagt wird. Der unbestimmte Ausdruck wahrt den allgemeinen, sprichwortartigen Charakter.
- source_word: ἐξέλιπεν
  choice: hat … verloren
  rationale: 'ἐκλείπω kann transitiv „zurücklassen, aufgeben, verlieren“ bedeuten. Da φῶς formal Nominativ oder Akkusativ sein kann, σύνεσιν aber eindeutig Akkusativ ist, spricht der Parallelismus dafür, in beiden Gliedern dieselbe transitive Konstruktion anzunehmen: Der Tote hat das Licht, der Tor die Einsicht verloren.'
- source_word: φῶς
  choice: das Licht
  rationale: „Licht“ bewahrt das griechische Bild und deutet es nicht ausdrücklich zu „Leben“ aus.
- source_word: μωρῷ
  choice: einen Toren
  rationale: μωρός bezeichnet in der Weisheitsliteratur einen Menschen, dem es an Einsicht und rechter Lebensführung fehlt. „Tor“ ist im Deutschen würdig, verständlich und als weisheitliche Kategorie präziser als eine bloße Bezeichnung mangelnder Intelligenz.
- source_word: σύνεσιν
  choice: die Einsicht
  rationale: σύνεσις meint Verstehen, Urteilsvermögen und Unterscheidungsfähigkeit. „Einsicht“ passt zum Sprachgebrauch der Weisheitsliteratur und steht als direktes Objekt parallel zu „das Licht“.
theological_decisions:
- issue: Bildhafte Bedeutung von φῶς im Zusammenhang mit dem Tod
  choice: Das Bild „das Licht verloren“ bleibt im Haupttext erhalten.
  alternative: „das Leben verloren“ oder „sein Licht ist erloschen“
  rationale: Der griechische Text sagt φῶς („Licht“), nicht ζωή („Leben“). Die Bildsprache soll daher nicht stillschweigend aufgelöst werden. Zugleich gibt die transitive Formulierung den wahrscheinlichen Satzbau mit ἐξέλιπεν wieder.
- issue: Weisheitliche Kategorie μωρός
  choice: „Tor“
  alternative: „unverständiger Mensch“ oder „Narr“
  rationale: „Tor“ bewahrt die scharfe moralisch-praktische Kategorie der Weisheitsliteratur, ohne sie auf geringe Intelligenz oder moderne Vorstellungen psychischer Beeinträchtigung zu verengen.
- issue: Syntaktische Deutung von ἐξέλιπεν in beiden Satzhälften
  choice: 'Ein jeweils unausgesprochenes männliches Subjekt wird angenommen: Der Tote beziehungsweise der Tor hat etwas verloren.'
  alternative: „Das Licht ist erloschen; die Einsicht ist geschwunden.“
  rationale: σύνεσιν ist eindeutig Akkusativ und legt eine transitive Verwendung von ἐξέλιπεν nahe. Der strenge Parallelismus spricht dafür, auch φῶς als Akkusativobjekt zu verstehen. So bleibt zudem die grammatische Spannung sichtbar, ohne die zweite Hälfte gegen ihre Form als selbstständiges Subjekt zu behandeln.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper, sprichwortartiger Parallelstruktur. „Tor“ gehört zum etablierten Wortschatz biblischer Weisheitsliteratur; die übrige Syntax bleibt gegenwärtig und leicht verständlich.
