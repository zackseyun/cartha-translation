base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/022/024.yaml
  text: Before bloodshed come the furnace’s vapor and smoke[b][a]; so before bloodshed comes abuse.
translation:
  language: de
  text: Dem Feuer gehen Dampf aus dem Ofen und Rauch voraus; ebenso geht dem Blutvergießen[a] Beschimpfung[b] voraus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich steht im Griechischen der Plural „Blute“; er bezeichnet idiomatisch Blutvergießen oder blutige Gewalttaten.
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „Beleidigung“, „Schmähung“ oder „Schmährede“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸ
  choice: vorausgehen
  rationale: Die Präposition bezeichnet in beiden Satzhälften zeitliche Abfolge. Die deutsche Verbkonstruktion mit „vorausgehen“ gibt diese Wiederholung natürlich und prägnant wieder.
- source_word: πυρὸς
  choice: Feuer
  rationale: Direkte Entsprechung; gemeint ist das Feuer, dessen Vorzeichen Dampf und Rauch sind.
- source_word: ἀτμὶς
  choice: Dampf
  rationale: Das Wort bezeichnet Dampf, Ausdünstung oder Dunst. „Dampf“ passt im Deutschen am besten zum Bild eines Ofens.
- source_word: καμίνου
  choice: aus dem Ofen
  rationale: Der Genitiv bezeichnet hier die Herkunft des Dampfes. „Ofen“ ist verständlich und lässt offen, ob ein Brenn-, Schmelz- oder anderer großer Ofen gemeint ist.
- source_word: καπνός
  choice: Rauch
  rationale: Direkte und im Bild natürliche Entsprechung.
- source_word: οὕτως
  choice: ebenso
  rationale: Kennzeichnet den Vergleich zwischen dem sichtbaren Vorzeichen des Feuers und dem sprachlichen Vorzeichen von Gewalt.
- source_word: αἱμάτων
  choice: Blutvergießen
  rationale: Der griechische Plural „Blute“ ist eine idiomatische Bezeichnung für Blutvergießen oder blutige Gewalttaten; die deutsche Wiedergabe wahrt den ethischen Sinn.
- source_word: λοιδορία
  choice: Beschimpfung
  rationale: Das Substantiv bezeichnet schmähende, beleidigende Rede. „Beschimpfung“ ist gegenwärtig, verständlich und hebt den verbalen Charakter hervor.
theological_decisions:
- issue: Verhältnis zwischen verletzender Rede und Gewalt
  choice: Der Spruch stellt Beschimpfung als etwas dar, das Blutvergießen vorausgeht.
  alternative: Beschimpfung verursacht zwangsläufig Blutvergießen oder begleitet es lediglich.
  rationale: Das zweimalige πρὸ bezeichnet am natürlichsten eine zeitliche Abfolge. Die Übersetzung bewahrt die warnende Zuspitzung, ohne daraus eine ausnahmslose Kausalbehauptung zu machen.
translation_notes:
  register: Knappes, würdiges Sprichwortdeutsch. Die parallele Konstruktion mit „vorausgehen“ bildet die zweimalige griechische Präposition πρὸ ab; das im ersten Nominalsatz fehlende Verb wird dabei sinngemäß ergänzt.
