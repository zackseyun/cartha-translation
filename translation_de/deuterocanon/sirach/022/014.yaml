  register: Knappes, pointiertes Sprichwort in modernem, würdigem Standarddeutsch. Die Anführungszeichen kennzeichnen »Narr« als die gesuchte Bezeichnung; die Fußnote bewahrt die grammatische Kompression und die mögliche persönliche Lesart.
