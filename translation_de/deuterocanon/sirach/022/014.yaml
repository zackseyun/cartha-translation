translation:
  language: de
  text: Was ist schwerer als Blei? Und wie heißt er anders als »Narr«?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher etwa: »Was wird schwerer gemacht werden als Blei? Und was ist sein Name außer ›Narr‹?« Das Griechische ist sprichwortartig verkürzt. αὐτῷ kann formal auch sachlich bezogen werden; der Haupttext versteht es persönlich.'
    reason: Dokumentiert die futurische Passiv-/Mediumform von βαρυνθήσεται sowie die formale Mehrdeutigkeit des Bezugs von αὐτῷ.
lexical_decisions:
- source_word: ὑπὲρ μόλυβον
  choice: schwerer als Blei
  rationale: ὑπέρ bezeichnet in Verbindung mit der Gewichtsangabe den Vergleich. Die natürliche deutsche Wiedergabe lautet »schwerer als Blei«.
- source_word: τί βαρυνθήσεται
  choice: Was ist schwerer
  rationale: Die futurische Passiv-/Mediumform steht hier in einer knappen rhetorischen Frage. Das deutsche Präsens gibt den allgemeinen Sinn des Sprichworts klar wieder, ohne eine künstliche Kausativform einzuführen.
- source_word: τί αὐτῷ ὄνομα
  choice: wie heißt es
  rationale: Die Wendung bedeutet wörtlich etwa »was ist ihm/ihm sein Name?«. Das Pronomen bleibt im Griechischen hinsichtlich des Bezuges knapp; »wie heißt es« bewahrt den unmittelbaren Rückbezug auf das Gesuchte und den pointierten Stil.
- source_word: ἀλλʼ ἢ
  choice: anders als
  rationale: Die Verbindung führt in der rhetorischen Frage die einzig mögliche Benennung ein. »anders als« ist dafür im Deutschen idiomatisch.
- source_word: μωρός
  choice: Narr
  rationale: »Narr« ist eine würdige, in der Weisheitsliteratur geläufige Bezeichnung für einen törichten Menschen und bewahrt stärker als »Dummkopf« die moralische Dimension des griechischen Wortes.
