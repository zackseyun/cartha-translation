base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/022/012.yaml
  text: Mourning for the dead is seven days[a], but for a fool and an ungodly man, all the days of his life.
translation:
  language: de
  text: Um einen Toten trauert man sieben Tage, um einen Toren und Gottlosen aber alle Tage seines Lebens.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die griechischen maskulinen Singularformen stehen in diesem Weisheitsspruch allgemein für einen törichten und gottlosen Menschen.
    reason: Hinweis auf den generischen Gebrauch der grammatisch maskulinen Formen.
lexical_decisions:
- source_word: πένθος νεκροῦ
  choice: Um einen Toten trauert man
  rationale: Die verbale Formulierung ist im modernen Deutschen natürlich und gibt die Trauer um einen Verstorbenen wieder; der griechische Genitiv bezeichnet den Anlass beziehungsweise Gegenstand der Trauer.
- source_word: ἑπτὰ ἡμέραι
  choice: sieben Tage
  rationale: Die klare Zeitangabe wird unmittelbar und formal entsprechend wiedergegeben.
- source_word: μωροῦ
  choice: um einen Toren
  rationale: „Tor“ bezeichnet in der Weisheitsliteratur nicht bloß geringe Intelligenz, sondern praktische und sittliche Verfehlung und bewahrt den traditionellen Weisheitsbegriff.
- source_word: ἀσεβοῦς
  choice: und Gottlosen
  rationale: „Gottlos“ gibt die fehlende Ehrfurcht gegenüber Gott verständlich und bibelsprachlich würdig wieder; die substantivierte Form entspricht dem griechischen maskulinen Singular.
- source_word: πᾶσαι αἱ ἡμέραι τῆς ζωῆς αὐτοῦ
  choice: alle Tage seines Lebens
  rationale: 'Die Wendung bewahrt Struktur und zeitliche Pointe des Griechischen: Die Trauer beziehungsweise das Leid, das der Tor und Gottlose verursacht, erstreckt sich über seine gesamte Lebenszeit.'
theological_decisions:
- issue: Bezug und Sinn der zweiten Satzhälfte
  choice: Die parallele Konstruktion „um einen Toren und Gottlosen“ bleibt elliptisch und wird nicht erklärend erweitert.
  alternative: „Ein Tor und Gottloser bereitet alle Tage seines Lebens Kummer.“
  rationale: Der griechische Text setzt πένθος sinngemäß auch in der zweiten Hälfte voraus. Eine explizite Deutung als von ihm verursachter Kummer wäre plausibel, würde die knappe, spannungsvolle Formulierung jedoch stärker auslegen als der Ausgangstext.
- issue: Generisches Maskulinum im Weisheitsspruch
  choice: Maskulinen Singular mit „einen Toren und Gottlosen“ sowie „seines Lebens“ beibehalten.
  alternative: „einen törichten und gottlosen Menschen … dessen Leben“
  rationale: Das Griechische verwendet maskuline Singularformen in einem allgemeinen Weisheitsspruch. Die Übersetzung bewahrt diese Form, während die Fußnote auf ihre generische Funktion hinweist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Gegenüberstellung und die Ellipse des griechischen Spruchs bleiben erhalten; „Tor“ wahrt den weisheitlichen Klang, ohne unnötig altertümliche Syntax.
