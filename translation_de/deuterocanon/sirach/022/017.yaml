  text: A heart set firm on thoughtful understanding is like a plastered wall with a sanded finish[a].
translation:
  language: de
  text: Ein Herz, das auf verständiger Überlegung fest gegründet ist, gleicht dem Sandputz auf einer geglätteten Wand.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Baubild ist stark verdichtet, und die genaue Bedeutung der Begriffe für die Wandoberfläche ist nicht ganz sicher. Wörtlicher ist etwa von einer sandhaltigen Ausschmückung oder Oberflächengestaltung an einer geglätteten Wand die Rede. Gemeint ist das Bild einer festen, sorgfältig ausgeführten Bauweise.
    reason: cultural_note
lexical_decisions:
- source_word: καρδία
  choice: Herz
  rationale: „Herz“ bewahrt den biblischen Sprachgebrauch für die innere Mitte des Denkens und Wollens; gemeint ist nicht nur das Gefühl.
- source_word: ἠδρασμένη
  choice: fest gegründet
  rationale: Das Partizip bezeichnet einen herbeigeführten und fortbestehenden Zustand der Festigkeit. „Fest gegründet“ wahrt zugleich das passive Moment und passt zum anschließenden Baubild.
- source_word: ἐπὶ
  choice: auf
  rationale: „Auf“ gibt die Grundlage wieder, auf der die Festigkeit des Herzens beruht, ohne den syntaktischen Bezug stärker als nötig auszudeuten.
- source_word: διανοίας συνέσεως
  choice: verständiger Überlegung
  rationale: Die verdichtete Genitivverbindung umfasst sowohl Denken beziehungsweise Überlegen (διανοία) als auch Einsicht beziehungsweise Verstehen (σύνεσις). Die deutsche Fügung gibt beide Aspekte knapp und natürlich wieder.
- source_word: ὡς
  choice: gleicht
  rationale: „Gleicht“ formuliert den ausdrücklich eingeleiteten Vergleich in würdigem, natürlichem Deutsch.
- source_word: κόσμος ψαμμωτός
  choice: Sandputz
  rationale: κόσμος bezeichnet hier wahrscheinlich die geordnete beziehungsweise schmückende Oberflächengestaltung, ψαμμωτός eine Behandlung mit Sand. „Sandputz“ fasst das architektonische Bild verständlich zusammen, ohne dekorativen Schmuck zu stark zu betonen.
- source_word: τοίχου ξυστοῦ
  choice: einer geglätteten Wand
  rationale: τοῖχος bedeutet „Wand“; ξυστός bezeichnet etwas Abgeschabtes, geglättet Bearbeitetes oder Poliertes. „Geglättet“ bleibt gegenüber der genauen antiken Bautechnik angemessen zurückhaltend.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit leicht weisheitlich-gehobenem Klang. Das knappe Baubild bleibt erhalten; die unsichere Bedeutung der Begriffe für die Wandoberfläche wird in der Fußnote offengelegt.
