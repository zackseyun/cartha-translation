  text: For great is the Lord who made it[b][a], and by his word he hastens its course.
translation:
  language: de
  text: Denn groß ist der Herr, der ihn geschaffen hat,[a] und durch sein Wort treibt er dessen Bahn voran.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Masada bewahrt nur den ersten Halbvers: „Denn groß ist der Herr, der ihn geschaffen hat.“ Der hebräische Text aus der Kairoer Geniza setzt mit einer schwierigen Lesart fort; die griechische Parallele stützt für den zweiten Halbvers den Sinn: „Durch sein Wort treibt er dessen Bahn voran.“'
    reason: textual_variant
  - marker: b
    text: 'Oder: „Auf seinen Befehl hin lenkt er dessen Bahn.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: גדול
  choice: groß
  rationale: Das prädikative Adjektiv beschreibt den Herrn; „groß“ ist die direkte und im hymnischen Zusammenhang natürliche Wiedergabe.
- source_word: ה׳
  choice: der Herr
  rationale: Die ehrfürchtige Abkürzung des Gottesnamens wird nach deutscher Bibeltradition mit „der Herr“ wiedergegeben.
- source_word: עושהו
  choice: der ihn geschaffen hat
  rationale: Das Suffix verweist im Zusammenhang auf den Mond; daher steht im Deutschen das maskuline Pronomen „ihn“. „Geschaffen“ bringt das göttliche Hervorbringen würdig und idiomatisch zum Ausdruck.
- source_word: בדבריו
  choice: durch sein Wort
  rationale: Die instrumentale Wendung bezeichnet das wirksame göttliche Wort. Der deutsche Singular ist hier idiomatisch und kann zugleich den Sinn eines Befehls tragen.
- source_word: ינצח
  choice: treibt … voran
  rationale: Die hebräische Form ist an dieser Stelle schwierig. Die griechische Parallele κατέσπευσεν stützt den Sinn des Beschleunigens oder Vorantreibens.
- source_word: אביריו
  choice: seine Bahn
  rationale: Die hebräische Lesart ist im Zusammenhang problematisch; die griechische Parallele πορείαν weist auf den Lauf beziehungsweise die Bahn des Himmelskörpers. „Bahn“ ist natürlich, ohne den modernen Fachbegriff „Umlaufbahn“ einzutragen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens
  choice: der Herr
  alternative: JHWH
  rationale: ה׳ ist die ehrfürchtige Abkürzung des Gottesnamens; „der Herr“ entspricht der etablierten Übersetzungspraxis und vermeidet eine unnötige Transliteration.
- issue: Textlich schwieriger zweiter Halbvers
  choice: Den erhaltenen hebräischen Text mithilfe der griechischen Parallele als „durch sein Wort treibt er seine Bahn voran“ wiedergeben
  alternative: Die schwierigen hebräischen Wörter streng formal als Aussage über einen „Mächtigen“ und dessen Obsiegen wiedergeben
  rationale: Der hebräische Text bleibt die Grundlage, doch seine Formulierung ist hier dunkel. Die alte griechische Parallele bietet einen kohärenten astronomischen Sinn und stützt die Vorstellung vom Vorantreiben einer Bahn, ohne die textliche Schwierigkeit zu verschweigen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit hymnischem Klang. Das maskuline Pronomen richtet sich nach dem im Zusammenhang genannten Mond. Die schwierige Textlage des zweiten Halbverses wird im Haupttext lesbar wiedergegeben und in der Fußnote ausdrücklich offengelegt.
