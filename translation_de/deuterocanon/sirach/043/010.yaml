  text: At his word the decree stands[b][a], and they do not fail in their watches.
translation:
  language: de
  text: Auf Gottes Wort hin steht die Ordnung fest,[a] und in ihren Wachdiensten lassen sie nicht nach.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der Masada-Text liest: „Auf das Wort des Herrn steht die Ordnung fest.“'
    reason: textual_variant
  - marker: b
    text: 'Oder: „und sie ermatten in ihren Wachdiensten nicht“; die hebräische Verbform ist unsicher. Der griechische Paralleltext stützt den Sinn „nicht erlahmen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בדבר אל
  choice: Auf Gottes Wort
  rationale: בדבר bezeichnet hier Anlass oder Grundlage, und אל wird in seinem gewöhnlichen Sinn „Gott“ verstanden. Die Formulierung gibt den göttlichen Urheber ausdrücklich wieder, ohne den abweichenden Gottesnamen des Masada-Textes in den Haupttext zu übernehmen.
- source_word: יעמד
  choice: steht … fest
  rationale: עמד bedeutet grundlegend „stehen, bestehen“. „Steht fest“ ist im Deutschen natürlich und bringt in diesem kosmischen Zusammenhang Beständigkeit zum Ausdruck.
- source_word: חק
  choice: die Ordnung
  rationale: חק kann Satzung, Bestimmung oder festgesetzte Ordnung bezeichnen. Im Zusammenhang mit den Himmelskörpern trifft „Ordnung“ die kosmische Regelmäßigkeit besser als das stärker juristisch klingende „Gesetz“.
- source_word: ולא ישח
  choice: und sie ermatten nicht
  rationale: Die überlieferte hebräische Verbform ist unsicher. Der griechische Paralleltext („nicht erlahmen“) und die Masada-Lesart („nicht müde werden“) stützen die Bedeutung anhaltender Kraft und Pflichttreue.
- source_word: באשמרותם
  choice: auf ihren Wachen
  rationale: אשמרותם bezeichnet ihre Wachen, Wachzeiten oder Wachposten. Die bildhafte Rede von den Himmelskörpern als Wächtern in zugewiesenen Diensten bleibt so erhalten.
theological_decisions:
- issue: Ausdrückliche Benennung des göttlichen Urhebers
  choice: „Auf Gottes Wort“ nach dem vorgelegten Geniza-Text בדבר אל
  alternative: „Auf das Wort des Herrn“ nach der Masada-Lesart בדבר אדני
  rationale: Der hebräische Hauptzeuge enthält אל („Gott“), während Masada ausdrücklich אדני („Herr“) liest. Der Haupttext folgt der angegebenen Primärquelle; die Variante wird in einer Fußnote dokumentiert.
- issue: Deutung von חק im kosmischen Zusammenhang
  choice: „Ordnung“
  alternative: „Bestimmung“, „Satzung“ oder „Dekret“
  rationale: Die Übersetzung wahrt den Gedanken einer von Gott festgesetzten kosmischen Ordnung, ohne חק ausschließlich juristisch oder als einzelnen Befehl zu deuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Steht … fest“ und „ermatten nicht“ sind allgemein verständlich; „Wachen“ bewahrt das poetische Bild des eingeteilten himmlischen Wachdienstes. Die Satzstellung folgt dem knappen Parallelismus des Hebräischen.
