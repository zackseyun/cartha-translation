  text: He spreads frost like salt[c][b][a], and it sprouts like palm shoots.
translation:
  language: de
  text: Er breitet den Reif wie Salz aus[a], der wie Palmenblüten sprießt[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hebräische Text ist hier unsicher. Kahana bietet ungefähr: „Reifdunst lagert wie Salz“; der griechische Paralleltext lautet: „Er schüttet Reif wie Salz auf die Erde.“ Auch die Masada-Handschrift hat in diesem Versbereich eine abweichende Lesart.'
    reason: textual_variant
  - marker: b
    text: 'Das Schlussbild kann auch heißen: „und er treibt Sprosse wie eine Palme“. Nach dem griechischen Paralleltext könnten spitze, erstarrte Eisgebilde gemeint sein.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אד
  choice: Er
  rationale: Das überlieferte אד bedeutet gewöhnlich „Dunst/Nebel“, doch der hebräische Text ist an dieser Stelle gestört. Der griechische Paralleltext und der Zusammenhang des Hymnus stützen Gott als unausgesprochenes Subjekt.
- source_word: כפור
  choice: Reif
  rationale: כפור bezeichnet Frost beziehungsweise Reif; „Reif“ gibt hier die sichtbare, salzähnliche Schicht prägnant wieder.
- source_word: כמלח
  choice: wie Salz
  rationale: Die Wendung vergleicht das Aussehen oder die Verteilung des Reifs mit Salz.
- source_word: ישכון
  choice: breitet ... aus
  rationale: Wörtlich bedeutet das Verb „wohnen, lagern, sich niederlassen“. Wegen der unsicheren Überlieferung und des meteorologischen Bildes wird es idiomatisch als Ausbreitung des Reifs wiedergegeben, ohne die im Hebräischen nicht ausdrücklich genannte Erde einzufügen.
- source_word: ויציץ
  choice: treibt Sprosse
  rationale: Das Verb צוץ bedeutet „blühen, sprossen, hervortreiben“ und bewahrt das pflanzliche Bild der hervorstehenden Reifgebilde.
- source_word: כתמר
  choice: wie eine Palme
  rationale: תמר bezeichnet die Dattelpalme beziehungsweise Palme; im Deutschen ist für den Vergleich der Artikel erforderlich.
- source_word: ציצים
  choice: Sprosse
  rationale: ציצים kann Blüten, Knospen oder hervortretende Gebilde bezeichnen. „Sprosse“ bewahrt das Pflanzenbild und lässt zugleich die Form spitzer Eisgebilde anklingen.
theological_decisions:
- issue: Unausgesprochenes göttliches Subjekt oder wörtliches Substantiv am Versanfang
  choice: Das göttliche Subjekt wird mit „Er“ wiedergegeben.
  alternative: '„Reifdunst lagert wie Salz“ oder nach dem Griechischen: „Er schüttet Reif wie Salz auf die Erde.“'
  rationale: Die hebräische Überlieferung ist hier offenbar gestört; auch die abweichende Masada-Lesart weist darauf hin. Der griechische Paralleltext und der hymnische Zusammenhang beschreiben Gottes Wirken am Wetter. „Er“ schafft einen verständlichen Satz, ohne das stärkere griechische Verb „ausschütten“ zu übernehmen.
translation_notes:
  register: Moderne, würdige Standardsprache mit knapper poetischer Bildlichkeit. Die unsichere Textüberlieferung wird nicht im Haupttext überladen, sondern transparent in den Fußnoten dokumentiert.
