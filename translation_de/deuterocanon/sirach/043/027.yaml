base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/043/027.yaml
  text: 'We could say more than these[a], but there would be no end[b]; and the conclusion of the matter is: all is he.'
translation:
  language: de
  text: 'Wir könnten noch mehr Derartiges sagen[a], doch kämen wir nicht ans Ende; und das Schlusswort lautet: Er ist das All.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wir könnten noch vieles sagen und kämen doch nicht ans Ende.“ Die griechische Parallele macht ausdrücklich, dass selbst ausführliches Reden den Gegenstand nicht ausschöpft.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „Er ist alles.“ Der hebräische Wortlaut ist äußerst knapp; die griechische Parallele bestätigt den persönlichen Bezug: „Er selbst ist das All.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: עוד כאלה
  choice: noch mehr Derartiges
  rationale: Die Wendung verweist auf weitere Dinge derselben Art und setzt den vorausgehenden Lobpreis der Schöpfungswerke fort.
- source_word: לא נוסף
  choice: ohne an ein Ende zu kommen
  rationale: Der hebräische Wortlaut ist knapp und wörtlich schwer verständlich; die griechische Parallele erläutert den Sinn als ein Reden, das den Gegenstand nicht ausschöpft.
- source_word: וקץ דבר
  choice: doch das Schlusswort lautet
  rationale: קץ bezeichnet Ende oder Abschluss, דבר Wort, Rede oder Sache. „Das Schlusswort“ gibt die zusammenfassende Funktion natürlich und prägnant wieder.
- source_word: הוא הכל
  choice: Er ist das All
  rationale: Die Formulierung bewahrt die knappe Zuordnung des persönlichen Pronomens zu הכל („das Ganze/das All“), ohne sie zu einer metaphysischen Erklärung auszuweiten.
theological_decisions:
- issue: Aussagekraft des abschließenden Satzes
  choice: Er ist das All
  alternative: Er ist alles
  rationale: „Das All“ erhält die verdichtete, spannungsvolle Totalitätsaussage des Hebräischen und der griechischen Parallele. Die Übersetzung erklärt nicht näher, in welchem Sinn Gott „das All“ ist, und vermeidet so eine dogmatische Festlegung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Derartiges“ und „Schlusswort“ halten den feierlich-zusammenfassenden Ton, bleiben aber für heutige Leser verständlich.
