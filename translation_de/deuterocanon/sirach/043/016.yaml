  text: At the sound of his thunder the earth writhes[b][a]; the blasts of the north are storm and tempest.
translation:
  language: de
  text: Beim Schall seines Donners erbebt seine Erde[b]; die Sturmböen des Nordens sind Sturm und Orkan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Parallelüberlieferung lautet: „Und bei seinem Erscheinen werden die Berge erschüttert; nach seinem Willen weht der Südwind.“ Sie weicht erheblich vom erhaltenen hebräischen Text ab, dessen zweite Zeile von Sturmböen des Nordens als Sturm und Orkan spricht.'
    reason: alternative_reading
  - marker: b
    text: Das mit „erbebt“ wiedergegebene hebräische Verb kann auch „zittert“ oder „sich windet“ bedeuten und beschreibt eine erschütternde, krampfhafte Bewegung.
