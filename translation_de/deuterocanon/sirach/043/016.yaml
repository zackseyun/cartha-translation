lexical_decisions:
- source_word: קול רעמו
  choice: beim Dröhnen seines Donners
  rationale: קול bezeichnet hier den hörbaren Donnerklang; „Dröhnen“ gibt dessen Wucht natürlich wieder. Das Suffix in רעמו wird als „seines“ bewahrt und bezieht den Donner im Kontext auf Gott.
- source_word: יחיל
  choice: windet sich
  rationale: Das Verb חול/חיל kann ein Beben, Zittern oder krampfhaftes Winden bezeichnen. „Windet sich“ erhält das starke körperliche Bild; die geläufigeren Alternativen werden in einer Fußnote genannt.
- source_word: ארצו
  choice: die Erde
  rationale: Das Suffix könnte formal „seine Erde“ oder „sein Land“ ergeben. Im kosmischen Schöpfungshymnus ist „die Erde“ im Deutschen idiomatischer und vermeidet eine unbeabsichtigte territoriale Verengung.
- source_word: זלעפות צפון
  choice: die Sturmböen aus dem Norden
  rationale: זלעפות bezeichnet heftige, möglicherweise sengende Windstöße; zusammen mit צפון ist eine meteorologische Wiedergabe passend. „Aus dem Norden“ hält die Richtung fest, ohne das Substantiv isoliert und unnatürlich als „der Norden“ stehen zu lassen.
- source_word: סופה וסערה
  choice: Unwetter und Sturm
  rationale: Beide Wörter gehören zum Bedeutungsfeld heftiger Sturmerscheinungen und überschneiden sich. Die Paarung wahrt die Steigerung und vermeidet das im heutigen Deutsch gehobene, aber weniger allgemein verständliche „Orkan und Wettersturm“.
theological_decisions:
- issue: Göttliche Possessivsuffixe in der Wetterdarstellung
  choice: „seines Donners“, aber idiomatisch „die Erde“
  alternative: „Beim Dröhnen seines Donners windet sich seine Erde“ oder „sein Land erbebt“
  rationale: Die göttliche Zuordnung des Donners bleibt ausdrücklich erhalten. Beim zweiten Suffix verhindert „die Erde“ eine im Deutschen schwerfällige Wiederholung und eine mögliche Verengung auf ein bestimmtes Land.
- issue: Starke Abweichung zwischen hebräischer und griechischer Überlieferung
  choice: Der erhaltene hebräische Wortlaut über die Böen aus dem Norden steht im Haupttext.
  alternative: 'Die griechische Parallelüberlieferung lautet sinngemäß: „Und bei seinem Erscheinen werden die Berge erschüttert; nach seinem Willen weht der Südwind.“'
  rationale: Für den erhaltenen Sirachtext hat die hebräische Überlieferung Vorrang. Die erheblich abweichende griechische Lesart wird jedoch vollständig in einer Fußnote dokumentiert, ohne beide Textformen miteinander zu vermischen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit kräftiger poetischer Bildsprache. „Dröhnen“, „windet sich“ und „Sturmböen“ sind allgemein verständlich; die hebräische Parallelstruktur bleibt erkennbar. Die Fußnotenmarker stehen jeweils unmittelbar bei dem Textteil, den sie erläutern.
