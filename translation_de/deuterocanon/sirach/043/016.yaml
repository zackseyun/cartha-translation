    rationale: Die hebräische Wurzel kann konvulsives Winden bezeichnen, schließt aber Beben/Erzittern ein. „Erbebt“ ist als Haupttextwiedergabe idiomatischer; die weitergehende Bildnuance wird in der Fußnote dokumentiert.
  - severity: low
