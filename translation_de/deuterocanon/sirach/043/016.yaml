    issue: Das possessive Suffix in ארצו wird im Haupttext ausgelassen.
    rationale: Da der hebräische Wortlaut ausdrücklich „seine Erde/sein Land“ hat, ist „die Erde“ eine interpretierende Glättung. „Seine Erde“ ist im poetisch-theologischen Kontext verständlich und bewahrt die Formulierung.
  - severity: medium
