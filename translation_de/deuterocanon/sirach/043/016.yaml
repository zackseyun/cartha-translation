    rationale: „Unwetter und Sturm“ ist eine weniger klare Reihenfolge und wiederholt im Deutschen weitgehend dasselbe. „Sturm und Orkan“ bildet die Abfolge und Steigerung von סופה וסערה besser ab, ohne eine spezifische Sturmform zwingend festzulegen.
