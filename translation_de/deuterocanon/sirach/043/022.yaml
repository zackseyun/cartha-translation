translation:
  language: de
  text: 'Heilung für alles: eine sich verdichtende Wolke aus Tau[a][c], die die sengende Hitze vertreibt, um zu beleben[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die hebräische Wendung »eine sich verdichtende Wolke aus Tau« ist schwierig; der griechische Paralleltext liest »Nebel, Tau« und weist damit eher auf kühlende Feuchtigkeit als auf eine Gewitterwolke.
    reason: lexical_alternative
  - marker: b
    text: Das hebräische לדשן bedeutet etwa »reich machen«, »kräftigen« oder »beleben«. Seine genaue syntaktische Beziehung zur vorhergehenden Aussage ist unsicher; möglich ist auch eine engere Verbindung mit dem Vertreiben der sengenden Hitze.
    reason: alternative_reading
  - marker: c
    text: Die Masada-Rolle ist in diesem Bereich nur bruchstückhaft erhalten und bietet für diesen Vers keine eindeutig abweichende Lesart. Die Übersetzung folgt dem Hebräischen der Kairoer Geniza; der griechische Paralleltext dient zur Kontrolle.
    reason: textual_variant
lexical_decisions:
- source_word: מרפא כל
  choice: Heilung für alles
  rationale: מרפא bezeichnet Heilung oder ein Heilmittel; כל bleibt bewusst weit gefasst. Die knappe nominale Form entspricht dem Hebräischen und dem griechischen Paralleltext ἴασις πάντων.
- source_word: מערף ענן טל
  choice: eine sich ballende Wolke aus Tau
  rationale: Die hebräische Wortgruppe ist schwierig. Die Wiedergabe bewahrt das Wolkenbild und bringt zugleich die kühlende, feuchte Erscheinung zum Ausdruck, die der griechische Paralleltext mit »Nebel, Tau« beschreibt.
- source_word: פורע
  choice: vertreibt
  rationale: Beim Objekt שרב passt eine Bedeutung wie »beseitigen, zurückdrängen, vertreiben« am besten; der griechische Paralleltext bestätigt die Vorstellung von Linderung gegenüber der Hitze.
- source_word: לדשן
  choice: im Haupttext nicht eigens wiedergegeben
  rationale: Das Wort bezeichnet wörtlich ein Reichmachen, Kräftigen oder Üppigwerden. Seine genaue syntaktische Einbindung ist in der schwierigen Schlusswendung unsicher; die resultierende Belebung ist in der heilenden und kühlenden Wirkung mitgedacht und wird in einer Fußnote offengelegt.
- source_word: שרב
  choice: die sengende Hitze
  rationale: שרב bezeichnet trockene, versengende Hitze, gegebenenfalls auch einen heißen Wind. »Sengende Hitze« ist verständlich und entspricht dem griechischen καύσων.
