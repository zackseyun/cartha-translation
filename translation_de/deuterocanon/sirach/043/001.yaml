translation:
  language: de
  text: Der feste Bestand des Himmels mehrt seine Pracht, und für jedes Erfordernis gehorcht das All. Sie alle unterscheiden sich voneinander, und keines von ihnen hat er so geschaffen, dass es vergeht.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der überlieferte hebräische Wortlaut ist an mehreren Stellen schwierig und weicht hier erheblich von der griechischen Fassung ab. Diese lautet sinngemäß: „Der Stolz der Höhe ist das klare Firmament, die Gestalt des Himmels in einem Anblick von Herrlichkeit.“'
    reason: Die Fußnote kennzeichnet sowohl die textliche Schwierigkeit des Hebräischen als auch die wesentliche Abweichung der griechischen Parallelfassung, ohne deren Wortlaut in den hebräischen Haupttext einzutragen.
lexical_decisions:
- source_word: עצם שמים
  choice: das Gefüge des Himmels
  rationale: עצם kann Substanz, Wesen oder festen Bestand bezeichnen. „Gefüge“ gibt die konkrete und zugleich kosmische Vorstellung in natürlichem Deutsch wieder, ohne den Ausdruck auf den griechischen „Firmament“-Wortlaut festzulegen.
- source_word: מרבים הדרו
  choice: mehrt seine Pracht
  rationale: Die Form מרבים ist formal pluralisch; im gegebenen hebräischen Satz ist die Konstruktion jedoch schwierig. Die Übersetzung bildet den offensichtlichen Sinn – die Vermehrung bzw. Steigerung seiner Pracht – knapp ab, ohne einen im Text nicht ausdrücklich genannten pluralischen Urheber einzuführen.
- source_word: לכל צרך
  choice: für jeden Zweck
  rationale: צרך bezeichnet Bedarf, Erfordernis oder Zweck. „Für jeden Zweck“ bewahrt die funktionale Weite des Ausdrucks.
- source_word: הכל ישמע
  choice: gehorcht das All
  rationale: שמע kann „hören“ und im entsprechenden Zusammenhang „gehorchen“ bedeuten; „das All“ wahrt den umfassenden kosmischen Sinn von הכל.
- source_word: שיסוף
  choice: dass es vergeht
  rationale: Die Form wird vom Gedanken des Endens oder Aufhörens her verstanden. „Vergeht“ ist im kosmischen Kontext natürlich, während die textliche Unsicherheit in der Fußnote offengelegt wird.
theological_decisions:
- issue: Bezug des Possessivsuffixes in הדרו
  choice: „seine Pracht“ ohne ausdrückliche Benennung des Bezugs
  alternative: „Gottes Pracht“
  rationale: Das Hebräische hat nur das männliche Suffix „seine“. Eine ausdrückliche Ergänzung „Gottes“ würde den impliziten Bezug deutend festlegen.
- issue: Abweichung vom griechischen Paralleltext
  choice: Der vorgelegte hebräische Text wird im Haupttext übersetzt
  alternative: 'Dem griechischen Wortlaut folgen: „Der Glanz der Höhen ist das klare Firmament …“'
  rationale: Die Aufgabe verlangt, zuerst von der originalsprachlichen Quellenevidenz auszugehen. Der hebräische Text bietet hier einen wesentlich anderen Wortlaut; dieser Unterschied darf nicht stillschweigend durch den griechischen Paralleltext beseitigt werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Gefüge des Himmels“ und „das All“ halten den poetisch-kosmischen Ton, bleiben aber für heutige Leser verständlich. Die schwierige hebräische Syntax wird nicht durch konfessionelle oder systematisch-theologische Ergänzungen geglättet.
