  text: Look at the rainbow and bless its Maker[b][a], for it is exceedingly majestic in splendor.
translation:
  language: de
  text: Sieh den Regenbogen[a] an und preise seinen Schöpfer, denn der Regenbogen ist überaus majestätisch in seiner Pracht.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Bogen“; gemeint ist hier der Bogen am Himmel, also der Regenbogen.'
    reason: lexical_alternative
  - marker: b
    text: Die Masada-Rolle stützt hier die Bedeutung von Majestät und Pracht mit einer verwandten Formulierung.
    reason: textual_variant
lexical_decisions:
- source_word: ראה
  choice: Sieh … an
  rationale: Der Imperativ fordert unmittelbar zum Hinschauen auf. „Sieh … an“ ist gegenwärtiges, natürliches Deutsch und bewahrt den Aufforderungscharakter.
- source_word: קשת
  choice: Regenbogen
  rationale: Wörtlich steht „Bogen“; im Zusammenhang der Himmelserscheinungen ist der Regenbogen gemeint. Die ausdrückliche Wiedergabe ist für heutige Leser eindeutig.
- source_word: וברך
  choice: und preise
  rationale: ברך bedeutet grundsätzlich „segnen“. Wenn ein Mensch den Schöpfer segnet, bezeichnet es hier ehrendes Lob; „preise“ gibt diesen Sinn in natürlichem, würdigem Deutsch wieder.
- source_word: עושיה
  choice: seinen Schöpfer
  rationale: Das Suffix bezieht sich auf den Regenbogen. „Seinen Schöpfer“ bewahrt die knappe, persönliche Bezeichnung, ohne Gott im Text ausdrücklich hinzuzufügen.
- source_word: כי
  choice: denn
  rationale: Die Konjunktion leitet die Begründung für die Aufforderung zum Preisen ein.
- source_word: מאד
  choice: überaus
  rationale: „Überaus“ erhält die starke Steigerung und passt zum poetischen Register.
- source_word: נאדרה
  choice: ist … majestätisch
  rationale: Die Form von אדר bezeichnet Hoheit, Herrlichkeit oder erhabene Pracht. „Majestätisch“ bewahrt die Vorstellung eindrucksvoller Größe.
- source_word: בהוד
  choice: in seiner Pracht
  rationale: הוד bezeichnet Pracht, Hoheit oder Herrlichkeit. Die deutsche Formulierung ist idiomatisch; „seiner“ stellt den im Zusammenhang eindeutigen Bezug zum Regenbogen her, obwohl das Hebräische kein Possessivsuffix setzt.
theological_decisions:
- issue: Empfänger des Preisens
  choice: „preise seinen Schöpfer“
  alternative: „preise Gott, der ihn geschaffen hat“
  rationale: Das Hebräische nennt Gott nicht ausdrücklich, sondern spricht vom „Schöpfer“ beziehungsweise „dem, der ihn gemacht hat“. Diese knappe Form bleibt erhalten und wird nicht dogmatisch erweitert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit poetischer Erhabenheit. Der Satz bleibt knapp und imperativisch; „preise“ vermeidet das im heutigen Deutsch missverständliche „segne seinen Schöpfer“, ohne den ehrenden Sinn von ברך aufzugeben.
