    issue: Unstimmiger Numerus und unklare Bezugnahme in der zweiten Vershälfte
    rationale: Der Entwurf kombiniert den pluralischen Vergleich „wie Heuschrecken“ mit dem Singular „lässt er sich“ und lässt dadurch die Bezugnahme auf den Schnee unnötig stolpern. Das Hebräische hat כארבה formal im Singular; eine entsprechende deutsche Form ist sowohl näher am Wortlaut als auch stilistisch geschlossen.
  - severity: low
    issue: Tautologische Wiedergabe von דירתו
    rationale: „dort nieder, wo er bleibt“ macht aus dem Substantiv „Wohnort/Aufenthaltsort“ einen inhaltlich beinahe kreisförmigen Relativsatz. „an seinem Lagerplatz“ gibt den nominalen Charakter und die Possessivbeziehung klarer wieder.
