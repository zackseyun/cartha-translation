  source_fidelity: 'Der Hauptsatz folgt dem erhaltenen hebräischen Wortlaut: רשף wird vorsichtig als „Aufleuchten“ wiedergegeben, יניף als das Ausschütteln des Schnees. Die zweite Zeile muss jedoch die grammatische Bezugnahme auf den Schnee klarer erhalten. Das hebräische כארבה ist formal Singular und kann kollektiv verstanden werden; eine singularische deutsche Vergleichsform vermeidet den bisherigen Wechsel von pluralischem Vergleich („Heuschrecken“) zu singularischem Prädikat („lässt er sich“). Die Fußnote dokumentiert angemessen die stark abweichende griechische Fassung und die Lesart aus Masada.'
  naturalness: „Wie Heuschrecken lässt er sich dort nieder, wo er bleibt“ ist im Deutschen wegen des Numerusbruchs und der tautologisch wirkenden Ortsangabe holprig. „Wie eine Heuschrecke lässt er sich an seinem Lagerplatz nieder“ ist verständlich, poetisch und bewahrt die bildhafte, absichtlich ungewöhnliche Aussage des schwierigen Hebräisch.
  terminology: „Aufleuchten“, „seinen Schnee“ und „ausschütteln“ sind sachgerecht und zurückhaltend. „Lagerplatz“ gibt דירה als Aufenthalts- bzw. Niederlassungsort idiomatisch wieder, ohne eine präzisere meteorologische Deutung zu erzwingen. Die griechischen Wetterbegriffe in der Fußnote sind korrekt als Sturm des Nordwinds und Wirbelwind wiedergegeben.
  issues:
