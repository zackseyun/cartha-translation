translation:
  language: de
  text: Beim Aufleuchten schüttelt er seinen Schnee aus[a], und wie eine Heuschrecke lässt er sich an seinem Lagerplatz nieder.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der hebräische Text ist schwierig und weicht stark von der griechischen Überlieferung ab. Diese spricht stattdessen vom Schall seines Donners sowie von einem Sturm des Nordwinds und einem Wirbelwind. Auch der hebräische Text aus Masada bietet hier eine andere Zeile und liest teilweise „der Schall des Donners“, wo der Text aus der Kairoer Geniza „beim Aufleuchten“ hat.
    reason: textual_variant
lexical_decisions:
- source_word: ברשף
  choice: Beim Aufleuchten
  rationale: רשף bezeichnet Glut, Flamme oder einen blitzartigen Lichtschein. Im Wetterzusammenhang bewahrt „beim Aufleuchten“ die knappe zeitlich-instrumentale Aussage, ohne eindeutig „Blitz“ vorauszusetzen.
- source_word: יניף
  choice: schüttelt er … aus
  rationale: Das Verb נוף/הניף kann „schwingen“, „schwenken“ oder „in Bewegung setzen“ bedeuten. Mit Schnee als Objekt gibt „ausschütteln“ das Bild des ausgestreuten Schnees natürlich wieder.
- source_word: שלגו
  choice: seinen Schnee
  rationale: Die Form trägt ein Suffix der dritten Person Singular. Anders als die englische Konsultationsfassung lässt die deutsche Übersetzung dieses ausdrückliche „seinen“ stehen.
- source_word: וכארבה
  choice: und wie Heuschrecken
  rationale: ארבה ist die übliche Bezeichnung für Heuschrecken beziehungsweise einen Heuschreckenschwarm. Der Plural vermittelt hier das Bild einer dicht herabkommenden und sich niederlassenden Menge.
- source_word: ישכון
  choice: lässt er sich … nieder
  rationale: שכן bedeutet „wohnen“, „sich niederlassen“ oder „ruhen“. Der Singular bezieht sich grammatisch am ehesten auf den Schnee; „sich niederlassen“ bewahrt zugleich die Belebtheit des Bildes.
- source_word: דירתו
  choice: wo er bleibt
  rationale: דירה bezeichnet Wohnung oder Aufenthaltsort. Die idiomatische Wendung erhält den räumlichen Sinn, ohne den schwierigen hebräischen Wortlaut künstlich zu glätten.
theological_decisions:
- issue: Hebräischer Text gegenüber der stark abweichenden griechischen Überlieferung
  choice: Der erhaltene hebräische Wortlaut bildet den Haupttext; die griechische Fassung wird in der Fußnote dokumentiert.
  alternative: Eine griechisch gestützte Übersetzung über den Schall seines Donners, das Land und den Sturm des Nordwinds.
  rationale: Wo ein hebräischer Sirach-Text erhalten ist, hat er für diese Übersetzung Vorrang. Da die Überlieferungen hier erheblich auseinandergehen, darf die Differenz nicht stillschweigend harmonisiert werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die poetische Belebung des Schnees und das Heuschreckenbild bleiben erhalten; die erhebliche textkritische Unsicherheit wird nicht im Haupttext aufgelöst, sondern transparent vermerkt.
