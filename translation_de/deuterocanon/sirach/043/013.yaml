  text: By his might he directs the lightning[b][a], and he makes the flashes prevail on high.
translation:
  language: de
  text: Durch seine Macht zeichnet er dem Blitz die Bahn vor[a], und die Feuerblitze lässt er hoch oben triumphieren.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hier verwendete hebräische Verb ist selten und an dieser Stelle unsicher; möglich sind Bedeutungen wie „vorzeichnen“, „lenken“ oder „bestimmen“.
    reason: lexical_alternative
  - marker: b
    text: 'Die griechische Parallelfassung lautet: „Auf seinen Befehl hin lässt er den Schnee zur Ruhe kommen, und er beschleunigt die Blitze seines Gerichts.“ Der hebräische und der griechische Text unterscheiden sich in dieser Zeile erheblich.'
    reason: alternative_reading
lexical_decisions:
- source_word: גבורתו
  choice: durch seine Macht
  rationale: גְּבוּרָה bezeichnet Kraft oder Macht; die deutsche Präpositionalfügung gibt den instrumentalen Sinn natürlich wieder.
- source_word: תתוה
  choice: zeichnet er … die Bahn vor
  rationale: Das seltene und hier unsichere Verb kann ein Markieren, Nachzeichnen oder Bestimmen ausdrücken. Die Wendung bewahrt dieses Bild und bezeichnet zugleich Gottes Lenkung des Blitzes, ohne die Unsicherheit auf eine einzige Bedeutung zu verengen.
- source_word: ברק
  choice: dem Blitz
  rationale: בָּרָק ist die übliche Bezeichnung für Blitz beziehungsweise Blitzstrahl.
- source_word: ותנצח
  choice: lässt er … triumphieren
  rationale: Die Wiedergabe wahrt den Gedanken des Überlegenseins oder Obsiegens und bildet die im Kontext naheliegende bewirkende Aussage ab.
- source_word: זיקות
  choice: die Feuerblitze
  rationale: Das Wort kann Funken oder feurige Licht- und Blitzerscheinungen bezeichnen. „Feuerblitze“ hält die Verbindung von Feuer und Blitz fest, ohne eine zu genaue meteorologische Deutung vorzugeben.
- source_word: במרום
  choice: hoch oben
  rationale: Die idiomatische Ortsangabe entspricht „in der Höhe/droben“ und bewahrt den poetischen Ton.
theological_decisions:
- issue: Hebräischer Text und deutlich abweichende griechische Parallelüberlieferung
  choice: Der Haupttext folgt der erhaltenen hebräischen Fassung und bewahrt ihr Bild vom Vorzeichnen der Blitzbahn.
  alternative: „Auf seinen Befehl hin lässt er den Schnee zur Ruhe kommen, und er beschleunigt die Blitze seines Gerichts.“
  rationale: Da für diesen Vers eine hoch bewertete hebräische Textgrundlage vorliegt, ist sie für den Haupttext maßgeblich. Die griechische Fassung weicht erheblich ab und wird deshalb vollständig in einer Fußnote dokumentiert, statt mit dem Hebräischen vermischt zu werden.
translation_notes:
  register: Poetisches, würdiges modernes Standarddeutsch. „Zeichnet … die Bahn vor“ erhält das ungewöhnliche hebräische Bild in verständlicher Form; „triumphieren“ bewahrt die kühne Personifikation des Verbs נצח.
