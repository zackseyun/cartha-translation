  text: Many such wonders exist[b][a], but I have seen only a few of his works.
translation:
  language: de
  text: Viele solcher Wunder gibt es[a], doch von seinen Werken habe ich nur wenige gesehen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Griechisch: „Es gibt viele verborgene Dinge, die größer sind als diese.“ Der hebräische Text lautet kürzer: „Viele solcher Wunder gibt es“, ohne ausdrücklich von verborgenen Dingen zu sprechen.'
    reason: alternative_reading
  - marker: b
    text: 'Im Griechischen steht: „Wir haben nur wenige seiner Werke gesehen“; der erhaltene hebräische Text hat: „Ich habe gesehen“.'
    reason: textual_variant
lexical_decisions:
- source_word: רוב
  choice: Viele
  rationale: Im Zusammenhang bezeichnet das Wort eine große Anzahl; „Viele“ ist im Deutschen natürlich und wird durch das griechische πολλὰ gestützt.
- source_word: נפלאות
  choice: Wunder
  rationale: Das Substantiv bezeichnet staunenerregende, außergewöhnliche Taten oder Werke und passt zum hymnischen Zusammenhang.
- source_word: כאלה
  choice: solcher
  rationale: Der Ausdruck verweist auf die zuvor beschriebenen Erscheinungen zurück und gibt die vergleichende Bedeutung knapp wieder.
- source_word: מעט
  choice: nur wenige
  rationale: Die partitive Konstruktion mit ממעשיו zeigt, dass lediglich eine geringe Zahl aus der Gesamtheit seiner Werke gemeint ist; „nur“ verdeutlicht diese Einschränkung idiomatisch.
- source_word: ראיתי
  choice: habe ich ... gesehen
  rationale: Die hebräische Perfektform bezeichnet hier die bis zur Gegenwart reichende Erfahrung des Sprechers; das deutsche Perfekt gibt dies natürlich wieder.
- source_word: ממעשיו
  choice: von seinen Werken
  rationale: 'Die Präposition מן ist partitiv: Der Sprecher hat nur wenige aus der Gesamtheit von Gottes Werken gesehen.'
theological_decisions:
- issue: Ob die griechische Aussage über verborgene und größere Dinge in den Haupttext aufgenommen werden soll
  choice: 'Der Haupttext folgt dem erhaltenen Hebräisch: „Viele solcher Wunder gibt es“.'
  alternative: „Es gibt viele verborgene Dinge, die größer sind als diese.“
  rationale: Der hebräische Zeuge ist hier vorhanden und enthält weder ausdrücklich „verborgen“ noch „größer als diese“. Die ausführlichere griechische Lesart bleibt deshalb in einer Fußnote erhalten, ohne den hebräischen Haupttext zu erweitern.
- issue: Unterschied zwischen hebräischem Singular und griechischem Plural der sprechenden Person
  choice: „habe ich ... gesehen“
  alternative: „haben wir ... gesehen“
  rationale: Das erhaltene Hebräisch hat die erste Person Singular. Der griechische Plural ist eine bedeutsame Textvariante und wird in der Fußnote dokumentiert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe, hymnische Aussage des Hebräischen bleibt gewahrt; die bedeutenden Abweichungen des griechischen Paralleltextes werden in den Fußnoten ausgewiesen.
