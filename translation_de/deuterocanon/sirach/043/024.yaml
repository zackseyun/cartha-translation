  text: Those who go down to the sea recount its far reaches[a]; when our ears hear[b], we are astonished.
translation:
  language: de
  text: Wer zum Meer hinabfährt, erzählt von seinen fernsten Weiten[a]; wenn unsere Ohren davon hören, staunen wir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die griechische Überlieferung hat hier „von seiner Gefahr“ statt des hebräischen „von seinem Ende/seinen äußersten Weiten“. Der Haupttext folgt dem erhaltenen hebräischen Text.
    reason: alternative_reading
lexical_decisions:
- source_word: יורדי הים
  choice: Wer zum Meer hinabfährt
  rationale: Die hebräische Wendung bedeutet wörtlich „die zum Meer Hinabfahrenden“ und bezeichnet Seefahrer. Die Übersetzung bewahrt das Bild des Hinabfahrens, formuliert es im Deutschen jedoch idiomatisch im Singular als allgemeine Personenbezeichnung.
- source_word: יספרו
  choice: erzählt
  rationale: Das Verb bezeichnet das berichtende Erzählen oder Schildern eigener Wahrnehmungen und Erfahrungen.
- source_word: קצהו
  choice: von seinen fernsten Weiten
  rationale: Das hebräische Wort bezeichnet sein Ende, seine Grenze oder äußerste Ausdehnung. Im Zusammenhang mit dem Meer gibt „fernste Weiten“ den räumlichen Sinn natürlich wieder, ohne die griechische Lesart „Gefahr“ in den Haupttext zu übernehmen.
- source_word: לשמע אזנינו
  choice: wenn unsere Ohren davon hören
  rationale: Die Formulierung erhält die im Hebräischen betonte Nennung der Ohren und ergänzt „davon“, um den Bezug im Deutschen klar und flüssig auszudrücken.
- source_word: נשתומם
  choice: staunen wir
  rationale: Das Verb drückt Erstaunen oder Bestürzung aus. „Staunen“ wahrt die Offenheit zwischen Verwunderung und überwältigter Reaktion, ohne Furcht ausdrücklich festzulegen.
