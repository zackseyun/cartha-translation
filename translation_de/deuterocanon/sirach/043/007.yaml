base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/043/007.yaml
  text: From them come the appointed time and the fixed seasons by statute[b][a], and the work he desired is in its cycle.
translation:
  language: de
  text: An ihnen erkennt man die festgesetzte Zeit und die durch Satzung bestimmten Zeiten[b][a]; und das Werk, das er wollte, ist in seinem Kreislauf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das Hebräische ist im zweiten Satzglied schwer verständlich. Der Text der Kairoer Geniza lautet ungefähr: „und das Gewollte/Werk … in seinem Kreislauf“. Der griechische Paralleltext lautet: „Vom Mond kommt das Zeichen eines Festes, ein Licht, das bis zur Vollendung abnimmt.“'
    reason: alternative_reading
  - marker: b
    text: 'Die Masada-Rolle liest: „Denn groß ist der Herr, der ihn gemacht hat“, während der Text der Kairoer Geniza eine andere und schwierigere Formulierung bietet.'
    reason: textual_variant
lexical_decisions:
- source_word: בם
  choice: Durch sie kommen
  rationale: ב kann „in“ oder „durch“ bedeuten. Im knappen poetischen Zusammenhang bezeichnet es die Himmelskörper als Mittel beziehungsweise Zeichen der Kalenderordnung; „Durch sie kommen“ wahrt diese Beziehung, ohne den Text ausdrücklich auf den Mond zu verengen.
- source_word: מועד
  choice: die festgesetzte Zeit
  rationale: מועד kann eine bestimmte Zeit, einen Festtermin oder ein Fest bezeichnen. Neben זמני ist die weitere kalendarische Bedeutung vorzuziehen.
- source_word: וזמני חוק
  choice: die durch Satzung bestimmten Zeiten
  rationale: זמנים bezeichnet Zeiten oder Zeitabschnitte, חוק etwas Festgesetztes oder Verordnetes. Die Formulierung gibt sowohl die zeitliche als auch die ordnende Bedeutung natürlich wieder.
- source_word: וחפץ עשיו
  choice: und das Werk, das er wollte
  rationale: Die überlieferte hebräische Formulierung ist schwierig. Diese Wiedergabe folgt vorsichtig dem möglichen Sinn einer gewollten beziehungsweise beabsichtigten Tat, ohne die unsichere Morphologie zu überspielen.
- source_word: בתקופתו
  choice: ist in seinem Kreislauf
  rationale: תקופה bezeichnet Umlauf, Wende oder wiederkehrenden Zeitlauf. Im astronomischen Zusammenhang trifft „Kreislauf“ die zyklische Bewegung und ihre Kalenderfunktion.
theological_decisions:
- issue: Subjekt und Aussagekraft des zweiten Satzglieds
  choice: Allgemeine Aussage über das gewollte Werk innerhalb seines Kreislaufs
  alternative: Nach dem griechischen Paralleltext könnte speziell der Mond als abnehmendes Licht und Zeichen eines Festes gemeint sein; die Masada-Lesart verweist stattdessen auf die Größe des Herrn als Schöpfer.
  rationale: Der Geniza-Text ist hier schwer verständlich. Der Haupttext bleibt deshalb nahe bei seiner offenen Formulierung und legt weder den Mond noch eine stärker ausgeführte Schöpferaussage eindeutig fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst knapper poetischer Syntax. Die beiden textkritischen Marker stehen im Haupttext; ihre ungewöhnliche Reihenfolge [b][a] entspricht der vorgegebenen konsultierten Fassung.
