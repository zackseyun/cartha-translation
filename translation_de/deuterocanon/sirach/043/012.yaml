  text: He encircled the horizon in his glory[c][b][a], and the hand of God stretched out in his majesty.
translation:
  language: de
  text: In ihrer Herrlichkeit zog sie einen festen Kreis,[a][c] und Gottes Hand spannte sie hoch aus.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Parallelfassung lautet: „Er umgab den Himmel mit einem Kreis der Herrlichkeit.“ Das hebräische חוק bedeutet gewöhnlich „Festsetzung“, „Ordnung“ oder „festgesetzte Grenze“; hier wird es im Zusammenhang mit dem Umkreisen als „fester Kreis“ wiedergegeben.'
    reason: alternative_reading
  - marker: b
    text: 'Im Hebräischen steht „Gottes Hand“ im Singular; die griechische Parallelfassung hat „die Hände des Höchsten“ und versteht die Erscheinung ausdrücklich als Objekt: „spannten ihn aus“.'
    reason: textual_variant
  - marker: c
    text: Die Masada-Handschrift bewahrt an dieser Stelle nur ein Bruchstück („… in ihrer Herrlichkeit“); der vollständigere Wortlaut des Haupttextes stammt aus den Kairoer Geniza-Handschriften.
    reason: textual_variant
lexical_decisions:
- source_word: חוק
  choice: einen festen Kreis
  rationale: חוק bezeichnet grundsätzlich etwas Festgesetztes, etwa Satzung, Ordnung oder Grenze. Zusammen mit הקיפה und im Bild des Regenbogens ist hier eine fest umrissene Kreislinie gemeint; „fester Kreis“ bewahrt sowohl den Gedanken der festgesetzten Ordnung als auch die räumliche Gestalt.
- source_word: הקיפה
  choice: zog sie … einen … Kreis
  rationale: Die feminine Verbform wird als Rückbezug auf den in diesem Zusammenhang genannten Regenbogen verstanden. Das Verb bezeichnet das Umgeben oder Umkreisen; die deutsche Wendung gibt das poetische Bild natürlich wieder.
- source_word: בכבודה
  choice: in ihrer Herrlichkeit
  rationale: Der feminine Singularsuffix wird entsprechend der femininen Verbform auf die Erscheinung des Regenbogens bezogen. „Herrlichkeit“ wahrt den erhabenen, doxologischen Ton.
- source_word: ויד אל
  choice: und Gottes Hand
  rationale: Der Singular folgt dem hebräischen Text. אל wird im Kontext als Gottesbezeichnung verstanden.
- source_word: נטתה
  choice: spannte sie … aus
  rationale: נטה kann „ausspannen, ausstrecken“ bedeuten. „Sie“ bezeichnet als unausgesprochenes Objekt die zuvor beschriebene Erscheinung; zugleich bleibt „Gottes Hand“ das grammatische Subjekt.
- source_word: בגבה
  choice: hoch
  rationale: Die schwer eindeutige Form gehört zum Bedeutungsfeld von Höhe und Erhabenheit. „hoch“ wahrt hier zunächst das räumlich-kosmische Bild, ohne die mögliche Nebenbedeutung von Hoheit ganz auszuschließen.
theological_decisions:
- issue: Abweichung zwischen dem hebräischen Hauptzeugen und der griechischen Parallelüberlieferung
  choice: Der Haupttext folgt den femininen Formen und dem Wort חוק im Hebräischen.
  alternative: „Er umgab den Himmel mit einem Kreis der Herrlichkeit, und die Hände des Höchsten spannten ihn aus.“
  rationale: Das erhaltene Hebräisch ist der primäre Ausgangstext. Die griechische Fassung bezeugt jedoch eine deutlich andere Deutung beziehungsweise Vorlage und wird deshalb vollständig in einer Fußnote dokumentiert.
- issue: Bezug der femininen Verb- und Pronominalformen
  choice: Sie werden auf die im Zusammenhang beschriebene Erscheinung des Regenbogens bezogen.
  alternative: Gott als ausdrücklich genanntes männliches Subjekt auffassen.
  rationale: הקיפה und בכבודה sind feminin; die Wiedergabe mit „sie/ihrer“ erhält diese grammatische Gestalt und vermeidet es, den hebräischen Text nach der griechischen Fassung zu maskulinisieren.
translation_notes:
  register: Moderne, würdevolle poetische Standardsprache. Die feminine Gestalt des Hebräischen wird bewusst erhalten; „fester Kreis“ verbindet die lexikalische Grundbedeutung von חוק mit dem kosmischen Bild, ohne die griechische Lesart „Himmel“ in den Haupttext einzutragen.
