  text: The Lord is exceedingly awesome[a], and his words are wondrous.
translation:
  language: de
  text: Der HERR ist überaus ehrfurchtgebietend, und seine Worte[a] sind wunderbar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Parallelüberlieferung lautet: „Furchtgebietend ist der Herr und überaus groß; wunderbar ist seine Herrschaft.“ Sie weicht damit vom erhaltenen hebräischen Text „seine Worte sind wunderbar“ ab.'
    reason: alternative_reading
lexical_decisions:
- source_word: נורא
  choice: Ehrfurcht gebietend
  rationale: Das von ירא abgeleitete Adjektiv bezeichnet jemanden, der Furcht und ehrfürchtiges Staunen hervorruft. „Ehrfurcht gebietend“ bewahrt beide Sinnanteile, ohne Gott lediglich als bedrohlich darzustellen.
- source_word: ה׳
  choice: der HERR
  rationale: Die Abkürzung steht für den Gottesnamen. Die Wiedergabe mit „HERR“ folgt der etablierten deutschen Bibelkonvention und wird vom griechischen Κύριος gestützt.
- source_word: מאד מאד
  choice: überaus
  rationale: Die Verdopplung verstärkt die Aussage nachdrücklich. „Überaus“ gibt diese starke Intensivierung in natürlichem, gehobenem Deutsch wieder, ohne die im Deutschen schwerfällige Wiederholung „sehr, sehr“ zu erzwingen.
- source_word: ונפלאות
  choice: und … sind wunderbar
  rationale: Die Form von פלא bezeichnet etwas Außerordentliches und Staunenswertes. Da der hebräische Satz kein ausdrückliches Verb enthält, wird im Deutschen „sind“ ergänzt.
- source_word: דבריו
  choice: seine Worte
  rationale: Der naheliegende Sinn ist „seine Worte“ beziehungsweise „seine Äußerungen“. Diese Lesart des erhaltenen hebräischen Textes hat Vorrang vor der abweichenden griechischen Überlieferung.
theological_decisions:
- issue: Wiedergabe des Gottesnamens ה׳
  choice: der HERR
  alternative: der Herr
  rationale: Die Kapitälchenkonvention macht kenntlich, dass hinter dem Titel der Gottesname steht. Sie bleibt zugleich verständlich und legt keine konfessionelle Sonderdeutung fest.
- issue: Abweichung zwischen hebräischem Text und griechischer Parallelüberlieferung
  choice: seine Worte sind wunderbar
  alternative: seine Herrschaft ist wunderbar
  rationale: Da ein verständlicher hebräischer Text vorliegt, bestimmt er den Haupttext. Die griechische Fassung bezeugt jedoch eine inhaltlich bedeutsame Variante, die in einer Fußnote offengelegt wird, statt beide Lesarten stillschweigend anzugleichen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Ehrfurcht gebietend“ hält die Spannung zwischen Furcht und ehrfürchtigem Staunen fest; „überaus“ gibt die hebräische Verdopplung idiomatisch wieder. Die Fußnote dokumentiert die wesentliche griechische Textvariante.
