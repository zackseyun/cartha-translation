  text: The sun[a], appearing in its form and hot[c][b], how awe-inspiring are the works of the Lord.
translation:
  language: de
  text: Die Sonne[a], die in ihrer Gestalt sichtbar wird und heiß ist[b][c] – wie ehrfurchtgebietend sind die Werke des HERRN!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Parallelüberlieferung lautet sinngemäß: „Die Sonne verkündet bei ihrem Erscheinen, wenn sie aufgeht: ein wunderbares Gerät, ein Werk des Höchsten.“ Der hebräische Text hebt dagegen die sichtbare Gestalt und die Hitze der Sonne hervor.'
    reason: alternative_reading
  - marker: b
    text: Die hebräische Wendung hinter „die in ihrer Gestalt sichtbar wird und heiß ist“ ist knapp und etwas schwierig. Sie beschreibt wahrscheinlich die sichtbare Erscheinung und die Hitze der Sonne; die genaue Funktion des ersten Ausdrucks ist unsicher.
    reason: lexical_alternative
  - marker: c
    text: Die Masada-Handschrift bewahrt diese Zeile hier nur bruchstückhaft; die vollständigere hebräische Formulierung des Haupttextes stammt aus den Handschriften der Kairoer Geniza.
    reason: textual_variant
lexical_decisions:
- source_word: שמש
  choice: die Sonne
  rationale: Die gewöhnliche Bezeichnung des Himmelskörpers; der bestimmte Artikel entspricht natürlichem Deutsch.
- source_word: מביע
  choice: hervorstrahlend
  rationale: Das Partizip kann ein Hervortreten beziehungsweise Kundtun bezeichnen. Im Zusammenhang mit der Sonne verbindet „hervorstrahlend“ die sichtbare Erscheinung mit dem Gedanken, dass sie Gottes Werke kundmacht, ohne den schwierigen Ausdruck zu stark auszudeuten.
- source_word: בצורתו
  choice: in ihrer Gestalt
  rationale: צורה bezeichnet hier die sichtbare Form oder Erscheinung. „Gestalt“ bleibt nah am Hebräischen und bewahrt den Bezug auf das Sichtbare.
- source_word: וחמה
  choice: und glühend
  rationale: Die überlieferte Formulierung ist knapp und syntaktisch schwierig, weist aber wahrscheinlich auf die Hitze der Sonne. „Glühend“ gibt dies idiomatischer wieder als das substantivische „und Hitze“, ohne den Satz stark auszubauen.
- source_word: מה נורא
  choice: wie ehrfurchtgebietend
  rationale: נורא bezeichnet etwas, das Furcht und staunende Ehrfurcht hervorruft. „Ehrfurchtgebietend“ ist würdig und vermeidet das heute oft umgangssprachliche „fantastisch“.
- source_word: מעשי ה׳
  choice: sind die Werke des HERRN
  rationale: Der Plural מעשי wird mit „Werke“ wiedergegeben. Die reverenzielle Abkürzung ה׳ steht für den Gottesnamen und wird entsprechend der üblichen deutschen Bibelkonvention als „HERR“ gesetzt.
theological_decisions:
- issue: Wiedergabe der Gottesnamen-Abkürzung ה׳
  choice: des HERRN
  alternative: des Herrn
  rationale: Die hebräische Abkürzung vertritt den Gottesnamen. „HERR“ in Kapitälchen beziehungsweise Versalien kennzeichnet dies transparent und unterscheidet den Namen vom allgemeinen Hoheitstitel „Herr“.
- issue: Bezug der Aussage über die Sonne auf Gottes Werke
  choice: Plural „die Werke des HERRN“ beibehalten
  alternative: Singular „ein Werk des Höchsten“ nach der griechischen Parallele
  rationale: Der hebräische Hauptzeuge hat ausdrücklich den Plural מעשי und den Gottesnamen. Die abweichende griechische Fassung wird in der Fußnote dokumentiert, aber nicht in den Haupttext eingetragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Gedankenstrich bildet die knappe hebräische Satzfügung ab und leitet den staunenden Ausruf ein. „Hervorstrahlend und glühend“ ist anschaulich und verständlich, lässt die Unsicherheit der komprimierten hebräischen Wendung jedoch durch die Fußnote ausdrücklich sichtbar.
