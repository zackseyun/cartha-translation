  text: By his power he gives strength to the clouds[b][a], to cast down hailstones.
translation:
  language: de
  text: Durch seine Kraft verleiht er der Wolke[a][b] Stärke, Hagelsteine herabzuwerfen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Hebräischen steht „Wolke“ im Singular; der griechische Paralleltext hat „Wolken“ im Plural. Die Übersetzung folgt hier dem hebräischen Hauptzeugen.
    reason: alternative_reading
  - marker: b
    text: Die Masada-Handschrift bewahrt nur den Anfang des Verses („Und durch seine Kraft ist die Wolke stark“). Der hebräische Text aus der Kairoer Geniza setzt mit den Hagelsteinen fort; der griechische Paralleltext bestätigt das Hagelmotiv.
    reason: textual_variant
lexical_decisions:
- source_word: בכחו
  choice: Durch seine Kraft
  rationale: Die Präposition ב bezeichnet hier am natürlichsten das Mittel; „durch seine Kraft“ gibt den instrumentalen Sinn klar und würdig wieder.
- source_word: יתן
  choice: verleiht er
  rationale: נתן bedeutet grundsätzlich „geben“. Mit „Stärke“ ist „verleihen“ im modernen Deutschen idiomatischer, ohne den Sinn interpretierend zu erweitern.
- source_word: לענן
  choice: der Wolke
  rationale: Der hebräische Text hat den Singular „Wolke“. Die Wiedergabe bewahrt diese Form des Hauptzeugen, obwohl der griechische Paralleltext den Plural bietet.
- source_word: עז
  choice: Stärke
  rationale: עז bezeichnet Stärke oder Macht. „Stärke“ verbindet sich natürlich mit „verleihen“ und wahrt den konkreten Aussagegehalt.
- source_word: להשליך
  choice: um … herabzuwerfen
  rationale: Der Infinitiv kann Zweck oder Folge ausdrücken. Die Formulierung bewahrt diese leichte Offenheit; „herabwerfen“ passt zur Bewegung des Hagels aus der Wolke.
- source_word: אבני אלגביש
  choice: Hagelsteine
  rationale: Die wörtliche Wendung „Steine des Hagels/Eises“ wird im Deutschen natürlich und bildtreu mit „Hagelsteine“ wiedergegeben.
