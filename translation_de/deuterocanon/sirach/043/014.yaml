  text: For this reason he created the storehouse[b][a], and made the clouds fly like birds.
translation:
  language: de
  text: Darum schuf er eine Vorratskammer[a] und ließ die Wolken wie Vögel fliegen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nach den hebräischen Konsonanten: „schuf er eine Vorratskammer“. Der griechische Paralleltext lautet dagegen: „Da wurden die Vorratskammern geöffnet“; möglicherweise bewahrt er hier den beabsichtigten Sinn.'
    reason: textual_variant
  - marker: b
    text: Dieser Vers ist in den Handschriften von Masada nicht klar erhalten. Hauptzeuge ist hier der hebräische Text aus der Kairoer Geniza; der griechische Text dient zum Vergleich.
    reason: cross_reference
lexical_decisions:
- source_word: למען
  choice: Darum
  rationale: Hier bezeichnet die Wendung im Zusammenhang eine Folge bzw. Begründung; dies wird durch das griechische διὰ τοῦτο bestätigt. „Darum“ ist knapp, natürlich und poetisch.
- source_word: ברא
  choice: schuf
  rationale: Die überlieferten hebräischen Konsonanten ergeben zunächst „schuf“. Die abweichende, im Wetterbild gut passende griechische Lesart „wurden geöffnet“ wird in einer Fußnote bewahrt, statt den hebräischen Hauptzeugen stillschweigend zu korrigieren.
- source_word: אוצר
  choice: eine Vorratskammer
  rationale: אוצר bezeichnet einen Ort, an dem Vorräte oder Schätze aufbewahrt werden. „Vorratskammer“ macht im Zusammenhang mit den Himmels- und Wettererscheinungen das Bild eines himmlischen Vorratslagers verständlich und wahrt den Singular des Hebräischen.
- source_word: ויעף
  choice: flogen
  rationale: Die unpunktierte Form lässt sich im Zusammenhang als Flugbewegung der nachfolgenden Wolken verstehen. Auch das griechische ἐξεπέτασαν beschreibt, dass sie aufflogen bzw. sich fliegend ausbreiteten; eine ausdrückliche Verursachung durch „ließ … fliegen“ steht nicht eindeutig im erhaltenen Wortlaut.
- source_word: עבים
  choice: Wolken
  rationale: Das Wort bezeichnet Wolken, häufig dichte Regenwolken. „Wolken“ ist im Deutschen klar und fügt keine nicht ausdrücklich markierte Eigenschaft hinzu.
- source_word: כצפרים
  choice: wie Vögel
  rationale: Die direkte poetische Vergleichsform wird im modernen Deutschen natürlich und anschaulich wiedergegeben.
theological_decisions:
- issue: Verhältnis des hebräischen Hauptzeugen zur abweichenden griechischen Parallelüberlieferung
  choice: Im Haupttext steht „schuf er eine Vorratskammer“ nach den hebräischen Konsonanten.
  alternative: „Da wurden die Vorratskammern geöffnet“ nach dem griechischen Paralleltext.
  rationale: Die Übersetzung geht vom erhaltenen Hebräisch aus und verdeckt dessen schwierige Formulierung nicht. Zugleich wird die plausible griechische Lesart, die gut zum Bild himmlischer Wettervorräte passt, ausdrücklich dokumentiert, ohne die textliche Spannung aufzulösen.
translation_notes:
  register: Moderne, würdige Standardsprache mit knapper poetischer Satzführung. Die ungewöhnliche Aussage des hebräischen Hauptzeugen bleibt im Text sichtbar; die besser in das Wetterbild passende griechische Fassung wird nicht eingearbeitet, sondern transparent in der Fußnote genannt.
