  text: The appearance of snow dazzles the eyes, and at its falling the heart is amazed.
translation:
  language: de
  text: Der Anblick des Schnees[a] lässt die Augen erstrahlen, und bei seinem Herabfallen[b] gerät das Herz in Wallung.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort kann auch „Weiße“ bedeuten; der Zusammenhang und der griechische Paralleltext sprechen hier für „Schnee“.
    reason: lexical_alternative
  - marker: b
    text: Wörtlich steht eine Wendung aus dem Wortfeld „Regen/Niederschlag“. Gemeint ist im Zusammenhang wohl das Herabfallen des Schnees.
    reason: textual_variant
  - marker: c
    text: Eine Masada-Handschrift bewahrt in diesem Abschnitt eine abweichende benachbarte Zeile („und der Anblick versetzt das Herz in Staunen“). Das weist auf eine gewisse Instabilität in der Anordnung dieser Satzglieder in den hebräischen Zeugen hin.
    reason: textual_variant
lexical_decisions:
- source_word: תואר
  choice: Anblick
  rationale: Das Substantiv bezeichnet hier die sichtbare Erscheinung; „Anblick“ gibt den poetischen und visuellen Sinn natürlich wieder, ohne ihn auf bloße Schönheit einzuengen.
- source_word: לבנה
  choice: Schnee
  rationale: Wörtlich ist auch „Weiße/Weißheit“ möglich. Der meteorologische Zusammenhang und das ausdrückliche χιόνα („Schnee“) im griechischen Paralleltext sprechen jedoch deutlich für „Schnee“.
- source_word: יגהה עינים
  choice: lässt die Augen erstrahlen
  rationale: Die Wendung beschreibt eine Wirkung von Glanz oder Helligkeit auf die Augen. Die Übersetzung bewahrt das Lichtmotiv des hebräischen Verbs, während der griechische Paralleltext stärker die staunende Reaktion betont.
- source_word: ממטרו
  choice: bei seinem Niedergang
  rationale: Die überlieferte Form gehört zum Wortfeld „Regen/Niederschlag“. Im Zusammenhang mit Schnee bezeichnet sie am ehesten dessen Herabfallen; „Niedergang“ wahrt zugleich die etwas ungewöhnliche meteorologische Ausdrucksweise.
- source_word: יהמה לב
  choice: gerät das Herz in Wallung
  rationale: Das Verb bezeichnet Dröhnen, Unruhe oder innere Erregung. „Gerät ... in Wallung“ erhält diese lebhafte Bewegung besser als eine reine Deutung als Staunen; der griechische Paralleltext versteht die Reaktion als Außer-sich-Geraten.
theological_decisions: []
translation_notes:
  register: Moderne, würdige poetische Standardsprache. Die zwei parallelen Satzglieder bleiben erhalten. Die Übersetzung folgt vorrangig dem Hebräischen und nutzt das Griechische zur Klärung von לבנה und der schwierigen Niederschlagswendung, ohne die stärkere hebräische Bildlichkeit von יהמה auf bloßes Erstaunen zu reduzieren.
