  text: The splendor of the heavens and the majesty of the stars—its light shines brightly in the heights of God[a][b].
translation:
  language: de
  text: Die Schönheit des Himmels und die Herrlichkeit der Sterne – ihr Licht strahlt in Gottes Höhen.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die Masada-Überlieferung bewahrt hier eine abweichende Eröffnungslesart, sinngemäß: „… die Schönheit/Pracht des Himmels und die Herrlichkeit eines Sterns“. Der Haupttext folgt der Kairo-Geniza-Überlieferung. Die Wiedergabe „der Sterne“ versteht die hebräische Singularform kollektiv; auch der griechische Paralleltext hat hier den Plural „Sterne“.'
    reason: textual_variant
  - marker: b
    text: 'Der griechische Paralleltext lautet sinngemäß: „Schönheit des Himmels, Herrlichkeit der Sterne, eine leuchtende Zierde; in den Höhen: der Herr.“ Er bestätigt das Bild der Himmelslichter als strahlender Schmuck; der Haupttext folgt jedoch dem erhaltenen hebräischen Wortlaut.'
    reason: alternative_reading
lexical_decisions:
- source_word: תואר
  choice: Schönheit
  rationale: Im Zusammenhang mit dem Himmel bezeichnet das Wort dessen eindrucksvolle sichtbare Erscheinung; „Schönheit“ ist im Deutschen natürlich und poetisch, ohne die Bedeutung auf die neutralere „Gestalt“ zu verengen.
- source_word: שמים
  choice: des Himmels
  rationale: Das morphologisch plurale hebräische Wort bezeichnet hier den sichtbaren Himmel. Der deutsche Singular ist dafür die natürliche Ausdrucksweise und bewahrt den poetischen Ton.
- source_word: הדר
  choice: Herrlichkeit
  rationale: Das Wort bezeichnet erhabene Pracht oder Majestät. „Herrlichkeit“ unterscheidet es von תואר und gibt den gehobenen Ton wieder.
- source_word: כוכב
  choice: der Sterne
  rationale: Die hebräische Form ist singularisch und kann kollektiv verstanden werden; der griechische Paralleltext hat ausdrücklich den Plural ἄστρων. Der Plural passt zum Gesamtbild des Sternenhimmels, während die abweichende Singularlesart in der Fußnote offengelegt wird.
- source_word: ואורו
  choice: ihr Licht
  rationale: Das hebräische Suffix ist singularisch. Im deutschen Haupttext bezieht sich „ihr“ grammatisch auf die kollektiv verstandenen Sterne; die zugrunde liegende Spannung zwischen Singularform und kollektivem Sinn wird nicht dogmatisch aufgelöst, sondern textkritisch erläutert.
- source_word: מזהיר
  choice: strahlt
  rationale: Das Partizip beschreibt das Ausgehen hellen Lichts. „Strahlt“ gibt diese aktive Leuchtkraft knapp und idiomatisch wieder.
- source_word: במרומי אל
  choice: in Gottes Höhen
  rationale: Die Wendung nennt אל ausdrücklich und bezeichnet die Gott zugeordneten himmlischen Höhen. „Gottes Höhen“ ist knapp, verständlich und bewahrt den Gottesbezug.
theological_decisions:
- issue: Wiedergabe von אל in במרומי אל
  choice: Gottes
  alternative: des Mächtigen; in den höchsten Höhen
  rationale: Der hebräische Text nennt אל ausdrücklich. „Gott“ ist hier die transparenteste und konfessionell unmarkierte Wiedergabe; eine Tilgung des Gottesbezugs oder eine stärker deutende Umschreibung wäre nicht gerechtfertigt.
translation_notes:
  register: Moderne, würdige Standardsprache mit poetischem Rhythmus. Der Gedankenstrich bildet die verdichtete hebräische Bildfolge ab. „Herrlichkeit“ wahrt das gehobene Register, bleibt aber im Zusammenhang allgemein verständlich. Die Fußnoten markieren die echte textliche und grammatische Spannung zwischen dem hebräischen Singular und dem griechisch gestützten kollektiven Verständnis.
