  text: It scorches the produce of the mountains with drought[b][a], and the pasture of plants with flame.
translation:
  language: de
  text: Den Ertrag der Berge versengt er durch Dürre[b][a] und die Pflanzenflur durch Flammenglut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Paralleltext lautet allgemeiner: „Er wird Berge verzehren und die Wüste ausbrennen und das grüne Gras wie Feuer auslöschen.“ Der hier zugrunde gelegte hebräische Text ist knapper und weicht in seinen Bildern davon ab.'
    reason: alternative_reading
  - marker: b
    text: Das mit „Dürre“ wiedergegebene hebräische Wort bezeichnet Trockenheit; „durch Trockenheit“ ist als wörtlichere Übersetzung ebenfalls möglich.
    reason: lexical_alternative
lexical_decisions:
- source_word: יבול
  choice: Ertrag
  rationale: Das Substantiv bezeichnet das, was das Land hervorbringt. „Ertrag“ ist breit genug für den Bewuchs der Berge und wahrt die knappe poetische Form.
- source_word: הרים
  choice: Berge
  rationale: Dies ist die unmittelbare Bedeutung und stimmt mit dem griechischen Paralleltext überein.
- source_word: בחרב
  choice: durch Dürre
  rationale: חֹרֶב bezeichnet Trockenheit beziehungsweise Dürre. „Durch Dürre“ gibt die instrumentale Wendung im Deutschen idiomatisch wieder; „durch Trockenheit“ wäre wörtlicher möglich.
- source_word: ישיק
  choice: versengt er
  rationale: Im Parallelismus mit „Flammenglut“ bezeichnet das Verb eine zerstörerische Wirkung des Brennens oder Versengens. „Versengt“ wahrt das Bild, ohne im ersten Halbvers buchstäbliches Feuer vorauszusetzen.
- source_word: נוה צמחים
  choice: Pflanzenflur
  rationale: נוה bezeichnet hier eine Flur, Weide oder Aue, nicht eine menschliche Wohnstätte; zusammen mit צמחים ist „Pflanzenflur“ eine knappe poetische Wiedergabe des bewachsenen Landes.
- source_word: בלהבה
  choice: durch Flammenglut
  rationale: Die präpositionale Fügung ist instrumental. „Flammenglut“ bewahrt das Feuerbild und klingt im Deutschen natürlicher und kräftiger als das wörtliche „durch eine Flamme“.
