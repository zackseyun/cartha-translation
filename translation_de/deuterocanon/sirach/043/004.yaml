  yaml_path: translation/deuterocanon/sirach/043/004.yaml
  text: Like a blazing furnace in the works of heat[a], the sun scorches the mountains three times over; breathing out fiery vapors, and flashing rays[b], it dims the eyes.
translation:
  language: de
  text: Wie ein angefachter Ofen bei sengender Hitze versengt die Sonne die Berge dreifach[a]; sie haucht feurige Dämpfe aus und lässt Strahlen aufblitzen, die die Augen trüben.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der hebräische Wortlaut dieses Verses ist stellenweise schwer verständlich und stimmt nicht in allen Einzelheiten mit der griechischen Überlieferung überein. Die Übersetzung folgt vorrangig dem erhaltenen Hebräisch und zieht zur Klärung dichter oder unsicherer Wendungen die griechische Parallelfassung heran.
    reason: textual_variant
  - marker: b
    text: „Dreifach“ ist in der griechischen Fassung ausdrücklich bezeugt (τριπλασίως), im erhaltenen Hebräisch jedoch nicht eindeutig. Auch die Bilder der feurigen Dämpfe, der aufblitzenden Strahlen und des Trübens der Augen folgen der klareren griechischen Parallelfassung.
    reason: alternative_reading
lexical_decisions:
- source_word: כור נפוח
  choice: angefachter Schmelzofen
  rationale: כור bezeichnet einen Ofen beziehungsweise Schmelzofen; נפוח verweist auf das Anblasen mit dem Blasebalg. „Angefacht“ bewahrt das Bild in natürlichem Deutsch.
- source_word: מחם מצוק
  choice: in sengender Hitze
  rationale: Die hebräische Verbindung ist schwierig. Die Wiedergabe hält an der Vorstellung intensiver, bedrängender Hitze fest, ohne die ungewöhnliche Formulierung unnötig zu glätten.
- source_word: שולח שמש ידליק הרים
  choice: setzt die Sonne die Berge in Brand
  rationale: ידליק bedeutet anzünden oder entflammen. Die komprimierte hebräische Syntax wird so im Deutschen verständlich wiedergegeben; auf das nur im Griechischen klare „dreifach“ wird im Haupttext verzichtet.
- source_word: לשאון מאור תגמר נושבת
  choice: unter dem Brausen ihres Lichts bläst sie, bis alles verzehrt ist
  rationale: 'Die textlich schwierige Zeile wird möglichst nah an den erkennbaren hebräischen Elementen wiedergegeben: שאון als Brausen, מאור als Licht, נושבת als blasen und תגמר als vollenden beziehungsweise verzehren.'
- source_word: ומנורה תכוה עין
  choice: ihre Leuchte versengt das Auge
  rationale: Die hebräische Bildsprache nennt eine Leuchte und die Schädigung des Auges durch Hitze. „Versengt“ wahrt diese kräftige Aussage, ohne sie zu völliger Blindheit zu steigern.
