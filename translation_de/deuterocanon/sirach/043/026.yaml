  text: For his sake the messenger succeeds[b][a], and by his word he accomplishes his will.
translation:
  language: de
  text: Um seinetwillen hat der Bote Erfolg[a], und durch sein Wort vollbringt er seinen Willen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Engel“. Das hebräische Wort מַלְאָךְ kann sowohl „Bote“ als auch „Engel“ bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Die griechische Parallelüberlieferung lautet abweichend: „Und durch sein Wort ist alles zusammengefügt.“'
    reason: alternative_reading
lexical_decisions:
- source_word: למענו
  choice: Um seinetwillen
  rationale: Gibt die Zweck- oder Bezugsbedeutung von לְמַעַן idiomatisch wieder und bezieht das Suffix im Kontext auf Gott.
- source_word: יצלח
  choice: hat Erfolg
  rationale: צָלַח bezeichnet erfolgreiches Handeln oder Gelingen; „hat Erfolg“ ist im modernen Deutsch natürlicher als „gedeiht“ und wahrt den aktiven Bezug auf den Boten.
- source_word: מלאך
  choice: der Bote
  rationale: מַלְאָךְ kann sowohl einen menschlichen Boten als auch einen Engel bezeichnen. „Bote“ hält die lexikalische Mehrdeutigkeit im Haupttext offen.
- source_word: ובדבריו
  choice: und durch sein Wort
  rationale: 'Das ב wird instrumental verstanden: Das göttliche Wort ist das Mittel wirksamen Handelns.'
- source_word: יפעל
  choice: vollbringt er
  rationale: פָּעַל bezeichnet Tun, Wirken oder Ausführen. „Vollbringt“ drückt die erfolgreiche Verwirklichung des Willens würdig und natürlich aus.
- source_word: רצון
  choice: seinen Willen
  rationale: רָצוֹן kann Wille, Wunsch oder Wohlgefallen bedeuten; im Zusammenhang göttlichen Wirkens ist „sein Wille“ die direkte, geläufige Wiedergabe.
theological_decisions:
- issue: Ob מלאך ausdrücklich als Engel zu verstehen ist
  choice: der Bote
  alternative: der Engel
  rationale: Der hebräische Ausdruck legt nicht eindeutig einen himmlischen Engel fest. Daher bleibt der allgemeinere Sinn im Haupttext erhalten, während die mögliche angelologische Lesart in der Fußnote genannt wird.
- issue: Abweichende Aussage der griechischen Parallelüberlieferung
  choice: Der hebräischen Einzelaussage über den Boten und die Erfüllung des göttlichen Willens folgen
  alternative: „Durch sein Wort ist alles zusammengefügt/geordnet“
  rationale: Der sicher bezeugte hebräische Text ist die primäre Grundlage. Die griechische Fassung bezeugt eine breitere kosmische Aussage, wird aber nicht in den Haupttext eingemischt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt nahe am hebräischen Parallelismus; die Mehrdeutigkeit von מלאך wird nicht stillschweigend zugunsten von „Engel“ aufgelöst.
