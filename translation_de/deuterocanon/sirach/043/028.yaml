  text: Let us still magnify him[a], for we cannot search him out; and he is greater than all his works.
translation:
  language: de
  text: Lasst uns noch von seiner Größe sprechen[a], denn wir können ihn nicht ergründen; er ist größer als alle seine Werke.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch etwa: »Lasst uns weiter groß machen« bzw. »preisen«; das Objekt bleibt unausgesprochen. Auch bei »ergründen« ist kein Objekt genannt. Im Zusammenhang ist Gott gemeint; die griechische Parallele bestätigt diesen Bezug dem Sinn nach.'
    reason: Die Anmerkung kennzeichnet die impliziten Objekte präzise, bietet die wesentliche lexikalische Alternative und vermeidet eine zu starke Aussage über die syntaktische Beweiskraft der griechischen Parallele.
lexical_decisions:
- source_word: נגדלה עוד
  choice: Lasst uns noch von seiner Größe sprechen
  rationale: 'Die Kohortativform von גדל fordert gemeinsam dazu auf, Gottes Größe weiter zu rühmen oder von ihr zu sprechen. Die Wiedergabe ist im heutigen Deutsch natürlich und lässt durch die Fußnote erkennen, dass das hebräische Verb auch im Sinn von »groß machen/preisen« verstanden werden kann. עוד bezeichnet die Fortsetzung: »noch«, »weiter«.'
- source_word: כי לא נחקור
  choice: denn wir können ihn nicht ergründen
  rationale: חקר bezeichnet gründliches Erforschen oder Ergründen. Im Hebräischen bleibt das Objekt unausgesprochen; der Zusammenhang und die griechische Parallele weisen auf Gott. »Ergründen« bewahrt das Bild menschlicher Forschung und ihre Grenze.
- source_word: והוא גדול מכל מעשיו
  choice: er ist größer als alle seine Werke
  rationale: מכל verleiht גדול hier vergleichende Bedeutung. מעשיו kann Taten oder Werke bezeichnen; im Zusammenhang des Schöpfungslobes umfasst »Werke« passend alles von Gott Geschaffene.
theological_decisions:
- issue: Unausgesprochenes Objekt bei »wir können nicht ergründen«
  choice: 'Das sinngemäße Objekt wird als Gott selbst wiedergegeben: »wir können ihn nicht ergründen«.'
  alternative: 'Die Aussage könnte ohne ausdrückliches Objekt stehen oder abstrakt auf Gottes Größe bezogen werden: »wir können sie nicht ergründen«.'
  rationale: Das Hebräische lässt das Objekt offen. Der unmittelbare Zusammenhang und die griechische Parallele machen Gott zum naheliegenden Bezug, ohne näher festzulegen, in welchem Sinn er unergründlich ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Von seiner Größe sprechen« ist verständlicher als das im Deutschen missverständliche »ihn groß machen«; »ergründen« hält den poetisch-weisheitlichen Ton, ohne altertümlich zu wirken.
