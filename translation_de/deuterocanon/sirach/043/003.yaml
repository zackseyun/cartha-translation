translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das feminine Pronomen bezieht sich auf die Sonne aus dem unmittelbaren Kontext. Die eindringlichen hebräischen Bilder „zum Kochen bringen“ und „Schwert“ bleiben erhalten; die Fußnoten dokumentieren Textgrundlage und griechische Parallele.
