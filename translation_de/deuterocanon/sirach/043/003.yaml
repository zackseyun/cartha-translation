  text: At its shining it makes the world boil[b][a], and before its sword who can endure?
translation:
  language: de
  text: Bei ihrem Aufstrahlen lässt sie die Welt sieden[b]; wer kann vor ihrem Schwert standhalten?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: „vor ihrem Schwert“; die griechische Parallele liest sinngemäß: „Wer wird vor ihrer Gluthitze standhalten?“ Der Haupttext bewahrt das hebräische Bild.'
    reason: alternative_reading
  - marker: b
    text: Der ältere Textzeuge aus Masada ist an dieser Stelle nur bruchstückhaft erhalten. Die hier wiedergegebene Formulierung folgt hauptsächlich den hebräischen Handschriften aus der Kairoer Geniza; die griechische Fassung dient als Vergleichstext.
    reason: textual_variant
lexical_decisions:
- source_word: בהצהירו
  choice: Wenn sie hell erstrahlt
  rationale: Die hebräische Form bezeichnet hier das helle Aufstrahlen bzw. Glühen der Sonne. Die zeitliche Deutung der griechischen Parallele („zur Mittagszeit“) wird nicht in den Haupttext übernommen, ist aber mit dem Bild ihrer stärksten Strahlung vereinbar.
- source_word: ירתיח
  choice: bringt ... zum Kochen
  rationale: רתח bezeichnet Kochen oder Sieden. Die Wendung bewahrt das kräftige hebräische Bild extremer Hitze; das griechische „trocknet ... aus“ ist eine sinngemäße Wiedergabe ihrer Wirkung.
- source_word: תבל
  choice: die Welt
  rationale: תבל meint häufig die Welt als bewohnte Erde. „Die Welt“ ist im Deutschen natürlich und wahrt die Weite des Ausdrucks.
- source_word: חרבו
  choice: ihrem Schwert
  rationale: Der hebräische Text bietet wörtlich „ihr Schwert“ und personifiziert damit die schneidende, zerstörerische Kraft der Sonne. Die griechische Parallele deutet das Bild als „Gluthitze“.
- source_word: מי יתכלכל
  choice: wer kann ... bestehen?
  rationale: Die Wendung bezeichnet, sich unter einer Belastung zu halten oder ihr standzuhalten. „Bestehen“ ist idiomatisch und passt zur griechischen Parallele „wer wird standhalten?“
