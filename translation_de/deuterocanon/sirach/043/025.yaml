  text: There are the wonders of his marvelous works[a], every kind of living thing, and the great sea-creatures.
translation:
  language: de
  text: 'Dort sind die Wunder seines erstaunlichen Wirkens: alle Arten von Lebewesen und gewaltige Meerestiere.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der hebräische Schluss lautet wörtlich etwa „und große/gewaltige …“ und ist schwer verständlich. Die griechische Parallele liest „Schöpfung von Seeungeheuern“; danach ist hier übersetzt.
    reason: alternative_reading
lexical_decisions:
- source_word: שם
  choice: Dort sind
  rationale: Das hebräische Ortsadverb bedeutet „dort“; zusammen mit dem verblosen Satz wird es im Deutschen natürlich als „Dort sind“ wiedergegeben. Auch das griechische ἐκεῖ stützt den örtlichen Bezug.
- source_word: פלאות תמהי מעשהו
  choice: die Wunder seiner erstaunlichen Werke
  rationale: פלאות bezeichnet Wunder oder außergewöhnliche Dinge, תמהי hebt deren erstaunlichen Charakter hervor, und מעשהו verweist auf Gottes Tun beziehungsweise seine Werke. Die Wiedergabe bewahrt die verdichtete Ausdrucksweise, ohne im Deutschen unnatürlich zu klingen.
- source_word: מין כל חי
  choice: alle Arten von Lebewesen
  rationale: מין bezeichnet Art oder Gattung, כל die Gesamtheit und חי Lebendiges beziehungsweise Lebewesen. Der Plural „Arten“ gibt den klassifizierenden Sinn idiomatisch wieder; die griechische Parallele ποικιλία παντὸς ζῴου bestätigt die Vielfalt tierischen Lebens.
- source_word: וגבורות רבה
  choice: die gewaltigen Meerestiere
  rationale: Der überlieferte hebräische Schluss ist schwierig und könnte für sich genommen auf große oder mächtige Wesen beziehungsweise Machttaten weisen. Die griechische Parallele κτίσις κητῶν nennt große Meerestiere; der Meereskontext stützt diese Wiedergabe.
theological_decisions:
- issue: Heranziehung der griechischen Parallele zur Klärung des schwierigen hebräischen Schlusses
  choice: Bezug auf gewaltige Meerestiere im Haupttext
  alternative: „große Machttaten“, „viele mächtige Wesen“ oder „gewaltige Kräfte“
  rationale: Der hebräische Wortlaut ist am Versende semantisch und möglicherweise textlich unsicher. Die griechische Überlieferung nennt ausdrücklich die Schöpfung großer Meerestiere und passt zum unmittelbaren Kontext. Die Unsicherheit wird deshalb in einer Fußnote offengelegt, statt eine eindeutige hebräische Lesart vorzutäuschen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, poetisch verdichtetem Klang. Der Doppelpunkt ordnet die folgenden Lebewesen als Beispiele der zuvor genannten Wunder ein; die Textunsicherheit am Schluss bleibt durch die Fußnote sichtbar.
