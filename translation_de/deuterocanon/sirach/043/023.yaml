translation:
  language: de
  text: Durch seinen Plan stillte er die Tiefe[a] und pflanzte Inseln[b] in ihr.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hebräische Wortlaut ist hier schwierig. Die griechische Parallele lautet im ersten Satzteil sinngemäß: „Durch seine Überlegung brachte er den Abgrund zur Ruhe.“'
    reason: textual_variant
  - marker: b
    text: 'Oder: „Küstenländer“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מחשבתו
  choice: durch seinen Plan
  rationale: מחשבה kann Gedanke, Absicht oder Plan bezeichnen. Im kosmologischen Zusammenhang bringt „Plan“ die wirksame, absichtsvolle Gestaltung zum Ausdruck; das griechische λογισμῷ weist ebenfalls auf Überlegung oder Entwurf.
- source_word: משיק
  choice: stillte
  rationale: Die hebräische Form ist schwierig. Das griechische ἐκόπασεν („brachte zur Ruhe, stillte“) stützt die hier gewählte Bedeutung.
- source_word: רבה / בתהום
  choice: die Tiefe … in ihr
  rationale: Die hebräische Textgestalt ist unsicher; בתהום bezeichnet die Tiefe beziehungsweise das Urmeer. Das griechische ἄβυσσον bestätigt den kosmologischen Sinn „Tiefe/Abgrund“. Das Pronomen vermeidet eine schwerfällige Wiederholung.
- source_word: ויט
  choice: pflanzte
  rationale: Das Verb beschreibt bildhaft ein Setzen oder Pflanzen. „Pflanzte“ bewahrt die anschauliche Metapher; auch die griechische Parallele bietet ἐφύτευσεν.
- source_word: איים
  choice: Inseln
  rationale: איים kann Inseln oder Küstenländer bezeichnen. Im Bild von Land, das inmitten der Tiefe gegründet wird, ist „Inseln“ die konkretere Lesart; die Alternative wird in einer Fußnote erhalten.
theological_decisions:
- issue: Spannung zwischen dem schwierigen hebräischen Wortlaut und der klareren griechischen Parallele
  choice: Der erhaltene hebräische Text bleibt die Grundlage; die griechische Parallele klärt insbesondere das Stillen der Tiefe und bestätigt die Pflanzmetapher.
  alternative: Durch seinen Gedanken beruhigte er den Abgrund und setzte Küstenländer hinein.
  rationale: Die Formulierung wahrt den Vorrang des hebräischen Zeugen, nutzt aber die griechische Überlieferung dort, wo der hebräische Wortlaut unsicher ist. Die verbleibende textliche Unsicherheit wird offengelegt, nicht dogmatisch aufgelöst.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Stillte“ und „pflanzte“ bewahren die knappe kosmologische Bildsprache; die Unsicherheiten der Textüberlieferung werden in den Fußnoten transparent gemacht.
