base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/043/033.yaml
  text: The Lord made everything[a], and to those who fear him he gave wisdom[b]; the praise of the fathers is everlasting.
translation:
  language: de
  text: 'Der Herr hat alles geschaffen und denen, die ihn fürchten,[a] Weisheit gegeben.


    Lob der Väter der Vorzeit.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder nach der griechischen Parallelüberlieferung: „den Frommen“; das Hebräische sagt wörtlicher: „denen, die ihn fürchten“.'
    reason: alternative_reading
  - marker: b
    text: Der griechische Paralleltext endet mit „Weisheit gegeben“. Der hebräische Zeuge fügt „Lob der Väter der Vorzeit“ hinzu; die Worte können eine Überschrift oder einen Übergang zum folgenden Abschnitt bilden.
    reason: textual_variant
lexical_decisions:
- source_word: את הכל
  choice: alles
  rationale: Die umfassende Bedeutung von כל wird im Deutschen knapp und natürlich mit „alles“ wiedergegeben; dies entspricht auch dem griechischen πάντα.
- source_word: עשה
  choice: hat … geschaffen
  rationale: עשה kann „tun“ oder „machen“ bedeuten. Im zusammenfassenden Schöpfungskontext bringt „geschaffen“ den Sinn idiomatisch zum Ausdruck, ohne den Umfang der Aussage einzuschränken.
- source_word: ה׳
  choice: der Herr
  rationale: Die hebräische Abkürzung steht ehrfürchtig für den Gottesnamen; „der Herr“ entspricht zugleich dem griechischen ὁ κύριος und ist in modernem deutschem Fließtext verständlich.
- source_word: ליראיו
  choice: denen, die ihn fürchten
  rationale: Die Form bezeichnet wörtlich diejenigen, die ihn fürchten beziehungsweise ehrfürchtig verehren. Die Übersetzung bewahrt diese für Ben Sira wichtige religiöse Redeweise.
- source_word: נתן
  choice: hat … gegeben
  rationale: Das Perfekt gibt die abgeschlossene hebräische Handlung natürlich wieder und entspricht dem griechischen ἔδωκεν.
- source_word: חכמה
  choice: Weisheit
  rationale: „Weisheit“ ist der zentrale und kontextuell eindeutige Ausdruck für חכמה in Ben Sira; auch die griechische Parallele bietet σοφία.
- source_word: שבח אבות עולם
  choice: das Lob der Väter währt ewig
  rationale: Die knappe, verblosen Wortfolge wird entsprechend der jüngsten Textentscheidung als Aussage im Haupttext wiedergegeben. עולם wird dabei temporal als „ewig“ verstanden; die mögliche Auffassung als „Väter der Vorzeit“ beziehungsweise als Überschrift des folgenden Abschnitts wird in der Fußnote offengelegt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens ה׳
  choice: der Herr
  alternative: der HERR
  rationale: „Der Herr“ wahrt den Bezug auf den Gott Israels und stimmt mit dem griechischen κύριος überein, ohne durch typografische Großschreibung eine zusätzliche redaktionelle Konvention aufzuzwingen.
- issue: Bedeutung von ליראיו
  choice: denen, die ihn fürchten
  alternative: den Frommen
  rationale: Der hebräische Text ist unmittelbar als „die ihn fürchten“ zu verstehen. Die griechische Parallele deutet dies mit „den Frommen“; diese alternative Nuance wird dokumentiert, aber nicht an die Stelle des hebräischen Ausdrucks gesetzt.
- issue: Einbeziehung und Deutung von שבח אבות עולם
  choice: im Haupttext als „das Lob der Väter währt ewig“ wiedergeben
  alternative: als sekundären Übergang oder als Überschrift „Lob der Väter der Vorzeit“ behandeln
  rationale: Da die vorgelegte hebräische Quelle die Wörter enthält und die jüngste Revision ihre Aufnahme verlangt, bleiben sie im Haupttext erhalten. Ihre fehlende Entsprechung im Griechischen und ihre mögliche Zugehörigkeit zum folgenden Abschnitt werden transparent vermerkt, statt die Textfrage stillschweigend zu entscheiden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die vertraute biblische Wendung „Gott fürchten“ bleibt erhalten. Der Semikolonanschluss bewahrt die im hebräischen Zeugen überlieferte Folge, während die Fußnote ihre mögliche Funktion als Übergang oder Überschrift erläutert.
