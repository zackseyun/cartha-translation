  terminology: „Heer“ und „Höhen“ bewahren die kosmisch-militärische bzw. poetische Bildsprache. „Harfe“ gibt נבלי in seiner naheliegenden lexikalischen Deutung wieder, ohne die Deutung als völlig sicher auszugeben. „Himmelsgewölbe“ ist für רקיע angemessen.
