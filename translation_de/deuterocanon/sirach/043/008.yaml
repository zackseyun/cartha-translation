base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/043/008.yaml
  text: Month by month it renews itself—how awe-inspiring it is in its changing! A vessel of the host on high[c][b][a], from the expanse of the sky is its shining.
translation:
  language: de
  text: Monat für Monat erneuert er sich – wie ehrfurchtgebietend ist er in seinem Wandel![a] Ein Gerät des Heeres in der Höhe,[b][c] von der Fläche des Himmelsgewölbes geht sein Leuchten aus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Parallelüberlieferung lautet sinngemäß: „Der Monat entspricht seinem Namen; wunderbar nimmt er in seinem Wandel zu.“ Sie spiegelt offenbar einen anderen Wortlaut oder eine andere Deutung wider als das erhaltene Hebräisch: „Monat für Monat erneuert er sich.“'
    reason: alternative_reading
  - marker: b
    text: Die zweite Vershälfte ist im Hebräischen schwer verständlich und wahrscheinlich textlich unsicher. Eine verwandte hebräische Überlieferung aus Masada weicht hier vom Text der Kairoer Geniza ab. Der allgemeine Sinn ist wohl, dass der Mond zum himmlischen Heer gehört und am Himmel leuchtet.
    reason: textual_variant
  - marker: c
    text: 'Oder möglicherweise: „eine Harfe der Höhen“. Die hebräische Wendung ist ungewöhnlich und kann metaphorisch gemeint oder textlich verderbt sein.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חדש בחדשו הוא מתחדש
  choice: Monat für Monat erneuert er sich
  rationale: Die Wiederholung der Wurzel חדש wird durch „Monat“ und „erneuert“ erkennbar wiedergegeben. בחדשו hat hier am ehesten zeitlichen Sinn. Das reflexive מתחדש passt zum monatlichen Wiedererscheinen und Wandel des Mondes.
- source_word: מה נורא
  choice: wie ehrfurchtgebietend
  rationale: נורא bezeichnet etwas, das Furcht oder staunende Ehrfurcht weckt. Im hymnischen Schöpfungskontext wahrt „ehrfurchtgebietend“ diesen Ton, ohne bloßen Schrecken auszudrücken.
- source_word: בהשתנותו
  choice: in seinem Wandel
  rationale: Die Form bezeichnet Veränderung oder Verwandlung. „Wandel“ ist im Deutschen natürlich und würdevoll und lässt an die wechselnden Mondphasen denken, ohne diese ausdrücklich in den Text einzutragen.
- source_word: כלי צבא
  choice: ein Gerät des Heeres
  rationale: כלי kann Gerät, Gefäß, Instrument oder Waffe bedeuten; צבא kann Heer oder Heerschar bezeichnen. „Gerät des Heeres“ hält die ungewöhnliche militärisch-kosmische Metapher offen und vermeidet die Festlegung auf eine Waffe.
- source_word: נבלי מרום
  choice: in der Höhe
  rationale: Die überlieferte Wortfolge ist schwierig und wahrscheinlich unsicher. Im Zusammenhang liegt eine Zuordnung zum himmlischen Heer nahe; die mögliche lexikalische Lesung als „Harfe der Höhen“ wird in einer Fußnote bewahrt.
- source_word: מרצף רקיע מזהירתו
  choice: von der Fläche des Himmelsgewölbes geht sein Leuchten aus
  rationale: רקיע ist das Himmelsgewölbe beziehungsweise die Himmelsausdehnung. מרצף kann an eine ausgebreitete oder pflasterartige Fläche denken lassen; „Fläche“ bewahrt das räumliche Bild ohne eine zu bestimmte Kosmologie. Die elliptische Aussage über זהר wird als „geht sein Leuchten aus“ idiomatisch wiedergegeben.
theological_decisions:
- issue: Verhältnis des erhaltenen hebräischen Textes zur griechischen Parallelüberlieferung
  choice: Der Haupttext folgt dem erhaltenen Hebräisch; die abweichende griechische Fassung wird in einer Fußnote dokumentiert.
  alternative: 'Dem Griechischen folgen: „Der Monat entspricht seinem Namen; wunderbar nimmt er in seinem Wandel zu.“'
  rationale: Wo hebräischer Sirachtext erhalten ist, besitzt er Vorrang. Die griechische Parallele bezeugt jedoch eine andere Vorlage oder Deutung und ist deshalb als echte textgeschichtliche Alternative offenzulegen.
- issue: Deutung der schwierigen zweiten Vershälfte
  choice: Die kosmisch-militärische Bildsprache wird möglichst offen als „Gerät des Heeres in der Höhe“ wiedergegeben.
  alternative: 'Metaphorisch und lexikalisch enger: „eine Harfe der Höhen“; oder glättend: „ein Glied des himmlischen Heeres“.'
  rationale: Der hebräische Wortlaut ist syntaktisch und textkritisch unsicher. Eine eindeutige Harmonisierung würde eine nicht gesicherte Deutung in den Haupttext eintragen; daher bleiben die Unsicherheit und die wichtigste lexikalische Alternative sichtbar.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdig-poetischem Klang. Der erste Satz ist flüssig und bildhaft; in der schwierigen zweiten Hälfte wird die Fremdheit des hebräischen Ausdrucks bewusst nicht vollständig geglättet. Alle textkritisch oder lexikalisch bedeutsamen Alternativen sind durch Fußnoten kenntlich gemacht.
