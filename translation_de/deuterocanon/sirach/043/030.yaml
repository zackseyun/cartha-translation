  text: As you exalt the Lord[a], lift up your voice as much as you can, for there is still more.
translation:
  language: de
  text: Die ihr den HERRN preist, erhebt eure Stimme, so sehr ihr könnt; denn es gibt noch mehr.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Griechisch: „Denn er ist noch größer“; damit wird ausdrücklich gesagt, dass der HERR alles Lob übersteigt. Das Hebräische ist knapper: „Denn es gibt noch mehr.“'
    reason: alternative_reading
lexical_decisions:
- source_word: מגדלי
  choice: Die ihr … preist
  rationale: Das Partizip im Plural bezeichnet diejenigen, die den HERRN groß machen beziehungsweise erhöhen. „Preist“ gibt diesen Sinn im Deutschen natürlich wieder und wird durch das griechische δοξάζοντες gestützt, ohne eine körperliche Erhebung nahezulegen.
- source_word: ה׳
  choice: den HERRN
  rationale: Die ehrerbietige Schreibung für den Gottesnamen wird nach üblicher deutscher Bibelkonvention mit „HERR“ wiedergegeben.
- source_word: הרימו קול
  choice: erhebt eure Stimme
  rationale: Die konkrete hebräische Wendung wird mit einer geläufigen, würdigen deutschen Formulierung wiedergegeben.
- source_word: בכל תוכלו
  choice: so sehr ihr könnt
  rationale: Die Wendung bezeichnet das volle Maß des eigenen Vermögens. Diese Formulierung ist natürlich und entspricht auch dem griechischen καθʼ ὅσον ἂν δύνησθε.
- source_word: כי יש עוד
  choice: denn es gibt noch mehr
  rationale: 'Die knappe und leicht elliptische Aussage des erhaltenen Hebräisch bleibt bewusst offen: Selbst größtmögliches Lob erschöpft den Gegenstand nicht.'
theological_decisions:
- issue: Wie ausdrücklich Gottes alles Lob übersteigende Größe im Schlusssatz benannt werden soll
  choice: denn es gibt noch mehr
  alternative: denn er überragt auch dies noch
  rationale: Das Hebräische formuliert knapp und unpersönlich, während das Griechische den Bezug auf den Herrn ausdrücklich macht. Wegen des Vorrangs des erhaltenen hebräischen Textes bleibt dessen Offenheit im Haupttext erhalten; die griechische Lesart steht in der Fußnote.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Anredeform des hebräischen Partizips bleibt erhalten; Semikolon und knapper Schlusssatz bewahren den poetisch-weisheitlichen Ton.
