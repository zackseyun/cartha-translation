  naturalness: Das Deutsch ist überwiegend klar und würdig. „Wasseransammlung“ ist im Kontext natürlicher und semantisch treffender als „Wasserbecken“. Die schwierige Metapher „wie Fäulnis“ soll, mit erklärender Fußnote, stehen bleiben.
