base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/043/020.yaml
  text: The cold of the north wind returns[a]; like rot, it freezes its spring. Over every standing body of water it settles[b], and the reservoir puts on armor like a breastplate.
translation:
  language: de
  text: Die Kälte des Nordwinds kehrt zurück[a]; wie Fäulnis lässt sie seine Quelle gefrieren. Über jede stehende Wasserfläche legt sie sich[b], und die Wasseransammlung zieht sich wie einen Panzer an.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hebräische Text fährt mit dem schwierigen Bild fort: „wie Fäulnis lässt sie seine Quelle gefrieren“. Die griechische Parallelüberlieferung lautet verständlicher: „Eis/Kristall gefriert aus Wasser.“ Da der hebräische Text hier erhalten ist, folgt der Haupttext ihm und vermerkt die griechische Lesart als Deutungshilfe.'
    reason: alternative_reading
  - marker: b
    text: Der hebräische Wortlaut der hier mit „über jede stehende Wasserfläche legt sie sich“ wiedergegebenen Aussage ist textlich schwierig. Die griechische Parallelüberlieferung stützt den Sinn, dass sich Eis über jede Ansammlung von Wasser legt.
    reason: textual_variant
lexical_decisions:
- source_word: צִנַּת
  choice: die Kälte
  rationale: Das Substantiv bezeichnet Kälte oder Kühle; die Wiedergabe bleibt konkret und bildet die Verbindung mit dem Nordwind natürlich ab.
- source_word: רוּחַ צָפוֹן
  choice: des Nordwinds
  rationale: Im Wetterzusammenhang bedeutet רוּחַ „Wind“; auch das griechische βορέης bestätigt den meteorologischen Sinn.
- source_word: יָשִׁיב
  choice: kehrt zurück
  rationale: Die knappe hebräische Form wird ohne Ergänzung eines nicht genannten Objekts wiedergegeben und bewahrt den Gedanken der wiederkehrenden Kälte.
- source_word: וְכָרָקָב
  choice: wie Fäulnis
  rationale: Der erhaltene hebräische Text bietet das schwierige Bild „wie Fäulnis/Verfall“. Es wird als Primärlesart bewahrt, statt es stillschweigend nach dem Griechischen zu glätten.
- source_word: יִקְפִּיא
  choice: lässt ... gefrieren
  rationale: Das Verb bezeichnet das Verursachen von Gefrieren oder Erstarren; die kausative deutsche Form passt zur Satzstruktur.
- source_word: מְקוֹרוֹ
  choice: seine Quelle
  rationale: מָקוֹר kann Quelle oder Ursprung bedeuten. „Quelle“ erhält das konkrete Wasserbild und den maskulinen Singularsuffix.
- source_word: מַעֲמַד מַיִם
  choice: stehende Wasserfläche
  rationale: Die Wendung bezeichnet an einem Ort befindliches beziehungsweise gesammeltes Wasser; „Wasserfläche“ ist im Deutschen natürlich, während „stehende“ den festen Zustand wiedergibt.
- source_word: יְקָרִים
  choice: legt sie sich
  rationale: Die hebräische Form ist schwierig. Die Wiedergabe folgt dem durch das griechische καταλύσει gestützten Sinn des Sich-Niederlegens oder Lagerns, ohne die Unsicherheit zu verdecken.
- source_word: וּכְשִׁרְיוֹן
  choice: einen Panzer
  rationale: שִׁרְיוֹן bezeichnet einen Schutzpanzer, besonders einen Brustpanzer oder ein Kettenhemd. „Panzer“ wahrt das konkrete Kleidungsbild knapp und würdevoll.
- source_word: יִלְבַּשׁ מִקְוֶה
  choice: das Wasserbecken zieht ... an
  rationale: Das gesammelte Wasser erscheint im Hebräischen als Subjekt des Anziehens. „Wasserbecken“ gibt מִקְוֶה verständlich wieder und erhält die Personifikation.
