  register: Modernes Standarddeutsch in würdigem, bildhaftem Register. Die ungewöhnliche hebräische Metapher „wie Fäulnis“ bleibt bewusst stehen; zwei Fußnoten kennzeichnen die textlichen Schwierigkeiten und ziehen die griechische Parallelüberlieferung zur Klärung heran.
