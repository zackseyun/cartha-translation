  text: The moon also marks the returning seasons[c][b][a], a ruler of the end and a sign forever.
translation:
  language: de
  text: 'Auch der Mond: der Mond der wiederkehrenden Zeiten[a][c], Gebieter über das Ende[b] und Zeichen für immer.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Parallele lautet: »Der Mond ist in allem zu seiner festgesetzten Zeit, eine Offenbarung der Zeiten und ein Zeichen für immer.« Der hebräische Text spricht dagegen vom »Mond der wiederkehrenden Zeiten« und von einem »Gebieter über das Ende«.'
    reason: alternative_reading
  - marker: b
    text: Die knappe hebräische Wendung kann auch »Herrschaft des Endes« beziehungsweise »Herrschaft über das Ende« bedeuten. Gemeint sein könnte die Bestimmung des Monatsabschlusses oder einer festgesetzten Grenze.
    reason: lexical_alternative
  - marker: c
    text: 'Das erhaltene Masada-Fragment bietet an dieser Stelle eine andere Lesart als die hier zugrunde gelegten hebräischen Handschriften aus der Kairoer Geniza: »Denn der große Herr hat ihn gemacht.«'
    reason: textual_variant
lexical_decisions:
- source_word: וגם
  choice: Auch
  rationale: Gibt die additive Funktion wieder und fügt den Mond in die Folge der zuvor beschriebenen Himmelslichter ein.
- source_word: ירח
  choice: der Mond
  rationale: Bezeichnet eindeutig den Mond; der bestimmte Artikel entspricht dem natürlichen deutschen Sprachgebrauch für den Himmelskörper.
- source_word: עתות שבות
  choice: die wiederkehrenden Zeiten
  rationale: עתות bezeichnet Zeiten oder festgesetzte Zeitabschnitte, שבות deren Wiederkehr. Die Formulierung bewahrt den zyklisch-kalendarischen Sinn, ohne ihn auf Jahreszeiten oder Monate einzuengen.
- source_word: ממשלת
  choice: ein Gebieter über
  rationale: Das Substantiv bezeichnet Herrschaft oder Herrschergewalt. Die personifizierende Wiedergabe als »Gebieter« fügt sich in die poetische Beschreibung des Mondes und bewahrt die knappe Konstruktion.
- source_word: קץ
  choice: das Ende
  rationale: קץ kann Ende, Grenze oder festgesetzten Abschluss bedeuten. »Das Ende« wahrt die Kürze und lässt offen, ob insbesondere der Abschluss eines Monats gemeint ist.
- source_word: ואות עולם
  choice: und ein Zeichen für immer
  rationale: אות bedeutet »Zeichen«, עולם bezeichnet hier unbegrenzte beziehungsweise dauernde Zeit. Die Wiedergabe folgt dem Hebräischen knapp und unmittelbar.
theological_decisions:
- issue: Gewichtung des hebräischen Textes gegenüber der abweichenden griechischen Parallele
  choice: Der erhaltene hebräische Text bildet die Grundlage; die griechische Parallele dient zur Bestätigung des kalendarischen Zusammenhangs.
  alternative: 'Nach dem Griechischen: »Der Mond steht in allem für seine festgesetzte Zeit, eine Offenbarung der Zeiten und ein Zeichen für immer.«'
  rationale: Da für diesen Vers ein hebräischer Text erhalten ist, erhält er Vorrang. Die griechische Fassung bezeugt ebenfalls den zeitlich-kalendarischen Sinn, weicht aber bei »Gebieter über das Ende« deutlich ab; diese Spannung wird nicht harmonisiert, sondern in einer Fußnote offengelegt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper poetischer Satzfügung. »Gebieter« erhält die Personifizierung des hebräischen Weisheitstextes; die Fußnoten machen die sprachliche und textgeschichtliche Unsicherheit sichtbar.
