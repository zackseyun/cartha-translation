  language: en
  yaml_path: translation/deuterocanon/sirach/043/031.yaml
  text: Who has seen him and can describe him? And who can magnify him as he is?[a]
translation:
  language: de
  text: Wer hat ihn gesehen und kann ihn beschreiben? Und wer kann ihn so preisen, wie er ist?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der erhaltene hebräische Text aus der Kairoer Geniza weicht hier ab und scheint nicht recht zu dieser Stelle zu passen. Wörtlich lautet er etwa: „Die Höhen erneuern ihre Kraft und werden nicht müde, denn ihr könnt sie nicht ergründen.“ Die griechische Überlieferung lautet dagegen: „Wer hat ihn gesehen und kann ihn beschreiben? Und wer kann ihn so preisen, wie er ist?“ Der Haupttext folgt der griechischen Fassung, weil sie sich schlüssig in den Zusammenhang einfügt.'
    reason: textual_variant
lexical_decisions:
- source_word: τίς ἑόρακεν αὐτόν
  choice: Wer hat ihn gesehen
  rationale: Das Perfekt von ὁράω bezeichnet, dass jemand ihn gesehen hat. Die schlichte Formulierung ist im heutigen Deutsch klar und wahrt die rhetorische Frage.
- source_word: ἐκδιηγήσεται
  choice: kann ihn beschreiben
  rationale: Das Verb meint ausführliches Erzählen oder Darstellen. „Beschreiben“ gibt hier verständlich wieder, dass Gottes Wesen und Größe nicht angemessen in Worte gefasst werden können.
- source_word: μεγαλυνεῖ
  choice: kann ihn preisen
  rationale: Das Verb kann „groß machen“, „verherrlichen“ oder „preisen“ bedeuten. Da Menschen Gott nicht tatsächlich größer machen, drückt „preisen“ den lobpreisenden Sinn im Deutschen natürlich aus.
- source_word: καθὼς ἐστιν
  choice: so, wie er ist
  rationale: Die Wendung fragt danach, ob menschlicher Lobpreis Gottes wirklichem Sein gerecht werden kann. Die Übersetzung bleibt knapp und bewahrt diese Spannung.
- source_word: מרומים
  choice: die Höhen (nur in der Fußnote)
  rationale: Der erhaltene hebräische Text beginnt mit „die Höhen“, scheint hier jedoch gegenüber dem Kontext und der griechischen Überlieferung abzuweichen beziehungsweise nicht zu dieser Versstelle zu passen. Er wird deshalb transparent in der Fußnote wiedergegeben.
theological_decisions:
- issue: Abweichung zwischen dem erhaltenen hebräischen Text und der griechischen Parallelüberlieferung
  choice: Der Haupttext folgt der griechischen rhetorischen Frage nach der Unbeschreiblichkeit und unerreichbaren Größe Gottes.
  alternative: 'Eine wörtliche Wiedergabe des erhaltenen Hebräischen lautet ungefähr: „Die Höhen erneuern ihre Kraft und werden nicht müde, denn ihr könnt sie nicht ergründen.“'
  rationale: Der hebräische Zeuge ist für diese Stelle als leicht unpassend beziehungsweise abweichend gekennzeichnet; die griechische Fassung fügt sich dagegen schlüssig in den unmittelbaren Zusammenhang des Gotteslobs ein. Die Unsicherheit wird nicht verschwiegen, sondern in der Fußnote dokumentiert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Preisen“ klingt im Zusammenhang des Gotteslobs natürlicher als das missverständliche „groß machen“ oder das weniger geläufige „verherrlichen“. Die zweifache rhetorische Frage und die Aussage über die Grenzen menschlicher Erkenntnis und Sprache bleiben erhalten.
