translation:
  language: de
  text: In Gottes Hand liegt die Herrschaft jedes Mannes, und vor den Gesetzgeber setzt er seinen Glanz.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Parallelüberlieferung lautet: „In der Hand des Herrn liegt die Macht über die Erde, und zur rechten Zeit wird er über sie den geeigneten Mann einsetzen.“ Ihre zweite Vershälfte weicht erheblich vom hebräischen Text ab und beruht wahrscheinlich auf einer anderen hebräischen Vorlage oder auf einer interpretierenden Weiterentwicklung.'
    reason: alternative_reading
  - marker: b
    text: Für „seinen Glanz“ sind auch „seine Pracht“, „seine Hoheit“ oder „seine Würde“ möglich.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּיַד
  choice: In … Hand liegt
  rationale: Die hebräische Wendung bezeichnet Verfügungsgewalt oder Kontrolle. Die bildhafte Rede von der Hand bleibt erhalten; „liegt“ ergibt im Deutschen eine natürliche Formulierung.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Der hebräische Text hat אֱלֹהִים und nicht den Gottesnamen; daher ist „Gott“ die direkte Entsprechung.
- source_word: מֶמְשֶׁלֶת
  choice: die Herrschaft
  rationale: Das Substantiv bezeichnet Herrschafts- oder Regierungsgewalt. „Herrschaft“ passt zum politischen Zusammenhang und bewahrt die Aussage über Macht, ohne den Vorgang ihrer Übertragung näher zu bestimmen.
- source_word: כָּל גֶּבֶר
  choice: jedes Mannes
  rationale: גֶּבֶר bezeichnet hier grammatisch und semantisch einen Mann. Der Genitiv fügt sich natürlich in die deutsche Wendung „die Herrschaft jedes Mannes“ ein.
- source_word: וְלִפְנֵי
  choice: und vor
  rationale: Die räumlich-relationale Grundbedeutung des hebräischen Ausdrucks wird beibehalten, auch wenn der Satz dadurch eine gewisse, bereits im Ausgangstext vorhandene Deutungsoffenheit behält.
- source_word: מְחוֹקֵק
  choice: den Gesetzgeber
  rationale: Das Wort bezeichnet jemanden, der Recht setzt oder Verfügungen erlässt. „Gesetzgeber“ bewahrt diese spezifische Bedeutung besser als das allgemeinere „Herrscher“.
- source_word: יָשִׁית
  choice: setzt
  rationale: שׂים bedeutet „setzen, stellen, legen“. Die formale Wiedergabe vermeidet eine interpretierende Ergänzung wie „verleiht“ oder „lässt erscheinen“.
- source_word: הוֹדוֹ
  choice: seinen Glanz
  rationale: הוֹד kann Glanz, Pracht, Hoheit oder Würde bezeichnen. „Glanz“ bewahrt den anschaulichen und erhöhten Charakter des Ausdrucks; das Suffix wird als „seinen“ wiedergegeben, ohne seinen Bezug näher aufzulösen.
theological_decisions:
- issue: Verhältnis von Gottes Souveränität zu menschlicher Herrschaft
  choice: Die Herrschaft jedes Mannes liegt in Gottes Hand.
  alternative: Gott setzt jeden einzelnen Herrscher unmittelbar ein.
  rationale: Der hebräische Text stellt menschliche Herrschaft unter Gottes Verfügungsgewalt, erklärt aber nicht ausdrücklich, auf welche Weise ein Herrscher eingesetzt wird. Eine detailliertere Lehre von politischer Einsetzung wird daher nicht in den Vers hineingetragen.
- issue: Bezug der Pronomen im zweiten Satzglied
  choice: Die maskulinen Formen werden formal mit „er“ und „seinen“ wiedergegeben.
  alternative: Die Pronomen ausdrücklich auf Gott oder auf den Gesetzgeber beziehen und „Glanz“ als verliehene Amtswürde deuten.
  rationale: Der knappe hebräische Wortlaut lässt den genauen Bezug und die Art des Setzens offen. Die Übersetzung bewahrt diese Spannung, statt sie stillschweigend aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Metapher „in Gottes Hand“ bleibt wegen ihrer Klarheit und Nähe zum Hebräischen erhalten. Die ungewöhnliche Formulierung der zweiten Vershälfte wird bewusst nicht durch eine glättende, theologisch stärker festlegende Paraphrase ersetzt.
