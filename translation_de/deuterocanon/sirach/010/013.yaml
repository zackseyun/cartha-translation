  text: For the hope of arrogance is sin[a], and its source pours out wickedness.
translation:
  language: de
  text: Denn die Hoffnung der Überheblichkeit ist Sünde[a], und ihre Quelle lässt Bosheit hervorquellen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Griechisch: „Denn der Anfang des Hochmuts ist Sünde, und wer daran festhält, wird Abscheuliches ausgießen.“ Das Griechische bietet im ersten Satzteil eine deutlich andere Lesart und erweitert den zweiten.'
    reason: alternative_reading
lexical_decisions:
- source_word: מִקְוֵה
  choice: Hoffnung
  rationale: Die hebräische Lesart bezeichnet hier am ehesten „Hoffnung“ beziehungsweise das, worauf man vertraut. Die deutlich abweichende griechische Lesart „Anfang“ wird in der Fußnote bewahrt.
- source_word: זָדוֹן
  choice: Überheblichkeit
  rationale: Das Wort bezeichnet stolze, vermessene Anmaßung. „Überheblichkeit“ ist im modernen Deutschen klar und bewahrt die moralische Aussage, ohne sie unnötig zuzuspitzen.
- source_word: חֵטְא
  choice: Sünde
  rationale: Direkte und kontextgemäße Wiedergabe; auch die griechische Parallelüberlieferung bestätigt diesen Sinn.
- source_word: מְקוֹרָהּ
  choice: ihre Quelle
  rationale: Die Wendung erhält das Bild einer Quelle und bezieht das Suffix natürlich auf die im Deutschen feminine „Überheblichkeit“.
- source_word: יַבִּיעַ
  choice: lässt … hervorquellen
  rationale: Das Verb beschreibt ein Hervorströmen oder Hervorquellen und führt das Quellenbild des vorangehenden Nomens fort.
- source_word: זִמָּה
  choice: Bosheit
  rationale: Das Wort kann böse Absicht, Niedertracht oder schändliches Verhalten bezeichnen. „Bosheit“ wahrt die Breite des Ausdrucks und verengt ihn nicht auf sexuelle Verfehlung.
theological_decisions:
- issue: Hebräisch מִקְוֵה gegenüber griechisch ἀρχή am Versanfang
  choice: 'Die erhaltene hebräische Lesart steht im Haupttext: „die Hoffnung der Überheblichkeit ist Sünde“.'
  alternative: „Der Anfang des Hochmuts ist Sünde.“
  rationale: Da für diesen Vers ein hebräischer Textzeuge erhalten ist, erhält er im Haupttext Vorrang. Die griechische Überlieferung bietet eine inhaltlich bedeutsame abweichende Lesart und wird deshalb vollständig in einer Fußnote angegeben.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das ungewöhnliche Bild von der „Hoffnung der Überheblichkeit“ bleibt entsprechend dem hebräischen Text bewusst erhalten; das Quellenbild wird durch „Quelle“ und „hervorquellen“ sprachlich zusammengehalten.
