translation:
  language: de
  text: Gott löschte die Spuren der Völker aus und tilgte ihre Wurzel bis zum tiefsten Grund.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Parallelüberlieferung lautet: „Der Herr riss die Wurzeln von Völkern aus und pflanzte an ihrer Stelle Demütige.“ Der hebräische Text spricht dagegen zunächst von den „Spuren“ der Völker und nennt „Gott“.'
    reason: alternative_reading
  - marker: b
    text: Das seltene hebräische Wort am Versende bezeichnet wahrscheinlich den tiefsten Grund oder die unterste Erdschicht. Es unterstreicht die vollständige Beseitigung der Wurzel; auch „bis zum Grund“ oder „bis zum Grundgestein“ sind als Übersetzungen möglich.
    reason: lexical_alternative
lexical_decisions:
- source_word: עִקְבוֹת
  choice: Spuren
  rationale: Das Wort bezeichnet wörtlich Fersen-, Schritt- oder Fußspuren. „Spuren“ bewahrt das konkrete Bild und klingt im Deutschen zusammen mit „auslöschen“ natürlich.
- source_word: גּוֹיִם
  choice: Völker
  rationale: Im weisheitlichen Zusammenhang sind Völker beziehungsweise Nationen gemeint, nicht „Heiden“ als später geprägte theologische Kategorie.
- source_word: טִמְטֵם
  choice: löschte … aus
  rationale: Das Verb drückt vollständiges Verwischen oder Tilgen aus. Die Wendung passt zum Bild der Spuren, ohne die Aussage unnötig zu präzisieren.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Die hebräische Textgestalt nennt ausdrücklich Gott; sie wird nicht an das κύριος („der Herr“) der griechischen Parallelüberlieferung angeglichen.
- source_word: וְשָׁרְשָׁם
  choice: und … ihre Wurzel
  rationale: Der Singular mit Suffix wird als kollektiver Singular beibehalten und vermittelt das Bild einer Vernichtung bis an den Ursprung.
- source_word: עַד אֶרֶץ קִעֲקָע
  choice: riss … bis tief aus der Erde heraus
  rationale: Die seltene Form und die Wendung bezeichnen eine Beseitigung bis in die Tiefe beziehungsweise bis zum Grund. Die deutsche Fassung gibt im Zusammenhang mit „Wurzel“ den Sinn vollständigen Ausreißens wieder, ohne „Grundgestein“ als lexikalisch zu genaue Festlegung in den Haupttext zu setzen.
theological_decisions:
- issue: Abweichung zwischen hebräischer und griechischer Bildsprache
  choice: Der Haupttext folgt dem erhaltenen Hebräisch mit „Spuren“, „Gott“ und der vollständig herausgerissenen Wurzel.
  alternative: 'Die griechische Parallelüberlieferung lautet: „Der Herr riss die Wurzeln von Völkern aus und pflanzte an ihrer Stelle Demütige.“'
  rationale: Wo der hebräische Sirachtext erhalten ist, ist er die primäre Grundlage. Die griechische Fassung bestätigt den Zusammenhang von Gericht und Erniedrigung, weicht aber in Wortlaut und zweiter Vershälfte erheblich ab; deshalb wird sie transparent in einer Fußnote geboten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die konkreten hebräischen Bilder „Spuren“ und „Wurzel“ bleiben erhalten; die ungewöhnliche Tiefenangabe wird idiomatisch wiedergegeben und ihre Unsicherheit in der Fußnote offengelegt.
