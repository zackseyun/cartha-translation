  text: A slight illness makes a physician turn pale[a]; a king today[b], and tomorrow he falls.
translation:
  language: de
  text: Schon eine leichte Krankheit lässt einen Arzt erbleichen[a]; heute ist er König, und morgen fällt er.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich beschreibt das Hebräische, dass die Krankheit den Arzt gelblich oder bleich werden lässt. Die griechische Parallele hat abweichend: „Eine langwierige Krankheit verspottet den Arzt.“'
    reason: lexical_alternative
  - marker: b
    text: 'Die griechische Parallele deutet den Fall ausdrücklich als Tod: „und morgen wird er sterben.“'
    reason: alternative_reading
lexical_decisions:
- source_word: שֶׁמֶץ מַחֲלָה
  choice: eine leichte Krankheit
  rationale: שֶׁמֶץ bezeichnet eine geringe Menge oder Spur. Zusammen mit מַחֲלָה ergibt sich eine nur geringfügige Erkrankung; „leichte Krankheit“ ist im Deutschen natürlich und bewahrt den pointierten Gegensatz zur Hilflosigkeit des Arztes.
- source_word: יַצְהִיב
  choice: lässt … erbleichen
  rationale: Das Verb beschreibt eine gelbliche beziehungsweise bleiche Verfärbung. „Erbleichen“ gibt die sichtbare Farbveränderung in idiomatischem Deutsch wieder; die konkretere gelbe Färbung wird in einer Fußnote kenntlich gemacht.
- source_word: רוֹפֵא
  choice: einen Arzt
  rationale: Das Partizip bezeichnet einen Heilkundigen. „Arzt“ ist die geläufige moderne Entsprechung und wahrt hier die unbestimmte, sprichwortartige Aussage.
- source_word: מֶלֶךְ הַיּוֹם
  choice: heute König
  rationale: Die knappe, verblose hebräische Wendung wird ebenso knapp wiedergegeben und betont den gegenwärtigen Rang im Gegensatz zum morgigen Sturz.
- source_word: וּמָחָר יִפּוֹל
  choice: und morgen fällt er
  rationale: נפל bedeutet grundsätzlich „fallen“. Das Präsens in der deutschen Sentenz wirkt natürlich und kann sowohl Tod als auch allgemeinen Sturz oder Untergang umfassen.
theological_decisions:
- issue: Ob das Geschick des Königs ausdrücklich als Tod oder allgemeiner als Fall wiederzugeben ist
  choice: „fällt er“
  alternative: „stirbt er“ / „kommt er ans Ende“
  rationale: Der hebräische Hauptzeuge verwendet יִפּוֹל („er fällt“) und lässt Art und Tragweite des Falls offen. Die griechische Parallele deutet ihn mit τελευτήσει ausdrücklich als Tod. Der Haupttext bewahrt die weitere hebräische Aussage; die engere griechische Deutung steht in der Fußnote.
translation_notes:
  register: Knappes, sentenzartiges Standarddeutsch mit bewahrter Parallelität. „Schon“ macht die im hebräischen Ausdruck angelegte Pointe einer geringfügigen Krankheit natürlich hörbar, ohne den Sinn zu spezifizieren. Die Ellipse „heute König“ erhält die schroffe Gegenüberstellung von gegenwärtiger Macht und unmittelbar folgendem Fall.
