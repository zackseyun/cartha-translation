  text: Better is one who works and has abundant wealth than one who honors himself and lacks food[a].
translation:
  language: de
  text: Besser ist, wer arbeitet und über reichlich Besitz verfügt, als wer sich selbst großtut und keine Nahrung hat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Text lautet: „Mein Kind, ehre deine Seele in Sanftmut und erweise ihr Ehre, wie sie es verdient.“ Die hebräische und die griechische Überlieferung unterscheiden sich hier erheblich.'
    reason: alternative_reading
lexical_decisions:
- source_word: טוֹב
  choice: Besser ist
  rationale: Im zweiteiligen Weisheitsspruch hat טוֹב vergleichende Funktion; die deutsche Formulierung bewahrt die knappe sprichwörtliche Eröffnung.
- source_word: עוֹבֵד
  choice: wer arbeitet
  rationale: עבד bezeichnet hier aufgrund des Gegensatzes zu selbstgefälligem Auftreten am ehesten tätige Arbeit, nicht den rechtlichen Stand eines Dieners oder Sklaven.
- source_word: וְיוֹתֵר הוֹן
  choice: und über reichlich Besitz verfügt
  rationale: Die knappe hebräische Verbindung bezeichnet offenbar ein Mehr beziehungsweise einen Überfluss an הוֹן, also Besitz oder Vermögen. Die Formulierung gibt den materiellen Wohlstand natürlich wieder, ohne ein bestimmtes Ausmaß festzulegen.
- source_word: מִמִּתְכַּבֵּד
  choice: als wer sich selbst großtut
  rationale: Die Hitpael-Form ist reflexiv und bezeichnet hier jemanden, der sich selbst Ehre oder Bedeutung beimisst. „Sich großtun“ bringt die kritisierte Selbstüberhöhung idiomatisch zum Ausdruck.
- source_word: וַחֲסַר מַתָּן
  choice: und keine Nahrung hat
  rationale: חסר bezeichnet einen Mangel. מַתָּן kann formal „Gabe“ oder „Zuwendung“ bedeuten, wird in diesem wirtschaftlichen Gegensatz jedoch am plausibelsten als lebensnotwendige Versorgung beziehungsweise Nahrung verstanden.
theological_decisions:
- issue: Starke Abweichung zwischen der erhaltenen hebräischen und der griechischen Überlieferung
  choice: Der Haupttext folgt dem erhaltenen Hebräisch; die deutlich abweichende griechische Fassung steht in einer Fußnote.
  alternative: 'Griechisch: „Mein Kind, ehre deine Seele in Sanftmut und erweise ihr Ehre, wie sie es verdient.“'
  rationale: Da für diesen Vers ein hebräischer Textzeuge vorliegt, bildet er die Grundlage der Übersetzung. Die griechische Fassung enthält jedoch einen grundsätzlich anderen Spruch und muss deshalb als bedeutende alternative Überlieferung transparent dokumentiert werden.
translation_notes:
  register: Knapper, würdevoller Weisheitsspruch in modernem Standarddeutsch. „Sich selbst großtun“ ist verständlich und bildet den reflexiven, kritisch wertenden Sinn ab; die erhebliche Textabweichung wird nicht harmonisiert.
