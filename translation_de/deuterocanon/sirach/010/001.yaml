  text: A wise judge sets his people in order[a], and the rule of one who understands is well arranged.
translation:
  language: de
  text: Ein Richter ordnet sein Volk[a], und die Herrschaft eines Verständigen ist wohlgeordnet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort kann auch mit »gründet« oder »festigt« wiedergegeben werden; die griechische Parallelüberlieferung legt hier das Ordnen beziehungsweise Lenken des Volkes nahe.
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוֹפֵט
  choice: Richter
  rationale: Das hebräische Substantiv bezeichnet hier am natürlichsten einen Richter beziehungsweise einen mit Regierungsgewalt betrauten Amtsträger; das griechische κριτής bestätigt diese Wiedergabe.
- source_word: יוֹסֵד
  choice: bringt … in eine feste Ordnung
  rationale: Das Verb kann »gründen« oder »festigen« bedeuten. Mit עַם als Objekt und im Parallelismus zu סְדוּרָה bezeichnet es hier plausibel das ordnende und stabilisierende Wirken eines Regierenden; die Formulierung bewahrt zugleich den Gedanken des Festgründens.
- source_word: עַמּוֹ
  choice: sein Volk
  rationale: Die Besitzbeziehung ist im Hebräischen ausdrücklich markiert; »Volk« ist in diesem Zusammenhang die natürliche Wiedergabe von עַם.
- source_word: מֶמְשֶׁלֶת
  choice: die Herrschaft
  rationale: Das Wort bezeichnet Regierungsgewalt oder deren Ausübung. »Herrschaft« bildet den Begriff knapp und würdig ab, ohne ihn auf eine moderne Staatsverwaltung einzuengen.
- source_word: מֵבִין
  choice: eines Verständigen
  rationale: Das Partizip bezeichnet einen einsichtigen oder urteilsfähigen Menschen. Die substantivierte Form »Verständiger« erhält den persönlichen und singularischen Charakter.
- source_word: סְדוּרָה
  choice: wohlgeordnet
  rationale: Das Adjektiv bezeichnet einen geordneten beziehungsweise richtig eingerichteten Zustand. »Wohlgeordnet« gibt den positiven Sinn prägnant wieder.
