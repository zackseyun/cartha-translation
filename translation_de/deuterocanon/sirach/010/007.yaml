revisions:
- from: Hochmut ist dem Herrn und den Menschen verhasst, und Unterdrückung ist ein Vergehen gegen beide.[a]
  to: Hochmut ist dem Herrn und den Menschen verhasst, und Unterdrückung ist für beide ein Vergehen.[a]
  rationale: Die Revision korrigiert die zu starke Wiedergabe „gegen beide“. Sie bewahrt die im Kontext naheliegende Aussage, dass Unterdrückung von Gott und Menschen als Vergehen gilt, und dokumentiert zugleich die wörtliche sowie die überlieferungsgeschichtliche Unsicherheit.
