translation:
  language: de
  text: Hochmut ist dem Herrn und den Menschen verhasst, und Unterdrückung ist für beide ein Vergehen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die zweite Satzhälfte ist im Hebräischen knapp und syntaktisch schwierig. Wörtlich etwa: „und von beiden: Vergehen, Unterdrückung“. „Für beide“ gibt die naheliegende Deutung wieder, dass Unterdrückung in den Augen Gottes und der Menschen ein Vergehen ist. Die griechische Fassung ist anders gebaut und kann etwa lauten: „und von beiden wird er/sie Unrechtes begehen“.'
    reason: Bewahrt die syntaktische Unsicherheit des hebräischen Textes und weist auf die abweichende griechische Satzfügung hin, ohne eine umstrittene Deutung als wörtlichen Sinn auszugeben.
lexical_decisions:
- source_word: שְׂנוּאָה
  choice: verhasst
  rationale: Das prädikative Partizip bezeichnet etwas, das Hass beziehungsweise starke Ablehnung hervorruft. „Verhasst“ gibt diese Wertung knapp und idiomatisch wieder.
- source_word: לְאָדוֹן
  choice: dem Herrn
  rationale: אדון kann einen menschlichen Herrn bezeichnen; der Weisheitskontext und das griechische Κυρίου sprechen hier jedoch für Gott. Der deutsche Dativ entspricht der hebräischen ל-Konstruktion natürlich.
- source_word: וַאֲנָשִׁים
  choice: und den Menschen
  rationale: אנשים bezeichnet hier Menschen als Gegenüber Gottes. Im modernen Deutschen ist „den Menschen“ die natürliche generische Wiedergabe, ohne den Aussageumfang auf erwachsene Männer zu verengen.
- source_word: גַּאֲוָה
  choice: Hochmut
  rationale: „Hochmut“ bezeichnet im Deutschen eindeutig die moralisch verurteilte Selbstüberhebung und passt daher besser als das mehrdeutige „Stolz“.
- source_word: מַעַל
  choice: Vergehen
  rationale: מעל kann Treuebruch, Untreue oder schuldhafte Verfehlung bezeichnen. „Vergehen“ bewahrt hier den allgemeinen Charakter der moralischen Anklage, ohne einen ausschließlich kultischen oder bundesrechtlichen Sinn festzulegen.
- source_word: עֹשֶׁק
  choice: Unterdrückung
  rationale: Das Wort bezeichnet gewaltsame oder ausbeuterische Bedrückung und wird deshalb unmittelbar mit „Unterdrückung“ wiedergegeben.
- source_word: וּמִשְּׁנֵיהֶם
  choice: gegen beide
  rationale: 'Im Zusammenhang wird die Wendung relational verstanden: Unterdrückung ist sowohl gegenüber dem Herrn als auch gegenüber Menschen eine Verfehlung. Da die knappe hebräische Form auch anders aufgefasst werden kann, wird die Unsicherheit in der Fußnote ausgewiesen.'
theological_decisions:
- issue: Bezug von אֲדוֹן
  choice: der Herr, also Gott
  alternative: ein menschlicher Herr
  rationale: Der Parallelismus stellt den Herrn den Menschen gegenüber; zudem bestätigt das griechische Κυρίου den göttlichen Bezug.
- issue: Verhältnis von Unterdrückung zu „beiden“
  choice: Unterdrückung ist ein Vergehen gegen Gott und Menschen
  alternative: 'Von beiden geht unterdrückerisches Unrecht aus; griechisch möglicherweise: Der Hochmut verübt vor beiden Unrecht'
  rationale: Die hebräische Kurzform ist syntaktisch schwierig. Die gewählte Fassung ergibt einen klaren Bezug auf die beiden zuvor genannten Gegenüber, ohne Unterdrückung Gott als Ursprung zuzuschreiben. Die abweichende griechische Überlieferung und die mögliche alternative Zuordnung werden offengelegt.
translation_notes:
  register: Moderne, würdige Standardsprache. „Hochmut“ vermeidet die positive Nebenbedeutung von „Stolz“; „Unterdrückung“ erhält die konkrete soziale Schärfe des hebräischen עֹשֶׁק.
