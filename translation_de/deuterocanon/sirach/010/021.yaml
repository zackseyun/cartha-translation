  naturalness: „Unter Brüdern steht ihr Oberhaupt in Ansehen“ ist würdig und idiomatisch. „und wer Gott fürchtet, unter seinem Volk“ ist im modernen Standarddeutsch kein vollständiger, gut lesbarer Satz. Die Wiederholung des aus dem Parallelglied erschließbaren Prädikats macht die sprichwortartige Aussage verständlich, ohne den Sinn zu verändern.
