translation:
  language: de
  text: Unter Brüdern steht ihr Oberhaupt in Ansehen,[a] und wer Gott fürchtet, steht unter seinem Volk in Ansehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Paralleltext lautet: »Der Reiche, der Angesehene und der Arme – ihr Ruhm ist die Furcht des Herrn.« Der hebräische und der griechische Textzeuge weichen hier erheblich voneinander ab; der Haupttext folgt dem erhaltenen Hebräisch.'
    reason: alternative_reading
lexical_decisions:
- source_word: בֵּין אַחִים
  choice: Unter Brüdern
  rationale: בֵּין bezeichnet hier die Stellung innerhalb einer Gruppe; »unter« ist im Deutschen idiomatisch. אַחִים wird entsprechend der grammatisch männlichen Form mit »Brüdern« wiedergegeben.
- source_word: רֹאשָׁם
  choice: ihr Oberhaupt
  rationale: רֹאשׁ bedeutet wörtlich »Kopf«, bezeichnet im sozialen Zusammenhang aber eine führende Person. »Oberhaupt« bewahrt diesen Sinn und den Bezug des Suffixes auf die Brüder.
- source_word: נִכְבָּד
  choice: steht … in Ansehen
  rationale: Die Nifalform von כבד bezeichnet hier, dass jemand geehrt oder hoch angesehen ist. Die deutsche Wendung klingt natürlich und wahrt den sozialen Bedeutungsgehalt.
- source_word: וִירֵא אֱלֹהִים
  choice: und wer Gott fürchtet
  rationale: Die singularische Charakterisierung wird als substantivischer Relativsatz wiedergegeben. »Gott« folgt ausdrücklich dem hebräischen Zeugen, während der griechische Paralleltext »den Herrn« bietet.
- source_word: בְּעַמּוֹ
  choice: unter seinem Volk
  rationale: Die Präposition בְּ ist hier sozial-lokativ zu verstehen. »Unter seinem Volk« bildet zugleich eine natürliche Parallele zu »unter Brüdern«.
theological_decisions:
- issue: Deutliche Abweichung zwischen dem hebräischen und dem griechischen Textzeugen
  choice: Der Haupttext folgt dem erhaltenen hebräischen Text.
  alternative: 'Griechisch: »Reich und angesehen und arm – ihr Ruhm ist die Furcht des Herrn.«'
  rationale: Wo der hebräische Sirachtext erhalten ist, bildet er die primäre Übersetzungsgrundlage. Da der griechische Paralleltext erheblich abweicht, wird seine Lesart transparent in einer Fußnote dokumentiert, ohne beide Fassungen zu harmonisieren.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die leicht verdichtete, sprichwortartige Parallelstruktur des Hebräischen bleibt erhalten; die Ellipse im zweiten Satzglied wird nicht erklärend aufgelöst.
