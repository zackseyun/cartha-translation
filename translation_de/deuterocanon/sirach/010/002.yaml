  text: An undisciplined king will ruin a city[a], but a city is inhabited through the wisdom of its rulers.
translation:
  language: de
  text: Ein zügelloser König richtet eine Stadt zugrunde; doch eine Stadt wird durch die Umsicht ihrer Obersten bewohnt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Paralleltext formuliert den Gedanken anders: Wie der Leiter der Stadt ist, so sind auch ihre Bewohner.'
    reason: Dokumentiert die abweichende Formulierung des griechischen Paralleltexts, ohne den hebräischen Wortlaut im Haupttext zu überformen.
lexical_decisions:
- source_word: מֶלֶךְ
  choice: König
  rationale: Die gewöhnliche Bedeutung bezeichnet hier das einzelne politische Oberhaupt.
- source_word: פָּרוּעַ
  choice: zügellos
  rationale: Das Wort beschreibt fehlende Selbstbeherrschung oder Begrenzung, ohne notwendig Gesetzlosigkeit im engeren Sinn zu behaupten.
- source_word: יַשְׁחִית
  choice: richtet … zugrunde
  rationale: Die Hifil-Form von שחת bezeichnet das Herbeiführen von Verderben oder Ruin; die Wendung passt natürlich zu den politischen Folgen schlechter Herrschaft.
- source_word: עִיר
  choice: Stadt
  rationale: Gibt sowohl den Ort als auch das städtische Gemeinwesen wieder.
- source_word: נוֹשֶׁבֶת
  choice: bleibt … bewohnt
  rationale: Das Partizip bezeichnet eine bewohnte beziehungsweise besiedelte Stadt. „Bleibt“ macht im Deutschen die im Spruch gemeinte Beständigkeit verständlich, ist jedoch kontextuell ergänzt.
- source_word: בְּשֶׂכֶל
  choice: durch die Umsicht
  rationale: שכל bezeichnet Einsicht, Klugheit oder umsichtiges Handeln; „Umsicht“ eignet sich besonders für verantwortliche Stadtleitung.
- source_word: שָׂרֶיהָ
  choice: ihrer Obersten
  rationale: Der Plural bezeichnet führende Amtsträger. „Oberste“ bewahrt die politische Leitungsfunktion, ohne eine bestimmte moderne Amtsordnung einzutragen.
theological_decisions:
- issue: Verhältnis der beiden Halbverse und des griechischen Paralleltextes
  choice: Der hebräische Wortlaut und seine Reihenfolge bestimmen den Haupttext; der Zustand der Stadt wird unmittelbar mit der Qualität ihrer Leitung verbunden.
  alternative: 'Dem Griechischen enger folgen: „Wie der Lenker der Stadt ist, so sind alle ihre Bewohner.“'
  rationale: Der erhaltene hebräische Text ist primär und bietet eine eigenständige Gegenüberstellung von zügelloser Königsherrschaft und der Umsicht mehrerer Oberster. Der griechische Text bestätigt das Leitmotiv, darf aber die hebräische Formulierung nicht ersetzen.
- issue: Bedeutung von נוֹשֶׁבֶת
  choice: 'Als Fortbestand einer bewohnten Stadt wiedergeben: „bleibt … bewohnt“.'
  alternative: 'Streng formnah: „wird durch die Umsicht ihrer Obersten bewohnt“ oder „ist … bewohnt“.'
  rationale: Die natürliche deutsche Fassung erschließt die soziale Stabilität, die der hebräische Satz der klugen Leitung zuschreibt, ohne daraus eine weitergehende Lehrbehauptung zu machen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Zügellos“ ist moralisch-politisch klar, „richtet … zugrunde“ idiomatisch und nicht unnötig absolut. Die Fußnote bewahrt die formale hebräische Lesart und dokumentiert den griechischen Paralleltext.
