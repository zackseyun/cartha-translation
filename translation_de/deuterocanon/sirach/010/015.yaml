translation:
  language: de
  text: Gott stürzte den Thron der Hochmütigen[a] und setzte die Demütigen an ihre Stelle.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Überlieferung lautet: „die Throne von Herrschern“; außerdem steht dort „der Herr“ statt „Gott“.'
    reason: Der griechische Paralleltext weicht beim Numerus des Thrones, bei der Bezeichnung der entthronten Personen und beim Gottesnamen vom hebräischen Text ab.
lexical_decisions:
- source_word: כִּסֵּא גֵאִים
  choice: den Thron der Hochmütigen
  rationale: Der hebräische Text hat das singularische כִּסֵּא („Thron“) mit dem pluralischen גֵאִים („Hochmütige“). Die Übersetzung folgt dieser Form und gibt den Hochmut als kennzeichnende Haltung wieder.
- source_word: הָפַך
  choice: stürzte
  rationale: הָפַך bezeichnet hier das Umkehren oder Umstürzen eines Thrones. „stürzte“ ist im Deutschen natürlich und bewahrt das Bild eines von Gott herbeigeführten Machtwechsels.
- source_word: עֲנָוִים
  choice: die Demütigen
  rationale: עֲנָוִים kann demütige, sanftmütige oder bedrängte Menschen bezeichnen. „die Demütigen“ hält den unmittelbaren Gegensatz zu den Hochmütigen fest, ohne eine rein soziale oder politische Deutung festzulegen.
- source_word: תַּחְתָּם
  choice: an ihre Stelle
  rationale: Wörtlich bezeichnet die Wendung den Platz „unter ihnen“ beziehungsweise „anstelle ihrer“. Im Zusammenhang mit dem Thronwechsel ist „an ihre Stelle“ die natürliche deutsche Wiedergabe.
theological_decisions:
- issue: Göttliches Handeln beim Machtwechsel
  choice: Gott stürzte … und setzte
  alternative: Der Herr setzte die Throne von Herrschern ab
  rationale: Die Übersetzung folgt vorrangig dem vorliegenden hebräischen Text mit אֱלֹהִים („Gott“) und stellt beide Handlungen ausdrücklich als Gottes Wirken dar. Die abweichende griechische Überlieferung wird in der Fußnote dokumentiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer antithetischer Satzstruktur. Die singularische Form „Thron“ folgt bewusst dem hebräischen Haupttext; die relevante griechische Variante wird transparent ausgewiesen.
