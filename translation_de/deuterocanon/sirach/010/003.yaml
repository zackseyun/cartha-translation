  text: As the judge of a people[a], so are his officials; and as the head of a city, so are its inhabitants.
translation:
  language: de
  text: Wie der Richter eines Volkes[a], so sind seine Amtsträger; und wie das Oberhaupt einer Stadt, so sind ihre Bewohner.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Parallelüberlieferung lautet: „Ein ungebildeter König wird sein Volk zugrunde richten, und durch die Einsicht der Machthaber wird eine Stadt bewohnt werden.“ Die erhaltene hebräische und die griechische Fassung dieses Verses unterscheiden sich erheblich; der Haupttext folgt dem erhaltenen hebräischen Zeugen.'
    reason: alternative_reading
lexical_decisions:
- source_word: כְּשׁוֹפֵט עַם
  choice: Wie der Richter eines Volkes
  rationale: Die vergleichende Spruchform mit כְּ wird durch „Wie …, so …“ natürlich wiedergegeben. שׁוֹפֵט kann Richter und zugleich Herrscher bezeichnen; „Richter“ bewahrt die konkrete hebräische Bezeichnung, während „eines Volkes“ den allgemeinen, sprichwörtlichen Sinn von עַם ausdrückt.
- source_word: מְלִיצָיו
  choice: seine Amtsträger
  rationale: מֵלִיץ kann Vermittler, Sprecher oder Dolmetscher bedeuten. Im politischen Zusammenhang bezeichnet es hier am ehesten die Funktionsträger des Richters beziehungsweise Herrschers. „Amtsträger“ wahrt diesen institutionellen Sinn, ohne eine engere Hof- oder Beratungsfunktion festzulegen.
- source_word: וּכְרֹאשׁ עִיר
  choice: und wie das Oberhaupt einer Stadt
  rationale: רֹאשׁ bedeutet wörtlich „Kopf“ und übertragen „Oberhaupt“. Die deutsche Wiedergabe erhält das hebräische Leitungsbild und klingt zugleich idiomatisch.
- source_word: יוֹשְׁבָיו
  choice: ihre Bewohner
  rationale: Das Partizip von ישׁב bezeichnet die in der Stadt Wohnenden. Das Suffix bezieht sich im Deutschen grammatisch auf die feminine „Stadt“, daher „ihre Bewohner“.
theological_decisions:
- issue: Deutliche Abweichung zwischen dem erhaltenen hebräischen Text und der griechischen Parallelüberlieferung
  choice: Der Haupttext folgt dem erhaltenen hebräischen Spruch über die Entsprechung zwischen Leitenden, Amtsträgern und Bewohnern.
  alternative: 'Griechisch: „Ein ungebildeter König wird sein Volk zugrunde richten, doch durch die Einsicht der Machthaber wird eine Stadt bewohnt werden.“'
  rationale: Der hebräische Zeuge ist hier vorhanden, als zuverlässig eingestuft und bestätigt. Deshalb bestimmt er den Haupttext. Die griechische Fassung bietet eine wesentlich andere Gestalt des Verses und wird wegen ihrer textgeschichtlichen Bedeutung in einer Fußnote vollständig kenntlich gemacht, ohne die Spannung harmonisierend aufzulösen.
translation_notes:
  register: Moderne, würdige Standardsprache mit klarer sprichwörtlicher Parallelstruktur. „Amtsträger“ ist verständlicher und im politischen Zusammenhang treffender als das wörtlich mögliche „Dolmetscher“ oder „Sprecher“. Das Semikolon markiert die beiden eng parallelen Vershälften.
