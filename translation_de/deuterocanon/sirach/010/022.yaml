  text: A resident alien[a], a foreigner, a stranger, and a poor man—their glory is the fear of God.
translation:
  language: de
  text: Ein ansässiger Fremder, ein Außenstehender, ein Ausländer und ein Armer – ihr Ruhm ist die Furcht Gottes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Parallelüberlieferung lautet: „Es ist nicht recht, einen verständigen Armen zu verachten, und es ist nicht angemessen, einen sündigen Mann zu ehren.“ Der hebräische und der griechische Text unterscheiden sich hier erheblich.'
    reason: alternative_reading
lexical_decisions:
- source_word: גֵּר
  choice: ansässiger Fremder
  rationale: גֵּר bezeichnet einen Nicht-Einheimischen, der dauerhaft unter einer Bevölkerung lebt; „ansässiger Fremder“ bewahrt diesen sozialen Status in verständlichem Deutsch.
- source_word: וְזָר
  choice: ein Außenstehender
  rationale: זָר bezeichnet jemanden außerhalb des vertrauten sozialen, verwandtschaftlichen oder kultischen Kreises. „Außenstehender“ unterscheidet den Ausdruck von גֵּר und נָכְרִי.
- source_word: נָכְרִי
  choice: ein Ausländer
  rationale: נָכְרִי bezeichnet gewöhnlich einen Angehörigen eines anderen Volkes oder Landes. „Ausländer“ gibt diese Bedeutung knapp wieder und vermeidet eine Gleichsetzung mit גֵּר.
- source_word: וָרָשׁ
  choice: und ein Armer
  rationale: רָשׁ bezeichnet hier im maskulinen Singular einen armen Menschen. Die substantivierte Form „ein Armer“ wahrt die knappe Reihung.
- source_word: תִּפְאֶרֶת
  choice: ihr Ruhm
  rationale: תִּפְאֶרֶת kann Ruhm, Pracht oder Zierde bedeuten. „Ruhm“ drückt hier die wahre Würde der genannten gesellschaftlich gering geachteten Personen aus; das Possessivpronomen verdeutlicht die im nominalen Hebräisch knappe Beziehung.
- source_word: יִרְאַת אֱלֹהִים
  choice: die Furcht Gottes
  rationale: Die feste Weisheitswendung bezeichnet ehrfürchtige Gottesfurcht. Die traditionelle Formulierung bewahrt sowohl die lexikalische Kraft als auch den theologischen Spannungsgehalt.
theological_decisions:
- issue: Starke Abweichung zwischen hebräischem Text und griechischer Parallelüberlieferung
  choice: Der erhaltene hebräische Text bildet den Haupttext; die erheblich abweichende griechische Fassung steht in einer Fußnote.
  alternative: 'Griechisch: „Es ist nicht recht, einen verständigen Armen zu verachten, und es ist nicht angemessen, einen sündigen Mann zu ehren.“'
  rationale: Da für diesen Vers ein hoch eingestufter hebräischer Zeuge vorliegt, wird er vorrangig übersetzt. Die griechische Überlieferung bietet jedoch nicht nur eine geringfügige Variante, sondern einen anderen Spruch; deshalb wird sie transparent dokumentiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die viergliedrige Reihung und der knappe spruchhafte Nominalsatz des Hebräischen bleiben erhalten. „Ansässiger Fremder“, „Außenstehender“ und „Ausländer“ halten die drei unterschiedlichen sozialen Bezeichnungen auseinander.
