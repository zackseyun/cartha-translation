lexical_decisions:
- source_word: עַל כֵּן
  choice: Darum
  rationale: Gibt die folgernde Verbindung zum vorausgehenden Zusammenhang knapp und natürlich wieder.
- source_word: מִלֵּא לִבּוֹ
  choice: erfüllte … sein Herz
  rationale: Die ungewöhnliche, ergänzungslose Formulierung des überlieferten Hebräischen wird bewusst nahe am Wortlaut wiedergegeben, statt einen nicht genannten Inhalt wie Angst oder Leid einzufügen.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Folgt dem erhaltenen hebräischen Text; die griechische Parallele hat dagegen »der Herr«.
- source_word: נָגַע
  choice: traf ihn
  rationale: Im Strafzusammenhang bezeichnet das Verb ein schädigendes Treffen oder Schlagen. »traf ihn« wahrt die Nähe zur Bedeutung und vermeidet im Deutschen eine unnötig schwerfällige unmittelbare Wiederholung von »schlug«.
- source_word: וַיַּכֵּהוּ
  choice: er schlug ihn … nieder
  rationale: Das Verb נכה bezeichnet hier ein gewaltsames, vernichtendes Schlagen; »niederschlagen« bringt die Folge im natürlichen Deutschen zum Ausdruck.
- source_word: עַד כַּלֵּה
  choice: völlig
  rationale: Die Wendung bezeichnet die Vollendung beziehungsweise vollständige Vernichtung; die griechische Parallele bestätigt diesen Sinn.
theological_decisions:
- issue: Abweichender Gottesname in den hebräischen und griechischen Zeugen
  choice: Gott
  alternative: der Herr
  rationale: Da ein hebräischer Text erhalten ist, bestimmt אֱלֹהִים die Hauptfassung. Die abweichende griechische Lesart wird transparent in einer Fußnote genannt.
- issue: Schwierige und möglicherweise gestörte hebräische Satzgestalt
  choice: Die unbestimmte Wendung »erfüllte … sein Herz« bleibt im Haupttext erhalten.
  alternative: 'Die griechische Fassung: »Darum ließ der Herr die Heimsuchungen außergewöhnlich werden und vernichtete sie völlig.«'
  rationale: Der hebräische Wortlaut nennt nicht, womit das Herz erfüllt wurde, und lässt sich nur schwer mit dem folgenden Verb verbinden. Eine deutende Ergänzung würde die Unsicherheit verdecken; die deutlich abweichende griechische Überlieferung gehört daher in die Fußnote.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die auffällige Wendung »erfüllte … sein Herz« bleibt wegen der Unsicherheit des hebräischen Textes bewusst stehen; das zweite Verb wird mit »traf« wiedergegeben, damit der Satz trotz der doppelten Schlagwortwahl lesbar bleibt.
