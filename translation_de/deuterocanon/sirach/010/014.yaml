translation:
  language: de
  text: Darum erfüllte Gott dessen Herz und traf ihn[a][b]; er schlug ihn völlig nieder.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das Hebräische ist an dieser Stelle schwierig und lautet wörtlich etwa: »Darum erfüllte Gott sein Herz; er traf und schlug ihn bis zur völligen Vernichtung.« Die griechische Überlieferung lautet dagegen: »Darum machte der Herr die Strafgerichte außergewöhnlich und vernichtete jene völlig.«'
