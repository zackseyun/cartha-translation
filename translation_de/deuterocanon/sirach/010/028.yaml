  yaml_path: translation/deuterocanon/sirach/010/028.yaml
  text: Who will justify the one who sins against his own soul[a], and who will honor the one who dishonors his own life?
translation:
  language: de
  text: Wer wird den für gerecht erklären, der gegen seine eigene Seele sündigt,[a] und wer wird den ehren, der sein eigenes Leben entehrt?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der erhaltene hebräische Text aus der Kairoer Geniza weicht hier stark vom Griechischen ab und ist schwer verständlich. Ungefähr lautet er: „Mein Sohn, ehre dich selbst in Demut, und er wird dir Einsicht und verlorene Ehre geben.“ Der Haupttext folgt an dieser textlich unsicheren Stelle der zusammenhängenden griechischen Überlieferung.'
    reason: textual_variant
lexical_decisions:
- source_word: τὸν ἁμαρτάνοντα
  choice: den, der … sündigt
  rationale: Das griechische Präsenspartizip wird allgemein und mit erhaltener verbaler Aussage wiedergegeben.
- source_word: εἰς τὴν ψυχὴν αὐτοῦ
  choice: gegen seine eigene Seele
  rationale: ψυχή kann Seele, Selbst oder Leben bedeuten. „Seele“ wahrt hier die Unterscheidung zu ζωή im zweiten Satzglied; εἰς bezeichnet die gegen die eigene Person gerichtete Handlung.
- source_word: τίς δικαιώσει
  choice: Wer wird … für gerecht erklären
  rationale: Die Formulierung gibt den moralisch-forensischen Sinn von δικαιόω verständlich wieder, ohne eine Rechtfertigung tatsächlich zu behaupten.
- source_word: δοξάσει
  choice: wird … ehren
  rationale: Im weisheitlichen Zusammenhang bezeichnet δοξάζω soziale Anerkennung oder Ehre; „ehren“ bildet zudem den Gegensatz zu „entehrt“.
- source_word: τὸν ἀτιμάζοντα
  choice: den, der … entehrt
  rationale: ἀτιμάζω bedeutet, jemanden oder etwas ohne Ehre zu behandeln; „entehrt“ erhält den unmittelbaren Gegensatz zu „ehren“.
- source_word: τὴν ζωὴν αὐτοῦ
  choice: sein eigenes Leben
  rationale: ζωή wird natürlich als „Leben“ wiedergegeben; „eigenes“ macht den reflexiven Bezug deutlich und unterscheidet den Ausdruck von ψυχή.
theological_decisions:
- issue: Starke Abweichung zwischen dem erhaltenen hebräischen Text und der griechischen Überlieferung
  choice: Der Haupttext folgt dem kohärenten griechischen Bikolon.
  alternative: 'Den schwierigen hebräischen Wortlaut ungefähr wiedergeben: „Mein Sohn, ehre dich selbst in Demut, und er wird dir Einsicht und verlorene Ehre geben.“'
  rationale: Der vorliegende hebräische Text ist an dieser Stelle offenbar instabil oder gehört einer stark abweichenden Textform an; insbesondere sein Schlusssatz ist grammatisch und inhaltlich schwer verständlich. Die griechische Fassung bietet dagegen einen geschlossenen Parallelismus. Die Abweichung wird daher ausdrücklich in einer Fußnote dokumentiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorischen Fragen und der Gegensatz zwischen ehren und entehren bleiben erhalten; „für gerecht erklären“ vermittelt den forensischen Sinn natürlicher als das im heutigen Allgemeingebrauch mehrdeutige „rechtfertigen“.
