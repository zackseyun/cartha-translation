  text: What kind of offspring is contemptible? The offspring of one who transgresses a commandment.[a]
translation:
  language: de
  text: Was für eine Nachkommenschaft ist verachtenswert? Die Nachkommenschaft eines Menschen, der ein Gebot übertritt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Im Griechischen: »diejenigen, die Gebote übertreten« (Mehrzahl); dies verdeutlicht den schwierigen hebräischen Wortlaut.'
    reason: alternative_reading
lexical_decisions:
- source_word: זֶרַע
  choice: Nachkommenschaft
  rationale: זֶרַע bezeichnet hier bildlich die Abstammung beziehungsweise die Nachkommen. »Nachkommenschaft« bewahrt den kollektiven Singular und passt zum weisheitlichen Stil.
- source_word: נִקְלֶה
  choice: verachtenswert
  rationale: Das Wort bezeichnet etwas Geringgeachtetes, Ehrloses oder Verächtliches. »Verachtenswert« gibt die wertende Kraft der rhetorischen Frage wieder und entspricht dem griechischen ἄτιμον.
- source_word: מַה
  choice: was für eine
  rationale: Das Fragewort leitet hier eine rhetorische Einordnungsfrage ein. »Was für eine« ist im Deutschen idiomatisch und lässt den klassifizierenden Sinn erkennen.
- source_word: לֶאֱנוֹשׁ
  choice: eines Menschen
  rationale: Der überlieferte hebräische Ausdruck ist syntaktisch schwierig. »Eines Menschen« bewahrt den ausdrücklichen menschlichen Bezug, ohne den unklaren Wortlaut unnötig wörtlich nachzuahmen.
- source_word: עוֹבֵר
  choice: übertritt
  rationale: In Verbindung mit מִצְוָה bezeichnet das Partizip jemanden, der ein Gebot verletzt. »Übertritt« bewahrt den moralisch-rechtlichen Ton.
- source_word: מִצְוָה
  choice: ein Gebot
  rationale: Der Singular des hebräischen Textes bleibt erhalten. »Gebot« ist im modernen Deutschen natürlich und wahrt den Bezug zum Weisheits- und Tora-Kontext.
theological_decisions:
- issue: Abweichung zwischen dem hebräischen und dem griechischen Text im zweiten Satzteil
  choice: Der erhaltene hebräische Text bildet die Grundlage; sein Singular »ein Gebot« steht im Haupttext, während der schwierige Satzbau mithilfe der griechischen Parallele verständlich wiedergegeben wird.
  alternative: »diejenigen, die Gebote übertreten«, enger nach dem griechischen Plural
  rationale: Der hebräische Text ist erhalten, jedoch syntaktisch schwierig. Die griechische Parallele dient als Kontrollzeugnis, darf aber die abweichende hebräische Zahl und Formulierung nicht stillschweigend verdrängen; deshalb wird die Variante in einer Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorische Frage bleibt erhalten; »Nachkommenschaft« wahrt den kollektiven Singular und den weisheitlichen Ton. Die echte textliche Spannung zwischen dem schwierigen Hebräisch und der griechischen Parallele wird nicht eingeebnet.
