  text: What offspring is honorable? Human offspring[a]. What offspring is honorable? Those who fear God[b]. What offspring is honorable? Those who keep the commandment.
translation:
  language: de
  text: Welche Nachkommenschaft ist ehrenwert? Die Nachkommenschaft der Menschen.[a] Welche Nachkommenschaft ist ehrenwert? Diejenigen, die Gott fürchten.[b] Welche Nachkommenschaft ist ehrenwert? Diejenigen, die das Gebot halten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Parallele hat als letztes Glied: „Welche Nachkommenschaft ist nicht ehrenwert? Die Nachkommenschaft der Menschen.“ Der hebräische Text liest stattdessen: „Welche Nachkommenschaft ist ehrenwert? Diejenigen, die das Gebot halten.“'
    reason: textual_variant
  - marker: b
    text: Die griechische Parallele hat „diejenigen, die den Herrn fürchten“, der hebräische Text dagegen „diejenigen, die Gott fürchten“.
    reason: alternative_reading
lexical_decisions:
- source_word: זֶרַע / σπέρμα
  choice: Nachkommenschaft
  rationale: Das Wort bezeichnet hier kollektiv die menschliche Nachkommenschaft. „Nachkommenschaft“ bewahrt diesen kollektiven Sinn und kann als rhetorisches Leitwort dreimal wiederholt werden; „Same“ wäre im heutigen Deutsch missverständlich.
- source_word: נִכְבָּד / ἔντιμον
  choice: ehrenwert
  rationale: Das Adjektiv bezeichnet Ansehen beziehungsweise Ehrenstatus. „Ehrenwert“ passt zur weisheitlichen Wertung, ohne wie „adlig“ einen vornehmen Geburtsstand nahezulegen.
- source_word: מַה / ποῖον
  choice: was für eine
  rationale: Die Frage ordnet rhetorisch nach der Art oder Beschaffenheit ein. „Was für eine“ gibt dies im Deutschen natürlicher wieder als das bloße „was“.
- source_word: לֶאֱנוֹשׂ / ἀνθρώπου
  choice: der Menschen
  rationale: Die Wendung bezieht sich allgemein auf die Menschheit und nicht ausschließlich auf Männer. Der Genitiv entspricht zugleich der griechischen Parallele.
- source_word: יְרֵא אֱלֹהִים / οἱ φοβούμενοι τὸν κύριον
  choice: die, die Gott fürchten
  rationale: Der hebräische Hauptzeuge nennt Gott, während die griechische Parallele „den Herrn“ hat. Die Relativkonstruktion gibt den partizipialen Sinn klar und idiomatisch wieder.
- source_word: שׂוֹמֵר מִצְוָה
  choice: die, die das Gebot halten
  rationale: Das hebräische מִצְוָה steht im Singular. „Das Gebot halten“ bewahrt sowohl diesen Numerus als auch den biblisch-ethischen Sinn von שׁמר.
theological_decisions:
- issue: Deutliche Abweichung zwischen dem hebräischen und dem griechischen Text im letzten Glied
  choice: Der erhaltene hebräische Text bildet den Haupttext und endet positiv mit denen, die das Gebot halten.
  alternative: 'Die griechische Parallele endet: „Was für eine Nachkommenschaft ist verachtet? Die Nachkommenschaft der Menschen.“'
  rationale: Da für diesen Vers ein hebräischer Zeuge vorliegt, erhält er Vorrang. Die griechische Fassung bietet jedoch einen inhaltlich erheblichen Kontrast und wird deshalb in einer Fußnote vollständig bewahrt.
- issue: Gottesbezeichnung im zweiten Antwortglied
  choice: „Gott“ nach dem hebräischen יְרֵא אֱלֹהִים
  alternative: „den Herrn“ nach dem griechischen οἱ φοβούμενοι τὸν κύριον
  rationale: Die Übersetzung folgt dem extanten hebräischen Hauptzeugen, ohne die abweichende griechische Gottesbezeichnung zu verschweigen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst aphoristischer Dreifachwiederholung. „Nachkommenschaft“ ist als kollektiver Ausdruck gewählt; die Antworten „die, die …“ beziehen sich darauf sinngemäß als Personengruppe. Die Textspannung zwischen positiver hebräischer Dreierreihe und kontrastierendem griechischem Schluss bleibt durch die Fußnote sichtbar.
