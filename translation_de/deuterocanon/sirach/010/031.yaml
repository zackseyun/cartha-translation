translation:
  language: de
  text: Wie geehrt ist jemand in seinem Reichtum und wie verachtet in seiner Armut.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Parallelfassung ordnet den Gedanken anders und setzt andere Akzente: „Wer in Armut geehrt wird – wie viel mehr im Reichtum? Und wer im Reichtum ohne Ansehen ist – wie viel mehr in Armut?“ Hier folgt der Haupttext dem hebräischen Zeugnis.'
    reason: alternative_reading
lexical_decisions:
- source_word: נִכְבָּד
  choice: geehrt
  rationale: Das Nifal von כבד bezeichnet hier, dass jemand als angesehen oder ehrenvoll gilt. „Geehrt“ bewahrt den passiven Sinn und den gesellschaftlichen Bezug.
- source_word: בְּעָשְׁרוֹ
  choice: in seinem Reichtum
  rationale: Die Präposition ב kann den Umstand oder Lebensbereich bezeichnen. Die wörtlich-nahe Formulierung lässt offen, ob der Reichtum nur die Lage oder zugleich der Grund der Ehrung ist.
- source_word: אֵיכָכָה
  choice: wie
  rationale: Das Wort hat hier exklamative beziehungsweise rhetorische Kraft und bezeichnet ein Maß. „Wie“ erhält diese Offenheit, ohne ausdrücklich „wie viel mehr“ einzutragen.
- source_word: וְנִקְלֶה
  choice: und wie verachtet
  rationale: Das Nifal von קלה bezeichnet gering geachtet oder verächtlich behandelt zu werden. „Verachtet“ bildet einen klaren Gegenpol zu „geehrt“.
- source_word: בְּעָנְיוֹ
  choice: in seiner Armut
  rationale: Wie beim parallelen Ausdruck für Reichtum bezeichnet ב den Zustand oder Lebensbereich. Die parallele deutsche Fassung bewahrt den antithetischen Aufbau.
theological_decisions:
- issue: Verhältnis von gesellschaftlichem Ansehen zu Reichtum und Armut
  choice: Die knappe, mehrdeutige Feststellung des Hebräischen bleibt erhalten.
  alternative: Die Aussage ausdrücklich als moralische Verurteilung oder als Folgerung „wie viel mehr“ formulieren.
  rationale: Der hebräische Text benennt den scharfen Gegensatz, legt aber weder die genaue logische Beziehung noch eine ausdrückliche moralische Bewertung vollständig fest.
- issue: Abweichende griechische Überlieferung
  choice: Der hebräische Wortlaut bestimmt den Haupttext; die griechische Fassung wird in einer Fußnote dokumentiert.
  alternative: Die ausführlichere doppelte Steigerung der griechischen Fassung in den Haupttext übernehmen.
  rationale: Die angegebene hebräische Quelle besitzt hohe Sicherheit und ist für diese Ausgabe primär; die griechische Parallele bezeugt jedoch eine bedeutsame andere Reihenfolge und Betonung.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Der exklamative Parallelismus des Hebräischen wird knapp wiedergegeben; „einer“ hält die Aussage allgemein, ohne ein unnötig geschlechtsspezifisches Subjekt einzuführen.
