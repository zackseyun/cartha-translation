    reason: textual_variant
lexical_decisions:
- source_word: נָגִיד
  choice: Anführer
  rationale: Das Wort bezeichnet jemanden, der anderen vorsteht. „Anführer“ bewahrt den allgemeinen Autoritätssinn, ohne die mögliche dynastische Nebenbedeutung von „Fürst“ aufzudrängen.
- source_word: מוֹשֶׁל
  choice: Herrscher
  rationale: Das Partizip bezeichnet einen, der Herrschaft oder Regierungsgewalt ausübt. „Herrscher“ unterscheidet diesen Amtsträger verständlich vom vorausgehenden נָגִיד.
- source_word: שׁוֹפֵט
  choice: Richter
  rationale: Dies ist die übliche und sachlich passende Wiedergabe der richterlichen Amtsbezeichnung.
- source_word: נִכְבָּדוּ
  choice: stehen in hohem Ansehen
  rationale: Die Form drückt aus, dass die Genannten geehrt beziehungsweise hoch angesehen sind. Die deutsche Wendung ist natürlich und bewahrt den Gedanken gesellschaftlicher Wertschätzung.
- source_word: וְאֵין גָּדוֹל
  choice: doch keiner ist größer
  rationale: Die adversative Verbindung macht den Gegensatz zwischen dem Ansehen der Amtsträger und der übergeordneten Größe des Gottesfürchtigen deutlich.
- source_word: מִיְּרֵא אֱלֹהִים
  choice: als einer, der Gott fürchtet
  rationale: Die zentrale biblische Wendung „Gott fürchten“ wird bewahrt; sie bezeichnet ehrfürchtige, gehorsame Gottesbeziehung und sollte nicht auf bloßen Respekt verengt werden.
theological_decisions:
- issue: Hebräischer Text gegenüber der stark abweichenden griechischen Überlieferung
  choice: Der erhaltene hebräische Text bildet den Haupttext; die griechische Lesart wird in einer Fußnote dokumentiert.
  alternative: 'Dem griechischen Text folgen: „Freie werden einem weisen Sklaven dienen, und ein verständiger Mann wird nicht murren.“'
  rationale: Da für diese Stelle ein gut bezeugter hebräischer Text vorliegt, ist er die primäre Grundlage. Die griechische Überlieferung bietet keinen kleinen Wortlautunterschied, sondern einen wesentlich anderen Spruch; deshalb wird sie nicht harmonisiert, sondern transparent als Textvariante angegeben.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die dreigliedrige Amtsreihe und der kontrastierende Nachsatz bleiben klar erkennbar; die traditionelle biblische Wendung „Gott fürchten“ wird beibehalten.
