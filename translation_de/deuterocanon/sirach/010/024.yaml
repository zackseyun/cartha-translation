  text: A ruler[a], a governor, and a judge are honored, but none is greater than one who fears God.
translation:
  language: de
  text: Ein Anführer, ein Herrscher und ein Richter stehen in hohem Ansehen; doch keiner ist größer als einer, der Gott fürchtet.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
