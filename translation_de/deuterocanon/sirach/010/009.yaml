  text: Why does dust and ashes exalt itself[a], though in its life its body is lifted up?
translation:
  language: de
  text: Warum überhebt sich Staub und Asche, obwohl sein Leib zu Lebzeiten emporgehoben wird?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hebräische Schlusssatz ist schwer verständlich. Der griechische Paralleltext lautet: »Denn im Leben warf ich seine Eingeweide hinaus.« Damit betont er die leibliche Vergänglichkeit des Menschen. Auch der hebräische Text kann auf die Erniedrigung oder Hinfälligkeit des Leibes zielen.'
    reason: alternative_reading
lexical_decisions:
- source_word: מַה
  choice: Warum
  rationale: Die rhetorische Frage tadelt menschlichen Hochmut; »Warum« gibt diese Funktion im Deutschen natürlich wieder.
- source_word: יִּגְאֶה
  choice: überhebt sich
  rationale: Das Verb גאה bezeichnet stolzes Sich-Erheben. »Sich überheben« bewahrt sowohl die Kritik am Hochmut als auch das Bild der Erhöhung.
- source_word: עָפָר וָאֵפֶר
  choice: Staub und Asche
  rationale: Die feste biblische Wortverbindung bezeichnet die Hinfälligkeit und Sterblichkeit des Menschen.
- source_word: אֲשֶׁר
  choice: obwohl
  rationale: Der genaue Zusammenhang des schwierigen Schlusssatzes ist unsicher. Die konzessive Wiedergabe lässt den Gegensatz zwischen menschlichem Hochmut und leiblicher Hinfälligkeit hervortreten, ohne den Wortlaut weiter auszudeuten.
- source_word: בְּחַיָּיו
  choice: zu Lebzeiten
  rationale: Dies ist eine natürliche deutsche Wiedergabe der Zeitangabe und lässt offen, auf welche besondere Situation der Satz zielt.
- source_word: יוּרַם
  choice: emporgehoben wird
  rationale: Die Passivform von רום bedeutet »erhoben/hochgehoben werden«. »Emporgehoben« erhält das räumliche Bild und vermeidet eine vorschnelle Deutung.
- source_word: גִּוְיוֹ
  choice: sein Leib
  rationale: Das Substantiv kann Leib, Körper oder Leichnam bezeichnen. »Leib« bewahrt die Mehrdeutigkeit besser als das ausdrücklich auf den Tod bezogene »Leichnam«.
theological_decisions:
- issue: Vorrang des erhaltenen hebräischen Textes bei schwierigem Schlusssatz
  choice: Der erhaltene hebräische Wortlaut bleibt Grundlage der Übersetzung; die abweichende griechische Fassung wird in einer Fußnote genannt.
  alternative: 'Den griechischen Paralleltext als Haupttext wiedergeben: »Warum ist Erde und Asche überheblich? Denn noch im Leben werfe ich seine Eingeweide hinaus.«'
  rationale: Der hebräische Text ist vorhanden, sein letzter Satz jedoch schwer verständlich und weicht erheblich vom Griechischen ab. Die Hauptübersetzung darf diese Unsicherheit nicht durch eine eindeutige Deutung verdecken; der griechische Zeuge erhellt zugleich das Thema leiblicher Vergänglichkeit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die traditionelle Wendung »Staub und Asche« bleibt erhalten. »Überhebt sich« und »emporgehoben« bewahren das wiederkehrende Bild des Sich-Erhebens, während die Fußnote die erhebliche textliche Schwierigkeit offenlegt.
