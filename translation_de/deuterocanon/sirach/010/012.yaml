translation:
  language: de
  text: Der Anfang des Hochmuts eines Menschen ist Aufbegehren[a], und sein Herz wendet sich von seinem Schöpfer ab.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Parallele lautet: »Der Anfang des Hochmuts eines Menschen ist, dass er sich vom Herrn abwendet, und sein Herz hat sich von dem entfernt, der ihn gemacht hat.« Der hebräische Text ist im ersten Satzteil kürzer und wird hier als Haupttext wiedergegeben.'
    reason: alternative_reading
lexical_decisions:
- source_word: תְּחִלַת
  choice: Der Anfang
  rationale: Die Constructus-Form bedeutet schlicht »Anfang von«; die formelhafte Weisheitssprache bleibt so erhalten.
- source_word: גְּאוֹן
  choice: Hochmut
  rationale: Im negativen moralischen Zusammenhang bezeichnet das Wort menschliche Selbstüberhebung. »Hochmut« ist im Deutschen präziser und idiomatischer als das neutralere »Stolz«.
- source_word: אָדָם
  choice: menschlichen
  rationale: אָדָם ist hier generisch. Die adjektivische Wiedergabe drückt die allgemein menschliche Aussage natürlich aus, ohne sie auf Männer zu beschränken.
- source_word: מוּעָז
  choice: Aufbegehren
  rationale: Das schwierige hebräische Wort bezeichnet dreiste, trotzige Selbstbehauptung. »Aufbegehren« wahrt die Kürze und lässt die im zweiten Satzteil erkennbare Ausrichtung gegen Gott anklingen, ohne ein im Hebräischen nicht ausdrücklich genanntes Objekt einzufügen.
- source_word: וּמֵעֹשֶׂהוּ
  choice: von seinem Schöpfer
  rationale: Wörtlich »von dem, der ihn gemacht hat«. »Schöpfer« ist eine natürliche, würdevolle Bezeichnung für Gott und wird durch die griechische Parallele gestützt.
- source_word: יָסוּר לִבּוֹ
  choice: sein Herz wendet sich … ab
  rationale: סור bedeutet hier »sich abwenden/abweichen«. Die deutsche Formulierung bewahrt das Bild einer inneren Abkehr.
theological_decisions:
- issue: Soll das Ziel des Aufbegehrens nach der griechischen Parallele ausdrücklich als der Herr bezeichnet werden?
  choice: Die kürzere hebräische Lesart bleibt im Haupttext; erst der zweite Satzteil benennt die Abkehr vom Schöpfer.
  alternative: Der Anfang menschlichen Hochmuts ist, sich vom Herrn abzuwenden, und sein Herz hat sich von seinem Schöpfer entfernt.
  rationale: Der hebräische Hauptzeuge nennt im ersten Satzteil kein ausdrückliches Objekt. Die griechische Überlieferung verdeutlicht die theologische Richtung, soll aber den knapperen hebräischen Wortlaut nicht ersetzen.
translation_notes:
  register: Moderne, allgemein verständliche und zugleich würdevolle Weisheitssprache. Der parallele Satzbau wird bewahrt; »Aufbegehren« gibt den markanten, moralisch zugespitzten Ausdruck מוּעָז wieder.
