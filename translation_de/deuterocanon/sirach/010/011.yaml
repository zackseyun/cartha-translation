base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/010/011.yaml
  text: At a man's death[a], his inheritance is maggots and worms[b], gnats and creeping things.
translation:
  language: de
  text: Wenn ein Mensch stirbt, erbt er Maden und Würmer, Läuse[a] und kriechende Tiere.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort kann auch mit „Mücken“ oder allgemeiner mit „Ungeziefer“ wiedergegeben werden; welche kleinen Tiere genau gemeint sind, ist unsicher.
    reason: lexical_alternative
  - marker: b
    text: 'Die griechische Fassung lautet allgemeiner: „Er wird kriechende Tiere und wilde Tiere, Würmer erben.“ Sie weicht damit von der Tierliste des hebräischen Textes ab.'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּמוֹת
  choice: wenn … stirbt
  rationale: Die Präposition בְּ mit dem Infinitivus constructus bezeichnet hier den Zeitpunkt; die temporale Wiedergabe ist im Deutschen natürlich und bleibt eng am Hebräischen.
- source_word: אָדָם
  choice: ein Mensch
  rationale: Das maskuline Singularwort bezeichnet hier einen einzelnen Menschen in repräsentativ-allgemeinem Sinn. „Ein Mensch“ bewahrt Singular und Allgemeingültigkeit, ohne das Geschlecht stärker festzulegen als der Kontext.
- source_word: יִנְחַל
  choice: erbt er
  rationale: Das Verb bedeutet „erben“ bzw. „als Erbe erhalten“. Die knappe verbale Form erhält das Bild des Erbes und entspricht der hebräischen Satzführung.
- source_word: רִמָּה
  choice: Maden
  rationale: Das Wort bezeichnet besonders die mit Verwesung verbundenen Larven oder Würmer; „Maden“ passt zum Todeskontext und unterscheidet den Ausdruck vom folgenden תוֹלֵעָה.
- source_word: וְתוֹלֵעָה
  choice: und Würmer
  rationale: תּוֹלֵעָה bezeichnet gewöhnlich einen Wurm. Der eigene Ausdruck bleibt neben רִמָּה erkennbar.
- source_word: כִּנִּים
  choice: Läuse
  rationale: „Läuse“ ist eine naheliegende Wiedergabe für kleine parasitische Insekten; da die genaue Bestimmung unsicher ist, werden weitere Möglichkeiten in einer Fußnote genannt.
- source_word: וָרֶמֶשׂ
  choice: und kriechende Tiere
  rationale: רֶמֶשׂ ist eine Sammelbezeichnung für kleine Tiere, die sich kriechend oder krabbelnd fortbewegen. Die Formulierung wahrt die Breite des Begriffs.
theological_decisions:
- issue: Repräsentativer Singular in אָדָם
  choice: ein Mensch
  alternative: ein Mann; der Mensch
  rationale: Der Spruch gilt allgemein für einen Menschen, steht aber im Singular. Die gewählte Form bewahrt beides und vermeidet eine unnötige Beschränkung auf männliche Personen.
- issue: Hebräischer Text als Hauptzeuge bei abweichender griechischer Parallele
  choice: Die Tierliste wird nach dem erhaltenen Hebräisch übersetzt.
  alternative: 'Nach dem Griechischen: „kriechende Tiere und wilde Tiere, Würmer“'
  rationale: Der vorhandene hebräische Text ist die primäre Grundlage. Die griechische Parallele bestätigt den allgemeinen Sinn, bietet jedoch eine anders gefasste Tierliste; diese Abweichung wird in einer Fußnote sichtbar gemacht.
translation_notes:
  register: Knappe, sprichwortartige Syntax in modernem, würdigem Standarddeutsch. Das Erbmotiv und die abgestufte Liste niedriger, mit Tod und Verfall verbundener Tiere bleiben erhalten.
