  text: Arrogance and insolence are not fitting for a human being[a], much less for one born of a woman.
translation:
  language: de
  text: Hochmut und Unverschämtheit stehen einem Menschen nicht gut[a], noch viel weniger einem, der von einer Frau geboren ist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Parallelüberlieferung lautet: „Hochmut wurde für Menschen nicht geschaffen und auch kein Zornesausbruch für die von Frauen Geborenen.“ Der hebräische Text hat dagegen „Hochmut und Unverschämtheit … noch viel weniger einem, der von einer Frau geboren ist“.'
    reason: alternative_reading
lexical_decisions:
- source_word: לֹא נָאוֶה
  choice: stehen … nicht gut
  rationale: Die Wendung gibt die Bedeutung „nicht angemessen, nicht ziemend“ in natürlichem, würdigem Deutsch wieder; die abweichende griechische Aussage „wurde nicht geschaffen“ wird nicht in den hebräischen Haupttext eingetragen.
- source_word: לֶאֱנוֹשׁ
  choice: einem Menschen
  rationale: אֱנוֹשׁ bezeichnet hier den sterblichen Menschen allgemein. „Einem Menschen“ bewahrt den Singular und ist im Deutschen geschlechtsübergreifend verständlich.
- source_word: זָדוֹן
  choice: Hochmut
  rationale: Das Wort bezeichnet stolze, vermessene Selbstüberhebung. „Hochmut“ ist prägnant und im weisheitlichen Register geläufig.
- source_word: וְעַזוּת
  choice: und Unverschämtheit
  rationale: עַזוּת meint dreiste, schamlose Kühnheit. „Unverschämtheit“ unterscheidet die nach außen tretende Dreistigkeit vom inneren Hochmut.
- source_word: אַף
  choice: noch viel weniger
  rationale: Die Formulierung gibt die steigernde beziehungsweise klimaktische Kraft von אַף im Zusammenhang idiomatisch wieder.
- source_word: לִילוּד אִשָּׁה
  choice: einem, der von einer Frau geboren ist
  rationale: Die Übersetzung bewahrt das hebräische Bild für menschliche Herkunft, Begrenztheit und Sterblichkeit, ohne es erklärend aufzulösen.
theological_decisions:
- issue: Verhältnis des hebräischen Wortlauts zur griechischen Parallelüberlieferung
  choice: Der Haupttext folgt dem erhaltenen Hebräisch mit „stehen … nicht gut“ und „Unverschämtheit“.
  alternative: „Hochmut wurde für Menschen nicht geschaffen und auch kein Zornesausbruch für die von Frauen Geborenen.“
  rationale: Der hebräische Text ist hier erhalten und als zuverlässig eingestuft. Die deutlichen Abweichungen der griechischen Parallelüberlieferung beim Prädikat und beim zweiten Laster werden daher nicht harmonisiert, sondern in einer Fußnote kenntlich gemacht.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem weisheitlichem Ton. „Stehen … nicht gut“ ist idiomatisch, ohne die wertende Aussage abzuschwächen; die paarige Lasterbezeichnung und die Steigerung des hebräischen Satzes bleiben erhalten.
