translation:
  language: de
  text: Ein verständiger Sklave wird erhöht; ein törichter Sklave wird nicht klagen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Überlieferung weicht hier erheblich ab: „Verhalte dich bei deiner Arbeit nicht als Weiser und rühme dich nicht in der Zeit deiner Bedrängnis.“ Das letzte Verb des hebräischen Textes ist unsicher; es kann etwa „klagen“, „murren“ oder möglicherweise „einen Vorwand suchen“ bedeuten.'
    reason: textual_variant
lexical_decisions:
- source_word: עֶבֶד
  choice: Diener
  rationale: „Diener“ gibt den sozialen Abhängigkeitsstatus wieder, ohne im heutigen Deutschen unnötig auf eine bestimmte Form von Sklaverei festzulegen; „Sklave“ bleibt sachlich möglich.
- source_word: מַשְׂכּיל
  choice: verständig
  rationale: Das Partizip bezeichnet jemanden, der einsichtig, klug oder umsichtig handelt. „Verständig“ ist hier natürlich und bewahrt den praktischen Akzent.
- source_word: הוּרָם
  choice: wird erhöht
  rationale: Die passive Form von רום bezeichnet das Erhöht- oder Emporgehobenwerden. Das deutsche Präsens mit Zukunftsbezug eignet sich für den spruchhaften Satz.
- source_word: סָכָל
  choice: töricht
  rationale: „Töricht“ entspricht der moralisch-praktischen Unverständigkeit des hebräischen Ausdrucks und passt zum würdigen Weisheitsstil.
- source_word: לֹא יִתְאוֹנֵן
  choice: soll sich nicht beklagen
  rationale: Die Verbform ist unsicher; „sich beklagen“ gibt eine naheliegende Bedeutung wieder, ohne eine weitergehende Deutung in den Haupttext einzutragen.
theological_decisions:
- issue: Stark voneinander abweichende hebräische und griechische Textzeugen
  choice: Der Haupttext folgt dem ausdrücklich als hebräische Originalsprachquelle vorgelegten, mit hoher Sicherheit eingestuften Text.
  alternative: 'Die griechische Überlieferung lautet sinngemäß: „Spiele dich bei deiner Arbeit nicht als weise auf und rühme dich nicht in der Zeit deiner Bedrängnis.“'
  rationale: Die beiden Textformen lassen sich nicht sinnvoll miteinander verschmelzen. Da die hebräische Quelle hier vollständig und als hoch verlässlich ausgewiesen ist, wird sie direkt übersetzt; die erhebliche griechische Abweichung wird transparent in der Fußnote dokumentiert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper spruchhafter Satzform. Die Wiederholung von „Diener“ bildet die hebräische Parallelstruktur ab; das Semikolon wahrt die enge Gegenüberstellung.
