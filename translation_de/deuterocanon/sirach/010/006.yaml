translation:
  language: de
  text: Bei keinem Vergehen vergilt deinem Nächsten Böses[a], und geh nicht auf dem Weg des Hochmuts.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Fassung lautet sinngemäß: »Sei deinem Nächsten über irgendein Unrecht nicht zornig«; sie betont Zorn oder Groll statt der Vergeltung.'
