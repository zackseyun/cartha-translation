lexical_decisions:
- source_word: בְּכֵל פֶּשַׁע
  choice: Was für ein Vergehen auch geschehen ist
  rationale: 'Die hebräische Wendung bedeutet wörtlich »bei/für jedes Vergehen«. Im Zusammenhang des Verbots gibt die deutsche Formulierung den umfassenden Sinn wieder: Kein Vergehen rechtfertigt Vergeltung. Zugleich vermeidet sie die unnatürliche Wendung »für kein Vergehen«.'
- source_word: אַל תְּשַׁלֵּם רַע
  choice: Vergilt … nicht Böses
  rationale: Das Piel von שׁלם bezeichnet hier das Vergelten oder Zurückzahlen. »Böses vergelten« bewahrt den Gedanken einer schädigenden Gegenreaktion.
- source_word: לְרֵעַ
  choice: deinem Mitmenschen
  rationale: רֵעַ kann einen Nächsten, Gefährten oder Mitmenschen bezeichnen. »Mitmensch« ist im heutigen Standarddeutsch natürlich und vermeidet eine unnötige Einengung auf räumliche Nachbarschaft.
- source_word: וְאַל תִּהֲלַךְ
  choice: und geh nicht
  rationale: הלך bedeutet »gehen« und wird in der Weisheitsliteratur häufig bildlich für die Lebensführung gebraucht. Mit dem folgenden »Weg« bleibt dieses Bild im Deutschen erhalten.
- source_word: בְּדֶרֶךְ גַּאֲוָה
  choice: auf dem Weg des Hochmuts
  rationale: Die Verbindung aus דֶּרֶךְ und גַּאֲוָה bezeichnet eine von Stolz oder Überheblichkeit bestimmte Lebensweise. »Hochmut« trägt die deutliche moralische Wertung und bewahrt die Wegmetapher.
theological_decisions:
- issue: Abweichung zwischen der hebräischen und der griechischen Fassung im ersten Verbot
  choice: 'Im Haupttext der hebräischen Aufforderung folgen: Böses nicht vergelten.'
  alternative: 'Nach der griechischen Fassung: Wegen keines Unrechts gegen den Nächsten Zorn oder Groll hegen.'
  rationale: Der erhaltene, als zuverlässig bewertete hebräische Text verbietet vergeltendes Handeln; die griechische Parallele hebt dagegen Zorn beziehungsweise anhaltenden Groll hervor. Da hier ein sicherer hebräischer Zeuge vorliegt, bestimmt er den Haupttext. Die sachlich verwandte, aber nicht identische griechische Lesart wird in einer Fußnote offengelegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die einleitende Formulierung macht den umfassenden Geltungsbereich des Verbots idiomatisch deutlich; »Weg des Hochmuts« bewahrt das weisheitliche Lebensweg-Bild.
