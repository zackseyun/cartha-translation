  text: He swept them from the earth and uprooted them[a], and he made their memory cease from the earth.
translation:
  language: de
  text: Er fegte sie von der Erde hinweg[a] und riss sie aus; er ließ die Erinnerung an sie von der Erde verschwinden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das erste hebräische Verb ist schwierig. Die griechische Parallelüberlieferung stützt den Sinn einer vollständigen Beseitigung. Möglich ist auch: „Er tilgte sie von der Erde und riss sie aus.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסִחָם
  choice: Er fegte sie … hinweg
  rationale: Die seltene beziehungsweise schwierige hebräische Form bezeichnet im Zusammenhang eine gewaltsame Beseitigung. Die griechische Parallelüberlieferung stützt diesen Sinn; „hinwegfegen“ bewahrt die Bildkraft, ohne die unsichere Wortbedeutung zu eng festzulegen.
- source_word: מֵאֶרֶץ
  choice: von der Erde
  rationale: אֶרֶץ kann „Land“ oder „Erde“ bedeuten. Die Wiederholung in beiden Vershälften und das griechische γῆ sprechen hier für den umfassenderen Ausdruck „Erde“.
- source_word: וַיִּתְּשֵׁם
  choice: und riss sie aus
  rationale: Das Verb נתשׁ bezeichnet gewöhnlich ein Heraus- oder Ausreißen, oft von Pflanzen. „Riss sie aus“ erhält das Bild vollständiger Entfernung und klingt im Deutschen natürlicher als eine zusätzliche Wiederholung von „entwurzeln“ nach „hinwegfegen“.
- source_word: וַיַּשְׁבֵּת
  choice: er ließ … verschwinden
  rationale: Der Hifil von שׁבת bedeutet „aufhören lassen“ oder „ein Ende bereiten“. In Verbindung mit „Erinnerung“ gibt „verschwinden lassen“ den verursachenden Sinn idiomatisch wieder.
- source_word: זִכְרָם
  choice: die Erinnerung an sie
  rationale: זֵכֶר kann Erinnerung, Andenken oder Gedächtnis bezeichnen. „Die Erinnerung an sie“ ist modernes, verständliches Deutsch und bezeichnet hier ihr fortbestehendes Angedenken.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der poetische Parallelismus und die zweimalige Wendung „von der Erde“ bleiben erhalten; das schwierige erste Verb wird bildhaft, aber mit einer Fußnote zur Unsicherheit wiedergegeben.
