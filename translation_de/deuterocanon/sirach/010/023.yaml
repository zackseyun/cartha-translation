base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/010/023.yaml
  text: One should not despise an intelligent poor man[a], nor honor a wrongdoer who has been exalted.
translation:
  language: de
  text: Einen verständigen Armen soll man nicht verachten und einen Übeltäter, der zu Ansehen erhoben worden ist, nicht ehren.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Überlieferung liest hier deutlich anders: „Ein Großer, ein Richter und ein Machthaber werden geehrt werden; doch keiner von ihnen ist größer als der, der den Herrn fürchtet.“ Der hebräische Text, dem die Übersetzung folgt, enthält dagegen eine Mahnung, einen armen, aber verständigen Menschen nicht zu verachten und einen zu Ansehen erhobenen Übeltäter nicht zu ehren.'
    reason: textual_variant
lexical_decisions:
- source_word: אֵין לִבְזוֹת
  choice: soll man nicht verachten
  rationale: Die Verbindung aus אֵין und Infinitiv drückt hier sprichwörtlich aus, was nicht getan werden soll. Die deutsche Formulierung bewahrt diesen weisheitlichen, allgemein gültigen Ton.
- source_word: דַּל
  choice: einen Armen
  rationale: דַּל bezeichnet einen armen, schwachen oder sozial niedrig gestellten Menschen. Die substantivierte Form ist im Deutschen natürlich und wahrt den singularischen, sprichwörtlichen Ausdruck.
- source_word: מַשְׁכִּיל
  choice: verständigen
  rationale: Das Partizip bezeichnet einen Menschen mit Einsicht und Urteilsvermögen. „Verständig“ bildet diesen Sinn natürlicher und umfassender ab als das stärker auf geistige Leistungsfähigkeit bezogene „intelligent“.
- source_word: לְכַבֵּד
  choice: ehren
  rationale: כבד im Piel bedeutet, jemandem Ehre oder gesellschaftliches Gewicht zu geben. „Ehren“ ist die direkte und idiomatische deutsche Entsprechung.
- source_word: עַוָּל
  choice: Übeltäter
  rationale: עַוָּל bezeichnet einen Menschen, der durch Unrecht oder verkehrtes Handeln gekennzeichnet ist. „Übeltäter“ ist verständlich und lässt den moralischen Umfang des hebräischen Ausdrucks offen.
- source_word: אֲשֶׁר הוּרָם
  choice: der zu hohem Ansehen gelangt ist
  rationale: Die passive Form bezeichnet einen, der erhöht beziehungsweise gesellschaftlich emporgehoben wurde. Die Wiedergabe macht den Statusbezug im Deutschen deutlich, ohne die Erhöhung theologisch umzudeuten.
theological_decisions:
- issue: Hebräischer Text gegenüber der stark abweichenden griechischen Überlieferung
  choice: Der Haupttext folgt der erhaltenen hebräischen Mahnung über den verständigen Armen und den angesehenen Übeltäter.
  alternative: 'Die griechische Überlieferung lautet sinngemäß: „Ein Großer, ein Richter und ein Machthaber werden geehrt werden; doch keiner von ihnen ist größer als der, der den Herrn fürchtet.“'
  rationale: Da ein hoch bewerteter hebräischer Textzeuge vorliegt, wird dieser unmittelbar übersetzt. Die erhebliche Abweichung der griechischen Tradition darf jedoch nicht stillschweigend beseitigt werden und wird deshalb in einer Fußnote vollständig kenntlich gemacht.
translation_notes:
  register: Moderne, würdige Standardsprache mit sprichwörtlichem Satzbau. „Verständig“ betont Einsicht und Urteilsvermögen; „zu hohem Ansehen gelangt“ verdeutlicht die gesellschaftliche Erhöhung, ohne einen göttlichen Urheber vorauszusetzen.
