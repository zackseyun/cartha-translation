    issue: Die passive Form von אֲשֶׁר הוּרָם wird nicht vollständig gewahrt.
    rationale: „Der zu hohem Ansehen gelangt ist“ formuliert aktiv-intransitiv und ergänzt „hohem“. Der hebräische Ausdruck bedeutet wörtlich, dass der Betreffende erhoben worden ist. Eine passive deutsche Form erhält sowohl die grammatische Perspektive als auch die offenbleibende Frage, wer ihn erhoben hat.
