  text: Who will declare righteous the one who condemns himself[a], and who will honor the one who dishonors himself?
translation:
  language: de
  text: Wer sich selbst schuldig spricht – wer wird ihn für gerecht erklären? Und wer wird den ehren, der sich selbst geringschätzt?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Überlieferung lautet: „Ein Armer wird wegen seiner Erkenntnis geehrt, und ein Reicher wird wegen seines Reichtums geehrt.“ Der hebräische und der griechische Text bewahren hier wesentlich verschiedene Sprüche.'
    reason: alternative_reading
lexical_decisions:
- source_word: מַרְשִׁיעַ
  choice: schuldig spricht
  rationale: Das Hifil von רשע hat forensische Färbung und bedeutet hier, jemanden für schuldig zu erklären. Mit dem reflexiv verstandenen נַפְשׁוֹ ergibt sich im Deutschen natürlich „sich selbst schuldig sprechen“.
- source_word: נַפְשׁוֹ
  choice: sich selbst
  rationale: נפש kann Seele, Leben oder die eigene Person bezeichnen. In beiden Satzhälften ist die reflexive Wiedergabe natürlich und vermeidet eine unnötige Verengung auf die „Seele“ als besonderen Bestandteil des Menschen.
- source_word: יַצְדִיקֶנּוּ
  choice: ihn für gerecht erklären
  rationale: Das Hifil von צדק bezeichnet forensisch das Gerechtsprechen. Die Formulierung bewahrt diesen Sinn deutlicher als das im Deutschen theologisch stark aufgeladene „rechtfertigen“.
- source_word: יְכַבֵּד
  choice: ehren
  rationale: Das Piel von כבד bedeutet gewöhnlich „ehren“ und bezeichnet hier die öffentliche oder zwischenmenschliche Wertschätzung.
- source_word: מַקְלֶה
  choice: geringschätzt
  rationale: Die Form von קלל bezeichnet ein Leichtnehmen, Herabsetzen oder Verachten. „Sich selbst geringschätzen“ ist verständliches modernes Deutsch und bewahrt den Gegensatz zu dem Ehren durch andere, ohne den Ausdruck unnötig zu verschärfen.
theological_decisions:
- issue: Starke Abweichung zwischen hebräischer und griechischer Überlieferung
  choice: Der Haupttext folgt dem erhaltenen hebräischen Spruch; die wesentlich andere griechische Fassung wird in einer Fußnote vollständig wiedergegeben.
  alternative: 'Griechisch: „Ein Armer wird wegen seiner Erkenntnis geehrt, und ein Reicher wird wegen seines Reichtums geehrt.“'
  rationale: Da ein belastbarer hebräischer Text vorliegt, bildet er die Grundlage der Übersetzung. Die griechische Überlieferung enthält hier jedoch keinen bloßen Wortlautunterschied, sondern einen anderen Spruch. Diese Spannung darf weder harmonisiert noch verschwiegen werden.
- issue: Bedeutung von נַפְשׁוֹ
  choice: Reflexiv als „sich selbst“ wiedergeben.
  alternative: „seine Seele“
  rationale: Der Kontext spricht vom Verhalten eines Menschen gegenüber der eigenen Person und dem daraus folgenden Urteil anderer. „Seine Seele“ könnte im heutigen Deutsch eine nicht zwingend im Hebräischen angelegte anthropologische oder geistliche Unterscheidung nahelegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die beiden rhetorischen Fragen und der parallele Aufbau des hebräischen Weisheitsspruchs bleiben erhalten. „Für gerecht erklären“ und „schuldig sprechen“ bewahren die gerichtliche Bildsprache; „geringschätzt“ bildet einen natürlichen Gegensatz zu „ehren“.
