  naturalness: „In Gottes Hand liegt die Herrschaft über die Welt“ und „zur rechten Zeit“ sind natürliches, würdiges modernes Standarddeutsch. „Einen Mann über sie einsetzen“ ist im Deutschen klarer und idiomatischer als „den rechten Mann über sie stellen“, ohne den Sinn der Einsetzung in eine Herrschaftsstellung zu verändern.
  terminology: „Gott“, „Herrschaft“ und „Welt“ entsprechen dem hebräischen Wortlaut und Register. „Mann“ wahrt den maskulinen Singular von אִישׁ, ohne die nicht im Ausgangstext stehende Wertung „recht/geeignet“ einzutragen. In der Fußnote ist „Antlitz“ für προσώπον im gehobenen biblischen Register treffender als „Gesicht“.
