  text: In the hand of God is the rule of the world[a], and in due time he will raise up over it the right man.
translation:
  language: de
  text: In Gottes Hand liegt die Herrschaft über die Welt[a], und zur rechten Zeit setzt er einen Mann über sie ein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Griechisch: „In der Hand des Herrn liegt der Erfolg eines Mannes, und auf das Antlitz eines Schreibers wird er seine Herrlichkeit legen.“ Die griechische Überlieferung weicht hier erheblich vom erhaltenen hebräischen Text ab.'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּיַד אֱלֹהִים
  choice: In Gottes Hand liegt
  rationale: Die deutsche Wendung bewahrt das hebräische Bild der Hand als Ausdruck von Macht und Verfügungsgewalt; „liegt“ ergibt einen natürlichen deutschen Satz.
- source_word: מֶמְשֶׁלֶת תֵּבֵל
  choice: die Herrschaft über die Welt
  rationale: מֶמְשֶׁלֶת bezeichnet Herrschaft beziehungsweise Regierungsgewalt, תֵּבֵל die bewohnte Welt. Diese Wiedergabe ist präzise und idiomatisch.
- source_word: וְאִישׁ
  choice: den rechten Mann
  rationale: אִישׁ ist maskuliner Singular und bezeichnet hier im Zusammenhang einen einzelnen Herrscher. „Rechten“ erschließt aus לְעֵת und dem Einsetzungskontext die Angemessenheit der von Gott bestimmten Person, ohne den männlichen Bezug aufzugeben.
- source_word: לְעֵת
  choice: zur rechten Zeit
  rationale: Die Wendung bezeichnet den passenden oder bestimmten Zeitpunkt; „zur rechten Zeit“ ist gegenwärtiges, würdiges Deutsch.
- source_word: יַעֲמוֹד עָלֶיהָ
  choice: stellt er ... über sie
  rationale: Das Hebräische bedeutet wörtlich, jemanden über etwas stehen zu lassen beziehungsweise einzusetzen. „Über sie stellen“ bewahrt das Bild und bezeichnet verständlich die Einsetzung in Herrschaft.
theological_decisions:
- issue: Deutlich voneinander abweichende hebräische und griechische Überlieferung
  choice: Der Haupttext folgt dem erhaltenen hebräischen Text.
  alternative: „In der Hand des Herrn liegt der Erfolg eines Mannes, und auf das Gesicht des Schriftgelehrten wird er seine Herrlichkeit legen.“
  rationale: Da für diesen Vers ein hoch bewerteter hebräischer Text vorliegt, ist er die primäre Grundlage. Die erheblich abweichende griechische Überlieferung wird vollständig in der Fußnote dokumentiert.
- issue: Geschlechtsspezifische Wiedergabe von אִישׁ
  choice: Mann
  alternative: Mensch; Person
  rationale: Der maskuline Singular bezieht sich wahrscheinlich auf einen einzelnen eingesetzten Herrscher und nicht allgemein auf Menschen; deshalb bleibt der männliche Bezug erhalten.
- issue: Bezug des Pronomens in עָלֶיהָ
  choice: „über sie“ bezieht sich auf „die Welt“
  alternative: 'Wiederholung: „über die Welt“'
  rationale: Das feminine hebräische Suffix nimmt תֵּבֵל auf. Im Deutschen ist „Welt“ ebenfalls feminin, sodass der pronominale Bezug bewahrt werden kann.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Handmetapher und das Herrschaftsbild des Hebräischen bleiben erhalten; schwerfällige Wörtlichkeit wird vermieden. Der Fußnotenmarker [a] steht unmittelbar bei der Aussage, zu der die abweichende griechische Fassung gehört.
