revisions:
- from: In Gottes Hand liegt die Herrschaft über die Welt[a], und zur rechten Zeit stellt er den rechten Mann über sie.
  to: In Gottes Hand liegt die Herrschaft über die Welt[a], und zur rechten Zeit setzt er einen Mann über sie ein.
  rationale: Die Revision entfernt allein die nicht im hebräischen Text belegte Deutung „rechter“ bei „Mann“. Die zeitliche Angemessenheit bleibt mit „zur rechten Zeit“ erhalten. „Einsetzen“ gibt die kontextuelle Bedeutung von יַעֲמוֹד עָלֶיהָ als Bestellung eines Mannes über die Welt klar wieder. Die Fußnote bewahrt die abweichende griechische Fassung und wird sprachlich präzisiert.
