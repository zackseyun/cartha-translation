base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/010/030.yaml
  text: There is a poor man who is honored because of his insight[a], and there is one who is honored because of his wealth.
translation:
  language: de
  text: Es gibt einen Armen, der wegen seiner Einsicht geehrt wird, und es gibt einen, der wegen seines Reichtums geehrt wird.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Parallelüberlieferung lautet: „Wer aber in Armut geehrt wird – um wie viel mehr im Reichtum? Und wer im Reichtum ungeehrt ist – um wie viel mehr in Armut?“ Der hebräische und der griechische Text unterscheiden sich hier erheblich.'
    reason: alternative_reading
lexical_decisions:
- source_word: דַּל
  choice: einen Armen
  rationale: Das substantivisch gebrauchte Adjektiv bezeichnet einen armen oder sozial schwachen Menschen. Der maskuline Singular des Hebräischen bleibt erhalten, ohne zusätzliche Bedeutungsanteile einzutragen.
- source_word: נִכְבָּד
  choice: geehrt wird
  rationale: Die Nifal-Form von כבד bezeichnet hier das Geehrt- oder Angesehensein. „Geehrt wird“ bewahrt den sozialen Bezug und passt in beiden parallelen Satzteilen.
- source_word: בִּגְלַל
  choice: wegen
  rationale: Die Präposition bezeichnet Grund oder Ursache. „Wegen“ ist knapp, idiomatisch und bildet die Wiederholung des hebräischen Satzes natürlich ab.
- source_word: שִׂכְלוֹ
  choice: seiner Einsicht
  rationale: שכל kann Einsicht, Verständnis oder kluge Urteilskraft bezeichnen. „Einsicht“ ist verständlich und lässt die genaue Spannweite offen, ohne den umfassenderen Begriff „Weisheit“ einzutragen.
- source_word: עָשְׁרוֹ
  choice: seines Reichtums
  rationale: Das Substantiv bezeichnet materiellen Reichtum oder Besitz. „Reichtum“ gibt den sozialen Kontrast zur Armut direkt wieder.
- source_word: יֵשׁ ... וְיֵשׁ
  choice: Es gibt ... und es gibt ...
  rationale: Die wiederholte Existenzkonstruktion stellt zwei Fälle parallel nebeneinander. Die deutsche Fassung erhält diese aphoristische Struktur.
theological_decisions:
- issue: Hebräischer Haupttext und stark abweichende griechische Parallelüberlieferung
  choice: 'Der erhaltene hebräische Text bildet den Haupttext: Zwei geehrte Menschen werden gegenübergestellt, einer aufgrund seiner Einsicht und einer aufgrund seines Reichtums.'
  alternative: Die griechische Überlieferung bietet rhetorische Steigerungsfragen über einen in Armut Geehrten und einen im Reichtum Ungeehrten.
  rationale: Da ein verständlicher hebräischer Text mit hoher Quellenkonfidenz vorliegt, wird er übersetzt. Die erhebliche Abweichung der griechischen Textform wird jedoch nicht harmonisiert, sondern vollständig in einer Fußnote dokumentiert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer, sprichwortartiger Parallelstruktur. Die Formulierung folgt dem erhaltenen Hebräisch eng, bleibt aber idiomatisch. Der Fußnotenmarker steht am Versende, da die Anmerkung die gesamte abweichende griechische Textform betrifft.
