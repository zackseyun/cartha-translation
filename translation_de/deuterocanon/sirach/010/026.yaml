  text: Do not act too wisely to serve your own desire[a], and do not honor yourself in the time of your need.
translation:
  language: de
  text: Gib dich nicht klug, um deinem eigenen Verlangen zu dienen,[a] und verschaffe dir zur Zeit deiner Not kein Ansehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Überlieferung lautet hier deutlich anders: „Besser einer, der in allem arbeitet, als einer, der großspurig umhergeht und kein Brot hat.“ Der in der Kairoer Geniza erhaltene hebräische Text warnt dagegen vor selbstbezogener Klugheit und davor, sich in einer Notlage Ansehen zu verschaffen.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תּתְחַכַּם
  choice: Halte dich nicht für besonders klug
  rationale: Das Hitpael von חכם bezeichnet hier ein Sich-klug-Geben oder den Anspruch auf besondere Klugheit. Die Formulierung bewahrt den reflexiven Zug und die Warnung vor selbstbezogener Klugheit, ohne eine konkrete List ausdrücklich in den Text hineinzulesen.
- source_word: לַעֲבוֹד
  choice: um … zu dienen
  rationale: Der Infinitiv von עבד bedeutet gewöhnlich „dienen“ oder „arbeiten“. „Dienen“ lässt das eigene Verlangen pointiert als den Herrn erscheinen, dem man sich unterordnet.
- source_word: חֶפְצֶךָ
  choice: deinem eigenen Verlangen
  rationale: חפץ kann Wunsch, Verlangen, Gefallen oder Willen bezeichnen. „Eigenes Verlangen“ gibt den selbstbezogenen Sinn im Zusammenhang klar wieder.
- source_word: וְאַל תִּתְכַּבֵּד
  choice: und verschaffe dir kein Ansehen
  rationale: Das Hitpael von כבד kann bedeuten, sich selbst Gewicht oder Ehre zu geben. „Sich Ansehen verschaffen“ ist im modernen Deutschen natürlich und bewahrt den Gedanken eigenmächtiger Selbsterhöhung.
- source_word: בְּמוֹעֵד
  choice: wenn
  rationale: מוֹעֵד bezeichnet einen Zeitpunkt oder eine bestimmte Zeit. Im Deutschen gibt ein temporaler Nebensatz den Zusammenhang natürlicher wieder als die wörtlichere Wendung „zur Zeit“.
- source_word: צָרְכֶּךָ
  choice: du in Not bist
  rationale: צֹרֶךְ bezeichnet Bedarf, Mangel oder Not. Die griechische Parallele mit dem Mangel an Brot stützt hier den konkreten Sinn materieller Bedürftigkeit.
theological_decisions:
- issue: Starke Abweichung zwischen dem erhaltenen hebräischen Text und der griechischen Überlieferung
  choice: Der Haupttext folgt dem erhaltenen Hebräisch; das Griechische hilft lediglich, צָרְכֶּךָ als konkrete Not beziehungsweise Bedürftigkeit zu verstehen.
  alternative: „Besser einer, der in allem arbeitet, als einer, der großspurig umhergeht und kein Brot hat.“
  rationale: Wo der hebräische Sirachtext erhalten ist, hat er für die Übersetzung Vorrang. Da die griechische Fassung den Vers jedoch grundlegend anders wiedergibt, darf die Abweichung nicht stillschweigend harmonisiert werden; sie wird vollständig in einer Fußnote dokumentiert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die beiden Imperative bleiben parallel aufgebaut. „Besonders klug“ vermeidet das heute missverständliche „allzu weise“, während „sich Ansehen verschaffen“ die reflexive Selbsterhöhung idiomatisch ausdrückt.
