  text: Kingship passes from nation to nation because of violence and arrogance[a].
translation:
  language: de
  text: Die Königsherrschaft geht von einem Volk auf ein anderes über – wegen Gewalt und Hochmut.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Überlieferung lautet: „Die Königsherrschaft geht von einem Volk auf ein anderes über wegen Ungerechtigkeit, Übergriffen und Geld.“'
    reason: textual_variant
lexical_decisions:
- source_word: מַלְכוּת
  choice: Königsherrschaft
  rationale: Das hebräische Wort bezeichnet hier primär königliche Herrschaft beziehungsweise politische Herrschaftsmacht, nicht bloß ein geografisches Königreich. „Königsherrschaft“ wahrt diesen abstrakten Sinn.
- source_word: מִגּוֹי אֶל גּוֹי
  choice: von einem Volk auf ein anderes
  rationale: גוי bezeichnet hier ein politisch verstandenes Volk. Die deutsche Wendung gibt den Übergang der Herrschaft natürlich und präzise wieder.
- source_word: תִּסֹּב
  choice: geht … über
  rationale: Das Verb hat die Grundvorstellung des Sichwendens oder Wechselns und bezeichnet hier den Übergang politischer Herrschaft. „geht … über“ ist idiomatisches, modernes Deutsch, ohne den Ausdruck unnötig auszudeuten.
- source_word: בִּגְלַל
  choice: wegen
  rationale: Die Präposition kennzeichnet den Grund oder die Ursache; „wegen“ ist knapp und unmittelbar verständlich.
- source_word: חֲמַס
  choice: Gewalt
  rationale: חמס bezeichnet häufig Gewalt oder gewaltsames Unrecht. Da der zuverlässige hebräische Text die Grundlage bildet, wird der konkretere hebräische Ausdruck gegenüber dem griechischen ἀδικία („Ungerechtigkeit“) beibehalten.
- source_word: גַּאֲוָה
  choice: Hochmut
  rationale: Das Wort bezeichnet Stolz, Überheblichkeit oder Hochmut als moralisches Fehlverhalten. „Hochmut“ ist im würdigen biblischen Register geläufig und für heutige Leser verständlich.
theological_decisions:
- issue: Abweichende Aufzählung der Ursachen im hebräischen und griechischen Text
  choice: Im Haupttext stehen nach dem zuverlässigen hebräischen Zeugnis die beiden Ursachen „Gewalt und Hochmut“.
  alternative: Die griechische Überlieferung nennt „Ungerechtigkeit, Übergriffe und Geld“.
  rationale: Wo ein gut bezeugter hebräischer Text erhalten ist, bildet er die Übersetzungsgrundlage. Die deutlich abweichende griechische Lesart wird nicht harmonisiert, sondern als wichtige Textvariante in der Fußnote bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Königsherrschaft“ hält den abstrakten politischen Sinn fest; der Gedankenstrich bildet die knappe, spruchhafte Begründung des Hebräischen ab.
