  text: Among all these I sought a resting place[b][a], and in whose inheritance shall I lodge?
translation:
  language: de
  text: Unter all diesen suchte ich eine Ruhestätte[a], und in wessen Erbteil werde ich einkehren?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Ruhe«; das griechische Wort kann Ruhe oder Erholung bezeichnen, meint hier im Zusammenhang mit dem Einkehren aber wahrscheinlich einen Ort der Ruhe.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »übernachten« beziehungsweise »lagern«; das griechische Verb kann das Einkehren zur Nacht oder das Aufschlagen eines Lagers bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ τούτων πάντων
  choice: Unter ihnen allen
  rationale: μετά mit dem Genitiv kann hier die Zugehörigkeit zu einer Gruppe ausdrücken. Die Wiedergabe bezeichnet die Gesamtheit, innerhalb derer die personifizierte Weisheit nach einem Ort sucht, ohne die Wendung zeitlich als »nach all dem« festzulegen.
- source_word: ἀνάπαυσιν
  choice: eine Ruhestätte
  rationale: Das Substantiv bezeichnet Ruhe oder Erholung. Im Zusammenhang mit der anschließenden Frage nach dem Einkehren bringt »Ruhestätte« den naheliegenden räumlichen Sinn natürlich zum Ausdruck; die abstraktere Möglichkeit »Ruhe« bleibt in der Fußnote erhalten.
- source_word: ἐζήτησα
  choice: suchte ich
  rationale: Eine unmittelbare und idiomatische Wiedergabe des Aorists von ζητέω.
- source_word: κληρονομίᾳ
  choice: Erbteil
  rationale: κληρονομία kann ein Erbe oder einen als Besitz zugeteilten Anteil bezeichnen. »Erbteil« bewahrt sowohl den Gedanken des Erbes als auch den biblischen Anklang an zugeteilten Besitz.
- source_word: τίνος
  choice: wessen
  rationale: Der Genitiv des Interrogativpronomens fragt nach der Person oder Größe, der das Erbteil zugehört; »wessen« ist dafür die knappe und natürliche deutsche Form.
- source_word: αὐλισθήσομαι
  choice: werde ich einkehren
  rationale: Das Verb kann das Übernachten, Beherbergtwerden oder Lagern bezeichnen. »Einkehren« fügt sich natürlich in die Suche nach einer Ruhestätte ein, ohne die militärisch wirkende Vorstellung eines Lagers festzuschreiben; die konkreteren Bedeutungen werden in der Fußnote genannt.
theological_decisions:
- issue: Die Suche der personifizierten Weisheit nach einem Ort der Niederlassung
  choice: Die Weisheit sucht eine Ruhestätte und fragt offen, in wessen Erbteil sie einkehren wird.
  alternative: Das Erbteil bereits im Vers ausdrücklich mit Israel gleichsetzen oder die Aussage ausschließlich als abstrakte Suche nach Aufnahme unter den Völkern deuten.
  rationale: Der griechische Text nennt den Besitzer des Erbteils an dieser Stelle noch nicht. Die offene Frage bewahrt die literarische und theologische Spannung, die erst der folgende Zusammenhang näher bestimmt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Ruhestätte« und »Erbteil« bewahren den biblischen Klang, bleiben aber allgemein verständlich. Die Satzform folgt der Parallelität des Griechischen, ohne die noch offene Identität des Erbteils vorwegzunehmen.
