  text: Before the age[a], from the beginning, he created me[c][b], and for all ages I will never cease.
translation:
  language: de
  text: Vor aller Zeit, von Anfang an, erschuf er mich, und bis in alle Ewigkeit werde ich niemals aufhören.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: „Vor dem Zeitalter, von Anfang an, erschuf er mich, und bis zum Zeitalter werde ich keinesfalls aufhören.“ Das griechische αἰών kann je nach Zusammenhang ein Zeitalter oder eine unbegrenzte Dauer bezeichnen; die Verneinung ist nachdrücklich.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸ τοῦ αἰῶνος
  choice: Vor aller Zeit
  rationale: Die Wendung bezeichnet hier die Zeit vor der geschichtlichen Weltordnung. „Vor aller Zeit“ gibt den zeitlichen Sinn natürlich wieder, ohne αἰών vorschnell ausschließlich als abstrakte „Ewigkeit“ festzulegen.
- source_word: ἀπʼ ἀρχῆς
  choice: von Anfang an
  rationale: Diese geläufige deutsche Wendung bewahrt die Aussage eines ursprünglichen zeitlichen Ausgangspunkts.
- source_word: ἔκτισέν με
  choice: erschuf er mich
  rationale: κτίζω bedeutet gewöhnlich „erschaffen“ oder „gründen“. „Erschuf“ ist hier die unmittelbarste Wiedergabe und erhält die theologische Spannung der personifiziert redenden Weisheit.
- source_word: ἕως αἰῶνος
  choice: bis in Ewigkeit
  rationale: In dieser Verbindung bezeichnet αἰών eine unbegrenzte Dauer. Die deutsche Wendung ist würdig, verständlich und lässt sich natürlich mit der folgenden emphatischen Verneinung verbinden.
- source_word: οὐ μὴ ἐκλίπω
  choice: werde ich niemals aufhören
  rationale: οὐ μή verneint nachdrücklich; ἐκλείπω bezeichnet in diesem Zusammenhang das Aufhören oder Zu-Ende-Gehen, nicht das Scheitern bei einer Aufgabe.
theological_decisions:
- issue: Ob die Ursprungsaussage über die Weisheit abgeschwächt werden soll, um die Vorstellung ihrer Geschöpflichkeit zu vermeiden
  choice: „erschuf er mich“ im Haupttext beibehalten
  alternative: „gründete er mich“ oder „brachte er mich hervor“
  rationale: Der griechische Text verwendet ἔκτισεν. Die Übersetzung sollte diese klare Wortwahl und ihre Spannung bei der personifizierten Weisheit nicht aufgrund späterer Lehrdebatten abschwächen.
- issue: Ob αἰών an beiden Stellen identisch wiedergegeben werden muss
  choice: Kontextgerechte Wiedergabe als „aller Zeit“ beziehungsweise „Ewigkeit“
  alternative: An beiden Stellen „Zeitalter“
  rationale: Die wiederholte griechische Vokabel bleibt semantisch mehrdeutig, doch die beiden Präpositionalwendungen setzen unterschiedliche zeitliche Blickrichtungen. Eine mechanisch gleiche deutsche Wiedergabe wäre unnatürlich und könnte fälschlich begrenzte Epochen nahelegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung folgt weitgehend dem griechischen Aufbau; „aller Zeit“ und „bis in Ewigkeit“ vermeiden zugleich eine hölzerne Wiedergabe von αἰών. Der einzige Fußnotenmarker [a] steht ordnungsgemäß im Haupttext.
