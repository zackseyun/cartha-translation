  source_fidelity: Die beiden Baumbezeichnungen und die Ortsangaben sind zutreffend wiedergegeben. »wuchs ich hoch« verschiebt jedoch das aoristische Passiv ἀνυψώθην zu einem aktiven natürlichen Wachstum und gibt damit die im Griechischen ausgedrückte Erhöhung nicht ausreichend wieder. Außerdem entspricht »in den Bergen« der Präposition ἐν genauer als »auf den Bergen«.
  naturalness: Die Fassung ist klar und poetisch. »wurde ich im Libanon hoch erhoben« ist zwar etwas gehobener, aber in diesem poetischen Selbstlob natürlich und angemessen; die Ellipse im zweiten Vergleich bewahrt den Parallelismus.
  terminology: »Zeder«, »Zypresse«, »Libanon« und »Hermon« sind etablierte moderne deutsche Formen. Die Normalisierung von Ἀερμών zu »Hermon« ist sinnvoll; eine knappe Anmerkung dokumentiert sie.
