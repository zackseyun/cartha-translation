base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/024/013.yaml
  text: Like a cedar I was raised high in Lebanon[a], and like a cypress in the mountains of Hermon.
translation:
  language: de
  text: Wie eine Zeder wurde ich im Libanon hoch erhoben, und wie eine Zypresse in den Bergen des Hermon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Griechisch Ἀερμών; dies entspricht dem Ortsnamen, der gewöhnlich als »Hermon« wiedergegeben wird.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς
  choice: wie
  rationale: Leitet jeweils einen Vergleich ein und entspricht natürlich dem poetischen Bild.
- source_word: κέδρος
  choice: Zeder
  rationale: Die übliche und sachlich passende Wiedergabe des genannten Baumes; sie bewahrt zugleich die traditionelle Verbindung mit dem Libanon.
- source_word: ἀνυψώθην
  choice: wuchs ich hoch
  rationale: Der Aorist Passiv bezeichnet ein Emporgehoben- oder Hochwerden. Im unmittelbaren Baumbild gibt »wuchs ich hoch« die erreichte Höhe natürlich wieder, ohne die stärker theologisch oder rangbezogen klingende Deutung »wurde ich erhöht« aufzudrängen.
- source_word: ἐν τῷ Λιβάνῳ
  choice: auf dem Libanon
  rationale: Bei dem als Gebirge verstandenen geografischen Namen ist »auf dem Libanon« im Deutschen idiomatisch und wahrt den Ortsbezug.
- source_word: κυπάρισσος
  choice: Zypresse
  rationale: Dies ist die reguläre deutsche Entsprechung von κυπάρισσος und gegenüber älteren Alternativen wie »Tanne« oder »Kiefer« lexikalisch vorzuziehen.
- source_word: ἐν ὄρεσιν Ἀερμών
  choice: auf den Bergen des Hermon
  rationale: Der Plural ὄρεσιν wird ausdrücklich als »Bergen« wiedergegeben; Ἀερμών wird mit der im Deutschen üblichen Namensform »Hermon« normalisiert.
theological_decisions:
- issue: Ob ἀνυψώθην ausdrücklich als ehrenvolle oder theologische Erhöhung wiederzugeben ist
  choice: wuchs ich hoch
  alternative: wurde ich erhöht
  rationale: Die personifizierte Weisheit beschreibt sich hier in Baumvergleichen. Die gewählte Formulierung erhält das Höhen- und Wachstumsbild, ohne dem Verb über den Kontext hinaus eine Rang- oder Statusaussage aufzuerlegen; die passive Nuance des griechischen Verbs tritt dabei im idiomatischen Deutschen zurück.
translation_notes:
  register: Poetisch, würdig und zugleich gegenwärtig verständlich. Die parallele Satzform mit zweimaligem »wie« bleibt erhalten; die geografischen Angaben werden in natürlichem Standarddeutsch formuliert.
