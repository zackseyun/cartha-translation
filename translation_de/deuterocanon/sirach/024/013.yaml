revisions:
- from: Wie eine Zeder wuchs ich hoch auf dem Libanon, und wie eine Zypresse auf den Bergen des Hermon.
  to: Wie eine Zeder wurde ich im Libanon hoch erhoben, und wie eine Zypresse in den Bergen des Hermon.[a]
