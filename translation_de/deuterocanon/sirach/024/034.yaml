  yaml_path: translation/deuterocanon/sirach/024/034.yaml
  text: See that I have not labored for myself alone[a], but for all who seek her.
translation:
  language: de
  text: 'Seht: Ich habe mich nicht für mich allein abgemüht, sondern für alle, die sie suchen.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἴδετε
  choice: Seht
  rationale: Der Imperativ Plural richtet einen nachdrücklichen Aufruf an die Hörenden, die folgende Aussage wahrzunehmen und anzuerkennen.
- source_word: οὐκ ἐμοὶ μόνῳ
  choice: nicht für mich allein
  rationale: Der Dativ bezeichnet hier den, dem die Mühe zugutekommt; die Formulierung wahrt zugleich die Betonung durch μόνῳ.
- source_word: ἐκοπίασα
  choice: ich habe mich abgemüht
  rationale: κοπιάω bezeichnet anstrengende Arbeit oder Mühe. Das deutsche Perfekt gibt die abgeschlossene Arbeit mit ihrer fortdauernden Bedeutung im vorliegenden Zusammenhang natürlich wieder.
- source_word: ἀλλὰ πᾶσι
  choice: sondern für alle
  rationale: Die Wendung bildet den deutlichen Gegensatz zu »nicht für mich allein« und lässt die folgende Partizipialgruppe den Personenkreis bestimmen.
- source_word: τοῖς ἐκζητοῦσιν
  choice: die … suchen
  rationale: Die schlichte Wiedergabe »suchen« passt zum Weisheitswortschatz und vermeidet eine unnötige Verstärkung, obwohl das Verb auch ein eifriges Suchen bezeichnen kann.
- source_word: αὐτήν
  choice: sie
  rationale: Das feminine Pronomen verweist im Kontext auf die als Frau personifizierte Weisheit und bewahrt diese literarische Gestaltung.
theological_decisions:
- issue: Bezug und Geschlecht von αὐτήν im Weisheitsdiskurs
  choice: »sie« als Rückverweis auf die personifizierte Weisheit
  alternative: »die Weisheit« ausdrücklich wiederholen oder abstrakt »danach« formulieren
  rationale: Sirach 24 stellt die Weisheit durchgehend als weibliche Sprecherin dar. Das Pronomen bewahrt sowohl den Rückverweis als auch die Personifikation, ohne zusätzliche theologische Festlegungen einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Sich abmühen« vermittelt die Anstrengung von κοπιάω verständlich und ohne altertümlichen Klang; der Doppelpunkt nach »Seht« macht die auffordernde Einleitung klar.
