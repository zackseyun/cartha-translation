  source_fidelity: Die Übersetzung gibt τὸ γὰρ μνημόσυνόν μου mit „Denn die Erinnerung an mich“ treffend wieder. Die Vergleichskonstruktionen ὑπὲρ … γλυκύ sind idiomatisch und vollständig als „ist süßer als“ wiedergegeben. „Mein Erbe“ entspricht κληρονομία μου direkt und wahrt dessen semantische Offenheit. „Wabenhonig“ gibt μέλιτος κηροῦ natürlich und bildgerecht wieder, ohne den Sinn einzuengen.
  naturalness: Modernes, würdevolles Standarddeutsch. Die Wiederholung von „ist süßer als“ im zweiten Satzglied sorgt für Klarheit und erhält den poetischen Parallelismus. „Wabenhonig“ ist eine etablierte, gut verständliche Bezeichnung.
  terminology: „Erinnerung“, „Erbe“ und „Wabenhonig“ sind sachgerecht. Die erste Person bleibt als Stimme der personifizierten Weisheit erhalten, ohne eine weitergehende theologische Deutung vorwegzunehmen. Die Fußnoten bieten legitime lexikalische Alternativen; ihre Anker stehen an den jeweils erläuterten Ausdrücken.
