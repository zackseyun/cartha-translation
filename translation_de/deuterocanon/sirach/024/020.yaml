base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/024/020.yaml
  text: For the memory of me is sweeter than honey[c][b][a], and my inheritance is sweeter than the honeycomb.
translation:
  language: de
  text: Denn die Erinnerung an mich[a] ist süßer als Honig, und mein Erbe ist süßer als Wabenhonig.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Gedenken an mich“ oder „mein Erinnerungszeichen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „Honig aus der Wabe“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μνημόσυνόν μου
  choice: die Erinnerung an mich
  rationale: μνημόσυνον kann Erinnerung, Gedenken oder Erinnerungszeichen bezeichnen. Im personifizierten Ich-Wort der Weisheit ist „die Erinnerung an mich“ natürlich und hält den persönlichen Bezug ausdrücklich fest.
- source_word: ὑπὲρ … γλυκύ
  choice: süßer als
  rationale: Obwohl γλυκύ formal im Positiv steht, bildet ὑπέρ hier einen Vergleich. Im Deutschen wird dieser Sinn idiomatisch durch den Komparativ ausgedrückt.
- source_word: κληρονομία μου
  choice: mein Erbe
  rationale: κληρονομία bezeichnet ein Erbe oder Erbteil. „Mein Erbe“ ist knapp und bewahrt die mögliche Mehrdeutigkeit zwischen dem, was der Weisheit gehört, und dem, was von ihr weitergegeben wird.
- source_word: μέλιτος κηροῦ
  choice: Wabenhonig
  rationale: Die Wendung bezeichnet Honig aus der Wabe. „Wabenhonig“ bewahrt sowohl das Honigmotiv als auch den Bezug zur Wabe in natürlichem Deutsch.
theological_decisions:
- issue: Bezug der ersten Person
  choice: 'Die Weisheit spricht weiterhin personifiziert von sich selbst: „an mich“ und „mein Erbe“.'
  alternative: Die Aussage abstrakt auf das Andenken oder Vermächtnis der Weisheit beziehen und die Personifizierung abschwächen.
  rationale: Im Zusammenhang von Sirach 24 stellt sich die Weisheit in der ersten Person vor. Die Übersetzung behält diese Stimme bei, ohne ihre theologische Identität näher festzulegen.
- issue: Bedeutung von „mein Erbe“
  choice: Die Mehrdeutigkeit von κληρονομία wird mit „mein Erbe“ bewahrt.
  alternative: 'Deutend formulieren: „was ich als Erbe schenke“ oder „mein Vermächtnis“.'
  rationale: Der griechische Text legt nicht eindeutig fest, ob das Erbe Besitz der Weisheit, ihr hinterlassenes Vermächtnis oder eine von ihr gewährte Gabe ist. Eine explizite Auflösung wäre interpretierend.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallele Wiederholung „ist süßer“ macht den im zweiten Satzglied ausgelassenen, aber mitgemeinten Vergleich im Deutschen klar. „Wabenhonig“ erhält das poetische Bild knapp und verständlich.
