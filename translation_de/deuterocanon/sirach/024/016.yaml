  yaml_path: translation/deuterocanon/sirach/024/016.yaml
  text: Like a terebinth I spread out my branches[d][c][b][a], and my branches are branches of glory and grace.
translation:
  language: de
  text: Wie eine Terebinthe breitete ich meine Zweige aus, und meine Zweige sind Zweige der Herrlichkeit und Anmut.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort für „Anmut“ kann auch „Gnade“ oder „Gunst“ bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: τερέβινθος
  choice: Terebinthe
  rationale: Der griechische Text nennt diesen Baum ausdrücklich. „Terebinthe“ bewahrt das konkrete botanische Bild genauer als das allgemeinere „Eiche“.
- source_word: ἐξέτεινα
  choice: breitete … aus
  rationale: Das Verb bezeichnet ein Ausstrecken oder Ausdehnen; bei Zweigen ist „ausbreiten“ im heutigen Deutsch natürlich und bildkräftig.
- source_word: κλάδους / κλάδοι
  choice: Zweige
  rationale: „Zweige“ ist eine klare, geläufige Wiedergabe und ermöglicht es, die betonte Wiederholung des griechischen Wortes beizubehalten.
- source_word: δόξης
  choice: Herrlichkeit
  rationale: „Herrlichkeit“ erhält den gehobenen biblischen Bedeutungsumfang von δόξα; „Pracht“ würde den Sinn stärker auf äußeren Glanz verengen.
- source_word: χάριτος
  choice: Anmut
  rationale: Im poetischen Bild von Zweigen bezeichnet χάρις plausibel anziehende Schönheit und Wohlgefälligkeit. „Anmut“ ist hier idiomatischer als das theologisch stärker festgelegte „Gnade“, ohne die positive Würde des Ausdrucks zu verlieren.
theological_decisions:
- issue: Poetische Selbstdarstellung der Weisheit durch die Zweigmetapher
  choice: Die Metapher und die Wiederholung von „Zweige“ werden unmittelbar bewahrt.
  alternative: „Meine herrlichen und anmutigen Zweige“
  rationale: Der griechische Text wiederholt κλάδοι und spricht wörtlich von „Zweigen der Herrlichkeit und der χάρις“. Die Wiederholung trägt die poetische Betonung und sollte nicht in bloße Adjektive aufgelöst werden.
- issue: Bedeutungsbreite von χάρις
  choice: Im Haupttext „Anmut“, mit „Gnade“ und „Gunst“ als Fußnotenalternativen.
  alternative: „Gnade“ oder „Gunst“ im Haupttext
  rationale: Der Kontext ist eine poetische Baummetapher. „Anmut“ ergibt darin ein natürliches deutsches Bild, während die Fußnote die echte lexikalische und mögliche theologische Bedeutungsbreite offenhält.
translation_notes:
  register: Poetisch-gehobenes, aber gegenwärtiges Standarddeutsch. Die vorangestellte Vergleichsform folgt der griechischen Wortstellung und dem anaphorischen Stil des Abschnitts; die Wiederholung von „Zweige“ bleibt bewusst erhalten.
