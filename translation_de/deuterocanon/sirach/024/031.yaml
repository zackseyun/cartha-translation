  text: I said[a], ‘I will water my garden, and I will drench my garden bed.’ And behold, my channel became a river[c][b], and my river became a sea.
translation:
  language: de
  text: 'Ich sagte: »Ich will meinen Garten bewässern und mein Gartenbeet durchtränken.« Und siehe, mein Bewässerungsgraben[a] wurde zu einem Fluss, und mein Fluss wurde zu einem Meer.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Bewässerungskanal«; gemeint ist ein künstlich angelegter Wasserlauf.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ποτιῶ
  choice: ich will … bewässern
  rationale: Das Futur bezeichnet im Gartenbild das Zuführen von Wasser; »bewässern« ist im Deutschen natürlich und sachlich passend.
- source_word: κῆπον
  choice: meinen Garten
  rationale: κῆπος bezeichnet hier allgemein einen kultivierten Garten; die possessive griechische Konstruktion wird idiomatisch mit »mein« wiedergegeben.
- source_word: μεθύσω
  choice: ich will … durchtränken
  rationale: Das Verb hat wörtlich die Vorstellung des Berauschens beziehungsweise reichlichen Sättigens. Im Bewässerungsbild gibt »durchtränken« die intensive Wasserzufuhr anschaulich wieder, ohne eine alkoholische Bedeutung nahezulegen.
- source_word: πρασιάν
  choice: mein Gartenbeet
  rationale: πρασιά bezeichnet ein bepflanztes, kultiviertes Beet oder Gartenstück. »Gartenbeet« wahrt den landwirtschaftlichen Charakter, ohne die Bedeutung auf Blumen einzuengen.
- source_word: ἰδοὺ
  choice: und siehe
  rationale: Die hervorgehobene Wendung bewahrt den plötzlichen, staunenden Übergang der griechischen Darstellung und passt zum würdevollen Register.
- source_word: διῶρυξ
  choice: Bewässerungsgraben
  rationale: Das Wort bezeichnet einen gegrabenen Wasserlauf oder Kanal. »Bewässerungsgraben« macht seine Funktion im Gartenbild deutlich und lässt den Größenanstieg zum Fluss hervortreten.
- source_word: ποταμόν
  choice: Fluss
  rationale: Dies ist die gewöhnliche Bedeutung und trägt die Steigerung vom kleinen künstlichen Wasserlauf zum großen natürlichen Gewässer.
- source_word: θάλασσαν
  choice: Meer
  rationale: Die Standardbedeutung wahrt den Höhepunkt der Bildfolge; der unbestimmte Ausdruck »zu einem Meer« entspricht dem anarthrischen Griechisch.
theological_decisions:
- issue: Bildhafte Ausweitung von Weisheit beziehungsweise Lehre aus einem kleinen Bewässerungsgraben zu überströmender Fülle
  choice: Das konkrete Garten- und Wasserbild bleibt im Haupttext ohne ausdrückliche allegorische Deutung stehen.
  alternative: Das Wachstum ausdrücklich als Ausbreitung der Weisheit, der Schriftlehre oder ihrer Wirkung auf die Völker deuten.
  rationale: Der Vers entfaltet das Bild, erklärt seine einzelnen Elemente aber nicht ausdrücklich. Eine offene Wiedergabe bewahrt die theologische Spannung und vermeidet eine konfessionell oder exegetisch verengende Auslegung.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdevoll-biblischem Klang. »Und siehe« bewahrt die rhetorische Erhöhung; die übrige Wortwahl bleibt konkret und gegenwärtig. Die parallele Satzstruktur und die Steigerung Bewässerungsgraben–Fluss–Meer folgen eng dem Griechischen.
