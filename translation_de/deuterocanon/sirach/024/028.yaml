  source_fidelity: Der Entwurf gibt die beiden aoristischen Verben, die offene Gegenüberstellung »der Erste/der Letzte« und das feminine Personalpronomen grundsätzlich zutreffend wieder. Die Wendung »kam nicht damit zu Ende, sie zu erkennen« bildet den Abschlussaspekt von συνετέλεσεν ab, ist jedoch im Deutschen unnötig schwerfällig. »nicht vollständig erkennen« bringt denselben Aspekt klar und idiomatisch zum Ausdruck. »ergründen« ist für ἐξιχνιάζω angemessen.
  naturalness: '»Der Erste erkannte sie nicht vollständig« ist modernes, würdiges Standarddeutsch und deutlich flüssiger als »kam nicht damit zu Ende, sie zu erkennen«. Die bisherige Fußnote ist nicht idiomatisch: Man »spürt« eine Person bzw. Sache nicht »bis zum Grund auf«.'
  terminology: Die feminine Bezugnahme auf die personifizierte Weisheit ist beizubehalten. »Der Erste« und »der Letzte« bleiben absichtlich unbestimmt. »Ergründen« und alternativ »bis zum Grund erforschen« bewahren die untersuchende, erschöpfende Nuance von ἐξιχνιάζω.
