  yaml_path: translation/deuterocanon/sirach/024/028.yaml
  text: The first did not finish knowing her[c][b][a], and likewise the last did not trace her out.
translation:
  language: de
  text: Der Erste erkannte sie nicht vollständig,[a] und ebenso ergründete der Letzte sie nicht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Der Erste gelangte nicht dazu, sie ganz zu erkennen, und ebenso erforschte der Letzte sie nicht bis zum Grund.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ συνετέλεσεν
  choice: kam nicht damit zu Ende
  rationale: Gibt den Abschlussgedanken von συντελέω natürlich wieder und bewahrt zugleich die Aussage, dass die Erkenntnis der Weisheit nicht vollendet wurde.
- source_word: ὁ πρῶτος
  choice: der Erste
  rationale: Die substantivische Form bleibt bewusst offen und steht im Gegensatz zu »der Letzte«, ohne den Bezug näher festzulegen.
- source_word: γνῶναι
  choice: sie zu erkennen
  rationale: γινώσκω bezeichnet hier das Erkennen bzw. Kennen der personifizierten Weisheit; »erkennen« passt zum Weisheitskontext besser als »entdecken«.
- source_word: αὐτήν
  choice: sie
  rationale: Das feminine Pronomen verweist im Kontext auf die als Frau personifizierte Weisheit und wird daher nicht versachlicht.
- source_word: καὶ οὕτως
  choice: und ebenso
  rationale: οὕτως stellt hier eine entsprechende, parallele Aussage her; »ebenso« vermeidet eine unbegründete Folgerungsbeziehung.
- source_word: ὁ ἔσχατος
  choice: der Letzte
  rationale: Bewahrt die knappe, offene Gegenüberstellung mit »der Erste« und legt keine bestimmte endzeitliche Person fest.
- source_word: οὐκ ἐξιχνίασεν
  choice: ergründete ... nicht
  rationale: ἐξιχνιάζω meint ein Nachspüren bis zum Grund. »Ergründen« ist im Deutschen idiomatisch und bewahrt den Gedanken erfolgloser vollständiger Erforschung.
theological_decisions:
- issue: Bezug und Geschlecht der personifizierten Weisheit
  choice: Das feminine Pronomen »sie« wird beibehalten.
  alternative: Die Weisheit sachlich mit »es« wiedergeben.
  rationale: Sirach 24 lässt die Weisheit als weiblich personifizierte Sprecherin auftreten. Das feminine Pronomen entspricht dem griechischen Text und seiner literarischen Theologie, ohne spätere dogmatische Identifikationen einzutragen.
- issue: Bezug von »der Erste« und »der Letzte«
  choice: Die Ausdrücke bleiben ohne nähere Identifizierung.
  alternative: »Der Erste« ausdrücklich als ersten Menschen und »der Letzte« als spätesten Menschen oder endzeitliche Gestalt deuten.
  rationale: Der griechische Wortlaut lässt den Bezug offen. Die Übersetzung bewahrt die zeitliche beziehungsweise generationenbezogene Spannung, ohne sie dogmatisch festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die leicht ungewöhnliche Wendung »kam nicht damit zu Ende, sie zu erkennen« bewahrt den Abschlussaspekt des griechischen συνετέλεσεν, während »ergründete« die bildhafte Untersuchung von ἐξιχνίασεν idiomatisch wiedergibt.
