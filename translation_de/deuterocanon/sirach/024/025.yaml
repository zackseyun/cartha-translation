  yaml_path: translation/deuterocanon/sirach/024/025.yaml
  text: It fills with wisdom like the Pishon[d][c][b][a], and like the Tigris in the days of firstfruits.
translation:
  language: de
  text: Er lässt Weisheit strömen wie der Pischon und wie der Tigris in den Tagen der neuen Früchte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „in den Tagen des Neuen“ bzw. „der neuen Dinge“. Gemeint sein können neue Früchte, der neue Ertrag oder neues Wachstum; die griechische Wendung ist knapp und mehrdeutig.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ πιπλῶν
  choice: Er lässt … strömen
  rationale: Das substantivierte maskuline Partizip bezeichnet den Handelnden und hat hier aktiven Sinn. Im Bild der wasserreichen Flüsse gibt „lässt … strömen“ die Fülle natürlich wieder, ohne das im Deutschen missverständliche „füllt mit“ zu erzwingen.
- source_word: ὡς Φισὼν
  choice: wie der Pischon
  rationale: Der biblische Flussname wird in modernem Standarddeutsch gewöhnlich mit Artikel gebraucht.
- source_word: σοφίαν
  choice: Weisheit
  rationale: Dies ist die übliche und kontextuell zentrale Wiedergabe von σοφία. Die Großschreibung ist im Deutschen grammatisch erforderlich und entscheidet nicht zusätzlich über den Grad der Personifikation.
- source_word: ὡς Τίγρις
  choice: wie der Tigris
  rationale: Übliche deutsche Form des Flussnamens mit bestimmtem Artikel.
- source_word: ἐν ἡμέραις νέων
  choice: in den Tagen der neuen Früchte
  rationale: Das substantivierte νέων bleibt im Griechischen hinsichtlich der ergänzten Sache offen. „Neue Früchte“ passt zum jahreszeitlichen Anschwellen des Tigris, ohne die kultisch engere Bedeutung „Erstlingsfrüchte“ festzulegen.
theological_decisions:
- issue: Bild von der personifizierten Weisheit
  choice: „Weisheit“ ohne zusätzliche personifizierende Kennzeichnung
  alternative: „die Weisheit“ als ausdrücklich personifizierte Gestalt hervorheben
  rationale: Der griechische Text verwendet σοφίαν, legt aber durch diesen Vers allein keine weitergehende ontologische Deutung fest. Die deutsche Übersetzung bewahrt daher das Weisheitsmotiv, ohne die Spannung dogmatisch aufzulösen.
- issue: Subjekt des maskulinen Partizips ὁ πιπλῶν
  choice: mit dem Pronomen „Er“ wiedergegeben
  alternative: unpersönliches „Es“ oder ein ergänztes Substantiv
  rationale: Der maskuline Artikel ὁ spricht gegen ein neutrales „Es“. Ein nicht ausdrücklich im Vers stehendes Bezugswort wird dennoch nicht ergänzt.
translation_notes:
  register: Natürliche, würdige Standardsprache. Das Flussbild wird dynamisch wiedergegeben; die schwierige Ellipse bei νέων bleibt durch eine Fußnote transparent. Der Vers ist im Griechischen syntaktisch an seinen Kontext gebunden, weshalb „Er“ den maskulinen Anschluss wahrt.
