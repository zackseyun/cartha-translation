  rationale: Die Änderung von „Weiterhin“ zu „Noch“ verbessert die idiomatische Wiedergabe von ἔτι, ohne dessen offene Nuance von Fortsetzung bzw. Wiederholung einzuengen. Die Schlussformulierung wird syntaktisch klarer und natürlich, während sie die auf fortdauernde Generationen bezogene Aussage von εἰς γενεὰς αἰώνων wiedergibt. Die Fußnotenverankerung und die alternative Deutung von ὡς bleiben erhalten.
