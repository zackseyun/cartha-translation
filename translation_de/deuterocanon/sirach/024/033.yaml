  source_fidelity: Der Entwurf gibt die beiden Futurformen, das Bild von ἐκχέω und den Bezug von αὐτήν auf διδασκαλία sachgerecht wieder. „Weiterhin“ verschiebt ἔτι jedoch leicht zu einer fortlaufenden Handlung; „Noch“ gibt die hier gemeinte weitere bzw. erneute Aussage knapper und idiomatischer wieder. „den Generationen für immer“ ist im Deutschen zudem syntaktisch und semantisch weniger klar als eine Formulierung, die die Dauer der Überlieferung ausdrückt.
  naturalness: „Noch werde ich …“ ist modernes, würdiges Standarddeutsch. „für alle kommenden Generationen hinterlassen“ klingt natürlich und macht deutlich, dass die Unterweisung dauerhaft für die Folgegenerationen bewahrt wird.
  terminology: „Unterweisung“ ist für διδασκαλία im Weisheitskontext gut gewählt. „Prophezeiung“ ist verständlich und wahrt die Vergleichsaussage von ὡς προφητείαν. Die Fußnote bewahrt die mögliche Wiedergabe mit „als“, ohne die grammatische Mehrdeutigkeit dogmatisch aufzulösen.
