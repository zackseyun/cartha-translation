    rationale: Die Formulierung lässt offen, ob „für immer“ die Generationen oder das Hinterlassen bestimmt, und klingt im Deutschen unnatürlich. Der griechische Ausdruck bezeichnet die bleibende Weitergabe an künftige Generationen.
