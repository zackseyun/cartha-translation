  text: Still I will pour out instruction like prophecy[c][b][a], and I will leave it for everlasting generations.
translation:
  language: de
  text: Noch werde ich Unterweisung wie eine Prophezeiung ausgießen[a] und sie für alle kommenden Generationen hinterlassen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „als Prophetie“. Das griechische ὡς kann hier sowohl vergleichend („wie“) als auch bestimmend („als“) verstanden werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἔτι
  choice: Weiterhin
  rationale: Das Adverb bezeichnet hier eine Fortsetzung beziehungsweise ein weiteres Tun. „Weiterhin“ ist im Deutschen natürlich und vermeidet die mögliche zeitliche Missdeutung von „noch“.
- source_word: διδασκαλίαν
  choice: Unterweisung
  rationale: „Unterweisung“ entspricht dem Weisheitsliteratur-Kontext und gibt den Vorgang beziehungsweise Inhalt des Lehrens wieder, ohne den stärker systematischen Klang von „Lehre“.
- source_word: ὡς προφητείαν
  choice: wie eine Prophezeiung
  rationale: Die vergleichende Wiedergabe wahrt das Bild, ohne die Unterweisung eindeutig mit Prophetie gleichzusetzen. Der unbestimmte Artikel ist im Deutschen idiomatisch.
- source_word: ἐκχέω
  choice: werde ich … ausgießen
  rationale: Die Zukunftsform passt zum folgenden καταλείψω; „ausgießen“ bewahrt das Bild einer reichen, weithin verbreiteten Mitteilung.
- source_word: καταλείψω
  choice: werde … hinterlassen
  rationale: „Hinterlassen“ erfasst sowohl das Zurücklassen als auch den Gedanken eines bleibenden Vermächtnisses für spätere Generationen.
- source_word: αὐτήν
  choice: sie
  rationale: Das feminine Pronomen verweist auf die feminine „Unterweisung“.
- source_word: εἰς γενεὰς αἰώνων
  choice: den Generationen für immer
  rationale: Die Formulierung gibt die auf unbegrenzte Folgegenerationen zielende Dauer des griechischen Ausdrucks in verständlichem, würdigem Deutsch wieder.
theological_decisions:
- issue: Bedeutung von ὡς προφητείαν
  choice: 'vergleichend: Die Unterweisung wird wie eine Prophezeiung ausgegossen'
  alternative: 'identifizierend: Die Unterweisung wird als Prophetie ausgegossen'
  rationale: ὡς lässt sowohl einen Vergleich als auch eine Bestimmung zu. Der Haupttext hält den Vergleich ausdrücklich fest; die Fußnote bewahrt die stärkere mögliche Lesart, ohne die Spannung aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Bildsprache des Ausgießens und Hinterlassens bleibt erhalten; technische oder konfessionell geprägte Terminologie wird vermieden.
