lexical_decisions:
- source_word: ἐκλίπητε
  choice: lasst nicht nach
  rationale: Das Verb kann »ausbleiben«, »aufhören«, »nachlassen« oder »ermatten« bedeuten. Im Deutschen gibt »lasst nicht nach« die Mahnung natürlich wieder, ohne die genaue Art des Kraftverlusts festzulegen.
- source_word: ἰσχύϊ
  choice: in eurer Kraft
  rationale: ἰσχύς bezeichnet Kraft, Stärke oder Vermögen. Die Wendung bewahrt die Präpositionalfügung des Griechischen und bleibt verständlich.
- source_word: κολλᾶσθε
  choice: haltet euch an
  rationale: Das Verb bezeichnet ein enges Sich-Anschließen oder Festhalten. »Haltet euch an« ist gegenwärtiges, würdevolles Deutsch und erhält den Gedanken bewusster, enger Bindung.
- source_word: αὐτῷ
  choice: ihn
  rationale: Das Dativpronomen kann seiner Form nach maskulin oder neutrum sein. Im Zusammenhang ist der persönliche Bezug auf den Herrn plausibel; die echte Mehrdeutigkeit wird in der Fußnote kenntlich gemacht.
- source_word: κραταιωθῆτε
  choice: damit ihr gestärkt werdet
  rationale: Die passive Konjunktivform bezeichnet den beabsichtigten oder folgenden Zustand. »Gestärkt werdet« wahrt sowohl das Passiv als auch den Zwecksinn von ἵνα.
theological_decisions:
- issue: Bezug von αὐτῷ in der zusätzlichen Mahnzeile
  choice: ihn
  alternative: es
  rationale: Der persönliche Bezug auf den Herrn passt zur mahnenden Aussage, doch die griechische Form entscheidet grammatisch nicht zwischen Maskulinum und Neutrum. Daher wird die Alternative ausdrücklich in einer Fußnote bewahrt.
- issue: Textstatus von Sirach 24,24
  choice: Die Zeile wird als Vers 24 im Haupttext beibehalten und mit einer textkritischen Fußnote versehen.
  alternative: Die Zeile aus dem Haupttext auslassen.
  rationale: Die vorgelegte griechische Ausgabe enthält die Zeile, während sie nur in einem Teil der Textüberlieferung belegt ist. Haupttext plus Fußnote bildet sowohl die Quellenlage als auch die vorgegebene Kapitelzählung transparent ab.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, unmittelbar verständlichem Mahnstil. Die parallelen Imperative und das passive Ergebnis werden bewahrt; die ungeklärte Pronominalreferenz und der besondere Textstatus werden nicht stillschweigend eingeebnet.
