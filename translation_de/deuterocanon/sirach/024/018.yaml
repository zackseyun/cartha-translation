  text: I am the mother of beautiful love[a], and of fear, and of knowledge, and of holy hope[b];
translation:
  language: de
  text: Ich bin die Mutter der schönen Liebe[a], der Furcht[b], der Erkenntnis und der heiligen Hoffnung.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der guten Liebe“ oder „der edlen Liebe“; das griechische Wort kann sowohl sittliche als auch ästhetische Güte bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „der Ehrfurcht“; in der Weisheitsliteratur bezeichnet das griechische Wort häufig ehrfürchtige Furcht, besonders gegenüber Gott.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μήτηρ
  choice: Mutter
  rationale: Die wörtliche Wiedergabe bewahrt das anschauliche familiäre Bild der personifizierten Weisheit.
- source_word: καλῆς ἀγάπης
  choice: der schönen Liebe
  rationale: καλός kann ästhetische und sittliche Güte bezeichnen. „Schöne Liebe“ bewahrt diese Bedeutungsweite besser als eine rein moralische Festlegung.
- source_word: φόβου
  choice: der Furcht
  rationale: φόβος bedeutet unmittelbar „Furcht“. Im Kontext der Weisheitsliteratur kann Ehrfurcht mitschwingen, ohne dass der griechische Ausdruck darauf beschränkt ist.
- source_word: γνώσεως
  choice: der Erkenntnis
  rationale: „Erkenntnis“ gibt γνῶσις in biblisch-weisheitlicher Sprache präzise und zugleich natürlich wieder.
- source_word: ἁγίας ἐλπίδος
  choice: der heiligen Hoffnung
  rationale: Die Wiedergabe entspricht beiden griechischen Wörtern unmittelbar und bewahrt ihren religiösen Klang.
theological_decisions:
- issue: Bedeutung von φόβου im Weisheitskontext
  choice: Furcht
  alternative: Ehrfurcht
  rationale: „Furcht“ erhält die mögliche Spannung zwischen Angst, achtungsvollem Respekt und Gottesfurcht. „Ehrfurcht“ wäre kontextuell möglich, würde die Bedeutung jedoch deutlicher festlegen als der griechische Wortlaut.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Reihung der Genitive bewahrt die poetische Selbstaussage der personifizierten Weisheit; die Konjunktionen werden im Deutschen idiomatisch gebündelt.
