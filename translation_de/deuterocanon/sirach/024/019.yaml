  yaml_path: translation/deuterocanon/sirach/024/019.yaml
  text: Come to me[a], you who desire me[b], and be filled with my fruits.
translation:
  language: de
  text: Kommt zu mir, ihr, die ihr nach mir verlangt,[a] und sättigt euch an meinen Früchten.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihr, die ihr mich begehrt“. Das griechische Partizip drückt ein starkes Verlangen aus.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „meinen Erzeugnissen“ oder „meinem Ertrag“. Das griechische Wort bezeichnet das Hervorgebrachte; „Früchte“ bewahrt das Pflanzenbild des Zusammenhangs.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προέλθετέ πρὸς μέ
  choice: Kommt zu mir
  rationale: Die Aufforderung lädt dazu ein, sich der personifizierten Weisheit zuzuwenden. „Kommt zu mir“ ist im Deutschen natürlich und gibt die gerichtete Bewegung knapp wieder.
- source_word: οἱ ἐπιθυμοῦντές μου
  choice: ihr, die ihr nach mir verlangt
  rationale: Das Partizip bezeichnet ein starkes Begehren oder Sehnen. „Nach mir verlangt“ bewahrt diese Intensität und klingt im poetischen Zusammenhang würdig und verständlich.
- source_word: ἀπὸ τῶν γενημάτων μου
  choice: an meinen Früchten
  rationale: γένημα bezeichnet etwas Hervorgebrachtes, besonders Frucht oder Ertrag. „Früchte“ erhält das Pflanzenbild des Zusammenhangs; die Verbindung mit „an“ entspricht idiomatischem Deutsch bei „sich sättigen“.
- source_word: ἐμπλήσθητε
  choice: sättigt euch
  rationale: Die griechische Passivform bedeutet wörtlich „werdet erfüllt“. Im Zusammenhang mit Früchten gibt „sättigt euch“ die Aufforderung natürlich wieder, ohne die bildhafte Aussage als Lehre oder geistlichen Nutzen auszudeuten.
theological_decisions:
- issue: Einladung der personifizierten Weisheit
  choice: Die Weisheit spricht weiterhin in der ersten Person und bietet ihre „Früchte“ an.
  alternative: Die Früchte im Haupttext ausdrücklich als Lehren, Gaben oder Segnungen der Weisheit erklären.
  rationale: Der griechische Text lässt die Metapher unausgelegt. Die Übersetzung bewahrt daher die Personifikation und ihre theologische Offenheit.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit poetisch-würdigem Ton. Die direkte Einladung und das Bild der Früchte bleiben erhalten; die etwas unidiomatische wörtliche Form „werdet erfüllt von“ wird sinngemäß und bildgerecht als „sättigt euch an“ wiedergegeben.
