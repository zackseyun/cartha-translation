review_pass:
  verdict: approve
  source_fidelity: „Kommt zu mir“ gibt προέλθετε πρὸς μέ treffend als einladende Aufforderung zur Annäherung wieder. „ihr, die ihr nach mir verlangt“ entspricht dem starken Begehren von οἱ ἐπιθυμοῦντές μου, ohne die personifizierte Weisheit auszudeuten. „sättigt euch an meinen Früchten“ ist eine idiomatische, poetisch passende Wiedergabe von ἀπὸ τῶν γενημάτων μου ἐμπλήσθητε. Zwar steht im Griechischen formal ein Passivimperativ („werdet erfüllt“), doch die deutsche Wendung bewahrt im Kontext von Früchten den Sinn des Erfüllt- bzw. Gesättigtwerdens und die Metapher.
  naturalness: Der Text ist modernes, natürliches Standarddeutsch und besitzt einen angemessen würdigen poetischen Ton. Die Relativkonstruktion „ihr, die ihr nach mir verlangt“ ist klar und flüssig. „sich an Früchten sättigen“ ist idiomatisch.
  terminology: „Früchte“ ist im unmittelbaren Pflanzenbild die beste Wahl für γενήματα. Die Fußnoten bieten mit „mich begehrt“ sowie „Erzeugnissen“/„Ertrag“ sachgerechte lexikalische Alternativen. Die erste Person der sprechenden personifizierten Weisheit bleibt erhalten, ohne allegorische oder konfessionelle Festlegung.
