- from: Wer auf mich hört, wird nicht beschämt werden, und die, die in mir wirken, werden nicht sündigen.
  to: Wer mir gehorcht, wird nicht beschämt werden, und die in mir tätig sind, werden nicht sündigen.
  rationale: Die Revision präzisiert den Gehorsamsaspekt von ὑπακούειν und glättet die deutsche Syntax. Sie hält zugleich gegen die englische Audit-Fassung die im griechischen Text stehende, ungewöhnliche Wendung ἐν ἐμοί („in mir“) unverändert fest und fügt keine dogmatische Deutung hinzu.
