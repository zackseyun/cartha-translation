  text: Whoever obeys me will not be put to shame, and those who work with me will not sin.
translation:
  language: de
  text: Wer mir gehorcht, wird nicht beschämt werden, und die in mir tätig sind, werden nicht sündigen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ὑπακούων μου
  choice: Wer auf mich hört
  rationale: Gibt das fortdauernde Hören mit dem darin liegenden Gehorsam natürlich wieder, ohne den Ausdruck auf bloßes akustisches Hören zu verengen.
- source_word: οὐκ αἰσχυνθήσεται
  choice: wird nicht beschämt werden
  rationale: Bewahrt die passive Bedeutung und lässt offen, ob öffentliche Schande, Enttäuschung oder endgültige Beschämung gemeint ist.
- source_word: οἱ ἐργαζόμενοι ἐν ἐμοὶ
  choice: die, die in mir wirken
  rationale: „Wirken“ ist im Deutschen würdig und idiomatisch; „in mir“ hält die ungewöhnliche, aber klare Präposition ἐν fest und ersetzt sie nicht durch das deutendere „mit mir“.
- source_word: οὐχ ἁμαρτήσουσιν
  choice: werden nicht sündigen
  rationale: Entspricht dem gewöhnlichen ethisch-religiösen Sinn von ἁμαρτάνω im Kontext der personifizierten Weisheit.
theological_decisions:
- issue: Verhältnis der Handelnden zur personifizierten Weisheit
  choice: in mir wirken
  alternative: mit mir wirken
  rationale: Der griechische Text sagt ausdrücklich ἐν ἐμοί („in mir“). Die räumlich-mystische oder sphärische Spannung wird bewahrt und nicht zugunsten bloßer Zusammenarbeit aufgelöst.
- issue: Aussage über das Nicht-Sündigen
  choice: werden nicht sündigen
  alternative: werden nicht fehlgehen
  rationale: Die direkte Zukunftsaussage bleibt ohne abschwächende Ergänzung stehen; zugleich wird keine systematische Lehre über Sündlosigkeit in den Vers hineinerklärt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Parallelstruktur. Die personifizierte Weisheit spricht in der ersten Person; die ungewöhnliche Wendung „in mir wirken“ bleibt bewusst erhalten.
