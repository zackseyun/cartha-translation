base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/024/014.yaml
  text: Like a palm tree I was raised high on the shores[a], and like rose plants in Jericho; like a splendid olive tree in the plain[b], and I was raised high like a plane tree.
translation:
  language: de
  text: Wie eine Palme wurde ich an den Küsten emporgehoben[a] und wie Rosenpflanzen in Jericho; wie ein stattlicher Ölbaum in der Ebene und wie eine Platane wurde ich emporgehoben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich nach dem überlieferten Griechisch: „an den Küsten“. Wegen des für Palmen ungewöhnlich wirkenden Standorts wird bisweilen eine andere zugrunde liegende Ortsangabe vermutet; der vorliegende griechische Text bietet jedoch „Küsten“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: φοῖνιξ
  choice: Palme
  rationale: Im botanischen Vergleich bezeichnet φοῖνιξ am natürlichsten eine Palme; die Art wird im Griechischen nicht näher bestimmt.
- source_word: ἀνυψώθην
  choice: wurde ich emporgehoben
  rationale: Die Form ist passiv und verbindet das Bild des hohen Wuchses mit dem möglichen Beiklang der Erhöhung. Eine bloße Wiedergabe mit „wuchs ich hoch“ würde diesen Beiklang abschwächen.
- source_word: αἰγιαλοῖς
  choice: an den Küsten
  rationale: αἰγιαλός bezeichnet den Küsten- oder Uferstreifen. „An den Küsten“ gibt den überlieferten griechischen Plural idiomatisch wieder.
- source_word: φυτὰ ῥόδου
  choice: Rosengewächse
  rationale: φυτά bezeichnet Pflanzen oder Pflanzungen; „Rosengewächse“ bewahrt den pluralischen botanischen Vergleich, ohne die Wuchsform als Busch festzulegen.
- source_word: Ἰερειχώ
  choice: Jericho
  rationale: Übliche deutsche Form des Ortsnamens.
- source_word: ἐλαία εὐπρεπής
  choice: stattlicher Ölbaum
  rationale: εὐπρεπής bezeichnet ansehnliche, schöne oder würdevolle Erscheinung; „stattlich“ passt zum Baumbild und zum gehobenen Ton.
- source_word: πεδίῳ
  choice: in der Ebene
  rationale: πεδίον bezeichnet flaches, offenes Land; der bestimmte Ausdruck entspricht der Landschaftsschilderung.
- source_word: πλάτανος
  choice: Platane
  rationale: πλάτανος ist die Platane; eine Wiedergabe als „Maulbeerfeigenbaum“ oder „Sykomore“ würde eine andere Baumart bezeichnen.
theological_decisions:
- issue: Passivische Erhöhung der personifizierten Weisheit
  choice: „wurde ich emporgehoben“
  alternative: „wuchs ich hoch“
  rationale: Die Übersetzung bewahrt sowohl die grammatische Passivform als auch die Spannung zwischen natürlichem Höhenwachstum und sinnbildlicher Erhöhung, ohne den Handelnden zu benennen.
translation_notes:
  register: Moderne, würdige Standardsprache mit parallel geführten Pflanzenbildern. Die wiederholte Wendung „wurde ich emporgehoben“ bildet die Wiederholung des griechischen ἀνυψώθην ab; die Umstellung im letzten Satzglied dient natürlichem deutschem Satzbau.
