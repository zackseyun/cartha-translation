  source_fidelity: 'Der Entwurf gibt die wesentlichen Elemente des Griechischen zutreffend wieder: κἀγώ („Und ich“), die zwei Wasserweg-Vergleiche, die Herkunft aus einem Fluss sowie die Bewegung in einen Garten. „Wasserleitung“ ist für ὑδραγωγός als künstlich geführten Wasserweg vertretbar. Die Verbindung „Kanal von einem Fluss“ ist jedoch im Deutschen semantisch und stilistisch zu unbestimmt; sie kann Zugehörigkeit statt Speisung/Herkunft nahelegen.'
  naturalness: „Und ich ging wie ein Kanal von einem Fluss“ ist trotz der absichtlich bildhaften Syntax im modernen Standarddeutsch holprig. „… wie ein Kanal, der von einem Fluss gespeist wird“ macht das Bewässerungsbild idiomatisch verständlich, ohne den Sinn über das griechische Bild hinaus zu verändern. „Zog … hinaus“ ist in poetisch-weisheitlichem Register natürlicher als „ging … hinaus“ und bewahrt ἐξῆλθον.
  terminology: „Kanal“ für διῶρυξ und „Wasserleitung“ für ὑδραγωγός bewahren die Unterscheidung zweier künstlicher Wasserführungen. „Garten“ für παράδεισος ist im konkreten Bewässerungskontext angemessen; die Fußnote erhält die lexikalische Alternative „Paradies“ und legt keine eschatologische Lesart fest.
