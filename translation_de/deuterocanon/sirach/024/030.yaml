revisions:
- from: Und ich ging wie ein Kanal von einem Fluss und wie eine Wasserleitung hinaus in einen Garten.[a]
  to: Und ich zog wie ein Kanal, der von einem Fluss gespeist wird, und wie eine Wasserleitung hinaus in einen Garten.[a]
  rationale: Die Revision beseitigt die unnatürliche Fügung „Kanal von einem Fluss“, indem sie die durch ἀπὸ ποταμοῦ ausgedrückte Herkunft im deutschen Bewässerungsbild idiomatisch als Speisung aus einem Fluss formuliert. Die Übersetzung wahrt die parallele Metaphorik, die Bewegungsrichtung und die bewusst konkrete Wiedergabe von παράδεισος als „Garten“.
