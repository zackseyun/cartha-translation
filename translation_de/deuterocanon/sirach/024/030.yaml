  text: And I, like a canal from a river, and like a water channel, went out into a garden.
translation:
  language: de
  text: Und ich zog wie ein Kanal, der von einem Fluss gespeist wird, und wie eine Wasserleitung hinaus in einen Garten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Paradies“. Das griechische Wort kann einen Garten, einen Park oder das Paradies bezeichnen; hier steht unmittelbar das Bild eines bewässerten Gartens im Vordergrund.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀγώ
  choice: Und ich
  rationale: Kennzeichnet schlicht den Übergang zur Rolle des Sprechers; ein zusätzliches „auch“ ist möglich, aber nicht erforderlich.
- source_word: διῶρυξ
  choice: Kanal
  rationale: Bezeichnet einen künstlich angelegten Wasserlauf und unterscheidet ihn vom natürlichen Fluss.
- source_word: ἀπὸ ποταμοῦ
  choice: von einem Fluss
  rationale: Die artikellose Wendung bezeichnet die Herkunft und wird im Deutschen natürlich unbestimmt wiedergegeben.
- source_word: ὑδραγωγός
  choice: Wasserleitung
  rationale: Gibt einen zur Wasserführung angelegten Lauf wieder, ohne die stark bauliche Vorstellung eines Aquädukts festzulegen.
- source_word: ἐξῆλθον
  choice: ging … hinaus
  rationale: Bleibt nahe an der Bewegungsbedeutung des griechischen Verbs und ist mit dem bildlich sprechenden Ich gut verständlich.
- source_word: παράδεισον
  choice: Garten
  rationale: Im unmittelbaren Bewässerungsbild ist ein kultivierter Garten gemeint; die ebenfalls mögliche Wiedergabe „Paradies“ bleibt in der Fußnote erhalten.
theological_decisions:
- issue: Wiedergabe von παράδεισον im Weisheits- und Bewässerungsbild
  choice: Garten
  alternative: Paradies
  rationale: Der konkrete Zusammenhang spricht von Bewässerung und verlangt keine ausdrücklich eschatologische Deutung. Die lexikalische und theologische Offenheit wird durch die Fußnote bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallelen künstlichen Wasserläufe werden mit „Kanal“ und „Wasserleitung“ unterschieden; die etwas ungewöhnliche Bildbewegung des griechischen Textes bleibt erhalten.
