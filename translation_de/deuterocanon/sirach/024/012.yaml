  yaml_path: translation/deuterocanon/sirach/024/012.yaml
  text: And I took root among a glorified people[a], in the portion of the Lord[b], his inheritance.
translation:
  language: de
  text: Und ich schlug Wurzeln in einem verherrlichten Volk[a], im Anteil des Herrn, seinem Erbe[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in einem herrlichen Volk“. Das griechische Partizip kann eher als Eigenschaftswort verstanden werden; die Hauptfassung bewahrt seine passive und resultative Bedeutung.'
    reason: lexical_alternative
  - marker: b
    text: 'Die knappe griechische Wendung kann auch verstanden werden als: „im Anteil am Erbe des Herrn“ oder „im dem Herrn zugeteilten Erbe“. Die Hauptfassung lässt die appositionelle Verknüpfung offen.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐρρίζωσα
  choice: ich schlug Wurzeln
  rationale: Der Aorist Aktiv in der ersten Person Singular wird mit der im Deutschen natürlichen aktiven Wendung „Wurzeln schlagen“ wiedergegeben.
- source_word: λαῷ
  choice: Volk
  rationale: λαός bezeichnet hier ein Volk als gemeinschaftliche Größe; „Volk“ bewahrt diesen kollektiven und möglichen bundestheologischen Klang.
- source_word: δεδοξασμένῳ
  choice: verherrlichten
  rationale: Das Partizip Perfekt Passiv von δοξάζω bezeichnet einen herbeigeführten, fortwirkenden Zustand. „Verherrlicht“ bewahrt diese resultative und passive Aussage besser als das rein adjektivische „herrlich“.
- source_word: μερίδι
  choice: Anteil
  rationale: μερίς bezeichnet einen zugeteilten Anteil. „Anteil“ ist im Deutschen knapp und hält den Zuteilungsgedanken in Verbindung mit dem Erbbesitz fest.
- source_word: Κυρίου
  choice: des Herrn
  rationale: Der Gottesname κύριος wird nach der üblichen deutschen Bibelsprache mit „der Herr“ wiedergegeben; der griechische Genitiv verlangt hier „des Herrn“.
- source_word: κληρονομίας αὐτοῦ
  choice: seinem Erbbesitz
  rationale: „Erbbesitz“ gibt κληρονομία in seinem Zusammenhang von Erbe, Besitz und Zuteilung wieder. Die appositionelle Form bewahrt die gedrängte griechische Konstruktion, ohne sie vorschnell eindeutig aufzulösen.
theological_decisions:
- issue: Ist δεδοξασμένῳ rein adjektivisch oder mit passiv-resultativer Kraft zu verstehen?
  choice: verherrlichten Volk
  alternative: herrlichen Volk; zu Ehren gebrachten Volk
  rationale: Die Form ist ein Partizip Perfekt Passiv. Die Hauptfassung lässt daher erkennen, dass die Herrlichkeit dem Volk zuteilgeworden ist und als Zustand fortbesteht, ohne festzulegen, auf welche Weise dies geschah.
- issue: Wie ist ἐν μερίδι Κυρίου κληρονομίας αὐτοῦ syntaktisch zu fassen?
  choice: im Anteil des Herrn, seinem Erbbesitz
  alternative: im Anteil am Erbbesitz des Herrn; im zugeteilten Erbbesitz des Herrn
  rationale: Die griechische Wortfolge ist knapp und lässt eine appositionelle beziehungsweise genitivische Verknüpfung zu. Die Hauptfassung bleibt quellennah und bewahrt diese Spannung; die Fußnote nennt glattere mögliche Deutungen.
translation_notes:
  register: Moderne, würdevolle Standardsprache. „Wurzeln schlagen“ ist idiomatisch und zugleich bildhaft; „verherrlicht“ bewahrt bewusst die formale und theologische Spannung des griechischen Partizips. Die ungewöhnlich knappe Apposition am Versende folgt der Mehrdeutigkeit der Vorlage.
