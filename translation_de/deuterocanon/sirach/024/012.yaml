  source_fidelity: Die Hauptübersetzung gibt ἐρρίζωσα, λαῷ und δεδοξασμένῳ treffend wieder. Die Schlussfügung folgt zwar der knappen, wohl appositionellen griechischen Konstruktion, doch „Erbbesitz“ verschiebt κληρονομία unnötig in Richtung Besitzstand. „Erbe“ bewahrt den Kernbegriff genauer und lässt die gedrängte Zuordnung offen.
  naturalness: „Und ich schlug Wurzeln“ ist idiomatisches, modernes und zugleich würdiges Deutsch. Die Apposition am Schluss ist bewusst knapp, sollte aber mit „Erbe“ statt des schwerfälligeren „Erbbesitz“ formuliert werden. Fußnote a enthält zudem die unnatürliche Formulierung „stärker wie“.
  terminology: „verherrlicht“ gibt das Perfektpassiv δεδοξασμένῳ angemessen wieder, ohne die Alternative „herrlich“ auszuschließen. „Anteil des Herrn, seinem Erbe“ wahrt die Begriffe μερίς und κληρονομία sowie die Mehrdeutigkeit ihrer Verknüpfung.
