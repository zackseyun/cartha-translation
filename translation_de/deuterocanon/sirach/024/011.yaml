  source_fidelity: 'Die Übersetzung gibt die Satzglieder und die Aussage des griechischen Textes zuverlässig wieder: πόλει ἠγαπημένῃ als „der geliebten Stadt“, ὁμοίως als „ebenso“, κατέπαυσεν als Veranlassung zum Ruhen und ἐξουσία als „Macht“. Das ergänzte Präteritum „war“ ist im erzählenden Kontext gut begründet, obwohl die griechische Nominalkonstruktion keine Kopula enthält.'
  naturalness: „In der geliebten Stadt ließ er mich ebenso Ruhe finden, und in Jerusalem war meine Macht“ ist verständliches, würdiges modernes Standarddeutsch. Die leicht gehobene Stellung von „ebenso“ passt zum poetisch-weisheitlichen Register und bewahrt den Anschluss an den Kontext.
  terminology: „Geliebte Stadt“ ist treffend. „Macht“ deckt bei personifizierter Weisheit das Bedeutungsspektrum von ἐξουσία (Macht, Befugnis, Autorität) idiomatisch ab, ohne durch „Herrschaft“ einen territorialen Herrschaftsbereich oder durch „Vollmacht“ einen zu engen rechtlichen Sinn festzulegen. Das Pronomen „er“ und die Fußnote bewahren die im Vers unausgesprochene Subjektreferenz.
