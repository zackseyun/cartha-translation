  text: In the beloved city likewise he gave me rest[b][a], and in Jerusalem was my authority.
translation:
  language: de
  text: In der geliebten Stadt ließ er[a] mich ebenso Ruhe finden, und in Jerusalem war meine Macht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Subjekt von »ließ … Ruhe finden« bleibt im Griechischen unausgesprochen. Der Zusammenhang weist auf Gott, doch dieser Vers nennt ihn nicht ausdrücklich.
    reason: lexical_alternative
lexical_decisions:
- source_word: πόλει ἠγαπημένῃ
  choice: der geliebten Stadt
  rationale: Das perfekt-passivische Partizip bezeichnet die Stadt als »geliebt«. Der bestimmte Artikel ist im Deutschen idiomatisch, da die folgende Nennung Jerusalems die Stadt eindeutig bestimmt.
- source_word: ὁμοίως
  choice: ebenso
  rationale: »Ebenso« bewahrt den rückbezüglichen Anschluss an den vorausgehenden Zusammenhang und klingt im heutigen Deutsch natürlicher als »gleichermaßen« oder »desgleichen«.
- source_word: κατέπαυσεν
  choice: ließ … Ruhe finden
  rationale: καταπαύω kann bedeuten, jemanden zur Ruhe zu bringen oder an einem Ort Ruhe finden zu lassen. Die Formulierung bewahrt sowohl den Gedanken der Ruhe als auch den der Niederlassung, ohne sich einseitig auf »ansiedeln« festzulegen.
- source_word: ἐξουσία
  choice: Macht
  rationale: ἐξουσία bezeichnet Macht, Befugnis oder Herrschaftsgewalt. »Macht« ist hier verständlich, würdevoll und lässt offen, ob vor allem Befugnis oder Herrschaftsbereich gemeint ist.
theological_decisions:
- issue: Unausgesprochenes Subjekt von κατέπαυσεν
  choice: Das maskuline Subjekt wird mit »er« wiedergegeben, ohne es im Haupttext ausdrücklich mit Gott gleichzusetzen.
  alternative: »Gott ließ mich Ruhe finden« oder »der Herr gab mir Ruhe«
  rationale: Die griechische Verbform setzt ein maskulines Subjekt voraus, nennt es in diesem Vers jedoch nicht ausdrücklich. Der Kontext weist auf Gott, doch die Übersetzung wahrt die textliche Zurückhaltung.
- issue: Zeitbezug der nominalen zweiten Satzhälfte
  choice: Die im Griechischen fehlende Kopula wird als »war« ergänzt.
  alternative: »ist« oder eine kopulalose Formulierung
  rationale: Der erzählende Zusammenhang und der Aorist κατέπαυσεν legen einen vergangenen Bezug nahe; »war« ergibt zudem einen natürlichen deutschen Satz, ohne die Aussage inhaltlich auszubauen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die personifizierte Weisheit spricht in der ersten Person; die knappe Parallelstruktur des griechischen Satzes bleibt erhalten.
