base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/024/015.yaml
  text: Like cinnamon and aspalathus[a], I gave forth a scent of spices, and like choice myrrh I spread fragrance, like galbanum and onycha and stacte[e][d][c][b], and like the smoke of frankincense in the tabernacle.
translation:
  language: de
  text: Wie Zimt und Aspalath[a] verströmte ich würzigen Duft, und wie erlesene Myrrhe verbreitete ich Wohlgeruch, wie Galbanum, Räucherklaue und Stakte[b] und wie Rauch von Weihrauch im Zelt[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Aspalath ist eine aromatische Pflanze; ihre genaue botanische Bestimmung ist unsicher.
    reason: cultural_note
  - marker: b
    text: Galbanum, Räucherklaue und Stakte sind Duftstoffe, die als Bestandteile von Räucherwerk bekannt waren; die genaue Beschaffenheit von Räucherklaue und Stakte ist nicht völlig sicher.
    reason: cultural_note
  - marker: c
    text: 'Oder: „im Offenbarungszelt“; griechisch wörtlich „im Zelt“. Im Zusammenhang mit dem Räucherwerk ist wahrscheinlich das Heiligtumszelt gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κιννάμωμον
  choice: Zimt
  rationale: Die gewöhnliche und verständliche deutsche Entsprechung des griechischen Gewürznamens.
- source_word: ἀσπάλαθος
  choice: Aspalath
  rationale: Die genaue botanische Bestimmung ist unsicher; die eingedeutschte Umschrift vermeidet falsche Präzision.
- source_word: ἀρωμάτων
  choice: würzigen Duft
  rationale: Der Genitiv gehört sinngemäß zu ὀσμήν; die Wendung gibt einen Duft von Gewürzen natürlich wieder.
- source_word: δέδωκα ὀσμήν
  choice: verströmte ich … Duft
  rationale: Natürliches, poetisch angemessenes Deutsch für das Hervorgeben eines Geruchs.
- source_word: σμύρνα ἐκλεκτή
  choice: erlesene Myrrhe
  rationale: ἐκλεκτή bezeichnet Ausgewähltes beziehungsweise besonders Hochwertiges; „erlesen“ wahrt den gehobenen Ton.
- source_word: διέδωκα εὐωδίαν
  choice: verbreitete ich Wohlgeruch
  rationale: εὐωδία bezeichnet einen angenehmen Duft; „Wohlgeruch“ ist prägnant und passt zum kultischen Zusammenhang.
- source_word: χαλβάνη
  choice: Galbanum
  rationale: Etablierte deutsche Bezeichnung für das aromatische Harz und passend zur biblischen Räucherwerkterminologie.
- source_word: ὄνυξ
  choice: Räucherklaue
  rationale: Im Räucherwerkzusammenhang ist nicht der Edelstein Onyx gemeint, sondern ein aromatischer Stoff; die traditionelle deutsche Sachbezeichnung verhindert dieses Missverständnis.
- source_word: στακτή
  choice: Stakte
  rationale: Die Umschrift bewahrt die Bezeichnung des besonderen Duftstoffs, dessen genaue Identifizierung nicht völlig sicher ist.
- source_word: λίβανου ἀτμίς
  choice: Weihrauchrauch
  rationale: Im Zusammenhang verbrannten Weihrauchs bezeichnet ἀτμίς den aufsteigenden Rauch; das Kompositum ist präzise und verständlich.
- source_word: ἐν σκηνῇ
  choice: im Zelt
  rationale: Die Grundbedeutung von σκηνή bleibt im Haupttext erhalten; der kultische Bezug auf das Heiligtumszelt wird in einer Fußnote erläutert.
theological_decisions:
- issue: Kultischer Bezug von σκηνή
  choice: im Zelt
  alternative: im Offenbarungszelt / in der Stiftshütte
  rationale: Die Räucherwerkbegriffe rufen deutlich das Heiligtum in Erinnerung, doch σκηνή bedeutet zunächst „Zelt“. Der Haupttext wahrt diese Offenheit, während die Fußnote den wahrscheinlichen kultischen Bezug nennt.
translation_notes:
  register: Poetisch-gehobenes, aber gegenwärtiges Standarddeutsch. Die Folge konkreter Duftstoffe und die kultische Bildwelt bleiben erhalten; seltene Sachbegriffe werden knapp erläutert, ohne unsichere Identifizierungen zu verabsolutieren.
