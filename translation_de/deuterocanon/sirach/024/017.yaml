  text: I[a], like a vine, put forth grace[c][b], and my blossoms are the fruit of glory and wealth.
translation:
  language: de
  text: Ich brachte wie ein Weinstock Anmut hervor,[a] und meine Blüten sind Frucht der Herrlichkeit und des Reichtums.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Gnade“, „Gunst“ oder „Wohlgefallen“. Das griechische Wort kann hier sowohl Anmut als auch eine wohltätige Zuwendung bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Die Wendung kann auch im Sinn von „herrliche und reiche Frucht“ oder „Frucht, die Herrlichkeit und Reichtum hervorbringt“ verstanden werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγὼ
  choice: Ich
  rationale: Das ausdrücklich gesetzte Personalpronomen wird beibehalten und betont die Selbstaussage der personifizierten Weisheit.
- source_word: ὡς ἄμπελος
  choice: wie ein Weinstock
  rationale: Die Vergleichspartikel ὡς und das Pflanzenbild werden unmittelbar und in natürlichem Deutsch wiedergegeben.
- source_word: βλαστήσασα
  choice: ließ … sprießen
  rationale: Das feminine Aoristpartizip beschreibt botanisches Austreiben. Eine finite Form ist im Deutschen natürlicher; die Konstruktion mit „sprießen lassen“ ermöglicht zugleich, χάριν als Objekt zu erhalten.
- source_word: χάριν
  choice: Anmut
  rationale: χάρις kann hier Anmut, Wohlgefallen, Gunst oder Gnade bezeichnen. „Anmut“ passt besonders gut zum poetischen Pflanzenbild, ohne die weiteren Bedeutungsanteile als einzig mögliche Lesart auszuschließen.
- source_word: τὰ ἄνθη μου
  choice: meine Blüten
  rationale: „Blüten“ bewahrt das Bild des Weinstocks und die gedankliche Bewegung vom Sprießen zur Frucht.
- source_word: καρπὸς
  choice: Frucht
  rationale: Der griechische Singular wird als kollektiver Singular bewahrt. Der artikellose deutsche Gebrauch vermeidet das unnatürliche „eine Frucht“ bei dem pluralischen Subjekt „Blüten“.
- source_word: δόξης
  choice: der Herrlichkeit
  rationale: δόξα kann Herrlichkeit, Glanz oder Ehre bedeuten. „Herrlichkeit“ erhält den gehobenen Ton und die semantische Weite.
- source_word: πλούτου
  choice: des Reichtums
  rationale: πλοῦτος bezeichnet Reichtum oder Fülle. „Reichtum“ ist die direkte und kontextuell passende Wiedergabe.
theological_decisions:
- issue: Bedeutung von χάριν in der Selbstdarstellung der Weisheit
  choice: Anmut
  alternative: Gnade, Gunst oder Wohlgefallen
  rationale: Im poetischen Bild eines sprießenden Weinstocks liegt der ästhetische Sinn nahe. Die Fußnote hält jedoch die wohltätige und möglicherweise theologisch anklingende Bedeutung offen, statt sie auszuschließen.
- issue: Verhältnis der Genitive δόξης καὶ πλούτου zu καρπός
  choice: Frucht der Herrlichkeit und des Reichtums
  alternative: herrliche und reiche Frucht; Frucht, die Herrlichkeit und Reichtum hervorbringt
  rationale: Die formale Genitivverbindung bewahrt die im Griechischen offene Beziehung. Eine ausschließlich qualitative oder resultative Deutung wird nicht in den Haupttext eingetragen.
translation_notes:
  register: Modernes, gehobenes Standarddeutsch mit bewahrtem poetischem Pflanzenbild. Die ungewöhnliche, aber verständliche Aussage „meine Blüten sind Frucht“ hält den kollektiven Singular und die Bildverdichtung des Griechischen fest.
