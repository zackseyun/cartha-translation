  yaml_path: translation/deuterocanon/sirach/024/021.yaml
  text: Those who eat me will still hunger[a], and those who drink me will still thirst.
translation:
  language: de
  text: Die mich essen, werden noch hungern[a], und die mich trinken, werden noch dürsten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder sinngemäß: „werden nach mehr hungern … werden nach mehr dürsten“. Wörtlich heißt es im Griechischen „werden noch hungern“ und „werden noch dürsten“; damit kann das fortdauernde Verlangen nach der Weisheit gemeint sein, nachdem man an ihr Anteil bekommen hat.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ ἐσθίοντές με
  choice: die mich essen
  rationale: Der substantivierte Präsenspartizip bezeichnet allgemein Menschen, die von der personifizierten Weisheit essen. Die direkte Formulierung bewahrt sowohl den allgemeinen Sinn als auch das Bild, die Weisheit selbst zu essen.
- source_word: ἔτι
  choice: noch
  rationale: ἔτι bezeichnet hier das fortdauernde Hungern beziehungsweise Dürsten nach dem Essen und Trinken. „Noch“ gibt diese zeitliche Fortdauer knapp und natürlich wieder.
- source_word: πεινάσουσιν
  choice: werden hungern
  rationale: Das Futur wird direkt wiedergegeben und bewahrt die pointierte, paradoxe Aussage.
- source_word: οἱ πίνοντές με
  choice: die mich trinken
  rationale: Die Formulierung entspricht parallel οἱ ἐσθίοντές με und erhält das personifizierende Bild ohne erklärende Erweiterung.
- source_word: διψήσουσιν
  choice: werden dürsten
  rationale: Das Futur und die bildhafte Sprache werden unmittelbar bewahrt; „dürsten“ entspricht zudem dem gehobenen, aber weiterhin verständlichen Register des Verses.
theological_decisions:
- issue: Das Paradox, dass Menschen nach dem Essen und Trinken der Weisheit weiterhin hungern und dürsten
  choice: Das fortdauernde Hungern und Dürsten bleibt im Haupttext wörtlich und unabgeschwächt stehen.
  alternative: „werden nach mehr verlangen“ beziehungsweise „werden noch mehr von mir haben wollen“
  rationale: Der griechische Text nennt kein ausdrückliches Objekt wie „mehr“, sondern formuliert das Paradox direkt. Die mögliche Bedeutung eines wachsenden Verlangens nach Weisheit wird deshalb nur in der Fußnote erläutert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrtem Parallelismus. Die leicht markierte Wendung „die mich essen“ hält die direkte und personifizierende Bildsprache des Griechischen fest.
