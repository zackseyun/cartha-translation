  text: I made my dwelling in the heights[a], and my throne was in a pillar of cloud;
translation:
  language: de
  text: Ich nahm Wohnung in den Höhen, und mein Thron war in einer Wolkensäule.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in der Wolkensäule“. Die Wendung kann auf die bekannte Wolkensäule anspielen, die mit Gottes Gegenwart und Führung verbunden ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατεσκήνωσα
  choice: nahm Wohnung
  rationale: Das Verb bezeichnet ein Sich-Niederlassen oder Wohnen und kann zugleich an das Aufschlagen eines Zeltes erinnern. „nahm Wohnung“ gibt den Vorgang und den bleibenden Aufenthalt natürlich und würdig wieder.
- source_word: ἐν ὑψηλοῖς
  choice: in den Höhen
  rationale: Das substantivierte Neutrum Plural bezeichnet erhöhte, hier wohl himmlische Bereiche. „in den Höhen“ bewahrt sowohl den Plural als auch die räumliche Aussage.
- source_word: θρόνος
  choice: Thron
  rationale: Die königliche und erhabene Bildsprache ist ausdrücklich; „Thron“ ist die direkte und idiomatische Entsprechung.
- source_word: ἐν στύλῳ νεφέλης
  choice: in einer Wolkensäule
  rationale: „Wolkensäule“ ist die geläufige biblische Wiedergabe und bewahrt den möglichen Anklang an Gottes Gegenwart und Führung während der Wüstenwanderung. Da die griechische Wortgruppe ohne Artikel steht, bleibt die Hauptfassung unbestimmt.
theological_decisions:
- issue: Anspielung auf die Wolkensäule der Wüstenwanderung
  choice: Die Wendung wird ohne erklärenden Zusatz als „in einer Wolkensäule“ wiedergegeben.
  alternative: „in der Wolkensäule“
  rationale: Das Bild dürfte die bekannte Wolkensäule als Zeichen göttlicher Gegenwart und Führung aufrufen; der griechische Wortlaut benennt diese Beziehung jedoch nicht ausdrücklich. Die unbestimmte Hauptfassung wahrt daher die sprachliche Form, während die Fußnote die mögliche bestimmte Wiedergabe nennt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer biblischer Bildsprache. „nahm Wohnung“ ist gehoben, aber allgemein verständlich; „Wolkensäule“ bewahrt den vertrauten intertextuellen Klang.
