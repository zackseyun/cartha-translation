  yaml_path: translation/deuterocanon/sirach/024/026.yaml
  text: It fills up understanding like the Euphrates[a], and like the Jordan in the days of harvest[d][c][b];
translation:
  language: de
  text: Er lässt Einsicht überreich strömen wie der Euphrat und wie der Jordan in den Tagen der Ernte.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Einsicht anfüllt wie der Euphrat und wie der Jordan in den Tagen der Ernte“. Das Griechische beginnt mit einem artikulierten Partizip, das auch ausdrücklich mit „der … anfüllt“ wiedergegeben werden kann; der ergänzte Bezug bleibt dabei aus dem Zusammenhang zu erschließen.'
    reason: lexical_alternative
  - marker: b
    text: Das Bild der wasserreichen Flüsse veranschaulicht die überströmende Fülle der Einsicht.
    reason: cultural_note
lexical_decisions:
- source_word: ὁ ἀναπληρῶν
  choice: Er lässt … in Fülle strömen
  rationale: Das artikulierte Partizip setzt die Beschreibung des zuvor genannten männlichen Bezugsworts fort. ἀναπληρόω bezeichnet ein vollständiges oder reichliches Anfüllen; im Bild der großen Flüsse gibt die gewählte Formulierung diese Fülle natürlich wieder, ohne das Verb intransitiv als bloßes Erfülltsein des Subjekts zu verstehen.
- source_word: σύνεσιν
  choice: Einsicht
  rationale: σύνεσις bezeichnet verstehende Einsicht oder Erkenntnisfähigkeit. „Einsicht“ ist im Deutschen knapp, geläufig und für Weisheitsliteratur angemessen.
- source_word: ὡς Εὐφράτης
  choice: wie der Euphrat
  rationale: ὡς leitet hier einen Vergleich ein; bei Flussnamen ist der bestimmte Artikel im Deutschen üblich.
- source_word: Ἰορδάνης
  choice: der Jordan
  rationale: Die natürliche deutsche Bezeichnung des Flusses steht mit bestimmtem Artikel.
- source_word: ἐν ἡμέραις θερισμοῦ
  choice: in den Tagen der Ernte
  rationale: Die konkrete Zeitangabe des Griechischen bleibt erhalten und bewahrt den saisonalen Bezug des Flussbildes.
theological_decisions:
- issue: Bezug und Funktion des artikulierten Partizips ὁ ἀναπληρῶν
  choice: Fortführung mit „Er“
  alternative: „der … erfüllt“ beziehungsweise eine unpersönliche Formulierung
  rationale: Das maskuline artikulierte Partizip greift syntaktisch den zuvor genannten männlichen Bezug auf. Die Übersetzung setzt diesen Zusammenhang fort, ohne eine zusätzliche theologische Identifikation in den Vers einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „In Fülle strömen lassen“ bewahrt das Flussbild und vermeidet die im Deutschen missverständliche Formulierung, das Subjekt selbst sei „mit Einsicht erfüllt“.
