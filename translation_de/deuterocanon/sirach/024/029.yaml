  text: For her understanding is more abundant than the sea[d][c][b][a], and her counsel than the great deep.
translation:
  language: de
  text: Denn ihre Einsicht ist größer als das Meer und ihr Rat größer als die große Tiefe[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „der große Abgrund“. Gemeint ist die gewaltige, urzeitliche Wassertiefe. Wörtlicher nach dem Griechischen: „Denn vom Meer her wurde ihre Einsicht vermehrt, und ihr Rat von der großen Tiefe“; wahrscheinlich liegt jedoch eine semitisch geprägte Vergleichsform vor. Für „Einsicht“ ist auch „Gedanke“ möglich.'
    reason: lexical_and_grammatical_alternative
lexical_decisions:
- source_word: διανόημα
  choice: Einsicht
  rationale: Das Wort bezeichnet einen Gedanken beziehungsweise das Ergebnis oder Vermögen des Denkens. „Einsicht“ passt zum Weisheitskontext, ohne die Bedeutung auf einen einzelnen Gedanken zu verengen.
- source_word: ἐπληθύνθη
  choice: ist reicher
  rationale: Die passive Verbform steht hier wahrscheinlich in einer semitisch geprägten Vergleichskonstruktion. „Ist reicher“ gibt die übergroße Fülle wieder und lässt sich im Deutschen sinnvoll auf beide Satzglieder beziehen.
- source_word: βουλή
  choice: Rat
  rationale: „Rat“ bewahrt den Weisheitsbezug und kann sowohl beratende Einsicht als auch einen überlegten Ratschluss bezeichnen.
- source_word: ἀπὸ γὰρ θαλάσσης
  choice: als das Meer
  rationale: ἀπό gibt hier wahrscheinlich einen semitischen Komparativ wieder; eine wörtliche Übersetzung mit „vom Meer her“ würde fälschlich eine Herkunft nahelegen.
- source_word: ἀβύσσου μεγάλης
  choice: die große Tiefe
  rationale: Die Wendung bezeichnet die gewaltige, urzeitlich-kosmische Wassertiefe. „Die große Tiefe“ bewahrt dieses Bild besser als ein abstrakter Abgrund.
- source_word: αὐτῆς
  choice: ihre / ihr
  rationale: Der Kontext personifiziert die grammatisch feminine Weisheit. Die femininen Possessivformen erhalten diese Darstellung.
theological_decisions:
- issue: Personifikation der Weisheit
  choice: Feminine persönliche Bezüge („ihre“, „ihr“) beibehalten
  alternative: Die Weisheit unpersönlich oder sächlich wiedergeben
  rationale: Der griechische Kontext stellt die Weisheit als weibliche, sprechende Gestalt dar. Diese literarisch-theologische Personifikation soll nicht eingeebnet werden.
- issue: Vergleich oder Herkunft
  choice: ἀπό vergleichend als „als“ wiedergeben
  alternative: Wörtlich „vom Meer her“ beziehungsweise „aus der großen Tiefe“
  rationale: Die wahrscheinlich semitisch geprägte Konstruktion vergleicht die unermessliche Fülle der Einsicht und des Rates mit Meer und Tiefe; sie behauptet nicht, dass beide daraus stammen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung von „reicher“ macht die im Griechischen verkürzte zweite Vergleichsklausel im Deutschen eindeutig, ohne mit „tiefer“ ein nicht ausdrücklich vorhandenes Prädikat einzuführen.
