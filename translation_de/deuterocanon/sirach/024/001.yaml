  text: Wisdom will praise herself[c][b][a], and in the midst of her people she will boast.
translation:
  language: de
  text: Die Weisheit wird sich selbst[a] loben und sich inmitten ihres Volkes rühmen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „ihre Seele“; die griechische Wendung kann hier reflexiv „sich selbst“ bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „prahlen“; das griechische Verb kann je nach Zusammenhang „sich rühmen“ oder „prahlen“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἡ σοφία
  choice: die Weisheit
  rationale: Der bestimmte Artikel und die feminine Personenrede werden beibehalten; im Kapitel tritt die Weisheit als personifizierte Sprecherin auf.
- source_word: αἰνέσει
  choice: wird … loben
  rationale: Das Futur von αἰνέω wird direkt und in natürlichem Deutsch mit „wird loben“ wiedergegeben.
- source_word: ψυχὴν αὐτῆς
  choice: sich selbst
  rationale: Wörtlich steht „ihre Seele“; die Wendung kann jedoch als semitisch geprägte reflexive Ausdrucksweise dienen. „Sich selbst“ vermittelt diesen Sinn idiomatisch, ohne die Personifikation abzuschwächen.
- source_word: ἐν μέσῳ
  choice: inmitten
  rationale: „Inmitten“ bewahrt die räumliche und öffentliche Aussagekraft der griechischen Wendung und bleibt gut verständlich.
- source_word: λαοῦ αὐτῆς
  choice: ihres Volkes
  rationale: Der Genitiv und das ausdrückliche Possessivverhältnis werden entsprechend dem griechischen Text erhalten.
- source_word: καυχήσεται
  choice: wird sich rühmen
  rationale: καυχάομαι kann „sich rühmen“, „prahlen“ oder „sich stolz zeigen“ bedeuten. „Sich rühmen“ wahrt die mögliche positive öffentliche Selbstaussage, ohne den im Deutschen stark negativen Beiklang von „prahlen“ festzuschreiben.
theological_decisions:
- issue: Personifikation der Weisheit
  choice: Die Weisheit wird als weiblich personifizierte Größe dargestellt.
  alternative: „Weisheit“ lediglich als unpersönliche Eigenschaft zu verstehen oder die Personenrede abzuschwächen.
  rationale: Die feminine Grammatik und der weitere Zusammenhang des Kapitels stellen die Weisheit als handelnde und redende Gestalt dar. Die Übersetzung bewahrt diese literarisch-theologische Spannung, ohne die Gestalt darüber hinaus zu identifizieren.
- issue: Wertung des Sich-Rühmens
  choice: Die mehrdeutige Formulierung „sich rühmen“ wird beibehalten.
  alternative: Das Verb eindeutig negativ als „prahlen“ oder eindeutig positiv als „frohlocken“ wiederzugeben.
  rationale: Das griechische καυχάομαι kann je nach Zusammenhang öffentliche Selbstaussage, Ruhm oder Prahlen bezeichnen. Die Übersetzung vermeidet eine vorschnelle moralische Festlegung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung ist flüssig, während „inmitten ihres Volkes“ den feierlich-öffentlichen Charakter des griechischen Ausdrucks wahrt.
