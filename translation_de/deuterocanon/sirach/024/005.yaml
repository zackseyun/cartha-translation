  text: I alone encircled the vault of heaven[c][b][a], and walked in the depths of the abysses.
translation:
  language: de
  text: Ich allein umkreiste das Himmelsgewölbe[a] und wandelte in der Tiefe der Abgründe[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »den Kreis des Himmels«. Das griechische Wort kann einen kreisförmigen Umkreis oder ein gewölbtes Rund bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: »in den Tiefen der Abgründe«. Im Griechischen steht »Tiefe« im Singular, »Abgründe« jedoch im Plural.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γῦρον
  choice: Himmelsgewölbe
  rationale: γῦρος bezeichnet etwas Rundes oder Gewölbtes beziehungsweise einen kreisförmigen Umkreis. Im Zusammenhang mit dem Himmel gibt »Himmelsgewölbe« das antike kosmologische Bild natürlich und würdig wieder.
- source_word: ἐκύκλωσα
  choice: umkreiste
  rationale: Das Verb κυκλόω bezeichnet eine Bewegung ringsum. »Umkreiste« bewahrt die kreisförmige Bildsprache und passt unmittelbar zum Himmelsgewölbe.
- source_word: μόνη
  choice: ich allein
  rationale: Die feminine Singularform bezieht sich auf die als Frau personifizierte Weisheit und betont ihre Alleinstellung. Im Deutschen gibt »ich allein« diese Hervorhebung klar wieder.
- source_word: βάθει
  choice: in der Tiefe
  rationale: Der griechische Dativ steht im Singular. »In der Tiefe der Abgründe« hält diesen Numerus fest und bleibt im Deutschen verständlich.
- source_word: ἀβύσσων
  choice: der Abgründe
  rationale: Der Genitiv Plural bezeichnet unergründliche Tiefen. »Abgründe« bewahrt sowohl den Plural als auch den erhabenen kosmischen Klang.
- source_word: περιεπάτησα
  choice: wandelte
  rationale: περιπατέω bedeutet wörtlich »umhergehen« oder »wandeln«. »Wandelte« erhält das konkrete Bewegungsbild und passt zum würdigen Register des Weisheitsliedes.
theological_decisions:
- issue: Personifizierte Sprecherin
  choice: Die Ich-Rede und die durch μόνη angezeigte feminine Sprecherrolle der personifizierten Weisheit bleiben erhalten, ohne sie darüber hinaus dogmatisch zu identifizieren.
  alternative: Die Aussage ausdrücklich auf eine bestimmte göttliche Hypostase oder spätere christologische Deutung beziehen.
  rationale: Der unmittelbare literarische Zusammenhang stellt die Weisheit als weiblich personifizierte Sprecherin dar; weitergehende Identifizierungen werden vom Vers selbst nicht entschieden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Wandelte« bewahrt den poetischen und kosmischen Ton, ohne die Aussage auszudeuten; die parallelen Verben teilen wie im Griechischen dasselbe Subjekt.
