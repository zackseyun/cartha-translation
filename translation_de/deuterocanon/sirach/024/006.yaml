  yaml_path: translation/deuterocanon/sirach/024/006.yaml
  text: In the waves of the sea and in all the earth[a], and among every people and nation[b], I gained possession.
translation:
  language: de
  text: In den Wogen des Meeres und auf der ganzen Erde, bei jedem Volk und jeder Nation, gewann ich Besitz.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „erwarb ich“ oder „nahm ich in Besitz“. Im Griechischen bleibt unausgesprochen, was die Weisheit erwirbt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν κύμασιν θαλάσσης
  choice: In den Wogen des Meeres
  rationale: Die lokative Wendung und das konkrete Bild bleiben erhalten. „Wogen“ gibt κύματα in einem würdigen, zugleich geläufigen Register wieder.
- source_word: ἐν πάσῃ τῇ γῇ
  choice: auf der ganzen Erde
  rationale: γῆ kann „Land“ oder „Erde“ bedeuten; die umfassende Abfolge spricht hier für den universalen Sinn „Erde“.
- source_word: ἐν παντὶ λαῷ καὶ ἔθνει
  choice: bei jedem Volk und jeder Nation
  rationale: „Bei“ bezeichnet im Deutschen natürlich die Gegenwart beziehungsweise Wirksamkeit innerhalb menschlicher Gemeinschaften. „Volk“ und „Nation“ bewahren die beiden koordinierten Begriffe, ohne sie gleichzusetzen.
- source_word: ἐκτησάμην
  choice: gewann ich Besitz
  rationale: Die Wiedergabe drückt den Erwerb beziehungsweise die Erlangung von Besitz oder Herrschaftsbereich aus und lässt wie der griechische Text offen, was genau erworben wurde.
theological_decisions:
- issue: Unausgesprochenes Objekt von ἐκτησάμην
  choice: „gewann ich Besitz“ mit einem allgemeinen Substantiv
  alternative: „erwarb ich“ oder „nahm ich in Besitz“
  rationale: Im Griechischen steht kein ausdrückliches Objekt. Die Formulierung ist im Deutschen verständlich, ohne festzulegen, ob die Weisheit die genannten Bereiche, die Menschen darin oder einen Herrschaftsbereich erwirbt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Wogen“ erhält die poetische Bildsprache; die ungewöhnliche, aber verständliche Wendung „Besitz gewinnen“ bewahrt die Offenheit des griechischen Verbs.
