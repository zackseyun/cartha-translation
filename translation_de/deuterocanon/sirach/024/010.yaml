  text: In the holy tent I ministered before him[b][a], and so I was established in Zion.
translation:
  language: de
  text: Im heiligen Zelt verrichtete ich vor ihm meinen Dienst, und so wurde ich in Zion gefestigt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν σκηνῇ ἁγίᾳ
  choice: im heiligen Zelt
  rationale: σκηνή bezeichnet konkret ein Zelt beziehungsweise das heilige Zelt. „Heiliges Zelt“ bewahrt das anschauliche kultische Bild und ist im modernen Deutsch verständlicher als „Stiftshütte“.
- source_word: ἐνώπιον αὐτοῦ
  choice: vor ihm
  rationale: Die Wendung wird räumlich-relational und ohne nähere Festlegung des Bezugs wiedergegeben.
- source_word: ἐλειτούργησα
  choice: verrichtete ich … meinen Dienst
  rationale: Das Verb bezeichnet hier einen kultischen beziehungsweise heiligen Dienst. Diese Formulierung erhält den sakralen Klang, ohne der personifizierten Weisheit ausdrücklich ein Priesteramt zuzuschreiben.
- source_word: οὕτως
  choice: und so
  rationale: „Und so“ gibt die Verknüpfung mit dem vorausgehenden Dienst sowie den resultativen Fortgang natürlich wieder.
- source_word: ἐστηρίχθην
  choice: wurde ich … fest gegründet
  rationale: Die passive Form und der Sinn des Festmachens beziehungsweise dauerhaften Einsetzens bleiben erhalten.
- source_word: Σειὼν
  choice: auf dem Zion
  rationale: „Zion“ ist die geläufige deutsche Namensform; bei der Vorstellung des Berges ist „auf dem Zion“ idiomatisch.
theological_decisions:
- issue: Kultische Bedeutung des Dienstes der personifizierten Weisheit
  choice: „verrichtete ich vor ihm meinen Dienst“
  alternative: „diente ich vor ihm“ / „verrichtete ich Priesterdienst“
  rationale: Die gewählte Fassung lässt den kultischen Charakter erkennen, legt die Aussage aber weder auf bloß allgemeinen Dienst noch auf ein ausdrücklich bezeichnetes Priesteramt fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung ist flüssig, bewahrt aber die Abfolge von heiligem Zelt, Dienst vor Gott und fester Gründung auf dem Zion.
