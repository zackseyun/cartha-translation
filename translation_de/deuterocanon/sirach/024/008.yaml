  yaml_path: translation/deuterocanon/sirach/024/008.yaml
  text: Then the Creator of all commanded me[a], and the one who created me pitched my tent and said, “Dwell in Jacob[c][b], and receive your inheritance in Israel.”
translation:
  language: de
  text: 'Da gebot mir der Schöpfer des Alls; der mich erschaffen hat, schlug mein Zelt auf[a] und sagte: »Nimm Wohnung in Jakob und empfange in Israel dein Erbteil.[b]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: »befestigte mein Zelt«; sinngemäß: »richtete mir eine Wohnstätte ein«.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: »Lass dir in Israel ein Erbteil zuweisen« oder »Werde in Israel als Erbteil zugeteilt«. Das griechische Verb verbindet Erbschafts- und Zuteilungsvorstellungen.'
    reason: lexical_ambiguity
lexical_decisions:
- source_word: τότε
  choice: Da
  rationale: Das temporale τότε wird im erzählenden Zusammenhang natürlich und knapp mit »Da« wiedergegeben.
- source_word: ἐνετείλατό μοι
  choice: gebot mir
  rationale: »Gebot mir« bewahrt die klare Befehlsbedeutung von ἐντέλλομαι und entspricht dem gehobenen, aber heutigen Register.
- source_word: ὁ κτίστης ἁπάντων
  choice: der Schöpfer des Alls
  rationale: κτίστης bezeichnet den Schöpfer, ἁπάντων die Gesamtheit alles Seienden. »Des Alls« ist prägnant und wahrt den universalen Umfang.
- source_word: ὁ κτίσας με
  choice: der mich erschaffen hat
  rationale: Die partizipiale Wiederaufnahme wird ausdrücklich wiedergegeben und erhält den Parallelismus sowie die persönliche Beziehung der sprechenden Weisheit zu ihrem Schöpfer.
- source_word: κατέπηξεν τὴν σκηνήν μου
  choice: schlug mein Zelt auf
  rationale: Die Wendung bewahrt das konkrete Bild vom Befestigen beziehungsweise Aufschlagen eines Zeltes und vermeidet eine unnötig kultische Festlegung auf »Stiftshütte«.
- source_word: Ἐν Ἰακὼβ κατασκήνωσον
  choice: Nimm Wohnung in Jakob
  rationale: κατασκηνόω bezeichnet das Lagern oder dauerhafte Wohnen. »Nimm Wohnung« ist natürlich und lässt zugleich den Anschluss an das Zeltmotiv erkennen.
- source_word: κατακληρονομήθητι
  choice: empfange ... dein Erbteil
  rationale: Die Form enthält Erb- und Zuteilungssprache. »Empfange dein Erbteil« wahrt den empfangenden beziehungsweise passiven Zug besser als das rein aktive »erbe«.
- source_word: ἐν Ἰσραήλ
  choice: in Israel
  rationale: Die Präposition und die poetische Parallele »in Jakob ... in Israel« werden unmittelbar erhalten.
theological_decisions:
- issue: Das Verhältnis der personifizierten Weisheit zu Gott
  choice: Die Weisheit spricht persönlich und wird zugleich ausdrücklich als von Gott erschaffen dargestellt.
  alternative: Die Weisheit abstrakter wiedergeben oder die Aussage mit späteren christologischen Kategorien erläutern.
  rationale: Der griechische Text hält lebendige Personifikation und Schöpfer-Geschöpf-Unterscheidung nebeneinander. Die Übersetzung bewahrt diese Spannung, ohne sie dogmatisch aufzulösen.
- issue: Zelt- und Wohnmotiv
  choice: Das konkrete Zeltbild wird mit »schlug mein Zelt auf« beibehalten und durch »Nimm Wohnung« fortgeführt.
  alternative: Mit »errichtete meine Stiftshütte« eine ausdrücklich kultische Deutung hervorheben.
  rationale: Die Bildsprache kann kultische Resonanzen wecken, legt diese aber lexikalisch nicht ausschließlich fest. Die gewählte Fassung bleibt offen und verständlich.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Doppelpunkt wird durch ein Semikolon gegliedert, damit eindeutig bleibt, dass »der mich erschaffen hat« Subjekt von »schlug ... auf und sagte« ist. Die feminine Sprecherrolle der personifizierten Weisheit ergibt sich aus dem Kontext, ohne dass im einzelnen Vers ein zusätzliches feminines Pronomen eingeführt wird.
