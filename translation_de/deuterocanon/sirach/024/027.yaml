lexical_decisions:
- source_word: ὁ ἐκφαίνων
  choice: Es lässt … hervorstrahlen
  rationale: Das substantivierte Partizip bezeichnet im Zusammenhang weiterhin das Gesetz aus Vers 23. Das deutsche Neutrum „es“ nimmt „das Gesetz“ natürlich auf; „hervorstrahlen lassen“ gibt die kausative Bedeutung von ἐκφαίνω wieder.
- source_word: ὡς φῶς
  choice: wie Licht
  rationale: Die einfache Vergleichsformulierung bewahrt das Bild des griechischen Textes, ohne die vermutete hebräische Vorlage einzutragen.
- source_word: παιδείαν
  choice: Unterweisung
  rationale: παιδεία bezeichnet hier formende Lehre und Erziehung zur Weisheit. „Unterweisung“ ist würdig und verständlich, ohne den Strafaspekt von „Züchtigung“ nahezulegen.
- source_word: ὡς Γηὼν
  choice: wie der Gihon
  rationale: Der Eigenname wird beibehalten; bei Flussnamen ist der bestimmte Artikel im Deutschen idiomatisch.
- source_word: ἐν ἡμέραις τρυγητοῦ
  choice: in den Tagen der Weinlese
  rationale: τρυγητός bezeichnet konkret die Traubenernte. „Weinlese“ ist die geläufige und präzise deutsche Entsprechung.
theological_decisions:
- issue: Bezugswort des substantivierten Partizips ὁ ἐκφαίνων
  choice: Das Pronomen „Es“ bezieht sich auf das zuvor genannte Gesetz.
  alternative: „Der Unterweisung wie Licht hervorstrahlen lässt“ oder personal „Er lässt …“
  rationale: Die Folge der Partizipien in den Versen 25–27 beschreibt im Zusammenhang das Gesetz. „Es“ wahrt diesen Bezug und verhindert, dass ohne textlichen Grund Gott als unmittelbar handelndes Subjekt verstanden wird. Die formale Gestalt des griechischen Maskulinums wird in der Fußnote kenntlich gemacht.
- issue: Bild „wie Licht“
  choice: Das griechische Bild wird unverändert wiedergegeben.
  alternative: „wie der Nil“ nach einer erschlossenen hebräischen Vorlage
  rationale: Die vorliegende griechische Quelle liest ausdrücklich φῶς („Licht“). Eine textkritische Rückübersetzung soll den überlieferten Ausgangstext nicht ersetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt bildhaft und knapp; „Unterweisung“ und „Weinlese“ sind allgemein verständlich. Die Fußnote bewahrt die formale Mehrdeutigkeit des griechischen substantivierten Partizips.
