  text: Es[a] lässt Unterweisung wie Licht hervorstrahlen, wie der Gihon in den Tagen der Weinlese.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Derjenige, der die Unterweisung wie Licht hervorstrahlen lässt.“ Im Zusammenhang bezieht sich dies weiterhin auf das Gesetz aus Vers 23.'
