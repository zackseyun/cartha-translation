  text: In the assembly of the Most High she will open her mouth[c][b][a], and before his power she will boast.
translation:
  language: de
  text: In der Versammlung des Höchsten wird sie ihren Mund öffnen[a], und vor seiner Macht[b] wird sie sich rühmen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint ist die personifizierte Weisheit, wie der Zusammenhang zeigt.
    reason: cross_reference
  - marker: b
    text: 'Oder: „vor seiner Heerschar“. Das griechische Wort kann sowohl „Macht“ als auch „Heerschar“ bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκκλησίᾳ
  choice: Versammlung
  rationale: Bezeichnet hier die versammelte Gemeinschaft. „Versammlung“ ist neutral, natürlich und vermeidet die für diesen Kontext missverständliche Wiedergabe „Kirche“.
- source_word: Ὑψίστου
  choice: des Höchsten
  rationale: Die etablierte und ehrerbietige deutsche Wiedergabe des göttlichen Titels Ὕψιστος.
- source_word: στόμα αὐτῆς ἀνοίξει
  choice: öffnet sie ihren Mund
  rationale: Bewahrt das anschauliche griechische Idiom für das Ergreifen des Wortes sowie die Personifikation; das griechische Futur kann in dieser darstellenden Weisheitsrede natürlich mit deutschem Präsens wiedergegeben werden.
- source_word: ἔναντι
  choice: vor
  rationale: Gibt knapp und idiomatisch die Bedeutung „in Gegenwart von“ wieder.
- source_word: δυνάμεως αὐτοῦ
  choice: seiner Macht
  rationale: Entspricht der direkten abstrakten Bedeutung von δύναμις und vermeidet es, die mögliche kollektive Bedeutung „Heerschar“ ohne eindeutigen Kontextbeleg in den Haupttext zu setzen.
- source_word: καυχήσεται
  choice: rühmt sie sich
  rationale: Gibt das mediale καυχάομαι natürlich wieder und bewahrt dessen Bedeutungsspektrum zwischen Sich-Rühmen und Sich-Preisen.
theological_decisions:
- issue: Bezug der weiblichen Pronomen
  choice: Das Subjekt bleibt im Haupttext „sie“.
  alternative: Das Subjekt ausdrücklich als „die Weisheit“ benennen.
  rationale: Der Zusammenhang identifiziert die Sprecherin als personifizierte Weisheit, doch der Vers selbst wiederholt das Substantiv nicht. Die Pronomenform bewahrt die Textgestalt, ohne eine Erläuterung in den Haupttext einzutragen.
- issue: Bedeutung von δύναμις
  choice: Macht
  alternative: Heerschar
  rationale: Das Griechische lässt grundsätzlich sowohl die abstrakte Macht als auch, besonders in der Septuaginta, eine Heerschar zu. Da der unmittelbare Wortlaut die kollektive Deutung nicht erzwingt, steht „Macht“ im Haupttext; die Alternative wird in einer Fußnote offengehalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Parallelstruktur und die Personifikation bleiben erhalten; „sich rühmen“ ist bewusst näher am griechischen Ausdruck als stärker deutende Alternativen wie „jubeln“ oder „sich preisen“.
