  text: All these things are the book of the covenant of God Most High[b][a], the law that Moses commanded as an inheritance for the assemblies of Jacob.
translation:
  language: de
  text: 'Dies alles ist das Buch des Bundes Gottes, des Höchsten[a]: das Gesetz, das Mose geboten hat, als Erbe für die Versammlungen[b] Jakobs.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „des höchsten Gottes“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Gemeinden“. Gemeint sind wahrscheinlich die versammelten Gemeinschaften Israels, nicht notwendig spätere Synagogen als Institutionen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα πάντα
  choice: Dies alles
  rationale: Die Wendung fasst die vorausgehenden Aussagen als Ganzes zusammen; „dies alles“ ist im Deutschen natürlich und gibt den umfassenden Sinn des griechischen Neutrum Plural wieder.
- source_word: βίβλος
  choice: Buch
  rationale: βίβλος bezeichnet ein schriftliches Buch beziehungsweise eine Schriftrolle. „Buch“ ist die natürliche moderne Entsprechung, ohne das antike Material unnötig festzulegen.
- source_word: διαθήκης
  choice: Bundes
  rationale: Im biblischen Zusammenhang bezeichnet διαθήκη den Bund Gottes; „Testament“ oder „Vereinbarung“ würden die heilsgeschichtliche und schriftbezogene Bedeutung weniger präzise wiedergeben.
- source_word: θεοῦ Ὑψίστου
  choice: Gottes, des Höchsten
  rationale: Die appositionelle Form wahrt die griechische Wortfolge und bezeichnet Gott als den Höchsten. Die ebenfalls mögliche attributive Wiedergabe wird in einer Fußnote genannt.
- source_word: νόμον
  choice: das Gesetz
  rationale: Gemeint ist das bestimmte, mit dem Bundesbuch identifizierte mosaische Gesetz. Der bestimmte Artikel macht diesen Bezug im Deutschen deutlich.
- source_word: ὃν ἐνετείλατο Μωυσῆς
  choice: das Mose … geboten hat
  rationale: ἐντέλλομαι bedeutet „gebieten, befehlen“. Die Formulierung hält Mose als grammatisches Subjekt fest und bleibt im Deutschen würdig und verständlich.
- source_word: κληρονομίαν
  choice: als Erbe
  rationale: Der Akkusativ beschreibt das Gesetz als bleibenden Erbbesitz der Gemeinschaften Jakobs. „Als Erbe“ drückt dieses Verhältnis idiomatisch aus.
- source_word: συναγωγαῖς
  choice: den Versammlungen
  rationale: συναγωγαί bezeichnet hier am ehesten die versammelten Gemeinschaften Israels und nicht zwingend spätere Synagogen als Institutionen.
- source_word: Ἰακώβ
  choice: Jakobs
  rationale: Der griechische Text nennt ausdrücklich Jakob. Der Name wird beibehalten, auch wenn kollektiv das Volk Israel gemeint ist.
theological_decisions:
- issue: Wiedergabe von διαθήκη im Zusammenhang mit Mose und Jakob
  choice: Bund
  alternative: Testament
  rationale: Die Verknüpfung von göttlicher Offenbarung, Mose und den Gemeinschaften Jakobs spricht für den biblisch-bundestheologischen Sinn. „Bund“ bewahrt diesen Zusammenhang, ohne eine spätere testamentarische Bedeutung einzutragen.
- issue: Bezug von Ὑψίστου
  choice: Gottes, des Höchsten
  alternative: des höchsten Gottes
  rationale: Beide deutschen Fassungen können die griechische Genitivverbindung sachgerecht abbilden. Die Hauptfassung bewahrt den appositionellen Klang und lässt die im Griechischen vorhandene formale Offenheit erkennbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Doppelpunkt verdeutlicht die erläuternde Gleichsetzung von „Buch des Bundes“ und „Gesetz“, ohne ein zusätzliches Verb in den griechischen Text einzutragen. „Versammlungen“ vermeidet einen möglichen institutionellen Anachronismus.
