  text: I will again make instruction shine like the dawn[c][b][a], and I will bring these things to light far into the distance.
translation:
  language: de
  text: Weiter werde ich die Unterweisung wie die Morgendämmerung leuchten lassen und diese Dinge bis in die Ferne ans Licht bringen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔτι
  choice: noch
  rationale: ἔτι führt den Gedanken fort und wirkt hier additiv beziehungsweise kontinuativ. „Noch“ bewahrt diese Offenheit, ohne einen unnötig adversativen Ton einzuführen.
- source_word: παιδείαν
  choice: Unterweisung
  rationale: παιδεία bezeichnet hier formende Lehre und Bildung, nicht bloß Zucht oder Strafe. „Unterweisung“ passt zum Kontext der Weisheitslehre und wahrt einen würdigen, verständlichen Ton.
- source_word: ὡς ὄρθρον
  choice: wie die Morgendämmerung
  rationale: ὄρθρος bezeichnet den frühen Morgen beziehungsweise den Tagesanbruch. „Morgendämmerung“ erhält das Bild des aufkommenden Lichts.
- source_word: φωτιῶ
  choice: werde … leuchten lassen
  rationale: Das Futur von φωτίζω hat παιδείαν zum Objekt. „Leuchten lassen“ ist im Deutschen natürlich und erhält die Lichtmetaphorik.
- source_word: ἐκφανῶ
  choice: werde … ans Licht bringen
  rationale: ἐκφαίνω bedeutet sichtbar oder offenbar machen. „Ans Licht bringen“ führt das Lichtbild der ersten Vershälfte weiter.
- source_word: αὐτά
  choice: diese Dinge
  rationale: Das griechische Neutrum Plural wird als Plural bewahrt. Es verweist wahrscheinlich auf die Inhalte oder einzelnen Aussagen der zuvor genannten Unterweisung, ohne den Bezug enger festzulegen.
- source_word: ἕως εἰς μακράν
  choice: bis in die Ferne
  rationale: Die Wendung bezeichnet eine weite räumliche beziehungsweise bildliche Erstreckung. „Bis in die Ferne“ ist knapp, idiomatisch und bildhaft.
theological_decisions:
- issue: Bezug des pluralischen αὐτά in der Rede der Weisheit
  choice: „diese Dinge“ als pluralischer Verweis auf die Inhalte der Unterweisung
  alternative: Singularisch „sie“ als Rückverweis auf „Unterweisung“
  rationale: Auf das singularische παιδείαν folgt ausdrücklich das neutrale Pluralpronomen αὐτά. Die Übersetzung bewahrt diesen Numeruswechsel und lässt offen, welche einzelnen Inhalte der Weisheitslehre gemeint sind.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallele Lichtmetaphorik beider Versteile sowie der griechische Wechsel vom Singular zum Plural bleiben erhalten.
