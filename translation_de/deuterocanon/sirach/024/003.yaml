  yaml_path: translation/deuterocanon/sirach/024/003.yaml
  text: I came forth from the mouth of the Most High, and like a mist I covered the earth;
translation:
  language: de
  text: Ich ging aus dem Mund des Höchsten hervor und bedeckte wie Nebel die Erde.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξῆλθον
  choice: ging … hervor
  rationale: Der Aorist von ἐξέρχομαι bezeichnet das Hervorgehen. „ging … hervor“ bewahrt den gehobenen Ton und die Herkunftsmetaphorik der personifizierten Weisheit.
- source_word: ἀπὸ στόματος
  choice: aus dem Mund
  rationale: Die Wendung gibt das Bild von Äußerung und Ursprung direkt und idiomatisch wieder.
- source_word: Ὑψίστου
  choice: des Höchsten
  rationale: „der Höchste“ ist die geläufige und würdevolle deutsche Wiedergabe des göttlichen Titels Ὕψιστος.
- source_word: ὡς ὁμίχλη
  choice: wie Nebel
  rationale: ὁμίχλη kann Nebel oder Dunst bezeichnen. „Nebel“ ist im heutigen Deutsch natürlich und erhält das poetische Bild.
- source_word: κατεκάλυψα
  choice: bedeckte
  rationale: Das Verb bezeichnet ein vollständiges Bedecken oder Überdecken; „bedeckte“ wahrt das Bild ohne zusätzliche Deutung.
- source_word: γῆν
  choice: die Erde
  rationale: Im kosmisch-poetischen Zusammenhang ist die ganze Erde gemeint, nicht ein bestimmtes Land.
theological_decisions:
- issue: Ursprung der personifizierten Weisheit aus Gott
  choice: „Ich ging aus dem Mund des Höchsten hervor“ bleibt als unmittelbare Herkunftsaussage stehen.
  alternative: „Ich wurde vom Höchsten ausgesprochen“ oder „Ich ging aus dem Befehl des Höchsten hervor“
  rationale: Der griechische Text verbindet die Ich-Rede der personifizierten Weisheit mit dem Bild des göttlichen Mundes. Die Übersetzung wahrt diese theologisch-poetische Spannung, ohne sie auf bloße Rede, Schöpfung oder eine bestimmte dogmatische Deutung festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit poetischem Satzfluss. Die Metaphern des Mundes und des die Erde bedeckenden Nebels bleiben nah am griechischen Text erhalten.
