base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/008/005.yaml
  text: Do not quarrel with a man of tongue[b][a], and do not put wood on the fire.
translation:
  language: de
  text: Streite nicht mit einem scharfzüngigen Menschen[b], und lege kein Holz ins Feuer.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Textzeuge lautet: „Mach einem Menschen, der sich von der Sünde abwendet, keine Vorwürfe; denk daran, dass wir alle dem Tadel ausgesetzt sind.“ Der hier erhaltene hebräische Text warnt dagegen davor, sich mit einem durch seine Worte gefährlichen Menschen zu streiten und den Streit weiter anzufachen.'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlich: „mit einem Mann der Zunge“. Gemeint ist ein Mensch, dessen scharfe oder streitsüchtige Rede gefährlich werden kann.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּינָץ
  choice: Streite nicht
  rationale: Die Verneinung אַל leitet eine Mahnung ein; תִּינָץ bezeichnet das Eintreten in Streit oder Auseinandersetzung. „Streite nicht“ ist im modernen Deutsch klar und dem Weisheitsspruch angemessen.
- source_word: עִם
  choice: mit
  rationale: Die Präposition bezeichnet hier das Gegenüber in einer Auseinandersetzung; im Deutschen steht „streiten“ natürlicherweise mit „mit“.
- source_word: אִישׁ לָשׁוֹן
  choice: ein scharfzüngiger Mensch
  rationale: Wörtlich steht „ein Mann der Zunge“. Die idiomatische Wiedergabe „scharfzüngiger Mensch“ bewahrt den Bezug auf gefährliche oder streitsüchtige Rede, ohne im Deutschen unverständlich zu klingen; die Fußnote legt das hebräische Bild offen.
- source_word: וְאַל תִּתֵּן
  choice: und lege kein
  rationale: תִּתֵּן bedeutet gewöhnlich „geben, setzen, legen“; beim Nachlegen von Holz ist „lege“ die natürliche konkrete Entsprechung. Die wiederholte Negation bleibt ausdrücklich erhalten.
- source_word: עַל אֵשׁ עֵץ
  choice: Holz ins Feuer
  rationale: 'Die konkrete Metapher des Hebräischen wird bewahrt: Zusätzliches Holz verstärkt das Feuer und steht sinnbildlich für die Verschärfung des Streits.'
theological_decisions:
- issue: Starke Abweichung zwischen hebräischem und griechischem Textzeugen
  choice: Der erhaltene hebräische Text bildet den Haupttext.
  alternative: 'Griechisch: „Mach einem Menschen, der sich von der Sünde abwendet, keine Vorwürfe; denk daran, dass wir alle dem Tadel ausgesetzt sind.“'
  rationale: Der hebräische Wortlaut ist sicher bezeugt und ergibt mit seinen beiden aufeinander bezogenen Satzhälften einen geschlossenen Weisheitsspruch. Der griechische Text setzt offenbar eine erheblich andere Textform voraus und darf deshalb den hebräischen Haupttext nicht verdrängen; wegen seines eigenständigen Inhalts wird er vollständig in einer Fußnote dokumentiert.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit knapper sprichwörtlicher Form. „Scharfzüngig“ gibt das ungewöhnliche hebräische Idiom verständlich wieder, während die Fußnote dessen wörtliche Gestalt bewahrt. Das konkrete Bild vom Holz und Feuer bleibt erhalten.
