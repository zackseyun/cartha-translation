  source_fidelity: 'Der Haupttext folgt dem erhaltenen hebräischen Text zuverlässig: beide prohibitivischen Aufforderungen und das Bild vom Holz, das dem Feuer hinzugefügt wird, sind erhalten. „Scharfzüngiger Mensch“ ist eine angemessene, im Deutschen natürliche Auslegung von אִישׁ לָשׁוֹן; die Fußnote sichert zugleich die wörtliche hebräische Bildform ab. Die deutlich abweichende griechische Fassung wird korrekt als Textzeuge, nicht als Grundlage des Haupttexts, dokumentiert.'
  naturalness: 'Die Formulierung ist knapp, idiomatisch und sprichwortartig: „Streite nicht … und lege kein Holz ins Feuer“ ist modernes Standarddeutsch. Die Satzverbindung und die Metapher sind klar.'
