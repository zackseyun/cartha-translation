translation:
  language: de
  text: Gewöhne dich nicht an einen törichten Mann[a], damit er nicht die Edlen verachtet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Parallelüberlieferung lautet: »Entehre einen Menschen nicht in seinem hohen Alter; denn auch einige von uns werden alt.« Sie weicht an dieser Stelle erheblich vom erhaltenen hebräischen Text ab.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תְּרַגִּיל
  choice: Gewöhne dich nicht an
  rationale: Die Wendung gibt das Verbot eines zur Gewohnheit werdenden vertrauten Umgangs knapp und im Deutschen natürlich wieder. Sie bleibt näher am Bild des hebräischen Verbs רגל als bloßes »Verkehre nicht mit«.
- source_word: אִישׁ אֱוִיל
  choice: einen törichten Mann
  rationale: Die singularische maskuline Form wird bewahrt. »Töricht« bezeichnet wie im weisheitlichen Sprachgebrauch nicht bloß mangelnde Intelligenz, sondern eine verfehlte Haltung und Lebensführung.
- source_word: פֶּן
  choice: sonst könnte
  rationale: Die Formulierung drückt die befürchtete negative Folge aus, ohne sie unnötig als sichere Folge festzulegen.
- source_word: יָבוּז
  choice: er … verachten
  rationale: בוז bezeichnet Geringschätzung oder Verachtung; »verachten« ist die direkte und idiomatische deutsche Entsprechung.
- source_word: לִנְדִיבִים
  choice: die Edlen
  rationale: נְדִיבִים kann vornehme beziehungsweise hochgestellte Menschen oder Freigebige bezeichnen. »Die Edlen« bewahrt hier sowohl den sozialen als auch den charakterlichen Bedeutungsraum besser als das enger festgelegte »Adlige«.
theological_decisions:
- issue: Starke Abweichung zwischen dem erhaltenen hebräischen Text und der griechischen Überlieferung
  choice: Der erhaltene hebräische Text steht im Haupttext; die griechische Fassung wird in einer Fußnote vollständig als abweichende Lesart wiedergegeben.
  alternative: »Entehre einen Menschen nicht in seinem Alter; denn auch einige von uns werden alt.«
  rationale: Wo ein belastbarer hebräischer Text erhalten ist, bildet er die Grundlage der Übersetzung. Da die griechische Fassung inhaltlich erheblich abweicht, wird diese textgeschichtliche Spannung nicht geglättet, sondern transparent dokumentiert.
translation_notes:
  register: Moderne, würdevolle Weisheitssprache. »Gewöhne dich nicht an« hält den Gedanken des gewohnheitsmäßigen, vertrauten Umgangs fest; »die Edlen« lässt die mögliche soziale und charakterliche Bedeutung von נְדִיבִים offen.
