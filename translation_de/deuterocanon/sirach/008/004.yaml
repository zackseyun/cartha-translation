translation:
  language: de
  text: Denn Gold hat viele ins Verderben gestürzt, und es führt das Herz der Edlen[b] in die Irre.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Fassung bietet hier eine wesentlich andere Lesart: „Verspotte keinen ungebildeten Menschen, damit deine Vorfahren nicht entehrt werden.“'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „der Freigebigen“; das hebräische Wort kann Edle, Fürsten oder freigebige Menschen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַבִּים
  choice: viele
  rationale: Das substantivisch gebrauchte Adjektiv bezeichnet eine große Zahl von Menschen; „viele“ ist knapp und natürlich.
- source_word: הִפְחִיז
  choice: ins Verderben gestürzt
  rationale: Das seltene und schwierige Verb beschreibt hier, parallel zum Irreführen im zweiten Satzglied, eine verhängnisvolle moralische Destabilisierung. Die Formulierung gibt die schädliche Wirkung idiomatisch wieder, ohne sie auf bloße Unbesonnenheit zu verengen.
- source_word: זָהָב
  choice: Gold
  rationale: Direkte und eindeutige Wiedergabe.
- source_word: יַשְׂגֶּה
  choice: führt ... in die Irre
  rationale: Das Verb bezeichnet ein Irreführen oder Veranlassen zum Fehlgehen; die deutsche Wendung bewahrt den moralischen Sinn.
- source_word: לֵב
  choice: Herz
  rationale: Im Hebräischen ist das Herz Sitz von Denken, Wollen und Begehren. „Herz“ erhält das Bild des Ausgangstextes.
- source_word: נְדִיבִים
  choice: Edlen
  rationale: Das Wort kann Vornehme oder Fürsten, aber auch freigebige Menschen bezeichnen. „Edle“ bewahrt im Deutschen einen Teil dieser Bedeutungsbreite; die Alternative wird in einer Fußnote genannt.
theological_decisions:
- issue: Vorrang der erhaltenen hebräischen Lesart gegenüber der stark abweichenden griechischen Fassung
  choice: 'Die erhaltene hebräische Fassung bildet den Haupttext: Gold richtet viele zugrunde und führt das Herz der Edlen irre.'
  alternative: 'Die griechische Fassung lautet: „Verspotte keinen ungebildeten Menschen, damit deine Vorfahren nicht entehrt werden.“'
  rationale: Wo der hebräische Text des Sirachbuches erhalten ist, dient er als primäre Grundlage. Da die griechische Fassung hier nicht nur eine geringfügige Variante, sondern einen wesentlich anderen Satz bietet, wird sie transparent in einer Fußnote dokumentiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Parallelität der beiden Satzglieder und das hebräische Bild vom Herzen bleiben erhalten. „Ins Verderben gestürzt“ formuliert die schwierige Verbform verständlich, während die Fußnoten die textkritische und lexikalische Offenheit sichern.
