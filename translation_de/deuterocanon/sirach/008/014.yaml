  text: Do not prosper in the inheritance of a wicked man[a], lest you be burned by the sparks of his fire.
translation:
  language: de
  text: Gedeihe nicht im Erbbesitz eines Frevlers[a], damit du nicht an einem Funken seines Feuers verbrennst.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Textzeuge (LXX/Swete) bietet hier einen anderen Spruch: „Führe keinen Rechtsstreit mit einem Richter; denn man wird für ihn nach seinem Ansehen urteilen.“ Der hebräische Text aus der Kairoer Geniza mahnt dagegen: Gedeihe nicht im Erbbesitz eines Frevlers, damit du nicht an einem Funken seines Feuers verbrennst.'
    reason: textual_variant
lexical_decisions:
- source_word: אַל תִּצְלַח
  choice: Gedeihe nicht
  rationale: צלח bezeichnet Erfolg, Vorankommen oder Gedeihen. Die ungewöhnliche Form der hebräischen Mahnung bleibt bewusst erhalten, statt sie durch eine erklärende Umschreibung wie „Suche keinen Vorteil“ zu glätten.
- source_word: בְּנַחֲלַת
  choice: im Erbbesitz
  rationale: נחלה bezeichnet Erbe, Erbteil oder erblichen Besitz. „Erbbesitz“ bewahrt sowohl den Gedanken des Erbes als auch den konkreten sozialen und wirtschaftlichen Bereich, in dem jemand gedeihen könnte; die Präposition בְּ wird mit „in/im“ wiedergegeben.
- source_word: רָשָׁע
  choice: eines Frevlers
  rationale: Das maskuline Singularwort bezeichnet hier exemplarisch einen schuldhaft bösen Menschen. „Frevler“ entspricht dem würdevollen Stil der Weisheitsliteratur, ohne die Aussage konfessionell aufzuladen.
- source_word: פֶּן תְּבֹעַר
  choice: damit du nicht … verbrennst
  rationale: פן leitet die befürchtete Folge ein; בער beschreibt hier das Entbrennen beziehungsweise Verbrennen. Die deutsche Konstruktion gibt die Warnung natürlich und deutlich wieder.
- source_word: בִּשְׁבִיב
  choice: am Funken
  rationale: שביב kann einen Funken, einen feurigen Strahl oder eine Flamme bezeichnen. Der Singular „Funken“ hält sich eng an die Form des hebräischen Textes und unterstreicht, dass bereits ein kleiner Ausläufer des Feuers gefährlich ist.
- source_word: אִשּׁוֹ
  choice: seines Feuers
  rationale: Das maskuline Suffix verweist auf den Frevler zurück. Die Feuerbildlichkeit bleibt unverändert erhalten.
theological_decisions:
- issue: Starke Abweichung zwischen hebräischem und griechischem Textzeugen
  choice: Der erhaltene hebräische Text wird als Grundlage übersetzt; die abweichende griechische Lesart wird in einer Fußnote dokumentiert.
  alternative: 'Der griechische Zeuge lautet sinngemäß: „Führe keinen Rechtsstreit mit einem Richter; denn man wird für ihn nach seinem Ansehen urteilen.“'
  rationale: Die beiden Überlieferungen bieten nicht bloß unterschiedliche Formulierungen, sondern verschiedene Sprüche. Eine Harmonisierung würde die tatsächliche Textgeschichte verdecken. Da hier ein hebräischer Sirachtext erhalten ist, erhält er Vorrang; die griechische Variante bleibt transparent sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die auffällige Wendung „Gedeihe nicht im Erbbesitz“ bewahrt die ungewöhnliche Ausdrucksweise des Hebräischen; das Feuerbild bleibt knapp und anschaulich. Der Fußnotenmarker [a] steht unmittelbar bei der von der griechischen Überlieferung abweichenden hebräischen Aussage.
