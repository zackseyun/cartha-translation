  text: For from him you will gain understanding[a], at a time of need to answer a saying.
translation:
  language: de
  text: Denn von ihm wirst du Einsicht gewinnen[a], wenn es nötig ist, auf einen Ausspruch zu antworten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Text bietet hier eine erheblich abweichende Lesart: »Leiste keine Bürgschaft über dein Vermögen hinaus; wenn du aber Bürgschaft leistest, dann sorge dich darum wie einer, der bezahlen muss.« Da für diesen Vers ein hebräischer Text aus der Kairoer Geniza erhalten ist, folgt die Hauptübersetzung dem Hebräischen; die Abweichung ist jedoch bedeutsam.'
    reason: textual_variant
lexical_decisions:
- source_word: מִמֶּנּוּ
  choice: von ihm
  rationale: Die Präposition mit maskulinem Pronominalsuffix bezeichnet am natürlichsten eine Person, die im Zusammenhang als Bezugspunkt vorausgesetzt wird.
- source_word: תִּקַּח שֶׂכֶל
  choice: wirst du Einsicht gewinnen
  rationale: Wörtlich steht hier »Einsicht nehmen/erlangen«. »Einsicht gewinnen« gibt den Erwerb praktischer Urteilskraft im Weisheitszusammenhang natürlich und präzise wieder.
- source_word: בְּעֵת צֹרֶךְ
  choice: wenn es nötig ist
  rationale: Die Wendung bezeichnet den Zeitpunkt oder Umstand eines Bedarfs. Die deutsche Formulierung bewahrt diesen Sinn, ohne unnötig schwerfällig zu wirken.
- source_word: לְהַשִׁיב
  choice: zu antworten
  rationale: In Verbindung mit פִּתְגָּם bezeichnet das Verb das Erteilen einer Antwort oder Erwiderung.
- source_word: פִּתְגָּם
  choice: auf einen Ausspruch
  rationale: Das Wort kann einen Ausspruch, eine Äußerung oder einen Sinnspruch bezeichnen. »Ausspruch« erhält diese Bedeutungsbreite besser als das engere »Sprichwort«.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung bleibt nahe am erhaltenen hebräischen Text, gibt תִּקַּח שֶׂכֶל jedoch idiomatisch mit »Einsicht gewinnen« wieder. Die erhebliche Abweichung des griechischen Paralleltextes wird transparent in der Fußnote dokumentiert.
