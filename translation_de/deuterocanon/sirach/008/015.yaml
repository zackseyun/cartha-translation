  text: Do not move aside before a scoffer[a], lest he seat him as one lying in wait before you.
translation:
  language: de
  text: Weiche einem Spötter nicht aus, damit er ihn nicht als jemanden, der dir auflauert, vor dir platziert.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der zweite Halbvers ist im Hebräischen schwer verständlich. Formnah lautet er: „ihn wie einen Lauernden vor dir zu setzen/platzieren“. Wer mit „ihn“ gemeint ist, bleibt unklar; auch die im Haupttext ausgedrückte warnende Verknüpfung ist erschlossen. Der griechische Paralleltext warnt allgemeiner vor einem verwegenen, eigenwilligen Menschen, der gegen dich handeln kann.'
    reason: textual_variant
lexical_decisions:
- source_word: אַל תָּזוּחַ
  choice: Weiche … nicht aus
  rationale: Das Verb bezeichnet ein Abrücken oder Ausweichen. Die Formulierung bewahrt das räumliche Bild und klingt zugleich natürlich im modernen Deutschen.
- source_word: מִפְּנֵי
  choice: einem … aus
  rationale: Die Präposition bedeutet wörtlich „vor/aus dem Angesicht von“. Zusammen mit „ausweichen“ wird die Beziehung im Deutschen idiomatisch als Dativ ausgedrückt.
- source_word: לֵץ
  choice: Spötter
  rationale: Das Wort bezeichnet in der Weisheitsliteratur einen höhnischen, verächtlichen Menschen. „Spötter“ ist verständlich und bewahrt die moralische Schärfe.
- source_word: לְהוֹשִׁיבוֹ
  choice: damit er ihn nicht … setzt
  rationale: Der Infinitiv mit maskulinem Objektsuffix bedeutet formal „ihn setzen/ihn Platz nehmen lassen“. Die schwierige Pronominalkonstruktion wird nicht stillschweigend zu „sich selbst“ geglättet.
- source_word: כְּאוֹרֵב
  choice: wie einen, der dir auflauert
  rationale: אֹרֵב bezeichnet jemanden, der verborgen auf eine Gelegenheit zum Angriff wartet. „Auflauern“ erhält das Bild des Hinterhalts.
- source_word: לְפָנֶיךָ
  choice: vor dich
  rationale: Die Wendung bedeutet wörtlich „vor dir/vor dich“. Mit dem Bewegungsverb „setzt“ ist „vor dich“ im Deutschen naheliegend; die feindliche Bedeutung ergibt sich aus dem Auflauern.
theological_decisions:
- issue: Vorrang des erhaltenen hebräischen Textes trotz schwieriger Syntax
  choice: Die schwierige hebräische Pronominalkonstruktion wird im Haupttext konservativ wiedergegeben.
  alternative: 'Dem griechischen Paralleltext folgen: „Geh nicht mit einem Verwegenen auf dem Weg, damit er dich nicht bedrängt …“; oder das hebräische Objekt reflexiv als „sich selbst“ deuten.'
  rationale: Der hebräische Text ist hier mit hoher Sicherheit bezeugt und bleibt die primäre Grundlage. Der griechische Text bestätigt lediglich den allgemeinen Warnsinn, bietet aber einen deutlich anderen Wortlaut. Die genuine Unsicherheit wird daher durch eine Fußnote offengelegt, nicht durch eine glättende Ersetzung beseitigt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das räumliche Bild des Hebräischen bleibt erhalten. Die ungewöhnliche Härte des zweiten Satzteils ist bewusst nicht vollständig geglättet, weil der Bezug des hebräischen Objektsuffixes unklar ist.
