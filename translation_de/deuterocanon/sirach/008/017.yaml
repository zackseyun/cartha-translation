  source_fidelity: Die hebräische Wendung יָתֵר מִמְּךָ bezieht sich in diesem Bürgschaftskontext am naheliegendsten auf das Maß der übernommenen Verpflichtung („mehr, als du leisten kannst“), nicht auf eine Person, die dem Angeredeten überlegen ist. Der Entwurf fügt daher mit „für jemanden, der dir überlegen ist“ ein nicht ausgedrücktes Bezugswort ein und verengt den Sinn. Die zweite Hälfte ist im Grundsatz zutreffend, kann aber die eigene Zahlungspflicht unmittelbarer wiedergeben.
  naturalness: „Bürge nicht“ ist verständlich, aber „Übernimm keine Bürgschaft“ ist im modernen Standarddeutsch idiomatischer und macht die Konstruktion mit der Maßangabe klar. „Betrachte dich als zahlungspflichtig“ gibt die eindringliche Weisungsform präzise wieder.
