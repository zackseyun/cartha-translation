  text: Do not pledge yourself for one stronger than you; and if you have pledged yourself[a], act as one who must pay.
translation:
  language: de
  text: Übernimm keine Bürgschaft, die deine Möglichkeiten übersteigt[a]; wenn du doch gebürgt hast, betrachte dich als zahlungspflichtig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „nicht mehr als du“. Die knappe hebräische Formulierung meint im Zusammenhang mit einer Bürgschaft wahrscheinlich eine Verpflichtung, die die eigenen Mittel oder Möglichkeiten übersteigt. Die griechische Parallelüberlieferung liest anders: „Berate dich nicht mit einem Toren; denn er wird eine Sache nicht für sich behalten können.“'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תַּעֲרֹב
  choice: Bürge nicht
  rationale: Das hebräische Verb ערב bezeichnet hier das Eingehen einer Bürgschaft. Die knappe deutsche Formulierung gibt den rechtlich-finanziellen Sinn unmittelbar und verständlich wieder.
- source_word: יָתֵר מִמְּךָ
  choice: für jemanden, der dir überlegen ist
  rationale: יתר kann hier ein Mehr an Rang, Macht oder Leistungsfähigkeit bezeichnen. „Dir überlegen“ bewahrt diese Bedeutungsbreite besser als eine ausschließlich finanzielle Deutung.
- source_word: וְאִם עָרַבְתָּ
  choice: hast du aber gebürgt
  rationale: Die Wiederholung desselben deutschen Verbs bildet die Wiederholung von ערב im Hebräischen ab; „aber“ gibt den bedingten Gegensatz im Deutschen natürlich wieder.
- source_word: כִּמְשַׁלֵּם
  choice: dann verhalte dich wie einer, der zahlen muss
  rationale: Die mit כ gebildete Vergleichsform stellt den Bürgen einem Zahlenden gleich. „Zahlen muss“ verdeutlicht die tatsächliche Haftung, ohne die Aussage auf eine bereits erfolgte Zahlung festzulegen.
theological_decisions: []
translation_notes:
  register: Knappe, mahnende Weisheitssprache in modernem Standarddeutsch. Der rechtliche Ausdruck „bürgen“ ist allgemein verständlich; die offene Bedeutung von יתר wird im Haupttext bewahrt und in der Fußnote erläutert.
