  text: Do not boast over one who is dying[b][a]; remember that all of us are being gathered.
translation:
  language: de
  text: 'Triumphiere nicht über einen Sterbenden[b]; denk daran: Wir alle werden versammelt[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich „wir alle werden versammelt“. Dies ist eine traditionelle Umschreibung des Todes; sinngemäß: „Wir alle werden sterben.“'
    reason: lexical_alternative
  - marker: b
    text: Die griechische Überlieferung bietet an dieser Stelle einen erheblich abweichenden Text über das Lernen aus den Überlieferungen der Ältesten. Hier wird dem hebräischen Text aus der Kairoer Geniza gefolgt.
    reason: textual_variant
lexical_decisions:
- source_word: אַל תִּתְהַלֵּל
  choice: Brüste dich nicht
  rationale: Der Hitpael von הלל bezeichnet hier ein Sichrühmen oder Triumphieren. „Brüste dich nicht“ bewahrt die im Hebräischen liegende Selbsterhöhung deutlicher als das allgemeinere „freue dich nicht“.
- source_word: עַל גֹּוֵעַ
  choice: über einen Sterbenden
  rationale: עַל bezeichnet den Gegenstand des Rühmens; גֹּוֵעַ ist ein Partizip und meint einen Menschen, der im Sterben liegt, nicht bereits einen Toten.
- source_word: זְכֹר
  choice: denk daran
  rationale: Die idiomatische deutsche Wendung gibt den Imperativ זְכֹר unmittelbar und natürlich wieder.
- source_word: כֻּלָּנוּ
  choice: wir alle
  rationale: Die inklusive Aussage des hebräischen Pronomens bleibt ausdrücklich erhalten.
- source_word: נֶאֱסָפִים
  choice: werden dahingerafft
  rationale: Das Niphal-Partizip von אסף dient hier als Umschreibung des Todes. „Dahingerafft werden“ ist im Deutschen verständlich und hält zugleich ein Bild des Weggenommen- beziehungsweise Versammeltwerdens fest, ohne ein im Text nicht genanntes Ziel hinzuzufügen.
theological_decisions:
- issue: Todesmetapher in נֶאֱסָפִים
  choice: werden dahingerafft
  alternative: werden versammelt / werden sterben
  rationale: Ein rein wörtliches „werden versammelt“ wäre im heutigen Deutschen ohne Zielangabe leicht missverständlich, während „werden sterben“ das Bild vollständig einebnet. „Werden dahingerafft“ vermittelt die Todesbedeutung, ohne eine Sammlung „zu den Vätern“ oder „zum Volk“ in den Text einzutragen.
- issue: Verhältnis zum stark abweichenden griechischen Text
  choice: Dem hebräischen Kairoer Geniza-Zeugen folgen
  alternative: Den griechischen Text über das Lernen von den Ältesten übersetzen
  rationale: Für diese Ausgabe ist der als zuverlässig eingestufte hebräische Text die primäre Grundlage. Die erhebliche Abweichung der griechischen Überlieferung wird transparent in einer Fußnote vermerkt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der knappe Mahnspruch und seine inklusive Erinnerung an die Sterblichkeit bleiben erhalten. „Sterbenden“ wahrt den fortdauernden Aspekt des hebräischen Partizips; die Doppelpunktgliederung macht den begründenden zweiten Satzteil klar.
