  text: Do not despise even his ordinary conversation[a], for from him you will learn instruction for standing before rulers.
translation:
  language: de
  text: Verachte auch ihre alltäglichen Gespräche nicht[a]; denn von ihm wirst du lernen, wie man vor Herrschern auftritt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Parallelüberlieferung lautet: „Erheb dich nicht vor einem unverschämten Menschen, damit er nicht wie ein Hinterhalt an deinem Mund lauert.“ Die griechische Überlieferung weicht hier erheblich vom erhaltenen hebräischen Text ab.'
    reason: alternative_reading
lexical_decisions:
- source_word: שִׂיחוֹת חוֹל
  choice: alltägliche Gespräche
  rationale: שִׂיחוֹת bezeichnet Gespräche oder Rede; חוֹל meint hier das Gewöhnliche im Unterschied zum Erhabenen oder Förmlichen. „Alltägliche Gespräche“ vermeidet die irreführenden Nebenbedeutungen von „weltliche“ oder „profane Rede“.
- source_word: תִבְזֶה
  choice: verachte … nicht
  rationale: Das Verb bezeichnet geringschätziges oder verächtliches Behandeln. „Verachten“ ist präzise, knapp und im Deutschen natürlich.
- source_word: לְהִתְיַצֵּב לִפְנֵי שָׂרִים
  choice: wie man vor Herrschern auftritt
  rationale: Die Infinitivverbindung beschreibt hier die praktische Fähigkeit, sich in der Gegenwart hochgestellter Amtsträger angemessen zu zeigen. Die deutsche Formulierung gibt diesen Zweck idiomatisch wieder.
- source_word: לֶקַח
  choice: lernen
  rationale: לֶקַח bezeichnet empfangene Lehre oder Unterweisung. In Verbindung mit תִּלְמַד ist die verbale Wiedergabe „wirst du lernen“ natürlich und vermeidet das schwerfällige „Unterweisung lernen“.
- source_word: מִמֶּנּוּ
  choice: von ihm
  rationale: Das hebräische Pronomen ist maskulin und singular. „Von ihm“ bewahrt diese Form, ohne den Bezug näher zu bestimmen, als es die Vorlage tut.
theological_decisions:
- issue: Vorrang des erhaltenen hebräischen Textes gegenüber der stark abweichenden griechischen Überlieferung
  choice: Der Haupttext folgt dem erhaltenen Hebräisch; die griechische Fassung wird in einer Fußnote dokumentiert.
  alternative: 'Griechisch: „Steh nicht vor einem übermütigen Menschen auf, damit er sich nicht wie ein Hinterhalt gegen deinen Mund setzt.“'
  rationale: Wo für Jesus Sirach ein hebräischer Text erhalten ist, bildet er die Grundlage der Übersetzung. Da die griechische Überlieferung an dieser Stelle inhaltlich erheblich abweicht, werden beide nicht harmonisiert; die bedeutsame abweichende Lesart bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Alltägliche Gespräche“ ist allgemein verständlich und vermeidet eine moralische Abwertung; „vor Herrschern auftritt“ drückt die praktische höfische oder amtliche Situation natürlich aus.
