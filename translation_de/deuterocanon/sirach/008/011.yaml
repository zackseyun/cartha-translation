review_pass:
  verdict: revise
  source_fidelity: Der Hauptsatz folgt dem erhaltenen hebräischen Text. Die vorliegende Fassung glättet jedoch die im Text stehende Pluralform מֵהֶם („ihre/von ihnen“) unzulässig zu „seine“. Die anschließende Singularform מִמֶּנּוּ („von ihm“) bleibt im Hebräischen erhalten; der Wechsel sollte nicht harmonisiert werden.
  naturalness: „Verachte auch ihre alltäglichen Gespräche nicht“ ist natürliches modernes Standarddeutsch. Die Zweckangabe „wie man vor Herrschern auftritt“ gibt den Sinn idiomatisch wieder. Die griechische Fußnote wird sprachlich geglättet, ohne ihr Bild eines Hinterhalts zu verändern.
  terminology: „alltägliche Gespräche“, „verachten“, „Herrscher“ und „von ihm lernen“ sind angemessen. Die Fußnote übersetzt ὑβριστοῦ treffender mit „unverschämter Mensch“; „übermütig“ trifft den vorwurfsvollen Sinn weniger genau.
  issues:
  - severity: medium
    issue: Numerus des Bezugspronomens im Haupttext harmonisiert
    rationale: Der hebräische Wortlaut hat bei שִׂיחוֹת חוֹל die Form מֵהֶם („von ihnen/ihre“), während später מִמֶּנּוּ („von ihm“) steht. „Seine“ beseitigt diesen Befund. Die Übersetzung soll den im Ausgangstext vorhandenen Numeruswechsel nicht ohne Kennzeichnung auflösen.
  - severity: low
    issue: Griechische Alternativlesart ist im Deutschen missverständlich formuliert
    rationale: „Steh nicht vor einem … Menschen auf“ kann im Deutschen so verstanden werden, als solle man vor ihm stehen. „Erheb dich nicht vor einem … Menschen“ gibt μὴ ἐξαναστῇς ἀπὸ προσώπου klarer wieder. „Wie ein Hinterhalt an deinem Mund lauert“ ist zudem idiomatischer als „sich … gegen deinen Mund setzt“.
  revised_text: Verachte auch ihre alltäglichen Gespräche nicht[a]; denn von ihm wirst du lernen, wie man vor Herrschern auftritt.
