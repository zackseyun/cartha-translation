translation:
  language: de
  text: Leih keinem Mann, der stärker ist als du; und wenn du ihm doch etwas leihst, betrachte es als verloren.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Überlieferung bietet hier eine andere Warnung: „Fang keinen Streit mit einem jähzornigen Mann an und zieh nicht mit ihm durch die Wüste … Wo keine Hilfe ist, wird er dich niederschlagen.“ Der erhaltene hebräische Text warnt dagegen davor, einem stärkeren Mann etwas zu leihen.'
    reason: textual_variant
lexical_decisions:
- source_word: אַל תַּלְוֶה
  choice: Leih keinem
  rationale: Die verneinte Verbform drückt eine direkte Warnung aus. „Leih keinem“ ist im Deutschen natürlich und gibt den finanziellen Sinn des Hifil von לוה klar wieder.
- source_word: אִישׁ חָזָק מִמְּךָ
  choice: Mann, der mächtiger ist als du
  rationale: אִישׁ bezeichnet ausdrücklich einen Mann. חָזָק kann körperliche Stärke oder gesellschaftliche Macht bezeichnen; im Zusammenhang mit einem schwer eintreibbaren Darlehen trifft „mächtiger“ den wahrscheinlichen Sinn, ohne den Vergleich מִמְּךָ abzuschwächen.
- source_word: וְאִם הִלְוִיתָ
  choice: und wenn du ihm doch etwas leihst
  rationale: Die Bedingung nimmt den Fall auf, dass die vorausgehende Warnung dennoch nicht befolgt wird. „doch“ bringt diesen zugestandenen Fall idiomatisch zum Ausdruck; „ihm“ und „etwas“ machen die im Hebräischen aus dem Zusammenhang erschlossenen Ergänzungen deutlich.
- source_word: כִּמְאַבֵּד
  choice: betrachte es als verloren
  rationale: Die hebräische Wendung ist knapp und elliptisch. Die Übersetzung bewahrt den Vergleichssinn von כ und ergänzt das Darlehen als naheliegendes Bezugsobjekt.
theological_decisions:
- issue: Geschlechtsspezifische Formulierung von אִישׁ
  choice: Mann
  alternative: jemand
  rationale: Der hebräische Text verwendet ausdrücklich das maskuline Singularwort אִישׁ. Da der Zusammenhang keine Verallgemeinerung erzwingt, bleibt diese Form im Haupttext erhalten.
- issue: Stark abweichende griechische Überlieferung
  choice: Die hebräische Warnung vor einem Darlehen an einen mächtigeren Mann steht im Haupttext.
  alternative: Die griechische Warnung vor Streit und Wüstenreise mit einem jähzornigen Mann als Haupttext wiedergeben oder beide Fassungen vermischen.
  rationale: Der erhaltene hebräische Text ist hier die primäre Grundlage und in sich verständlich. Die griechische Fassung bezeugt einen anderen Spruch und wird deshalb transparent in einer Fußnote dokumentiert, nicht mit dem Hebräischen harmonisiert.
translation_notes:
  register: Moderne, klare und würdige Weisheitssprache. Der knappe Imperativ bewahrt den sprichwortartigen Ton; „mächtiger“ macht die soziale Überlegenheit im Zusammenhang eines Darlehens verständlich.
