lexical_decisions:
- source_word: אַל תִּטֹּשׁ
  choice: Wende dich nicht … ab
  rationale: נטש bedeutet verlassen, aufgeben oder im Stich lassen. Die deutsche Wendung gibt die bewusste Abkehr natürlich wieder, ohne das Bild unnötig zu verstärken.
- source_word: שִׂיחַת חֲכָמִים
  choice: von den Gesprächen der Weisen
  rationale: שיחה kann Rede, Gespräch oder betrachtendes Sprechen bezeichnen. „Gespräche“ ist verständlich und umfasst den Austausch beziehungsweise die Unterweisung der Weisen, ohne den Ausdruck auf formale Lehre einzuengen.
- source_word: וּבְחִידֹתֵיהֶם
  choice: in ihre Rätsel
  rationale: חידה bezeichnet ein Rätsel oder einen schwer verständlichen Weisheitsspruch. „Rätsel“ bewahrt die Bildlichkeit und die gedankliche Herausforderung des Hebräischen.
- source_word: הִתְרַפֵּשׂ
  choice: vertiefe dich
  rationale: Die seltene reflexive Verbform ist in diesem Zusammenhang unsicher. Gemeint ist offenbar eine intensive, aktive Beschäftigung mit den Rätseln; „vertiefe dich“ gibt diesen Zusammenhang in natürlichem Deutsch wieder, während die wörtlichere Bildlichkeit in der Fußnote vermerkt wird.
