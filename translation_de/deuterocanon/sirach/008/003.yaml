  text: Do not quarrel with a man who has a sharp tongue, and do not pile wood on his fire.[a]
translation:
  language: de
  text: Plane nichts gegen einen mittellosen Menschen, damit er nicht deinen Preis abwägt und du zugrunde gehst.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich lautet der hebräische Text etwa: „Plane nicht gegen einen Menschen ohne Vermögen, damit er nicht deinen Preis abwägt und du zugrunde gehst.“ Besonders die Wendung „deinen Preis abwägt“ ist in ihrer genauen Bedeutung unklar. Die griechische Überlieferung bietet einen abweichenden Spruch: „Streite nicht mit einem scharfzüngigen Menschen, und häufe kein Holz auf sein Feuer.“'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תַּחֲרֹשׁ / μὴ διαμάχου
  choice: Streite nicht
  rationale: Das überlieferte Hebräisch weist eher auf „sinne/plane nicht gegen“ hin, ist im Gesamtvers jedoch schwer verständlich. Die griechische Parallele μὴ διαμάχου bedeutet klar „streite nicht“ und ergibt zusammen mit dem Feuerbild einen stimmigen Spruch. Der abweichende hebräische Wortlaut wird in der Fußnote bewahrt.
- source_word: עַל אִישׁ לֹא הוֹן / μετὰ ἀνθρώπου γλωσσώδους
  choice: mit einem scharfzüngigen Menschen
  rationale: Hebräisch אִישׁ לֹא הוֹן ist wörtlich etwa „ein Mann ohne Vermögen/Substanz“, bleibt hier aber dunkel. Griechisch ἀνθρώπου γλωσσώδους bezeichnet einen wortreichen oder zungenfertigen Menschen; „scharfzüngig“ bringt im Zusammenhang die konfliktverschärfende Wirkung natürlich zum Ausdruck.
- source_word: μὴ ἐπιστοίβαζης ἐπὶ τὸ πῦρ αὐτοῦ ξύλα
  choice: und lege kein Holz auf sein Feuer
  rationale: Die anschauliche griechische Metapher wird knapp und unmittelbar erhalten. Sie warnt davor, einen Streit weiter anzufachen.
