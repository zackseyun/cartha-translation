translation:
  language: de
  text: Verachte es nicht, den Zurückkehrenden[b] zuzuhören, die von ihren Vätern gehört haben.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Überlieferung lautet: „Leih keinem Menschen, der stärker ist als du; und wenn du ihm leihst, betrachte es als verloren.“ Offenbar liegt hier eine andere Texttradition vor.'
    reason: textual_variant
  - marker: b
    text: 'Oder: den Umkehrenden / denen, die umkehren. Das hebräische Wort kann Menschen bezeichnen, die zurückkehren oder umkehren; die genaue Nuance ist hier unsicher.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּמְאַס
  choice: Verachte es nicht
  rationale: Die negative Aufforderung wird direkt wiedergegeben; „verachten“ bewahrt den starken Sinn von מָאַס, während das ergänzte „es“ im Deutschen die folgende Infinitivgruppe natürlich einbindet.
- source_word: בִּשְׁמִיעַת
  choice: zuzuhören
  rationale: Das Substantiv aus der Wurzel שמע bezeichnet hier das Hören beziehungsweise Zuhören. Die verbale Wiedergabe ist im modernen Deutschen natürlicher als „beim Hören“.
- source_word: שָׁבִים
  choice: den Zurückgekehrten
  rationale: Das Partizip bezeichnet seinem Grundsinn nach Menschen, die zurückkehren oder umkehren. „Zurückgekehrte“ hält den räumlichen Grundsinn im Haupttext fest; die mögliche ethisch-religiöse Nuance „Umkehrende“ wird in einer Fußnote bewahrt.
- source_word: אֲשֶׁר שָׁמְעוּ
  choice: die ... gehört haben
  rationale: Der Relativsatz und das hebräische Perfekt werden eng am Wortlaut wiedergegeben. Die ungewöhnliche Offenheit dessen, was sie gehört haben, wird nicht durch einen ergänzten Gegenstand aufgelöst.
- source_word: מֵאֲבֹתָם
  choice: von ihren Vätern
  rationale: Die konkrete Formulierung des Hebräischen bleibt erhalten. „Vorfahren“ wäre kontextuell möglich, würde den Ausdruck jedoch verallgemeinern.
theological_decisions:
- issue: Starke Abweichung zwischen dem erhaltenen hebräischen Text und der griechischen Überlieferung
  choice: Der erhaltene hebräische Spruch bildet den Haupttext.
  alternative: 'Die griechische Überlieferung lautet: „Leih keinem Menschen, der stärker ist als du; und wenn du ihm leihst, betrachte es als verloren.“'
  rationale: Wo ein belastbarer hebräischer Sirach-Text erhalten ist, wird dieser vorrangig übersetzt. Die griechische Fassung bietet hier keinen kleinen Lesartunterschied, sondern einen anderen Spruch und wird daher als eigenständige Texttradition in einer Fußnote dokumentiert.
- issue: Bedeutung von שָׁבִים
  choice: „Zurückgekehrte“ im Haupttext, mit offener Alternativangabe in der Fußnote
  alternative: „Umkehrende“ beziehungsweise „Menschen, die umkehren“
  rationale: Der Ausdruck kann eine tatsächliche Rückkehr oder eine Umkehr bezeichnen. Der Zusammenhang entscheidet die Nuance nicht sicher; deshalb wird keine ausdrücklich religiöse Deutung in den Haupttext eingetragen.
translation_notes:
  register: Moderne, würdevolle Weisheitsrede in direkter Anrede. Die Formulierung bleibt bewusst knapp und lässt sowohl die genaue Art der Rückkehr als auch den nicht genannten Inhalt des Gehörten offen.
