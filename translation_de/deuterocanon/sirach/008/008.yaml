  text: Do not shame an old man[a]; remember that you too will be numbered among the elders.
translation:
  language: de
  text: Beschäme keinen alten Mann[a]; denk daran, dass auch du einmal zu den Alten gezählt wirst.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Überlieferung lautet stattdessen: „Missachte die Rede der Weisen nicht, sondern beschäftige dich mit ihren Sprüchen; denn von ihnen wirst du Bildung lernen und erfahren, wie man großen Männern dient.“ Der hebräische Textzeuge bewahrt hier eine andere Mahnung zum respektvollen Umgang mit alten Menschen.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תְּבַיֵּשׁ
  choice: Beschäme nicht
  rationale: 'Das Piel von בוש ist hier kausativ: jemanden Scham oder Schande erfahren lassen. „Beschäme nicht“ gibt die knappe ethische Mahnung unmittelbar wieder.'
- source_word: אֱנוֹשׁ יָשִׁישׁ
  choice: keinen alten Mann
  rationale: אֱנוֹשׁ bezeichnet einen Menschen beziehungsweise Mann und wird durch יָשִׁישׁ als hochbetagt bestimmt. Die konkrete maskuline Einzahl des Hebräischen bleibt erhalten.
- source_word: זְכֹר
  choice: denk daran
  rationale: Der Imperativ von זכר bedeutet „erinnere dich/denk daran“. „Denk daran“ klingt im modernen Deutschen natürlich und behält den mahnenden Zusammenhang bei.
- source_word: תִמָּנֶה
  choice: wirst gezählt werden
  rationale: 'Das Nifal von מנה hat passiven Sinn: gezählt beziehungsweise einer Gruppe zugerechnet werden. Die Futurumschreibung entspricht dem hebräischen Verbkontext.'
- source_word: מִזְּקֵנִים
  choice: zu den Alten
  rationale: Die Präposition מן bezeichnet hier die Zugehörigkeit zu einer Gruppe. „Zu den Alten gezählt“ ist idiomatisch und wahrt den Altersbezug, ohne den Ausdruck künstlich zu institutionalisieren.
theological_decisions:
- issue: Maskuline Einzahl bei Angesprochenem und Gegenüber
  choice: Die konkrete Form „alter Mann“ wird beibehalten; das „du“ bleibt allgemein anwendbar.
  alternative: „Beschäme keinen alten Menschen; denk daran, dass auch du alt wirst.“
  rationale: Der hebräische Text verwendet eine konkrete maskuline Einzahl. Eine geschlechtsneutrale Wiedergabe würde diese Form glätten; die Mahnung ist dennoch offenkundig allgemein anwendbar.
- issue: Stark abweichende griechische Überlieferung
  choice: Der erhaltene hebräische Text bildet die Grundlage; die griechische Fassung erscheint vollständig in einer Fußnote.
  alternative: Den Haupttext nach der griechischen Mahnung über die Reden und Sprüche der Weisen gestalten.
  rationale: Da ein belastbarer hebräischer Text vorliegt, ist er vorrangig. Die griechische Tradition bietet nicht bloß eine kleine Variante, sondern einen wesentlich anderen Vers und darf daher nicht stillschweigend in den Haupttext eingearbeitet werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Beschäme“ bewahrt die ethische Schärfe; „denk daran“ ist natürlicher als das feierlichere „gedenke“. „Zu den Alten“ folgt dem konkreten Altersbezug des Hebräischen und vermeidet, זְקֵנִים vorschnell als Amts- oder Würdetitel „Älteste“ zu deuten.
