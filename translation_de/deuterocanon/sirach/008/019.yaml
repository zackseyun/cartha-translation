  text: Do not go with a cruel man[a], lest you add weight to your own trouble.
translation:
  language: de
  text: Geh nicht mit einem grausamen Menschen[a], sonst machst du dein Unglück noch schwerer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Parallelüberlieferung lautet: „Offenbare nicht jedem Menschen dein Herz, und erweise dir keine Gunst.“ Der hebräische und der griechische Text unterscheiden sich hier erheblich.'
    reason: alternative_reading
lexical_decisions:
- source_word: אִם אַכְזָרִי
  choice: mit einem grausamen Menschen
  rationale: אַכְזָרִי bezeichnet einen grausamen oder erbarmungslosen Menschen. Die geschlechtsübergreifend natürliche deutsche Wiedergabe „Mensch“ bewahrt den typisierenden Sinn; das schwierige אִם wird im Zusammenhang als Begleitung verstanden.
- source_word: אַל תֵּלֵךְ
  choice: Geh nicht mit
  rationale: Die Wendung bleibt nahe bei der Grundbedeutung von הלך („gehen“) und bezeichnet hier das Mitgehen beziehungsweise die Gemeinschaft mit jemandem, ohne stärker deutend „lass dich nicht ein“ zu formulieren.
- source_word: פֶּן
  choice: sonst
  rationale: פֶּן leitet die unerwünschte Folge ein. „Sonst“ ist im modernen Deutschen natürlich und erhält den warnenden Ton.
- source_word: תַּכְבִּיד
  choice: machst ... noch schwerer
  rationale: Der Hifil von כבד bedeutet „schwer machen“. Die Formulierung bewahrt das hebräische Bild der Schwere und klingt zugleich idiomatisch.
- source_word: אֶת רָעָתֶךָ
  choice: dein Unglück
  rationale: רָעָה kann Böses, Schaden, Not oder Unglück bedeuten. Hier bezeichnet es am ehesten das den Angesprochenen treffende Unheil; „Unglück“ lässt diese Breite eher offen als eine moralische Wiedergabe mit „Böses“.
theological_decisions:
- issue: Starke Abweichung zwischen dem erhaltenen hebräischen Text und der griechischen Überlieferung
  choice: Der Haupttext folgt dem erhaltenen hebräischen Zeugen; die griechische Fassung wird in einer Fußnote vollständig als abweichende Lesart angegeben.
  alternative: 'Griechisch: „Offenbare nicht jedem Menschen dein Herz, und lass ihn dir nicht mit einer Gunst vergelten.“'
  rationale: Da für diesen Vers ein hebräischer Text mit hoher Vertrauenswürdigkeit vorliegt, bildet er die Grundlage der Übersetzung. Die inhaltlich wesentlich andere griechische Fassung kann auf eine andere Vorlage oder Textentwicklung zurückgehen und wird deshalb transparent dokumentiert, ohne beide Fassungen anzugleichen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Geh nicht mit“ hält die knappe Mahnform des Hebräischen fest; „machst du dein Unglück noch schwerer“ bewahrt das Bild von כבד in natürlicher deutscher Wortstellung. Der Fußnotenmarker [a] steht unmittelbar nach der abweichenden hebräischen Aussageeinheit.
