  text: Do not shame a man who turns back from transgression[a]; remember that we all are guilty.
translation:
  language: de
  text: Beschäme keinen Mann, der sich von einer Übertretung abkehrt; denk daran, dass wir alle schuldig sind.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Parallelüberlieferung lautet: „Freu dich nicht über einen Toten; denk daran, dass wir alle sterben.“ Der hebräische Text weicht hier in beiden Vershälften ab; der Haupttext folgt dem erhaltenen Hebräisch und gibt die griechische Fassung als alternative Lesart wieder.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תַּכְלִים
  choice: Beschäme nicht
  rationale: Der Hifil von כלם bezeichnet, jemanden zu beschämen oder der Schande preiszugeben. „Beschämen“ gibt die zwischenmenschliche Wirkung knapp und natürlich wieder.
- source_word: אִישׁ
  choice: keinen Mann
  rationale: Das hebräische Substantiv steht ausdrücklich im maskulinen Singular. Die Wiedergabe bewahrt diese Form, ohne den Satz unnötig zu verallgemeinern.
- source_word: שָׁב מִפֶּשֶׁע
  choice: der von einer Übertretung umkehrt
  rationale: שוב mit מן beschreibt das Umkehren beziehungsweise Zurückkehren von etwas weg. „Umkehrt“ erhält das anschauliche Bewegungsbild, während „Übertretung“ den moralisch-rechtlichen Klang von פשע wahrt.
- source_word: זְכֹר
  choice: denk daran
  rationale: Die Wendung ist im modernen Standarddeutsch natürlicher als das isolierte „erinnere dich“, bleibt aber ein unmittelbarer Imperativ.
- source_word: כִּי כֻּלָּנוּ חַיָּבִים
  choice: dass wir alle schuldig sind
  rationale: חַיָּבִים kann „schuldig“, „haftbar“ oder „verpflichtet“ bedeuten. „Schuldig“ ist hier idiomatisch und bewahrt den moralisch-rechtlichen Sinn, ohne die Aussage wie die griechische Lesart ausdrücklich auf den Tod einzuengen.
theological_decisions:
- issue: Hebräischer Text gegenüber der abweichenden griechischen Parallelüberlieferung
  choice: 'Der Haupttext folgt dem erhaltenen Hebräisch: „denk daran, dass wir alle schuldig sind“.'
  alternative: „Freu dich nicht über einen Toten; denk daran, dass wir alle sterben.“
  rationale: Da für diesen Vers ein hebräischer Text vorliegt, bestimmt er den Haupttext. Die griechische Überlieferung weicht in beiden Vershälften erheblich ab und wird deshalb als bedeutsame alternative Lesart vollständig in der Fußnote erhalten.
- issue: Sprache der Umkehr
  choice: „der von einer Übertretung umkehrt“
  alternative: „der seine Sünde bereut“
  rationale: Das Hebräische verwendet das konkrete Verb des Umkehrens und keinen engeren theologischen Fachausdruck. Die Übersetzung bewahrt dieses Bild und lässt die Beziehung zwischen Umkehr und Schuld offen.
- issue: Bedeutung von חַיָּבִים
  choice: „schuldig sind“
  alternative: „haftbar sind“ oder, nach dem Griechischen, „sterben“
  rationale: „Schuldig“ gibt die wahrscheinlichste Bedeutung im hebräischen Zusammenhang natürlich wieder. Die weiter gefasste rechtliche Nuance bleibt erkennbar; die abweichende Deutung als allgemeine Sterblichkeit wird nicht in den hebräischen Haupttext eingetragen.
translation_notes:
  register: Modernes, gut verständliches und zugleich würdevolles Standarddeutsch. „Beschämen“, „Übertretung“ und „umkehren“ bewahren den weisheitlich-moralischen Ton; „denk daran“ vermeidet unnötig altertümliche Ausdrucksweise. Das Semikolon erhält die knappe Zweiteilung des hebräischen Satzes.
