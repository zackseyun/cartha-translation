translation:
  language: de
  text: Streite nicht mit einem mächtigen Mann, damit du nicht in seine Hände fällst.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher lautet das Hebräische etwa: „Warum solltest du in seine Hand gegeben werden?“ Die griechische Parallele stützt den Sinn: „damit du nicht in seine Hände fällst“.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תָּרִיב
  choice: Streite nicht
  rationale: ריב bezeichnet das Eintreten in einen Streit oder Rechtsstreit. „Streite nicht“ ist im modernen Deutsch natürlich und gibt die ausdrückliche Warnung knapp wieder.
- source_word: עִם אִישׁ גָּדוֹל
  choice: mit einem mächtigen Mann
  rationale: גָּדוֹל bedeutet wörtlich „groß“, bezeichnet hier aber nach dem Weisheitskontext und dem griechischen δυνάστης einen gesellschaftlich oder politisch Mächtigen. „Mächtig“ vermeidet eine missverständliche Deutung als körperliche Größe oder moralische Bedeutung.
- source_word: לָמָּה תִשּׁוֹם עַל יָדוֹ
  choice: damit du nicht in seine Hände fällst
  rationale: Der überlieferte hebräische Wortlaut ist ungewöhnlich und ließe sich wörtlicher mit „Warum solltest du in seine Hand gegeben werden?“ wiedergeben. Die griechische Parallele formuliert eindeutig eine warnende Folge. Die deutsche Wendung gibt diesen Sinn idiomatisch wieder; der Plural „Hände“ entspricht der natürlichen deutschen Redensart.
theological_decisions: []
