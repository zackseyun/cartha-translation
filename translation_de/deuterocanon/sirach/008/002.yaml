translation:
  language: de
  text: Streite nicht mit jemandem, der stärker ist als du, damit du ihm nicht in die Hände fällst.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Überlieferung bietet hier einen deutlich anderen und längeren Text: „Streite nicht mit einem reichen Menschen, damit er nicht sein Gewicht gegen dich einsetzt; denn Gold hat viele zugrunde gerichtet und die Herzen von Königen abgewendet.“'
    reason: Der erhaltene griechische Paralleltext weicht in Inhalt und Umfang erheblich vom hebräischen Text ab; diese wichtige Textvariante sollte sichtbar bleiben, ohne den hoch eingestuften hebräischen Ausgangstext zu ersetzen.
lexical_decisions:
- source_word: קָשֶׁה מִמְּךָ
  choice: der stärker ist als du
  rationale: קָשֶׁה bedeutet wörtlich „hart“ oder „stark“. Im Zusammenhang eines Streits und der Gefahr, in die Gewalt des anderen zu geraten, gibt „stärker“ den gemeinten Vergleich im natürlichen Deutschen am klarsten wieder.
- source_word: תִפּוֹל בְּיָדוֹ
  choice: du ihm … in die Hände fällst
  rationale: Die hebräische Wendung bezeichnet, unter die Gewalt oder Kontrolle eines anderen zu geraten. Die deutsche Redewendung „jemandem in die Hände fallen“ bewahrt Bild und Sinn.
- source_word: לָמָּה
  choice: damit … nicht
  rationale: Die Form kann wörtlich als Frage „Warum solltest du …?“ verstanden werden, fungiert hier jedoch als Warnung vor der Folge des Streitens. Die negative Zweck-/Folgeformulierung ergibt im Deutschen einen klaren, würdigen Satz und entspricht dem Sinn des englischen Konsultationstextes „lest“.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit knapper weisheitlicher Warnung. „Streite nicht“ ist direkt und würdig; „in die Hände fallen“ erhält das konkrete Bild des Hebräischen.
