  source_fidelity: 'Der deutsche Haupttext gibt den hebräischen Text zuverlässig wieder: קָשֶׁה מִמְּךָ bezeichnet im Kontext einen dem Angesprochenen überlegenen bzw. stärkeren Gegner, und „damit du ihm nicht in die Hände fällst“ trifft לָמָּה תִפּוֹל בְּיָדוֹ idiomatisch und bildhaft. Die warnende Folgebeziehung von לָמָּה ist angemessen als „damit ... nicht“ formuliert. Die griechische Langfassung wird korrekt als deutlich abweichende Parallelüberlieferung ausgewiesen, ohne den hebräischen Ausgangstext zu verdrängen.'
