  terminology: „Stärker“ ist für קָשֶׁה in diesem Konfliktzusammenhang eine sachgerechte, nicht überinterpretierende deutsche Wiedergabe. Die Fußnote benennt den reichen Menschen und die Gold-Aussage der griechischen Fassung verständlich; der Anker steht eindeutig am gesamten Vers.
