  text: Do not contend with a judge[a], for he will judge according to his own will.
translation:
  language: de
  text: Führe keinen Rechtsstreit mit einem Richter[a], denn er wird nach seinem eigenen Willen urteilen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Text bietet hier einen anderen Spruch: „Tu vor einem Fremden nichts im Verborgenen, denn du weißt nicht, was es hervorbringen wird.“ Im Haupttext wird dem hebräischen Text aus der Kairoer Geniza gefolgt, da dieser Vers auf Hebräisch erhalten ist; die Abweichung ist jedoch erheblich.'
    reason: textual_variant
lexical_decisions:
- source_word: אַל תּשָּׁפֵט
  choice: Führe keinen Rechtsstreit
  rationale: Die verneinte Verbform gibt eine Warnung beziehungsweise ein Verbot wieder. שפט bezeichnet mit עִם und angesichts des folgenden „Richters“ hier am ehesten eine rechtliche Auseinandersetzung, nicht das eigene Ausüben des Richteramts.
- source_word: עִם שׁוֹפֵט
  choice: mit einem Richter
  rationale: עִם bedeutet wörtlich „mit“; zusammen mit „einen Rechtsstreit führen“ ist die gegnerische Beziehung im Deutschen klar, ohne die Formulierung unnötig zu verschärfen.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion führt die Begründung der Warnung ein und entspricht dem knappen Stil eines Weisheitsspruchs.
- source_word: כִּרְצוֹנוֹ
  choice: nach seinem eigenen Willen
  rationale: רָצוֹן bezeichnet hier den persönlichen Willen oder das eigene Belieben des Richters. Die Formulierung bewahrt den Vorwurf möglicher Willkür, ohne ihn weiter auszudeuten.
- source_word: יִשְׁפֹּט
  choice: wird urteilen
  rationale: Die Übersetzung hält den rechtlichen Sinn des Verbs fest und lässt zugleich den Wortstammzusammenhang mit תּשָּׁפֵט erkennen.
theological_decisions: []
translation_notes:
