  text: In the sight of every living thing—and even after his death he was sought out.[a]
translation:
  language: de
  text: Vor den Augen aller Lebenden – und selbst nach seinem Tod wurde er befragt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Parallele führt dies ausführlicher aus: „Nachdem er entschlafen war, weissagte er und zeigte dem König dessen Ende; aus der Erde erhob er seine Stimme in prophetischer Rede, um die Gesetzlosigkeit des Volkes zu tilgen.“ Dies erklärt wahrscheinlich die hebräische Aussage „wurde er befragt“ als Hinweis darauf, dass Samuel nach seinem Tod um Auskunft angegangen wurde.'
    reason: alternative_reading
lexical_decisions:
- source_word: ובעיני
  choice: Vor den Augen
  rationale: Die Wendung gibt das hebräische Bild wörtlich und zugleich idiomatisch wieder. Sie bewahrt den öffentlichen, für alle wahrnehmbaren Bezug.
- source_word: כל חי
  choice: aller Lebenden
  rationale: Die substantivierte Form ist im Deutschen natürlich und bezieht die hebräische Aussage im Kontext auf alle lebenden Menschen, ohne ihren weiten Wortlaut unnötig einzuengen.
- source_word: וגם
  choice: und selbst
  rationale: '„Selbst“ bringt die steigernde Kraft der Verbindung zum Ausdruck: Samuels Bedeutung reichte sogar über seinen Tod hinaus.'
- source_word: אחרי מותו
  choice: nach seinem Tod
  rationale: Dies ist eine klare, formnahe und im modernen Deutschen natürliche Wiedergabe der Zeitangabe.
- source_word: נדרש
  choice: wurde er befragt
  rationale: Das Nifal von דרש kann „gesucht“ oder „befragt/um Auskunft angegangen werden“ bedeuten. Im Zusammenhang mit der Befragung Samuels nach seinem Tod und angesichts der griechischen Parallele trifft „befragt“ den gemeinten Vorgang, ohne die ausführlicheren Angaben des Griechischen in den Haupttext zu übernehmen.
theological_decisions:
- issue: Wie ausdrücklich Samuels Wirken nach seinem Tod wiederzugeben ist
  choice: 'Der knappe hebräische Wortlaut bleibt im Haupttext maßgeblich: Samuel „wurde … befragt“.'
  alternative: 'Die ausführliche griechische Fassung in den Haupttext aufnehmen: Samuel weissagte nach seinem Entschlafen, kündigte dem König sein Ende an und erhob seine Stimme aus der Erde.'
  rationale: Der erhaltene hebräische Text hat Vorrang und formuliert zurückhaltend. Die griechische Parallele erläutert wahrscheinlich den erzählerischen Bezug, soll aber nicht stillschweigend an die Stelle der kürzeren hebräischen Lesart treten; deshalb wird sie in einer Fußnote dokumentiert.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit knapper biblischer Prägung. Der Gedankenstrich erhält den fragmentarisch-anschließenden Charakter des hebräischen ersten Satzteils und hebt zugleich die Steigerung „selbst nach seinem Tod“ hervor.
