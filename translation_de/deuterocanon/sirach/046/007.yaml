base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/046/007.yaml
  text: Also[a], because he fully followed God, and in the days of Moses showed loyalty—he and Caleb son of Jephunneh—by standing firm against the assembly's rebellion, to keep the people from sin and to silence wicked grumbling.
translation:
  language: de
  text: Auch er folgte Gott ganz nach und erwies in den Tagen des Mose Treue[a] – er und Kaleb, der Sohn Jefunnes –, indem sie sich dem Aufruhr der Gemeinde entgegenstellten[b], um das Volk von der Sünde abzuhalten und böses Murren zum Schweigen zu bringen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „erwies er Erbarmen“. Das hebräische Wort חסד und das entsprechende griechische ἔλεος können auch Erbarmen oder Güte bezeichnen; hier legt der Zusammenhang treues Handeln nahe.'
    reason: lexical_alternative
  - marker: b
    text: 'Der hebräische Wortlaut ist knapp und etwas unsicher: „indem sie sich beim Aufruhr der Gemeinde hinstellten“. Der griechische Text lautet ausführlicher: „um sich dem Feind entgegenzustellen, das Volk von der Sünde abzuhalten und böses Murren zu beenden“.'
    reason: textual_variant
lexical_decisions:
- source_word: מלא אחרי אל
  choice: Gott ganz nachfolgte
  rationale: Die hebräische Wendung bezeichnet uneingeschränkte, rückhaltlose Nachfolge. Die Formulierung bleibt nahe am biblischen Sprachbild und ist zugleich im heutigen Deutsch verständlich.
- source_word: עשה חסד
  choice: handelte ... treu
  rationale: חסד kann Erbarmen, Güte oder bundestreue Loyalität bezeichnen. Hier steht Josuas bewährte Treue in der Zeit des Mose im Vordergrund; die mögliche Bedeutung „erwies Erbarmen“ wird in einer Fußnote bewahrt.
- source_word: להתיצב
  choice: indem sie sich ... entgegenstellten
  rationale: Das Verb bezeichnet hier ein entschiedenes Auftreten beziehungsweise Widerstandleisten. Der deutsche Plural nimmt „er und Kaleb“ natürlich auf.
- source_word: בפרע קהל
  choice: dem Aufruhr der Gemeinde
  rationale: Die knappe und textlich schwierige hebräische Formulierung weist auf das Sichentfesseln beziehungsweise den Aufruhr der Versammlung. „Aufruhr der Gemeinde“ wahrt diesen Sinn, ohne die griechische Lesart „Feind“ in den hebräischen Wortlaut einzutragen.
- source_word: κωλῦσαι λαὸν ἀπὸ ἁμαρτίας
  choice: um das Volk von der Sünde abzuhalten
  rationale: Diese im griechischen Paralleltext erhaltene Zweckangabe wird klar und direkt wiedergegeben.
- source_word: κοπάσαι γογγυσμὸν πονηρίας
  choice: böses Murren zum Schweigen zu bringen
  rationale: „Murren“ bewahrt den charakteristischen Ausdruck der Wüstenerzählungen; „böses“ gibt die moralische Wertung von πονηρίας wieder.
theological_decisions:
- issue: Ergänzung des knappen hebräischen Textes aus dem griechischen Paralleltext
  choice: Die griechisch überlieferten Zweckangaben „um das Volk von der Sünde abzuhalten und böses Murren zum Schweigen zu bringen“ stehen im Haupttext; die abweichende Überlieferung wird offengelegt.
  alternative: Nur den erhaltenen hebräischen Wortlaut wiedergeben und nach „Aufruhr der Gemeinde“ schließen; oder dem Griechischen mit „gegen den Feind“ folgen.
  rationale: Der hebräische Sirachtext bleibt vorrangig, ist an dieser Stelle jedoch knapp und als leicht abweichend ausgewiesen. Der griechische Text dürfte einen volleren Textstand bewahren. Die Fußnote macht transparent, welcher Teil textkritisch unsicher ist, statt die Zeugen stillschweigend gleichzusetzen.
- issue: Bedeutung von חסד / ἔλεος
  choice: treu handeln
  alternative: Erbarmen erweisen
  rationale: Im erzählerischen Zusammenhang beschreibt die Wendung vor allem bewährte Loyalität gegenüber Gott und Mose. Da sowohl der hebräische als auch der griechische Ausdruck auch Erbarmen bezeichnen kann, bleibt diese Möglichkeit in der Fußnote ausdrücklich erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Nachfolgen“, „Gemeinde“ und „Murren“ bewahren vertraute biblische Sprachbilder, ohne altertümliche Syntax zu verwenden. Der Gedankenstrich bildet die eingeschobene Nennung Kalebs ab; der anschließende Plural verdeutlicht, dass beide gemeinsam handelten.
