  text: And at the time of his resting on his bed[b][a], he testified before Yahweh and his anointed one.
translation:
  language: de
  text: Und als er auf seinem Bett zur Ruhe kam, rief er den HERRN und seinen Gesalbten zu Zeugen an.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort für „Gesalbter“ stammt aus derselben Wortwurzel wie „Messias“; hier kann es besonders den vom HERRN gesalbten Herrscher zur Zeit Samuels bezeichnen.
    reason: lexical_alternative
  - marker: b
    text: 'Der griechische Text weicht hier stark ab: Er sagt, Samuel habe „die Anführer von Tyrus und alle Herrscher der Philister vernichtet“. Außerdem kann das hebräische Verb statt „zu Zeugen anrufen“ auch im Sinn von „vor … Zeugnis ablegen“ verstanden werden.'
    reason: textual_variant_and_ambiguity
lexical_decisions:
- source_word: ועת נוחו על משכבו
  choice: Und als er auf seinem Bett zur Ruhe kam
  rationale: Die Wendung bezeichnet den Zeitpunkt seiner Ruhe auf dem Lager. Die deutsche Fassung ist natürlich und wahrt, ohne ausdrücklich „Sterbebett“ zu sagen, den im Zusammenhang möglichen Hinweis auf Samuels letzte Ruhe.
- source_word: העיד
  choice: rief ... zu Zeugen an
  rationale: Das Hifil von עוד kann „Zeugnis ablegen“, „warnen“ oder „zum Zeugen anrufen“ bedeuten. Da יהוה und משיחו als Objekte folgen, passt hier am besten, dass Samuel beide als Zeugen anrief.
- source_word: יהוה
  choice: der HERR
  rationale: Das Tetragramm wird nach der üblichen deutschen Bibeltradition mit „der HERR“ wiedergegeben.
- source_word: ומשיחו
  choice: und seinen Gesalbten
  rationale: משיחו bedeutet wörtlich „seinen Gesalbten“. Die Übersetzung bewahrt den Titel und legt dessen historischen Träger nicht ausdrücklich fest.
theological_decisions:
- issue: Deutung von משיחו
  choice: seinen Gesalbten
  alternative: seinen Messias; seinen König
  rationale: „Gesalbter“ bewahrt die Grundbedeutung und den möglichen Bezug auf den gesalbten Herrscher zur Zeit Samuels, ohne eine spätere messianische Deutung auszuschließen oder aufzuzwingen.
- issue: Syntaktische Deutung von העיד mit יהוה ומשיחו
  choice: rief den HERRN und seinen Gesalbten zu Zeugen an
  alternative: legte vor dem HERRN und seinem Gesalbten Zeugnis ab
  rationale: Die Objektkonstruktion spricht eher für das Anrufen als Zeugen. Da das Verb jedoch semantisch mehrdeutig ist, wird die alternative Auffassung in einer Fußnote kenntlich gemacht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Zur Ruhe kam“ vermeidet die überdeutliche Festlegung auf „starb“, während „auf seinem Bett“ das konkrete hebräische Bild erhält. Die Fußnotenmarker stehen vollständig im Haupttext.
