  terminology: „HERR“ ist die etablierte deutsche Wiedergabe des Tetragramms. „Gesalbten“ gibt משיחו sachgerecht wieder und vermeidet eine im Deutschen stärker später-theologisch geprägte Festlegung durch „Messias“. Die lexikalische Fußnote erläutert dies ausgewogen.
