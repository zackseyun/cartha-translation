  source_fidelity: Die Übersetzung gibt ועת נוחו על משכבו treffend als zeitliche Aussage über sein Zur-Ruhe-Kommen auf dem Bett wieder, ohne das nur kontextuell naheliegende Sterben ausdrücklich einzutragen. „rief ... zu Zeugen an“ ist für העיד mit יהוה ומשיחו als Objekten eine gut begründete Wiedergabe und wahrt die mögliche Nuance gegenüber „legte ... Zeugnis ab“. „den HERRN“ und „seinen Gesalbten“ entsprechen יהוה und ומשיחו; der Titel wird nicht unzulässig zu einem Eigennamen konkretisiert. Die deutliche Abweichung des griechischen Paralleltextes ist korrekt als Textvariante vermerkt.
