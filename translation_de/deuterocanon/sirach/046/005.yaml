base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/046/005.yaml
  text: For he called on God Most High when his enemies pressed him from all around[a], and God Most High answered him with hailstones and ice-stones.
translation:
  language: de
  text: Denn er rief zu Gott, dem Höchsten, als seine Feinde ihn von allen Seiten bedrängten[a]. Und Gott, der Höchste, antwortete ihm mit Hagelsteinen und Eissteinen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Griechisch: „Er rief den höchsten Herrscher an, als Feinde ihn ringsum bedrängten; und der große Herr erhörte sie/ihn mit Hagelsteinen, mit gewaltiger Macht.“ Der hebräische Text ist hier maßgeblich; der griechische Paralleltext formuliert die Sturmerscheinung ausführlicher.'
    reason: alternative_reading
lexical_decisions:
- source_word: קרא אל
  choice: rief zu
  rationale: Die Verbindung bezeichnet hier den Hilferuf an Gott. „Rief zu“ ist im Deutschen natürlich, würdevoll und wird durch das griechische ἐπεκαλέσατο gestützt.
- source_word: אל עליון
  choice: Gott, der Höchste
  rationale: Die Wiedergabe bewahrt sowohl den Gottesbegriff als auch den Hoheitstitel und bleibt in beiden Satzhälften gleich.
- source_word: כאכפה לו אויביו מסביב
  choice: als seine Feinde ihn von allen Seiten bedrängten
  rationale: Die seltene beziehungsweise unsichere hebräische Form beschreibt feindlichen Druck ringsum; das griechische θλίψαι und κυκλόθεν stützt „bedrängten“ und „von allen Seiten“.
- source_word: ויענהו
  choice: antwortete ihm
  rationale: Das hebräische Verb bezeichnet ausdrücklich eine Antwort; der griechische Paralleltext versteht sie als erhörendes Hören.
- source_word: באבני ברד
  choice: mit Hagelsteinen
  rationale: Die Präposition bezeichnet hier wahrscheinlich das Mittel der göttlichen Antwort. „Mit Hagelsteinen“ gibt dies idiomatisch wieder.
- source_word: ואַלְגָּבִישׁ
  choice: und Eiskörnern
  rationale: Der seltene Ausdruck gehört zum Wortfeld einer Sturmtheophanie und wird neben „Hagelsteinen“ bewusst eigenständig wiedergegeben, ohne ihn mit dem vorherigen Begriff zusammenzuziehen.
theological_decisions:
- issue: Wiederholung des Gottestitels
  choice: „Gott, der Höchste“ in beiden Satzhälften wiederholen
  alternative: Beim zweiten Vorkommen nur „der Höchste“ schreiben
  rationale: Das Hebräische wiederholt אל עליון. Die Wiederholung betont, dass derselbe Gott, den er anruft, ihm auch antwortet, ohne darüber hinaus eine Lehrentscheidung einzutragen.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem, gut verständlichem biblischem Ton. Die Wiederholung des Gottestitels und die zweigliedrige Unwetterformulierung des Hebräischen bleiben erhalten; die Unsicherheit des griechischen Pronomens wird nur in der Fußnote sichtbar gemacht.
