translation:
  language: de
  text: Er schleuderte Verderben auf ein feindliches Volk, und als sie flohen, vernichtete er sie alle, damit jedes Volk den Bann[a] erkenne; denn Jahwe wacht über ihren Kampf.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '„Bann“ (hebräisch חרם) bezeichnet etwas, das unter göttlichem Gericht der Vernichtung geweiht ist. Die hebräische Wortgruppe ist sehr knapp und syntaktisch unsicher; möglich ist auch: „damit jedes Volk ihren Bann erkenne“.'
    reason: lexical_alternative
  - marker: b
    text: 'Die griechische Parallelüberlieferung weicht deutlich ab: Sie spricht davon, dass er Krieg auf ein Volk niedergehen ließ und die Widerstehenden bei der Niederwerfung vernichtete, damit die Völker ihre Bewaffnung kennten. Sie fügt hinzu: „Sein Krieg ist vor dem Herrn“, und führt den Satz über die Nachfolge hinter dem Mächtigen weiter.'
    reason: alternative_reading
lexical_decisions:
- source_word: השליך
  choice: schleuderte
  rationale: Das Verb bezeichnet ein kraftvolles Werfen; „schleuderte“ bewahrt den gewaltsamen, kriegerischen Ton.
- source_word: גוי אויב
  choice: ein feindliches Volk
  rationale: גוי bezeichnet eine Nation oder ein Volk als Kollektiv; „feindliches Volk“ klingt im Deutschen natürlich und hält den kollektiven Sinn fest.
- source_word: ובנוסם
  choice: als sie flohen
  rationale: Die Konstruktion bezeichnet den begleitenden zeitlichen Umstand und wird idiomatisch als „als sie flohen“ wiedergegeben.
- source_word: האביד כולם
  choice: vernichtete er sie alle
  rationale: Das Hifil von אבד bedeutet „zugrunde richten/vernichten“; „sie alle“ gibt כולם ausdrücklich wieder und wahrt einen würdigen, formellen Stil.
- source_word: למען דעת כל גוי
  choice: damit jedes Volk ... erkenne
  rationale: Die Zweckkonstruktion wird klar mit „damit“ wiedergegeben; „jedes Volk“ erhält die distributive Kraft von כל גוי.
- source_word: חרם
  choice: den an ihnen vollstreckten Bann
  rationale: חרם ist ein Begriff des Bannkriegs für die unter göttlichem Gericht der Vernichtung geweihte Sache. Die Ergänzung „an ihnen vollstreckten“ macht den knappen hebräischen Nominalsatz im Deutschen verständlich, ohne den Fachbegriff „Bann“ aufzugeben.
- source_word: כי צופה
  choice: denn ... wacht über
  rationale: צפה bedeutet beobachten oder Wache halten. „Wacht über“ bewahrt im militärischen Zusammenhang sowohl Aufsicht als auch mögliche schützende Anteilnahme.
- source_word: יהוה
  choice: Jahwe
  rationale: Der Eigenname יהוה wird transparent als „Jahwe“ wiedergegeben.
- source_word: מלחמתם
  choice: ihren Kampf
  rationale: 'Das Suffix bleibt bewusst mehrdeutig: „ihren“ kann sich im Zusammenhang auf den Kampf der zuvor genannten Beteiligten beziehen; „Kampf“ passt zur konkreten Kriegsszene.'
theological_decisions:
- issue: Bedeutung von חרם in der knappen und schwierigen Wendung כל גוי חרם
  choice: „den an ihnen vollstreckten Bann“ im Haupttext, mit Erläuterung in einer Fußnote
  alternative: „ihren Bann“, „ihre der Vernichtung geweihte Bestimmung“ oder „den Bann“
  rationale: Der hebräische Wortlaut ist stark verdichtet und חרם ist theologisch wie kriegsgeschichtlich aufgeladen. „Bann“ bewahrt den Schlüsselbegriff; die syntaktische Verdeutlichung vermeidet ein im Deutschen kaum verständliches „ihren Bann“, ohne die Bedeutung zu verharmlosen.
- issue: Vorrang des erhaltenen hebräischen Textes gegenüber der abweichenden griechischen Parallelüberlieferung
  choice: Der Haupttext folgt dem Hebräischen; die griechische Fassung wird in einer Fußnote dokumentiert.
  alternative: Eine griechisch gestützte Wiedergabe mit „Krieg“, „den Widerstehenden“ und „vor dem Herrn“
  rationale: Wo ein hebräischer Sirach-Text erhalten ist, bildet er die primäre Grundlage. Die deutliche griechische Abweichung ist textgeschichtlich bedeutsam, soll aber nicht unmarkiert in den Haupttext eingetragen werden.
- issue: Bezug des Suffixes in מלחמתם
  choice: „ihren Kampf“
  alternative: „seinen Kampf“ nach der griechischen Überlieferung oder eine explizite Zuordnung zu Israel
  rationale: Das hebräische Pluralsuffix wird formal bewahrt. Eine eindeutige Identifikation der Kämpfenden würde die im knappen Kontext bestehende Bezugsoffenheit vorschnell auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit deutlich kriegerischem Ton. Der Haupttext folgt dem erhaltenen Hebräisch; schwierige Verdichtung und griechische Abweichungen werden nicht stillschweigend harmonisiert.
