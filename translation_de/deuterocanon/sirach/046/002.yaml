  text: How glorious he was when he stretched out his hand[a], when he brandished a spear against a city.
translation:
  language: de
  text: Wie herrlich war er, als er seine Hand ausstreckte[a], als er den Speer gegen eine Stadt schwang!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Paralleltext lautet: „Wie wurde er verherrlicht, als er seine Hände erhob und das Schwert gegen Städte schwang.“ Der hebräische Text hat: „den Speer gegen eine Stadt schwang“.'
    reason: alternative_reading
lexical_decisions:
- source_word: מה נהדר
  choice: Wie herrlich war er
  rationale: Die hebräische Ausrufform drückt Bewunderung aus. „Herrlich“ gibt נהדר würdig und verständlich wieder und steht zugleich dem griechischen ἐδοξάσθη nahe.
- source_word: בנטותו יד
  choice: als er seine Hand ausstreckte
  rationale: Die Infinitivkonstruktion bezeichnet den zeitlichen oder begleitenden Umstand. Die Wiedergabe bewahrt das hebräische Bild einer entschlossenen militärischen Gebärde.
- source_word: בהניפו כידון
  choice: als er den Speer ... schwang
  rationale: הניף bezeichnet hier das Erheben oder Schwingen einer Waffe; כידון ist ein Speer beziehungsweise Wurfspeer. „Den Speer schwang“ ist anschaulich, idiomatisch und folgt dem vorrangigen hebräischen Zeugen.
- source_word: על עיר
  choice: gegen eine Stadt
  rationale: על bezeichnet im kriegerischen Zusammenhang die feindliche Ausrichtung. Der Singular des hebräischen Textes bleibt erhalten.
theological_decisions:
- issue: Abweichung zwischen dem hebräischen und dem griechischen Waffenbegriff
  choice: Im Haupttext steht nach dem Hebräischen „Speer“.
  alternative: Der griechische Paralleltext hat „Schwert“.
  rationale: Der gut bezeugte hebräische Text ist hier die primäre Grundlage. Die sachlich bedeutsame griechische Variante wird in der Fußnote transparent dokumentiert.
- issue: Nuance der rühmenden Aussage
  choice: „Wie herrlich war er“ als Ausdruck der Bewunderung
  alternative: „Wie prächtig war er“ oder, dem Griechischen näher, „Wie wurde er verherrlicht“
  rationale: Die Formulierung gibt das hebräische Lob wieder, ohne eine weitergehende theologische Aussage in den Vers einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Ausruf bewahrt den feierlich-rühmenden Ton; die beiden parallelen als-Sätze geben die hebräische Struktur natürlich wieder.
