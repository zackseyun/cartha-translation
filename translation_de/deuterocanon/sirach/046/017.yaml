  text: In a mighty crash his voice was heard[a], and the leaders of the foe were subdued[c][b], and all the rulers of the Philistines perished.
translation:
  language: de
  text: Bei gewaltigem Krachen war seine Stimme zu hören[a]; die Anführer des Feindes wurden bezwungen[b], und alle Fürsten der Philister kamen um[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: »bei/mit gewaltigem Krachen«. Der griechische Paralleltext sagt ausführlicher, dass der Herr vom Himmel donnerte und seine Stimme mit mächtigem Schall hören ließ.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: »die Besatzungen des Feindes«, falls נציבי nicht auf Anführer, sondern auf militärische Posten oder Garnisonen bezogen wird.'
    reason: lexical_alternative
  - marker: c
    text: 'Der hebräische Ausdruck bezeichnet den besonderen philistäischen Herrschertitel, der auch in 1 Samuel begegnet; alternativ: »Herren der Philister«.'
    reason: cross_reference
lexical_decisions:
- source_word: בפרע אדיר
  choice: unter gewaltigem Krachen
  rationale: Die schwierige hebräische Wendung bezeichnet im Zusammenhang ein heftiges, lautes Schallereignis. »Krachen« bewahrt diese Wucht, ohne das im griechischen Paralleltext ausdrücklich genannte Donnern unmittelbar in den hebräischen Wortlaut einzutragen.
- source_word: נשמע קולו
  choice: wurde seine Stimme gehört
  rationale: Die passive Form gibt die hebräische Syntax eng wieder. Das Pronomen verweist im Kontext auf Gott; der griechische Paralleltext bestätigt diesen Bezug ausdrücklich.
- source_word: ויכנע
  choice: wurden niedergezwungen
  rationale: Das Verb kann Erniedrigung oder Unterwerfung ausdrücken. Im militärischen Zusammenhang vermittelt »niedergezwungen« die Bedeutung klar und natürlich.
- source_word: נציבי צר
  choice: die Anführer des Feindes
  rationale: נציב kann einen Amtsträger oder Anführer, aber auch einen militärischen Posten beziehungsweise eine Besatzung bezeichnen. Der Personenbezug passt zum parallelen Ausdruck »Fürsten der Philister«; צר wird als kollektiver Singular »Feind« wiedergegeben.
- source_word: ויאבד
  choice: kamen um
  rationale: Die Form wird hier intransitiv verstanden und bezeichnet das Verderben beziehungsweise den Tod der philistäischen Fürsten.
- source_word: סרני פלשתים
  choice: die Fürsten der Philister
  rationale: סרנים ist die aus den Samuelbüchern bekannte Bezeichnung für die Herrscher der Philister. »Fürsten« ist im Deutschen verständlich und bewahrt den Charakter eines besonderen Herrschertitels.
theological_decisions:
- issue: Bezug von »seine Stimme«
  choice: Die Stimme ist Gottes Stimme.
  alternative: Die Stimme könnte mittelbarer auf Samuels Gebet oder Wirken bezogen werden.
  rationale: Der hebräische Vers nennt den Bezug nicht ausdrücklich, doch der Zusammenhang handelt von Samuels Anrufung Gottes gegen die Feinde Israels. Der griechische Paralleltext sagt ausdrücklich, dass der Herr vom Himmel donnerte, und stützt damit den Gottesbezug.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit poetischem Rhythmus. Die Wiederholung der drei Satzglieder folgt dem hebräischen Aufbau; das Semikolon erleichtert die Lesbarkeit. Die Unsicherheit der ersten Wendung sowie die mögliche militärisch-unpersönliche Bedeutung von נציבי werden in den Fußnoten offengelegt.
