  naturalness: Der Stil ist modernes, würdiges Standarddeutsch. „Nach dem Gebot des HERRN“ und „richtete er die Gemeinde“ sind idiomatisch. Die explizite Nennung „Jakobs“ im zweiten Teilsatz ist trotz der Wiederholung klarer und quellennäher als ein femininer Rückverweis auf „Gemeinde“.
  terminology: „HERR“, „Gemeinde“ und „Gott Jakobs“ sind angemessen. „Nahm sich Jakobs an“ gibt die im Kontext günstige Deutung von פקד natürlich wieder, ohne das missverständliche „heimsuchte“ zu verwenden. Die Fußnote muss jedoch klarstellen, dass Jakob als Objekt aus der griechischen Parallele stammt und dass deren Verb ebenfalls „aufsuchen/heimsehen“ lautet, nicht bereits „sich annehmen“.
