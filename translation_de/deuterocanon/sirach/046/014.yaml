  text: At the command of Yahweh he commanded the assembly[b][a], and the God of Jacob visited him.
translation:
  language: de
  text: Nach dem Gebot des HERRN richtete er die Gemeinde[a], und der Gott Jakobs nahm sich Jakobs an.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der überlieferte hebräische Text lautet: „gebot er der Gemeinde“; die griechische Überlieferung hat: „richtete er die Gemeinde“. Der Haupttext folgt der im Zusammenhang passenden griechischen Lesart.'
    reason: alternative_reading
  - marker: b
    text: 'Das hebräische Verb kann „aufsuchen“, „beachten“ oder „eingreifen“ bedeuten; ein Objekt wird dort nicht genannt. Die griechische Überlieferung nennt Jakob als Objekt: „Der Herr suchte Jakob auf.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: במצות
  choice: Nach dem Gebot
  rationale: Das präfigierte ב bezeichnet hier den Maßstab beziehungsweise die Grundlage von Samuels Handeln. „Nach dem Gebot“ ist im Deutschen natürlich und bleibt nahe am Hebräischen.
- source_word: יהוה
  choice: des HERRN
  rationale: Der Gottesname JHWH wird nach der üblichen deutschen Bibelkonvention mit „HERR“ in Kapitälchen wiedergegeben.
- source_word: צוה
  choice: richtete er
  rationale: Der überlieferte hebräische Text bedeutet gewöhnlich „er gebot/befahl“. Die griechische Parallele liest jedoch ἔκρινεν („er richtete“), was zu Samuels richterlicher Rolle im Zusammenhang passt. Diese kontextuell gestützte Lesart steht im Haupttext; die hebräische Lesart wird in der Fußnote bewahrt.
- source_word: עדה
  choice: die Gemeinde
  rationale: עדה bezeichnet die versammelte Gemeinschaft Israels. „Gemeinde“ ist würdig, verständlich und entspricht auch dem griechischen συναγωγή.
- source_word: ויפקד
  choice: nahm sich ihrer an
  rationale: פקד kann „aufsuchen“, „beachten“, „sich annehmen“ oder „eingreifen“ bedeuten. Die Formulierung gibt im positiven Kontext eine fürsorgliche Zuwendung wieder, ohne deren genaue Art festzulegen.
- source_word: אלהי יעקב
  choice: der Gott Jakobs
  rationale: Die feste Gottesbezeichnung wird knapp und idiomatisch wiedergegeben. „Jakob“ kann kollektiv für Israel stehen.
theological_decisions:
- issue: Abweichung zwischen hebräischem צוה („gebot“) und griechischem ἔκρινεν („richtete“)
  choice: „richtete er die Gemeinde“ im Haupttext
  alternative: „gebot er der Gemeinde“
  rationale: Obwohl der erhaltene hebräische Wortlaut grundsätzlich vorrangig ist, wirkt seine gewöhnliche Bedeutung hier schwierig. Die griechische Parallele bietet eine kontextuell stimmige Lesart, die Samuels Amt als Richter entspricht. Die echte textliche Spannung wird durch eine Fußnote offengelegt.
- issue: Nicht ausdrücklich genanntes Objekt von ויפקד
  choice: 'Bezug auf die Gemeinde beziehungsweise Jakob/Israel: „nahm sich ihrer an“'
  alternative: „suchte ihn heim“ / „nahm sich Jakobs an“
  rationale: Im Hebräischen fehlt nach ויפקד ein ausdrückliches Objekt, während die griechische Parallele „Jakob“ als Objekt nennt. Der feminine Rückbezug „ihrer“ nimmt die unmittelbar erwähnte Gemeinde auf, die als Jakob/Israel verstanden werden kann, ohne eine Einzelperson Samuel zum Objekt zu machen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt knapp und poetisch. „Gemeinde“ bezeichnet hier die versammelte Gemeinschaft Israels; „nahm sich ihrer an“ vermeidet das im heutigen Deutsch leicht missverständliche „heimsuchen“.
