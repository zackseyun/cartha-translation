base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/046/013.yaml
  text: Beloved by his people and pleasing to his Maker[a], asked for from his mother's womb, Samuel, a Nazirite of the Lord in prophecy, judged and served as priest; by the word of God he established the kingdom, and anointed rulers over his people.
translation:
  language: de
  text: Samuel liebte sein Volk und gefiel seinem Schöpfer; von Mutterleib an war er der Erbetene, ein Nasiräer Jahwes im prophetischen Dienst. Er richtete und versah den Priesterdienst. Durch Gottes Wort begründete er das Königtum und salbte Herrscher über sein Volk.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Überlieferung lautet: „Samuel, von seinem Herrn geliebt, ein Prophet des Herrn, richtete ein Königtum auf und salbte Herrscher über sein Volk.“ Der hebräische Text liest dagegen, dass Samuel sein Volk liebte, seinem Schöpfer gefiel, von Mutterleib an erbeten war, ein Nasiräer Jahwes im prophetischen Dienst war sowie richtete und den Priesterdienst versah.'
    reason: alternative_reading
lexical_decisions:
- source_word: אוהב עמו
  choice: Er liebte sein Volk
  rationale: 'Das hebräische אוהב ist aktiv formuliert: Samuel liebt sein Volk. Diese Lesart unterscheidet sich von der griechischen Überlieferung, die ihn als vom Herrn Geliebten bezeichnet.'
- source_word: ורצוי עושהו
  choice: und gefiel seinem Schöpfer
  rationale: רצוי bezeichnet Wohlgefallen oder Anerkennung; עושהו ist wörtlich „der ihn gemacht hat“, idiomatisch sein Schöpfer.
- source_word: המשואל מבטן אמו
  choice: er war der vom Mutterleib seiner Mutter an Erbetene
  rationale: Die Formulierung bewahrt das Wortspiel mit Samuels Namen und den Gedanken, dass seine Mutter ihn von Gott erbat. Das kompakte Hebräisch bleibt zeitlich etwas mehrdeutig.
- source_word: נזיר יהוה בנבואה
  choice: ein Nasiräer Jahwes im prophetischen Dienst
  rationale: „Nasiräer“ erhält die besondere kultische Bedeutung von נזיר und Samuels lebenslange Weihe. „Im prophetischen Dienst“ gibt das knappe בנבואה in verständlichem Deutsch wieder, ohne es schlicht mit einem Amtstitel gleichzusetzen.
- source_word: שופט ומכהן
  choice: war Richter und versah den Priesterdienst
  rationale: שופט bezeichnet Samuels richterliche und leitende Rolle; כהן ist hier verbal und beschreibt die Ausübung priesterlichen Dienstes.
- source_word: בדבר אל
  choice: Durch Gottes Wort
  rationale: Die Wendung bezeichnet Gottes Wort als Grundlage oder Mittel von Samuels Handeln. אל wird hier mit „Gott“ wiedergegeben.
- source_word: הכין ממלכת
  choice: festigte er das Königtum
  rationale: הכין kann „gründen“, „aufrichten“ oder „festigen“ bedeuten. „Das Königtum“ bezeichnet hier die monarchische Ordnung, nicht vorrangig ein geografisches Reich.
- source_word: וימשח נגידים על עם
  choice: und salbte Herrscher über sein Volk
  rationale: נגידים sind eingesetzte Führer oder Herrscher. Das Possessivpronomen wird durch die griechische Parallele gestützt und passt zum Kontext.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Gottesnamen ausdrücklich. „Jahwe“ bewahrt ihn als Eigennamen, statt ihn durch einen Titel zu ersetzen.
- issue: Samuels priesterliche Tätigkeit
  choice: versah den Priesterdienst
  alternative: diente priesterlich
  rationale: Die Übersetzung gibt die verbale Aussage des hebräischen ומכהן wieder, ohne über Samuels formalen Amtsstatus mehr zu entscheiden, als der Text selbst sagt.
- issue: Samuels Stellung als נזיר
  choice: Nasiräer
  alternative: Gottgeweihter
  rationale: „Nasiräer“ wahrt den spezifischen kultischen Anklang und die Spannung zu den unterschiedlichen biblischen Darstellungen seiner Weihe.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzglieder wurden für gute Verständlichkeit gegliedert; kultisch und theologisch markierte Begriffe wie „Nasiräer“, „Jahwe“ und „Priesterdienst“ bleiben erhalten. Die erhebliche Abweichung der griechischen Parallelüberlieferung wird in einer Fußnote transparent gemacht.
