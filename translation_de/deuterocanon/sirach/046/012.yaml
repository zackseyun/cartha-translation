base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/046/012.yaml
  text: May their bones blossom like a lily[c][b][a], and may their name be renewed in their sons.
translation:
  language: de
  text: Ihre Gebeine mögen wie eine Lilie erblühen, und ihr Name möge sich in ihren Söhnen erneuern.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das hebräische Verb kann auch die Weitergabe oder Fortsetzung des Namens bezeichnen: „Ihr Name möge durch ihre Söhne fortbestehen.“ Der griechische Paralleltext ergänzt beim Erblühen der Gebeine „von ihrem Ort her“.'
    reason: lexical_alternative_and_parallel_reading
lexical_decisions:
- source_word: תפרחנה עצמותם
  choice: Ihre Gebeine mögen … erblühen
  rationale: תפרחנה von פרח bezeichnet Blühen oder Aufblühen; die Wunschform wird mit „mögen“ wiedergegeben. „Gebeine“ bewahrt das konkrete עצמותם und klingt im Deutschen würdig und natürlich.
- source_word: כשושנה
  choice: wie eine Lilie
  rationale: שושנה bezeichnet wahrscheinlich eine Lilie. Die konkrete Blumenmetapher bleibt erhalten; „Rose“ ist eine mögliche, aber weniger wahrscheinliche Wiedergabe.
- source_word: ושמם
  choice: und ihr Name
  rationale: „Name“ erhält die biblische Ausdrucksweise und lässt sowohl Andenken als auch Ansehen mitschwingen, ohne die Bedeutung einzuengen.
- source_word: תחליף
  choice: möge … neu aufleben
  rationale: חלף kann Erneuerung, Nachfolge oder Ablösung bezeichnen. „Neu aufleben“ gibt hier die Fortdauer des Namens in der nächsten Generation idiomatisch wieder und bewahrt zugleich die Erneuerungsnuance.
- source_word: לבניהם
  choice: in ihren Söhnen
  rationale: Die hebräische Form bezeichnet ausdrücklich „ihre Söhne“. „In“ bildet die Vorstellung ab, dass der Name in ihnen weiterlebt.
theological_decisions:
- issue: Geschlechtsspezifische Bezeichnung der Nachkommen
  choice: Söhne
  alternative: Kinder; Nachkommen
  rationale: בניהם ist maskulin und bedeutet ausdrücklich „ihre Söhne“. Die Übersetzung bewahrt diese Spezifik, statt sie stillschweigend zu verallgemeinern.
- issue: Bild vom Erblühen der Gebeine
  choice: Keine ausdrückliche Ergänzung „an ihrer Ruhestätte“
  alternative: Ihre Gebeine mögen an ihrer Ruhestätte erblühen
  rationale: Der vorliegende hebräische Text enthält keine Entsprechung zu dem griechischen Zusatz ἐκ τοῦ τόπου αὐτῶν („von ihrem Ort her“). Daher bleibt er aus dem Haupttext heraus; das Bild wird nicht ausdrücklich als Auferstehung oder bloßes Fortleben der Erinnerung gedeutet.
translation_notes:
  register: Moderne, würdige Standardsprache. „Gebeine“ wahrt die konkrete Körpermetapher und passt zum feierlichen Gedenkkontext; „neu aufleben“ ist verständlicher und natürlicher als das wörtlichere „erneuert werden“, ohne die Mehrdeutigkeit von תחליף völlig aufzulösen.
