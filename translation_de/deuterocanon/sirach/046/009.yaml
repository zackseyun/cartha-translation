base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/046/009.yaml
  text: And he gave Caleb strength, and it remained with him until old age, so that he went up into the highlands of the land, and his offspring took possession of an inheritance.
translation:
  language: de
  text: Der Herr gab Kaleb Kraft, und sie blieb ihm bis ins hohe Alter, sodass er in das Hochland des Landes hinaufstieg und seine Nachkommen das Erbteil in Besitz nahmen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der erhaltene hebräische Text lautet hier kürzer: „Er gab Kaleb Kraft, und bis ins hohe Alter blieb sie ihm.“ Der weitere Satzteil ist in der alten griechischen Überlieferung erhalten.'
    reason: Kennzeichnet transparent, dass der zweite Teil des Verses auf der vollständigeren griechischen Parallelüberlieferung beruht.
lexical_decisions:
- source_word: עָצְמָה / ἰσχύν
  choice: Kraft
  rationale: Gibt sowohl das hebräische Substantiv für Stärke/Kraft als auch das griechische ἰσχύς klar und natürlich wieder.
- source_word: עָמְדָה עִמּוֹ / διέμεινεν αὐτῷ
  choice: sie blieb ihm
  rationale: Bewahrt das Bild, dass die zuvor genannte Kraft Kaleb bis ins Alter erhalten blieb; das feminine Pronomen nimmt im Deutschen „Kraft“ auf.
- source_word: ἐπὶ ὕψος τῆς γῆς
  choice: die Höhen des Landes
  rationale: Eine natürliche Wiedergabe des griechischen Ausdrucks, der das hoch gelegene Gebiet meint, ohne ihn unnötig auf einen einzelnen Berg festzulegen.
- source_word: τὸ σπέρμα αὐτοῦ
  choice: seine Nachkommen
  rationale: Gibt den kollektiven Sinn von „sein Same“ in verständlichem modernem Deutsch wieder.
- source_word: κατέσχεν κληρονομίαν
  choice: nahmen das Erbteil in Besitz
  rationale: Bringt sowohl das tatsächliche Besitzergreifen als auch den erbrechtlich-landbezogenen Sinn von κληρονομία zum Ausdruck.
theological_decisions:
- issue: Subjekt des Gebens
  choice: Der Herr
  alternative: Er
  rationale: Der erhaltene hebräische Text hat ein implizites Subjekt, während die griechische Parallelüberlieferung ausdrücklich „der Herr“ liest; die Nennung schafft im isolierten Vers Klarheit und folgt dem vollständiger erhaltenen Zeugen.
- issue: Umfang des Verses
  choice: Den nur griechisch vollständig erhaltenen Schlussteil in den Haupttext aufnehmen
  alternative: Nur den kürzeren erhaltenen hebräischen Wortlaut wiedergeben
  rationale: Die hebräische Geniza-Überlieferung ist an dieser Stelle unvollständig beziehungsweise kürzer; die alte griechische Überlieferung bewahrt den inhaltlich zusammenhängenden Fortgang und stimmt mit der konsultierten POB-Fassung überein.
- issue: Finale oder konsekutive Beziehung
  choice: „sodass“
  alternative: „damit“ oder bloße Satzreihung
  rationale: Der griechische Infinitiv ἐπιβῆναι kann Folge beziehungsweise Ergebnis oder Zweck ausdrücken. „Sodass“ passt zum Rückblick auf Kalebs bleibende Kraft, ohne eine stärker theologische Zwecksetzung zu erzwingen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Bis ins hohe Alter“ und „in Besitz nehmen“ sind allgemein verständlich; „Erbteil“ bewahrt zugleich den biblischen Zusammenhang der Landzuteilung.
