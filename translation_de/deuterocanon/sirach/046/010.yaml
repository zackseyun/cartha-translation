  text: so that all the offspring of Jacob may know that it is good to fully follow Yahweh[a][b].
translation:
  language: de
  text: damit alle Nachkommen Jakobs erkennen, dass es gut ist, Jahwe ganz zu folgen[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die griechische Parallele hat „alle Söhne Israels“ statt „alle Nachkommen Jakobs“.
    reason: alternative_reading
  - marker: b
    text: Die hebräische Wendung für „ganz zu folgen“ ist ungewöhnlich; die griechische Parallele gibt den Sinn mit „hinter dem Herrn herzugehen“ wieder.
    reason: textual_variant
lexical_decisions:
- source_word: למען דעת
  choice: damit … erkennen
  rationale: למען leitet einen Zweck- oder Ergebnissatz ein; דעת wird im Deutschen idiomatisch als finites Verb wiedergegeben. „Erkennen“ bezeichnet hier das einsichtige Wissen um den Wert der Treue zu Gott.
- source_word: כל זרע יעקב
  choice: alle Nachkommen Jakobs
  rationale: זרע bedeutet wörtlich „Same“, bezeichnet hier aber kollektiv die Nachkommenschaft. „Nachkommen“ ist im modernen Deutschen klar und bewahrt den Bezug auf Jakob; die abweichende griechische Lesart wird in einer Fußnote genannt.
- source_word: כי טוב
  choice: dass es gut ist
  rationale: כי führt hier am natürlichsten den Inhalt dessen ein, was erkannt werden soll; die wertende Aussage bleibt ausdrücklich erhalten.
- source_word: למלא אחרי
  choice: ganz zu folgen
  rationale: Die ungewöhnliche hebräische Wendung enthält mit למלא ein Moment der Fülle oder Ganzheit und mit אחרי das Bild des Folgens. „ganz zu folgen“ bewahrt beides, ohne die Formulierung auf einen abstrakten Gehorsamsbegriff zu verengen.
- source_word: יהוה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben, sodass der Eigenname im hebräischen Text erkennbar bleibt.
theological_decisions:
- issue: Hebräisch „Nachkommen Jakobs“ gegenüber griechisch „Söhne Israels“
  choice: alle Nachkommen Jakobs
  alternative: alle Söhne Israels
  rationale: Der erhaltene hebräische Text ist die primäre Grundlage und nennt Jakob. Die griechische Parallele bietet eine bedeutungsnahe, aber textlich abweichende Formulierung, die deshalb in der Fußnote dokumentiert wird.
- issue: Bedeutung der Wendung למלא אחרי
  choice: Jahwe ganz zu folgen
  alternative: hinter dem Herrn herzugehen / dem Herrn zu folgen
  rationale: Das Hebräische kann nach etabliertem biblischem Sprachgebrauch ein uneingeschränktes Folgen ausdrücken, ist an dieser Stelle jedoch ungewöhnlich; die griechische Parallele stützt allgemein das Bild des Gehens hinter dem Herrn. Die Übersetzung bewahrt das Element der Ganzheit, während die Fußnote auf die sprachliche Spannung hinweist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz bleibt als Zwecksatz an den vorausgehenden Zusammenhang gebunden. „ganz zu folgen“ ist verständlich, bewahrt aber die konkrete Nachfolge-Metaphorik und die im Hebräischen angedeutete Ganzheit.
