base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/046/011.yaml
  text: And the judges, each by his own name—everyone whose heart was not led astray and who did not turn away from God—may their memory be for blessing.
translation:
  language: de
  text: 'Und die Richter, jeden einzelnen mit Namen: Alle, deren Herz nicht abirrte[a] und die sich nicht von Gott abwandten[b] – ihr Andenken sei zum Segen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch wörtlich etwa: „alle, die ihr Herz nicht erhoben haben“; die griechische Parallele lautet: „deren Herz nicht abirrte“ und dürfte hier den beabsichtigten Sinn verdeutlichen.'
    reason: lexical_alternative
  - marker: b
    text: 'Griechisch: „vom Herrn“. Der hebräische Textzeuge liest hier „von Gott“.'
    reason: alternative_reading
lexical_decisions:
- source_word: והשופטים
  choice: Und die Richter
  rationale: שופטים bezeichnet hier die Führungsgestalten aus der Richterzeit; „Richter“ ist die direkte, kontextgerechte Wiedergabe und wird durch das griechische οἱ κριταί bestätigt.
- source_word: איש בשמו
  choice: jeder mit seinem Namen
  rationale: Die Wendung hebt das namentliche, individuelle Gedenken hervor. „Mit seinem Namen“ wahrt den hebräischen Ausdruck und klingt im Deutschen natürlich.
- source_word: כל אשר לא נשא לבו
  choice: Alle, deren Herz nicht abirrte
  rationale: Der überlieferte hebräische Wortlaut bedeutet wörtlich etwa „alle, die ihr Herz nicht erhoben“ und bleibt mehrdeutig; die griechische Parallele versteht die Aussage als ein Abirren des Herzens. Die gewählte Fassung passt zum anschließenden Abwenden von Gott, während die hebräische Lesemöglichkeit in der Fußnote erhalten bleibt.
- source_word: ולא נסוג מאחרי אל
  choice: und die sich nicht von Gott abwandten
  rationale: נסוג מאחרי bezeichnet das Zurückweichen beziehungsweise Abwenden von jemandem. Der hebräische Hauptzeuge hat אל, „Gott“, und wird gegenüber dem griechischen „Herrn“ im Haupttext bevorzugt.
- source_word: יהי זכרם לברכה
  choice: ihr Andenken sei zum Segen
  rationale: Die Formulierung bewahrt den hebräischen Segenswunsch und ist zugleich würdig und idiomatisch im modernen Deutschen.
theological_decisions:
- issue: Sinn der Aussage über das Herz
  choice: deren Herz nicht abirrte
  alternative: die ihr Herz nicht erhoben
  rationale: Der hebräische Text lässt eine Deutung im Sinn von Selbsterhebung oder Stolz zu, während die griechische Parallele ausdrücklich das Abirren beziehungsweise die Untreue des Herzens beschreibt. Der Haupttext folgt dem durch den Kontext gestützten griechischen Verständnis; die echte Spannung wird in der Fußnote offengelegt.
- issue: Gottesbezeichnung nach „sich abwenden“
  choice: Gott
  alternative: Herr
  rationale: Der vorhandene hebräische Text liest אל („Gott“), die griechische Parallele Κυρίου („Herrn“). Wegen des Vorrangs des hebräischen Zeugen steht „Gott“ im Haupttext; die Variante wird in der Fußnote dokumentiert.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Der Vers bleibt als Segenswunsch gestaltet; die Satzzeichen machen die Einschaltung über die treuen Richter verständlich, ohne die knappe poetische Struktur unnötig aufzulösen.
