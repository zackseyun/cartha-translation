base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/046/008.yaml
  text: Therefore those two also were spared[a], out of six hundred thousand foot soldiers, to bring them into an inheritance[b], into a land flowing with milk and honey.
translation:
  language: de
  text: Darum wurden auch diese beiden[a] im Lauf der Jahre unter sechshunderttausend Fußsoldaten gerettet, um sie in ihr Erbteil zu führen[b], in ein Land, in dem Milch und Honig fließen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hebräische Ausdruck „in den Jahren“ ist schwierig. Er kann bedeuten, dass die beiden über die Jahre hinweg oder bis ins hohe Alter bewahrt wurden. Die griechische Parallele sagt einfacher: „Sie waren zwei und wurden gerettet.“'
    reason: textual_variant
  - marker: b
    text: 'Die griechische Parallele fährt fort: „um sie in ihr Erbteil zu führen, in ein Land, in dem Milch und Honig fließen“. Wahrscheinlich bewahrt sie hier den vollständigeren Wortlaut, während der erhaltene hebräische Text kürzer ist.'
    reason: alternative_reading
lexical_decisions:
- source_word: לכן
  choice: Darum
  rationale: Gibt die Folgerung aus der vorausgehenden Aussage natürlich und klar wieder.
- source_word: גם הם
  choice: auch diese beiden
  rationale: Der hebräische Zusammenhang meint Josua und Kaleb; das Griechische macht die Zweizahl mit αὐτοὶ δύο ausdrücklich.
- source_word: בשנים נאצלו
  choice: wurden ... gerettet
  rationale: נאצלו bezeichnet hier die Bewahrung vor dem Untergang. Das schwierige בשנים wird wegen seiner unsicheren Bedeutung nicht glatt aufgelöst, sondern in einer Fußnote dokumentiert; die griechische Parallele liest schlicht, dass die beiden gerettet wurden.
- source_word: משש מאות אלף רגלי
  choice: aus sechshunderttausend Fußsoldaten
  rationale: רגלי bezeichnet Menschen zu Fuß und hat hier, bestätigt durch griechisch πεζῶν, militärischen Sinn.
- source_word: εἰσαγαγεῖν αὐτοὺς εἰς κληρονομίαν
  choice: um sie in ihr Erbteil zu führen
  rationale: Die griechische Fortsetzung bezeichnet das Hineinführen in den als Erbteil verheißenen Landbesitz; „Erbteil“ bewahrt den biblischen Bundes- und Landbezug.
- source_word: εἰς γῆν ῥέουσαν γάλα καὶ μέλι
  choice: in ein Land, in dem Milch und Honig fließen
  rationale: Natürliche moderne Wiedergabe der feststehenden biblischen Wendung für das verheißene Land.
theological_decisions:
- issue: Ergänzung des kürzeren hebräischen Zeugen durch die griechische Parallele
  choice: Der erhaltene hebräische Text bildet die Grundlage; die griechisch überlieferte Fortsetzung über das Erbteil und das Land von Milch und Honig steht im Haupttext.
  alternative: Nur den erhaltenen hebräischen Wortlaut übersetzen und nach „Fußsoldaten“ schließen.
  rationale: Die griechische Fortsetzung passt sachlich zum Zusammenhang von Josua und Kaleb und bewahrt wahrscheinlich den vollständigeren Vers, während die Kennzeichnung in Fußnote [b] die Textlage offenlegt.
- issue: Deutung des schwierigen בשנים
  choice: Im Haupttext keine bestimmte zeitliche Deutung ergänzen; die Unklarheit wird in Fußnote [a] ausgewiesen.
  alternative: „über die Jahre hinweg“, „bis ins hohe Alter“ oder wörtlich „unter den Jahren“ in den Haupttext aufnehmen.
  rationale: Der hebräische Ausdruck ist unsicher, und die griechische Parallele enthält keine entsprechende Zeitangabe. Eine eindeutige Wiedergabe würde die vorhandene Mehrdeutigkeit vorschnell auflösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Fußsoldaten“ ist konkret und allgemein verständlich; „Erbteil“ erhält den biblischen Land- und Verheißungsbezug. Die Textunsicherheiten werden nicht harmonisiert, sondern knapp in den Fußnoten offengelegt.
