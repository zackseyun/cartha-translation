base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/046/001.yaml
  text: Joshua son of Nun was a mighty warrior[a], Moses’ attendant in prophecy[b]; he was appointed in his days to be a great salvation for his chosen ones.
translation:
  language: de
  text: Josua, der Sohn Nuns, war ein tapferer Krieger, Moses Diener in prophetischem Wirken[a]. Er war dazu bestimmt, in seinen Tagen seinen Erwählten eine große Rettung zu sein[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Griechisch: „Moses Nachfolger im Bereich der Prophetie“. Damit wird Josuas Verhältnis zu Mose ausdrücklicher als Nachfolge bezeichnet als im erhaltenen hebräischen Text.'
    reason: alternative_reading
  - marker: b
    text: „Große Rettung“ kann auch „große Befreiung“ oder „großer Sieg“ bedeuten; das hebräische תשועה und das griechische σωτηρία können sowohl militärische als auch umfassendere Rettung bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: גבור בן חיל
  choice: ein tapferer Krieger
  rationale: Die hebräische Verbindung bezeichnet einen Helden beziehungsweise kampferprobten Mann von Stärke und Tüchtigkeit; das griechische κραταιὸς ἐν πολέμῳ bestätigt den militärischen Sinn.
- source_word: משרת משה
  choice: Moses’ Diener
  rationale: משרת bezeichnet jemanden, der einer führenden Person in einer offiziellen unterstützenden Rolle dient. „Diener“ ist im Deutschen natürlich und vermeidet einen kirchlichen Beiklang.
- source_word: בנבואה
  choice: in prophetischem Wirken
  rationale: Die knappe hebräische Wendung ist mehrdeutig. Diese Wiedergabe wahrt den Bezug zur Prophetie, ohne die im Griechischen ausdrücklichere Vorstellung einer Nachfolge in den Haupttext einzutragen.
- source_word: אשר נוצר
  choice: Er war dazu bestimmt
  rationale: Das passive נוצר bedeutet wörtlich „wurde geformt/gebildet“ und kann hier göttliche Vorbereitung beziehungsweise Bestimmung ausdrücken. Die gewählte Formulierung ist idiomatisch und lässt diesen Sinn erkennen.
- source_word: להיות בימיו
  choice: in seinen Tagen … zu bringen
  rationale: Die zeitliche Angabe wird erhalten, während die im Deutschen schwerfällige wörtliche Fügung „in seinen Tagen zu sein“ natürlich aufgelöst wird.
- source_word: תשועה גדולה
  choice: große Rettung
  rationale: תשועה umfasst Rettung, Befreiung und Sieg. „Rettung“ bewahrt die größere Bedeutungsbreite, ohne den militärischen Zusammenhang auszuschließen.
- source_word: לבחיריו
  choice: seinen Erwählten
  rationale: Das Possessivsuffix bleibt wie im Hebräischen mehrdeutig; wahrscheinlich sind Gottes Erwählte gemeint, doch der Haupttext legt den Bezug nicht ausdrücklich fest.
theological_decisions:
- issue: Josuas Verhältnis zu Mose im Bereich der Prophetie
  choice: Moses’ Diener in prophetischem Wirken
  alternative: Moses’ Nachfolger in prophetischen Ämtern
  rationale: Der erhaltene hebräische Text spricht von Moses’ משרת, während die griechische Parallele διάδοχος („Nachfolger“) bietet. Der Haupttext folgt dem Hebräischen und vermerkt die abweichende Akzentsetzung des Griechischen in einer Fußnote.
- issue: Bedeutungsumfang von תשועה
  choice: Rettung
  alternative: Befreiung oder Sieg
  rationale: Der militärische Kontext lässt „Sieg“ zu, doch תשועה und das griechische σωτηρία reichen semantisch darüber hinaus. „Rettung“ erhält diese Spannung.
- issue: Bezug des Possessivsuffixes in לבחיריו
  choice: seinen Erwählten
  alternative: Gottes Erwählten
  rationale: Die wahrscheinlich auf Gott bezogene Wendung wird nicht explizit aufgelöst, da der hebräische Satz den Bezug grammatisch offenlässt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau wurde gegenüber dem knappen Hebräisch leicht geglättet. Die ungewöhnliche prophetische Wendung und der mehrdeutige Bezug von „seinen Erwählten“ wurden nicht konfessionell oder dogmatisch vereindeutigt.
