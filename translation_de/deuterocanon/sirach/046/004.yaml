  text: Was it not by his hand that the sun stood still[b][a], and one day was like two?
translation:
  language: de
  text: Stand die Sonne nicht durch seine Hand still[a], und war ein Tag wie zwei Tage[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Vers spielt auf Josuas Sieg an, bei dem die Sonne stillstand; siehe Josua 10,12–14.
    reason: cross_reference
  - marker: b
    text: 'Wörtlich: „und ein Tag war wie zwei“. Das Wort „Tage“ ist nach „zwei“ aus dem Zusammenhang zu ergänzen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הלא
  choice: Stand nicht …?
  rationale: Die verneinte rhetorische Frage erwartet Zustimmung und klingt so im Deutschen natürlich und würdig.
- source_word: בידו
  choice: durch seine Hand
  rationale: Bewahrt das konkrete hebräische Bild und gibt zugleich die Bedeutung von Vermittlung beziehungsweise Wirksamkeit wieder.
- source_word: עמד השמש
  choice: die Sonne still
  rationale: Bei der Sonne bezeichnet עמד hier das Anhalten ihres Laufs; „stillstehen“ entspricht dem Kontext und der Josua-Tradition.
- source_word: יום אחד
  choice: ein Tag
  rationale: Direkte und natürliche Wiedergabe der hebräischen Wortgruppe.
- source_word: כשנים היה
  choice: sodass ein Tag wie zwei war
  rationale: Das Hebräische sagt knapp „wie zwei“, wobei „Tage“ aus dem Zusammenhang zu ergänzen ist. „war“ entspricht היה, während „sodass“ den Folgezusammenhang im Deutschen verdeutlicht.
theological_decisions:
- issue: Wunderbericht über Josua und die Sonne
  choice: Die Aussage wird ohne Rationalisierung als Stillstand der Sonne wiedergegeben.
  alternative: Als dichterische Übertreibung für einen militärischen Sieg oder verlängertes Tageslicht deuten.
  rationale: Sowohl der hebräische Text als auch die griechische Parallele sprechen vom Anhalten der Sonne und davon, dass ein Tag wie zwei war. Die Übersetzung soll diese Aussage bewahren, ohne ihre Art oder ihren Mechanismus festzulegen.
translation_notes:
  register: Modernes Standarddeutsch in einem würdigen, gut verständlichen Register. Die rhetorische Frage und das konkrete Bild „durch seine Hand“ bleiben erhalten; die knappe hebräische Ellipse wird im Haupttext lesbar wiedergegeben und in der Fußnote offengelegt.
