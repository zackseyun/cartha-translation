  text: By the faithfulness of his mouth he was sought out as a seer[c][b][a], and also by his word he was found faithful as a shepherd.
translation:
  language: de
  text: Aufgrund der Verlässlichkeit seiner Rede[a] wurde er als Seher[b] aufgesucht; und auch durch sein Wort wurde er als treuer Hirte erkannt.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „aufgrund der Treue seines Mundes“. Möglich ist auch: „durch den Glauben seines Mundes“; im Zusammenhang ist wahrscheinlich die Verlässlichkeit seines Redens gemeint.'
    reason: lexical_alternative
  - marker: b
    text: Der griechische Text hat hier „Prophet“ statt „Seher“.
    reason: alternative_reading
  - marker: c
    text: Der zweite Halbvers ist im Hebräischen knapp formuliert. Gemeint sein kann, dass er durch sein Wort als treuer Hirte erkannt wurde.
    reason: textual_uncertainty
lexical_decisions:
- source_word: באמונת פיו
  choice: aufgrund der Verlässlichkeit seiner Rede
  rationale: אֱמוּנָה bezeichnet hier im Zusammenhang mit „seinem Mund“ am ehesten Zuverlässigkeit oder Treue im Reden, nicht den inneren Glauben. „Rede“ gibt die hebräische Metonymie „Mund“ in natürlichem Deutsch wieder.
- source_word: דרוש
  choice: wurde … aufgesucht
  rationale: Die passive Bedeutung von דרש bezeichnet hier, dass Samuel als Seher gesucht beziehungsweise befragt wurde. „Aufgesucht“ bewahrt das konkrete Bild, ohne die mögliche Bedeutung „befragt“ auszuschließen.
- source_word: חזה
  choice: Seher
  rationale: Das hebräische Wort bezeichnet spezifisch einen Seher oder Visionär. Der griechische Paralleltext verallgemeinert dies zu „Prophet“.
- source_word: בדברו
  choice: durch sein Wort
  rationale: Die instrumentale Wiedergabe ist im Deutschen natürlich und erhält zugleich die Parallele zur Rede im ersten Halbvers.
- source_word: נאמן
  choice: erwies er sich als treu
  rationale: נאמן bedeutet „treu, zuverlässig“. Wegen der knappen hebräischen Syntax bringt „erwies er sich“ den prädikativen Sinn verständlich zum Ausdruck, ohne eine zusätzliche Handlung zu behaupten.
- source_word: רועה
  choice: Hirte
  rationale: Die konkrete Hirtenmetapher bleibt erhalten; eine allgemeinere Wiedergabe wie „Leiter“ würde das Bild unnötig auflösen.
theological_decisions:
- issue: Bedeutung von אמונה in Verbindung mit „seinem Mund“
  choice: Verlässlichkeit
  alternative: Glaube; Treue
  rationale: Der hebräische Zusammenhang spricht primär von der Zuverlässigkeit seines Redens. Die grundsätzlich mögliche Wiedergabe „Glaube“ bleibt in der Fußnote sichtbar.
- issue: חזה gegenüber griechisch προφήτης
  choice: Seher
  alternative: Prophet
  rationale: Der erhaltene hebräische Text ist die primäre Quelle und verwendet die spezifischere Bezeichnung. Die griechische Lesart wird als wichtige Textparallele in der Fußnote bewahrt.
- issue: Knappe Syntax des zweiten Halbverses
  choice: erwies er sich als treuer Hirte
  alternative: ein treuer Hirte wurde erkannt; als Hirte war er treu
  rationale: Die Ergänzung des auf Samuel bezogenen Subjekts ergibt einen verständlichen deutschen Satz, ohne die Unsicherheit der verdichteten hebräischen Formulierung zu verschweigen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die idiomatische Wiedergabe „seiner Rede“ vermeidet das im Deutschen befremdliche „Treue seines Mundes“, während die Fußnote die hebräische Bildsprache dokumentiert. Das Semikolon macht den parallelen Aufbau der beiden Halbverse sichtbar.
