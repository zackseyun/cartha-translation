  text: Who could stand before him? For he fought the wars of Yahweh[a].
translation:
  language: de
  text: Wer konnte vor ihm bestehen? Denn er führte die Kriege Jahwes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Paralleltext weicht ab und lautet ungefähr: »Wer stand vor ihm je so da? Denn der Herr selbst führte die Feinde herbei.« Der Haupttext folgt dem hebräischen Zeugen.'
    reason: alternative_reading
lexical_decisions:
- source_word: מי
  choice: Wer
  rationale: Das hebräische Fragepronomen eröffnet eine rhetorische Frage; die knappe Wiedergabe ist im Deutschen natürlich.
- source_word: לפניו יתיצב
  choice: konnte vor ihm bestehen
  rationale: Die Wendung bezeichnet hier nicht bloß das Stehen in jemandes Gegenwart, sondern das Standhalten gegenüber einem Gegner. Das Modalverb bringt die rhetorische Aussage im Deutschen klar zum Ausdruck.
- source_word: כי
  choice: Denn
  rationale: Die Konjunktion begründet die vorausgehende rhetorische Frage und bewahrt den knappen literarischen Zusammenhang.
- source_word: מלחמות
  choice: Kriege
  rationale: Der Plural wird sachlich und ohne Verengung auf einzelne Schlachten wiedergegeben.
- source_word: יהוה
  choice: Jahwes
  rationale: Der im hebräischen Zeugen ausdrücklich stehende Gottesname wird in seiner gebräuchlichen deutschen Form wiedergegeben.
- source_word: נלחם
  choice: führte
  rationale: Zusammen mit »Kriege« gibt »führte« die hebräische Verbindung idiomatisch wieder; »kämpfte die Kriege« wäre im Deutschen unnatürlich.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text bietet ausdrücklich das Tetragramm. »Jahwe« bewahrt den Eigennamen, ohne ihn durch einen Titel zu ersetzen.
- issue: Subjekt des Kämpfens
  choice: 'Josua als fortgeführtes Subjekt: »er führte«'
  alternative: Jahwe als Subjekt
  rationale: Die hebräische Wortfolge und der Kontext stützen, dass der gepriesene Josua die Kriege Jahwes führte. Die abweichende griechische Überlieferung macht dagegen den Herrn ausdrücklich zum Handelnden und wird deshalb in der Fußnote dokumentiert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Vor ihm bestehen« wahrt den rhetorischen und kämpferischen Sinn; »die Kriege Jahwes führen« ist zugleich quellennah und idiomatisch.
