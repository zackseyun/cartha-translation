base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/046/016.yaml
  text: He too called upon God when his enemies hemmed him in all around[a]; when he offered a milk-fed lamb[b], Yahweh thundered from heaven.
translation:
  language: de
  text: Auch er rief zu Gott, als seine Feinde ihn ringsum bedrängten.[a] Als er ein milchgenährtes Lamm darbrachte,[b] donnerte Yahweh vom Himmel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Hebräischen steht sinngemäß „als seine Feinde … ringsum“; die genaue Form des erhaltenen hebräischen Textes ist jedoch schwierig. Der griechische Paralleltext stützt den Sinn, dass seine Feinde ihn von allen Seiten bedrängten oder umringten.
    reason: textual_variant
  - marker: b
    text: 'Oder: „ein säugendes Lamm“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קרא אל אל
  choice: rief zu Gott
  rationale: Die Verbindung קרא אל bezeichnet hier den an Gott gerichteten Hilferuf beziehungsweise das Gebet. „Rief zu Gott“ ist im modernen Deutschen natürlich und wahrt den konkreten Appell.
- source_word: כאפכה לו אויביו מסביב
  choice: als seine Feinde ihn ringsum bedrängten
  rationale: Die überlieferte hebräische Form ist schwierig. Der griechische Paralleltext mit θλίψαι und κυκλόθεν stützt den Sinn einer Bedrängnis durch ringsum befindliche Feinde. „Bedrängten“ bewahrt dabei sowohl den Druck als auch die räumliche Umschließung, ohne den unsicheren Wortlaut übermäßig festzulegen.
- source_word: בעלתו
  choice: als er … darbrachte
  rationale: Obwohl die hebräische Form auffällig ist, weist der griechische Paralleltext ἐν προσφορᾷ auf eine Opferdarbringung. Die verbale Wiedergabe ergibt im Deutschen einen klaren, natürlichen Satzanschluss.
- source_word: טלה חלב
  choice: ein milchgenährtes Lamm
  rationale: Die Wendung bezeichnet ein junges, noch von Milch ernährtes Lamm. „Milchgenährt“ ist konkret und verständlich; „säugendes Lamm“ wäre als lexikalische Alternative möglich.
- source_word: וירעם משמים יהוה
  choice: donnerte Yahweh vom Himmel
  rationale: רעם bezeichnet hier das Donnern als göttliche Antwort. Die knappe Formulierung erhält das eindrückliche Bild und gibt יהוה als den Eigennamen „Yahweh“ wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Yahweh
  alternative: der HERR; Jehova
  rationale: Im hebräischen Text steht ausdrücklich das Tetragramm יהוה. „Yahweh“ gibt den persönlichen Gottesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Richtung der feindlichen Bedrängnis im schwierigen hebräischen Wortlaut
  choice: Seine Feinde bedrängten ihn ringsum
  alternative: Er bedrängte/besiegte seine Feinde ringsum
  rationale: Der erhaltene hebräische Wortlaut ist formal unsicher. Im Zusammenhang mit dem griechischen Paralleltext und der konsultierten englischen Fassung ist die Bedrängnis Samuels durch seine Feinde die wahrscheinlichste Lesart; die Fußnote macht die Unsicherheit transparent.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Satzstruktur. „Ringsum bedrängten“ wahrt die räumliche und bedrohliche Bildlichkeit; „milchgenährt“ bleibt konkret, ohne altertümlich zu wirken. Der Gottesname wird als „Yahweh“ wiedergegeben.
