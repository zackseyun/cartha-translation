    rationale: „Ich habe Lösegeld genommen und es verheimlicht“ liest sich im Deutschen als positives Bekenntnis eines Fehlverhaltens. Angesichts des unmittelbaren Kontextes der Integrität und der anschließenden rhetorischen Frage ist eine behutsame Frageform die natürlichere Wiedergabe der knappen hebräischen Form, ohne die Textschwierigkeit zu verschleiern.
  - severity: low
    issue: „Erwies er sich ... als treu“ ist weniger quellennah als möglich.
    rationale: נכון נמצא ist passivisch und bezeichnet, dass jemand als fest, zuverlässig oder bewährt befunden wurde. „Galt ... als zuverlässig“ wahrt diese Perspektive und klingt im modernen Standarddeutsch natürlich.
