base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/046/019.yaml
  text: 'Even up to the time of his end[1], he was found faithful in the eyes of Yahweh: “I have taken a ransom and hidden it—from whom have I taken anything? And no man answered against him.”'
translation:
  language: de
  text: »Habe ich Lösegeld genommen und es verheimlicht? Von wem habe ich etwas genommen?« Und niemand erhob Anklage gegen ihn. Auch bis zur Zeit seines Endes galt er in den Augen Jahwes als zuverlässig.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hebräische Text ist hier knapp und in der ersten Aussage nicht ganz eindeutig. Die griechische Überlieferung lautet ausführlicher: »Vor der Zeit seines ewigen Schlafes bezeugte er vor dem Herrn und seinem Gesalbten: Geld, selbst bis hin zu Sandalen, habe ich von keinem Menschen genommen; und niemand erhob Anklage gegen ihn.« כפר kann in diesem Zusammenhang statt »Lösegeld« auch »Bestechungsgeld« bedeuten.'
    reason: Dokumentiert die abweichende griechische Überlieferung sowie die textliche Knappheit und die kontextuell mögliche Alternativbedeutung des hebräischen כפר.
lexical_decisions:
- source_word: וגם עד עת קצו
  choice: Selbst bis zur Zeit seines Endes
  rationale: Folgt dem knappen hebräischen Wortlaut; die griechische Fassung spricht abweichend und ausführlicher von der Zeit vor seinem ewigen Schlaf.
- source_word: נכון נמצא
  choice: erwies er sich … als treu
  rationale: נכון bezeichnet Festigkeit, Verlässlichkeit oder Bewährung. „Als treu erwies er sich“ gibt die moralische Zuverlässigkeit Samuels in natürlichem Deutsch wieder.
- source_word: בעיני יהוה
  choice: in den Augen Jahwes
  rationale: Bewahrt die hebräische Wendung und gibt den Gottesnamen יהוה als „Jahwe“ wieder.
- source_word: כפר
  choice: Lösegeld
  rationale: „Lösegeld“ bildet die lexikalische Grundbedeutung von כפר ab. Im Zusammenhang richterlicher Unbestechlichkeit ist auch „Bestechungsgeld“ möglich und wird deshalb in der Fußnote genannt.
- source_word: ונעלם
  choice: und es verheimlicht
  rationale: Gibt den Gedanken des Verbergens oder Verschweigens wieder; das Pronomen stellt im Deutschen den Bezug zum vorausgehenden Lösegeld her.
- source_word: ממי לקחתי
  choice: von wem habe ich etwas genommen?
  rationale: Die hebräische Frage ist elliptisch. „Etwas“ ergänzt nur das im Deutschen erforderliche Objekt und wahrt die rhetorische Bestreitung unrechtmäßiger Bereicherung.
- source_word: וכל אדם לא ענה בו
  choice: Und niemand erhob Anklage gegen ihn
  rationale: ענה ב kann ein Antworten oder Auftreten gegen jemanden, besonders im Sinn einer Beschuldigung, bezeichnen. Die griechische Parallelüberlieferung stützt ausdrücklich den forensischen Sinn.
theological_decisions:
- issue: Wiedergabe des Gottesnamens
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält das Tetragramm יהוה. Die Umschrift wahrt den offenbarten Eigennamen, ohne ihn durch einen Titel zu ersetzen.
- issue: Verhältnis des Zitats zu Samuels Treue
  choice: Das Zitat als Zeugnis seiner Unbestechlichkeit stehen lassen
  alternative: Die Aussage ausdrücklich als umfassende rechtliche Selbstrechtfertigung auslegen
  rationale: Der Text verbindet Samuels Bewährung mit der Bestreitung unrechtmäßiger Annahmen. Die Übersetzung entfaltet daraus keine weitergehende Lehrbehauptung.
- issue: Mehrdeutigkeit von כפר
  choice: Lösegeld im Haupttext, Bestechungsgeld als Alternative in der Fußnote
  alternative: Bestechungsgeld im Haupttext
  rationale: So bleibt die unmittelbare lexikalische Bedeutung sichtbar, während die im Kontext plausible ethisch-rechtliche Bedeutung nicht verschwiegen wird.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die hebräische Bildsprache „in den Augen Jahwes“ bleibt erhalten; schwer verständliche Ellipsen werden nur behutsam ergänzt. Die forensische Bedeutung des letzten Satzes wird idiomatisch wiedergegeben.
