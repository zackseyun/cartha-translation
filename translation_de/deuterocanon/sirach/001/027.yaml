translation:
  language: de
  text: Missachte die Furcht des Herrn[a] nicht und tritt ihm nicht mit zwiespältigem Herzen nahe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hier überlieferte hebräische Text gehört inhaltlich nicht zu diesem Vers. Die Übersetzung folgt daher der griechischen Überlieferung: „Missachte die Furcht des Herrn nicht und tritt ihm nicht mit zwiespältigem Herzen nahe.“'
    reason: Die angegebene hebräische Kompositfassung weist laut Validierung eine erhebliche Abweichung auf; der griechische Paralleltext entspricht Sirach 1,27 und wird als Textgrundlage transparent ausgewiesen.
lexical_decisions:
- source_word: μὴ ἀπειθήσῃς
  choice: Widersetze dich nicht
  rationale: Gibt das Verbot und den Sinn von ἀπειθέω als Ungehorsam bzw. Widerstreben natürlich und prägnant wieder.
- source_word: φόβῳ Κυρίου
  choice: der Furcht des Herrn
  rationale: Bewahrt die traditionelle und theologisch offene Formulierung; φόβος kann ehrfürchtige Gottesfurcht einschließen und wird nicht auf bloße Angst verengt.
- source_word: μὴ προσέλθῃς αὐτῷ
  choice: tritt nicht … vor ihn
  rationale: Entspricht dem Hinzutreten zu Gott in idiomatischem, würdigem Deutsch, ohne die Art der Annäherung näher festzulegen.
- source_word: ἐν καρδίᾳ δισσῇ
  choice: mit zwiespältigem Herzen
  rationale: δισσός bezeichnet hier ein doppeltes bzw. innerlich geteiltes Herz; „zwiespältig“ bewahrt diese moralisch-geistliche Spannung.
theological_decisions:
- issue: Bedeutung der „Furcht des Herrn“
  choice: Die feste biblische Wendung bleibt unverändert stehen.
  alternative: „Ehrfurcht vor dem Herrn“
  rationale: „Ehrfurcht“ wäre verständlich, würde das Bedeutungsspektrum von φόβος jedoch vorzeitig verengen.
- issue: Das zwiespältige Herz
  choice: „zwiespältigem Herzen“
  alternative: „geteiltem Herzen“ oder „doppeltem Herzen“
  rationale: Die gewählte Fassung wahrt den Gedanken innerer Doppelheit, ohne eine bestimmte dogmatische Erklärung einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau bleibt knapp und parallel zur griechischen Mahnung; traditionelle biblische Begriffe werden dort erhalten, wo eine glättende Wiedergabe echte Bedeutungsbreite verlieren ließe.
