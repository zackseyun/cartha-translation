  source_fidelity: 'Der Haupttext folgt zutreffend der erhaltenen hebräischen Zeile. Das Partizip וּמַרְבָּה ist jedoch am unmittelbarsten als prädikative Aussage zu verstehen: Die Furcht vor Yahweh „vermehrt“ Frieden, Leben und Heilung. „Sie schenkt Frieden in Fülle“ erfasst die positive Folge, verschiebt aber sowohl das Verb als auch die Reichweite von „in Fülle“.'
