  text: The beginning of wisdom is the fear of Yahweh[a], and it brings abundant peace and life and healing.
translation:
  language: de
  text: Der Anfang der Weisheit ist die Furcht vor Yahweh[a]; sie vermehrt Frieden, Leben und Heilung.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Textzeuge hat stattdessen: „Sie erfüllte ihr ganzes Haus mit ihren begehrenswerten Gütern und die Vorratskammern mit ihren Erzeugnissen.“ Diese Fassung weicht erheblich von der erhaltenen hebräischen Zeile ab.'
    reason: textual_variant
lexical_decisions:
- source_word: רֵאשִׁית חָכְמָה
  choice: Der Anfang der Weisheit
  rationale: Gibt die hebräische Genitivverbindung natürlich wieder, ohne festzulegen, ob רֵאשִׁית zeitlicher Anfang oder grundlegendes Prinzip meint.
- source_word: יִרְאַת
  choice: die Furcht vor
  rationale: Bewahrt das Gewicht der geläufigen biblischen Wendung; „Ehrfurcht“ allein würde den Bedeutungsumfang unnötig abschwächen.
- source_word: יְהֹוָה
  choice: Yahweh
  rationale: Gibt den im hebräischen Text ausdrücklich stehenden Gottesnamen als Eigennamen wieder.
- source_word: וּמַרְבָּה
  choice: sie schenkt … in Fülle
  rationale: Versteht die feminine Form als Prädikat mit Bezug auf „Furcht“. Die idiomatische Formulierung vermittelt das Bewirken beziehungsweise Vermehren, ohne im Deutschen eine schwerfällige Nominalreihe zu erzeugen.
- source_word: שָׁלוֹם
  choice: Frieden
  rationale: Ist die übliche und hier passende Wiedergabe; weiter gefasste Nuancen wie Wohlergehen bleiben mitgemeint.
- source_word: חַיִּים
  choice: Leben
  rationale: Das formal plurale hebräische Wort bezeichnet hier idiomatisch Leben als Ganzes.
- source_word: מַרְפֵּא
  choice: Heilung
  rationale: Bewahrt gegenüber „Gesundheit“ den möglichen aktiven, wiederherstellenden Sinn.
theological_decisions:
- issue: Wiedergabe des Tetragramms יְהֹוָה
  choice: Yahweh
  alternative: der HERR
  rationale: Der hebräische Text nennt den Gottesnamen ausdrücklich; die Transliteration erhält seinen Charakter als Eigenname.
- issue: Erhebliche Abweichung zwischen dem erhaltenen hebräischen und dem griechischen Text
  choice: Der hebräische Text steht im Haupttext; die griechische Fassung wird in einer Fußnote vollständig dokumentiert.
  alternative: Die griechische Fassung als Haupttext wiedergeben.
  rationale: Wo ein hebräischer Sirach-Text erhalten ist, bildet er hier die Grundlage. Die substanziell andere griechische Überlieferung darf jedoch nicht stillschweigend übergangen werden.
- issue: Bezug des zweiten Satzglieds
  choice: „sie“ bezieht sich auf die Furcht vor Yahweh
  alternative: 'Nominale Reihung ohne ausdrücklich gesetztes Prädikat: „und eine Fülle von Frieden, Leben und Heilung“'
  rationale: Die feminine hebräische Form וּמַרְבָּה lässt sich als Prädikat mit Bezug auf יִרְאַת verstehen. Die deutsche Formulierung macht diesen syntaktisch naheliegenden Zusammenhang lesbar, ohne eine zusätzliche theologische Aussage einzuführen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die feste biblische Wendung „Furcht vor Yahweh“ bleibt erhalten. „Frieden in Fülle“ vermeidet eine unnatürliche deutsche Nominalkette und bewahrt zugleich die Aussage des Hebräischen.
