translation:
  language: de
  text: Die Fülle der Weisheit besteht darin, den Herrn zu fürchten; die Weisheit macht sie von ihren Früchten trunken.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die an dieser Stelle erhaltene Zeile der Kairoer Geniza weicht stark ab: „Mit Menschen der Wahrheit ist sie von alters her bereitet, und mit ihren Nachkommen ist seine Güte verlässlich.“ In der herangezogenen hebräischen Ausgabe steht die Zeile in Klammern und ist als wesentliche Nichtübereinstimmung gekennzeichnet; deshalb folgt der Haupttext hier der griechischen Überlieferung.'
    reason: textual_variant
  - marker: b
    text: „Ihren“ bezieht sich auf die Weisheit, die sowohl im Griechischen als auch im Deutschen grammatisch feminin ist und im Buch Jesus Sirach häufig personifiziert erscheint.
    reason: lexical_alternative
lexical_decisions:
- source_word: πλησμονὴ σοφίας
  choice: die Fülle der Weisheit
  rationale: πλησμονή bezeichnet Fülle oder Überfluss. Die nominale Formulierung wahrt den prägnanten Charakter des Weisheitsspruchs.
- source_word: φοβεῖσθαι τὸν κύριον
  choice: besteht darin, den Herrn zu fürchten
  rationale: Der Infinitiv erläutert, worin die Fülle der Weisheit besteht. „Den Herrn fürchten“ bewahrt die starke biblische Ausdrucksweise, ohne sie auf bloße Achtung abzuschwächen.
- source_word: μεθύσκει
  choice: macht … trunken
  rationale: Das Verb bedeutet wörtlich „betrunken/trunken machen“. Das lebhafte Bild wird nicht zu „erfüllt“ oder „sättigt“ verflacht.
- source_word: αὐτούς
  choice: sie
  rationale: Das Pronomen hat innerhalb dieses Verses keinen ausdrücklich genannten Bezug und verweist im Zusammenhang wohl auf diejenigen, die den Herrn fürchten. Die knappe Form des Ausgangstextes bleibt erhalten.
- source_word: ἀπὸ τῶν καρπῶν αὐτῆς
  choice: von ihren Früchten
  rationale: ἀπό wird mit „von“ wiedergegeben. Das feminine Pronomen bezieht sich auf die im Deutschen ebenfalls feminine „Weisheit“ und lässt deren mögliche Personifikation erkennen.
theological_decisions:
- issue: Starke Abweichung zwischen der eingeklammerten hebräischen Zeile und der griechischen Überlieferung
  choice: Der Haupttext folgt dem griechischen Vers; die abweichende hebräische Zeile wird in einer Fußnote dokumentiert.
  alternative: „Bei Menschen der Wahrheit wurde sie von alters her gegründet, und bei ihren Nachkommen ist seine beständige Liebe treu.“
  rationale: Die hebräische Zeile ist in der angegebenen Edition eingeklammert und ausdrücklich als wesentliche Nichtübereinstimmung gekennzeichnet. Da sie offenbar nicht dem griechisch überlieferten Vers entspricht und ihre Zuordnung unsicher ist, bestimmt hier der griechische Text den Haupttext; die hebräische Lesart bleibt aus textkritischer Transparenz sichtbar.
- issue: Bildhafte Rede vom Trunkenmachen
  choice: Das konkrete Bild „macht … trunken“ wird beibehalten.
  alternative: „erfüllt sie bis zum Überfließen“ oder „sättigt sie reichlich“
  rationale: Die metaphorische Aussage ist bewusst kräftig. Eine abschwächende Wiedergabe würde eine mögliche Spannung des Textes beseitigen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der erste Satzteil wird mit „besteht darin“ idiomatisch verdeutlicht; das ungewöhnlich starke Bild „macht sie trunken“ und der im Einzelvers unbestimmte Bezug des zweiten „sie“ bleiben bewusst erhalten.
