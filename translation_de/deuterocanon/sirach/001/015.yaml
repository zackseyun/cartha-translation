  rationale: Die Revision beseitigt die missverständliche deutsche Doppelung „sie macht sie“, indem sie Weisheit als die im Bild handelnde Größe ausdrücklich nennt. Das bewahrt die griechische Aussage und verbessert die Lesbarkeit, ohne den unbestimmten Bezug des Objekts „sie“ über den Einzelvers hinaus zu ergänzen. Die Fußnote bleibt transparent über den stark abweichenden, textkritisch unsicher zugeordneten hebräischen Zeugen und formuliert dessen Präposition genauer.
