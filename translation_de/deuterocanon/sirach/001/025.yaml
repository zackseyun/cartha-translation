translation:
  language: de
  text: Strebe nach Weisheit, halte die Gebote und der Herr wird sie dir schenken.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die für diesen Vers angegebene erhaltene hebräische Zeile stimmt nicht mit Sirach 1,25 überein; die Übersetzung folgt deshalb hier dem griechischen Textzeugen.
    reason: textual_variant
  - marker: b
    text: 'Oder: „Wenn du nach Weisheit verlangst, halte die Gebote, und der Herr wird sie dir gewähren.“ Das einleitende Partizip kann bedingend verstanden werden; außerdem ist „gewähren“ eine mögliche Wiedergabe des griechischen Verbs.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπιθυμήσας
  choice: Strebe nach
  rationale: Das griechische Aoristpartizip bezeichnet ein Verlangen nach Weisheit und kann im Zusammenhang auffordernd oder bedingend verstanden werden. „Strebe nach“ gibt die Aufforderung in natürlichem, heutigem Deutsch wieder, ohne sie auf ein bloßes Gefühl zu verengen.
- source_word: σοφίαν
  choice: Weisheit
  rationale: Die übliche und sachlich genaue Wiedergabe; das spätere feminine Pronomen hält zugleich die personifizierende Darstellung offen.
- source_word: διατήρησον
  choice: halte
  rationale: Im Zusammenhang mit Geboten bezeichnet das Verb treues Bewahren und Befolgen. „Halte“ ist dafür die natürliche biblische Ausdrucksweise im modernen Deutschen.
- source_word: ἐντολάς
  choice: die Gebote
  rationale: „Gebote“ bewahrt den religiös-ethischen Gehalt besser als das allgemeinere „Anweisungen“ oder „Befehle“.
- source_word: Κύριος
  choice: der Herr
  rationale: Entspricht der üblichen Wiedergabe von κύριος in diesem Gottesbezug.
- source_word: χορηγήσει
  choice: wird schenken
  rationale: Das Verb bezeichnet ein Gewähren beziehungsweise reichliches Bereitstellen. „Schenken“ bringt die Gabe und Großzügigkeit in natürlichem Deutsch zum Ausdruck.
- source_word: σοι
  choice: dir
  rationale: Gibt den Dativ direkt und idiomatisch wieder.
- source_word: αὐτήν
  choice: sie
  rationale: Das feminine Pronomen bezieht sich auf „Weisheit“ und bewahrt im Deutschen sowohl den grammatischen Bezug als auch die mögliche Personifizierung.
theological_decisions:
- issue: Textgrundlage dieses Verses
  choice: Übersetzung nach dem griechischen Parallelzeugen
  alternative: Übersetzung der angegebenen hebräischen Zeile
  rationale: Die überlieferte hebräische Zeile in den bereitgestellten Daten entspricht inhaltlich nicht Sirach 1,25. Der griechische Text bezeugt dagegen den zu dieser Versangabe gehörenden Wortlaut. Die Textunsicherheit wird in einer Fußnote ausdrücklich offengelegt.
- issue: Bezug auf die Weisheit
  choice: Femininum „sie“
  alternative: Eine unpersönlichere Umschreibung ohne Pronomen
  rationale: Das Pronomen entspricht αὐτήν und lässt die in der Weisheitsliteratur bedeutsame Personifizierung der Weisheit bestehen, ohne darüber hinausgehende dogmatische Aussagen einzutragen.
- issue: Funktion des einleitenden Partizips
  choice: 'Auffordernde Wiedergabe: „Strebe nach Weisheit“'
  alternative: 'Bedingte Wiedergabe: „Wenn du nach Weisheit verlangst“'
  rationale: Im Anschluss an den ausdrücklichen Imperativ διατήρησον lässt sich das Partizip auffordernd verstehen. Da die bedingte Deutung grammatisch ebenfalls möglich ist, wird sie in der Fußnote bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Hauptfassung ist klar und auffordernd formuliert; die genuine syntaktische Mehrdeutigkeit des griechischen Partizips sowie die abweichende hebräische Quellenlage werden in den Fußnoten transparent gemacht.
