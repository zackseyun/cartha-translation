translation:
  language: de
  text: Liebe die Furcht des HERRN und mach dein Herz durch sie glücklich; fürchte dich nicht.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Überlieferung bietet an dieser Stelle einen ganz anderen Satz: „Das Herz eines Verständigen wird über ein Gleichnis nachdenken, und das Ohr eines aufmerksamen Zuhörers ist das Verlangen eines Weisen.“'
    reason: Der überlieferte griechische Paralleltext weicht grundlegend vom hebräischen Text ab; diese bedeutende Textvariante sollte für die Leser sichtbar sein.
lexical_decisions:
- source_word: אֱהַב
  choice: Liebe
  rationale: Der hebräische Imperativ wird unmittelbar und entsprechend seiner Grundbedeutung wiedergegeben.
- source_word: יִרְאַת יְהֹוָה
  choice: die Furcht des HERRN
  rationale: יִרְאָה bezeichnet hier ehrfürchtige Gottesfurcht; der Gottesname wird gemäß der etablierten deutschen Bibelkonvention als HERR wiedergegeben.
- source_word: וְאַשֵּׁר בָּהּ לִבְּךָ
  choice: und mach dein Herz durch sie glücklich
  rationale: אַשֵּׁר wird als Piel-Imperativ im Sinn von glücklich machen bzw. beglücken verstanden. בָּהּ nimmt die Gottesfurcht auf; „durch sie“ ist im Deutschen natürlicher als das wörtlichere „in ihr“.
- source_word: וְאַל תִּירָא
  choice: fürchte dich nicht
  rationale: Die klare Negativaufforderung bewahrt das beabsichtigte Wortspiel und die Spannung zwischen Gottesfurcht und dem Nicht-Fürchten.
theological_decisions:
- issue: Verhältnis zwischen Gottesfurcht und Furchtlosigkeit
  choice: 'Die scheinbare Spannung wird unverändert stehen gelassen: Die Furcht des HERRN soll geliebt werden, zugleich heißt es „fürchte dich nicht“.'
  alternative: Die Schlusswendung als erklärende Zusage umzudeuten, etwa „dann hast du nichts zu befürchten“.
  rationale: Der hebräische Text formuliert zwei unterschiedliche Aufforderungen, ohne ihr Verhältnis ausdrücklich zu erklären; eine kausale Auflösung würde mehr festlegen als die Vorlage.
- issue: Bedeutung von אַשֵּׁר
  choice: als „glücklich machen/beglücken“ verstanden
  alternative: „segnen“ oder „gerade ausrichten“
  rationale: Die vokalisierte Piel-Form von אשר unterstützt die Bedeutung „glücklich preisen/machen“. „Segnen“ wäre im Deutschen theologisch stärker festgelegt und lexikalisch weniger unmittelbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Imperativfolge und das Wortspiel zwischen „Furcht“ und „fürchte dich nicht“ bleiben erhalten; die ungewöhnliche Wendung über das Herz wird nur so weit geglättet, wie es für verständliches Deutsch nötig ist.
