  text: The fear of the Lord is glory and exultation[a], and gladness and a crown of rejoicing.
translation:
  language: de
  text: Die Furcht des Herrn ist Herrlichkeit und Ruhm, Freude und eine Krone des Jubels.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: „eine Krone des Frohlockens“. Das Griechische reiht mehrere eng verwandte Ausdrücke für Ehre und Freude aneinander.'
    reason: lexical_alternative
lexical_decisions:
- source_word: φόβος
  choice: Furcht
  rationale: Die in der biblischen Weisheitsliteratur feststehende Wendung „Furcht des Herrn“ bewahrt den umfassenden Sinn ehrfürchtiger, demütiger und gehorsamer Hinwendung besser als eine einengende Umschreibung.
- source_word: κυρίου
  choice: des Herrn
  rationale: Die artikellose griechische Genitivform wird in der geläufigen deutschen Gottesbezeichnung idiomatisch mit bestimmtem Artikel wiedergegeben.
- source_word: δόξα
  choice: Herrlichkeit
  rationale: „Herrlichkeit“ erhält das biblische Gewicht von δόξα; im Zusammenhang schwingt zugleich die Bedeutung Ehre mit.
- source_word: καύχημα
  choice: Ruhm
  rationale: καύχημα bezeichnet hier positiv das, worauf man sich rühmen kann. „Ruhm“ ist im Deutschen natürlicher als „Rühmen“ oder „Prahlerei“ und vermeidet einen unpassend negativen Beiklang.
- source_word: εὐφροσύνη
  choice: Freude
  rationale: „Freude“ gibt die helle, festliche Gemütsbewegung natürlich wieder und lässt die folgende Steigerung zum Jubel erkennen.
- source_word: στέφανος
  choice: Krone
  rationale: „Krone“ ist die verständliche traditionelle Wiedergabe des Ehren- oder Siegeskranzes und bewahrt das Bild verliehener Auszeichnung.
- source_word: ἀγαλλιάματος
  choice: Jubels
  rationale: Der Genitiv bestimmt die Krone näher. „Jubel“ gibt die gesteigerte, sichtbar ausbrechende Freude wieder und unterscheidet sie von εὐφροσύνη.
theological_decisions:
- issue: Wiedergabe der Weisheitsformel φόβος κυρίου
  choice: die Furcht des Herrn
  alternative: die Ehrfurcht vor dem Herrn
  rationale: Die traditionelle Formulierung bleibt verständlich und bewahrt die theologische Spannweite, die mehr umfasst als bloße Angst, ohne den Ausdruck auf Ehrfurcht allein festzulegen.
- issue: Positive Bedeutung von καύχημα
  choice: Ruhm
  alternative: Rühmen
  rationale: Der Vers stellt καύχημα als positive Frucht der Gottesfurcht dar. „Ruhm“ lässt offen, ob der Ausdruck den Gegenstand oder den Vollzug des Rühmens bezeichnet, und vermeidet eine moralisch negative Lesart.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst beibehaltener biblischer Formel „Furcht des Herrn“. Die knappe Reihung des Griechischen wird ohne zusätzliches Verb oder erklärende Ergänzungen erhalten.
