  text: The fear of Yahweh is the beginning of wisdom[a], and she satisfies with the abundance of her produce.
translation:
  language: de
  text: Die Furcht Jahwes ist der Anfang der Weisheit[a], und sie sättigt einen mit der Fülle ihres Ertrags.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Griechisch: »Erkenntnis und Einsicht goss sie aus, und sie erhöhte den Ruhm derer, die an ihr festhalten.« Der griechische Text weicht hier stark vom erhaltenen hebräischen Text ab und spiegelt wahrscheinlich eine andere Textform wider.'
