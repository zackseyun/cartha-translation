lexical_decisions:
- source_word: רֵאשִׁית
  choice: Anfang
  rationale: Die Grundbedeutung ist »Anfang« oder »Erstes«; »Anfang« wahrt die bekannte Weisheitsformel, ohne sie als »höchstes Prinzip« auszudeuten.
- source_word: חָכְמָה
  choice: Weisheit
  rationale: Dies ist die sachlich und literarisch übliche Wiedergabe in der Weisheitsliteratur.
- source_word: יִרְאַת יְהֹוָה
  choice: die Furcht Jahwes
  rationale: »Furcht« bewahrt das Spannungsfeld von Ehrfurcht, Scheu und wirklicher Furcht, statt es auf bloße Verehrung zu verengen. Der Gottesname wird als »Jahwe« wiedergegeben.
- source_word: וּתְרַוֵּה
  choice: und sie sättigt
  rationale: Das Verb bezeichnet reichliches Tränken beziehungsweise Sättigen. »Sättigt« ist im Deutschen natürlich und bewahrt den Gedanken überreicher Versorgung.
- source_word: בְּרֹב
  choice: mit der Fülle
  rationale: Die Wendung bezeichnet das reichliche Maß beziehungsweise den Inhalt dessen, womit gesättigt wird.
- source_word: תְּבוּאָתָהּ
  choice: ihres Ertrags
  rationale: Das Wort bezeichnet Ertrag oder Ernteertrag. »Ertrag« bewahrt das landwirtschaftliche Bild, ohne es unnötig einzuengen; das feminine Suffix bleibt durch »ihres« erhalten.
theological_decisions:
- issue: Textgrundlage bei starker Abweichung zwischen Hebräisch und Griechisch
  choice: Der erhaltene hebräische Text steht im Haupttext.
  alternative: 'Nach dem Griechischen: »Erkenntnis und verständige Einsicht goss sie aus, und sie erhöhte den Ruhm derer, die an ihr festhalten.«'
  rationale: Da für diese Stelle ein hebräischer Text erhalten ist, erhält er den Vorrang. Die erhebliche griechische Abweichung wird jedoch vollständig in einer Fußnote dokumentiert, da sie wahrscheinlich eine andere Textform widerspiegelt.
- issue: Bezug des femininen Pronomens
  choice: Das feminine »sie« bleibt ohne ausdrückliche Auflösung stehen.
  alternative: Den Bezug ausdrücklich als »die Weisheit« oder »die Furcht Jahwes« festlegen.
  rationale: Im Hebräischen sind sowohl »Weisheit« als auch »Furcht« feminin; der Satz lässt den Bezug daher sprachlich offen. Das deutsche »sie« bewahrt diese echte Mehrdeutigkeit und zugleich die personifizierende Ausdrucksweise.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Weisheitsformel und das landwirtschaftliche Bild bleiben erhalten; das feminine Pronomen wahrt bewusst den im Hebräischen möglichen Bezug sowohl auf die Weisheit als auch auf die Furcht Jahwes.
