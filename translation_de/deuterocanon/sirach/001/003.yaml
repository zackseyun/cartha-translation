  text: The height of heaven and the breadth of the earth[a], and the depth of the abyss—who can search them out?
translation:
  language: de
  text: Die Höhe des Himmels, die Breite der Erde und die Tiefe des Abgrunds[a] – wer kann sie ergründen?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Paralleltext fügt »und die Weisheit« hinzu. Danach lautet der Vers: »Die Höhe des Himmels, die Breite der Erde, den Abgrund und die Weisheit – wer kann sie ergründen?«'
    reason: textual_variant
lexical_decisions:
- source_word: רוּם שָׁמַיִם
  choice: die Höhe des Himmels
  rationale: רוּם bezeichnet hier die vertikale Ausdehnung; die Genitivverbindung gibt die kosmische Größenangabe natürlich und würdig wieder.
- source_word: רֹחַב אָרֶץ
  choice: die Weite der Erde
  rationale: רֹחַב ist eine räumliche Ausdehnungsangabe. „Weite“ klingt im modernen Deutschen natürlicher als „Breite“, ohne den dimensionalen Sinn aufzugeben.
- source_word: עֹמֶק תְּהוֹם
  choice: die Tiefe des Abgrunds
  rationale: עֹמֶק bezeichnet die Tiefe als Dimension, תְּהוֹם den kosmischen tiefen Abgrund. Die Formulierung bewahrt die Parallele von Höhe, Weite und Tiefe.
- source_word: מִי יַחֲקֹר
  choice: wer kann sie ergründen?
  rationale: Das rhetorische מִי fragt nach der Fähigkeit; „kann“ macht dies im Deutschen idiomatisch deutlich. „Ergründen“ trifft das gründliche, bis in die Tiefe gehende Erforschen von חקר und passt zur kosmischen Bildsprache.
theological_decisions:
- issue: Der griechische Paralleltext fügt „und die Weisheit“ hinzu, der erhaltene hebräische Text nicht.
  choice: Im Haupttext wird dem hochsicher bezeugten Hebräischen gefolgt und „und die Weisheit“ nicht aufgenommen.
  alternative: 'Nach dem griechischen Paralleltext: „Die Höhe des Himmels, die Weite der Erde, den Abgrund und die Weisheit – wer kann sie ergründen?“'
  rationale: Für Sirach hat der erhaltene hebräische Wortlaut Vorrang. Die griechische Erweiterung verändert den Umfang der Frage inhaltlich und wird deshalb als echte Textvariante in der Fußnote bewahrt, nicht stillschweigend in den Haupttext eingefügt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die dreigliedrige räumliche Steigerung wird durch „Höhe“, „Weite“ und „Tiefe“ hörbar erhalten; der Gedankenstrich markiert die abschließende rhetorische Frage.
