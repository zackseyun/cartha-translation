base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/001/031.yaml
  text: My son[a], do not be false in the fear of Yahweh[b], and do not draw near to him with a divided heart.
translation:
  language: de
  text: Mein Sohn[a], sei nicht unaufrichtig in der Furcht vor Jahwe, und nähere dich ihm nicht mit geteiltem Herzen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hebräische Text lautet: „Mein Sohn, sei nicht unaufrichtig in der Furcht vor Jahwe, und nähere dich ihm nicht mit geteiltem Herzen.“ Die griechische Überlieferung bietet an dieser Stelle dagegen einen wesentlich anderen Spruch: „Wer Wohltaten vergilt, denkt an das, was danach kommt, und zur Zeit des Fallens wird er eine Stütze finden.“'
    reason: textual_variant
  - marker: b
    text: 'Wörtlich: „mit Herz und Herz“; eine hebräische Wendung für innere Zwiespältigkeit oder Unaufrichtigkeit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנִי
  choice: Mein Sohn
  rationale: Die maskuline Anrede im Singular wird entsprechend der hebräischen Form und dem Rahmen weisheitlicher Unterweisung bewahrt.
- source_word: אַל תְּכַזֵּב
  choice: sei nicht unaufrichtig
  rationale: כזב bezeichnet hier umfassender als eine einzelne Lüge ein falsches oder heuchlerisches Verhalten. „Unaufrichtig“ gibt diesen ethischen Sinn in natürlichem Deutsch wieder.
- source_word: בְּיִרְאַת יְהֹוָה
  choice: in der Furcht vor Jahwe
  rationale: יראה ist der typische weisheitliche Ausdruck für Gottesfurcht. „Furcht“ bewahrt die biblische Spannung und wird nicht auf bloßen Respekt reduziert; der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
- source_word: וְאַל תִּקְרַב אֵלָיו
  choice: und nähere dich ihm nicht
  rationale: קרב mit אֶל bezeichnet das Sich-Nähern und lässt sowohl die relationale als auch eine mögliche kultische Bedeutung anklingen.
- source_word: בְּלֵב וָלֵב
  choice: mit geteiltem Herzen
  rationale: Wörtlich steht „mit Herz und Herz“. „Mit geteiltem Herzen“ vermittelt die idiomatische Bedeutung innerer Zwiespältigkeit oder Doppelzüngigkeit und bewahrt zugleich das Bild des Herzens.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält ausdrücklich das Tetragramm. „Jahwe“ gibt den persönlichen Gottesnamen wieder, ohne ihn durch einen Titel zu ersetzen.
- issue: Erhebliche Abweichung zwischen hebräischer und griechischer Überlieferung
  choice: Der erhaltene hebräische Wortlaut bildet den Haupttext; die abweichende griechische Fassung wird in einer Fußnote dokumentiert.
  alternative: Den griechischen Vers übersetzen oder beide Fassungen harmonisieren
  rationale: Da ein belastbarer hebräischer Zeuge vorliegt, wird er gemäß der Quellenpriorität übersetzt. Die wesentlich andere griechische Lesart darf weder verschwiegen noch mit dem Hebräischen vermischt werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die traditionelle weisheitliche Anrede und der Ausdruck „Furcht vor Jahwe“ bleiben erhalten; schwer verständliche Wörtlichkeit wird nur dort idiomatisch aufgelöst, wo sie im Deutschen die Bedeutung verdunkeln würde.
