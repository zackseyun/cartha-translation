  text: Who can count the sand of the seas[a], the drops of rain, and the days of eternity?
translation:
  language: de
  text: Wer kann den Sand der Meere, die Regentropfen und die Tage der Ewigkeit[a] zählen?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Tage der Weltzeit“, „die Tage des Zeitalters“ oder „die Tage der Urzeit“. Das hebräische עוֹלָם kann Ewigkeit, eine lange Weltzeit beziehungsweise ein Zeitalter oder die ferne Vorzeit bezeichnen; auch der griechische Paralleltext weist auf eine unermessliche Zeitdauer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חוֹל יַמִּים
  choice: Sand der Meere
  rationale: חוֹל bezeichnet Sand kollektiv; יַמִּים ist Plural. Die Formulierung bewahrt das weite Bild des hebräischen Textes und stimmt mit dem griechischen Paralleltext überein.
- source_word: נִטְפֵי מָטָר
  choice: Regentropfen
  rationale: Die hebräische Genitivverbindung bedeutet wörtlich „Tropfen des Regens“. „Regentropfen“ gibt das konkrete Bild im Deutschen knapp und natürlich wieder.
- source_word: וִימוֹת עוֹלָם
  choice: die Tage der Ewigkeit
  rationale: Die Wendung bezeichnet eine unermessliche zeitliche Dauer. Die Wiedergabe bleibt nahe am Hebräischen und erhält die rhetorische Steigerung; die Mehrdeutigkeit von עוֹלָם wird in einer Fußnote kenntlich gemacht.
- source_word: מִי יִמְנֶה
  choice: Wer kann … zählen?
  rationale: Die Frage drückt im Zusammenhang menschliche Unmöglichkeit beziehungsweise Unermesslichkeit aus. „Wer kann … zählen?“ ist dafür im modernen Deutschen natürlich und prägnant.
theological_decisions:
- issue: Zeitliche Bedeutung von עוֹלָם in der weisheitlichen Übertreibung
  choice: „Ewigkeit“ als Ausdruck unermesslicher Dauer
  alternative: „Weltzeit“, „Zeitalter“ oder „Urzeit“
  rationale: Der Vers nennt Größen, die menschliches Zählen übersteigen. „Ewigkeit“ erhält diese Aussagekraft, ohne daraus eine technische metaphysische Lehre abzuleiten; die echte lexikalische Spannweite wird in der Fußnote bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Aufzählung bleibt knapp und bildhaft; die rhetorische Frage steht wie im Hebräischen am Ende der gedanklichen Einheit.
