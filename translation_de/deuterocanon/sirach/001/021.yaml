  text: Happy is the man who meditates on her[b][a], and she is better for him than every treasure.
translation:
  language: de
  text: Glücklich ist der Mensch, der über sie nachsinnt[a], und sie ist für ihn mehr wert als jeder Schatz.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der über sie meditiert“.'
    reason: lexical_alternative
  - marker: b
    text: 'Der griechische Text lautet hier ganz anders: „Denn die Regung seines Zorns bringt ihn zu Fall.“ Vermutlich liegt ihm eine andere Textform oder Verszuordnung zugrunde als dem erhaltenen hebräischen Text.'
    reason: textual_variant
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: Glücklich ist
  rationale: Die hebräische Seligpreisungsformel bezeichnet einen beneidenswert guten Zustand. „Glücklich ist“ ist gegenwärtiges, verständliches Deutsch; „Wohl dem“ wäre traditioneller, aber weniger unmittelbar.
- source_word: אֱנוֹשׁ
  choice: der Mensch
  rationale: Das Substantiv bezeichnet den Menschen, teils mit dem Beiklang seiner Sterblichkeit. „Der Mensch“ bewahrt den repräsentativen Singular, ohne das Hebräische unnötig auf einen erwachsenen Mann einzuengen.
- source_word: יֶהְגֶּה
  choice: nachsinnt
  rationale: Das Verb הגה bezeichnet anhaltendes inneres Erwägen oder Meditieren. „Nachsinnen“ passt zum Weisheitskontext und verbindet sich im Deutschen natürlich mit „über“.
- source_word: בָּהּ
  choice: über sie
  rationale: Das feminine Pronominalsuffix verweist am ehesten auf die im Zusammenhang personifizierte Weisheit. Das weibliche Pronomen bleibt daher erhalten.
- source_word: וְטוֹבָה
  choice: und sie ist für ihn mehr wert
  rationale: In Verbindung mit מִכָּל ist טוֹבָה komparativ zu verstehen. „Mehr wert“ gibt den Wertvergleich im Deutschen natürlicher wieder als das missverständliche „besser für ihn“.
- source_word: מִכָּל אוֹצָר
  choice: als jeder Schatz
  rationale: אוֹצָר kann einen Schatz, Vorrat oder ein Schatzhaus bezeichnen. Hier liegt im Weisheitsspruch der Wertgegenstand „Schatz“ nahe; „jeder“ bewahrt die umfassende Kraft von מִכָּל.
- source_word: ἡ γὰρ ῥοπὴ τοῦ θυμοῦ αὐτοῦ πτῶσις αὐτῷ
  choice: nicht im Haupttext übernommen
  rationale: Der griechische Zeuge weicht grundlegend vom erhaltenen hebräischen Text ab und dürfte eine andere Textform oder Verszuordnung widerspiegeln. Die Abweichung wird deshalb in einer Fußnote dokumentiert.
theological_decisions:
- issue: Repräsentativer Singular in der Weisheitsseligpreisung
  choice: der Mensch
  alternative: der Mann; wer
  rationale: Das maskuline Singularwort אֱנוֹשׁ fungiert hier allgemein für einen Menschen. „Der Mensch“ wahrt den Singular und seinen repräsentativen Charakter, ohne eine nur männliche Bezugsgruppe zu behaupten.
- issue: Personifikation der Weisheit
  choice: über sie / sie ist
  alternative: darüber / es ist
  rationale: Das feminine hebräische Suffix und der Zusammenhang mit der personifizierten Weisheit sprechen dafür, den weiblichen Bezug beizubehalten und nicht zu versachlichen.
- issue: Stark abweichender griechischer Paralleltext
  choice: Hebräischen Text im Haupttext wiedergeben
  alternative: Griechischen Wortlaut in den Haupttext setzen
  rationale: Für diese Stelle liegt ein hoch bewerteter hebräischer Text vor. Die echte textgeschichtliche Spannung wird nicht harmonisiert, sondern durch eine Variantenfußnote offengelegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Glücklich ist“ hält die Seligpreisung verständlich; „nachsinnt“ trägt den Weisheitston. Die feminine Personifikation bleibt erkennbar, und die stark abweichende griechische Überlieferung wird transparent ausgewiesen.
