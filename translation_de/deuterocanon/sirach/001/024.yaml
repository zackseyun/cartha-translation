  text: In the treasures of wisdom are insightful sayings[b], but godliness[c] is an abomination to a sinner.[a]
translation:
  language: de
  text: In den Schätzen der Weisheit finden sich Sprüche der Erkenntnis,[b] doch Gottesfurcht ist einem Sünder ein Gräuel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die erhaltene hebräische Zeile der Kahana-Ausgabe lautet an dieser Stelle ungefähr: „Er wird sich an ihr freuen, und sie wird sich an ihm freuen; und verlass ihn nicht für immer und ewig.“ Sie stimmt nicht mit dem griechischen Wortlaut dieses Verses überein; der Haupttext folgt daher hier dem griechischen Zeugen.'
    reason: textual_variant
  - marker: b
    text: 'Oder: „Gleichnisse der Erkenntnis“ beziehungsweise „Sinnsprüche der Einsicht“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν θησαυροῖς σοφίας
  choice: In den Schätzen der Weisheit
  rationale: Da die überlieferte hebräische Zeile an dieser Stelle erheblich vom griechischen Vers abweicht, dient der griechische Text als Übersetzungsgrundlage. Die Formulierung bewahrt dessen Schatzmetapher in natürlichem Deutsch.
- source_word: παραβολαὶ ἐπιστήμης
  choice: Sprüche der Erkenntnis
  rationale: παραβολαί bezeichnet hier im weisheitlichen Zusammenhang prägnante Sprüche oder Sinnsprüche; ἐπιστήμης bestimmt sie als von Erkenntnis geprägt. Die wörtliche Genitivverbindung erhält die Mehrdeutigkeit besser als eine rein adjektivische Wiedergabe.
- source_word: βδέλυγμα
  choice: ein Gräuel
  rationale: Das Wort bezeichnet etwas stark Abscheuliches oder Verabscheutes. „Ein Gräuel“ wahrt die kräftige biblische Wertung und ist im Deutschen geläufig.
- source_word: ἁμαρτωλῷ
  choice: einem Sünder
  rationale: Der Dativ bezeichnet die Person, aus deren Sicht beziehungsweise für die Gottesfurcht verabscheuenswert ist.
- source_word: θεοσέβεια
  choice: Gottesfurcht
  rationale: θεοσέβεια meint ehrfürchtige Hinwendung zu Gott und eine daraus erwachsende fromme Lebenshaltung. „Gottesfurcht“ ist verständlich, würdig und im Kontext des Sirachbuches sachgerecht.
theological_decisions:
- issue: Erhebliche Abweichung zwischen dem erhaltenen hebräischen Text und dem griechischen Zeugen
  choice: Der Haupttext wird aus dem griechischen Text übersetzt; die abweichende hebräische Zeile wird in einer Fußnote vollständig dokumentiert.
  alternative: 'Die erhaltene hebräische Zeile als Haupttext übersetzen: „Er wird sich an ihr freuen, und sie wird sich an ihm freuen; und verlass ihn nicht für immer und ewig.“'
  rationale: Die angegebene hebräische Zeile entspricht inhaltlich nicht dem griechisch überlieferten Sirach 1,24 und ist als „major_mismatch“ gekennzeichnet. Der griechische Zeuge bietet hier den kohärenten Vers. Die Fußnote verschweigt die textgeschichtliche Spannung nicht und harmonisiert beide Lesarten nicht.
- issue: Bedeutungsumfang von θεοσέβεια
  choice: Gottesfurcht
  alternative: Frömmigkeit
  rationale: „Gottesfurcht“ bringt den ausdrücklichen Gottesbezug des griechischen Wortes klar zum Ausdruck, ohne die Aussage konfessionell einzuengen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit weisheitlicher Klangfarbe. „Sprüche der Erkenntnis“ bewahrt die substantivische Struktur und die lexikalische Offenheit des Griechischen; „ein Gräuel“ erhält dessen starke Wertung. Sämtliche Fußnotenmarker stehen im Haupttext.
