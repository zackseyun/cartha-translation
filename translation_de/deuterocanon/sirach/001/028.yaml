  text: Do not be hypocritical in the mouths of men[a], and watch your lips.
translation:
  language: de
  text: Heuchle nicht vor den Menschen[a], und achte auf deine Lippen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Heuchle nicht in den Mündern der Menschen.“ Gemeint sein kann auch: „unter den Menschen“; die griechische Wendung ist ungewöhnlich.'
    reason: lexical_alternative
  - marker: b
    text: 'Die hier zugeordnete hebräische Zeile lautet: „Höre alle meine Worte und handle danach, dann wirst du in das Buch des Lebens eingeschrieben.“ Sie scheint nicht zu diesem Vers zu gehören; die Übersetzung folgt daher hier dem griechischen Text.'
    reason: textual_variant
lexical_decisions:
- source_word: μὴ ὑποκριθῇς
  choice: Heuchle nicht
  rationale: Die deponentische Form von ὑποκρίνομαι warnt vor Heuchelei oder Verstellung. „Heuchle nicht“ ist knapp, verständlich und bewahrt den ethischen Nachdruck des griechischen Imperativs.
- source_word: ἐν στόμασιν ἀνθρώπων
  choice: vor den Menschen
  rationale: Wörtlich lautet die ungewöhnliche Wendung „in den Mündern der Menschen“. Im Zusammenhang bezeichnet sie wahrscheinlich das Verhalten in Gegenwart anderer beziehungsweise in der Öffentlichkeit. Die idiomatische Wiedergabe steht im Haupttext; das konkrete Bild und die verbleibende Mehrdeutigkeit werden in der Fußnote dokumentiert.
- source_word: καὶ
  choice: und
  rationale: Die einfache Beiordnung entspricht dem Parallelismus der beiden Satzglieder.
- source_word: ἐν τοῖς χείλεσί σου πρόσεχε
  choice: achte auf deine Lippen
  rationale: πρόσεχε fordert zu Aufmerksamkeit und Vorsicht auf; χείλη bewahrt das körperliche Bild der „Lippen“. Die deutsche Formulierung ist natürlich und lässt den Bezug auf bedachtes Reden erkennen, ohne ihn erklärend in den Text einzutragen.
theological_decisions:
- issue: Textgrundlage bei erheblicher Abweichung zwischen dem überlieferten hebräischen Text und der griechischen Versfassung
  choice: Die Übersetzung folgt für diesen Vers dem griechischen Text und weist in einer Fußnote auf die abweichende hebräische Zeile hin.
  alternative: 'Die vorliegende hebräische Zeile übersetzen: „Höre alle meine Worte und handle danach, dann wirst du in das Buch des Lebens eingeschrieben.“'
  rationale: Die zugewiesene hebräische Zeile entspricht inhaltlich nicht Sirach 1,28 in der griechischen Überlieferung und ist ausdrücklich als erhebliche Fehlzuordnung gekennzeichnet. Daher dient hier der griechische Paralleltext als Übersetzungsgrundlage; die abweichende hebräische Überlieferung wird transparent festgehalten, statt beide Fassungen miteinander zu harmonisieren.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der kurze Imperativstil und das Bild der Lippen bleiben erhalten. Die schwer verständliche griechische Wendung wird im Haupttext idiomatisch wiedergegeben, während die wörtliche Form in der Fußnote sichtbar bleibt.
