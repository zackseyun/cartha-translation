  text: One who fears Yahweh—his end will be good[a]; and at the end of his days he will be blessed.
translation:
  language: de
  text: Wer den HERRN fürchtet, dessen Ende wird gut sein[a], und am Ende seiner Tage wird er gesegnet werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Text weicht an dieser Stelle erheblich ab: »Der Anfang der Weisheit ist, den Herrn zu fürchten; und zusammen mit den Treuen wurde sie im Mutterleib mit ihnen geschaffen.« Der Haupttext folgt dem erhaltenen hebräischen Zeugen.'
    reason: textual_variant
lexical_decisions:
- source_word: יְרֵא יְהֹוָה
  choice: Wer den HERRN fürchtet
  rationale: Das substantivisch gebrauchte Partizip bezeichnet allgemein einen Menschen, dessen Haltung von Gottesfurcht geprägt ist. Die deutsche Relativkonstruktion ist natürlich und bewahrt den generischen Sinn. Der Gottesname wird entsprechend ehrfürchtiger jüdischer Lesetradition und dem griechischen κύριος mit „der HERR“ wiedergegeben.
- source_word: תִּיטַב אַחֲרִיתוֹ
  choice: dessen Ende wird gut sein
  rationale: Die Wendung verbindet טוב mit אַחֲרִית („Ende, Ausgang“). Die Übersetzung hält am Fokus auf dem endgültigen Ausgang fest, ohne ihn auf materielles Wohlergehen oder bloß auf die Zukunft einzuengen.
- source_word: וּבְאַחֲרִית יָמָיו
  choice: und am Ende seiner Tage
  rationale: Die konkrete Zeitangabe wird eng am Hebräischen wiedergegeben und nimmt zugleich das zuvor genannte „Ende“ sprachlich wieder auf.
- source_word: יִתְבָּרָךְ
  choice: wird er gesegnet werden
  rationale: 'Die Form kann grundsätzlich passiv oder reflexiv verstanden werden. Im Parallelismus mit dem guten Ende liegt hier die passive Bedeutung nahe: Der Gottesfürchtige empfängt Segen.'
theological_decisions:
- issue: Das erhaltene Hebräisch und der griechische Text bieten an dieser Versstelle wesentlich verschiedene Aussagen.
  choice: Der Haupttext folgt dem erhaltenen hebräischen Zeugen; die starke Abweichung des Griechischen wird in einer Fußnote vollständig offengelegt.
  alternative: Den griechischen Text als Haupttext wiedergeben oder beide Lesarten harmonisierend verbinden.
  rationale: Da für Jesus Sirach hier ein hochrangig bewerteter hebräischer Text vorliegt, bildet er die Grundlage. Die abweichende griechische Überlieferung darf jedoch weder verschwiegen noch mit dem Hebräischen vermischt werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung von „Ende“ bewahrt den hebräischen Parallelismus. „der HERR“ steht als traditionelle Wiedergabe des Gottesnamens in Kapitälchen-Schreibweise.
