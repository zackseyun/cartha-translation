translation:
  language: de
  text: Die Furcht des HERRN ist Herrlichkeit und Ehre, Größe und eine Krone der Pracht.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Überlieferung lautet wesentlich anders: „Die Furcht des Herrn erfreut das Herz und schenkt Frohsinn, Freude und langes Leben.“'
    reason: alternative_reading
lexical_decisions:
- source_word: יִרְאַת יְהֹוָה
  choice: die Furcht des HERRN
  rationale: Bewahrt die feste hebräische Weisheitsformel und gibt den Gottesnamen nach der üblichen ehrfürchtigen Bibelkonvention als HERR wieder. „Ehrfurcht“ wäre erklärender, würde aber den Bedeutungsumfang von יִרְאָה verengen.
- source_word: כָּבוֹד
  choice: Herrlichkeit
  rationale: Gibt die erhabene Würde von כָּבוֹד wieder und hält den Begriff von יְקָר und תִּפְאָרֶת unterscheidbar.
- source_word: וִיקָר
  choice: und Ehre
  rationale: יְקָר kann Kostbarkeit, Wert oder Ehre bezeichnen; in der parallelen Nominalreihe ist „Ehre“ natürlich und prägnant.
- source_word: וּגְדֻלָּה
  choice: Hoheit
  rationale: גְּדֻלָּה bezeichnet Größe oder Erhabenheit. „Hoheit“ passt zum würdevollen Kontext und klingt im Deutschen natürlicher als das abstrakte „Größe“ in dieser Reihe.
- source_word: וְעֲטֶרֶת תִּפְאָרֶת
  choice: und eine Krone der Pracht
  rationale: Gibt die Konstruktverbindung unmittelbar wieder. „Pracht“ bewahrt die Bildkraft von תִּפְאָרֶת, ohne „Herrlichkeit“ zu wiederholen.
- source_word: φόβος κυρίου τέρψει καρδίαν, καὶ δώσει εὐφροσύνην καὶ χαρὰν καὶ μακροημέρευσιν
  choice: nicht in den Haupttext übernommen
  rationale: Die griechische Überlieferung bietet eine wesentlich andere verbale Aussage. Da der hebräische Text für diesen Vers erhalten ist, bildet er den Haupttext; die griechische Lesart wird vollständig in der Fußnote dokumentiert.
theological_decisions:
- issue: Deutliche Abweichung zwischen dem erhaltenen hebräischen Text und der griechischen Parallelüberlieferung
  choice: Die hebräische nominale Beschreibung steht im Haupttext.
  alternative: 'Der griechischen Lesart folgen: „Die Furcht des Herrn erfreut das Herz und schenkt Frohsinn, Freude und langes Leben.“'
  rationale: Wo der hebräische Sirachtext erhalten ist, erhält er Vorrang. Die erheblich abweichende griechische Lesart bleibt als echte textliche Alternative sichtbar, ohne beide Überlieferungen harmonisierend zu vermischen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die traditionelle Weisheitsformel „Furcht des HERRN“ bleibt erhalten; die gehobene Nominalreihe folgt eng dem Hebräischen, ist aber idiomatisch gestaltet. Der Fußnotenmarker [a] steht im Haupttext.
