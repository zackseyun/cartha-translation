  text: The root of wisdom—to whom has it been revealed? And who has known her subtleties?[a]
translation:
  language: de
  text: Die Wurzel der Weisheit – wem wurde sie offenbart, und wer hat ihre Feinheiten erkannt?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Parallelüberlieferung lautet: „Die Quelle der Weisheit ist das Wort Gottes in den höchsten Höhen, und ihre Wege sind ewige Gebote.“ Der hebräische Text weicht hier erheblich vom griechischen ab.'
    reason: alternative_reading
lexical_decisions:
- source_word: שֹׁרֶשׁ
  choice: Wurzel
  rationale: Bewahrt das konkrete hebräische Bild für Ursprung oder Grundlage, statt es an das griechische πηγή („Quelle“) anzugleichen.
- source_word: הַחָכְמָה
  choice: Weisheit
  rationale: Die übliche und kontextgerechte Wiedergabe von חכמה in der Weisheitsliteratur.
- source_word: לְמִי נִגְלָה
  choice: wem wurde sie offenbart
  rationale: Gibt die passive Bedeutung des Nifal von גלה und die Verbindung mit לְמִי unmittelbar und idiomatisch wieder.
- source_word: מַעֲרֻמֶּיהָ
  choice: ihre Feinheiten
  rationale: Bezeichnet schwer zu durchdringende, subtile Aspekte der personifizierten Weisheit, ohne den möglichen Sinnbereich durch negativ gefärbte Wörter wie „Listen“ unnötig einzuengen.
- source_word: מִי יָדַע
  choice: wer hat … erkannt
  rationale: Das deutsche Perfekt entspricht hier der hebräischen Perfektform in der rhetorischen Frage; „erkannt“ gibt ידע in diesem Erkenntniszusammenhang natürlich wieder.
theological_decisions:
- issue: Erhebliche Abweichung zwischen dem erhaltenen hebräischen Text und der griechischen Parallelüberlieferung
  choice: Der erhaltene hebräische Wortlaut steht im Haupttext; die wesentlich abweichende griechische Fassung wird in einer Fußnote dokumentiert.
  alternative: „Die Quelle der Weisheit ist das Wort Gottes in den höchsten Höhen, und ihre Wege sind ewige Gebote.“
  rationale: Der vorhandene hebräische Zeuge erhält als originalsprachliche Grundlage Vorrang. Da die griechische Fassung nicht nur geringfügig, sondern inhaltlich erheblich abweicht, wird sie transparent als alternative Überlieferung bewahrt, ohne beide Lesarten zu harmonisieren.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Gedankenstrich erhält die knappe rhetorische Struktur. Das Pronomen „sie“ bezieht sich grammatisch auf „Wurzel“; „ihre“ nimmt die im Hebräischen personifizierte Weisheit auf.
