  text: He poured her out upon all flesh according to his will[a], and he gave her to those who love him.
translation:
  language: de
  text: Er goss sie nach seinem Willen über alles Fleisch aus,[a] und gab sie denen, die ihn lieben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der überlieferte hebräische Text lautet im ersten Satzteil: »Er gab sie allem Fleisch nach seinem Willen.« Die griechische Parallelüberlieferung stützt für das Verb die Lesart »er goss sie aus«, spricht jedoch von »allen seinen Werken«. Dieser Wiedergabe wird hier gefolgt, weil der hebräische Text an dieser Stelle als unsicher gilt.'
    reason: textual_variant
lexical_decisions:
- source_word: אֶל כָּל בָּשָׂר
  choice: über alles Fleisch
  rationale: Die hebräische Wendung bedeutet wörtlich »zu allem Fleisch« und kann alle Lebewesen oder die gesamte Menschheit bezeichnen. In Verbindung mit »ausgießen« ist »über alles Fleisch« im Deutschen natürlich und bewahrt zugleich das hebräische Bild.
- source_word: כִּרְצוֹנוֹ
  choice: wie es seinem Willen entsprach
  rationale: רָצוֹן bezeichnet Willen, Wohlgefallen oder Wunsch. Die gewählte Formulierung klingt in modernem Deutsch natürlich und wahrt die Aussage, dass die Zuteilung der Weisheit Gottes freiem Willen folgt.
- source_word: נְתָנָהּ
  choice: Er goss sie … aus
  rationale: Der überlieferte hebräische Text hat eine Form von נתן, »geben«; die griechische Parallelüberlieferung bietet jedoch ἐξέχεεν, »ausgießen«. Da der hebräische Wortlaut an dieser Stelle als textlich unsicher gilt und eine bloße Wiederholung von »geben« verdächtig sein kann, folgt der Haupttext dem griechisch gestützten Sinn und weist die hebräische Lesart in der Fußnote aus.
- source_word: וַיִּתְּנָהּ
  choice: und gab sie
  rationale: Das Verb bedeutet klar »und er gab sie«; das feminine Objektpronomen bezieht sich auf die Weisheit.
- source_word: לְאֹהֲבָיו
  choice: denen, die ihn lieben
  rationale: Die substantivisch gebrauchte Partizipialform bezeichnet diejenigen, die Gott lieben. Diese Wiedergabe ist klar, natürlich und bewahrt den relationalen Sinn.
theological_decisions:
- issue: Abweichung zwischen dem hebräischen Textzeugen und der griechischen Parallelüberlieferung im ersten Satzglied
  choice: Die hebräische Satzstruktur wird bewahrt, beim ersten Verb jedoch der griechisch gestützte Sinn »ausgießen« verwendet.
  alternative: Er gab sie allem Fleisch, wie es seinem Willen entsprach, und gab sie denen, die ihn lieben.
  rationale: Der hebräische Zeuge ist an dieser Stelle als textlich unsicher gekennzeichnet, während die griechische Parallelüberlieferung das im Weisheitskontext passende Bild des Ausgießens bietet. Die Unsicherheit wird nicht verschwiegen, sondern in einer Fußnote dokumentiert; die Aussage über Gottes freien Willen und die besondere Gabe an diejenigen, die ihn lieben, bleibt unverändert erhalten.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Das traditionelle Bild »alles Fleisch« bleibt erhalten, ohne es auf »alle Menschen« oder »alle Geschöpfe« festzulegen.
