translation:
  language: de
  text: Alle Weisheit kommt von Jahwe[a], und bei ihm ist sie in Ewigkeit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: „von Jahwe“; die griechische Parallelüberlieferung hat: „vom Herrn“.'
    reason: Die Fußnote dokumentiert die unterschiedliche Wiedergabe des Gottesnamens in den beiden alten Sprachzeugen.
lexical_decisions:
- source_word: כָּל חָכְמָה
  choice: Alle Weisheit
  rationale: כָּל bezeichnet hier umfassend die Gesamtheit der Weisheit; die Wendung ist im Deutschen natürlich und entspricht auch dem griechischen πᾶσα σοφία.
- source_word: מֵיהֹוָה
  choice: kommt von Jahwe
  rationale: Die Präposition מִן bezeichnet Herkunft beziehungsweise Ursprung. Das im Hebräischen ausdrücklich stehende Tetragramm wird als „Jahwe“ wiedergegeben; „kommt von“ macht die im nominalen Satz ausgesagte Herkunft idiomatisch deutlich.
- source_word: וִעמּוֹ הִיא
  choice: und bei ihm ist sie
  rationale: עִם mit Suffix bedeutet „bei/mit ihm“. Das feminine Pronomen הִיא nimmt חָכְמָה auf; im Deutschen ist daher „sie“ grammatisch und sachlich passend. Die Kopula wird wie auch im griechischen Paralleltext ausdrücklich ergänzt.
- source_word: לְעוֹלָמִים
  choice: in Ewigkeit
  rationale: Der Ausdruck bezeichnet unbegrenzte Dauer. „In Ewigkeit“ wahrt den gehobenen sapientialen Ton und gibt die Aussage natürlicher wieder als das hier weniger flüssige „für immer“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה bei parallelem griechischem Κυρίου
  choice: Jahwe
  alternative: der HERR / der Herr
  rationale: Der hoch bewertete hebräische Text enthält ausdrücklich den Gottesnamen יהוה. Deshalb folgt der Haupttext dem hebräischen Ausgangstext; die griechische Wiedergabe „Herr“ wird in der Fußnote dokumentiert.
- issue: Mögliche Personifikation der Weisheit
  choice: grammatische Rückverweisung „sie“ ohne zusätzliche Personifikation
  alternative: unpersönliches „diese“ oder ausdrücklich personifizierende Formulierung
  rationale: Das feminine Pronomen ist durch das grammatische Geschlecht von „Weisheit“ gefordert. Der Vers allein verlangt keine weitergehende Aussage über eine eigenständige personale Gestalt der Weisheit.
translation_notes:
  register: Modernes, klares Standarddeutsch mit würdigem weisheitlichem Klang. Die Satzstellung bleibt nah am Hebräischen, ohne unnatürlich zu wirken; „sie“ greift das grammatisch feminine Substantiv „Weisheit“ auf.
