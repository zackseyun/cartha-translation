  source_fidelity: 'Der Haupttext gibt den erhaltenen hebräischen Wortlaut vollständig und in seiner Reihung wieder: „Stab der Kraft“ für מַטּהֵ עֹז, „Stütze“ für מַשְׁעֵנָה, „Lob und ewige Ehre“ für תְּהִלָּה וּכְבוֹד עוֹלָם sowie die auf alle Folgenden bezogene Schlusswendung. Die feminine Personifikation bleibt durch „Sie“ und „ihr“ erhalten. Die erhebliche Abweichung des griechischen Paralleltextes wird korrekt nicht in den Haupttext eingearbeitet.'
