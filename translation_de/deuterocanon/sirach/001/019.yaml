  text: She is a staff of strength and a support[a], praise and everlasting honor to everyone who walks after her.
translation:
  language: de
  text: Sie ist ein Stab der Kraft und eine Stütze, Lob und ewige Ehre für alle, die ihr folgen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Paralleltext lautet: „Die Wurzel der Weisheit ist, den Herrn zu fürchten, und ihre Zweige sind langes Leben.“ Der hebräische Textzeuge weicht hier erheblich von der griechischen Überlieferung ab.'
    reason: textual_variant
lexical_decisions:
- source_word: מַטּהֵ עֹז
  choice: ein Stab der Kraft
  rationale: מַטֶּה bezeichnet einen Stab, עֹז Kraft oder Stärke. Die Wiedergabe bewahrt das konkrete Bild eines tragenden, Halt gebenden Stabes und passt zum parallelen Ausdruck „Stütze“.
- source_word: מַשְׁעֵנָה
  choice: eine Stütze
  rationale: Das Substantiv bezeichnet etwas, worauf man sich stützt. „Stütze“ gibt das Bild knapp und natürlich wieder, ohne „Stab“ unnötig zu wiederholen.
- source_word: תְּהִלָּה
  choice: Lob
  rationale: Die Grundbedeutung ist „Lob“. Obwohl im Zusammenhang auch „Ruhm“ möglich wäre, wahrt „Lob“ die konkrete Ausdrucksweise und lässt offen, ob das Lob als Gabe, Ansehen oder Lobenswertsein verstanden wird.
- source_word: כְבוֹד עוֹלָם
  choice: ewige Ehre
  rationale: כָּבוֹד kann „Ehre“ oder „Herrlichkeit“ bedeuten; bei den Menschen, die der Weisheit folgen, ist „Ehre“ im Deutschen natürlicher. עוֹלָם bezeichnet hier unbegrenzte beziehungsweise bleibende Dauer.
- source_word: לְכָל הַהוֹלֵךְ אַחֲרֶיהָ
  choice: für alle, die ihr folgen
  rationale: הלך אחרי ist eine geläufige Wendung für „jemandem folgen“. Die idiomatische deutsche Form bewahrt durch „ihr“ zugleich die weibliche Personifikation der Weisheit.
theological_decisions:
- issue: Erhebliche Abweichung zwischen dem hebräischen und dem griechischen Textzeugen
  choice: Der erhaltene hebräische Wortlaut steht im Haupttext.
  alternative: 'Griechisch: „Die Wurzel der Weisheit ist, den Herrn zu fürchten, und ihre Zweige sind langes Leben.“'
  rationale: Da für dieses Projekt der erhaltene hebräische Sirachtext vorrangig übersetzt wird, bildet die hebräische Zeile den Haupttext. Die wesentlich abweichende griechische Überlieferung wird in einer Fußnote vollständig dokumentiert, ohne beide Textformen miteinander zu harmonisieren.
- issue: Weibliche Personifikation der Weisheit
  choice: Das weibliche Pronomen „ihr“ bleibt erhalten.
  alternative: Unpersönliche Wiedergabe mit „sie“ im Sinne einer bloßen Sache beziehungsweise Umformulierung ohne Pronomen
  rationale: Das hebräische Suffix ist feminin und führt die personifizierte Darstellung der Weisheit fort. Die deutsche Wiedergabe bewahrt dieses Bild.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die poetische Reihung und die Personifikation der Weisheit bleiben erhalten; die idiomatische Wendung „ihr folgen“ vermeidet ein im Deutschen steifes „hinter ihr hergehen“.
