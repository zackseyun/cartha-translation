  text: All her storehouses she fills with delight[b][a], and her granaries with her produce.
translation:
  language: de
  text: Alle ihre Vorratskammern füllt sie mit Begehrenswertem[a][b] und ihre Speicher mit ihrem Ertrag.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hebräische Text lautet: „Alle ihre Vorratskammern füllt sie mit Begehrenswertem und ihre Speicher mit ihrem Ertrag.“ Die griechische Überlieferung lautet dagegen: „Die Krone der Weisheit ist die Furcht des Herrn, hervorsprossend mit Frieden und heilender Gesundheit.“'
    reason: textual_variant
  - marker: b
    text: 'Oder: „mit Kostbarkeiten“, „mit Köstlichkeiten“ oder „mit Freude“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל אוֹצָרֶיהָ
  choice: alle ihre Vorratskammern
  rationale: אוֹצָר kann ein Vorratshaus, einen Speicher oder eine Schatzkammer bezeichnen. Wegen des Parallelismus mit אֲסָמֶיהָ („ihre Speicher“) passt hier der konkrete Lagerungsbegriff „Vorratskammern“; כָּל wird distributiv mit „alle“ wiedergegeben.
- source_word: תְּמַלֵּא
  choice: füllt sie
  rationale: Das hebräische Imperfekt wird als allgemeingültige Aussage der Weisheitsliteratur im Präsens verstanden. Die feminine Subjektform wird durch „sie“ sichtbar und bezieht sich auf die personifizierte Weisheit.
- source_word: חֶמְדָּה
  choice: Kostbarkeiten
  rationale: חֶמְדָּה bezeichnet Begehrenswertes, Kostbares oder Erfreuliches. „Kostbarkeiten“ passt konkret zum Bild gefüllter Vorratskammern, ohne die mögliche Bedeutung „Freude/Wonne“ auszuschließen; Alternativen werden in einer Fußnote genannt.
- source_word: וַאֲסָמֶיהָ
  choice: und ihre Speicher
  rationale: אָסָם bezeichnet einen Speicher, besonders einen Getreidespeicher. „Speicher“ wahrt das landwirtschaftliche Bild und vermeidet eine unnötige Wiederholung von „Vorratskammern“.
- source_word: בִּתְבוּאָתָהּ
  choice: mit ihrem Ertrag
  rationale: תְּבוּאָה kann Ertrag, Ernte oder Erzeugnis bedeuten. „Ertrag“ ist breit genug und erhält durch das feminine Possessivpronomen den Bezug auf die personifizierte Weisheit.
- source_word: στέφανος σοφίας
  choice: nicht in den Haupttext übernommen
  rationale: Die griechische Überlieferung bietet mit „Krone der Weisheit“ eine erheblich abweichende Zeile. Da ein hebräischer Text vorliegt, bestimmt dieser den Haupttext; die griechische Lesart wird als wichtige Textvariante in der Fußnote dokumentiert.
theological_decisions:
- issue: Starke Abweichung zwischen hebräischer und griechischer Überlieferung in Sirach 1,17
  choice: Der erhaltene hebräische Text steht im Haupttext.
  alternative: 'Nach dem Griechischen: „Die Krone der Weisheit ist die Furcht des Herrn; sie lässt Frieden und heilende Gesundheit erblühen.“'
  rationale: Für Jesus Sirach hat der erhaltene hebräische Wortlaut Vorrang. Die deutlich andere griechische Tradition wird nicht harmonisiert oder stillschweigend verworfen, sondern vollständig in einer Fußnote sichtbar gemacht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die konkrete Bildwelt von Vorratskammern, Speichern und Ertrag bleibt erhalten. Die Wortstellung „Alle ihre Vorratskammern füllt sie“ folgt dem hebräischen Fokus, klingt aber weiterhin natürlich; die feminine Personifikation der Weisheit wird mit „sie/ihre“ bewahrt.
