translation:
  language: de
  text: 'Ihre Wurzeln bleiben für immer, und ihre Zweige: langes Leben.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Text lautet: „Ein jähzorniger Mann kann nicht gerechtfertigt werden.“ Die hebräische und die griechische Überlieferung weichen an dieser Stelle erheblich voneinander ab.'
    reason: textual_variant
lexical_decisions:
- source_word: שָׁרְשֶׁיהָ
  choice: ihre Wurzeln
  rationale: Das Substantiv שֹׁרֶשׁ steht mit einem Suffix der 3. Person Singular feminin und verweist im Zusammenhang auf eine feminine Bezugsgröße. Im Deutschen bewahrt „ihre“ diesen Bezug und zugleich das Pflanzenbild.
- source_word: לְעוֹלָם
  choice: bestehen für immer
  rationale: לְעוֹלָם bezeichnet bleibende Dauer. Das im Hebräischen nicht ausdrücklich gesetzte Verb wird mit „bestehen“ idiomatisch ergänzt, ohne das Bild oder die Zeitaussage zu verändern.
- source_word: וַעֲנָפֶיהָ
  choice: und ihre Zweige
  rationale: עָנָף bezeichnet einen Zweig oder Ast. „Zweige“ ist allgemein verständlich und führt das Bild der Wurzeln natürlich fort.
- source_word: אֹרֶךְ יָמִים
  choice: ein langes Leben
  rationale: Die wörtliche Wendung „Länge der Tage“ ist ein hebräisches Idiom für Langlebigkeit. „Ein langes Leben“ gibt den Sinn in natürlichem modernem Deutsch wieder.
theological_decisions:
- issue: Starke Abweichung zwischen dem erhaltenen hebräischen Text und der griechischen Überlieferung zu Sirach 1,20
  choice: Die erhaltene hebräische poetische Zeile steht im Haupttext.
  alternative: 'Nach dem Griechischen: „Ein jähzorniger Mann kann nicht gerechtfertigt werden.“'
  rationale: Wo ein hebräischer Sirach-Text erhalten ist, bildet er hier die Grundlage. Da der griechische Text keine kleine Variante, sondern einen völlig anderen Satz bietet, wird diese erhebliche textgeschichtliche Abweichung ausdrücklich in einer Fußnote dokumentiert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die poetische Pflanzenmetapher bleibt erhalten; das hebräische Idiom אֹרֶךְ יָמִים wird für gewöhnliche Leser sinngemäß als „ein langes Leben“ wiedergegeben.
