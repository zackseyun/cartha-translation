lexical_decisions:
- source_word: בְחָנָהּ
  choice: prüfte sie
  rationale: בחן bezeichnet ein Prüfen oder genaues Untersuchen. „Prüfte“ ist im Deutschen knapp und bewahrt die Folge der hebräischen Verben.
- source_word: וְרָאָהּ
  choice: sah sie
  rationale: ראה bedeutet schlicht „sehen“. Die direkte Wiedergabe erhält den kompakten Stil und die verbale Abfolge.
- source_word: וְסְפָרָהּ
  choice: zählte sie
  rationale: ספר bedeutet in diesem Zusammenhang „zählen“ oder „abzählen“. „Zählte“ bewahrt das Bild, dass die Weisheit vollständig erfasst wird.
- source_word: וּנְתָנָהּ
  choice: gab er sie
  rationale: נתן ist das gewöhnliche Verb für „geben“. Die Wiedergabe bleibt bewusst direkt und fügt keine nicht ausdrücklich vorhandene Bedeutung hinzu.
- source_word: לְאֹהֲבָיו
  choice: denen, die ihn lieben
  rationale: Das maskuline singularische Suffix verweist am natürlichsten auf Gott als unausgesprochenes Subjekt. Die Formulierung ist idiomatisches modernes Deutsch und wahrt den Bezug des hebräischen Textes.
- source_word: הּ suffixes on feminine verbs/objects
  choice: sie
  rationale: Die femininen Objektsuffixe beziehen sich am natürlichsten auf die Weisheit, die im Hebräischen feminin ist. „Sie“ bewahrt deren literarische Personifikation.
theological_decisions:
- issue: Verhältnis der hebräischen Zeile zur erheblich abweichenden griechischen Überlieferung
  choice: Der erhaltene hebräische Text steht im Haupttext; die griechische Fassung wird als bedeutende Textvariante in einer Fußnote dokumentiert.
  alternative: 'Eine griechisch basierte Wiedergabe: „Einer ist weise, überaus furchtgebietend, der auf seinem Thron sitzt.“'
  rationale: Der hebräische Text ist erhalten, in sich schlüssig und übersetzbar. Da die griechische Überlieferung inhaltlich stark abweicht, darf diese Differenz jedoch nicht verschwiegen werden.
- issue: Bezug des Ausdrucks „denen, die ihn lieben“
  choice: Das maskuline Pronomen bezieht sich auf Gott als unausgesprochenes Subjekt.
  alternative: „denen, die sie lieben“, mit sinngemäßem Bezug auf die Weisheit
  rationale: Das Suffix in לְאֹהֲבָיו ist maskulin Singular. Daher ist „ihn“ die grammatisch textnähere Wiedergabe, ohne Gott im Haupttext ausdrücklich einzusetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper, parataktischer Satzführung. Die feminine Personifikation der Weisheit bleibt erhalten. Das Semikolon markiert die Verknüpfung der drei Erkenntnisverben mit dem anschließenden Geben, während „dann“ die Abfolge natürlich verdeutlicht.
