translation:
  language: de
  text: Er prüfte sie, sah sie und zählte sie[a]; dann gab er sie denen, die ihn lieben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Parallelüberlieferung lautet: „Einer ist weise, überaus furchtgebietend, der auf seinem Thron sitzt.“ Der erhaltene hebräische Text weicht hier erheblich von der griechischen Überlieferung ab.'
