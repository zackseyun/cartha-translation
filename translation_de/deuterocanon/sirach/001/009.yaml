  naturalness: »Unter allem Fleisch« wirkt im heutigen Standarddeutsch ungewohnt und kann räumlich verstanden werden. »Unter allen Lebewesen« ist idiomatisch und bewahrt den umfassenden kollektiven Sinn. Die Satzfragmentform bleibt erhalten, da der griechische Text selbst an den vorhergehenden Vers anschließt.
  terminology: »Gabe«, »gewährte«, »sie« (Weisheit) und »denen, die ihn lieben« sind sachgerecht. Die Fußnote soll die wörtlichere sowie die anderen möglichen Richtungsnuancen der Präpositionalphrase kenntlich machen.
