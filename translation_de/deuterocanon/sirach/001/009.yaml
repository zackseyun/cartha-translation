translation:
  language: de
  text: unter allen Lebewesen, entsprechend seiner Gabe[a], und er gewährte sie denen, die ihn lieben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »mit allem Fleisch«; auch: »unter allem Fleisch« oder »an alles Fleisch«. Die griechische Wendung kann die Verteilung der Weisheit unter allen Lebewesen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ πάσης σαρκός
  choice: unter allem Fleisch
  rationale: μετά mit Genitiv kann »mit« oder im Sinn einer Verteilung »unter« bedeuten. »Alles Fleisch« bewahrt das konkrete, kollektiv gebrauchte Bild für sterbliche Lebewesen und verengt es nicht auf die Menschheit.
- source_word: κατὰ τὴν δόσιν αὐτοῦ
  choice: entsprechend seiner Gabe
  rationale: δόσις bezeichnet das Geben oder die Gabe; κατὰ drückt hier die Maßgabe aus. Die Formulierung lässt offen, ob die Art oder das Maß der Zuteilung im Vordergrund steht.
- source_word: ἐχορήγησεν
  choice: gewährte
  rationale: χορηγέω bezeichnet das Gewähren, Bereitstellen oder reichliche Zuteilen. »Gewährte« ist im Deutschen würdig und natürlich, ohne die Art der Gabe näher auszudeuten.
- source_word: αὐτήν
  choice: sie
  rationale: Das feminine Pronomen verweist auf die im Kontext feminin personifizierte Weisheit; das deutsche »sie« erhält diesen Bezug.
- source_word: τοῖς ἀγαπῶσιν αὐτόν
  choice: denen, die ihn lieben
  rationale: Die substantivierte Partizipialgruppe bezeichnet die Empfänger; das maskuline Pronomen bezieht sich im Kontext auf Gott.
theological_decisions:
- issue: Bezug der Pronomen
  choice: Das feminine »sie« bezeichnet die Weisheit, das maskuline »ihn« Gott.
  alternative: Die Weisheit könnte unpersönlich als »es« wiedergegeben werden; der letzte Bezug könnte weniger ausdrücklich bestimmt bleiben.
  rationale: Genus, Syntax und Kontext von Sirach 1 sprechen für die personifizierte Weisheit als Empfängerin des femininen Pronomens und für Gott als Bezug des maskulinen Pronomens. Die Übersetzung bewahrt diese literarisch-theologische Gestaltung, ohne sie weiter auszubauen.
- issue: Reichweite von »alles Fleisch«
  choice: Die konkrete und potenziell umfassende Wendung wird beibehalten.
  alternative: »alle Menschen« würde den Ausdruck ausdrücklich anthropologisch verengen.
  rationale: σάρξ ist hier kollektiv gebraucht und kann sterbliche Wesen beziehungsweise Lebewesen bezeichnen. Der griechische Wortlaut rechtfertigt keine stillschweigende Beschränkung auf Menschen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrtem biblischem Ausdruck »alles Fleisch«. Der Text bleibt als syntaktische Fortsetzung des vorangehenden Zusammenhangs kleingeschrieben und erhält die Mehrdeutigkeit der griechischen Präpositionalphrase.
