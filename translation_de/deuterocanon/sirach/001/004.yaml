revisions:
- from: Mehr als all dies ist die Weisheit groß, und die Wahrheit ist von jeher mächtig.[a]
  to: Die Weisheit ist größer als all dies, und die Wahrheit hat von jeher die Oberhand.[a]
  rationale: Die Revision folgt im Haupttext konsequent dem erhaltenen hebräischen Wortlaut, verbessert aber dessen idiomatische deutsche Wiedergabe und erhält den verbalen Aspekt von וגברה. Die deutlich abweichende griechische Fassung bleibt vollständig und ohne harmonisierende Mischform in der Fußnote dokumentiert.
