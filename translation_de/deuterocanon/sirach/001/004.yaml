translation:
  language: de
  text: Die Weisheit ist größer als all dies, und die Wahrheit hat von jeher die Oberhand.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Paralleltext lautet: „Vor allen Dingen wurde die Weisheit erschaffen, und Einsicht des Verstandes ist von Ewigkeit her.“'
    reason: alternative_reading
lexical_decisions:
- source_word: מִכָּל אֵלֶּה רַבָּה הַחָכְמָה
  choice: Mehr als all dies ist die Weisheit groß
  rationale: Gibt den erhaltenen hebräischen Vergleich mit מִן und das Prädikat רַבָּה unmittelbar wieder, ohne aus dem griechischen Paralleltext ein Erschaffen in den Haupttext einzutragen.
- source_word: וְגָבְרָה הָאֱמֶת
  choice: und die Wahrheit ist … mächtig
  rationale: Bewahrt הָאֱמֶת als Substantiv und gibt גבר in seinem Sinn von stark bzw. mächtig sein wieder. Das Perfekt kann hier einen seit alters bestehenden Zustand bezeichnen.
- source_word: מֵעוֹלָם
  choice: von jeher
  rationale: Bezeichnet uralte, anfangslose Vorzeit, ohne eindeutiger als das Hebräische eine metaphysische Ewigkeit festzulegen.
theological_decisions:
- issue: Starke Abweichung zwischen dem erhaltenen Hebräisch und dem griechischen Paralleltext
  choice: Der Haupttext folgt dem hoch sicher bezeugten hebräischen Wortlaut; die griechische Lesart wird in einer Fußnote vollständig dokumentiert.
  alternative: „Vor allem wurde die Weisheit erschaffen, und verständige Einsicht besteht von Ewigkeit her.“
  rationale: Die hebräische Quelle ist vorhanden und als hoch sicher sowie übereinstimmend validiert. Die griechische Fassung bietet in beiden Satzhälften einen deutlich anderen Text; diese echte textgeschichtliche Spannung darf nicht durch eine Mischübersetzung verdeckt werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die leicht poetische Stellung „ist die Weisheit groß“ spiegelt den hebräischen Weisheitsspruch; „von jeher“ wahrt dessen zeitliche Offenheit.
