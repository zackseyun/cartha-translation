  text: The fear of Yahweh gladdens the heart[a], and gives joy and favor and length of days.
translation:
  language: de
  text: Die Furcht des HERRN erfreut das Herz[a] und schenkt Freude, Gunst und ein langes Leben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Überlieferung lautet: »Wer den Herrn fürchtet, dem wird es am Ende gut gehen, und am Tag seines Todes wird er gesegnet werden.« Sie bewahrt hier eine wesentlich andere Fassung des Verses.'
    reason: alternative_reading
lexical_decisions:
- source_word: יִרְאַת יְהֹוָה
  choice: die Furcht des HERRN
  rationale: יִרְאָה bezeichnet hier die ehrfürchtige Gottesfurcht, ohne dass der Bedeutungsumfang auf bloße »Ehrfurcht« verengt wird. Der Gottesname wird gemäß der Übersetzungskonvention mit »HERR« wiedergegeben.
- source_word: מְשַׂמַּחַת לֵב
  choice: erfreut das Herz
  rationale: 'Die Partizipialform hat kausative Bedeutung: Die Furcht des HERRN macht das Herz froh. »Erfreut das Herz« ist natürliches, würdiges Deutsch und bewahrt »Herz« als Bezeichnung des inneren Menschen.'
- source_word: וְנוֹתֶנֶת שִׂמְחָה
  choice: und schenkt Freude
  rationale: »Schenkt« gibt נתן idiomatisch wieder und passt zur Aufzählung der guten Wirkungen; שִׂמְחָה wird direkt mit »Freude« übersetzt.
- source_word: חֵן
  choice: Gunst
  rationale: חֵן kann Gunst, Anmut oder Gnade bedeuten. »Gunst« passt in dieser Weisheitsaussage am besten und vermeidet eine unnötige dogmatische Festlegung.
- source_word: אֹרֶךְ יָמִים
  choice: ein langes Leben
  rationale: Die hebräische Wendung bedeutet wörtlich »Länge der Tage«. »Ein langes Leben« gibt das Idiom in klarem, modernem Deutsch wieder.
theological_decisions:
- issue: Deutliche Abweichung zwischen dem hebräischen Text und der griechischen Überlieferung
  choice: Der erhaltene hebräische Text steht im Haupttext; die erheblich abweichende griechische Fassung wird vollständig in einer Fußnote dokumentiert.
  alternative: »Wer den Herrn fürchtet, dem wird es am Ende gut gehen, und am Tag seines Todes wird er gesegnet werden.«
  rationale: Der hebräische Ben-Sira-Text ist hier vorhanden, in sich schlüssig und daher die primäre Grundlage. Die griechische Fassung bietet jedoch nicht nur eine kleine Variante, sondern einen anderen Ausspruch; diese Spannung darf weder harmonisiert noch verschwiegen werden.
translation_notes:
  register: Modernes, verständliches und zugleich würdiges Standarddeutsch. »Furcht« bewahrt die Stärke des hebräischen Begriffs; »erfreut« und »schenkt« sorgen für einen natürlichen Satzfluss. Der Fußnotenmarker [a] steht unmittelbar an der ersten inhaltlichen Satzaussage, um die abweichende Gesamtfassung der griechischen Überlieferung kenntlich zu machen.
