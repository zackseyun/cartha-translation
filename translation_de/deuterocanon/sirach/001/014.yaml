  text: The beginning of wisdom is the fear of Yahweh[b][a], and with the faithful she was formed in the womb.
translation:
  language: de
  text: Der Anfang der Weisheit ist die Furcht vor Jahwe, und zusammen mit den Treuen wurde sie im Mutterleib gebildet.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Überlieferung lautet erheblich anders: „Unter den Menschen nistete sie als ewige Grundlage, und mit ihren Nachkommen wird sie anvertraut werden.“ Der hebräische und der griechische Text weichen hier stark voneinander ab.'
    reason: alternative_reading
  - marker: b
    text: 'Möglicherweise auch: „wurde im Mutterleib bewahrt“ oder „behütet“, falls das hebräische Verb von einer Wurzel mit der Bedeutung „bewahren, behüten“ abgeleitet wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רֵאשִׁית חָכְמָה
  choice: der Anfang der Weisheit
  rationale: Die hebräische Status-constructus-Verbindung bezeichnet am natürlichsten den Anfang oder Ausgangspunkt der Weisheit und greift eine geläufige weisheitliche Formulierung auf.
- source_word: יִרְאַת יְהֹוָה
  choice: die Furcht vor Jahwe
  rationale: „Furcht“ bewahrt die Spannweite des hebräischen יִרְאָה besser als das abschwächende „Ehrfurcht“; der Gottesname wird als „Jahwe“ wiedergegeben.
- source_word: וְעִם נֶאֱמָנִים
  choice: und zusammen mit den Treuen
  rationale: עִם bedeutet unmittelbar „mit“; „zusammen mit“ ist im Deutschen natürlich. נֶאֱמָנִים bezeichnet hier substantivisch treue beziehungsweise zuverlässige Menschen.
- source_word: נוֹצְרָה
  choice: wurde … gebildet
  rationale: Im Zusammenhang mit בַּבֶּטֶן liegt ein Bildungs- oder Entstehungsvorgang nahe. Da die Konsonanten auch mit der Wurzel נצר „bewahren, behüten“ verbunden werden können, wird diese Unsicherheit in einer Fußnote offengelegt.
- source_word: בַבָּטֶן
  choice: im Mutterleib
  rationale: In Verbindung mit dem Vorgang des Gebildetwerdens bezeichnet בֶּטֶן hier natürlich den Mutterleib; „Bauch“ wäre zwar wörtlicher möglich, aber weniger treffend.
theological_decisions:
- issue: Wiedergabe des Gottesnamens
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält ausdrücklich das Tetragramm; „Jahwe“ gibt den Eigennamen wieder, ohne ihn durch einen Titel zu ersetzen.
- issue: Starke Abweichung zwischen hebräischer und griechischer Überlieferung
  choice: Der erhaltene hebräische Wortlaut steht im Haupttext; die griechische Fassung erscheint in einer Fußnote.
  alternative: Die griechische Fassung als Haupttext übersetzen.
  rationale: Da für Jesus Sirach vorhandener hebräischer Text als primärer Ausgangstext dient, wird er übersetzt. Die erheblich abweichende griechische Überlieferung ist jedoch textgeschichtlich bedeutsam und darf nicht stillschweigend übergangen werden.
- issue: Mögliche Bedeutung von נוֹצְרָה
  choice: wurde gebildet
  alternative: wurde bewahrt / behütet
  rationale: Die Mutterleibsmetaphorik stützt im unmittelbaren Zusammenhang „gebildet“. Die morphologisch-lexikalische Alternative bleibt jedoch echt und wird deshalb nicht verschwiegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die feste weisheitliche Wendung „Furcht vor Jahwe“ bleibt in ihrer theologischen Spannung erhalten. Das feminine Pronomen „sie“ nimmt eindeutig „die Weisheit“ auf; die ungewöhnliche Verbindung von den Treuen und dem Mutterleib wird nicht interpretierend geglättet.
