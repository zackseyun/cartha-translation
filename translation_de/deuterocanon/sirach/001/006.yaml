  text: One alone is fearsome[b][a], God ruling over all her storehouses.
translation:
  language: de
  text: Wem ist die Wurzel der Weisheit offenbart worden, und wer hat ihre kunstvollen Pläne erkannt?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die erhaltene hebräische Zeile weicht hier erheblich von der griechischen Überlieferung ab. Sie lautet sinngemäß: „Einer allein ist furchtgebietend, Gott, der über all ihre Vorratskammern herrscht.“ Da sie Sirach 1,6 in der griechischen Tradition nicht entspricht, folgt der Haupttext dem Griechischen.'
    reason: textual_variant
  - marker: b
    text: 'Oder: „ihre Kunstgriffe“, „ihre klugen Strategien“ oder „ihre Wirkungsweisen“. Das griechische Wort bezeichnet kunstvoll oder klug ersonnene Vorgehensweisen und kann je nach Zusammenhang auch einen negativen Beiklang haben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ῥίζα σοφίας
  choice: Wurzel der Weisheit
  rationale: Da die überlieferte hebräische Zeile erheblich abweicht, dient hier der griechische Paralleltext als operative Textgrundlage. „Wurzel“ gibt ῥίζα wörtlich wieder und bewahrt das Bild vom verborgenen Ursprung der Weisheit.
- source_word: τίνι ἀπεκαλύφθη
  choice: Wem ist … offenbart worden
  rationale: Die passive Form von ἀποκαλύπτω wird im Deutschen natürlich als rhetorische Frage wiedergegeben; „offenbart“ bewahrt den Gedanken einer zuvor verborgenen Wirklichkeit.
- source_word: πανουργεύματα αὐτῆς
  choice: ihre kunstvollen Pläne
  rationale: πανουργεύματα bezeichnet klug oder kunstvoll ersonnene Vorgehensweisen und kann andernorts negativ als „Kunstgriffe“ verstanden werden. „Kunstvolle Pläne“ wahrt hier den Gedanken komplexer, kluger Gestaltung, ohne der Weisheit unpassend Täuschung zu unterstellen.
- source_word: τίς ἔγνω
  choice: wer hat … erkannt
  rationale: „Erkannt“ gibt das auf Einsicht zielende γινώσκω in der zeitlos-rhetorischen Frage idiomatisch wieder.
theological_decisions:
- issue: Textgrundlage bei erheblich abweichendem hebräischem Zeugen
  choice: Der Haupttext folgt dem griechischen Paralleltext.
  alternative: 'Die erhaltene hebräische Zeile als Text von Sirach 1,6 übersetzen: „Einer allein ist furchtgebietend, Gott, der über all ihre Vorratskammern herrscht.“'
  rationale: Die angegebene hebräische Zeile ist ausdrücklich als erhebliche Abweichung gekennzeichnet und entspricht inhaltlich nicht Sirach 1,6 der griechischen Überlieferung. Daher folgt der Haupttext dem vollständig bezeugten griechischen Vers; die Abweichung wird transparent in einer Fußnote dokumentiert.
- issue: Mögliche negative Färbung von πανουργεύματα
  choice: kunstvolle Pläne
  alternative: Kunstgriffe / kluge Strategien / Wirkungsweisen
  rationale: Das Wort kann List oder fragwürdige Kunstgriffe bezeichnen, doch bei der personifizierten Weisheit legt der Zusammenhang keine moralisch negative Wertung fest. Die Übersetzung bewahrt den Aspekt kluger, komplexer Gestaltung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die beiden parallelen rhetorischen Fragen und das Wurzelbild des griechischen Textes bleiben erhalten; die personifizierte Weisheit wird durch „ihre“ sichtbar gemacht. Die Fußnotenmarker stehen in der Reihenfolge ihrer Bezugspunkte am Versende.
