  text: For wisdom and instruction are fear of the Lord, and his good pleasure is faith and meekness.
translation:
  language: de
  text: Denn Weisheit und Unterweisung sind die Furcht des Herrn, und was ihm gefällt, sind Glaube und Sanftmut.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die hier überlieferte hebräische Zeile stimmt nicht mit dem Wortlaut dieses Verses überein. Die Übersetzung folgt daher dem griechischen Text von Sirach 1,26.
    reason: textual_variant
  - marker: b
    text: 'Oder: „und seine Gunst sind Treue und Milde“. Das griechische Wort für „Glaube“ kann auch „Treue“ oder „Vertrauen“ bedeuten; das Wort für „Sanftmut“ auch „Milde“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σοφία
  choice: Weisheit
  rationale: Die griechische Parallelüberlieferung ist für diesen Vers die maßgebliche Textgrundlage; σοφία bezeichnet hier Weisheit im umfassenden sittlichen und praktischen Sinn.
- source_word: παιδεία
  choice: Unterweisung
  rationale: Unterweisung gibt den allgemeinen Sinn von Bildung, Erziehung und Anleitung wieder, ohne den Begriff einseitig auf Züchtigung oder Strafe zu verengen.
- source_word: φόβος κυρίου
  choice: Furcht des Herrn
  rationale: Die quellennah und weisheitlich geprägte Wendung bewahrt sowohl Ehrfurcht als auch das ernsthafte Bewusstsein der göttlichen Autorität.
- source_word: ἡ εὐδοκία αὐτοῦ
  choice: was ihm gefällt
  rationale: Die natürliche deutsche Formulierung gibt wieder, woran der Herr Wohlgefallen hat, und vermeidet das im heutigen Deutsch missverständliche Substantiv „Wohlgefallen“.
- source_word: πίστις
  choice: Glaube
  rationale: Glaube ist die traditionelle und mögliche Wiedergabe; die ebenfalls kontextuell plausible Bedeutung „Treue“ wird in einer Fußnote bewahrt.
- source_word: πρᾳότης
  choice: Sanftmut
  rationale: Sanftmut bezeichnet die Haltung milder, nicht selbstbehauptender Stärke und erhält den traditionellen ethischen Begriff; „Milde“ bleibt als Alternative möglich.
theological_decisions:
- issue: Auswahl des Ausgangstextes bei nicht entsprechendem hebräischem Zeugnis
  choice: Übersetzung nach dem griechischen Text von Sirach 1,26
  alternative: Übersetzung der vorgelegten hebräischen Zeile
  rationale: Die angegebene hebräische Zeile entspricht inhaltlich nicht Sirach 1,26 und ist ausdrücklich als gravierende Abweichung gekennzeichnet. Daher dient die griechische Überlieferung als Ausgangstext; die Textlage wird offengelegt.
- issue: Bedeutung von πίστις
  choice: Glaube
  alternative: Treue oder Vertrauen
  rationale: Der Begriff kann Glaube, Vertrauen oder Treue bezeichnen. Der Haupttext wahrt die traditionelle Wiedergabe, während die echte lexikalische Mehrdeutigkeit in der Fußnote erhalten bleibt.
- issue: Bezug von ἡ εὐδοκία αὐτοῦ
  choice: das, was dem Herrn gefällt
  alternative: seine Gunst
  rationale: Der Genitiv kann im Deutschen unterschiedlich aufgefasst werden. Im Satzgefüge liegt die Bedeutung dessen, woran der Herr Gefallen hat, näher; „seine Gunst“ wird als mögliche Lesart vermerkt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die traditionelle weisheitliche Wendung „Furcht des Herrn“ bleibt erhalten; „was ihm gefällt“ ist gegenüber dem steiferen „sein Wohlgefallen“ idiomatischer. Beide Fußnotenmarker stehen im Haupttext.
