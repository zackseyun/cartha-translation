  text: Until the right time he will conceal his words, and the lips of many will recount his understanding.[a]
translation:
  language: de
  text: Bis zur rechten Zeit wird er seine Worte verbergen, und die Lippen vieler werden seine Einsicht darlegen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der erhaltene hebräische Text aus der Kairoer Geniza weicht hier stark vom Griechischen ab und lautet ungefähr: „Eine ewige Krone wirst du ihm aufsetzen und ewiges Verdienst unter den Heiligen.“ Da dieser hebräische Textzeuge für diesen Vers als erhebliche Abweichung eingestuft ist, folgt der Haupttext dem Griechischen.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἕως καιροῦ
  choice: Bis zur rechten Zeit
  rationale: καιρός bezeichnet hier eher den passenden oder bestimmten Zeitpunkt als bloß eine Zeitspanne. „Zur rechten Zeit“ gibt diese Nuance idiomatisch wieder, ohne einen ausdrücklich festgesetzten Termin vorauszusetzen.
- source_word: κρύψει
  choice: wird er … verbergen
  rationale: Das Futur von κρύπτω bezeichnet das Verbergen oder Zurückhalten. „Verbergen“ bewahrt den formalen Sinn und passt zum Zusammenhang zurückhaltenden Redens.
- source_word: τοὺς λόγους αὐτοῦ
  choice: seine Worte
  rationale: Die direkte Wiedergabe erhält den sprachlichen Bezug zu den später genannten Lippen und vermeidet eine erklärende Erweiterung.
- source_word: χείλη πολλῶν
  choice: die Lippen vieler
  rationale: Die konkrete Metonymie des Griechischen wird bewahrt. Sie entspricht dem poetischen Stil der Weisheitsliteratur und bleibt im Deutschen verständlich.
- source_word: ἐκδιηγήσεται
  choice: werden … erzählen
  rationale: Das Verb bezeichnet ausführliches Darlegen oder Erzählen. Im Deutschen ist „von seiner Einsicht erzählen“ natürlich und gibt mehr als ein bloßes Erwähnen wieder.
- source_word: σύνεσιν αὐτοῦ
  choice: seine Einsicht
  rationale: σύνεσις bezeichnet verstehende Einsicht oder Urteilsvermögen. „Einsicht“ klingt in deutscher Weisheitsliteratur natürlich und vermeidet die mögliche Mehrdeutigkeit von „Verständnis“.
theological_decisions:
- issue: Textgrundlage bei starker Abweichung zwischen dem überlieferten hebräischen Text und der griechischen Versfassung
  choice: Der Haupttext folgt der griechischen Parallelüberlieferung; die stark abweichende hebräische Zeile wird in einer Fußnote dokumentiert.
  alternative: 'Den erhaltenen hebräischen Wortlaut als Haupttext übersetzen: „Eine ewige Krone wirst du ihm aufsetzen und ewiges Verdienst unter den Heiligen.“'
  rationale: Der bereitgestellte hebräische Wortlaut entspricht inhaltlich nicht dem griechischen Sirach 1,23 und ist ausdrücklich als „major_mismatch“ gekennzeichnet. Die griechische Überlieferung bietet hier die versbezogene, zusammenhängende Textgrundlage. Die hebräische Lesart wird nicht harmonisiert oder verschwiegen, sondern als abweichende Überlieferung offengelegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die poetische Wendung „die Lippen vieler“ bleibt als verständliche Metonymie erhalten; „zur rechten Zeit“ und „Einsicht“ vermitteln den weisheitlichen Ton ohne konfessionelle Zusätze.
