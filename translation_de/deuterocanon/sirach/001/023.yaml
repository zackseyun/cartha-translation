revisions:
- from: Bis zur rechten Zeit wird er seine Worte verbergen, und die Lippen vieler werden von seiner Einsicht erzählen.[a]
  to: Bis zur rechten Zeit wird er seine Worte verbergen, und die Lippen vieler werden seine Einsicht darlegen.[a]
  rationale: Eine geringfügige stilistisch-semantische Anpassung ersetzt „von seiner Einsicht erzählen“ durch „seine Einsicht darlegen“. Dadurch wird die ausdrückende, entfaltende Bedeutung von ἐκδιηγήσεται genauer wiedergegeben, während Bildsprache, Register, Textgrundlage und die dokumentierte abweichende hebräische Lesart unverändert bleiben.
