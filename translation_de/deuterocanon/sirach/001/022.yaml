  text: Until the appointed time, the patient one[b] will endure, and afterward joy will be repaid to him.[a]
translation:
  language: de
  text: Bis zum rechten Zeitpunkt wird der Geduldige[b] standhalten, und danach wird die Freude zu ihm zurückkehren.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der für diesen Vers vorgelegte hebräische Satz ist offenbar einem anderen Kontext zugeordnet und lautet sinngemäß: „Glücklich ist der Mensch, der sich ihr nähert und an ihren Weisungen Freude hat.“ Die Übersetzung folgt deshalb hier der griechischen Überlieferung.'
    reason: textual_variant
  - marker: b
    text: 'Oder: „der Langmütige“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕως καιροῦ
  choice: Bis zur rechten Zeit
  rationale: καιρός bezeichnet hier nicht bloß einen Zeitraum, sondern den passenden oder entscheidenden Zeitpunkt. „Zur rechten Zeit“ wahrt diese Nuance, ohne eine ausdrücklich göttliche Festsetzung in den Text einzutragen.
- source_word: ἀνέξεται
  choice: hält … aus
  rationale: Die Futurform bezeichnet standhaftes Ertragen oder Durchhalten. Das deutsche Präsens kann in einer allgemeinen Weisheitsaussage auch die zukünftige Bewährung natürlich ausdrücken.
- source_word: μακρόθυμος
  choice: der Geduldige
  rationale: Das Adjektiv wird substantivisch und allgemein gebraucht. „Der Geduldige“ ist verständlich, wahrt den Singular und gibt die Haltung lang anhaltender Geduld wieder.
- source_word: ὕστερον
  choice: danach
  rationale: Das schlichte Zeitadverb markiert klar die Folge auf das Ausharren.
- source_word: ἀναδώσει
  choice: wird … zuteil
  rationale: Im Zusammenhang mit εὐφροσύνη beschreibt das Verb das spätere Hervortreten oder Gewährtwerden der Freude. Die idiomatische Wendung vermeidet einen ungenannten Handelnden und die im Deutschen missverständliche Aussage, Freude werde als Schuld „zurückgezahlt“.
- source_word: εὐφροσύνη
  choice: Freude
  rationale: Das Substantiv bezeichnet Freude oder Frohsinn; „Freude“ ist die natürliche und würdige Entsprechung.
theological_decisions:
- issue: Abweichung zwischen dem zugeordneten hebräischen Text und der griechischen Versüberlieferung
  choice: Die griechische Parallelüberlieferung bildet die Textgrundlage; die Abweichung wird in einer Fußnote offengelegt.
  alternative: Den vorgelegten hebräischen Satz „Glücklich ist der Mensch, der sich ihr nähert …“ übersetzen.
  rationale: Der hebräische Satz entspricht diesem Vers inhaltlich nicht und ist in den Quelldaten ausdrücklich als erhebliche Fehlzuordnung gekennzeichnet. Die griechische Überlieferung bietet dagegen den zu Sirach 1,22 gehörenden Text. So bleibt die Übersetzung an der einschlägigen originalsprachlichen Überlieferung orientiert, ohne die Textlage zu verschweigen.
- issue: Nicht ausdrücklich genannter Urheber der späteren Freude
  choice: „wird ihm Freude zuteil“ lässt den Geber unausgesprochen.
  alternative: „Gott wird ihm Freude schenken“ oder „Freude wird ihm vergolten werden“.
  rationale: Der griechische Text nennt Gott an dieser Stelle nicht ausdrücklich. Die Übersetzung bewahrt daher die mögliche göttliche Mitwirkung, macht sie aber nicht expliziter als die Vorlage.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die sprichwörtliche Aussage wird im natürlichen deutschen Präsens wiedergegeben; der zeitliche Ablauf bleibt durch „Bis …; danach …“ eindeutig. Das generische substantivierte Adjektiv folgt der singularischen Form der griechischen Vorlage.
