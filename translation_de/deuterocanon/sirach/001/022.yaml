    issue: Die Wiedergabe von ἀναδώσει als „wird ihm Freude zuteil“ lässt die im Verb enthaltene Rückkehr-/Wiedergewährungsnuance aus.
    rationale: ἀναδίδωμι bedeutet hier nicht bloß, dass Freude gewährt wird, sondern dass sie ihm zurückkehrt bzw. wieder zuteilwird. Die deutsche Formulierung sollte dies ohne Benennung eines nicht ausgedrückten Handelnden erkennen lassen.
  - severity: low
    issue: Das Präsens „hält ... aus“ glättet das griechische Futur.
    rationale: Eine allgemeingültige Weisheitsaussage kann im Deutschen zwar im Präsens stehen, doch das Futur der Vorlage lässt sich hier ebenso natürlich und genauer mit „wird ... standhalten“ wiedergeben.
