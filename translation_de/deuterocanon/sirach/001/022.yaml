revisions:
- from: Bis zur rechten Zeit hält der Geduldige[b] aus; danach wird ihm Freude zuteil.[a]
  to: Bis zum rechten Zeitpunkt wird der Geduldige[b] standhalten, und danach wird die Freude zu ihm zurückkehren.[a]
  rationale: Die Revision folgt angesichts der dokumentierten Fehlzuordnung des hebräischen Satzes dem griechischen Text. Sie gibt ἕως καιροῦ mit „bis zum rechten Zeitpunkt“, ἀνέξεται mit dem Futur „wird ... standhalten“ und ὕστερον ... ἀναδώσει εὐφροσύνη als Rückkehr der Freude wieder. Damit bleibt der nicht genannte Urheber unbenannt und die Aussage wird nicht als eine ausdrücklich theologische Vergeltungslehre zugespitzt.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T05:10:43Z'
review_pass:
  verdict: revise
  source_fidelity: 'Die als erhebliche Fehlzuordnung markierte hebräische Zeile kann nicht als Grundlage dienen; die griechische Parallelüberlieferung ist daher maßgeblich. Der Entwurf trifft καιρός, μακρόθυμος und ὕστερον im Wesentlichen. Für ἀναδώσει εὐφροσύνη ist jedoch „wird ihm Freude zuteil“ zu unspezifisch: Die Konstruktion besagt hier, dass Freude zu ihm zurückkehrt bzw. ihm wieder zuteilwird. Auch das griechische Futur sollte im Deutschen nicht ohne Not als Präsens wiedergegeben werden.'
  naturalness: „Bis zum rechten Zeitpunkt“ ist idiomatischer und zeitlich präziser als „bis zur rechten Zeit“. „standhalten“ gibt das geduldige Ausharren in würdigem, modernem Standarddeutsch gut wieder. „Danach wird die Freude zu ihm zurückkehren“ ist natürlich und bewahrt die Rückkehrnuance des griechischen Verbs.
  terminology: „der Geduldige“ ist als substantiviertes, generisch gemeintes Adjektiv angemessen. „Freude“ ist die passende Wiedergabe von εὐφροσύνη. Die Alternative „der Langmütige“ kann als lexikalische Fußnote bleiben, auch wenn sie im heutigen Deutsch gehobener und weniger geläufig ist.
  issues:
