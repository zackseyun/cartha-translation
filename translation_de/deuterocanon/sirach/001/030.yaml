  source_fidelity: 'Der vorgelegte hebräische Wortlaut weicht inhaltlich vollständig von Sirach 1,30 in der griechischen Überlieferung ab und kann daher nicht als Vorlage für diesen Vers dienen. Der griechische Paralleltext lautet eindeutig: Wasser löscht ein flammendes Feuer, und ἐλεημοσύνη bewirkt Sühne für Sünden. Die Übersetzung folgt deshalb, übereinstimmend mit dem englischen Audit Trail, dem griechischen Text. Das futurische Prädikat wird beibehalten.'
