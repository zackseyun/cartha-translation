translation:
  language: de
  text: Wasser wird loderndes Feuer löschen, und Almosengeben wird Sünden sühnen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der für diese Stelle angegebene hebräische Text bietet einen völlig anderen Wortlaut: „Komm näher und zögere nicht, dann wirst du Leben für deine Seele finden. Und wenn du nahe bist, sei wie ein Held und wie ein tapferer Mann.“ Die Übersetzung folgt hier dem griechischen Text, der mit der überlieferten Zuordnung dieser Stelle übereinstimmt.'
    reason: Die bereitgestellte hebräische Quelle und der griechische Paralleltext weichen vollständig voneinander ab; dies deutet eher auf eine abweichende Zuordnung oder Referenz als auf eine gewöhnliche Textvariante hin.
lexical_decisions:
- source_word: πῦρ φλογιζόμενον
  choice: loderndes Feuer
  rationale: Gibt das brennende, aufflammende Feuer anschaulich und knapp wieder.
- source_word: ἀποσβέσει
  choice: wird … löschen
  rationale: Bewahrt das Futur des griechischen Textes und die konkrete Aussage vom Löschen eines Feuers.
- source_word: ἐλεημοσύνη
  choice: Almosengeben
  rationale: Bezeichnet hier die tätige materielle Hilfe für Bedürftige; die Formulierung ist verständlicher und genauer als das mehrdeutige „Barmherzigkeit“.
- source_word: ἐξιλάσεται
  choice: wird … sühnen
  rationale: Bewahrt die kultisch-theologische Bedeutung des Verbs, ohne den Mechanismus oder Umfang der Sühne näher festzulegen.
- source_word: ἁμαρτίας
  choice: Sünden
  rationale: Direkte und im Kontext natürliche Wiedergabe des griechischen Plurals.
theological_decisions:
- issue: Verhältnis von Almosengeben und Sündensühne
  choice: „Almosengeben wird Sünden sühnen“
  alternative: „Almosengeben macht Sünden wieder gut“
  rationale: „Sühnen“ erhält die starke Aussage des griechischen ἐξιλάσεται und lässt die darin enthaltene theologische Spannung bestehen, statt sie abzuschwächen oder systematisch zu erklären.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der parallele Satzbau und das Futur bewahren den sprichwortartigen Charakter und die Form des griechischen Zeugnisses.
