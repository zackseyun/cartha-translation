  terminology: „Almosen“ gibt ἐλεημοσύνη im konkreten Sinn materieller Hilfe angemessen wieder. „Sühnt Sünden“ entspricht ἐξιλάσεται, ohne den Aussagegehalt durch eine dogmatische Erklärung abzuschwächen oder zu erweitern. „Loderndes Feuer“ gibt φλογιζόμενον treffend wieder.
