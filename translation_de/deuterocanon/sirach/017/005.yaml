  text: He gave them counsel and a tongue and eyes[a], ears and a heart[b], to reason with.
translation:
  language: de
  text: Er gab ihnen Urteilsvermögen[a], Zunge und Augen, Ohren und ein Herz[b], damit sie nachdenken konnten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Fähigkeit zu überlegen“; das griechische Wort bezeichnet die Fähigkeit zu abgewogenem Urteil.'
    reason: lexical_alternative
  - marker: b
    text: „Herz“ bezeichnet hier im biblischen Sinn auch die innere Mitte des Denkens und Wollens, nicht nur den Bereich der Gefühle.
    reason: cultural_note
lexical_decisions:
- source_word: διαβούλιον
  choice: Urteilsvermögen
  rationale: Das seltene Substantiv bezeichnet die Fähigkeit zu überlegtem Abwägen und Entscheiden. „Urteilsvermögen“ gibt diese menschliche Fähigkeit im heutigen Deutsch klar wieder, ohne sie auf einen einzelnen erteilten Rat zu verengen.
- source_word: γλῶσσαν
  choice: Zunge
  rationale: Die konkrete Bezeichnung des Körperteils bleibt erhalten und kann zugleich, wie im Griechischen, für das Sprechen stehen.
- source_word: ὀφθαλμούς
  choice: Augen
  rationale: Der konkrete Plural entspricht dem griechischen Ausdruck und bewahrt die Gestalt der Aufzählung.
- source_word: ὦτα
  choice: Ohren
  rationale: Die Übersetzung behält wie die Vorlage das konkrete Körperteil bei, statt zur abstrakten Fähigkeit „Gehör“ überzugehen.
- source_word: καρδίαν
  choice: ein Herz
  rationale: „Herz“ bewahrt die biblische Vorstellung vom inneren Ort des Denkens und Wollens; der Zwecksatz verdeutlicht hier seine gedankliche Funktion.
- source_word: ἔδωκεν
  choice: Er gab
  rationale: Die schlichte Vergangenheitsform gibt das griechische Verb direkt und in natürlichem Deutsch wieder.
- source_word: διανοεῖσθαι
  choice: damit sie nachdenken konnten
  rationale: Der deutsche Zwecksatz drückt die Funktion der verliehenen Gaben natürlich aus. „Nachdenken“ bewahrt den Sinn bewusster geistiger Tätigkeit, ohne ihn auf bloßes Verstehen oder formale Schlussfolgerung festzulegen.
- source_word: αὐτοῖς
  choice: ihnen
  rationale: Der Dativ wird im Deutschen unmittelbar als indirektes Objekt von „gab“ wiedergegeben.
theological_decisions:
- issue: Anthropologische Bedeutung von καρδία als menschliche Denk- und Willensmitte
  choice: Wörtlich „Herz“, ergänzt durch einen Zwecksatz, der seine gedankliche Funktion erkennen lässt.
  alternative: Verstand
  rationale: Die Wiedergabe „Herz“ wahrt die biblische Anthropologie, in der Denken, Wollen und inneres Erkennen nicht scharf vom Gefühl getrennt sind.
- issue: Konkrete Körperteile oder abstrakte menschliche Fähigkeiten
  choice: Die gemischte Reihe aus einer abstrakten Fähigkeit und konkreten Körperteilen bleibt erhalten.
  alternative: Urteilsvermögen, Sprache, Sehkraft, Gehör und Verstand
  rationale: Die griechische Vorlage nennt ausdrücklich Zunge, Augen, Ohren und Herz. Eine vollständig abstrakte Wiedergabe würde die Bildlichkeit glätten und mehr deuten als übersetzen.
- issue: Funktion des Infinitivs διανοεῖσθαι
  choice: 'Als Zweck beziehungsweise befähigendes Ergebnis: „damit sie nachdenken konnten“.'
  alternative: „um zu verstehen“ oder „zum Denken“
  rationale: Die Formulierung erhält den Bezug auf die verliehenen Gaben und lässt offen, ob stärker reflektierendes Denken oder verständiges Erfassen gemeint ist.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Aufzählung der Vorlage bleibt erhalten; der abschließende Infinitiv wird als natürlicher deutscher Zwecksatz wiedergegeben.
