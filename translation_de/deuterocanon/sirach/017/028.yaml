base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/017/028.yaml
  text: From the dead[a], as from one who no longer exists, praise perishes; but one who is alive and well will praise the Lord.
translation:
  language: de
  text: Von einem Toten – als wäre er nicht mehr da – geht der Lobpreis[a] verloren; wer lebt und gesund ist, wird den Herrn preisen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Dank“; das griechische Wort kann auch „Bekenntnis“ bedeuten. Der parallele Ausdruck „wird den Herrn preisen“ spricht hier für Lob oder Dank.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ νεκροῦ
  choice: Von einem Toten
  rationale: Der griechische Singular wird allgemein verstanden. Die Formulierung bleibt nah am Ausgangstext und ist im Deutschen natürlich.
- source_word: ὡς μηδὲ ὄντος
  choice: als wäre er nicht mehr da
  rationale: Die vergleichende Wendung beschreibt den Toten rhetorisch als nicht mehr gegenwärtig. „Nicht mehr da“ ist verständlich und vermeidet eine weitergehende metaphysische Festlegung.
- source_word: ἀπόλλυται
  choice: geht … verloren
  rationale: Das Verb bezeichnet Untergang, Verlust oder Verschwinden. „Geht verloren“ gibt den Sinn in diesem Zusammenhang idiomatisch wieder, ohne die Aussage abzuschwächen.
- source_word: ἐξομολόγησις
  choice: Lobpreis
  rationale: Das Wort kann Bekenntnis, Dank oder Lob bezeichnen. Der Parallelismus mit αἰνέσει τὸν κύριον spricht hier besonders für preisenden Dank beziehungsweise Lobpreis.
- source_word: ζῶν καὶ ὑγιὴς
  choice: wer lebt und gesund ist
  rationale: Die Wiedergabe bewahrt beide Merkmale und bildet einen klaren, natürlichen Gegensatz zum Toten.
- source_word: αἰνέσει
  choice: wird … preisen
  rationale: Die deutsche Zukunftsform entspricht der griechischen Futurform und wahrt den sprichwortartigen Gegensatz.
- source_word: τὸν κύριον
  choice: den Herrn
  rationale: In diesem jüdischen Weisheitskontext bezeichnet κύριος Gott; „der Herr“ ist die angemessene traditionelle und gegenwärtig verständliche Wiedergabe.
theological_decisions:
- issue: 'Bedeutung von ἐξομολόγησις: Bekenntnis, Dank oder Lobpreis'
  choice: Lobpreis
  alternative: Dank oder Bekenntnis
  rationale: Der unmittelbare Parallelismus mit „wird den Herrn preisen“ legt Lob beziehungsweise dankenden Lobpreis nahe. Die Fußnote bewahrt die echte lexikalische Spannweite, ohne ein Sündenbekenntnis in den Vers hineinzulesen.
- issue: Aussage von ὡς μηδὲ ὄντος über den Zustand des Toten
  choice: als wäre er nicht mehr da
  alternative: als einer, der nicht existiert
  rationale: Die griechische Vergleichspartikel ὡς wird ausdrücklich gewahrt. So bleibt die Aussage rhetorisch und wird nicht als umfassende Lehre über das Sein nach dem Tod festgelegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Gedankenstriche markieren den griechischen Vergleich als eingeschobene Erläuterung und verhindern, dass „nicht mehr da“ als unmarkierte dogmatische Aussage verstanden wird.
