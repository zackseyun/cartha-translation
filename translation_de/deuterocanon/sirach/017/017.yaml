  text: Their injustices were not hidden from him[a], and every sin of theirs was before the Lord.
translation:
  language: de
  text: Ihre Ungerechtigkeiten blieben ihm nicht verborgen[a], und jede ihrer Sünden lag vor dem Herrn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „entgingen seiner Aufmerksamkeit nicht“. Wörtlicher: „waren ihm nicht verborgen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἐκρύβησαν
  choice: blieben nicht verborgen
  rationale: Das griechische Passiv bedeutet wörtlich, dass die Ungerechtigkeiten vor ihm nicht verborgen wurden bzw. waren. Die natürliche deutsche Wendung „blieben ihm nicht verborgen“ bewahrt dieses Bild, ohne lediglich mit „entgingen ihm nicht“ zu paraphrasieren.
- source_word: αἱ ἀδικίαι αὐτῶν
  choice: ihre Ungerechtigkeiten
  rationale: ἀδικίαι bezeichnet ungerechte Handlungen bzw. Verfehlungen gegen das Recht. „Ungerechtigkeiten“ gibt den Plural wieder und wahrt den Bezug auf konkrete Taten.
- source_word: ἀπ᾿ αὐτοῦ
  choice: ihm
  rationale: 'Bei „verborgen bleiben“ wird das griechische ἀπό mit Genitiv im Deutschen idiomatisch durch den Dativ ausgedrückt: „ihm nicht verborgen“.'
- source_word: πᾶσα ἁμαρτία αὐτῶν
  choice: jede ihrer Sünden
  rationale: Die distributive Einzahl πᾶσα ἁμαρτία hebt jede einzelne Sünde hervor. „Jede ihrer Sünden“ ist im Deutschen natürlicher als „jede Sünde von ihnen“.
- source_word: ἔναντι Κυρίου
  choice: lag vor dem Herrn
  rationale: ἔναντι bedeutet „vor“ bzw. „in der Gegenwart von“. Das ergänzte „lag“ ergibt zusammen mit dem ersten Satzglied einen natürlichen deutschen Satz und erhält das Bild offen daliegender Schuld.
theological_decisions:
- issue: Gottes vollständige Kenntnis menschlicher Schuld
  choice: Die Ungerechtigkeiten bleiben ihm nicht verborgen, und jede Sünde liegt vor dem Herrn.
  alternative: Keine ihrer Sünden entging der Aufmerksamkeit des Herrn.
  rationale: Der Text stellt die Schuld als vor Gott unverdeckt dar, ohne daraus eine weitergehende dogmatische Aussage zu formulieren. Die Übersetzung bewahrt dieses Bild und seine theologische Aussagekraft.
- issue: Bezug von αὐτοῦ und Κυρίου
  choice: „ihm“ und „dem Herrn“ werden entsprechend dem griechischen Wortlaut nacheinander wiedergegeben.
  alternative: Beide Satzglieder ausdrücklich auf „den Herrn“ beziehen.
  rationale: Der inhaltliche Bezug ist sehr wahrscheinlich derselbe, doch die Übersetzung erhält den Wechsel vom Pronomen zum Gottesprädikat und glättet ihn nicht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Formulierung ist verständlich und nah am griechischen Bild; „Herr“ folgt Κυρίου, ohne die Schreibung „HERR“ aus einer nicht unmittelbar vorliegenden hebräischen Gottesnamensform einzutragen.
