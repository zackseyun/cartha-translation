  text: Yet to those who repent he granted a return[c][b][a], and he encouraged those who were failing in patience.
translation:
  language: de
  text: Doch denen, die umkehren, gewährte er eine Rückkehr[a][b], und die in der Ausdauer nachließen, ermutigte er.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Eine Rückkehr“ kann auch als „einen Weg zurück“ oder „Wiederherstellung“ verstanden werden.
    reason: lexical_alternative
  - marker: b
    text: Für die griechische Textgrundlage dieses Verses besteht eine erhebliche Abweichung in der Quellenvalidierung. Der allgemeine Sinn ist klar, doch der genaue Wortlaut sollte mit entsprechender Vorsicht beurteilt werden.
    reason: textual_variant
  - marker: c
    text: 'Der knappe griechische Ausdruck kann auch bedeuten: „Er ermutigte die Nachlassenden zur Ausdauer“ oder „Er stärkte die Ermattenden mit Ausdauer.“'
    reason: alternative_reading
lexical_decisions:
- source_word: πλὴν
  choice: Doch
  rationale: Kennzeichnet knapp und natürlich den gegensätzlichen Übergang zum vorherigen Zusammenhang.
- source_word: μετανοοῦσιν
  choice: denen, die umkehren
  rationale: Das substantivisch gebrauchte Partizip bezeichnet Menschen, die ihre Haltung beziehungsweise ihren Weg ändern; „umkehren“ bewahrt im Deutschen den aktiven und religiös offenen Sinn.
- source_word: ἔδωκεν
  choice: gewährte er
  rationale: Gibt δίδωμι in Verbindung mit „Rückkehr“ idiomatisch wieder, ohne den Sinn über das Gewähren hinaus auszubauen.
- source_word: ἐπάνοδον
  choice: eine Rückkehr
  rationale: Bleibt nahe am griechischen Substantiv und lässt offen, ob eine Rückkehr zu Gott, ein Weg zurück oder Wiederherstellung gemeint ist.
- source_word: παρεκάλεσεν
  choice: ermutigte er
  rationale: Bewahrt die Bandbreite von unterstützendem Zuspruch bis zur Ermahnung besser als ein enger gefasstes deutsches Verb.
- source_word: ἐκλείποντας
  choice: die nachließen
  rationale: Gibt das Nachlassen, Versagen oder Ermatten wieder, ohne ausschließlich körperliche oder geistliche Schwäche festzulegen.
- source_word: ὑπομονήν
  choice: zur Ausdauer
  rationale: „Ausdauer“ erfasst beharrliches Standhalten; „zur“ versteht den Akkusativ als Inhalt beziehungsweise Ziel der Ermutigung, während die syntaktische Mehrdeutigkeit in einer Fußnote erhalten bleibt.
theological_decisions:
- issue: Bedeutung von ἐπάνοδον im Zusammenhang mit Umkehr
  choice: eine Rückkehr
  alternative: einen Weg zurück; Wiederherstellung
  rationale: Die Formulierung macht keine vollständige Lehraussage daraus, sondern bewahrt die Offenheit, worin die gewährte Rückkehr genau besteht.
- issue: Bezug von ὑπομονήν zu παρεκάλεσεν ἐκλείποντας
  choice: die nachließen, ermutigte er zur Ausdauer
  alternative: er ermutigte diejenigen, denen es an Ausdauer fehlte; er stärkte die Ermattenden mit Ausdauer
  rationale: Der kompakte griechische Ausdruck lässt mehrere syntaktische Deutungen zu. Der Haupttext ist im Deutschen verständlich, während die Fußnote die Alternative ausdrücklich offenhält.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Umkehren“, „Rückkehr“ und „Ausdauer“ sind allgemein verständlich und bewahren die sachliche sowie theologische Offenheit des griechischen Wortlauts.
