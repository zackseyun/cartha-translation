  text: He established with them an everlasting covenant[b][a], and showed them his judgments.
translation:
  language: de
  text: Er schloss mit ihnen einen ewigen Bund[a] und zeigte ihnen seine Rechtsbestimmungen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „einen immerwährenden Bund“ oder „einen für alle Zeit geltenden Bund“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „seine Urteile“, „seine Satzungen“ oder „seine Rechtssprüche“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διαθήκην
  choice: Bund
  rationale: Im biblischen Griechisch bezeichnet διαθήκη regelmäßig einen Bund und nicht lediglich eine allgemeine Vereinbarung. „Bund“ bewahrt den schriftgemäßen und theologischen Klang.
- source_word: αἰῶνος
  choice: ewigen
  rationale: Der Genitiv beschreibt den Bund als dauerhaft und über die Zeiten hin gültig. „Ewig“ ist im Deutschen die natürliche, würdevolle Entsprechung innerhalb der biblischen Bundessprache; mögliche Nuancen werden in der Fußnote offengehalten.
- source_word: ἔστησεν
  choice: schloss
  rationale: Wörtlicher bezeichnet das Verb ein Aufrichten oder Festsetzen. Im Deutschen ist „einen Bund schließen“ die natürliche feste Verbindung und vermittelt hier die verbindliche Begründung des Bundes, ohne einen bloß vorläufigen Vertrag anzudeuten.
- source_word: μετ᾿ αὐτῶν
  choice: mit ihnen
  rationale: μετά mit dem Genitiv bedeutet unmittelbar „mit“ und bewahrt den relationalen Charakter des Bundes.
- source_word: τὰ κρίματα αὐτοῦ
  choice: seine Rechtsbestimmungen
  rationale: κρίματα kann Urteile, Rechtssatzungen oder verbindliche Entscheidungen bezeichnen. „Rechtsbestimmungen“ hält den rechtlich-normativen Sinn fest, ohne das Wort ausschließlich auf einzelne richterliche Urteile zu verengen.
- source_word: ὑπέδειξεν
  choice: zeigte
  rationale: Das Verb bedeutet „zeigen“, „hinweisen“ oder „bekannt machen“. „Zeigte“ gibt die einfache und direkte Aussage des griechischen Textes wieder.
theological_decisions:
- issue: Bundessprache im weisheitlichen Zusammenhang
  choice: ewigen Bund
  alternative: immerwährenden Bund; für alle Zeit geltenden Bund
  rationale: Der griechische Text verwendet ausdrücklich Bundessprache. Die Übersetzung bewahrt dieses theologische Gewicht, ohne διαθήκη zu einer allgemeinen Vereinbarung abzuschwächen; zugleich dokumentiert die Fußnote die zeitbezogene Bedeutungsbreite von αἰῶνος.
- issue: Bedeutungsumfang von κρίματα im Bundeskontext
  choice: Rechtsbestimmungen
  alternative: Urteile; Satzungen; Rechtssprüche
  rationale: Der Kontext lässt sowohl rechtsprechende als auch normgebende Bedeutung zu. „Rechtsbestimmungen“ wahrt den übergeordneten rechtlichen Sinn, während die Fußnote die genuine Mehrdeutigkeit sichtbar macht.
translation_notes:
  register: 'Modernes, würdevolles Standarddeutsch. Die feste Wendung „einen Bund schließen“ sorgt für natürliche Lesbarkeit; „Rechtsbestimmungen“ bewahrt den rechtlich-bundestheologischen Ton. Die Fußnotenmarker sind gegenüber der fehlerhaften Reihenfolge der englischen Konsultationsfassung sachgerecht zugeordnet: [a] steht bei „ewigen Bund“, [b] bei „Rechtsbestimmungen“.'
