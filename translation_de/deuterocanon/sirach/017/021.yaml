  source_fidelity: 'Die Übersetzung gibt die vier Imperative und ihre Abfolge zutreffend wieder: Rückkehr zum Herrn, Abkehr von den Sünden, bittendes Gebet vor ihm und Verringerung des πρόσκομμα. Der Plural „Sünden“ ist erhalten. „Was zum Straucheln bringt“ gibt die semantische Offenheit von πρόσκομμα angemessen wieder, ohne die Referenz auf einen rein äußerlichen Stolperstein oder eine bestimmte Art moralischen Anstoßes einzuengen.'
