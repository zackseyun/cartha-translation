translation:
  language: de
  text: Kehre zum Herrn zurück und lass von den Sünden ab; flehe vor seinem Angesicht[a] und vermindere, was zum Straucheln bringt.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „flehe in seiner Gegenwart“. Wörtlich steht im Griechischen „flehe vor [dem] Angesicht“; gemeint ist das unmittelbare Hintreten vor Gott.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „verringere den Stolperstein“ beziehungsweise „das Hindernis“. Das griechische Wort kann etwas bezeichnen, woran jemand anstößt oder wodurch jemand sittlich zu Fall kommt.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐπίστρεφε
  choice: Kehre … zurück
  rationale: Das Imperativ Präsens von ἐπιστρέφω bezeichnet die Hinwendung oder Rückkehr. „Kehre zurück“ bewahrt die gerichtete, relationale Bewegung, ohne den Begriff durch das theologisch stärker festgelegte „bereue“ einzuengen.
- source_word: ἐπὶ Κύριον
  choice: zum Herrn
  rationale: ἐπί mit Akkusativ bezeichnet hier bei ἐπιστρέφω die Richtung. „Zum Herrn“ ist natürliches Deutsch und gibt den Gottes­titel Κύριος als „Herr“ wieder.
- source_word: ἀπόλειπε ἁμαρτίας
  choice: lass von den Sünden ab
  rationale: ἀπολείπω fordert zur Trennung beziehungsweise Abkehr auf; der Plural ἁμαρτίας bleibt als „Sünden“ erhalten. Die deutsche Wendung ist klar, gegenwärtig und verbindet sich idiomatisch mit sittlichem Fehlverhalten.
- source_word: δεήθητι
  choice: flehe
  rationale: Der Aoristimperativ von δέομαι bezeichnet eine eindringliche Bitte. „Flehe“ erhält den Charakter des Bittens deutlicher als das allgemeinere „bete“.
- source_word: κατὰ πρόσωπον
  choice: vor seinem Angesicht
  rationale: Die wörtliche Wendung „vor [dem] Angesicht“ wird als biblisch verständliches Gegenwartsidiom bewahrt. Das Possessivpronomen wird aus dem unmittelbar zuvor genannten Herrn ergänzt.
- source_word: σμίκρυνον
  choice: vermindere
  rationale: Der Imperativ bedeutet „kleiner machen, verringern“. „Vermindere“ ist in Verbindung mit dem folgenden offenen Ausdruck idiomatisch und wahrt den abgestuften Sinn.
- source_word: πρόσκομμα
  choice: was zum Straucheln bringt
  rationale: πρόσκομμα kann ein Hindernis, einen Stolperstein oder einen Anlass zu sittlichem Fall bezeichnen. Die Relativformulierung ist natürliches Deutsch und lässt offen, ob ein inneres oder äußeres Hindernis gemeint ist.
theological_decisions:
- issue: Anthropomorphe und elliptische Wendung κατὰ πρόσωπον
  choice: „vor seinem Angesicht“, wobei „seinem“ auf den zuvor genannten Herrn verweist
  alternative: „in seiner Gegenwart“ oder „vor ihm“
  rationale: Die bildhafte Rede der Vorlage bleibt erhalten; das ergänzte Pronomen macht lediglich den im Zusammenhang gegebenen Bezug deutlich und fügt keine neue Aussage über Gott hinzu.
- issue: Ethische Reichweite von πρόσκομμα
  choice: offen als „was zum Straucheln bringt“ wiedergegeben
  alternative: „den Stolperstein“, „das Hindernis“ oder „den Anstoß“
  rationale: Der Kontext fordert zur Abkehr von Sünden auf, bestimmt aber nicht ausdrücklich, ob πρόσκομμα die eigene Verfehlung, eine Versuchung, ein äußeres Hindernis oder einen Anlass für andere meint. Die Übersetzung bewahrt diese Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Vor seinem Angesicht“ bewahrt bewusst das anschauliche Ausgangsidiom; die übrige Syntax ist alltagssprachlich klar. Der Semikolonrhythmus bildet die zwei verbundenen Aufforderungspaare des griechischen Satzes ab.
