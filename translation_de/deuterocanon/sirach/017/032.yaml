  text: He himself watches over the host of the height of heaven[b][a], and all men are earth and ashes.
translation:
  language: de
  text: Er selbst wacht über die Heerschar in der Höhe des Himmels[a], und alle Menschen sind Erde und Asche.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „über die Macht in der Höhe des Himmels“. Das griechische δύναμις kann „Macht“ oder im biblischen Sprachgebrauch eine himmlische „Heerschar“ bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δύναμιν
  choice: Heerschar
  rationale: δύναμις kann Macht oder Kraft bedeuten, im biblisch-griechischen Sprachgebrauch aber auch eine himmlische Schar. Im kosmischen Zusammenhang passt „Heerschar“ gut und bildet einen klaren Gegensatz zur Vergänglichkeit der Menschen.
- source_word: ὕψους οὐρανοῦ
  choice: in der Höhe des Himmels
  rationale: Die Genitivverbindung wird beschreibend verstanden. „Höhe“ bleibt erhalten, ohne sie als den nicht ausdrücklich genannten Gottesnamen „der Höchste“ zu deuten.
- source_word: ἐπισκέπτεται
  choice: wacht über
  rationale: Das Verb kann „besuchen“, „nach jemandem sehen“, „sich kümmern um“ oder „beaufsichtigen“ bedeuten. „Wacht über“ drückt hier Gottes tätige Aufsicht natürlich aus.
- source_word: οἱ ἄνθρωποι πάντες
  choice: alle Menschen
  rationale: ἄνθρωποι bezeichnet hier sämtliche Menschen. Das moderne deutsche „alle Menschen“ gibt den allgemeinen Sinn unmittelbar und geschlechtsübergreifend wieder.
- source_word: γῆ καὶ σποδός
  choice: Erde und Asche
  rationale: Dies entspricht der konkreten griechischen Wortwahl und vermeidet eine Angleichung an die geläufigere Wendung „Staub und Asche“.
theological_decisions:
- issue: Bedeutung von δύναμιν im himmlischen Zusammenhang
  choice: Heerschar
  alternative: Macht oder Kraft
  rationale: Der Ausdruck kann entweder die Macht des Himmels oder eine himmlische Schar bezeichnen. „Heerschar“ ist im Kontext wahrscheinlich und wird im Haupttext gewählt; die echte lexikalische Mehrdeutigkeit bleibt in der Fußnote sichtbar.
- issue: Anthropologische Aussage οἱ ἄνθρωποι πάντες
  choice: alle Menschen
  alternative: alle Männer
  rationale: Der maskuline Plural hat hier generische Bedeutung. „Alle Menschen“ gibt im heutigen Deutsch den Bezug auf die gesamte Menschheit präzise wieder.
- issue: Verhältnis der beiden Satzhälften
  choice: doch
  alternative: und
  rationale: καί bedeutet grundsätzlich „und“, kann hier aber den inhaltlichen Gegensatz zwischen der himmlischen Heerschar und der menschlichen Vergänglichkeit markieren. „Doch“ macht diesen im Zusammenhang naheliegenden Kontrast idiomatisch deutlich, ohne die beiden Aussagen gegeneinander aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bleibt knapp und sentenzartig. „Erde und Asche“ bewahrt bewusst die griechische Formulierung statt der vertrauteren Wendung „Staub und Asche“.
