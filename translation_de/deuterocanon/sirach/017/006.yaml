  text: He filled them with the knowledge of understanding[a], and showed them good and evil.
translation:
  language: de
  text: Er erfüllte sie mit verständiger Erkenntnis und zeigte ihnen Gutes und Böses.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »gute und schlechte Dinge«. Die griechischen Wörter können sowohl moralische Kategorien als auch gute und schlechte beziehungsweise nützliche und schädliche Dinge bezeichnen; der Zusammenhang legt moralische Unterscheidung nahe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιστήμην συνέσεως
  choice: verständiger Erkenntnis
  rationale: Die Genitivverbindung bezeichnet eine von Einsicht beziehungsweise Verständnis geprägte Erkenntnis. Die deutsche Formulierung gibt die enge Beziehung beider Begriffe natürlich wieder, ohne sie zu zwei getrennten Gaben zu machen.
- source_word: ἐνέπλησεν
  choice: erfüllte
  rationale: Das Verb bedeutet „füllen“ oder „voll machen“. „Erfüllte sie mit“ wahrt das griechische Bild und ist in gehobenem modernem Deutsch verständlich.
- source_word: αὐτούς
  choice: sie
  rationale: Das Pronomen verweist im Kontext auf die zuvor genannten Menschen.
- source_word: ἀγαθὰ καὶ κακὰ
  choice: Gutes und Böses
  rationale: Die substantivierten Adjektive können moralische Kategorien oder gute und schlechte Dinge bezeichnen. „Gutes und Böses“ bewahrt die knappe Gegenüberstellung und entspricht dem im Kontext naheliegenden Gedanken sittlicher Unterscheidungsfähigkeit.
- source_word: ὑπέδειξεν αὐτοῖς
  choice: zeigte ihnen
  rationale: Die Wendung bedeutet, jemandem etwas zu zeigen, aufzuweisen oder bekannt zu machen. „Zeigte ihnen“ ist direkt, idiomatisch und semantisch offen.
theological_decisions:
- issue: Ob ἀγαθὰ καὶ κακὰ moralische Kategorien oder nützliche und schädliche Dinge bezeichnet
  choice: Gutes und Böses
  alternative: gute und schlechte Dinge
  rationale: Der Zusammenhang beschreibt die dem Menschen von Gott verliehene Erkenntnis- und Urteilsfähigkeit; daher liegt die moralische Lesart nahe. Da die griechischen Wörter jedoch auch allgemein gute und schlechte Dinge bezeichnen können, wird diese Möglichkeit in der Fußnote offengehalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Verständige Erkenntnis“ vermeidet die im Deutschen schwerfällige wörtliche Form „Erkenntnis des Verständnisses“, hält aber beide griechischen Begriffe zusammen. Der Fußnotenmarker steht unmittelbar bei der tatsächlich erläuterten Wendung.
