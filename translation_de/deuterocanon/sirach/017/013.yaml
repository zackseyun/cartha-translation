  text: And he said to them[a], “Watch yourselves against every injustice,” and he commanded each of them concerning his neighbor.
translation:
  language: de
  text: 'Und er sagte zu ihnen: „Hütet euch vor jeglichem Unrecht!“[a] Und er gab jedem von ihnen ein Gebot hinsichtlich des Nächsten.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Nehmt euch vor allem in Acht, was unrecht ist.“ Die knappe griechische Wendung kann entsprechend variiert wiedergegeben werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Προσέχετε ἀπὸ παντὸς ἀδίκου
  choice: Hütet euch vor jeglichem Unrecht
  rationale: Προσέχετε mit ἀπό formuliert eine Warnung. „Hütet euch vor“ gibt diese im Deutschen natürlich und nachdrücklich wieder. Das substantivierte ἀδίκου bezeichnet hier Unrechtes beziehungsweise Unrecht; „jeglichem Unrecht“ bewahrt den umfassenden ethischen Sinn, ohne eine spätere dogmatische Fachbedeutung einzutragen.
- source_word: ἐνετείλατο
  choice: gab … ein Gebot
  rationale: Das Verb bezeichnet ein verbindliches Gebieten oder Auftragen. Die substantivische Wendung ist im Deutschen mit der anschließenden Verhältnisangabe verständlicher als das syntaktisch härtere „gebot … hinsichtlich“ und wahrt dennoch die autoritative Kraft.
- source_word: αὐτοῖς ἑκάστῳ
  choice: jedem von ihnen
  rationale: 'Die distributive Einzahl ἑκάστῳ wird ausdrücklich bewahrt: Das Gebot gilt jedem Einzelnen.'
- source_word: περὶ τοῦ πλησίον
  choice: hinsichtlich des Nächsten
  rationale: περί bezeichnet hier den Gegenstandsbereich des Gebots. πλησίον wird im vertrauten biblisch-ethischen Sinn mit „der Nächste“ wiedergegeben; die Einzahl des griechischen Textes bleibt erhalten.
theological_decisions:
- issue: Ethischer Bedeutungsumfang von ἀδίκου
  choice: „Unrecht“ statt „Ungerechtigkeit“ oder „Ungerechtsein“
  alternative: „alles Ungerechte“; „jede Ungerechtigkeit“
  rationale: Im Weisheitskontext geht es umfassend um falsches und ungerechtes Handeln. „Unrecht“ umfasst die persönliche wie die zwischenmenschliche Seite und wird durch den folgenden Bezug auf den Nächsten näher profiliert, ohne das Wort auf eine technische Lehrkategorie festzulegen.
- issue: Distributive Einzahl bei „Nächster“
  choice: „jedem von ihnen … hinsichtlich des Nächsten“
  alternative: „ihnen … hinsichtlich ihrer Mitmenschen“
  rationale: Die gewählte Fassung bewahrt sowohl ἑκάστῳ als auch den singularischen Ausdruck τοῦ πλησίον und damit den persönlichen, distributiven Charakter der Aussage.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Hütet euch“ bewahrt den warnenden Ton, „Gebot“ die Verbindlichkeit. „Hinsichtlich des Nächsten“ ist bewusst etwas formal gehalten, um die inhaltlich offene griechische Wendung nicht durch eine ergänzte konkrete Handlungsanweisung zu verengen.
