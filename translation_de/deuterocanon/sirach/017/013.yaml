  source_fidelity: 'Die Übersetzung gibt die Satzfolge und den Sinn des Griechischen zuverlässig wieder: die Warnung mit προσέχετε ἀπό, den umfassenden Ausdruck παντὸς ἀδίκου, die verbindliche Anordnung von ἐνετείλατο sowie die distributive Aussage ἑκάστῳ περὶ τοῦ πλησίον. „Jeglichem Unrecht“ ist eine angemessene, nicht dogmatisch verengende Wiedergabe.'
