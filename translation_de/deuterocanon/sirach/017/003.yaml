  text: And he clothed them with strength[a], and made them according to his image.
translation:
  language: de
  text: Und er bekleidete sie mit Kraft und machte sie nach seinem Bild.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „seinem Bild entsprechend“. Die griechische Wendung greift die Schöpfungssprache der Genesis auf.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνέδυσεν
  choice: bekleidete
  rationale: Das Verb bedeutet wörtlich „bekleiden“ oder „anziehen“. Mit „Kraft“ als Gegenstand bewahrt „bekleidete sie mit Kraft“ das griechische Bild, ohne es zu „stattete sie aus“ zu verflachen.
- source_word: ἰσχύν
  choice: Kraft
  rationale: ἰσχύς bezeichnet Kraft oder Stärke. „Kraft“ fügt sich natürlich in die Metapher des Bekleidens und überzeichnet den Ausdruck nicht als umfassende Macht.
- source_word: κατ᾿ εἰκόνα αὐτοῦ
  choice: nach seinem Bild
  rationale: „Nach seinem Bild“ gibt κατά mit Akkusativ knapp und idiomatisch wieder und bewahrt zugleich den deutlichen Anklang an die Schöpfungssprache der Genesis.
- source_word: ἐποίησεν
  choice: machte
  rationale: ποιέω ist ein allgemeines Verb für „machen“ oder „tun“. „Machte“ entspricht dem Wortlaut, während „erschuf“ eine spezifischere Bedeutung eintragen würde.
- source_word: αὐτούς
  choice: sie
  rationale: Das Pluralpronomen bezieht sich kollektiv auf die Menschen; „sie“ erhält diesen Bezug unmittelbar.
theological_decisions:
- issue: Anspielung auf die Gottebenbildlichkeit des Menschen in κατ᾿ εἰκόνα αὐτοῦ
  choice: nach seinem Bild
  alternative: in seinem Bild / seinem Bild entsprechend
  rationale: Die Formulierung hält die Beziehung des Menschen zu Gottes Bild fest und lässt den Bezug zur Schöpfungserzählung erkennen, ohne die Aussage dogmatisch auszudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die anschauliche Metapher „mit Kraft bekleiden“ bleibt erhalten; „nach seinem Bild“ klingt vertraut, ohne altertümlich zu sein.
