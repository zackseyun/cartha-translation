translation:
  language: de
  text: Wie groß ist das Erbarmen des Herrn, und wie groß die Sühne[a] für die, die zu ihm umkehren!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: Sühnung oder Sühneleistung; der Ausdruck bezeichnet die Beseitigung von Schuld.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: ὡς μεγάλη
  choice: Wie groß
  rationale: Das exklamative ὡς mit Adjektiv wird im Deutschen natürlich mit „Wie groß“ wiedergegeben.
- source_word: ἐλεημοσύνη
  choice: Erbarmen
  rationale: In Verbindung mit dem Herrn bezeichnet das Wort hier nicht Almosengeben, sondern Gottes barmherziges Handeln. „Erbarmen“ ist würdig und kontextgemäß.
- source_word: τοῦ κυρίου
  choice: des Herrn
  rationale: κύριος bezeichnet in diesem jüdischen Weisheitstext Gott und wird ehrfürchtig mit „Herr“ wiedergegeben.
- source_word: ἐξιλασμός
  choice: Sühne
  rationale: „Sühne“ bewahrt die Bedeutung der Beseitigung von Schuld, ohne den Ausdruck vorschnell auf bloße Vergebung oder eine bestimmte spätere Sühnetheorie festzulegen.
- source_word: τοῖς ἐπιστρέφουσιν
  choice: für die, die umkehren
  rationale: „Umkehren“ erhält das Bild der Hinwendung beziehungsweise Rückkehr zu Gott und zugleich dessen Bußklang, ohne ein technisches theologisches Wort einzusetzen.
- source_word: ἐπ᾿ αὐτόν
  choice: zu ihm
  rationale: Bei ἐπιστρέφω bezeichnet die Wendung die Ausrichtung auf Gott; „zu ihm“ ist im Deutschen idiomatisch.
theological_decisions:
- issue: Bedeutung von ἐξιλασμός im Verhältnis zu Schuld und Vergebung
  choice: Sühne
  alternative: Sühnung; Vergebung
  rationale: „Sühne“ erhält das theologische Gewicht und die Offenheit des griechischen Begriffs. „Vergebung“ wäre leichter verständlich, würde aber den Vorgang beziehungsweise die Grundlage der Schuldbeseitigung stärker auf deren Ergebnis verengen.
- issue: Bezug der Sühne auf Gott
  choice: Kein zusätzliches Possessivpronomen
  alternative: seine Sühne
  rationale: Der griechische Text enthält bei ἐξιλασμός kein ausdrückliches Possessivpronomen. Die parallele Satzstruktur macht den Bezug zum Herrn hinreichend deutlich, ohne „seine“ ergänzen zu müssen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung „wie groß“ macht die elliptische griechische Exklamation im Deutschen klar und natürlich. Das Ausrufezeichen gibt den Ausrufcharakter wieder. Der Fußnotenmarker steht unmittelbar bei dem erklärten Ausdruck „Sühne“.
