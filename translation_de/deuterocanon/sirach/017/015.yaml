  text: For each nation he appointed a ruler[a], and Israel is the Lord’s own portion.
translation:
  language: de
  text: Für jedes Volk setzte er einen Herrscher ein, und Israel ist der Anteil des Herrn.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἑκάστῳ ἔθνει
  choice: für jedes Volk
  rationale: Der Dativ ist distributiv; diese Wendung gibt den Bezug auf sämtliche Völker natürlich und präzise wieder.
- source_word: κατέστησεν
  choice: setzte … ein
  rationale: Das Verb bezeichnet hier die Einsetzung in eine Leitungs- oder Herrschaftsstellung.
- source_word: ἡγούμενον
  choice: einen Herrscher
  rationale: Das substantivierte Partizip meint jemanden, der führt oder regiert; „Herrscher“ wahrt den politischen und autoritativen Sinn.
- source_word: καί
  choice: und
  rationale: Die koordinierende Konjunktion wird formal und neutral wiedergegeben; ein möglicher gedanklicher Kontrast wird nicht ausdrücklich ergänzt.
- source_word: μερὶς Κυρίου
  choice: der Anteil des Herrn
  rationale: „Anteil“ bewahrt das Bild einer zugehörigen oder zugeteilten Größe und gibt den Genitiv ohne verstärkendes „eigen“ wieder.
- source_word: Ἰσραήλ
  choice: Israel
  rationale: Übliche deutsche Form des Namens.
- source_word: ἐστιν
  choice: ist
  rationale: Schlichte Wiedergabe der Kopula ohne Erweiterung.
theological_decisions:
- issue: Verhältnis zwischen den Völkern und Israel
  choice: Die beiden Aussagen werden mit „und“ verbunden.
  alternative: „aber Israel ist der Anteil des Herrn“
  rationale: Obwohl der Zusammenhang einen Kontrast nahelegen kann, steht im griechischen Text καί. „Und“ wahrt die formale Mehrdeutigkeit und lässt den Kontrast implizit.
- issue: Besitz- und Erwählungsaussage in μερὶς Κυρίου
  choice: „der Anteil des Herrn“
  alternative: „der eigene Anteil des Herrn“
  rationale: Das Griechische drückt Zugehörigkeit aus, enthält aber kein ausdrückliches Äquivalent für „eigene“. Die knappere Fassung vermeidet eine unnötige Verstärkung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt knapp und parallel zum Griechischen; „setzte … ein“ ist geläufig, während „Anteil des Herrn“ das biblische Zuteilungsbild bewahrt.
