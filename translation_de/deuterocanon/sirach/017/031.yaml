  text: What is brighter than the sun? Yet even this fails[b][a], and flesh and blood devises evil.
translation:
  language: de
  text: Was ist heller als die Sonne? Doch auch sie vergeht[a], und Fleisch und Blut[b] sinnt auf Böses.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Doch auch sie verfinstert sich“, „auch sie erlischt“ oder „auch sie verschwindet“. Das griechische Verb kann ein Nachlassen, Aufhören oder Verfinstertwerden bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: „Fleisch und Blut“ ist eine Wendung für sterbliche Menschen.
    reason: lexical_alternative
lexical_decisions:
- source_word: τί φωτεινότερον ἡλίου
  choice: Was ist heller als die Sonne?
  rationale: τί leitet eine unpersönliche rhetorische Frage ein; der Genitiv ἡλίου nach dem Komparativ wird im Deutschen natürlich mit „als die Sonne“ wiedergegeben.
- source_word: καὶ τοῦτο ἐκλείπει
  choice: Doch selbst sie verliert ihren Glanz
  rationale: ἐκλείπει kann ein Nachlassen, Aufhören, Verschwinden oder Verfinstertwerden bezeichnen. Die Formulierung gibt die Begrenztheit selbst der Sonne natürlich wieder, ohne den Sinn ausschließlich auf eine astronomische Finsternis festzulegen. Das Pronomen richtet sich im Deutschen idiomatisch nach „Sonne“.
- source_word: πονηρὸς … σάρκα καὶ αἷμα
  choice: Fleisch und Blut sinnt auf Böses
  rationale: Der übermittelte Wortlaut weist geringfügige Kasus- und Kongruenzabweichungen gegenüber der syntaktisch erwarteten Form auf; der aus dem Zusammenhang erkennbare Sinn entspricht „Fleisch und Blut sinnt auf Böses“. „Auf Böses sinnen“ bewahrt den inneren, erwägenden Charakter von ἐνθυμήσεται.
- source_word: σάρκα καὶ αἷμα
  choice: Fleisch und Blut
  rationale: Die konkrete anthropologische Wendung für sterbliche Menschen ist auch im Deutschen geläufig und kann daher ohne erklärende Auflösung im Haupttext erhalten bleiben.
theological_decisions:
- issue: Anthropologische Wendung „Fleisch und Blut“
  choice: Fleisch und Blut
  alternative: der sterbliche Mensch
  rationale: Die wörtliche Wendung bewahrt die leiblich-sterbliche Perspektive des Textes und vermeidet eine weitergehende dogmatische Deutung von „Fleisch“.
- issue: Begrenztheit der Sonne
  choice: verliert ihren Glanz
  alternative: verfinstert sich / erlischt
  rationale: Die Übersetzung hält offen, ob ein zeitweiliges Verfinstern, ein Nachlassen oder ein endgültiges Aufhören gemeint ist, und bewahrt so die Bedeutungsbreite von ἐκλείπει.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die rhetorische Kürze bleibt erhalten; „auf Böses sinnen“ ist idiomatisch und gibt zugleich den nach innen gerichteten Denkvorgang des griechischen Verbs wieder.
