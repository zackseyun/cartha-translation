  text: After this he will rise up and repay them[b][a], and he will bring their repayment upon their head.
translation:
  language: de
  text: Danach wird er sich erheben und ihnen vergelten, und ihre Vergeltung wird er auf ihr Haupt zurückbringen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „und ihre Vergeltung wird er auf ihr Haupt zurückgeben“. „Auf ihr Haupt“ ist ein Bild dafür, dass die Vergeltung die Betreffenden selbst trifft.'
    reason: cultural_note
lexical_decisions:
- source_word: μετὰ ταῦτα
  choice: Danach
  rationale: Gibt die ausdrückliche zeitliche Abfolge knapp und natürlich wieder.
- source_word: ἐξαναστήσεται
  choice: wird er sich erheben
  rationale: Bewahrt das anschauliche Bild des Aufstehens zu entschlossenem Handeln, ohne es zu einer bloßen Futurumschreibung abzuschwächen.
- source_word: ἀνταποδώσει αὐτοῖς
  choice: wird ihnen vergelten
  rationale: „Vergelten“ bringt den wechselseitigen Sinn der Gegenleistung beziehungsweise Erwiderung prägnant zum Ausdruck.
- source_word: τὸ ἀνταπόδομα αὐτῶν
  choice: was ihnen als Vergeltung zukommt
  rationale: Vermeidet das im Deutschen missverständliche possessive „ihre Vergeltung“ und erhält zugleich den Zusammenhang mit dem vorausgehenden Verb.
- source_word: εἰς κεφαλὴν αὐτῶν ἀποδώσει
  choice: wird er auf ihr eigenes Haupt zurückfallen lassen
  rationale: Bewahrt das biblische Bild, macht aber zugleich die Rückwirkung der Vergeltung idiomatisch verständlich.
theological_decisions:
- issue: Art des göttlichen Handelns im Gericht
  choice: 'Das persönliche und vergeltende Handeln bleibt ausdrücklich: „er wird sich erheben und ihnen vergelten“.'
  alternative: Er wird tätig werden, sodass die Folgen ihrer Taten auf sie zurückkommen.
  rationale: Der griechische Text beschreibt ein handelndes Subjekt und reziproke Vergeltung; diese Spannung wird nicht zu einer rein unpersönlichen Folge abgeschwächt.
- issue: Bezug von αὐτῶν bei ἀνταπόδομα
  choice: „was ihnen als Vergeltung zukommt“
  alternative: „ihre Vergeltung“ oder „die Vergeltung für ihre Taten“
  rationale: Die Formulierung wahrt die grammatische Offenheit besser als eine ausdrückliche Ergänzung wie „für ihre Taten“ und ist im Deutschen klarer als „ihre Vergeltung“.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das semikolongetrennte Satzgefüge erhält die nachdrückliche Wiederaufnahme des Vergeltungsmotivs. Das Singularbild „Haupt“ bleibt entsprechend dem Griechischen erhalten.
