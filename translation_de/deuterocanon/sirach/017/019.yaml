revisions:
- from: Danach wird er sich erheben und ihnen vergelten; was ihnen als Vergeltung zukommt, wird er auf ihr eigenes Haupt zurückfallen lassen.[a]
  to: Danach wird er sich erheben und ihnen vergelten, und ihre Vergeltung wird er auf ihr Haupt zurückbringen.[a]
  rationale: Die Revision gibt ἀποδώσει mit „zurückbringen“ als aktives Handeln wieder, bewahrt die Wiederaufnahme von „vergelten/Vergeltung“ und lässt den possessiven Bezug von αὐτῶν ebenso offen wie der griechische Text. Die Fußnote erklärt das Bild, ohne eine über den Wortlaut hinausgehende Deutung festzuschreiben.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T05:35:15Z'
review_pass:
  verdict: revise
  source_fidelity: Der Entwurf gibt die zeitliche Abfolge, das persönliche Handeln und die zweifache Vergeltungssemantik grundsätzlich zutreffend wieder. In der zweiten Satzhälfte ist „zurückfallen lassen“ jedoch keine genaue Entsprechung von ἀποδώσει („zurückgeben/erstatten/erweisen“), sondern beschreibt die Folge als ein Fallenlassen. Auch „was ihnen als Vergeltung zukommt“ legt den Bezug von αὐτῶν stärker aus als der griechische Possessiv-Ausdruck.
  naturalness: „Danach wird er sich erheben und ihnen vergelten“ ist natürlich und angemessen würdevoll. „Ihre Vergeltung wird er auf ihr Haupt zurückbringen“ bewahrt das biblische Bild und ist als gehobenes, dennoch verständliches Standarddeutsch klarer quellennah als die kausative Umschreibung.
  terminology: „Vergelten“ und „Vergeltung“ geben ἀνταποδώσει und ἀνταπόδομα passend wieder. „Haupt“ ist im Register der Weisheitsliteratur angemessen. Das zusätzliche „eigenes“ sollte entfallen, weil es im griechischen Wortlaut nicht steht, auch wenn die Wendung die Rückkehr auf die Betroffenen impliziert.
  issues:
  - severity: medium
    issue: Die Wiedergabe „wird er ... zurückfallen lassen“ verschiebt ἀποδώσει.
    rationale: Das griechische Verb bezeichnet ein aktives Zurückgeben bzw. Erweisen. Die deutsche Formulierung macht daraus ein Veranlassen des Zurückfallens und ergänzt damit eine nicht ausgedrückte Bildhandlung.
  - severity: low
    issue: „was ihnen als Vergeltung zukommt“ expliziert den possessiven Bezug von αὐτῶν.
    rationale: Der griechische Ausdruck τὸ ἀνταπόδομα αὐτῶν lautet wörtlicher „ihre Vergeltung/ihre Rückerstattung“ und lässt die genaue Nuance des Possessivs offen. Die Umschreibung „zukommt“ engt dies auslegend ein.
  - severity: low
    issue: „eigenes“ ist eine nicht notwendige Ergänzung.
    rationale: εἰς κεφαλὴν αὐτῶν enthält „auf ihr Haupt“, nicht ausdrücklich „auf ihr eigenes Haupt“. Die idiomatische Selbstbezüglichkeit kann ohne Zusatz erhalten bleiben.
  revised_text: Danach wird er sich erheben und ihnen vergelten, und ihre Vergeltung wird er auf ihr Haupt zurückbringen.[a]
