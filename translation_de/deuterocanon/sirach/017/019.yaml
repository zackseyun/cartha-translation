    text: 'Wörtlich: „und ihre Vergeltung wird er auf ihr Haupt zurückgeben“. „Auf ihr Haupt“ ist ein Bild dafür, dass die Vergeltung die Betreffenden selbst trifft.'
    reason: cultural_note
