lexical_decisions:
- source_word: ὡς μεγάλη
  choice: Wie groß
  rationale: Das exklamative ὡς mit Adjektiv wird als Ausruf wiedergegeben, nicht als Vergleich.
- source_word: ἐλεημοσύνη
  choice: Erbarmen
  rationale: Im Zusammenhang mit dem Herrn bezeichnet das Wort barmherzige Zuwendung, nicht Almosengeben.
- source_word: τοῦ κυρίου
  choice: des Herrn
  rationale: κύριος wird als Gottesbezeichnung konventionell und würdig mit „der Herr“ wiedergegeben.
- source_word: ἐξιλασμός
  choice: Sühne
  rationale: „Sühne“ bewahrt den Gedanken der Beseitigung von Schuld beziehungsweise der wiederhergestellten Beziehung, ohne einen bestimmten dogmatischen Mechanismus festzulegen.
- source_word: τοῖς ἐπιστρέφουσιν ἐπʼ αὐτόν
  choice: für alle, die sich ihm zuwenden
  rationale: Die reflexive Wendung gibt die religiöse Umkehr beziehungsweise Hinwendung zu Gott in natürlichem modernem Deutsch wieder; „alle“ macht lediglich den substantivierten Plural idiomatisch deutlich.
theological_decisions:
- issue: Bedeutungsumfang von ἐξιλασμός
  choice: Sühne
  alternative: Versöhnung; Entsühnung
  rationale: „Sühne“ ist knapp und hält die schuldtilgende sowie beziehungswiederherstellende Spannung offen. Die Alternativen erklären den Bedeutungsraum, ohne im Haupttext eine engere Sühnetheorie festzuschreiben.
translation_notes:
  register: Modernes, verständliches und zugleich würdevolles Standarddeutsch. Die Ausrufform des griechischen Satzes bleibt erhalten; das Ausrufezeichen bezieht sich auf den gesamten Vers.
