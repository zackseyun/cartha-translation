  source_fidelity: Der Ausruf »Wie groß ist« gibt ὡς μεγάλη treffend wieder. »Erbarmen des Herrn« entspricht ἐλεημοσύνη τοῦ κυρίου im Kontext gut, und »seine Sühne für die, die sich ihm zuwenden« gibt ἐξιλασμός τοῖς ἐπιστρέφουσιν ἐπʼ αὐτόν angemessen wieder. Das im Entwurf ergänzte »alle« ist jedoch im griechischen substantivierten Partizipplural nicht ausdrücklich enthalten und sollte nicht hinzugefügt werden.
