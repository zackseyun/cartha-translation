  source_fidelity: 'Die wesentlichen lexikalischen Entscheidungen sind zutreffend: ἐξομολόγησις kann hier gut mit »Danksagung« wiedergegeben werden, ζῶν καὶ ὑγιής mit »wer lebt und gesund ist«, und τὸν κύριον mit »den Herrn«. Die Wendung ὡς μηδὲ ὄντος bleibt als rhetorische, nicht metaphysisch festlegende Aussage erkennbar. Das deutsche »geht ... verloren« bildet ἀπόλλυται zwar möglich ab, ist mit »Danksagung« und der vorangestellten Herkunftsangabe jedoch weniger idiomatisch als eine explizite Aussage darüber, dass vom Toten keine Danksagung kommt.'
  naturalness: »Von einem Toten ... geht die Danksagung verloren« ist im modernen Deutschen holprig und lässt offen, was genau verlorengeht. »Von einem Toten ... kommt keine Danksagung mehr« ist klar, würdevoll und gibt die mit ἀπό ausgedrückte fehlende Herkunft der Danksagung idiomatisch wieder.
  terminology: »Danksagung« ist im Weisheits- und Schriftregister angemessen und wahrt die Nuance gegenüber dem folgenden »loben«. Die Fußnote sollte die Bedeutungsbreite von ἐξομολόγησις präziser und ohne die schwer verständliche Formulierung »anerkennendes Bekenntnis« erklären.
