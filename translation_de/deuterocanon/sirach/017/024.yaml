  yaml_path: translation/deuterocanon/sirach/017/024.yaml
  text: From the dead, as from one who no longer exists, thanksgiving perishes; but one who is alive and well will praise the Lord.
translation:
  language: de
  text: Von einem Toten – wie von einem, der nicht mehr da ist – kommt keine Danksagung[a] mehr; wer lebt und gesund ist, wird den Herrn loben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Bekenntnis« oder »Lobpreis«; das griechische Wort kann ein Bekenntnis oder dankendes Lob bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ νεκροῦ
  choice: Von einem Toten
  rationale: 'ἀπό mit dem Genitiv bezeichnet hier die Quelle: Von einem Toten geht keine Danksagung mehr aus. Der Singular des griechischen Ausdrucks bleibt erhalten.'
- source_word: ὡς μηδὲ ὄντος
  choice: wie von einem, der nicht mehr da ist
  rationale: Die Formulierung gibt den rhetorischen Vergleich verständlich wieder, ohne daraus eine systematische Aussage über die Existenz nach dem Tod zu machen.
- source_word: ἀπόλλυται
  choice: geht … verloren
  rationale: Die mediale beziehungsweise passive Form kann »geht zugrunde« oder »geht verloren« bedeuten. »Geht verloren« ist im Deutschen in Verbindung mit »Danksagung« natürlich und wahrt das eindringliche Bild.
- source_word: ἐξομολόγησις
  choice: Danksagung
  rationale: Das Substantiv bezeichnet im Sprachgebrauch der Septuaginta häufig dankendes Bekenntnis beziehungsweise dankbaren Lobpreis. »Danksagung« erhält zudem eine sinnvolle Nuance gegenüber dem folgenden »loben«.
- source_word: ζῶν καὶ ὑγιὴς
  choice: wer lebt und gesund ist
  rationale: Die substantivisch gebrauchten Partizipien werden in natürlichem modernem Deutsch als Relativsatz wiedergegeben.
- source_word: αἰνέσει
  choice: wird … loben
  rationale: Die Zukunftsform wird unmittelbar wiedergegeben und trägt den allgemeinen, weisheitlichen Aussagesinn.
- source_word: τὸν κύριον
  choice: den Herrn
  rationale: In diesem jüdischen Schriftkontext bezeichnet κύριος Gott; die übliche deutsche Wiedergabe lautet »der Herr«.
theological_decisions:
- issue: Aussage über den Toten als einen, der nicht mehr da ist
  choice: Als rhetorischen Vergleich wiedergeben
  alternative: 'Wörtlicher: »wie von einem, der nicht ist«'
  rationale: Der Vers stellt die fehlende Möglichkeit des Toten, in diesem Leben hörbar Dank und Lob darzubringen, der Tätigkeit des lebenden und gesunden Menschen gegenüber. Die Übersetzung lässt die theologische Spannung stehen und macht daraus weder eine Leugnung noch eine ausdrückliche Bestätigung einer Fortexistenz nach dem Tod.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Gegenüberstellung und der weisheitliche Aussagestil bleiben erhalten; auf altertümliche Partizipialsubstantive und konfessionell geprägte Zusätze wird verzichtet.
