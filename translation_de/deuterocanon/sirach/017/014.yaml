  text: Their ways are always before him[a]; they will not be hidden from his eyes.
translation:
  language: de
  text: Ihre Wege liegen allezeit vor ihm[a]; sie werden seinen Augen nicht verborgen sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ihre Lebensführung liegt ständig vor ihm.“ „Wege“ kann hier die Art bezeichnen, wie Menschen ihr Leben führen, nicht nur wörtliche Wege.'
    reason: lexical_alternative
lexical_decisions:
- source_word: αἱ ὁδοὶ αὐτῶν
  choice: ihre Wege
  rationale: ὁδοί bezeichnet wörtlich Wege, kann in der Weisheitsliteratur aber auch die Lebensführung meinen. „Wege“ bewahrt das anschauliche Bild und lässt diese übertragene Bedeutung offen.
- source_word: ἐναντίον αὐτοῦ
  choice: vor ihm
  rationale: Die Wendung bezeichnet etwas, das sich in jemandes Gegenwart beziehungsweise vor dessen Blick befindet. „Vor ihm“ gibt dies knapp und natürlich wieder.
- source_word: διὰ παντός
  choice: allezeit
  rationale: Die feste Wendung bedeutet „ständig“ oder „zu jeder Zeit“. „Allezeit“ entspricht dem würdevollen Ton des Weisheitstextes, ohne unverständlich zu wirken.
- source_word: οὐ κρυβήσονται
  choice: sie werden nicht verborgen sein
  rationale: Die Form ist Futur Passiv. Die Wiedergabe bewahrt die Aussageform und deutet sie nicht modal als „können nicht verborgen werden“ um.
- source_word: ἀπὸ τῶν ὀφθαλμῶν αὐτοῦ
  choice: seinen Augen
  rationale: Die konkrete Bildsprache des Sehens bleibt erhalten. Der griechische Gebrauch von ἀπό lässt sich im Deutschen bei „verborgen sein“ idiomatisch ohne eine eigene Präposition wiedergeben.
theological_decisions:
- issue: Anthropomorphe Bildsprache für Gottes Wissen
  choice: Die Wendungen „vor ihm“ und „seinen Augen“ werden als konkrete visuelle Sprache beibehalten.
  alternative: 'Abstrakter: „Er kennt stets ihre Lebensführung.“'
  rationale: Der griechische Text beschreibt Gottes fortwährende Wahrnehmung menschlicher Wege mit persönlicher, visueller Bildsprache. Eine abstrakte Paraphrase würde diese Bildkraft und die Spannung zwischen Metapher und Aussage über Gottes Wissen einebnen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Allezeit“ hält den weisheitlichen Ton, während Satzbau und Wortwahl für heutige Leser klar bleiben.
