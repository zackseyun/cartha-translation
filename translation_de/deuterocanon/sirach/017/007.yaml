  text: He set his eye upon their hearts[a], to show them the greatness of his works.
translation:
  language: de
  text: Er richtete sein Auge auf ihre Herzen,[a] um ihnen die Größe seiner Werke zu zeigen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „seinen Blick“; wörtlich: „sein Auge“. Im Griechischen steht das anthropomorphe Bild im Singular.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔθηκεν
  choice: Er richtete
  rationale: τίθημι bedeutet wörtlich „setzen/stellen“. In Verbindung mit „Auge“ gibt „richtete“ die konkrete Bewegung im modernen Deutschen natürlich wieder, ohne das Bild aufzulösen.
- source_word: τὸν ὀφθαλμὸν αὐτοῦ
  choice: sein Auge
  rationale: Die singularische, anthropomorphe Bildsprache des Griechischen bleibt bewusst erhalten. „Seinen Blick“ wäre idiomatischer, aber deutender.
- source_word: ἐπὶ τὰς καρδίας αὐτῶν
  choice: auf ihre Herzen
  rationale: „Herzen“ bewahrt die biblische Metapher für das menschliche Innere einschließlich Denken und Wollen; ἐπί wird hier natürlich mit „auf“ wiedergegeben.
- source_word: δεῖξαι αὐτοῖς
  choice: um ihnen … zu zeigen
  rationale: Der Infinitiv bezeichnet den Zweck. Die deutsche Konstruktion mit „um … zu“ macht diesen Zusammenhang klar und gibt αὐτοῖς ausdrücklich mit „ihnen“ wieder.
- source_word: τὸ μεγαλεῖον
  choice: die Größe
  rationale: Die Wiedergabe wahrt den abstrakten Sinn von „Größe/Herrlichkeit“, ohne ihn auf Majestät oder eine einzelne Großtat einzuengen.
- source_word: τῶν ἔργων αὐτοῦ
  choice: seiner Werke
  rationale: „Werke“ entspricht ἔργα und bewahrt im Kontext der Weisheitsliteratur die breite Bedeutung der Taten und Schöpfungswerke Gottes.
theological_decisions:
- issue: Anthropomorphe Rede von Gottes Wahrnehmung
  choice: Das konkrete Bild „Er richtete sein Auge auf ihre Herzen“ bleibt erhalten.
  alternative: „Er richtete seinen Blick auf ihre Herzen“ oder „Er achtete auf ihre Herzen“.
  rationale: Der griechische Text verbindet das körperliche Bild des singularischen Auges mit dem inneren Wesen der Menschen. Diese Spannung wird nicht durch eine abstrakte Umschreibung aufgelöst.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnliche Wendung „sein Auge auf ihre Herzen richten“ ist bewusst bildnah; das Komma vor dem Fußnotenzeichen folgt der Platzierung des Markers unmittelbar nach der betroffenen Wortgruppe.
