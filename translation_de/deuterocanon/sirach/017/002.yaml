  source_fidelity: Der Text gibt ἡμέρας ἀριθμοῦ treffend als „eine bestimmte Zahl von Tagen“ wieder und wahrt damit den Gedanken begrenzter bzw. festgelegter Tage, ohne eine zusätzliche Deutung einzutragen. „Eine festgesetzte Zeit“ entspricht καιρόν im Sinn einer bestimmten/zugeteilten Zeit. „Vollmacht“ gibt ἐξουσίαν als verliehene Befugnis angemessen wieder. Der elliptische Rückverweis in τῶν ἐπ᾿ αὐτῆς bleibt mit „was auf ihr ist“ erhalten.
  naturalness: Die Formulierung ist klares, modernes und zugleich würdiges Standarddeutsch. Die Wiederholung von „gab er ihnen“ bildet die griechische Satzstruktur natürlich nach. „Über das, was auf ihr ist“ ist verständlich, ohne die im Griechischen nur vorausgesetzte Erde in den Haupttext einzufügen.
  terminology: „Vollmacht“ ist für ἐξουσία hier präzise und vermeidet sowohl eine Abschwächung zu bloßer Kraft als auch eine dogmatisch aufgeladene Auslegung als uneingeschränkte Herrschaft. Die Fußnoten geben die lexikalische Alternative zu καιρός und den wahrscheinlichen Bezug von αὐτῆς sachlich wieder.
