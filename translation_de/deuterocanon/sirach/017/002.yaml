  yaml_path: translation/deuterocanon/sirach/017/002.yaml
  text: He gave them a fixed number of days and a set time[b][a], and he gave them authority over the things on it.
translation:
  language: de
  text: Eine bestimmte Zahl von Tagen und eine festgesetzte Zeit gab er ihnen,[a] und er gab ihnen Vollmacht über das, was auf ihr ist.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eine bestimmte Zeit“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „über die Dinge auf ihr“; „ihr“ bezieht sich wahrscheinlich auf die im vorhergehenden Vers genannte Erde.'
    reason: cross_reference
lexical_decisions:
- source_word: ἡμέρας ἀριθμοῦ
  choice: eine bestimmte Zahl von Tagen
  rationale: Die Genitivverbindung bezeichnet gezählte und damit begrenzte Tage. Die gewählte Formulierung gibt den Gedanken einer festgelegten Lebensdauer natürlich wieder, ohne das im Deutschen missverständliche Idiom „gezählte Tage“ zu verwenden.
- source_word: καιρόν
  choice: eine festgesetzte Zeit
  rationale: καιρός bezeichnet hier eine zugewiesene oder bestimmte Zeitspanne, nicht Zeit im abstrakten Sinn. „Festgesetzte Zeit“ wahrt diese Nuance und die Spannung zur vorangehenden Zahl der Tage.
- source_word: ἐξουσίαν
  choice: Vollmacht
  rationale: ἐξουσία bezeichnet Machtbefugnis oder übertragene Autorität. „Vollmacht“ bringt den gewährten Charakter dieser Herrschaft zum Ausdruck, ohne bloße Stärke oder uneingeschränktes Eigentum zu behaupten.
- source_word: τῶν ἐπ᾿ αὐτῆς
  choice: über das, was auf ihr ist
  rationale: Die Formulierung bewahrt den elliptischen femininen Rückverweis des Griechischen. Gemeint ist wahrscheinlich das, was auf der im vorhergehenden Vers genannten Erde lebt oder sich befindet, doch wird „Erde“ nicht stillschweigend in den Haupttext eingefügt.
theological_decisions:
- issue: Umfang der menschlichen Vollmacht in ἐξουσίαν τῶν ἐπ᾿ αὐτῆς
  choice: Den Menschen wird Vollmacht über das verliehen, was sich auf der Erde befindet.
  alternative: Den Menschen wird Vollmacht über die Erde selbst oder allgemein über das irdische Leben gegeben.
  rationale: Der Genitiv nach ἐξουσίαν und der Rückverweis auf die Erde sprechen für Vollmacht über das auf ihr Befindliche. Der Wortlaut lässt Art und Umfang dieser Vollmacht offen und deutet weder absolutes Eigentum noch eine bestimmte Lehre von Herrschaft oder Verantwortung ausdrücklich aus.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Satzstruktur des Griechischen bleibt erhalten. „Eine bestimmte Zahl von Tagen“ vermeidet die starke deutsche Nebenbedeutung von „gezählte Tage“, während „Vollmacht“ den Charakter verliehener Autorität wahrt.
