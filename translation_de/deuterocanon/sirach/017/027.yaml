  text: Who will sing praise to the Most High in Hades[c][b][a], instead of the living who give thanks?
translation:
  language: de
  text: Wer wird den Höchsten im Totenreich[a] loben anstelle der Lebenden, die ihm Dank darbringen?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »im Hades«. Gemeint ist hier das Reich der Toten, nicht ausdrücklich der Ort des endgültigen Gerichts.'
    reason: Begriffserklärung und theologische Abgrenzung
lexical_decisions:
- source_word: Ὑψίστῳ
  choice: den Höchsten
  rationale: Der Dativ bezeichnet zu αἰνέσει den Empfänger des Lobes. Im Deutschen verlangt »loben« den Akkusativ; »der Höchste« bewahrt den göttlichen Titel.
- source_word: τίς αἰνέσει
  choice: Wer wird … loben?
  rationale: Die rhetorische Frage und die Futurform werden unmittelbar wiedergegeben. »Loben« entspricht αἰνέω, ohne die im griechischen Verb nicht ausdrücklich enthaltene Vorstellung des Singens hinzuzufügen.
- source_word: ἐν ᾅδου
  choice: im Totenreich
  rationale: Gemeint ist der Bereich der Toten. »Totenreich« ist im modernen Deutschen verständlicher als »Hades« und vermeidet die Verengung auf Grab oder endgültigen Strafort.
- source_word: ἀντὶ ζώντων
  choice: anstelle der Lebenden
  rationale: ἀντί bezeichnet hier Stellvertretung beziehungsweise Gegensatz; das substantivierte Partizip wird knapp mit »die Lebenden« wiedergegeben.
- source_word: καὶ διδόντων ἀνθομολόγησιν
  choice: die ihm Dank darbringen
  rationale: ἀνθομολόγησις bezeichnet hier dankende Anerkennung beziehungsweise Dankpreis. »Dank darbringen« erhält den kultisch-lobpreisenden Ton. Das Pronomen »ihm« macht im Deutschen den aus dem Zusammenhang erkennbaren Empfänger deutlich.
theological_decisions:
- issue: Bedeutung von ᾅδης
  choice: Totenreich, ohne Gleichsetzung mit dem Ort des endgültigen Gerichts
  alternative: Hades; Scheol; Grab
  rationale: Der Vers stellt die Toten den lebenden Lobenden gegenüber. »Totenreich« wahrt diesen Gegensatz, ohne eine spätere, detaillierte Lehre über die endgültige Strafe in den Text einzutragen.
- issue: Verhältnis von ζώντων und διδόντων
  choice: Die Dank Darbringenden als nähere Beschreibung der Lebenden
  alternative: »anstelle der Lebenden und derer, die Dank darbringen«
  rationale: Der gemeinsame Genitiv und der Sinnzusammenhang legen nahe, beide Partizipien auf dieselbe Gruppe zu beziehen. Da καί formal auch zwei Gruppen verbinden kann, wird diese Möglichkeit in einer Fußnote offengehalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wortstellung stellt den Schauplatz »im Totenreich« früh heraus und bewahrt den rhetorischen Gegensatz. »Loben« vermeidet den nicht ausdrücklich belegten Zusatz des Singens; »Dank darbringen« erhält zugleich den gottesdienstlichen Ton.
