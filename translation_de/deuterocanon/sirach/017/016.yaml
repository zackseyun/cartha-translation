  yaml_path: translation/deuterocanon/sirach/017/016.yaml
  text: All their works are before him like the sun[a], and his eyes are continually upon their ways.
translation:
  language: de
  text: Alle ihre Werke sind vor ihm wie die Sonne[a], und seine Augen sind beständig auf ihre Wege gerichtet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Alle ihre Taten sind vor ihm wie die Sonne.« Der Vergleich hebt vermutlich hervor, dass das menschliche Tun vor Gott vollständig sichtbar ist.'
    reason: Lexikalische Alternative und Erläuterung des knappen Vergleichs.
lexical_decisions:
- source_word: ἅπαντα τὰ ἔργα αὐτῶν
  choice: alle ihre Werke
  rationale: ἅπαντα betont die uneingeschränkte Gesamtheit; »Werke« wahrt die Breite von ἔργα zwischen Taten, Handlungen und deren Ergebnissen.
- source_word: ὡς ὁ ἥλιος
  choice: wie die Sonne
  rationale: Die ausdrückliche Vergleichspartikel ὡς wird als Vergleich beibehalten. Die ungewöhnliche Bildfügung wird nicht durch Zusätze wie »klar« oder »im Licht« vereindeutigt.
- source_word: ἐναντίον αὐτοῦ
  choice: liegen vor ihm
  rationale: ἐναντίον bezeichnet das Vor-ihm-Sein beziehungsweise die Gegenwart vor ihm. Das ergänzte Verb »liegen« ergibt im Deutschen einen natürlichen Satz, ohne die Aussage auf ein richterliches Erscheinen festzulegen.
- source_word: οἱ ὀφθαλμοὶ αὐτοῦ
  choice: seine Augen
  rationale: Die konkrete anthropomorphe Bildsprache des Griechischen bleibt erhalten.
- source_word: ἐνδελεχεῖς
  choice: beständig … gerichtet
  rationale: Das prädikative Adjektiv bezeichnet anhaltende, unablässige Aufmerksamkeit. Die deutsche Formulierung gibt dies idiomatisch wieder.
- source_word: ἐπὶ τὰς ὁδοὺς αὐτῶν
  choice: auf ihre Wege
  rationale: »Wege« bewahrt sowohl das Wegbild als auch die mögliche ethische Bedeutung der Lebensführung.
theological_decisions:
- issue: Anthropomorphe Rede von Gottes Wissen
  choice: »seine Augen sind beständig auf ihre Wege gerichtet«
  alternative: »er beobachtet fortwährend ihre Lebensführung«
  rationale: Die körperbezogene Bildsprache des Ausgangstextes wird nicht in eine abstrakte Aussage über göttliches Wissen aufgelöst.
- issue: Bedeutung des Vergleichs mit der Sonne
  choice: »vor ihm wie die Sonne«
  alternative: »klar wie die Sonne vor ihm«
  rationale: Der Vergleich kann vollständige Sichtbarkeit nahelegen, doch das griechische Original nennt »klar« nicht ausdrücklich. Die Übersetzung bewahrt daher die knappe und etwas offene Bildsprache.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Parallelismus und die konkrete Bildsprache bleiben erhalten; die ungewöhnliche Sonnenmetapher wird weder geglättet noch theologisch erweitert.
