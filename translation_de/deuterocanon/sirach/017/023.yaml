  yaml_path: translation/deuterocanon/sirach/017/023.yaml
  text: Who will sing praise to the Most High in Hades[b][a], instead of the living who give thanks?
translation:
  language: de
  text: Wer wird im Hades[a] den Höchsten preisen anstelle der Lebenden, die ihm Dank darbringen[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »im Totenreich«, »im Scheol« oder »im Grab«. Im Griechischen steht »im Hades«; gemeint ist hier der Bereich der Toten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »die ihm dankbare Anerkennung darbringen« beziehungsweise »die vor ihm ein Bekenntnis ablegen«; der Ausdruck bezeichnet hier dankendes Gotteslob.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑψίστῳ
  choice: den Höchsten
  rationale: Der Dativ bezeichnet den Empfänger des Lobes; »der Höchste« ist die geläufige Wiedergabe des göttlichen Titels.
- source_word: τίς αἰνέσει
  choice: Wer wird … preisen?
  rationale: Das Fragepronomen und die Futurform bilden eine rhetorische Frage. »Preisen« gibt αἰνέω unmittelbar und in würdigem Deutsch wieder, ohne einen im Verb nicht ausdrücklich genannten Gesang einzutragen.
- source_word: ἐν ᾅδου
  choice: im Hades
  rationale: Die ungewöhnliche griechische Formulierung bezeichnet hier den Bereich der Toten. »Hades« wahrt den Wortlaut des griechischen Zeugen und vermeidet eine Gleichsetzung mit der späteren Vorstellung eines endgültigen Strafortes.
- source_word: ἀντὶ ζώντων
  choice: anstelle der Lebenden
  rationale: 'ἀντί bezeichnet hier Gegensatz beziehungsweise Stellvertretung: Den Toten werden die Lebenden gegenübergestellt, die Gott loben können.'
- source_word: καὶ διδόντων ἀνθομολόγησιν
  choice: die ihm Dank darbringen
  rationale: Die Wendung kann dankbare Anerkennung, Bekenntnis oder Danksagung im Gottesdienst bezeichnen. »Dank darbringen« bewahrt den kultischen Klang von διδόντων und ἀνθομολόγησιν; »ihm« macht den aus dem Zusammenhang erkennbaren Empfänger im Deutschen deutlich.
theological_decisions:
- issue: Bedeutung von ᾅδης im weisheitlichen Zusammenhang
  choice: Hades als Bereich der Toten
  alternative: Totenreich; Scheol; Grab; Hölle
  rationale: Der Vers stellt Tote und Lebende hinsichtlich ihres Gotteslobes einander gegenüber. Er entfaltet keine Lehre von endgültiger Bestrafung; daher wird »Hades« beibehalten und in der Fußnote erläutert.
- issue: Bedeutungsbreite von ἀνθομολόγησις
  choice: Dank darbringen
  alternative: Anerkennung darbringen; ein Bekenntnis ablegen; Dank sagen
  rationale: Im Zusammenhang mit dem Preisen des Höchsten liegt dankendes Gotteslob nahe, doch die Fußnote bewahrt die Bedeutungsbreite des seltenen Ausdrucks.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die rhetorische Frage und der scharfe Gegensatz zwischen Hades und Lebenden bleiben erhalten. »Preisen« ist gegenüber »Loblieder singen« näher am ausdrücklich belegten Verb; »Dank darbringen« erhält den gottesdienstlichen Ton.
