  text: And he placed his fear upon all flesh[a], and to rule over beasts and birds.
translation:
  language: de
  text: Und er legte die Furcht vor ihm auf alles Fleisch[a] und ließ ihn über Tiere und Vögel herrschen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „auf alle Lebewesen“. Wörtlich steht im Griechischen „auf alles Fleisch“, eine biblische Wendung für Lebewesen insgesamt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔθηκεν
  choice: legte
  rationale: Gibt die konkrete Bedeutung von τίθημι in natürlichem Deutsch wieder und bewahrt die Bildlichkeit der griechischen Formulierung.
- source_word: τὸν φόβον αὐτοῦ
  choice: die Furcht vor ihm
  rationale: Der Genitiv bezeichnet hier am natürlichsten die Furcht, die der Mensch anderen Geschöpfen einflößt. „Vor ihm“ vermeidet das im Deutschen missverständliche „seine Furcht“ und hält den singularischen Rückbezug fest.
- source_word: ἐπὶ πάσης σαρκός
  choice: auf alles Fleisch
  rationale: Bewahrt die biblische Kollektivformel wörtlich; gemeint sind im Zusammenhang die Lebewesen insgesamt. Eine Fußnote erläutert die idiomatische Reichweite.
- source_word: κατακυριεύειν
  choice: ließ ihn … herrschen
  rationale: Der Infinitiv bezeichnet im Satzgefüge die dem Menschen eingeräumte Herrschaft. Die kausative Formulierung ist im Deutschen grammatisch und semantisch klar, ohne den starken Herrschaftssinn von κατακυριεύω abzuschwächen.
- source_word: θηρίων
  choice: Tiere
  rationale: Im Kontext der umfassenden Herrschaft über die Tierwelt ist „Tiere“ natürlich und verständlich. „Wilde Tiere“ wäre möglich, könnte den Umfang aber unnötig verengen.
- source_word: πετεινῶν
  choice: Vögel
  rationale: Direkte und idiomatische deutsche Entsprechung für fliegende Tiere, ohne den Text auszubauen.
theological_decisions:
- issue: Singularischer Rückbezug auf den Menschen
  choice: „vor ihm“ und „ihn“ im Singular
  alternative: Kollektivisch „vor ihnen“ und „sie“
  rationale: Das Griechische hat αὐτοῦ im Singular und setzt den Menschen offenbar als repräsentative Einzelfigur voraus. Die deutsche Übersetzung bewahrt diese Form, statt sie stillschweigend in einen Plural umzuwandeln.
- issue: Bedeutung von σάρξ in der Wendung πάσης σαρκός
  choice: „alles Fleisch“
  alternative: „alle Lebewesen“ oder „jedes lebende Geschöpf“
  rationale: Hier liegt keine moralische oder paulinische Sonderbedeutung vor, sondern eine kollektive biblische Wendung. Die wörtliche Fassung erhält die Textur; die Fußnote erschließt den gemeinten Umfang.
- issue: Syntaktische Einordnung von κατακυριεύειν
  choice: 'Als eingeräumte Befähigung: „ließ ihn … herrschen“'
  alternative: 'Formal koordinierend: „und über Tiere und Vögel zu herrschen“'
  rationale: Der griechische Infinitiv ist knapp und lässt seine genaue syntaktische Anbindung unausgesprochen. Eine rein formale deutsche Nachbildung wäre als selbstständiger Vers ungrammatisch; „ließ ihn“ gibt die naheliegende Abhängigkeit vom vorangehenden Verb wieder, ohne eine neue theologische Aussage einzuführen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die biblische Wendung „alles Fleisch“ bleibt im Haupttext erhalten und wird knapp erläutert. „Tiere“ ist gegenwärtiger und weniger archaisch als „Getier“; der starke Herrschaftssinn des Verbs bleibt durch „herrschen“ gewahrt.
