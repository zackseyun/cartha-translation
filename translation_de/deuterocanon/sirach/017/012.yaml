translation:
  language: de
  text: Ihre Augen sahen majestätische Herrlichkeit, und ihre Ohren hörten die Herrlichkeit ihrer Stimme.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich nach dem überlieferten griechischen Text: „und ihre Ohren hörten die Herrlichkeit ihrer Stimme“. Der Bezug von „ihrer“ ist im überlieferten Wortlaut schwer verständlich; der Zusammenhang kann an Gottes Stimme denken lassen.'
    reason: textual_variant
lexical_decisions:
- source_word: μεγαλεῖον δόξης
  choice: majestätische Herrlichkeit
  rationale: μεγαλεῖον bezeichnet Größe, Erhabenheit oder Majestät. Die adjektivische Wiedergabe ist im Deutschen natürlich und bewahrt δόξης als „Herrlichkeit“.
- source_word: εἶδον οἱ ὀφθαλμοὶ αὐτῶν
  choice: ihre Augen sahen
  rationale: Die ausdrückliche Nennung der Augen bleibt erhalten und bildet den Parallelismus zum Hören durch die Ohren ab.
- source_word: δόξαν φωνῆς
  choice: die Herrlichkeit … Stimme
  rationale: Die Wiederholung von δόξα wird durch die erneute Verwendung von „Herrlichkeit“ bewahrt. Der Genitiv wird entsprechend der griechischen Struktur wiedergegeben.
- source_word: ἤκουσεν τὸ οὖς αὐτῶν
  choice: ihre Ohren hörten
  rationale: Der griechische Singular „ihr Ohr“ ist kollektiv beziehungsweise distributiv; der deutsche Plural klingt natürlich und entspricht dem parallelen Ausdruck „ihre Augen“.
- source_word: αὐτῶν (bei φωνῆς)
  choice: seiner
  rationale: Der überlieferte Wortlaut hat formal „ihrer“, doch der Zusammenhang legt Gottes Stimme als gemeinten Bezug nahe. Die Abweichung vom überlieferten Pronomen wird ausdrücklich in der Fußnote offengelegt.
theological_decisions:
- issue: Bezugswort des Possessivpronomens bei „Stimme“
  choice: „seiner Stimme“ als kontextuell naheliegender Bezug auf Gott
  alternative: „ihrer Stimme“ nach dem überlieferten griechischen αὐτῶν
  rationale: Der überlieferte Text ergibt wörtlich „die Herrlichkeit ihrer Stimme“, was im Zusammenhang schwer verständlich ist. Weil der Abschnitt von Gottes Offenbarung an die Menschen handelt, gibt der Haupttext den wahrscheinlich gemeinten Sinn wieder; die tatsächliche griechische Lesart bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Parallelismus von Augen und Ohren sowie die Wiederholung von „Herrlichkeit“ wurden bewahrt; der schwierige überlieferte Possessivbezug wird nicht verschwiegen.
