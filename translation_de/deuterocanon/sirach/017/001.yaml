  yaml_path: translation/deuterocanon/sirach/017/001.yaml
  text: The Lord created man from the earth[a], and returned him to it again.
translation:
  language: de
  text: Der Herr erschuf den Menschen aus der Erde[a] und ließ ihn wieder zu ihr zurückkehren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: »aus Erde«; der griechische Singular »Mensch« steht hier repräsentativ für den Menschen beziehungsweise die Menschheit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Κύριος
  choice: Der Herr
  rationale: Die übliche und würdevolle Wiedergabe des griechischen Gottestitels κύριος; der bestimmte Artikel ist im Deutschen natürlich und sachgemäß.
- source_word: ἔκτισεν
  choice: erschuf
  rationale: κτίζω bezeichnet hier das göttliche Erschaffen. »Erschuf« bewahrt den gehobenen Schöpfungskontext, ohne die handwerkliche Vorstellung von »formen« einzutragen.
- source_word: ἐκ γῆς
  choice: aus der Erde
  rationale: Die Wendung bezeichnet Herkunft beziehungsweise Ausgangsstoff. »Aus der Erde« ist natürliches Deutsch und erhält zugleich das Schöpfungsmotiv.
- source_word: ἄνθρωπον
  choice: den Menschen
  rationale: Der griechische Singular bezeichnet den Menschen repräsentativ als menschliches Geschöpf. »Den Menschen« wahrt Singular und anthropologische Weite, ohne unnötig auf einen männlichen Einzelnen festzulegen.
- source_word: πάλιν
  choice: wieder
  rationale: πάλιν wird ausdrücklich wiedergegeben und unterstreicht die Rückkehr zur Erde.
- source_word: ἀπέστρεψεν
  choice: ließ ... zurückkehren
  rationale: Das transitive ἀποστρέφω drückt aus, dass der Herr die Rückkehr des Menschen bewirkt. Die kausative Formulierung ist im Deutschen natürlicher als »kehrte ihn zurück«.
- source_word: εἰς αὐτήν
  choice: zu ihr
  rationale: Das feminine Pronomen verweist eindeutig auf »die Erde«. »Zu ihr« erhält diesen Rückbezug und folgt der Bewegungsrichtung von εἰς.
theological_decisions:
- issue: Anthropologischer Umfang von ἄνθρωπον
  choice: »den Menschen« im repräsentativen Singular
  alternative: »einen Menschen«, »die Menschheit« oder »den Mann«
  rationale: Der Vers spricht im Singular vom menschlichen Geschöpf und zugleich allgemein von der menschlichen Sterblichkeit. »Den Menschen« bewahrt diese repräsentative Spannung sowie einen möglichen Adam-Anklang, ohne den Ausdruck abstrakt zu pluralisieren oder ausschließlich männlich zu bestimmen.
- issue: Göttliches Bewirken der Rückkehr zur Erde
  choice: »ließ ihn ... zurückkehren«
  alternative: »führte ihn ... zurück« oder »brachte ihn ... zurück«
  rationale: Die Formulierung bewahrt die transitive Aussage des griechischen Verbs, ohne genauer festzulegen, auf welche Weise Gott die Rückkehr zur Erde bewirkt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz bleibt knapp und schöpfungstheologisch geprägt. Das Pronomen »ihr« greift das grammatisch feminine »Erde« klar auf; die Fußnote erläutert den repräsentativen Singular und die mögliche stoffliche Nuance.
