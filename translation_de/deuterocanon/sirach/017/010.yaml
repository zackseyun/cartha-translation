  text: He added knowledge to them[a], and he bequeathed to them the law of life.
translation:
  language: de
  text: Er fügte ihnen Erkenntnis hinzu und gab ihnen das Gesetz des Lebens zum Erbe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das lebenspendende Gesetz“. Wörtlich steht im Griechischen: „Gesetz des Lebens“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσέθηκεν
  choice: fügte … hinzu
  rationale: Die Wendung gibt den Aorist von προστίθημι unmittelbar wieder und bewahrt den Gedanken, dass Erkenntnis zu den zuvor genannten Gaben hinzukam.
- source_word: ἐπιστήμην
  choice: Erkenntnis
  rationale: ἐπιστήμη bezeichnet hier allgemein Wissen beziehungsweise Einsicht; „Erkenntnis“ passt zum würdigen Kontext, ohne die Bedeutung auf Fachwissen oder praktische Fertigkeit einzuengen.
- source_word: νόμον ζωῆς
  choice: das Gesetz des Lebens
  rationale: Die formale Genitivverbindung bleibt erhalten. Der bestimmte Artikel ist im Deutschen für die hier gemeinte göttliche Lebensordnung idiomatisch, obwohl νόμον im Griechischen artikellos steht.
- source_word: ἐκληροδότησεν
  choice: vermachte
  rationale: Das Verb κληροδοτέω enthält den Gedanken des Hinterlassens als Erbe. „Vermachte“ bringt diesen stärker zum Ausdruck als das allgemeinere „gab“ oder „teilte zu“.
- source_word: αὐτοῖς
  choice: ihnen
  rationale: Das in beiden griechischen Teilsätzen wiederholte Dativpronomen wird im Deutschen jeweils beibehalten, um Empfänger und Parallelismus deutlich zu machen.
theological_decisions:
- issue: Bedeutung der Genitivverbindung νόμον ζωῆς
  choice: das Gesetz des Lebens
  alternative: das lebenspendende Gesetz
  rationale: „Gesetz des Lebens“ bewahrt die Mehrdeutigkeit des griechischen Genitivs. Die mögliche Deutung, dass das Gesetz Leben schenkt, wird nicht in den Haupttext eingetragen, sondern als Alternative in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die leicht gehobenen Wörter „Erkenntnis“ und „vermachte“ entsprechen dem weisheitlichen Ton und bleiben für heutige Leser verständlich.
