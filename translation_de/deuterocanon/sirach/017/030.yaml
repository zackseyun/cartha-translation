  text: For not everything can be among human beings[a], because a son of man is not immortal.
translation:
  language: de
  text: Denn nicht alles kann sich unter den Menschen finden, weil ein Mensch nicht unsterblich ist.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „ein Sohn des Menschen“; eine semitisch geprägte Wendung für einen sterblichen Menschen, hier kein messianischer Titel.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ γὰρ δύναται
  choice: Denn … kann nicht
  rationale: δύναται bezeichnet Fähigkeit oder Möglichkeit; zusammen mit οὐ wird dies im Deutschen natürlich mit „kann nicht“ wiedergegeben. γάρ begründet die vorausgehende Aussage.
- source_word: πάντα εἶναι ἐν ἀνθρώποις
  choice: nicht alles kann bei den Menschen sein
  rationale: Die griechische Formulierung ist knapp und mehrdeutig. „Bei den Menschen sein“ wahrt die räumlich-zuordnende Weite von ἐν ἀνθρώποις besser als eine Auslegung auf bestimmte Eigenschaften oder Fähigkeiten und klingt natürlicher als „in den Menschen sein“.
- source_word: ἀνθρώποις
  choice: den Menschen
  rationale: Der Plural bezeichnet hier die Menschheit allgemein, nicht ausschließlich männliche Personen.
- source_word: ὅτι
  choice: weil
  rationale: ὅτι führt hier den Grund für die erste Aussage an.
- source_word: οὐκ ἀθάνατος
  choice: nicht unsterblich
  rationale: ἀθάνατος bedeutet „unsterblich“ oder „todlos“; „nicht unsterblich“ ist die klare und übliche deutsche Entsprechung.
- source_word: υἱὸς ἀνθρώπου
  choice: ein Menschensohn
  rationale: Die wörtliche Wiedergabe bewahrt die semitisch geprägte Ausdrucksweise des griechischen Textes. Eine Fußnote klärt, dass hier allgemein ein sterblicher Mensch gemeint ist.
theological_decisions:
- issue: Soll υἱὸς ἀνθρώπου idiomatisch oder wörtlich wiedergegeben werden?
  choice: ein Menschensohn
  alternative: ein Mensch / ein menschliches Wesen
  rationale: Die Wendung dient in diesem Zusammenhang nicht als messianischer Titel, sondern bezeichnet einen sterblichen Menschen. Die wörtliche Form bewahrt jedoch die Gestalt des Ausgangstextes; die Fußnote verhindert eine sachfremde christologische Festlegung.
- issue: Wie bestimmt soll πάντα εἶναι ἐν ἀνθρώποις ausgelegt werden?
  choice: nicht alles kann bei den Menschen sein
  alternative: nicht alles kann in den Menschen sein / kein Mensch kann alles besitzen
  rationale: Der griechische Satz nennt nicht ausdrücklich, worauf sich „alles“ bezieht. Die gewählte Formulierung erhält diese inhaltliche Offenheit, statt Eigenschaften, Fähigkeiten oder Besitz hineinzulesen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die leicht ungewöhnliche Wendung „bei den Menschen sein“ bildet bewusst die knappe und offene griechische Aussage ab; „Menschensohn“ bewahrt mit erklärender Fußnote die Ausdrucksform der Quelle.
