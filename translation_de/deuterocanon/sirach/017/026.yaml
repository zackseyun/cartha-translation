base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/017/026.yaml
  text: For not everything can be in human beings, because a son of man is not immortal.
translation:
  language: de
  text: Denn nicht alles kann in den Menschen sein, weil ein Menschenkind[a] nicht unsterblich ist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »ein Sohn eines Menschen«; gemeint ist hier allgemein ein sterblicher Mensch, nicht ein Titel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ γὰρ
  choice: Denn nicht
  rationale: γάρ begründet die vorausgehende Aussage; „Denn“ wahrt diesen erklärenden Anschluss.
- source_word: δύναται πάντα εἶναι
  choice: nicht alles kann … sein
  rationale: Die Wendung bezeichnet Möglichkeit beziehungsweise Fähigkeit; die deutsche Wortstellung gibt den umfassenden, aber verneinten Sinn natürlich wieder.
- source_word: ἐν ἀνθρώποις
  choice: in den Menschen
  rationale: Die Wiedergabe bewahrt die Präposition ἐν und versteht ἀνθρώποις allgemein als Menschen, ohne eine Beschränkung auf Männer.
- source_word: ἀθάνατος
  choice: unsterblich
  rationale: Das Adjektiv wird unmittelbar und prägnant wiedergegeben und hält den Gegensatz zwischen menschlicher Begrenztheit und Unsterblichkeit fest.
- source_word: υἱὸς ἀνθρώπου
  choice: ein Menschenkind
  rationale: „Menschenkind“ gibt die semitisch geprägte, generische Bezeichnung für einen sterblichen Menschen im Deutschen verständlich wieder, ohne sie als Hoheitstitel erscheinen zu lassen.
theological_decisions:
- issue: Ob υἱὸς ἀνθρώπου als Titel oder als allgemeine Menschenbezeichnung zu verstehen ist
  choice: 'allgemeine Menschenbezeichnung: „ein Menschenkind“'
  alternative: „ein Menschensohn“; „ein Sohn des Menschen“; „ein Mensch“
  rationale: Der Weisheitskontext, die fehlende bestimmte Kennzeichnung und die Aussage über Sterblichkeit sprechen für einen beliebigen Menschen, nicht für einen messianischen Titel. „Menschenkind“ bewahrt den bildhaften Ausdruck, vermeidet aber eine unbegründete christologische Festlegung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die etwas ungewohnte Formulierung „in den Menschen sein“ wurde beibehalten, um die räumliche Ausdrucksweise des griechischen ἐν nicht vorschnell als „unter den Menschen“ umzudeuten.
