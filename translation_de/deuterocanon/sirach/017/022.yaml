base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/017/022.yaml
  text: Return to the Most High and turn away from unrighteousness[c][b][a], and hate what is abominable intensely.
translation:
  language: de
  text: Kehre zum Höchsten zurück und wende dich vom Unrecht ab[a] und hasse das Abscheuliche zutiefst.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Unrecht“ kann hier auch mit „Ungerechtigkeit“ oder „schuldhaftem Handeln“ wiedergegeben werden.
    reason: lexical_alternative
  - marker: b
    text: Das griechische Wort σφόδρα verstärkt die Aufforderung und bedeutet „sehr“ oder „stark“.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπάναγε
  choice: Kehre … zurück
  rationale: Der Imperativ fordert zu einer erneuten Hinwendung zu Gott auf. „Zurückkehren“ ist im Deutschen natürlich und bewahrt sowohl die Bewegungsrichtung als auch den Umkehrruf.
- source_word: ἐπὶ Ὕψιστον
  choice: zum Höchsten
  rationale: Die Präpositionalphrase bezeichnet die Ausrichtung auf Gott; „der Höchste“ bleibt als Gottesbezeichnung erhalten.
- source_word: ἀπόστρεφε
  choice: wende dich … ab
  rationale: Der Präsensimperativ bezeichnet eine entschiedene, fortdauernde Abkehr; die deutsche Wendung gibt den ethischen Richtungswechsel idiomatisch wieder.
- source_word: ἀπὸ ἀδικίας
  choice: vom Unrecht
  rationale: ἀδικία umfasst Unrecht, Ungerechtigkeit und schuldhaftes Handeln. „Unrecht“ ist breit genug, gegenwärtig verständlich und weniger künstlich als „Ungerechtigkeit“ in dieser persönlichen Mahnung.
- source_word: σφόδρα
  choice: mit aller Entschiedenheit
  rationale: Das Adverb verstärkt den folgenden Imperativ. Die Wendung gibt die hohe Intensität in natürlichem Deutsch wieder, ohne das schwerfällige „überaus“ zu verwenden.
- source_word: μίσησον
  choice: hasse
  rationale: Der starke Imperativ wird nicht abgeschwächt; „hasse“ bewahrt die Schärfe der moralischen Aufforderung.
- source_word: βδέλυγμα
  choice: alles Verabscheuungswürdige
  rationale: Das Substantiv bezeichnet etwas Abscheuliches oder Verabscheuungswürdiges. Die substantivierte Form ist in modernem Deutsch natürlicher als „Gräuel“, ohne die moralische Schwere aufzugeben.
theological_decisions:
- issue: Bedeutungsumfang von ἀδικία
  choice: Unrecht
  alternative: Ungerechtigkeit; Bosheit; schuldhaftes Handeln
  rationale: Im Zusammenhang mit der Rückkehr zu Gott bezeichnet das Wort moralisches Fehlverhalten allgemein, kann aber auch konkrete Ungerechtigkeit einschließen. „Unrecht“ lässt diesen Umfang offen.
- issue: Stärke und Reichweite von βδέλυγμα
  choice: alles Verabscheuungswürdige
  alternative: den Gräuel; das Abscheuliche
  rationale: Die Wiedergabe erhält die starke Ablehnung, legt aber keine bestimmte kultische oder konfessionelle Kategorie fest. „Alles“ macht die generische Bedeutung des artikellosen Singulars idiomatisch sichtbar.
- issue: Verhältnis von Umkehr zu Gott und Abkehr vom Bösen
  choice: zwei parallele Imperative ohne erklärenden Zusatz
  alternative: die Abkehr als Folge oder Bedingung der Rückkehr ausdrücklich markieren
  rationale: Der griechische Text stellt beide Aufforderungen nebeneinander. Die Übersetzung bewahrt diese Spannung und fügt keine dogmatische Kausalordnung hinzu.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer imperativischer Parallelstruktur. Der kräftige Ausdruck „hasse“ bleibt erhalten; unnötig altertümliche Wörter wie „Gräuel“ und stilistisch sperrige Adverbien wie „überaus“ werden vermieden.
