  naturalness: Die revidierte Fassung ist modernes, würdiges Standarddeutsch. Ohne Komma zwischen den gleichgeordneten Imperativen ist der Satzfluss natürlicher; „zutiefst“ gibt die Intensivierung idiomatisch wieder.
  terminology: „der Höchste“ bewahrt den Gottesnamen Ὕψιστος. „Unrecht“ ist für ἀδικία angemessen weit. „das Abscheuliche“ gibt βδέλυγμα stark und generisch wieder, ohne den Zusatz „alles“ und ohne unnötig archaisches „Gräuel“.
