  yaml_path: translation/deuterocanon/sirach/017/018.yaml
  text: A man's almsgiving is like a seal with him[b][a], and he will preserve a person's kindness like the pupil of the eye.
translation:
  language: de
  text: Die Almosengabe eines Mannes ist wie ein Siegel bei ihm, und er[a] wird die Wohltat eines Menschen wie die Pupille des Auges[b] bewahren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das Griechische nennt das Subjekt nicht ausdrücklich. Möglich ist auch: „Gott wird die Wohltat eines Menschen … bewahren.“ Der weitere Zusammenhang kann dafür sprechen, doch der Satz selbst lässt es offen.'
    reason: alternative_reading
  - marker: b
    text: Wörtlich „wie die Pupille des Auges“; sinngemäß könnte man auch „wie den Augapfel“ sagen.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλεημοσύνη
  choice: Almosengabe
  rationale: Im hellenistisch-jüdischen Sprachgebrauch bezeichnet das Wort besonders eine konkrete barmherzige Gabe an Bedürftige. „Almosengabe“ ist präziser als das allgemeinere „Wohltätigkeit“ und bewahrt den sachlichen Bezug des griechischen Ausdrucks.
- source_word: ἀνδρός
  choice: eines Mannes
  rationale: Die singularische maskuline Form wird genau wiedergegeben. Damit bleibt auch der Unterschied zum allgemeineren ἀνθρώπου im zweiten Satzteil erhalten.
- source_word: σφραγίς
  choice: Siegel
  rationale: „Siegel“ gibt das Bild unmittelbar wieder, ohne es unnötig als Siegelring oder anderes konkretes Objekt festzulegen.
- source_word: μετ᾿ αὐτοῦ
  choice: bei ihm
  rationale: Die Wendung bezeichnet etwas, das bei jemandem ist beziehungsweise ihm eng verbunden bleibt. „Bei ihm“ ist im Deutschen natürlicher als das wörtlichere „mit ihm“.
- source_word: χάριν
  choice: Wohltat
  rationale: Hier bezeichnet χάρις am ehesten eine einem anderen erwiesene gute Tat oder Gunst. „Wohltat“ entspricht dem Parallelismus zur Almosengabe und vermeidet die theologische Nebenbedeutung von „Gnade“.
- source_word: ἀνθρώπου
  choice: eines Menschen
  rationale: Ἄνθρωπος ist hier der allgemeine Ausdruck für einen Menschen. Die Übersetzung erhält damit den Unterschied zu ἀνήρ („Mann“) im ersten Satzteil.
- source_word: κόρην
  choice: die Pupille des Auges
  rationale: Κόρη bezeichnet wörtlich die Pupille. Die ergänzende Angabe „des Auges“ macht das Bild im Deutschen eindeutig, ohne es bereits durch die Redewendung „Augapfel“ zu ersetzen.
- source_word: συντηρήσει
  choice: er wird … bewahren
  rationale: Das Futur bezeichnet sorgfältiges Erhalten oder Behüten. „Bewahren“ passt zum Bild des schützenden Umgangs mit der Pupille; das grammatisch mitgedachte Subjekt wird als „er“ ausgedrückt, seine genaue Identität jedoch in einer Fußnote offengehalten.
theological_decisions:
- issue: Subjekt von συντηρήσει
  choice: ein unausgesprochenes männliches Singularsubjekt, im Haupttext mit „er“ wiedergegeben
  alternative: „Gott wird … bewahren“ oder unpersönlich „man wird … bewahren“
  rationale: Das griechische Verb enthält kein ausdrücklich genanntes Subjekt. Der sprichwortartige Satz lässt den Rückbezug auf den genannten Mann zu; der weitere Zusammenhang kann jedoch Gott als Handelnden nahelegen. Da der Vers selbst Gott nicht nennt, wird diese Möglichkeit nicht stillschweigend in den Haupttext aufgenommen, sondern als offene Alternative vermerkt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit engem Anschluss an den griechischen Satzbau. „Almosengabe“ und „Wohltat“ sind allgemein verständlich und erhalten den Parallelismus. Die ungewöhnliche Siegelmetapher sowie die Unbestimmtheit des Subjekts im zweiten Satzteil werden nicht erklärend aufgelöst.
