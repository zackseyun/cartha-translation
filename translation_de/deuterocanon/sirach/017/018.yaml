  terminology: „Almosengabe“ wahrt die konkrete, barmherzige Dimension von ἐλεημοσύνη. „Wohltat“ ist für χάρις im Parallelismus plausibel und vermeidet die in diesem Kontext weniger passende theologische Engführung von „Gnade“. Die Unterscheidung zwischen „Mann“ und dem allgemeineren „Mensch“ folgt dem griechischen Wortlaut.
