  source_fidelity: 'Der Entwurf gibt die beiden Nominalausdrücke und die Prädikation eng am griechischen Text wieder: ἐλεημοσύνη als konkrete „Almosengabe“, ἀνδρός als „eines Mannes“, σφραγίς als „Siegel“ und μετ᾿ αὐτοῦ idiomatisch vertretbar als „bei ihm“. Im zweiten Satzglied sind χάριν ἀνθρώπου, das Bild von κόρη und das Futur συντηρήσει sachgerecht wiedergegeben. Das im Griechischen nicht ausdrücklich genannte Subjekt wird nicht als Gott festgelegt.'
