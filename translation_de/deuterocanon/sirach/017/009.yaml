translation:
  language: de
  text: damit sie von den Großtaten seiner Werke erzählen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „von den großen Dingen seiner Werke“; auch abstrakter: „von der Größe seiner Werke“. Der griechische Ausdruck steht im Plural und bezeichnet das Große oder Gewaltige.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: damit
  rationale: Leitet einen Zwecksatz ein und gibt die finale Bedeutung im Deutschen klar und natürlich wieder.
- source_word: διηγῶνται
  choice: sie … erzählen
  rationale: Das Verb bezeichnet das ausführliche Berichten oder Erzählen. Die Verbindung „von … erzählen“ ist im Deutschen idiomatisch und bewahrt den berichtenden Charakter.
- source_word: τὰ μεγαλεῖα
  choice: von der Größe
  rationale: Der substantivierte griechische Plural bezeichnet das Große, Herrliche oder Gewaltige. In Verbindung mit „der Werke“ gibt „die Größe“ den Sinn natürlich wieder, ohne neben „Werke“ das missverständliche oder redundante „Großtaten“ einzuführen.
- source_word: τῶν ἔργων
  choice: seiner Werke
  rationale: ἔργα bezeichnet Werke oder Taten. „Werke“ entspricht dem griechischen Ausdruck eng und verbindet sich im Deutschen gut mit „Größe“.
- source_word: αὐτοῦ
  choice: seiner
  rationale: Das Possessivpronomen bezieht sich im Kontext auf Gott.
theological_decisions:
- issue: Bezug von αὐτοῦ („seiner“)
  choice: Das Pronomen bezieht sich auf Gott.
  alternative: Ein anderer männlicher Referent.
  rationale: Der Zusammenhang von Sirach 17 handelt von Gottes Handeln an den Menschen; ein anderer plausibler Bezug liegt hier nicht vor.
- issue: Konkrete oder abstrakte Wiedergabe von τὰ μεγαλεῖα
  choice: „die Größe“ als zusammenfassende Bezeichnung für das Große und Gewaltige an Gottes Werken.
  alternative: „die Großtaten“ oder „die großen Dinge“
  rationale: Der griechische Plural lässt eine konkrete Wiedergabe zu. Die gewählte Form wahrt jedoch die offene Bedeutung und vermeidet, τὰ μεγαλεῖα und ἔργα zu zwei verschiedenen Gruppen von Taten zu machen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz bleibt als abhängiger Zwecksatz kleingeschrieben, entsprechend der griechischen Anschlusskonstruktion. „Von der Größe … erzählen“ ist idiomatisch, ohne den berichtenden Sinn des Verbs abzuschwächen.
