  text: From a woman is the beginning of sin[b][a], and because of her we all die together.
translation:
  language: de
  text: Von einer Frau nimmt die Sünde ihren Anfang,[a] und ihretwegen sterben wir alle zusammen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Aussage spielt wahrscheinlich auf die Frau in der Urgeschichte an; der Vers selbst führt diesen Gedanken nicht weiter aus.
    reason: cross_reference
  - marker: b
    text: 'Oder: „und ihretwegen sind wir alle gestorben“ beziehungsweise „kamen wir alle um“. Die hebräische Verbform kann eine abgeschlossene Handlung bezeichnen; die griechische Parallele lautet dagegen: „wir alle sterben“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵאִשָּׁה
  choice: Von einer Frau
  rationale: Die Präposition מִן bezeichnet hier Herkunft oder Ausgangspunkt; auch das griechische ἀπό bestätigt diese Lesart. „Frau“ bewahrt die singularische, geschlechtsspezifische Formulierung, ohne eine Ehebeziehung einzutragen.
- source_word: תְחִלַת עָוֹן
  choice: nimmt die Sünde ihren Anfang
  rationale: Die hebräische Nominalfügung bezeichnet den Anfang der Sünde. Die verbale deutsche Wendung gibt den verblosen Satz natürlich und würdig wieder, ohne wie „ist der Anfang“ die Frau selbst unmittelbar mit dem Anfang gleichzusetzen.
- source_word: עָוֹן
  choice: Sünde
  rationale: עָוֹן kann Sünde, Schuld oder Vergehen bezeichnen. Das griechische ἁμαρτία stützt hier die allgemeine moralische Bedeutung „Sünde“.
- source_word: וּבִגְלָלָהּ
  choice: und ihretwegen
  rationale: בגלל drückt einen ursächlichen Zusammenhang aus. „Ihretwegen“ ist knapp, natürlich und entspricht zugleich dem griechischen δι’ αὐτήν.
- source_word: גָוַעְנוּ
  choice: sterben wir
  rationale: גוע bedeutet „verscheiden, sterben“. Obwohl die hebräische Form als vollendete Handlung verstanden werden kann, stützt das griechische Präsens ἀποθνήσκομεν die allgemeingültige präsentische Wiedergabe.
- source_word: יַחַד
  choice: alle
  rationale: יַחַד bedeutet wörtlich „zusammen“, trägt hier aber kollektive, umfassende Kraft. Das griechische πάντες bestätigt die Wiedergabe mit „alle“; „wir alle zusammen“ wäre im Deutschen unnötig schwerfällig.
theological_decisions:
- issue: Die umfassende Zuschreibung des Anfangs der Sünde und des menschlichen Sterbens an „eine Frau“
  choice: Die geschlechtsspezifische Aussage bleibt unverändert erhalten; ein möglicher Bezug auf die Frau in der Urgeschichte wird nur in einer Fußnote genannt.
  alternative: Die Aussage im Haupttext ausdrücklich auf Eva festlegen oder geschlechtsneutral abschwächen.
  rationale: Hebräisch und Griechisch nennen singularisch „eine Frau“, ohne sie im Vers selbst zu benennen. Die Übersetzung soll diese theologische Spannung weder neutralisieren noch durch zusätzliche Auslegung auflösen.
- issue: Zeitbezug von גָוַעְנוּ
  choice: 'Präsentische, allgemeingültige Aussage: „sterben wir alle“'
  alternative: 'Abgeschlossene Aussage: „sind wir alle gestorben“ oder „kamen wir alle um“'
  rationale: Die hebräische Verbform lässt eine abgeschlossene Handlung zu, während die griechische Parallele ausdrücklich das Präsens verwendet. Die Hauptfassung folgt dem universalen Sinn; die hebräische Alternative wird in der Fußnote bewahrt.
translation_notes:
  register: Knappe, sprichwortartige und würdevolle Standardsprache. Die Formulierung bleibt nah am Hebräischen, wird jedoch durch „nimmt … ihren Anfang“ idiomatisch deutsch. Die beiden Fußnotenmarker stehen unmittelbar bei den jeweils erläuterten Aussagen.
