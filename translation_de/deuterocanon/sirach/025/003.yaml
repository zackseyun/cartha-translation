base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/025/003.yaml
  text: A poor man who is proud[a], and a rich man who lies[b], and an old man who commits adultery and lacks sense.
translation:
  language: de
  text: Ein Armer, der hochmütig ist, ein Reicher, der lügt[a], und ein alter Mann, der Ehebruch begeht und keinen Verstand hat[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort kann auch „täuscht“ oder „leugnet“ bedeuten; die griechische Parallele hat „Lügner“.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich auch: „dem Erkenntnis fehlt“; möglich sind ebenso „ohne Einsicht“ oder „ohne Urteilsvermögen“. Die griechische Parallele spricht von mangelnder Einsicht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּל גֵּאֶה
  choice: ein Armer, der hochmütig ist
  rationale: דַּל bezeichnet einen armen oder sozial niedrig stehenden Menschen; גֵּאֶה beschreibt hier tadelnden Hochmut. Die Wiedergabe wahrt die männliche Singularform und klingt im heutigen Deutsch natürlich.
- source_word: וְעָשִׁיר מְכַחֵשׁ
  choice: ein Reicher, der lügt
  rationale: עָשִׁיר bezeichnet einen reichen Menschen. Das Partizip מְכַחֵשׁ kann Lügen, Täuschen oder Leugnen ausdrücken; das griechische ψεύστην stützt hier die allgemeine Bedeutung „lügt“.
- source_word: וְזָקֵן מְנָאֵף
  choice: und ein alter Mann, der Ehebruch begeht
  rationale: זָקֵן meint in diesem Zusammenhang einen alten Mann, nicht einen Amtsträger. מְנָאֵף bezeichnet jemanden, der Ehebruch begeht; die verbale Formulierung ist klar und hält die parallele Satzstruktur aufrecht.
- source_word: וַחֲסַר דַּעַת
  choice: und keinen Verstand hat
  rationale: Die Wendung bezeichnet einen Mangel an Wissen, Einsicht oder Urteilsvermögen. „Keinen Verstand hat“ gibt die moralisch-intellektuelle Aussage knapp und verständlich wieder; die griechische Parallele spricht ebenfalls von mangelnder Einsicht.
theological_decisions:
- issue: Verhältnis des erhaltenen hebräischen Textes zur längeren griechischen Fassung bei abweichender Versabgrenzung
  choice: Die erhaltene hebräische Zeile wird direkt übersetzt; die griechische Parallele dient zur Kontrolle mehrdeutiger Wörter.
  alternative: Den griechischen Einleitungssatz „Drei Arten von Menschen hasst meine Seele …“ in diesen Vers aufnehmen.
  rationale: Der hebräische Text ist hier inhaltlich klar und stimmt in der Aufzählung eng mit dem Griechischen überein. Die nur im griechischen Paralleltext vorliegende Einleitung wird nicht stillschweigend ergänzt, sodass die vorgegebene hebräische Quelle und ihre Versabgrenzung maßgeblich bleiben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die dreigliedrige Aufzählung und die männlichen Singularformen der Quelle bleiben erhalten. Die Formulierungen sind direkt und allgemein verständlich; echte lexikalische Spielräume werden in den Fußnoten offengelegt.
