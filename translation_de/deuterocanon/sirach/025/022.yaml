  text: For because of her there is reproach and shame[a], when a wife supports her husband.
translation:
  language: de
  text: Denn ihretwegen gibt es Schmach und Schande, wenn eine Frau für ihren Mann aufkommt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: „eine Frau, die ihren Mann versorgt“. Das hebräische מְכַלְכֶּלֶת und das griechische ἐπιχορηγῇ bezeichnen materielles Versorgen oder Unterhalten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet wie im Hebräischen eine Begründung ein und verbindet den Satz mit dem vorausgehenden Zusammenhang.
- source_word: בַעֲדָהּ
  choice: ihretwegen
  rationale: Gibt die kausale Bedeutung der Präposition mit weiblichem Suffix knapp und natürlich wieder, ohne den Bezug eigenmächtig näher zu bestimmen.
- source_word: חֶרְפָּה וּבֹשֶׁת
  choice: Schmach und Schande
  rationale: Bewahrt die zwei verwandten, aber unterscheidbaren Begriffe des öffentlichen Ehrverlusts und der empfundenen Beschämung.
- source_word: אִשָּׁה
  choice: eine Frau
  rationale: Das Wort kann Frau oder Ehefrau bedeuten; durch „ihren Mann“ ist die eheliche Beziehung bereits eindeutig, während „Frau“ die lexikalische Offenheit wahrt.
- source_word: מְכַלְכֶּלֶת
  choice: für … aufkommt
  rationale: Bezeichnet hier das materielle Versorgen oder Unterhalten. Die Wendung ist im modernen Deutsch klarer als das missverständliche „unterhält“.
- source_word: אֶת בַּעֲלָהּ
  choice: ihren Mann
  rationale: בעל bezeichnet in diesem ehelichen Zusammenhang den Ehemann, nicht einen Besitzer oder Herrn.
theological_decisions:
- issue: Umgang mit dem patriarchal geprägten Werturteil des Verses
  choice: Das Urteil über Schmach und Schande wird ohne Abschwächung oder erläuternden Zusatz im Haupttext wiedergegeben.
  alternative: Das Urteil als zeitbedingte gesellschaftliche Auffassung kennzeichnen oder in der Übersetzung mildern.
  rationale: Die Übersetzung soll die anstößige soziale Wertung des Ausgangstextes weder verdecken noch durch zusätzliche Verurteilung verschärfen.
- issue: Verknüpfung des Partizipialsatzes mit der Aussage über Schmach und Schande
  choice: Temporale beziehungsweise konditionale Verknüpfung mit „wenn“
  alternative: 'Unverbundene Apposition oder Doppelpunkt: „eine Frau, die für ihren Mann aufkommt“'
  rationale: Das knappe Hebräisch lässt die syntaktische Beziehung unausgesprochen. „Wenn“ ergibt einen natürlichen deutschen Satz und entspricht der im griechischen Paralleltext ausdrücklich verwendeten Konstruktion mit ἐὰν, ohne eine zusätzliche Ursache einzuführen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Schmach und Schande“ erhält den Ehr-Scham-Wortschatz des Originals; „für ihren Mann aufkommt“ vermeidet das heute mehrdeutige „ihren Mann unterhält“.
