  text: The crown of the aged is much experience[a], and their boast is the fear of the Lord.
translation:
  language: de
  text: Die Krone der Alten ist reiche Erfahrung[a], und ihr Stolz ist die Furcht des Herrn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Auch „viel Erfahrung“ oder „umfassende Erfahrung“. Das griechische Wort betont einen großen, im Lauf der Zeit erworbenen Erfahrungsschatz.
    reason: lexical_alternative
lexical_decisions:
- source_word: στέφανος
  choice: Krone
  rationale: Das Substantiv bezeichnet einen Kranz oder eine Krone als Ehrenzeichen. „Krone“ bewahrt das klare Bild einer Auszeichnung und klingt im Deutschen natürlich.
- source_word: γερόντων
  choice: der Alten
  rationale: Der Genitiv Plural bezeichnet alte Menschen. „Der Alten“ hält den Altersbezug fest, ohne das mögliche Amtsverständnis von „Ältesten“ einzutragen.
- source_word: πολυπειρία
  choice: reiche Erfahrung
  rationale: Das Kompositum bezeichnet ausgedehnte, im Lauf der Zeit erworbene Erfahrung. „Reiche Erfahrung“ gibt diesen Umfang idiomatisch wieder; nähere formale Alternativen werden in der Fußnote genannt.
- source_word: καύχημα
  choice: Ruhm
  rationale: Das Wort kann das Rühmen oder das bezeichnen, dessen man sich rühmt. „Ihr Ruhm“ passt zur nominalen Parallelstruktur und vermeidet den im Deutschen oft negativ klingenden „Stolz“.
- source_word: φόβος Κυρίου
  choice: die Furcht des Herrn
  rationale: Die feste Weisheitsformel bezeichnet ehrfürchtige Gottesfurcht. „Furcht“ bleibt stehen, damit die theologische Spannung nicht zu „Ehrfurcht“ abgeschwächt wird; Κυρίου wird entsprechend dem griechischen Text mit „des Herrn“ wiedergegeben.
theological_decisions:
- issue: Wiedergabe von Κυρίου in der Weisheitsformel φόβος Κυρίου
  choice: des Herrn
  alternative: des HERRN
  rationale: Der vorliegende griechische Text hat Κυρίου. Daher folgt die Übersetzung unmittelbar dem griechischen Zeugnis und verwendet „Herr“, ohne die hebräische Namensform typografisch einzutragen.
- issue: Bedeutungsumfang von φόβος in Bezug auf Gott
  choice: Furcht
  alternative: Ehrfurcht
  rationale: „Furcht“ bewahrt sowohl die traditionelle Weisheitssprache als auch deren echten Bedeutungsdruck. „Ehrfurcht“ wäre verständlich, würde das griechische φόβος jedoch interpretierend abschwächen.
translation_notes:
  register: Moderne, würdige Weisheitssprache mit knapper Parallelstruktur. „Die Alten“ ist allgemein altersbezogen, nicht als Amtsbezeichnung gemeint. Der nominale Ausdruck „ihr Ruhm“ hält die bildhafte und syntaktische Parallelität des Griechischen fest.
