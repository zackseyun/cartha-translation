  yaml_path: translation/deuterocanon/sirach/025/012.yaml
  text: The fear of the Lord surpasses everything[b][a]; to whom will the one who holds fast to it be compared?
translation:
  language: de
  text: Die Furcht des Herrn übertrifft alles; wer an ihr festhält – mit wem wird er verglichen werden?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Wer sie besitzt – mit wem wird er verglichen werden?« Das griechische Verb kann sowohl festes Festhalten als auch Besitzen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: φόβος Κυρίου
  choice: die Furcht des Herrn
  rationale: Bewahrt den theologischen Schlüsselbegriff der Weisheitsliteratur und schwächt φόβος nicht zu bloßer Ehrfurcht ab.
- source_word: ὑπὲρ πᾶν ὑπερέβαλεν
  choice: übertrifft alles
  rationale: Gibt die umfassende Überlegenheit idiomatisch wieder. Das Präsens bringt den sprichwörtlich-allgemeinen Sinn des griechischen Aorists im Deutschen natürlich zum Ausdruck.
- source_word: ὁ κρατῶν αὐτοῦ
  choice: wer an ihr festhält
  rationale: κρατέω bezeichnet festes Ergreifen, Bewahren oder Festhalten; die Formulierung wahrt die aktive und fortdauernde Nuance. Das Pronomen bezieht sich sinngemäß auf die Furcht des Herrn.
- source_word: τίνι ὁμοιωθήσεται
  choice: mit wem wird er verglichen werden?
  rationale: Gibt die zukünftige Passivform und die rhetorische Frage direkt wieder; „er“ nimmt den grammatisch maskulinen repräsentativen Singular auf.
theological_decisions:
- issue: φόβος als Furcht oder Ehrfurcht
  choice: Furcht des Herrn
  alternative: Ehrfurcht vor dem Herrn
  rationale: „Furcht“ erhält die Spannung und den etablierten theologischen Sprachgebrauch der Weisheitsliteratur, ohne den Begriff interpretierend abzuschwächen.
- issue: Zeitwert des Aorists ὑπερέβαλεν
  choice: deutsches Präsens „übertrifft“
  alternative: „hat übertroffen“ oder „übertraf“
  rationale: Der Satz formuliert eine allgemeine Weisheitswahrheit; das deutsche Präsens vermittelt diesen gnomischen Sinn am klarsten.
- issue: Bedeutungsbreite von κρατέω
  choice: an ihr festhält
  alternative: sie besitzt
  rationale: „Festhalten“ bewahrt die Nuance des festen Ergreifens beziehungsweise Bewahrens, während „besitzen“ stärker auf einen statischen Besitz festgelegt wäre.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der zweite Satz bleibt als rhetorische Zukunftsfrage erhalten; der Gedankenstrich gliedert ihn natürlich, ohne die syntaktische Beziehung aufzulösen.
