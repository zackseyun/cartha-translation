  yaml_path: translation/deuterocanon/sirach/025/014.yaml
  text: Any wound[a], but not the wound of those who hate; and any vengeance[b], but not the vengeance of enemies.
translation:
  language: de
  text: Jede Verletzung[a] – nur nicht die durch Hassende; und jede Vergeltung[b] – nur nicht die von Feinden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Jede Bedrängnis – nur nicht die durch Hassende.“ Das griechische Wort kann allgemeiner einen zugefügten Schaden, einen Angriff oder eine Bedrängnis bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Der griechische Spruch ist ohne Verb und vergleichend verkürzt. Gemeint ist: Eine Verletzung durch Hassende und die Vergeltung von Feinden sind schlimmer als andere Verletzungen oder Vergeltungsmaßnahmen.'
    reason: cultural_note
lexical_decisions:
- source_word: πᾶσαν
  choice: jede
  rationale: Das distributive „jede“ wahrt die knappe, sprichwörtliche Gegenüberstellung und lässt den unausgesprochenen Sinn „eher jede andere als diese“ erkennen.
- source_word: ἐπαγωγήν
  choice: Verletzung
  rationale: Das schwierige Substantiv bezeichnet etwas, das über jemanden gebracht wird, etwa einen Angriff, Schaden oder eine Bedrängnis. „Verletzung“ gibt hier die konkrete Schärfe wieder, ohne körperliche und seelische Verletzung eindeutig gegeneinander abzugrenzen.
- source_word: μισούντων
  choice: Menschen, die einen hassen
  rationale: Das substantivierte Partizip wird in natürlichem modernem Deutsch als Relativsatz wiedergegeben; „einen“ verdeutlicht den im Zusammenhang vorausgesetzten Betroffenen, ohne eine bestimmte Person festzulegen.
- source_word: ἐκδίκησιν
  choice: Vergeltung
  rationale: „Vergeltung“ bezeichnet ernst und prägnant die vergeltende Ahndung und passt zum Parallelismus; „Rache“ würde stärker ein persönliches Motiv hervorheben.
- source_word: ἐχθρῶν
  choice: Feinden
  rationale: „Feinde“ ist die klare standardsprachliche Entsprechung und bewahrt die relationale Feindschaft des griechischen Ausdrucks.
theological_decisions:
- issue: Deutung des elliptischen Vergleichsspruchs
  choice: 'Die verblose Wendung bleibt als knappe Gegenüberstellung stehen: jede Verletzung beziehungsweise Vergeltung, nur nicht die besonders schwere durch Hassende oder Feinde.'
  alternative: 'Ausformuliert: „Keine Verletzung gleicht der Verletzung durch Hassende, und keine Vergeltung der Vergeltung von Feinden.“'
  rationale: Die Wiederholung von πᾶσαν … καὶ μὴ … legt einen unausgesprochenen Vergleich nahe. Die Übersetzung wahrt die Ellipse und erklärt sie in der Fußnote, statt dem griechischen Text einen ausdrücklichen vollständigen Satz hinzuzufügen.
translation_notes:
  register: Knappe, würdige und sprichwörtliche Standardsprache. Gedankenstriche markieren die griechische Ellipse; die parallele Satzform bleibt erhalten. Die ungewöhnliche Härte und Mehrdeutigkeit der Aussage wird nicht durch eine ausdrücklich moralisierende Deutung geglättet.
