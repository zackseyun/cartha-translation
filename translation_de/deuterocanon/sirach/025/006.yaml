  naturalness: Die vorhandene Fassung ist verständlich, doch die doppelte Konstruktion mit „bei“ glättet die unterschiedliche griechische Syntax und wirkt etwas schematisch. Die revidierte Fassung ist knapp, würdig und im Deutschen als Weisheitsspruch natürlich.
