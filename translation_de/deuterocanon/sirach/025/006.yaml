  text: How beautiful is wisdom in the aged[a], and understanding and counsel in those who are honored.
translation:
  language: de
  text: Wie schön ist die Weisheit alter Menschen, Einsicht und Rat bei Angesehenen!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡς ὡραία
  choice: Wie schön
  rationale: Das ausrufende ὡς mit ὡραία wird im Deutschen natürlich mit „Wie schön“ wiedergegeben; eine bloße Vergleichsbedeutung ist hier nicht gemeint.
- source_word: γερόντων
  choice: bei alten Menschen
  rationale: Der Genitiv bezeichnet alte Menschen, ohne notwendig ein Amt wie das von Ältesten zu meinen. „Bei“ gibt idiomatisch wieder, dass Weisheit ihnen zukommt bzw. sich bei ihnen findet.
- source_word: σοφία
  choice: Weisheit
  rationale: σοφία ist ein Leitbegriff des Sirachbuches und wird direkt und würdig mit „Weisheit“ wiedergegeben.
- source_word: δεδοξασμένοις
  choice: bei Angesehenen
  rationale: Das Perfektpartizip bezeichnet Menschen, die Ansehen und Ehre genießen. „Angesehene“ passt zum weisheitlichen Kontext besser als das theologisch missverständliche „Verherrlichte“.
- source_word: διανόημα
  choice: verständiges Denken
  rationale: διανόημα kann Gedanke, Denkvermögen oder Einsicht bezeichnen. „Verständiges Denken“ bewahrt den gedanklichen Aspekt und bildet mit „gutem Rat“ ein natürliches Paar.
- source_word: βουλή
  choice: guter Rat
  rationale: βουλή bezeichnet hier überlegten, weisen Rat. Das ergänzte Adjektiv „gut“ macht die positive Wertung im Deutschen natürlich deutlich, ohne den Sinn sachlich zu erweitern.
theological_decisions:
- issue: Geschlecht und Bezug von γερόντων
  choice: „alte Menschen“ als allgemeine Altersbezeichnung
  alternative: „alte Männer“ oder „Älteste“
  rationale: Obwohl γερόντων grammatisch maskulin ist, formuliert der Vers eine allgemeine Weisheitsbeobachtung. „Alte Menschen“ vermeidet sowohl eine unbegründete Beschränkung auf Männer als auch die Eintragung eines bestimmten Amtes.
- issue: Semantisches Verhältnis der beiden Vershälften
  choice: 'Parallele Zuschreibung: Weisheit bei alten Menschen, verständiges Denken und Rat bei Angesehenen'
  alternative: 'Genitivisch: „die Weisheit alter Männer“ und dativisch „für die Angesehenen“'
  rationale: Die griechische Form lässt in der ersten Hälfte eine genitivische Wiedergabe zu; in natürlichem Deutsch wahrt die parallele Konstruktion mit „bei“ den Zusammenhang und die lobende Aussage, ohne eine exklusive Besitzrelation zu behaupten.
translation_notes:
  register: Moderne, würdige Weisheitssprache mit klarer Parallelstruktur. „Alte Menschen“ ist verständlich und respektvoll; „Angesehene“ wahrt den gesellschaftlichen, nicht spezifisch theologischen Sinn von δεδοξασμένοις.
