base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/025/009.yaml
  text: Blessed is the man who lives with an intelligent wife[a], and who has not slipped with his tongue[c][b], and who has not served one unworthy of him.
translation:
  language: de
  text: Glücklich ist der Mann, der mit einer verständigen Ehefrau zusammenlebt[a], der mit seiner Zunge nicht gestrauchelt ist[b] und der keinem gedient hat, der seiner unwürdig ist.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit einer klugen“ beziehungsweise „besonnenen Ehefrau zusammenlebt“; gemeint ist praktische Einsicht und Urteilsfähigkeit.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „mit der Zunge nicht ausgeglitten ist“; das Bild bezeichnet einen Fehltritt im Reden.'
    reason: idiom_clarification
  - marker: c
    text: 'Oder stärker: „keinem als Sklave gedient hat, der seiner unwürdig ist“; das griechische Verb kann sowohl Dienen als auch Sklavendienst bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: μακάριος
  choice: Glücklich ist
  rationale: Die geläufige Form einer Weisheits-Seligpreisung; sie gibt den zugesprochenen glücklichen Zustand wieder, ohne ihn auf ein bloßes Gefühl zu verengen.
- source_word: συνοικῶν
  choice: zusammenlebt
  rationale: Das Partizip bezeichnet das gemeinsame Wohnen und Leben in einem Haushalt; im Zusammenhang mit γυνή ist der eheliche Lebenszusammenhang gemeint.
- source_word: γυναικὶ συνετῇ
  choice: mit einer verständigen Frau
  rationale: συνετός bezeichnet praktische Einsicht, Vernunft und Besonnenheit. „Verständig“ bewahrt diese Bedeutungsbreite; γυνή ist wegen συνοικῶν hier als Ehefrau zu verstehen, während das natürliche deutsche „Frau“ nicht unnötig schwer klingt.
- source_word: ἐν γλώσσῃ οὐκ ὠλίσθησεν
  choice: mit seiner Zunge nicht gestrauchelt ist
  rationale: Die Übersetzung erhält das griechische Bild des Ausgleitens oder Strauchelns und macht zugleich deutlich, dass es um einen Fehltritt im Reden geht.
- source_word: ἐδούλευσεν
  choice: gedient hat
  rationale: δουλεύω kann sowohl Sklavendienst als auch untergeordnetes Dienen bezeichnen. „Gedient“ lässt die genaue Härte des Abhängigkeitsverhältnisses offen.
- source_word: ἀναξίῳ αὐτοῦ
  choice: der seiner unwürdig ist
  rationale: Die Formulierung bildet die wertende Beziehung des griechischen Ausdrucks eng ab, ohne sie als feste gesellschaftliche Rangordnung auszudeuten.
theological_decisions:
- issue: Männlicher Singular der Weisheits-Seligpreisung
  choice: der Mann
  alternative: wer / der Mensch
  rationale: Die griechischen maskulinen Formen und die Erwähnung der mit ihm zusammenlebenden Frau weisen in diesem Satz konkret auf einen Mann; eine geschlechtsneutrale Wiedergabe würde diesen Zug einebnen.
- issue: Stärke des Abhängigkeitsbegriffs in δουλεύω
  choice: gedient hat
  alternative: Sklave gewesen ist / als Sklave gedient hat
  rationale: Der griechische Ausdruck kann ein versklavtes Verhältnis bezeichnen, legt hier dessen rechtliche oder soziale Form aber nicht eindeutig fest. Die Hauptfassung wahrt diese Offenheit; die stärkere Möglichkeit wird in der Fußnote genannt.
translation_notes:
  register: Moderne, würdige Standardsprache mit der klaren Form einer Weisheits-Seligpreisung. Das körperliche Bild des Strauchelns bleibt bewusst erhalten; ungewöhnlichere Bedeutungsnuancen werden knapp in Fußnoten ausgewiesen.
