translation:
  language: de
  text: Jedes Übel ist gering gegenüber dem Übel einer Frau[a]; das Los eines Sünders möge auf sie fallen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Jedes Übel ist gering neben der Bosheit einer Frau.“ Das hebräische רָעָה kann sowohl moralisches Böses als auch Unheil bezeichnen; Hebräisch und Griechisch drücken einen Vergleich aus.'
    reason: lexical_alternative
  - marker: b
    text: 'Der Schlusssatz kann auch als Vorhersage verstanden werden: „Das Los eines Sünders wird auf sie fallen.“ Der griechische Paralleltext stützt jedoch die Wiedergabe als Wunsch oder Verwünschung.'
    reason: alternative_reading
lexical_decisions:
- source_word: מְעַט רָעָה
  choice: Jedes Übel ist gering
  rationale: מְעַט bezeichnet hier vergleichsweise geringe Bedeutung oder Schwere. Das im Hebräischen knappe Satzgefüge wird entsprechend dem griechischen Paralleltext als allgemeiner Vergleich wiedergegeben. „Übel“ bewahrt bei רָעָה die mögliche Spannweite zwischen moralischem Bösen und Unheil.
- source_word: כְרָעַת אִשָּׁה
  choice: gegenüber dem Übel einer Frau
  rationale: Das Präfix כְּ kennzeichnet den Vergleich. „Gegenüber“ formuliert ihn im Deutschen natürlich, ohne אִשָּׁה auf „Ehefrau“ einzuengen oder die schroffe Aussage des Ausgangstextes abzuschwächen.
- source_word: גוֹרַל
  choice: Los
  rationale: „Los“ erhält das Bild eines zugeteilten Anteils beziehungsweise Geschicks und entspricht zugleich dem griechischen κλῆρος.
- source_word: חוֹטֵא
  choice: eines Sünders
  rationale: Das substantivierte Partizip bezeichnet allgemein einen Menschen, der sündigt. Der unbestimmte Singular wird im Deutschen idiomatisch durch „eines Sünders“ ausgedrückt.
- source_word: יִפּוֹל עָלֶיהָ
  choice: möge auf sie fallen
  rationale: Der hebräische Yiqtol kann hier Wunsch- oder Aufforderungscharakter haben; der griechische Optativ ἐπιπέσοι stützt diese Deutung. „Möge … fallen“ bewahrt den verwünschenden Ton.
theological_decisions:
- issue: Aussageweise des Schlusssatzes
  choice: 'Als Verwünschung beziehungsweise Wunsch formuliert: „möge auf sie fallen“'
  alternative: 'Als Vorhersage: „wird auf sie fallen“'
  rationale: Der hebräische Yiqtol ist modal deutbar, und der griechische Paralleltext verwendet einen Optativ. Daher ist die Wunschform gut begründet, während die mögliche Zukunftslesart in der Fußnote erhalten bleibt.
- issue: Geschlechtsbezogene Formulierung
  choice: „einer Frau“ im Singular beibehalten
  alternative: „einer Ehefrau“ oder verallgemeinernd „von Frauen“
  rationale: אִשָּׁה bedeutet hier unbestimmt „Frau“. Der Text bietet keinen hinreichenden Grund für die Einengung auf eine Ehefrau oder für eine Umformung in den Plural. Die kulturell harte Aussage wird weder verschärft noch beschönigt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst knapper Spruchform. Die drastische geschlechtsbezogene Aussage des Quellenwortlauts bleibt sichtbar; die Übersetzung fügt weder eine konfessionelle Deutung hinzu noch mildert sie den Text. „Übel“ wurde trotz einer gewissen stilistischen Härte gewählt, weil es die semantische Breite von רָעָה besser wahrt als das enger moralische „Bosheit“.
