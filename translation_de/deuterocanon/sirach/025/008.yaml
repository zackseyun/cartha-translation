  text: Happy is the man who has not stumbled with his tongue[a], and has not served one more contemptible than himself.
translation:
  language: de
  text: Glücklich ist, wer nicht durch seine Zunge zu Fall gekommen ist[a] und keinem dient, der verächtlicher ist als er selbst.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Text lautet stattdessen: „Neun Dinge pries ich in meinem Herzen glücklich, und ein zehntes werde ich mit meiner Zunge nennen: ein Mensch, der sich an seinen Kindern freut und lebt und den Fall seiner Feinde sieht.“ Der hebräische Text weicht hier erheblich vom griechischen ab.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: Glücklich ist
  rationale: Die hebräische Seligpreisungsformel bezeichnet einen glücklichen oder beneidenswerten Zustand. „Glücklich ist“ klingt im heutigen Deutsch natürlich und vermeidet eine unnötig ausdrücklich theologische Festlegung.
- source_word: נִכְשַׁל בִּלְשׁוֹנוֹ
  choice: nicht mit seiner Zunge zu Fall gekommen ist
  rationale: Die Wiedergabe bewahrt das hebräische Bild des Strauchelns und den konkreten Bezug auf die Zunge; gemeint ist ein Fehltritt im Reden, ohne ihn enger als „sündigen“ auszulegen.
- source_word: עֹבֵד
  choice: dienen musste
  rationale: Das Verb bezeichnet Dienst beziehungsweise Unterordnung. Die Formulierung macht die belastende soziale Unterordnung idiomatisch deutlich, ohne ausdrücklich Sklaverei oder ein modernes Arbeitsverhältnis anzunehmen.
- source_word: נִקְלֶה
  choice: verächtlicher
  rationale: Das Wort bezeichnet eine geringgeachtete, ehrlose oder verächtliche Person. Der Komparativ entspricht der durch מִמֶּנּוּ ausgedrückten Gegenüberstellung.
- source_word: מִמֶּנּוּ
  choice: als er selbst
  rationale: In Verbindung mit dem Komparativ ist dies die natürliche deutsche Wiedergabe der reflexiven Vergleichsphrase.
theological_decisions:
- issue: Hebräischer Text gegenüber der stark abweichenden griechischen Überlieferung
  choice: Der Haupttext folgt dem erhaltenen hebräischen Zeugen; die griechische Fassung wird in einer Fußnote vollständig als abweichende Lesart dokumentiert.
  alternative: 'Griechisch: „Ein Mann, der sich an seinen Kindern freut und noch zu Lebzeiten den Sturz seiner Feinde sieht.“'
  rationale: Da für diese Stelle ein hebräischer Text mit hoher Sicherheit vorliegt, bildet er die Grundlage der Übersetzung. Die erhebliche Abweichung des griechischen Textes darf jedoch nicht verschwiegen oder harmonisiert werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewahrter Weisheitsformel und anschaulicher Zungenmetapher. Das generische hebräische Singularsubjekt wird mit „wer“ natürlich wiedergegeben; der anschließende maskuline Rückbezug bleibt erhalten.
