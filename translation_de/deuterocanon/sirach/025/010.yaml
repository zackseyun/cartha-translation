  text: Blessed is the one who has found wisdom[b][a], and the one who speaks in the ears of those who hear.
translation:
  language: de
  text: Glücklich, wer Einsicht gefunden hat, und wer zu Menschen spricht, die zuhören.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „und wer in die Ohren der Hörenden hinein erzählt/darlegt“. Das griechische Verb kann mehr als bloßes Sprechen bezeichnen, etwa ausführliches Erzählen oder Erklären.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριος
  choice: Glücklich
  rationale: Bezeichnet einen beneidenswerten, begünstigten Zustand. „Glücklich“ ist im heutigen Deutsch natürlich und bewahrt den Charakter eines Weisheitsspruchs, ohne ausdrücklich eine göttliche Segenshandlung einzutragen.
- source_word: εὗρε
  choice: gefunden hat
  rationale: Das griechische Aoristverb bezeichnet das Erlangen der Einsicht; das deutsche Perfekt hebt den daraus entstandenen gegenwärtigen Zustand idiomatisch hervor.
- source_word: φρόνησιν
  choice: Einsicht
  rationale: φρόνησις meint verständige, praktisch urteilsfähige Einsicht. „Einsicht“ wahrt diese Nuance besser als das breitere „Weisheit“ und klingt natürlicher als „Klugheit“ oder „Besonnenheit“.
- source_word: διηγούμενος
  choice: spricht
  rationale: Das Partizip kann erzählen, ausführlich berichten oder darlegen bedeuten. „spricht“ ergibt einen klaren deutschen Haupttext, während die mögliche stärkere Bedeutung in der Fußnote erhalten bleibt.
- source_word: εἰς ὦτα ἀκουόντων
  choice: zu Menschen …, die zuhören
  rationale: Die wörtliche Wendung „in die Ohren der Hörenden“ ist im Deutschen unnatürlich. Die Übersetzung bewahrt sowohl die Ausrichtung der Rede an Menschen als auch das Wortspiel von Hören und Zuhören.
