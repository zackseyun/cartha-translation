  register: Moderner, würdevoller Weisheitsspruch in gut verständlichem Standarddeutsch. Die konkrete griechische Ohren-Wendung wird zugunsten natürlichen Deutschen im Haupttext idiomatisch wiedergegeben und in der Fußnote dokumentiert.
