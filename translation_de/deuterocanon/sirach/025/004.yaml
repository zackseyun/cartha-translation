  text: If you did not gather in your youth[a], how then would you find anything in your old age?
translation:
  language: de
  text: Wenn du in deiner Jugend nicht gesammelt hast[a], wie könntest du dann im Alter etwas finden?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die griechische Verbform ist an dieser Stelle in der vorliegenden Textüberlieferung schwierig. Die Übersetzung folgt dem wahrscheinlichen Sinn „sammeln“ beziehungsweise „zusammentragen“.
    reason: textual_variant
lexical_decisions:
- source_word: ἐν νεότητι
  choice: in deiner Jugend
  rationale: Die temporale Wendung bezeichnet den Lebensabschnitt der Jugend und bildet einen natürlichen Gegensatz zu „im Alter“.
- source_word: οὐ συναγίοχας
  choice: nicht gesammelt hast
  rationale: Die überlieferte Verbform ist ungewöhnlich und möglicherweise verderbt; wahrscheinlich gehört sie sinngemäß in den Bereich von συνάγω, „sammeln“. Die Wiedergabe bleibt bewusst allgemein und ergänzt keinen Gegenstand.
- source_word: πῶς ἂν εὕροις
  choice: wie könntest du dann … finden?
  rationale: Der Potentialis mit ἄν wird durch „könntest“ wiedergegeben; „dann“ verdeutlicht den folgernden Zusammenhang der rhetorischen Frage.
- source_word: ἐν τῷ γήρᾳ σου
  choice: im Alter
  rationale: γήρας bezeichnet das Greisen- beziehungsweise hohe Lebensalter. Im Deutschen ist „im Alter“ idiomatisch; der Bezug auf die angesprochene Person ist aus „du“ eindeutig.
theological_decisions:
- issue: Nicht genannter Gegenstand des Sammelns und Findens
  choice: Den Gegenstand nicht näher bestimmen; lediglich das im Deutschen syntaktisch hilfreiche unbestimmte „etwas“ beim Verb „finden“ verwenden.
  alternative: „Weisheit“, „Vorräte“ oder „Reichtum“ aus Kontext beziehungsweise Sprichwortcharakter ergänzen.
  rationale: Der griechische Text nennt keinen Gegenstand. „Etwas“ legt keine bestimmte inhaltliche Deutung fest und bewahrt die breite, sprichwörtliche Aussage.
- issue: Unsicherheit der ungewöhnlichen Verbform συναγίοχας
  choice: Den wahrscheinlichen Sinn mit „gesammelt“ wiedergeben und die textliche Schwierigkeit in einer Fußnote offenlegen.
  alternative: „zusammengebracht“ oder „Vorräte angelegt“; alternativ die schwierige Form unkommentiert als eindeutig behandeln.
  rationale: So bleibt die wahrscheinliche Bedeutung verständlich, ohne die Unsicherheit der Überlieferung zu verschweigen oder den Gegenstand zu spezifizieren.
translation_notes:
  register: Moderne, würdige Standardsprache mit knapper sprichwörtlicher Form. Die parallelen Lebensabschnitte „in deiner Jugend“ und „im Alter“ bleiben deutlich; die rhetorische Frage wird natürlich formuliert.
