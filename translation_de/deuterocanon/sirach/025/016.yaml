  text: I would rather live with a lion and a dragon than dwell with a wicked woman[a].
translation:
  language: de
  text: Lieber wollte ich mit einem Löwen und einem Drachen zusammenleben, als mit einer bösen Frau zu wohnen[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit einer bösen Ehefrau“. Das griechische Wort kann je nach Zusammenhang „Frau“ oder „Ehefrau“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: συνοικῆσαι
  choice: zusammenleben
  rationale: Das Verb bezeichnet das gemeinsame Wohnen. „Zusammenleben“ ist natürliches modernes Deutsch und vermeidet die mögliche sexuelle Nebenbedeutung von „kohabitieren“.
- source_word: λέοντι
  choice: mit einem Löwen
  rationale: Der Dativ Singular wird direkt wiedergegeben; die Einzahl bewahrt das anschauliche Sprichwortbild.
- source_word: δράκοντι
  choice: mit einem Drachen
  rationale: δράκων kann einen Drachen oder eine große Schlange bezeichnen. „Drache“ ist die direkte, traditionelle Wiedergabe und bewahrt die gesteigerte Bildsprache.
- source_word: εὐδόκησα
  choice: Lieber wollte ich
  rationale: Im Vergleich mit ἤ drückt das Verb eine Bevorzugung aus. „Lieber wollte ich … als“ gibt diese Funktion idiomatisch und mit vergangenheitsbezogener Verbform wieder.
- source_word: ἐνοικῆσαι
  choice: wohnen
  rationale: Das Verb bezeichnet das Wohnen oder seinen Wohnsitz haben. „Wohnen“ erhält den häuslichen Sinn und klingt im heutigen Deutsch natürlich.
- source_word: μετὰ γυναικὸς πονηρᾶς
  choice: bei einer bösen Frau
  rationale: γυνή kann je nach Zusammenhang „Frau“ oder „Ehefrau“ bedeuten. Ohne ausdrückliche Besitzangabe bleibt „Frau“ im Haupttext die vorsichtigere Wahl; πονηρός hat hier moralischen Sinn und wird mit „böse“ wiedergegeben.
theological_decisions:
- issue: Ob γυνή in diesem Spruch als „Frau“ oder „Ehefrau“ wiederzugeben ist
  choice: Frau
  alternative: Ehefrau
  rationale: Das Griechische lässt beide Bedeutungen zu. Die Wohnverben machen „Ehefrau“ kontextuell plausibel, doch der Wortlaut kennzeichnet keine eheliche Beziehung ausdrücklich. Daher bleibt die Mehrdeutigkeit durch Haupttext und Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit sprichwörtlichem Rhythmus. Die parallelen Wohnverben werden durch „zusammenleben“ und „wohnen“ unterschieden; die echte Mehrdeutigkeit von γυνή wird nicht stillschweigend aufgelöst.
