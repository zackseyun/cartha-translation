  source_fidelity: Der deutsche Wortlaut bildet die griechische Bedingung εἰ μὴ, das konkrete πορεύεται („geht“), die auffällige Wendung κατὰ χεῖρά σου sowie den schroffen Imperativ ἀπότεμε zutreffend ab. „Von deinem Fleisch“ gibt die Bildsprache von ἀπὸ τῶν σαρκῶν σου angemessen wieder, ohne die Aussage zu einem technischen Scheidungsbegriff zu verengen.
  naturalness: Die Formulierung ist bewusst knapp und sprichwortartig. „Nach deiner Hand geht“ ist im modernen Alltagsdeutsch ungewöhnlich, aber als absichtlich quellennah erhaltene Metapher mit unmittelbar verankerter Erklärung noch verständlich und für den Weisheitsregister angemessen. Der drastische Ausdruck „schneide sie von deinem Fleisch ab“ ist syntaktisch möglich und bewahrt die Härte des Bildes.
  terminology: Die Fußnoten erläutern die Hand-Wendung vorsichtig als mögliche Leitung oder Verfügungsgewalt und benennen bei „abschneiden“ zutreffend die fehlende explizite juristische Scheidungsterminologie. Sie tragen keine zusätzliche konfessionelle oder dogmatische Deutung ein.
