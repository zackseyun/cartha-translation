  text: If she does not go according to your hand[b][a], cut her off from your flesh.
translation:
  language: de
  text: Wenn sie nicht nach deiner Hand geht,[a] schneide sie von deinem Fleisch ab.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „nach deiner Hand“; gemeint sein kann, dass sie deiner Leitung oder Verfügungsgewalt nicht folgt.'
    reason: lexical_alternative
  - marker: b
    text: „Von deinem Fleisch abschneiden“ ist ein drastisches körperliches Bild für eine entschiedene Trennung; ein ausdrücklicher juristischer Fachbegriff für Scheidung steht hier nicht.
    reason: alternative_reading
lexical_decisions:
- source_word: εἰ μὴ
  choice: Wenn … nicht
  rationale: Gibt die ungeschönte Bedingungskonstruktion direkt und in natürlichem Deutsch wieder; „es sei denn“ wäre ebenfalls möglich, würde den Satzbau aber stärker glätten.
- source_word: πορεύεται
  choice: geht
  rationale: Bewahrt das konkrete Bild des Gehens, statt den Ausdruck deutend mit „sich verhält“ wiederzugeben.
- source_word: κατὰ χεῖρά σου
  choice: nach deiner Hand
  rationale: Erhält die auffällige Hand-Metapher des Griechischen und lässt deren Bedeutung als Handeln nach Leitung oder unter Verfügungsgewalt in einer Fußnote erläutern.
- source_word: ἀπότεμε
  choice: schneide … ab
  rationale: Gibt den scharfen Imperativ und das körperliche Bild unmittelbar wieder, ohne ihn auf einen technischen Rechtsbegriff wie „scheiden“ festzulegen.
- source_word: αὐτήν
  choice: sie
  rationale: Das feminine Pronomen verweist im Zusammenhang auf die Frau.
- source_word: ἀπὸ τῶν σαρκῶν σου
  choice: von deinem Fleisch
  rationale: Das griechische Pluralwort für „Fleisch“ wird nach deutschem Sprachgebrauch im Singular wiedergegeben. Die Formulierung bewahrt das Bild körperlicher beziehungsweise engster verwandtschaftlich-ehelicher Verbundenheit.
theological_decisions:
- issue: Bedeutung des Trennungsgebots im Weisheitskontext
  choice: Der drastische Imperativ und das Bild des Abschneidens vom eigenen Fleisch bleiben erhalten.
  alternative: Explizit mit „lass dich von ihr scheiden“ übersetzen oder abschwächend „trenne dich von ihr“ formulieren.
  rationale: Der griechische Text verwendet keinen ausdrücklichen juristischen Fachausdruck für Scheidung. Die Übersetzung soll die Härte und mögliche eheliche Tragweite der Aussage bewahren, ohne eine engere rechtliche Deutung in den Wortlaut einzutragen.
translation_notes:
  register: Knappes, würdiges und bewusst scharfes Weisheitswort. Die ungewöhnliche Wendung „nach deiner Hand“ und das Bild „von deinem Fleisch“ bleiben source-nah erhalten; die Fußnoten erschließen sie, ohne die im Griechischen vorhandene Deutungsspannung aufzulösen.
