base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/025/005.yaml
  text: If you did not desire them in your youth[b][a], how will you attain them in your old age?
translation:
  language: de
  text: Wenn du in deiner Jugend kein Verlangen nach ihnen hattest[a], wie wirst du sie dann im Alter erlangen?[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Verb kann „Verlangen haben“, „Gefallen haben“ oder „Freude haben“ bedeuten.
    reason: lexical_alternative
  - marker: b
    text: Wörtlich steht im Hebräischen nur das unbestimmte pluralische Objekt „sie“. Gemeint sind im Zusammenhang wahrscheinlich Güter oder Fähigkeiten, die mit Weisheit und gutem Rat verbunden sind.
    reason: lexical_alternative
  - marker: c
    text: 'Die griechische Überlieferung weicht erheblich ab: „Wie schön ist Urteilskraft bei grauem Haar und bei Älteren, Rat zu erkennen!“'
    reason: textual_variant
lexical_decisions:
- source_word: אִם
  choice: Wenn
  rationale: Leitet entsprechend dem hebräischen Bedingungssatz die Voraussetzung ein.
- source_word: בִּנְעֻרוֹתֶיךָ
  choice: in deiner Jugend
  rationale: Die hebräische Pluralform bezeichnet hier idiomatisch den Lebensabschnitt der Jugend.
- source_word: לֹא חֲפַצְתָּם
  choice: kein Verlangen nach ihnen hattest
  rationale: חפץ bezeichnet hier das Verlangen nach etwas oder die Freude daran. Die Formulierung ist im Deutschen natürlicher als „sie nicht begehrtest“ und bewahrt den ausdrücklich pronominalen, aber inhaltlich unbestimmten Bezug.
- source_word: אֵיךְ
  choice: wie wirst du …?
  rationale: Gibt die rhetorische Frage und die Zukunftsorientierung des folgenden Verbs wieder.
- source_word: תַּשִּׁיגֵם
  choice: sie … erlangen
  rationale: השיג bedeutet erreichen, einholen oder erlangen; bei den vorausgesetzten ideellen Gütern ist „erlangen“ angemessen.
- source_word: בְּזִקְנוֹתֶיךָ
  choice: im Alter
  rationale: Die hebräische Pluralform bezeichnet idiomatisch den Lebensabschnitt des hohen Alters und bildet den klaren Gegensatz zur Jugend.
theological_decisions:
- issue: Nicht genannter Bezug des pluralischen Pronomens
  choice: Das unbestimmte „ihnen/sie“ bleibt im Haupttext erhalten.
  alternative: Den Bezug ausdrücklich als „Weisheit“, „Urteilsvermögen“ oder „diese Dinge“ benennen.
  rationale: Der hebräische Text nennt nur ein pluralisches Objektpronomen. Der Zusammenhang weist wahrscheinlich auf Weisheitsgüter, erlaubt aber keine sichere Präzisierung.
- issue: Deutlich abweichende griechische Parallelüberlieferung
  choice: Der gut bezeugte hebräische Wortlaut bildet den Haupttext; die griechische Abweichung wird in einer Fußnote offengelegt.
  alternative: 'Den griechischen Wortlaut in den Haupttext übernehmen: „Wie schön ist Urteilsvermögen bei grauem Haar und bei Älteren die Einsicht in guten Rat!“'
  rationale: Die vorgelegte hebräische Quelle hat Vorrang, doch die erhebliche Differenz der griechischen Überlieferung ist textkritisch relevant und darf nicht verschwiegen werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die symmetrische Gegenüberstellung von „in deiner Jugend“ und „im Alter“ sowie die rhetorische Frage des Hebräischen bleiben erhalten; das eingeschobene „dann“ macht den Folgesinn im Deutschen natürlich hörbar.
