  text: 'Three things my soul has hated[a], and I am greatly distressed by their lives:'
translation:
  language: de
  text: 'Drei Dinge hasst meine Seele[a], und ihr Leben bedrückt mich sehr:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Text weicht hier stark ab: „Eintracht unter Brüdern, Freundschaft unter Nachbarn und eine Frau und ein Mann, die gut miteinander leben.“ Der hebräische und der griechische Text spiegeln an dieser Stelle offenbar unterschiedliche Textfassungen wider.'
    reason: alternative_reading
lexical_decisions:
- source_word: שָׁלֹשׁ הֵנָה
  choice: Drei Dinge
  rationale: Die feminine Zahlform mit dem Pronomen leitet eine Dreierliste ein. „Drei Dinge“ ist im Deutschen natürlich und greift den folgenden pluralischen Bezug auf.
- source_word: שָׂנְאָה נַפְשִׁי
  choice: hasst meine Seele
  rationale: Das vorangestellte Verb bezeichnet eine gefestigte Abneigung. Das deutsche Präsens gibt deren fortdauernde Geltung natürlich wieder; „meine Seele“ bewahrt die affektive Stärke und den hebräischen Ausdruck.
- source_word: וְצַר לִי מְאֹד
  choice: bedrückt mich sehr
  rationale: Die Wendung bezeichnet starke persönliche Bedrängnis, Beklemmung oder Verärgerung. „Bedrückt mich sehr“ ist verständlich und wahrt die emotionale Intensität, ohne die genaue Art des Unbehagens zu verengen.
- source_word: בְּחַיֵּיהֶם
  choice: ihr Leben
  rationale: Dies bildet das hebräische „in/bei ihrem Leben“ knapp und relativ formal ab. Es vermeidet die stärker deutende Erweiterung „ihre Lebensweise“, lässt im Deutschen aber einen Bezug auf ihr gelebtes Leben zu.
theological_decisions:
- issue: Starke Textabweichung zwischen dem hebräischen und dem griechischen Textzeugen
  choice: Der erhaltene hebräische Wortlaut steht im Haupttext; die wesentlich andere griechische Fassung wird in einer Fußnote vollständig wiedergegeben.
  alternative: 'Nach dem Griechischen: „Eintracht unter Brüdern, Freundschaft unter Nachbarn und eine Frau und ein Mann, die gut miteinander leben.“'
  rationale: Wo ein belastbarer hebräischer Sirach-Text erhalten ist, bildet er die primäre Grundlage. Da die griechische Überlieferung hier nicht bloß im Wortlaut, sondern im gesamten Sinn abweicht, muss diese Textform transparent dokumentiert werden, ohne beide Fassungen miteinander zu harmonisieren.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die personifizierende Wendung „meine Seele“ bleibt zur Wahrung des hebräischen Ausdrucks erhalten. Der Doppelpunkt signalisiert, dass die angekündigte Dreierliste in den folgenden Versen ausgeführt wird.
