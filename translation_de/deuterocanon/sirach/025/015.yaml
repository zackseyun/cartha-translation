  yaml_path: translation/deuterocanon/sirach/025/015.yaml
  text: There is no head above the head of a snake[a], and there is no wrath above the wrath of an enemy.
translation:
  language: de
  text: Kein Kopf ist schlimmer als der einer Schlange[a], und kein Zorn schlimmer als der eines Feindes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder sinngemäß: „Kein Gift ist schlimmer als das einer Schlange.“ Im Griechischen steht wörtlich „Kopf … Kopf einer Schlange“; die Übersetzung bewahrt dieses Bild, statt es deutend umzuschreiben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κεφαλή
  choice: Haupt
  rationale: Das Griechische verwendet an beiden Stellen ausdrücklich das konkrete Wort „Haupt“. „Haupt“ bewahrt die zugespitzte Bildsprache und den formelhaften Parallelismus besser als die im Deutschen missverständliche Verbindung „Kopf über Kopf“.
- source_word: ὄφις
  choice: Schlange
  rationale: „Schlange“ ist die natürliche und sachlich genaue moderne deutsche Entsprechung; „Schlangentier“ wäre umständlich, „Serpent“ ist kein gebräuchliches Standarddeutsch.
- source_word: θυμός
  choice: Zorn
  rationale: Hier bezeichnet θυμός heftigen, feindseligen Zorn. „Zorn“ ist würdevoll, prägnant und entspricht dem sprichwortartigen Parallelismus; „Wut“ wäre stärker affektiv und weniger feierlich.
- source_word: ἐχθρός
  choice: Feind
  rationale: „Feind“ ist die klare und übliche Entsprechung und bewahrt die relationale sowie feindselige Bedeutung des griechischen Ausdrucks.
- source_word: ὑπέρ
  choice: übertrifft
  rationale: In dieser Vergleichskonstruktion bezeichnet ὑπέρ ein Übertreffen. Das Verb „übertrifft“ gibt diesen Sinn im heutigen Deutsch klar wieder, ohne die Aussage als räumliches „über“ missverständlich werden zu lassen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst bewahrtem Parallelismus. „Haupt“ ist leicht gehoben, aber allgemein verständlich und vermeidet die unbeholfene Wiederholung „Kopf … Kopf“; „übertrifft“ macht die vergleichende Funktion von ὑπέρ idiomatisch deutlich.
