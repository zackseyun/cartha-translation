translation:
  language: de
  text: Die Bosheit einer Frau[a] verdunkelt das Aussehen eines Mannes und macht sein Gesicht düster wie das eines Bären.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische אִשָּׁה kann auch „Ehefrau“ bedeuten; der Satz kann daher enger auf das Zusammenleben von Ehefrau und Ehemann bezogen sein.
    reason: lexical_alternative
  - marker: b
    text: 'Die griechische Parallele lautet sinngemäß: „Die Bosheit einer Frau verändert ihr Aussehen und verdunkelt ihr Gesicht wie Sackleinen.“ Sie bietet damit andere Pronomen und ein anderes Vergleichsbild als der erhaltene hebräische Text („wie ein Bär“).'
    reason: alternative_reading
lexical_decisions:
- source_word: רֹעַ
  choice: Bosheit
  rationale: Das Substantiv bezeichnet moralische Schlechtigkeit oder schädliches Böses. „Bosheit“ bewahrt die knappe, sprichwörtliche Aussage und entspricht sachlich dem griechischen πονηρία.
- source_word: אִשָּׁה
  choice: einer Frau
  rationale: אִשָּׁה kann „Frau“ oder „Ehefrau“ bedeuten. Da im Hebräischen kein ausdrückliches Besitzverhältnis steht, bleibt „Frau“ im Haupttext die zurückhaltendere Wiedergabe; die eheliche Lesart wird in einer Fußnote genannt.
- source_word: יַשְׁחִיר
  choice: verdunkelt
  rationale: Die Kausativform bezeichnet das Dunkel- oder Schwarzwerdenlassen. „Verdunkelt“ gibt das Bild in natürlichem modernem Deutsch wieder.
- source_word: מַרְאֶה אִישׁ
  choice: das Aussehen eines Mannes
  rationale: מַרְאֶה meint die sichtbare Erscheinung, während אִישׁ hier ausdrücklich einen Mann bezeichnet. Die Formulierung bleibt eng am Hebräischen und ist zugleich geläufig.
- source_word: וְיַקְדִיר
  choice: macht ... düster
  rationale: Das Verb kann verdunkeln sowie einen finsteren oder traurigen Ausdruck bezeichnen. Die Wiedergabe wahrt die Bedeutungsnähe zum ersten Verb, ohne es im Deutschen unbeholfen zu wiederholen.
- source_word: פָּנָיו
  choice: sein Gesicht
  rationale: פָּנִים bedeutet hier schlicht „Gesicht“; das männliche Suffix verweist im hebräischen Text auf den Mann.
- source_word: לְדוֹב
  choice: wie das eines Bären
  rationale: Der hebräische Text bietet das Vergleichsbild „Bär“. Im Deutschen wird „das eines“ ergänzt, damit eindeutig das Gesicht mit dem eines Bären verglichen wird; die abweichende griechische Überlieferung steht in der Fußnote.
theological_decisions:
- issue: Geschlechtsspezifische Sprache des Spruches
  choice: Die Bosheit einer Frau verdunkelt das Aussehen eines Mannes
  alternative: Die Bosheit einer Ehefrau verdunkelt das Aussehen ihres Mannes
  rationale: Der hebräische Wortlaut verwendet ausdrücklich אִשָּׁה und אִישׁ. Diese geschlechtsspezifische Spannung wird weder neutralisiert noch ausdrücklich auf die Ehe eingeengt, obwohl eine eheliche Deutung lexikalisch möglich ist.
- issue: Abweichung zwischen hebräischer und griechischer Überlieferung
  choice: sein Gesicht düster wie das eines Bären
  alternative: ihr Gesicht dunkel wie Sackleinen
  rationale: Die Hauptübersetzung folgt dem vorgegebenen, als zuverlässig eingestuften hebräischen Text. Die griechische Parallele weist sowohl andere Pronomen als auch ein anderes Vergleichsbild auf und wird deshalb als echte Textvariante dokumentiert, nicht in den Haupttext eingemischt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit knapper, würdevoller Spruchform. „Bosheit“, „verdunkelt“ und „düster“ erhalten den ernsten Bildcharakter, ohne archaische Ausdrücke wie „Antlitz“ zu verwenden.
