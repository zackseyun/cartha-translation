  text: Like a sandy ascent under the feet of an old man[c][b][a], so is a sharp-tongued wife to a gentle man.
translation:
  language: de
  text: Wie ein sandiger[a] Aufstieg für die Füße eines alten Mannes, so ist eine scharfzüngige Frau[b] für einen sanften Mann[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische חוּץ ist hier schwer verständlich; die griechische Parallele hat „sandig“. Wahrscheinlich beschreibt das Bild den unsicheren Tritt eines alten Mannes.
    reason: textual_variant
  - marker: b
    text: 'Oder: „eine redselige Frau“. Wörtlich: „eine Frau der Zunge“; die griechische Parallele bezeichnet sie als redselig oder geschwätzig.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „einen ruhigen Mann“. Das griechische Wort kann „ruhig“ oder „friedfertig“ bedeuten; das Hebräische bedeutet wörtlich „weich“ oder „zart“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּמַעֲלֵה
  choice: Wie ein … Aufstieg
  rationale: Das Substantiv von עלה bezeichnet einen Anstieg oder aufwärtsführenden Weg; die griechische Parallele ἀνάβασις bestätigt dieses Bild.
- source_word: חוּץ
  choice: sandiger
  rationale: 'Das hebräische Wort ist an dieser Stelle schwierig. Die griechische Parallele ἀμμώδης („sandig“) bewahrt wahrscheinlich den Sinn des Bildes: unsicherer Untergrund bei einem Anstieg.'
- source_word: לְרַגְלֵי יָשִׁישׁ
  choice: unter den Füßen eines alten Mannes
  rationale: יָשִׁישׁ bezeichnet einen alten Menschen; die Formulierung gibt das Bild des beschwerlichen, unsicheren Tritts anschaulich und natürlich wieder.
- source_word: אֵשֶׁת לָשׁוֹן
  choice: eine scharfzüngige Frau
  rationale: Wörtlich steht „eine Frau der Zunge“. Der Ausdruck kennzeichnet sie durch ihr Reden; „scharfzüngig“ bringt den negativen Vergleich zur Geltung, ohne die ebenfalls mögliche Bedeutung „redselig“ zu verschweigen.
- source_word: לְאִישׁ רַךְ
  choice: für einen sanften Mann
  rationale: רַךְ bedeutet wörtlich „weich, zart“ und kann auf einen Menschen bezogen Sanftheit bezeichnen. Das griechische ἡσύχῳ stützt den Bedeutungsbereich „ruhig, friedfertig“.
theological_decisions:
- issue: Geschlechtsspezifische Form des Weisheitsspruchs
  choice: Frau … Mann
  alternative: Ehefrau … Ehemann; geschlechtsneutrale Wiedergabe
  rationale: Hebräisch und Griechisch nennen ausdrücklich eine Frau und einen Mann. Die geschlechtsspezifische Gestalt des Spruchs bleibt daher erhalten; „Frau“ wahrt zugleich die im hebräischen אשה mögliche Schwebe zwischen Frau und Ehefrau.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Vergleichsstruktur des hebräischen Weisheitsspruchs bleibt erhalten. „Aufstieg“ ist etwas gehobener als „Anstieg“, passt aber zum sprichwörtlichen Register; die textlichen und lexikalischen Unsicherheiten werden in Fußnoten offengelegt.
