translation:
  language: de
  text: In drei Dingen wurde ich schön, und ich trat schön hervor vor dem Herrn und den Menschen:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: „und ich stand schön da“ oder „und ich erhob mich schön“. Das griechische Verb bewahrt das Bild des Aufstehens beziehungsweise Hervortretens.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν τρισὶν
  choice: In drei Dingen
  rationale: Die Wendung bewahrt die Aufzählungsstruktur und bezeichnet den Bereich beziehungsweise die Hinsicht, in der die Sprecherin schön wurde.
- source_word: ὡραιώθην
  choice: wurde ich schön
  rationale: Der Aorist Passiv von ὡραιόω bezeichnet ein Schönwerden beziehungsweise Schön-gemacht-Werden. Die knappe deutsche Form bewahrt den passiven Wortlaut, ohne die ästhetische Aussage zu vergeistigen.
- source_word: ἀνέστην ὡραία
  choice: ich trat schön hervor
  rationale: ἀνέστην trägt das konkrete Bild des Aufstehens oder Hervortretens. „trat … hervor“ ist im Deutschen natürlich und vermeidet das missverständliche Bild, die Sprecherin habe lediglich körperlich aufgestanden.
- source_word: ἔναντι Κυρίου καὶ ἀνθρώπων
  choice: vor dem Herrn und den Menschen
  rationale: ἔναντι wird unmittelbar mit „vor“ wiedergegeben. Der generische Plural ἀνθρώπων bezeichnet Menschen allgemein und wird im modernen Deutschen entsprechend mit „den Menschen“ übersetzt.
theological_decisions:
- issue: Wiedergabe von Κυρίου
  choice: dem Herrn
  alternative: dem HERRN
  rationale: Da der vorliegende Text ein griechischer Zeuge ist und κύριος bietet, entspricht „Herr“ der unmittelbaren Ausgangsform, ohne eine nicht direkt bezeugte Wiedergabe des Gottesnamens einzutragen.
- issue: Personifikation und grammatisches Geschlecht der Sprecherstimme
  choice: Die Ich-Form bleibt ohne ergänzte Identifikation; „schön“ ist im Deutschen genusneutral.
  alternative: Explizite Identifikation der Sprecherin, etwa als Weisheit
  rationale: Der Einzelvers benennt die Sprecherstimme nicht ausdrücklich. Eine Identifikation wäre aus dem weiteren Zusammenhang zu erschließen und soll nicht in diesen Vers hineingetragen werden.
- issue: Generisches ἀνθρώπων
  choice: den Menschen
  alternative: den Männern
  rationale: ἄνθρωπος bezeichnet hier Menschen allgemein, nicht spezifisch männliche Personen. „Menschen“ gibt Umfang und Bedeutung im heutigen Deutsch genau wieder.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung des Schönheitsmotivs wurde wie im Griechischen erhalten; die konkrete Bewegungsbildlichkeit von ἀνέστην wird durch „trat … hervor“ natürlich wiedergegeben.
