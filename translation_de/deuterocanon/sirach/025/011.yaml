  text: Happy is the husband of a prudent wife[b][a], and who does not plow with an ox and a donkey together.
translation:
  language: de
  text: Glücklich ist der Mann, der eine verständige Frau hat und nicht mit einem Ochsen und einem Esel zusammen pflügt.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Text lautet wesentlich anders: „Wie groß ist doch einer, der Weisheit gefunden hat! Doch niemand steht über dem, der den Herrn fürchtet.“'
    reason: alternative_reading
  - marker: b
    text: Das Bild spielt wahrscheinlich auf 5. Mose 22,10 an, wo verboten wird, mit einem Ochsen und einem Esel zusammen zu pflügen. Hier dient es sprichwörtlich als Bild für eine unpassende Verbindung.
    reason: cross_reference
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: Glücklich ist
  rationale: Die hebräische Seligpreisungsformel bezeichnet einen beneidenswerten Zustand des Wohlergehens. „Glücklich ist“ klingt im modernen Deutschen natürlich und bewahrt den weisheitlichen Charakter.
- source_word: בַעַל אִשָּׁה
  choice: der Mann, der eine … Frau hat
  rationale: Wörtlich steht eine idiomatische Bezeichnung für den Ehemann. Die gewählte Formulierung gibt die männliche Bezugsperson natürlich wieder, ohne einen irreführenden Besitzanspruch auszudrücken.
- source_word: מַשְׁכָּלֶת
  choice: verständige
  rationale: Das Wort bezeichnet Einsicht, gesunden Menschenverstand und umsichtiges Handeln. „Verständig“ erfasst diese praktische Weisheit besser als das stärker intellektuell klingende „intelligent“.
- source_word: חוֹרֵשׁ
  choice: pflügt
  rationale: Das Partizip bezeichnet das Pflügen; die finite Form fügt sich im Deutschen natürlich in die fortgesetzte Beschreibung des Mannes ein.
- source_word: בְּשׁוֹר וְבַחְמוֹר יַחְדָּו
  choice: mit einem Ochsen und einem Esel zusammen
  rationale: Die Formulierung gibt beide Zugtiere und יַחְדָּו ausdrücklich wieder. „Ochse“ passt zum landwirtschaftlichen Zusammenhang; die sprichwörtliche Aussage über eine ungleiche Verbindung bleibt als Bild erhalten.
theological_decisions:
- issue: Starke Abweichung zwischen dem erhaltenen hebräischen Text und der griechischen Überlieferung
  choice: Der erhaltene hebräische Text steht im Haupttext; die deutlich andere griechische Lesart wird in einer Fußnote vollständig wiedergegeben.
  alternative: 'Dem Griechischen folgen: „Wie groß ist, wer Weisheit gefunden hat; doch niemand steht über dem, der den Herrn fürchtet.“'
  rationale: Da hier ein gut bezeugter hebräischer Text vorliegt, bildet er die Grundlage der Übersetzung. Die griechische Parallelüberlieferung bietet jedoch einen völlig anderen Spruch und darf daher weder stillschweigend harmonisiert noch ausgelassen werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer weisheitlicher Aussage. Die Satzstruktur verbindet beide Merkmale mit demselben Mann. Die Bildsprache bleibt knapp und wird erst in der Fußnote erläutert.
