base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/025/025.yaml
  text: A bad wife is leprosy to her husband[a]; let him drive her out of his house[c][b], and he will be healed of his leprosy.
translation:
  language: de
  text: Eine schlechte Ehefrau ist für ihren Mann Aussatz[a]. Er soll sie aus seinem Haus vertreiben[b][c], dann wird er von seinem Aussatz geheilt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort צָרַעַת, traditionell mit „Aussatz“ wiedergegeben, bezeichnet im biblischen Sprachgebrauch verschiedene schwere Hautkrankheiten, nicht unbedingt die heute sogenannte Lepra (Hansen-Krankheit).
    reason: cultural_note
  - marker: b
    text: 'Oder: „Er soll sich von ihr scheiden lassen.“ Wörtlicher heißt es im Hebräischen: „Er soll sie aus seinem Haus vertreiben“; eine Trennung kann gemeint sein, ohne dass ihre rechtliche Form ausdrücklich benannt wird.'
    reason: alternative_reading
  - marker: c
    text: 'Die griechische Textüberlieferung lautet hier deutlich anders: „Gib dem Wasser keinen Abfluss und einer bösen Frau keine Vollmacht.“ Die Übersetzung folgt an dieser Stelle dem erhaltenen hebräischen Text.'
    reason: textual_variant
lexical_decisions:
- source_word: אִשָּׁה רָעָה
  choice: eine schlechte Ehefrau
  rationale: Im Zusammenhang bezeichnet אִשָּׁה wegen לְבַעֲלָהּ eine Ehefrau. „Schlecht“ bewahrt die breite moralische und praktische Bedeutung von רָעָה, ohne sie unnötig auf „böse“ oder „gottlos“ einzuengen.
- source_word: צָרַעַת
  choice: Aussatz
  rationale: „Aussatz“ ist die herkömmliche deutsche Wiedergabe des biblischen Krankheitsbegriffs. Eine Fußnote erklärt, dass damit nicht ausschließlich die heute als Lepra bezeichnete Krankheit gemeint ist.
- source_word: לְבַעֲלָהּ
  choice: für ihren Mann
  rationale: בעל bedeutet in diesem ehelichen Zusammenhang „Mann/Ehemann“. Die Präposition ל wird in der deutschen Vergleichsaussage natürlich mit „für“ wiedergegeben.
- source_word: יְגַרְשֶׁנָּה מִבֵּיתוֹ
  choice: Er soll sie aus seinem Haus vertreiben
  rationale: גרש bezeichnet konkret das Forttreiben oder Hinausweisen. Der Zusatz „aus seinem Haus“ spricht dafür, die räumliche Aussage beizubehalten, statt sie ausschließlich als rechtlichen Scheidungsakt wiederzugeben.
- source_word: וְיִתְרַפֵּא מִצָּרַעְתּוֹ
  choice: dann wird er von seinem Aussatz geheilt
  rationale: 'Die Verbfolge lässt sich folgernd verstehen: Auf das geforderte Vertreiben folgt die Heilung. Die Wiederholung von „Aussatz“ erhält die rhetorische Klammer des Hebräischen.'
theological_decisions:
- issue: Ob יְגַרְשֶׁנָּה als rechtliche Scheidung oder als konkrete Entfernung aus dem Haushalt wiederzugeben ist
  choice: 'Konkrete Entfernung: „Er soll sie aus seinem Haus vertreiben“'
  alternative: „Er soll sich von ihr scheiden lassen“
  rationale: Das Verb גרש kann im ehelichen Zusammenhang eine Scheidung einschließen, doch מִבֵּיתוֹ formuliert zunächst das konkrete Vertreiben aus dem Haus. Die Übersetzung legt die rechtliche Form daher nicht fest und bewahrt die Spannung des Ausgangstextes.
- issue: Metaphorische Gleichsetzung mit צָרַעַת
  choice: „ist für ihren Mann wie Aussatz“
  alternative: „ist Aussatz für ihren Mann“
  rationale: Das ergänzte „wie“ macht die metaphorische Aussage im heutigen Deutsch klar und natürlich, ohne ihre Härte oder ihren Aussagegehalt abzuschwächen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die drastische Bildsprache und die imperativische Schärfe des hebräischen Weisheitsspruchs bleiben erhalten. „Ehefrau“ verdeutlicht den durch „ihren Mann“ gegebenen ehelichen Zusammenhang; die Fußnoten erläutern den antiken Krankheitsbegriff, die mögliche rechtliche Implikation und die stark abweichende griechische Überlieferung.
