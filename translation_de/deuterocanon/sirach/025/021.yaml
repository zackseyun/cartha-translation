  text: Do not fall for a woman's beauty, and do not desire a woman for what she has.
translation:
  language: de
  text: Erlieg nicht der Schönheit einer Frau, und begehre sie nicht wegen dessen, was sie hat[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Parallele lautet allgemeiner: „und verlange nicht nach einer Frau.“ Der hebräische Text warnt genauer davor, sie wegen dessen zu begehren, was sie hat.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תִּפּוֹל
  choice: Erlieg nicht
  rationale: Das Hebräische sagt wörtlich „fall nicht“. Mit der folgenden Angabe der Schönheit bezeichnet es, dass jemand sich von ihr überwältigen oder gefangen nehmen lässt. „Erlieg nicht“ bewahrt dieses Bild in natürlichem, würdigem Deutsch.
- source_word: בְּיֹפִי
  choice: der Schönheit
  rationale: Die Präposition בְּ kennzeichnet hier den Anlass oder die Ursache des Fallens. Nach „erliegen“ wird dieser Zusammenhang im Deutschen idiomatisch durch den Dativ ausgedrückt.
- source_word: אִשָּׁה
  choice: einer Frau
  rationale: אִשָּׁה kann „Frau“ oder „Ehefrau“ bedeuten. Da ein ehelicher Zusammenhang oder ein Possessivbezug fehlt, ist das allgemeinere „Frau“ vorzuziehen.
- source_word: וְעַל יֵש לָהּ
  choice: wegen dessen, was sie hat
  rationale: Die knappe hebräische Wendung verweist auf das, was die Frau besitzt oder was ihr zur Verfügung steht. Die Formulierung bleibt bewusst weiter als „Vermögen“ oder „Besitz“ und gibt den motivierenden Grund des Begehrens wieder.
- source_word: לֹא תַּחְמוֹד
  choice: begehre sie nicht
  rationale: חמד bezeichnet starkes Begehren oder Begehrlichkeit. „Begehren“ lässt sowohl die auf die Frau gerichtete Anziehung als auch das eigennützige Interesse an dem, was sie hat, stehen, ohne den Sinn auf rein sexuelle Begierde einzuengen. Das Objekt „sie“ ist im Deutschen zur verständlichen Wiedergabe des knappen Zusammenhangs ergänzt.
theological_decisions:
- issue: Hebräische Fassung der zweiten Satzhälfte gegenüber der kürzeren griechischen Parallele
  choice: 'Die spezifischere hebräische Aussage wird im Haupttext wiedergegeben: „begehre sie nicht wegen dessen, was sie hat“.'
  alternative: „Begehre eine Frau nicht“ beziehungsweise „Verlange nicht nach einer Frau“ nach der griechischen Parallele.
  rationale: Der erhaltene hebräische Text ist hier die primäre Quelle und nennt ausdrücklich das, was sie hat, als Beweggrund. Die griechische Parallele enthält diesen Zusatz nicht. Diese Abweichung wird in einer Fußnote offengelegt, statt beide Lesarten stillschweigend anzugleichen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem weisheitlichem Ton. „Erlieg nicht“ bewahrt das hebräische Fallmotiv natürlicher als das missverständliche „Fall nicht auf … herein“. Die zweite Satzhälfte folgt dem hoch bewerteten hebräischen Zeugnis; die abweichende kürzere griechische Fassung wird transparent in der Fußnote genannt.
