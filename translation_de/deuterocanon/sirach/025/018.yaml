translation:
  language: de
  text: Ihr Mann sitzt unter seinen Gefährten[a] und seufzt, ohne zu verstehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Parallelüberlieferung lautet sinngemäß: „Ihr Mann wird sich unter seinen Gefährten zu Tisch legen, und als er hörte, seufzte er bitter.“ Besonders der zweite Satzteil weicht deutlich vom erhaltenen hebräischen Text ab.'
    reason: alternative_reading
lexical_decisions:
- source_word: בַּעֲלָה
  choice: ihr Mann
  rationale: בעל mit Suffix der 3. Person Feminin Singular bezeichnet in diesem Zusammenhang den Ehemann; „ihr Mann“ ist die natürliche und genaue deutsche Wiedergabe.
- source_word: בֵּין רֵעִים
  choice: unter seinen Gefährten
  rationale: Die Wendung bezeichnet das Zusammensein mit Freunden oder Gefährten. „Unter seinen Gefährten“ erhält den sozialen Zusammenhang und gibt die Präposition idiomatisch wieder.
- source_word: יֵשֵׁב
  choice: sitzt
  rationale: Das hebräische Verb bedeutet hier schlicht „sitzen“. Das griechische „wird sich zu Tisch legen“ wird wegen der Priorität des erhaltenen Hebräisch nicht in den Haupttext übernommen.
- source_word: וּבְלֹא טַעֲמוֹ
  choice: ohne zu wissen, warum
  rationale: טעם kann Geschmack, Einsicht, Urteil oder Sinn bezeichnen. Im Zusammenhang drückt die Wendung am natürlichsten aus, dass ihm der Grund seines Seufzens nicht bewusst ist; die semantische Offenheit wird nicht als bloßer Mangel an Vernunft zugespitzt.
- source_word: יִתְאַנָּח
  choice: seufzt
  rationale: Das Verb bezeichnet einen hörbaren Ausdruck von Bedrängnis. „Seufzt“ ist im Deutschen idiomatisch und lässt offen, wie stark dieser Ausdruck ist; das griechische „bitter“ gehört zur abweichenden Parallelüberlieferung.
theological_decisions:
- issue: Vorrang des Hebräischen bei abweichender griechischer Überlieferung
  choice: 'Der Haupttext folgt dem erhaltenen Hebräisch: Der Mann sitzt unter seinen Gefährten und seufzt, ohne zu wissen, warum.'
  alternative: 'Griechisch: „Ihr Mann wird sich bei seinem Nächsten zu Tisch legen, und als er es hörte, seufzte er bitter.“'
  rationale: Da für diesen Vers ein hochgradig verlässlicher hebräischer Text vorliegt, bildet er die Grundlage der Übersetzung. Die deutliche Abweichung der griechischen Parallelüberlieferung, besonders im zweiten Satzglied, wird transparent in einer Fußnote bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe zweigliedrige Struktur des Hebräischen bleibt erhalten; die idiomatische Wiedergabe „ohne zu wissen, warum“ vermeidet das im Deutschen missverständliche „ohne Sinn“.
