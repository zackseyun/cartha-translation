  text: Any wound[a], but not like a wound of the heart; any evil, but not like the evil of a woman.
translation:
  language: de
  text: Jede Wunde – doch keine wie die Wunde des Herzens; jedes Übel – doch keines wie das Übel einer Frau.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Jedes Unglück, doch keines wie das Unglück, das eine Frau verursacht.« Das hebräische Wort רָעָה kann »Übel/Böses« oder »Unglück/Schaden« bedeuten; אִשָּׁה kann im Zusammenhang auch »Ehefrau« heißen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל
  choice: jede / jedes
  rationale: Das distributiv gebrauchte כָּל wird in beiden Satzgliedern mit »jede/jedes« wiedergegeben. So bleiben der umfassende Geltungsanspruch und die parallele Form des Spruchs erhalten.
- source_word: מַכָּה
  choice: Wunde
  rationale: מַכָּה bezeichnet einen Schlag und die daraus entstehende Verletzung, kann aber auch übertragen gebraucht werden. »Wunde« bewahrt zusammen mit »des Herzens« sowohl die körperliche als auch die innere Bildlichkeit; die griechische Parallele πληγή stützt diese Wiedergabe.
- source_word: הַלֵּב
  choice: des Herzens
  rationale: Die konkrete Metapher des hebräischen Textes bleibt erhalten. לֵב kann den inneren Menschen, Verstand und Willen bezeichnen, doch eine erklärende Auflösung würde die Bildsprache unnötig festlegen.
- source_word: רָעָה
  choice: Übel
  rationale: רָעָה kann moralisch Böses ebenso wie Unheil, Schaden oder Unglück bezeichnen. »Übel« erhält im Deutschen diese gewisse Bedeutungsweite und entspricht zugleich der scharfen Wertung des Spruchs; die griechische Parallele πονηρία unterstützt die moralische Nuance.
- source_word: אִשָּׁה
  choice: einer Frau
  rationale: Ohne eindeutiges Ehe- oder Besitzmerkmal ist »Frau« die unmittelbarste Wiedergabe. Das Wort kann kontextabhängig auch »Ehefrau« bedeuten; diese Möglichkeit wird in der Fußnote genannt.
- source_word: וְלֹא כְ
  choice: doch keine/keines wie
  rationale: Die vergleichende Verneinung drückt aus, dass unter allen genannten Fällen keiner dem folgenden Extrem gleichkommt. »Doch keine wie« bewahrt die knappe hebräische Parallelstruktur und klingt im Deutschen sprichwörtlich.
theological_decisions:
- issue: Die pauschal und frauenfeindlich wirkende Aussage des zweiten Satzglieds
  choice: Die direkte Formulierung »das Übel einer Frau« bleibt im Haupttext stehen.
  alternative: »das von einer Frau verursachte Unglück« oder, bei ehelichem Verständnis, »das Übel einer Ehefrau«
  rationale: Die Härte und Spannung des Quelltexts darf nicht durch eine beschönigende Paraphrase beseitigt werden. Zugleich werden die echten lexikalischen Alternativen von רָעָה und אִשָּׁה in der Fußnote transparent gemacht, ohne sie zur alleinigen Deutung zu erklären.
translation_notes:
  register: Knapp, parallel und sprichwörtlich. Die Wiederholung von »Wunde« und »Übel« bildet die hebräische Struktur ab; »doch keine/keines wie« ist natürliches modernes Standarddeutsch mit würdigem Ton.
