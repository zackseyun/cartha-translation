translation:
  language: de
  text: 'Erschlaffte Hände und versagende Knie: eine Frau, die ihren Mann nicht glücklich preist[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die ihren Mann nicht als glücklich bezeichnet“. Das hebräische Verb kann im Zusammenhang möglicherweise auch den Sinn haben: „die ihren Mann nicht glücklich macht“ oder „ihm kein Glück bringt“. Der griechische Paralleltext lautet: „die ihren Mann nicht glücklich preist“.'
    reason: Die Fußnote bewahrt die mögliche resultative Nuance von אשר, ohne die im Haupttext naheliegende Bedeutung „glücklich preisen“ zu verdrängen; sie vermerkt zugleich die Stützung durch den griechischen Paralleltext.
lexical_decisions:
- source_word: רִפְיוֹן יָדַיִם
  choice: erschlaffte Hände
  rationale: רִפְיוֹן bezeichnet Lockerung, Schwäche oder Kraftlosigkeit. „Erschlaffte Hände“ bewahrt das konkrete Körperbild und entspricht zugleich dem griechischen Paralleltext mit herabhängenden beziehungsweise kraftlosen Händen.
- source_word: כִשְׁלוֹן בִּרְכַּיִם
  choice: versagende Knie
  rationale: כִשְׁלוֹן gehört zur Wortfamilie des Strauchelns und bezeichnet hier bildhaft Knie, die keinen Halt mehr geben. „Versagende Knie“ ist im Deutschen natürlich und wahrt das Bild körperlicher Entkräftung.
- source_word: אִשָּׁה
  choice: eine Frau
  rationale: Das Substantiv kann „Frau“ oder „Ehefrau“ bedeuten. Durch „ihren Mann“ ist die eheliche Beziehung bereits eindeutig; „eine Frau“ vermeidet im Deutschen die schwerfällige Verbindung „eine Ehefrau … ihren Ehemann“.
- source_word: לֹא תְאַשֵּׁר
  choice: nicht glücklich macht
  rationale: Die Piel-Form von אשר kann bedeuten, jemanden glücklich beziehungsweise als glücklich gelten zu lassen oder ihn glücklich zu preisen. „Nicht glücklich macht“ gibt den möglichen Ergebnissinn natürlich wieder, ohne die Alternativen zu verschweigen; diese werden in der Fußnote genannt.
- source_word: בַּעֲלָהּ
  choice: ihren Mann
  rationale: Im ausdrücklich ehelichen Zusammenhang bezeichnet בַּעַל den Ehemann. „Mann“ ist hier die natürliche moderne deutsche Entsprechung; „Herr“ wäre irreführend.
theological_decisions:
- issue: Verhältnis des erhaltenen hebräischen Textes zum längeren griechischen Paralleltext
  choice: Der hebräische Text bestimmt Umfang und Wortlaut; der griechische Text dient nur zur Bestätigung der Bildstruktur und zur Klärung von לֹא תְאַשֵּׁר.
  alternative: Die zusätzlichen griechischen Aussagen über ein niedergeschlagenes Herz, ein finsteres Gesicht, eine Herzenswunde und eine böse Frau in den Vers aufnehmen.
  rationale: Der hebräische Text ist für diese Zeile mit hoher Sicherheit belegt. Die im Griechischen zusätzlich überlieferten Bestandteile dürfen daher nicht stillschweigend in die Übersetzung des vorhandenen hebräischen Wortlauts eingefügt werden.
- issue: Bedeutung von לֹא תְאַשֵּׁר
  choice: Im Haupttext steht der mögliche Ergebnissinn „nicht glücklich macht“; die deklarative Bedeutung wird in der Fußnote erhalten.
  alternative: „die ihren Mann nicht glücklich preist“ oder „die ihren Mann nicht segnet“ im Haupttext.
  rationale: Das Hebräische lässt eine Spannung zwischen Glücklichpreisen, Als-glücklich-Bezeichnen und Glücklichmachen zu. Die gewählte Formulierung ist idiomatisch, während die Fußnote die echte lexikalische Mehrdeutigkeit offenlegt.
translation_notes:
  register: Moderne, würdige Standardsprache mit knapper, sprichwortartiger Satzstruktur. Die parallelen Körperbilder bleiben erhalten; die negative Aussage über die Ehefrau wird weder abgeschwächt noch über den hebräischen Wortlaut hinaus verschärft.
