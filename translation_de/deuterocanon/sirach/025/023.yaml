    rationale: „Segnen“ ist zwar formal als Übersetzungsannäherung denkbar, aber im heutigen Deutsch deutlich religiöser und weniger präzise als „glücklich preisen/als glücklich bezeichnen“. Die Fußnote sollte die real relevante Bedeutungsweite klarer und knapper darstellen.
