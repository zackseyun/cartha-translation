translation:
  language: de
  text: Der Segen Gottes ist das Los des Gerechten, und zur Zeit seiner Hoffnung wird er aufblühen.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: „Der Segen Gottes ist das Los des Gerechten, und zur Zeit seiner Hoffnung wird er aufblühen.“ Die griechische Parallelüberlieferung lautet erheblich anders: „Eine böse Stunde lässt das Wohlleben vergessen, und am Ende eines Menschen kommt die Offenbarung seiner Werke.“ Dies weist auf eine abweichende Textüberlieferung dieses Verses hin.'
    reason: textual_variant
  - marker: b
    text: 'Oder: Das Verb kann sich auf „seine Hoffnung“ beziehen: „… und zur Zeit seiner Hoffnung wird sie aufblühen.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּרְכַּת אֵל
  choice: der Segen Gottes
  rationale: Die Constructusverbindung bezeichnet Gottes Segen; der bestimmte Ausdruck gibt die allgemeine Weisheitsaussage natürlich und würdig wieder.
- source_word: גּוֹרָל
  choice: das Los
  rationale: Bewahrt das konkrete Bild des durch Zuteilung zufallenden Anteils. „Schicksal“ wäre stärker deutend, „Erbteil“ weniger unmittelbar.
- source_word: צַדִּיק
  choice: des Gerechten
  rationale: Das substantivierte Adjektiv bezeichnet den Menschen, der gerecht handelt. Der repräsentative Singular entspricht der hebräischen Form.
- source_word: וּבְעֵת תִּקְוָתוֹ
  choice: und zur Zeit seiner Hoffnung
  rationale: Gibt die Zeitangabe ausdrücklich wieder und lässt תקוה sowohl als Hoffnung als auch als Erwartung hörbar bleiben.
- source_word: תִּפְרָח
  choice: wird er aufblühen
  rationale: פרח trägt das lebendige Bild des Blühens. Das maskuline Pronomen bezieht sich in der deutschen Satzform grammatisch am ehesten auf „Segen“, während eine Fußnote die im Hebräischen mögliche Zuordnung zur Hoffnung offenhält.
theological_decisions:
- issue: Bezugswort des femininischen Singularverbs תִּפְרָח
  choice: 'Im Haupttext wird der Segen als naheliegendes Bezugswort verstanden: „wird er aufblühen“.'
  alternative: „Seine Hoffnung wird aufblühen.“
  rationale: Sowohl בִּרְכַּת („Segen“, feminin) als auch תִּקְוָתוֹ („seine Hoffnung“, feminin) können grammatisch als Bezugswort dienen. Der Haupttext folgt der bevorzugten Deutung, ohne die echte Mehrdeutigkeit zu verschweigen.
- issue: Stark abweichende griechische Überlieferung
  choice: Der hebräische Text bleibt Grundlage des Haupttextes.
  alternative: Die griechische Fassung spricht von einer bösen Stunde, dem Vergessen des Wohllebens und der Offenbarung der Werke am Lebensende.
  rationale: Die griechische Parallelüberlieferung bietet offenbar eine erheblich andere Textform und kann nicht stillschweigend in den hebräischen Wortlaut eingetragen werden; die Abweichung wird textkritisch vermerkt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Weisheitston. „Los“ bewahrt das hebräische Zuteilungsbild; „aufblühen“ erhält die organische Metapher. Die Fußnotenmarker stehen im Haupttext an der zugehörigen Aussage.
