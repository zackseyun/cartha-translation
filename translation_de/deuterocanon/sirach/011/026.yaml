  text: For it is easy in the eyes of the Lord[a], in a sudden moment, to make a poor man rich.
translation:
  language: de
  text: Denn für den Herrn[a] ist es leicht, einen Armen plötzlich reich zu machen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Griechisch: „Denn vor dem Herrn ist es leicht, am Tag des Todes einem Menschen nach seinen Wegen zu vergelten.“ Der griechische Text bietet eine erheblich andere Fassung des Verses als der erhaltene hebräische Text.'
    reason: alternative_reading
lexical_decisions:
- source_word: נֹכַח
  choice: leicht
  rationale: Im Zusammenhang mit בְּעֵינֵי יי und gestützt durch das griechische κοῦφον bezeichnet das Wort, dass die Handlung für den Herrn mühelos ist.
- source_word: בְּעֵינֵי יי
  choice: in den Augen des Herrn
  rationale: Die Formulierung bewahrt die hebräische Wendung in natürlichem Deutsch; „Herr“ gibt die ehrfürchtige Schreibung des Gottesnamens wieder.
- source_word: בְּפֶתַע פִּתְאֹם
  choice: von einem Augenblick auf den anderen
  rationale: Die natürliche deutsche Wendung bringt die durch den doppelten hebräischen Ausdruck betonte Plötzlichkeit zum Ausdruck.
- source_word: לְהַעֲשִׁיר
  choice: reich zu machen
  rationale: Die kausative Hifil-Form wird transparent als „reich machen“ wiedergegeben.
- source_word: דָּל
  choice: einen Armen
  rationale: Das substantivisch gebrauchte Adjektiv bezeichnet im Singular einen armen beziehungsweise mittellosen Menschen; „einen Armen“ ist knapp und entspricht dem Weisheitsstil.
theological_decisions:
- issue: Wiedergabe des Gottesnamens
  choice: des Herrn
  alternative: JHWH / des HERRN
  rationale: יי ist eine ehrfürchtige Schreibung des Gottesnamens. „Herr“ entspricht der etablierten deutschen Bibelsprache, ohne eine besondere konfessionelle Deutung einzutragen.
- issue: Deutlich verschiedene hebräische und griechische Versfassungen
  choice: Der erhaltenen hebräischen Fassung im Haupttext folgen und die griechische Fassung in einer Fußnote dokumentieren
  alternative: Denn vor dem Herrn ist es leicht, am Tag des Todes einem Menschen nach seinen Wegen zu vergelten.
  rationale: Da hier ein hebräischer Text mit hoher Sicherheit erhalten ist, bildet er die Grundlage der Übersetzung. Die erheblich abweichende griechische Fassung wird aus textkritischer Transparenz vollständig in der Fußnote bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die hebräische Bildrede „in den Augen des Herrn“ bleibt erhalten; die betonte Plötzlichkeit wird idiomatisch mit „von einem Augenblick auf den anderen“ ausgedrückt.
