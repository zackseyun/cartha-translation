lexical_decisions:
- source_word: ἀγαθὰ
  choice: Gutes
  rationale: Bewahrt als substantiviertes Adjektiv die umfassende, sprichwortartige Gegenüberstellung mit κακά.
- source_word: κακά
  choice: Böses
  rationale: Gibt die moralische wie erfahrungsbezogene Weite des griechischen Ausdrucks wieder, ohne ihn auf bloßes Unglück einzuengen.
- source_word: ζωὴ καὶ θάνατος
  choice: Leben und Tod
  rationale: Direkte und idiomatische Wiedergabe des festen Gegensatzpaares.
- source_word: πτωχεία καὶ πλοῦτος
  choice: Armut und Reichtum
  rationale: Erhält den klaren wirtschaftlich-sozialen Gegensatz.
- source_word: παρὰ Κυρίου ἐστίν
  choice: kommen vom Herrn
  rationale: Drückt Herkunft beziehungsweise Ursprung natürlich aus und wahrt die Aussage über Gottes Souveränität, ohne ihren Mechanismus näher zu bestimmen.
- source_word: Κυρίου
  choice: Herrn
  rationale: Die übliche, würdevolle Wiedergabe von κύριος in diesem deuterokanonischen Zusammenhang.
theological_decisions:
- issue: Göttlicher Ursprung günstiger und ungünstiger Gegebenheiten
  choice: Gutes und Böses werden ebenso wie Leben und Tod sowie Armut und Reichtum dem Herrn als Ursprung zugeordnet.
  alternative: κακά als „Unglück“ oder „Widrigkeiten“ wiederzugeben, um moralisches Böses ausdrücklich auszuschließen.
  rationale: Der griechische Text stellt ἀγαθὰ und κακά ausdrücklich einander gegenüber. Die Übersetzung bewahrt diese theologische Spannung und schränkt „Böses“ nicht erklärend ein.
- issue: Wahl der Textgrundlage bei abweichendem hebräischem Zeugen
  choice: Der griechischen Parallelüberlieferung wird für diesen Vers gefolgt.
  alternative: Die überlieferte hebräische Zeile zu übersetzen, obwohl sie offenbar einen anderen Wortlaut beziehungsweise Verszusammenhang repräsentiert.
  rationale: Die angegebene hebräische Zeile stimmt weder mit der griechischen Überlieferung von Sirach 11,14 noch zuverlässig mit der Versreferenz überein und ist als „minor mismatch“ gekennzeichnet. Daher bietet der griechische Paralleltext hier die stabilere Grundlage; die Abweichung wird offengelegt.
translation_notes:
  register: Knapp, ausgewogen und sprichwortartig. Die drei Gegensatzpaare werden parallel gebaut; „kommen vom Herrn“ ist modernes Standarddeutsch und bezeichnet den Ursprung, ohne die theologische Spannung aufzulösen.
