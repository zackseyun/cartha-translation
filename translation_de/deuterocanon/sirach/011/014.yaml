  text: There is one who is poor and perishing as he walks[a], lacking everything, yet more than a poor man.
translation:
  language: de
  text: Gutes und Böses, Leben und Tod, Armut und Reichtum kommen vom Herrn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die erhaltene hebräische Zeile des primären Zeugen bietet offenbar einen anderen Wortlaut und stimmt nicht zuverlässig mit dieser Versreferenz überein. Der griechische Paralleltext lautet: „Gutes und Böses, Leben und Tod, Armut und Reichtum kommen vom Herrn.“ Daher folgt die Übersetzung hier dem Griechischen.'
