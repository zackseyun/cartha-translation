  text: There is one who labors and toils and rushes about[a], yet all the more he falls behind.
translation:
  language: de
  text: Da ist einer, der sich abmüht, sich plagt und umhereilt, und umso mehr bleibt er zurück.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: »er verspätet sich / bleibt zurück«. Die griechische Textüberlieferung lautet hier stattdessen: »Und er erhob sein Haupt, und viele staunten über ihn.« Sie bezeugt damit eine erheblich abweichende Textgestalt.'
    reason: textual_variant
lexical_decisions:
- source_word: יֵשׁ
  choice: Da ist einer, der
  rationale: Die Existenzformel führt einen bestimmten Menschentyp als allgemeinen Einzelfall ein, ohne das Geschlecht unnötig hervorzuheben.
- source_word: עָמֵל וְיָגֵעַ
  choice: sich abmüht, sich plagt
  rationale: Die beiden nahezu synonymen Ausdrücke werden als gesteigerte Beschreibung anstrengender, ermüdender Arbeit wiedergegeben.
- source_word: וָרָץ
  choice: umhereilt
  rationale: Das hebräische »läuft« bezeichnet hier im Zusammenhang geschäftige, hastige Aktivität; »umhereilt« klingt im Deutschen natürlich und bewahrt dieses Bild.
- source_word: וּכְדֵי כֵן
  choice: und gerade dadurch
  rationale: Die schwierige Wendung kann ein entsprechendes Maß oder Ergebnis ausdrücken. Im vorliegenden Spruch hebt sie die paradoxe Entsprechung zwischen hektischer Mühe und Verzögerung hervor, ohne sie mit einem starken »trotzdem« völlig aufzulösen.
- source_word: הוּא מִתְאַחֵר
  choice: gerät er ins Hintertreffen
  rationale: Die reflexive Form von אחר bezeichnet ein Sichverspäten oder Zurückbleiben. Die gewählte Formulierung ist idiomatisches modernes Deutsch und passt zum Gegensatz mit dem Umhereilen.
