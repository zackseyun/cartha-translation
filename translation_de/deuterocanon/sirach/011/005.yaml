translation:
  language: de
  text: Denn wunderbar sind die Werke des Herrn,[a] und sein Wirken bleibt dem Menschen verborgen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Überlieferung bietet hier einen deutlich anderen Text: »Viele Tyrannen saßen auf dem Boden; doch einer, an den niemand gedacht hatte, trug eine Krone.« Hebräische und griechische Zeugen scheinen an dieser Stelle unterschiedliche Textformen zu bewahren.'
    reason: textual_variant
lexical_decisions:
- source_word: פְלָאוֹת
  choice: wunderbar
  rationale: Das Wort aus der Wurzel פלא bezeichnet Außergewöhnliches und Staunenswertes. »Wunderbar« gibt die prädikative Aussage natürlich und würdig wieder.
- source_word: מַעֲשֵׂי
  choice: die Werke
  rationale: Der pluralische Status constructus von מעשה bezeichnet hier die Taten oder Werke Gottes. »Werke« ist im Deutschen natürlich und bewahrt den umfassenden Sinn.
- source_word: יי
  choice: des Herrn
  rationale: Die hebräische Vorlage schreibt die Gottesbezeichnung in der ehrfürchtigen Kurzform יי. »Herr« wahrt den göttlichen Titel, ohne eine ausgeschriebene Form יהוה vorzutäuschen.
- source_word: וְנֶעְלָם
  choice: bleibt … verborgen
  rationale: Der Nifal von עלם bezeichnet, dass etwas menschlicher Erkenntnis entzogen ist. »Bleibt verborgen« drückt diesen Zustand idiomatisch aus.
- source_word: מֵאָדָם
  choice: dem Menschen
  rationale: אָדָם ist hier generisch und meint den Menschen beziehungsweise die Menschheit. Der deutsche Singular »dem Menschen« bewahrt sowohl Form als auch allgemeinen Bezug.
- source_word: פָּעֳלוֹ
  choice: sein Wirken
  rationale: Das singularische פעל bezeichnet Gottes Tun oder Wirken. »Wirken« erhält den Wechsel vom Plural »Werke« zum Singular und vermeidet eine schwerfällige Wiederholung von »Werk«.
theological_decisions:
- issue: Wiedergabe der Gottesbezeichnung יי in einem hebräischen Sirachzeugen
  choice: Herr
  alternative: JHWH / HERR
  rationale: Die ehrfürchtige Kurzschreibung wird als göttlicher Titel wiedergegeben. Die typografische Form »HERR« könnte eine ausgeschriebene Tetragrammform suggerieren, die hier nicht vorliegt.
- issue: Generischer Sinn von אָדָם
  choice: dem Menschen
  alternative: der Menschheit
  rationale: »Dem Menschen« bewahrt den hebräischen generischen Singular und ist im modernen Deutschen inklusiv verständlich, ohne den Ausdruck zu kollektivieren.
- issue: Deutlich abweichende griechische Textform
  choice: Hebräischen Haupttext übersetzen und die griechische Lesart in einer Fußnote dokumentieren
  alternative: Griechische Lesart in den Haupttext aufnehmen
  rationale: Die angegebene hebräische Quelle ist mit hoher Sicherheit bezeugt und bildet die Übersetzungsgrundlage. Die erhebliche Abweichung der griechischen Überlieferung darf jedoch nicht stillschweigend übergangen werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Parallelstruktur des Hebräischen bleibt erhalten; »Werke« und »Wirken« bilden den Wechsel zwischen מַעֲשֵׂי und פָּעֳלוֹ ab. Der Fußnotenmarker steht unmittelbar nach der Aussage, deren griechische Parallele textlich abweicht.
