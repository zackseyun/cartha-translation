  text: The bee is small among flying creatures[a], but the first of sweet produce is its fruit.
translation:
  language: de
  text: Die Biene ist klein unter den fliegenden Geschöpfen[a], doch ihre Frucht ist der vorzüglichste der Erträge.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „unter den Vögeln“. Der griechische Paralleltext lautet im zweiten Satzteil sinngemäß: „doch ihre Frucht steht unter den süßen Dingen an erster Stelle“.'
    reason: Die Fußnote bewahrt sowohl die mögliche engere Bedeutung von עוף als auch die abweichende Präzisierung des griechischen Paralleltexts, während der Haupttext dem hebräischen Wortlaut folgt.
lexical_decisions:
- source_word: אֱלִיל
  choice: klein
  rationale: Im Zusammenhang mit בְּעוֹף und entsprechend dem griechischen μικρά bezeichnet das Wort geringe Größe. „Klein“ gibt den Kontrast des Spruchs klar und ohne die hier unpassende Nebenbedeutung „unbedeutend“ wieder.
- source_word: בְּעוֹף
  choice: unter den fliegenden Geschöpfen
  rationale: עוף kann nicht nur Vögel, sondern fliegende Lebewesen allgemein bezeichnen. Diese breitere Bedeutung passt zur Biene und wird auch durch das griechische πετεινοῖς gestützt.
- source_word: דְּבֹרָה
  choice: die Biene
  rationale: Direkte und im sprichwörtlichen Zusammenhang natürliche Wiedergabe.
- source_word: וְרֹאשׁ
  choice: doch … an erster Stelle
  rationale: רֹאשׁ bezeichnet hier Vorrang oder höchsten Rang. Das adversative „doch“ macht den durch die beiden Satzhälften ausgedrückten Kontrast im Deutschen natürlich sichtbar.
- source_word: תְּנוּבוֹת
  choice: unter den Erträgen
  rationale: תְּנוּבוֹת bedeutet „Erträge“ oder „Erzeugnisse“. Die Übersetzung folgt dem Hebräischen, ohne die im griechischen Paralleltext ausdrücklich genannte Süße in den Haupttext einzutragen.
- source_word: פּרִיָהּ
  choice: ihre Frucht
  rationale: Wörtliche Wiedergabe der Metapher. Gemeint ist der Honig als das, was die Biene hervorbringt; auch der griechische Paralleltext bestätigt „Frucht“.
