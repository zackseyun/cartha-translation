  text: And the eye of the Lord looked on him for good[c][b][a], and shook him out of the dust of filth.
translation:
  language: de
  text: Und das Auge des Herrn wachte zu seinem Besten über ihn[a], und der Herr schüttelte ihn aus dem Staub des Unrats heraus.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »behielt ihn mit Wohlwollen im Auge«. Die hebräische Wendung verbindet Gottes aufmerksamen Blick mit einer guten, ihm zugutekommenden Absicht.'
    reason: lexical_alternative
  - marker: b
    text: »Staub des Unrats« kann auch als »Staub des Gestanks« oder »stinkender Staub« verstanden werden. Das hebräische Bild ist anschaulich, seine genaue Bedeutung jedoch nicht völlig sicher.
    reason: alternative_reading
  - marker: c
    text: 'Die griechische Textform weicht stark ab: »Der Herr riss die Wurzeln von Völkern aus und pflanzte an ihrer Stelle Niedrige ein.« Hebräischer und griechischer Text spiegeln hier offenbar wesentlich verschiedene Textfassungen wider.'
    reason: textual_variant
lexical_decisions:
- source_word: וְעֵין יי
  choice: Und das Auge des Herrn
  rationale: Die konkrete hebräische Wendung mit dem singularischen »Auge« bleibt erhalten. Die ehrerbietige Schreibung יי wird entsprechend ihrem Sinn mit »der Herr« wiedergegeben.
- source_word: צָפַתְהוּ
  choice: wachte … über ihn
  rationale: Das Verb bezeichnet ein aufmerksames Schauen oder Wachen. »Über ihn wachen« ist im Deutschen natürlich und lässt sowohl die Beobachtung als auch den schützenden Beiklang erkennen.
- source_word: לְטוֹב
  choice: zu seinem Besten
  rationale: Die Formulierung bringt die im Hebräischen ausgedrückte gute, ihm zugutekommende Absicht zur Geltung, ohne sie auf bloßes Wohlgefallen zu verengen.
- source_word: וַיְנַעֲרֵהוּ
  choice: und schüttelte ihn … heraus
  rationale: Die Wiedergabe bewahrt das kräftige Bild des hebräischen Verbs נער, statt es glättend als bloßes Aufrichten oder Erheben wiederzugeben.
- source_word: מֵעֲפַר
  choice: aus dem Staub … heraus
  rationale: Dies gibt Präposition und Substantiv konkret wieder und verbindet sich im Deutschen natürlich mit »herausschütteln«.
- source_word: צַחֲנָה
  choice: des Unrats
  rationale: Das Wort bezeichnet Gestank, Fäulnis oder widerwärtigen Schmutz. »Unrat« bewahrt das Bild eines erniedrigenden, schmutzigen Zustands, ohne eine unsichere genauere Sache wie einen Misthaufen festzulegen.
theological_decisions:
- issue: Wiedergabe der Gottesbezeichnung יי
  choice: der Herr
  alternative: JHWH / Jahwe
  rationale: יי ist eine ehrerbietige Ersatz- oder Abkürzungsschreibung des Gottesnamens. »Der Herr« entspricht dieser Lesetradition und vermeidet eine nicht ausgeschriebene Form im hebräischen Zeugen eigenmächtig zu rekonstruieren.
- issue: Göttliches Sehen und gutes Handeln
  choice: wachte zu seinem Besten über ihn
  alternative: sah ihn wohlwollend an
  rationale: Die gewählte Fassung wahrt die Spannung zwischen aufmerksamem göttlichem Blick und einer auf das Gute gerichteten Absicht, ohne den Ausdruck ausschließlich als inneres Wohlgefallen oder ausschließlich als Schutz zu deuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das ungewöhnliche, kräftige Bild des hebräischen Textes wird bewusst nicht geglättet; die Satzstruktur bleibt dennoch gut verständlich.
