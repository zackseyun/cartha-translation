translation:
  language: de
  text: Viele Unterdrückte saßen auf einem Thron,[a] und Menschen, an die niemand gedacht hatte, legten einen Turban an.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Parallelfassung lautet anders: „Viele Machthaber wurden sehr entehrt, und Angesehene wurden in die Hände ihrer Gefährten ausgeliefert.“ Beide Fassungen beschreiben eine Umkehr gesellschaftlicher Stellung.'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlich: „Und die nicht auf das Herz kamen, legten einen Turban an.“ Gemeint sind Menschen, an die zuvor niemand gedacht hatte; der Turban ist ein Bild für Würde oder eine hohe Stellung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַבִּים נִדְכָּאִים
  choice: Viele Unterdrückte
  rationale: Bewahrt die Mehrzahl und den passiven Sinn der Wurzel ‚niedergedrückt, unterdrückt sein‘; die substantivierte Form klingt im Deutschen natürlich und passt zum sozialen Statuswechsel.
- source_word: יָשְׁבוּ עַל כִּסֵּא
  choice: saßen auf einem Thron
  rationale: כִּסֵּא kann einen Sitz oder Thron bezeichnen; im Zusammenhang der unerwarteten Erhöhung bringt ‚Thron‘ den Herrschafts- und Ehrenstatus angemessen zum Ausdruck.
- source_word: וּבַל עָלוּ עַל לֵב
  choice: und einer, an den niemand gedacht hatte
  rationale: Die wörtliche Wendung ‚nicht auf das Herz kommen‘ bezeichnet eine Person, die niemand im Sinn oder in Betracht hatte. Das unbestimmte Singularsubjekt wird wegen des folgenden Verbs im Plural sinngemäß ergänzt.
- source_word: עָטוּ צְנִיף
  choice: setzte sich einen Turban auf
  rationale: 'Die konkrete Bildsprache des Hebräischen bleibt erhalten: Das Anlegen des Turbans steht hier für Würde, Amt oder hohe Stellung, ohne diese Bedeutung abstrakt an die Stelle des Bildes zu setzen.'
theological_decisions:
- issue: Vorrang des hebräischen Geniza-Textes gegenüber der abweichenden griechischen Parallelüberlieferung
  choice: 'Der hebräische Text wird als unerwartete Erhöhung übersetzt: Unterdrückte gelangen auf einen Thron, und ein zuvor nicht bedachter Mensch legt einen Turban an.'
  alternative: 'Dem Griechischen folgen: Viele Machthaber wurden schwer entehrt, und Angesehene wurden in die Hände anderer ausgeliefert.'
  rationale: Der hebräische Text ist hier mit hoher Sicherheit bezeugt und daher primär. Die griechische Fassung hat einen deutlich anderen Wortlaut, bestätigt aber das gemeinsame Motiv einer Umkehr gesellschaftlicher Stellung.
- issue: Deutung des Turbans
  choice: Das konkrete Bild ‚Turban‘ wird im Haupttext bewahrt.
  alternative: 'Abstrakt übersetzen: ‚Ein unerwarteter Mensch gelangte zu hohen Ehren.‘'
  rationale: Der Turban kann Würde oder Amt anzeigen, doch der Vers benennt die genaue Stellung nicht ausdrücklich. Die bildhafte Übersetzung wahrt diese Offenheit.
translation_notes:
  register: Modernes, allgemein verständliches und würdiges Standarddeutsch. Die parallele Satzstruktur und die konkrete Bildsprache des Hebräischen bleiben erhalten; die schwer verständliche hebräische Redewendung wird behutsam idiomatisiert.
