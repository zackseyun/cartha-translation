translation:
  language: de
  text: Streite nicht, wo es keinen Anlass gibt,[a] und stütze die Vermessenen in ihrem Streit nicht.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort עַצָּבָה ist hier in seiner Bedeutung unsicher. Es kann unter anderem „Schmerz“, „Kummer“, „Mühe“ oder einen Anlass beziehungsweise Beschwerdegrund bezeichnen. Die Übersetzung versteht es hier als fehlenden Anlass zum Streit.
    reason: lexical_alternative
  - marker: b
    text: 'Die griechische Fassung lautet an dieser Stelle ganz anders: „Mein Kind, lass deine Tätigkeiten nicht auf vielerlei Dinge gerichtet sein. Wenn du sie vermehrst, wirst du nicht ungestraft bleiben; wenn du ihnen nachjagst, wirst du sie nicht erreichen, und auch wenn du fliehst, wirst du nicht entkommen.“ Wahrscheinlich liegt ihr eine andere hebräische Vorlage oder eine erhebliche Textabweichung zugrunde.'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּאֵין עַצָּבָה
  choice: wo es keinen Anlass gibt
  rationale: בְּאֵין bezeichnet das Fehlen von etwas. עַצָּבָה ist hier in seiner Bedeutung unsicher; im Zusammenhang mit dem Streitverbot liegt ein fehlender Anlass oder Beschwerdegrund nahe. Die Formulierung ist natürliches Deutsch, ohne die Unsicherheit zu verschweigen.
- source_word: אַל תִּתְחָר
  choice: Streite nicht
  rationale: Das Verb bezeichnet hier wahrscheinlich ein Sich-Erhitzen oder Sich-Einlassen auf Streit. „Streite nicht“ gibt die praktische Aussage im heutigen Deutsch klar wieder.
- source_word: וּבְרִיב
  choice: im Streit
  rationale: רִיב kann Streit, Auseinandersetzung oder Rechtsstreit bezeichnen. Der allgemeine Ausdruck „Streit“ passt zum sprichwortartigen Zusammenhang.
- source_word: זֵדִים
  choice: der Übermütigen
  rationale: זֵדִים bezeichnet vermessene, anmaßende oder hochmütige Menschen. „Übermütige“ bewahrt die moralische Färbung und klingt in einem Weisheitsspruch würdig.
- source_word: אַל תְּקוֹמֵם
  choice: erhebe dich nicht
  rationale: Die Wiedergabe bewahrt das Bild des hebräischen Verbs קום („aufstehen, sich erheben“). Im Zusammenhang bedeutet es, im Streit nicht aufzutreten oder Partei zu ergreifen.
theological_decisions:
- issue: Vorrang des hebräischen Textzeugen gegenüber der stark abweichenden griechischen Fassung
  choice: Der erhaltene hebräische Text bildet die Grundlage des Haupttextes; die griechische Fassung wird in einer Fußnote dokumentiert.
  alternative: 'Die griechische Fassung als Haupttext übersetzen: „Mein Kind, beschäftige dich nicht mit vielerlei Dingen …“'
  rationale: Die griechische Parallelfassung weicht in diesem Vers inhaltlich grundlegend ab und dürfte eine andere hebräische Vorlage oder eine erhebliche Textentwicklung bezeugen. Da ein belastbarer hebräischer Text erhalten ist, wird dieser übersetzt, ohne die griechische Überlieferung zu verschweigen.
translation_notes:
  register: Modernes, knappes und würdiges Standarddeutsch im Stil eines Weisheitsspruchs. Die erste Zeile ist idiomatisch formuliert; in der zweiten bleibt das hebräische Bild des Sich-Erhebens erhalten. Die textliche und lexikalische Unsicherheit wird durch Fußnoten offengelegt.
