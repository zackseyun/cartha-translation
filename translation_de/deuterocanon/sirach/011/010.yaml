  - severity: low
    issue: „Übermütigen“ ist für זֵדִים im heutigen Deutsch nicht präzise genug.
    rationale: „Übermütig“ kann positiv oder harmlos wirken. „Vermessene“ bewahrt die anmaßend-hochmütige negative Wertung des hebräischen Ausdrucks.
  - severity: low
    issue: Die griechische Variantenfußnote ist an einem einzelnen Wort verankert, obwohl sie den gesamten Vers betrifft.
    rationale: Ein Anker am Satzende macht deutlicher, dass die abweichende griechische Fassung den ganzen Vers und nicht nur „Vermessenen“ betrifft.
