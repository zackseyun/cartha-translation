  source_fidelity: 'Der Haupttext folgt zu Recht dem erhaltenen hebräischen Text und nicht der stark abweichenden griechischen Parallelfassung. Die Wendung בְּאֵין עַצָּבָה bleibt wegen der unsicheren Bedeutung von עַצָּבָה angemessen durch eine Fußnote erläutert. Für אַל תְּקוֹמֵם ist jedoch „erhebe dich nicht im Streit“ zu unbestimmt und im Deutschen missverständlich: Die Form ist am ehesten als Aufforderung zu verstehen, die Übermütigen in ihrem Streit nicht aufzurichten bzw. zu unterstützen.'
  naturalness: „Streite nicht, wo es keinen Anlass gibt“ ist natürliches modernes Standarddeutsch. „Stütze die Übermütigen in ihrem Streit nicht“ ist klarer und idiomatischer als „erhebe dich nicht im Streit der Übermütigen“, ohne den knappen Weisheitsspruchstil aufzugeben.
  terminology: „Übermütige“ kann heute auch bloß ausgelassen oder unbekümmert bedeuten und schwächt daher זֵדִים ab. „Vermessene“ gibt die anmaßend-arrogante, negativ wertende Bedeutung treffender wieder. Die Begriffe „Anlass“ und „Streit“ sind passend; die Fußnote wahrt die lexikalische Unsicherheit.
  issues:
