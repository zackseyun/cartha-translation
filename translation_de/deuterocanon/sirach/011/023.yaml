  text: Do not say, "What do I need, and what good things will be mine from now on?"[a]
translation:
  language: de
  text: 'Sag nicht: „Was brauche ich, und welche guten Dinge werden mir von nun an zuteil?“[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der erhaltene hebräische Text weicht hier stark ab: „Er wusste nicht, was danach kommen würde; er überließ es einem anderen und starb“, oder ähnlich. Die griechische Parallele bietet stattdessen die Mahnung des Haupttextes; ihr wird hier gefolgt, weil der hebräische Wortlaut an dieser Stelle möglicherweise nicht richtig zugeordnet oder beschädigt ist.'
    reason: textual_variant
lexical_decisions:
- source_word: לֹא יָדַע / μὴ εἴπῃς
  choice: Sag nicht
  rationale: Der erhaltene hebräische Text lautet „er wusste nicht“, ist an dieser Stelle jedoch offenbar verschoben oder beschädigt. Die griechische Parallele bietet mit μὴ εἴπῃς („Sag nicht“) eine im Zusammenhang stimmige Mahnung und wird daher im Haupttext wiedergegeben.
- source_word: Τίς ἐστίν μου χρεία
  choice: Was brauche ich
  rationale: χρεία bezeichnet Bedarf oder Notwendigkeit. Die gewählte Formulierung ist im modernen Deutschen natürlich und bewahrt den rhetorischen, selbstzufriedenen Ton der Frage.
- source_word: τίνα ... ἔσται μου τὰ ἀγαθά
  choice: welche guten Dinge werden mir ... zuteil
  rationale: τὰ ἀγαθά kann gute Dinge, Güter oder Wohltaten bezeichnen. „Gute Dinge“ hält die Bedeutung bewusst weit; „zuteilwerden“ gibt ἔσται μου idiomatisch wieder, ohne den Sinn auf materiellen Besitz zu verengen.
- source_word: ἀπὸ τοῦ νῦν
  choice: von nun an
  rationale: Die Wendung bezeichnet den Zeitraum ab dem gegenwärtigen Augenblick und wird in natürlichem, gehobenem Standarddeutsch wiedergegeben.
theological_decisions:
- issue: Gewichtung der Textzeugen bei der Abweichung zwischen Hebräisch und Griechisch
  choice: Der Haupttext folgt der griechischen Mahnung.
  alternative: 'Eine annähernde Wiedergabe des erhaltenen Hebräischen lautet: „Er wusste nicht, was danach kommen würde; er überließ es einem anderen und starb.“'
  rationale: Obwohl der erhaltene hebräische Text bei Jesus Sirach grundsätzlich vorrangig ist, weicht er hier stark ab und scheint nicht zur Versposition beziehungsweise zum unmittelbaren Zusammenhang zu passen. Die griechische Lesart ergibt eine kohärente Mahnung. Die Unsicherheit wird nicht verschwiegen, sondern in der Fußnote mit der hebräischen Alternative offengelegt.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem Weisheitston. Die rhetorische Frage bleibt knapp; die Formulierung „zuteilwerden“ ist leicht gehoben, aber allgemein verständlich.
