translation:
  language: de
  text: Verspotte kein abgetragenes Gewand,[a][b] und rühme dich nicht in bitteren Tagen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Verspotte keinen armseligen Menschen.“ Das Hebräische kann wörtlich ein verschlissenes oder zerlumptes Gewand bezeichnen; möglicherweise steht das Gewand sinnbildlich für seinen Träger.'
    reason: lexical_alternative
  - marker: b
    text: 'Die griechische Parallelüberlieferung lautet: „Rühme dich nicht wegen deiner Kleidung und überhebe dich nicht am Tag des Ruhmes; denn wunderbar sind die Werke des Herrn, und verborgen sind seine Werke unter den Menschen.“'
    reason: textual_variant
lexical_decisions:
- source_word: מַעֲטֶה אֹבֵד
  choice: abgetragenes Gewand
  rationale: מַעֲטֶה bezeichnet eine äußere Bedeckung oder ein Kleidungsstück; אֹבֵד bedeutet wörtlich „vergehend, zugrunde gehend“ und beschreibt hier wahrscheinlich ein verschlissenes oder zerlumptes Gewand. Die konkrete Wiedergabe bewahrt das Bild des hebräischen Textes, ohne die mögliche metonymische Bedeutung „ein armseliger Mensch“ stillschweigend festzulegen.
- source_word: אַל תְּהַתֵּל
  choice: Verspotte … nicht
  rationale: Das Verb התל bezeichnet das Verhöhnen, Täuschen oder Verspotten. „Verspotte … nicht“ ist im Deutschen natürlich und gibt die Mahnung direkt wieder.
- source_word: וְאַל תְּקַלֵּס
  choice: und rühme dich nicht
  rationale: קלס kann „loben, preisen, rühmen“ bedeuten. Der reflexive Sinn ergibt sich hier aus dem mahnenden Zusammenhang; „rühme dich nicht“ ist idiomatisch und vermeidet eine unnötige Wiederholung von „verspotten“.
- source_word: בִּמְרִירֵי יוֹם
  choice: in bitteren Tagen
  rationale: Die hebräische Wendung spricht von Bitterkeit beziehungsweise schweren Zeiten und steht im Plural. Die Übersetzung erhält diese ungewöhnliche, aber verständliche Formulierung.
theological_decisions:
- issue: Abweichung zwischen dem erhaltenen hebräischen Text und der griechischen Parallelüberlieferung
  choice: Der zweigliedrigen hebräischen Mahnung im Haupttext folgen.
  alternative: 'Griechisch: „Rühme dich nicht wegen der Pracht deiner Kleider und überhebe dich nicht am Tag des Ruhmes; denn wunderbar sind die Werke des Herrn, und verborgen sind seine Werke unter den Menschen.“'
  rationale: Der hebräische Text ist hier erhalten und als zuverlässig eingestuft. Die griechische Überlieferung weicht sowohl in beiden Mahnungen ab als auch durch einen zusätzlichen Begründungssatz. Diese echte Textvariante wird deshalb in einer Fußnote vollständig dokumentiert, aber nicht in den Haupttext eingearbeitet.
translation_notes:
  register: Moderne, würdige Standardsprache. Die knappe Zweigliedrigkeit des Hebräischen bleibt erhalten. Das konkrete Bild des abgetragenen Gewandes steht im Haupttext; die mögliche Beziehung auf einen armen Menschen wird als echte Auslegungs- und Übersetzungsalternative in der Fußnote offengehalten.
