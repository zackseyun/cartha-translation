  yaml_path: translation/deuterocanon/sirach/011/012.yaml
  text: My son[a], if you do not run, you will not attain; and if you do not seek, you will not find.
translation:
  language: de
  text: Mein Sohn[a], wenn du nicht läufst, wirst du nicht zum Ziel gelangen; und wenn du nicht suchst, wirst du nicht finden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die griechische Überlieferung weicht hier erheblich ab. Sie spricht stattdessen von einem trägen Menschen, der Hilfe braucht, wenig Kraft hat und arm ist; die Augen des Herrn blickten wohlwollend auf ihn und richteten ihn aus seiner Niedrigkeit auf. Der Haupttext folgt dem hier erhaltenen hebräischen Wortlaut.
    reason: textual_variant
lexical_decisions:
- source_word: בְּנִי
  choice: Mein Sohn
  rationale: Die Anrede ist maskulin Singular und bewahrt den für die Weisheitsunterweisung typischen Ton.
- source_word: תָּרוּץ
  choice: läufst
  rationale: Das konkrete Bild des hebräischen Verbs רוץ („laufen“) bleibt erhalten; eine abstraktere Wiedergabe wie „dich anstrengst“ wäre stärker auslegend.
- source_word: תַגִּיעַ
  choice: dein Ziel erreichen
  rationale: Das Hifil von נגע bezeichnet hier das Erreichen eines Zieles. Die Ergänzung „dein Ziel“ macht den im Deutschen erforderlichen Bezug natürlich verständlich, ohne ein bestimmtes Ziel festzulegen.
- source_word: תְּבַקֵּשׁ
  choice: suchst
  rationale: Die übliche Bedeutung von בקש erhält die sprichwörtliche Verbindung mit „finden“.
- source_word: תִמְצָא
  choice: finden
  rationale: Die Standardbedeutung von מצא entspricht unmittelbar dem parallelen Gegensatz von Suchen und Finden.
theological_decisions:
- issue: Geschlechtsspezifische Anrede in der Weisheitsunterweisung
  choice: Mein Sohn
  alternative: Mein Kind
  rationale: Der hebräische Text verwendet ausdrücklich eine maskuline Anrede im Singular; diese wird nicht neutralisiert.
- issue: Vorrang des hebräischen Textzeugen gegenüber der stark abweichenden griechischen Überlieferung
  choice: Der vorhandene hebräische Spruch wird unmittelbar übersetzt; die griechische Abweichung wird in einer Fußnote dokumentiert.
  alternative: Wiedergabe nach dem griechischen Text über einen kraftlosen Armen, den der Herr aufrichtet
  rationale: Wo ein belastbarer hebräischer Text von Jesus Sirach erhalten ist, dient er als primärer Ausgangstext. Die erhebliche griechische Abweichung bleibt als bedeutende alternative Texttradition sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper sprichwörtlicher Parallelstruktur. Das wörtliche Bild des Laufens bleibt bewahrt; „dein Ziel“ sorgt für eine natürliche deutsche Formulierung, ohne die offene Aussage inhaltlich einzuengen.
