lexical_decisions:
- source_word: אַל תִּתְמַה
  choice: Staune nicht
  rationale: Das hebräische Verb bezeichnet Erstaunen oder Bestürzung. „Staune nicht“ gibt die knappe Mahnung natürlich wieder, ohne sie einseitig als Angst oder Verwirrung auszulegen.
- source_word: בְּעוֹשֵׂי רָע
  choice: über die, die Böses tun
  rationale: Die Wendung bedeutet wörtlich „über/an denen, die Böses tun“. Die verbale Wiedergabe bleibt nah am hebräischen Partizip und klingt im modernen Deutsch natürlicher als „Übeltäter“.
- source_word: תָּרוּץ
  choice: lauf
  rationale: Das konkrete Bild und die Dringlichkeit des hebräischen Verbs „laufen“ werden bewahrt; „eile“ wäre glatter, aber weniger bildhaft.
- source_word: לַיי
  choice: zum HERRN
  rationale: Die reverenzielle Schreibung steht für den Gottesnamen. „HERR“ folgt der üblichen deutschen Wiedergabe des Tetragramms und passt zur Richtungsangabe „zum“.
- source_word: וְקַוֵּה
  choice: und warte
  rationale: Das Verb umfasst erwartungsvolles Warten und Hoffen. „Warte“ erhält die unmittelbare Handlungsfolge; der hoffende Unterton bleibt im Zusammenhang offen.
- source_word: לְאוֹרוֹ
  choice: auf sein Licht
  rationale: Die wörtliche Lichtmetapher bleibt erhalten und wird nicht vorschnell auf Hilfe, Führung oder Rettung eingeengt.
theological_decisions:
- issue: Wiedergabe des durch יי bezeichneten Gottesnamens
  choice: HERR
  alternative: JHWH; Jahwe; Herr
  rationale: Die traditionelle typografische Wiedergabe „HERR“ macht kenntlich, dass im Hebräischen der Gottesname vorausgesetzt ist, ohne eine unsichere Aussprache festzulegen.
- issue: Verhältnis des erhaltenen hebräischen Textes zur stark abweichenden griechischen Überlieferung
  choice: Der Haupttext folgt dem Hebräischen; die griechische Fassung steht in einer Fußnote.
  alternative: Die griechische Fassung als Haupttext wiedergeben oder beide Fassungen harmonisieren.
  rationale: Der erhaltene hebräische Zeuge ist hier die primäre Textgrundlage. Da die griechische Fassung einen wesentlich anderen Spruch bietet, darf die Abweichung weder verschwiegen noch durch Harmonisierung beseitigt werden.
translation_notes:
  register: Modernes, knappes und würdiges Mahnwort. „Lauf“ bewahrt bewusst die lebhafte Konkretheit des Hebräischen; „sein Licht“ erhält die offene theologische Bildsprache. Der Fußnotenmarker [a] steht unmittelbar nach der abweichenden hebräischen Aussage.
