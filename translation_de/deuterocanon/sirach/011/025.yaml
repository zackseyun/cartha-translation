  text: Do not be astonished at evildoers[a]; run to the Lord and wait for his light.
translation:
  language: de
  text: Wundere dich nicht über Menschen, die Böses tun; lauf zum HERRN und warte auf sein Licht[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Parallelüberlieferung lautet: „Am Tag des Guten gerät das Schlechte in Vergessenheit, und am Tag des Schlechten erinnert man sich nicht an das Gute.“ Der griechische Text weicht hier erheblich vom erhaltenen hebräischen Text ab.'
