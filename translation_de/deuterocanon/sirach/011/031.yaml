  text: An evil time makes pleasure be forgotten[a], and a man's end tells about him.
translation:
  language: de
  text: Eine schlimme Zeit lässt Freude vergessen[a], und das Ende eines Menschen sagt etwas über ihn aus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Parallelüberlieferung lautet: „Denn indem er Gutes in Böses verkehrt, lauert er auf, und dem, was begehrenswert ist, wird er einen Makel anheften.“ Der hebräische und der griechische Text weichen hier deutlich voneinander ab; der Haupttext folgt dem erhaltenen Hebräisch als vorrangigem Textzeugen für Jesus Sirach.'
    reason: textual_variant
lexical_decisions:
- source_word: עֵת רָעָה
  choice: eine schlimme Zeit
  rationale: עֵת bezeichnet eine Zeit oder Lage; רָעָה meint hier eher Unglück und Bedrängnis als moralische Bosheit. „Eine schlimme Zeit“ ist im modernen Deutschen natürlich und bewahrt die knappe Form des Weisheitsspruchs.
- source_word: תְּשַׁכֵּח
  choice: lässt … vergessen
  rationale: Die Hifil-Form von שכח ist kausativ. Die Formulierung erhält diese Verursachungsbedeutung, ohne ein nicht genanntes Subjekt dessen, der vergisst, einzuführen.
- source_word: תַּעֲנוּג
  choice: Freude
  rationale: Das Substantiv bezeichnet Genuss, Wohlgefühl oder Freude. „Freude“ klingt in diesem Zusammenhang natürlich und umfasst das angenehme Erleben, das in schwerer Zeit aus dem Bewusstsein schwindet.
- source_word: וְסוֹף אָדָם
  choice: und das Ende eines Menschen
  rationale: סוֹף kann Ende oder Ausgang bedeuten. אָדָם ist hier ein einzelner Mensch in einer allgemein geltenden Aussage; die deutsche Formulierung bewahrt den sprichwörtlichen Singular ohne unnötige Geschlechtsfestlegung.
- source_word: יַגִּיד עָלָיו
  choice: sagt etwas über ihn aus
  rationale: נגד im Hifil bedeutet mitteilen, kundtun oder erkennen lassen; עָלָיו heißt „über ihn“. Die Wiedergabe ist idiomatisches Deutsch und lässt offen, auf welche Weise das Ende den Menschen beurteilt oder offenbart.
theological_decisions:
- issue: Bedeutung des Endes eines Menschen
  choice: das Ende eines Menschen sagt etwas über ihn aus
  alternative: am Ende zeigt sich, wer ein Mensch wirklich ist
  rationale: Der hebräische Text sagt nicht ausdrücklich, dass das Ende das wahre Wesen vollständig enthüllt oder ein endgültiges göttliches Urteil darstellt. Die gewählte Fassung bewahrt die offene Aussage, dass der Ausgang eines Lebens über den Menschen Auskunft gibt.
- issue: Wiedergabe von אָדָם im allgemeinen Singular
  choice: eines Menschen
  alternative: eines Mannes
  rationale: אָדָם bezeichnet hier im Weisheitsspruch einen Menschen allgemein, nicht erkennbar eine männliche Person im engeren Sinn. „Mensch“ gibt diesen repräsentativen Gebrauch im heutigen Deutsch präzise wieder.
translation_notes:
  register: Knappes, würdiges und modernes Standarddeutsch. Die Satzparallelität des hebräischen Weisheitsspruchs bleibt erhalten; „sagt etwas über ihn aus“ ist bewusst idiomatisch, ohne die offene Aussage zu einer vollständigen Wesensenthüllung oder einem ausdrücklichen Gerichtsspruch zu verengen.
