base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/011/018.yaml
  text: Wisdom and understanding and the knowledge of a matter are from the Lord[a]; sin and upright ways are from the Lord.
translation:
  language: de
  text: Mancher wird durch Sorgfalt und Geiz reich; und dies ist der Anteil seines Lohnes:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die an dieser Stelle überlieferte hebräische Zeile bietet einen anderen Spruch: „Weisheit, Einsicht und eine Sache zu verstehen kommen vom HERRN; Sünde und gerade Wege kommen vom HERRN.“ Da dieser Wortlaut nicht mit dem griechischen Text von Sirach 11,18 übereinstimmt, folgt die Übersetzung im Haupttext hier der griechischen Überlieferung.'
    reason: textual_variant
lexical_decisions:
- source_word: ἔστιν πλουτῶν
  choice: Mancher wird reich
  rationale: Die griechische Partizipialkonstruktion bezeichnet jemanden, der reich wird. „Mancher“ gibt die unbestimmte, sentenzhafte Form im Deutschen natürlich wieder.
- source_word: ἀπὸ προσοχῆς
  choice: durch Sorgfalt
  rationale: προσοχή bezeichnet Aufmerksamkeit oder Sorgfalt; „durch“ gibt die ursächliche Bedeutung von ἀπό idiomatisch wieder, ohne den Ausdruck bereits negativ zu deuten.
- source_word: καὶ σφιγγίας αὐτοῦ
  choice: und Geiz
  rationale: σφιγγία bezeichnet Knauserigkeit beziehungsweise Geiz. „Geiz“ ist modern, klar und bewahrt die negative Wertung.
- source_word: καὶ αὕτη ἡ μερὶς
  choice: und dies ist der Anteil
  rationale: μερίς bedeutet Anteil oder Teil. „Anteil“ erhält das Bild dessen, was jemand als Ergebnis zugeteilt bekommt.
- source_word: τοῦ μισθοῦ αὐτοῦ
  choice: seines Lohnes
  rationale: μισθός kann Lohn oder Belohnung bedeuten. „Lohn“ bewahrt hier die offene Bedeutung dessen, was ihm aus seinem Verhalten erwächst.
theological_decisions:
- issue: Zuordnung der voneinander abweichenden hebräischen und griechischen Überlieferung
  choice: Der Haupttext folgt für Sirach 11,18 dem griechischen Paralleltext; die abweichende hebräische Zeile wird in einer Fußnote vollständig dokumentiert.
  alternative: 'Die gelieferte hebräische Zeile als Haupttext übersetzen: „Weisheit, Einsicht und eine Sache zu verstehen kommen vom HERRN; Sünde und gerade Wege kommen vom HERRN.“'
  rationale: Die gelieferte hebräische Zeile entspricht inhaltlich nicht dem griechisch überlieferten Sirach 11,18 und dürfte an dieser Stelle einen anderen Spruch repräsentieren. Der griechische Text bietet den im Verszusammenhang kohärenten Wortlaut; die Abweichung wird nicht verschwiegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch in knapper weisheitlicher Form. Der Doppelpunkt am Versende wahrt den Anschluss an den folgenden Vers. Der Gottesname erscheint nur in der Fußnote als „HERR“, entsprechend מיי als Ersatzschreibung für den Gottesnamen.
