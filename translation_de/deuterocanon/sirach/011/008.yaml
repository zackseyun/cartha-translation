  text: Before you investigate[a], do not find fault; examine first[b], and afterward rebuke.
translation:
  language: de
  text: Bevor du nachgeforscht hast, urteile nicht vorschnell[a]; prüfe zuerst, und weise erst danach zurecht.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das mit „urteile nicht vorschnell“ wiedergegebene hebräische Verb kann wörtlicher „verdrehe nichts“ oder „verfälsche nichts“ bedeuten.
    reason: lexical_alternative
  - marker: b
    text: 'Der hebräische Wortlaut am Versende ist schwierig. Die griechische Überlieferung lautet abweichend: „Bevor du gehört hast, antworte nicht, und falle nicht mitten in eine Rede hinein.“'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּטֶרֶם תַּחְקוֹר
  choice: Bevor du nachgeforscht hast
  rationale: חקר bezeichnet gründliches Erforschen oder Prüfen. Die Konstruktion mit בְּטֶרֶם setzt dies zeitlich vor das Urteilen; das deutsche Perfekt gibt den Abschluss der nötigen Prüfung natürlich wieder.
- source_word: אַל תְּסַלֵּף
  choice: urteile nicht vorschnell
  rationale: סלף bedeutet wörtlich eher „verdrehen, verfälschen“. Ohne ausdrückliches Objekt und im Zusammenhang der Mahnung gegen ein Urteil vor der Untersuchung gibt die gewählte Formulierung den wahrscheinlichen praktischen Sinn verständlich wieder; die wörtlichere Möglichkeit bleibt in der Fußnote erhalten.
- source_word: בַּקֵּר לְפָנִים
  choice: prüfe zuerst
  rationale: בקר fordert hier zum Prüfen oder Untersuchen auf, während לְפָנִים die zeitliche Reihenfolge hervorhebt. „Prüfe zuerst“ ist knapp und idiomatisch.
- source_word: וְאַחַר תַּזִּיף
  choice: und weise erst danach zurecht
  rationale: Die Schlussform תַּזִּיף ist textlich und lexikalisch schwierig. Im hebräischen Satzablauf liegt eine erst nach erfolgter Prüfung zulässige kritische Reaktion nahe. „Zurechtweisen“ wahrt diesen mahnenden Sinn, ohne die abweichende griechische Überlieferung zu verschweigen.
