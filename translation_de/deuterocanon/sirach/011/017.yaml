  text: Good and evil[a], life and death[c][b], poverty and wealth—they are from him.
translation:
  language: de
  text: Gutes und Böses[a], Leben und Tod[b], Armut und Reichtum – sie kommen von ihm.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Gutes und Unheil« beziehungsweise »Gutes und Unglück«. Das hebräische Wort רַע kann sowohl Böses im weiteren Sinn als auch Unheil oder Widriges bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Die griechische Parallelüberlieferung weicht hier erheblich ab: »Die Gabe des Herrn bleibt bei den Frommen, und sein Wohlgefallen wird für immer Erfolg haben.« Hebräischer und griechischer Text stimmen an dieser Stelle nicht eng überein.'
    reason: textual_variant
  - marker: c
    text: 'Wörtlich: »von ihm«. Gemeint ist im Zusammenhang wahrscheinlich Gott; in dieser hebräischen Zeile wird er jedoch nicht ausdrücklich genannt.'
    reason: alternative_reading
lexical_decisions:
- source_word: טוֹב
  choice: Gutes
  rationale: Die substantivierte Form gibt den umfassenden Sinn des hebräischen Begriffs wieder und passt zur Reihe gegensätzlicher Größen.
- source_word: וְרַע
  choice: und Böses
  rationale: Die breite Bedeutung von רַע bleibt erhalten; der Begriff kann je nach Zusammenhang auch Unheil oder Unglück bezeichnen.
- source_word: חַיִּים
  choice: Leben
  rationale: Die geläufige deutsche Wiedergabe des abstrakten hebräischen Plurals im Gegensatz zu Tod.
- source_word: וָמָוֶת
  choice: und Tod
  rationale: Direkte und natürliche Wiedergabe des Gegenbegriffs zu Leben.
- source_word: רֵישׁ
  choice: Armut
  rationale: Der Ausdruck bezeichnet Armut oder Mangel; »Armut« bildet im Deutschen den klaren Gegenpol zu Reichtum.
- source_word: וְעֹשֶׁר
  choice: und Reichtum
  rationale: Eine natürliche moderne Wiedergabe des materiellen Wohlstands im Gegensatz zu Armut.
- source_word: מֵיי הוּא
  choice: sie kommen von ihm
  rationale: Die idiomatische Formulierung bewahrt das nicht ausdrücklich benannte männliche Bezugswort des Hebräischen, statt »Gott« oder »der Herr« einzusetzen.
theological_decisions:
- issue: Bezugswort des abschließenden Pronomens
  choice: von ihm
  alternative: vom Herrn / von Gott
  rationale: Der hebräische Text nennt an dieser Stelle keinen Gottesnamen, auch wenn der Zusammenhang wahrscheinlich auf Gott verweist. Das Pronomen bewahrt diese sprachliche Zurückhaltung.
- issue: Bedeutungsumfang von רַע angesichts seines Ursprungs »von ihm«
  choice: Böses
  alternative: Unheil / Unglück / Widriges
  rationale: רַע ist weiter als bloßes Unglück und steht hier als Gegenbegriff zu Gutem. Die Übersetzung erhält die theologische Spannung; eine Fußnote nennt die mögliche erfahrungsbezogene Bedeutung.
- issue: Stark abweichende griechische Überlieferung
  choice: Dem hebräischen Text folgen
  alternative: »Die Gabe des Herrn bleibt bei den Frommen, und sein Wohlgefallen wird für immer Gelingen schenken.«
  rationale: Der vorgelegte hebräische Zeuge ist für diesen Entwurf die primäre Textgrundlage. Die erhebliche Abweichung der griechischen Parallelüberlieferung wird transparent in einer Fußnote dokumentiert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Reihung der drei Gegensatzpaare bleibt erhalten. »Sie kommen von ihm« klingt natürlicher als »sie sind von ihm«, ohne das unbestimmte Pronomen aufzulösen.
