  terminology: „Mann“ gibt die beiden maskulinen hebräischen Personenbezeichnungen formnah wieder. „Glücklich“ vermeidet eine unnötig theologisch festgelegte Wiedergabe von אשר. Die Fußnoten müssen jedoch die überarbeiteten Formulierungen sauber erläutern; insbesondere ist „wird ein Mann kenntlich“ kein natürliches deutsches Alternativverständnis.
