  text: Before death, do not call a man blessed, for in his end a man is made known.
translation:
  language: de
  text: Vor dem Tod[a] erkläre keinen Mann für glücklich,[b] denn an seinem Ende wird ein Mann erkannt.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Parallelüberlieferung lautet deutlich anders: „Hüte dich vor einem Übeltäter; denn er sinnt auf Böses, damit er dir nicht für immer einen Makel zufügt.“ Vermutlich liegt ihr eine andere Textgestalt zugrunde; hier wird dem hebräischen Text als Hauptzeugen gefolgt.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „Halte keinen Mann für glücklich“ beziehungsweise „für vom Glück begünstigt“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „an seinem Ende wird ein Mann erkannt“ im Sinn von „wird offenbar“ oder „zeigt sich, wer er ist“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִפְנֵי מָוֶת
  choice: Vor dem Tod
  rationale: Die knappe Zeitangabe gibt die hebräische Wendung unmittelbar wieder und warnt davor, vor dem Lebensende ein abschließendes Urteil zu fällen.
- source_word: אַל תְּאַשֶּׁר
  choice: preise … nicht glücklich
  rationale: Das Verb bezeichnet hier das Glücklich- oder Seligpreisen. Die gewählte Form bewahrt den wertenden Charakter, ohne einen besonderen theologischen Seligkeitsbegriff einzutragen.
- source_word: גָּבֶר
  choice: keinen Mann
  rationale: Das grammatisch maskuline Singularwort wird entsprechend der hebräischen Weisheitssprache wiedergegeben; der Spruch ist dabei allgemein anwendbar.
- source_word: בְּאַחֲרִיתוֹ
  choice: an seinem Ende
  rationale: אַחֲרִית kann das zeitliche Ende wie auch den endgültigen Ausgang bezeichnen. Die knappe Wiedergabe hält beide Nuancen offen.
- source_word: יִנָּכֵר
  choice: wird … erkannt
  rationale: Die passive Form bewahrt den möglichen Sinn des Erkannt- oder Offenbarwerdens, ohne ausdrücklich festzulegen, ob Charakter, Lebensführung oder endgültiges Geschick gemeint ist.
- source_word: אִישׁ
  choice: ein Mann
  rationale: Die Wiederholung eines maskulinen Personenwortes erhält den Parallelismus des hebräischen Textes.
theological_decisions:
- issue: Generisches Maskulinum in der hebräischen Weisheitssprache
  choice: „Mann“ in beiden Satzhälften beibehalten
  alternative: „Mensch“, „jemand“ oder „niemand“
  rationale: גָּבֶר und אִישׁ sind maskuline Personenbezeichnungen. Die Wiedergabe wahrt die Form des Ausgangstextes, ohne die allgemeine Geltung des Spruches einzuschränken.
- issue: Aussage der Schlussklausel
  choice: „an seinem Ende wird ein Mann erkannt“
  alternative: „am Ende seines Lebens zeigt sich, was für ein Mensch er ist“
  rationale: Die gewählte Fassung erhält die Kürze und Mehrdeutigkeit des Hebräischen. Sie deutet nicht aus, woran oder in welcher Hinsicht der Mann erkannt wird.
- issue: Stark abweichende griechische Parallelüberlieferung
  choice: Dem erhaltenen hebräischen Text folgen und die griechische Lesart in einer Fußnote dokumentieren
  alternative: Die griechische Fassung in den Haupttext aufnehmen
  rationale: Für Sirach ist der erhaltene hebräische Zeuge hier die primäre Grundlage. Die griechische Fassung scheint eine andere Textgestalt zu bezeugen und darf deshalb nicht stillschweigend mit dem Hebräischen harmonisiert werden.
translation_notes:
  register: Knapper, würdevoller Spruchstil in modernem Standarddeutsch. „Glücklich preisen“ nimmt bewusst die Sprache der Weisheitstradition auf, bleibt aber allgemein verständlich. Die etwas markante Passivform im zweiten Halbvers bewahrt die Offenheit und Parallelität des Hebräischen.
