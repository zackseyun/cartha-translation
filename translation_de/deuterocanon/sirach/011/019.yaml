  terminology: „Torheit“, „Finsternis“, „Frevler“ und „Böses“ sind für den Weisheitskontext treffend. „Frevler“ ist gehoben, jedoch weiterhin verständlich und dem Register angemessen. Die Fußnote kennzeichnet die erhebliche Abweichung der griechischen Überlieferung klar; ihr Anker ist korrekt gesetzt.
