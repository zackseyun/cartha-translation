lexical_decisions:
- source_word: שִׂכְלוּת
  choice: Torheit
  rationale: Bezeichnet törichtes, vernunftloses Verhalten oder einen entsprechenden Zustand. „Torheit“ ist im Deutschen natürlich, knapp und bewahrt den moralischen Klang der Weisheitsliteratur.
- source_word: וְחֹשֶׁךְ
  choice: und Finsternis
  rationale: Bewahrt das hebräische Bild und dessen mögliche moralische wie unheilvolle Bedeutung, ohne es auf bloße Unwissenheit oder Unglück festzulegen.
- source_word: לְפוֹשְׁעִים
  choice: den Frevlern
  rationale: פשע bezeichnet vorsätzliche Übertretung beziehungsweise Auflehnung. „Frevler“ gibt diesen bewussten moralischen Verstoß in einem würdigen, verständlichen Weisheitsregister wieder.
- source_word: נוֹצְרָה
  choice: sind … aufbewahrt
  rationale: Die Form bezeichnet hier ein Bewahren oder Bereithalten. Der deutsche Plural richtet sich natürlich nach dem zusammengesetzten Subjekt „Torheit und Finsternis“.
- source_word: וּמְרֵעִים
  choice: wer Böses tut
  rationale: Die partizipiale Form wird transparent und verbal wiedergegeben, ohne sie stärker als feste Wesensbezeichnung zu formulieren.
- source_word: רָעָה
  choice: Böses
  rationale: Das Wort kann moralisches Böse, Schaden oder Unheil bezeichnen. „Böses“ erhält die Wortbeziehung zu „Böses tut“ und lässt die moralisch-unheilvolle Mehrdeutigkeit bestehen.
- source_word: עִמָּם
  choice: mit sich
  rationale: Gibt die Grundbedeutung „mit ihnen“ in idiomatischem Deutsch wieder und vermittelt, dass das Böse diese Menschen begleitet beziehungsweise an ihnen haftet.
theological_decisions:
- issue: Starke Abweichung zwischen dem erhaltenen hebräischen Text und der griechischen Überlieferung
  choice: Der erhaltene hebräische Text steht im Haupttext; die stark abweichende griechische Fassung erscheint in der Fußnote.
  alternative: 'Die griechische Fassung als Haupttext übersetzen: „Wenn er sagt: ‚Ich habe Ruhe gefunden, und nun werde ich von meinen Gütern essen‘, weiß er nicht, wie viel Zeit vergehen wird; er wird sie anderen hinterlassen und sterben.“'
  rationale: Da ein hochgradig verlässlicher hebräischer Zeuge vorliegt, erhält er als ursprüngliche Sprachquelle Vorrang. Die griechische Überlieferung darf wegen ihrer erheblichen Abweichung jedoch nicht verschwiegen werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit der knappen, sentenzartigen Form der hebräischen Weisheitsliteratur. Die Wiederholung von „Böses“ bewahrt das hebräische Wortspiel und seine Mehrdeutigkeit.
