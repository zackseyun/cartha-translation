translation:
  language: de
  text: Torheit und Finsternis sind den Frevlern vorbehalten[a], und bei denen, die Böses tun, ist Böses.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Parallelüberlieferung lautet: „Wenn er sagt: ‚Ich habe Ruhe gefunden, und nun werde ich von meinen Gütern essen‘, weiß er nicht, welche Zeit vergehen wird; er wird sie anderen hinterlassen und sterben.“ Der hebräische Textzeuge weicht hier stark von der griechischen Überlieferung ab.'
