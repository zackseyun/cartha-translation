  source_fidelity: 'Der Hauptsatz folgt dem erhaltenen hebräischen Text angemessen: שִׂכְלוּת und חֹשֶׁךְ werden als „Torheit und Finsternis“ wiedergegeben, לְפוֹשְׁעִים als „den Frevlern“, und die Wiederholung von רע in „Böses tun / Böses“ bleibt erhalten. Die Wendung „trägt Böses mit sich“ fügt jedoch gegenüber רָעָה עִמָּם eine spezifische Bedeutungsnuance („tragen“) hinzu. Eine Wiedergabe mit „ist bei ihnen“ erhält die knappe, mehrdeutige Aussage des Hebräischen genauer.'
