  text: Er hob ihn empor und erhöhte ihn[a][b], und viele staunten über ihn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch wörtlich etwa: »Er hob ihn auf seinem Haupt.« Gemeint ist wahrscheinlich, dass er ihn nach oben oder in eine hohe Stellung erhob.'
    reason: lexical_alternative
  - marker: b
