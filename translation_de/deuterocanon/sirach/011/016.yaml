    reason: textual_variant
lexical_decisions:
- source_word: נָשָׂא בְּרֹאשׁוֹ
  choice: hob ihn empor
  rationale: נשׂא bezeichnet ein Heben oder Tragen. Die ungewöhnliche Verbindung mit בְּרֹאשׁוֹ (wörtlich etwa »an/auf seinem Haupt«) drückt hier wahrscheinlich eine Erhebung nach oben beziehungsweise in eine hohe Stellung aus. »Hob ihn empor« gibt diese Bewegung natürlich wieder, ohne die schwer deutbare Wendung zu stark festzulegen.
- source_word: וַיְרֹמְמֵהוּ
  choice: und erhöhte ihn
  rationale: רומם bedeutet »hoch machen, erhöhen, erheben«. »Erhöhte ihn« wahrt den poetischen Parallelismus und lässt sowohl räumliche als auch rangmäßige Erhöhung anklingen.
- source_word: וַיִּתְמְהוּ
  choice: staunten
  rationale: תמה bezeichnet Verwunderung oder Erstaunen. »Staunten« ist im modernen Standarddeutsch klar, kräftig und idiomatisch.
- source_word: עָלָיו
  choice: über ihn
  rationale: על bezeichnet bei einem Verb des Staunens den Anlass oder Gegenstand der Verwunderung; »über ihn« ist dafür die natürliche deutsche Fügung.
- source_word: רַבִּים
  choice: viele
  rationale: Die knappe substantivische Wiedergabe entspricht dem unbestimmten hebräischen Plural und benötigt keinen ergänzten Personenbegriff.
theological_decisions:
- issue: Das Subjekt der Verben ist im hebräischen Vers nicht ausdrücklich genannt.
  choice: Das grammatisch erforderliche Pronomen »Er« wird verwendet, ohne den Handelnden näher zu bestimmen.
  alternative: Den Handelnden ausdrücklich als Gott, den Herrn, einen Herrscher oder eine andere Person identifizieren.
  rationale: Die hebräischen Verbformen zeigen lediglich ein maskulines Subjekt im Singular. Eine ausdrückliche Identifikation würde eine im Text selbst offenbleibende Beziehung theologisch oder erzählerisch festlegen.
- issue: Art der Erhöhung
  choice: Die parallelen Ausdrücke »emporheben« und »erhöhen« lassen körperliche und gesellschaftliche Erhebung nebeneinander anklingen.
  alternative: Die Aussage ausschließlich als Beförderung zum höchsten Rang oder ausschließlich als körperliches Hochheben deuten.
  rationale: Die seltene Formulierung בְּרֹאשׁוֹ ist nicht eindeutig; die Übersetzung bewahrt diese Spannung, statt nur eine Deutung in den Haupttext einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper poetischer Parallelstruktur. »Empor« ist leicht gehoben, aber allgemein verständlich und passt zur Weisheitsdichtung. Die Pronomen bleiben bewusst ohne ausdrücklich genannten Bezug.
