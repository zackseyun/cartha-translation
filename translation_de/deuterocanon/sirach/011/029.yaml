  text: Do not say[a], “I have enough before me; what disaster will come upon me?”
translation:
  language: de
  text: 'Sag nicht[a]: »Ich habe genug vor mir; welches Unglück wird über mich kommen?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Text lautet: »Bring nicht jeden Menschen in dein Haus; denn zahlreich sind die Hinterhalte des Arglistigen.« Er bietet damit eine wesentlich andere Fassung dieses Verses.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תֹּאמַר
  choice: Sag nicht
  rationale: Der negative Imperativ von אמר wird direkt und in natürlichem modernem Deutsch wiedergegeben.
- source_word: דַּיִּי
  choice: Ich habe genug
  rationale: די bezeichnet Genüge oder ausreichenden Vorrat; die Form mit Suffix wird idiomatisch als »Ich habe genug« wiedergegeben.
- source_word: לְפָנַי
  choice: vor mir
  rationale: Die räumliche Bildsprache des Hebräischen bleibt erhalten und bezeichnet das, was gegenwärtig bereitliegt oder verfügbar ist.
- source_word: מַה אָסוֹן
  choice: welches Unglück
  rationale: אָסוֹן bezeichnet schweres Unheil oder Unglück; »Unglück« ist würdig, verständlich und weniger modern-technisch als »Katastrophe«.
- source_word: יְהִי עָלָי
  choice: wird über mich kommen
  rationale: Die Wiedergabe bewahrt den Zukunftsbezug des hebräischen Imperfekts und das Bild von etwas, das über jemanden kommt, ohne zusätzliche modale Abschwächung.
- source_word: Μὴ πάντα ἄνθρωπον εἴσαγε εἰς τὸν οἶκόν σου· πολλὰ γὰρ τὰ ἔνεδρα τοῦ δολίου
  choice: nicht in den Haupttext aufgenommen
  rationale: Die griechische Überlieferung bietet eine wesentlich andere Textform, die nicht mit dem erhaltenen hebräischen Wortlaut harmonisiert werden sollte; sie wird deshalb als alternative Lesart in der Fußnote dokumentiert.
theological_decisions:
- issue: Stark voneinander abweichende hebräische und griechische Fassungen von Sirach 11,29
  choice: Der erhaltene hebräische Text steht im Haupttext; die griechische Fassung erscheint in einer Fußnote.
  alternative: 'Die griechische Fassung als Haupttext: »Bring nicht jeden Menschen in dein Haus; denn zahlreich sind die Hinterhalte des Arglistigen.«'
  rationale: Da der hebräische Text hier mit hoher Sicherheit erhalten ist, bildet er die Übersetzungsgrundlage. Die erheblich abweichende griechische Überlieferung ist jedoch textkritisch bedeutsam und wird transparent ausgewiesen, ohne beide Fassungen miteinander zu vermischen.
translation_notes:
  register: Modernes, klares und würdiges Standarddeutsch. Die wörtliche Bildsprache »vor mir« und »über mich kommen« wurde beibehalten, weil sie im Deutschen verständlich ist und die selbstsichere Haltung der Aussage erkennen lässt.
