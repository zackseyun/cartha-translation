base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/011/021.yaml
  text: There is one who grows rich through affliction[b][a], and this is the reward he deserves.
translation:
  language: de
  text: Mancher wird durch Entbehrung reich[a], und das ist der Lohn, der ihm zusteht.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »durch Selbstverleugnung«, »durch Leiden« oder »durch Mühe«. Das Hebräische umfasst sowohl auferlegte Not als auch Selbstkasteiung; der griechische Paralleltext weist auf Mühe und Armut.'
    reason: lexical_alternative
  - marker: b
    text: 'Der hebräische Wortlaut ist schwierig; annähernd: »und dies wird seinen Lohn verpflichten/haftbar machen«. Möglich ist auch: »und das ist der Lohn, den er verdient«.'
    reason: alternative_reading
lexical_decisions:
- source_word: יֵשׁ
  choice: Mancher
  rationale: Die Existenzpartikel führt sprichwortartig einen möglichen Menschentyp ein; „Mancher“ ist dafür im Deutschen natürlich und knapp.
- source_word: מִתְעַשּׁר
  choice: wird reich
  rationale: Das Hitpael-Partizip bezeichnet den Vorgang des Reichwerdens, nicht nur einen bestehenden Wohlstand.
- source_word: מֵהִתְעַנּוֹת
  choice: durch Entbehrung
  rationale: Die Form kann Bedrängnis, Leiden oder Selbstkasteiung bezeichnen. „Entbehrung“ hält offen, ob die Not freiwillig oder auferlegt ist, und passt zugleich zum griechischen Motiv von Mühe und Armut.
- source_word: וְזֶה
  choice: und das
  rationale: Das Demonstrativum verweist unmittelbar auf das zuvor beschriebene Reichwerden durch Entbehrung.
- source_word: יְחַיֵּב שְׂכָרוֹ
  choice: das ist der Lohn, der ihm zusteht
  rationale: Die schwierige Wendung verbindet ein Verb des Verpflichtens beziehungsweise Haftbarmachens mit „Lohn“. Die Wiedergabe wahrt den wahrscheinlichen Gedanken eines geschuldeten oder gebührenden Lohnes, ohne den hebräischen Satzbau künstlich nachzubilden.
theological_decisions:
- issue: Verhältnis von Entbehrung, Reichtum und Vergeltung
  choice: Der durch Entbehrung erlangte Reichtum wird als ihm zustehender Lohn bezeichnet.
  alternative: 'Der Betreffende verdient seinen Lohn; oder: Der Reichtum ist sein Lohn für Mühe beziehungsweise Selbstverleugnung.'
  rationale: Der hebräische Schluss ist knapp und sprachlich schwierig. „Zusteht“ bringt den Vergeltungsaspekt zum Ausdruck, ohne eine umfassende Verdienstlehre einzutragen; die Fußnoten bewahren die lexikalische und syntaktische Unsicherheit.
translation_notes:
  register: Moderne, würdevolle Weisheitssprache. „Mancher“ erhält die sentenzartige Kürze; „Entbehrung“ vermeidet eine vorschnelle Festlegung auf Askese oder unfreiwilliges Leiden. Beide Fußnotenmarker stehen an den jeweils betroffenen Formulierungen.
