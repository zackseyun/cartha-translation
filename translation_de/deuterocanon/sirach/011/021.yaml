  source_fidelity: 'Die Übersetzung gibt die hebräische Sentenz insgesamt treffend wieder: יֵשׁ wird mit dem sprichwortartigen „Mancher“ natürlich erfasst, מִתְעַשּׁר als Vorgang mit „wird ... reich“, und מֵהִתְעַנּוֹת bewusst weit mit „durch Entbehrung“. Die schwierige Schlussfügung יְחַיֵּב שְׂכָרוֹ wird idiomatisch als zustehender Lohn wiedergegeben, ohne die syntaktische Schwierigkeit zu verschleiern. Die Fußnote hält die Unsicherheit angemessen fest. Der griechische Paralleltext wird lediglich als Orientierung für Mühe/Armut herangezogen, nicht zur Verdrängung des hebräischen Wortlauts.'
  naturalness: „Mancher wird durch Entbehrung reich“ ist modernes, gut verständliches und zugleich sentenzhaftes Deutsch. „Der Lohn, der ihm zusteht“ ist idiomatisch und wahrt gegenüber „den er verdient“ eine etwas zurückhaltendere, dem schwierigen Hebräisch angemessene Formulierung.
  terminology: „Entbehrung“ ist eine gute offene Wahl, da es weder auf freiwillige Askese noch auf erlittene Not festlegt. „Lohn“ ist für שכר passend und im Weisheitsregister unmarkiert. Die Alternativen in Fußnote a und die Erklärung der problematischen Schlussklausel in Fußnote b sind sachlich und korrekt verankert.
