  text: There is[a] one who labors and toils and hurries, yet all the more he comes up short.
translation:
  language: de
  text: Es gibt einen, der sich abmüht, sich plagt und hastet, und doch kommt er umso mehr zu kurz.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die hier vorgelegte hebräische Zeile aus den Kairoer Geniza-Handschriften stimmt nicht mit dem griechischen Paralleltext dieses Verses überein; der Haupttext folgt daher dem griechischen Zeugen. Die hebräische Zeile lautet ungefähr: „Mein Sohn, warum mehrst du deine Unterdrückung? … Wer sie mehrt, wird nicht ungestraft bleiben.“'
    reason: textual_variant
lexical_decisions:
- source_word: ἔστιν
  choice: Da ist einer
  rationale: Die griechische Existenzformel führt einen bestimmten Menschentyp ein; „Da ist einer“ klingt im Deutschen natürlich und wahrt diese Funktion.
- source_word: κοπιῶν
  choice: der sich abmüht
  rationale: Die Form bezeichnet anstrengende, ermüdende Arbeit. Die reflexive Wendung gibt die intensive Mühe idiomatisch wieder.
- source_word: πονῶν
  choice: sich plagt
  rationale: Die Übersetzung hält den zweiten Ausdruck für mühevolle, schmerzhafte Anstrengung vom ersten unterscheidbar und bewahrt die Häufung.
- source_word: σπεύδων
  choice: hastet
  rationale: Im Zusammenhang gesteigerter Anstrengung liegt die Bedeutung „eilen, hasten“ näher als die ebenfalls mögliche Nuance des Eifers.
- source_word: τόσῳ μᾶλλον
  choice: umso mehr
  rationale: 'Die vergleichende Wendung bezeichnet die paradoxe Steigerung: Je größer die Anstrengung, desto größer der Rückstand.'
- source_word: ὑστερεῖται
  choice: gerät ins Hintertreffen
  rationale: Die Wendung lässt offen, ob es sich um Mangel, Rückstand oder Erfolglosigkeit handelt, und legt den Bereich des Defizits nicht unnötig fest.
theological_decisions:
- issue: Abweichung zwischen der vorgelegten hebräischen Zeile und dem griechischen Parallelzeugen
  choice: Der Haupttext folgt dem inhaltlich zusammenhängenden griechischen Vers und kennzeichnet die Textabweichung in einer Fußnote.
  alternative: „Mein Sohn, warum mehrst du deine Unterdrückung? Wer sie mehrt, wird nicht ungestraft bleiben.“
  rationale: Die vorgelegte hebräische Zeile entspricht nicht dem griechisch überlieferten Sirach 11,11 und scheint aus einem anderen Zusammenhang zu stammen. Da die Überlieferung ausdrücklich als geringfügig abweichend markiert ist, wird der kohärente griechische Zeuge übersetzt, ohne die hebräische Lesart zu verschweigen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die dreifache Reihung der Tätigkeiten bleibt erhalten; die Schlusswendung wahrt die Offenheit des griechischen Verbs hinsichtlich der Art des Mangels oder Rückstands.
