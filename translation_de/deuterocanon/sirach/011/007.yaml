base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/011/007.yaml
  text: Many who were exalted have been greatly disgraced[a], and brought low together; even the honored have been given into another's hand.
translation:
  language: de
  text: Viele Hochgestellte wurden zutiefst entehrt und alle erniedrigt; selbst Angesehene wurden in fremde Hand gegeben.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Überlieferung lautet hier wesentlich anders: „Bevor du eine Sache geprüft hast, tadle nicht; verschaffe dir zuerst Einsicht, und dann weise zurecht.“ Die Übersetzung folgt dem erhaltenen hebräischen Text.'
    reason: alternative_reading
lexical_decisions:
- source_word: רַבִּים נִשָּׂאִים
  choice: Viele Hochgestellte
  rationale: נִשָּׂאִים bezeichnet hier Menschen von hohem Rang oder Ansehen, nicht ein buchstäbliches Emporheben. „Hochgestellte“ gibt den sozialen Status knapp und idiomatisch wieder.
- source_word: נִקְלוּ מְאֹד
  choice: wurden zutiefst entehrt
  rationale: Das Verb bezeichnet den Verlust von Ehre beziehungsweise das Geringschätzigwerden; מְאֹד verstärkt dies. „Zutiefst entehrt“ bringt den scharfen Statusumschwung natürlich zum Ausdruck.
- source_word: וְהִשְׁפִּילוּ יַחַד
  choice: und sanken allesamt herab
  rationale: Die überlieferte Form ist aktiv und kann hier intransitiv das Herabsinken beziehungsweise Niedrigwerden ausdrücken. „Allesamt“ gibt יַחַד kollektiv wieder, ohne eine Gleichzeitigkeit stärker zu behaupten, als der Text verlangt.
- source_word: וְגַם נִכְבָּדִים
  choice: selbst Angesehene
  rationale: נִכְבָּדִים sind Menschen, denen gesellschaftliche Ehre oder Gewicht zukommt. „Selbst“ bewahrt die steigernde Kraft von וְגַם.
- source_word: נִתְּנוּ בְיָד
  choice: wurden in die Hand anderer gegeben
  rationale: Die Wendung bezeichnet die Übergabe in fremde Macht oder Verfügungsgewalt. Die deutsche Form bewahrt das hebräische Bild und macht den im Kontext vorausgesetzten fremden Machthaber zurückhaltend ausdrücklich.
theological_decisions:
- issue: Der erhaltene hebräische Text und die griechische Überlieferung bieten grundverschiedene Fassungen.
  choice: Der Haupttext folgt dem erhaltenen hebräischen Zeugen und gibt den Umschwung von hohem Ansehen zu Erniedrigung und Abhängigkeit wieder.
  alternative: 'Nach dem Griechischen: „Bevor du eine Sache geprüft hast, tadle nicht; verschaffe dir zuerst Einsicht, und dann weise zurecht.“'
  rationale: Wo ein hebräischer Sirach-Text erhalten ist, hat er für die Übersetzung Vorrang. Die griechische Fassung ist hier keine geringfügige Variante, sondern ein wesentlich anderer Spruch und wird deshalb in einer Fußnote dokumentiert, ohne den hebräischen Haupttext zu verdrängen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Hochgestellte“ und „Angesehene“ unterscheiden die beiden Statusbezeichnungen, während „in die Hand anderer gegeben“ das hebräische Machtbild erhält. Der rhythmische Parallelismus und die scharfe Umkehrung des gesellschaftlichen Ranges bleiben gewahrt.
