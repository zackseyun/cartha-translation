  naturalness: „Viele Hochgestellte“ und „selbst Angesehene“ sind idiomatisch und dem würdevollen Weisheitsspruch angemessen. „wurden alle erniedrigt“ ist natürlicher und zugleich näher an der hebräischen Aussage als „sanken allesamt herab“.
  terminology: Die Statusbegriffe sind gut differenziert. „In fremde Hand gegeben“ bewahrt das hebräische Machtbild בְּיָד in einer im Deutschen festen und natürlichen Wendung, ohne einen nicht genannten Akteur oder Besitzer der Hand zu spezifizieren.
