  register: Moderne, klare und zugleich würdige Weisheitsrede. Die Satzstruktur bleibt eng am hebräischen Parallelismus; „mitten in einem Gespräch“ bewahrt die Offenheit von שִׂיחָה und vermeidet eine nicht ausdrücklich vorhandene Präzisierung.
