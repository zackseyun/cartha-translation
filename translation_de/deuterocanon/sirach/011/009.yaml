  text: My son[a], do not answer a matter before you hear it, and do not speak in the midst of conversation.
translation:
  language: de
  text: Mein Sohn[a], antworte nicht auf eine Sache, bevor du sie angehört hast, und sprich nicht mitten in einem Gespräch.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Text lautet: „Streite nicht über eine Sache, die dich nichts angeht, und nimm nicht an einem Gericht über Sünder teil.“ Der erhaltene hebräische und der griechische Text unterscheiden sich hier erheblich. Der Haupttext folgt dem erhaltenen hebräischen Zeugen; die griechische Fassung wird als abweichende Textüberlieferung wiedergegeben.'
    reason: textual_variant
lexical_decisions:
- source_word: בְּנִי
  choice: Mein Sohn
  rationale: Die hebräische Anrede ist ausdrücklich maskulin Singular und bezeichnet im Weisheitsunterricht den angesprochenen Schüler; die geschlechtsspezifische Form bleibt erhalten.
- source_word: אַל תָּשִׁיב דָּבָר
  choice: antworte nicht
  rationale: השיב bedeutet hier „antworten/erwidern“. דָּבָר wird zusammen mit dem folgenden Objektsbezug natürlich durch „die Sache“ wiedergegeben, ohne die Bedeutung auf ein bloßes Wort zu verengen.
- source_word: טֶרֶם תִּשְׁמָע
  choice: bevor du die Sache gehört hast
  rationale: טֶרֶם bezeichnet Vorzeitigkeit, שמע schlicht das Hören. Das Perfekt im deutschen Nebensatz drückt aus, dass man eine Sache erst vollständig anhören soll.
- source_word: וּבְתוֹךְ שִׂיחָה
  choice: mitten in einem Gespräch
  rationale: שִׂיחָה kann Rede, Gespräch oder Unterhaltung bedeuten. „Gespräch“ ist natürlich und fügt anders als „Rede eines anderen“ keinen ausdrücklich genannten Gesprächspartner hinzu.
- source_word: אַל תְּדַבֵּר
  choice: sprich nicht
  rationale: Direkte, würdige Wiedergabe des gewöhnlichen Verbs דבר „sprechen“.
