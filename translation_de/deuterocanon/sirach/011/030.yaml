base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/011/030.yaml
  text: A good day makes one forget trouble[a], and a bad day makes one forget prosperity; and a man's end will be set before him.
translation:
  language: de
  text: Ein guter Tag lässt das Unglück vergessen, und ein schlechter Tag lässt das Wohlergehen vergessen; und das Ende eines Menschen wird über ihn kommen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „und das Ende eines Menschen wird auf ihm sein“. Gemeint sein kann, dass sein letzter Ausgang ihn konfrontiert oder ereilt. Die griechische Parallelüberlieferung weicht an dieser Stelle erheblich vom erhaltenen hebräischen Text ab und klärt den Satz daher nicht.'
    reason: Mehrdeutige hebräische Wendung und stark abweichende Parallelüberlieferung.
lexical_decisions:
- source_word: טוֹב יוֹם
  choice: Ein guter Tag
  rationale: Die knappe hebräische Wendung bezeichnet einen günstigen Tag beziehungsweise eine gute Zeit. Die unmittelbare Wiedergabe ist auch im Deutschen natürlich.
- source_word: תִּשָּכַח רָעָה
  choice: lässt das Unglück vergessen
  rationale: רָעָה bezeichnet im Gegensatz zu טוֹבָה hier eher erfahrenes Unglück als moralisch Böses. Die Konstruktion mit „lässt … vergessen“ gibt den resultativen Sinn idiomatisch wieder.
- source_word: וְרָע יוֹם
  choice: und ein schlechter Tag
  rationale: Die Formulierung wahrt den Gegensatz zum „guten Tag“. „Böser Tag“ könnte fälschlich moralisch verstanden werden.
- source_word: תִּשָׁכַח טוֹבָה
  choice: lässt das Wohlergehen vergessen
  rationale: טוֹבָה meint hier erfahrenes Gutes, günstige Lebensumstände oder Wohlergehen. „Wohlergehen“ bildet einen verständlichen Gegenpol zu „Unglück“, ohne den Sinn auf Reichtum zu verengen.
- source_word: וְאַחֲרִית אָדָם
  choice: und das Ende eines Menschen
  rationale: אַחֲרִית kann das Ende, den Ausgang oder das letzte Geschick bezeichnen. אָדָם ist generisch; „eines Menschen“ gibt dies im modernen Deutschen natürlich wieder.
- source_word: תִּהְיֶה עָלָיו
  choice: wird über ihn kommen
  rationale: Wörtlich heißt die Wendung „wird auf/über ihm sein“. „Wird über ihn kommen“ ist verständliches Deutsch und bewahrt den möglichen Gedanken, dass der letzte Ausgang einen Menschen erreicht oder ereilt; die verbleibende Mehrdeutigkeit wird in der Fußnote kenntlich gemacht.
theological_decisions:
- issue: Bedeutung des letzten Satzglieds
  choice: das Ende eines Menschen wird über ihn kommen
  alternative: das Ende eines Menschen wird auf ihm sein
  rationale: Das Hebräische legt nicht eindeutig fest, ob der endgültige Ausgang den Menschen konfrontiert, ereilt oder auf ihm lastet. Die Übersetzung bleibt nahe am räumlichen Bild von עָלָיו, ohne daraus eine bestimmte Lehre über Gericht oder Tod abzuleiten.
- issue: Generisches אָדָם
  choice: eines Menschen
  alternative: eines Mannes
  rationale: אָדָם bezeichnet hier den Menschen allgemein und nicht ausdrücklich eine männliche Person. Die gewählte Form ist im modernen Deutschen natürlich und sachlich genau.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper antithetischer Satzstruktur. „Unglück“ und „Wohlergehen“ bezeichnen wechselnde Lebensumstände, ohne sie unnötig zu moralisieren; die schwer deutbare Schlusswendung bleibt durch Text und Fußnote bewusst offen.
