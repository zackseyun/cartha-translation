  source_fidelity: Der deutsche Text gibt die beiden hebräischen Verbote und ihre parallele Struktur zuverlässig wieder. „wegen seiner Gestalt“ bewahrt die gegenüber der griechischen Parallele weitere Bedeutung von תֹּאַר; „weil er hässlich aussieht“ ist eine natürliche deutsche Entfaltung von „hässlich an/in seinem Aussehen“ (מְכוֹעָר בְּמַרְאֵהוּ). „Verabscheue“ entspricht der Stärke von תעב angemessen.
