  text: Do not praise a man for his appearance[a], and do not despise a man who is ugly in his looks.
translation:
  language: de
  text: Lobe einen Menschen nicht wegen seiner Gestalt,[a] und verabscheue keinen Menschen, weil er hässlich aussieht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Parallelüberlieferung lautet: „Lobe einen Mann nicht wegen seiner Schönheit, und verabscheue einen Menschen nicht wegen seines Aussehens.“ Das Hebräische spricht im ersten Satzteil allgemeiner von der „Gestalt“, während das Griechische den Sinn auf „Schönheit“ verengt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תְּהַלֵּלו
  choice: Lobe … nicht
  rationale: Das Piel von הלל bedeutet hier „loben“ oder „preisen“. „Loben“ ist im modernen Deutschen natürlich und entspricht auch dem griechischen αἰνέσῃς.
- source_word: אָדָם
  choice: einen Menschen / keinen Menschen
  rationale: אָדָם bezeichnet hier jeweils einen einzelnen Menschen. „Mensch“ bewahrt den generischen Bezug natürlicher als „Mann“ und passt zur Variation des griechischen Parallelen ἄνδρα/ἄνθρωπον.
- source_word: בְּתָאֳרוֹ
  choice: wegen seiner Gestalt
  rationale: תֹּאַר bezeichnet die äußere Gestalt beziehungsweise Erscheinung. „Gestalt“ wahrt den breiteren Sinn des Hebräischen, ohne ihn wie das griechische κάλλος auf Schönheit einzuengen.
- source_word: וְאַל תְּתַעֵב
  choice: und verabscheue … nicht
  rationale: תעב drückt starke Abneigung oder Zurückweisung aus. „Verabscheuen“ gibt diese Stärke genauer wieder als das schwächere „verachten“ und wird vom griechischen βδελύσσομαι gestützt.
- source_word: מְכוֹעָר
  choice: hässlich
  rationale: Das Adjektiv bedeutet „hässlich“ oder „unansehnlich“. „Hässlich“ ist direkt und vermeidet die unbelegte Präzisierung „entstellt“.
- source_word: בְּמַרְאֵהוּ
  choice: aussieht
  rationale: מַרְאֶה bezeichnet das sichtbare Erscheinungsbild. Die idiomatische Wendung „hässlich aussieht“ gibt den konkreten visuellen Bezug im Deutschen klar wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter Mahnrede. „Gestalt“ erhält im ersten Satzteil die lexikalische Breite des Hebräischen; im zweiten Satzteil sorgt „weil er hässlich aussieht“ für natürliche Verständlichkeit, ohne den sichtbaren Bezug abzuschwächen.
