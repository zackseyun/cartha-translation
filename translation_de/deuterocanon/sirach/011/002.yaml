  terminology: „Gestalt“ ist hier als Wiedergabe von תֹּאַר vertretbar und hält den Begriff weiter als „Schönheit“. „Mensch“ ist für אָדָם idiomatisch; es wird keine theologische oder interpretierende Zusatzbedeutung eingetragen. Die Fußnote benennt die griechische Einengung auf Schönheit zutreffend.
