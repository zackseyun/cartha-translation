translation:
  language: de
  text: 'Und wenn er sagt: »Ich habe Ruhe gefunden, und nun werde ich meine Güter genießen.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Parallelüberlieferung weicht erheblich ab: „Der Segen des Herrn liegt im Lohn des Gottesfürchtigen, und in kurzer Zeit lässt er seinen Segen aufblühen.“ Hebräisch und Griechisch scheinen hier unterschiedliche Textformen zu bezeugen.'
    reason: textual_variant
lexical_decisions:
- source_word: וּבְעֵת
  choice: Und wenn
  rationale: Die Wendung bezeichnet den Zeitpunkt, an dem die Aussage fällt. Im Deutschen gibt „und wenn“ den zeitlichen Zusammenhang natürlich wieder, ohne daraus eine bloß allgemeine Bedingung zu machen.
- source_word: יֹאמַר
  choice: er sagt
  rationale: Das Yiqtol kann hier eine gegenwärtig bzw. wiederholt vorgestellte Aussage bezeichnen. Das Präsens passt zu der geschilderten Selbsteinschätzung und lässt die aspektuelle Offenheit bestehen.
- source_word: מָצָאתִי
  choice: Ich habe … gefunden
  rationale: Das Perfekt bezeichnet aus Sicht des Sprechers einen erreichten Zustand; das deutsche Perfekt gibt dieses gegenwärtige Ergebnis angemessen wieder.
- source_word: נַחַת
  choice: Ruhe
  rationale: Das Substantiv bezeichnet Ruhe, Behagen oder ein ungestörtes Auskommen. „Ruhe“ ist knapp, verständlich und vermeidet eine stärkere Festlegung auf Sicherheit oder Wohlstand.
- source_word: וְעַתָּה
  choice: und nun
  rationale: Die koordinierende Form und der zeitliche Übergang werden unmittelbar bewahrt.
- source_word: אֹכַל
  choice: werde ich … genießen
  rationale: Die punktierte hebräische Form ist eindeutig erste Person Singular und setzt daher die direkte Rede fort. Das Bild des Essens wird im Deutschen idiomatisch als Genuss der eigenen Güter wiedergegeben; die wörtlichere Form steht in Fußnote [a].
- source_word: מִטּוֹבָתִי
  choice: meine Güter
  rationale: Das Wort bezeichnet hier das Gute bzw. die vorhandenen Güter des Sprechers. Der Suffix der ersten Person wird gegen die glättende englische Erzählform ausdrücklich bewahrt.
theological_decisions:
- issue: Person und Umfang der direkten Rede
  choice: 'Auch der zweite Satzteil bleibt direkte Rede in der ersten Person: „und nun werde ich meine Güter genießen“.'
  alternative: 'Erzählerische dritte Person: „nun wird er von seinen Gütern essen“.'
  rationale: Die vokalisierte hebräische Vorlage bietet אֹכַל und מִטּוֹבָתִי, beide in der ersten Person. Eine Umstellung in die dritte Person würde die klare grammatische Form ohne ausreichenden textlichen Grund auflösen.
- issue: Stark abweichende griechische Überlieferung
  choice: Der hebräische Text bildet den Haupttext; die griechische Fassung wird vollständig in einer Fußnote dokumentiert.
  alternative: Den griechischen Segensspruch in den Haupttext aufnehmen oder mit dem Hebräischen harmonisieren.
  rationale: Hebräisch und Griechisch bezeugen hier offenbar verschiedene Textformen. Ihre Spannung soll sichtbar bleiben und nicht durch Harmonisierung beseitigt werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede folgt konsequent der ersten Person des hebräischen Textes. „Meine Güter genießen“ ist eine natürliche deutsche Wiedergabe des konkreten Bildes „von meinem Guten essen“; die Ellipse zeigt an, dass der überlieferte hebräische Wortlaut inhaltlich wie ein angesetzter bzw. unvollständig fortgeführter Ausspruch wirkt.
