  text: Before you examine a man[a], do not call him blessed[b], for a man will be called blessed in his end.
translation:
  language: de
  text: Bevor du einen Menschen geprüft[a] hast, nenne ihn nicht glücklich; denn an seinem Ende wird ein Mensch glücklich genannt.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Bevor du einen Menschen erforscht hast, nenne ihn nicht glücklich.“ Das Hebräische verwendet dasselbe Verb hier aktiv und im zweiten Satzteil passiv.'
    reason: lexical_alternative
  - marker: b
    text: 'Der griechische Text weicht hier erheblich ab: „Von einem Feuerfunken vermehrt sich die Glut, und ein sündiger Mensch lauert auf Blut.“'
    reason: textual_variant
lexical_decisions:
- source_word: בְּטֶרֶם תַּחְקֹר
  choice: Bevor du … geprüft hast
  rationale: Die temporale Verbindung mit חקר bezeichnet eine gründliche Prüfung, die der Beurteilung vorausgehen soll. Das deutsche Perfekt macht deutlich, dass die Prüfung abgeschlossen sein muss.
- source_word: אָדָם
  choice: einen Menschen / ein Mensch
  rationale: אָדָם bezeichnet hier einen einzelnen Menschen in allgemeingültigem Sinn. „Mensch“ ist im modernen Deutschen natürlich und bewahrt den generischen Bezug ohne unnötige geschlechtliche Festlegung.
- source_word: אַל תְּאַשְּׁרֵהוּ
  choice: nenne ihn nicht glücklich
  rationale: Das Piel von אשר bedeutet, jemanden glücklich beziehungsweise selig zu nennen oder als glücklich zu preisen. „Glücklich nennen“ gibt den wertenden Ausspruch verständlich wieder.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion leitet die Begründung des vorausgehenden Verbots ein.
- source_word: בְּאַחֲרִיתוֹ
  choice: erst an seinem Ende
  rationale: אַחֲרִית kann Ende, Ausgang oder spätes Geschick bezeichnen. „An seinem Ende“ bewahrt die mögliche zeitliche und endgültige Bedeutung; „erst“ verdeutlicht den im Satz angelegten Gegensatz, ohne die Aussage inhaltlich festzulegen.
- source_word: יְאֻשַּׁר
  choice: wird … glücklich genannt
  rationale: Die passive Form von אשר wird parallel zur aktiven Form im ersten Halbvers wiedergegeben, sodass die auffällige hebräische Wortwiederholung erhalten bleibt.
theological_decisions:
- issue: Zeitpunkt und Grundlage des abschließenden Glücklichpreisens
  choice: an seinem Ende
  alternative: nach seinem Ausgang / aufgrund seines Ergebnisses
  rationale: Die Wendung kann das Lebensende oder den letztlich erkennbaren Ausgang meinen. Die Übersetzung lässt diese Weisheitsspannung bestehen und legt sie weder ausschließlich eschatologisch noch bloß pragmatisch aus.
- issue: Wiedergabe von אשר
  choice: glücklich nennen
  alternative: seligpreisen
  rationale: „Seligpreisen“ wäre traditionssprachlich und könnte stärker religiös-dogmatisch klingen. „Glücklich nennen“ wahrt den weisheitlichen Beurteilungssinn und die aktive-passive Wiederholung.
translation_notes:
  register: Moderne, würdevolle Weisheitssprache. Die direkte Anrede und der parallele Satzbau des Hebräischen bleiben erhalten. „Glücklich“ ist allgemein verständlicher als das stärker kirchlich geprägte „selig“.
