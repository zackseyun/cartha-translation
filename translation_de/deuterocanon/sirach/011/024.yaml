lexical_decisions:
- source_word: בְּנִי
  choice: Mein Sohn
  rationale: Die maskuline Anrede im Singular wahrt die konkrete väterliche Lehrsituation des hebräischen Textes.
- source_word: עֲמוֹד
  choice: bleib
  rationale: Der Imperativ von עמד bezeichnet hier am ehesten beständiges Verharren beziehungsweise Festhalten, nicht bloß körperliches Stehen.
- source_word: בְּחֻקֶּךָ
  choice: in dem dir zugewiesenen Bereich
  rationale: Die schwierige Form kann Satzung, festgesetztes Maß, Anteil oder zugewiesenen Wirkungskreis bezeichnen. Die Wiedergabe bleibt bewusst weit genug, um diese Spannung nicht auf eine rein gesetzliche oder schicksalhafte Bedeutung festzulegen.
- source_word: וּבוֹ הִתְהַלֵּךְ
  choice: und geh darin deinen Weg
  rationale: התהלך beschreibt fortgesetztes Gehen und übertragen die Lebensführung. Die deutsche Wendung bewahrt das Wegmotiv und klingt zugleich natürlich.
- source_word: וּבִמְלָאכְתְּךָ
  choice: bei deiner Arbeit
  rationale: מלאכה bezeichnet allgemein Arbeit, Tätigkeit oder Beruf. „Arbeit“ ist die breiteste und geläufigste Entsprechung.
- source_word: הִתְיַשֶּׁן
  choice: werde alt
  rationale: Die Form fordert zu langem, beständigem Verbleiben bei der eigenen Arbeit auf; sie bedeutet hier eher Altwerden als Sich-Abnutzen.
theological_decisions:
- issue: Starke Abweichung zwischen dem erhaltenen hebräischen Text und der griechischen Überlieferung
  choice: Der Haupttext folgt dem erhaltenen Hebräisch.
  alternative: 'Nach dem Griechischen: „Sag nicht: ‚Ich genüge mir selbst; welches Unglück könnte mich von jetzt an noch treffen?‘“'
  rationale: Wo bei Jesus Sirach Hebräisch erhalten ist, erhält es als Ausgangstext Vorrang. Da die griechische Fassung inhaltlich erheblich abweicht und möglicherweise eine andere Vorlage bezeugt, wird sie nicht in den Haupttext eingemischt, sondern vollständig in einer Fußnote dokumentiert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Geh darin deinen Weg“ erhält das hebräische Bild der Lebensführung; „zugewiesener Bereich“ vermeidet eine vorschnelle Festlegung des schwierigen חק auf Gesetz, Schicksal oder Beruf.
