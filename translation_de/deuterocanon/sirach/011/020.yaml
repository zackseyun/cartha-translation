  text: Stand by your covenant and attend to it, and grow old in your work.[a]
translation:
  language: de
  text: Die Gabe des Gerechten wird denen, die ihn fürchten, erhalten bleiben, und sein Wunsch wird für immer in Erfüllung gehen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Überlieferung lautet abweichend: „Halte an deinem Bund fest und widme dich ihm; werde alt in deiner Arbeit.“'
    reason: alternative_reading
lexical_decisions:
- source_word: מַתַּן צַדִּיק
  choice: die Gabe des Gerechten
  rationale: מַתַּן bezeichnet eine Gabe oder ein Geschenk; צַדִּיק ist ohne Artikel mehrdeutig und kann einen gerechten Menschen oder substantivisch „den Gerechten“ bezeichnen. Die deutsche Formulierung wahrt diese Offenheit.
- source_word: יַעֲמֹד
  choice: wird … erhalten bleiben
  rationale: Das Verb עמד bedeutet hier beständiges Fortbestehen; „erhalten bleiben“ ist im Deutschen natürlicher als das wörtliche „stehen“.
- source_word: לִירֵאָיו
  choice: denen, die ihn fürchten
  rationale: Die pronominale Beziehung bleibt wie im Hebräischen unausdrücklich und wird nicht auf Gott oder einen Menschen festgelegt.
- source_word: וּרְצוֹנוֹ
  choice: und seine Gunst
  rationale: רָצוֹן kann Wille, Wohlgefallen oder Gunst bedeuten. „Gunst“ passt zu einer Gabe und bewahrt zugleich die positive, personale Bedeutung.
- source_word: יִצְלַח לָעַד
  choice: wird für immer gedeihen
  rationale: צלח bezeichnet Gelingen oder Gedeihen; לָעַד drückt unbegrenzte Dauer aus.
theological_decisions:
- issue: Stark abweichende hebräische und griechische Textüberlieferung
  choice: Der Haupttext folgt dem erhaltenen hebräischen Text; die griechische Fassung steht in der Fußnote.
  alternative: „Halte an deinem Bund fest und widme dich ihm; werde alt bei deiner Arbeit.“
  rationale: Der angegebene hebräische Ausgangstext ist mit hoher Sicherheit bezeugt und soll als originalsprachliche Hauptevidenz übersetzt werden. Die inhaltlich stark abweichende griechische Überlieferung ist dennoch textgeschichtlich bedeutsam und wird vollständig dokumentiert.
- issue: Bezug von „des Gerechten“, „ihn“ und „seine“
  choice: Die pronominale und referenzielle Mehrdeutigkeit des Hebräischen bleibt erhalten.
  alternative: Die Bezüge ausdrücklich auf Gott oder ausdrücklich auf einen gerechten Menschen festlegen.
  rationale: Der hebräische Wortlaut benennt den Bezugsträger nicht weiter; eine ausdrückliche Identifizierung würde die mögliche theologische Spannung unzulässig auflösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt knapp und spruchhaft; die erhebliche Abweichung der griechischen Überlieferung wird transparent in einer Fußnote bewahrt.
