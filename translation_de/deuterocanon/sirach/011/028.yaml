  text: Do not say[a], “Look, I have done what I desired; and what now will be lacking to me?”
translation:
  language: de
  text: 'Sag nicht[a]: »Sieh, ich habe getan, was ich wollte; und was wird mir jetzt noch übrig bleiben?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Parallelüberlieferung lautet: »Vor dem Ende preise niemanden glücklich; an seinen Kindern wird ein Mann erkannt werden.« Der hebräische Text warnt hier stattdessen vor der Aussage: »Ich habe getan, was ich wollte; und was wird mir jetzt noch übrig bleiben?«'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תֹּאמַר
  choice: Sag nicht
  rationale: Die Verneinung mit der Verbform hat auffordernden Sinn; der moderne deutsche Imperativ gibt das unmittelbar und natürlich wieder.
- source_word: הִנֵּה
  choice: Sieh
  rationale: Bewahrt die hinweisende Kraft und leitet die selbstzufriedene Behauptung ein, ohne das altertümlichere »siehe« zu verwenden.
- source_word: עָשִׂיתִי חֶפְצִי
  choice: ich habe getan, was ich wollte
  rationale: Das Perfekt bezeichnet eine als abgeschlossen behauptete Handlung; חֶפְצִי meint den eigenen Wunsch oder Willen. Die Formulierung ist idiomatisch und erhält den Ton selbstzufriedener Zielerreichung.
- source_word: וּמֶה עַתָּה
  choice: und was ... jetzt noch
  rationale: »Und« bildet die hebräische Konjunktion ausdrücklich ab; »jetzt noch« bringt den rhetorischen Übergang zur vermeintlichen Sicherheit natürlich zum Ausdruck.
- source_word: יֵעָזֵב לִי
  choice: sollte mir ... fehlen
  rationale: Die überlieferte Form kann ein Übrigbleiben, Ausbleiben oder Fehlen bezeichnen. Im Zusammenhang ist die rhetorische Frage »Was könnte mir noch fehlen?« gemeint; der Konjunktiv wahrt ihren vermessenen Unterton.
theological_decisions:
- issue: Verhältnis des hebräischen Wortlauts zur deutlich abweichenden griechischen Parallelüberlieferung
  choice: Der erhaltene hebräische Wortlaut steht im Haupttext; die griechische Fassung wird in einer Fußnote vollständig als abweichende Überlieferung genannt.
  alternative: 'Griechisch basierter Haupttext: »Vor dem Ende preise niemanden glücklich; an seinen Kindern wird ein Mann erkannt werden.«'
  rationale: Wo bei Jesus Sirach ein belastbarer hebräischer Text erhalten ist, besitzt er für diese Übersetzung Vorrang. Die griechische Fassung teilt das warnende Weisheitsmotiv, ist jedoch keine enge Wiedergabe dieses hebräischen Wortlauts und darf dessen Aussage daher nicht stillschweigend ersetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede klingt bewusst selbstsicher und selbstzufrieden. »Sag nicht« und »Sieh« vermeiden unnötig altertümliche Formen; die rhetorische Frage bewahrt die Spannung und legt ihre theologische Bewertung nicht zusätzlich aus.
