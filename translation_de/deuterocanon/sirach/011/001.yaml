translation:
  language: de
  text: Die Weisheit des Armen erhebt sein Haupt[a] und setzt ihn unter Edle.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »des Niedrigen« oder »des Demütigen«. Im Hebräischen steht »des Armen«; die griechische Parallele kann allgemeiner einen Menschen von niedrigem Stand bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָכְמַת
  choice: Die Weisheit des
  rationale: Die Konstruktform verbindet »Weisheit« unmittelbar mit דל; die deutsche Genitivfügung bildet dieses Verhältnis klar und natürlich ab.
- source_word: דַּל
  choice: Armen
  rationale: Das hebräische דל bezeichnet häufig einen armen, schwachen oder gesellschaftlich niedriggestellten Menschen. »Armen« wahrt hier vorrangig den konkreten sozialen und wirtschaftlichen Sinn des hebräischen Textes.
- source_word: תִּשָּׂא רֹאשׁוֹ
  choice: erhebt sein Haupt
  rationale: Die Wiedergabe bewahrt das hebräische Bild der Status- und Würdenerhöhung; auch die griechische Parallele bestätigt das Bild vom erhobenen Haupt. »Haupt« gibt dem Satz einen würdigen, jedoch verständlichen Ton.
- source_word: וּבֵין
  choice: unter
  rationale: Vor einem Plural bezeichnet בֵּין hier die Zugehörigkeit zu einer Gruppe; »unter« ist dafür im Deutschen idiomatisch.
- source_word: נְדִיבִים
  choice: Edle
  rationale: Im Kontext sind gesellschaftlich hochgestellte Personen gemeint. »Edle« erfasst Rang und Ansehen, ohne die monarchiespezifische Bedeutung von »Fürsten« einzutragen.
- source_word: תּוֹשִׁיבֶנּוּ
  choice: setzt ihn
  rationale: Der Hifil von ישב bedeutet hier, jemanden sitzen zu lassen beziehungsweise ihm einen Platz zu geben. »Setzt ihn unter Edle« bewahrt das Bild gesellschaftlicher Aufnahme und Ehrung.
theological_decisions:
- issue: Ob דל vorwiegend wirtschaftliche Armut oder allgemein Niedrigkeit beziehungsweise Demut bezeichnet
  choice: des Armen
  alternative: des Niedrigen; des Demütigen
  rationale: Der vorrangige hebräische Zeuge legt eine konkrete soziale Bezeichnung nahe. Die griechische Parallele ταπεινοῦ kann den Sinn auf niedrigen Stand oder Demut erweitern. Der Haupttext wahrt daher den sozioökonomischen Sinn, während die Fußnote die echte Bedeutungsbreite offenhält.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die leicht feierliche Wendung »erhebt sein Haupt« bewahrt das konkrete Quellenbild, bleibt aber für heutige Leser verständlich. Der parallele Satzbau stellt die Erhöhung des Armen und seine Aufnahme unter gesellschaftlich Hochgestellte klar heraus.
