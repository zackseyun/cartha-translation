base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/011/034.yaml
  text: Keep many out of your house[a], and do not bring every man into your home, for many lie in wait[b], and many are deceivers.
translation:
  language: de
  text: Halte viele aus deinem Haus fern[a], und bring nicht jeden Mann ins Haus; denn zahlreich sind die, die auf der Lauer liegen, und ebenso die Betrüger.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hebräische Text ist hier maßgeblich. Die griechische Überlieferung bietet jedoch eine deutlich andere Fassung: „Beherberge einen Fremden, und er wird dich in Unruhe stürzen und dich dem entfremden, was dir gehört.“ Vermutlich liegt eine andere Textform oder eine Erweiterung der Warnung vor.'
    reason: alternative_reading
  - marker: b
    text: Die angeführte hebräische Ausgabe setzt den ersten und den letzten Teil dieses Verses in eckige Klammern. Das weist auf Ergänzung oder Unsicherheit in der erhaltenen hebräischen Handschriftenüberlieferung hin.
    reason: textual_variant
lexical_decisions:
- source_word: מְנַע רַבִּים מִתּוֹךְ בֵּיתֶךָ
  choice: Halte viele aus deinem Haus fern
  rationale: Der Imperativ מְנַע bezeichnet hier das Verwehren des Zugangs. Die deutsche Wendung ist natürlich und bewahrt mit „aus deinem Haus“ den räumlichen Bezug des Hebräischen.
- source_word: וְלֹא כָל אִישׁ לְהָבִיא אֶל בַּיִת
  choice: und bring nicht jeden Mann ins Haus
  rationale: Die Formulierung gibt die Warnung vor unterschiedsloser Aufnahme wieder und bewahrt das ausdrücklich maskuline אִישׁ, ohne den Sinn weiter einzuengen.
- source_word: אוֹרְבִים
  choice: die, die auf der Lauer liegen
  rationale: Die Wiedergabe erhält das Bild von Menschen, die verborgen auf eine Gelegenheit zum Schaden warten, statt es abstrakt als bloßes Planen wiederzugeben.
- source_word: וְכֵן נוֹכְלִים רַבִּים הֵם
  choice: und ebenso die Betrüger
  rationale: „Ebenso“ bildet וְכֵן ab; „Betrüger“ bezeichnet Menschen, die arglistig und täuschend handeln. Die vorangestellte Aussage „zahlreich sind“ gilt im Deutschen natürlich für beide Gruppen.
