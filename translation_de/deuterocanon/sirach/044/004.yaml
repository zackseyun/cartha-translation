translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper, aufzählender Satzstruktur. Die ungewöhnlichen Parallelbegriffe des Hebräischen werden nicht eingeebnet; insbesondere bleiben „Nachforschungen“ und „Wachdienste“ bewusst deutungsoffen. Die Fußnotenmarker stehen entsprechend der gelieferten englischen Beratungsschicht im Haupttext, obwohl ihre inhaltliche Zuordnung sachlich eher zur jeweils benachbarten anderen Wendung zu passen scheint.
