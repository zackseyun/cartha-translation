translation:
  language: de
  text: Leiter von Völkern in ihren Beratungen und Herrscher in ihren Nachforschungen[b]; weise im Reden, in ihren Schriften[a], und Regierende in ihren Wachdiensten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die hebräischen Textzeugen weichen in der dritten Wendung geringfügig voneinander ab: Der Text aus der Kairoer Geniza liest „in ihrem Schreiben/ihren Schriften“, während die Masada-Rolle eine eng verwandte Lesart „in ihren Büchern“ bietet. Beide weisen auf schriftgelehrte oder literarische Weisheit.'
    reason: textual_variant
  - marker: b
    text: Die griechische Parallelüberlieferung weicht in der zweiten Wendung etwas vom Hebräischen ab und betont Einsicht im Zusammenhang mit der schriftkundigen Verwaltung des Volkes. Die Übersetzung folgt hier vorrangig dem hebräischen Text, berücksichtigt aber die griechische Überlieferung.
    reason: alternative_reading
lexical_decisions:
- source_word: שרי גוים
  choice: Führer von Völkern
  rationale: שרים bezeichnet führende Amtsträger oder Fürsten; „Führer“ gibt die politische Leitungsfunktion wieder, während „von Völkern“ den Plural גוים bewahrt.
- source_word: במזמתם
  choice: in ihren Beratungen
  rationale: מזמה kann Planung, Vorhaben oder überlegten Rat bezeichnen. Im lobenden Kontext und im Licht des griechischen ἐν διαβουλίοις trifft „Beratungen“ die gemeinschaftlich-politische Überlegung natürlich.
- source_word: ורוזנים
  choice: und Machthaber
  rationale: רוזנים meint hochgestellte Herrscher oder Würdenträger. „Machthaber“ erhält den politischen Sinn und unterscheidet die Bezeichnung von den übrigen Herrschaftsausdrücken des Verses.
- source_word: במחקרותם
  choice: in ihren Nachforschungen
  rationale: Der Ausdruck ist von der Vorstellung des Erforschens und gründlichen Untersuchens geprägt. „Nachforschungen“ bewahrt diese Tätigkeit, ohne sie auf moderne Wissenschaft einzuengen.
- source_word: חכמי שיח
  choice: Weise der Rede
  rationale: Die knappe Verbindung bedeutet wörtlich etwa „Weise des Gesprächs/der Rede“. Die deutsche Fassung hält den Bezug auf sprachliche oder gedankliche Ausdrucksfähigkeit offen.
- source_word: בספרתם
  choice: durch ihre Schriften
  rationale: Die Lesart weist auf Schreiben beziehungsweise schriftliche Werke. „Durch ihre Schriften“ gibt die mögliche instrumentale Funktion der Präposition wieder; die verwandte Masada-Lesart „in ihren Büchern“ bestätigt das literarische Bedeutungsfeld.
- source_word: ומושלים
  choice: und Herrschende
  rationale: Das Partizip von משל bezeichnet Menschen, die Herrschaft ausüben. „Herrschende“ gibt die Form formal wieder und vermeidet eine Festlegung auf ein bestimmtes Amt.
- source_word: במשמרותם
  choice: in ihren Wachdiensten
  rationale: משמרת kann Wache, Dienst, Obhut oder zugewiesenen Amtsbereich bedeuten. „Wachdienste“ bleibt nahe am konkreten Grundsinn und lässt den militärischen beziehungsweise administrativen Bezug offen.
