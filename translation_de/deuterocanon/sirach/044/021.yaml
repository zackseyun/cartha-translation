  to: Darum bestätigte er ihm mit einem Eid, dass Völker in seiner Nachkommenschaft gesegnet werden sollten und dass er ihnen von Meer zu Meer[a] und vom Strom[b] bis an die Enden der Erde Erbbesitz geben würde.
  rationale: Die Revision beseitigt die Mehrdeutigkeit von „sie zum Erbbesitz geben“ durch eine klare deutsche Dativkonstruktion, ohne die im Ausgangstext offene genaue geographische Reichweite oder die passive Form der Segensverheißung zu verändern. Der Anker der Euphrat-Erklärung wird an das erläuterte Wort gesetzt.
