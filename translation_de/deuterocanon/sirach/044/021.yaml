base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/044/021.yaml
  text: Therefore he confirmed it to him with an oath that nations would be blessed in his offspring[a], and that he would give them as an inheritance from sea to sea[b], and from the River to the ends of the earth.
translation:
  language: de
  text: Darum bestätigte er ihm mit einem Eid, dass Völker in seiner Nachkommenschaft gesegnet werden sollten und dass er ihnen von Meer zu Meer[a] und vom Strom[b] bis an die Enden der Erde Erbbesitz geben würde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der hier zugrunde liegende hebräische Text lautet wörtlich „von Wasser(n) bis zum Meer“. Die griechische Überlieferung bietet „von Meer zu Meer“ und bewahrt damit wahrscheinlich die beabsichtigte territoriale Formel.
    reason: textual_variant
  - marker: b
    text: „Der Strom“ bezeichnet in der biblischen Sprache territorialer Verheißungen gewöhnlich den Euphrat.
    reason: cross_reference
lexical_decisions:
- source_word: על כן
  choice: Darum
  rationale: Natürlicher deutscher Folgerungsanschluss, der den Bezug zum vorhergehenden Lob Abrahams wahrt.
- source_word: בשבועה הקים לו
  choice: bestätigte er ihm mit einem Eid
  rationale: הקים mit der Eidesformel bezeichnet das verbindliche Bestätigen einer Verheißung; das implizite Objekt bleibt im Deutschen unausgesprochen.
- source_word: לברך בזרעו גוים
  choice: dass Völker in seiner Nachkommenschaft gesegnet werden sollten
  rationale: Die passive Fassung wird durch die griechische Parallele gestützt und bewahrt die Offenheit hinsichtlich der handelnden Instanz.
- source_word: זרעו
  choice: seiner Nachkommenschaft
  rationale: Gibt den kollektiven Singular und den Bezug auf die abrahamitische Verheißung natürlicher wieder als „Samen“.
- source_word: להנחילם
  choice: dass er sie zum Erbbesitz geben würde
  rationale: Die Hifil-Form von נחל drückt das Zuteilen beziehungsweise Geben als Erbbesitz aus; das Suffix bezieht sich im Zusammenhang wahrscheinlich auf Abrahams Nachkommen.
- source_word: מים עד ים
  choice: von Meer zu Meer
  rationale: Der überlieferte hebräische Wortlaut lautet formal „von Wasser(n) bis zum Meer“, doch die griechische Parallele bewahrt wahrscheinlich die bekannte territoriale Formel.
- source_word: ומנהר
  choice: und vom Strom
  rationale: „Der Strom“ ist in biblischer Verheißungssprache die konventionelle Bezeichnung für den Euphrat, ohne den Eigennamen im Haupttext einzutragen.
- source_word: עד אפסי ארץ
  choice: bis an die Enden der Erde
  rationale: Geläufige und würdevolle Wiedergabe der biblischen Wendung für die äußersten Grenzen.
theological_decisions:
- issue: Formulierung der abrahamitischen Segensverheißung und handelnde Instanz
  choice: dass Völker in seiner Nachkommenschaft gesegnet werden sollten
  alternative: dass er durch seine Nachkommenschaft Völker segnen würde
  rationale: Der hebräische Infinitiv lässt eine aktivere Deutung zu, während das Griechische ausdrücklich eine passive Form stützt. Die passive Wiedergabe vermeidet eine unnötige Festlegung der handelnden Instanz.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die Satzstruktur folgt dem Hebräischen, wird aber für natürliche deutsche Lesbarkeit gegliedert; textliche und theologische Offenheiten werden nicht eingeebnet.
