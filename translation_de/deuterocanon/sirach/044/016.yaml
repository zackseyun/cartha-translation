  text: Enoch was found blameless, and he walked with the LORD, and he was taken away—an example of knowledge for generation after generation.
translation:
  language: de
  text: Henoch wurde als untadelig befunden; er ging seinen Weg mit dem HERRN und wurde hinweggenommen – ein Zeichen der Erkenntnis für jede Generation.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Überlieferung lautet abweichend: „ein Beispiel der Umkehr für die Generationen“.'
    reason: Dokumentiert die inhaltlich bedeutsame Differenz zwischen dem vorrangigen hebräischen Text und der griechischen Parallelüberlieferung.
lexical_decisions:
- source_word: תמים
  choice: untadelig
  rationale: Gibt die moralische Unbescholtenheit von תמים in natürlichem, würdigem Deutsch wieder, ohne eine absolute metaphysische Vollkommenheit zu behaupten.
- source_word: והתהלך עם יהוה
  choice: er ging seinen Weg mit dem HERRN
  rationale: Bewahrt das Bild des hebräischen Verbs התהלך und die Aussage einer beständigen Lebensführung mit JHWH. Der Gottesname wird gemäß dem deutschen Bibelgebrauch als HERR wiedergegeben.
- source_word: ונלקח
  choice: und wurde hinweggenommen
  rationale: Die Passivform wahrt die knappe, offene Aussage des Hebräischen; der Handelnde wird nicht ausdrücklich ergänzt.
- source_word: אות דעת
  choice: ein Zeichen der Erkenntnis
  rationale: Folgt dem vorliegenden hebräischen Text formal und bewahrt dessen ungewöhnliche, möglicherweise mehrdeutige Formulierung, statt sie nach der griechischen Überlieferung umzudeuten.
- source_word: לדור ודור
  choice: für Generation um Generation
  rationale: Bildet die distributive hebräische Wendung nach und vermittelt ihre fortdauernde Geltung über die Generationen hinweg.
theological_decisions:
- issue: Verhältnis der hebräischen Lesart zur griechischen Parallelüberlieferung
  choice: „ein Zeichen der Erkenntnis“ nach אות דעת
  alternative: „ein Beispiel der Umkehr für die Generationen“ nach ὑπόδειγμα μετανοίας ταῖς γενεαῖς
  rationale: Die angegebene hebräische Quelle besitzt hohe Konfidenz und ist daher vorrangig. Die deutlich abweichende griechische Lesart wird transparent in einer Fußnote dokumentiert, nicht in den Haupttext eingemischt.
- issue: Art der Hinwegnahme Henochs
  choice: „wurde hinweggenommen“ ohne nähere Erklärung
  alternative: ausdrückliche Deutung als Entrückung in den Himmel oder Bewahrung vor dem Tod
  rationale: Das hebräische Passiv nennt weder Ziel noch genaue Art der Hinwegnahme. Die Übersetzung lässt diese theologische Offenheit bestehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst bibelnaher Bildsprache. Das Semikolon gliedert die drei Aussagen klar; die ungewöhnliche Schlusswendung bleibt wegen ihrer textlichen Bedeutung erkennbar.
