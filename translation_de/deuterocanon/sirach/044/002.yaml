translation:
  language: de
  text: Der Höchste teilte reiche Ehre[a][b] aus, und seine Größe ist von Urzeiten her.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die hebräischen Handschriften aus der Kairoer Geniza lesen חלק עליון; die ältere Masada-Rolle hat חולק עליון und stützt damit den Sinn: „Der Höchste teilte aus“. Die griechische Fassung lautet dagegen: „Der Herr schuf große Herrlichkeit.“'
    reason: textual_variant
  - marker: b
    text: 'Oder: „reiche Herrlichkeit“. Das hebräische כבוד und das griechische δόξα können je nach Zusammenhang „Ehre“ oder „Herrlichkeit“ bedeuten.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „von alters her“ oder „von Ewigkeit her“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רב
  choice: reich
  rationale: In רב כבוד verstärkt רב die Menge beziehungsweise das Ausmaß der Ehre. „Reiche Ehre“ gibt dies in natürlichem Deutsch wieder.
- source_word: כבוד
  choice: Ehre
  rationale: כבוד kann sowohl „Ehre“ als auch „Herrlichkeit“ bedeuten. Im Zusammenhang mit dem Austeilen und der anschließenden Würdigung berühmter Männer passt „Ehre“ gut; die mögliche Wiedergabe „Herrlichkeit“ bleibt in einer Fußnote erhalten.
- source_word: חלק / חולק
  choice: teilte … aus
  rationale: Die Kairoer Geniza liest חלק, während die ältere Masada-Handschrift חולק bietet. Letztere stützt ein verbales Verständnis mit dem Höchsten als Subjekt. „teilte … aus“ bewahrt den distributiven Sinn und klingt im Deutschen idiomatisch.
- source_word: עליון
  choice: der Höchste
  rationale: Der Ausdruck ist ein Gottesname beziehungsweise Gottestitel und wird in geläufiger deutscher Form wiedergegeben.
- source_word: וגדלו
  choice: und seine Größe
  rationale: Das Suffix wird natürlich als „seine“ verstanden; „Größe“ entspricht dem Hebräischen eng und wird auch durch das griechische μεγαλωσύνη gestützt.
- source_word: מימות עולם
  choice: seit Urzeiten
  rationale: Die Wendung kann weit zurückliegende Zeit oder Ewigkeit bezeichnen. „Seit Urzeiten“ lässt diese zeitliche Weite offen, ohne sie ausschließlich als philosophische Ewigkeit festzulegen.
theological_decisions:
- issue: Subjekt und Syntax des ersten Halbverses
  choice: 'Der Höchste ist das Subjekt: „Der Höchste teilte reiche Ehre aus.“'
  alternative: „Der Herr schuf große Herrlichkeit“ oder „Große Ehre ist der Anteil des Höchsten“
  rationale: Wo der hebräische Sirachtext erhalten ist, hat er Vorrang. Besonders die ältere Masada-Lesart חולק stützt ein verbales Verständnis mit „der Höchste“ als Subjekt. Die abweichende griechische Wiedergabe ἔκτισεν („schuf“) wird in der Fußnote dokumentiert, aber nicht in den Haupttext übernommen.
- issue: Zeitweite von מימות עולם
  choice: „seit Urzeiten“
  alternative: „von alters her“ oder „von Ewigkeit her“
  rationale: Die hebräische Wendung kann sowohl fernste Vorzeit als auch Ewigkeit bezeichnen. Der Haupttext wahrt diese Spannung, statt aufgrund des göttlichen Subjekts zwingend „Ewigkeit“ festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „teilte … aus“ ist verständlicher und natürlicher als das gehobenere „teilte … zu“; „seit Urzeiten“ bewahrt die Bedeutungsbreite der hebräischen Zeitangabe.
