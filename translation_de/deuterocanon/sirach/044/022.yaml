base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/044/022.yaml
  text: And in Isaac he established[a], because of Abraham his father, a covenant with every firstborn[b], and the blessing rested on the head of Israel.
translation:
  language: de
  text: Auch für Isaak ließ er, um seines Vaters Abraham willen, einen Sohn erstehen.[a] Den Bund jedes Erstgeborenen gab er ihm,[b] und der Segen ruhte auf dem Haupt Israels.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Text liest abweichend: „In Isaak begründete er durch Abraham, seinen Vater, einen Segen für alle Menschen und einen Bund.“'
    reason: alternative_reading
  - marker: b
    text: Die hebräische Wendung „den Bund jedes Erstgeborenen“ ist schwierig. Die griechische Parallelfassung weicht im ganzen Abschnitt deutlich ab und bietet „einen Segen für alle Menschen und einen Bund“ statt der hebräischen Abfolge mit „Sohn“ und dieser Bundesformel.
    reason: textual_variant
lexical_decisions:
- source_word: וגם ליצחק הקים בן
  choice: Auch für Isaak ließ er … einen Sohn erstehen
  rationale: Der hebräische Text nennt ausdrücklich einen „Sohn“ und verwendet ל bei Isaak am natürlichsten im Sinn von „für“. „Erstehen lassen“ gibt הקים würdig und verständlich wieder, ohne die Aussage unnötig zu präzisieren.
- source_word: בעבור אברהם אביו
  choice: um Abrahams, seines Vaters, willen
  rationale: בעבור bezeichnet hier den Grund beziehungsweise die Rücksicht auf Abraham. Die Formulierung bewahrt diesen kausalen Sinn und lässt das Possessivverhältnis eindeutig auf Isaak bezogen.
- source_word: ברית כל ראשון
  choice: den Bund jedes Erstgeborenen
  rationale: 'Die schwierige hebräische Wortfolge wird möglichst formal wiedergegeben: ברית ist „Bund“, כל ראשון wörtlich „jeder Erstgeborene“. Der bestimmte Artikel ist im Deutschen aufgrund des konkreten Bundeszusammenhangs idiomatisch.'
- source_word: נתיו
  choice: gab er ihm
  rationale: Die Form wird als eine Schreibung mit dem Sinn „er gab ihm“ verstanden und ausdrücklich übersetzt, statt das Verb in „schloss/stiftete“ aufgehen zu lassen.
- source_word: וברכה נחה על ראש ישראל
  choice: und der Segen ruhte auf dem Haupt Israels
  rationale: Die Bildsprache des Hebräischen bleibt erhalten. נחה bedeutet „ruhte“ oder „ließ sich nieder“; „auf dem Haupt“ wahrt das Bild der zugesprochenen Segensgabe.
theological_decisions:
- issue: Identität Israels
  choice: Der Eigenname „Israel“ bleibt ohne erklärenden Zusatz stehen.
  alternative: Israel ausdrücklich als Jakob oder kollektiv als Volk Israel bezeichnen.
  rationale: Im Zusammenhang der Erzväter bezeichnet „Israel“ zunächst Jakob; zugleich kann der Name auf das aus ihm hervorgegangene Volk vorausweisen. Die unaufgelöste Namensform bewahrt diese Resonanz.
- issue: Verhältnis von Sohn, Bund und Segen in den Textzeugen
  choice: Der hebräische Hauptzeuge bestimmt den Haupttext; die stark abweichende griechische Fassung wird in den Fußnoten dokumentiert.
  alternative: 'Nach dem Griechischen übersetzen: Gott habe in Isaak den Segen aller Menschen und einen Bund bestätigt.'
  rationale: Der hebräische Text ist an dieser Stelle schwierig, aber nicht ohne Weiteres durch die glattere griechische Lesart zu ersetzen. Die Übersetzung wahrt daher sowohl die hebräische Aussage als auch die wichtige alternative Überlieferung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die hebräische Bildsprache und die schwierige Bundesformel bleiben sichtbar; gravierende Unterschiede der griechischen Parallelüberlieferung werden nicht stillschweigend harmonisiert, sondern in Fußnoten ausgewiesen.
