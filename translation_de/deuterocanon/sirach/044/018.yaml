  text: An everlasting covenant was cut with him[a], that all flesh might not be destroyed.
translation:
  language: de
  text: Ein ewiger Bund wurde mit ihm geschlossen, damit nicht alles Fleisch vernichtet würde.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Griechisch: „damit nicht alles Fleisch durch eine Flut ausgelöscht würde“. Dadurch wird der Bezug auf Noah ausdrücklich.'
    reason: alternative_reading
lexical_decisions:
- source_word: באות עולם
  choice: einen ewigen Bund
  rationale: Der hebräische Ausdruck bezeichnet hier einen dauerhaft gültigen Bund. Die singularische hebräische Lesart hat gegenüber dem griechischen Plural Vorrang; „ewiger Bund“ ist im Deutschen idiomatisch und bewahrt den biblischen Klang.
- source_word: נכרת עמו
  choice: schloss er mit ihm
  rationale: Hebräisch כרת bezeichnet in Verbindung mit „Bund“ wörtlich das Schneiden eines Bundes. Deutsch verwendet dafür natürlich „einen Bund schließen“; eine wörtliche Wiedergabe mit „schneiden“ wäre missverständlich.
- source_word: לבלתי
  choice: damit nicht
  rationale: Die Wendung leitet einen Zweck beziehungsweise ein beabsichtigtes Ergebnis ein. „Damit nicht“ ist eine klare, gegenwärtige Entsprechung.
- source_word: השחית
  choice: vernichtet würde
  rationale: Das Verb bezeichnet hier vollständige Zerstörung. Das Passiv gibt die Konstruktion sachgerecht wieder, ohne den im Griechischen ausdrücklich genannten Flutbezug in den Haupttext einzutragen.
- source_word: כל בשר
  choice: alles Fleisch
  rationale: Die formnahe Wiedergabe bewahrt die umfassende biblische Bezeichnung für sterbliche Lebewesen und verengt sie nicht auf die Menschheit.
theological_decisions:
- issue: Soll die Flut nach dem griechischen Paralleltext ausdrücklich genannt werden?
  choice: Der Haupttext folgt dem erhaltenen Hebräischen und nennt die Flut nicht ausdrücklich.
  alternative: „damit nicht alles Fleisch durch eine Flut ausgelöscht würde“
  rationale: Im hebräischen Hauptzeugen fehlt eine ausdrückliche Entsprechung zu griechisch κατακλυσμῷ. Der griechische Text verdeutlicht den Noah-Kontext, soll aber die vorhandene hebräische Lesart nicht überschreiben; deshalb steht die Präzisierung in der Fußnote.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Einen Bund schließen“ überträgt das hebräische Bundesidiom natürlich; „alles Fleisch“ bewahrt die vertraute und umfassende biblische Ausdrucksweise.
