  source_fidelity: 'Der Haupttext gibt das Hebräische eng und angemessen wieder: גויתם als „Ihre Leiber“, בשלום als „in Frieden“, נאספו als bewusst nicht weiter aufgelöstes „wurden … versammelt“ und חי als personifiziertes „lebt“. Die Formulierung wahrt damit die hebräische Todesmetapher, ohne die explizitere griechische Bestattungsaussage in den Haupttext zu harmonisieren.'
  naturalness: „Ihre Leiber wurden in Frieden versammelt“ ist bewusst gehoben und leicht ungewohnt, im würdig-poetischen Kontext jedoch verständlich und vertretbar. Es erhält die Bildlichkeit besser als eine glattere, aber stärker deutende Wiedergabe wie „wurden beigesetzt“. „Von Generation zu Generation“ ist idiomatisches modernes Standarddeutsch.
  terminology: „Leiber“, „Name“ und „lebt“ sind treffend und registergerecht. Die griechische Fußnote gibt die Singularform als kollektiven „Ihr Leib“ korrekt wieder und erklärt den Unterschied zum Hebräischen. Die Masada-Fußnote kennzeichnet die kürzere, hinsichtlich der Partikel nicht eindeutig festgelegte Lesart vorsichtig.
