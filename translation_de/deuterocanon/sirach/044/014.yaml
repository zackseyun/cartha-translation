  text: Their bodies were gathered in peace[b][a], and their name lives from generation to generation.
translation:
  language: de
  text: Ihre Leiber wurden in Frieden versammelt[a][b], und ihr Name lebt von Generation zu Generation.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Griechisch: „Ihr Leib wurde in Frieden begraben.“ Der griechische Text spricht den Bestattungssinn ausdrücklich aus, während der hebräische Text sagt: „wurden in Frieden versammelt“.'
    reason: alternative_reading
  - marker: b
    text: 'Die Masada-Handschrift bewahrt hier eine kürzere Lesart („wenn/in Frieden wurden sie versammelt“); der Text aus der Kairoer Geniza lautet: „Ihre Leiber wurden in Frieden versammelt.“'
    reason: textual_variant
lexical_decisions:
- source_word: גויתם
  choice: ihre Leiber
  rationale: גויה bezeichnet den Leib beziehungsweise den toten Körper. „Leiber“ gibt die auf mehrere Personen bezogene hebräische Form wieder und wahrt den würdevollen poetischen Ton.
- source_word: בשלום
  choice: in Frieden
  rationale: Die präpositionale Wendung wird direkt wiedergegeben. „In Frieden“ bewahrt zugleich den möglichen umfassenderen Sinn, statt ihn auf „friedlich“ zu verengen.
- source_word: נאספו
  choice: wurden versammelt
  rationale: Das passive אסף kann im Todeszusammenhang das Versammeltwerden im Tod bezeichnen. Die wörtlichere Wiedergabe erhält das Bild des hebräischen Textes; die griechische Parallele macht mit „wurden begraben“ den Bestattungssinn ausdrücklich.
- source_word: ושמם
  choice: und ihr Name
  rationale: „Name“ bewahrt das biblische Bild für fortlebendes Ansehen und Andenken, ohne es auf einen abstrakten Begriff zu reduzieren.
- source_word: חי
  choice: lebt
  rationale: Die direkte, bildhafte Wiedergabe entspricht auch dem griechischen ζῇ und lässt den Namen personifiziert fortleben.
- source_word: לדור ודור
  choice: von Generation zu Generation
  rationale: Die geläufige deutsche Wendung gibt das Fortbestehen über aufeinanderfolgende Generationen natürlich und quellennah wieder.
theological_decisions:
- issue: Soll die hebräische Todesmetapher an das ausdrückliche griechische „wurde begraben“ angeglichen werden?
  choice: Im Haupttext bleibt die hebräisch begründete Formulierung „wurden in Frieden versammelt“ erhalten.
  alternative: Ihre Leiber wurden in Frieden begraben.
  rationale: Da der hebräische Text überliefert ist, hat er für den Haupttext Vorrang. Die griechische Parallele bestätigt den Bestattungskontext, löst aber die im Hebräischen enthaltene Bildsprache eindeutiger auf; diese Lesart wird deshalb in einer Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Leiber“ und „wurden versammelt“ klingen bewusst leicht gehoben, um die hebräische Todesmetapher und den poetischen Gedenkton zu erhalten; die Fußnoten klären sowohl den griechischen Bestattungssinn als auch die handschriftliche Variante.
