base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/044/017.yaml
  text: Noah was found righteous[a], blameless; at the time of destruction he became a substitute. Because of him a remnant remained[b], and by his covenant the flood ceased.
translation:
  language: de
  text: Noach wurde als gerecht und untadelig befunden. Zur Zeit der Vernichtung wurde er zum Ersatz[a]. Seinetwegen blieb ein Rest übrig, und durch seinen Bund hörte die Flut auf[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Austausch“, „Ausgleich“ oder „Lösegeld“. Das hebräische תחליף und das griechische ἀντάλλαγμα bezeichnen etwas, das an die Stelle von etwas anderem tritt.'
    reason: lexical_alternative
  - marker: b
    text: 'Der griechische Paralleltext weicht im Schlusssatz ab und weist eher auf das Kommen der Flut als auf ihr Aufhören. Der hier zugrunde gelegte hebräische Text lautet: „und durch seinen Bund hörte die Flut auf“.'
    reason: textual_variant
lexical_decisions:
- source_word: נח
  choice: Noach
  rationale: Die im Deutschen etablierte biblische Namensform.
- source_word: צדיק נמצא תמים
  choice: wurde als gerecht und untadelig befunden
  rationale: Die Formulierung bewahrt das hebräische Passiv und gibt צדיק mit dem biblisch-ethischen „gerecht“ sowie תמים als persönliche Unbescholtenheit, nicht als absolute Vollkommenheit, wieder.
- source_word: לעת כלה
  choice: Zur Zeit der Vernichtung
  rationale: כלה bezeichnet hier die vernichtende Katastrophe beziehungsweise das Gericht und nicht lediglich ein zeitliches Ende.
- source_word: תחליף
  choice: Ersatz
  rationale: Das Wort bezeichnet etwas, das an die Stelle von etwas anderem tritt. „Ersatz“ hält die im Hebräischen und im griechischen ἀντάλλαγμα vorhandene, aber nicht näher bestimmte Stellvertretungs- oder Austauschvorstellung offen.
- source_word: בעבורו
  choice: Seinetwegen
  rationale: Die Wendung bezeichnet Noach als den Grund dafür, dass ein Rest erhalten blieb.
- source_word: שארית
  choice: ein Rest
  rationale: „Rest“ bewahrt den biblischen Gedanken der durch das Gericht hindurch erhaltenen Übriggebliebenen.
- source_word: ובבריתו
  choice: durch seinen Bund
  rationale: Die Präposition wird instrumental verstanden; das Suffix bezieht sich am natürlichsten auf Noach beziehungsweise auf den mit ihm verbundenen Bund, ohne dies im Haupttext weiter auszudeuten.
- source_word: חדל מבול
  choice: hörte die Flut auf
  rationale: חדל bezeichnet das Aufhören oder Enden; die Wiedergabe folgt unmittelbar dem erhaltenen hebräischen Text.
theological_decisions:
- issue: Abweichung zwischen dem hebräischen und dem griechischen Text im Schlusssatz
  choice: 'Dem erhaltenen Hebräisch folgen: „durch seinen Bund hörte die Flut auf“'
  alternative: Der griechische Paralleltext weist auf das Eintreten beziehungsweise Kommen der Flut statt auf ihr Aufhören.
  rationale: Wo der hebräische Sirachtext erhalten ist, hat er für die Übersetzung Vorrang. Da die Abweichung den Sinn deutlich verändert, wird die griechische Lesart in einer Fußnote kenntlich gemacht.
- issue: Bedeutung von תחליף für Noachs Rolle
  choice: Die offene Austausch- beziehungsweise Stellvertretungssprache mit „Ersatz“ bewahren
  alternative: „Lösegeld“, „Ausgleich“ oder eine ausdrückliche Aussage, Noach sei an die Stelle anderer getreten
  rationale: Der Quellenausdruck legt nicht eindeutig fest, in welchem genauen Sinn Noach als Ersatz oder Austauschgröße verstanden wird. Eine dogmatische Präzisierung wäre daher nicht textgemäß.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper, schriftgemäßer Satzführung. Die ungewöhnliche Formulierung „zum Ersatz“ bleibt bewusst stehen, da eine glattere Umschreibung die echte lexikalische und theologische Offenheit des Ausgangstextes einschränken würde.
