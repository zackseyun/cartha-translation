base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/044/019.yaml
  text: Abraham[a], father of a multitude of nations—no blemish was found in his honor.
translation:
  language: de
  text: Abraham, Vater einer Vielzahl von Völkern, ließ keinen Makel auf seine Ehre kommen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Im Griechischen: »Abraham, der große Vater einer Menge von Völkern; und niemand wurde ihm an Herrlichkeit (oder: Ehre) gleich befunden.«'
    reason: Der griechische Paralleltext enthält »groß« und bietet im letzten Satzteil eine deutlich andere Lesart als der hebräische Text.
lexical_decisions:
- source_word: אב
  choice: Vater
  rationale: Das hebräische אב bezeichnet Abraham unmittelbar als »Vater«; dies entspricht auch dem griechischen πατήρ und bewahrt den Anklang an die Verheißung an Abraham.
- source_word: המון גוים
  choice: eine Menge von Völkern
  rationale: Die Formulierung gibt המון als »Menge« und גוים als »Völker« wieder und bewahrt so den sprachlichen Anklang an die abrahamitische Verheißung besser als das schlichtere »viele Völker«.
- source_word: לא נתן ... מום
  choice: ließ keinen Makel ... kommen
  rationale: Wörtlich steht etwa »gab/setzte keinen Makel«. Die deutsche Wendung ist verständlich und bleibt näher an der aktiven hebräischen Formulierung als eine passive Wiedergabe mit »wurde gefunden«.
- source_word: בכבודו
  choice: an seine Ehre
  rationale: כבוד kann »Ehre«, »Herrlichkeit« oder »Ansehen« bedeuten. In Verbindung mit einem Makel ist »Ehre« im Deutschen natürlich; »Herrlichkeit« bleibt durch die Fußnote zur griechischen Lesart sichtbar.
- source_word: מום
  choice: Makel
  rationale: מום bezeichnet einen Fehler oder Makel. »Makel« passt zur Ehre und erhält sowohl die konkrete als auch die übertragene Färbung des Ausdrucks.
theological_decisions:
- issue: Verhältnis des hebräischen zum griechischen Schluss des Verses
  choice: Der hebräische Text wird als Aussage wiedergegeben, dass Abraham keinen Makel an seine Ehre kommen ließ.
  alternative: Der griechische Text sagt, dass niemand Abraham an Herrlichkeit beziehungsweise Ehre gleichkam.
  rationale: Der erhaltene hebräische Text hat Vorrang und nennt ausdrücklich einen »Makel«; der griechische Paralleltext bietet dagegen eine inhaltlich abweichende Lobesaussage. Diese echte Textdifferenz wird nicht harmonisiert, sondern in einer Fußnote offengelegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wendung »ließ keinen Makel an seine Ehre kommen« ist idiomatisch, ohne die schwierige aktive Formulierung des Hebräischen unnötig zu glätten. Der Gedankenstrich der englischen Fassung wurde nicht übernommen; die deutsche Satzstruktur trägt die feierliche Aussage auch mit Kommas klar.
