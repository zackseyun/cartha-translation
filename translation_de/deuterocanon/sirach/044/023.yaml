  text: He established him with a blessing[a], and gave him his inheritance; he set him over the tribes, as twelve divisions.
translation:
  language: de
  text: Er festigte ihn mit einem Segen und gab ihm sein Erbteil; er stellte ihn den Stämmen zu, um [das Erbteil] in zwölf Anteile zu teilen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das Hebräische ist hier stark verkürzt: wörtlich etwa „für die Stämme, um zwölf zu teilen“. Das Objekt „das Erbteil“ und „Anteile“ sind ergänzt. Die griechische Parallelüberlieferung spricht von Anteilen, die unter zwölf Stämmen verteilt werden.'
    reason: Die Fußnote kennzeichnet die syntaktische Ellipse und die ergänzende, von der griechischen Parallelüberlieferung gestützte Deutung, ohne die unklare hebräische Konstruktion als eindeutig auszugeben.
lexical_decisions:
- source_word: ויכוננהו
  choice: Er festigte ihn
  rationale: Die Hifil-Form von כון bezeichnet das Festmachen oder Festigen. „Festigte“ bleibt nahe am Hebräischen und klingt im Deutschen würdig und verständlich.
- source_word: בברכה
  choice: durch einen Segen
  rationale: Die Präposition ב kann hier instrumental verstanden werden. „Durch einen Segen“ gibt diese Wirkung klarer wieder als das im Deutschen mehrdeutige „mit einem Segen“.
- source_word: נחלתו
  choice: sein Erbteil
  rationale: נחלה bezeichnet ein Erbe beziehungsweise einen zugeteilten Besitz. „Erbteil“ passt besonders zum Zusammenhang der späteren Aufteilung und stimmt sachlich mit dem griechischen κληρονομία überein.
- source_word: ויציבהו
  choice: er stellte ihn … auf
  rationale: יצב bedeutet, jemanden hinzustellen oder fest zu positionieren. „Aufstellen“ bewahrt diesen konkreten Grundsinn, ohne eine im Hebräischen nicht ausdrücklich genannte Herrschaftsstellung einzutragen.
- source_word: לשבטים
  choice: für die Stämme
  rationale: Das ל wird formal als „für“ wiedergegeben. Dadurch bleibt offen, wie genau der Genannte zu den Stämmen in Beziehung gesetzt wird.
- source_word: לחלק שנים עשר
  choice: um sie in zwölf Teile zu gliedern
  rationale: Die hebräische Wendung ist stark verkürzt, wörtlich etwa „zum Teilen zwölf“. Die Übersetzung formuliert den naheliegenden Teilungssinn lesbar aus; die Ergänzung des Objekts und die Textunsicherheit werden in einer Fußnote kenntlich gemacht.
theological_decisions:
- issue: Bezug der maskulinen Singularsuffixe
  choice: Die Pronomen bleiben unbenannt und beziehen sich im Zusammenhang auf Jakob/Israel.
  alternative: Der Empfänger des Segens könnte in dieser hebräischen Zeile lediglich allgemein als der zuvor genannte Patriarch verstanden werden.
  rationale: Das Hebräische nennt den Bezugsträger in der vorliegenden Zeile nicht ausdrücklich. Der Kontext und die griechische Parallele weisen auf Jakob, doch die Übersetzung setzt seinen Namen nicht ergänzend ein.
- issue: Verhältnis des Gesegneten zu den zwölf Stämmen
  choice: „für die Stämme aufgestellt“ ohne ausdrückliche Herrschaftsaussage
  alternative: „über die Stämme gesetzt“ oder „unter den Stämmen aufgestellt“
  rationale: Die Präposition ל bezeichnet nicht eindeutig eine Stellung „über“ den Stämmen. Die gewählte Fassung vermeidet es, eine Leitungsfunktion einzutragen, und erhält die Spannung zwischen Person, Stämmen und Aufteilung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt nah am hebräischen Parallelismus; „Erbteil“ und „festigte“ sind bibelsprachlich vertraut, aber gegenwärtig verständlich. Die Fußnote macht die einzige stärkere syntaktische Verdeutlichung transparent.
