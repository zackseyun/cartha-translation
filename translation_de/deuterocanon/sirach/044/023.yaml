- from: Er festigte ihn durch einen Segen und gab ihm sein Erbteil; er stellte ihn für die Stämme auf, um sie in zwölf Teile zu gliedern.[a]
  to: Er festigte ihn mit einem Segen und gab ihm sein Erbteil; er stellte ihn den Stämmen zu, um [das Erbteil] in zwölf Anteile zu teilen.[a]
