  source_fidelity: 'Die erste Satzhälfte gibt ויכוננהו בברכה und נחלתו im Wesentlichen zutreffend wieder. Im Schlusssatz ist die Ergänzung „sie“ jedoch zu bestimmt: Der hebräische Text nennt weder ein Objekt zu לחלק noch ausdrücklich die zwölf Teile. Die griechische Parallele spricht von zugeteilten Anteilen unter zwölf Stämmen und legt daher eher das Erbteil bzw. dessen Anteile als die Stämme selbst nahe.'
  naturalness: „Er stellte ihn für die Stämme auf“ ist im modernen Standarddeutsch unidiomatisch und bleibt in seiner Funktion unklar. „Er stellte ihn den Stämmen zu“ ist natürlicher, ohne eine Herrschaftsstellung zu behaupten. Die eckig ergänzte Bezugsgröße im letzten Infinitivsatz macht die notwendige, aber unsichere Konkretisierung transparent.
  terminology: „Erbteil“ ist für נחלה treffend. „festigte“ ist möglich, aber „festigte ihn durch einen Segen“ klingt weniger natürlich und legt das ב stärker instrumental fest. „Festigte ihn mit einem Segen“ wahrt die mögliche Begleit-/Mittelbedeutung und ist idiomatischer. „Anteile“ entspricht der durch die griechische Parallelüberlieferung gestützten Deutung, ohne daraus einen unmarkierten hebräischen Wortbestandteil zu machen.
  issues:
