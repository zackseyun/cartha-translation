    rationale: Die hebräische Kurzform lässt das Objekt offen. Die griechische Parallelüberlieferung nennt dagegen Anteile, die unter zwölf Stämmen verteilt werden. Die vorliegende Fassung kann daher den Sinn irreführend auf eine Aufteilung der Stämme selbst verengen.
  - severity: medium
    issue: „Er stellte ihn für die Stämme auf“ ist unnatürlich und semantisch unscharf.
    rationale: Die Formulierung ist kein geläufiges deutsches Äquivalent für יצב mit ל und erschwert das Verständnis. Eine Revision soll die offene Zuordnung zu den Stämmen sprachlich tragfähig wiedergeben, ohne „über die Stämme“ einzutragen.
