base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/044/008.yaml
  text: Some of them left behind a name[a], to be praised among their inheritance.
translation:
  language: de
  text: Einige von ihnen hinterließen einen Namen, damit man in ihrem Erbteil ihr Lob erzählt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich »in ihrem Erbteil«. Gemeint sein können ihr Erbe oder ihre Nachkommen, unter denen ihr Andenken fortlebt. Die griechische Überlieferung hebt hervor, dass ihr Lob weitererzählt wird.
    reason: lexical_alternative
lexical_decisions:
- source_word: יש מהם
  choice: Einige von ihnen
  rationale: Die partitive Wendung bezeichnet eine Teilgruppe der zuvor genannten ruhmreichen Vorfahren.
- source_word: הניחו
  choice: hinterließen
  rationale: Das Verb bezeichnet hier etwas, das nach dem Tod bestehen bleibt; im Zusammenhang ist der bleibende Name gemeint.
- source_word: שם
  choice: einen Namen
  rationale: Die konkrete hebräische Redeweise bleibt erhalten; »Name« schließt hier Ansehen und bleibendes Andenken ein.
- source_word: להשתענות
  choice: sodass man … ihr Lob verkündet
  rationale: Die schwierige Form wird im Sinn lobender Erwähnung verstanden. Die griechische Parallele mit »Lobpreisungen erzählen« stützt eine Wiedergabe als Verkündigen beziehungsweise Erzählen ihres Lobes.
- source_word: בנחלתם
  choice: in ihrem Erbteil
  rationale: Die örtlich-sphärische Formulierung des Hebräischen wird bewahrt, ohne sie eindeutig auf Nachkommen oder kulturelles Erbe festzulegen.
theological_decisions:
- issue: Erinnerungssprache von »Name« und »Erbteil«
  choice: Die konkreten Bilder »Name« und »Erbteil« werden beibehalten.
  alternative: Einige von ihnen hinterließen Ruhm, sodass ihre Nachkommen ihr Lob erzählten.
  rationale: Die bildhafte biblische Sprache soll nicht vollständig zu »Ruhm« und »Nachkommen« abstrahiert werden. Zugleich erläutert die Fußnote die mögliche Bedeutung von »Erbteil«.
- issue: Aktive oder passive Fassung der lobenden Erinnerung
  choice: 'Aktive, unpersönliche Form: »sodass man … ihr Lob verkündet«'
  alternative: »um … gepriesen zu werden«
  rationale: Die hebräische Form ist schwierig. Die griechische Parallele spricht ausdrücklich vom Erzählen der Lobpreisungen und gibt damit der aktiven Wiedergabe zusätzliches Gewicht, ohne die lobende Funktion zu verändern.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur ist gut verständlich, während die biblisch geprägten Schlüsselwörter »Name« und »Erbteil« erhalten bleiben.
