  text: Their remembrance will stand forever[a], and their righteousness will not be forgotten.
translation:
  language: de
  text: Ihr Andenken wird für immer bestehen[a], und ihre Gerechtigkeit wird nicht vergessen werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Fassung lautet: „Ihre Nachkommenschaft wird für immer bestehen, und ihr Ruhm wird nicht ausgelöscht werden.“ Auch die Masada-Rolle liest hier anstelle von „ihr Andenken“ „ihre Nachkommenschaft“ (wörtlich: „ihr Same“).'
    reason: textual_variant
lexical_decisions:
- source_word: זכרם
  choice: ihr Andenken
  rationale: זֵכֶר bezeichnet die bleibende Erinnerung beziehungsweise das ehrende Andenken. „Andenken“ gibt das hebräische Substantiv natürlich und würdig wieder.
- source_word: יעמד
  choice: wird bestehen
  rationale: עמד bedeutet wörtlich „stehen“, bezeichnet hier aber das dauerhafte Fortbestehen. „Wird bestehen“ bewahrt das Bild in idiomatischem Deutsch.
- source_word: עד עולם
  choice: für immer
  rationale: Die feste Wendung bezeichnet unbegrenzte Dauer; „für immer“ ist im modernen Standarddeutsch klar und natürlich.
- source_word: וצדקתם
  choice: und ihre Gerechtigkeit
  rationale: צדקה kann Gerechtigkeit, Rechtschaffenheit oder gerechtes Handeln bezeichnen. „Gerechtigkeit“ ist die formal nächste Wiedergabe und lässt die semantische Weite bestehen.
- source_word: לא תשכח
  choice: wird nicht vergessen werden
  rationale: Die passive Form wird unmittelbar wiedergegeben und bildet einen natürlichen Parallelismus zu dem fortbestehenden Andenken.
theological_decisions:
- issue: Textabweichung zwischen dem Kairo-Geniza-Hebräisch und der griechischen beziehungsweise Masada-Überlieferung
  choice: Im Haupttext wird die erhaltene hebräische Lesart der Kairo-Geniza mit „ihr Andenken“ und „ihre Gerechtigkeit“ übersetzt.
  alternative: „Ihre Nachkommen werden für immer bleiben, und ihr Ruhm wird nicht ausgelöscht werden.“
  rationale: Die vorgelegte hebräische Hauptquelle ist klar bezeugt und erhält für den Haupttext Vorrang. Da die griechische Parallele und die Masada-Rolle eine inhaltlich erhebliche andere Textform bezeugen, wird diese transparent in einer Fußnote erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Parallelismus und die knappe Aussageform des Hebräischen bleiben erhalten; „Gerechtigkeit“ wird nicht interpretierend auf „gerechte Taten“ verengt.
