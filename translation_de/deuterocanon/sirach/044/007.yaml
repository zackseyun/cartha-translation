translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Zu ihrer jeweiligen Zeit“ gibt das hebräische Generationenidiom natürlich wieder; „in ihren Tagen“ und „ein Ruhm“ bewahren bewusst den feierlichen Klang und die knappe Spannung der Vorlage.
