  text: All these were honored in their generations[a], and in their days they were a glory.
translation:
  language: de
  text: Sie alle waren in ihrer Zeit hoch angesehen, und in ihren Tagen waren sie ein Ruhm.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das Hebräische formuliert knapp und ohne ausdrückliches Verb, wörtlich etwa: „und in ihren Tagen ihr Ruhm“. Die griechische Parallele hat entsprechend eine knappe Nominalaussage: „und in ihren Tagen ein Ruhm/Grund zum Rühmen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כל אלה
  choice: Sie alle
  rationale: Die Wendung fasst die zuvor genannten Personen zusammen. „Sie alle“ ist im Deutschen natürlich und fügt keine im Hebräischen nicht ausdrücklich genannte Geschlechtsbezeichnung hinzu.
- source_word: בדורם
  choice: zu ihrer jeweiligen Zeit
  rationale: Wörtlich steht „in ihrer Generation“. Die idiomatische deutsche Wiedergabe bezeichnet die geschichtliche Zeit, der jede der genannten Personen angehörte; „jeweiligen“ wahrt die verteilende Bedeutung.
- source_word: ומימיהם
  choice: und in ihren Tagen
  rationale: Die Präposition wird hier, gestützt durch die griechische Parallele ἐν ταῖς ἡμέραις αὐτῶν, zeitlich verstanden. Die biblisch geprägte, aber weiterhin verständliche Formulierung bewahrt die Wiederholung des Zeitbezugs.
- source_word: תפארתם
  choice: waren sie ein Ruhm
  rationale: תפארת bezeichnet Ruhm, Herrlichkeit, Glanz oder eine Zierde. „Ein Ruhm“ bringt zum Ausdruck, dass diese Personen selbst ihrer Zeit zur Ehre gereichten, ohne die Aussage auf bloße äußere Pracht zu verengen.
