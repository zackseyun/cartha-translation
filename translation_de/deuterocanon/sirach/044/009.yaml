base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/044/009.yaml
  text: And there are some for whom there is no remembrance[a], they ceased to be, just as they had ceased, as though they had never existed, and so did their children after them.
translation:
  language: de
  text: Es gibt manche unter ihnen, an die sich niemand erinnert[a]; sie hörten auf, wie sie aufhörten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hebräische Text lautet wörtlich etwa: „Und manche von ihnen haben kein Gedenken, und sie hörten auf, wie sie aufhörten.“ Die Wiederholung im zweiten Satzteil ist im Hebräischen knapp und schwer zu deuten. Die griechische Parallelüberlieferung bietet eine längere Fassung: „Sie gingen zugrunde, als hätten sie nicht existiert … und ihre Kinder nach ihnen.“ Diese Zusätze stehen nicht im erhaltenen hebräischen Textzeugen.'
    reason: textual_variant
lexical_decisions:
- source_word: ויש מהם
  choice: Von manchen aber
  rationale: Die partitive Wendung bezeichnet eine Gruppe innerhalb der zuvor genannten Vorfahren. „Von manchen aber“ ist im Deutschen natürlich und markiert zugleich den Gegensatz zu den berühmten Männern.
- source_word: אשר אין לו זכר
  choice: gibt es keine Erinnerung
  rationale: זכר kann Erinnerung oder Gedenken bezeichnen. „Keine Erinnerung“ bewahrt hier den abstrakten Sinn und stimmt mit dem griechischen μνημόσυνον überein, ohne ein konkretes Denkmal vorauszusetzen.
- source_word: וישבתו
  choice: Sie verschwanden
  rationale: Das Verb שבת bezeichnet hier ein Aufhören oder Zu-Ende-Sein. „Verschwanden“ gibt im Zusammenhang das Erlöschen aus Erinnerung und Dasein wieder, ohne einen gewaltsamen Tod zu behaupten.
- source_word: כאשר שבתו
  choice: als hätten sie nie existiert
  rationale: Der überlieferte hebräische Wortlaut ist stark verkürzt und wörtlich etwa „wie sie aufhörten“. Die griechische Parallelüberlieferung erläutert den Gedanken mit ὡς οὐχ ὑπάρξαντες; die deutsche Fassung folgt dieser verständlicheren Entfaltung.
- source_word: καὶ τὰ τέκνα αὐτῶν μετʼ αὐτούς
  choice: und ebenso ihre Kinder nach ihnen
  rationale: Dieser im erhaltenen Hebräisch fehlende, aber in der griechischen Parallelüberlieferung vorhandene Satzteil führt denselben Gedanken knapp auf die Nachkommen weiter.
