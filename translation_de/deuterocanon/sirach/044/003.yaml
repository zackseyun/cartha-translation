translation:
  language: de
  text: Herrscher des Landes in ihren Königreichen[a] und Männer von Ansehen wegen ihrer Stärke; Ratgeber mit ihrer Einsicht und Seher von allem in ihrer prophetischen Rede.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die hebräische Wendung דורי ארץ ist schwer zu deuten. Die griechische Parallele lautet: „die in ihren Königreichen Herrschaft ausübten“; dies stützt die Übersetzung „Herrscher des Landes“.'
    reason: alternative_reading
  - marker: b
    text: 'Das Hebräische ist hier knapp und kann auch „Seher von allem“ bedeuten. Die griechische Parallele lautet dagegen: „die in Weissagungen verkündeten“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דורי ארץ
  choice: Herrscher des Landes
  rationale: Die hebräische Wortgruppe ist schwierig. Der Zusammenhang mit במלכותם und die griechische Parallele κυριεύοντες sprechen für politische Herrschaft. „Des Landes“ bezeichnet hier den konkreten Herrschaftsbereich, ohne die Wendung unnötig auf die ganze Erde auszuweiten.
- source_word: במלכותם
  choice: in ihren Königreichen
  rationale: מלכות kann Königtum, Herrschaft, Regierungszeit oder Königreich bedeuten. Der Plural „Königreiche“ passt zum politischen Bild und entspricht der griechischen Parallele βασιλείαις.
- source_word: אנשי שם
  choice: Männer von Ansehen
  rationale: Wörtlich „Männer des Namens“; die hebräische Wendung bezeichnet angesehene oder berühmte Männer. Die ausdrückliche maskuline Form bleibt erhalten.
- source_word: בגבורתם
  choice: durch ihre Macht
  rationale: גבורה bezeichnet Stärke, Macht oder heldenhafte Tatkraft. „Macht“ wahrt den breiten Sinn und passt zum griechischen ἐν δυνάμει.
- source_word: היועצים
  choice: Ratgeber
  rationale: Die substantivisch gebrauchte Partizipialform bezeichnet Menschen, die Rat erteilen. „Ratgeber“ ist knapp, verständlich und dem katalogartigen Stil angemessen.
- source_word: בתבונתם
  choice: mit ihrer Einsicht
  rationale: תבונה bedeutet Verständnis, Einsicht oder Urteilsvermögen. „Mit ihrer Einsicht“ klingt im Deutschen natürlich und drückt das Mittel beziehungsweise die Grundlage ihres Ratgebens aus.
- source_word: וחוזי כל
  choice: und Seher aller Dinge
  rationale: חוזי bezeichnet Seher. Das knappe כל hat im Hebräischen kein ausdrücklich genanntes Bezugswort; „aller Dinge“ erhält dessen umfassende, zugleich schwierige Aussage, ohne sie auf einen bestimmten Gegenstand festzulegen.
- source_word: בנבואתם
  choice: durch ihre Prophetie
  rationale: נבואה kann Prophetie, Weissagung oder prophetische Rede bezeichnen. „Durch ihre Prophetie“ bewahrt den abstrakten Singular und verbindet die Wendung verständlich mit der Tätigkeit der Seher.
theological_decisions:
- issue: Maskuline Sprache in der Aufzählung geehrter Vorfahren
  choice: Männer von Ansehen
  alternative: angesehene Menschen / die Angesehenen
  rationale: אנשי ist ausdrücklich maskulin. Diese Form wird nicht neutralisiert, da der Ausgangstext hier Männer bezeichnet.
- issue: Umfang des prophetischen Sehens
  choice: Seher aller Dinge durch ihre Prophetie
  alternative: Verkünder in Weissagungen
  rationale: Der schwierige hebräische Text spricht von „Sehern“ und enthält das umfassende כל. Die griechische Parallele betont dagegen das Verkünden in Prophetien. Die Hauptübersetzung folgt dem hebräischen Quellenzeugnis und weist die abweichende Nuance der griechischen Überlieferung in einer Fußnote aus.
translation_notes:
  register: Moderner, würdevoller Standardstil mit der knappen Reihung eines Lobkatalogs. Die Parallelstruktur bleibt durch die Nominalgruppen erhalten; schwierige Stellen werden nicht stillschweigend geglättet, sondern im Text möglichst nah am Hebräischen und ergänzend in Fußnoten wiedergegeben.
