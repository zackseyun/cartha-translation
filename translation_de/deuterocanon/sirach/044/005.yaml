translation:
  language: de
  text: die Lieder nach fester Ordnung erforschten[a] und Sprüche[b] schriftlich niederlegten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die hebräische Wendung „nach fester Ordnung“ ist schwierig. Die griechische Fassung spricht vom Erforschen musikalischer Lieder oder Stücke und stützt damit einen Bezug auf kunstvoll gestalteten Gesang.
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort kann neben „Sprüchen“ auch Gleichnisse oder Weisheitssprüche bezeichnen; die griechische Fassung hat allgemeiner „Aussprüche“ oder „Verse“.
    reason: alternative_reading
lexical_decisions:
- source_word: חוקרי
  choice: erforschten
  rationale: Das Partizip von חקר bezeichnet ein gründliches Suchen oder Erforschen. Im deutschen Satz wird es entsprechend der fortlaufenden Aufzählung in Sirach 44 als Relativsatzbestandteil im Präteritum wiedergegeben.
- source_word: מזמור
  choice: Lieder
  rationale: מזמור kann Lied oder Psalm bezeichnen. „Lieder“ vermeidet eine unnötige Beschränkung auf kultische oder kanonische Psalmen und stimmt mit dem musikalischen Kontext der griechischen Parallele überein.
- source_word: על חוק
  choice: nach fester Ordnung
  rationale: חוק bezeichnet eine Festsetzung, Regel oder bestimmte Ordnung. In diesem dichterisch-musikalischen Zusammenhang gibt „nach fester Ordnung“ den Gedanken geregelter Gestaltung wieder, ohne die schwierige Wendung vorschnell auf ein Gesetz oder eine konkrete Satzung festzulegen.
- source_word: נושאי
  choice: niederlegten
  rationale: נשא bedeutet wörtlich „tragen“ und kann hier das Hervorbringen oder Darbieten von Sprüchen bezeichnen. Zusammen mit בכתב ist „schriftlich niederlegten“ im Deutschen natürlich und bewahrt den Gedanken, dass die Sprüche in eine schriftliche Form gebracht wurden.
- source_word: משל
  choice: Sprüche
  rationale: משל umfasst Spruch, Gleichnis und Weisheitsspruch. Im weisheitlichen Zusammenhang ist „Sprüche“ die naheliegende, bewusst nicht überpräzisierte Wiedergabe.
- source_word: בכתב
  choice: schriftlich
  rationale: Die Wendung bedeutet unmittelbar „in Schrift“ oder „schriftlich“. Auch die griechische Parallele ἐν γραφῇ bestätigt das schriftliche Medium.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallelen Tätigkeiten werden knapp und rhythmisch formuliert. „Nach fester Ordnung“ wahrt die erkennbare Bedeutung von חוק und zugleich die Unsicherheit der ungewöhnlichen hebräischen Wendung; die Fußnote dokumentiert die griechische Parallele.
