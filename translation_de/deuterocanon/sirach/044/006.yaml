  text: Men of valor[a], steadfast in strength, and at ease in their place.
translation:
  language: de
  text: Männer von Tatkraft[a], fest in ihrer Stärke und ruhig an ihrem Ort.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Text lautet: »reiche Männer, mit Stärke ausgestattet, die in ihren Siedlungen in Frieden lebten«. Hier wird vorrangig dem Hebräischen gefolgt; das Griechische dient als Vergleichstext.'
    reason: alternative_reading
lexical_decisions:
- source_word: אנשי חיל
  choice: Männer von Tatkraft
  rationale: Die Wendung bezeichnet tüchtige, kraftvolle oder angesehene Männer. »Männer von Tatkraft« bewahrt den anerkennenden, nicht ausschließlich militärischen Sinn des Hebräischen; der abweichende griechische Paralleltext wird in der Fußnote dokumentiert.
- source_word: וסמכי כח
  choice: fest in ihrer Stärke
  rationale: סמכי wird hier im Sinn festen Gegründet- oder Gefestigtseins verstanden, כח als Stärke beziehungsweise Kraft. Die Formulierung bleibt nahe am Hebräischen, ohne das wenig wahrscheinliche »Stützen der Kraft« zu erzwingen.
- source_word: ושוקטים
  choice: ungestört
  rationale: Das Partizip bezeichnet Ruhe, Sicherheit und friedliche Ungestörtheit. »Ungestört« passt natürlich zur Ortsangabe und lässt sowohl Ruhe als auch Frieden anklingen.
- source_word: על מכונתם
  choice: an ihrem Ort
  rationale: מכונה kann einen festen Ort, Stand oder eine eingerichtete Stätte bezeichnen. »An ihrem Ort« bewahrt die Weite des hebräischen Ausdrucks und vermeidet die durch den griechischen Paralleltext nahegelegte, aber enger gefasste Deutung »in ihren Wohnstätten«.
