translation:
  language: de
  text: Mit ihren Nachkommen bleibt ihr Gut bestehen[a], und ihr Erbe ist für ihre Kindeskinder bestimmt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Griechisch: „Ihre Nachkommen standen in den Bündnissen, und ihre Kinder um ihretwillen.“ Auch der ältere hebräische Zeuge aus Masada spiegelt anstelle der Formulierung der Kairoer Geniza über „ihr Gut“ und „ihr Erbe“ eine auf den Bund bezogene Lesart wider.'
    reason: alternative_reading
lexical_decisions:
- source_word: עם זרעם
  choice: bei ihren Nachkommen
  rationale: עם bezeichnet hier die Verbindung des fortbestehenden Gutes mit den Nachkommen. „Bei ihren Nachkommen“ gibt den knappen hebräischen Zusammenhang im Deutschen natürlich wieder.
- source_word: נאמן
  choice: bleibt … bestehen
  rationale: נאמן bezeichnet Festigkeit, Verlässlichkeit und dauerhaften Bestand. Die verbale Wiedergabe entspricht der elliptischen hebräischen Formulierung und klingt im Deutschen idiomatisch.
- source_word: טובם
  choice: ihr Gut
  rationale: טוב kann Gutes, Wohlergehen oder Besitz bezeichnen. „Ihr Gut“ wahrt diese Breite besser als die engeren Begriffe „Wohlstand“ oder „Güte“.
- source_word: ונחלתם
  choice: und ihr Erbe
  rationale: נחלה bezeichnet ein Erbe beziehungsweise ein überliefertes Erbgut; „Erbe“ bewahrt den familiären und generationenübergreifenden Sinn.
- source_word: לבני בניהם
  choice: ihren Kindeskindern
  rationale: Wörtlich steht „den Söhnen ihrer Söhne“. „Kindeskinder“ gibt die generationenübergreifende, generisch gebrauchte Wendung prägnant und ohne unnötige Beschränkung auf männliche Nachkommen wieder.
theological_decisions:
- issue: Cairo-Geniza-Hebräisch gegenüber der griechischen Parallelüberlieferung und dem älteren Masada-Zeugen
  choice: 'Der Haupttext folgt der erhaltenen hebräischen Fassung: Das Gut und das Erbe der Vorfahren bestehen bei ihren Nachkommen fort.'
  alternative: „Ihre Nachkommen hielten an den Bündnissen fest, und ihre Kinder um ihretwillen.“
  rationale: Da der hebräische Text erhalten und mit hoher Sicherheit bezeugt ist, bildet er die Grundlage der Übersetzung. Die griechische und die ältere Masada-Überlieferung bieten jedoch eine deutlich bundesorientierte Lesart; diese echte Textspannung wird in der Fußnote sichtbar gemacht, statt sie im Haupttext aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Parallelstruktur des Hebräischen bleibt erhalten; „Gut“ wahrt bewusst die Bedeutungsbreite zwischen dem Guten, Wohlergehen und Besitz.
