translation:
  language: de
  text: Die Gemeinschaft trägt ihre Weisheit wiederholt vor[a][b], und die Versammlung erzählt von ihrem Lob.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hebräische Text lautet wörtlich etwa: „Ihre Weisheit wiederholt die Gemeinschaft, und ihr Lob erzählt die Versammlung.“ Der griechische Paralleltext hat: „Völker werden ihre Weisheit erzählen, und die Versammlung verkündet ihr Lob.“ Hier wird dem Hebräischen als dem vorrangigen Textzeugen gefolgt; die weitere Subjektangabe des Griechischen („Völker“) bleibt als abweichende Überlieferung vermerkt.'
    reason: alternative_reading
  - marker: b
    text: Die Masada-Rolle ist an dieser Stelle nur bruchstückhaft erhalten. Von diesem Vers bewahrt sie lediglich die Schlusswendung, die „ihr Lob … Versammlung/Gemeinde“ entspricht, nicht aber die vollständige Zeile.
    reason: textual_variant
lexical_decisions:
- source_word: חכמתם
  choice: ihre Weisheit
  rationale: Die Possessivform von חכמה wird unmittelbar und ohne erklärende Erweiterung wiedergegeben.
- source_word: תשנה
  choice: wird … immer wieder erzählt
  rationale: שנה bezeichnet hier das Wiederholen oder erneute Vortragen. Die passive Form ergibt im Deutschen einen natürlichen Satz und lässt zugleich den Gedanken öffentlicher Weitererzählung erkennen.
- source_word: עדה
  choice: Gemeinschaft
  rationale: עדה bezeichnet die versammelte Gemeinschaft. „Gemeinschaft“ ist hier natürlich und wird von קהל im zweiten Halbvers unterschieden.
- source_word: ותהלתם
  choice: und von ihrem Lob
  rationale: תהלה meint das über die Genannten ausgesprochene Lob. Die Konstruktion mit „von“ entspricht idiomatischem Deutsch bei „berichten“.
- source_word: יספר
  choice: berichtet
  rationale: ספר bezeichnet hier das Erzählen oder öffentliche Berichten. Das aktive Verb wahrt die im Hebräischen erkennbare Rolle von קהל als handelndem Kollektiv.
- source_word: קהל
  choice: Versammlung
  rationale: קהל bezeichnet das versammelte Volk beziehungsweise die Versammlung. Die Wahl bewahrt den poetischen Parallelismus, ohne עדה und קהל mit demselben deutschen Wort wiederzugeben.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Immer wieder erzählt“ gibt den Wiederholungs- beziehungsweise Rezitationssinn von תשנה natürlicher wieder als das missverständliche „wird wiederholt“. „Gemeinschaft“ und „Versammlung“ erhalten die beiden parallelen hebräischen Kollektivbegriffe unterscheidbar.
