translation:
  language: de
  text: 'der die Gebote des Höchsten hielt

    und mit ihm in einen Bund trat.


    An seinem Fleisch[a] setzte er ihm eine Satzung fest[b],

    und in der Prüfung wurde er als treu befunden.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „An seinem Fleisch“ spielt wahrscheinlich auf die Beschneidung als leibliches Zeichen des Bundes mit Abraham an.
    reason: cross_reference
  - marker: b
    text: 'Der griechische Paralleltext lautet: „In seinem Fleisch setzte er einen Bund fest.“ Der hebräische Text hat hier „Satzung“.'
    reason: alternative_reading
lexical_decisions:
- source_word: שמר מצות עליון
  choice: die Gebote des Höchsten hielt
  rationale: „Gebote halten“ ist im Deutschen die natürliche und zugleich textnahe Wiedergabe für die treue Befolgung der Gebote; der Gottesname bleibt als „der Höchste“ erhalten.
- source_word: ובא בברית עמו
  choice: und mit ihm in einen Bund trat
  rationale: Das hebräische „in einen Bund kommen“ bezeichnet hier den Eintritt in eine Bundesbeziehung. „In einen Bund treten“ ist modernes, würdevolles Deutsch und lässt die Pronomenreferenz unverändert.
- source_word: בבשרו
  choice: An seinem Fleisch
  rationale: Die konkrete körperliche Ausdrucksweise bleibt erhalten. „An“ klingt im Deutschen bei einem am Körper vollzogenen Bundeszeichen natürlicher als das missverständliche „in seinem Fleisch“.
- source_word: כרת לו חק
  choice: setzte er ihm eine Satzung fest
  rationale: חק bedeutet „Satzung/feste Ordnung“. כרת heißt wörtlich „schneiden“, kann in verbindlichen Rechtshandlungen jedoch idiomatisch gebraucht werden; die Wiedergabe vermeidet die im Deutschen unverständliche Formulierung „eine Satzung schneiden“, ohne die hebräische Lesart durch das griechische „Bund“ zu ersetzen.
- source_word: בניסוי
  choice: in der Prüfung
  rationale: Die Formulierung bezeichnet eine Erprobung und nicht notwendig eine sittliche Versuchung; die substantivische Gestalt des Hebräischen bleibt gewahrt.
- source_word: נמצא נאמן
  choice: wurde er als treu erfunden
  rationale: Die formale Wendung bewahrt das Motiv, dass sich seine Treue in der Prüfung zeigte. „Treu“ gibt die bundesbezogene Verlässlichkeit von נאמן angemessen wieder.
theological_decisions:
- issue: Bezug der leiblichen Sprache auf Abrahams Beschneidung
  choice: Die körperliche und bundesbezogene Sprache bleibt knapp und anspielungsreich; die Beschneidung wird nur in einer Fußnote benannt.
  alternative: 'Explizit übersetzen: „Er empfing an seinem Körper die Beschneidung als Zeichen des Bundes.“'
  rationale: Der Kontext legt die Beschneidung nahe, doch der Vers selbst nennt sie nicht ausdrücklich. Eine erklärende Paraphrase würde die Anspielung interpretativ auflösen.
- issue: Abweichung zwischen hebräischem und griechischem Text in der dritten Aussage
  choice: Der Haupttext folgt dem hebräischen חק mit „Satzung“; die griechische Lesart „Bund“ erscheint in einer Fußnote.
  alternative: „An seinem Fleisch errichtete er einen Bund.“
  rationale: Der erhaltene hebräische Text hat Vorrang, während die sachlich bedeutsame griechische Abweichung für die Leser sichtbar bleiben muss.
- issue: Mehrdeutigkeit der Pronomen und des Handelnden
  choice: Die Pronomen „seinem“, „er“ und „ihm“ werden nicht durch Eigennamen oder eindeutige Umschreibungen ersetzt.
  alternative: Gott oder Abraham jeweils ausdrücklich als Handelnden benennen.
  rationale: Der knappe hebräische Wortlaut lässt die Bezüge grammatisch unausgeführt. Die Übersetzung soll diese Spannung nicht stillschweigend entscheiden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst knapper Weisheits- und Bundessprache. Die syntaktische Parallelität und die Pronomen des Hebräischen bleiben erhalten; schwer verständliche Wörtlichkeit wird nur dort idiomatisch geglättet, wo sie im Deutschen den Sinn verdunkeln würde.
