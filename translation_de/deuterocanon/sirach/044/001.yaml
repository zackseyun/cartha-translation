  text: Let us now praise godly men[a], our fathers in their generations.
translation:
  language: de
  text: Ich will nun Männer von treuer Liebe preisen[a], unsere Väter in ihren Generationen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Text lautet: »Lasst uns nun ruhmreiche Männer preisen und unsere Väter in ihrem Geschlecht.«'
    reason: Der griechische Paralleltext unterscheidet sich sowohl bei der Person des Verbs als auch bei der Beschreibung der Männer und beim Numerus von »Generation« vom erhaltenen hebräischen Text.
lexical_decisions:
- source_word: אהללה נא
  choice: Ich will nun … preisen
  rationale: Die überlieferte hebräische Form ist ein Kohortativ der ersten Person Singular und wird daher als persönliche Ankündigung wiedergegeben. נא setzt hier den fortschreitenden Einsatz der Rede ab und wird mit »nun« ausgedrückt. Der griechische Paralleltext hat dagegen die auffordernde Mehrzahl »Lasst uns nun preisen«; diese Abweichung wird in der Fußnote bewahrt.
- source_word: אנשי חסד
  choice: Männer treuer Liebe
  rationale: חסד bezeichnet Güte und Liebe mit dem Beiklang beständiger Treue. »Treue Liebe« hält diese Bedeutungsfülle eher offen als das verengende »fromme Männer« oder das schwächere »gütige Männer«. Der griechische Paralleltext bietet stattdessen »ruhmreiche Männer«.
- source_word: אבותינו
  choice: unsere Väter
  rationale: Die konkrete männliche Verwandtschafts- und Traditionsbezeichnung des Hebräischen wird beibehalten; »unsere Vorfahren« wäre verständlich, aber weniger formnah.
- source_word: בדורותם
  choice: in ihren Generationen
  rationale: Die Wiedergabe erhält sowohl die Präposition als auch den hebräischen Plural und lässt offen, ob die jeweiligen Geschlechterfolgen oder geschichtlichen Zeitalter gemeint sind.
theological_decisions:
- issue: Charakterisierung der geehrten Männer im hebräischen und griechischen Text
  choice: Männer treuer Liebe
  alternative: ruhmreiche Männer
  rationale: Wo der hebräische Sirachtext erhalten ist, erhält er im Haupttext Vorrang. Die griechische Lesart kann auf einer anderen Vorlage oder einer deutenden Übersetzung beruhen und wird wegen ihres inhaltlichen Gewichts in der Fußnote ausdrücklich genannt.
- issue: Singularische Selbstankündigung im Hebräischen gegenüber gemeinschaftlicher Aufforderung im Griechischen
  choice: Ich will nun … preisen
  alternative: Lasst uns nun … preisen
  rationale: Der hebräische Kohortativ der ersten Person Singular wird nicht stillschweigend an den griechischen Hortativ Plural angeglichen. Die gut bezeugte griechische Alternative bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die leicht feierliche Wendung »Männer treuer Liebe« bewahrt die Bedeutungsweite von חסד; die ungewöhnliche, aber verständliche Formulierung »in ihren Generationen« hält den hebräischen Plural und seine zeitliche Offenheit fest.
