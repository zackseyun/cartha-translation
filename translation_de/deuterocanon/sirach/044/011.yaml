  text: But these are men of steadfast love[b][a], and their hope will not cease.
translation:
  language: de
  text: Doch diese sind Männer voller Güte[b], und ihre Hoffnung wird nicht aufhören.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Parallelüberlieferung lautet: „Mit ihren Nachkommen bleibt ein gutes Erbe bestehen, ihre Nachkommen.“ Der hebräische Text aus der Kairoer Geniza liest hier dagegen: „Diese sind Männer voller Güte, und ihre Hoffnung wird nicht aufhören.“ Auch die Masada-Überlieferung bietet im näheren Zusammenhang einen abweichenden Wortlaut, bei dem Nachkommen und Fortbestand im Mittelpunkt stehen.'
    reason: textual_variant
  - marker: b
    text: 'Oder: „beständiger Liebe“, „Barmherzigkeit“ oder „Treue“; das hebräische Wort חסד umfasst Güte, liebevolle Zuwendung und Loyalität.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאוּלָם
  choice: Doch
  rationale: Gibt den adversativen Übergang zum vorausgehenden Zusammenhang knapp und in würdigem, modernem Deutsch wieder.
- source_word: אֵלֶּה
  choice: diese
  rationale: Entspricht unmittelbar dem hebräischen Demonstrativpronomen und verweist auf die hier hervorgehobenen Vorfahren.
- source_word: אַנְשֵׁי
  choice: Männer von
  rationale: Bewahrt die grammatisch maskuline Bezeichnung für die genannten Vorfahren, ohne sie zu verallgemeinern.
- source_word: חֶסֶד
  choice: treuer Liebe
  rationale: Erfasst sowohl die Zuwendung als auch die Beständigkeit und Loyalität von חסד; die semantische Spannweite wird in einer Fußnote offengehalten.
- source_word: וְתִקְוָתָם
  choice: und ihre Hoffnung
  rationale: Gibt das Substantiv תקוה samt Possessivsuffix direkt und natürlich wieder.
- source_word: לֹא תִשְׁבֹּת
  choice: wird nicht aufhören
  rationale: Bewahrt die Grundbedeutung von שבת als Aufhören oder Zum-Stillstand-Kommen, ohne näher festzulegen, wie sich die Hoffnung erfüllt oder fortbesteht.
theological_decisions:
- issue: Deutliche Textabweichung zwischen dem hebräischen Kairo-Geniza-Text und der griechischen Parallelüberlieferung
  choice: 'Der erhaltene hebräische Wortlaut bildet den Haupttext: „Doch diese sind Männer von treuer Liebe, und ihre Hoffnung wird nicht aufhören.“'
  alternative: 'Die griechische Überlieferung lautet sinngemäß: „Bei ihren Nachkommen bleibt ein herrliches Erbe, ihre Nachkommenschaft.“'
  rationale: Wo ein hebräischer Sirach-Text erhalten ist, wird er als primäre Ausgangsbasis übersetzt. Die erheblich abweichende griechische Lesart wird nicht eingemischt oder harmonisiert, sondern transparent in der Fußnote dokumentiert.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. „Treue Liebe“ bewahrt die relationale Dichte des hebräischen חסד; die deutlich abweichende griechische Texttradition bleibt in der Fußnote sichtbar.
