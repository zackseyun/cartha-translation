base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/044/010.yaml
  text: But these were men of mercy, whose righteous deeds[b] were not forgotten;
translation:
  language: de
  text: Doch diese waren Männer der Barmherzigkeit, deren gerechte Taten[b] nicht vergessen wurden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der erhaltene hebräische Text aus der Kairoer Geniza ist hier schwierig und scheint nicht recht zu dieser Stelle zu passen. Wörtlicher lautet er etwa: „Als wären sie nicht gewesen, waren sie, und ihre Kinder nach ihnen.“ Der Haupttext folgt deshalb dem in diesem Zusammenhang schlüssigen griechischen Paralleltext.'
    reason: textual_variant
  - marker: b
    text: 'Oder: „Taten der Gerechtigkeit“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλʼ ἢ / כאשר
  choice: Doch diese
  rationale: Die überlieferte hebräische Zeile ist an dieser Stelle schwierig und offenbar nicht passend zugeordnet; der griechische Paralleltext bietet einen kohärenten Gegensatz zu den zuvor erwähnten Vergessenen. „Doch diese“ gibt diesen Übergang natürlich wieder.
- source_word: ἄνδρες
  choice: Männer
  rationale: Das griechische Wort ist ausdrücklich maskulin und bezeichnet hier die genannten Vorfahren.
- source_word: ἐλέους
  choice: der Barmherzigkeit
  rationale: Die Genitivfügung wird bewusst erhalten; sie kennzeichnet diese Männer als von Barmherzigkeit geprägt.
- source_word: δικαιοσύναι
  choice: gerechte Taten
  rationale: Der griechische Plural bezeichnet konkrete Erweise von Gerechtigkeit; „gerechte Taten“ ist verständlich und bewahrt diesen praktischen Sinn.
- source_word: οὐκ ἐπελήσθησαν
  choice: nicht vergessen wurden
  rationale: Dies entspricht dem einfachen Sinn des griechischen Verbs und dem unmittelbaren Zusammenhang des Erinnerns und Vergessens.
theological_decisions:
- issue: Spannung zwischen dem erhaltenen hebräischen Text und dem griechischen Paralleltext
  choice: Der Haupttext folgt dem kohärenten griechischen Paralleltext und kennzeichnet die Textfrage in einer Fußnote.
  alternative: „Als wären sie nicht gewesen, waren sie, und ihre Kinder nach ihnen.“
  rationale: Das Hebräische hat grundsätzlich Vorrang, doch die hier überlieferte Zeile wirkt beschädigt oder an dieser Stelle falsch zugeordnet und ergibt im Verszusammenhang keinen verlässlichen Sinn. Der griechische Text ist kohärent und setzt den Gegensatz zum vorherigen Vers fort. Die Unsicherheit wird nicht verschwiegen.
- issue: Bedeutung des Plurals δικαιοσύναι
  choice: gerechte Taten
  alternative: Taten der Gerechtigkeit
  rationale: Der Plural wird als konkrete Handlungen verstanden, ohne die mögliche Bedeutung von Gerechtigkeit im umfassenderen Sinn dogmatisch einzuengen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die leicht gehobene Wendung „Männer der Barmherzigkeit“ bewahrt die charakteristische Genitivfügung des griechischen Textes. Das Satzschlusszeichen folgt deutschem Gebrauch; beide Fußnotenmarker erscheinen im Haupttext.
