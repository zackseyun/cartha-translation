  text: Do good to the righteous[a], and you will find repayment—if not from him, then from Yahweh.
translation:
  language: de
  text: Tu dem Gerechten Gutes, dann wirst du Vergeltung finden – wenn nicht von ihm, dann vom HERRN.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Griechisch: „wenn nicht von ihm, dann vom Höchsten“; der hebräische Text lautet: „wenn nicht von ihm, dann vom HERRN“.'
    reason: textual_variant
lexical_decisions:
- source_word: הֵיטִב
  choice: Tu … Gutes
  rationale: Der Hifil-Imperativ von יטב fordert hier zu tätiger Wohltat gegenüber einem anderen Menschen auf. Die Formulierung ist direkt, idiomatisch und entspricht auch dem griechischen εὖ ποίησον.
- source_word: לַצַּדִּיק
  choice: dem Gerechten
  rationale: Das substantivierte Adjektiv bezeichnet den rechtschaffenen beziehungsweise gerechten Menschen, dem die Wohltat gilt. Die Übersetzung bleibt eng am Hebräischen; das griechische εὐσεβεῖ betont ergänzend dessen Frömmigkeit.
- source_word: תִּמְצָא
  choice: du wirst … finden
  rationale: Die Grundbedeutung von מצא ist „finden“. Die deutsche Wendung bewahrt das hebräische Bild, ohne den erwarteten Ausgang als bloßes Empfangen umzudeuten.
- source_word: תַשְׁלוּמַת
  choice: Vergeltung
  rationale: Das Wort bezeichnet eine Rückerstattung, Gegenleistung oder Vergeltung. „Vergeltung“ wahrt den Gedanken einer entsprechenden Erwiderung und passt zum griechischen ἀνταπόδομα; „Lohn“ wäre stärker als positive Belohnung festgelegt.
- source_word: אִם לֹא מִמֶּנוּ
  choice: wenn nicht von ihm
  rationale: Der hebräische Text hat ein maskulines Singularsuffix, das auf den zuvor genannten Gerechten zurückweist. Diese grammatische und inhaltliche Verbindung bleibt erhalten.
- source_word: מֵיְהֹוָה
  choice: vom HERRN
  rationale: Der erhaltene hebräische Hauptzeuge nennt den Gottesnamen JHWH. Die traditionelle deutsche Wiedergabe „HERR“ wird flektiert als „vom HERRN“ verwendet; die abweichende griechische Lesart wird in der Fußnote dokumentiert.
theological_decisions:
- issue: Abweichender Gottestitel im letzten Satzteil
  choice: vom HERRN
  alternative: vom Höchsten
  rationale: Da für diesen Vers ein verlässlicher hebräischer Text vorliegt, folgt der Haupttext מֵיְהֹוָה. Das griechische παρὰ Ὑψίστου ist eine bedeutsame Textvariante und wird nicht harmonisiert, sondern in einer Fußnote bewahrt.
- issue: Maskulines Singularpronomen für den Empfänger der Wohltat
  choice: von ihm
  alternative: von diesem Menschen
  rationale: Sowohl das hebräische Suffix als auch das griechische αὐτοῦ stehen im maskulinen Singular und beziehen sich auf den einzelnen Gerechten. Die Übersetzung erhält diese Form, statt sie in einen neutralen Plural umzuwandeln.
translation_notes:
  register: Moderne, würdige Standardsprache mit knapper weisheitlicher Satzstruktur. „Vergeltung“ ist bewusst im neutralen Sinn einer entsprechenden Gegenleistung gebraucht. Der Gedankenstrich verdeutlicht die nachgetragene Alternative, ohne die Spannung zwischen menschlicher und göttlicher Erwiderung aufzulösen.
