  language: de
  text: Gib ihm keine Nahrung[a], damit er sich dadurch nicht gegen dich stellt[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch wörtlich etwa: »Gefäße/Gegenstände von Brot«; die Formulierung ist schwierig. Der griechische Paralleltext stützt den Sinn »Brot« oder »Nahrung«.'
