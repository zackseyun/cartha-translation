lexical_decisions:
- source_word: כְּלֵי לָחֶם
  choice: Nahrung
  rationale: Die hebräische Wendung ist schwierig und bedeutet wörtlich etwa »Gefäße/Gegenstände von Brot«. Im Zusammenhang und nach dem griechischen Paralleltext ist Nahrung beziehungsweise Brot gemeint. »Nahrung« gibt den Sinn natürlich wieder, ohne einen im Hebräischen nicht sicheren Besitzbezug einzuführen.
- source_word: אַל תִּתֵּן לוֹ
  choice: Gib ihm keine
  rationale: Natürliche deutsche Wiedergabe des direkten Verbots; das Dativpronomen entspricht לוֹ.
- source_word: לָמָּה
  choice: damit … nicht
  rationale: לָמָּה bedeutet gewöhnlich »warum«, ergibt hier aber eine schwierige Syntax. Das griechische ἵνα μὴ stützt eine warnende Zwecksatz- beziehungsweise Folgesatzbedeutung.
- source_word: בָם
  choice: dadurch
  rationale: Das hebräische Pronomen ist pluralisch, entsprechend der schwierigen Anfangswendung. »Dadurch« bewahrt den instrumentalen Sinn und passt im Deutschen zum unzählbaren »Nahrung«.
- source_word: יַקְבִּיל אֵלֶיךָ
  choice: er sich … gegen dich stellt
  rationale: Die Formulierung bewahrt den wahrscheinlich feindlichen Sinn des hebräischen Verbs, ohne die stärkere griechische Bedeutung »dich beherrschen« in den Haupttext zu übernehmen.
theological_decisions:
- issue: Gewichtung des schwierigen hebräischen Wortlauts und des griechischen Paralleltextes
  choice: Der Haupttext folgt dem erhaltenen Hebräisch; der griechische Paralleltext klärt die Warnungsfunktion der zweiten Satzhälfte.
  alternative: »Entzieh ihm das Brot, damit er dich dadurch nicht beherrscht.«
  rationale: Die Alternative folgt stärker dem Griechischen. Die gewählte Fassung lässt dagegen die im Hebräischen erkennbare gegnerische Bewegung stehen und macht die stärkere griechische Lesart in einer Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Mahnform des hebräischen Textes bleibt erhalten; zwei Fußnoten weisen transparent auf die textliche und semantische Schwierigkeit hin.
