  text: In a man's prosperity even an enemy is friendly[a], but in his adversity even a friend keeps apart.
translation:
  language: de
  text: Geht es einem Mann gut, verhält sich selbst ein Feind wie ein Freund[a]; doch in seinem Unglück hält sich selbst ein Freund fern.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »wird selbst ein Feind zum Freund«. Das hebräische רֵעַ kann »Freund« oder »Gefährte« bedeuten. Die Übersetzung im Haupttext formuliert vorsichtiger und lässt offen, ob der Feind tatsächlich zum Freund wird oder sich nur freundschaftlich verhält.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּטוֹבַת אִישׁ
  choice: Geht es einem Mann gut
  rationale: Die Wendung bezeichnet die günstige Lage oder das Wohlergehen eines Mannes. Die verbale deutsche Form ist natürlich und bewahrt den sprichwörtlichen Gegensatz zum Unglück.
- source_word: שׂוֹנֵא
  choice: ein Feind
  rationale: Wörtlich bezeichnet das Wort einen Hassenden; im Beziehungskontext ist »Feind« die natürliche Entsprechung und stimmt mit dem griechischen Paralleltext überein.
- source_word: רֵעַ
  choice: verhält sich ... wie ein Freund
  rationale: רֵעַ kann einen Freund oder Gefährten bezeichnen. Die vorsichtige Vergleichsform bewahrt die Ironie, ohne eine echte Versöhnung des Feindes zu behaupten; zugleich bleibt die Wiederholung von »Freund« in beiden Vershälften erkennbar.
- source_word: וּבְרָעָתוֹ
  choice: doch in seinem Unglück
  rationale: רָעָה bezeichnet hier widrige Lebensumstände, nicht moralisches Böses. »Unglück« bildet einen klaren, idiomatischen Gegensatz zum Wohlergehen.
- source_word: בּוֹדֵד
  choice: hält sich ... fern
  rationale: Das Wort beschreibt Absonderung oder Getrenntsein. Im Kontext gibt »hält sich fern« treffend wieder, dass sich der Freund in der Not zurückzieht.
