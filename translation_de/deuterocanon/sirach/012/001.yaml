translation:
  language: de
  text: Wenn du Gutes tust, dann wisse, wem du Gutes tust; und es wird Hoffnung für deine Wohltat geben.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nach dem Griechischen ausdrücklicher: „und es wird Dank für deine guten Taten geben“. Das Hebräische kann auch bedeuten: „und es wird Hoffnung für dein Wohlergehen geben“.'
    reason: alternative_reading
lexical_decisions:
- source_word: אִם
  choice: wenn
  rationale: Die gewöhnliche konditionale Bedeutung bleibt erhalten, ohne den Eintritt des Falls vorauszusetzen.
- source_word: תֵּטִיב
  choice: Gutes tust
  rationale: Das Hifil von יטב bezeichnet hier das Gutestun beziehungsweise das Wohltun an jemandem; die Wendung entspricht zugleich dem griechischen εὖ ποιῇς.
- source_word: תֵּדַע
  choice: wisse
  rationale: Die Form hat im Zusammenhang auffordernden Sinn. „Wisse“ gibt sie unmittelbar wieder und entspricht dem griechischen γνῶθι.
- source_word: לְמִי
  choice: wem
  rationale: Die Präposition ל kennzeichnet den Empfänger der guten Tat; im Deutschen ist „wem du Gutes tust“ die natürliche Formulierung.
- source_word: וִיהִי
  choice: und es wird … geben
  rationale: Die Form kann eine jussivische Färbung haben, lässt sich in diesem Weisheitsspruch aber gut als künftige Folge verstehen; die etwas offene Beiordnung mit „und“ bleibt gewahrt.
- source_word: תִקְוָה
  choice: Hoffnung
  rationale: Dies ist die direkte Grundbedeutung des hebräischen Substantivs und bewahrt die Erwartung eines günstigen Ausgangs.
- source_word: לְטוֹבָתָךְ
  choice: für deine Wohltat
  rationale: טוֹבָה kann Gutes, eine Wohltat oder das eigene Wohlergehen bezeichnen. „Wohltat“ knüpft an das vorausgehende Gutestun an, ohne die Aussage ausdrücklich auf Dank oder materiellen Lohn festzulegen.
theological_decisions:
- issue: Bedeutung des Schlusses לְטוֹבָתָךְ im Verhältnis zum griechischen καὶ ἔσται χάρις τοῖς ἀγαθοῖς σου
  choice: „und es wird Hoffnung für deine Wohltat geben“
  alternative: „und es wird Dank für deine guten Taten geben“ beziehungsweise „und es wird Hoffnung für dein Wohlergehen geben“
  rationale: Der hebräische Text spricht wörtlich von Hoffnung und lässt offen, ob טוֹבָה die Wohltat oder das Wohlergehen des Wohltäters meint. Der griechische Paralleltext deutet die Folge stärker als Dank oder Anerkennung für die guten Taten. Der Haupttext folgt vorrangig dem Hebräischen; die Fußnote bewahrt beide sachlich wichtigen Alternativen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung von „Gutes tust“ bildet die hebräische Wiederholung bewusst nach. Der ungewöhnliche Schluss bleibt in seiner echten Mehrdeutigkeit stehen und wird nicht auf eine bestimmte Lehre von Vergeltung oder Dank festgelegt.
