lexical_decisions:
- source_word: אֵין טוֹבָה
  choice: Kein Gutes kommt
  rationale: Gibt die hebräische Existenzaussage „Es gibt nichts Gutes“ in natürlichem Deutsch prädikativ wieder; das griechische οὐκ ἔστιν ἀγαθὰ bestätigt den Grundsinn.
- source_word: לִמְנֹחַ רָשָׁע
  choice: zu dem, der im Bösen verharrt
  rationale: Die hebräische Form לִמְנֹחַ ist an dieser Stelle schwierig. Die griechische Parallele τῷ ἐνδελεχίζοντι εἰς κακά stützt den durativen Sinn „im Bösen fortfahren/verharren“.
- source_word: וְגַם
  choice: und ebenso wenig
  rationale: Die wörtlich additive Verbindung „und auch“ wird im Zusammenhang mit der fortwirkenden Verneinung idiomatisch und zugleich deutlich wiedergegeben.
- source_word: צְדָקָה
  choice: Barmherzigkeit
  rationale: Das hebräische Wort kann „Gerechtigkeit“, wohltätiges Handeln oder Mildtätigkeit bezeichnen. Die griechische Wiedergabe ἐλεημοσύνη weist hier besonders auf Barmherzigkeit beziehungsweise Almosengeben.
- source_word: לֹא עָשָׂה
  choice: keine … übt
  rationale: Das hebräische Verb bedeutet wörtlich „nicht getan“. Mit „Barmherzigkeit“ als Objekt ist „Barmherzigkeit üben“ eine natürliche deutsche Verbindung, die den Handlungscharakter bewahrt.
theological_decisions:
- issue: Bedeutung von צְדָקָה in diesem Weisheitsspruch
  choice: Barmherzigkeit als tätige Mildtätigkeit
  alternative: Gerechtigkeit; Almosengeben
  rationale: Der hebräische Text lässt „Gerechtigkeit“ zu, doch die alte griechische Parallele versteht das Wort konkret als ἐλεημοσύνη, also Barmherzigkeit oder Almosengeben. Die Hauptfassung folgt diesem kontextuellen Sinn, während die Fußnote die hebräische Ausdrucksweise offenlegt.
- issue: Verständnis der schwierigen Wendung לִמְנֹחַ רָשָׁע
  choice: fortgesetztes Verharren im Bösen
  alternative: für den Ruhenden/den sich niederlassenden Frevler; für den Bösen
  rationale: Die hebräische Form ist textlich beziehungsweise semantisch schwierig. Die griechische Parallele bezeugt ausdrücklich das Fortfahren im Bösen; diese Deutung wird übernommen, aber als textliche Unsicherheit gekennzeichnet.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Formulierung „zu dem … und ebenso wenig zu dem“ bewahrt die Satzstruktur, während „Barmherzigkeit üben“ tätiges Erbarmen ausdrückt. Die textliche Unsicherheit und die Bedeutungsbreite von צְדָקָה werden nicht verdeckt, sondern in den Fußnoten dokumentiert.
