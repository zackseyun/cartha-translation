  text: Do not seat him at your right hand[a], lest he seek your seat.
translation:
  language: de
  text: Setze ihn nicht zu deiner Rechten[a], damit er nicht deinen Platz sucht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Lass ihn nicht zu deiner Rechten sitzen, sonst wird er nach deinem Sitz streben.“ Das hebräische Wort für „Platz“ kann auch den Sitz beziehungsweise die Stellung eines Menschen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תּוֹשִׁיבֵהוּ
  choice: Setze ihn nicht
  rationale: Die Verneinung אַל leitet ein Verbot ein; das Hifil von ישׁב mit Objektsuffix bedeutet hier natürlich „jemanden hinsetzen/setzen“.
- source_word: לִימִינֶךָ
  choice: zu deiner Rechten
  rationale: Die Wendung bewahrt sowohl die räumliche Bedeutung als auch den möglichen Beiklang eines Ehrenplatzes oder besonderer Nähe.
- source_word: לָמָּה
  choice: damit … nicht
  rationale: Wörtlich kann לָמָּה „warum?“ heißen; im vorliegenden Weisheitsspruch lässt es sich jedoch als Warnung vor einer unerwünschten Folge verstehen. Die Übersetzung gibt diese Funktion wieder, ohne die Folge als sicher darzustellen.
- source_word: יְבַקֵּשׁ
  choice: sucht
  rationale: בקש bezeichnet das Suchen oder Erlangenwollen. „Sucht“ wahrt die Bedeutungsbreite zwischen Begehren und aktivem Streben.
- source_word: מוֹשָׁבֶךָ
  choice: deinen Platz
  rationale: מושב kann einen Sitz, einen Aufenthaltsort oder eine Stellung bezeichnen. „Platz“ erhält das konkrete Sitzbild und lässt zugleich die soziale Bedeutung anklingen.
theological_decisions:
- issue: Verhältnis des erhaltenen hebräischen Textes zur syntaktisch abweichenden griechischen Parallele
  choice: Der erhaltene hebräische Text wird unmittelbar übersetzt; die griechische Parallele dient nur als Kontext- und Konsistenzzeugnis.
  alternative: 'Eine stärker ausdeutende Fassung wie: „Gib ihm nicht den Ehrenplatz zu deiner Rechten, sonst will er deine Stellung einnehmen.“'
  rationale: Der hebräische Wortlaut ist mit hoher Sicherheit überliefert und soll die Übersetzung bestimmen. Zusätze wie „Ehrenplatz“ oder „einnehmen“ würden mögliche Implikationen ausdrücklich machen, die im Hebräischen nur mitschwingen.
- issue: Mehrdeutigkeit von מושב zwischen Sitzplatz und sozialer Stellung
  choice: „Platz“ im Haupttext, mit Erläuterung in der Fußnote
  alternative: „Sitz“ oder „Stellung“
  rationale: „Platz“ verbindet die konkrete Szenerie mit der möglichen übertragenen Bedeutung, ohne die Warnung einseitig auf Rang oder Macht festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Form bewahrt den Charakter eines Weisheitsspruchs; die Fußnote macht die räumliche und soziale Doppelbedeutung sichtbar.
