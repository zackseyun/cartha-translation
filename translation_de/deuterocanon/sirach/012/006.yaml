  text: For God also hates evildoers[b][a], and will repay the wicked with vengeance.
translation:
  language: de
  text: Denn auch Gott hasst Übeltäter,[a] und an den Frevlern wird er Rache üben.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Text lautet: »Denn auch der Höchste hasste Sünder.«'
    reason: textual_variant
  - marker: b
    text: Der griechische Text bezeichnet die Frevler als »Gottlose« und spricht ebenfalls von vergeltender Rache.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵל
  choice: Gott
  rationale: Das hebräische אֵל bezeichnet hier unmittelbar Gott. Der abweichende griechische Gottesname »der Höchste« wird in der Fußnote dokumentiert.
- source_word: שֹׂנֵא
  choice: hasst
  rationale: Das Partizip bezeichnet eine andauernde Haltung; »hasst« gibt die starke Aussage des Hebräischen unverändert wieder.
- source_word: רָעִים
  choice: Übeltäter
  rationale: Wörtlich sind es »Böse« beziehungsweise Menschen, die Böses tun. »Übeltäter« bewahrt den aktiven moralischen Sinn und unterscheidet den Ausdruck von רְשָׁעִים im zweiten Halbvers.
- source_word: לָרְשָׁעִים
  choice: an den Frevlern
  rationale: רְשָׁעִים bezeichnet schuldige, gottlose oder böse Menschen. »Frevler« ist eine knappe, würdige Wiedergabe und lässt zugleich die religiös-moralische Färbung anklingen.
- source_word: יָשִׁיב נָקָם
  choice: wird er Rache üben
  rationale: Die Verbindung meint, dass Gott vergeltende Rache vollzieht. Die deutsche Wendung ist natürlich und bewahrt die Stärke der Aussage.
theological_decisions:
- issue: Gottesbezeichnung bei voneinander abweichendem hebräischem und griechischem Text
  choice: Gott
  alternative: der Höchste
  rationale: Der hebräische Hauptzeuge liest אֵל, »Gott«; deshalb folgt der Haupttext ihm. Die spezifischere griechische Lesart ὁ ὕψιστος, »der Höchste«, wird transparent in der Fußnote genannt.
- issue: Aussage vom göttlichen Hass und der Rache
  choice: hasst; wird Rache üben
  alternative: verwirft; wird bestrafen
  rationale: Die stärkeren Begriffe entsprechen שֹׂנֵא und נָקָם. Eine Abschwächung würde die theologische Spannung des Ausgangstextes stillschweigend auflösen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Weisheitston. »Frevler« ist leicht gehoben, aber im biblischen Zusammenhang klar und prägnant; die parallelen Ausdrücke des Hebräischen bleiben unterschieden.
