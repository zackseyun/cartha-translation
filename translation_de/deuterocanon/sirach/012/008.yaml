  text: A friend is not known in prosperity[a], and an enemy is not hidden in adversity.
translation:
  language: de
  text: Im Glück erkennt man einen Freund nicht[a], und im Unglück bleibt ein Feind nicht verborgen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: »Im Glück wird ein Freund nicht erkannt, und im Unglück bleibt ein Feind nicht verborgen.« Die griechische Überlieferung weicht im ersten Satzteil ab und lautet ungefähr: »Ein Freund wird im Guten nicht vergolten/gerächt.« Hier wird dem erhaltenen hebräischen Text gefolgt, dessen beide Satzteile ein ausgewogenes Sprichwort über Glück und Unglück bilden.'
    reason: textual_variant
lexical_decisions:
- source_word: אוֹהֵב
  choice: einen Freund
  rationale: Das Partizip bezeichnet hier im Kontext der Weisheitslehre einen Menschen, der freundschaftlich zugewandt ist; das griechische φίλος stützt die Wiedergabe »Freund«.
- source_word: לֹא יִוָּדַע
  choice: erkennt man … nicht
  rationale: Das Nifal von ידע bedeutet »bekannt/erkannt werden«. Die unpersönliche deutsche Formulierung gibt natürlich wieder, dass günstige Umstände nicht erkennen lassen, wer ein wahrer Freund ist.
- source_word: בַּטּוֹבָה
  choice: im Glück
  rationale: Wörtlich »im Guten«; gemeint sind günstige Lebensumstände. »Im Glück« bildet einen klaren, sprichwörtlichen Gegensatz zu »im Unglück«.
- source_word: וְלֹא יְכֻסֶּה
  choice: bleibt … nicht verborgen
  rationale: Das Pual von כסה bezeichnet das Verhüllt- oder Verborgenwerden. Im Deutschen bringt »bleibt nicht verborgen« die Entlarvung im Unglück idiomatisch zum Ausdruck.
- source_word: בְרָעָה
  choice: im Unglück
  rationale: רעה bezeichnet hier widrige Umstände oder Not, nicht sittlich Böses. »Unglück« bewahrt den prägnanten Gegensatz zu »Glück«.
- source_word: שׂוֹנֵא
  choice: ein Feind
  rationale: Das Partizip bezeichnet einen feindseligen Menschen; »Feind« ist im Deutschen die natürliche Entsprechung und wird durch griechisch ἐχθρός bestätigt.
theological_decisions: []
translation_notes:
  register: Knappes, würdiges und gut verständliches Sprichwort in modernem Standarddeutsch. Die Gegenüberstellung »Glück/Unglück« wahrt die Parallelität des Hebräischen; die unpersönliche Form »erkennt man« klingt natürlicher als eine wörtliche Passivkonstruktion.
