base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/012/012.yaml
  text: Be to him like one who reveals a secret[a], and he will not find a way to ruin you[b]; and know the outcome of jealousy.
translation:
  language: de
  text: Verhalte dich ihm gegenüber wie jemand, der ein Geheimnis preisgibt[a], und er wird keine Möglichkeit finden, dich zugrunde zu richten; erkenne, wohin Eifersucht führt.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: „Sei ihm gegenüber wie einer, der ein Geheimnis aufdeckt.“ Das knappe hebräische Vergleichsbild ist mehrdeutig; im Zusammenhang kann es zu derselben Vorsicht auffordern, die gegenüber jemandem geboten ist, der Vertrauliches preisgibt.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Erkenne den Ausgang des Neides.“ Das hebräische Wort kann sowohl „Eifersucht“ als auch „Neid“ bedeuten.'
    reason: lexical_alternative
  - marker: c
    text: 'Die griechische Überlieferung weicht hier erheblich ab: Sie warnt davor, den Feind neben sich oder zu seiner Rechten sitzen zu lassen, damit er nicht den eigenen Platz an sich bringt; am Ende werde man die Warnung verstehen.'
    reason: textual_variant
lexical_decisions:
- source_word: הֱיֵה לוֹ
  choice: Begegne ihm
  rationale: Der Imperativ von היה mit ל beschreibt hier die Haltung gegenüber einer Person. „Begegne ihm“ gibt dies im heutigen Deutsch natürlicher wieder als das wörtliche „Sei ihm gegenüber“.
- source_word: כִּמְגַלֶּה רָז
  choice: wie einem, der ein Geheimnis preisgibt
  rationale: מגלה bezeichnet jemanden, der etwas aufdeckt oder offenbart, רז ein Geheimnis. Die Formulierung bewahrt das warnende Vergleichsbild; „preisgibt“ lässt die negative Färbung des Zusammenhangs erkennen, ohne sie ausdrücklich auszudeuten.
- source_word: וְלֹא יִמְצָא לְהַשְׁחִיתְךָ
  choice: dann wird er keine Möglichkeit finden, dich zugrunde zu richten
  rationale: Das Hebräische lautet wörtlich „und er wird nicht finden, dich zu verderben“. „Keine Möglichkeit finden“ ergänzt idiomatisch das im Deutschen erforderliche Bezugswort. שחת im Hifil kann zerstören, verderben oder ruinieren bedeuten; „zugrunde richten“ bezeichnet hier schweren, nicht notwendig körperlichen Schaden.
- source_word: וְדַע אַחֲרִית
  choice: Erkenne, wohin … führt
  rationale: ידע steht als Imperativ; אחרית bezeichnet Ende, Ausgang oder Ergebnis. Die deutsche Wendung gibt den Gedanken an den schließlichen Ausgang natürlich wieder, ohne ihn als bloße Zukunftsaussage umzudeuten.
- source_word: קִנְאָה
  choice: Eifersucht
  rationale: קנאה kann Eifersucht, Neid oder Eifer bezeichnen. Im Zusammenhang feindseliger Schädigungsabsicht passt „Eifersucht“; „Neid“ bleibt als mögliche Wiedergabe in der Fußnote erhalten.
theological_decisions:
- issue: Hebräischer Text gegenüber der erheblich ausführlicheren griechischen Parallelüberlieferung
  choice: Den erhaltenen hebräischen Wortlaut als Haupttext übersetzen
  alternative: Dem griechischen Text folgen, der davor warnt, den Feind neben sich oder zur Rechten sitzen zu lassen, damit er nicht den eigenen Platz an sich bringt
  rationale: Da ein hebräischer Text vorliegt, bildet er die Grundlage. Die griechische Fassung bezeugt dieselbe allgemeine Warnrichtung, hat hier aber deutlich anderen und erweiterten Wortlaut; diese Differenz wird nicht stillschweigend in den Haupttext eingetragen, sondern in einer Fußnote offengelegt.
- issue: Bedeutung von קִנְאָה
  choice: Eifersucht
  alternative: Neid
  rationale: Beide Bedeutungen sind lexikalisch möglich. Der Text benennt keine bestimmte Lehrfrage, sondern warnt vor der zerstörerischen Folge einer feindseligen Haltung; deshalb bleibt die Alternative ausdrücklich sichtbar.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Mahnton. Der Satzbau wurde gegenüber dem knappen Hebräisch leicht idiomatisiert, während das ungewöhnliche Vergleichsbild und die Mehrdeutigkeit von קנאה erhalten beziehungsweise in den Fußnoten kenntlich gemacht werden.
