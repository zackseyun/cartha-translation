  text: Give to the good[a], and withhold from the evil; honor the poor, and do not give to a stranger.[b]
translation:
  language: de
  text: Gib dem Guten und versage es dem Bösen.[a] Ehre den Armen und gib keinem Fremden.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Halte es vom Bösen zurück.“ Das Hebräische kann רָע als „das Böse“ oder „einen bösen Menschen“ bezeichnen; der griechische Paralleltext lautet: „Unterstütze den Sünder nicht.“'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „keinem Außenstehenden“ beziehungsweise „keinem Ausländer“. Das hebräische Wort bezeichnet jemanden, der dem betreffenden Kreis nicht angehört.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תֵּן לַטּוֹב
  choice: Gib dem Guten
  rationale: Die knappe imperativische Form des Hebräischen bleibt erhalten. „Dem Guten“ bewahrt die substantivische ethische Bezeichnung; auch das griechische τῷ ἀγαθῷ weist auf eine Person.
- source_word: וּמְנַע מֵרָע
  choice: und versage es dem Bösen
  rationale: מנע bezeichnet das Vorenthalten oder Verweigern. Die Formulierung gibt den persönlichen Gegensatz zu „dem Guten“ natürlich wieder, ohne das griechische „Sünder“ unmittelbar in den Haupttext zu übernehmen.
- source_word: הֹקֵיר מָךְ
  choice: Ehre den Armen
  rationale: הֹקֵיר fordert dazu auf, jemanden zu ehren oder wertzuschätzen; מָךְ bezeichnet einen armen, bedürftigen oder sozial niedrigen Menschen. „Den Armen“ ist klar und würdevoll.
- source_word: וְאַל תִּתֵּן לְזֵר
  choice: und gib keinem Fremden
  rationale: Die deutsche Konstruktion gibt den negativen Imperativ knapp wieder. זָר kann einen Fremden, Außenstehenden oder Ausländer bezeichnen; „Fremder“ lässt diese Reichweite weitgehend offen.
theological_decisions:
- issue: Ist רָע abstrakt als das Böse oder persönlich als ein böser Mensch zu verstehen?
  choice: 'Im Haupttext persönlich: „dem Bösen“'
  alternative: „vom Bösen“ beziehungsweise nach dem griechischen Paralleltext „dem Sünder“
  rationale: Der Parallelismus mit „dem Guten“ und das griechische τοῦ ἁμαρτωλοῦ stützen einen persönlichen Bezug. Die hebräische Möglichkeit eines abstrakten Verständnisses wird jedoch in der Fußnote offengehalten.
- issue: Sozialer Bezug von זָר
  choice: „Fremder“ ohne ethnische Festlegung
  alternative: „Außenstehender“ oder „Ausländer“
  rationale: Der hebräische Ausdruck bestimmt nicht eindeutig, worin das Fremdsein besteht. Daher wird weder eine rein ethnische noch eine ausdrücklich bundestheologische Bedeutung festgelegt.
translation_notes:
  register: Modernes, knappes Standarddeutsch mit würdigem Weisheitston. Die parallelen Imperative und die ethische Zuspitzung des Hebräischen bleiben erhalten; echte lexikalische Mehrdeutigkeiten werden in den Fußnoten ausgewiesen.
