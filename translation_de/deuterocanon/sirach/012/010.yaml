  text: Do not trust an enemy forever, for as bronze rusts, so does his evil.
translation:
  language: de
  text: Vertraue einem Feind niemals, denn wie Bronze korrodiert, so korrodiert auch seine Bosheit.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַל תַּאֲמִין
  choice: Traue … nicht / Traue … niemals
  rationale: Das Verbot wird im Deutschen idiomatisch mit „Traue … niemals“ wiedergegeben; תאמין bezeichnet hier Vertrauen oder Sich-Verlassen, nicht bloß intellektuelles Glauben.
- source_word: בְּשׂוֹנֵא
  choice: einem Feind
  rationale: Wörtlich ist שונא „einer, der hasst“; im Kontext bezeichnet es den persönlichen Feind und entspricht auch dem griechischen ἐχθρός.
- source_word: לָעַד
  choice: niemals
  rationale: Wörtlich „für immer/auf Dauer“. Zusammen mit der Verneinung ergibt „niemals“ die natürliche deutsche Warnung, ohne eine nur zeitweilige Vertrauensmöglichkeit ausdrücklich festzulegen.
- source_word: כַנְּחֹשֶׁת … יַחֲלִיא
  choice: gleicht Bronze, die Rost ansetzt
  rationale: נחשת bezeichnet Kupfer oder Bronze. Das schwierige יחליא beschreibt hier nach dem griechischen Paralleltext das Anlaufen bzw. Korrodieren; „Rost ansetzen“ bewahrt das traditionelle, allgemein verständliche Bild, auch wenn Bronze technisch eher korrodiert oder Grünspan/Patina bildet.
- source_word: רֹעוֹ
  choice: seine Bosheit
  rationale: Das Substantiv bezeichnet seine Schlechtigkeit oder Bosheit; „Bosheit“ erhält die moralische Aussage des Verses.
theological_decisions:
- issue: Reichweite der Warnung vor dem Feind
  choice: „niemals“ als idiomatische Wiedergabe der dauerhaften Warnung
  alternative: „Traue einem Feind nicht für immer“
  rationale: Die Formulierung gibt die unbedingte Vorsicht des hebräischen אַל … לָעַד wieder, ohne eine weitergehende Lehre über Feindesliebe, Vergebung oder Versöhnung in den Vers einzutragen.
- issue: Bild von Bronze und Bosheit
  choice: Die Bosheit wird mit rostender Bronze verglichen
  alternative: „Wie Bronze rostet, so rostet seine Bosheit“
  rationale: Die syntaktisch leicht umgestellte Form bewahrt den Vergleich und vermeidet im Deutschen die schwer verständliche Aussage, Bosheit selbst „roste“.
translation_notes:
  register: Kurzer, sprichwortartiger Warnsatz in modernem, würdigem Standarddeutsch. Das Semikolon erhält die knappe Verbindung von Mahnung und Begründung. Keine konfessionelle oder auslegende Ergänzung.
