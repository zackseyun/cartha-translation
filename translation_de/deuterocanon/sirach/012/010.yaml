  source_fidelity: 'Der Entwurf gibt die Warnung אַל תַּאֲמִין … לָעַד („vertraue … niemals“) und רֹעוֹ („seine Bosheit“) im Wesentlichen zutreffend wieder. Er verändert jedoch die Vergleichskonstruktion: Im Hebräischen und im griechischen Paralleltext korrodiert die Bosheit selbst bildlich, wie Bronze korrodiert. Die Fassung „seine Bosheit gleicht Bronze, die Rost ansetzt“ macht daraus eine bloße Gleichsetzung und schwächt die gezielte metaphorische Aussage.'
