  text: So is one who associates with a man of insolence and rolls about in his sins.[a]
translation:
  language: de
  text: So ist es mit einem, der sich einem vermessenen Mann anschließt und sich in dessen Sünden wälzt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Überlieferung weicht hier erheblich ab: „Wenn dir Böses begegnet, wirst du ihn schon vor dir dort finden; und während er vorgibt zu helfen, wird er dir ein Bein stellen.“ Der in der Kairoer Geniza erhaltene hebräische Text spricht dagegen davon, sich einem vermessenen Mann anzuschließen und sich in dessen Sünden zu wälzen.'
    reason: alternative_reading
lexical_decisions:
- source_word: כֵּן
  choice: So ist es mit
  rationale: Leitet eine vergleichende Anwendung aus dem vorhergehenden Zusammenhang ein und bewahrt den sprichwörtlichen Ton.
- source_word: חוֹבֵר אֶל
  choice: der sich ... anschließt
  rationale: Gibt das Sichverbinden oder den Umgang mit jemandem idiomatisch wieder, ohne eine enge Freundschaft vorauszusetzen.
- source_word: אִישׁ זָדוֹן
  choice: einem vermessenen Mann
  rationale: זָדוֹן bezeichnet hier anmaßende, überhebliche Bosheit; „vermessen“ wahrt die moralische Färbung, und „Mann“ entspricht dem ausdrücklich maskulinen אִישׁ.
- source_word: וּמִתְגֹלֵל
  choice: und sich ... wälzt
  rationale: Bewahrt das anschauliche Bild des reflexiven Sichwälzens aus dem Hitpael von גלל und klingt im Deutschen natürlich.
- source_word: בַּעֲוֹנֹתָיו
  choice: in dessen Sünden
  rationale: עָוֹן kann Sünde, Schuld oder Vergehen bezeichnen. „Sünden“ ist hier klar; „dessen“ macht deutlich, dass das Suffix auf den vermessenen Mann zurückweist.
theological_decisions:
- issue: Verhältnis des hebräischen Textes zur stark abweichenden griechischen Überlieferung
  choice: Der erhaltene hebräische Text bildet den Haupttext; die griechische Fassung wird in einer Fußnote dokumentiert.
  alternative: 'Griechisch: „Wenn dir Böses begegnet, wirst du ihn schon vor dir dort finden; und während er vorgibt zu helfen, wird er dir ein Bein stellen.“'
  rationale: Da für diesen Vers ein hebräischer Zeuge erhalten ist, hat er Vorrang. Die griechische Überlieferung bietet jedoch eine inhaltlich erheblich andere Warnung und muss deshalb transparent festgehalten werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die bildhafte und etwas harte Formulierung „sich in dessen Sünden wälzen“ wurde bewusst beibehalten, um das hebräische Bild nicht zu verflachen.
