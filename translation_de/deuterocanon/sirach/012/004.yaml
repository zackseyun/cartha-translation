translation:
  language: de
  text: Zweifaches Unheil wird ihn in der Not treffen; bei allem Guten wird es ihn erreichen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Überlieferung lautet hier: „Gib dem Gottesfürchtigen und unterstütze den Sünder nicht.“'
    reason: Die griechische Parallelüberlieferung weicht in diesem Vers vollständig vom erhaltenen hebräischen Wortlaut ab; diese bedeutsame Textvariante muss sichtbar bleiben.
lexical_decisions:
- source_word: פִּי שְׁנַיִם
  choice: zweifaches
  rationale: Die feste hebräische Verbindung bezeichnet das Doppelte beziehungsweise einen zweifachen Anteil; im Deutschen wird sie hier attributiv und natürlich wiedergegeben.
- source_word: רָעָה
  choice: Unheil
  rationale: Das Wort kann Böses, Unglück oder Unheil bezeichnen. Im Zusammenhang mit dem, was den Handelnden in der Not trifft, passt „Unheil“, ohne eine moralische Tat als Bedeutung festzulegen.
- source_word: תַּשִּׂיג
  choice: wirst du … ernten
  rationale: Die Verbform ist an eine zweite Person Singular gerichtet und kann „erlangen/erreichen“ bedeuten. „Ernten“ bringt idiomatisch zum Ausdruck, dass die zuvor erwiesene Wohltat eine schlimme Folge für den Handelnden hat.
- source_word: בְּעֵת צֹרֶךְ
  choice: in der Not
  rationale: Wörtlich etwa „zur Zeit der Bedrängnis/Not“. Die knappe deutsche Form wahrt den Sinn und den weisheitlichen Ton.
- source_word: בְּכָל טוֹבָה תַּגִּיעַ אֵלָיו
  choice: für jede Wohltat, die du ihm erweist
  rationale: Das Gute wird zu der betreffenden Person hingebracht beziehungsweise ihr zukommen gelassen. „Eine Wohltat erweisen“ ist dafür eine natürliche, würdevolle deutsche Formulierung.
theological_decisions:
- issue: Stark abweichende hebräische und griechische Textüberlieferung
  choice: Der nachgewiesene hebräische Text wird im Haupttext übersetzt.
  alternative: 'Nach der griechischen Überlieferung: „Gib dem Gottesfürchtigen und unterstütze den Sünder nicht.“'
  rationale: Der Auftrag verlangt, von der originalsprachlichen Quellenlage auszugehen; der bereitgestellte hebräische Text ist als hochgradig sicher und validiert ausgewiesen. Die echte textgeschichtliche Differenz wird nicht harmonisiert, sondern in einer Fußnote offengelegt.
- issue: Nicht ausdrücklich genanntes Bezugswort von „ihm“
  choice: Das maskuline Pronomen bleibt ohne ergänzende Bezeichnung als „ihm“ stehen.
  alternative: Eine Deutung wie „dem Sünder“ in den Haupttext einsetzen.
  rationale: Der Einzelvers nennt den Bezugsträger nicht ausdrücklich. Eine Ergänzung würde die im Hebräischen bestehende Kontextabhängigkeit unnötig auflösen.
translation_notes:
  register: Knapper, würdevoller Weisheitsspruch in modernem Standarddeutsch. Die direkte Anrede und die zugespitzte Warnung des Hebräischen bleiben erhalten; die abweichende griechische Fassung wird ausschließlich textkritisch dokumentiert.
