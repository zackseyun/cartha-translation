  text: Even if he listens to you and walks gently, give your heart to be afraid of him.[a]
translation:
  language: de
  text: Auch wenn er auf dich hört und ruhig einhergeht, achte darauf, dich vor ihm zu fürchten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Parallelüberlieferung ist ausführlicher: „Sei auf der Hut und hüte dich vor ihm.“ Sie spricht den Selbstschutz deutlicher aus als der erhaltene hebräische Wortlaut allein.'
    reason: alternative_reading
lexical_decisions:
- source_word: ישמע לך
  choice: auf dich hört
  rationale: שמע mit ל kann sowohl das Hören auf jemanden als auch Gehorsam bezeichnen. „Auf dich hört“ bewahrt die naheliegende Bedeutung, ohne förmliche Unterordnung vorauszusetzen.
- source_word: וִיהַלֵּךְ בְּנַחַת
  choice: ruhig einhergeht
  rationale: הלך בנחת beschreibt ein ruhiges, sanftes oder zurückhaltendes Auftreten. „Ruhig einhergeht“ erhält das Bild des Gehens und lässt offen, ob die Sanftmut echt oder nur vorgetäuscht ist.
- source_word: תֵּן לִבְּךָ
  choice: nimm dir zu Herzen
  rationale: Wörtlich steht „gib dein Herz“. Die deutsche Wendung „nimm dir zu Herzen“ bewahrt den Bezug auf das Herz und vermittelt die Aufforderung zu ernster, innerer Aufmerksamkeit.
- source_word: לְהִתְיָרֵא מִמֶּנּוּ
  choice: dich vor ihm zu fürchten
  rationale: Die reflexive Form von ירא bezeichnet Furcht. Die Übersetzung erhält dieses Furchtwort, statt es durch das stärker deutende „auf der Hut sein“ zu ersetzen; im Zusammenhang ist warnende Vorsicht gemeint.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die leicht bildhafte Formulierung „ruhig einhergeht“ und der Herzbezug des Hebräischen bleiben erhalten; das hebräische Furchtwort wird nicht durch die ausdrückliche Wachsamkeitssprache der griechischen Parallelüberlieferung ersetzt.
