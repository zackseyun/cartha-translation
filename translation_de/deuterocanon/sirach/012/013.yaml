  text: Do not set him beside you[a], lest he push you aside and stand in your place.
translation:
  language: de
  text: Stell ihn nicht neben dich[a], sonst wird er dich verdrängen und an deiner Stelle stehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Griechisch: „Wer wird einen Schlangenbeschwörer bemitleiden, den eine Schlange gebissen hat, und alle, die sich wilden Tieren nähern?“ Der griechische Text bietet an dieser Stelle eine wesentlich andere Lesart.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תַּעֲמִידֵהוּ
  choice: Stell ihn nicht
  rationale: Der Hifil von עמד bezeichnet das Veranlassen, dass jemand steht, bzw. das Aufstellen oder Platzieren. „Stell ihn nicht“ gibt dies im Deutschen knapp und unmittelbar wieder.
- source_word: אֶצְלֶךָ
  choice: neben dich
  rationale: אצל bezeichnet räumliche oder übertragene Nähe. „Neben dich“ bewahrt das räumliche Bild und lässt zugleich die Nähe einer Vertrauens- oder Machtstellung anklingen.
- source_word: לָמָּה
  choice: damit … nicht
  rationale: Wörtlich kann לָמָּה „warum?“ bedeuten; hier leitet es im Zusammenhang die unerwünschte Folge ein, vor der gewarnt wird. „Damit … nicht“ gibt diese abwehrende Ziel- bzw. Folgebeziehung in natürlichem Deutsch wieder.
- source_word: יֶהְדָּפְךָ
  choice: er dich verdrängt
  rationale: הדף bedeutet stoßen, wegdrängen oder vertreiben. „Verdrängt“ verbindet die Bewegung des Wegdrängens mit dem im folgenden Satzteil ausgedrückten Einnehmen der bisherigen Stellung.
- source_word: וְיַעֲמֹד
  choice: und … steht
  rationale: Das Verb עמד bedeutet hier wörtlich „stehen“. Die Wiedergabe erhält das hebräische Bild, statt es durch „deinen Platz einnehmen“ vollständig auszudeuten.
- source_word: תַּחְתֶּיךָ
  choice: an deiner Stelle
  rationale: תחת kann sowohl „unter“ als auch „anstelle von“ bedeuten. Im Parallelismus mit dem Verdrängen ist die Stellvertretungs- bzw. Ersetzungsbedeutung naheliegend; „an deiner Stelle“ ist dafür die natürliche deutsche Formulierung.
theological_decisions:
- issue: Vorrang des erhaltenen hebräischen Textes gegenüber der stark abweichenden griechischen Fassung
  choice: Der erhaltene hebräische Text bildet den Haupttext; die griechische Fassung erscheint in einer Fußnote.
  alternative: 'Die griechische Fassung als Haupttext übersetzen: „Wer wird einen Schlangenbeschwörer bemitleiden, den eine Schlange gebissen hat, und alle, die sich wilden Tieren nähern?“'
  rationale: Da für diesen Vers ein als zuverlässig bewerteter hebräischer Zeuge vorliegt, wird er gemäß der Übersetzungsgrundlage vorrangig wiedergegeben. Die griechische Überlieferung bietet hier nicht nur eine kleine Variante, sondern einen wesentlich anderen Text und darf daher den hebräischen Haupttext nicht stillschweigend ersetzen.
translation_notes:
  register: Modernes, klares und würdiges Standarddeutsch. Die räumlichen Bilder des Hebräischen bleiben in „neben dich“ und „an deiner Stelle steht“ sichtbar; „verdrängt“ macht den Zusammenhang idiomatisch verständlich, ohne ihn konfessionell oder lehrmäßig auszudeuten.
