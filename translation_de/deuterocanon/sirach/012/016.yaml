base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/012/016.yaml
  text: Who will pity a snake charmer who is bitten[b][a], or anyone who goes near a beast of prey?
translation:
  language: de
  text: Wer hat Mitleid mit einem Schlangenbeschwörer, der gebissen wurde,[a] oder mit jedem, der sich einem Raubtier nähert?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die griechische Überlieferung weicht hier erheblich ab. Sie spricht von einem Feind, der mit seinen Lippen süße Worte macht, während er in seinem Herzen plant, einen in eine Grube zu stürzen, und der nach Blut verlangt. Da für diesen Vers ein hebräischer Text erhalten ist, folgt der Haupttext dem Hebräischen.
    reason: textual_variant
  - marker: b
    text: 'Hebräisch wörtlich: „einem Tier des Zahns/der Zähne“, gemeint ist ein gefährliches Raubtier.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי יוּחַן
  choice: Wer hat Mitleid mit
  rationale: Die rhetorische Frage und die Form von חנן werden in natürlichem Deutsch als Frage danach wiedergegeben, wem Mitleid zuteilwird.
- source_word: חוֹבֵר
  choice: Schlangenbeschwörer
  rationale: חוֹבֵר bezeichnet hier einen Beschwörer; durch das folgende „gebissen“ ist der Bezug auf Schlangen im Kontext hinreichend deutlich.
- source_word: נָשׁוּךְ
  choice: der gebissen wurde
  rationale: Die passive Bedeutung des Partizips bleibt erhalten; die relative Formulierung ist im Deutschen idiomatisch.
- source_word: וְכָל הַקָּרֵב
  choice: oder mit jedem, der sich … nähert
  rationale: Das waw verbindet einen parallelen Fall. „Oder“ gibt die alternative Erweiterung der rhetorischen Frage im Deutschen natürlich wieder, während „jedem“ das umfassende כָּל bewahrt.
- source_word: אֶל חַיַּת שֵׁן
  choice: einem Raubtier
  rationale: Wörtlich „einem Tier des Zahns/der Zähne“; „Raubtier“ vermittelt knapp und verständlich den Sinn eines gefährlichen, bezahnten Wildtiers.
