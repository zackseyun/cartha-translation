  text: He will not pass by until a fire burns in him[a].
translation:
  language: de
  text: Er lässt nicht ab, bis ein Feuer in ihm brennt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Parallelfassung lautet: „Er wird seinen Kopf schütteln und in die Hände klatschen, viel flüstern und sein Gesicht verziehen.“ Diese ausführlichere Fassung deutet vermutlich das feindselige Verhalten aus, das im Hebräischen nur knapp beschrieben wird.'
    reason: alternative_reading
lexical_decisions:
- source_word: לֹא יַעֲבֹר
  choice: Er lässt nicht ab
  rationale: עָבַר bedeutet grundsätzlich „vorübergehen/weitergehen“. Im warnenden Zusammenhang gibt die idiomatische Wendung „nicht ablassen“ die beharrliche Fortsetzung des feindseligen Verhaltens natürlich wieder, ohne einen rein räumlichen Vorgang vorauszusetzen.
- source_word: עַד
  choice: bis
  rationale: Die Präposition bezeichnet den zeitlichen Endpunkt des fortgesetzten Handelns.
- source_word: תִּבְעַר
  choice: brennt
  rationale: Die feminine Verbform passt zu dem femininen Substantiv אֵשׁ als Subjekt. Daher wird nicht kausativ „er entzündet“ übersetzt, sondern intransitiv „ein Feuer brennt“.
- source_word: בּוֹ
  choice: in ihm
  rationale: Die Präposition mit Suffix wird formal als „in ihm“ wiedergegeben. Wer mit „ihm“ gemeint ist und wie das Feuerbild genau zu verstehen ist, bleibt wie im knappen Hebräisch offen.
- source_word: אֵשׁ
  choice: ein Feuer
  rationale: Der indefinite Ausdruck wahrt das Bild des Feuers und klingt im Deutschen natürlich.
theological_decisions:
- issue: Vorrang des erhaltenen hebräischen Textes gegenüber der erheblich ausführlicheren griechischen Parallelfassung
  choice: Der hebräische Wortlaut bildet den Haupttext; die griechische Parallelfassung steht in einer Fußnote.
  alternative: „Er wird seinen Kopf schütteln und in die Hände klatschen, viel flüstern und sein Gesicht verziehen.“
  rationale: Der erhaltene hebräische Text ist knapp und bildhaft, während die griechische Fassung deutlich abweicht und feindselige Gesten ausführt. Die Übersetzung wahrt den Vorrang des Hebräischen, macht aber die textgeschichtlich bedeutsame griechische Lesart transparent.
- issue: Deutung des Feuers
  choice: 'Das Bild bleibt unaufgelöst: „bis ein Feuer in ihm brennt“.'
  alternative: Das Feuer ausdrücklich als Zorn, Streit oder Schaden deuten.
  rationale: Der hebräische Satz benennt die Bedeutung des Feuers nicht. Eine ausdrückliche Deutung würde die echte Mehrdeutigkeit unnötig beseitigen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Er lässt nicht ab“ vermittelt die im Kontext gemeinte Beharrlichkeit idiomatisch; die ungewöhnliche Feuerformulierung bleibt bewusst bildhaft und mehrdeutig.
