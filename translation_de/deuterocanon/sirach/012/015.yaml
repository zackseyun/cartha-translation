  text: Afterward you will understand my words[a], and for my sister you will sigh.
translation:
  language: de
  text: Später wirst du meine Worte begreifen[a], und um meine Schwester wirst du seufzen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das Hebräische ist hier schwierig, besonders die mit „um meine Schwester“ wiedergegebene Wendung. Der griechische Text lautet stattdessen: „Eine Stunde lang wird er bei dir bleiben; doch wenn du abweichst, wird er nicht durchhalten.“ Er bezeugt damit einen wesentlich anderen Text oder eine andere Deutung.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּלְאָחוֹר
  choice: Später
  rationale: Die Wendung bezeichnet einen späteren Zeitpunkt; „Später“ ist natürlich und legt nicht fest, ob „zu spät“ gemeint ist.
- source_word: תַּשִּׂיג
  choice: wirst du … begreifen
  rationale: Das Verb bedeutet grundsätzlich „erreichen/einholen“. Mit „meine Worte“ als Objekt gibt „begreifen“ den übertragenen Sinn im Deutschen natürlich wieder, ohne die verzögerte Einsicht zu überdeuten.
- source_word: אֲמָרַי
  choice: meine Worte
  rationale: Direkte und im modernen Standarddeutsch natürliche Wiedergabe des Plurals mit Suffix der ersten Person.
- source_word: וּלְאַחְוָתִי
  choice: um meine Schwester
  rationale: Die überlieferte hebräische Form ist schwierig, legt dem Konsonantenbestand nach jedoch am ehesten „meine Schwester“ nahe. „Um“ verbindet das Seufzen idiomatisch mit dem Anlass, ohne die unklare Wendung sachlich aufzulösen.
- source_word: תִּתְאַנָּח
  choice: wirst du seufzen
  rationale: Das Verb bezeichnet Seufzen oder Stöhnen. „Seufzen“ bewahrt den zurückhaltenden emotionalen Gehalt und klingt im Deutschen natürlich.
theological_decisions:
- issue: Vorrang des erhaltenen hebräischen Textes bei stark abweichender griechischer Überlieferung
  choice: Der Haupttext folgt dem erhaltenen Hebräisch; die erheblich abweichende griechische Lesart wird in der Fußnote dokumentiert.
  alternative: 'Dem Griechischen folgen: „Eine Stunde lang wird er bei dir bleiben; doch wenn du abweichst, wird er nicht durchhalten.“'
  rationale: Wo für Jesus Sirach Hebräisch erhalten ist, bildet es die primäre Textgrundlage. Die griechische Fassung bezeugt hier einen wesentlich anderen Text oder eine andere Deutung und darf deshalb nicht stillschweigend an die Stelle des Hebräischen treten.
- issue: Umgang mit der semantisch unsicheren hebräischen Wendung וּלְאַחְוָתִי
  choice: Die naheliegende formale Wiedergabe „um meine Schwester“ bleibt im Haupttext stehen; ihre Unsicherheit wird offengelegt.
  alternative: Konjektural glätten, etwa „um meine Gefährtin“, „um die Gemeinschaft“, oder die ganze Zeile nach dem Griechischen ersetzen.
  rationale: Die schwierige Überlieferung soll weder harmonisiert noch durch eine konfessionell oder interpretativ geprägte Festlegung verdeckt werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Begreifen“ ist mit „Worte“ idiomatischer als das formalere „erreichen“, während die schwer verständliche Wendung „meine Schwester“ bewusst nicht geglättet wird.
