  text: Listen to me and receive understanding[b][a], and pay attention in your heart to my words.
translation:
  language: de
  text: Hört auf mich und nehmt meine Einsicht an[a]; richtet euer Herz auf meine Worte.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Text lautet: „Hör auf mich, Kind, und lerne Erkenntnis.“ Der hebräische Text hat weder „Kind“ noch die Einzahl und lautet: „Nehmt meine Einsicht an.“'
    reason: alternative_reading
  - marker: b
    text: 'Hebräisch wörtlich: „Setzt/richtet das Herz auf meine Worte“; der griechische Text hat: „Achte mit deinem Herzen auf meine Worte.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ אֵלַי
  choice: Hört auf mich
  rationale: Der hebräische Imperativ steht im Plural und fordert zu aufmerksamem, folgebereitem Hören auf. „Hört auf mich“ ist im modernen Deutsch natürlich und bewahrt diesen Aufforderungscharakter.
- source_word: וּקְחוּ
  choice: nehmt … an
  rationale: לקח bedeutet grundsätzlich „nehmen“. Im Lehrzusammenhang gibt „annehmen“ die Aufnahme und Aneignung der angebotenen Einsicht idiomatisch wieder.
- source_word: שִׂכְלִי
  choice: meine Einsicht
  rationale: Das Suffix der ersten Person wird ausdrücklich wiedergegeben. שכל bezeichnet hier Einsicht oder verständige Erkenntnis; „Einsicht“ wahrt den kognitiven und lebenspraktischen Sinn.
- source_word: וְעַל דְבָרַי שִׂימוּ לֵב
  choice: richtet euer Herz auf meine Worte
  rationale: Die Wiedergabe bleibt nahe beim hebräischen Bild „Herz setzen/richten“ und ist zugleich verständliches, würdiges Deutsch. Das ausdrücklich genannte Herz bleibt als Ort des Denkens und Aufmerkens erhalten.
theological_decisions:
- issue: Bestimmung der Angeredeten
  choice: Kein „Kind“ im Haupttext; Anrede und Imperative stehen im Plural
  alternative: „Hör auf mich, Kind …“ nach dem griechischen Paralleltext
  rationale: Der vorrangige hebräische Text enthält keine Kindes-Anrede und verwendet Pluralformen. Die abweichende griechische Überlieferung wird in einer Fußnote bewahrt, ohne sie in den Haupttext einzutragen.
- issue: Bildsprache des Herzens
  choice: „richtet euer Herz auf meine Worte“
  alternative: „achtet auf meine Worte“
  rationale: Sowohl der hebräische als auch der griechische Text nennt ausdrücklich das Herz. Die konkrete anthropologische Bildsprache soll nicht zu einer bloßen Aufmerksamkeitsformel verflacht werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die pluralische Anrede des hebräischen Textes wird konsequent beibehalten; die Satzstruktur bleibt knapp und lehrhaft. Das Semikolon verbindet die beiden parallelen Aufforderungen, ohne ihre Eigenständigkeit aufzuheben.
