  text: Even if one person is stiff-necked[a], it is astonishing if he will be cleared; for mercy and anger are with him, and he bears and forgives[b], but upon the wicked he lets his wrath rest.
translation:
  language: de
  text: 'Und selbst wenn nur einer halsstarrig ist: Es wäre erstaunlich, wenn er freigesprochen würde.[a] Denn Erbarmen und Zorn sind bei ihm; er trägt und vergibt, doch auf den Frevlern lässt er seinen Grimm ruhen.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wenn er ungestraft bliebe“. Das hebräische Wort יִנָּקֶה und das griechische ἀθῳωθήσεται können bedeuten, von Schuld oder Strafe frei zu sein.'
    reason: lexical_alternative
  - marker: b
    text: Wörtlich spricht das Hebräische davon, dass er seinen Grimm auf den Frevlern ruhen lässt – ein Bild dafür, dass der Grimm auf ihnen liegen bleibt.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַקְשֶׁה עֹרֶף / σκληροτράχηλος
  choice: halsstarrig
  rationale: Das geläufige biblische Wort bewahrt das hebräische Bild vom verhärteten Nacken und bezeichnet hartnäckigen Widerstand.
- source_word: תֵּמַהּ זֶה / θαυμαστὸν τοῦτο
  choice: es wäre erstaunlich
  rationale: Die Formulierung gibt die rhetorische Verwunderung beider Textzeugen in natürlichem modernem Deutsch wieder.
- source_word: יִנָּקֶה / ἀθῳωθήσεται
  choice: freigesprochen würde
  rationale: 'Hebräisch und Griechisch erlauben einen forensischen Sinn: von Schuld beziehungsweise Strafe frei erklärt zu werden. Der Konjunktiv entspricht dem bedingten Satz.'
- source_word: רַחֲמִים
  choice: Erbarmen
  rationale: Das Wort bezeichnet mitfühlende Barmherzigkeit; „Erbarmen“ ist verständlich und steht prägnant dem Zorn gegenüber.
- source_word: אַף
  choice: Zorn
  rationale: Hier ist אַף das Substantiv für Zorn, nicht die Konjunktion „auch“, wie Parallelismus und Fortsetzung zeigen.
- source_word: וְנוֹשֵׂא
  choice: er trägt
  rationale: Die knappe Wiedergabe erhält die Mehrdeutigkeit des Verbs zwischen Tragen, Ertragen und Wegtragen, ohne ein unausgesprochenes Objekt festzulegen.
- source_word: וְסוֹלֵחַ
  choice: vergibt
  rationale: Dies ist in Aussagen über göttliche Vergebung die klare und übliche Bedeutung.
- source_word: יַנִּיחַ רָגְזוֹ
  choice: lässt er seinen Grimm ruhen
  rationale: Die Wiedergabe bewahrt das hebräische Bild, dass der Grimm auf den Frevlern zur Ruhe kommt beziehungsweise liegen bleibt.
theological_decisions:
- issue: Gottes Erbarmen und Zorn
  choice: Erbarmen und Zorn werden beide ausdrücklich bei Gott verortet; Vergebung und bleibender Grimm stehen unaufgelöst nebeneinander.
  alternative: Den Zorn abzuschwächen oder die Aussage einseitig auf das Erbarmen zu beziehen.
  rationale: Der hebräische Text stellt beide Seiten ausdrücklich zusammen. Die Übersetzung bewahrt diese theologische Spannung.
- issue: Bedeutung von יִנָּקֶה
  choice: Die forensische Möglichkeit wird im Text mit „freigesprochen“ ausgedrückt und in der Fußnote um die mögliche Straffreiheit ergänzt.
  alternative: Ausschließlich „ungestraft bleiben“ zu übersetzen.
  rationale: So bleibt der gemeinsame Bedeutungsbereich des hebräischen und griechischen Zeugen sichtbar, ohne ihn allein auf Strafvollzug zu verengen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter biblischer Bildsprache. „Halsstarrig“ und „Grimm“ sind leicht gehoben, aber allgemein verständlich. Die ungewöhnlich knappe Wendung „er trägt und vergibt“ bleibt bewusst offen, weil das Hebräische kein Objekt nennt.
