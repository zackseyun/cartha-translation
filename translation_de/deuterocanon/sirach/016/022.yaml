  text: Who will declare a work of righteousness[c][b][a], and who will wait for it? For the covenant is far off.
translation:
  language: de
  text: '**Sirach 16,22**


    Wer wird eine Tat der Gerechtigkeit verkünden,[a][b] und wer wird darauf warten? Denn der Bund[c] liegt in weiter Ferne.


    [a] Der hebräische Text ist hier schwer verständlich, etwa: „Was ist eine Tat der Gerechtigkeit – wer wird sie kundtun? Und die Hoffnung worauf …?“ Der griechische Paralleltext lautet klarer: „Wer wird Taten der Gerechtigkeit verkünden, und wer wird ausharren/warten? Denn der Bund ist fern.“


    [b] Auch möglich: „Taten der Gerechtigkeit“, „eine gerechte Tat“ oder „eine Tat des Rechts“.


    [c] Griechisch: „der Bund“; der hebräische Text scheint im letzten Satzteil „Satzung“, „Bestimmung“ oder „Erlass“ zu lesen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hebräische Text ist hier schwer verständlich, etwa: „Was ist eine Tat der Gerechtigkeit – wer wird sie kundtun? Und die Hoffnung worauf …?“ Der griechische Paralleltext lautet klarer: „Wer wird Taten der Gerechtigkeit verkünden, und wer wird ausharren/warten? Denn der Bund ist fern.“'
    reason: textual_variant
  - marker: b
    text: 'Auch möglich: „Taten der Gerechtigkeit“, „eine gerechte Tat“ oder „eine Tat des Rechts“.'
    reason: lexical_alternative
  - marker: c
    text: 'Griechisch: „der Bund“; der hebräische Text scheint im letzten Satzteil „Satzung“, „Bestimmung“ oder „Erlass“ zu lesen.'
    reason: alternative_reading
lexical_decisions:
- source_word: מָה מַעֲשֶׂה צֶדֶק / ἔργα δικαιοσύνης
  choice: eine Tat der Gerechtigkeit
  rationale: Die schwierige hebräische Singularform und der griechische Plural teilen den Kerngedanken einer gerechten beziehungsweise von Gerechtigkeit geprägten Tat. Der Singular wahrt die hebräische Form, während die Fußnote den griechischen Plural und weitere sachgerechte Möglichkeiten nennt.
- source_word: מִי יַגִּידֶנּוּ / τίς ἀναγγελεῖ
  choice: Wer wird … verkünden
  rationale: Hebräisch הגיד und griechisch ἀναγγέλλω können ein Kundtun, Berichten oder Verkünden bezeichnen. „Verkünden“ erhält den gehobenen rhetorischen Ton, ohne altertümlich zu wirken.
- source_word: וְתִקְוַת מָּה כִי אָצוּק חוֹק / ἢ τίς ὑπομενεῖ
  choice: und wer wird darauf warten
  rationale: Der hebräische Wortlaut ist offenbar gestört, enthält aber תקוה, „Hoffnung/Erwartung“. Das griechische ὑπομενεῖ bezeichnet Warten, Standhalten oder Ausharren. „Darauf warten“ lässt beide Bedeutungsfelder anklingen und wahrt die rhetorische Parallelität.
- source_word: חוֹק / ἡ διαθήκη
  choice: der Bund
  rationale: Hebräisch חוק bedeutet „Satzung“, „Bestimmung“ oder „Erlass“, während die klarere griechische Fassung διαθήκη, „Bund“, bietet. Für den zusammenhängenden Haupttext wird die griechische Lesart verwendet; die hebräische wird ausdrücklich in der Fußnote bewahrt.
- source_word: μακράν
  choice: liegt in weiter Ferne
  rationale: Die Wendung gibt das griechische μακράν idiomatisch und ohne zeitliche oder räumliche Bedeutung festzulegen wieder. Der entsprechende Gedanke ist im überlieferten hebräischen Wortlaut nicht eindeutig erkennbar.
theological_decisions:
- issue: Gewichtung des schwierigen hebräischen Textes gegenüber dem klareren griechischen Paralleltext
  choice: Der Haupttext folgt dort der kohärenten griechischen Satzfolge, wo der hebräische Text offenbar gestört ist; hebräische Anklänge und Abweichungen werden bewahrt und offengelegt.
  alternative: 'Eine streng hebräisch orientierte Wiedergabe wie: „Was ist eine Tat der Gerechtigkeit – wer wird sie kundtun, und Hoffnung worauf? Denn festgesetzt ist eine Satzung.“'
  rationale: Der erhaltene hebräische Wortlaut hat grundsätzlich Vorrang, ergibt hier jedoch besonders im zweiten Halbvers keinen sicheren zusammenhängenden Sinn. Die griechische Überlieferung bietet eine verständliche Lesart. Die Fußnoten verhindern, dass ihre Übernahme die tatsächliche textliche Unsicherheit oder die hebräische Lesart „Satzung/Erlass“ verdeckt.
- issue: Bedeutung von δικαιοσύνη / צֶדֶק
  choice: Gerechtigkeit
  alternative: Recht; gerechte Tat
  rationale: „Gerechtigkeit“ lässt den ethischen und rechtlichen Bedeutungsumfang offen und vermeidet eine unnötige dogmatische Verengung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorischen Fragen und die knappe Sentenzform bleiben erhalten. „Tat der Gerechtigkeit“ ist bewusst etwas formeller, aber allgemein verständlich; textkritische Unsicherheiten werden nicht im Haupttext geglättet, sondern transparent in den Fußnoten ausgewiesen.
