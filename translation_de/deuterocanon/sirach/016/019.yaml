  text: Even the peaks of the mountains and the foundations of the world—when he looks at them[a], they quake.
translation:
  language: de
  text: Selbst die Gipfel der Berge und die Grundfesten der Welt[a] – wenn er sie anblickt, erbeben sie heftig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: „die Grundfesten der Welt“; der griechische Paralleltext hat „die Grundfesten der Erde“.'
    reason: alternative_reading
lexical_decisions:
- source_word: קִצְבֵי הָרִים
  choice: die Gipfel der Berge
  rationale: קִצְבֵי bezeichnet die äußersten Bereiche oder Enden; bei Bergen gibt „Gipfel“ das Bild im Deutschen natürlich und anschaulich wieder.
- source_word: וִיסוֹדֵי תֵבֵל
  choice: und die Grundfesten der Welt
  rationale: יְסוֹדֵי bezeichnet Fundamente oder Grundfesten. תֵבֵל meint hier die geordnete beziehungsweise bewohnte Welt; „Welt“ folgt dem hebräischen Hauptzeugen, während der griechische Paralleltext „Erde“ bietet.
- source_word: בְּהַבִּיטוֹ אֲלֵיהֶם
  choice: wenn er sie anblickt
  rationale: Die Infinitivkonstruktion wird idiomatisch als Temporalsatz wiedergegeben. Das kleingeschriebene Pronomen bewahrt den im Hebräischen nur aus dem Zusammenhang erschließbaren göttlichen Bezug.
- source_word: רַעַשׁ יִרְעָשׁוּ
  choice: erbeben sie heftig
  rationale: Die Verbindung des Nomens רַעַשׁ mit dem gleichstämmigen Verb verstärkt die Aussage. „erbeben sie heftig“ bewahrt diese Intensivierung, ohne im Deutschen eine schwerfällige Wortwiederholung zu erzeugen.
theological_decisions:
- issue: Unausgesprochenes göttliches Subjekt bei „wenn er sie anblickt“
  choice: Das Pronomen „er“ bleibt stehen, ohne Gott ausdrücklich zu nennen.
  alternative: wenn Gott sie anblickt
  rationale: Der Zusammenhang weist auf Gott als Subjekt, doch der hebräische Satz nennt ihn an dieser Stelle nicht ausdrücklich. Die Übersetzung bewahrt diese Form.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Gedankenstrich bildet die feierliche Satzbewegung ab; „Grundfesten“ erhält das kosmische Bild, und „heftig“ gibt die hebräische Verstärkung natürlich wieder.
