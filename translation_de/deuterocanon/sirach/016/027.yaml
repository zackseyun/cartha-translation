  yaml_path: translation/deuterocanon/sirach/016/027.yaml
  text: He ordered his works forever[a], and their beginnings for their generations; they neither hungered nor grew weary, and they did not cease from their works.
translation:
  language: de
  text: Er ordnete seine Werke für immer und ihre Anfänge[a] für ihre Generationen. Sie hungerten nicht und wurden nicht müde und ließen nicht von ihren Werken ab.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihre Herrschaftsbereiche“. Das griechische Wort kann „Anfänge“, „Ursprünge“ oder „Herrschaftsbereiche“ bedeuten; im Zusammenhang können die den Schöpfungswerken zugewiesenen Wirkungsbereiche gemeint sein.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκόσμησεν
  choice: ordnete
  rationale: Das Verb bezeichnet hier im kosmologischen Zusammenhang das ordnende Einrichten der Schöpfungswerke, nicht ihre Ausschmückung.
- source_word: εἰς αἰῶνα
  choice: für immer
  rationale: Die Wendung drückt bleibende Dauer aus und wird so in natürlichem, modernem Deutsch wiedergegeben.
- source_word: τὰ ἔργα αὐτοῦ
  choice: seine Werke
  rationale: Gemeint sind im Zusammenhang die Werke der Schöpfung; die Wiedergabe bleibt nah am Griechischen und bewahrt dessen Weite.
- source_word: τὰς ἀρχὰς αὐτῶν
  choice: ihre Anfänge
  rationale: ἀρχή bedeutet zunächst „Anfang“ und kann daneben Herrschaft, Ursprung oder ersten Grund bezeichnen. Die formal naheliegende Bedeutung wird im Text bewahrt; die kontextuell mögliche Deutung als Zuständigkeitsbereiche steht in der Fußnote.
- source_word: εἰς γενεὰς αὐτῶν
  choice: für ihre Geschlechter
  rationale: Die Formulierung erhält die enge Verbindung zu γενεά und die ungewöhnliche Ausdrucksweise des griechischen Textes, ohne „Generationen“ als modernen Fachausdruck aufzudrängen.
- source_word: οὔτε ἐπείνασαν οὔτε ἐκοπίασαν
  choice: Sie hungerten nicht und wurden nicht müde
  rationale: Die beiden negierten Aoriste beschreiben zusammenfassend das unermüdliche Funktionieren der geschaffenen Ordnung; idiomatisches Deutsch gibt dies mit koordinierten Verben wieder.
- source_word: οὐκ ἐξέλιπον ἀπὸ τῶν ἔργων αὐτῶν
  choice: ließen nicht von ihren Aufgaben ab
  rationale: ἐκλείπω mit ἀπό bezeichnet hier das Ausbleiben beziehungsweise Aufhören der jeweiligen Tätigkeit. „Aufgaben“ macht den funktionalen Sinn von ἔργα in diesem Satz verständlich, ohne ihn als bloße körperliche Arbeit misszuverstehen.
theological_decisions:
- issue: Bedeutung von τὰς ἀρχὰς αὐτῶν innerhalb der geordneten Schöpfung
  choice: Im Haupttext steht die lexikalisch unmittelbare Wiedergabe „ihre Anfänge“.
  alternative: Die Wendung kann auf ihre Herrschafts- oder Zuständigkeitsbereiche innerhalb der Schöpfungsordnung bezogen werden.
  rationale: Der griechische Ausdruck ist mehrdeutig. Der Kontext geordnet und dauerhaft wirkender Schöpfungswerke begünstigt eine funktionale Deutung, doch „Herrschaftsbereiche“ würde diese festlegen. Haupttext und Fußnote bewahren deshalb die Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die leicht fremdartige Wendung „ihre Anfänge für ihre Geschlechter“ bleibt wegen der echten Mehrdeutigkeit des Ausgangstextes erhalten; die Fußnote bietet die im Schöpfungskontext mögliche funktionale Lesart. Das zweite „Werke“ wird als „Aufgaben“ wiedergegeben, um natürliches Deutsch und den Tätigkeitsbezug zu wahren.
