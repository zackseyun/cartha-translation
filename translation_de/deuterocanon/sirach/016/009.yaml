lexical_decisions:
- source_word: וְלֹא חָמַל
  choice: Und er verschonte nicht
  rationale: חמל kann Mitleid oder Schonung bezeichnen. Im Gerichtszusammenhang gibt „verschonte nicht“ die konkrete Aussage knapp und natürlich wieder.
- source_word: גֹוי
  choice: Volk
  rationale: גוי bezeichnet hier ein Volk; „Volk“ vermeidet die modernen politischen Nebenbedeutungen von „Nation“.
- source_word: חֶרֶם
  choice: dem Untergang geweiht
  rationale: חרם bezeichnet etwas, das dem Bann und damit der Vernichtung übergeben ist. Die Formulierung bewahrt sowohl den Weihe- als auch den Gerichtsaspekt, ohne den im Deutschen erklärungsbedürftigen Ausdruck „Bann“ in den Haupttext zu setzen.
- source_word: הַנּדוֹשִׁים
  choice: die ... Zertretenen
  rationale: Die schwierige hebräische Form wird wahrscheinlich von einem Verb für Treten oder Dreschen abgeleitet. „Zertretenen“ erhält dieses Gerichtsbild; der griechische Paralleltext bietet dagegen eine Formulierung im Sinn von „weggenommen“.
- source_word: בַּעֲוֹנָם
  choice: in ihrer Schuld
  rationale: עון umfasst Verfehlung und die daraus erwachsende Schuld. „In ihrer Schuld“ folgt der Präposition ב eng und bewahrt die Spannung zwischen schuldhaftem Zustand und Gericht.
theological_decisions:
- issue: Wiedergabe von חרם im Zusammenhang des göttlichen Gerichts
  choice: dem Untergang geweiht
  alternative: dem Bann verfallen; zum Untergang bestimmt
  rationale: Die gewählte Fassung erhält die sakral-rechtliche und zerstörerische Tragweite des Ausdrucks, ohne sie durch spätere Lehrbegriffe näher festzulegen.
- issue: Umgang mit dem schwierigen הַנּדוֹשִׁים gegenüber dem griechischen Paralleltext
  choice: die in ihrer Schuld Zertretenen
  alternative: die in ihren Sünden Weggenommenen
  rationale: Der Haupttext folgt dem vorrangigen hebräischen Zeugnis und erhält dessen Bildsprache. Die abweichende, aber verwandte griechische Lesart wird wegen der textlichen Unsicherheit in einer Fußnote dokumentiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die substantivische Apposition „die ... Zertretenen“ bewahrt den Numerus des hebräischen Partizips und die Härte des Gerichtswortes; die Fußnote macht die Unsicherheit transparent.
