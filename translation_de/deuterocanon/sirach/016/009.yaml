translation:
  language: de
  text: Und er verschonte ein dem Untergang geweihtes Volk nicht, das in seiner Schuld zertreten wurde[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Paralleltext lautet: „ein Volk des Verderbens, die in ihren Sünden Hinweggerafften“. Das Hebräische verwendet anscheinend das Bild des Zertretens oder Zermalmens; der griechische Text gibt einen verwandten Gerichtssinn mit anderer Wortwahl wieder.'
