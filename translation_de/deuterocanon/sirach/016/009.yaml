  naturalness: „Und er verschonte ein dem Untergang geweihtes Volk nicht“ ist modernes, verständliches Deutsch und bewahrt den Umfang der hebräischen Aussage. Der Relativsatz mit dem kollektiven Singular „Volk“ löst die Kongruenzschwierigkeit natürlich.
