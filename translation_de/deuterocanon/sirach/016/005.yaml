  text: My eye has seen many such things[a], and my ear has heard things as mighty as these.
translation:
  language: de
  text: Viele solche Dinge hat mein Auge gesehen, und mächtige Dinge wie diese hat mein Ohr gehört.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Text lautet: „mächtigere Dinge als diese“.'
    reason: Der hebräische Text hat „mächtige Dinge wie diese“, während der griechische Paralleltext mit ἰσχυρότερα einen ausdrücklichen Komparativ bietet; die textliche Spannung wird offengelegt.
lexical_decisions:
- source_word: רַבּוֹת כָּאֵלֶּה
  choice: viele solche Dinge
  rationale: Das substantivisch gebrauchte feminine Pluralwort רַבּוֹת bezeichnet eine Vielzahl; כָּאֵלֶּה fügt den vergleichenden Sinn „solche / wie diese“ hinzu. „Dinge“ macht die im Hebräischen ausgelassene Bezugsgröße im Deutschen verständlich.
- source_word: רַאֲתָה עֵינִי
  choice: hat mein Auge gesehen
  rationale: Der Singular „mein Auge“ bleibt erhalten und wahrt den poetischen Parallelismus mit „mein Ohr“.
- source_word: וְעַצֻּמוֹת כָּאֵלֶּה
  choice: und mächtige Dinge wie diese
  rationale: עַצֻּמוֹת bezeichnet hier durch Stärke, Macht oder Eindruck Hervorragendes; כָּאֵלֶּה wird entsprechend dem hebräischen Wortlaut vergleichend als „wie diese“ wiedergegeben. Die abweichende explizit komparative Lesart des griechischen Paralleltexts wird in der Fußnote bewahrt.
- source_word: שָׂמְעָה אָזְנִי
  choice: hat mein Ohr gehört
  rationale: Der Singular und die personifizierende Körperteilformulierung entsprechen dem Hebräischen und bilden mit „mein Auge“ eine klare poetische Parallele.
