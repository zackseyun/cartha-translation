  text: Each one did not oppress his neighbor[a], and they will never disobey his word.
translation:
  language: de
  text: Jeder Einzelne bedrängte seinen Nächsten nicht, und niemals werden sie seinem Wort ungehorsam sein.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und niemals werden sie seinem Wort den Gehorsam verweigern.“ Das griechische Verb kann sowohl als Zustand des Ungehorsams als auch als tätige Gehorsamsverweigerung wiedergegeben werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕκαστος
  choice: jeder Einzelne
  rationale: Die distributive Einzahl wird ausdrücklich bewahrt; zugleich lässt der anschließende Plural erkennen, dass die Gesamtheit der zuvor genannten Geschöpfe gemeint ist.
- source_word: τὸν πλησίον αὐτοῦ
  choice: seinen Nächsten
  rationale: „Der Nächste“ gibt πλησίον in seiner relationalen Bedeutung wieder und bewahrt das Bild, ohne es durch „Mitgeschöpf“ kontextuell zu verengen.
- source_word: οὐκ ἔθλιψεν
  choice: bedrängte … nicht
  rationale: θλίβω bezeichnet wörtlich ein Drücken oder Einengen und übertragen ein Bedrängen oder Unterdrücken. „Bedrängen“ passt zum Bild geordneter Geschöpfe, die einander keinen Raum nehmen, ohne stärker als der griechische Text soziale Unterdrückung vorauszusetzen.
- source_word: ἕως αἰῶνος
  choice: niemals
  rationale: In Verbindung mit der Verneinung bezeichnet die Wendung ein dauerhaftes Ausbleiben des Ungehorsams. „Niemals“ ist im modernen Deutschen natürlich und erhält die zeitlich uneingeschränkte Aussage.
- source_word: οὐκ ἀπειθήσουσι
  choice: werden … nicht ungehorsam sein
  rationale: Die Wiedergabe bewahrt das Futur und die mögliche zuständliche Nuance von ἀπειθέω; wegen „niemals“ entfällt im deutschen Satz ein zusätzliches „nicht“.
- source_word: τοῦ ῥήματος αὐτοῦ
  choice: seinem Wort
  rationale: „Wort“ erhält die Bedeutungsbreite von ῥῆμα zwischen Ausspruch und Anordnung; „Befehl“ wäre enger als der griechische Ausdruck.
theological_decisions:
- issue: Bezug des Possessivpronomens in „seinem Wort“
  choice: Das Pronomen bleibt stehen; Gott ist im Kontext der naheliegende Bezug.
  alternative: Explizit „Gottes Wort“ oder das Wort einer nicht näher bestimmten herrschenden Person.
  rationale: Der Zusammenhang mit der geordneten Schöpfung legt Gott als Bezug nahe. Die Übersetzung ersetzt das Pronomen dennoch nicht durch „Gottes“, damit sie nicht mehr festlegt als der griechische Wortlaut.
- issue: Wechsel von distributiver Einzahl zu Mehrzahl
  choice: „Jeder Einzelne … sie“
  alternative: Eine vollständig pluralische Wiedergabe wie „Keiner von ihnen … sie“.
  rationale: 'Der grammatische Wechsel des griechischen Textes wird sichtbar erhalten: Zunächst wird jedes einzelne Glied betrachtet, danach die Gesamtheit.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnliche, aber verständliche Folge „jeder Einzelne … sie“ bewahrt bewusst den Numeruswechsel des griechischen Textes. Der Fußnotenmarker steht bei der Wendung, auf die sich die sprachliche Alternative tatsächlich bezieht.
