base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/016/015.yaml
  text: Yahweh hardened Pharaoh’s heart[a], though he did not know him, for his deeds are revealed under heaven.
translation:
  language: de
  text: Der HERR verhärtete das Herz des Pharaos[a], der ihn nicht kannte; denn seine Taten liegen unter dem Himmel offen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Parallelüberlieferung lautet hier: „Sag nicht: Ich werde vor dem Herrn verborgen sein.“ Sie weicht erheblich von der erhaltenen hebräischen Zeile ab; möglicherweise liegt eine andere Textform oder Verszuordnung vor.'
    reason: textual_variant
lexical_decisions:
- source_word: יְהֹוָה
  choice: der HERR
  rationale: Gibt den Gottesnamen JHWH nach verbreiteter deutschsprachiger Bibeltradition ehrfürchtig als „der HERR“ wieder.
- source_word: הִקְשָׁה
  choice: verhärtete
  rationale: Das Hifil von קשה bezeichnet hier das Hart- oder Unnachgiebigmachen und bewahrt zugleich den deutlichen Bezug zur Pharaoüberlieferung im Exodusbuch.
- source_word: לֵב פַּרְעֹה
  choice: das Herz des Pharaos
  rationale: „Herz“ erhält die biblische Rede vom inneren Zentrum des Denkens und Wollens; „Pharao“ ist die übliche deutsche Form des Herrschertitels.
- source_word: אֲשֶׁר לֹא יְדָעוֹ
  choice: der ihn nicht kannte
  rationale: Die Relativkonstruktion wird möglichst formal wiedergegeben. Das Subjekt ist am natürlichsten Pharao, das Objektsuffix verweist auf den HERRN. Eine ausdrücklich kausale oder konzessive Deutung wird nicht in den Haupttext eingetragen.
- source_word: שֶׁמַעֲשָׂיו
  choice: denn seine Taten
  rationale: Das vorangestellte שׁ wird als Einleitung einer begründenden Aussage verstanden. „Taten“ ist eine natürliche moralisch gefärbte Wiedergabe von מעשים; das Possessivpronomen bleibt wie im Hebräischen referenziell mehrdeutig.
- source_word: מְגֻלִּין
  choice: liegen offen
  rationale: Die passive Form bezeichnet, dass etwas enthüllt beziehungsweise nicht verborgen ist. „liegen offen“ ist im Deutschen natürlich und wahrt den Gedanken vollständiger Sichtbarkeit.
- source_word: תַּחַת הַשָּׁמַיִם
  choice: unter dem Himmel
  rationale: Bewahrt die geläufige biblische Raumformel in würdiger, verständlicher Sprache.
theological_decisions:
- issue: Verhältnis des erhaltenen hebräischen Textes zur griechischen Parallelüberlieferung
  choice: Der Haupttext folgt dem erhaltenen Hebräisch; die stark abweichende griechische Zeile wird in einer Fußnote dokumentiert.
  alternative: 'Eine griechisch gestützte Wiedergabe: „Sag nicht: Ich werde vor dem Herrn verborgen sein.“'
  rationale: Für Jesus Sirach hat der erhaltene hebräische Wortlaut Vorrang. Da das Griechische hier keine enge Entsprechung bietet, darf es den hebräischen Haupttext nicht stillschweigend ersetzen; die Abweichung bleibt jedoch für die Textkritik sichtbar.
- issue: Bezug von „seine Taten“
  choice: Die pronominale Mehrdeutigkeit des Hebräischen wird mit „seine Taten“ bewahrt.
  alternative: Eine explizite Zuordnung zu Pharao oder zum HERRN.
  rationale: Der unmittelbare Satzbau kann das Pronomen auf Pharao beziehen, während weitere Zusammenhänge andere Bezüge nahelegen könnten. Eine namentliche Festlegung würde die im Ausgangstext bestehende Spannung unnötig auflösen.
translation_notes:
  register: Modernes Standarddeutsch in würdigem biblischem Register. Der Satz bleibt knapp und folgt eng der hebräischen Struktur, ohne unbeholfen zu wirken. Die traditionelle Schreibung „HERR“ kennzeichnet den Gottesnamen; die textkritisch bedeutsame griechische Abweichung wird ausschließlich in der Fußnote erklärt.
