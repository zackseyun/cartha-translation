base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/016/012.yaml
  text: As great as his mercies are[a], so also is his reproof[c][b]; he will judge a man according to his deeds.
translation:
  language: de
  text: So groß sein Erbarmen ist, so groß ist auch seine Zurechtweisung[a]; den Menschen wird er nach seinen Taten richten.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „sein Tadel“ oder „seine Ermahnung“.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort für „Mensch“ steht im maskulinen Singular und ist hier repräsentativ gebraucht.
    reason: cultural_note
lexical_decisions:
- source_word: כְּרָב ... כֵּן
  choice: So groß ... so groß auch
  rationale: Die Verhältnisformel כְּ... כֵּן wird im Deutschen natürlich als proportionale Entsprechung wiedergegeben und bewahrt die Parallelität beider Satzglieder.
- source_word: רַחֲמָיו
  choice: sein Erbarmen
  rationale: Das hebräische רַחֲמִים steht formal im Plural, ist jedoch eine übliche Bezeichnung für tiefes, reiches Erbarmen. Der deutsche Kollektivsingular ist idiomatisch; auch die griechische Parallele hat den Singular ἔλεος.
- source_word: תּוֹכַחְתּוֹ
  choice: seine Zurechtweisung
  rationale: תּוֹכַחַת bezeichnet tadelnde, auf Korrektur zielende Zurechtweisung. Die griechische Parallele ἔλεγχος bestätigt diesen Sinn; eine rein strafende Wiedergabe wäre zu eng.
- source_word: אִישׁ
  choice: den Menschen
  rationale: Der maskuline Singular ist hier repräsentativ gebraucht. „Den Menschen“ bewahrt den generischen Singular und klingt im modernen Deutschen natürlicher als „einen Mann“.
- source_word: כְּמִפְעָלָיו
  choice: nach seinen Taten
  rationale: מִפְעָל bezeichnet Tun, Werk oder Tat. „Taten“ ist idiomatisch und entspricht auch dem griechischen ἔργα.
- source_word: יִשְׁפֹּט
  choice: wird er ... richten
  rationale: Der hebräische Imperfekt kann hier zukunftsbezogen verstanden werden; der griechische Paralleltext bietet ausdrücklich das Futur κρινεῖ. „Richten“ erhält den gerichtlichen Ernst.
theological_decisions:
- issue: Verhältnis von göttlichem Erbarmen, Zurechtweisung und Gericht
  choice: Erbarmen und Zurechtweisung werden in ihrer Größe einander zugeordnet; anschließend folgt das Gericht nach den Taten.
  alternative: תּוֹכַחַת könnte stärker strafend als „Bestrafung“ wiedergegeben werden.
  rationale: 'Hebräisch תּוֹכַחַת und Griechisch ἔλεγχος bezeichnen vor allem Zurechtweisung oder Tadel. Die Wiedergabe wahrt die Spannung: Großes Erbarmen hebt weder göttliche Korrektur noch Verantwortung für die eigenen Taten auf.'
translation_notes:
  register: Gehobenes, aber gegenwärtiges Standarddeutsch. Die proportionale Satzform bleibt hörbar; „Zurechtweisung“ wahrt den korrektiven Sinn, ohne ihn vorschnell als bloße Strafe auszulegen.
