revisions:
- from: Vertraue nicht auf ihr Leben[a] und verlass dich nicht auf ihre Zukunft[b]; denn ihnen wird kein gutes Ende beschieden sein. Denn einer, der tut, was wohlgefällig ist[c], ist besser als tausend; und besser ist es, kinderlos zu sterben, als viele Kinder zu haben, die im Unrecht leben, und ein Ende in Vermessenheit[d] zu nehmen.
  to: Vertraue nicht auf ihr Leben[a] und verlass dich nicht auf ihre Zukunft[b]; denn sie werden kein gutes Ende haben. Denn wer tut, was wohlgefällig ist[c], ist besser als tausend; und besser ist es, kinderlos zu sterben, als viele Kinder im Unrecht zu haben und ein vermessenes Ende[d].
  rationale: Die Revision beseitigt eine unnatürliche und semantisch zu enge Auslegung der schwierigen Schlussgruppe. Die Hauptfassung bewahrt nun deren Charakter als elliptische Vergleichsgröße („ein vermessenes Ende“); die Fußnote hält die syntaktische Unsicherheit ausdrücklich offen. Außerdem wird die Aussage über das fehlende gute Ende unmittelbar und idiomatisch wiedergegeben.
  reviewer_model: gpt-5.6-terra
