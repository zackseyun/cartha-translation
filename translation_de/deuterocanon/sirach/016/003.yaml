base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/016/003.yaml
  text: Do not trust in their life[a], and do not rely on their future; for one who does what is pleasing is better than a thousand[c][b], and to die childless than to have many children in unrighteousness and a lawless end.
translation:
  language: de
  text: Vertraue nicht auf ihr Leben[a] und verlass dich nicht auf ihre Zukunft[b]; denn sie werden kein gutes Ende haben. Denn wer tut, was wohlgefällig ist[c], ist besser als tausend; und besser ist es, kinderlos zu sterben, als viele Kinder im Unrecht zu haben und ein vermessenes Ende[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint sein kann ihre scheinbare Lebenskraft oder ihr Wohlergehen.
    reason: lexical_clarification
  - marker: b
    text: 'Die griechische Überlieferung hat hier: „richte dich nicht nach ihrem Platz“ oder „verlass dich nicht auf ihre Stellung“. Das Hebräische spricht wahrscheinlich vom Kommenden, Ausgang oder Fortbestand.'
    reason: textual_variant
  - marker: c
    text: 'Auch möglich: „der den Willen tut“. Wahrscheinlich ist Gottes Wille oder Wohlgefallen gemeint; „Gottes“ steht jedoch nicht ausdrücklich im Hebräischen.'
    reason: lexical_alternative
  - marker: d
    text: Die hebräische Schlusswendung ist stark verkürzt und schwierig. Sie kann auch etwa „als ein vermessenes/frevles Ende“ verstanden oder enger mit den vielen Kindern im Unrecht verbunden werden.
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תַּאֲמִין בְּחַיֵּיהֶם
  choice: Vertraue nicht auf ihr Leben
  rationale: Das Hifil von אמן mit Präposition bezeichnet hier das Setzen von Vertrauen. „Ihr Leben“ wahrt die kollektive Form des Hebräischen und den Bezug auf die scheinbare Lebenskraft beziehungsweise das Wohlergehen der betreffenden Nachkommen.
- source_word: וְאַל תִּבְטַח בְּעִקְבוֹתָם
  choice: und verlass dich nicht auf ihre Zukunft
  rationale: בטח bezeichnet ein sicherndes Vertrauen. עִקְבוֹתָם kann das Nachfolgende, den Ausgang oder die Zukunft meinen; der anschließende Satz über ihr nicht gutes Ende stützt die vorwärts gerichtete Bedeutung.
- source_word: כִּי לֹא תִהְיֶה לָהֶם אַחֲרִית טוֹבָה
  choice: denn ihnen wird kein gutes Ende beschieden sein
  rationale: Die im hebräischen Ausgangstext vorhandene Klausel wird ausdrücklich wiedergegeben. אַחֲרִית bezeichnet das Ende beziehungsweise den Ausgang; „beschieden sein“ gibt die unpersönliche Konstruktion natürlich und würdig wieder.
- source_word: כִּי טוֹב אֶחָד ... מֵאָלֶף
  choice: Denn einer ... ist besser als tausend
  rationale: Die elliptische hebräische Vergleichskonstruktion wird durch das folgende Partizip ergänzt; auch die griechische Parallele bestätigt den Vergleich eines Einzelnen mit tausend.
- source_word: עוֹשֶׂה רָצוֹן
  choice: der tut, was wohlgefällig ist
  rationale: רָצוֹן kann Wille, Wohlgefallen oder Annahme bedeuten. Die Formulierung bewahrt den wahrscheinlich religiös-moralischen Sinn, ohne das im Hebräischen nicht ausdrücklich genannte Objekt „Gott“ einzufügen.
- source_word: וּמוֹת עֲרִירִי
  choice: und besser ist es, kinderlos zu sterben
  rationale: עֲרִירִי bezeichnet Kinderlosigkeit. Das im Hebräischen elliptische Vergleichsprädikat wird im Deutschen zur Verständlichkeit wiederholt.
- source_word: בָּנִים רַבִּים בְּעַוְלָה
  choice: viele Kinder zu haben, die im Unrecht leben
  rationale: עַוְלָה bezeichnet Unrecht, Verkehrtheit oder Ungerechtigkeit. Die Relativkonstruktion macht den attributiven Sinn im Deutschen klar, ohne die Aussage abzumildern.
- source_word: וּמֵאַחֲרִית זָדוֹן
  choice: und ein Ende in Vermessenheit zu nehmen
  rationale: זָדוֹן bezeichnet vermessene, anmaßende Bosheit. Die hebräische Schlusswendung ist gedrängt und syntaktisch schwierig; die gewählte Fassung bindet sie als weiteren Gegenstand des Vergleichs an das Leben mit vielen ungerechten Kindern.
theological_decisions:
- issue: Unausgesprochenes Objekt bei עוֹשֶׂה רָצוֹן
  choice: 'Das Objekt bleibt im Haupttext unausgesprochen: „tut, was wohlgefällig ist“.'
  alternative: „der Gottes Willen tut“
  rationale: Im weisheitlichen Zusammenhang ist ein Bezug auf Gottes Willen oder Wohlgefallen wahrscheinlich, doch „Gott“ steht nicht ausdrücklich im hebräischen Text. Die Übersetzung bewahrt diese Offenheit.
- issue: Wertung von Kinderlosigkeit gegenüber zahlreichen ungerechten Kindern
  choice: Der schroffe Vergleich wird unverändert beibehalten.
  alternative: Eine pastoral abgemilderte Umschreibung
  rationale: Der Vers stellt Rechtschaffenheit ausdrücklich über die Zahl der Nachkommen. Diese Spannung darf nicht durch moderne Empfindlichkeiten eingeebnet werden.
- issue: Deutung der schwierigen Schlusswendung וּמֵאַחֲרִית זָדוֹן
  choice: Sie wird als „ein Ende in Vermessenheit zu nehmen“ in den Vergleich einbezogen.
  alternative: „als aus einem vermessenen/bösen Ende“ oder Zuordnung als nähere Bestimmung der ungerechten Kinder
  rationale: Die hebräische Syntax ist komprimiert und lässt mehr als eine Anbindung zu. Der Haupttext bietet eine lesbare Möglichkeit; die Fußnote hält die Unsicherheit offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter Anrede im Singular. Die zwei hebräischen Begründungssätze werden vollständig wiedergegeben. Die elliptischen Vergleiche sind nur so weit ergänzt, wie es für natürliches Deutsch nötig ist; textliche und syntaktische Unsicherheiten stehen in den Fußnoten.
