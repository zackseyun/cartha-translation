review_pass:
  verdict: revise
  source_fidelity: Die zwei hebräischen Begründungssätze sind im Entwurf vollständig vertreten, und die Wiedergabe von עִקְבוֹתָם als „Zukunft“ bleibt angesichts der unsicheren, auf Ausgang/Folge zielenden Bedeutung vertretbar; die griechische Abweichung ist korrekt als Variante vermerkt. Die Schlussgruppe וּמֵאַחֲרִית זָדוֹן ist jedoch keine Aussage darüber, dass jemand „in Vermessenheit“ ein Ende aktiv „nimmt“, sondern eine äußerst gedrängte Vergleichsgröße mit „vermessenem/frevlem Ende“.
  naturalness: „Ein Ende in Vermessenheit zu nehmen“ ist im modernen Standarddeutschen unidiomatisch und verschiebt die Aussage. „Ein vermessenes Ende zu haben“ ist natürlich und wahrt die elliptische Anbindung an den Vergleich. „Wer tut, was wohlgefällig ist“ ist als religiös-moralisch gefärbte, aber verständliche Formulierung möglich.
  terminology: „Wohlgefällig“ lässt den im Hebräischen nicht ausdrücklich genannten Bezug offen. „Unrecht“, „kinderlos“ und „vermessen“ geben die wesentlichen Begriffe angemessen wieder. „Sie werden kein gutes Ende haben“ ist unmittelbarer und weniger schicksalhaft als „wird ... beschieden sein“.
