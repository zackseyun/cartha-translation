  text: Even if they become many[a], do not delight in them, if the fear of Yahweh is not with them.
translation:
  language: de
  text: Auch wenn sie zahlreich werden, freu dich nicht über sie[a], wenn die Furcht des HERRN nicht bei ihnen ist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Freu dich nicht über sie.« Die hebräische Formulierung ist hier nicht völlig eindeutig; die griechische Parallele stützt jedoch den Sinn, sich über sie zu freuen.'
    reason: lexikalische_alternative
lexical_decisions:
- source_word: וְגַם אִם / ἐὰν
  choice: Auch wenn
  rationale: Gibt die im Zusammenhang naheliegende konzessive Bedingung natürlich wieder.
- source_word: פָּרוּ / πληθύνωσιν
  choice: sie zahlreich werden
  rationale: Bewahrt den Gedanken des Sich-Vermehrens beziehungsweise des zahlenmäßigen Zunehmens, ohne die biologische Bildlichkeit unnötig zu verstärken.
- source_word: אַל תָּבֻעַ בָּם / μὴ εὐφραίνου ἐπʼ αὐτοῖς
  choice: freu dich nicht über sie
  rationale: Die hebräische Form ist nicht völlig durchsichtig; die griechische Parallele stützt jedoch eindeutig den Sinn des Sichfreuens. Die Formulierung ist im Deutschen natürlich und bewahrt den emotionalen Wertungsaspekt.
- source_word: אִם אֵין אִתָּם / εἰ μὴ ἔστιν ... μετʼ αὐτῶν
  choice: wenn ... nicht bei ihnen ist
  rationale: Bewahrt die in beiden Quellen ausgedrückte Vorstellung von Gegenwart oder Begleitung statt sie bloß als Besitz zu paraphrasieren.
- source_word: יִרְאַת יְהֹוָה / φόβος Κυρίου
  choice: die Furcht des HERRN
  rationale: Erhält die feste Weisheitsformel und ihre theologische Spannung; »Ehrfurcht« wäre verständlicher, würde den Ausdruck aber verengen.
- source_word: יְהֹוָה
  choice: der HERR
  rationale: Gibt das Tetragramm gemäß der etablierten deutschsprachigen Bibelkonvention mit HERR in Kapitälchen beziehungsweise Großbuchstaben wieder.
theological_decisions:
- issue: Wiedergabe der Weisheitsformel יִרְאַת יְהֹוָה
  choice: die Furcht des HERRN
  alternative: die Ehrfurcht vor dem HERRN
  rationale: Die traditionelle Formulierung bewahrt die Breite des biblischen Begriffs zwischen Scheu, Gehorsam und ehrfürchtiger Gottesbeziehung, ohne ihn auf ein einzelnes Moment festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Singularimperativ »freu dich nicht« folgt der direkten Anrede des hebräischen Weisheitslehrers. Auf eine Fußnote wurde verzichtet, da die durch die griechische Parallele gestützte Wiedergabe »freu dich nicht über sie« im Deutschen klar ist.
