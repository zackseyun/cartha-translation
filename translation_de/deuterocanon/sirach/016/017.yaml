  rationale: Die Revision verbessert die deutsche Syntax und den Fußnotenanker, ohne die schwierige hebräische Kosmosmetapher durch die glattere griechische Lesart zu ersetzen. „Bis an die Enden der Winde“ gibt dem Bild im Deutschen eine lesbare Funktion; die Fußnote hält sowohl die wörtliche Schwierigkeit als auch die abweichende griechische Lesart transparent fest.
