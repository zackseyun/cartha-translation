base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/016/017.yaml
  text: Do not say[a], “I am hidden from God, and from on high who will remember me? In a great people I will not be known; and what is my life among the ends of the winds, all the sons of man?”
translation:
  language: de
  text: 'Sag nicht: »Vor Gott bin ich verborgen; wer wird sich in der Höhe an mich erinnern? In einem zahlreichen Volk werde ich nicht bekannt sein. Was bedeutet schon meine Seele unter allen Menschen, bis an die Enden der Winde[a]?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hebräische Schlussausdruck ist schwierig; er lautet wörtlich etwa: „wie die Enden der Winde“. Griechisch: „in der unermesslichen Schöpfung“; dies kann eine andere hebräische Vorlage oder eine deutende Wiedergabe widerspiegeln.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תֹּאמַר
  choice: Sag nicht
  rationale: Gibt das hebräische Verbot knapp, unmittelbar und in natürlichem modernem Deutsch wieder.
- source_word: מֵאֵל נִסְתַּרְתִּי
  choice: Vor Gott bin ich verborgen
  rationale: Bewahrt den passiven Sinn des Hebräischen und die irrige Behauptung des Sprechers, Gottes Wahrnehmung entzogen zu sein.
- source_word: וּבַמָּרוֹם מִי יִזְכְּרֵנִי
  choice: und wer in der Höhe wird sich an mich erinnern?
  rationale: Behält sowohl das räumliche Bild der Höhe als auch die Grundbedeutung von זכר, »sich erinnern«, bei.
- source_word: בְּעַם כָּבֵד
  choice: In einer großen Menschenmenge
  rationale: כָּבֵד bezeichnet hier wahrscheinlich eine große beziehungsweise zahlreiche Menge. »Menschenmenge« ist im Kontext natürlicher und klarer als das missverständliche »in einem großen Volk«.
- source_word: לֹא אִוָּדֵעַ
  choice: werde ich nicht erkannt
  rationale: Gibt den passiven Sinn des Nifal von ידע formal nah wieder und bewahrt die Vorstellung vermeintlicher Anonymität.
- source_word: וּמַה נַפְשִׁי
  choice: und was bedeutet schon mein Leben
  rationale: נפש kann Selbst, Seele oder Leben bedeuten; die rhetorische Wendung bringt hier die empfundene Bedeutungslosigkeit des eigenen Lebens zum Ausdruck.
- source_word: כְּקַצּוֹת רוּחוֹת
  choice: an den Enden der Winde
  rationale: Bewahrt das schwierige, konkrete kosmische Bild des erhaltenen Hebräischen, ohne es nach dem glättenden griechischen Paralleltext aufzulösen.
- source_word: כּלָ בּנֵי אָדָם
  choice: unter allen Menschensöhnen
  rationale: Gibt die kollektive hebräische Wendung בני אדם erkennbar wieder; »unter« ordnet sie idiomatisch in die rhetorische Frage ein.
theological_decisions:
- issue: 'Schlussbild: schwierige hebräische Wendung gegenüber der griechischen Lesart'
  choice: Das hebräische Bild »an den Enden der Winde« steht im Haupttext.
  alternative: »in der unermesslichen Schöpfung«
  rationale: Da der hebräische Text erhalten ist, hat er Vorrang. Die griechische Fassung kann auf einer anderen Vorlage oder einer deutenden Glättung beruhen; die Abweichung wird daher transparent in einer Fußnote bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede bleibt rhetorisch und verständlich; das ungewöhnliche kosmische Schlussbild wird wegen seiner textlichen Bedeutung nicht geglättet.
