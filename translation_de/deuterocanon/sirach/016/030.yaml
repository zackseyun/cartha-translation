  yaml_path: translation/deuterocanon/sirach/016/030.yaml
  text: The surface of it covered the life of every living thing[b][a], and to it is their return.
translation:
  language: de
  text: Ihre Oberfläche bedeckte das Leben jedes Lebewesens, und zu ihr kehren sie zurück.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »und zu ihr ist ihre Rückkehr«. Das feminine Pronomen bezieht sich wahrscheinlich auf die Erde; »in sie hinein« ist ebenfalls möglich.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ψυχὴν
  choice: das Leben
  rationale: Im Zusammenhang mit παντὸς ζῴου bezeichnet ψυχή das belebte Leben, nicht ausdrücklich eine vom Körper getrennte Seele.
- source_word: παντὸς ζῴου
  choice: jedes Lebewesens
  rationale: Die Wendung umfasst allgemein lebende Geschöpfe und wird nicht unnötig auf Tiere verengt.
- source_word: ἐκάλυψεν
  choice: bedeckte
  rationale: Die schlichte Grundbedeutung des Verbs passt zur kosmologischen Beschreibung.
- source_word: τὸ πρόσωπον αὐτῆς
  choice: ihre Oberfläche
  rationale: Wörtlich steht »ihr Angesicht«; »Oberfläche« gibt die idiomatische Bedeutung mit Bezug auf die Erde verständlich wieder und erhält das feminine Pronomen.
- source_word: εἰς αὐτὴν
  choice: zu ihr
  rationale: εἰς kann »zu« oder »in … hinein« bedeuten. »Zu ihr« wahrt die Bewegungsrichtung, ohne die Vorstellung des Eingehens in die Erde festzulegen.
- source_word: ἡ ἀποστροφὴ αὐτῶν
  choice: kehren sie zurück
  rationale: Die nominale griechische Form »ist ihre Rückkehr« wird im Deutschen natürlich verbal wiedergegeben.
theological_decisions:
- issue: Bezug der femininen Pronomen αὐτῆς und αὐτὴν
  choice: Die Pronomen werden feminin als »ihre« und »zu ihr« wiedergegeben und auf die im Kontext vorausgesetzte Erde bezogen.
  alternative: Explizit »die Oberfläche der Erde … zur Erde« oder neutral »ihre Oberfläche … zu ihr« ohne Festlegung des Bezugs.
  rationale: Der griechische Satz nennt die Erde hier nicht ausdrücklich, setzt sie aber aus dem Schöpfungszusammenhang als Bezug voraus. Die feminine Form bewahrt die Anapher, während eine Fußnote den Bezug erläutert.
- issue: Richtung von εἰς αὐτὴν
  choice: »zu ihr«
  alternative: »in sie hinein«
  rationale: Beides ist sprachlich möglich. »Zu ihr« bewahrt die Aussage von der Rückkehr zur Erde, ohne eine ausschließlich auf Bestattung oder körperliches Eingehen zugespitzte Lesart einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der erste Teilsatz bleibt nahe an der griechischen Wortfügung; der zweite wird für natürliches Deutsch verbal formuliert. Die feminine Bezugnahme auf die Erde und die mögliche Richtungsnuance von εἰς werden nicht eingeebnet.
