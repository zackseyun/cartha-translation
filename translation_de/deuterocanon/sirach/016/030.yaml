  terminology: „Leben“ vermeidet für ψυχή eine hier nicht erforderliche Verengung auf eine körperunabhängige „Seele“. „Lebewesen“ hält den Umfang von ζῷον offen. „Oberfläche“ ist für πρόσωπον in Bezug auf die vorausgesetzte Erde eine angemessene idiomatische Wiedergabe. Die Fußnote erläutert sowohl den femininen Bezug als auch die mögliche Nuance von εἰς, ohne sie dogmatisch festzulegen.
