  source_fidelity: 'Der Entwurf gibt die griechische Satzstruktur und die zentralen Begriffe sachgerecht wieder: τὸ πρόσωπον αὐτῆς ist Subjekt von ἐκάλυψεν, ψυχὴν παντὸς ζῴου wird treffend als „das Leben jedes Lebewesens“ wiedergegeben, und die Rückkehrformel wahrt die Richtung von εἰς αὐτήν. Die anaphorische, im Vers selbst nicht ausdrücklich benannte Erde wird nicht unzulässig expliziert.'
