  text: I will declare my spirit with measure[c][b][a], and with care I will make my knowledge known.
translation:
  language: de
  text: Wohlabgewogen[b] will ich meinen Geist kundtun[a] und umsichtig[c] mein Wissen darlegen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: „meinen Geist“; der griechische Paralleltext hat „Unterweisung“. Gemeint sein kann das, was aus dem Inneren des Sprechers hervorgeht.'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlich: „mit Gewicht“ oder „nach Maß“; das Bild bezeichnet sorgfältig abgewogene Rede.'
    reason: lexical_alternative
  - marker: c
    text: Das hebräische Wort kann auch „zurückhaltend“, „bescheiden“ oder „mit Bedacht“ bedeuten; der griechische Paralleltext betont Genauigkeit.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַבִּיעָה
  choice: will ich … kundtun
  rationale: Das Verb bezeichnet das Hervorströmen oder Hervorbringen von Worten und kann hier mit „kundtun“ natürlich wiedergegeben werden; zugleich entspricht dies dem griechischen ἐκφανῶ („offenbaren, sichtbar machen“).
- source_word: בְמִשְׁקָל
  choice: wohlabgewogen
  rationale: Wörtlich steht „mit Gewicht/Maß“. „Wohlabgewogen“ bewahrt das Bild sorgfältig gewogener Rede und klingt im Deutschen idiomatisch.
- source_word: רוּחִי
  choice: meinen Geist
  rationale: Die Wiedergabe folgt unmittelbar dem hebräischen Text und lässt offen, ob der innere Geist, die Gesinnung oder die daraus hervorgehende Rede gemeint ist. Die abweichende griechische Lesart wird in einer Fußnote dokumentiert.
- source_word: וּבְהַצְנֵעַ
  choice: umsichtig
  rationale: Die Wendung kann Zurückhaltung, Bescheidenheit oder sorgfältiges Vorgehen bezeichnen. „Umsichtig“ verbindet diskrete Zurückhaltung mit der vom griechischen Paralleltext betonten Genauigkeit.
- source_word: אֲחַוֶּה
  choice: darlegen
  rationale: Das Verb bedeutet „zeigen, mitteilen, verkünden“. In Verbindung mit „mein Wissen“ ist „darlegen“ eine natürliche und präzise deutsche Entsprechung.
- source_word: דֵעִי
  choice: mein Wissen
  rationale: Dies entspricht unmittelbar dem hebräischen Substantiv und stimmt auch mit griechisch ἐπιστήμην überein.
theological_decisions:
- issue: Hebräisch „mein Geist“ gegenüber griechisch „Unterweisung“
  choice: Im Haupttext steht „meinen Geist“; die griechische Abweichung erscheint in der Fußnote.
  alternative: „meine Unterweisung“ oder eine verschmelzende Formulierung wie „die Unterweisung meines Geistes“
  rationale: Der hoch bewertete hebräische Ausgangstext soll nicht durch die griechische Lesart erweitert werden. Die Fußnote bewahrt die wichtige Textvariante, ohne beide Lesarten künstlich zu harmonisieren.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die vorangestellte Form „Wohlabgewogen“ erhält das hebräische Bild, ohne schwerfällig zu wirken. „Meinen Geist kundtun“ ist bewusst etwas gehoben, da es die ungewöhnliche, mehrdeutige hebräische Formulierung bewahrt.
