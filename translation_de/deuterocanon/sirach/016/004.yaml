  text: From one God-fearing childless man a city will be inhabited, but from a family of traitors it will be laid waste.
translation:
  language: de
  text: Von einem kinderlosen Mann, der den HERRN fürchtet, wird eine Stadt bewohnt werden[a]; von einer Familie von Treulosen aber wird sie verwüstet werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Griechisch: „Von einem verständigen Mann wird eine Stadt bewohnt werden.“ Im Hebräischen steht: „Von einem kinderlosen Mann, der den HERRN fürchtet“.'
    reason: alternative_reading
lexical_decisions:
- source_word: מֵאֶחַד
  choice: Von einem einzigen
  rationale: מִן mit אֶחָד bezeichnet hier den Ausgangspunkt; „von einem einzigen“ gibt zugleich den betonten Gegensatz zwischen dem Einzelnen und einer ganzen Familie wieder.
- source_word: עֲרִירִי
  choice: kinderlosen Mann
  rationale: עֲרִירִי bezeichnet gewöhnlich einen Menschen ohne Kinder beziehungsweise Nachkommen. Diese konkrete Lesart des erhaltenen hebräischen Textes bestimmt den Haupttext.
- source_word: יְרֵא יְהֹוָה
  choice: der den HERRN fürchtet
  rationale: Die Relativkonstruktion ist im Deutschen natürlich und bildet sowohl das Verb der Gottesfurcht als auch den im Hebräischen ausdrücklich genannten Gottesnamen ab.
- source_word: יְהֹוָה
  choice: der HERR
  rationale: Der Gottesname wird nach der üblichen deutschsprachigen Bibelkonvention mit „der HERR“ wiedergegeben, statt ihn zu einem allgemeinen „Gott“ abzuschwächen.
- source_word: תֵּשֵׁב עִיר
  choice: wird eine Stadt bevölkert werden
  rationale: Die Form von ישב beschreibt hier, dass eine Stadt bewohnt beziehungsweise besiedelt wird. „Bevölkert werden“ bewahrt den resultativen Sinn und passt zum Gedanken, dass aus einem Einzelnen viele hervorgehen.
- source_word: מִמִּשְׁפַּחַת
  choice: durch eine Familie
  rationale: מִן kann in diesem parallelen, kausativen Zusammenhang die Ursache beziehungsweise den Ausgangspunkt bezeichnen. „Familie“ ist die verständlichste Wiedergabe von מִשְׁפָּחָה.
- source_word: בֹּגְדִים
  choice: Treulosen
  rationale: בֹּגְדִים bezeichnet Menschen, die treulos oder verräterisch handeln. „Treulose“ erhält die moralische und relationale Bedeutung, ohne auf politischen Verrat verengt zu sein.
- source_word: תֶּחֱרָב
  choice: wird sie verwüstet werden
  rationale: חרב bezeichnet das Veröden oder Verwüstetwerden; das Passiv erhält den resultativen Charakter und entspricht auch dem griechischen ἐρημωθήσεται.
theological_decisions:
- issue: Hebräisch עֲרִירִי („kinderlos“) gegenüber griechisch συνετοῦ („verständig/klug“)
  choice: Im Haupttext steht „kinderlosen Mann“ nach dem erhaltenen hebräischen Zeugnis.
  alternative: 'Nach dem Griechischen: „Von einem einzigen verständigen Mann wird eine Stadt bevölkert werden.“'
  rationale: Wo ein zuverlässiger hebräischer Sirach-Text erhalten ist, bildet er die Grundlage. Die deutlich abweichende griechische Lesart wird jedoch als wichtiger Textunterschied in der Fußnote bewahrt.
- issue: Wiedergabe des Gottesnamens in יְרֵא יְהֹוָה
  choice: „der den HERRN fürchtet“
  alternative: „gottesfürchtig“
  rationale: Die gewählte Form macht den ausdrücklich genannten Gottesnamen sichtbar und vermeidet, die Aussage in eine bloß allgemeine Religiosität umzudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur wahrt den pointierten Gegensatz zwischen einem Einzelnen und einer treulosen Familie. „Treulose“ ist gegenüber „Verräter“ semantisch breiter und im weisheitlichen Kontext natürlicher.
