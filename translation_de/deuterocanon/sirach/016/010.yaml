  source_fidelity: 'Der Haupttext gibt den hebräischen Text insgesamt treffend wieder: כֵּן wird angemessen anschließenden mit „So auch“/„Ebenso“ wiedergegeben, die Zahl und רַגְלִי mit „Fußsoldaten“, das passive Partizip הַנֶּאֱסָפִים mit „die … versammelt waren“ sowie בִּזְדוֹן לִבָּם mit „in der Vermessenheit ihres Herzens“. Die griechische Parallele hat jedoch genauer „in ihrer Hartherzigkeit“ (ἐν σκληροκαρδίᾳ αὐτῶν), nicht „in der Verhärtung ihres Herzens“; letztere Formulierung kann zudem unnötig einen Vorgang statt der bezeichneten Haltung nahelegen.'
  naturalness: „So auch“ ist als knapper Anschluss in diesem würdevollen, schriftsprachlichen Versfragment idiomatischer als das etwas isoliert wirkende „Ebenso“. Der Relativsatz bleibt natürlich und erhält die elliptische Struktur des Ausgangstexts.
  terminology: „Vermessenheit“ ist für זָדוֹן präzise und angemessen. „Fußsoldaten“ ist durch die hebräische und griechische Formulierung gedeckt. „Hartherzigkeit“ trifft σκληροκαρδία idiomatisch und genauer als „Verhärtung ihres Herzens“.
  issues:
