translation:
  language: de
  text: So auch sechshunderttausend Fußsoldaten[a], die in der Vermessenheit[b][c] ihres Herzens versammelt waren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die „sechshunderttausend Fußsoldaten“ spielen wahrscheinlich auf Israels Wüstengeneration an; vergleiche 2. Mose 12,37 und 4. Mose 11,21.
    reason: cross_reference
