    reason: textual_variant
lexical_decisions:
- source_word: כֵּן
  choice: Ebenso
  rationale: Leitet parallel zum vorangehenden Zusammenhang ein weiteres Beispiel des Gerichts ein und bewahrt die knappe Anschlussform des Hebräischen.
- source_word: שֵׁשׁ מֵאוֹת אֶלֶף
  choice: sechshunderttausend
  rationale: Gibt die ausdrücklich genannte Zahl direkt und in literarisch natürlicher Schreibweise wieder.
- source_word: רַגְלִי
  choice: Fußsoldaten
  rationale: Bezeichnet Männer zu Fuß; das griechische πεζῶν bestätigt hier den militärischen Sinn. „Fußsoldaten“ ist konkret und allgemein verständlich.
- source_word: הַנֶּאֱסָפִים
  choice: die … versammelt waren
  rationale: Bewahrt die passive Bedeutung des Partizips von אסף, ohne eine im Text nicht ausgesagte handelnde Person einzuführen.
- source_word: בִּזְדוֹן
  choice: in der Vermessenheit
  rationale: זדון bezeichnet anmaßenden, trotzigen Hochmut. „Vermessenheit“ gibt diese moralische Zuspitzung präziser wieder als das breitere „Stolz“.
- source_word: לִבָּם
  choice: ihres Herzens
  rationale: Bewahrt den kollektiven Singular „Herz“ mit pluralischem Bezug, der auch im Deutschen verständlich ist.
theological_decisions:
- issue: Identität der sechshunderttausend
  choice: Die Gruppe wird im Haupttext nicht ausdrücklich als Israel oder als Wüstengeneration bezeichnet.
  alternative: Die sechshunderttausend unmittelbar als die aus Ägypten ausgezogene Wüstengeneration identifizieren.
  rationale: Die Zahl legt diese Anspielung nahe, doch der hebräische Vers nennt die Gruppe nicht ausdrücklich. Die wahrscheinliche Identifikation wird daher nur in einer Fußnote erläutert.
- issue: Abweichung zwischen hebräischem und griechischem Text
  choice: Der hebräischen Lesart „Vermessenheit“ wird im Haupttext gefolgt; die griechische Lesart wird in einer Fußnote dokumentiert.
  alternative: Nach dem Griechischen „Verhärtung ihres Herzens“ übersetzen.
  rationale: Die bereitgestellte hebräische Quelle hat hohe Vertrauenswürdigkeit und ist die primäre Grundlage. Die abweichende griechische Überlieferung ist dennoch inhaltlich bedeutsam und darf nicht stillschweigend eingeebnet werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe, elliptische Form des Ausgangstextes bleibt erhalten; der kollektive Singular „ihres Herzens“ und die passive Aussage „versammelt waren“ werden nicht geglättet.
