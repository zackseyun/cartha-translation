  - severity: low
    issue: Der Anker für die griechische abweichende Lesart steht am Satzende.
    rationale: Da die Abweichung unmittelbar die Wiedergabe von בִּזְדוֹן betrifft, sollte der Anker bei „Vermessenheit“ stehen, damit der Bezug eindeutig ist.
