  text: An unjust one will not escape with plunder[a], and the desire of the righteous will never fail.
translation:
  language: de
  text: Ein Unrechtstäter entkommt nicht mit Raubgut, und das Verlangen eines Gerechten wird niemals vereitelt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher lautet der zweite Halbvers im Hebräischen: „und er wird das Verlangen eines Gerechten niemals zum Stillstand bringen“; das Subjekt ist nicht ausdrücklich genannt. Der griechische Text liest dagegen: „und er wird die Ausdauer eines Gottesfürchtigen gewiss nicht verzögern.“'
    reason: alternative_reading
lexical_decisions:
- source_word: לֹא יִמָּלֵט
  choice: entkommt nicht
  rationale: Das Nifal von מלט bezeichnet hier das Entkommen oder Sichretten; die griechische Parallele ἐκφεύξεται bestätigt diesen Sinn.
- source_word: בְּגָזֵל
  choice: mit Raubgut
  rationale: גזל bezeichnet Geraubtes beziehungsweise Raubgut. Die Präposition ב kann den begleitenden Umstand oder das Mittel ausdrücken; „mit Raubgut“ bewahrt diese Offenheit.
- source_word: עַוָּל
  choice: ein Unrechtstäter
  rationale: Das Wort bezeichnet einen Menschen, der verkehrt oder ungerecht handelt. „Unrechtstäter“ gibt den hebräischen moralischen Begriff genauer wieder als das allgemeinere „Sünder“ und bildet den Gegensatz zum Gerechten ab.
- source_word: וְלֹא יַשְׁבִּית
  choice: wird niemals vereitelt
  rationale: Das Hifil von שבת bedeutet wörtlich „aufhören lassen, zum Stillstand bringen“. In Verbindung mit „Verlangen“ gibt „vereitelt werden“ die Aussage idiomatisch wieder, ohne eine konkrete Art der Erfüllung festzulegen.
- source_word: תַּאֲוַת צַדִּיק
  choice: das Verlangen eines Gerechten
  rationale: תאוה bedeutet Verlangen oder Begehren; im positiven Zusammenhang ist „Verlangen“ angemessen. Der singularische צדיק bleibt als generische Einzelfigur erhalten.
- source_word: לְעוֹלָם
  choice: niemals
  rationale: Mit der Verneinung hat לְעוֹלָם hier die adverbiale Bedeutung „niemals“ beziehungsweise „nicht für immer“; „niemals“ entspricht der traditionellen syntaktischen Auffassung des Verses.
theological_decisions:
- issue: Moralische Bezeichnung עַוָּל gegenüber griechisch ἁμαρτωλός
  choice: ein Unrechtstäter
  alternative: ein Sünder
  rationale: Der Haupttext folgt dem präziseren hebräischen Ausdruck, ohne die Person auf einen technischen theologischen Begriff festzulegen. Die griechische Parallele verallgemeinert zu „Sünder“.
- issue: Aussage des zweiten Halbverses
  choice: das Verlangen eines Gerechten wird niemals vereitelt
  alternative: die Ausdauer des Gottesfürchtigen wird gewiss nicht hinausgezögert werden
  rationale: Der hebräische Text spricht von תַּאֲוַת צַדִּיק, dem Verlangen eines Gerechten, während der griechische Text ὑπομονὴν εὐσεβοῦς, die Ausdauer eines Gottesfürchtigen, bietet. Der Haupttext folgt dem hebräischen Zeugen; die deutlich abweichende griechische Lesart bleibt in der Fußnote sichtbar.
- issue: Aktive Form von יַשְׁבִּית und unausgesprochenes Subjekt
  choice: idiomatische Passivform „wird … vereitelt“
  alternative: „er wird das Verlangen eines Gerechten niemals zum Stillstand bringen“
  rationale: Im isolierten hebräischen Vers ist das Subjekt des aktiven Verbs nicht ausdrücklich genannt. Die deutsche Passivform vermeidet, Gott oder den Unrechtstäter stillschweigend als Subjekt einzusetzen, und bewahrt den Aussagekern.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Unrechtstäter“ ist allgemein verständlich und näher am hebräischen עַוָּל als „Sünder“. Die Passivform im zweiten Halbvers erhält die Unbestimmtheit des unausgesprochenen Subjekts; die Fußnote dokumentiert sowohl die wörtlichere hebräische Syntax als auch die bedeutende griechische Abweichung.
