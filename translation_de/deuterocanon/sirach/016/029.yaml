translation:
  language: de
  text: Und danach blickte der Herr auf die Erde und erfüllte sie mit seinen guten Gaben.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετὰ ταῦτα
  choice: danach
  rationale: Die Wendung bezeichnet eine zeitliche Abfolge. „Danach“ ist im modernen Deutsch natürlich und gibt den Sinn knapp und genau wieder.
- source_word: Κύριος
  choice: der Herr
  rationale: Κύριος steht hier als Gottesbezeichnung; „der Herr“ ist die geläufige und würdige deutsche Wiedergabe.
- source_word: εἰς τὴν γῆν ἐπέβλεψεν
  choice: blickte … auf die Erde
  rationale: ἐπιβλέπω bezeichnet hier das Hinblicken auf etwas. Die Formulierung bleibt nahe am griechischen Bild und klingt zugleich natürlich.
- source_word: ἐνέπλησεν
  choice: erfüllte
  rationale: Das Verb bedeutet, etwas vollzumachen oder zu füllen. „Erfüllte“ verbindet sich im Deutschen idiomatisch mit „mit“ und wahrt den gehobenen Ton.
- source_word: τῶν ἀγαθῶν αὐτοῦ
  choice: mit seinen guten Gaben
  rationale: Das substantivierte ἀγαθά bezeichnet die guten Dinge oder Wohltaten, die von Gott kommen. „Gute Gaben“ ist verständlich und natürlich, ohne die Aussage auf rein materielle Güter oder ausdrücklich auf Segnungen zu verengen.
theological_decisions:
- issue: Wiedergabe der Gottesbezeichnung Κύριος
  choice: der Herr
  alternative: Herr
  rationale: Der bestimmte Artikel entspricht dem üblichen deutschen Gebrauch, wenn „Herr“ als Gottesbezeichnung im Satz steht.
- issue: Bedeutungsumfang von τὰ ἀγαθά
  choice: gute Gaben
  alternative: gute Dinge; Wohltaten; Segnungen
  rationale: „Gute Gaben“ lässt sowohl geschaffene Güter als auch göttliche Wohltaten zu und vermeidet eine konfessionell oder dogmatisch engere Auslegung.
translation_notes:
  register: Modernes Standarddeutsch in einem schlichten, würdigen Erzählton. Die Satzstruktur folgt dem Griechischen, ohne im Deutschen schwerfällig zu wirken.
