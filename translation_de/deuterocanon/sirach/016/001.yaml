  text: Do not desire the appearance of worthless youths[a], and do not rejoice in sons of unrighteousness.
translation:
  language: de
  text: Begehre nicht das Aussehen nichtiger junger Männer[a], und freue dich nicht über Söhne des Unrechts.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Griechisch: „Begehre nicht eine Menge unnützer Kinder, und freue dich nicht über gottlose Söhne.“ Der hebräische Text spricht dagegen vom Aussehen nichtiger junger Männer.'
    reason: textual_variant
lexical_decisions:
- source_word: אַל תִּתְאַוֶּה
  choice: Begehre nicht
  rationale: Der Hitpael/Imperfekt mit אַל formuliert ein Verbot. „Begehren“ gibt den willentlichen Sinn knapp und in einem würdigen Weisheitsstil wieder.
- source_word: תֹּאַר
  choice: die Gestalt
  rationale: תֹּאַר bezeichnet die äußere Gestalt beziehungsweise Erscheinung und kann Schönheit einschließen, ohne sie hier ausdrücklich zu nennen. „Gestalt“ bewahrt diesen Spielraum.
- source_word: נַעֲרֵי שָׁוְא
  choice: nichtiger junger Männer
  rationale: נַעֲרֵי bezeichnet Jugendliche beziehungsweise junge Männer; שָׁוְא kann Nichtigkeit, Leere oder Wertlosigkeit ausdrücken. „Nichtig“ bewahrt die weisheitliche und moralische Färbung, ohne den Ausdruck auf bloße Nutzlosigkeit zu verengen.
- source_word: וְאַל תִּשְׂמַח
  choice: und freue dich nicht
  rationale: Die Wendung bildet ein paralleles Verbot und gibt die emotionale Bedeutung von שׂמח in natürlichem Deutsch wieder.
- source_word: בִּבְנֵי עַוְלָה
  choice: über Söhne der Ungerechtigkeit
  rationale: Die Formulierung erhält das hebräische Idiom „Söhne der Ungerechtigkeit“. Bei „sich freuen“ ist „über“ im Deutschen die natürliche Rektion.
- source_word: Μὴ ἐπιθύμει τέκνων πλῆθος ἀχρήστων
  choice: nicht in den Haupttext übernommen
  rationale: Die griechische Parallelüberlieferung spricht von einer Menge unnützer Kinder und weicht damit deutlich vom erhaltenen Hebräisch ab. Da hier ein hebräischer Textzeuge vorliegt, bestimmt dieser den Haupttext; die griechische Lesart wird in der Fußnote dokumentiert.
theological_decisions:
- issue: Textgrundlage bei Abweichung zwischen hebräischer und griechischer Überlieferung
  choice: Der erhaltenen hebräischen Lesart im Haupttext folgen und die griechische Alternative in einer Fußnote bewahren
  alternative: 'Der griechischen Lesart folgen: „Begehre nicht eine Menge unnützer Kinder, und freue dich nicht über gottlose Söhne.“'
  rationale: Wo der hebräische Sirachtext erhalten ist, besitzt er für diese Übersetzung Vorrang. Die erhebliche Abweichung der griechischen Überlieferung wird jedoch nicht stillschweigend beseitigt, sondern als echte Textvariante kenntlich gemacht.
translation_notes:
  register: Moderner, würdiger Weisheitsstil. „Gestalt“ wahrt die mögliche Bedeutung äußerer Attraktivität, ohne das im Hebräischen nicht ausdrücklich vorhandene Adjektiv „schön“ einzufügen. „Nichtig“ ist bewusst etwas gehoben, aber im Kontext verständlich und semantisch näher an שָׁוְא als eine rein pragmatische Wiedergabe mit „nutzlos“.
