  source_fidelity: Der Haupttext folgt zutreffend dem erhaltenen hebräischen Zeugen und bewahrt den deutlichen Unterschied zur griechischen Parallelüberlieferung in einer Fußnote. תֹּאַר bezeichnet konkret die äußere Erscheinung; „Gestalt“ ist möglich, im heutigen Deutsch jedoch weniger präzise. „Söhne des Unrechts“ gibt בְּנֵי עַוְלָה idiomatischer wieder als „Söhne der Ungerechtigkeit“, ohne den hebräischen Bildausdruck aufzulösen.
  naturalness: „Die Gestalt nichtiger junger Männer“ wirkt im modernen Standarddeutsch merklich steif und lässt offen, ob körperliche Form oder Erscheinung gemeint ist. „Das Aussehen nichtiger junger Männer“ ist klarer und natürlich, wahrt aber den Fokus auf das Äußere.
  terminology: „Begehre nicht“ und „freue dich nicht über“ passen zum würdigen Weisheitsregister. „Nichtiger“ ist als Wiedergabe von שָׁוְא vertretbar und bewahrt dessen weisheitlich-moralische Wertung, ohne die griechische Lesart „unnütz“ in den hebräischen Haupttext einzutragen. Die Fußnote gibt die griechische Variante sachgerecht wieder.
