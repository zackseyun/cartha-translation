translation:
  language: de
  text: Jeder, der Gerechtigkeit übt, hat Lohn.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der erhaltene hebräische Text lautet: „Jeder, der Gerechtigkeit tut, hat Lohn.“ Der griechische Paralleltext ist länger und weicht ab: Er spricht von „jedem Almosen“ beziehungsweise einer barmherzigen Tat, davon, „Raum/Platz zu schaffen“, und davon, dass jeder entsprechend seinen Werken finden wird.'
    reason: textual_variant
  - marker: b
    text: Das griechische ἐλεημοσύνη kann „Almosen“ oder allgemeiner „barmherzige Tat“ bedeuten; der hebräische Text hat צְדָקָה, „Gerechtigkeit“ beziehungsweise „rechtschaffenes Handeln“.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הָעֹשֶׁה
  choice: Wer … übt
  rationale: Die substantivierte Partizipialkonstruktion bezeichnet distributiv jeden Menschen, der entsprechend handelt. Die deutsche Wer-Konstruktion gibt dies natürlich und eng am Hebräischen wieder.
- source_word: צְדָקָה
  choice: Gerechtigkeit
  rationale: Der hebräische Hauptzeuge hat צְדָקָה, hier im Sinn gerechten beziehungsweise rechtschaffenen Handelns. Die abweichende griechische Wiedergabe wird in einer Fußnote dokumentiert.
- source_word: יֵשׁ לוֹ
  choice: hat
  rationale: Die hebräische Besitzkonstruktion bedeutet wörtlich und idiomatisch, dass dem Handelnden Lohn zukommt.
- source_word: שָׂכָר
  choice: Lohn
  rationale: שָׂכָר kann Lohn, Vergeltung oder Belohnung bezeichnen. „Lohn“ bewahrt die knappe Ausdrucksweise und lässt die Art der Vergeltung offen.
theological_decisions:
- issue: Hebräisches „Gerechtigkeit“ gegenüber griechischem „Almosen/Erbarmenstat“
  choice: Im Haupttext steht „Gerechtigkeit“.
  alternative: Almosen; barmherzige Tat
  rationale: Der hoch bewertete hebräische Text ist die primäre Grundlage. Die griechische Lesart bleibt als bedeutsame lexikalische und textliche Variante in den Fußnoten sichtbar.
- issue: Ob der nur im griechischen Paralleltext belegte zweite Satzteil in den Haupttext aufgenommen wird
  choice: Der Haupttext folgt der kürzeren hebräischen Fassung.
  alternative: „…; jeder wird entsprechend seinen Werken finden.“
  rationale: Der vorgelegte hebräische Wortlaut ist vollständig verständlich und von hoher Zuverlässigkeit. Der zusätzliche griechische Satzteil darf nicht unmarkiert in den hebräisch gegründeten Haupttext eingetragen werden; er wird transparent in einer textkritischen Fußnote wiedergegeben.
translation_notes:
  register: Modernes, knappes und würdevolles Standarddeutsch. „Gerechtigkeit üben“ ist verständlicher und idiomatischer als „Gerechtigkeit tun“, bleibt aber nahe an der hebräischen Handlungsaussage. Die Fußnotenmarker stehen vollständig im Haupttext.
