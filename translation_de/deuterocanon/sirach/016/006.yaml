translation:
  language: de
  text: In der Versammlung der Frevler lodert Feuer, und unter einem gottlosen Volk ist Zorn entbrannt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Griechisch: „und unter einem ungehorsamen Volk entbrannte Zorn.“ Der hebräische Text hat „gottloses Volk“.'
    reason: alternative_reading
lexical_decisions:
- source_word: בַּעֲדַת רְשָׁעִים
  choice: In der Versammlung der Frevler
  rationale: עֵדָה bezeichnet eine versammelte Gemeinschaft; ב ist hier am natürlichsten lokal zu verstehen. רְשָׁעִים meint moralisch Schuldige oder Frevler. „Frevler“ gibt die hebräische Wertung prägnant und in würdigem Gegenwartsdeutsch wieder.
- source_word: יוֹקֶדֶת אֵשׁ
  choice: lodert Feuer
  rationale: יקד bezeichnet brennendes oder loderndes Feuer. Die deutsche Formulierung wahrt das aktive Bild und die knappe poetische Parallelstruktur.
- source_word: וּבְגוֹי חָנֵף
  choice: und unter einem gottlosen Volk
  rationale: גּוֹי kann „Volk“ oder „Nation“ bedeuten; „Volk“ klingt hier natürlicher. חָנֵף bezeichnet in diesem Zusammenhang ein gottloses oder frevelhaftes Wesen. Das griechische ἀπειθεῖ bietet dagegen „ungehorsam“.
- source_word: נִצְּתָה חֵמָה
  choice: ist Zorn entbrannt
  rationale: נצת bezeichnet das Entzünden oder Entbrennen, חֵמָה heftigen Zorn. Das Perfekt wird als abgeschlossene bzw. eingetretene Handlung wiedergegeben und unterscheidet sich so vom ersten Halbvers.
theological_decisions:
- issue: Wiedergabe von חָנֵף gegenüber dem griechischen ἀπειθεῖ
  choice: gottlos
  alternative: ungehorsam
  rationale: Der erhaltene hebräische Text ist die primäre Grundlage und bezeichnet das Volk als gottlos bzw. frevelhaft. Die griechische Überlieferung hat eine verwandte, aber eigenständige Charakterisierung als ungehorsam; diese wird in der Fußnote bewahrt.
- issue: Zeitform von נִצְּתָה gegenüber der griechischen Parallele
  choice: ist ... entbrannt
  alternative: entbrennt
  rationale: Die hebräische Form und das griechische ἐξεκαύθη stützen eine vergangene bzw. vollendete Aussage. Die Spannung zum präsentischen ersten Halbvers bleibt erhalten.
translation_notes:
  register: Knappe, poetisch-parallele Satzform in modernem, würdigem Standarddeutsch. „Frevler“ und „Zorn“ erhalten die deutliche moralische und gerichtliche Sprache, ohne den Urheber des Zorns ausdrücklich zu ergänzen.
