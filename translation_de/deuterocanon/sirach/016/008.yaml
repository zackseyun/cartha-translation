  naturalness: „Die Gemeinschaft …; sie überhob sich“ ist grammatisch möglich, klingt jedoch wegen des kollektiven Singulars und des anschließenden Singularverbs weniger unmittelbar als eine personenbezogene Pluralform. Die Relativsatzkonstruktion ist im Deutschen flüssiger und bildet das hebräische Partizip besser ab.
