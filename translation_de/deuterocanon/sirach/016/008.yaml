translation:
  language: de
  text: Und er verschonte die Menschen, unter denen Lot als Fremder lebte, nicht[a], die sich in ihrem Hochmut überhoben.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Möglich auch: „Lots Aufenthaltsgemeinschaft“, „Lots Nachbarn“ oder „die Bewohner von Lots Aufenthaltsort“. Der hebräische Ausdruck ist ungewöhnlich und bezieht sich auf die Gemeinschaft, in der Lot als Fremder lebte.'
    reason: lexical_alternative
  - marker: b
    text: 'Die hebräische Form ist schwierig. Möglich ist auch: „die sich durch ihren Hochmut verabscheuungswürdig machten“. Die griechische Überlieferung lautet sinngemäß: „die er wegen ihres Hochmuts verabscheute“.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְלֹא חָמַל
  choice: Und er verschonte … nicht
  rationale: חמל kann Mitleid oder Schonung bezeichnen. Im Gerichtszusammenhang gibt „verschonte … nicht“ den Sinn knapp und idiomatisch wieder; das griechische οὐκ ἐφείσατο bestätigt diese Bedeutung.
- source_word: מְגוּרֵי לוֹט
  choice: die Gemeinschaft, bei der Lot als Fremder lebte
  rationale: מגורי ist von גור, „als Fremder wohnen/sich aufhalten“, abgeleitet. Die Formulierung gibt den Bezug auf Lots Aufenthaltsgemeinschaft wieder, ohne sie ausdrücklich mit Sodom gleichzusetzen. Auch das griechische παροικία bezeichnet einen Aufenthalt in der Fremde oder die damit verbundene Gemeinschaft.
- source_word: הַמִּתְעַבְּרִים
  choice: sie überhob sich
  rationale: Die schwierige hebräische Form bezeichnet hier wahrscheinlich ein hochmütiges, anmaßendes Verhalten. „Sich überheben“ bewahrt diese Nuance und passt zur folgenden Angabe „in ihrem Hochmut“, ohne die abweichende griechische Deutung stillschweigend zum Haupttext zu machen.
- source_word: בְּגַאֲוָתָם
  choice: in ihrem Hochmut
  rationale: Die Wiedergabe erhält die hebräische Präposition und beschreibt den Hochmut als Sphäre beziehungsweise Beweggrund ihres Verhaltens. Das griechische διὰ τὴν ὑπερηφανίαν αὐτῶν legt auch die kausale Nuance „wegen ihres Hochmuts“ nahe.
theological_decisions:
- issue: Bezug von מְגוּרֵי לוֹט
  choice: Die Gemeinschaft des Ortes, an dem Lot als Fremder lebte
  alternative: Lots Nachbarn; Lots Wohnort; die Bewohner Sodoms
  rationale: Der Zusammenhang verweist auf die Menschen von Sodom, doch der hebräische Ausdruck nennt Sodom nicht ausdrücklich. Die Übersetzung bewahrt daher die indirekte Bezeichnung und schließt Lots Haushalt nicht fälschlich als Ziel des Gerichts ein.
- issue: Deutung von הַמִּתְעַבְּרִים
  choice: hochmütiges Sich-Überheben
  alternative: sie machten sich verabscheuungswürdig; er verabscheute sie wegen ihres Hochmuts
  rationale: Die hebräische Form ist schwierig und erlaubt keine völlig sichere Festlegung. Der Haupttext folgt der wahrscheinlichsten hebräischen Sinnrichtung; die vom Griechischen gestützte Deutung wird in einer Fußnote offengehalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Umschreibung „bei der Lot als Fremder lebte“ macht den sozialen Sinn von גור allgemein verständlich. „Sich überheben“ ist leicht gehoben, aber geläufig und passt zur weisheitlichen Gerichtssprache; die echte textliche Unsicherheit wird durch Fußnoten offengehalten.
