  text: Those lacking sense will understand these things[a], and a foolish man will consider this.
translation:
  language: de
  text: Menschen, denen es an Verstand fehlt, werden diese Dinge verstehen, und ein törichter Mann wird dies bedenken.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im zweiten Satzglied steht im Hebräischen »dies«; die griechische Parallele hat dagegen »törichte Dinge«. Der Haupttext folgt dem hebräischen Text. Für die Bedeutung von »töricht« wurde auch die griechische Parallele berücksichtigt, die einen törichten und irregehenden Menschen beschreibt.
    reason: alternative_reading
lexical_decisions:
- source_word: חַסְרֵי לֵב
  choice: Menschen, denen es an Verstand fehlt
  rationale: Wörtlich »die am Herzen Mangel haben«; לֵב bezeichnet hier idiomatisch Einsicht und Urteilsvermögen, nicht das Gefühlsleben. Die Umschreibung gibt den Sinn natürlich wieder.
- source_word: יָבִינוּ
  choice: werden verstehen
  rationale: Das Verb bezeichnet Verstehen oder Einsicht; die direkte Wiedergabe bewahrt auch die auffällige Spannung, dass gerade Menschen ohne Verstand verstehen werden.
- source_word: אֵלֶּה
  choice: diese Dinge
  rationale: Das hebräische Demonstrativpronomen steht im Plural. »Diese Dinge« macht den sachlichen Bezug im Deutschen deutlich.
- source_word: גֶבֶר
  choice: Mann
  rationale: Das Substantiv bezeichnet hier in der für Weisheitstexte typischen Einzelfigur einen Mann; die grammatisch und semantisch konkrete Form bleibt erhalten.
- source_word: פּוֹתֶה
  choice: töricht
  rationale: Das Wort kann einen unerfahrenen, einfältigen oder leicht verführbaren Menschen bezeichnen. Die griechische Parallele mit ἄφρων καὶ πλανώμενος bestätigt, dass mehr als bloße Unerfahrenheit gemeint ist.
- source_word: יַחְשֹׁב
  choice: wird bedenken
  rationale: Das Verb bedeutet denken, erwägen oder bedenken. »Bedenken« ist hier knapp, natürlich und lässt die genaue Art des Nachdenkens offen.
- source_word: זֹאת
  choice: dies
  rationale: Das hebräische Demonstrativpronomen steht im Singular. »Dies« bewahrt den Wechsel vom Plural im ersten Satzglied zum Singular im zweiten.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die hebräische Parallelstruktur sowie der auffällige Wechsel von »diese Dinge« zu »dies« bleiben erhalten; die paradoxe Aussage über Menschen ohne Verstand wird nicht geglättet.
