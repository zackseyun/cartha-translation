  text: When God created his works from the beginning[a], he assigned their dominion over their living things.
translation:
  language: de
  text: Als Gott von Anfang an seine Werke schuf, wies er ihnen ihre Ordnung für ihr Leben zu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die zweite Vershälfte ist im Hebräischen schwer verständlich. Der griechische Paralleltext lautet: »Und seit ihrer Erschaffung unterschied er ihre Anteile.« Er bezeugt eine Einteilung oder Zuteilung, klärt aber die genaue Beziehung der hebräischen Wörter für »Leben« und »Ordnung/Herrschaft« nicht eindeutig.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּבְרֹא
  choice: Als … schuf
  rationale: 'Die Präposition כ mit dem Infinitiv von ברא wird hier zeitlich verstanden: »als er schuf«. Das ergibt im Deutschen einen natürlichen temporalen Nebensatz.'
- source_word: אֵל
  choice: Gott
  rationale: אֵל ist hier die schlichte Gottesbezeichnung; eine erweiternde Wiedergabe ist nicht erforderlich.
- source_word: מַעֲשָׂיו
  choice: seine Werke
  rationale: Im Zusammenhang sind die von Gott geschaffenen Dinge gemeint. »Werke« bewahrt den formalen Schöpfungsbezug.
- source_word: מֵרֹאשׁ
  choice: von Anfang an
  rationale: Die Wendung bezeichnet den Ausgangspunkt der Schöpfungsordnung und entspricht auch dem griechischen ἀπ’ ἀρχῆς.
- source_word: עַל חַיֵּיהֶם
  choice: für ihr Dasein
  rationale: Der überlieferte Ausdruck ist schwierig. »Für ihr Dasein« gibt חַיִּים in seinem weiteren Sinn als Leben bzw. Existenz wieder, ohne die unsichere Deutung »über ihre Lebewesen« in den Haupttext einzutragen.
- source_word: חָלָק
  choice: teilte … zu
  rationale: Das Verb bezeichnet Teilen oder Zuteilen. »Zuteilen« passt zur Vorstellung einer von Gott festgelegten Schöpfungsordnung.
- source_word: מִשְׁטָרָם
  choice: ihre Ordnung
  rationale: מִשְׁטָר kann Herrschaft, Verwaltung oder geregelte Ordnung bezeichnen. »Ordnung« ist im Schöpfungskontext verständlich und vermeidet die zu konkrete Vorstellung politischer Herrschaft.
theological_decisions:
- issue: Schöpfungsordnung in einer textlich schwierigen zweiten Vershälfte
  choice: Die hebräische Aussage wird als Zuteilung einer Ordnung für das Dasein der geschaffenen Werke wiedergegeben.
  alternative: '»Er teilte ihnen die Herrschaft über ihre Lebewesen zu« oder nach dem Griechischen: »Und seit ihrer Erschaffung sonderte er ihre Anteile voneinander.«'
  rationale: Der hebräische Text bleibt vorrangig, ist aber in der zweiten Vershälfte unsicher und mehrdeutig. Die gewählte Fassung wahrt die Begriffe Leben/Dasein, Zuteilung und Ordnung, während die Fußnote die deutlich abweichende griechische Überlieferung offenlegt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Formulierung bleibt bewusst etwas offen, weil der hebräische Text der zweiten Vershälfte unsicher ist; die griechische Parallele wird nicht stillschweigend in den Haupttext übernommen.
