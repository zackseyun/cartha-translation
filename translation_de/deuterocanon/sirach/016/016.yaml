  text: His mercies are seen by all his creatures[b][a], and he has apportioned his light and his praise to the sons of man.
translation:
  language: de
  text: Seine Erweise des Erbarmens sind allen seinen Geschöpfen sichtbar[a], und sein Licht und sein Lob hat er den Menschen[b] zugeteilt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Paralleltext lautet hier völlig anders: „Wer wird meiner aus der Höhe gedenken?“ Der Haupttext folgt dem erhaltenen hebräischen Wortlaut.'
    reason: textual_variant
  - marker: b
    text: 'Wörtlich: „den Söhnen des Menschen“; die hebräische Wendung bezeichnet die Menschen beziehungsweise die Menschheit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַחֲמָיו
  choice: seine Erweise des Erbarmens
  rationale: Die pluralische Form bezeichnet hier am natürlichsten konkrete Äußerungen göttlichen Erbarmens. Die Wiedergabe wahrt den hebräischen Plural, ohne im Deutschen unidiomatisch „seine Erbarmungen“ zu sagen.
- source_word: יֵרָאוּ
  choice: sind sichtbar
  rationale: 'Die Form wird im Zusammenhang mit Gottes Licht als passivische Aussage zu ראה verstanden: Seine Erweise des Erbarmens können wahrgenommen werden. Eine Ableitung im Sinn von „werden gefürchtet“ passt weniger gut zum Parallelismus.'
- source_word: לְכָל בִּרְיוֹתָיו
  choice: für alle seine Geschöpfe
  rationale: Die Präposition ל kann hier die Personen bezeichnen, denen etwas sichtbar ist. „Geschöpfe“ bewahrt den Bezug auf erschaffene Wesen.
- source_word: וְאוֹרוֹ
  choice: sein Licht
  rationale: Die Grundbedeutung und das Bild des hebräischen אור bleiben erhalten, ohne es als Offenbarung, Glanz oder Erkenntnis festzulegen.
- source_word: וְשִׁבְחוֹ
  choice: sein Lob
  rationale: שבח bezeichnet Lob beziehungsweise Preis. „Sein Lob“ bewahrt die mögliche Spannung zwischen dem Lob, das Gott zukommt, und dem Lob, das von ihm ausgeht, statt sie durch „Herrlichkeit“ aufzulösen.
- source_word: חָלַק
  choice: hat … zugeteilt
  rationale: חלק bedeutet teilen, verteilen oder einen Anteil zuweisen. „Zuteilen“ ist in diesem gehobenen Zusammenhang natürlich und hält den Verteilungsaspekt fest.
- source_word: לִבְנֵי אָדָם
  choice: den Menschen
  rationale: Wörtlich steht „den Söhnen Adams/des Menschen“, eine geläufige hebräische Bezeichnung für die Menschheit. „Den Menschen“ gibt den gemeinten Gesamtbezug im modernen Deutschen klar und idiomatisch wieder; die wörtliche Bildform wird in der Fußnote genannt.
theological_decisions:
- issue: Anthropologische Wendung בְּנֵי אָדָם
  choice: den Menschen
  alternative: den Söhnen Adams / den Menschensöhnen
  rationale: Die grammatisch maskuline hebräische Wendung bezeichnet idiomatisch Menschen beziehungsweise die Menschheit insgesamt. Die Hauptfassung gibt diesen Sinn verständlich wieder, ohne die Aussage auf männliche Personen zu beschränken.
- issue: Verhältnis von Gottes Licht und Lob zu den Menschen
  choice: sein Licht und sein Lob hat er den Menschen zugeteilt
  alternative: seinen Glanz und seine Herrlichkeit hat er unter den Menschen verbreitet
  rationale: Der hebräische Text sagt, dass Gott Licht und Lob zuteilt, erläutert aber weder deren genaue Bedeutung noch die Art dieser Zuteilung. Die Übersetzung bewahrt diese theologische Offenheit.
- issue: Stark abweichende griechische Überlieferung
  choice: Der Haupttext folgt dem erhaltenen hebräischen Text
  alternative: „Wer wird meiner aus der Höhe gedenken?“
  rationale: Der angegebene griechische Paralleltext bietet für diesen Vers einen völlig anderen Wortlaut. Da ein hoch verlässlicher hebräischer Zeuge vorliegt, bildet dieser die Grundlage des Haupttextes; die griechische Lesart wird transparent in einer Fußnote dokumentiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Erweise des Erbarmens“ bewahrt den hebräischen Plural in natürlicher Form; „sein Licht und sein Lob“ erhält die Bildsprache und die sachliche Mehrdeutigkeit des Ausgangstextes.
