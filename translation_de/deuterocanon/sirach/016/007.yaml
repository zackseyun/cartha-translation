    rationale: Fußnote b behandelt die schwierige Lesung und die daraus gewonnene Wiedergabe von בגבורתם. Der Marker muss bei „Stärke“ stehen, während Marker a bei „Fürsten der Vorzeit“ verbleibt.
  - severity: low
