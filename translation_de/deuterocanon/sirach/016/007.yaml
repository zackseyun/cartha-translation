translation:
  language: de
  text: Er verschonte die Fürsten der Vorzeit[a] nicht, die sich in ihrer Stärke[b] auflehnten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Griechisch: „die Riesen der Vorzeit“; der griechische Text versteht die „Fürsten der Vorzeit“ als urzeitliche Rebellen.'
