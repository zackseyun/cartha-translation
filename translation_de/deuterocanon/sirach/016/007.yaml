  source_fidelity: 'Die Hauptaussage folgt dem hebräischen Text angemessen: Gott verschont die Herrscher der Vorzeit nicht; ihr rebellisches Handeln und ihre Stärke werden bewahrt. Die schwierige Stellung bzw. Lesung von עוֹלָם wird zu Recht nicht scheinbar sicher aufgelöst, sondern durch die Fußnote kenntlich gemacht. Die griechische Lesart mit den „alten Riesen“ bleibt als alternative Überlieferung ausgewiesen.'
  naturalness: „In ihrer Macht“ ist im Deutschen an dieser Stelle weniger idiomatisch und kann „innerhalb ihres Herrschaftsbereichs“ bedeuten. „In ihrer Stärke“ gibt בגבורתם unmittelbarer und natürlicher wieder. Die Fußnotenmarker sollen bei den jeweils erläuterten Ausdrücken stehen; besonders Marker b gehört an „Stärke“, nicht an „Vorzeit“.
  terminology: „Fürsten der Vorzeit“ ist als hebräisch orientierte Wiedergabe von נסיכי קדם vertretbar. „Sich auflehnten“ gibt המורים sachgerecht wieder. Die griechische Fußnote sollte nicht behaupten, der griechische Text identifiziere die Gruppe endgültig, sondern vorsichtiger sagen, dass er sie als urzeitliche Rebellen versteht bzw. deutet.
