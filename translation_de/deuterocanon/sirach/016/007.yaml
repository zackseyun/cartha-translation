lexical_decisions:
- source_word: לֹא נָשָׁא
  choice: verschonte … nicht
  rationale: Die Wendung bezeichnet hier im Gerichtszusammenhang das Verweigern von Schonung oder Nachsicht. Die griechische Parallele οὐκ ἐξιλάσατο stützt diese idiomatische Wiedergabe.
- source_word: לֲנְסִיכֵי קֶדֶם
  choice: die Fürsten der Vorzeit
  rationale: Der erhaltene hebräische Text spricht wörtlich von Fürsten oder Herrschern der Vorzeit. Diese Lesart bleibt im Haupttext maßgeblich; die griechische Identifizierung als urzeitliche Riesen wird in einer Fußnote bewahrt.
- source_word: הַמּוֹרִים
  choice: die sich … auflehnten
  rationale: Das Partizip von מרה bezeichnet rebellisches, widersetzliches Handeln. „Sich auflehnen“ gibt dies in natürlichem, würdigem Deutsch wieder.
- source_word: עוֹלָם בִּגְבוּרָתָם
  choice: in ihrer Macht
  rationale: עוֹלָם ist an dieser Stelle textkritisch schwierig. בִּגְבוּרָתָם bedeutet „in ihrer Stärke/Macht“, und die griechische Parallele τῇ ἰσχύϊ αὐτῶν bestätigt diesen Sinn. Die Unsicherheit wird durch eine Fußnote kenntlich gemacht.
theological_decisions:
- issue: Identität der Gerichteten
  choice: Im Haupttext stehen nach dem Hebräischen „die Fürsten der Vorzeit“.
  alternative: 'Nach dem Griechischen: „die Riesen der Vorzeit“.'
  rationale: Der erhaltene hebräische Wortlaut hat Vorrang, während die griechische Parallele die Gruppe als die urzeitlichen Riesen identifiziert. Die Fußnote erhält diese Spannung, ohne sie im Haupttext aufzulösen.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem biblischem Register. „Vorzeit“ wahrt den urgeschichtlichen Bezug, „sich auflehnen“ den moralischen Gehalt des hebräischen Partizips.
