base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/016/018.yaml
  text: 'Look—the heavens and the highest heavens[a], the deep and the earth: when he descends upon them, they stand still[b]; at his visitation they quake.'
translation:
  language: de
  text: 'Sieh: der Himmel und die höchsten Himmel[a], die Urflut und die Erde – wenn er auf sie herabkommt, stehen sie still[b]; bei seiner Heimsuchung erbeben sie.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „der Himmel und die Himmel der Himmel“. Die hebräische Wendung ist eine Steigerungsform und bezeichnet die höchsten Himmel.'
    reason: lexical_alternative
  - marker: b
    text: 'Der hebräische Wortlaut dieses Satzteils ist in der zusammengesetzten Überlieferung aus der Kairoer Genisa schwierig. Die griechische Fassung bietet einen kürzeren, abweichenden Wortlaut und besagt: „Die Tiefe und die Erde werden bei seiner Heimsuchung erschüttert.“'
    reason: textual_variant
lexical_decisions:
- source_word: הֵן
  choice: Sieh
  rationale: Bewahrt den nachdrücklichen, hinweisenden Ausruf in knapper und verständlicher Form.
- source_word: הַשָּׁמַיִם וּשְׁמֵי הַשָּׁמַיִם
  choice: der Himmel und der Himmel der Himmel
  rationale: Die formnahe Wiedergabe erhält das hebräische Steigerungsgefüge und dessen kosmische Weite; eine idiomatischere Alternative wäre „der höchste Himmel“.
- source_word: תְהוֹם
  choice: die Urflut
  rationale: Bezeichnet die kosmische Tiefe beziehungsweise Urflut; die griechische Parallele ἄβυσσος bestätigt dieses Bedeutungsfeld.
- source_word: בְּרִדְתּוֹ עֲלֵיהֶם עוֹמְדִים
  choice: wenn er auf sie herabkommt, stehen sie still
  rationale: Gibt den vorhandenen hebräischen Wortlaut trotz seiner textlichen Schwierigkeit wieder, ohne die anthropomorphe Aussage abzuschwächen.
- source_word: בְּפָקְדוֹ
  choice: wenn er sie heimsucht
  rationale: פקד bezeichnet hier ein wirksames göttliches Eingreifen. „Heimsuchen“ bewahrt das Gewicht des Ausdrucks und legt nicht eindeutig fest, ob Prüfung, Gericht oder anderes Eingreifen gemeint ist.
- source_word: יִרְגְּשׁוּ
  choice: erbeben sie
  rationale: Drückt die kosmische Erschütterung lebendig aus und stimmt mit dem griechischen σαλευθήσονται überein.
theological_decisions:
- issue: Anthropomorphe Rede vom göttlichen Herabkommen
  choice: wenn er auf sie herabkommt
  alternative: bei seiner Heimsuchung
  rationale: Der hebräische Text nennt ausdrücklich sein Herabkommen. Die Übersetzung bewahrt dieses Bild, während die Fußnote auf die schwierige Überlieferung und die abweichend kürzere griechische Parallele hinweist.
- issue: Bedeutungsbreite der göttlichen Heimsuchung
  choice: wenn er sie heimsucht
  alternative: wenn er nach ihnen sieht
  rationale: Die Wiedergabe lässt offen, ob das göttliche Eingreifen als Prüfung, Gericht oder machtvolle Gegenwart zu verstehen ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kosmische Bildsprache und die auffällige Spannung zwischen Stillstehen und Erbeben bleiben erhalten; die textkritische Unsicherheit wird nicht stillschweigend geglättet.
