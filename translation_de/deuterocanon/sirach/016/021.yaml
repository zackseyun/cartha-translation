    rationale: 'Die Formulierung „an jedem verborgenen Ort“ ist zwar formal nachvollziehbar, klingt aber in der rhetorischen Frage unnatürlich und verschiebt die Aussage leicht zu einem Wissen an sämtlichen Orten. Im Deutschen entspricht „in irgendeinem Versteck“ hier der negativen/rhetorischen Erwartung: Niemand könnte es selbst in einem Versteck wissen.'
