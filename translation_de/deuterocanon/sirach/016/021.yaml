  verdict: revise
  source_fidelity: 'Der Haupttext folgt zutreffend dem erhaltenen Hebräischen: die Bedingungssätze, das konkrete Bild von keinem Auge und die Frage nach verborgenem Wissen bleiben erhalten. Die griechische Parallelüberlieferung ist zu Recht nicht in den Haupttext harmonisiert.'
  naturalness: „Wer weiß davon an jedem verborgenen Ort?“ ist im Deutschen in seiner Quantifizierung und Bezugnahme schwer verständlich; es kann nahelegen, jemand wisse an jedem einzelnen Ort davon. „Wer weiß es in irgendeinem Versteck?“ gibt die rhetorische Frage mit der durch כָּל möglichen distributiv-indefiniten Nuance natürlich wieder.
  terminology: „Sündigen“ und „lügen“ sind sachgerecht. „Versteck“ bewahrt bei סֵתֶר den räumlichen Aspekt besser als das abstraktere „im Verborgenen“.
  issues:
