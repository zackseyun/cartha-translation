revisions:
- from: Wenn ich gesündigt habe, sieht mich kein Auge; oder wenn ich lüge – wer weiß davon an jedem verborgenen Ort?[a][b]
  to: Wenn ich gesündigt habe, sieht mich kein Auge; oder wenn ich lüge – wer weiß es in irgendeinem Versteck[b]?[a]
  rationale: Die Revision beseitigt die im Deutschen missverständliche Verbindung „wer weiß davon an jedem verborgenen Ort?“ und setzt die lexikalische Anmerkung unmittelbar an den Ausdruck, den sie erläutert. Der hebräische räumliche Ausdruck bleibt gewahrt, ohne den abweichenden griechischen Text in den Haupttext einzutragen.
