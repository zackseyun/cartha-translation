translation:
  language: de
  text: Wenn ich gesündigt habe, sieht mich kein Auge; oder wenn ich lüge – wer weiß es in irgendeinem Versteck[b]?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der griechische Paralleltext weicht hier erheblich ab. Er spricht unter anderem davon, dass viele seiner Werke im Verborgenen sind. Da der hebräische Text für diesen Vers erhalten ist, folgt der Haupttext dem Hebräischen.
    reason: textual_variant
  - marker: b
    text: 'Oder: „an jedem geheimen Ort“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם חָטָאתִי
  choice: Wenn ich gesündigt habe
  rationale: אִם leitet mit dem Perfekt eine allgemeine hypothetische Bedingung ein; das deutsche Perfekt gibt sie natürlich wieder.
- source_word: לֹא תִרְאֵנִי עָיִן
  choice: sieht mich kein Auge
  rationale: Die konkrete hebräische Bildsprache mit עָיִן als Subjekt bleibt erhalten und klingt zugleich idiomatisch.
- source_word: אוֹ אִם אֲכַזֵב
  choice: oder wenn ich lüge
  rationale: כזב bezeichnet hier im Zusammenhang verborgenen Fehlverhaltens am klarsten das Lügen; „täusche“ wäre ebenfalls möglich.
- source_word: בְּכָל סֵתֶר
  choice: an jedem verborgenen Ort
  rationale: סֵתֶר kann einen verborgenen oder geheimen Ort bezeichnen. Diese Fassung bewahrt den räumlichen Sinn und ist im Deutschen natürlicher als „an jedem Versteck“.
- source_word: מִי יוֹדֵעַ
  choice: wer weiß davon
  rationale: Wörtlich steht „wer weiß?“; „davon“ verdeutlicht den im Zusammenhang vorausgesetzten Gegenstand, ohne zusätzlichen Inhalt einzutragen.
- source_word: καὶ καταιγίς, ἣν οὐκ ὄψεται ἄνθρωπος, τὰ δὲ πλεῖονα τῶν ἔργων αὐτοῦ ἐν ἀποκρύφοις
  choice: nur als Kontrollzeugnis für das Motiv des Verborgenen berücksichtigt
  rationale: Der griechische Paralleltext weicht erheblich ab. Da der hebräische Text hier mit hoher Sicherheit erhalten ist, bildet er die Grundlage; ἐν ἀποκρύφοις bestätigt lediglich das Bedeutungsfeld des Verborgenen.
theological_decisions:
- issue: Priorität der Textzeugen bei der stark abweichenden hebräischen und griechischen Überlieferung
  choice: Der erhaltene hebräische Text wird als Haupttext übersetzt; der griechische Paralleltext dient nur zur semantischen Kontrolle.
  alternative: Eine griechisch basierte oder aus beiden Zeugen harmonisierte Fassung.
  rationale: Für diesen Vers liegt ein hochkonfidenter hebräischer Zeuge vor. Die erhebliche Abweichung des Griechischen sollte transparent gemacht, aber nicht stillschweigend in den Haupttext eingearbeitet werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die rhetorische Selbstaussage und das konkrete Bild „kein Auge“ bleiben erhalten. Der Gedankenstrich markiert den Übergang zur zugespitzten Frage; beide Fußnotenmarker stehen wie vorgeschrieben im Haupttext.
