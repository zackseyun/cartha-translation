base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/004/001.yaml
  text: My son[a], do not mock the life of the poor[b], and do not grieve a poor and bitter soul.
translation:
  language: de
  text: Mein Sohn, verspotte nicht das Leben eines Armen[a] und füge einem armen, tief bekümmerten Menschen keinen Schmerz zu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Text lautet: „Entziehe dem Armen nicht das Leben“; dies kann auch bedeuten: „Entziehe dem Armen nicht den Lebensunterhalt.“'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlich: „einer armen und bitteren Seele“. Das hebräische Wort für „Seele“ kann auch „Leben“, „Selbst“ oder „Person“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנִי
  choice: Mein Sohn
  rationale: Die direkte maskuline Anrede entspricht der herkömmlichen Lehrformel der Weisheitsliteratur und bewahrt die Form des hebräischen Textes.
- source_word: אַל תִּלְעַג
  choice: verspotte nicht
  rationale: Das Verb bezeichnet spöttische Herabsetzung oder Verachtung; „verspotten“ gibt die ethische Schärfe natürlich und präzise wieder.
- source_word: לְחַיֵּי עָנִי
  choice: das Leben eines Armen
  rationale: Die Wiedergabe bleibt nahe am hebräischen Wortlaut. Gemeint sein kann zugleich die Lebenslage oder der Lebensunterhalt des Armen; die abweichende griechische Überlieferung wird in der Fußnote genannt.
- source_word: וְאַל תַּדְאִיב
  choice: bereite … keinen Schmerz
  rationale: Das Verb bedeutet Schmerz, Kummer oder Betrübnis verursachen. Die gewählte Formulierung ist im Deutschen idiomatischer als „betrübe nicht“ und umfasst seelisches Leid.
- source_word: נֶפֶשׁ
  choice: Menschen
  rationale: נפש kann hier die Person beziehungsweise ihr inneres Selbst bezeichnen. „Mensch“ ergibt zusammen mit „verbittert“ eine natürliche deutsche Aussage, ohne den Ausdruck auf eine körperlose Seele einzuengen.
- source_word: עָנֵי וּמַר נָפֶשׁ
  choice: armen, verbitterten Menschen
  rationale: Die Wendung beschreibt wahrscheinlich denselben Menschen als arm und innerlich bitter beziehungsweise tief bekümmert. „Verbittert“ wahrt die Bildsprache von מר נפש in verständlichem Deutsch.
theological_decisions:
- issue: Verhältnis des hebräischen und griechischen Textzeugen im ersten Satzteil
  choice: Der hebräische Text bildet mit „verspotte nicht das Leben eines Armen“ den Haupttext.
  alternative: 'Nach dem Griechischen: „Entziehe dem Armen nicht das Leben“, möglicherweise im Sinn von „Entziehe ihm nicht den Lebensunterhalt“.'
  rationale: Der erhaltene hebräische Text ist vorrangig, während die deutlich abweichende griechische Lesart als alter Textzeuge nicht stillschweigend eingearbeitet, sondern transparent in einer Fußnote bewahrt wird.
- issue: Bedeutungsumfang von נפש und מר נפש
  choice: „verbitterter Mensch“
  alternative: „betrübte Seele“, „Mensch mit bitterer Seele“ oder „tief bekümmerter Mensch“
  rationale: Die Übersetzung versteht נפש personenbezogen und מר נפש als Beschreibung schwerer innerer Bedrängnis. „Verbittert“ erhält dabei die mögliche Spannung zwischen Leid und daraus erwachsener Bitterkeit.
- issue: Geschlechtsspezifische Anrede der Weisheitslehre
  choice: „Mein Sohn“
  alternative: „Mein Kind“
  rationale: Die maskuline Singularform des hebräischen Ausgangstextes wird genau wiedergegeben, ohne die allgemeine Anwendbarkeit der Weisung einzuschränken.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Anrede „Mein Sohn“ bewahrt die traditionelle Weisheitsformel. „Bereite … keinen Schmerz“ ist natürlich verständlich; die Fußnoten sichern sowohl die griechische Textvariante als auch die Mehrdeutigkeit von נפש.
