  text: Rescue the oppressed from his oppressors[a], and do not let your spirit grow impatient when judging rightly.
translation:
  language: de
  text: Rette den Bedrängten vor seinen Bedrängern[a], und lass deinen Geist nicht ungeduldig werden, wenn du gerecht urteilst.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Parallelüberlieferung lautet: „Neige dein Ohr dem Armen zu und antworte ihm friedlich und mit Sanftmut.“ Der hebräische Text spricht hier dagegen davon, den Bedrängten zu retten und beim gerechten Urteilen nicht ungeduldig zu werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: הוֹשַׁע
  choice: Rette
  rationale: Der Imperativ von ישׁע fordert zu aktivem Eingreifen auf. „Rette“ gibt die Dringlichkeit natürlich wieder, ohne hier zwingend einen heilsgeschichtlichen Sinn einzutragen.
- source_word: מוּצָק
  choice: den Bedrängten
  rationale: Die passive Form bezeichnet einen Menschen, der unter Druck gesetzt oder misshandelt wird. „Bedrängter“ bewahrt diese Bedeutung und passt zum weisheitlich-rechtlichen Zusammenhang.
- source_word: מִמְּצִיקָיו
  choice: vor seinen Bedrängern
  rationale: Das mit מוּצָק verwandte Wort bezeichnet diejenigen, die den Betroffenen bedrängen. Die Wiederholung des deutschen Wortstamms bildet das hebräische Wortspiel ab; „vor“ ist bei „retten“ idiomatischer als „von“.
- source_word: וְאַל תָּקוֹץ רוּחֲךָ
  choice: und lass deinen Geist nicht ungeduldig werden
  rationale: קוץ kann Ungeduld, Verdruss oder Widerwillen ausdrücken. Die Formulierung wahrt ausdrücklich den inneren Gemütszustand und lässt die mögliche Nuance zunehmenden Überdrusses erkennen.
- source_word: בְּמִשְׁפַט יֹשֶׁר
  choice: wenn du gerecht urteilst
  rationale: Die Wendung verbindet das Urteilen mit Aufrichtigkeit beziehungsweise Gerechtigkeit. Die verbale Wiedergabe ist im Deutschen klar und bewahrt den gerichtlichen Sinn.
theological_decisions:
- issue: Deutliche Abweichung zwischen dem hebräischen Text und der griechischen Parallelüberlieferung
  choice: Der erhaltene hebräische Text steht im Haupttext; die griechische Fassung wird in einer Fußnote dokumentiert.
  alternative: „Neige dein Ohr dem Armen zu und antworte ihm friedlich und mit Sanftmut.“
  rationale: Da für diese Stelle ein hoch eingestufter hebräischer Zeuge vorliegt, bildet er die Grundlage des Haupttexts. Die erheblich anderslautende griechische Tradition wird nicht harmonisiert oder verschwiegen, sondern als alternative Überlieferung kenntlich gemacht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Paarung „Bedrängten/Bedrängern“ bildet die hebräische Wurzelwiederholung hörbar ab. Der Fußnotenmarker [a] steht unmittelbar nach der ersten Aussage, auf die sich die abweichende griechische Überlieferung bezieht.
