    reason: lexical_alternative
lexical_decisions:
- source_word: καραμένου
  choice: gegen dich klagt
  rationale: Das Partizip bezeichnet hier eine gegen den Angesprochenen gerichtete Klage bzw. Anrufung. „Klagt“ ist natürliches modernes Deutsch und lässt die mögliche gerichtliche oder verwünschende Färbung offen.
- source_word: ἐν πικρίᾳ ψυχῆς αὐτοῦ
  choice: in der Bitterkeit seiner Seele
  rationale: Die weitgehend formale Wiedergabe bewahrt die emotionale und anthropologische Aussage des Griechischen, ohne ψυχή auf „Herz“ oder „Gemüt“ zu verengen.
- source_word: τῆς δεήσεως αὐτοῦ
  choice: sein Flehen
  rationale: „Flehen“ gibt die dringliche Bitte gut wieder und kann sowohl Gebet als auch Hilferuf bezeichnen.
- source_word: ἐπακούσεται
  choice: wird … erhören
  rationale: „Erhören“ drückt mehr als bloßes akustisches Hören aus, ohne eine bestimmte Art der Antwort festzulegen.
- source_word: ὁ ποιήσας αὐτόν
  choice: der, der ihn erschaffen hat
  rationale: Die Umschreibung folgt der griechischen Formulierung eng und bezeichnet Gott aufgrund seines Schöpferhandelns, ohne einen im Text nicht ausdrücklich stehenden Gottesnamen einzusetzen.
theological_decisions:
- issue: Wahl der Textgrundlage bei nicht übereinstimmendem hebräischem Zeugen
  choice: Der Haupttext folgt dem griechischen Zeugen; die Abweichung des überlieferten hebräischen Textes wird in einer Fußnote offengelegt.
  alternative: 'Den vorgelegten hebräischen Satz übersetzen: „Liebe dein Leben um der Gemeinde willen, und beuge dein Haupt noch mehr vor der Obrigkeit.“'
  rationale: Der angeführte hebräische Satz entspricht weder dem griechischen Text dieses Verses noch dessen Zusammenhang. Der griechische Zeuge bietet hier einen kohärenten Text; die echte textkritische Unsicherheit darf jedoch nicht verschwiegen werden.
- issue: Bedeutung von καραμένου
  choice: gegen dich klagt
  alternative: ein Urteil auf dich herabruft
  rationale: Die gewählte Formulierung bewahrt den gegen den Adressaten gerichteten Charakter und bleibt zugleich offen dafür, ob eine Beschwerde, ein Hilferuf oder eine Bitte um göttliches Gericht gemeint ist.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt nahe am griechischen Zeugen; „Seele“, „Flehen“ und „erhören“ bewahren den biblischen Ton, sind aber weiterhin allgemein verständlich.
