  text: For if he cries out against you in the bitterness of his soul, his Maker will hear his plea.[a][b]
translation:
  language: de
  text: Denn wenn er dich in der Bitterkeit seiner Seele verflucht, wird der, der ihn erschaffen hat, sein Flehen erhören.[a][b]
  philosophy: optimal-equivalence
  footnotes:
