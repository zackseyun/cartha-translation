  text: If he turns away from me[a], I will cast him off and hand him over to plunderers.
translation:
  language: de
  text: Wenn er sich von mir abwendet[a], werde ich ihn verstoßen und ihn Plünderern ausliefern.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Griechisch: „Wenn er in die Irre geht, wird sie ihn verlassen und ihn den Händen seines Verderbens preisgeben.“ Dies kann auf eine andere hebräische Textgrundlage oder auf eine deutende Übersetzung zurückgehen.'
    reason: alternative_reading
lexical_decisions:
- source_word: יָסוּר
  choice: sich abwendet
  rationale: Das Verb סור bezeichnet ein Abweichen, Sich-Abwenden oder Fortgehen. „Sich abwendet“ gibt die bewusste Abkehr von der Weisheit natürlich wieder, ohne sie ausdrücklich als Glaubensabfall zu deuten.
- source_word: מֵאַחֲרַי
  choice: von mir
  rationale: Wörtlich „von hinter mir (weg)“; die Wendung bezeichnet hier das Aufgeben der Nachfolge. Zusammen mit „sich abwendet“ ist „von mir“ im Deutschen klar und idiomatisch.
- source_word: אַשׁלִיכֶנּוּ
  choice: werde ich ihn verstoßen
  rationale: שלך bedeutet konkret „werfen“. Das deutsche „verstoßen“ bewahrt in diesem Beziehungskontext die kraftvolle Vorstellung des Wegstoßens, ohne unnatürlich zu klingen.
- source_word: וְאַסְגִּירֶנּוּ
  choice: und ihn … ausliefern
  rationale: Die Form von סגר bedeutet, jemanden der Gewalt anderer zu übergeben. „Ausliefern“ ist eine prägnante, gegenwärtige Entsprechung.
- source_word: לַשֹׁדְדִים
  choice: Plünderern
  rationale: Das hebräische Substantiv bezeichnet Plünderer oder räuberische Verwüster. „Plünderern“ ist die direkte Wiedergabe des klaren hebräischen Textes.
theological_decisions:
- issue: Abweichung zwischen dem hebräischen Text und der griechischen Parallelüberlieferung
  choice: 'Im Haupttext steht nach dem Hebräischen: „ihn Plünderern ausliefern“.'
  alternative: 'Nach dem Griechischen: „ihn den Händen seines Verderbens preisgeben“ beziehungsweise „ihn seinem Untergang ausliefern“.'
  rationale: Der erhaltene, als zuverlässig bewertete hebräische Text hat לַשֹׁדְדִים („den Plünderern“). Die griechische Überlieferung bietet dagegen εἰς χεῖρας πτώσεως αὐτοῦ („in die Hände seines Falls/Untergangs“). Da für diesen Vers ein klarer hebräischer Zeuge vorliegt, bestimmt er den Haupttext; die abweichende griechische Lesart wird transparent in der Fußnote bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die personifizierte Weisheit spricht in der ersten Person. „Verstoßen“ und „ausliefern“ erhalten die Härte und Bildkraft des Hebräischen, ohne altertümlich zu wirken.
