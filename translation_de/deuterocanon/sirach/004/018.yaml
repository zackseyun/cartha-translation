  text: If he turns aside[b][a], she will bind him with bonds.
translation:
  language: de
  text: Wenn er abweicht und sich abwendet,[a] werde ich ihn mit Fesseln binden.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die hebräische Form hinter „sich abwendet“ ist schwierig; auch eine Deutung mit ausdrücklichem Bezug auf die Weisheit („sich von ihr abwendet“) ist möglich.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich nach der überlieferten hebräischen Vokalisierung: „werde ich ihn mit Fesseln binden“. Die Form kann im Zusammenhang auch auf die Weisheit bezogen werden: „Sie wird ihn mit Fesseln binden.“ Die griechische Parallelfassung lautet ganz anders: „Dann wird sie wieder geraden Weges zu ihm kommen, ihn erfreuen und ihm ihre verborgenen Dinge enthüllen.“ Sie bezeugt wahrscheinlich eine andere Textgestalt des Sirachbuches.'
    reason: textual_variant
lexical_decisions:
- source_word: אִם
  choice: wenn
  rationale: Leitet eine reale Bedingung ein; „wenn“ gibt den hebräischen Bedingungssatz im Deutschen natürlich wieder.
- source_word: יָסוּר
  choice: er abweicht
  rationale: סור bezeichnet das Abweichen oder Sich-Entfernen und bewahrt hier das Bild des Abkommens vom rechten Weg.
- source_word: וּנְטוֹתֵיהוּ
  choice: und sich abwendet
  rationale: Die Form ist schwierig. Die Wiedergabe wahrt den erkennbaren Gedanken einer weiteren Abwendung, ohne das im Hebräischen nicht ausdrücklich genannte Objekt „von ihr“ in den Haupttext einzufügen.
- source_word: וַאֲסַרְתִיהוּ
  choice: werde ich ihn … legen
  rationale: Die überlieferte Vokalisierung weist auf die erste Person Singular. Daher folgt der Haupttext der hebräischen Form, auch wenn der Zusammenhang eine Deutung mit der Weisheit als Subjekt („sie wird ihn binden“) nahelegen kann.
- source_word: בָאֲסוּרִים
  choice: in Fesseln
  rationale: אֲסוּרִים bezeichnet Bindungen oder Fesseln. „In Fesseln legen“ ist im heutigen Deutsch idiomatisch und erhält das konkrete Bild der Gefangensetzung.
theological_decisions:
- issue: Subjekt des zweiten Satzteils
  choice: 'Erste Person: „werde ich ihn … legen“'
  alternative: „wird sie ihn in Fesseln legen“, mit der personifizierten Weisheit als Subjekt
  rationale: Die punktierte hebräische Form ist am unmittelbarsten als erste Person Singular zu lesen. Der abrupte Sprecherwechsel beziehungsweise eine mögliche abweichende Lesung wird nicht stillschweigend geglättet, sondern in der Fußnote offengelegt.
- issue: Verhältnis zur griechischen Parallelüberlieferung
  choice: Der Haupttext folgt dem erhaltenen hebräischen Text.
  alternative: 'Der griechischen Fassung folgen: Die Weisheit kehrt geraden Weges zu ihm zurück, erfreut ihn und enthüllt ihm ihre Geheimnisse.'
  rationale: Die griechische Fassung unterscheidet sich inhaltlich erheblich und dürfte eine andere Textgestalt bezeugen. Da ein hoch eingestufter hebräischer Text vorliegt, bleibt er Grundlage der Übersetzung; die Variante wird dokumentiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die konkrete Fesselmetaphorik bleibt erhalten. Die schwierige Syntax und der mögliche Wechsel zwischen erster Person und personifizierter Weisheit werden nicht harmonisiert, sondern transparent ausgewiesen.
