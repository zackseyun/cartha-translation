  text: Do not show partiality against yourself[a], and do not stumble to your own downfall.
translation:
  language: de
  text: Sei nicht parteiisch gegen dich selbst, und stolpere nicht über deine eigenen Stolpersteine.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das Hebräische kann im zweiten Satzteil näher an der Wortform wiedergegeben werden: „und strauchle nicht bei deinem Straucheln“; die genaue Beziehung der beiden gleichstämmigen Ausdrücke ist unsicher. Die griechische Parallele liest dagegen: „und schäme dich nicht zu deinem Fall.“'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תִּשָּׂא פָנֶיךָ
  choice: Sei nicht parteiisch
  rationale: Die hebräische Wendung נשא פנים bedeutet wörtlich, das Gesicht zu erheben, idiomatisch aber, jemanden zu begünstigen oder parteiisch zu sein. Die griechische Parallele μὴ λάβῃς πρόσωπον bestätigt den idiomatischen Sinn.
- source_word: עַל נַפְשֶׁךָ
  choice: zu deinem eigenen Schaden
  rationale: נפש bezeichnet hier die eigene Person beziehungsweise das eigene Leben. Zusammen mit על drückt die Wendung eine Parteinahme aus, die sich gegen die eigene Person richtet. Die natürliche deutsche Formulierung bewahrt diesen paradoxen Warnsinn.
- source_word: וְאַל תִּכָּשֵׁל
  choice: und stolpere nicht
  rationale: Die überlieferte hebräische Form gehört zu כשל, „stolpern, straucheln, zu Fall kommen“. Die Hauptfassung folgt daher dem Hebräischen; die abweichende griechische Lesart wird in der Fußnote genannt.
- source_word: לְמִכְשׁוֹלֶיךָ
  choice: über deine eigenen Stolpersteine
  rationale: מכשול kann einen Stolperstein, ein Hindernis oder einen Anlass zum Fall bezeichnen. Das deutsche Bild gibt die Wortwiederholung mit כשל verständlich wieder, ohne sie auf eine bestimmte Art moralischen oder praktischen Versagens einzuengen.
