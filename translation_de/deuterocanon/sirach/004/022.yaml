translation_notes:
  register: Moderne, würdige Standardsprache. Die erste hebräische Redewendung wird idiomatisch wiedergegeben; im zweiten Satzteil bleibt das auffällige hebräische Wortspiel zwischen „stolpern“ und „Stolpersteinen“ erhalten. Die abweichende griechische Überlieferung wird nicht in den Haupttext eingetragen, sondern transparent in der Fußnote dokumentiert.
