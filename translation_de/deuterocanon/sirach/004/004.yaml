  text: Do not withhold a gift from your poor man[a], and do not despise the request of the poor, nor give him occasion to curse you.
translation:
  language: de
  text: Halte einem Armen keine Gabe vor, verachte die Bitte eines Bedürftigen nicht und gib ihm keinen Anlass, dich zu verfluchen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Überlieferung lautet: „Weise einen bedrängten Bittsteller nicht ab und wende dein Gesicht nicht von einem Armen ab.“ Sie ist kürzer und enthält den abschließenden Satz über den Anlass zum Fluch nicht.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תִּמְנַע
  choice: Entzieh … keine
  rationale: מנע bedeutet, etwas zurückzuhalten oder vorzuenthalten. Die deutsche Konstruktion gibt das Verbot direkt und natürlich wieder.
- source_word: מַתָּן
  choice: Gabe
  rationale: מַתָּן bezeichnet allgemein eine Gabe oder ein Geschenk. „Gabe“ wahrt die Weite des Ausdrucks, ohne ihn auf Almosen zu verengen.
- source_word: מִמִּסְכֵּנֶךָ
  choice: dem Armen, für den du Verantwortung trägst
  rationale: Wörtlich steht „deinem Armen“. Die Formulierung macht die durch das Possessivsuffix angezeigte Beziehung und Verantwortung verständlich, ohne Besitz am Menschen auszudrücken.
- source_word: וְלֹא תִבְזֶה
  choice: verachte … nicht
  rationale: בזה bezeichnet Verachtung beziehungsweise die Geringschätzung eines Menschen oder seines Anliegens.
- source_word: שְׁאֵלוֹת דָּל
  choice: die Bitte eines Bedürftigen
  rationale: שְׁאֵלוֹת kann Bitten oder Gesuche bezeichnen; דָּל ist ein armer, schwacher oder bedürftiger Mensch. Der Singular ist im Deutschen als situationsbezogene Wiedergabe natürlich.
- source_word: וְלֹא תִתֵּן לוֹ מָקוֹם
  choice: gib ihm keinen Anlass
  rationale: Wörtlich „gib ihm keinen Raum/Platz“; idiomatisch ist gemeint, keinen Grund oder Anlass für die folgende Reaktion zu schaffen.
- source_word: לְקַלְלֶךָ
  choice: dich zu verfluchen
  rationale: קלל bezeichnet hier das Aussprechen eines Fluches. Die direkte Wiedergabe bewahrt die Schärfe der Warnung.
theological_decisions:
- issue: Vollständiger hebräischer Text gegenüber der kürzeren griechischen Überlieferung
  choice: Der erhaltene hebräische Text bildet mit allen drei Aussagen den Haupttext.
  alternative: 'Die griechische Parallele lautet kürzer: „Weise einen bedrängten Bittsteller nicht ab und wende dein Gesicht nicht von einem Armen ab.“'
  rationale: Wo der hebräische Sirachtext erhalten und hinreichend sicher ist, hat er Vorrang. Die griechische Fassung bezeugt denselben ethischen Kern, enthält jedoch weder die konkrete Rede von der Gabe noch die abschließende Warnung vor dem Fluch.
translation_notes:
  register: Modernes, würdiges Standarddeutsch in direkter Mahnrede. „Für den du Verantwortung trägst“ entfaltet das im Hebräischen ungewöhnliche „deinem Armen“, ohne eine besitzanzeigende deutsche Wendung zu erzwingen.
