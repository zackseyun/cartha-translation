  text: If he trusts her, he will inherit her, and his descendants will possess her.[a]
translation:
  language: de
  text: Denn wenn ich mich fremd stelle, werde ich mit ihm gehen, und zunächst werde ich ihn durch Prüfungen erproben.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Überlieferung hat hier einen deutlich anderen Wortlaut: „Wenn er ihr vertraut, wird er sie erben, und seine Nachkommen werden sie besitzen.“ Der erhaltene hebräische Text scheint eher den Gedanken fortzuführen, dass die Weisheit ihren Schüler prüft; möglicherweise liegt eine abweichende Überlieferung oder Versabgrenzung vor.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Gibt die begründende Verknüpfung mit dem vorhergehenden Zusammenhang wieder.
- source_word: בְהִתְנַכֵּר
  choice: wenn ich mich fremd stelle
  rationale: Das Hitpael von נכר bezeichnet hier ein Sich-fremd-Stellen beziehungsweise ein unerkanntes oder distanziertes Auftreten. Die Formulierung wahrt die ungewöhnliche Bildsprache des Hebräischen.
- source_word: אֵלֵךְ עִמּוֹ
  choice: werde ich mit ihm gehen
  rationale: Bewahrt die erste Person der personifizierten Weisheit und die konkrete Wegmetaphorik.
- source_word: וּלְפָנִים
  choice: und zunächst
  rationale: לְפָנִים kann zeitlich auf den Anfang beziehungsweise die erste Phase verweisen; „zunächst“ ist im Kontext natürlich, ohne die schwierige Wendung zu überpräzisieren.
- source_word: אֶבְחָרֶנּוּ בְנִסְיוֹנוֹת
  choice: werde ich ihn durch Prüfungen erproben
  rationale: Obwohl בחר gewöhnlich „erwählen/auswählen“ bedeutet, legt die Verbindung mit נִסְיוֹנוֹת und der Kontext des Prüfens die Bedeutung „erproben“ nahe. „Durch Prüfungen“ gibt die instrumentale Präposition ב wieder.
theological_decisions:
- issue: Materielle Abweichung zwischen dem erhaltenen hebräischen Wortlaut und der griechischen Überlieferung
  choice: Der erhaltene hebräische Wortlaut bildet den Haupttext; die griechische Lesart wird in einer Fußnote dokumentiert.
  alternative: „Wenn er ihr vertraut, wird er sie erben, und seine Nachkommen werden sie besitzen.“
  rationale: Die Aufgabe verlangt vorrangig eine Übersetzung nach dem originalsprachlichen Quellenbefund. Der bereitgestellte hebräische Text ist als hoch zuverlässig ausgewiesen, auch wenn er möglicherweise gegenüber der üblichen Versabgrenzung verschoben oder divergent ist. Die Spannung zwischen den Zeugen darf daher nicht stillschweigend zugunsten des glatteren griechischen Textes aufgelöst werden.
- issue: Sprecherin in der ersten Person
  choice: Die erste Person wird als Rede der personifizierten Weisheit beibehalten.
  alternative: Eine unpersönliche oder männliche Sprecherangabe ergänzen.
  rationale: Der Kontext identifiziert die Weisheit als Sprecherin; eine erklärende Ergänzung im Vers selbst wäre jedoch nicht ausdrücklich im hebräischen Wortlaut enthalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die auffällige hebräische Wendung „sich fremd stellen“ bleibt bewusst sichtbar; „erproben“ macht den Prüfungskontext verständlich, ohne die textliche Schwierigkeit zu verdecken.
