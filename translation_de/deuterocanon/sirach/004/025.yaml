translation:
  language: de
  text: Widersetze dich Gott nicht, sondern demütige dich vor Gott.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Parallelüberlieferung lautet: „Widersprich der Wahrheit nicht, und schäme dich deiner Unbildung.“ Der hebräische Text lautet dagegen: „Widersetze dich Gott nicht, sondern demütige dich vor Gott.“'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תִּסָּרֵב
  choice: Widersetze dich nicht
  rationale: Das hebräische Verb bezeichnet hier eine ablehnende oder widerstrebende Haltung. „Sich widersetzen“ gibt diesen Gegensatz zur anschließenden Selbsterniedrigung natürlich und prägnant wieder.
- source_word: עִם הָאֵל
  choice: Gott
  rationale: אֵל ist hier eine Gottesbezeichnung. Die Präposition עִם wird im Deutschen idiomatisch durch die Konstruktion „sich Gott widersetzen“ wiedergegeben.
- source_word: וְאֶל אֱלֹהִים
  choice: vor Gott
  rationale: Die Präposition אֶל bedeutet wörtlich „zu/auf … hin“; zusammen mit הִכָּנֵעַ bringt „vor Gott“ die gerichtete Haltung im Deutschen idiomatisch zum Ausdruck.
- source_word: הִכָּנֵעַ
  choice: demütige dich
  rationale: Die Form bezeichnet ein Sichbeugen, Sichunterwerfen oder Demütigen. „Demütige dich“ wahrt die reflexive Aufforderung und bildet den Gegensatz zum Widerstreben klar ab.
theological_decisions:
- issue: Deutliche Abweichung zwischen dem erhaltenen hebräischen Text und der griechischen Parallelüberlieferung
  choice: Der Haupttext folgt dem erhaltenen Hebräisch und gibt die Aufforderung wieder, sich Gott nicht zu widersetzen, sondern sich vor ihm zu demütigen.
  alternative: „Widersprich der Wahrheit nicht, und schäme dich deiner Unbildung.“
  rationale: Da für diese Stelle ein hebräischer Zeuge vorliegt, ist er die Grundlage des Haupttextes. Die griechische Fassung bietet eine erheblich andere Lesart, die nicht stillschweigend eingearbeitet, sondern in einer Fußnote vollständig dokumentiert wird.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe antithetische Struktur des Hebräischen bleibt erhalten; die wiederholte Nennung Gottes wird bewusst nicht durch ein Pronomen ersetzt.
