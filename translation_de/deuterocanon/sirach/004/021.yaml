base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/004/021.yaml
  text: For there is a shame that bears iniquity[b][a], and there is a shame that is glory and favor.
translation:
  language: de
  text: Denn es gibt eine Scham, die Schuld mit sich bringt,[a] und es gibt eine Scham, die Ehre und Gunst bedeutet.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: „die Schuld trägt“; nach dem Griechischen: „die zur Sünde führt“. Die hebräische Wendung ist knapp und mehrdeutig.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „Herrlichkeit und Gnade“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֹּשֶׁת
  choice: Scham
  rationale: „Scham“ bewahrt das moralische und soziale Gewicht des hebräischen Wortes und kann, wie im Ausgangstext, sowohl negativ als auch positiv bestimmt werden.
- source_word: מַשְׂאֵת עָוֹן
  choice: die Schuld mit sich bringt
  rationale: Die knappe und schwierige hebräische Wendung verbindet das Tragen beziehungsweise Herbeiführen mit Schuld. Die Formulierung gibt den resultativen Sinn natürlich wieder, ohne die im Hebräischen vorhandene Mehrdeutigkeit in der Fußnote zu verdecken.
- source_word: עָוֹן
  choice: Schuld
  rationale: עָוֹן kann Vergehen, Sünde oder daraus erwachsende Schuld bezeichnen. „Schuld“ passt hier zum moralischen Ergebnis dieser Art von Scham.
- source_word: כָּבוֹד
  choice: Ehre
  rationale: „Ehre“ trifft den sozialen und positiven Gegenpol zur schuldbringenden Scham im heutigen Deutsch natürlicher als „Herrlichkeit“.
- source_word: חֵן
  choice: Gunst
  rationale: „Gunst“ gibt חֵן als Wohlwollen und Anerkennung wieder, ohne unnötig einen späteren theologischen Fachsinn von „Gnade“ einzutragen.
theological_decisions:
- issue: Deutung der schwierigen Wendung מַשְׂאֵת עָוֹן
  choice: Eine Art von Scham bringt Schuld mit sich.
  alternative: 'Eine Art von Scham führt zur Sünde; oder: Eine Art von Scham trägt Schuld.'
  rationale: Der hebräische Ausdruck ist verdichtet und lässt sowohl das Tragen von Schuld als auch ein schuldhaftes Ergebnis anklingen. Die griechische Parallele stützt ausdrücklich den Sinn „zur Sünde führen“. Der Haupttext bleibt beim hebräischen Zeugnis, während die Fußnote die echte Auslegungsbreite offenhält.
- issue: Positive Bewertung der zweiten Art von Scham
  choice: Sie bedeutet Ehre und Gunst.
  alternative: Sie ist Herrlichkeit und Gnade.
  rationale: Die nominale hebräische Aussage wird im Deutschen mit „bedeutet“ verständlich wiedergegeben. Sie bezeichnet eine sittlich angemessene Scham als ehrenvoll und anerkennenswert, ohne sie konfessionell weiter auszudeuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der parallele Satzbau des Hebräischen bleibt erhalten; „bedeutet“ macht den verblosen zweiten Teilsatz idiomatisch verständlich.
