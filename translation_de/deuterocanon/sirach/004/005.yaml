  to: Wer mit bitterem Geist und im Schmerz seiner Seele schreit, dessen Fels wird seinen Hilferuf hören.[a]
  rationale: Die Revision glättet ausschließlich die deutsche Syntax und die Rektion von „hören“. Die generische Relativkonstruktion gibt das hebräische Partizip צוֹעֵק natürlich wieder. „Mit bitterem Geist“, „im Schmerz seiner Seele“, „dessen Fels“ und „Hilferuf hören“ bewahren die Bildsprache, die personale Zuordnung und die Zurückhaltung des hebräischen Wortlauts. Die abweichende griechische Überlieferung bleibt in der Fußnote.
