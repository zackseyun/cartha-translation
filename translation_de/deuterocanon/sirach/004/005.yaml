  source_fidelity: 'Der Entwurf folgt dem hebräischen Text inhaltlich zuverlässig: die schreiende bzw. hilferufende Person, ihr bitterer Geist, der Schmerz ihrer נפש und ihr „Fels“, der ihren Ruf hört, bleiben erhalten. Die griechische, erheblich abweichende Parallelfassung wird zutreffend ausschließlich in der Fußnote dokumentiert.'
  naturalness: „Einer schreit, bitter im Geist“ wirkt im modernen Standarddeutsch syntaktisch abgebrochen und „bitter im Geist“ ist unnötig unidiomatisch. Eine Relativkonstruktion macht die im Hebräischen partizipiale Personenbezeichnung natürlich lesbar, ohne den Sinn zu verändern. „Seinen Hilferuf hören“ ist idiomatischer und näher an שמע als „auf seinen Hilferuf hören“, das eher ein erhörendes Reagieren ausdrücken kann.
  terminology: „Seele“ ist als Wiedergabe von נפש im vorliegenden Kontext vertretbar; „Fels“ bewahrt die Gottesmetapher צוּרוֹ. Die Fußnote gibt die griechische Lesart sachlich wieder und vermeidet eine Harmonisierung.
