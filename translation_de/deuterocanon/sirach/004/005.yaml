    rationale: „Einer schreit, bitter im Geist und im Schmerz seiner Seele“ ist als isolierter Vers im Deutschen schwer verständlich. Das Hebräische kann die partizipiale Konstruktion tragen, während Deutsch eine explizitere Satzverknüpfung benötigt.
