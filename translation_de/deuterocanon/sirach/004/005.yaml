  text: One crying out in bitter spirit and in the pain of his soul[a], and at the sound of his cry, his Rock will hear.
translation:
  language: de
  text: Wer mit bitterem Geist und im Schmerz seiner Seele schreit, dessen Fels wird seinen Hilferuf hören.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Parallelüberlieferung lautet: „Wende dein Auge nicht von einem Bittenden ab, und gib keinem Menschen Anlass, dich zu verfluchen.“ Der hebräische Text betont stattdessen, dass der Fels des Leidenden dessen Hilferuf hören wird.'
    reason: alternative_reading
lexical_decisions:
- source_word: צוֹעֵק
  choice: Einer schreit
  rationale: Das hebräische Partizip bezeichnet einen Menschen, der gerade schreit oder fortgesetzt um Hilfe ruft. Die knappe substantivische Wiedergabe bewahrt die Unmittelbarkeit des Hebräischen.
- source_word: מַר רוּחַ
  choice: bitter im Geist
  rationale: Die nahezu wörtliche Wiedergabe erhält das Bild innerer Bitterkeit und legt nicht genauer fest, ob Trauer, Verzweiflung oder Verbitterung gemeint ist.
- source_word: בִּכְאֵב נַפְשׁוֹ
  choice: im Schmerz seiner Seele
  rationale: נפש bezeichnet hier den inneren Menschen beziehungsweise das eigene Leben. „Seele“ bewahrt die Tiefe des persönlichen Leids, ohne eine bestimmte anthropologische Lehrvorstellung festzuschreiben.
- source_word: וּבְקוֹל צַעֲקָתוֹ
  choice: auf seinen Hilferuf
  rationale: Wörtlich steht „bei/auf die Stimme seines Schreiens“. „Auf seinen Hilferuf“ gibt das akustische Bild und den Sinn des verzweifelten Rufens in natürlichem Deutsch wieder.
- source_word: צוּרוֹ
  choice: sein Fels
  rationale: Der hebräische Gottesname beziehungsweise das Gottesbild „sein Fels“ bleibt erhalten, statt zu „Gott“, „Schöpfer“ oder „Beschützer“ eingeebnet zu werden.
- source_word: יִשְׁמַע
  choice: wird … hören
  rationale: 'Die Zukunftsform bringt in diesem warnenden Zusammenhang die Folge zum Ausdruck: Der Fels des Leidenden wird dessen Ruf hören.'
theological_decisions:
- issue: Verhältnis des hebräischen Zeugnisses zur griechischen Parallelüberlieferung
  choice: Der Haupttext folgt dem hebräischen Wortlaut ohne ein zusätzliches Verbot am Versanfang; die deutlich abweichende griechische Fassung wird in einer Fußnote dokumentiert.
  alternative: „Wende deine Augen nicht von einem Bittenden ab, und gib keinem Menschen Anlass, dich zu verfluchen.“
  rationale: Der vorgelegte hebräische Text enthält weder den griechischen Imperativ noch dessen Aussage über einen Fluch. Ihre Aufnahme in den Haupttext würde den primären hebräischen Wortlaut ergänzen und die echte Textdifferenz verdecken.
- issue: Bedeutung von נפש
  choice: Seele
  alternative: Selbst; Leben; Inneres
  rationale: Im Zusammenhang mit bitterem Geist und Schmerz bezeichnet נפש das tief betroffene persönliche Innere. „Seele“ wahrt diese Bedeutungsweite, ohne eine spätere dogmatische Zweiteilung des Menschen vorauszusetzen.
- issue: Gottesbezeichnung צוּרוֹ
  choice: sein Fels
  alternative: sein Schöpfer; sein Beschützer; Gott
  rationale: Die konkrete Metapher des hebräischen Textes besitzt eigenes theologisches Gewicht und soll nicht durch eine erklärende Gottesbezeichnung ersetzt werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst knapper Satzgestalt. Die ungewohnte Formulierung „bitter im Geist“ und das Gottesbild „sein Fels“ bewahren die Bildsprache und Mehrdeutigkeit des Hebräischen; die abweichende griechische Überlieferung wird nicht in den Haupttext eingearbeitet.
