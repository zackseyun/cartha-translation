    rationale: Das hebräische שמע mit „Stimme seines Schreiens“ bezeichnet zunächst das Hören des Rufs. Die direkte Verbindung „seinen Hilferuf hören“ wahrt dies präziser; „auf ... hören“ kann stärker das Befolgen oder Erhören nahelegen.
