  text: Whoever listens to me will judge truly[b][a], and whoever gives ear to me will dwell securely in my inner chambers.
translation:
  language: de
  text: Wer auf mich hört, wird ein wahres Urteil fällen,[a] und wer mir aufmerksam zuhört, wird sicher in meinen inneren Gemächern wohnen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Paralleltext lautet: „Wer ihr gehorcht, wird Völker richten.“ Der hebräische Text bietet dagegen „wird ein wahres Urteil fällen“; der Haupttext folgt hier dem Hebräischen.'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlich spricht das Hebräische von den „inneren Gemächern“ der Weisheit und führt so ihre Darstellung als Frau mit einem eigenen Haus weiter. Die hebräische Schlusswendung ist schwierig; der griechische Paralleltext lautet: „Wer sich ihr nähert, wird zuversichtlich sein Lager aufschlagen.“'
    reason: textual_and_cultural_note
lexical_decisions:
- source_word: שׁוֹמֵעַ לִי
  choice: Wer auf mich hört
  rationale: שמע kann Hören, aufmerksames Zuhören und Gehorchen bezeichnen. „Auf mich hört“ bewahrt das Hörbild und lässt die praktische Folgsamkeit mitschwingen.
- source_word: יִשׁפֹּט אֱמֶת
  choice: wird wahrhaftig urteilen
  rationale: Wörtlich steht „wird Wahrheit urteilen“. „Wahrhaftig urteilen“ gibt die wahrscheinlich adverbiale Funktion von אֱמֶת wieder, ohne das abweichende griechische Objekt „Völker“ einzutragen.
- source_word: וּמַאֲזִין לִי
  choice: und wer mir aufmerksam zuhört
  rationale: מאזין hebt die aufmerksame Hinwendung des Hörenden hervor. Die Formulierung wahrt den Parallelismus, ohne beide hebräischen Ausdrücke völlig gleich wiederzugeben.
- source_word: יִיחַן
  choice: wird … wohnen
  rationale: Das schwierige Verb bezeichnet hier wahrscheinlich Lagern, Herbergen oder Wohnen; das griechische κατασκηνώσει stützt dieses Verständnis. „Wohnen“ klingt im Deutschen natürlich und bewahrt das Aufenthaltsbild.
- source_word: בַּחֲדָרַי
  choice: in meinen inneren Gemächern
  rationale: חדר bezeichnet einen Innenraum oder ein Gemach. Die possessive Wendung führt die Personifikation der Weisheit als Frau mit eigenem Hausraum fort.
- source_word: מִבָּיִת
  choice: sicher
  rationale: Die hebräische Schlusswendung ist syntaktisch und textlich schwierig. Das griechische πεποιθώς („zuversichtlich, sicher“) stützt die Deutung als sicheres Wohnen; die Fußnote macht die Unsicherheit und die erhebliche Abweichung transparent.
theological_decisions:
- issue: Abweichung zwischen hebräischem und griechischem Text im ersten Halbvers
  choice: Im Haupttext dem Hebräischen „wird wahrhaftig urteilen“ folgen
  alternative: 'Nach dem Griechischen: „wird Völker richten“'
  rationale: Der erhaltene hebräische Text ist hier die primäre Grundlage. Die deutlich andere griechische Lesart wird nicht stillschweigend in den Haupttext übernommen, sondern in der Fußnote dokumentiert.
- issue: Schwierige Schlusswendung מִבָּיִת
  choice: Als sicheres Wohnen in den inneren Gemächern wiedergeben
  alternative: 'Wörtlicher, aber dunkel: „wird in meinen Gemächern von/aus einem Haus wohnen“; stärker griechisch: „wird zuversichtlich sein Lager aufschlagen“'
  rationale: Die hebräische Syntax ist auffällig und die Überlieferung als leicht abweichend gekennzeichnet. Die griechische Parallele erhellt wahrscheinlich den Gesamtsinn, während die Fußnote die textliche Spannung offenlegt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Wahrhaftig urteilen“ bewahrt die ungewöhnliche Verbindung von Urteil und Wahrheit; „innere Gemächer“ erhält das häusliche Bild der personifizierten Weisheit. Die Fußnoten trennen die erheblich abweichende griechische Überlieferung klar vom hebräischen Haupttext.
