base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/004/003.yaml
  text: Do not embitter the inward parts of the poor[a], and do not cause pain to the heart of the needy.
translation:
  language: de
  text: Mach das Innerste des Armen nicht bitter[a], und füge dem Herzen des Bedürftigen keinen Schmerz zu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die inneren Teile“; gemeint ist das innere Empfindungsleben. Die griechische Überlieferung hat hier „Herz“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּחְמִיר
  choice: Mach … nicht bitter
  rationale: Die kausative Bedeutung von חמר wird als „bitter machen“ wiedergegeben. So bleibt das konkrete hebräische Bild erhalten; gemeint ist, die innere Not des Armen nicht noch zu verschärfen.
- source_word: מְעֵי
  choice: das Innerste
  rationale: מְעֵי bezeichnet wörtlich die inneren Organe und bildlich den Sitz tiefer Empfindungen. „Das Innerste“ bewahrt das körperlich-emotionale Bild in natürlichem modernem Deutsch besser als das heute missverständliche „Eingeweide“.
- source_word: דָךְ
  choice: des Armen
  rationale: דָךְ kann einen niedergedrückten, schwachen oder armen Menschen bezeichnen. „Der Arme“ ist hier klar und entspricht dem sozialen Zusammenhang, ohne den Beiklang der Bedrängnis auszuschließen.
- source_word: קֶרֶב
  choice: dem Herzen
  rationale: קֶרֶב bedeutet eigentlich „Inneres“ oder „Mitte“, bezeichnet hier aber parallel zu מְעֵי das innere Empfindungsleben. „Herz“ ist dafür die natürliche deutsche Entsprechung.
- source_word: עָנִי
  choice: des Bedürftigen
  rationale: עָנִי kann „arm“, „bedrängt“ oder „demütig“ bedeuten. „Bedürftiger“ wahrt die soziale Verletzlichkeit und vermeidet eine mechanische Wiederholung von „Armer“.
- source_word: תַּכְאִיב
  choice: füge … keinen Schmerz zu
  rationale: Die Kausativform von כאב bedeutet, Schmerzen zu verursachen. Die Formulierung gibt diese konkrete Aussage würdig und verständlich wieder.
theological_decisions:
- issue: 'Hebräische Anthropologie: zwei unterschiedliche Ausdrücke für das innere Empfindungsleben'
  choice: Im ersten Halbvers „das Innerste“, im zweiten „das Herz“
  alternative: Beide Ausdrücke einheitlich mit „Herz“ oder „Inneres“ wiedergeben
  rationale: מְעֵי und קֶרֶב sind verwandt, aber nicht identisch. Die unterschiedliche Wiedergabe erhält die poetische Abstufung und den Vorrang des hebräischen Zeugnisses. Das griechische Parallelzeugnis bestätigt, dass das innere Gefühlsleben gemeint ist, rechtfertigt aber keine vollständige Einebnung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Parallelismus und das konkrete hebräische Innenbild bleiben erhalten; archaische oder anatomisch missverständliche Wendungen werden vermieden.
