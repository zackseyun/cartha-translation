base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/004/020.yaml
  text: My son[a], keep the proper time and beware of evil[c][b], and do not be ashamed for your own soul.
translation:
  language: de
  text: Mein Sohn, achte auf den rechten Zeitpunkt[a] und hüte dich vor dem Bösen[b]; schäme dich nicht deiner selbst.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hebräische Wortlaut ist hier schwierig: Neben „Zeit“ steht הָמוֹן, gewöhnlich etwa „Menge“, „Reichtum“ oder „Getümmel“. Die griechische Überlieferung hat lediglich „beachte den Zeitpunkt“. Der daraus erschlossene Sinn eines passenden oder rechten Zeitpunkts liegt der Übersetzung zugrunde.'
    reason: textual_variant
  - marker: b
    text: 'Wörtlicher nach dem überlieferten Hebräisch möglicherweise: „Fürchte dich vor dem Bösen.“ Die griechische Überlieferung hat: „Hüte dich vor dem Bösen.“'
    reason: lexical_alternative
  - marker: c
    text: 'Auch möglich: „Schäme dich nicht wegen deiner Seele“ oder „wegen deines Lebens“. Hebräisch נֶפֶשׁ und griechisch ψυχή können je nach Zusammenhang „Seele“, „Selbst“ oder „Leben“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנִי
  choice: Mein Sohn
  rationale: Die direkte Anrede mit maskulinem Singularsuffix wird formnah wiedergegeben und entspricht dem Rahmen einer väterlichen Weisheitsunterweisung.
- source_word: עֵת הָמוֹן שְׁמֹר
  choice: achte auf den rechten Zeitpunkt
  rationale: עֵת bezeichnet Zeit oder Zeitpunkt; das griechische καιρόν stützt hier den passenden oder rechten Zeitpunkt. Das überlieferte הָמוֹן ist semantisch schwierig und erhält keine eindeutige Entsprechung im Griechischen; diese Unsicherheit wird in einer Fußnote offengelegt.
- source_word: וּפְחַד מִרָע
  choice: und hüte dich vor dem Bösen
  rationale: Die hebräische Formulierung lässt wörtlich an „fürchte dich vor Bösem“ denken; das griechische φύλαξαι ἀπὸ πονηροῦ stützt jedoch die idiomatische Warnung, sich vor dem Bösen zu hüten.
- source_word: וְאֶל נַפְשְׁךָ אַל תֵּבוֹשׁ
  choice: schäme dich nicht um deiner selbst willen
  rationale: נפשך kann „deine Seele“, „dich selbst“ oder „dein Leben“ bedeuten. Die reflexive Wiedergabe ergibt im Deutschen eine natürliche Mahnung, ohne „Seele“ als technische anthropologische Kategorie festzulegen.
theological_decisions:
- issue: Anthropologische Bedeutungsbreite von נֶפֶשׁ / ψυχή
  choice: um deiner selbst willen
  alternative: wegen deiner Seele; um deines Lebens willen
  rationale: Die Wendung bewahrt den Bezug auf die eigene Person, ohne die mehrdeutigen Begriffe נֶפֶשׁ und ψυχή vorschnell auf eine vom Körper getrennte Seele festzulegen. Die anderen möglichen Bedeutungen werden in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Achte auf“ ist bei einem Zeitpunkt natürlicher als das formale „bewahre“; „hüte dich“ wahrt den mahnenden Ton. Die textkritische Schwierigkeit und die Bedeutungsbreite von נֶפֶשׁ werden nicht im Haupttext überladen, sondern transparent in den Fußnoten erhalten.
