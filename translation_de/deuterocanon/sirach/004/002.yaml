translation:
  language: de
  text: Lass einen Menschen in Not nicht verzweifeln[a], und sieh nicht über einen hinweg, der innerlich zerschlagen ist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Parallele lautet: „Betrübe keinen hungernden Menschen, und reize keinen Mann in seiner Bedrängnis.“ Der hebräische Text ist weiter gefasst („Mensch in Not“ / „innerlich zerschlagen“); deshalb folgt der Haupttext dem Hebräischen, während die griechische Nuance hier festgehalten wird.'
    reason: alternative_reading
lexical_decisions:
- source_word: דֹּוֶוה נֶפֶשׁ חֲסֵרָה
  choice: einen Menschen in Not
  rationale: Die Wendung verbindet Leiden oder Schwäche (דֹּוֶוה) mit Mangel und Bedürftigkeit (חֲסֵרָה). „Einen Menschen in Not“ gibt den umfassenden Sinn des hebräischen נֶפֶשׁ als Person natürlich wieder, ohne die Not auf Hunger oder rein seelischen Kummer einzuengen.
- source_word: אַל תָּפוּחַ
  choice: lass nicht verzweifeln
  rationale: Die schwierige Verbform warnt im Zusammenhang davor, die innere Not eines bereits Bedürftigen zu verschärfen. Die griechische Parallele λυπήσῃς („betrüben“) stützt diese Richtung; „verzweifeln lassen“ bewahrt die starke Wirkung, ohne eine bloß körperliche Bedeutung vorauszusetzen.
- source_word: וְאַל תִּתְעַלֵּם
  choice: und sieh nicht über ... hinweg
  rationale: Der Hitpael von עלם kann bedeuten, sich zu verbergen oder so zu tun, als bemerke man jemanden nicht. Die deutsche Wendung gibt dieses absichtliche Nichtbeachten idiomatisch und würdevoll wieder.
- source_word: מִמְּדֻכְדַּךְ נָפֶשׁ
  choice: einen, der innerlich zerschlagen ist
  rationale: מְדֻכְדַּךְ bezeichnet einen niedergedrückten, zerschlagenen oder tief entmutigten Menschen. „Innerlich zerschlagen“ erhält die Bildkraft und gibt נָפֶשׁ hier als Bezeichnung des inneren Lebens wieder.
