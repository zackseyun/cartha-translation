translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. נֶפֶשׁ wird in beiden Halbversen kontextbezogen wiedergegeben, um unnatürliche Wiederholungen von „Seele“ zu vermeiden, ohne die innere Dimension des zweiten Ausdrucks einzuebnen.
