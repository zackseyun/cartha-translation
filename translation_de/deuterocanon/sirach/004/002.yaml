  source_fidelity: Der deutsche Haupttext gibt die beiden hebräischen Aussagen sinngemäß und ohne unangemessene Einengung wieder. „Mensch in Not“ trägt die Verbindung von Leiden/Schwäche und Mangel in נֶפֶשׁ חֲסֵרָה gut. „Nicht verzweifeln lassen“ ist bei dem schwierigen אַל תָּפוּחַ eine vertretbare, kontextuell gestützte Wiedergabe und steht nicht im Widerspruch zur griechischen Parallele mit „betrüben“. Die zweite Zeile bewahrt das Motiv des absichtlichen Wegsehens bzw. Sich-Entziehens gegenüber einem niedergedrückten Menschen.
  naturalness: Modernes Standarddeutsch, klar und würdig formuliert. „Sieh nicht über einen hinweg“ ist idiomatisch; die Umschreibung „der innerlich zerschlagen ist“ vermittelt die Bildkraft von מְדֻכְדַּךְ natürlich.
  terminology: Die kontextbezogene Wiedergabe von נֶפֶשׁ als „Mensch“ und die zweite Umschreibung mit innerer Dimension sind angemessen und vermeiden ein im Deutschen hier missverständliches oder steifes „Seele“. Es werden keine konfessionell geprägten Begriffe eingeführt.
