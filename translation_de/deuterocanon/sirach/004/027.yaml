translation:
  language: de
  text: Erniedrige dich nicht vor einem Toren[a], und sei vor Herrschern nicht parteiisch[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „Breite deine Seele/dein Selbst nicht vor einem Toren aus.“ Die griechische Parallele verdeutlicht das Bild als Selbsterniedrigung vor einem törichten Menschen.'
    reason: lexical_alternative
  - marker: b
    text: 'Der hebräische Wortlaut des zweiten Halbverses ist für sich genommen nicht eindeutig und könnte auch im Sinn von „Vertraue nicht vor Herrschern“ verstanden werden. Die griechische Parallele lautet dagegen sinngemäß: „Nimm das Angesicht eines Machthabers nicht an“, und stützt damit die Bedeutung „sei nicht parteiisch“.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תַּצַּע ... נַפְשֶׁךָ
  choice: Erniedrige dich nicht
  rationale: יצע bezeichnet wörtlich das Ausbreiten oder Hinlegen; נפש meint hier die eigene Person. Das griechische ὑποστρώσῃς σεαυτόν bestätigt das Bild, sich einem anderen gleichsam als Unterlage hinzugeben. „Erniedrige dich nicht“ gibt den übertragenen Sinn in natürlichem Deutsch wieder.
- source_word: לְנָבָל
  choice: vor einem Toren
  rationale: נבל bezeichnet einen Toren im moralischen Sinn, nicht lediglich einen intellektuell unbegabten Menschen. „Vor“ entspricht der sozialen Haltung, die das Verbgefüge ausdrückt.
- source_word: וְאַל תַּאֲמֵן
  choice: und sei ... nicht parteiisch
  rationale: Die hebräische Form kann für sich genommen mit „vertraue nicht“ verbunden werden und ist daher nicht eindeutig. Die griechische Parallele μὴ λάβῃς πρόσωπον („nimm nicht das Angesicht an“) stützt jedoch die Bedeutung, jemanden parteiisch zu begünstigen.
- source_word: לִפְּנֵי מוֹשְׁלִים
  choice: vor Herrschern
  rationale: מושלים sind Menschen, die Herrschaft oder Autorität ausüben. „Herrscher“ ist direkt und allgemein verständlich; „vor“ wahrt die im Hebräischen bezeichnete Gegenwart beziehungsweise soziale Stellung.
theological_decisions:
- issue: Deutung des zweiten Halbverses angesichts der nicht völlig transparenten hebräischen Form תַּאֲמֵן
  choice: Warnung vor Parteilichkeit in Gegenwart von Herrschern
  alternative: „Vertraue nicht vor Herrschern“ oder „Füge dich nicht den Herrschern“
  rationale: Der hebräische Text bleibt vorrangig, doch die griechische Parallele spricht deutlich für die geläufige Wendung des Ansehens beziehungsweise Begünstigens einer Person. Die Fußnote macht die verbleibende Mehrdeutigkeit sichtbar, statt sie zu verschweigen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Tor“ bewahrt den moralischen Gehalt von נבל; „parteiisch“ ist allgemein verständlich und vermeidet eine konfessionelle oder lehrhafte Festlegung. Die echte Unsicherheit im zweiten Halbvers wird ausdrücklich in der Fußnote benannt.
