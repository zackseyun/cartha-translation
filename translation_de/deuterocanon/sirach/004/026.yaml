translation:
  language: de
  text: Schäme dich nicht, vom Unrecht umzukehren, und stell dich nicht vor eine Strömung.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Griechisch: „Schäme dich nicht, deine Sünden zu bekennen, und versuche nicht, die Strömung eines Flusses zu bezwingen.“ Der griechische Text spricht im ersten Satzteil vom Bekennen der Sünden und nennt im zweiten ausdrücklich einen Fluss; das Hebräische spricht vom Umkehren vom Unrecht und von einer „Strömung“.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תֵּבוֹשׁ
  choice: Schäme dich nicht
  rationale: Das Verb בוש bezeichnet Scham oder Beschämung; die direkte deutsche Wendung ist natürlich und entspricht auch dem griechischen Paralleltext.
- source_word: לָשׁוּב
  choice: umzukehren
  rationale: שוב bedeutet wörtlich zurückkehren oder umkehren. Im Zusammenhang mit Unrecht ist moralische Umkehr gemeint, ohne dass ein technischer Bußbegriff eingesetzt werden muss.
- source_word: מֵעָוֹן
  choice: vom Unrecht
  rationale: עָוֹן kann Unrecht, Schuld oder sündhaftes Handeln bezeichnen. „Unrecht“ bewahrt den moralischen Sinn und passt idiomatisch zu „umkehren“.
- source_word: וְאַל תַּעֲמוֹד לִפְנֵי
  choice: und stell dich nicht … entgegen
  rationale: Wörtlich steht hier „und steh nicht vor“. Die idiomatische Wiedergabe „sich entgegenstellen“ erhält das Bild einer gefährlichen Konfrontation und klingt im Deutschen natürlich.
- source_word: שִׁבֹּלֶת
  choice: der Strömung eines Flusses
  rationale: שִׁבֹּלֶת kann hier eine Strömung oder Flut bezeichnen. Der griechische Paralleltext ῥοῦν ποταμοῦ bestätigt ausdrücklich das Bild einer Flussströmung; „eines Flusses“ dient daher als quellengestützte Verdeutlichung.
theological_decisions:
- issue: Ob שוב ausdrücklich als religiöser Bußbegriff wiederzugeben ist
  choice: vom Unrecht umzukehren
  alternative: seine Sünden zu bereuen / Buße zu tun
  rationale: Der hebräische Text beschreibt eine Abkehr vom Unrecht, während der griechische Paralleltext vom Bekennen der Sünden spricht. Die Übersetzung folgt dem Hebräischen und wahrt die Spannung, statt sie in eine festgelegte Bußformel aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Formulierung ist knapp und bildhaft; „sich der Strömung entgegenstellen“ gibt die hebräische Konstruktion verständlich wieder, ohne die Warnung unnötig auszudeuten.
