  verdict: revise
  source_fidelity: Der erste Satzteil gibt den hebräischen Text treffend wieder. Im zweiten Satzteil ist „sich ... entgegenstellen“ als idiomatische Auslegung von „nicht vor einer Strömung stehen“ vertretbar, verschiebt den Ausdruck aber stärker in Richtung des griechischen „nicht mit Gewalt gegen den Flussstrom angehen“. Außerdem ist „eines Flusses“ im erhaltenen Hebräisch nicht ausdrücklich vorhanden; es sollte daher nicht im Haupttext ergänzt werden.
  naturalness: „Schäme dich nicht, vom Unrecht umzukehren“ ist würdevoll und verständlich. „Stell dich nicht vor eine Strömung“ ist ein natürliches, knappes Bild und bleibt näher an der hebräischen Formulierung als „stell dich ... entgegen“.
  terminology: „Unrecht“ ist für עָוֹן hier angemessen und vermeidet eine unnötig technische Bußterminologie. „Strömung“ ist für שִׁבֹּלֶת im Licht des griechischen Paralleltextes plausibel. Die Fußnote muss die griechische Abweichung präzise benennen, ohne den Zusatz „Fluss“ als Bestandteil des hebräischen Wortlauts erscheinen zu lassen.
  issues:
  - severity: medium
    issue: Der Haupttext ergänzt „eines Flusses“.
    rationale: Das Hebräische hat nur שִׁבֹּלֶת, hier wahrscheinlich „Strömung“ bzw. „Strom“, aber kein ausdrückliches Wort für „Fluss“. Der griechische Paralleltext enthält zwar „eines Flusses“, doch dieser Zusatz gehört besser in die Anmerkung.
  - severity: low
    issue: „Stell dich ... entgegen“ ist stärker deutend als der hebräische Ausdruck.
    rationale: אַל תַּעֲמוֹד לִפְנֵי lautet wörtlich „steh/stell dich nicht vor“. Die vorliegende Wendung ist verständlich, orientiert sich jedoch stärker an der griechischen Vorstellung eines gewaltsamen Widerstands.
  - severity: low
    issue: Die Fußnote bezeichnet den Unterschied im zweiten Satzteil nur als „leicht“.
    rationale: Der griechische Text nennt ausdrücklich einen Fluss und verwendet ein Verb für gewaltsames Vorgehen; die Fußnote sollte diese Unterschiede konkret, aber knapp beschreiben.
