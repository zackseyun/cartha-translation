translation:
  language: de
  text: Neige dein Ohr dem Armen zu[a] und antworte ihm friedlich und demütig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Parallelüberlieferung lautet: „Mach dich bei der Versammlung beliebt und neige dein Haupt tief vor einem Mächtigen.“ Sie bietet hier eine wesentlich andere Textgestalt als der erhaltene hebräische Text.'
    reason: alternative_reading
lexical_decisions:
- source_word: הַט ... אָזְנֶךָ
  choice: Neige dein Ohr ... zu
  rationale: Die hebräische Aufforderung und das anschauliche Körperbild bleiben erhalten; die Wendung ist im Deutschen verständlich und drückt aufmerksames Zuhören aus.
- source_word: לֶעָנִי
  choice: dem Armen
  rationale: עָנִי kann einen armen, bedrängten oder gesellschaftlich schwachen Menschen bezeichnen. „Dem Armen“ ist hier die direkte und kontextgerechte Wiedergabe.
- source_word: וַהֲשִׁיבֵהוּ
  choice: und antworte ihm
  rationale: Im Zusammenhang mit dem Hinhören bezeichnet die Hifil-Form von שוב das Antworten oder Erwideren.
- source_word: שָׁלוֹם
  choice: friedlich
  rationale: שָׁלוֹם wird hier adverbial verstanden. „Friedlich“ bewahrt den Bezug zu Frieden und gibt die Art der Antwort in natürlichem Deutsch wieder.
- source_word: בַּעֲנָוָה
  choice: in Demut
  rationale: עֲנָוָה bezeichnet Demut oder Sanftmut. „In Demut“ erhält die ethische Haltung ausdrücklich und vermeidet eine Verengung auf bloße Freundlichkeit.
theological_decisions:
- issue: Vorrang des erhaltenen hebräischen Textes gegenüber der stark abweichenden griechischen Parallelüberlieferung
  choice: Der Haupttext folgt unmittelbar dem erhaltenen Hebräisch; die griechische Fassung wird in einer Fußnote dokumentiert.
  alternative: 'Griechisch: „Mach dich bei der Versammlung beliebt und neige dein Haupt vor einem Großen.“'
  rationale: Die griechische Parallelfassung bietet nicht nur eine geringfügige Wortvariante, sondern eine wesentlich andere Textgestalt. Da hier ein sicher bezeugter hebräischer Text vorliegt, bildet er die Grundlage; die Abweichung wird transparent festgehalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das Bild vom geneigten Ohr wird als gut verständliche biblische Ausdrucksweise bewahrt. Die beiden Bestimmungen „friedlich“ und „in Demut“ bleiben getrennt, damit weder שָׁלוֹם noch עֲנָוָה eingeebnet wird.
