  text: Do not withhold a word in the world, and do not hide your wisdom.
translation:
  language: de
  text: Halte ein Wort in der Welt nicht zurück[a], und verbirg deine Weisheit nicht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Parallele lautet: „Verhindere ein Wort zur Zeit der Rettung nicht“; „Rettung“ kann auch „Heil“ bedeuten. Der hebräische Text liest dagegen „in der Welt“.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תִּמְנַע
  choice: Halte … nicht zurück
  rationale: מנע bezeichnet das Vorenthalten oder Zurückhalten. Die Formulierung wahrt das Verbot und ist im Deutschen auch auf ein gesprochenes Wort anwendbar.
- source_word: דִּבֵּר
  choice: ein Wort
  rationale: Der hebräische Ausdruck verweist hier auf ein Wort beziehungsweise eine Äußerung; auch die griechische Parallele hat λόγον. Der Singular und die konkrete Ausdrucksweise bleiben erhalten.
- source_word: בָּעוֹלָם
  choice: in der Welt
  rationale: Der überlieferte hebräische Text lautet ungewöhnlich „in der Welt“. Die wörtliche Wiedergabe bewahrt diese Lesart, statt sie deutend zu „zur rechten Zeit“ oder „öffentlich“ zu glätten.
- source_word: וְאַל תַּצְפִּין
  choice: und verbirg … nicht
  rationale: צפן im Hifil bedeutet verbergen oder verborgen halten. „Verbirg“ ist gegenwärtiges, natürliches Deutsch und entspricht dem parallelen Verbot, etwas zurückzuhalten.
- source_word: אֶת חָכְמָתֶךָ
  choice: deine Weisheit
  rationale: חכמה wird in seinem üblichen Sinn als „Weisheit“ wiedergegeben; das Possessivverhältnis bleibt ausdrücklich erhalten.
theological_decisions:
- issue: Abweichung zwischen der hebräischen und der griechischen Lesart im ersten Halbvers
  choice: Im Haupttext der erhaltenen hebräischen Lesart „in der Welt“ folgen
  alternative: 'Nach der griechischen Parallele: „Halte ein Wort zur Zeit der Rettung nicht zurück“ beziehungsweise „Verhindere ein Wort zur Zeit des Heils nicht“'
  rationale: Wo ein zuverlässiger hebräischer Sirach-Text erhalten ist, bildet er die Hauptgrundlage. Da die griechische Parallele erheblich abweicht und für die Auslegung bedeutsam ist, wird sie in einer Fußnote dokumentiert, ohne die Spannung stillschweigend aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die etwas ungewohnte Wendung „ein Wort in der Welt“ ist bewusst beibehalten, weil sie die sicher bezeugte, aber von der griechischen Überlieferung abweichende hebräische Formulierung wiedergibt.
