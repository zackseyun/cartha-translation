base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/004/017.yaml
  text: And until his heart is filled with me[a], I will return and make him happy[b], and I will reveal my secrets to him.
translation:
  language: de
  text: Und bis sein Herz von mir erfüllt ist[a], werde ich zurückkehren und ihn glücklich machen[b]; ich werde ihm meine Geheimnisse offenbaren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Parallelüberlieferung lautet ausführlicher: Die Weisheit geht anfangs auf verschlungenen Wegen mit ihm, bringt Furcht und Ängstlichkeit über ihn und prüft ihn durch ihre Erziehung, bis sie seiner Seele vertraut; außerdem prüft sie ihn an ihren Satzungen.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „ihn segnen“ beziehungsweise „ihn glücklich preisen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַד עֵת
  choice: Und bis
  rationale: Die Wendung bezeichnet eine zeitliche Grenze. „Und bis“ bewahrt den Anschluss an den vorhergehenden Zusammenhang, ohne das im Deutschen entbehrliche Substantiv „Zeit“ eigens auszudrücken.
- source_word: יִמָּלֵא לִבּוֹ בִּי
  choice: sein Herz von mir erfüllt ist
  rationale: Die hebräische Bildsprache vom Herzen, das mit der personifizierten Weisheit erfüllt wird, bleibt erhalten. Eine Deutung als „mir vertraut“ würde sich stärker an der griechischen Parallele orientieren als am erhaltenen Hebräisch.
- source_word: אָשׁוּב
  choice: werde ich zurückkehren
  rationale: שׁוב bezeichnet gewöhnlich das Zurückkehren oder Sich-wieder-Zuwenden. Die Wiedergabe lässt offen, in welchem Sinn die Weisheit zuvor Abstand gehalten hat.
- source_word: אֲאַשְּׁרֶנּוֹ
  choice: ihn glücklich machen
  rationale: Die Verbform kann ausdrücken, dass jemand glücklich gemacht oder glücklich gepriesen wird. „Ihn glücklich machen“ ist verständlich und gibt hier die günstige Wendung wieder, ohne den Ausdruck vorschnell mit einem stärker geprägten Segensbegriff gleichzusetzen.
- source_word: וְגָלִיתִי לוֹ
  choice: ich werde ihm … offenbaren
  rationale: גלה bedeutet hier, Verborgenes aufzudecken oder zu enthüllen. „Offenbaren“ ist im würdigen modernen Deutsch natürlich und passt zum folgenden Gegenstand.
- source_word: מִסְתָּרִי
  choice: meine Geheimnisse
  rationale: Das Wort bezeichnet verborgene Dinge. Der Plural „Geheimnisse“ ist klarer und weniger fachsprachlich aufgeladen als „Mysterium“.
theological_decisions:
- issue: Verhältnis des erhaltenen hebräischen Wortlauts zur ausführlicheren griechischen Parallele mit Furcht, Prüfung und Vertrauen
  choice: Der hebräische Wortlaut steht im Haupttext; die abweichende und ausführlichere griechische Überlieferung wird in einer Fußnote dokumentiert.
  alternative: Den Haupttext nach dem Griechischen um Aussagen über anfängliche Bedrängnis, Furcht, Erziehung, Vertrauen und Prüfung zu erweitern.
  rationale: Wo für Jesus Sirach Hebräisch erhalten ist, hat dieses Zeugnis Vorrang. Die griechische Fassung erhellt den größeren Zusammenhang, enthält hier jedoch Material, das im vorliegenden hebräischen Wortlaut nicht steht und deshalb nicht stillschweigend in den Haupttext aufgenommen wird.
- issue: Bedeutung von אֲאַשְּׁרֶנּוֹ
  choice: ihn glücklich machen
  alternative: ihn segnen; ihn glücklich preisen
  rationale: Die gewählte Formulierung wahrt die konkrete günstige Wirkung der personifizierten Weisheit. Die möglichen Nuancen des Segnens oder Glücklichpreisens werden offengelegt, aber nicht dogmatisch festgelegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die personifizierte Weisheit spricht weiterhin in der ersten Person. Der Satzbau bleibt nahe am Hebräischen, wird aber durch Futurformen und ein Semikolon im Deutschen lesbar gegliedert.
