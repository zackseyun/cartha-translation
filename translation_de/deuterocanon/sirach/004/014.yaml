translation:
  language: de
  text: Die ihr dienen, dienen dem Heiligen[a], und Gott liebt die, die ihre Wohnstätte lieben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Griechisch: „und der Herr liebt die, die sie lieben“. Der hebräische Text scheint hier die schwierigere Lesart mit ihrer Wohnstätte oder Behausung zu bewahren.'
    reason: alternative_reading
lexical_decisions:
- source_word: מְשָׁרְתֵי / מְשָׁרְתֶיהָ
  choice: dienen / ihr dienen
  rationale: שרת bezeichnet besonders einen geordneten, oft heiligen oder amtlichen Dienst. Das natürliche deutsche Verb „dienen“ bewahrt hier sowohl den gehobenen Ton als auch die Wiederholung des hebräischen Wortstamms.
- source_word: קֹדֶשׁ
  choice: dem Heiligen
  rationale: Die knappe Wendung מְשָׁרְתֵי קֹדֶשׁ lässt den Bezug offen. „Dem Heiligen“ gibt den personal-sakralen Sinn idiomatisch wieder und wird durch das griechische ἁγίῳ gestützt, ohne die Formulierung ausdrücklich mit „Gott“ gleichzusetzen.
- source_word: וֵאלֹהִים
  choice: und Gott
  rationale: Der hebräische Hauptzeuge hat ausdrücklich אֱלֹהִים. Deshalb folgt die Übersetzung dem Hebräischen statt dem griechischen ὁ κύριος („der Herr“).
- source_word: בֵּית [מוֹשָׁבָהּ אָהֵב]
  choice: liebt alle, die ihre Wohnstätte lieben
  rationale: Die Überlieferung ist syntaktisch schwierig und teilweise editorisch eingeklammert, enthält aber erkennbar Sprache von Haus beziehungsweise Wohnstätte. Die Fassung bewahrt dieses schwierigere hebräische Element in verständlichem Deutsch; die glattere griechische Lesart wird in der Fußnote genannt.
- source_word: אָהֵב
  choice: liebt
  rationale: „Lieben“ ist die übliche und präzise Wiedergabe von אהב. Die Wiederholung im deutschen Satz erhält die rhetorische Entsprechung.
theological_decisions:
- issue: Bezeichnung des heiligen Gegenübers im ersten Satzteil
  choice: dem Heiligen
  alternative: dem Heiligtum / der Heiligkeit
  rationale: Das Hebräische ist knapp und kann formal auch unpersönlich verstanden werden. Der griechische Paralleltext stützt jedoch einen personalen beziehungsweise substantivierten Bezug. „Dem Heiligen“ wahrt die sakrale Aussage, ohne den komprimierten Text weiter auszudeuten.
- issue: Gottesbezeichnung im zweiten Satzteil
  choice: Gott
  alternative: der Herr
  rationale: Der hebräische Haupttext liest אֱלֹהִים („Gott“), während die griechische Überlieferung ὁ κύριος („der Herr“) bietet. Nach dem Vorrang des hebräischen Zeugen steht „Gott“ im Haupttext.
- issue: Gegenstand der göttlichen Liebe
  choice: alle, die ihre Wohnstätte lieben
  alternative: alle, die sie lieben
  rationale: Der hebräische Text scheint trotz seiner Unsicherheit die Wohnstätte einzubeziehen; der griechische Text hat die einfachere Aussage, dass der Herr diejenigen liebt, die die Weisheit lieben. Die Hauptfassung hält am schwierigeren hebräischen Zeugnis fest und dokumentiert die griechische Alternative.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallele Formulierung „ihr dienen, dienen dem Heiligen“ bildet die knappe Struktur und die Wiederholung des hebräischen Stammes nach. „Wohnstätte“ ist gehoben, aber allgemein verständlich und passt zur sakralen Personifikation der Weisheit.
