translation:
  language: de
  text: Die Weisheit hat ihre Kinder unterwiesen und legt Zeugnis ab für alle, die sie verstehen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Parallelfassung lautet: „Die Weisheit hat ihre Söhne erhöht und ergreift die, die sie suchen.“ Der erhaltene hebräische Text lautet dagegen: „Die Weisheit hat ihre Kinder unterwiesen und legt Zeugnis ab für alle, die sie verstehen.“'
    reason: alternative_reading
lexical_decisions:
- source_word: חָכְמוֹת
  choice: die Weisheit
  rationale: Die formal pluralische Form bezeichnet hier die als Frau personifizierte Weisheit. Auch die griechische Parallelfassung hat den Singular ἡ σοφία.
- source_word: לִמְּדָה
  choice: hat … unterwiesen
  rationale: Das Perfekt von למד bezeichnet das Lehren oder Unterweisen. Das deutsche Perfekt gibt die abgeschlossene Verbform wieder und bleibt zugleich für eine weisheitliche Aussage natürlich.
- source_word: בָנֶיהָ
  choice: ihre Kinder
  rationale: בנים kann sowohl „Söhne“ als auch allgemeiner „Kinder“ bezeichnen. Im Bild der personifizierten Weisheit sind ihre Anhänger gemeint; „Kinder“ vermeidet eine unbegründete Beschränkung auf Männer.
- source_word: וְתָעִיד
  choice: und legt Zeugnis ab
  rationale: Die Wiedergabe bewahrt die Aussagekraft von העיד „bezeugen, Zeugnis ablegen“. Die deutlich abweichende griechische Parallelfassung wird nicht in den hebräischen Haupttext eingetragen.
- source_word: לְכָל
  choice: für alle
  rationale: ל wird im Zusammenhang mit dem Zeugnis als „für“ verstanden und lässt den vermutlich günstigen Charakter des Zeugnisses erkennen, ohne ihn weiter auszudeuten.
- source_word: מְבִינִים בָּהּ
  choice: die in ihr Einsicht haben
  rationale: Die Formulierung wahrt sowohl den partizipialen Sinn von בין als auch die Präposition ב mit ihrem Bezug auf die personifizierte Weisheit. Sie lässt offen, ob die Einsicht als Verständnis der Weisheit oder als in ihr gegründete Einsicht zu verstehen ist.
theological_decisions:
- issue: Weibliche Personifikation der Weisheit
  choice: Weibliche Bezüge werden mit „ihre“ und „in ihr“ beibehalten.
  alternative: Die Weisheit als unpersönlichen Begriff behandeln.
  rationale: Das Hebräische stellt die Weisheit grammatisch und literarisch als weibliche Gestalt dar; die griechische Parallelfassung bestätigt diese Personifikation.
- issue: Abweichung der griechischen Parallelfassung
  choice: Der erhaltene hebräische Wortlaut bildet den Haupttext.
  alternative: 'Der griechischen Lesart folgen: Die Weisheit erhöht ihre Söhne und ergreift diejenigen, die sie suchen.'
  rationale: Wo der hebräische Sirachtext erhalten ist, besitzt er für diese Übersetzung Vorrang. Die erhebliche griechische Abweichung wird jedoch in einer Fußnote vollständig offengelegt.
- issue: Beziehung von מְבִינִים בָּהּ zur Weisheit
  choice: „die in ihr Einsicht haben“
  alternative: „die sie verstehen“ oder „die durch sie einsichtig sind“
  rationale: Die gewählte Fassung erhält die im Hebräischen mögliche Spannung zwischen dem Verstehen der Weisheit und einer in ihr bestehenden Einsicht, statt sie eindeutig aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Unterwiesen“ und „Zeugnis ablegen“ bewahren den weisheitlichen beziehungsweise rechtlich-zeugnishaften Ton, ohne altertümliche Satzformen zu verwenden.
