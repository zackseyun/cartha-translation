  text: Do not sit with an unjust judge[a], for with him judgment will be according to his pleasure.
translation:
  language: de
  text: Setz dich nicht zu einem ungerechten Richter[a]; denn wenn du mit ihm urteilst, geschieht es nach seinem Belieben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Text lautet hier wesentlich anders: „Kämpfe bis zum Tod für die Wahrheit, und Gott, der Herr, wird für dich kämpfen.“'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תֵּשֵׁב
  choice: Setz dich nicht
  rationale: Gibt das hebräische Bild unmittelbar und in natürlichem modernem Deutsch wieder; gemeint ist, sich einem solchen Richter nicht beizugesellen oder mit ihm zu beraten.
- source_word: שׁוֹפֵט עַוָּל
  choice: einem ungerechten Richter
  rationale: Der rechtliche Zusammenhang legt für שׁוֹפֵט „Richter“ und für עַוָּל „ungerecht“ nahe.
- source_word: כַאֲשֶׁר כִּרְצוֹנוֹ
  choice: wie es ihm gefällt
  rationale: Die Wendung bezeichnet ein Urteilen nach dem persönlichen Belieben des ungerechten Richters statt nach dem Recht.
- source_word: תִּשְׁפּוֹט עִמּוֹ
  choice: mit ihm wirst du urteilen
  rationale: Bewahrt Person, Verb und Präpositionalfügung des Hebräischen. Die Aussage warnt davor, dass die angesprochene Person beim gemeinsamen Urteilen seinem Willen folgen wird.
theological_decisions:
- issue: Starke Abweichung zwischen hebräischer und griechischer Überlieferung
  choice: Der erhaltene hebräische Text bildet den Haupttext.
  alternative: 'Griechisch: „Kämpfe bis zum Tod für die Wahrheit, und der Herr, Gott, wird für dich kämpfen.“'
  rationale: Wo ein belastbarer hebräischer Sirach-Text erhalten ist, wird er als primäre Grundlage übersetzt. Die griechische Fassung bietet hier keine bloße Übersetzungsvariante, sondern einen wesentlich anderen Text und wird deshalb vollständig in einer Fußnote dokumentiert.
- issue: Deutung der zweiten Person in תִּשְׁפּוֹט
  choice: „wirst du urteilen“
  alternative: 'Unpersönlich: „wird das Urteil ausfallen“'
  rationale: Die hebräische Verbform ist zweite Person Singular. Diese Spannung wird nicht durch eine unpersönliche Umschreibung beseitigt, sondern im Haupttext bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der knappe Mahnspruch und das konkrete Bild des gemeinsamen Sitzens und Urteilens bleiben erhalten; die stark abweichende griechische Überlieferung wird transparent in der Fußnote wiedergegeben.
