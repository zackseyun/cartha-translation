  text: And God will call you son[a], and he will show you favor and deliver you from the Pit.
translation:
  language: de
  text: Und Gott wird dich »Sohn« nennen[a], dir Gnade erweisen und dich aus der Grube retten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Griechisch: „Und du wirst wie ein Sohn des Höchsten sein, und er wird dich mehr lieben als deine Mutter.“ Der hebräische Text lautet dagegen: „Und Gott wird dich ‚Sohn‘ nennen, dir Gnade erweisen und dich aus der Grube retten.“'
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֵל
  choice: Und Gott
  rationale: אֵל ist hier am natürlichsten als die persönliche Gottesbezeichnung „Gott“ zu verstehen; der griechische Paralleltext spricht entsprechend vom Höchsten.
- source_word: יִקְרָאֲךָ בֵּן
  choice: wird dich »Sohn« nennen
  rationale: Die Formulierung gibt das artikellose Prädikatsnomen בֵּן genau wieder. Die Anführungszeichen machen im Deutschen deutlich, dass „Sohn“ die Bezeichnung ist, ohne das im Hebräischen nicht ausdrücklich vorhandene Possessivpronomen „seinen“ hinzuzufügen.
- source_word: וְיָחְנְךָ
  choice: dir Gnade erweisen
  rationale: חנן bezeichnet das gnädige Gewähren von Gunst. „Gnade erweisen“ bewahrt diese Nuance in würdigem, verständlichem Deutsch; „sich erbarmen“ würde den Akzent stärker auf Mitleid verschieben.
- source_word: וְיַצִּילְךָ
  choice: dich … retten
  rationale: נצל bedeutet aus einer Gefahr herausretten oder befreien. „Retten“ ist im heutigen Deutsch klar und verbindet sich natürlich mit „aus der Grube“.
- source_word: מִשָׁחַת
  choice: aus der Grube
  rationale: שַׁחַת kann eine Grube, das Grab oder das Verderben bezeichnen. „Grube“ erhält das konkrete Bild und lässt dessen möglichen Bezug auf Tod oder Totenreich offen, statt die Mehrdeutigkeit aufzulösen.
theological_decisions:
- issue: Göttliche Sohnesbezeichnung für den Angesprochenen
  choice: Gott wird dich »Sohn« nennen
  alternative: du wirst wie ein Sohn des Höchsten sein
  rationale: 'Der hebräische Zeuge formuliert unmittelbar, dass Gott den Angesprochenen „Sohn“ nennen wird. Der griechische Paralleltext hat dagegen einen Vergleich: „wie ein Sohn des Höchsten“. Der Haupttext folgt dem vorhandenen Hebräisch; die abweichende griechische Lesart bleibt in der Fußnote sichtbar, ohne die starke Aussage des hebräischen Textes durch spätere dogmatische Kategorien näher zu bestimmen.'
- issue: Bedeutung der Grube
  choice: aus der Grube retten
  alternative: vor dem Verderben retten / aus dem Grab retten
  rationale: Das hebräische שַׁחַת lässt sowohl ein konkretes Grubenbild als auch Tod, Grab oder Verderben anklingen. „Grube“ wahrt diese theologische und poetische Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Satzstruktur des Hebräischen bleibt erhalten. „Gnade erweisen“ trägt einen leicht biblischen Ton, ist aber weiterhin allgemein verständlich; „Grube“ bewahrt bewusst die Bildhaftigkeit und Mehrdeutigkeit des Ausgangstextes.
