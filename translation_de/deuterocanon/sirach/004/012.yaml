translation:
  language: de
  text: Wer sie liebt, liebt das Leben[a], und wer sie sucht, wird Gunst von Jahwe erlangen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Griechische Parallelüberlieferung: „Wer sich früh zu ihr aufmacht, wird mit Freude erfüllt werden.“'
