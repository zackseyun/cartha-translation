lexical_decisions:
- source_word: אֹהֲבֶיהָ
  choice: Wer sie liebt
  rationale: Das substantivisch gebrauchte Partizip mit femininem Suffix bezieht sich im Kontext auf die Weisheit; die singularische deutsche Form ist natürlich und inklusiv.
- source_word: אָהֲבוּ חַיִּים
  choice: liebt das Leben
  rationale: Das Perfekt hat hier sprichwörtlich-allgemeinen Sinn. Der Singular חַיִּים wird idiomatisch mit „das Leben“ wiedergegeben.
- source_word: וּמְבַקְשֶׁיהָ
  choice: und wer sie sucht
  rationale: בקש bedeutet schlicht „suchen“. Eine Verstärkung wie „eifrig“ oder eine Zeitangabe aus dem abweichenden griechischen Paralleltext wird nicht in den hebräischen Haupttext eingetragen.
- source_word: יָפִיקוּ רָצוֹן
  choice: wird Gunst … finden
  rationale: הפיק mit רָצוֹן bezeichnet hier das Erlangen günstiger Zuwendung. „Gunst finden“ ist im Deutschen idiomatischer als „Gunst erlangen“ und bewahrt den Verheißungscharakter.
- source_word: מֵיהֹוָה
  choice: bei Jahwe
  rationale: Die Präposition מן bezeichnet hier die Quelle der Gunst; die deutsche Wendung „Gunst bei jemandem finden“ gibt dies natürlich wieder. Der Gottesname יהוה wird transparent als „Jahwe“ wiedergegeben.
theological_decisions:
- issue: Abweichung des zweiten Versglieds zwischen hebräischem und griechischem Text
  choice: 'Dem erhaltenen Hebräisch folgen: „wird Gunst bei Jahwe finden“'
  alternative: 'Griechisch: „Wer früh zu ihr aufsteht, wird mit Freude erfüllt werden.“'
  rationale: Der erhaltene hebräische Text ist klar und bildet die Grundlage des Haupttexts. Die deutlich abweichende griechische Überlieferung wird als echte Textalternative in der Fußnote bewahrt, nicht harmonisiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper, sprichwörtlicher Satzstruktur. Das feminine Pronomen bleibt erhalten, da es sich auf die Weisheit bezieht. Die Wiederholung „liebt … liebt“ bildet die hebräische Wortfigur bewusst nach.
