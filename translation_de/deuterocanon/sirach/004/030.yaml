translation:
  language: de
  text: Lass dich nicht doppelzüngig nennen[a][b], und gewöhne deine Zunge nicht daran, so zu reden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch wörtlich: „Besitzer von zweien“. Gemeint ist wahrscheinlich zwiespältiges oder unaufrichtiges Reden; daher „doppelzüngig“.'
    reason: lexical_alternative
  - marker: b
    text: 'Die griechische Fassung lautet: „Sei nicht wie ein Löwe in deinem Haus und spiel dich unter deinen Hausangehörigen nicht auf.“ Sie weicht stark vom erhaltenen hebräischen Text ab und geht wahrscheinlich auf eine andere Textform oder Auslegungstradition zurück.'
    reason: textual_variant
lexical_decisions:
- source_word: אַל תִּקָּרֵא
  choice: Lass dich nicht … nennen
  rationale: Die Nifalform von קרא hat hier passiven Sinn („genannt werden“). Die deutsche Konstruktion bewahrt diesen Sinn und klingt zugleich wie eine natürliche Mahnung.
- source_word: בַּעַל שְׁתַּיִם
  choice: doppelzüngig
  rationale: Wörtlich steht „Besitzer/Herr von zweien“. Da im zweiten Satzglied ausdrücklich die Zunge genannt wird, liegt eine Bezeichnung für zwiespältiges oder unaufrichtiges Reden nahe. „Doppelzüngig“ erhält das Bild der Zunge und ist präziser als das allgemeinere „doppelgesichtig“.
- source_word: לְשׁוֹנְךָ
  choice: deine Zunge
  rationale: Die konkrete Metapher des Hebräischen bleibt erhalten und ist auch im Deutschen als Bezeichnung für das Reden verständlich.
- source_word: אַל תַּרְגֵּל
  choice: gewöhne … nicht daran
  rationale: רגל bezeichnet hier das Einüben oder Gewöhnen. „Gewöhne deine Zunge nicht daran“ gibt die Warnung vor einer eingeübten Redeweise in natürlichem modernem Deutsch wieder.
