translation_notes:
  register: Moderne, würdevolle Weisheitssprache. Die Formulierung bleibt nahe am hebräischen Bild, vermeidet jedoch die im Deutschen unverständliche wörtliche Wendung „Besitzer von zweien“. Die erhebliche Abweichung der griechischen Parallelüberlieferung wird offengelegt, ohne sie in den Haupttext einzumischen.
