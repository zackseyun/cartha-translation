base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/004/013.yaml
  text: Those who hold fast to her will find honor from Yahweh[a], and they will be favored with the blessing of Yahweh.
translation:
  language: de
  text: Alle, die an ihr festhalten, werden Ehre von Jahwe finden[a], und sie werden mit dem Segen Jahwes begünstigt werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Griechisch: „Wer sie festhält, wird Herrlichkeit erben, und wo immer er eintritt, wird der Herr segnen.“ Der hebräische Text lautet: „Alle, die an ihr festhalten, werden Ehre von Jahwe finden“ und „sie werden mit dem Segen Jahwes begünstigt werden“.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְתֹמְכֶיהָ
  choice: Wer an ihr festhält
  rationale: תמך kann „stützen, halten, festhalten“ bedeuten. Bei der personifizierten Weisheit bezeichnet „an ihr festhalten“ eine beständige Bindung; das griechische κρατῶν αὐτῆς stützt diese Nuance. Der deutsche Singular wahrt den kollektiven Sinn, während der folgende Plural die hebräische Numerusform erkennen lässt.
- source_word: יִמְצְאוּ
  choice: wird … finden
  rationale: Die gewöhnliche Bedeutung „finden“ gibt den klaren hebräischen Wortlaut unmittelbar wieder; das griechische „erben“ bleibt als abweichende Lesart in der Fußnote erhalten.
- source_word: כָבוֹד
  choice: Ehre
  rationale: כבוד kann „Ehre“ oder „Herrlichkeit“ heißen. Im Weisheitszusammenhang bezeichnet „Ehre“ passend die von Gott gewährte Wertschätzung, ohne die mögliche Bedeutung unnötig zu überhöhen.
- source_word: מֵיהֹוָה
  choice: von Jahwe
  rationale: Die Präposition מן bedeutet hier „von“. Der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
- source_word: וְיֻחַנּוּ
  choice: ihnen wird … Gunst erwiesen
  rationale: Die passive Form von חנן wird mit einer deutschen Passivkonstruktion wiedergegeben. So bleibt offen, ob Jahwe unmittelbar als handelndes Subjekt ergänzt werden soll.
- source_word: בְּבִרְכַּת יְהֹוָה
  choice: mit dem Segen Jahwes
  rationale: ב kann hier begleitend oder instrumental verstanden werden. „Mit“ bewahrt diese Spielbreite und verbindet die erwiesene Gunst eng mit Jahwes Segen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. „Jahwe“ gibt den Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Abweichung zwischen hebräischem Text und griechischer Überlieferung
  choice: Der hebräische Text steht im Haupttext; die griechische Fassung wird in einer Fußnote dokumentiert.
  alternative: Die griechische Fassung in den Haupttext aufnehmen.
  rationale: Der vorgelegte hebräische Text ist als primäre Quelle mit hoher Sicherheit validiert. Die deutlich abweichende griechische Fassung ist dennoch textgeschichtlich bedeutsam und wird deshalb vollständig vermerkt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „An ihr festhalten“ ist idiomatisch und bringt die Bindung an die personifizierte Weisheit zum Ausdruck. Die etwas markierte Passivformulierung im zweiten Satzteil bewahrt die Form und Offenheit des Hebräischen.
