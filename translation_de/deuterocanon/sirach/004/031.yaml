  text: Do not be proud in your speech[a], and slack and negligent in your work.
translation:
  language: de
  text: Sei nicht überheblich in deiner Rede[a] und nicht nachlässig und träge bei deiner Arbeit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Text bietet eine andere Fassung des Spruchs: „Deine Hand soll nicht ausgestreckt sein, wenn es ums Nehmen geht, und beim Zurückgeben zurückhaltend.“'
    reason: textual_variant
lexical_decisions:
- source_word: גַבְהָן
  choice: überheblich
  rationale: Das Adjektiv bezeichnet eine hochmütige oder anmaßende Haltung. „Überheblich“ ist im heutigen Standarddeutsch klar und gibt die tadelnde Aussage präzise wieder.
- source_word: בִּלְשׁוֹנֶךָ
  choice: in deiner Rede
  rationale: Wörtlich steht „in deiner Zunge“. Gemeint ist hier jedoch die Art des Redens; „in deiner Rede“ bewahrt das Bildfeld, ohne im Deutschen unnatürlich zu wirken.
- source_word: רָפוּי
  choice: nachlässig
  rationale: Das Wort bezeichnet etwas Schlaffes, Unentschlossenes oder Pflichtvergessenes. Im Zusammenhang mit Arbeit drückt „nachlässig“ den mangelnden Einsatz natürlich aus.
- source_word: רָשִׁישׁ
  choice: träge
  rationale: Das seltene Wort steht hier neben רָפוּי und verstärkt den Vorwurf mangelnden Einsatzes. „Träge“ wahrt die doppelte Kennzeichnung, statt beide Begriffe zusammenzuziehen.
- source_word: בִּמְלַאכְתֶּךָ
  choice: bei deiner Arbeit
  rationale: מְלָאכָה bezeichnet Arbeit, Tätigkeit oder Aufgabe. „Bei deiner Arbeit“ ist breit verständlich und idiomatisches modernes Deutsch.
- source_word: μὴ ἔστω ἡ χείρ σου ἐκτεταμένη εἰς τὸ λαβεῖν, καὶ ἐν τῷ ἀποδιδόναι συνεσταλμένη
  choice: nur als abweichende griechische Textform in der Fußnote berücksichtigt
  rationale: Der griechische Text bietet einen inhaltlich anderen Spruch über Nehmen und Zurückgeben. Da der hebräische Text hier mit hoher Sicherheit erhalten ist, bildet er die Grundlage des Haupttextes.
theological_decisions:
- issue: Abweichung zwischen der erhaltenen hebräischen und der griechischen Fassung von Jesus Sirach 4,31
  choice: Die erhaltene hebräische Fassung steht im Haupttext.
  alternative: 'Der griechischen Fassung folgen: „Deine Hand soll nicht ausgestreckt sein, wenn es ums Nehmen geht, und zurückgezogen, wenn es ums Zurückgeben geht.“'
  rationale: Der hebräische Wortlaut ist an dieser Stelle mit hoher Sicherheit bezeugt und hat daher Vorrang. Die wesentlich andere griechische Fassung wird nicht mit ihm harmonisiert, sondern als echte Textvariante transparent in einer Fußnote wiedergegeben.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallelen Tadelwörter des Hebräischen bleiben als „nachlässig und träge“ erhalten; die körperliche Metapher „Zunge“ wird maßvoll als „Rede“ wiedergegeben.
