  text: Contend for righteousness until death[b][a], and Yahweh will fight for you.
translation:
  language: de
  text: Kämpfe bis zum Tod für die Gerechtigkeit,[a][b] und Jahwe wird für dich kämpfen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Kämpfe bis zum Tod für das Rechte.“ Das hebräische Wort צֶדֶק kann „Gerechtigkeit“, „Rechtschaffenheit“ oder „das Rechte“ bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Die griechische Parallelüberlieferung bietet hier einen anderen Satz: „Sei nicht schroff mit deiner Zunge und nicht träge und nachlässig in deinen Taten.“ Der Haupttext folgt dem hebräischen Zeugnis aus der Kairoer Geniza.'
    reason: textual_variant
lexical_decisions:
- source_word: עַד הַמָּוֶת
  choice: bis zum Tod
  rationale: Die knappe Wendung bewahrt Reichweite und Ernst des hebräischen Ausdrucks, ohne ausdrücklich ein Martyrium vorauszusetzen.
- source_word: הִנָּצֵה
  choice: Kämpfe
  rationale: Der Imperativ bezeichnet ein Sich-Einlassen auf Kampf oder Streit. „Kämpfe“ erhält zudem die bewusste Wiederholung mit נִלְחָם im zweiten Satzteil.
- source_word: עַל הַצֶּדֶק
  choice: für die Gerechtigkeit
  rationale: צֶדֶק umfasst sowohl Gerechtigkeit als auch sittliche Rechtschaffenheit. „Gerechtigkeit“ ist im Deutschen natürlich und lässt hier die ethische wie auch die soziale Dimension offen; die alternative Nuance wird in einer Fußnote genannt.
- source_word: וַיהֹוָה
  choice: und Jahwe
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm יהוה; „Jahwe“ gibt den Gottesnamen als Namen wieder.
- source_word: נִלְחָם לָךְ
  choice: wird für dich kämpfen
  rationale: Das Partizip erhält im Zusammenhang der Aufforderung natürlichen Zukunfts- beziehungsweise Folgesinn. „Für dich kämpfen“ bewahrt die Bildsprache und den Parallelismus.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Da der Ausgangstext den Gottesnamen ausdrücklich verwendet, wird er transparent als „Jahwe“ wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutungsumfang von צֶדֶק
  choice: Gerechtigkeit
  alternative: das Rechte / Rechtschaffenheit
  rationale: Der Begriff kann gerechtes Handeln, einen gerechten Zustand oder sittliche Rechtschaffenheit bezeichnen. Der Haupttext entscheidet sich für das idiomatische „Gerechtigkeit“, während die Fußnote die breitere ethische Lesart wahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung von „kämpfen“ bildet den hebräischen Parallelismus gezielt nach. Die Fußnotenzeichen stehen nach der betroffenen ersten Satzhälfte; ihre Reihenfolge entspricht der Reihenfolge der Fußnoten.
