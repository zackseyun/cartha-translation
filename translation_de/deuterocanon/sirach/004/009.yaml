translation:
  language: de
  text: Sei wie ein Vater für Waisen[a] und anstelle eines Ehemanns für Witwen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Überlieferung hat eine wesentlich andere Lesart: „Befreie den, dem Unrecht geschieht, aus der Hand dessen, der Unrecht tut, und sei nicht mutlos, wenn du richtest.“ Vermutlich liegt ihr eine andere Textform dieses Verses zugrunde.'
    reason: alternative_reading
lexical_decisions:
- source_word: הֱיֵה כְאָב
  choice: Sei wie ein Vater
  rationale: Der Imperativ von היה wird zusammen mit dem Vergleichspräfix כְ wiedergegeben. So bleibt das Bild eines väterlichen Handelns erhalten, ohne eine wörtliche Vaterrolle zu behaupten.
- source_word: לִיתוֹמִים
  choice: für Waisen
  rationale: יתומים bezeichnet vater- oder elternlose Kinder. „Waisen“ ist im modernen Deutschen klar; „für“ drückt die fürsorgliche Zuwendung idiomatischer aus als „den Waisen“.
- source_word: וּתְמוּר
  choice: und anstelle
  rationale: תמור bezeichnet Ersatz oder Stellvertretung. „Anstelle“ bewahrt diesen Gedanken knapp und natürlich.
- source_word: בַּעַל
  choice: eines Ehemanns
  rationale: Im Zusammenhang mit Witwen bezeichnet בעל den verstorbenen beziehungsweise fehlenden Ehemann, nicht allgemein einen Herrn oder Besitzer.
- source_word: לְאַלְמָנוֹת
  choice: für Witwen
  rationale: אלמנות bedeutet eindeutig „Witwen“. Die Präposition „für“ macht im Deutschen die schützende, fürsorgliche Funktion verständlich.
- source_word: ἐξελοῦ ἀδικούμενον ἐκ χειρὸς ἀδικοῦντος
  choice: nicht in den Haupttext übernommen
  rationale: Die griechische Überlieferung bietet eine wesentlich andere Fassung. Da hier ein sicher bezeugter hebräischer Text vorliegt, bestimmt dieser den Haupttext; die griechische Lesart wird in der Fußnote dokumentiert.
theological_decisions:
- issue: Abweichung zwischen der erhaltenen hebräischen Fassung und der griechischen Überlieferung
  choice: Der Haupttext folgt der hebräischen Aufforderung, Waisen und Witwen familiären Schutz zu gewähren.
  alternative: „Befreie den, dem Unrecht geschieht, aus der Hand dessen, der Unrecht tut, und sei nicht mutlos, wenn du richtest.“
  rationale: Für Jesus Sirach hat der erhaltene, hier als zuverlässig bewertete hebräische Text Vorrang. Die deutlich abweichende griechische Fassung wird nicht harmonisiert, sondern als eigenständige Textform in einer Fußnote bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Sei wie ein Vater“ bewahrt den hebräischen Vergleich; „anstelle eines Ehemanns“ erhält bewusst den Gedanken der Stellvertretung. Die parallele Präposition „für“ klingt natürlich und hebt die Fürsorge für gesellschaftlich Schutzbedürftige hervor.
