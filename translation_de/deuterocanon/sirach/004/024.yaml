  text: For wisdom is made known in speech[a], and understanding in the response of the tongue.
translation:
  language: de
  text: Denn in der Rede wird Weisheit erkannt und in der Antwort der Zunge Einsicht.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Paralleltext lautet: „und Unterweisung in einem Wort der Zunge“. Der hebräische Text hat: „und Einsicht in der Antwort der Zunge“.'
    reason: alternative_reading
lexical_decisions:
- source_word: בְאֹמֶר
  choice: an der Rede
  rationale: Das Substantiv bezeichnet das Reden bzw. eine Äußerung. „An der Rede“ gibt natürlich wieder, dass Weisheit im Sprechen erkennbar wird, ohne den Ausdruck auf einen einzelnen Ausspruch zu verengen.
- source_word: נוֹדַעַת
  choice: erkennt man
  rationale: 'Die unpersönliche deutsche Form gibt den passivischen Sinn des Nifal idiomatisch wieder: Weisheit wird an der Rede erkannt bzw. erkennbar.'
- source_word: חָכְמָה
  choice: Weisheit
  rationale: Die übliche und kontextuell passende Wiedergabe von חָכְמָה.
- source_word: וּתְבוּנָה
  choice: und … Einsicht
  rationale: תְבוּנָה bezeichnet Verständnis, Einsicht oder Urteilsvermögen. „Einsicht“ unterscheidet den Begriff knapp von „Weisheit“ und wahrt den Parallelismus.
- source_word: בְּמַעֲנֵה
  choice: an der Antwort
  rationale: מַעֲנֶה bezeichnet eine Antwort oder Erwiderung. Die konkrete Nominalform des Hebräischen bleibt erhalten.
- source_word: לָשׁוֹן
  choice: der Zunge
  rationale: Die wörtliche Körpermetapher des Hebräischen wird bewahrt; auch die griechische Parallele hat γλώσσης („der Zunge“).
theological_decisions:
- issue: Abweichung zwischen dem hebräischen und dem griechischen Text im zweiten Versglied
  choice: 'Dem erhaltenen Hebräisch folgen: „an der Antwort der Zunge Einsicht“'
  alternative: 'Nach dem Griechischen: „Unterweisung in einem Wort der Zunge“'
  rationale: Der hochsicher bezeugte hebräische Text hat תְבוּנָה („Einsicht“) und מַעֲנֶה („Antwort“). Der griechische Paralleltext bietet dagegen παιδεία („Unterweisung/Erziehung“) und ῥῆμα („Wort/Äußerung“). Der Haupttext folgt daher dem Hebräischen; die echte Textabweichung wird in der Fußnote offengelegt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung von „an der“ bildet den hebräischen Parallelismus nach; „Antwort der Zunge“ bewahrt bewusst das konkrete Bild des Ausgangstextes.
