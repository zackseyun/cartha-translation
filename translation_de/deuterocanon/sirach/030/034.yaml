  text: Put him to work while he is a child[a], and you will find rest; let his hands go idle[b], and he will seek freedom.
translation:
  language: de
  text: Halte ihn als Kind zur Arbeit an, dann wirst du Ruhe finden. Lass ihm die Hände frei[a], dann wird er Freiheit suchen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Lass ihm die Hände los/frei.“ Das Bild kann bedeuten, ihm bei Arbeit und Erziehung freien Lauf zu lassen.'
    reason: lexical_alternative
  - marker: b
    text: „Freiheit“ bezeichnet hier im Zusammenhang wahrscheinlich das Abwerfen von Einschränkung oder Erziehung, nicht politische Freiheit.
    reason: cultural_note
lexical_decisions:
- source_word: ἔργασαι ἐν παιδί
  choice: Halte ihn schon als Kind zur Arbeit an
  rationale: Die knappe griechische Wendung ist elliptisch. Im Zusammenhang bezeichnet sie, dass der Junge bereits in der Kindheit zu Arbeit oder geregelter Tätigkeit angehalten werden soll. Die Formulierung ist im Deutschen natürlich, ohne unnötige Härte einzutragen.
- source_word: εὑρήσεις ἀνάπαυσιν
  choice: dann wirst du Ruhe finden
  rationale: ἀνάπαυσις bezeichnet Ruhe oder Entlastung. „Ruhe finden“ bleibt nah am griechischen Wortlaut und gibt die sprichwörtliche Folge verständlich wieder.
- source_word: ἄνες χεῖρας αὐτῷ
  choice: Lässt du seine Hände ruhen
  rationale: ἄνες kann „lass los“, „lockere“ oder „lass nach“ bedeuten; „seine Hände“ steht bildhaft für Arbeit und Tätigkeit. Die gewählte Fassung bewahrt dieses Bild und lässt die mögliche Bedeutung des Nachlassens in der Aufsicht in der Fußnote erkennen.
- source_word: ζητήσει ἐλευθερίαν
  choice: wird er Freiheit suchen
  rationale: ἐλευθερία bedeutet wörtlich „Freiheit“. Die direkte Wiedergabe erhält die Spannung des Textes; der Zusammenhang legt Freiheit von Zucht oder Einschränkung nahe, ohne dass dies in den Haupttext hineinerklärt wird.
theological_decisions:
- issue: Männlicher Singular bei παιδί und den anschließenden Bezügen
  choice: „ihn … er“
  alternative: Geschlechtsneutral „ein Kind … es“
  rationale: Die griechische Aussage bezieht sich im vorliegenden Zusammenhang durch αὐτῷ und das mitgedachte männliche Subjekt von ζητήσει auf einen einzelnen Jungen. Die Übersetzung bewahrt diese konkrete Form, statt sie zu verallgemeinern.
- issue: Bedeutung von „Freiheit“ im Zusammenhang der Erziehung
  choice: Den wörtlichen Ausdruck „Freiheit“ im Haupttext bewahren und kontextuell erläutern
  alternative: Deutend mit „Ungebundenheit“ oder „Unabhängigkeit“ übersetzen
  rationale: Der griechische Begriff ἐλευθερία ist theologisch und ethisch spannungsreich. Eine deutende Ersetzung könnte den positiven Grundklang von Freiheit vorschnell aufheben; deshalb bleibt die Mehrdeutigkeit im Text erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit sprichwörtlichem Satzrhythmus. Das Bild der Hände und das wörtliche „Freiheit“ bleiben erhalten; notwendige Deutungen stehen in den Fußnoten.
