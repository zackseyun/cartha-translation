  text: A joyful heart is a man's life[a], and a person's gladness prolongs his life.
translation:
  language: de
  text: Herzensfreude ist das Leben eines Mannes, und die Freude eines Menschen verlängert sein Leben.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die letzten hebräischen Wörter sind schwierig. Der überlieferte Text lautet wörtlich etwa: „hat seine Nase/seinen Zorn verlängert“. Der griechische Paralleltext stützt den Sinn „verlängert seine Tage“ beziehungsweise „verlängert sein Leben“, dem die Übersetzung hier folgt.'
    reason: textual_variant
lexical_decisions:
- source_word: שמחת לב
  choice: Herzensfreude
  rationale: Die knappe Zusammensetzung gibt die hebräische Genitivverbindung ‚Freude des Herzens‘ natürlich und würdevoll wieder.
- source_word: חיי איש
  choice: ist das Leben eines Mannes
  rationale: חיים steht formal im Plural, bezeichnet hier aber das Leben als Ganzes. איש wird entsprechend seiner gewöhnlichen Bedeutung mit ‚Mann‘ wiedergegeben.
- source_word: וגיל אדם
  choice: und die Freude eines Menschen
  rationale: גיל bezeichnet Freude oder Frohsein; אדם ist hier allgemein-menschlich gebraucht und wird daher mit ‚Mensch‘ wiedergegeben.
- source_word: האריך אפו
  choice: verlängert sein Leben
  rationale: Der überlieferte hebräische Wortlaut ist am Versende schwierig und ergäbe wörtlich etwa ‚verlängert seine Nase/seinen Zorn‘. Der griechische Paralleltext weist auf verlängerte beziehungsweise verkürzte Lebenstage; im Deutschen bringt ‚verlängert sein Leben‘ den wahrscheinlichen Sinn natürlich zum Ausdruck.
theological_decisions:
- issue: Geschlechtsspezifische Wiedergabe von איש und אדם
  choice: איש als ‚Mann‘, אדם als generisches ‚Mensch‘ wiedergeben
  alternative: Beide Ausdrücke generisch mit ‚Mensch‘ wiedergeben oder beide mit ‚Mann‘ übersetzen
  rationale: So bleibt der Unterschied zwischen den beiden hebräischen Bezeichnungen sichtbar, ohne den allgemein-menschlichen Gebrauch von אדם unnötig einzuengen.
- issue: Schwieriger überlieferter Wortlaut האריך אפו
  choice: Den wahrscheinlich gemeinten, durch den griechischen Paralleltext gestützten Sinn ‚verlängert sein Leben‘ im Haupttext wiedergeben
  alternative: Wörtlich ‚verlängert seine Nase/seinen Zorn‘ oder konjektural ‚verlängert seine Tage‘ übersetzen
  rationale: Die wörtliche Lesart ergibt im Zusammenhang keinen überzeugenden Sinn. Die transparente Fußnote bewahrt die textkritische Spannung, während der Haupttext die wahrscheinlich beabsichtigte Aussage verständlich wiedergibt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die sentenzhafte Parallelstruktur bleibt erhalten; ‚Herzensfreude‘ ist knapp und allgemein verständlich. Der Fußnotenmarker steht unmittelbar nach der textkritisch erschlossenen Aussage.
