  text: He who disciplines his son will profit by him, and among his acquaintances he will boast because of him.
translation:
  language: de
  text: Wer seinen Sohn erzieht, wird Nutzen von ihm haben, und unter seinen Bekannten wird er sich seinetwegen rühmen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ παιδεύων
  choice: Wer … erzieht
  rationale: παιδεύω umfasst Erziehung, Unterweisung und korrigierende Zucht. „erzieht“ ist im Deutschen natürlich und bewahrt in diesem Kontext den umfassenden Gedanken formender und nötigenfalls korrigierender Erziehung, ohne ihn auf Bestrafung zu verengen.
- source_word: τὸν υἱὸν αὐτοῦ
  choice: seinen Sohn
  rationale: Der griechische Text bezeichnet ausdrücklich den Sohn im maskulinen Singular; diese Spezifizierung wird beibehalten.
- source_word: ὀνήσεται ἐπʼ αὐτῷ
  choice: wird Nutzen von ihm haben
  rationale: Das Futur ὀνήσεται bezeichnet einen empfangenen Nutzen oder Vorteil; ἐπʼ αὐτῷ nennt hier dessen Quelle beziehungsweise Grundlage. Die Formulierung ist klares, modernes Deutsch.
- source_word: ἀνὰ μέσον γνωρίμων
  choice: unter seinen Bekannten
  rationale: γνωρίμων bezeichnet bekannte oder vertraute Personen, ohne zwingend die engere Beziehung von Freunden auszudrücken. Das Possessivpronomen ist aus dem Zusammenhang natürlich ergänzt.
- source_word: καυχήσεται ἐπʼ αὐτῷ
  choice: wird er sich seinetwegen rühmen
  rationale: καυχάομαι bedeutet sich rühmen oder sich brüsten; ἐπʼ αὐτῷ bezeichnet den Sohn als Anlass dafür. „sich rühmen“ bewahrt den direkten Sinn, ohne die Aussage moralisch abzuschwächen oder zu verschärfen.
theological_decisions:
- issue: Moralische Wertung des elterlichen Rühmens
  choice: „wird er sich seinetwegen rühmen“ ohne ausdrückliche moralische Wertung
  alternative: „wird er stolz auf ihn sein“
  rationale: Der Vers beschreibt die gesellschaftliche Ehre, die der Vater durch den erzogenen Sohn erfährt, bewertet das Rühmen aber nicht ausdrücklich. Die Übersetzung bewahrt diese Spannung und macht daraus weder eindeutig berechtigten Stolz noch schuldhafte Prahlerei.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallele Satzstruktur des Griechischen bleibt erkennbar; „erzieht“ gibt das breite Bedeutungsspektrum von παιδεύω im Kontext der Kindererziehung natürlicher wieder als das enger und härter klingende „züchtigt“.
