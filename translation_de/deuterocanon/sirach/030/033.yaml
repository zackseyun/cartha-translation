base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/030/033.yaml
  text: Fodder and a rod and burdens are for a donkey[c][b][a]; bread and discipline and work are for a servant.
translation:
  language: de
  text: Futter, Stock und Lasten[a] für einen Esel; Brot, Erziehung[b] und Arbeit für einen Haussklaven.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Ladungen«.'
    reason: lexical_alternative
  - marker: b
    text: »Erziehung« kann hier auch Disziplin, Schulung oder Zurechtweisung bedeuten.
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »Hausdiener« oder »Diener«; das griechische Wort kann einen Diener im Haushalt bezeichnen und meint im antiken Kontext oft eine versklavte Person.'
    reason: alternative_reading
lexical_decisions:
- source_word: χορτάσματα
  choice: Futter
  rationale: Das Wort bezeichnet hier Tierfutter. Das deutsche Massennomen »Futter« gibt den konkreten Bezug auf den Esel natürlich und knapp wieder.
- source_word: ῥάβδος
  choice: Stock
  rationale: Im Zusammenhang mit einem Lasttier bezeichnet das Wort einen Stock zum Antreiben oder Lenken. »Stock« ist im heutigen Deutsch verständlicher und weniger literarisch als »Rute«.
- source_word: φορτία
  choice: Lasten
  rationale: Gemeint sind Dinge, die getragen werden. »Lasten« bewahrt sowohl den konkreten Sinn als auch die knappe sprichwörtliche Form.
- source_word: ὄνῳ
  choice: Esel
  rationale: Die übliche und genaue moderne Bezeichnung des genannten Tieres.
- source_word: ἄρτος
  choice: Brot
  rationale: Das Griechische nennt ausdrücklich Brot; eine Verallgemeinerung zu »Nahrung« ist nicht erforderlich.
- source_word: παιδεία
  choice: Zucht
  rationale: Das vielschichtige Wort kann Erziehung, Schulung und korrigierende Disziplin bezeichnen. In dieser zugespitzten sozialen Gegenüberstellung bringt »Zucht« den disziplinierenden Sinn knapp zum Ausdruck, ohne die weiteren Bedeutungsnuancen in der Fußnote auszuschließen.
- source_word: ἔργον
  choice: Arbeit
  rationale: Eine direkte, natürliche Wiedergabe, die den knappen Parallelismus wahrt.
- source_word: οἰκέτῃ
  choice: Haussklave
  rationale: οἰκέτης bezeichnet typischerweise einen dem Haushalt zugehörigen Diener in unfreier Stellung. »Haussklave« macht sowohl den häuslichen Bezug als auch den rechtlich-sozialen Status sichtbar.
theological_decisions:
- issue: Sozialer Status des οἰκέτης
  choice: Haussklave
  alternative: Hausdiener oder Diener
  rationale: Der Ausdruck kann funktional einen Hausdiener bezeichnen, steht in der antiken Lebenswelt jedoch häufig für einen unfreien Angehörigen des Haushalts. Da Brot, Zucht und auferlegte Arbeit die Abhängigkeit hervorheben, wäre »Diener« allein eine mögliche Verharmlosung. Die Fußnote erhält die lexikalische Spannweite.
- issue: Bedeutungsumfang von παιδεία
  choice: Zucht
  alternative: Erziehung, Schulung oder Zurechtweisung
  rationale: Der Kontext legt die korrigierende und disziplinierende Seite nahe, legt das Wort aber nicht eindeutig auf körperliche Bestrafung fest. Daher bleibt die weitere Bedeutungsspanne in der Fußnote ausdrücklich erhalten.
translation_notes:
  register: Knappes, parallel gebautes Sprichwort in modernem, würdigem Standarddeutsch. Die verblosen Nominalreihen des Griechischen bleiben erhalten. »Zucht« ist bewusst markant und wird wegen seines heute enger oder härter wirkenden Klangs erläutert.
