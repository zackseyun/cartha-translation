  text: In all your works be outstanding[b][a]; do not give a blemish to your honor.
translation:
  language: de
  text: Sei in allem, was du tust, herausragend[a]; füge deinem Ansehen keinen Makel zu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »überragend« oder »ausgezeichnet«.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: »Gib keinen Makel in deine Ehre/dein Ansehen.« Für »Ansehen« kann auch »Ehre« oder »Herrlichkeit« stehen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν πᾶσι τοῖς ἔργοις σου
  choice: in allem, was du tust
  rationale: Die Wendung gibt die umfassende Bedeutung von πᾶσι und den Handlungssinn von ἔργοις in natürlichem modernem Deutsch wieder; das formalere »in all deinen Werken« wäre hier weniger idiomatisch.
- source_word: γίνου
  choice: sei
  rationale: Der präsentische Imperativ von γίνομαι fordert hier zu einer beständigen Haltung und Handlungsweise auf; »sei« ist dafür knapp und natürlich.
- source_word: ὑπεράγων
  choice: herausragend
  rationale: Das Wort bezeichnet ein Übertreffen oder Sich-Auszeichnen. »Herausragend« bewahrt den Gedanken besonderer Vortrefflichkeit, ohne einen unklaren Vergleichsmaßstab einzuführen.
- source_word: μὴ δῷς
  choice: füge … nicht zu
  rationale: δίδωμι bedeutet wörtlich »geben«; zusammen mit μῶμον bezeichnet die Wendung jedoch idiomatisch das Verursachen eines Makels. »Füge … keinen … zu« wahrt das Bild und klingt im Deutschen natürlich.
- source_word: μῶμον
  choice: Makel
  rationale: »Makel« bildet die Bedeutung von μῶμον als Fehler, Schandfleck oder Anlass zum Tadel prägnant und bildhaft ab.
- source_word: ἐν τῇ δόξῃ σου
  choice: deinem Ansehen
  rationale: δόξα kann Herrlichkeit, Ehre oder Ansehen bezeichnen. Im Zusammenhang persönlichen Verhaltens trifft »Ansehen« die gesellschaftliche Bedeutung, während die Fußnote die enger formale Alternative festhält.
theological_decisions:
- issue: Bedeutungsumfang von δόξα
  choice: Ansehen
  alternative: Ehre; Herrlichkeit
  rationale: Der Vers spricht wahrscheinlich vom Ruf beziehungsweise gesellschaftlichen Ansehen eines Menschen. Da δόξα jedoch auch »Ehre« oder »Herrlichkeit« bedeuten kann, wird diese Mehrdeutigkeit in der Fußnote bewahrt und nicht theologisch verengt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem weisheitlichem Ton. Der Parallelismus der beiden Aufforderungen bleibt erhalten; die erste Vershälfte wird idiomatisch, die zweite bildhaft und relativ quellennah wiedergegeben.
