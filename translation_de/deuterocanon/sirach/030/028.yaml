  text: Years of a glad heart are better than delicacies[b][a], and his food will agree with him.
translation:
  language: de
  text: Die Jahre eines Menschen mit frohem Herzen sind besser als Leckerbissen[a][b], und seine Nahrung bekommt ihm gut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Jahre eines guten Herzens anstelle von Leckerbissen, und seine Nahrung wird auf ihn hinaufsteigen.“ Der zweite Satzteil meint offenbar, dass dem Menschen mit frohem Herzen auch einfache Nahrung gut bekommt oder zuträglich ist.'
    reason: lexical_alternative
  - marker: b
    text: 'Der griechische Text bietet an dieser Stelle einen ganz anderen Spruch: Man solle zu Lebzeiten weder Sohn, Frau, Bruder noch Freund Macht über sich geben und auch keinem anderen sein Vermögen überlassen. Der hebräische Text bezeugt hier somit eine deutlich abweichende Textüberlieferung.'
    reason: textual_variant
lexical_decisions:
- source_word: שנות
  choice: Jahre mit
  rationale: Der Konstruktplural bezeichnet eine über Jahre andauernde Lebenslage. „Jahre mit“ bewahrt das hebräische Zeitbild und klingt im Deutschen natürlich.
- source_word: לב טוב
  choice: frohem Herzen
  rationale: In diesem weisheitlichen Zusammenhang bezeichnet לֵב טוֹב vor allem innere Freude und Wohlbefinden, nicht ausschließlich sittliche Güte.
- source_word: תחת
  choice: sind besser als
  rationale: 'Wörtlich bedeutet תחת „anstelle von“ beziehungsweise „an Stelle von“. Hier liegt ein wertender Vergleich nahe: Anhaltende Herzensfreude ist kostbaren Speisen vorzuziehen.'
- source_word: מטעמים
  choice: Leckerbissen
  rationale: Das Wort bezeichnet besonders schmackhafte, ausgewählte oder luxuriöse Speisen. „Leckerbissen“ ist gegenwärtig und allgemein verständlich.
- source_word: ומאכלו
  choice: und seine Nahrung
  rationale: Das maskuline Singularsuffix verweist am ehesten auf den Menschen mit frohem Herzen. „Nahrung“ passt zum allgemeinen Weisheitsspruch besser als die engere Wiedergabe „Mahlzeit“.
- source_word: יעלה עליו
  choice: bekommt ihm gut
  rationale: Die Wendung lautet wörtlich etwa „steigt auf ihn“ und beschreibt hier offenbar, dass Nahrung zuträglich oder gut verträglich ist. „Bekommt ihm gut“ gibt diesen Sinn idiomatisch wieder, ohne ihn zu medizinisch festzulegen.
theological_decisions:
- issue: Verhältnis von innerer Freude, kostbarer Speise und körperlichem Wohlergehen
  choice: 'Als weisheitliche Beobachtung formuliert: Ein frohes Herz ist wertvoller als Luxus, und Nahrung ist einem solchen Menschen zuträglich.'
  alternative: Als uneingeschränktes Versprechen verstehen, dass Fröhlichkeit stets Gesundheit bewirkt.
  rationale: Der hebräische Spruch stellt einen erfahrungsbezogenen Zusammenhang her, formuliert aber keine ausdrückliche Garantie oder feste Lehre über Krankheit und Gesundheit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer weisheitlicher Satzstruktur. Das konkrete Zeitbild „Jahre“ bleibt erhalten; die schwer verständliche hebräische Wendung zur Wirkung der Nahrung wird idiomatisch, aber vorsichtig als „bekommt ihm gut“ wiedergegeben.
