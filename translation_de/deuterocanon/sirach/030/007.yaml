  text: He will bind up his wounds over the souls of his sons, and at every cry his inward parts will be troubled.
translation:
  language: de
  text: Wegen der Seelen seiner Söhne wird er seine Wunden fest verbinden[a], und bei jedem Schrei wird sein Innerstes erschüttert werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Wegen der Seelen seiner Söhne wird er seine Wunden fest verbinden.« »Seelen« (griechisch psychai) kann je nach Zusammenhang auch »Leben« oder »Personen« bedeuten. Der Bildzusammenhang ist knapp und mehrdeutig.'
    reason: Die Fußnote wahrt die Bedeutungsbreite von ψυχαί und weist auf die ungewöhnliche, nicht sicher weiter auszudeutende Bildsprache hin.
lexical_decisions:
- source_word: περὶ ψυχῶν υἱῶν
  choice: Um das Leben seiner Söhne besorgt
  rationale: περί mit dem Genitiv bezeichnet hier den Gegenstand der Sorge; ψυχαί kann »Seelen« oder »Leben« bedeuten. Im Zusammenhang elterlicher Angst ist »Leben« im Deutschen natürlicher, ohne den Gedanken der tiefen persönlichen Sorge aufzugeben.
- source_word: καταδεσμεύσει τραύματα αὐτοῦ
  choice: wird er seine Wunden verbinden
  rationale: καταδεσμεύω bezeichnet ein festes Umwickeln beziehungsweise Verbinden; das Futur und das Possessivpronomen werden ausdrücklich wiedergegeben.
- source_word: ἐπὶ πάσῃ βοῇ
  choice: bei jedem Schrei
  rationale: βοή kann einen Ruf, Aufschrei oder Schrei bezeichnen; »Schrei« passt zur geschilderten alarmierten Reaktion.
- source_word: ταραχθήσεται σπλάγχνα αὐτοῦ
  choice: wird sein Innerstes erschüttert werden
  rationale: σπλάγχνα bezeichnet wörtlich die inneren Organe und bildlich den Sitz tiefer Gefühle; »sein Innerstes« bewahrt das Körperbild in verständlichem Deutsch. Das Passiv von ταράσσω wird als »erschüttert werden« wiedergegeben.
theological_decisions:
- issue: Bedeutung von ψυχαί
  choice: Leben
  alternative: Seelen
  rationale: Die griechische Mehrdeutigkeit ist echt; hier bezeichnet das Wort wahrscheinlich das gefährdete Leben beziehungsweise Wohlergehen der Söhne. Die Fußnote hält die wörtlichere Alternative offen.
- issue: Bezug der Sorge und der Wunden
  choice: Die Sorge um die Söhne wird sprachlich mit dem Verbinden seiner Wunden verbunden, ohne den Bildzusammenhang weiter auszudeuten.
  alternative: Die Aussage als eindeutige Lehre über verwöhnende Erziehung erklären.
  rationale: Der Einzelvers ist bildhaft und syntaktisch knapp. Eine bestimmte moralische oder konfessionelle Deutung soll nicht in den Text eingetragen werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das doppelte Futur folgt dem griechischen Satzbau; »sein Innerstes« ist idiomatisch, bewahrt aber die körperlich-emotionale Bildsprache.
