  yaml_path: translation/deuterocanon/sirach/030/003.yaml
  text: He who instructs his son will provoke the enemy to jealousy[a], and in the presence of friends he will rejoice over him.
translation:
  language: de
  text: Wer seinen Sohn unterweist, wird den Feind neidisch machen[a], und vor Freunden wird er sich über ihn freuen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wird den Feind zur Eifersucht reizen“. Das griechische Verb kann ausdrücken, dass jemand zu Eifersucht oder Neid gereizt wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ διδάσκων
  choice: Wer … unterweist
  rationale: Das substantivierte Präsenspartizip bezeichnet allgemein denjenigen, der fortlaufend lehrt und erzieht; „unterweist“ passt zur elterlichen Bildung und bleibt würdevoll und verständlich.
- source_word: τὸν υἱὸν αὐτοῦ
  choice: seinen Sohn
  rationale: Der griechische Ausdruck ist ausdrücklich maskulin und singular; dies wird ohne Neutralisierung wiedergegeben.
- source_word: παραζηλώσει
  choice: wird … neidisch machen
  rationale: Das Verb kann bedeuten, jemanden zu Eifersucht oder Neid zu reizen. Beim Objekt „der Feind“ ist „neidisch machen“ im Deutschen natürlich; die alternative Nuance wird in der Fußnote bewahrt.
- source_word: τὸν ἐχθρόν
  choice: den Feind
  rationale: Der bestimmte Singular wird als repräsentative Bezeichnung für den Gegner beibehalten.
- source_word: ἔναντι φίλων
  choice: vor Freunden
  rationale: Die Wendung bedeutet „vor“ beziehungsweise „in Gegenwart von“ und bezeichnet den öffentlichen, sozialen Rahmen.
- source_word: ἐπʼ αὐτῷ
  choice: über ihn
  rationale: In Verbindung mit ἀγαλλιάσεται bezeichnet die Präpositionalphrase am ehesten den Anlass oder Gegenstand der Freude.
- source_word: ἀγαλλιάσεται
  choice: wird er sich freuen
  rationale: Das Futur bezeichnet freudigen Jubel. „Sich freuen“ ist natürliches modernes Deutsch und wahrt die positive Aussage, ohne unnötig gehoben zu klingen.
