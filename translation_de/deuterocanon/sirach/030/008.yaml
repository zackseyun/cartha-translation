  text: An unbroken horse turns out stubborn[b][a], and a son left unchecked turns out headstrong.
translation:
  language: de
  text: Ein ungezähmtes Pferd wird störrisch, und ein Sohn, den man gewähren lässt, wird eigenwillig.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das seltene griechische Wort kann auch „ungezügelt“, „dreist“ oder „selbstherrlich“ bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵππος
  choice: Pferd
  rationale: Die gewöhnliche Bedeutung passt zum sprichwörtlichen Vergleich; ein gehobenes Wort wie „Ross“ ist nicht erforderlich.
- source_word: ἀδάμαστος
  choice: ungezähmt
  rationale: Das Wort bezeichnet ein Pferd, das nicht gebändigt oder abgerichtet wurde; „ungezähmt“ ist im Deutschen natürlich und bewahrt das Bild.
- source_word: ἀποβαίνει
  choice: wird
  rationale: Das Verb bezeichnet hier den eintretenden Zustand oder das Ergebnis. Das schlichte „wird“ gibt dies idiomatisch wieder.
- source_word: σκληρός
  choice: störrisch
  rationale: Im Zusammenhang mit einem ungezähmten Pferd ist widerständiges Verhalten gemeint, nicht körperliche Härte.
- source_word: υἱός
  choice: Sohn
  rationale: Der griechische Text nennt ausdrücklich einen Sohn und wird daher nicht zu „Kind“ verallgemeinert.
- source_word: ἀνειμένος
  choice: den man gewähren lässt
  rationale: Das Partizip bezeichnet jemanden, der losgelassen oder nicht in Schranken gehalten wird. Die Formulierung drückt fehlende Begrenzung aus, ohne bereits eine bestimmte Erziehungsmethode einzutragen.
- source_word: ἐκβαίνει
  choice: wird
  rationale: Wie ἀποβαίνει bezeichnet das Verb das Ergebnis; die gleiche Wiedergabe erhält den Parallelismus.
- source_word: προαλής
  choice: eigenwillig
  rationale: Das seltene Adjektiv beschreibt wahrscheinlich eine ungehemmte, selbstbestimmte oder dreiste Haltung. „Eigenwillig“ ist im Kontext verständlich, während die Unsicherheit in einer Fußnote ausgewiesen wird.
