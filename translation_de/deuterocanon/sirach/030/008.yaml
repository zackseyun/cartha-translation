  verdict: approve
  source_fidelity: Der Parallelismus und die Ergebnisbedeutung von ἀποβαίνει/ἐκβαίνει sind sachgerecht wiedergegeben. „ungezähmtes Pferd“ trifft ἀδάμαστος im Pferdekontext idiomatisch; „störrisch“ gibt σκληρός kontextgerecht als widerständig wieder. „Sohn“ wahrt das maskuline υἱός. „den man gewähren lässt“ bildet ἀνειμένος als nicht zurückgehalten bzw. sich selbst überlassen angemessen ab, ohne eine konkrete Erziehungspraxis hineinzulesen. „eigenwillig“ ist für das seltene und semantisch nicht völlig sichere προαλής eine vertretbare, zurückhaltende Wahl.
