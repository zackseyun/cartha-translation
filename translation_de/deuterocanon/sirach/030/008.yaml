  terminology: Die Wortwahl ist registergerecht und folgt weder einer konfessionellen Deutung noch einer überstarken Moralisierung. Die Fußnote markiert die lexikalische Unsicherheit bei προαλής sinnvoll; der Anker steht eindeutig am betreffenden Schlusswort.
