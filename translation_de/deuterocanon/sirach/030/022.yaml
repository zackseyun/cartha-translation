  text: Gladness of heart is a man's life, and a man's rejoicing prolongs his days.[a]
translation:
  language: de
  text: Herzensfreude ist das Leben eines Menschen, und die Freude eines Mannes verlängert seine Tage.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der erhaltene hebräische Text dieses Verses ist schwer verständlich und weicht stark von der griechischen Überlieferung ab. Die Übersetzung folgt hier dem klaren Sinn des griechischen Textes.
    reason: textual_variant
lexical_decisions:
- source_word: εὐφροσύνη καρδίας
  choice: Herzensfreude
  rationale: Die kompakte deutsche Zusammensetzung gibt die innere Freude bzw. den Frohsinn des Herzens natürlich wieder und bewahrt das Herz als Sitz des inneren Lebens.
- source_word: ζωὴ ἀνθρώπου
  choice: ist das Leben eines Menschen
  rationale: Die Formulierung folgt der nominalen Aussage des Griechischen und gibt ἄνθρωπος mit dem allgemeinmenschlichen „Mensch“ wieder.
- source_word: ἀγαλλίαμα ἀνδρός
  choice: die Freude eines Mannes
  rationale: „Freude“ ist im Deutschen natürlich und würdig; „eines Mannes“ bewahrt, dass hier im Unterschied zu ἄνθρωπος ausdrücklich ἀνήρ steht.
- source_word: μακροημέρευσις
  choice: verlängert seine Tage
  rationale: Die verbale Wiedergabe erschließt die Bedeutung als langes Leben und erhält zugleich die biblische Redeweise von verlängerten Tagen.
theological_decisions:
- issue: Starke Abweichung zwischen dem erhaltenen hebräischen Text und der griechischen Überlieferung
  choice: Der verständliche Sinn der griechischen Parallelüberlieferung wird im Haupttext wiedergegeben; die Abweichung des Hebräischen wird in einer Fußnote offengelegt.
  alternative: 'Den vorliegenden hebräischen Wortlaut übersetzen: „Wie einer, der bei einer Jungfrau liegt, so handelt, wer mit Gewalt Recht spricht; und JHWH wird es von seiner Hand fordern.“'
  rationale: Der angegebene hebräische Text weicht in Inhalt und Zusammenhang vollständig vom griechischen Sirach 30,22 ab und dürfte an dieser Stelle gestört, versetzt oder anders zugeordnet sein. Eine sichere Rekonstruktion daraus ist nicht möglich. Die griechische Fassung bietet dagegen einen klaren, kontextgerechten Vers; die textliche Spannung wird nicht verschwiegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Herzensfreude“ ist knapp und verständlich; die Unterscheidung zwischen „Mensch“ (ἄνθρωπος) und „Mann“ (ἀνήρ) bleibt sichtbar. Die bildhafte Wendung „seine Tage verlängert“ bewahrt den biblischen Sprachklang.
