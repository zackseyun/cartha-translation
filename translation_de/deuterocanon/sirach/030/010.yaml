  text: Do not laugh with him[a], lest you share his pain, and in the end you will gnash your teeth.
translation:
  language: de
  text: Lach nicht mit ihm, damit du nicht mit ihm leiden musst und am Ende mit den Zähnen knirschst.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συγγελάσῃς
  choice: Lach nicht mit ihm
  rationale: Das Kompositum bezeichnet ein Mitlachen beziehungsweise die Teilnahme am Lachen des anderen. „Mit ihm lachen“ ist im Deutschen natürlich und wahrt diese Beteiligung.
- source_word: συνοδυνηθῇς
  choice: damit du nicht mit ihm leiden musst
  rationale: Das Verb bezeichnet gemeinsames Leiden oder gemeinsamen Schmerz. Die deutsche Wendung gibt sowohl das Mitbetroffensein als auch den warnenden Zusammenhang idiomatisch wieder.
- source_word: ἐπʼ ἐσχάτῳ
  choice: am Ende
  rationale: Die Wendung verweist auf den schließlichen Ausgang und wird knapp und natürlich wiedergegeben.
- source_word: γομφιάσεις τοὺς ὀδόντας σου
  choice: mit den Zähnen knirschst
  rationale: Die Verbindung bezeichnet das Mahlen oder Knirschen mit den Zähnen als Ausdruck späteren Leids oder Verdrusses. Das deutsche Idiom erfordert nicht zusätzlich das Possessivpronomen „deinen“.
