  text: As long as you still live and breath is in you[a], do not give yourself over to any flesh.
translation:
  language: de
  text: Solange du noch lebst und Atem in dir ist, liefere dich keinem Menschen aus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »liefere dich keinem Fleisch aus«; »Fleisch« meint hier wahrscheinlich einen Menschen beziehungsweise einen Sterblichen.'
    reason: lexikalische Alternative und Erklärung der griechischen Bildsprache
lexical_decisions:
- source_word: ἕως ἔτι ζῇς
  choice: Solange du noch lebst
  rationale: Die temporale Wendung bezeichnet die fortdauernde Lebenszeit; »noch« gibt das betonte ἔτι wieder.
- source_word: πνοὴ ἐν σοί
  choice: Atem in dir ist
  rationale: Die körperhafte Vorstellung des Lebensatems bleibt eng am griechischen Ausdruck erhalten und klingt im Deutschen natürlich.
- source_word: μὴ ἀλλάξῃς σεαυτὸν
  choice: liefere dich nicht … aus
  rationale: ἀλλάσσω bedeutet gewöhnlich »ändern« oder »tauschen«; mit dem Reflexivpronomen und dem folgenden Dativ liegt hier jedoch wahrscheinlich die Warnung nahe, sich einem anderen zu überlassen oder seiner Verfügung zu unterstellen. Die Übersetzung gibt diesen Sinn verständlich wieder, ohne die Wendung als bloße innere Veränderung misszuverstehen.
- source_word: πάσῃ σαρκί
  choice: keinem Menschen
  rationale: Das distributiv gebrauchte πᾶς mit dem Singular σάρξ meint hier wahrscheinlich keinen Menschen bzw. keinen Sterblichen. Im Haupttext steht die natürliche deutsche Bedeutung; die Fußnote bewahrt das konkrete griechische Bild »Fleisch«.
theological_decisions:
- issue: Bedeutung von σάρξ in einem weisheitlichen, nicht paulinischen Zusammenhang
  choice: Mensch
  alternative: Fleisch; Sterblicher
  rationale: σάρξ bezeichnet hier wahrscheinlich den sterblichen Menschen und nicht eine besondere Lehre von einer sündigen Natur. »Mensch« vermeidet eine missverständliche Technisierung; die wörtliche Bildsprache wird in der Fußnote offengelegt.
- issue: Deutung von ἀλλάξῃς mit reflexivem Objekt und Dativ
  choice: sich jemandem ausliefern
  alternative: sich gegen jemanden eintauschen; sich ändern
  rationale: Die genaue Konstruktion ist ungewöhnlich. Der Zusammenhang legt eine Verfügung über die eigene Person nahe; deshalb wird eine idiomatische, aber nicht unnötig spezifizierende Warnung formuliert. Die lexikalische Spannung wird nicht zu einer Aussage über innere Verwandlung umgedeutet.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau folgt der knappen Mahnrede des Griechischen. Die ungewöhnliche Wendung »jedem Fleisch« wird im Haupttext idiomatisch als »keinem Menschen« wiedergegeben und in der Fußnote transparent gemacht.
