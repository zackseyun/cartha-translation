base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/030/017.yaml
  text: Death is better than a life of emptiness[b][a], and eternal rest than unrelenting pain.
translation:
  language: de
  text: Sterben ist besser als ein Leben in Nichtigkeit[a] und ewige Ruhe besser als unablässiger Schmerz.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Parallele lautet: „Sterben ist besser als ein bitteres Leben.“ Der hebräische Text spricht von einem „Leben in Nichtigkeit“.'
    reason: alternative_reading
  - marker: b
    text: Die griechische Parallele hat hier „eine andauernde Krankheit/ein bleibendes Leiden“, während der hebräische Text von beständigem Schmerz spricht.
    reason: lexical_alternative
lexical_decisions:
- source_word: טוב למות
  choice: Sterben ist besser
  rationale: טוב hat in der Vergleichskonstruktion mit מ־ komparative Bedeutung. Der substantivierte Infinitiv „Sterben“ gibt למות natürlich und sprichwortartig wieder; die griechische Parallele bestätigt den Vergleich.
- source_word: מחיי שוא
  choice: als ein Leben in Nichtigkeit
  rationale: חיי bezeichnet hier das Leben, während שוא Leere, Nichtigkeit oder Vergeblichkeit ausdrückt. „Ein Leben in Nichtigkeit“ bleibt dem hebräischen Bild nahe, ohne es vorschnell als bloß „sinnlos“ auszudeuten.
- source_word: ונוחת עולם
  choice: und ewige Ruhe besser
  rationale: נוחה bezeichnet Ruhe oder Rast; עולם drückt unbegrenzte beziehungsweise dauerhafte Zeit aus. Das im Hebräischen ausgesparte „besser“ wird im Deutschen zur Klarheit wiederholt.
- source_word: מכאב נאמן
  choice: als unablässiger Schmerz
  rationale: כאב bedeutet „Schmerz“. נאמן heißt grundlegend fest, zuverlässig oder beständig und kennzeichnet den Schmerz hier als anhaltend; „unablässig“ gibt diese Dauer idiomatisch wieder.
theological_decisions:
- issue: Abweichung zwischen hebräischem und griechischem Text im ersten Vergleich
  choice: Im Haupttext dem Hebräischen „Leben in Nichtigkeit“ folgen
  alternative: „bitteres Leben“ nach der griechischen Parallele
  rationale: Der erhaltene hebräische Text ist hier die hoch bewertete Primärgrundlage. Die griechische Fassung bestätigt die Vergleichsstruktur, bietet jedoch eine andere Charakterisierung des Lebens; diese wird in einer Fußnote transparent gemacht.
- issue: Bedeutung von עולם in der Weisheitsaussage
  choice: „ewige Ruhe“
  alternative: „immerwährende Ruhe“ oder „Ruhe für immer“
  rationale: „Ewig“ bewahrt die zeitliche Weite des hebräischen Ausdrucks und seine Spannung zum fortdauernden Schmerz, ohne eine weitergehende Lehre über das Jenseits in den Vers einzutragen.
translation_notes:
  register: Moderne, würdige und sprichwortartige Standardsprache. Die parallele Vergleichsform wird im Deutschen durch die Wiederholung von „besser“ verdeutlicht; die hebräische Kürze und die theologische Spannung bleiben erhalten.
