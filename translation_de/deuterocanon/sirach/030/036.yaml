  text: Setze ihn zur Arbeit ein, damit er nicht untätig bleibt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔμβαλε
  choice: Setze … ein
  rationale: Der Aoristimperativ von ἐμβάλλω bezeichnet hier idiomatisch, jemanden in eine Tätigkeit zu versetzen. „Setze … ein“ gibt den Aufforderungscharakter natürlich wieder, ohne das wörtliche „wirf“ zu übernehmen.
- source_word: αὐτὸν
  choice: ihn
  rationale: Das maskuline Akkusativpronomen bezieht sich im Kontext auf eine männliche Person.
- source_word: εἰς ἐργασίαν
  choice: zur Arbeit
  rationale: Die Verbindung bezeichnet das Hineinversetzen in eine produktive Tätigkeit. „Zur Arbeit einsetzen“ ist im modernen Deutschen idiomatisch und bewahrt den Bezug auf Arbeit.
- source_word: ἵνα μὴ ἀργῇ
  choice: damit er nicht untätig ist
  rationale: ἵνα mit μή drückt den verneinten Zweck aus; ἀργέω meint hier Untätigkeit. „Untätig“ vermeidet die stärkere moralische Wertung von „faul“.
