  text: Do not look with your eyes and groan[a], like a eunuch embracing a young woman.
translation:
  language: de
  text: Er sieht mit eigenen Augen und seufzt wie ein Eunuch, der eine junge Frau umarmt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Parallelfassung lautet: »Überlass deine Seele nicht dem Kummer und quäle dich nicht in deinem Entschluss.« Sie formuliert eine direkte Mahnung, während der hebräische Text das Bild enttäuschter Sehnsucht bewahrt.'
    reason: alternative_reading
lexical_decisions:
- source_word: ראה בעיניו
  choice: Er sieht es mit eigenen Augen
  rationale: 'Die hebräische Formulierung bietet am natürlichsten eine Aussage in der dritten Person: »er sieht mit seinen Augen«. »Mit eigenen Augen« gibt die Wendung idiomatisch wieder; das sachlich erforderliche Objekt wird im Deutschen durch »es« ausgedrückt.'
- source_word: ומתאנח
  choice: und seufzt
  rationale: Das Verb bezeichnet hörbar ausgedrückten Kummer. »Seufzt« ist im Deutschen natürlich und würdevoll; »stöhnt« könnte hier unnötig körperlich oder sexuell verstanden werden.
- source_word: כאשר
  choice: wie
  rationale: Leitet den folgenden Vergleich knapp und natürlich ein.
- source_word: סריס
  choice: Eunuch
  rationale: Das Bild beruht hier auf sexueller Unfähigkeit oder verwehrter Erfüllung, nicht auf der möglichen Amtsbezeichnung »Hofbeamter«.
- source_word: יחבק
  choice: der … umarmt
  rationale: Das hebräische Imperfekt wird innerhalb des Vergleichs als anschauliche, allgemein formulierte Handlung wiedergegeben.
- source_word: נערה
  choice: eine junge Frau
  rationale: Die Wiedergabe ist modern und vermeidet sowohl die mögliche kindliche Konnotation von »Mädchen« als auch das altertümliche »Jungfrau«.
theological_decisions:
- issue: Verhältnis der hebräischen und griechischen Versgestalt
  choice: Die erhaltene hebräische Bildaussage wird im Haupttext als Aussage in der dritten Person übersetzt.
  alternative: 'Eine Mahnung in der zweiten Person nach dem Griechischen: »Überlass deine Seele nicht dem Kummer und quäle dich nicht mit deinen Überlegungen.«'
  rationale: Im Hebräischen stehen »seinen Augen« und das anschließende Partizip am natürlichsten in der dritten Person; eine Verneinung ist dort nicht ausdrücklich vorhanden. Die deutlich abweichende griechische Fassung wird daher nicht stillschweigend in den Haupttext eingetragen, sondern in der Fußnote vollständig dokumentiert.
translation_notes:
  register: Modernes, klares Standarddeutsch mit bewusst beibehaltener Schärfe des hebräischen Vergleichs. Die griechische Parallelüberlieferung wird transparent in der Fußnote geboten, ohne ihre Mahnform in den anderslautenden hebräischen Haupttext einzutragen.
