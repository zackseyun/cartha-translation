  language: en
  yaml_path: translation/deuterocanon/sirach/030/011.yaml
  text: Do not give him free rein in his youth, and do not overlook his destructive behavior.
translation:
  language: de
  text: Lass ihm in seiner Jugend nicht freie Hand[a], und sieh nicht über sein verderbliches Verhalten hinweg.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Gib ihm in seiner Jugend keine Vollmacht.“ Das hebräische Verb kann bedeuten, jemanden herrschen zu lassen oder ihm Verfügungsgewalt einzuräumen; entsprechend hat auch der griechische Paralleltext „Vollmacht“.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch: „seine Verderbtheiten“; gemeint sein können verderbliche Eigenschaften oder schädliche Handlungen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תמשילהו
  choice: Lass ihm … nicht freie Hand
  rationale: Die Hifil-Form von משל bezeichnet hier, jemanden herrschen zu lassen oder ihm Verfügungsgewalt einzuräumen. „Freie Hand lassen“ gibt dies im erzieherischen Zusammenhang natürlich wieder; das griechische ἐξουσίαν bestätigt den Gedanken von Vollmacht oder Freiheit.
- source_word: בנעוריו
  choice: in seiner Jugend
  rationale: Die Zeitangabe wird knapp und unmittelbar wiedergegeben.
- source_word: תשא
  choice: sieh nicht … hinweg
  rationale: נשא kann „tragen“ oder „aufheben“ und in diesem Zusammenhang auch „hinnehmen, übergehen“ bedeuten. Die Wendung „über etwas hinwegsehen“ trifft den Sinn, ohne das theologisch stärker besetzte „vergeben“ einzutragen.
- source_word: לשחיתותיו
  choice: sein verderbliches Verhalten
  rationale: שחיתותיו kann seine Verderbtheiten, schädlichen Handlungen oder sein verderbliches Verhalten bezeichnen. Die gewählte Formulierung ist verständlich und bewahrt den Bezug zu moralisch wie praktisch schädlichem Tun.
theological_decisions:
- issue: Erzieherische Autorität und jugendliche Freiheit
  choice: Keine uneingeschränkte Freiheit gewähren
  alternative: Ihn nicht herrschen lassen / ihm keine Vollmacht geben
  rationale: Der Text warnt vor unkontrollierter Eigenmacht in der Jugend, ohne eine umfassende Lehre über elterliche Herrschaft oder die moralische Unfähigkeit Jugendlicher daraus abzuleiten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Freie Hand lassen“ ist idiomatisch, aber nicht salopp; „verderbliches Verhalten“ wahrt die stärkere Bedeutung von שחיתות gegenüber dem allgemeineren „Fehler“.
