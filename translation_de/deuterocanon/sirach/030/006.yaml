translation:
  language: de
  text: Vor seinen Feinden hinterließ er einen Rächer[a] und für seine Freunde einen, der erwiesene Güte erwidert.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »einen, der Recht verschafft« beziehungsweise »einen Verteidiger«; das griechische Wort kann jemanden bezeichnen, der für einen anderen Recht oder Vergeltung durchsetzt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐναντίον ἐχθρῶν
  choice: Gegenüber seinen Feinden
  rationale: ἐναντίον mit dem Genitiv bezeichnet hier die Stellung des zurückgelassenen Sohnes im Verhältnis zu den Feinden. „Gegenüber“ bewahrt den konfrontativen, zugleich aber nicht überdeuteten Sinn.
- source_word: κατέλιπεν
  choice: hinterließ
  rationale: Das Verb bezeichnet im Zusammenhang, was der Vater in seinem Sohn nach sich zurücklässt. „Hinterließ“ ist knapp, natürlich und enthält bereits den Gedanken des Zurücklassens.
- source_word: ἔκδικον
  choice: einen Rächer
  rationale: ἔκδικος kann jemanden bezeichnen, der Recht verschafft oder Vergeltung übt. „Rächer“ erhält hier die starke, möglicherweise vergeltende Bedeutung, ohne sie moralisch zu bewerten.
- source_word: τοῖς φίλοις
  choice: für seine Freunde
  rationale: Der Dativ bezeichnet die Personen, zu deren Gunsten der Sohn handelt. Das Possessivpronomen ist im Deutschen aus dem Zusammenhang natürlich ergänzt und stellt die symmetrische Beziehung zu „seinen Feinden“ her.
- source_word: ἀνταποδιδόντα
  choice: einen, der … vergilt
  rationale: Das Partizip drückt erwidernde beziehungsweise entsprechende Rückgabe aus. „Vergilt“ gibt diese Gegenseitigkeit prägnant wieder.
- source_word: χάριν
  choice: Güte
  rationale: χάρις bezeichnet hier erwiesenes Wohlwollen oder eine Wohltat, die erwidert wird. „Güte“ ist verständlich und vermeidet den in diesem Zusammenhang zu stark theologischen Klang von „Gnade“.
theological_decisions:
- issue: Moralische Wertung von ἔκδικον im Zusammenhang von Familie, Ehre und Feindschaft
  choice: Rächer
  alternative: Rechtsbeistand; Verteidiger
  rationale: Der griechische Ausdruck lässt sowohl Rechtsdurchsetzung als auch Vergeltung anklingen. Der Haupttext bewahrt mit „Rächer“ die stärkere Spannung; die Fußnote nennt die weniger vergeltenden Möglichkeiten, ohne den Text einseitig festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau hält die Parallelität zwischen Feinden und Freunden aufrecht; „Güte vergilt“ ist bewusst knapp und leicht gehoben, aber allgemein verständlich.
