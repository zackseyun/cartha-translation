translation:
  language: de
  text: Welchen Wert haben die Götzen der Völker, die weder essen noch riechen?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Text fügt hinzu: „So ist es mit dem, der vom Herrn verfolgt wird.“'
    reason: alternative_reading
lexical_decisions:
- source_word: מה יעריכו
  choice: Welchen Wert haben
  rationale: Die hebräische Wendung stellt eine rhetorische Frage nach Wert beziehungsweise Nutzen. Die gewählte Formulierung gibt diesen Sinn in natürlichem Deutsch wieder, ohne die Aussage unnötig auszudeuten.
- source_word: לאלילי הגוים
  choice: die Götzen der Völker
  rationale: אלילי bezeichnet machtlose Götzen, הגוים die Völker. „Der Völker“ bleibt nah am Hebräischen und vermeidet die stärker kirchlich geprägte Bezeichnung „Heiden“.
- source_word: אשר לא יאכלון
  choice: die weder essen
  rationale: Der Relativsatz beschreibt unmittelbar die Leblosigkeit der Götzen. „Weder“ eröffnet die zweigliedrige Verneinung idiomatisch.
- source_word: ולא יריחון
  choice: noch riechen
  rationale: ריח bedeutet hier schlicht „riechen“. Die knappe Wiedergabe bewahrt den sinnlichen Gegensatz zu lebenden Wesen und deutet keinen bestimmten Opfergeruch in den Text hinein.
theological_decisions:
- issue: Ob die nur im griechischen Paralleltext bezeugte Fortsetzung in den Haupttext aufgenommen wird
  choice: Der Haupttext folgt dem erhaltenen hebräischen Wortlaut; die griechische Fortsetzung steht in einer Fußnote.
  alternative: „So ist auch, wer vom Herrn verstoßen wird.“ in den Haupttext aufnehmen.
  rationale: Da der hebräische Text an dieser Stelle erhalten und als primäre Quelle ausgewiesen ist, bestimmt er den Haupttext. Die bedeutende griechische Erweiterung wird transparent dokumentiert, aber nicht mit dem hebräischen Wortlaut vermischt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, knappem Weisheitsspruch-Stil. Die rhetorische Frage und die parallele Verneinung des Hebräischen bleiben erhalten.
