base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/030/009.yaml
  text: Discipline your son[a], lest you be put to shame; but if you play with him, he will humiliate you.
translation:
  language: de
  text: Erziehe deinen Sohn,[a] damit du nicht beschämt wirst; doch wenn du mit ihm spielst, wird er dich demütigen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Griechisch: „Umsorge (oder: verzärtle) ein Kind, und es wird dich in Erstaunen versetzen; spiele mit ihm, und es wird dich betrüben.“ Der hebräische Text lautet dagegen: „Erziehe deinen Sohn … er wird dich demütigen.“'
    reason: alternative_reading
lexical_decisions:
- source_word: יסר
  choice: Erziehe ... mit Strenge
  rationale: Das hebräische Verb יסר bezeichnet korrigierende Erziehung oder Zucht. Die Formulierung gibt diesen elterlichen Korrekturaspekt in verständlichem modernem Deutsch wieder, ohne körperliche Züchtigung ausdrücklich festzulegen.
- source_word: בנך
  choice: deinen Sohn
  rationale: Das Hebräische nennt ausdrücklich den Sohn im maskulinen Singular; dies wird nicht zu „Kind“ verallgemeinert.
- source_word: לבל תבוש
  choice: damit du nicht beschämt wirst
  rationale: לבל drückt hier Vorbeugung beziehungsweise Zweck aus. Das Passiv „beschämt wirst“ wahrt den sozialen Ehr- und Schamaspekt des Verbs בוש.
- source_word: תשחק עמו
  choice: wenn du mit ihm spielst
  rationale: שחק bedeutet seinem unmittelbaren Sinn nach „spielen“ oder „lachen“. Auch die griechische Parallele σύνπαιξον stützt „mit ihm spielen“. Eine Deutung als nachgiebiges Verwöhnen wird nicht in den Haupttext eingetragen.
- source_word: יכלימך
  choice: wird er dich demütigen
  rationale: כלם bezeichnet das Beschämen oder Demütigen. „Dich demütigen“ bewahrt die aktive Wirkung des Sohnes und vermeidet eine schwerfällige unmittelbare Wiederholung von „beschämt“.
theological_decisions:
- issue: Vorrang des erhaltenen hebräischen Textes gegenüber der abweichenden griechischen Parallele
  choice: Der Haupttext folgt dem gut bezeugten hebräischen Wortlaut.
  alternative: 'Nach der griechischen Parallele: „Umsorge/verzärtle ein Kind, und es wird dich bestürzen; spiele mit ihm, und es wird dich betrüben.“'
  rationale: Der erhaltene hebräische Text ist hier sicher und ergibt eine zusammenhängende Mahnung zur elterlichen Erziehung. Die griechische Fassung bestätigt das Motiv des Mitspielens, weicht aber beim ersten Verb und bei den Folgen ab; diese echte textliche Differenz wird in der Fußnote offengelegt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Mit Strenge erziehen“ vermittelt korrigierende Disziplin, ohne eine bestimmte Erziehungsmethode festzuschreiben. Der konkrete Ausdruck „mit ihm spielen“ bleibt trotz seiner im Zusammenhang möglichen Bedeutung von übermäßiger Nachgiebigkeit erhalten.
