  text: For it is better that your children should beg from you than that you look to the hands of your sons[a].
translation:
  language: de
  text: Denn es ist besser, dass deine Kinder dich bitten, als dass du auf die Hände deiner Söhne schaust.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sinngemäß: »als dass du auf die Unterstützung deiner Söhne angewiesen bist«. Wörtlich heißt es im Griechischen: »auf die Hände deiner Söhne schaust«.'
    reason: Erläuterung der idiomatischen Bedeutung bei Bewahrung der griechischen Bildsprache.
lexical_decisions:
- source_word: κρεῖσσον
  choice: besser
  rationale: Die geläufige deutsche Vergleichsform gibt die Bedeutung »besser, vorzuziehen« natürlich und präzise wieder.
- source_word: τὰ τέκνα
  choice: deine Kinder
  rationale: τέκνα bezeichnet allgemein Kinder beziehungsweise Nachkommen; das zu δεηθῆναι gehörende σου wird im Deutschen zugleich als Objekt von »bitten« ausgedrückt.
- source_word: δεηθῆναί σου
  choice: dich bitten müssen
  rationale: δέομαι mit einer Person im Genitiv kann »jemanden bitten/anflehen« bedeuten. »bitten müssen« wahrt sowohl den Vorgang des Bittens als auch die durch den Zusammenhang nahegelegte Bedürftigkeit, ohne sie ausdrücklich als Betteln festzulegen.
- source_word: ἐμβλέπειν εἰς χεῖρας
  choice: auf die Hände … schauen
  rationale: Die konkrete Bildsprache des Griechischen bleibt erhalten; gemeint ist wahrscheinlich das erwartungsvolle Schauen auf die Hand dessen, von dem man Versorgung erhofft.
- source_word: υἱῶν
  choice: Söhne
  rationale: Das geschlechtsspezifische υἱῶν wird als »Söhne« wiedergegeben und nicht mit dem allgemeineren τέκνα der ersten Satzhälfte gleichgesetzt.
theological_decisions:
- issue: Geschlechtsspezifische Familienbezeichnung im zweiten Satzteil
  choice: Söhne
  alternative: Kinder
  rationale: Der griechische Text unterscheidet zwischen τέκνα (Kinder) und υἱοί (Söhne); diese erkennbare Unterscheidung wird bewahrt.
- issue: Bild für wirtschaftliche Abhängigkeit
  choice: auf die Hände deiner Söhne schaust
  alternative: auf die Unterstützung deiner Söhne angewiesen bist
  rationale: Der Haupttext bewahrt das körperlich-konkrete Bild des Ausgangstextes. Die wahrscheinliche übertragene Bedeutung wird in der Fußnote erläutert, statt die Bildsprache stillschweigend aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bleibt knapp und sprichwortartig. »Bitten müssen« ist bewusst weniger zugespitzt als »betteln« oder »anflehen« und lässt die Bedeutungsbreite von δέομαι im Zusammenhang offen.
