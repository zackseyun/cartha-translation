  source_fidelity: Der deutsche Haupttext gibt den kurzen hebräischen Text sachgerecht wieder. „Überlass deine Seele nicht dem Kummer“ bildet אל תתן ... לדין angemessen ab; die schwierige Deutung von לדין wird nicht als sichere hebräische Lesung ausgegeben, sondern zutreffend durch die Fußnote mit Rückgriff auf den griechischen Paralleltext abgesichert. „Komm nicht durch deine Schuld zu Fall“ gibt ואל תכשל בעונך idiomatisch und inhaltlich treffend wieder, ohne die Mehrdeutigkeit von עון unnötig einzuengen.
