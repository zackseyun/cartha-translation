  terminology: „Seele“ wahrt נפשך und die Entsprechung zu ψυχή. „Kummer“ ist für die aufgrund des Griechischen gestützte Deutung von לדין gut gewählt. „Schuld“ ist für בעונך angemessen und vermeidet eine konfessionell aufgeladene oder unnötig technische Formulierung.
