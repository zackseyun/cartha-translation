  text: Do not give your soul over to grief[b][a], and do not stumble in your iniquity.
translation:
  language: de
  text: Überlass deine Seele nicht dem Kummer[a][b], und komm nicht durch deine Schuld zu Fall.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische לדין ist schwierig. Der griechische Paralleltext stützt die Bedeutung „Kummer“ oder „Trauer“; nach dem bloßen hebräischen Konsonantenbestand wäre auch ein Bezug auf „Gericht“ denkbar.
    reason: lexical_alternative
  - marker: b
    text: 'Der griechische Text ist hier erheblich länger: „Liebe deine Seele und tröste dein Herz; halte den Kummer fern von dir. Denn der Kummer hat viele getötet, und er bringt keinen Nutzen.“ Der erhaltene hebräische Text ist kürzer.'
    reason: alternative_reading
lexical_decisions:
- source_word: אל תתן
  choice: Überlass ... nicht
  rationale: Die Wendung mit נתן bezeichnet hier das Überlassen oder Ausliefern an einen beherrschenden Zustand. „Überlass ... nicht“ ist natürliches Deutsch und wahrt den warnenden Charakter.
- source_word: לדין
  choice: dem Kummer
  rationale: Die hebräische Form ist schwierig. Der griechische Paralleltext mit λύπη stützt deutlich den Sinn „Kummer/Trauer“; „Kummer“ passt idiomatisch zur Aufforderung, die eigene Seele diesem Zustand nicht preiszugeben.
- source_word: נפשך
  choice: deine Seele
  rationale: נפש kann Seele, Leben oder Selbst bezeichnen. „Deine Seele“ bleibt nahe am Hebräischen und entspricht zugleich dem griechischen ψυχή.
- source_word: ואל תכשל
  choice: und komm nicht ... zu Fall
  rationale: כשל bezeichnet Stolpern, Straucheln oder Zu-Fall-Kommen. Die deutsche Wendung bewahrt das Bild, klingt hier aber natürlicher als das wörtlichere „strauchle nicht“.
- source_word: בעונך
  choice: durch deine Schuld
  rationale: עון kann Vergehen, Schuld oder deren Folgen bezeichnen. „Durch deine Schuld“ bewahrt die moralische Mehrdeutigkeit und ergibt mit כשל eine natürliche deutsche Aussage.
theological_decisions:
- issue: Hebräischer Kurztext gegenüber dem erheblich längeren griechischen Paralleltext
  choice: Der Haupttext folgt der erhaltenen kurzen hebräischen Fassung; der griechische Text dient zur Klärung des schwierigen לדין und wird in einer Fußnote vollständig wiedergegeben.
  alternative: 'Dem längeren Griechisch folgen: „Liebe deine Seele und tröste dein Herz; halte den Kummer fern von dir. Denn der Kummer hat viele getötet, und er bringt keinen Nutzen.“'
  rationale: Wo der hebräische Sirachtext erhalten ist, hat er Vorrang. Die griechische Überlieferung ist hier dennoch wichtig als frühes Zeugnis für den Sinn des schwierigen hebräischen Ausdrucks und für eine längere Textform.
- issue: Deutung von לדין
  choice: „dem Kummer“
  alternative: „dem Gericht“
  rationale: Die Konsonantenfolge lässt isoliert eine Beziehung zu „Gericht“ erwägen, doch der griechische Paralleltext wiederholt λύπη („Kummer, Trauer“) und bietet damit starke textgeschichtliche Unterstützung für die gewählte Bedeutung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Überlass deine Seele nicht dem Kummer“ bildet die hebräische Warnung verständlich ab; „komm ... zu Fall“ erhält die Bildlichkeit von כשל, ohne unnötig altertümlich zu wirken.
