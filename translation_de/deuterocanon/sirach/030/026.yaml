  text: For anger has killed many[b][a], and there is no benefit in wrath.
translation:
  language: de
  text: Denn Zorn hat viele getötet[b], und im Grimm liegt kein Nutzen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die angegebene griechische Parallele bietet einen anderen Spruch: »Bedenkt, dass ich mich nicht nur für mich selbst abgemüht habe, sondern für alle, die Unterweisung suchen.« Das weist auf eine abweichende Verszählung oder Textüberlieferung hin. Die Übersetzung folgt hier dem erhaltenen hebräischen Text.'
    reason: textual_variant
  - marker: b
    text: Das mit »Zorn« wiedergegebene hebräische Wort ist in seiner Form beziehungsweise Lesart unsicher. Die Übersetzung ergibt sich aus dem Zusammenhang und dem parallelen »Grimm« im zweiten Satzteil.
    reason: lexical_alternative
lexical_decisions:
- source_word: כי
  choice: Denn
  rationale: Leitet knapp die Begründung für die vorausgehende Mahnung ein und entspricht dem weisheitlichen Zusammenhang.
- source_word: רבים
  choice: viele
  rationale: Gibt den unbestimmten quantitativen Ausdruck natürlich und mit seiner sprichwörtlichen Weite wieder.
- source_word: הרג
  choice: hat … getötet
  rationale: Das Verb bezeichnet Töten; das deutsche Perfekt formuliert eine allgemein bestätigte Erfahrung in natürlicher Weise.
- source_word: דין
  choice: Zorn
  rationale: Die Form bzw. Lesart ist unsicher. Der Parallelismus mit קצפון legt hier eine Gemütsregung wie Zorn nahe, nicht die gewöhnliche Bedeutung »Gericht/Recht«.
- source_word: ואין
  choice: und … kein
  rationale: Bewahrt die koordinierende Verbindung und die existentielle Verneinung idiomatisch.
- source_word: תעלה
  choice: Nutzen
  rationale: Bezeichnet Vorteil, Gewinn oder Nutzen; »Nutzen« ist klar, modern und für einen Weisheitsspruch passend.
- source_word: בקצפון
  choice: im Grimm
  rationale: Gibt die Präposition wieder und bezeichnet heftigen Zorn. »Grimm« wahrt zugleich eine leichte lexikalische Unterscheidung gegenüber »Zorn« im ersten Halbvers.
theological_decisions:
- issue: Vorrang des erhaltenen hebräischen Zeugnisses trotz der erheblichen Abweichung der angegebenen griechischen Parallele
  choice: Der Haupttext folgt dem erhaltenen Hebräisch; die abweichende griechische Lesart wird in einer Fußnote offengelegt.
  alternative: 'Nach der angegebenen griechischen Parallele: »Bedenkt, dass ich mich nicht nur für mich selbst abgemüht habe, sondern für alle, die Unterweisung suchen.«'
  rationale: Wo der hebräische Text des Sirach erhalten ist, bildet er die primäre Grundlage. Die griechische Parallele entspricht inhaltlich offensichtlich einem anderen Spruch beziehungsweise einer abweichenden Verszuordnung und kann daher den Haupttext nicht bestimmen.
translation_notes:
  register: Knappes, würdiges und allgemein verständliches modernes Deutsch. Die beiden Halbverse bleiben parallel gebaut; »Zorn« und »Grimm« geben die verwandten, aber nicht identischen hebräischen Ausdrücke wieder. Sämtliche Fußnotenmarker stehen im Haupttext.
