  text: Jealousy and anger shorten days[b][a], and anxiety brings old age before its time.
translation:
  language: de
  text: Neid und Zorn verkürzen die Lebenstage[a][b], und Sorge lässt einen vor der Zeit alt werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort דין ist hier schwer zu deuten. Es kann „Zorn“, möglicherweise aber auch „Streit“ oder „Gericht“ bedeuten.
    reason: lexical_alternative
  - marker: b
    text: Der hier angegebene griechische Paralleltext gehört inhaltlich offenbar zu einer anderen Stelle und entspricht diesem Vers nicht. Daher folgt die Übersetzung dem hebräischen Textzeugen.
    reason: textual_variant
lexical_decisions:
- source_word: קנאה
  choice: Neid
  rationale: Im weisheitlichen Zusammenhang bezeichnet das Wort eine zerstörerische Haltung, nicht positiven Eifer. „Neid“ ist im modernen Deutschen hier natürlicher und eindeutiger als „Eifersucht“.
- source_word: דין
  choice: Zorn
  rationale: Das gewöhnlich mit Recht, Gericht oder Streit verbundene Wort ist an dieser Stelle schwierig. Parallel zu „Neid“ liegt eine schädliche feindselige Gemütslage nahe; „Zorn“ gibt diesen Sinn verständlich wieder, während andere Möglichkeiten in der Fußnote erhalten bleiben.
- source_word: יקצרו ימים
  choice: verkürzen die Lebenstage
  rationale: Die Wiedergabe bewahrt das hebräische Bild der verkürzten Tage und macht zugleich deutlich, dass eine verkürzte Lebenszeit gemeint ist.
- source_word: ובלא עת
  choice: vor der Zeit
  rationale: Die idiomatische Wendung bezeichnet ein vorzeitiges Geschehen und lässt sich im Deutschen knapp und natürlich so wiedergeben.
- source_word: תזקין
  choice: lässt einen … alt werden
  rationale: Das Verb bedeutet „alt werden“. Die deutsche kausative Form bringt zum Ausdruck, dass die Sorge vorzeitiges Altern bewirkt.
- source_word: דאגה
  choice: Sorge
  rationale: Das Wort bezeichnet bedrückende, ängstliche Sorge. „Sorge“ ist allgemein verständlich und passt zum prägnanten Stil des Weisheitsspruchs.
