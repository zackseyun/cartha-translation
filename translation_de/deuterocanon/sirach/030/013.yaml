  text: Discipline your son and make his yoke heavy[a], lest in his foolishness he consume you.
translation:
  language: de
  text: Weise deinen Sohn zurecht und mache sein Joch schwer, damit er dich nicht in seiner Torheit verschlingt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Paralleltext lautet: „Erziehe deinen Sohn und arbeite an ihm, damit er nicht wegen deiner Schande zu Fall kommt.“ Der hebräische Text hat dagegen: „damit er dich nicht in seiner Torheit verschlingt.“'
    reason: textual_variant
lexical_decisions:
- source_word: יסר
  choice: Weise … zurecht
  rationale: Das hebräische Verb bezeichnet korrigierende, erzieherische Zucht. „Zurechtweisen“ bewahrt diesen Gedanken in verständlichem, würdigem Deutsch; auch das griechische παιδεύω bestätigt den erzieherischen Sinn.
- source_word: והכבד עולו
  choice: mache sein Joch schwer
  rationale: Die konkrete hebräische Metapher wird bewusst erhalten, statt sie allgemein mit „belaste ihn“ wiederzugeben. Der griechische Paralleltext hat hier abweichend „arbeite an ihm“.
- source_word: עולו
  choice: sein Joch
  rationale: עֹל bedeutet wörtlich „Joch“. Das Bild steht hier für auferlegte Bindung und strenge Erziehung.
- source_word: פן
  choice: damit … nicht
  rationale: פן leitet die Warnung vor einer unerwünschten Folge ein. Die deutsche Konstruktion gibt dies natürlich und präzise wieder.
- source_word: באולתו
  choice: in seiner Torheit
  rationale: Die Formulierung folgt eng dem hebräischen Ausdruck und lässt offen, ob die Torheit als Umstand oder Ursache gedacht ist.
- source_word: יבלע בך
  choice: dich … verschlingt
  rationale: בלע bedeutet wörtlich „verschlingen“. Die bildhafte Aussage wird beibehalten und nicht deutend zu „dich zugrunde richtet“ abgeschwächt.
theological_decisions:
- issue: Abweichung zwischen dem erhaltenen hebräischen Text und dem griechischen Paralleltext
  choice: 'Der hebräische Text wird als Hauptlesart übersetzt: „damit er dich nicht in seiner Torheit verschlingt“'
  alternative: 'Der griechische Paralleltext lautet sinngemäß: „damit er nicht wegen deiner Schande zu Fall kommt“'
  rationale: Da für diesen Vers ein verlässlich bezeugter hebräischer Text vorliegt, hat er Vorrang. Die erheblich abweichende griechische Lesart wird jedoch transparent in einer Fußnote dokumentiert, ohne die Spannung zwischen den Textformen aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst beibehaltener Joch- und Verschlingungsmetaphorik. Die etwas markante Wendung „mache sein Joch schwer“ spiegelt gezielt die Bildsprache des hebräischen Textes.
