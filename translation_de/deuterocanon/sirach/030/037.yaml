translation:
  language: de
  text: Denn der Müßiggang hat viel Böses gelehrt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „großes Böses“; die griechische Formulierung kann sowohl die Menge als auch das Ausmaß des Bösen hervorheben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλὴν
  choice: viel
  rationale: Das Adjektiv bestimmt κακίαν im Akkusativ Singular. Zusammen mit der substantivierten Wiedergabe „Böses“ bezeichnet „viel“ am natürlichsten das Ausmaß beziehungsweise die Menge; auch „großes“ ist möglich und wird in der Fußnote genannt.
- source_word: γὰρ
  choice: denn
  rationale: „Denn“ bewahrt den erklärenden Anschluss an den vorausgehenden Zusammenhang.
- source_word: κακίαν
  choice: Böses
  rationale: κακία bezeichnet moralisch Schlechtes, Bosheit oder Laster. „Böses“ ist im Deutschen weit genug, bewahrt die moralische Aussage und fügt sich natürlich in die Wendung „viel Böses“.
- source_word: ἐδίδαξεν
  choice: hat ... gelehrt
  rationale: Das griechische Aoristverb wird mit dem deutschen Perfekt wiedergegeben, das in einem gegenwartsbezogenen Sinnspruch natürlich klingt. Die Metapher des Lehrens bleibt erhalten.
- source_word: ἡ ἀργία
  choice: der Müßiggang
  rationale: ἀργία bezeichnet Untätigkeit oder Müßiggang. „Müßiggang“ ist eine geläufige abstrakte Bezeichnung, die hier präziser und würdiger wirkt als „Faulheit“, ohne das Wort auf bloße Bewegungslosigkeit zu verengen.
theological_decisions: []
translation_notes:
  register: Kurzer, sprichwortartiger Satz in modernem, würdigem Standarddeutsch. Der erklärende Anschluss durch „Denn“ und das griechische Bild, wonach Müßiggang ein Lehrer des Bösen ist, bleiben erhalten.
