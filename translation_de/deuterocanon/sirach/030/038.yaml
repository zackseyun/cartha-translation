base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/030/038.yaml
  text: Put him to work as is fitting for him[a], and if he does not obey, make his fetters heavy. But do not be excessive with any flesh, and do nothing without judgment.
translation:
  language: de
  text: Setze ihn zu Arbeiten ein, wie es für ihn angemessen ist; und wenn er nicht gehorcht, mach seine Fußfesseln schwer. Doch geh bei keinem Menschen[a] zu weit und tu nichts ohne Abwägung[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »mit jedem Fleisch«; eine semitisch geprägte Ausdrucksweise für Menschen allgemein.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »ohne Urteil« beziehungsweise »ohne Unterscheidungsvermögen«.'
    reason: lexical_ambiguity
lexical_decisions:
- source_word: εἰς ἔργα κατάστησον
  choice: Setze ihn zu Arbeiten ein
  rationale: Die kausative Wendung bezeichnet, jemanden zur Arbeit beziehungsweise zu Aufgaben einzusetzen; die deutsche Formulierung ist nah am Griechischen und zugleich natürlich.
- source_word: καθὼς πρέπει αὐτῷ
  choice: wie es für ihn angemessen ist
  rationale: πρέπει bezeichnet das, was sich für jemanden schickt oder ihm angemessen ist, ohne die Art der Arbeit näher festzulegen.
- source_word: κἂν μὴ πειθαρχῇ
  choice: und wenn er nicht gehorcht
  rationale: πειθαρχέω meint Gehorsam gegenüber Autorität oder Ordnung. Das Verb nennt hier nicht ausdrücklich eine »Zucht« oder »Unterweisung«, daher wird kein zusätzliches Objekt eingefügt.
- source_word: βάρυνον τὰς πέδας αὐτοῦ
  choice: mach seine Fußfesseln schwer
  rationale: πέδαι sind insbesondere Fesseln an den Füßen; βαρύνω wird direkt mit »schwer machen« wiedergegeben, ohne das nicht ausdrücklich genannte »Festziehen« einzutragen.
- source_word: μὴ περισσεύσῃς ἐν πάσῃ σαρκί
  choice: geh bei keinem Menschen zu weit
  rationale: Die Wendung warnt vor übermäßigem Handeln gegenüber irgendeinem Menschen. Die natürliche deutsche Wiedergabe erschließt den Sinn; eine Fußnote bewahrt das Bild »alles Fleisch«.
- source_word: ἄνευ κρίσεως μὴ ποιήσῃς μηδέν
  choice: tu nichts ohne Abwägung
  rationale: κρίσις kann Urteil, Entscheidung oder Unterscheidung bezeichnen. »Abwägung« passt zum weisheitlichen Aufruf zu besonnenem Handeln, ohne die Bedeutungsbreite völlig festzulegen.
theological_decisions:
- issue: Bedeutung von σάρξ im weisheitlich-anthropologischen Zusammenhang
  choice: Mensch im Haupttext, mit wörtlicher Angabe in der Fußnote
  alternative: Fleisch
  rationale: σάρξ bezeichnet hier Menschen allgemein in ihrer leiblichen und vergänglichen Existenz, nicht einen besonderen theologischen Gegensatz. »Bei keinem Fleisch« wäre im modernen Deutschen missverständlich; die Fußnote erhält jedoch das Quellbild.
- issue: Bedeutungsbreite von κρίσις
  choice: Abwägung
  alternative: Urteil; Unterscheidungsvermögen
  rationale: Der Zusammenhang verlangt bedachtes, maßvolles Handeln. »Abwägung« ist idiomatisch, während die Fußnote die ebenfalls möglichen Nuancen offenhält.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Vers behält die harten Bilder von Arbeit und Fußfesseln bei, glättet jedoch die semitisch geprägte Wendung »alles Fleisch« im Haupttext. Die beiden Imperative des abschließenden Warnsatzes sind knapp und allgemeinverständlich formuliert.
