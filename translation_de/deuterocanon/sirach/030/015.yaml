review_pass:
  verdict: revise
  source_fidelity: 'Der Entwurf folgt dem überlieferten hebräischen Wortlaut in zwei wesentlichen Punkten nicht: שַׂר bedeutet regulär „Fürst/Herrscher“, nicht „Armer“, und אִוִּיתִי ist eine Form der ersten Person („ich begehrte/habe ich begehrt“), nicht einfach ein prädikatives „ist besser“. Da der hebräische Wortlaut zugleich gegenüber dem Griechischen deutlich abweicht und schwierig ist, muss diese Unsicherheit in der Anmerkung erhalten bleiben.'
  naturalness: Die vorgeschlagene Fassung ist flüssig, aber die geglättete Vergleichsaussage verdeckt die erste Person des Hebräischen. Die Revision ist modernes, verständliches Standarddeutsch und gibt die elliptische Wiederaufnahme des Verbs im zweiten Glied natürlich wieder.
  terminology: „Fürst“ ist für שַׂר die naheliegende, registergerechte Wiedergabe. „Feingold“, „guter Geist“ und „Perlen“ sind angemessen. „Begehrt“ bildet אִוִּיתִי ab, ohne die Aussage zu einer objektiven Wertbehauptung umzudeuten.
  issues:
  - severity: high
    issue: שר wurde als „Armer“ übersetzt.
    rationale: Das hebräische שר bezeichnet gewöhnlich einen Fürsten, Oberen oder Herrscher. Eine Bedeutung „Armer“ ist für diese Form nicht tragfähig; die Übersetzung verändert daher die Aussage des erhaltenen hebräischen Textes.
  - severity: high
    issue: איביתי wurde als unpersönliches „ist besser“ wiedergegeben.
    rationale: Die Form ist trotz der textkritischen Schwierigkeit als erste Person von אוה/אוה („ich begehrte“) zu lesen. Die Vergleichsform des Griechischen kann diese hebräische Personenform nicht ohne Kennzeichnung ersetzen.
  revised_text: Das Leben eines Fürsten habe ich mehr begehrt als Feingold[a] und einen guten Geist mehr als Perlen.
  revised_footnotes:
  - marker: a
    text: 'Griechisch: „Gesundheit und Wohlbefinden sind besser als alles Gold, und ein kräftiger Körper ist besser als unermesslicher Reichtum.“ Der hebräische und der griechische Text weichen hier erheblich voneinander ab. Der erhaltene hebräische Wortlaut ist zudem schwierig; möglicherweise liegt eine abweichende Textüberlieferung oder eine Verderbnis des hebräischen Textes vor.'
    reason: textual_variant
  revision_rationale: 'Die Hauptfassung gibt den erhaltenen hebräischen Text so weit wie möglich wieder: „Leben eines Fürsten“ für חיי שר sowie die erste Person „habe ich ... begehrt“ für איביתי. Das im zweiten Satzglied nicht erneut geschriebene Verb wird im Deutschen sinnvoll mitgeführt. Die substantielle Abweichung der griechischen Parallelfassung bleibt in der Fußnote transparent, ohne deren glattere Vergleichsaussage in den hebräisch basierten Haupttext einzutragen.'
