  text: Life for the poor is better than refined gold[a], and a good spirit than pearls.
translation:
  language: de
  text: Das Leben eines Armen ist besser als Feingold[a], und ein guter Geist ist mehr wert als Perlen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Griechisch: „Gesundheit und Wohlbefinden sind besser als alles Gold, und ein kräftiger Körper ist besser als unermesslicher Reichtum.“ Der hebräische und der griechische Text weichen hier erheblich voneinander ab; möglicherweise liegt eine abweichende Textüberlieferung oder eine Verderbnis des erhaltenen hebräischen Textes vor.'
    reason: textual_variant
lexical_decisions:
- source_word: חיי
  choice: Das Leben
  rationale: Die Konstruktform von חַיִּים bezeichnet hier knapp und sprichwortartig das Leben einer Person.
- source_word: שר
  choice: eines Armen
  rationale: Der erhaltene hebräische Text wird hier als Bezeichnung für einen armen oder bedürftigen Menschen verstanden. Da die griechische Überlieferung stattdessen von Gesundheit spricht, bleibt die abweichende Lesart in der Fußnote sichtbar.
- source_word: איביתי
  choice: ist besser als
  rationale: Die Form ist im hebräischen Text schwierig. Der Parallelismus und die griechische Vergleichsformulierung stützen einen Sinn der Überlegenheit oder Bevorzugung.
- source_word: מפז
  choice: als Feingold
  rationale: פז bezeichnet besonders wertvolles, geläutertes Gold; „Feingold“ ist eine natürliche und prägnante deutsche Entsprechung.
- source_word: ורוח טובה
  choice: und ein guter Geist
  rationale: רוּחַ kann Geist, innere Verfassung oder Lebenskraft bezeichnen. „Ein guter Geist“ bewahrt diese Bedeutungsbreite, ohne den Ausdruck auf bloße Stimmung zu verengen.
- source_word: מפנינים
  choice: mehr wert als Perlen
  rationale: פנינים bezeichnet Perlen oder vergleichbar kostbare Schmuckstücke. Die idiomatische Vergleichsformulierung „mehr wert als“ macht den im Hebräischen knappen zweiten Satzteil im Deutschen verständlich.
theological_decisions:
- issue: Starke Abweichung zwischen dem erhaltenen hebräischen Text und der griechischen Parallelüberlieferung
  choice: 'Der Haupttext folgt dem erhaltenen Hebräisch: „Das Leben eines Armen … und ein guter Geist …“'
  alternative: 'Nach dem Griechischen: „Gesundheit und Wohlbefinden sind besser als alles Gold, und ein kräftiger Körper ist besser als unermesslicher Reichtum.“'
  rationale: Wo ein hebräischer Zeuge erhalten ist, bildet er die Grundlage der Übersetzung. Die erhebliche Abweichung des Griechischen kann auf eine andere hebräische Vorlage oder auf eine Beschädigung beziehungsweise Verderbnis der überlieferten hebräischen Zeile zurückgehen und wird deshalb transparent in einer Fußnote dokumentiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper sprichwortartiger Satzführung. Der schwierige hebräische Wortlaut wird nicht nach der glatteren griechischen Fassung umgeschrieben; die echte textliche Unsicherheit bleibt durch die Fußnote erkennbar.
