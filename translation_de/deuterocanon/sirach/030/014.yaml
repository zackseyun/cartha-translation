translation:
  language: de
  text: Besser ist ein armer Mann, der bei Kräften ist, als ein reicher Mann, der an seinem Leib getroffen ist.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Parallelüberlieferung lautet: »Besser ist ein Armer, gesund und von kräftiger Verfassung, als ein Reicher, dessen Körper gegeißelt ist.« Das hebräische Zeugnis ist knapper und sagt wörtlich: »lebend in sich selbst« und »an seinem Fleisch getroffen«.'
    reason: alternative_reading
lexical_decisions:
- source_word: טוב
  choice: Besser ist
  rationale: Die vergleichende Eröffnung entspricht dem hebräischen Weisheitsstil; das griechische κρείσσων bestätigt den Komparativ.
- source_word: מסכן
  choice: ein armer Mann
  rationale: Bewahrt den maskulinen Singular und den sprichwörtlichen Gegensatz zum reichen Mann.
- source_word: וחי בעצמו
  choice: der aus eigener Kraft lebt
  rationale: Gibt das schwer wörtlich übertragbare »lebend in sich selbst« natürlich wieder, ohne es ausdrücklich auf Gesundheit einzuengen; die Wendung bezeichnet hier eigenes leibliches Lebensvermögen, nicht Einsamkeit.
- source_word: מעשיר
  choice: als ein reicher Mann
  rationale: Das im Deutschen erforderliche »als« macht den vergleichenden Gegensatz deutlich.
- source_word: ונגע בבשרו
  choice: der an seinem Leib geschlagen ist
  rationale: Bewahrt die konkrete körperliche Heimsuchung von נגע und gibt בשר idiomatisch mit »Leib« wieder; »geschlagen« lässt offen, ob Krankheit oder ein anderes Leiden gemeint ist.
theological_decisions:
- issue: Anthropologische Formulierung des körperlichen Gegensatzes
  choice: »aus eigener Kraft lebt« und »an seinem Leib geschlagen ist«
  alternative: »gesund und von kräftiger Verfassung« bzw. »an seinem Fleisch heimgesucht«
  rationale: Der Haupttext folgt dem knapperen hebräischen Zeugnis und vermeidet es, die vom Griechischen gebotene Gesundheitsdeutung vollständig in den Text einzutragen. Zugleich bleibt die körperliche Dimension erhalten.
- issue: Generisches Maskulinum im Weisheitsspruch
  choice: »armer Mann« und »reicher Mann«
  alternative: »armer Mensch« und »reicher Mensch«
  rationale: Die maskulinen Singularformen und ihr symmetrischer sprichwörtlicher Gegensatz werden quellennah wiedergegeben, ohne eine besondere Lehraussage über das Geschlecht einzuführen.
translation_notes:
  register: Moderner, würdevoller Weisheitsstil. Die ungewöhnliche hebräische Wendung wird verständlich, aber nicht vollständig nach der ausführlicheren griechischen Lesart geglättet; die Fußnote dokumentiert die Textspannung.
