review_pass:
  verdict: revise
  source_fidelity: 'Die Vergleichsstruktur sowie der Gegensatz von Armut und körperlicher Beeinträchtigung sind zutreffend erfasst. »Aus eigener Kraft lebt« ist jedoch keine sichere Wiedergabe von וחי בעצמו: Im heutigen Deutsch legt es wirtschaftliche oder praktische Selbstständigkeit nahe, während die hebräische Wendung im Kontext die eigene leibliche Lebenskraft bzw. das Wohlbefinden bezeichnet. »Bei Kräften ist« gibt dies idiomatisch wieder, ohne die ausführlichere griechische Formulierung vollständig in den Haupttext zu übernehmen.'
  naturalness: Der Entwurf ist insgesamt würdevoll, aber »an seinem Leib geschlagen ist« klingt im modernen Standarddeutsch unidiomatisch. »An seinem Leib getroffen ist« bewahrt die offene, konkrete Aussage von נגע und ist sprachlich glatter. Die Hauptsatzform mit »Besser ist« passt zum Weisheitsspruch.
  terminology: »Armer Mann« und »reicher Mann« geben die maskulinen Singularformen symmetrisch wieder. »Leib« ist für בשר in diesem körperlichen Kontext möglich. Die Fußnote sollte die griechische Aussage idiomatisch formulieren und klar als Parallelüberlieferung, nicht als Haupttext, kennzeichnen.
  issues:
  - severity: medium
    issue: »aus eigener Kraft lebt«
    rationale: Die Formulierung bedeutet gewöhnlich, dass jemand unabhängig oder selbstständig lebt. Sie verschiebt die Aussage von einer leiblichen Lebens- bzw. Kraftaussage zu sozialer oder wirtschaftlicher Autonomie.
  - severity: low
    issue: »an seinem Leib geschlagen ist«
    rationale: Die Wendung ist im Deutschen ungewöhnlich und kann einen konkreten Schlagvorgang nahelegen. Das hebräische נגע bezeichnet allgemein ein Getroffen- oder Befallensein; die Ursache bleibt offen.
  - severity: low
    issue: Formulierung der griechischen Fußnote
    rationale: »ein Reicher, der an seinem Körper gegeißelt ist« ist schwerfällig. Eine idiomatischere Formulierung kann die stärkere griechische Bildsprache wiedergeben, ohne sie dem hebräischen Haupttext gleichzustellen.
