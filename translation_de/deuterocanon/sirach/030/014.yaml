revisions:
- from: Besser ist ein armer Mann, der aus eigener Kraft lebt, als ein reicher Mann, der an seinem Leib geschlagen ist.[a]
  to: Besser ist ein armer Mann, der bei Kräften ist, als ein reicher Mann, der an seinem Leib getroffen ist.[a]
