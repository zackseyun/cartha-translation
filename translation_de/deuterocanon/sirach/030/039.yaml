  yaml_path: translation/deuterocanon/sirach/030/039.yaml
  text: If you have a servant, let him be like yourself, because you acquired him with blood; if you have a servant, lead him as yourself, because you need him as your own life.
translation:
  language: de
  text: Hast du einen Knecht[a], soll er wie du selbst sein, denn mit Blut[b] hast du ihn erworben. Hast du einen Knecht, so geh mit ihm um wie mit dir selbst, denn du brauchst ihn wie dein eigenes Leben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort bezeichnet einen Hausknecht oder Haussklaven.
    reason: Die soziale Bedeutung von οἰκέτης ist breiter und härter, als ein einzelnes modernes deutsches Wort vollständig erkennen lässt.
  - marker: b
    text: 'Wörtlich: „in Blut“; der genaue Sinn der ungewöhnlichen Wendung ist unsicher.'
    reason: Die Fußnote bewahrt die erkennbare Unsicherheit des griechischen Ausdrucks, ohne sie im Haupttext aufzulösen.
lexical_decisions:
- source_word: οἰκέτης
  choice: Knecht
  rationale: Das Wort bezeichnet einen zum Haushalt gehörenden Diener und kann ausdrücklich einen Haussklaven meinen. „Knecht“ bewahrt im Deutschen das Abhängigkeitsverhältnis, ohne den Begriff enger als das Griechische festzulegen.
- source_word: ἔστω ὡς σύ
  choice: soll er wie du selbst sein
  rationale: Die knappe Gleichstellung des griechischen Ausdrucks bleibt erhalten; sie wird nicht zu einer bloßen Anweisung über freundliche Behandlung abgeschwächt.
- source_word: ἐν αἵματι ἐκτήσω αὐτόν
  choice: mit Blut hast du ihn erworben
  rationale: Die auffällige und mehrdeutige Bildsprache wird formal bewahrt, statt „Blut“ als Geldpreis, Verwandtschaft oder Lebensgefahr auszudeuten.
- source_word: ἄγε αὐτὸν ὡς σεαυτόν
  choice: geh mit ihm um wie mit dir selbst
  rationale: ἄγε kann wörtlich „führe“ bedeuten, bezeichnet hier aber wahrscheinlich die Art, wie der Hausherr mit dem Knecht verfährt. Die deutsche Wendung ist natürlich und erhält den Maßstab „wie dich selbst“.
- source_word: ὡς ἡ ψυχή σου
  choice: wie dein eigenes Leben
  rationale: ψυχή kann „Seele“, „Leben“ oder „Person“ bedeuten. In der Aussage über lebenswichtige Abhängigkeit ist „Leben“ idiomatisch und entspricht dem Vergleich.
theological_decisions:
- issue: Ethische Spannung in der Rede von einem abhängigen Knecht
  choice: Die soziale Abhängigkeit wird mit „Knecht“ sichtbar gehalten, während die geforderte Gleichachtung wörtlich wiedergegeben wird.
  alternative: „Diener“ verwenden oder den Satz ausdrücklich als Verurteilung der Sklaverei formulieren.
  rationale: Der Ausgangstext setzt die antike Institution voraus und fordert zugleich eine Behandlung nach dem Maßstab der eigenen Person. Die Übersetzung soll weder die Härte des Verhältnisses verdecken noch eine über den Wortlaut hinausgehende systematische Aussage eintragen.
- issue: Deutung von „mit Blut erworben“
  choice: Die Wendung bleibt im Haupttext ungedeutet.
  alternative: „mit deinem Lebensblut“, „um einen Blutpreis“ oder „als Blutsverwandten“ schreiben.
  rationale: Der griechische Wortlaut ist ungewöhnlich und lässt die genaue Vorstellung offen; eine eindeutige theologische oder wirtschaftliche Erklärung wäre spekulativ.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst knappem, spruchhaftem Satzbau. „Knecht“ ist leicht historisch gefärbt, hier aber sachlich geeigneter als das heute meist arbeitsrechtlich verstandene „Diener“ und weniger eng als „Sklave“.
