translation:
  language: de
  text: Wer seinen Sohn liebt, wird ihm unablässig Peitschenhiebe versetzen[a], damit er sich am Ende freut.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wird für ihn beharrlich mit Peitschen umgehen“. Das griechische Verb bezeichnet fortgesetztes oder gewissenhaftes Handeln; das Substantiv kann „Peitschen“, „Peitschenhiebe“ oder „Geißelungen“ bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich etwa: „bei/über seinen letzten Dingen“. Gemeint sein können der spätere Ausgang, die letzte Lebenszeit oder das Lebensende. Zudem lässt das Griechische offen, ob sich „er“ und „seinem“ auf den Vater oder den Sohn beziehen.'
    reason: ambiguity
lexical_decisions:
- source_word: Ὁ ἀγαπῶν
  choice: Wer … liebt
  rationale: Das substantivierte Partizip formuliert eine allgemeine, sprichwortartige Aussage. „Wer“ gibt diese Funktion im heutigen Deutsch natürlich wieder.
- source_word: τὸν υἱὸν αὐτοῦ
  choice: seinen Sohn
  rationale: υἱός bezeichnet ausdrücklich den Sohn; die geschlechtsspezifische familiäre Aussage des Griechischen bleibt erhalten.
- source_word: ἐνδελεχήσει
  choice: wird … beharrlich … geben
  rationale: Das Verb bezeichnet ausdauerndes, fortgesetztes oder gewissenhaftes Handeln. „Beharrlich“ bewahrt diesen Aspekt, ohne ihn lediglich als Bereitschaft umzudeuten.
- source_word: μάστιγας αὐτῷ
  choice: ihm … Rutenhiebe geben
  rationale: μάστιγες steht im Plural und kann Peitschen, Schläge oder Geißelungen bezeichnen. „Rutenhiebe“ erhält das konkrete Bild körperlicher Züchtigung und verbindet sich im Deutschen idiomatisch mit dem Dativ αὐτῷ.
- source_word: ἵνα εὐφρανθῇ
  choice: damit er sich … freut
  rationale: Die ἵνα-Konstruktion drückt Zweck oder beabsichtigte Folge aus; der Konjunktiv wird natürlich mit „damit“ wiedergegeben.
- source_word: ἐπʼ ἐσχάτων αὐτοῦ
  choice: an seinem Ende
  rationale: Die Wendung bezeichnet wörtlich ungefähr „bei/über seinen letzten Dingen“ und kann auf den späteren Ausgang, die letzte Lebenszeit oder das Lebensende weisen. „An seinem Ende“ wahrt diese Offenheit und den ernsten Spruchton.
theological_decisions:
- issue: Konkrete Darstellung körperlicher Züchtigung
  choice: Das Bild durch „Rutenhiebe“ ausdrücklich beibehalten
  alternative: abstrakt mit „Zucht“, „Erziehung“ oder „Korrektur“ wiedergeben
  rationale: μάστιγας benennt ein konkretes Bild von Schlägen beziehungsweise Geißelung. Eine abstrakte Wiedergabe würde die Härte und moralische Spannung des Ausgangstextes abschwächen.
- issue: Bezug der Pronomen im Zwecksatz
  choice: Die mehrdeutigen Pronomen mit „er“ und „seinem“ stehen lassen
  alternative: den Vater oder den Sohn ausdrücklich nennen
  rationale: Das Griechische benennt weder das Subjekt von εὐφρανθῇ noch den Bezug von αὐτοῦ erneut. Eine ausdrückliche Zuordnung würde eine im Text vorhandene syntaktische und inhaltliche Mehrdeutigkeit auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit sprichwortartiger Kürze. Die konkrete Disziplinierungsmetapher wird nicht beschönigt; zugleich erläutert die Fußnote die lexikalische und pronominale Mehrdeutigkeit.
