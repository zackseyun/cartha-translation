  text: There is no wealth greater than a sound body[b][a], and there is no good greater than a glad heart.
translation:
  language: de
  text: Kein Reichtum ist größer als ein gesunder Körper[a], und kein Gut ist größer als ein frohes Herz[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die hebräische Wendung ist verkürzt und idiomatisch; die griechische Parallele lautet „Gesundheit des Körpers“.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Güte des Herzens“; die griechische Parallele lautet „Freude des Herzens“.'
    reason: alternative_reading
lexical_decisions:
- source_word: אֵין עֹשֶׁר עַל עֹשֶׁר
  choice: Kein Reichtum ist größer als
  rationale: Die Konstruktion אֵין ... עַל drückt einen überbietenden Vergleich aus. Die Wiedergabe ist im Deutschen natürlich und bewahrt zugleich das im Hebräischen wiederholte Vergleichsmuster.
- source_word: שַׂר עֶצֶם
  choice: ein gesunder Körper
  rationale: Die hebräische Wendung ist stark verdichtet und idiomatisch. Die griechische Parallele ὑγείας σώματος („Gesundheit des Körpers“) bestätigt, dass körperliche Gesundheit beziehungsweise Unversehrtheit gemeint ist.
- source_word: אֵין טוֹבָה עַל
  choice: kein Gut ist größer als
  rationale: Diese Formulierung spiegelt den Vergleich des ersten Satzglieds und lässt טוֹבָה als substantivisches „Gut“ erkennbar bleiben.
- source_word: טוּב לֵבָב
  choice: ein frohes Herz
  rationale: Wörtlich bezeichnet die Wendung die Güte oder das Wohlsein des Herzens; im Zusammenhang ist innere Freude beziehungsweise heitere Gemütsverfassung gemeint. Die griechische Parallele χαρὰν καρδίας („Freude des Herzens“) stützt diese Deutung.
