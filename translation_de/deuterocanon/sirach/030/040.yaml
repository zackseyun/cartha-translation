  verdict: revise
  source_fidelity: Die Übersetzung trifft κακώσῃς („schlecht behandelst“), die konkrete Wegmetapher und den rhetorischen Charakter gut. Für ἀπάρᾳς ist „fortschickst“ im Kontext eine vertretbare transitive Wiedergabe. Das deutsche „willst du ... suchen?“ verschiebt jedoch das griechische Futur ζητήσεις zu einer Frage nach Absicht; „wirst du ... suchen?“ gibt die Zukunftsfrage genauer wieder.
  naturalness: Der Satz ist knapp, idiomatisch und dem würdigen modernen Standarddeutsch angemessen. „Wirst du ihn suchen?“ ist in der rhetorischen Frage ebenso natürlich wie präziser.
  terminology: Es sind keine besonderen theologischen Begriffe oder Eigennamen betroffen. „Fortschicken“ und „davonlaufen“ geben die relationale Handlung und das Bild des Entweichens angemessen wieder.
  issues:
  - severity: medium
    issue: Die Fußnote behauptet eine mögliche Deutung „und wenn er sich aufmacht, läuft er davon“.
    rationale: Die vorliegende griechische Form ἀπάρᾳς steht neben κακώσῃς in der zweiten Person und wird im überlieferten Satz sinnvoll als auf den angesprochenen Handelnden bezogen verstanden. Die vorgeschlagene alternative Konstruktion ist nicht hinreichend durch den Wortlaut gedeckt und erzeugt eine vermeidbare, irreführende Mehrdeutigkeit.
  - severity: low
    issue: „willst du ihn suchen?“
    rationale: Das deutsche Modalverb fragt primär nach Vorhaben oder Bereitschaft. ζητήσεις ist Futur und fragt rhetorisch, auf welchem Weg die Person künftig gesucht werden kann.
  revised_text: Wenn du ihn schlecht behandelst und fortschickst, läuft er davon; auf welchem Weg wirst du ihn suchen?
