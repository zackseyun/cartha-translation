translation:
  language: de
  text: Zu seinen Lebzeiten sah er und freute sich; an seinem Lebensende[a] war er nicht betrübt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „an seinem Ende“ oder „in seinen letzten Tagen“. Die griechische Wendung bezeichnet den Abschluss seines Lebens.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῇ ζωῇ αὐτοῦ
  choice: Zu seinen Lebzeiten
  rationale: Die Wendung gibt den zeitlichen Sinn natürlich und präzise wieder, ohne über das Griechische hinauszugehen.
- source_word: εἶδεν
  choice: sah er
  rationale: Das griechische Verb bedeutet schlicht „sehen“. Da sein Gegenstand in diesem Satz nicht ausdrücklich genannt wird, bleibt er auch in der Übersetzung unausgesprochen.
- source_word: εὐφράνθη
  choice: freute sich
  rationale: Die mediale beziehungsweise passive Form bezeichnet hier deutlich Freude; „freute sich“ ist gegenwärtiges, würdiges Deutsch.
- source_word: ἐν τῇ τελευταῖ αὐτοῦ
  choice: an seinem Lebensende
  rationale: Die substantivierte Wendung bezeichnet den letzten Abschnitt beziehungsweise Abschluss seines Lebens. „Lebensende“ macht die im Griechischen elliptische Formulierung im Deutschen verständlich.
- source_word: οὐκ ἐλυπήθη
  choice: war er nicht betrübt
  rationale: Dies wahrt den Zustandssinn der passiven Form und legt keinen besonderen Grund der Betrübnis fest.
