translation:
  language: de
  text: Verteile deinen Nachlass am Tag, an dem die Tage deines Lebens vollendet sind,[a] und zur Zeit deines Todes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „am Tag der Vollendung der Tage deines Lebens“. Die griechische Wendung ist knapp und kann sowohl den Abschluss als auch die Vollendung der Lebenstage bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἡμέρᾳ
  choice: An dem Tag
  rationale: Die mit ἐν gebildete Zeitangabe wird im Deutschen natürlich mit „an dem Tag“ wiedergegeben.
- source_word: συντελείας
  choice: zu Ende gehen
  rationale: Das Substantiv bezeichnet Vollendung beziehungsweise Abschluss. Die verbale Wiedergabe ist im Deutschen idiomatisch und bewahrt den Gedanken, dass die Lebenstage ihr Ende erreichen.
- source_word: ἡμερῶν ζωῆς σου
  choice: die Tage deines Lebens
  rationale: Dies entspricht der griechischen Genitivverbindung genau und klingt zugleich natürlicher als das mögliche Kompositum „deine Lebenstage“.
- source_word: καιρῷ τελευτῆς
  choice: zur Zeit deines Todes
  rationale: τελευτή kann „Ende“ oder „Tod“ bedeuten. Im Zusammenhang mit der Verteilung des Erbes ist „Tod“ die klare kontextuelle Bedeutung, während καιρός als „Zeit“ wiedergegeben wird.
- source_word: διάδος
  choice: verteile
  rationale: Der Aoristimperativ fordert zu einer bestimmten Handlung auf. „Verteilen“ passt zur Zuweisung eines Erbes und ist präziser als das allgemeinere „geben“.
- source_word: κληρονομίαν
  choice: dein Erbe
  rationale: „Erbe“ ist die übliche deutsche Entsprechung für κληρονομία. Das Possessivpronomen ergibt sich aus dem Kontext und macht deutlich, dass es um den eigenen Nachlass des Angesprochenen geht.
theological_decisions:
- issue: Ethische Tragweite der Anweisung zur Erbverteilung
  choice: Eine praktische Weisheitsanweisung, das eigene Erbe am Lebensende zu verteilen
  alternative: Eine allgemeine Aufforderung zur Freigebigkeit vor dem Tod
  rationale: Die ausdrückliche Verbindung von Tod und Erbe spricht vorrangig von der Verfügung über den Besitz am Lebensende. Die Übersetzung trägt keine späteren rechtlichen oder konfessionellen Vorstellungen in den Text ein.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die etwas feierliche Wiederholung von „Tag“ und „Tage“ bleibt erhalten, um die Gestalt des griechischen Ausdrucks erkennen zu lassen; die substantivische Wendung wird jedoch für gute Verständlichkeit verbal wiedergegeben.
