  source_fidelity: Der Entwurf gibt die beiden griechischen Zeitbestimmungen (ἐν ἡμέρᾳ … καὶ ἐν καιρῷ …) sowie den Imperativ διάδος sachlich zutreffend wieder. „Dein Erbe“ kann im Deutschen jedoch primär das vom Angesprochenen Empfangene bezeichnen, während der Kontext die Weitergabe seines eigenen Vermögens bzw. Nachlasses meint.
  naturalness: Die Stellung von „und zur Zeit deines Todes“ zwischen dem Relativsatz und dem Imperativ ist syntaktisch schwerfällig. Eine Voranstellung des Imperativs mit koordinierten Zeitangaben ist klares modernes Standarddeutsch.
  terminology: „Nachlass“ bezeichnet hier präzise das Vermögen, über das der Angesprochene am Lebensende verfügt, ohne eine bestimmte spätere erbrechtliche Regelung einzutragen. „Vollendet sind“ bildet συντελείας enger ab als die dynamischere Umschreibung „zu Ende gehen“.
  issues:
