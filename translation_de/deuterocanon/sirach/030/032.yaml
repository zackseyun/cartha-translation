revisions:
- from: An dem Tag, an dem die Tage deines Lebens zu Ende gehen,[a] und zur Zeit deines Todes verteile dein Erbe.
  to: Verteile deinen Nachlass am Tag, an dem die Tage deines Lebens vollendet sind,[a] und zur Zeit deines Todes.
  rationale: Die Revision bewahrt die Abfolge und den Nachdruck der beiden griechischen Zeitangaben, glättet aber die deutsche Syntax. „Nachlass“ verdeutlicht die kontextuell gemeinte Verfügung über das eigene Vermögen; „vollendet sind“ entspricht der substantivischen Aussage von συντελείας eng. Die Fußnote bleibt am Ausdruck zur Vollendung der Lebenstage verankert und erläutert die knappere griechische Form.
