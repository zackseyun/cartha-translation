translation:
  language: de
  text: Gönne deiner Seele Ruhe[a] und erfreue dein Herz; halte den Zorn von dir fern.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der hebräische Text ist an dieser Stelle schwierig; die überlieferte griechische Fassung bietet einen wesentlich anderen Wortlaut. Die Übersetzung folgt dem erhaltenen hebräischen Text. „Erfreue dein Herz“ gibt dabei ein schwer zu deutendes Verb sinngemäß aus dem Zusammenhang wieder.
    reason: textual_variant
lexical_decisions:
- source_word: פוג
  choice: Gönne … Ruhe
  rationale: Der Imperativ bezeichnet ein Nachlassenlassen, Erleichtern oder Zur-Ruhe-Bringen. Die idiomatische deutsche Wendung gibt den auf das eigene Innere gerichteten, fürsorglichen Sinn wieder.
- source_word: נפשך
  choice: deiner Seele
  rationale: נפש bezeichnet hier den inneren Menschen beziehungsweise das eigene Leben. „Seele“ bewahrt die anthropologische Tiefe, ohne einen starren Leib-Seele-Dualismus vorauszusetzen.
- source_word: ופיג
  choice: und erfreue
  rationale: Die Form und ihre genaue Bedeutung sind schwierig. Im Parallelismus mit dem Herzen und angesichts der folgenden Warnung vor Zorn ist eine positive Belebung oder Aufheiterung des Inneren wahrscheinlich; „erfreue“ lässt diese kontextuelle Deutung erkennen, ohne eine technische Rekonstruktion vorzutäuschen.
- source_word: לבך
  choice: dein Herz
  rationale: לב bezeichnet in der Weisheitsliteratur das innere Zentrum von Denken, Wollen und Fühlen. „Herz“ ist dafür die natürliche und traditionsgemäß verständliche deutsche Entsprechung.
- source_word: וקצפון
  choice: den Zorn
  rationale: Das Substantiv bezeichnet Zorn oder Grimm. „Zorn“ passt zum würdigen weisheitlichen Register und bezeichnet die schädliche innere Regung prägnant.
- source_word: הרחק ממך
  choice: halte … von dir fern
  rationale: Der Imperativ fordert zu aktiver Distanzierung auf. „Halte … von dir fern“ ist idiomatisch und wahrt die auffordernde Kraft.
theological_decisions:
- issue: Anthropologische Bedeutung von נפש
  choice: deiner Seele
  alternative: deinem Leben; dir selbst
  rationale: Der Vers ermahnt im Stil der Weisheitsliteratur zur Sorge für den inneren Menschen. „Seele“ erhält die Bedeutungsfülle des hebräischen Ausdrucks, ohne eine bestimmte metaphysische Anthropologie festzulegen.
- issue: Umgang mit der schwierigen hebräischen Zeile und der stark abweichenden griechischen Parallele
  choice: Die erhaltene hebräische Lesart wird als Aufforderung zu innerer Ruhe und Freude übersetzt; die Unsicherheit wird in einer Fußnote offengelegt.
  alternative: ופיג wörtlicher, aber unklar als „lass erschlaffen“ oder „lass nach“ wiedergeben; stattdessen der griechischen Parallele folgen, die offenbar einen völlig anderen Text bietet
  rationale: Der hebräische Zeuge ist hier die primäre Textgrundlage. Da die griechische Fassung inhaltlich erheblich abweicht und ופיג schwierig ist, darf die Unsicherheit weder harmonisiert noch verschwiegen werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper weisheitlicher Mahnform. „Gönne deiner Seele Ruhe“ klingt natürlich und bewahrt zugleich den auf das Innere gerichteten Sinn; die Textunsicherheit wird transparent in der Fußnote ausgewiesen.
