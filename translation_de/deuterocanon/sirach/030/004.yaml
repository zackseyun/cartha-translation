    issue: Tempus der aoristischen Verben
    rationale: Die Perfektformen sind nicht sinnwidrig, doch „starb“ und „hinterließ“ geben die abgeschlossenen Ereignisse des griechischen Aorists in diesem sentenzhaften Erzählkontext unmittelbarer wieder.
  - severity: low
    issue: Stellung von „nach sich“ bei „zurückgelassen“
    rationale: Die vorliegende Wortfolge ist grammatisch möglich, aber schwerfällig. Eine Umstellung zu „hinterließ nach sich einen“ ist natürlicher, ohne die Bedeutung zu verändern.
  - severity: low
    issue: Formulierung der Fußnote als wörtliche Wiedergabe
    rationale: „der ihm gleich ist“ fügt für ὅμοιον eine finite Kopula hinzu. Die Fußnote sollte die engere Formulierung erläutern, ohne sie als strikt wörtliche Übersetzung auszugeben.
