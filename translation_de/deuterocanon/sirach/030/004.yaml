base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/030/004.yaml
  text: His father has died[a], yet it is as though he had not died, for he has left behind one like himself after him.
translation:
  language: de
  text: Sein Vater starb, doch es ist, als wäre er nicht gestorben; denn er hinterließ nach sich einen, der ihm gleicht.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »denn er hinterließ nach sich einen, der ihm ähnlich/gleich«. Im Zusammenhang ist ein überlebender Nachkomme gemeint, wahrscheinlich ein Sohn.'
    reason: Die Anmerkung erläutert die substantivische, geschlechtlich nicht näher bestimmte Wendung ὅμοιον und den aus dem Kontext erschlossenen Bezug, ohne ihn im Haupttext zu ergänzen.
lexical_decisions:
- source_word: ἐτελεύτησεν
  choice: ist gestorben
  rationale: Das Verb bezeichnet hier eindeutig den Tod. Die direkte Wiedergabe ist im modernen Deutschen natürlich und wahrt den abgeschlossenen Vorgang.
- source_word: αὐτοῦ ὁ πατήρ
  choice: sein Vater
  rationale: Das Pronomen bezeichnet den Vater des zuvor genannten Sohnes; die possessive Wiedergabe ist im Deutschen idiomatisch.
- source_word: ὡς οὐκ ἀπέθανεν
  choice: als wäre er nicht gestorben
  rationale: ὡς führt einen irrealen Vergleich ein, keine wörtliche Verneinung des Todes. Der Konjunktiv II gibt dies im Deutschen natürlich wieder.
- source_word: ὅμοιον αὐτῷ
  choice: einen, der ihm gleicht
  rationale: Das substantivierte neutrale Adjektiv bezeichnet eine Person, ohne sie in diesem Satz ausdrücklich als Sohn zu benennen. Die Formulierung erhält diese Offenheit.
- source_word: κατέλιπεν
  choice: hat … zurückgelassen
  rationale: Das Verb meint hier, dass nach seinem Tod ein Nachkomme weiterlebt. »Zurückgelassen« bildet dies klar ab, ohne den Gedanken eines Vermächtnisses einzutragen.
- source_word: μετʼ αὐτόν
  choice: nach sich
  rationale: Die Wendung bezeichnet die zeitliche Folge beziehungsweise das Weiterleben nach ihm. »Nach sich« bewahrt die knappe Ausdrucksweise des Griechischen.
theological_decisions:
- issue: Ob der Nachkomme im Haupttext ausdrücklich als Sohn bezeichnet werden soll
  choice: einen, der ihm gleicht
  alternative: einen Sohn, der ihm gleicht
  rationale: Der Zusammenhang handelt von Söhnen, doch in diesem Satz steht kein ausdrückliches Substantiv für »Sohn«. Daher wird der Bezug nicht über das griechische Wortlautzeugnis hinaus festgelegt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung von »gestorben« und die vergleichende Spannung des griechischen Satzes bleiben erhalten; das Semikolon bildet die begründende Fortführung ab.
