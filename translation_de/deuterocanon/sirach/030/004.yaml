revisions:
- from: Sein Vater ist gestorben, doch es ist, als wäre er nicht gestorben; denn er hat nach sich einen zurückgelassen, der ihm gleicht.[a]
  to: Sein Vater starb, doch es ist, als wäre er nicht gestorben; denn er hinterließ nach sich einen, der ihm gleicht.[a]
  rationale: Die Revision glättet die deutsche Syntax und verwendet für die griechischen Aoriste ein passendes erzählendes Präteritum. Sie bewahrt die Vergleichskonstruktion, die Wiederholung von „gestorben“, die Nachfolge-Nuance von μετʼ αὐτόν sowie die im Ausgangstext nicht ausdrücklich spezifizierte Bezeichnung des Nachkommens.
