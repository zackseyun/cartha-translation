  terminology: „Haussklave“ ist im gegebenen Zwangs- und Folterkontext als kontextuelle Wiedergabe von οἰκέτης vertretbar, ohne die mögliche weitere Bedeutung als Hausdiener zu verschweigen. Die Fußnote erhält diese Alternative. „Böse“ bewahrt die moralische Wertung von κακούργος, ohne es auf eine rechtliche Verurteilung einzuengen.
