  source_fidelity: 'Der Entwurf gibt die Bildsprache und die Satzstruktur des Griechischen im Wesentlichen zuverlässig wieder: ζυγός und ἱμάς sind hier ein Joch und ein Riemen; κάμψουσιν wahrt die Zukunft; στρέβλαι und βάσανοι werden als Foltergeräte und Folter wiedergegeben. Der Haushaltsbezug von οἰκέτῃ bleibt in „Haussklaven“ sichtbar. „Bösartig“ bezeichnet im heutigen Deutsch jedoch vor allem eine veranlagte Bosheit und trifft κακούργος („böse handelnd“, „übel“) weniger unmittelbar als „böse“.'
