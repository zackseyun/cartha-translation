  - severity: low
    issue: „Folterqualen“ ist unnötig verstärkend.
    rationale: βάσανοι bezeichnet bereits Foltern beziehungsweise schwere Qualen; „Folterungen“ gibt den Plural klar wieder und trennt die Vorgänge von den vorher genannten Geräten.
