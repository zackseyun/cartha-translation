translation:
  language: de
  text: Joch und Riemen werden den Nacken beugen, und für einen bösen Haussklaven[a] gibt es Streckbänke und Folterungen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »bösen Hausdiener«; das griechische οἰκέτης bezeichnet einen Diener beziehungsweise Sklaven im Haushalt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ζυγὸς
  choice: Joch
  rationale: Das Bild des gebeugten Nackens verlangt die konkrete Bedeutung »Joch«, nicht »Waagebalken«.
- source_word: ἱμὰς
  choice: Riemen
  rationale: Das Wort bezeichnet einen Lederriemen beziehungsweise eine Fessel; »Riemen« ist knapp, verständlich und passt zum Joch als Zwangsmittel.
- source_word: κάμψουσιν
  choice: werden … beugen
  rationale: Die Zukunftsform und das körperliche Bild des Beugens bleiben unmittelbar erhalten.
- source_word: τράχηλον
  choice: den Nacken
  rationale: »Nacken« gibt den Körperteil im Bild von Joch und Riemen idiomatisch wieder.
- source_word: οἰκέτῃ
  choice: Haussklaven
  rationale: οἰκέτης kann einen Hausdiener bezeichnen, meint in diesem von Zwang und Folter geprägten Zusammenhang jedoch einen unfreien Angehörigen des Haushalts. »Haussklave« bewahrt sowohl den Haushaltsbezug als auch die soziale Unfreiheit.
- source_word: κακούργῳ
  choice: bösartigen
  rationale: Das Adjektiv bezeichnet jemanden, der Böses tut; »bösartig« erhält die moralische Kennzeichnung, ohne sie auf einen gerichtlich verurteilten Verbrecher zu verengen.
- source_word: στρέβλαι
  choice: Streckbänke
  rationale: Der Plural bezeichnet Geräte, mit denen ein Körper verdreht beziehungsweise gefoltert wird. »Streckbänke« bietet dafür ein konkretes und im Deutschen verständliches Bild.
- source_word: βάσανοι
  choice: Folterqualen
  rationale: Das Wort bezeichnet hier schwere, durch Folter zugefügte Qualen. »Folterqualen« wahrt die Härte und unterscheidet sie von den zuvor genannten Geräten.
theological_decisions:
- issue: Wiedergabe der unfreien Stellung von οἰκέτης
  choice: Haussklave
  alternative: Hausdiener / Diener
  rationale: Der unmittelbare Zusammenhang handelt von gewaltsamer Unterwerfung und Folter. »Haussklave« vermeidet eine Beschönigung der sozialen Unfreiheit, während die Fußnote die mögliche allgemeinere Wiedergabe offenhält.
translation_notes:
  register: Moderne, würdige Standardsprache mit bewahrter Härte des antiken Spruches. Die Zukunftsform des griechischen Verbs bleibt erhalten; in der verblosen zweiten Satzhälfte ergänzt »gibt es« die im Deutschen notwendige Prädikation.
