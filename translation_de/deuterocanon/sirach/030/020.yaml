  text: So it is with one who has wealth and does not enjoy it[a].
translation:
  language: de
  text: So geht es einem, der Reichtum besitzt und ihn nicht genießt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Parallelüberlieferung führt den Gedanken anschaulich weiter: „Er schaut mit den Augen hin und seufzt wie ein Eunuch, der eine Jungfrau umarmt und seufzt.“ Das stützt den Sinn, Reichtum zu besitzen, ohne ihn wirklich genießen zu können.'
    reason: alternative_reading
lexical_decisions:
- source_word: כן
  choice: So geht es
  rationale: Leitet den Vergleich mit dem vorausgehenden Bild ein und gibt die sprichwörtliche Wendung im Deutschen natürlich wieder.
- source_word: מי שיש לו
  choice: einem, der … besitzt
  rationale: Die unbestimmte Relativkonstruktion und die hebräische Besitzwendung werden idiomatisch und ohne unnötige Geschlechtsspezifizierung wiedergegeben.
- source_word: עושר
  choice: Reichtum
  rationale: Bezeichnet hier materiellen Besitz beziehungsweise Wohlstand; „Reichtum“ ist im modernen Standarddeutsch klar und würdig.
- source_word: ואין נהנה ממנו
  choice: und ihn nicht genießt
  rationale: נהנה kann sowohl Genuss als auch Nutzen bezeichnen. Im Zusammenhang mit Reichtum und gestützt durch die griechische Parallele steht die tatsächliche Freude beziehungsweise Teilhabe am Besitz im Vordergrund. Die Formulierung behauptet nicht ausdrücklich, ob die Person ihn nicht genießen will oder nicht genießen kann.
theological_decisions:
- issue: Grund für den ausbleibenden Genuss
  choice: 'offengelassen: „ihn nicht genießt“'
  alternative: „ihn nicht genießen kann“
  rationale: Der hebräische Text nennt keinen Grund. Die Übersetzung bewahrt diese Offenheit, statt Unfähigkeit ausdrücklich in den Haupttext einzutragen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit knapper, sprichwörtlicher Satzform. Der Haupttext folgt dem gut bezeugten hebräischen Wortlaut; die ausführlichere griechische Fassung wird transparent in der Fußnote dokumentiert.
