translation:
  language: de
  text: Köstlichkeiten, die auf einen geschlossenen Mund geschüttet werden, sind wie eine Opfergabe, die vor einem Götzenbild dargebracht wird.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort גלול ist eine verächtliche Bezeichnung für einen Götzen, die mit „Kot“ oder „Mist“ assoziiert ist; möglich wäre etwa „Mistgötze“.
    reason: lexical_alternative
  - marker: b
    text: 'Die griechische Parallele hat in der zweiten Vergleichshälfte: „Speiseanteile, die neben einem Grab liegen“, statt des hebräischen Bildes einer Opfergabe vor einem Götzenbild. Beide Fassungen stellen die Nutzlosigkeit einer Gabe dar.'
    reason: textual_variant
lexical_decisions:
- source_word: טובה
  choice: Köstlichkeiten
  rationale: Im Zusammenhang mit dem Mund und der griechischen Parallele bezeichnet das Wort hier wahrscheinlich begehrenswerte Speisen oder gute Gaben, nicht abstrakte Güte.
- source_word: שפוכה
  choice: ausgeschüttet
  rationale: Das passive Partizip von שפך bewahrt das anschauliche Bild des Ausschüttens und entspricht der griechischen Parallele.
- source_word: על פה סתום
  choice: vor einem verschlossenen Mund
  rationale: Die örtliche Präposition wird idiomatisch mit „vor“ wiedergegeben; „verschlossener Mund“ erhält das Bild eines Empfängers, der die Speise nicht aufnehmen kann.
- source_word: תנופה
  choice: Opfergabe
  rationale: Das Wort kann eine spezielle Schwinggabe bezeichnen, meint im Vergleich aber allgemein eine kultisch dargebrachte Gabe. „Opfergabe“ wahrt den kultischen Bezug, ohne den Ritus unnötig zu verengen.
- source_word: מצגת
  choice: aufgestellt wird
  rationale: Die Form bezeichnet etwas, das hingestellt oder präsentiert wird. Das Passiv fügt sich natürlich in den deutschen Vergleich.
- source_word: לפני גלול
  choice: vor einem Götzenbild
  rationale: גלול ist eine verächtliche Bezeichnung für einen Götzen. „Götzenbild“ nennt den Bezug klar; die besonders abwertende Wortfärbung wird in einer Fußnote offengelegt.
theological_decisions:
- issue: Kultischer Fachausdruck תנופה im Weisheitsvergleich
  choice: allgemein als „Opfergabe“ wiedergeben
  alternative: „Schwingopfer“ oder „Schwinggabe“
  rationale: Die Pointe ist die Nutzlosigkeit einer wertvollen Gabe für einen Empfänger, der sie nicht annehmen kann. Ein enger Fachausdruck würde den Vergleich stärker ritualisieren, als es sein Zweck verlangt.
- issue: Abwertende Götzenbezeichnung גלול
  choice: im Haupttext „Götzenbild“
  alternative: „Mistgötze“ oder „unreiner Götze“
  rationale: Die klare Referenz bleibt im Haupttext erhalten, während die echte pejorative Färbung des hebräischen Ausdrucks in der Fußnote transparent gemacht wird.
- issue: Abweichende zweite Vergleichshälfte in der griechischen Überlieferung
  choice: dem hoch bewerteten hebräischen Text folgen
  alternative: nach dem Griechischen „Speisegaben, die neben einem Grab liegen“
  rationale: Der hebräische Ausgangstext ist hier vorhanden und mit hoher Sicherheit bezeugt. Die griechische Variante wird wegen ihres erheblichen Wortlautunterschieds vermerkt, ohne die gemeinsame Aussage über die Vergeblichkeit zu verwischen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Spruchstruktur. „Köstlichkeiten“ konkretisiert טובה aus dem unmittelbaren Speisekontext; die kultische und die abwertende Bildsprache bleiben sichtbar, ohne unnötig technische oder ungebräuchliche Ausdrücke in den Haupttext zu setzen.
