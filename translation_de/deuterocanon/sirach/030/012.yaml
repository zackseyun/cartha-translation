translation:
  language: de
  text: Beuge seinen Kopf, solange er jung ist, und zerbrich ihm die Lenden, solange er noch klein ist.[a] Damit er nicht hart wird, sich gegen dich auflehnt und dir Seelenqual bereitet.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der hebräische Text lautet „zerbrich ihm die Lenden“; der griechische Paralleltext hat „zerschlage seine Seiten/Rippen“.
    reason: textual_variant
  - marker: b
    text: 'Der hebräische Wortlaut hinter „hart wird“ ist schwer verständlich. Der griechische Paralleltext lautet deutlicher: „damit er nicht hart wird und dir ungehorsam ist“; die anschließende Aussage von Auflehnung gegen dich steht auch im Hebräischen.'
    reason: alternative_reading
lexical_decisions:
- source_word: כוף ראשו
  choice: Beuge seinen Kopf
  rationale: כוף fordert zum Beugen oder Niederzwingen auf, und ראשו bedeutet wörtlich „seinen Kopf“. Die konkrete Körpermetapher bleibt erhalten, ohne sie zu der abstrakten Aufforderung „erziehe ihn“ abzuschwächen.
- source_word: בנערותו
  choice: solange er jung ist
  rationale: Die Zeitangabe wird in natürlichem modernem Deutsch wiedergegeben und bezeichnet die Jugendzeit.
- source_word: ובקע מתניו
  choice: und zerbrich ihm die Lenden
  rationale: בקע bezeichnet ein Spalten oder Zerbrechen; מתנים meint Lenden beziehungsweise Hüftbereich. Die scharfe körperliche Bildsprache des hebräischen Zeugen wird nicht beschönigt.
- source_word: כשהוא קטן
  choice: solange er noch klein ist
  rationale: Die Wendung betont das frühe Kindesalter; „noch klein“ bewahrt den konkreten Ausdruck.
- source_word: למה ישקה
  choice: Sonst könnte er hart werden
  rationale: Der überlieferte hebräische Wortlaut ist schwierig. Der griechische Paralleltext mit σκληρυνθείς („hart geworden“) stützt diesen Sinn; „könnte“ bewahrt dabei den warnenden, nicht sicheren Charakter.
- source_word: ומרה בך
  choice: sich gegen dich auflehnen
  rationale: מרה bezeichnet Widersetzlichkeit oder Auflehnung. Die Wiedergabe erhält die gegen die angesprochene Person gerichtete Komponente בך.
- source_word: ונולד ממנו מפח נפש
  choice: und dir Seelenqual bereiten
  rationale: מפח נפש bezeichnet tiefe innere Enttäuschung, Betrübnis oder Qual. Die idiomatische deutsche Formulierung gibt wieder, dass diese Qual von dem Kind ausgeht, ohne das ungewöhnliche hebräische Bild des Entstehens mechanisch nachzubilden.
theological_decisions:
- issue: Drastische körperliche Bilder in der Weisheitsunterweisung
  choice: Die Bilder vom Beugen des Kopfes und Zerbrechen der Lenden werden im Haupttext konkret wiedergegeben.
  alternative: Die Aussage allgemein als „Erziehe ihn streng“ oder „Weise ihn früh zurecht“ umschreiben.
  rationale: Sowohl der hebräische Text als auch der griechische Paralleltext verwenden harte körperliche Bilder. Eine abstrakte Umschreibung würde die ethische und theologische Spannung des Textes verdecken.
- issue: Unsicherer hebräischer Wortlaut vor „und sich gegen dich auflehnen“
  choice: Im Licht des griechischen Paralleltextes als Warnung vor dem Hartwerden wiedergegeben.
  alternative: Den schwer verständlichen hebräischen Wortlaut unübersetzt lassen oder eine stärker conjecturale Bedeutung wie „störrisch werden“ einsetzen.
  rationale: Das Griechische bietet mit „damit er nicht hart wird und dir ungehorsam ist“ eine frühe und inhaltlich passende Stütze, während die Fußnote die Unsicherheit des Hebräischen offenlegt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die drastische Körpermetaphorik wird bewusst nicht abgeschwächt. „Seelenqual“ erhält das anthropologische und emotionale Gewicht von מפח נפש, während der Satzbau für heutige Leser verständlich bleibt.
