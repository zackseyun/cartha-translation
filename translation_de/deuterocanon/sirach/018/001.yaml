  text: The one who lives forever created all things at once[a].
translation:
  language: de
  text: Der ewig Lebende erschuf alles als Ganzes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „erschuf alles zugleich“, „erschuf alles gemeinsam“ oder „erschuf alles insgesamt“. Das griechische Adverb κοινῇ ist knapp und kann die Schöpfung in ihrer Gesamtheit hervorheben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὁ ζῶν
  choice: Der ewig Lebende
  rationale: Das substantivierte Partizip bezeichnet den Handelnden durch sein fortdauerndes Leben. Die nominalisierte Form ist im Deutschen knapp und würdevoll, ohne ausdrücklich „Gott“ oder „Herr“ einzusetzen.
- source_word: εἰς τὸν αἰῶνα
  choice: ewig
  rationale: Die Wendung bezeichnet unbegrenzte Dauer. „Ewig“ gibt dies in natürlichem, gehobenem Deutsch wieder.
- source_word: ἔκτισεν
  choice: erschuf
  rationale: κτίζω bezeichnet hier im kosmologischen Zusammenhang das Hervorbringen der Schöpfung. „Erschuf“ wahrt den punktuellen Rückblick des Aorists und den würdevollen Ton.
- source_word: τὰ πάντα
  choice: alles
  rationale: Der Ausdruck umfasst die Gesamtheit dessen, was geschaffen ist. „Alles“ ist im modernen Deutsch umfassend und natürlich.
- source_word: κοινῇ
  choice: als Ganzes
  rationale: Das Adverb kann „gemeinsam“, „insgesamt“ oder „als Gesamtheit“ bedeuten. „Als Ganzes“ betont die Schöpfung in ihrer Gesamtheit, ohne eindeutig eine zeitliche Gleichzeitigkeit zu behaupten.
theological_decisions:
- issue: Identifizierung des Subjekts als Gott ohne ausdrückliche Gottesbezeichnung
  choice: Der ewig Lebende
  alternative: Gott, der ewig lebt; der Herr, der ewig lebt
  rationale: Der griechische Text verwendet weder θεός noch κύριος, sondern eine beschreibende substantivierte Partizipialform. Die Übersetzung bewahrt diese indirekte Bezeichnung.
- issue: Bedeutung von κοινῇ
  choice: als Ganzes
  alternative: zugleich; gemeinsam; insgesamt
  rationale: Die knappe griechische Formulierung lässt offen, ob die Gesamtheit, das gemeinsame Verhältnis oder möglicherweise die Gleichzeitigkeit hervorgehoben wird. Der Haupttext wahrt den kollektiven Sinn; die Fußnote nennt die anderen Möglichkeiten.
translation_notes:
  register: Modernes Standarddeutsch mit knappem, würdigem Weisheitston. Die nominalisierte Wendung „der ewig Lebende“ spiegelt die griechische Beschreibung, ohne einen nicht ausdrücklich genannten Gottesnamen einzufügen. Der Fußnotenmarker [a] steht im Haupttext.
