base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/018/006.yaml
  text: It is not possible to diminish or to add[a], and it is not possible to trace out the wonders of the Lord.
translation:
  language: de
  text: Man kann weder mindern noch hinzufügen, und man kann die Wunder des Herrn nicht ergründen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „vollständig erforschen“; wörtlich im Sinn von „bis auf die Spur verfolgen“.'
    reason: Das griechische ἐξιχνιάσαι verbindet die Vorstellung des Aufspürens mit der eines umfassenden Erforschens oder Erfassens.
lexical_decisions:
- source_word: οὐκ ἔστιν
  choice: man kann nicht
  rationale: Die unpersönliche griechische Wendung bezeichnet hier Unmöglichkeit. „Man kann nicht“ gibt dies in natürlichem, modernem Deutsch wieder.
- source_word: ἐλαττῶσαι
  choice: mindern
  rationale: Das Verb bedeutet, etwas geringer oder kleiner zu machen. „Mindern“ wahrt die knappe, gehobene Ausdrucksweise und bildet mit „hinzufügen“ einen klaren Gegensatz.
- source_word: προσθεῖναι
  choice: hinzufügen
  rationale: Das Verb bezeichnet das Hinzutun oder Ergänzen. „Hinzufügen“ ist die direkte und idiomatische deutsche Entsprechung.
- source_word: ἐξιχνιάσαι
  choice: ergründen
  rationale: Das Verb trägt das Bild des Aufspürens einer Fährte bis ans Ziel und kann vollständiges Erforschen oder Begreifen bezeichnen. „Ergründen“ gibt den Gedanken umfassender Erkenntnis natürlich und würdig wieder.
- source_word: τὰ θαυμάσια
  choice: die Wunder
  rationale: Der Ausdruck kann wunderbare Dinge, Werke oder Taten bezeichnen. „Die Wunder“ bleibt bewusst weit und legt sich nicht auf nur eine dieser Bedeutungen fest.
- source_word: τοῦ κυρίου
  choice: des Herrn
  rationale: κύριος fungiert hier als Gottesbezeichnung. „Herr“ entspricht dem etablierten biblischen Titel, ohne zusätzliche Deutung einzutragen.
theological_decisions:
- issue: Nicht genanntes Objekt bei „mindern oder hinzufügen“
  choice: Das Objekt bleibt unausgesprochen.
  alternative: Ein Objekt wie „etwas“, „ihnen“ oder „seinen Werken“ ergänzen.
  rationale: Auch der griechische Text nennt kein Objekt. Die objektlosen deutschen Verben bewahren die knappe, spruchhafte Offenheit, statt den Bezug auf Gottes Werke oder eine andere Größe festzulegen.
- issue: Wiedergabe von κύριος
  choice: Herr
  alternative: Gebieter
  rationale: In diesem Weisheitskontext ist κύριος ein göttlicher Titel. „Herr“ bewahrt den vertrauten biblischen Sprachgebrauch.
translation_notes:
  register: Knappe, würdige und zugleich gegenwärtige Standardsprache. Die Wiederholung von „man kann“ bildet die parallele griechische Konstruktion ab; das nicht genannte Objekt des ersten Satzglieds bleibt bewusst offen.
