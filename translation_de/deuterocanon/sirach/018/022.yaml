base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/018/022.yaml
  text: Do not be hindered from paying a vow in due time[a], and do not wait until death to be justified.
translation:
  language: de
  text: Lass dich nicht davon abhalten, ein Gelübde zur rechten Zeit zu erfüllen, und warte nicht bis zum Tod, um als gerecht zu gelten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „um gerechtfertigt zu werden“ oder „um als gerecht erwiesen zu werden“. Das griechische Wort kann allgemein bedeuten, als im Recht oder gerecht befunden zu werden; ein späterer theologischer Fachgebrauch ist hier nicht zwingend gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμποδισθῇς
  choice: Lass dich nicht davon abhalten
  rationale: Bewahrt den passiven Sinn der Aufforderung und drückt natürlich aus, dass Hindernisse die rechtzeitige Erfüllung nicht vereiteln sollen.
- source_word: ἀποδοῦναι
  choice: zu erfüllen
  rationale: In Verbindung mit εὐχή bezeichnet das Verb idiomatisch das Einlösen beziehungsweise Erfüllen eines Gelübdes; „erfüllen“ ist im heutigen Deutschen klarer als „bezahlen“.
- source_word: εὐχήν
  choice: ein Gelübde
  rationale: Obwohl εὐχή auch „Gebet“ bedeuten kann, legt die Verbindung mit ἀποδοῦναι ein gegenüber Gott abgelegtes und einzulösendes Gelübde nahe.
- source_word: εὐκαίρως
  choice: zur rechten Zeit
  rationale: Gibt sowohl den zeitlichen als auch den Angemessenheitsaspekt des Adverbs wieder.
- source_word: μὴ μείνῃς
  choice: warte nicht
  rationale: Im Zusammenhang bezeichnet μένω das Aufschieben bis zu einem äußersten Zeitpunkt; „warte nicht“ ist modernes und verständliches Deutsch.
- source_word: ἕως θανάτου
  choice: bis zum Tod
  rationale: Entspricht knapp dem griechischen Ausdruck und erhält den Tod als äußersten Endpunkt des Aufschubs.
- source_word: δικαιωθῆναι
  choice: um als gerecht zu gelten
  rationale: Gibt den passiven Sinn von δικαιόω als für gerecht befunden oder erklärt werden wieder, ohne automatisch einen späteren dogmatischen Fachbegriff einzutragen.
theological_decisions:
- issue: Bedeutung von δικαιωθῆναι in einer weisheitlichen Mahnung
  choice: um als gerecht zu gelten
  alternative: um gerechtfertigt zu werden; um als gerecht erwiesen zu werden
  rationale: Die Formulierung hält das Urteil, als gerecht befunden zu werden, sichtbar, vermeidet aber eine vorschnelle Gleichsetzung mit einer später ausgebildeten paulinischen Rechtfertigungsterminologie. Die Fußnote bewahrt die legitimen engeren Alternativen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur folgt der zweifachen griechischen Mahnung; traditionelle Gelübdesprache bleibt erhalten, während die umstrittene δικαιόω-Terminologie verständlich und theologisch offen wiedergegeben wird.
