  source_fidelity: 'Die Übersetzung gibt beide griechischen Mahnungen treffend wieder: Der passive Charakter von μὴ ἐμποδισθῇς ist in „Lass dich nicht davon abhalten“ gewahrt; ἀποδοῦναι εὐχήν wird idiomatisch und sachgerecht als Erfüllung eines Gelübdes wiedergegeben. „Zur rechten Zeit“ deckt εὐκαίρως gut ab. „Warte nicht bis zum Tod“ entspricht μὴ μείνῃς ἕως θανάτου. „Um als gerecht zu gelten“ gibt δικαιωθῆναι als passivisches, wertendes Urteil wieder, ohne die Bedeutung unzulässig dogmatisch einzuengen.'
