  text: From morning until evening the time changes[b][a], and all things are swift before the Lord.
translation:
  language: de
  text: Vom Morgen bis zum Abend ändert sich die Zeit,[a] und vor dem Herrn ist alles rasch.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ändert sich die Lage« oder »die Gelegenheit«. Das griechische Wort kann Zeit, Zeitpunkt, Gelegenheit oder Umstände bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »In den Augen des Herrn ist alles schnell.«'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπὸ πρωΐθεν ἕως ἑσπέρας
  choice: Vom Morgen bis zum Abend
  rationale: Gibt die zeitliche Spanne klar, natürlich und ohne unnötige Festlegung auf die Morgendämmerung wieder.
- source_word: μεταβάλλει
  choice: ändern sich
  rationale: Das Verb bezeichnet einen Wechsel oder eine Veränderung; die reflexive deutsche Formulierung ist in Verbindung mit »die Umstände« idiomatisch.
- source_word: καιρός
  choice: die Umstände
  rationale: καιρός kann Zeit, Zeitpunkt, Gelegenheit oder die jeweilige Lage bezeichnen. Im Zusammenhang des raschen Wechsels innerhalb eines Tages drückt »die Umstände« den wahrscheinlichen Sinn natürlich aus, ohne die zeitliche Dimension auszuschließen.
- source_word: πάντα
  choice: alles
  rationale: Das substantivierte Neutrum Plural ist umfassend; »alles« ist im modernen Deutsch natürlicher als »alle Dinge«.
- source_word: ταχινὰ
  choice: rasch
  rationale: Das Adjektiv bezeichnet Schnelligkeit. Die verbale Wendung »alles geschieht rasch« vermittelt diesen Sinn im Deutschen verständlicher als das formal mögliche, aber unnatürliche »alles ist schnell«.
- source_word: ἔναντι Κυρίου
  choice: vor dem Herrn
  rationale: Bewahrt die knappe biblische Wendung, die sowohl Gegenwart als auch Perspektive des Herrn ausdrücken kann.
theological_decisions:
- issue: Bedeutung von καιρός im Weisheitsspruch
  choice: die Umstände
  alternative: die Zeit; die Verhältnisse; die Lage
  rationale: Der Singular καιρός kann mehr als bloße Uhrzeit bezeichnen. »Die Umstände« lässt den Wechsel menschlicher Verhältnisse hervortreten; die möglichen engeren Wiedergaben werden in der Fußnote bewahrt.
- issue: Aussage von πάντα ἐστὶν ταχινὰ ἔναντι Κυρίου
  choice: alles geschieht rasch vor dem Herrn
  alternative: alles ist schnell vor dem Herrn; alles ist vergänglich in den Augen des Herrn
  rationale: ταχινός bezeichnet primär Schnelligkeit, nicht Mühelosigkeit. Die Übersetzung macht die im Griechischen knappe Prädikation idiomatisch, ohne sie als Aussage über Vergänglichkeit oder Gottes Mühelosigkeit festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit sprichwortartiger Kürze. Die Hauptzeile ist idiomatisch formuliert; Fußnoten erhalten die ungewöhnliche griechische Prädikation und die Bedeutungsbreite von καιρός.
