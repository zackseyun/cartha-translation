  naturalness: »Vom Morgen bis zum Abend ändert sich die Zeit« ist modernes, verständliches Standarddeutsch mit der knappen, spruchhaften Prägung des Ausgangstextes. Die Umstellung in »vor dem Herrn ist alles rasch« klingt natürlicher als »alles ist rasch vor dem Herrn« und bleibt eng am griechischen Prädikat.
  terminology: »der Herr« gibt Κύριος angemessen und traditionsübergreifend wieder. »rasch« ist eine treffende Wiedergabe von ταχινά. Die Fußnoten sichern die mögliche Bedeutung von καιρός als Gelegenheit, Lage oder Umstände sowie die Perspektivbedeutung von ἔναντι Κυρίου, ohne eine theologische Deutung festzulegen.
