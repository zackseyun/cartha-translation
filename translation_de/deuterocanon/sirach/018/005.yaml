  text: Who can number the might of his majesty? And who can add to recounting his mercies?[a]
translation:
  language: de
  text: Wer kann die Macht seiner Majestät ermessen? Und wer kann noch mehr von seinen Erbarmungen erzählen?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „Und wer wird hinzufügen, seine Erbarmungen ausführlich zu erzählen?“ Die ungewöhnliche Formulierung kann das weitere Erzählen meinen; sie kann auch auf ein vollständiges Erzählen zielen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κράτος
  choice: Macht
  rationale: Bezeichnet wirksam hervortretende Stärke oder Gewalt; „Macht“ ist im Deutschen natürlich und wahrt die erhabene Aussage.
- source_word: μεγαλωσύνης
  choice: Majestät
  rationale: Der Genitiv bezeichnet hier die erhabene Größe, zu der die Macht gehört; „Majestät“ bewahrt den auf Gott bezogenen, feierlichen Klang.
- source_word: ἐξαριθμήσεται
  choice: kann … ermessen
  rationale: Das rhetorisch gebrauchte Futur fragt nach der unmöglichen vollständigen Erfassung. Bei „Macht“ klingt „ermessen“ natürlicher als das wörtliche „zählen“, ohne den Gedanken der Unermesslichkeit aufzugeben.
- source_word: προσθήσει ἐκδιηγήσασθαι
  choice: kann … vollständig erzählen
  rationale: Die Verbindung bedeutet wörtlich, zum ausführlichen Erzählen noch etwas hinzuzufügen, und bezeichnet idiomatisch das weitere beziehungsweise erschöpfende Berichten.
- source_word: τὰ ἐλέη αὐτοῦ
  choice: seine Erbarmungen
  rationale: Der Plural bleibt erhalten und kann die vielen einzelnen Erweise göttlichen Erbarmens bezeichnen; „Erbarmungen“ wahrt dies genauer als der abstrakte Singular „Barmherzigkeit“.
theological_decisions:
- issue: Göttlicher Bezug und erhabene Sprache
  choice: 'Normale Kleinschreibung des Possessivpronomens bei gehobenen Hauptwörtern: „seiner Majestät“ und „seine Erbarmungen“.'
  alternative: Ehrerbietige Großschreibung („Seiner“, „Seine“) oder die flachere Wiedergabe „Größe“.
  rationale: Die griechische Formulierung trägt die Ehrfurcht durch ihre Wortwahl, nicht durch eine besondere Schreibung der Pronomen. „Majestät“ bewahrt das theologische Gewicht ohne konfessionell geprägte Schreibkonvention.
- issue: Reichweite von προσθήσει ἐκδιηγήσασθαι
  choice: Idiommatisch als „vollständig erzählen“ wiedergegeben und die wörtliche Bildlichkeit in einer Fußnote bewahrt.
  alternative: 'Wörtlicher: „Wer wird noch hinzufügen, seine Erbarmungen ausführlich zu erzählen?“'
  rationale: Die wörtliche deutsche Fassung wäre schwer verständlich. Die Hauptfassung vermittelt den Gedanken des fortgesetzten beziehungsweise erschöpfenden Erzählens, ohne zu behaupten, Gottes Erbarmungen ließen sich tatsächlich abschließend darstellen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit parallelen rhetorischen Fragen. „Ermessen“ und „Erbarmungen“ sind gehoben, aber allgemein verständlich; die Fußnote erhält die ungewöhnliche griechische Ausdrucksweise.
