translation:
  language: de
  text: Keinem hat er gestattet, seine Werke zu verkünden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Keinem hat er ermöglicht, seine Werke bekannt zu machen“ beziehungsweise „Niemanden hat er dazu befähigt, seine Werke zu verkünden.“ Das seltene griechische Verb kann Gewähren, Ermöglichen oder Befähigen ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐθενί
  choice: keinem
  rationale: Der Dativ wird unmittelbar wiedergegeben und bezeichnet die Person, der etwas nicht gewährt wurde.
- source_word: ἐξεποίησεν
  choice: hat gewährt
  rationale: Das seltene Verb bezeichnet in Verbindung mit dem Infinitiv ein Bewirken, Ermöglichen oder Gestatten. „Hat gewährt“ bewahrt diese Bedeutungsbreite besser als eine eindeutigere Festlegung auf bloße Erlaubnis oder Befähigung.
- source_word: ἐξαγγεῖλαι
  choice: zu verkünden
  rationale: Der Infinitiv von ἐξαγγέλλω bezeichnet ein öffentliches Bekanntmachen oder Ausrufen; „verkünden“ erhält diesen feierlichen, deklarativen Sinn.
- source_word: τὰ ἔργα αὐτοῦ
  choice: seine Werke
  rationale: Die formale Wiedergabe bewahrt den umfassenden Bezug auf Gottes Wirken, ohne ihn auf einzelne Taten einzuengen.
theological_decisions:
- issue: Reichweite der Aussage über Gottes Werke
  choice: Der Vers sagt, dass keinem gewährt wurde, Gottes Werke zu verkünden.
  alternative: Niemand wurde dazu befähigt oder bestimmt, Gottes Werke zu verkünden.
  rationale: Die knappe griechische Formulierung lässt offen, ob vor allem Gewährung, Befähigung oder Beauftragung gemeint ist. Die Übersetzung vermeidet eine weitergehende Aussage über die grundsätzliche Unerkennbarkeit Gottes.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Voranstellung von „Keinem“ bildet die griechische Betonung nach und bleibt natürlich verständlich.
