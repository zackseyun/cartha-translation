translation:
  language: de
  text: Ein weiser Mensch wird in allem vorsichtig sein[a] und wird sich in Tagen der Sünde[b] vor Fehlverhalten hüten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wird in allem Ehrfurcht zeigen“. Das griechische Verb kann sowohl ehrfürchtige Scheu als auch vorsichtige Wachsamkeit ausdrücken; der Zusammenhang legt hier praktische Vorsicht nahe.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „in Tagen von Sünden“; gemeint sind wahrscheinlich Zeiten, die von Sünde oder Versuchung geprägt sind.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄνθρωπος σοφὸς
  choice: ein weiser Mensch
  rationale: ἄνθρωπος bezeichnet hier in sprichwörtlicher Rede einen Menschen allgemein. Das moderne Deutsche gibt den generischen Sinn natürlich mit „Mensch“ wieder, ohne die Aussage auf Männer zu beschränken.
- source_word: ἐν παντὶ
  choice: in allem
  rationale: Die Wendung bezeichnet umfassend jede Angelegenheit oder Lage; „in allem“ bewahrt diese Weite knapp und idiomatisch.
- source_word: εὐλαβηθήσεται
  choice: ist vorsichtig
  rationale: Das Verb kann vorsichtige Scheu, Wachsamkeit oder Ehrfurcht bezeichnen. Der Parallelismus mit dem Sich-Hüten vor Fehlverhalten stützt hier die praktische Bedeutung „vorsichtig sein“. Das griechische Futur hat in der Sentenz allgemeinen, charakterisierenden Wert und wird im Deutschen natürlich im Präsens wiedergegeben.
- source_word: ἐν ἡμέραις ἁμαρτιῶν
  choice: in Tagen der Sünde
  rationale: Die Übersetzung hält das Bild der „Tage“ fest und gibt den griechischen Genitiv sachgemäß wieder. Gemeint sind wohl Zeiten, die von Sünde oder Versuchung geprägt sind; diese Deutung wird in einer Fußnote offengehalten.
- source_word: προσέξει ἀπὸ
  choice: hütet er sich vor
  rationale: προσέχω bedeutet aufmerksam sein oder achtgeben; mit ἀπό bezeichnet es hier auf idiomatische Weise das wachsame Meiden von etwas.
- source_word: πλημμελίας
  choice: Fehlverhalten
  rationale: πλημμέλεια kann Fehler, Vergehen oder unrechtes Handeln bedeuten. „Fehlverhalten“ wahrt die moralische Bedeutung, ohne die Schwere genauer festzulegen, als es der griechische Ausdruck tut.
theological_decisions:
- issue: Bedeutung von εὐλαβηθήσεται
  choice: praktische moralische Vorsicht
  alternative: Ehrfurcht oder religiöse Scheu
  rationale: Das Bedeutungsfeld schließt Ehrfurcht ein, doch die parallele Aussage über das Meiden von Fehlverhalten legt hier Wachsamkeit und Vorsicht nahe. Die alternative Nuance bleibt in der Fußnote sichtbar.
- issue: Generischer Gebrauch von ἄνθρωπος
  choice: „ein weiser Mensch“ als allgemeine Aussage
  alternative: „ein weiser Mann“
  rationale: ἄνθρωπος ist zwar grammatisch maskulin, bezeichnet jedoch häufig den Menschen allgemein. Im heutigen Deutschen bringt „Mensch“ den generischen Sinn präzise und ohne unnötige Geschlechtsverengung zum Ausdruck.
- issue: Zeitwert der Futurformen
  choice: sentenzielles Präsens im Deutschen
  alternative: „wird … vorsichtig sein“ und „wird sich … hüten“
  rationale: Die griechischen Futurformen beschreiben das kennzeichnende Verhalten eines weisen Menschen. In einer deutschen Weisheitssentenz klingt das Präsens natürlicher und bewahrt den allgemeinen Geltungsanspruch.
translation_notes:
  register: Knappes, würdiges und sprichwörtliches modernes Standarddeutsch. Das Präsens macht den allgemeinen Charakter der Weisheitsregel idiomatisch deutlich. Beide Fußnotenmarker stehen unmittelbar bei den jeweils erklärten Wendungen.
