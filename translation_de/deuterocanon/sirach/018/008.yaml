base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/018/008.yaml
  text: What is a man[a], and what is his use? What is his good[c][b], and what is his evil?
translation:
  language: de
  text: Was ist der Mensch, und welchen Nutzen hat er? Was ist sein Gutes und was sein Böses?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: »Böses« kann hier auch allgemeiner »Schlechtes« oder »Schaden« bedeuten; das griechische κακόν umfasst sowohl moralisch Böses als auch Nachteiliges oder Schädliches.
    reason: lexical_alternative
lexical_decisions:
- source_word: τί
  choice: was
  rationale: Das wiederholte τί leitet knappe rhetorische Fragen nach Bedeutung, Wert und Beschaffenheit des Menschen ein; »was« bewahrt Form und Ton.
- source_word: ἄνθρωπος
  choice: der Mensch
  rationale: Das singularische ἄνθρωπος bezeichnet hier generisch den Menschen. »Der Mensch« ist im modernen Deutschen natürlich, würdig und geschlechtsübergreifend.
- source_word: χρῆσις
  choice: Nutzen
  rationale: χρῆσις kann Gebrauch, Verwendung oder praktischen Wert bezeichnen. Da »sein Gebrauch« im Deutschen leicht den Gebrauch des Menschen durch andere nahelegt, gibt »welchen Nutzen hat er?« den gemeinten praktischen Wert idiomatischer wieder, ohne ihn auf einen göttlich gesetzten Zweck festzulegen.
- source_word: ἀγαθόν
  choice: Gutes
  rationale: Das substantivierte Neutrum steht in direktem Gegensatz zu κακόν. »sein Gutes« erhält die breite moralische und existenzielle Bedeutung.
- source_word: κακόν
  choice: Böses
  rationale: Im Gegensatz zu ἀγαθόν bezeichnet κακόν das Böse beziehungsweise Schlechte; »Böses« bewahrt das moralische Gewicht, ohne die weitere Bedeutung zu verschweigen.
- source_word: αὐτοῦ
  choice: sein / er
  rationale: Die wiederholten singularischen Bezüge gelten ἄνθρωπος. Im Deutschen werden sie entsprechend mit singularischen Formen wiedergegeben.
theological_decisions:
- issue: Generische Bezeichnung des Menschen
  choice: der Mensch ... er / sein
  alternative: ein Mann ... er / sein; die Menschen ... sie / ihr
  rationale: ἄνθρωπος ist hier generisch und singularisch. »Der Mensch« wahrt beides und vermeidet eine unnötige Einschränkung auf männliche Personen.
- issue: Moralische oder allgemein nachteilige Bedeutung von κακόν
  choice: Böses
  alternative: Schlechtes; Schaden
  rationale: Der Gegensatz zu ἀγαθόν lässt moralische Bedeutung anklingen, doch κακόν kann auch allgemeiner das Schlechte oder Schädliche bezeichnen. Die Fußnote hält diese Spannweite offen.
- issue: Praktischer Wert oder teleologischer Zweck bei χρῆσις
  choice: Nutzen
  alternative: Gebrauch; Zweck; Funktion
  rationale: »Nutzen« gibt den praktischen Wert wieder. »Zweck« würde eine stärkere teleologische Aussage einführen, als χρῆσις allein verlangt.
translation_notes:
  register: Knapper, rhetorischer Weisheitsstil in modernem Standarddeutsch. Die parallele Frageform und der Gegensatz »Gutes/Böses« bleiben erhalten; »welchen Nutzen hat er?« vermeidet das im Deutschen missverständliche »was ist sein Gebrauch?«.
