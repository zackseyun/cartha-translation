  terminology: „Verständige“, „Weisheit“, „erkannt“ und „Lob spenden“ treffen die jeweiligen griechischen Ausdrücke angemessen. Die Formulierung vermeidet eine unbegründete dogmatische Personifikation, bewahrt aber die feminine pronominale Rückverweisung des Ausgangstextes.
