  source_fidelity: 'Der Entwurf gibt die griechische Satzstruktur und die Rollenverteilung zutreffend wieder: πᾶς συνετός ist als distributiver maskuliner Singular („Jeder Verständige“) wiedergegeben, ἔγνω als abgeschlossene Erkenntnis, und der Dativ τῷ εὑρόντι αὐτήν bezeichnet den Empfänger des Lobes. Das unausgedrückte Subjekt von „wird er Lob spenden“ wird korrekt aus dem ersten Satzglied fortgeführt. Die feminine Rückverweisung „sie“ entspricht αὐτήν und verweist eindeutig auf „die Weisheit“.'
