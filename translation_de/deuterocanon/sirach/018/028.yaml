  yaml_path: translation/deuterocanon/sirach/018/028.yaml
  text: Every prudent man has recognized wisdom[a], and to the one who found her he will give praise.
translation:
  language: de
  text: Jeder Verständige hat die Weisheit erkannt[a], und dem, der sie gefunden hat, wird er Lob spenden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich steht im Griechischen ein maskuliner Singular für den verständigen Menschen und ein feminines Pronomen für die Weisheit.
    reason: Die Anmerkung macht die geschlechtsspezifische Form des Ausgangstextes sichtbar, ohne das grammatische Geschlecht zwingend als Personifikation auszulegen.
lexical_decisions:
- source_word: πᾶς συνετός
  choice: Jeder Verständige
  rationale: Der distributive Singular πᾶς mit dem substantivierten Adjektiv συνετός bezeichnet jeden Menschen, der Einsicht und Urteilsvermögen besitzt. „Verständige“ bewahrt die maskuline Singularform des Griechischen, ohne die Bedeutung auf bloße Klugheit zu verengen.
- source_word: ἔγνω
  choice: hat … erkannt
  rationale: Der Aorist von γινώσκω bezeichnet hier das Erfassen beziehungsweise Erkennen der Weisheit. Das deutsche Perfekt gibt den abgeschlossenen Vorgang in gegenwärtig natürlicher Sprache wieder.
- source_word: σοφίαν
  choice: die Weisheit
  rationale: Dies ist die übliche und kontextgerechte Wiedergabe von σοφία.
- source_word: τῷ εὑρόντι αὐτήν
  choice: dem, der sie gefunden hat
  rationale: Das substantivierte Partizip im Dativ bezeichnet den Empfänger des Lobes; das feminine Pronomen αὐτήν verweist auf σοφίαν zurück.
- source_word: δώσει ἐξομολόγησιν
  choice: wird er Lob spenden
  rationale: δώσει ist ein Futur. ἐξομολόγησις meint hier lobende oder dankbare Anerkennung; „Lob spenden“ ist im Deutschen würdig und idiomatisch.
theological_decisions:
- issue: Geschlechtsspezifische Darstellung des Verständigen und der Weisheit
  choice: „Jeder Verständige“ und das feminine Pronomen „sie“ beibehalten
  alternative: „Jeder verständige Mensch“ und eine unpersönlichere Umformulierung
  rationale: Der griechische Text verwendet für den verständigen Menschen einen maskulinen Singular und für die Weisheit ein feminines Pronomen. Die Übersetzung bildet beides ab, ohne aus dem grammatischen Femininum allein eine ausdrückliche Personifikation abzuleiten.
- issue: Bezug des Gebenden im zweiten Satzteil
  choice: Der Verständige ist das unausgesprochene Subjekt von „wird … spenden“; der Finder der Weisheit empfängt das Lob
  alternative: Den Finder selbst als denjenigen verstehen, der Lob spendet
  rationale: Der Dativ τῷ εὑρόντι kennzeichnet am natürlichsten den Empfänger, während das Subjekt von δώσει aus πᾶς συνετός fortgeführt wird. Die ungewöhnliche Aussage wird nicht geglättet oder theologisch umgedeutet.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung „dem … wird er“ folgt der Hervorhebung des Dativobjekts im Griechischen und erhält zugleich einen verständlichen deutschen Satzbau.
