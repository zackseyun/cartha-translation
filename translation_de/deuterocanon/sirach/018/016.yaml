  text: Before you make a vow[a], prepare your vow[b], and do not be like one who tests Yahweh.
translation:
  language: de
  text: Bevor du ein Gelübde ablegst, bereite dein Gelübde[a] vor und sei nicht wie einer, der Jahwe auf die Probe stellt.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die hebräische Form ist schwierig und kann schlicht „dein Gelübde“ bedeuten. Gemeint ist wahrscheinlich, dass man vor dem Geloben bereit und imstande sein soll, das Gelübde zu erfüllen.
    reason: lexical_alternative
  - marker: b
    text: 'Die griechische Überlieferung weicht hier erheblich ab: „Kühlt nicht Tau die Hitze? So ist ein Wort besser als eine Gabe.“ Ihr liegt offenbar eine andere Textform zugrunde.'
    reason: textual_variant
lexical_decisions:
- source_word: בְּטֶרֶם תִּדּוֹר
  choice: Bevor du ein Gelübde ablegst
  rationale: Die temporale Einleitung und das Verb נדר werden in natürlichem, modernem Deutsch wiedergegeben; „ein Gelübde ablegen“ ist idiomatischer als „geloben“ und bewahrt den konkreten religiösen Sinn.
- source_word: הָכֵן
  choice: bereite … vor
  rationale: Der Imperativ fordert dazu auf, vor dem Geloben alles Nötige bereitzumachen. Die offene Formulierung vermeidet eine nicht ausdrücklich genannte Ergänzung wie „zur Erfüllung“.
- source_word: נִדְרֶךָ
  choice: dein Gelübde
  rationale: Die Form bezeichnet am naheliegendsten das eigene Gelübde, ist im hebräischen Zeugen jedoch nicht völlig unproblematisch. Die wörtlich-nahe Wiedergabe lässt offen, ob besonders Inhalt, Durchführung oder Erfüllbarkeit gemeint ist.
- source_word: בַּל תִּהְיֶה
  choice: sei nicht
  rationale: Die hebräische Verneinung mit Verbform hat hier den Sinn einer direkten warnenden Aufforderung.
- source_word: כִּמְנַסָּה
  choice: wie einer, der … auf die Probe stellt
  rationale: נסה bezeichnet das Erproben oder Prüfen. „Auf die Probe stellen“ ist im Deutschen klar und trifft hier die tadelnde Bedeutung.
- source_word: יְהֹוָה
  choice: Jahwe
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm; „Jahwe“ gibt den Gottesnamen erkennbar und ohne Umschreibung wieder.
theological_decisions:
- issue: Bedeutung des Prüfens Jahwes
  choice: der Jahwe auf die Probe stellt
  alternative: der Jahwe versucht
  rationale: „Versuchen“ könnte im heutigen Deutsch fälschlich als Verlocken zur Sünde verstanden werden. „Auf die Probe stellen“ bewahrt die Warnung, Gottes Zuverlässigkeit durch ein unvorbereitetes Gelübde herauszufordern, ohne den Zusammenhang dogmatisch auszudeuten.
- issue: Wiedergabe des Gottesnamens יְהֹוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Da der hebräische Ausgangstext den Eigennamen enthält, wird er als „Jahwe“ wiedergegeben; so bleibt der Unterschied zwischen Gottes Namen und einem Titel sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit direkter Anrede. Die leicht ungewöhnliche Wendung „bereite dein Gelübde vor“ bleibt bewusst nahe am Hebräischen; die Fußnote erläutert den wahrscheinlichen Sinn, ohne die Mehrdeutigkeit im Haupttext aufzulösen.
