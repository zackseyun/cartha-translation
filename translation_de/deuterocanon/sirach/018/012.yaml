  text: He saw and recognized that their destruction was evil[b][a]; therefore he multiplied his atonement for them.
translation:
  language: de
  text: Er sah und erkannte, dass ihr Untergang[a] schlimm war; deshalb vermehrte er seine Sühne[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: ihr Verderben oder ihre Vernichtung.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: seine Entsühnung. Das griechische Wort bezeichnet Sühne beziehungsweise die Beseitigung von Schuld oder Anstoß.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἶδεν καὶ ἐπέγνω
  choice: Er sah und erkannte
  rationale: 'Die beiden Verben werden in ihrer Abfolge bewahrt: Auf das Wahrnehmen folgt das eingehendere Erkennen.'
- source_word: τὴν καταστροφὴν αὐτῶν
  choice: ihr Untergang
  rationale: καταστροφή bezeichnet Umsturz, Verderben oder Untergang. „Untergang“ gibt den schlimmen Ausgang ihres Lebens natürlich wieder, ohne die Bildweite auf einen einzelnen Vorgang festzulegen.
- source_word: ὅτι πονηρά
  choice: dass … schlimm war
  rationale: πονηρός kann moralisch „böse“, aber auch „schlimm“, „elend“ oder „verhängnisvoll“ bedeuten. Da das Wort hier den Untergang qualifiziert, vermeidet „schlimm“ eine vorschnelle moralische Personifizierung des Schicksals.
- source_word: διὰ τοῦτο ἐπλήθυνεν
  choice: deshalb vermehrte er
  rationale: Die Folgerung und die steigernde Bedeutung von πληθύνω werden eng am Griechischen wiedergegeben.
- source_word: τὸν ἐξιλασμὸν αὐτοῦ
  choice: seine Sühne
  rationale: ἐξιλασμός bezeichnet Sühne beziehungsweise Entsühnung. „Sühne“ ist im Deutschen verständlich, theologisch gewichtig und bewahrt das Possessivpronomen; ein nicht ausdrücklich genanntes „für sie“ wird nicht in den Haupttext eingefügt.
theological_decisions:
- issue: Bedeutung von ἐξιλασμός
  choice: Sühne
  alternative: Entsühnung; Erbarmen
  rationale: „Sühne“ erhält den Bezug zur Beseitigung von Schuld oder Anstoß. „Erbarmen“ wäre im Kontext verständlich, würde die spezifische Bedeutung des griechischen Sühnebegriffs jedoch abschwächen.
- issue: Nicht ausdrücklich genanntes Bezugsobjekt der Sühne
  choice: Kein ergänztes „für sie“ im Haupttext
  alternative: seine Sühne für sie
  rationale: Das Griechische enthält nur „seine Sühne“. Der Zusammenhang legt zwar einen Bezug auf die Menschen nahe, doch eine Ergänzung würde die grammatische Offenheit des Ausgangstextes einschränken.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Satzstruktur und die gedankliche Bewegung vom Erkennen zur Sühne bleiben erhalten; seltene Fachsprache und nicht ausdrücklich vorhandene Ergänzungen werden vermieden.
