  source_fidelity: Der Text gibt die Abfolge von ἶδεν καὶ ἐπέγνω treffend mit „sah und erkannte“ wieder. „ihr Untergang“ ist eine angemessene, nicht zu enge Wiedergabe von τὴν καταστροφὴν αὐτῶν; „schlimm“ bewahrt die hier kontextuell naheliegende Bedeutung von πονηρά, ohne eine moralische Bewertung des Untergangs zu erzwingen. „deshalb vermehrte er seine Sühne“ folgt dem griechischen Wortlaut, einschließlich des nicht weiter ausgeführten Bezugs der Sühne, genauer als die englische Auditfassung mit ergänztem „für sie“.
  naturalness: Der Satz ist klares, würdevolles modernes Standarddeutsch. Die Formulierung „seine Sühne vermehren“ ist bewusst gehoben, aber als nahe und verständliche Wiedergabe von ἐπλήθυνεν τὸν ἐξιλασμὸν αὐτοῦ tragfähig.
  terminology: „Sühne“ bewahrt das Gewicht von ἐξιλασμός besser als eine bloße Umschreibung mit „Erbarmen“. Die Fußnote bietet mit „Entsühnung“ eine lexikalische Alternative und erläutert den Begriff, ohne eine bestimmte theologische Deutung festzulegen. Die Anker stehen unmittelbar bei den jeweils erläuterten Ausdrücken.
