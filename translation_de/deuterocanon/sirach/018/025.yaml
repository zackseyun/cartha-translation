  text: Remember the time of famine in the time of plenty[a], and poverty and need in the days of wealth.
translation:
  language: de
  text: Denk in der Zeit des Überflusses an die Zeit der Hungersnot[a], an Armut und Mangel in den Tagen des Reichtums.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Zeit des Hungers … die Zeit der Fülle“. Das Griechische stellt Zeiten der Knappheit und der Fülle einander gegenüber.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μνήσθητι
  choice: Denk … an
  rationale: Der Aoristimperativ fordert zu bewusster Erinnerung auf. Die im Deutschen trennbare Formulierung „Denk … an“ ist direkt, natürlich und bewahrt den mahnenden Charakter.
- source_word: καιρὸν λιμοῦ
  choice: die Zeit der Hungersnot
  rationale: καιρός bezeichnet eine Zeit oder einen Zeitabschnitt; λιμός meint eine Hungersnot, nicht nur persönlichen Hunger. „Zeit der Hungersnot“ wahrt die konkrete wirtschaftliche Notlage.
- source_word: ἐν καιρῷ πλησμονῆς
  choice: in der Zeit des Überflusses
  rationale: πλησμονή bezeichnet Fülle oder Überfluss. „Überfluss“ bildet einen klaren Gegensatz zur Hungersnot und bleibt nahe an der griechischen Bildsprache.
- source_word: πτωχείαν
  choice: Armut
  rationale: πτωχεία bezeichnet den Zustand des Armseins. „Armut“ ist die direkte und allgemein verständliche Entsprechung.
- source_word: ἔνδειαν
  choice: Mangel
  rationale: ἔνδεια bezeichnet ein Fehlen des Nötigen oder Bedürftigkeit. „Mangel“ unterscheidet sich hinreichend von „Armut“ und erhält damit die zweigliedrige Aussage.
- source_word: ἐν ἡμέραις πλούτου
  choice: in den Tagen des Reichtums
  rationale: πλοῦτος bedeutet Reichtum oder Besitzfülle. Die Formulierung bewahrt das griechische Bild der „Tage“ und den konkreten Gegensatz zu Armut und Mangel.
theological_decisions:
- issue: Ob der Vers zu einer allgemeinen Mahnung über künftig mögliche schwere Zeiten geglättet werden soll
  choice: Die konkreten Gegenüberstellungen Hungersnot/Überfluss und Armut sowie Mangel/Reichtum bleiben erhalten.
  alternative: 'Eine verallgemeinernde Paraphrase wie: „Denk in guten Zeiten daran, dass schlechte Zeiten kommen können.“'
  rationale: Der griechische Text nennt bestimmte wirtschaftliche Lebenslagen in ausgewogenem Parallelismus. Ihre Beibehaltung wahrt die Weisheitsdichtung und vermeidet eine über den Wortlaut hinausgehende Deutung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der leicht gehobene Ausdruck „in den Tagen des Reichtums“ erhält den poetischen Parallelismus; „Denk … an“ bleibt zugleich unmittelbar und allgemein verständlich.
