base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/018/024.yaml
  text: Remember wrath in the days of your end[b][a], and the time of vengeance at the turning away of the face.
translation:
  language: de
  text: Denk an den Zorn in den Tagen des Endes[a] und an die Zeit der Vergeltung bei der Abwendung eines Angesichts.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Des Endes“ kann hier auch Tod oder letzte Tage bedeuten; der griechische Text nennt keine Person, auf deren Ende sich die Wendung bezieht.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „bei der Abwendung eines Angesichts“. Wahrscheinlich ist der Entzug göttlicher Gunst gemeint; der griechische Text nennt jedoch weder, wessen Angesicht gemeint ist, noch wer es abwendet.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μνήσθητι
  choice: Denk an
  rationale: Der Aoristimperativ fordert nachdrücklich dazu auf, etwas im Bewusstsein zu behalten. „Denk an“ ist im modernen Deutsch direkt und natürlich.
- source_word: θυμοῦ
  choice: den Zorn
  rationale: θυμός kann starken Zorn oder Grimm bezeichnen. Im Zusammenhang mit Vergeltung und Lebensende liegt ein feierlicher Gerichtskontext nahe, ohne dass der Träger des Zorns ausdrücklich genannt wird.
- source_word: ἐν ἡμέραις τελευτῆς
  choice: in den Tagen deines Endes
  rationale: τελευτή bezeichnet Ende, Lebensende oder Tod. Die Formulierung bewahrt die ungewöhnliche, aber verständliche Bildsprache des Griechischen; eine Fußnote erläutert die wahrscheinliche Bedeutung.
- source_word: καιρὸν
  choice: die Zeit
  rationale: καιρός bezeichnet einen bestimmten Zeitpunkt oder eine entscheidende Zeit. Der Genitiv „der Vergeltung“ konkretisiert ihn.
- source_word: ἐκδικήσεως
  choice: der Vergeltung
  rationale: ἐκδίκησις kann Vergeltung, Bestrafung oder Rechtsschaffung bezeichnen. „Vergeltung“ erhält hier sowohl den gerichtlichen als auch den nicht ausdrücklich personifizierten Charakter.
- source_word: ἐν ἀποστροφῇ προσώπου
  choice: wenn sich das Angesicht abwendet
  rationale: Die Wiedergabe erhält das Bild des abgewandten Angesichts und liest die griechische Nominalfügung in natürlichem Deutsch temporal, ohne Gott als Subjekt ausdrücklich einzusetzen.
theological_decisions:
- issue: Ob Gott ausdrücklich als Urheber des Zorns, der Vergeltung und des Abwendens genannt werden soll
  choice: Das Subjekt bleibt wie im Griechischen unausgesprochen.
  alternative: „wenn Gott sein Angesicht abwendet“ beziehungsweise eine durchgehend ausdrücklich göttliche Gerichtssprache
  rationale: Der Zusammenhang legt göttliches Gericht nahe, doch der griechische Text nennt Gott hier nicht. Die Übersetzung bewahrt diese Zurückhaltung und damit die echte Offenheit des Ausdrucks.
- issue: Bedeutung der Abwendung des Angesichts
  choice: Das konkrete Bild bleibt im Haupttext stehen.
  alternative: „wenn die Gunst entzogen wird“
  rationale: Ein Entzug göttlicher Gunst ist wahrscheinlich gemeint, aber eine Auflösung des Bildes würde die Aussage stärker deuten, als der Wortlaut erlaubt.
translation_notes:
  register: Moderne, würdige Standardsprache. Die auffällige Wendung „Tage deines Endes“ und das Bild des abgewandten Angesichts werden bewusst erhalten; Fußnoten sichern Verständlichkeit, ohne die implizite Gottesreferenz in den Haupttext einzutragen.
