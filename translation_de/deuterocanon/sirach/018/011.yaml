  text: Therefore the Lord was patient with them, and poured out his mercy upon them.
translation:
  language: de
  text: Darum hatte der Herr Geduld mit ihnen und goss sein Erbarmen über sie aus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Darum
  rationale: Gibt den folgernden beziehungsweise begründenden Anschluss an den vorausgehenden Zusammenhang knapp und natürlich wieder.
- source_word: ἐμακροθύμησεν
  choice: hatte ... Geduld
  rationale: Bezeichnet langmütiges, geduldiges Verhalten. Die deutsche Wendung ist gegenwärtig und verständlich, ohne den Sinn auf bloßen Aufschub des Zorns zu verengen.
- source_word: Κύριος
  choice: der Herr
  rationale: Die etablierte und im Deutschen natürliche Wiedergabe des göttlichen Titels κύριος.
- source_word: ἐπʼ αὐτοῖς
  choice: mit ihnen
  rationale: Bei »Geduld haben« verlangt idiomatisches Deutsch die Präposition »mit«.
- source_word: ἐξέχεεν
  choice: goss ... aus
  rationale: Bewahrt das konkrete Bild des griechischen Verbs ἐκχέω.
- source_word: τὸ ἔλεος αὐτοῦ
  choice: sein Erbarmen
  rationale: ἔλεος bezeichnet barmherzige Zuwendung. »Erbarmen« ist würdig, verständlich und passt natürlich zum Bild des Ausgießens.
- source_word: ἐπʼ αὐτοὺς
  choice: über sie
  rationale: Verbindet sich im Deutschen natürlich mit »ausgießen« und erhält die räumliche Bildsprache der griechischen Präposition.
theological_decisions:
- issue: Wiedergabe von κύριος als göttlicher Titel
  choice: der Herr
  alternative: Herr
  rationale: Der bestimmte Artikel ist im deutschen Satzbau die natürliche Form für den auf Gott bezogenen Titel; eine weitergehende Identifikation wird nicht in den Text eingetragen.
- issue: Bedeutungsumfang von ἔλεος
  choice: Erbarmen
  alternative: Barmherzigkeit
  rationale: Beide Wiedergaben sind möglich. »Erbarmen« bezeichnet hier klar Gottes konkrete barmherzige Zuwendung und lässt das Ausgießungsbild natürlich klingen, ohne eine konfessionelle Sonderdeutung einzuführen.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, allgemein verständlichem Stil. Der Parallelismus der beiden griechischen Hauptsätze und die Metapher des Ausgießens bleiben erhalten.
