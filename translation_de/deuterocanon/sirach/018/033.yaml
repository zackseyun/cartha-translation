  text: Do not be a glutton and a drunkard[b][a], when there is nothing in your purse.
translation:
  language: de
  text: Sei kein Vielfraß und Säufer, wenn in deinem Geldbeutel nichts ist.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische בַּכִּים ist schwierig. Die griechische Parallele hat „in deinem Geldbeutel“ und stützt damit die hier gewählte wirtschaftliche Deutung.
    reason: textual_variant
  - marker: b
    text: 'Die griechische Überlieferung formuliert ausführlicher: „Werde nicht arm, indem du mit geliehenem Geld Gelage hältst, wenn du nichts in deinem Geldbeutel hast.“'
    reason: alternative_reading
lexical_decisions:
- source_word: זוֹלֵל
  choice: Vielfraß
  rationale: Das Wort bezeichnet im weisheitlichen Zusammenhang einen maßlosen, zugleich verschwenderischen Esser. Zusammen mit וְסוֹבֵא bildet es ein prägnantes Lasterpaar.
- source_word: וְסוֹבֵא
  choice: und Säufer
  rationale: Das Wort meint einen Menschen, der sich übermäßigem Trinken hingibt. „Säufer“ ist gegenwärtig verständlich und bewahrt den deutlich tadelnden Ton.
- source_word: וּמְאוּמָה אֵין
  choice: wenn … nichts ist
  rationale: Wörtlich steht eine mit „und“ angeschlossene Aussage des Mangels. Im Deutschen bringt „wenn“ den sachlichen Zusammenhang der Mahnung natürlich zum Ausdruck, ohne ihn übermäßig festzulegen.
- source_word: בַּכִּים
  choice: in deinem Geldbeutel
  rationale: Die hebräische Form ist schwierig. Die griechische Parallele ἐν μαρσιππίῳ („im Geldbeutel“) stützt eine wirtschaftliche Deutung; „Geldbeutel“ ist im heutigen Deutsch eindeutig und natürlich.
theological_decisions:
- issue: Verhältnis des erhaltenen hebräischen Wortlauts zur ausführlicheren griechischen Parallele
  choice: Die Mahnung gegen Völlerei und Trunksucht folgt dem Hebräischen; nur die wirtschaftliche Bedeutung des schwierigen Schlusswortes wird mithilfe des Griechischen wiedergegeben.
  alternative: „Werde nicht arm, indem du mit geliehenem Geld Gelage hältst, wenn du nichts in deinem Geldbeutel hast.“
  rationale: Der hebräische Text ist hier die Hauptgrundlage. Die griechische Fassung verdeutlicht vermutlich den wirtschaftlichen Zusammenhang, enthält aber zusätzliche Aussagen über Verarmung, Gelage und geliehenes Geld, die nicht stillschweigend in den Haupttext aufgenommen werden sollen.
translation_notes:
  register: Knappes, würdiges und allgemein verständliches Standarddeutsch. „Vielfraß und Säufer“ erhält die parallele, moralisch zugespitzte Form des Hebräischen; „Geldbeutel“ vermittelt den wirtschaftlichen Sinn ohne altertümlichen Klang.
