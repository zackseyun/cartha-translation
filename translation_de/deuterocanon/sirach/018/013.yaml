base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/018/013.yaml
  text: A man's mercy is for his neighbor[a], but the Lord's mercy is for all flesh[b]; he rebukes and disciplines and teaches and turns back his flock like a shepherd.
translation:
  language: de
  text: Das Erbarmen eines Menschen gilt seinem Nächsten, das Erbarmen des Herrn aber allem Fleisch.[a] Er weist zurecht, erzieht und lehrt und führt wie ein Hirte seine Herde zurück.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „allen Menschen“ oder „jedem Lebewesen“. Der griechische Ausdruck „alles Fleisch“ ist eine weit gefasste biblische Bezeichnung für geschöpfliches Leben.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „bringt seine Herde zurück“ oder „stellt seine Herde wieder her“. Das griechische Verb bedeutet wörtlich „zurückwenden“ und passt zum Bild eines Hirten, der Verirrte zurückholt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεος
  choice: Erbarmen
  rationale: „Erbarmen“ bezeichnet barmherzige Zuwendung und bewahrt in beiden Satzhälften das ethische wie theologische Gewicht des griechischen Begriffs.
- source_word: ἀνθρώπου
  choice: eines Menschen
  rationale: Die generische Einzahl bleibt erhalten; „Mensch“ ist im heutigen Deutsch natürlich und schließt Frauen und Männer ein.
- source_word: πλησίον
  choice: seinem Nächsten
  rationale: „Der Nächste“ ist die geläufige ethische Wiedergabe von πλησίον und erhält den Gegensatz zwischen begrenztem menschlichem und umfassendem göttlichem Erbarmen.
- source_word: Κυρίου
  choice: des Herrn
  rationale: Die traditionelle und sachgerechte Wiedergabe von κύριος erhält die Parallelstruktur zum Erbarmen eines Menschen.
- source_word: πᾶσαν σάρκα
  choice: allem Fleisch
  rationale: Die biblische Wendung bleibt bewusst erhalten und wird nicht vorschnell auf die gesamte Menschheit oder alle Lebewesen eingeengt.
- source_word: ἐλέγχων
  choice: weist zurecht
  rationale: Die Wendung gibt korrigierende Zurechtweisung wieder, ohne sie auf bloßen Tadel oder gerichtliche Überführung zu verengen.
- source_word: παιδεύων
  choice: erzieht
  rationale: „Erzieht“ bewahrt den formenden und korrigierenden Charakter von παιδεύω und klingt weniger einseitig strafend als „züchtigt“.
- source_word: διδάσκων
  choice: lehrt
  rationale: Eine direkte und natürliche Wiedergabe, die sich in die Folge fürsorglich-korrigierender Handlungen einfügt.
- source_word: ἐπιστρέφων
  choice: führt … zurück
  rationale: Die Formulierung erhält die Grundbedeutung des Zurückwendens und passt zum Bild des Hirten, der eine verirrte Herde zurückführt.
- source_word: ὡς ποιμήν
  choice: wie ein Hirte
  rationale: Die ausdrücklich als Vergleich formulierte Hirtenmetapher wird im heutigen Deutsch klar wiedergegeben.
- source_word: τὸ ποίμνιον αὐτοῦ
  choice: seine Herde
  rationale: „Herde“ ist die natürliche deutsche Bezeichnung und bewahrt das pastorale Bild ohne eine mögliche Diminutivnuance zu überzeichnen.
theological_decisions:
- issue: Reichweite von πᾶσαν σάρκα
  choice: Die Wendung wird wörtlich als „alles Fleisch“ bewahrt und in der Fußnote als bewusst weit gefasster biblischer Ausdruck erläutert.
  alternative: alle Menschen; jedes Lebewesen
  rationale: Der Ausdruck stellt das umfassende Erbarmen des Herrn dem begrenzteren menschlichen Erbarmen gegenüber. Eine eindeutige Einschränkung auf Menschen oder eine Festlegung auf sämtliche Lebewesen würde die vorhandene Bedeutungsweite auflösen.
- issue: Subjekt der Partizipien ἐλέγχων, παιδεύων, διδάσκων und ἐπιστρέφων
  choice: 'Die Handlungen werden auf den Herrn bezogen: „Er weist zurecht …“'
  alternative: Die Partizipien attributiv oder modal auf das Erbarmen beziehen
  rationale: Die maskulinen Partizipien stimmen nicht mit dem sächlichen ἔλεος überein und weisen daher auf den Herrn als handelndes Subjekt; zugleich beschreiben die Handlungen, wie sich sein Erbarmen auswirkt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Erbarmen“, „der Herr“ und „alles Fleisch“ bewahren den biblischen Klang, während „weist zurecht“, „erzieht“ und „führt zurück“ allgemein verständlich bleiben. Die wiederholte Konjunktion vor dem letzten Handlungsschritt spiegelt die griechische Reihung, ohne im Deutschen schwerfällig zu wirken.
