  source_fidelity: Die zweite Satzhälfte gibt παύσηται und ἀπορηθήσεται zutreffend und ohne unzulässige Einengung wieder. In der ersten Satzhälfte verschiebt „ans Ende gekommen ist“ jedoch das aktive συντελέσῃ („vollendet/zu Ende bringt“) zu einem intransitiven Erreichen des eigenen Endes und kann dadurch besonders leicht den Tod nahelegen. Der griechische Text nennt weder Tod noch einen bestimmten Gegenstand des Vollendens.
  naturalness: Die Parallelstruktur ist klar und sprichwortartig. „Etwas zu Ende gebracht hat“ ist modernes, idiomatisches Standarddeutsch und hält den nicht näher bestimmten Gegenstand offen. „wird er ratlos sein“ ist natürlich und wahrt die Zukunft des griechischen Futurs.
  terminology: „Ein Mensch“ gibt ἄνθρωπος als generischen Singular angemessen wieder. „Fängt er erst an“ vermittelt die paradoxe Zuspitzung natürlich. Die Fußnoten bieten sachgerechte lexikalische Alternativen; bei Fußnote b ist „keinen Ausweg finden“ idiomatischer als „keinen Ausweg wissen“.
  issues:
