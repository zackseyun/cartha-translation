base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/018/007.yaml
  text: When a man has finished[a], then he is just beginning; and when he stops[b], then he will be at a loss.
translation:
  language: de
  text: Wenn ein Mensch etwas zu Ende gebracht hat,[a] fängt er erst an; und wenn er aufhört, wird er ratlos sein.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Wenn ein Mensch etwas vollendet hat«. Das griechische Verb bezeichnet das Vollenden oder Zu-Ende-Bringen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »wird er keinen Ausweg finden« beziehungsweise »wird er in Verlegenheit geraten«. Das griechische Wort kann Ratlosigkeit und das Fehlen eines Weges oder einer Antwort bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν
  choice: wenn
  rationale: Leitet jeweils eine allgemeine zeitliche Bedingung ein und bewahrt den knappen, sprichwortartigen Stil.
- source_word: συντελέσῃ
  choice: ans Ende gekommen ist
  rationale: Gibt das Erreichen oder Herbeiführen eines Abschlusses natürlich wieder, ohne ausdrücklich festzulegen, ob ein Werk, ein Erkenntnisweg oder der Lebenslauf gemeint ist.
- source_word: ἄνθρωπος
  choice: ein Mensch
  rationale: Entspricht dem generisch gebrauchten Singular und klingt im heutigen Standarddeutsch natürlich und allgemein.
- source_word: τότε ἄρχεται
  choice: fängt er erst an
  rationale: Gibt das schlichte »beginnt« wieder; »erst« bringt die paradoxe Gegenüberstellung von Abschluss und Anfang idiomatisch zum Ausdruck.
- source_word: παύσηται
  choice: aufhört
  rationale: Ist eine direkte, moderne Wiedergabe des Aufhörens oder Ablassens und lässt den Gegenstand unausgesprochen wie im Griechischen.
- source_word: ἀπορηθήσεται
  choice: wird er ratlos sein
  rationale: Erfasst den passivisch-zukünftigen Sinn, in Ratlosigkeit zu geraten beziehungsweise keinen Ausweg oder keine Antwort zu wissen.
theological_decisions:
- issue: Aussageabsicht des Spruchs über die Grenzen des Menschen
  choice: 'Der Wortlaut bleibt ein offenes Paradox: Selbst am erreichten Ende beginnt der Mensch erst, und beim Aufhören gerät er in Ratlosigkeit.'
  alternative: Den Vers ausschließlich auf endlose menschliche Arbeit oder auf den Tod als Ende menschlicher Tätigkeit beziehen.
  rationale: Der knappe griechische Text nennt weder Arbeit noch Tod ausdrücklich. Eine engere Deutung würde die echte inhaltliche Spannung unzulässig auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper sprichwortartiger Parallelstruktur. Die Gegenüberstellung von Ende und Anfang sowie die Unbestimmtheit dessen, womit der Mensch aufhört, bleiben erhalten.
