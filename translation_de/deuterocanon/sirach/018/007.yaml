revisions:
- from: Wenn ein Mensch ans Ende gekommen ist,[a] fängt er erst an; und wenn er aufhört, wird er ratlos sein.[b]
  to: Wenn ein Mensch etwas zu Ende gebracht hat,[a] fängt er erst an; und wenn er aufhört, wird er ratlos sein.[b]
  rationale: Die Revision stellt in der ersten Zeile die aktive Bedeutung von συντελέσῃ wieder her. Das bewusst allgemeine „etwas“ ist im Deutschen erforderlich, ohne einen konkreten Gegenstand wie Arbeit, Erkenntnis oder Leben festzulegen. Die offene paradoxe Aussage und die Zukunftsform der zweiten Zeile bleiben erhalten.
