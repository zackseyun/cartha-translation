    issue: „ans Ende gekommen ist“ für συντελέσῃ
    rationale: Die Formulierung beschreibt primär, dass der Mensch selbst an sein Ende gelangt ist, während das aktive griechische Verb das Vollenden bzw. Zu-Ende-Bringen ausdrückt. Dies kann den offenen Spruch unbegründet auf das Lebensende lenken.
  - severity: low
    issue: „keinen Ausweg wissen“ in Fußnote b
    rationale: Die Wendung ist verständlich, aber weniger idiomatisch als „keinen Ausweg finden“ und trifft die Bedeutung des Ratlos-Werdens ebenso gut.
