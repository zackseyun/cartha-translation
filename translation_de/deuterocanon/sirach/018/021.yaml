  text: Before you become sick[a], humble yourself, and in the time of sins show repentance.
translation:
  language: de
  text: Bevor du krank wirst, demütige dich, und zur Zeit der Sünden zeige Umkehr[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „erweise Reue“ beziehungsweise „zeige deine Rückkehr“. Das griechische Wort kann eine Umkehr oder Rückkehr bezeichnen; wegen des unmittelbaren Bezugs auf Sünden liegt hier Umkehr im Sinn von Reue nahe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὶν ἀρρωστῆσαί σε
  choice: Bevor du krank wirst
  rationale: Die Konstruktion bezeichnet den Zeitpunkt vor dem Eintreten einer Krankheit; „krank wirst“ bewahrt den ingressiven Sinn und klingt im heutigen Deutsch natürlich.
- source_word: ταπεινώθητι
  choice: demütige dich
  rationale: Der formal passive Imperativ hat hier in der Weisheitsmahnung reflexiven Sinn und ruft zu freiwilliger Demut auf.
- source_word: ἐν καιρῷ ἁμαρτημάτων
  choice: zur Zeit der Sünden
  rationale: Die Formulierung erhält den zeitlichen Ausdruck καιρός und den Plural „Sünden“, ohne den nicht ganz eindeutigen Zusammenhang näher festzulegen.
- source_word: δεῖξον
  choice: zeige
  rationale: „Zeige“ gibt den Imperativ direkt wieder und bewahrt den Gedanken, dass die Umkehr sichtbar werden soll.
- source_word: ἐπιστροφήν
  choice: Umkehr
  rationale: „Umkehr“ bewahrt sowohl den Grundsinn des Zurückwendens als auch die im Zusammenhang mit Sünden naheliegende Bedeutung der Buße.
theological_decisions:
- issue: Bedeutung von ἐπιστροφήν im Zusammenhang mit ἁμαρτημάτων
  choice: Umkehr
  alternative: Buße; Rückkehr
  rationale: „Umkehr“ lässt die ethisch-religiöse Hinwendung weg von den Sünden erkennen, ohne das griechische Wort auf einen späteren theologischen Fachbegriff zu verengen.
- issue: Diathese von ταπεινώθητι
  choice: demütige dich
  alternative: lass dich demütigen; werde demütig
  rationale: Im Kontext einer Aufforderung ist die reflexive Wiedergabe im Deutschen am natürlichsten; sie versteht die Demut als bewusst vollzogene Haltung, ohne eine von außen auferlegte Erniedrigung zu behaupten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Parallelstruktur und beide Imperative bleiben erhalten; die ungewöhnliche Wendung „zur Zeit der Sünden“ wahrt die Offenheit des griechischen Ausdrucks.
