  text: Before judgment[a], examine yourself[b], and in the hour of visitation you will find atonement.
translation:
  language: de
  text: Vor dem Gericht prüfe dich selbst; und in der Stunde der Heimsuchung[a] wirst du Sühne[b] finden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in der Stunde der Prüfung“ oder „zur Zeit der Abrechnung“. Das griechische Wort kann eine Überprüfung, eine göttliche Heimsuchung oder ein entscheidendes Eingreifen bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Entsühnung“ beziehungsweise „Versöhnung“. Das griechische Wort bezeichnet die Beseitigung von Schuld und die Wiederherstellung des gestörten Verhältnisses.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸ κρίσεως
  choice: Vor dem Gericht
  rationale: κρίσις bezeichnet hier eine richterliche Beurteilung oder ein Gericht. „Vor dem Gericht“ wahrt den weiten Sinn, ohne ihn auf eine Verurteilung einzuengen.
- source_word: ἐξέταζε σεαυτόν
  choice: prüfe dich selbst
  rationale: Der Imperativ fordert zur gründlichen Selbstprüfung auf. Die Wendung ist im modernen Deutsch klar und gibt sowohl die prüfende Tätigkeit als auch das Reflexivpronomen unmittelbar wieder.
- source_word: ἐν ὥρᾳ ἐπισκοπῆς
  choice: in der Stunde der Heimsuchung
  rationale: ἐπισκοπή kann Prüfung, Aufsicht oder Heimsuchung bedeuten und im biblischen Sprachgebrauch eine göttliche Überprüfung oder ein göttliches Eingreifen bezeichnen. „Heimsuchung“ bewahrt diese Bedeutungsbreite und den feierlichen Ton.
- source_word: εὑρήσεις
  choice: wirst du … finden
  rationale: Die Zukunftsform von εὑρίσκω wird direkt und idiomatisch mit „wirst du finden“ wiedergegeben.
- source_word: ἐξιλασμόν
  choice: Sühne
  rationale: ἐξιλασμός bezeichnet die Beseitigung von Schuld und die Wiederherstellung des gestörten Verhältnisses. „Sühne“ erhält diesen kultisch-versöhnenden Gehalt besser als das engere „Vergebung“.
theological_decisions:
- issue: Bedeutung von ἐπισκοπή im weisheitlichen Zusammenhang
  choice: Heimsuchung mit möglichem göttlich-richterlichem Anklang
  alternative: Prüfung; Untersuchung; Abrechnung
  rationale: Der Ausdruck kann den entscheidenden Zeitpunkt bezeichnen, an dem ein Mensch geprüft oder zur Rechenschaft gezogen wird, möglicherweise durch Gott. Die Übersetzung lässt offen, ob vor allem Überprüfung, Gericht oder göttliches Eingreifen gemeint ist.
- issue: Wiedergabe von ἐξιλασμόν
  choice: Sühne
  alternative: Entsühnung; Versöhnung; Vergebung
  rationale: „Sühne“ bewahrt den Gedanken der Schuldtilgung und der Wiederherstellung des Verhältnisses, ohne den Begriff lediglich auf Vergebung zu reduzieren oder eine bestimmte Sühnetheorie festzulegen.
translation_notes:
  register: Klares, würdiges Standarddeutsch mit bewusst beibehaltenem biblischem Ausdruck „Heimsuchung“. Das Semikolon bildet die enge gedankliche Verbindung der beiden Satzhälften ab. Die Fußnotenmarker stehen bei den tatsächlich erläuterten Ausdrücken; damit wird die offenbar vertauschte Zuordnung der Marker in der englischen Konsultationsfassung sachgerecht korrigiert.
