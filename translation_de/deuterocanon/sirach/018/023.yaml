  text: Before you pray[a], prepare yourself, and do not be like a man testing the Lord.
translation:
  language: de
  text: Bevor du betest, bereite dich vor, und werde nicht wie ein Mensch, der den Herrn auf die Probe stellt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der den Herrn versucht“. Das griechische Verb kann sowohl „prüfen/auf die Probe stellen“ als auch „versuchen“ bedeuten; hier ist wahrscheinlich gemeint, den Herrn herausfordernd auf die Probe zu stellen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὶν εὔξασθαι
  choice: Bevor du betest
  rationale: Die temporale Konstruktion wird im modernen Deutschen natürlich als Nebensatz wiedergegeben. εὔχομαι bezeichnet hier im Weisheitskontext am ehesten das Beten, auch wenn das Verb ebenfalls Gelübdesprache tragen kann.
- source_word: ἑτοίμασον σεαυτόν
  choice: bereite dich vor
  rationale: Der Imperativ und das Reflexivpronomen fordern persönliche, bewusste Vorbereitung; die deutsche Wendung ist präzise und idiomatisch.
- source_word: μὴ γίνου
  choice: werde nicht
  rationale: Die Wiedergabe bewahrt den dynamischen Sinn von γίνομαι („werden“), statt ihn zu einem bloßen Zustand abzuflachen.
- source_word: ὡς ἄνθρωπος
  choice: wie ein Mensch
  rationale: ἄνθρωπος bezeichnet hier generisch einen Menschen. „Mensch“ erhält den Singular und die allgemeine Aussage, ohne im Deutschen unnötig auf ein männliches Geschlecht festzulegen.
- source_word: πειράζων
  choice: der … auf die Probe stellt
  rationale: πειράζω kann sowohl „prüfen/auf die Probe stellen“ als auch „versuchen“ bedeuten. Bei Gott als Objekt bezeichnet die Wendung am ehesten ein vermessenes Erproben Gottes.
- source_word: τὸν κύριον
  choice: den Herrn
  rationale: κύριος verweist in diesem jüdischen Weisheitstext auf Gott und wird traditionsgemäß und sachgerecht mit „der Herr“ wiedergegeben.
theological_decisions:
- issue: Bedeutung von πειράζων τὸν κύριον
  choice: den Herrn auf die Probe stellt
  alternative: den Herrn versucht
  rationale: „Auf die Probe stellen“ gibt den wahrscheinlichen Sinn eines unangebrachten Erprobens oder Herausforderns Gottes verständlich wieder. Die mögliche Bedeutung „versuchen“ bleibt in der Fußnote sichtbar, sodass die lexikalische Spannung nicht verschwiegen wird.
- issue: Generischer Gebrauch von ἄνθρωπος
  choice: ein Mensch
  alternative: ein Mann
  rationale: Im Kontext einer allgemeinen Weisheitsmahnung ist ἄνθρωπος generisch. Das natürliche deutsche „Mensch“ bewahrt diese Allgemeingültigkeit, ohne eine nicht beabsichtigte Beschränkung auf Männer nahezulegen.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit direkter Anrede. „Werde nicht“ bewahrt bewusst die verbale Dynamik des griechischen γίνου; „auf die Probe stellen“ ist im Deutschen natürlicher und eindeutiger als das isolierte „prüfen“.
