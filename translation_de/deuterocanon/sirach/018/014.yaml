  yaml_path: translation/deuterocanon/sirach/018/014.yaml
  text: He has mercy on those who accept discipline[b][a], and on those who eagerly hasten to his judgments.
translation:
  language: de
  text: Er hat Erbarmen mit denen, die Zurechtweisung[a] annehmen, und mit denen, die seinen Urteilen[b] voller Eifer entgegeneilen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Unterweisung«. Das griechische Wort kann Unterweisung, Erziehung, Schulung oder korrigierende Zurechtweisung bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Entscheidungen« beziehungsweise »Ordnungen«. Das griechische Wort kann richterliche Urteile, Entscheidungen oder verbindliche Bestimmungen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλεᾷ
  choice: hat Erbarmen mit
  rationale: Die Wendung gibt das Erweisen von Barmherzigkeit oder Mitgefühl idiomatisch und mit dem angemessenen religiös-ethischen Gewicht wieder.
- source_word: τοὺς ἐκδεχομένους
  choice: mit denen, die … annehmen
  rationale: ἐκδέχομαι kann »erwarten«, »empfangen« oder »annehmen« bedeuten. In Verbindung mit παιδεία bezeichnet es hier am ehesten die bereitwillige Annahme von Unterweisung beziehungsweise Zurechtweisung.
- source_word: παιδείαν
  choice: Zurechtweisung
  rationale: παιδεία umfasst Unterweisung, Erziehung, Schulung und korrigierende Zucht. »Zurechtweisung« bewahrt im Weisheitskontext den korrigierenden und formenden Sinn, ohne eine körperliche Strafe nahezulegen.
- source_word: κατασπεύδοντας
  choice: mit Eifer entgegeneilen
  rationale: Das zusammengesetzte Verb drückt nachdrückliches, bereitwilliges Eilen aus. »Mit Eifer entgegeneilen« erhält sowohl die Bewegungsrichtung als auch die innere Bereitwilligkeit.
- source_word: ἐπὶ τὰ κρίματα αὐτοῦ
  choice: seinen Entscheidungen … entgegeneilen
  rationale: ἐπί mit Akkusativ bezeichnet nach einem Bewegungsverb die Richtung. κρίματα kann richterliche Entscheidungen, Urteile oder verbindliche Ordnungen meinen; »Entscheidungen« hält diese Spannweite vergleichsweise offen.
theological_decisions:
- issue: Bedeutung von παιδεία im Weisheitskontext
  choice: Zurechtweisung
  alternative: Unterweisung; Erziehung; Schulung
  rationale: Der Vers lobt die Bereitschaft, sich formen und korrigieren zu lassen. »Zurechtweisung« erhält diesen korrigierenden Akzent, während die Fußnote auf die breitere pädagogische Bedeutung hinweist.
- issue: Bedeutungsumfang von κρίματα αὐτοῦ
  choice: seine Entscheidungen
  alternative: seine Urteile; seine Ordnungen
  rationale: Das griechische Wort kann sowohl Gottes richterliche Entscheidungen als auch seine verbindlichen Bestimmungen bezeichnen. »Entscheidungen« vermeidet eine vorschnelle Verengung auf Strafurteile oder Gesetzesvorschriften.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Hat Erbarmen mit« ist allgemein verständlich und bewahrt den religiösen Klang; »mit Eifer entgegeneilen« bildet die nachdrückliche Bewegung des griechischen Verbs ab, ohne sie zu einer bloßen inneren Zustimmung umzudeuten.
