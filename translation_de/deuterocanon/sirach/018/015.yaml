  yaml_path: translation/deuterocanon/sirach/018/015.yaml
  text: My child[a], in good things do not add reproach, nor in any gift grief of words.
translation:
  language: de
  text: Mein Kind, füge bei Wohltaten keinen Vorwurf hinzu und bei jeder Gabe keine Worte, die Kummer bereiten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „und bei jeder Gabe keinen Kummer von Worten“. Der griechische Ausdruck ist verdichtet; gemeint sind Worte, die eine Gabe durch den Kummer, den sie verursachen, verderben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τέκνον
  choice: Mein Kind
  rationale: Die Anrede im Singular ist geschlechtsneutral und entspricht dem warmen, persönlichen Ton der Weisheitsunterweisung.
- source_word: ἐν ἀγαθοῖς
  choice: deine Wohltaten
  rationale: Der substantivierte Plural bezeichnet hier im Zusammenhang mit dem Geben gute, wohltätige Handlungen. „Wohltaten“ ist natürliches Deutsch, ohne den Ausdruck auf materielle Geschenke zu beschränken.
- source_word: μὴ δῷς μῶμον
  choice: verbinde … nicht mit Vorwürfen
  rationale: Wörtlich steht etwa „gib keinen Tadel“. Im Kontext ist gemeint, dass eine Wohltat nicht durch tadelnde oder vorwurfsvolle Begleitworte beeinträchtigt werden soll. Die gewählte Formulierung gibt diesen Zusammenhang idiomatisch wieder.
- source_word: ἐν πάσῃ δόσει
  choice: keine Gabe
  rationale: δόσις kann sowohl das Geben als auch die Gabe bezeichnen. „Keine Gabe“ wahrt hier die distributive Aussage von πάσῃ und bildet einen klaren Parallelismus zu „Wohltaten“.
- source_word: λύπην λόγων
  choice: Worte, die Kummer bereiten
  rationale: Die griechische Genitivverbindung ist stark verdichtet, wörtlich etwa „Kummer von Worten“. Die Wiedergabe macht verständlich, dass die begleitenden Worte den Empfänger betrüben.
