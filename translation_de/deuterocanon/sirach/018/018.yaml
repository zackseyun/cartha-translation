  yaml_path: translation/deuterocanon/sirach/018/018.yaml
  text: A foolish ingrate reproaches[a], and the gift of an envious man wears out the eyes.
translation:
  language: de
  text: Ein törichter Undankbarer macht Vorwürfe, und die Gabe eines Missgünstigen[a] zehrt die Augen aus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eines Menschen mit bösem Auge“ – gemeint ist ein missgünstiger oder geiziger Geber. Das griechische Wort βασκάνος kann Neid bezeichnen und zugleich an die Vorstellung vom „bösen Auge“ erinnern.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μωρὸς
  choice: törichter
  rationale: Das Adjektiv kennzeichnet den Undankbaren als unverständig und bewahrt den prägnanten Ton des Weisheitsspruchs.
- source_word: ἀχάριστος
  choice: Undankbarer
  rationale: Die substantivische Wiedergabe bezeichnet knapp und natürlich einen Menschen, dem Dankbarkeit fehlt.
- source_word: ὀνειδιεῖ
  choice: macht Vorwürfe
  rationale: Die Formulierung gibt das Beschimpfen oder Vorhalten von Schmach in verständlichem modernem Deutsch wieder, ohne den Sinn auf bloße Beleidigung zu verengen.
- source_word: δόσις
  choice: Gabe
  rationale: Im Zusammenhang ist wahrscheinlich das Gegebene gemeint; „Gabe“ erhält zugleich den Bezug zum Vorgang des Gebens.
- source_word: βασκάνου
  choice: eines Missgünstigen
  rationale: Das Wort bezeichnet einen neidischen oder missgünstigen Menschen und kann zugleich die Vorstellung des „bösen Auges“ anklingen lassen; diese Bedeutungsbreite wird in der Fußnote offengehalten.
- source_word: ἐκτήκει
  choice: lässt … verschmachten
  rationale: Die Wendung bewahrt das starke Bild eines allmählichen Vergehens oder Aufgezehrtwerdens und klingt mit „Augen“ im Deutschen natürlich.
- source_word: ὀφθαλμούς
  choice: die Augen
  rationale: Die konkrete Bildsprache des griechischen Textes bleibt erhalten, statt sie deutend als Sehkraft oder seelische Belastung wiederzugeben.
