  text: Die in Worten Verständigen wurden selbst weise und ließen präzise Sprüche herabregnen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνετοὶ ἐν λόγοις
  choice: die Verständigen in ihren Worten
  rationale: Gibt die Verbindung von Einsicht beziehungsweise Verstand und sprachlicher Äußerung eng am Griechischen wieder, ohne sie auf bloße Beredsamkeit zu verengen.
- source_word: ἐσοφίσαντο
  choice: wurden weise
  rationale: Bewahrt die im Aorist ausgedrückte Entwicklung oder Erlangung von Weisheit, statt lediglich einen schon bestehenden Zustand zu benennen.
- source_word: ἀνώμβρησαν
  choice: ließen … herabregnen
  rationale: Erhält das ungewöhnliche und kraftvolle Regenbild des griechischen Verbs; eine bloße Wiedergabe mit „äußerten“ oder „sprachen“ würde dieses Bild einebnen.
- source_word: παροιμίας ἀκριβεῖς
  choice: treffende Sprüche
  rationale: „Sprüche“ entspricht dem Weisheitskontext von παροιμίαι; „treffend“ vermittelt die Genauigkeit und Sorgfalt von ἀκριβεῖς in natürlichem Deutsch.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Parallelität der beiden Satzhälften und das markante Regenbild des Ausgangstextes bleiben erhalten; „in ihren Worten“ bewahrt die knappe, leicht offene Formulierung des Griechischen.
