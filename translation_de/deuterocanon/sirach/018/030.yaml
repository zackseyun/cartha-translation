  yaml_path: translation/deuterocanon/sirach/018/030.yaml
  text: Do not go after your desires, and restrain yourself from your cravings;
translation:
  language: de
  text: Lauf deinen Begierden nicht nach, und halte dich von deinen Gelüsten fern.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Folge deinen Wünschen nicht und zügle deine Triebe.“'
    reason: Lexikalische Alternative für ἐπιθυμίαι, ὀρέξεις und κωλύου.
lexical_decisions:
- source_word: Ὀπίσω ... μὴ πορεύου
  choice: Lauf ... nicht nach
  rationale: Die Verbindung bezeichnet das Nachgehen oder Folgen. „Nicht nachlaufen“ bewahrt das Bewegungsbild und klingt im Deutschen als Warnung natürlich.
- source_word: τῶν ἐπιθυμιῶν σου
  choice: deinen Begierden
  rationale: ἐπιθυμία bezeichnet Verlangen oder Begehren und erhält hier durch die Mahnung eine negative Färbung. „Begierden“ bewahrt die moralische Spannung, ohne den Sinn auf Sexualität zu verengen.
- source_word: ἀπὸ τῶν ὀρέξεών σου
  choice: von deinen Gelüsten
  rationale: ὄρεξις bezeichnet ein starkes Verlangen, einen Drang oder Appetit. „Gelüste“ unterscheidet den Ausdruck von ἐπιθυμίαι und lässt seine mögliche körperliche, aber nicht ausschließlich sexuelle Dimension offen.
- source_word: κωλύου
  choice: halte dich ... zurück
  rationale: Der Imperativ hat hier reflexiven Sinn und fordert Selbstbeschränkung. „Halte dich ... zurück“ gibt dies klar und idiomatisch wieder.
theological_decisions:
- issue: Moralische Nuance der Begriffe für Verlangen
  choice: „Begierden“ und „Gelüste“ als allgemein moralisch problematisierte, aber nicht ausschließlich sexuelle Wünsche
  alternative: „Wünsche“ und „Triebe“ oder „Lüste“ und „Begierden“
  rationale: Der griechische Text warnt davor, sich von starkem Verlangen leiten zu lassen, legt dessen Gegenstand aber nicht fest. Die Übersetzung wahrt die ethische Schärfe, ohne den Anwendungsbereich konfessionell oder sachlich zu verengen.
translation_notes:
  register: Moderne, würdige Mahnrede in direkter Anrede. Das Bild des Hinterherlaufens bleibt erhalten; die beiden griechischen Ausdrücke für Verlangen werden im Deutschen unterscheidbar wiedergegeben.
