  text: Der Herr allein wird als gerecht erwiesen werden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Der Herr allein wird für gerecht erklärt werden“, „… wird gerechtfertigt werden“ oder „… wird als gerecht bestätigt werden“. Das griechische Verb kann eine deklarative oder vindikatorische Bedeutung haben.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: Κύριος
  choice: der Herr
  rationale: Κύριος ist das Subjekt und die übliche Gottesbezeichnung „Herr“. Der bestimmte Artikel ist im Deutschen idiomatisch erforderlich.
- source_word: μόνος
  choice: allein
  rationale: μόνος betont die Ausschließlichkeit; „allein“ bewahrt diese Hervorhebung knapp und natürlich.
- source_word: δικαιωθήσεται
  choice: wird als gerecht erwiesen werden
  rationale: Das Futur Passiv von δικαιόω kann deklarative oder vindikatorische Kraft haben. „Als gerecht erwiesen werden“ wahrt das Passiv sowie den Bezug auf Gerechtigkeit und vermeidet zugleich die im heutigen Deutsch stark fachtheologisch geprägte Formulierung „gerechtfertigt werden“.
theological_decisions:
- issue: Wiedergabe von δικαιωθήσεται im weisheitlichen Kontext
  choice: wird als gerecht erwiesen werden
  alternative: wird für gerecht erklärt werden; wird gerechtfertigt werden; wird als gerecht bestätigt werden
  rationale: Die knappe Aussage kann auf Erklärung, Anerkennung oder Bestätigung der Gerechtigkeit des Herrn zielen. Die gewählte Fassung lässt diese Spannung weitgehend offen, ohne den Ausdruck auf eine spätere dogmatische Fachbedeutung festzulegen.
- issue: Unsicherheit aufgrund des Validierungshinweises „major_mismatch“
  choice: Den überlieferten griechischen Wortlaut ohne Ergänzung übersetzen
  alternative: Eine längere Aussage aus anderen Textzeugen rekonstruieren
  rationale: Der bereitgestellte griechische Text ist in sich knapp und verständlich. Da kein abweichender Originaltext als Grundlage vorliegt, wird nichts ergänzt; die mögliche textgeschichtliche Unsicherheit wird in der Fußnote transparent gemacht.
translation_notes:
  register: Knapp, würdevoll und in modernem Standarddeutsch. Die Formulierung bleibt nahe an der griechischen Satzstruktur, klingt aber natürlicher als eine rein formale Wiedergabe mit „gerechtfertigt“.
