  text: Before you speak[a], learn; and before sickness, seek treatment.
translation:
  language: de
  text: Bevor du sprichst, lerne; und bevor du krank wirst, sorge vor.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »kümmere dich um dich selbst«; auch: »nimm Heilmittel«. Das griechische Verb kann bedeuten, sich um jemanden zu kümmern, ihn zu pflegen oder medizinisch zu behandeln.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὶν ἢ λαλῆσαι
  choice: Bevor du sprichst
  rationale: Die temporale Verbindung mit dem Aoristinfinitiv wird im modernen Deutschen natürlich als Nebensatz wiedergegeben.
- source_word: μάνθανε
  choice: lerne
  rationale: Der Imperativ bezeichnet das Aneignen von Wissen oder Einsicht und bewahrt so die knappe Weisheitsmahnung.
- source_word: πρὸ ἀρρωστίας
  choice: bevor du krank wirst
  rationale: Die wörtliche Wendung »vor Krankheit« wird idiomatisch als zeitlicher Nebensatz wiedergegeben; ἀρρωστία bezeichnet Krankheit beziehungsweise körperliche Schwäche.
- source_word: θεραπεύου
  choice: sorge vor
  rationale: Der mediale Imperativ kann hier bedeuten, sich um die eigene Gesundheit zu kümmern oder rechtzeitig Heilmittel beziehungsweise Behandlung in Anspruch zu nehmen. Da dies ausdrücklich vor der Krankheit geschehen soll, bringt »sorge vor« den präventiven Sinn natürlich zum Ausdruck, ohne ihn im Haupttext medizinisch zu verengen.
