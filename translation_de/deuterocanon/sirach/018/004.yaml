  text: Und wer wird seine großen Taten ergründen?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τίς
  choice: wer
  rationale: Das interrogative Pronomen leitet eine rhetorische Frage ein; „wer“ ist im Deutschen unmittelbar und bewahrt ihre Offenheit.
- source_word: ἐξιχνιάσει
  choice: wird … ergründen
  rationale: Die Futurform wird mit „wird“ wiedergegeben. „Ergründen“ vermittelt das gründliche Nachforschen beziehungsweise vollständige Erfassen, ohne die im Griechischen nur nahegelegte Unmöglichkeit ausdrücklich als „kann nicht“ auszudeuten.
- source_word: τὰ μεγαλεῖα
  choice: seine großen Taten
  rationale: Der substantivierte Plural bezeichnet große, machtvolle Taten oder Manifestationen von Größe. „Große Taten“ ist natürliches, würdiges Deutsch und bleibt näher an der lexikalischen Weite als das stärker deutende „Machttaten“.
- source_word: αὐτοῦ
  choice: seine
  rationale: Das Possessivpronomen bezieht sich im Kontext auf Gott; die deutsche Form stimmt mit dem Plural „Taten“ überein.
theological_decisions:
- issue: Bezugswort von αὐτοῦ
  choice: „seine“ bezieht sich auf Gott
  alternative: das Pronomen ohne kontextuelle Bestimmung verstehen
  rationale: Der Zusammenhang von Sirach 18 nennt den Herrn als Bezugspunkt. Die Übersetzung lässt ihn wie der griechische Text pronominal und fügt den Gottesnamen nicht erläuternd ein.
- issue: Rhetorische Aussage über die Erforschbarkeit von Gottes Taten
  choice: Futurfrage „wer wird … ergründen?“
  alternative: 'modal und stärker ausdeutend: „wer kann … ergründen?“'
  rationale: Die griechische Futurform wird formal bewahrt; die rhetorisch implizierte menschliche Begrenztheit wird nicht durch ein zusätzliches Modalverb ausdrücklich festgelegt.
translation_notes:
  register: Modernes, allgemein verständliches und zugleich würdevolles Standarddeutsch. Die knappe rhetorische Satzform des Griechischen bleibt erhalten.
