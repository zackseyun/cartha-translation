  text: If you grant your soul the pleasure it desires[a], it will make you a joy to your enemies.
translation:
  language: de
  text: Wenn du deiner Seele die Befriedigung ihres Verlangens gewährst[a], wird sie dich zur Freude deiner Feinde machen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wenn du dem Begehren deiner Seele nachgibst, wirst du zu etwas, worüber deine Feinde sich freuen.“'
    reason: Die Verbindung εὐδοκίαν ἐπιθυμίας und die feindselige Färbung von ἐπίχαρμα lassen auch diese stärker sinngemäße Wiedergabe zu.
lexical_decisions:
- source_word: ἐὰν
  choice: Wenn
  rationale: Leitet die Bedingung des weisheitlichen Warnspruchs schlicht und natürlich ein.
- source_word: χορηγήσεις
  choice: du … gewährst
  rationale: Gibt das Bereitstellen oder Gewähren wieder und lässt den im Zusammenhang mitschwingenden Gedanken der Nachgiebigkeit erkennen, ohne ihn in den Haupttext hineinzudeuten.
- source_word: τῇ ψυχῇ σου
  choice: deiner Seele
  rationale: Bewahrt die ausdrückliche Nennung der ψυχή als inneres Selbst; gemeint ist hier keine technische Seelenlehre.
- source_word: εὐδοκίαν ἐπιθυμίας
  choice: die Befriedigung ihres Verlangens
  rationale: Die schwierige Genitivverbindung bezeichnet wahrscheinlich das Wohlgefallen beziehungsweise die Befriedigung, die mit dem Begehren verbunden ist. Die Wiedergabe ist im Deutschen verständlich, ohne ἐπιθυμία auf sexuelles Verlangen einzuengen.
- source_word: ποιήσει σε
  choice: wird sie dich … machen
  rationale: Bewahrt den futurischen, kausativen Sinn. Das feminine Pronomen nimmt im Deutschen natürlich auf „Seele“ Bezug.
- source_word: ἐπίχαρμα
  choice: zum Anlass zur Freude
  rationale: Bezeichnet etwas, worüber andere sich freuen. Die Formulierung wahrt das Bild und vermeidet die stärkere Deutung „Gespött“.
- source_word: τῶν ἐχθρῶν σου
  choice: deinen Feinden
  rationale: Mit „zum Anlass zur Freude machen“ lässt sich der griechische Genitiv im Deutschen idiomatisch als betroffene Personengruppe ausdrücken.
theological_decisions:
- issue: Anthropologische Aussage von ψυχή
  choice: „Seele“ im Haupttext beibehalten
  alternative: „dir selbst“ oder „deiner Begierde“
  rationale: Der Vers behandelt Selbstbeherrschung, nicht eine ausgearbeitete Anthropologie. Dennoch soll die ausdrückliche Rede von der ψυχή sichtbar bleiben.
- issue: Feindselige Nuance von ἐπίχαρμα τῶν ἐχθρῶν σου
  choice: „deinen Feinden zum Anlass zur Freude“
  alternative: „zum Gespött deiner Feinde“ oder „zu etwas, worüber deine Feinde schadenfroh jubeln“
  rationale: Der griechische Ausdruck sagt, dass die Feinde sich über die betreffende Person freuen, lässt aber offen, ob Spott, Schadenfreude oder Triumph im Vordergrund steht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt nahe am griechischen Warnspruch; die Fußnote verdeutlicht die mögliche Bedeutung von Selbstverwöhnung und Schadenfreude, ohne sie im Haupttext festzuschreiben.
