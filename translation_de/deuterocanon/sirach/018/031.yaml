  source_fidelity: Der Bedingungssatz gibt ἐὰν χορηγήσεις τῇ ψυχῇ σου εὐδοκίαν ἐπιθυμίας insgesamt zuverlässig wieder. „Seele“ bewahrt ψυχή, ohne eine technische anthropologische Aussage zu erzwingen; „Befriedigung ihres Verlangens“ gibt die komplexe Verbindung εὐδοκίαν ἐπιθυμίας verständlich und ohne unzulässige sexuelle Einengung wieder. Die Folge mit ἐπίχαρμα τῶν ἐχθρῶν σου meint, dass die Feinde über die Person Freude empfinden bzw. triumphieren; die revidierte Formulierung wahrt diese Bildlichkeit ohne sie zu „Gespött“ zu verschärfen.
  naturalness: „Jemanden seinen Feinden zum Anlass zur Freude machen“ ist verständlich, klingt im modernen Standarddeutsch jedoch unnötig schwerfällig. Die feste und idiomatische Wendung „zur Freude deiner Feinde“ ist flüssiger und gibt die genitivische Zuordnung im Griechischen angemessen wieder.
  terminology: Die Begriffe „Seele“, „Verlangen“ und „Feinde“ sind passend. „Zur Freude deiner Feinde“ entspricht dem nüchternen Bild von ἐπίχαρμα und lässt die konkrete Art der feindlichen Freude offen.
