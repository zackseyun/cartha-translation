translation:
  language: de
  text: Freu dich nicht über ein bisschen Vergnügen[a], denn sein Ende ist Armut.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Freu dich nicht einmal über ein wenig Vergnügen.« Das hebräische Wort שֶׁמֶץ kann ein kleines Stück, eine Spur oder eine geringe Menge bezeichnen. Der griechische Paralleltext hat dagegen »viel Luxus«.'
    reason: lexical_alternative
  - marker: b
    text: 'Der hebräische Schlusssatz ist unsicher. Wörtlich enthält er etwa die Wörter »Mund/Anteil«, »zwei« und »seine Armut«; ihre Verbindung ist nicht sicher erklärbar. »Sein Ende ist Armut« gibt den vermuteten Sinn wieder. Der griechische Paralleltext lautet: »Freu dich nicht über viel Luxus und binde dich nicht an seinen Aufwand.« Er bestätigt die Warnung vor kostspieligem Genuss, jedoch nicht den genauen hebräischen Wortlaut.'
    reason: textual_variant
lexical_decisions:
- source_word: אַל תִּשְׂמַח
  choice: Freu dich nicht
  rationale: שמח bezeichnet hier, an etwas Freude zu haben; die natürliche deutsche Verbform bewahrt den direkten Mahnton.
- source_word: שֶׁמֶץ
  choice: ein bisschen
  rationale: שֶׁמֶץ bezeichnet ein kleines Stück, eine Spur oder geringe Menge. »Ein bisschen« gibt diese Kleinheit in verständlichem Gegenwartsdeutsch wieder, ohne die Stelle unnötig zuzuspitzen.
- source_word: תַּעֲנוּג
  choice: Vergnügen
  rationale: Das Substantiv bezeichnet Genuss oder sinnliches Vergnügen. »Vergnügen« ist breit genug und folgt stärker dem Hebräischen als das vom griechischen Paralleltext nahegelegte »Luxus«.
- source_word: אֲשֶׁר
  choice: denn
  rationale: Die Relativpartikel leitet im Zusammenhang die Begründung der Warnung ein; »denn« ist dafür im Deutschen idiomatisch.
- source_word: פִּי
  choice: Ende
  rationale: Wörtlich meist »Mund«, kann פִּי auch Rand oder äußerstes Ende bezeichnen. In der schwer verständlichen Schlussklausel ist »Ende« eine kontextuelle Deutung und wird deshalb durch eine Fußnote kenntlich gemacht.
- source_word: שְׂנַיִם
  choice: nicht eigenständig wiedergegeben
  rationale: Das überlieferte »zwei/zweifach« lässt sich in der Klausel syntaktisch nicht sicher erklären. Eine ausdrückliche Wiedergabe würde eine spekulative Rekonstruktion vortäuschen; die Unsicherheit wird in der Fußnote offengelegt.
- source_word: רֵישׁוֹ
  choice: Armut
  rationale: רֵישׁ bedeutet Armut oder Mangel und bildet den klarsten lexikalischen Anhaltspunkt der schwierigen Schlussklausel.
