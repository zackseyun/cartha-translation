translation_notes:
  register: Direkter, knapper Weisheitsspruch in modernem Standarddeutsch. »Vergnügen« hält den sinnlichen beziehungsweise genussbezogenen Sinn offen; die schwierige Textüberlieferung wird nicht im Haupttext ausgebreitet, sondern transparent in den Fußnoten dokumentiert.
