translation:
  language: de
  text: Ist nicht ein Wort mehr wert als eine gute Gabe? Beides findet sich bei einem gütigen Mann.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Beides gehört zu einem wohlwollenden Mann.“ Das griechische Wort kann auch „wohlwollend“ oder „mit Gunst bedacht“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἰδοὺ
  choice: Ist nicht
  rationale: Die Verbindung leitet idiomatisch eine rhetorische Frage ein. „Ist nicht“ gibt ihre Funktion in natürlichem modernem Deutsch wieder, ohne das hier schwerfällige „Siehe“ nachzuahmen.
- source_word: λόγος
  choice: ein Wort
  rationale: Gemeint ist hier das gesprochene Wort im Gegensatz zur materiellen Gabe. „Ein Wort“ bewahrt die knappe, sprichwortartige Formulierung.
- source_word: ὑπὲρ
  choice: mehr wert als
  rationale: ὑπέρ bezeichnet in dieser vergleichenden Wendung eine Überlegenheit. „Mehr wert als“ drückt die wertende Aussage idiomatisch aus, ohne zu behaupten, das Wort sei in jeder Hinsicht schlechthin besser.
- source_word: δόμα ἀγαθόν
  choice: eine gute Gabe
  rationale: δόμα bezeichnet eine Gabe oder ein Geschenk, ἀγαθόν charakterisiert sie als gut. „Gabe“ passt zum würdevollen Weisheitsstil und wahrt den Gegensatz zum gesprochenen Wort.
- source_word: ἀμφότερα
  choice: Beides
  rationale: Das Wort verweist gemeinsam auf das zuvor genannte Wort und die Gabe.
- source_word: παρὰ ἀνδρὶ
  choice: findet sich bei einem Menschen
  rationale: παρά mit dem Dativ kann ausdrücken, dass etwas bei einer Person vorhanden oder für sie kennzeichnend ist. „Findet sich bei“ ist im Deutschen natürlicher als das wörtliche „ist bei“.
- source_word: κεχαριτωμένῳ
  choice: gütigen
  rationale: Das Partizip bezeichnet hier einen von Gunst, Wohlwollen oder gewinnender Güte geprägten Menschen. „Gütig“ verbindet im Kontext freundliches Reden und freigebiges Handeln, ohne eine spezielle theologische Bedeutung festzulegen.
theological_decisions:
- issue: Generisches Maskulinum in der Weisheitsrede
  choice: Mensch
  alternative: Mann
  rationale: Obwohl ἀνδρί morphologisch maskulin ist, bezeichnet der Spruch allgemein eine Person mit dieser Haltung. „Mensch“ gibt den allgemeinen Geltungsbereich im heutigen Deutsch natürlich wieder; die grammatische Form ist für die Aussage theologisch nicht bestimmend.
- issue: Bedeutung von κεχαριτωμένῳ
  choice: gütig
  alternative: begnadet / mit Gunst bedacht
  rationale: Im unmittelbaren Parallelismus geht es um hilfreiches Reden und Geben. „Gütig“ wahrt diesen ethischen Zusammenhang, während „begnadet“ leicht eine spezifische heilsgeschichtliche oder dogmatische Aussage nahelegen könnte.
translation_notes:
  register: Knappe, würdige und sprichwortartige Form. „Mehr wert als“ ist modernes Standarddeutsch und bildet den Vergleich natürlich ab. Die zweite Satzhälfte bleibt bewusst allgemein und wahrt die Bedeutungsbreite von παρά und κεχαριτωμένῳ.
