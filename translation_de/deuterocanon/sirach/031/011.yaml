  text: Who was tested by it and was found complete? Let it be for him a boast[a]. Who was able to transgress and did not transgress[b], and to do evil and did not desire it?
translation:
  language: de
  text: Wer wurde dadurch geprüft und erwies sich in seinem Leben als untadelig? Das gereicht ihm zum Ruhm.[a] Wer konnte abweichen und wich nicht ab, Böses tun und wollte es nicht?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die erste Zeile ist im Hebräischen textlich schwierig. Der überlieferte Wortlaut kann wörtlicher auch etwa heißen: „Wer segnete ihn, sodass er in seinem Leben vollkommen war?“ Der Zusammenhang und die Parallelüberlieferung stützen jedoch den Sinn einer Prüfung, in der sich jemand als untadelig erweist.'
    reason: textual_variant
  - marker: b
    text: 'Oder: „Wer konnte sich abwenden und wandte sich nicht ab, Schaden anrichten und stimmte dem nicht zu?“'
    reason: lexical_alternative
lexical_decisions:
- source_word: מי ברכו
  choice: Wer wurde dadurch geprüft
  rationale: Der überlieferte hebräische Wortlaut ist schwierig. Im Zusammenhang der Prüfung durch Reichtum gibt die Wiedergabe den wahrscheinlich gemeinten Sinn wieder, ohne die Textunsicherheit zu verschweigen.
- source_word: וישלם בחייו
  choice: und erwies sich in seinem Leben als untadelig
  rationale: שלם bezeichnet hier sittliche Unversehrtheit oder Bewährung. „Erwies sich … als untadelig“ klingt im Deutschen natürlich und bewahrt den Gedanken geprüfter Integrität.
- source_word: הוא לך לתפארת
  choice: Das gereicht ihm zum Ruhm
  rationale: Die Pronomen des überlieferten Textes sind unsicher. Die Formulierung hält an der rühmenden Aussage fest, ohne den instabilen Wortlaut unnötig festzulegen.
- source_word: מי יוכל לסור ולא סר
  choice: Wer konnte abweichen und wich nicht ab
  rationale: Die wörtliche Bewegungsmetapher von סור bleibt erhalten und trägt im Kontext zugleich die ethische Bedeutung des Abweichens vom rechten Weg.
- source_word: ולהרע רעה
  choice: Böses tun
  rationale: Die Verbindung aus Verb und stammverwandtem Objekt bezeichnet das Vollbringen von Bösem; die knappe deutsche Wendung gibt dies idiomatisch wieder.
- source_word: ולא אבה
  choice: und wollte es nicht
  rationale: אבה bezeichnet Willigkeit oder Zustimmung. „Wollte es nicht“ bewahrt den inneren Verzicht, ohne stärker psychologisierend „begehrte“ zu sagen.
theological_decisions:
- issue: Textlich schwierige erste Zeile bei abweichender Parallelüberlieferung
  choice: Die Aussage als Prüfung und erwiesene Untadeligkeit wiedergeben
  alternative: 'Wörtlicher nach dem überlieferten Hebräisch: „Wer segnete ihn, sodass er in seinem Leben vollkommen war?“'
  rationale: Das Hebräische bleibt die Hauptgrundlage, doch Wortlaut, Kontext und Parallelüberlieferung sprechen für eine Aussage über sittliche Bewährung. Die Fußnote erhält die echte textliche Unsicherheit.
- issue: Ethische Bedeutung von סור
  choice: „abweichen“ mit der Wegmetapher
  alternative: „sündigen“ oder „eine Übertretung begehen“
  rationale: „Abweichen“ bewahrt die Bildlichkeit und lässt den moralischen Bezug im Zusammenhang deutlich werden, ohne ihn konfessionell oder dogmatisch zu verengen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorischen Fragen und der Parallelismus bleiben erhalten. „Untadelig“ trägt den sittlichen Sinn von שלם, während „abweichen“ die hebräische Wegmetapher bewahrt. Die textkritische Unsicherheit der ersten Zeile wird nicht im Haupttext überladen, sondern offen in der Fußnote ausgewiesen.
