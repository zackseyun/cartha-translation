  text: The sleeplessness of a rich man wastes away his flesh[a], and anxiety about livelihood drives away sleep.
translation:
  language: de
  text: Die Schlaflosigkeit eines Reichen lässt sein Fleisch schwinden[a], und die Sorge um den Lebensunterhalt vertreibt den Schlaf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hebräische Wortlaut des ersten Satzteils ist schwer verständlich. Die griechische Parallelüberlieferung lautet: „Leere und trügerische Hoffnungen sind für einen unverständigen Menschen, und Träume verleihen Toren Flügel.“ Der Haupttext folgt dem erhaltenen hebräischen Zeugen; die Textüberlieferung ist an dieser Stelle jedoch unsicher.'
    reason: textual_variant
lexical_decisions:
- source_word: שקר עשיר
  choice: die Schlaflosigkeit eines Reichen
  rationale: Der überlieferte hebräische Ausdruck ist schwierig. Im Zusammenhang mit dem ausdrücklich vertriebenen Schlaf im zweiten Halbvers wird er als Schlaflosigkeit des Reichen verstanden; die unbestimmte Einzahl bezeichnet einen typischen Einzelfall.
- source_word: ימחה שארו
  choice: lässt sein Fleisch schwinden
  rationale: שארו wird körperlich als „sein Fleisch“ verstanden. Die Wiedergabe beschreibt einen allmählichen körperlichen Verfall und bleibt dem Bild des hebräischen Textes nahe.
- source_word: דאגת
  choice: die Sorge
  rationale: דאגה bezeichnet bedrückende, ängstliche Sorge. „Sorge“ ist im Deutschen natürlich und vermeidet eine unnötig klinische Färbung.
- source_word: מחיה
  choice: um den Lebensunterhalt
  rationale: מחיה bezeichnet das, wovon ein Mensch materiell lebt. „Lebensunterhalt“ gibt diesen weiten Sinn klar und idiomatisch wieder.
- source_word: תפריע נומה
  choice: vertreibt den Schlaf
  rationale: Das Verb bezeichnet hier Störung beziehungsweise Verdrängung; zusammen mit נומה ergibt „vertreibt den Schlaf“ eine klare und anschauliche deutsche Formulierung.
