  text: Is not a little enough for an intelligent man? And on his bed he does not gasp[a][b].
translation:
  language: de
  text: Genügt einem verständigen Menschen nicht schon wenig? Und auf seinem Lager keucht er nicht.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort für „keucht“ ist hier unsicher; der erhaltene Text ist schwierig. Im Zusammenhang ist wohl gemeint, dass maßvolles Essen den Menschen auf seinem Lager nicht körperlich bedrängt.
    reason: textual_variant
  - marker: b
    text: Der in den Quelldaten zu diesem Vers angeführte griechische Paralleltext stimmt nicht mit der hebräischen Zeile überein und gehört offenbar zu einem anderen Vers. Die Übersetzung folgt daher dem Hebräischen als Hauptzeugen.
    reason: textual_variant
lexical_decisions:
- source_word: הלא
  choice: nicht …?
  rationale: Leitet eine rhetorische Frage ein, die Zustimmung erwartet; die deutsche Stellung mit „nicht“ bewahrt diese Kraft natürlich.
- source_word: די
  choice: genügt
  rationale: Bezeichnet das Ausreichen oder Genügen. Das Verb ergibt zusammen mit „wenig“ einen natürlichen deutschen Satz.
- source_word: אנוש
  choice: einem … Menschen
  rationale: Bezeichnet einen Menschen beziehungsweise Sterblichen; „Mensch“ wahrt die allgemeine, sprichwortartige Aussage.
- source_word: נבון
  choice: verständigen
  rationale: Bezeichnet einen einsichtigen, urteilsfähigen Menschen. „Verständig“ passt besonders zur praktischen Besonnenheit beim Essen.
- source_word: מזער
  choice: schon wenig
  rationale: Bezeichnet eine geringe Menge. „Schon“ verdeutlicht idiomatisch die rhetorische Aussage, ohne den Sinn zu erweitern.
- source_word: יצועיו
  choice: seinem Lager
  rationale: Bezeichnet Bett, Liegestatt oder Lager. „Lager“ ist würdig und lässt sowohl Bett als auch Ruheplatz zu.
- source_word: לא ישיק
  choice: keucht er nicht
  rationale: Die Form und genaue Bedeutung sind schwierig. „Keuchen“ gibt die wahrscheinlich gemeinte körperliche Bedrängnis nach übermäßigem Essen wieder, ohne Erbrechen oder Ersticken festzulegen.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit knapper, sprichwortartiger Form. „Lager“ hält einen leicht würdevollen biblischen Ton, während „keucht“ die schwierige körperliche Aussage anschaulich, aber nicht überdeutlich wiedergibt.
