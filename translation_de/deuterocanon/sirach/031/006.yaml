base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/031/006.yaml
  text: Many have been ruined by gold[a], and by trusting in pearls; they did not find escape from evil[b], nor deliverance on the day of wrath.
translation:
  language: de
  text: Viele sind durch Gold zugrunde gegangen, ebenso mancher, der auf Perlen[a] vertraut. Sie fanden keinen Weg, dem Unheil zu entkommen, und auch keine Rettung am Tag des Zorns.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort kann „Perlen“, aber auch allgemeiner kostbare Steine oder Schmuck bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: חבולי
  choice: zugrunde gerichtet worden
  rationale: Das Wort bezeichnet hier Menschen, die durch Gold geschädigt oder ins Verderben gebracht wurden. Die deutsche Wendung gibt die schwerwiegende Folge natürlich wieder, ohne sie auf körperliche Verwundung zu beschränken.
- source_word: זהב
  choice: Gold
  rationale: Direkte Wiedergabe; Gold steht im Zusammenhang zugleich für materiellen Reichtum.
- source_word: והבוטח
  choice: ebenso, wer ... vertraut
  rationale: Bewahrt den auffälligen Wechsel von der Mehrzahl zur singularischen Partizipialform, statt ihn stillschweigend in eine rein kausale Konstruktion umzudeuten.
- source_word: פנינים
  choice: Perlen
  rationale: Eine geläufige und vertretbare Bedeutung; da das Wort auch kostbare Steine oder Schmuck im weiteren Sinn bezeichnen kann, wird die Unschärfe in einer Fußnote erhalten.
- source_word: להנצל מרעה
  choice: kein Entkommen vor dem Unheil
  rationale: מרעה kann moralisches Böses, Schaden oder Unheil bezeichnen. Im Zusammenhang mit ausbleibender Rettung ist „Unheil“ natürlich und lässt den konkreten Charakter der Gefahr erkennen.
- source_word: להושע
  choice: keine Rettung
  rationale: Gibt die Bedeutung von Befreiung beziehungsweise Gerettetwerden klar wieder, ohne unnötig eine spätere dogmatische Fachbedeutung einzutragen.
- source_word: ביום עברה
  choice: am Tag des Zorns
  rationale: Die feste, gewichtige Wendung bewahrt den Gerichtsklang des hebräischen Ausdrucks.
theological_decisions:
- issue: Wahl der Hauptlesart bei erheblicher Abweichung zwischen Hebräisch und Griechisch
  choice: Der erhaltene hebräische Text bildet den Haupttext; die griechische Lesart wird in einer Fußnote dokumentiert.
  alternative: 'Nach dem Griechischen: „Wenn es nicht vom Höchsten zur Heimsuchung gesandt wird, hänge dein Herz nicht daran.“'
  rationale: Für Jesus Sirach hat der vorhandene hebräische Text Vorrang. Da der griechische Zeuge hier grundlegend abweicht, darf die Differenz jedoch nicht harmonisiert oder verschwiegen werden.
- issue: Bezug des singularischen והבוטח
  choice: Die grammatische Spannung bleibt mit „ebenso, wer“ sichtbar.
  alternative: 'Glättend-kausal: „und durch das Vertrauen auf Perlen“'
  rationale: Der hebräische Wechsel von „Viele“ zu „wer vertraut“ ist echt und möglicherweise textlich oder stilistisch bedingt. Die Übersetzung löst ihn nicht stillschweigend auf.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Bildsprache von Gold, kostbaren Perlen und dem Tag des Zorns bleibt erhalten. Der Numeruswechsel des Hebräischen wird bewusst nicht vollständig geglättet.
