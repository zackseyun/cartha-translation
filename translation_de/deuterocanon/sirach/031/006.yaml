  source_fidelity: 'Der Haupttext folgt zutreffend dem erhaltenen hebräischen Text: Gold und kostbare Gegenstände werden als Ursache des Verderbens genannt; ein Entkommen aus dem Unheil und Rettung am Tag des Zorns bleiben aus. Die griechische, stark abweichende Lesart wird korrekt als Variante ausgewiesen. Die Formulierung des Numeruswechsels sollte jedoch im Deutschen syntaktisch geschlossen und mit dem folgenden Plural besser verbunden werden.'
  naturalness: „Viele sind durch Gold zugrunde gerichtet worden; ebenso, wer auf Perlen vertraut“ bleibt im Deutschen nach dem Semikolon elliptisch und wirkt unvollständig. „Ebenso mancher, der auf Perlen vertraut“ ergänzt das im Hebräischen nur implizite Prädikat auf natürliche Weise, ohne den singularischen Bezug zu nivellieren. „Sie fanden keinen Weg, dem Unheil zu entkommen“ ist idiomatischer als „kein Entkommen vor dem Unheil“.
  terminology: „Gold“, „Perlen“, „Unheil“, „Rettung“ und „Tag des Zorns“ sind angemessen. Die Fußnote zu פנינים wahrt die lexikalische Unsicherheit. Die Variantenote soll den griechischen Imperativ und dessen Pluralbezug genauer wiedergeben, ohne einen ungesicherten Bezug zu bestimmen.
  issues:
  - severity: medium
    issue: Unvollständige bzw. holprige Satzfügung bei „ebenso, wer auf Perlen vertraut“
    rationale: Die deutsche Fassung benötigt ein mitgedachtes Prädikat; die bestehende Ellipse ist nach dem Semikolon nicht ausreichend glatt und der anschließende Plural „Sie“ hat keinen klaren syntaktischen Bezug.
  - severity: low
    issue: „kein Entkommen vor dem Unheil“ ist weniger idiomatisch
    rationale: Das hebräische להנצל מרעה bezeichnet Entkommen bzw. Gerettetwerden aus/von Unheil. Eine Formulierung mit „dem Unheil zu entkommen“ ist im modernen Standarddeutsch natürlicher.
  - severity: low
    issue: Griechische Variantenote gibt den Pluralbezug nur ungenau wieder
    rationale: Der griechische Text hat „gib ihnen nicht dein Herz“ (εἰς αὐτά), nicht den Singular „daran“. Der konkrete Bezug von αὐτά bleibt im isolierten Vers unsicher und sollte nicht spezifiziert werden.
