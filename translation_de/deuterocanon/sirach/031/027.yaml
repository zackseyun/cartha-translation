translation:
  language: de
  text: '[Und wenn sie dich zum Essen drängen[a], zieh dich von der Tischrunde zurück,] dann wirst du Ruhe finden.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der erhaltene hebräische Text lautet: „[Und wenn sie dich zum Essen drängen, zieh dich von der Tischrunde zurück,] dann wirst du Ruhe finden.“ Die griechische Parallele bietet stattdessen: „Wer einem Lohnarbeiter den Lohn vorenthält, vergießt Blut.“ Das weist auf eine erhebliche Textabweichung oder eine andere Verszuordnung hin.'
    reason: textual_variant
lexical_decisions:
- source_word: ואם
  choice: Und wenn
  rationale: Gibt die konditionale Konjunktion mit vorangestelltem Waw natürlich und zugleich formal nah wieder.
- source_word: יפצירו בך
  choice: sie dich … drängen
  rationale: Das Verb bezeichnet nachdrückliches Zureden oder Drängen; „drängen“ bewahrt den sozialen Druck der Situation.
- source_word: לאכול
  choice: zum Essen
  rationale: Natürliche deutsche Wiedergabe des Infinitivs von אכל in Verbindung mit „drängen“.
- source_word: סור מן
  choice: zieh dich … zurück
  rationale: Der Imperativ bezeichnet ein Sich-Entfernen oder Abwenden; in dieser gesellschaftlichen Situation ist „sich zurückziehen“ idiomatisch und bewahrt den Trennungssinn.
- source_word: הסבה
  choice: der Tischrunde
  rationale: Das Wort verweist auf die beim Mahl lagernde Gesellschaft beziehungsweise Mahlgemeinschaft. „Tischrunde“ bezeichnet eher die versammelte Gesellschaft als ein prunkvolles Festmahl.
- source_word: ותמצא
  choice: dann wirst du … finden
  rationale: Das Waw mit Imperfekt führt hier natürlich die Folge der vorangehenden Aufforderung ein.
- source_word: נחת
  choice: Ruhe
  rationale: נחת kann Ruhe, Erleichterung oder Behagen bezeichnen; „Ruhe“ ist knapp und lässt die genaue Nuance offen.
theological_decisions:
- issue: Eingeklammerter hebräischer Satzteil und erhebliche Abweichung der griechischen Parallele
  choice: Der erhaltene hebräische Wortlaut steht im Haupttext; die starke Abweichung der griechischen Überlieferung wird in einer Fußnote offengelegt.
  alternative: 'Die griechische Parallele lautet: „Wer einem Lohnarbeiter den Lohn vorenthält, vergießt Blut.“'
  rationale: Wo ein hebräischer Sirach-Text erhalten ist, besitzt er für diese Übersetzung Vorrang. Die griechische Parallele entspricht ihm jedoch nicht und kann eine andere Textüberlieferung oder Verszählung widerspiegeln; diese Unsicherheit darf nicht stillschweigend beseitigt werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die eckigen Klammern des zugrunde gelegten hebräischen Editionstextes bleiben erhalten, um dessen textkritische Kennzeichnung sichtbar zu machen. „Tischrunde“ ist verständlich und bildet den gesellschaftlichen Mahlkontext ab, ohne den Sinn unnötig auf ein festliches Bankett festzulegen.
