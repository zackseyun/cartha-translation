  text: One who eagerly pursues gain will not go unpunished[c][b][a], and one who loves profit will go astray by it.
translation:
  language: de
  text: Wer dem Reichtum[a] nachjagt, bleibt nicht ungestraft, und wer Gewinn[b] liebt, wird durch ihn irregehen.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „dem Gold“ beziehungsweise „dem Vermögen“; das hebräische Wort kann materiellen Reichtum genauer bezeichnen.
    reason: lexical_alternative
  - marker: b
    text: Oder „Bezahlung“ beziehungsweise „Preis“.
    reason: lexical_alternative
  - marker: c
    text: 'Der erhaltene hebräische Text bietet hier einen Spruch über das Streben nach Reichtum und die Liebe zum Gewinn. Die griechische Überlieferung hat stattdessen: „Wahrsagungen, Vorzeichen und Träume sind nichtig, und das Herz hat Vorstellungen wie eine Frau in den Wehen.“ Offenbar liegt eine erheblich abweichende Textüberlieferung vor.'
    reason: textual_variant
lexical_decisions:
- source_word: רודף
  choice: nachjagt
  rationale: Das Partizip bezeichnet ein fortgesetztes, zielgerichtetes Verfolgen. „Nachjagen“ gibt die intensive Ausrichtung auf materiellen Besitz natürlich und prägnant wieder.
- source_word: חרוץ
  choice: Reichtum
  rationale: Das Substantiv bezeichnet hier wahrscheinlich materiellen Besitz beziehungsweise Gewinn; „Reichtum“ passt zum wirtschaftlich-ethischen Zusammenhang und lässt sich im Deutschen natürlich mit „nachjagen“ verbinden.
- source_word: לא ינקה
  choice: bleibt nicht ungestraft
  rationale: Die hebräische Wendung kann bedeuten, nicht schuldlos zu sein beziehungsweise einer Strafe nicht zu entgehen. Die gewählte Formulierung gibt die Konsequenz in verständlichem Deutsch wieder.
- source_word: אוהב
  choice: wer … liebt
  rationale: Das substantivierte Partizip wird allgemein formuliert und bewahrt die parallele Satzstruktur.
- source_word: מחיר
  choice: Gewinn
  rationale: Das Wort kann „Preis“ oder „Bezahlung“ bedeuten, bezeichnet in diesem Spruch aber wahrscheinlich den erstrebten finanziellen Vorteil. „Gewinn“ ist im Deutschen idiomatisch, ohne die mögliche engere Bedeutung zu verschweigen.
- source_word: בו
  choice: durch ihn
  rationale: 'Die Präposition mit Suffix wird instrumental beziehungsweise kausal verstanden: Der geliebte Gewinn wird zum Mittel oder Anlass des Irrgehens.'
- source_word: ישגה
  choice: wird … irregehen
  rationale: Das Verb beschreibt ein Abirren oder Fehlgehen. „Irregehen“ wahrt sowohl den praktischen als auch den moralischen Sinn, ohne die Ursache übermäßig festzulegen.
theological_decisions:
- issue: Vorrang des erhaltenen hebräischen Textes gegenüber der stark abweichenden griechischen Parallele
  choice: Der erhaltene hebräische Spruch über das Streben nach Reichtum und die Liebe zum Gewinn wird übersetzt.
  alternative: 'Die griechische Überlieferung lautet sinngemäß: „Wahrsagungen, Vorzeichen und Träume sind nichtig, und das Herz hat Vorstellungen wie eine Frau in den Wehen.“'
  rationale: Wo ein hebräischer Text von Jesus Sirach erhalten ist, dient er als primäre Grundlage. Da die griechische Fassung hier keinen geringfügigen Variantenunterschied, sondern einen völlig anderen Spruch bietet, wird die Abweichung in einer Fußnote offengelegt und nicht harmonisiert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer weisheitlicher Parallelstruktur. „Nachjagen“ und „irregehen“ sind allgemein verständlich und bewahren die eindringliche moralische Bildsprache; die erhebliche Textabweichung der griechischen Überlieferung wird ausdrücklich dokumentiert.
