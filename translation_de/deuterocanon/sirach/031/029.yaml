  text: Even if you are constrained[a], wait for delicacies patiently[b], and it will bring you rest.
translation:
  language: de
  text: Auch wenn du genötigt wirst[b], warte bei erlesenen Speisen geduldig; so wirst du Ruhe finden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Parallelüberlieferung lautet: „Der eine betet, der andere flucht – auf wessen Stimme wird der Gebieter hören?“ Sie vertritt hier eine wesentlich andere Texttradition als der erhaltene hebräische Text.'
    reason: alternative_reading
  - marker: b
    text: Der hebräische Wortlaut dieses Verses ist unsicher und weicht stark vom griechischen Textzeugen ab. Das mit „du genötigt wirst“ wiedergegebene schwierige Wort kann auch „du gezwungen wirst“ oder „du unter Druck stehst“ bedeuten.
    reason: textual_variant
lexical_decisions:
- source_word: וגם אם
  choice: Auch wenn
  rationale: Die Verbindung wird im Deutschen natürlich als konzessive Einleitung wiedergegeben und schließt die Mahnung an den vorangehenden Zusammenhang an.
- source_word: נאנסתה
  choice: du genötigt wirst
  rationale: Die schwierige Form von אנס bezeichnet Zwang oder Druck. „Genötigt“ wahrt diese Bedeutungsbreite, ohne hier eine vom Mahlkontext nicht gestützte sexuelle Bedeutung einzutragen.
- source_word: במטעמים
  choice: auf Leckerbissen
  rationale: מטעמים bezeichnet schmackhafte, erlesene Speisen. „Leckerbissen“ ist verständlich und gibt den besonderen Reiz der Speisen wieder.
- source_word: קוה קוה
  choice: warte geduldig
  rationale: Die Wiederholung verstärkt die Aufforderung zum Warten. Im natürlichen modernen Deutsch wird diese Intensivierung mit „geduldig“ ausgedrückt, statt die schwerfällige Verdopplung wörtlich nachzubilden.
- source_word: וינוח לך
  choice: dann wird es dir Ruhe verschaffen
  rationale: נוח bezeichnet Ruhe oder Erleichterung; לך kennzeichnet den Begünstigten. Wegen der unsicheren Syntax bleibt das unbestimmte Subjekt „es“ erhalten.
theological_decisions:
- issue: Starke Abweichung zwischen dem erhaltenen hebräischen Text und der griechischen Überlieferung
  choice: Der erhaltene hebräische Text bildet den Haupttext; die wesentlich andere griechische Fassung wird in einer Fußnote vollständig dokumentiert.
  alternative: 'Den griechischen Text als Haupttext wiedergeben: „Der eine betet, der andere flucht – auf wessen Stimme wird der Gebieter hören?“'
  rationale: Da für Jesus Sirach ein hebräischer Textzeuge vorliegt, erhält er Vorrang. Die griechische Fassung bezeugt jedoch keine bloße Kleinvariante, sondern eine grundverschiedene Texttradition und muss deshalb sichtbar erhalten bleiben.
- issue: Deutung der schwierigen Form נאנסתה
  choice: 'Allgemeiner Zwang oder Druck: „du genötigt wirst“'
  alternative: „du gezwungen wirst“, „du unter Druck stehst“ oder in anderem Kontext „du Gewalt erleidest“
  rationale: Der unmittelbare Speisekontext spricht für eine allgemeine Nötigung oder Bedrängung. Die Übersetzung lässt die genaue Art des Drucks offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die schwerfällige hebräische Wiederholung קוה קוה wird idiomatisch als „warte geduldig“ wiedergegeben. Das Semikolon hält Mahnung und Folge eng zusammen; die unklare Referenz des hebräischen Verbs bleibt durch „es“ bewusst offen.
