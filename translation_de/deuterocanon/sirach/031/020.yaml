  text: Know that your neighbor is a man like yourself[b][a], and eat what is set before you.
translation:
  language: de
  text: Erkenne, dass dein Nächster ein Mann ist wie du,[a][b] und iss, was man dir vorsetzt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder inklusiv: »ein Mensch wie du«. Hebräisch wörtlich: »ein Mann wie du«.'
    reason: lexical_alternative
  - marker: b
    text: 'Der griechische Textzeuge weicht hier stark ab: »die Seele erhebend und die Augen erleuchtend, Heilung, Leben und Segen gebend«. Hebräisch und Griechisch bewahren offenbar unterschiedliche Fassungen des Verses.'
    reason: alternative_reading
lexical_decisions:
- source_word: דע
  choice: Erkenne
  rationale: Der Imperativ von ידע kann hier über bloßes Faktenwissen hinaus die bewusste Wahrnehmung des anderen ausdrücken. „Erkenne“ ist im Deutschen natürlich und bewahrt den mahnenden Ton.
- source_word: רעך
  choice: dein Nächster
  rationale: רֵעַ kann Freund, Gefährte oder Nächster bedeuten. Im Zusammenhang der Rücksichtnahme bei Tisch gibt „dein Nächster“ die soziale und ethische Beziehung treffend wieder.
- source_word: איש כמוך
  choice: ein Mensch ist wie du
  rationale: איש bezeichnet wörtlich einen Mann, kann aber in einer allgemeinen Aussage auch den einzelnen Menschen bezeichnen. „Ein Mensch … wie du“ gibt den allgemein-menschlichen Sinn natürlich wieder; die wörtlich maskuline Form wird in der Fußnote genannt.
- source_word: ואכול
  choice: und iss
  rationale: Der einfache mit ו verbundene Imperativ wird parataktisch wiedergegeben, ohne eine im Hebräischen nicht ausdrücklich markierte Folgerung hinzuzufügen.
- source_word: דבר ששם לפניך
  choice: was man dir vorsetzt
  rationale: Wörtlich etwa „das, was vor dich hingestellt wird“. Im Mahlkontext ist „was man dir vorsetzt“ idiomatisches, gegenwärtiges Deutsch und lässt das unbestimmte Subjekt des Hebräischen bestehen.
theological_decisions:
- issue: Geschlechtsbezogene Formulierung in איש כמוך
  choice: ein Mensch ist wie du
  alternative: ein Mann wie du
  rationale: Obwohl איש formal maskulin ist, hat der Spruch allgemeinen Geltungsanspruch. Die Hauptfassung verwendet deshalb natürliches, inklusives Deutsch, während die wörtliche Form in einer Fußnote transparent gemacht wird, ohne die Aussage auf Männer einzuengen.
- issue: Starke Abweichung zwischen hebräischem und griechischem Textzeugen
  choice: Dem erhaltenen hebräischen Text folgen und die griechische Fassung in einer Fußnote dokumentieren
  alternative: „die Seele erhebend und die Augen erleuchtend, Heilung, Leben und Segen gebend“
  rationale: Der hebräische Text ist hier vorhanden und verständlich. Der griechische Zeuge bietet keine bloße Übersetzungsvariante, sondern offenbar eine wesentlich andere Versgestalt; beide dürfen daher nicht harmonisiert werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe, parataktische Mahnrede des Hebräischen bleibt erhalten; „was man dir vorsetzt“ ist im Tischkontext idiomatisch und allgemein verständlich.
