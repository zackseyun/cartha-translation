translation:
  language: de
  text: Schmerz und schlafloses Umherwälzen[a], Würgen[b] und Ersticken, dazu ein verdrehtes Gesicht[c] mit einem Toren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hebräische Wortlaut dieser ganzen Zeile ist schwierig, besonders bei den mittleren Beschwerden und der Wendung vom „verdrehten Gesicht“. Die griechische Überlieferung bietet an dieser Stelle einen völlig anderen Satz: Wer aus dem Besitz Armer ein Opfer darbringt, gleicht einem, der den Sohn vor den Augen seines Vaters schlachtet. Das weist auf eine erhebliche Abweichung der Textüberlieferung hin.'
    reason: textual_variant
  - marker: b
    text: 'Oder: „Erbrechen“. Die hebräische Form ist unsicher.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „ein abgewandtes Gesicht“ beziehungsweise „eine entstellte Miene“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מכאוב
  choice: Schmerz
  rationale: Das Substantiv bezeichnet körperlichen Schmerz oder körperliche Qual; im Zusammenhang mit den aufgezählten Beschwerden ist „Schmerz“ die naheliegende Wiedergabe.
- source_word: ונדד ישנה
  choice: schlafloses Umherwälzen
  rationale: Die Wendung verbindet das Fortwandern beziehungsweise Entfliehen mit „Schlaf“. „Schlafloses Umherwälzen“ gibt die daraus entstehende ruhelose Wachheit in natürlichem Deutsch wieder, ohne die schwierige hebräische Bildsprache ganz einzuebnen.
- source_word: ומער
  choice: Würgen
  rationale: Die Form ist unsicher, weist im Zusammenhang aber wahrscheinlich auf eine heftige Magen- oder Rachenreaktion. „Würgen“ bleibt zurückhaltender als die eindeutige Festlegung auf tatsächliches Erbrechen.
- source_word: ותשניק
  choice: Atemnot
  rationale: Das Wort gehört zu einem Bedeutungsfeld von Würgen, Einengung und Ersticken. Neben „Würgen“ vermeidet „Atemnot“ eine schwerfällige Wiederholung und bezeichnet die körperliche Folge verständlich.
- source_word: ופני הפוכות
  choice: ein verdrehtes Gesicht
  rationale: Wörtlich ist von einem gewendeten oder umgekehrten Gesicht die Rede. „Ein verdrehtes Gesicht“ bewahrt das ungewöhnliche Bild und lässt offen, ob Abwendung oder eine entstellte Miene gemeint ist.
- source_word: עם איש כסיל
  choice: bei einem Toren
  rationale: כסיל ist die geläufige weisheitliche Bezeichnung für einen Toren. Die Formulierung ist knapp, idiomatisch und wahrt den Singular.
