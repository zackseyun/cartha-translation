  text: Stretch out your hand to the place he looks at[a], and do not reach with him into the dish.
translation:
  language: de
  text: Streck deine Hand nicht nach der Stelle aus, auf die er blickt,[a] und greif nicht mit ihm zugleich in die Schüssel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Überlieferung lautet hier: »Glücklich ist die Seele dessen, der den Herrn fürchtet.« Der in der Kairoer Geniza erhaltene hebräische Text bietet dagegen eine andere Zeile über Tischsitten. Die Textüberlieferung ist an dieser Stelle unsicher.'
    reason: alternative_reading
lexical_decisions:
- source_word: מקום
  choice: die Stelle
  rationale: Das hebräische Wort bedeutet gewöhnlich »Ort/Stelle«. Im Zusammenhang der Tischsitten bezeichnet es die Stelle beziehungsweise den Bereich, auf den der andere Tischgast Anspruch erhebt.
- source_word: יביט
  choice: auf die er blickt
  rationale: Die Form bezeichnet das Blicken oder Hinschauen. Die Wiedergabe bleibt nah am Hebräischen und lässt offen, ob der Blick einen gewünschten Anteil markiert.
- source_word: תושיט יד
  choice: Streck deine Hand … aus
  rationale: Die konkrete hebräische Wendung wird in natürlichem, leicht gehobenem Deutsch wiedergegeben und passt zur Situation bei Tisch.
- source_word: אל תחד
  choice: greif nicht gleichzeitig
  rationale: Die überlieferte Form ist textlich schwierig. Im Zusammenhang warnt sie offenbar davor, zugleich mit dem anderen nach der Speise zu greifen; »gleichzeitig greifen« gibt diesen praktischen Sinn wieder, ohne eine unsichere Einzelbedeutung zu behaupten.
- source_word: עמו
  choice: mit ihm
  rationale: Die Präposition beschreibt gemeinsames beziehungsweise gleichzeitiges Handeln und bewahrt den maskulinen Singular des hebräischen Textes.
- source_word: בטנא
  choice: in die Schüssel
  rationale: Das Substantiv kann einen Korb oder Behälter bezeichnen. Im Mahlzeitkontext ist mit »Schüssel« ein gemeinsames Speisegefäß natürlich und sachgerecht wiedergegeben.
- source_word: φοβουμένου τὸν Κύριον μακαρία ἡ ψυχή
  choice: nicht in den Haupttext aufgenommen
  rationale: Die griechische Überlieferung bietet einen völlig anderen Satz und dürfte eine abweichende Texttradition oder Verszuordnung spiegeln. Da hier ein hebräischer Text erhalten ist, folgt der Haupttext diesem; die bedeutende griechische Lesart wird in der Fußnote dokumentiert.
theological_decisions:
- issue: Abweichung zwischen der erhaltenen hebräischen und der griechischen Überlieferung
  choice: Im Haupttext steht die hebräische Mahnung zu Tischsitten; die griechische Seligpreisung des Gottesfürchtigen erscheint in einer Fußnote.
  alternative: »Glücklich ist die Seele dessen, der den Herrn fürchtet.«
  rationale: Wo für Jesus Sirach Hebräisch erhalten ist, hat dieses für den Haupttext Vorrang. Da die Metadaten jedoch eine erhebliche Abweichung anzeigen und die griechische Fassung inhaltlich völlig anders lautet, wird sie transparent als bedeutende alternative Überlieferung bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit direkter Anrede. Die konkrete Bildsprache des hebräischen Tischkontexts bleibt erhalten; die schwierige Verbform wird vorsichtig und verständlich wiedergegeben.
