translation:
  language: de
  text: Denn wegen jeder Sache zittert das Auge[a], und vom Gesicht fließen Tränen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der erhaltene hebräische Text weicht hier stark von der griechischen Überlieferung ab. Diese lautet: „Wer den Herrn fürchtet, wird gewiss nicht zaghaft sein und gewiss nicht feige werden, denn er selbst ist seine Hoffnung.“ Der Haupttext folgt dem erhaltenen hebräischen Text.'
