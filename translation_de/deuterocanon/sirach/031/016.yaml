lexical_decisions:
- source_word: כי
  choice: Denn
  rationale: כי leitet hier offenbar eine begründende oder erläuternde Aussage ein. Das knappe „Denn“ bewahrt diese Funktion, ohne die schwierige, elliptische Verknüpfung stärker als nötig auszudeuten.
- source_word: מפני כל דבר
  choice: vor jeder Sache
  rationale: מפני kann räumlich „vor“ oder kausal „wegen“ bedeuten; דבר kann „Sache“, „Angelegenheit“ oder „Wort“ heißen. „Vor jeder Sache“ bewahrt die ungewöhnliche Bildlichkeit und einen Teil der echten Mehrdeutigkeit.
- source_word: תזוע עין
  choice: zittert das Auge
  rationale: זוע bezeichnet ein Zittern oder Erschüttertwerden. Der Singular „das Auge“ folgt dem Hebräischen und erhält das konkrete Körperbild.
- source_word: ומפנים
  choice: und vom Gesicht
  rationale: פנים bedeutet wörtlich „Gesicht“. Die Wiedergabe vermeidet eine glättende Ersetzung durch „Augen“ oder „Wangen“.
- source_word: דמעה תדמע
  choice: fließen Tränen
  rationale: Die hebräische Verbindung von Substantiv und stammverwandtem Verb verstärkt das Weinen. „fließen Tränen“ gibt das Bild natürlich wieder, auch wenn das Wortspiel im Deutschen nicht nachgebildet werden kann.
theological_decisions:
- issue: Starke Abweichung zwischen dem erhaltenen hebräischen Text und der griechischen Überlieferung
  choice: Der Haupttext folgt dem erhaltenen Hebräisch; die erheblich abweichende griechische Lesart wird in einer Fußnote vollständig dokumentiert.
  alternative: „Wer den Herrn fürchtet, wird gewiss nicht zaghaft sein und gewiss nicht feige werden, denn er selbst ist seine Hoffnung.“
  rationale: Da ein hebräischer Textzeuge erhalten ist, bildet er die Grundlage. Die griechische Fassung ist keine bloße Bedeutungsvariante, sondern bezeugt einen grundlegend anderen Text und darf daher weder harmonisiert noch stillschweigend in den Haupttext übernommen werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die auffällige Bildsprache und die Unbestimmtheit des schwierigen hebräischen Satzes bleiben erhalten; der Satz wird nur so weit geglättet, wie es für verständliches Deutsch nötig ist.
