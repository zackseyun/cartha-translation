    issue: „vor jeder Sache“ für מפני כל דבר
    rationale: Im deutschen Satz wird „vor“ überwiegend räumlich oder temporal verstanden und erzeugt keine klare kausale Verbindung. Das Hebräische kann formal mehrere Nuancen haben, doch der überlieferte Satz und die Vergleichsübersetzung stützen hier „wegen“ beziehungsweise „aufgrund“.
  - severity: low
    issue: „dem erhaltenen hebräischen Zeugen“ in der Fußnote
    rationale: Die zugrunde liegende Edition ist eine Kompilation erhaltener Geniza-Handschriften. Die allgemeinere Formulierung „dem erhaltenen hebräischen Text“ ist sachlich genauer und ändert die Aussage nicht.
