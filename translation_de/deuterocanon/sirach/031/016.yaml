  source_fidelity: Der Haupttext folgt zutreffend dem erhaltenen hebräischen Wortlaut und wahrt dessen knappe, schwierige Bildsprache. Die griechische Parallelüberlieferung wird korrekt als stark abweichende Texttradition kenntlich gemacht. Für מפני ist im gegebenen Zusammenhang die kausale Wiedergabe besser begründet als das im Entwurf räumlich beziehungsweise temporal wirkende „vor“.
  naturalness: '„Vor jeder Sache zittert das Auge“ ist im modernen Standarddeutsch missverständlich und unidiomatisch: Es legt nahe, das Auge befinde sich räumlich oder zeitlich vor einer Sache. „Wegen jeder Sache“ gibt die naheliegende kausale Beziehung verständlich wieder, ohne die konkrete Bildsprache der folgenden Ausdrücke zu glätten. Die bewusst wörtliche Wendung „vom Gesicht fließen Tränen“ bleibt als markierte Bildsprache vertretbar.'
  terminology: „Das Auge“, „Gesicht“ und „Tränen“ geben die hebräischen Körperbilder angemessen wieder. Die Fußnote verwendet mit „Herrn“ und „Hoffnung“ sachgerechte, traditionsübergreifend verständliche Begriffe. „Erhaltenen hebräischen Text“ ist präziser als „erhaltenen hebräischen Zeugen“, da die angeführte Kahana-Fassung eine Kompilation mehrerer Geniza-Handschriften ist.
  issues:
