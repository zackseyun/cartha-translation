- from: Denn vor jeder Sache zittert das Auge[a], und vom Gesicht fließen Tränen.
  to: Denn wegen jeder Sache zittert das Auge[a], und vom Gesicht fließen Tränen.
  rationale: Die Revision ersetzt allein das im Deutschen missverständliche „vor jeder Sache“ durch die kontextuell naheliegende kausale Wiedergabe „wegen jeder Sache“. Die Satzstellung, der Singular „das Auge“ und das wörtliche Bild „vom Gesicht fließen Tränen“ bleiben erhalten. Die Fußnote wird nur terminologisch präzisiert und dokumentiert weiterhin die grundlegende Abweichung der griechischen Überlieferung, ohne die Textformen zu harmonisieren.
