translation:
  language: de
  text: Sei bei allem, was du tust, bescheiden[a], und kein Unglück wird dich treffen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Text bietet hier eine erheblich abweichende Lesart: „Einer baut auf und ein anderer reißt nieder; was haben sie mehr gewonnen als Mühe?“ Der Vers ist hier nach dem erhaltenen hebräischen Text übersetzt, der deutlich von der griechischen Überlieferung abweicht.'
    reason: textual_variant
lexical_decisions:
- source_word: בכל מעשיך
  choice: Bei allem, was du tust
  rationale: Die Wendung gibt den umfassenden Geltungsbereich natürlich und verständlich wieder; מעשים bezeichnet hier das praktische Tun bzw. Verhalten.
- source_word: היה
  choice: sei
  rationale: Die imperativische Form von היה mit prädikativem Adjektiv wird im Deutschen am unmittelbarsten mit „sei“ wiedergegeben.
- source_word: צנוע
  choice: bescheiden
  rationale: Das Wort bezeichnet Bescheidenheit, Zurückhaltung oder ein maßvolles Auftreten. „Bescheiden“ bewahrt die sozialethische Nuance, ohne den Begriff einseitig als Demut zu deuten.
- source_word: וכל אסון לא
  choice: dann wird dich kein Unglück
  rationale: Die hebräische Verknüpfung mit ו und Negation lässt sich als Folgesatz idiomatisch mit „dann … kein“ ausdrücken.
- source_word: אסון
  choice: Unglück
  rationale: אסון bezeichnet schweres Unheil oder eine Katastrophe. „Unglück“ ist im Deutschen würdig und breit genug, ohne nur ein großflächiges Desaster nahezulegen.
- source_word: יגע בך
  choice: treffen
  rationale: נגע bedeutet wörtlich „berühren, erreichen“ und kann bei Unheil idiomatisch „treffen“ heißen. So bleibt das Bild des herankommenden Unheils in natürlichem Deutsch erhalten.
theological_decisions:
- issue: Verhältnis zwischen bescheidenem Verhalten und Schutz vor Unglück
  choice: als unkommentierte Weisheitsfolge formuliert
  alternative: als ausnahmslose göttliche Schutzverheißung präzisieren oder abschwächen
  rationale: Der hebräische Text stellt die Folge unmittelbar dar, benennt jedoch weder den Handelnden noch die genaue Art der Kausalität. Die Übersetzung bewahrt diese Spannung, ohne eine systematische Lehraussage einzutragen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Weisheitston. „Bei allem, was du tust“ klingt natürlicher als das formellere „In all deinen Taten“; „bescheiden“ hält die Bedeutungsbreite von Zurückhaltung und maßvollem Auftreten offen.
