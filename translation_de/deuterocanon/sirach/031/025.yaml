  text: Years of life come from a sound stomach; one rises in the morning, and his life is with him.
translation:
  language: de
  text: Ein gesunder Magen schenkt Lebensjahre; man steht am Morgen auf, und sein Leben ist bei ihm.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קרב תולל
  choice: ein gesunder Magen
  rationale: קרב bezeichnet hier den Bauch beziehungsweise Magen als Inneres des Menschen; תולל wird im gegebenen Zusammenhang als ein guter, kräftiger oder gesunder Zustand verstanden. „Gesunder Magen“ gibt die Aussage natürlich und ohne unnötige medizinische Präzisierung wieder.
- source_word: שנות חיים
  choice: Lebensjahre
  rationale: Die knappe hebräische Verbindung wird wörtlich und idiomatisch als „Lebensjahre“ wiedergegeben.
- source_word: ונפשו אתו
  choice: und die Lebenskraft ist bei einem
  rationale: נפש kann Leben, Seele oder Lebenskraft bezeichnen. Im Zusammenhang mit körperlichem Wohlbefinden und dem morgendlichen Aufstehen trifft „Lebenskraft“ den Sinn, während „ist bei einem“ die auffällige hebräische Formulierung und ihre Bildhaftigkeit bewahrt.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. Der Wechsel von der allgemeinen Aussage zum unpersönlichen „man/einem“ bildet den hebräischen Singular ab, ohne ein ausschließlich männliches Subjekt einzuführen. Der stark abweichende griechische Paralleltext wurde wegen des ausdrücklich als zuverlässig eingestuften hebräischen Textes und der offensichtlichen inhaltlichen Nichtübereinstimmung nicht in den Vers eingemischt.
