  source_fidelity: Der Entwurf gibt שנות חיים und die Aussage über einen gesunden bzw. kräftigen „Bauch/Magen“ angemessen wieder. Für נפשו ist jedoch „Leben“ die unmittelbarere Entsprechung als die stärker deutende „Lebenskraft“. Die ungewöhnliche Wendung „sein Leben ist bei ihm“ bewahrt die hebräische Aussage, ohne eine bestimmte Deutung von נפש festzulegen.
  naturalness: „Ein gesunder Magen schenkt Lebensjahre“ ist modernes, idiomatisches Deutsch. Die Schlusswendung bleibt bewusst leicht markiert, ist aber verständlich und reflektiert die bildhafte hebräische Formulierung besser als „die Lebenskraft ist bei einem“.
  terminology: „Magen“ ist im Deutschen eine natürliche Kontextentsprechung für קרב. „Lebensjahre“ ist treffend für שנות חיים. „Leben“ wahrt bei נפש die semantische Offenheit zwischen Leben und Lebenskraft.
