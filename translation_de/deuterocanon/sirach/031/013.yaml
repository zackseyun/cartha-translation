translation:
  language: de
  text: Mein Sohn, wenn du an einer großen Tafel sitzt, sperre deinen Rachen nicht darüber auf.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Öffne deinen Rachen nicht darüber.“ Das hebräische Bild warnt vor Gier und ungezügeltem Appetit an einer großen oder üppigen Tafel.'
