    reason: textual_variant
lexical_decisions:
- source_word: בני
  choice: Mein Sohn
  rationale: Die Anrede mit Suffix der 1. Person Singular wird wörtlich und im würdevollen Lehrton der Weisheitsliteratur wiedergegeben.
- source_word: אם
  choice: wenn
  rationale: Im Deutschen bezeichnet „wenn“ eine allgemeine oder mögliche Bedingung natürlich, ohne zu behaupten, dass die Situation sicher eintreten wird.
- source_word: על שלחן גדול
  choice: an einer reich gedeckten Tafel
  rationale: Wörtlich steht „an einem großen Tisch“. גדול kann hier außer der Größe auch Rang oder Üppigkeit bezeichnen; die gewählte Wendung macht den im Kontext naheliegenden reichen Tisch verständlich, ohne einen bestimmten Gastgeber einzuführen.
- source_word: ישבת
  choice: sitzt
  rationale: Die formal perfektive Form hat im konditionalen Weisheitsspruch allgemeinen Gegenwartsbezug und wird deshalb idiomatisch im Präsens wiedergegeben.
- source_word: אל תפתח עליו גרנך
  choice: sperre nicht gierig deinen Rachen darüber auf
  rationale: „Rachen“ bewahrt das kräftige Bild von גרון, während „gierig“ die idiomatische Warnung vor maßlosem Zugreifen im heutigen Deutsch kenntlich macht. „Darüber“ gibt עליו wieder.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit dem würdevollen Ton eines Weisheitsspruchs. „Tafel“ und „Rachen aufsperren“ erhalten die anschauliche Bildsprache; „gierig“ verhindert, dass die Wendung als bloße Körperbewegung missverstanden wird.
