base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/031/019.yaml
  text: Recline like a well-bred man[a], and do not gobble[c][b], lest you become disgusting.
translation:
  language: de
  text: Lege dich zu Tisch[a] wie ein vornehmer Mann[b], und schlinge nicht, damit du nicht widerwärtig wirst.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bei festlichen Mahlzeiten lag man in der antiken Mittelmeerwelt gewöhnlich zu Tisch.
    reason: cultural_note
  - marker: b
    text: 'Oder: „wie ein ausgezeichneter Mann“ beziehungsweise „wie ein auserwählter Mann“. Die genaue Nuance der hebräischen Wendung ist unsicher; im Zusammenhang geht es offenbar um kultiviertes, angemessenes Benehmen bei Tisch.'
    reason: lexical_alternative
  - marker: c
    text: Der griechische Text bei Swete entspricht an dieser Versstelle nicht dieser hebräischen Zeile. Dies weist auf unterschiedliche Text- beziehungsweise Versüberlieferungen hin.
    reason: textual_variant
lexical_decisions:
- source_word: הסב
  choice: Lege dich zu Tisch
  rationale: Im Zusammenhang eines Gastmahls bezeichnet das Verb das Lagern beziehungsweise Sich-Niederlegen bei Tisch, nicht bloß ein Hinsetzen oder Sich-Umwenden. Die Formulierung bewahrt die antike Tischsitte und bleibt verständlich.
- source_word: כאיש אשר נבחר
  choice: wie ein vornehmer Mann
  rationale: Wörtlich steht etwa „wie ein Mann, der erwählt/ausgesucht ist“. Im Zusammenhang der Tischsitten liegt die Bedeutung eines ausgezeichneten, kultivierten oder vornehmen Mannes nahe. „Vornehm“ gibt diese soziale und ethische Nuance natürlich wieder, ohne die unsichere Wendung zu überdeuten.
- source_word: תעט
  choice: schlinge nicht
  rationale: Die Warnung richtet sich gegen hastiges, gieriges und unfeines Essen. „Schlingen“ bringt dies im Deutschen knapp und anschaulich zum Ausdruck, ohne ein im Hebräischen nicht ausdrücklich genanntes Objekt hinzuzufügen.
- source_word: תגעל
  choice: damit du nicht widerwärtig wirst
  rationale: Die Verbform beschreibt hier wahrscheinlich, dass jemand durch sein Benehmen abstoßend beziehungsweise zum Gegenstand des Abscheus wird. Die Wiedergabe wahrt diese soziale Folge und die direkte Schärfe der Mahnung.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Form einer Weisheitsmahnung bleibt erhalten. „Lege dich zu Tisch“ macht die historische Körperhaltung sichtbar; „schlinge nicht“ ist bewusst anschaulich und allgemeinverständlich. Die männliche Bezeichnung entspricht איש im hebräischen Text.
