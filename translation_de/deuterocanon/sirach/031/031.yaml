base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/031/031.yaml
  text: Listen, my son, and accept my words; do not reject me, and in the end you will find my words.
translation:
  language: de
  text: Höre, mein Sohn, und nimm meine Worte an; verspotte mich nicht, und schließlich wirst du meine Worte finden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Text überliefert an dieser Stelle einen völlig anderen Wortlaut: Er handelt von einem Menschen, der wegen seiner Sünden fastet, dann aber wieder dasselbe tut, und fragt, wer sein Gebet erhören werde und was seine Demütigung ihm genützt habe.'
    reason: Die hoch eingestufte hebräische Fassung und der griechische Paralleltext weichen in diesem Vers grundlegend voneinander ab. Die Fußnote dokumentiert die Abweichung, ohne den hebräischen Haupttext mit dem griechischen Wortlaut zu vermischen.
lexical_decisions:
- source_word: שמע
  choice: Höre
  rationale: Der Imperativ bedeutet hier, aufmerksam zuzuhören; das knappe „Höre“ bewahrt Anrede und Weisheitston.
- source_word: וקח אמרי
  choice: und nimm meine Worte an
  rationale: לקח heißt wörtlich „nehmen“, bezeichnet in diesem Lehrzusammenhang aber die bereitwillige Annahme der Unterweisung.
- source_word: ואל תלעיז עליי
  choice: verleumde mich nicht
  rationale: Die Wendung mit לעז und על bezeichnet üble oder falsche Rede gegen jemanden. „Verleumden“ gibt diesen personalen Bezug genauer wieder als das allgemeinere „ablehnen“.
- source_word: ובאחרית תמצא דברי
  choice: und am Ende wirst du meine Worte bestätigt finden
  rationale: Wörtlich steht „du wirst meine Worte finden“. Im Deutschen bleibt das Objekt ohne Ergänzung unnatürlich und unklar; „bestätigt finden“ drückt den wahrscheinlichen Sinn aus, dass sich die Worte zuletzt als wahr bzw. zuverlässig erweisen, ohne den Zeitpunkt näher festzulegen.
theological_decisions:
- issue: Starke Abweichung zwischen hebräischem Text und griechischem Paralleltext
  choice: Dem als hoch verlässlich angegebenen hebräischen Text folgen
  alternative: Den griechischen Satz über Fasten, wiederholte Sünde und unerhörtes Gebet übersetzen
  rationale: Die angegebene hebräische Quelle bietet einen vollständig anderen Vers und ist für diesen Auftrag die primäre Originalsprachen-Evidenz; der griechische Text wird daher nicht in den Haupttext eingemischt. Die Abweichung wird transparent in einer Fußnote dokumentiert.
- issue: Sinn von „meine Worte finden“
  choice: als spätere Bestätigung der Lehre wiedergeben
  alternative: streng wörtlich „meine Worte finden“
  rationale: Die Ergänzung macht die elliptische hebräische Aussage in natürlichem Deutsch verständlich, ohne festzulegen, auf welche Weise oder in welcher Lage die Worte bestätigt werden.
translation_notes:
  register: Knappes, würdevolles modernes Standarddeutsch im Ton einer väterlichen Weisheitsunterweisung. Die Anrede „mein Sohn“ und die Imperativfolge bleiben erhalten; die schwierige Schlusswendung wird behutsam idiomatisch verdeutlicht.
