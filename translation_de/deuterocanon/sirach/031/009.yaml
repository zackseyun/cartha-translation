  text: Who is this? Let us call him blessed[a], for he has done wonders among his people.
translation:
  language: de
  text: Wer ist dieser? Lasst uns ihn glücklich preisen[a], denn er hat unter seinem Volk Wunderbares vollbracht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Parallele weicht hier erheblich ab: „Ein gebildeter Mann hat vieles erkannt, und wer viel Erfahrung hat, wird Einsicht darlegen.“ Dies geht wahrscheinlich auf eine andere Textform oder Verszuordnung zurück.'
    reason: alternative_reading
lexical_decisions:
- source_word: מי הוא זה
  choice: Wer ist dieser?
  rationale: Die rhetorische Frage führt eine vorbildliche Person ein. „Dieser“ bewahrt die demonstrative Kraft von זה, ohne das im Hebräischen nicht ausdrücklich stehende Wort „Mann“ hinzuzufügen.
- source_word: ונאשרנו
  choice: Wir wollen ihn glücklich preisen
  rationale: אשר bezeichnet hier, jemanden glücklich beziehungsweise gesegnet zu nennen. „Wir wollen“ gibt den auffordernden beziehungsweise kohortativen Ton wieder; „glücklich preisen“ ist im modernen Deutsch verständlich und behält den feierlichen Klang.
- source_word: כי
  choice: denn
  rationale: Die Konjunktion leitet die Begründung für die Würdigung ein.
- source_word: הפליא לעשות
  choice: Wunderbares vollbracht
  rationale: Die Verbindung bezeichnet ein außergewöhnliches oder staunenswertes Tun. „Wunderbares vollbracht“ bewahrt den gehobenen Sinn, ohne die Art der Tat näher festzulegen.
- source_word: בעמו
  choice: unter seinem Volk
  rationale: Die Wiedergabe entspricht der örtlich-sozialen Bedeutung der Präposition ב und vermeidet die weitergehende Festlegung, die Taten seien ausdrücklich „für“ sein Volk geschehen.
theological_decisions:
- issue: Starke Abweichung zwischen dem hebräischen Textzeugen und der griechischen Parallele
  choice: Der erhaltene hebräische Text bildet die Grundlage des Haupttextes; die stark abweichende griechische Fassung wird in einer Fußnote dokumentiert.
  alternative: „Ein gebildeter Mann hat vieles erkannt, und wer viel Erfahrung hat, wird Einsicht darlegen.“
  rationale: Wo der hebräische Sirachtext erhalten ist, hat er für diese Übersetzung Vorrang. Die angegebene griechische Parallele entspricht dem hebräischen Satz nicht eng und dürfte eine andere Textform oder Verszuordnung widerspiegeln. Die Abweichung wird daher offengelegt, aber nicht in den Haupttext eingearbeitet.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Formulierung bleibt nahe am hebräischen Satzbau, klingt jedoch natürlich; die textkritische Spannung zur griechischen Überlieferung wird ausdrücklich bewahrt.
