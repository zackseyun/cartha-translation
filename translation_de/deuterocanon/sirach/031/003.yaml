translation:
  language: de
  text: Ein Reicher müht sich ab, Vermögen anzuhäufen; und wenn er ruht, empfängt er Genuss.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „empfängt er Genuss“. תענוג kann auch „Wohlleben“ oder „Luxus“ bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Der hier zugeordnete griechische Paralleltext entspricht dem hebräischen Wortlaut dieses Verses nicht. Die Übersetzung folgt daher dem hebräischen Text.
    reason: textual_variant
lexical_decisions:
- source_word: עמלי עשיר
  choice: Ein Reicher müht sich ab
  rationale: Die hebräische Wendung bezeichnet die Mühe beziehungsweise das angestrengte Arbeiten eines reichen Mannes. Die verbale Wiedergabe ist im modernen Deutschen natürlich und bewahrt den Gedanken des Sichabmühens.
- source_word: לקבץ הון
  choice: Vermögen anzuhäufen
  rationale: לקבץ bedeutet sammeln oder zusammenbringen; zusammen mit הון bezeichnet es das Ansammeln von Vermögen. „Anhäufen“ gibt diesen wirtschaftlichen Zusammenhang prägnant wieder.
- source_word: ינוח
  choice: wenn er ruht
  rationale: Die Form von נוח bezeichnet das Ruhen. Die schlichte Wiedergabe vermeidet die stärkere Deutung „es sich bequem machen“.
- source_word: לקבל תענוג
  choice: findet er Genuss
  rationale: Wörtlich steht „Genuss/Wohlleben empfangen“. „Findet er Genuss“ ist verständliches Deutsch, bleibt nahe am Bild des Empfangens und legt תענוג nicht einseitig auf konkreten Luxus fest.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Parallelismus wird durch das Semikolon sichtbar gemacht; „Genuss“ bewahrt die mögliche Spannweite zwischen Freude, Wohlleben und Luxus.
