  text: Who is this[a], He has been tested in these things and has become complete; and it will be for him a ground for boasting.
translation:
  language: de
  text: Wer ist dieser, der daran festhielt und Frieden hatte und dem es zur Ehre gereichte?[a] Denn bei der Fülle des Friedens seines Lebens wird es dir zur Ehre gereichen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hebräische Wortlaut ist schwierig. Näher am Wortlaut: „Wer ist dieser, der sich daran heftete und Frieden hatte und dem es zur Ehre wurde?“'
    reason: alternative_reading
  - marker: b
    text: 'Die griechische Parallelüberlieferung weicht stark ab: „Wer nicht erprobt wurde, weiß wenig.“ Sie dürfte eine andere Textform widerspiegeln. Auch im Hebräischen ist der Wechsel von „seines“ zu „dir“ auffällig.'
    reason: textual_variant
lexical_decisions:
- source_word: מי הוא זה
  choice: Wer ist es
  rationale: Bewahrt die rhetorische Identifikationsfrage des Hebräischen in natürlichem modernem Deutsch.
- source_word: שנדבק בו
  choice: der daran festhielt
  rationale: דבק bezeichnet ein festes Haften oder Festhalten. Das neutrale „daran“ lässt den im Ausschnitt nicht ausdrücklich genannten Bezug offen.
- source_word: והיה לו שלום
  choice: dabei unversehrt blieb
  rationale: שלום kann Frieden, Wohlergehen oder Unversehrtheit bezeichnen. Im Zusammenhang mit dem Festhalten gibt „unversehrt blieb“ den möglichen Ergebnissinn natürlich wieder, ohne die Vorstellung des Wohlergehens aufzugeben.
- source_word: והיה לו תפארה
  choice: und dadurch Ehre gewann
  rationale: תפארה bezeichnet Herrlichkeit, Ansehen oder Ehre. „Ehre gewann“ gibt die resultative Aussage idiomatisch wieder.
- source_word: כי ברבות שלום חייו
  choice: Denn wenn sein Leben reich an Frieden ist
  rationale: Die hebräische Formulierung ist knapp und syntaktisch schwierig. Diese Wiedergabe erhält „Leben“, „Frieden/Wohlergehen“ und den Gedanken der Fülle, ohne die Unsicherheit durch eine starke Deutung zu verdecken.
- source_word: יהיה לך לתפארת
  choice: wird es dir zur Ehre gereichen
  rationale: Gibt den Wechsel zur zweiten Person sowie die Zweck- oder Ergebnisformulierung mit לתפארת wieder.
- source_word: ὃς οὐκ ἐπειράθη ὀλίγα οἶδεν
  choice: Wer nicht erprobt wurde, weiß wenig
  rationale: Die abweichende griechische Parallele wird in der Fußnote eng am Wortlaut wiedergegeben; ἐπειράθη bezeichnet hier Erprobung oder Erfahrung.
theological_decisions:
- issue: Stark voneinander abweichende hebräische und griechische Überlieferung
  choice: Der Haupttext folgt dem erhaltenen hebräischen Wortlaut und bewahrt dessen schwierige zweite Zeile; die griechische Parallele wird als Textvariante in einer Fußnote dokumentiert.
  alternative: 'Eine eklektische Haupttextfassung mit dem griechischen Motiv der Erprobung oder eine vollständig griechisch basierte Wiedergabe: „Wer nicht erprobt wurde, weiß wenig.“'
  rationale: Da der hebräische Text mit hoher Zuverlässigkeit als Ausgangszeugnis vorliegt, sollte seine konkrete Aussage nicht stillschweigend durch die deutlich anderslautende griechische Parallele ersetzt werden. Die Fußnoten machen sowohl die sprachliche Schwierigkeit als auch die Textdifferenz transparent.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Haupttext ist lesbar formuliert, lässt aber den ungenannten Bezug von בו („daran“) offen und bewahrt den auffälligen Wechsel von „sein“ zu „dir“. Die Unsicherheit der hebräischen Syntax und die erhebliche griechische Abweichung werden nicht harmonisiert, sondern in den Fußnoten offengelegt.
