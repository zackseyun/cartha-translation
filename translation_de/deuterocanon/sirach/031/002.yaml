translation:
  language: de
  text: Wie jemand, der nach einem Schatten greift und dem Wind nachjagt, so ist, wer sich an Träume hält.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der an dieser Stelle zugeordnete erhaltene hebräische Text bietet einen erheblich abweichenden Wortlaut: „Ein treuer Freund vertreibt Schande, und wer ein Geheimnis bewahrt, ist ein Freund wie man selbst.“ Da der hebräische und der griechische Zeuge an dieser Versstelle nicht übereinstimmen, folgt der Haupttext für 31,2 dem griechischen Zeugen.'
    reason: textual_variant
  - marker: b
    text: 'Oder: „wer auf Träume achtet“ beziehungsweise „wer an Träumen festhält“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δρασσόμενος
  choice: nach … greift
  rationale: Das Partizip bezeichnet den Versuch, etwas zu ergreifen. „Nach einem Schatten greift“ bewahrt das Bild einer vergeblichen, auf etwas Unfassbares gerichteten Handlung.
- source_word: σκιᾶς
  choice: einem Schatten
  rationale: „Schatten“ ist die naheliegende Bedeutung und vermittelt die Unfassbarkeit des Bildes.
- source_word: διώκων
  choice: nachjagt
  rationale: Das Verb bezeichnet ein aktives Verfolgen. „Nachjagt“ klingt im Deutschen natürlich und hält die fortdauernde, vergebliche Bewegung fest.
- source_word: ἄνεμον
  choice: dem Wind
  rationale: Die bestimmte Form ist im Deutschen in diesem sprichwörtlichen Bild idiomatisch und lässt den Wind als nicht greifbares Ziel erscheinen.
- source_word: ὁ ἐπέχων
  choice: wer sich … hält
  rationale: ἐπέχω kann „festhalten“, „sich an etwas halten“ oder „auf etwas achten“ bedeuten. Die Formulierung wahrt die Vorstellung einer Bindung an Träume, ohne ausdrücklich „vertrauen“ einzutragen.
- source_word: ἐνυπνίοις
  choice: an Träume
  rationale: Der Plural bezeichnet Träume beziehungsweise Traumgesichte. „Träume“ ist allgemeinverständlich und vermeidet eine unnötige Präzisierung.
theological_decisions:
- issue: Auswahl der Textgrundlage bei erheblicher Abweichung zwischen hebräischem und griechischem Zeugen
  choice: Der Haupttext folgt für Sirach 31,2 dem griechischen Text mit dem Vergleich von Schatten, Wind und Träumen; die erhebliche Abweichung des zugeordneten hebräischen Zeugen wird in einer Fußnote offengelegt.
  alternative: Den abweichenden hebräischen Wortlaut als Haupttext wiedergeben.
  rationale: Der vorliegende hebräische Text entspricht inhaltlich nicht dem griechischen Vers in dieser Referenzzählung und ist als „major_mismatch“ gekennzeichnet. Daher bietet der griechische Zeuge hier die sachlich vertretbare Grundlage für den Haupttext; die Textunsicherheit darf jedoch nicht verschwiegen werden.
- issue: Bedeutungsumfang von ἐπέχω
  choice: „sich an Träume halten“
  alternative: „auf Träume achten“ oder „an Träumen festhalten“
  rationale: Die gewählte Wendung bewahrt die Mehrdeutigkeit zwischen Beachtung und Festhalten weitgehend und vermeidet es, ausdrücklich eine theologische Aussage über Vertrauen oder Offenbarung einzuführen.
translation_notes:
  register: Modernes, allgemeinverständliches Standarddeutsch mit würdig-sprichwörtlichem Klang. Die Satzstellung wurde gegenüber dem Griechischen umgekehrt, damit der Vergleich im Deutschen flüssig und eindeutig bleibt; die Bildfolge und die Aussage wurden bewahrt.
