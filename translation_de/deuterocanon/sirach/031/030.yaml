translation:
  language: de
  text: Höre, mein Sohn, und verachte mich nicht; am Ende wirst du meine Worte begreifen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die für diesen Vers angegebene griechische Parallelquelle bietet einen völlig anderen Spruch: „Wer sich von der Berührung eines Toten gewaschen hat und ihn dann wieder berührt – was hat ihm sein Waschen genützt?“ Offenbar liegt eine erhebliche Abweichung der Verszuordnung oder der Textüberlieferung vor. Der Haupttext folgt dem erhaltenen hebräischen Zeugen.'
    reason: textual_variant
lexical_decisions:
- source_word: שמע
  choice: Höre
  rationale: Der Imperativ fordert zum aufmerksamen Hören auf. „Höre“ bleibt nahe am Hebräischen, ohne wie „gehorche“ bereits eine Folgerung vorwegzunehmen.
- source_word: בני
  choice: mein Sohn
  rationale: Das Hebräische ist ausdrücklich maskulin, Singular und als Anrede formuliert.
- source_word: תבוז
  choice: verachte
  rationale: Das Verb bezeichnet geringschätziges oder verächtliches Behandeln; „verachte“ gibt die Stärke der Mahnung angemessen wieder.
- source_word: ובאחרית
  choice: am Ende
  rationale: Die Wendung bezeichnet den späteren Ausgang oder das schließliche Ergebnis und wird im Deutschen natürlich mit „am Ende“ wiedergegeben.
- source_word: תשיג
  choice: wirst du … begreifen
  rationale: Das Verb kann „erreichen/erlangen“ bedeuten und bezeichnet bei „meine Worte“ sinngemäß das geistige Erfassen. „Begreifen“ bewahrt im Deutschen sowohl die Vorstellung des Erfassens als auch den Sinn des Verstehens.
- source_word: אמרי
  choice: meine Worte
  rationale: Die schlichte Wiedergabe entspricht dem hebräischen Ausdruck und wahrt den würdigen, direkten Ton.
theological_decisions:
- issue: Starke Abweichung zwischen dem hebräischen Hauptzeugen und der griechischen Parallelquelle
  choice: Der Haupttext folgt dem erhaltenen hebräischen Ben-Sira-Text; die völlig andere griechische Fassung wird in einer Fußnote dokumentiert.
  alternative: 'Dem griechischen Text folgen: „Wer sich wegen eines Toten gewaschen hat und ihn dann wieder berührt – was hat ihm sein Waschen genützt?“'
  rationale: Wo ein hebräischer Sirach-Text erhalten ist, hat er für diese Übersetzung Vorrang. Der griechische Text bietet hier keine geringfügige Variante, sondern einen anderen Spruch, was wahrscheinlich auf eine abweichende Verszuordnung oder Textüberlieferung hinweist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter weisheitlicher Anrede. Die Satzstruktur bleibt eng am Hebräischen; „begreifen“ gibt die Bedeutungsnähe von Erreichen und Verstehen idiomatisch wieder.
