  text: Be the first to stop[a], for the sake of good manners, and do not be a glutton[b], lest you be despised.
translation:
  language: de
  text: Hör als Erster auf, aus Anstand[a], und sei kein Vielfraß[b], damit man dich nicht verachtet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische מוסר bedeutet häufig „Zucht“, „Unterweisung“ oder „Disziplin“; im Zusammenhang des Tischverhaltens ist hier wahrscheinlich angemessenes Benehmen, also „Anstand“, gemeint.
    reason: lexical_alternative
  - marker: b
    text: 'Der hebräische Text dieses Verses ist erhalten, doch die bereitgestellten Quelldaten weisen eine erhebliche Abweichung auf: Die angeführte griechische Parallele entspricht nicht dieser hebräischen Zeile. Die Übersetzung folgt daher dem hebräischen Text als Hauptzeugen und vermerkt die Unstimmigkeit.'
    reason: textual_variant
lexical_decisions:
- source_word: חדל
  choice: Hör … auf
  rationale: Der Imperativ fordert im Zusammenhang des Gastmahls dazu auf, das Essen zu beenden; „aufhören“ ist dafür im modernen Deutsch natürlich.
- source_word: ראשון
  choice: als Erster
  rationale: 'Das Wort wird prädikativ beziehungsweise adverbial verstanden: Der Angesprochene soll vor den anderen mit dem Essen aufhören.'
- source_word: בעבור
  choice: um … willen
  rationale: Die Präposition bezeichnet hier den Beweggrund des geforderten Verhaltens und bewahrt den knappen, mahnenden Ton.
- source_word: מוסר
  choice: gute Sitten
  rationale: מוסר kann „Zucht“, „Unterweisung“ oder „Disziplin“ bedeuten; im Zusammenhang des Tischverhaltens bezeichnet es wahrscheinlich angemessenes, wohlerzogenes Benehmen.
- source_word: גרגרן
  choice: Vielfraß
  rationale: Das Substantiv bezeichnet einen gierigen Esser. „Vielfraß“ ist knapp, verständlich und bringt die negative moralische Wertung zum Ausdruck.
- source_word: פן
  choice: damit … nicht
  rationale: Die Warnpartikel leitet eine zu vermeidende Folge ein; diese Konstruktion ist im heutigen Deutsch natürlicher als „auf dass nicht“.
- source_word: תמאס
  choice: man dich verachtet
  rationale: Die Form von מאס kann Ablehnung, Verachtung oder Widerwillen ausdrücken. Die unpersönliche aktive Wiedergabe ist im Deutschen natürlich und erhält die soziale Folge des gierigen Verhaltens.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Mahnrede. „Gute Sitten“ wahrt den ethischen und gesellschaftlichen Gehalt von מוסר, ohne ihn auf bloße Etikette zu verengen; „Vielfraß“ erhält die prägnante negative Wertung des Hebräischen.
