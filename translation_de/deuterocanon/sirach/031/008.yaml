  text: Blessed is the man who is found blameless[b][a], and who has not gone astray after wealth.
translation:
  language: de
  text: Glücklich ist der Mann, der sich als untadelig erweist[a] und der im Umgang mit Reichtum nicht in die Irre gegangen ist[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hier mit »untadelig« wiedergegebene hebräische Wort bezeichnet sittliche Lauterkeit, nicht sündlose Vollkommenheit.
    reason: lexical_clarification
  - marker: b
    text: 'Der hebräische Wortlaut des zweiten Satzteils ist schwierig. Wahrscheinlich ist gemeint, dass der Mann im Verhältnis zum Reichtum nicht abgeirrt ist; möglich ist auch: »der dem Reichtum nicht nachgeirrt ist« oder »der sich nicht durch Geld auf Abwege bringen ließ«. Der griechische Paralleltext weicht erheblich ab: Er spricht von der Erfüllung des Gesetzes und von Weisheit in einem treuen Mund.'
    reason: textual_variant
lexical_decisions:
- source_word: אשרי
  choice: Glücklich ist
  rationale: Die übliche Weisheits- und Seligpreisungsformel wird in natürlichem, gehobenem Deutsch wiedergegeben; sie bezeichnet einen beglückwünschenswerten Zustand, nicht bloß ein Gefühl.
- source_word: איש
  choice: der Mann
  rationale: Das hebräische Substantiv steht ausdrücklich im maskulinen Singular; die Übersetzung bewahrt diese Form.
- source_word: נמצא
  choice: sich … erweist
  rationale: Gibt den passiven, prüfenden Sinn von »als etwas befunden werden« idiomatisch wieder.
- source_word: תמים
  choice: untadelig
  rationale: Bezeichnet hier sittliche Lauterkeit und Integrität, nicht metaphysische oder sündlose Vollkommenheit.
- source_word: ויחר ממון
  choice: im Streben nach Reichtum
  rationale: Die überlieferte Wortfolge ist schwierig. Die Wiedergabe bringt die wahrscheinlich gemeinte Beziehung zum Reichtum zum Ausdruck, ohne sie als Besitz an sich zu verurteilen.
- source_word: לא נלוז
  choice: nicht vom rechten Weg abgewichen ist
  rationale: Das Verb bezeichnet ein Abweichen oder Sich-verkehren; das Bild vom rechten Weg macht den ethischen Sinn im Deutschen verständlich.
theological_decisions:
- issue: Schwierige hebräische Formulierung über das Verhältnis zum Reichtum
  choice: im Streben nach Reichtum nicht vom rechten Weg abgewichen
  alternative: sich nicht durch Geld auf Abwege bringen lassen; dem Reichtum nicht nachirren
  rationale: Der erhaltene hebräische Text verbindet »Reichtum« mit »nicht abgewichen«, lässt die genaue syntaktische Beziehung jedoch offen. Die Übersetzung wahrt den Kern einer sittlichen Bewährung im Verhältnis zum Reichtum und kennzeichnet die Unsicherheit in der Fußnote.
- issue: Stark abweichender griechischer Paralleltext
  choice: Dem erhaltenen hebräischen Wortlaut folgen
  alternative: Den griechischen Paralleltext übersetzen, der von Gesetz, Weisheit und einem treuen Mund spricht
  rationale: Der griechische Paralleltext stimmt in diesem Vers nicht hinreichend mit dem erhaltenen Hebräisch überein. Da das hebräische Zeugnis hier als Ausgangstext vorliegt, wird es übersetzt; die erhebliche Abweichung wird transparent vermerkt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch in der knappen Form eines Weisheitsspruchs. »Sich als untadelig erweisen« bewahrt den prüfenden Charakter von נמצא; die zweite Klausel ist wegen des schwierigen hebräischen Textes bewusst nicht dogmatisch zugespitzt.
