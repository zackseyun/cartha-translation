  text: Even if you sit among many[b][a], do not reach out your hand before your companion.
translation:
  language: de
  text: Auch wenn du unter vielen sitzt,[a][b] streck deine Hand nicht vor deinem Tischgenossen aus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das heißt: Greif bei Tisch nicht vor einem anderen nach dem Essen.'
    reason: cultural_note
  - marker: b
    text: Die griechische Parallelüberlieferung weicht hier stark ab und spricht davon, dass „der Spott der Gesetzlosen“ keinen Beifall findet. Der Haupttext folgt daher dem hebräischen Textzeugen.
    reason: textual_variant
lexical_decisions:
- source_word: וגם אם
  choice: Auch wenn
  rationale: Gibt die konzessive Bedingung im modernen Deutschen natürlich wieder.
- source_word: בין רבים
  choice: unter vielen
  rationale: Bleibt eng am Hebräischen und setzt zwar eine größere Tischgemeinschaft voraus, ohne sie ausdrücklich in den Text einzutragen.
- source_word: ישבת
  choice: du sitzt
  rationale: Das hebräische Perfekt hat hier in einer allgemeinen Verhaltensanweisung gegenwärtige beziehungsweise situationsbezogene Geltung.
- source_word: לפני
  choice: vor
  rationale: Bewahrt die mögliche räumliche Bildlichkeit und drückt im Zusammenhang zugleich den zeitlichen Vorrang beim Zugreifen aus.
- source_word: רע
  choice: deinem Tischgenossen
  rationale: רע bezeichnet hier den Mitmenschen oder Gefährten; aufgrund des klaren Mahlkontexts macht „Tischgenosse“ die gemeinte Beziehung idiomatisch verständlich, ohne eine besondere Nähe zu unterstellen.
- source_word: אל תושיט יד
  choice: streck deine Hand nicht … aus
  rationale: Eine natürliche, bildhafte Wiedergabe des Verbots; gemeint ist wahrscheinlich, beim Essen nicht vor dem anderen zuzugreifen.
