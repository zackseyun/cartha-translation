  text: For it is a stumbling block to a fool[a], and every simpleton is ensnared by it.
translation:
  language: de
  text: Denn für einen Toren ist es ein Stolperstein,[a] und jeder Leichtgläubige verfängt sich darin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Paralleltext lautet: »Denn Träume haben viele irregeführt, und wer auf sie hoffte, kam zu Fall.« Der hebräische und der griechische Textzeuge weichen hier erheblich voneinander ab.'
    reason: alternative_reading
lexical_decisions:
- source_word: תקלה
  choice: Stolperstein
  rationale: Bewahrt das konkrete Bild eines Hindernisses, an dem jemand zu Fall kommt, und zugleich den Gedanken sittlicher Gefahr.
- source_word: אויל
  choice: Tor
  rationale: Ein geläufiger Begriff der biblischen Weisheitsliteratur für einen Menschen, dem es an Einsicht und sittlichem Urteilsvermögen fehlt.
- source_word: פותה
  choice: Leichtgläubiger
  rationale: Gibt die leicht verführbare, unerfahrene Person natürlicher und präziser wieder als das im heutigen Deutsch abwertend oder sonderbar klingende »Einfältiger«.
- source_word: יוקש
  choice: verfängt sich
  rationale: Erhält das Bild des Fangens in einer Schlinge oder Falle in idiomatischem modernem Deutsch.
- source_word: בו
  choice: darin
  rationale: Bezieht das Suffix natürlich auf die im Kontext vorausgesetzte Sache zurück, ohne deren nicht ausdrücklich genannten Bezug festzulegen.
theological_decisions:
- issue: Erhebliche Abweichung zwischen hebräischem und griechischem Textzeugen
  choice: Der Haupttext folgt dem erhaltenen Hebräisch; die wesentlich andere griechische Fassung wird in einer Fußnote dokumentiert.
  alternative: »Denn Träume haben viele irregeführt, und wer auf sie hoffte, kam zu Fall.«
  rationale: Wo ein hebräischer Text Sirachs erhalten ist, hat er für die Übersetzung Vorrang. Die griechische Zeile behandelt Träume und ist keine bloße Wortvariante, sondern eine substanziell andere Überlieferung; deshalb darf die Differenz weder harmonisiert noch verschwiegen werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter Weisheitssprache. »Tor« und »Stolperstein« erhalten den biblischen Ton; »Leichtgläubiger« und »verfängt sich« sorgen für unmittelbare Verständlichkeit. Das ungenannte Bezugswort von »es/darin« bleibt wie im hebräischen Vers vom Kontext abhängig.
