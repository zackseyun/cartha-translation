  yaml_path: translation/deuterocanon/sirach/031/026.yaml
  text: Years of life are with a discerning man[a]; he will lie down until morning[b], and his life is with him.
translation:
  language: de
  text: Lebensjahre sind bei einem einsichtigen Mann; er verbringt die Nacht bis zum Morgen, und sein Leben ist bei ihm.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort נפש kann je nach Zusammenhang „Leben“, „Selbst“ oder „Seele“ bedeuten. Wörtlicher ließe sich der Schluss auch mit „und sein Leben ist bei ihm“ oder „und seine Seele ist bei ihm“ wiedergeben.
    reason: lexical_alternative
  - marker: b
    text: 'Der griechische Paralleltext weicht stark ab und lautet sinngemäß: „Wer seinem Nächsten den Lebensunterhalt nimmt, tötet ihn.“ Offenbar liegt ihm eine andere Textform zugrunde; der Haupttext folgt deshalb dem erhaltenen hebräischen Zeugen.'
    reason: textual_variant
lexical_decisions:
- source_word: שנות חיים
  choice: Lebensjahre
  rationale: Die knappe Wiedergabe bewahrt die hebräische Verbindung „Jahre des Lebens“, ohne sie ausdrücklich als Verheißung eines langen Lebens auszulegen.
- source_word: איש נבון
  choice: ein einsichtiger Mann
  rationale: נבון bezeichnet einen Menschen mit Einsicht und Unterscheidungsvermögen. „Einsichtig“ ist im heutigen Deutsch natürlich und enger am Ausdruck als das allgemeinere „weise“.
- source_word: ילין עד בקר
  choice: er verbringt die Nacht bis zum Morgen
  rationale: Das Verb לין bezeichnet das Übernachten beziehungsweise Verweilen über Nacht. Die Wiedergabe macht den nächtlichen Zeitraum deutlich, ohne die mögliche Nuance einer Herberge künstlich hervorzuheben.
- source_word: ונפשו עמו
  choice: und sein Leben bleibt bei ihm
  rationale: נפש kann hier Leben, Selbst oder Seele bezeichnen. Im Zusammenhang mit Lebensjahren und dem Erreichen des Morgens gibt „Leben“ den wahrscheinlichsten Sinn wieder; „bleibt“ macht die im Deutschen sonst schwer verständliche Aussage „ist bei ihm“ idiomatisch, ohne sie zu einer ausdrücklichen Lehraussage über die Seele zu machen.
- source_word: φονεύων τὸν πλησίον ὁ ἀφαιρούμενος συμβίωσιν
  choice: nur als abweichender Kontrollzeuge berücksichtigt
  rationale: Der angeführte griechische Paralleltext weicht grundlegend vom erhaltenen hebräischen Text ab. Daher bestimmt er nicht den Haupttext, wird aber in einer Fußnote dokumentiert.
theological_decisions:
- issue: Bedeutung von נפש in der Aussage über den Menschen
  choice: „Leben“ als kontextuelle Hauptbedeutung
  alternative: „Seele“ oder „Selbst“
  rationale: Der Ausdruck lässt mehrere anthropologische Bedeutungen zu. „Leben“ passt zum unmittelbaren Zusammenhang, während die Fußnote die weitere Bedeutungsbreite offenhält und keine dualistische Deutung festschreibt.
- issue: Starke Abweichung zwischen hebräischem und griechischem Textzeugen
  choice: Der erhaltene hebräische Text bildet den Haupttext.
  alternative: Die griechische Aussage über den Entzug des Lebensunterhalts als Haupttext übersetzen.
  rationale: Da ein zuverlässiger hebräischer Zeuge vorliegt, erhält er Vorrang. Die erheblich abweichende griechische Textform wird transparent vermerkt, statt mit dem Hebräischen harmonisiert zu werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Vers bleibt in seiner sprichwortartig knappen und teilweise rätselhaften Form erhalten. „Einsichtig“ wahrt die Nuance von נבון; die männliche Einzahl des hebräischen איש wird als „Mann“ wiedergegeben.
