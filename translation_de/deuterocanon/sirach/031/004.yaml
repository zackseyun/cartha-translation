  source_fidelity: 'Die Übersetzung vermischt die beiden in der hebräischen Vorlage aufgeführten abweichenden Fassungen: „bis seine Kraft schwindet“ folgt der zweiten Fassung (לחסר כחו), während „bleibt er bedürftig“ die Aussage der ersten Fassung (יהיה צריך) aufnimmt. Die zweite Fassung lautet am Schluss vielmehr „wenn er ruht, hat/findet er keine Ruhe“ (לא נחה לו). Der revidierte Haupttext gibt diese in sich geschlossene Fassung wieder; die abweichende hebräische Lesart und die völlig abweichende griechische Parallelfassung werden in der Anmerkung transparent gemacht.'
  naturalness: „Ein Armer arbeitet, bis seine Kraft nachlässt; und wenn er ruht, findet er keine Ruhe“ ist idiomatisches modernes Standarddeutsch und bewahrt den knappen, paradoxen Weisheitsspruch. „Findet er keine Ruhe“ gibt die Wiederholung von „ruht/Ruhe“ sinnvoll wieder.
  terminology: „Armer“ entspricht עני. „Arbeitet“ und „seine Kraft nachlässt“ geben עמל und לחסר כחו nüchtern wieder. Die Formulierung „findet er keine Ruhe“ entspricht לא נחה לו, ohne die Aussage zu einer wirtschaftlichen Bedürftigkeit umzudeuten.
