translation:
  language: de
  text: Ein Armer arbeitet, bis seine Kraft nachlässt; und wenn er ruht, findet er keine Ruhe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die hebräische Überlieferung bietet hier abweichende Fassungen. Eine andere Lesart erwähnt das Haus des Armen und schließt: „Wenn er ruht, wird er bedürftig.“ Die griechische Fassung überliefert an dieser Stelle einen ganz anderen Spruch.'
    reason: Die Anmerkung kennzeichnet die erhebliche Differenz innerhalb der hebräischen Überlieferung sowie die abweichende griechische Parallelüberlieferung. Der Haupttext folgt durchgehend der Lesart „bis seine Kraft nachlässt … findet er keine Ruhe“.
lexical_decisions:
- source_word: עמל עני / יגע עני
  choice: Ein Armer müht sich ab
  rationale: Beide überlieferten hebräischen Fassungen beschreiben die anstrengende Arbeit des Armen. „Sich abmühen“ gibt יגע beziehungsweise עמל natürlich und würdevoll wieder.
- source_word: לחסר כחו
  choice: bis seine Kraft schwindet
  rationale: Wörtlich bezeichnet die Wendung ein Verringern seiner Kraft. Die deutsche Fassung bewahrt den Sinn körperlicher Erschöpfung, ohne ein vollständiges Aufbrauchen stärker zu behaupten, als der hebräische Wortlaut verlangt.
- source_word: יהיה צריך
  choice: bleibt er bedürftig
  rationale: צריך bezeichnet hier das Angewiesensein beziehungsweise den fortbestehenden Mangel. „Bedürftig“ passt zum Armen und drückt aus, dass Ruhe seine Not nicht behebt.
theological_decisions:
- issue: Aussage über Arbeit, Ruhe und Armut
  choice: 'Die Spannung bleibt bestehen: Arbeit zehrt an der Kraft, Ruhe lässt die Bedürftigkeit fortbestehen.'
  alternative: Den Vers als moralischen Tadel von Faulheit oder als Verheißung deuten, dass Fleiß Armut beendet.
  rationale: Der hebräische Text beschreibt die bedrängende Lage des Armen, ohne ausdrücklich Schuld zuzuschreiben oder eine Lehrentscheidung über Armut und Arbeit zu treffen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit ruhigem, weisheitlichem Ton. Der Satz ist knapp und parallel gebaut; „doch“ wurde vermieden, da „bleibt“ den Gegensatz bereits natürlich ausdrückt.
