translation:
  language: de
  text: Verstehe deinen Nächsten wie dich selbst[a][b], und bedenke alles, was dir verhasst ist[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Paralleltext weicht erheblich ab und lautet ungefähr: „Wem gilt seine Aufmerksamkeit? Und was ist seine Stütze?“ Wo ein hebräischer Text erhalten ist, folgt diese Übersetzung hier dem hebräischen Zeugen.'
    reason: textual_variant
  - marker: b
    text: 'Oder: „Kenne deinen Nächsten wie dein eigenes Selbst.“ Das hebräische נפש kann „Seele“, „Leben“, „Person“ oder „Selbst“ bedeuten.'
    reason: lexical_alternative
  - marker: c
    text: 'Der Schlusssatz kann auch verstanden werden: „Und denke bei allem, was du hasst, gründlich nach.“ Darin kann der ethische Maßstab anklingen, anderen nicht zuzufügen, was man selbst nicht erleiden möchte.'
    reason: alternative_reading
lexical_decisions:
- source_word: דעה
  choice: Verstehe
  rationale: 'Der Imperativ von ידע bezeichnet hier mehr als bloßes Faktenwissen: Er fordert verständnisvolle Wahrnehmung des Mitmenschen. „Verstehe“ gibt diesen ethischen Sinn natürlich wieder, ohne den Wortlaut an das geläufigere Gebot „Liebe deinen Nächsten“ anzugleichen.'
- source_word: רעך
  choice: deinen Nächsten
  rationale: רע bezeichnet einen Mitmenschen oder Gefährten im sozialen Umfeld. „Deinen Nächsten“ bewahrt den biblisch-ethischen Klang, ohne den Ausdruck auf räumliche Nachbarschaft zu beschränken.
- source_word: כנפשך
  choice: wie dich selbst
  rationale: נפש kann Seele, Leben, Person oder Selbst bezeichnen. In dieser Vergleichsformel ist „wie dich selbst“ im Deutschen idiomatisch und gibt den Bezug auf die eigene Person treffend wieder.
- source_word: ובכל ששנאת
  choice: und alles, was dir verhasst ist
  rationale: Die Formulierung bezeichnet umfassend das, was der angesprochenen Person zuwider ist. „Dir verhasst ist“ wahrt den persönlichen Bezug und klingt im Deutschen natürlicher als eine streng temporale Wiedergabe mit „was du gehasst hast“.
- source_word: התבונן
  choice: bedenke
  rationale: Der Imperativ fordert prüfendes, aufmerksames Nachdenken. „Bedenke“ ist knapp, würdig und lässt offen, wie die Überlegung anschließend ins Handeln umgesetzt wird.
- source_word: τίνι ἐπέχει; καὶ τίς ἀντιστήριγμα αὐτοῦ;
  choice: nur als Kontrollzeuge berücksichtigt
  rationale: Der griechische Paralleltext weicht in Wortlaut und Sinn erheblich vom erhaltenen Hebräisch ab. Da hier ein hebräischer Textzeuge vorliegt, folgt der Haupttext diesem und dokumentiert die griechische Abweichung in einer Fußnote.
theological_decisions:
- issue: Verhältnis zum bekannten Gebot „Liebe deinen Nächsten wie dich selbst“
  choice: Die Erkenntnis- beziehungsweise Verstehenssprache des hebräischen Textes wird beibehalten.
  alternative: Liebe deinen Nächsten wie dich selbst.
  rationale: Im hebräischen Text steht ידע und kein ausdrückliches Verb des Liebens. Die eigenständige ethische Akzentsetzung darf nicht an eine vertrautere biblische Formel angeglichen werden.
- issue: Ethische Funktion des Schlusssatzes
  choice: Die Aufforderung zum prüfenden Bedenken dessen, was einem selbst verhasst ist, bleibt allgemein formuliert.
  alternative: Tu deinem Nächsten nicht an, was du selbst hasst.
  rationale: Eine negative Goldene Regel kann als Sinn mitschwingen, wird im hebräischen Wortlaut jedoch nicht ausdrücklich als Handlungsverbot formuliert. Die Übersetzung wahrt diese Spannung.
translation_notes:
  register: Modernes Standarddeutsch in knapper, würdiger Weisheitssprache. „Verstehe“ vermeidet sowohl eine Harmonisierung mit „Liebe“ als auch das im Deutschen missverständliche bloße „Kenne“. Der Schlusssatz bleibt bewusst offen und wird nicht zu einer ausdrücklich formulierten Goldenen Regel erweitert.
