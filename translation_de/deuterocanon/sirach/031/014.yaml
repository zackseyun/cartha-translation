  text: Do not say[a], “It is enough for him”[b]; remember that an evil eye is evil.
translation:
  language: de
  text: 'Sag nicht: »Es ist genug für ihn.« Denk daran: Ein böses Auge[a] ist böse.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die hebräische Redewendung „böses Auge“ bezeichnet gewöhnlich eine geizige, missgünstige oder neidische Haltung.
    reason: lexical_alternative
  - marker: b
    text: 'Die für diese Versangabe überlieferte griechische Parallele lautet: „Der Geist derer, die den Herrn fürchten, wird leben.“ Sie stimmt nicht mit dem hebräischen Wortlaut überein und gehört wahrscheinlich zu einer anderen Textzuordnung oder Verszählung.'
    reason: textual_variant
lexical_decisions:
- source_word: אל תאמר
  choice: Sag nicht
  rationale: Der verneinte Imperativ von אמר wird unmittelbar und in natürlichem modernem Deutsch wiedergegeben.
- source_word: ספוק
  choice: es ist genug
  rationale: Das Wort bezeichnet Genügen oder Ausreichen. Die Satzform ist im Deutschen idiomatisch und bewahrt die knappe Aussage des Hebräischen.
- source_word: עליו
  choice: für ihn
  rationale: Die Präposition mit maskulinem Singularsuffix bezieht sich hier am ehesten auf einen anderen Menschen, wohl einen Tischgenossen oder Empfänger.
- source_word: זכור
  choice: Denk daran
  rationale: Der Imperativ wird direkt bewahrt; „Denk daran“ klingt im gegenwärtigen Deutsch natürlicher als das isolierte „Erinnere dich“.
- source_word: רעה עין רעה
  choice: Ein böses Auge ist böse
  rationale: Die konkrete hebräische Redewendung und die pointierte Wiederholung von רעה bleiben sichtbar; eine Fußnote erläutert den gemeinten missgünstigen oder geizigen Charakter.
theological_decisions:
- issue: Hebräische Redewendung „böses Auge“
  choice: Die konkrete Wendung im Haupttext beibehalten
  alternative: „Geiz“, „Missgunst“ oder „ein missgünstiger Blick“
  rationale: Die Formulierung ist sprichwörtlich und kann Geiz, Neid oder eine missgünstige Haltung bezeichnen. Die konkrete Bildsprache bewahrt die Mehrdeutigkeit, während die Fußnote den Bedeutungsbereich erklärt.
- issue: Starke Abweichung zwischen hebräischem Text und griechischer Parallele
  choice: Den erhaltenen hebräischen Text übersetzen und die Abweichung in einer Fußnote ausweisen
  alternative: 'Der griechischen Parallele folgen: „Der Geist derer, die den Herrn fürchten, wird leben“'
  rationale: Für Jesus Sirach hat der erhaltene hebräische Text Vorrang. Die griechische Zeile entspricht diesem Wortlaut nicht und beruht wahrscheinlich auf einer abweichenden Textzuordnung oder Verszählung.
translation_notes:
  register: Moderne, würdige Standardsprache mit knapper sprichwörtlicher Struktur. Die ungewöhnliche Wendung „böses Auge“ bleibt aus Quellentreue stehen und wird erläutert.
