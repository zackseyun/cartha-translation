translation:
  language: de
  text: Ein missgünstiger Mensch[a] hasst Gott, und nichts Schlimmeres als ihn hat er erschaffen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „ein böses Auge“. Das ist eine hebräische Redewendung für einen geizigen, neidischen oder missgünstigen Menschen.'
    reason: lexical_alternative
  - marker: b
    text: 'Die griechische Überlieferung bietet hier einen völlig anderen Satz: „Denn ihre Hoffnung richtet sich auf den, der sie rettet.“ Offenbar liegt ihr eine erheblich abweichende Textform zugrunde.'
    reason: textual_variant
lexical_decisions:
- source_word: רע עין
  choice: ein missgünstiger Mensch
  rationale: Die wörtliche Wendung „böses Auge“ ist im Hebräischen ein Idiom für einen geizigen, neidischen oder anderen etwas missgönnenden Menschen. Die sinngemäße Wiedergabe ist im modernen Deutschen unmittelbar verständlich.
- source_word: שונא
  choice: hasst
  rationale: Das Partizip bezeichnet hier unmittelbar das Hassen; als Subjekt wird entsprechend der hebräischen Wortfolge der zuvor genannte missgünstige Mensch verstanden.
- source_word: אל
  choice: Gott
  rationale: אל bezeichnet hier am natürlichsten Gott und nicht allgemein einen Mächtigen.
- source_word: ורע ממנו לא ברא
  choice: und er hat nichts Schlimmeres als ihn erschaffen
  rationale: Die knappe hebräische Formulierung wird als Schöpfungsaussage mit Gott als unausgesprochenem Subjekt verstanden. Das maskuline Pronomen „ihn“ greift den missgünstigen Menschen auf, ohne die im Hebräischen vorhandene Kürze vollständig aufzulösen.
theological_decisions:
- issue: Subjekt und Sinn des ersten Satzteils angesichts der stark abweichenden griechischen Überlieferung
  choice: 'Der erhaltene hebräische Text wird als Haupttext übersetzt: „Ein missgünstiger Mensch hasst Gott“'
  alternative: 'Die griechische Fassung lautet sinngemäß: „Denn ihre Hoffnung richtet sich auf den, der sie rettet.“'
  rationale: Da der hebräische Text hier erhalten und mit hoher Sicherheit bezeugt ist, bildet er die Grundlage. Die griechische Zeile ist keine bloße Übersetzungsvariante, sondern vertritt offenbar eine erheblich andere Textform und wird deshalb in einer Fußnote dokumentiert.
- issue: Unausgesprochenes Subjekt von ברא
  choice: 'Gott ist das Subjekt: „er hat ... erschaffen“'
  alternative: 'Unpersönlich/passiv: „Nichts Schlimmeres als er wurde erschaffen“'
  rationale: Das Verb ברא wird typischerweise für göttliches Schaffen gebraucht, doch die knappe Syntax lässt formal auch eine unpersönliche deutsche Wiedergabe zu. Die gewählte Form wahrt den wahrscheinlichsten Zusammenhang mit „Gott“ im ersten Satzteil.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das für heutige Leser missverständliche Idiom „böses Auge“ wird im Haupttext sinngemäß wiedergegeben und in der Fußnote wörtlich offengelegt. Die ungewöhnlich scharfe Aussage des hebräischen Textes bleibt erhalten; die starke griechische Abweichung wird transparent dokumentiert.
