  text: Therefore hold fast to his goodness[a], and the assembly will recount his praise. Bread is instruction[c][b], and wine with it.
translation:
  language: de
  text: 'Darum halte an seiner Güte[b] fest, und die Versammlung wird sein Lob verkünden.[a] Unterweisung: Brot und Wein zusammen.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Text bietet eine erheblich andere Lesart: „Vieles habe ich auf meinen Irrfahrten gesehen, und meine Einsicht ist größer als meine Worte.“ Die hebräischen und griechischen Textzeugen weichen hier stark voneinander ab.'
    reason: textual_variant
  - marker: b
    text: 'Oder: „seiner Wohltätigkeit“ beziehungsweise „seiner Großzügigkeit“.'
    reason: lexical_alternative
  - marker: c
    text: 'Die Schlussfügung ist sprachlich und textlich schwierig. מוסר kann auch „Zucht“, „Erziehung“ oder „Zurechtweisung“ bedeuten. Die knappe Nominalfügung kann auch als Satz verstanden werden: „Brot ist Unterweisung, und Wein ist dabei.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: על כן
  choice: Darum
  rationale: Gibt die folgernde Verknüpfung knapp und idiomatisch wieder.
- source_word: חזק טובו
  choice: halte an seiner Güte fest
  rationale: חזק kann zum Festhalten oder starken Ergreifen auffordern; mit טובו als Bezugswort bewahrt diese Wiedergabe den mahnenden Charakter, ohne die ungewöhnliche Fügung zu glätten.
- source_word: טובו
  choice: seiner Güte
  rationale: טוב kann sowohl allgemeine Güte als auch konkrete Wohltätigkeit oder Großzügigkeit bezeichnen; „Güte“ lässt diese Spannweite offen.
- source_word: ותהלתו יספר קהל
  choice: und die Versammlung wird sein Lob verkünden
  rationale: ספר bedeutet im Piel erzählen, berichten oder verkünden; קהל bezeichnet die versammelte Gemeinschaft. Die Zukunftsform entspricht der hebräischen Yiqtol-Form, auch wenn ein auffordernder Nebensinn möglich bleibt.
- source_word: מוסר לחם, ויין יחדו
  choice: Unterweisung über Brot und Wein zusammen
  rationale: Die knappe, vermutlich überschriftartige Nominalfügung wird als Unterweisung über den gemeinsamen Umgang mit Brot und Wein verstanden. מוסר umfasst Unterweisung, Zucht und korrigierende Erziehung; יחדו bindet Brot und Wein zusammen.
theological_decisions:
- issue: Stark voneinander abweichende hebräische und griechische Textüberlieferung
  choice: Der Haupttext folgt dem erhaltenen Hebräisch; die völlig andere griechische Lesart wird in einer Fußnote vollständig genannt.
  alternative: 'Dem Griechischen folgen: „Vieles habe ich auf meinen Irrfahrten gesehen, und meine Einsicht ist größer als meine Worte.“'
  rationale: Wo ein hebräischer Text erhalten ist, bildet er die primäre Grundlage. Eine Vermischung der nicht miteinander vereinbaren Lesarten würde einen Text herstellen, den keiner der Zeugen bietet.
- issue: Deutung der Schlusswendung als Nominalsatz oder Überschrift
  choice: „Unterweisung über Brot und Wein zusammen“
  alternative: „Brot ist Unterweisung, und Wein ist dabei“ oder „Zucht beim Brot und Wein zugleich“
  rationale: Die artikellose, äußerst knappe hebräische Fügung lässt sich natürlich als überschriftartige Themenangabe lesen. Wegen der Unsicherheit wird die alternative syntaktische Deutung in der Fußnote offengelegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die erste Hälfte ist als fortlaufender Satz gestaltet; die ungewöhnlich knappe zweite Hälfte bleibt als überschriftartige Nominalfügung erkennbar. Fachsprachliche oder konfessionell geprägte Begriffe wurden vermieden.
