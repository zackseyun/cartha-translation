  text: You gave your strength to women[a], and let them rule over your body.
translation:
  language: de
  text: Du gabst deine Kraft den Frauen[a] und ließest sie über deinen Körper herrschen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: »deine Kraft«; die griechische Parallele hat »deine Lenden« und macht den sexuellen Sinn ausdrücklich.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כסלך
  choice: deine Kraft
  rationale: Das schwierige hebräische Wort wird im Zusammenhang als körperliche beziehungsweise männliche Kraft verstanden. Die griechische Parallele »deine Lenden« bestätigt den sexuellen Sinn; »Kraft« bewahrt dabei die Bildhaftigkeit, ohne sie unnötig anatomisch festzulegen.
- source_word: ותתן
  choice: du gabst
  rationale: Gibt נתן direkt und vorwurfsvoll wieder; der Zusammenhang macht deutlich, dass es sich um ein Preisgeben handelt.
- source_word: לנשים
  choice: den Frauen
  rationale: Die Präposition ל bezeichnet hier die Empfängerinnen dessen, was preisgegeben wurde.
- source_word: ותמשילם
  choice: und ließest sie … herrschen
  rationale: Die Kausativform von משל bezeichnet hier, dass den Frauen Herrschaft eingeräumt wurde. Das Suffix wird im Deutschen mit »sie« ausdrücklich aufgenommen.
- source_word: בגויתך
  choice: über deinen Körper
  rationale: גויה bezeichnet den Körper beziehungsweise die leibliche Person. »Über deinen Körper« verbindet die körperliche Bedeutung mit der vom Verb ausgedrückten Herrschaft.
theological_decisions:
- issue: Hebräischer Text und griechische Parallele bei כסלך
  choice: Der hebräische Text bleibt Grundlage; כסלך wird als »deine Kraft« wiedergegeben, während die griechische Lesart »deine Lenden« in einer Fußnote genannt wird.
  alternative: '»Du gabst deine Lenden den Frauen«; oder bei anderer Deutung von כסלך: »Du gabst deine Torheit den Frauen.«'
  rationale: Der Kontext des Tadels an Salomo und die griechische Parallele stützen einen körperlich-sexuellen Sinn. Die Hauptübersetzung wahrt jedoch die Unsicherheit des schwierigen hebräischen Ausdrucks und legt ihn nicht vollständig anatomisch fest.
translation_notes:
  register: Moderne, klare und würdige Standardsprache. Die direkte Anrede und der knappe vorwurfsvolle Parallelismus des Hebräischen bleiben erhalten.
