  text: How wise you were in your youth[a], and instruction overflowed like the Nile.
translation:
  language: de
  text: Wie weise warst du in deiner Jugend, und Unterweisung strömte über wie der Nil![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Text bietet hier eine wesentlich andere Lesart: „Deine Seele bedeckte die Erde, und du erfülltest sie mit rätselhaften Gleichnissen.“ Wahrscheinlich liegt ihm eine andere hebräische Textform oder eine abweichende Textüberlieferung zugrunde.'
    reason: alternative_reading
lexical_decisions:
- source_word: מה חכמת
  choice: Wie weise warst du
  rationale: Das ausrufende מה drückt Bewunderung aus; חכמת wird hier sinnvoll als Zustandsaussage verstanden. Die deutsche Formulierung ist natürlich und bewahrt den feierlichen Ausruf.
- source_word: בנעוריך
  choice: in deiner Jugend
  rationale: Die Wendung bezeichnet Salomos frühe Lebenszeit und lässt sich im Deutschen direkt und würdig wiedergeben.
- source_word: ותצף
  choice: strömte über
  rationale: Das Verb bezeichnet hier ein Überströmen oder Anschwellen und vermittelt die Fülle der Unterweisung, statt lediglich ein Schweben an der Oberfläche auszudrücken.
- source_word: כיאר
  choice: wie der Nil
  rationale: יאר bezeichnet häufig den Nil. Die spezifische Gewässermetapher wird daher gegenüber dem allgemeineren „wie ein Strom“ bewahrt.
- source_word: מוסר
  choice: Unterweisung
  rationale: מוסר umfasst erziehende Lehre und Zucht. „Unterweisung“ passt in diesem Lob der Weisheit Salomos und hält den formenden Charakter des Begriffs fest.
theological_decisions:
- issue: Vorrang des erhaltenen hebräischen Textes gegenüber der stark abweichenden griechischen Lesart
  choice: Der Haupttext folgt dem erhaltenen Hebräisch.
  alternative: „Deine Seele bedeckte die Erde, und du erfülltest sie mit rätselhaften Gleichnissen.“
  rationale: Wo der hebräische Sirachtext erhalten ist, bildet er die Übersetzungsgrundlage. Die griechische Überlieferung bezeugt hier eine wesentlich andere alte Lesart, die deshalb in der Fußnote dokumentiert, aber nicht in den Haupttext eingemischt wird.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Ton. Der Ausruf und das kräftige Bild des überströmenden Nils bleiben erhalten; die bedeutende griechische Variante wird transparent in einer Fußnote wiedergegeben.
