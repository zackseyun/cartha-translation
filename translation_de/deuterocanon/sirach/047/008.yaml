base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/047/008.yaml
  text: In all his work he gave thanks to God Most High with words of glory[a]; with all his heart he loved his Maker[b], and every day he gave thanks to him with songs.
translation:
  language: de
  text: Bei allem, was er tat, dankte er Gott, dem Höchsten, mit Worten der Herrlichkeit[a]. Von ganzem Herzen liebte er seinen Schöpfer, und jeden Tag dankte er ihm mit Liedern[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: „mit Worten der Herrlichkeit“; ähnlich das Griechische: „mit einem Wort der Herrlichkeit“.'
    reason: lexical_alternative
  - marker: b
    text: 'Der hebräische Text sagt: „und jeden Tag dankte er ihm mit Liedern“. Die griechische Parallelüberlieferung lautet dagegen: „Er pries und liebte den, der ihn gemacht hatte“; die ausdrückliche Angabe „jeden Tag“ fehlt dort.'
    reason: alternative_reading
lexical_decisions:
- source_word: בכל מעשהו
  choice: Bei allem, was er tat
  rationale: Die Wendung bezeichnet die Gesamtheit seines Tuns. Die verbale Formulierung ist im heutigen Deutsch natürlicher als „in all seinem Werk“ und wahrt den umfassenden Sinn.
- source_word: נתן הודות
  choice: dankte er
  rationale: Die hebräische Verbindung bedeutet wörtlich etwa „Dank darbringen“. „Danken“ gibt den Sinn knapp und idiomatisch wieder.
- source_word: לאל עליון
  choice: Gott, dem Höchsten
  rationale: Die Wiedergabe bewahrt sowohl אֵל als Gottesbezeichnung als auch עליון als Hoheitstitel.
- source_word: באמרי כבוד
  choice: mit Worten der Herrlichkeit
  rationale: Die Formulierung hält die Genitivverbindung „Worte der Herrlichkeit/Ehre“ aufrecht, statt sie deutend zu „herrlichen Worten“ umzubilden.
- source_word: בכל לבו
  choice: Von ganzem Herzen
  rationale: Dies ist die natürliche deutsche Entsprechung der hebräischen Wendung für ungeteilte innere Hingabe.
- source_word: אוהב עשהו
  choice: liebte er seinen Schöpfer
  rationale: Das Partizip אוהב wird im erzählenden Zusammenhang verbal wiedergegeben; עשהו bezeichnet persönlich den, der ihn gemacht hat.
- source_word: וכבל יום
  choice: und jeden Tag
  rationale: Die überlieferte, offenbar leicht gestörte Form wird entsprechend dem wahrscheinlichen Sinn „jeden Tag/Tag für Tag“ wiedergegeben.
- source_word: הודה לו בזמירות
  choice: dankte er ihm mit Liedern
  rationale: הודה trägt hier den Sinn von Dank und Lob; זמירות bezeichnet gesungene Lieder beziehungsweise Lobgesänge. „Lieder“ bleibt verständlich und legt sich nicht unnötig auf „Psalmen“ fest.
theological_decisions:
- issue: Gottesbezeichnung עליון
  choice: der Höchste
  alternative: der Allerhöchste
  rationale: „Der Höchste“ gibt den hebräischen Hoheitstitel unmittelbar wieder und entspricht auch dem griechischen Ὑψίστῳ, ohne eine zusätzliche Steigerung einzutragen.
- issue: Textabweichung zwischen hebräischer und griechischer Überlieferung im zweiten Satz
  choice: Der hebräischen Lesart mit täglichem Dank in Liedern folgen
  alternative: 'Nach dem Griechischen: „Er pries und liebte den, der ihn gemacht hatte“'
  rationale: Der angegebene hebräische Text ist die primäre Quelle. Die abweichende griechische Fassung wird in einer Fußnote transparent gemacht, ohne beide Lesarten zu vermischen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nah am hebräischen Parallelismus, wird jedoch idiomatisch formuliert. „Worte der Herrlichkeit“ bewahrt bewusst die bildhafte und leicht offene Ausdrucksweise des Ausgangstextes.
