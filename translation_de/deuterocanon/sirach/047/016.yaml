  text: You covered the earth with your wisdom[a], and you filled the heights with song of praise.
translation:
  language: de
  text: Du bedecktest die Erde mit deiner Weisheit und erfülltest die Höhen mit Lobgesang.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Parallelüberlieferung lautet: „Dein Name gelangte zu fernen Inseln, und in deinem Frieden wurdest du geliebt.“ Sie gibt eine erheblich andere Textform wieder als der erhaltene hebräische Text.'
    reason: alternative_reading
lexical_decisions:
- source_word: כסית (כסה)
  choice: bedecktest
  rationale: Das Verb bedeutet gewöhnlich „bedecken“. Die konkrete poetische Vorstellung, dass sich Salomos Weisheit über die Erde ausbreitet, bleibt so erhalten.
- source_word: בחכמתך
  choice: mit deiner Weisheit
  rationale: Die Präposition ב kann hier begleitend oder instrumental verstanden werden. „Mit deiner Weisheit“ ist natürliches Deutsch und lässt diese Bedeutungsbreite bestehen.
- source_word: ותקלס
  choice: und erfülltest
  rationale: Die Form und ihre Verbindung mit במרום שירה sind schwierig. „Erfülltest“ gibt im Zusammenhang den wahrscheinlichen Sinn wieder, dass Lobgesang die Höhen füllte, ohne das Verb vorschnell als direktes „loben“ festzulegen.
- source_word: במרום
  choice: die Höhen
  rationale: מרום kann eine Höhe, die Höhen oder den Himmel bezeichnen. „Die Höhen“ bewahrt das räumliche Bild und legt die Kosmologie nicht unnötig fest.
- source_word: שירה
  choice: Lobgesang
  rationale: שירה bedeutet „Lied“ oder „Gesang“. „Lobgesang“ bringt die im Kontext naheliegende preisende Funktion in einer würdigen, geläufigen deutschen Form zum Ausdruck.
theological_decisions:
- issue: Hebräischer Text gegenüber der deutlich abweichenden griechischen Parallelüberlieferung
  choice: Der Haupttext folgt dem erhaltenen hebräischen Text.
  alternative: „Dein Name gelangte zu fernen Inseln, und um deines Friedens willen wurdest du geliebt.“
  rationale: Da für diesen Vers ein hebräischer Text mit hoher Sicherheit vorliegt, hat er für den Haupttext Vorrang. Die griechische Fassung scheint eine erheblich andere Textform oder Vorlage zu bezeugen und wird deshalb transparent in einer Fußnote wiedergegeben, statt mit dem Hebräischen harmonisiert zu werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter poetischer Bildsprache. Das schwierige ותקלס wird kontextgemäß, aber zurückhaltend wiedergegeben; die abweichende griechische Überlieferung bleibt in der Fußnote sichtbar.
