  text: As the fat is set apart from the sacred offering[b][a], so was David from Israel.
translation:
  language: de
  text: Wie das Fett vom heiligen Opfer ausgesondert wird, so wurde David aus Israel ausgesondert.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das Hebräische ist bei »vom heiligen Opfer« knapp. Die griechische Parallelfassung präzisiert: »vom Heilsopfer« und »von den Söhnen Israels«.'
    reason: Die Fußnote macht die knappe hebräische Formulierung und die präzisierende griechische Parallelüberlieferung transparent.
lexical_decisions:
- source_word: כחלב
  choice: Wie das Fett
  rationale: חֵלֶב bezeichnet konkret das Fett eines Opfertiers. Die kultische Bildsprache bleibt erhalten und wird nicht abstrakt als »der beste Teil« wiedergegeben.
- source_word: מורם
  choice: ausgesondert wird
  rationale: Das passive Partizip von רום bezeichnet im Opferzusammenhang den herausgehobenen beziehungsweise abgetrennten Anteil. »Ausgesondert« gibt diese kultische Bestimmung in verständlichem Deutsch wieder; auch das griechische ἀφωρισμένον stützt den trennenden Sinn.
- source_word: מקדש
  choice: vom heiligen Opfer
  rationale: Die knappe hebräische Formulierung meint hier im Zusammenhang keinen räumlichen Ausgang aus dem Heiligtum, sondern den geheiligten Opferzusammenhang. »Heiliges Opfer« wahrt diese Bedeutung, ohne die genauere griechische Bezeichnung bereits in den Haupttext einzutragen.
- source_word: כן דוד מישראל
  choice: so wurde David aus Israel ausgesondert
  rationale: Das Hebräische ist elliptisch und übernimmt den Gedanken des Aussonderns aus der ersten Vershälfte. Die Wiederaufnahme des Verbs ist im Deutschen für einen vollständigen, natürlichen Vergleich nötig. Das griechische ἀπὸ τῶν υἱῶν Ἰσραήλ bestätigt den separativen Sinn.
theological_decisions:
- issue: Wie ausdrücklich Davids besondere Erwählung benannt werden soll
  choice: Davids Aussonderung aus Israel wird durch das im Vergleich bereits enthaltene Verb ausgedrückt.
  alternative: »So wurde David von Gott aus Israel erwählt.«
  rationale: Das Bild legt besondere Auswahl und Ehre nahe, nennt in diesem Vers aber weder Gott als handelndes Subjekt noch verwendet es ausdrücklich ein Verb für »erwählen«. »Ausgesondert« bewahrt die theologische Aussagekraft, ohne eine zusätzliche Aussage einzutragen.
- issue: Bestimmung der Opferart
  choice: Im Haupttext steht allgemein »heiliges Opfer«; die genauere griechische Lesart wird in der Fußnote genannt.
  alternative: »Heilsopfer« oder »Gemeinschaftsopfer« unmittelbar im Haupttext
  rationale: Das Hebräische ist an dieser Stelle knapper und weniger spezifisch als das griechische σωτήριον. Die allgemeinere Wiedergabe wahrt die hebräische Unbestimmtheit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der konkrete Opfervergleich bleibt erhalten; die in modernem Deutsch schwer verständliche Ellipse des zweiten Halbverses wird durch die Wiederaufnahme von »ausgesondert« behutsam ergänzt.
