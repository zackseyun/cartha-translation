- from: Du wurdest mit dem ehrwürdigen Namen benannt, der über Israel ausgerufen wird[a]; du häuftest Gold an wie Eisen und vermehrtest Silber wie Blei.
  to: Du wurdest nach dem ehrwürdigen Namen genannt, der über Israel genannt wird[a]; du häuftest Gold an wie Eisen und vermehrtest Silber wie Blei.
  rationale: Die Revision ersetzt die semantisch einengende Wiedergabe „ausgerufen wird“ durch „genannt wird“ und verbessert zugleich die deutsche Idiomatik der ersten Satzhälfte. Die Fußnote bewahrt die möglichen Nuancen der umstrittenen beziehungsweise allusiven Wendung, ohne eine bestimmte theologische Deutung festzuschreiben.
