review_pass:
  verdict: revise
  source_fidelity: 'Die beiden Vergleiche werden zutreffend wiedergegeben: Gold wird mit Eisen, Silber mit Blei verglichen; עפרת ist angesichts der griechischen Parallele sicher als „Blei“ zu verstehen. Die Formulierung zum Namen wahrt grundsätzlich die absichtlich offene hebräische Wendung נקרא על ישראל. Allerdings ist „ausgerufen wird“ enger als נקרא und legt eine öffentliche Proklamation nahe, während der hebräische Ausdruck auch ein Genanntsein, Angerufensein oder Zugeordnetsein ausdrücken kann.'
  naturalness: „Du wurdest mit dem ehrwürdigen Namen benannt“ ist verständlich, aber im modernen Standarddeutsch stilistisch schwerfällig. „Du wurdest nach dem ehrwürdigen Namen genannt“ ist idiomatischer und bewahrt den passivischen Bezug. „Der über Israel genannt wird“ bleibt bewusst biblisch-allusiv, ist aber durch die Fußnote angemessen erläutert.
  terminology: „ehrwürdig“ gibt הנכבד würdevoll wieder, ohne den Referenten weiter dogmatisch festzulegen. „Blei“ ist korrekt. Die Änderung von „ausgerufen“ zu „genannt“ hält die Wiederholung des hebräischen Stammes und die semantische Offenheit besser fest.
  issues:
  - severity: medium
    issue: „ausgerufen wird“ verengt die Bedeutung von הנקרא על ישראל.
    rationale: Das hebräische נקרא bedeutet hier primär „genannt/angerufen werden“; „ausrufen“ fügt leicht den Gedanken einer förmlichen Verkündigung hinzu. Die Fußnote erkennt die Mehrdeutigkeit zwar an, aber der Haupttext sollte sie nicht vorentscheiden.
  - severity: low
    issue: „mit dem ehrwürdigen Namen benannt“ klingt redundant und wenig idiomatisch.
    rationale: Die Verbindung von „mit“ und „benannt“ ist zwar grammatisch möglich, wirkt jedoch im heutigen Deutsch unnötig schwerfällig. „Nach dem ... Namen genannt“ vermittelt die Benennung natürlicher.
  revised_text: Du wurdest nach dem ehrwürdigen Namen genannt, der über Israel genannt wird[a]; du häuftest Gold an wie Eisen und vermehrtest Silber wie Blei.
