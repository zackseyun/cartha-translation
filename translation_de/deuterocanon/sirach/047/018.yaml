base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/047/018.yaml
  text: You were called by the honored name, the one invoked over Israel; and you amassed gold like iron, and multiplied silver like lead.
translation:
  language: de
  text: Du wurdest nach dem ehrwürdigen Namen genannt, der über Israel genannt wird[a]; du häuftest Gold an wie Eisen und vermehrtest Silber wie Blei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „der über Israel angerufen wird“. Die hebräische Wendung kann einen Namen bezeichnen, der über jemandem genannt wird, zu ihm gehört oder auf ihm ruht; auch die griechische Überlieferung stützt diesen Sinnbereich.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נקראת בשם הנכבד
  choice: Du wurdest mit dem ehrwürdigen Namen benannt
  rationale: Das Passiv נקראת und die Präposition ב werden eng wiedergegeben. „Ehrwürdig“ bewahrt die Bedeutungsbreite von הנכבד zwischen geehrt, gewichtig und herrlich, ohne die Anspielung näher zu bestimmen.
- source_word: הנקרא על ישראל
  choice: der über Israel ausgerufen wird
  rationale: Die Fassung erhält das Bild eines über Israel genannten beziehungsweise ausgerufenen Namens und klingt im heutigen Deutsch verständlich. Sie legt weder Zugehörigkeit noch Anrufung als alleinigen Sinn fest.
- source_word: ותצבר
  choice: du häuftest … an
  rationale: Das Verb bezeichnet das Sammeln und Aufspeichern großer Mengen; „anhäufen“ passt zum königlichen Reichtum und bewahrt die kräftige Bildsprache.
- source_word: כברזל זהב
  choice: Gold … wie Eisen
  rationale: 'Die knappe Vergleichsform bleibt erhalten: Gold wird in solcher Menge gesammelt, als wäre es gewöhnliches Eisen.'
- source_word: וכעפרת הרבית כסף
  choice: und vermehrtest Silber wie Blei
  rationale: עפרת bezeichnet hier, durch das griechische μόλιβον bestätigt, Blei. Die kompakte Form wahrt Parallelismus und Vergleich des Hebräischen.
theological_decisions:
- issue: Bezug des „ehrwürdigen Namens“
  choice: Der göttliche, mit Israel verbundene Name wird angedeutet, ohne die Art seiner Beziehung zu Salomo oder Israel näher festzulegen.
  alternative: Die Aussage ausdrücklich darauf beziehen, dass Salomo den Namen des HERRN trägt, oder sie ausschließlich als Aussage über Israels Bundeszugehörigkeit verstehen.
  rationale: Der hebräische Wortlaut lässt die Beziehung bewusst knapp und anspielungsreich. Die Übersetzung bewahrt diese theologische Spannung und ergänzt keine nicht ausdrücklich genannte Erklärung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knappem poetischem Parallelismus. Die ungewöhnliche Wendung vom über Israel ausgerufenen Namen bleibt wegen ihrer sachlichen und theologischen Mehrdeutigkeit erhalten.
