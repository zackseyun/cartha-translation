base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/047/010.yaml
  text: He gave splendor[a], beauty, and glory to the festivals year after year; when they praised his holy name[b], before morning the court resounded.
translation:
  language: de
  text: Er verlieh den Festen Jahr für Jahr Hoheit, Pracht und Ehre. Wenn sie seinen heiligen Namen priesen, erscholl vom frühen Morgen an das Heiligtum.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der Schluss des erhaltenen hebräischen Textes ist schwer verständlich; wörtlich steht dort etwa: „Vor dem Morgen jubelte/erscholl das Recht“. Die griechische Überlieferung lautet: „Vom frühen Morgen an erscholl das Heiligtum.“'
    reason: textual_variant
lexical_decisions:
- source_word: ויתן לחגים
  choice: Er verlieh den Festen
  rationale: נתן bedeutet grundsätzlich „geben“; mit den Würdebegriffen als Objekt gibt „verlieh“ die Zuwendung an die Feste im Deutschen natürlich und präzise wieder.
- source_word: בכל שנה ושנה
  choice: Jahr für Jahr
  rationale: Die wiederholte Form bezeichnet die regelmäßig wiederkehrende jährliche Feier.
- source_word: הוד פאר וכבוד
  choice: Hoheit, Pracht und Ehre
  rationale: Alle drei hebräischen Würdebegriffe bleiben erhalten. „Hoheit“ gibt הוד, „Pracht“ פאר und „Ehre“ כבוד in gehobenem, aber verständlichem Deutsch wieder.
- source_word: בהללו את שם קדשו
  choice: Wenn sie seinen heiligen Namen priesen
  rationale: ב wird zeitlich verstanden. Das nicht ausdrücklich genannte Subjekt wird entsprechend dem hebräischen Verb im Plural mit „sie“ wiedergegeben; der Bezug bleibt wie in der Vorlage offen.
- source_word: לפני בקר ירן משפט
  choice: ließ das Heiligtum vom frühen Morgen an seinen Klang erschallen
  rationale: Der erhaltene hebräische Schluss ist semantisch schwierig. Die griechische Parallele ἀπὸ πρωῒ ἠχεῖν τὸ ἁγίασμα stützt „vom frühen Morgen an“ und das erschallende Heiligtum; die Formulierung bewahrt zugleich den Klangcharakter von ירן.
theological_decisions:
- issue: Textlich schwieriger Versschluss
  choice: Den unklaren hebräischen Schluss mithilfe der griechischen Parallele als vom frühen Morgen an erschallendes Heiligtum wiedergeben und die Abweichung in einer Fußnote offenlegen.
  alternative: 'Wörtlicher nach dem überlieferten Hebräisch: „Vor dem Morgen jubelte/erscholl das Recht“ oder „… das Gericht“.'
  rationale: משפט bedeutet gewöhnlich „Recht“, „Urteil“ oder „Gericht“, ergibt hier aber zusammen mit ירן und dem Kontext keinen sicheren Sinn. Die griechische Parallele bietet einen kohärenten, kultischen Zusammenhang, ohne die Unsicherheit des hebräischen Zeugnisses zu verschweigen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit leicht poetischem Rhythmus. Die Dreiergruppe der Ehrenbegriffe wird nicht gekürzt. Die Textunsicherheit des Schlusses wird nicht stillschweigend aufgelöst, sondern durch die Fußnote kenntlich gemacht.
