  text: who prepared a house for his name[a], and established the sanctuary forever.
translation:
  language: de
  text: der seinem Namen ein Haus bereitete[a] und das Heiligtum für immer errichtete.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Paralleltext lautet an dieser Stelle stattdessen: „Wie weise wurdest du in deiner Jugend, und wie ein Strom wurdest du mit Einsicht erfüllt.“ Er bietet damit im umgebenden Zusammenhang eine andere Textzeile. Der Haupttext folgt hier dem erhaltenen hebräischen Text.'
