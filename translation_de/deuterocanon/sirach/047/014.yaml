lexical_decisions:
- source_word: אשר
  choice: der
  rationale: Leitet einen Relativsatz ein, der sich im Zusammenhang auf Salomo zurückbezieht; „der“ ist im Deutschen die natürliche Fortführung.
- source_word: הכין
  choice: bereitete
  rationale: Das Verb bezeichnet das Vorbereiten oder Bereitmachen. „bereitete“ bewahrt diese Bedeutung, ohne den Ausdruck vorschnell auf den eigentlichen Bauvorgang zu verengen.
- source_word: בית
  choice: ein Haus
  rationale: „Haus“ gibt den hebräischen Wortlaut wieder und bewahrt die biblische Tempelrede vom Haus für Gottes Namen; der unbestimmte Artikel entspricht dem artikellosen hebräischen Substantiv und klingt im Deutschen natürlich.
- source_word: לשמו
  choice: seinem Namen
  rationale: Zusammen mit „ein Haus“ entsteht die Wendung „seinem Namen ein Haus“, die die Widmung des Heiligtums an Gott ausdrückt, ohne „Name“ interpretierend durch „HERR“ zu ersetzen.
- source_word: ויצב
  choice: errichtete
  rationale: Das Verb bedeutet, etwas fest hinzustellen beziehungsweise dauerhaft zu begründen. „errichtete“ ist bei einem Heiligtum idiomatisch und vermittelt sowohl das Aufstellen als auch die Festigkeit.
- source_word: לעד
  choice: für immer
  rationale: Die Wendung bezeichnet unbegrenzte beziehungsweise dauerhafte Zeit. „für immer“ erhält die idealisierte Aussage des Textes, ohne die Spannung zur späteren Zerstörung des Tempels aufzulösen.
- source_word: מקדש
  choice: das Heiligtum
  rationale: Bezeichnet den heiligen Ort beziehungsweise Tempelbezirk. Der bestimmte Artikel ist im Deutschen aufgrund des bekannten salomonischen Heiligtums kontextuell angemessen.
- source_word: ὡς ἐσοφίσθης ἐν νεότητί σου, καὶ ἐνεπλήσθης ὡς ποταμὸς συνέσεως
  choice: im Haupttext nicht übernommen
  rationale: Der überlieferte griechische Paralleltext bietet an dieser Stelle eine andere Aussage über Salomos Weisheit. Da der vorliegende hebräische Text sicher bezeugt ist, folgt der Haupttext dem Hebräischen; die Abweichung wird in einer Fußnote dokumentiert.
theological_decisions:
- issue: Tempelsprache und die Wendung vom göttlichen Namen
  choice: „seinem Namen ein Haus“
  alternative: „dem HERRN einen Tempel“
  rationale: Die hebräische Wendung verbindet das Heiligtum mit Gottes Namen und behauptet nicht schlicht, Gott werde von einem Gebäude umfasst. Die wörtlich-nahe Form bewahrt diese theologische Nuance, ohne zusätzliche Gottesbezeichnungen einzutragen.
- issue: Aussagekraft von לעד
  choice: „für immer“
  alternative: „auf Dauer“
  rationale: Die uneingeschränkte Dauerformulierung erhält die idealisierte Rhetorik des Verses und lässt die historische Spannung zur späteren Zerstörung des Tempels bestehen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzform bleibt als Relativsatz bewusst vom vorausgehenden Zusammenhang abhängig. Die traditionelle biblische Wendung „seinem Namen ein Haus“ bleibt erhalten, ist aber ohne altertümliche Wortformen formuliert.
