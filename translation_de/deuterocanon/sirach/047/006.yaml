  source_fidelity: 'Der Haupttext folgt dem erhaltenen hebräischen Text zuverlässig: על כן ist angemessen mit „Darum“ wiedergegeben; ענו לו bleibt bewusst offen als „antworteten ihm“; „die Töchter“ bewahrt die hebräische Ausdrucksweise; und die schwierige öffentliche Ehrung in ויכנוהו wird mit „priesen ihn“ plausibel wiedergegeben. „unter Zehntausenden“ bildet ברבבה nachvollziehbar ab. Die zweite Zeile gibt das Anlegen des צניף als „den Turban anlegte“, das Kämpfen und das Bezwingen des Feindes ringsum sachgerecht wieder. Die abweichende griechische Überlieferung wird als solche kenntlich gemacht, ohne den hebräischen Haupttext zu verdrängen.'
