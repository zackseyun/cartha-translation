base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/047/006.yaml
  text: Therefore the daughters answered him[a], and acclaimed him among the myriads. When he put on the turban, he fought[b], and all around he subdued the foe.
translation:
  language: de
  text: Darum antworteten ihm die Töchter[a] und priesen ihn unter Zehntausenden. Als er den Turban anlegte, kämpfte er und bezwang ringsum den Feind.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wahrscheinlich sind Frauen gemeint, die nach dem Sieg mit einem Antwortgesang einsetzten. Die griechische Überlieferung lautet abweichend: »So verherrlichte er ihn unter Zehntausenden und pries ihn mit den Segnungen des Herrn, als ihm ein Diadem der Herrlichkeit gebracht wurde.« Sie zeichnet damit ein ausdrücklich königliches Bild, während der hebräische Text von einem »Turban« spricht.'
    reason: Kulturhinweis und alternative Lesart
lexical_decisions:
- source_word: על כן
  choice: Darum
  rationale: Gibt die folgernde Verknüpfung mit Davids zuvor geschilderten Siegen knapp und natürlich wieder.
- source_word: ענו לו
  choice: antworteten ihm
  rationale: Bewahrt die Grundbedeutung von ענה. Im Zusammenhang kann ein antwortender Siegesgesang gemeint sein, ohne dass dies im Haupttext festgelegt wird.
- source_word: בנות
  choice: die Töchter
  rationale: Folgt der hebräischen Bezeichnung formal; wahrscheinlich sind feiernde oder singende Frauen gemeint.
- source_word: ויכנוהו
  choice: priesen ihn
  rationale: Die schwierige hebräische Form bezeichnet hier offenbar öffentliche Ehrung; die griechische Parallele stützt die Bedeutung »verherrlichen/preisen«.
- source_word: ברבבה
  choice: unter Zehntausenden
  rationale: Bewahrt den Zahlenbegriff רבבה und erinnert zugleich an den Siegesruf über Davids Zehntausende.
- source_word: בעטותו
  choice: Als er ... anlegte
  rationale: Gibt den zeitlichen Infinitiv und den Vorgang des Anlegens beziehungsweise Umwickelns natürlich wieder.
- source_word: צניף
  choice: Turban
  rationale: צניף bezeichnet im Hebräischen eine gewundene Kopfbedeckung; die abweichende königliche Bildsprache der griechischen Überlieferung wird in einer Fußnote erhalten.
- source_word: נלחם
  choice: kämpfte er
  rationale: Direkte und im modernen Deutschen natürliche Wiedergabe des Kampfverbs.
- source_word: ומסביב
  choice: ringsum
  rationale: Drückt den umfassenden räumlichen Bezug knapp und würdig aus.
- source_word: הכניע
  choice: bezwang
  rationale: Vermittelt das Niederwerfen beziehungsweise Unterwerfen des Gegners idiomatisch.
- source_word: צר
  choice: den Feind
  rationale: Gibt den singularischen, möglicherweise kollektiv gebrauchten Ausdruck klar wieder.
theological_decisions:
- issue: Verhältnis des hebräischen צניף zur griechischen Lesart »Diadem der Herrlichkeit«
  choice: Im Haupttext steht nach dem hebräischen Zeugen »Turban«.
  alternative: 'Die griechische Überlieferung lautet sinngemäß: »So verherrlichte er ihn unter Zehntausenden und pries ihn mit den Segnungen des Herrn, als ihm ein Diadem der Herrlichkeit gebracht wurde.«'
  rationale: Da ein hebräischer Text erhalten ist, erhält er im Haupttext Vorrang. Die griechische Fassung bewahrt jedoch eine bedeutsame, ausdrücklich königliche Variante und wird deshalb in der Fußnote vollständig kenntlich gemacht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die syntaktische Parallelität und die knappe Siegesdarstellung des Hebräischen bleiben erhalten. »Töchter« wahrt die quellensprachliche Offenheit; die wahrscheinlich musikalisch-feierliche Bedeutung wird in der Fußnote erläutert.
