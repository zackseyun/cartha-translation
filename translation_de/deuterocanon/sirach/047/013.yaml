review_pass:
  verdict: revise
  source_fidelity: Der hebräische Text bezeugt die kürzere Aussage über Salomos Friedensherrschaft und die von Gott gewährte Ruhe. Die griechische Parallelfassung bestätigt Gott als Subjekt und enthält zusätzlich die Zweckangabe zum Haus für Gottes Namen und zum Heiligtum. Die Aufnahme dieser griechischen Fortsetzung ist mit transparentem Variantenhinweis vertretbar. In der deutschen Fassung muss jedoch klarer werden, dass der Name in der Zweckangabe Gottes Name ist, nicht Salomos.
  naturalness: „Salomo herrschte in Tagen des Friedens“ und „Gott verschaffte ihm ringsum Ruhe“ sind würdig und verständlich. „Damit er seinem Namen ein Haus baute“ ist im heutigen Deutsch missverständlich, weil „seinem“ naheliegend auf Salomo bezogen wird. „Damit er ein Haus für Gottes Namen errichtete“ ist klar und natürlich.
  terminology: „Salomo“, „Frieden“, „Ruhe“, „Haus“ und „Heiligtum“ sind angemessen. „Haus“ sollte nicht zu „Tempel“ eingeengt werden. Die explizite Benennung Gottes in „für Gottes Namen“ verdeutlicht die semitisch-griechische Namensformel, ohne sie theologisch auszudeuten.
  issues:
  - severity: medium
    issue: Mehrdeutiger Bezug von „seinem Namen“ im Haupttext und in der Fußnote
    rationale: Im Satz ist Salomo das Subjekt von „baute“; daher kann „seinem Namen“ im modernen Deutsch als Salomos Name verstanden werden. Das griechische αὐτοῦ bezieht sich jedoch auf Gott, der unmittelbar zuvor als Subjekt genannt ist. Die deutsche Übersetzung sollte diesen Bezug ausdrücklich machen.
  revised_text: Salomo herrschte in Tagen des Friedens[a], und Gott verschaffte ihm ringsum Ruhe, damit er ein Haus für Gottes Namen errichtete und ein Heiligtum für immer bereitete.
  revised_footnotes:
