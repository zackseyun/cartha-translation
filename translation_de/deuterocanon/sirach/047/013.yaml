  rationale: Die Änderung beseitigt die nicht beabsichtigte Mehrdeutigkeit des Possessivpronomens. „Für Gottes Namen“ gibt die griechische Namensformel klar wieder; „Haus“ und „Heiligtum“ bleiben als Quellbegriffe erhalten. Die Fußnote wird entsprechend präzisiert.
