base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/047/013.yaml
  text: Solomon reigned in days of peace[a], and God gave him rest on every side, so that he might build a house for his name and prepare a sanctuary forever.
translation:
  language: de
  text: Salomo herrschte in Tagen des Friedens[a], und Gott verschaffte ihm ringsum Ruhe, damit er ein Haus für Gottes Namen errichtete und ein Heiligtum für immer bereitete.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die erhaltene hebräische Zeile ist kürzer: »Salomo herrschte in Tagen des Friedens, und Gott verschaffte ihm ringsum Ruhe.« Die griechische Parallelüberlieferung fügt die Zweckangabe hinzu, dass Salomo ein Haus für Gottes Namen errichten und ein Heiligtum für immer bereiten sollte.'
    reason: textual_variant
lexical_decisions:
- source_word: שְׁלֹמֹה
  choice: Salomo
  rationale: Die im Deutschen übliche Form des Personennamens.
- source_word: מלך
  choice: herrschte
  rationale: Gibt das hebräische Verb natürlich wieder; „war König“ wäre ebenfalls möglich, bezeichnet die Regierungstätigkeit jedoch weniger unmittelbar.
- source_word: בימי שלוה
  choice: in Tagen des Friedens
  rationale: Bewahrt die hebräische Zeitformel und gibt שלוה als eine von Frieden und Ungestörtheit geprägte Zeit wieder.
- source_word: ואל הניח לו מסביב
  choice: und Gott verschaffte ihm ringsum Ruhe
  rationale: Der überlieferte hebräische Wortlaut ist leicht unregelmäßig; die griechische Parallele nennt Gott ausdrücklich als Subjekt. „Ringsum Ruhe verschaffen“ ist idiomatisch und entspricht מסביב sowie κυκλόθεν.
- source_word: ἵνα στήσῃ οἶκον ἐπʼ ὀνόματι αὐτοῦ
  choice: damit er seinem Namen ein Haus baute
  rationale: Die nur in der griechischen Parallele erhaltene Zweckangabe wird aufgenommen. „Seinem Namen ein Haus bauen“ bewahrt die biblische Tempelsprache, ohne „Haus“ vorschnell durch „Tempel“ zu ersetzen.
- source_word: καὶ ἑτοιμάσῃ ἁγίασμα εἰς τὸν αἰῶνα
  choice: und ein Heiligtum für immer bereitete
  rationale: „Heiligtum“ entspricht ἁγίασμα im Kontext; „für immer“ gibt εἰς τὸν αἰῶνα knapp und offen wieder.
theological_decisions:
- issue: Aufnahme der Tempel-Zweckangabe, die in der griechischen Parallele, nicht aber in der erhaltenen hebräischen Zeile steht
  choice: Die griechische Fortsetzung steht im Haupttext; eine Fußnote weist auf den kürzeren hebräischen Text hin.
  alternative: 'Nur den erhaltenen hebräischen Wortlaut übersetzen: „Salomo herrschte in Tagen des Friedens, und Gott verschaffte ihm ringsum Ruhe.“'
  rationale: Der hebräische Zeuge hat hier die kürzere Fassung, während die direkte griechische Parallele eine inhaltlich stimmige Fortsetzung über den Tempelbau bietet. Die Aufnahme wahrt den vollständigeren Parallelzeugen; die Fußnote macht die Textlage transparent und löst die Variante nicht stillschweigend auf.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die leicht biblisch geprägten Wendungen „in Tagen des Friedens“ und „seinem Namen ein Haus“ bewahren die Bild- und Tempelsprache der Quellen; „ringsum“ hält die Aussage zugleich natürlich und verständlich.
