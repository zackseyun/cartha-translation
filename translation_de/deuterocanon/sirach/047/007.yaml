base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/047/007.yaml
  text: He gave cities among the Philistines[b][a], and to this day he has broken their horn.
translation:
  language: de
  text: Er setzte Städte im Land der Philister fest[a], und bis heute hat er ihr Horn zerbrochen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die hebräische Formulierung ist knapp und mehrdeutig. Auch möglich ist: „Er nahm den Philistern Städte ab“ oder, als Deutung der Wendung, „Er gründete Städte im Philisterland“. Der griechische Paralleltext versteht die Aussage im Zusammenhang von Davids dauerhafter Niederwerfung der Philister.'
    reason: alternative_reading
  - marker: b
    text: Das „Horn“ ist ein biblisches Bild für Stärke oder Macht.
    reason: lexical_alternative
lexical_decisions:
- source_word: ויתן
  choice: er setzte
  rationale: נתן kann „geben“, „setzen“ oder „stellen“ bedeuten. In Verbindung mit Städten und einer Ortsangabe ist „setzte“ im Deutschen näher an der offenen, knappen Formulierung des Hebräischen als eine militärisch ausdeutende Wiedergabe.
- source_word: בפלשתים
  choice: in das Gebiet der Philister
  rationale: Die Präposition ב mit der Volksbezeichnung ist hier stark verdichtet. Die Wiedergabe bezeichnet den räumlichen Bezug, ohne eindeutig festzulegen, ob David dort Städte anlegte, besetzte oder den Philistern abnahm.
- source_word: ערים
  choice: Städte
  rationale: ערים bedeutet gewöhnlich „Städte“ oder „Ortschaften“; „Städte“ entspricht dem militärisch-politischen Zusammenhang.
- source_word: ועד היום
  choice: bis auf den heutigen Tag
  rationale: Die feste Wendung bezeichnet eine bis zur Gegenwart des Sprechers anhaltende Folge und wird in würdigem, verständlichem Deutsch wiedergegeben.
- source_word: שבר
  choice: hat ... zerbrochen
  rationale: שבר bedeutet „brechen“ oder „zerbrechen“. Das deutsche Perfekt lässt zusammen mit „bis auf den heutigen Tag“ die fortdauernde Wirkung der Handlung erkennen.
- source_word: קרנם
  choice: ihr Horn
  rationale: Das wörtliche Bild des Horns für Stärke oder Macht steht sowohl im Hebräischen als auch im griechischen Paralleltext und bleibt deshalb im Haupttext erhalten.
theological_decisions:
- issue: Historischer Sinn von Davids Handeln an den Städten der Philister
  choice: Die knappe Aussage des Hebräischen bleibt als Setzen von Städten in das Gebiet der Philister stehen.
  alternative: 'Er nahm den Philistern Städte ab; oder: Er besiegte die Philister ringsum.'
  rationale: Der griechische Paralleltext deutet die Aussage ausdrücklich als dauerhafte Niederwerfung der Philister. Der hebräische Hauptzeuge formuliert jedoch enger und mehrdeutig; daher wird die militärische Deutung nicht in den Haupttext eingetragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnliche Kürze des hebräischen Satzes wird bewahrt, aber durch „Gebiet der Philister“ verständlicher gemacht. Das biblische Bild „Horn“ bleibt im Text und wird in einer Fußnote erläutert.
