translation:
  language: de
  text: Mit jungen Löwen spielte er wie mit einem Ziegenjungen und mit Bären wie mit Jungtieren aus Baschan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Griechisch: „und mit Bären wie mit Schaflämmern“. Der hebräische Text sagt wörtlich „wie mit den Jungen Baschans“. Baschan war für kräftiges, gut genährtes Vieh bekannt.'
    reason: alternative_reading
lexical_decisions:
- source_word: לכפירים
  choice: mit jungen Löwen
  rationale: כפירים bezeichnet junge Löwen; die Präposition wird im parallelen Bild assoziativ als „mit“ wiedergegeben.
- source_word: שחק
  choice: spielte er
  rationale: שחק bezeichnet hier spielerisches, furchtloses Umgehen; „spielte“ ist klar, natürlich und wahrt den poetischen Kontrast.
- source_word: כגדי
  choice: wie mit einem Ziegenböckchen
  rationale: גדי ist ein Ziegenjunges. „Ziegenböckchen“ vermeidet das im Deutschen mehrdeutige „Kitz“ und macht das Haustierbild deutlich.
- source_word: ולדבים
  choice: und mit Bären
  rationale: Die Wendung führt die parallele Konstruktion des ersten Halbverses fort.
- source_word: כבני בשן
  choice: wie mit Jungtieren aus Baschan
  rationale: Wörtlich steht „wie [mit] Söhnen/Jungen Baschans“. Die bewusst allgemeine Wiedergabe bewahrt die Unbestimmtheit des Hebräischen, statt ohne sichere Grundlage „Kälber“ oder „Lämmer“ festzulegen.
theological_decisions:
- issue: Verhältnis des erhaltenen hebräischen Textes zur präzisierenden griechischen Parallele
  choice: Der Haupttext folgt dem Hebräischen und lässt die Tierart bei בני בשן offen.
  alternative: 'Nach dem Griechischen: „wie mit Schaflämmern“; alternativ konkretisierend: „wie mit Kälbern aus Baschan“.'
  rationale: Der erhaltene hebräische Text ist vorrangig. Das Griechische bestätigt das Bild zahmer Jungtiere, legt aber „Lämmer von Schafen“ ausdrücklich fest, wo das Hebräische lediglich „Junge/Söhne Baschans“ bietet.
translation_notes:
  register: Dichtes, würdiges modernes Deutsch mit parallelem Satzbau. „Jungtiere aus Baschan“ erhält die eigentümliche regionale Anspielung und die lexikalische Offenheit des Hebräischen; die griechische Präzisierung steht in der Fußnote.
