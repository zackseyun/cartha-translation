  text: He gave Ephraim a stumbling block[a], to drive them from their land; and his sin grew very great, and he sold himself to every evil.
translation:
  language: de
  text: Er gab Ephraim einen Stolperstein, um sie aus ihrem Land zu vertreiben. Seine Sünde wurde überaus groß, und er verkaufte sich an alles Böse.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Griechisch: „Ihre Sünden mehrten sich sehr, sodass sie aus ihrem Land entfernt wurden. Sie suchten jede Bosheit, bis die Vergeltung über sie kam.“ Der hebräische Textzeuge ist hier kürzer und spricht von einem Einzelnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: ויתן לאפרים מכשול
  choice: Er gab Ephraim einen Stolperstein
  rationale: Die Formulierung folgt eng der hebräischen Konstruktion „Ephraim einen מכשול geben“. „Stolperstein“ bewahrt das konkrete Bild einer Ursache des Falls, ohne „Ephraim preisgeben“ in den Text hineinzulesen.
- source_word: להדיחם מאדמתם
  choice: um sie aus ihrem Land zu vertreiben
  rationale: להדיחם bezeichnet das veranlasste Wegtreiben beziehungsweise Entfernen. „Land“ gibt אדמה im nationalen Zusammenhang natürlich wieder; das pluralische Suffix wird mit „sie/ihrem“ erhalten.
- source_word: ותגדל חטאתו מאד
  choice: Seine Sünde wurde überaus groß
  rationale: Der hebräische Text hat ausdrücklich den Singular „seine Sünde“. „Wurde überaus groß“ bildet sowohl das Verb גדל als auch die Verstärkung מאד klar und würdig ab.
- source_word: ולכל רעה התמכר
  choice: und er verkaufte sich an alles Böse
  rationale: Die reflexive Form von מכר bewahrt das eindringliche Bild des Sich-selbst-Verkaufens. „Alles Böse“ entspricht לכל רעה, ohne die Wendung zu einer späteren theologischen Kategorie auszubauen.
theological_decisions:
- issue: Singular im hebräischen Text gegenüber dem Plural im griechischen Paralleltext
  choice: Im Haupttext steht nach dem Hebräischen „Seine Sünde wurde überaus groß“ mit einem einzelnen männlichen Subjekt.
  alternative: 'Der griechische Text liest gemeinschaftlich: „Ihre Sünden mehrten sich sehr“ und setzt auch den folgenden Satz im Plural fort.'
  rationale: Der erhaltene hebräische Zeuge wird als Haupttext wiedergegeben. Da der griechische Paralleltext erheblich abweicht und eine echte alte Textform bezeugt, wird seine Lesart in einer Fußnote offengelegt.
- issue: Bild der moralischen Selbstpreisgabe in התמכר
  choice: „er verkaufte sich an alles Böse“
  alternative: „er gab sich allem Bösen hin“
  rationale: Die gewählte Fassung erhält die Verkaufsmetapher des Hebräischen und damit die starke Aussage eigener moralischer Beteiligung, ohne sie konfessionell auszudeuten.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem biblischem Ton. Die hebräischen Bilder „Stolperstein“ und „sich verkaufen“ bleiben erhalten; die deutliche Abweichung des griechischen Paralleltextes wird nicht harmonisiert, sondern in der Fußnote dokumentiert.
