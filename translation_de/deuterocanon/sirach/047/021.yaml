  text: to divide the people into two tribes[b][a], and from Ephraim a lawless kingdom.
translation:
  language: de
  text: das Volk in zwei Stämme zu spalten[a] und aus Efraim ein Reich des Unrechts[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Griechisch: „sodass die Herrschaft geteilt wurde und aus Efraim ein ungehorsames Reich seinen Anfang nahm“. Der hebräische Text sagt ausdrücklich: „das Volk in zwei Stämme zu spalten“.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „ein gewalttätiges Reich“ beziehungsweise „ein rebellisches Reich“. Das hebräische Wort חמס kann Gewalt oder Unrecht bezeichnen; die griechische Überlieferung betont Ungehorsam oder Auflehnung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לחלק העם
  choice: das Volk … zu spalten
  rationale: Der Infinitiv לחלק bezeichnet hier die herbeigeführte politische Teilung des Volkes. „Spalten“ gibt diese schmerzhafte Trennung natürlich und prägnant wieder.
- source_word: לשני שבטים
  choice: in zwei Stämme
  rationale: Die wörtliche Aussage des hebräischen Textes wird bewahrt, auch wenn die historische Reichsteilung komplexer beschrieben werden könnte.
- source_word: ומאפרים
  choice: und aus Efraim
  rationale: Die Präposition מן bezeichnet Herkunft oder Ausgangspunkt; „aus Efraim“ lässt die genaue Beziehung bewusst offen.
- source_word: ממלכת חמס
  choice: ein Reich des Unrechts
  rationale: חמס kann Gewalt, Unrecht und Frevel bezeichnen. Die Genitivformulierung bewahrt diese Bedeutungsbreite besser als ein engeres Adjektiv.
theological_decisions:
- issue: Charakterisierung des aus Efraim hervorgehenden Reiches
  choice: Reich des Unrechts
  alternative: Gewaltreich; rebellisches Reich; ungehorsames Reich
  rationale: Das Hebräische חמס betont Unrecht bis hin zu Gewalt, während das griechische ἀπειθῆ Ungehorsam oder Auflehnung hervorhebt. „Reich des Unrechts“ hält die moralische Verurteilung fest, ohne sie allein auf körperliche Gewalt oder politischen Aufruhr einzuengen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die elliptische zweite Satzhälfte folgt dem hebräischen Wortlaut und ergänzt kein dort fehlendes Verb. Die Fußnotenmarker stehen jeweils an der sachlich passenden Stelle.
