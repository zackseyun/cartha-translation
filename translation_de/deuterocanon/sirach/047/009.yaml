  text: With songs in the gardens he made preparation before the altar[b][a], and he arranged the sound of psalm and harps.
translation:
  language: de
  text: Mit Liedern in den Gärten[a] traf er Vorbereitungen vor dem Altar, und den Klang von Psalmen und Harfen[b] ordnete er.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hebräische Ausdruck »mit Liedern in den Gärten« ist unsicher. Die griechische Parallelüberlieferung lautet sinngemäß: »Er stellte Sänger gegenüber dem Altar auf, damit sie durch ihren Klang die Melodien anmutig machten.« Das weist möglicherweise auf einen anderen hebräischen Ausgangstext oder auf eine verderbte Textstelle hin.'
    reason: textual_variant
  - marker: b
    text: 'Oder: »Leiern«; das hebräische Wort bezeichnet ein Saiteninstrument.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בגינות שיר
  choice: Mit Liedern in den Gärten
  rationale: Der überlieferte hebräische Wortlaut wird trotz seiner Schwierigkeit möglichst direkt wiedergegeben. בגינות bezeichnet seiner gewöhnlichen Form nach »in den Gärten«; mögliche Emendationen oder die abweichende griechische Überlieferung werden nicht stillschweigend in den Haupttext übernommen.
- source_word: הכין
  choice: traf er Vorbereitungen
  rationale: הכין kann »vorbereiten, bereitmachen, einrichten« bedeuten. Die Formulierung wahrt, dass im Hebräischen kein ausdrückliches Objekt genannt ist.
- source_word: לפני מזבח
  choice: vor dem Altar
  rationale: Direkte und im kultischen Zusammenhang natürliche Wiedergabe der Präpositionalgruppe.
- source_word: וקול
  choice: und den Klang
  rationale: קול kann »Stimme« oder »Klang« heißen; zusammen mit Psalm und Saiteninstrumenten ist »Klang« sachlich und idiomatisch passend.
- source_word: מזמור
  choice: Psalmen
  rationale: מזמור bezeichnet ein musikalisches Lied, häufig einen Psalm; der kultisch-liturgische Zusammenhang spricht für »Psalmen«.
- source_word: ונבלים
  choice: und Harfen
  rationale: נבלים bezeichnet Saiteninstrumente, deren genaue Bauart nicht sicher mit modernen Instrumenten gleichzusetzen ist. »Harfen« ist verständlich und gebräuchlich; »Leiern« bleibt als Alternative in der Fußnote erhalten.
- source_word: תקן
  choice: ordnete er
  rationale: תקן bedeutet hier »ordnen, einrichten, festlegen«. »Ordnete« bewahrt den organisatorisch-musikalischen Sinn ohne zusätzliche Einzelheiten einzutragen.
theological_decisions:
- issue: Schwieriger hebräischer Wortlaut gegenüber der glatteren griechischen Parallelüberlieferung
  choice: Der Haupttext folgt dem erhaltenen Hebräisch; die deutlich abweichende griechische Fassung wird in einer Fußnote offengelegt.
  alternative: »Er stellte Sänger gegenüber dem Altar auf, damit sie durch ihren Klang die Melodien anmutig machten.«
  rationale: Die hebräische Quelle ist vorhanden, aber בגינות שיר ist schwierig und stimmt nicht mit dem Griechischen überein. Eine Harmonisierung würde die echte textgeschichtliche Spannung verdecken; deshalb bleibt der Haupttext hebräisch orientiert und die griechische Lesart wird transparent dokumentiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnliche Wendung »Mit Liedern in den Gärten« bleibt wegen der textlichen Unsicherheit bewusst stehen. Die leicht markierte Wortstellung im zweiten Satzteil bildet die hebräische Konstruktion ab, bleibt aber verständlich.
