base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/047/001.yaml
  text: And after him Nathan arose[a], to stand before David.
translation:
  language: de
  text: Und nach ihm trat Nathan auf[a], um vor David zu stehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Parallele lautet: „Nathan trat auf, um in den Tagen Davids prophetisch zu reden.“ Im Hebräischen steht: „um vor David zu stehen“.'
    reason: alternative_reading
lexical_decisions:
- source_word: וגם
  choice: Und
  rationale: Leitet die Fortsetzung des vorangehenden Zusammenhangs ein. Die zusätzliche Nuance von גם wird im Deutschen durch die fortführende Konjunktion ausreichend mitgetragen.
- source_word: אחריו
  choice: nach ihm
  rationale: Bezeichnet die zeitliche beziehungsweise persönliche Nachfolge auf die zuvor genannte Gestalt und bewahrt den personalen Bezug.
- source_word: עמד
  choice: trat … auf
  rationale: Das Verb bedeutet wörtlich „stand/erhob sich“, bezeichnet hier aber idiomatisch Nathans Auftreten in der Abfolge. „trat auf“ ist natürliches Deutsch und stimmt zugleich mit dem griechischen ἀνέστη als öffentlichem Hervortreten überein.
- source_word: נתן
  choice: Nathan
  rationale: Der Personenname wird in seiner geläufigen deutschen biblischen Form wiedergegeben.
- source_word: להתיצב
  choice: um … zu stehen
  rationale: Der Hitpael-Infinitiv von יצב bezeichnet das Sich-Hinstellen beziehungsweise Einnehmen eines Standes. Die knappe Wiedergabe bleibt nahe am Hebräischen, ohne eine bestimmte Funktion ausdrücklich hinzuzufügen.
- source_word: לפני דוד
  choice: vor David
  rationale: Folgt dem erhaltenen hebräischen Wortlaut. Das Griechische bietet abweichend „in den Tagen Davids“, was in der Fußnote dokumentiert wird.
theological_decisions:
- issue: Nathans Verhältnis zu David im Schlusssatz
  choice: vor David
  alternative: in den Tagen Davids
  rationale: Der erhaltene hebräische Text ist hier die primäre Grundlage und beschreibt Nathans Stellung „vor David“. Die griechische Parallele versteht die Aussage zeitlich und ergänzt seine prophetische Tätigkeit; diese bedeutungsvolle Textabweichung wird nicht in den Haupttext eingemischt, sondern transparent in der Fußnote bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „trat … auf“ gibt das sukzessive Hervortreten idiomatisch wieder; der ungewöhnlichere hebräische Schluss bleibt bewusst nah am Wortlaut, damit seine Offenheit nicht durch eine Funktionsbezeichnung wie „als Prophet“ aufgelöst wird.
