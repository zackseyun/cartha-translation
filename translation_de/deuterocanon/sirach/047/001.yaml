  source_fidelity: 'Der Haupttext folgt dem erhaltenen Hebräisch: וגם אחריו עמד נתן להתיצב לפני דוד. „Und nach ihm“ bewahrt die sukzessive persönliche Bezugnahme, „trat Nathan auf“ gibt עמד idiomatisch als Hervortreten wieder, und „um vor David zu stehen“ hält die bewusst offene Formel להתיצב לפני דוד ohne sachlich nicht belegte Präzisierung fest. Die abweichende griechische Parallele wird zutreffend als solche ausgewiesen.'
