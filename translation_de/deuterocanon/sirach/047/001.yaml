  terminology: „Nathan“ entspricht der geläufigen deutschen biblischen Namensform. Es werden weder eine bestimmte Amtsfunktion noch eine konfessionell geprägte Deutung in den Haupttext eingetragen. Die Fußnote bildet den griechischen Bezug auf prophetische Tätigkeit verständlich ab.
