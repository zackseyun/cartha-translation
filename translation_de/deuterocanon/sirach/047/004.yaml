base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/047/004.yaml
  text: In his youth he struck down a warrior and removed everlasting disgrace[a]; when he raised his hand with the sling[b], he shattered the glory of Goliath.
translation:
  language: de
  text: In seiner Jugend schlug er einen Krieger nieder und beseitigte ewige Schande[a]. Als er seine Hand mit der Schleuder erhob[b], zerbrach er Goliats Ruhm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Griechisch: „und nahm die Schande vom Volk“. Hebräisch: „und beseitigte ewige Schande“.'
    reason: alternative_reading
  - marker: b
    text: Das Griechische spricht ausdrücklich von einem Riesen und von einem Schleuderstein; außerdem heißt es dort, David habe Goliats Prahlen oder Stolz zu Fall gebracht.
    reason: lexical_alternative
lexical_decisions:
- source_word: בנעוריו
  choice: In seiner Jugend
  rationale: Gibt die zeitliche Bedeutung des Hebräischen natürlich und ohne unnötige Festlegung auf ein bestimmtes Alter wieder.
- source_word: הכה גבור
  choice: schlug er einen Helden nieder
  rationale: גבור bezeichnet einen starken, mächtigen oder kriegstüchtigen Mann. „Held“ bewahrt die mögliche Ehrenbezeichnung und den Bezug auf Goliat; „niederschlagen“ lässt hier den tödlichen Ausgang erkennen, ohne das griechische „Riesen“ in den Haupttext zu übernehmen.
- source_word: ויסר חרפת עולם
  choice: und beseitigte ewige Schande
  rationale: Folgt dem erhaltenen Hebräisch mit עולם „ewig/dauerhaft“. „Schande“ ist im heutigen Deutsch verständlich und wahrt die starke Aussage.
- source_word: בהניפו ידו
  choice: Als er seine Hand ... erhob
  rationale: Gibt die begleitende Handlung des hebräischen Infinitivs wieder und bewahrt das konkrete Bild.
- source_word: על קלע
  choice: mit der Schleuder
  rationale: Die hebräische Wendung ist knapp und möglicherweise textlich schwierig; instrumentales „mit der Schleuder“ ergibt im Kontext einen natürlichen Sinn. Das Griechische nennt ausdrücklich einen Schleuderstein.
- source_word: וישבר תפארת גלית
  choice: zerbrach er Goliats Ruhm
  rationale: תפארת kann Ruhm, Pracht oder stolzes Prahlen bedeuten. „Ruhm“ bewahrt die Breite des Hebräischen und die bildhafte Verbindung mit „zerbrechen“.
theological_decisions:
- issue: Abweichung zwischen Hebräisch und Griechisch bei der beseitigten Schande
  choice: Im Haupttext steht nach dem Hebräischen „beseitigte ewige Schande“.
  alternative: 'Nach dem Griechischen: „nahm die Schande vom Volk“.'
  rationale: Wo der hebräische Sirachtext erhalten ist, bildet er hier die Grundlage. Die griechische Lesart wird als bedeutsame Textvariante in der Fußnote dokumentiert.
- issue: Bezeichnung Goliats
  choice: Das hebräische גבור wird mit „Held“ wiedergegeben.
  alternative: Das Griechische bezeichnet ihn ausdrücklich als „Riesen“.
  rationale: Die Übersetzung soll die hebräische Ausdrucksweise nicht durch die explizitere griechische Deutung ersetzen. Der unmittelbare Goliat-Bezug ist im zweiten Satz ohnehin eindeutig.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper poetischer Satzführung. Die ungewöhnliche Bildsprache „Goliats Ruhm zerbrechen“ wurde bewusst bewahrt. Alle Fußnotenmarker stehen im Haupttext.
