  terminology: „Gott, dem Höchsten“ ist als dative Apposition nach „zu“ korrekt und dem hebräischen Gottesnamen angemessen. „Horn Israels“ bewahrt die biblische Metapher; die Fußnote erläutert sie sachgerecht und konfessionsneutral.
