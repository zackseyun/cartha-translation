base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/047/005.yaml
  text: For he called on God Most High[a], and he gave strength to his right hand[b], to drive back a man skilled in war and to raise up the horn of Israel.
translation:
  language: de
  text: Denn er rief zu Gott, dem Höchsten[a], und Gott gab seiner rechten Hand Kraft, um einen kriegserfahrenen Mann zurückzudrängen und das Horn Israels aufzurichten[b].
  philosophy: optimal-equivalence
  footnotes:
