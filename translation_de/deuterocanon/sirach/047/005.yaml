    text: 'Die griechische Überlieferung lautet: „den Herrn, den Höchsten“.'
    reason: alternative_reading
  - marker: b
    text: Das „Horn“ ist ein biblisches Bild für Stärke, Ehre oder Macht.
    reason: lexical_alternative
lexical_decisions:
- source_word: קרא אל
  choice: rief zu
  rationale: Die Wendung bezeichnet das hilfesuchende Anrufen Gottes; „rief zu“ ist im Deutschen natürlich und bewahrt den Gebetscharakter.
- source_word: אל עליון
  choice: Gott, dem Höchsten
  rationale: Diese Wiedergabe folgt dem hebräischen Haupttext eng. Der abweichende Gottesname der griechischen Parallele wird in einer Fußnote bewahrt.
- source_word: ויתן בימינו עז
  choice: der gab seiner rechten Hand Kraft
  rationale: Das Subjekt ist dem Zusammenhang nach Gott, während die rechte Hand David gehört. Die körperhafte Vorstellung des Hebräischen bleibt erhalten.
- source_word: להדוף
  choice: zurückzuschlagen
  rationale: Das Verb bezeichnet ein Zurückstoßen oder Abwehren; im militärischen Zusammenhang ist „zurückschlagen“ prägnant, ohne die Art des Sieges näher festzulegen.
- source_word: איש יודע מלחמות
  choice: einen kriegserfahrenen Mann
  rationale: Die wörtliche Vorstellung eines Mannes, der Kriege kennt, wird als militärische Erfahrung verständlich wiedergegeben; wahrscheinlich ist Goliat gemeint, ohne ihn ausdrücklich zu nennen.
- source_word: ולהרים את קרן ישראל
  choice: das Horn Israels aufzurichten
  rationale: Das biblische Bild des Horns wird erhalten; es bezeichnet Stärke, Ehre oder Macht und wird in der Fußnote erläutert.
theological_decisions:
- issue: Gottesbezeichnung bei geringfügig voneinander abweichendem hebräischem und griechischem Zeugnis
  choice: Gott, dem Höchsten
  alternative: den Herrn, den Höchsten
  rationale: Der hebräische Haupttext lautet אל עליון, „Gott, der Höchste“. Die griechische Parallele hat „den Herrn, den Höchsten“. Wegen des Vorrangs des hebräischen Ausgangstextes steht dessen Lesart im Haupttext; die griechische Form wird als echte Textabweichung in der Fußnote genannt.
- issue: Bezug der Fürwörter in ויתן בימינו עז
  choice: Gott gab Davids rechter Hand Kraft
  alternative: David gab seiner eigenen rechten Hand Kraft
  rationale: 'Der syntaktisch und kontextuell naheliegende Subjektwechsel wird ausdrücklich verdeutlicht: Der angerufene Gott verleiht David Kraft. So bleibt die Aussage göttlicher Befähigung erhalten, ohne über den Text hinauszugehen.'
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewahrter biblischer Bildsprache. Die Satzstruktur bleibt dem poetisch-weisheitlichen Stil des Ausgangstextes nahe, ohne unnötig altertümlich zu wirken.
