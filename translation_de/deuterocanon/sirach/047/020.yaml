base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/047/020.yaml
  text: You put a blemish on your honor[a], and profaned your bed[b], bringing wrath on your offspring and groaning on your couch.
translation:
  language: de
  text: Du hast deiner Ehre einen Makel zugefügt und dein Bett entweiht[a]. So brachtest du Zorn über deine Nachkommen und Seufzen auf deinem Lager[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Text hat hier: »und hast deinen Samen entweiht« statt »und dein Bett entweiht«.'
    reason: textual_variant
  - marker: b
    text: 'Der griechische Text endet: »und Schmerz über deine Torheit« statt »und Seufzen auf deinem Lager«.'
    reason: textual_variant
lexical_decisions:
- source_word: ותתן מום בכבודך
  choice: Du hast deiner Ehre einen Makel zugefügt
  rationale: Die hebräische Wendung bedeutet wörtlich etwa »du gabst einen Makel an/in deine Ehre«. Die gewählte Formulierung ist im Deutschen natürlich, bewahrt aber das konkrete Bild einer befleckten königlichen Würde.
- source_word: ותחלל
  choice: und … entweiht
  rationale: Das Piel von חלל bezeichnet das Profanieren oder Entweihen. »Entweiht« erhält die starke religiös-moralische Bedeutung.
- source_word: יצועיך
  choice: dein Bett
  rationale: Das Wort bezeichnet Bett oder Lager und hat hier einen sexuellen Beiklang. »Dein Bett« ist knapp und verständlich; der griechische Paralleltext bietet abweichend »deinen Samen«.
- source_word: להביא אף
  choice: So brachtest du Zorn
  rationale: Der Infinitiv bezeichnet hier Folge beziehungsweise Ergebnis. Ein neuer deutscher Satz mit »So« macht den Zusammenhang klar, ohne die Kausalität enger festzulegen, als der hebräische Text es verlangt.
- source_word: על צאצאיך
  choice: über deine Nachkommen
  rationale: צאצאים bezeichnet Nachkommen oder Nachkommenschaft. »Nachkommen« passt zu den dynastischen Folgen im Zusammenhang und ist weiter als »Kinder«.
- source_word: ואנחה
  choice: und Stöhnen
  rationale: אנחה kann Seufzen, Stöhnen oder Klage bedeuten. »Stöhnen« gibt die Schwere der persönlichen Folge wieder und lässt die knappe Nominalfügung des Hebräischen erkennen.
- source_word: על משכבך
  choice: auf dein Lager
  rationale: משכב ist eine Liegestatt, ein Bett oder Lager. »Lager« vermeidet eine rein stilistische Wiederholung von »Bett«, bewahrt jedoch die Verbindung der beiden ähnlichen hebräischen Begriffe.
theological_decisions:
- issue: Verhältnis der Schlussaussage zu Salomos Verfehlung und ihren Folgen
  choice: Der Vers verbindet die Entweihung seines Bettes mit Zorn über seine Nachkommen und mit seinem eigenen Stöhnen auf dem Lager.
  alternative: Nach dem griechischen Text endet der Vers mit Schmerz beziehungsweise Bestürzung über seine Torheit, nicht mit Stöhnen auf seinem Lager.
  rationale: Der vorliegende hebräische Text nennt in beiden Vershälften ausdrücklich Bett beziehungsweise Lager und stellt dadurch eine bewusste Verbindung zwischen Verfehlung und Folge her. Die abweichende griechische Textform wird in den Fußnoten dokumentiert, aber nicht in den hebräischen Haupttext eingetragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die konkrete Bildsprache von Makel, Bett und Lager bleibt erhalten; die beiden griechischen Abweichungen werden transparent in Fußnoten ausgewiesen.
