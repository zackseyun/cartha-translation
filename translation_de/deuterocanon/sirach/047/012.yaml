  text: Because of him there stood up after him an intelligent son[a], who lived in security.
translation:
  language: de
  text: Seinetwegen trat nach ihm ein verständiger Sohn auf[a], der in Sicherheit lebte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Griechisch: „Nach ihm trat ein verständiger Sohn auf, und seinetwegen ließ er sich in weitem Raum nieder.“ Der hebräische Text lautet: „der in Sicherheit lebte“.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּבַעֲבוּרוֹ
  choice: Seinetwegen
  rationale: Die Präposition mit עֲבוּר bezeichnet hier Ursache oder Begünstigung. „Seinetwegen“ bewahrt die knappe Verknüpfung mit dem Vorgänger, ohne sie näher auszudeuten.
- source_word: עָמַד אַחֲרָיו
  choice: trat nach ihm … auf
  rationale: עָמַד bedeutet wörtlich „stehen“, kann in einem Nachfolgekontext aber das Auftreten beziehungsweise Nachfolgen bezeichnen. Die Wendung ist im Deutschen natürlich und erhält das Bild des Auftretens, ohne ausdrücklich „folgte ihm auf“ zu sagen.
- source_word: בֵּן מַשְׂכִּיל
  choice: ein verständiger Sohn
  rationale: מַשְׂכִּיל bezeichnet einen einsichtigen, verständigen Menschen. „Verständig“ gibt diesen kognitiven und praktischen Sinn wieder, ohne das weiter gefasste deutsche „weise“ aufzudrängen.
- source_word: שׁוֹכֵן לָבֶטַח
  choice: der in Sicherheit lebte
  rationale: שׁוֹכֵן bezeichnet das Wohnen oder dauerhafte Leben, לָבֶטַח Sicherheit beziehungsweise Ungefährdetheit. Die Formulierung ist gegenwärtiges, gut verständliches Deutsch und bleibt eng am hebräischen Sinn.
theological_decisions:
- issue: Beziehung zwischen dem Vorgänger und der sicheren Lebenslage des Sohnes
  choice: Die günstige Lage des Sohnes wird durch „Seinetwegen“ mit dem Vorgänger verbunden, ohne Art oder Reichweite dieser Verbindung zu bestimmen.
  alternative: 'Nach der griechischen Satzordnung könnte man verstehen: „Nach ihm trat ein verständiger Sohn auf, und seinetwegen ließ er sich in weitem Raum nieder.“'
  rationale: Der hebräische Wortlaut verbindet Ursache beziehungsweise Begünstigung, Nachfolge und sicheres Wohnen knapp miteinander. Die Übersetzung erhält diese Verbindung, ohne daraus eine weitergehende dynastische oder theologische Aussage abzuleiten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Trat … auf“ vermeidet sowohl unnatürlichen Hebraismus als auch die stärkere Festlegung von „folgte ihm auf“; „in Sicherheit lebte“ ist idiomatisch und gibt den hebräischen Haupttext vorrangig wieder.
