translation:
  language: de
  text: Durch Lied[a], Sprichwort, Rätsel und kunstvolle Rede hast du die Völker in Staunen versetzt.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Griechisch: „In Liedern und Sprichwörtern und Gleichnissen und in Auslegung staunten Länder über dich.“ Damit wird das weitreichende Staunen ausdrücklich wiedergegeben; zugleich bietet der griechische Text „Auslegung“ als mögliche Entsprechung zu „kunstvolle Rede“.'
    reason: alternative_reading
  - marker: b
    text: 'Das hebräische Verb ist an dieser Stelle schwierig. Die Übersetzung folgt seinem möglichen Sinn „aufwühlen, erregen“ und berücksichtigt zugleich die klarere griechische Parallele: „staunten über dich“.'
    reason: textual_variant
lexical_decisions:
- source_word: בשיר
  choice: Durch Lied
  rationale: Die Präposition ב kann hier das Mittel bezeichnen. „Durch Lied“ gibt diesen instrumentalen Sinn knapp wieder; das griechische ἐν ᾠδαῖς („in Liedern“) bestätigt den Bezug auf poetischen Gesang.
- source_word: משל
  choice: Sprichwort
  rationale: משל bezeichnet in der Weisheitsliteratur häufig einen Weisheitsspruch oder ein Sprichwort. „Sprichwort“ ist hier natürlich und unterscheidet den Ausdruck vom folgenden „Rätsel“.
- source_word: חידה
  choice: Rätsel
  rationale: חידה bezeichnet regelmäßig ein Rätsel oder einen bewusst dunklen, enigmatischen Ausspruch. „Rätsel“ ist die klare moderne Entsprechung.
- source_word: ומליצה
  choice: und kunstvolle Rede
  rationale: מליצה kann eine kunstvoll formulierte oder gehobene Rede bezeichnen, daneben auch Deutung oder Auslegung. Im hebräischen Verzeichnis literarischer Formen passt „kunstvolle Rede“ gut; die abweichende griechische Wiedergabe wird in der Fußnote bewahrt.
- source_word: עמים
  choice: die Völker
  rationale: עמים ist der Plural von עם und bezeichnet hier mehrere Völker. „Die Völker“ wahrt den kollektiven Plural, ohne moderne Nationalstaaten vorauszusetzen.
- source_word: הסערתה
  choice: hast du … in Staunen versetzt
  rationale: Die schwierige Form hängt wohl mit סער („aufwühlen, erregen“) zusammen. Die Übersetzung bewahrt die Wirkung starken Aufsehens, formuliert sie aber im Deutschen natürlich; die griechische Parallele („Länder staunten über dich“) stützt den Sinn des Staunens.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle Standardsprache mit einer rhythmischen Aufzählung. „Kunstvolle Rede“ bewahrt den gehobenen Charakter von מליצה, ohne altertümlich zu wirken. Die textliche Unsicherheit des Schlussverbs wird nicht verdeckt, sondern in der Fußnote erläutert.
