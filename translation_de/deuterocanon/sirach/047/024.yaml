base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/047/024.yaml
  text: A broad folly and lacking understanding was Rehoboam[a], who caused the people to revolt by his counsel, until one arose—may there be no remembrance of him—Jeroboam son of Nebat[b], who sinned and caused Israel to sin.
translation:
  language: de
  text: 'Ein Ausbund an Torheit und ohne Einsicht war Rehabeam[a]; durch seinen Rat brachte er das Volk zum Abfall, bis einer auftrat – möge keine Erinnerung an ihn bleiben –: Jerobeam, der Sohn Nebats[b], der sündigte und Israel zur Sünde verleitete.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der hebräische Text ist hier stark verdichtet, und die Versgliederung ist unsicher. Die griechische Überlieferung bietet eine vollständigere Satzform.
    reason: textual_variant
  - marker: b
    text: Die griechische Fassung fügt hinzu, Jerobeam habe „Ephraim einen Weg zur Sünde eröffnet“. Diese Worte stehen in der hier erhaltenen hebräischen Zeile nicht ausdrücklich.
    reason: textual_variant
lexical_decisions:
- source_word: רחב אולת
  choice: ein Ausbund an Torheit
  rationale: Die überlieferte hebräische Wendung ist ungewöhnlich und wohl komprimiert. Die idiomatische Wiedergabe bezeichnet Rehabeam als Inbegriff großer Torheit, ohne die schwer zu sichernde Konstruktion unnötig zu glätten.
- source_word: חסר בינה
  choice: ohne Einsicht
  rationale: Direkte und natürliche Wiedergabe der hebräischen Charakterisierung; sie entspricht auch dem griechischen ἐλαττούμενον συνέσει.
- source_word: רחבעם
  choice: Rehabeam
  rationale: Im Deutschen gebräuchliche biblische Namensform.
- source_word: הפריע בעצתו עם
  choice: durch seinen Entschluss brachte er das Volk zum Abfall
  rationale: Das Hebräische ist schwierig; die griechische Parallele stützt den Sinn, dass Rehabeams eigener Beschluss beziehungsweise seine Politik den Abfall des Volkes auslöste. „Abfall“ lässt den politischen Bruch erkennen, ohne die Formulierung auf eine rein militärische Revolte festzulegen.
- source_word: עד אשר קם, אל יהי לו זכר
  choice: Dann trat einer auf – möge keine Erinnerung an ihn bleiben –
  rationale: Gibt beide erhaltenen hebräischen Aussagen wieder. „Dann“ fasst עד אשר im instabilen Zusammenhang idiomatisch, während der eingeschobene Fluch in seiner Schärfe erhalten bleibt.
- source_word: ירבעם בן נבט
  choice: Jerobeam, der Sohn Nebats
  rationale: Im Deutschen übliche biblische Namensformen.
- source_word: חטא והחטיא את ישראל
  choice: der sündigte und Israel zur Sünde verleitete
  rationale: Bewahrt die Unterscheidung zwischen eigenem Sündigen und dem kausativen Verführen Israels zur Sünde.
theological_decisions:
- issue: Verhältnis des komprimierten hebräischen Textes zur vollständigeren griechischen Parallele
  choice: Der gemeinsame Kern über Rehabeam und Jerobeam wird als zusammenhängender Text wiedergegeben; die im Hebräischen ausdrücklich erhaltene Verwünschung bleibt stehen.
  alternative: Der griechischen Fassung vollständig folgen und ergänzen, Jerobeam habe Ephraim einen Weg zur Sünde eröffnet.
  rationale: Das Hebräische bleibt die Hauptgrundlage, während die griechische Parallele die schwierige Syntax und den Sinn von Rehabeams Handeln erhellt. Die nur griechisch ausdrücklich belegte Ephraim-Klausel wird nicht in den Haupttext aufgenommen.
- issue: Bedeutung von הפריע בעצתו עם
  choice: Rehabeam brachte das Volk durch seinen Entschluss zum Abfall.
  alternative: Rehabeam spaltete das Volk durch seinen Rat.
  rationale: Sowohl Abfall als auch Spaltung sind textlich möglich. Die gewählte Fassung folgt dem politischen Sinn der griechischen Parallele, ohne eine zusätzliche theologische Deutung einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Ausbund an Torheit“ bewahrt die ungewöhnliche Intensität der hebräischen Wendung; „zum Abfall bringen“ bezeichnet verständlich den politischen Bruch. Die Parenthese erhält den abrupten, verurteilenden Ton des Ausgangstextes.
