revisions:
- from: 'Ein Ausbund an Torheit und ohne Einsicht war Rehabeam[a]; durch seinen Entschluss brachte er das Volk zum Abfall. Dann trat einer auf – möge keine Erinnerung an ihn bleiben –: Jerobeam, der Sohn Nebats[b], der sündigte und Israel zur Sünde verleitete.'
  to: 'Ein Ausbund an Torheit und ohne Einsicht war Rehabeam[a]; durch seinen Rat brachte er das Volk zum Abfall, bis einer auftrat – möge keine Erinnerung an ihn bleiben –: Jerobeam, der Sohn Nebats[b], der sündigte und Israel zur Sünde verleitete.'
  rationale: 'Die Revision beschränkt sich auf zwei sichere Korrekturen: עד אשר wird mit „bis“ statt mit dem ungenauen „Dann“ wiedergegeben, und בעצתו wird mit dem semantisch weiteren „durch seinen Rat“ übersetzt. Die umstrittene bzw. verdichtete Satzstruktur, die Verwünschung und die nicht ausdrücklich hebräisch bezeugte Ephraim-Ergänzung bleiben transparent behandelt.'
