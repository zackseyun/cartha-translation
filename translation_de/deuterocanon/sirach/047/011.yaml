  yaml_path: translation/deuterocanon/sirach/047/011.yaml
  text: Yahweh also passed over his transgression[a], and exalted his horn forever; he gave him a decree of kingship[b], and established his throne in Jerusalem.
translation:
  language: de
  text: Auch der HERR ging über seine Übertretung[a] hinweg und erhöhte sein Horn für immer. Er gab ihm eine Ordnung des Königtums[b] und festigte seinen Thron bis hin nach Jerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Griechisch: „Der Herr nahm seine Sünden weg.“ Das Hebräische sagt wörtlicher: „ließ seine Übertretung vorübergehen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Griechisch: „Er gab ihm einen Bund der Könige und einen Thron der Herrlichkeit in Israel.“ Das Hebräische lautet: „eine Ordnung des Königtums“ und „festigte seinen Thron bis hin nach Jerusalem“.'
    reason: alternative_reading
lexical_decisions:
- source_word: יהוה
  choice: der HERR
  rationale: Die in deutschen Bibeln etablierte Wiedergabe des Gottesnamens wahrt den Bezug auf JHWH, ohne eine unsichere Aussprache in den Haupttext zu setzen.
- source_word: העביר
  choice: ließ … vorübergehen
  rationale: Bewahrt das Bild des hebräischen Kausativverbs genauer als eine explizierende Wiedergabe wie „vergab“ oder „nahm weg“.
- source_word: פשעו
  choice: seine Verfehlung
  rationale: Gibt den konkreten schuldhaften Übertritt verständlich wieder; „Auflehnung“ wäre möglich, im Kontext aber stärker deutend.
- source_word: וירם … קרנו
  choice: erhöhte sein Horn
  rationale: Erhält das biblische Bild des Horns für Macht, Würde und königliche Stärke, statt es im Haupttext aufzulösen.
- source_word: לעולם
  choice: für immer
  rationale: Natürliche Wiedergabe des dauerhaften beziehungsweise dynastischen Sinnes.
- source_word: חוק ממלכת
  choice: eine Ordnung des Königtums
  rationale: „Ordnung“ bewahrt die rechtlich-festsetzende Kraft von חוק; „des Königtums“ gibt ממלכת wieder, ohne die abweichende griechische Lesart „Bund der Könige“ einzutragen.
- source_word: וכסאו הכין
  choice: und festigte seinen Thron
  rationale: הכין bezeichnet hier das Festmachen beziehungsweise dauerhafte Begründen des Thrones; „festigte“ ist präzise und idiomatisch.
- source_word: עד ירושלים
  choice: bis nach Jerusalem
  rationale: Folgt der gewöhnlichen Richtungs- beziehungsweise Ausdehnungsbedeutung von עד. Die ungewöhnliche Formulierung bleibt sichtbar, statt stillschweigend zu „in Jerusalem“ geglättet zu werden.
theological_decisions:
- issue: Gottes Handeln gegenüber Davids Schuld
  choice: Der HERR ließ seine Verfehlung vorübergehen.
  alternative: Der Herr nahm seine Sünden weg / vergab seine Verfehlung.
  rationale: Der Haupttext wahrt das hebräische Bild und bezeugt göttliche Schuldaufhebung, ohne deren theologischen Mechanismus weiter auszudeuten. Die griechische Parallele wird in der Fußnote dokumentiert.
- issue: Art der dynastischen Gewährung
  choice: eine Ordnung des Königtums
  alternative: einen Bund der Könige / einen königlichen Bund
  rationale: Der erhaltene hebräische Text hat חוק ממלכת und ist daher Grundlage des Haupttextes. Die bedeutende griechische Variante διαθήκην βασιλέων wird nicht harmonisiert, sondern in der Fußnote bewahrt.
- issue: Ort beziehungsweise Reichweite des gefestigten Thrones
  choice: bis nach Jerusalem
  alternative: in Jerusalem / in Israel
  rationale: Die schwierige hebräische Wendung עד ירושלים wird formal erhalten. Die griechische Parallele bietet mit „in Israel“ eine andere Ortsangabe, die in der Fußnote kenntlich gemacht wird.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst bewahrter biblischer Bildsprache. Die ungewohnte Wendung „bis nach Jerusalem“ spiegelt die Mehrdeutigkeit beziehungsweise mögliche Textschwierigkeit des hebräischen Zeugnisses; die Fußnote stellt die deutlich abweichende griechische Überlieferung bereit.
