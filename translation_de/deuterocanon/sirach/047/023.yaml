  yaml_path: translation/deuterocanon/sirach/047/023.yaml
  text: And he gave a remnant to Jacob[a], and to the house of David a root from him. And Solomon lay down with his fathers[c][b], and left behind him one of his offspring.
translation:
  language: de
  text: Und er gab Jakob einen Rest und dem Haus David eine Wurzel aus ihm[a]. Salomo ruhte bei seinen Vätern[b] und hinterließ einen Nachkommen[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „eine Wurzel aus ihm“. Das Bild kann auf den Fortbestand der davidischen Linie weisen und auch mit „ein Nachkomme aus ihm“ wiedergegeben werden.
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort an dieser Stelle ist in dieser Überlieferung unsicher. Die griechische Parallele liest „bei seinen Vätern“; ihr wird hier gefolgt.
    reason: textual_variant
  - marker: c
    text: 'Auch möglich: „einen Erben“ oder „einen Spross“. Das hebräische Wort ist selten beziehungsweise unsicher; im Zusammenhang bezeichnet es einen Nachfolger aus Salomos eigener Linie.'
    reason: alternative_reading
lexical_decisions:
- source_word: שארית / κατάλιμμα
  choice: einen Rest
  rationale: Das hebräische שארית und das griechische κατάλιμμα bezeichnen das, was übrig bleibt oder bewahrt wird. „Rest“ ist im Deutschen verständlich und bewahrt den Gedanken einer fortbestehenden Linie.
- source_word: שרש / ῥίζαν
  choice: eine Wurzel
  rationale: Beide Quellwörter bedeuten wörtlich „Wurzel“. Das Bild für den Fortbestand des Hauses David wird beibehalten und nicht durch eine bloße Deutung wie „Nachkomme“ ersetzt.
- source_word: וישכב ... / ἀνεπαύσατο
  choice: legte sich zu seinen Vätern
  rationale: Die Formulierung gibt die biblische Todeswendung wieder. Der schwierige hebräische Wortlaut wird dabei mithilfe der griechischen Parallele „mit den Vätern“ erschlossen.
- source_word: מיושש
  choice: zu seinen Vätern
  rationale: Die überlieferte hebräische Form ist an dieser Stelle unsicher. Die griechische Parallele μετὰ τῶν πατέρων stützt deutlich die Lesart „zu/bei seinen Vätern“.
- source_word: מנון
  choice: einen Nachkommen
  rationale: Das seltene beziehungsweise unsichere hebräische Wort bezeichnet im Zusammenhang offenbar jemanden aus Salomos eigener Linie, den er als Nachfolger hinterließ. „Nachkomme“ wahrt diese Aussage, ohne sie unnötig auf „Sohn“ oder „Erbe“ zu verengen.
theological_decisions:
- issue: Dynastische Verheißung im Bild von der Wurzel
  choice: Das Wurzelbild für den Fortbestand der davidischen Linie bleibt erhalten, ohne es ausdrücklich messianisch auszudeuten.
  alternative: „einen Nachkommen aus ihm“ oder ausdrücklich „eine messianische Wurzel“
  rationale: Der Vers spricht vom Fortbestand des Hauses David. Das Bild kann weitergehende theologische Resonanzen haben, doch der Wortlaut selbst verlangt keine ausdrückliche messianische Festlegung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter biblischer Bildsprache. Die ungewohnte Wendung „eine Wurzel aus ihm“ bleibt als echtes Bild des Ausgangstextes stehen und wird in der Fußnote erläutert; die textkritische Unsicherheit im zweiten Satz wird offengelegt.
