base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/047/022.yaml
  text: But God will not abandon mercy[a], nor let any of his words fall to the ground. He will not cut off offspring and posterity from his chosen one[b], and he will not destroy the seed of the one who loved him.
translation:
  language: de
  text: Doch Gott gibt seine Barmherzigkeit nicht auf[a] und lässt keines seiner Worte zu Boden fallen. Er wird die Nachkommen und Kindeskinder seines Erwählten nicht ausrotten[b] und die Nachkommenschaft dessen, der ihn liebte, nicht vernichten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Paralleltext lautet: „Doch der Herr wird seine Barmherzigkeit gewiss nicht aufgeben und keines seiner Werke verderben.“ Im Hebräischen steht stattdessen: „und lässt keines seiner Worte zu Boden fallen.“'
    reason: textual_variant
  - marker: b
    text: Die hebräische Form, die hier mit „seines Erwählten“ wiedergegeben ist, kann auch als „seiner Erwählten“ (Plural) verstanden werden; der griechische Paralleltext stützt den Singular.
    reason: alternative_reading
lexical_decisions:
- source_word: אל
  choice: Gott
  rationale: Das hebräische אל ist eine allgemeine Gottesbezeichnung; daher folgt „Gott“ dem primären hebräischen Zeugen genauer als das griechische Κύριος („Herr“).
- source_word: יטוש חסד
  choice: gibt seine Barmherzigkeit nicht auf
  rationale: „Aufgeben“ gibt das Nicht-Verlassen oder Nicht-Fahrenlassen verständlich wieder; das possessive „seine“ ist im Zusammenhang sinngemäß und wird vom griechischen Paralleltext ausdrücklich gestützt.
- source_word: ולא יפיל מדבריו ארצה
  choice: und lässt keines seiner Worte zu Boden fallen
  rationale: Die bildhafte hebräische Wendung bleibt erhalten und bezeichnet, dass keines von Gottes Worten wirkungslos bleibt; der abweichende griechische Text wird in der Fußnote dokumentiert.
- source_word: לא יכרית
  choice: rottet ... nicht aus
  rationale: Die Formulierung gibt das Beseitigen einer Abstammungslinie kräftig und im Deutschen idiomatisch wieder.
- source_word: לבחיריו
  choice: seinem Erwählten
  rationale: Die hebräische Form kann formal auch pluralisch verstanden werden; der griechische Paralleltext und der davidische Kontext stützen jedoch den Singular.
- source_word: נין ונכד
  choice: Nachkommen und Nachwelt
  rationale: Das Wortpaar bezeichnet die fortdauernde Linie über Generationen hinweg. Die zweigliedrige Wiedergabe bewahrt diese Aussage, ohne sie auf Sohn und Enkel zu verengen.
- source_word: זרע
  choice: Nachkommenschaft
  rationale: „Nachkommenschaft“ bewahrt hier den dynastischen Sinn von „Samen“, klingt im modernen Deutschen jedoch natürlicher.
- source_word: אובהו
  choice: dessen, der ihn liebte
  rationale: Die Form bezeichnet denjenigen, der Gott liebte; der griechische Aoristpartizip stützt die Vergangenheitsform und der Kontext weist wahrscheinlich auf David.
- source_word: ישמיד
  choice: vernichtet
  rationale: „Vernichten“ entspricht der Stärke des hebräischen Verbs, ohne zusätzliche Deutung einzutragen.
theological_decisions:
- issue: Gottesbezeichnung im ersten Satzteil
  choice: Gott
  alternative: der Herr
  rationale: Der primäre hebräische Text bietet אל („Gott“), während der griechische Paralleltext Κύριος („Herr“) liest. Der Haupttext folgt dem Hebräischen; die griechische Abweichung wird in der Variantenfußnote sichtbar gemacht.
- issue: Numerus von „Erwählter“ in der dynastischen Zusage
  choice: seinem Erwählten
  alternative: seinen Erwählten
  rationale: Die hebräische Form lässt eine pluralische Auffassung zu, doch das griechische ἐκλεκτοῦ αὐτοῦ ist singularisch und der Zusammenhang richtet sich auf die Linie Davids. Die verbleibende Mehrdeutigkeit wird in einer Fußnote bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Bildsprache vom zu Boden fallenden Wort bleibt bewusst erhalten; bei der Abstammungsterminologie wird zugunsten natürlicher Verständlichkeit „Nachkommenschaft“ statt des wörtlichen „Samen“ verwendet.
