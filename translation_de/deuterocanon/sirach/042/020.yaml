  text: No understanding is lacking to him, and no word has escaped him.
translation:
  language: de
  text: Keine Einsicht fehlt ihm, und kein Wort ist ihm entgangen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שכל
  choice: Einsicht
  rationale: Das hebräische שכל bezeichnet hier Einsicht bzw. verständiges Erfassen. „Einsicht“ ist im Deutschen natürlich und bewahrt den Erkenntnisbezug.
- source_word: דבר
  choice: Wort
  rationale: דבר kann „Wort“ oder „Sache“ bedeuten. Der griechische Paralleltext λόγος und die antithetisch parallele Aussage stützen hier „Wort“, ohne die Aussage unnötig auszudehnen.
- source_word: חלפו
  choice: ist … entgangen
  rationale: Die Wendung gibt das Vorübergehen bzw. unbemerkt Bleiben idiomatisch wieder und entspricht dem Sinn des griechischen οὐκ ἐκρύβη ἀπ’ αὐτοῦ.
theological_decisions:
- issue: Umfang göttlichen Wissens
  choice: Die beiden absoluten Verneinungen werden uneingeschränkt wiedergegeben.
  alternative: Abschwächende Formulierungen wie „kaum etwas“ oder eine erklärende Präzisierung.
  rationale: 'Der hebräische Text formuliert umfassend: keine Einsicht fehlt und kein Wort ist entgangen. Diese Spannung und Aussagekraft soll ohne dogmatische Erweiterung erhalten bleiben.'
translation_notes:
  register: Knapp, würdevoll und in modernem Standarddeutsch. Der Parallelismus des hebräischen Satzes bleibt erhalten.
