- from: 'Über die Zurechtweisung eines Unerfahrenen und eines Toren[a] und über einen alten Mann, der rückfällig wird und sich wegen Unzucht beraten lässt: Sei wirklich auf der Hut[b] und zurückhaltend vor allen Menschen.'
  to: 'Über die Zurechtweisung eines Unerfahrenen und eines Toren[a] sowie über einen alten Mann, der zurückkehrt und in Sachen sexueller Unmoral Rat einholt: Sei wirklich auf der Hut[b] und zurückhaltend vor allen Menschen.'
  rationale: Die Revision hält am hebräischen Haupttext fest, vermeidet aber bei ושב die nicht zwingende Festlegung auf einen Rückfall. Sie gibt die aktive Wendung נוטל עצה und den Sachbereich von בזנות genauer wieder und modernisiert lediglich den im Deutschen stark archaisch wirkenden Ausdruck „Unzucht“. Die vorhandenen Fußnotenanker bleiben erhalten; die griechische Abweichung wird weiterhin transparent dokumentiert.
