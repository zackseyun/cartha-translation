review_pass:
  verdict: revise
  source_fidelity: Der Entwurf folgt zu Recht dem erhaltenen hebräischen Text als Hauptzeugen und dokumentiert die stark abweichende griechische Parallelüberlieferung. „Rückfällig wird“ ist jedoch eine stärker festlegende Auslegung von ושב; „zurückkehrt“ bewahrt die hebräische Offenheit besser. „Sich wegen Unzucht beraten lässt“ verschiebt zudem die Präposition und macht den alten Mann eher zum Empfänger als zum Suchenden von Rat. „In Sachen sexueller Unmoral Rat einholt“ gibt נוטל עצה בזנות klarer und idiomatisch wieder.
  naturalness: Die Satzform mit zwei getrennten „über“-Gliedern ist verständlich, doch „sowie über“ bindet die Aufzählung geschlossener an die einleitende Themenangabe. „Sexuelle Unmoral“ ist im modernen Standarddeutsch verständlicher und weniger archaisch als „Unzucht“, ohne den weisheitlichen Registerton zu verlieren. Der Schlusssatz bleibt knapp und natürlich.
  terminology: „Zurechtweisung“, „Tor“, „auf der Hut“ und „zurückhaltend“ sind tragfähige Wiedergaben. „Unerfahrener“ kann die naive beziehungsweise leicht verführbare Person angemessen bezeichnen. Die griechische Fußnote muss die Lesart als Paralleltext und nicht als genaue historische Rekonstruktion kennzeichnen.
  issues:
  - severity: medium
    issue: Die Wiedergabe von ושב als „rückfällig wird“ legt einen moralischen Rückfall stärker fest als der hebräische Wortlaut.
    rationale: Das Verb bedeutet zunächst „zurückkehren/umkehren“. Im Kontext ist ein Rückfall möglich, aber nicht ausdrücklich bezeichnet; die Übersetzung sollte diese Deutung nicht zwingend machen.
  - severity: medium
    issue: „sich wegen Unzucht beraten lässt“ ist für נוטל עצה בזנות semantisch und syntaktisch weniger genau.
    rationale: נוטל עצה bezeichnet aktiv Rat nehmen bzw. Rat einholen. Die Präposition ב bezeichnet den Bereich beziehungsweise Zusammenhang; „wegen“ und die passive deutsche Konstruktion verändern diese Nuance.
  - severity: low
    issue: „Unzucht“ wirkt im Zielregister unnötig archaisch.
    rationale: „Sexuelle Unmoral“ bewahrt die breite ethische Bedeutung von זנות und ist in modernem Standarddeutsch transparenter.
