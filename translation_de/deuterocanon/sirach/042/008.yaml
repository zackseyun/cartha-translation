base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/042/008.yaml
  text: 'Concerning the discipline of a simpleton and a fool[a], and an old man who turns back and takes counsel in sexual immorality: be truly careful[b], and a modest man before every living being.'
translation:
  language: de
  text: 'Über die Zurechtweisung eines Unerfahrenen und eines Toren[a] sowie über einen alten Mann, der zurückkehrt und in Sachen sexueller Unmoral Rat einholt: Sei wirklich auf der Hut[b] und zurückhaltend vor allen Menschen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Parallelüberlieferung lautet in diesem Satzteil sinngemäß: „und über einen Hochbetagten, der mit jungen Männern vor Gericht steht“, statt: „und über einen alten Mann, der zurückkehrt und in Sachen sexueller Unmoral Rat einholt“. Hebräischer und griechischer Text unterscheiden sich hier erheblich.'
    reason: alternative_reading
  - marker: b
    text: 'Nach der griechischen Parallelüberlieferung auch: „Dann wirst du wahrhaft unterwiesen und vor allen Menschen als bewährt gelten.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: מוסר
  choice: Zurechtweisung
  rationale: Bezeichnet erzieherische, korrigierende Unterweisung; „Zurechtweisung“ wahrt hier den mahnenden Charakter.
- source_word: פותה
  choice: Unerfahrener
  rationale: Das Wort bezeichnet einen leicht verführbaren, unbedarften Menschen. „Unerfahrener“ ist verständlich, ohne bloße geistige Beschränktheit zu unterstellen.
- source_word: כסיל
  choice: Tor
  rationale: Bewährte deutsche Wiedergabe eines ethisch geprägten Weisheitsbegriffs; würdevoller als „Dummkopf“.
- source_word: ושב
  choice: der rückfällig wird
  rationale: Im Zusammenhang mit hohem Alter und Unzucht bezeichnet das Zurückkehren wohl einen Rückfall; die konkrete Verfehlung wird im Folgenden benannt.
- source_word: ישיש
  choice: ein alter Mann
  rationale: Direkte und natürliche Bezeichnung für einen Mann in hohem Alter.
- source_word: נוטל עצה
  choice: sich beraten lässt
  rationale: Gibt die idiomatische Wendung „Rat annehmen/einholen“ in natürlichem Deutsch wieder, ohne festzulegen, ob der Rat gesucht oder entgegengenommen wird.
- source_word: בזנות
  choice: wegen Unzucht
  rationale: זנות bezeichnet unerlaubtes sexuelles Verhalten und kann auch Prostitution einschließen. „Unzucht“ ist knapp und lässt den Umfang offen.
- source_word: זהיר
  choice: auf der Hut
  rationale: Drückt wachsame Vorsicht idiomatisch und stärker aus als das mehrdeutige „vorsichtig“.
- source_word: באמת
  choice: wirklich
  rationale: Bewahrt die verstärkende adverbiale Funktion und klingt in der Aufforderung natürlich.
- source_word: צנוע
  choice: zurückhaltend
  rationale: Erfasst Bescheidenheit, Selbstbeherrschung und diskretes Auftreten, ohne den Ausdruck auf sexuelle Schamhaftigkeit zu verengen.
- source_word: לפני כל חי
  choice: vor allen Menschen
  rationale: כל חי meint in diesem sozialen Zusammenhang alle Lebenden beziehungsweise jedermann; „alle Menschen“ ist im Deutschen natürlich und wahrt den universalen Bezug.
theological_decisions:
- issue: Vorrang des erhaltenen hebräischen Textes bei erheblicher Abweichung der griechischen Parallelüberlieferung
  choice: 'Der Haupttext folgt dem erhaltenen Hebräisch: Ein alter Mann wird rückfällig und lässt sich wegen Unzucht beraten.'
  alternative: 'Nach dem Griechischen: „und über einen Hochbetagten, der zusammen mit jungen Männern vor Gericht steht“ beziehungsweise „beurteilt wird“.'
  rationale: Wo der hebräische Sirachtext erhalten ist, dient er als primärer Zeuge. Da das Griechische in diesem Satzteil erheblich abweicht, wird seine Lesart nicht in den Haupttext eingemischt, sondern transparent in einer Fußnote dokumentiert.
- issue: Deutung des hebräischen Schlusssatzes gegenüber dem griechischen Paralleltext
  choice: „Sei wirklich auf der Hut und zurückhaltend vor allen Menschen.“
  alternative: 'Nach dem Griechischen: „Dann wirst du wahrhaft unterwiesen und vor allen Menschen als bewährt gelten.“'
  rationale: Der hebräische Wortlaut enthält eine Mahnung zu Wachsamkeit und Zurückhaltung; das Griechische formuliert dagegen das Ergebnis von Unterweisung und Bewährung. Der Haupttext wahrt die hebräische Spannung, die griechische Alternative steht in der Fußnote.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit weisheitlicher Prägnanz. Die eröffnende Reihe bleibt als thematische Überschrift erhalten. „Tor“ und „Unzucht“ sind bewusst gehoben, aber allgemein verständlich; „auf der Hut“ und „zurückhaltend“ vermeiden unnatürliche Wörtlichkeit. Sämtliche Fußnotenmarker stehen im Haupttext.
