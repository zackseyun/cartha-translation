  text: He searches out the deep and the heart[b][a], and he understands all their secrets.
translation:
  language: de
  text: Er erforscht den Abgrund und das Herz[a] und durchschaut alles, was an ihnen bloßliegt.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Eine kürzere hebräische Textform aus Masada lautet: „Abgrund und Herz hat er erforscht.“'
    reason: Textvariante
  - marker: b
    text: 'Wörtlich spricht das Hebräische von „all ihren Nacktheiten“, also von allem, was an ihnen entblößt ist. Die griechische Überlieferung hat dagegen: „und er bedachte alle ihre Machenschaften.“'
    reason: Alternative Lesart
lexical_decisions:
- source_word: תהום
  choice: den Abgrund
  rationale: תהום bezeichnet die kosmische Tiefe oder den Abgrund. „Abgrund“ bewahrt diesen Sinn und wird durch griechisch ἄβυσσον gestützt.
- source_word: לב
  choice: das Herz
  rationale: לב meint das innere Wesen des Menschen einschließlich Denken und Absichten. „Herz“ bewahrt das hebräische Menschenbild und entspricht griechisch καρδία.
- source_word: חקר
  choice: erforscht
  rationale: חקר bezeichnet gründliches Ergründen oder Untersuchen. Das Präsens gibt die Aussage natürlich als bleibende Eigenschaft Gottes wieder, ohne den Sinn auf einen einmaligen Vorgang zu beschränken.
- source_word: מערומיהם
  choice: alles, was an ihnen bloßliegt
  rationale: Die ungewöhnliche hebräische Form bezeichnet wörtlich ihre „Nacktheiten“ beziehungsweise das an ihnen Entblößte. Die Relativkonstruktion ist im Deutschen natürlich und wahrt das Bild des vollständigen Offenliegens, statt es ausschließlich als „Geheimnisse“ auszulegen.
- source_word: יתבונן
  choice: durchschaut
  rationale: Die Hitpael-Form bezeichnet aufmerksames Betrachten, Erkennen oder Verstehen. „Durchschaut“ verbindet Wahrnehmung und Einsicht und passt zu dem, was vor Gott bloßliegt.
theological_decisions:
- issue: Das göttliche Subjekt ist im hebräischen Satz nur vorausgesetzt.
  choice: Das Pronomen „er“ bleibt stehen; „der Herr“ wird nicht in den Haupttext eingefügt.
  alternative: „Der Herr erforscht den Abgrund …“
  rationale: Der Zusammenhang weist auf Gott als Subjekt, und die griechische Parallelüberlieferung nennt anschließend ausdrücklich den Herrn. Der vorliegende hebräische Satz selbst nennt ihn jedoch nicht, daher wird die implizite Form bewahrt.
- issue: Zeitwert von חקר in einer allgemeinen Aussage über Gottes Erkenntnis
  choice: Deutsches Präsens „erforscht“
  alternative: Perfekt „hat erforscht“
  rationale: Obwohl חקר formal eine abgeschlossene Verbform ist, beschreibt der Zusammenhang Gottes umfassende Erkenntnis als bleibende Wirklichkeit. Das deutsche Präsens gibt diesen sentenzhaften Sinn natürlich wieder, ohne die theologische Aussage zeitlich einzuengen.
- issue: Deutung von מערומיהם
  choice: Das Bild des Bloßliegens bleibt im Haupttext erhalten.
  alternative: „alle ihre Geheimnisse“ oder nach dem Griechischen „alle ihre Machenschaften“
  rationale: Die hebräische Lesart spricht am ehesten von Entblößtem oder Nacktheit. Eine eindeutige Auflösung zu „Geheimnissen“ oder „Machenschaften“ würde die Bildsprache und die Spannung zur griechischen Überlieferung beseitigen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Durchschaut“ ist allgemein verständlich und bringt die aufmerksame, einsichtsvolle Wahrnehmung zum Ausdruck. Die ungewöhnliche hebräische Bildsprache wird in natürlicher Form bewahrt; die abweichende griechische Überlieferung steht in der Fußnote.
