  text: Do not be ashamed of these things, and do not show partiality and sin.
translation:
  language: de
  text: Doch schäme dich dieser Dinge nicht[a]; sei nicht parteiisch[b] und sündige nicht.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Parallelüberlieferung in der Septuaginta hat hier einen erheblich anderen und ausführlicheren Wortlaut: Sie nennt mehrere konkrete Angelegenheiten, bei denen Scham und Verschwiegenheit eine Rolle spielen. Der Haupttext folgt dem hebräischen Text aus der Kairoer Geniza.'
    reason: textual_variant
  - marker: b
    text: 'Oder: „bevorzuge niemanden“. Das hebräische Idiom lautet wörtlich „hebe kein Gesicht empor“.'
    reason: lexical_alternative
  - marker: c
    text: 'Das Hebräische lautet knapp: „und sündige“. Die negative deutsche Formulierung ist nötig, damit der Satz nicht als Aufforderung zum Sündigen verstanden wird. Die Verbindung kann auch als Folge oder Warnung verstanden werden: „und sündige dadurch“ oder „damit du nicht sündigst“.'
    reason: alternative_reading
lexical_decisions:
- source_word: אך
  choice: doch
  rationale: Die Partikel setzt die folgenden „Dinge“ abgrenzend oder hervorhebend vom vorausgehenden Zusammenhang ab. „Doch“ gibt diesen Übergang knapp wieder, ohne die mögliche Nuance durch ein stärkeres „nur“ festzulegen.
- source_word: על אלה
  choice: dieser Dinge
  rationale: Bei בוש bezeichnet על den Anlass beziehungsweise Gegenstand der Scham. Die Genitivfügung „sich dieser Dinge schämen“ ist im Deutschen idiomatisch und würdevoll.
- source_word: אל תבוש
  choice: schäme dich nicht
  rationale: בוש bezeichnet Scham oder Beschämung, nicht lediglich momentane Verlegenheit. Die Wendung bewahrt den moralisch-sozialen Gehalt.
- source_word: ואל תשא פנים
  choice: sei nicht parteiisch
  rationale: Das hebräische Idiom נשא פנים, wörtlich „ein Gesicht erheben“, bezeichnet die Bevorzugung oder parteiliche Rücksichtnahme. „Sei nicht parteiisch“ ist klar und vermeidet einen im Deutschen missverständlichen Semitismus.
- source_word: וחטא
  choice: und sündige nicht
  rationale: Der hebräische Ausdruck ist knapp und lautet formal „und sündige“. Im Deutschen muss der negative Geltungsbereich zur Vermeidung des gegenteiligen Sinnes verdeutlicht werden; die genaue syntaktische Beziehung zur Parteilichkeit bleibt in der Fußnote offen.
theological_decisions:
- issue: Verhältnis von „und sündige“ zum Verbot der Parteilichkeit
  choice: 'Als gleichgeordnetes Verbot wiedergeben: „und sündige nicht“'
  alternative: „und sündige dadurch“ oder „damit du nicht sündigst“
  rationale: Der hebräische Wortlaut ist syntaktisch gedrängt. Eine ausdrückliche Folge- oder Zweckbeziehung würde die offene Verbindung stärker festlegen, als es der Text erlaubt. Die Wiederholung von „nicht“ ist im Deutschen nötig, damit der Satz nicht wie eine Aufforderung zum Sündigen klingt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit knapper, mahnender und zugleich würdevoller Satzgestalt. Das semikolon trennt die beiden Mahnungen, ohne ihren Zusammenhang aufzulösen.
