base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/042/009.yaml
  text: 'A daughter is a hidden cause of deceit to her father[a], and anxiety over her drives away his sleep: in her youth, lest she remain unmarried, and in her virginity[b], lest she not be married.'
translation:
  language: de
  text: 'Eine Tochter ist für ihren Vater ein verborgener Trug[a]; die Sorge um sie raubt ihm den Schlaf: Solange sie jung ist, sorgt er sich, sie könne verblühen, und solange sie Jungfrau ist, sie könne unverheiratet bleiben[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „verborgener Trug“. Der griechische Paralleltext liest „verborgene Schlaflosigkeit“ und versteht die Zeile offenbar von der heimlichen Sorge, die dem Vater den Schlaf nimmt.'
    reason: alternative_reading
  - marker: b
    text: Das hebräische Verb ist hier in seiner Bedeutung unsicher. Der griechische Paralleltext spricht davon, dass ihre Jugendblüte vergeht; möglich ist daher auch der Sinn, dass sie das damalige heiratsfähige Alter überschreitet oder unverheiratet bleibt.
    reason: textual_variant
lexical_decisions:
- source_word: בת לאב
  choice: Eine Tochter ist für ihren Vater
  rationale: Die knappe hebräische Beziehungsangabe wird im Deutschen natürlich mit „für ihren Vater“ wiedergegeben.
- source_word: מטמנת שקר
  choice: verborgener Trug
  rationale: Die schwierige hebräische Verbindung bezeichnet wörtlich etwas Verborgenes in Verbindung mit Falschheit oder Trug. Die bewusst etwas dunkle Formulierung bewahrt diese Spannung, statt sie nach dem glatteren griechischen Paralleltext aufzulösen.
- source_word: דאגה תפריע שנתו
  choice: die Sorge um sie raubt ihm den Schlaf
  rationale: „Sorge“ gibt דאגה als anhaltende beunruhigende Besorgnis wieder; „raubt ihm den Schlaf“ ist eine natürliche deutsche Entsprechung der hebräischen Wendung und stimmt sachlich mit dem Griechischen überein.
- source_word: בנעוריה פן תגור
  choice: in ihrer Jugend, dass sie nicht über ihre beste Zeit hinauskommt
  rationale: Die Bedeutung des hebräischen Verbs ist an dieser Stelle unsicher. Der griechische Paralleltext weist auf das Überschreiten der jugendlichen Blüte beziehungsweise des damaligen heiratsfähigen Alters.
- source_word: ובבתוליה פן לא תנשא
  choice: und solange sie Jungfrau ist, dass sie nicht geheiratet wird
  rationale: Die ausdrückliche Bezeichnung des Jungfrauenstandes bleibt erhalten; die passive Form „geheiratet wird“ entspricht der sozialen Perspektive des hebräischen Textes.
theological_decisions:
- issue: Die textlich schwierige Wendung מטמנת שקר im Verhältnis zum griechischen ἀπόκρυφος ἀγρυπνία
  choice: Im Haupttext bleibt die dunkle hebräische Aussage „verborgener Trug“ stehen.
  alternative: „verborgene Schlaflosigkeit“ oder „heimliche Sorge“
  rationale: Der vorhandene hebräische Text hat Vorrang, während die griechische Überlieferung zur Klärung herangezogen und in der Fußnote dokumentiert wird. So wird die Uneindeutigkeit nicht stillschweigend beseitigt.
- issue: Die unsichere Bedeutung von פן תגור
  choice: „dass sie nicht über ihre beste Zeit hinauskommt“
  alternative: „dass sie nicht unverheiratet bleibt“
  rationale: Das Hebräische ist hier schwer zu deuten; der griechische Paralleltext unterstützt die Vorstellung, dass die jugendliche Blüte beziehungsweise das damalige heiratsfähige Alter verstreicht. Die Fußnote hält die Unsicherheit offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kulturgeschichtlich geprägte Sicht des Verses wird weder modernisiert noch befürwortend ausgeweitet. Der Doppelpunkt erhält die parallele Aufzählung der väterlichen Sorgen; die textlichen Schwierigkeiten werden durch Fußnoten transparent gemacht.
