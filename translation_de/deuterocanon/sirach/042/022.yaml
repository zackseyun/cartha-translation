  text: He lives and stands forever[b][a]; his goodness passes from one thing to another.
translation:
  language: de
  text: Er lebt und besteht für immer; seine Güte geht von einem zum anderen über.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hebräische Wortlaut ist hier knapp und in seiner genauen Bedeutung unsicher. Die griechische Parallelfassung bietet einen anderen, ausführlicheren Text: »Weder wurde etwas hinzugefügt noch weggenommen, und er brauchte keinen Ratgeber. Wie begehrenswert sind alle seine Werke, und wie ein Funke sind sie anzuschauen!«'
    reason: textual_variant
  - marker: b
    text: 'Oder: »Seine Güte kommt über jedes« beziehungsweise »seine Güte geht von einem zum anderen«. Die hebräische Wendung ist stark zusammengedrängt; der genaue Sinn von »dieses auf jenes« bleibt unsicher.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוא
  choice: Er
  rationale: Das Pronomen bezieht sich im Zusammenhang des Lobgesangs auf Gott und wird daher persönlich wiedergegeben.
- source_word: חי
  choice: lebt
  rationale: Die Form bezeichnet fortdauerndes Leben; »lebt« ist knapp, natürlich und bewahrt diesen durativen Sinn.
- source_word: ועומד
  choice: und besteht
  rationale: Das Verb bedeutet wörtlich »steht«, kann hier aber idiomatisch Fortbestand ausdrücken. »Besteht« bewahrt den Gedanken der Beständigkeit in natürlichem Deutsch.
- source_word: לעד
  choice: für immer
  rationale: Geläufige moderne Wiedergabe unbegrenzter Dauer.
- source_word: זה על זה
  choice: von einem zum anderen
  rationale: Die gedrängte Wendung ist mehrdeutig. Diese Fassung gibt eine mögliche Beziehung oder Folge wieder, ohne den Bezug ausdrücklich auf Menschen oder Dinge festzulegen.
- source_word: חלף
  choice: geht … über
  rationale: Das Verb kann Vorübergehen, Hinübergehen oder Ablösen bezeichnen. »geht … über« erhält das Bewegungsbild und lässt die genaue Nuance offen.
- source_word: טובו
  choice: seine Güte
  rationale: טוב bezeichnet hier am unmittelbarsten Güte beziehungsweise Wohltun; »seine Güte« ist sachlich und theologisch nicht unnötig verengt.
theological_decisions:
- issue: Verhältnis der erhaltenen hebräischen Zeile zur ausführlicheren griechischen Parallelfassung
  choice: Die erhaltene hebräische Fassung bildet den Haupttext; die abweichende griechische Fassung wird in einer Fußnote dokumentiert.
  alternative: Den griechischen Text anstelle des Hebräischen übernehmen oder beide Fassungen harmonisieren.
  rationale: Wo der hebräische Sirachtext erhalten ist, hat er Vorrang. Die griechische Überlieferung scheint hier eine andere oder erweiterte Textgestalt zu bewahren und darf die hebräische Hauptfassung daher nicht stillschweigend ersetzen.
- issue: Bezug und Sinn von זה על זה חלף טובו
  choice: Die komprimierte Bewegungsaussage wird als »seine Güte geht von einem zum anderen über« wiedergegeben und als unsicher gekennzeichnet.
  alternative: »Seine Güte geht über jedes hinweg«, »seine Güte folgt einem nach dem anderen« oder eine Deutung im Sinn der Schönheit seiner Werke.
  rationale: Der hebräische Wortlaut lässt Ziel, Verteilung und genaue Bewegungsart offen. Die Hauptfassung wahrt diese Spannung, während die Fußnote echte Alternativen nennt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Besteht« klingt natürlicher als das wörtliche »steht« und erhält den Gedanken bleibender Existenz. Die ungewöhnliche zweite Satzhälfte bleibt bewusst offen; beide Fußnotenmarker stehen unmittelbar nach der betreffenden Aussage.
