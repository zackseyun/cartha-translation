  text: Do not display your beauty to any man[b][a], and do not sit among women in the house.
translation:
  language: de
  text: Zeige keinem Mann deine Schönheit[a], und halte dich nicht im Haus der Frauen auf.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Gib keinem Mann Gestalt/Aussehen.“ Die griechische Parallele lautet abweichend: „Sieh keinen Menschen/Mann in seiner Schönheit an.“'
    reason: alternative_reading
  - marker: b
    text: 'Das letzte hebräische Verb ist im Geniza-Text unsicher. Die griechische Parallele hat den Sinn: „Setz dich nicht zu Frauen“ oder „Halte dich nicht unter Frauen auf.“ Ein Textzeuge aus Masada weist ebenfalls auf eine soziale Begegnung hin, bietet aber nicht genau denselben Wortlaut wie der Geniza-Text.'
    reason: textual_variant
lexical_decisions:
- source_word: לכל זכר
  choice: keinem Mann
  rationale: Das Hebräische bezeichnet ausdrücklich jeden männlichen Menschen. Im Deutschen gibt „keinem Mann“ die geschlechtsspezifische Aussage natürlich wieder; „keinem männlichen Wesen“ wäre unnötig biologisch und unidiomatisch.
- source_word: אל תתן תאר
  choice: Zeige … deine Schönheit
  rationale: תאר kann Gestalt, Aussehen oder Schönheit bezeichnen. Im Zusammenhang und im Licht des griechischen ἐν κάλλει ist „deine Schönheit zeigen“ eine natürliche Wiedergabe, ohne das Bild durch ein wörtliches „Gestalt geben“ zu verdunkeln.
- source_word: ובית נשים
  choice: im Haus der Frauen
  rationale: Die Wiedergabe bewahrt das im hebräischen Text ausdrücklich genannte „Haus der Frauen“. Sie vermeidet die institutionell stärker festgelegte Deutung „Frauengemach“.
- source_word: אל תסתויד
  choice: halte dich nicht … auf
  rationale: Die Form und Bedeutung des Verbs im Geniza-Text sind unsicher. „Sich aufhalten“ entspricht einer sozialen beziehungsweise örtlichen Mahnung und lässt sich mit dem griechischen συνέδρευε („zusammensitzen, Gesellschaft leisten“) vereinbaren, ohne eine präzise Sitzhaltung in den schwierigen hebräischen Text einzutragen.
theological_decisions:
- issue: Geschlechtsspezifische Sprache in der Weisheitsmahnung
  choice: „Mann“ und „Frauen“ beibehalten
  alternative: Geschlechtsneutrale Begriffe wie „Menschen“ verwenden
  rationale: Der hebräische Text nennt ausdrücklich זכר und נשים. Diese Spannung und Spezifik werden nicht neutralisiert.
- issue: Verhältnis des schwierigen hebräischen Wortlauts zur griechischen Parallele
  choice: Den hebräischen Text als Grundlage übersetzen und die griechische Parallele zur Klärung des unsicheren Schlussverbs heranziehen
  alternative: Den Vers vollständig nach der griechischen Fassung wiedergeben
  rationale: Der erhaltene hebräische Text hat Vorrang. Beim unsicheren Verb stützt die griechische Parallele jedoch eine Deutung als Aufenthalt oder Gemeinschaft unter Frauen; die Abweichung wird in den Fußnoten offengelegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe imperativische Form des Weisheitsspruchs bleibt erhalten. „Haus der Frauen“ wahrt die konkrete, aber nicht eindeutig institutionelle Ortsangabe; die textliche Unsicherheit des Schlussverbs wird nicht im Haupttext überladen, sondern in Fußnote [b] dokumentiert.
