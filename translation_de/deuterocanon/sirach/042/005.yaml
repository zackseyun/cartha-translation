  text: about livestock[a], whether much or little, and about the price of merchandise for sale;
translation:
  language: de
  text: über Viehbestand[a], ob viel oder wenig, und über den Preis der Ware eines Händlers;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die griechische Parallelüberlieferung weicht hier deutlich ab und spricht allgemeiner von Verkaufsgeschäften und Händlern. Der Übersetzung liegt der hebräische Text zugrunde; das Griechische bestätigt lediglich den wirtschaftlichen Zusammenhang.
    reason: textual_variant
lexical_decisions:
- source_word: על
  choice: über
  rationale: Die Präposition leitet im Zusammenhang die Angelegenheiten ein, bei denen man sich nicht scheuen soll, genau zu sein. „Über“ gibt diese thematische Funktion natürlich wieder.
- source_word: מקנה
  choice: Viehbesitz
  rationale: Das Wort bezeichnet hier am ehesten den Bestand an eigenen Herdentieren. „Viehbesitz“ bewahrt sowohl den Bezug auf Tiere als auch den Besitzaspekt und passt zur Mengenangabe.
- source_word: בין רב למעט
  choice: ob viel oder wenig
  rationale: Die idiomatische Gegenüberstellung betrifft die Menge beziehungsweise den Umfang. „Ob viel oder wenig“ ist knappes, natürliches Deutsch.
- source_word: ממחיר
  choice: den Preis
  rationale: Die hebräische Form ist wahrscheinlich Teil einer gedrängten Konstruktion. Im Deutschen vermittelt „den Preis“ den sachlichen Sinn, ohne die Präposition unnatürlich nachzubilden.
- source_word: ממכר תגר
  choice: der Handelsware
  rationale: ממכר kann das Verkaufte beziehungsweise Verkaufsware bezeichnen, תגר den Händler oder Handel. „Handelsware“ gibt den kommerziellen Zusammenhang knapp und verständlich wieder, ohne ein im Deutschen schwerfälliges Besitzverhältnis zu erzwingen.
- source_word: περὶ ἀδιαφόρου πράσεως καὶ ἐμπόρων
  choice: über ... den Preis der Handelsware
  rationale: Die griechische Parallelüberlieferung weicht merklich ab, bestätigt jedoch allgemein den Bereich von Verkauf und Handel. Für den Haupttext bleibt der hebräische Zeuge maßgeblich.
