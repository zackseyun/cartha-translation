translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung ist als Glied einer fortlaufenden Aufzählung bewusst kleingeschrieben und endet mit einem Semikolon. „Viehbesitz“ vermeidet die mögliche Verengung von מקנה auf Rinder.
