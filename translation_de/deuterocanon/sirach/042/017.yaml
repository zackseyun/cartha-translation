base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/042/017.yaml
  text: The holy ones of God have not been sufficient to recount the wonders of the Lord[b][a]. God has strengthened his hosts to be strong before his glory.
translation:
  language: de
  text: Die Heiligen Gottes waren nicht imstande, die Wunder des Herrn zu erzählen.[a] Gott hat seine Heerscharen gestärkt, damit sie vor seiner Herrlichkeit standhalten.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ein hebräischer Textzeuge scheint statt »waren nicht imstande« den Sinn »haben nicht begriffen« zu bieten. Der griechische Paralleltext stützt den Sinn, dass sie nicht alles vollständig erzählen konnten.
    reason: textual_variant
  - marker: b
    text: 'Die hebräischen Textzeugen weichen in diesem Satz voneinander ab: Der hier zugrunde gelegte Text lautet sinngemäß »Gott hat seine Heerscharen gestärkt«; ein anderer Zeuge scheint »Der Herr hat unter seinen Lichtern/Himmelslichtern gestärkt« zu lesen. Der griechische Text lautet: »was der Herr, der Allherrscher, fest gegründet hat, damit das All in seiner Herrlichkeit gefestigt werde«.'
    reason: textual_variant
lexical_decisions:
- source_word: לא הספיקו
  choice: waren nicht imstande
  rationale: Das hebräische Verb bezeichnet hier ein Nicht-Ausreichen beziehungsweise Nicht-Vermögen. Die Formulierung ist natürliches modernes Deutsch und bewahrt den Sinn der begrenzten Fähigkeit; »vollständig« verdeutlicht die auch im griechischen Paralleltext erkennbare Unmöglichkeit, alles restlos zu erzählen.
- source_word: קדושי אל
  choice: die Heiligen Gottes
  rationale: Die formnahe Wiedergabe lässt offen, ob heilige Menschen oder himmlische Wesen gemeint sind, und vermeidet eine engere konfessionelle Festlegung.
- source_word: לספר נפלאות ה׳
  choice: die Wunder des Herrn vollständig zu erzählen
  rationale: לספר bedeutet erzählen oder berichten, נפלאות bezeichnet Wunder beziehungsweise wunderbare Taten. »Wunder« hält beide Möglichkeiten offen; »vollständig« gibt den durch לא הספיקו und den griechischen Paralleltext gestützten Vollständigkeitsaspekt wieder.
- source_word: אמץ אלהים
  choice: Gott hat … gestärkt
  rationale: Die primäre hebräische Lesart nennt Gott als Subjekt und verwendet ein Verb des Stärkens oder Festmachens.
- source_word: צבאיו
  choice: seine Heerscharen
  rationale: צבאיו kann seine Heere oder Heerscharen bezeichnen. »Heerscharen« wahrt im kosmischen Zusammenhang die mögliche Beziehung auf himmlische Mächte, ohne sie festzuschreiben.
- source_word: להתחזק לפני כבודו
  choice: damit sie vor seiner Herrlichkeit Bestand haben
  rationale: Die reflexive Verbalform bezeichnet Festwerden, Sich-Stärken oder Standhalten. »Bestand haben« ist im Deutschen idiomatisch und drückt dauerhafte Festigkeit angesichts der göttlichen Herrlichkeit aus.
theological_decisions:
- issue: Gottesbezeichnungen in voneinander abweichenden Textzeugen
  choice: im ersten Satz »der Herr«, im zweiten »Gott«
  alternative: in beiden Sätzen »der Herr«
  rationale: Der zugrunde gelegte hebräische Text bietet zunächst ה׳ und danach אלהים. Der griechische Paralleltext verwendet an beiden Stellen κύριος, und ein anderer hebräischer Zeuge hat im zweiten Satz offenbar אדני. Die gewählte Fassung folgt dem primären hebräischen Wortlaut und dokumentiert die Abweichung in der Fußnote.
- issue: Identität der »Heiligen Gottes«
  choice: nicht näher bestimmen
  alternative: ausdrücklich Engel oder fromme Menschen nennen
  rationale: Der Ausdruck קדושי אל erlaubt im Zusammenhang mehr als eine Referenz. Eine nähere Bestimmung würde eine im Ausgangstext vorhandene Mehrdeutigkeit auflösen.
- issue: Bezug der gestärkten Heerscharen
  choice: Pluralbezug in »damit sie … Bestand haben« bewahren
  alternative: mit dem griechischen Text auf »das All« beziehen
  rationale: Der primäre hebräische Text bezieht die Aussage auf Gottes Heerscharen, während der griechische Paralleltext vom Festwerden des Alls spricht. Die Übersetzung folgt dem Hebräischen; die Variante wird offengelegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit gut verständlichem Satzbau. »Heerscharen« und »Herrlichkeit« halten den gehobenen biblischen Ton, während »waren nicht imstande« und »Bestand haben« heute natürlich verständlich sind. Die Übersetzung bewahrt die Mehrdeutigkeit bei den Heiligen und Heerscharen und legt die wesentlichen Textvarianten offen.
