lexical_decisions:
- source_word: שחק
  choice: Betrug
  rationale: Die überlieferte hebräische Form ist schwierig. Im Zusammenhang mit Waage und Waagbalken liegt eine unredliche Manipulation im Handel nahe; die abweichende griechische Lesart wird in einer Fußnote bewahrt.
- source_word: מאזנים
  choice: Waage
  rationale: Das hebräische Wort bezeichnet gewöhnlich eine Waage beziehungsweise Balkenwaage; der Singular ist im Deutschen als Sammelbezeichnung natürlich.
- source_word: פלס
  choice: Waagbalken
  rationale: Im Zusammenhang des Wiegens bezeichnet das Wort wahrscheinlich einen Bestandteil oder ein Gerät zum Ausbalancieren. „Waagbalken“ erhält die konkrete Bildwelt, ohne es mit מאזנים gleichzusetzen.
- source_word: תמחות
  choice: Maße
  rationale: Die Form ist textlich schwierig. Zusammen mit Efa und Gewichtstein weist sie am ehesten auf Maßgrößen oder Maßstandards im Handel.
- source_word: איפה
  choice: Efa
  rationale: Efa ist der Name eines bestimmten antiken Trockenmaßes; die Umschrift bewahrt den konkreten Quellbegriff.
- source_word: אבן
  choice: Gewichtstein
  rationale: אבן bedeutet wörtlich „Stein“, bezeichnet im Handelskontext aber häufig einen als Normgewicht verwendeten Stein.
- source_word: περὶ ἀκριβείας ζυγοῦ καὶ σταθμίων
  choice: über Genauigkeit von Waage und Gewichten
  rationale: So lautet der Sinn der griechischen Parallele. Da der vorhandene hebräische Text priorisiert wird und offenbar auf Missbrauch oder Manipulation weist, steht diese griechisch gestützte Wiedergabe nur in der Fußnote.
- source_word: περὶ κτήσεως πολλῶν καὶ ὀλίγων
  choice: beim Erwerb von viel und wenig
  rationale: Die griechische zweite Vershälfte weicht erheblich vom Hebräischen ab und wird deshalb als Textvariante dokumentiert, nicht in den Haupttext übernommen.
