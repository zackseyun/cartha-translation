review_pass:
  verdict: revise
  source_fidelity: Die Wiedergabe „Betrug“ ist als Deutung der schwierigen hebräischen Überlieferung möglich, aber zu bestimmt. שחק und תמחות sind hier in ihrer genauen Bedeutung unsicher; der deutsche Haupttext sollte daher die konkrete Handels- und Messungsthematik ausdrücken, ohne eine eindeutige Betrugsabsicht als gesichert auszugeben. Die beträchtlich abweichende griechische Parallele bleibt zutreffend dokumentiert.
  naturalness: „Gewichtstein“ ist im heutigen Standarddeutsch ungebräuchlich. „Gewichtsstein“ ist verständlich und sachlich. Die knappe, an eine Aufzählung anschließende Form bleibt idiomatisch, wenn „bei“ statt des mehrfachen „über“ verwendet wird.
  terminology: „Waage“, „Waagbalken“, „Efa“ und „Gewichtsstein“ geben die hebräischen Sachbegriffe angemessen wieder. „Abnutzung“ und „Verringerung“ sind bei dem schwierigen hebräischen Wortlaut vorsichtiger als „Betrug“; sie lassen den im Handel möglichen missbräuchlichen Bezug offen. Die Fußnoten bewahren sowohl die griechische Lesart als auch die kulturelle Erklärung.
  issues:
  - severity: medium
    issue: „Betrug“ legt eine nicht ausdrücklich gesicherte Absicht fest.
    rationale: Der hebräische Wortlaut ist nach der angegebenen Textgrundlage schwierig und die griechische Parallele bietet stattdessen „Genauigkeit“. Eine konkretere Beschreibung der möglichen materiellen Manipulation bzw. Verringerung wahrt die Unsicherheit besser.
  - severity: low
    issue: „Gewichtstein“ ist sprachlich wenig geläufig.
    rationale: „Gewichtsstein“ ist die im modernen Deutschen deutlichere Bezeichnung für einen Stein, der als Handelsgewicht dient.
  - severity: low
    issue: Die Fußnote zur griechischen zweiten Vershälfte übersetzt περὶ κτήσεως als „beim Erwerb“.
    rationale: „Über den Erwerb von viel und wenig“ entspricht der präpositionalen Form des griechischen Satzes genauer und fügt sich besser zur Hauptzeile.
  revised_text: bei der Abnutzung von Waage und Waagbalken[a] und bei der Verringerung von Efa und Gewichtsstein[b][c].
  revised_footnotes:
  - marker: a
    text: 'Die griechische Parallele lautet eher: „über Genauigkeit von Waage und Gewichten“. Der hier schwierige hebräische Text stimmt damit nicht eindeutig überein.'
    reason: alternative_reading
  - marker: b
    text: 'Die griechische zweite Vershälfte weicht deutlich ab: „über den Erwerb von viel und wenig“, möglicherweise auch im Sinn von „über große und kleine Mengen“.'
    reason: textual_variant
  - marker: c
    text: Ein Efa war ein antikes Trockenmaß; ein Gewichtsstein war ein als Normgewicht im Handel verwendeter Stein.
    reason: cultural_note
  revision_rationale: Die Revision vermeidet die zu eindeutige moralische Auslegung „Betrug“ und gibt die unsicheren hebräischen Begriffe in einer konkreten, aber nicht überbestimmten Handels- und Messsprache wieder. Die abweichende griechische Überlieferung wird weiterhin klar in den Fußnoten kenntlich gemacht. Die Änderung von „Gewichtstein“ zu „Gewichtsstein“ verbessert die heutige deutsche Verständlichkeit.
