  text: He declares the changes that are coming[b][a], and reveals the search of hidden things.
translation:
  language: de
  text: Er verkündet die Veränderungen, die sich vollziehen,[a][b] und enthüllt die Erforschung des Verborgenen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Parallelfassung lautet: „Er verkündet das Vergangene und das Kommende und enthüllt die Spuren verborgener Dinge.“ Sie entfaltet den zeitlichen Bezug ausführlicher als der erhaltene hebräische Text.'
    reason: alternative_reading
  - marker: b
    text: Die Masada-Rolle ist in diesem Abschnitt nur bruchstückhaft erhalten und überliefert diesen Vers nicht vollständig genug, um hier den Wortlaut der Kairoer Geniza-Handschriften zu ersetzen.
    reason: textual_variant
lexical_decisions:
- source_word: מחוה
  choice: verkündet
  rationale: Das Verb bezeichnet hier das Bekanntmachen oder Kundtun. „Verkündet“ wahrt den gehobenen Weisheitston und entspricht zugleich dem griechischen ἀπαγγέλλων, ohne dessen erweiterte Zeitangabe zu übernehmen.
- source_word: חליפות
  choice: die Veränderungen
  rationale: Das Substantiv kann Wechsel, Veränderungen oder aufeinanderfolgende Entwicklungen bezeichnen. „Veränderungen“ ist im Deutschen natürlich und lässt die zeitliche beziehungsweise ereignishafte Tragweite offen.
- source_word: נהיות
  choice: die sich vollziehen
  rationale: Die Form von היה weist auf Vorgänge hin, die entstehen, eintreten oder geschehen. „Sich vollziehen“ gibt diesen Prozesscharakter idiomatisch wieder, ohne ausdrücklich nur Zukünftiges zu bezeichnen.
- source_word: ומגלה
  choice: und enthüllt
  rationale: גלה bezeichnet das Aufdecken oder Offenlegen. „Enthüllt“ passt zum folgenden Verborgenen und bewahrt den würdevollen Stil.
- source_word: חקר
  choice: die Erforschung
  rationale: חקר kann das Erforschen, Nachforschen oder eine gründliche Untersuchung bezeichnen. „Erforschung“ wahrt die ungewöhnliche, aber verständliche Aussage, dass auch das Ergründen des Verborgenen offengelegt wird, statt den Ausdruck eigenmächtig zu „Tiefen“ umzudeuten.
- source_word: נסתרות
  choice: des Verborgenen
  rationale: Die substantivierte Wiedergabe bezeichnet allgemein das, was verborgen oder geheim ist, und klingt im Deutschen natürlicher als „verborgene Dinge“.
theological_decisions:
- issue: Verhältnis des erhaltenen hebräischen Wortlauts zur ausführlicheren griechischen Parallele
  choice: Der erhaltene hebräische Text bleibt Grundlage des Haupttextes; die griechische Fassung wird als abweichende, zeitlich ausführlichere Lesart in einer Fußnote wiedergegeben.
  alternative: „Er verkündet das Vergangene und das Kommende und enthüllt die Spuren verborgener Dinge.“
  rationale: Der hebräische Wortlaut nennt nicht ausdrücklich Vergangenheit und Zukunft. Die griechische Parallele bezeugt diese Deutung, darf die echte Differenz der Textformen jedoch nicht stillschweigend beseitigen.
- issue: Mehrdeutigkeit von חקר נסתרות
  choice: „die Erforschung des Verborgenen“
  alternative: „die Tiefen des Verborgenen“ oder „die Spuren verborgener Dinge“
  rationale: Die gewählte Fassung bildet die hebräische Konstruktion möglichst direkt ab und bewahrt ihre begriffliche Spannung. Die griechischen „Spuren“ werden nicht in den hebräischen Haupttext eingetragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung bleibt nahe an der knappen hebräischen Parallelstruktur; „die sich vollziehen“ vermeidet schwerfälliges „die ins Dasein kommen“, während „Erforschung des Verborgenen“ die echte Ungewöhnlichkeit des hebräischen Ausdrucks bewahrt.
