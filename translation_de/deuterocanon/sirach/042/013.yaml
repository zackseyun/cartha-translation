translation:
  language: de
  text: Denn aus einem Gewand kommt eine Motte, und von einer Frau kommt die Bosheit einer Frau.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: „und von einer Frau das Böse einer Frau“. Das Hebräische ist knapp und sprichwörtlich; auch die griechische Parallele lautet: „von einer Frau die Bosheit einer Frau“.'
    reason: Lexikalische Alternative und Hinweis auf die elliptische Formulierung der Ausgangstexte.
lexical_decisions:
- source_word: בגד
  choice: Kleid
  rationale: Das hebräische Wort bezeichnet allgemein ein Kleidungsstück. „Kleid“ bewahrt den Singular und passt zum Bild der Kleidermotte, ohne das Wort enger als „Mantel“ zu fassen.
- source_word: יצא
  choice: kommt
  rationale: Das Verb bedeutet wörtlich „hinausgehen, hervorkommen“. „Kommt“ gibt den sprichwörtlichen Satz im Deutschen knapp und natürlich wieder.
- source_word: עש
  choice: Motte
  rationale: Gemeint ist die Motte beziehungsweise der mit ihr verbundene Fraß an Kleidung. „Motte“ ist die geläufige und prägnante Wiedergabe.
- source_word: אשה
  choice: Frau
  rationale: אשה kann „Frau“ oder „Ehefrau“ bedeuten. Der allgemein formulierte Spruch und die griechische Parallele sprechen hier für das weitere „Frau“.
- source_word: רעת אשה
  choice: die Bosheit einer Frau
  rationale: Die hebräische Genitivverbindung ist knapp und bezeichnet das Böse beziehungsweise die Bosheit einer Frau. „Bosheit“ wahrt den moralischen Gehalt und die Schärfe des Spruchs.
theological_decisions:
- issue: Pointierte negative Aussage über Frauen
  choice: Die direkte Formulierung „von einer Frau die Bosheit einer Frau“ wird beibehalten.
  alternative: Die Aussage verallgemeinern, abschwächen oder ausdrücklich auf eine Ehefrau beschränken.
  rationale: Sowohl der hebräische Text als auch die griechische Parallele formulieren den Spruch scharf und frauenspezifisch. Die Übersetzung darf diese Spannung nicht glätten, erhebt den einzelnen Vers aber auch nicht zu einer weitergehenden Lehrbehauptung.
- issue: Ellipse im zweiten Satzglied
  choice: Das Verb „kommt“ wird im zweiten Satzglied nicht wiederholt.
  alternative: „und von einer Frau kommt die Bosheit einer Frau“
  rationale: Im Hebräischen steht das Verb nur im ersten Satzglied; die deutsche Ellipse bleibt verständlich und bewahrt die knappe, sprichwörtliche Parallelstruktur.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst knapper, sprichwörtlicher Satzform. Die Härte und Mehrdeutigkeit der Vorlage werden weder abgeschwächt noch ausgeweitet.
