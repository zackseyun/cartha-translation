  source_fidelity: Der erste Satzteil gibt πάντα δισσὰ ἐν κατέναντι τοῦ ἑνός insgesamt zutreffend wieder. „geordnet“ ist jedoch im griechischen Text nicht ausgedrückt und fügt einen Ordnungsaspekt hinzu. Der Schlussteil „nichts hat er unvollständig gemacht“ ist semantisch möglich, doch die Satzstellung kann nahelegen, Gott habe Dinge unvollständig hervorgebracht, während ἐκλιπόν prägnanter „fehlend/mangelhaft“ bezeichnet. „Er hat nichts mangelhaft gemacht“ ist näher und natürlich.
