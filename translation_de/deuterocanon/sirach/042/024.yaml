  terminology: „paarweise“ trifft δισσά ohne die nicht explizite Ergänzung „geordnet“. „mangelhaft“ deckt ἐκλιπόν als „fehlend, defizitär“ gut ab; die Fußnote kann daneben „unvollständig“ als mögliche Nuance nennen. Das anaphorische „er“ ist im Kontext angemessen.
