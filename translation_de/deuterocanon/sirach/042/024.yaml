  text: All things are in pairs[a], one opposite the other, and he has made nothing lacking.
translation:
  language: de
  text: Alles ist paarweise[a], eines dem anderen gegenüber, und nichts hat er mangelhaft gemacht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Auch der hebräische Masada-Textzeuge für diesen Abschnitt stützt den Sinn, dass nichts mangelhaft oder unvollständig geschaffen wurde; die hebräische Textüberlieferung dieser Zeilen ist jedoch bruchstückhaft und anders angeordnet.
    reason: textual_variant
lexical_decisions:
- source_word: πάντα
  choice: Alles
  rationale: Das substantivierte Neutrum Plural bezeichnet umfassend die Gesamtheit der geschaffenen Dinge; „Alles“ ist im Deutschen natürlich und bewahrt den weitreichenden Sinn.
- source_word: δισσὰ
  choice: paarweise geordnet
  rationale: δισσά bezeichnet Zweifachheit beziehungsweise Paarbildung. „Paarweise geordnet“ gibt den Zustand idiomatisch wieder und bereitet die folgende Gegenüberstellung vor, ohne bloße Verdoppelung zu unterstellen.
- source_word: ἐν κατέναντι τοῦ ἑνός
  choice: eines dem anderen gegenüber
  rationale: Die Wendung beschreibt, dass die jeweiligen Glieder einander gegenüberstehen. Die deutsche Formulierung bewahrt sowohl den Gedanken des Gegenübers als auch die mögliche Entsprechung, ohne die Beziehung enger als der griechische Text festzulegen.
- source_word: οὐκ ἐποίησεν
  choice: hat er … gemacht
  rationale: Das im Griechischen unausgesprochene Subjekt ist aus dem Kontext als Gott erkennbar. Die deutsche Perfektform bezeichnet sein abgeschlossenes Schöpfungshandeln natürlich.
- source_word: οὐδὲν ἐκλιπόν
  choice: nichts … unvollständig
  rationale: ἐκλιπόν kann etwas Fehlendes, Mangelhaftes oder Ausgelassenes bezeichnen. „Unvollständig“ wahrt den Gedanken, dass keinem Werk etwas zu seiner Ganzheit fehlt, ohne die Art des Mangels näher festzulegen.
theological_decisions:
- issue: Unausgesprochenes Subjekt von ἐποίησεν
  choice: „er“ mit Bezug auf Gott
  alternative: 'Unpersönlich: „nichts wurde unvollständig gemacht“'
  rationale: Der Zusammenhang handelt von Gottes geordneten Werken. Das im Deutschen ausgedrückte Pronomen stellt den Kontextbezug her, ohne einen über den Text hinausgehenden theologischen Zusatz einzuführen.
- issue: Verhältnis der paarweise geordneten Dinge
  choice: „eines dem anderen gegenüber“
  alternative: „eines dem anderen entsprechend“
  rationale: κατέναντι kann Gegenüberstellung und Entsprechung ausdrücken. „Gegenüber“ erhält diese Spannung und legt nicht fest, dass alle Paare Gegensätze im strengen philosophischen Sinn seien.
translation_notes:
  register: Knapper, würdevoller Weisheitsspruch in modernem Standarddeutsch. „Paarweise geordnet“ klingt natürlicher als „doppelt“ und bleibt nahe an der Zustandsaussage des Griechischen; „unvollständig“ vermeidet eine konfessionelle oder philosophische Überdeutung von ἐκλιπόν.
