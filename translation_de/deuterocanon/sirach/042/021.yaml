base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/042/021.yaml
  text: He has set in order the mighty works of his wisdom[a], and he alone is from everlasting. He neither gains increase nor diminishes[d][c][b], and he has no need of any counselor.
translation:
  language: de
  text: Die Machttaten seiner Weisheit hat er geordnet,[a] und er allein ist von Ewigkeit her.[b] Ihm wird nichts hinzugefügt und nichts weggenommen,[c] und er braucht keinen, der Einsicht hat.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die hebräische Wendung kann auch heißen: „Die Macht seiner Weisheit hat er geordnet.“ Der griechische Paralleltext spricht von den „großen Taten“ seiner Weisheit.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Er ist einer von alters her.“ Der griechische Paralleltext erweitert die Zeitangabe zu „vor dem Zeitalter und bis in das Zeitalter“.'
    reason: cross_reference
  - marker: c
    text: 'Das zweite hebräische Verb ist schwierig. Gemeint ist wahrscheinlich, dass Gott weder etwas hinzugefügt noch etwas weggenommen werden kann; möglich ist auch: „Er nimmt nicht zu und nicht ab.“'
    reason: alternative_reading
  - marker: d
    text: 'Wörtlich: „keinen Einsichtigen“ oder „keinen Verständigen“; dem Sinn nach ist auch „keinen Ratgeber“ möglich.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גבורת חכמתו
  choice: die Machttaten seiner Weisheit
  rationale: Die hebräische Fügung ist knapp und kann auch „die Macht seiner Weisheit“ bedeuten. Der griechische Paralleltext mit τὰ μεγαλεῖα stützt jedoch das Verständnis als machtvolle bzw. große Taten, in denen sich seine Weisheit zeigt.
- source_word: תכן
  choice: hat er geordnet
  rationale: Das Verb kann messen, festsetzen, einrichten oder ordnen bezeichnen; griechisch ἐκόσμησεν bestätigt hier die Bedeutung „ordnen/gestalten“.
- source_word: אחד הוא
  choice: er allein ist
  rationale: Wörtlich „er ist einer“. Im Zusammenhang drückt die Wendung wahrscheinlich Gottes Einzigkeit aus; die wörtliche Form bleibt in der Fußnote sichtbar.
- source_word: מעולם
  choice: von Ewigkeit her
  rationale: Das Hebräische kann auch „von alters her“ heißen. Der griechische Paralleltext „vor dem Zeitalter und bis in das Zeitalter“ stützt den umfassenden zeitlichen Sinn.
- source_word: לא נוסף ולא נאצל
  choice: Ihm wird nichts hinzugefügt und nichts genommen
  rationale: Die parallele, passive Form des Hebräischen wird möglichst eng bewahrt. נאצל ist schwierig; im Gegensatz zu „hinzugefügt“ liegt die Bedeutung „weggenommen/vermindert“ nahe.
- source_word: ולא צריך לכל מבין
  choice: und er braucht keinen, der Einsicht hat
  rationale: מבין bezeichnet wörtlich einen Einsichtigen oder Verständigen. Die Übersetzung vermeidet die funktionale Verengung auf „Ratgeber“, lässt diese Deutung aber als Alternative in der Fußnote erkennen.
theological_decisions:
- issue: Göttliche Einzigkeit in אחד הוא
  choice: er allein ist
  alternative: er ist einer
  rationale: Die idiomatische Fassung bringt die wahrscheinliche Aussage der Einzigkeit zum Ausdruck, ohne die wörtliche und möglicherweise stärker ontologische Form zu verschweigen.
- issue: Zeitliche Aussage von מעולם
  choice: von Ewigkeit her
  alternative: von alters her
  rationale: Das Hebräische allein ist weniger eindeutig; die ausdrückliche Ausweitung im griechischen Paralleltext stützt die umfassende Ewigkeitsaussage.
- issue: Unveränderlichkeit in לא נוסף ולא נאצל
  choice: Ihm wird nichts hinzugefügt und nichts genommen
  alternative: Er nimmt nicht zu und nicht ab
  rationale: Die gewählte Form wahrt die Aussage, dass Gott weder Ergänzung noch Verlust erfährt, ohne die schwierige zweite Verbform übermäßig festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Satzstruktur des Hebräischen bleibt erkennbar; schwierige oder mehrdeutige Stellen werden nicht im Haupttext überladen, sondern durch Fußnoten offengelegt.
