base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/042/011.yaml
  text: Keep a strict watch over your virgin daughter[a], lest she make you a byword of disgrace, a gossip of the city and a curse of the people[c][b], and seat you in the assembly at the gate.
translation:
  language: de
  text: Wache streng über deine jungfräuliche Tochter[a], damit sie dir nicht einen Schandnamen einbringt – zum Gerede in der Stadt und zum Fluch des Volkes – und dich in die Versammlung am Tor setzt.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Eine kürzere hebräische Textform aus Masada lautet sinngemäß: „Über eine Tochter halte Wache; Gerede in der Stadt und eine Versammlung des Volkes …“ Der hier übersetzte Geniza-Text ist ausführlicher.'
    reason: textual_variant
  - marker: b
    text: Die hebräische Schlusswendung ist schwierig. Wörtlich geht es darum, jemanden „in der Ansammlung am Tor“ sitzen zu lassen. Das Stadttor war ein öffentlicher Ort für Versammlung und Rechtsprechung; die griechische Parallele spricht entsprechend von Beschämung vor einer großen Menge.
    reason: cultural_note
lexical_decisions:
- source_word: בני ... החזק משמר
  choice: Halte ... strenge Wache
  rationale: בני ist hier im Zusammenhang mit משמר idiomatisch als Aufforderung zu verstehen, eine Bewachung einzurichten bzw. aufrechtzuerhalten; החזק verstärkt sie. Die deutsche Wendung gibt das natürlich und nachdrücklich wieder.
- source_word: על בתולתך
  choice: über deine jungfräuliche Tochter
  rationale: בתולה bezeichnet eine Jungfrau bzw. junge Frau mit entsprechender sozial-sexueller Nuance. „Jungfräuliche Tochter“ bewahrt diese Bedeutung enger als nur „unverheiratete Tochter“.
- source_word: פן תעשה לך שם סרה
  choice: damit sie dir nicht einen Schandnamen einbringt
  rationale: שם סרה bezeichnet einen entehrenden Namen oder schlechten Ruf. „Einen Schandnamen einbringen“ wahrt das Namensmotiv und klingt im Deutschen verständlich.
- source_word: דבת עיר
  choice: Stadtgespräch
  rationale: דבה kann Gerede, üble Nachrede oder Gerücht bedeuten. „Stadtgespräch“ fasst die öffentliche Rede über die betroffene Person knapp zusammen, ohne den Begriff unnötig auf Verleumdung festzulegen.
- source_word: וקללת עם
  choice: Fluch des Volkes
  rationale: Die nominale Fügung bezeichnet öffentlichen Fluch bzw. gemeinschaftliche Verwünschung. Die Formulierung bleibt nahe an der hebräischen Konstruktion.
- source_word: והושיבתך
  choice: und dich ... setzt
  rationale: 'Die Hifil-Form ist kausativ: Die Tochter bewirkt, dass der Angesprochene dort sitzt bzw. seinen Platz erhält. Die etwas auffällige Formulierung bewahrt diese Kausalität.'
- source_word: בעדר שער
  choice: in die Versammlung am Tor
  rationale: Die schwierige Wendung wird als Menschenansammlung bzw. öffentliche Versammlung beim Stadttor verstanden. Das Tor war Ort öffentlicher Beratung und Rechtsprechung; die griechische Parallele bestätigt den Zusammenhang öffentlicher Beschämung.
theological_decisions:
- issue: Verhältnis des erhaltenen hebräischen Textes zur griechischen Parallele
  choice: Der hebräische Geniza-Text bildet die Übersetzungsgrundlage; die griechische Parallele dient nur zur Absicherung des Zusammenhangs öffentlicher Beschämung und der schwierigen Schlusswendung.
  alternative: 'Der griechischen Erweiterung folgen: Sie mache den Vater den Feinden zum Gespött und beschäme ihn vor einer großen Menge.'
  rationale: Da der hebräische Text erhalten ist, bleibt seine kürzere und spannungsreichere Form maßgeblich. Die griechische Fassung klärt den Kontext, ihre zusätzlichen Elemente werden jedoch nicht in den Haupttext übernommen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit enger Bindung an die hebräische Bildsprache. Die altertümlich oder missverständlich klingende wörtliche Möglichkeit „Herde des Tores“ wurde vermieden; die Schwierigkeit der Schlusswendung wird in der Fußnote offengelegt.
