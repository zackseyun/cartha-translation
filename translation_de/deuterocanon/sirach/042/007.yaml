  text: For whatever place you appoint[a], keep count by your hand; and every giving and receiving should be in writing.
translation:
  language: de
  text: Bei allem, was du anvertraust[a], zähle eigenhändig; und halte alles Geben und Nehmen schriftlich fest.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die erste hebräische Wortgruppe ist elliptisch und in ihrem genauen Bezug unsicher. מקום bedeutet gewöhnlich »Ort« oder »Stelle«; פקד kann je nach Zusammenhang »einsetzen«, »zuweisen«, »anvertrauen« oder »hinterlegen« bedeuten. Die griechische Parallelüberlieferung lautet sinngemäß: »Was immer du übergibst, [tue es] nach Zahl und Gewicht; alles Geben und Nehmen geschehe schriftlich.« Sie stützt hier den allgemeinen Sinn von anvertrauten oder übergebenen Vorgängen, fügt aber »Zahl und Gewicht« hinzu.'
    reason: alternative_reading
lexical_decisions:
- source_word: על מקום תפקד
  choice: Was immer du an einem Ort hinterlegst
  rationale: Die hebräische Wendung ist stark verkürzt. מקום bezeichnet wörtlich einen Ort, während פקד hier ein Zuweisen, Anvertrauen oder Hinterlegen ausdrücken kann. Die Übersetzung wahrt den Ortsbezug und gibt zugleich den durch den Zusammenhang sowie das griechische παραδιδῷς gestützten Sinn einer anvertrauten Sache wieder.
- source_word: יד תספור
  choice: zähle eigenhändig nach
  rationale: Wörtlich steht etwa »deine Hand soll zählen«. »Eigenhändig nachzählen« bewahrt das konkrete Bild der Hand und vermittelt natürlich den Gedanken persönlicher, sorgfältiger Kontrolle.
- source_word: ומתת ולקח
  choice: jedes Geben und Nehmen
  rationale: Das Wortpaar bezeichnet ein- und ausgehende Vorgänge beziehungsweise wechselseitige Geschäfte. Die geläufige deutsche Paarformel entspricht auch dem griechischen δόσις καὶ λῆψις, ohne die Art der Transaktion unnötig einzuengen.
- source_word: הכל בכתב
  choice: halte … schriftlich fest
  rationale: Die knappe hebräische Formulierung »alles schriftlich« fordert dokumentierte Rechenschaft. Die verbale Fassung ist im modernen Deutschen natürlich und bezieht »alles« sachgerecht auf jedes Geben und Nehmen.
