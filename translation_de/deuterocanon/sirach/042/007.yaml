- from: Was immer du an einem Ort hinterlegst[a], zähle eigenhändig nach; und halte jedes Geben und Nehmen schriftlich fest.
  to: Bei allem, was du anvertraust[a], zähle eigenhändig; und halte alles Geben und Nehmen schriftlich fest.
  rationale: Die Übersetzung beseitigt die nicht hinreichend abgesicherte Vorstellung eines Hinterlegens an einem bestimmten Ort. Sie gibt den durch Kontext und griechische Parallelüberlieferung gestützten Bereich des Anvertrauens wieder und legt die verbleibende hebräische Mehrdeutigkeit in der Fußnote offen. Die zweite Satzhälfte bleibt inhaltlich unverändert; „eigenhändig“ bewahrt die konkrete Bildlichkeit von „deine Hand soll zählen“.
