translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die praktische Mahnung zu persönlicher Kontrolle und schriftlicher Dokumentation steht klar im Vordergrund; die genuine Unsicherheit der ersten hebräischen Satzhälfte wird in der Fußnote offengelegt.
