lexical_decisions:
- source_word: ἓν τοῦ ἑνὸς
  choice: das eine … des anderen
  rationale: Die elliptische Wendung bezeichnet im Zusammenhang der geordneten Schöpfung die Beziehung eines geschaffenen Dinges zu einem anderen. Das substantivierte „das eine“ ist im Deutschen verständlich, ohne ein nicht ausdrücklich genanntes Bezugswort einzufügen.
- source_word: ἐστερέωσεν
  choice: stärkte
  rationale: Das Verb bedeutet grundlegend „fest machen“, „festigen“ oder „stärken“. „Stärkte“ bewahrt diese konkrete Aussage und lässt zugleich erkennen, dass die geschaffenen Dinge einander in ihrem Guten fördern; die kontextuelle Möglichkeit „ergänzte“ wird in der Fußnote genannt.
- source_word: τὰ ἀγαθά
  choice: das Gute
  rationale: Der substantivierte Plural bezeichnet die guten Eigenschaften, Gaben oder Vorzüge in umfassendem Sinn. Das deutsche Kollektiv „das Gute“ ist hier natürlicher als „die guten Dinge“.
- source_word: τίς πλησθήσεται
  choice: wer könnte sich … sattsehen?
  rationale: Das Futur Passiv von πίμπλημι bedeutet wörtlich „wer wird erfüllt werden?“ oder „wer wird satt werden?“. Die idiomatische deutsche Wendung „sich sattsehen“ verbindet dies natürlich mit dem folgenden Partizip und erhält die rhetorische Unerschöpflichkeit.
- source_word: ὁρῶν
  choice: sich … sattsehen
  rationale: Das präsentische Partizip bezeichnet fortdauerndes Schauen. Es wird in die deutsche feste Wendung „sich an etwas sattsehen“ aufgenommen.
- source_word: δόξαν αὐτοῦ
  choice: seiner Herrlichkeit
  rationale: δόξα bezeichnet hier sichtbare Hoheit, Pracht oder Herrlichkeit. Das maskuline Possessivpronomen gibt den wahrscheinlichsten Bezug auf Gott wieder.
theological_decisions:
- issue: Bezugswort von αὐτοῦ
  choice: „seiner“ bezieht sich auf Gott
  alternative: Das Pronomen kann auf die in der Schöpfung sichtbare Pracht beziehungsweise auf ein zuvor genanntes Schöpfungswerk bezogen werden.
  rationale: Im umgebenden Lob der Schöpfungsordnung weist die Herrlichkeit am ehesten auf Gott, dessen Hoheit in seinen Werken sichtbar wird. Da der grammatische Bezug nicht völlig eindeutig ist, bleibt die andere Möglichkeit in einer Fußnote erhalten.
- issue: Wechselseitige Beziehung der geschaffenen Dinge
  choice: Ein geschaffenes Ding stärkt das Gute des anderen
  alternative: Ein geschaffenes Ding ergänzt das Gute des anderen.
  rationale: Die Übersetzung folgt zunächst dem Grundsinn von ἐστερέωσεν und vermeidet es, die gegenseitige Passung der Schöpfungswerke als vollständige Ergänzung auszudeuten. Die kontextuell plausible Nuance wird in der Fußnote bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Das eine … des anderen“ erhält die knappe, paarweise Formulierung des Griechischen; „sich sattsehen“ gibt die rhetorische Frage natürlich und einprägsam wieder.
