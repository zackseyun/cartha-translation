translation:
  language: de
  text: Das eine stärkt das Gute des anderen[a], und wer könnte sich an seiner Herrlichkeit sattsehen?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Das eine ergänzt die guten Eigenschaften des anderen.“ Das griechische Verb bedeutet wörtlich „fest machen“, „festigen“ oder „stärken“; im Zusammenhang kann es auch das Zusammenwirken der geschaffenen Dinge ausdrücken.'
    reason: lexical_alternative
  - marker: b
    text: „Seiner“ bezieht sich wahrscheinlich auf Gott. Möglich ist auch ein Bezug auf die in der Schöpfung sichtbare Pracht.
