base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/042/014.yaml
  text: Better a man's wickedness than a woman's goodness[a], and a woman who brings shame becomes a reproach.
translation:
  language: de
  text: Besser die Bosheit eines Mannes als die Güte einer Frau; und eine Frau, die Schande bringt, wird zum Schimpf.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hebräische Schlussteil des Verses ist schwer verständlich. Die griechische Parallelfassung lautet sinngemäß: »und eine Frau, die Schande bringt, führt zu Schmach«; sie stützt die hier wiedergegebene Bedeutung.'
    reason: alternative_reading
lexical_decisions:
- source_word: מטוב ... מטוב
  choice: Besser ... als
  rationale: Das assimilierte מן in מטוב hat hier vergleichende Funktion; die griechische Parallele κρείσσων ... ἢ bestätigt diese Lesart.
- source_word: רוע איש
  choice: die Bosheit eines Mannes
  rationale: רוע bezeichnet moralische Schlechtigkeit beziehungsweise Bosheit; איש ist im ausdrücklichen Gegensatz zu אשה geschlechtsspezifisch wiederzugeben.
- source_word: מטוב אשה
  choice: als die Güte einer Frau
  rationale: Die hebräische Fassung vergleicht wörtlich die Bosheit eines Mannes mit der Güte einer Frau. Diese Spannung bleibt erhalten.
- source_word: אשה מחרפת
  choice: eine Frau, die Schande bringt
  rationale: 'Das Partizip wird aktiv verstanden: Die Frau verursacht Beschämung oder Schande. Dies stimmt mit dem griechischen καταισχύνουσα überein.'
- source_word: תביע ... חרפת
  choice: wird zum Gegenstand der Schmach
  rationale: Die hebräische Schlusswendung ist schwierig. Die Wiedergabe drückt das durch die griechische Parallele gestützte Ergebnis aus, ohne eine präzise, aber unsichere Einzelbedeutung von תביע vorzutäuschen.
theological_decisions:
- issue: Moralisch anstößiger, geschlechtsspezifischer Vergleich
  choice: Der Gegensatz zwischen Mann und Frau wird ungemildert beibehalten.
  alternative: Den Spruch geschlechtsneutral wiedergeben oder seine Wertung abschwächen.
  rationale: איש und אשה stehen ausdrücklich einander gegenüber. Eine Übersetzung soll die problematische Rhetorik des Quelltextes sichtbar lassen, statt sie stillschweigend zu korrigieren.
- issue: Schwierige hebräische Schlusswendung
  choice: Das Hebräische bleibt Grundlage; die griechische Parallele klärt die Richtung des Sinnes.
  alternative: Die Schlusswendung streng wörtlich und dadurch kaum verständlich oder ausschließlich nach dem Griechischen wiedergeben.
  rationale: תביע ist in diesem Zusammenhang unsicher. Das Griechische unterstützt jedoch klar den Zusammenhang von beschämendem Verhalten und Schmach.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die bewusst schroffe und anstößige Gegenüberstellung des antiken Spruchs wird weder geglättet noch durch inklusive Sprache neutralisiert. »Gegenstand der Schmach« bewahrt den resultativen Sinn und klingt natürlicher als das mehrdeutige »wird zur Schmach«.
