- from: Dies alles lebt und bleibt für immer; für jeden Zweck gehorcht alles.[a][b]
  to: Dies alles lebt und bleibt für immer; bei jedem Bedarf gehorcht alles.[a][b]
  rationale: Die Änderung von „für jeden Zweck“ zu „bei jedem Bedarf“ bewahrt die offene, primäre Bedarfsbedeutung von ἐν πάσαις χρείαις und vermeidet eine unnötige Festlegung. Die beiden anderen gut möglichen Nuancen bleiben in der Fußnote erhalten. Der textkritisch begründete Haupttext und die transparente Fußnote zur abweichenden hebräischen Geniza-Zeile bleiben unverändert.
