  text: All these live and endure forever; in every need, all obey.[a][b]
translation:
  language: de
  text: Dies alles lebt und bleibt für immer; bei jedem Bedarf gehorcht alles.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hier gedruckte hebräische Text aus der Kairoer Geniza bietet eine andere, vermutlich aus dem nahen Zusammenhang versetzte Zeile, etwa: „Und wer kann sich sattsehen am Anblick des Glanzes der Höhe des Himmels in seiner Reinheit?“ Ältere hebräische Zeugnisse aus Masada und die griechische Überlieferung stützen den Sinn des Haupttextes.'
    reason: textual_variant
  - marker: b
    text: 'Oder: „für jeden Zweck“ beziehungsweise „für jeden Gebrauch“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα ταῦτα / הכל
  choice: Dies alles
  rationale: Gibt die demonstrative Bedeutung des griechischen Ausdrucks wieder und verweist natürlich auf die zuvor beschriebenen Schöpfungswerke.
- source_word: ζῇ
  choice: lebt
  rationale: Die schlichte Präsensform bewahrt die lebendige Aussage über das fortdauernde Leben der Schöpfungswerke.
- source_word: μένει εἰς τὸν αἰῶνα
  choice: bleibt für immer
  rationale: Entspricht direkt dem Gedanken dauerhaften Fortbestehens und klingt im modernen Deutschen natürlich.
- source_word: ἐν πάσαις χρείαις
  choice: für jeden Zweck
  rationale: χρεία kann Bedarf, Gebrauch oder Zweck bezeichnen. Im Zusammenhang mit der geordneten Dienstbarkeit der Schöpfung ist „für jeden Zweck“ verständlich, ohne die Wendung auf eine einzelne Bedeutung zu verengen.
- source_word: ὑπακούει
  choice: gehorcht
  rationale: Bewahrt die Grundbedeutung von bereitwilligem Hören und Gehorsam gegenüber der göttlichen Ordnung.
- source_word: ומי ישבע להביט תואר תואר מרום רקיע על טוהר
  choice: abweichende hebräische Zeile in der Fußnote
  rationale: Der gedruckte Geniza-Text ergibt hier eine andere, im Kontext vermutlich versetzte Zeile. Der Haupttext folgt deshalb dem kohärenten Sinn der griechischen Überlieferung, der zudem durch ältere hebräische Zeugnisse aus Masada gestützt wird.
theological_decisions:
- issue: Hauptlesart bei einer vermutlich versetzten hebräischen Zeile
  choice: Der Haupttext folgt der griechischen Parallelüberlieferung und dem durch Masada gestützten Sinn.
  alternative: „Und wer kann sich sattsehen am Glanz der Höhe des Himmels in seiner Reinheit?“
  rationale: Die überlieferte Geniza-Zeile passt nicht zum Zusammenhang und scheint aus dem benachbarten Kontext versetzt zu sein. Die griechische Fassung bietet hier eine zusammenhängende Aussage und entspricht älterer hebräischer Evidenz. Die abweichende hebräische Lesart wird transparent in einer Fußnote erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallele Satzstruktur bleibt knapp und poetisch; die Textunsicherheit wird nicht im Haupttext geglättet, sondern ausdrücklich in der Fußnote offengelegt.
