translation:
  language: de
  text: über die Abrechnung eines Pächters[a], eines Herrn und eines Gastes und über die Teilung von Erbe und Besitz[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Parallele lautet: „über die Abrechnung eines Teilhabers und von Reisenden, über die Übergabe des Erbes von Teilhabern“. Sie spiegelt an mehreren Stellen einen abweichenden Ausgangstext wider. Die Übersetzung folgt dem erhaltenen hebräischen Text.'
    reason: alternative_reading
  - marker: b
    text: Das letzte hebräische Wort ist knapp und in seiner Bedeutung an dieser Stelle nicht ganz sicher. Wegen des rechtlich-wirtschaftlichen Zusammenhangs wird es mit „Besitz“ wiedergegeben.
    reason: lexical_alternative
lexical_decisions:
- source_word: על
  choice: über
  rationale: Die wiederholte Präposition führt die Themen der aufzählenden Aussage ein. „Über“ gibt diese thematische Funktion knapp und natürlich wieder.
- source_word: חשבון
  choice: Abrechnung
  rationale: Das Wort bezeichnet hier eine finanzielle oder rechtliche Rechnungslegung. „Abrechnung“ passt zum wirtschaftlichen Zusammenhang und ist präziser als das allgemeinere „Rechnung“.
- source_word: חוכר
  choice: Pächter
  rationale: Gemeint ist jemand, der Land oder anderen Besitz gegen Entgelt nutzt. „Pächter“ ist im Deutschen der klare rechtlich-wirtschaftliche Ausdruck.
- source_word: אדון
  choice: Herr
  rationale: Das Wort bezeichnet eine Person mit Autorität, möglicherweise den Hausherrn oder Eigentümer. „Herr“ bewahrt diese Bedeutungsbreite, ohne den Text auf „Eigentümer“ festzulegen.
- source_word: אורח
  choice: Gast
  rationale: Das hebräische Wort kann einen Gast oder Reisenden bezeichnen. „Gast“ ist die naheliegende Wiedergabe des erhaltenen hebräischen Textes; die griechische Parallele bietet an dieser Stelle eine abweichende Lesart.
- source_word: מחלקות
  choice: Teilung
  rationale: Das Substantiv bezeichnet das Teilen oder Zuteilen und verbindet sich im Deutschen natürlich mit „Erbe“.
- source_word: נחלה
  choice: Erbe
  rationale: Der übliche familien- und besitzrechtliche Sinn ist ererbter Besitz. „Erbe“ ist hier knapp und allgemein verständlich.
- source_word: ויש
  choice: und Besitz
  rationale: Das knappe und an dieser Stelle ungewöhnliche יש weist im rechtlich-wirtschaftlichen Zusammenhang wahrscheinlich auf vorhandenes Vermögen oder Eigentum. „Besitz“ bewahrt diesen Sinn, während eine Fußnote die Unsicherheit offenlegt.
