revisions:
- from: Solange sie Jungfrau ist[a], damit sie nicht verführt wird, und im Haus ihres Mannes, damit sie nicht auf Abwege gerät; im Haus ihres Vaters, damit sie nicht schwanger wird, und im Haus ihres Mannes[b], damit sie nicht unfruchtbar bleibt.
  to: Als Jungfrau soll sie nicht verführt werden und im Haus ihres Mannes nicht auf Abwege geraten; im Haus ihres Vaters soll sie nicht schwanger werden und im Haus ihres Mannes nicht unfruchtbar werden.
  rationale: Die Übersetzung wird ausschließlich zur Behebung der unnatürlichen deutschen Satzfügung überarbeitet. Die modalen „soll“-Sätze machen die warnende, elliptische Struktur verständlich, ohne eine zusätzliche handelnde Person einzuführen. Die Abfolge der häuslichen Situationen bleibt wie im hebräischen Text erhalten. In der letzten Klausel wird „werden“ statt „bleiben“ gewählt, um keinen im Ausgangstext nicht genannten Fortbestand vorauszusetzen. Die Fußnote b wird entsprechend angepasst.
