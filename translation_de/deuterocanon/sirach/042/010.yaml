review_pass:
  verdict: revise
  source_fidelity: 'Die Grundbedeutungen werden zutreffend wiedergegeben: Verführung in der Jungfräulichkeit, Abirren im ehelichen Hausstand, Schwangerschaft im Haus des Vaters und Unfruchtbarkeit im Haus des Mannes. Die Deutung der letzten Klausel als Unfruchtbarkeit ist angesichts des Kontextes und der griechischen Parallelüberlieferung gut begründet. Die modale Wiedergabe wahrt die knappe Warnstruktur, ohne die im Hebräischen unterschiedlich markierten Negationen unnötig zu harmonisieren.'
  naturalness: 'Die Verbindung „Solange sie Jungfrau ist, damit sie nicht ...“ ist im modernen Standarddeutsch syntaktisch und idiomatisch missglückt: Eine Zeitangabe mit „solange“ lässt sich hier nicht natürlich mit dem finalen „damit“ verbinden. Eine durchgängig modale Formulierung mit „soll“ ist klar, würdig und bewahrt den parataktischen Charakter des Verses.'
  terminology: „Jungfrau“, „Haus ihres Mannes“, „auf Abwege geraten“, „schwanger werden“ und „unfruchtbar werden“ sind angemessen. „Unfruchtbar werden“ ist gegenüber „unfruchtbar bleiben“ vorzuziehen, da weder der hebräische noch der griechische Text ausdrücklich ein bereits bestehendes Unfruchtbarsein voraussetzt. Die Fußnoten stellen das Verhältnis von hebräischem Text und griechischer Parallelüberlieferung sachgerecht dar.
  issues:
  - severity: medium
    issue: Syntaktisch unnatürliche Verbindung von „Solange“ und „damit“ im ersten Teilsatz
    rationale: „Solange sie Jungfrau ist, damit sie nicht verführt wird“ verbindet eine temporale Einleitung mit einer finalen Konstruktion, ohne dass im Deutschen ein tragfähiger Hauptsatz entsteht. Dadurch wirkt der Vers trotz seiner bewusst knappen Struktur fehlerhaft.
  - severity: low
    issue: „unfruchtbar bleibt“ legt einen nicht ausgedrückten Fortbestand nahe
    rationale: Die hebräische Form ist semantisch knapp; die griechische Parallele bedeutet „unfruchtbar werden“. „Unfruchtbar werden“ gibt den wahrscheinlichen Sinn ohne zusätzliche Aspektbedeutung wieder.
  revised_text: Als Jungfrau soll sie nicht verführt werden und im Haus ihres Mannes nicht auf Abwege geraten; im Haus ihres Vaters soll sie nicht schwanger werden und im Haus ihres Mannes nicht unfruchtbar werden.
  revised_footnotes:
  - marker: a
    text: Griechisch hat hier »damit sie nicht entehrt wird«, während das Hebräische »damit sie nicht verführt wird« lautet. Dadurch wird der sexuelle Sinn ausdrücklich hervorgehoben.
    reason: alternative_reading
  - marker: b
    text: Die letzte Wendung könnte wörtlicher mit »damit sie nicht gehindert wird« wiedergegeben werden; die griechische Parallelüberlieferung stützt jedoch den Sinn »damit sie nicht unfruchtbar wird«.
