base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/042/010.yaml
  text: In her virginity[a], lest she be seduced, and in her husband’s house, lest she go astray; in her father’s house, lest she become pregnant, and in her husband’s house[b], lest she be barren.
translation:
  language: de
  text: Als Jungfrau soll sie nicht verführt werden und im Haus ihres Mannes nicht auf Abwege geraten; im Haus ihres Vaters soll sie nicht schwanger werden und im Haus ihres Mannes nicht unfruchtbar werden.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בבתוליה
  choice: Solange sie Jungfrau ist
  rationale: Die Wendung bezeichnet ihren Stand als Jungfrau. Die zeitliche Formulierung ist im heutigen Deutsch natürlicher als das substantivische »in ihrer Jungfräulichkeit« und entspricht zugleich dem griechischen ἐν παρθενίᾳ.
- source_word: פן תפתה
  choice: damit sie nicht verführt wird
  rationale: Das hebräische Verb steht hier in passivischem Sinn. Im Zusammenhang ist sexuelle Verführung gemeint; die Formulierung bleibt jedoch näher am Hebräischen als eine ausdrückliche Aussage über Entehrung.
- source_word: ובבית בעלה
  choice: und im Haus ihres Mannes
  rationale: Die Wiedergabe erhält den gesellschaftlichen und häuslichen Schauplatz des hebräischen Ausdrucks.
- source_word: לא תשטה
  choice: damit sie nicht auf Abwege gerät
  rationale: Das Verb bezeichnet ein Abirren oder Fehlgehen. »Auf Abwege geraten« lässt die moralische und mögliche sexuelle Bedeutung offen, ohne ausdrücklich Ehebruch einzutragen.
- source_word: בבית אביה
  choice: im Haus ihres Vaters
  rationale: Wörtliche und im Deutschen verständliche Wiedergabe des vorehelichen häuslichen Umfelds.
- source_word: פן תהרה
  choice: damit sie nicht schwanger wird
  rationale: Das hebräische Verb bedeutet schwanger werden beziehungsweise empfangen. Die gewählte Form ist klares, heutiges Deutsch.
- source_word: בבית אישה
  choice: und im Haus ihres Mannes
  rationale: איש bezeichnet in diesem ehelichen Zusammenhang den Ehemann. Die gleiche Wiedergabe wie bei בעלה sorgt für natürliches Deutsch, ohne den Bedeutungsunterschied der beiden Ausdrücke zu überdehnen.
- source_word: פן תעצר
  choice: damit sie nicht unfruchtbar bleibt
  rationale: Das hebräische Verb kann wörtlich ein Gehemmt- oder Zurückgehaltenwerden bezeichnen. Im Fortpflanzungskontext und angesichts des griechischen στειρώσῃ ist Unfruchtbarkeit sehr wahrscheinlich gemeint.
theological_decisions:
- issue: Verhältnis des erhaltenen hebräischen Textes zur griechischen Parallelüberlieferung
  choice: Der erhaltene hebräische Text bildet die Grundlage; der griechische Text dient bei knappen oder mehrdeutigen Ausdrücken als Kontrollzeugnis.
  alternative: Eine stärker vom Griechischen geprägte Fassung könnte von »entehrt werden«, »übertreten« und »unfruchtbar werden« sprechen.
  rationale: Das Hebräische ist hier weitgehend zusammenhängend und soll daher nicht durch das Griechische ersetzt werden. Das Griechische bestätigt jedoch den sexuellen Zusammenhang und stützt in der letzten Klausel die Deutung auf Unfruchtbarkeit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wiederholte Satzform bewahrt die knappe, mahnende Struktur des Hebräischen; »damit sie nicht« gibt פן idiomatisch wieder. Die ungewöhnliche Abfolge von vorehelichem und ehelichem Hausstand wurde nicht geglättet.
