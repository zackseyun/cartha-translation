base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/042/016.yaml
  text: The sun rises and shines on everything revealed[b][a], and the glory of the Lord is over all his works.
translation:
  language: de
  text: Die Sonne geht auf und scheint auf alles Sichtbare[b][a], und die Herrlichkeit des Herrn ist über all seinen Werken.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: „auf alles Sichtbare“ oder „auf alles, was offenbar geworden ist“. Die griechische Parallele lautet sinngemäß eher: „Licht spendend blickt sie auf alles.“'
    reason: alternative_reading
  - marker: b
    text: Der ältere hebräische Textzeuge aus Masada scheint in dieser Zeile einen anderen Wortlaut zu bewahren als die Kairoer Geniza-Handschriften, auf denen der Haupttext beruht.
    reason: textual_variant
lexical_decisions:
- source_word: שמש
  choice: die Sonne
  rationale: Direkte und im Deutschen idiomatische Wiedergabe des Himmelskörpers mit bestimmtem Artikel.
- source_word: זורחת
  choice: geht auf und scheint
  rationale: Das Partizip von זרח kann sowohl das Aufgehen als auch das Strahlen der Sonne bezeichnen. Die Doppelwendung bringt beide eng verbundenen Bildaspekte natürlich zum Ausdruck; die griechische Parallele stützt besonders den Aspekt des Leuchtens.
- source_word: על כל
  choice: auf alles / über all
  rationale: Die Präposition mit כל bezeichnet in beiden Satzgliedern einen umfassenden Wirkungsbereich. Im ersten Satzglied ist „auf alles“ beim Scheinen idiomatisch, im zweiten wahrt „über all“ die räumliche Bildsprache.
- source_word: נגלתה
  choice: Sichtbare
  rationale: Die Form bezeichnet wahrscheinlich das Offenbare, Sichtbargewordene oder Aufgedeckte. „Alles Sichtbare“ ist natürliches Deutsch und bewahrt den weiten Bezug, ohne ihn auf die Schöpfung oder bestimmte Gegenstände einzuengen.
- source_word: כבוד
  choice: Herrlichkeit
  rationale: „Herrlichkeit“ ist für כבוד in Bezug auf Gott die etablierte, inhaltlich gewichtige Wiedergabe und erhält die poetische Aussage.
- source_word: ה׳
  choice: des Herrn
  rationale: Die hebräische Handschrift bietet die abgekürzte Gottesbezeichnung. „Herr“ entspricht der üblichen deutschsprachigen Wiedergabe in diesem deuterokanonischen Zusammenhang, ohne eine im Text nicht ausgeschriebene Namensform zu erzwingen.
- source_word: מעשיו
  choice: seinen Werken
  rationale: „Werke“ deckt sowohl Gottes Taten als auch das von ihm Geschaffene ab und bewahrt den knappen Parallelismus.
theological_decisions:
- issue: Wiedergabe der abgekürzten Gottesbezeichnung ה׳
  choice: des Herrn
  alternative: des HERRN
  rationale: Da der Zeuge eine Abkürzung bietet und Sirach in deutscher deuterokanonischer Tradition gewöhnlich „Herr“ verwendet, bleibt die Wiedergabe zurückhaltend und führt keine ausdrücklich ausgeschriebene Form des Gottesnamens ein.
- issue: Hebräisch-griechische Abweichung im ersten Satzglied
  choice: Die Sonne geht auf und scheint auf alles Sichtbare
  alternative: Die Sonne spendet Licht und blickt auf alles
  rationale: Der hebräische Text ist vorrangig und nennt das Sichtbare beziehungsweise Offenbare; die griechische Parallele betont dagegen das Erleuchten und Anschauen. Der Haupttext folgt dem Hebräischen, während die Fußnote die griechische Lesart und damit die echte textliche Spannung offenlegt.
- issue: Aussage über Gottes Herrlichkeit und seine Werke
  choice: die Herrlichkeit des Herrn ist über all seinen Werken
  alternative: sein Werk ist von seiner Herrlichkeit erfüllt
  rationale: Die Hauptfassung wahrt die Aussage des hebräischen Textes. Die abweichende griechische Konstruktion, nach der sein Werk von seiner Herrlichkeit erfüllt ist, wird nicht stillschweigend in den hebräischen Wortlaut eingetragen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem poetischem Ton. Die knappe Zweigliedrigkeit und die Präposition על werden soweit idiomatisch möglich bewahrt. Die Fußnotenmarker stehen entsprechend der geprüften englischen Beratungsschicht als [b][a] direkt nach der strittigen Wendung.
