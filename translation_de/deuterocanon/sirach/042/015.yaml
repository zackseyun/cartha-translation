base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/042/015.yaml
  text: I will remember the works of God[a], and what I have seen I will recount. At the word of God is his will, and his work accomplishes his pleasure.
translation:
  language: de
  text: Ich will der Werke Gottes gedenken[a] und erzählen, was ich gesehen habe. Auf Gottes Wort hin geschieht sein Wille, und sein Werk vollbringt, was ihm gefällt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Parallele lautet: »Ich will der Werke des Herrn gedenken und erzählen, was ich gesehen habe; in den Worten des Herrn sind seine Werke.« Der hebräische Schlusssatz ist schwer verständlich; der Haupttext gibt daher seinen wahrscheinlichen Sinn wieder.'
    reason: alternative_reading
lexical_decisions:
- source_word: אזכור נא
  choice: Ich will … denken
  rationale: זכר mit אֶל/Anschluss an ein Objekt wird hier natürlich als bewusstes Erinnern und Erwähnen wiedergegeben; נא markiert den Übergang, ohne zwingend ein ausdrückliches zeitliches »nun« zu verlangen.
- source_word: מעשי אל
  choice: die Werke Gottes
  rationale: מעשים bezeichnet Taten oder Werke; »Werke« passt zum feierlichen Lobzusammenhang und folgt dem hebräischen Gottesnamen אל.
- source_word: וזה חזיתי ואספרה
  choice: und erzählen, was ich gesehen habe
  rationale: Die verdichtete hebräische Formulierung wird als Relativsatz verstanden; auch die griechische Parallele stützt »was ich gesehen habe«.
- source_word: באומר אלהים רצונו
  choice: Wenn Gott spricht, geschieht sein Wille
  rationale: Der überlieferte Wortlaut ist schwierig. Die Wiedergabe erhält den Zusammenhang von Gottes Ausspruch und Willen, ohne die im Deutschen unnatürliche Form »bei Gottes Wort ist sein Wille« festzuschreiben.
- source_word: ופועל רצונו לקחו
  choice: und sein Werk vollbringt, was ihm gefällt
  rationale: Die Klausel ist textlich und syntaktisch unsicher. Die Übersetzung gibt den wahrscheinlichen Gedanken wieder, dass Gottes Wirken seinen רצון — Willen, Gefallen oder Wohlgefallen — verwirklicht.
theological_decisions:
- issue: Gottesbezeichnung אל gegenüber Κυρίου in der griechischen Parallele
  choice: Gott
  alternative: der Herr
  rationale: Der erhaltene hebräische Hauptzeuge hat אל; deshalb folgt der Haupttext »Gott«. Die abweichende griechische Gottesbezeichnung wird in der Fußnote sichtbar gemacht.
- issue: Schwierige Schlusszeile
  choice: Gottes Sprechen und Wirken verwirklichen seinen Willen beziehungsweise sein Gefallen
  alternative: »In den Worten des Herrn sind seine Werke« nach der griechischen Parallele
  rationale: Der hebräische Wortlaut ist schwer verständlich und seine genaue Syntax unsicher. Der Haupttext bietet den wahrscheinlichen Sinn in verständlichem Deutsch; die deutlich anders lautende griechische Überlieferung bleibt als Textalternative dokumentiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die erste Person und der hymnische Ton bleiben erhalten. Die schwierige Schlusszeile wird verständlich, aber nicht mit falscher textlicher Sicherheit formuliert; die griechische Alternative steht in der Fußnote.
