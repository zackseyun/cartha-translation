  source_fidelity: 'Der Haupttext folgt zutreffend dem hebräischen Hauptzeugen mit der schwierigen Abfolge ידים רפות und תפתח, ohne die abweichende, sinnvollere griechische Lesart in den Text einzutragen. „Öffne“ gibt תפתח angemessen als auffordernden Gebrauch des Imperfekts wieder. Für רפות ist jedoch „nachlässig“ eine zu starke Deutung: Das Wort bezeichnet primär schlaff, locker oder kraftlos und nicht ausdrücklich ein moralisch nachlässiges Handeln.'
  naturalness: Der Satz ist als bewusst sperriger Weisheitsspruch verständlich. „Schlaff“ ist im Deutschen die nähere und zugleich noch idiomatische Wiedergabe der bildhaften hebräischen Formulierung. Die ungewöhnliche Aussage des Halbverses bleibt dabei erkennbar, ohne sie durch die griechische Variante zu harmonisieren.
  terminology: „schlechte Ehefrau“ ist als kontextuelle Wahl für אשה רעה vertretbar; die Fußnote wahrt die weiter gefasste Bedeutung „Frau“. „Siegel“ entspricht חותם und der griechischen Parallele. Die Variantenfußnote ist korrekt verankert und benennt den für das Verständnis erheblichen Gegensatz der Überlieferungen.
