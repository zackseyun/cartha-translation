translation:
  language: de
  text: Bei einer schlechten Ehefrau[b] ist ein Siegel gut; und einen Ort, an dem die Hände schlaff sind, öffne[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hebräische Text lautet wörtlich etwa: „und einen Ort, an dem die Hände schlaff/lose sind, öffne.“ Die griechische Überlieferung hat dagegen: „Wo viele Hände sind, schließe ab.“'
    reason: textual_variant
  - marker: b
    text: 'Oder: „Frau“. Das hebräische Wort kann sowohl eine Frau allgemein als auch eine Ehefrau bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: אשה רעה
  choice: schlechte Ehefrau
  rationale: אשה kann „Frau“ oder „Ehefrau“ bedeuten. Der häusliche Zusammenhang legt „Ehefrau“ nahe; „schlecht“ gibt רעה natürlich wieder, ohne die Aussage zu verschärfen.
- source_word: חותם חסם
  choice: ein Siegel ist gut
  rationale: Die knappe hebräische Wendung bezeichnet ein Siegel beziehungsweise sicheres Verschließen. Die griechische Parallele καλὸν σφραγίς stützt die elliptische Aussage „ein Siegel ist gut“.
- source_word: ומקום
  choice: und einen Ort, an dem
  rationale: מקום leitet die Ortsangabe ein; die deutsche Form wahrt zugleich die mögliche syntaktische Rolle als vorangestelltes Objekt zu תפתח.
- source_word: ידים רפות
  choice: die Hände nachlässig sind
  rationale: Der hebräische Text bedeutet wörtlich „schlaffe/lose Hände“. „Nachlässig“ gibt den naheliegenden übertragenen Sinn verständlich wieder, ohne die abweichende griechische Lesart „viele Hände“ in den Haupttext zu übernehmen.
- source_word: תפתח
  choice: öffne
  rationale: Die überlieferte hebräische Form bedeutet „du sollst/wirst öffnen“. Trotz der Spannung zum Zusammenhang bleibt diese gut bezeugte Lesart im Haupttext stehen; die sinnentsprechende griechische Variante wird in der Fußnote dokumentiert.
theological_decisions:
- issue: Ehefrau oder Frau in einer schwierig klingenden Weisheitsmahnung
  choice: Ehefrau
  alternative: Frau
  rationale: Hebräisch אשה und griechisch γυνή erlauben beide Bedeutungen. Der Haushaltskontext spricht für „Ehefrau“ und verhindert, dass die Aussage unnötig auf Frauen allgemein ausgeweitet wird.
- issue: Textliche Spannung zwischen hebräischem und griechischem Schluss
  choice: Die hebräische Lesart „nachlässige Hände … öffne“ bleibt im Haupttext erhalten.
  alternative: „Wo viele Hände sind, schließe ab.“
  rationale: Die hoch bewertete hebräische Quelle hat ידים רפות und תפתח. Die griechische Parallele ergibt zwar einen unmittelbar verständlicheren Sicherheitsspruch, darf aber die genuine textliche Spannung nicht stillschweigend beseitigen.
translation_notes:
  register: Moderne, würdige Spruchsprache. Die ungewöhnliche Formulierung des zweiten Halbverses wurde bewusst nicht geglättet, weil der hebräische Hauptzeuge und die griechische Parallele deutlich voneinander abweichen.
