translation:
  language: de
  text: wegen des Gesetzes des Höchsten und der Satzung[b] und wegen eines, der einen Frevler für gerecht erklärt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich steht im Hebräischen etwa: »über einen, der einen Frevler gerecht spricht«; die Konstruktion ist knapp und auffällig. Auch: »wegen eines, der einen Frevler rechtfertigt« oder »gerecht spricht«. Die griechische Parallele liest dagegen: »wegen eines Urteils, einen Gottlosen für gerecht zu erklären«. Die hebräische Wendung mit להצדיק und die griechische mit δικαιῶσαι sind forensisch, also auf ein Gerichtsurteil bezogen.'
    reason: lexical_alternative
  - marker: b
    text: 'Der hebräische Text hat hier »Satzung«; die griechische Parallele hat dagegen »Bund« und liest insgesamt: »wegen des Gesetzes des Höchsten und des Bundes und wegen eines Urteils, einen Gottlosen für gerecht zu erklären«.'
    reason: alternative_reading
lexical_decisions:
- source_word: תורת עליון
  choice: das Gesetz des Höchsten
  rationale: תורה kann »Weisung« oder »Gesetz« bedeuten; zusammen mit חוק und im rechtlichen Zusammenhang gibt »Gesetz« den Sinn am klarsten wieder.
- source_word: חוק
  choice: die Satzung
  rationale: חוק bezeichnet eine festgesetzte Vorschrift. »Satzung« bewahrt die Rechtssprache und unterscheidet den Ausdruck von תורה.
- source_word: מצדיק להצדיק רשע
  choice: ein Urteil, das einen Frevler für gerecht erklärt
  rationale: Der Ausdruck ist knapp und textlich auffällig. Die griechische Parallele nennt ausdrücklich ein Urteil und bestätigt für צדק den forensischen Sinn. »Für gerecht erklären« macht diesen Gerichtssinn deutlich, ohne ihn mit späterer dogmatischer Fachsprache aufzuladen.
- source_word: רשע
  choice: einen Frevler
  rationale: רשע bezeichnet hier einen schuldigen beziehungsweise gottlosen Menschen. »Frevler« ist im Weisheits- und Gerichtskontext prägnant und lässt den generischen Singular erkennen.
- source_word: ועל
  choice: und wegen
  rationale: Die wiederholte Präposition setzt die Aufzählung dessen fort, wofür man sich nach dem vorausgehenden Zusammenhang nicht schämen soll.
theological_decisions:
- issue: Forensische Wiedergabe von צדק beziehungsweise δικαιόω
  choice: für gerecht erklärt
  alternative: rechtfertigt; freispricht
  rationale: »Für gerecht erklären« erhält den gerichtlichen Charakter und die anstößige Spannung eines Urteils zugunsten des Frevlers. »Rechtfertigen« wäre formal möglich, könnte aber unnötig an spätere dogmatische Debatten erinnern.
- issue: Deutung des knappen hebräischen מצדיק
  choice: als Urteil, das gerecht spricht
  alternative: 'als handelnde Person: »jemand, der den Frevler für gerecht erklärt«'
  rationale: Der erhaltene hebräische Wortlaut kann auf einen Handelnden bezogen werden, ist hier jedoch knapp beziehungsweise auffällig. Die griechische Parallele bietet κρίματος und stützt ausdrücklich die Deutung als Gerichtsurteil; die Unsicherheit wird in der Fußnote offengelegt.
translation_notes:
  register: Moderne, würdige Standardsprache mit rechtlichem Ton. Der Versausschnitt setzt syntaktisch den vorausgehenden Satz fort; deshalb beginnt die Übersetzung kleingeschrieben mit »wegen«. Die auffällige hebräische Formulierung wird im Haupttext mithilfe der griechischen Parallele verständlich wiedergegeben und in den Fußnoten transparent gehalten.
