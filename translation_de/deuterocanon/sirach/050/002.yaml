    reason: alternative_reading
lexical_decisions:
- source_word: בְּדוֹרוֹ
  choice: Zu seiner Zeit
  rationale: Wörtlich heißt die Wendung »in seiner Generation«. Im Zusammenhang bezeichnet sie idiomatisch die Zeit seines Wirkens; »zu seiner Zeit« ist im modernen Deutschen natürlich und prägnant.
- source_word: נִכְרָה
  choice: wurde … ausgehoben
  rationale: Die Niphalform von כרה hat hier passiven Sinn und bezeichnet das Graben oder Ausheben einer größeren Wasseranlage.
- source_word: מִקְוֶה
  choice: Wasserbecken
  rationale: Das Wort bezeichnet eine Ansammlung von Wasser und hier wahrscheinlich eine angelegte Speicheranlage. »Wasserbecken« bleibt gegenüber den engeren Möglichkeiten »Zisterne« und »Reservoir« angemessen offen.
- source_word: שִׂיחַ
  choice: Wasserkanal
  rationale: Das schwierige hebräische Wort dürfte im Parallelismus eine Wasserführung oder einen Wasserlauf bezeichnen. »Wasserkanal« macht den infrastrukturellen Zusammenhang verständlich, ohne eine noch speziellere Bauform festzulegen.
- source_word: כַּיָּם
  choice: dem Meer gleich
  rationale: Die ausdrückliche Vergleichsform des Hebräischen wird bewahrt; sie hebt die außergewöhnliche Größe oder Wassermenge hervor.
- source_word: בַּהֲמוֹנוֹ
  choice: in seiner Fülle
  rationale: הָמוֹן kann Menge, Fülle oder auch Getöse bezeichnen. Im Zusammenhang der Wasseranlage gibt »Fülle« die große Wassermenge wieder und lässt zugleich die bildhafte Aussage stehen.
theological_decisions:
- issue: Verhältnis des erhaltenen hebräischen Textes zur stark abweichenden griechischen Überlieferung
  choice: Der Haupttext folgt dem erhaltenen Hebräisch und beschreibt ein Wasserbecken sowie einen Wasserkanal.
  alternative: 'Dem Griechischen folgen: »Durch ihn wurde die Höhe des Doppelbaus gegründet, die hohe Stützmauer der Tempelumfriedung.«'
  rationale: Da für diesen Vers ein hebräischer Zeuge erhalten ist, bildet er die Grundlage der Übersetzung. Die griechische Fassung bezeugt jedoch eine erhebliche Textabweichung und wird deshalb vollständig in einer Fußnote genannt, statt stillschweigend angeglichen zu werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der knappe Satzbau und der Meeresvergleich bewahren die poetische Wirkung; ungesicherte technische Einzelheiten werden nicht überpräzisiert.
