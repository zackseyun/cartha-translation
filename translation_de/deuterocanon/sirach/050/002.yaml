translation:
  language: de
  text: Zu seiner Zeit wurde ein Wasserbecken ausgehoben und ein Wasserkanal[a] angelegt, der dem Meer in seiner Fülle glich.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Bedeutung des hier mit »Wasserkanal« wiedergegebenen hebräischen Wortes ist unsicher; möglich sind allgemeiner auch »Kanal« oder »Wasserlauf«.
    reason: lexical_alternative
  - marker: b
