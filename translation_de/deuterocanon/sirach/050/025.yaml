  text: With two nations my soul is disgusted[a], and the third is not a people.
translation:
  language: de
  text: Vor zwei Völkern empfindet meine Seele Abscheu, und das dritte ist kein Volk.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Paralleltext lautet: „und das dritte ist keine Nation“. Im Hebräischen steht hier „Volk“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּשְׁנֵי גוֹיִם
  choice: Vor zwei Völkern
  rationale: Die Präposition ב bezeichnet hier beim Verb des Widerwillens die Gruppen, gegen die sich die Abscheu richtet. „Vor“ ist im Deutschen in der Verbindung „Abscheu empfinden vor“ natürlich und bewahrt den Bezug auf zwei Völker.
- source_word: קָצָה נַפְשִׁי
  choice: empfindet meine Seele Abscheu
  rationale: Die Formulierung bewahrt das ausdrücklich genannte נַפְשִׁי („meine Seele“) und gibt die starke Abneigung von קָצָה idiomatisch und würdevoll wieder. Sie vermeidet eine unnötige Auflösung zu „ich verabscheue“.
- source_word: וְהַשְּׁלִישִׁית
  choice: und das dritte
  rationale: Der hebräische feminine Ordinal verweist auf eine im Kontext ergänzte Gruppe. Im Deutschen richtet sich das Genus natürlich nach „Volk“, daher „das dritte“.
- source_word: אִינֶנּוּ עָם
  choice: ist kein Volk
  rationale: עָם bedeutet hier kollektiv „Volk“. „Ist kein Volk“ gibt die rhetorische Aberkennung des Volksstatus knapp und direkt wieder; der griechische Paralleltext hat dagegen „Nation“.
theological_decisions:
- issue: Soll die anthropologische Wendung „meine Seele“ zu einer einfachen Ich-Aussage geglättet werden?
  choice: „meine Seele“ im Haupttext beibehalten
  alternative: „ich empfinde Abscheu“ oder „ich verabscheue“
  rationale: נַפְשִׁי steht ausdrücklich im hebräischen Text und wird auch durch den griechischen Paralleltext gestützt. Die Beibehaltung wahrt die poetische Ausdrucksweise, ohne daraus eine besondere anthropologische Lehre abzuleiten.
- issue: Soll im letzten Satzglied dem hebräischen „Volk“ oder dem griechischen „Nation“ gefolgt werden?
  choice: Dem hebräischen עָם entsprechend „Volk“
  alternative: 'Nach dem griechischen ἔθνος: „Nation“'
  rationale: Der erhaltene hebräische Text ist hier der primäre und als sicher bewertete Zeuge. Die abweichende griechische Wortwahl wird transparent in der Fußnote dokumentiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst bewahrter poetischer Wendung „meine Seele“. „Abscheu empfinden“ vermittelt die starke emotionale Kraft des Hebräischen natürlicher als eine starre wörtliche Konstruktion.
