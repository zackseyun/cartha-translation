base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/050/005.yaml
  text: How splendid he was when he looked out from the tent[b][a], when he came out from the house of the curtain.
translation:
  language: de
  text: Wie prächtig war er, als er aus dem Zelt hervorschaute,[a] als er aus dem Haus des Vorhangs trat.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Überlieferung lautet hier sinngemäß: „Wie herrlich war er in der Runde des Volkes“, statt des hebräischen „als er aus dem Zelt hervorschaute“. Das weist auf eine Abweichung im überlieferten Text hin.'
    reason: textual_variant
  - marker: b
    text: Der „Vorhang“ (hebräisch parochet; griechisch katapetasma) ist der trennende Vorhang vor dem inneren Heiligtum; auch „Schleier“ ist möglich.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה נֶהְדַּר
  choice: Wie prächtig war er
  rationale: Die Ausrufekonstruktion mit מַה drückt bewundernd seine eindrucksvolle Erscheinung aus. „Prächtig“ bewahrt sowohl den visuellen als auch den ehrenden Klang.
- source_word: בְּהַשְׁגִּיחוֹ
  choice: als er … hervorschaute
  rationale: Die Form bezeichnet am natürlichsten ein Herausschauen beziehungsweise Sichtbarwerden. „Hervorschaute“ bleibt nahe am Hebräischen und steht parallel zu seinem Heraustreten im zweiten Satzglied.
- source_word: מֵאֹהֶל
  choice: aus dem Zelt
  rationale: אֹהֶל bedeutet wörtlich „Zelt“. Diese Wiedergabe erhält die überlieferte Heiligtumssprache, ohne sie vereinheitlichend als „Tempel“ oder „Stiftshütte“ zu deuten.
- source_word: וּבְצֵאתוֹ
  choice: als er … trat
  rationale: Im Zusammenhang bezeichnet die Infinitivkonstruktion den Zeitpunkt seines Herausgehens. Die Formulierung ist gegenwärtiges, natürliches Deutsch.
- source_word: מִבֵּית הַפָּרֹכֶת
  choice: aus dem Haus des Vorhangs
  rationale: Die formal nahe Wiedergabe bewahrt die ungewöhnliche Verbindung von בֵּית und פָּרֹכֶת, statt durch „hinter dem Vorhang“ eine räumliche Auslegung in den Haupttext einzutragen.
theological_decisions:
- issue: 'Gemischte Heiligtumsbilder: „Zelt“ und „Haus des Vorhangs“'
  choice: Die beiden unterschiedlichen Bilder werden beibehalten.
  alternative: Die Begriffe könnten vereinheitlichend als „Heiligtum“ oder „Tempel“ wiedergegeben werden.
  rationale: Der hebräische Text verbindet ererbte Zeltheiligtumssprache mit der Sprache des Tempelhauses. Eine Harmonisierung würde diese literarisch und theologisch bedeutsame Spannung einebnen.
- issue: Abweichender griechischer Text im ersten Satzglied
  choice: Der gut bezeugte hebräische Wortlaut bildet den Haupttext; die griechische Abweichung wird in einer Fußnote dokumentiert.
  alternative: 'Dem Griechischen folgend: „Wie herrlich war er beim Umzug des Volkes“.'
  rationale: Die griechische Parallele bezeugt offenbar eine Textabweichung, beseitigt aber nicht den Sinn des vorliegenden hebräischen Zeugen. Die Unsicherheit wird offengelegt, nicht stillschweigend entschieden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Ausruf und der parallele Satzbau bleiben erhalten. „Haus des Vorhangs“ ist bewusst etwas ungewohnt, da es die ebenso ungewöhnliche hebräische Fügung transparent wiedergibt.
