  naturalness: „Das ganze Volk eilte gemeinsam“ ist modernes, flüssiges Standarddeutsch. „Fiel mit dem Gesicht zur Erde nieder“ klingt bei einem Kollektiv im Singular weniger natürlich; die pluralische Formulierung mit „alle“ bildet den Ausgangstext zugleich unmittelbarer ab.
  terminology: „der Höchste“ und „der Heilige Israels“ sind präzise, etablierte Wiedergaben der Gottesbezeichnungen. „Sich niederwerfen“ gibt השתחוה als körperlich-kultische Huldigung klarer wieder als das schwächere „sich verneigen“ und bleibt angesichts des vorher genannten Niederfallens verständlich.
