base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/050/017.yaml
  text: All flesh together hurried, and they fell on their faces to the ground, to bow down before the Most High, before the Holy One of Israel.
translation:
  language: de
  text: Alle Menschen eilten gemeinsam und fielen mit dem Gesicht zur Erde nieder, um sich vor dem Höchsten niederzuwerfen, vor dem Heiligen Israels.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל בָּשָׂר
  choice: alles Volk
  rationale: Wörtlich bedeutet der hebräische Ausdruck „alles Fleisch“. Im kultischen Zusammenhang bezeichnet er hier die versammelten Menschen; die griechische Parallele bestätigt dies mit πᾶς ὁ λαός („das ganze Volk“). „Alles Volk“ bewahrt den umfassenden Sinn in verständlichem Deutsch.
- source_word: יַחְדָּו נִמְהָרוּ
  choice: eilte gemeinsam herbei
  rationale: נמהרו bezeichnet ein hastiges, drängendes Handeln; יחדו betont das gemeinsame Handeln. „Eilte gemeinsam herbei“ gibt Bewegung, Eile und Geschlossenheit natürlich wieder.
- source_word: וַיִּפְּלוּ עַל פְּנֵיהֶם אָרְצָה
  choice: und fiel mit dem Gesicht zur Erde nieder
  rationale: Die deutsche Kollektivkonstruktion mit „alles Volk“ verlangt den Singular. Die Wendung gibt die vollständige Niederwerfung wieder, ohne das idiomatisch weniger natürliche „auf ihre Gesichter“ zu verwenden.
- source_word: לְהִשְׁתַּחֲוֹת
  choice: um sich … zu verneigen
  rationale: Das Verb bezeichnet ehrfürchtiges Niederwerfen oder Anbeten. Da die vorausgehende Körperhaltung bereits ausdrücklich genannt ist, bezeichnet „sich verneigen“ hier natürlich den kultischen Huldigungsakt.
- source_word: עֶלְיוֹן
  choice: der Höchste
  rationale: Der traditionelle und präzise deutsche Gottesname entspricht der substantivisch gebrauchten Bezeichnung „Höchster“.
- source_word: קְדוֹשׁ יִשְׂרָאֵל
  choice: der Heilige Israels
  rationale: Die feststehende biblische Gottesbezeichnung wird formal und traditionsgerecht wiedergegeben.
theological_decisions:
- issue: Referent der Niederwerfung
  choice: „vor dem Höchsten, vor dem Heiligen Israels“ als zwei parallele Bezeichnungen desselben Gottes
  alternative: 'Nach der ausführlicheren griechischen Lesart: „vor ihrem Herrn, dem allmächtigen Gott, dem Höchsten“'
  rationale: Der erhaltene hebräische Text nennt ausdrücklich „den Höchsten“ und „den Heiligen Israels“. Die Übersetzung folgt diesem primären Ausgangstext und ergänzt die längere griechische Formulierung nicht.
- issue: Bedeutung von השתחוה im kultischen Kontext
  choice: „sich verneigen“
  alternative: „anbeten“ oder „sich niederwerfen“
  rationale: „Sich verneigen“ wahrt die körperliche und kultische Bedeutungsbreite, ohne eine rein innere Frömmigkeitshandlung zu unterstellen; das tatsächliche Niederfallen ist bereits im vorherigen Satzteil ausgedrückt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit flüssiger kollektivischer Syntax. Die bildhafte hebräische Wendung „alles Fleisch“ wird aufgrund des unmittelbaren kultischen Kontexts und der griechischen Bestätigung verständlich als „alles Volk“ wiedergegeben. Keine Fußnoten erforderlich.
