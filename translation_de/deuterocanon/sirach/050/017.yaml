revisions:
- from: Alles Volk eilte gemeinsam herbei und fiel mit dem Gesicht zur Erde nieder, um sich vor dem Höchsten zu verneigen, vor dem Heiligen Israels.
  to: Alle Menschen eilten gemeinsam und fielen mit dem Gesicht zur Erde nieder, um sich vor dem Höchsten niederzuwerfen, vor dem Heiligen Israels.
  rationale: Die Revision entfernt die unbelegte Richtungsangabe „herbei“, gibt die pluralischen Formen des Hebräischen direkt wieder und stärkt die körperlich-kultische Bedeutung von השתחוה. „Alle Menschen“ lässt die umfassende hebräische Formel „alles Fleisch“ erkennen, ohne die durch die griechische Parallele nahegelegte menschliche Referenz zu verlieren. Die parallelen Gottesbezeichnungen bleiben unverändert; keine Fußnote ist erforderlich.
