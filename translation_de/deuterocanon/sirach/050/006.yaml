  text: Like a shining star from among clouds[a], and like the full moon in the days of the feast.
translation:
  language: de
  text: Wie ein leuchtender Stern, der zwischen den Wolken hervortritt[a], und wie der volle Mond an den Festtagen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Paralleltext lautet: »Wie der Morgenstern mitten in einer Wolke.« Das Hebräische sagt allgemeiner: »wie ein leuchtender Stern, der zwischen den Wolken hervortritt«.'
    reason: alternative_reading
lexical_decisions:
- source_word: כְּכוֹכָב אוֹר
  choice: Wie ein leuchtender Stern
  rationale: כְּ markiert den Vergleich, כוֹכָב bedeutet »Stern«, und אוֹר beschreibt hier dessen Helligkeit. »Leuchtender Stern« gibt das hebräische Bild natürlich wieder, ohne die griechische Deutung als »Morgenstern« in den Haupttext zu übernehmen.
- source_word: מִבֵּין עָבִים
  choice: der zwischen Wolken hervortritt
  rationale: מִן mit בֵּין bezeichnet eine Bewegung aus einem Zwischenraum beziehungsweise aus einer Menge heraus. Die verbale Wiedergabe »hervortritt« macht dieses dynamische Bild im Deutschen verständlich; עָבִים heißt »Wolken«.
- source_word: וּכְיָרֵחַ מָלֵא
  choice: und wie der volle Mond
  rationale: Die Konjunktion und das vergleichende כְּ bewahren den parallelen Aufbau. יָרֵחַ מָלֵא wird idiomatisch und genau mit »der volle Mond« wiedergegeben.
- source_word: בִּימֵי מוֹעֵד
  choice: in den Festtagen
  rationale: מוֹעֵד kann eine festgesetzte Zeit oder ein Fest bezeichnen. Im kultischen und poetischen Zusammenhang liegt »Fest« nahe, ohne ein bestimmtes Fest festzulegen; die Mehrzahl »Festtage« entspricht בִּימֵי.
theological_decisions:
- issue: Hebräisches Helligkeitsbild oder die spezifischere griechische Lesart »Morgenstern«
  choice: Im Haupttext steht »leuchtender Stern« nach dem erhaltenen Hebräisch.
  alternative: »Wie der Morgenstern mitten in einer Wolke« nach dem griechischen Paralleltext.
  rationale: Der vorhandene, als zuverlässig eingestufte hebräische Text hat אוֹר, »Licht/leuchtend«, während das Griechische ἑωθινός, »morgendlich/Morgenstern«, bietet. Die hebräische Lesart erhält daher Vorrang; die griechische Überlieferung wird in der Fußnote transparent bewahrt.
translation_notes:
  register: Moderne, würdige poetische Standardsprache. Die beiden Vergleiche bleiben parallel. »Hervortritt« verdeutlicht die im hebräischen מִבֵּין angelegte Bewegung und vermeidet die im Deutschen schwerfällige Formulierung »aus der Mitte von Wolken«.
