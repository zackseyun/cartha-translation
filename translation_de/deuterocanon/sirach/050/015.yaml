translation:
  language: de
  text: Dann ließen die Söhne Aarons, die Priester, mit Trompeten aus getriebenem Metall einen Jubelruf erschallen.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Überlieferung bietet hier einen längeren, anderslautenden Text: Der Priester streckt seine Hand über die Opferschale aus, gießt vom „Blut der Traube“ an den Fuß des Altars und bringt so dem Höchsten, dem König des Alls, einen angenehmen Duft dar. Die hier zugrunde gelegte hebräische Überlieferung enthält dagegen nur die Zeile über den Trompetenruf.'
    reason: textual_variant
  - marker: b
    text: 'Oder: „ließen mit Trompeten aus getriebenem Metall einen Signalton erschallen“. Das hebräische Verb kann einen lauten Jubel- oder Signalruf bezeichnen; hier wird er mit Trompeten hervorgebracht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: Dann
  rationale: Gibt den zeitlich fortschreitenden Übergang zur nächsten liturgischen Handlung knapp und natürlich wieder.
- source_word: יָרִיעוּ
  choice: ließen … einen Jubelruf erschallen
  rationale: Bewahrt den Grundsinn eines lauten Rufes oder einer Akklamation und macht zugleich verständlich, dass dieser hier durch Trompeten hervorgebracht wird, ohne den Ausdruck auf einen rein technischen Signalton festzulegen.
- source_word: בְנֵי אֲהַרֹן
  choice: die Söhne Aarons
  rationale: Erhält die formelhafte Bezeichnung der priesterlichen Abstammung.
- source_word: הַכֹּהֲנִים
  choice: die Priester
  rationale: Gibt die appositionelle Erläuterung des Hebräischen ausdrücklich wieder.
- source_word: בַּחֲצֹצְרוֹת
  choice: mit … Trompeten
  rationale: Die Präposition bezeichnet hier das Mittel beziehungsweise Instrument; חֲצֹצְרוֹת sind die im Tempeldienst verwendeten Metalltrompeten.
- source_word: מִקְשֶׁה
  choice: aus einem Stück gehämmerten
  rationale: Der handwerkliche Fachausdruck bezeichnet getriebene beziehungsweise durch Hämmern geformte Metallarbeit. Die Wendung ist im Deutschen anschaulicher und idiomatischer als bloß „gehämmerte Trompeten“.
theological_decisions:
- issue: Verhältnis der erhaltenen hebräischen Zeile zur erheblich längeren griechischen Fassung
  choice: Die erhaltene hebräische Zeile bildet allein den Haupttext; die zusätzlichen griechischen Motive werden in einer Fußnote dokumentiert.
  alternative: Die griechischen Angaben über die Hand des Priesters, das Trankopfer, das Blut der Traube und den Wohlgeruch in den Haupttext aufnehmen.
  rationale: Wo ein hebräischer Text erhalten ist, hat er für die Übersetzung Vorrang. Die griechische Fassung bezeugt hier einen deutlich anderen beziehungsweise längeren Text und darf daher nicht unmarkiert in den Haupttext eingetragen werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit liturgischem Klang. Die Satzstellung hält die appositionelle Kennzeichnung „die Priester“ nahe am hebräischen Aufbau. „Aus einem Stück gehämmert“ verdeutlicht die Metallarbeit, ohne altertümlich zu wirken.
