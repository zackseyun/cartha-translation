  source_fidelity: Der Entwurf folgt zu Recht dem erhaltenen hebräischen Text statt der erheblich abweichenden griechischen Parallelfassung. Die Bitte betrifft Schimon, die Bestätigung/Aufrichtung des mit Pinhas verbundenen Bundes und dessen Dauer für ihn und seine Nachkommen. „genommen werden soll“ gibt jedoch לֹא יִכָּרֵת („nicht abgeschnitten werden / nicht enden“) weniger genau wieder.
  naturalness: „Sich an Schimon als treu erweisen“ ist zwar verständlich, legt mit „an“ aber eher eine Ausrichtung auf Schimon nahe als die hebräische Beziehung mit עִם. „Schimon treu bleiben“ ist modernes, würdiges Deutsch und bildet die Verbindung von חסד und יֵאָמֵן natürlich ab. „Nicht enden soll“ ist für den Bund idiomatisch.
  terminology: „Barmherzigkeit“, „Schimon“, „Pinhas“ und „Bund“ sind angemessen. Die Formulierung „Bund des Pinhas“ bewahrt die knappe hebräische Genitivverbindung und die sachliche Anspielung, ohne deren genaue Ausgestaltung dogmatisch festzulegen.
  issues:
