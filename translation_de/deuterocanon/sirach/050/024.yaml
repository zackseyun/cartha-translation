    issue: Die Präposition in „sich an Schimon als treu erweisen“ verschiebt die Beziehung.
    rationale: Hebräisch עִם bezeichnet primär ein Mit- bzw. Bei-sein. Die deutsche Wendung mit „an“ kann Barmherzigkeit stärker als auf Schimon gerichtete Handlung verstehen. „Schimon treu bleiben“ wahrt den Sinn von Beständigkeit und die personale Beziehung idiomatischer.
  - severity: medium
