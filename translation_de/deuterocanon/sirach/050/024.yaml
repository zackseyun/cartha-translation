  yaml_path: translation/deuterocanon/sirach/050/024.yaml
  text: May his mercy remain faithful with Shimon[a], and may he establish for him the covenant of Phinehas[b], which shall not be cut off from him or from his offspring as long as the days of heaven endure.
translation:
  language: de
  text: Möge seine Barmherzigkeit Schimon treu bleiben[a], und möge er ihm den Bund des Pinhas aufrichten[b], der für ihn und seine Nachkommen nicht enden soll, solange der Himmel besteht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Parallelfassung lautet: „Er vertraue uns seine Barmherzigkeit an, und in seinen Tagen erlöse er uns.“ Sie weicht erheblich vom erhaltenen hebräischen Text ab, der von Schimon und vom Bund des Pinhas spricht.'
    reason: alternative_reading
  - marker: b
    text: Der „Bund des Pinhas“ verweist auf den bleibenden priesterlichen Bund in Numeri 25,12–13.
    reason: cross_reference
lexical_decisions:
- source_word: יֵאָמֵן עִם שִׁמְעוֹן חַסְדּוֹ
  choice: Möge sich seine Barmherzigkeit an Schimon als treu erweisen
  rationale: Das Nifal von אמן bezeichnet Festigkeit oder bewährte Treue. Die Wendung „sich … als treu erweisen“ gibt diese Bedeutung in natürlichem Deutsch wieder; חסד wird angesichts des griechischen ἔλεος als „Barmherzigkeit“ wiedergegeben, ohne seine bundestreue Färbung auszuschließen.
- source_word: שִׁמְעוֹן
  choice: Schimon
  rationale: Die hebräische Namensform wird in einer für deutsche Leser transparenten Umschrift wiedergegeben.
- source_word: וְיָקֶם לוֹ
  choice: und möge er für ihn … aufrichten
  rationale: Das Hifil von קום bedeutet bei einem Bund „aufrichten“, „bestehen lassen“ oder „bestätigen“. „Aufrichten“ bewahrt die traditionelle Bundessprache und den Gebetscharakter.
- source_word: בְּרִית פִּינְחָס
  choice: den Bund des Pinhas
  rationale: Die knappe Genitivverbindung bewahrt den Hinweis auf den mit Pinhas verbundenen priesterlichen Bund aus Numeri 25.
- source_word: אֲשֶׁר לֹא יִכָּרֵת לוֹ וּלְזַרְעוֹ
  choice: der weder ihm noch seinen Nachkommen genommen werden soll
  rationale: Das wörtliche „abgeschnitten werden“ wäre im Deutschen hier missverständlich. „Genommen werden“ vermittelt idiomatisch, dass der Bund für ihn und seine Nachkommenschaft nicht enden soll.
- source_word: כִּימֵי שָׁמָיִם
  choice: solange der Himmel besteht
  rationale: Die hebräische Zeitformel „wie die Tage des Himmels“ bezeichnet unübersehbare Dauer. Die Wiedergabe wahrt das Himmelsbild und macht den zeitlichen Sinn verständlich.
theological_decisions:
- issue: Verhältnis des erhaltenen hebräischen Textes zur stark abweichenden griechischen Parallelfassung
  choice: Der Haupttext folgt dem erhaltenen Hebräisch und spricht von Schimon sowie vom Bund des Pinhas.
  alternative: 'Nach der griechischen Fassung: „Er vertraue uns seine Barmherzigkeit an, und in seinen Tagen erlöse er uns.“'
  rationale: Wo für Jesus Sirach ein belastbarer hebräischer Text erhalten ist, besitzt dieser Vorrang. Die griechische Fassung bezeugt hier offenbar eine andere Vorlage oder eine freie Wiedergabe und wird deshalb in einer Fußnote dokumentiert.
- issue: Bedeutung von חסד im Zusammenhang mit אמן
  choice: „Barmherzigkeit“, die sich als treu erweist
  alternative: „treue Liebe“ oder „Bundestreue“
  rationale: „Barmherzigkeit“ entspricht dem griechischen ἔλεος und bleibt für חסד möglich; durch „als treu erweisen“ bleibt zugleich der im Hebräischen ausdrücklich bezeichnete Gedanke der Beständigkeit erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Gebetsform wird mit „Möge“ bewahrt. „Schimon“ und „Pinhas“ folgen den hebräischen Namensformen; erklärungsbedürftige Text- und Sachfragen stehen in knappen Fußnoten.
