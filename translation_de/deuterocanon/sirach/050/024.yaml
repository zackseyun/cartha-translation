    rationale: Das Verb meint hier das Nichtabgeschnittenwerden bzw. Nichtenden des Bundes. „Nicht enden soll“ überträgt diese Aussage klarer als „genommen werden“, das im Deutschen eine Wegnahme durch einen nicht genannten Akteur nahelegt.
