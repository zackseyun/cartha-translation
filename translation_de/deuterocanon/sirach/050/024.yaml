revisions:
- from: Möge sich seine Barmherzigkeit an Schimon als treu erweisen[a], und möge er für ihn den Bund des Pinhas aufrichten[b], der weder ihm noch seinen Nachkommen genommen werden soll, solange der Himmel besteht.
  to: Möge seine Barmherzigkeit Schimon treu bleiben[a], und möge er ihm den Bund des Pinhas aufrichten[b], der für ihn und seine Nachkommen nicht enden soll, solange der Himmel besteht.
  rationale: Die Revision ersetzt die im Deutschen semantisch weniger passende Verbindung „an Schimon ... erweisen“ durch „Schimon treu bleiben“ und gibt die Dauerformel zum nicht abgeschnittenen Bund mit „nicht enden soll“ präziser und natürlicher wieder. Der hebräische Text bleibt maßgeblich; die abweichende griechische Lesart ist korrekt in der Fußnote dokumentiert.
