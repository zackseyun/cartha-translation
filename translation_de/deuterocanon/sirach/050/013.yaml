translation:
  language: de
  text: und die Feueropfer des HERRN waren in ihren Händen, vor der ganzen Versammlung Israels.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִשֵּׁי יְהֹוָה
  choice: und die Feueropfer des HERRN
  rationale: אִשֵּׁי bezeichnet Opfergaben, die auf dem Altar im Feuer dargebracht werden. „Feueropfer“ bewahrt die spezifische Bedeutung des gut bezeugten hebräischen Textes; die allgemeinere griechische Wiedergabe προσφορά rechtfertigt hier keine Abschwächung im Haupttext. Das Tetragramm wird nach deutscher Bibeltradition als „der HERR“ wiedergegeben.
- source_word: בְּיָדָם
  choice: waren in ihren Händen
  rationale: Die konkrete Formulierung erhält das sichtbare kultische Bild, dass die zuvor genannten Söhne Aarons die Opfergaben in den Händen hielten.
- source_word: נֶגֶד
  choice: vor
  rationale: „Vor“ gibt die räumliche und öffentliche Gegenwart gegenüber der versammelten Gemeinde knapp und würdig wieder.
- source_word: כָּל קְהַל יִשְׂרָאֵל
  choice: der ganzen Versammlung Israels
  rationale: קהל bezeichnet die versammelte Gemeinschaft; „Versammlung Israels“ passt zum öffentlichen gottesdienstlichen Kontext und folgt eng dem Hebräischen.
theological_decisions:
- issue: Spezifität des Opferbegriffs אִשֵּׁי
  choice: Feueropfer des HERRN
  alternative: Opfergaben des Herrn
  rationale: Der hebräische Hauptzeuge enthält den spezifischen kultischen Ausdruck אִשֵּׁי, während die griechische Parallele mit προσφορά allgemeiner formuliert. Da der hebräische Text hier vollständig und mit hoher Sicherheit bezeugt ist, bleibt seine spezifische Aussage im Haupttext erhalten, ohne die griechische Verallgemeinerung einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit enger Bindung an die hebräische Syntax. „Feueropfer“ ist ein verständlicher biblisch-kultischer Fachausdruck; die Formulierung bleibt als Satzteil bewusst an den vorhergehenden Verskontext angeschlossen.
