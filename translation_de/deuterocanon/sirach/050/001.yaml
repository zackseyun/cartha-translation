base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/050/001.yaml
  text: Simon son of Yohanan the priest was the glory of his brothers and the splendor of his people[a]; in his generation the house was repaired[b], and in his days the temple was strengthened.
translation:
  language: de
  text: Simon, der Sohn Johanans, der Priester, war groß unter seinen Brüdern und die Zierde seines Volkes.[a] In seiner Generation wurde das Haus wiederhergestellt,[b] und in seinen Tagen wurde der Tempel gefestigt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Parallele lautet: „Simon, der Sohn des Onias, der große Priester“; dies kann im Kontext auch „der Hohepriester“ wiedergeben. Der hebräische Text liest hier: „Simon, der Sohn Johanans, der Priester“.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „wurde für das Haus Sorge getragen“ beziehungsweise „wurde das Haus instand gesetzt“. Das hebräische Verb kann das Sichkümmern oder Wiederherstellen bezeichnen; die griechische Parallele weist auf Bauarbeiten am Haus hin.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גְּדוֹל אֶחָיו
  choice: war groß unter seinen Brüdern
  rationale: Die Wendung ist wörtlich knapp und mehrdeutig; „groß unter seinen Brüdern“ gibt den naheliegenden Rang- und Ehrenvergleich wieder, ohne „Ruhm“ aus dem folgenden Parallelglied vorwegzunehmen.
- source_word: וְתִפְאֶרֶת עַמּוֹ
  choice: und der Ruhm seines Volkes
  rationale: תִפְאֶרֶת bezeichnet Pracht, Zierde oder Ruhm. Im Personenlob ist „Ruhm seines Volkes“ natürlich und bewahrt den gehobenen Ton.
- source_word: שִׁמְעוֹן בֶּן יוֹחָנָן
  choice: Simon, der Sohn Johanans
  rationale: „Simon“ ist die im Deutschen geläufige Namensform; „Johanan“ folgt dem hebräischen Namen, wobei der Genitiv „Johanans“ idiomatisch deutsch ist.
- source_word: הַכֹּהֵן
  choice: der Priester
  rationale: Der hebräische Hauptzeuge nennt Simon schlicht „den Priester“. Der weitergehende griechische Titel wird in der Fußnote dokumentiert.
- source_word: נִפְקַד הַבָּיִת
  choice: wurde das Haus wiederhergestellt
  rationale: Das Nifal von פקד kann hier ein Sichkümmern beziehungsweise Instandsetzen bezeichnen. Der Baukontext und die griechische Parallele sprechen für Wiederherstellungsarbeiten, ohne deren genaue Art sicher festzulegen.
- source_word: הַבָּיִת
  choice: das Haus
  rationale: Die wörtliche Wiedergabe bewahrt den hebräischen Wechsel zwischen „Haus“ und „Tempel“; im Zusammenhang ist das Tempelhaus gemeint.
- source_word: חֻזַּק הֵיכָל
  choice: wurde der Tempel verstärkt
  rationale: חזק bedeutet hier „stark/fest gemacht werden“. „Verstärkt“ passt zum baulichen Zusammenhang und wahrt die passive Form des Hebräischen.
theological_decisions:
- issue: Amtsbezeichnung Simons
  choice: der Priester
  alternative: der große Priester / der Hohepriester
  rationale: Der erhaltene hebräische Text hat הַכֹּהֵן, während die griechische Parallele ἱερεὺς ὁ μέγας bietet. Der Haupttext folgt dem hebräischen Zeugnis; die historisch bedeutsame griechische Lesart bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht gehobenem Ton. Die poetische Parallelität des Eingangslobs sowie der hebräische Wechsel zwischen „Haus“ und „Tempel“ bleiben erhalten; Unsicherheiten werden nicht stillschweigend aufgelöst.
