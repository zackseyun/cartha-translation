translation:
  language: de
  text: Sie erhoben einen Jubelruf und ließen einen mächtigen Klang erschallen, damit er vor dem Höchsten als Gedächtnis diene.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „um vor dem Höchsten ein Gedächtnis zu schaffen“. Der hebräische Infinitiv und die griechische Parallele verwenden Gedächtnissprache in einem liturgischen Sinn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּרִיעוּ
  choice: sie erhoben einen Jubelruf
  rationale: Das Verb bezeichnet im öffentlichen, kultischen Zusammenhang einen lauten Ruf oder eine feierliche Akklamation. „Jubelruf“ gibt die zeremonielle Klangwirkung wieder, ohne wie die griechische Parallele ausdrücklich Trompeten einzuführen.
- source_word: וַיַּשְׁמִיעוּ
  choice: ließen … erschallen
  rationale: 'Der Hifil von שמע hat kausative Bedeutung: etwas hörbar machen. Die idiomatische deutsche Wendung bewahrt diese Bedeutung.'
- source_word: קוֹל אַדִּיר
  choice: einen mächtigen Klang
  rationale: קוֹל kann sowohl „Stimme“ als auch „Klang/Schall“ bedeuten. Im liturgischen Zusammenhang bleibt „Klang“ bewusst offen für einen vokalen oder instrumentalen Laut; „mächtig“ wahrt die Kraft von אַדִּיר.
- source_word: לְהַזְכִּיר
  choice: ein Gedenken zu bewirken
  rationale: Der Hifil-Infinitiv von זכר trägt hier eine kultische Erinnerungs- oder Gedächtnisfunktion. Die Formulierung erhält diese Funktion, ohne ein im Hebräischen nicht genanntes Objekt einzusetzen.
- source_word: לִפְנֵי עֶלְיוֹן
  choice: vor dem Höchsten
  rationale: עֶלְיוֹן ist ein Gottesprädikat; „der Höchste“ ist die geläufige und würdevolle deutsche Wiedergabe. „Vor“ entspricht לִפְנֵי und passt zum liturgischen Geschehen.
theological_decisions:
- issue: Kultische Bedeutung der Gedächtnissprache
  choice: um vor dem Höchsten ein Gedenken zu bewirken
  alternative: um als Gedächtnis vor dem Höchsten zu dienen
  rationale: Hebräischer Text und griechische Parallele weisen auf eine liturgische Gedächtnisfunktion. Die Übersetzung erhält diese Spannung, ohne festzulegen, wer oder was in Erinnerung gebracht wird oder welche spätere theologische Kategorie damit verbunden sein soll.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit leicht feierlichem Klang. Die Satzstruktur folgt dem hebräischen Parallelismus; die im Hebräischen offene Bezugsgröße des Gedenkens bleibt unbestimmt.
