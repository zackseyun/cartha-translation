base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/050/019.yaml
  text: And all the people of the land cried out in prayer before the Merciful One[b][a], until he finished ministering at the altar and his ordinances reached completion.
translation:
  language: de
  text: Und das ganze Volk des Landes rief im Gebet laut vor dem Barmherzigen, bis er seinen Dienst am Altar vollendet hatte und seine vorgeschriebenen Riten zum Abschluss gekommen waren.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Text lautet abweichend: „Und das Volk des Herrn, des Höchsten, betete vor dem Barmherzigen, bis die Zierde/Ordnung des Herrn vollendet war und sie seinen Gottesdienst beendet hatten.“ Der Haupttext folgt dem erhaltenen Hebräisch; beide Überlieferungen betonen den Abschluss des Gottesdienstes.'
    reason: textual_variant
  - marker: b
    text: Die hebräische Schlusswendung ist schwierig. Wörtlicher ließe sie sich etwa mit „und seine Ordnungen gelangten zu ihm“ wiedergeben; dem Zusammenhang nach sind wahrscheinlich die vorgeschriebenen Riten und deren Abschluss gemeint.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּרֹנּוּ
  choice: rief … laut
  rationale: רנן bezeichnet einen weithin hörbaren, oft freudigen oder flehentlichen Ruf. Zusammen mit בִּתְפִלָּה gibt „rief im Gebet laut“ die gemeinschaftliche, stimmlich vorgetragene Bitte wieder, ohne Gesang zwingend vorauszusetzen.
- source_word: כָּל עַם הָאָרֶץ
  choice: das ganze Volk des Landes
  rationale: Die Wiedergabe bewahrt die konkrete hebräische Wendung und bezeichnet hier die versammelte Bevölkerung des Landes, nicht unterschiedslos die gesamte Menschheit.
- source_word: בִּתְפִלָּה
  choice: im Gebet
  rationale: Dies ist eine natürliche und genaue Wiedergabe der präpositionalen Wendung im gemeinschaftlich-liturgischen Zusammenhang.
- source_word: לִפְנֵי רַחוּם
  choice: vor dem Barmherzigen
  rationale: רַחוּם steht ohne ausdrückliches Gottesnomen als göttlicher Hoheitstitel. „der Barmherzige“ wahrt diese Form und fügt kein im Hebräischen fehlendes Substantiv hinzu.
- source_word: עַד כַּלּוֹתוֹ לְשָׁרֵת מִזְבֵּחַ
  choice: bis er seinen Dienst am Altar vollendet hatte
  rationale: שרת hat im kultischen Kontext den Sinn von priesterlichem Dienen. Die deutsche Formulierung gibt sowohl die Tätigkeit als auch ihren Abschluss idiomatisch wieder.
- source_word: וּמִשְׁפָּטָיו הִגִּיעַ אֵלָיו
  choice: und seine vorgeschriebenen Riten zum Abschluss gekommen waren
  rationale: מִשְׁפָּט kann eine festgesetzte Ordnung oder vorgeschriebene Verrichtung bezeichnen. Die hebräische Klausel ist schwierig; im Opferkontext und im Licht der griechischen Parallele liegt der Abschluss der liturgischen Verrichtungen nahe, ohne dass die genaue Konstruktion sicher wäre.
theological_decisions:
- issue: Gottesbezeichnung רַחוּם
  choice: der Barmherzige
  alternative: der Erbarmende; der barmherzige Gott
  rationale: Der Quelltext gebraucht ein göttliches Epitheton und keinen Eigennamen. Die substantivierte deutsche Form bewahrt den theologischen Akzent auf Gottes Erbarmen, ohne „Gott“ ausdrücklich zu ergänzen.
- issue: Bezug und Sinn der schwierigen Schlussklausel
  choice: Abschluss der vorgeschriebenen Riten
  alternative: seine Ordnungen gelangten zu ihm; seine vorgeschriebenen Pflichten waren erfüllt
  rationale: Der liturgische Kontext und die griechische Parallelüberlieferung stützen einen Vollendungssinn. Da das Hebräische syntaktisch schwierig ist, wird diese Deutung nicht dogmatisch zugespitzt, sondern in einer Fußnote als unsicher gekennzeichnet.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit verständlicher liturgischer Sprache. Die Satzstruktur bleibt dem Hebräischen nahe, während „zum Abschluss gekommen“ die schwierige Schlussklausel lesbar macht. Die textliche und lexikalische Unsicherheit wird in den Fußnoten offengelegt.
