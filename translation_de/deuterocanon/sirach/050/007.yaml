  text: Like the sun shining on the palace of the king[a], and like a rainbow appearing in the cloud.
translation:
  language: de
  text: Wie die Sonne, die auf den Palast des Königs strahlt[a], und wie ein Regenbogen, der in der Wolke erscheint.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Parallele lautet: „der Tempel des Höchsten“ statt „der Palast des Königs“; anschließend hat sie „in Wolken der Herrlichkeit“. Der hebräische Text bewahrt hier offenbar eine abweichende Fassung.'
    reason: alternative_reading
lexical_decisions:
- source_word: כְּשֶׁמֶשׁ
  choice: Wie die Sonne
  rationale: Das Präfix כְּ kennzeichnet einen Vergleich. „Wie die Sonne“ eröffnet das poetische Bild natürlich und quellennah.
- source_word: מְשַׁקֶּרֶת
  choice: die … strahlt
  rationale: Die ungewöhnliche hebräische Form bezeichnet im Kontext offenbar ein Ausstrahlen von Licht; die griechische Parallele ἐκλάμπων („hervorstrahlend“) stützt diese Deutung.
- source_word: אֶל הֵיכַל הַמֶּלֶךְ
  choice: auf den Palast des Königs
  rationale: אֶל gibt die Richtung des Strahlens an. הֵיכָל kann „Palast“ oder „Tempel“ bedeuten; in Verbindung mit „des Königs“ ist „Palast“ die unmittelbarste Wiedergabe des erhaltenen hebräischen Wortlauts. Die abweichende kultische Lesart der griechischen Parallele wird in der Fußnote bewahrt.
- source_word: וּכְקֶשֶׁת
  choice: und wie ein Regenbogen
  rationale: קֶשֶׁת kann „Bogen“ oder „Regenbogen“ heißen. Das Erscheinen in der Wolke macht hier die meteorologische Bedeutung eindeutig.
- source_word: נִרְאֲתָה
  choice: der … erscheint
  rationale: Die Nifalform bedeutet „gesehen werden“ beziehungsweise „erscheinen“. Im Deutschen gibt „erscheint“ das poetische Bild idiomatisch wieder.
- source_word: בֶעָנָן
  choice: in der Wolke
  rationale: Der hebräische Text hat den Singular mit bestimmtem Artikel; dieser wird bewusst beibehalten, obwohl die griechische Parallele den Plural bietet.
theological_decisions:
- issue: Hebräisch „Palast des Königs“ gegenüber griechisch „Tempel des Höchsten“
  choice: Der hebräische Wortlaut wird im Haupttext mit „Palast des Königs“ wiedergegeben.
  alternative: „Tempel des Höchsten“ nach der griechischen Parallele; möglich wäre aufgrund der Bedeutungsbreite von הֵיכָל auch „Tempel des Königs“.
  rationale: Der erhaltene hebräische Text hat Vorrang und nennt ausdrücklich „den König“. Zugleich ist הֵיכָל lexikalisch mehrdeutig, und die griechische Überlieferung versteht die Stelle kultisch. Diese Spannung wird nicht aufgelöst, sondern durch eine Fußnote sichtbar gemacht.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit klaren poetischen Vergleichsbildern. Die Relativsätze ergeben im Deutschen einen flüssigen Vers, ohne die bildhafte Struktur des Hebräischen zu glätten.
