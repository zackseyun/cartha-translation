lexical_decisions:
- source_word: יִתֵּן לָכֶם
  choice: Er gebe euch
  rationale: Der hebräische Jussiv drückt hier einen Segenswunsch aus. Der deutsche Konjunktiv I gibt diesen feierlichen, aber verständlichen Wunschcharakter knapp wieder.
- source_word: חָכְמַת לֵבָב
  choice: Weisheit des Herzens
  rationale: Die erhaltene hebräische Lesart wird unmittelbar wiedergegeben. Der Ausdruck bezeichnet innere Einsicht und Urteilsfähigkeit, ohne das Herz auf bloßes Gefühl oder den Verstand auf reine Intellektualität zu verengen.
- source_word: וִיהִי
  choice: und es sei
  rationale: Auch diese Verbform hat im Segenszusammenhang jussivische Kraft. „Es sei“ bewahrt den Wunschcharakter und den Parallelismus.
- source_word: שָׁלוֹם
  choice: Frieden
  rationale: „Frieden“ ist die geläufige und zugleich weite Wiedergabe; sie kann sowohl einträchtige Beziehungen als auch umfassendes Wohlergehen einschließen.
- source_word: בֵּינֵיכֶם
  choice: unter euch
  rationale: Bei einer Mehrzahl von Angesprochenen gibt „unter euch“ den zwischenmenschlichen Bezug natürlich wieder.
theological_decisions:
- issue: Vorrangige Lesart bei der Abweichung zwischen hebräischer und griechischer Überlieferung
  choice: Im Haupttext steht nach dem erhaltenen Hebräisch „Weisheit des Herzens“.
  alternative: Die griechische Parallelüberlieferung bietet „Freude des Herzens“ und erweitert den Friedenswunsch um „in unseren Tagen in Israel wie in den Tagen der Vorzeit“.
  rationale: Da hier ein hochgradig zuverlässiger hebräischer Text erhalten ist, bestimmt er den Haupttext. Die bedeutsamen griechischen Abweichungen werden in Fußnoten dokumentiert und nicht harmonisierend in den Vers aufgenommen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit dem in Segenssprüchen natürlichen Konjunktiv I. Die leicht formelle Wendung „Weisheit des Herzens“ bewahrt das hebräische Bild; Satzbau und Wortwahl bleiben für heutige Leserinnen und Leser unmittelbar verständlich.
