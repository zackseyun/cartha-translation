  text: Er gebe euch Weisheit des Herzens[a], und es sei Frieden unter euch.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Parallelüberlieferung hat statt „Weisheit des Herzens“: „Freude des Herzens“.'
