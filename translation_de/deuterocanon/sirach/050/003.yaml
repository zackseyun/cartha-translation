lexical_decisions:
- source_word: אֲשֶׁר בְּיָמָיו
  choice: Zu seiner Zeit
  rationale: Gibt die zeitliche Einleitung knapp und in natürlichem modernem Deutsch wieder.
- source_word: נִבְנָה
  choice: wurde … errichtet
  rationale: Das passive Verb bezeichnet den Bau; eine Wiedererrichtung ist im Hebräischen nicht ausdrücklich markiert.
- source_word: קִיר
  choice: Mauer
  rationale: Entspricht der Grundbedeutung und vermeidet eine durch den stark abweichenden griechischen Text nahegelegte Umdeutung.
- source_word: פִּנּוֹת
  choice: mit den Eckbauten
  rationale: Das schwierige Wort bedeutet wörtlich „Ecken“. „Eckbauten“ lässt einen architektonischen Bezug erkennen, ohne sicher festzulegen, ob Türme, Mauerabschnitte oder eine anders gestaltete Befestigung gemeint sind.
- source_word: מָעוֹן
  choice: Wohnstätte
  rationale: Bewahrt die gewöhnliche Bedeutung „Wohnung/Wohnstätte“ und passt zugleich zum monumentalen architektonischen Vergleich.
- source_word: כְּהֵיכַל מֶלֶךְ
  choice: wie ein Königspalast
  rationale: Mit מֶלֶךְ bezeichnet הֵיכָל hier am ehesten einen königlichen Palast; die kompakte Formulierung klingt natürlich und würdevoll.
- source_word: ἐν ἡμέραις αὐτοῦ ἠλαττώθη ἀποδοχεῖον ὑδάτων, χαλκὸς ὡσεὶ θαλάσσης τὸ περίμετρον
  choice: nur als Kontrollzeuge berücksichtigt
  rationale: Der griechische Paralleltext weicht erheblich vom erhaltenen Hebräisch ab und dürfte auf einer anderen Vorlage oder einer beschädigten Überlieferung beruhen. Da hier ein hebräischer Text vorliegt, bestimmt dieser den Haupttext; die Abweichung wird in einer Fußnote dokumentiert.
