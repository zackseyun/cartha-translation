  text: the inhabitants of Seir and Philistia[a], and the foolish nation that dwells in Shechem.
translation:
  language: de
  text: die Bewohner von Seïr und dem Philisterland[a] und das törichte Volk, das in Sichem wohnt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Griechisch: »die Bewohner auf dem Berg von Samaria, die Philister« statt »die Bewohner von Seïr und dem Philisterland«.'
    reason: textual_variant
lexical_decisions:
- source_word: יוֹשְׁבֵי
  choice: die Bewohner von
  rationale: Das substantivisch gebrauchte Konstruktplural bezeichnet die in einem Gebiet ansässigen Menschen; »die Bewohner von« ist natürlich und wahrt den kollektiven Sinn.
- source_word: שֵׂעִיר
  choice: Seïr
  rationale: Der hebräische Text bietet den Ortsnamen ohne ausdrückliches Wort für »Berg«. Die Trema-Schreibung macht die getrennte Aussprache im Deutschen deutlich.
- source_word: וּפְלֶשֶׁת
  choice: und dem Philisterland
  rationale: פְלֶשֶׁת bezeichnet das Land beziehungsweise Gebiet, nicht unmittelbar das Volk. »Philisterland« ist im Deutschen verständlicher als das seltenere »Philistäa«; die Präposition »von« gilt sinngemäß für beide Ortsangaben.
- source_word: גּוֹי
  choice: Volk
  rationale: גוי bezeichnet hier eine ethnische Gemeinschaft. »Volk« ist in diesem Zusammenhang natürlicher als »Nation« und vermeidet einen unpassenden modernen staatsrechtlichen Beiklang.
- source_word: נָבָל
  choice: töricht
  rationale: Das Wort umfasst sittliche wie verstandesmäßige Torheit. »Töricht« bewahrt den wertenden, würdevollen Ton, ohne die Aussage auf geringe Intelligenz zu verengen.
- source_word: הַדָּר
  choice: das … wohnt
  rationale: Das attributive Partizip bezeichnet dauerhaftes Wohnen; ein deutscher Relativsatz gibt die Konstruktion natürlich wieder.
- source_word: בִּשְׁכֶם
  choice: in Sichem
  rationale: »Sichem« ist die etablierte deutsche Form des biblischen Ortsnamens שְׁכֶם.
theological_decisions:
- issue: Abweichung zwischen dem hebräischen und dem griechischen Text bei der ersten geografischen Bezeichnung
  choice: Im Haupttext steht nach dem erhaltenen Hebräisch »die Bewohner von Seïr und dem Philisterland«.
  alternative: »die Bewohner auf dem Berg von Samaria, die Philister«
  rationale: Der als zuverlässig eingestufte hebräische Text hat für Sirach Vorrang. Die deutlich abweichende griechische Lesart wird aus textkritischer Transparenz in einer Fußnote bewahrt, ohne beide Lesarten zu vermischen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Vers ist als Fortsetzung des vorangehenden Satzes kleingeschrieben. »Philisterland« ist allgemein verständlich und bildet den geografischen Charakter von פְלֶשֶׁת ab; »töricht« erhält den sapientialen und moralischen Klang.
