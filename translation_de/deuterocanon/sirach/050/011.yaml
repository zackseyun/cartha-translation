  source_fidelity: 'Der Haupttext folgt dem erhaltenen hebräischen Text zuverlässig: die Gewänderpaare, der Aufstieg zum „Altar der Herrlichkeit“ und das Schmücken des „Vorhofs des Heiligtums“ sind angemessen wiedergegeben. Die griechische Fußnote benötigt jedoch eine präzisere und idiomatischere Wiedergabe von περιβολή.'
