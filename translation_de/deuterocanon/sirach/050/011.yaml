base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/050/011.yaml
  text: When he put on garments of honor and clothed himself in garments of splendor[a], when he went up to the altar of glory, he adorned the court of the sanctuary.
translation:
  language: de
  text: 'Als er die Gewänder der Ehre anlegte

    und sich in Gewänder der Pracht kleidete,

    als er zum Altar der Herrlichkeit hinaufstieg,

    schmückte er den Vorhof des Heiligtums.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Griechisch: „als er zum heiligen Altar hinaufstieg, verherrlichte er die Einfriedung des Heiligtums.“ Das griechische Wort für „Einfriedung“ kann auch „Umfassung“ bedeuten. Der hebräische Text hat „Altar der Herrlichkeit“ und „Vorhof des Heiligtums“.'
    reason: alternative_reading
lexical_decisions:
- source_word: בַּעֲטוֹתוֹ
  choice: als er ... anlegte
  rationale: Gibt den temporalen Infinitiv und das Anlegen der priesterlichen Kleidung natürlich wieder; „sich hüllte“ wäre möglich, klingt hier jedoch weniger idiomatisch.
- source_word: בִּגְדֵי כָבוֹד
  choice: Gewänder der Ehre
  rationale: Bewahrt die hebräische Genitivverbindung und das Bedeutungsspektrum von כבוד zwischen Ehre und Herrlichkeit, ohne beide parallelen Ausdrücke einzuebnen.
- source_word: וְהִתְלַבְּשׁוֹ בִּגְדֵי תִפְאָרֶת
  choice: und sich in Gewänder der Pracht kleidete
  rationale: Gibt den reflexiven Sinn sowie תפארת als Schönheit, Glanz oder Pracht in würdiger, heutiger Sprache wieder.
- source_word: בַּעֲלוֹתוֹ
  choice: als er ... hinaufstieg
  rationale: Bewahrt die ausdrücklich aufwärts gerichtete Bewegung zum Altarbereich.
- source_word: מִזְבַּח הוֹד
  choice: Altar der Herrlichkeit
  rationale: Folgt formal der hebräischen Status-constructus-Verbindung; הוד kann Herrlichkeit, Hoheit oder Pracht bezeichnen.
- source_word: וַיֶּהְדַּר
  choice: schmückte
  rationale: Das Verb הדר bezeichnet hier ein prachtvolles Gestalten oder Zieren; „schmückte“ ist prägnant und natürlich.
- source_word: עֲזֶרֶת מִקְדָּשׁ
  choice: den Vorhof des Heiligtums
  rationale: עזרה bezeichnet den abgegrenzten Tempelhof; „Vorhof“ ist im deutschen Tempelwortschatz klar und bewahrt die konstruktive Verbindung mit „Heiligtum“.
theological_decisions:
- issue: Hebräischer Hauptzeuge gegenüber abweichender griechischer Parallelüberlieferung
  choice: 'Der Haupttext folgt dem erhaltenen Hebräisch: „Altar der Herrlichkeit“ und „Vorhof des Heiligtums“.'
  alternative: 'Nach dem Griechischen: „heiliger Altar“; der letzte Ausdruck kann dort als „Umkleidung/Einfassung des Heiligtums“ verstanden werden.'
  rationale: Der hebräische Text ist hier erhalten, hoch bewertet und in sich schlüssig. Die griechische Lesart wird deshalb nicht in den Haupttext eingesetzt, ihre echte textliche und semantische Abweichung aber in einer Fußnote offengelegt.
translation_notes:
  register: Moderne, würdige Standardsprache mit poetischem Parallelismus. Die Wiederholung „Gewänder“ und die beiden temporalen Satzglieder bleiben erhalten. Der Fußnotenmarker steht im Haupttext und verweist auf die Abweichungen des griechischen Paralleltexts.
