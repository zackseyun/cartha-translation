  text: Blessed is the man who meditates on these things[a], and he who takes them to heart will become wise.
translation:
  language: de
  text: Glücklich zu preisen ist der Mensch[a], der über diese Dinge nachsinnt; wer sie sich zu Herzen nimmt, wird weise.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Glücklich ist der Mensch“ oder „Wohl dem Menschen“.'
    reason: Die Seligpreisungsformel אַשְׁרֵי kann unterschiedlich wiedergegeben werden; die Alternativen zeigen sowohl eine schlichtere als auch eine traditionellere deutsche Form.
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: Glücklich zu preisen ist
  rationale: Die hebräische Seligpreisungsformel bezeichnet mehr als ein vorübergehendes Glücksgefühl. „Glücklich zu preisen“ bewahrt den gewichtigen Ton der Weisheitsliteratur und ist im modernen Deutsch verständlich.
- source_word: אִישׁ
  choice: der Mensch
  rationale: אִישׁ bezeichnet hier den einzelnen Menschen innerhalb einer allgemein formulierten Weisheitsregel. „Mensch“ gibt den repräsentativen Sinn natürlich wieder, ohne die grammatische Einzahl aufzulösen.
- source_word: בְּאֵלֶּה יֶהְגֶּה
  choice: der über diese Dinge nachsinnt
  rationale: הגה bezeichnet hier anhaltendes, bedachtes Erwägen. Die Präposition ב mit dem Demonstrativ verweist auf die zuvor dargelegten Inhalte; „über diese Dinge nachsinnt“ ist dafür idiomatisches Deutsch.
- source_word: וְנוֹתֵן עַל לִבּוֹ
  choice: wer sie sich zu Herzen nimmt
  rationale: Die Wendung beschreibt das bewusste Aufnehmen und ernsthafte Bedenken. Das Pronomen „sie“ greift „diese Dinge“ auf; diese Beziehung wird auch durch das griechische αὐτά bestätigt.
- source_word: יֶחְכָּם
  choice: wird weise
  rationale: Das Verb bezeichnet das Erlangen von Weisheit. „Wird weise“ bildet den hebräischen Ergebnissinn knapp und direkt ab, ohne die mögliche passive Nuance des griechischen σοφισθήσεται in den Haupttext einzutragen.
theological_decisions:
- issue: Generische Bedeutung von אִישׁ in der Weisheitsseligpreisung
  choice: der Mensch
  alternative: der Mann
  rationale: Obwohl אִישׁ grammatisch maskulin und auch mit „Mann“ übersetzbar ist, formuliert der Vers eine allgemeine Weisheitsregel. „Der Mensch“ wahrt Einzahl und Personenbezug, ohne den Geltungsbereich unnötig auf Männer zu beschränken.
- issue: Verhältnis des hebräischen Textes zur griechischen Parallelüberlieferung
  choice: Der hebräische Text bleibt primär; das griechische αὐτά bestätigt den Rückbezug von „sie“ auf „diese Dinge“.
  alternative: 'Die zweite Hälfte ohne ausdrückliches Objekt wiedergeben: „und es auf sein Herz legt, wird weise“.'
  rationale: Der hebräische Ausdruck lässt das Objekt idiomatisch unausgesprochen. Die griechische Parallelfassung macht den sachlich bereits naheliegenden pluralischen Rückbezug ausdrücklich und stützt so eine klare deutsche Wiedergabe, ohne neuen Inhalt hinzuzufügen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Hauptfassung verwendet eine klare Seligpreisungsformel und bewahrt durch den Semikolonbau die enge, aber eigenständige Parallelität der beiden Aussagen.
