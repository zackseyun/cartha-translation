translation:
  language: de
  text: Und sie warfen sich ein zweites Mal nieder[a], um den Segen von ihm zu empfangen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich steht im Hebräischen „zu fallen“; gemeint ist hier die Niederwerfung im Gottesdienst.
    reason: lexical_alternative
  - marker: b
    text: 'Griechisch: „um den Segen vom Höchsten zu erweisen“. Diese Überlieferung nennt den Höchsten ausdrücklich als Ursprung des Segens.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁנוּ ... שֵׁנִית
  choice: sie ... ein zweites Mal
  rationale: Die Verbindung aus dem Verb für Wiederholung und dem ausdrücklichen Adverb „ein zweites Mal“ betont die erneute Handlung. Im Deutschen gibt „ein zweites Mal“ dies natürlich wieder, ohne die im Hebräischen mögliche Redundanz ungeschickt nachzuahmen.
- source_word: לִנְפּוֹל
  choice: warfen sich ... nieder
  rationale: נפל bedeutet wörtlich „fallen“. Im kultischen Zusammenhang bezeichnet es die Niederwerfung; „sich niederwerfen“ bewahrt das körperliche Bild und macht die gottesdienstliche Handlung verständlich.
- source_word: בְּרָכוֹת
  choice: den Segen
  rationale: Das hebräische Wort steht formal im Plural, doch „Segen“ ist im Deutschen in diesem liturgischen Zusammenhang die natürliche Kollektivbezeichnung. Auch die griechische Parallelüberlieferung hat den Singular.
- source_word: לָקַחַת
  choice: zu empfangen
  rationale: Das Verb kann wörtlich „nehmen“ heißen; beim priesterlichen Segen entspricht „empfangen“ dem gemeinten Vorgang und ist idiomatisches Deutsch.
- source_word: מִפָּנָיו
  choice: vor ihm
  rationale: Die Wendung bedeutet wörtlich „von/vor seinem Angesicht“. „Vor ihm“ erhält die räumlich-personale Perspektive und lässt den Bezug des Pronomens entsprechend dem Hebräischen unausgedeutet.
theological_decisions:
- issue: Bezug von מִפָּנָיו gegenüber der ausdrücklichen Nennung des Höchsten im Griechischen
  choice: vor ihm
  alternative: vom Höchsten
  rationale: Der erhaltene hebräische Text bietet ein Pronomen der dritten Person Singular und nennt Gott hier nicht ausdrücklich. Die Hauptübersetzung folgt diesem Zeugnis und bewahrt den offenen Bezug; die griechische Deutung wird in einer Fußnote dokumentiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Sich niederwerfen“ ist anschaulich und kultisch passend, ohne unnötig altertümlich zu wirken. Der hebräische pronominale Ausdruck bleibt im Haupttext bewusst offen; die abweichende griechische Auslegung steht in der Fußnote.
