translation:
  language: de
  text: wie eine Blüte des Libanon in den Sommertagen und wie ein Feuer aus Weihrauch auf dem Speiseopfer.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Parallelüberlieferung hat für diesen Vergleich stattdessen: „wie Schösslinge des Libanon in den Sommertagen“; das Bild vom Feuer aus Weihrauch auf dem Speiseopfer fehlt dort. Der Haupttext folgt der hebräischen Überlieferung.'
    reason: alternative_reading
lexical_decisions:
- source_word: כְּפֶרַח לְבָנוֹן
  choice: wie eine Blüte des Libanon
  rationale: Das Präfix כְּ kennzeichnet den Vergleich; פֶּרַח bezeichnet eine Blüte oder Blume. Der Genitiv bewahrt die knappe poetische Verbindung mit dem Libanon.
- source_word: בִּימֵי קָיִץ
  choice: in den Sommertagen
  rationale: Die Wendung gibt בִּימֵי („in den Tagen“) und קָיִץ („Sommer“) genau und zugleich in natürlichem poetischem Deutsch wieder.
- source_word: וּכְאֵשׁ לְבוֹנָה
  choice: und wie Weihrauchfeuer
  rationale: לְבוֹנָה bezeichnet spezifisch Weihrauch. Das deutsche Kompositum gibt die hebräische Verbindung „Feuer von Weihrauch“ knapp und bildhaft wieder, ohne sie zu bloßem „Räucherwerk“ zu verallgemeinern.
- source_word: עַל הַמִּנְחָה
  choice: auf dem Speiseopfer
  rationale: Im kultischen Zusammenhang bezeichnet מִנְחָה das aus Getreide bestehende Speiseopfer. „Auf“ entspricht עַל und erhält das konkrete Tempelbild.
theological_decisions:
- issue: Kultische Bedeutung von מִנְחָה
  choice: Speiseopfer
  alternative: Opfergabe
  rationale: Die spezifische Opferterminologie passt zum Tempelkontext und bewahrt die kultische Aussage, ohne sie konfessionell auszudeuten.
- issue: Abweichung zwischen hebräischer und griechischer Überlieferung
  choice: Der hebräische Text steht im Haupttext; die griechische Parallelüberlieferung wird in einer Fußnote dokumentiert.
  alternative: Den griechischen Wortlaut in den Haupttext übernehmen.
  rationale: Der bereitgestellte hebräische Text ist die vorrangige Ausgangsbasis. Die erhebliche Abweichung der griechischen Fassung wird transparent gemacht, nicht harmonisiert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper poetischer Parallelstruktur. „Sommertage“ vermeidet eine unnötig schwerfällige Wiedergabe, während „Weihrauchfeuer“ und „Speiseopfer“ die konkrete kultische Bildsprache erhalten.
