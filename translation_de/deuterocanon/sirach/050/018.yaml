  text: And the song gave forth its voice[a], and over the multitude they set his lamp in order.
translation:
  language: de
  text: Da erhob das Lied seine Stimme, und über der Menge stellten sie seine Lampe zurecht.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Paralleltext lautet: »Und die Psalmsänger priesen mit ihren Stimmen; im übervollen Haus erklang die Melodie lieblich.« Das deutet darauf hin, dass besonders die zweite Hälfte des hebräischen Verses textlich schwierig oder anders überliefert ist.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּתֵּן הַשִּׁיר קוֹלוֹ
  choice: Da ließ das Lied seine Stimme erschallen
  rationale: Die Verbindung נתן mit קול bezeichnet das Hervorbringen oder Erheben einer Stimme. Die Wiedergabe ist im Deutschen natürlich, bewahrt aber die Personifikation und das wörtliche »seine Stimme« des Hebräischen.
- source_word: הַשִּׁיר
  choice: das Lied
  rationale: Das Substantiv bezeichnet ein Lied oder den Gesang. »Das Lied« folgt der konkreten Form des hebräischen Textes und passt zum musikalisch-liturgischen Zusammenhang.
- source_word: וְעַל הֲמּוֹן
  choice: und über der Menge
  rationale: על hat hier wahrscheinlich räumlichen Sinn, dessen genaue Beziehung im schwierigen zweiten Halbvers jedoch unsicher bleibt. »Über der Menge« bewahrt das Bild, ohne es näher auszudeuten.
- source_word: הֶעֱרִיכוּ
  choice: stellten sie … auf
  rationale: ערך im Hifil bedeutet anordnen, herrichten oder aufstellen. Bei einer Leuchte ist »aufstellen« verständliches heutiges Deutsch und wahrt den Gedanken einer geordneten, absichtlichen Handlung.
- source_word: נֵרוֹ
  choice: seine Leuchte
  rationale: נר bezeichnet eine Lampe oder Leuchte; das maskuline Singularsuffix wird als »seine« wiedergegeben. Sein Bezug bleibt im hebräischen Text unbestimmt und wird daher nicht erklärend festgelegt.
theological_decisions:
- issue: Vorrang des erhaltenen hebräischen Textes trotz des schwierigen zweiten Halbverses
  choice: Der Haupttext folgt unmittelbar dem erhaltenen Hebräisch; die deutlich abweichende griechische Überlieferung steht in einer Fußnote.
  alternative: 'Den Vers nach dem Griechischen wiedergeben: »Und die Psalmsänger priesen mit ihren Stimmen; im übervollen Haus erklang die Melodie lieblich.«'
  rationale: Da für diesen Vers ein hebräischer Text vorliegt, bildet er die Grundlage. Die schwer verständliche zweite Zeile und die erhebliche Abweichung des griechischen Paralleltextes werden jedoch transparent dokumentiert, statt die Spannung stillschweigend aufzulösen.
- issue: Unklarer Bezug des Suffixes in נֵרוֹ
  choice: »seine Leuchte« ohne Bestimmung des Bezugs
  alternative: »die Leuchte des Hohenpriesters« oder »die Leuchte des Liedes«
  rationale: Das hebräische Suffix ist maskulin und singular, doch sein Bezugswort ist im Zusammenhang nicht sicher. Eine ausdrückliche Identifikation würde mehr festlegen, als der Text erkennen lässt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die erste Zeile gibt die hebräische Personifikation idiomatisch wieder; die ungewöhnliche Bildsprache der zweiten Zeile bleibt bewusst erhalten und wird nicht harmonisiert.
