  yaml_path: translation/deuterocanon/sirach/050/029.yaml
  text: For if one does these things[a], he will prevail in everything, for the light of the Lord is his path.
translation:
  language: de
  text: Denn wenn er dies tut, wird er allem gewachsen sein; denn das Licht des Herrn ist sein Weg[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „seine Spur“ oder „seine Fußspur“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν γὰρ αὐτὰ ποιήσῃ
  choice: Denn wenn er dies tut
  rationale: Die allgemeine Bedingung und ihre begründende Verbindung zum vorangehenden Zusammenhang werden knapp und natürlich wiedergegeben. „Dies“ verweist auf die zuvor genannten Weisungen, ohne sie näher festzulegen.
- source_word: πρὸς πάντα ἰσχύσει
  choice: wird er allem gewachsen sein
  rationale: Die Wendung wahrt sowohl die Bedeutung von Stärke beziehungsweise Befähigung als auch den umfassenden Bezug von πρὸς πάντα. Sie ist im Deutschen natürlicher als das wörtliche „gegen alles stark sein“ und behauptet nicht ausdrücklich äußeren Erfolg.
- source_word: φῶς Κυρίου
  choice: das Licht des Herrn
  rationale: Die Lichtmetapher und der übliche Gottes­titel bleiben unmittelbar erhalten.
- source_word: τὸ ἴχνος αὐτοῦ
  choice: sein Weg
  rationale: „Weg“ vermittelt im Deutschen verständlich den bildlichen Lebens- oder Handlungsgang. Da ἴχνος konkreter „Spur“ oder „Fußspur“ bedeutet, wird diese Bildschärfe in einer Fußnote bewahrt.
theological_decisions:
- issue: Deutung von τὸ ἴχνος αὐτοῦ
  choice: Das Licht des Herrn wird mit dem Weg des Handelnden verbunden.
  alternative: Wörtlicher kann das Licht des Herrn als seine Spur oder Fußspur bezeichnet werden; dies könnte stärker eine erkennbare Spur als Führung auf einem Weg betonen.
  rationale: Der knappe griechische Nominalsatz erklärt die Beziehung zwischen Licht und Spur nicht ausdrücklich. Die Übersetzung wahrt deshalb die Metapher, ohne eine bestimmte Lehre über göttliche Führung oder menschlichen Erfolg hinzuzufügen.
- issue: Aussage von πρὸς πάντα ἰσχύσει
  choice: „wird er allem gewachsen sein“ bezeichnet umfassende Stärke oder Befähigung.
  alternative: „wird gegen alles stark sein“ oder „wird in allem Erfolg haben“.
  rationale: Die erste Alternative ist formnäher, aber im Deutschen schwerfällig; die zweite legt Erfolg stärker fest, als ἰσχύω verlangt. Die gewählte Fassung erhält die Spannung zwischen Stärke, Wirksamkeit und Bewährung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Semikolon-Satz bewahrt die enge Begründungsfolge des griechischen Textes; die leicht ungewöhnliche Licht-Weg-Metapher wird nicht erklärend aufgelöst.
