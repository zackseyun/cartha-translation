base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/050/020.yaml
  text: Then he came down and lifted up his hands over all the assembly of Israel[a], to give the blessing of Yahweh with his lips[b], and to glory in the name of Yahweh.
translation:
  language: de
  text: Dann stieg er hinab und erhob seine Hände über die ganze Versammlung Israels. Der Segen Jahwes war auf seinen Lippen,[a] und im Namen Jahwes rühmte er sich.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Parallelüberlieferung formuliert mit Zweckangaben: „um mit seinen Lippen dem Herrn Segen zu geben ...“. Der hebräische Text lautet knapper: „und der Segen Jahwes auf seinen Lippen“.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „frohlockte er“. Das Verb kann sich rühmen, frohlocken oder stolz sein bedeuten; auch die griechische Parallelüberlieferung verwendet ein entsprechend mehrdeutiges Verb.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָרַד
  choice: stieg er hinab
  rationale: Das Verb bezeichnet eine Abwärtsbewegung. „stieg … hinab“ gibt diese im erzählenden und kultischen Zusammenhang natürlich und würdig wieder.
- source_word: וְנָשָׂא יָדָיו
  choice: und erhob seine Hände
  rationale: Die hebräische Wendung bezeichnet das Erheben der Hände als Geste des Segens oder Gebets. „erhob“ ist im modernen Standarddeutsch klar und zugleich feierlich.
- source_word: עַל כָּל קְהַל יִשְׂרָאֵל
  choice: über die ganze Versammlung Israels
  rationale: עַל wird räumlich mit „über“ wiedergegeben, passend zur Segensgeste. קהל bezeichnet die versammelte Gemeinschaft; „Versammlung“ vermeidet eine unnötig kirchliche Einengung.
- source_word: וּבִרְכַּת יְהֹוָה בִּשְׂפָתָיו
  choice: Der Segen Jahwes war auf seinen Lippen
  rationale: Der überlieferte hebräische Text enthält hier eine knappe Nominalkonstruktion ohne ausdrückliches Verb. Die Ergänzung „war“ bildet diese am unmittelbarsten ab und bewahrt die Möglichkeit, dass es sich um den von Jahwe kommenden oder in seinem Namen ausgesprochenen Segen handelt.
- source_word: וּבְשֵׁם יְהֹוָה
  choice: und im Namen Jahwes
  rationale: „Im Namen Jahwes“ ist eine natürliche Wiedergabe und bewahrt den Bezug auf den ausdrücklich genannten Gottesnamen.
- source_word: הִתְפָּאֵר
  choice: rühmte er sich
  rationale: Der Hitpael kann „sich rühmen“, „frohlocken“ oder „sich etwas zur Ehre rechnen“ bedeuten. „rühmte er sich“ entspricht auch dem griechischen καυχᾶσθαι und bewahrt die mögliche Spannung des Ausdrucks.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. „Jahwe“ ist die im Deutschen geläufige Form des Gottesnamens und vermeidet, ihn durch einen Titel zu ersetzen.
- issue: Verständnis der knappen Wendung וּבִרְכַּת יְהֹוָה בִּשְׂפָתָיו
  choice: Der Segen Jahwes war auf seinen Lippen
  alternative: um mit seinen Lippen den Segen Jahwes zu erteilen
  rationale: Die Hauptfassung folgt der erhaltenen hebräischen Nominalkonstruktion möglichst eng. Die griechische Parallelüberlieferung bietet dagegen mit δοῦναι eine Zweckangabe („um … zu geben/erteilen“); diese sinnvolle Explikation wird in der Fußnote dokumentiert, aber nicht stillschweigend in den hebräischen Wortlaut eingetragen.
- issue: Bedeutung von הִתְפָּאֵר
  choice: rühmte er sich
  alternative: frohlockte er
  rationale: „Sich rühmen“ hält die lexikalische Spannweite und die griechische Entsprechung καυχᾶσθαι offen. Eine ausschließlich positive Deutung als „frohlocken“ würde die mögliche Nuance des Sich-Rühmens stärker festlegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht feierlichem Ton. Die Satzteilung macht die knappe hebräische Nominalkonstruktion verständlich, ohne die ausführlichere griechische Zweckangabe in den Haupttext zu übernehmen. Sämtliche Fußnotenmarker stehen unmittelbar bei der jeweils erläuterten Wendung.
