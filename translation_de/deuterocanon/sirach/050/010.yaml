translation:
  language: de
  text: wie ein grünender Olivenbaum, reich an Olivenfrüchten,[b] und wie ein üppiger Baum, der seine Zweige tränkt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Griechisch: „und wie eine Zypresse, die bis in die Wolken emporragt“, statt des hebräischen „und wie ein üppiger Baum, der seine Zweige tränkt“. Hier wird dem erhaltenen hebräischen Text aus der Kairoer Geniza als Hauptquelle gefolgt.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „voller Früchte“. Das seltene hebräische Wort bezeichnet hier wahrscheinlich Olivenfrüchte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּזַיִת
  choice: wie ein Olivenbaum
  rationale: Das Präfix כְּ kennzeichnet den Vergleich. זַיִת kann Olive oder Olivenbaum bedeuten; der Parallelismus mit עֵץ und das griechische ἐλαία stützen hier die Bedeutung „Olivenbaum“.
- source_word: רַעֲנָן
  choice: grünend
  rationale: Das Wort bezeichnet frische, kräftige und üppige Vegetation. „Grünend“ bewahrt das konkrete Pflanzenbild und klingt in gehobener deutscher Poesie natürlich.
- source_word: מָלֵא גַרְגַּר
  choice: reich an Olivenfrüchten
  rationale: Wörtlich steht „voll von gargar“. Das seltene Substantiv bezeichnet hier wahrscheinlich die Früchte des Olivenbaums. „Olivenfrüchte“ macht den Bezug deutlich, ohne die Form der Früchte mit „Beeren“ zu stark festzulegen.
- source_word: וּכְעֵץ שָׁמֵן
  choice: und wie ein üppiger Baum
  rationale: שָׁמֵן bedeutet wörtlich „fett“ und kann bei Pflanzen reichen, kräftigen Wuchs bezeichnen. „Üppig“ gibt dieses Bild im Deutschen idiomatisch wieder; „Ölbaum“ wäre möglich, würde שָׁמֵן hier jedoch stärker als Pflanzennamen deuten.
- source_word: מְרַוֶּה עָנָף
  choice: der seine Zweige tränkt
  rationale: Das Partizip von רוה bezeichnet das Tränken oder Sättigen mit Feuchtigkeit. Die aktive, bildhafte Form des Hebräischen bleibt erhalten; der singularische Kollektivbegriff עָנָף wird im Deutschen natürlich als „Zweige“ wiedergegeben.
