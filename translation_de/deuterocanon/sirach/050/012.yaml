  to: Als er die Opferstücke aus der Hand seiner Brüder empfing[a] und bei den Opferanordnungen stand[b], umgab ihn ein Kranz von Söhnen, wie Zedernschösslinge auf dem Libanon. Sie umringten ihn wie Weiden an einem Bach – alle Söhne Aarons in ihrer Pracht.
