base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/050/012.yaml
  text: When he received the portions from the hand of his brothers[a], and he stood at his arrangement, around him was a crown of sons, like saplings of cedars in Lebanon[b]; and they surrounded him like willows by a stream—all the sons of Aaron in their splendor.
translation:
  language: de
  text: Als er die Opferstücke aus der Hand seiner Brüder empfing[a] und bei den Opferanordnungen stand[b], umgab ihn ein Kranz von Söhnen, wie Zedernschösslinge auf dem Libanon. Sie umringten ihn wie Weiden an einem Bach – alle Söhne Aarons in ihrer Pracht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Überlieferung lautet: „aus den Händen der Priester“; im Hebräischen steht: „aus der Hand seiner Brüder“. Im Zusammenhang sind damit offenbar priesterliche Mitbrüder gemeint.'
    reason: alternative_reading
  - marker: b
    text: 'Der hebräische Ausdruck „bei/über den Anordnungen (oder: Schichtungen)“ ist schwierig. Die griechische Überlieferung beschreibt ihn als am Altarherd stehend.'
    reason: textual_variant
lexical_decisions:
- source_word: בְּקַבְּלוֹ נְתָחִים
  choice: Als er die Opferstücke … empfing
  rationale: Die Präposition ב mit Infinitiv constructus bezeichnet hier den zeitlichen Begleitumstand. נְתָחִים sind zerlegte Stücke beziehungsweise Anteile; „Opferstücke“ macht den kultischen Zusammenhang deutlich, ohne eine bestimmte Opferart festzulegen.
- source_word: מִיַּד אֶחָיו
  choice: aus der Hand seiner Brüder
  rationale: Dies folgt dem erhaltenen hebräischen Wortlaut. Dass mit den Brüdern seine priesterlichen Amtsbrüder gemeint sind, ergibt sich aus dem Zusammenhang; die griechische Überlieferung hat ausdrücklich „Priester“.
- source_word: נִצָּב עַל מַעֲרָכוֹת
  choice: an den Schichtungen des Altars stand
  rationale: מַעֲרָכוֹת bezeichnet geordnete Schichtungen beziehungsweise Anordnungen und kann im Opferkontext die auf dem Altar angeordneten Schichten meinen. Die griechische Parallele lokalisiert die Szene am Altarherd. Die Wiedergabe bleibt beim Bild des Anordnens, nennt aber den kultischen Ort verständlich.
- source_word: עֲטֶרֶת בָּנִים
  choice: ein Kranz von Söhnen
  rationale: עֲטֶרֶת bezeichnet einen Kranz oder eine Krone. „Kranz“ passt besonders zum Bild einer den Hohepriester umgebenden Gruppe, während „Söhne“ die ausdrückliche männliche und genealogisch-priesterliche Bezeichnung bewahrt.
- source_word: כִּשְׁתִילֵי אֲרָזִים בַּלְּבָנוֹן
  choice: wie Zedernschösslinge auf dem Libanon
  rationale: שְׁתִילֵי bezeichnet junge, eingepflanzte oder aufsprießende Gewächse. „Zedernschösslinge“ bewahrt das poetische Bild kräftigen jungen Wachstums; im Deutschen ist bei einem Gebirge „auf dem Libanon“ idiomatisch.
- source_word: בְּעַרְבֵי נָחַל
  choice: wie Weiden an einem Bach
  rationale: עַרְבֵי נָחַל ist die geläufige Verbindung für an Wasserläufen wachsende Weiden. Die Formulierung ist bildhaft und in modernem Deutsch unmittelbar verständlich.
- source_word: בִּכְבוֹדָם
  choice: in ihrer Pracht
  rationale: כָּבוֹד umfasst Ehre, Herrlichkeit und glanzvolle Erscheinung. In dieser anschaulichen Prozessionsszene gibt „Pracht“ den sichtbaren und würdevollen Aspekt natürlich wieder.
theological_decisions:
- issue: Identität der „Brüder“
  choice: Der Haupttext behält „seine Brüder“ bei.
  alternative: „aus den Händen der Priester“
  rationale: Der hebräische Primärzeuge nennt Brüder, während die griechische Parallele Priester liest. Der Kontext identifiziert sie als priesterliche Amtsbrüder, doch diese Deutung soll den hebräischen Wortlaut im Haupttext nicht verdrängen.
- issue: Deutung von עַל מַעֲרָכוֹת
  choice: „an den Schichtungen des Altars“
  alternative: „bei den Anordnungen“ oder nach dem Griechischen „am Altarherd“
  rationale: Der hebräische Ausdruck ist knapp und mehrdeutig. Die Übersetzung bewahrt seine Vorstellung geordneter Schichtungen und nutzt die griechische Parallele zur kultischen Verortung, ohne „Altarherd“ als eindeutigen hebräischen Wortlaut auszugeben.
translation_notes:
  register: Modernes, gehobenes Standarddeutsch mit klarer kultischer und poetischer Bildsprache. Der Satz wurde zur besseren deutschen Lesbarkeit in zwei Hauptsätze gegliedert; Gedankenstrich und Wiederaufnahme bewahren den feierlichen Höhepunkt „alle Söhne Aarons“.
