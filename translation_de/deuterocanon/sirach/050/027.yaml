base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/050/027.yaml
  text: Instruction in understanding and mastery of expression[a], by Shimon son of Yeshua, son of Eleazar son of Sira, who poured forth wisdom from his heart[b].
translation:
  language: de
  text: Unterweisung in Einsicht und Meisterschaft im Ausdruck[a], von Schimon, dem Sohn Jeschuas, des Sohnes Eleasars, des Sohnes Siras, der Weisheit aus seinem Herzen hervorströmen ließ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die hebräische Wendung für „Meisterschaft im Ausdruck“ (מוֹשֵׁל אוֹפַנִּים) ist schwer zu deuten. Gemeint sein könnte die Fähigkeit zu geordneter Rede oder sprachlicher Gestaltung; die genaue Bedeutung bleibt unsicher.
    reason: lexical_alternative
  - marker: b
    text: 'Der hebräische Wortlaut des Schlusssatzes ist in der Geniza-Überlieferung unsicher. Die griechische Parallelüberlieferung lautet: „der Weisheit aus seinem Herzen hervorströmen ließ“; danach richtet sich hier der Haupttext.'
    reason: textual_variant
lexical_decisions:
- source_word: מוּסַר שֵׂכֶל
  choice: Unterweisung zu Einsicht
  rationale: מוּסַר bezeichnet formende Unterweisung; שֵׂכֶל benennt hier deren Ziel oder Inhalt als Einsicht. Die Formulierung passt zum kolophonartigen Charakter des Satzes.
- source_word: וּמוֹשֵׁל אוֹפַנִּים
  choice: und kunstvoller Ausdrucksweise
  rationale: Die schwierige hebräische Wendung lässt sich nicht sicher wörtlich bestimmen. Im Zusammenhang weist sie wahrscheinlich auf geordnete, gekonnte sprachliche Gestaltung hin; die Unsicherheit wird in Fußnote [a] offengelegt.
- source_word: לְשִׁמְעוֹן
  choice: von Schimon
  rationale: Das Präfix לְ dient in diesem kolophonartigen Zusammenhang wahrscheinlich der Zuschreibung der Autorschaft.
- source_word: נִיבַּע / הִבִּיעַ
  choice: hervorströmen ließ
  rationale: Die Verben tragen das Bild eines reichlichen Hervorquellens beziehungsweise Äußerns. Die deutsche Form wahrt dieses Bild in natürlicher Sprache.
- source_word: בִּפְתוֹר לְבָן ... בִּתְבוּנוֹת
  choice: Weisheit aus seinem Herzen
  rationale: Der überlieferte hebräische Schluss ist schwierig und unsicher. Die griechische Parallelüberlieferung ἀπὸ καρδίας αὐτοῦ und σοφίαν stützt den Sinn „Weisheit aus seinem Herzen“; die Spannung zum Hebräischen wird in Fußnote [b] benannt.
