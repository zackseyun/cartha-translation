lexical_decisions:
- source_word: כִּכְלִי
  choice: wie ein … Gefäß
  rationale: Die Präposition כְּ bezeichnet den Vergleich; כְּלִי meint hier am ehesten ein kunstvoll gefertigtes Gefäß oder Gerät. „Gefäß“ bewahrt das konkrete poetische Bild.
- source_word: זָהָב
  choice: aus Gold
  rationale: Die übliche und kontextuell eindeutige Materialbezeichnung.
- source_word: מְפֻתָּח
  choice: kunstvoll bearbeitetes
  rationale: Das Partizip bezeichnet dekorative handwerkliche Bearbeitung, etwa Gravieren, Ziselieren oder Schnitzen. Die allgemeinere Formulierung vermeidet eine unbelegte Festlegung auf eine bestimmte Technik und entspricht dem griechischen Parallelzeugen.
- source_word: וְאַנְטִיל
  choice: und Antimon
  rationale: Das seltene hebräische Wort ist unsicher. „Antimon“ gibt eine mögliche mineralische beziehungsweise dekorative Substanz wieder; die Unsicherheit und mögliche Bedeutung als Einlage oder Schmuck werden in der Fußnote bewahrt.
- source_word: הַנֶּאֱחָז
  choice: eingefasst
  rationale: Das Nifal-Partizip bezeichnet etwas, das befestigt oder gehalten wird. Im Zusammenhang mit kostbaren Steinen gibt „eingefasst“ die Schmuckarbeit natürlich wieder, ohne die genaue Technik zu stark festzulegen.
- source_word: עַל אַבְנֵי חֵפֶץ
  choice: mit kostbaren Steinen
  rationale: Wörtlich sind es begehrenswerte beziehungsweise wertvolle Steine. „Kostbare Steine“ ist im Deutschen idiomatisch und wird durch das griechische παντὶ λίθῳ πολυτελεῖ gestützt.
