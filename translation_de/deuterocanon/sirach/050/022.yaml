base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/050/022.yaml
  text: And now[a], please bless Yahweh, the God of Israel, who does wondrous things on the earth, who makes man great from the womb and deals with him according to his will.
translation:
  language: de
  text: Preist nun doch den HERRN, den Gott Israels, der auf Erden Wunder vollbringt, der den Menschen vom Mutterleib an groß macht und an ihm nach seinem Willen handelt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Paralleltext lautet: „Und nun preist alle Gott, der überall Großes vollbringt, der unsere Tage vom Mutterleib an erhöht und an uns nach seinem Erbarmen handelt.“'
    reason: Der griechische Paralleltext weicht mehrfach ab, besonders mit „nach seinem Erbarmen“ statt „nach seinem Willen“.
lexical_decisions:
- source_word: בָּרְכוּ נָא
  choice: bittet ... um seinen Segen
  rationale: Der Pluralimperativ von ברך fordert zum Segnen beziehungsweise Loben Gottes auf; נָא verleiht der Aufforderung einen dringlichen, höflichen Ton. Im Deutschen vermeidet die idiomatische Wendung das missverständliche unmittelbare „segnet den HERRN“.
- source_word: יְהֹוָה אֱלֹהֵי יִשְׂרָאֵל
  choice: den HERRN, den Gott Israels
  rationale: Der Gottesname wird in der etablierten deutschen Bibelkonvention als „der HERR“ wiedergegeben; die Apposition bleibt eng am Hebräischen.
- source_word: הַמַּפְלִיא לַעֲשׂוֹת בָּאָרֶץ
  choice: der auf Erden Wunder vollbringt
  rationale: Die Konstruktion bezeichnet außergewöhnliches, wunderbares Handeln. „Auf Erden“ gibt בָּאָרֶץ im universalen Lobkontext würdig und natürlich wieder.
- source_word: הַמְגַדֵּל אָדָם מֵרֶחֶם
  choice: der den Menschen vom Mutterleib an groß macht
  rationale: אָדָם ist hier ein generischer Singular. „Den Menschen“ bewahrt Singular und Allgemeinbezug; „groß macht“ hält die mögliche Bedeutung von Erhöhen wie auch Heranwachsen offen. מֵרֶחֶם wird bildnah wiedergegeben.
- source_word: וַיַּעֲשֵׂהוּ בִּרְצוֹנוֹ
  choice: und an ihm nach seinem Willen handelt
  rationale: Die Formulierung folgt dem erhaltenen hebräischen Text und gibt Gottes Handeln am Menschen idiomatisch wieder, ohne das mehrdeutige עשה unnötig auf „formen“ oder „erschaffen“ festzulegen.
theological_decisions:
- issue: Generischer Singular אָדָם
  choice: den Menschen
  alternative: den Mann / die Menschheit
  rationale: „Den Menschen“ wahrt den grammatischen Singular und den allgemein-menschlichen Bezug, ohne einen ausschließlich männlichen Referenten zu behaupten.
- issue: Abweichung im Schlussglied zwischen Hebräisch und Griechisch
  choice: nach seinem Willen
  alternative: nach seinem Erbarmen
  rationale: Der vorhandene hebräische Hauptzeuge bietet בִּרְצוֹנוֹ („nach seinem Willen“). Die theologisch bedeutsame griechische Lesart κατὰ τὸ ἔλεος αὐτοῦ („nach seinem Erbarmen“) wird als echte Textvariante in der Fußnote bewahrt.
- issue: Bedeutung von Gottes „Segnung“ durch Menschen
  choice: bittet den HERRN ... um seinen Segen
  alternative: segnet den HERRN / preist den HERRN
  rationale: Die gewählte deutsche Form ist idiomatisch, verschiebt den möglichen Sinn jedoch in Richtung einer Bitte um Gottes Segen. Die Alternative „preist“ würde ברך in diesem Kontext semantisch klarer als menschlichen Lobpreis Gottes ausdrücken.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Partizipialstruktur des Hebräischen bleibt durch Relativsätze erkennbar; die wesentliche griechische Textvariante wird nicht harmonisiert, sondern in der Fußnote dokumentiert.
