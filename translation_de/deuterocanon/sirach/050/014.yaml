  text: until he finished ministering at the altar[a], and arranging the offerings of the Most High.
translation:
  language: de
  text: bis er seinen Dienst am Altar vollendet und die Anordnungen des Höchsten hergerichtet hatte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Griechisch: »als er seinen Dienst an den Altären vollendete, um die Opfergabe des Höchsten, des Allherrschers, herzurichten«. Das Hebräische ist knapper: »die Anordnungen des Höchsten herzurichten«.'
    reason: alternative_reading
lexical_decisions:
- source_word: עַד כַּלּוֹתוֹ
  choice: bis er … vollendet … hatte
  rationale: Die Infinitivkonstruktion mit Suffix bezeichnet den Endpunkt der vorausgehenden Handlung; das Plusquamperfekt fügt sich natürlich in den deutschen Satzanschluss ein.
- source_word: לְשָׁרֵת מִזְבֵּחַ
  choice: seinen Dienst am Altar
  rationale: שרת bezeichnet hier den priesterlich-liturgischen Dienst. Die nominale deutsche Wendung ist würdig und idiomatisch; מזבח wird kontextgemäß mit »Altar« wiedergegeben.
- source_word: וּלְסַדֵּר
  choice: und … bereitet
  rationale: סדר bedeutet ordnen beziehungsweise geordnet herrichten. »Bereiten« klingt im kultischen Zusammenhang natürlich, ohne den Vorgang zu stark zu spezifizieren.
- source_word: מַעַרְכוֹת
  choice: die Anordnungen
  rationale: Der Plural kann geordnete Zusammenstellungen oder kultische Anordnungen bezeichnen. Die Wiedergabe bewahrt die knappe, nicht näher bestimmte Formulierung des Hebräischen.
- source_word: עֶלְיוֹן
  choice: des Höchsten
  rationale: Geläufige deutsche Wiedergabe des göttlichen Titels und hier durch den Genitiv syntaktisch natürlich eingebunden.
theological_decisions:
- issue: Bestimmung des kultischen Objekts מַעַרְכוֹת im Verhältnis zum griechischen προσφοράν
  choice: Im Haupttext bleibt mit »die Anordnungen« die breitere und mehrdeutige hebräische Formulierung erhalten.
  alternative: »die Opfergabe des Höchsten, des Allmächtigen, herzurichten«
  rationale: Der vorhandene hebräische Text ist vorrangig und nennt einen Plural mit der Bedeutung »Anordnungen/geordnete Zusammenstellungen«. Der griechische Paralleltext deutet dies ausdrücklich als Opfergabe und ergänzt den Titel »Allmächtiger«; diese wichtige Abweichung wird in der Fußnote dokumentiert, ohne sie stillschweigend in den Haupttext einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die kultische Sprache bleibt verständlich; die ungewöhnliche Offenheit von מַעַרְכוֹת wird bewusst nicht durch eine bestimmte Opferart aufgelöst.
