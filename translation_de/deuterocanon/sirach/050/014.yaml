  source_fidelity: Der Haupttext folgt dem hebräischen Text mit dem zeitlichen Abschluss („bis er ... vollendet hatte“), dem priesterlichen Dienst am singulären Altar und den pluralischen, absichtlich nicht näher bestimmten מַעַרְכוֹת. Die bisherige Formulierung „die Anordnungen ... bereitet“ ist semantisch und idiomatisch nicht stimmig; „herrichtete“ gibt לסדר angemessen wieder, ohne die Anordnungen zu bestimmten Opfergaben einzuengen.
  naturalness: „Bis er seinen Dienst am Altar vollendet und die Anordnungen des Höchsten hergerichtet hatte“ ist modernes, würdiges Standarddeutsch. Das Plusquamperfekt bindet beide Tätigkeiten klar an den Abschlusszeitpunkt. „Herrichten“ ist für geordnete kultische Vorbereitungen deutlich natürlicher als „Anordnungen bereiten“.
  terminology: „Altar“ und „der Höchste“ sind sachgerecht. „Anordnungen“ bewahrt die formale Offenheit des hebräischen Plurals, auch wenn der kultische Kontext erkennbar bleibt. Die Fußnote soll die griechische Lesart präziser als „Gabe/Opfergabe“ und mit dem Zusatz „Allherrscher“ wiedergeben, ohne diesen Zusatz in den hebräischen Haupttext einzutragen.
