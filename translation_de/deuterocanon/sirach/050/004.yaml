  - marker: b
    text: 'Oder: „befestigt seine Stadt gegen eine Belagerung“; der griechische Paralleltext weist deutlicher auf militärische Bedrohung hin.'
    reason: alternative_reading
lexical_decisions:
- source_word: הַדּוֹאֵג לְעַמּוֹ
  choice: der für sein Volk sorgt
  rationale: Das Partizip von דאג bezeichnet anhaltende Sorge oder Fürsorge. „Für sein Volk sorgt“ gibt diesen aktiven Sinn natürlich wieder, ohne eine bestimmte amtliche Tätigkeit vorauszusetzen.
- source_word: מֵחֶתֶף
  choice: um es vor plötzlichem Unheil zu schützen
  rationale: חֶתֶף bezeichnet einen unvermittelten vernichtenden Schlag oder plötzliches Verderben. Die mit מִן ausgedrückte Abwendung einer Gefahr wird im Deutschen durch „vor … schützen“ verständlich; der griechische Paralleltext mit πτῶσις („Fall, Untergang“) bestätigt den Schutzgedanken.
- source_word: וּמְחַזֵּק
  choice: und … stärkt
  rationale: Das Piel von חזק bedeutet „stärken“ und kann im Zusammenhang mit einer Stadt auch „befestigen“ heißen. „Stärkt“ bewahrt die Breite des hebräischen Ausdrucks.
- source_word: עִירוֹ
  choice: seine Stadt
  rationale: Direkte Wiedergabe des Substantivs עִיר mit Possessivsuffix.
- source_word: מִצָּר
  choice: gegen Bedrängnis
  rationale: צַר kann Bedrängnis, Not oder einen bedrängenden Feind bezeichnen. „Gegen Bedrängnis“ lässt die hebräische Bedeutungsbreite offen; der griechische Paralleltext legt im Kontext konkreter eine Belagerung nahe.
