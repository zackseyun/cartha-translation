translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Satzstruktur bleibt erhalten; die Schutzrichtung der hebräischen Präpositionen wird idiomatisch ausgedrückt. Die mögliche militärische Zuspitzung wird nicht in den Haupttext gezwungen, sondern in der Fußnote kenntlich gemacht.
