translation:
  language: de
  text: Der für sein Volk sorgt, um es vor plötzlichem Unheil zu schützen[a], und seine Stadt gegen Bedrängnis stärkt[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „vor plötzlichem Verderben“; der griechische Paralleltext hat „vor dem Fall“ und unterstreicht den Schutz vor dem Untergang.'
