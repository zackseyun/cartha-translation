  yaml_path: translation/deuterocanon/sirach/033/031.yaml
  text: If you have a servant[a], let him be as yourself[b], because you acquired him with blood.
translation:
  language: de
  text: Wenn du einen Sklaven[a] hast, soll er wie du selbst sein; denn mit Blut[b] hast du ihn erworben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder »Hausdiener«. Das griechische Wort bezeichnet häufig einen Angehörigen des Hausgesindes; die Rede vom Erwerb hebt hier jedoch das Verhältnis der Unfreiheit hervor.
    reason: lexical_alternative
  - marker: b
    text: Wörtlich »mit Blut«. Gemeint ist wahrscheinlich ein Erwerb unter hohem persönlichem Einsatz; wessen Blut im Blick ist, bleibt offen.
    reason: ambiguity
lexical_decisions:
- source_word: οἰκέτης
  choice: Sklave
  rationale: οἰκέτης kann einen Hausdiener oder Angehörigen des Hausgesindes bezeichnen. Da die Person hier als jemand beschrieben wird, den der Angeredete »erworben« hat, tritt das rechtliche Abhängigkeits- und Besitzverhältnis deutlich hervor; »Sklave« vermeidet eine beschönigende Wiedergabe.
- source_word: ἔστω ὡς σύ
  choice: soll er wie du selbst sein
  rationale: Die Wiedergabe bewahrt die imperativische Aussage des Griechischen und vermeidet die stärker deutende Erweiterung »behandle ihn wie dich selbst«.
- source_word: ἐν αἵματι
  choice: mit Blut
  rationale: Die knappe, bildhafte Formulierung entspricht dem Griechischen und lässt offen, wessen Blut gemeint ist beziehungsweise ob allgemein ein Erwerb unter hohem persönlichem Einsatz bezeichnet wird.
- source_word: ἐκτήσω
  choice: hast du ihn erworben
  rationale: »Erwerben« gibt κτάομαι wieder, ohne den Vorgang enger als ausdrücklich bezeugt auf einen Kauf festzulegen.
theological_decisions:
- issue: Wiedergabe der antiken Unfreiheit
  choice: Sklave
  alternative: Diener / Hausdiener
  rationale: Der Erwerb der betreffenden Person macht den Status persönlicher Unfreiheit in diesem Vers besonders deutlich. Die Übersetzung benennt diese soziale Wirklichkeit, ohne sie abzuschwächen oder über den Wortlaut hinaus zu kommentieren.
- issue: Deutung von »mit Blut«
  choice: Die Bildsprache und ihre Mehrdeutigkeit bleiben im Haupttext erhalten.
  alternative: um den Preis von Blut / mit deinem Herzblut
  rationale: Der griechische Text bestimmt weder ausdrücklich, wessen Blut gemeint ist, noch erläutert er die genaue Art des kostspieligen Erwerbs. Eine eindeutige theologische oder historische Deutung wäre daher nicht quellengetreu.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die Satzstellung bleibt nah am griechischen Text, während das Semikolon die Begründung klar gliedert. Die männlichen Pronomen folgen der grammatischen und historischen Form des Ausgangstextes.
