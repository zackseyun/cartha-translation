  text: For it is better that your children should have need of you than that you should look to the hands of your sons[a].
translation:
  language: de
  text: Denn es ist besser, dass deine Kinder dich brauchen, als dass du auf die Hände deiner Söhne schaust.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sinngemäß: „als dass du von deinen Söhnen abhängig bist“. Wörtlich heißt es im Griechischen: „auf die Hände deiner Söhne schaust“; die Hände stehen hier bildhaft für Unterstützung oder Versorgung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κρεῖσσον
  choice: besser
  rationale: Die Vergleichsform bezeichnet hier, was vorzuziehen oder vorteilhafter ist; „besser“ ist die natürliche deutsche Entsprechung.
- source_word: τὰ τέκνα
  choice: deine Kinder
  rationale: τέκνα ist die allgemeinere Bezeichnung für Kinder und wird nicht auf männliche Nachkommen verengt.
- source_word: δεηθῆναί σου
  choice: dass deine Kinder dich brauchen
  rationale: δέομαι mit dem Genitiv bezeichnet hier Bedürftigkeit beziehungsweise Abhängigkeit von einer Person. „Dich brauchen“ gibt dies in natürlichem modernem Deutsch wieder.
- source_word: ἐμβλέπειν εἰς χεῖρας
  choice: auf die Hände … schaust
  rationale: Die konkrete Bildsprache des griechischen Ausdrucks bleibt erhalten; im Zusammenhang bezeichnet sie den erwartungsvollen Blick auf Unterstützung oder Versorgung.
- source_word: υἱῶν σου
  choice: deiner Söhne
  rationale: υἱῶν bedeutet ausdrücklich „Söhne“. Die Wiedergabe bewahrt den Wechsel gegenüber dem breiteren τέκνα im ersten Satzteil.
