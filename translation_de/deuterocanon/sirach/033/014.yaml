  text: Opposite evil is good[a], and opposite death is life; so opposite a godly man is a sinner.
translation:
  language: de
  text: Dem Bösen steht das Gute gegenüber, und dem Tod das Leben; ebenso steht dem Gottesfürchtigen der Sünder gegenüber.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπέναντι
  choice: steht … gegenüber
  rationale: Die wiederholte Präposition bildet drei parallele Gegensatzpaare. Die verbale deutsche Wendung ist natürlich und bewahrt die räumlich gefärbte antithetische Struktur.
- source_word: τοῦ κακοῦ / τὸ ἀγαθόν
  choice: dem Bösen / das Gute
  rationale: Die substantivierten Adjektive geben den grundlegenden moralischen Gegensatz knapp und sprichwortartig wieder.
- source_word: τοῦ θανάτου / ἡ ζωή
  choice: dem Tod / das Leben
  rationale: Wörtliche und eindeutige Wiedergabe des zweiten Gegensatzpaares.
- source_word: οὕτως
  choice: ebenso
  rationale: Kennzeichnet das dritte Paar als entsprechende Fortführung der beiden vorangehenden Gegenüberstellungen.
- source_word: εὐσεβοῦς
  choice: dem Gottesfürchtigen
  rationale: Das substantivierte maskuline Singularadjektiv bezeichnet einen frommen, Gott ergebenen Menschen. „Gottesfürchtig“ ist im Kontext der Weisheitsliteratur verständlich und inhaltlich präziser als das möglicherweise kultisch oder sozial verengte „fromm“.
- source_word: ἁμαρτωλός
  choice: der Sünder
  rationale: Gängige personale Wiedergabe des substantivisch gebrauchten maskulinen Singulars; sie erhält den direkten Kontrast zum Gottesfürchtigen.
theological_decisions:
- issue: Personaler und grammatisch maskuliner Gegensatz zwischen εὐσεβοῦς und ἁμαρτωλός
  choice: dem Gottesfürchtigen der Sünder
  alternative: einem gottesfürchtigen Menschen ein sündiger Mensch
  rationale: Die knappe substantivische Form bewahrt Singular, Genus und Parallelismus, ohne durch den Zusatz „Mann“ das biologische Geschlecht stärker hervorzuheben, als es der griechische Weisheitsspruch verlangt. Zugleich wird der Gegensatz nicht zu abstrakten Eigenschaften umgedeutet.
translation_notes:
  register: Knappes, würdiges Sprichwortdeutsch mit dreifacher Parallelstruktur. Die Wiederholung von „gegenüberstehen“ wird im ersten und dritten Glied ausdrücklich gesetzt; im zweiten Glied elliptisch fortgeführt, wie es im Deutschen natürlich und prägnant wirkt.
