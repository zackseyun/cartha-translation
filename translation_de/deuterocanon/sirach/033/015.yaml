translation:
  language: de
  text: 'Und so betrachte alle Werke des Höchsten: je zwei, eines dem anderen gegenüber[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eines dem anderen entsprechend“. Das Griechische kann sowohl einen Gegensatz als auch eine aufeinander bezogene Entsprechung ausdrücken; der Zusammenhang paarweiser Kontraste spricht für die Wiedergabe im Haupttext.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔμβλεψον
  choice: betrachte
  rationale: Der Imperativ fordert zu aufmerksamer, prüfender Wahrnehmung auf. „Betrachte“ gibt diese Kraft im Deutschen natürlicher wieder als das rein visuelle „sieh an“.
- source_word: πάντα τὰ ἔργα
  choice: alle Werke
  rationale: ἔργα bezeichnet hier umfassend die Werke beziehungsweise Hervorbringungen des Höchsten; „Werke“ bewahrt diese Bedeutungsbreite.
- source_word: τοῦ ὑψίστου
  choice: des Höchsten
  rationale: ὁ ὕψιστος ist ein etablierter göttlicher Hoheitstitel; „der Höchste“ ist die geläufige und würdevolle deutsche Entsprechung.
- source_word: δύο δύο
  choice: je zwei und zwei
  rationale: Die Wiederholung hat distributive Bedeutung und beschreibt eine paarweise Ordnung. „Je zwei und zwei“ erhält sowohl die Wiederholung als auch den Sinn.
- source_word: ἓν κατέναντι τοῦ ἑνός
  choice: eines dem anderen gegenüber
  rationale: κατέναντι kann ein Gegenüber im Sinn von Gegensatz oder entsprechender Zuordnung bezeichnen. Die Hauptfassung bewahrt die räumlich-relationale Ausdrucksweise und lässt den im Kontext naheliegenden Gegensatz erkennen.
theological_decisions:
- issue: Göttlicher Titel ὁ ὕψιστος
  choice: der Höchste
  alternative: der Allerhöchste
  rationale: „Der Höchste“ entspricht dem griechischen Superlativ unmittelbar und ist als Gottesbezeichnung im Deutschen verständlich, ohne durch „Allerhöchste“ eine zusätzliche Steigerung einzutragen.
- issue: Verhältnis der paarweise geordneten Werke
  choice: eines dem anderen gegenüber
  alternative: eines dem anderen entsprechend
  rationale: Der griechische Ausdruck κατέναντι lässt sowohl Gegensatz als auch zugeordnete Entsprechung zu. Der Kontext paarweiser Kontraste stützt die Hauptfassung; die echte lexikalische Mehrdeutigkeit wird in der Fußnote erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe, parallele Satzgestalt des Griechischen bleibt erhalten; „betrachte“ vermittelt den weisheitlichen Aufruf zu genauer Wahrnehmung, ohne altertümlich zu wirken.
