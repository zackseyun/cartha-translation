lexical_decisions:
- source_word: συνάγαγε
  choice: Sammle
  rationale: Der Aorist-Imperativ von συνάγω wird als unmittelbare Aufforderung wiedergegeben. „Sammle“ ist knapp, natürlich und bewahrt die Befehlsform.
- source_word: πάσας
  choice: alle
  rationale: πάσας bezieht sich umfassend auf φυλάς; „alle“ ist hier die natürliche deutsche Entsprechung.
- source_word: φυλάς
  choice: Stämme
  rationale: Im biblischen Zusammenhang mit Jakob bezeichnet φυλή die Stämme Israels. „Stämme“ bewahrt diesen feststehenden ethnisch-genealogischen Sinn.
- source_word: Ἰακώβ
  choice: Jakobs
  rationale: Der griechische Text nennt ausdrücklich Jakob. Der Genitiv entspricht der Verbindung φυλὰς Ἰακώβ und bewahrt den Bezug auf den Stammvater.
