  terminology: „Zorn“ für θυμός und „Grimm“ für ὀργή sind als kontextuelle, stilistisch unterscheidende Wiedergaben geeignet. Die Übersetzung legt weder einen ausdrücklich göttlichen noch einen menschlichen Adressaten oder Bezug fest, den der isoliert vorliegende griechische Wortlaut nicht nennt.
