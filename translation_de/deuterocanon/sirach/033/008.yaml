  source_fidelity: Die Übersetzung gibt die beiden griechischen Imperative ἔγειρον und ἔκχεον sowie ihre Objekte θυμόν und ὀργήν vollständig wieder. „Wecke den Zorn“ bewahrt die Aufforderung zum Erregen/Aufwecken, und „gieße den Grimm aus“ erhält das bildhafte Ausgießen. Die Differenzierung von „Zorn“ und „Grimm“ ist im Deutschen vertretbar, ohne eine überpräzise semantische Unterscheidung zu behaupten.
