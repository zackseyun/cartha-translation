lexical_decisions:
- source_word: ἔγειρον
  choice: Wecke
  rationale: Der Imperativ von ἐγείρω bedeutet hier in Verbindung mit θυμός, eine innere Regung zu wecken oder hervorzurufen. „Wecke“ bewahrt das Bild und die Befehlsform knapp und natürlich.
- source_word: θυμόν
  choice: den Zorn
  rationale: θυμός bezeichnet hier eine heftige Gemütsbewegung, besonders Zorn. „Zorn“ ist im Deutschen würdig und verständlich und lässt sich gegenüber ὀργή noch differenzieren.
- source_word: ἔκχεον
  choice: gieße … aus
  rationale: Der Imperativ von ἐκχέω bezeichnet das Ausgießen einer Flüssigkeit und wird bildlich auf den Grimm bezogen. Die deutsche Wendung erhält dieses anschauliche Bild.
- source_word: ὀργήν
  choice: den Grimm
  rationale: ὀργή bezeichnet Zorn beziehungsweise dessen wirksamen Ausdruck. „Grimm“ vermeidet eine bloße Wiederholung von „Zorn“ und bewahrt den gesteigerten, gehobenen Ton, ohne die beiden griechischen Begriffe gleichzusetzen.
theological_decisions:
- issue: Quellentreue und Versabgrenzung
  choice: Die überlieferte griechische Klausel wird als eigenständige Imperativzeile übersetzt; fehlender Kontext wird nicht ergänzt.
  alternative: Die Zeile entsprechend anderen Ausgaben als Teil eines längeren Satzes wiedergeben oder durch benachbarten Wortlaut ergänzen.
  rationale: Der bereitgestellte griechische Zeuge enthält für diesen Vers nur diese Imperativklausel und ist als erhebliche Abweichung gekennzeichnet. Daher bleibt die Übersetzung beim tatsächlich belegten Wortlaut und weist transparent auf die unsichere Abgrenzung hin.
translation_notes:
  register: Knappes, würdevolles Standarddeutsch. Die Parallelität der beiden Imperative und die bildhafte Sprache des griechischen Textes bleiben erhalten; „Zorn“ und „Grimm“ geben die beiden verwandten, aber nicht völlig identischen Substantive differenziert wieder.
