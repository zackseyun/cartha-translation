  text: Stir up anger and pour out wrath,[a]
translation:
  language: de
  text: Wecke den Zorn und gieße den Grimm aus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die hier vorliegende griechische Quelle überliefert für diesen Vers nur diese Imperativklausel. Andere Ausgaben können den Text anders abgrenzen oder zusätzlichen umliegenden Wortlaut bieten.
