  source_fidelity: Der Haupttext gibt den Aoristimperativ ἐλέησον zutreffend als Gebetsbitte wieder. Die am Versende in der vorgelegten griechischen Textform stehende Imperativform ὁμοίωσον wird folgerichtig als zweite Bitte übersetzt. Der Akkusativ ὃν, der sich auf Israel bezieht, wird durch „es“ idiomatisch aufgenommen. „einem Erstgeborenen gleichmachen“ gibt den Vergleich mit πρωτογόνῳ ohne Zusatz von „Sohn“ wieder.
  naturalness: „Erbarme dich des Volkes, Herr“ ist würdiges und gut verständliches modernes Gebetsdeutsch. Die Semikolonfügung macht die harte, elliptische griechische Konstruktion lesbar, ohne den Charakter einer fortgesetzten Anrufung zu verlieren. „Nach deinem Namen genannt“ ist verständlich und bewahrt den biblischen Ausdruck.
  terminology: „Herr“, „Volk“, „Israel“ und „Erstgeborener“ sind konsistent und sachgerecht. Die Formulierung vermeidet sowohl eine theologisch weitergehende Auslegung als auch die im englischen Audit Trail bevorzugte Vergangenheitsdeutung, die mit der hier vorliegenden Imperativform nicht unmittelbar übereinstimmt.
