base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/033/017.yaml
  text: Have mercy on the people[a], O Lord, who are called by your name, and on Israel[b], whom you made equal to a firstborn son.
translation:
  language: de
  text: Erbarme dich des Volkes, Herr, das nach deinem Namen genannt ist[a], und Israels; mache es einem Erstgeborenen gleich.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Nach deinem Namen genannt“ ist eine biblische Ausdrucksweise dafür, dass das Volk als Gott zugehörig gekennzeichnet ist.
    reason: cultural_note
  - marker: b
    text: 'Der griechische Satzbau am Versende ist stark gerafft; wörtlich etwa: „und Israel, das mache einem Erstgeborenen gleich“. Die Verbform ist ein Imperativ. Die Wendung ist jedoch auch als Beschreibung von Gottes früherem Handeln an Israel verstanden worden.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐλέησον
  choice: Erbarme dich
  rationale: Der Aoristimperativ formuliert eine unmittelbare, feierliche Bitte um Gottes barmherziges Eingreifen. Mit dem Genitiv („des Volkes … und Israels“) ist die Wendung im Deutschen idiomatisch.
- source_word: λαόν
  choice: des Volkes
  rationale: Das artikellose Substantiv bezeichnet im Gebetszusammenhang das konkrete Gottesvolk. Der deutsche bestimmte Artikel ist natürlich; ein im Griechischen nicht ausdrücklich vorhandenes „deines“ wird nicht ergänzt.
- source_word: Κύριε
  choice: Herr
  rationale: Der Vokativ wird als direkte Gebetsanrede wiedergegeben. Ein zusätzliches „o“ wäre im heutigen Standarddeutsch unnötig altertümlich.
- source_word: κεκλημένον ἐπ᾽ ὀνόματί σου
  choice: das nach deinem Namen genannt ist
  rationale: Die Formulierung hält das biblische Namensidiom sichtbar und bezeichnet das Volk als Gott zugehörig, ohne diese Bedeutung bereits paraphrasierend in den Haupttext einzutragen.
- source_word: Ἰσραήλ
  choice: Israels
  rationale: Der Eigenname steht als zweites Bezugswort zu „Erbarme dich“ und erhält deshalb im Deutschen den Genitiv.
- source_word: ὃν
  choice: es
  rationale: Das maskuline Relativpronomen bezieht sich auf Israel als kollektive Größe. Wegen der stark gerafften griechischen Konstruktion wird der Bezug im Deutschen durch das Pronomen „es“ in einem neuen Satzteil ausgedrückt.
- source_word: πρωτογόνῳ
  choice: einem Erstgeborenen
  rationale: Der Dativ bezeichnet die Vergleichsgröße. „Erstgeborener“ bewahrt den Sohnschaftsanklang, ohne das im Griechischen nicht eigens stehende Wort „Sohn“ hinzuzufügen.
- source_word: ὁμοίωσον
  choice: mache … gleich
  rationale: Die überlieferte Form ist ein Aoristimperativ der zweiten Person Singular und wird daher als neue Bitte wiedergegeben, nicht als Aussage über eine vergangene Handlung.
theological_decisions:
- issue: Israels Stellung als Erstgeborener
  choice: 'Die Schlusswendung wird als Bitte verstanden: Gott soll Israel einem Erstgeborenen gleichmachen.'
  alternative: 'Die Schlusswendung kann als Beschreibung früheren göttlichen Handelns aufgefasst werden: Israel, das Gott einem Erstgeborenen gleichgemacht hat.'
  rationale: Die Verbform ὁμοίωσον ist morphologisch ein Imperativ und stützt die Bitte deutlich. Die syntaktisch gedrängte Verbindung mit dem Relativpronomen wird jedoch in einer Fußnote kenntlich gemacht, damit die in der Überlieferung und Auslegung wahrgenommene Spannung nicht verschwiegen wird.
translation_notes:
  register: Modernes, würdevolles Gebetsdeutsch. Die traditionelle Wendung „Erbarme dich“ bleibt wegen ihrer Prägnanz und liturgischen Verständlichkeit erhalten. Die Semikolonfügung macht die zwei Bitten lesbar, ohne die schwierige griechische Syntax zu verdecken; Fußnote [b] dokumentiert die formale Härte und die alternative Deutung.
