review_pass:
  verdict: revise
  source_fidelity: 'Die wesentlichen Lexeme sind zutreffend wiedergegeben: „Hüte dich“ entspricht πρόσεχε, „Übeltäter“ ist für κακούργος angemessen, und „ersinnt Böses“ bewahrt die weite, substantivische Bedeutung von πονηρά sowie den planenden Aspekt von τεκταίνεται. Die Warnfolge μή ποτε verlangt jedoch im Deutschen eine Formulierung, die eindeutig als befürchtete Folge der Aufforderung und nicht als Absicht des Übeltäters verstanden wird.'
  naturalness: '„Damit er dir nicht für immer Schande einbringt“ ist syntaktisch mehrdeutig: Nach „denn er ersinnt Böses“ kann der Finalsatz als Zweck seines Ersinnens gelesen werden. „… damit er dir nicht etwa für immer Schande zufügt“ ist idiomatischer; „etwa“ gibt den möglichen, abwehrenden Charakter von μή ποτε wieder.'
  terminology: „Übeltäter“, „Böses“ und „Schande“ passen zum würdigen modernen Weisheitsregister. „Schande zufügen“ ist im Deutschen die natürlichere Verbindung als „Schande einbringen“. Die Fußnote wird entsprechend sprachlich und semantisch präzisiert.
  issues:
  - severity: medium
    issue: Mehrdeutige Anbindung von „damit er … nicht“
    rationale: Die gegenwärtige Wortstellung kann nahelegen, der Übeltäter ersinne Böses mit dem Ziel, dem Angeredeten keine Schande einzubringen. Gemeint ist hingegen die zu vermeidende mögliche Folge der Aufforderung.
  - severity: low
    issue: Unidiomatische Kollokation „Schande einbringen“
    rationale: Bei einer Person ist „Schande zufügen“ oder „Schande bereiten“ im modernen Standarddeutsch natürlicher und bildet δῷ σοι in Verbindung mit μῶμον gut ab.
