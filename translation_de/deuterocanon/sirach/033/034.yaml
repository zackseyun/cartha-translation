  text: Be on guard against a wrongdoer, for he devises evil, lest he ever bring disgrace upon you.
translation:
  language: de
  text: Hüte dich vor einem Übeltäter, denn er ersinnt Böses, damit er dir nicht etwa für immer Schande zufügt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Hüte dich vor einem Übeltäter, denn er schmiedet böse Pläne, damit er dir nicht etwa für immer einen Makel zufügt.“'
    reason: „Schmiedet böse Pläne“ hebt die bildhaft-planende Nuance von τεκταίνεται hervor; „Makel“ ist eine mögliche Wiedergabe von μῶμος.
lexical_decisions:
- source_word: πρόσεχε ἀπὸ κακούργου
  choice: Hüte dich vor einem Übeltäter
  rationale: πρόσεχε mit ἀπό warnt davor, sich vor einer schädlichen oder böse handelnden Person in Acht zu nehmen. „Übeltäter“ gibt κακοῦργος moralisch deutlich wieder, ohne es auf einen strafrechtlich verurteilten Verbrecher einzuengen.
- source_word: πονηρὰ
  choice: Böses
  rationale: Das substantivierte Neutrum Plural bezeichnet böse Dinge, Vorhaben oder Machenschaften; „Böses“ bewahrt die Breite und moralische Aussage.
- source_word: τεκταίνεται
  choice: ersinnt
  rationale: Das Verb bezeichnet planendes Ausdenken oder kunstvolles Ausarbeiten und trägt hier einen negativen, auf Machenschaften gerichteten Sinn.
- source_word: μή ποτε
  choice: damit … nicht
  rationale: Die Wendung führt die befürchtete mögliche Folge ein. Die deutsche Konstruktion gibt die Warnung natürlich wieder, ohne die Möglichkeit als Gewissheit darzustellen.
- source_word: μῶμον
  choice: Schande
  rationale: μῶμος kann Tadel, Makel oder Schmach bezeichnen. „Schande“ erfasst hier den anhaltenden Ehrverlust, den der Übeltäter verursachen könnte.
- source_word: εἰς τὸν αἰῶνα
  choice: für immer
  rationale: Die feste Wendung bezeichnet zeitliche Dauer. „Für immer“ gibt sie direkter wieder als ein adverbiales „je“.
- source_word: δῷ σοι
  choice: dir … einbringt
  rationale: Wörtlich steht „dir gibt“; zusammen mit μῶμον bezeichnet es idiomatisch das Zufügen beziehungsweise Einbringen von Schande.
