  text: Settle a stranger with you[a], and he will throw you into turmoil, and estrange you from your own.
translation:
  language: de
  text: Lass einen Fremden bei dir wohnen[a], und er wird dich in Unruhe stürzen und dich deinem Eigenen entfremden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Nimm einen Außenstehenden bei dir auf.“ Gemeint ist jemand, der nicht zum eigenen Haus oder engeren Kreis gehört; eine ethnische Bedeutung ist nicht zwingend.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παροίκισον
  choice: Lass … bei dir wohnen
  rationale: Der Aoristimperativ von παροικίζω bezeichnet hier, jemanden als Beisassen oder Mitbewohner bei sich wohnen zu lassen. Die deutsche Formulierung ist natürlich und bewahrt den veranlassenden Sinn.
- source_word: ἀλλότριον
  choice: einen Fremden
  rationale: Das substantivierte Adjektiv bezeichnet jemanden, der nicht zum eigenen Haus oder Kreis gehört. „Fremder“ wahrt diese Breite, ohne ethnische Fremdheit festzulegen.
- source_word: διαστρέψει … ἐν ταραχαῖς
  choice: wird dich in Unruhe stürzen
  rationale: διαστρέφω kann ein Verdrehen, Zerrütten oder aus der Ordnung Bringen bezeichnen; zusammen mit ἐν ταραχαῖς liegt eine praktische Verwicklung in Unruhe oder Wirren nahe. Die Wendung gibt die Aussage idiomatisch wieder, ohne moralische Verderbnis einzutragen.
- source_word: ἀπαλλοτριώσει
  choice: wird … entfremden
  rationale: Das Verb bedeutet, fremd zu machen oder zu entfremden. „Entfremden“ erhält die im Griechischen erkennbare Wortbeziehung zu ἀλλότριον.
- source_word: τῶν ἰδίων σου
  choice: dem, was dir gehört
  rationale: Die substantivierte Wendung ist bewusst weit und kann eigene Menschen, den eigenen Hausstand oder eigenen Besitz meinen. Die neutrale deutsche Form wahrt diese Offenheit besser als eine Festlegung auf Familie, Leute oder Güter.
