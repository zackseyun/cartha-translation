  source_fidelity: 'Die Grundstruktur und die Verben werden zutreffend wiedergegeben: παροίκισον ist kausativ als „Lass ... bei dir wohnen“ erfasst, ἀλλότριον bleibt ohne ethnische Verengung „einen Fremden“, und die beiden Zukunftsverben geben die Folgen wieder. Die Schlussformulierung „was dir gehört“ lenkt τῶν ἰδίων σου jedoch zu deutlich auf Besitz. Die griechische substantivierte Pluralform bleibt weiter und kann insbesondere die eigenen Angehörigen bzw. den eigenen Kreis ebenso einschließen.'
  naturalness: Der Satz ist flüssiges modernes Standarddeutsch und behält den knappen, warnenden Weisheitsspruch-Ton. „deinem Eigenen entfremden“ ist leicht gehoben, aber verständlich und für den sentenzhaften Register angemessen; es bewahrt die Offenheit besser als die besitzbezogene Relativformulierung.
  terminology: „Fremden“ und „entfremden“ geben die auffällige Wortverwandtschaft von ἀλλότριον und ἀπαλλοτριώσει sinnvoll wieder. „Unruhe“ ist als idiomatische Wiedergabe von ἐν ταραχαῖς vertretbar. „Deinem Eigenen“ wahrt die nicht näher bestimmte Referenz von τῶν ἰδίων σου.
