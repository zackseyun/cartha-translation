  yaml_path: translation/deuterocanon/sirach/033/021.yaml
  text: As long as you are still alive and breath is in you[a], do not give yourself over to any flesh.
translation:
  language: de
  text: Solange du noch lebst und Atem in dir ist, gib dich keinem Menschen preis.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »gib dich nicht irgendeinem Fleisch preis«; möglich ist auch: »liefere dich niemandem aus« oder »unterwirf dich keinem Menschen«.'
    reason: Die wörtliche Bezeichnung σάρξ (»Fleisch«) und die ungewöhnliche Konstruktion mit ἀλλάσσω lassen mehrere nahe Sinnfassungen zu.
lexical_decisions:
- source_word: ἕως ἔτι ζῇς
  choice: Solange du noch lebst
  rationale: ἕως mit ἔτι und dem Präsens ζῇς bezeichnet die fortdauernde Zeit des Lebens; die Formulierung ist natürlich und bewahrt die Betonung von »noch«.
- source_word: πνοὴ ἐν σοί
  choice: Atem in dir ist
  rationale: πνοή bezeichnet hier unmittelbar den Atem als Zeichen fortdauernden Lebens; »Atem« vermeidet die stärker theologisch deutbare Wiedergabe »Geist«.
- source_word: μὴ ἀλλάξῃς σεαυτόν
  choice: gib dich … nicht preis
  rationale: ἀλλάσσω bedeutet grundsätzlich »ändern/tauschen«; mit dem Reflexivpronomen und dem Dativ bezeichnet die Wendung hier idiomatisch, sich einem anderen auszuliefern oder in dessen Verfügungsgewalt zu geben. »Sich preisgeben« drückt dies in gegenwärtigem Deutsch knapp aus.
- source_word: πάσῃ σαρκί
  choice: keinem Menschen
  rationale: Wörtlich steht »jedem/irgendeinem Fleisch«; σάρξ bezeichnet hier idiomatisch einen Menschen. Die Haupttextfassung vermeidet die im Deutschen missverständliche Wendung »keinem Fleisch«, während die Fußnote den Wortlaut bewahrt.
theological_decisions:
- issue: Wiedergabe von σάρξ
  choice: Mensch
  alternative: Fleisch; Sterblicher
  rationale: Im Zusammenhang steht σάρξ metonymisch für einen Menschen, dem man sich nicht ausliefern soll. »Mensch« gibt den situativen Sinn verständlich wieder; die wörtliche und auf menschliche Vergänglichkeit anspielende Form bleibt in der Fußnote sichtbar.
- issue: Art der Selbstunterstellung in ἀλλάξῃς σεαυτόν
  choice: sich preisgeben
  alternative: sich ausliefern; sich in die Gewalt eines anderen begeben; sich verändern
  rationale: Die ungewöhnliche griechische Konstruktion lässt die Grundbedeutung »ändern/tauschen« anklingen, meint im Kontext aber wahrscheinlich die Übertragung der eigenen Verfügungsgewalt. Die Übersetzung wahrt diese Warnung, ohne eine bestimmte rechtliche oder konfessionelle Deutung einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit direkter Anrede. »Preisgeben« ist verständlich und knapp; die Fußnote dokumentiert die auffällige griechische Ausdrucksweise und ihre Deutungsbreite.
