  text: In all your works be preeminent[b][a]; do not give a blemish to your honor.
translation:
  language: de
  text: Bei allem, was du tust, zeichne dich aus[a]; füge deinem Ansehen keinen Makel zu[b].
  philosophy: optimal-equivalence
  footnotes:
