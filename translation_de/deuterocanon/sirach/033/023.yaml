lexical_decisions:
- source_word: ἐν πᾶσι τοῖς ἔργοις σου
  choice: Bei allem, was du tust
  rationale: Die umfassende Bedeutung von πᾶσι und der Sinn von ἔργοις als Taten oder Werke werden in natürlichem modernem Deutsch wiedergegeben.
- source_word: γίνου ὑπεράγων
  choice: zeichne dich aus
  rationale: γίνου leitet eine fortdauernde Aufforderung ein; ὑπεράγων bezeichnet ein Hervorragen oder Übertreffen. Die idiomatische Wendung bewahrt den positiven Anspruch, ohne einen unnatürlichen Vergleich zu ergänzen.
- source_word: μὴ δῷς μῶμον
  choice: gib … keinen Makel
  rationale: Die Verneinung gibt das Verbot wieder. „Makel“ erhält das Bild von μῶμος und umfasst zugleich Tadel und Beschädigung des guten Namens.
- source_word: ἐν τῇ δόξῃ σου
  choice: deinem Ansehen
  rationale: δόξα bezeichnet hier im weisheitlich-ethischen Zusammenhang am ehesten das öffentliche Ansehen oder die Ehre einer Person; „Ansehen“ vermeidet eine unnötig theologische Färbung von „Herrlichkeit“.
theological_decisions:
- issue: Bedeutung von δόξα im weisheitlich-ethischen Zusammenhang
  choice: Ansehen
  alternative: Ehre; Ruhm; Herrlichkeit
  rationale: Der Zusammenhang betrifft das persönliche Verhalten und die Vermeidung von Tadel. „Ansehen“ wahrt den gesellschaftlich-ethischen Sinn, während „Herrlichkeit“ im Deutschen leicht stärker theologisch verstanden würde.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die erste Satzhälfte ist idiomatisch gefasst; die zweite bewahrt bewusst das konkrete Bild des Makels und die Mehrdeutigkeit von δόξα im Bereich von Ansehen und Ehre.
