translation:
  language: de
  text: Im Zorn des Feuers soll derjenige, der gerettet wird[a], verzehrt werden, und die deinem Volk Unrecht tun, mögen den Untergang finden.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische ὁ σωζόμενος kann auch „wer entkommt“ oder „der Überlebende“ bedeuten. Im Zusammenhang eines Gerichts kann damit jemand gemeint sein, der zunächst entkommen ist, dann aber doch vom Gericht getroffen wird.
    reason: lexical_alternative
  - marker: b
    text: Der für diesen Vers bereitgestellte griechische Text weicht deutlich von der sonst erwarteten Zuordnung zu Sirach 33,11 ab. Die Übersetzung folgt daher unmittelbar diesem griechischen Wortlaut und gleicht ihn nicht an eine andere Texttradition oder Verszählung an.
    reason: textual_variant
lexical_decisions:
- source_word: ἐν ὀργῇ πυρὸς
  choice: Im Zorn des Feuers
  rationale: Die ungewöhnliche Genitivverbindung wird eng am Griechischen wiedergegeben. So bleibt offen, ob das Feuer selbst als zornig erscheint oder den Zorn vollstreckt.
- source_word: καταβρωθήτω
  choice: soll verzehrt werden
  rationale: Die passive Befehlsform wird als deutscher Jussiv wiedergegeben. „Verzehren“ passt zum Feuerbild und bewahrt zugleich den Grundgedanken des Aufzehrens.
- source_word: ὁ σωζόμενος
  choice: wer gerettet wird
  rationale: Die Wiedergabe folgt unmittelbar dem präsentischen Passivpartizip und erhält die auffällige Spannung dazu, dass diese Person dennoch verzehrt werden soll. Die mögliche kontextuelle Bedeutung „wer entkommt“ wird in der Fußnote genannt.
- source_word: οἱ ἀδικοῦντες τὸν λαόν σου
  choice: alle, die deinem Volk Unrecht tun
  rationale: Die substantivierte Partizipialwendung mit ihrem Objekt wird in natürlichem heutigem Deutsch wiedergegeben; „alle“ verdeutlicht lediglich den generischen Plural.
- source_word: εὕροισαν ἀπώλειαν
  choice: sollen den Untergang finden
  rationale: Der optativisch-jussive Wunschcharakter bleibt erhalten. „Den Untergang finden“ bildet die griechische Verbindung eng ab und entspricht dem Gerichtston.
theological_decisions:
- issue: Spannung in ὁ σωζόμενος
  choice: wer gerettet wird
  alternative: wer entkommt; der Überlebende
  rationale: Die formal naheliegende Bedeutung wird nicht stillschweigend in ein bloßes Entrinnen umgedeutet. Zugleich dokumentiert die Fußnote die im Gerichtskontext mögliche alternative Lesart.
- issue: Deutliche Abweichung von der erwarteten Zuordnung zu Sirach 33,11
  choice: Den bereitgestellten griechischen Wortlaut als eigenständige Gerichtsbitte übersetzen
  alternative: Mit anderen Texttraditionen oder Verszählungen harmonisieren
  rationale: Die Übersetzung folgt dem angegebenen griechischen Ausgangstext und macht die unsichere Verszuordnung transparent, statt fremden Wortlaut einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung hebt die beabsichtigte Spannung zwischen Rettung beziehungsweise Entrinnen und anschließendem Verzehrtwerden hervor; der bittende beziehungsweise jussive Gerichtston bleibt erhalten.
