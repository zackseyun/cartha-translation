  text: Put him to work, so that he may not be idle;
translation:
  language: de
  text: Setz ihn zur Arbeit ein, damit er nicht untätig ist;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔμβαλε
  choice: Setz … ein
  rationale: Der Imperativ von ἐμβάλλω bedeutet wörtlich „hineinwerfen“, bezeichnet zusammen mit εἰς ἐργασίαν hier aber idiomatisch, jemanden zur Arbeit einzusetzen. Die gewählte Form bewahrt die Befehlsform und klingt im Deutschen natürlich.
- source_word: αὐτὸν
  choice: ihn
  rationale: Das maskuline Akkusativpronomen verweist im Zusammenhang auf einen männlichen Sklaven beziehungsweise Knecht; „ihn“ gibt Geschlecht und Numerus genau wieder.
- source_word: εἰς ἐργασίαν
  choice: zur Arbeit
  rationale: ἐργασία bezeichnet Arbeit, Tätigkeit oder Beschäftigung. „Zur Arbeit einsetzen“ gibt die Verbindung im heutigen Standarddeutsch klar und idiomatisch wieder.
- source_word: ἵνα μὴ ἀργῇ
  choice: damit er nicht untätig ist
  rationale: ἀργέω bedeutet untätig, unbeschäftigt oder müßig sein. „Untätig“ gibt den Zustand wieder, ohne die stärkere moralische Wertung von „faul“ einzutragen.
theological_decisions:
- issue: Wiedergabe des maskulinen Singularobjekts im Kontext der Sklaverei
  choice: ihn
  alternative: ihn oder sie / die Person
  rationale: Die griechische Form und der unmittelbare Zusammenhang beziehen sich auf einen männlichen Untergebenen. Eine Neutralisierung würde die soziale und grammatische Gestalt des Ausgangstextes verändern.
- issue: Grad der Wörtlichkeit bei ἔμβαλε εἰς ἐργασίαν
  choice: Setz ihn zur Arbeit ein
  alternative: Wirf ihn in die Arbeit
  rationale: Die wörtliche räumliche Metapher wäre im Deutschen missverständlich und unnatürlich. Die idiomatische Fassung erhält den klaren Aufforderungscharakter, ohne den Sinn auszuweiten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe imperativische Struktur und das abschließende Semikolon des überlieferten Verssegments bleiben erhalten; „untätig“ vermeidet sowohl altertümliches „müßig“ als auch das wertendere „faul“.
