lexical_decisions:
- source_word: δόξασον
  choice: Ehre
  rationale: Der Aoristimperativ von δοξάζω fordert dazu auf, Ehre bzw. Anerkennung zu erweisen. „Ehre“ ist hier im Deutschen natürlicher als „Verherrliche“, ohne den Grundgedanken des Ehrens oder Rühmens aufzugeben.
- source_word: χεῖρα
  choice: die Hand
  rationale: χείρ bedeutet unmittelbar „Hand“. Der bestimmte Artikel wird für eine natürliche deutsche Verbindung mit „dem rechten Arm“ ergänzt.
- source_word: βραχίονα
  choice: Arm
  rationale: βραχίων bezeichnet den Arm und kann in biblischer Sprache zugleich Stärke oder Macht anklingen lassen. Eine anatomisch engere Wiedergabe wie „Unterarm“ wäre hier unangemessen.
- source_word: δεξιόν
  choice: rechten
  rationale: Das maskuline Akkusativadjektiv stimmt mit βραχίονα überein und wird daher als „rechten“ wiedergegeben. Mögliche symbolische Bezüge auf Stärke oder Macht werden nicht ausdrücklich in den Text eingetragen.
theological_decisions:
- issue: Unsicherheit des Ausgangstextes wegen der Kennzeichnung als erhebliche Abweichung und der nur als Teilsatz überlieferten Vorlage
  choice: Den vorgegebenen griechischen Wortlaut unmittelbar übersetzen und keine fehlende Umgebung ergänzen
  alternative: Einen vollständigeren Vers aus anderen Ausgaben oder Übersetzungen rekonstruieren
  rationale: Die bereitgestellte griechische Quelle enthält nur die Wendung „δόξασον χεῖρα καὶ βραχίονα δεξιόν“ und ist als erhebliche Abweichung gekennzeichnet. Eine Ergänzung würde nicht belegten Wortlaut in den Haupttext einführen.
translation_notes:
  register: Knappe, würdevolle Standardsprache. Der fragmentarische Charakter der Vorlage bleibt sichtbar; die deutsche Grammatik wird durch die üblichen bestimmten Artikel geglättet.
