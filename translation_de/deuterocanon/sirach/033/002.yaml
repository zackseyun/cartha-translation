base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/033/002.yaml
  text: One who hates instruction will not become wise[b][a], and he is tossed about in a storm like a ship.
translation:
  language: de
  text: Wer Weisung[a] hasst, wird nicht weise und schwankt im Sturm wie ein Schiff.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Lehre“, „Unterweisung“ oder „Gesetz“. Das hebräische Wort תורה kann dieses Bedeutungsspektrum umfassen.'
    reason: lexical_alternative
  - marker: b
    text: Die in den Quellen mitgelieferte griechische Parallelzeile bietet an dieser Stelle einen völlig anderen Wortlaut. Übersetzt wird hier der in sich stimmige hebräische Text.
    reason: textual_variant
lexical_decisions:
- source_word: שׂוֹנֵא
  choice: wer … hasst
  rationale: Das substantivisch gebrauchte Partizip bezeichnet einen Menschentyp. Die deutsche Relativkonstruktion klingt natürlich und bewahrt die starke Bedeutung aktiver Ablehnung.
- source_word: תוֹרָה
  choice: Weisung
  rationale: Im Weisheitskontext kann תורה Unterweisung oder Lehre bezeichnen und zugleich an das Gesetz Gottes anklingen. „Weisung“ hält dieses Bedeutungsspektrum besser offen als das enger wirkende „Gesetz“.
- source_word: יֶחְכַּם
  choice: wird nicht weise
  rationale: Die Imperfektform bezeichnet hier das ausbleibende Erlangen von Weisheit. Die knappe deutsche Formulierung gibt Ergebnis und Entwicklung wieder, ohne unnötig auszudeuten.
- source_word: מִתְמוֹטֵט
  choice: schwankt
  rationale: Die Form beschreibt Instabilität beziehungsweise ein Ins-Wanken-Geraten. „Schwankt“ fügt sich prägnant in das Bild eines Schiffes im Sturm; „wird hin und her geworfen“ wäre anschaulicher, aber stärker interpretierend.
- source_word: בְּמִסְעָר
  choice: im Sturm
  rationale: Die Präposition und das Substantiv bezeichnen die Lage innerhalb eines Sturms; die Wiedergabe ist unmittelbar und idiomatisch.
- source_word: כָּאֳנִיָּה
  choice: wie ein Schiff
  rationale: Die Vergleichspartikel und das Substantiv ergeben einen klaren Vergleich. „Schiff“ entspricht der Bildgröße und dem würdevollen Register.
theological_decisions:
- issue: Bedeutung von תורה im Weisheitskontext
  choice: Weisung
  alternative: Gesetz; Lehre; Unterweisung
  rationale: Der Spruch steht im Weisheitskontext, doch תורה kann zugleich göttliche beziehungsweise gesetzliche Weisung bezeichnen. „Weisung“ bewahrt diese Spannung; die Alternativen werden in einer Fußnote genannt.
- issue: Stark abweichende griechische Parallelzeile
  choice: Dem kohärenten, als verlässlich eingestuften hebräischen Text folgen
  alternative: Die angeführte griechische Zeile zugrunde legen oder den hebräischen Wortlaut nach ihr ändern
  rationale: Die mitgelieferte griechische Zeile („Blicke hin und lege deine Furcht auf alle Völker“) entspricht inhaltlich nicht dem hebräischen Vers. Sie kann daher weder dessen Lesart bestätigen noch die Übersetzung steuern. Die Abweichung wird transparent vermerkt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit knapper, sprichwortartiger Satzform. „Weisung“ wahrt die weisheitliche und mögliche gesetzliche Resonanz; „schwankt“ erhält das Schiff-Sturm-Bild ohne zusätzliche Ausschmückung.
