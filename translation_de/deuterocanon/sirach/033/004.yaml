  yaml_path: translation/deuterocanon/sirach/033/004.yaml
  text: Just as you were sanctified among us before them[a], so also be magnified among them before us[b];
translation:
  language: de
  text: Wie du vor ihren Augen unter uns als heilig erwiesen wurdest[a], so mögest du vor unseren Augen unter ihnen groß gemacht werden[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „geheiligt wurdest“. Bei Gott bezeichnet die griechische Passivform, dass er als heilig erkannt oder erwiesen wird, nicht dass er erst heilig wird.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „so möge deine Größe vor unseren Augen unter ihnen sichtbar werden“. Die griechische Verbform drückt einen Wunsch oder eine Bitte aus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥσπερ … οὕτως
  choice: Wie … so
  rationale: Die korrelative Vergleichsstruktur des Griechischen wird in natürlichem, klarem Deutsch unmittelbar wiedergegeben.
- source_word: ἐνώπιον αὐτῶν
  choice: vor ihren Augen
  rationale: Die Wendung bezeichnet Gegenwart oder Wahrnehmung. „Vor ihren Augen“ macht den Aspekt des Sichtbarwerdens deutlich und bleibt parallel zu ἐναντίον ἡμῶν.
- source_word: ἡγιάσθης
  choice: als heilig erwiesen wurdest
  rationale: Der Aorist Passiv von ἁγιάζω bedeutet bei Gott nicht, dass er erst heilig gemacht wurde, sondern dass seine Heiligkeit sichtbar oder anerkannt wurde. Die passive Form und der biblische Aussagegehalt bleiben erhalten.
- source_word: ἐν ἡμῖν
  choice: unter uns
  rationale: ἐν bezeichnet hier den Bereich einer Gemeinschaft; „unter uns“ ist im Deutschen natürlicher als „in uns“ und vermeidet eine unbeabsichtigte Verinnerlichung.
- source_word: ἐναντίον ἡμῶν
  choice: vor unseren Augen
  rationale: Die Formulierung wahrt die semantische und rhetorische Entsprechung zu ἐνώπιον αὐτῶν.
- source_word: μεγαλυνθείης
  choice: mögest du … als groß erwiesen werden
  rationale: Der passive Optativ drückt einen Gebetswunsch aus. „Mögest du“ gibt diesen Modus ausdrücklich wieder; „als groß erwiesen werden“ bewahrt den Bezug auf Gottes offenbar werdende Größe, ohne vorschnell mit „verherrlicht“ zu deuten.
- source_word: ἐν αὐτοῖς
  choice: unter ihnen
  rationale: Die Übersetzung entspricht parallel dem griechischen ἐν ἡμῖν und bezeichnet die Manifestation innerhalb einer Personengruppe.
theological_decisions:
- issue: Heiligung Gottes in ἡγιάσθης
  choice: „als heilig erwiesen wurdest“
  alternative: „geheiligt wurdest“
  rationale: Von Gott ausgesagt bezeichnet das Passiv nicht den Erwerb von Heiligkeit, sondern ihre Anerkennung oder Offenbarung. Die gewählte Formulierung gibt den idiomatischen Sinn wieder, ohne die passive Gestalt aufzugeben.
- issue: Gebetscharakter von μεγαλυνθείης
  choice: „mögest du … als groß erwiesen werden“
  alternative: „werde … groß gemacht“ oder „werde verherrlicht“
  rationale: Der Optativ wird als Wunsch beziehungsweise Bitte kenntlich gemacht. Zugleich bleibt „groß“ lexikalisch näher an μεγαλύνω als das theologisch stärker geprägte „verherrlichen“.
translation_notes:
  register: Modernes, würdevolles Gebetsdeutsch. Die symmetrische Satzform des Griechischen bleibt erhalten; „vor ihren/unseren Augen“ und „unter uns/ihnen“ bilden die beiden parallelen Gegensatzpaare. Die ungewöhnlichen Aussagen über Gottes Heiligkeit und Größe werden verständlich formuliert, ohne ihre theologische Spannung einzuebnen.
