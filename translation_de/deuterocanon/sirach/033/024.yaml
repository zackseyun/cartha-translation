  text: On the day your life's days come to an end[a], and at the time of death, distribute your inheritance.
translation:
  language: de
  text: Am Tag, an dem die Tage deines Lebens zu Ende gehen[a], und zur Zeit deines Todes verteile dein Erbe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »am Tag der Vollendung der Tage deines Lebens«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἡμέρᾳ
  choice: An dem Tag
  rationale: Natürliche temporale Wiedergabe von ἐν mit dem Dativ; der bestimmte Zeitpunkt bleibt erhalten.
- source_word: συντελείας
  choice: zu Ende gehen
  rationale: Das Substantiv bezeichnet Vollendung beziehungsweise Abschluss. Die verbale Formulierung ist im Deutschen natürlich und wahrt den Sinn.
- source_word: ἡμερῶν ζωῆς σου
  choice: die Tage deines Lebens
  rationale: Die konkrete Pluralform des Griechischen wird beibehalten und nicht zum bloßen Ausdruck »dein Leben« verkürzt.
- source_word: καιρῷ
  choice: Zeit
  rationale: καιρός bezeichnet hier den maßgeblichen Zeitpunkt; »Zeit« ist im parallelen Satzbau klar und idiomatisch.
- source_word: τελευτῆς
  choice: deines Todes
  rationale: τελευτή meint im gegebenen Zusammenhang konkret das Lebensende beziehungsweise den Tod. Das Possessivpronomen macht den im Kontext liegenden Bezug im Deutschen natürlich deutlich.
- source_word: διάδος
  choice: verteile
  rationale: Der Imperativ von διαδίδωμι fordert zum Austeilen beziehungsweise Zuweisen auf; »verteile« passt zum Erbe und erhält die Handlungsaufforderung.
- source_word: κληρονομίαν
  choice: Erbe
  rationale: »Erbe« ist die direkte, allgemein verständliche Bezeichnung für den zu übertragenden Besitz.
