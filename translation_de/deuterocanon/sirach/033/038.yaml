  yaml_path: translation/deuterocanon/sirach/033/038.yaml
  text: For there is a friend in his own time[a], and he will certainly not remain in the day of your distress.
translation:
  language: de
  text: Denn es gibt einen Freund zu seiner Zeit[a], doch am Tag deiner Bedrängnis wird er gewiss nicht bleiben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „zu seiner Zeit“. Möglich ist auch: „für eine gewisse Zeit“ oder „wenn es ihm passt“. Der Zusammenhang kann an eine Freundschaft denken lassen, die nur unter günstigen Umständen besteht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: φίλος
  choice: Freund
  rationale: Die gewöhnliche Bedeutung ist ein persönlicher Freund oder Gefährte; „Freund“ ist hier die natürliche und direkte deutsche Entsprechung.
- source_word: ἐν καιρῷ αὐτοῦ
  choice: solange es ihm gelegen kommt
  rationale: καιρός bezeichnet einen passenden oder günstigen Zeitpunkt; mit αὐτοῦ weist die Wendung auf die für den Freund passende Gelegenheit hin. Die gewählte Formulierung macht die im Zusammenhang erkennbare bedingte Freundschaft verständlich, während die Fußnote die wörtlicheren Deutungen bewahrt.
- source_word: οὐ μὴ παραμείνῃ
  choice: wird er ganz gewiss nicht … bleiben
  rationale: οὐ μή mit dem Konjunktiv drückt eine nachdrückliche Verneinung mit Zukunftsbezug aus; „ganz gewiss nicht“ gibt diese Verstärkung wieder.
- source_word: ἐν ἡμέρᾳ θλίψεώς σου
  choice: am Tag deiner Bedrängnis
  rationale: Die Formulierung bewahrt das Zeitbild des griechischen Textes; „Bedrängnis“ gibt die Schwere von θλῖψις in würdigem, verständlichem Deutsch wieder.
- source_word: παραμείνῃ
  choice: bei dir bleiben
  rationale: Das Verb bedeutet fortdauern oder weiterhin bleiben. „Bei dir bleiben“ ist im Zusammenhang einer Freundschaft natürlich und verdeutlicht die persönliche Treue, ohne den Sinn wesentlich zu erweitern.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die sprichwortartige Gegenüberstellung zwischen günstiger Zeit und dem Tag der Bedrängnis bleibt erhalten; die nachdrückliche griechische Verneinung wird ausdrücklich wiedergegeben.
