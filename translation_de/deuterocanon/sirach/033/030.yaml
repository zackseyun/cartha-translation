  yaml_path: translation/deuterocanon/sirach/033/030.yaml
  text: Set him to work as is fitting for him[a], and if he does not obey, make his fetters heavy; but do not be excessive with any flesh, and do nothing without judgment.
translation:
  language: de
  text: Setze ihn zu Arbeiten ein, wie es für ihn angemessen ist; und wenn er nicht gehorcht, mach seine Fußfesseln schwer. Doch überschreite bei keinem Menschen[a] das Maß, und tu nichts ohne Urteil.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Überschreite bei allem Fleisch nicht das Maß“; gemeint ist: bei keinem Menschen.'
    reason: Die Fußnote gibt die griechische Quantifizierung von ἐν πάσῃ σαρκί zusammen mit der vorangehenden Verneinung korrekt wieder und erläutert die idiomatische Haupttextfassung.
lexical_decisions:
- source_word: εἰς ἔργα κατάστησον
  choice: Setze ihn zu Arbeiten ein
  rationale: καθίστημι bezeichnet hier das Einsetzen oder Bestellen, ἔργα Arbeiten beziehungsweise Aufgaben. Die Formulierung ist direkt und im modernen Deutschen verständlich.
- source_word: καθὼς πρέπει αὐτῷ
  choice: wie es für ihn angemessen ist
  rationale: πρέπει bezeichnet das, was sich schickt oder passend ist; „angemessen“ bewahrt den Gedanken der Eignung, ohne ihn näher festzulegen.
- source_word: κἂν μὴ πειθαρχῇ
  choice: und wenn er nicht gehorcht
  rationale: πειθαρχέω bedeutet einer Autorität oder Anordnung gehorchen. Das Griechische nennt „Zucht“ oder „Unterweisung“ nicht ausdrücklich.
- source_word: βάρυνον τὰς πέδας αὐτοῦ
  choice: mach seine Fußfesseln schwer
  rationale: πέδαι sind insbesondere Fesseln an den Füßen; βαρύνω bedeutet wörtlich „schwer machen“. Die harte Bildsprache wird nicht abgeschwächt.
- source_word: μὴ περισσεύσῃς
  choice: überschreite ... nicht das Maß
  rationale: περισσεύω bezeichnet ein Übermaß oder Überschreiten. Die deutsche Wendung gibt das Verbot idiomatisch wieder, ohne die Art des Übermaßes festzulegen.
- source_word: ἐν πάσῃ σαρκί
  choice: bei keinem Menschen[a]
  rationale: σάρξ („Fleisch“) steht hier idiomatisch für einen Menschen. Die verständliche Wiedergabe steht im Haupttext; der konkrete griechische Ausdruck bleibt in der Fußnote sichtbar.
- source_word: ἄνευ κρίσεως
  choice: ohne Urteil
  rationale: κρίσις kann Urteil, Beurteilung oder Entscheidungsvermögen bezeichnen. „Urteil“ erhält die knappe Form und die mögliche rechtliche wie ethische Bedeutung.
- source_word: μὴ ποιήσῃς μηδέν
  choice: tu nichts
  rationale: Die griechische Verneinung formuliert ein uneingeschränktes Verbot; „tu nichts“ entspricht dem knapp und natürlich.
theological_decisions:
- issue: Ethisch schwierige Sprache über Zwangsarbeit und Fesselung
  choice: Die unmittelbaren Anweisungen zu Arbeit, Gehorsam und Fußfesseln bleiben ungemildert stehen.
  alternative: Die Aussagen durch Begriffe wie „Dienst“, „Erziehung“ oder „Zurückhaltung“ abzuschwächen.
  rationale: Der griechische Text spricht ausdrücklich von Arbeiten und Fesseln. Eine Übersetzung soll diese historisch und ethisch schwierige soziale Wirklichkeit transparent wiedergeben.
- issue: Bedeutung von ἐν πάσῃ σαρκί
  choice: Im Haupttext idiomatisch „bei keinem Menschen“, mit dem wörtlichen Ausdruck in einer Fußnote.
  alternative: Im Haupttext wörtlich „bei keinem Fleisch“.
  rationale: Die Wendung bezeichnet hier Menschen, während die Fußnote das anthropologisch konkrete Wort σάρξ sichtbar hält. So bleibt die Spannung zwischen strenger Züchtigung und dem Verbot des Übermaßes erhalten.
- issue: Bedeutungsumfang von κρίσις
  choice: „Urteil“ bleibt ohne erklärenden Zusatz stehen.
  alternative: „gerechtes Urteil“, „reifliche Überlegung“ oder „Unterscheidungsvermögen“.
  rationale: Das Griechische legt nicht eindeutig fest, ob ein förmliches Urteil, eine besonnene Beurteilung oder allgemeines Entscheidungsvermögen gemeint ist; die Übersetzung bewahrt diese Offenheit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter imperativischer Rede. Die drastische Sprache des Ausgangstextes wird nicht euphemistisch abgeschwächt. „Mach“ und „tu“ sind gegenwärtige, natürliche Imperativformen; „Urteil“ wahrt die Kürze und Mehrdeutigkeit des Griechischen.
