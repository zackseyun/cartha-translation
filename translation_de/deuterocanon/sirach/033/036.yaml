  text: Do not seek counsel from every man[b][a], but keep one counselor out of a thousand.
translation:
  language: de
  text: Berate dich nicht mit jedem Menschen,[a] sondern habe einen von tausend als Ratgeber.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Zieh nicht jeden Menschen zu Rate.“ Das griechische Verb kann sowohl „sich beraten“ als auch „jemanden um Rat fragen“ bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: „Einen von tausend“ ist eine sprichwörtliche Übertreibung und mahnt dazu, einen Ratgeber äußerst sorgfältig auszuwählen.
    reason: cultural_note
lexical_decisions:
- source_word: μὴ
  choice: nicht
  rationale: Die Verneinung bildet zusammen mit dem Imperativ eine klare Aufforderung, etwas zu unterlassen.
- source_word: ἐν παντὶ ἀνθρώπῳ
  choice: mit jedem Menschen
  rationale: Die Präposition ἐν bezeichnet hier in Verbindung mit συμβούλευε die Person, mit der man sich berät. „Jedem Menschen“ gibt den generischen Singular im heutigen Standarddeutsch natürlich wieder.
- source_word: συμβούλευε
  choice: Berate dich
  rationale: Das Verb kann das Einholen oder Austauschen von Rat bezeichnen. Die reflexive deutsche Wendung bewahrt den Beratungssinn, ohne schon eine bestimmte Richtung des Ratgebens festzulegen.
- source_word: ἀλλὰ
  choice: sondern
  rationale: Nach der verneinten ersten Aufforderung drückt „sondern“ den adversativen Gegensatz im Deutschen präzise aus.
- source_word: ἕνα ἐκ χιλίων
  choice: einen von tausend
  rationale: Die zahlenmäßige Formulierung bleibt eng am Griechischen und bewahrt die sprichwörtliche Zuspitzung.
- source_word: σύμβουλον
  choice: als Ratgeber
  rationale: „Ratgeber“ bezeichnet eindeutig eine Person, die Rat gibt, und erhält die Wortverbindung zum vorausgehenden Verb.
- source_word: ἔχε
  choice: habe
  rationale: Der Imperativ bezeichnet Besitz beziehungsweise eine bestehende Beziehung zu einem Ratgeber. Das schlichte „habe“ vermeidet die zusätzliche Vorstellung einer ausdrücklichen Auswahl oder dauerhaften Bindung.
