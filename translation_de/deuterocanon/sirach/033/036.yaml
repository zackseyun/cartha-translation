  naturalness: Der Satz ist idiomatisches, modernes Standarddeutsch und hat die knappe, paränetische Form eines Weisheitsspruchs. „Mit jedem Menschen“ ist hier natürlich und schließt niemanden gegenüber dem generisch verwendeten griechischen ἀνθρώπῳ aus.
  terminology: „Ratgeber“ ist für σύμβουλος präzise und verständlich. Das wiederkehrende Wortfeld von Beratung und Rat bleibt erkennbar. Die Fußnoten erläutern die lexikalische Alternative beziehungsweise die Hyperbel angemessen, ohne den Text auslegend zu überfrachten.
