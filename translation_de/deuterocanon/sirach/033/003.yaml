  text: A discerning man understands the word of Yahweh[b][a], and his instruction is like the Urim in the breastpiece.
translation:
  language: de
  text: Ein einsichtiger Mann versteht das Wort Yahwehs,[a] und seine Weisung ist wie die Urim in der Brusttasche.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der erhaltene hebräische Text dieses Verses weicht stark von der griechischen Überlieferung ab. Diese Übersetzung folgt dem hebräischen Text; der griechische Text lautet sinngemäß: „Erhebe deine Hand gegen fremde Völker, damit sie deine Macht sehen.“'
    reason: textual_variant
  - marker: b
    text: 'Oder: „und seine Weisung ist wie die Urim in der Brusttasche“, wobei „seine“ auf Yahweh statt auf den einsichtigen Mann bezogen wird.'
    reason: alternative_reading
lexical_decisions:
- source_word: אִישׁ נָבוֹן
  choice: ein einsichtiger Mann
  rationale: Die grammatisch maskuline Einzahl und die typische Gestalt der Weisheitsliteratur bleiben erhalten. „Einsichtig“ bezeichnet sowohl geistiges Verstehen als auch urteilsfähige Weisheit.
- source_word: יָבִין
  choice: versteht
  rationale: Die schlichte, natürliche Wiedergabe bringt das rechte Erfassen zum Ausdruck und vermeidet eine unnötige Wiederholung von „einsichtig“.
- source_word: דְּבַר יְהֹוָה
  choice: das Wort Yahwehs
  rationale: דָּבָר bezeichnet hier am ehesten die göttliche Rede oder Mitteilung; der im hebräischen Text ausdrücklich stehende Gottesname wird als „Yahweh“ wiedergegeben.
- source_word: וְתוֹרָתוֹ
  choice: und seine Weisung
  rationale: „Weisung“ bewahrt den lehrenden Sinn von תּוֹרָה, ohne den Ausdruck auf Gesetzesbestimmungen zu verengen. Das Suffix wird im Haupttext syntaktisch naheliegend auf den einsichtigen Mann bezogen; die mögliche Beziehung auf Yahweh wird in einer Fußnote erhalten.
- source_word: כְּאוּרִים
  choice: wie die Urim
  rationale: „Urim“ ist die etablierte Bezeichnung für die priesterlichen Los- beziehungsweise Orakelzeichen. Eine Übersetzung als „Lichter“ würde den kultischen Fachbegriff verdecken.
- source_word: בַּחֹשֶׁן
  choice: in der Brusttasche
  rationale: חֹשֶׁן bezeichnet das am priesterlichen Efod getragene Behältnis, in dem sich die Urim befanden. „Brusttasche“ ist verständlich und vermeidet die irreführende Vorstellung eines Rüstungsteils.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהֹוָה
  choice: Yahweh
  alternative: der HERR; Jehova
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. „Yahweh“ gibt den persönlichen Bundesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bezug des Suffixes in וְתוֹרָתוֹ
  choice: seine Weisung, auf den einsichtigen Mann bezogen
  alternative: seine Weisung beziehungsweise sein Gesetz, auf Yahweh bezogen
  rationale: Der unmittelbar vorausgehende „einsichtige Mann“ ist syntaktisch der naheliegende Bezug. Da auch Yahweh als Bezug möglich ist und daraus ein theologisch anders akzentuierter Sinn entsteht, wird die Alternative nicht aufgelöst, sondern in der Fußnote genannt.
- issue: Stark abweichende griechische Parallelüberlieferung
  choice: dem erhaltenen hebräischen Text folgen
  alternative: 'dem griechischen Text folgen: „Erhebe deine Hand gegen fremde Völker, damit sie deine Macht sehen“'
  rationale: Für diesen Vers bietet der angegebene hebräische Sirach-Zeuge einen zusammenhängenden, verständlichen Text, während der griechische Paralleltext inhaltlich völlig anders lautet. Die Übersetzung folgt dem als primär vorgegebenen hebräischen Zeugen und dokumentiert die Abweichung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der parallele Satzbau und das Bild aus dem priesterlichen Kult bleiben erhalten. Das im Hebräischen ausgelassene Verb des zweiten Satzglieds wird im Deutschen durch „ist“ ergänzt. „Brusttasche“ ist gegenüber dem altertümlichen oder als Rüstung missverständlichen „Brustschild“ bevorzugt.
