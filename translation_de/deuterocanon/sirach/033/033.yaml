  text: Fodder and a rod and loads are for a donkey[a]; bread and discipline and work are for a servant.
translation:
  language: de
  text: Futter, Stock und Lasten für einen Esel; Brot, Erziehung und Arbeit für einen Haussklaven.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Hausdiener“. Das griechische οἰκέτης bezeichnet einen Sklaven oder Diener im Haushalt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: χορτάσματα
  choice: Futter
  rationale: Der Plural bezeichnet Futtermittel für Tiere. Das deutsche Kollektivwort „Futter“ ist hier natürlich und bewahrt das konkrete Bild.
- source_word: ῥάβδος
  choice: Stock
  rationale: Im Zusammenhang mit dem Lasttier bezeichnet das Wort ein Mittel zum Antreiben oder Zurechtweisen. „Stock“ gibt dies verständlich wieder, ohne die im Deutschen stärker rechtlich oder symbolisch geprägten Nebenbedeutungen von „Rute“ beziehungsweise „Stab“ aufzudrängen.
- source_word: φορτία
  choice: Lasten
  rationale: Gemeint sind die von einem Lasttier getragenen Güter. „Lasten“ ist konkret, idiomatisch und erhält zugleich die Schwere des Ausdrucks.
- source_word: ὄνῳ
  choice: für einen Esel
  rationale: Der Dativ steht in der knappen sprichwortartigen Reihung als Zuordnung. „Für einen Esel“ bildet diese Struktur im Deutschen natürlich ab.
- source_word: ἄρτος
  choice: Brot
  rationale: Das griechische Wort nennt ausdrücklich Brot. Die konkrete Bezeichnung wird beibehalten, statt sie zum allgemeineren „Nahrung“ zu erweitern.
- source_word: παιδεία
  choice: Erziehung
  rationale: παιδεία umfasst Anleitung, Einübung und korrigierende Disziplin. „Erziehung“ bewahrt diese formative Breite besser als das rein strafend klingende „Züchtigung“; der kontrollierende Kontext bleibt durch die Parallelstellung mit „Stock“ erkennbar.
- source_word: ἔργον
  choice: Arbeit
  rationale: Die schlichte, umfassende Wiedergabe entspricht dem allgemeinen griechischen Ausdruck für Arbeit beziehungsweise Tätigkeit.
- source_word: οἰκέτῃ
  choice: Haussklave
  rationale: οἰκέτης bezeichnet einen Sklaven oder Diener des Haushalts. „Haussklave“ macht sowohl den rechtlich-sozialen Status als auch den häuslichen Bezug sichtbar und vermeidet die beschönigende Unbestimmtheit von „Diener“.
theological_decisions:
- issue: Wiedergabe von οἰκέτῃ im Kontext häuslicher Unterordnung
  choice: Haussklave
  alternative: Hausdiener; Knecht
  rationale: Der Vers ordnet einem abhängigen Haushaltsarbeiter Versorgung, Erziehung und Arbeit zu. Die Übersetzung soll den in οἰκέτης angelegten Status eines versklavten Haushaltsangehörigen nicht abschwächen. Zugleich wird die mögliche breitere Wiedergabe als „Hausdiener“ in der Fußnote offengelegt.
- issue: Bedeutungsumfang von παιδεία
  choice: Erziehung
  alternative: Disziplin; Züchtigung; Unterweisung
  rationale: Der Ausdruck kann Bildung, Einübung und korrigierende Behandlung umfassen. „Erziehung“ hält diese Spannung offen, während „Züchtigung“ den Sinn auf körperliche Strafe und „Unterweisung“ ihn auf Belehrung verengen würde.
translation_notes:
  register: Knappe, sprichwortartige Nominalreihung mit parallelem Satzbau. Die Sprache ist modern und klar, ohne die soziale Härte des antiken Haushaltsverhältnisses zu beschönigen.
