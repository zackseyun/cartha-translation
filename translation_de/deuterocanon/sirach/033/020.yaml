base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/033/020.yaml
  text: To son and wife[a], to brother and friend, do not give authority over yourself during your lifetime; and do not give your possessions to another[c][b], lest you regret it and have to plead for them.
translation:
  language: de
  text: Gib deinem Sohn und deiner Frau, deinem Bruder und deinem Freund zu deinen Lebzeiten keine Macht über dich[a]; und gib dein Vermögen keinem anderen[b], damit du es nicht bereust und darum bitten musst.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „keine Verfügungsgewalt über dich“. Das griechische ἐξουσία kann Macht, Vollmacht oder Verfügungsgewalt bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „deinen Besitz“ beziehungsweise „dein Geld“. Das griechische χρήματα kann Vermögen, Güter, Besitz oder Geld bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlicher: „damit du es nicht bereust und ihretwegen in Not bist“. Gemeint sein kann, dass du nach der Weggabe deines Vermögens darum bitten musst, es zurückzuerhalten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: υἱῷ καὶ γυναικί, ἀδελφῷ καὶ φίλῳ
  choice: deinem Sohn und deiner Frau, deinem Bruder und deinem Freund
  rationale: Die maskulinen Einzelbezeichnungen werden genau als „Sohn“ und „Bruder“ wiedergegeben; γυνή bezeichnet in dieser Aufzählung familiärer und persönlicher Beziehungen am natürlichsten die Ehefrau, φίλος den Freund. Die Possessivformen ergeben sich im Deutschen aus der direkten Anrede und machen die Beziehungen verständlich.
- source_word: μὴ δῷς ἐξουσίαν ἐπὶ σέ
  choice: gib ... keine Macht über dich
  rationale: ἐξουσία kann Macht, Vollmacht oder Verfügungsgewalt bezeichnen. „Macht über dich“ bewahrt die Weite und Direktheit des griechischen Ausdrucks, ohne ihn auf einen bestimmten rechtlichen Vorgang zu verengen.
- source_word: ἐν ζωῇ σου
  choice: zu deinen Lebzeiten
  rationale: Die Wendung bezeichnet den zeitlichen Rahmen der Mahnung; „zu deinen Lebzeiten“ ist idiomatisches, klares Deutsch.
- source_word: τὰ χρήματά σου
  choice: dein Vermögen
  rationale: χρήματα kann Geld, Güter oder Besitz insgesamt meinen. „Vermögen“ bezeichnet hier die Gesamtheit der übertragbaren materiellen Mittel, ohne den Sinn auf Bargeld einzuengen.
- source_word: ἑτέρῳ
  choice: keinem anderen
  rationale: Wegen der vorausgehenden Verneinung wird der unbestimmte Dativ im Deutschen natürlich mit „keinem anderen“ wiedergegeben.
- source_word: ἵνα μὴ μεταμεληθεὶς δέῃ περὶ αὐτῶν
  choice: damit du es nicht bereust und darum bitten musst
  rationale: μεταμέλομαι bezeichnet nachträgliches Bereuen. Die Schlusswendung beschreibt die drohende Abhängigkeit hinsichtlich des weggegebenen Vermögens; „darum bitten müssen“ gibt diesen praktischen Sinn wieder, während die Fußnote den offeneren griechischen Wortlaut nennt.
