  text: For idleness has taught much evil.
translation:
  language: de
  text: Denn Untätigkeit hat viel Böses gelehrt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πολλὴν
  choice: viel
  rationale: Das Adjektiv bestimmt das singularische κακίαν quantitativ; „viel Böses“ gibt diese Mengenangabe im Deutschen natürlich wieder.
- source_word: γὰρ
  choice: denn
  rationale: Die Konjunktion kennzeichnet den Satz als Begründung für die vorausgehende Mahnung; „denn“ bewahrt diesen erklärenden Zusammenhang.
- source_word: κακίαν
  choice: Böses
  rationale: κακία bezeichnet hier allgemein moralisch Schlechtes oder Bosheit. „Böses“ hält die Aussage weit und vermeidet eine Verengung auf Arglist oder ein bestimmtes Laster.
- source_word: ἐδίδαξεν
  choice: hat … gelehrt
  rationale: Die Wiedergabe bewahrt sowohl den Aorist als auch das Bild der Untätigkeit als Lehrmeisterin des Bösen; eine Übersetzung mit „hervorgebracht“ würde dieses Bild auflösen.
- source_word: ἡ ἀργία
  choice: Untätigkeit
  rationale: ἀργία bezeichnet das Unbeschäftigtsein beziehungsweise die Untätigkeit. „Untätigkeit“ ist im heutigen Standarddeutsch klar und weniger vorverurteilend als „Faulheit“ oder „Trägheit“.
theological_decisions: []
translation_notes:
  register: Knapp, sprichwortartig und würdevoll. Die Personifikation der Untätigkeit als Lehrmeisterin bleibt erhalten; der Satzbau ist in modernem Standarddeutsch verständlich.
