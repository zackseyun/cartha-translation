  text: And there is a friend who changes into enmity[b][a], and he will expose a quarrel to your disgrace.
translation:
  language: de
  text: Und es gibt einen Freund, der in Feindschaft umschlägt und einen Streit zu deiner Schande aufdecken wird.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und einen Streit als Vorwurf gegen dich enthüllen wird“. Die knappe griechische Wendung kann entweder die Schande betonen, die der Streit dir bringt, oder den Streit selbst als Vorwurf gegen dich bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: φίλος
  choice: Freund
  rationale: Das gewöhnliche Beziehungswort bezeichnet hier einen persönlichen Freund; „Freund“ ist im Deutschen unmittelbar und kontextgerecht.
- source_word: μεταβαλλόμενος εἰς ἔχθραν
  choice: der in Feindschaft umschlägt
  rationale: Die Formulierung bewahrt den Wechsel des Zustands und gibt ἔχθρα als abstraktes Substantiv („Feindschaft“) wieder, statt daraus stillschweigend „Feind“ zu machen.
- source_word: μάχην
  choice: einen Streit
  rationale: Im sozialen Zusammenhang ist ein Streit oder Konflikt gemeint, nicht notwendig ein körperlicher Kampf.
- source_word: ἀποκαλύψει
  choice: aufdeckt
  rationale: Das Verb bezeichnet das Enthüllen oder Offenlegen; „aufdeckt“ trägt im feindseligen Zusammenhang den Gedanken einer bloßstellenden Veröffentlichung.
- source_word: ὀνειδισμοῦ σου
  choice: zu deiner Schande
  rationale: Die knappe Genitivverbindung verbindet den offengelegten Streit mit Schmach oder Vorwurf für die angesprochene Person. Die gewählte Fassung ist idiomatisch, ohne die alternative syntaktische Zuordnung zu verschweigen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „In Feindschaft umschlagen“ wahrt die abstrakte Ausdrucksweise des Griechischen und bleibt zugleich verständlich; die Mehrdeutigkeit der Schlusswendung wird in der Fußnote erhalten.
