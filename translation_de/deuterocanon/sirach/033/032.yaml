  source_fidelity: 'Der Haupttext gibt die zeitlichen Angaben und den Imperativ insgesamt treffend wieder. „übergebe das Erbe“ ist jedoch sachlich und syntaktisch weniger passend: κληρονομία bezeichnet das zu hinterlassende Erbe bzw. den Erbanteil, während „übergeben“ eine tatsächliche Übergabe nahelegt. Das Verb διδός ist schlicht mit „gib“ wiederzugeben. Der unbestimmte Artikel bildet die anarthrische griechische Form ohne unnötige Spezifizierung angemessener ab.'
  naturalness: „Am Tag, an dem die Tage deines Lebens zu Ende gehen“ ist verständlich und würdig, wenn auch bewusst leicht redundant entsprechend der Vorlage. „Gib ein Erbe“ ist im Deutschen weniger idiomatisch als „teile ein Erbe zu“; diese Formulierung bewahrt zugleich den Charakter einer Anweisung zur Erbregelung.
  terminology: „Tod“ für τελευτή ist im Kontext des Lebensendes gut vertretbar; die Fußnote wahrt die weitere Bedeutung „Ende“. „Erbe“ ist für κληρονομία der richtige konkrete Begriff. Die Fußnote a gibt die griechische Nominalfügung angemessen wieder.
