translation:
  language: de
  text: Am Tag, an dem die Tage deines Lebens zu Ende gehen[a], und zur Zeit des Todes[b] teile ein Erbe zu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „am Tag der Vollendung der Tage deines Lebens“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „zur Zeit des Endes“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἡμέρᾳ
  choice: Am Tag
  rationale: Die temporale Wendung mit ἐν und Dativ wird im Deutschen natürlich mit „am“ wiedergegeben und behält den bestimmten zeitlichen Bezug bei.
- source_word: συντελείας ἡμερῶν ζωῆς σου
  choice: an dem die Tage deines Lebens zu Ende gehen
  rationale: Die nominale griechische Fügung bezeichnet die Vollendung beziehungsweise das Ende der Lebenstage. Die verbale Umformung ist im Deutschen natürlich und bewahrt die Bedeutung sowie die auffällige Wiederholung von „Tag“ und „Tage“.
- source_word: ἐν καιρῷ τελευτῆς
  choice: zur Zeit des Todes
  rationale: καιρός bezeichnet hier den Zeitpunkt oder die Zeit; τελευτή kann „Ende“ oder im Zusammenhang mit dem Lebensende „Tod“ bedeuten. „Zur Zeit des Todes“ ist klar und kontextgerecht.
- source_word: διδὸς
  choice: übergib
  rationale: Der Imperativ von δίδωμι bedeutet grundsätzlich „gib“. Bei einem Erbe bezeichnet „übergib“ im Deutschen den gemeinten Vorgang natürlicher, ohne ihn als vorzeitige Schenkung oder als bestimmte rechtliche Form auszulegen.
- source_word: κληρονομίαν
  choice: das Erbe
  rationale: κληρονομία bezeichnet Erbe beziehungsweise Erbbesitz. Der bestimmte Artikel ist im Deutschen bei dem in diesem Zusammenhang vorausgesetzten Nachlass idiomatisch; der griechische fehlende Artikel erzwingt keine unbestimmte Wiedergabe.
theological_decisions:
- issue: Ob κληρονομίαν abstrakt als „Vermächtnis“ oder konkret als „Erbe“ wiederzugeben ist
  choice: das Erbe
  alternative: ein Vermächtnis
  rationale: „Erbe“ bewahrt den konkreten familiären und vermögensrechtlichen Sinn der Weisheitsanweisung und vermeidet die erweiterten, auch ideellen Bedeutungen von „Vermächtnis“.
- issue: Ob τελευτή ausschließlich als Tod oder allgemeiner als Ende wiederzugeben ist
  choice: Tod im Haupttext, „Ende“ als Fußnotenalternative
  alternative: Ende
  rationale: Im Zusammenhang mit der Vollendung der Lebenstage ist „Tod“ die naheliegende Bedeutung; die lexikalisch mögliche offenere Lesart „Ende“ wird nicht verschwiegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung von „Tag“ und „Tage“ bleibt als Merkmal der griechischen Formulierung erhalten; die schwerfällige Nominalkonstruktion wird im Haupttext behutsam verbalisiert.
