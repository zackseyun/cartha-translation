  text: When you acquire a friend[a], acquire him through testing, and do not quickly trust him.
translation:
  language: de
  text: Wenn du einen Freund gewinnst, gewinne ihn durch Erprobung[a] und vertraue ihm nicht vorschnell.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in einer Prüfung“ beziehungsweise „durch eine Prüfung“. Die griechische Wendung ἐν πειρασμῷ lässt mehrere eng verwandte Wiedergaben zu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κτήσῃ / κτῆσαι
  choice: gewinnst / gewinne
  rationale: κτάομαι bezeichnet das Erwerben oder Gewinnen. „Einen Freund gewinnen“ ist im Deutschen natürlich und bewahrt durch die Wiederholung die sprichwortartige Form des Griechischen.
- source_word: φίλον
  choice: einen Freund
  rationale: Das griechische Substantiv steht im maskulinen Singular; die Übersetzung gibt diese Form direkt wieder.
- source_word: ἐν πειρασμῷ
  choice: durch Erprobung
  rationale: πειρασμός kann Prüfung, Erprobung oder Versuchung bezeichnen. Im Zusammenhang geht es um die Bewährung der Verlässlichkeit eines Freundes; „durch Erprobung“ gibt diese Bedeutung wieder, ohne die Mehrdeutigkeit der Konstruktion ganz zu verdecken.
- source_word: μὴ ταχὺ
  choice: nicht vorschnell
  rationale: ταχύ warnt hier vor übereiltem Vertrauen. „Nicht vorschnell“ ist idiomatisches, modernes Deutsch.
- source_word: ἐμπιστεύσῃς αὐτῷ
  choice: vertraue ihm
  rationale: ἐμπιστεύω mit Dativ bedeutet, jemandem zu vertrauen oder Vertrauen zu schenken. Die knappe deutsche Fassung entspricht der griechischen Konstruktion.
theological_decisions:
- issue: Maskuliner Singular in der Weisheitsunterweisung
  choice: „einen Freund“ und „ihm“ beibehalten
  alternative: geschlechtsneutrale Wiedergabe wie „eine Person“ oder pluralisches „ihnen“
  rationale: Der griechische Text verwendet durchgehend den maskulinen Singular. Die deutsche Wiedergabe erhält diese grammatische und bildhafte Form, ohne darüber hinaus eine besondere Lehrmeinung abzuleiten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung von „gewinnen“ ist bewusst beibehalten, um die rhetorische Form des griechischen Textes zu wahren; „vorschnell“ klingt natürlicher als das wörtlichere „schnell“.
