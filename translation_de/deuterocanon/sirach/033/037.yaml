  source_fidelity: 'Die Übersetzung gibt die griechische Struktur und den Sinn zuverlässig wieder: κτάομαι wird bewusst zweimal mit „gewinnen“ wiederholt; φίλον bleibt maskuliner Singular; ἐν πειρασμῷ ist mit „durch Erprobung“ als Prüfung der Verlässlichkeit angemessen erfasst; und μὴ ταχὺ ἐμπιστεύσῃς αὐτῷ wird idiomatisch und vollständig als „vertraue ihm nicht vorschnell“ wiedergegeben.'
