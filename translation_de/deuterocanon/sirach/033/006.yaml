  text: For there is no God except you, Lord. Renew signs and alter wonders,
translation:
  language: de
  text: Denn es gibt keinen Gott außer dir, Herr. Erneuere Zeichen und verändere Wunder,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πλὴν σοῦ
  choice: außer dir
  rationale: Gibt den ausschließenden Sinn der griechischen Wendung knapp und natürlich wieder.
- source_word: ἐγκαίνισον
  choice: Erneuere
  rationale: Bewahrt den Imperativ und den Grundgedanken, etwas neu zu machen beziehungsweise erneut hervorzubringen.
- source_word: ἀλλοίωσον
  choice: verändere
  rationale: Entspricht dem offenen Sinn von ἀλλοιόω, ohne genauer festzulegen, auf welche Weise die Wunder anders werden sollen.
- source_word: θαυμάσια
  choice: Wunder
  rationale: Im Gebetskontext bezeichnet das Wort staunenerregende göttliche Taten; „Wunder“ ist die geläufige und würdevolle deutsche Wiedergabe.
theological_decisions:
- issue: Ausschließliche Einzigkeit Gottes
  choice: es gibt keinen Gott außer dir
  alternative: niemand ist Gott außer dir
  rationale: Die gewählte Fassung folgt der Existenzkonstruktion οὐκ ἔστι θεὸς und bewahrt die uneingeschränkte Aussage des griechischen Textes.
- issue: Verhältnis von Zeichen und Wundern
  choice: 'Zwei parallele Imperative werden beibehalten: „Erneuere … und verändere …“'
  alternative: „Tu neue Zeichen und wiederhole deine Wunder“
  rationale: Der griechische Wortlaut unterscheidet ἐγκαινίζω von ἀλλοιόω; die Übersetzung glättet diese Spannung nicht zu bloßer Wiederholung.
translation_notes:
  register: Moderne, schlichte und zugleich gebetswürdige Standardsprache. Die direkte Anrede „Herr“ und die imperativische Parallelstruktur bleiben erhalten. Das abschließende Komma folgt dem überlieferten Ausschnitt, der syntaktisch in den nächsten Vers beziehungsweise Satzteil weiterführt.
