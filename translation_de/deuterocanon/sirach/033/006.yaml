  source_fidelity: 'Die Übersetzung gibt den griechischen Wortlaut eng und vollständig wieder: „Denn“ entspricht ὅτι, die Ausschließlichkeitsformel οὐκ ἔστι θεὸς πλὴν σοῦ ist mit „es gibt keinen Gott außer dir“ treffend wiedergegeben, und beide Imperative bleiben erhalten. „Erneuere“ für ἐγκαίνισον sowie „verändere“ für ἀλλοίωσον bewahren die im Ausgangstext offene, ungewöhnliche Gegenüberstellung von Zeichen und Wundern.'
  naturalness: Modernes, gut verständliches Standarddeutsch mit angemessen schlichtem Gebetsregister. Die Verbindung „verändere Wunder“ ist im Deutschen markiert, aber durch den ebenso markierten griechischen Ausdruck gedeckt und daher nicht zu glätten. Das abschließende Komma ist wegen des überlieferten Satzanschlusses sachgerecht.
  terminology: „Gott“, „Herr“, „Zeichen“ und „Wunder“ sind idiomatisch, registergerecht und theologisch neutral. „außer dir“ gibt πλὴν σοῦ ohne zusätzliche dogmatische Auslegung wieder.
