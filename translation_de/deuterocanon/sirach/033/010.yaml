  terminology: „Eid“ ist für ὁρκισμός direkt und ohne zusätzliche Bundesdeutung. „Machttaten“ gibt τὰ μεγαλεῖα σου idiomatisch als große bzw. machtvolle Taten wieder, ohne den Adressaten über das Pronomen hinaus zu bestimmen. Die Fußnote zu καιρόν wahrt die mögliche Nuance einer festgesetzten Zeit; die Textunsicherheitsnote macht die Validierungswarnung transparent.
