  text: Hasten the time and remember the oath[b][a], and let them recount your mighty deeds.
translation:
  language: de
  text: Lass die Zeit rasch kommen[b], und gedenke des Eides[a]; sie sollen deine Machttaten erzählen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Quellenprüfung kennzeichnet den griechischen Text dieses Verses als unsicher („erhebliche Abweichung“). Übersetzt wird der überlieferte griechische Wortlaut, ohne ihn durch eine Vermutung zu ersetzen.
    reason: textual_variant
  - marker: b
    text: 'Oder: „die festgesetzte Zeit“ (griechisch καιρόν).'
    reason: lexical_alternative
lexical_decisions:
- source_word: σπεῦσον
  choice: Lass … rasch kommen
  rationale: Der Aoristimperativ fordert zu dringlichem Handeln auf. Die Wendung gibt das auf Deutsch natürlicher wieder als das wörtliche, aber schwerfällige „Beschleunige die Zeit“.
- source_word: καιρόν
  choice: die Zeit
  rationale: καιρός kann die passende oder festgesetzte Zeit bezeichnen. „Die Zeit“ bewahrt diese Bedeutungsbreite; die mögliche Nuance „festgesetzte Zeit“ wird in einer Fußnote genannt.
- source_word: μνήσθητι
  choice: gedenke
  rationale: Der Aoristimperativ von μιμνῄσκομαι bedeutet „sich erinnern, an etwas denken“. „Gedenke“ ist knapp, würdevoll und passt zur Gebetssprache.
- source_word: ὁρκισμοῦ
  choice: des Eides
  rationale: ὁρκισμός bezeichnet einen Eid oder eine eidlich bekräftigte Zusage. „Eid“ wahrt den direkten Wortsinn, ohne den möglichen Bundesbezug näher festzulegen.
- source_word: ἐκδιηγησάσθωσαν
  choice: sie sollen … erzählen
  rationale: Der Imperativ der dritten Person wird als Aufforderung wiedergegeben. „Erzählen“ bewahrt den narrativen Sinn; das nicht ausdrücklich genannte Bezugswort von „sie“ bleibt offen.
- source_word: τὰ μεγαλεῖά σου
  choice: deine Machttaten
  rationale: Der substantivierte Plural bezeichnet große, staunenswerte Taten, besonders Taten Gottes. „Machttaten“ ist im Deutschen prägnant und vermeidet das unnatürliche „deine Großheiten“.
theological_decisions:
- issue: Bezug der Anrede und der Rede von den Machttaten
  choice: 'Die zweite Person bleibt als unmittelbare Anrede erhalten: „deine Machttaten“.'
  alternative: Den göttlichen Adressaten durch einen ergänzten Titel ausdrücklich benennen.
  rationale: Eidgedenken und Machttaten passen zu einem Gebet an Gott; da der griechische Wortlaut jedoch keinen Titel nennt, wird keiner hinzugefügt.
- issue: Unsicherheit des überlieferten Ausgangstextes
  choice: Der vorliegende griechische Wortlaut wird übersetzt und seine Unsicherheit in einer Fußnote offengelegt.
  alternative: Den Text nach einer vermuteten hebräischen Vorlage konjektural ändern.
  rationale: Die Validierung kennzeichnet eine erhebliche Abweichung. Ohne hinreichend bezeugte Rekonstruktion bleibt die Übersetzung beim überlieferten griechischen Text.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht gehobener Gebetssprache („gedenke“). Die Formulierung bleibt verständlich, bewahrt den Aufforderungscharakter und lässt sowohl die genaue Bedeutung von καιρός als auch den nicht genannten Bezug von „sie“ offen.
