  text: Understand that I have not labored for myself alone[a], but for all who seek instruction.
translation:
  language: de
  text: Erkennt, dass ich mich nicht für mich allein abgemüht habe, sondern für alle, die Unterweisung suchen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Erziehung“, „Schulung“ oder „Zucht“. Das griechische Wort bezeichnet nicht nur Wissensvermittlung, sondern kann auch die sittliche Formung eines Menschen einschließen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατανοήσατε
  choice: Erkennt
  rationale: Der Aoristimperativ im Plural fordert die Angesprochenen dazu auf, den folgenden Sachverhalt zu erfassen. „Erkennt“ ist prägnant, würdig und stärker als ein bloßes „Beachtet“.
- source_word: οὐκ ἐμοὶ μόνῳ
  choice: nicht für mich allein
  rationale: Der Dativ bezeichnet hier den Nutzen beziehungsweise das eigene Interesse des Sprechers. Die deutsche Wendung gibt dies natürlich und genau wieder.
- source_word: ἐκοπίασα
  choice: ich mich … abgemüht habe
  rationale: κοπιάω bezeichnet anstrengende, ermüdende Arbeit. „Sich abmühen“ bewahrt diesen Nachdruck besser als das neutralere „arbeiten“; das Perfekt passt zum rückblickenden Appell.
- source_word: πᾶσιν τοῖς ζητοῦσιν
  choice: für alle, die … suchen
  rationale: Die Formulierung erhält sowohl die uneingeschränkte Weite von πᾶσιν als auch den fortdauernden Sinn des substantivierten Partizips.
- source_word: παιδείαν
  choice: Unterweisung
  rationale: παιδεία umfasst hier Lehre und formende Erziehung. „Unterweisung“ ist im Kontext verständlich und breit genug, ohne den Begriff auf institutionelle Bildung oder bloße Zucht zu verengen.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch in würdigem Ton. Die kräftige Bedeutung von κοπιάω wird mit „sich abmühen“ bewahrt; die Bedeutungsbreite von παιδεία wird im Haupttext durch „Unterweisung“ und ergänzend in der Fußnote wiedergegeben.
