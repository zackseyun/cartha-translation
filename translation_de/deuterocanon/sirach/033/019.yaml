  text: Listen to me[a], you great men of the people, and you leaders of the assembly, give ear.
translation:
  language: de
  text: 'Hört mich an, ihr Großen des Volkes,[a] und ihr Leiter der Versammlung: Hört zu!'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: ihr Mächtigen des Volkes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσατέ μου
  choice: Hört mich an
  rationale: Der Aoristimperativ im Plural ist ein unmittelbarer Aufruf zum Zuhören. „Hört mich an“ klingt im heutigen Deutsch natürlich und gibt den Bezug des Pronomens μου klar wieder.
- source_word: μεγιστᾶνες λαοῦ
  choice: ihr Großen des Volkes
  rationale: μεγιστᾶνες bezeichnet hochgestellte oder einflussreiche Männer. „Großen des Volkes“ wahrt die Anredeform und vermeidet die mögliche Verengung von „Adligen“ auf einen erblichen Stand.
- source_word: οἱ ἡγούμενοι
  choice: ihr Leiter
  rationale: Das substantivierte Partizip bezeichnet diejenigen, die führen oder vorstehen. „Leiter“ ist verständlich und behauptet kein genauer bestimmtes Amt.
- source_word: ἐκκλησίας
  choice: der Versammlung
  rationale: Im Kontext bezeichnet ἐκκλησία die versammelte Gemeinschaft. „Versammlung“ erhält diesen Sinn, ohne die spätere institutionelle Bedeutung von „Kirche“ einzutragen.
- source_word: ἐνωτίσασθε
  choice: schenkt mir Gehör
  rationale: Der Imperativ verstärkt den Aufruf zum aufmerksamen Hören. Die idiomatische Wendung bewahrt den feierlichen rhetorischen Parallelismus, ohne unnatürlich wörtlich zu klingen.
theological_decisions:
- issue: Geschlechtsspezifische Anrede der gesellschaftlich Hochgestellten
  choice: ihr Großen des Volkes
  alternative: ihr Mächtigen des Volkes; ihr Vornehmen des Volkes
  rationale: Die maskuline griechische Form bezeichnet hier männliche hochgestellte Personen. Die Übersetzung neutralisiert diese Referenz nicht, fügt aber auch keine genauere soziale Kategorie wie erblichen Adel hinzu.
- issue: Wiedergabe von ἐκκλησία
  choice: Versammlung
  alternative: Gemeinde; Kirche
  rationale: Der Ausdruck meint hier die versammelte Gemeinschaft und verlangt keine spezifisch christlich-institutionelle Deutung. „Versammlung“ hält den historischen und semantischen Spielraum offen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die beiden Hörimperative werden mit „Hört mich an“ und „schenkt mir Gehör“ rhetorisch variiert; die öffentliche, feierliche Anrede bleibt erhalten.
