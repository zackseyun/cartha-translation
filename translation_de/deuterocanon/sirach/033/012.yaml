  text: Crush the heads of the rulers of the enemies[a], who say[b], “There is no one except us.”
translation:
  language: de
  text: 'Zerschmettere die Köpfe der feindlichen Herrscher[a], die sagen: »Außer uns gibt es niemanden.«[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die Köpfe der Herrscher der Feinde«.'
    reason: lexical_alternative
  - marker: b
    text: Die griechische Textgrundlage dieses Verses ist in der Quellenprüfung als erheblich abweichend gekennzeichnet; übersetzt wurde hier der angegebene griechische Wortlaut.
    reason: textual_variant
lexical_decisions:
- source_word: σύντριψον
  choice: Zerschmettere
  rationale: Der Aoristimperativ von συντρίβω bezeichnet ein gewaltsames Zerbrechen oder Zerschlagen. »Zerschmettere« bewahrt die Härte und Bildkraft des griechischen Ausdrucks.
- source_word: κεφαλὰς
  choice: die Köpfe
  rationale: Die konkrete Bedeutung des Plurals von κεφαλή wird beibehalten und nicht durch eine abstrakte Umschreibung abgeschwächt.
- source_word: ἀρχόντων ἐχθρῶν
  choice: der feindlichen Herrscher
  rationale: Die beiden Genitive lassen sich knapp als Herrscher charakterisieren, die zur feindlichen Seite gehören. Die Wiedergabe ist im Deutschen natürlicher als »Herrscher der Feinde«, ohne die syntaktische Zuordnung endgültig festzulegen.
- source_word: λεγόντων
  choice: die sagen
  rationale: Das Präsenspartizip wird als deutscher Relativsatz wiedergegeben und kennzeichnet die Herrscher durch ihre fortdauernde anmaßende Aussage.
- source_word: Οὐκ ἔστιν πλὴν ἡμῶν
  choice: Außer uns gibt es niemanden
  rationale: πλήν mit Genitiv drückt Ausschluss aus. Die Formulierung ist modernes, natürliches Deutsch und bewahrt den überheblichen Anspruch.
theological_decisions:
- issue: Bedeutung des Anspruchs der Feinde
  choice: »Außer uns gibt es niemanden« als anmaßender Ausschließlichkeitsanspruch
  alternative: »Niemand ist wie wir«
  rationale: Der griechische Wortlaut drückt unmittelbar Ausschluss, nicht Vergleichbarkeit aus. Die Übersetzung lässt offen, ob sich die Behauptung auf Macht, Bedeutung oder Existenz bezieht, und trägt keine zusätzliche theologische Deutung ein.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der gewaltsame Imperativ und das konkrete Bild bleiben ungemildert; die Rede der Herrscher klingt bewusst anmaßend. Sämtliche Fußnotenmarker stehen im Haupttext.
