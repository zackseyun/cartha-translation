  source_fidelity: Der deutsche Text gibt den Imperativ σύντριψον treffend und in angemessener Bildstärke wieder. κεφαλὰς ἀρχόντων ἐχθρῶν ist mit „die Köpfe der feindlichen Herrscher“ als naheliegende Zugehörigkeitsbestimmung wiedergegeben; die Fußnote nennt transparent die stärker formnahe Alternative. Das Partizip λεγόντων wird korrekt auf die Herrscher bezogen. „Außer uns gibt es niemanden“ bewahrt die exklusive, anmaßende Aussage von οὐκ ἔστιν πλὴν ἡμῶν, ohne sie zu einer Vergleichsaussage umzudeuten.
  naturalness: '„Zerschmettere die Köpfe der feindlichen Herrscher, die sagen: »Außer uns gibt es niemanden.«“ ist idiomatisches modernes Standarddeutsch, klar syntaktisch gegliedert und im würdevollen, poetisch-konkreten Register passend.'
  terminology: „Herrscher“ ist für ἄρχοντες sachgerecht und neutral. „Zerschmettere“ entspricht der gewaltsamen Kraft von σύντριψον. Die Wiedergabe der Ausschließlichkeitsaussage bleibt semantisch offen genug und trägt keine konfessionelle oder weitergehende theologische Deutung ein.
