base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/033/001.yaml
  text: One who fears Yahweh will not meet with evil[a], for even in trial he will turn back and escape.
translation:
  language: de
  text: Wer Jahwe fürchtet, dem begegnet kein Unheil[a]; denn selbst in der Prüfung kehrt er um und entkommt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hebräische Text ist hier schwierig, besonders die Wendung, die mit „in der Prüfung“ wiedergegeben wird. Die angeführte griechische Parallele gehört inhaltlich nicht zu diesem Vers. Nach der hebräischen Vokalisierung könnte die Wendung auch „auf seiner Flucht“ bedeuten; eine weitere mögliche Wiedergabe lautet: „doch in seiner Prüfung wird er wieder gerettet.“'
    reason: alternative_reading
lexical_decisions:
- source_word: יְרֵא יְהֹוָה
  choice: Wer Jahwe fürchtet
  rationale: Die partizipiale Wendung bezeichnet einen Menschen, dessen Leben von Ehrfurcht vor Jahwe geprägt ist. Die deutsche Relativkonstruktion ist natürlich und bewahrt den repräsentativen Singular.
- source_word: לֹא יִפְגַּע רָע
  choice: dem begegnet kein Unheil
  rationale: פגע bezeichnet ein Begegnen oder Widerfahren; רָע kann Böses, Unglück oder Unheil meinen. „Unheil“ passt zum weisheitlichen Zusammenhang, ohne eine völlige Leidensfreiheit zu behaupten.
- source_word: כִּי אִם
  choice: denn selbst
  rationale: 'Die Verbindung qualifiziert die vorangehende Aussage: Eine Prüfung ist möglich, endet für den Gottesfürchtigen jedoch mit Rettung. „Denn selbst“ erhält diese spannungsreiche, konz essive Aussage.'
- source_word: בְּנוּסוֹ
  choice: in der Prüfung
  rationale: Die Form ist textlich und lexikalisch schwierig; nach den Konsonanten und der überlieferten Vokalisierung ist auch ein Bezug auf Flucht möglich. „In der Prüfung“ gibt den im Zusammenhang wahrscheinlich gemeinten Bewährungsfall wieder, während die Unsicherheit in der Fußnote offengelegt wird.
- source_word: שָׁב וְנִמְלָט
  choice: kehrt er um und entkommt
  rationale: 'Die Wiedergabe erhält beide Verben: שוב als „umkehren/zurückkehren“ und נמלט als „entkommen/gerettet werden“. Sie vermeidet es, שוב ohne eindeutigen Kontext ausdrücklich als religiöse Umkehr zu deuten.'
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהֹוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. „Jahwe“ ist die im modernen Deutschen übliche Form des Eigennamens und bewahrt dessen Charakter als Gottesname.
- issue: Reichweite der Zusage לֹא יִפְגַּע רָע
  choice: dem begegnet kein Unheil
  alternative: wird niemals etwas Schlimmes erleiden
  rationale: Der zweite Halbvers setzt eine Prüfung voraus. Daher wird die sprichwörtliche Schutzverheißung nicht zu einer absoluten Zusage völliger Leidensfreiheit ausgeweitet.
- issue: Deutung von שָׁב
  choice: kehrt er um
  alternative: kehrt er zu Gott um
  rationale: Der Text nennt kein ausdrückliches Ziel der Umkehr. Die offenere Formulierung bewahrt die mögliche Bedeutung von Rückkehr, Erholung oder Umkehr, ohne eine spezifische Heilsordnung einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die sentenzartige Form bleibt knapp; „Jahwe“ gibt den Gottesnamen wieder. Die schwer verständliche Folge „kehrt er um und entkommt“ wurde bewusst nicht zu einer eindeutigen theologischen oder narrativen Aussage geglättet.
