review_pass:
  verdict: revise
  source_fidelity: Die vokalisierte hebräische Form בְּנוּסוֹ bedeutet primär „bei/auf seiner Flucht“, nicht „in der Prüfung“. Da der Halbvers insgesamt schwierig ist, sollte die Übersetzung diese Grundbedeutung im Text bewahren und die kontextuell motivierte Deutung „Prüfung“ als Alternative in der Anmerkung nennen. כִּי אִם wird besser durch einen Kontrast wie „doch“ als durch „denn selbst“ wiedergegeben. Die beiden Formen שָׁב und וְנִמְלָט bleiben als „kehrt ... zurück“ und „entkommt“ erkennbar.
  naturalness: „Wer Jahwe fürchtet, dem begegnet kein Unheil“ ist klares, würdiges modernes Standarddeutsch. „Doch auf seiner Flucht kehrt er zurück und entkommt“ ist bewusst knapp und gibt die schwierige hebräische Abfolge ohne unangebrachte Ausdeutung wieder. Die verbleibende Spannung wird durch die Fußnote transparent gemacht.
  terminology: „Jahwe“ gibt den Gottesnamen angemessen wieder; „Unheil“ bewahrt die offene Bedeutung von רָע im Sinn von Übel, Unglück oder Schaden. „Kehrt zurück“ ist gegenüber „kehrt um“ weniger anfällig für eine nicht explizit im Text stehende religiös-moralische Deutung.
  issues:
  - severity: medium
    issue: בְּנוּסוֹ wird im Haupttext als „in der Prüfung“ übersetzt.
    rationale: Die überlieferte hebräische Vokalisierung weist zunächst auf „bei/auf seiner Flucht“ hin. Die Deutung als Prüfung mag kontextuell erwogen werden, ist aber nicht die unmittelbare Wiedergabe der vorliegenden Form und gehört daher in die Fußnote.
  - severity: medium
    issue: „denn selbst“ gibt כִּי אִם ungenau wieder.
    rationale: Die Verbindung hat hier kontrastierende bzw. einschränkende Funktion. „Doch“ bildet diese Funktion im Deutschen natürlicher und knapper ab.
  - severity: low
    issue: Die Fußnote behandelt „auf seiner Flucht“ als bloße alternative Möglichkeit.
    rationale: Diese Bedeutung entspricht der vokalisierten hebräischen Form unmittelbar. Die Anmerkung sollte sie als Grundbedeutung benennen und die Deutung „Prüfung“ als kontextuelle Alternative kennzeichnen.
  revised_text: Wer Jahwe fürchtet, dem begegnet kein Unheil[a]; doch auf seiner Flucht kehrt er zurück und entkommt.
  revised_footnotes:
  - marker: a
    text: 'Der hebräische Text des zweiten Halbverses ist schwierig. Die vokalisierte Wendung bedeutet wörtlich „auf seiner Flucht“; die Abfolge „kehrt er zurück und entkommt“ bleibt im Zusammenhang schwer zu deuten. Kontextuell wird die Wendung auch als „in der Prüfung“ verstanden; dann könnte der Halbvers lauten: „Doch in der Prüfung wird er wieder gerettet.“ Die angeführte griechische Parallele gehört inhaltlich nicht zu diesem Vers.'
    reason: alternative_reading
  revision_rationale: Die Revision folgt vorrangig der überlieferten hebräischen Vokalisierung von בְּנוּסוֹ und korrigiert die kontrastive Verbindung כִּי אִם. Zugleich wahrt sie die syntaktisch und semantisch schwierige hebräische Aussage, ohne sie zu einer spezifischen theologischen Aussage über Umkehr oder Prüfung aufzulösen. Die plausibel kontextuelle, aber weniger unmittelbare Deutung als Prüfung bleibt in der Fußnote dokumentiert.
