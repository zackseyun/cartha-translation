  yaml_path: translation/deuterocanon/sirach/033/026.yaml
  text: Put your servant to work[a], and you will find rest; let his hands be idle, and he will seek freedom.
translation:
  language: de
  text: Lass deinen Sklaven[a] arbeiten, dann wirst du Ruhe finden; lass ihn untätig sein, dann wird er nach Freiheit suchen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische παιδί bedeutet wörtlich „Kind“ oder „Junge“ und kann hier einen jungen abhängigen Hausangehörigen bezeichnen. „Sklave“ ist eine kontextuelle Wiedergabe; auch „Diener“ wäre möglich. Dass er nach Freiheit sucht, spricht jedoch für einen unfreien Status.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔργασαι
  choice: Halte … zur Arbeit an
  rationale: Der Aoristimperativ von ἐργάζομαι wird hier in einer transitiven Konstruktion mit ἐν und Dativ gebraucht. Die Formulierung gibt den nachdrücklichen Arbeitsauftrag natürlich wieder, ohne ein im Deutschen missverständliches „arbeite an“ zu verwenden.
- source_word: ἐν παιδί
  choice: deinen Sklaven
  rationale: παιδί bezeichnet wörtlich ein Kind oder einen Jungen, kann im Haushalt aber einen abhängigen Untergebenen meinen. Dass er nach Freiheit suchen könnte, rückt seinen unfreien Status in den Vordergrund. Das Possessivpronomen ist für die direkte Anrede idiomatisch ergänzt.
- source_word: εὑρήσεις ἀνάπαυσιν
  choice: dann wirst du Ruhe finden
  rationale: Die Wendung bildet den griechischen Futursatz klar und idiomatisch ab; „dann“ macht die im Satz angelegte Folgerelation verständlich.
- source_word: ἄνες χεῖρας αὐτῷ
  choice: lass seine Hände müßig sein
  rationale: ἄνες bezeichnet hier ein Nachlassen oder Lockerlassen. Das konkrete Bild der untätigen Hände bleibt erhalten und wird nicht zu einer bloßen Aussage über Freilassung umgedeutet.
- source_word: ζητήσει ἐλευθερίαν
  choice: dann wird er nach Freiheit suchen
  rationale: „Nach Freiheit suchen“ entspricht ζητέω und ἐλευθερία, ohne das Streben als förmliche Forderung zu verstärken.
theological_decisions:
- issue: Sozialer Status des mit παιδί bezeichneten Hausangehörigen
  choice: Sklave
  alternative: Diener; Junge; Kind
  rationale: Das Wort selbst ist mehrdeutig, doch der Zusammenhang von erzwungener Arbeit und gesuchter Freiheit spricht deutlich für einen unfreien Hausangehörigen. „Sklave“ benennt diese soziale Wirklichkeit, während die Fußnote die wörtliche Bedeutung und verbleibende lexikalische Spannung offenlegt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Weisheitston. Der Parallelismus der beiden Satzhälften und das konkrete Bild der Hände bleiben erhalten; die historische Härte des sozialen Verhältnisses wird nicht beschönigt.
