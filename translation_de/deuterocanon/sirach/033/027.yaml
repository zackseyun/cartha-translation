  text: A yoke and a strap will bend the neck[a], and for a wicked servant there are racks and tortures.
translation:
  language: de
  text: Joch und Riemen werden den Nacken beugen; für einen bösen Sklaven[a] gibt es Folterbänke und Qualen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Diener« beziehungsweise »Hausdiener«; das griechische Wort οἰκέτης kann eine Person des Hausgesindes bezeichnen, steht hier jedoch im Zusammenhang eines unfreien Menschen, der gewaltsam diszipliniert wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ζυγός
  choice: Joch
  rationale: Das Bild des gebeugten Nackens verlangt hier die konkrete Bedeutung »Joch«, nicht »Waage«.
- source_word: ἱμάς
  choice: Riemen
  rationale: Das Wort bezeichnet einen Lederriemen oder eine Schnur; »Riemen« ist im Deutschen klar und passt zum Bild körperlichen Zwangs.
- source_word: κάμψουσιν
  choice: werden … beugen
  rationale: Die Zukunftsform und das körperliche Bild des griechischen Verbs werden unmittelbar wiedergegeben.
- source_word: τράχηλον
  choice: den Nacken
  rationale: Der Singular ist allgemein gebraucht; die bestimmte Form entspricht natürlichem deutschem Ausdruck.
- source_word: οἰκέτῃ
  choice: für einen … Sklaven
  rationale: οἰκέτης kann einen Hausdiener bezeichnen, doch der Zusammenhang von Zwang und Folter hebt den unfreien Status hervor. Der Dativ wird idiomatisch mit »für« wiedergegeben.
- source_word: κακούργῳ
  choice: bösartigen
  rationale: Das Adjektiv kennzeichnet die Person als schlecht oder übeltätig. »Bösartig« ist gewichtig, ohne die Bedeutung auf eine strafrechtliche Kategorie zu verengen.
- source_word: στρέβλαι
  choice: Folterbänke
  rationale: Der konkrete Plural bezeichnet Folterinstrumente, insbesondere Streck- oder Folterbänke.
- source_word: βάσανοι
  choice: Qualen
  rationale: Das Wort bezeichnet schwere Pein bis hin zur Folter. Neben »Folterbänke« vermeidet »Qualen« eine schwerfällige Wiederholung und bewahrt die Härte.
theological_decisions:
- issue: Wiedergabe des sozialen Status bei οἰκέτῃ
  choice: Sklave
  alternative: Diener; Hausdiener
  rationale: Obwohl οἰκέτης auch einen Hausdiener bezeichnen kann, macht der Zusammenhang mit gewaltsamer Disziplin den unfreien Status besonders deutlich. Eine Fußnote bewahrt die lexikalische Spannweite.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Das Futur und die parallele, knappe Satzstruktur des Griechischen bleiben erhalten; das Semikolon macht die Zweiteilung im Deutschen deutlich.
