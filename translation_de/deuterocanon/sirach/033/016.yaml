  text: And I too kept watch last of all[a], like one who gleans behind the grape harvesters.
translation:
  language: de
  text: Auch ich blieb als Letzter wach[a], wie einer, der hinter den Weinlesern Nachlese hält.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „hielt als Letzter Wache“; das griechische Verb kann sowohl das Wachbleiben als auch wachsame Aufmerksamkeit bezeichnen und meint hier wahrscheinlich ausdauernde, späte Arbeit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀγώ
  choice: Auch ich
  rationale: Die Zusammenziehung aus καί und ἐγώ trägt einen anknüpfenden und hervorhebenden Sinn; „Auch ich“ gibt beides knapp und natürlich wieder.
- source_word: ἔσχατος
  choice: als Letzter
  rationale: Das Adjektiv bezeichnet den Sprecher als denjenigen, der nach allen anderen an die Reihe kam; die prädikative Wendung ist im Deutschen idiomatisch.
- source_word: ἠγρύπνησα
  choice: blieb wach
  rationale: Das Verb bezeichnet Wachsein beziehungsweise Wachen. „Blieb wach“ bewahrt die konkrete Bedeutung, ohne den im Kontext naheliegenden Fleiß ausdrücklich in den Text hineinzudeuten.
- source_word: ὡς
  choice: wie
  rationale: Leitet einen Vergleich ein und wird im Deutschen unmittelbar mit „wie“ wiedergegeben.
- source_word: καλαμώμενος
  choice: einer, der … Nachlese hält
  rationale: Das Partizip beschreibt das Einsammeln dessen, was nach der Haupternte übrig geblieben ist. „Nachlese halten“ ist im Bild der Weinlese verständlich und präzise.
- source_word: ὀπίσω
  choice: hinter
  rationale: Bewahrt das räumliche Bild eines Menschen, der den Erntearbeitern folgt.
- source_word: τρυγητῶν
  choice: den Weinlesern
  rationale: Das Substantiv bezeichnet Arbeiter bei der Traubenernte; „Weinleser“ ist eine klare, geläufige deutsche Entsprechung.
