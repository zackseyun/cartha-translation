  language: de
  text: Erhebe einen Widersacher[a] und tilge einen Feind aus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der griechische Ausgangstext ist an dieser Stelle laut den Projektmetadaten textlich unsicher („major mismatch“). Die Übersetzung folgt eng dem überlieferten Wortlaut bei Swete, ohne aus anderen Texttraditionen eine Fassung zu rekonstruieren.
