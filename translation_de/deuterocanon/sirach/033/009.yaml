lexical_decisions:
- source_word: ἔξαρον
  choice: Erhebe
  rationale: Der Aoristimperativ von ἐξαίρω bezeichnet grundsätzlich ein Emporheben oder Erheben. „Erhebe“ bewahrt die knappe, mehrdeutige Ausdrucksweise, ohne festzulegen, ob körperliches Aufheben, Hervorhebung oder ein Aufstehenlassen gemeint ist.
- source_word: ἀντίδικον
  choice: einen Widersacher
  rationale: ἀντίδικος kann einen Prozessgegner oder allgemein einen Gegner bezeichnen. „Widersacher“ erhält den feindlichen Sinn und verengt die Aussage nicht auf einen Rechtsstreit.
- source_word: ἔκτριψον
  choice: tilge … aus
  rationale: Der Imperativ von ἐκτρίβω hat wörtlich den Gedanken des Abreibens und kann im feindlichen Zusammenhang vollständige Beseitigung oder Vernichtung ausdrücken. „Austilgen“ gibt Bildkraft und Schärfe in würdigem Deutsch wieder.
- source_word: ἐχθρόν
  choice: einen Feind
  rationale: ἐχθρός bezeichnet hier einen feindlich gesinnten Menschen. Der unbestimmte Singular entspricht der spruchartigen, parallelen Formulierung.
theological_decisions:
- issue: Unsicherheit des Ausgangstextes aufgrund der Validierungsangabe „major mismatch“
  choice: Der überlieferte Swete-Wortlaut wird als kurzes Imperativpaar übersetzt, ohne Ergänzungen aus anderen Texttraditionen.
  alternative: Eine abweichende hebräische oder griechische Textgestalt aus einer anderen Überlieferung rekonstruieren.
  rationale: Der vorgelegte griechische Text ist für sich genommen knapp und syntaktisch verständlich, doch die Metadaten weisen auf eine erhebliche Abweichung hin. Daher bleibt die Übersetzung eng am bezeugten Wortlaut und kennzeichnet die textliche Unsicherheit.
translation_notes:
  register: Knappe, parallel gebaute und würdevolle Imperativzeile. Die ungewöhnliche Wendung „Erhebe einen Widersacher“ bleibt bewusst stehen, weil der griechische Wortlaut mehrdeutig und textlich unsicher ist.
