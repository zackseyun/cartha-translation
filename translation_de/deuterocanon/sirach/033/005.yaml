translation:
  language: de
  text: Und sie sollen dich erkennen[a], so wie auch wir dich erkannt haben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im ersten Satzteil steht im Griechischen ein stärkeres Verb, das auch „genauer erkennen“ oder „wirklich erkennen“ bedeuten kann; im zweiten steht das einfachere Verb für „erkennen“.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιγνώτωσάν
  choice: sie sollen erkennen
  rationale: Der Aoristimperativ der 3. Person Plural wird im Deutschen natürlich mit „sollen“ wiedergegeben. „Erkennen“ lässt gegenüber dem einfachen γινώσκω eine mögliche Nuance des bestimmten oder vertieften Erkennens anklingen, ohne sie mit „vollständig erkennen“ zu überzeichnen.
- source_word: σε
  choice: dich
  rationale: Akkusativobjekt in der Anrede an Gott; die vertraute Singularform entspricht dem biblischen Gebetsregister des modernen Deutschen.
- source_word: καθάπερ
  choice: so wie
  rationale: Gibt den nachdrücklichen Vergleich klar und idiomatisch wieder.
- source_word: ἡμεῖς
  choice: wir
  rationale: Das ausdrücklich gesetzte Pronomen wird beibehalten und trägt den vergleichenden Nachdruck.
- source_word: ἔγνωμεν
  choice: wir dich erkannt haben
  rationale: Der Aorist von γινώσκω bezeichnet hier das erlangte Erkennen. Das deutsche Perfekt klingt in diesem Satz natürlich und lässt die gegenwärtige Bedeutung dieses Erkennens offen.
theological_decisions:
- issue: Kraft des Imperativs in der an Gott gerichteten Bitte
  choice: „sie sollen dich erkennen“
  alternative: „mögen sie dich erkennen“
  rationale: Der griechische Imperativ wird unmittelbar bewahrt. Im Deutschen kann „sollen“ in einer Bitte an Gott den erbetenen Eintritt des Geschehens ausdrücken, ohne den Satz zu einer bloßen Feststellung zu machen.
- issue: Nuance zwischen ἐπιγινώσκω und γινώσκω
  choice: „erkennen“ im ersten und „erkannt haben“ im zweiten Satzteil, mit Fußnote zum lexikalischen Unterschied
  alternative: „dich völlig erkennen“ gegenüber „dich erkannt haben“
  rationale: Eine ausdrückliche Wiedergabe mit „völlig“ würde die mögliche Verstärkung zu stark festlegen. Die Fußnote bewahrt den Unterschied, ohne eine nicht zwingende theologische Abstufung in den Haupttext einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz bleibt knapp und gebetsartig. „Erkennen“ eignet sich in der Gottesrede besser als das sachlichere „kennen“ und ermöglicht es, die mögliche Abstufung der beiden griechischen Verben in einer Fußnote offenzuhalten.
