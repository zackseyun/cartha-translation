    rationale: Im heutigen Deutsch bezeichnet „sollen“ meist eine Norm, Pflicht oder Anordnung. In dieser an Gott gerichteten Bitte ist „Mögen sie“ die klarere Entsprechung für den Imperativ der dritten Person.
