  terminology: „Erkennen“ ist für beide Verben tragfähig und im Kontext der Gottesansprache idiomatisch. Die Fußnote sollte die mögliche Nuance von ἐπιγινώσκω vorsichtig benennen, ohne ein zwingend stärkeres oder „wirkliches“ Erkennen zu behaupten.
