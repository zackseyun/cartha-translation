  text: Fodder and a rod and loads are for a donkey[a]; bread and discipline and work are for a servant.
translation:
  language: de
  text: Futter, Stock und Lasten sind für einen Esel bestimmt; Brot, Disziplin und Arbeit für einen Haussklaven.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Hausdiener“. Das griechische Wort bezeichnet einen zum Haushalt gehörenden Menschen in unfreier beziehungsweise dienender Stellung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: χορτάσματα
  choice: Futter
  rationale: Der Plural bezeichnet Tierfutter. „Futter“ ist im Deutschen natürlich und passt konkret zum Esel.
- source_word: ῥάβδος
  choice: Stock
  rationale: Das Wort bezeichnet einen Stock oder Stab. „Stock“ bewahrt das konkrete Bild und lässt die im Zusammenhang naheliegende Funktion der Lenkung oder Züchtigung erkennen, ohne sie ausdrücklich festzulegen.
- source_word: φορτία
  choice: Lasten
  rationale: Gemeint sind die Lasten, die ein Esel trägt. „Lasten“ gibt den konkreten Plural knapp und idiomatisch wieder.
- source_word: ὄνῳ
  choice: für einen Esel
  rationale: Der artikellose Dativ Singular wird in der elliptischen Spruchform mit „für einen Esel“ wiedergegeben.
- source_word: ἄρτος
  choice: Brot
  rationale: Die konkrete Bedeutung „Brot“ erhält den Parallelismus; eine Verallgemeinerung zu „Nahrung“ ist nicht nötig.
- source_word: παιδεία
  choice: Disziplin
  rationale: παιδεία umfasst Erziehung, Unterweisung und korrigierende Zucht. Im vorliegenden Haushaltskontext bringt „Disziplin“ die korrigierende Seite zur Geltung, ohne den Begriff auf körperliche Bestrafung einzuengen.
- source_word: ἔργον
  choice: Arbeit
  rationale: „Arbeit“ ist die direkte und natürliche Wiedergabe im praktischen Haushaltskontext.
- source_word: οἰκέτῃ
  choice: für einen Haussklaven
  rationale: οἰκέτης bezeichnet hier einen unfreien Angehörigen des Haushalts. „Haussklave“ macht sowohl die häusliche Zugehörigkeit als auch den unfreien Status deutlich und vermeidet die mögliche Verharmlosung durch „Diener“.
theological_decisions:
- issue: Wiedergabe von οἰκέτῃ in einem Spruch über antike Haushaltsordnung
  choice: Haussklave
  alternative: Hausdiener; Knecht
  rationale: Der Vers spiegelt eine antike Ordnung unfreier Hausangehöriger. „Haussklave“ benennt diese soziale Wirklichkeit klar, ohne sie zu billigen oder durch eine weichere Bezeichnung zu verdecken.
- issue: Bedeutungsumfang von παιδεία
  choice: Disziplin
  alternative: Erziehung; Unterweisung; Zucht
  rationale: Das Griechische kann Unterweisung und korrigierende Erziehung zugleich bezeichnen. „Disziplin“ bewahrt in diesem Kontext die Spannung zwischen Einübung und Korrektur besser als das engere „Unterweisung“ oder das heute altertümlich-harte „Zucht“.
translation_notes:
