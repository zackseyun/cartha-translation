translation:
  language: de
  text: Denn Erbarmen und Zorn sind bei ihm[a], und auf den Frevlern wird sein Grimm ruhen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Überlieferung lautet stattdessen: „Worfle nicht bei jedem Wind, und geh nicht auf jedem Pfad; so ist der doppelzüngige Sünder.“ Sie weicht erheblich vom erhaltenen hebräischen Text ab und geht wahrscheinlich auf eine andere Textform dieses Verses zurück.'
    reason: textual_variant
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion begründet die vorausgehende Mahnung und wird im Deutschen natürlich mit „Denn“ wiedergegeben.
- source_word: רַחֲמִים
  choice: Erbarmen
  rationale: Der abstrakt gebrauchte Plural bezeichnet mitfühlende Barmherzigkeit; „Erbarmen“ ist hier natürlich und würdevoll.
- source_word: אַף
  choice: Zorn
  rationale: Das Wort bedeutet wörtlich „Nase“, bezeichnet idiomatisch aber Zorn. „Zorn“ wahrt zugleich den Unterschied zu רָגְזוֹ im zweiten Satzglied.
- source_word: עִמּוֹ
  choice: sind bei ihm
  rationale: Die Präposition wird nah am Hebräischen wiedergegeben und drückt aus, dass Erbarmen und Zorn bei Gott sind.
- source_word: אֵל
  choice: auf
  rationale: Die Präposition kennzeichnet hier das Ziel, auf dem der Grimm zur Ruhe kommt.
- source_word: רְשָעִים
  choice: den Frevlern
  rationale: Das substantivierte Adjektiv bezeichnet schuldhaft böse Menschen. „Frevler“ ist knapp, würdevoll und passt zum weisheitlichen Register.
- source_word: יָנוּחַ
  choice: wird … ruhen
  rationale: Die Form wird futurisch wiedergegeben; „ruhen“ bewahrt die Grundbedeutung von נוח, ohne sie zu einer bloßen Zustandsaussage abzuschwächen.
- source_word: רָגְזוֹ
  choice: sein Grimm
  rationale: Das Substantiv bezeichnet heftige Erregung beziehungsweise Zorn. „Grimm“ unterscheidet es im Deutschen von אַף und erhält die stärkere Färbung des zweiten Satzglieds.
theological_decisions:
- issue: Bezug der Suffixe in „bei ihm“ und „sein Grimm“
  choice: Gott bleibt der aus dem Zusammenhang erschlossene Bezug, ohne dass „Gott“ in den Haupttext eingefügt wird.
  alternative: Den impliziten Bezug ausdrücklich als „bei Gott“ beziehungsweise „Gottes Grimm“ wiederzugeben.
  rationale: Im Hebräischen steht kein ausdrücklicher Gottesname. Der Kontext macht den Bezug hinreichend klar; die pronominale Form bewahrt jedoch die sprachliche Gestalt und vermeidet eine unnötige Explizierung.
- issue: Stark abweichende griechische Überlieferung
  choice: Der erhaltene hebräische Text bildet den Haupttext; die griechische Fassung wird vollständig in einer Fußnote dokumentiert.
  alternative: Die griechische Fassung als Haupttext zu übersetzen oder beide Fassungen miteinander zu harmonisieren.
  rationale: Für den hebräisch erhaltenen Sirachtext hat der hebräische Zeuge Vorrang. Die erhebliche Abweichung der griechischen Tradition ist jedoch auslegungsrelevant und darf nicht verschwiegen werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper weisheitlicher Satzstruktur. „Erbarmen“, „Zorn“ und „Grimm“ erhalten die abgestufte Ausdruckskraft des Hebräischen; „Frevler“ wahrt den gehobenen, aber allgemein verständlichen biblischen Ton.
