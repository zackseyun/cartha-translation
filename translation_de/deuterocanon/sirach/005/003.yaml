translation:
  language: de
  text: Geh nicht deinem Herzen und deinen Augen nach[a][b], um in bösen Begierden zu wandeln.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Folge nicht deinem Herzen und deinen Augen, indem du bösen Begehrlichkeiten nachgehst.“ Die hebräische Verbindung „Herz und Augen“ bezeichnet anschaulich das innere Verlangen und den äußeren Anreiz.'
    reason: lexical_alternative
  - marker: b
    text: 'Die griechische Parallelüberlieferung weicht erheblich ab: „Und sag nicht: Wer wird mich überwältigen? Denn der Herr wird gewiss Vergeltung an dir üben.“ Hier wird dem hebräischen Textzeugen als Haupttext gefolgt; die griechische Fassung bezeugt eine abweichende Texttradition.'
    reason: textual_variant
lexical_decisions:
- source_word: אַל תֵּלֵךְ אַחֲרֵי
  choice: Geh nicht … nach
  rationale: Die Verbindung von הלך mit אַחֲרֵי bedeutet wörtlich und idiomatisch „hinter etwas hergehen“ beziehungsweise „etwas befolgen“. „Geh … nach“ bewahrt das konkrete Bewegungsbild und ist im Deutschen verständlich.
- source_word: לִבְּךָ וְעֵינֵיךָ
  choice: deinem Herzen und deinen Augen
  rationale: Die konkreten Begriffe bezeichnen inneres Begehren und äußeren Anreiz. Beide werden beibehalten, statt sie zu einem abstrakten Ausdruck wie „deinen Wünschen“ zusammenzuziehen.
- source_word: לָלֶכֶת
  choice: um … zu wandeln
  rationale: Der Infinitiv von הלך nimmt das Bewegungsmotiv des ersten Verbs wieder auf. „Wandeln“ erhält diese Wiederholung und trägt hier den ethischen Sinn einer Lebensführung.
- source_word: בַּחֲמוּדוֹת רָעָה
  choice: in bösen Begierden
  rationale: חֲמוּדוֹת kann Begehrenswertes, Begehrlichkeiten oder Begierden bezeichnen. Im Zusammenhang mit Herz und Augen gibt „Begierden“ den moralischen Sinn wieder; רָעָה wird direkt als „bösen“ wiedergegeben.
theological_decisions:
- issue: Anthropologische Bildsprache „Herz und Augen“
  choice: Die konkrete hebräische Bildsprache bleibt im Haupttext erhalten.
  alternative: „Folge nicht deinen eigenen Wünschen“ oder „Lass dich nicht von deinen Leidenschaften leiten“.
  rationale: Der Vers verbindet das innere Begehren mit dem durch die Augen angezogenen Blick. Eine Verallgemeinerung würde diese Spannung und die biblische Bildsprache abschwächen.
- issue: Bedeutung von חֲמוּדוֹת רָעָה
  choice: „böse Begierden“
  alternative: „böse Begehrlichkeiten“, „böse Lustbarkeiten“ oder „begehrte böse Dinge“.
  rationale: Die hebräische Wendung ist knapp und lässt sowohl Begehrtes als auch das Begehren selbst anklingen. Der Zusammenhang mit Herz und Augen spricht hier für „Begierden“, ohne die moralische Wertung abzuschwächen.
- issue: Stark abweichende griechische Parallelüberlieferung
  choice: Dem hoch bewerteten hebräischen Textzeugen wird im Haupttext gefolgt; die griechische Fassung wird in einer Fußnote dokumentiert.
  alternative: 'Die griechische Fassung als Vershaupttext wiedergeben: „Sag nicht: Wer wird mich überwältigen? Denn der Herr wird gewiss Vergeltung an dir üben.“'
  rationale: Die beiden Überlieferungen stimmen in diesem Vers inhaltlich nicht überein. Eine Harmonisierung wäre nicht textgerecht; daher wird die Abweichung offengelegt.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem, leicht biblischem Klang. „Wandeln“ ist bewusst gewählt, um die Wiederholung von הלך und den ethischen Wegcharakter zu bewahren; die Fußnote bietet eine alltäglichere Formulierung. Die Anrede steht entsprechend dem hebräischen Singular im vertrauten „du“.
