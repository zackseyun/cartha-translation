translation:
  language: de
  text: Verlass dich nicht auf Vergebung, um Sünde auf Sünde zu häufen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Parallelfassung lautet: „Zögere nicht, zum Herrn umzukehren, und schiebe es nicht von Tag zu Tag auf; denn plötzlich wird der Zorn des Herrn hervorbrechen, und zur Zeit der Vergeltung wirst du zugrunde gehen.“ Der hier erhaltene hebräische Text ist kürzer und warnt besonders davor, im Vertrauen auf Vergebung weiterzusündigen.'
    reason: alternative_reading
lexical_decisions:
- source_word: אֶל סְלִיחָה
  choice: auf Vergebung
  rationale: Bei בָּטַח bezeichnet אֶל das Ziel beziehungsweise den Gegenstand des Vertrauens. Die deutsche Verbindung „sich auf etwas verlassen“ gibt die Warnung idiomatisch wieder.
- source_word: אַל תִּבְטָח
  choice: Verlass dich nicht
  rationale: Das Verb בטח bedeutet „vertrauen, sich verlassen auf“. Hier warnt es vor vermessener Zuversicht auf Vergebung; „verlass dich nicht“ ist im modernen Deutsch natürlich und präzise.
- source_word: סְלִיחָה
  choice: Vergebung
  rationale: Das Substantiv bezeichnet Vergebung beziehungsweise Erlass von Schuld. „Vergebung“ ist klar, geläufig und lässt die theologische Aussage offen, ohne die Wirklichkeit der Vergebung zu bestreiten.
- source_word: לְהוֹסִיף
  choice: um … zu häufen
  rationale: Der Infinitiv verbindet das Vertrauen auf Vergebung mit dem weiteren Ansammeln von Sünde. „Häufen“ bringt die fortgesetzte Steigerung im Deutschen deutlicher zum Ausdruck als das bloße „hinzufügen“.
- source_word: עָוֹן עַל עָוֹן
  choice: Sünde auf Sünde
  rationale: עָוֹן kann Sünde, Verfehlung oder Schuld bezeichnen. In dieser Verbindung liegt der Schwerpunkt auf wiederholtem Fehlverhalten; die formnahe Wendung „Sünde auf Sünde“ bewahrt zugleich die eindringliche Wiederholung.
theological_decisions:
- issue: Verhältnis von göttlicher Vergebung und fortgesetzter Sünde
  choice: Der Vers warnt davor, sich auf Vergebung zu berufen, um weiter zu sündigen.
  alternative: Allgemeine Warnung vor übergroßer Zuversicht, Vergebung zu erhalten.
  rationale: Der hebräische Infinitiv verknüpft das Sich-Verlassen auf Vergebung unmittelbar mit dem Häufen weiterer Sünden. Die Warnung bestreitet Vergebung nicht, sondern richtet sich gegen ihren vermessenen Missbrauch. Die griechische Parallelfassung stützt diesen Zusammenhang, indem sie vor dem Aufschub der Umkehr bis zum Gericht warnt.
translation_notes:
  register: Kurzer, eindringlicher Weisheitsspruch in modernem, würdigem Standarddeutsch. Die Wiederholung „Sünde auf Sünde“ bewahrt die rhetorische Schärfe des Hebräischen; die Fußnote dokumentiert die erheblich längere griechische Parallelfassung.
