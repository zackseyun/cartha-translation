translation:
  language: de
  text: Denn plötzlich bricht sein Zorn hervor,[a] und zur Zeit der Vergeltung wirst du hinweggerafft.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Überlieferung dieses Verses lautet deutlich anders: „Sei bereit zuzuhören und antworte geduldig.“ Der Haupttext folgt hier dem erhaltenen hebräischen Textzeugen, dessen Wortlaut erheblich von der griechischen Tradition abweicht.'
    reason: textual_variant
lexical_decisions:
- source_word: פִתאוֹם
  choice: plötzlich
  rationale: Die gewöhnliche adverbiale Bedeutung ist „plötzlich“; sie bewahrt die Unmittelbarkeit der Warnung.
- source_word: יֵצֵא
  choice: bricht … hervor
  rationale: יצא bedeutet wörtlich „hinausgehen/hervorkommen“. „Hervorbrechen“ gibt das Bild eines plötzlich hervortretenden Zorns im Deutschen natürlich und kräftig wieder.
- source_word: זַעְמוֹ
  choice: sein Zorn
  rationale: זעם bezeichnet heftigen Zorn oder Grimm. Das Pronomen bleibt erhalten, statt den im Zusammenhang naheliegenden göttlichen Bezug ausdrücklich einzusetzen.
- source_word: וּבְעֵת
  choice: und zur Zeit der
  rationale: Diese Wiedergabe wahrt die zeitliche Konstruktion des Hebräischen und klingt zugleich idiomatisch.
- source_word: נָקָם
  choice: Vergeltung
  rationale: נקם bezeichnet Rache beziehungsweise vergeltendes Handeln. „Vergeltung“ bewahrt den richterlich-retributiven Sinn, ohne im modernen Deutsch den Beiklang persönlicher Rachsucht unnötig zu verstärken.
- source_word: תִּסָּפֶה
  choice: wirst du hinweggerafft
  rationale: Die Form bezeichnet ein Weggerafft-, Vernichtet- oder Beseitigtwerden. „Hinweggerafft“ erhält das eindringliche Bild und legt die genaue Art des Untergangs nicht fest.
theological_decisions:
- issue: Unausgesprochener Bezug des Pronomens in „sein Zorn“
  choice: Das Pronomen „sein“ wird beibehalten; im Zusammenhang liegt Gott beziehungsweise der Herr als Bezug nahe.
  alternative: Den Bezug ausdrücklich als „Gottes Zorn“ wiedergeben oder eine nicht näher bestimmte Autorität annehmen.
  rationale: Der Vers selbst nennt den Bezugsträger nicht. Die Beibehaltung des Pronomens wahrt die Form des Hebräischen und vermeidet, den kontextuell wahrscheinlichen Gottesbezug ausdrücklich in den Text einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kraftvollen Ausdrücke „hervorbrechen“ und „hinweggerafft werden“ entsprechen dem warnenden Weisheitston; der Satzbau bleibt nah am Hebräischen, ohne unnatürlich zu wirken.
