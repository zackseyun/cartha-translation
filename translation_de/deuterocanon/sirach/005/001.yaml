  text: Do not rely on your wealth[a], and do not say, “I have the power.”
translation:
  language: de
  text: 'Verlass dich nicht auf deinen Reichtum und sage nicht: »Meine eigene Kraft reicht aus.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch wörtlich etwa: »Es liegt in der Macht meiner Hand.« Der griechische Paralleltext lautet sinngemäß: »Es genügt mir« oder »Ich bin auf niemanden angewiesen.«'
    reason: Die Fußnote macht die ungewöhnliche hebräische Formulierung und die abweichende Akzentsetzung des griechischen Paralleltexts transparent.
lexical_decisions:
- source_word: אַל תִּשָּׁעֵן
  choice: Verlass dich nicht
  rationale: Das Verb שׁען bedeutet wörtlich, sich auf etwas zu stützen, und bezeichnet hier bildlich das Vertrauen auf etwas. »Sich verlassen auf« ist im modernen Deutschen natürlich und bewahrt diesen Sinn.
- source_word: חֵילֶךָ
  choice: deinen Reichtum
  rationale: חַיִל kann Kraft, Vermögen, Mittel oder Reichtum bezeichnen. Der griechische Paralleltext mit χρήματα (Besitz, Geld) stützt in diesem Zusammenhang deutlich die wirtschaftliche Bedeutung.
- source_word: יֵשׁ לְאֵל יָדִי
  choice: Meine eigene Kraft reicht aus
  rationale: Die knappe hebräische Wendung spricht von der Macht oder Fähigkeit der eigenen Hand. Die Wiedergabe erhält den Gedanken eigener Kraft und bringt zugleich den durch den griechischen Paralleltext bezeugten Anspruch der Selbstgenügsamkeit in natürliches Deutsch.
theological_decisions:
- issue: Deutung der schwierigen zweiten Aussage unter Einbeziehung des griechischen Paralleltexts
  choice: Die Aussage wird als Anspruch verstanden, die eigene Kraft genüge.
  alternative: »Meine Hand hat Macht« oder »Ich habe die Macht«
  rationale: Der hebräische Text bleibt maßgeblich und nennt die Macht der eigenen Hand, ist aber ungewöhnlich knapp. Das griechische αὐτάρκη μοί ἐστιν verdeutlicht den Gedanken des Sich-selbst-Genügens. Die Übersetzung verbindet beide Zeugnisse, ohne die Spannung zu verschweigen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Warnung bleibt knapp; »eigene Kraft« macht den Anspruch auf Selbstgenügsamkeit verständlich, ohne eine konfessionelle Deutung einzutragen.
