  source_fidelity: 'Die Übersetzung gibt die erste Hälfte präzise wieder: חֵילֶךָ ist im Kontext und mit dem griechischen Paralleltext sinnvoll als „Reichtum“ verstanden. „Meine eigene Kraft reicht aus“ vermittelt für die schwierige zweite hebräische Wendung angemessen den mit dem griechischen αὐτάρκη μοί ἐστιν belegten Gedanken der Selbstgenügsamkeit, ohne eine konfessionelle Deutung einzutragen.'
