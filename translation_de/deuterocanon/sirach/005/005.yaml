base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/005/005.yaml
  text: Do not say[a], “I have sinned[b], and what has been done to me? Nothing,” for God is patient.
translation:
  language: de
  text: 'Sag nicht: »Ich habe gesündigt, und was wird mir schon geschehen? Nichts!« Denn Gott ist geduldig.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »Denn Gott ist langsam zum Zorn.«'
    reason: lexical_alternative
  - marker: b
    text: 'Der griechische Paralleltext lautet abweichend: »Sei im Blick auf die Sühne nicht ohne Furcht, sodass du Sünde auf Sünden häufst.« Der hebräische Text warnt davor, aus bisher ausgebliebenen Folgen und Gottes Geduld falsche Sicherheit abzuleiten; beide Textformen warnen davor, Gottes Erbarmen vermessen auszunutzen.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תֹּאמַר
  choice: Sag nicht
  rationale: Der direkte negative Imperativ wird knapp und natürlich wiedergegeben.
- source_word: חָטָאתִי
  choice: Ich habe gesündigt
  rationale: Das hebräische Perfekt bezeichnet hier eine vollzogene Tat, auf deren vermeintlich ausbleibende Folgen der Sprecher zurückblickt.
- source_word: וְמַה יֵעָשֶה לִי
  choice: und was wird mir schon geschehen?
  rationale: Das passive Imperfekt lässt eine zukünftige Folge erwarten. Das Modalwort »schon« macht im Deutschen die selbstsichere rhetorische Haltung deutlich, ohne dem Satz eine zusätzliche Behauptung hinzuzufügen.
- source_word: מְאוּמָה
  choice: Nichts!
  rationale: 'Das Wort steht elliptisch als selbstgefällige Antwort auf die vorausgehende Frage: Es werde keinerlei Folge eintreten.'
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion leitet die Begründung ein, mit der der Sprecher seine falsche Sicherheit rechtfertigt.
- source_word: אֵל
  choice: Gott
  rationale: Dies ist in diesem Weisheitskontext die natürliche deutsche Wiedergabe der Gottesbezeichnung.
- source_word: אֶרֶךְ אַפַּיִם
  choice: ist geduldig
  rationale: Die idiomatische Wendung bedeutet wörtlich »langsam zum Zorn« und bezeichnet Gottes Langmut. »Geduldig« ist gegenwärtig und verständlich; die wörtlichere Fassung bleibt in der Fußnote erhalten.
- source_word: הוּא
  choice: ist
  rationale: Das hebräische Pronomen wird in der deutschen Kopulakonstruktion natürlich durch das finite Verb aufgenommen.
theological_decisions:
- issue: Wiedergabe des göttlichen Attributs אֶרֶךְ אַפַּיִם
  choice: Gott ist geduldig
  alternative: Gott ist langsam zum Zorn
  rationale: Der Vers warnt davor, Gottes Langmut als Freibrief zur Sünde zu missbrauchen. »Geduldig« vermittelt dies in heutigem Deutsch, ohne das künftige Gericht auszuschließen; die traditionelle, quellennähere Form steht in der Fußnote.
- issue: Abweichender griechischer Text
  choice: Der hebräische Wortlaut bildet den Haupttext
  alternative: »Sei im Blick auf die Sühne nicht ohne Furcht, sodass du Sünde auf Sünden häufst.«
  rationale: Da ein hoch bewerteter hebräischer Zeuge vorliegt, folgt der Haupttext diesem. Die erheblich abweichende griechische Überlieferung wird offengelegt, weil beide Textformen vor vermessener Berufung auf Gottes Vergebung beziehungsweise Langmut warnen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bewahrt die selbstsichere Logik des Sünders. »Was wird mir schon geschehen?« ist idiomatisch, hält aber den zukünftigen und passiven Sinn des hebräischen Verbs fest. Sämtliche Fußnotenmarker stehen im Haupttext.
