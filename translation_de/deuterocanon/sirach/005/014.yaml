  text: Be firm in your understanding[a], and let your word be one.
translation:
  language: de
  text: Steh fest in deiner Einsicht, und bleib bei einem Wort.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Parallelüberlieferung lautet sinngemäß: „Lass dich nicht einen Verleumder nennen … über den Doppelzüngigen kommt schwere Verurteilung.“ Dies stützt die Deutung, dass „bei einem Wort bleiben“ vor widersprüchlichem oder doppelzüngigem Reden warnt.'
    reason: alternative_reading
lexical_decisions:
- source_word: הֱיֶה סָמוּךְ
  choice: Steh fest
  rationale: Die Aufforderung bezeichnet einen gefestigten, verlässlichen Stand. „Steh fest“ gibt diesen Sinn im Deutschen natürlich wieder, ohne das hebräische Bild unnötig auszudeuten.
- source_word: עַל דַּעְתֶּךָ
  choice: in deiner Einsicht
  rationale: דעת kann Wissen, Einsicht oder Urteilskraft bezeichnen. „Einsicht“ passt zum Weisheitskontext und lässt die Bedeutung weiter offen als „Überzeugung“ oder „Meinung“.
- source_word: וְאֶחָד יְהִי דְבָרֶךָ
  choice: und dein Wort sei eines
  rationale: Die Formulierung bewahrt die knappe hebräische Rede von dem „einen“ Wort. Sie legt Beständigkeit und ungeteiltes, nicht doppelzüngiges Reden nahe, ohne diese Deutung in den Haupttext einzubauen.
theological_decisions:
- issue: Das Verhältnis des erhaltenen hebräischen Textes zur deutlich abweichenden griechischen Parallelüberlieferung
  choice: Der Haupttext folgt dem erhaltenen Hebräisch und formuliert eine Mahnung zu gefestigter Einsicht und einheitlichem Reden.
  alternative: Eine griechisch gestützte Wiedergabe könnte vor Flüsterei, verleumderischer Rede und Doppelzüngigkeit warnen.
  rationale: Da für diese Stelle ein zuverlässiger hebräischer Text vorliegt, erhält er Vorrang. Die griechische Fassung bezeugt jedoch eine verwandte Warnung vor doppelzüngiger Rede und wird deshalb transparent in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die leicht markante Wendung „dein Wort sei eines“ bewahrt bewusst die Kürze und Mehrdeutigkeit des Hebräischen.
