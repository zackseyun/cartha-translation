  terminology: „Einsicht“ passt für דעת im Weisheitskontext. Die Fußnote sollte ψίθυρος genauer als „Verleumder“ beziehungsweise „Zuträger“ wiedergeben; „Einflüsterer“ ist hierfür nicht die naheliegendste deutsche Bezeichnung. „Schwere Verurteilung“ gibt κατάγνωσις πονηρά sachlicher wieder als „hartes Urteil“.
