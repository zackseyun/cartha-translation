  text: Do not delay to return to him[b][a], and do not put it off from day to day.
translation:
  language: de
  text: Zögere nicht, zu ihm zurückzukehren,[a] und schiebe es nicht von einem Tag auf den anderen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit „zu ihm zurückzukehren“ ist wahrscheinlich die Umkehr zu Gott gemeint; im Hebräischen steht jedoch nur „zu ihm“.
    reason: alternative_reading
  - marker: b
    text: 'Das hebräische Verb ist schwierig; aus dem Zusammenhang ergibt sich der Sinn: Schiebe es nicht immer wieder auf.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תְּאַחֵר
  choice: Zögere nicht
  rationale: Die verneinte Aufforderung und das Hiphil von אחר werden natürlich und präzise als Warnung vor dem Zögern wiedergegeben.
- source_word: לָשׁוּב
  choice: zurückzukehren
  rationale: שוב bedeutet „zurückkehren, umkehren“. „Zurückkehren“ bewahrt sowohl den konkreten Wortsinn als auch die im Kontext mögliche Bedeutung einer Umkehr zu Gott.
- source_word: אֵלָיו
  choice: zu ihm
  rationale: Das hebräische Pronomen wird beibehalten; ein Gottesname wird nicht ergänzt, obwohl der Kontext wahrscheinlich Gott als Bezugspunkt erkennen lässt.
- source_word: תִּתְעַבֵּר
  choice: schiebe es nicht auf
  rationale: Die schwierige Verbform wird aufgrund des Parallelismus und der anschließenden Zeitangabe kontextgemäß als wiederholtes Aufschieben verstanden.
- source_word: מִיּוֹם אֶל יוֹם
  choice: von einem Tag auf den anderen
  rationale: Diese geläufige deutsche Wendung gibt das fortgesetzte Verschieben über aufeinanderfolgende Tage idiomatisch wieder.
theological_decisions:
- issue: Ob die Rückkehr ausdrücklich als Umkehr zu Gott bezeichnet werden soll
  choice: Die implizite Formulierung „zu ihm zurückzukehren“ bleibt erhalten.
  alternative: „zum Herrn umzukehren“ oder „zu Gott zurückzukehren“
  rationale: Der Zusammenhang legt Gott als Bezug des Pronomens nahe, doch der hebräische Vers selbst nennt weder Gott noch den Herrn. Die Übersetzung bewahrt diese Zurückhaltung.
- issue: Deutung der schwierigen Form תִּתְעַבֵּר
  choice: Kontextuelle Wiedergabe als „schiebe es nicht auf“
  alternative: „säume nicht“, „lass es nicht vorübergehen“ oder „sei nicht nachlässig“
  rationale: Der Parallelismus mit dem ersten Satzteil und „von einem Tag auf den anderen“ sprechen deutlich für den Gedanken des Aufschiebens. Die stark abweichende griechische Überlieferung bestimmt die Übersetzung des gut bezeugten hebräischen Textes hier nicht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung ist direkt und gut verständlich; die Gottesbeziehung bleibt so implizit wie im hebräischen Text.
