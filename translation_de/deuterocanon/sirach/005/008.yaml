translation:
  language: de
  text: 'Und du sagst: „Sein Erbarmen ist groß; er wird mir die Menge meiner Verfehlungen vergeben.“[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Paralleltext lautet: „Verlass dich nicht auf ungerechten Reichtum; denn am Tag der Heimsuchung wird er dir nichts nützen.“ Der erhaltene hebräische Text warnt hier stattdessen davor, sich auf Gottes Erbarmen zu verlassen, als sei Vergebung selbstverständlich.'
    reason: textual_variant
lexical_decisions:
- source_word: וְאָמַרְתָּ
  choice: Und du sagst
  rationale: Das hebräische Perfekt bezeichnet in diesem mahnenden Zusammenhang die Äußerung, die der Angeredete macht bzw. sich zu eigen macht. Das deutsche Präsens gibt diese Funktion natürlicher wieder als „du sagtest“.
- source_word: רַחֲמָיו רַבִּים
  choice: Sein Erbarmen ist groß
  rationale: Das hebräische רַחֲמִים steht formal im Plural, wird im Deutschen jedoch idiomatisch als singularisches Kollektiv „Erbarmen“ wiedergegeben. „Ist groß“ bewahrt den Gedanken der Fülle, ohne das unnatürliche „seine Erbarmungen sind zahlreich“ zu erzwingen.
- source_word: לְרֹב עֲוֹנוֹתַי
  choice: die Menge meiner Verfehlungen
  rationale: „Die Menge“ erhält den quantitativen Sinn von רֹב. „Verfehlungen“ gibt den moralischen Gehalt und den Plural von עֲוֹנוֹת wieder, ohne unnötig altertümlich zu klingen.
- source_word: יִסְלָח
  choice: wird er vergeben
  rationale: Die Zukunftsform bringt die selbstsichere Erwartung des Sprechers zum Ausdruck. „Vergeben“ ist im Deutschen die natürliche Entsprechung im Zusammenhang mit Schuld und Verfehlungen.
theological_decisions:
- issue: Das Verhältnis zum erheblich abweichenden griechischen Paralleltext
  choice: Der erhaltene hebräische Text steht im Haupttext; die griechische Lesart wird in einer Fußnote vollständig dokumentiert.
  alternative: 'Dem griechischen Text folgen: „Verlass dich nicht auf ungerechten Reichtum; denn am Tag der Heimsuchung wird er dir nichts nützen.“'
  rationale: Da für diese Stelle ein sicher bezeugter hebräischer Text vorliegt, erhält er Vorrang. Die griechische Fassung bietet keine bloße Formulierungsvariante, sondern eine andere Warnung; deshalb muss sie als bedeutsame Textvariante sichtbar bleiben.
- issue: Warnung vor dem vermessenen Vertrauen auf Gottes Erbarmen
  choice: Die direkte Aussage bleibt ohne erklärenden Zusatz stehen.
  alternative: 'Die Aussage ausdrücklich als Vermessenheit kennzeichnen, etwa: „Bilde dir nicht ein …“'
  rationale: Der hebräische Wortlaut zitiert die Behauptung des Angeredeten, nennt ihre theologische Bewertung in diesem Vers aber nicht ausdrücklich. Eine erläuternde Wertung im Haupttext würde mehr festlegen, als der Wortlaut selbst sagt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die leicht gewichtige Wendung „die Menge meiner Verfehlungen“ spiegelt bewusst die quantitative Formulierung des Hebräischen; das idiomatische Singularwort „Erbarmen“ vermeidet dagegen einen im heutigen Deutschen gekünstelten Plural.
