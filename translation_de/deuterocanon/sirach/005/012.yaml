translation:
  language: de
  text: Verlass dich nicht auf trügerischen Reichtum[a], denn am Tag des Zorns wird er nichts nützen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „falschen Reichtum“, „betrügerischen Besitz“ oder „Reichtum der Falschheit“. Das Hebräische kann Vermögen bezeichnen, das durch Täuschung geprägt ist – sei es, weil es unrechtmäßig erworben wurde, oder weil es sich als unzuverlässig erweist.'
    reason: lexical_alternative
  - marker: b
    text: 'Die griechische Parallelüberlieferung lautet an dieser Stelle stattdessen: „Wenn du Einsicht hast, antworte deinem Nächsten; wenn aber nicht, lege deine Hand auf deinen Mund.“ Der hebräische Text weicht erheblich davon ab; die Übersetzung folgt hier dem erhaltenen Hebräisch als Hauptquelle.'
    reason: textual_variant
lexical_decisions:
- source_word: אַל תִּבְטַח עַל
  choice: Verlass dich nicht auf
  rationale: Die hebräische negative Aufforderung wird im Deutschen natürlich und direkt wiedergegeben. „Sich auf etwas verlassen“ entspricht dem Setzen von Vertrauen auf etwas, ohne den Ton zu verschärfen.
- source_word: נִכְסֵי
  choice: Reichtum
  rationale: Das Wort bezeichnet Besitzwerte oder Vermögen. „Reichtum“ erfasst hier den kollektiven Sinn und passt zur weisheitlichen Warnung.
- source_word: שֶׁקֶר
  choice: trügerisch
  rationale: Das hebräische Wort bezeichnet Falschheit oder Täuschung. „Trügerisch“ lässt offen, ob der Reichtum unrechtmäßig erworben wurde oder sich letztlich als unzuverlässig erweist.
- source_word: לֹא יוֹעִילוּ
  choice: wird er nichts nützen
  rationale: Das Verb bezeichnet Nutzen, Hilfe oder Erfolg. Die Formulierung ist modernes, idiomatisches Deutsch; das singularische Pronomen richtet sich nach dem deutschen Kollektivbegriff „Reichtum“.
- source_word: בְּיוֹם עֶבְרָה
  choice: am Tag des Zorns
  rationale: Die Wendung bewahrt die prägnante, feierliche Bildsprache des Hebräischen. „Zorn“ gibt die starke, möglicherweise gerichtliche Bedeutung wieder, ohne den Träger des Zorns ausdrücklich zu bestimmen.
theological_decisions:
- issue: Ob עֶבְרָה allgemein als Ärger oder mit stärkerem gerichtlichem Gewicht wiederzugeben ist
  choice: Zorn
  alternative: Wut; Grimm; Gericht
  rationale: „Tag des Zorns“ bewahrt die mögliche gerichtliche und theologische Spannung. Der Text nennt jedoch nicht ausdrücklich Gottes Zorn; deshalb wird kein Handelnder ergänzt.
- issue: Vorrang des erhaltenen hebräischen Textes gegenüber der deutlich abweichenden griechischen Überlieferung
  choice: Der erhaltene hebräische Text wird übersetzt.
  alternative: 'Griechische Lesart: „Wenn du Einsicht hast, antworte deinem Nächsten; wenn aber nicht, lege deine Hand auf deinen Mund.“'
  rationale: Für diesen Vers liegt ein sicher bezeugter hebräischer Text vor. Die griechische Parallelüberlieferung repräsentiert eine erheblich andere Textform und wird daher in einer Fußnote dokumentiert, nicht in den Haupttext übernommen.
translation_notes:
  register: Modernes Standarddeutsch mit knapper, würdevoller Weisheitssprache. „Verlass dich nicht auf“ ist natürlich und allgemein verständlich; „Tag des Zorns“ bewahrt den feierlichen und möglicherweise gerichtlichen Klang, ohne eine nicht genannte göttliche Urheberschaft einzutragen.
