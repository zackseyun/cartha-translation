lexical_decisions:
- source_word: הֱיֶה מְמַהֵר
  choice: Sei schnell bereit
  rationale: Der Imperativ mit dem Partizip drückt Bereitschaft und unverzügliches Handeln aus. Die Formulierung ist im Deutschen natürlich und bewahrt den auffordernden Charakter.
- source_word: לְהַאֲזִין
  choice: zuzuhören
  rationale: Das Verb bezeichnet aufmerksames Hören, nicht bloß akustisches Wahrnehmen. „Zuhören“ gibt diesen aktiven Sinn idiomatisch wieder.
- source_word: וּבְאֶרֶךְ רוּחַ
  choice: mit Geduld
  rationale: Wörtlich steht „mit Länge des Geistes“; die hebräische Wendung bezeichnet Geduld beziehungsweise ein beherrschtes Temperament.
- source_word: הָשֵׁב
  choice: antworte
  rationale: Das Verb bedeutet hier, eine Äußerung zurückzugeben, also zu antworten. Der deutsche Imperativ bildet die knappe hebräische Aufforderung gut ab.
- source_word: פִּתְגָּם
  choice: '[in „antworte“ enthalten]'
  rationale: Das Substantiv kann „Wort“, „Ausspruch“ oder im Kontext „Antwort“ bedeuten. Natürliches Deutsch fasst הָשֵׁב פִּתְגָּם in dem Verb „antworte“ zusammen; die Bedeutungsbreite wird in einer Fußnote bewahrt.
