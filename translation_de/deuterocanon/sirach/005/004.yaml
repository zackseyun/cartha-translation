  text: Do not say[a], “Who can withstand his power?” for Yahweh seeks the persecuted.
translation:
  language: de
  text: 'Sag nicht[a]: »Wer kann seiner Macht widerstehen?« Denn Jahwe sucht die Verfolgten.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Text lautet: »Sag nicht: ›Ich habe gesündigt, und was ist mir geschehen?‹ Denn der Herr ist geduldig.« Wahrscheinlich beruht er hier auf einer anderen Textvorlage als der erhaltene hebräische Text.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תֹּאמַר
  choice: Sag nicht
  rationale: Die negative Aufforderung mit אמר wird im modernen Deutsch direkt und natürlich wiedergegeben.
- source_word: מִי יוּכַל כֹּחוֹ
  choice: Wer kann seiner Macht widerstehen?
  rationale: Der überlieferte hebräische Ausdruck ist knapp und schwierig. »Widerstehen« macht den wahrscheinlich adversativen Sinn von יוכל idiomatisch deutlich, ohne die rhetorische Frage aufzulösen; כֹּחוֹ wird mit »seiner Macht« wiedergegeben.
- source_word: כִּי
  choice: denn
  rationale: »Denn« bewahrt den begründenden Zusammenhang mit dem vorangehenden Verbot.
- source_word: יְהֹוָה
  choice: Jahwe
  rationale: Gibt den Gottesnamen im hebräischen Hauptzeugen als Eigennamen wieder und entspricht der vorgelegten deutschen Zielkonvention, die aus der aktuellen englischen POB-Schicht hervorgeht.
- source_word: מְבַקֵּשׁ
  choice: sucht
  rationale: Entspricht der Grundbedeutung von בקש und vermeidet eine weitergehende Deutung der Art des göttlichen Eingreifens.
- source_word: נִרְדָּפִים
  choice: die Verfolgten
  rationale: Das passive Partizip von רדף bezeichnet diejenigen, die verfolgt werden; »die Verfolgten« bewahrt den direkten Bezug zum Verbalstamm.
theological_decisions:
- issue: Deutliche Abweichung zwischen dem erhaltenen hebräischen Text und der griechischen Überlieferung
  choice: Der erhaltene hebräische Text steht im Haupttext; die griechische Lesart erscheint in einer Fußnote.
  alternative: '»Sag nicht: ›Ich habe gesündigt, und was ist mir geschehen?‹ Denn der Herr ist geduldig.«'
  rationale: Da ein hebräischer Textzeuge vorhanden und mit hoher Sicherheit bewertet ist, dient er als Hauptgrundlage. Die inhaltlich stark abweichende griechische Lesart weist wahrscheinlich auf eine andere hebräische Vorlage hin und wird deshalb transparent dokumentiert, statt mit dem Haupttext harmonisiert zu werden.
- issue: Bedeutung von Gottes Suchen nach den Verfolgten
  choice: Die offene Formulierung »sucht die Verfolgten« bleibt erhalten.
  alternative: »tritt für die Verfolgten ein« oder »zieht wegen der Verfolgten zur Rechenschaft«
  rationale: Der Kontext kann rettendes Eingreifen oder gerichtliche Rechenschaft nahelegen, doch בקש allein legt diese Ausgestaltung nicht eindeutig fest. Die Übersetzung bewahrt daher die theologische Spannung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Anrede »Sag nicht« ist klar und allgemein verständlich. Die knappe, etwas rätselhafte Aussage des Hebräischen wird nicht durch eine konfessionelle oder interpretierende Ergänzung vereindeutigt.
