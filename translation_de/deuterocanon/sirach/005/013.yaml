  text: Do not be a winnower to every wind[b][a], or walk on the path of the storm.
translation:
  language: de
  text: Sei keiner, der bei jedem Wind worfelt, und schlag nicht den Weg des Sturms ein.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort שִׁבֹּלֶת ist hier unsicher. Es kann möglicherweise „Sturm“ oder „Sturzbach“ bedeuten; andernorts bezeichnet es auch eine „Ähre“. Die Übersetzung folgt der Bedeutung, die am besten zum Bild von „jedem Wind“ passt.
    reason: lexical_alternative
  - marker: b
    text: 'Der griechische Paralleltext lautet deutlich anders: „Ehre und Schande liegen im Reden, und die Zunge eines Menschen bringt ihn zu Fall.“ Die Übersetzung folgt hier dem erhaltenen hebräischen Text als Hauptquelle.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תִּהְיֶה
  choice: Sei keiner
  rationale: Die verneinte Form von היה leitet eine direkte Mahnung ein. „Sei keiner, der …“ gibt die prädikative Konstruktion mit dem folgenden Partizip im Deutschen natürlich wieder.
- source_word: זוֹרֶה
  choice: der … worfelt
  rationale: Das Partizip bezeichnet jemanden, der Getreide worfelt, also mithilfe des Windes Spreu und Korn trennt. Das konkrete landwirtschaftliche Bild bleibt erhalten.
- source_word: לְכָל רוּחַ
  choice: bei jedem Wind
  rationale: Die Präposition bezeichnet hier am natürlichsten den Wind als Anlass oder Bedingung des Worfelns. Zugleich bleibt das Bild unsteten Handelns bei jedem wechselnden Einfluss gewahrt.
- source_word: וּפוֹנֶה דֶרֶך
  choice: und schlag nicht den Weg … ein
  rationale: Das koordinierte Partizip steht unter der fortwirkenden Verneinung. „Einen Weg einschlagen“ gibt die Richtungs- und Wegmetaphorik idiomatisch wieder, ohne sie auf eine bloß innere Haltung zu reduzieren.
- source_word: שִׁבֹּלֶת
  choice: des Sturms
  rationale: Das Wort ist an dieser Stelle unsicher. Eine wetterbezogene Bedeutung passt zum parallelen Bild des Windes; andere mögliche Bedeutungen werden in der Fußnote offengelegt.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Worfeln“ ist ein konkreter, heute weniger alltäglicher, aber verständlicher landwirtschaftlicher Ausdruck; der Relativsatz macht das Bild syntaktisch zugänglich. Die beiden parallelen Warnungen bleiben bildhaft und knapp.
