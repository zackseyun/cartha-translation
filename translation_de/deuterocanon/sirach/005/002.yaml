translation:
  language: de
  text: Verlass dich nicht auf deine eigene Kraft, um dem Verlangen deiner Seele zu folgen.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Paralleltext lässt sich näher so wiedergeben: „Folge nicht deiner Seele und deiner Kraft, indem du nach den Begierden deines Herzens lebst.“ Der hebräische Text lautet dagegen: „Verlass dich nicht auf deine Kraft, um dem Verlangen deiner Seele zu folgen.“'
    reason: alternative_reading
  - marker: b
    text: Das hebräische Wort für „Seele“ kann je nach Zusammenhang auch „Selbst“, „Leben“ oder das begehrende Wesen eines Menschen bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּשָּׁעֵן
  choice: Verlass dich nicht
  rationale: Das Verb שׁען bedeutet wörtlich „sich stützen auf“ und übertragen „sich verlassen auf“. Die gewählte Formulierung ist im modernen Deutschen natürlich und bewahrt den Sinn des Vertrauens auf die eigene Fähigkeit.
- source_word: כֹּחֶךָ
  choice: deine eigene Kraft
  rationale: כֹּחַ bezeichnet Kraft oder Macht. „Kraft“ passt zur persönlichen Fähigkeit; „eigene“ verdeutlicht im Deutschen den durch das Possessivsuffix gegebenen Selbstbezug, ohne eine fremde Kraftquelle in den Text einzutragen.
- source_word: לָלֶכֶת אַחַר
  choice: um … zu folgen
  rationale: Wörtlich steht „hinter … hergehen“. Im Deutschen gibt „folgen“ die idiomatische Bedeutung verständlich wieder. Die Infinitivkonstruktion wird als Zweck- oder Folgebeziehung wiedergegeben, ohne diese feiner festzulegen.
- source_word: תַּאֲוַת
  choice: dem Verlangen
  rationale: Das hebräische Substantiv steht im Singular und kann Verlangen, Begehren oder Begierde bezeichnen. „Verlangen“ wahrt die Breite des Ausdrucks und vermeidet eine unnötige sexuelle Verengung.
- source_word: נַפְשֶׁךָ
  choice: deiner Seele
  rationale: נֶפֶשׁ kann Seele, Selbst, Leben oder auch das begehrende Wesen bezeichnen. „Seele“ erhält die anthropologische Ausdrucksweise des Hebräischen; mögliche weitere Bedeutungen werden in der Fußnote genannt.
theological_decisions:
- issue: Anthropologische Bedeutung von נַפְשֶׁךָ
  choice: deiner Seele
  alternative: deinem eigenen Verlangen / dir selbst
  rationale: Die Wiedergabe „Seele“ bewahrt die Ausdrucksweise des hebräischen Textes und seine Spannung zwischen Person, Lebenskraft und begehrendem Inneren. Sie legt den Begriff nicht auf ein späteres, enges Leib-Seele-Schema fest; die Bedeutungsbreite wird durch eine Fußnote offengehalten.
- issue: Verhältnis zum griechischen Paralleltext
  choice: Vorrang der gut bezeugten hebräischen Lesart „Verlass dich nicht auf deine eigene Kraft“
  alternative: „Folge nicht deiner Seele und deiner Kraft“
  rationale: Da der hebräische Text hier mit hoher Sicherheit vorliegt, bildet er die Übersetzungsgrundlage. Die abweichende griechische Syntax wird als echte Text- und Übersetzungsalternative dokumentiert, aber nicht in den Haupttext eingemischt.
translation_notes:
  register: Moderne, würdevolle Standardsprache. „Verlass dich nicht“ ist natürlicher als das wörtlichere „Stütze dich nicht“, während „Seele“ die Bild- und Begriffswelt des Ausgangstextes bewahrt. Der Singular „Verlangen“ folgt dem Hebräischen.
