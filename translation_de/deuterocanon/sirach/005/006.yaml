translation:
  language: de
  text: 'Sag nicht: »Der HERR ist barmherzig; er wird alle meine Sünden auslöschen.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַל תֹּאמַר
  choice: Sag nicht
  rationale: Gibt das hebräische Verbot direkt und in natürlichem modernem Deutsch wieder.
- source_word: רַחוּם
  choice: barmherzig
  rationale: Entspricht der Aussage über Gottes erbarmendes Wesen; das traditionelle Wort ist im heutigen Standarddeutsch weiterhin klar und würdevoll.
- source_word: יהוה
  choice: der HERR
  rationale: Gibt den Gottesnamen nach verbreiteter deutscher Bibelkonvention als HERR wieder, ohne eine unsichere Aussprache festzulegen.
- source_word: עֲוֹנוֹתַי
  choice: meine Verfehlungen
  rationale: Bewahrt den moralisch-schuldhaften Sinn von עָוֹן, ohne ihn auf bloße Irrtümer oder ausschließlich auf einen abstrakten Schuldzustand zu verengen.
- source_word: יִמְחֶה
  choice: auslöschen
  rationale: 'Gibt das konkrete Bild des hebräischen Verbs מחה wieder: etwas wegwischen beziehungsweise tilgen.'
theological_decisions:
- issue: Gottes Barmherzigkeit als Vorwand für sorgloses Sündigen
  choice: Die Aussage bleibt als verbotene menschliche Schlussfolgerung formuliert.
  alternative: Den Satz durch eine ausdrückliche Erklärung von Gericht oder Umkehr ergänzen.
  rationale: Der hebräische Vers warnt knapp davor, sich auf Gottes Barmherzigkeit zu berufen; zusätzliche Lehrsätze würden über den überlieferten hebräischen Wortlaut hinausgehen.
- issue: Umfang der erwarteten Vergebung
  choice: alle meine Verfehlungen
  alternative: die Menge meiner Sünden
  rationale: כָל bedeutet im hebräischen Haupttext ausdrücklich „alle“. Die abweichende griechische Formulierung wird nicht in den hebräischen Ausgangstext eingetragen.
translation_notes:
  register: Kurzer, eindringlicher Mahnspruch in natürlichem, würdigem Standarddeutsch. Die direkte Rede und das Bild des Auslöschens bleiben erhalten; keine Fußnote ist für diesen klaren hebräischen Wortlaut erforderlich.
