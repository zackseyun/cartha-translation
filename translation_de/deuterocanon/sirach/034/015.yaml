  text: Judge your neighbor's feelings by your own, and think carefully about every matter.[a]
translation:
  language: de
  text: Beurteile die Lage deines Nächsten nach deiner eigenen und denke über jede Angelegenheit sorgfältig nach.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hebräische Textzeuge aus der Kairoer Geniza weicht hier erheblich ab: »Läuft nicht eine Träne über die Wange herab und ein Seufzer über ihre Aufrührer?« Der hebräische Ausdruck am Schluss und sein Bezug sind unsicher. Die Textüberlieferung dieses Verses ist unsicher; der Haupttext folgt der griechischen Überlieferung.'
    reason: alternative_reading
lexical_decisions:
- source_word: νόει
  choice: Beurteile
  rationale: Der griechische Imperativ fordert zu verständigem Einschätzen auf; zusammen mit »nach dir selbst« bezeichnet er ein Urteil aus der Analogie zur eigenen Erfahrung.
- source_word: τὰ τοῦ πλησίον
  choice: was deinen Nächsten bewegt
  rationale: Die Wendung bezeichnet offen das, was den Nächsten betrifft. Die deutsche Formulierung ist natürlich und bewahrt mehr Bedeutungsbreite als die engere Wiedergabe »Gefühle«.
- source_word: ἐκ σεαυτοῦ
  choice: nach dir selbst
  rationale: Die eigene Erfahrung dient als Ausgangspunkt und Maßstab für das Verständnis des Nächsten.
- source_word: ἐπὶ παντὶ πράγματι
  choice: über jede Angelegenheit
  rationale: Die Formulierung gibt die umfassende Reichweite der Mahnung wieder und bewahrt den konkreten Sinn von πρᾶγμα.
- source_word: διανοοῦ
  choice: denke … sorgfältig nach
  rationale: Der Imperativ bezeichnet bewusstes, gründliches Überlegen und wird in verständlichem modernem Deutsch wiedergegeben.
- source_word: הלא דמעה על לחי תרד, ואנחה על מרודיה
  choice: Läuft nicht eine Träne über die Wange herab und steigt nicht ein Seufzer über ihre Bedränger oder Aufrührer auf?
  rationale: Diese abweichende hebräische Zeile wird wegen der erheblichen Textdifferenz in der Fußnote vollständig wiedergegeben; מרודיה bleibt im Kontext mehrdeutig.
theological_decisions:
- issue: Erhebliche Abweichung zwischen dem erhaltenen hebräischen Zeugen und der griechischen Parallelüberlieferung
  choice: Der Haupttext folgt dem zusammenhängenden griechischen Text; die hebräische Zeile wird als bedeutende abweichende Lesart in der Fußnote bewahrt.
  alternative: 'Haupttext nach dem Hebräischen: »Läuft nicht eine Träne über die Wange herab und steigt nicht ein Seufzer über ihre Bedränger oder Aufrührer auf?«'
  rationale: Der hebräische Zeuge ist ausdrücklich als erhebliche Abweichung gekennzeichnet und stimmt inhaltlich nicht mit der griechischen Überlieferung überein. Die griechische Fassung bietet hier eine klare Weisheitsmahnung und wird deshalb im Haupttext verwendet, ohne die echte Unsicherheit der Überlieferung zu verdecken.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Was deinen Nächsten bewegt« vermeidet die übermäßig enge Festlegung auf Gefühle, bleibt aber für gewöhnliche Leser natürlich. Die Fußnote kennzeichnet die erhebliche Quellendivergenz offen und wahrt die Mehrdeutigkeit des hebräischen מרודיה.
