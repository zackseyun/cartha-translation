  yaml_path: translation/deuterocanon/sirach/034/023.yaml
  text: Whoever takes away a neighbor’s livelihood is murdering him[b][a], and whoever withholds a hired worker’s wages is shedding blood.
translation:
  language: de
  text: Wer seinem Nächsten die Lebensgrundlage nimmt, ermordet ihn; und wer einem Arbeiter den Lohn vorenthält, vergießt Blut.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φονεύων τὸν πλησίον
  choice: ermordet ihn
  rationale: Das präsentische Partizip φονεύων fungiert prädikativ und formuliert eine allgemeingültige Aussage. „Ermordet“ bewahrt gegenüber dem allgemeineren „tötet“ die moralische Verurteilung; „ihn“ nimmt den zuvor bezeichneten Nächsten natürlich wieder auf.
- source_word: ὁ ἀφαιρούμενος συμβίωσιν
  choice: wer seinem Nächsten die Lebensgrundlage nimmt
  rationale: ἀφαιρέω bedeutet „wegnehmen, berauben“; συμβίωσις bezeichnet hier den Lebensunterhalt beziehungsweise die Mittel, von denen jemand lebt. „Lebensgrundlage“ ist gegenwärtiges, verständliches Deutsch und erhält den Bezug zur Erhaltung des Lebens.
- source_word: ἐκχέων αἷμα
  choice: vergießt Blut
  rationale: Die feste biblische Wendung wird im Deutschen idiomatisch mit „Blut vergießen“ wiedergegeben und bewahrt ihr starkes Bild für tödliche Schuld.
- source_word: ὁ ἀποστερῶν
  choice: wer … vorenthält
  rationale: ἀποστερέω kann „berauben, entziehen, vorenthalten“ bedeuten. In Verbindung mit Lohn ist „vorenthalten“ präzise und natürlich und bezeichnet eine schuldhafte Verweigerung.
- source_word: μισθὸν μισθωτοῦ
  choice: einem Tagelöhner den Lohn
  rationale: μισθός ist der geschuldete Lohn; μισθωτός ein gegen Entgelt angestellter Arbeiter. „Tagelöhner“ macht die prekäre antike Lohnarbeit anschaulich, ohne den Sinn auf ein modernes festes Arbeitsverhältnis zu verengen.
theological_decisions:
- issue: Direkte Gleichsetzung wirtschaftlicher Beraubung mit Tötung und Blutvergießen
  choice: 'Die Aussage wird unmittelbar formuliert: „ermordet ihn“ und „vergießt Blut“.'
  alternative: „ist wie einer, der ihn ermordet“ beziehungsweise „ist, als vergösse er Blut“
  rationale: Im Griechischen fehlen Vergleichspartikeln. Die parallelen Partizipialkonstruktionen setzen die Handlungen rhetorisch und moralisch direkt gleich. Eine Abschwächung zum bloßen Vergleich würde die bewusst zugespitzte ethische Aussage glätten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit sprichwortartig knapper Parallelstruktur. Die drastische Bildsprache des griechischen Textes bleibt ungemildert erhalten.
