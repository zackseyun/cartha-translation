translation:
  language: de
  text: Er setzte Zeichen der Gunst[a], und ein Schrei ließ die Wolke eilen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Parallelüberlieferung lautet: „Und wer ist seine Stütze?“ Sie weicht stark vom erhaltenen hebräischen Text ab und deutet auf eine wesentlich andere Textform hin.'
    reason: textual_variant
lexical_decisions:
- source_word: תמרורי
  choice: Zeichen
  rationale: Das Substantiv bezeichnet sichtbare Kennzeichen oder Wegmarken. „Zeichen“ ist im Deutschen natürlich und wahrt die Offenheit des poetisch verdichteten Ausdrucks; „Omen“ wäre zu deutend.
- source_word: רצון
  choice: Gunst
  rationale: רצון kann Wohlwollen, Gefallen oder Annahme bezeichnen. „Gunst“ gibt hier die Beziehung zu den „Zeichen“ knapp und würdig wieder.
- source_word: הניחה
  choice: stellte … auf
  rationale: Die Form bezeichnet ein Setzen, Niederlegen oder Aufstellen. Bei sichtbaren Zeichen ist „aufstellen“ idiomatisch, ohne den Ausdruck unnötig zu erklären.
- source_word: וצעקה
  choice: und ein Schrei
  rationale: Die Form wird als Substantiv verstanden. „Ein Schrei“ bewahrt die Kürze und den abrupten Übergang des Hebräischen.
- source_word: ענן
  choice: die Wolke
  rationale: Der Singular wird konkret und entsprechend dem knappen poetischen Zusammenhang mit bestimmtem Artikel wiedergegeben.
- source_word: חשתה
  choice: ließ … eilen
  rationale: Die Wurzel vermittelt die Vorstellung von Eile. Die kausative Wiedergabe folgt der schwierigen hebräischen Syntax und lässt deren ungewöhnliches Bild bestehen.
theological_decisions:
- issue: Starke textliche Abweichung zwischen dem erhaltenen Hebräisch und der griechischen Überlieferung
  choice: Der Haupttext folgt dem erhaltenen Hebräisch; die erheblich abweichende griechische Fassung wird in einer Fußnote dokumentiert.
  alternative: „Und wer ist seine Stütze?“
  rationale: Wo ein hebräischer Sirachtext erhalten ist, besitzt er für die Übersetzung Vorrang. Da die griechische Parallele hier jedoch einen völlig anderen Sinn bietet und möglicherweise auf eine andere Vorlage oder Textstufe zurückgeht, darf diese Abweichung nicht verschwiegen werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die stark verdichtete und ungewöhnliche Bildsprache des hebräischen Textes wird nicht geglättet; insbesondere bleibt die Verbindung von Schrei und eilender Wolke bewusst rätselhaft.
