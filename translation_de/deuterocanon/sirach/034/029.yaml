  source_fidelity: Der Hauptsatz gibt πικρία ψυχῆς und οἶνος πινόμενος πολὺς angemessen wieder. „Verbunden mit“ fügt jedoch eine im Griechischen nicht ausgedrückte Verknüpfung hinzu. Für ἐρεθισμός ist „Gereiztheit“ näher und im heutigen Deutsch eindeutiger als „Erregung“; ἀντίπτωμα wahrt mit „Straucheln“ besser das Bild eines Anstoßens bzw. Stolperns als das stärkere „Sturz“.
