translation:
  language: de
  text: Wein, im Übermaß getrunken, ist Bitterkeit der Seele[a], mit Gereiztheit und Straucheln.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wein, im Übermaß getrunken, ist Bitterkeit für die Seele, mit Gereiztheit und Straucheln.“ Die knappe griechische Formulierung lässt beim Genitiv und bei den beiden Schlussbegriffen unterschiedliche Nuancen zu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πικρία
  choice: Bitterkeit
  rationale: Bewahrt das Bild des griechischen Substantivs, ohne es einseitig als Kummer, Verbitterung oder moralischen Groll festzulegen.
- source_word: ψυχῆς
  choice: der Seele
  rationale: Gibt den Genitiv formal und in würdiger, verständlicher anthropologischer Sprache wieder; gemeint sein kann das innere Leben beziehungsweise die ganze Person.
- source_word: οἶνος
  choice: Wein
  rationale: Entspricht der konkreten Bezeichnung; eine Verallgemeinerung zu Alkohol wäre nicht textgemäß.
- source_word: πινόμενος πολὺς
  choice: im Übermaß getrunken
  rationale: Gibt die große konsumierte Menge natürlich wieder und richtet die Warnung gegen übermäßigen Genuss, nicht gegen Wein an sich.
- source_word: ἐν ἐρεθισμῷ
  choice: verbunden mit Erregung
  rationale: ἐρεθισμός kann Reizung, Erregung oder Provokation bezeichnen. „Erregung“ erhält die Offenheit zwischen innerer Gereiztheit und streitbarer Aufreizung.
- source_word: ἀντιπτώματι
  choice: Sturz
  rationale: Das seltene Substantiv bezeichnet ein Anstoßen beziehungsweise Fallen und kann daher „Straucheln“, „Sturz“ oder übertragen „Niedergang“ bedeuten. „Sturz“ bewahrt das konkrete Bild.
