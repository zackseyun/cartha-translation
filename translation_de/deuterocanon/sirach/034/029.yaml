  terminology: „Bitterkeit der Seele“ bewahrt die Bildsprache und den Genitiv, ohne ψυχή unnötig zu psychologisieren. „Gereiztheit“ und „Straucheln“ lassen die knappe und nicht völlig eindeutige Schlusswendung offen.
