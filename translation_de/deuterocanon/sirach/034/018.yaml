base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/034/018.yaml
  text: Even God will not delay[a], and like a warrior he will go out and not hold back, until he crushes the loins of the cruel, and repays vengeance to the nations; until he dispossesses the scepter of arrogance, and the staff of the wicked he will cut down completely.
translation:
  language: de
  text: Auch Gott wird nicht zögern[a]; wie ein Krieger zieht er aus und hält sich nicht zurück, bis er die Hüften des Grausamen zerschmettert und den Völkern Vergeltung heimzahlt; bis er dem Hochmut das Zepter entreißt und den Stab des Frevlers vollständig niederhaut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der für diesen Vers überlieferte griechische Text lautet stattdessen: „die Seele erhebend und die Augen erleuchtend, Heilung, Leben und Segen gebend“. Er bezeugt damit eine erheblich andere Texttradition als der erhaltene hebräische Text.'
    reason: textual_variant
lexical_decisions:
- source_word: גם אל
  choice: Auch Gott
  rationale: גם setzt einen hervorhebenden oder anschließenden Akzent. „Auch Gott“ wahrt die naheliegende Wortbedeutung, ohne die im Deutschen missverständliche Nuance von „Sogar Gott“ aufzudrängen.
- source_word: לא יתמהמה
  choice: wird nicht zögern
  rationale: Die Form bezeichnet ein Zögern oder Sich-Verweilen; die Zukunftsform gibt den hebräischen Imperfekt im Zusammenhang natürlich wieder.
- source_word: כגבור יצא
  choice: wie ein Krieger zieht er aus
  rationale: גבור bezeichnet hier im martialischen Gerichtskontext einen Krieger; „zieht aus“ bewahrt das Bild des Aufbruchs zum Kampf.
- source_word: לא יתאפק
  choice: hält sich nicht zurück
  rationale: Die Wendung bezeichnet Selbstbeherrschung beziehungsweise Zurückhaltung und wird im Deutschen idiomatisch wiedergegeben.
- source_word: ימחץ
  choice: zerschmettert
  rationale: מחץ ist ein starkes Verb des Zerschlagens oder Zermalmens; „zerschmettert“ erhält die Härte des Bildes.
- source_word: מתני אכזרי
  choice: die Hüften des Grausamen
  rationale: מתנים bezeichnet konkret Hüften oder Lenden und kann sinnbildlich für Kraft stehen. Die konkrete Körpermetapher bleibt erhalten; אכזרי wird substantivisch im Singular wiedergegeben.
- source_word: לגוים ישיב נקם
  choice: den Völkern Vergeltung heimzahlt
  rationale: Die Formulierung bewahrt sowohl die Richtung des ל als auch den retributiven Sinn von ישיב נקם und klingt zugleich natürlich deutsch.
- source_word: יוריש
  choice: verdrängt
  rationale: Der Hifil von ירש kann „aus dem Besitz vertreiben, verdrängen“ bedeuten. Im Bild illegitimer Herrschaft bringt „verdrängt“ die Beseitigung der Macht zum Ausdruck.
- source_word: שבט זדון
  choice: das Zepter des Hochmuts
  rationale: שבט kann Stab, Rute oder Zepter heißen; im Herrschaftskontext eignet sich „Zepter“. זדון bezeichnet anmaßenden Hochmut.
- source_word: מטה רשע
  choice: den Stab des Frevlers
  rationale: „Stab“ erhält die Parallelität zu „Zepter“, ohne beide Wörter gleichzusetzen. רשע wird als substantivischer Singular „Frevler“ wiedergegeben.
- source_word: גדוע יגדע
  choice: vollständig niederhaut
  rationale: Die Verbindung aus Infinitivus absolutus und finitem Verb verstärkt die Aussage. „vollständig“ gibt die emphatische Kraft wieder, „niederhaut“ das Bild des Abhauens.
theological_decisions:
- issue: Starke Abweichung zwischen hebräischer und griechischer Überlieferung
  choice: Der Haupttext folgt dem erhaltenen hebräischen Text.
  alternative: 'Die griechische Überlieferung lautet sinngemäß: „die Seele erhebend und die Augen erleuchtend, Heilung, Leben und Segen gebend“.'
  rationale: Da für diesen Abschnitt ein hebräischer Zeuge vorliegt, bildet er die Grundlage der Übersetzung. Die griechische Fassung bietet keinen eng entsprechenden Wortlaut, sondern eine wesentlich andere Texttradition; diese Differenz wird deshalb in einer Fußnote offengelegt und nicht harmonisiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst beibehaltenen martialischen Bildern. Die Satzstruktur folgt dem hebräischen Aufbau, wird jedoch für flüssiges Deutsch leicht geglättet; das Semikolon markiert die parallelen עד-Sätze.
