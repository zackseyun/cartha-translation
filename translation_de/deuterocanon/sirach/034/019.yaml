review_pass:
  verdict: revise
  source_fidelity: Der Haupttext folgt dem erhaltenen hebräischen Text. Die zweimalige זמliche Einleitung „bis“ sowie die forensische Wendung ריב ריב werden bewahrt. Im zweiten Glied sollte die im Deutschen sonst zu stark ausgesparte Vergeltung ausdrücklich wiedergegeben werden. Für יריב ריב עמו macht „die Rechtssache seines Volkes vertreten“ klar, dass Gott die Sache des Volkes vertritt, nicht gegen das Volk prozessiert.
  naturalness: Der Entwurf ist überwiegend modernes, würdiges Standarddeutsch. Die Wiederholung von „vergilt“ verbessert jedoch die syntaktische Geschlossenheit und Verständlichkeit. „Die Rechtssache seines Volkes vertreten“ ist idiomatisch und bewahrt zugleich den gerichtlichen Bildbereich.
  terminology: „Vergilt“, „Vorhaben“ und „Rettung“ sind angemessen. „Vorhaben“ lässt die mögliche, aber nicht zwingende negative Nuance von מזמה offen. In der Fußnote ist „aus Unrecht“ näher am griechischen ἐξ ἀδίκου als „aus ungerechtem Gut“ und vermeidet eine unnötige Einengung.
  issues:
  - severity: medium
    issue: Im zweiten Hauptglied fehlt im Deutschen ein ausgedrücktes Prädikat der Vergeltung.
    rationale: Die hebräische Nominalfügung וגמול אדם כמזימתו setzt die Vergeltung aus dem vorhergehenden Glied fort. Die bloße Folge „und einem jeden nach seinem Vorhaben“ ist zwar als Ellipse denkbar, bleibt im Deutschen aber syntaktisch unvollständig und schwächt den Begriff גמול.
  - severity: low
    issue: „den Rechtsstreit seines Volkes führt“ kann die Prozessrichtung offenlassen.
    rationale: Die Konstruktion יריב ריב עמו meint hier, die Rechtssache des eigenen Volkes zu führen bzw. zu vertreten. „Die Rechtssache seines Volkes vertreten“ gibt diese Fürsprache klarer wieder.
  - severity: low
    issue: Die Fußnote engt ἐξ ἀδίκου als „aus ungerechtem Gut“ ein.
    rationale: Der griechische Ausdruck bezeichnet wörtlich ein Opfern „aus Unrecht“ und kann unrechtmäßig erworbenes Gut meinen, legt dies aber nicht ausdrücklich fest.
  revised_text: Bis er einem Menschen sein Tun vergilt und jedem nach seinem Vorhaben vergilt[a]; bis er die Rechtssache seines Volkes vertritt und sie mit seiner Rettung erfreut.
