revisions:
- from: Bis er dem Menschen sein Tun vergilt und einem jeden nach seinem Vorhaben[a]; bis er den Rechtsstreit seines Volkes führt und sie mit seiner Rettung erfreut.
  to: Bis er einem Menschen sein Tun vergilt und jedem nach seinem Vorhaben vergilt[a]; bis er die Rechtssache seines Volkes vertritt und sie mit seiner Rettung erfreut.
  rationale: Die Revision vervollständigt die deutsche Wiedergabe der im Hebräischen fortgeführten Vergeltung, verdeutlicht die forensische Parteinahme für Gottes Volk und formuliert die abweichende griechische Lesart weniger interpretierend. Die markierte Fußnote bleibt am Ende des ersten Satzteils verankert und dokumentiert die substantielle Textabweichung.
