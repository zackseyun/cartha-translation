  text: Until he repays a man for his deed[a], and a person's recompense according to his scheme; until he pleads the case of his people and gladdens them with his salvation.
translation:
  language: de
  text: Bis er einem Menschen sein Tun vergilt und jedem nach seinem Vorhaben vergilt[a]; bis er die Rechtssache seines Volkes vertritt und sie mit seiner Rettung erfreut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der erhaltene griechische Text von Sirach 34,19 lautet stattdessen: „Wer aus Unrecht opfert, bringt eine fehlerhafte Gabe dar, und die Gaben gesetzloser Menschen finden kein Wohlgefallen.“ Der erhaltene hebräische Text weicht hier erheblich vom griechischen ab.'
    reason: alternative_reading
lexical_decisions:
- source_word: עד
  choice: bis
  rationale: In beiden Satzgliedern markiert עד die zeitliche Grenze eines aus dem vorherigen Vers weitergeführten Zusammenhangs.
- source_word: ישיב לאנוש פעלו
  choice: er dem Menschen sein Tun vergilt
  rationale: Die Konstruktion mit שוב und פעל bezeichnet hier die richterliche Vergeltung dessen, was ein Mensch getan hat. „Vergilt“ ist im Deutschen natürlich und bewahrt den forensischen Sinn.
- source_word: וגמול אדם כמזימתו
  choice: und einem jeden nach seinem Vorhaben
  rationale: Die knappe hebräische Nominalfügung bezeichnet die einem Menschen zukommende Vergeltung gemäß seiner מזמה. „Vorhaben“ bewahrt die mögliche moralische Ambivalenz besser als das deutlich negative „Machenschaft“; „einem jeden“ gibt den distributiven Sinn idiomatisch wieder.
- source_word: יריב ריב עמו
  choice: er den Rechtsstreit seines Volkes führt
  rationale: Die figura etymologica ריב ריב hat forensischen Charakter und meint, die Rechtssache des Volkes zu vertreten bzw. zu führen.
- source_word: ושמחם
  choice: und sie ... erfreut
  rationale: Die Kausativform bedeutet, jemanden froh zu machen. „Erfreut“ ist knapp, würdig und im modernen Deutsch verständlich.
- source_word: בישועתו
  choice: mit seiner Rettung
  rationale: ישועה kann Rettung, Befreiung oder Heil bezeichnen. „Rettung“ passt zum konkreten Handeln zugunsten des Volkes, ohne die weitergehende theologische Bedeutung auszuschließen.
theological_decisions:
- issue: Starke Abweichung zwischen dem erhaltenen hebräischen Text und der griechischen Überlieferung
  choice: Der erhaltene hebräische Wortlaut wird als Haupttext übersetzt; die wesentlich andere griechische Lesart wird in einer Fußnote dokumentiert.
  alternative: 'Nach dem griechischen Text übersetzen: „Wer aus ungerechtem Gut opfert, bringt eine befleckte Gabe dar, und die Gaben gesetzloser Menschen finden kein Wohlgefallen.“'
  rationale: Da ein hebräischer Zeuge vorliegt, hat er für diese Übersetzung Vorrang. Die vollständige inhaltliche Abweichung der griechischen Parallelüberlieferung ist jedoch textkritisch bedeutsam und darf nicht verschwiegen werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wiederholte Struktur „bis …; bis …“ bildet den hebräischen Satzbau ab. „Rechtsstreit“ erhält das forensische Bild; „Vorhaben“ lässt offen, ob מזמה neutral oder negativ gemeint ist.
