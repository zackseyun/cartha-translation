  text: One is praying and one is cursing—whose voice will the Master listen to?
translation:
  language: de
  text: Der eine betet, der andere verflucht – auf wessen Stimme wird der Herr hören?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἷς … καὶ εἷς
  choice: der eine … der andere
  rationale: Gibt die Gegenüberstellung zweier Personen im natürlichen modernen Deutsch wieder.
- source_word: εὐχόμενος
  choice: betet
  rationale: Im Kontrast zu καταρώμενος bezeichnet das Partizip hier das Beten; die finite Form ist im Deutschen klar und idiomatisch.
- source_word: καταρώμενος
  choice: verflucht
  rationale: 'Bewahrt die starke Bedeutung des Verbs: einen Fluch aussprechen, nicht bloß schimpfen.'
- source_word: τίνος φωνῆς
  choice: auf wessen Stimme
  rationale: Erhält den genitivischen Personenbezug „wessen“ und damit die vom griechischen Text gesetzte Frage, welcher der beiden Sprecher Gehör findet.
- source_word: εἰσακούσεται
  choice: wird … hören
  rationale: Das Verb meint hier erhörendes bzw. aufmerksames Hören. In Verbindung mit „auf wessen Stimme“ bringt „hören“ dies natürlich zum Ausdruck.
- source_word: ὁ δεσπότης
  choice: der Herr
  rationale: „Herr“ ist im Deutschen die würdige und kontextgerechte Bezeichnung für den souveränen Gebieter; „Meister“ wäre hier missverständlich.
theological_decisions:
- issue: Bezug von ὁ δεσπότης
  choice: der Herr
  alternative: der Gebieter
  rationale: Der Text bezeichnet Gott als souveränen Herrn. „Herr“ bewahrt diese theologische Aussage in geläufiger biblischer Sprache, ohne eine besondere konfessionelle Deutung einzuführen.
- issue: Art des göttlichen Hörens
  choice: auf wessen Stimme wird der Herr hören?
  alternative: wessen Stimme wird der Herr erhören?
  rationale: „Hören auf“ lässt offen, ob der Akzent auf Wahrnehmen, Beachtung oder Erhörung liegt, und bewahrt dadurch den Bedeutungsumfang von εἰσακούσεται besser als das enger wirkende „erhören“.
translation_notes:
  register: Modernes, knappes und würdiges Standarddeutsch. Die antithetische Satzstruktur und die offene rhetorische Frage des griechischen Textes bleiben erhalten.
