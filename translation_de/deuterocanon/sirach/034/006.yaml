review_pass:
  verdict: revise
  source_fidelity: Die negative Bedingung, die Herkunft „vom Höchsten“, das Passiv „gesandt wird“ sowie der im Griechischen vorhandene Wechsel von Singular (ἀποσταλῇ) zu Plural (αὐτά) sind zutreffend wiedergegeben. „Richte dein Herz auf sie“ hat im heutigen Deutschen jedoch gewöhnlich den Sinn, etwas entschlossen anzustreben oder zu begehren. Das gibt die Wendung μὴ δῷς εἰς αὐτὰ τὴν καρδίαν σου, die vor innerer Zuwendung bzw. Vertrauen gegenüber solchen Erfahrungen warnt, nicht ausreichend genau wieder.
  naturalness: „Wende ihnen dein Herz nicht zu“ ist modernes, würdiges Standarddeutsch und bewahrt zugleich die biblische Herzmetaphorik. „Bei einer Heimsuchung“ ist verständlich, wenn auch bewusst gehoben; angesichts der Mehrdeutigkeit von ἐν ἐπισκοπῇ ist diese Zurückhaltung vertretbar.
  terminology: „Der Höchste“ ist die angemessene Übersetzung des Gottestitels Ὑψίστος. „Heimsuchung“ kann im Deutschen eine leidvolle Erfahrung nahelegen; die Formulierung und die Fußnote sollten deshalb ausdrücklich erkennen lassen, dass hier auch göttliches Aufsuchen, Eingreifen oder Prüfen gemeint sein kann, ohne den griechischen Ausdruck auf eine dieser Nuancen festzulegen.
