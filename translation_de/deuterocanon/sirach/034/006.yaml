translation:
  language: de
  text: Wenn es nicht vom Höchsten bei einer Heimsuchung[b] gesandt wird, wende ihnen dein Herz nicht zu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „diesen Dingen“; gemeint sind die im Zusammenhang erwähnten Träume und ähnliche Erscheinungen.'
    reason: lexical_alternative
  - marker: b
    text: „Bei einer Heimsuchung“ kann auch „zur Zeit einer Heimsuchung“ bedeuten oder auf göttliches Aufsuchen, Prüfen beziehungsweise Aufsicht bezogen werden.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐὰν μὴ
  choice: Wenn … nicht
  rationale: Gibt die negative Bedingung im Deutschen natürlich und genau wieder, ohne sie stärker als notwendig umzudeuten.
- source_word: παρὰ Ὑψίστου
  choice: vom Höchsten
  rationale: παρά mit Genitiv bezeichnet hier Herkunft beziehungsweise Ursprung; „der Höchste“ bewahrt den griechischen Gottestitel.
- source_word: ἀποσταλῇ
  choice: gesandt wird
  rationale: Der passive Aorist-Konjunktiv steht in der Bedingung; das deutsche Präsens Passiv gibt diese Aussage idiomatisch wieder.
- source_word: ἐν ἐπισκοπῇ
  choice: bei einer Heimsuchung
  rationale: ἐπισκοπή kann Heimsuchung, Prüfung, Aufsicht oder ein göttliches Eingreifen bezeichnen. Die Formulierung wahrt diese Offenheit und ist im Deutschen verständlicher als das wörtlichere „in einer Heimsuchung“.
- source_word: μὴ δῷς
  choice: richte … nicht
  rationale: Das griechische Bild lautet wörtlich „gib … nicht“. Mit „das Herz auf etwas richten“ wird die entsprechende Hinwendung im Deutschen natürlich ausgedrückt, ohne sie auf bloßes Denken oder Vertrauen einzuengen.
- source_word: εἰς αὐτὰ
  choice: auf sie
  rationale: Das sächliche Pluralpronomen verweist im Zusammenhang auf Träume und ähnliche Erscheinungen. „Auf sie“ wahrt den Rückverweis; die mögliche explizitere Wiedergabe steht in der Fußnote.
- source_word: τὴν καρδίαν σου
  choice: dein Herz
  rationale: Bewahrt das biblische Bild für die innere Ausrichtung, Aufmerksamkeit und das Vertrauen des Menschen.
theological_decisions:
- issue: Bedeutung von ἐν ἐπισκοπῇ
  choice: bei einer Heimsuchung
  alternative: bei einer Prüfung; unter göttlicher Aufsicht; zur Zeit der Heimsuchung
  rationale: Der griechische Ausdruck lässt offen, ob eine göttliche Heimsuchung, Prüfung, Aufsicht oder der Zeitpunkt eines göttlichen Eingreifens gemeint ist. Die Übersetzung legt ihn nicht einseitig auf Gericht oder Vorsehung fest.
- issue: Wechsel zwischen Singular und Plural
  choice: „es“ für das Gesandte und „sie“ für die Träume beziehungsweise Erscheinungen
  alternative: beide Bezüge durch eine erklärende Umschreibung angleichen
  rationale: Die griechische Form ἀποσταλῇ ist singularisch, während αὐτά im Plural steht. Der Wechsel wird bewahrt, statt die Spannung durch eine interpretierende Harmonisierung zu beseitigen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das traditionelle biblische Bild „dein Herz“ bleibt erhalten. „Heimsuchung“ trägt die religiöse Bedeutung von Gottes prüfendem oder eingreifendem Kommen, ohne den mehrdeutigen griechischen Ausdruck vorschnell festzulegen.
