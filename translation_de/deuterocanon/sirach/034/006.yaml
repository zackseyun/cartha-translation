- from: Wenn es nicht vom Höchsten bei einer Heimsuchung[b] gesandt wird, richte dein Herz nicht auf sie[a].
  to: Wenn es nicht vom Höchsten bei einer Heimsuchung[b] gesandt wird, wende ihnen dein Herz nicht zu[a].
