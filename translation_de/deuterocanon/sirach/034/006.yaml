    issue: „richte dein Herz nicht auf sie“
    rationale: Die deutsche Redewendung bezeichnet meist ein Streben nach oder Begehren von etwas. Für das griechische „gib dein Herz nicht auf sie“ ist „Wende ihnen dein Herz nicht zu“ näher an der gemeinten inneren Zuwendung beziehungsweise dem Vertrauen und zugleich natürlich.
