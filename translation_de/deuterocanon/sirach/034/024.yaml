review_pass:
  verdict: revise
  source_fidelity: Die Übersetzung trifft die Gegenüberstellung von Bauenden und Niederreißenden sowie die rhetorische Frage nach dem Nutzen grundsätzlich. Das griechische πλεῖον ἢ κόπους bedeutet jedoch idiomatischer „mehr als Mühe/Arbeit“ bzw. „außer Mühe“; die Stellung „mehr gewonnen als Mühe“ ist im Deutschen semantisch und syntaktisch missverständlich, weil sie Mühe wie einen Gewinn behandelt.
  naturalness: „Einer baut, und einer reißt nieder“ ist möglich, doch „Der eine baut, der andere reißt nieder“ ist im heutigen Standarddeutsch wesentlich idiomatischer und wahrt die antithetische, generische Struktur. „Was haben sie mehr gewonnen als Mühe?“ klingt unnatürlich; „Was bleibt ihnen mehr als Mühe?“ ist knapp und proverbientypisch.
  terminology: „baut“, „reißt nieder“ und „Mühe“ geben οἰκοδομῶν, καθαιρῶν und κόπους treffend wieder. „Bleibt ihnen“ gibt den resultativen Sinn der Frage nach dem Ertrag wieder, ohne einen technischen oder theologischen Begriff einzutragen.
  issues:
  - severity: medium
    issue: Unidiomatische und potenziell missverständliche Vergleichskonstruktion
    rationale: „Was haben sie mehr gewonnen als Mühe?“ kann so verstanden werden, dass Mühe selbst als Vergleichsgröße des Gewinns erscheint. Die griechische Frage fragt nach dem verbleibenden Nutzen über bloße Mühe hinaus.
  - severity: low
    issue: Wiederholung „Einer … einer“ wirkt im Deutschen weniger natürlich
    rationale: Die griechische Wiederholung εἷς … εἷς markiert den Gegensatz, der im Deutschen idiomatisch durch „der eine … der andere“ wiedergegeben werden kann, ohne die generische Aussage zu verlieren.
