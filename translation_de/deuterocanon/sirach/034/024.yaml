  text: One builds and another tears down—what did they gain beyond toil?[a]
translation:
  language: de
  text: Der eine baut, der andere reißt nieder – was bleibt ihnen mehr als Mühe?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Welchen Nutzen hatten sie außer Mühe?“ Die griechische Vergleichsform kann auch den Sinn haben: Was bleibt ihnen über die Mühe hinaus?'
    reason: lexikalische und idiomatische Alternative zur griechischen Vergleichsform
lexical_decisions:
- source_word: οἰκοδομῶν
  choice: baut
  rationale: Das substantivisch gebrauchte Präsenspartizip bezeichnet in der sprichwörtlichen Gegenüberstellung jemanden, der baut. „baut“ bewahrt das konkrete Bild knapp und natürlich.
- source_word: καθαιρῶν
  choice: reißt nieder
  rationale: καθαιρέω bezeichnet hier das Niederreißen oder Abtragen eines Bauwerks. „reißt nieder“ bildet den direkten Gegensatz zu „baut“.
- source_word: τί ὠφέλησαν
  choice: was haben sie … gewonnen?
  rationale: Der Aorist von ὠφελέω fragt rhetorisch nach dem erzielten Nutzen. Das Perfekt klingt im modernen Deutsch natürlich und gibt den resultativen Sinn wieder; der Plural des griechischen Verbs bezieht beide Handelnden ein.
- source_word: πλεῖον ἢ
  choice: mehr … als
  rationale: Die Vergleichsformel wird formal und verständlich wiedergegeben, ohne sie vorschnell als „nichts außer“ aufzulösen.
- source_word: κόπους
  choice: Mühe
  rationale: κόπος kann mühevolle, erschöpfende Arbeit sowie Beschwernis bezeichnen. „Mühe“ ist idiomatisch und erhält die Pointe vergeblichen Arbeitsaufwands.
theological_decisions:
- issue: Allgemeiner Bezug der substantivischen Partizipien
  choice: Einer baut, und einer reißt nieder
  alternative: Der eine baut, der andere reißt nieder
  rationale: Das Griechische hat zweimal εἷς und keine ausdrücklich genannten Personenbezeichnungen. „Einer … einer“ folgt dieser auffälligen Form eng und vermeidet einen nicht ausgedrückten Geschlechtsbezug.
- issue: Sinn der rhetorischen Frage
  choice: was haben sie mehr gewonnen als Mühe?
  alternative: welchen Nutzen hatten sie außer Mühe?
  rationale: Die gewählte Fassung bewahrt die offene Vergleichsform πλεῖον ἢ und den Nutzenbegriff von ὠφελέω. Die Alternative macht die gemeinte Vergeblichkeit idiomatischer deutlich, legt die Vergleichsform aber stärker aus.
translation_notes:
  register: Knappes, sprichwörtliches und würdiges modernes Standarddeutsch. Der Gedankenstrich markiert den Übergang von der Gegenüberstellung zur rhetorischen Frage. Die bewusst etwas markante Wiederholung „Einer … einer“ spiegelt das griechische εἷς … εἷς.
