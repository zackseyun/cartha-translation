base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/034/027.yaml
  text: Wine is like life to a man[a], if you drink it in due measure. What is life to one diminished by wine? For it too was created for human gladness.
translation:
  language: de
  text: Wein ist für den Menschen dem Leben gleich, wenn du ihn im rechten Maß trinkst. Was ist das Leben für jemanden, dem Wein fehlt?[a] Auch er wurde zur Freude der Menschen geschaffen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder möglicherweise: „Was ist das Leben für jemanden, der durch Wein geschwächt wird?“ Die knappe griechische Dativkonstruktion kann entweder einen Mangel an Wein oder eine Beeinträchtigung durch Wein bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἴσον ζωῆς
  choice: wie das Leben
  rationale: Die Wendung setzt den Wein dem Leben vergleichend an die Seite. „Wie das Leben“ gibt diesen knappen Vergleich natürlich wieder, ohne ihn zu einer Aussage völliger Identität zu verschärfen.
- source_word: ἀνθρώπῳ
  choice: für den Menschen
  rationale: Der Dativ Singular bezeichnet hier den Menschen allgemein. Der generische Singular lässt sich im Deutschen würdig und inklusiv mit „den Menschen“ wiedergeben.
- source_word: ἐὰν πίνῃς αὐτόν
  choice: wenn du ihn … trinkst
  rationale: Die zweite Person Singular und die direkte, sprichwortartige Anrede des Griechischen bleiben erhalten.
- source_word: μέτρῳ αὐτοῦ
  choice: im rechten Maß
  rationale: Die Formulierung bewahrt den Gedanken des Maßes, klingt aber natürlicher als das allzu wörtliche „in seinem Maß“ und ist weniger abstrakt als „mit Mäßigung“.
- source_word: ἐλασσουμένῳ οἴνῳ
  choice: einem, dem es an Wein fehlt
  rationale: Die knappe Dativkonstruktion lässt sich am ehesten als Mangel an Wein verstehen und entspricht dem positiven Schöpfungszweck im Folgesatz. Da auch eine instrumentale Deutung als Schädigung durch Wein möglich ist, wird diese in einer Fußnote bewahrt.
- source_word: ἔκτισται
  choice: wurde … geschaffen
  rationale: Das Perfekt Passiv bezeichnet den Wein als etwas Geschaffenes mit fortbestehendem Zweck. Das deutsche Präteritum Passiv gibt dies idiomatisch wieder.
- source_word: εἰς εὐφροσύνην ἀνθρώποις
  choice: zur Freude der Menschen
  rationale: Die Wendung bezeichnet Freude oder Frohsinn als Zweck des Weins. „Zur Freude der Menschen“ ist klar, würdig und semantisch nah am Griechischen.
theological_decisions:
- issue: Der geschöpfliche Zweck des Weins
  choice: Auch er wurde zur Freude der Menschen geschaffen.
  alternative: Auch er wurde geschaffen, um Menschen froh zu machen.
  rationale: Die Übersetzung bewahrt die positive Aussage über den geschöpflichen Zweck des Weins, während „im rechten Maß“ zugleich dessen begrenzten und verantwortlichen Gebrauch festhält. Sie leitet daraus weder ein Gebot zum Trinken noch ein allgemeines Abstinenzgebot ab.
- issue: Deutung von ἐλασσουμένῳ οἴνῳ
  choice: einem, dem es an Wein fehlt
  alternative: einem, der durch Wein geschwächt wird
  rationale: Die griechische Formulierung ist äußerst knapp. Im Zusammenhang mit der anschließenden Aussage über die zur Freude bestimmte Schöpfung des Weins ist die Mangeldeutung wahrscheinlich; die instrumentale Deutung bleibt jedoch sprachlich möglich und wird deshalb ausdrücklich vermerkt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdig-sprichwortartigem Ton. Die direkte Anrede „du“ folgt dem griechischen Wechsel in die zweite Person. „Im rechten Maß“ vermeidet sowohl altertümliche Wörtlichkeit als auch eine unnötig abstrakte Umschreibung.
