  text: He who offers a sacrifice from the goods of the poor is like one who slaughters a son before his father[a].
translation:
  language: de
  text: Wer ein Opfer aus dem Besitz der Armen darbringt, ist wie einer, der einen Sohn vor seinem Vater schlachtet.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Wer ein Opfer aus dem Besitz der Armen darbringt, ist einer, der einen Sohn vor seinem Vater schlachtet.“ Das Griechische formuliert den sprichwörtlichen Vergleich sehr knapp.'
    reason: lexical_alternative
lexical_decisions:
- source_word: θύων
  choice: ist wie einer, der … schlachtet
  rationale: Das Partizip kann „opfern“ oder „schlachten“ bedeuten. „Schlachtet“ bewahrt hier die erschütternde Gewalttätigkeit des Bildes; „ist wie einer“ macht den im knappen griechischen Spruch vorausgesetzten Vergleich im Deutschen verständlich.
- source_word: υἱὸν
  choice: einen Sohn
  rationale: Im Griechischen steht kein ausdrückliches Possessivpronomen. „Einen Sohn“ bleibt daher näher am Wortlaut als „seinen Sohn“; „Kind“ wäre weiter gefasst als υἱός.
- source_word: ἔναντι
  choice: vor den Augen
  rationale: Die Wendung gibt die unmittelbare Gegenwart anschaulich und idiomatisch wieder. Das schlichtere „vor“ wäre ebenfalls möglich.
- source_word: τοῦ πατρὸς αὐτοῦ
  choice: seines Vaters
  rationale: Das Pronomen bezieht sich am natürlichsten auf den Sohn. Die deutsche Formulierung bewahrt diese Zuordnung, ohne festzulegen, dass der Täter selbst der Vater sei.
- source_word: ὁ προσάγων θυσίαν
  choice: Wer ein Opfer … darbringt
  rationale: „Ein Opfer darbringen“ ist im Deutschen eine natürliche kultische Formulierung und entspricht dem Heranbringen beziehungsweise Darbringen eines Opfers.
- source_word: ἐκ χρημάτων πενήτων
  choice: aus dem Besitz der Armen
  rationale: χρήματα kann Geld, Güter oder Vermögen bezeichnen. „Besitz“ wahrt diese Breite; der Plural πενήτων wird kollektiv mit „der Armen“ wiedergegeben.
theological_decisions:
- issue: Form des Vergleichs zwischen einem ungerechten Opfer und der Tötung eines Sohnes
  choice: Der im Griechischen verdichtete Vergleich wird mit „ist wie“ ausdrücklich gemacht.
  alternative: 'Wörtlicher und härter syntaktisch: „Wer ein Opfer aus dem Besitz der Armen darbringt, schlachtet einen Sohn vor den Augen seines Vaters.“'
  rationale: Der griechische Satz ist ein knapper proverbialer Vergleich. Die ausdrückliche Vergleichsform verhindert, dass die Bildaussage im Deutschen als wörtliche Gleichsetzung oder als zweite tatsächliche Handlung missverstanden wird, ohne die moralische Schärfe abzuschwächen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Darbringt“ erhält den kultischen Ton, während „schlachtet“ die beabsichtigte Härte des Bildes wahrt. Die Satzstellung setzt zuerst die verurteilte Opferhandlung und danach den schockierenden Vergleich.
