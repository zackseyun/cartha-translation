base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/034/030.yaml
  text: Drunkenness multiplies the anger of a foolish man into stumbling[a], diminishing strength and producing wounds.
translation:
  language: de
  text: Trunkenheit steigert den Zorn eines törichten Mannes bis zum Straucheln[a]; sie mindert die Kraft und verursacht Wunden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „bis zum Anstoß“; πρόσκομμα kann das Straucheln, einen Anlass zum Straucheln oder den daraus folgenden Sturz bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πληθύνει
  choice: steigert
  rationale: Das Verb bezeichnet eine Vermehrung oder Verstärkung. Bei Zorn ist „steigert“ im modernen Deutschen natürlich und bewahrt die kausative Aussage.
- source_word: μέθη
  choice: Trunkenheit
  rationale: Das Substantiv bezeichnet den Zustand des Betrunkenseins. „Trunkenheit“ entspricht dem Weisheitsstil und ist allgemein verständlich.
- source_word: θυμὸν
  choice: Zorn
  rationale: Im Zusammenhang mit Trunkenheit bezeichnet θυμός vor allem heftig aufflammenden Zorn; „Zorn“ erhält die kräftige Ausdrucksweise.
- source_word: ἄφρονος
  choice: eines törichten Mannes
  rationale: Der maskuline Genitiv Singular bezeichnet hier den typischen törichten Mann der Weisheitsliteratur und wird grammatisch sowie semantisch genau wiedergegeben.
- source_word: εἰς πρόσκομμα
  choice: bis zum Straucheln
  rationale: εἰς drückt die Folge oder Zielrichtung aus, während πρόσκομμα das Bild des Anstoßens und Strauchelns trägt. Die Formulierung bewahrt dieses Bild, ohne es vorschnell als völligen Untergang auszulegen.
- source_word: ἐλαττῶν
  choice: mindert
  rationale: Das Partizip beschreibt eine weitere schädliche Wirkung. „Mindert“ ist knapp und entspricht dem Sinn des Verminderns.
- source_word: ἰσχὺν
  choice: die Kraft
  rationale: ἰσχύς bezeichnet hier körperliche oder persönliche Stärke. „Kraft“ ist die direkte und natürliche deutsche Entsprechung.
- source_word: προσποιοῦν
  choice: verursacht
  rationale: In diesem Zusammenhang bezeichnet das Verb das Hervorbringen einer zusätzlichen schädlichen Folge. „Verursacht“ klingt im Deutschen natürlicher als „erzeugt“.
- source_word: τραύματα
  choice: Wunden
  rationale: Das Wort bezeichnet konkrete Verletzungen oder Wunden; „Wunden“ erhält die körperliche und gewaltsame Bildhaftigkeit.
theological_decisions:
- issue: Repräsentatives Maskulinum in der Weisheitsliteratur
  choice: „eines törichten Mannes“
  alternative: „eines törichten Menschen“ oder „eines Toren“
  rationale: Die griechische Form ist maskulin und singularisch und zeichnet einen typischen männlichen Toren. Die gewählte Fassung wahrt diese Form, ohne die Aussage auf alle Menschen auszudehnen.
- issue: Folgesinn von εἰς πρόσκομμα
  choice: „bis zum Straucheln“
  alternative: „zum Anstoß“, „bis zum Sturz“ oder eine Satzdeutung, nach der der Zorn selbst zum Fallstrick wird
  rationale: Die Übersetzung erhält die Bewegungs- und Fallmetaphorik sowie die Aussage einer schädlichen Folge, legt aber weder einen rein moralischen Anstoß noch endgültiges Verderben fest.
translation_notes:
  register: Moderne, würdige Standardsprache. Der erste Halbvers folgt der griechischen Bildsprache; der zweite wird als koordinierter deutscher Satz wiedergegeben, damit die fortgesetzten Wirkungen der Trunkenheit klar und natürlich klingen.
