  yaml_path: translation/deuterocanon/sirach/034/022.yaml
  text: Bread for the needy is the life of the poor[a]; the one who deprives them of it is a man of blood.
translation:
  language: de
  text: Das Brot der Bedürftigen ist das Leben der Armen; wer ihnen das Leben raubt, ist ein Mann des Blutes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „ein Mensch des Blutes“; gemeint sein kann auch „ein Mörder“ oder „ein mit Blutschuld beladener Mensch“.'
    reason: Die griechische Wendung ἄνθρωπος αἱμάτων ist stark semitisch geprägt und lässt sich im Deutschen nicht zugleich wörtlich und völlig idiomatisch wiedergeben.
lexical_decisions:
- source_word: ἄρτος
  choice: Brot
  rationale: Die konkrete Grundnahrung und ihre sinnbildliche Bedeutung als Lebensunterhalt bleiben erhalten.
- source_word: ἐπιδεομένων
  choice: der Bedürftigen
  rationale: Das substantivierte Partizip bezeichnet Menschen, denen das Lebensnotwendige fehlt; der deutsche Genitiv bildet die griechische Fügung knapp ab.
- source_word: ζωὴ πτωχῶν
  choice: das Leben der Armen
  rationale: Die nominale Aussage und der Genitiv werden formal bewahrt; gemeint ist, dass dieses Brot das Leben der Armen erhält.
- source_word: ὁ ἀποστερῶν αὐτὴν
  choice: wer ihnen dieses Leben raubt
  rationale: ἀποστερέω bezeichnet Entziehen, Vorenthalten oder Berauben. Das feminine αὐτήν bezieht sich grammatisch am ehesten auf die feminine ζωή, nicht auf den maskulinen ἄρτος. Die betroffenen Armen werden im Deutschen zur Verständlichkeit ausdrücklich genannt.
- source_word: ἄνθρωπος αἱμάτων
  choice: ein Mann des Blutes
  rationale: Die semitisch geprägte griechische Wendung wird bewusst erhalten, damit die scharfe Gleichsetzung des Entzugs von Lebensunterhalt mit Blutschuld nicht abgeschwächt oder vorschnell auf den juristischen Begriff „Mörder“ festgelegt wird.
theological_decisions:
- issue: Moralische Tragweite von ἄνθρωπος αἱμάτων
  choice: Mann des Blutes
  alternative: Mörder; ein mit Blutschuld beladener Mensch
  rationale: 'Die wörtlich geprägte Wendung bewahrt die Spannung: Wer Armen das Lebensnotwendige entzieht, zieht Blutschuld auf sich. Sie legt zugleich nicht fest, ob ausschließlich eine vollendete Tötung gemeint ist.'
- issue: Bezug des Pronomens αὐτήν
  choice: dieses Leben
  alternative: das Brot beziehungsweise den Lebensunterhalt
  rationale: Das feminine Pronomen stimmt grammatisch mit ζωή („Leben“) überein, während ἄρτος („Brot“) maskulin ist. Daher wird der wahrscheinlichste syntaktische Bezug im Text sichtbar gemacht, ohne die sachliche Verbindung zum Brot aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Parallelismus und die Härte der ethischen Aussage bleiben erhalten. „Mann des Blutes“ klingt bewusst bildhaft und leicht fremd; die Fußnote erschließt die Bedeutung, ohne die Mehrdeutigkeit im Haupttext aufzulösen.
