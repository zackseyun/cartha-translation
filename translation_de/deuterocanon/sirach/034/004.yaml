  text: From the unclean[a], what will be made clean? And from falsehood, what will become true?
translation:
  language: de
  text: Was kann aus Unreinem rein werden? Und was kann aus Falschem wahr werden?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Und was wird aus Falschem die Wahrheit sagen?« Das griechische Verb kann auch »die Wahrheit sagen« oder »sich als wahr erweisen« bedeuten; im parallelen Aufbau mit »rein werden« liegt hier jedoch »wahr werden« nahe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ
  choice: aus
  rationale: Die Präposition bezeichnet in beiden Satzhälften den Ursprung. »Aus« gibt diesen Herkunftssinn im Deutschen natürlich wieder.
- source_word: ἀκαθάρτου
  choice: Unreinem
  rationale: Das substantivierte Adjektiv im Genitiv bleibt allgemein und wird nicht unnötig auf einen bestimmten Gegenstand oder ausschließlich auf rituelle Unreinheit eingeengt.
- source_word: τί
  choice: was
  rationale: Das Fragepronomen leitet jeweils eine rhetorische Frage nach dem Ergebnis ein und ist unpersönlich zu verstehen.
- source_word: καθαρισθήσεται
  choice: kann … rein werden
  rationale: Der griechische Futur Passiv beschreibt das Reinwerden beziehungsweise Gereinigtwerden. Die deutsche rhetorische Form mit »kann« bringt die implizierte Unmöglichkeit natürlich zum Ausdruck, ohne einen Handelnden hinzuzufügen.
- source_word: ψευδοῦς
  choice: Falschem
  rationale: Das substantivierte Adjektiv wird bewusst allgemein wiedergegeben. So bleibt offen, ob eine Lüge, eine Unwahrheit oder etwas anderweitig Falsches gemeint ist.
- source_word: ἀληθεύσει
  choice: kann … wahr werden
  rationale: 'Im parallelen Aufbau liegt ein resultatives Verständnis nahe: Aus etwas Falschem entsteht nichts Wahres. Die mögliche Bedeutung »die Wahrheit sagen« bleibt in der Fußnote erhalten.'
theological_decisions:
- issue: Bedeutung von ἀληθεύσει im sprichwörtlichen Parallelismus
  choice: 'resultativ: »wahr werden«'
  alternative: 'sprechaktbezogen: »die Wahrheit sagen«; ferner: »sich als wahr erweisen«'
  rationale: 'Beide rhetorischen Fragen stellen ein Ergebnis seinem Ursprung gegenüber: Reines aus Unreinem und Wahres aus Falschem. Die resultative Wiedergabe wahrt diesen Parallelismus, ohne die anderen lexikalisch möglichen Lesarten zu verschweigen.'
translation_notes:
  register: Modernes, allgemein verständliches und zugleich würdiges Deutsch. Die knappe Parallelstruktur der beiden rhetorischen Fragen bleibt erhalten. »Unreinem« und »Falschem« bewahren die abstrakte, nicht näher bestimmte Ausdrucksweise des Griechischen.
