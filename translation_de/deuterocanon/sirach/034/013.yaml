lexical_decisions:
- source_word: לא ישא פנים אל דל
  choice: Er ist dem Armen gegenüber nicht parteiisch
  rationale: Die Wendung נשא פנים bezeichnet das Gewähren parteiischer Begünstigung oder Bevorzugung. Die Formulierung gibt die Aussage idiomatisch wieder, ohne אל unbegründet als »gegen« zu deuten.
- source_word: דל
  choice: der Arme
  rationale: דל kann einen armen, schwachen oder sozial geringgestellten Menschen bezeichnen. »Der Arme« ist hier die unmittelbarste Wiedergabe.
- source_word: תחנוני
  choice: das Flehen
  rationale: תחנונים bezeichnet inständige Bitten um Erbarmen oder Hilfe. Das deutsche Kollektiv »Flehen« bewahrt die Eindringlichkeit und lässt sich trotz der hebräischen Pluralform natürlich lesen.
- source_word: מצוק
  choice: des Bedrängten
  rationale: מצוק bezeichnet einen Menschen, der unter Druck, Not oder Bedrückung steht. »Bedrängter« hält diese Bedeutungsbreite besser offen als das enger sozial verstandene »Unterdrückter«.
- source_word: ישמע
  choice: hört
  rationale: Das Yiqtol wird als allgemeingültige Aussage der Weisheitsliteratur im Präsens wiedergegeben.
- source_word: πνεῦμα φοβουμένων Κύριον ζήσεται, ἡ γὰρ ἐλπὶς αὐτῶν ἐπὶ τὸν σώζοντα αὐτούς
  choice: nur in der Fußnote wiedergegeben
  rationale: Der griechische Zeuge bietet an dieser Stelle eine wesentlich andere Textgestalt. Da ein hebräischer Text erhalten ist, bestimmt dieser den Haupttext; die bedeutende griechische Variante wird dokumentiert.
theological_decisions:
- issue: Abweichung zwischen dem erhaltenen hebräischen und dem griechischen Textzeugen
  choice: Der Haupttext folgt dem hebräischen Geniza-Text; die griechische Lesart steht in der Fußnote.
  alternative: »Der Geist derer, die den Herrn fürchten, wird leben; denn ihre Hoffnung ruht auf dem, der sie rettet.«
  rationale: Die griechische Fassung ist keine bloße Wortvariante, sondern spiegelt eine wesentlich andere Textform wider. Beide Überlieferungen werden daher sichtbar gehalten, ohne sie miteinander zu harmonisieren.
- issue: Unparteilichkeit gegenüber dem Armen
  choice: »dem Armen gegenüber nicht parteiisch«
  alternative: »gegen den Armen nicht parteiisch«
  rationale: Die hebräische Präposition אל bezeichnet hier den Bezug der Parteilichkeit, nicht eindeutig eine Benachteiligung. Die Übersetzung bewahrt die Spannung, dass gerechtes Handeln weder parteiische Bevorzugung noch Missachtung bedeutet, während der zweite Satz Gottes Hören auf den Bedrängten aussagt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Nicht parteiisch« gibt das hebräische Rechts- und Beziehungsidiom verständlich wieder; »Flehen« und »Bedrängter« halten den poetischen Parallelismus knapp und natürlich.
