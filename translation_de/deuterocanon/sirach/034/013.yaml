translation:
  language: de
  text: Er ist dem Armen gegenüber nicht parteiisch[a] und hört das Flehen des Bedrängten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Textzeuge lautet: »Der Geist derer, die den Herrn fürchten, wird leben; denn ihre Hoffnung ruht auf dem, der sie rettet.« Hier bewahrt der griechische Text eine wesentlich andere Textform als der erhaltene hebräische Text.'
