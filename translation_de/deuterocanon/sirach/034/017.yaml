base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/034/017.yaml
  text: The cry of the poor passes through the cloud[a], and until it reaches him it does not rest. It does not cease until God attends[b], and the righteous Judge executes judgment.
translation:
  language: de
  text: Der Hilferuf des Armen dringt durch die Wolke, und bis er zu Gott gelangt, kommt er nicht zur Ruhe. Er lässt nicht nach, bis Gott sich seiner annimmt und als gerechter Richter Recht schafft.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Gericht/Recht tut“; auch möglich: „Gericht hält“.'
    reason: lexical_alternative
  - marker: b
    text: 'Die griechische Überlieferung weicht hier erheblich ab: „Die Augen des Herrn ruhen auf denen, die ihn lieben …“ Der erhaltene hebräische Text lautet wie oben wiedergegeben; deshalb ist der Wortlaut dieses Verses auf der Ebene der Quellenüberlieferung unsicher.'
    reason: textual_variant
lexical_decisions:
- source_word: שועת דל
  choice: Der Hilferuf des Armen
  rationale: שועה bezeichnet einen dringlichen Ruf um Hilfe; דל meint einen armen, geringen oder sozial schwachen Menschen. Die Formulierung bewahrt sowohl die Notlage als auch die soziale Dimension.
- source_word: ענן חלפה
  choice: dringt durch die Wolke
  rationale: Das Bild zeigt, wie der Hilferuf die Wolke als scheinbare Grenze auf dem Weg zu Gott durchquert. „Dringt durch“ gibt die zielgerichtete Bewegung im Deutschen anschaulich wieder.
- source_word: ועד תגיע לא תנוח
  choice: und bis er zu Gott gelangt, kommt er nicht zur Ruhe
  rationale: Die hebräischen femininen Verbformen beziehen sich auf שועה, den Hilferuf. Das im Hebräischen unausgesprochene Ziel wird aus dem folgenden Gottesbezug erschlossen und für verständliches Deutsch als „zu Gott“ ausgedrückt.
- source_word: לא תמוש
  choice: Er lässt nicht nach
  rationale: מוש kann „weichen“ oder „aufhören“ bedeuten. Bezogen auf den fortdauernden Hilferuf bezeichnet „lässt nicht nach“ dessen beharrliche Dringlichkeit.
- source_word: יפקוד אל
  choice: bis Gott sich seiner annimmt
  rationale: פקד umfasst beachten, aufsuchen, sich annehmen und tätig eingreifen. Die gewählte Wendung bezeichnet Gottes zugewandte Reaktion, ohne ihre konkrete Form unnötig festzulegen.
- source_word: ושופט צדק
  choice: und als gerechter Richter
  rationale: שופט צדק charakterisiert Gott als einen Richter, dessen Handeln gerecht ist. „Als“ macht im Deutschen deutlich, dass Gott und der gerechte Richter derselbe Handelnde sind.
- source_word: יעשה משפט
  choice: Recht schafft
  rationale: Die hebräische Wendung bedeutet wörtlich „Gericht/Recht tun“. „Recht schaffen“ bewahrt den forensischen und zugleich rettenden Sinn im Kontext des Armen.
theological_decisions:
- issue: Unausgesprochenes Ziel des Hilferufs
  choice: „zu Gott“ im Haupttext ergänzt
  alternative: „bis er ankommt“ ohne ausdrückliches Ziel
  rationale: Das Hebräische nennt das Ziel zunächst nicht ausdrücklich, nennt aber unmittelbar danach Gott. Die Ergänzung macht den natürlichen Zusammenhang deutlich, ohne einen neuen theologischen Gedanken einzuführen.
- issue: Beziehung zwischen Gott und dem gerechten Richter
  choice: Gott handelt „als gerechter Richter“
  alternative: „und der gerechte Richter schafft Recht“ als formal selbstständige Bezeichnung
  rationale: Die Satzfolge bezeichnet am natürlichsten denselben göttlichen Handelnden. „Als“ verhindert im Deutschen den irreführenden Eindruck zweier verschiedener Handelnder.
- issue: Bedeutung von משפט
  choice: „Recht schafft“
  alternative: „Gericht hält“ oder „ein Urteil vollstreckt“
  rationale: משפט kann Recht, Gericht oder Urteil bezeichnen. „Recht schafft“ erhält die rechtliche Bildwelt und lässt zugleich offen, in welcher konkreten Weise Gott dem Armen Gerechtigkeit verschafft.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das poetische Bild des durch die Wolke dringenden Hilferufs und seine beharrliche Bewegung werden bewahrt; ungebräuchliche Wörtlichkeiten werden nur dort geglättet, wo dies für ein natürliches Verständnis nötig ist.
