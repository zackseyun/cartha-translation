base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/034/020.yaml
  text: The kindness of Yahweh is fitting in a time of distress[a], like a rain cloud in a time of drought.
translation:
  language: de
  text: Wie schön ist die Güte Jahwes in der Zeit der Bedrängnis[a], wie eine Regenwolke zur Zeit der Dürre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Griechisch: »Der Höchste hat kein Gefallen an den Opfergaben der Gottlosen; auch erwirkt eine Vielzahl von Opfern keine Sühne für Sünden.« Der hebräische und der griechische Textzeuge weichen an dieser Stelle erheblich voneinander ab.'
    reason: textual_variant
lexical_decisions:
- source_word: נאה
  choice: ist wohltuend
  rationale: Das Adjektiv bezeichnet etwas Angenehmes, Schönes oder Passendes. »Ist wohltuend« gibt im Zusammenhang die als Hilfe erfahrene Güte natürlich wieder, ohne den Ausdruck auf bloße ästhetische Schönheit zu verengen.
- source_word: חסד
  choice: Güte
  rationale: »Güte« bezeichnet hier die hilfreiche, wohlwollende Zuwendung Jahwes und wahrt die Bedeutungsbreite des hebräischen Wortes besser als das engere »Barmherzigkeit«.
- source_word: יהוה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: בזמן מצוקה
  choice: in einer Zeit der Bedrängnis
  rationale: Die Formulierung bezeichnet eine Zeit von Druck, Not und bedrängender Lage; »Bedrängnis« wahrt diesen ernsten Ton.
- source_word: כעב חזיזים
  choice: wie eine Regenwolke
  rationale: Das Bild meint eine Wolke, die in ausgedörrter Zeit den ersehnten Regen bringt. »Regenwolke« macht die lebenspendende Funktion deutlich, ohne unnötig Bedrohlichkeit einzutragen.
- source_word: בעת בצרת
  choice: in einer Zeit der Dürre
  rationale: Die Wendung verweist auf Trockenheit beziehungsweise ausgedörrte Verhältnisse; »Dürre« ist dafür die klare, idiomatische deutsche Entsprechung.
theological_decisions:
- issue: Erhebliche Abweichung zwischen dem hebräischen und dem griechischen Textzeugen
  choice: Der erhaltene hebräische Text steht im Haupttext; die stark abweichende griechische Lesart wird in einer Fußnote vollständig wiedergegeben.
  alternative: »Der Höchste hat kein Gefallen an den Opfergaben der Gottlosen; auch lässt er sich nicht durch eine Vielzahl von Opfern wegen der Sünden versöhnen.«
  rationale: Da für diesen Vers ein hebräischer Text mit hoher Zuverlässigkeit vorliegt, bildet er die Grundlage der Übersetzung. Die griechische Überlieferung bietet jedoch einen völlig anderen Vers und muss deshalb zur transparenten Darstellung der Textgeschichte dokumentiert werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der parallel gebaute Vergleich bleibt knapp und bildhaft; »wohltuend« bringt die in der Not erfahrene Angemessenheit und Schönheit der göttlichen Güte idiomatisch zum Ausdruck.
