lexical_decisions:
- source_word: πολλὰ ἑόρακα
  choice: Vieles habe ich gesehen
  rationale: Das griechische Zeugnis bietet für diesen Vers einen zusammenhängenden Text. „Vieles habe ich gesehen“ gibt das Perfekt idiomatisch und würdig wieder.
- source_word: ἐν τῇ ἀποπλανήσει μου
  choice: auf meinen Irrwegen
  rationale: ἀποπλάνησις kann Umherirren, Abirren oder Verfehlung bezeichnen. „Auf meinen Irrwegen“ bewahrt sowohl den Aspekt des Unterwegsseins als auch den möglichen Beiklang des Abirrens, ohne ihn eindeutig moralisch festzulegen.
- source_word: πλείονα τῶν λόγων μου
  choice: übersteigt meine Worte
  rationale: Die knappe griechische Vergleichsformulierung besagt, dass die Einsicht größer oder umfangreicher ist als das sprachlich Ausgedrückte. Die deutsche Formulierung ist natürlich, ohne die Aussage näher zu bestimmen.
- source_word: σύνεσίς μου
  choice: meine Einsicht
  rationale: σύνεσις bezeichnet in der Weisheitsliteratur verständige Einsicht oder Urteilsvermögen. „Einsicht“ ist hier prägnant und allgemein verständlich.
theological_decisions:
- issue: Abweichung zwischen dem überlieferten hebräischen Text und dem griechischen Verszeugen
  choice: Der Vers wird nach dem griechischen Zeugnis übersetzt; die Textabweichung wird in einer Fußnote offengelegt.
  alternative: Den vorhandenen hebräischen Satz übersetzen, der inhaltlich von diesem Vers abweicht und vermutlich versetztes Material bietet.
  rationale: Der angegebene hebräische Text entspricht nicht dem Sinn von Sirach 34,11 und ist ausdrücklich als erhebliche Abweichung gekennzeichnet. Das griechische Zeugnis bietet dagegen einen kohärenten Text für diese Versstelle. Die Unsicherheit der Überlieferung wird nicht verschwiegen.
- issue: Bedeutungsbreite von ἀποπλάνησις
  choice: „auf meinen Irrwegen“
  alternative: „auf meinen Reisen“, „bei meinem Umherirren“ oder „in meiner Verirrung“
  rationale: Die gewählte Fassung hält die Spannung zwischen äußerem Umherziehen und innerem Abirren offen und legt den Ausdruck nicht vorschnell rein geografisch oder moralisch aus.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die autobiografische Aussage bleibt knapp; „Irrwege“ erhält die Mehrdeutigkeit zwischen Reisen, Umherirren und Abirren.
