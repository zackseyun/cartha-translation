translation:
  language: de
  text: 'Eine Traumvision ist dies gegenüber jenem: das Abbild eines Gesichts gegenüber einem Gesicht.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, formnäher: »Eine Vision von Träumen ist dies gegenüber diesem: ein Abbild eines Gesichts vor einem Gesicht.« Das Griechische ist knapp und elliptisch; die Gegenüberstellung kann auch als Entsprechung oder Spiegelung verstanden werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅρασις ἐνυπνίων
  choice: Traumvision
  rationale: Das kompakte deutsche Kompositum bewahrt die enge Verbindung von »Vision« und »Träumen«, ohne die knappe griechische Wendung unnötig zu entfalten.
- source_word: τοῦτο κατὰ τούτου
  choice: dieses gegenüber jenem
  rationale: Die elliptische Gegenüberstellung bleibt erhalten. »Gegenüber« nimmt zugleich das folgende κατέναντι auf; »jenem« gibt im Deutschen den vergleichenden Bezug natürlicher wieder, obwohl das Griechische zweimal dasselbe Demonstrativpronomen verwendet.
- source_word: κατέναντι προσώπου
  choice: gegenüber einem Gesicht
  rationale: κατέναντι bezeichnet eine Stellung vor beziehungsweise gegenüber etwas. Die Wiedergabe vermeidet die idiomatische, hier strukturell missverständliche Formulierung »von Angesicht zu Angesicht«.
- source_word: ὁμοίωμα προσώπου
  choice: das Abbild eines Gesichts
  rationale: »Abbild« bezeichnet eine ähnliche Darstellung, ohne Identität zu behaupten, und klingt im Deutschen natürlicher als »Ähnlichkeit eines Gesichts«.
theological_decisions:
- issue: Aussagekraft des Bildworts über Träume
  choice: Der Text stellt die Traumvision als Gegenüberstellung beziehungsweise Abbild dar, ohne ausdrücklich festzulegen, was genau abgebildet wird.
  alternative: Die Aussage kann deutend so verstanden werden, dass Träume bloße Spiegelbilder der Wirklichkeit seien.
  rationale: Der unmittelbare Zusammenhang warnt vor dem Vertrauen auf Träume; der griechische Vers selbst bleibt jedoch knapp und elliptisch. Die Übersetzung bewahrt diese Spannung und fügt keine ausdrückliche philosophische Unterscheidung zwischen Abbild und Wirklichkeit ein.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die sprichwortartige Kürze und die bewusst schwer aufzulösende Gegenüberstellung des Griechischen bleiben erhalten; die Fußnote dokumentiert die formnähere Alternative.
