base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/034/031.yaml
  text: At a banquet of wine do not rebuke your neighbor[a], and do not belittle him in his gladness; do not speak a word of reproach to him, and do not distress him by making demands.
translation:
  language: de
  text: Bei einem Festmahl mit Wein weise deinen Nächsten nicht zurecht und setze ihn in seiner Freude nicht herab. Sag ihm kein vorwurfsvolles Wort und bedränge ihn nicht mit einer Forderung.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »bedränge ihn nicht, indem du Rückzahlung verlangst«; das griechische Wort kann eine Forderung oder Einforderung bezeichnen, häufig im Sinn des Eintreibens einer Schuld.'
    reason: lexical_alternative
lexical_decisions:
- source_word: συμποσίῳ οἴνου
  choice: bei einem Weingelage
  rationale: Die Wendung bezeichnet ein geselliges Mahl mit Wein. »Weingelage« ist im Deutschen knapp, verständlich und wahrt den festlichen sozialen Rahmen, ohne das umgangssprachlichere »Trinkgelage« zu wählen.
- source_word: ἐλέγξῃς
  choice: weise ... nicht zurecht
  rationale: Im zwischenmenschlichen Weisheitskontext bezeichnet das Verb tadelndes Zurechtweisen; die Formulierung ist natürlich und setzt kein förmliches Überführen voraus.
- source_word: πλησίον
  choice: deinen Nächsten
  rationale: »Nächster« bewahrt den ethischen Bedeutungsgehalt, auch wenn hier unmittelbar ein Mitgast oder Bekannter gemeint sein kann.
- source_word: ἐξουδενώσῃς
  choice: setze ... nicht herab
  rationale: Das Verb bedeutet, jemanden für nichts zu achten oder gering zu behandeln. »Herabsetzen« gibt die soziale Handlung wieder, ohne bereits eine öffentliche Demütigung festzulegen.
- source_word: ἐν εὐφροσύνῃ αὐτοῦ
  choice: in seiner Freude
  rationale: Die Wendung beschreibt seine festliche Freude. Die schlichte Formulierung ist gegenwärtig und würdig.
- source_word: λόγον ὀνειδισμοῦ
  choice: kein Wort des Vorwurfs
  rationale: Die Genitivverbindung wird eng wiedergegeben und lässt die Spannweite zwischen Vorwurf, Schmähung und Beschimpfung bestehen.
- source_word: θλίψῃς
  choice: bedränge
  rationale: Das Verb kann drücken, bedrängen oder in Bedrängnis bringen bedeuten. Im Zusammenhang mit einer Forderung bringt »bedrängen« sowohl persönlichen als auch praktischen Druck zum Ausdruck.
- source_word: ἐν ἀπαιτήσει
  choice: mit einer Forderung
  rationale: Das Substantiv bezeichnet eine Forderung oder Einforderung und kann besonders das Eintreiben einer geschuldeten Leistung meinen. Da eine Schuld nicht ausdrücklich genannt wird, bleibt der Haupttext weiter gefasst.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch im Ton eines knappen Weisheitsspruchs. Die vier Verbote bleiben parallel gestaltet; die mögliche finanzielle Bedeutung der Schlusswendung wird nicht in den Haupttext hineingezwungen, sondern in der Fußnote offengehalten.
