  text: One who fears the Lord will not be shaken, and will not be afraid, for he is his hope.
translation:
  language: de
  text: Wer den Herrn fürchtet, wird nicht erschrecken und nicht verzagen, denn er ist seine Hoffnung.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die für diesen Vers gelieferte hebräische Zeile aus den Kairoer Geniza-Handschriften lautet: „Er wird den Schrei einer Waise nicht unbeachtet lassen, noch den einer Witwe, wenn sie ihre Klage mehrt.“ Sie entspricht nicht dem griechischen Wortlaut an dieser Stelle und beruht wahrscheinlich auf einer falschen Vers- oder Zeilenzuordnung in den Quelldaten.'
    reason: textual_variant
lexical_decisions:
- source_word: ὁ φοβούμενος Κύριον
  choice: Wer den Herrn fürchtet
  rationale: Das substantivierte Partizip wird als allgemeiner Relativsatz wiedergegeben. Obwohl die gelieferte hebräische Zeile nicht zu diesem Vers passt, bietet der griechische Paralleltext hier eine in sich stimmige Lesart.
- source_word: οὐ μὴ πτοηθῇ
  choice: wird nicht erschrecken
  rationale: πτοέω bezeichnet ein Erschrecken oder eine durch Furcht ausgelöste Beunruhigung. „Erschrecken“ ist direkt und lässt die emotionale wie destabilisierende Nuance offen.
- source_word: οὐ μὴ δειλιάσῃ
  choice: nicht verzagen
  rationale: δειλιάω kann Furcht oder den Verlust des Mutes ausdrücken. „Verzagen“ unterscheidet die zweite Aussage von bloßem Erschrecken und bewahrt den Gedanken nachlassenden Mutes.
- source_word: ἐλπὶς
  choice: Hoffnung
  rationale: Das Wort bezeichnet Hoffnung beziehungsweise den Grund des Vertrauens. „Hoffnung“ ist die direkte, theologisch offene Wiedergabe.
- source_word: αὐτὸς
  choice: er
  rationale: Das betonte Pronomen verweist am natürlichsten auf den Herrn. Die knappe pronominale Wiedergabe erhält die Form des griechischen Satzes.
theological_decisions:
- issue: Abweichung zwischen der gelieferten hebräischen Zeile und dem griechischen Text von Sirach 34,14
  choice: Die griechische Lesart steht im Haupttext.
  alternative: „Er wird den Schrei einer Waise nicht unbeachtet lassen, noch den einer Witwe, wenn sie ihre Klage mehrt.“
  rationale: Die gelieferte hebräische Zeile behandelt die Klage von Waise und Witwe und entspricht inhaltlich nicht dem griechischen Text dieses Verses. Da die Daten ausdrücklich eine erhebliche Zuordnungsabweichung anzeigen, dient der kohärente griechische Paralleltext als Textgrundlage; die hebräische Zeile wird aus Gründen der Transparenz in der Fußnote dokumentiert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallelen Verben „erschrecken“ und „verzagen“ bilden die beiden griechischen Furchtausdrücke unterscheidbar ab, ohne die Zusage zu überdeuten.
