  text: A furnace tests the tempering in dipping[b][a]; so wine tests hearts in the strife of the proud.
translation:
  language: de
  text: Ein Ofen prüft die Härtung beim Eintauchen[a]; ebenso prüft der Wein die Herzen im Streit der Hochmütigen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Wortlaut des ersten Satzteils ist schwierig. Gemeint sein kann auch: »Der Ofen prüft eine Schneide beim Abschrecken« oder allgemeiner: »Der Ofen prüft gehärtetes Metall beim Eintauchen«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »im Kampf der Hochmütigen«. Das griechische Wort kann einen Kampf oder allgemein einen Streit bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: κάμινος
  choice: Schmelzofen
  rationale: Das Wort bezeichnet einen Ofen für starke Hitze. »Schmelzofen« erhält hier den Zusammenhang der Metallbearbeitung und klingt im modernen Deutsch natürlicher als das allgemeinere »Ofen«.
- source_word: δοκιμάζει
  choice: prüft
  rationale: Das Verb bezeichnet eine Prüfung, durch die Beschaffenheit oder Bewährung erkennbar wird. »Prüft« gibt diese wertende Bedeutung knapp wieder.
- source_word: στόμωμα
  choice: Härtung
  rationale: Das schwierige Substantiv kann im metallurgischen Zusammenhang das Härten beziehungsweise Gehärtete, möglicherweise auch eine gehärtete Schneide, bezeichnen. »Härtung« bewahrt den Prozessbezug, ohne einen bestimmten Metallgegenstand vorauszusetzen.
- source_word: ἐν βαφῇ
  choice: beim Eintauchen
  rationale: βαφή bezeichnet ein Eintauchen und kann fachsprachlich auf das Abschrecken von Metall bezogen sein. Die allgemeinere Wiedergabe lässt die unsichere technische Einzelbedeutung offen.
- source_word: οὕτως
  choice: ebenso
  rationale: Das Adverb leitet den Vergleich zwischen der Metallprüfung und der Wirkung des Weins klar und idiomatisch ein.
- source_word: οἶνος
  choice: der Wein
  rationale: Direkte und natürliche Entsprechung; der bestimmte Artikel ist im Deutschen bei einer allgemein ausgesagten Wirkung des Weins idiomatisch.
- source_word: καρδίας
  choice: die Herzen
  rationale: Der Plural bleibt erhalten. »Herzen« bezeichnet wie im griechischen Text das innere Wesen und die Gesinnung der Menschen.
- source_word: ἐν μάχῃ
  choice: im Streit
  rationale: μάχη kann sowohl Kampf als auch Streit oder Konflikt bedeuten. Im Zusammenhang mit Wein und Hochmut ist »Streit« verständlich, ohne zwingend eine militärische Schlacht anzunehmen.
- source_word: ὑπερηφάνων
  choice: der Hochmütigen
  rationale: Die substantivierte Form bewahrt die moralische Charakterisierung. »Hochmütig« entspricht der negativen Wertung von ὑπερήφανος genauer als das mitunter neutralere »stolz«.
theological_decisions:
- issue: Deutung von στόμωμα ἐν βαφῇ im schwierigen ersten Halbvers
  choice: 'Metallurgisches Bild: Der Schmelzofen prüft die Härtung beim Eintauchen.'
  alternative: 'Der Ofen prüft eine Schneide beim Abschrecken; oder: Der Ofen prüft gehärtetes Metall beim Eintauchen.'
  rationale: Die Wendung ist lexikalisch unsicher und bezeichnet wahrscheinlich einen Vorgang der Metallhärtung. Der Haupttext bewahrt das Bild von Hitze, Härtung und Eintauchen, ohne es auf eine Schneide oder ein bestimmtes technisches Verfahren festzulegen.
- issue: Bedeutungsumfang von μάχη
  choice: Streit
  alternative: Kampf
  rationale: Das griechische Wort lässt beide Bedeutungen zu. »Streit« passt zur möglichen Entlarvung des inneren Menschen durch Wein, während die Fußnote die stärkere Lesart »Kampf« offenhält.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der knappe Parallelismus des griechischen Spruchs bleibt erhalten. Die technisch unsichere Metallsprache wird im Haupttext verständlich, aber nicht überpräzise wiedergegeben; Alternativen stehen in der Fußnote.
