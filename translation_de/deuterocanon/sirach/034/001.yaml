  text: Empty and false hopes are for a senseless man[b][a], and dreams give wings to fools.
translation:
  language: de
  text: Leer und falsch sind die Hoffnungen eines unverständigen Mannes, und Träume verleihen Toren Flügel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κεναὶ
  choice: leer
  rationale: Das Adjektiv bezeichnet Leere beziehungsweise fehlenden Gehalt. „Leer“ bewahrt das Bild substanzloser Hoffnungen und ist im Deutschen klar verständlich.
- source_word: ψευδεῖς
  choice: falsch
  rationale: ψευδής bedeutet hier „falsch, unwahr“. „Falsch“ wahrt die Aussage, ohne eine aktive Täuschungsabsicht in die Hoffnungen hineinzulesen.
- source_word: ἐλπίδες
  choice: Hoffnungen
  rationale: Dies ist die gewöhnliche und im weisheitlichen Zusammenhang naheliegende Bedeutung.
- source_word: ἀσυνέτῳ ἀνδρί
  choice: eines unverständigen Mannes
  rationale: ἀσύνετος bezeichnet mangelnde Einsicht oder Urteilskraft; „unverständig“ hält den Ausdruck vom späteren ἄφρονας unterscheidbar. Der männliche Singular ἀνδρί wird entsprechend der griechischen Form mit „Mann“ wiedergegeben. Der griechische Dativ bezeichnet hier den Menschen, dem solche Hoffnungen eigen sind; im Deutschen ist der Genitiv natürlich.
- source_word: ἐνύπνια
  choice: Träume
  rationale: „Träume“ gibt die gewöhnliche Bedeutung knapp und ohne unnötige Deutung wieder.
- source_word: ἀναπτεροῦσιν
  choice: verleihen … Flügel
  rationale: Die Wendung bewahrt das anschauliche Bild des griechischen Verbs, das ein Beflügeln oder Zum-Fliegen-Bringen ausdrückt.
- source_word: ἄφρονας
  choice: Toren
  rationale: ἄφρων ist ein typischer Begriff der Weisheitsliteratur für Menschen ohne vernünftiges Urteil. „Toren“ passt zum würdevollen spruchhaften Register und unterscheidet sich von „unverständig“.
theological_decisions:
- issue: Generischer männlicher Singular in einer Weisheitsmaxime
  choice: Mann
  alternative: Mensch
  rationale: Obwohl die Maxime allgemein anwendbar ist, steht im Griechischen ausdrücklich der männliche Singular ἀνδρί. „Mann“ erhält diese Form, ohne die allgemeine Aussage einzuschränken.
- issue: Bildhafte Wirkung der Träume
  choice: verleihen Toren Flügel
  alternative: reißen Toren mit sich
  rationale: Die Metapher wird nicht auf eine bestimmte theologische oder psychologische Deutung festgelegt. So bleibt offen, ob das Beflügeln als Erhebung, Aufregung oder Forttragen ins Unwirkliche verstanden wird.
translation_notes:
  register: Spruchhaft, knapp und würdevoll. Die parallele Gegenüberstellung bleibt erhalten; „unverständig“ und „Toren“ geben die zwei unterschiedlichen griechischen Weisheitsbegriffe wieder. Die ungewöhnliche, aber verständliche Flugmetapher wird bewusst nicht geglättet.
