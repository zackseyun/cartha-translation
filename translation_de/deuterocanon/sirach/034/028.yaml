base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/034/028.yaml
  text: Wine drunk at the proper time and in moderation is gladness of heart and joy of soul[a].
translation:
  language: de
  text: Herzensfreude und Wonne der Seele ist Wein, wenn man ihn zur rechten Zeit und in rechtem Maß trinkt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder wörtlicher: „wenn man ihn zur rechten Zeit in ausreichendem Maß trinkt“. Das griechische Adjektiv kann „ausreichend“ oder „genug“ bedeuten; hier ist wahrscheinlich ein angemessenes Maß im Gegensatz zum Übermaß gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγαλλίαμα
  choice: Freude
  rationale: Das Substantiv bezeichnet jubelnde Freude oder freudiges Entzücken. In der Verbindung „Herzensfreude“ bleibt die positive, poetische Aussage natürlich und würdevoll.
- source_word: καρδίας
  choice: Herzens-
  rationale: Der Genitiv wird in der deutschen Zusammensetzung „Herzensfreude“ knapp und idiomatisch wiedergegeben.
- source_word: εὐφροσύνη
  choice: Wonne
  rationale: Das Wort bezeichnet Freude, Heiterkeit oder festliches Frohsein. „Wonne“ bewahrt den poetischen Parallelismus, ohne ἀγαλλίαμα einfach zu wiederholen.
- source_word: ψυχῆς
  choice: der Seele
  rationale: „Seele“ gibt die innere Lebens- und Persondimension wieder und erhält die Parallelität zu „Herz“.
- source_word: οἶνος
  choice: Wein
  rationale: Direkte und eindeutige Wiedergabe des griechischen Substantivs.
- source_word: πινόμενος
  choice: wenn man ihn … trinkt
  rationale: Der attributive Partizipialausdruck wird als deutscher Bedingungs- beziehungsweise Zeitsatz natürlich wiedergegeben, ohne seinen sachlichen Bezug zum Wein zu verändern.
- source_word: ἐν καιρῷ
  choice: zur rechten Zeit
  rationale: καιρός meint hier den passenden oder angemessenen Zeitpunkt, nicht nur Zeit im allgemeinen Sinn.
- source_word: αὐτάρκης
  choice: in rechtem Maß
  rationale: Das Adjektiv bezeichnet wörtlich das Ausreichende oder Genügende. Im Zusammenhang des Weingenusses gibt „in rechtem Maß“ die naheliegende Aussage eines angemessenen, nicht übermäßigen Maßes wieder; die wörtlichere Möglichkeit bleibt in der Fußnote erhalten.
theological_decisions:
- issue: Ethische Aussage von αὐτάρκης beim Weingenuss
  choice: Der Vers lobt Wein, wenn er zur passenden Zeit und in angemessenem Maß getrunken wird.
  alternative: Der Vers könnte wörtlicher von Wein sprechen, der „ausreichend“ oder „genug“ ist.
  rationale: Die Verbindung von ἐν καιρῷ mit αὐτάρκης legt zeitliche und mengenmäßige Angemessenheit nahe. „In rechtem Maß“ macht diese weisheitliche Aussage verständlich, ohne die wörtlichere Bedeutungsbreite zu verschweigen.
translation_notes:
  register: Moderne, allgemein verständliche Standardsprache mit dichterischem Parallelismus. „Herzensfreude und Wonne der Seele“ wahrt den gehobenen Ton der Weisheitsliteratur; der zweite Satzteil ist idiomatisch entfaltet.
