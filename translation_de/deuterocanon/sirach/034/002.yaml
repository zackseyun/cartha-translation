  text: Like one grasping at a shadow and chasing the wind[a], so is one who clings to dreams.
translation:
  language: de
  text: Wie jemand, der nach einem Schatten greift und dem Wind nachjagt, so ist einer, der sich an Träume hält.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „einer, der auf Träume achtet“ oder „einer, der sich auf Träume verlässt“. Das griechische Verb kann Festhalten, Sich-Verlassen oder das Achten auf etwas bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δρασσόμενος
  choice: nach … greift
  rationale: Das Partizip bezeichnet den Versuch, etwas mit der Hand zu fassen. „Nach einem Schatten greift“ gibt das vergebliche Bemühen im Deutschen natürlich wieder.
- source_word: σκιᾶς
  choice: einem Schatten
  rationale: Der Genitiv bezeichnet das, wonach gegriffen wird. „Schatten“ bewahrt das Bild von etwas Unfassbarem.
- source_word: διώκων ἄνεμον
  choice: dem Wind nachjagt
  rationale: Die Wendung beschreibt ein aussichtsloses Verfolgen. „Dem Wind nachjagen“ erhält das Bild und klingt im modernen Deutsch idiomatisch.
- source_word: ὁ ἐπέχων
  choice: wer sich an … hält
  rationale: Die Formulierung kann Festhalten, Sich-Verlassen oder Beachten ausdrücken. „Sich an Träume halten“ bewahrt sowohl die Bindung als auch den Gedanken, ihnen Gewicht zu geben, ohne die Bedeutung zu stark einzuengen.
- source_word: ἐνυπνίοις
  choice: Träume
  rationale: Der Dativ Plural bezeichnet Träume beziehungsweise nächtliche Traumgesichte. „Träume“ ist die klare und natürliche deutsche Wiedergabe.
theological_decisions:
- issue: Aussagekraft von ὁ ἐπέχων ἐνυπνίοις
  choice: wer sich an Träume hält
  alternative: wer auf Träume achtet; wer sich auf Träume verlässt
  rationale: Der Vergleich mit dem Greifen nach einem Schatten und dem Nachjagen des Windes bewertet die Hinwendung zu Träumen als vergeblich. Die gewählte Formulierung wahrt die mögliche Spannweite zwischen Beachten und Sich-Verlassen, statt eine einzelne Auslegung festzuschreiben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der parallele Bildbau des griechischen Satzes bleibt erhalten; „so ist“ bildet die knappe Vergleichskonstruktion des Originals nach.
