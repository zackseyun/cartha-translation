  text: A man who has not been tested knows little, but one who has wandered[b] increases cunning[c][a].
translation:
  language: de
  text: Wer nicht erprobt worden ist, weiß wenig; wer aber umhergeirrt ist[b], vermehrt seine Schlauheit[c].[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die hier überlieferte hebräische Zeile stimmt nicht mit dem griechischen Text dieses Verses überein; die Übersetzung folgt daher an dieser Stelle dem griechischen Textzeugen.
    reason: textual_variant
  - marker: b
    text: 'Oder: „wer in die Irre gegangen ist“ beziehungsweise „wer irregeführt worden ist“. Das griechische Wort kann tatsächliches Umherirren wie auch eine übertragene Abweichung bezeichnen.'
    reason: alternative_reading
  - marker: c
    text: 'Oder: „Verschlagenheit“, „Gewitztheit“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς οὐκ ἐπειράθη
  choice: Wer nicht erprobt worden ist
  rationale: Da die überlieferte hebräische Zeile nicht zu diesem Vers passt, dient der griechische Paralleltext als Übersetzungsgrundlage. Die Formulierung bewahrt den Gedanken des Erprobtwerdens und der durch Prüfung gewonnenen Erfahrung.
- source_word: ὀλίγα οἶδεν
  choice: weiß wenig
  rationale: Natürliche und genaue Wiedergabe der griechischen Wendung für begrenztes Wissen.
- source_word: ὁ δὲ πεπλανημένος
  choice: wer aber umhergeirrt ist
  rationale: Das Partizip von πλανάω kann tatsächliches Umherziehen, Irren oder Irregeführtwerden bezeichnen. „umhergeirrt“ hält die räumliche und die übertragene Bedeutung offen.
- source_word: πληθυνεῖ
  choice: vermehrt
  rationale: Gibt den Grundsinn des Vermehrens wieder und lässt offen, ob die betreffende Eigenschaft wächst oder aktiv ausgebildet wird.
- source_word: πανουργίαν
  choice: seine Schlauheit
  rationale: πανουργία bezeichnet gewandte Klugheit häufig mit negativer Färbung. „Schlauheit“ bewahrt sowohl praktische Gewitztheit als auch den möglichen Beiklang der Verschlagenheit.
theological_decisions:
- issue: Abweichung zwischen dem zugeordneten hebräischen Text und dem griechischen Verszeugen
  choice: Übersetzung nach dem griechischen Paralleltext mit textkritischer Fußnote
  alternative: Die vorhandene hebräische Zeile übersetzen, obwohl sie inhaltlich nicht Sirach 34,10 entspricht
  rationale: Die angegebene hebräische Zeile („Gib ihm entsprechend seiner Gabe an dich ...“) gehört inhaltlich nicht zu diesem Vers. Der griechische Text bietet dagegen die bekannte und zusammenhängende Fassung von Sirach 34,10. Die Abweichung wird offengelegt, nicht stillschweigend beseitigt.
- issue: Bewertung der durch Erfahrung gewonnenen Schlauheit
  choice: Die mögliche positive und negative Färbung offenhalten
  alternative: πανουργία ausschließlich positiv als praktische Klugheit oder ausschließlich negativ als Arglist wiedergeben
  rationale: Der griechische Ausdruck und der Zusammenhang erzeugen eine Spannung zwischen Erfahrungswissen und moralisch zweifelhafter Verschlagenheit. „Schlauheit“ erhält diese Spannung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die generische griechische Konstruktion wird mit „wer“ geschlechtsübergreifend und ohne unnötige Ergänzung wiedergegeben. Die ungewöhnliche Spannung des griechischen Satzes bleibt erhalten.
