  text: A man who has traveled[b] knows many things, and one with much experience will recount understanding.[a]
translation:
  language: de
  text: Ein gebildeter[a] Mann weiß vieles, und wer viel Erfahrung hat, wird Einsicht darlegen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein geschulter“ beziehungsweise „ein unterwiesener Mann“. Das griechische Wort bezeichnet einen Menschen, der Bildung oder Unterweisung empfangen hat.'
    reason: lexical_alternative
  - marker: b
    text: 'Der für diesen Vers angegebene hebräische Text weicht inhaltlich erheblich ab und lautet ungefähr: „Bei all deinen Taten zeige ein heiteres Gesicht, und gib mit Freude den Zehnten von dem, was heilig ist.“ Da diese Zeile nicht zum Zusammenhang von Sirach 34,9 passt, folgt der Haupttext hier dem griechischen Zeugen.'
    reason: textual_variant
lexical_decisions:
- source_word: ἀνὴρ πεπαιδευμένος
  choice: ein gebildeter Mann
  rationale: Das griechische Partizip πεπαιδευμένος bezeichnet hier am unmittelbarsten einen gebildeten, unterwiesenen oder geschulten Menschen. Die ausdrücklich männliche Form bleibt erhalten. Eine Wiedergabe mit „weit gereist“ wäre eher aus dem Kontext erschlossen als aus diesem griechischen Wort selbst.
- source_word: ἔγνω πολλά
  choice: weiß vieles
  rationale: Die aoristische Form bezeichnet erworbenes Wissen; im allgemein gültigen Spruch klingt die deutsche Gegenwartsform natürlich.
- source_word: ὁ πολυπειρῶν
  choice: wer viel Erfahrung hat
  rationale: Die substantivierte Wendung bezeichnet jemanden mit vielfältiger oder umfangreicher Erfahrung und wird in natürlichem, allgemein verständlichem Deutsch wiedergegeben.
- source_word: ἐκδιηγήσεται
  choice: wird … darlegen
  rationale: Das Verb meint, etwas ausführlich zu erzählen oder darzustellen. „Darlegen“ passt gut zu dem Gegenstand „Einsicht“ und wahrt den Aussagecharakter.
- source_word: σύνεσιν
  choice: Einsicht
  rationale: Das Weisheitswort bezeichnet verständiges Erfassen oder Urteilsvermögen; „Einsicht“ ist prägnant und entspricht dem würdevollen Register Sirachs.
theological_decisions:
- issue: Erhebliche Abweichung zwischen dem überlieferten hebräischen Text und dem griechischen Paralleltext
  choice: Der Haupttext folgt dem griechischen Zeugen, der zu Sirach 34,9 und seinem Zusammenhang passt; die abweichende hebräische Zeile wird in einer Fußnote vollständig offengelegt.
  alternative: 'Den vorgelegten hebräischen Text im Haupttext wiedergeben: „Bei all deinen Taten zeige ein heiteres Gesicht, und gib mit Freude den Zehnten von dem, was heilig ist.“'
  rationale: Der hebräische Wortlaut behandelt ein anderes Thema und gehört offenbar nicht zu diesem Vers. Der griechische Text bietet dagegen die inhaltlich und strukturell passende Lesart. So wird die wahrscheinlich versetzte hebräische Überlieferung weder verschwiegen noch irrtümlich in den Zusammenhang eingefügt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch in knapper Spruchform. „Gebildet“ folgt dem belegten griechischen Wortlaut genauer als die kontextuell mögliche, aber lexikalisch fernere Deutung „weit gereist“.
