  yaml_path: translation/deuterocanon/sirach/034/007.yaml
  text: For dreams have misled many[b][a], and those who hoped in them have fallen.
translation:
  language: de
  text: Denn Träume haben viele in die Irre geführt, und die ihre Hoffnung auf sie setzten, sind zu Fall gekommen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: sind gescheitert; das griechische Wort kann hier auch einen Niedergang oder Untergang bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὺς
  choice: viele
  rationale: Das substantivisch gebrauchte Adjektiv bezeichnet unbestimmt viele Menschen; im Deutschen ist „viele“ natürlich und vollständig.
- source_word: ἐπλάνησεν
  choice: haben … in die Irre geführt
  rationale: Die Wendung bewahrt das Bild des Abirrens und gibt die Warnung weniger zugespitzt wieder als „getäuscht“.
- source_word: τὰ ἐνύπνια
  choice: Träume
  rationale: „Träume“ ist die klare und übliche deutsche Entsprechung; eine Einschränkung auf besondere Traumvisionen verlangt der griechische Text nicht.
- source_word: ἐξέπεσαν
  choice: sind zu Fall gekommen
  rationale: Die deutsche Wendung bewahrt das Fallmotiv und lässt offen, ob Scheitern, Verlust oder Untergang gemeint ist.
- source_word: ἐλπίζοντες
  choice: die, die … hofften
  rationale: Das Partizip bezeichnet die betreffenden Personen. Die finite Relativkonstruktion klingt im modernen Deutsch natürlich und erhält den Plural.
- source_word: ἐπʼ αὐτοῖς
  choice: auf sie
  rationale: Das Pronomen verweist auf die Träume; „auf etwas hoffen“ ist hier die idiomatische deutsche Verbindung und drückt das gesetzte Vertrauen aus.
theological_decisions:
- issue: Reichweite der Warnung vor Träumen
  choice: Der Vers warnt davor, auf Träume zu hoffen, weil sie viele irreführen und zu Fall bringen können.
  alternative: Der Vers verurteilt ausnahmslos jeden Traum; oder er spricht ausschließlich von falscher Traumdeutung.
  rationale: Der griechische Wortlaut nennt Träume als Ursache der Irreführung und hebt besonders diejenigen hervor, die auf sie hoffen. Er entscheidet nicht ausdrücklich über jede denkbare Traumerfahrung oder deren Deutung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die sprichwörtliche Aussage wird im Perfekt wiedergegeben; das Bild des Irrwegs und die Mehrdeutigkeit des Zu-Fall-Kommens bleiben erhalten.
