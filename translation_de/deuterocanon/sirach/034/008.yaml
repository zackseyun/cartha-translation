  text: Without falsehood the law will be fulfilled[b][a], and wisdom is perfection for a faithful mouth.
translation:
  language: de
  text: Das Gesetz wird ohne Falschheit erfüllt werden, und Weisheit ist Vollendung in einem treuen Mund.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Weisheit ist für einen treuen Mund Vollendung.“ Der letzte Satzteil ist im Griechischen knapp gefasst und lässt sich syntaktisch unterschiedlich verstehen.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἄνευ ψεύδους
  choice: Ohne Falschheit
  rationale: Die Präposition ἄνευ mit Genitiv bezeichnet das Fehlen von etwas; „Falschheit“ bewahrt den abstrakten moralischen Sinn von ψεῦδος.
- source_word: συντελεσθήσεται
  choice: wird erfüllt werden
  rationale: Das Futur Passiv von συντελέω bezeichnet das Vollenden oder vollständige Ausführen; zusammen mit νόμος ist „erfüllt werden“ natürlich und quellennah.
- source_word: νόμος
  choice: das Gesetz
  rationale: „Gesetz“ ist die direkte und kontextuell mögliche Wiedergabe von νόμος, ohne es interpretierend auf „Unterweisung“ einzuengen.
- source_word: σοφία
  choice: Weisheit
  rationale: Die übliche und eindeutige Entsprechung für σοφία.
- source_word: στόματι πιστῷ
  choice: in einem treuen Mund
  rationale: Der Dativ lässt sich örtlich beziehungsweise sphärisch verstehen. Das Bild des Mundes als Ort wahrhaftiger Rede bleibt erhalten; „treu“ gibt πιστός eng wieder.
- source_word: τελείωσις
  choice: Vollendung
  rationale: τελείωσις bezeichnet das Zu-Ende-Bringen beziehungsweise den vollendeten Zustand. „Vollendung“ bewahrt diese Bedeutungsbreite besser als das im Deutschen stärker absolute „Vollkommenheit“.
theological_decisions:
- issue: Bedeutung von νόμος im weisheitlichen Kontext
  choice: Gesetz
  alternative: Unterweisung
  rationale: Der griechische Wortlaut bietet νόμος. Da der Vers keine eindeutige Spezifizierung auf allgemeine Unterweisung verlangt, bleibt die formnähere Wiedergabe stehen.
- issue: Syntaktische Zuordnung von στόματι πιστῷ und τελείωσις
  choice: „Weisheit ist Vollendung in einem treuen Mund“
  alternative: „Weisheit ist für einen treuen Mund Vollendung“
  rationale: Die knappe griechische Nominalkonstruktion erlaubt mehr als eine Zuordnung des Dativs. Der Haupttext wahrt die Mundmetapher und liest den Dativ sphärisch; die Fußnote nennt die alternative Beziehung, ohne die Unsicherheit aufzulösen.
translation_notes:
  register: Knapper, würdevoller Spruchstil in modernem Standarddeutsch. Die parallele Struktur und die abstrakten Schlüsselbegriffe „Falschheit“, „Gesetz“, „Weisheit“ und „Vollendung“ bleiben erhalten; die echte syntaktische Mehrdeutigkeit des zweiten Halbverses wird in einer Fußnote kenntlich gemacht.
