translation:
  language: de
  text: Denn er ist ein Gott des Rechts[a], und bei ihm gibt es kein Ansehen der Person.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die angegebene griechische Parallelstelle bei Swete enthält hier einen anderen Satz: „Oft geriet ich bis zum Tod in Gefahr, und ihretwegen wurde ich gerettet.“ Dies weist an dieser Stelle auf eine Abweichung des Textes oder der Verszählung hin. Die Übersetzung folgt dem erhaltenen hebräischen Text.'
    reason: textual_variant
lexical_decisions:
- source_word: כי
  choice: Denn
  rationale: Die Konjunktion begründet die vorangehenden Verbote. „Denn“ gibt diese kausale Verknüpfung im Deutschen natürlich wieder.
- source_word: אלהי משפט
  choice: ein Gott des Rechts
  rationale: Die Constructusverbindung beschreibt Gott prädikativ durch seine gerechte richterliche Wesensart. „Recht“ bewahrt dabei sowohl den gerichtlichen als auch den ethischen Gehalt von משפט.
- source_word: אין עמו
  choice: bei ihm gibt es kein
  rationale: Die hebräische Wendung bezeichnet etwas, das bei Gott beziehungsweise in seinem Handeln keinen Platz hat; die deutsche Formulierung bleibt nah am Bild und ist zugleich verständlich.
- source_word: משוא פנים
  choice: Ansehen der Person
  rationale: Die feste Wendung bezeichnet parteiische Bevorzugung aufgrund der Person oder ihres Ranges. „Ansehen der Person“ bewahrt den gerichtlichen Zusammenhang und ist im gehobenen modernen Deutsch verständlich.
theological_decisions:
- issue: Wiedergabe von משפט als Aussage über Gottes Wesen
  choice: Recht
  alternative: Gerechtigkeit; Gericht
  rationale: „Recht“ verbindet Gottes gerechtes Wesen mit seinem unparteiischen richterlichen Handeln, ohne die Aussage auf einen einzelnen Gerichtsakt zu verengen.
- issue: Umgang mit der nicht entsprechenden griechischen Parallelstelle
  choice: Dem erhaltenen hebräischen Text folgen und die Abweichung in einer Fußnote ausweisen
  alternative: Den griechischen Satz übersetzen oder beide Überlieferungen harmonisieren
  rationale: Für diesen Abschnitt ist ein sicher bezeugter hebräischer Text vorhanden. Die griechische Parallelangabe enthält einen ganz anderen Satz und deutet daher auf eine Text- oder Verszählungsabweichung hin; eine Harmonisierung würde die Überlieferungslage verschleiern.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Gott des Rechts“ und „Ansehen der Person“ halten den gerichtlichen Ton des Hebräischen fest, ohne altertümliche Syntax zu verwenden.
