base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/034/005.yaml
  text: Divinations and omens[b] and dreams are empty, and the heart imagines them like a woman in labor.[a]
translation:
  language: de
  text: Wahrsagereien, Omen-Deutungen[b] und Träume sind nichtig, und das Herz stellt sich Bilder vor wie eine Frau in Wehen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die für diesen Vers vorgelegte erhaltene hebräische Zeile lautet: „Gib dem Armen mit wohlwollendem Blick, und werde nicht ungehalten, wenn du ihm gibst.“ Sie scheint zu einem anderen Vers oder zu einem falsch zugeordneten Textzeugen zu gehören. Die Übersetzung im Haupttext folgt hier dem griechischen Text.'
    reason: textual_variant
  - marker: b
    text: 'Oder: „Augurien“. Das griechische Wort bezeichnet die Deutung von Zeichen als Vorboten künftiger Ereignisse.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μαντεῖαι
  choice: Wahrsagerei
  rationale: Bezeichnet Praktiken der Weissagung beziehungsweise Divination; „Wahrsagerei“ ist im modernen Deutschen klar und ohne Festlegung auf eine bestimmte Methode verständlich.
- source_word: οἰωνισμοί
  choice: Vorzeichen
  rationale: Bezeichnet die Deutung von Zeichen als kommende Ereignisse ankündigende Omina; „Vorzeichen“ ist allgemein verständlich, während „Augurien“ fachsprachlicher wäre.
- source_word: ἐνύπνια
  choice: Träume
  rationale: Die schlichte Wiedergabe entspricht dem griechischen Ausdruck, ohne ihn unnötig zu „Traumgesichten“ zu steigern.
- source_word: μάταιά
  choice: nichtig
  rationale: Gibt die Vorstellung von Leere, Vergeblichkeit und Unzuverlässigkeit in würdigem, noch verständlichem Deutsch wieder.
- source_word: φαντάζεται
  choice: stellt sich Bilder vor
  rationale: Bewahrt den Bezug auf innere Erscheinungen oder Vorstellungen und klingt im Deutschen natürlicher als das missverständliche „fantasiert“.
- source_word: καρδία
  choice: das Herz
  rationale: Bewahrt die biblische Metapher für das innere Zentrum des Denkens und Empfindens.
- source_word: ὡς ὠδινούσης
  choice: wie eine Frau in Wehen
  rationale: Das feminine Partizip verweist auf eine Gebärende; die Formulierung gibt den Vergleich knapp und natürlich wieder.
theological_decisions:
- issue: Erhebliche Abweichung zwischen der überlieferten hebräischen Zeile und dem griechischen Text zu Sirach 34,5
  choice: Der Haupttext folgt hier der griechischen Überlieferung; die abweichende hebräische Zeile wird in einer Fußnote vollständig offengelegt.
  alternative: 'Die vorgelegte hebräische Zeile übersetzen: „Gib dem Armen mit wohlwollendem Blick, und werde nicht ungehalten, wenn du ihm gibst.“'
  rationale: Die hebräische Zeile handelt vom Geben an Arme und steht semantisch ohne Zusammenhang mit Sirach 34,5 in der griechischen Überlieferung; zudem ist der Datensatz ausdrücklich als „major_mismatch“ gekennzeichnet. Daher dient der kohärente griechische Paralleltext als operative Textgrundlage, ohne die abweichende hebräische Evidenz zu verschweigen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der dreigliedrige Satzbau und die Herzmetapher bleiben erhalten. „Stellt sich Bilder vor“ wahrt die Bildlichkeit von φαντάζεται, ohne eine klinische oder abwertende Deutung einzutragen.
