  yaml_path: translation/deuterocanon/sirach/051/015.yaml
  text: From her blossom, like a ripening cluster of grapes, my heart rejoiced in her; my foot walked in uprightness; from my youth I tracked her down.
translation:
  language: de
  text: An ihrer Blüte, wie an einem reifenden Traubenbüschel,[a] freute sich mein Herz an ihr. Mein Fuß schritt auf geradem Weg;[b] von meiner Jugend an spürte ich ihr nach.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wie an einem sich färbenden Traubenbüschel“; das griechische Wort kann hervorheben, dass die Beeren beim Reifen Farbe annehmen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher auch: „Mein Fuß schritt in Geradheit“; gemeint sein kann sowohl ein gerader Weg als auch moralische Aufrichtigkeit.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „verfolgte ich ihre Spur“ beziehungsweise „suchte ich nach ihr“; das griechische Verb bezeichnet ursprünglich das Nachgehen anhand von Fußspuren.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξ ἄνθους
  choice: Von ihrer Blüte her
  rationale: ἄνθος bezeichnet Blüte oder Blume. Das Possessivpronomen verdeutlicht den Zusammenhang mit der personifizierten Weisheit, ohne das Bild auszudeuten; „her“ wahrt den Ausgangspunkt, den ἐξ ausdrückt.
- source_word: ὡς περκάζουσης σταφυλῆς
  choice: wie von einer reifenden Traube
  rationale: σταφυλή bezeichnet eine Weintraube beziehungsweise ein Traubenbüschel; περκάζω beschreibt das beginnende Dunkelwerden oder Sichfärben beim Reifen. „Reifend“ ist im Deutschen natürlich und bewahrt das landwirtschaftliche Bild, während die Fußnote die Farbnuance nennt.
- source_word: εὐφράνθη ἡ καρδία μου ἐν αὐτῇ
  choice: freute sich mein Herz an ihr
  rationale: Die Form bezeichnet inneres Frohwerden. „Sich an ihr freuen“ gibt ἐν αὐτῇ idiomatisch wieder und behält zugleich die Weisheit als Bezugspunkt der Freude bei.
- source_word: ἐπέβη ὁ πούς μου ἐν εὐθύτητι
  choice: Mein Fuß ging auf geradem Weg
  rationale: ἐπιβαίνω bezeichnet hier das Auftreten oder Schreiten des Fußes; εὐθύτης kann sowohl konkrete Geradheit als auch moralische Aufrichtigkeit meinen. Die Formulierung erhält das Wegbild und lässt dessen ethischen Sinn mitschwingen.
- source_word: ἐκ νεότητός μου ἴχνευον αὐτήν
  choice: von meiner Jugend an spürte ich ihr nach
  rationale: ἰχνεύω ruft das Verfolgen einer Spur oder von Fußabdrücken auf. „Ihr nachspüren“ bewahrt dieses Bild und gibt den durativen Charakter des Imperfekts besser wieder als eine Formulierung, die ein bereits erreichtes Auffinden behauptet.
theological_decisions:
- issue: Bezug und Geschlecht von αὐτῇ und αὐτήν
  choice: Die Pronomen beziehen sich auf die personifizierte Weisheit und werden mit „ihr“ wiedergegeben.
  alternative: Eine abstrakte, unpersönliche Wiedergabe der Weisheit
  rationale: Der Kontext des Sirachbuches stellt die Weisheit regelmäßig als weibliche Person dar. Das grammatische Femininum und die Personifikation bleiben daher sichtbar, ohne darüber hinaus eine bestimmte dogmatische Identifikation vorzunehmen.
- issue: Bedeutung von ἐν εὐθύτητι
  choice: Das Bild eines geraden Weges wird im Haupttext bewahrt.
  alternative: „in Aufrichtigkeit“ als ausdrücklich moralische Deutung
  rationale: Der griechische Ausdruck trägt räumliche und ethische Bedeutungsmöglichkeiten. Die gewählte Fassung hält diese Spannung offen; die Fußnote nennt die stärker ethische Wiedergabe.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst beibehaltenem Bildfeld von Blüte, Reifung, Weg und Spur. Die weibliche Personifikation der Weisheit bleibt erhalten. Ungebräuchliche Wörtlichkeit wird vermieden, echte lexikalische Mehrdeutigkeit jedoch in den Fußnoten dokumentiert.
