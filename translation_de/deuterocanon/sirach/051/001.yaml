base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/051/001.yaml
  text: I will praise you[a], God of my salvation; I will give thanks to you, God of my father. I will declare your name, the stronghold of my life[c][b], for you have redeemed my soul from death.
translation:
  language: de
  text: Ich will dich preisen, Gott meines Heils; ich will dir danken, Gott meines Vaters. Ich will deinen Namen verkünden, die Zuflucht meines Lebens[a], denn du hast mein Leben[b] vom Tod erlöst.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die hebräische Wendung kann auch ausdrücklich als Satz verstanden werden: „Ich will verkünden, dass dein Name die Zuflucht meines Lebens ist.“'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „meine Seele“ beziehungsweise „mich selbst“. Das hebräische Wort nefesch kann das Leben, die ganze Person oder die Seele bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: 'Die griechische Überlieferung beginnt abweichend: „Ich will dir danken, Herr und König, und dich preisen, Gott, meinen Retter.“'
    reason: textual_variant
lexical_decisions:
- source_word: אֲהַלְלֶךָּ
  choice: Ich will dich preisen
  rationale: Das Piel von הלל bezeichnet gewöhnlich das Preisen; die Wendung ist natürlich, würdig und wahrt die Parallelität zum folgenden Dankverb.
- source_word: אֱלֹהֵי יִשְׁעִי
  choice: Gott meines Heils
  rationale: Die Konstruktion wird formal bewahrt. „Heil“ umfasst Rettung und Wohlergehen und entspricht dem gehobenen poetischen Register.
- source_word: אוֹדְךָ
  choice: ich will dir danken
  rationale: ידה im Hifil kann danken, bekennen oder preisen bedeuten. „Danken“ erhält hier eine sinnvolle Unterscheidung von אֲהַלְלֶךָּ.
- source_word: אֱלֹהֵי אָבִי
  choice: Gott meines Vaters
  rationale: Der ausdrückliche Singular אָבִי wird nicht zu „Vorfahren“ oder „Vätern“ verallgemeinert.
- source_word: אֲסַפְּרָה שִׁמְךָ
  choice: Ich will deinen Namen verkünden
  rationale: ספר bedeutet hier erzählen, kundtun oder verkünden. „Verkünden“ passt zum öffentlichen Lob und bewahrt „deinen Namen“.
- source_word: מָעוֹז חַיַּי
  choice: die Zuflucht meines Lebens
  rationale: מָעוֹז bezeichnet einen sicheren, starken Schutzort. „Zuflucht“ klingt im Deutschen natürlich und wahrt die konkrete Schutzmetapher; die appositionelle Fügung bleibt erhalten.
- source_word: פָדִיתָ
  choice: du hast … erlöst
  rationale: פדה bezeichnet loskaufen, erlösen oder befreien. „Erlöst“ bewahrt die semantische und theologische Tiefe, ohne eine spätere Lehrsystematik einzutragen.
- source_word: נַפְשִׁי
  choice: mein Leben
  rationale: נפש bezeichnet hier angesichts der Rettung „vom Tod“ am natürlichsten das bedrohte Leben beziehungsweise die ganze Person; „Seele“ könnte im heutigen Deutsch eine vom Körper getrennte Komponente nahelegen.
theological_decisions:
- issue: Bedeutung von פָדִיתָ im Dank für Rettung
  choice: du hast … erlöst
  alternative: du hast … befreit / losgekauft
  rationale: „Erlöst“ erhält die Lösegeld- und Rettungskomponente des hebräischen Verbs, ohne den Vers ausschließlich auf eine spätere soteriologische Lehre festzulegen.
- issue: Verhältnis von שִׁמְךָ und מָעוֹז חַיַּי
  choice: deinen Namen verkünden, die Zuflucht meines Lebens
  alternative: verkünden, dass dein Name die Zuflucht meines Lebens ist
  rationale: Die knappe appositionelle Syntax des Hebräischen bleibt stehen. So wird die echte syntaktische Offenheit nicht durch einen ausdrücklich ergänzten Kopulasatz beseitigt.
- issue: Anthropologische Wiedergabe von נַפְשִׁי
  choice: mein Leben
  alternative: meine Seele / mich selbst
  rationale: Im Kontext der Rettung vom Tod bezeichnet נפש wahrscheinlich das Leben oder die ganze Person. Die Fußnote hält die traditionellere, aber möglicherweise missverständliche Wiedergabe „Seele“ offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit poetischem Rhythmus. „Gott meines Heils“ bewahrt bewusst den biblisch-poetischen Klang, während „Zuflucht“ und „mein Leben“ für heutige Leser unmittelbar verständlich bleiben. Alle drei Fußnotenmarker stehen an den jeweils sachlich passenden Stellen im Haupttext.
