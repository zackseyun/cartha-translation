  text: from lips of wickedness and from those who smear lies[a], and from the arrows of a deceitful tongue.
translation:
  language: de
  text: von den Lippen der Bosheit und von denen, die Lügen schmieden,[a] und von den Pfeilen einer trügerischen Zunge.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Parallelüberlieferung lautet: »von einer unreinen Zunge und einem falschen Wort« statt »von den Lippen der Bosheit … und von den Pfeilen einer trügerischen Zunge«. Da für diesen Vers Hebräisch erhalten ist, folgt der Haupttext dem hebräischen Textzeugen; die griechische Lesart wird hier angeführt, weil die Abweichung erheblich ist.'
    reason: alternative_reading
lexical_decisions:
- source_word: מִשִׂפְתֵי
  choice: von den Lippen
  rationale: Die Präposition מִן bezeichnet hier den Ausgangspunkt beziehungsweise die Gefahr, aus der Rettung erfolgt; das konkrete Bild der Lippen bleibt parallel zur »Zunge« erhalten.
- source_word: זִמָּה
  choice: Bosheit
  rationale: זִמָּה kann Verworfenheit, Schandtat oder in bestimmten Zusammenhängen sexuelle Schändlichkeit bezeichnen. Zusammen mit Lüge und trügerischer Rede ist hier der weitere moralische Sinn angemessen.
- source_word: וְטֹפְלֵי שֶׁקֶר
  choice: und von denen, die Lügen schmieden
  rationale: טפל bezeichnet grundlegend das Auftragen oder Anheften und kann übertragen das Erfinden beziehungsweise Fabrizieren von Falschem meinen. »Lügen schmieden« gibt diese bildhafte Bedeutung in natürlichem Deutsch wieder; die Präposition »von« wird aus der Reihung sinngemäß wiederholt.
- source_word: וְחִצֵּי
  choice: und von den Pfeilen
  rationale: Das am Anfang gesetzte מִן wirkt in der Aufzählung fort. Das gewaltsame Bild der Pfeile für verletzende Rede wird bewahrt.
- source_word: לְשוֹן מִרְמָה
  choice: einer trügerischen Zunge
  rationale: Die wörtliche Körpermetapher »Zunge« entspricht der poetischen Parallele zu den Lippen; מִרְמָה wird für idiomatisches Deutsch attributiv als »trügerisch« wiedergegeben.
- source_word: ἀπὸ γλώσσης ἀκαθάρτου καὶ λόγου ψευδοῦς
  choice: nicht in den Haupttext übernommen
  rationale: Die griechische Parallelüberlieferung weicht erheblich vom erhaltenen Hebräisch ab. Da für diesen Vers ein hebräischer Textzeuge vorliegt, folgt der Haupttext ihm; die griechische Lesart wird in der Fußnote dokumentiert.
