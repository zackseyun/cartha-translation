base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/051/013.yaml
  text: I was young[a], and I loved wisdom; I desired her and sought her out. In faithfulness my foot walked; from my youth, O Lord[b], I learned wisdom.
translation:
  language: de
  text: Ich war noch jung und liebte die Weisheit[a]; ich verlangte nach ihr und suchte sie. In ihrer Wahrheit ging mein Fuß; Herr, von meiner Jugend an lernte ich Weisheit.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Worte „und liebte die Weisheit“ stehen in der zugrunde gelegten hebräischen Edition in eckigen Klammern und sind daher textkritisch unsicher.
    reason: textual_uncertainty
  - marker: b
    text: 'Hebräisch wörtlich: „in ihrer Wahrheit“. Auch die Deutung „in Treue“ ist möglich. Die griechische Parallelfassung weicht deutlich ab: „Als ich noch jung war, bevor ich in die Irre ging, suchte ich offen in meinem Gebet nach Weisheit.“ Der Haupttext folgt dem erhaltenen hebräischen Zeugnis.'
    reason: alternative_reading
lexical_decisions:
- source_word: נַעַר הָיִיתִי
  choice: Ich war noch jung
  rationale: Gibt die knappe hebräische Aussage natürlich wieder; „noch“ verdeutlicht den zeitlichen Rückblick, ohne Alter oder Geschlecht stärker festzulegen als nötig.
- source_word: וָאוֹהַב חָכְמָה
  choice: und liebte die Weisheit
  rationale: Folgt dem in Kah ق؟ana eingeklammerten hebräischen Wortlaut. „Weisheit“ bleibt durch die folgenden weiblichen Bezüge personifiziert.
- source_word: וְחָפַצְתִּי בָהּ
  choice: ich verlangte nach ihr
  rationale: חפץ bezeichnet Verlangen, Gefallen oder Freude. „Nach ihr verlangen“ bewahrt hier die starke Hinwendung zur personifizierten Weisheit.
- source_word: וּבִקַּשְׁתִיהָ
  choice: und suchte sie
  rationale: Schlichte, aktive Wiedergabe von בקש, ohne den Vorgang unnötig auszuweiten.
- source_word: בַּאֲמִתָּהּ
  choice: In ihrer Treue
  rationale: Der feminine Suffixbezug kann auf die Weisheit zurückweisen; אמת umfasst Treue, Verlässlichkeit und Wahrheit. Die Mehrdeutigkeit wird durch eine Fußnote offengehalten.
- source_word: דָּרְכָה רַגְלִי
  choice: schritt mein Fuß
  rationale: Bewahrt das konkrete hebräische Bild des gehenden Fußes und bleibt im Deutschen verständlich.
- source_word: אֲדֹנָי
  choice: Herr
  rationale: Als direkte Anrede wiedergegeben; ein zusätzliches „o“ ist im heutigen würdevollen Deutsch nicht erforderlich.
- source_word: מִנְּעוּרַי חָכְמָה לָמַדְתִּי
  choice: von meiner Jugend an lernte ich Weisheit
  rationale: Gibt Ausgangspunkt und fortdauernde frühe Beschäftigung wieder, ohne „lernen“ einseitig als formales Studium zu verstehen.
theological_decisions:
- issue: Hebräischer Text oder deutlich abweichende griechische Parallelfassung
  choice: Der Haupttext folgt dem erhaltenen hebräischen Zeugnis.
  alternative: 'Die griechische Fassung lautet sinngemäß: „Als ich noch jung war, bevor ich in die Irre ging, suchte ich offen in meinem Gebet nach Weisheit.“'
  rationale: Wo der hebräische Sirachtext erhalten ist, hat er Vorrang. Die erhebliche Abweichung der griechischen Überlieferung wird nicht harmonisiert, sondern transparent in einer Fußnote dokumentiert.
- issue: Personifizierter Bezug in בַּאֲמִתָּהּ
  choice: „in ihrer Treue“ mit Rückbezug auf die Weisheit
  alternative: „in Wahrheit“ oder „in Treue“ als Beschreibung der Lebensführung
  rationale: Der feminine Suffix legt einen Rückbezug auf die Weisheit nahe, doch die semantische und syntaktische Mehrdeutigkeit bleibt bestehen und wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die personifizierte Weisheit bleibt durch „ihr/sie“ erkennbar. Das hebräische Körperbild „mein Fuß“ wird bewusst erhalten; altertümliche Formen wie „o Herr“ werden vermieden.
