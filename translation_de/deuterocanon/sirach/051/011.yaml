translation:
  language: de
  text: Da hörte Jahwe meine Stimme[a] und achtete auf mein Flehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „meine Stimme“; im Zusammenhang kann auch „mein Rufen“ gemeint sein.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: Da
  rationale: Kennzeichnet den zeitlichen Übergang vom vorausgehenden Gebet zu Gottes Reaktion; im Deutschen ist „Da“ knapp und erzählerisch natürlich.
- source_word: שָׁמַע
  choice: hörte
  rationale: Gibt die Grundbedeutung wieder und lässt gegenüber dem folgenden וַיַּאֲזִין die Steigerung zur aufmerksamen Zuwendung erkennen.
- source_word: קוֹלִי
  choice: meine Stimme
  rationale: Entspricht dem wörtlichen hebräischen Ausdruck; die im Gebetszusammenhang mögliche idiomatische Bedeutung „mein Rufen“ wird in einer Fußnote bewahrt.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im modernen Deutschen übliche Wiedergabe des ausdrücklich gesetzten Gottesnamens, statt ihn durch einen Titel zu ersetzen.
- source_word: וַיַּאֲזִין
  choice: achtete auf
  rationale: Drückt bewusstes, aufmerksames Hinhören aus und wahrt den Bedeutungsunterschied zu שָׁמַע, ohne die im Deutschen unpassend wirkende Körpermetapher „neigte sein Ohr“ zu verwenden.
- source_word: תַּחֲנוּנָי
  choice: mein Flehen
  rationale: Bezeichnet eindringliche Bitten um Gnade oder Erbarmen. Der deutsche Kollektivsingular gibt den Gebetscharakter natürlich wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen ausdrücklich. „Jahwe“ bewahrt ihn als Namen und verwendet die geläufige deutsche Form, ohne ihn durch den traditionellen Ersatztitel aufzulösen.
translation_notes:
  register: Natürliches, würdiges Standarddeutsch. Der Parallelismus wird durch „hörte“ und das intensivere „achtete auf“ erhalten. Die vor dem Versmarker stehende Zeile des bereitgestellten hebräischen Textes gehört zum vorausgehenden Kontext und wurde entsprechend der angegebenen Versreferenz nicht in Sirach 51,11 aufgenommen.
