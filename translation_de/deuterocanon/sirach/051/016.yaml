translation:
  language: de
  text: Ich neigte mein Ohr ein wenig und nahm es[a] an; ich fand für mich viel Unterweisung.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »nahm es auf«. Im Griechischen bleibt das Objekt unausgesprochen; es kann sich allgemein auf das Empfangene beziehen, etwa auf Weisheit oder Unterweisung. »Unterweisung« kann auch formende Anleitung oder Disziplin einschließen.'
