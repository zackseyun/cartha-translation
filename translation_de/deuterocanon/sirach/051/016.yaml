  register: Modernes, würdiges Standarddeutsch. Das Bild vom geneigten Ohr und der reflexive Ausdruck »für mich« bleiben erhalten. Das Semikolon mit »so« stellt den naheliegenden Ergebniszusammenhang dar, ohne eine stärkere Kausalität zu behaupten.
