lexical_decisions:
- source_word: ἔκλινα
  choice: Ich neigte
  rationale: Bewahrt das konkrete Bild des Hinneigens und bezeichnet hier aufmerksames Hören.
- source_word: ὀλίγον
  choice: ein wenig
  rationale: Bezieht sich am natürlichsten auf das leichte Neigen des Ohres, nicht zwingend auf eine kurze Zeitdauer.
- source_word: τὸ οὖς μου
  choice: mein Ohr
  rationale: Erhält das körperliche Bild der griechischen Wendung für aufmerksames Zuhören.
- source_word: ἐδεξάμην
  choice: nahm sie an
  rationale: Das im Griechischen unausgesprochene Objekt wird im Deutschen durch das feminine Pronomen ergänzt; es verweist im Zusammenhang wahrscheinlich auf Weisheit oder Unterweisung, ohne den Bezug ausdrücklich festzulegen.
- source_word: πολλὴν
  choice: viel
  rationale: Gibt bei παιδείαν den Umfang beziehungsweise die Menge wieder.
- source_word: εὗρον ἐμαυτῷ
  choice: fand ich für mich
  rationale: Stellt den bedeutsamen reflexiven Dativ ἐμαυτῷ dar und bewahrt den Gedanken des persönlichen Gewinns.
- source_word: παιδείαν
  choice: Unterweisung
  rationale: Passt zum Weisheitskontext und umfasst lehrende wie formende Anleitung, ohne den Aspekt der Züchtigung einseitig hervorzuheben.
