lexical_decisions:
- source_word: רְאוּ בְעֵינֵיכֶם
  choice: Seht mit eigenen Augen
  rationale: Der pluralische Imperativ fordert zur persönlichen Wahrnehmung auf; die deutsche Wendung gibt die idiomatische Betonung des unmittelbaren Sehens natürlich wieder.
- source_word: כִּי קָטֹן הָיִיתִי
  choice: Ich war jung
  rationale: קָטֹן bezeichnet wörtlich Kleinheit, kann bei einer Person aber Jugend beziehungsweise ein geringes Alter ausdrücken. Im Kontext des Rückblicks ist „jung“ natürlich, während die breitere Bedeutung in einer Fußnote erhalten bleibt.
- source_word: וְעָמַדְתִּי בָהּ
  choice: und ich hielt an ihr fest
  rationale: עמד mit ב kann hier beharrliches Festhalten oder Verweilen ausdrücken. Die feminine Form wird als Rückbezug auf die personifizierte Weisheit transparent mit „ihr“ wiedergegeben.
- source_word: וּמְצָאתִיהָ
  choice: und fand sie
  rationale: מצא mit femininem Objektsuffix bedeutet unmittelbar „und ich fand sie“; die feminine Referenz auf die Weisheit bleibt gewahrt.
theological_decisions:
- issue: Referenz und Personifikation der femininen Suffixe בָהּ und מְצָאתִיהָ
  choice: Die femininen Formen werden mit „ihr“ und „sie“ wiedergegeben und auf die personifizierte Weisheit bezogen.
  alternative: Unpersönlich „daran“ und „sie/die Weisheit“ oder „es“ wiedergeben.
  rationale: Das Hebräische markiert beide Bezüge ausdrücklich als feminin, und die Personifikation der Weisheit ist im Sirachbuch geläufig. Die deutsche Wiedergabe bewahrt diese grammatische und literarische Gestalt, ohne darüber hinaus eine dogmatische Aussage einzutragen.
- issue: Abweichung zwischen hebräischem Text und griechischer Parallelüberlieferung
  choice: Der erhaltene hebräische Text bildet die Grundlage; die stark abweichende griechische Lesart wird in einer Fußnote dokumentiert.
  alternative: 'Dem Griechischen folgen: „Ich mühte mich nur wenig und fand für mich viel Ruhe.“'
  rationale: Da ein zuverlässiger hebräischer Text vorliegt, hat er für diese Übersetzung Vorrang. Die griechische Fassung bezeugt jedoch eine bedeutende Textvariante, die nicht verschwiegen werden darf.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Hielt an ihr fest“ macht den im Kontext wahrscheinlichen Beharrlichkeitsaspekt verständlich und bewahrt zugleich den femininen Bezug auf die Weisheit. Die Fußnotenmarker stehen jeweils an der sachlich passenden Stelle im Haupttext.
