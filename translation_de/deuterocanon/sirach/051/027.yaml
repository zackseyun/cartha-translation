translation:
  language: de
  text: 'Seht mit eigenen Augen: Ich war jung[a], und ich hielt an ihr fest und fand sie.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ich war klein“ beziehungsweise „gering“. Das hebräische Wort kann Größe, Alter oder Bedeutung bezeichnen.'
