  terminology: „HERR“ ist für den Gottesnamen konsistent und bibelsprachlich etabliert. „Lohn“, „Lippen“, „erworben“ und „Besitz“ sind semantisch angemessene Entsprechungen. Die Fußnote zum femininen Pronomen erläutert den Kontextbezug auf Weisheit, ohne ihn unzulässig in den Haupttext einzutragen.
