  source_fidelity: 'Der Haupttext gibt den hebräischen Wortlaut zuverlässig wieder: JHWH gibt dem Sprecher „den Lohn meiner Lippen“, und dieser erwirbt das feminine Bezugswort als „guten Besitz“. Die konkrete Bildsprache und die knappe Folgerung von בַּעֲבוּר כֵּן bleiben erhalten. Die deutlich abweichende griechische Fassung ist zutreffend als alternative Lesart vermerkt, nicht in den Haupttext eingetragen.'
