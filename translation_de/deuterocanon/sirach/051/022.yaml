lexical_decisions:
- source_word: יְהֹוָה
  choice: der HERR
  rationale: Die Kapitälchenkonvention gibt den Gottesnamen JHWH erkennbar wieder und entspricht dem etablierten deutschen Bibelgebrauch.
- source_word: שְׂכַר שִׂפְתוֹתָי
  choice: den Lohn meiner Lippen
  rationale: Die konkrete hebräische Metapher wird bewahrt; „Lohn“ gibt den positiven Sinn von שְׂכַר wieder, ohne ihn unnötig auszudeuten.
- source_word: בַּעֲבוּר כֵּן
  choice: Deshalb
  rationale: Die kausal-resultative Verknüpfung wird knapp und in natürlichem Deutsch wiedergegeben.
- source_word: קְנִיתִיהָ
  choice: habe ich sie erworben
  rationale: „Erwerben“ lässt die mögliche Bedeutungsspanne von gewinnen bis kaufen offen. Das feminine Pronomen verweist im Kontext auf die Weisheit.
- source_word: קִנְיָן טוֹב
  choice: als guten Besitz
  rationale: Die Wiedergabe hält die Wortverbindung zwischen קנה („erwerben“) und קנין („Besitz/Erwerb“) im Deutschen durch „erworben“ und „Besitz“ möglichst sichtbar.
- source_word: αἰνέσω αὐτόν
  choice: nur in der Fußnote wiedergegeben
  rationale: Die griechische Parallelüberlieferung weicht deutlich vom erhaltenen hebräischen Text ab; da das Hebräische hier vorhanden ist, bestimmt es den Haupttext.
theological_decisions:
- issue: Wahl der Hauptlesart bei der Abweichung zwischen hebräischer und griechischer Überlieferung
  choice: 'Der erhaltene hebräische Text bildet den Haupttext: Der HERR gibt dem Sprecher den Lohn seiner Lippen, woraufhin dieser die Weisheit als guten Besitz erwirbt.'
  alternative: 'Die griechische Lesart: „Der Herr gab mir eine Zunge als meinen Lohn, und mit ihr werde ich ihn loben.“'
  rationale: Für Jesus Sirach hat der erhaltene hebräische Wortlaut Vorrang. Die erheblich abweichende griechische Lesart bleibt als echtes Textzeugnis in einer Fußnote erhalten.
- issue: Bezug des femininen Suffixes in קְנִיתִיהָ
  choice: „sie“ bezieht sich auf die Weisheit im Zusammenhang.
  alternative: Das Pronomen ohne ausdrückliche Identifizierung stehen lassen.
  rationale: Das feminine Pronomen wird im Haupttext formal bewahrt; die Fußnote nennt seinen kontextuellen Bezug, ohne „Weisheit“ erläuternd in den Vers einzusetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst bewahrter hebräischer Bildsprache. Die leicht gehobene Formulierung „Lohn meiner Lippen“ und die Verbindung „erworben … Besitz“ erhalten die Form und das Wortspiel des Ausgangstextes, bleiben aber verständlich.
