  terminology: Die femininen Pronomen erhalten die Personifizierung der Weisheit. „Seele“, „Reinheit“ und „Herz“ sind quellennahe und zugleich verständliche Entsprechungen; sie führen keine konfessionell geprägte Deutung ein. Die Fußnote zur griechischen Überlieferung beschreibt die Abweichung sachlich und korrekt, einschließlich des abweichenden Schlusses.
