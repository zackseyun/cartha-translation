  source_fidelity: 'Die Übersetzung gibt die hebräische Abfolge und Bildsprache zuverlässig wieder: נפשי bleibt als „meine Seele“ erkennbar, die Ausrichtung auf die personifizierte Weisheit wird als Hingabe und Nachfolge verständlich entfaltet, und „nicht von ihr abweichen“ bewahrt das Verb des Sich-Neigens bzw. Abweichens. „In Reinheit“ lässt die offene Nuance von בטהרה angemessen stehen. „Ein Herz für sie gewinnen“ wahrt den Ausdruck לב, ohne ihn einseitig auf Gefühl oder Verstand festzulegen. „Von Anfang an“ ist eine idiomatische, ausreichend offene Wiedergabe von מתחלתה.'
