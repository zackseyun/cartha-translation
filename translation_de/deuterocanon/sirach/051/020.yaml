base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/051/020.yaml
  text: I gave my soul after her, and for everlasting ages I will not turn away from her. In purity I found her, and from the beginning I acquired a heart for her.
translation:
  language: de
  text: Ich gab meine Seele hin, um ihr zu folgen,[a] und für immer und ewig werde ich nicht von ihr abweichen. In Reinheit fand ich sie, und von Anfang an gewann ich ein Herz für sie.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Ich gab meine Seele hinter ihr her.“ Gemeint ist die entschlossene Hingabe an die Weisheit und das Folgen hinter ihr her.'
    reason: Erläutert die ungewöhnliche hebräische Wendung, ohne נֶפֶשׁ im Haupttext auf „mich selbst“ zu reduzieren.
  - marker: b
    text: 'Die griechische Überlieferung ordnet die Aussagen anders und schließt: „Darum werde ich nicht verlassen werden.“ Der hebräische Text lautet hier: „Für immer und ewig werde ich nicht von ihr abweichen.“'
    reason: Dokumentiert die inhaltlich bedeutsame Abweichung der griechischen Parallelüberlieferung vom zugrunde gelegten hebräischen Text.
lexical_decisions:
- source_word: נַפְשִׁי נָתַתִּי אַחֲרֶיהָ
  choice: Ich gab meine Seele hin, um ihr zu folgen
  rationale: Die Wendung wird quellenah wiedergegeben; „Seele“ bewahrt נֶפֶשׁ, während der Zwecksatz das im Deutschen sonst unklare „hinter ihr her“ natürlich ausdrückt.
- source_word: לְנֵצַח נְצָחִים
  choice: für immer und ewig
  rationale: Gibt die verstärkende hebräische Ewigkeitsformel idiomatisch und würdevoll wieder.
- source_word: לֹא אַטֶּה מִמֶּנָּה
  choice: werde ich nicht von ihr abweichen
  rationale: Bewahrt das Bild des Abwendens beziehungsweise Abweichens, ohne es als bloßes Verlassen zu verengen.
- source_word: בְטָהֳרָה
  choice: In Reinheit
  rationale: Die abstrakte und möglicherweise mehrdeutige Formulierung des Hebräischen bleibt erhalten; sie kann lautere Haltung oder einen Zustand der Reinheit bezeichnen.
- source_word: לֵב קָנִיתִי לָהּ
  choice: gewann ich ein Herz für sie
  rationale: „Herz“ bewahrt die hebräische Bedeutungsbreite von innerer Haltung, Einsicht und Zuneigung. „Gewann“ klingt im Deutschen natürlicher als „erwarb“, ohne den Erwerbsgedanken ganz aufzugeben.
- source_word: מִתְּחִלָּתָהּ
  choice: von Anfang an
  rationale: Idiոմatische Wiedergabe der zeitlichen Aussage; die feminine Endung kann formal auf die Weisheit zurückweisen, ergibt im Deutschen aber am natürlichsten „von Anfang an“.
theological_decisions:
- issue: Personifizierung der Weisheit
  choice: Die femininen Pronomen „ihr/sie“ bleiben erhalten.
  alternative: Die Bezüge durch „die Weisheit“ ausdrücklich auflösen.
  rationale: Der Kontext personifiziert die Weisheit; die Pronomen bewahren diese literarische und theologische Spannung, ohne zusätzliche Deutung einzutragen.
- issue: Bedeutung von לֵב
  choice: „Herz“ statt einer eindeutigen Deutung als Verstand oder Zuneigung.
  alternative: „Verständnis für sie“ oder „Liebe zu ihr“.
  rationale: Im Hebräischen umfasst „Herz“ Denken, Wollen und Empfinden. Eine engere Wiedergabe würde die Aussage unnötig festlegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung „für immer und ewig“ trägt den poetischen Nachdruck des Hebräischen. „Ein Herz für sie gewinnen“ ist verständlich, lässt aber die umfassende althebräische Bedeutung von „Herz“ bewusst offen.
