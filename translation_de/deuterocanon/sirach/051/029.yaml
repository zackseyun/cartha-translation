  text: May my soul rejoice in my old age[a], and may you not be put to shame by my song.
translation:
  language: de
  text: Möge sich meine Seele in meinem Alter freuen[a], und mögt ihr euch meines Liedes nicht schämen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Paralleltext lautet: „Eure Seele freue sich über sein Erbarmen, und schämt euch nicht bei seinem Lobpreis.“ Der hebräische Text hat dagegen „meine Seele“, „in meinem Alter“ und „mein Lied“.'
    reason: alternative_reading
lexical_decisions:
- source_word: תִּשְׂמַח
  choice: Möge sich … freuen
  rationale: Der Wunschcharakter des hebräischen Jussivs wird mit „möge“ wiedergegeben; auch der griechische Optativ stützt diese Auffassung.
- source_word: נַפְשִׁי
  choice: meine Seele
  rationale: Die konkrete hebräische Wendung bleibt erhalten, statt sie zum bloßen „ich“ abzuflachen.
- source_word: בְּשֵׂיבָתִי
  choice: in meinem Alter
  rationale: שֵׂיבָה bezeichnet das graue Haar und, davon abgeleitet, das hohe Alter. „In meinem Alter“ gibt die zeitliche Bedeutung natürlich wieder.
- source_word: וְלֹא תֵבוֹשוּ
  choice: und mögt ihr … nicht beschämt werden
  rationale: Die zweite Person Plural wird ausdrücklich mit „ihr“ bewahrt. Die Formulierung erhält sowohl den Wunschcharakter als auch den Bedeutungsbereich von בוש zwischen Scham und Beschämung.
- source_word: בְּשִׁירָתִי
  choice: durch mein Lied
  rationale: שִׁירָה wird unmittelbar als „Lied“ wiedergegeben. „Durch“ drückt hier natürlich den möglichen Anlass der Beschämung aus; der griechische Paralleltext bietet abweichend „in seinem Lobpreis“.
theological_decisions:
- issue: Deutliche Abweichung zwischen dem hebräischen Text und dem griechischen Paralleltext
  choice: 'Der Haupttext folgt dem erhaltenen Hebräisch: „meine Seele … in meinem Alter … mein Lied“.'
  alternative: 'Griechisch: „Eure Seele freue sich über sein Erbarmen, und ihr mögt euch seines Lobpreises nicht schämen.“'
  rationale: Da ein gut bezeugter hebräischer Text vorliegt, bildet er die Grundlage. Der griechische Text bestätigt zwar Wunschform und Mehrzahl der Angeredeten im zweiten Satzglied, weicht aber bei Person und Inhalt erheblich ab; deshalb wird seine Lesart in einer Fußnote dokumentiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholte Möge-Konstruktion bewahrt den Gebets- beziehungsweise Wunschton; „ihr“ macht den pluralischen Adressatenwechsel sichtbar.
