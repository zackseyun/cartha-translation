review_pass:
  verdict: revise
  source_fidelity: Der Haupttext folgt zutreffend dem hebräischen Wortlaut mit der ersten Person Singular im ersten Satzglied, dem Altersbezug und der zweiten Person Plural im zweiten Satzglied. „Durch mein Lied“ gibt die Präposition בְּ jedoch zu stark kausal wieder und macht das Lied zum Auslöser einer Beschämung. Der hebräische Ausdruck bezeichnet eher den Bereich bzw. Bezug, in dem man sich schämt.
  naturalness: „Möge sich meine Seele in meinem Alter freuen“ ist natürliches, würdiges modernes Standarddeutsch. Für das zweite Satzglied ist „mögt ihr euch meines Liedes nicht schämen“ idiomatischer als die Passivform und zugleich näher am hebräischen Verbgebrauch.
  terminology: „Seele“, „Alter“ und „Lied“ sind angemessen. Die Fußnote dokumentiert die wesentlichen Abweichungen des griechischen Paralleltextes; ihre Wiedergabe wird geringfügig geglättet, damit sie die griechischen Präpositionen nicht unnötig als Besitz- bzw. Kausalverhältnis festlegt.
  issues:
  - severity: medium
    issue: „durch mein Lied“ ist eine zu starke kausale Auslegung von בְּשִׁירָתִי.
    rationale: Die Präposition בְּ bedeutet hier primär „in/bei/im Zusammenhang mit“. „Durch“ legt fest, dass das Lied die Beschämung verursacht, was der hebräische Wortlaut nicht ausdrücklich sagt.
  - severity: low
    issue: „beschämt werden“ ist weniger nah am hebräischen בוש als eine reflexive Schamformulierung.
    rationale: Die deutsche Wendung „sich eines Liedes schämen“ ist idiomatisch und bewahrt die im Hebräischen ausgedrückte Scham, ohne eine externe Beschämung zu behaupten.
