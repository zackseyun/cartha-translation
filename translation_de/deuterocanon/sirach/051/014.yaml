translation:
  language: de
  text: Ich betete in meiner Jugend[a] und fand viel Erkenntnis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Parallelüberlieferung lautet: „Vor dem Tempel bat ich um sie, und bis ans Ende werde ich sie suchen.“ Das hebräische Zeugnis bietet stattdessen: „Ich betete in meiner Jugend und fand viel Erkenntnis.“'
    reason: alternative_reading
lexical_decisions:
- source_word: וָאֶתְפַּלֵּל תְּפִלָּה
  choice: Ich betete
  rationale: Die hebräische figura etymologica („ich betete ein Gebet“) wird in natürlichem Deutsch knapp wiedergegeben; die Aussagekraft des Verbs bleibt erhalten.
- source_word: בִּנְעֻרוֹתָי
  choice: in meiner Jugend
  rationale: Die abstrakte Pluralform bezeichnet die Lebenszeit der Jugend; diese Wendung ist im modernen Standarddeutsch natürlich und genau.
- source_word: וְהַרְבֵּה
  choice: viel
  rationale: In Verbindung mit „Erkenntnis“ gibt „viel“ die bezeichnete Fülle idiomatisch wieder.
- source_word: מָצָאתִי
  choice: fand
  rationale: Die Grundbedeutung „finden“ bewahrt das konkrete Bild des hebräischen Ausdrucks; „erlangte“ wäre stärker deutend.
- source_word: דֵעָה
  choice: Erkenntnis
  rationale: „Erkenntnis“ gibt Wissen und Einsicht wieder, ohne den Ausdruck mit dem sonst eigens bezeichneten Begriff „Weisheit“ gleichzusetzen.
theological_decisions:
- issue: Verhältnis des erhaltenen hebräischen Wortlauts zur abweichenden griechischen Parallelüberlieferung
  choice: 'Der Haupttext folgt dem hoch eingestuften hebräischen Zeugnis: Gebet in der Jugend und das Finden vieler Erkenntnis.'
  alternative: „Vor dem Tempel bat ich um sie, und bis ans Ende werde ich sie suchen.“
  rationale: Die griechische Fassung bietet nicht nur ein ausdrückliches weibliches Bezugswort, sondern insgesamt einen deutlich anderen Satz. Dieses „sie“ in den hebräischen Haupttext einzufügen würde die beiden Überlieferungen harmonisieren und eine im Hebräischen nicht ausgesprochene Ergänzung als Textbestand erscheinen lassen. Daher bleibt die hebräische Lesart im Haupttext erhalten und die echte Textspannung wird in der Fußnote dokumentiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der knappe Satzbau folgt dem Hebräischen, ohne dessen figura etymologica unnatürlich nachzubilden. „Erkenntnis“ hält die begriffliche Unterscheidung zu „Weisheit“ offen.
