  text: Turn to me[a], you who are simple[b], and lodge in the house of my instruction.
translation:
  language: de
  text: Wendet euch mir zu[a], ihr Unwissenden[b], und nehmt Unterkunft im Haus meiner Unterweisung.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Kommt näher zu mir.“ Die griechische Parallele lautet: „Kommt näher zu mir, ihr Ungebildeten, und nehmt Unterkunft im Haus der Unterweisung.“'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort kann auch „ihr Toren“, „ihr Einfältigen“ oder „ihr Ungebildeten“ bedeuten. Die griechische Parallele legt hier Menschen nahe, denen es an Unterweisung fehlt, statt eine rein moralische Beschimpfung.
    reason: alternative_reading
lexical_decisions:
- source_word: פְּנוּ אֵלַי
  choice: Wendet euch mir zu
  rationale: Das hebräische פנה bezeichnet hier das Sich-Hinwenden. Die Formulierung wahrt den Wortlaut und zugleich den einladenden Sinn; die griechische Parallele hat dagegen ausdrücklich „Kommt näher zu mir“.
- source_word: סְכָלִים
  choice: ihr Unerfahrenen
  rationale: סכלים kann törichte, einfältige oder unkundige Menschen bezeichnen. Im pädagogischen Zusammenhang und angesichts des griechischen ἀπαίδευτοι steht der Mangel an Bildung beziehungsweise Unterweisung im Vordergrund, ohne dass der mögliche tadelnde Unterton ganz verschwindet.
- source_word: וְלִינוּ
  choice: und kehrt … ein
  rationale: לין bedeutet übernachten, Herberge nehmen oder verweilen. „Einkehrten“ beziehungsweise „kehrt ein“ bewahrt im Deutschen das Bild, in einem Haus Unterkunft zu nehmen, natürlicher als das gehobene „nächtigt“.
- source_word: בְּבֵית מִדְרָשִׁי
  choice: im Haus meiner Unterweisung
  rationale: Wörtlich ist ein „Haus meines Studiums/meiner Unterweisung“ gemeint. „Haus meiner Unterweisung“ bildet den hebräischen Ausdruck ab, ohne ihn vorschnell als spätere institutionelle Lehranstalt zu bestimmen; die griechische Parallele spricht vom „Haus der Unterweisung“.
theological_decisions:
- issue: Bezeichnet סכלים moralisch verwerfliche Toren oder Menschen, denen Unterweisung fehlt?
  choice: ihr Unerfahrenen
  alternative: ihr Toren; ihr Einfältigen; ihr Ungebildeten
  rationale: Der Weisheits- und Lehrkontext sowie das griechische ἀπαίδευτοι stützen eine pädagogische Bedeutung. „Unerfahrenen“ vermeidet eine rein moralische Beschimpfung, während die Fußnote die stärkeren möglichen Lesarten offenhält.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Kehrt … ein“ hält das konkrete Bild des Übernachtens beziehungsweise Unterkunftnehmens lebendig; „Haus meiner Unterweisung“ wahrt die ungewöhnliche Metapher des Hebräischen.
