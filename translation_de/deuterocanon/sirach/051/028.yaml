  text: Many heard my instruction in my youth[b][a], and they acquired silver and gold by me.
translation:
  language: de
  text: Viele hörten meine Unterweisung, als ich jung war,[a] und sie erwarben durch mich[b] Silber und Gold.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Parallele lautet abweichend: „Nehmt Unterweisung für viel Silber an und erwerbt durch sie viel Gold.“ Der hebräische Text ist hier keine Aufforderung, sondern eine Aussage.'
    reason: alternative_reading
  - marker: b
    text: 'Oder, formnäher: „in mir“. Die knappe hebräische Wendung kann ein Mittel oder eine Vermittlung bezeichnen; „durch mich“ bezieht den Gewinn auf die Unterweisung des Sprechers.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַבִּים
  choice: Viele
  rationale: Die substantivische Wiedergabe ist knapp, natürlich und entspricht der unbestimmten Mehrzahl im Hebräischen.
- source_word: שָׁמְעוּ
  choice: hörten
  rationale: Bewahrt den Grundsinn des Verbs, ohne die stärkere Bedeutung „gehorchten“ in den Text hineinzulesen.
- source_word: לִמּוּדִי
  choice: meine Unterweisung
  rationale: Gibt den didaktischen Sinn des von למד abgeleiteten Nomens in einem würdigen, verständlichen Register wieder.
- source_word: בִּנְעֻרוֹתָי
  choice: als ich jung war
  rationale: Natürliche deutsche Wiedergabe der Lebensperiode des Sprechers; der Bezug der ersten Person bleibt eindeutig.
- source_word: וְכֶסֶף וְזָהָב
  choice: Silber und Gold
  rationale: Erhält die konkreten Edelmetalle und stimmt darin mit der griechischen Parallele überein.
- source_word: תִּקְנוּ
  choice: erwarben
  rationale: קנה bezeichnet hier das Erlangen oder Erwerben; die Aussageform des hebräischen Textes wird beibehalten.
- source_word: בִּי
  choice: durch mich
  rationale: Die knappe Präpositionalfügung wird instrumental beziehungsweise vermittelnd verstanden. Die Formulierung bleibt verständlich, während die wörtlicheren Möglichkeiten in der Fußnote genannt werden.
theological_decisions:
- issue: Verhältnis der hebräischen Aussage zur griechischen Befehlsform
  choice: Der Haupttext folgt dem erhaltenen Hebräisch und formuliert eine Aussage über Menschen, die durch den Sprecher Silber und Gold erwarben.
  alternative: 'Nach der griechischen Parallele: „Nehmt Unterweisung für eine große Menge Silber an und erwerbt durch sie viel Gold.“'
  rationale: Der hoch eingestufte hebräische Zeuge ist hier vorrangig und hat indikativische Verbformen. Die deutlich abweichende griechische Überlieferung wird nicht harmonisierend in den Haupttext übernommen, sondern transparent in einer Fußnote dokumentiert.
- issue: Bedeutung von בִּי
  choice: durch mich
  alternative: „bei mir“, „in mir“ oder „an mir“
  rationale: Die instrumentale Wiedergabe ergibt im Zusammenhang mit der Unterweisung einen verständlichen Sinn, ohne den Sprecher mit der Weisheit gleichzusetzen. Wegen der sprachlichen Kürze und Mehrdeutigkeit des Hebräischen werden Alternativen offengehalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Als ich jung war“ vermeidet die im Deutschen schwerfällige und potenziell missverständliche Stellung von „in meiner Jugend“. Die Satzstellung im zweiten Glied hebt die Vermittlung durch den Sprecher hervor, ohne altertümlich zu wirken.
