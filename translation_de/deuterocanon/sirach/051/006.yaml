  text: My soul came near to death[b][a], and my life to the depths of Sheol.
translation:
  language: de
  text: 'Meine Seele kam dem Tod nahe[a],

    und mein Leben den Tiefen des Scheol[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: „Meine Seele berührte den Tod“ oder „erreichte den Tod“. Gemeint ist wahrscheinlich, dass sie dem Tod nahekam; so auch die griechische Fassung.'
    reason: lexical_alternative
  - marker: b
    text: „Scheol“ ist die hebräische Bezeichnung für den Bereich der Toten; die griechische Fassung hat „Hades unten“.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּגַּע
  choice: kam … nahe
  rationale: נגע bedeutet wörtlich „berühren/erreichen“. Mit לַמָּוֶת bezeichnet es hier wahrscheinlich die Annäherung an den Tod; dies bestätigt die griechische Parallele ἤγγισεν („kam nahe“).
- source_word: נַפְשִׁי
  choice: meine Seele
  rationale: נפש kann „Leben“, „Selbst“ oder „Seele“ bedeuten. „Seele“ bewahrt den poetischen Unterschied zu חַיָּתִי im zweiten Halbvers.
- source_word: חַיָּתִי
  choice: mein Leben
  rationale: Das Wort bezeichnet hier das Leben beziehungsweise die Lebenskraft des Sprechers und entspricht dem griechischen ἡ ζωή μου.
- source_word: לִשְׁאוֹל
  choice: des Scheol
  rationale: Scheol bezeichnet im Hebräischen den Bereich der Toten. Die Transliteration wahrt die Vorstellungswelt des hebräischen Textes und ist weniger eng als „Grab“.
- source_word: תַּחְתִּיּוֹת
  choice: den Tiefen
  rationale: Die Pluralform bezeichnet die untersten oder tiefsten Bereiche. „Die Tiefen des Scheol“ gibt die verstärkende räumliche Aussage natürlich wieder.
theological_decisions:
- issue: Wiedergabe von שְׁאוֹל angesichts der griechischen Parallele ᾅδης
  choice: Scheol
  alternative: Hades; Totenreich; Grab
  rationale: Da der vorhandene hebräische Text primär ist, bleibt sein eigener Begriff erhalten. „Grab“ wäre zu eng, während „Hades“ die griechische Begriffswelt in den hebräischen Text eintragen könnte. Die Fußnote erklärt den Ausdruck ohne eine bestimmte Jenseitslehre festzulegen.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit knappem poetischem Parallelismus. Die Satzellipse im zweiten Halbvers folgt dem Hebräischen und ist im Deutschen gut verständlich. Die Fußnotenmarker stehen unmittelbar bei den jeweils erklärten Ausdrücken.
