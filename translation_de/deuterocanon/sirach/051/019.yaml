lexical_decisions:
- source_word: חַשְׁקָה נַפְשִׁי בָּהּ
  choice: Meine Seele hing an ihr
  rationale: חָשַׁק bezeichnet ein starkes Verlangen oder eine innige Bindung. „hing an ihr“ gibt hier die intensive Zuwendung natürlich wieder und entspricht dem weiblichen Bezug auf die Weisheit.
- source_word: וּפָנַי לֹא אַהֲפֹך מִמֶּנָּה
  choice: und ich wandte mein Gesicht nicht von ihr ab
  rationale: Die hebräische Wendung wird nahezu bildgetreu wiedergegeben; das deutsche Präteritum passt zur rückblickenden Aussage und drückt beharrliche Zuwendung aus.
theological_decisions:
- issue: Weiblicher Bezug des Suffixes בָּהּ / מִמֶּנָּה
  choice: ihr
  alternative: von ihr weg / gegenüber ihr
  rationale: Der feminine Bezug wird bewahrt und verweist im Kontext auf die personifizierte Weisheit, ohne diese im Vers ausdrücklich einzusetzen.
- issue: Bedeutungsumfang von חָשַׁק
  choice: hing an
  alternative: verlangte nach / liebte
  rationale: „hing an“ wahrt sowohl das intensive Begehren als auch die beständige Bindung, ohne die Aussage auf bloßes Gefühl oder eine bestimmte theologische Deutung zu verengen.
translation_notes:
  register: Moderne, würdige Standardsprache; knapper Parallelismus und das Körperbild des abgewandten Gesichts bleiben erhalten.
