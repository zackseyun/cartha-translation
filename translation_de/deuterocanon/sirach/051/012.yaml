  text: For he redeemed me from every evil[a], and delivered me in the day of trouble.
translation:
  language: de
  text: Er erlöste mich von allem Bösen[a] und rettete mich am Tag der Not.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Parallelüberlieferung lautet: „Denn du hast mich vor dem Verderben gerettet und mich aus einer bösen Zeit befreit.“ Der hebräische Text hat „Er erlöste mich von allem Bösen“ und „am Tag der Not“.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּפְדֵּנִי
  choice: er erlöste mich
  rationale: Das hebräische פדה bezeichnet Loskaufen beziehungsweise befreiende Erlösung. „Erlöste“ bewahrt diese stärkere Bedeutung, ohne den Ausdruck auf eine rein geistliche Deutung festzulegen.
- source_word: מִכָּל רָע
  choice: von allem Bösen
  rationale: רָע kann moralisches Böses, Unheil oder Widriges bezeichnen. „Alles Böse“ erhält die Bedeutungsbreite des Hebräischen, statt vorschnell auf Schaden oder Unglück einzuengen.
- source_word: וַיְמַלְּטֵנִי
  choice: rettete mich
  rationale: מלט bezeichnet hier das Entrinnenlassen beziehungsweise In-Sicherheit-Bringen. „Rettete“ ist im modernen Deutsch natürlich und hält den Parallelismus zu „erlöste“ aufrecht.
- source_word: בְּיוֹם צָרָה
  choice: am Tag der Not
  rationale: Die konkrete hebräische Wendung bezeichnet eine Zeit der Bedrängnis. „Am Tag der Not“ wahrt das Bild und klingt zugleich würdig und verständlich.
theological_decisions:
- issue: Vorrang des hebräischen Textes gegenüber der griechischen Parallelüberlieferung
  choice: Der erhaltene hebräische Wortlaut bildet den Haupttext; das Griechische wird als Kontroll- und Alternativüberlieferung in der Fußnote wiedergegeben.
  alternative: 'Eine stärker griechisch geprägte Fassung: „Denn du hast mich vor dem Verderben gerettet und mich aus einer bösen Zeit befreit.“'
  rationale: Der hebräische Text ist an dieser Stelle erhalten, verständlich und weicht in Person, Wortwahl und Präpositionen vom griechischen Paralleltext ab. Diese Unterschiede werden nicht harmonisiert, sondern transparent dokumentiert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die poetische Parallelstruktur und die konkrete Zeitangabe des Hebräischen bleiben erhalten; die Subjektform der hebräischen Überlieferung („er“) wird nicht an das griechische „du“ angeglichen.
