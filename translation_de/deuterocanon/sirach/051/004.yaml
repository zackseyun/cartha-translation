translation:
  language: de
  text: aus einem würgenden Feuer ringsum[a] und mitten aus einem Feuer, das ich nicht angezündet habe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der erhaltene hebräische Text dieses Verses ist schwer verständlich und weicht stark vom Griechischen ab. Die zweite Hälfte ließe sich in enger Anlehnung an das Hebräische etwa mit „aus dem Schoß der Tiefe, zu meiner Mutter“ wiedergeben; ihr Sinn bleibt im Zusammenhang jedoch unklar.
    reason: textual_variant
lexical_decisions:
- source_word: מְכַבּוֹת אֵשׁ
  choice: aus einem würgenden Feuer
  rationale: Der überlieferte hebräische Ausdruck ist schwierig. Die griechische Parallele ἀπὸ πνιγμοῦ πυρᾶς stützt den verständlichen Sinn eines erstickenden bzw. würgenden Feuers. „Würgend“ bewahrt das körperlich bedrohliche Bild und klingt im Deutschen natürlicher als „erstickend“ auf ein Feuer bezogen.
- source_word: לְאֵין פֶּחָה
  choice: ringsum
  rationale: Das Hebräische ist hier unsicher und ergibt im Zusammenhang keinen verlässlichen idiomatischen Sinn. Die griechische Lesart κυκλόθεν bedeutet „ringsum“ und schafft eine kohärente Aussage.
- source_word: אֵשׁ / πυρός
  choice: Feuer
  rationale: Die Feuerbildlichkeit ist sowohl im Hebräischen als auch im Griechischen eindeutig belegt.
- source_word: ἐκ μέσου πυρός
  choice: mitten aus einem Feuer
  rationale: Die griechische Parallele bietet hier einen klaren, kontextgerechten Wortlaut. „Mitten aus“ gibt ἐκ μέσου natürlich und anschaulich wieder.
- source_word: οὗ οὐκ ἐξέκαυσα
  choice: das ich nicht angezündet hatte
  rationale: Die aktive Verbform bezeichnet am natürlichsten ein Feuer, das der Sprecher nicht selbst entfachte. Das Plusquamperfekt verdeutlicht im Deutschen, dass das Anzünden der beschriebenen Rettung vorausliegt.
theological_decisions:
- issue: Heranziehung der griechischen Parallele bei stark abweichendem, schwer verständlichem Hebräisch
  choice: Der Haupttext folgt dem kohärenten griechischen Sinn und bewahrt zugleich das im Hebräischen belegte Feuerbild.
  alternative: 'Eine formnahe Wiedergabe des erhaltenen Hebräischen: „von Löschungen des Feuers ohne Blasen, aus dem Schoß der Tiefe, zu meiner Mutter“ beziehungsweise ähnlich.'
  rationale: Der hebräische Text hat grundsätzlich Vorrang, ist an dieser Stelle jedoch offenbar instabil oder verderbt und besonders in der zweiten Hälfte im Kontext kaum verständlich. Die griechische Überlieferung bietet eine kohärente Lesart des Rettungsmotivs. Die erhebliche Abweichung wird deshalb ausdrücklich in einer Fußnote offengelegt, statt sie stillschweigend zu harmonisieren.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die ungewöhnliche Wendung „würgendes Feuer“ erhält die Bedrohlichkeit der griechischen Parallele, ohne den schwierigen hebräischen Text durch eine scheinbar sichere Deutung zu glätten.
