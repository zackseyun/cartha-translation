translation:
  language: de
  text: Und ich erhob meine Stimme von der Erde her[a], und von den Toren des Scheols[b] rief ich um Hilfe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „vom Land her“. Der hebräische Text lautet „von der Erde/dem Land her“; die griechische Überlieferung hat dagegen „auf der Erde“ und weicht damit geringfügig ab.'
    reason: textual_variant
  - marker: b
