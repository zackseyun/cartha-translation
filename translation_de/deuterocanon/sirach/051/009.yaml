    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָרִים
  choice: ich erhob
  rationale: רום bezeichnet hier mit קוֹלִי als Objekt das Erheben der Stimme; „erhob“ bewahrt das konkrete poetische Bild und klingt würdig.
- source_word: מֵאֶרֶץ
  choice: von der Erde her
  rationale: Die hebräische Präposition מִן bedeutet am natürlichsten „von/aus“. „Von der Erde her“ gibt den Ausgangspunkt wieder, ohne die mögliche Bedeutung „Land“ auszuschließen; die griechische Abweichung wird in einer Fußnote dokumentiert.
- source_word: קוֹלִי
  choice: meine Stimme
  rationale: קוֹל bedeutet unmittelbar „Stimme“ oder „Laut“. „Meine Stimme“ wahrt die Bildlichkeit der hebräischen Wortverbindung.
- source_word: וּמִּשַּׁעֲרֵי
  choice: und von den Toren
  rationale: Der Pluralstatus constructus von שַׁעַר ist wörtlich „Tore von“ und bewahrt das konkrete Schwellenbild.
- source_word: שְׁאוֹל
  choice: des Scheols
  rationale: Die Transkription „Scheol“ erhält den hebräischen Begriff für den Bereich der Toten, ohne ihn vorschnell mit Grab, Unterwelt oder einer späteren Jenseitsvorstellung gleichzusetzen.
- source_word: שִׁוַּעְתִּי
  choice: schrie ich auf
  rationale: שוע bezeichnet einen dringlichen Hilferuf. „Schrie ich auf“ bleibt ohne ein im Hebräischen nicht ausdrücklich genanntes Objekt und vermittelt dennoch die Notlage.
theological_decisions:
- issue: Wiedergabe von שְׁאוֹל
  choice: Scheol
  alternative: das Totenreich / die Unterwelt / das Grab
  rationale: „Scheol“ bewahrt die Eigenart und Offenheit des hebräischen Begriffs und legt keine spätere Lehre vom Zustand der Toten fest.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewahrtem poetischem Parallelismus. Die Wiederholung „von … her / von …“ folgt der hebräischen Bewegung; „Scheol“ wird wegen seiner theologischen Offenheit beibehalten und erläutert.
