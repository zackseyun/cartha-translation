  source_fidelity: Der erste Halbvers gibt וְאָרִים ... קוֹלִי und מֵאֶרֶץ zutreffend als „ich erhob meine Stimme von der Erde her“ wieder. „Scheol“ bewahrt שְׁאוֹל angemessen. Für שִׁוַּעְתִּי ist jedoch der Charakter eines dringlichen Hilferufs stärker und genauer als mit dem im Deutschen oft bloß erschrockenes Schreien bezeichnenden „schrie ich auf“ wiederzugeben.
