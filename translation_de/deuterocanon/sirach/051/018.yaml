translation:
  language: de
  text: Ich nahm mir vor, meinen Weg zu bessern[a], und ich werde nicht umkehren, denn ich werde ihn finden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Text lautet: „Denn ich beschloss, sie zu verwirklichen, und ich eiferte nach dem Guten, und ich werde gewiss nicht beschämt werden.“ Er bietet hier eine erheblich abweichende Textform gegenüber dem erhaltenen hebräischen Text.'
    reason: textual_variant
lexical_decisions:
- source_word: חָשַׁבְתִּי
  choice: Ich nahm mir vor
  rationale: Das Verb bezeichnet hier ein bewusstes Erwägen und einen zielgerichteten Entschluss; die idiomatische deutsche Wendung gibt diese Absicht natürlich wieder.
- source_word: לְהִיטֶיב
  choice: zu bessern
  rationale: Mit „meinen Weg“ als Ergänzung bezeichnet der Infinitiv das Verbessern der eigenen Lebensführung. „Bessern“ bewahrt diesen Sinn knapp und würdevoll.
- source_word: דַּרְכִּי
  choice: meinen Weg
  rationale: „Weg“ erhält die hebräische Metapher für Lebenswandel und Verhalten, ohne sie auf eine rein abstrakte Deutung festzulegen.
- source_word: וְלֹא אַהֲפֹךְ
  choice: und ich werde nicht umkehren
  rationale: Die schwierige Formulierung drückt im Zusammenhang aus, dass der Sprecher den eingeschlagenen Kurs nicht rückgängig machen wird. „Umkehren“ wahrt das Wegmotiv.
- source_word: כִּי אֶמְצָאֶנּוּ
  choice: denn ich werde es finden
  rationale: מצא bedeutet „finden“ oder „erlangen“. Das pronominale Objekt bleibt wie im Hebräischen in seinem Bezug offen; „es“ bewahrt diese Unbestimmtheit besser als eine erklärende Ergänzung.
theological_decisions:
- issue: Abweichung zwischen dem hebräischen und dem griechischen Textschluss
  choice: 'Der Haupttext folgt dem hebräischen Zeugnis: „und ich werde nicht umkehren, denn ich werde es finden.“'
  alternative: 'Der griechische Text lautet sinngemäß: „Denn ich beschloss, sie zu tun, und ich eiferte nach dem Guten, und ich werde gewiss nicht beschämt werden.“'
  rationale: Wo ein erhaltenes hebräisches Sirach-Zeugnis vorliegt, wird ihm hier Vorrang gegeben. Da die griechische Überlieferung eine wesentlich andere Textform bietet und den Sinn deutlich verändert, wird sie vollständig in einer Fußnote dokumentiert.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. „Meinen Weg bessern“ bewahrt die biblische Wegmetapher; „es finden“ lässt den im Hebräischen nicht ausdrücklich genannten Bezug bewusst offen.
