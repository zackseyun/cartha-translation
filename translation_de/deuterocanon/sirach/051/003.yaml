  text: from the snare of those watching for my stumbling[a], and from the hand of those seeking my life. You saved me from many troubles[b], and from the distress of a flame all around.
translation:
  language: de
  text: 'aus der Schlinge derer, die auf mein Straucheln lauerten,[a]

    und aus der Hand derer, die mir nach dem Leben trachteten.


    Aus vielen Nöten hast du mich gerettet

    und aus den Bedrängnissen einer Flamme ringsum.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die auf meinen Fall lauerten“ beziehungsweise „die mein Hinken beobachteten“. Die hebräische Wendung ist bildhaft und nicht völlig eindeutig.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich steht im Hebräischen: „aus den Bedrängnissen einer Flamme ringsum“. Der griechische Paralleltext weicht hier erheblich ab und bietet eine ausführlichere Beschreibung der Rettung.'
    reason: textual_variant
lexical_decisions:
- source_word: מִמּוֹקֵשׁ
  choice: aus der Schlinge
  rationale: מוֹקֵשׁ bezeichnet eine Schlinge oder Falle. „Schlinge“ bewahrt das konkrete poetische Bild.
- source_word: צוֹפֵי צַלְעִי
  choice: die auf mein Straucheln lauerten
  rationale: צוֹפֵי bezeichnet Beobachtende; צַלְעִי kann auf Hinken, Straucheln oder den erwarteten Fall weisen. „Auf mein Straucheln lauerten“ gibt die feindselige Beobachtung natürlich wieder, ohne die leichte Unsicherheit aufzulösen.
- source_word: וּמִּיַד
  choice: und aus der Hand
  rationale: Die hebräische Wendung bezeichnet Macht oder Gewalt; das konkrete Bild und der Parallelismus bleiben erhalten.
- source_word: מְבַקְשֵׁי נַפְשִׁי
  choice: die mir nach dem Leben trachteten
  rationale: נפשׁ bezeichnet in diesem Bedrohungskontext das Leben. Die deutsche feste Wendung gibt die tödliche Absicht klar und idiomatisch wieder.
- source_word: מֵרַבּוֹת צָרוֹת
  choice: aus vielen Nöten
  rationale: רַבּוֹת wird hier quantitativ als „viele“ verstanden; צָרוֹת meint Bedrängnisse oder Nöte.
- source_word: הוֹשַׁעְתָּנִי
  choice: hast du mich gerettet
  rationale: ישע bedeutet retten oder befreien. „Gerettet“ ist direkt und bewahrt die persönliche Anrede.
- source_word: וּמִמְּצוּקוֹת
  choice: und aus der Bedrängnis
  rationale: מְצוּקוֹת bezeichnet Bedrängnis, Enge oder Not. Die Formulierung erhält die schwierige Genitivverbindung mit dem folgenden Bild.
- source_word: שַׁלְהֶבֶת מִסָּבִיב
  choice: einer Flamme ringsum
  rationale: Die konkrete Flammenmetapher und das Bild vollständiger Umringung bleiben stehen; ob wörtliches Feuer oder bildhafte Not gemeint ist, wird nicht entschieden.
theological_decisions:
- issue: Wiedergabe von נפשי
  choice: mir nach dem Leben trachteten
  alternative: meine Seele suchten
  rationale: Im Zusammenhang mit Feinden, Schlinge und Rettung bezeichnet die hebräische Wendung die Bedrohung des Lebens und macht keine Aussage über das Wesen der Seele.
- issue: Deutung der umgebenden Flamme
  choice: aus der Bedrängnis einer Flamme ringsum
  alternative: aus ringsum flammender Bedrängnis
  rationale: Die gewählte Fassung hält das konkrete und syntaktisch schwierige hebräische Bild offen, statt zwischen buchstäblichem Feuer und metaphorischer Not zu entscheiden.
- issue: Stark abweichende griechische Parallelüberlieferung
  choice: Der hebräische Text ist Grundlage des Haupttextes
  alternative: Übernahme der ausführlicheren griechischen Rettungsbeschreibung
  rationale: Der griechische Paralleltext erweitert beziehungsweise verändert diesen Abschnitt erheblich. Wegen der hohen Sicherheit des hebräischen Zeugnisses wird dessen Wortlaut übersetzt und die Abweichung in einer Fußnote kenntlich gemacht.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit poetischem Parallelismus. „Nach dem Leben trachten“ ist allgemein verständlich und gibt das hebräische Idiom natürlich wieder. Die ungewöhnliche Schlusswendung bleibt bewusst nah am Hebräischen, damit ihre Bildhaftigkeit und Mehrdeutigkeit erhalten bleiben.
