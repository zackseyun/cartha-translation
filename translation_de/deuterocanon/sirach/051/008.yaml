base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/051/008.yaml
  text: And I remembered the mercies of Yahweh[a], and his acts of covenant faithfulness from of old, who delivers those who take refuge in him[b], and redeems them from every evil.
translation:
  language: de
  text: Und ich erinnerte mich an Jahwes Erbarmen und an seine Treue von alters her[a]. Er rettet die, die bei ihm Zuflucht suchen[b], und erlöst sie von allem Übel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „an seine beständige Liebe von Ewigkeit her“. Das Hebräische kann die seit ältester Zeit erwiesene oder die immerwährende Treue Gottes betonen.'
    reason: lexical_alternative
  - marker: b
    text: 'Die griechische Überlieferung lautet: „an dein Erbarmen, Herr, und an dein Wirken von alters her; denn du rettest die, die auf dich warten, und befreist sie aus der Hand der Völker“. Der hebräische Text hat dagegen „die bei ihm Zuflucht suchen“ und „von allem Übel“.'
    reason: alternative_reading
lexical_decisions:
- source_word: וָאֶזְכְּרָה
  choice: Und ich erinnerte mich
  rationale: זכר bezeichnet das Erinnern oder Sich-ins-Gedächtnis-Rufen; die gewählte Form ist direkt und im modernen Deutschen natürlich.
- source_word: רַחֲמֵי יְהֹוָה
  choice: Jahwes Erbarmen
  rationale: Der hebräische Plural kann einzelne Erweise des Erbarmens oder die Fülle göttlichen Erbarmens ausdrücken. Das deutsche Kollektivum bewahrt den Sinn ohne die unnatürliche Form „Erbarmungen“.
- source_word: וַחֲסָדָיו
  choice: und an seine Treue
  rationale: חסד umfasst Güte, beständige Liebe und loyale Treue. „Treue“ passt zur lang andauernden rettenden Zuwendung, ohne den im Vers nicht ausdrücklich genannten Bundesbegriff einzufügen.
- source_word: אֲשֶׁר מֵעוֹלָם
  choice: von alters her
  rationale: Die Wendung kann auf uralte Zeit oder auf immerwährende Dauer weisen. „Von alters her“ erhält die zeitliche Tiefe, ohne die Mehrdeutigkeit zugunsten eines metaphysischen Ewigkeitsbegriffs aufzulösen.
- source_word: הַמַּצִּיל
  choice: Er rettet
  rationale: Das substantivierte Partizip beschreibt Jahwe als den Rettenden. Ein neuer deutscher Hauptsatz gibt diese Charakterisierung klar und natürlich wieder.
- source_word: חוֹסֵי בוֹ
  choice: die, die bei ihm Zuflucht suchen
  rationale: חסה ב bezeichnet konkret das Suchen von Schutz und Zuflucht, nicht nur allgemeines Vertrauen.
- source_word: וַיִּגְאָלֵם
  choice: und erlöst sie
  rationale: גאל bezeichnet rettendes Loskaufen beziehungsweise Erlösen und besitzt ein stärkeres Bedeutungsprofil als das allgemeinere „retten“.
- source_word: מִכָּל רָע
  choice: von allem Bösen
  rationale: רָע kann moralisches Übel, Unheil oder Schädliches bezeichnen. „Alles Böse“ hält diese semantische Breite offen.
theological_decisions:
- issue: Bedeutungsumfang von חסד bei Gottes rettendem Handeln
  choice: seine Treue
  alternative: seine beständige Liebe / seine Gnadenerweise
  rationale: „Treue“ bringt Gottes dauerhafte, verlässliche Zuwendung zum Ausdruck, ohne den nicht ausdrücklich genannten Begriff „Bund“ in den Haupttext einzutragen. Die Fußnote wahrt die mögliche Betonung beständiger Liebe.
- issue: Zeitlicher Sinn von מֵעוֹלָם
  choice: von alters her
  alternative: von Ewigkeit her
  rationale: Der Zusammenhang kann sowohl auf seit frühester Zeit erfahrenes Handeln als auch auf immerwährende göttliche Treue weisen. Der Haupttext vermeidet eine unnötige Festlegung; die Alternative wird in der Fußnote genannt.
- issue: Verhältnis des rettenden Partizips zum vorausgehenden Gottesgedenken
  choice: Er rettet … und erlöst sie
  alternative: der die rettet … und sie erlöst
  rationale: Der selbstständige Satz gibt die hebräische Charakterisierung Gottes verständlich wieder und vermeidet einen schwerfälligen oder grammatisch mehrdeutigen deutschen Relativanschluss.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Jahwe“ gibt den Gottesnamen ausdrücklich wieder. Abstrakte Singularformen wie „Erbarmen“ und „Treue“ vermeiden unnatürliche deutsche Plurale, während die Fußnote die Handlungs- und Dauerkomponente von חסד offenhält.
