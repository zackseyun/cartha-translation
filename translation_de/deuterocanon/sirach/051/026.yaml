  rationale: Die Revision ersetzt allein die im Deutschen unnatürliche Wendung „Bringt eure Nacken unter“ durch das idiomatische und dem Jochbild genau entsprechende „Beugt euren Nacken unter“. Der kollektive Singular ist hier im modernen Deutschen natürlicher als der anatomische Plural. Die Fußnote wird sprachlich präzisiert; ihre inhaltliche Aussage und die Priorität des hebräischen Wortlauts bleiben unverändert.
