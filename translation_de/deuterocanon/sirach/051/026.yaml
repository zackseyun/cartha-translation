base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/051/026.yaml
  text: Bring your neck under her yoke[a], and let your soul bear her burden. She is near to those who seek her, and the one who gives himself finds her.
translation:
  language: de
  text: Beugt euren Nacken unter ihr Joch[a], und eure Seele trage ihre Last. Sie ist denen nahe, die sie suchen, und wer sich selbst hingibt, findet sie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Parallelüberlieferung hat: »und eure Seele nehme Unterweisung an«. Im Hebräischen steht: »und eure Seele trage ihre Last«.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְצַוְּארֵיכֶם
  choice: eure Nacken
  rationale: Die hebräische Form ist pluralisch. Im Deutschen ist auch bei einer Anrede an mehrere Personen der Plural »eure Nacken« natürlich und bewahrt das konkrete Körperbild.
- source_word: בְּעֻלָּהּ הָבִיאוּ
  choice: Bringt ... unter ihr Joch
  rationale: Das Hebräische ist für sich genommen schwierig; die griechische Parallele bestätigt jedoch das Bild des Jochs. Die deutsche Wendung gibt die aktive Aufforderung idiomatisch wieder.
- source_word: וּמַשָּׂאָהּ
  choice: ihre Last
  rationale: Das Substantiv bezeichnet eine Last oder Bürde und führt das Bild des Jochs folgerichtig weiter.
- source_word: תִּשָּׂא נַפְשְׁכֶם
  choice: eure Seele trage
  rationale: Die Formulierung folgt dem erhaltenen Hebräisch und bewahrt dessen Rede von der Seele. Der Singular »Seele« entspricht der hebräischen Form und kann kollektiv auf die angesprochene Gruppe bezogen werden.
- source_word: קְרוּבָה הִיא לִמְבַקְשֶׁיהָ
  choice: Sie ist denen nahe, die sie suchen
  rationale: Die feminine Grammatik verweist auf die personifizierte Weisheit. Die deutsche Formulierung bewahrt sowohl ihre Nähe als auch das aktive Suchen.
- source_word: וְנוֹתֵן נַפְשׁוֹ
  choice: wer sich selbst hingibt
  rationale: Wörtlich steht »wer seine Seele beziehungsweise sein Leben gibt«. Im Zusammenhang bezeichnet dies persönliche, uneingeschränkte Hingabe; »sich selbst hingibt« wahrt diese Stärke, ohne unnötig den Gedanken des Sterbens nahezulegen.
- source_word: מוֹצֵא אֹתָהּ
  choice: findet sie
  rationale: Dies entspricht unmittelbar dem hebräischen Verb und erhält die personifizierte feminine Gestalt der Weisheit.
theological_decisions:
- issue: Personifikation der Weisheit
  choice: Durchgehend feminine Pronomen verwenden
  alternative: Weisheit als unpersönliches »sie« nur grammatisch oder als »das« wiedergeben
  rationale: Die feminine Grammatik und der Zusammenhang stellen die Weisheit als weibliche Gestalt dar. Die Übersetzung bewahrt diese Personifikation, ohne sie dogmatisch näher zu bestimmen.
- issue: Verhältnis des hebräischen und griechischen Wortlauts im zweiten Satzglied
  choice: Im Haupttext dem Hebräischen »ihre Last tragen« folgen
  alternative: Nach der griechischen Parallele »eure Seele nehme Unterweisung an«
  rationale: Der erhaltene hebräische Wortlaut ist verständlich und bildet die primäre Textgrundlage. Die deutlich abweichende griechische Überlieferung wird als bedeutsame Alternative in der Fußnote dokumentiert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Joch- und Lastmetaphorik sowie die personifizierte Weisheit bleiben erhalten. Der Imperativ richtet sich an mehrere Personen; die syntaktische Parallelität der beiden ersten Satzglieder wird gewahrt.
