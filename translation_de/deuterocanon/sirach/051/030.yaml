  yaml_path: translation/deuterocanon/sirach/051/030.yaml
  text: Do your work in righteousness[a], and he will give you your reward in its time. Blessed is Yahweh forever, and praised is his name from generation to generation.
translation:
  language: de
  text: Tut eure Arbeit in Gerechtigkeit, und er wird euch euren Lohn zu seiner Zeit geben.[a] Gepriesen ist Jahwe in Ewigkeit, und gepriesen ist sein Name von Generation zu Generation.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „zur rechten Zeit“ oder „zu Gottes Zeit“. Das hebräische בְּעִתּוֹ und das griechische ἐν καιρῷ αὐτοῦ können die für den Lohn bestimmte Zeit meinen; das Pronomen kann aber auch auf Gott bezogen werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַעֲשֵׂיכֶם עֲשׂוּ
  choice: Tut eure Arbeit
  rationale: Die Verbindung aus מַעֲשֶׂה und עשה bedeutet wörtlich etwa „tut euer Werk“. „Tut eure Arbeit“ gibt die Aufforderung natürlich wieder, ohne die hebräische Wortwiederholung künstlich nachzubilden.
- source_word: בִצְדָקָה
  choice: in Gerechtigkeit
  rationale: Die Wendung bezeichnet die Art und Weise des Handelns. „In Gerechtigkeit“ bewahrt den ethisch-theologischen Leitbegriff und bleibt im Deutschen verständlich.
- source_word: וְהוּא
  choice: und er
  rationale: Das Pronomen verweist im Zusammenhang auf Gott, nennt ihn aber nicht ausdrücklich. Die Wiedergabe als „er“ wahrt diese Form des Hebräischen.
- source_word: נוֹתֵן לָכֶם שְׂכַרְכֶם
  choice: wird euch euren Lohn geben
  rationale: שְׂכַר kann Lohn, Vergeltung oder Belohnung bedeuten. „Lohn“ entspricht auch dem griechischen μισθός und erhält das Bild der angemessenen Entlohnung. Das Futur gibt den verheißenden Sinn des Partizips wieder.
- source_word: בְּעִתּוֹ
  choice: zu seiner Zeit
  rationale: Die Form kann auf die rechte beziehungsweise bestimmte Zeit des Lohnes oder auf Gottes Zeit bezogen werden. Das deutsche „zu seiner Zeit“ bewahrt diese Mehrdeutigkeit weitgehend.
- source_word: בָּרוּךְ יְהֹוָה לְעוֹלָם
  choice: Gepriesen ist Jahwe in Ewigkeit
  rationale: Die prädikative Form gibt die hebräische Segensformel würdig und natürlich wieder. Der Gottesname יְהוָה wird als „Jahwe“ wiedergegeben.
- source_word: וּמְשֻׁבָּח שְׁמוֹ לְדֹר וָדֹר
  choice: und sein Name sei gelobt von Generation zu Generation
  rationale: Die Formulierung erhält den doxologischen Parallelismus und gibt die feste Wendung לְדֹר וָדֹר verständlich wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהֹוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. „Jahwe“ gibt den Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Ethisch-theologische Bedeutung von צְדָקָה
  choice: Gerechtigkeit
  alternative: Rechtschaffenheit; was recht ist
  rationale: „Gerechtigkeit“ bewahrt den zentralen Begriff der Weisheits- und Glaubenssprache, ohne ihn auf bloße Gesetzestreue oder soziale Gerechtigkeit einzuengen.
- issue: Bezug des Suffixes in בְּעִתּוֹ
  choice: Mehrdeutigkeit in „zu seiner Zeit“ bewahrt
  alternative: zur rechten Zeit; zu Gottes Zeit
  rationale: Das Suffix kann als Bezug auf den Lohn beziehungsweise dessen angemessenen Zeitpunkt oder als Hinweis auf Gottes Zeit verstanden werden. Der Haupttext entscheidet diese Spannung nicht einseitig.
translation_notes:
  register: Moderne, würdige Standardsprache mit weisheitlicher und doxologischer Färbung. Der Imperativ bleibt direkt, die theologischen Schlüsselbegriffe „Gerechtigkeit“ und „Jahwe“ werden sichtbar gehalten. Der Fußnotenmarker steht unmittelbar bei der mehrdeutigen Zeitangabe.
