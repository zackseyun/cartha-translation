base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/051/010.yaml
  text: 'And I will exalt you: O Yahweh[a], you are my Father, for you are the mighty one of my salvation. Do not let me grow weak in the day of distress[b], in the day of ruin and desolation.'
translation:
  language: de
  text: 'Und ich will dich hoch preisen: HERR[a], du bist mein Vater, denn du bist der mächtige Retter, der mir Heil schafft. Lass mich am Tag der Bedrängnis nicht kraftlos werden[b], am Tag des Verderbens und der Verwüstung.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Griechisch: „Ich rief den Herrn an, den Vater meines Herrn.“ Der hebräische Text lautet: „HERR, du bist mein Vater.“'
    reason: alternative_reading
  - marker: b
    text: 'Griechisch: „Verlass mich nicht in Tagen der Bedrängnis.“ Das hebräische Verb bedeutet wörtlicher „lass mich nicht erschlaffen“ oder „lass mich nicht kraftlos werden“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲרוֹמֵם
  choice: Und ich will dich erheben
  rationale: Das Piʿel von רומם bedeutet „erheben, hoch preisen“. Die Zukunftsform wahrt die im hebräischen Kontext mögliche vorwärtsgerichtete Erklärung; das im Gebetszusammenhang vorausgesetzte Objekt wird zur Klarheit als „dich“ ausgedrückt.
- source_word: יְהֹוָה
  choice: HERR
  rationale: Der Gottesname wird nach gängiger deutscher Bibelkonvention mit „HERR“ wiedergegeben; die bedeutende Abweichung der griechischen Überlieferung wird in Fußnote [a] dokumentiert.
- source_word: אָבִי
  choice: mein Vater
  rationale: Der erhaltene hebräische Text lautet eindeutig „mein Vater“. Die griechische Lesart „Vater meines Herrn“ wird nicht in den Haupttext eingetragen, aber in Fußnote [a] bewahrt.
- source_word: גִּבּוֹר יִשְׁעִי
  choice: der Held meines Heils
  rationale: גִּבּוֹר ist substantivisch und bezeichnet einen Mächtigen beziehungsweise Helden. „Held meines Heils“ wahrt die knappe Nominalfügung und ihre Kraft, ohne sie ausdrücklich militärisch auszudeuten.
- source_word: אַל תַּרְפֵּנִי
  choice: Lass mich nicht kraftlos werden
  rationale: רפה bezeichnet das Erschlaffen, Nachlassen oder Schwachwerden. Die Formulierung ist natürliches Deutsch und folgt dem hebräischen Bild statt der griechischen Lesart „verlass mich nicht“.
- source_word: בְּיוֹם צָרָה
  choice: am Tag der Bedrängnis
  rationale: צָרָה bezeichnet Not oder Bedrängnis. „Bedrängnis“ wahrt den ernsten, gehobenen Ton.
- source_word: בּיוֹם שׁוֹאָה וּמְשׁוֹאָה
  choice: am Tag von Verderben und Verwüstung
  rationale: Die beiden verwandten Unheilsbegriffe werden mit zwei unterscheidbaren deutschen Substantiven wiedergegeben, statt die hebräische Häufung einzuebnen.
theological_decisions:
- issue: Abweichung zwischen dem hebräischen und dem griechischen Gottesruf
  choice: 'Im Haupttext dem Hebräischen folgen: „HERR, du bist mein Vater“'
  alternative: 'Nach dem Griechischen: „Ich rief den Herrn an, den Vater meines Herrn“'
  rationale: Wo der hebräische Sirachtext erhalten und verständlich ist, hat er Vorrang. Die griechische Fassung kann eine andere Vorlage bezeugen und wird deshalb als gewichtige Alternative in Fußnote [a] vollständig angegeben.
- issue: Bedeutung der Bitte אַל תַּרְפֵּנִי
  choice: Die hebräische Vorstellung des Kraftloswerdens wiedergeben
  alternative: 'Nach dem Griechischen: „Verlass mich nicht“'
  rationale: Das Hebräische spricht von Erschlaffen oder Schwachwerden, das Griechische dagegen vom Verlassenwerden. Der Haupttext harmonisiert diese Aussagen nicht; Fußnote [b] bewahrt die abweichende griechische Lesart.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bibelsprachlicher Prägnanz. „Held meines Heils“ erhält die markante hebräische Nominalfügung; „kraftlos werden“ vermeidet eine unnatürliche Wörtlichkeit und grenzt die hebräische Lesart klar vom griechischen „verlassen“ ab. Sämtliche Fußnotenmarker stehen im Haupttext.
