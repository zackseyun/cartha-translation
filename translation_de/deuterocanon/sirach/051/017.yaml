translation:
  language: de
  text: Ihr Joch gereichte mir zur Ehre, und meinen Lehrern werde ich Dank sagen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hebräische Text ist an dieser Stelle schwierig und weicht deutlich von der griechischen Überlieferung ab. Hebräisch ungefähr: „Ihr Joch gereichte mir zur Ehre, und meinen Lehrern werde ich Dank sagen.“ Griechisch: „In ihr machte ich Fortschritte; dem, der mir Weisheit gibt, werde ich Herrlichkeit geben.“'
    reason: textual_variant
lexical_decisions:
- source_word: עֻלָּהּ
  choice: ihr Joch
  rationale: Die überlieferte hebräische Form ist schwierig, lässt sich aber am ehesten als „ihr Joch“ verstehen. Diese Wiedergabe folgt dem primären hebräischen Text, statt die deutlich abweichende griechische Lesart „in ihr machte ich Fortschritte“ in den Haupttext zu übernehmen.
- source_word: הָיָה לִי לְכָבוֹד
  choice: brachte mir Ehre
  rationale: Wörtlich etwa „war mir zur Ehre“. Die verbale Formulierung ist natürliches modernes Deutsch und bewahrt den Sinn von כָּבוֹד.
- source_word: לִמְלַמְּדַי
  choice: meinen Lehrern
  rationale: Die Konsonanten und Punktierung weisen auf einen Plural („meine Lehrer“) hin. Damit bleibt der Unterschied zur griechischen Einzahl „dem, der mir Weisheit gibt“ sichtbar.
- source_word: הוֹדָאָה
  choice: Dank sagen
  rationale: הוֹדָאָה bezeichnet hier Dank beziehungsweise Danksagung. Die idiomatische Wendung „Dank sagen“ gibt dies im Deutschen klar wieder.
theological_decisions:
- issue: Adressat des Dankes
  choice: menschliche oder nicht näher bestimmte Lehrer im Plural
  alternative: Gott als der eine Geber der Weisheit
  rationale: Der hebräische Hauptzeuge hat „meinen Lehrern“, während die griechische Überlieferung einen einzelnen Geber der Weisheit nennt und damit wahrscheinlich auf Gott weist. Der Haupttext folgt dem Hebräischen; die Fußnote wahrt die abweichende theologische Akzentsetzung des Griechischen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Haupttext folgt trotz der schwierigen Formulierung dem hoch eingestuften hebräischen Ausgangstext; die erheblich abweichende griechische Lesart wird vollständig in der Fußnote dokumentiert.
