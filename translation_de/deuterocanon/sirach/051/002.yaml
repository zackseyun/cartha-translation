translation:
  language: de
  text: Ich danke deinem Namen, denn du bist mir zum Beschützer und Helfer geworden.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξομολογοῦμαι
  choice: Ich danke
  rationale: Das Verb kann je nach Kontext „bekennen“, „preisen“ oder „Dank sagen“ bedeuten; im Gebets- und Lobkontext ist „ich danke“ natürlich und sachgerecht.
- source_word: τῷ ὀνόματί σου
  choice: deinem Namen
  rationale: Bewahrt die direkte griechische Formulierung und ihre biblische Bedeutung, ohne sie erklärend aufzulösen.
- source_word: σκεπαστής
  choice: Beschützer
  rationale: Bezeichnet jemanden, der deckt, schützt oder Zuflucht gewährt. „Beschützer“ gibt die personale Aussage passend wieder.
- source_word: βοηθός
  choice: Helfer
  rationale: Direkte, verständliche Wiedergabe der personalen Bezeichnung für den Beistand.
- source_word: ἐγένου μοι
  choice: bist mir … geworden
  rationale: Erhält sowohl den Aorist von „werden“ als auch den persönlichen Dativ „mir“.
theological_decisions:
- issue: Abweichung zwischen dem zugeordneten hebräischen Text und der Versfassung
  choice: Übersetzung nach dem griechischen Paralleltext, der mit Sirach 51,2 und der geprüften englischen Fassung übereinstimmt
  alternative: Übersetzung des mitgelieferten hebräischen Abschnitts über Rettung aus Grube, Scheol und Verleumdung
  rationale: Der Datensatz kennzeichnet eine erhebliche Zuordnungsabweichung. Der griechische Text bildet genau den angegebenen Einzelvers ab, während der hebräische Abschnitt offenbar umfangreicher ist und zu einer abweichenden Verszählung beziehungsweise den folgenden Versen gehört.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die personale Parallelstruktur „Beschützer und Helfer“ sowie die Wendung „mir … geworden“ bewahren Form und Aussage des griechischen Textes.
