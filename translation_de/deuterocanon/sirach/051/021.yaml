  text: My inward parts burned like an oven as I looked toward her[a]; therefore I will not forsake her.
translation:
  language: de
  text: Mein Inneres glühte wie ein Ofen, als ich auf sie blickte; darum werde ich sie nicht verlassen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Griechisch: »Mein Inneres wurde bei der Suche nach ihr aufgewühlt; darum erwarb ich einen guten Besitz.«'
    reason: alternative_reading
lexical_decisions:
- source_word: מֵעַי
  choice: mein Inneres
  rationale: Das hebräische Wort bezeichnet wörtlich die inneren Organe und bildlich den Sitz tiefer Empfindungen. »Mein Inneres« bewahrt den körperlichen Bezug, ohne im heutigen Deutschen unnötig befremdlich zu wirken.
- source_word: יֵחַמּוּ כַּתַּנּוּר
  choice: glühte wie ein Ofen
  rationale: Das Verb bezeichnet das Heißwerden; zusammen mit dem Ofenvergleich gibt »glühte« die Intensität des hebräischen Bildes natürlich und prägnant wieder.
- source_word: לְהַבִּיט בָּהּ
  choice: als ich auf sie blickte
  rationale: Der Infinitiv mit ב bezeichnet das Blicken auf sie. Die temporale Wiedergabe verbindet den Blick natürlich mit dem Glühen im Inneren, ohne die Beziehung näher auszudeuten.
- source_word: בַּעֲבוּר כֵּן
  choice: darum
  rationale: Die Wendung führt die Folgerung aus dem vorangehenden Erleben ein; »darum« ist knapp, klar und stilistisch passend.
- source_word: לֹא אֶעֶזְבֶנָּה
  choice: werde ich sie nicht verlassen
  rationale: עזב bedeutet verlassen oder aufgeben. »Nicht verlassen« gibt die fortdauernde Bindung an die personifizierte Weisheit direkt wieder.
theological_decisions:
- issue: Deutliche Abweichung zwischen hebräischem und griechischem Schluss
  choice: 'Im Haupttext steht nach dem erhaltenen Hebräisch: »darum werde ich sie nicht verlassen«.'
  alternative: 'Die griechische Überlieferung lautet: »darum erwarb ich einen guten Besitz«.'
  rationale: Der vorhandene, als zuverlässig eingestufte hebräische Text hat für den Haupttext Vorrang. Da die griechische Fassung sowohl das innere Erleben als auch die Folge anders beschreibt, wird ihre Lesart vollständig in einer Fußnote dokumentiert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das Bild innerer Glut und die weibliche Bezugnahme auf die Weisheit bleiben erhalten; die erhebliche griechische Variante wird transparent ausgewiesen.
