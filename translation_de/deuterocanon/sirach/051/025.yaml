  text: 'Ich öffnete meinen Mund und sprach von ihr[a]: Erwerbt euch Weisheit ohne Silber.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das Hebräische verwendet hier ein feminines Suffix, das wahrscheinlich auf die als weibliche Gestalt personifizierte Weisheit verweist; abstrakter könnte man auch übersetzen: „und sprach davon“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פִּי פָתַחְתִּי
  choice: Ich öffnete meinen Mund
  rationale: Die anschauliche hebräische Wendung für den Beginn des Sprechens wird wörtlich und zugleich verständlich wiedergegeben; auch die griechische Parallele entspricht ihr.
- source_word: וְדִבַּרְתִּי בָהּ
  choice: und sprach von ihr
  rationale: Das feminine Suffix verweist am natürlichsten auf die personifizierte Weisheit. „Von ihr“ bewahrt diesen persönlichen Bezug und klingt im Deutschen würdevoll und idiomatisch.
- source_word: קְנוּ לָכֶם
  choice: Erwerbt euch
  rationale: קנה kann „kaufen“ oder allgemeiner „erwerben“ bedeuten. „Erwerben“ hält zusammen mit „ohne Silber“ das wirtschaftliche Bild aufrecht, ohne einen buchstäblichen Kauf zu unterstellen.
- source_word: חָכְמָה
  choice: Weisheit
  rationale: Dies ist die direkte Bedeutung und zugleich der naheliegende Bezug des vorhergehenden femininen Pronomens.
- source_word: בְּלֹא כָסֶף
  choice: ohne Silber
  rationale: Die konkrete Bildsprache des hebräischen כָסֶף und des griechischen ἀργύριον bleibt erhalten, statt sie zum allgemeineren „Geld“ zu verflachen.
theological_decisions:
- issue: Bezugswort des femininen Suffixes in וְדִבַּרְתִּי בָהּ
  choice: 'Das Suffix wird auf die als weibliche Gestalt personifizierte Weisheit bezogen: „von ihr“.'
  alternative: Ein abstrakterer Bezug auf den Lehrgegenstand wäre als „davon“ möglich.
  rationale: Der unmittelbar folgende Aufruf, Weisheit zu erwerben, und ihre verbreitete Personifikation im Sirachbuch sprechen für den persönlichen femininen Bezug. Die Übersetzung bewahrt die grammatische und literarisch-theologische Spannung, ohne spätere Lehrvorstellungen einzutragen.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Stil. Die bildhafte Rede vom Öffnen des Mundes und vom Erwerb ohne Silber bleibt bewusst erhalten.
