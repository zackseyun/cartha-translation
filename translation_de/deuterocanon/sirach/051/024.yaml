translation:
  language: de
  text: Wie lange noch wird es euch an diesen Dingen fehlen[a], und eure Seele wird sehr durstig sein?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das Hebräische lautet wörtlich und ungewöhnlich: „Wie lange wird es euch von diesen und diesen fehlen?“ Die griechische Parallele ist anders gebaut: Sie spricht davon, dass ihr sagt, ihr litttet an Mangel „in diesen Dingen“, und dass eure Seelen sehr dürsten. Sie hat beim Durst den Plural und die Gegenwartsform.'
    reason: Die hebräische Wendung מִן אֵלּוּ וְאֵלּוּ ist in dieser Form schwer verständlich. Die Anmerkung dokumentiert ihre wörtliche Gestalt und die abweichende Satzführung der griechischen Parallele, ohne deren Zeitform oder Plural in den hebräischen Haupttext einzutragen.
lexical_decisions:
- source_word: עַד מָתַי
  choice: Wie lange noch
  rationale: Die idiomatische deutsche Frage bewahrt den vorwurfsvollen beziehungsweise auffordernden Ton; „noch“ bringt die im Kontext vorausgesetzte Dauer natürlich zum Ausdruck.
- source_word: תַחְסְרוּן
  choice: wird es euch … fehlen
  rationale: חסר bezeichnet das Fehlen oder Entbehren. Die Konstruktion mit unpersönlichem „es“ ist im Deutschen natürlich und wahrt die Zukunftsform des hebräischen Imperfekts.
- source_word: מִן אֵלּוּ וְאֵלּוּ
  choice: an all dem
  rationale: Die wörtlich ungewöhnliche Wendung „von diesen und diesen“ verweist zusammenfassend auf die zuvor genannten Dinge. „All dem“ gibt diesen Rückbezug verständlich wieder, ohne seinen Inhalt näher festzulegen.
- source_word: וְנַפְשְׁכֶם
  choice: eure Seele
  rationale: Das singularische נֶפֶשׁ mit pluralischem Possessivsuffix bezeichnet hier das innere, verlangende Selbst der angesprochenen Gruppe. „Seele“ bewahrt die Bildkraft, ohne eine bestimmte Anthropologie festzuschreiben.
- source_word: צְמֵאָה מְאֹד תִּהְיֶה
  choice: großen Durst hat
  rationale: Die deutsche Nominalwendung gibt „sehr durstig sein“ würdig und idiomatisch wieder. Im während-Satz beschreibt das Präsens den mit dem fortdauernden Mangel verbundenen Zustand; die griechische Parallele stützt diese zeitliche Auffassung.
theological_decisions:
- issue: Bedeutung von נֶפֶשׁ in der Weisheitsmahnung
  choice: eure Seele
  alternative: euer Inneres; ihr selbst
  rationale: „Seele“ erhält die existentielle und geistliche Tiefe des Bildes vom Durst, ohne daraus eine technische Lehre über die Bestandteile des Menschen abzuleiten.
- issue: Zeitverhältnis zwischen Mangel und Durst
  choice: während eure Seele großen Durst hat
  alternative: und eure Seele wird sehr durstig sein
  rationale: Das Hebräische verwendet eine Zukunftsform, doch die griechische Parallele hat Präsens und macht den Durst zum gegenwärtigen Begleitumstand des Mangels. „Während“ verdeutlicht diesen rhetorischen Zusammenhang, ohne eine Ursache ausdrücklich zu behaupten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Anrede steht entsprechend dem hebräischen Plural in der vertrauten Form „euch/eure“. Der zusammenfassende Ausdruck „all dem“ bleibt bewusst offen und verweist auf den vorausgehenden Lehrzusammenhang.
