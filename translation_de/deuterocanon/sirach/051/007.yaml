revisions:
- from: Ich wandte mich nach allen Seiten um, doch niemand half mir; ich hielt Ausschau nach einem Beistand, doch da war keiner.[a]
  to: Ich wandte mich nach allen Seiten, und niemand half mir; ich hielt nach Beistand Ausschau, und es gab keinen.[a]
  rationale: Die Revision glättet eine deutsche Redundanz und formuliert die zweite Satzhälfte idiomatischer. „Beistand“ bleibt absichtlich offen genug, um weder den im Hebräischen möglichen personalen Sinn noch die von der griechischen Parallelüberlieferung nahegelegte Bedeutung „Hilfe/Unterstützung“ einseitig festzulegen. Der schlichte koordinierende Satzbau folgt dem hebräischen Text enger als das zweimalige adversative „doch“.
