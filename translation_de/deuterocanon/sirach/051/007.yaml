lexical_decisions:
- source_word: וָאֶפְנֶה סָבִיב
  choice: Ich wandte mich nach allen Seiten um
  rationale: פנה mit סָבִיב bezeichnet ein Sich-Umwenden beziehungsweise Umschauen in alle Richtungen. Die Formulierung bewahrt das körperliche Bild und klingt im modernen Deutschen natürlich.
- source_word: וְאֵין עוֹזֵר לִי
  choice: doch niemand half mir
  rationale: Das substantivierte Partizip עוֹזֵר bezeichnet eine helfende Person. Die verbale Wiedergabe ist idiomatisch und erhält den persönlichen Bezug לִי.
- source_word: וַאֲצַפֶּה
  choice: ich hielt Ausschau nach
  rationale: צפה kann beobachten, erwarten oder ausschauen bedeuten. Der Parallelismus und das griechische ἐμβλέπων stützen hier die aktive Suche nach Hilfe.
- source_word: סוֹמֵךְ
  choice: einem Beistand
  rationale: Das Partizip von סמך bezeichnet hier wahrscheinlich jemanden, der stützt oder beisteht. „Beistand“ wahrt den möglichen Personenbezug besser als das rein abstrakte „Unterstützung“.
- source_word: וְאָיִן
  choice: doch da war keiner
  rationale: Die knappe Existenzverneinung wird emphatisch wiedergegeben; „keiner“ nimmt den wahrscheinlich persönlichen Sinn von סוֹמֵךְ auf.
