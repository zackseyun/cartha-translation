  text: For he had compassion on our backsliding[c][b][a], and removed the abominations of vanity.
translation:
  language: de
  text: Denn er hatte Erbarmen angesichts unseres Abfalls[a] und beseitigte die Gräuel der Nichtigkeit.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Parallele kann sinngemäß auch positiv verstanden werden: „Denn er richtete das Volk bei seiner Umkehr wieder auf“ oder: „bei der Rückkehr des Volkes“. Der hebräische Text hat dagegen „unser Abfall“.'
    reason: alternative_reading
  - marker: b
    text: Mit den „Gräueln der Nichtigkeit“ sind wahrscheinlich abscheuliche Formen des Götzendienstes gemeint; „Nichtigkeit“ wird im Hebräischen polemisch für Götzen gebraucht.
    reason: lexical_alternative
  - marker: c
    text: Die griechische Parallele hat „die Gräuel der Gesetzlosigkeit“ statt des hebräischen „die Gräuel der Nichtigkeit“.
    reason: textual_variant
lexical_decisions:
- source_word: נחל
  choice: hatte Erbarmen
  rationale: Die hebräische Form ist schwierig. Im Zusammenhang der von Josia ausgehenden Erneuerung gibt „hatte Erbarmen“ eine wohlwollende, wiederherstellende Reaktion wieder, ohne eine unsichere Rekonstruktion als eindeutig auszugeben.
- source_word: על משובתינו
  choice: angesichts unseres Abfalls
  rationale: משובה bezeichnet gewöhnlich Abfall oder Abtrünnigkeit; das Suffix ist erste Person Plural. „Angesichts“ bewahrt den Bezug, ohne den Abfall selbst zum Gegenstand des Erbarmens zu machen. Die positivere griechische Lesart wird in der Fußnote genannt.
- source_word: וישבת
  choice: und beseitigte
  rationale: Das Verb bezeichnet hier das Aufhörenlassen oder Wegnehmen verwerflicher Dinge beziehungsweise Praktiken. „Beseitigte“ ist im Deutschen natürlich und passt zum Reformzusammenhang.
- source_word: תועבות
  choice: Gräuel
  rationale: „Gräuel“ bewahrt die starke religiös-moralische Wertung des Hebräischen und kann sowohl verwerfliche Kultgegenstände als auch Praktiken bezeichnen.
- source_word: הבל
  choice: Nichtigkeit
  rationale: הבל bezeichnet wörtlich Hauch, Leere oder Nichtigkeit und dient häufig als polemische Bezeichnung für Götzen. „Nichtigkeit“ erhält das Bild und vermeidet die nicht ausdrücklich im Text stehende Konkretisierung „Götzen“.
theological_decisions:
- issue: Soll משובה mit der positiven griechischen ἐπιστροφή als Umkehr/Rückkehr harmonisiert werden?
  choice: Die negative hebräische Bedeutung „unser Abfall“ bleibt im Haupttext erhalten.
  alternative: „bei der Umkehr des Volkes“ oder „bei der Rückkehr des Volkes“
  rationale: Der erhaltene hebräische Wortlaut hat Vorrang und bezeichnet gewöhnlich Abfall. Die griechische Parallele bezeugt jedoch eine echte abweichende beziehungsweise positiv deutende Überlieferung, die deshalb in einer Fußnote bewahrt wird.
- issue: Soll הבל ausdrücklich als „Götzen“ wiedergegeben werden?
  choice: „Nichtigkeit“
  alternative: „Götzen“ oder „nichtige Dinge“
  rationale: Der Zusammenhang ist wahrscheinlich gegen Götzendienst gerichtet, doch das hebräische Wort bleibt bildhaft und weiter. Die Übersetzung soll diese Offenheit nicht vorschnell auflösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Hatte Erbarmen angesichts“ vermeidet eine unnatürliche Aussage, wonach der Abfall selbst bemitleidet werde, und wahrt zugleich die schwierige Beziehung der hebräischen Wörter. „Gräuel der Nichtigkeit“ ist bewusst leicht fremdartig, aber verständlich und quellennah.
