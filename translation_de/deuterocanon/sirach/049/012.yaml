base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/049/012.yaml
  text: So also Yehoshua son of Jehozadak[a], who in distress raised up an altar; and they raised up a holy temple, established for everlasting glory.
translation:
  language: de
  text: Ebenso Jeschua, Sohn Jozadaks, der in der Bedrängnis einen Altar errichtete[a]; sie errichteten einen heiligen Tempel, der zu ewiger Herrlichkeit fest gegründet war.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Klausel „der in der Bedrängnis einen Altar errichtete“ steht in der hebräischen Edition in Klammern und ist textlich unsicher; die griechische Überlieferung enthält sie nicht.
    reason: textual_variant
lexical_decisions:
- source_word: גם
  choice: Ebenso
  rationale: Leitet Jeschua als weiteres Beispiel in der Reihe der geehrten Vorfahren ein und gibt den knappen hebräischen Anschluss natürlich wieder.
- source_word: יהושע בן יהוצדק
  choice: Jeschua, der Sohn Jozadaks
  rationale: Verwendet geläufige deutsche Transliterationen der hebräischen Namensformen und bewahrt die Abstammungsangabe.
- source_word: אשר במצוק הקימו מזבח
  choice: der in der Bedrängnis einen Altar errichtete
  rationale: Gibt מצוק kontextgerecht als Notlage und הקימו מזבח als Errichtung eines Altars wieder; wegen der unsicheren Überlieferung wird die Klausel mit einer Fußnote gekennzeichnet.
- source_word: וירימו
  choice: sie richteten … auf
  rationale: Bewahrt sowohl den Plural als auch die Grundbedeutung des Erhebens beziehungsweise Aufrichtens und passt zum Tempelbau.
- source_word: היכל קדש
  choice: einen heiligen Tempel
  rationale: היכל bezeichnet hier den Tempel; die artikellose hebräische Form wird mit dem unbestimmten Artikel wiedergegeben.
- source_word: ומכונן
  choice: gegründet
  rationale: Drückt den Zustand festen Gründens aus, ohne die mögliche passive beziehungsweise resultative Nuance zu beseitigen.
- source_word: לכבוד עולם
  choice: zu ewigem Ruhm
  rationale: כבוד kann Ruhm, Ehre oder Herrlichkeit bedeuten. Im Kontext des bleibenden Gedenkens ist „Ruhm“ natürlich und עולם bezeichnet die dauerhafte Geltung.
theological_decisions:
- issue: Textgestalt der unsicher überlieferten Altarklausel
  choice: Die Klausel steht im Haupttext und wird durch eine textkritische Fußnote als unsicher gekennzeichnet.
  alternative: Die Klausel aus dem Haupttext auslassen und nur in der Fußnote anführen.
  rationale: Die gelieferte hebräische Edition bewahrt die Klausel in Klammern, während die griechische Parallele sie nicht enthält. Ihre Aufnahme mit ausdrücklicher Kennzeichnung erhält das vorhandene hebräische Zeugnis, ohne dessen Sicherheit vorzutäuschen.
- issue: Pluralisches Subjekt bei וירימו
  choice: „sie richteten … auf“
  alternative: Jeschua als alleinigen singularischen Tempelbauer darstellen.
  rationale: Der hebräische Text hat ausdrücklich ein Verb im Plural. Die Übersetzung bewahrt diese grammatische Spannung, auch wenn die weiteren Beteiligten im erhaltenen hebräischen Wortlaut nicht benannt werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Aufrichten“ und „gegründet“ bewahren das Bild des Tempelbaus; „Ruhm“ hält den Zusammenhang mit dem ehrenden Gedenken aufrecht. Der im Hebräischen unvermittelt auftretende Plural bleibt erhalten.
