translation:
  language: de
  text: auszureißen, niederzureißen, zu vernichten und einzureißen[b]; ebenso zu bauen, zu pflanzen und hoch zu erheben[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Hebräische enthält gegenüber der griechischen Parallelüberlieferung am Ende ein weiteres positives Verb, das »hoch erheben«, »in die Höhe setzen« oder auch »sicher machen« bedeuten kann. Die griechische Parallelüberlieferung ist hier kürzer und endet mit »bauen und pflanzen«.
    reason: textual_variant
  - marker: b
    text: Diese Zeile nimmt die Sprache von Jeremias prophetischem Auftrag in Jeremia 1,10 auf; der hebräische Wortlaut des Sirachbuches stimmt jedoch nicht vollständig mit dem dortigen Wortlaut überein.
    reason: cross_reference
lexical_decisions:
- source_word: לנתוש
  choice: auszureißen
  rationale: Das Verb נתש bezeichnet ein Herausreißen bis zur Wurzel. »Ausreißen« ist im Deutschen klar und bewahrt zugleich den Anklang an Jeremias prophetischen Auftrag.
- source_word: לנתוץ
  choice: niederzureißen
  rationale: נתץ bezeichnet häufig das Niederreißen von Bauwerken. Die konkrete, gewaltsame Bildsprache bleibt so erhalten.
- source_word: ולהאביד
  choice: zu vernichten
  rationale: Die Kausativform von אבד bezeichnet das Herbeiführen von Untergang oder Zerstörung. »Vernichten« gibt dies in der Reihe der Gerichtsverben knapp wieder.
- source_word: להרוס
  choice: einzureißen
  rationale: הרס überschneidet sich semantisch mit נתץ und bezeichnet Zerstörung beziehungsweise Abbruch. »Einreißen« erhält diese Überschneidung, ohne die beiden Verben im Deutschen völlig gleich wiederzugeben.
- source_word: וכן
  choice: ebenso
  rationale: וכן leitet die ausgleichende positive Hälfte der Aussage ein. »Ebenso« macht den Parallelismus deutlich.
- source_word: לבנות
  choice: aufzubauen
  rationale: בנה bedeutet grundsätzlich »bauen«. Im Gegenüber zu den vorangehenden Zerstörungsverben klingt im Deutschen »aufbauen« natürlich, ohne ausdrücklich ein Wiederaufbauen vorauszusetzen.
- source_word: לנטע
  choice: zu pflanzen
  rationale: Dies ist die übliche und konkrete Wiedergabe von נטע und erhält die prophetische Verbindung von Bauen und Pflanzen.
- source_word: ולהשגיב
  choice: hoch zu erheben
  rationale: Die Form von שגב kann ein Erhöhen, Hochstellen oder Sichern ausdrücken. »hoch zu erheben« bewahrt den Grundgedanken der Erhöhung, ohne die Bedeutung ausschließlich auf Schutz oder Sicherheit festzulegen.
theological_decisions:
- issue: Anklang an Jeremias prophetischen Auftrag
  choice: Die Folge der Infinitive wird so wiedergegeben, dass der Anklang an Jeremia 1,10 erkennbar bleibt, während der überlieferte hebräische Wortlaut des Sirachbuches maßgeblich bleibt.
  alternative: Die Formulierung vollständig an den geläufigen deutschen Wortlaut von Jeremia 1,10 angleichen.
  rationale: Der hebräische Text greift deutlich die Sprache von Jeremias Berufung auf, stimmt aber nicht in jedem Verb mit ihr überein. Die Übersetzung wahrt sowohl die intertextuelle Beziehung als auch die Eigenform des Sirachtextes.
- issue: Hebräisches Schlussverb ולהשגיב gegenüber der kürzeren griechischen Fassung
  choice: Das hebräische Schlussverb wird im Haupttext mit »hoch zu erheben« aufgenommen; die kürzere griechische Fassung und die Bedeutungsbreite werden in einer Fußnote genannt.
  alternative: Mit der griechischen Fassung nach »zu pflanzen« enden oder spezifischer »zu sichern« beziehungsweise »zu erhöhen« übersetzen.
  rationale: Da ein belastbarer hebräischer Text vorliegt, hat dieser Vorrang. Zugleich rechtfertigen das Fehlen des Verbs im Griechischen und seine Bedeutungsbreite einen textkritischen Hinweis.
translation_notes:
  register: Moderne, würdige Standardsprache. Die rhythmische Infinitivreihe und der Gegensatz zwischen Zerstören und Aufbauen bleiben erhalten. Die teilweise bedeutungsähnlichen Zerstörungsverben werden nicht eingeebnet; Kommas gliedern die lange Reihe für heutige Leser.
