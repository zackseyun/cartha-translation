base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/049/004.yaml
  text: Except for David[a], Hezekiah, and Josiah, all of them acted corruptly; the kings of Judah abandoned the law of the Most High[b], until they came to an end.
translation:
  language: de
  text: Außer David, Hiskija und Joschija handelten sie alle verderblich[a]; die Könige von Juda verließen das Gesetz des Höchsten, bis es mit ihnen zu Ende war.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, näher am Griechischen: „begingen sie alle eine Verfehlung“. Das Hebräische verwendet ein Verb, das „verderben“ oder „zugrunde richten“ bedeuten kann.'
    reason: lexical_alternative
  - marker: b
    text: 'Die hebräische Schlusswendung ist knapp: wörtlich etwa „bis zu ihrem Ende“. Das Griechische lautet: „Die Könige von Juda kamen an ihr Ende“ oder „verschwanden“.'
    reason: alternative_reading
lexical_decisions:
- source_word: לבד / παρὲξ
  choice: Außer
  rationale: Beide Ausdrücke kennzeichnen eine Ausnahme. „Außer“ führt die drei Könige knapp und idiomatisch als Ausnahmen vom allgemeinen Urteil ein.
- source_word: השחיטו / πλημμελίαν ἐπλημμέλησαν
  choice: handelten … verderbt
  rationale: Das hebräische Verb aus der Wurzel שחת bezeichnet im Hifil verderbliches, zugrunde richtendes oder korrumpierendes Handeln; das Griechische spricht allgemeiner vom Begehen einer Verfehlung. Die Formulierung bewahrt die moralische Schärfe, ohne eine bestimmte Sünde festzulegen.
- source_word: ויעזבו / κατέλιπον
  choice: verließen
  rationale: „Verließen“ gibt beide Textzeugen direkt wieder und bezeichnet hier die schuldhafte Abkehr vom Gesetz, ohne die Aussage durch einen zusätzlichen theologischen Fachbegriff zu verstärken.
- source_word: תורת עליון / τὸν νόμον τοῦ ὑψίστου
  choice: das Gesetz des Höchsten
  rationale: תורה kann auch „Weisung“ bedeuten; im königlichen und bundestheologischen Zusammenhang sowie angesichts des griechischen νόμος ist „Gesetz“ im Haupttext angemessen. „Der Höchste“ wahrt den Gottes­titel.
- source_word: מלכי יהודה
  choice: die Könige von Juda
  rationale: Die direkte Wiedergabe erhält den historischen Bezug und entspricht auch dem griechischen Paralleltext.
- source_word: עד תמם / ἐξέλιπον
  choice: bis es mit ihnen zu Ende war
  rationale: Das Hebräische ist äußerst knapp und kann auf Vollendung, Ende oder Aufhören zielen; das griechische ἐξέλιπον bezeichnet ihr Aufhören beziehungsweise ihren Untergang. Die deutsche Wendung wahrt den Endpunkt, ohne ihn ausschließlich als Tod oder dynastische Auslöschung auszulegen.
theological_decisions:
- issue: Bezug und Sinn der Schlusswendung עד תמם im Verhältnis zum griechischen ἐξέλιπον
  choice: 'Die Wendung wird als Ergebnis beziehungsweise Endpunkt des Handelns der Könige wiedergegeben: „bis es mit ihnen zu Ende war“.'
  alternative: Möglich sind auch eine selbstständige Aussage „die Könige von Juda verschwanden/gingen unter“ oder die stärker am knappen Hebräisch orientierte Fassung „bis zu ihrem Ende“.
  rationale: Der hebräische Wortlaut ist knapp und syntaktisch nicht völlig eindeutig, während das Griechische eine finite Aussage über das Ende der Könige bietet. Die gewählte Fassung verbindet beide Zeugnisse, ohne die genaue Art dieses Endes dogmatisch oder historisch festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Königsnamen folgen den im Deutschen gebräuchlichen biblischen Formen. Der Haupttext bleibt knapp und erhält die syntaktische sowie semantische Spannung der hebräischen Schlusswendung; die Fußnoten dokumentieren die griechische Parallelüberlieferung.
