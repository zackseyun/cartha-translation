base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/049/001.yaml
  text: The name of Josiah is like blended incense[a], the work of a perfumer; his memory is sweet as honey to the mouth[b], and like music at a banquet of wine.
translation:
  language: de
  text: Der Name Josia ist wie Räucherwerk aus Gewürzen, kunstvoll zubereitet von einem Salbenmischer[a]; die Erinnerung an ihn ist dem Gaumen süß wie Honig[b] und wie Musik bei einem Weinmahl.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Griechisch: „Das Gedenken an Josia gleicht einer Räucherwerkmischung, zubereitet durch das Handwerk eines Salbenmischers; in jedem Mund wird es süß sein wie Honig und wie Musik bei einem Weinmahl.“ Der hebräische Text stellt zunächst den „Namen“ heraus, der griechische das „Gedenken“.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „wie ein Lied bei einem Weinmahl“. Das hebräische מזמור kann ein Lied bezeichnen; der griechische Paralleltext hat den weiteren Ausdruck „Musik“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שם
  choice: Der Name
  rationale: Das hebräische שם bedeutet zunächst „Name“. Der Gedanke des Gedenkens wird im zweiten Satzteil durch זכרו ausdrücklich aufgenommen.
- source_word: כקטורת סמים
  choice: wie eine Mischung aus Räucherwerk
  rationale: קטורת bezeichnet Räucherwerk, סמים aromatische Stoffe beziehungsweise eine Gewürzmischung. Die Formulierung bewahrt den Gedanken eines kunstvoll zusammengesetzten Räucherwerks.
- source_word: וממלה מעשה רוקח
  choice: das Werk eines Salbenmischers
  rationale: Die hebräische Form וממלה ist schwierig; zusammen mit מעשה רוקח und dem griechischen ἐσκευασμένον weist sie auf kunstvolle Zubereitung hin. „Salbenmischer“ bezeichnet hier einen Fachmann, der Duftstoffe, Salben und Räucherwerk mischt.
- source_word: בחך כדבש ימתיק זכרו
  choice: die Erinnerung an ihn ist dem Gaumen süß wie Honig
  rationale: חך ist wörtlich der „Gaumen“, זכרו die Erinnerung an ihn. Das Imperfekt ימתיק wird hier als allgemeine, beschreibende Aussage verstanden; „ist … süß“ klingt im Deutschen natürlich und erhält das Geschmacksbild.
- source_word: וכמזמור
  choice: wie Musik
  rationale: מזמור kann ein Lied oder ein musikalisch begleitetes Stück bezeichnen. Das griechische μουσικά stützt den weiteren Sinn „Musik“, der gut zum Festmahl passt.
- source_word: על משתה היין
  choice: bei einem Weingelage
  rationale: משתה היין bezeichnet ein Fest- oder Trinkmahl mit Wein. „Weingelage“ ist knapp, anschaulich und im heutigen Standarddeutsch verständlich.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Bildfolge von Duft, Geschmack und Musik bleibt erhalten. „Salbenmischer“ ist präziser als das heute enger verstandene „Parfümeur“, da der Beruf im antiken Zusammenhang auch Räucherwerk und andere Duftmischungen umfasste.
