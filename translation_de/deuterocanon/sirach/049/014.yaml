translation:
  language: de
  text: Nur wenige[b] wurden auf der Erde erschaffen wie Henoch, und auch er wurde von der Erde hinweggenommen.[a][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: »Nur wenige wurden auf der Erde erschaffen wie Henoch, und auch er wurde weggenommen …« Das letzte hebräische Wort ist hier schwierig; die griechische Parallelüberlieferung lautet »von der Erde«. Dieser Lesart folgt der Haupttext.'
    reason: textual_variant
  - marker: b
    text: 'Im Griechischen steht die stärkere Formulierung: »Nicht einmal einer wurde auf der Erde wie Henoch erschaffen.« Der hebräische Text hat dagegen »nur wenige« und enthält keine absolute Verneinung.'
    reason: alternative_reading
  - marker: c
    text: 'Oder: »wurde hinaufgenommen« beziehungsweise »wurde entrückt«. Die Wendung erinnert an die Überlieferung von Henochs Wegnahme durch Gott (vgl. 1. Mose 5,24).'
    reason: lexical_alternative
lexical_decisions:
- source_word: מעט
  choice: Nur wenige
  rationale: Das hebräische Mengenwort bedeutet »wenige« oder »wenig«. Der hebräische Zeuge bleibt gegenüber der absoluten griechischen Formulierung »nicht ein Einziger« vorrangig.
- source_word: נוצרו
  choice: wurden … erschaffen
  rationale: Die passive Pluralform bezeichnet hier das Erschaffen beziehungsweise Formen und entspricht sachlich dem griechischen ἐκτίσθη. Die passive Form lässt Gott als Handelnden unausgesprochen.
- source_word: כחנוך
  choice: wie Henoch
  rationale: Die Präposition כ־ kennzeichnet einen Vergleich; »wie Henoch« ist im modernen Deutschen klar und natürlich.
- source_word: וגם הוא
  choice: und auch er
  rationale: Die additive Hervorhebung des Hebräischen bleibt erhalten, ohne den Zusammenhang stärker auszudeuten.
- source_word: נלקח
  choice: wurde … hinweggenommen
  rationale: לקח spielt hier auf Henochs außergewöhnliche Wegnahme an. »Hinweggenommen« bewahrt die zurückhaltende biblische Ausdrucksweise und legt keine ausführlichere Lehre über den Vorgang fest.
- source_word: פנים
  choice: von der Erde
  rationale: Das überlieferte hebräische Schlusswort פנים ist in diesem Zusammenhang schwierig. Die griechische Parallelüberlieferung bietet ἀπὸ τῆς γῆς, »von der Erde«, und erschließt damit wahrscheinlich den beabsichtigten Sinn; die Unsicherheit wird in einer Fußnote offengelegt.
theological_decisions:
- issue: Wie ausdrücklich Henochs Wegnahme beschrieben werden soll
  choice: wurde von der Erde hinweggenommen
  alternative: wurde hinaufgenommen / wurde entrückt
  rationale: Die Formulierung erinnert an Henochs Wegnahme durch Gott, bleibt aber beim knappen Aussagegehalt des Verses. Sie übernimmt die räumliche Ergänzung aus der griechischen Parallelüberlieferung, ohne den Vorgang darüber hinaus dogmatisch festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung bleibt nahe am hebräischen Aufbau, ist aber flüssig lesbar. »Hinweggenommen« wahrt den biblischen Anklang, während die Fußnoten sowohl die schwierige hebräische Schlusslesart als auch die abweichende griechische Mengenangabe transparent machen.
