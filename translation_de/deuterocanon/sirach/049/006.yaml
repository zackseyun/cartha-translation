base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/049/006.yaml
  text: They set the holy city on fire[a], and made its streets desolate, by the hand of Yirmeyahu; for they afflicted him[c][b], though he had been formed in the womb as a prophet.
translation:
  language: de
  text: Sie steckten die heilige Stadt in Brand und verwüsteten ihre Straßen[a] – durch die Hand Jirmejahus[b]. Denn sie hatten ihn bedrängt, obwohl er schon im Mutterleib zum Propheten geformt worden war.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „ihre Wege/Pfade“; im Zusammenhang einer Stadt sind ihre Straßen gemeint.'
    reason: lexical_alternative
  - marker: b
    text: Die hebräische Wendung „durch die Hand Jirmejahus“ ist stark verdichtet. Gemeint sein kann „durch Jirmejahu“ oder ein Zusammenhang mit seinem prophetischen Wirken und seinen Warnungen; auch der griechische Paralleltext bewahrt die Hand-Wendung.
    reason: alternative_reading
  - marker: c
    text: Die Formulierung erinnert an Jirmejahus Berufung schon vor seiner Geburt; vgl. Jirmejahu 1,5.
    reason: cross_reference
lexical_decisions:
- source_word: ויציתו
  choice: sie steckten … in Brand
  rationale: Das Verb bezeichnet das Entzünden bzw. Inbrandsetzen. Bei einer Stadt ist diese Wendung im modernen Deutschen natürlich und bewahrt die konkrete Zerstörungshandlung.
- source_word: קרית קדש
  choice: die heilige Stadt
  rationale: Die hebräische Genitivverbindung lässt sich direkt und idiomatisch so wiedergeben. Der leicht abweichende griechische Paralleltext ist gegenüber dem gut bezeugten Hebräisch nachrangig.
- source_word: וישמו
  choice: verwüsteten
  rationale: Das Verb bezeichnet das Veröden oder Verwüsten. Zusammen mit den Straßen einer Stadt gibt „verwüsteten“ das Ergebnis knapp und verständlich wieder.
- source_word: ארחתיה
  choice: ihre Straßen
  rationale: Das Substantiv kann Wege oder Pfade bezeichnen; im städtischen Zusammenhang sind die Verkehrswege, also die Straßen, gemeint. Der griechische Paralleltext mit ὁδοὺς stützt dies.
- source_word: ביד ירמיהו
  choice: durch die Hand Jirmejahus
  rationale: Die ungewöhnlich verdichtete hebräische Wendung wird bewusst weitgehend formal bewahrt. Sie kann instrumentale Vermittlung oder einen Zusammenhang mit Jirmejahus prophetischem Wirken und Wort anzeigen, ohne dass die genaue syntaktische Beziehung sicher festgelegt werden kann.
- source_word: כי ענוהו
  choice: denn sie hatten ihn bedrängt
  rationale: ענה bezeichnet hier feindselige Bedrückung oder Misshandlung. „Bedrängt“ bleibt hinreichend offen und fügt sich natürlich in den Zusammenhang.
- source_word: מרחם נוצר נביא
  choice: obwohl er schon im Mutterleib zum Propheten geformt worden war
  rationale: Die Formulierung bewahrt das Bild des Formens im Mutterleib und den Bezug auf Jirmejahus prophetische Bestimmung. „Obwohl“ macht den im Kontext naheliegenden Gegensatz verständlich, ohne die Art seiner Erwählung weiter zu bestimmen.
- source_word: ירמיהו
  choice: Jirmejahu
  rationale: Der hebräische Personenname wird in einer für deutschsprachige Leser gut lesbaren Form transliteriert.
theological_decisions:
- issue: Beziehung der schwierigen Wendung ביד ירמיהו zur Zerstörung der Stadt und zur Bedrängnis des Propheten
  choice: Die hebräische Wendung bleibt als „durch die Hand Jirmejahus“ im Haupttext stehen; eine Fußnote erläutert mögliche Sinnrichtungen.
  alternative: „wie Jirmejahu vorausgesagt hatte“, „wegen Jirmejahu“ oder „durch Jirmejahu“ ohne Beibehaltung des Bildes
  rationale: Sowohl der hebräische Text als auch der griechische Paralleltext bewahren die ungewöhnliche Hand-Wendung. Eine eindeutige Auflösung als Weissagung, Ursache oder unmittelbare Vermittlung würde die echte syntaktische Spannung vorschnell beseitigen.
- issue: Sinn von מרחם נוצר נביא
  choice: Jirmejahu war schon im Mutterleib zum Propheten geformt.
  alternative: Er war vom Mutterleib an zum Propheten berufen oder vorherbestimmt.
  rationale: „Geformt“ folgt dem konkreten hebräischen Ausdruck und wahrt den Anklang an Jirmejahu 1,5, ohne die Aussage durch stärker systematische Begriffe wie „vorherbestimmt“ festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau ist zugänglich, bewahrt aber mit „durch die Hand Jirmejahus“ die auffällige und sachlich mehrdeutige Ausdrucksweise der Vorlage. Das Präteritum beschreibt die Zerstörung; das Plusquamperfekt ordnet die vorausgehende Bedrängnis und prophetische Formung zeitlich ein.
