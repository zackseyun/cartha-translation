  terminology: „Nehemia“, „Andenken“, „Ruinen“, „Zerstörung“, „Türen und Riegel“ sind angemessen. Im griechischen Paralleltext sind „Wohnstätten/Grundstücke“ für οἰκόπεδα weiter und genauer als „Bauplätze“.
