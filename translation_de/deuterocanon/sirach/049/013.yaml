  text: Nehemiah—may his memory be honored—who raised up our ruins[a], and healed our destruction[b], and set up doors and bars.
translation:
  language: de
  text: Nehemia – sein Andenken sei geehrt! –, der unsere Ruinen wiederherstellte[a], unsere Zerstörung heilte und Türen und Riegel einsetzte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Paralleltext lautet konkreter: „der für uns eingestürzte Mauern aufrichtete, Tore und Riegel aufstellte und unsere Wohnstätten wiedererrichtete“. Der hebräische Text spricht allgemeiner von „unseren Ruinen“ und „unserer Zerstörung“ und verwendet dabei das Bild des Heilens.'
    reason: alternative_reading
lexical_decisions:
- source_word: יאדר זכרו
  choice: sein Andenken sei geehrt
  rationale: Die Wendung ist als ehrender Segenswunsch über Nehemias Andenken zu verstehen. Der deutsche Optativ mit „sei“ gibt diesen Sinn natürlich und würdig wieder, ohne ihn durch „verherrlicht“ zu überhöhen.
- source_word: המקים
  choice: der … wieder aufrichtete
  rationale: Die Kausativform von קום bezeichnet das Aufrichten dessen, was darniederlag. „Wieder aufrichtete“ bewahrt das hebräische Bild; „wiederaufbaute“ wäre konkreter, aber auch enger.
- source_word: חרבתינו
  choice: unsere Trümmer
  rationale: Das hebräische Wort bezeichnet allgemein verwüstete oder in Trümmern liegende Orte. „Trümmer“ wahrt diese Breite, während der griechische Paralleltext die Stelle konkreter auf eingestürzte Mauern bezieht.
- source_word: וירפא
  choice: heilte
  rationale: Das Verb bedeutet wörtlich „heilen“ und überträgt dieses Bild auf die Beseitigung der Verwüstung. Die Metapher bleibt im Deutschen verständlich und sollte nicht zu „reparierte“ verflacht werden.
- source_word: הריסתינו
  choice: unsere Zerstörung
  rationale: Der Ausdruck bezeichnet den Zustand oder das Ergebnis des Niederreißens. „Zerstörung“ ist im Deutschen natürlicher und würdiger als „Wrack“ oder „Trümmerwerk“ und unterscheidet sich vom vorherigen „Trümmer“.
- source_word: ויצב
  choice: einsetzte
  rationale: Das Verb bezeichnet das feste Aufstellen beziehungsweise Anbringen. Bei Türen und Riegeln ist „einsetzte“ im modernen Deutschen idiomatischer als „stellte auf“.
- source_word: דלתים ובריח
  choice: Türen und Riegel
  rationale: Dies entspricht dem hebräischen Wortlaut. Im Zusammenhang sind die Türflügel von Stadttoren und deren Sicherungsriegel gemeint; der griechische Paralleltext bestätigt diesen baulichen Kontext.
