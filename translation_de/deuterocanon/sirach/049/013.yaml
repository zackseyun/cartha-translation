  - severity: low
    issue: Die Fußnote übersetzt griechisch οἰκόπεδα zu eng als „Bauplätze“.
    rationale: Der Ausdruck kann Grundstücke, Hausstellen oder Wohnstätten bezeichnen. „Unsere Wohnstätten wiedererrichtete“ ist im gegebenen Baukontext passend und vermeidet eine sachlich unnötige Verengung.
