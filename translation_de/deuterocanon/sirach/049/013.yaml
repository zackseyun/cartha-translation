translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Segenswunsch wird durch Gedankenstriche abgesetzt; das ungewöhnliche, aber im Hebräischen bewusste Bild vom Heilen einer Zerstörung bleibt erhalten. Der Fußnotenmarker [a] steht unmittelbar bei der Lesart, auf die sich die textkritische Erläuterung bezieht.
