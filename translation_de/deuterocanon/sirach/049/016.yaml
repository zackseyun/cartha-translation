translation:
  language: de
  text: Sem, Set und Enosch wurden geehrt; ihre Herrlichkeit überragt alles Lebende.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Text weicht ab: „Sem und Set wurden unter den Menschen geehrt, und über jedem Lebewesen in der Schöpfung wurde Adam geehrt.“ Er lässt Enosch aus und hat Adam anstelle der hebräischen Aussage über die Herrlichkeit der drei Genannten.'
    reason: Die griechische Überlieferung bietet eine wesentliche abweichende Lesart und erklärt, weshalb andere Übersetzungen nur Sem und Set nennen und Adam erwähnen.
lexical_decisions:
- source_word: נפקדו
  choice: wurden rühmend erwähnt
  rationale: Das Verb bedeutet grundsätzlich „wurde ihrer gedacht / sie wurden erwähnt“. Im Zusammenhang der geehrten Vorfahren ist eine ehrende, rühmende Erwähnung gemeint, ohne das Verb schlicht mit „wurden geehrt“ gleichzusetzen.
- source_word: אנוש
  choice: Enosch
  rationale: Der hebräische Haupttext nennt Enosch ausdrücklich; deshalb wird der Name trotz seines Fehlens im griechischen Paralleltext beibehalten.
- source_word: תפארת עמם
  choice: bei ihnen ist Herrlichkeit
  rationale: Dies bildet das hebräische עמם („bei/mit ihnen“) ab und vermeidet eine unbelegte Änderung zu אדם („Adam“), wie sie der griechische Paralleltext voraussetzt.
- source_word: ועל כל חי
  choice: über alles Lebende hinaus
  rationale: Gibt den Vergleich beziehungsweise Vorrang gegenüber „allem Lebenden“ in verständlichem Deutsch wieder.
theological_decisions:
- issue: Hebräischer Text gegenüber der abweichenden griechischen Überlieferung
  choice: Die drei Namen Sem, Set und Enosch sowie „bei ihnen“ werden nach dem vorgelegten hebräischen Text übersetzt.
  alternative: Nach dem Griechischen nur Sem und Set nennen und den zweiten Satz auf Adams Herrlichkeit beziehen.
  rationale: Die hebräische Quelle ist hier als primärer, hoch sicherer Ausgangstext angegeben. Die deutliche griechische Abweichung wird transparent in einer Fußnote dokumentiert, nicht stillschweigend in den Haupttext übernommen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die etwas ungewöhnliche Formulierung „bei ihnen ist Herrlichkeit“ bewahrt die Mehrdeutigkeit und Spannung des überlieferten hebräischen Wortlauts, statt ihn nach dem griechischen Paralleltext zu glätten.
