  naturalness: „wurden rühmend erwähnt“ klingt im modernen Standarddeutsch künstlich. Eine knappe Prädikation wie „Ihre Herrlichkeit überragt alles Lebende“ ist natürlich, wahrt den poetisch-weisheitlichen Registerton und macht die elliptische hebräische Aussage verständlich.
  terminology: 'Sem, Set und Enosch sind passende deutsche Namensformen. Die Fußnote soll die griechische Abweichung präziser darstellen: Sie lässt Enosch aus und hat Adam, dessen Ehrung über die ganze Schöpfung gestellt wird, statt der hebräischen Aussage über die Herrlichkeit der drei Genannten.'
