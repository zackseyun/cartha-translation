  text: And as for the twelve prophets[a], may their bones flourish from where they lie[c][b]; for they healed Jacob and delivered them by faithful hope.
translation:
  language: de
  text: Auch die zwölf Propheten – mögen ihre Gebeine dort, wo sie ruhen, aufblühen![a] Sie heilten Jakob[b] und hoben ihn in treuer Hoffnung empor.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das Hebräische ist hier schwierig und lautet wörtlich ungefähr: »Mögen ihre Gebeine unter ihnen aufblühen.« Das Griechische hat: »Mögen ihre Gebeine von ihrer Stätte her aufblühen.«'
    reason: textual_variant
  - marker: b
    text: 'Griechisch: »Sie trösteten Jakob«; Hebräisch: »Sie heilten Jakob.«'
    reason: alternative_reading
  - marker: c
    text: 'Hebräisch: »und hoben ihn in treuer Hoffnung empor.« Das Griechische weicht deutlich ab: »und erlösten sie im Glauben der Hoffnung.«'
    reason: textual_variant
lexical_decisions:
- source_word: שנים עשר הנביאים / τῶν ιβʹ προφητῶν
  choice: die zwölf Propheten
  rationale: Beide Textzeugen sprechen wörtlich von den »zwölf Propheten«. Die spätere Bezeichnung »kleine Propheten« wird nicht in den Text eingetragen.
- source_word: עצמתם / τὰ ὀστᾶ
  choice: ihre Gebeine
  rationale: Hebräisch und Griechisch bezeichnen konkret die Knochen. »Gebeine« wahrt den Grabkontext und den würdevollen Ton.
- source_word: פרחת / ἀναθάλοι
  choice: neu aufblühen
  rationale: Das Bild des Sprossens oder Aufblühens wird bewahrt. »Neu« bringt die im griechischen Verb deutlicher anklingende Vorstellung erneuten Aufblühens natürlich zum Ausdruck, ohne das Bild auf eine bestimmte Lehre festzulegen.
- source_word: מתחתם / ἐκ τοῦ τόπου αὐτῶν
  choice: dort, wo sie ruhen
  rationale: Das Hebräische lautet schwierig und annähernd »von unter ihnen«, das Griechische »von ihrer Stätte«. Die Fassung gibt den wahrscheinlichen Sinn im Grabkontext wieder; die Abweichung wird in einer Fußnote offengelegt.
- source_word: החלימו / παρεκάλεσεν
  choice: heilten
  rationale: Das erhaltene Hebräisch bedeutet am ehesten »heilten« oder »machten wieder heil«. Die griechische Lesart »trösteten/ermutigten« wird als wichtige Variante vermerkt.
- source_word: יעקב
  choice: Jakob
  rationale: Der Eigenname wird beibehalten, obwohl er hier das Volk Israel kollektiv bezeichnet.
- source_word: וישגבהו
  choice: und hoben ihn … empor
  rationale: Die hebräische Form bezeichnet ein Erhöhen, Emporheben oder Sichern und hat ein singularisches Objekt, das auf Jakob zurückweist. Die bildhafte Bedeutung wird gewahrt.
- source_word: באמונת תקוה / ἐν πίστει ἐλπίδος
  choice: in treuer Hoffnung
  rationale: Die knappe Verbindung von Treue beziehungsweise Glauben und Hoffnung bleibt erhalten, ohne sie erklärend in zwei selbstständige Tugenden aufzulösen.
theological_decisions:
- issue: Vorrang des hebräischen Textes bei deutlicher Abweichung vom griechischen Zeugen
  choice: 'Der Haupttext folgt im Schlussglied dem erhaltenen Hebräisch: »hoben ihn … empor«.'
  alternative: 'Das Griechische lautet: »und erlösten sie im Glauben der Hoffnung« beziehungsweise »in hoffnungsvollem Glauben«.'
  rationale: Da ein hebräischer Textzeuge vorliegt, bestimmt er den Haupttext. Die erheblich abweichende griechische Überlieferung wird nicht harmonisiert, sondern in der Fußnote sichtbar erhalten.
- issue: Bild vom Aufblühen der Gebeine
  choice: Das konkrete Bild bleibt stehen, ohne dogmatische Ausdeutung.
  alternative: Eine Deutung als bloßer Nachruhm oder als ausdrückliche Aussage über die Auferstehung.
  rationale: Der Quelltext lässt die Reichweite des poetischen Bildes offen; die Übersetzung soll diese theologische Spannung nicht einseitig auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Gebeine« trägt dem Grabkontext Rechnung; die übrige Syntax bleibt klar und allgemein verständlich. Die poetischen Bilder und die Unterschiede zwischen hebräischer und griechischer Überlieferung werden nicht konfessionell gedeutet.
