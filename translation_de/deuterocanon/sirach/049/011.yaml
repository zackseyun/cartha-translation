  text: How shall we praise Zerubbabel? He was like a signet ring on the right hand[a][b].
translation:
  language: de
  text: Wie sollen wir Serubbabel preisen?[a] Er war wie ein Siegelring an der rechten Hand.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wie sollen wir Serubbabel rühmen?“ Die griechische Parallele hat „groß machen/erheben“; das Hebräische kann hier „preisen“ oder „rühmen“ bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „wie ein Siegel“. Das Bild weist wohl auf Ehre und besonderen Wert hin; vergleiche das Bild vom Siegelring in Haggai 2,23.'
    reason: cross_reference
lexical_decisions:
- source_word: מה נהללה
  choice: Wie sollen wir … preisen?
  rationale: Die hebräische Frage mit volitivischer Verbform drückt bewunderndes, rhetorisches Staunen aus. „Preisen“ gibt נהללה natürlich und würdig wieder; die griechische Parallele μεγαλύνωμεν stützt auch die Bedeutung „groß machen/rühmen“.
- source_word: זרבבל
  choice: Serubbabel
  rationale: Verwendet die im Deutschen etablierte biblische Namensform.
- source_word: כחותם
  choice: wie ein Siegelring
  rationale: חותם bezeichnet ein Siegel beziehungsweise einen Siegelring. Da sich das Bild ausdrücklich auf die rechte Hand bezieht, vermittelt „Siegelring“ den konkreten Gegenstand klarer als das allgemeinere „Siegel“.
- source_word: על יד ימין
  choice: an der rechten Hand
  rationale: Die Wendung bezeichnet die rechte Hand; „an der rechten Hand“ ist im Deutschen die natürliche Formulierung für einen dort getragenen Ring und bewahrt das durch die griechische Parallele bestätigte Bild.
theological_decisions:
- issue: Serubbabel als Siegel beziehungsweise Siegelring an der rechten Hand
  choice: Das Bild wird im Haupttext unmittelbar als „Siegelring an der rechten Hand“ wiedergegeben.
  alternative: Das Bild als Aussage über Ehre, Erwählung oder besonderen Wert auszudeuten.
  rationale: Der Wortlaut nennt nur den Vergleich. Seine möglichen Bedeutungsfelder und der Bezug zu Haggai 2,23 werden nicht in den Haupttext eingetragen, damit die Bildsprache und ihre theologische Offenheit erhalten bleiben.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die rhetorische Frage und das konkrete Handbild bleiben erhalten; die Verknüpfung mit „und er“ wird für natürliches Deutsch in zwei Sätze gegliedert.
