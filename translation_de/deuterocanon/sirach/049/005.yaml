translation:
  language: de
  text: Und sie gaben ihr Horn[b] anderen preis[a] und ihre Herrlichkeit einem törichten fremden Volk.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Hebräische hat hier eine ungewöhnliche Form, die wörtlich etwa „nach hinten“ bedeutet; die griechische Überlieferung liest sinngemäß „anderen“.
    reason: textual_variant
  - marker: b
    text: „Horn“ ist hier ein Bild für Stärke oder Macht.
    reason: lexical_alternative
lexical_decisions:
- source_word: קרנם
  choice: ihr Horn
  rationale: קֶרֶן bezeichnet wörtlich ein Horn und steht hier bildlich für Stärke oder Macht. Die Wiedergabe bewahrt das auch im griechischen κέρας bestätigte biblische Bild.
- source_word: לאחור
  choice: anderen preis
  rationale: Das hebräische לאחור ist in diesem Zeugen auffällig und könnte wörtlich etwa „nach hinten“ bedeuten. Das griechische ἑτέροις („anderen“) weist jedoch auf die wohl beabsichtigte Bedeutung; „anderen preisgeben“ ergibt im Deutschen einen natürlichen und kontextgerechten Sinn.
- source_word: כבודם
  choice: ihre Herrlichkeit
  rationale: כָּבוֹד kann Herrlichkeit, Ehre oder Glanz bedeuten. „Herrlichkeit“ wahrt den gehobenen poetischen Ton und entspricht griechisch δόξα.
- source_word: גוי
  choice: Volk
  rationale: גּוֹי bezeichnet ein Volk beziehungsweise eine Nation. „Volk“ klingt in diesem poetisch-historischen Zusammenhang natürlicher.
- source_word: נבל
  choice: töricht
  rationale: נָבָל bezeichnet Torheit mit moralischem Beiklang. „Töricht“ bewahrt die Wertung, ohne sie konfessionell oder dogmatisch zuzuspitzen.
- source_word: נכרי
  choice: fremd
  rationale: נָכְרִי bedeutet „fremd“ oder „ausländisch“. Zusammen mit „Volk“ ist „fremd“ im modernen Deutsch klar und idiomatisch.
theological_decisions:
- issue: Bildliche Bedeutung des Horns
  choice: Das Bild „ihr Horn“ bleibt im Haupttext erhalten.
  alternative: ihre Stärke / ihre Macht
  rationale: Die Aussage betrifft Macht und Würde, doch Hebräisch und Griechisch drücken dies mit dem biblischen Hornbild aus. Eine Deutung im Haupttext würde die Bildsprache unnötig einebnen.
- issue: Textliche Auffälligkeit bei לאחור
  choice: Nach dem durch die griechische Parallele gestützten Sinn als „anderen preis“ übersetzen.
  alternative: nach hinten / rückwärts
  rationale: Die erhaltene hebräische Form ist ungewöhnlich und ergibt wörtlich einen schwierigen Sinn. Die griechische Parallele bietet „anderen“ und dürfte hier den zugrunde liegenden Sinn bewahren; die Unsicherheit wird in einer Fußnote offengelegt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewahrter biblischer Bildsprache. „Preisgeben“ macht die durch die griechische Parallele gestützte Übergabe an andere idiomatisch verständlich; die textliche Unsicherheit bleibt durch die Fußnote sichtbar.
