translation:
  language: de
  text: Und er erwähnte auch Hiob[a], der alle Wege der Gerechtigkeit aufrechterhielt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Paralleltext weicht deutlich ab und erwähnt Hiob nicht. Er lautet sinngemäß: »Denn er gedachte auch der Feinde im Regen und tat denen Gutes, die gerade Wege gehen.«'
    reason: alternative_reading
lexical_decisions:
- source_word: וגם
  choice: Und er … auch
  rationale: Bewahrt die additive Verknüpfung mit der vorausgehenden Reihe und ergibt im Deutschen eine natürliche Satzstellung.
- source_word: הזכיר
  choice: erwähnte
  rationale: Gibt den Grundsinn »erwähnen, in Erinnerung rufen« direkt wieder; das griechische ἐμνήσθη steht dem Sinn »gedenken« näher, ist hier aber nicht die primäre Textgrundlage.
- source_word: את איוב
  choice: Hiob
  rationale: Verwendet die im Deutschen übliche biblische Namensform.
- source_word: ומכלכל
  choice: der … festhielt
  rationale: Das Partizip von כלכל kann ein Erhalten, Aufrechterhalten oder beständiges Ausrichten bezeichnen. Mit »an … festhielt« wird hier die beharrliche Treue zu gerechten Lebenswegen idiomatisch ausgedrückt, ohne die Bildsprache der Wege aufzugeben.
- source_word: כל דרכי צדק
  choice: an allen Wegen der Gerechtigkeit
  rationale: Bewahrt sowohl das umfassende כל als auch die hebräische Weg-Metapher. »Gerechtigkeit« lässt die ethisch-religiöse Bedeutung von צדק offen und verengt sie nicht auf Rechtsprechung.
theological_decisions:
- issue: Deutlich abweichende Überlieferung im griechischen Paralleltext
  choice: 'Der erhaltene hebräische Text bildet den Haupttext: Hiob hielt an allen Wegen der Gerechtigkeit fest.'
  alternative: Der griechische Paralleltext erwähnt hier nicht Hiob, sondern Feinde im Regen und diejenigen, die gerade Wege gehen.
  rationale: Wo ein belastbarer hebräischer Sirachtext erhalten ist, hat er Vorrang. Die erheblich abweichende griechische Überlieferung wird jedoch in einer Fußnote sichtbar gemacht und nicht stillschweigend harmonisiert.
- issue: Bedeutung von צדק
  choice: Gerechtigkeit
  alternative: Recht; Rechtschaffenheit
  rationale: »Gerechtigkeit« erhält die breite moralische und religiöse Bedeutung und passt zur Weg-Metapher, ohne eine engere dogmatische Deutung einzutragen.
translation_notes:
  register: Moderne, würdige Standardsprache. Die Formulierung bleibt nah an der hebräischen Weg-Metapher; »festhielt« macht die Aussage zugleich für heutige Leser verständlich.
