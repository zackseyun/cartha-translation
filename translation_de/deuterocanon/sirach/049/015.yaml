  text: Like Joseph[a], a man was born[b]; and even his body was cared for.
translation:
  language: de
  text: Wurde je ein Mann wie Josef geboren?[a] Auch für seinen Leichnam wurde gesorgt.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Parallelfassung lautet ausführlicher: „Josef aber wurde ein Mann, ein Führer seiner Brüder, eine Stütze des Volkes, und für seine Gebeine wurde gesorgt.“ Der hebräische Text ist hier kürzer.'
    reason: alternative_reading
  - marker: b
    text: Gemeint ist wahrscheinlich die spätere ehrenvolle Behandlung und Bestattung von Josefs sterblichen Überresten; siehe 2. Mose 13,19 und Josua 24,32.
    reason: cross_reference
lexical_decisions:
- source_word: כיוסף
  choice: wie Josef
  rationale: 'Das Präfix כ bezeichnet hier den Vergleich. In Verbindung mit אם entsteht am natürlichsten eine rhetorische Frage: Ob je ein Mann wie Josef geboren wurde.'
- source_word: אם נולד גבר
  choice: Wurde je ein Mann … geboren?
  rationale: אם kann eine indirekte oder rhetorische Frage einleiten. Das im Deutschen ergänzte „je“ macht den naheliegenden rhetorischen Sinn deutlich, ohne die knappe hebräische Aussage durch die längere griechische Fassung zu erweitern. גבר wird sachlich mit „Mann“ wiedergegeben.
- source_word: גויתו
  choice: seinen Leichnam
  rationale: גויה bezeichnet häufig den Körper eines Verstorbenen. „Leichnam“ macht den nachträglichen, auf Josefs sterbliche Überreste bezogenen Zusammenhang klarer als das allgemeinere „Körper“.
- source_word: נפקדה
  choice: für … wurde gesorgt
  rationale: Die passive Form von פקד kann ausdrücken, dass jemand oder etwas bedacht, aufgesucht oder versorgt wurde. Im Zusammenhang mit Josefs sterblichen Überresten gibt „wurde gesorgt“ den Sinn natürlich wieder, ohne die Handlung ausschließlich auf die Bestattung festzulegen.
theological_decisions:
- issue: Kürzere hebräische Fassung gegenüber der ausführlicheren griechischen Parallelüberlieferung
  choice: Der Haupttext folgt dem erhaltenen Hebräisch; die griechische Erweiterung steht in einer Fußnote.
  alternative: „Josef aber wurde ein Mann, ein Führer seiner Brüder, eine Stütze des Volkes, und für seine Gebeine wurde gesorgt.“
  rationale: Wo der hebräische Sirachtext erhalten ist, bildet er die primäre Grundlage. Die griechische Fassung bietet hier zusätzliche Ehrentitel, die nicht stillschweigend in den knapperen hebräischen Haupttext aufgenommen werden sollen.
- issue: Deutung von אם נולד גבר
  choice: 'Wiedergabe als rhetorische Frage: „Wurde je ein Mann … geboren?“'
  alternative: 'Aussagesatz: „Wie Josef wurde ein Mann geboren.“'
  rationale: Die Wortfolge כיוסף אם נולד גבר lässt sich am ehesten als Frage verstehen, wobei אם den fragenden Sinn trägt. Die Formulierung bleibt wegen der knappen, ungewöhnlichen Syntax nicht völlig sicher; die gewählte Wiedergabe ergibt jedoch einen verständlichen Lobpreis Josefs.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorische Frage bewahrt den knappen Lobcharakter des Hebräischen; „Leichnam“ ist im Bestattungskontext präzise, ohne unnötig drastisch zu wirken.
