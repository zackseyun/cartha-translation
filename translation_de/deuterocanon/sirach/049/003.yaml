translation:
  language: de
  text: Er richtete sein Herz auf Gott[a], und in Tagen der Gewalt bewies er Treue.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Griechisch: „auf den Herrn“ statt hebräisch „auf Gott“.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „erwies Güte“. Das Griechische versteht den Ausdruck ausdrücklich im Sinn von „Frömmigkeit“ oder „Gottesfurcht“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ויתם
  choice: richtete … aus
  rationale: Die Form im zusammengesetzten hebräischen Text ist unsicher; das griechische κατεύθυνεν stützt jedoch die Bedeutung „ausrichten/gerade richten“. Mit „sein Herz auf Gott ausrichten“ ergibt sich im Deutschen eine natürliche und quellengerechte Wendung.
- source_word: אל אל
  choice: auf Gott
  rationale: Der hebräische Text nennt Gott; die Präposition wird zusammen mit „ausrichten“ idiomatisch als „auf Gott“ wiedergegeben. Die griechische Lesart „auf den Herrn“ wird in einer Fußnote dokumentiert.
- source_word: לבו
  choice: sein Herz
  rationale: „Herz“ bewahrt den biblischen Ausdruck für das innere Denken, Wollen und Empfinden, ohne ihn auf „Verstand“ zu verengen.
- source_word: ובימי חמס
  choice: in Tagen der Gewalt
  rationale: חמס bezeichnet Gewalt, Unrecht oder Frevel. „Tage der Gewalt“ bewahrt die gesellschaftliche und moralische Dimension des hebräischen Ausdrucks; die griechische Parallele spricht von „Tagen der Gesetzlosen“.
- source_word: עשה חסד
  choice: erwies … treue Hingabe
  rationale: חסד kann Güte, Verbundenheit oder loyale Treue bezeichnen. „Treue Hingabe“ wahrt diese Bedeutungsbreite und lässt zugleich die religiöse Deutung der griechischen Parallele („Frömmigkeit/Gottesfurcht“) anklingen, ohne deren verstärktes Verb in den Haupttext zu übernehmen.
theological_decisions:
- issue: Ob עשה חסד zwischenmenschliche Güte oder auf Gott gerichtete Frömmigkeit bezeichnet
  choice: treue Hingabe
  alternative: erwies Güte; stärkte die Frömmigkeit
  rationale: Der hebräische Wortlaut bleibt mehrdeutig, während die griechische Parallele ausdrücklich religiös deutet. „Treue Hingabe“ bewahrt die Spannung zwischen loyaler Güte und Gottesfrömmigkeit, statt sie einseitig aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt knapp und parallel. „Treue Hingabe“ ist verständlich, bewahrt aber bewusst die Mehrdeutigkeit von חסד zwischen loyaler Güte und religiöser Treue.
