  text: Ezekiel saw a vision[a], and described the kinds of the chariot.
translation:
  language: de
  text: Ezechiel sah eine Vision[a] und beschrieb die Arten des Wagens.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Griechisch: „Ezechiel, der eine Vision der Herrlichkeit sah, die ihm auf einem Wagen der Kerubim gezeigt wurde.“ Der hebräische Text ist kürzer; die Wendung „die Arten des Wagens“ könnte eine verkürzte oder unsicher überlieferte Formulierung sein.'
    reason: alternative_reading
lexical_decisions:
- source_word: וחזקאל
  choice: Ezechiel
  rationale: Für den Namen des Propheten wird die im Deutschen gebräuchliche biblische Form verwendet; das anknüpfende ו wird im natürlichen deutschen Satzbau nicht eigens mit „und“ wiedergegeben.
- source_word: ראה
  choice: sah
  rationale: Schlichte und natürliche Wiedergabe des gewöhnlichen Verbs „sehen“ im Präteritum.
- source_word: מראה
  choice: eine Vision
  rationale: Im prophetischen Zusammenhang bezeichnet מראה eine visionäre Schau; auch das griechische ὅρασιν stützt dieses Verständnis.
- source_word: ויגד
  choice: beschrieb
  rationale: נגד im Hifil bedeutet „mitteilen, kundtun“. Angesichts des folgenden Gegenstands gibt „beschrieb“ den Sinn im Deutschen am natürlichsten wieder.
- source_word: זני
  choice: die Arten
  rationale: Die überlieferte hebräische Lesart bedeutet wahrscheinlich „Arten“ oder „Sorten“. Die ungewöhnliche, möglicherweise verkürzte Formulierung wird bewusst nicht zu „Einzelheiten“ geglättet.
- source_word: מרכבה
  choice: des Wagens
  rationale: מרכבה bedeutet wörtlich „Wagen“ und verweist hier auf Ezechiels Thronwagenvision. Die im Griechischen genannten Kerubim werden nicht in den hebräisch begründeten Haupttext aufgenommen.
theological_decisions:
- issue: Soll die knappe hebräische Fassung anhand der ausführlicheren griechischen Parallele zur Herrlichkeits- und Kerubimvision erweitert werden?
  choice: Der Haupttext folgt der erhaltenen hebräischen Fassung und bewahrt ihre ungewöhnliche Wendung „die Arten des Wagens“.
  alternative: „Ezechiel sah die Vision der Herrlichkeit, die ihm auf dem Wagen der Kerubim gezeigt wurde.“
  rationale: Der vorhandene hebräische Text hat Vorrang, ist bei זני jedoch möglicherweise verkürzt oder textlich unsicher. Die ausführlichere griechische Lesart wird deshalb als echte Textalternative in der Fußnote dokumentiert, aber nicht stillschweigend in den Haupttext eingefügt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Vision“ ist allgemein verständlich und wahrt den prophetischen Zusammenhang. Die auffällige Formulierung „Arten des Wagens“ bleibt aus Quellentreue stehen und wird durch die Fußnote textkritisch eingeordnet.
