translation:
  language: de
  text: Mancher strauchelt, ohne es zu wollen;[a] und wer hat nicht mit seiner Zunge gesündigt?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „nicht von der Seele her“; auch: „nicht absichtlich“.'
    reason: Die griechische Wendung οὐκ ἀπὸ ψυχῆς ist ungewöhnlich. Die Haupttextfassung gibt wahrscheinlich fehlende Absicht idiomatisch wieder; die Fußnote erhält die wörtliche, bildhafte Ausdrucksweise.
lexical_decisions:
- source_word: ἔστιν ὀλισθάνων
  choice: Es gibt Menschen, die sich verfehlen
  rationale: Die existentielle Wendung mit substantiviertem Partizip beschreibt allgemein einen Menschen, dem ein Fehltritt unterläuft. Der Plural formuliert diese generische Aussage im heutigen Deutsch natürlich, ohne das Geschlecht des griechisch nicht ausdrücklich bezeichneten Subjekts festzulegen.
- source_word: ὀλισθάνων
  choice: sich verfehlen
  rationale: Das Verb bezeichnet wörtlich ein Ausgleiten oder Straucheln, hier jedoch bildlich einen menschlichen Fehltritt. „Sich verfehlen“ bewahrt den moralischen Bezug und vermeidet den Eindruck eines rein körperlichen Ausrutschens.
- source_word: οὐκ ἀπὸ ψυχῆς
  choice: ohne es zu wollen
  rationale: Wörtlich heißt die Wendung „nicht von der Seele her“. Im Gegensatz zu einem vorsätzlichen Fehltritt bezeichnet sie hier fehlende Absicht; die Fußnote bewahrt den ungewöhnlichen griechischen Wortlaut.
- source_word: τίς οὐχ ἥμαρτεν
  choice: wer hat nicht … gesündigt?
  rationale: Die rhetorische Frage setzt voraus, dass niemand frei von Verfehlungen im Reden ist. „Gesündigt“ erhält das moralische Gewicht von ἁμαρτάνω.
- source_word: ἐν τῇ γλώσσῃ αὐτοῦ
  choice: mit seiner Zunge
  rationale: Diese Formulierung gibt das griechische Körperbild wieder und ist zugleich als Hinweis auf das Reden verständlich.
theological_decisions:
- issue: Moralische Bedeutung von ἥμαρτεν im Zusammenhang menschlicher Rede
  choice: gesündigt
  alternative: sich geirrt / sich verfehlt
  rationale: Der Vers bewertet sprachliches Versagen moralisch. „Gesündigt“ wahrt diese Spannung, ohne eine weitergehende dogmatische Deutung einzutragen.
- issue: Absichtlichkeit des Fehltritts in οὐκ ἀπὸ ψυχῆς
  choice: ohne es zu wollen
  alternative: nicht von der Seele her
  rationale: Die idiomatische Haupttextfassung macht den Gegensatz zwischen unbeabsichtigtem und vorsätzlichem Fehlverhalten verständlich; die wörtlichere Möglichkeit bleibt in der Fußnote sichtbar.
translation_notes:
  register: Natürliches, würdiges Standarddeutsch in sprichwortartigem Ton. Das Semikolon verdeutlicht den Übergang vom unbeabsichtigten Fehltritt zur allgemeinen rhetorischen Frage. Die generische Aussage wird inklusiv formuliert, ohne den Sinn einzuschränken.
