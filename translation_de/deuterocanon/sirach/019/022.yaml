    issue: Die Wiedergabe von πονηρευόμενος als »der Böses treibt« ist zu allgemein.
    rationale: Das Partizip beschreibt nicht bloß böses Handeln, sondern legt nahe, dass die Person Böses betreibt, ausheckt oder plant. »Böses plant« bewahrt diesen Aspekt klarer.
  - severity: low
    issue: »sein Inneres ist voller Täuschung« glättet die adverbiale Beziehung von τὰ ἐντὸς αὐτοῦ zum Subjekt.
    rationale: Da πλήρης maskulin ist, beschreibt es den genannten Menschen. »innerlich voller Trug« gibt diese Konstruktion und den Kontrast von äußerer Haltung und innerer Gesinnung unmittelbarer wieder.
