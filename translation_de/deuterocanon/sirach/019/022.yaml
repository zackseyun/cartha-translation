  yaml_path: translation/deuterocanon/sirach/019/022.yaml
  text: There is one who plots evil[a], bent low in gloom, and inwardly he is full of deceit;
translation:
  language: de
  text: Es gibt einen, der Böses plant, in Düsternis gebeugt[a] und innerlich voller Trug.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »in Schwermut gebeugt« beziehungsweise »in Schwärze gebeugt«; das griechische Wort kann sowohl eine düstere Gemütslage als auch ein finsteres oder verdunkeltes Erscheinungsbild bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔστιν
  choice: Da ist einer
  rationale: Die existentielle Einleitung stellt einen allgemeinen Menschentyp vor und klingt im Deutschen natürlich.
- source_word: πονηρευόμενος
  choice: der Böses treibt
  rationale: Das Partizip bezeichnet tätiges böses Handeln und kann auch arglistiges Vorgehen einschließen, ohne zwingend auf das konkrete Planen beschränkt zu sein.
- source_word: συγκεκυφώς
  choice: gebeugt
  rationale: Das Perfektpartizip bezeichnet eine gebeugte oder gebückte Haltung; die knappe Wiedergabe lässt offen, ob sie körperlich, seelisch oder zur Schau gestellt ist.
- source_word: μελανίᾳ
  choice: in Düsternis
  rationale: Der Ausdruck kann Schwärze beziehungsweise ein finsteres Erscheinungsbild oder eine düstere Gemütslage bezeichnen. »Düsternis« bewahrt diese Mehrdeutigkeit.
- source_word: τὰ ἐντὸς αὐτοῦ
  choice: sein Inneres
  rationale: Die substantivierte Wendung meint das, was im Menschen ist, und erhält so den Kontrast zwischen äußerer Haltung und innerer Beschaffenheit.
- source_word: πλήρης δόλου
  choice: ist voller Täuschung
  rationale: δόλος bezeichnet Täuschung, Arglist oder Trug. »Täuschung« ist verständlich und lässt die genaue Form der Hinterlist offen.
theological_decisions:
- issue: Verhältnis von äußerer Haltung und innerer Bosheit
  choice: Die gebeugte, düstere Erscheinung wird der inneren Täuschung gegenübergestellt, ohne sie ausdrücklich als Verstellung zu deuten.
  alternative: Die Haltung könnte entweder echte Niedergeschlagenheit ausdrücken oder bewusst zur Tarnung eingesetzt sein.
  rationale: Der griechische Text nennt äußere Haltung beziehungsweise Düsternis und inneren Trug nebeneinander, entscheidet aber nicht ausdrücklich, ob die äußere Erscheinung gespielt ist.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die leicht markierte Formulierung »in Düsternis« erhält die Mehrdeutigkeit des griechischen μελανίᾳ; der Satzbau bewahrt den Gegensatz zwischen äußerer Haltung und Innerem.
