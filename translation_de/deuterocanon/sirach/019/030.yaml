translation:
  language: de
  text: Die Kleidung eines Mannes, das Lachen seiner Zähne[a] und die Schritte eines Menschen sagen etwas darüber aus, wie es um ihn steht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Lächeln, das seine Zähne zeigt“. Wörtlich steht im Griechischen: „das Lachen der Zähne“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: στολισμὸς
  choice: Kleidung
  rationale: Das Substantiv bezeichnet Schmuck, Ausstattung oder äußere Aufmachung. „Kleidung“ ist im Zusammenhang mit sichtbaren Merkmalen natürlich und konkret, ohne den Sinn auf bloßen Schmuck einzuengen.
- source_word: ἀνδρὸς
  choice: eines Mannes
  rationale: Die maskuline Singularform wird entsprechend dem griechischen Wortlaut sichtbar bewahrt.
- source_word: γέλως ὀδόντων
  choice: das Lachen seiner Zähne
  rationale: Die ungewöhnliche Bildsprache des Griechischen („Lachen der Zähne“) bleibt im Haupttext erhalten. Die wahrscheinlich gemeinte glattere Wiedergabe „Lächeln“ steht in der Fußnote.
- source_word: βήματα ἀνθρώπου
  choice: die Schritte eines Menschen
  rationale: „Schritte“ gibt βήματα direkt wieder; „eines Menschen“ bildet den Wechsel vom spezifischeren ἀνήρ zum allgemeineren ἄνθρωπος ab.
- source_word: ἀναγγέλλει
  choice: sagen etwas darüber aus
  rationale: Die Wendung gibt die Bedeutung „bekannt machen, anzeigen“ in natürlichem modernem Deutsch wieder. Wegen des zusammengesetzten Subjekts steht das Verb im Deutschen im Plural.
- source_word: τὰ περὶ αὐτοῦ
  choice: wie es um ihn steht
  rationale: Die Formulierung bewahrt den weiten Sinn dessen, was die betreffende Person angeht, ohne ihn ausschließlich auf Charakter, Ruf oder Lebensumstände festzulegen.
