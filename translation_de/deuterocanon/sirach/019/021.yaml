  yaml_path: translation/deuterocanon/sirach/019/021.yaml
  text: There is a meticulous cunning[a], and this too is unjust[b]; and there is one who twists things in order to bring a judgment to light.
translation:
  language: de
  text: Es gibt eine genau berechnete Verschlagenheit[a], und auch sie ist ungerecht; und es gibt einen, der etwas verdreht, um ein Urteil[b] ans Licht zu bringen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eine sorgfältig ausgeführte List“.'
    reason: lexical_alternative
  - marker: b
    text: Das griechische Wort kann auch „Recht“, „Gerechtigkeit“ oder „Rechtsspruch“ bedeuten.
    reason: alternative_reading
lexical_decisions:
- source_word: πανουργία ἀκριβὴς
  choice: genau berechnete Verschlagenheit
  rationale: πανουργία bezeichnet hier negativ bewertete Schlauheit oder Verschlagenheit; ἀκριβής hebt deren Genauigkeit und sorgfältige Berechnung hervor. Die Formulierung wahrt sowohl den moralischen Unterton als auch die qualifizierende Nuance.
- source_word: ἄδικος
  choice: ungerecht
  rationale: Das Wort bezeichnet moralisches Unrecht mit deutlichem Bezug zum Bereich von Recht und Gerechtigkeit; „ungerecht“ erhält zugleich den Zusammenhang mit κρίμα.
- source_word: διαστρέφων
  choice: der etwas verdreht
  rationale: Das Partizip bezeichnet ein Verdrehen oder Verfälschen. Da im Griechischen kein ausdrückliches Objekt steht, hält „etwas“ diese Offenheit auf natürliche deutsche Weise fest.
- source_word: χάριν τοῦ
  choice: um … zu
  rationale: Die Konstruktion drückt einen Zweck aus; „um … zu“ ist im modernen Deutschen die klare und unmittelbare Entsprechung.
- source_word: ἐκφᾶναι
  choice: ans Licht zu bringen
  rationale: Das Verb bedeutet, etwas sichtbar, offenkundig oder deutlich zu machen. „Ans Licht bringen“ gibt diesen Sinn anschaulich wieder.
- source_word: κρίμα
  choice: Urteil
  rationale: κρίμα kann ein Urteil, einen Rechtsspruch oder das Recht beziehungsweise die Gerechtigkeit im konkreten Fall bezeichnen. „Urteil“ bewahrt den rechtlich-ethischen Bedeutungsrahmen, ohne ihn unnötig einzuengen.
theological_decisions:
- issue: Moralische Bewertung kunstvoller Schlauheit
  choice: Die genau berechnete Verschlagenheit wird ausdrücklich als ungerecht bezeichnet.
  alternative: Die erste Wendung könnte zunächst neutraler als „sorgfältige Klugheit“ verstanden werden, bevor der Nachsatz sie negativ bewertet.
  rationale: αὕτη ἄδικος bezieht sich unmittelbar auf πανουργία ἀκριβής. Deshalb soll die Hauptübersetzung den negativen Grundton erkennen lassen, ohne eine besondere konfessionelle Deutung einzutragen.
- issue: Bedeutung von κρίμα im Schlusssatz
  choice: „Urteil“, mit Erläuterung der Bedeutungsbreite in einer Fußnote.
  alternative: „Recht“, „Gerechtigkeit“ oder „Rechtsspruch“.
  rationale: Der griechische Ausdruck lässt offen, ob vor allem das Urteil selbst oder das darin hervortretende Recht gemeint ist. Diese Spannung wird nicht stillschweigend aufgelöst.
- issue: Spannung zwischen Verdrehen und Offenlegen eines Urteils
  choice: Beide Handlungen werden ohne erklärende moralische Harmonisierung nebeneinandergestellt.
  alternative: Das Verdrehen könnte ausdrücklich als legitimes Vorgehen zugunsten der Gerechtigkeit oder als heuchlerische Manipulation gedeutet werden.
  rationale: Der Wortlaut benennt das Verdrehen und dessen Zweck, erklärt aber nicht eindeutig, wie die handelnde Person abschließend zu bewerten ist. Die Übersetzung bewahrt diese Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur folgt dem griechischen Parallelismus, bleibt aber gut verständlich. „Etwas“ macht das im Griechischen unausgesprochene Objekt idiomatisch, ohne es inhaltlich festzulegen.
