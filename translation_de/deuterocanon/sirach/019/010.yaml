  text: A fool will suffer pangs at the sight of a word[a], like a woman in labor at the sight of a baby.
translation:
  language: de
  text: Ein Tor wird wegen eines Wortes Wehen bekommen, wie eine Gebärende wegen eines Kindes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „vom Angesicht beziehungsweise aus der Gegenwart eines Wortes … wie vom Angesicht beziehungsweise aus der Gegenwart eines Kindes“. Die griechische Wendung bezeichnet hier den Anlass oder die Ursache.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ προσώπου
  choice: wegen
  rationale: Die Wendung bedeutet wörtlich „vom Angesicht/aus der Gegenwart von“, bezeichnet hier aber in beiden Satzhälften den Anlass beziehungsweise die Ursache. „Wegen“ gibt diese Funktion knapp und natürlich wieder.
- source_word: λόγου
  choice: eines Wortes
  rationale: λόγος kann „Wort“, „Rede“, „Nachricht“ oder „Angelegenheit“ bedeuten. „Wort“ bewahrt die prägnante, sprichwortartige Form und lässt die semantische Weite bestehen.
- source_word: ὠδινήσει
  choice: bekommt … Wehen
  rationale: Das Verb bezeichnet Wehen beziehungsweise heftige Geburtsschmerzen. Die Wiedergabe erhält das Bild, das durch den Vergleich mit der Gebärenden ausdrücklich entfaltet wird.
- source_word: μωρός
  choice: Ein Tor
  rationale: „Tor“ ist im Deutschen ein etablierter Weisheitsbegriff für einen moralisch oder praktisch unverständigen Menschen und passt zum würdevollen sprichwortartigen Stil.
- source_word: βρέφους
  choice: des Kindes
  rationale: βρέφος bezeichnet ein sehr kleines oder neugeborenes Kind. Im Vorgang des Gebärens ist „Kind“ natürlich und schließt sowohl das ungeborene als auch das zur Welt kommende Kind ein.
- source_word: ἡ τίκτουσα
  choice: eine Gebärende
  rationale: Das substantivierte Partizip bedeutet wörtlich „die Gebärende“. Die deutsche Form ist knapp, sachlich und erhält die aktive Geburtssituation.
theological_decisions: []
translation_notes:
  register: Knappes, bildkräftiges Weisheitswort in modernem, würdigem Standarddeutsch. Das ungewöhnliche Bild, dass ein Tor wegen eines Wortes gleichsam Wehen bekommt, bleibt bewusst erhalten; die kausale Funktion der wiederholten griechischen Wendung wird in beiden Satzhälften parallel mit „wegen“ wiedergegeben.
