  text: Have you heard a word? Let it die with you[a]; take courage[b], it will not burst you open.
translation:
  language: de
  text: 'Hast du etwas gehört? Lass es mit dir sterben.[a] Hab Mut: Es wird dich nicht zerreißen.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich kann λόγον „ein Wort“, „eine Angelegenheit“ oder „eine Nachricht“ bezeichnen.
    reason: lexical_alternative
  - marker: b
    text: 'Das griechische Bild ist drastisch: Das Gehörte wird dich nicht „zerreißen“; du kannst es also für dich behalten.'
    reason: cultural_note
lexical_decisions:
- source_word: ἀκήκοας λόγον
  choice: Hast du etwas gehört?
  rationale: Das Perfekt ἀκήκοας bezeichnet Gehörtes mit gegenwärtiger Bedeutung. λόγον meint hier wahrscheinlich eine Äußerung, Angelegenheit oder Nachricht; „etwas“ klingt im Deutschen natürlich und vermeidet eine irreführende Beschränkung auf ein einzelnes Wort.
- source_word: συναποθανέτω σοι
  choice: Lass es mit dir sterben.
  rationale: 'Der Imperativ bewahrt das eindrückliche Bild: Das Gehörte soll bei der angesprochenen Person bleiben und nicht weitererzählt werden.'
- source_word: θάρσει
  choice: Hab Mut
  rationale: Der Imperativ von θαρσέω spricht ermutigend zu und versichert, dass das Bewahren des Gehörten auszuhalten ist.
- source_word: οὐ μή σε ῥήξει
  choice: Es wird dich nicht zum Bersten bringen.
  rationale: οὐ μή ist eine nachdrückliche Verneinung; ῥήξει zeichnet das drastische Bild des Berstens oder Aufreißens. Die Formulierung erhält dieses Bild in verständlichem Deutsch.
theological_decisions: []
