  text: Do not tell it to friend or foe[a], and if it is not a sin for you, do not reveal it.
translation:
  language: de
  text: Erzähle es weder einem Freund noch einem Feind[a], und wenn es für dich keine Sünde ist, offenbare es nicht.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »Bei einem Freund und bei einem Feind erzähle nicht.« Gemeint sind wahrscheinlich die Personen, denen man die Sache erzählen könnte.'
    reason: Die griechische Wendung mit ἐν ist knapp und im Deutschen nicht unmittelbar idiomatisch.
  - marker: b
    text: 'Der griechische Satz ist an dieser Stelle mehrdeutig. Möglich ist auch die Deutung: »Offenbare es nicht, es sei denn, es wäre für dich Sünde« – also falls das Verschweigen selbst sündhaft wäre.'
    reason: Die Fußnote bewahrt die mögliche Ausnahmebedeutung, ohne die formal naheliegende Bedingung im Haupttext interpretierend festzulegen.
lexical_decisions:
- source_word: ἐν φίλῳ καὶ ἐν ἐχθρῷ
  choice: weder einem Freund noch einem Feind
  rationale: Die Präpositionalwendungen bezeichnen hier am ehesten die Personen, denen gegenüber etwas erzählt werden könnte. Die deutsche Paarformel bewahrt den Gegensatz und gibt das in der Verneinung sinngemäße »weder … noch« natürlich wieder.
- source_word: μὴ διηγοῦ
  choice: Erzähle es … nicht
  rationale: διηγέομαι bedeutet erzählen oder ausführlich berichten. Das im Griechischen unausgesprochene Objekt wird im Deutschen mit »es« aufgenommen.
- source_word: καὶ εἰ μή ἐστίν σοι ἁμαρτία
  choice: und wenn es für dich keine Sünde ist
  rationale: Diese Wiedergabe folgt der grammatischen Oberfläche des knappen griechischen Satzes, ohne ihn stillschweigend zu einer Ausnahmeformel umzudeuten.
- source_word: μὴ ἀποκάλυπτε
  choice: offenbare es nicht
  rationale: ἀποκαλύπτω bezeichnet das Aufdecken oder Bekanntmachen von etwas Verborgenem. »Offenbaren« wahrt die stärkere Bedeutung gegenüber dem vorhergehenden »erzählen«.
theological_decisions:
- issue: Logische Bedeutung von καὶ εἰ μή ἐστίν σοι ἁμαρτία
  choice: Die Bedingung wird formal als »wenn es für dich keine Sünde ist« wiedergegeben.
  alternative: »Es sei denn, es wäre für dich Sünde«, verstanden als Erlaubnis zur Offenlegung, falls Schweigen sündhaft wäre.
  rationale: Der griechische Wortlaut ist knapp und seine gedankliche Verknüpfung nicht völlig eindeutig. Der Haupttext bewahrt diese Spannung; eine Fußnote nennt die mögliche exceptive Deutung, ohne sie zum alleinigen Sinn zu erklären.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die sprichwortartige Gegenüberstellung »Freund … Feind« bleibt erhalten; »offenbaren« hebt das Bekanntmachen einer verborgenen Sache hervor. Die syntaktische und ethische Spannung des zweiten Satzteils wird im Haupttext nicht geglättet.
