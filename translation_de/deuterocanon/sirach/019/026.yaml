  text: A man's attire[a], and the laughter of his teeth[b], and a person's steps proclaim what concerns him.
translation:
  language: de
  text: Die Kleidung eines Mannes, das Lachen seiner Zähne[a] und die Schritte eines Menschen geben zu erkennen, was ihn betrifft.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „das Lachen seiner Zähne“; gemeint sein können das Lächeln oder das Zeigen der Zähne.'
    reason: lexical_alternative
  - marker: b
    text: Der griechische Ausdruck ist ungewöhnlich. Die Übersetzung bewahrt seine Bilder, statt den Satz zu einer stärker deutenden Aussage über den Charakter umzuformen.
    reason: textual_clarity
lexical_decisions:
- source_word: στολισμός
  choice: Kleidung
  rationale: Das Substantiv bezeichnet die äußere Ausstattung oder Aufmachung, besonders die Kleidung. „Kleidung“ ist im Deutschen klar und natürlich, ohne einen übermäßigen Schmuck zu unterstellen.
- source_word: ἀνδρός
  choice: eines Mannes
  rationale: Der griechische Ausdruck ist maskulin und singularisch; die konkrete Formulierung wird beibehalten.
- source_word: γέλως ὀδόντων
  choice: das Lachen seiner Zähne
  rationale: Wörtlich steht hier „Lachen der Zähne“. Die ungewöhnliche, anschauliche Wendung bleibt im Haupttext erhalten; die mögliche idiomatische Bedeutung wird in einer Fußnote genannt.
- source_word: βήματα
  choice: die Schritte
  rationale: Das Wort kann einzelne Schritte oder die Art des Gehens bezeichnen. „Schritte“ wahrt diese Offenheit und entspricht dem Bild des griechischen Textes.
- source_word: ἀνθρώπου
  choice: eines Menschen
  rationale: Anders als ἀνήρ ist ἄνθρωπος allgemein auf einen Menschen bezogen. Die Übersetzung bildet diesen Unterschied ab.
- source_word: ἀναγγέλλει
  choice: geben zu erkennen
  rationale: Das Verb bedeutet „melden“, „bekannt machen“ oder „kundtun“. Wegen des zusammengesetzten Subjekts ist im Deutschen der Plural erforderlich; „geben zu erkennen“ drückt aus, dass äußere Merkmale etwas über die Person offenbaren.
- source_word: τὰ περὶ αὐτοῦ
  choice: was ihn betrifft
  rationale: Die breite griechische Wendung wird möglichst nah wiedergegeben, ohne sie deutend auf Charakter oder Wesen einzuengen.
