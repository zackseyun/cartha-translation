translation:
  language: de
  text: Ein Pfeil, der im Fleisch des Oberschenkels steckt – so ist ein Wort im Bauch eines Toren.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Formulierung ist stark verdichtet und lässt sich auch etwas anders auflösen, etwa: „Ein Pfeil, der in einem fleischlichen Oberschenkel steckt.“ Gemeint ist jedenfalls ein Pfeil, der im Fleisch des Oberschenkels festsitzt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: βέλος
  choice: Pfeil
  rationale: βέλος bezeichnet ein Geschoss; im konkreten Bild des Spruchs ist „Pfeil“ die naheliegendste und anschaulichste Wiedergabe.
- source_word: πεπηγὸς
  choice: steckt
  rationale: Das Perfektpartizip von πήγνυμι bezeichnet den fortdauernden Zustand des Feststeckens oder Eingedrungenseins. „Steckt“ ist im Deutschen natürlich und erhält diesen Zustand.
- source_word: ἐν μηρῷ σαρκός
  choice: im Fleisch des Oberschenkels
  rationale: μηρός bezeichnet den Oberschenkel, σάρξ hier buchstäbliches Fleisch. Die Wiedergabe erhält beide Bildelemente und formuliert die stark verdichtete griechische Verbindung verständlich.
- source_word: λόγος
  choice: Wort
  rationale: λόγος meint hier ein gesprochenes Wort beziehungsweise eine Äußerung, die der Tor nicht für sich behalten kann. „Wort“ bleibt knapp und lässt die genaue Art der Mitteilung offen.
- source_word: ἐν κοιλίᾳ
  choice: im Bauch
  rationale: κοιλία bezeichnet wörtlich den Bauch oder Leib und kann zugleich das Innere eines Menschen meinen. „Bauch“ bewahrt die körperliche Parallele zum ersten Halbvers.
- source_word: μωροῦ
  choice: eines Toren
  rationale: μωρός bezeichnet in der Weisheitsliteratur den unverständigen Menschen. „Tor“ gehört zum würdevollen deutschen Weisheitssprachgebrauch und ist knapper als „törichter Mensch“.
theological_decisions:
- issue: Bedeutung von σάρξ
  choice: wörtlich „Fleisch“
  alternative: „Körper“
  rationale: Der Vers verwendet σάρξ in einem konkreten körperlichen Vergleich, nicht als theologischen Begriff. „Fleisch“ erhält das drastische Bild.
- issue: Bedeutung von κοιλία
  choice: konkret „Bauch“ mit möglichem Bezug auf das Innere
  alternative: „Inneres“
  rationale: Die körperliche Metapher des griechischen Textes soll nicht vorschnell abstrahiert werden; zugleich bleibt im Zusammenhang erkennbar, dass das Wort innerlich zurückgehalten wird.
translation_notes:
  register: Modernes, würdiges Standarddeutsch in knapper Spruchform. Der Gedankenstrich bildet den Vergleich der beiden Halbverse ab. „Tor“ wahrt den weisheitlichen Ton, während „Bauch“ das bewusst körperliche Bild des Originals erhält.
