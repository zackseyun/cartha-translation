  text: There is a wickedness that is also an abomination[a], and there is a fool lacking in wisdom.
translation:
  language: de
  text: Es gibt Bosheit, und diese ist ein Gräuel; und es gibt einen Toren, dem es an Weisheit mangelt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πονηρία
  choice: Bosheit
  rationale: Der Ausdruck bezeichnet hier allgemein sittlich Verwerfliches. „Bosheit“ bewahrt den ethischen Gehalt, ohne ihn auf bloße Böswilligkeit einzuengen.
- source_word: καὶ αὕτη
  choice: und auch sie
  rationale: 'Die Formulierung hält den rückbezüglichen Charakter von αὕτη und die additive Kraft von καί fest: Auch diese Bosheit ist als Gräuel einzustufen.'
- source_word: βδέλυγμα
  choice: Gräuel
  rationale: „Gräuel“ gibt die starke moralisch-religiöse Abscheu des griechischen Wortes in vertrauter biblischer Sprache wieder.
- source_word: ἄφρων
  choice: Tor
  rationale: „Tor“ ist die prägnante, im Deutschen geläufige Kategorie der Weisheitsliteratur und bezeichnet nicht nur mangelnde Intelligenz, sondern fehlende Einsicht.
- source_word: ἐλαττούμενος
  choice: dem es … mangelt
  rationale: Die idiomatische deutsche Wendung drückt die durch das Partizip bezeichnete Verminderung oder Unzulänglichkeit aus, ohne ein aktives Zurückfallen zu unterstellen.
- source_word: σοφίᾳ
  choice: an Weisheit
  rationale: Im Zusammenhang der Weisheitsliteratur bezeichnet σοφία Weisheit, nicht bloß praktische Fertigkeit; der deutsche Dativanschluss entspricht idiomatisch „es mangelt ihm an Weisheit“.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst weisheitlich-biblischem Wortschatz („Gräuel“, „Tor“). Die parataktische Doppelstruktur des Griechischen bleibt erhalten. Die etwas ungewöhnliche Aussage, dass ein Tor nur einen Mangel an Weisheit aufweist, wird nicht harmonisiert oder theologisch zugespitzt.
