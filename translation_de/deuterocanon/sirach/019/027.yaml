  text: One who lowers his face and pretends not to hear—where he is not recognized, he will get ahead of you.
translation:
  language: de
  text: Wer sein Gesicht senkt und sich taub stellt[a] – wo er nicht erkannt wird, wird er dir zuvorkommen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »so tut, als hörte er nichts«; das griechische Partizip bezeichnet jemanden, der Taubheit vortäuscht oder absichtlich weghört.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »wird er dich überholen« beziehungsweise »wird er sich dir gegenüber einen Vorsprung verschaffen«; das griechische Verb bedeutet, jemandem zuvorzukommen oder ihm voraus zu sein.'
    reason: lexical_alternative
lexical_decisions:
- source_word: συγκύφων
  choice: senkt
  rationale: Das Partizip bezeichnet ein Sich-Beugen oder Sich-Niederbeugen. Zusammen mit πρόσωπον gibt »das Gesicht senkt« die körperliche Haltung im Deutschen natürlich und quellennah wieder.
- source_word: πρόσωπον
  choice: das Gesicht
  rationale: Die gewöhnliche Bedeutung ist »Gesicht«; die Wiedergabe bewahrt das konkrete körperliche Bild.
- source_word: ἑτεροκωφῶν
  choice: sich taub stellt
  rationale: Das seltene Partizip beschreibt offenbar jemanden, der sich wie ein Tauber verhält oder absichtlich nicht hört. »Sich taub stellt« bringt dieses vorgetäuschte Verhalten knapp und idiomatisch zum Ausdruck.
- source_word: ὅπου
  choice: wo
  rationale: Die räumliche Bedeutung des Adverbs wird bewahrt, auch wenn kontextuell ebenso an eine Situation gedacht sein kann.
- source_word: οὐκ ἐπεγνώσθη
  choice: man ihn nicht erkannt hat
  rationale: Die unpersönliche deutsche Form gibt den Passivgedanken natürlich wieder. »Erkannt« wahrt den möglichen Sinn des Wieder- oder Durchschauens.
- source_word: προφθάσει σε
  choice: wird er dir zuvorkommen
  rationale: προφθάνω bezeichnet das Vorherkommen oder Zuvorkommen. Die Übersetzung erhält diese Grundbedeutung, ohne die mögliche Nuance eines errungenen Vorteils als alleinige Deutung festzulegen.
