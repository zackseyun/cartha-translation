  verdict: revise
  source_fidelity: Die Grundübersetzung trifft die Partizipien συγκύφων und ἑτεροκωφῶν sowie προφθάσει σε zuverlässig. Bei οὐκ ἐπεγνώσθη ist jedoch die deutsche Perfektform »man ihn nicht erkannt hat« unnötig vergangenheitsbezogen; die griechische passive Form beschreibt hier am besten den Umstand, dass die Person nicht erkannt wird bzw. unbekannt ist.
  naturalness: »Wer sein Gesicht senkt und sich taub stellt« ist verständlich, quellennah und im spruchhaften Register natürlich. »Wo er nicht erkannt wird« ist idiomatischer und zeitlich weniger einengend als »wo man ihn nicht erkannt hat«.
  terminology: Es liegen keine theologischen Fachbegriffe vor. »Sich taub stellen« und »jemandem zuvorkommen« geben die beabsichtigte Verstellung beziehungsweise das Vorauskommen knapp und angemessen wieder.
