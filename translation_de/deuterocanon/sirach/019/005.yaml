  text: Whoever rejoices in heart will be condemned[b][a], and whoever hates talk is lessened by evil.
translation:
  language: de
  text: Wer sich im Herzen freut, wird schuldig gesprochen; wer Geschwätz[a] hasst, wird durch Bosheit[b] gemindert.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort kann auch allgemein „Reden“ oder abwertend „Geschwätzigkeit, Geplapper“ bedeuten.
    reason: lexical_alternative
  - marker: b
    text: Der griechische Ausdruck ist knapp. Der Dativ kann hier auch als „von Bosheit“ oder, weniger wahrscheinlich, als „in der Bosheit“ verstanden werden.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ εὐφραινόμενος καρδίᾳ
  choice: wer sich im Herzen freut
  rationale: Das substantivierte Partizip wird als allgemeine Aussage wiedergegeben. „Im Herzen“ bewahrt die innere Bestimmung durch καρδίᾳ, ohne einen im Griechischen nicht genannten Anlass der Freude hinzuzufügen.
- source_word: καταγνωσθήσεται
  choice: wird schuldig gesprochen
  rationale: Die Wiedergabe erhält den verdiktiven, gerichtlichen Sinn des Futur Passiv, ohne über das griechische Verb hinaus Art oder Folge des Urteils festzulegen.
- source_word: λαλιὰν
  choice: Geschwätz
  rationale: Im weisheitlichen Zusammenhang bezeichnet das Wort wahrscheinlich übermäßiges oder nichtiges Reden. „Geschwätz“ ist im Deutschen natürlicher und treffender als das neutrale „Reden“, doch die breitere Bedeutung wird in einer Fußnote offengehalten.
- source_word: ἐλαττονοῦται
  choice: wird gemindert
  rationale: Die ungewöhnliche passive Formulierung bildet den Sinn „weniger gemacht werden“ eng nach und vermeidet eine sachliche Ergänzung, die der knappe griechische Text nicht nennt.
- source_word: κακίᾳ
  choice: durch Bosheit
  rationale: Der Dativ wird instrumental verstanden. „Bosheit“ wahrt den moralischen Gehalt von κακία; da auch eine andere Zuordnung möglich ist, wird die Unsicherheit angemerkt.
theological_decisions:
- issue: Der erste Satz nennt keinen moralisch schlechten Anlass der Freude.
  choice: Die uneingeschränkte Formulierung des überlieferten griechischen Ausgangstextes bleibt stehen.
  alternative: Eine Ergänzung wie „Wer sich über Bosheit freut“ würde den schwierigen Sinn glätten.
  rationale: Im vorgelegten griechischen Text bestimmt κακίᾳ nicht eindeutig die Freude und steht erst am Ende des zweiten Satzglieds. Eine Umstellung oder Ergänzung würde eine mögliche Deutung als Text ausgeben.
- issue: Bezug und Funktion von κακίᾳ im zweiten Satzglied
  choice: 'instrumental: „durch Bosheit“'
  alternative: 'lokativ bzw. hinsichtlich: „in der Bosheit“ oder eine Rückbeziehung auf das erste Satzglied'
  rationale: Die instrumentale Deutung folgt der nächstliegenden Satzstellung, bleibt aber wegen der gedrängten und auffälligen Syntax unsicher; die Fußnote wahrt diese Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst knapper Spruchform. Die befremdliche Aussage und die syntaktische Mehrdeutigkeit des griechischen Textes werden nicht stillschweigend geglättet. Das Semikolon mit „aber“ macht die Parallelstruktur lesbar, ohne einen stärkeren logischen Gegensatz festzulegen.
