  text: He stoops his face and pretends to be deaf[a]; where he is not recognized[b], he will outwit you.
translation:
  language: de
  text: Er senkt das Gesicht und stellt sich taub; wo man ihn nicht erkennt, kommt er dir zuvor.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „gewinnt er einen Vorsprung vor dir“ beziehungsweise „übervorteilt er dich“. Das griechische Verb bezeichnet ein Zuvorkommen oder ein Handeln, durch das jemand zuerst einen Vorteil erlangt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: συγκύφων πρόσωπον
  choice: senkt das Gesicht
  rationale: Die Wendung beschreibt eine gebeugte, nach unten gerichtete Haltung. „Senkt das Gesicht“ bewahrt das Körperbild und klingt im Deutschen natürlicher als eine wörtliche Nachbildung.
- source_word: ἑτεροκωφῶν
  choice: stellt sich taub
  rationale: Das seltene Verb bezeichnet ein Verhalten, bei dem jemand nicht zu hören scheint beziehungsweise absichtlich nicht reagiert. „Stellt sich taub“ gibt den vorgetäuschten Charakter knapp und idiomatisch wieder.
- source_word: ὅπου
  choice: wo
  rationale: Die örtlich oder situativ gebrauchte Konjunktion wird formal nah mit „wo“ wiedergegeben, ohne sie eindeutig auf „wenn“ oder „überall, wo“ festzulegen.
- source_word: οὐκ ἐπεγνώσθη
  choice: man ihn nicht erkennt
  rationale: Der passive Aorist von ἐπιγινώσκω bedeutet hier „nicht erkannt/identifiziert werden“. Die unpersönliche deutsche Form bewahrt das Passiv sinngemäß und vermeidet das stärker deutende „nicht durchschaut“.
- source_word: προφθάσει σε
  choice: kommt er dir zuvor
  rationale: προφθάνω bezeichnet das Zuvorkommen oder das Erlangen eines Vorteils durch früheres Handeln. „Kommt er dir zuvor“ bewahrt diesen Grundsinn, ohne den Ausgang ausdrücklich als Überlistung festzulegen.
