  text: Reprove a friend[a], for often there is slander, and do not believe every word.
translation:
  language: de
  text: Weise einen Freund zurecht, denn oft kommt es zu Verleumdung; und glaube nicht jedem Wort.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Vertraue nicht jeder Aussage.“ Wörtlich steht im Griechischen „jedem Wort“; im Zusammenhang ist damit das gemeint, was über jemanden gesagt wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔλεγξον
  choice: Weise … zurecht
  rationale: Der Imperativ von ἐλέγχω fordert dazu auf, jemanden zu tadeln, zu korrigieren oder zur Rechenschaft zu ziehen. „Zurechtweisen“ bewahrt die zwischenmenschliche und moralische Kraft, ohne unnötig eine feindselige Konfrontation anzudeuten.
- source_word: φίλον
  choice: einen Freund
  rationale: Der artikellose Singular ist hier am natürlichsten allgemein und sprichwortartig zu verstehen. „Einen Freund“ fügt keinen im Griechischen unausgesprochenen Besitzbezug hinzu.
- source_word: πολλάκις
  choice: oft
  rationale: Die knappe, geläufige Entsprechung des Adverbs ist „oft“.
- source_word: γὰρ
  choice: denn
  rationale: Die Konjunktion begründet die vorangehende Aufforderung; „denn“ gibt diesen erklärenden Zusammenhang in einem würdigen, natürlichen Deutsch wieder.
- source_word: γίνεται
  choice: kommt es zu
  rationale: γίνεται bezeichnet hier das Entstehen oder Eintreten eines Vorgangs. Zusammen mit dem Abstraktum διαβολή ist „es kommt zu“ idiomatisch und wahrt den Vorgangscharakter.
- source_word: διαβολή
  choice: Verleumdung
  rationale: διαβολή bezeichnet eine verleumderische Anschuldigung oder üble Nachrede. „Verleumdung“ ist im modernen Standarddeutsch klar und lässt den warnenden Zusammenhang erkennen.
- source_word: μὴ παντὶ λόγῳ πίστευε
  choice: glaube nicht jedem Wort
  rationale: Die Formulierung bildet λόγος mit „Wort“ formal ab und ist zugleich eine geläufige deutsche Warnung davor, jede Äußerung oder Behauptung ungeprüft anzunehmen.
