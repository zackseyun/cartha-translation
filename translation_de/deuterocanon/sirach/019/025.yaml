  source_fidelity: 'Der erste Teilsatz gibt ἀπὸ ὁράσεως und den gnomischen Sinn von ἐπιγνωσθήσεται angemessen wieder. Im zweiten ist „an der Begegnung seines Gesichts“ im Deutschen jedoch semantisch und syntaktisch missverständlich: Ein Gesicht kann nicht sinnvoll selbst „begegnen“. Die griechische, ungewöhnliche Wortverbindung bleibt in ihrer genauen Deutung unsicher und sollte nicht stärker festgelegt werden als nötig.'
  naturalness: „An seinem Gesicht bei einer Begegnung“ ist modernes, verständliches Deutsch und bewahrt den Bezug von Gesicht und Begegnung, ohne die Wendung zu einem unidiomatischen deutschen Genitivbild zu machen. Der knappe Parallelismus bleibt erhalten.
  terminology: „Mann“ entspricht ἀνήρ; „Verständigen“ gibt νοήμων passend als Bezeichnung für einen einsichtigen bzw. urteilsfähigen Menschen wieder. „Aussehen“ ist für ὅρασις in diesem Kontext natürlich. Die Fußnote kennzeichnet die zweite Wendung ausdrücklich als unsicher, statt eine bestimmte psychologische Deutung als sicher auszugeben.
