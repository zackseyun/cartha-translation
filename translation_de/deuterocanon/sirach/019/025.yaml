  text: A man is recognized by his appearance[a], and a man of understanding is recognized by the expression of his face.
translation:
  language: de
  text: An seinem Aussehen erkennt man einen Mann, und an seinem Gesicht bei einer Begegnung erkennt man einen Verständigen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „an der Begegnung des Gesichts“. Die ungewöhnliche griechische Wendung kann auf das Gesicht bzw. dessen Erscheinung in einer Begegnung Bezug nehmen; die genaue Nuance ist unsicher.'
    reason: Die Wendung ἀπὸ ἀπαντήσεως προσώπου ist sprachlich ungewöhnlich; die Anmerkung wahrt diese Unsicherheit und erläutert die zurückhaltende deutsche Wiedergabe.
lexical_decisions:
- source_word: ἀπὸ ὁράσεως
  choice: an seinem Aussehen
  rationale: Die Wendung bezeichnet die sichtbare Erscheinung als Grundlage des Erkennens. „Aussehen“ ist im Deutschen natürlich und bleibt näher an ὅρασις als eine Deutung auf den Charakter.
- source_word: ἐπιγνωσθήσεται
  choice: erkennt man
  rationale: Das Futur Passiv formuliert hier eine allgemeine Weisheit. Das unpersönliche Präsens gibt diesen gnomischen Sinn im modernen Deutschen natürlich wieder und bewahrt den Gedanken des Erkanntwerdens.
- source_word: ἀνήρ
  choice: einen Mann
  rationale: Das griechische Substantiv ist ausdrücklich männlich; ohne zwingenden Kontextgrund wird diese Form beibehalten.
- source_word: ἀπὸ ἀπαντήσεως προσώπου
  choice: an der Begegnung seines Gesichts
  rationale: Die ungewöhnliche griechische Verbindung aus „Begegnung“ und „Gesicht“ bleibt im Haupttext bewusst sichtbar, weil ihre genaue Bedeutung unsicher ist. Die Fußnote nennt die wahrscheinlich gemeinte Gesichtswirkung bei einer Begegnung.
- source_word: νοήμων
  choice: einen Verständigen
  rationale: „Verständiger“ erfasst Einsicht und Urteilsvermögen und entspricht dem knappen Parallelismus des griechischen Textes.
theological_decisions: []
translation_notes:
  register: Knapper, würdevoller Weisheitsspruch in modernem Standarddeutsch. Der parallele Satzbau des Griechischen wird bewahrt; die schwer deutbare zweite Wendung wird nicht stillschweigend auf „Gesichtsausdruck“ festgelegt.
