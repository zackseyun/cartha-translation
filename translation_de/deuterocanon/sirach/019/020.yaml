  text: Better is one who is lacking[a], with understanding and fear, than one who abounds in prudence and transgresses the law.
translation:
  language: de
  text: Besser ist, wer an Einsicht Mangel hat und sich fürchtet[a], als wer reich an Klugheit ist und das Gesetz übertritt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: ehrfürchtig ist. Der griechische Text nennt nicht, worauf sich die Furcht richtet.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κρείττων
  choice: Besser ist
  rationale: Der Komparativ eröffnet eine sprichwortartige Gegenüberstellung; „Besser ist“ bewahrt diese knappe Weisheitsform.
- source_word: ἡττώμενος ἐν συνέσει
  choice: wer an Einsicht Mangel hat
  rationale: Die Präpositionalgruppe ἐν συνέσει bestimmt am natürlichsten, worin die betreffende Person zurücksteht. Diese Wiedergabe folgt der griechischen Syntax und vermeidet, ἐν συνέσει fälschlich als positive Begleiteigenschaft zu verstehen.
- source_word: ἔμφοβος
  choice: sich fürchtet
  rationale: Das Adjektiv bezeichnet jemanden, der von Furcht erfüllt beziehungsweise furchtsam ist. Die verbale Formulierung klingt im Deutschen natürlich; der nicht genannte Gegenstand der Furcht bleibt offen.
- source_word: περισσεύων ἐν φρονήσει
  choice: wer reich an Klugheit ist
  rationale: περισσεύω bezeichnet Überfluss oder reichliches Vorhandensein; φρόνησις meint praktische Einsicht oder Klugheit. Die Formulierung bildet den Gegensatz zum Mangel an Einsicht ab.
- source_word: παραβαίνων νόμον
  choice: das Gesetz übertritt
  rationale: Die Wendung bezeichnet das Verletzen oder Übertreten eines Gesetzes. „Das Gesetz übertreten“ bewahrt den moralisch-rechtlichen Gehalt und den würdigen Ton.
theological_decisions:
- issue: Ob ἔμφοβος ausdrücklich als Gottesfurcht zu verstehen ist
  choice: sich fürchtet
  alternative: ehrfürchtig ist / den Herrn fürchtet
  rationale: Der griechische Text nennt keinen Gegenstand der Furcht. Ehrfurcht vor Gott ist im Kontext der Weisheitstradition möglich, doch „den Herrn“ würde eine im Vers nicht ausdrücklich vorhandene Ergänzung einführen.
- issue: Syntaktische Zuordnung von ἐν συνέσει
  choice: ἡττώμενος ἐν συνέσει als „an Einsicht Mangel hat“
  alternative: „Mangel hat, aber Einsicht besitzt“
  rationale: Die unmittelbare Verbindung von ἡττώμενος mit ἐν συνέσει bezeichnet am naheliegendsten den Bereich des Mangels. So bleibt auch die ausgewogene Gegenüberstellung zu περισσεύων ἐν φρονήσει erhalten.
translation_notes:
  register: Knappe, würdige Spruchform in modernem Standarddeutsch. „Einsicht“ und „Klugheit“ halten die beiden verwandten griechischen Begriffe auseinander; die parallele Struktur von Mangel und Reichtum bleibt erkennbar.
