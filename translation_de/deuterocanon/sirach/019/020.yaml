  source_fidelity: 'Die Zuordnung von ἐν συνέσει zu ἡττώμενος ist im griechischen Wortlaut gut begründet: Der erste Vergleichspartner ist hinsichtlich Einsicht unterlegen bzw. hat daran Mangel. ἔμφοβος bleibt davon getrennt als „sich fürchtet“. Der Gegensatz zu περισσεύων ἐν φρονήσει und die abschließende Gesetzesübertretung sind vollständig wiedergegeben.'
  naturalness: „Besser ist, wer …, als wer …“ ist eine natürliche, knappe deutsche Spruchform. „An Einsicht Mangel haben“, „reich an Klugheit sein“ und „das Gesetz übertreten“ sind modernes Standarddeutsch in angemessen gehobenem Weisheitsregister.
  terminology: „Einsicht“ für σύνεσις und „Klugheit“ für φρόνησις differenzieren die griechischen Begriffe sinnvoll. „Gesetz“ für νόμος und „übertritt“ für παραβαίνων bewahren den rechtlich-ethischen Sinn. Die nicht näher bestimmte Furcht wird nicht unzulässig zu Gottesfurcht erweitert.
