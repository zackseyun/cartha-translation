  text: And if he is prevented from sinning by lack of strength[b][a], when he finds an opportunity he will do evil.
translation:
  language: de
  text: Und wenn er aus Mangel an Kraft daran gehindert wird zu sündigen, wird er Böses tun, sobald sich ihm eine Gelegenheit bietet.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „wenn er eine geeignete Zeit findet“. Gemeint ist eine günstige Gelegenheit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Und
  rationale: Bewahrt den einfachen Anschluss an den vorausgehenden Gedanken, ohne einen nicht ausdrücklich markierten Gegensatz einzutragen.
- source_word: ἐὰν ὑπὸ ἐλαττώματος ἰσχύος κωλυθῇ ἁμαρτεῖν
  choice: wenn er aus Mangel an Kraft daran gehindert wird zu sündigen
  rationale: Gibt die Bedingung, den kausalen Grund und das passive κωλυθῇ eng am Griechischen wieder. „Kraft“ lässt offen, ob körperliches Vermögen oder Fähigkeit im weiteren Sinn gemeint ist.
- source_word: ἐὰν εὕρῃ καιρόν
  choice: sobald sich ihm eine Gelegenheit bietet
  rationale: καιρός bezeichnet hier einen günstigen beziehungsweise geeigneten Zeitpunkt. Die idiomatische deutsche Formulierung wahrt den Sinn einer sich eröffnenden Gelegenheit; die Wiederholung von ἐάν hat hier zeitlich-konditionalen Wert.
- source_word: κακοποιήσει
  choice: wird er Böses tun
  rationale: Gibt das Futur und die breite Bedeutung von κακοποιέω wieder, ohne die Aussage auf Schädigung anderer oder eine bestimmte böse Tat zu verengen.
theological_decisions:
- issue: Wesen der Hinderung am Sündigen
  choice: Die Person wird durch mangelnde Kraft oder Fähigkeit am Sündigen gehindert, nicht ausdrücklich durch eine innere Umkehr.
  alternative: „Kraftlosigkeit“ könnte enger als körperliche Schwäche oder weiter als allgemeines Unvermögen verstanden werden.
  rationale: ἐλάττωμα ἰσχύος bezeichnet einen Mangel an Kraft beziehungsweise Vermögen. Die Übersetzung wahrt diese Spannweite und lässt die folgende Aussage erkennen, dass die äußere oder situative Hinderung keine sittliche Bewährung beweist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz bleibt nah an der griechischen Struktur, wird jedoch im zweiten Glied idiomatisch formuliert. Die echte Bedeutungsbreite von ἰσχύς wird nicht auf körperliche Stärke festgelegt.
