  text: Rebuke your neighbor before you threaten[a], and give place to the law of the Most High.
translation:
  language: de
  text: Weise deinen Nächsten zurecht, bevor du ihm drohst, und gib dem Gesetz des Höchsten Raum.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Gib dem Gesetz des Höchsten einen Ort.“ Gemeint sein kann auch: Lass es zur Geltung oder zum Zug kommen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγξον
  choice: Weise … zurecht
  rationale: Der Imperativ bezeichnet eine direkte Zurechtweisung beziehungsweise das Aufzeigen eines Fehlers. „Zurechtweisen“ wahrt den moralischen Ernst, ohne unnötig schroff zu klingen.
- source_word: τὸν πλησίον σου
  choice: deinen Nächsten
  rationale: πλησίον bezeichnet im ethischen Zusammenhang den Mitmenschen oder Nächsten. „Deinen Nächsten“ ist im Deutschen klar und in biblischer Weisheitsrede vertraut.
- source_word: πρὶν ἢ
  choice: bevor
  rationale: 'Die Wendung gibt eine zeitliche Reihenfolge an: Zuerst soll die Zurechtweisung erfolgen, ehe es zu einer Drohung kommt.'
- source_word: ἀπειλῆσαι
  choice: du ihm drohst
  rationale: Das Verb bedeutet gewöhnlich „drohen“. Das im Griechischen nicht wiederholte Objekt wird im Deutschen durch „ihm“ natürlich auf den Nächsten bezogen.
- source_word: δὸς τόπον
  choice: gib … Raum
  rationale: Die bildhafte Wendung bedeutet wörtlich, jemandem oder etwas Raum beziehungsweise einen Platz zu geben. Die deutsche Formulierung bewahrt das Bild und lässt offen, ob Unterordnung, Geltung oder freier Lauf gemeint ist.
- source_word: νόμῳ
  choice: dem Gesetz
  rationale: νόμος bezeichnet hier am ehesten das göttliche Gesetz beziehungsweise die verbindliche Weisung Gottes. Der bestimmte Sinn ergibt sich aus der Verbindung mit dem Höchsten.
- source_word: Ὑψίστου
  choice: des Höchsten
  rationale: „Der Höchste“ ist die geläufige und ehrfurchtsvolle deutsche Wiedergabe dieses jüdisch-griechischen Gottestitels.
theological_decisions:
- issue: Bedeutung von δὸς τόπον νόμῳ Ὑψίστου
  choice: Aufforderung, dem Gesetz des Höchsten Raum und bestimmende Geltung zu geben
  alternative: Das Gesetz des Höchsten seinen Lauf nehmen lassen oder die eigene Reaktion ihm unterordnen
  rationale: Die griechische Wendung bleibt in ihrer genauen Stoßrichtung offen. Der Haupttext bewahrt deshalb die Raummetapher, statt eindeutig festzulegen, ob das Gesetz als leitende Norm anerkannt oder sein Vollzug abgewartet werden soll.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt knapp und spruchhaft; „zurechtweisen“, „der Nächste“ und „der Höchste“ sind verständlich und zugleich dem Weisheitsstil angemessen.
