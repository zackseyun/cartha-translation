  text: Reprove a friend[a], lest perhaps he did not say it; and if he did say it, so that he may not repeat it.
translation:
  language: de
  text: 'Stell deinen Freund zur Rede[a]: Vielleicht hat er es gar nicht gesagt; hat er es aber gesagt, dann damit er es nicht wiederholt.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Weise deinen Freund zurecht.“ Das griechische Verb kann sowohl ein prüfendes Zur-Rede-Stellen als auch eine zurechtweisende oder überführende Bedeutung haben. Der folgende Satzteil legt nahe, den Sachverhalt zunächst zu klären.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔλεγξον
  choice: Stell … zur Rede
  rationale: ἐλέγχω kann je nach Zusammenhang prüfen, befragen, überführen oder zurechtweisen bedeuten. Die folgende Möglichkeit, dass der Freund die Äußerung gar nicht getan hat, verlangt zunächst eine klärende Konfrontation. „Zur Rede stellen“ wahrt sowohl den untersuchenden als auch den korrigierenden Zug.
- source_word: τὸν φίλον
  choice: deinen Freund
  rationale: Der Artikel bezeichnet in der sprichwörtlichen Anweisung den Freund, um den es jeweils geht. Im Deutschen ist das possessive „deinen Freund“ hier natürlicher als „den Freund“ und konkretisiert lediglich die vorausgesetzte Beziehung.
- source_word: μή ποτε οὐκ εἶπεν
  choice: vielleicht hat er es gar nicht gesagt
  rationale: μή ποτε führt hier die vorsichtig zu bedenkende Möglichkeit ein, dass die berichtete Äußerung nicht gefallen ist. „Gar nicht“ gibt die verneinte Aussage im natürlichen Deutschen nachdrücklich wieder, ohne ihren Inhalt zu ergänzen.
- source_word: καὶ εἰ εἴρηκεν
  choice: und wenn er es gesagt hat
  rationale: Das griechische Perfekt wird mit dem deutschen Perfekt formnah und idiomatisch wiedergegeben. Das ergänzte „es“ nimmt den im Kontext vorausgesetzten Inhalt der Äußerung auf.
- source_word: ἵνα μὴ δευτερώσῃ
  choice: dann damit er es nicht wiederholt
  rationale: δευτερόω bedeutet, etwas ein zweites Mal zu tun. Da unmittelbar vom Sagen die Rede ist, gibt „wiederholt“ den gemeinten erneuten Ausspruch knapp und natürlich wieder.
