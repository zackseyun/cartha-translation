translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Gedankenstrich gliedert die Klärung und den anschließenden Zweck der Konfrontation. Die Formulierung bewahrt die Mehrdeutigkeit von ἐλέγχω, ohne den Freund vor der Prüfung bereits für schuldig zu erklären.
