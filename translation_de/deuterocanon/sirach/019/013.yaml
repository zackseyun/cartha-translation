  verdict: revise
  source_fidelity: Der Entwurf gibt die Satzfolge und den konditionalen Gedankengang des Griechischen grundsätzlich zuverlässig wieder. „Stell deinen Freund zur Rede“ kann ἔλεγξον im Kontext einer zunächst klärenden Konfrontation vertreten. Die finale Wendung ist jedoch mit „dann damit“ syntaktisch unnötig holprig; eine Umstellung macht den vom Imperativ abhängigen Zweck klarer, ohne die Aussage zu verändern.
  naturalness: Modernes Standarddeutsch ist weitgehend erreicht. Ein Doppelpunkt nach der Aufforderung und die Gegenüberstellung „hat er es aber gesagt“ bilden den griechischen Gedankenfluss natürlicher nach. Die Fußnote benötigt zudem eine idiomatischere Formulierung.
  terminology: „Freund“ und „wiederholt“ sind angemessen. Die Fußnote wahrt zu Recht die lexikalische Spannweite von ἐλέγχω, ohne eine Schuld des Freundes vorauszusetzen. „Überführen“ sollte dort nicht als substantivisch missglückte Formulierung stehen.
