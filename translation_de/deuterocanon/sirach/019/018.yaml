  yaml_path: translation/deuterocanon/sirach/019/018.yaml
  text: And the knowledge of evil is not wisdom[a], and where the counsel of sinners is, there is no understanding.
translation:
  language: de
  text: Und die Kenntnis des Bösen ist keine Weisheit,[a] und wo der Rat der Sünder ist, da ist keine Einsicht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „In der Kenntnis der Bosheit liegt keine Weisheit.“ Im Griechischen werden „Weisheit“ (σοφία), „Kenntnis“ (ἐπιστήμη) und „Einsicht“ (φρόνησις) einander gegenübergestellt.'
    reason: Die alternative Formulierung verdeutlicht eine mögliche Auffassung der Genitivverbindung und macht den beabsichtigten Unterschied der drei Erkenntnisbegriffe sichtbar.
lexical_decisions:
- source_word: σοφία
  choice: Weisheit
  rationale: Die übliche und sachlich passende Wiedergabe in der Weisheitsliteratur; sie bezeichnet hier echte, auch sittlich bestimmte Weisheit.
- source_word: πονηρίας
  choice: des Bösen
  rationale: Der substantivierte Ausdruck gibt die moralische Weite von πονηρία wieder und lässt sowohl Böses als Gegenstand als auch böse Praxis anklingen.
- source_word: ἐπιστήμη
  choice: Kenntnis
  rationale: „Kenntnis“ bewahrt den Unterschied zu σοφία („Weisheit“) und φρόνησις („Einsicht“) und kann sowohl Wissen als auch Vertrautheit bezeichnen.
- source_word: βουλή
  choice: Rat
  rationale: „Rat“ kann Beratung, Ratschlag oder Vorhaben bezeichnen und erhält damit die Bedeutungsbreite des griechischen Wortes.
- source_word: ἁμαρτωλῶν
  choice: der Sünder
  rationale: Die Genitivverbindung wird direkt wiedergegeben; „Sünder“ ist die klare biblische Bezeichnung für Menschen, deren Handeln von Sünde geprägt ist.
- source_word: φρόνησις
  choice: Einsicht
  rationale: „Einsicht“ bezeichnet verständiges, praktisch-sittliches Urteilsvermögen und bleibt von „Weisheit“ und „Kenntnis“ lexikalisch unterschieden.
- source_word: οὐκ ἔστιν ὅπου
  choice: wo … ist, da ist keine
  rationale: Die deutsche Korrelativkonstruktion erhält die ausdrücklich örtlich formulierte griechische Struktur in natürlicher Form.
theological_decisions:
- issue: Ob sittlich verwerfliche Klugheit als eine Form von Weisheit gelten kann
  choice: Die Kenntnis des Bösen wird ausdrücklich nicht als Weisheit anerkannt; ebenso wird dem Rat der Sünder echte Einsicht abgesprochen.
  alternative: Der Satz könnte lediglich einen begrifflichen Unterschied zwischen Kenntnis des Bösen und Weisheit feststellen, ohne der bösen Klugheit jeden positiven Wert abzusprechen.
  rationale: Das zweimalige οὐκ ἔστιν formuliert eine nachdrückliche Verneinung. Die Übersetzung wahrt diese sittliche Wertung, ohne weitergehende Lehrbegriffe einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst knapper, paralleler Satzstruktur. „Rat der Sünder“ bewahrt den weisheitlichen Ton und die Mehrdeutigkeit zwischen Ratschlag, Beratung und Vorhaben.
