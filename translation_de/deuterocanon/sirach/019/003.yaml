  text: Rot and worms will inherit him, and a bold soul will be taken away.
translation:
  language: de
  text: Fäulnis und Würmer werden ihn erben, und eine verwegene Seele wird hinweggenommen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σήπη
  choice: Fäulnis
  rationale: Gibt den körperlichen Verfall konkret und in natürlichem Deutsch wieder.
- source_word: κληρονομήσουσιν αὐτόν
  choice: werden ihn als Erbe erhalten
  rationale: Bewahrt das auffällige Erbmotiv des griechischen Verbs, statt es zu einem bloßen Befallen oder Verzehren abzuschwächen.
- source_word: ψυχὴ τολμηρά
  choice: eine verwegene Seele
  rationale: τολμηρός kann Kühnheit wie auch vermessene Rücksichtslosigkeit bezeichnen. „Verwegen“ erhält diese wertende Schwebe im warnenden Zusammenhang.
- source_word: ἐξαρθήσεται
  choice: wird hinweggenommen
  rationale: Entspricht dem passiven Futur und lässt offen, ob Tod, Beseitigung oder Gericht im Vordergrund steht.
theological_decisions:
- issue: Bewertung von ψυχὴ τολμηρά
  choice: eine verwegene Seele
  alternative: eine kühne Seele / eine rücksichtslose Seele
  rationale: Der griechische Ausdruck ist grundsätzlich mehrdeutig; der negative Kontext legt eine warnende Färbung nahe, ohne eindeutig reine Rücksichtslosigkeit zu bezeichnen.
- issue: Sinn von ἐξαρθήσεται
  choice: wird hinweggenommen
  alternative: wird beseitigt / wird fortgerafft
  rationale: Die zurückhaltende Formulierung wahrt die Unbestimmtheit des griechischen Passivs und legt weder die genaue Todesart noch einen ausdrücklich genannten Handelnden fest.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die drastische Bildsprache und die auffällige Erbmetapher des Griechischen bleiben erhalten; die Zweideutigkeit von τολμηρά wird nicht einseitig aufgelöst.
