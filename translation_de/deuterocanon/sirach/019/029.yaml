  text: From appearance a man is recognized[a], and from the expression of the face one who has understanding is recognized.
translation:
  language: de
  text: Am Aussehen erkennt man einen Mann, und am Gesichtsausdruck einen Verständigen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Wendung lautet wörtlich etwa: »an der Begegnung des Gesichts«. Sie kann die Miene oder das Auftreten eines Menschen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁράσεως
  choice: Aussehen
  rationale: In der Verbindung ἀπὸ ὁράσεως bezeichnet das Wort den sichtbaren äußeren Eindruck, nicht den Vorgang des Sehens.
- source_word: ἐπιγνωσθήσεται
  choice: erkennt man
  rationale: Das griechische Futur Passiv drückt in der sprichwörtlichen Aussage Erkennbarkeit aus. Die unpersönliche deutsche Formulierung ist natürlich und bewahrt den Bezug auf äußere Merkmale.
- source_word: ἀνήρ
  choice: einen Mann
  rationale: Die Wiedergabe erhält die maskuline Singularform und den sprichwörtlichen Charakter des griechischen Textes.
- source_word: ἀπαντήσεως προσώπου
  choice: an seinem Gesichtsausdruck
  rationale: Die ungewöhnliche Wendung bezeichnet wahrscheinlich den Eindruck, der einem im Gesicht begegnet, also Gesichtsausdruck oder Miene; das Possessivpronomen macht den Bezug im Deutschen deutlich.
- source_word: νοήμων
  choice: einen Verständigen
  rationale: Das substantivierte Adjektiv bezeichnet einen Menschen mit Einsicht und Urteilsvermögen; „Verständiger“ passt zum würdevollen Ton der Weisheitsliteratur.
theological_decisions: []
translation_notes:
  register: Knappes, parallel gebautes Weisheitswort in modernem Standarddeutsch. Das sprichwörtliche Präsens gibt das griechische Futur idiomatisch wieder; die schwer deutbare zweite Präpositionalwendung wird im Haupttext verständlich, in der Fußnote jedoch in ihrer Bildlichkeit und Mehrdeutigkeit offengehalten.
