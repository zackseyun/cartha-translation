translation:
  language: de
  text: Wein und Frauen machen das Herz leichtsinnig[a], und eine verwegene Seele richtet ihren Besitzer zugrunde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Griechisch: „Wein und Frauen bringen Verständige vom rechten Weg ab; und wer sich an Prostituierte hängt, wird noch verwegener.“ Der hebräische Text weicht in der zweiten Zeile erheblich davon ab.'
    reason: alternative_reading
lexical_decisions:
- source_word: יַיִן
  choice: Wein
  rationale: Die konkrete Bezeichnung wird unmittelbar und ohne Abschwächung wiedergegeben.
- source_word: נָשִׁים
  choice: Frauen
  rationale: Der hebräische Plural bezeichnet allgemein Frauen; der Haupttext schränkt ihn weder auf Ehefrauen noch auf Prostituierte ein.
- source_word: יַפְחִיזוּ
  choice: machen … leichtsinnig
  rationale: Das Verb bezeichnet ein Leichtsinnig-, Unbesonnen- oder Wankendmachen. Die gewählte Formulierung ist im Deutschen natürlich und bewahrt den ursächlichen Sinn des hebräischen Verbs.
- source_word: לֵב
  choice: Herz
  rationale: Das Herz ist im Hebräischen Sitz des Denkens, Wollens und Begehrens. Die konkrete Metapher bleibt erhalten.
- source_word: נֶפֶשׁ
  choice: Seele
  rationale: נֶפֶשׁ bezeichnet hier das belebte Selbst beziehungsweise die Person. „Seele“ erhält die hebräische Ausdrucksweise, ohne sie im Haupttext näher zu systematisieren.
- source_word: עָזָה
  choice: verwegen
  rationale: Das Adjektiv drückt Stärke beziehungsweise Kühnheit aus, hier mit moralisch negativer Färbung. „Verwegen“ lässt sowohl Dreistigkeit als auch riskante Unbesonnenheit anklingen.
- source_word: תַשְׁחִית
  choice: richtet … zugrunde
  rationale: Die Wendung gibt die starke Bedeutung „vernichten, verderben“ idiomatisch und mit dem nötigen Ernst wieder.
- source_word: בְעָלֶיהָ
  choice: ihren Besitzer
  rationale: Wörtlich ist derjenige gemeint, dem die feminin bezeichnete נֶפֶשׁ gehört. Die ungewöhnliche Besitzmetapher wird bewahrt.
theological_decisions:
- issue: Vorrang des erhaltenen hebräischen Textes gegenüber der deutlich abweichenden griechischen Fassung
  choice: Der Haupttext folgt beiden Zeilen des erhaltenen Hebräischen.
  alternative: „Wein und Frauen bringen Verständige vom rechten Weg ab; und wer sich an Prostituierte hängt, wird immer verwegener.“
  rationale: Wo ein belastbarer hebräischer Zeuge erhalten ist, bildet er die Grundlage. Die griechische zweite Zeile bietet eine wesentlich andere Aussage und wird deshalb nicht harmonisierend in den Haupttext eingetragen, sondern vollständig in der Fußnote dokumentiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Parallelstruktur und die hebräischen Bilder „Herz“, „Seele“ und „Besitzer“ bleiben erhalten; die sprachlich ungewöhnliche zweite Zeile wird nicht erklärend geglättet.
