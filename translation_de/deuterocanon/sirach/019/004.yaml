base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/019/004.yaml
  text: He who trusts too quickly is light of heart[a], and he who sins against his own soul will go astray.
translation:
  language: de
  text: Wer vorschnell vertraut, ist leichtsinnig, und wer sündigt, wird seiner eigenen Seele Unrecht tun[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »gegen sich selbst« oder »zu seinem eigenen Schaden«; griechisch: »gegen seine eigene Seele«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ταχὺ
  choice: vorschnell
  rationale: Das Adverb bedeutet wörtlich »schnell«; im mahnenden Spruch bringt »vorschnell« die negative Wertung knapp und natürlich zum Ausdruck.
- source_word: ἐμπιστεύων
  choice: vertraut
  rationale: Das Verb bezeichnet das Schenken von Vertrauen; »vertraut« ist im Deutschen klar und idiomatisch.
- source_word: κοῦφος καρδίᾳ
  choice: leichtsinnig
  rationale: Die Wendung bedeutet wörtlich etwa »leicht im Herzen«. Da »leichten Herzens« im Deutschen etwas anderes bezeichnet, gibt »leichtsinnig« die gemeinte innere Unbeständigkeit verständlich wieder.
- source_word: ἁμαρτάνων
  choice: sündigt
  rationale: »Sündigt« bewahrt den üblichen moralisch-theologischen Gehalt des Verbs, ohne ihn abzuschwächen.
- source_word: εἰς ψυχὴν αὐτοῦ
  choice: gegen seine eigene Seele
  rationale: Die Formulierung hält sich eng an das Griechische und bewahrt ψυχή als anthropologisch gewichtigen Begriff; mögliche Bedeutungen wie »gegen sich selbst« oder »zu seinem eigenen Schaden« werden in der Fußnote genannt.
- source_word: πλημμελήσει
  choice: wird fehlgehen
  rationale: Das Verb kann einen Fehltritt, ein Verfehlen oder falsches Handeln bezeichnen. »Wird fehlgehen« bewahrt den zukünftigen und moralischen Sinn, ohne eine präzisere Folge einzutragen, als der Text nennt.
theological_decisions:
- issue: Bedeutungsumfang von ψυχή
  choice: Seele
  alternative: selbst; Leben
  rationale: »Seele« wahrt die griechische Ausdrucksweise und ihre moralisch-anthropologische Spannung. Da ψυχή hier auch die eigene Person oder das eigene Leben bezeichnen kann, wird diese Offenheit in einer Fußnote erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Vorschnell« und »leichtsinnig« ergeben einen natürlichen Weisheitsspruch; die ungewöhnlichere Rede von der eigenen Seele bleibt bewusst im Haupttext erhalten.
