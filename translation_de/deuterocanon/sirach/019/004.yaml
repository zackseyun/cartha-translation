  source_fidelity: 'Die Grundentscheidungen zu ταχὺ, ἐμπιστεύων, κοῦφος καρδίᾳ und ἁμαρτάνων sind sachgerecht. Im zweiten Satzteil sollte εἰς ψυχὴν αὐτοῦ jedoch syntaktisch mit πλημμελήσει verbunden werden: Der Sünder tut seiner eigenen Seele Unrecht. »wird fehlgehen« ist für πλημμελήσει im modernen Deutsch zudem unidiomatisch und kann fälschlich ein Sich-Verirren nahelegen.'
