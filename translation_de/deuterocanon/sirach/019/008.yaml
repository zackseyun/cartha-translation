  text: Denn er hat dich gehört und dich beobachtet[a]; zur gegebenen Zeit wird er dich hassen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dich bewacht“ oder „auf dich achtgegeben“. Das griechische Verb kann bewachen, bewahren oder beobachten bedeuten. Die mittlere Form kann zudem eine Nuance von Vorsicht ausdrücken: Er hat sich möglicherweise vor dir in Acht genommen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκήκοεν
  choice: hat gehört
  rationale: Das Perfekt bezeichnet ein geschehenes Hören mit fortwirkender Bedeutung; das deutsche Perfekt gibt dies im natürlichen Gegenwartsdeutsch angemessen wieder.
- source_word: γάρ
  choice: denn
  rationale: Die Konjunktion begründet die vorausgehende Mahnung und wird mit dem knappen, erklärenden „denn“ wiedergegeben.
- source_word: σου
  choice: dich
  rationale: Beim griechischen Verb ἀκούω steht die gehörte Person hier im Genitiv; im Deutschen verlangt „hören“ den Akkusativ.
- source_word: ἐφυλάξατό σε
  choice: sich vor dir gehütet
  rationale: Die mediale Form kann ausdrücken, dass jemand sich in Bezug auf eine andere Person in Acht nimmt. Der folgende angekündigte Hass stützt hier die warnende, nicht die beschützende Lesart; die weitere Bedeutungsbreite wird in der Fußnote offengehalten.
- source_word: ἐν καιρῷ
  choice: wenn die Zeit kommt
  rationale: Die Wendung bezeichnet einen künftigen oder passenden Zeitpunkt. Die idiomatische Formulierung vermeidet das im Deutschen missverständliche „mit der Zeit“, das eher eine allmähliche Entwicklung nahelegen würde.
- source_word: μισήσει σε
  choice: wird er dich hassen
  rationale: Das Futur und die ungemilderte Grundbedeutung von μισέω werden direkt wiedergegeben.
