translation:
  language: de
  text: Wer dies tut, wird nicht reich; wer das Wenige verachtet, wird zugrunde gehen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Überlieferung lautet sinngemäß: „Ein trunksüchtiger Arbeiter wird nicht reich; wer das Wenige verachtet, wird nach und nach zu Fall kommen.“'
    reason: Die griechische Parallele präzisiert den im Hebräischen offenen Ausdruck „dies“ und bietet im zweiten Satzteil eine abweichende Nuance.
lexical_decisions:
- source_word: פּוֹעֵל זֹאת
  choice: Wer dies tut
  rationale: פּוֹעֵל wird als substantiviertes Partizip von פעל („tun, handeln“) verstanden. „Dies“ bewahrt den rückverweisenden, im Einzelvers offenen Bezug von זֹאת, ohne die griechische Präzisierung in den hebräischen Haupttext einzutragen.
- source_word: לֹא יַעֲשִׁיר
  choice: wird nicht reich
  rationale: Gibt die kausative Form von עשר idiomatisch und knapp wieder.
- source_word: וְבוֹזֶה מְעוּטִים
  choice: wer das Wenige verachtet
  rationale: מְעוּטִים bezeichnet geringe Dinge beziehungsweise kleine Beträge. „Das Wenige“ lässt sowohl Besitzmengen als auch vermeintlich unbedeutende Einzelheiten zu.
- source_word: יִתְעַרְעָר
  choice: wird verarmen
  rationale: Die Form bezeichnet hier voraussichtlich das Verarmen beziehungsweise den wirtschaftlichen Ruin. Die Wiedergabe passt zum Gegensatz mit „reich werden“ und wahrt die Konsequenz des hebräischen Satzes.
theological_decisions:
- issue: Bezug von „dies“ im ersten Halbvers
  choice: Die offene Rückverweisung des Hebräischen bleibt im Haupttext erhalten.
  alternative: Nach der griechischen Parallele ausdrücklich „Ein trunksüchtiger Arbeiter“ übersetzen.
  rationale: Die vorgelegte hebräische Lesart nennt Trunkenheit nicht ausdrücklich. Die griechische Parallele dient als wichtiger Textzeuge, soll aber eine vorhandene, verständliche hebräische Lesart nicht stillschweigend ersetzen.
- issue: Art der angedrohten Folge
  choice: wirtschaftliche Verarmung
  alternative: allgemeiner Untergang oder allmähliches Fallen
  rationale: Der unmittelbare Gegensatz zu „reich werden“ stützt die wirtschaftliche Bedeutung; die abweichende Nuance der griechischen Parallele wird in der Fußnote sichtbar gemacht.
translation_notes:
  register: Modernes, knappes und sprichwortartiges Standarddeutsch. Das Semikolon bildet den Parallelismus des hebräischen Verses ab; die Formulierung bleibt würdevoll und allgemein verständlich.
