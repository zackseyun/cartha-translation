base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/019/028.yaml
  text: And if he is prevented from sinning by lack of strength[a], when he finds an opportunity, he will do evil.
translation:
  language: de
  text: Und wenn er wegen eines Mangels an Kraft daran gehindert wird zu sündigen, wird er, wenn er eine Gelegenheit findet, Böses tun[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Schaden zufügen“; das griechische Verb kann allgemein bedeuten, Böses zu tun, oder spezieller, anderen zu schaden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλαττώματος
  choice: Mangel
  rationale: Das Substantiv bezeichnet hier eine unzureichende Ausstattung beziehungsweise ein Fehlen; zusammen mit ἰσχύος ist „Mangel an Kraft“ im Deutschen natürlich und vermeidet eine moralische Deutung des Mangels.
- source_word: ἰσχύος
  choice: Kraft
  rationale: ἰσχύς bezeichnet Kraft oder Fähigkeit. „Kraft“ bewahrt die Aussage, dass nicht Tugend, sondern fehlendes Vermögen die Person am Sündigen hindert.
- source_word: κωλυθῇ
  choice: daran gehindert wird
  rationale: Die passive Form bezeichnet ein Hindernis, das die Tat verhindert. „Daran gehindert wird“ gibt die Konstruktion mit dem folgenden Infinitiv idiomatisch wieder.
- source_word: ἁμαρτεῖν
  choice: zu sündigen
  rationale: Der Infinitiv benennt ausdrücklich Sünde; „zu sündigen“ erhält diese moralische Kategorie und hängt natürlich von „daran gehindert wird“ ab.
- source_word: καιρόν
  choice: eine Gelegenheit
  rationale: καιρός meint hier einen geeigneten Zeitpunkt beziehungsweise eine günstige Gelegenheit, nicht bloß Zeit im Allgemeinen.
- source_word: κακοποιήσει
  choice: wird er Böses tun
  rationale: Das Verb kann allgemein böses Handeln oder konkreter das Zufügen von Schaden bezeichnen. „Böses tun“ bewahrt die breite moralische Bedeutung; die engere Möglichkeit wird in der Fußnote genannt.
theological_decisions:
- issue: Moralische Aussage des Verses
  choice: Fehlende Fähigkeit zu sündigen ist nicht mit Gerechtigkeit gleichzusetzen; bei gegebener Gelegenheit wird die betreffende Person böse handeln.
  alternative: Das abschließende Verb kann enger auf das Schädigen anderer bezogen werden.
  rationale: 'Die Verbindung von ἁμαρτεῖν und κακοποιήσει ergibt eine allgemeine moralische Diagnose: Äußere Unfähigkeit ist keine Tugend. Die Übersetzung hält diese Aussage fest, ohne die mögliche Bedeutung des konkreten Schädigens auszuschließen.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt eng am griechischen Bedingungsgefüge, während „sobald“ den zweiten ἐάν-Satz als eintretende Gelegenheit natürlich wiedergibt.
