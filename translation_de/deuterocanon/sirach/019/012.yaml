translation:
  language: de
  text: 'Stell einen Freund zur Rede[a]: Vielleicht hat er es nicht getan. Hat er aber etwas getan, soll er nichts weiter hinzufügen.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Weise einen Freund zurecht“. Das griechische Verb kann sowohl ein prüfendes Zur-Rede-Stellen als auch ein Tadeln oder Zurechtweisen bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Das griechische Verb bedeutet wörtlich „hinzufügen“; sein Objekt bleibt offen. Gemeint sein kann auch: „damit er es nicht wieder tut“ oder „damit er nicht noch weitergeht“.'
    reason: semantic_ambiguity
lexical_decisions:
- source_word: Ἔλεγξον
  choice: Stell … zur Rede
  rationale: Das Verb kann prüfen, überführen, tadeln oder zurechtweisen bedeuten. Weil zunächst offenbleibt, ob der Freund die Tat überhaupt begangen hat, gibt „zur Rede stellen“ den prüfenden und zugleich konfrontierenden Sinn wieder, ohne eine Schuld vorwegzunehmen.
- source_word: φίλον
  choice: einen Freund
  rationale: Der artikellose Singular hat hier allgemeinen, sprichwortartigen Sinn; „einen Freund“ ist dafür die natürliche deutsche Form.
- source_word: μή ποτε οὐκ ἐποίησεν
  choice: vielleicht hat er es nicht getan
  rationale: μή ποτε bezeichnet hier eine vorsichtig erwogene Möglichkeit. Das im Griechischen unausgesprochene Objekt wird im Deutschen mit „es“ aufgenommen.
- source_word: καὶ εἴ τι ἐποίησεν
  choice: und wenn er etwas getan hat
  rationale: τι bleibt unbestimmt und wird daher mit „etwas“ wiedergegeben. Das Perfekt ist im heutigen Deutsch für eine vergangene Tat mit gegenwärtiger Bedeutung idiomatisch.
- source_word: μή ποτε προσθῇ
  choice: damit er nichts mehr hinzufügt
  rationale: προστίθημι bedeutet wörtlich „hinzufügen“ und kann in diesem Zusammenhang das Fortsetzen, Wiederholen oder Steigern der Tat bezeichnen. Die Formulierung bewahrt das Bild und die inhaltliche Offenheit.
