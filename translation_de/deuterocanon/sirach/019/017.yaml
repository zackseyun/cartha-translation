translation:
  language: de
  text: Alle Weisheit ist Furcht vor dem Herrn[a], und zu aller Weisheit gehört das Befolgen des Gesetzes[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ehrfurcht vor dem Herrn“. Das griechische Wort umfasst auch ehrfürchtige Scheu; im Haupttext bleibt die stärkere Formulierung erhalten.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „und in aller Weisheit ist das Tun des Gesetzes“.'
    reason: alternative_reading
lexical_decisions:
- source_word: Πᾶσα σοφία
  choice: Alle Weisheit
  rationale: Die umfassende Aussage des Griechischen wird bewahrt. „Alle Weisheit“ klingt im Deutschen natürlicher als „Jede Weisheit“ und bezeichnet Weisheit in ihrer Gesamtheit.
- source_word: φόβος Κυρίου
  choice: Furcht vor dem Herrn
  rationale: Die feste weisheitliche Wendung behält die starke Bedeutung von φόβος bei; die deutsche Präposition „vor“ ist idiomatisch. „Herr“ gibt Κυρίου entsprechend der griechischen Vorlage wieder.
- source_word: ἐν πάσῃ σοφίᾳ
  choice: zu aller Weisheit gehört
  rationale: Die griechische Konstruktion wird im Deutschen sinngemäß und klar wiedergegeben, ohne die Aussage auf eine bestimmte Art von Weisheit einzuengen.
- source_word: ποίησις νόμου
  choice: das Befolgen des Gesetzes
  rationale: ποίησις bezeichnet das tätige Tun beziehungsweise Ausführen. Im Zusammenhang mit νόμος bringt „Befolgen“ die praktische Umsetzung verständlich zum Ausdruck.
theological_decisions:
- issue: Wiedergabe von Κυρίου
  choice: dem Herrn
  alternative: dem HERRN
  rationale: Die unmittelbare Quelle bietet Κυρίου und nicht den hebräischen Gottesnamen. „Herr“ folgt daher der griechischen Form, ohne eine nicht ausdrücklich vorliegende Lesart einzutragen.
- issue: Bedeutungsumfang von φόβος
  choice: Furcht vor dem Herrn
  alternative: Ehrfurcht vor dem Herrn
  rationale: „Furcht“ bewahrt die Spannung zwischen Scheu, Ehrfurcht und tatsächlichem Fürchten. Eine Beschränkung auf „Ehrfurcht“ würde die kräftigere Seite des griechischen Ausdrucks abschwächen.
- issue: Verhältnis von Weisheit und Gesetzespraxis
  choice: zu aller Weisheit gehört das Befolgen des Gesetzes
  alternative: in aller Weisheit ist das Tun des Gesetzes
  rationale: Die Formulierung hält Gesetzespraxis und Weisheit eng zusammen, ohne genauer festzulegen, ob das Tun als Wesensgehalt, Kennzeichen oder Folge der Weisheit zu verstehen ist.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem weisheitlichem Ton. Die traditionelle Wendung „Furcht vor dem Herrn“ bleibt erhalten; die zweite Satzhälfte ist für natürliches Deutsch maßvoll idiomatisiert.
