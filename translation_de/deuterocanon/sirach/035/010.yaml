translation:
  language: de
  text: Erbarme dich des Volkes, das nach deinem Namen genannt ist[a] – Israel, den du deinen Erstgeborenen genannt hast.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »das deinen Namen trägt«. Die hebräische Wendung bezeichnet ein Volk, das Gott zugeordnet ist und ihm gehört.'
    reason: lexical_alternative
  - marker: b
    text: 'Der griechische Text bietet hier eine völlig andere Zeile: »Vor dem Donner eilt der Blitz, und vor dem Schamlosen geht Gunst her.« Die Übersetzung folgt dem erhaltenen hebräischen Text.'
    reason: textual_variant
lexical_decisions:
- source_word: רַחֵם עַל־עָם
  choice: Erbarme dich des Volkes
  rationale: Der Imperativ bittet um tätiges Erbarmen. Die deutsche Wendung mit Genitiv ist würdig, natürlich und bewahrt den kollektiven Singular »Volk«, ohne ein im Hebräischen nicht ausdrücklich vorhandenes Possessivpronomen hinzuzufügen.
- source_word: נִקְרָא בִּשְׁמֶךָ
  choice: das nach deinem Namen genannt ist
  rationale: Die Formulierung erhält das hebräische Zugehörigkeitsidiom und seine biblische Resonanz. Die flüssigere Deutung »das deinen Namen trägt« wird in der Fußnote genannt.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Der Eigenname steht als erläuternde Apposition zu »Volk«; der Gedankenstrich macht diese Beziehung im Deutschen klar.
- source_word: בְּכוֹר
  choice: deinen Erstgeborenen
  rationale: »Erstgeborener« bewahrt die familiäre und rangbezogene Metapher. Das Possessivpronomen ist im Deutschen als Bestandteil der Prädikativkonstruktion mit »nennen« natürlich und gibt die Beziehung zu dem angeredeten Gott wieder.
- source_word: כִּנִּיתָה
  choice: das du … genannt hast
  rationale: 'Die überlieferte Form gehört zu כנה, »benennen, bezeichnen, nennen«, nicht zu קנה, »erwerben«. Zusammen mit בְּכוֹר ergibt sich: Gott hat Israel als seinen Erstgeborenen bezeichnet.'
theological_decisions:
- issue: Bundeszugehörigkeit in נִקְרָא בִּשְׁמֶךָ
  choice: Das Idiom »nach deinem Namen genannt« bleibt im Haupttext erhalten.
  alternative: »das deinen Namen trägt« oder deutender »das dir gehört«
  rationale: Die wörtlich idiomatische Wiedergabe bewahrt die Aussage der Zugehörigkeit, ohne sie auf bloßen Besitz zu verengen.
- issue: Verhältnis von Israel und »Erstgeborener«
  choice: Israel wird als der von Gott so bezeichnete Erstgeborene wiedergegeben.
  alternative: »Israel, deinen Erstgeborenen« ohne ausdrückliches Verb
  rationale: Das hebräische כניתה enthält ausdrücklich den Gedanken des Benennens oder Bezeichnens. Die Übersetzung macht dies sichtbar und fügt nicht die aus einer anderen Konsonantenlesung stammende Vorstellung des Erwerbens ein.
- issue: Abweichende griechische Texttradition
  choice: Der erhaltene hebräische Wortlaut bestimmt den Haupttext.
  alternative: Die sachlich völlig andere griechische Zeile übersetzen
  rationale: Der griechische Paralleltext handelt von Blitz, Donner, Scham und Gunst und bezeugt daher an dieser Stelle eine erheblich abweichende Texttradition.
translation_notes:
  register: Modernes, würdiges Gebetsdeutsch. Der Haupttext folgt bewusst dem hebräischen כניתה (»du hast genannt/bezeichnet«); die im englischen Konsultationstext vorausgesetzte Bedeutung »du hast erworben« würde vielmehr קניתה entsprechen und wird deshalb nicht übernommen.
