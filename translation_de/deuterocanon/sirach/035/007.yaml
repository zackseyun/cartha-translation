  text: Hasten the end and attend to the appointed time[b][a], for who will tell you what you should do?
translation:
  language: de
  text: Beschleunige das Ende und achte auf den bestimmten Zeitpunkt; denn wer wird dir sagen, was du tun sollst?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Parallelüberlieferung lautet hier ganz anders: „Sprich, junger Mann, wenn man dich braucht; sprich kaum zweimal, wenn du gefragt wirst.“ Offenbar liegt ihr eine andere Textform oder Verszuordnung zugrunde; sie ist keine enge Übersetzung des erhaltenen hebräischen Textes.'
    reason: textual_variant
  - marker: b
    text: Das Hebräische „was du tun wirst“ kann auch mit „was zu tun ist“ wiedergegeben werden. „Was du tun sollst“ bringt die praktische Stoßrichtung der rhetorischen Frage zum Ausdruck.
    reason: lexical_alternative
lexical_decisions:
- source_word: החיש
  choice: Beschleunige
  rationale: Der Imperativ von חושׁ fordert zur Eile auf. „Beschleunige“ bewahrt die direkte Aufforderung und lässt קץ als folgendes Objekt stehen.
- source_word: קץ
  choice: das Ende
  rationale: קץ bezeichnet gewöhnlich ein Ende oder einen Abschluss. Die knappe, etwas rätselhafte Formulierung des Hebräischen bleibt erhalten.
- source_word: ופקוד
  choice: und achte auf
  rationale: פקד kann unter anderem aufsuchen, bestimmen, beachten oder sich einer Sache annehmen bedeuten. Zusammen mit מועד gibt „achte auf“ die aktive Beachtung des festgesetzten Zeitpunkts wieder, ohne die Bedeutung unnötig zu verengen.
- source_word: מועד
  choice: den festgesetzten Zeitpunkt
  rationale: מועד bezeichnet häufig eine bestimmte oder festgelegte Zeit. „Festgesetzter Zeitpunkt“ ist im Deutschen klar und wahrt diesen Sinn.
- source_word: כי
  choice: denn
  rationale: כי leitet hier die Begründung für die vorangehenden Aufforderungen ein.
- source_word: מי יאמר לך
  choice: wer wird dir sagen
  rationale: Die direkte Zukunftsfrage des Hebräischen wird beibehalten; zugleich bleibt ihr rhetorischer Charakter erkennbar.
- source_word: מה תעשה
  choice: was du tun sollst
  rationale: Wörtlich heißt es „was du tun wirst“. Im Zusammenhang zielt die Frage wahrscheinlich auf Anleitung zum Handeln; „was du tun sollst“ gibt diese praktische Aussage natürlich wieder, während die wörtlichere Möglichkeit in einer Fußnote erhalten bleibt.
theological_decisions:
- issue: Vorrang des erhaltenen hebräischen Textes gegenüber der stark abweichenden griechischen Parallelüberlieferung
  choice: Übersetzung nach dem erhaltenen hebräischen Text mit Hinweis auf die griechische Variante
  alternative: Eine griechisch begründete Fassung über einen jungen Mann, der nur sprechen soll, wenn er gefragt wird
  rationale: Der vorhandene hebräische Wortlaut ist hier die primäre Textgrundlage. Die griechische Überlieferung bietet keinen eng entsprechenden Text, sondern offenbar eine andere Textform oder Verszuordnung; deshalb bestimmt sie die Übersetzung nicht, wird aber transparent dokumentiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe und ungewöhnliche Wendung „Beschleunige das Ende“ bewahrt bewusst die Spannung und Rätselhaftigkeit des hebräischen Ausdrucks, statt sie deutend aufzulösen.
