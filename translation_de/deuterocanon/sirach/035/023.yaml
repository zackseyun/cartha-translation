  text: A woman’s beauty brightens the face[a], and it surpasses every delight of the eye.
translation:
  language: de
  text: Die Schönheit einer Frau lässt das Gesicht aufleuchten[a] und übertrifft alles, woran das Auge Freude hat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das Griechische bietet eine erheblich abweichende Lesart: „Bei jedem Werk vertraue deiner Seele; denn auch das bedeutet, die Gebote zu halten.“'
    reason: alternative_reading
lexical_decisions:
- source_word: תאר
  choice: Schönheit
  rationale: Das Substantiv bezeichnet Gestalt oder äußere Anmut. Im Zusammenhang mit einer Frau und der Wirkung auf das Gesicht gibt „Schönheit“ den Sinn natürlich und treffend wieder.
- source_word: יחליץ פנים
  choice: lässt das Gesicht aufleuchten
  rationale: Die schwierige Wendung beschreibt offenbar eine sichtbare, belebende Wirkung auf das Gesicht. „Lässt das Gesicht aufleuchten“ ist idiomatisches modernes Deutsch und wahrt den positiven Sinn, ohne die genaue Bildsprache übermäßig festzulegen.
- source_word: מחמד עין
  choice: alles, woran das Auge Freude hat
  rationale: Die Wendung bezeichnet etwas für das Auge Begehrenswertes oder Kostbares. Die gewählte Formulierung bewahrt sowohl den visuellen Bezug als auch den Gedanken des Gefallens.
- source_word: יגבר
  choice: übertrifft
  rationale: Das Verb bedeutet grundsätzlich „stark sein“ oder „die Oberhand gewinnen“. In diesem poetischen Vergleich drückt „übertrifft“ die gemeinte Überlegenheit klar und natürlich aus.
theological_decisions:
- issue: Starke Abweichung zwischen dem erhaltenen hebräischen Text und der griechischen Überlieferung
  choice: Der erhaltene hebräische Text bildet die Grundlage des Haupttextes; die erheblich abweichende griechische Lesart wird in einer Fußnote dokumentiert.
  alternative: 'Nach dem Griechischen: „Bei jedem Werk vertraue deiner Seele; denn auch das bedeutet, die Gebote zu halten.“'
  rationale: Wo für Jesus Sirach ein hebräischer Text erhalten ist, hat dieser als originalsprachliche Quelle Vorrang. Da das Griechische hier keine bloße Formulierungsvariante, sondern eine ganz andere Aussage bietet, darf die Abweichung nicht stillschweigend eingeebnet werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht poetischem Klang. Die schwierige hebräische Wendung יחליץ פנים wird verständlich wiedergegeben, ohne ihre Deutung unnötig zu verengen.
