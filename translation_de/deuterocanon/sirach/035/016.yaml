  text: And all the ends of the earth will know that you are the eternal God[a][b].
translation:
  language: de
  text: Und alle Enden der Erde werden erkennen, dass du der ewige Gott bist.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Überlieferung lautet: „Die den Herrn fürchten, werden ein Urteil finden, und sie werden gerechte Taten wie ein Licht entzünden.“ Der hebräische Textzeuge bewahrt hier eine wesentlich andere Zeile.'
    reason: textual_variant
  - marker: b
    text: 'Auch möglich: „der Gott der Ewigkeit“ oder „der immerwährende Gott“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וידעו
  choice: werden erkennen
  rationale: Das Qal Perfekt mit vorangestelltem Waw wird hier im poetisch-weisheitlichen Zusammenhang am besten als zukünftige beziehungsweise resultative Aussage verstanden. „Erkennen“ gibt die umfassende Einsicht und Anerkennung natürlicher wieder als bloßes „wissen“.
- source_word: כל אפסי ארץ
  choice: alle Enden der Erde
  rationale: Die hebräische Wendung bezeichnet die fernsten Bereiche der Welt. „Alle Enden der Erde“ ist im Deutschen verständlich, würdevoll und bleibt dem Bild des Ausgangstextes nahe.
- source_word: אלהי עולם
  choice: der ewige Gott
  rationale: Die hebräische Konstruktverbindung bedeutet wörtlich etwa „Gott der Ewigkeit“ beziehungsweise „Gott für immer“. „Der ewige Gott“ ist im modernen Deutschen natürlicher und bewahrt den Sinn, ohne die mögliche Nuance von עולם unerwähnt zu lassen.
- source_word: אתה
  choice: du ... bist
  rationale: Das ausdrücklich gesetzte Pronomen wird mit „du“ wiedergegeben; ein zusätzliches „allein“ wäre im Hebräischen nicht ausdrücklich vorhanden.
theological_decisions:
- issue: Verhältnis des hebräischen Textzeugen zur stark abweichenden griechischen Überlieferung
  choice: Der erhaltene hebräische Text bildet den Haupttext; die griechische Fassung wird in einer Fußnote dokumentiert.
  alternative: „Die den Herrn fürchten, werden ein Urteil finden, und sie werden gerechte Taten wie ein Licht entzünden.“
  rationale: Wo für Jesus Sirach ein belastbarer hebräischer Text erhalten ist, hat dieser Vorrang. Die griechische Zeile ist keine enge Entsprechung, sondern eine wesentlich andere Textüberlieferung und darf daher weder harmonisierend eingearbeitet noch verschwiegen werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die vertraute biblische Wendung „Enden der Erde“ bewahrt das hebräische Bild; „der ewige Gott“ vermeidet eine im Deutschen schwerfällige Konstruktionsnachbildung.
