  text: Setz ihn zur Arbeit ein, damit er nicht untätig ist,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔμβαλε
  choice: Setz … ein
  rationale: Der Aoristimperativ von ἐμβάλλω bedeutet wörtlich »hineinwerfen/hineinsetzen«. Zusammen mit εἰς ἐργασίαν bezeichnet er idiomatisch, jemanden einer Arbeit zuzuweisen. »Setz … ein« bewahrt den Aufforderungscharakter und klingt im Deutschen natürlich.
- source_word: αὐτὸν
  choice: ihn
  rationale: Das Akkusativpronomen im Maskulinum Singular verweist im Zusammenhang auf eine männliche Person.
- source_word: εἰς ἐργασίαν
  choice: zur Arbeit
  rationale: ἐργασία bezeichnet Arbeit, Tätigkeit oder Beschäftigung. Mit ἔμβαλε gibt »zur Arbeit einsetzen« die griechische Wendung prägnant und idiomatisch wieder.
- source_word: ἵνα
  choice: damit
  rationale: Die Konjunktion leitet hier einen Zwecksatz ein; »damit« bewahrt diese Funktion klar.
- source_word: μὴ ἀργῇ
  choice: er nicht untätig ist
  rationale: ἀργέω bedeutet untätig, unbeschäftigt oder müßig sein. »Untätig« vermeidet die stärkere moralische Wertung von »faul« und trifft den praktischen Sinn.
theological_decisions: []
