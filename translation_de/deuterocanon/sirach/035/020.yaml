translation:
  language: de
  text: Der Gaumen prüft die Geschmäcker der Rede,[a] und ein verständiges Herz erkennt die Geschmäcker der Lüge.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Der Gaumen prüft die Geschmäcker eines Wortes«. Das hebräische דָּבָר kann »Wort«, »Rede« oder »Sache« bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Das Hebräische wiederholt in beiden Vershälften das Bild des Geschmacks. Die griechische Parallelüberlieferung weicht hier erheblich ab: »Geh nicht auf einem Weg des Anstoßes, und stolpere nicht auf steinigem Gelände.« Die Übersetzung folgt dem erhaltenen hebräischen Text.'
    reason: textual_variant
lexical_decisions:
- source_word: חך
  choice: der Gaumen
  rationale: Bezeichnet wörtlich den Gaumen als Geschmacksorgan und bewahrt das konkrete Bild des hebräischen Spruchs.
- source_word: בוחן
  choice: prüft
  rationale: Gibt die prüfende Tätigkeit wieder und fügt sich natürlich in das Bild des Schmeckens.
- source_word: מטעמי
  choice: den Geschmack
  rationale: Bewahrt die in beiden Vershälften wiederholte Geschmacksmetapher; der Singular ist im Deutschen idiomatischer als »die Geschmäcker«.
- source_word: דבר
  choice: der Rede
  rationale: דבר kann Wort, Rede oder Sache bedeuten. Im Zusammenhang mit Lüge und unterscheidendem Verstehen bezeichnet »Rede« am ehesten sprachliche Äußerung, ohne die mögliche Weite des Ausdrucks ganz aufzuheben.
- source_word: לב מבין
  choice: ein verständiges Herz
  rationale: Bewahrt die hebräische Anthropologie, in der das Herz Sitz des Verstehens ist, und bildet die attributive Konstruktion knapp und würdig ab.
- source_word: כזב
  choice: der Lüge
  rationale: Gibt Unwahrheit beziehungsweise trügerische Rede konkret und allgemeinverständlich wieder; »Falschheit« wäre ebenfalls möglich, klingt hier aber abstrakter.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Parallelstruktur und die auffällige Geschmacksmetapher des Hebräischen bleiben erhalten; die Ellipse im zweiten Versglied entspricht dem Ausgangstext und ist im Deutschen verständlich.
