  text: Where[a] there is listening[b], do not pour out speech, and do not show off wisdom[c] at the wrong time.
translation:
  language: de
  text: Wo[a] zugehört wird[b], schütte keine Worte aus, und spiele dich nicht zur Unzeit als weise auf[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der für diesen Vers angegebene hebräische Text scheint nicht zu Sirach 35,4 zu gehören. Die Übersetzung folgt daher der griechischen Parallelüberlieferung, die vor Reden und zur Schau gestellter Weisheit zur unpassenden Zeit warnt.
    reason: textual_variant
  - marker: b
    text: 'Oder: „Wo eine Zuhörerschaft ist“. Das griechische Wort kann sowohl das Hören beziehungsweise Zuhören als auch eine Zuhörerschaft bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „und gib dich nicht zur Unzeit als weise aus“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπου
  choice: Wo
  rationale: Die Ortsangabe leitet knapp und natürlich die Situation ein, in der Zurückhaltung beim Reden geboten ist.
- source_word: ἀκρόαμα
  choice: zugehört wird
  rationale: Das Substantiv kann das Hören beziehungsweise Zuhören oder auch eine Zuhörerschaft bezeichnen. Die unpersönliche Formulierung bewahrt diese Offenheit weitgehend.
- source_word: μὴ ἐκχέῃς
  choice: schütte … nicht aus
  rationale: Die konkrete Metapher des Ausgießens bleibt erhalten und warnt anschaulich vor ungehemmtem Reden.
- source_word: λαλιάν
  choice: Worte
  rationale: Im Deutschen verbindet sich „Worte ausschütten“ verständlicher und natürlicher mit der Ausgießmetapher als das wörtlichere „Rede ausschütten“.
- source_word: ἀκαίρως
  choice: zur Unzeit
  rationale: Die geläufige, prägnante Wendung bezeichnet ein unpassendes oder ungelegenes Handeln und passt zum würdevollen Ton der Weisheitsliteratur.
- source_word: μὴ σοφίζου
  choice: spiele dich nicht … als weise auf
  rationale: Die Formulierung gibt den Gedanken wieder, sich als weise darzustellen oder Weisheit zur Schau zu stellen, ohne das Verb zu einem schlichten Verbot des Weiseseins zu verflachen.
theological_decisions:
- issue: Auswahl der Textgrundlage für diesen Vers
  choice: Übersetzung nach der griechischen Parallelüberlieferung
  alternative: 'Übersetzung des angegebenen hebräischen Textes: „Und sie werden erkennen, wie wir erkannt haben, dass es keinen Gott außer dir gibt.“'
  rationale: Der angegebene hebräische Text gehört seinem Inhalt nach offensichtlich in einen anderen Zusammenhang und entspricht nicht Sirach 35,4 in der griechischen Überlieferung. Deshalb bildet hier der griechische Paralleltext die kohärente Textgrundlage; die Abweichung wird ausdrücklich in einer Fußnote offengelegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Ausgießmetapher des Griechischen bleibt bewusst erhalten; „zur Unzeit“ gibt die zeitliche Unangemessenheit knapp und idiomatisch wieder.
