  text: The throat eats every kind of food[b][a], but one kind of food is more pleasant than another.
translation:
  language: de
  text: Die Kehle[b] nimmt jede Art von Speise auf, doch manche Speise ist angenehmer als eine andere.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hebräische Text ist ein knapper Spruch und in seiner erhaltenen Form etwas holprig. Die griechische Überlieferung weicht erheblich ab: „Ein sündiger Mensch wird der Zurechtweisung ausweichen und nach seinem Willen einen Urteilsspruch/ein Argument finden.“ Das weist möglicherweise auf eine andere hebräische Vorlage oder auf eine Störung der Textüberlieferung hin.'
    reason: textual_variant
  - marker: b
    text: 'Oder: „der Schlund“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כל מאכל
  choice: jede Art von Speise
  rationale: Die Wendung bezeichnet Speise in umfassendem Sinn. „Jede Art von Speise“ gibt den allgemeinen, sprichwörtlichen Charakter im Deutschen natürlich wieder.
- source_word: אוכל
  choice: nimmt … auf
  rationale: Das gewöhnliche Verb bedeutet „isst“. Da die Kehle als Subjekt steht, wahrt „nimmt … auf“ die bildhafte Aussage, ohne im Deutschen die schwer verständliche Formulierung „die Kehle isst“ zu erzwingen.
- source_word: גרגרת
  choice: Kehle
  rationale: Das Wort bezeichnet Kehle oder Schlund. „Kehle“ ist im modernen Standarddeutsch geläufig und bewahrt das Körperbild des hebräischen Spruchs.
- source_word: אך
  choice: doch
  rationale: Die Partikel leitet den Gegensatz beziehungsweise die Einschränkung des zweiten Halbverses ein.
- source_word: יש אכל מאכל נעים
  choice: manche Speise ist angenehmer als eine andere
  rationale: Der überlieferte hebräische Wortlaut ist knapp und etwas holprig. Die Übersetzung macht den im Kontrast liegenden Vergleich idiomatisch sichtbar, ohne eine bestimmte Speise zu benennen.
- source_word: נעים
  choice: angenehmer
  rationale: Das Adjektiv bezeichnet etwas Angenehmes oder Erfreuliches; der Komparativ ergibt sich hier aus dem Gegenüber verschiedener Speisen.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache mit sprichwörtlicher Kürze. „Speise“ hält einen leicht gehobenen biblischen Ton, bleibt aber allgemein verständlich. Die ungewöhnliche Personifizierung der Kehle wird bewahrt, während „nimmt … auf“ idiomatischer ist als „isst“.
