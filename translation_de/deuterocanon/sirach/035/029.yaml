  text: As long as you still live and have breath in you, do not give yourself over to any flesh.
translation:
  language: de
  text: Solange du noch lebst und Atem in dir ist, liefere dich keinem Menschen aus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Verändere dich nicht für irgendeinen Menschen.“ Die griechische Wendung kann sinngemäß davor warnen, sich sterblichen Menschen zu überlassen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕως ἔτι ζῇς
  choice: Solange du noch lebst
  rationale: Gibt die fortdauernde Zeitangabe mit der Betonung der noch verbleibenden Lebenszeit natürlich und genau wieder.
- source_word: πνοὴ ἐν σοί
  choice: Atem in dir ist
  rationale: πνοή bezeichnet hier im Parallelismus zum Leben den Atem beziehungsweise Lebensatem; „Atem“ vermeidet eine unbegründete Festlegung auf „Geist“.
- source_word: μὴ ἀλλάξῃς σεαυτὸν
  choice: liefere dich … nicht aus
  rationale: Die reflexive, gedrängte Wendung mit ἀλλάσσω kann wörtlich „verändere/vertausche dich“ heißen. Im Zusammenhang mit dem Dativ gibt „sich jemandem ausliefern“ den wahrscheinlichen Sinn des Sichüberlassens verständlich wieder, ohne die wörtlichere Möglichkeit zu verschweigen.
- source_word: πάσῃ σαρκί
  choice: keinem Menschen
  rationale: σάρξ bezeichnet in dieser weisheitlichen Wendung sterbliche Menschen, nicht eine „sündige Natur“. Die Verneinung mit πάσῃ wird im Deutschen idiomatisch als „keinem“ ausgedrückt.
theological_decisions:
- issue: Bedeutung von σάρξ in diesem Weisheitskontext
  choice: sterblicher Mensch
  alternative: Fleisch im Sinn körperlicher Begierde oder sündiger Natur
  rationale: πάσῃ σαρκί ist hier eine geläufige Bezeichnung für Menschen in ihrer Geschöpflichkeit und Sterblichkeit. Eine Wiedergabe als „sündige Natur“ würde eine spätere theologische Bedeutung in den Text eintragen.
- issue: Aussage von μὴ ἀλλάξῃς σεαυτὸν πάσῃ σαρκί
  choice: Warnung davor, sich einem Menschen auszuliefern
  alternative: Verändere dich für keinen Menschen
  rationale: Die griechische Formulierung bleibt mehrdeutig und ist idiomatisch verdichtet. Der Haupttext gibt den wahrscheinlichen Gedanken des Sichüberlassens wieder; die Fußnote bewahrt die formale Alternative und den Bildausdruck „Fleisch“.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Anrede im Singular bleibt erhalten. „Keinem Menschen“ ist im Deutschen natürlicher als „keinem Fleisch“; die Fußnote dokumentiert die formale Wiedergabe und bewahrt die genuine Mehrdeutigkeit von ἀλλάσσω.
