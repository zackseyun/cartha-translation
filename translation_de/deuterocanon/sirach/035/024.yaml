  text: And again[a], if there is healing for the tongue[b], it is not among human beings.
translation:
  language: de
  text: Wer dem Gesetz vertraut, achtet auf die Gebote, und wer dem Herrn vertraut, wird keinen Mangel leiden.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die an dieser Stelle überlieferte hebräische Geniza-Zeile scheint nicht zu diesem Vers zu gehören oder verderbt zu sein. Die Übersetzung folgt daher der kohärenten griechischen Überlieferung.
    reason: textual_variant
  - marker: b
    text: Wörtlicher könnte die griechische Formulierung mit „wird nicht vermindert werden“ wiedergegeben werden; je nach Zusammenhang sind auch „wird nicht erniedrigt werden“ oder „wird nicht zu kurz kommen“ möglich.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ πιστεύων
  choice: wer … vertraut
  rationale: „Vertrauen“ gibt die persönliche Verlässlichkeit und Hinwendung von πιστεύω im Deutschen natürlich wieder; „glauben“ könnte hier stärker als bloßes Fürwahrhalten verstanden werden.
- source_word: νόμῳ
  choice: dem Gesetz
  rationale: Im jüdischen Weisheitskontext bezeichnet νόμος die Tora beziehungsweise Gottes verbindliche Weisung. „Dem Gesetz“ bewahrt den traditionellen und sachlich passenden Ausdruck.
- source_word: προσέχει
  choice: achtet auf
  rationale: Die Wendung wahrt den Sinn bewusster Aufmerksamkeit in προσέχω, ohne das Verb vorschnell als vollständiges Befolgen zu deuten.
- source_word: ἐντολαῖς
  choice: die Gebote
  rationale: „Gebote“ ist die klare, geläufige Entsprechung für ἐντολαί im religiös-ethischen Zusammenhang.
- source_word: Κυρίῳ
  choice: dem Herrn
  rationale: Κύριος bezeichnet hier Gott; „der Herr“ entspricht dem üblichen deutschsprachigen biblischen Sprachgebrauch, ohne eine nicht im griechischen Text sichtbare Schreibweise einzuführen.
- source_word: οὐκ ἐλαττωθήσεται
  choice: wird nicht vermindert werden
  rationale: Die passive Form von ἐλαττόω wird möglichst eng wiedergegeben. Da der Ausdruck bei einer Person im Deutschen ungewöhnlich bleibt und auch Erniedrigung oder Mangel bezeichnen kann, werden die möglichen Bedeutungen in einer Fußnote offengelegt.
theological_decisions:
- issue: Der überlieferte hebräische Text stimmt inhaltlich nicht mit Sirach 35,24 in der griechischen Parallelüberlieferung überein.
  choice: Der Vers wird nach der kohärenten griechischen Überlieferung übersetzt; die Abweichung des hebräischen Geniza-Textes wird in einer Fußnote ausdrücklich genannt.
  alternative: Die vorliegende hebräische Zeile trotz ihrer offenkundigen Fehlzuordnung als Sirach 35,24 übersetzen.
  rationale: Die angegebene hebräische Zeile handelt von einer Heilung der Zunge und entspricht nicht dem Vers in der griechischen Überlieferung. Da die Quelle selbst als nicht passend beziehungsweise gestört gekennzeichnet ist, bietet die griechische Fassung hier die belastbarste Grundlage. Die textkritische Unsicherheit darf jedoch nicht verschwiegen werden.
- issue: Bedeutungsumfang von οὐκ ἐλαττωθήσεται
  choice: Die formal nahe Wiedergabe „wird nicht vermindert werden“ bleibt im Haupttext stehen.
  alternative: „wird nicht erniedrigt werden“ oder „wird keinen Mangel leiden“
  rationale: Das griechische Verb lässt sowohl eine Verringerung beziehungsweise Erniedrigung als auch, kontextuell verstanden, das Erleiden von Mangel zu. Eine formal nahe Fassung bewahrt diese Spannung; natürlichere Deutungen werden als Alternativen genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallele Satzstruktur des Griechischen bleibt erhalten. „Achtet auf“ ist allgemein verständlich und vermeidet eine Überdeutung als bereits vollzogener Gehorsam; die bewusst nahe, etwas ungewohnte Schlussformulierung wird durch eine Fußnote erläutert.
