translation:
  language: de
  text: Jede Speise wird im Bauch eingeschlossen[a], doch eine Speise ist angenehmer als eine andere.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die griechische Textüberlieferung bietet an dieser Stelle einen deutlich anderen Wortlaut und scheint eine andere Textzeile wiederzugeben. Die Übersetzung folgt dem erhaltenen hebräischen Text.
    reason: textual_variant
  - marker: b
    text: 'Das Hebräische ist knapp formuliert, etwa: „Es gibt Speise, die gegenüber einer anderen angenehm ist.“ Gemeint ist ein Vergleich: Eine Speise ist angenehmer als eine andere.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כל מאכל
  choice: Jede Speise
  rationale: כל mit einem singularischen Substantiv bezeichnet hier distributive Gesamtheit. „Jede Speise“ gibt die allgemeine Aussage knapp und natürlich wieder.
- source_word: תסגר
  choice: wird … eingeschlossen
  rationale: Die passive Bedeutung bewahrt das konkrete Bild, dass die Speise im Bauch eingeschlossen wird, ohne es als bloßes Verdauen auszudeuten.
- source_word: בבטן
  choice: im Bauch
  rationale: Im Zusammenhang mit Speise bezeichnet בטן den Bauch als Verdauungsraum. „Bauch“ erhält die anschauliche, nicht klinische Sprache des Hebräischen.
- source_word: אך
  choice: doch
  rationale: „Doch“ markiert den Gegensatz zwischen dem gemeinsamen Verbleib aller Speisen im Bauch und ihrer unterschiedlichen Annehmlichkeit.
- source_word: יש מאכל ממאכל
  choice: eine Speise … als die andere
  rationale: Die hebräische Formulierung ist knapp und drückt idiomatisch einen Vergleich zwischen Speisen aus. Die deutsche Fassung macht diesen Vergleich verständlich, ohne „Art“ hinzuzufügen.
- source_word: תנעם
  choice: ist angenehmer
  rationale: Die Wurzel נעם bezeichnet Annehmlichkeit oder Wohlgefallen. „Angenehmer“ wahrt den allgemeinen Sinn und verengt ihn nicht auf Süße.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, spruchhaftem Klang. „Speise“ entspricht dem weisheitlichen Register besser als das alltäglichere „Essen“, während „Bauch“ die konkrete Bildsprache des Hebräischen bewahrt.
