base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/035/033.yaml
  text: Fodder and a stick and loads are for a donkey[c][b][a]; bread and discipline and work are for a servant.
translation:
  language: de
  text: Futter, Stock[a] und Lasten sind für einen Esel bestimmt; Brot, Erziehung[b] und Arbeit für einen Haussklaven.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Rute“ beziehungsweise „Stab“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Zurechtweisung“, „Schulung“ oder „Disziplin“.'
    reason: lexical_alternative
  - marker: c
    text: Das griechische Wort bezeichnet einen Sklaven oder unfreien Diener im Haushalt; weniger ausdrücklich könnte man „Hausdiener“ übersetzen.
    reason: lexical_alternative
lexical_decisions:
- source_word: χορτάσματα
  choice: Futter
  rationale: Der Plural bezeichnet hier Tierfutter beziehungsweise Futterrationen. Das deutsche Sammelwort „Futter“ ist natürlich und prägnant.
- source_word: ῥάβδος
  choice: Stock
  rationale: Das Wort kann einen Stock, eine Rute oder einen Stab bezeichnen. Im Zusammenhang mit dem Antreiben eines Esels ist „Stock“ verständlich, ohne die genaue Form festzulegen.
- source_word: φορτία
  choice: Lasten
  rationale: Gemeint sind konkrete Lasten, die ein Lasttier trägt; der Plural des griechischen Textes bleibt erhalten.
- source_word: ὄνῳ
  choice: für einen Esel
  rationale: Der Dativ bezeichnet hier die Zuordnung oder Bestimmung. Die generische deutsche Formulierung gibt den sprichwortartigen Charakter wieder.
- source_word: ἄρτος
  choice: Brot
  rationale: Das konkrete Grundnahrungsmittel des griechischen Textes wird beibehalten und nicht zu „Nahrung“ verallgemeinert.
- source_word: παιδεία
  choice: Erziehung
  rationale: „Erziehung“ umfasst Anleitung, Schulung und korrigierende Disziplin und bewahrt damit die Bedeutungsbreite von παιδεία besser als das im Deutschen leicht missverständliche „Disziplin“.
- source_word: ἔργον
  choice: Arbeit
  rationale: Die schlichte Wiedergabe passt zum häuslichen Arbeitsverhältnis und zur knappen Aufzählung.
- source_word: οἰκέτῃ
  choice: für einen Haussklaven
  rationale: οἰκέτης bezeichnet einen Sklaven beziehungsweise unfreien Diener im Haushalt. „Haussklave“ macht sowohl den häuslichen Bezug als auch den unfreien Status deutlich.
theological_decisions:
- issue: Wiedergabe des sozialen Status von οἰκέτης
  choice: Haussklave
  alternative: Hausdiener; Diener
  rationale: Die Aussage betrifft ein historisches Verhältnis persönlicher Unfreiheit. „Diener“ würde diesen Status abschwächen; „Haussklave“ gibt die soziale Asymmetrie ausdrücklich wieder, ohne sie zu billigen.
- issue: Bedeutungsumfang von παιδεία
  choice: Erziehung
  alternative: Zurechtweisung; Schulung; Disziplin
  rationale: Der Kontext lässt sowohl Anleitung und Ausbildung als auch korrigierende Behandlung anklingen. „Erziehung“ hält diese Spannung offen; die Fußnote nennt naheliegende Alternativen.
translation_notes:
  register: Knappe, sprichwortartige Parallelstruktur in modernem Standarddeutsch. „Sind … bestimmt“ ergänzt die im Griechischen nominale Aussage idiomatisch; im zweiten Satzglied wird das Verb zur Wahrung der Prägnanz ausgespart. Die historisch harte soziale Aussage wird weder beschönigt noch durch zusätzliche Wertung verschärft.
