  text: Renew a sign and repeat a wonder[a]; glorify the hand and strengthen the arm and the right hand.
translation:
  language: de
  text: Erneuere ein Zeichen und wiederhole ein Wunder.[a] Verherrliche deine Hand und stärke deinen Arm und deine Rechte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die griechische Parallelüberlieferung weicht hier erheblich ab. Sie spricht von einem Karfunkelsiegel auf goldenem Schmuck und vom Zusammenklang der Musik bei einem Weingelage. Da der hebräische Text erhalten und zuverlässig bezeugt ist, folgt die Übersetzung dem Hebräischen.
    reason: textual_variant
lexical_decisions:
- source_word: חדש
  choice: Erneuere
  rationale: Der Imperativ bezeichnet die erneute beziehungsweise frische Hervorbringung eines göttlichen Zeichens; »erneuere« bewahrt diese Offenheit.
- source_word: אות
  choice: ein Zeichen
  rationale: »Zeichen« ist die geläufige und sachlich passende Wiedergabe für אות im Zusammenhang mit machtvollem göttlichem Handeln.
- source_word: ושנה
  choice: und wiederhole
  rationale: שנה bedeutet hier, etwas ein zweites Mal oder erneut zu tun. Die direkte Wiedergabe erhält den Parallelismus zu »erneuere«.
- source_word: מופת
  choice: ein Wunder
  rationale: »Wunder« gibt die außergewöhnliche göttliche Machttat in natürlichem Deutsch wieder; »Wunderzeichen« wäre ebenfalls möglich, würde den Ausdruck jedoch stärker mit אות verschmelzen.
- source_word: האדר
  choice: Verherrliche
  rationale: Der Imperativ fordert dazu auf, Hoheit und Herrlichkeit sichtbar hervortreten zu lassen. »Verherrliche« wahrt die knappe Form des Hebräischen.
- source_word: יד
  choice: deine Hand
  rationale: Das Körperbild für Gottes wirksame Macht bleibt erhalten. Das Possessivpronomen ist im Deutschen zur Verdeutlichung des angeredeten Gottes ergänzt.
- source_word: ואמץ
  choice: und stärke
  rationale: Die Form bezeichnet das Starkmachen oder Kräftigen und wird direkt als Imperativ wiedergegeben.
- source_word: זרוע
  choice: deinen Arm
  rationale: Die traditionelle anthropomorphe Metapher für wirksame Kraft wird nicht abstrakt als »Macht« paraphrasiert.
- source_word: וימין
  choice: und deine Rechte
  rationale: »Die Rechte« ist eine würdige, im biblischen Sprachgebrauch verständliche Bezeichnung für die rechte Hand und erhält die Reihung des Hebräischen.
theological_decisions:
- issue: Anthropomorphe Rede von Gottes Macht
  choice: »Hand«, »Arm« und »Rechte« als Körperbilder beibehalten
  alternative: Die Ausdrücke mit »Macht« oder »Kraft« paraphrasieren
  rationale: Das Hebräische beschreibt Gottes Handeln bewusst mit körperlichen Bildern. Ihre Beibehaltung wahrt die Bildkraft und legt die Aussage nicht auf eine abstrakte Deutung fest.
- issue: Vom Hebräischen stark abweichende griechische Parallelüberlieferung
  choice: Dem vorhandenen, als zuverlässig eingestuften hebräischen Text folgen
  alternative: Die Bilder der griechischen Überlieferung in den Haupttext übernehmen
  rationale: Der griechische Paralleltext bietet in diesem Vers einen inhaltlich grundverschiedenen Wortlaut. Da der hebräische Zeuge vorhanden und hoch eingestuft ist, bildet er die Übersetzungsgrundlage; die Abweichung wird transparent in einer Fußnote dokumentiert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper Gebetssprache. Der Parallelismus und die traditionellen biblischen Machtbilder bleiben erhalten. Die im Hebräischen nicht ausdrücklich gesetzten Possessivpronomen werden ergänzt, damit die Anrede Gottes im Deutschen klar und natürlich klingt.
