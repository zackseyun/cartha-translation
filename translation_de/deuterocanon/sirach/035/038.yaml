base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/035/038.yaml
  text: Assign him work as is fitting for him; and if he does not obey[a], make his fetters heavy. But do not be excessive with any flesh, and do nothing without judgment.
translation:
  language: de
  text: Weise ihm Arbeiten zu, wie es ihm angemessen ist; und wenn er nicht gehorcht, mach seine Fesseln schwer. Doch geh bei keinem Menschen[a] zu weit, und tu nichts ohne Urteil.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „bei allem Fleisch“; gemeint ist: bei irgendeinem Menschen oder gegenüber irgendeiner Person.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „ohne Abwägung“, „ohne Unterscheidungsvermögen“ beziehungsweise „ohne gerechte Entscheidung“.'
    reason: semantic_ambiguity
lexical_decisions:
- source_word: εἰς ἔργα κατάστησον
  choice: Weise ihm Arbeiten zu
  rationale: καθίστημι mit εἰς und Akkusativ bezeichnet hier das Einsetzen beziehungsweise Zuweisen zu Aufgaben. Die Formulierung ist im Deutschen natürlich und bewahrt den auffordernden Charakter.
- source_word: καθὼς πρέπει αὐτῷ
  choice: wie es ihm angemessen ist
  rationale: πρέπει bezeichnet das, was passend oder gebührend ist. „Angemessen“ gibt diesen Maßstab in heutigem Deutsch wieder.
- source_word: κἂν μὴ πειθαρχῇ
  choice: und wenn er nicht gehorcht
  rationale: πειθαρχέω meint Gehorsam gegenüber Autorität oder Anordnung. Das Griechische nennt „Disziplin“ nicht ausdrücklich, daher wird dies nicht ergänzt.
- source_word: βάρυνον τὰς πέδας αὐτοῦ
  choice: mach seine Fesseln schwer
  rationale: Die konkrete Bildsprache von βαρύνω und πέδαι bleibt erhalten, ohne die Art der Fesseln näher zu bestimmen.
- source_word: μὴ περισσεύσῃς
  choice: geh … nicht zu weit
  rationale: περισσεύω warnt hier vor dem Überschreiten des rechten Maßes. Die deutsche Wendung ist idiomatisch und bewahrt die Mahnung gegen übermäßige Härte.
- source_word: ἐν πάσῃ σαρκί
  choice: bei keinem Menschen
  rationale: σάρξ bezeichnet in diesem Zusammenhang Menschen als leibliche Wesen. Eine wörtliche Wiedergabe mit „Fleisch“ wäre im Deutschen missverständlich; sie wird deshalb in der Fußnote dokumentiert.
- source_word: ἄνευ κρίσεως
  choice: ohne Urteil
  rationale: κρίσις kann Urteil, Beurteilung, Entscheidung oder unterscheidende Abwägung bedeuten. „Urteil“ hält diese rechtliche und praktische Bedeutungsbreite möglichst offen.
- source_word: μὴ ποιήσῃς μηδέν
  choice: tu nichts
  rationale: Die griechische Negativkonstruktion ergibt eine umfassende, knappe Mahnung.
theological_decisions:
- issue: Wiedergabe von σάρξ in der Weisheitsmahnung
  choice: Menschen im Haupttext; wörtliche Form in der Fußnote
  alternative: Fleisch
  rationale: Hier bezieht sich σάρξ idiomatisch auf Menschen allgemein. „Bei keinem Fleisch“ wäre im modernen Deutschen unverständlich oder sachlich missdeutbar; die Fußnote bewahrt dennoch die konkrete Ausdrucksweise des Griechischen.
- issue: Bedeutungsumfang von κρίσις
  choice: Urteil
  alternative: Abwägung; Unterscheidungsvermögen; gerechte Entscheidung
  rationale: Der Kontext erlaubt sowohl besonnene Prüfung als auch gerechtes Urteilen. Die Übersetzung soll diese ethische Spannung nicht auf nur einen Aspekt verengen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter Mahnrede. Konkrete Härtebilder werden nicht abgeschwächt. Ungebräuchliche Wörtlichkeit bei σάρξ wird zugunsten verständlicher Sprache in eine Fußnote verlagert; die Mehrdeutigkeit von κρίσις bleibt im Haupttext und in der Fußnote sichtbar.
