translation:
  language: de
  text: Jeder Mann nimmt eine Frau an, doch ein Mann wählt eine junge Frau.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Überlieferung bietet hier einen deutlich anderen Text: „Tu nichts ohne Beratung, und wenn du gehandelt hast, bereue es nicht.“'
    reason: textual_variant
lexical_decisions:
- source_word: כָּל זָכָר
  choice: Jeder Mann
  rationale: זכר bezeichnet ausdrücklich eine männliche Person. Im Deutschen wäre „jedes Männliche“ unnatürlich und „jedes Männchen“ abwertend; „jeder Mann“ gibt die Aussage würdig und verständlich wieder, auch wenn dadurch der hebräische Wechsel zu איש weniger deutlich wird.
- source_word: תְּקַבֵּל
  choice: nimmt … an
  rationale: קבל bedeutet „empfangen/annehmen“. „Nimmt … an“ bewahrt den relationalen Sinn, ohne ausdrücklich Ehe oder Geschlechtsverkehr vorauszusetzen.
- source_word: אִשָּׁה
  choice: eine Frau
  rationale: אשה kann „Frau“ oder „Ehefrau“ bedeuten. Der allgemeine Spruch und der Gegensatz zu עלמה sprechen für die weniger einengende Wiedergabe „Frau“.
- source_word: אַךְ
  choice: doch
  rationale: Die Partikel kennzeichnet einen Gegensatz. „Doch“ klingt in der knappen deutschen Spruchform natürlich und würdig.
- source_word: אִישׁ
  choice: ein Mann
  rationale: איש bezeichnet hier einen Mann. Die Wiedergabe bleibt geschlechtsgenau, auch wenn der Unterschied zu זכר im natürlichen Deutschen nicht vollständig nachgebildet werden kann.
- source_word: יִבְחַר
  choice: wählt
  rationale: בחר bedeutet „wählen/auswählen“. Das Präsens entspricht im Deutschen einer allgemeinen sprichwörtlichen Aussage natürlicher als das Futur.
- source_word: עַלְמָה
  choice: eine junge Frau
  rationale: עלמה bezeichnet eine junge Frau im heiratsfähigen Alter. „Jungfrau“ wäre lexikalisch zu eng, „Maid“ oder „Jungfer“ wäre veraltet.
theological_decisions:
- issue: Vorrang des erhaltenen hebräischen Textes gegenüber der stark abweichenden griechischen Überlieferung
  choice: Der erhaltene hebräische Spruch steht im Haupttext.
  alternative: 'Die griechische Überlieferung lautet: „Tu nichts ohne Beratung, und wenn du gehandelt hast, bereue es nicht.“'
  rationale: Wo ein belastbarer hebräischer Sirach-Text erhalten ist, wird er als Ausgangstext übersetzt. Da das Griechische hier einen völlig anderen Spruch bietet, wird seine Lesart nicht mit dem Hebräischen vermischt, sondern transparent in einer textkritischen Fußnote dokumentiert.
- issue: Bedeutung von עלמה
  choice: junge Frau
  alternative: Jungfrau
  rationale: Der Ausdruck bezeichnet das Alter beziehungsweise den Lebensstand, ohne für sich allein Jungfräulichkeit eindeutig festzulegen. Die Übersetzung vermeidet daher eine theologisch oder traditionell überbestimmte Wiedergabe.
translation_notes:
  register: Knappe, sprichwortartige Syntax in modernem Standarddeutsch. Die Formulierung folgt dem überlieferten Hebräisch, ohne seine generalisierende Sichtweise erklärend abzuschwächen. Der hebräische Kontrast zwischen זכר („männliche Person“) und איש („Mann“) lässt sich in würdigem, natürlichem Deutsch nur eingeschränkt abbilden.
