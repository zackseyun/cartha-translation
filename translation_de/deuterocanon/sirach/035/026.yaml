  source_fidelity: 'Der Haupttext gibt den hebräischen Textzeugen genau wieder: מי יאמין ist treffend als rhetorisches „Wer wird … vertrauen?“ gefasst; גדוד צבא wird idiomatisch und ohne wesentlichen Sinnverlust als „bewaffnete Truppe“ wiedergegeben; המדלג מעיר אל עיר bleibt mit „die von Stadt zu Stadt springt“ bewusst bildhaft erhalten. Die vom griechischen Paralleltext vollständig abweichende Lesart wird nicht harmonisierend in den Haupttext eingetragen.'
