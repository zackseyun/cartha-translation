translation:
  language: de
  text: Wer wird einer bewaffneten Truppe[a] vertrauen, die von Stadt zu Stadt springt?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die überlieferte griechische Parallelfassung dieses Verses weicht vollständig ab: „Erkennt, dass ich mich nicht allein für mich abgemüht habe, sondern für alle, die Unterweisung suchen.“ Hier wird daher der hebräische Textzeuge als Primärtext wiedergegeben.'
    reason: textual_variant
lexical_decisions:
- source_word: מי
  choice: Wer wird
  rationale: Das Fragewort leitet eine rhetorische Frage ein; das Futur mit „wird“ gibt ihren sprichwortartigen Sinn im Deutschen natürlich wieder.
- source_word: יאמין
  choice: vertrauen
  rationale: Das Hifil von אמן bezeichnet hier das Setzen von Vertrauen in jemanden oder etwas, nicht nur das Fürwahrhalten einer Aussage.
- source_word: בגדוד צבא
  choice: einer bewaffneten Truppe
  rationale: גדוד bezeichnet eine Truppe oder Schar, während צבא den militärischen Charakter bestimmt. „Bewaffnete Truppe“ gibt beides knapp und idiomatisch wieder.
- source_word: המדלג
  choice: die … springt
  rationale: דלג bezeichnet wörtlich ein Springen oder Hüpfen. Das bildhafte Verb bleibt erhalten und lässt die Unbeständigkeit der Bewegung erkennen, ohne sie auszudeuten.
- source_word: מעיר אל עיר
  choice: von Stadt zu Stadt
  rationale: Die Wendung bezeichnet wiederholte Bewegung zwischen Städten und lässt sich unmittelbar und natürlich wiedergeben.
theological_decisions:
- issue: Vollständige Abweichung zwischen dem hebräischen Textzeugen und der griechischen Parallelüberlieferung
  choice: Der erhaltene hebräische Text steht im Haupttext; die griechische Abweichung wird in einer Fußnote dokumentiert.
  alternative: 'Griechische Parallelfassung: „Erkennt, dass ich mich nicht allein für mich abgemüht habe, sondern für alle, die Unterweisung suchen.“'
  rationale: Da ein hebräischer Textzeuge vorliegt, wird dieser als Primärtext übersetzt. Die griechische Fassung bietet einen völlig anderen Inhalt und kann nicht mit ihm harmonisiert werden; die materielle Textunsicherheit bleibt durch die Fußnote sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die rhetorische Frage und das anschauliche, ungewöhnliche Bild des Springens von Stadt zu Stadt bleiben erhalten; die militärische Doppelbezeichnung wird idiomatisch als „bewaffnete Truppe“ verdichtet.
