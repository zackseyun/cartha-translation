  text: Fill Zion with your splendor[a], and your temple with your glory.
translation:
  language: de
  text: Erfülle Zion mit deinem Glanz[a] und deinen Tempel mit deiner Herrlichkeit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Text lautet an dieser Stelle völlig anders: »Dort spiele und verwirkliche deine Gedanken, und sündige nicht durch ein hochmütiges Wort.« Dies weist auf eine erhebliche Abweichung vom erhaltenen hebräischen Text hin.'
    reason: textual_variant
lexical_decisions:
- source_word: מלא
  choice: Erfülle
  rationale: Der Imperativ bedeutet hier, Zion und – elliptisch ergänzt – den Tempel mit Gottes strahlender Gegenwart zu erfüllen.
- source_word: ציון
  choice: Zion
  rationale: Der hebräische Ortsname wird beibehalten und nicht verallgemeinernd als Jerusalem wiedergegeben.
- source_word: הודך
  choice: deinem Glanz
  rationale: הוד bezeichnet Glanz, Pracht oder Majestät. »Glanz« ist natürlich und bewahrt die Unterscheidung zu כבוד.
- source_word: ומכבודך
  choice: und deinen Tempel mit deiner Herrlichkeit
  rationale: Das Verb aus dem ersten Satzglied ist mitzudenken; die Präposition מ wird im parallelen Zusammenhang idiomatisch als Bezeichnung dessen verstanden, womit der Tempel erfüllt werden soll.
- source_word: היכלך
  choice: deinen Tempel
  rationale: היכל kann Palast oder Tempel bedeuten; in Verbindung mit Zion bezeichnet es hier Gottes Tempel.
- source_word: כבודך
  choice: deiner Herrlichkeit
  rationale: כבוד bezeichnet hier Gottes Herrlichkeit. Die Wiedergabe unterscheidet den Ausdruck vom zuvor genannten הוד.
theological_decisions:
- issue: Poetische Unterscheidung zwischen הוד und כבוד
  choice: הוד als »Glanz« und כבוד als »Herrlichkeit« wiedergeben
  alternative: Beide Begriffe mit »Herrlichkeit« wiedergeben oder הוד als »Majestät« übersetzen
  rationale: Die beiden verwandten, aber unterschiedlichen hebräischen Begriffe bleiben erkennbar, ohne ihnen eine zusätzliche dogmatische Unterscheidung aufzuerlegen.
- issue: Hebräischer Haupttext und stark abweichende griechische Überlieferung
  choice: Die erhaltene hebräische Gebetszeile als Haupttext übersetzen und die griechische Abweichung in einer Fußnote nennen
  alternative: Dem griechischen Wortlaut folgen
  rationale: Der vorhandene hebräische Text ist für diesen Entwurf die primäre Grundlage; der griechische Zeuge bietet hier eine substanziell andere Textform, die transparent dokumentiert wird.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe poetische Parallelstruktur bleibt erhalten; das im zweiten Satzglied ausgelassene Verb wird zur natürlichen deutschen Verständlichkeit ergänzt.
