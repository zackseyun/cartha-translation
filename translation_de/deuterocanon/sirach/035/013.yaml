  text: Bear witness to your former deeds[a], and establish the vision swiftly in your name.
translation:
  language: de
  text: Lege Zeugnis ab von deinen früheren Taten, und bestätige die Vision rasch in deinem Namen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hebräische Wortlaut ist schwierig, besonders die hier mit »rasch« wiedergegebene Wendung. Die griechische Parallelfassung lautet stattdessen: »Und außerdem preise den, der dich geschaffen hat und dich mit seinen guten Gaben sättigt.«'
    reason: alternative_reading
lexical_decisions:
- source_word: תן עדות
  choice: Lege Zeugnis ab
  rationale: Die Imperativverbindung bedeutet wörtlich »gib Zeugnis«. »Lege Zeugnis ab« ist im heutigen Deutschen idiomatisch und bewahrt den bezeugenden, beinahe rechtssprachlichen Klang.
- source_word: למראש מעשיך
  choice: für deine früheren Taten
  rationale: למראש ist schwierig; zusammen mit מעשיך weist es am ehesten auf frühere oder vorausgegangene Taten. Die Präposition wird mit »für« wiedergegeben, ohne die unsichere syntaktische Beziehung stärker festzulegen.
- source_word: מעשיך
  choice: deine Taten
  rationale: »Taten« gibt מעשים in diesem poetischen Zusammenhang natürlich wieder und vermeidet die im Deutschen möglicherweise enger religiös verstandene Formulierung »Werke«.
- source_word: והקם
  choice: und bestätige
  rationale: Das Hifil von קום kann »aufrichten«, »bestehen lassen« oder »bestätigen« bedeuten. Bei חזון ist »bestätige« verständlicher als das unnatürliche »richte die Vision auf« und legt sich weniger stark als »erfülle« auf eine Vollendung fest.
- source_word: חזון
  choice: die Vision
  rationale: »Vision« ist die direkte und im prophetischen Zusammenhang offene Wiedergabe; »Offenbarung« oder »Weissagung« würden die Bedeutung stärker eingrenzen.
- source_word: דברק
  choice: rasch
  rationale: Die Konsonantenfolge ist textlich und lexikalisch schwer verständlich. Sie könnte mit Blitz oder Schnelligkeit zusammenhängen. »Rasch« ist eine zurückhaltende kontextuelle Wiedergabe; die erhebliche Unsicherheit und die abweichende griechische Fassung werden in der Fußnote offengelegt.
- source_word: בשמך
  choice: in deinem Namen
  rationale: Die Präposition ב mit שם wird möglichst unmittelbar wiedergegeben. Die genaue syntaktische Zuordnung bleibt auch im Deutschen offen.
theological_decisions:
- issue: Vorrang des erhaltenen hebräischen Textes gegenüber der stark abweichenden griechischen Parallelfassung
  choice: Der Haupttext folgt dem erhaltenen Hebräisch und kennzeichnet dessen Schwierigkeit in einer Fußnote.
  alternative: »Und außerdem preise den, der dich geschaffen hat und dich mit seinen guten Gaben sättigt.«
  rationale: Da ein hebräischer Textzeuge vorliegt, bildet er die Grundlage der Übersetzung. Die griechische Fassung bietet jedoch einen völlig anderen Satz und kann die schwierige hebräische Wendung nicht ohne Weiteres erklären; sie wird deshalb transparent als alternative Überlieferung angeführt, nicht stillschweigend in den Haupttext übernommen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die leicht ungewohnte Verbindung »die Vision … bestätigen« wahrt die Bild- und Bedeutungsoffenheit des schwierigen Hebräisch; die stark abweichende griechische Überlieferung wird in der Fußnote dokumentiert.
