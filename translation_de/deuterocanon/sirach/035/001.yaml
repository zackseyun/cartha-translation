  text: If they made you a leader, do not exalt yourself; be among them as one of them.[a]
translation:
  language: de
  text: Hat man dich zum Leiter eingesetzt, überhebe dich nicht; sei unter ihnen wie einer von ihnen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der für diese Stelle gelieferte hebräische Text lautet: „Rette uns, Gott des Alls, und erhebe deinen Schrecken über alle Völker.“ Da dieser Wortlaut nicht mit dem griechischen Text übereinstimmt, der Sirach 35,1 zugeordnet ist, folgt die Hauptübersetzung hier dem Griechischen und weist die Abweichung ausdrücklich aus.'
    reason: textual_variant
lexical_decisions:
- source_word: Ἡγούμενόν
  choice: Leiter
  rationale: Das Partizip bezeichnet jemanden, der führt oder Verantwortung trägt. „Leiter“ ist modernes, allgemein verständliches Deutsch und legt kein bestimmtes politisches Amt fest.
- source_word: κατέστησαν
  choice: hat man … eingesetzt
  rationale: Das Verb bezeichnet das Einsetzen oder Bestellen in eine Aufgabe. Das unpersönliche „man“ gibt das unbestimmte griechische Pluralsubjekt im Deutschen natürlich wieder.
- source_word: μὴ ἐπαίρου
  choice: überhebe dich nicht
  rationale: Die Formulierung bewahrt das Bild der Selbsterhöhung und zugleich die moralische Warnung vor Hochmut.
- source_word: γίνου
  choice: sei
  rationale: Im auffordernden Zusammenhang gibt „sei“ die geforderte Haltung natürlicher wieder als „werde“.
- source_word: ὡς εἷς ἐξ αὐτῶν
  choice: wie einer von ihnen
  rationale: Die Wendung betont Demut und Zugehörigkeit zur Gruppe, ohne die leitende Aufgabe aufzuheben.
theological_decisions:
- issue: Textgrundlage bei vollständiger Abweichung zwischen dem zugeordneten hebräischen und griechischen Text
  choice: Der Haupttext folgt dem griechischen Paralleltext, der einen in sich stimmigen Vers zur angegebenen Referenz bietet; die abweichende hebräische Lesart wird in einer Fußnote vollständig offengelegt.
  alternative: 'Dem gelieferten Hebräisch folgen: „Rette uns, Gott des Alls, und erhebe deinen Schrecken über alle Völker.“'
  rationale: Die beiden Quellen enthalten nicht Varianten desselben Satzes, sondern völlig verschiedene Aussagen. Da der griechische Text mit dem für diesen Vers erwarteten Inhalt übereinstimmt, bildet er hier ausnahmsweise die Grundlage; die hoch eingestufte hebräische Evidenz darf jedoch nicht stillschweigend übergangen werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die einleitende Frageform des griechischen Textes bleibt erhalten; „überhebe dich nicht“ wahrt das Bild der Selbsterhöhung, während „wie einer von ihnen“ die geforderte solidarische Demut knapp und verständlich ausdrückt.
