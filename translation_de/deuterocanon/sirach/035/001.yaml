  verdict: revise
  source_fidelity: 'Der vorgelegte hebräische Text lautet eindeutig: „Rette uns, Gott des Alls, und erhebe deinen Schrecken über alle Völker.“ Der deutsche Haupttext folgt stattdessen vollständig dem abweichenden griechischen Paralleltext und gibt keinen Teil des hebräischen Satzes wieder. Bei dieser vollständigen Nichtübereinstimmung darf die griechische Zuordnung nicht den als primäre Quelle vorgelegten hebräischen Text ersetzen; sie ist als abweichende Parallelüberlieferung zu dokumentieren.'
  naturalness: „Rette uns, Gott des Alls“ ist würdiges, verständliches modernes Standarddeutsch. „Erhebe deinen Schrecken über alle Völker“ bewahrt die bildhafte hebräische Ausdrucksweise und ist in diesem poetisch-liturgischen Register natürlich genug.
  terminology: „Gott des Alls“ gibt אלהי הכל präzise wieder, ohne die Wendung auf eine bestimmte dogmatische Formel festzulegen. „Schrecken“ gibt פחדך in der Anrufung treffend wieder. Die Anrede bleibt durchgehend im Singular.
  issues:
  - severity: high
    issue: Der Haupttext übersetzt einen vollständig anderen griechischen Satz statt des gelieferten hebräischen Ausgangstextes.
    rationale: Der hebräische Wortlaut bittet Gott um Rettung und darum, seinen Schrecken über alle Völker zu erheben; der Entwurf enthält dagegen eine Mahnung an einen eingesetzten Leiter. Die Fußnote macht die Abweichung zwar transparent, behebt aber nicht die fehlende Übersetzung der primären Quelle.
  - severity: medium
    issue: Die Fußnote stellt die griechische Lesart als Grundlage der Hauptübersetzung dar.
    rationale: Die vollständige Abweichung ist ein textkritisches Problem und soll offengelegt werden, aber die Hauptübersetzung muss hier den vorgelegten hebräischen Text wiedergeben. Der griechische Paralleltext kann als abweichende, der Referenz zugeordnete Überlieferung benannt werden.
  revised_text: Rette uns, Gott des Alls, und erhebe deinen Schrecken über alle Völker.[a]
  revised_footnotes:
  - marker: a
    text: 'Der für diese Stelle gelieferte griechische Paralleltext lautet: „Hat man dich zum Leiter eingesetzt, überhebe dich nicht; sei unter ihnen wie einer von ihnen.“ Er stimmt nicht mit dem vorliegenden hebräischen Text überein. Die Hauptübersetzung folgt dem Hebräischen; die abweichende griechische Überlieferung wird hier offengelegt.'
    reason: textual_variant
  revision_rationale: 'Der Haupttext wurde vollständig auf den vorgelegten hebräischen Wortlaut zurückgeführt: הושיענו = „Rette uns“, אלהי הכל = „Gott des Alls“ und והרם פחדך על כל הגוים = „erhebe deinen Schrecken über alle Völker“. Die Fußnote dokumentiert weiterhin transparent die vollständige Abweichung des griechischen Paralleltexts, ohne ihn gegen die primäre hebräische Quelle zur Grundlage des Verses zu machen.'
