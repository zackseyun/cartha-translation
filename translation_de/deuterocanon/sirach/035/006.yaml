translation:
  language: de
  text: Erwecke Zorn und gieße Grimm aus[a]; beuge den Bedränger nieder und stoße den Feind zurück.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die griechische Parallelüberlieferung bei Swete weicht hier stark ab. Sie spricht von einem Smaragdsiegel in goldener Fassung und von Musik bei lieblichem Wein. Hier wird der in der Kairoer Geniza gut bezeugte hebräische Text als Hauptquelle wiedergegeben.
    reason: textual_variant
lexical_decisions:
- source_word: העיר
  choice: Wecke
  rationale: Der kausative Imperativ fordert dazu auf, etwas zu erwecken oder in Bewegung zu setzen. „Wecke“ bewahrt das konkrete Bild und die Dringlichkeit.
- source_word: אף
  choice: deinen Zorn
  rationale: אף bedeutet wörtlich „Nase“, bezeichnet aber häufig den Zorn. Das Possessivpronomen macht im Deutschen den in der Gebetsanrede vorausgesetzten Bezug zu Gott natürlich verständlich, ohne einen Gottesnamen hinzuzufügen.
- source_word: ושפוך
  choice: und gieße … aus
  rationale: Die konkrete Metapher des Ausgießens wird beibehalten; sie ist auch im heutigen Deutschen verständlich.
- source_word: חמה
  choice: deinen Grimm
  rationale: חמה kann Hitze, Wut oder heftigen Zorn bezeichnen. „Grimm“ unterscheidet den Ausdruck von אף und wahrt den poetischen Parallelismus.
- source_word: והכניע
  choice: beuge … nieder
  rationale: כנע bezeichnet das Erniedrigen oder Unterwerfen. „Niederbeugen“ bewahrt sowohl das Bild des Herabsetzens als auch die Bedeutung des Bezwingens.
- source_word: צר
  choice: den Bedränger
  rationale: צר bezeichnet einen Gegner oder feindlichen Bedränger. „Bedränger“ unterscheidet ihn sprachlich vom folgenden אויב und lässt die feindselige Rolle erkennen.
- source_word: והדוף
  choice: und stoße … zurück
  rationale: הדף bedeutet wegstoßen, zurückdrängen oder abwehren. „Zurückstoßen“ erhält die körperlich-militärische Bildhaftigkeit.
- source_word: אויב
  choice: den Feind
  rationale: אויב ist die übliche Bezeichnung für einen Feind und bildet den abschließenden Gegenbegriff im Parallelismus.
theological_decisions:
- issue: Adressat und unausgesprochenes Subjekt der Imperative
  choice: Die Imperative werden als unmittelbare Bitte an Gott wiedergegeben; „deinen“ verdeutlicht den im Kontext vorausgesetzten Bezug des Zorns und Grimms zum Angeredeten.
  alternative: Eine allgemeine Aufforderung ohne erkennbaren göttlichen Adressaten oder eine ausdrückliche Ergänzung wie „Herr“.
  rationale: Im Hebräischen bleibt das Subjekt der Imperative unausgesprochen, doch der Zusammenhang ist ein an Gott gerichtetes Gebet. Ein Gottesname wird nicht ergänzt; die deutsche Formulierung macht lediglich die Anrede idiomatisch.
translation_notes:
  register: Moderne, würdevolle Gebetssprache mit zwei parallelen Imperativpaaren. Die konkreten Bilder des Erweckens, Ausgießens, Niederbeugens und Zurückstoßens bleiben erhalten; unnötig altertümliche Formen werden vermieden.
