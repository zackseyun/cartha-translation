  text: Give the recompense of those who wait for you[b][a], and let your prophets be found faithful.
translation:
  language: de
  text: Gib denen, die auf dich warten[a], ihren Lohn, und lass deine Propheten sich als zuverlässig erweisen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die auf dich hoffen“. Das hebräische Verb kann sowohl Warten als auch Hoffen ausdrücken.'
    reason: lexical_alternative
  - marker: b
    text: 'Die griechische Überlieferung weicht hier stark ab; sie lautet sinngemäß: „Wer den Herrn fürchtet, wird Unterweisung empfangen, und wer sich früh aufmacht, wird Wohlgefallen finden.“ Vermutlich liegt ihr eine andere Textform zugrunde.'
    reason: alternative_reading
lexical_decisions:
- source_word: תן
  choice: Gib
  rationale: Der Imperativ von נתן formuliert eine unmittelbare Bitte an Gott; „Gib“ ist im Deutschen natürlich, klar und würdevoll.
- source_word: פעלת
  choice: ihren Lohn
  rationale: פעלה kann „Werk/Tat“ oder den daraus folgenden Ertrag beziehungsweise Lohn bezeichnen. Im Zusammenhang der Bitte für die auf Gott Wartenden gibt „ihren Lohn“ den wahrscheinlich gemeinten vergeltenden beziehungsweise gewährenden Sinn idiomatisch wieder.
- source_word: קויך
  choice: die auf dich warten
  rationale: Das Partizip von קוה umfasst erwartungsvolles Warten und Hoffen. „Auf dich warten“ bewahrt den zeitlich-erwartenden Zug; „auf dich hoffen“ steht als echte lexikalische Alternative in der Fußnote.
- source_word: ונביאיך
  choice: und deine Propheten
  rationale: Wörtliche und natürliche Wiedergabe der Verbindung mit Possessivsuffix.
- source_word: יאמנו
  choice: lass … als glaubwürdig erwiesen werden
  rationale: Die Form von אמן kann hier Bestätigung, Bewährung oder Erweis der Zuverlässigkeit ausdrücken. Die Formulierung wahrt den Gedanken, dass Gottes Propheten als wahr und vertrauenswürdig bestätigt werden, ohne ihn unnötig zu verengen.
theological_decisions:
- issue: Abweichung zwischen dem erhaltenen hebräischen Text und der griechischen Überlieferung
  choice: Der Haupttext folgt der hebräischen Bitte um Lohn für die auf Gott Wartenden und um Bestätigung seiner Propheten.
  alternative: 'Die griechische Überlieferung lautet sinngemäß: „Wer den Herrn fürchtet, wird Unterweisung empfangen, und wer sich früh aufmacht, wird Wohlgefallen finden.“'
  rationale: Da für diese Stelle ein zuverlässiger hebräischer Text vorliegt, hat er Vorrang. Die erheblich abweichende griechische Lesart wird wegen ihres eigenständigen Textzeugnisses in einer Fußnote dokumentiert.
- issue: Bedeutung von קוה
  choice: „auf dich warten“ im Haupttext
  alternative: „auf dich hoffen“
  rationale: Beide Bedeutungsnuancen sind im hebräischen Verb vorhanden. Der Haupttext bewahrt das erwartungsvolle Warten, während die Fußnote die Vertrauens- und Hoffnungsdimension ausdrücklich offenhält.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, verständlichem Gebetsstil. Die Umstellung zu „Gib denen ihren Lohn“ vermeidet eine schwerfällige Genitivkonstruktion. „Als glaubwürdig erwiesen werden“ hält die Spannung zwischen Bestätigung, Bewährung und Wahrhaftigkeit der Propheten offen.
