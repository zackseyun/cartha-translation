  text: So is the man who has no nest[b][a], resting wherever evening overtakes him.
translation:
  language: de
  text: So ist es mit einem Mann, der kein Nest hat[a] und zur Ruhe kommt, wenn es Abend wird.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der kein Zuhause hat“. Wörtlich steht im Hebräischen „Nest“; das Bild bezeichnet einen fehlenden festen Ort zum Bleiben.'
    reason: lexical_alternative
  - marker: b
    text: 'Die hebräische Zeile ist sehr knapp und möglicherweise textlich unsicher. Die griechische Überlieferung bietet an dieser Stelle einen völlig anderen Wortlaut: „Hört auf mich, ihr Großen des Volkes, und ihr Leiter der Versammlung, hört aufmerksam zu.“'
    reason: textual_variant
lexical_decisions:
- source_word: כן
  choice: So ist es mit
  rationale: Leitet einen Vergleich ein und gibt die knappe hebräische Wendung in natürlichem Deutsch wieder.
- source_word: איש
  choice: einem Mann
  rationale: Bewahrt den maskulinen Singular des hebräischen Textes und passt zur Form eines beispielhaften Einzelfalls.
- source_word: אשר לא קן
  choice: der kein Nest hat
  rationale: קן bedeutet wörtlich „Nest“. Das Bild eines Menschen ohne festen Ort bleibt damit erhalten; „Zuhause“ wäre bereits eine Deutung.
- source_word: המרגיע
  choice: und zur Ruhe kommt
  rationale: Gibt das Partizip idiomatisch wieder, ohne angesichts der knappen und möglicherweise unsicheren Textgestalt die genaue Stammform zu überbestimmen.
- source_word: כאשר יערב
  choice: wenn es Abend wird
  rationale: Entspricht unmittelbar dem zeitlichen Sinn der hebräischen Wendung. Die mögliche Vorstellung, dass der Mann jeweils dort bleibt, wo ihn der Abend erreicht, wird nicht als alleinige Bedeutung in den Haupttext eingetragen.
