  source_fidelity: 'Der deutsche Haupttext gibt den erhaltenen hebräischen Wortlaut angemessen wieder: כן leitet den Vergleich idiomatisch mit „So ist es mit“ ein; איש bleibt als maskuliner exemplarischer Singular erhalten; קן wird transparent als „Nest“ wiedergegeben. „wenn es Abend wird“ entspricht כאשר יערב als offener Zeitangabe, ohne die im Hebräischen nicht ausdrücklich formulierte Lokalangabe („wo immer“) einzutragen. „zur Ruhe kommt“ ist eine vertretbare idiomatische Wiedergabe des partizipialen המרגיע, auch wenn die knappe hebräische Textgestalt keine präzisere grammatische Festlegung nahelegt.'
