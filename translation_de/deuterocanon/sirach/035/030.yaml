  text: For it is better that your children should beg from you than that you should look to the hands of your sons[a][b].
translation:
  language: de
  text: Denn es ist besser, dass deine Kinder dich bitten[a], als dass du auf die Hände deiner Söhne schaust[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »dich anflehen«; das griechische Verb kann eine eindringliche, aus einer Notlage kommende Bitte bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »auf die Hände deiner Söhne schauen«; gemeint ist, von ihrer Unterstützung oder Versorgung abhängig zu sein.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κρεῖσσον
  choice: besser
  rationale: Der Komparativ leitet ein Werturteil ein; »besser« ist die natürliche und genaue deutsche Entsprechung.
- source_word: τέκνα
  choice: Kinder
  rationale: τέκνα bezeichnet allgemein Kinder bzw. Nachkommen und ist weiter gefasst als das spätere υἱῶν.
- source_word: δεηθῆναί σου
  choice: dich um etwas bitten
  rationale: δέομαι mit dem Genitiv der Person bezeichnet eine an diese Person gerichtete, häufig dringliche Bitte. »Um etwas« macht die im Deutschen nötige Ergänzung allgemein, ohne den nicht genannten Gegenstand festzulegen.
- source_word: ἐμβλέπειν εἰς χεῖρας
  choice: auf die Hände … schauen
  rationale: Die konkrete Bildsprache des griechischen Ausdrucks bleibt erhalten; im Zusammenhang bezeichnet sie das erwartungsvolle Schauen auf jemanden, von dem man Versorgung erhofft.
- source_word: υἱῶν
  choice: Söhne
  rationale: υἱῶν ist ausdrücklich maskulin und wird von dem allgemeineren τέκνα unterschieden.
theological_decisions:
- issue: Unterscheidung zwischen τέκνα und υἱῶν
  choice: τέκνα mit »Kinder« und υἱῶν mit »Söhne« wiedergeben
  alternative: Beide Ausdrücke mit »Kinder« wiedergeben
  rationale: Die unterschiedliche Reichweite der beiden griechischen Bezeichnungen soll sichtbar bleiben, ohne die zweite zu verallgemeinern.
- issue: Bild der Hände als Ausdruck von Abhängigkeit
  choice: Das Bild wörtlich bewahren und in einer Fußnote erläutern
  alternative: Im Haupttext sinngemäß »von deinen Söhnen abhängig bist« schreiben
  rationale: Die bildhafte Spannung des Ausgangstextes bleibt so erhalten, während die gemeinte Abhängigkeit verständlich erklärt wird.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau folgt der klaren Gegenüberstellung des griechischen Textes. Die konkrete Wendung mit den Händen wird bewusst nicht aufgelöst; die Fußnote erschließt ihre Bedeutung.
