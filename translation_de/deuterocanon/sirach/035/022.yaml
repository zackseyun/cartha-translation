translation:
  language: de
  text: Jeden Verwundeten kann ein wildes Tier fressen; doch mancher Schlag ist schwerer als ein anderer.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hebräische Wortlaut dieses Verses ist schwierig und vermutlich stellenweise beschädigt. Besonders die Schlusswendung lässt sich nur annähernd erschließen; wörtlicher steht dort etwa: „Es gibt einen Schlag von/mehr als einem Schlag …“.'
    reason: textual_variant
  - marker: b
    text: 'Die griechische Parallelüberlieferung lautet: „Und vor deinen Kindern hüte dich.“ Sie weicht deutlich vom erhaltenen hebräischen Text ab und könnte auf einer anderen Textform beruhen.'
    reason: alternative_reading
lexical_decisions:
- source_word: כל נכה
  choice: jeden Verwundeten
  rationale: נכה wird hier konkret als verletzter oder geschlagener Mensch verstanden; כל ist distributiv. Diese Wiedergabe folgt der möglichen hebräischen Satzstruktur, ohne die schwierige Stelle zu einer Aussage über das Heilen umzudeuten.
- source_word: תאכל חיה
  choice: kann ein wildes Tier fressen
  rationale: תאכל stammt von אכל, „essen, fressen“, und חיה bezeichnet hier am natürlichsten ein Tier beziehungsweise wildes Tier. Das Modalverb „kann“ gibt den sprichwortartigen Charakter wieder.
- source_word: אך
  choice: doch
  rationale: Die adversative Partikel leitet knapp den Gegensatz der zweiten Vershälfte ein.
- source_word: מכה ממכה
  choice: mancher Schlag ist schwerer als ein anderer
  rationale: מכה bezeichnet einen Schlag, eine Verletzung oder Heimsuchung; מן wird vergleichend verstanden. Die Wiederholung bleibt sinngemäß erkennbar, klingt im Deutschen aber natürlich.
- source_word: תנעם
  choice: ist schwerer
  rationale: Die überlieferte Form ist schwierig und möglicherweise beschädigt. Aus Parallelismus und Zusammenhang wird vorsichtig ein Vergleich der Schwere erschlossen.
