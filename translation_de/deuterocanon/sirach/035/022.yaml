review_pass:
  verdict: revise
  source_fidelity: Die erste Vershälfte ist als „Jeden Verwundeten kann ein wildes Tier fressen“ eine vertretbare, nahe am überlieferten Hebräisch bleibende syntaktische Lesung (כל נכה als Objekt, חיה als Subjekt). Die zweite Vershälfte gibt תנעם jedoch ohne textliche Grundlage als „ist schwerer“ wieder. Die erhaltene Form gehört am ehesten zu נעם („angenehm/lieblich sein“) und muss, bei aller offenkundigen Schwierigkeit des Textes, nicht in ihr Gegenteil umgedeutet werden.
  naturalness: Die erste Zeile ist knapp und natürlich. Die wörtlichere Wiedergabe der zweiten Zeile klingt absichtlich spröde; das ist hier vorzuziehen, weil eine glättende deutsche Sinnübertragung den unsicheren hebräischen Text überdeuten würde. Die Anmerkung erklärt die Härte angemessen.
  terminology: „Verwundeter“, „wildes Tier“ und „Schlag“ sind sachlich und registergerecht. „Angenehmer“ bildet die mutmaßliche Bedeutung von תנעם ab, ohne eine nicht belegte Vergleichsaussage über die Schwere von Leid einzuführen. Die griechische Parallelüberlieferung ist korrekt als stark abweichend gekennzeichnet.
  issues:
  - severity: high
    issue: Die Schlusswendung wird als „mancher Schlag ist schwerer als ein anderer“ übersetzt.
    rationale: Das überlieferte תנעם lässt sich nicht mit „ist schwerer“ begründen; es bedeutet wahrscheinlich „ist angenehm/gefällig“. Auch wenn der Text beschädigt oder semantisch rätselhaft ist, darf die Übersetzung nicht einen gegenteiligen, kontextuell vermuteten Sinn als Textsinn ausgeben.
  - severity: medium
    issue: Fußnote a beschreibt die Schlusswendung unvollständig und stützt indirekt die freie Umdeutung.
    rationale: Die Fußnote muss die auffällige mutmaßliche Bedeutung von תנעם ausdrücklich nennen. „Von/mehr als“ erfasst nur ממכה und verschweigt das entscheidende, schwierige Prädikat.
  - severity: low
    issue: Die englische Audit-Fassung bietet „heilen“ beziehungsweise „Schmerz schlimmer als Schmerz“.
    rationale: Diese Entscheidungen folgen weder der naheliegenden hebräischen Syntax der ersten Hälfte noch der erhaltenen Form תנעם. Die deutsche Fassung sollte dem hebräischen Befund Vorrang geben und die Abweichung nicht übernehmen.
  revised_text: Jeden Verwundeten kann ein wildes Tier fressen; doch es gibt einen Schlag, der angenehmer ist als ein Schlag.[a][b]
  revised_footnotes:
  - marker: a
    text: 'Der hebräische Wortlaut dieses Verses ist schwierig und vermutlich stellenweise beschädigt. Die Schlusswendung lautet wörtlich etwa: „Doch es gibt einen Schlag, der angenehmer ist als ein Schlag.“ Besonders „angenehmer“ ist im Zusammenhang auffällig; der beabsichtigte Sinn bleibt unsicher.'
    reason: textual_variant
  - marker: b
    text: 'Die griechische Parallelüberlieferung lautet: „Und vor deinen Kindern hüte dich.“ Sie weicht deutlich vom erhaltenen hebräischen Text ab und könnte auf einer anderen Textform beruhen.'
    reason: alternative_reading
  revision_rationale: Die Revision bewahrt die plausible, bildhafte Satzstruktur der ersten Hälfte und korrigiert die zweite Hälfte auf die wahrscheinlichste lexikalische Bedeutung des erhaltenen Hebräisch. Da diese Bedeutung im Kontext unerquicklich und der Text vermutlich beschädigt ist, wird keine rekonstruierende Sinnparaphrase geboten; die Unsicherheit wird stattdessen transparent in Fußnote a erläutert. Beide Fußnotenanker bleiben erhalten.
