lexical_decisions:
- source_word: הרף
  choice: Schlag … los
  rationale: Der knappe hebräische Imperativ ist in diesem Zusammenhang unsicher. Die gewählte Wiedergabe folgt der kontextuell angenommenen feindseligen Stoßrichtung, ohne die abweichend mögliche Ableitung im Text zu verschweigen; diese wird in einer Fußnote genannt.
- source_word: על
  choice: gegen
  rationale: In Verbindung mit dem als feindselige Aufforderung verstandenen Imperativ bezeichnet על die Richtung gegen das fremde Volk.
- source_word: עם נכר
  choice: ein fremdes Volk
  rationale: Die Übersetzung bewahrt den kollektiven Sinn von עם und gibt נכר sachlich als „fremd“ wieder.
- source_word: ויראו
  choice: und lass sie … sehen
  rationale: Die Präformativform kann nach dem Imperativ volitiv beziehungsweise jussiv verstanden werden. „Lass sie … sehen“ bringt diese Aufforderungsfolge natürlich zum Ausdruck.
- source_word: גבורתיך
  choice: deine Machttaten
  rationale: Der Plural bezeichnet sichtbare Erweise der Macht und nicht nur abstrakte Stärke; „Machttaten“ bewahrt diesen konkreten Sinn.
theological_decisions:
- issue: Starke Abweichung zwischen dem erhaltenen hebräischen Text und der griechischen Parallele
  choice: Der erhaltene hebräische Text bildet die Grundlage der Übersetzung; die Abweichung der griechischen Überlieferung wird in einer Fußnote offengelegt.
  alternative: Eine Übersetzung nach dem griechischen Text würde von Fürsorge, Sichsetzen, Niederlegen und dem Empfang eines Kranzes sprechen.
  rationale: Wo ein hebräischer Sirach-Text erhalten ist, hat er hier Vorrang. Die griechische Parallele stellt offenbar eine wesentlich andere Textform dar und darf nicht stillschweigend mit dem Hebräischen harmonisiert werden.
- issue: Unsicherheit der Aufforderung הרף
  choice: Als feindselige Aufforderung „Schlag … los“ im Haupttext, mit offengelegter lexikalischer Alternative.
  alternative: „Lass von einem fremden Volk ab“ oder „Verhalte dich einem fremden Volk gegenüber gelassen“.
  rationale: Form und Fügung sind knapp und nicht eindeutig. Der Haupttext folgt der kontextuellen Deutung der geprüften englischen Fassung, während die reguläre Bedeutung des Verbs als echte Möglichkeit erhalten bleibt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Machttaten“ ist verständlich und bewahrt den konkreten Plural. Die Wiederaufnahme des kollektiven „Volkes“ mit „sie“ ist im Deutschen natürlich und bezieht sich auf dessen Angehörige.
