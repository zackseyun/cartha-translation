  yaml_path: translation/deuterocanon/sirach/035/032.yaml
  text: On the day the days of your life are completed[a], and at the time of your death, distribute your inheritance.
translation:
  language: de
  text: An dem Tag, an dem die Tage deines Lebens vollendet sind,[a] und zur Zeit deines Todes verteile dein Erbe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „am Ende deines Lebens“; wörtlich spricht der griechische Text vom Vollendetwerden der Tage deines Lebens.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἡμέρᾳ
  choice: An dem Tag
  rationale: Die temporale Wendung mit ἐν und Dativ bezeichnet einen bestimmten Zeitpunkt; „an dem Tag“ ist im Deutschen natürlich und wahrt den konkreten Zeitbezug.
- source_word: συντελείας
  choice: vollendet sind
  rationale: Das Substantiv bezeichnet die Vollendung beziehungsweise das Zu-Ende-Kommen. Die verbale Wiedergabe ergibt zusammen mit „die Tage deines Lebens“ einen verständlichen deutschen Satz und bewahrt die Wiederholung von „Tag/Tage“ im Griechischen.
- source_word: ἡμερῶν ζωῆς σου
  choice: die Tage deines Lebens
  rationale: Die Genitivverbindung wird formal und zugleich idiomatisch wiedergegeben; das biblisch geprägte Bild der gezählten Lebenstage bleibt erhalten.
- source_word: καιρῷ τελευτῆς
  choice: zur Zeit deines Todes
  rationale: καιρός bezeichnet hier den maßgeblichen Zeitpunkt, τελευτή im Zusammenhang der Erbverteilung das Lebensende beziehungsweise den Tod. „Zur Zeit deines Todes“ gibt den naheliegenden Sinn klar wieder.
- source_word: διάδος
  choice: verteile
  rationale: Der Aoristimperativ fordert zu einer konkreten Zuteilung auf. Bei einem Erbe drückt „verteile“ den Sinn genauer aus als das allgemeinere „gib“.
- source_word: κληρονομίαν
  choice: dein Erbe
  rationale: κληρονομία bezeichnet das Erbe beziehungsweise den ererbten oder zu vererbenden Besitz. Obwohl im Griechischen kein Possessivpronomen steht, macht der Kontext deutlich, dass das eigene Erbe gemeint ist; „dein Erbe“ ist im Deutschen natürlich und vermeidet den missverständlichen bestimmten Artikel.
theological_decisions:
- issue: Ob τελευτή allgemein als „Ende“ oder konkret als „Tod“ wiederzugeben ist
  choice: Tod
  alternative: Ende / Lebensende
  rationale: Im Zusammenhang mit der abschließenden Verteilung des Erbes bezeichnet τελευτή am natürlichsten den Tod. Diese Wiedergabe erhält die praktische Eindringlichkeit, ohne eine weitergehende theologische Deutung einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die auffällige Wiederholung „Tag … Tage“ wurde als Bild des griechischen Textes beibehalten; eine Fußnote bietet die flüssigere sinngemäße Alternative.
