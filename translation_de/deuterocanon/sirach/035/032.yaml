  naturalness: Modernes, verständliches und würdiges Standarddeutsch. Die Wiederholung „Tag ... Tage“ ist leicht markiert, aber als bewusste Nähe zur griechischen Formulierung gut vertretbar. Der Satz ist syntaktisch klar.
