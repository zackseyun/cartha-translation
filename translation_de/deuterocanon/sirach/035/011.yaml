  text: Erbarme dich der Stadt deiner Heiligkeit[a], Jerusalem[b], der festen Stätte, an der du wohnst.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die Stadt deiner Heiligkeit“. Die Wendung kann auch als „deine heilige Stadt“ oder, stärker deutend, als „die Stadt deines Heiligtums“ verstanden werden.'
