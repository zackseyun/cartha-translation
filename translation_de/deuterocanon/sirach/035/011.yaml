    reason: textual_variant
lexical_decisions:
- source_word: רחם
  choice: Erbarme dich
  rationale: Der Imperativ bezeichnet die Bitte um mitfühlendes Erbarmen. „Erbarme dich“ bewahrt den unmittelbaren, gebetshaften Ton und ist im Deutschen idiomatisch.
- source_word: קרית
  choice: Stadt
  rationale: קריה/קרית bezeichnet eine Stadt; für Jerusalem ist „Stadt“ die natürliche und angemessene Entsprechung.
- source_word: קדשך
  choice: deiner Heiligkeit
  rationale: Die wörtliche Genitivverbindung „Stadt deiner Heiligkeit“ bewahrt die verdichtete Formulierung des Hebräischen und legt nicht vorschnell fest, ob die Heiligkeit Jerusalems oder das dortige Heiligtum gemeint ist.
- source_word: ירושלים
  choice: Jerusalem
  rationale: Die im Deutschen übliche Form des Ortsnamens.
- source_word: מכון
  choice: feste Stätte
  rationale: מכון bezeichnet einen fest gegründeten oder bestimmten Ort. „Feste Stätte“ erhält dieses Bedeutungselement, ohne es mit dem folgenden Begriff des Wohnens zu verschmelzen.
- source_word: שבתך
  choice: an der du wohnst
  rationale: Das Wort bezeichnet Gottes Wohnen oder Bleiben. Die verbale Wiedergabe ist in modernem Deutsch natürlicher als „Stätte deines Wohnens“ und bewahrt dennoch die Aussage.
theological_decisions:
- issue: Deutung der verdichteten Verbindung קרית קדשך
  choice: Stadt deiner Heiligkeit
  alternative: deine heilige Stadt; Stadt deines Heiligtums
  rationale: Die abstrakte Genitivform entspricht dem hebräischen Wortlaut und lässt offen, ob die Heiligkeit der Stadt allgemein oder das Heiligtum in ihr im Vordergrund steht. Diese Spannung wird nicht im Haupttext aufgelöst.
- issue: Verhältnis des erhaltenen hebräischen Textes zur stark abweichenden griechischen Parallele
  choice: Der hebräische Text wird als Bitte um Erbarmen mit Jerusalem übersetzt; die griechische Abweichung wird in einer Fußnote dokumentiert.
  alternative: Die griechische Lesart zugrunde legen oder beide Überlieferungen harmonisieren
  rationale: Da für diese Stelle ein hebräischer Text erhalten ist, hat er Vorrang. Die inhaltlich andere griechische Fassung ist dennoch als bedeutende Textvariante transparent auszuweisen.
translation_notes:
  register: Modernes, würdevolles Gebetsdeutsch. Der Genitiv nach „Erbarme dich“ ist bewusst beibehalten, da er in diesem gehobenen Kontext natürlich wirkt. Die ungewöhnliche Wendung „Stadt deiner Heiligkeit“ wahrt die Mehrdeutigkeit des Hebräischen; „feste Stätte, an der du wohnst“ verbindet Quellennähe mit verständlichem Gegenwartsdeutsch.
