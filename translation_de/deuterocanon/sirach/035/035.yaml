  text: A yoke and a strap will bend the neck[a], and for a wicked servant there are racks and tortures.
translation:
  language: de
  text: Joch und Riemen werden den Nacken beugen, und für einen bösen Sklaven[a] gibt es Streckbänke und Foltern.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »bösen Hausdiener«. Das griechische Wort kann einen Diener des Hausstands bezeichnen; der Zusammenhang von Zwang und Folter legt hier »Sklave« nahe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ζυγός
  choice: Joch
  rationale: Das Bild des gebeugten Nackens verlangt hier die konkrete Bedeutung »Joch«, nicht »Waage« oder »Paar«.
- source_word: ἱμάς
  choice: Riemen
  rationale: Das Wort bezeichnet einen ledernen Riemen oder eine Schlaufe; »Riemen« ist gegenwärtiges, klares Deutsch und passt zum Joch als Zwangsmittel.
- source_word: κάμψουσιν
  choice: werden … beugen
  rationale: Die Zukunftsform und das körperliche Bild des griechischen Verbs werden unmittelbar bewahrt.
- source_word: τράχηλον
  choice: den Nacken
  rationale: Die anatomische Bedeutung wird direkt und idiomatisch wiedergegeben.
- source_word: οἰκέτῃ
  choice: für einen … Sklaven
  rationale: οἰκέτης kann allgemein einen Hausdiener bezeichnen, doch der Zusammenhang von Zwang und Folter hebt den unfreien Status hervor. Die Dativkonstruktion wird mit »für« wiedergegeben.
- source_word: κακούργῳ
  choice: böswilligen
  rationale: Das Adjektiv kennzeichnet die Person als böse beziehungsweise Übles tuend. »Böswillig« erhält die moralische Wertung, ohne die Bedeutung auf »kriminell« zu verengen.
- source_word: στρέβλαι
  choice: Streckbänke
  rationale: Gemeint sind Foltergeräte, besonders Geräte zum Verdrehen oder Strecken. »Streckbänke« bewahrt das konkrete Bild und den Plural.
- source_word: βάσανοι
  choice: Folterqualen
  rationale: Im Strafkontext bezeichnet das Wort durch Folter zugefügte Qualen. Die Wiedergabe unterscheidet diese von den zuvor genannten Foltergeräten.
theological_decisions:
- issue: Wiedergabe des Standesbegriffs οἰκέτῃ
  choice: Sklave
  alternative: Hausdiener / Diener
  rationale: Der Begriff lässt eine breitere Bezeichnung für einen Angehörigen des Hausstands zu. Wegen der ausdrücklich gewaltsamen Züchtigung ist hier jedoch die unfreie, der Verfügungsgewalt eines Herrn unterstehende Stellung besonders hervorgehoben. Die alternative lexikalische Möglichkeit bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die harte Sprache des Ausgangstextes wird weder abgeschwächt noch zustimmend erläutert. Der fehlende Verbalausdruck im zweiten griechischen Satzglied wird für verständliches Deutsch durch »gibt es« ergänzt.
