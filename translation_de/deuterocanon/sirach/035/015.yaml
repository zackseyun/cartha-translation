  text: Hear the prayer of your servants[b][a], according to your favor toward your people.
translation:
  language: de
  text: Höre das Gebet deiner Diener[b] nach deinem Wohlwollen für dein Volk.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „nach deinem Willen für dein Volk“. Das hebräische Wort רצון kann sowohl „Wille“ als auch „Wohlwollen“ oder „Gunst“ bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Die griechische Parallelüberlieferung bietet an dieser Stelle einen ganz anderen Text: „Wer das Gesetz sucht, wird davon erfüllt werden; wer aber heuchelt, wird daran zu Fall kommen.“ Dies weist auf eine erhebliche Abweichung zwischen der erhaltenen hebräischen und der griechischen Textform des Sirachbuches hin.'
    reason: textual_variant
lexical_decisions:
- source_word: תשמע
  choice: Höre
  rationale: Das Qal-Imperfekt hat in der Gebetssprache auffordernden beziehungsweise bittenden Sinn. Der deutsche Imperativ gibt diese unmittelbare Bitte natürlich wieder, ohne die Modalität unnötig festzulegen.
- source_word: תפלת
  choice: das Gebet
  rationale: Die Singularform im Status constructus wird als „das Gebet deiner Diener“ wiedergegeben.
- source_word: עבדיך
  choice: deiner Diener
  rationale: עבד kann „Sklave“ oder „Diener“ bedeuten. In der an Gott gerichteten Gebetssprache steht hier die hingebungsvolle Dienstbeziehung im Vordergrund, weshalb „Diener“ kontextgemäß ist.
- source_word: כרצונך
  choice: wie es deinem Wohlwollen ... entspricht
  rationale: רצון kann Wille, Wohlwollen oder Gunst bezeichnen. In Verbindung mit „gegenüber deinem Volk“ liegt eine wohlwollende Haltung nahe; die Formulierung bleibt zugleich als Maßgabe für das Erhören verständlich.
- source_word: על
  choice: gegenüber
  rationale: Bei einer wohlwollenden Haltung zu einem Volk gibt „gegenüber“ die relationale Ausrichtung idiomatisch wieder.
- source_word: עמך
  choice: deinem Volk
  rationale: Die schlichte gemeinschaftliche und bundestheologische Bezeichnung wird ohne zusätzliche Deutung bewahrt.
theological_decisions:
- issue: Wiedergabe von עבדיך in der Anrede Gottes
  choice: deiner Diener
  alternative: deiner Sklaven
  rationale: Der Gebetszusammenhang betont den Dienst für Gott und nicht den gesellschaftlichen Rechtsstatus der Betreffenden.
- issue: Bedeutung von כרצונך
  choice: wie es deinem Wohlwollen gegenüber deinem Volk entspricht
  alternative: nach deinem Willen über dein Volk
  rationale: „Wohlwollen“ bewahrt die wahrscheinlich benevolente Bedeutung, während die Fußnote die echte Möglichkeit „Wille“ offenhält.
- issue: Starke Abweichung der griechischen Parallelüberlieferung
  choice: Der gesicherte hebräische Text bildet den Haupttext; die griechische Fassung wird in einer Fußnote dokumentiert.
  alternative: Die griechische Fassung in den Haupttext übernehmen.
  rationale: Die angegebene hebräische Quelle ist hier hochsicher und validiert. Die erheblich andere griechische Überlieferung darf dennoch nicht verschwiegen oder harmonisiert werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Hauptsatz bleibt als direkte Gebetsbitte knapp; die etwas entfaltete zweite Satzhälfte vermeidet die im Deutschen missverständliche Formulierung „nach deinem Wohlwollen über dein Volk“. Sämtliche textlichen und lexikalischen Unsicherheiten werden in den markierten Fußnoten offengelegt.
