base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/035/039.yaml
  text: The prayer of the humble has passed through the clouds[a], and until it draws near, it will not be comforted[b];
translation:
  language: de
  text: Das Gebet eines Demütigen ist durch die Wolken gedrungen[a]; und bis es nahekommt, findet es keinen Trost[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ist durch die Wolken hindurchgegangen“. Das Bild zeigt, wie das Gebet ungehindert zu Gott emporsteigt.'
    reason: lexical_alternative
  - marker: b
    text: 'Im Griechischen bleiben die Subjekte unausgesprochen. Möglich ist auch: Das Gebet kommt nahe, und der demütige Mensch findet bis dahin keinen Trost. Der Text kann das Gebet aber auch durchgehend wie eine Person darstellen.'
    reason: alternative_reading
lexical_decisions:
- source_word: προσευχὴ ταπεινοῦ
  choice: das Gebet eines Demütigen
  rationale: προσευχή bezeichnet hier das an Gott gerichtete Gebet. ταπεινός kann sowohl Demut als auch Niedrigkeit oder Bedrängnis bezeichnen; „eines Demütigen“ bewahrt den naheliegenden geistlich-ethischen Sinn, ohne die soziale Dimension auszuschließen.
- source_word: νεφέλας διῆλθεν
  choice: ist durch die Wolken gedrungen
  rationale: Das Aoristverb διέρχομαι beschreibt das Hindurchgehen. „Durchgedrungen“ gibt das kraftvolle poetische Bild eines Gebets wieder, das die Wolken auf dem Weg zu Gott überwindet.
- source_word: ἕως συνεγγίσῃ
  choice: bis es nahekommt
  rationale: Das unausgesprochene Subjekt kann im Zusammenhang am ehesten das Gebet sein. „Nahekommen“ lässt offen, wem oder welchem Ziel es sich nähert, wie auch der griechische Text.
- source_word: οὐ μὴ παρακληθῇ
  choice: findet es keinen Trost
  rationale: Die starke Verneinung οὐ μή und das Passiv von παρακαλέω werden in natürlichem Deutsch als „keinen Trost finden“ wiedergegeben. Zugleich bleibt die Personifikation des Gebets erhalten.
theological_decisions:
- issue: Subjektwechsel oder fortgesetzte Personifikation im zweiten Satzteil
  choice: 'Das Gebet bleibt Subjekt: Es kommt nahe und findet bis dahin keinen Trost.'
  alternative: Das Gebet kommt nahe, während der demütige Mensch bis dahin nicht getröstet wird; oder der demütige Mensch kommt selbst nahe.
  rationale: Im Griechischen sind die Subjekte der beiden Verben nicht ausdrücklich genannt. Das grammatische Hauptwort προσευχή legt eine fortgesetzte Personifikation nahe, doch ein gedanklicher Wechsel zum Betenden bleibt möglich. Die Fußnote macht diese echte Mehrdeutigkeit sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die poetische Bildsprache und die Mehrdeutigkeit der unausgesprochenen griechischen Subjekte werden bewahrt; erläuterungsbedürftige Alternativen stehen in den Fußnoten.
