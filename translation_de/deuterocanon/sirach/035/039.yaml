  naturalness: „Das Gebet eines Demütigen ist durch die Wolken gedrungen“ ist würdiges, gut verständliches modernes Standarddeutsch. „Findet es keinen Trost“ ist als personifizierte Fortführung des Gebetsbildes poetisch, aber verständlich und stilistisch passend.
