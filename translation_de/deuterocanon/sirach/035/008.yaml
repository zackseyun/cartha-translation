lexical_decisions:
- source_word: השבת ראש
  choice: Fasse ... zusammen
  rationale: Der erhaltene hebräische Wortlaut ist schwierig. In Verbindung mit dem griechischen κεφαλαίωσον („zusammenfassen, auf den Hauptpunkt bringen“) ergibt die Wendung die Aufforderung, eine Rede knapp zusammenzufassen.
- source_word: פאתי מואב
  choice: deine Rede; sage mit wenigen Worten viel
  rationale: Die überlieferte hebräische Lesart ist an dieser Stelle offenbar gestört und ergibt wörtlich keinen sinnvollen Zusammenhang. Die griechische Parallele λόγον, ἐν ὀλίγοις πολλά bewahrt wahrscheinlich den gemeinten Sinn.
- source_word: κεφαλαίωσον λόγον
  choice: Fasse deine Rede zusammen
  rationale: Die griechische Parallele bezeichnet das knappe Zusammenfassen oder Auf-den-Punkt-Bringen einer Rede.
- source_word: ἐν ὀλίγοις πολλά
  choice: sage mit wenigen Worten viel
  rationale: Die knappe griechische Wendung bedeutet idiomatisch, mit wenigem viel auszudrücken; „mit wenigen Worten“ macht dies im Deutschen natürlich verständlich.
- source_word: γίνου ὡς γινώσκων
  choice: Sei wie einer, der Bescheid weiß
  rationale: Die griechische Fassung bietet an der unsicheren hebräischen Stelle eine klare Weisheitsmahnung. „Bescheid weiß“ ist gegenwärtiges, natürliches Deutsch und bewahrt den Gedanken tatsächlicher Kenntnis, ohne ihn zu überdeuten.
- source_word: ἅμα σιωπῶν
  choice: und zugleich schweigt
  rationale: „Zugleich“ gibt das griechische ἅμα unmittelbar wieder und bewahrt die Spannung zwischen Wissen und schweigender Zurückhaltung.
