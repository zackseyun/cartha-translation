  text: Put a child to work[a], and you will find rest; leave his hands idle, and he will seek freedom.
translation:
  language: de
  text: Halte ein Kind[a] zur Arbeit an[b], dann wirst du Ruhe finden; lass ihm die Hände frei, und es wird nach Freiheit streben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Kind“ kann hier auch einen jungen Menschen oder einen jungen Diener im Haushalt bezeichnen.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher, aber im Deutschen unklar: „Arbeite mit/an einem Kind.“ Gemeint ist wahrscheinlich, das Kind mit Arbeit zu beschäftigen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔργασαι ἐν παιδί
  choice: Halte ein Kind zur Arbeit an
  rationale: Die knappe griechische Verbindung ist wörtlich schwer nachzubilden („arbeite mit/an einem Kind“). Die gewählte Formulierung gibt den imperativischen Sinn als verständliche Anweisung wieder, ohne übermäßige Härte in den Wortlaut einzutragen; die formale Mehrdeutigkeit wird in einer Fußnote bewahrt.
- source_word: παιδί
  choice: Kind
  rationale: παιδί bezeichnet zunächst ein Kind beziehungsweise einen jungen Menschen, kann im antiken Haushalt aber auch einen jungen Diener meinen. „Kind“ passt zum unmittelbaren Charakter des Weisheitsspruchs; die soziale Bedeutungsbreite wird angemerkt.
- source_word: εὑρήσεις ἀνάπαυσιν
  choice: dann wirst du Ruhe finden
  rationale: Die Wendung bildet sowohl das zukünftige Ergebnis als auch die übliche Bedeutung von ἀνάπαυσις („Ruhe“, „Erholung“) direkt und idiomatisch ab.
- source_word: ἄνες χεῖρας αὐτῷ
  choice: lass ihm die Hände frei
  rationale: Die deutsche Redewendung bewahrt das konkrete Bild der Hände und gibt ἄνες als Lockern beziehungsweise Freigeben wieder. Sie vermeidet es, „Untätigkeit“ ausdrücklich in den Haupttext einzufügen, da dieses Wort im Griechischen nicht steht.
- source_word: ζητήσει ἐλευθερίαν
  choice: es wird nach Freiheit streben
  rationale: „Nach Freiheit streben“ gibt das zielgerichtete ζητήσει und die Grundbedeutung von ἐλευθερία wieder. Der Zusammenhang legt Freiheit von häuslicher Aufsicht nahe, doch diese kontextuelle Einengung wird nicht anstelle des griechischen Wortes in den Text gesetzt.
theological_decisions:
- issue: Sozialethische Bedeutung von παιδί und ἐλευθερία
  choice: Der Haupttext gibt den Spruch als Unterweisung über ein Kind wieder und behält „Freiheit“ als offenen Ausdruck bei.
  alternative: παιδί als „junger Diener“ und ἐλευθερία als „Ungebundenheit“, „Eigenwille“ oder „Loslösung“ wiederzugeben.
  rationale: Der griechische Wortlaut erlaubt bei παιδί eine häuslich-dienstliche Nebenbedeutung, entscheidet aber nicht eindeutig für „Sklave“ oder „Diener“. Ebenso bezeichnet ἐλευθερία tatsächlich Freiheit; eine moralisch abwertende Wiedergabe wie „Zügellosigkeit“ würde die Spannung des Spruchs vorschnell auflösen.
translation_notes:
  register: Moderner, würdiger Spruchstil mit klarer Parallelstruktur. „Die Hände frei lassen“ erhält das griechische Körperbild und schafft zugleich einen natürlichen Bezug zur folgenden „Freiheit“. Die altertümliche soziale Härte wird weder verschärft noch beschönigt.
