  source_fidelity: 'Die Übersetzung gibt die Imperativ-Folge und die Ergebnis-Aussagen des Griechischen zuverlässig wieder: ἔργασαι ἐν παιδί als verständliches „Halte ein Kind zur Arbeit an“, εὑρήσεις ἀνάπαυσιν als „wirst du Ruhe finden“, ἄνες χεῖρας αὐτῷ mit dem beibehaltenen Hand-Bild und ζητήσει ἐλευθερίαν als „wird nach Freiheit streben“. Die Fußnoten machen sowohl die semantische Spannweite von παιδί als auch die ungewöhnlich knappe Konstruktion von ἔργασαι ἐν παιδί transparent, ohne eine unsichere Deutung in den Haupttext zu verlagern.'
  naturalness: Der Text ist klares, modernes Standarddeutsch und bewahrt einen knappen, spruchhaften Ton. „Halte ... zur Arbeit an“ ist idiomatisch; „lass ihm die Hände frei“ ist eine natürliche deutsche Entsprechung, die das griechische Bild nicht unnötig paraphrasiert.
  terminology: „Kind“ und „Freiheit“ sind lexikalisch angemessen und vermeiden eine voreilige sozialgeschichtliche oder moralische Einengung. Die Anmerkung zu einem möglichen jungen Hausdiener trägt der historischen Bedeutungsbreite von παιδί Rechnung. „Ruhe“ gibt ἀνάπαυσις treffend wieder.
