translation:
  language: de
  text: Versammle alle Stämme Jakobs[a], und lass sie erben wie in früheren Tagen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Parallelüberlieferung bietet an dieser Stelle stattdessen: „Unter Würdenträgern stelle dich nicht gleich, und wenn ein anderer spricht, schwätze nicht viel.“ Offenbar liegt eine andere Textüberlieferung oder Verszuordnung vor als im erhaltenen Hebräisch.'
    reason: textual_variant
lexical_decisions:
- source_word: אסוף
  choice: Versammle
  rationale: Der Imperativ von אסף ruft dazu auf, Zerstreute wieder zusammenzuführen. „Versammle“ ist im Deutschen natürlich und bewahrt den feierlichen Aufforderungscharakter.
- source_word: כל שבטי יעקב
  choice: alle Stämme Jakobs
  rationale: Die knappe Genitivkonstruktion gibt die hebräische Verbindung direkt wieder und bewahrt den Bezug auf den Stammvater Jakob.
- source_word: ויתנחלו
  choice: und lass sie ihr Erbe antreten
  rationale: Die Verbform von נחל bezeichnet hier das Erlangen beziehungsweise Inbesitznehmen eines Erbteils. „Ihr Erbe antreten“ ist idiomatisches Deutsch und lässt den im Verb enthaltenen Erbgedanken erkennen, ohne ausdrücklich „Land“ hinzuzufügen.
- source_word: כימי קדם
  choice: wie in früheren Tagen
  rationale: Die Wendung verweist auf eine vergangene, alte Zeit und trägt hier den Gedanken der Wiederherstellung. „Wie in früheren Tagen“ ist modern, würdig und gut verständlich.
theological_decisions:
- issue: Starke Abweichung zwischen dem erhaltenen hebräischen Text und der griechischen Parallelüberlieferung
  choice: Der Haupttext folgt dem erhaltenen Hebräisch und gibt das Gebet um Sammlung und erneuten Erbbesitz wieder.
  alternative: 'Die griechische Parallelüberlieferung lautet sinngemäß: „Unter Vornehmen stelle dich ihnen nicht gleich, und wenn ein anderer spricht, rede nicht viel daher.“'
  rationale: Da für diesen Vers ein hebräischer Text mit hoher Zuverlässigkeit vorliegt, bildet er die Grundlage der Übersetzung. Die völlig andere griechische Lesart wird als textgeschichtliche beziehungsweise versnumerische Abweichung offengelegt, nicht in den Haupttext eingemischt.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gebetsartigem Ton. Die Formulierung bleibt nah an der hebräischen Syntax, verwendet aber mit „ihr Erbe antreten“ eine natürliche deutsche Wendung. Der textkritische Befund wird ausschließlich in der Fußnote erläutert.
