  source_fidelity: Der Haupttext folgt zutreffend dem erhaltenen hebräischen Imperativ אסוף und der Jussiv-/Wunschform ויתנחלו. „Ihr Erbe antreten“ ist jedoch im heutigen Deutsch primär die formale Übernahme einer Erbschaft nach einem Todesfall und gibt den hier gemeinten Erbteil-/Besitznahmegedanken weniger genau wieder.
