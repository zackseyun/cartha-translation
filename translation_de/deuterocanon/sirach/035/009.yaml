  terminology: „Stämme Jakobs“ und „Erbe/erben“ bewahren die traditionelle, theologisch nicht überdeutete Sprache des Ausgangstextes. „Würdenträgern“ gibt μεγιστάνων angemessen wieder; „schwätze nicht viel“ bildet das abwertende ἀδολέσχει, ohne stärker zu interpretieren.
