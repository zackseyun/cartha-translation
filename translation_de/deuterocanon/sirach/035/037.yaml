  text: For idleness has taught much evil[a].
translation:
  language: de
  text: Denn Müßiggang hat viel Böses gelehrt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Denn Faulheit hat viel Böses gelehrt.“ Das griechische Wort ἀργία kann Müßiggang, Faulheit oder Untätigkeit bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλὴν
  choice: viel
  rationale: Bei dem singularischen Abstraktum κακία bezeichnet πολύς das Ausmaß; daher ist „viel“ im Deutschen natürlicher als eine zählende Wiedergabe.
- source_word: γὰρ
  choice: denn
  rationale: γάρ leitet eine Begründung oder Erläuterung ein; „denn“ bewahrt diese Verknüpfung knapp und transparent.
- source_word: κακίαν
  choice: Böses
  rationale: κακία bezeichnet hier allgemein moralisch Schlechtes oder Bosheit. „Böses“ erhält die Weite des Ausdrucks, ohne ihn auf „Arglist“ oder ein bestimmtes Laster einzuengen.
- source_word: ἐδίδαξεν
  choice: hat ... gelehrt
  rationale: Die Lehrmetapher des griechischen Verbs wird ausdrücklich bewahrt. Das deutsche Perfekt gibt die aus Erfahrung gewonnene, fortwirkende allgemeine Aussage natürlich wieder.
- source_word: ἡ ἀργία
  choice: der Müßiggang
  rationale: ἀργία bezeichnet Arbeitslosigkeit im Sinne von Untätigkeit oder Trägheit. „Müßiggang“ ist in diesem Weisheitswort natürlich und würdevoll; „Faulheit“ ist stärker charakterbezogen, „Untätigkeit“ neutraler.
