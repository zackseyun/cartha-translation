  yaml_path: translation/deuterocanon/sirach/035/031.yaml
  text: In all your works be preeminent[a]; do not give a blemish to your honor.
translation:
  language: de
  text: Bei allem, was du tust, sei herausragend; füge deiner Ehre keinen Makel zu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Füge deinem Ansehen keinen Makel zu.“ Das griechische Wort kann hier Ehre, Ansehen oder guten Ruf bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν πᾶσι τοῖς ἔργοις σου
  choice: Bei allem, was du tust
  rationale: Gibt die umfassende Wendung idiomatisch und verständlich wieder; der konkrete Bezug auf die eigenen Taten bleibt erhalten.
- source_word: γίνου ὑπεράγων
  choice: sei herausragend
  rationale: Das Imperativgefüge fordert zu einem Verhalten auf, das über das Gewöhnliche hinausgeht. „Herausragend“ bewahrt diesen steigernden Sinn, ohne unnatürlich zu wirken.
- source_word: μὴ δῷς μῶμον
  choice: lass keinen Makel … fallen
  rationale: Die deutsche Wendung bewahrt das Bild des Makels und gibt das griechische Verbot in natürlicher Form wieder.
- source_word: ἐν τῇ δόξῃ σου
  choice: auf deine Ehre
  rationale: δόξα bezeichnet hier im weisheitlich-ethischen Zusammenhang am ehesten die persönliche Ehre oder das öffentliche Ansehen, nicht göttlichen Lichtglanz.
theological_decisions:
- issue: Bedeutung von δόξα im weisheitlich-ethischen Zusammenhang
  choice: Ehre
  alternative: Ansehen; guter Ruf; Herrlichkeit
  rationale: Der Zusammenhang betrifft tadelloses Handeln und die Vermeidung von Schande. „Ehre“ wahrt sowohl die persönliche als auch die soziale Dimension; die Fußnote hält die mögliche Nuance des öffentlichen Ansehens offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die erste Hälfte ist bewusst idiomatisch formuliert; die zweite bewahrt die griechische Metapher des Makels. Der Fußnotenmarker steht unmittelbar bei der mehrdeutigen Wiedergabe von δόξα.
