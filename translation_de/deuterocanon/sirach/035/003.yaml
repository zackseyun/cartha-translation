base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/035/003.yaml
  text: Speak, elder, for it is fitting for you—yet with accurate knowledge, and do not hinder the music.[b][a]
translation:
  language: de
  text: Sprich, Ältester, denn es ist dir angemessen, mit genauer Kenntnis zu sprechen, und störe die Musik nicht.[b][a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der hier überlieferte hebräische Text gehört offenbar nicht zu diesem Vers. Daher folgt die Übersetzung hauptsächlich der griechischen Parallelüberlieferung.
    reason: textual_variant
  - marker: b
    text: 'Oder: „Unterbrich die musikalische Darbietung nicht.“ Der griechische Ausdruck kann den gesamten musikalischen Vortrag bezeichnen, nicht nur Musik im abstrakten Sinn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Λάλησον
  choice: Rede
  rationale: Der Imperativ fordert unmittelbar zum Sprechen auf; „Rede“ ist würdevoll und im Deutschen natürlich.
- source_word: πρεσβύτερε
  choice: Ältester
  rationale: Die Anrede kann Alter und gesellschaftlichen Rang bezeichnen. „Ältester“ bewahrt diese Mehrdeutigkeit, auch wenn im Deutschen je nach Kontext ebenfalls ein Amt anklingen kann.
- source_word: πρέπει γάρ σοι
  choice: denn es steht dir zu
  rationale: Gibt die Aussage über Angemessenheit und gesellschaftliche Schicklichkeit idiomatisch wieder.
- source_word: ἐν ἀκριβεῖ ἐπιστήμῃ
  choice: mit genauer Kenntnis
  rationale: Bewahrt den Nachdruck auf Genauigkeit und sachkundigem Reden, ohne die Formulierung unnötig auszudeuten.
- source_word: μὴ ἐμποδίσῃς
  choice: störe … nicht
  rationale: Im Zusammenhang einer musikalischen Darbietung bezeichnet das Verb, dass der Redner deren Ablauf nicht behindern oder unterbrechen soll.
- source_word: μουσικά
  choice: die Musik
  rationale: Das substantivierte Neutrum Plural kann musikalische Dinge oder eine musikalische Darbietung bezeichnen. „Die Musik“ ist die knappste natürliche Wiedergabe; die weitere Bedeutung wird in einer Fußnote genannt.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Anrede „Ältester“ erhält die mögliche Bedeutung von Lebensalter und Rang. Die Gedankenstriche markieren den eingeschobenen Hinweis auf die erforderliche Sachkenntnis, ohne den knappen Mahnton des Verses aufzulösen.
