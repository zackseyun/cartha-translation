  yaml_path: translation/deuterocanon/sirach/035/028.yaml
  text: Do not give authority over yourself in your lifetime to son or wife[a], brother or friend; and do not give your property to another, lest you regret it and have to ask for it back.
translation:
  language: de
  text: Gib zu deinen Lebzeiten weder Sohn noch Frau, weder Bruder noch Freund Macht über dich; und überlass dein Vermögen keinem anderen, damit du es nicht bereust und um sie bitten musst.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „damit du es nicht bereust und ihrer bedürfen musst.“ Die griechische Schlusswendung ist knapp. δέῃ kann hier „bitten“ im Sinn von „um sie bitten“ bedeuten, aber auch ein Bedürfen beziehungsweise Angewiesensein auf das Vermögen ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ δῷς ἐξουσίαν ἐπὶ σὲ
  choice: Gib … nicht Macht über dich
  rationale: Die Wendung bewahrt die konkrete Konstruktion des Griechischen und gibt ἐξουσία als persönliche Verfügungs- oder Entscheidungsgewalt wieder.
- source_word: ἐν ζωῇ σου
  choice: zu deinen Lebzeiten
  rationale: Die geläufige deutsche Wendung gibt die zeitliche Begrenzung prägnant wieder.
- source_word: υἱῷ καὶ γυναικί, ἀδελφῷ καὶ φίλῳ
  choice: weder Sohn noch Frau, weder Bruder noch Freund
  rationale: In einer Verneinung ist die paarige weder-noch-Konstruktion natürlich; die im Griechischen fehlenden Possessivpronomen werden nicht ergänzt.
- source_word: τὰ χρήματά σου
  choice: dein Vermögen
  rationale: χρήματα kann Geld, Besitz oder Vermögenswerte bezeichnen. „Vermögen“ wahrt den umfassenden Sinn und passt zum Gedanken der Übertragung an einen anderen.
- source_word: ἑτέρῳ
  choice: keinem anderen
  rationale: Zusammen mit der fortwirkenden Verneinung ist dies idiomatisches Deutsch für die Warnung, den Besitz nicht einer anderen Person zu überlassen.
- source_word: ἵνα μὴ μεταμεληθεὶς
  choice: damit du es nicht bereust
  rationale: Die finale Konstruktion mit dem Aoristpartizip bezeichnet die zu vermeidende spätere Reue.
- source_word: δέῃ περὶ αὐτῶν
  choice: darum bitten musst
  rationale: Die komprimierte griechische Wendung kann ein Bitten wegen beziehungsweise um die zuvor genannten Vermögenswerte meinen. Die Übersetzung bleibt bewusst etwas offener als „zurückfordern“.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Formulierung „weder … noch“ macht die Aufzählung verständlich, ohne nicht ausdrücklich vorhandene Possessivpronomen einzuführen. Der Haupttext deutet die knappe Schlusswendung kontextbezogen als Bitte um das überlassene Vermögen; die Fußnote bewahrt die lexikalische Mehrdeutigkeit.
