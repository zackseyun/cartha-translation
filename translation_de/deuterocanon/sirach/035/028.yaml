    rationale: Das deutsche Pronominaladverb kann sich auf den gesamten vorherigen Sachverhalt oder auf die Reue beziehen. περὶ αὐτῶν bezieht sich dagegen auf τὰ χρήματά σου. „um sie bitten“ bewahrt den pluralischen Bezug klar.
  - severity: low
    issue: Fußnotenalternative „ihretwegen in Not gerätst“ ist zu interpretierend
    rationale: Die griechische Wendung kann je nach Verständnis ein Bitten um die Gegenstände oder ein Bedürfen ihrer bezeichnen. „In Not geraten“ ist als Folge möglich, aber keine unmittelbare lexikalische Entsprechung und sollte nicht als zentrale Alternative erscheinen.
