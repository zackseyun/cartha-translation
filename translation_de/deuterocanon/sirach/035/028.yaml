  verdict: revise
  source_fidelity: Der Hauptsatz gibt die Warnung vor der Übertragung von ἐξουσία über die eigene Person sowie die zeitliche Einschränkung ἐν ζωῇ σου zutreffend wieder. Auch „Vermögen“ ist für τὰ χρήματα eine angemessene umfassende Wiedergabe. In der Schlusswendung bezieht sich αὐτῶν plural auf die Vermögenswerte; „darum bitten“ lässt im Deutschen den Bezug unnötig unklar.
  naturalness: Modernes, würdiges Deutsch. „… und um sie bitten musst“ ist idiomatisch und macht den Bezug auf das zuvor genannte Vermögen deutlich, ohne das im Griechischen nicht ausdrücklich enthaltene „zurück“ einzutragen.
  terminology: „Macht über dich“ gibt ἐξουσία verständlich wieder; „Vermögen“ deckt den möglichen Bereich von Geld und Besitz ab. Die Fußnote soll δέῃ als Form von δέομαι sachgerecht als „bitten“ bzw. „bedürfen/angewiesen sein“ erläutern, nicht als „in Not geraten“ festlegen.
