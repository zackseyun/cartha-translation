  text: A devious heart causes grief[b][a], and an experienced man will repay him in kind.
translation:
  language: de
  text: Ein verschlagenes Herz verursacht Kummer[b], und ein erfahrener Mann wird es ihm in gleicher Weise vergelten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der letzte Satzteil ist schwer verständlich. Wörtlich lautet das Hebräische ungefähr: „und ein erfahrener Mann wird es in ihm/mit ihm zurückgeben“. Möglich sind auch die Bedeutungen: „wird darauf in gleicher Weise antworten“ oder „wird es ihm entsprechend heimzahlen“.'
    reason: alternative_reading
  - marker: b
    text: 'Der griechische Paralleltext lautet: „Vertraue nicht auf einen Weg ohne Stolpern.“ Er weicht stark vom erhaltenen hebräischen Wortlaut ab und beruht möglicherweise auf einer anderen hebräischen Vorlage oder auf einer verderbten Textüberlieferung.'
    reason: textual_variant
lexical_decisions:
- source_word: לב
  choice: Herz
  rationale: Im Hebräischen bezeichnet לב den inneren Menschen einschließlich Denken und Absicht; „Herz“ bewahrt das geläufige Bild und den moralischen Sinn.
- source_word: עקוב
  choice: verschlagen
  rationale: Das Wort beschreibt moralische Verkrümmung beziehungsweise Hinterlist. „Verschlagen“ ist im modernen Deutschen verständlich und legt den Akzent auf eine unredliche innere Haltung.
- source_word: יתן
  choice: verursacht
  rationale: Wörtlich steht „gibt“; zusammen mit „Kummer“ ist im Deutschen eine kausative Wiedergabe natürlich.
- source_word: עצבת
  choice: Kummer
  rationale: Das Substantiv bezeichnet Betrübnis, Schmerz oder Sorge. „Kummer“ ist knapp, würdig und deckt den emotionalen Sinn gut ab.
- source_word: ואיש
  choice: und ein Mann
  rationale: איש ist ausdrücklich maskuliner Singular. Die Form wird bewahrt, ohne auszuschließen, dass der Spruch allgemeine Geltung beansprucht.
- source_word: ותיק
  choice: erfahren
  rationale: Das Wort bezeichnet einen bewährten, gereiften oder erfahrenen Menschen. „Erfahren“ ist im heutigen Standarddeutsch natürlich und präzise.
- source_word: ישיבנה
  choice: wird es vergelten
  rationale: Die Hifil-Form von שוב mit Objektsuffix bezeichnet ein Zurückgeben beziehungsweise Erwidern. „Vergelten“ gibt die wahrscheinliche reziproke Aussage verständlich wieder, ohne die schwierige Syntax ganz aufzulösen.
- source_word: בו
  choice: ihm entsprechend
  rationale: Die knappe Präpositionalfügung mit Pronominalsuffix ist mehrdeutig. „Ihm entsprechend“ lässt sowohl den Personenbezug als auch die Vorstellung einer angemessenen Erwiderung anklingen.
theological_decisions:
- issue: Geschlechtsspezifische Wiedergabe von איש
  choice: Mann
  alternative: Mensch / Person
  rationale: Der hebräische Text verwendet den maskulinen Singular; dieser wird in der Übersetzung sichtbar erhalten.
- issue: Mehrdeutige Schlussklausel mit pronominalen Bezügen
  choice: wird es ihm entsprechend vergelten
  alternative: wird darauf in gleicher Weise antworten / wird es an ihm zurückgeben
  rationale: Der hebräische Wortlaut ist knapp und syntaktisch unsicher. Die Hauptfassung gibt den wahrscheinlich reziproken Sinn wieder; die Fußnote bewahrt alternative Deutungen und weist auf den erheblich abweichenden griechischen Text hin.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der parallel gebaute Weisheitsspruch bleibt knapp; die erhebliche textliche und syntaktische Unsicherheit der Schlussklausel wird nicht verschwiegen.
