  yaml_path: translation/deuterocanon/sirach/023/001.yaml
  text: Lord, Father and Master of my life, do not abandon me to their counsel; do not let me fall by them.
translation:
  language: de
  text: Herr, Vater und Gebieter meines Lebens, überlass mich nicht ihrem Rat; lass mich nicht durch sie zu Fall kommen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „lass mich nicht unter ihnen (oder: in ihnen) zu Fall kommen.“ Das griechische ἐν αὐτοῖς kann instrumental oder örtlich beziehungsweise im Sinn eines Bezugs verstanden werden.'
    reason: Bewahrt die Mehrdeutigkeit der Präpositionalfügung ἐν αὐτοῖς.
lexical_decisions:
- source_word: Κύριε
  choice: Herr
  rationale: Die übliche, würdige Anrede für κύριε.
- source_word: πάτερ
  choice: Vater
  rationale: Gibt die direkte Anrede πάτερ schlicht und genau wieder.
- source_word: δέσποτα ζωῆς μου
  choice: Gebieter meines Lebens
  rationale: Bewahrt den Gedanken souveräner Verfügungsgewalt in δεσπότης; „Gebieter“ ist hier präziser als das mit κύριος zusammenfallende „Herr“.
- source_word: ἐν βουλῇ αὐτῶν
  choice: ihrem Rat
  rationale: Gibt βουλή als „Rat/Plan“ wieder und lässt den Bezug von αὐτῶν wie im Ausgangstext kontextabhängig.
- source_word: ἐν αὐτοῖς
  choice: durch sie
  rationale: Versteht ἐν instrumental; wegen der möglichen lokalen beziehungsweise referenziellen Lesart wird die Ambiguität in einer Fußnote kenntlich gemacht.
theological_decisions:
- issue: Gottesbezeichnungen in der Anrede
  choice: Herr, Vater und Gebieter meines Lebens
  alternative: Herr, Vater und Herr meines Lebens
  rationale: Die drei Aspekte der griechischen Anrede bleiben erhalten, ohne κύριος und δεσπότης mit demselben deutschen Wort einzuebnen.
- issue: Bezug und Funktion von ἐν αὐτοῖς
  choice: durch sie zu Fall kommen
  alternative: unter ihnen / in ihnen zu Fall kommen
  rationale: Die instrumentale Deutung passt zur parallelen Bitte um Schutz vor ihrem Rat; die sprachlich echte Mehrdeutigkeit wird jedoch nicht verschwiegen.
translation_notes:
  register: Modernes, würdevolles Gebetsdeutsch. „Gebieter“ ist bewusst gehoben, aber verständlich und unterscheidet δεσπότης von κύριος.
