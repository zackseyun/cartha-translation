  language: de
  text: Herr, Vater und Gott meines Lebens, gib mir keine hochmütigen Augen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: „Erhebung der Augen“; der griechische Ausdruck kann ebenso im Sinn von „unsteten“ oder „umherschweifenden Augen“ verstanden werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Κύριε
  choice: Herr
  rationale: Der Vokativ bezeichnet Gott als Herrn; „Herr“ ist im deutschen Gebetsstil die natürliche und traditionelle Entsprechung.
- source_word: πάτερ
  choice: Vater
  rationale: Die direkte Anrede wird schlicht und ohne ergänzende Deutung wiedergegeben.
- source_word: θεὲ ζωῆς μου
  choice: Gott meines Lebens
  rationale: Die knappe Genitivverbindung bleibt erhalten und lässt offen, ob Gott als Ursprung, Erhalter oder Herr des Lebens angesprochen wird.
- source_word: μετεωρισμὸν ὀφθαλμῶν
  choice: hochmütige Augen
  rationale: Die Wendung bezeichnet im Zusammenhang am ehesten einen stolzen, überheblichen Blick. Die bildhafte Rede von den Augen bleibt dabei erhalten; mögliche wörtlichere Bedeutungen werden in der Fußnote dokumentiert.
- source_word: μὴ δῷς μοι
  choice: gib mir keine
  rationale: Dies gibt die verneinte Bitte mit δίδωμι direkt und in natürlichem Deutsch wieder.
theological_decisions:
- issue: Moralische Bedeutung von μετεωρισμὸν ὀφθαλμῶν
  choice: hochmütige Augen
  alternative: erhobene, unstete oder umherschweifende Augen
  rationale: Im Weisheits- und Gebetszusammenhang liegt Hochmut als moralische Bedeutung nahe. Da der griechische Ausdruck auch eine Bewegung, Erhebung oder Unruhe der Augen bezeichnen kann, wird diese Mehrdeutigkeit nicht verschwiegen, sondern in der Fußnote bewahrt.
translation_notes:
  register: Moderne, würdige Gebetssprache. Die dreifache Anrede bleibt kompakt und rhythmisch; „hochmütige Augen“ bewahrt das konkrete Körperbild des Griechischen.
