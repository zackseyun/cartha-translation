    rationale: Die Wiedergabe von πορνείᾳ sollte den breiten moralisch-sexuellen Begriff bewahren, dabei aber gegenwärtig verständlich bleiben.
  - severity: medium
    issue: Die Fußnote erklärt παρέστησεν mit „stellte Kinder von einem anderen Mann hin“.
    rationale: Diese Formulierung ist im Deutschen nicht nur unnatürlich, sondern legt eine räumliche Bedeutung nahe. Da der Haupttext den kontextuellen Sinn bereits angemessen wiedergibt, ist keine Fußnote erforderlich.
  revised_text: Denn erstens war sie dem Gesetz des Höchsten ungehorsam, zweitens verging sie sich gegen ihren Mann, und drittens beging sie in sexueller Unmoral Ehebruch und brachte Kinder von einem anderen Mann hervor.
