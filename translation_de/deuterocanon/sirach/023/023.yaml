base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/023/023.yaml
  text: For first[a], she disobeyed the law of the Most High; and second, she committed an offense against her husband; and third, in sexual immorality she committed adultery and presented children from another man.
translation:
  language: de
  text: Denn erstens war sie dem Gesetz des Höchsten ungehorsam, zweitens verging sie sich gegen ihren Mann, und drittens beging sie in sexueller Unmoral Ehebruch und brachte Kinder von einem anderen Mann hervor.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πρῶτον μὲν ... καὶ δεύτερον ... καὶ τὸ τρίτον
  choice: erstens ... zweitens ... und drittens
  rationale: Bewahrt die ausdrücklich dreigliedrige Aufzählung des Griechischen in natürlichem, gegenwärtigem Deutsch; „Denn“ gibt das einleitende γάρ wieder.
- source_word: ἐν νόμῳ Ὑψίστου ἠπείθησεν
  choice: war sie dem Gesetz des Höchsten ungehorsam
  rationale: Die deutsche Dativkonstruktion gibt den Bezug des Ungehorsams auf das Gesetz idiomatisch wieder. „der Höchste“ bewahrt den göttlichen Titel, ohne das im Griechischen unausgesprochene Wort „Gott“ hinzuzufügen.
- source_word: εἰς ἄνδρα ἑαυτῆς ἐπλημμέλησεν
  choice: verging sie sich gegen ihren Mann
  rationale: „Sich vergehen gegen“ wahrt den moralisch-rechtlichen Sinn von πλημμελέω, ohne die zweite Anklage vorschnell mit dem anschließend ausdrücklich genannten Ehebruch gleichzusetzen.
- source_word: ἐν πορνείᾳ
  choice: in Unzucht
  rationale: „Unzucht“ bezeichnet hier allgemein unerlaubtes sexuelles Verhalten und bewahrt den knappen, ernsten Ton. Es legt den Ausdruck nicht auf Prostitution fest.
- source_word: ἐμοιχεύθη
  choice: beging sie Ehebruch
  rationale: Obwohl die griechische Form formal passiv beziehungsweise medial ist, bezeichnet sie hier ihr ehebrecherisches Handeln; die aktive deutsche Wendung ist klar und idiomatisch.
- source_word: ἐξ ἀλλοτρίου ἀνδρὸς τέκνα παρέστησεν
  choice: brachte Kinder von einem anderen Mann hervor
  rationale: „Hervorbringen“ hält eine Verbindung zum kausativ-präsentierenden Bild von παρίστημι aufrecht und bezeichnet im Zusammenhang verständlich das Gebären beziehungsweise Hervorbringen von Kindern, deren Vater nicht ihr Ehemann ist.
theological_decisions:
- issue: Dreifache moralische Anklage
  choice: 'Die drei Punkte bleiben unterschieden: Ungehorsam gegen das göttliche Gesetz, Vergehen gegen den Ehemann und schließlich Ehebruch mit Kindern von einem anderen Mann.'
  alternative: Die zweite und dritte Aussage als eine einzige Anklage ehelicher Untreue zusammenziehen.
  rationale: Der griechische Text zählt ausdrücklich drei Verfehlungen auf. Ihre Trennung bewahrt die rhetorische Steigerung und vermeidet eine interpretierende Einebnung.
- issue: Göttlicher Titel Ὑψίστου
  choice: des Höchsten
  alternative: des höchsten Gottes
  rationale: „Der Höchste“ gibt den Titel unmittelbar wieder, ohne „Gott“ ergänzend in den Haupttext einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die dreifache Aufzählung und ihre moralische Steigerung bleiben deutlich; archaische Satzstellung und unnötig technische Sprache werden vermieden.
