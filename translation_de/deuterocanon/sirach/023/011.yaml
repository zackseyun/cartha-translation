base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/023/011.yaml
  text: A man who swears many oaths will be filled with lawlessness[a], and the whip will not depart from his house. If he stumbles, his sin is upon him; and if he disregards it, he has sinned doubly. And if he swore in vain, he will not be justified[d][c][b], for his house will be filled with afflictions.
translation:
  language: de
  text: Ein Mann, der viele Eide schwört, wird voller Gesetzlosigkeit sein, und die Geißel[a] wird nicht von seinem Haus weichen. Wenn er sich vergeht, liegt seine Sünde auf ihm; und wenn er darüber hinwegsieht[b], hat er doppelt gesündigt. Und wenn er einen leeren Eid geschworen hat[c], wird er nicht gerecht gesprochen werden, denn sein Haus wird voller Plagen[d] sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Peitsche“. Das griechische μάστιξ kann ein Schlaginstrument oder bildlich eine strafende Geißel bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „wenn er es missachtet“. Gemeint sein kann, dass er über sein Vergehen hinweggeht und dadurch seine Schuld vergrößert; das Objekt ist im Griechischen nicht ausdrücklich genannt.'
    reason: ambiguity
  - marker: c
    text: 'Wörtlich etwa: „wenn er durch Leeres geschworen hat“; möglich ist auch: „wenn er grundlos“ oder „falsch geschworen hat“.'
    reason: lexical_alternative
  - marker: d
    text: Das griechische ἐπαγωγαί ist hier schwierig zu bestimmen. Gemeint sind wahrscheinlich hereinbrechende oder auferlegte Nöte, möglicherweise Strafgerichte.
    reason: textual_difficulty
lexical_decisions:
- source_word: ἀνὴρ πολύορκος
  choice: Ein Mann, der viele Eide schwört
  rationale: Die grammatisch maskuline Einzahl und die Kennzeichnung durch häufiges Schwören werden in natürlichem Deutsch bewahrt.
- source_word: πλησθήσεται ἀνομίας
  choice: wird von Gesetzlosigkeit erfüllt werden
  rationale: Die Formulierung erhält sowohl das Bild des Erfülltwerdens als auch das moralisch-rechtliche Gewicht von ἀνομία.
- source_word: μάστιξ
  choice: die Geißel
  rationale: „Geißel“ kann wie das griechische Wort sowohl das konkrete Schlaginstrument als auch bildlich strafendes Unheil bezeichnen.
- source_word: πλημμελήσῃ
  choice: sich vergeht
  rationale: Das Verb bezeichnet einen Fehltritt oder ein Vergehen; die Wiedergabe vermeidet die nicht ausdrücklich vorhandene Festlegung auf unabsichtliches Sündigen.
- source_word: ἁμαρτία αὐτοῦ ἐπʼ αὐτῷ
  choice: seine Sünde liegt auf ihm
  rationale: Die konkrete griechische Wendung für die persönliche Last beziehungsweise Verantwortlichkeit bleibt erhalten.
- source_word: ὑπερίδῃ
  choice: darüber hinwegsieht
  rationale: Die Wiedergabe lässt die Bedeutung des Übersehens oder Missachtens erkennen, ohne das im Griechischen unausgesprochene Objekt zu präzisieren.
- source_word: ἥμαρτεν δισσῶς
  choice: hat er doppelt gesündigt
  rationale: Dies bildet die verstärkte beziehungsweise verdoppelte Schuld knapp und unmittelbar ab.
- source_word: διὰ κενῆς ὤμοσεν
  choice: ins Leere geschworen hat
  rationale: Die ungewöhnliche Bildlichkeit der griechischen Wendung wird bewahrt, ohne sie vorschnell allein als Meineid zu deuten.
- source_word: οὐ δικαιωθήσεται
  choice: wird er nicht gerecht gesprochen werden
  rationale: Die Formulierung erhält den gerichtlichen Gedanken der Rechtfertigung beziehungsweise Freisprechung, ohne eine spätere dogmatische Fachbedeutung aufzudrängen.
- source_word: ἐπαγωγῶν
  choice: Plagen
  rationale: Das schwierige Wort bezeichnet hier hereinbrechende oder auferlegte Nöte; „Plagen“ ist verständlich und lässt deren genaue Art offen.
theological_decisions:
- issue: Bedeutung von δικαιωθήσεται im weisheitlichen Zusammenhang
  choice: nicht gerecht gesprochen werden
  alternative: nicht freigesprochen werden
  rationale: Der Zusammenhang handelt von Schuld und ihren Folgen. „Gerecht gesprochen“ wahrt die forensische Färbung, ohne den Vers auf eine bestimmte spätere Rechtfertigungslehre festzulegen.
- issue: Art des Vergehens bei πλημμελήσῃ
  choice: wenn er sich vergeht
  alternative: wenn er einen Fehltritt begeht
  rationale: Der griechische Ausdruck benennt ein Verfehlen, kennzeichnet es jedoch nicht eindeutig als unabsichtlich. Diese Offenheit bleibt bestehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst bewahrter Bildsprache. Ungewöhnliche griechische Wendungen werden dort nicht geglättet, wo eine Glättung die inhaltliche Offenheit einschränken würde.
