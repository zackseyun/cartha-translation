  terminology: „Geißel“, „Gesetzlosigkeit“, „Sünde“ und „gerecht gesprochen“ sind treffend. „Plagen“ ist als breite Wiedergabe des schwierigen ἐπαγωγαί vertretbar, sofern die Fußnote die mögliche strafende Nuance erläutert. Die Fußnotenmarker sind korrekt gesetzt und in der Textreihenfolge angeordnet.
