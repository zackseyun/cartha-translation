  to: Ein Mann, der viele Eide schwört, wird voller Gesetzlosigkeit sein, und die Geißel[a] wird nicht von seinem Haus weichen. Wenn er sich vergeht, liegt seine Sünde auf ihm; und wenn er darüber hinwegsieht[b], hat er doppelt gesündigt. Und wenn er einen leeren Eid geschworen hat[c], wird er nicht gerecht gesprochen werden, denn sein Haus wird voller Plagen[d] sein.
  rationale: Die Revision beseitigt die unidiomatische Wendung „ins Leere geschworen“ und glättet zwei schwere Passivkonstruktionen, ohne den Bildcharakter, die Mehrdeutigkeit oder die gerichtliche Färbung des griechischen Textes einzuschränken. Die vorhandenen Fußnoten bleiben in Inhalt und Verankerung sachgerecht.
