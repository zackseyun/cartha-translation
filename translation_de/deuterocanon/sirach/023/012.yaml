base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/023/012.yaml
  text: There is a word wrapped in death; may it not be found in the inheritance of Jacob. For all these things will depart from the godly, and they will not wallow in sins.
translation:
  language: de
  text: Es gibt ein Wort, das in Tod gehüllt ist; es soll im Erbteil Jakobs nicht zu finden sein.[a] Denn von den Gottesfürchtigen wird all dies fernbleiben, und sie werden sich nicht in Sünden wälzen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „das mit Tod bekleidet ist“ oder „das vom Tod umgeben ist“. Das griechische Bild bezeichnet eine Äußerung, die gleichsam in Tod eingehüllt ist.'
    reason: Lexikalische und bildhafte Übersetzungsalternativen zu ἀντιπεριβεβλημένη θανάτῳ.
lexical_decisions:
- source_word: λέξις
  choice: Wort
  rationale: Bezeichnet hier eine Äußerung oder Redeweise; „Wort“ bewahrt den singularischen Fokus und ist im Deutschen knapp und natürlich.
- source_word: ἀντιπεριβεβλημένη θανάτῳ
  choice: mit Tod umhüllt
  rationale: Das Partizip beschreibt ein Umgeben- oder Eingehülltsein. Die Wiedergabe bewahrt das eindringliche Bild, ohne es lediglich als „tödlich“ auszudeuten.
- source_word: μὴ εὑρεθήτω
  choice: es soll … nicht zu finden sein
  rationale: Gibt den verneinten Imperativ der dritten Person als mahnenden Wunsch wieder.
- source_word: ἐν κληρονομίᾳ Ἰακώβ
  choice: im Erbteil Jakobs
  rationale: „Erbteil“ wahrt die gemeinschaftliche und bundestheologische Bildsprache, ohne die Identität oder Reichweite der bezeichneten Gemeinschaft näher festzulegen.
- source_word: ἀπὸ … εὐσεβῶν … ἀποστήσεται
  choice: von den Gottesfürchtigen wird … fernbleiben
  rationale: ἀφίστημι bezeichnet Trennung oder Abstand. „Fernbleiben“ folgt der griechischen Konstruktion, in der „all dies“ Subjekt ist, und klingt im Deutschen natürlicher als „wird weichen“.
- source_word: ταῦτα πάντα
  choice: all dies
  rationale: Verweist gesammelt auf die zuvor behandelten Arten sündiger Rede; das deutsche Kollektivpronomen gibt den pluralischen Umfang idiomatisch wieder.
- source_word: ἐν ἁμαρτίαις οὐκ ἐγκυλισθήσονται
  choice: sie werden sich nicht in Sünden wälzen
  rationale: Bewahrt das starke Bild des Sich-Wälzens oder Sich-Suhlens sowie den Plural „Sünden“.
theological_decisions:
- issue: Identität des „Erbteils Jakobs“
  choice: Die überlieferte Bundes- und Gemeinschaftsbezeichnung bleibt ohne erklärende Erweiterung stehen.
  alternative: Ausdrückliche Eingrenzung auf das ethnische Israel oder allegorische Deutung als Bezeichnung aller Gerechten.
  rationale: Der griechische Text selbst bestimmt die spätere theologische Reichweite der Bezeichnung nicht; die Übersetzung wahrt diese Spannung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die markante Todesmetapher und das kräftige Bild des Sich-Wälzens in Sünden bleiben erhalten; Satzbau und Wortwahl sind zugleich für heutige Leser verständlich.
