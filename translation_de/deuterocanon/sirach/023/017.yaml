  text: To a promiscuous man every bread is sweet[b][a]; he will not stop until he comes to his end.
translation:
  language: de
  text: Dem sexuell ausschweifenden Mann schmeckt jedes Brot süß[a]; er hört nicht auf, bis er an sein Ende kommt[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „jede Art von Brot schmeckt süß“. Das Bild meint wahrscheinlich wahlloses Verlangen und nicht nur Brot als Nahrung.'
