lexical_decisions:
- source_word: πόρνῳ
  choice: der sexuell ausschweifend lebt
  rationale: Das Wort bezeichnet hier einen Mann, dessen Verhalten von fortgesetzter sexueller Unmoral geprägt ist. Die Umschreibung ist in modernem Deutsch verständlich, ohne die Bedeutung auf Prostitution zu verengen.
- source_word: πᾶς ἄρτος
  choice: jedes Brot
  rationale: Die wörtliche Bildsprache des Griechischen bleibt erhalten. Im Zusammenhang steht sie wahrscheinlich für ein wahlloses Begehren, sollte aber im Haupttext nicht ausdrücklich auf mögliche Sexualpartner eingeengt werden.
- source_word: ἡδύς
  choice: süß
  rationale: Die Grundbedeutung „süß, angenehm“ passt zur Brotbilderwelt und bewahrt die sinnliche sowie moralisch ironische Wirkung des Satzes.
- source_word: οὐ μὴ κοπάσῃ
  choice: er hört nicht auf
  rationale: Die Konstruktion οὐ μή mit dem Konjunktiv drückt eine nachdrückliche Verneinung aus; κοπάζω bedeutet hier „aufhören, ablassen“.
- source_word: ἕως ἂν τελευτήσῃ
  choice: bis er sein Ende findet
  rationale: τελευτάω kann sowohl allgemein „zu Ende kommen“ als auch konkret „sterben“ bedeuten. Die Formulierung lässt beide Bedeutungsnuancen anklingen.
theological_decisions:
- issue: Soll die Brotbilderwelt ausdrücklich als sexuelles Begehren erklärt werden?
  choice: Das Bild bleibt im Haupttext als „jedes Brot ist süß“ erhalten.
  alternative: „Jede Frau ist begehrenswert“ oder eine andere ausdrückliche Deutung.
  rationale: Der Zusammenhang kennzeichnet das Verhalten als sexuell ausschweifend, doch der griechische Wortlaut selbst verwendet ein sprichwörtliches Bild. Eine ausdrückliche Auflösung würde den Text stärker festlegen, als es die Quelle verlangt.
- issue: Bezeichnet τελευτήσῃ ausschließlich den Tod oder allgemeiner das Ende beziehungsweise Verderben?
  choice: „bis er sein Ende findet“
  alternative: „bis er stirbt“
  rationale: Die breitere Wiedergabe bewahrt die echte Bedeutungsweite des Verbs und lässt sowohl den Tod als auch das endgültige Verderben anklingen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Formulierung „sexuell ausschweifend lebt“ vermeidet sowohl veraltetes „unzüchtig“ als auch eine unnötige Verengung auf Prostitution. Der knappe, sprichwortartige Parallelismus und die Brotbilderwelt bleiben erhalten.
