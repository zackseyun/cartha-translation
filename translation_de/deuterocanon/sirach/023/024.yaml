  text: She will be brought out before the assembly[a], and there will be an inspection concerning her children.
translation:
  language: de
  text: Sie wird vor die Versammlung geführt werden, und ihre Kinder werden einer Untersuchung[a] unterzogen werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und über ihre Kinder wird eine Heimsuchung kommen“; damit könnte statt einer bloßen Untersuchung ein Strafgericht gemeint sein.'
    reason: alternative_reading
lexical_decisions:
- source_word: αὕτη
  choice: Sie
  rationale: Das feminine Demonstrativpronomen verweist im unmittelbaren Zusammenhang auf die ehebrecherische Frau; im Deutschen ist das Personalpronomen natürlich und eindeutig genug.
- source_word: εἰς ἐκκλησίαν
  choice: vor die Versammlung
  rationale: ἐκκλησία bezeichnet hier die versammelte Gemeinschaft, nicht eine spätere kirchliche Institution. Zusammen mit ἐξαχθήσεται gibt „vor die Versammlung“ die öffentliche Vorführung idiomatisch wieder.
- source_word: ἐξαχθήσεται
  choice: wird … geführt werden
  rationale: Die passive Futurform bezeichnet, dass die Frau öffentlich heraus- beziehungsweise vorgeführt wird; die deutsche Formulierung bewahrt Passiv und Zukunft.
- source_word: ἐπὶ τὰ τέκνα αὐτῆς
  choice: ihre Kinder
  rationale: Die Kinder sind von der folgenden ἐπισκοπή betroffen. Die Umformung zum Subjekt eines deutschen Passivsatzes ergibt eine natürliche Wiedergabe, ohne das flexible ἐπί ausdrücklich als „gegen“ festzulegen.
- source_word: ἐπισκοπὴ
  choice: einer Untersuchung unterzogen
  rationale: Die Wendung vermittelt eine offizielle Prüfung oder Nachforschung und vermeidet den späteren kirchenamtlichen Sinn von „Aufsicht“. Die mögliche Bedeutung einer strafenden Heimsuchung bleibt in der Fußnote erhalten.
- source_word: ἔσται
  choice: werden … werden
  rationale: Die griechische Futur-Existenzkonstruktion wird im Deutschen idiomatisch durch ein zukünftiges Passiv wiedergegeben.
theological_decisions:
- issue: Soll ἐκκλησία mit späterer kirchlicher Begrifflichkeit wiedergegeben werden?
  choice: Versammlung
  alternative: Gemeinde; Kirche
  rationale: Der Zusammenhang handelt von öffentlicher Bloßstellung und Beurteilung innerhalb der versammelten Gemeinschaft. „Versammlung“ vermeidet einen anachronistischen christlich-institutionellen Sinn.
- issue: Wie stark ist der gerichtliche oder strafende Sinn von ἐπισκοπή auszudrücken?
  choice: Untersuchung
  alternative: Heimsuchung; Strafgericht
  rationale: Das Wort kann sowohl eine Prüfung als auch eine unheilvolle, strafende Heimsuchung bezeichnen. Da der Satz die Strafe nicht ausdrücklich benennt, bleibt der Haupttext bei der offiziellen Untersuchung; die stärkere Möglichkeit wird in der Fußnote offengehalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die öffentliche und möglicherweise gerichtliche Situation bleibt erkennbar; spätere kirchliche Fachsprache und eine vorschnelle Festlegung auf bloße Prüfung oder sichere Bestrafung werden vermieden.
