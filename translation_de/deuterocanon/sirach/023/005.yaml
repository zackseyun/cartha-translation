  text: und wende die Begierde von mir ab;[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Verlangen“ oder „die Lust“. Das griechische Wort kann ein starkes Verlangen bezeichnen und hat hier eine moralisch negative Färbung.'
