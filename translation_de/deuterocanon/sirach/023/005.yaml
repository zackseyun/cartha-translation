lexical_decisions:
- source_word: καὶ
  choice: und
  rationale: Die Konjunktion führt das Gebet aus dem vorausgehenden Zusammenhang fort.
- source_word: ἐπιθυμίαν
  choice: die Begierde
  rationale: Das Substantiv bezeichnet ein starkes Verlangen, hier mit sittlich negativer Färbung. „Begierde“ bewahrt diesen negativen Sinn, ohne ihn ausdrücklich auf sexuelle Lust einzuengen.
- source_word: ἀπόστρεψον
  choice: wende … ab
  rationale: Der Aoristimperativ bittet um entschlossenes Eingreifen; die Wendung bildet das griechische Motiv des Abwendens natürlich und relativ formal nach.
- source_word: ἀπʼ ἐμοῦ
  choice: von mir
  rationale: Die Präpositionalphrase bezeichnet die Trennung vom Sprecher, ohne das deutendere „aus meinem Inneren“ hinzuzufügen.
theological_decisions:
- issue: Bedeutungsumfang von ἐπιθυμία
  choice: „Begierde“ als sittlich negativ gefärbtes, aber nicht ausdrücklich sexuelles Verlangen
  alternative: „Lust“, „Verlangen“ oder „Begehren“
  rationale: Der griechische Ausdruck kann ein moralisch verwerfliches Verlangen meinen, ist aber nicht von sich aus auf sexuelle Lust beschränkt. Die Übersetzung wahrt diese Breite und die Spannung des Ausdrucks.
translation_notes:
  register: Knappes, würdiges Gebetsdeutsch. „Wende … ab“ bewahrt das Bild der griechischen Verbform; „Begierde“ ist allgemein verständlich und vermeidet eine unnötige Verengung auf Sexualität.
