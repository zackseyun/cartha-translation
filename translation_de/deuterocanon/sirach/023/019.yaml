  text: and the fear of him is in the eyes of men,[a]
translation:
  language: de
  text: und die Augen der Menschen sind seine Furcht.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Satz ist ungewöhnlich knapp, ohne ausdrückliches Verb und möglicherweise textlich unsicher. Sinngemäß kann er heißen: »und er fürchtet die Augen der Menschen«. Formal ist auch die Deutung möglich: »und die Furcht vor ihm ist in den Augen der Menschen«.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὀφθαλμοὶ
  choice: Augen
  rationale: Das konkrete Substantiv gibt die Bildsprache des griechischen Textes unmittelbar wieder; »Blicke« oder »Beobachtung« wären bereits deutender.
- source_word: ἀνθρώπων
  choice: der Menschen
  rationale: Der Genitiv Plural bezeichnet hier Menschen allgemein. Im modernen Deutschen gibt »Menschen« den generischen Sinn genauer und natürlicher wieder als »Männer«.
- source_word: φόβος
  choice: Furcht
  rationale: »Furcht« entspricht dem Substantiv φόβος und bewahrt die ungewöhnliche nominale Formulierung. Eine verbale Wiedergabe mit »fürchten« wäre verständlicher, aber stärker interpretierend.
- source_word: αὐτοῦ
  choice: seine
  rationale: Das Genitivpronomen wird possessiv wiedergegeben, ohne die in der stark verkürzten Klausel nur erschließbare Beziehung weiter auszudeuten.
theological_decisions:
- issue: Deutung der stark verkürzten, verblosen und möglicherweise textlich unsicheren griechischen Klausel
  choice: »und die Augen der Menschen sind seine Furcht«
  alternative: '»und er fürchtet die Augen der Menschen«; möglich ist formal auch: »und die Furcht vor ihm ist in den Augen der Menschen«'
  rationale: Wortstellung und unmittelbarer Zusammenhang sprechen dafür, dass die Augen anderer Menschen das sind, was er fürchtet. Da der überlieferte Wortlaut jedoch keine Kopula enthält und grammatisch ungewöhnlich gedrängt ist, bleibt die Hauptfassung bewusst nah am Griechischen und nennt glattere beziehungsweise anders konstruierte Möglichkeiten in der Fußnote.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Hauptfassung klingt bewusst etwas ungewöhnlich, um die Kürze und Mehrdeutigkeit des griechischen Wortlauts nicht durch eine stillschweigende Deutung zu beseitigen.
