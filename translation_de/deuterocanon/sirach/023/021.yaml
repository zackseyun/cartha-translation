  yaml_path: translation/deuterocanon/sirach/023/021.yaml
  text: This man will be punished in the streets of the city[a], and where he did not suspect it[b], he will be caught.
translation:
  language: de
  text: Dieser Mann wird auf den Straßen der Stadt bestraft werden[a], und wo er es nicht geahnt hat[b], wird er gefasst werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „auf den Plätzen der Stadt“; das griechische Wort bezeichnet wörtlich die breiten oder offenen Orte der Stadt und hebt damit die öffentliche Bloßstellung hervor.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „wo er es nicht vermutet hat“ beziehungsweise „wo er es nicht erwartet hat“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτος
  choice: Dieser Mann
  rationale: Das Demonstrativpronomen verweist auf den ehebrecherischen Mann im unmittelbaren Zusammenhang. „Dieser Mann“ bewahrt den Rückbezug und das grammatische Geschlecht deutlich.
- source_word: ἐν πλατείαις πόλεως
  choice: auf den Straßen der Stadt
  rationale: πλατεῖαι bezeichnet breite Straßen oder offene Plätze. Die gewählte Formulierung ist im modernen Deutsch natürlich und bewahrt den Gedanken öffentlicher Bloßstellung; die engere Alternative „auf den Plätzen der Stadt“ wird in der Fußnote genannt.
- source_word: ἐκδικηθήσεται
  choice: wird bestraft werden
  rationale: Das Passiv bezeichnet hier die Vollstreckung vergeltender Gerechtigkeit. „Bestraft werden“ gibt dies verständlich wieder, ohne eine persönliche Rachehandlung einzutragen.
- source_word: οὗ
  choice: wo
  rationale: Das relative Ortsadverb leitet den Ort beziehungsweise die Situation des unerwarteten Ergriffenwerdens ein und lässt sich knapp mit „wo“ wiedergeben.
- source_word: οὐχ ὑπενόησεν
  choice: er es nicht geahnt hat
  rationale: ὑπονοέω kann „vermuten“, „argwöhnen“ oder „erahnen“ bedeuten. „Nicht geahnt hat“ drückt idiomatisch aus, dass er seine Ergreifung nicht vorausgesehen hat.
- source_word: πιασθήσεται
  choice: wird er gefasst werden
  rationale: Das Futur Passiv bezeichnet, dass er ergriffen oder festgesetzt wird. „Gefasst werden“ passt zum Zusammenhang einer unerwarteten öffentlichen Entlarvung.
theological_decisions:
- issue: Bezug des männlichen Demonstrativpronomens und der Verben
  choice: Der Vers spricht konkret vom ehebrecherischen Mann; daher bleibt die männliche Form erhalten.
  alternative: Eine geschlechtsneutrale Wiedergabe wie „dieser Mensch“ oder „diese Person“.
  rationale: Die griechischen Formen sind männlich, und der unmittelbare Zusammenhang bezeichnet einen bestimmten Mann. Eine Neutralisierung würde diesen konkreten Bezug abschwächen.
- issue: Bedeutung von ἐκδικηθήσεται
  choice: Öffentliche Bestrafung beziehungsweise vergeltendes Gericht.
  alternative: „An ihm wird Rache genommen werden.“
  rationale: Im Zusammenhang steht die ahndende Gerechtigkeit im Vordergrund, nicht ausdrücklich persönliche Rache. Die Übersetzung vermeidet zugleich eine über den Text hinausgehende Festlegung auf den unmittelbaren Handelnden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die beiden Futur-Passivformen bewahren die bestimmte Ankündigung des griechischen Textes; „geahnt hat“ gibt den vorzeitigen Aorist idiomatisch wieder. Die Formulierung lässt offen, durch wen die Bestrafung und Ergreifung vollzogen werden.
