  text: Do not accustom your mouth to crude ignorance, for in it there is a word of sin.
translation:
  language: de
  text: Gewöhne deinen Mund nicht an ungehobelte Rede[a]; denn darin findet sich ein Wort der Sünde[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „ungehörige Unbildung“ oder „ungezogene Zuchtlosigkeit“. Die griechische Wortverbindung ist selten und bezeichnet hier wahrscheinlich grobe, ungehörige Rede.'
    reason: Die ungewöhnliche und semantisch unsichere griechische Verbindung lässt sich im Deutschen nicht zugleich wörtlich und natürlich wiedergeben.
  - marker: b
    text: 'Oder: „eine sündige Äußerung“.'
    reason: Der Ausdruck „Wort der Sünde“ kann sowohl eine von Sünde geprägte Äußerung als auch ein zur Sünde gehörendes Wort bezeichnen.
lexical_decisions:
- source_word: ἀπαιδευσίαν ἀσυρῆ
  choice: ungehobelte Rede
  rationale: ἀπαιδευσία bezeichnet einen Mangel an Bildung, Erziehung oder Zucht; das seltene ἀσυρής verstärkt dies im Sinn von ungehörig oder grob. Da ausdrücklich der Mund daran gewöhnt wird, gibt „Rede“ den gemeinten sprachlichen Vollzug im Deutschen natürlich wieder, ohne den Gedanken mangelnder Zucht zu verlieren.
- source_word: λόγος ἁμαρτίας
  choice: ein Wort der Sünde
  rationale: Die bewusst offene Genitivverbindung wird nicht vorschnell zu „sündiges Wort“ oder „Anlass zur Sünde“ vereindeutigt. „Wort“ wahrt zudem den Rückbezug auf den Mund.
- source_word: συνεθίσῃς
  choice: gewöhne … nicht an
  rationale: Gibt den Gedanken wiederholter Einübung und entstehender Gewohnheit direkt und idiomatisch wieder.
theological_decisions:
- issue: Verhältnis von Rede und Sünde
  choice: „darin findet sich ein Wort der Sünde“
  alternative: „denn solche Rede ist Sünde“
  rationale: Der griechische Text setzt grobe, ungezogene Rede und Sünde nicht schlicht gleich, sondern formuliert eine innere Verbindung. Die Übersetzung bewahrt diese Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Ungehobelte Rede“ ist allgemein verständlich und bildet den Mundbezug natürlich ab; die zweite Satzhälfte bleibt absichtlich etwas markant, um die offene griechische Formulierung nicht einzuebnen.
