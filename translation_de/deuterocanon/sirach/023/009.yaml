base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/023/009.yaml
  text: Do not accustom your mouth to an oath[a], and do not become accustomed to invoking the Holy One by name.
translation:
  language: de
  text: Gewöhne deinen Mund nicht ans Schwören, und gewöhne dich nicht daran, den Heiligen beim Namen anzurufen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und gewöhne dich nicht an den Gebrauch des heiligen Namens.“ Das Griechische kann das Nennen beziehungsweise Anrufen des Heiligen oder den Gebrauch des heiligen Namens bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅρκῳ
  choice: ans Schwören
  rationale: Der Dativ bezeichnet bei ἐθίζω die Gewohnheit, an die der Mund gewöhnt wird. „Ans Schwören“ klingt im Deutschen natürlicher als „an einen Eid“ und wahrt den Gedanken wiederholten Eidens.
- source_word: μὴ ἐθίσῃς
  choice: Gewöhne … nicht
  rationale: 'Die Wiedergabe bewahrt die kausative Bedeutung von ἐθίζω: Der Angesprochene soll seinen Mund nicht an diese Praxis gewöhnen.'
- source_word: τὸ στόμα σου
  choice: deinen Mund
  rationale: Die konkrete Redeweise des griechischen Textes ist auch im Deutschen verständlich und erhält das körperbezogene Bild.
- source_word: ὀνομασίᾳ
  choice: beim Namen anzurufen
  rationale: ὀνομασία bezeichnet das Nennen beziehungsweise den Gebrauch eines Namens. Im Zusammenhang mit Eiden gibt „beim Namen anrufen“ den wahrscheinlichen Gedanken einer Anrufung wieder, ohne die lexikalische Mehrdeutigkeit zu verschweigen.
- source_word: τοῦ ἁγίου
  choice: den Heiligen
  rationale: Der substantivierte Genitiv wird als ehrfürchtige Gottesbezeichnung verstanden. „Der Heilige“ ist dafür im Deutschen eine klare und würdevolle Wiedergabe.
- source_word: μὴ συνεθισθῇς
  choice: gewöhne dich nicht daran
  rationale: Die Form bezeichnet das Hineingeraten in eine Gewohnheit. Die reflexive deutsche Form ist natürlich und unterscheidet sich syntaktisch von der ersten, kausativen Aussage.
theological_decisions:
- issue: Bezug von τοῦ ἁγίου
  choice: Als Gottesbezeichnung „der Heilige“ wiedergegeben.
  alternative: Metonymisch als „der heilige Name“ oder allgemeiner als „das Heilige“ verstehen.
  rationale: Im Zusammenhang mit Eid und Namensnennung liegt eine ehrfürchtige Bezeichnung Gottes nahe. Die Hauptübersetzung macht diesen wahrscheinlichen Bezug sichtbar; die Fußnote erhält die alternative syntaktisch-lexikalische Deutung.
- issue: Reichweite des Verbots
  choice: Das Gewöhnen an häufiges oder gedankenloses Schwören und Anrufen wird untersagt.
  alternative: Ein ausnahmsloses Verbot jedes Eides.
  rationale: Die wiederholten Verben ἐθίζω und συνεθίζω stellen ausdrücklich die Gewohnheitsbildung in den Mittelpunkt. Die Übersetzung erweitert dies nicht zu einer im Vers nicht ausdrücklich formulierten absoluten Lehraussage.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallele Wiederholung von „gewöhnen“ bildet die Wortverwandtschaft von ἐθίζω und συνεθίζω ab. „Ans Schwören“ ist idiomatischer als eine streng nominale Wiedergabe und hält den Schwerpunkt auf der eingeübten Praxis.
