base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/023/006.yaml
  text: Do not let the appetite of the belly and sexual intercourse overtake me[b][a], and do not give me over to a shameless soul.
translation:
  language: de
  text: Lass nicht zu, dass die Begierde des Bauches und Geschlechtsverkehr[a] mich überwältigen, und gib mich keiner schamlosen Seele preis.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »geschlechtliche Vereinigung«. Das griechische Wort kann sexuelle Vereinigung neutral bezeichnen; im Zusammenhang dieses Gebets gegen beherrschende Begierden kann es eine negative Färbung haben.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »einer schamlosen Seele«. Gemeint sein kann auch ein schamloses Selbst oder eine schamlose Person.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κοιλίας ὄρεξις
  choice: die Begierde des Bauches
  rationale: Die Genitivverbindung bezeichnet das körperliche Verlangen nach Nahrung. Die bewusst anschauliche Wiedergabe bewahrt das Körperwort κοιλία, ohne das Verlangen stärker als nötig als „Gier“ zu kennzeichnen.
- source_word: συνουσιασμός
  choice: sexuelle Ausschweifung
  rationale: Das Wort bezeichnet geschlechtlichen Umgang beziehungsweise sexuelle Vereinigung. Im Zusammenhang des Gebets gegen beherrschende Laster gibt „sexuelle Ausschweifung“ die negative ethische Färbung wieder, ohne auf eine bestimmte sexuelle Handlung einzuengen; die neutralere lexikalische Möglichkeit wird in einer Fußnote bewahrt.
- source_word: μὴ καταλαβέτωσάν με
  choice: Lass nicht zu, dass … mich überwältigen
  rationale: καταλαμβάνω kann „ergreifen“, „einholen“ oder „in seine Gewalt bringen“ bedeuten. „Überwältigen“ drückt hier natürlich aus, dass die genannten Begierden den Beter beherrschen sollen.
- source_word: ψυχὴ ἀναιδεῖ
  choice: keiner schamlosen Seele
  rationale: ψυχή wird als „Seele“ beibehalten, um die anthropologische Bildsprache nicht zu einer bloßen „Begierde“ zu verengen. ἀναιδής bezeichnet schamloses oder unverschämtes Wesen.
- source_word: μὴ παραδῷς με
  choice: gib mich … nicht preis
  rationale: παραδίδωμι bezeichnet das Übergeben beziehungsweise Ausliefern in fremde Gewalt. „Preisgeben“ ist im Deutschen idiomatisch und erhält diesen Sinn.
theological_decisions:
- issue: Ethische Färbung von συνουσιασμός
  choice: sexuelle Ausschweifung
  alternative: Geschlechtsverkehr; geschlechtliche Vereinigung
  rationale: Die Bitte handelt von körperlichen Trieben, die den Beter überwältigen könnten. Daher darf der Ausdruck ethisch negativ klingen; zugleich wird die lexikalisch neutralere Bedeutung in der Fußnote genannt, damit der Text nicht pauschal jede geschlechtliche Vereinigung verurteilt.
- issue: Anthropologische Wiedergabe von ψυχή
  choice: Seele
  alternative: Selbst; Person; Begierde
  rationale: Die konkrete Bezeichnung „Seele“ bewahrt die Spannung der griechischen Formulierung. Eine Auflösung zu „Begierde“ wäre glatter, würde aber eine mögliche Deutung in den Haupttext eintragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau macht die beiden Subjekte der Bitte klar; die körperliche und anthropologische Bildsprache des Griechischen bleibt erhalten. Die Fußnoten sichern die echte Bedeutungsbreite der umstrittenen Ausdrücke.
