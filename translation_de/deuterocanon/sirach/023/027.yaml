  text: And those who are left behind will know that nothing is better than the fear of the Lord, and nothing is sweeter than paying attention to the commandments of the Lord.
translation:
  language: de
  text: 'Und die Zurückgebliebenen[a] werden erkennen: Nichts ist besser als die Furcht des Herrn, und nichts ist süßer als auf die Gebote des Herrn zu achten[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Übriggebliebenen“ beziehungsweise „die Überlebenden“. Wörtlich: „die Zurückgelassenen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „die Gebote des Herrn zu beherzigen“. Das griechische Verb bezeichnet aufmerksames Beachten, das sich danach richtet.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιγνώσονται
  choice: werden erkennen
  rationale: Das Futur von ἐπιγινώσκω bezeichnet hier ein zur Einsicht oder klaren Erkenntnis Gelangen. „Werden erkennen“ ist im Deutschen natürlich und bildet diesen Erkenntnisvorgang besser ab als das statischere „werden wissen“.
- source_word: οἱ καταλειφθέντες
  choice: die Zurückgebliebenen
  rationale: Das substantivierte Passivpartizip bedeutet wörtlich die, die zurückgelassen beziehungsweise übrig gelassen wurden. „Die Zurückgebliebenen“ bewahrt den passiven Sinn, ohne sie enger als Überlebende oder als einen theologischen Rest zu bestimmen.
- source_word: οὐδὲν κρεῖττον
  choice: Nichts ist besser
  rationale: Die knappe deutsche Vergleichsform gibt die uneingeschränkte Aussage des Griechischen unmittelbar wieder.
- source_word: φόβου Κυρίου
  choice: die Furcht des Herrn
  rationale: Die traditionelle Weisheitsformel wahrt die inhaltliche Weite von ehrfürchtiger Scheu, Gottesachtung und gehorsamer Haltung, ohne sie durch eine Paraphrase einzuengen.
- source_word: γλυκύτερον
  choice: süßer
  rationale: „Süßer“ erhält die konkrete Metapher und den poetischen Parallelismus des Weisheitsspruchs.
- source_word: τοῦ προσέχειν
  choice: als … zu achten
  rationale: προσέχειν bezeichnet aufmerksame, zugewandte Beachtung und kann im Zusammenhang auch gehorsames Befolgen einschließen. „Auf die Gebote … achten“ ist gegenwärtiges, verständliches Deutsch und bewahrt diese Bedeutungsbreite.
- source_word: ἐντολαῖς Κυρίου
  choice: die Gebote des Herrn
  rationale: „Gebote“ entspricht ἐντολαί und bewahrt den biblisch geprägten Ausdruck sowie die Parallele zu „Furcht des Herrn“.
theological_decisions:
- issue: Bedeutung von „Furcht des Herrn“ in der Weisheitsliteratur
  choice: Die feste Wendung „Furcht des Herrn“ wird beibehalten.
  alternative: „Ehrfurcht vor dem Herrn“ oder „Scheu vor dem Herrn“
  rationale: Der griechische Ausdruck trägt mehr als bloße Angst, aber auch mehr als eine unverbindliche Ehrfurcht. Die überlieferte Wendung lässt die Spannung zwischen Scheu, Verehrung und gehorsamer Gottesbeziehung bestehen.
- issue: Reichweite von προσέχειν gegenüber den Geboten
  choice: „auf die Gebote des Herrn zu achten“
  alternative: „die Gebote des Herrn zu befolgen“
  rationale: „Befolgen“ würde die responsive und gehorsame Dimension deutlich machen, den primären Gedanken aufmerksamer Zuwendung jedoch stärker festlegen. Die Übersetzung bewahrt die genuine Bedeutungsweite.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knappem weisheitlichem Parallelismus. Die Schlüsselwendung „Furcht des Herrn“ und die Süße-Metapher bleiben erhalten; konfessionell einengende Deutungen werden vermieden.
