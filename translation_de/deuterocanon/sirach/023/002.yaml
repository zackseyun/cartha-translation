  to: Wer wird Peitschen über meine Gedanken und die Zucht der Weisheit über mein Herz setzen, damit sie mich wegen meiner Verfehlungen aus Unwissenheit nicht schonen und die Zucht ihre Sünden[a] keinesfalls übergeht?
  rationale: Die einzige sichere Änderung ist die Wiedergabe von ἐπιστήσει als futurische rhetorische Frage. Die schwierige Pronominalform „ihre Sünden“ und der Wechsel zum singularischen zweiten Verb werden weiterhin nicht harmonisiert; die Fußnote dokumentiert die textliche Schwierigkeit.
