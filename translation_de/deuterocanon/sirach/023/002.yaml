base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/023/002.yaml
  text: Who will set whips over my thoughts[a], and the discipline of wisdom over my heart, so that they may not spare me for my ignorances, and may not overlook their sins?
translation:
  language: de
  text: Wer wird Peitschen über meine Gedanken und die Zucht der Weisheit über mein Herz setzen, damit sie mich wegen meiner Verfehlungen aus Unwissenheit nicht schonen und die Zucht ihre Sünden[a] keinesfalls übergeht?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich steht im Griechischen „ihre Sünden“. Die Formulierung ist nach „meinen Verfehlungen“ schwer verständlich; dem Sinn nach wird bisweilen „meine Sünden“ angenommen oder das Pronomen anders geglättet.
    reason: alternative_reading
lexical_decisions:
- source_word: τίς ἐπιστήσει
  choice: Wer setzt
  rationale: Die rhetorische Bitte wird im Deutschen mit dem idiomatischen Präsens direkt wiedergegeben; ἐφίστημι bezeichnet hier das Einsetzen oder Stellen einer züchtigenden Aufsicht.
- source_word: ἐπὶ τοῦ διανοήματός μου
  choice: über meine Gedanken
  rationale: διανόημα kann Gedanke, Absicht oder Denktätigkeit bezeichnen. Der Plural ist im Deutschen natürlich und bewahrt den Bezug auf das innere Denken.
- source_word: μάστιγας
  choice: Peitschen
  rationale: Die konkrete und scharfe Metapher körperlicher Züchtigung bleibt erhalten und wird nicht zu bloßer Anleitung oder Kontrolle abgeschwächt.
- source_word: παιδείαν σοφίας
  choice: die Zucht der Weisheit
  rationale: παιδεία umfasst Erziehung, Unterweisung und korrigierende Disziplin. „Zucht“ bewahrt hier die Verbindung mit den Peitschen und den ernsten Charakter der erbetenen Weisheitserziehung.
- source_word: ἐπὶ τῆς καρδίας μου
  choice: über mein Herz
  rationale: „Herz“ bewahrt die biblische Bezeichnung für das Zentrum von Denken, Wollen und innerer Haltung.
- source_word: ἐπὶ τοῖς ἀγνοήμασίν μου
  choice: wegen meiner Verfehlungen aus Unwissenheit
  rationale: ἀγνόημα meint eine aus Unwissenheit oder Unkenntnis begangene Verfehlung. Die Formulierung ist verständlicher und genauer als das im Deutschen unnatürliche „Unwissenheiten“.
- source_word: μὴ φείσωνται
  choice: sie mich … nicht schonen
  rationale: Das griechische Verb steht im Plural und nimmt die zuvor genannten züchtigenden Mittel auf; das im Griechischen unausgesprochene Objekt wird für klares Deutsch als „mich“ ergänzt.
- source_word: οὐ μὴ παρῇ
  choice: keinesfalls übergeht
  rationale: Die nachdrückliche Verneinung οὐ μή wird mit „keinesfalls“ ausgedrückt. Die Singularform παρῇ wird durch das ausdrücklich wiederaufgenommene Subjekt „die Zucht“ bewahrt.
- source_word: τὰ ἁμαρτήματά αὐτῶν
  choice: ihre Sünden
  rationale: Der überlieferte griechische Text hat das Pronomen αὐτῶν, „ihre“. Trotz der Schwierigkeit im Zusammenhang wird es nicht stillschweigend zu „meine“ geändert.
theological_decisions:
- issue: Bildhafte Züchtigung durch Weisheit
  choice: Die konkreten Bilder „Peitschen“ und „Zucht der Weisheit“ bleiben stehen.
  alternative: Abschwächung zu „Kontrolle“, „Zurückhaltung“ oder „Führung“.
  rationale: Der Vers bittet um strenge innere Korrektur. Eine weichere Wiedergabe würde die moralische Dringlichkeit und die Spannung des Bildes vermindern.
- issue: Schwieriges Pronomen in τὰ ἁμαρτήματά αὐτῶν
  choice: „ihre Sünden“ steht im Haupttext und wird erläutert.
  alternative: Sinnglättung zu „meine Sünden“.
  rationale: Die vorgelegte griechische Quelle liest eindeutig αὐτῶν. Die sachlich naheliegende Alternative darf daher nur als mögliche Deutung genannt, nicht unmarkiert in den Text eingesetzt werden.
- issue: Wechsel vom pluralischen φείσωνται zum singularischen παρῇ
  choice: Beim zweiten Verb wird „die Zucht“ als singularisches Subjekt ausdrücklich wiederholt.
  alternative: Beide Verben mit demselben pluralischen Subjekt wiedergeben.
  rationale: So bleibt der auffällige Numeruswechsel der griechischen Verbformen erkennbar, ohne den deutschen Satz ungrammatisch oder völlig undurchsichtig zu machen.
translation_notes:
  register: Moderne, würdige Standardsprache mit bewusst kräftiger Bildsprache. „Zucht“ ist etwas gehoben, trifft hier aber παιδεία im Zusammenhang mit „Peitschen“ genauer als das schwächere „Unterweisung“. Der schwierige Pronomenbezug und der Wechsel zwischen pluralischem und singularischem Verb werden nicht stillschweigend harmonisiert.
