translation:
  language: de
  text: Zwei Arten vermehren die Sünden, und die Dritte[a] wird Zorn herbeiführen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich steht im Griechischen „das Dritte“; das zuvor genannte Wort „Art“ ist dabei nur mitgedacht.
    reason: Die griechische Ellipse lässt das Bezugswort beim dritten Glied unausgesprochen, während die deutsche Form grammatisch auf „Art“ zurückverweist.
lexical_decisions:
- source_word: Δύο εἴδη
  choice: Zwei Arten
  rationale: Die Wendung bezeichnet zwei Kategorien oder Typen. „Zwei Arten“ gibt die Zählform des griechischen Weisheitsspruchs knapp und natürlich wieder.
- source_word: πληθύνουσιν
  choice: vermehren
  rationale: Das Verb bezeichnet ein Zunehmenlassen oder Vervielfachen. „Vermehren“ bewahrt die Aussage, dass dadurch die Zahl der Sünden wächst.
- source_word: ἁμαρτίας
  choice: die Sünden
  rationale: Der griechische Plural wird ausdrücklich beibehalten; der bestimmte Artikel ist im Deutschen in dieser Formulierung idiomatisch.
- source_word: τὸ τρίτον
  choice: die dritte
  rationale: Im Griechischen steht substantiviert „das Dritte“, wobei das zuvor genannte εἶδος sinngemäß mitgedacht ist. Im Deutschen nimmt „die dritte“ das grammatische Geschlecht von „Art“ auf, ohne einen neuen Referenten einzuführen.
- source_word: ἐπάξει
  choice: wird … bringen
  rationale: Das Futur von ἐπάγω bedeutet hier „herbeibringen“ oder „verursachen“. Die schlichte Formulierung „wird … bringen“ entspricht der knappen Aussage des Originals.
- source_word: ὀργήν
  choice: Zorn
  rationale: „Zorn“ bewahrt das Gewicht von ὀργή, ohne ausdrücklich festzulegen, wessen Zorn gemeint ist oder ihn bereits als Strafe auszulegen.
theological_decisions:
- issue: Referent des Zorns
  choice: Der Zorn bleibt unbestimmt.
  alternative: Gottes Zorn; Strafe
  rationale: Der griechische Text nennt lediglich ὀργήν und bezeichnet weder Gott als Urheber noch deutet er das Wort ausdrücklich als Strafe. Diese Offenheit bleibt erhalten.
translation_notes:
  register: Knapper, würdevoller Weisheitsstil in modernem Standarddeutsch. Die parallele Zählstruktur und der ausdrücklich gesetzte Plural „Sünden“ bleiben erhalten; der nicht näher bestimmte „Zorn“ wird nicht theologisch präzisiert.
