  text: A man accustomed to words of reproach will never be disciplined all his days[a][b].
translation:
  language: de
  text: Ein Mensch, der sich an beleidigende Worte gewöhnt, wird sein Leben lang gewiss nicht erzogen werden.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „an schmähende Worte“ beziehungsweise „an Worte der Beschimpfung“.'
    reason: lexical_alternative
  - marker: b
    text: 'Das Griechische verneint nachdrücklich: „wird gewiss nicht erzogen werden“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄνθρωπος
  choice: Ein Mensch
  rationale: ἄνθρωπος bezeichnet hier allgemein einen einzelnen Menschen; das natürliche deutsche „ein Mensch“ bewahrt diesen generischen Sinn ohne unnötige geschlechtliche Festlegung.
- source_word: συνεθιζόμενος
  choice: der sich … gewöhnt
  rationale: Das Partizip beschreibt eine durch Wiederholung entstehende Gewöhnung. Die reflexive Formulierung ist im Deutschen natürlich und erhält den Vorgangs- und Gewohnheitsaspekt.
- source_word: λόγοις ὀνειδισμοῦ
  choice: an beleidigende Worte
  rationale: ὀνειδισμός umfasst Vorwurf, Schmähung und Beleidigung. „Beleidigende Worte“ gibt den wahrscheinlichen Sinn verständlich wieder; mögliche Alternativen werden in der Fußnote genannt.
- source_word: ἐν πάσαις ταῖς ἡμέραις αὐτοῦ
  choice: sein Leben lang
  rationale: Die Wendung bedeutet idiomatisch „alle seine Tage“ und bezeichnet die gesamte Lebenszeit. „Sein Leben lang“ ist gegenwärtiges, klares Deutsch.
- source_word: οὐ μὴ παιδευθῇ
  choice: lässt sich … nicht erziehen
  rationale: οὐ μή mit dem Konjunktiv ist eine nachdrückliche Verneinung. παιδεύω kann erziehen, unterweisen, schulen oder zurechtweisen bedeuten; die reflexive deutsche Form bewahrt hier den Gedanken, dass die Person für erzieherische Korrektur nicht mehr zugänglich ist.
theological_decisions:
- issue: Bedeutungsumfang von παιδευθῇ
  choice: lässt sich … nicht erziehen
  alternative: wird niemals zurechtgewiesen / unterwiesen werden
  rationale: Der griechische Ausdruck kann Bildung, moralische Erziehung und korrigierende Zucht bezeichnen. Die gewählte Form wahrt diese erzieherisch-moralische Breite, ohne eine besondere konfessionelle Lehre einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Formulierung ist verständlich und idiomatisch, bleibt aber eng an der griechischen Satzstruktur und bewahrt sowohl den Gewöhnungsaspekt als auch die nachdrückliche Verneinung.
