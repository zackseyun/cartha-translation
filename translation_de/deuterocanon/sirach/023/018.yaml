  text: A man transgressing from his bed says in his soul[a], “Who sees me?”
translation:
  language: de
  text: 'Ein Mann, der von seinem Bett abweicht[a], sagt in seiner Seele: »Wer sieht mich?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »der von seinem Bett abweicht«. Im Zusammenhang ist dies eine verhüllende Wendung für sexuelle Untreue, wahrscheinlich für den Bruch ehelicher Treue.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄνθρωπος
  choice: Ein Mann
  rationale: Das Substantiv steht im Singular und bezeichnet hier im Zusammenhang eine männliche Einzelperson, nicht die Menschheit im Allgemeinen.
- source_word: παραβαίνων ἀπὸ τῆς κλίνης αὐτοῦ
  choice: der seinem Bett untreu wird
  rationale: παραβαίνω bezeichnet ein Überschreiten oder Abweichen. Mit »von seinem Bett« bildet es im Kontext sexueller Verfehlung eine verhüllende Wendung. Die deutsche Formulierung bewahrt das Bild des Bettes und macht zugleich den moralischen Sinn verständlich, ohne ausdrücklich »Ehebruch begehen« zu sagen.
- source_word: λέγων ἐν τῇ ψυχῇ αὐτοῦ
  choice: sagt in seiner Seele
  rationale: Die nahe Wiedergabe erhält die ausdrückliche anthropologische Sprache von ψυχή und bezeichnet zugleich verständlich ein inneres Selbstgespräch.
- source_word: Τίς με ὁρᾷ;
  choice: Wer sieht mich?
  rationale: Die knappe Präsensfrage entspricht dem Griechischen und bewahrt die Vorstellung des Sprechers, unbeobachtet zu sein.
theological_decisions:
- issue: Soll die sexuelle beziehungsweise eheliche Bedeutung im Haupttext ausdrücklich benannt werden?
  choice: Die verhüllende Rede vom Bett bleibt erhalten; »untreu wird« kennzeichnet jedoch das moralische Abweichen.
  alternative: Ein Mann, der sein Ehebett verlässt / Ein Mann, der Ehebruch begeht
  rationale: Der Zusammenhang weist deutlich auf sexuelle Untreue, doch der griechische Satz verwendet keinen ausdrücklichen Begriff für Ehebruch. Deshalb wird die Anspielung verständlich wiedergegeben, ohne sie in eine eindeutige juristisch-theologische Bezeichnung aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die bewusst bildhafte Wendung wahrt den Euphemismus des griechischen Textes; »in seiner Seele« erhält dessen innere und anthropologische Ausdrucksweise.
