base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/023/010.yaml
  text: For just as a servant being constantly examined will not be spared bruises[a], so also one who swears and names the Name continually will never be cleansed from sin.
translation:
  language: de
  text: Denn wie ein Haussklave, der ständig überprüft wird, nicht ohne Striemen bleiben wird, so wird auch, wer fortwährend schwört und den Namen nennt,[a] keinesfalls von Sünde gereinigt werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und den Namen fortwährend anruft“. Gemeint ist wahrscheinlich der wiederholte Gebrauch des göttlichen Namens beim Schwören oder in ehrfurchtsloser Rede.'
    reason: Lexikalische und referenzielle Mehrdeutigkeit von καὶ ὀνομάζων διὰ παντός; der Haupttext bewahrt die Ellipse bezüglich des Namens.
lexical_decisions:
- source_word: οἰκέτης
  choice: Haussklave
  rationale: Das Wort bezeichnet einen zum Haushalt gehörenden Sklaven beziehungsweise unfreien Hausbediensteten. „Haussklave“ bewahrt sowohl den Haushaltsbezug als auch die Abhängigkeit, die im Vergleich mit körperlicher Züchtigung vorausgesetzt wird.
- source_word: ἐξεταζόμενος ἐνδελεχῶς
  choice: ständig zur Rechenschaft gezogen
  rationale: Das Partizip mit ἐνδελεχῶς beschreibt eine fortgesetzte, gründliche Überprüfung oder Befragung. Die gewählte Wendung ist im Deutschen natürlich und passt zum Zusammenhang von Kontrolle und Bestrafung.
- source_word: ἀπὸ μώλωπος οὐκ ἐλαττωθήσεται
  choice: wird es … nicht an Striemen fehlen
  rationale: Die griechische Verbindung ist wörtlich schwer nachzubilden; μώλωψ bezeichnet eine durch Schläge verursachte Strieme oder einen Bluterguss. Die deutsche idiomatische Fassung gibt wieder, dass der Betreffende solchen Verletzungen nicht entgeht.
- source_word: ὁ ὀμνύων
  choice: wer … schwört
  rationale: Das substantivierte Präsenspartizip bezeichnet hier eine Person, die dies gewohnheitsmäßig tut; der Fortsetzungscharakter wird zusammen mit διὰ παντός durch „fortwährend“ ausgedrückt.
- source_word: καὶ ὀνομάζων
  choice: und den Namen nennt
  rationale: Im Zusammenhang mit Schwüren liegt die Anrufung beziehungsweise Äußerung des göttlichen Namens nahe. „Den Namen“ bewahrt jedoch die Ellipse des griechischen Textes und legt den Bezug nicht ausdrücklich durch den Zusatz „Gottes“ fest.
- source_word: διὰ παντός
  choice: fortwährend
  rationale: Die Wendung kennzeichnet ein beständiges oder immer wiederkehrendes Verhalten.
- source_word: ἀπὸ ἁμαρτίας οὐ μὴ καθαρισθῇ
  choice: keinesfalls von Sünde gereinigt werden
  rationale: οὐ μή mit dem Aorist Konjunktiv ist eine nachdrückliche Verneinung. „Von Sünde gereinigt“ bewahrt die moralisch-religiöse Bildsprache von καθαρίζω.
theological_decisions:
- issue: Bezug von „den Namen nennt“
  choice: Wahrscheinliche Anspielung auf den göttlichen Namen beim wiederholten Schwören oder in ehrfurchtsloser Rede, ohne „Gott“ in den Haupttext einzufügen
  alternative: Allgemeines Nennen oder Anrufen eines Namens ohne besonderen Gottesbezug
  rationale: Der unmittelbare Zusammenhang mit dem Schwören macht den Gottesnamen wahrscheinlich; der griechische Text nennt das Bezugswort jedoch nicht ausdrücklich. Haupttext und Fußnote erhalten diese Spannung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Haussklave“ benennt den unfreien Status ohne Beschönigung; „Striemen“ macht den Bezug auf körperliche Züchtigung verständlich. Die emphatische Verneinung wird mit „keinesfalls“ wiedergegeben.
