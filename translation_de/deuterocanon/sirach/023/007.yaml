  text: Hear instruction of the mouth[a], children[b], and the one who keeps it will certainly not be caught.
translation:
  language: de
  text: Hört die Unterweisung über das Reden[a], Kinder; wer sie befolgt, wird ganz gewiss nicht ertappt werden.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die Unterweisung des Mundes“; auch möglich: „die Unterweisung für den Mund“. Der griechische Ausdruck ist knapp und bezeichnet eine Unterweisung, die das Reden betrifft.'
    reason: lexical_alternative
  - marker: b
    text: „Ganz gewiss nicht“ gibt eine nachdrückliche griechische Verneinung wieder. Statt „ertappt werden“ kann auch „ergriffen werden“ oder „sich verstricken“ übersetzt werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: Παιδείαν
  choice: Unterweisung
  rationale: παιδεία umfasst Unterweisung, Erziehung und Zucht. Im weisheitlichen Mahnkontext gibt „Unterweisung“ den lehrenden und formenden Sinn verständlich wieder, ohne die Bedeutung auf Bestrafung einzuengen.
- source_word: στόματος
  choice: über das Reden
  rationale: Wörtlich steht der Genitiv „des Mundes“. Gemeint ist in diesem Zusammenhang die Unterweisung, die den Gebrauch des Mundes und damit das Reden betrifft. „Über das Reden“ ist im modernen Deutschen natürlich und wahrt den Bezug auf die Sprache.
- source_word: ἀκούσατε
  choice: Hört
  rationale: Der Aoristimperativ fordert nachdrücklich zum aufmerksamen Hören auf. „Hört“ ist knapp, würdig und fügt dem Verb nicht ausdrücklich den Gedanken des Gehorsams hinzu.
- source_word: τέκνα
  choice: Kinder
  rationale: τέκνα ist ein Vokativ Plural und bezeichnet die Angeredeten als „Kinder“. Ein nicht vorhandenes Possessivpronomen wird nicht ergänzt.
- source_word: ὁ φυλάσσων
  choice: wer sie befolgt
  rationale: φυλάσσω kann „bewahren“, „hüten“ oder „beachten“ bedeuten. Bei einer Unterweisung bezeichnet „befolgen“ idiomatisch deren sorgfältige Beachtung. Das Pronomen „sie“ nimmt die zuvor genannte Unterweisung als im Griechischen unausgesprochenes Objekt auf.
- source_word: οὐ μὴ
  choice: ganz gewiss nicht
  rationale: Die Verbindung οὐ μή ist eine nachdrückliche Verneinung. „Ganz gewiss nicht“ bildet ihre verstärkende Wirkung in natürlichem Deutsch ab.
- source_word: ἁλῷ
  choice: ertappt werden
  rationale: Die Form von ἁλίσκομαι bedeutet „gefangen“, „ergriffen“ oder „ertappt werden“. „Ertappt werden“ lässt den Bezug auf Verfehlungen beim Reden erkennen, ohne die Aussage unnötig auf eine gerichtliche Verurteilung festzulegen.
theological_decisions:
- issue: Unausgesprochenes Objekt von φυλάσσων
  choice: Das Objekt wird mit „sie“ ergänzt und auf die zuvor genannte Unterweisung bezogen.
  alternative: Das Objekt unbestimmt lassen oder „den Mund“ als Objekt verstehen.
  rationale: Der nächstliegende grammatische Bezug ist παιδείαν. Im Deutschen verlangt „befolgen“ ein Objekt; dessen Ergänzung macht den Satz verständlich, ohne einen neuen Gedanken einzuführen.
- issue: Bedeutung der Schlussaussage
  choice: 'Allgemeine Folge: Wer die Unterweisung beachtet, wird nicht bei einer Verfehlung ertappt.'
  alternative: 'Enger forensisch: „wird keinesfalls verurteilt werden“; oder bildhafter: „wird sich keinesfalls verstricken“.'
  rationale: ἁλίσκομαι bezeichnet zunächst das Gefangen- oder Ergriffenwerden. Die gewählte Fassung bewahrt die allgemeine Warnung vor den Folgen falschen Redens und legt keine ausschließlich gerichtliche Deutung fest.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem weisheitlichem Ton. Der Anredecharakter von „Kinder“ und die emphatische Verneinung bleiben erhalten; das Semikolon gliedert Aufforderung und Folgesatz klar.
