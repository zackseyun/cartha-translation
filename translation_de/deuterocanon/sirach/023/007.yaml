  source_fidelity: Die Übersetzung gibt παιδείαν als „Unterweisung“, den knappen Genitiv στόματος idiomatisch als „über das Reden“, den Imperativ ἀκούσατε als „Hört“ und τέκνα als Anrede „Kinder“ sachgerecht wieder. „Wer sie befolgt“ macht das bei ὁ φυλάσσων nur implizite Objekt nachvollziehbar und bleibt beim naheliegenden Bezug auf die Unterweisung. Die verstärkte Verneinung οὐ μή und ἁλῷ werden mit „wird ganz gewiss nicht ertappt werden“ im Sinn einer nachdrücklich verneinten Folge angemessen vermittelt.
