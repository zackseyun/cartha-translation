lexical_decisions:
- source_word: ἐν τοῖς χείλεσιν αὐτοῦ
  choice: durch seine eigenen Lippen
  rationale: Das instrumentale „durch“ gibt wieder, dass die eigenen Äußerungen zum Mittel des Verhängnisses werden. „Lippen“ bewahrt das konkrete griechische Bild; „eigenen“ verdeutlicht im Deutschen den Rückbezug, ohne den Sinn zu verändern.
- source_word: καταλειφθήσεται
  choice: wird sich verstricken
  rationale: Das Verb bedeutet gewöhnlich „zurücklassen“ oder „verlassen“. Im Parallelismus mit „straucheln“ bezeichnet es hier wahrscheinlich, dass der Sünder durch sein Reden festgehalten oder zu Fall gebracht wird. „Sich verstricken“ ist im Deutschen idiomatisch, erhält das Bild sprachlich verursachter Selbstgefährdung und wird wegen der lexikalischen Mehrdeutigkeit mit einer Fußnote versehen.
- source_word: ἁμαρτωλός
  choice: der Sünder
  rationale: Die substantivische Einzahl bezeichnet sprichwortartig den sündigen Menschen; „der Sünder“ entspricht dem knappen Weisheitsstil.
- source_word: λοίδορος
  choice: der Lästerer
  rationale: Bezeichnet einen Menschen, der andere beschimpft oder schmäht. „Lästerer“ ist knapp, verständlich und wahrt den Bezug auf verletzende Rede.
- source_word: ὑπερήφανος
  choice: der Hochmütige
  rationale: „Der Hochmütige“ gibt die moralisch negative Bedeutung stolzer Selbstüberhebung präziser wieder als das neutraler klingende „der Stolze“.
- source_word: σκανδαλισθήσονται
  choice: werden straucheln
  rationale: „Straucheln“ bewahrt die griechische Metapher des Stolperns und möglichen Scheiterns, ohne einen späteren theologischen Fachsinn einzutragen.
- source_word: ἐν αὐτοῖς
  choice: durch sie
  rationale: Das Pronomen verweist am natürlichsten auf die Lippen zurück. „Durch sie“ gibt den instrumentalen Sinn wieder und erhält die Parallele zum ersten Satzteil.
