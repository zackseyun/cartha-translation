  text: Durch seine eigenen Lippen wird sich der Sünder verstricken[a]; auch der Lästerer und der Hochmütige werden durch sie straucheln.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Durch seine Lippen wird der Sünder zurückgelassen (oder: verlassen).“ Das griechische Verb bedeutet wörtlicher „zurücklassen“ oder „verlassen“; im Zusammenhang ist wahrscheinlich gemeint, dass der Sünder durch seine eigenen Worte verstrickt oder zu Fall gebracht wird.'
