  text: She will leave her memory for a curse, and her disgrace will not be wiped away.
translation:
  language: de
  text: Sie wird ihr Andenken als Fluch hinterlassen, und ihre Schande wird nicht getilgt werden.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καταλείψει
  choice: wird … hinterlassen
  rationale: Das Futur von καταλείπω bezeichnet hier, was nach ihr zurückbleibt. „Hinterlassen“ gibt diesen Sinn im Deutschen natürlich und präzise wieder.
- source_word: εἰς κατάραν
  choice: als Fluch
  rationale: 'εἰς mit Akkusativ bezeichnet hier Ergebnis oder Wirkung: Die Erinnerung an sie bleibt als Fluch bestehen. „Als Fluch“ ist im modernen Deutschen idiomatischer als „zum Fluch“ und wahrt die Aussage.'
- source_word: τὸ μνημόσυνον αὐτῆς
  choice: die Erinnerung an sich
  rationale: μνημόσυνον meint hier das fortdauernde Andenken beziehungsweise die Erinnerung an ihre Person, nicht ein gegenständliches Denkmal. Die reflexive Form ist wegen des deutschen Satzbaus eindeutig und natürlich.
- source_word: τὸ ὄνειδος αὐτῆς
  choice: ihre Schande
  rationale: ὄνειδος bezeichnet Schmach, Schande oder öffentlichen Makel. „Schande“ bewahrt sowohl die moralische als auch die gesellschaftliche Dimension in verständlicher Sprache.
- source_word: οὐκ ἐξαλειφθήσεται
  choice: wird nicht ausgelöscht werden
  rationale: Das Futur Passiv von ἐξαλείφω trägt das Bild des Auswischens oder Tilgens. „Ausgelöscht“ bewahrt die Metapher und ist im heutigen Deutschen geläufig.
theological_decisions:
- issue: Die dauerhafte öffentliche Schande der ehebrecherischen Frau im Kontext
  choice: Die scharfe Aussage über den bleibenden Fluch ihres Andenkens und ihre unauslöschliche Schande bleibt ungemildert stehen.
  alternative: Die Aussage zu einem allgemeinen Hinweis auf einen schlechten Ruf abschwächen oder ausdrücklich als göttliches Gericht erweitern.
  rationale: Der griechische Text spricht ausdrücklich von Fluch, Erinnerung und Schande, fügt in diesem Satz aber keine weitergehende theologische Erklärung hinzu. Die Übersetzung wahrt die Härte der Weisheitswarnung, ohne zusätzliche Lehrannahmen einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallele Satzstruktur des Griechischen bleibt erhalten; zugleich vermeidet die Formulierung unnötig altertümliche Wendungen.
