translation:
  language: de
  text: Bevor alles erschaffen wurde, war ihm alles bekannt, ebenso auch, nachdem alles vollendet war.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πρὶν ἢ
  choice: Bevor
  rationale: Leitet die zeitliche Vorordnung klar und idiomatisch ein.
- source_word: κτισθῆναι
  choice: erschaffen wurde
  rationale: Gibt den Aorist Passiv von κτίζω natürlich wieder und bewahrt den Schöpfungsbezug.
- source_word: τὰ πάντα
  choice: alles
  rationale: Bezeichnet umfassend die Gesamtheit; „alles“ ist im modernen Deutsch natürlich und wahrt den totalisierenden Sinn.
- source_word: ἔγνωσται αὐτῷ
  choice: war es ihm bekannt
  rationale: Bewahrt die stativ-resultative Bedeutung der Perfektform und gibt den Dativ αὐτῷ als „ihm“ wieder, ohne den im Kontext erkennbaren Bezug auf Gott ausdrücklich in den Text einzutragen.
- source_word: οὕτως καὶ
  choice: ebenso auch
  rationale: Erhält die ausdrückliche Parallelität zwischen dem Wissen vor der Erschaffung und nach der Vollendung.
- source_word: μετὰ τὸ συντελεσθῆναι
  choice: nachdem alles vollendet ist
  rationale: Gibt die temporale Konstruktion mit μετά und substantiviertem Infinitiv idiomatisch wieder; die Wiederaufnahme von „alles“ macht den Bezug im Deutschen deutlich.
theological_decisions:
- issue: Bezug von αὐτῷ
  choice: Das Pronomen „ihm“ bleibt stehen; Gott wird nicht ausdrücklich eingesetzt.
  alternative: „war es Gott bekannt“
  rationale: Der Kontext weist auf Gott als Bezug hin, doch der griechische Wortlaut nennt ihn in diesem Vers nicht ausdrücklich.
- issue: Diathese und Aussageweise von ἔγνωσται
  choice: 'Stativ-passivisch: „war es ihm bekannt“'
  alternative: 'Aktivisch: „hatte er es erkannt“ oder „kannte er es“'
  rationale: Die griechische Perfektform kann unterschiedlich repräsentiert werden. Die gewählte Fassung wahrt den Zustand vollständiger Kenntnis, während die Fußnote die mögliche aktivische Wiedergabe offenhält.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung bleibt nah an der knappen griechischen Satzstruktur, ohne den impliziten Gottesbezug oder die Mehrdeutigkeit der Perfektform stillschweigend aufzulösen.
