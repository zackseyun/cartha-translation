  yaml_path: translation/deuterocanon/sirach/023/003.yaml
  text: so that my ignorances may not multiply[a], and my sins may not increase, and I may fall before my adversaries[b], and my enemy may rejoice over me.
translation:
  language: de
  text: damit meine Verfehlungen aus Unwissenheit nicht zahlreicher werden[a] und meine Sünden nicht zunehmen, ich nicht vor meinen Widersachern zu Fall komme und mein Feind sich nicht über mich freut.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „meine Irrtümer“ oder „meine Taten aus Unwissenheit“. Das Griechische unterscheidet sie von den „Sünden“ im folgenden Satzteil.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: „über mich frohlockt“ oder „über mich triumphiert“. Das Verb kann die gehässige Freude eines Feindes über das Unglück eines anderen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπως μή
  choice: damit … nicht
  rationale: Leitet den beabsichtigten beziehungsweise gefürchteten Ausgang der vorausgehenden Bitte ein. Die deutsche Konstruktion gibt den final-konsekutiven Sinn natürlich wieder.
- source_word: αἱ ἄγνοιαι μου
  choice: meine aus Unwissenheit begangenen Verfehlungen
  rationale: ἄγνοια bezeichnet Unwissenheit oder einen daraus entstehenden Irrtum. Die Formulierung bewahrt den Unterschied zu den anschließend genannten Sünden, ohne das im Deutschen unnatürliche Abstraktum „meine Unwissenheiten“ zu verwenden.
- source_word: μὴ πληθύνωσιν
  choice: sich nicht mehren
  rationale: Gibt das Anwachsen beziehungsweise Zahlreicherwerden direkt und in würdigem modernem Deutsch wieder.
- source_word: αἱ ἁμαρτίαι μου
  choice: meine Sünden
  rationale: „Sünden“ ist die übliche und theologisch angemessene Wiedergabe von ἁμαρτίαι und hält den Ausdruck von ἄγνοιαι unterschieden.
- source_word: πλεονάσωσιν
  choice: nicht zunehmen
  rationale: Das einmal gesetzte μή erstreckt sich sinngemäß auf die koordinierte zweite Verbform. „Zunehmen“ wahrt die Bedeutungsnähe zu πληθύνωσιν, vermeidet aber eine schwerfällige Wiederholung.
- source_word: πεσοῦμαι
  choice: zu Fall komme
  rationale: Bewahrt das breite Bild des Fallens beziehungsweise Unterliegens, ohne die genaue Art des Scheiterns festzulegen.
- source_word: ἔναντι τῶν ὑπεναντίων
  choice: vor meinen Widersachern
  rationale: ἔναντι bezeichnet hier „vor“ oder „angesichts“, ὑπεναντίων die gegen den Sprecher Stehenden. „Widersacher“ ist präzise und stilistisch angemessen.
- source_word: ἐπιχαρεῖταί μοι
  choice: über mich triumphiert
  rationale: Das Verb bezeichnet Freude über das Missgeschick eines anderen und trägt im Feindkontext den Sinn gehässiger Genugtuung. „Triumphiert“ klingt im Deutschen natürlicher als das missverständliche „freut sich über mich“.
- source_word: ὁ ἐχθρός μου
  choice: mein Feind
  rationale: Gibt den Singular des griechischen Textes trotz der vorausgehenden Mehrzahl „Widersacher“ unverändert wieder.
theological_decisions:
- issue: Unterscheidung zwischen ἄγνοιαι und ἁμαρτίαι
  choice: ἄγνοιαι als „aus Unwissenheit begangene Verfehlungen“ und ἁμαρτίαι als „Sünden“ wiedergeben
  alternative: ἄγνοιαι mit „Irrtümer“ oder beide Ausdrücke nahezu synonym wiedergeben
  rationale: Der griechische Text unterscheidet erkennbar zwischen Verfehlungen, die mit Nichtwissen zusammenhängen, und Sünden. Die Übersetzung erhält diese Spannung, ohne daraus eine fest umrissene dogmatische Kategorie zu machen.
- issue: Reichweite der Verneinung μή
  choice: Die Verneinung auch auf πλεονάσωσιν und die folgenden gefürchteten Folgen beziehen
  alternative: Nur πληθύνωσιν ausdrücklich verneinen
  rationale: Im koordinierten Satzgefüge steht μή einmal und wirkt sinngemäß über die Reihe der unerwünschten Folgen fort. Eine positive Aussage, die Sünden sollten zunehmen, widerspräche Syntax und Zusammenhang.
- issue: Feindliche Freude in ἐπιχαρεῖταί μοι
  choice: „über mich triumphiert“
  alternative: „sich über mich freut“ oder „über mich frohlockt“
  rationale: Der Zusammenhang mit „mein Feind“ macht schadenfrohe Siegesfreude deutlich. Die gewählte Formulierung bringt diesen Sinn idiomatisch zum Ausdruck, ohne zusätzliche Lehrinhalte einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die abstrakte griechische Mehrzahl ἄγνοιαι wird verständlich entfaltet; die Parallelität mit „meine Sünden“ bleibt erhalten. Die Wiederholung von „damit“ macht die Folgeglieder trotz des langen Satzbaus klar lesbar.
