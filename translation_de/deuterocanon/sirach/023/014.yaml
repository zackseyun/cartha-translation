  yaml_path: translation/deuterocanon/sirach/023/014.yaml
  text: Remember your father and your mother[a], for you sit in the midst of great men; lest you be forgotten before them, and by your habit become foolish, and wish that you had not been born[b], and curse the day of your birth.
translation:
  language: de
  text: Denk an deinen Vater und deine Mutter, denn du sitzt inmitten hochgestellter Männer[a]. Hüte dich, dass du in ihrer Gegenwart nicht vergisst[b], durch deine Gewohnheit töricht wirst, dir wünschst, du wärst nicht geboren, und den Tag deiner Geburt verfluchst.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Hochgestellte Männer“ bezeichnet gesellschaftlich mächtige oder hochrangige Männer; möglich sind auch „Mächtige“ oder „hohe Herren“.
    reason: lexical_alternative
  - marker: b
    text: 'Das griechische Verb bedeutet „vergisst“; ein Objekt wird nicht ausdrücklich genannt. Je nach Verständnis kann gemeint sein: „dass du deine Eltern vergisst“ oder „dass du dich selbst vergisst“, also in ihrer Gegenwart die gebotene Zurückhaltung verlierst.'
    reason: alternative_reading
lexical_decisions:
- source_word: μνήσθητι
  choice: Denk an
  rationale: Der Aoristimperativ fordert zu bewusster Erinnerung auf. „Denk an“ ist im heutigen Deutsch direkt und natürlich.
- source_word: πατρὸς καὶ μητρός σου
  choice: deinen Vater und deine Mutter
  rationale: Die beiden Elternteile werden im Griechischen ausdrücklich einzeln genannt; dies wird beibehalten.
- source_word: ἀνὰ μέσον μεγιστάνων
  choice: inmitten hochgestellter Männer
  rationale: ἀνὰ μέσον bezeichnet die Mitte einer Gruppe; μεγιστάνες meint gesellschaftlich mächtige oder hochrangige Männer. „Hochgestellte Männer“ gibt Rang und grammatisches Geschlecht wieder, ohne einen bestimmten Adelstitel vorauszusetzen.
- source_word: συνεδρεύει
  choice: du sitzt
  rationale: Das Verb bezeichnet das Zusammensitzen, gegebenenfalls in einer Rats- oder Tischgemeinschaft. Die knappe Wiedergabe lässt die genaue gesellschaftliche Situation offen.
- source_word: ἐπιλαθῇ ἐνώπιον αὐτῶν
  choice: du vor ihnen nicht vergessen wirst
  rationale: Die überlieferte Form lässt eine passivische Wiedergabe zu. Diese wird im Haupttext bewahrt; die kontextuell plausible reflexive Deutung steht in der Fußnote.
- source_word: τῷ ἐθισμῷ σου
  choice: durch deine Gewohnheit
  rationale: ἐθισμός bezeichnet Gewohnheit oder eingeübtes Verhalten; der Dativ ist instrumental. Der griechische Text bewertet die Gewohnheit nicht ausdrücklich durch ein zusätzliches Adjektiv.
- source_word: μωρανθῇς
  choice: zum Toren wirst
  rationale: Die Form beschreibt das töricht Werden. Die substantivische deutsche Wendung ist prägnant und entspricht dem würdevollen Weisheitsstil.
- source_word: θελήσεις εἰ μὴ ἐγεννήθης
  choice: dir wünschst, du wärst nicht geboren
  rationale: Die idiomatische deutsche Form gibt den irrealen Wunsch des griechischen Ausdrucks klar wieder.
- source_word: τὴν ἡμέραν τοῦ τοκετοῦ σου
  choice: den Tag deiner Geburt
  rationale: τοκετός bezeichnet Geburt beziehungsweise Entbindung; „Tag deiner Geburt“ ist klar und stilistisch angemessen.
- source_word: μὴ καταράσῃ
  choice: und den Tag deiner Geburt verfluchst
  rationale: Das letzte Verb gehört zur fortlaufenden Warnung, die mit μή ποτε eröffnet wird. Im Deutschen wird die Negation durch „Hüte dich, dass ... nicht“ über die gesamte Aufzählung getragen.
theological_decisions:
- issue: Geschlecht und sozialer Rang bei μεγιστάνων
  choice: hochgestellte Männer
  alternative: hohe Herren; Mächtige; hochgestellte Personen
  rationale: Das maskuline griechische Gruppenwort bezeichnet gesellschaftlich hochrangige oder mächtige Männer. Die Übersetzung bewahrt diese historische Geschlechtsmarkierung, ohne den Personenkreis enger als die Quelle als „Adlige“ festzulegen.
- issue: Mehrdeutigkeit von ἐπιλαθῇ ἐνώπιον αὐτῶν
  choice: du vor ihnen nicht vergessen wirst
  alternative: du dich vor ihnen nicht vergisst; du in ihrer Gegenwart die Beherrschung nicht verlierst
  rationale: Die Form kann passivisch verstanden werden, während der Zusammenhang eine reflexive Warnung vor einem Verlust angemessener Zurückhaltung nahelegt. Der Haupttext folgt enger der Form; die Fußnote hält die kontextuelle Alternative offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter Weisheitsmahnung. Die Einleitung „Hüte dich“ macht die Reichweite von μή ποτε über die folgende Kette negativer Folgen idiomatisch deutlich. Die ungewöhnliche passivische Aussage „vor ihnen vergessen wirst“ bleibt wegen der echten griechischen Mehrdeutigkeit im Haupttext stehen und wird durch eine Fußnote erläutert.
