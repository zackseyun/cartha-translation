  terminology: „Erbe“ ist die präzise Wiedergabe von κληρονόμος. Die bisherige Fußnote verwendet „Außenstehender“, das im Deutschen unnötig abstrakt klingt, und legt die Bedeutung „Mann außerhalb der Ehe“ zu kategorisch fest. Eine Fußnote mit der enger am Griechischen bleibenden Alternative „Fremden“ wahrt die lexikalische Offenheit besser.
