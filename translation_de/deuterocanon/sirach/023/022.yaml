  text: So also a woman who leaves her husband and presents an heir by another man;[a]
translation:
  language: de
  text: Ebenso eine Frau, die ihren Mann verlässt und einen Erben von einem anderen Mann vorweist.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »einen Erben von einem Fremden vorweist«. Das griechische ἐξ ἀλλοτρίου bedeutet wörtlich „von einem anderen/Fremden“. Im ehelichen Zusammenhang kann es einen anderen Mann bezeichnen; die Hauptübersetzung macht die gemeinte Abstammung deutlich.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως καὶ
  choice: So auch
  rationale: Bewahrt die vergleichende und anknüpfende Funktion der griechischen Wendung knapp und natürlich.
- source_word: γυνὴ
  choice: eine Frau
  rationale: γυνή kann Frau oder Ehefrau bedeuten; der unmittelbar folgende Ausdruck „ihren Mann“ macht die eheliche Beziehung bereits deutlich.
- source_word: καταλιποῦσα
  choice: die … verlässt
  rationale: Gibt das Aoristpartizip in einer für einen allgemeinen Aussagesatz natürlichen deutschen Relativkonstruktion wieder, ohne die stärkere Wertung „im Stich lässt“ einzutragen.
- source_word: τὸν ἄνδρα
  choice: ihren Mann
  rationale: ἀνήρ bezeichnet hier aufgrund des ehelichen Zusammenhangs den Ehemann; das Possessivpronomen ist im Deutschen idiomatisch erforderlich.
- source_word: παριστῶσα
  choice: vorweist
  rationale: Bewahrt den Gedanken des Vorstellens oder Präsentierens einer Person in einer rechtlich-familiären Rolle. „Gebiert“ wäre zwar kontextuell möglich, stünde aber nicht ausdrücklich im griechischen Verb.
- source_word: κληρονόμον
  choice: einen Erben
  rationale: Die übliche und präzise Wiedergabe für jemanden, der erbt oder als Nachfolger im Erbrecht gilt.
- source_word: ἐξ ἀλλοτρίου
  choice: von einem anderen Mann
  rationale: ἐκ bezeichnet hier die Herkunft beziehungsweise Abstammung; ἀλλότριος meint im ehelichen Zusammenhang einen nicht zum Ehemann gehörenden, also anderen Mann. Die Wiedergabe macht die gemeinte Vaterschaft verständlich, ohne „Fremder“ fälschlich auf persönliche Unbekanntheit zu verengen.
theological_decisions:
- issue: Moralisch-rechtliche Aussage über Ehebruch und Erbfolge
  choice: Die Handlungen werden beschrieben, ohne die Frau ausdrücklich als „Ehebrecherin“ zu bezeichnen oder die Rechtsgültigkeit des Erbanspruchs näher zu bestimmen.
  alternative: So auch eine Ehebrecherin, die ihren Mann verlässt und von einem Fremden ein uneheliches Kind bekommt.
  rationale: Der griechische Text enthält weder die Bezeichnung „Ehebrecherin“ noch „uneheliches Kind“, sondern spricht von einer Frau, ihrem Mann und einem Erben von einem Außenstehenden. Die Übersetzung wahrt diese Spannung und vermeidet zusätzliche moralische oder rechtliche Festlegungen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Vorweist“ hält den rechtlich-familiären Unterton von παριστῶσα fest und vermeidet die nicht ausdrücklich im Verb enthaltene Festlegung auf „gebiert“ oder „bringt zur Welt“.
