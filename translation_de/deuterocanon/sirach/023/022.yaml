  source_fidelity: 'Der Entwurf gibt die Satzstruktur und die zentralen Begriffe des Griechischen im Wesentlichen zutreffend wieder: γυνή, καταλιποῦσα, τὸν ἄνδρα, κληρονόμον und die herkunftsbezeichnende Präposition ἐξ. Die explizite Ergänzung „Mann“ bei ἀλλοτρίου ist im Kontext gut begründet, sollte in der Anmerkung jedoch als kontextuelle Präzisierung und nicht als zwingende lexikalische Bedeutung dargestellt werden.'
