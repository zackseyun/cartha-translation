  text: Her children will not take root[a], and her branches will not bear fruit;
translation:
  language: de
  text: Ihre Kinder werden keine Wurzeln schlagen[a], und ihre Zweige werden keine Frucht tragen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „Ihre Kinder werden sich nicht zu einer Wurzel ausbreiten.“ Das griechische Bild bezeichnet, dass sie sich nicht fest verwurzeln und keinen Bestand gewinnen.'
    reason: Die griechische Formulierung ist verdichtet und lässt sich im Deutschen nur unnatürlich wörtlich nachbilden.
lexical_decisions:
- source_word: διαδώσουσιν
  choice: werden … schlagen
  rationale: Das Verb bezeichnet ein Sich-Ausbreiten oder Ausdehnen. Zusammen mit εἰς ῥίζαν ergibt sich ein verdichtetes Pflanzenbild, das im Deutschen idiomatisch mit „Wurzeln schlagen“ wiedergegeben wird.
- source_word: τὰ τέκνα αὐτῆς
  choice: ihre Kinder
  rationale: τέκνα bezeichnet unmittelbar Kinder beziehungsweise Nachkommen. „Kinder“ ist klar, natürlich und bewahrt das familiäre Bild.
- source_word: εἰς ῥίζαν
  choice: Wurzeln
  rationale: Wörtlich steht der Singular „zu/in eine Wurzel“. Die deutsche Wendung „Wurzeln schlagen“ gibt den Sinn des botanischen Bildes natürlich wieder, ohne die Aussage auszudeuten.
- source_word: οἱ κλάδοι αὐτῆς
  choice: ihre Zweige
  rationale: κλάδοι bezeichnet Zweige oder Äste. „Zweige“ passt zum Bild von Wurzel und Frucht und klingt im heutigen Deutsch natürlich.
- source_word: οὐ δώσουσιν καρπόν
  choice: werden keine Frucht tragen
  rationale: Wörtlich heißt es „werden keine Frucht geben“. „Frucht tragen“ ist die übliche deutsche Ausdrucksweise und erhält das Pflanzenbild.
theological_decisions:
- issue: Bildhafte Gerichtsaussage über die Frau und ihre Nachkommenschaft im Kontext
  choice: Das familiäre und botanische Bild bleibt ohne zusätzliche moralische Ausdeutung erhalten.
  alternative: 'Expliziter formulieren: „Ihre Nachkommen werden keinen Bestand haben und unfruchtbar bleiben.“'
  rationale: Der griechische Text drückt die Folge durch die Bilder von Kindern, Wurzel, Zweigen und Frucht aus. Eine erklärende Wiedergabe würde die genuine Bildsprache und ihre Spannung unnötig auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die vertraute Pflanzenmetaphorik wird durch „Wurzeln schlagen“, „Zweige“ und „Frucht tragen“ zusammenhängend und verständlich bewahrt.
