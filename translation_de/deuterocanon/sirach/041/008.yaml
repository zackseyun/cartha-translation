  text: Woe to you[a], wicked men[b], who have abandoned the law of the Most High.
translation:
  language: de
  text: Weh euch, ihr frevelhaften Männer, die ihr das Gesetz[b] des Höchsten[a] verlassen habt!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Parallele lautet: „Gottes, des Höchsten“ beziehungsweise „des höchsten Gottes“. Der hebräische Hauptzeuge hat nur: „des Höchsten“.'
    reason: alternative_reading
  - marker: b
    text: Das hebräische Wort תורה kann auch „Weisung“ oder „Lehre“ bedeuten; „Gesetz“ entspricht hier dem wahrscheinlichen Bundesbezug und wird durch das griechische νόμος gestützt.
    reason: lexical_alternative
lexical_decisions:
- source_word: אוי / οὐαί
  choice: Weh
  rationale: Die Interjektion drückt sowohl Klage als auch prophetische Unheilsansage aus; „Weh“ bewahrt diese Kraft.
- source_word: לכם / ὑμῖν
  choice: euch
  rationale: Bezeichnet unmittelbar die Angeredeten und entspricht der natürlichen deutschen Wendung „Weh euch“.
- source_word: אנשי רשע / ἄνδρες ἀσεβεῖς
  choice: ihr frevelhaften Männer
  rationale: Das Hebräische bezeichnet Männer, die durch Bosheit oder schuldhaftes Handeln gekennzeichnet sind; „frevelhaft“ wahrt die moralisch-religiöse Schärfe, ohne den griechischen Akzent auf Gottlosigkeit über die hebräische Grundlage zu stellen.
- source_word: אשר / οἵτινες
  choice: die ihr
  rationale: Die Verbindung nimmt die direkte Anrede im Deutschen klar und natürlich auf.
- source_word: עזבתם / ἐγκατελίπετε
  choice: verlassen habt
  rationale: Beide Zeugen bezeichnen ein Zurücklassen oder Aufgeben; im Zusammenhang trägt „verlassen“ auch den Gedanken bewusster Bundestreueverletzung, ohne ihn zusätzlich auszudeuten.
- source_word: תורת / νόμον
  choice: das Gesetz
  rationale: תורה kann „Weisung“ oder „Lehre“ bedeuten; hier sprechen der bundestheologische Zusammenhang und das griechische νόμος für „Gesetz“ als Hauptwiedergabe.
- source_word: עליון / θεοῦ Ὑψίστου
  choice: des Höchsten
  rationale: Der hebräische Hauptzeuge hat nur den göttlichen Titel „der Höchste“; die kürzere Wiedergabe folgt ihm, während die griechische Erweiterung in einer Fußnote festgehalten wird.
theological_decisions:
- issue: Gottesbezeichnung עליון gegenüber griechisch θεοῦ Ὑψίστου
  choice: des Höchsten
  alternative: Gottes, des Höchsten / des höchsten Gottes
  rationale: Da der hebräische Hauptzeuge das Wort „Gott“ nicht ausdrücklich enthält, bleibt der Haupttext bei dessen knapper Form. Die griechische Parallele macht den ohnehin göttlich verstandenen Titel ausdrücklich und wird als Lesart dokumentiert.
- issue: Bedeutungsumfang von תורה
  choice: Gesetz
  alternative: Weisung / Lehre
  rationale: „Gesetz“ erhält den wahrscheinlichen Bundesbezug und wird durch νόμος in der griechischen Parallele gestützt; die weitere Bedeutung des hebräischen Wortes bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die einleitende Weheruf-Formel bleibt bewusst knapp und eindringlich; die männliche Bezeichnung des Ausgangstextes wird nicht neutralisiert.
