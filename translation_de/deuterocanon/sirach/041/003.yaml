  text: Do not fear the decree of your death[c][b][a]; remember that those before and those after are with you.
translation:
  language: de
  text: 'Fürchte die Bestimmung deines Todes nicht[a][b]; bedenke: Die Früheren und die Späteren sind mit dir[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich ist der hebräische Ausdruck gedrängt: „Fürchte dich nicht vor dem Tod, deiner Bestimmung/deinem zugeteilten Los.“'
    reason: alternative_reading
  - marker: b
    text: 'Die griechische Parallele lautet: „Fürchte das Urteil des Todes nicht.“ „Bestimmung deines Todes“ gibt den wahrscheinlichen gemeinsamen Sinn beider Überlieferungen wieder.'
    reason: textual_variant
  - marker: c
    text: '„Die Früheren und die Späteren sind mit dir“ meint wahrscheinlich: Frühere und spätere Menschen teilen dasselbe Los der Sterblichkeit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אל תפחד
  choice: Fürchte … nicht
  rationale: Die hebräische Verneinung mit פחד ist eine direkte Mahnung, sich nicht zu fürchten. Die knappe deutsche Form wahrt den ernsten Ton.
- source_word: ממות חקיך
  choice: die Bestimmung deines Todes
  rationale: Der hebräische Wortlaut ist gedrängt und verbindet Tod mit חק, das eine Festsetzung, Bestimmung oder ein zugeteiltes Los bezeichnen kann. Die griechische Parallele κρίμα θανάτου stützt den Gedanken eines über den Tod ergangenen Spruchs oder einer Bestimmung. Die persönliche Anrede wird im Deutschen mit „deines“ aufgenommen.
- source_word: זכור
  choice: denk daran
  rationale: Das Imperativwort bedeutet „erinnere dich“ oder „halte dir vor Augen“. „Denk daran“ ist in modernem Standarddeutsch natürlich und würdevoll.
- source_word: ראשנים ואחרנים
  choice: die vor dir und die nach dir
  rationale: Die zeitliche Gegenüberstellung der Früheren und Späteren bleibt erhalten. Das von der griechischen Parallele ausdrücklich gestützte „dir“ verdeutlicht den Bezug, ohne den Ausdruck auf Generationen einzuengen.
- source_word: עמך
  choice: sind mit dir
  rationale: Dies entspricht dem wörtlichen Sinn. Der Zusammenhang legt ein gemeinsames Sterblichkeitslos nahe, doch diese Deutung wird nicht an die Stelle des offenen Bildes gesetzt.
theological_decisions:
- issue: Wie der gedrängte hebräische Ausdruck über Tod und Bestimmung wiederzugeben ist
  choice: die Bestimmung deines Todes
  alternative: den Tod; das Urteil des Todes; dein bestimmtes Ende
  rationale: Die Formulierung gibt dem hebräischen Zeugnis Vorrang, berücksichtigt aber die griechische Parallele. Sie bewahrt die Spannung zwischen Tod als festgesetztem Los und einem Urteil oder Beschluss über den Tod, ohne daraus eine besondere Lehre über Vorherbestimmung abzuleiten.
- issue: Wie das Mitsein der Früheren und Späteren zu verstehen ist
  choice: die offene Formulierung „sind mit dir“ beibehalten
  alternative: sie teilen dein Los
  rationale: Gemeinsame Sterblichkeit ist im Zusammenhang wahrscheinlich, doch der hebräische Text formuliert weiter und bildhafter. Die Auslegung wird deshalb in die Fußnote gestellt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Mahnung bleibt knapp; die ungewöhnliche Wendung „Bestimmung deines Todes“ bewahrt bewusst die Mehrdeutigkeit zwischen festgesetztem Los und Urteil. Alle Fußnotenmarker stehen an der jeweils erläuterten Textstelle.
