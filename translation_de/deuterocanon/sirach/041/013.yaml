base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/041/013.yaml
  text: The good of life is a limited number of days[b][a], but the good of a name is days without number.
translation:
  language: de
  text: 'Das Gute des Lebens: eine begrenzte Zahl von Tagen; das Gute eines Namens[a]: Tage ohne Zahl.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Name“ bezeichnet hier nicht nur die persönliche Benennung, sondern auch den Ruf und das ehrende Andenken eines Menschen.
    reason: lexical_alternative
  - marker: b
    text: 'Griechisch: „Und ein guter Name wird für immer bestehen.“'
    reason: alternative_reading
lexical_decisions:
- source_word: טובת
  choice: das Gute
  rationale: Die substantivische Wiedergabe bewahrt die parallele hebräische Wendung in beiden Vershälften und fügt keinen im Wortlaut nicht ausdrücklich vorhandenen Vergleich ein.
- source_word: חי
  choice: des Lebens
  rationale: Das Wort wird hier abstrakt als „Leben“ verstanden; dies entspricht dem Zusammenhang und wird durch das griechische ζωῆς gestützt.
- source_word: ימי מספר
  choice: eine begrenzte Zahl von Tagen
  rationale: Die wörtliche Vorstellung von „Tagen der Zahl“ bezeichnet zählbare und damit begrenzte Tage. Die gewählte Formulierung gibt den hebräischen Ausdruck in natürlichem Deutsch wieder.
- source_word: שם
  choice: Name
  rationale: „Name“ erhält das konkrete hebräische Bild; gemeint ist dabei auch der Ruf beziehungsweise das ehrende Andenken einer Person, was eine Fußnote erläutert.
- source_word: ימי אין מספר
  choice: Tage ohne Zahl
  rationale: Die knappe Formulierung bildet den hebräischen Gegensatz zu den begrenzten, zählbaren Lebenstagen nach. Das griechische „für immer“ wird nicht in den Haupttext übernommen, sondern in einer Fußnote dokumentiert.
theological_decisions:
- issue: Verhältnis zwischen dem hebräischen Ausdruck und der griechischen Deutung
  choice: Im Haupttext bleibt der hebräische Gegensatz zwischen begrenzten Lebenstagen und den Tagen ohne Zahl eines Namens erhalten.
  alternative: „Ein guter Name bleibt für immer.“
  rationale: Der klare, mit hoher Sicherheit bezeugte hebräische Text ist vorrangig. Die griechische Parallelüberlieferung deutet die zweite Vershälfte ausdrücklich als ewiges Fortbestehen; diese Lesart wird in der Fußnote bewahrt, ohne die Spannung einzuebnen.
translation_notes:
  register: Knappe, sprichwortartige und würdige Sprache. Der Doppelpunkt und das Semikolon erhalten den parallelen Nominalstil des Hebräischen, während „eine begrenzte Zahl von Tagen“ den hebräischen Ausdruck für heutige Leser verständlich macht.
