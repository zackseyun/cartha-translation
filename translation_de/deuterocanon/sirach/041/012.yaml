  text: Be concerned for your name, for it will go with you more than a thousand stores of wisdom.
translation:
  language: de
  text: Sorge dich um deinen Namen[a], denn er begleitet dich mehr als tausend Schatzkammern der Weisheit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '»Name« kann hier den Ruf oder das Ansehen meinen. Die griechische Überlieferung weicht ab: »Sorge dich um deinen Namen, denn er wird dir bleiben mehr als tausend große Goldschätze.«'
    reason: Erläutert die idiomatische Bedeutung von »Name« ohne eine positive Wertung in den Haupttext einzutragen und dokumentiert die wichtige griechische Lesart mit »Gold« statt »Weisheit«.
lexical_decisions:
- source_word: פחד
  choice: Sorge dich
  rationale: Das hebräische Wort bezeichnet hier im Zusammenhang eine besorgte, achtsame Rücksichtnahme; die griechische Parallele φρόντισον bestätigt diese imperative Bedeutung.
- source_word: שם
  choice: guten Namen
  rationale: Wörtlich »Name«, idiomatisch jedoch der Ruf beziehungsweise das Ansehen eines Menschen. »Guter« macht die im Deutschen sonst leicht unklare positive Bedeutung natürlich verständlich.
- source_word: ילוך
  choice: begleitet dich länger
  rationale: Die Form wird im Sinn von »mit dir gehen/bei dir bleiben« verstanden. Das vergleichende מן vor »tausend« erfordert im Deutschen eine vergleichende Wendung; die griechische Parallele διαμενεῖ stützt den Gedanken des Fortbestehens.
- source_word: מאלפי אוצרות חכמה
  choice: als tausend Schätze der Weisheit
  rationale: Gibt die gut bezeugte hebräische Lesart mit »Weisheit« wieder, statt dem griechischen »Gold« zu folgen. אוצרות bedeutet »Schätze/Schatzkammern/Vorräte«; »Schätze« ist hier die natürlichste deutsche Fassung.
theological_decisions:
- issue: Hebräische Lesart »Weisheit« gegenüber griechischer Lesart »Gold«
  choice: Weisheit
  alternative: Gold
  rationale: Die angegebene hebräische Quelle ist primär und mit hoher Sicherheit validiert. Die griechische Parallele bezeugt offenbar eine abweichende Texttradition.
- issue: Zeitliche oder wertmäßige Vergleichsrelation
  choice: länger als
  alternative: mehr als / wertvoller als
  rationale: ילוך legt ein Mitgehen beziehungsweise Fortbestehen nahe, und das griechische διαμενεῖ bestätigt die zeitliche Nuance. Wegen einer verbleibenden semantischen Unschärfe wird die Alternative in einer Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der idiomatische Ausdruck »guter Name« erschließt die Bedeutung als Ruf oder Ansehen; die Fußnote bewahrt die textliche und semantische Spannung.
