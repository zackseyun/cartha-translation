  yaml_path: translation/deuterocanon/sirach/041/016.yaml
  text: 'Instruction in shame: hear[a], sons, and be ashamed according to my judgments. Not every shame is fitting to keep[b], and not every disgrace is rightly chosen.'
translation:
  language: de
  text: 'Unterweisung über die Scham: Hört, ihr Söhne[b], und schämt euch nach meinen Maßstäben. Nicht jede Scham ist angemessen zu bewahren, und nicht jede Schande ist vorzuziehen.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Paralleltext lautet: „Darum schämt euch bei meinem Wort; denn es ist nicht gut, jede Scham zu bewahren, und nicht alles findet bei allen im Glauben Anerkennung.“ Besonders das Schlussglied weicht deutlich vom erhaltenen hebräischen Text ab.'
    reason: alternative_reading
  - marker: b
    text: „Söhne“ gibt die maskuline hebräische Anrede wieder und bewahrt die Redeform des Weisheitslehrers.
    reason: cultural_note
lexical_decisions:
- source_word: מוסר בשת
  choice: Unterweisung über die Scham
  rationale: מוסר bezeichnet in der Weisheitsliteratur formende Unterweisung oder Zucht. Zusammen mit בשת leitet die Wendung eine Belehrung über angemessene und unangemessene Scham ein; „Unterweisung über die Scham“ ist im Deutschen natürlicher als das wörtlichere „Unterweisung in Scham“.
- source_word: שמעו בנים
  choice: Hört, ihr Söhne
  rationale: Der Imperativ und die ausdrücklich maskuline Anrede werden in der traditionellen Redeform des Weisheitslehrers bewahrt. Das eingefügte „ihr“ macht die Anrede im Deutschen idiomatisch.
- source_word: והכלמו
  choice: und schämt euch
  rationale: Die exhortative Verbform fordert die Angeredeten dazu auf, dort Scham zu empfinden, wo sie angebracht ist. „Schämt euch“ ist knapp, natürlich und entspricht auch dem griechischen ἐντράπητε.
- source_word: על משפטי
  choice: nach meinen Maßstäben
  rationale: משפטי kann hier die Urteile, Bestimmungen oder wertenden Maßstäbe des Lehrers bezeichnen. „Nach meinen Maßstäben“ gibt die durch על ausgedrückte Orientierung idiomatisch wieder, ohne die Wendung mit dem griechischen „bei meinem Wort“ gleichzusetzen.
- source_word: לא כל בשת נאה לשמור
  choice: Nicht jede Scham ist angemessen zu bewahren
  rationale: נאה bezeichnet das Angemessene oder Schickliche, לשמור das Bewahren oder Festhalten. Die Formulierung erhält die ungewöhnliche Vorstellung, Scham zu bewahren, statt sie erklärend aufzulösen.
- source_word: ולא כל הכלם נבחר
  choice: und nicht jede Beschämung ist vorzuziehen
  rationale: הכלם gehört zum Bedeutungsfeld Scham, Schande und Beschämung; נבחר bezeichnet das Ausgewählte oder Vorzuziehende. „Beschämung“ markiert den Wechsel der hebräischen Form, während „vorzuziehen“ die Auswahlmetaphorik verständlich erhält.
theological_decisions:
- issue: Geschlechtsspezifische Anrede בנים
  choice: ihr Söhne
  alternative: ihr Kinder
  rationale: Der hebräische Text redet ausdrücklich „Söhne“ an. Die maskuline Weisheitsanrede wird nicht stillschweigend neutralisiert.
- issue: Abweichung des griechischen Paralleltextes im Schlussglied
  choice: Der erhaltene hebräische Wortlaut bestimmt den Haupttext.
  alternative: 'Dem Griechischen folgen: „Denn es ist nicht gut, jede Scham zu bewahren, und nicht alles findet bei allen im Glauben Anerkennung.“'
  rationale: Der hebräische Text ist hier vorhanden und hoch zuverlässig bezeugt. Das deutlich abweichende griechische Schlussglied wird deshalb transparent in einer Fußnote dokumentiert, aber nicht in den Haupttext eingemischt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit der knappen Mahnrede eines Weisheitslehrers. Die Wiederholung des Scham-Wortfeldes und die Spannung zwischen zu bewahrender und nicht vorzuziehender Scham bleiben erhalten; schwerfällige Archaismen werden vermieden.
