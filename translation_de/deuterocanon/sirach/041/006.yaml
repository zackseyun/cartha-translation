translation:
  language: de
  text: Von einem Kind des Unrechts geht die Herrschaft des Bösen aus, und Schande bleibt stets bei seinen Nachkommen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Griechisch: „Das Erbe der Kinder von Sündern wird zugrunde gehen, und bei ihren Nachkommen wird die Schmach fortbestehen.“ Der hier erhaltene hebräische Text ist besonders in der zweiten Vershälfte schwierig, weist aber ebenfalls auf bleibende Schande hin, die mit den Nachkommen des Ungerechten verbunden ist.'
    reason: alternative_reading
lexical_decisions:
- source_word: מבן עול
  choice: von einem Kind des Unrechts
  rationale: Die Präposition מ־ bezeichnet den Ausgangspunkt; בן wird geschlechtsübergreifend als „Kind“ wiedergegeben. „Unrecht“ bewahrt den moralischen Sinn von עול und die knappe, ungewöhnliche hebräische Verbindung.
- source_word: ממשלת רע
  choice: die Herrschaft des Bösen
  rationale: ממשלה bezeichnet Herrschaft oder Herrschaftsmacht. רע kann substantivisch „das Böse“ oder adjektivisch „böse“ verstanden werden; die gewählte Genitivverbindung wahrt die kompakte Konstruktion, ohne sie auf eine bestimmte politische Herrschaft zu verengen.
- source_word: וריש עם
  choice: und Schande
  rationale: Die überlieferte hebräische Form ist schwierig. Das griechische ὄνειδος stützt den Sinn „Schande/Schmach“; „Schande“ ist in modernem Deutsch klar und würdig.
- source_word: זרעו
  choice: seinen Nachkommen
  rationale: זרע meint hier die leibliche Nachkommenschaft. „Nachkommen“ ist natürlicher als das wörtliche „Same“ und lässt Singular oder Kollektiv offen.
- source_word: תמיד
  choice: stets
  rationale: תמיד drückt fortdauernde Beständigkeit aus; „stets“ ist knapp und passt zum würdigen Register.
theological_decisions:
- issue: Vorrang des erhaltenen hebräischen Textes bei schwieriger zweiter Vershälfte
  choice: Die hebräische Satzstruktur bleibt maßgeblich; der griechische Paralleltext klärt lediglich den Sinn der zweiten Hälfte als fortdauernde Schande der Nachkommen.
  alternative: 'Dem Griechischen vollständig folgen: „Das Erbe der Kinder von Sündern wird zugrunde gehen, und bei ihren Nachkommen wird die Schmach fortbestehen.“'
  rationale: Der erhaltene hebräische Zeuge hat Vorrang. Da וריש עם textlich schwer verständlich ist, wird die griechische Überlieferung als Kontrollzeuge genutzt, ohne ihre abweichende Aussage über das zugrunde gehende Erbe in den Haupttext einzutragen.
- issue: Mehrdeutigkeit von ממשלת רע
  choice: „die Herrschaft des Bösen“
  alternative: „böse Herrschaft“
  rationale: Die substantivische Deutung von רע ist gut möglich und entspricht der hebräischen Wortfolge. Die alternative adjektivische Deutung bleibt sprachlich möglich und wird nicht zu einer konfessionellen Aussage ausgebaut.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Die ungewöhnliche Wendung „Kind des Unrechts“ bewahrt bewusst die Bildsprache des hebräischen Textes; „geht … aus“ macht die elliptische Beziehung im Deutschen lesbar.
