  text: Hidden wisdom and a concealed treasure—what benefit is there in either of them?[a][b]
translation:
  language: de
  text: Verborgene Weisheit und ein versteckter Schatz – welchen Nutzen haben beide?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Was für ein Nutzen ist in beiden?“ Gemeint ist die rhetorische Frage, welchen Nutzen verborgene Weisheit und ein versteckter Schatz haben.'
    reason: lexical_alternative
  - marker: b
    text: 'Die griechische Parallelüberlieferung stellt vor diesen Satz die Worte: „Bewahrt die Unterweisung in Frieden, Kinder.“ Die hier zugrunde gelegte hebräische Überlieferung beginnt mit der Aussage über die verborgene Weisheit.'
    reason: textual_variant
lexical_decisions:
- source_word: חכמה
  choice: Weisheit
  rationale: Die übliche und kontextuell passende Bedeutung; sie entspricht auch dem griechischen σοφία.
- source_word: טמונה
  choice: verborgen
  rationale: Das Partizip bezeichnet etwas, das verborgen gehalten oder verwahrt wird. „Verborgen“ ist prägnant und lässt offen, auf welche Weise dies geschieht.
- source_word: אוצר
  choice: Schatz
  rationale: Im Parallelismus mit der Weisheit ist der wertvolle Besitz gemeint, nicht vorrangig ein Vorratsraum; auch griechisch θησαυρός stützt diese Wiedergabe.
- source_word: מוסתר
  choice: versteckt
  rationale: Die Wiedergabe erhält den poetischen Parallelismus, ohne „verborgen“ zu wiederholen, und bezeichnet natürlich etwas, das dem Blick oder Zugriff entzogen ist.
- source_word: מה תועלה
  choice: welchen Nutzen haben
  rationale: Die Wendung fragt rhetorisch nach dem praktischen Wert. Diese Formulierung ist in modernem Deutsch natürlich und knapp.
- source_word: בשתיהם
  choice: beide
  rationale: Dies bildet den hebräischen Ausdruck „bei/in beiden“ formal näher ab als „eines von beiden“ und bewahrt die mögliche kollektive Aussage über das Paar.
