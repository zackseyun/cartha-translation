translation_notes:
  register: Modernes, würdiges Standarddeutsch mit erkennbarer Listenstruktur. Die elliptische Fortführung von „schäme dich“ bewahrt den knappen hebräischen Parallelismus. Die Fußnoten markieren sowohl die Abweichung der griechischen Überlieferung als auch die Unsicherheit des letzten hebräischen Satzteils.
