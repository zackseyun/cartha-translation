  text: Before a master and mistress[a], be ashamed of a lie; before an assembly and the people, of transgression; before a companion and a friend, of wrongdoing; and where you sojourn[c][b], of theft.
translation:
  language: de
  text: Vor einem Herrn und einer Herrin[a] schäme dich einer Lüge, vor einer Versammlung und dem Volk einer Übertretung, vor einem Gefährten und einem Freund eines Unrechts[b] und an dem Ort, an dem du wohnst, eines Diebstahls[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: „Herr und Herrin“; die griechische Parallelüberlieferung hat „Richter und Herrscher“. Der Haupttext folgt dem erhaltenen hebräischen Zeugnis.'
    reason: textual_variant
  - marker: b
    text: Das hebräische מעל kann auch „Vertrauensbruch“, „Untreue“ oder „Verfehlung“ bedeuten.
    reason: lexical_alternative
  - marker: c
    text: 'Der letzte hebräische Satzteil ist schwierig; annähernd wörtlich: „und von/an dem Ort, an dem du wohnst, wegen זר“. זר kann „fremd“ oder „einem anderen gehörend“ bedeuten. Die griechische Parallelüberlieferung weist auf „Diebstahl“; diesem Sinn folgt der Haupttext.'
    reason: textual_variant
lexical_decisions:
- source_word: מאדון וגברת
  choice: vor einem Herrn und einer Herrin
  rationale: Das hebräische Zeugnis nennt wörtlich einen Herrn und eine Herrin. Das Präfix מ־ wird im Zusammenhang der Schamreihe idiomatisch mit „vor“ wiedergegeben.
- source_word: על שקר
  choice: einer Lüge
  rationale: Die Präposition על bezeichnet hier jeweils den Anlass der Scham. „Lüge“ bewahrt die konkrete nominale Form des Hebräischen.
- source_word: מעדה ועם
  choice: vor einer Versammlung und dem Volk
  rationale: עדה bezeichnet eine Versammlung oder Gemeinde; „Versammlung“ vermeidet eine unnötige kultische Festlegung.
- source_word: על פשע
  choice: einer Übertretung
  rationale: פשע bezeichnet einen gewichtigen Verstoß oder eine Übertretung; die Wiedergabe erhält das moralische Gewicht.
- source_word: מחבר ורע
  choice: vor einem Gefährten und einem Freund
  rationale: Die beiden Wörter bezeichnen nahestehende soziale Beziehungen. „Gefährte und Freund“ wahrt die Parallelität, ohne eine geschäftliche Partnerschaft vorauszusetzen.
- source_word: על מעל
  choice: eines Unrechts
  rationale: מעל kann Untreue, Vertrauensbruch oder Verfehlung bezeichnen. „Unrecht“ ist im zwischenmenschlichen Zusammenhang eine natürliche, hinreichend offene Wiedergabe.
- source_word: וממקום תגור
  choice: und an dem Ort, wo du wohnst
  rationale: Die schwierige Wendung verweist wahrscheinlich auf den Wohn- oder Aufenthaltsort. Die Übersetzung bleibt nah an מקום und גור, ohne einen nur vorübergehenden Aufenthalt zwingend festzulegen.
- source_word: על זר
  choice: eines Diebstahls
  rationale: Der hebräische Wortlaut ist unsicher und für sich genommen schwer verständlich. Die griechische Parallelüberlieferung stützt den Sinn „Diebstahl“, der deshalb im Haupttext steht und in einer Fußnote als textkritische Entscheidung kenntlich gemacht wird.
