  yaml_path: translation/deuterocanon/sirach/041/017.yaml
  text: Be ashamed before father and mother for sexual immorality[a], and before a ruler in office for lying.
translation:
  language: de
  text: Schäme dich vor Vater und Mutter wegen sexuellen Fehlverhaltens und vor einem Herrscher, der im Amt sitzt,[a] wegen einer Lüge.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „vor einem sitzenden Herrscher“. Die griechische Überlieferung hat: „vor einem Anführer und Machthaber“.'
    reason: Die Fußnote bewahrt das konkrete hebräische Bild und nennt die abweichende griechische Parallele, die den allgemeinen Bezug auf öffentliche Autorität bestätigt.
lexical_decisions:
- source_word: בוש
  choice: Schäme dich
  rationale: Der Imperativ fordert dazu auf, Scham zu empfinden; die aktive deutsche Wendung bewahrt den mahnenden Charakter.
- source_word: מאב ואם
  choice: vor Vater und Mutter
  rationale: Die Präposition מן bezeichnet nach בוש die Personen, vor denen man sich schämt. Die griechische Parallele bestätigt diesen Beziehungssinn.
- source_word: אל זנות
  choice: wegen sexuellen Fehlverhaltens
  rationale: זנות bezeichnet unerlaubtes sexuelles Verhalten in einem breiten Sinn. Die Wiedergabe ist modern und verständlich, ohne den Begriff auf Prostitution oder einen einzelnen Tatbestand zu verengen.
- source_word: מנשיא יושב
  choice: vor einem Herrscher auf seinem Amtssitz
  rationale: נשיא bezeichnet einen Fürsten, Anführer oder Herrscher; יושב bewahrt das hebräische Bild des sitzenden Amtsträgers. „Amtssitz“ macht den Autoritätsbezug verständlich, ohne das Bild ganz aufzulösen.
- source_word: אל כחש
  choice: wegen einer Lüge
  rationale: כחש bezeichnet Lüge, Falschheit oder Täuschung. Im konkreten ethischen Mahnspruch ist „Lüge“ unmittelbar und natürlich.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Mahnsprache in der Einzahl. „Sexuelles Fehlverhalten“ vermeidet das heute teils veraltete oder enger verstandene „Unzucht“; „Amtssitz“ hält die hebräische Sitz-Metapher bei zugleich verständlichem Amtsbezug fest.
