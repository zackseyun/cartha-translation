    reason: textual_difficulty
lexical_decisions:
- source_word: טוב
  choice: Besser ist
  rationale: Der komparative Sinn entspricht der hebräischen Spruchform und wird durch das griechische κρείσσων bestätigt; die knappe Voranstellung bewahrt den prägnanten Stil.
- source_word: איש
  choice: ein Mann
  rationale: Das Hebräische verwendet zweimal die maskuline Singularform איש. Die Formulierung gibt diese Gestalt des Spruchs wieder; sie ist hier allgemein-menschlich gebraucht.
- source_word: מצפין
  choice: der … verbirgt
  rationale: Das Partizip bezeichnet jemanden, der etwas verborgen hält. „Verbirgt“ ist klar, knapp und bildet die Wiederholung des Ausgangstextes ab.
- source_word: אולתו
  choice: seine Torheit
  rationale: „Torheit“ entspricht dem Sprachregister der Weisheitsliteratur und gibt אולת präziser und würdevoller wieder als umgangssprachliche oder härtere Alternativen.
- source_word: חכמתו
  choice: seine Weisheit
  rationale: „Weisheit“ ist die direkte Entsprechung und wird durch das griechische σοφία bestätigt.
- source_word: מוסר בשת
  choice: Unterweisung ist Schande
  rationale: Die schwer verständliche Schlusswendung wird möglichst formal wiedergegeben, ohne sie stillschweigend auszulassen oder vollständig in den vorangehenden Vergleich aufzulösen. „Unterweisung“ bildet den üblichen Bedeutungsbereich von מוסר ab; die Fußnote macht die textliche und syntaktische Unsicherheit sichtbar.
theological_decisions:
- issue: Sinn der schwierigen Schlusswendung מוסר בשת
  choice: 'Als eigenen, knappen Satz wiedergeben: „Unterweisung ist Schande.“'
  alternative: Die Wendung als beschädigten oder verdichteten Rest des Vergleichs verstehen und im Haupttext nur „… als ein Mann, der seine Weisheit verbirgt“ lesen.
  rationale: Der erhaltene hebräische Text enthält die Wörter מוסר בשת und sollte daher nicht ohne Kennzeichnung verkürzt werden. Zugleich bleibt die Aussage semantisch und syntaktisch schwierig; die griechische Parallele endet beim Vergleich. Haupttext und Fußnote bewahren diese Spannung, ohne eine bestimmte theologische Deutung aufzuzwingen.
translation_notes:
  register: Knapper, würdevoller Spruchstil in modernem Standarddeutsch. Die parallele Satzstruktur bleibt erhalten. „Mann“ folgt der maskulinen Form des hebräischen Textes; eine allgemein-menschliche Wiedergabe steht in der Fußnote. Die schwer verständliche hebräische Schlusswendung wird weder geglättet noch unterschlagen, sondern im Haupttext knapp abgebildet und textkritisch erläutert.
