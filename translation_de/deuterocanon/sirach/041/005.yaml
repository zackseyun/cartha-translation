translation:
  language: de
  text: Der Nachkomme eines Verachteten ist etwas Böses[a][c], und der Nachkomme eines Toren ist im Schrecken der Frevler.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hebräische Wortlaut der ersten Vershälfte ist schwierig. Die griechische Parallele lautet sinngemäß: „Abscheuliche Kinder sind die Kinder von Sündern.“'
    reason: alternative_reading
  - marker: b
    text: 'Die griechische Parallele weicht in der zweiten Vershälfte stärker ab und lautet ungefähr: „und sie verkehren in den Wohnstätten der Gottlosen.“'
    reason: alternative_reading
  - marker: c
    text: Der ältere Textzeuge aus Masada ist an dieser Stelle nur bruchstückhaft erhalten; der lesbare Wortlaut dieses Verses beruht hauptsächlich auf den hebräischen Handschriften aus der Kairoer Geniza.
    reason: textual_variant
lexical_decisions:
- source_word: נין
  choice: Nachkomme
  rationale: נין bezeichnet einen Nachkommen beziehungsweise die Nachkommenschaft. Der Singular des hebräischen Textes wird bewahrt; „Nachkomme“ legt kein bestimmtes Alter und keine genaue Generation fest.
- source_word: נמאס
  choice: eines Verachteten
  rationale: Die passive Bedeutung „verachtet, verworfen“ wird als Zugehörigkeitsangabe zu נין verstanden. Damit bleibt die hebräische Konstruktion leitend, während die stärkere griechische Formulierung nicht in den Haupttext übernommen wird.
- source_word: דבר רעים
  choice: ist etwas Böses
  rationale: Die Wendung ist textlich und syntaktisch schwierig. דבר wird hier als „Sache, etwas“ und רעים als negative Bestimmung verstanden. Diese Wiedergabe ergibt einen möglichen Sinn, ohne eine spekulative Rekonstruktion einzusetzen.
- source_word: נכד
  choice: Nachkomme
  rationale: נכד kann enger „Enkel“ bedeuten, bezeichnet im poetischen Parallelismus mit נין hier aber wahrscheinlich allgemein die Nachkommenschaft. Die Wiederholung von „Nachkomme“ ist im Deutschen klar und bewahrt den Parallelismus.
- source_word: אויל
  choice: Tor
  rationale: אויל ist ein Weisheitsbegriff für einen moralisch und praktisch törichten Menschen. „Tor“ erhält diesen traditionsreichen, wertenden Sinn besser als eine rein intellektuelle Bezeichnung.
- source_word: במגור
  choice: im Schrecken
  rationale: מגור bezeichnet Furcht, Grauen oder Schrecken. Die knappe Präpositionalfügung des Hebräischen bleibt erhalten, auch wenn ihr genauer Bezug nicht eindeutig ist.
- source_word: רשע
  choice: der Frevler
  rationale: Der Singular kann kollektiv gebraucht sein. „Frevler“ gibt die moralische Kategorie wieder und lässt den Genitiv ebenso offen wie das Hebräische.
theological_decisions:
- issue: Vorrang des erhaltenen hebräischen Textes gegenüber der abweichenden griechischen Parallele
  choice: Der Haupttext folgt dem hebräischen Wortlaut, obwohl besonders דבר רעים schwierig und die zweite Vershälfte knapp ist.
  alternative: 'Eine griechisch geleitete Fassung wäre etwa: „Abscheuliche Kinder sind die Kinder von Sündern, und sie verkehren in den Wohnstätten der Gottlosen.“'
  rationale: Da ein lesbarer hebräischer Text vorliegt, bildet er die Übersetzungsgrundlage. Die griechische Parallele bestätigt die scharf negative Aussage, weicht aber in beiden Vershälften so deutlich ab, dass sie den hebräischen Wortlaut nicht stillschweigend ersetzen darf.
- issue: Mehrdeutigkeit von „im Schrecken der Frevler“
  choice: Die hebräische Genitivfügung wird formal offen wiedergegeben.
  alternative: Deutender wären „in Angst vor den Frevlern“, „unter dem Schrecken, den Frevler verbreiten“ oder „im Schrecken eines Frevlers“.
  rationale: Das Hebräische bestimmt nicht eindeutig, ob die Frevler Schrecken empfinden, verursachen oder dessen Bezugsgröße sind. Eine explizite Auflösung würde eine nicht gesicherte Deutung in den Haupttext eintragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die ungewöhnliche Formulierung „ist im Schrecken der Frevler“ bewahrt bewusst die Knappheit und Mehrdeutigkeit des hebräischen Textes. „Tor“ und „Frevler“ entsprechen dem gehobenen, aber allgemein verständlichen Register der Weisheitsliteratur.
