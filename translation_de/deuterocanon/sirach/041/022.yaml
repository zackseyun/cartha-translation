translation:
  language: de
  text: vor einem Freund wegen beleidigender Worte[a]; und nachdem du einem Bruder eine Gabe gegeben hast, mache ihm keine Vorwürfe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hebräische Wortlaut ist hier knapp und nicht eindeutig. Die griechische Überlieferung macht den Zusammenhang deutlicher: „vor Freunden wegen Worten des Vorwurfs; und nachdem du gegeben hast, mache keine Vorwürfe.“'
    reason: textual_variant
lexical_decisions:
- source_word: מאוהב
  choice: einem Freund gegenüber
  rationale: אוהב bezeichnet hier einen Freund. Die Präposition und der elliptische Zusammenhang lassen mehrere Beziehungen zu; „einem Freund gegenüber“ fügt sich natürlich in die vorausgesetzte Mahnung, ohne romantische Liebe einzutragen.
- source_word: על דברי חרפה
  choice: wegen verletzender Worte
  rationale: על bezeichnet hier wahrscheinlich den Anlass oder Gegenstand; דברי חרפה sind beschämende, beleidigende oder vorwurfsvolle Worte. „Verletzende Worte“ gibt den sozialen und moralischen Gehalt in heutigem Deutsch wieder.
- source_word: ומאחרי מתת
  choice: und nachdem du … etwas geschenkt hast
  rationale: Die zeitliche Folge von מאחרי und der Sinn von מתת als Gabe beziehungsweise Geben werden in einer natürlichen deutschen Verbalkonstruktion ausgedrückt.
- source_word: אח
  choice: einem Bruder
  rationale: Die konkrete relationale Bezeichnung des Hebräischen bleibt erhalten; je nach Kontext kann „Bruder“ auch einen nahestehenden Mitmenschen meinen.
- source_word: מנאץ
  choice: mache ihm keine Vorwürfe
  rationale: Die knappe hebräische Form wird im Licht des griechischen μὴ ὀνείδιζε als Verbot verstanden. Gemeint ist, eine Gabe nicht später zum Anlass eines beschämenden Vorwurfs zu machen.
theological_decisions:
- issue: Ergänzung des in der knappen hebräischen Zeile vorausgesetzten Mahncharakters
  choice: Die erste Hälfte bleibt als elliptische Ergänzung zum vorangehenden Kontext formuliert; in der zweiten wird das durch die griechische Parallele bestätigte Verbot ausdrücklich wiedergegeben.
  alternative: Beide Satzhälften rein fragmentarisch und ohne ergänzte Mahnform wiedergeben.
  rationale: Der hebräische Text ist knapp und textkritisch schwierig. Die griechische Parallele bestätigt in der zweiten Hälfte ausdrücklich die Mahnung, nach einer Gabe keine Vorwürfe zu machen. Die Ellipse der ersten Hälfte wird nicht durch eine zu bestimmte Handlung aufgelöst.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung schließt syntaktisch an die vorausgehende Aufzählung dessen an, wofür man sich schämen soll. Die Textunsicherheit wird in der Fußnote offengelegt; die Mahnung der zweiten Hälfte wird klar und idiomatisch formuliert.
