  text: Be ashamed of refusing a request[a], and of turning away the face of your neighbor.
translation:
  language: de
  text: Schäme dich, eine Bitte abzuschlagen und den Zorn deines Nächsten zu erwidern.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hebräische Text ist hier unsicher und weicht stark vom Griechischen ab. Die zweite hebräische Wendung bedeutet etwa: „den Zorn deines Nächsten zurückgeben“ oder „erwidern“. Das Griechische lautet ungefähr: „[schäme dich] des Grüßens in einer Sache des Schweigens und des Blicks auf eine Gefährtin oder Kurtisane“. Der Haupttext folgt dem erhaltenen hebräischen Zeugnis.'
    reason: alternative_reading
lexical_decisions:
- source_word: ממנוע
  choice: abzuschlagen
  rationale: Die Präposition מן mit מנע bezeichnet hier das Verweigern oder Vorenthalten; zusammen mit שאלה gibt „eine Bitte abschlagen“ den Sinn im Deutschen idiomatisch wieder.
- source_word: מתת שאלה
  choice: eine Bitte
  rationale: 'Die überlieferte Wortfolge ist schwierig: מתת bezeichnet gewöhnlich „Gabe/Geben“, während שאלה „Bitte/Begehren“ bedeutet. Die Übersetzung gibt den im Zusammenhang wahrscheinlich gemeinten Vorgang wieder, ohne die unsichere Syntax künstlich auszudeuten.'
- source_word: מהשב
  choice: abzuweisen
  rationale: Die Hifil-Form von שוב kann ein Zurückschicken oder Abweisen bezeichnen. In Verbindung mit dem Gesicht des Mitmenschen ist „abweisen“ die natürliche deutsche Wiedergabe der sozialen Handlung.
- source_word: אפי רעך
  choice: deinen Mitmenschen
  rationale: אפי wird hier als konstruktverbundene Form mit der Bedeutung „das Gesicht von“ verstanden, nicht als „dein Zorn“. Die Wendung „das Gesicht deines Nächsten zurückweisen“ meint idiomatisch, den Betreffenden selbst abzuweisen; „Mitmensch“ gibt רעך in heutigem, allgemein verständlichem Deutsch wieder.
theological_decisions:
- issue: Starke Abweichung zwischen der erhaltenen hebräischen Lesart und der griechischen Überlieferung
  choice: Der Haupttext folgt dem erhaltenen Hebräisch und versteht die zweite Hälfte als Abweisung eines Mitmenschen.
  alternative: 'Die griechische Fassung lautet ungefähr: „und [schäme dich] des Grüßens in einer Sache des Schweigens und des Anblicks einer Gefährtin/Kurtisane“.'
  rationale: Dem vorhandenen hebräischen Text wird Vorrang gegeben; da die griechische Fassung jedoch erheblich abweicht und auch das Hebräische sprachlich schwierig ist, wird die Unsicherheit ausdrücklich in einer Fußnote offengelegt.
- issue: Deutung von אפי
  choice: Gesicht (idiomatisch auf die Person bezogen)
  alternative: Zorn
  rationale: Vor רעך lässt sich אפי am plausibelsten als konstruktverbundene Gesichtsbezeichnung verstehen („das Gesicht deines Mitmenschen“). Eine Deutung als „dein Zorn“ verlangt eine andere syntaktische Zuordnung und ergibt mit רעך eine weniger naheliegende Konstruktion.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Eine Bitte abschlagen“ und „einen Mitmenschen abweisen“ sind verständlich und idiomatisch; die zweite Formulierung überträgt die hebräische Gesichtsmetapher, ohne im Deutschen eine missverständliche oder unnatürliche Wendung zu erzeugen.
