  text: And if you are born, you will be born for a curse; and if you die, you will be allotted to a curse.
translation:
  language: de
  text: Und wenn ihr geboren werdet, werdet ihr zum Fluch geboren; und wenn ihr sterbt, wird euch ein Fluch zuteil.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die erhaltene hebräische Überlieferung weicht hier erheblich ab und lautet sinngemäß: „Wenn ihr Erfolg habt, geschieht es durch Unheil; und wenn ihr Kinder zeugt, zum Seufzen. Wenn ihr strauchelt, zur ewigen Freude; und wenn ihr sterbt, zum Fluch.“ Im überlieferten Zusammenhang ist die genaue Zuordnung dieses Materials unsicher. Der Haupttext folgt daher der griechischen Fassung.'
    reason: Dokumentiert die bedeutende textkritische Abweichung vollständig und gibt לשמחת עולם zutreffend als „zur ewigen Freude“ wieder.
lexical_decisions:
- source_word: γεννηθῆτε / γεννηθήσεσθε
  choice: geboren werdet / zum Fluch geboren
  rationale: Die griechische Parallelüberlieferung bietet für diesen Vers einen geschlossenen, verständlichen Text und bewahrt die Wiederholung des Verbs.
- source_word: εἰς κατάραν
  choice: zum Fluch
  rationale: Gibt die Ziel- beziehungsweise Folgeangabe knapp und idiomatisch wieder, ohne näher festzulegen, ob die Betreffenden selbst zum Fluch werden oder unter einem Fluch stehen.
- source_word: μερισθήσεσθε
  choice: wird euch … zuteil
  rationale: Das Passiv von μερίζω bezeichnet ein Zuweisen oder Zuteilen; die unpersönliche deutsche Wendung erhält diesen Sinn in natürlicher Sprache.
theological_decisions:
- issue: Abweichung zwischen dem zusammengesetzten hebräischen Text und der griechischen Überlieferung
  choice: Der fortlaufenden griechischen Versfassung folgen und die hebräische Abweichung in einer Fußnote offenlegen
  alternative: Den gesamten angegebenen hebräischen Wortlaut als Sirach 41,9 übersetzen
  rationale: Der gelieferte hebräische Text enthält offenbar abweichendes beziehungsweise versübergreifendes Material und stimmt nur in der Schlussaussage mit dem griechischen Vers überein. Wegen der ausgewiesenen kleinen Zuordnungsabweichung und der geschlossenen griechischen Fassung ist diese für den Haupttext die sicherere Grundlage; die textliche Spannung wird nicht verschwiegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Satzstruktur und die Wiederholung von „geboren“ bleiben erhalten; „wird euch … zuteil“ vermeidet ein schwerfälliges wörtliches „werdet ihr einem Fluch zugeteilt“.
