base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/041/002.yaml
  text: O death, how fitting is your sentence for a man who is needy and lacking strength, stumbling in everything, defiant, and having lost hope.
translation:
  language: de
  text: O Tod, wie gut ist dein Beschluss für einen bedürftigen Menschen, dem die Kraft fehlt, der in allem strauchelt, widerspenstig ist und die Hoffnung verloren hat.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: האח למות
  choice: O Tod
  rationale: Die Anrede wird wie im griechischen Paralleltext als feierlicher Ausruf wiedergegeben; das ungewöhnliche האח wird nicht mit einer zusätzlichen, unsicheren Bedeutungsnuance überladen.
- source_word: כי טוב חקיך
  choice: wie gut ist dein Beschluss
  rationale: חק kann Satzung, festgesetzten Anteil oder Beschluss bezeichnen. Im Zusammenhang mit dem Tod trifft „Beschluss“ dessen bestimmende Verfügung, ohne enger als der hebräische Ausdruck von einem Gerichtsurteil zu sprechen.
- source_word: לאיש אונים וחסר עצמה
  choice: für einen kraftlosen Menschen, dem es an Stärke fehlt
  rationale: Die parallelen Ausdrücke bezeichnen mangelnde Kraft. „Kraftlos“ gibt איש אונים im vorliegenden negativen Kontext wieder; „dem es an Stärke fehlt“ entspricht חסר עצמה.
- source_word: איש כושל ינקש בכל
  choice: der in allem strauchelt
  rationale: כושל bezeichnet einen Strauchelnden oder Schwachen; ינקש בכל ist textlich schwierig. Der griechische Paralleltext stützt eine Person, die von allem beansprucht oder bedrängt wird. Die knappe Wiedergabe wahrt den Gedanken fortgesetzten Scheiterns, ohne eine unsichere Einzelnuance auszubauen.
- source_word: סורב
  choice: sich widersetzt
  rationale: Das Wort bezeichnet Widersetzlichkeit oder Verweigerung. Die verbale Formulierung ist im modernen Deutsch natürlich und weniger psychologisierend als „trotzig“.
- source_word: ואובד תקוה
  choice: und die Hoffnung verloren hat
  rationale: Gibt den resultativen Sinn des hebräischen Ausdrucks natürlich und unmittelbar wieder.
theological_decisions:
- issue: Der Tod als guter oder passender Beschluss
  choice: „wie gut ist dein Beschluss“ bewahrt die positive Wertung des Todes für den beschriebenen Menschen.
  alternative: „wie passend ist dein Urteil“
  rationale: Der Vers formuliert eine spannungsreiche positive Anrede an den Tod. Diese wird nicht abgeschwächt oder durch eine theologische Erklärung aufgelöst; zugleich vermeidet „Urteil“ eine möglicherweise zu starke Personifizierung des Todes als Richter.
- issue: Widersetzlichkeit des leidenden Menschen
  choice: „sich widersetzt“
  alternative: „trotzig ist“ oder „ungehorsam ist“
  rationale: Die Übersetzung bewahrt die moralisch offene Aussage, ohne ausdrücklich festzulegen, wem gegenüber die Person ungehorsam ist.
translation_notes:
  register: Dign anredender Weisheitsstil in modernem Standarddeutsch. Der Satz bleibt kompakt und rhythmisch; die Reihe der Belastungen wird als Relativsatz geführt. Aufgrund des als „major_mismatch“ markierten, kompositen hebräischen Textes wurde der griechische Paralleltext zur Kontrolle herangezogen, doch der deutsche Haupttext folgt soweit möglich dem überlieferten Hebräisch.
