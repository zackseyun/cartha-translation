base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/041/004.yaml
  text: This is the lot of all flesh from God[a], so why reject the decree of the Most High? Whether for a thousand years, or a hundred, or ten[d][c][b], there is no rebuke of life in Sheol.
translation:
  language: de
  text: Das ist das Los allen Fleisches von Gott[a]; warum also die Anordnung des Höchsten verwerfen?[b] Ob tausend, hundert oder zehn Jahre[c] — im Scheol[d] gibt es keine Zurechtweisung in Bezug auf das Leben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: „von Gott“; die griechische Parallele liest „vom Herrn“.'
    reason: alternative_reading
  - marker: b
    text: Der hebräische Text scheint „die Weisung“ oder „das Gesetz des Höchsten“ zu lesen; die griechische Parallele hat „das Wohlgefallen des Höchsten“. „Anordnung“ gibt den Zusammenhang einer göttlichen Festsetzung wieder.
    reason: alternative_reading
  - marker: c
    text: 'Die Zahlenfolge ist im hebräischen Zeugnis textlich schwierig. Die griechische Parallele liest: „ob zehn oder hundert oder tausend Jahre“.'
    reason: textual_variant
  - marker: d
    text: Die griechische Parallele hat „Hades“; der hebräische Text stützt „Scheol“.
    reason: lexical_alternative
lexical_decisions:
- source_word: זה חלק כל בשר / τοῦτό τὸ κρίμα ... πάσῃ σαρκί
  choice: Das ist das Los allen Fleisches
  rationale: „Los“ gibt das hebräische חלק wieder; „alles Fleisch“ bewahrt die biblische Bezeichnung für die sterbliche Menschheit. Das griechische κρίμα stützt alternativ den Gedanken eines Urteils.
- source_word: מאל / παρὰ Κυρίου
  choice: von Gott
  rationale: Der erhaltene hebräische Text liest מאל, „von Gott“. Die griechische Parallele hat „vom Herrn“ und wird in Fußnote [a] dokumentiert.
- source_word: תמאס / ἀπαναίνῃ
  choice: verwerfen
  rationale: Hebräisch מאס bezeichnet ablehnen oder verwerfen; auch das griechische ἀπαναίνῃ trägt den Sinn des Sich-Weigerns. „Verwerfen“ passt zur würdevollen rhetorischen Frage.
- source_word: בתורת עליון / ἐν εὐδοκίᾳ Ὑψίστου
  choice: die Anordnung des Höchsten
  rationale: Das hebräische „Weisung/Gesetz des Höchsten“ und das griechische „Wohlgefallen des Höchsten“ weichen voneinander ab. „Anordnung“ bezeichnet hier die göttliche Festsetzung, ohne die Spannung der Zeugen einseitig aufzulösen.
- source_word: לאלף שנים מאה ועשר / εἴτε δέκα εἴτε ἑκατὸν εἴτε χίλια ἔτη
  choice: Ob tausend Jahre oder hundert oder zehn
  rationale: Die hebräische Zahlenfolge ist schwierig; die griechische Parallele bietet eindeutig zehn, hundert und tausend Jahre. Die Übersetzung bewahrt die im hebräischen Zeugnis vorliegende absteigende Reihenfolge, versteht die Zahlen aber als dreigliedrige Alternative.
- source_word: איש תוכחות בשאול חיים / οὐκ ἔστιν ἐν ᾅδου ἔλεγמὸς ζωῆς
  choice: im Scheol gibt es keine Zurechtweisung über das Leben
  rationale: „Zurechtweisung“ entspricht תוכחות beziehungsweise ἔλεγμος. „Über das Leben“ hält die knappe und schwierige Genitivverbindung offen, statt sie durch eine freie Deutung zu glätten. „Scheol“ folgt dem primären hebräischen Zeugnis.
theological_decisions:
- issue: Wiedergabe des Totenreichs שאול / ᾅδης
  choice: Scheol
  alternative: Hades; Totenreich; Grab
  rationale: Da der hebräische Text erhalten ist und שאול bietet, bewahrt „Scheol“ den alttestamentlich-semitischen Begriff, ohne ihn mit späteren Vorstellungen gleichzusetzen. Das griechische „Hades“ wird in einer Fußnote genannt.
- issue: Spannung zwischen hebräischer „Weisung/Gesetz“ und griechischem „Wohlgefallen“
  choice: die Anordnung des Höchsten
  alternative: die Weisung des Höchsten; das Wohlgefallen des Höchsten; der Wille des Höchsten
  rationale: „Anordnung“ passt zum Kontext des von Gott bestimmten Sterbens und vermittelt zwischen den abweichenden Zeugen, während die konkreten Lesarten in Fußnote [b] offengelegt werden.
- issue: Bedeutung von „Zurechtweisung über das Leben“
  choice: Die schwierige Formulierung bleibt weitgehend unaufgelöst
  alternative: Im Scheol wird niemand wegen seines Lebens zur Rechenschaft gezogen; im Scheol gibt es keine Rüge hinsichtlich der Lebensdauer
  rationale: Der hebräische Wortlaut ist schwierig, und auch das Griechische lässt die Beziehung des Genitivs offen. Eine ausdeutende Aussage über Gericht, Lebensführung oder Lebensdauer würde die theologische Spannung ungesichert festlegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die biblischen Wendungen „alles Fleisch“ und „Scheol“ bleiben wegen ihrer sachlichen Präzision erhalten. Die schwierige Schlusszeile wird bewusst nicht in eine bestimmte Lehre über Gericht, Lebensführung oder Lebensdauer umgedeutet.
