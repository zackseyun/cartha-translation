base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/041/001.yaml
  text: O death[a], how bitter is your remembrance to a man at ease in his possessions, to a man untroubled and prospering in everything[b], and still strong enough to enjoy pleasure.
translation:
  language: de
  text: O Tod, wie bitter ist die Erinnerung an dich für einen Mann, der ruhig in gesicherten Verhältnissen lebt,[a] für einen Mann, der unbeschwert ist, in allem Erfolg hat und noch kräftig genug ist, Genuss zu haben![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die hebräische Wendung kann auch „der ruhig an seinem festen Platz lebt“ bedeuten. Die griechische Parallele versteht sie als einen Menschen, der friedlich mit seinem Besitz lebt.
    reason: textual_variant
  - marker: b
    text: 'Hebräisch: „noch Kraft hat, Genuss zu empfangen“. Die griechische Parallele lautet genauer: „noch kräftig genug ist, Nahrung zu sich zu nehmen“.'
    reason: alternative_reading
lexical_decisions:
- source_word: מה מר זכרך / ὡς πικρόν σου τὸ μνημόσυνόν
  choice: wie bitter ist die Erinnerung an dich
  rationale: Sowohl das hebräische זכרך als auch das griechische μνημόσυνον bezeichnen die Erinnerung beziehungsweise das Gedenken an den Tod. Die Formulierung bewahrt die direkte Anrede und klingt im modernen Deutschen natürlich.
- source_word: לאיש שוקט על מכונתו / ἀνθρώπῳ εἰρηνεύοντι ἐν τοῖς ὑπάρχουσιν αὐτοῦ
  choice: für einen Mann, der ruhig in gesicherten Verhältnissen lebt
  rationale: Das Hebräische beschreibt einen Menschen, der ruhig auf seiner festen Grundlage oder in seiner gesicherten Lage lebt; die griechische Parallele versteht dies als friedliches Leben inmitten dessen, was er besitzt. Die Übersetzung gibt die gemeinsame Vorstellung materieller und persönlicher Sicherheit wieder, ohne sie auf bloßen Besitz zu verengen.
- source_word: איש שליו / ἀνδρὶ ἀπερισπάστῳ
  choice: für einen Mann, der unbeschwert ist
  rationale: שליו bezeichnet Ruhe und sorglose Sicherheit; ἀπερίσπαστος ergänzt den Gedanken des Ungestörtseins. „Unbeschwert“ bringt beides knapp und verständlich zum Ausdruck.
- source_word: ומצליח בכל / καὶ εὐοδουμένῳ ἐν πᾶσιν
  choice: und in allem Erfolg hat
  rationale: Hebräischer und griechischer Text sprechen von umfassendem Gelingen. Die gewählte Formulierung ist gegenwärtiges Standarddeutsch und vermeidet das heute teils stark wirtschaftlich gefärbte „prosperieren“.
- source_word: ועוד בו חיל לקבל תענוג / καὶ ἔτι ἰσχύοντι ἐπιδέξασθαι τροφήν
  choice: und noch kräftig genug ist, Genuss zu haben
  rationale: Der hebräische Text spricht ausdrücklich von Kraft und Genuss, während die griechische Parallele den Gegenstand als Nahrung konkretisiert. Der Haupttext folgt dem Hebräischen und lässt den Genuss bewusst weiter gefasst; die abweichende Präzisierung des Griechischen wird in der Fußnote genannt.
theological_decisions:
- issue: Generisch gebrauchte männliche Einzahl איש
  choice: einen Mann … für einen Mann
  alternative: einen Menschen … für jemanden
  rationale: Der Quelltext verwendet zweimal ausdrücklich die männliche Einzahl. Die Übersetzung bewahrt diese repräsentative Form, ohne eine Aussage ausschließlich über Männer zu behaupten.
- issue: Verhältnis des erhaltenen hebräischen Textes zur griechischen Parallele
  choice: Der Haupttext folgt beim Schlussausdruck dem hebräischen „Genuss“; das griechische „Nahrung“ erscheint in der Fußnote.
  alternative: noch kräftig genug ist, Nahrung zu sich zu nehmen
  rationale: Da der hebräische Wortlaut erhalten und verständlich ist, soll die spezifischere griechische Lesart ihn nicht stillschweigend ersetzen. So bleiben die echte Textspannung und beide Überlieferungszeugen sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter Anrede. „O Tod“ erhält den feierlichen Ausruf der griechischen Parallele; die übrige Syntax wurde zugunsten guter Verständlichkeit gegliedert. Beide Fußnotenmarker [a] und [b] stehen an den jeweils erläuterten Stellen im Haupttext.
