  naturalness: „Die Kinder verfluchen einen bösen Vater, denn seinetwegen geraten sie in Schande“ ist modernes, würdiges Standarddeutsch und gibt die knappe, allgemeingültige Aussage klar wieder.
  terminology: „Böser Vater“ gibt אב רשע angemessen wieder. „Verfluchen“ bewahrt die stärkere Bedeutung von יקוב gegenüber dem griechischen „tadeln/Vorwürfe machen“. „In Schande geraten“ gibt לחרפה idiomatisch als soziale Schande bzw. Schmach wieder.
