translation:
  language: de
  text: Die Kinder verfluchen einen bösen Vater[a], denn seinetwegen geraten sie in Schande.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Parallele lautet sinngemäß: „Die Kinder eines gottlosen Vaters tadeln ihn, denn seinetwegen werden sie beschämt werden.“ Das Hebräische verwendet das stärkere „verfluchen“, während das Griechische Tadel bzw. Vorwürfe betont.'
    reason: alternative_reading
lexical_decisions:
- source_word: אב רשע
  choice: eines bösen Vaters
  rationale: Die hebräische Wendung bezeichnet ausdrücklich den Vater; רשע beschreibt ihn als moralisch böse oder schuldig. „Böse“ ist im heutigen Deutsch klar und natürlich.
- source_word: יקוב
  choice: werden verflucht
  rationale: Die unvokalisierte Form lässt sich hier mit der hebräischen Überlieferung als passive Aussage mit allgemeingültigem Sinn verstehen. Sie bewahrt den gegenüber der griechischen Parallele schärferen Gedanken des Fluchs.
- source_word: ילד
  choice: die Kinder
  rationale: Das hebräische Singularwort kann kollektiv verstanden werden; auch die griechische Parallele hat den Plural τέκνα. Der deutsche Plural gibt die allgemeine Aussage natürlich wieder.
- source_word: כי בגללו
  choice: denn seinetwegen
  rationale: Die knappe kausale Formulierung führt die Lage der Kinder unmittelbar auf den Vater zurück.
- source_word: לחרפה
  choice: trifft sie Schande
  rationale: חרפה bezeichnet Schande, Schmach oder öffentliche Entehrung. Die verbale deutsche Wendung ist natürlicher als eine wörtliche Konstruktion mit „zur Schande“, ohne den sozialen Charakter der Aussage abzuschwächen.
theological_decisions:
- issue: Fluch im hebräischen Text oder Tadel in der griechischen Parallele
  choice: werden verflucht
  alternative: werden getadelt / müssen sich Vorwürfe gefallen lassen
  rationale: Da der erhaltene hebräische Text der primäre Ausgangstext ist, bleibt seine stärkere Fluchsprache im Haupttext stehen. Die abweichende Betonung der griechischen Parallele wird in der Fußnote offengelegt, statt beide Aussagen harmonisierend zusammenzuziehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Seinetwegen“ hält den Bezug auf den Vater knapp und eindeutig; „trifft sie Schande“ formuliert die hebräische Nominalwendung natürlich, ohne ihre Härte zu mildern.
