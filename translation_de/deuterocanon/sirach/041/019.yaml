  text: for violating an oath and a covenant[b][a], and for leaning with your elbow over the bread.
translation:
  language: de
  text: dafür, einen Eid[b] und einen Bund zu brechen, und dafür, den Ellbogen auf das Brot zu stützen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hebräische Text ist im zweiten Satzteil knapp und etwas unsicher. Die griechische Parallele lautet ausführlicher: „den Ellbogen auf die Brote stützen“; dies stützt die Wiedergabe „den Ellbogen auf das Brot zu stützen“.'
    reason: textual_variant
  - marker: b
    text: „Eid“ kann auch mit „Fluch“ oder „eidliche Verpflichtung“ wiedergegeben werden, da das hebräische Wort den mit einem Eid verbundenen Fluch einschließen kann.
    reason: lexical_alternative
lexical_decisions:
- source_word: מהפר
  choice: dafür, … zu brechen
  rationale: Das Hifil von פרר bezeichnet das Brechen, Aufheben oder Verletzen einer bindenden Verpflichtung. „Brechen“ ist im Deutschen sowohl bei „Eid“ als auch bei „Bund“ natürlich und bewahrt die moralische Schärfe.
- source_word: אלה
  choice: einen Eid
  rationale: אלה kann einen Eid, eine eidliche Verpflichtung oder den damit verbundenen Fluch bezeichnen. In Verbindung mit ברית ist „Eid“ die naheliegende Wiedergabe; die mögliche Fluchkomponente wird in einer Fußnote bewahrt.
- source_word: וברית
  choice: und einen Bund
  rationale: ברית bezeichnet eine bindende Bundesbeziehung oder Vereinbarung. „Bund“ wahrt den formellen und relationalen Gehalt des hebräischen Ausdrucks.
- source_word: ממטה
  choice: dafür, sich … zu lehnen
  rationale: Der hebräische Ausdruck ist knapp und schwierig. Die griechische Parallele πήξεως ἀγκῶνος („Aufstützen/Festsetzen des Ellbogens“) stützt die Deutung als körperliches Auflehnen oder Aufstützen bei Tisch.
- source_word: אציל
  choice: mit dem Ellbogen
  rationale: אציל bezeichnet den Ellbogen beziehungsweise das Armgelenk; das griechische ἀγκών bestätigt hier „Ellbogen“.
- source_word: אל לחם
  choice: über das Brot
  rationale: Die hebräische Präposition ist in diesem Zusammenhang ungewöhnlich; die griechische Parallele ἐπ᾿ ἄρτους stützt das konkrete Bild eines über dem Brot beziehungsweise den Broten aufgestützten Ellbogens.
