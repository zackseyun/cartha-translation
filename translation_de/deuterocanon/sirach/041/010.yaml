translation:
  language: de
  text: Alles, was aus dem Nichts kommt, kehrt zum Nichts zurück[a]; ebenso geht der Gottlose von Leere zu Leere.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Paralleltext lautet: „Alles, was von der Erde stammt, wird zur Erde gehen; ebenso gehen die Gottlosen vom Fluch ins Verderben.“ Er bezeugt eine deutlich andere Fassung des Verses als der erhaltene hebräische Text.'
    reason: alternative_reading
lexical_decisions:
- source_word: כל
  choice: Alles, was
  rationale: Gibt den distributiv-kollektiven Sinn natürlich wieder und ermöglicht im Deutschen einen klaren Relativsatz.
- source_word: מאפס
  choice: aus dem Nichts
  rationale: אפס bezeichnet hier Nichts bzw. Nichtsein; die Wendung bewahrt die knappe, markante Aussage des Hebräischen.
- source_word: אל אפס
  choice: zum Nichts
  rationale: Bewahrt die Wiederholung von אפס sowie die Zielrichtung der Präposition אל.
- source_word: ישוב
  choice: kehrt … zurück
  rationale: Entspricht der Grundbedeutung von שוב und klingt in der allgemeinen Spruchaussage idiomatisch.
- source_word: כן
  choice: ebenso
  rationale: Kennzeichnet den Vergleich der beiden Satzhälften deutlicher als ein möglicherweise konsekutiv verstandenes „so“.
- source_word: חנף
  choice: der Gottlose
  rationale: Das Wort bezeichnet hier wahrscheinlich einen frevlerischen oder gottlosen Menschen; der griechische Paralleltext mit ἀσεβεῖς stützt den breiteren religiös-moralischen Sinn gegenüber dem engeren „Heuchler“.
- source_word: מתהו אל תהו
  choice: von Leere zu Leere
  rationale: תהו kann Leere, Öde oder Chaos bezeichnen. „Leere“ erhält die Wiederholung und die Aussage von Nichtigkeit, ohne unnötig eine kosmologische Deutung festzulegen.
theological_decisions:
- issue: Bedeutung von חנף
  choice: der Gottlose
  alternative: der Heuchler; der Frevler
  rationale: Der breitere religiös-moralische Sinn passt zum Weisheitskontext und wird durch griechisch ἀσεβεῖς gestützt, ohne den Begriff auf soziale Heuchelei zu verengen.
- issue: Verhältnis des hebräischen und griechischen Textes
  choice: Der erhaltene hebräische Text steht im Haupttext; die deutlich abweichende griechische Fassung erscheint in der Fußnote.
  alternative: Die griechische Fassung in den Haupttext übernehmen oder beide Fassungen harmonisieren.
  rationale: Da ein belastbarer hebräischer Text vorliegt, hat er Vorrang. Die griechische Parallele bezeugt jedoch eine substanziell andere Versgestalt und wird deshalb vollständig dokumentiert.
- issue: Aussage „aus dem Nichts … zum Nichts“
  choice: Die zugespitzte Formulierung des Hebräischen wird ohne metaphysische Erklärung bewahrt.
  alternative: Als Schöpfungslehre, Aussage über das endgültige Nichtsein oder bloße Vergänglichkeit explizit ausdeuten.
  rationale: Der Vers lässt den genauen theologischen Umfang der Aussage offen; die Übersetzung soll diese Spannung nicht durch eine Lehrentscheidung auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallelen Wiederholungen „Nichts … Nichts“ und „Leere … Leere“ bilden die prägnante Struktur des hebräischen Spruchs nach; „ebenso“ macht dessen Vergleichsbeziehung verständlich.
