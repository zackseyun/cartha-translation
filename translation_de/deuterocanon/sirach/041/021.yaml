translation:
  language: de
  text: einer fremden Frau ins Gesicht zu schauen[a] und sich ihrer Magd zu nähern.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: der Frau eines anderen. Das Hebräische kann auch eine nicht zugehörige oder verbotene Frau meinen; die griechische Parallelüberlieferung lautet „eine verheiratete Frau“.'
    reason: alternative_reading
lexical_decisions:
- source_word: מהביט
  choice: zu schauen
  rationale: Das Hifil von נבט bezeichnet das Hinsehen bzw. Betrachten. „Zu schauen“ wahrt den hebräischen Wortlaut, ohne die Intensität unnötig zu „anstarren“ zu steigern.
- source_word: אל פני
  choice: ins Gesicht
  rationale: Die konkrete hebräische Wendung „zum Gesicht hin“ wird im Deutschen idiomatisch mit „ins Gesicht“ wiedergegeben.
- source_word: זרה
  choice: einer fremden Frau
  rationale: זרה bedeutet zunächst „fremd“ bzw. „nicht zugehörig“ und kann in der Weisheitsliteratur eine Frau bezeichnen, die für den betreffenden Mann tabu ist. Die Übersetzung belässt diese Mehrdeutigkeit im Haupttext; die spezifischere griechische Lesart wird in der Fußnote genannt.
- source_word: ומהתקרב
  choice: und sich … zu nähern
  rationale: קרב bedeutet „nahe kommen“ oder „sich nähern“; die reflexive deutsche Form ist natürlich und bewahrt die mögliche Andeutung unangemessener Annäherung.
- source_word: שפחתה
  choice: ihrer Magd
  rationale: שפחה bezeichnet eine weibliche Hausbedienstete beziehungsweise Sklavin. „Magd“ ist hier knapp und erhält sowohl das Geschlecht als auch die untergeordnete Stellung, ohne den sozialen Status stärker festzulegen, als es der Zusammenhang erlaubt.
theological_decisions:
- issue: Bedeutung von זרה im Verhältnis zur griechischen Parallelüberlieferung
  choice: einer fremden Frau
  alternative: der Frau eines anderen / einer verheirateten Frau
  rationale: Der erhaltene hebräische Text ist lexikalisch weiter gefasst, während die griechische Parallelüberlieferung ausdrücklich von einer verheirateten Frau spricht. Um die echte Spannung zwischen den Zeugen nicht stillschweigend aufzulösen, folgt der Haupttext dem Hebräischen und dokumentiert die griechische Präzisierung in einer Fußnote.
translation_notes:
  register: Modernes, knappes Standarddeutsch mit würdigem Ton. Da der Vers syntaktisch eine Aufzählung aus dem vorhergehenden Zusammenhang fortsetzt, bleibt er als Infinitivgruppe formuliert. „Magd“ ist bewusst traditioneller als „Hausangestellte“, aber allgemein verständlich.
