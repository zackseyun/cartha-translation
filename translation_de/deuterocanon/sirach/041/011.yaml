  text: A man's body is vanity[a], but a gracious name will not be cut off.
translation:
  language: de
  text: Der Leib eines Menschen ist vergänglich, doch ein gütiger Name wird nicht ausgelöscht.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Parallelüberlieferung lautet abweichend: „Der Name der Sünder wird nicht als gut ausgelöscht“; die letzten Worte können auch „nicht für immer ausgelöscht“ verstanden werden. Der hebräische Text hat dagegen: „Ein gütiger Name wird nicht ausgelöscht.“'
    reason: alternative_reading
lexical_decisions:
- source_word: הבל
  choice: vergänglich
  rationale: הבל bezeichnet wörtlich einen Hauch und in der Weisheitsliteratur häufig Vergänglichkeit oder Nichtigkeit. In der Aussage über den menschlichen Leib gibt „vergänglich“ den gemeinten Gegensatz zum bleibenden Namen natürlich und verständlich wieder, ohne das Bild unnötig zu konkretisieren.
- source_word: אדם
  choice: eines Menschen
  rationale: Der sprichwörtliche Singular bleibt erhalten; „Mensch“ bezeichnet hier repräsentativ den einzelnen Menschen und klingt im modernen Deutschen natürlicher als „Mann“.
- source_word: בגויתו
  choice: Leib
  rationale: גויה kann Leib, Körper oder Leichnam bedeuten. „Leib“ bewahrt den würdevollen weisheitlichen Ton und legt, im Einklang mit dem griechischen σώμασιν, nicht vorschnell „Leichnam“ fest.
- source_word: אך
  choice: doch
  rationale: Die Partikel stellt den vergänglichen Leib dem fortbestehenden guten Namen gegenüber; „doch“ gibt diesen Kontrast knapp und würdig wieder.
- source_word: שם חסד
  choice: ein Name der Güte
  rationale: שם bleibt als „Name“ erhalten und trägt zugleich den Sinn von Ruf oder Andenken. חסד wird hier als positive menschliche Eigenschaft „Güte“ wiedergegeben; die enge hebräische Fügung und ihre leichte Mehrdeutigkeit bleiben sichtbar.
- source_word: לא יכרת
  choice: wird nicht ausgelöscht
  rationale: כרת bedeutet grundsätzlich abschneiden oder ausrotten. Bei einem Namen ist „ausgelöscht werden“ im Deutschen idiomatisch und bewahrt den Gedanken seines Nichtverschwindens, ohne das abweichende griechische Verb zum Maßstab des Haupttextes zu machen.
theological_decisions:
- issue: Abweichung zwischen dem hebräischen Hauptzeugen und der griechischen Parallelüberlieferung im zweiten Satzteil
  choice: 'Dem Hebräischen folgen: „ein Name der Güte wird nicht ausgelöscht“'
  alternative: Die griechische Parallelüberlieferung spricht vom „Namen der Sünder“, der „nicht als gut“ beziehungsweise „nicht für immer“ ausgelöscht werde.
  rationale: Da ein zuverlässiger hebräischer Text vorliegt, bestimmt er den Haupttext. Die erheblich abweichende griechische Lesart wird nicht harmonisiert, sondern transparent in einer Fußnote dokumentiert.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit knappem, würdigem Weisheitston. „Vergänglich“ erschließt die bildhafte Aussage von הבל idiomatisch; „Name der Güte“ hält die ungewöhnliche und möglicherweise mehrdeutige hebräische Fügung offen.
