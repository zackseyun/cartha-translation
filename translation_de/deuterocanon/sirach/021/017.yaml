  text: The mouth of a wise man will be sought in the assembly[b][a], and they will ponder his words in their hearts.
translation:
  language: de
  text: Der Mund eines Weisen wird in der Versammlung gesucht werden, und man wird seine Worte im Herzen bedenken.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Griechischen steht „wird bedenken“ im Singular, doch das Subjekt ist nicht ausdrücklich genannt; gemeint sein kann ein einzelner Hörer als Vertreter der Versammlung.
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: στόμα
  choice: Mund
  rationale: Die konkrete Metapher des griechischen Textes bleibt erhalten; „Rede“ oder „Worte“ würden das Bild vorschnell auflösen.
- source_word: φρονίμου
  choice: eines Weisen
  rationale: Das substantivisch gebrauchte maskuline Singularwort bezeichnet hier einen weisen Mann; die knappe Formulierung ist im Deutschen natürlich.
- source_word: ζητηθήσεται
  choice: wird … gesucht werden
  rationale: Die Wiedergabe bildet das Futur Passiv formal ab und lässt offen, ob besonders das Aufsuchen oder das Gefragtsein der Rede gemeint ist.
- source_word: ἐν ἐκκλησίᾳ
  choice: in der Versammlung
  rationale: „Versammlung“ bezeichnet die zusammengekommene Gemeinschaft, ohne den späteren institutionellen Sinn von „Kirche“ einzutragen.
- source_word: λόγους
  choice: Worte
  rationale: „Worte“ ist die breite und natürliche Entsprechung und wahrt den Bezug auf das, was der Weise äußert.
- source_word: διανοηθήσεται
  choice: man wird … bedenken
  rationale: Das griechische Verb steht im Singular und bezeichnet inneres, erwägendes Nachdenken. Das unpersönliche „man“ gibt den nicht ausdrücklich genannten Träger dieses Nachdenkens im Deutschen natürlich wieder.
- source_word: ἐν καρδίᾳ
  choice: im Herzen
  rationale: Die Wendung bleibt nah am griechischen Singular und bewahrt „Herz“ als Ort innerer Erwägung, statt es auf den Verstand zu verengen.
theological_decisions:
- issue: Geschlechtliche Wiedergabe von φρονίμου
  choice: eines Weisen
  alternative: eines weisen Menschen
  rationale: Die griechische Form ist maskulin Singular und wird ohne einen zwingenden kontextuellen Grund nicht zu einer geschlechtsneutralen Abstraktion umgeformt.
- issue: Bedeutung von ἐκκλησία
  choice: Versammlung
  alternative: Gemeinde
  rationale: Der weisheitliche Zusammenhang spricht von der versammelten Gemeinschaft; „Versammlung“ vermeidet eine nachträgliche kircheninstitutionelle Festlegung.
- issue: Nicht ausdrücklich genanntes Subjekt im zweiten Satzteil
  choice: unpersönliches „man“
  alternative: „sie werden“ beziehungsweise Rückbezug auf „der Mund“
  rationale: Das Verb steht im Singular, während kein neues Subjekt genannt wird. „Man“ bewahrt den generischen Bezug auf den Hörer, ohne einen im Griechischen nicht ausgedrückten Plural einzuführen oder den semantisch unplausiblen „Mund“ zum Denkenden zu machen.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die auffällige Metapher „Mund … gesucht“ wird bewusst beibehalten; „man“ macht den elliptischen zweiten Satzteil lesbar, ohne die griechische Numerusform in einen Plural umzudeuten.
