  text: Instruction is like a golden ornament to a prudent man[a], and like a bracelet on his right arm.
translation:
  language: de
  text: Wie ein goldener Schmuck ist Unterweisung für einen verständigen Menschen[a], und wie ein Armreif an seinem rechten Arm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Erziehung“, „Schulung“ oder „Zucht“. Das griechische Wort παιδεία kann neben Unterweisung auch sittliche Formung und einübende Disziplin bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κόσμος
  choice: Schmuck
  rationale: Hier bezeichnet κόσμος einen Schmuckgegenstand, nicht die Welt oder Ordnung. Der Vergleich mit Gold und einem Armreif legt tragbaren Schmuck nahe.
- source_word: χρυσοῦς
  choice: golden
  rationale: Das Adjektiv kennzeichnet den Schmuck als aus Gold bestehend beziehungsweise goldfarben; „goldener Schmuck“ ist knapp und idiomatisch.
- source_word: φρονίμῳ
  choice: für einen verständigen Menschen
  rationale: φρόνιμος meint praktische Einsicht, Besonnenheit und vernünftiges Urteilsvermögen. „Verständig“ passt zum Weisheitskontext; „Mensch“ gibt die repräsentative Einzelperson natürlich wieder, ohne die Aussage unnötig auf Männer zu begrenzen.
- source_word: παιδεία
  choice: Unterweisung
  rationale: παιδεία umfasst Lehre, Erziehung, Einübung und Zucht. „Unterweisung“ ist im unmittelbaren Bild natürlich und lässt den weiter gefassten Aspekt sittlicher Formung offen.
- source_word: χλιδών
  choice: Armreif
  rationale: In Verbindung mit dem Arm bezeichnet χλιδών am ehesten einen schmückenden Reif. „Armreif“ ist genauer als „Armband“, da βραχίων den Arm bezeichnet.
- source_word: βραχίονι δεξιῷ
  choice: an seinem rechten Arm
  rationale: Die Wendung gibt den Ort des Schmuckstücks an. Das ergänzte Possessivpronomen ist im Deutschen idiomatisch und ergibt sich aus dem Vergleich.
theological_decisions:
- issue: Wiedergabe des grammatisch maskulinen Singulars φρονίμῳ
  choice: für einen verständigen Menschen
  alternative: für einen verständigen Mann
  rationale: Die Sentenz spricht von einer repräsentativen Einzelperson; das grammatische Maskulinum verlangt hier keine inhaltliche Beschränkung auf Männer. „Mensch“ bewahrt Singular und Allgemeingültigkeit, ohne die Weisheitskategorie umzudeuten.
- issue: Bedeutungsumfang von παιδεία
  choice: Unterweisung mit Fußnote zu Erziehung, Schulung und Zucht
  alternative: Zucht
  rationale: Der griechische Ausdruck verbindet Wissensvermittlung mit charakterlicher Formung. Eine Haupttextentscheidung allein kann diesen Umfang nicht vollständig abbilden; die Fußnote bewahrt die sachliche Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Bildstruktur „Wie … und wie …“ bleibt erhalten. „Armreif“ bewahrt das konkrete Schmuckbild; „verständiger Mensch“ ist allgemeinverständlich und entspricht der repräsentativen Funktion der griechischen Form.
