  text: One who hates reproof walks in the track of a sinner, but one who fears the Lord will turn back in his heart.
translation:
  language: de
  text: Wer Zurechtweisung hasst, tritt in die Fußstapfen eines Sünders[a]; wer aber den Herrn fürchtet, wird in seinem Herzen umkehren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „ist in der Fußspur eines Sünders“. Im ersten griechischen Satzteil fehlt ein ausdrückliches finites Verb; „tritt in die Fußstapfen“ ist aus dem Bild der Fußspur ergänzt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μισῶν
  choice: Wer … hasst
  rationale: Das substantivisch gebrauchte Präsenspartizip kennzeichnet einen Menschentyp; die deutsche Wer-Konstruktion ist natürlich und bewahrt den allgemeinen Sinn.
- source_word: ἐλεγμὸν
  choice: Zurechtweisung
  rationale: Der Ausdruck bezeichnet tadelnde, auf Besserung zielende Korrektur und passt zum weisheitlichen Lehrzusammenhang.
- source_word: ἐν ἴχνει
  choice: geht auf der Spur
  rationale: ἴχνος bezeichnet Spur, Fußspur oder Fährte. Da im griechischen ersten Satzteil ein finites Verb fehlt, wird „geht“ sinngemäß ergänzt, ohne das Wegbild aufzugeben.
- source_word: ἁμαρτωλοῦ
  choice: eines Sünders
  rationale: Der generische Singular wird im Deutschen idiomatisch mit dem unbestimmten Artikel wiedergegeben.
- source_word: ὁ φοβούμενος Κύριον
  choice: wer aber den Herrn fürchtet
  rationale: Die substantivische Partizipialfügung bezeichnet allgemein den Gottesfürchtigen; „Herr“ entspricht dem ehrfürchtigen Gottesbezug von Κύριος.
- source_word: ἐπιστρέψει
  choice: wird … umkehren
  rationale: Die Zukunftsform und die Grundbedeutung des Zurück- beziehungsweise Umkehrens bleiben erhalten. „Buße tun“ wäre stärker auslegend.
- source_word: ἐν καρδίᾳ
  choice: in seinem Herzen
  rationale: Die Wendung bewahrt das biblische Bild des Herzens als Ort der inneren Ausrichtung und vermeidet eine erklärende Paraphrase wie „innerlich“.
theological_decisions:
- issue: Wiedergabe von Κύριος
  choice: Herr
  alternative: Gebieter
  rationale: „Herr“ ist im gottesbezogenen weisheitlichen Sprachgebrauch die natürliche und traditionsübergreifend verständliche Wiedergabe.
- issue: Elliptischer erster Satzteil
  choice: geht auf der Spur eines Sünders
  alternative: ist auf der Spur eines Sünders
  rationale: Der griechische Text enthält hier kein ausdrückliches finites Verb. „Geht“ erschließt das in ἴχνος angelegte Wegbild, während die Fußnote die grammatische Ellipse und die wörtlichere Möglichkeit offenlegt.
- issue: Bedeutung von ἐπιστρέψει
  choice: wird in seinem Herzen umkehren
  alternative: wird in seinem Herzen zurückkehren
  rationale: „Umkehren“ gibt die Richtungsänderung wieder, ohne ausdrücklich ein Ziel oder einen voll entfalteten Bußbegriff einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die symmetrischen Wer-Sätze bewahren den weisheitlichen Spruchcharakter; „aber“ macht den sachlichen Gegensatz der beiden Menschentypen im Deutschen klar.
