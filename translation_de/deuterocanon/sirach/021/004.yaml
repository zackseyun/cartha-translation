  text: All lawlessness is like a two-edged sword; for its wound there is no healing.
translation:
  language: de
  text: Wie ein zweischneidiges Schwert ist jede Gesetzlosigkeit; für die Wunde, die sie verursacht, gibt es keine Heilung.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡς
  choice: wie
  rationale: Leitet einen Vergleich ein und entspricht natürlichem, prägnantem Deutsch.
- source_word: ῥομφαία δίστομος
  choice: ein zweischneidiges Schwert
  rationale: Gibt das Bild einer an zwei Seiten geschärften Klinge idiomatisch wieder, ohne δίστομος unnatürlich als „zweimündig“ zu übersetzen.
- source_word: πᾶσα ἀνομία
  choice: jede Gesetzlosigkeit
  rationale: „Gesetzlosigkeit“ bewahrt den Gedanken des Verstoßes gegen Gesetz und Ordnung; „jede“ gibt πᾶσα distributiv und natürlich wieder.
- source_word: τῇ πληγῇ αὐτῆς
  choice: für ihre Wunde
  rationale: Im Zusammenhang mit ἴασις bezeichnet πληγή am ehesten die Wunde. Das Pronomen „ihre“ wahrt wie das Griechische den möglichen Bezug auf die Gesetzlosigkeit oder das Schwert.
- source_word: οὐκ ἔστιν ἴασις
  choice: gibt es keine Heilung
  rationale: Bleibt nahe an der griechischen Existenzkonstruktion und erhält den sprichwortartigen Nachdruck.
theological_decisions:
- issue: Moralischer Begriff ἀνομία
  choice: Gesetzlosigkeit
  alternative: Unrecht; Frevel
  rationale: Die gewählte Formulierung erhält den spezifischen Gedanken einer Missachtung von Gesetz und Ordnung, ohne ihn auf eine bestimmte konfessionelle Deutung festzulegen.
- issue: Bezug von αὐτῆς
  choice: ihre
  alternative: die Wunde, die sie schlägt
  rationale: Da sowohl ῥομφαία als auch ἀνομία feminin sind, kann das griechische Pronomen formal auf beide bezogen werden. „Ihre“ bewahrt diese Bildspannung, statt die Wunde ausdrücklich nur als Wirkung der Gesetzlosigkeit zu deuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper, sprichwortartiger Satzform. Der bildhafte Parallelismus und die Mehrdeutigkeit des Pronominalbezugs bleiben erhalten.
