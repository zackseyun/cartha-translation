  source_fidelity: 'Der Vergleich und die Begriffe sind zutreffend wiedergegeben: ῥομφαία δίστομος als „zweischneidiges Schwert“, πᾶσα ἀνομία als „jede Gesetzlosigkeit“ und ἴασις als „Heilung“. Bei τῇ πληγῇ αὐτῆς bezeichnet die Wunde im Kontext die von der Gesetzlosigkeit bewirkte Verletzung; die deutsche possessive Formulierung kann dagegen auch eine Wunde meinen, die der Gesetzlosigkeit selbst zugefügt wurde.'
  naturalness: Der erste Teilsatz ist knapp und würdig. „Für ihre Wunde gibt es keine Heilung“ ist zwar grammatisch möglich, bleibt im heutigen Deutsch jedoch semantisch missverständlich und etwas sperrig. Eine Relativformulierung macht das Gemeinte idiomatisch klar.
  terminology: „Gesetzlosigkeit“ bewahrt den spezifischen Charakter von ἀνομία und entspricht der englischen Audit-Entscheidung. „Zweischneidiges Schwert“ ist etabliertes modernes Standarddeutsch und wahrt das Bild ohne unnötige Übertragung.
