review_pass:
  verdict: revise
  source_fidelity: Der erste Halbvers gibt ἀπαιδευσία angemessen als sozial-moralische Ungezogenheit wieder und bewahrt mit „an einer Tür“ das konkrete Bild von παρὰ θύραν. „lauschen“ legt die kontextuelle Implikation des heimlichen Mithörens leicht nahe, ohne den Sinn wesentlich zu verengen; die Fußnote kennzeichnet dies. Im zweiten Halbvers schwächt „wird sich ... bedrückt fühlen“ jedoch das passivische βαρυνθήσεται zu einer bloßen Gefühlsbeschreibung ab. „wird ... belastet werden“ gibt Bild, Passiv und kausalen Dativ bei ἀτιμίᾳ unmittelbarer wieder.
  naturalness: Die Formulierung ist insgesamt moderne, würdige Standardsprache. „Es zeugt von Ungezogenheit“ ist idiomatisch und kann das generische ἀνθρώπου im Deutschen natürlich ausdrücken. „durch die Schande belastet werden“ ist ebenso natürlich und näher am griechischen Ausdruck als „sich bedrückt fühlen“.
  terminology: „Ungezogenheit“ trifft den hier kontextuell sittlich-sozialen Charakter von ἀπαιδευσία gut. „verständiger Mensch“ ist eine sachgerechte, nicht konfessionell gefärbte Wiedergabe von φρόνιμος. „Schande“ ist für ἀτιμία passend; der bestimmte Artikel erhält die im Griechischen offene, kontextuell bestimmte Referenz ohne sie näher festzulegen.
  issues:
  - severity: medium
    issue: „wird sich durch die Schande bedrückt fühlen“ gibt βαρυνθήσεται nicht hinreichend formnah wieder.
    rationale: Das griechische Futurpassiv bezeichnet ein Belastet- bzw. Beschwertwerden. Die reflexive deutsche Wendung macht daraus vor allem einen inneren Gefühlszustand und reduziert die passive Bildlichkeit. Eine passive Formulierung ist genau und idiomatisch.
