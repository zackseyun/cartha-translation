revisions:
- from: Es zeugt von Ungezogenheit, an einer Tür zu lauschen[a]; ein verständiger Mensch aber wird sich durch die Schande bedrückt fühlen.
  to: Es zeugt von Ungezogenheit, an einer Tür zu lauschen[a]; ein verständiger Mensch aber wird durch die Schande belastet werden.
  rationale: Nur der zweite Halbvers wird angepasst, damit das passive, bildhafte βαρυνθήσεται („wird belastet werden“) erhalten bleibt. Die übrigen Entscheidungen sind quellentreu und sprachlich natürlich; die Fußnote bewahrt die vorsichtige Einordnung der durch den Türkontext nahegelegten, aber nicht ausdrücklich benannten Bedeutung.
