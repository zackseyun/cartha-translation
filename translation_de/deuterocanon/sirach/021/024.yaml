  text: It is a man's lack of discipline to listen at a door[a], but a prudent man will be burdened by disgrace.
translation:
  language: de
  text: Es zeugt von Ungezogenheit, an einer Tür zu lauschen[a]; ein verständiger Mensch aber wird durch die Schande belastet werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „an einer Tür zuzuhören“; gemeint ist offenbar heimliches Mithören.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπαιδευσία ἀνθρώπου
  choice: Es zeugt von Ungezogenheit
  rationale: ἀπαιδευσία bezeichnet fehlende Erziehung oder Bildung und das daraus hervorgehende ungehörige Benehmen. „Ungezogenheit“ gibt hier die soziale und sittliche Wertung natürlich wieder; ἀνθρώπου ist generisch und muss im Deutschen nicht eigens mit „eines Mannes“ ausgedrückt werden.
- source_word: ἀκροᾶσθαι παρὰ θύραν
  choice: an einer Tür zu lauschen
  rationale: ἀκροᾶσθαι heißt zunächst „hören, zuhören“; zusammen mit παρὰ θύραν entsteht das Bild heimlichen Mithörens. „lauschen“ bewahrt das Türbild und lässt die negative Implikation erkennen, ohne sie mit „belauschen“ vollständig auszudeuten.
- source_word: ὁ δὲ φρόνιμος
  choice: ein verständiger Mensch aber
  rationale: φρόνιμος bezeichnet einen Menschen mit praktischer Einsicht und gesundem Urteil. „verständig“ ist im modernen Deutschen würdig und allgemein verständlich.
- source_word: βαρυνθήσεται
  choice: wird sich bedrückt fühlen
  rationale: Das Futur Passiv von βαρύνω vermittelt wörtlich ein Schwerwerden oder Belastetwerden. Die Formulierung erhält das Gewicht dieser Metapher und klingt im Deutschen natürlich.
- source_word: ἀτιμίᾳ
  choice: durch die Schande
  rationale: Der Dativ kann Ursache oder Mittel angeben. „Schande“ bewahrt den gesellschaftlich-moralischen Sinn von Ehrverlust, wobei offenbleibt, wessen Schande gemeint ist.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. Der erste Halbvers ist idiomatisch formuliert, während das konkrete Bild der Tür erhalten bleibt. Der zweite Halbvers bewahrt die bildhafte Schwere von βαρυνθήσεται und die Mehrdeutigkeit des Bezugs von „Schande“.
