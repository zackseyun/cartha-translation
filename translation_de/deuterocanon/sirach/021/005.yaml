translation:
  language: de
  text: Das Flehen eines Armen gelangt von seinem Mund bis zu seinen Ohren[a], und sein Urteil[b] kommt schnell.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „von seinem Mund bis zu seinen Ohren“. Die Ohren können dem Zusammenhang nach Gottes Ohren sein; der griechische Text nennt Gott jedoch nicht ausdrücklich.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „seine Entscheidung“, „sein Gericht“ oder „sein Recht“. Das griechische Wort kann eine richterliche Entscheidung bezeichnen; im Zusammenhang kann an eine Entscheidung zugunsten der Sache des Armen gedacht sein.'
    reason: alternative_reading
lexical_decisions:
- source_word: δέησις
  choice: Flehen
  rationale: Das Substantiv bezeichnet eine eindringliche Bitte oder ein Bittgebet. „Flehen“ bewahrt die Dringlichkeit und passt natürlich zum Hilferuf eines Armen.
- source_word: πτωχοῦ
  choice: eines Armen
  rationale: Der griechische maskuline Singular bezeichnet hier einen einzelnen armen oder bedürftigen Mann. Die substantivierte Form „eines Armen“ ist im Deutschen knapp, natürlich und grammatisch entsprechend.
- source_word: ἐκ στόματος ἕως ὠτίων αὐτοῦ
  choice: aus seinem Mund bis zu seinen Ohren
  rationale: Die Formulierung bewahrt das auffällige Bild und die pronominale Mehrdeutigkeit des Griechischen. Im Zusammenhang sind wahrscheinlich Gottes Ohren gemeint, doch wird dies nicht stillschweigend in den Haupttext eingesetzt.
- source_word: κρίμα
  choice: Entscheidung in seiner Sache
  rationale: κρίμα kann das richterliche Urteil, die Entscheidung oder die Rechtssache bezeichnen. Die gewählte Formulierung macht im Deutschen verständlich, dass über das Anliegen des Armen entschieden wird, ohne festzulegen, ob die Entscheidung günstig oder strafend ausfällt.
- source_word: κατὰ σπουδήν
  choice: unverzüglich
  rationale: Die Wendung drückt Eile und promptes Handeln aus. „Unverzüglich“ ist gegenwärtiges, würdiges Deutsch und gibt die zeitliche Dringlichkeit präzise wieder.
- source_word: ἔρχεται
  choice: kommt
  rationale: Das Präsens wird schlicht und bildhaft wiedergegeben und bewahrt die Unmittelbarkeit der Aussage.
theological_decisions:
- issue: Bezug von αὐτοῦ in „bis zu seinen Ohren“
  choice: Das Pronomen bleibt im Haupttext formal mehrdeutig; dem Zusammenhang nach sind wahrscheinlich Gottes Ohren gemeint.
  alternative: Das Pronomen könnte grammatisch auf den Armen selbst zurückbezogen werden; ausdrücklich „bis zu Gottes Ohren“ zu übersetzen würde dagegen die wahrscheinlichste Deutung festschreiben.
  rationale: Der arme Mann ist der nächste ausdrücklich genannte Bezugspunkt, doch die folgende Aussage über die rasch eintreffende Entscheidung legt Gott als unausgesprochenen Hörer und Richter nahe. Die Übersetzung bewahrt daher die Spannung und erläutert sie in einer Fußnote.
- issue: Bedeutung von κρίμα αὐτοῦ
  choice: „die Entscheidung in seiner Sache“ bezeichnet den richterlichen Entscheid über das Anliegen des Armen.
  alternative: Möglich sind auch „sein Urteil“, „sein Recht“ oder „sein Rechtsentscheid“.
  rationale: Die Formulierung vermeidet die unbegründete Festlegung, ob es sich um ein Urteil gegen den Armen oder um ihm gewährte Gerechtigkeit handelt, und erhält zugleich den gerichtlichen Sinn.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Flehen“ wahrt die Eindringlichkeit des Bittgebets; die ungewöhnliche Wendung mit Mund und Ohren bleibt bewusst erhalten. Die Fußnoten machen die echte pronominale und rechtssprachliche Mehrdeutigkeit transparent.
