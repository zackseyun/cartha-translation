  source_fidelity: 'Die Übersetzung gibt ἔγκατα als „Das Innere“ angemessen wieder und erhält damit sowohl die konkrete Binnen-/Behältermetapher als auch deren mögliche übertragene Dimension. „eines Toren“, „wie ein zerschlagenes Gefäß“ und „keinerlei Erkenntnis bewahren“ entsprechen μωροῦ, ὡς ἄγγιον συντετριμμένον und πᾶσαν γνῶσιν οὐ κρατήσει zuverlässig. Das deutsche Singularverb ist sachgerecht: Zum griechischen Neutrum Plural ἔγκατα steht regulär ein Singularverb. Die Fassung legt den nicht völlig auszuschließenden gedanklichen Bezug auf den Toren nicht unnötig fest.'
  naturalness: Modernes, verständliches Standarddeutsch mit einem passenden knappen Weisheitsspruchton. „Das Innere eines Toren“ wirkt etwas gehoben, ist für den Registerbereich jedoch natürlich und treffend. „Bewahren“ ist hier als „behalten/retinieren“ idiomatisch möglich und führt die Gefäßmetapher sinnvoll fort.
  terminology: „Tor“ ist für μωρός im Weisheitskontext ein etablierter, nicht konfessionell zugespitzter Ausdruck. „Erkenntnis“ ist für γνῶσις vertretbar und präziser als bloßes Faktenwissen, ohne eine technische theologische Bedeutung einzutragen. „Gefäß“ bewahrt die vom griechischen ἄγγιον offen gelassene Material- und Formbestimmung.
