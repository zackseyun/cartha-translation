translation:
  language: de
  text: Das Innere eines Toren ist wie ein zerschlagenes Gefäß[a] und wird keinerlei Erkenntnis bewahren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wie ein zerbrochener Krug“ beziehungsweise „wie ein zertrümmerter Topf“. Das griechische Bild bezeichnet einen zerschlagenen Behälter, der nicht bewahren kann, was man hineingibt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔγκατα
  choice: das Innere
  rationale: Das Wort bezeichnet wörtlich die inneren Organe beziehungsweise Eingeweide und kann übertragen das innere Wesen meinen. „Das Innere“ bewahrt das körperlich-räumliche Bild, klingt im heutigen Deutschen jedoch natürlicher als „Eingeweide“.
- source_word: μωροῦ
  choice: eines Toren
  rationale: μωρός bezeichnet in der Weisheitsliteratur einen sittlich und geistig unverständigen Menschen. „Tor“ erhält den knappen, sprichwortartigen und würdevollen Ton.
- source_word: ὡς ἄγγιον συντετριμμένον
  choice: wie ein zerschlagenes Gefäß
  rationale: ἄγγιον ist ein Behälter oder Gefäß; συντετριμμένον bezeichnet etwas Zertrümmertes oder Zerschlagenes. Die Wiedergabe lässt das Material offen und erhält das Bild eines Behälters, der nichts mehr aufnehmen und festhalten kann.
- source_word: πᾶσαν γνῶσιν
  choice: keinerlei Erkenntnis
  rationale: Im Wirkungsbereich der Verneinung bedeutet πᾶσαν idiomatisch, dass überhaupt keine Erkenntnis bewahrt wird. „Erkenntnis“ gibt γνῶσις präziser wieder als das breitere „Wissen“.
- source_word: οὐ κρατήσει
  choice: wird … nicht/keinerlei … bewahren
  rationale: κρατέω kann festhalten, behalten oder bewahren bedeuten. „Bewahren“ nimmt zugleich die Aussage über Erkenntnis und das Bild des undichten, zerschlagenen Gefäßes auf; die Zukunftsform des Griechischen bleibt erhalten.
theological_decisions:
- issue: Bezug des singularischen Verbs κρατήσει
  choice: Bezug auf „das Innere“ als grammatisch singularische Wiedergabe
  alternative: „Der Tor wird keinerlei Erkenntnis festhalten“
  rationale: Das griechische Verb steht im Singular, während ἔγκατα formal ein Neutrum Plural ist; als Subjekt könnte daher auch der Tor aus μωροῦ mitgedacht sein. Die deutsche Fassung lässt „das Innere“ als Subjekt fortwirken und erhält so die Gefäßmetapher, ohne die Aussage theologisch zuzuspitzen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit knappem, würdigem Spruchton. „Das Innere“ vermeidet das heute grob-anatomisch klingende „Eingeweide“, ohne die konkrete Innenraum- und Gefäßmetapher auf „Herz“ oder „Verstand“ zu verengen.
