  text: A fool’s explanation is like a burden on the road[a], but grace will be found on the lips of the prudent.
translation:
  language: de
  text: Die Erklärung eines Toren ist wie eine Last auf dem Weg; auf den Lippen eines Verständigen aber wird Anmut zu finden sein.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Gunst“ oder „gewinnende Freundlichkeit“. Das griechische Wort χάρις kann Anmut, Gunst oder eine gewinnende Freundlichkeit bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξήγησις
  choice: Erklärung
  rationale: Das Substantiv bezeichnet eine Erklärung oder Darlegung. „Erklärung“ ist im Deutschen natürlich und hält den Gegensatz zwischen der Rede des Toren und den Lippen des Verständigen fest.
- source_word: μωροῦ
  choice: eines Toren
  rationale: Der Genitiv hängt von ἐξήγησις ab. „Tor“ ist der geläufige Begriff der Weisheitsliteratur und bezeichnet nicht bloß geringe Intelligenz, sondern fehlende Einsicht.
- source_word: ὡς ἐν ὁδῷ φορτίον
  choice: wie eine Last auf dem Weg
  rationale: φορτίον bezeichnet eine Last oder Bürde, ἐν ὁδῷ wörtlich „auf dem Weg“. Die Wiedergabe bewahrt das konkrete Bild und lässt offen, ob besonders das beschwerliche Tragen oder die hinderliche Last im Blick ist.
- source_word: χείλους
  choice: auf den Lippen
  rationale: Obwohl der griechische Ausdruck formal im Singular steht, ist „auf den Lippen“ die natürliche deutsche Redewendung und bewahrt das konkrete Sprachbild.
- source_word: συνετοῦ
  choice: eines Verständigen
  rationale: συνετός bezeichnet in Weisheitstexten einen Menschen mit Einsicht und gutem Urteilsvermögen. „Verständiger“ bildet einen klaren, würdigen Gegensatz zum „Toren“.
- source_word: εὑρεθήσεται χάρις
  choice: wird sich Anmut finden
  rationale: Das Futur wird bewahrt; χάρις kann Anmut, Gunst oder eine gewinnende Freundlichkeit bezeichnen. „Anmut“ passt zur Qualität der Rede, ohne die Bedeutungsbreite völlig auf eine zwischenmenschliche Haltung zu verengen.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache mit dem traditionsreichen Weisheitsbegriff „Tor“. Der parallel-kontrastive Satzbau und das Bild der Lippen bleiben erhalten; die ungewöhnliche Wegmetapher wird nicht erklärend aufgelöst.
