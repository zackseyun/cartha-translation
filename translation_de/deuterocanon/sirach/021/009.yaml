translation:
  language: de
  text: Eine Versammlung von Gesetzlosen ist wie zusammengetragenes Werg[a], und ihr Ende ist eine Feuerflamme.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Zusammengetragenes Werg ist eine Versammlung von Gesetzlosen.“ Das Griechische stellt die beiden Ausdrücke verdichtet nebeneinander: wörtlich „zusammengetragenes Werg, eine Versammlung von Gesetzlosen“.'
    reason: Die griechische Syntax lässt sich als knappe Gleichsetzung lesen; die Hauptfassung gibt die Bildbeziehung zur besseren Verständlichkeit als Vergleich wieder.
lexical_decisions:
- source_word: στιππύον
  choice: Werg
  rationale: Das griechische Substantiv bezeichnet leicht brennbare, grobe Flachs- oder Hanffasern beziehungsweise Faserabfall. „Werg“ ist dafür im Deutschen die genaueste Bezeichnung und bewahrt das Bild des rasch entzündlichen Materials.
- source_word: συνηγμένον
  choice: zusammengebündeltes
  rationale: Das Partizip bedeutet wörtlich „zusammengebracht“ oder „gesammelt“. Im Zusammenhang mit Werg gibt „zusammengebündelt“ das gesammelte Brennmaterial anschaulich und idiomatisch wieder.
- source_word: συναγωγὴ ἀνόμων
  choice: eine Versammlung von Gesetzlosen
  rationale: συναγωγή bezeichnet eine Zusammenkunft oder Versammlung; ἄνομοι sind Menschen, die sich über das Gesetz hinwegsetzen. „Gesetzlose“ erhält diese rechtlich-ethische Nuance, statt sie zum allgemeinen „Böse“ abzuschwächen.
- source_word: συντέλεια
  choice: Ende
  rationale: Hier bezeichnet das Wort den abschließenden Ausgang oder das endgültige Geschick der Versammlung. „Ende“ ist knapp, natürlich und lässt die mögliche endzeitliche Tiefe offen.
- source_word: φλὸξ πυρός
  choice: eine Feuerflamme
  rationale: Die Verbindung lautet wörtlich „Flamme des Feuers“. „Feuerflamme“ bewahrt die nachdrückliche, poetische Bildsprache, ohne im Deutschen unnötig sperrig zu wirken.
theological_decisions:
- issue: Ob ἀνόμων mit einem allgemeinen moralischen Ausdruck abgeschwächt werden soll
  choice: Gesetzlosen
  alternative: Frevlern; Gottlosen; Bösen
  rationale: Der griechische Ausdruck hebt die Missachtung des Gesetzes beziehungsweise verbindlicher Ordnung hervor. „Gesetzlose“ bewahrt diesen Sinn, ohne eine weitergehende konfessionelle Deutung einzutragen.
- issue: Ob die verdichtete griechische Nominalfügung als direkte Gleichsetzung oder als Vergleich wiederzugeben ist
  choice: 'als verständlicher Vergleich: „ist wie zusammengebündeltes Werg“'
  alternative: 'direkte Gleichsetzung: „Zusammengetragenes Werg ist eine Versammlung von Gesetzlosen“'
  rationale: Der griechische Wortlaut stellt „zusammengetragenes Werg“ und „Versammlung von Gesetzlosen“ knapp nebeneinander. Die Vergleichsform macht die Bildbeziehung im heutigen Deutsch verständlich, ohne ihre Aussage über das gemeinsame, leicht entflammbare Verderben festzulegen oder auszuweiten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewahrter Weisheitsliteratur-Bildsprache. „Werg“ ist sachlich präzise, heute jedoch weniger geläufig und wird deshalb durch eine Fußnote gestützt. Der Parallelismus und die knappe Gerichtsaussage des griechischen Verses bleiben erhalten.
