  yaml_path: translation/deuterocanon/sirach/021/028.yaml
  text: The whisperer defiles his own soul[a], and in the place where he lives he will be hated.
translation:
  language: de
  text: Wer heimlich über andere redet, befleckt seine eigene Seele und wird an seinem Wohnort[a] gehasst.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »unter denen, bei denen er wohnt«; möglicherweise auch: »während seines Aufenthalts in der Fremde«. Das griechische Wort kann den Wohnort, das soziale Umfeld des Wohnens oder einen Aufenthalt als Fremder bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μολύνει
  choice: befleckt
  rationale: Das Verb bezeichnet ein Verunreinigen oder moralisches Beflecken. »Befleckt« bewahrt sowohl den Reinheitsgedanken als auch die ethische Bedeutung, ohne vorwiegend körperlich zu klingen.
- source_word: τὴν ἑαυτοῦ ψυχὴν
  choice: seine eigene Seele
  rationale: ψυχή kann »Seele«, »Leben« oder »Selbst« bedeuten. Die ausdrückliche reflexive Wendung betont hier den inneren moralischen Schaden; »seine eigene Seele« gibt Form und Nachdruck des Griechischen wieder.
- source_word: ὁ ψιθυρίζων
  choice: wer heimlich über andere redet
  rationale: Das substantivierte Partizip bezeichnet jemanden, der im Verborgenen flüstert, häufig im Sinn von übler Nachrede oder Zuträgerei. Die Formulierung ist im heutigen Deutsch verständlich und erhält den Gedanken verdeckter Rede, ohne ihn auf nachweislich falsche Verleumdung einzuengen.
- source_word: ἐν παροικήσει
  choice: an seinem Wohnort
  rationale: παροίκησις kann den Aufenthalt, das Wohnen oder das soziale Umfeld des Wohnens bezeichnen. »An seinem Wohnort« ist knapp und natürlich; die mögliche gemeinschaftliche beziehungsweise vorübergehende Nuance wird in der Fußnote offengehalten.
- source_word: μισηθήσεται
  choice: wird … gehasst
  rationale: Der Futur Passiv sagt unmittelbar aus, dass andere diese Person hassen werden. Die deutsche Wiedergabe entspricht Tempus und Genus Verbi.
theological_decisions:
- issue: Anthropologische Bedeutung von ψυχή
  choice: Seele
  alternative: sich selbst / sein eigenes Leben
  rationale: »Seele« bewahrt die im Ausgangstext mögliche Unterscheidung zwischen Person und innerem Leben, ohne eine ausgearbeitete Seelenlehre in den Vers hineinzulesen. Die breitere Bedeutung »Selbst« bleibt lexikalisch möglich.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Umschreibung »wer heimlich über andere redet« vermeidet das heute ungebräuchliche »Ohrenbläser« und das missverständliche »Flüsterer«, bewahrt aber den negativen Sinn verdeckter Rede. Der Satzbau bleibt knapp und spruchhaft.
