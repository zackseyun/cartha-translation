translation:
  language: de
  text: Ein Tor blickt vom Eingang aus in ein Haus hinein; Ehre aber gebührt dem Mann, der draußen steht und spricht.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das Hebräische hat die knappe Formulierung: „und Ehre einem Mann, der draußen steht und spricht“. Die griechische Parallelüberlieferung lautet dagegen: „Ein gebildeter (oder: erzogener) Mann wird draußen stehen.“'
    reason: alternative_reading
  - marker: b
    text: Die griechische Parallelüberlieferung endet mit „wird draußen stehen“; „und spricht“ steht im hier zugrunde gelegten hebräischen Text.
    reason: textual_variant
lexical_decisions:
- source_word: אֱוִיל
  choice: ein Tor
  rationale: Der geläufige Begriff der hebräischen Weisheitsliteratur bezeichnet einen moralisch und sozial unverständigen Menschen; „Tor“ bewahrt den würdevollen Spruchstil.
- source_word: מִפֶּתַח
  choice: vom Eingang aus
  rationale: מן mit פתח bezeichnet den Standort beziehungsweise Ausgangspunkt am Eingang; die Formulierung gibt das Bild des aufdringlichen Hineinschauens natürlich wieder.
- source_word: יַבִּיט אֶל בָּיִת
  choice: blickt … in ein Haus hinein
  rationale: הביט אל bedeutet hier, auf ein Haus beziehungsweise in ein Haus zu blicken. Das deutsche „hinein“ verdeutlicht die Richtung, ohne die im Griechischen stärker hervortretende Bedeutung „hineinspähen“ zwingend in den hebräischen Wortlaut einzutragen.
- source_word: וְכָבוֹד לְאִישׁ
  choice: Ehre aber gebührt dem Mann
  rationale: Die knappe hebräische Nominalfügung lautet annähernd „und Ehre einem Mann“. Die Wiedergabe bewahrt כבוד als Substantiv und damit die Mehrdeutigkeit zwischen Ehre, Ansehen und ehrbarem Verhalten, statt sie ausschließlich als Eigenschaft des Mannes aufzulösen.
- source_word: בַּחוּץ יַעֲמוֹד
  choice: der draußen stehen bleibt
  rationale: Die Wendung bezeichnet das rücksichtsvolle Verweilen außerhalb des Hauses. Das deutsche Präsens entspricht dem allgemeinen Charakter des Weisheitsspruchs.
- source_word: וִידַבֵּר
  choice: und spricht
  rationale: Das Verb ist im hebräischen Zeugen ausdrücklich vorhanden. Die schlichte Wiedergabe vermeidet die nicht ausdrücklich genannten Ergänzungen „ruft“ oder „meldet sich“.
