translation_notes:
  register: Moderner, würdevoller Spruchstil. „Ein Tor“ wahrt den traditionellen Weisheitswortschatz, während Satzbau und Verben gegenwärtig und allgemein verständlich bleiben. Die ungewöhnlich knappe Ehrenformel des Hebräischen wird im Haupttext möglichst wenig geglättet und in der Fußnote erläutert.
