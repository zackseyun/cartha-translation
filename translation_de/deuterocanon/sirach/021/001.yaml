translation:
  language: de
  text: Kind, hast du gesündigt? Tu es nicht wieder, und bete wegen deiner früheren Sünden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die für diesen Vers vorgelegte hebräische Zeile stimmt nicht mit Sirach 21,1 überein; sie lautet: »Drei Dinge hasste ich, und vier liebte ich nicht.« Daher folgt die Übersetzung hier dem griechischen Textzeugen.'
    reason: textual_variant
lexical_decisions:
- source_word: Τέκνον
  choice: Kind
  rationale: Die geschlechtsneutrale Anrede gibt den griechischen Vokativ direkt wieder, ohne das im Text nicht ausgedrückte Possessiv »mein« hinzuzufügen.
- source_word: ἥμαρτες
  choice: hast du gesündigt
  rationale: Das Perfekt ist im Deutschen eine natürliche Wiedergabe des griechischen Aorists in dieser direkten Frage und bewahrt den religiös-ethischen Sinn von ἁμαρτάνω.
- source_word: μὴ προσθῇς μηκέτι
  choice: Tu es nicht wieder
  rationale: Die griechische Wendung bedeutet wörtlich etwa »füge nicht länger hinzu«; im Zusammenhang untersagt sie verständlich und knapp die Wiederholung der Sünde.
- source_word: περὶ τῶν προτέρων σου
  choice: wegen deiner früheren Sünden
  rationale: Wörtlich steht »wegen deiner früheren Dinge«; aus dem unmittelbar vorausgehenden Verb »sündigen« ergibt sich, dass frühere Sünden gemeint sind.
- source_word: δεήθητι
  choice: bete
  rationale: Der Imperativ von δέομαι bezeichnet hier flehendes Bitten im Gebet. »Bete« ist gegenwärtig, verständlich und vermeidet die Hinzufügung eines im Griechischen nicht ausdrücklich genannten Gebetsziels.
theological_decisions:
- issue: Textgrundlage bei nicht zum Vers gehörender hebräischer Zeile
  choice: Der griechische Paralleltext wird als Textgrundlage für Sirach 21,1 verwendet; die Abweichung des vorgelegten Hebräischen wird in einer Fußnote offengelegt.
  alternative: Die vorgelegte hebräische Zeile »Drei Dinge hasste ich, und vier liebte ich nicht« trotz ihrer fehlenden inhaltlichen Übereinstimmung als Sirach 21,1 übersetzen.
  rationale: Die hebräische Zeile gehört ihrem Inhalt nach nicht zu Sirach 21,1, während der griechische Zeuge den überlieferten Wortlaut dieses Verses bietet. Die Wahl wahrt die Versidentität und verschweigt die Quellenlage nicht.
- issue: Unausgesprochenes Ziel des Gebets
  choice: Das Gebetsziel wird nicht als »Vergebung« ergänzt.
  alternative: »Bete um Vergebung für deine früheren Sünden.«
  rationale: Vergebung ist im Zusammenhang naheliegend, wird im griechischen Wortlaut jedoch nicht ausdrücklich genannt. Die offenere Formulierung bewahrt diese sprachliche Zurückhaltung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper weisheitlicher Anrede. Die Formulierung folgt dem griechischen Paralleltext, da die zugeordnete hebräische Zeile offenkundig versetzt ist; die Unsicherheit wird transparent ausgewiesen.
