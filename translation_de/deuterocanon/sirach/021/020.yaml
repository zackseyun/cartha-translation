translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knappem sprichwörtlichem Rhythmus. Das maskuline „Mann“ folgt dem ausdrücklich maskulinen ἀνήρ; „Narr“ ist als traditionelle Personenbezeichnung geschlechtsbezogen offen verständlich.
