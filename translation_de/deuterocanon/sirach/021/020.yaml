  text: A fool raises his voice in laughter[a], but a shrewd man will scarcely smile quietly.
translation:
  language: de
  text: Ein Narr erhebt beim Lachen die Stimme, ein kluger Mann aber lächelt kaum merklich und still.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „wird kaum still lächeln“. Die griechische Wendung verbindet „kaum“, „still/in Ruhe“ und „lächeln“ zu einem knappen Bild zurückhaltenden Lächelns.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μωρός
  choice: Narr
  rationale: „Narr“ entspricht dem moralisch und praktisch unverständigen Menschen der Weisheitsliteratur und bewahrt den sprichwörtlichen Ton.
- source_word: ἐν γέλωτι
  choice: beim Lachen
  rationale: Die Wendung bezeichnet den Zusammenhang, in dem der Narr seine Stimme erhebt; „beim Lachen“ ist im Deutschen natürlich und prägnant.
- source_word: ἀνυψοῖ φωνὴν αὐτοῦ
  choice: erhebt … die Stimme
  rationale: Die deutsche Redewendung gibt das Erheben der eigenen Stimme idiomatisch wieder; das Possessivpronomen ist im Deutschen entbehrlich.
- source_word: ἀνὴρ πανοῦργος
  choice: ein kluger Mann
  rationale: πανοῦργος bezeichnet hier im positiven Gegensatz zum Narren einen einsichtigen, beherrschten Menschen. „Klug“ wahrt diesen Sinn, ohne die mögliche negative Färbung von „gerissen“ einzutragen.
- source_word: μόλις ἡσυχῇ μειδιάσει
  choice: lächelt nur ganz still
  rationale: Die natürliche deutsche Formulierung bündelt μόλις, die adverbiale Ruhe bzw. Stille und das zurückhaltende Lächeln. Sie erhält den Kontrast zwischen lautem Lachen und beherrschtem Lächeln, ohne die kompakte griechische Verbindung künstlich aufzulösen.
