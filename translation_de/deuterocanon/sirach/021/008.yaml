  yaml_path: translation/deuterocanon/sirach/021/008.yaml
  text: He who builds his house with another’s money is like one gathering his stones for winter[a][b].
translation:
  language: de
  text: Wer sein Haus mit dem Vermögen anderer baut, gleicht einem, der seine Steine für den Winter sammelt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Für den Winter“ kann auch „für die Sturmzeit“ bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ οἰκοδομῶν
  choice: Wer … baut
  rationale: Das substantivierte Präsenspartizip ist allgemein und sprichwörtlich gebraucht. „Wer … baut“ gibt dies im modernen Deutschen natürlich wieder.
- source_word: τὴν οἰκίαν αὐτοῦ
  choice: sein Haus
  rationale: οἰκία kann auch den Haushalt bezeichnen; wegen des Bauens und der Steine ist hier jedoch das Gebäude gemeint.
- source_word: ἐν χρήμασιν ἀλλοτρίοις
  choice: mit dem Vermögen anderer
  rationale: χρήματα bezeichnet Geld, Besitz oder Vermögen, ἀλλότριος etwas, das anderen gehört. Die Wiedergabe bewahrt die plurale bzw. allgemeine Aussage und legt nicht unnötig fest, dass ausschließlich Bargeld gemeint ist.
- source_word: ὡς συνάγων
  choice: gleicht einem, der … sammelt
  rationale: ὡς mit Partizip führt einen Vergleich ein. Die Formulierung ist klar, würdig und erhält den sprichwörtlichen Charakter.
- source_word: αὐτοῦ τοὺς λίθους
  choice: seine Steine
  rationale: Das überlieferte αὐτοῦ wird als Possessivangabe zum Sammelnden verstanden und nicht ausgelassen.
- source_word: εἰς χειμῶνα
  choice: für den Winter
  rationale: χειμών kann Winter oder die winterliche Sturmzeit bedeuten. „Für den Winter“ ist die direkte, knappe Wiedergabe; die weitere Bedeutungsnuance wird in einer Fußnote bewahrt.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit knapper, würdiger Spruchweisheit. „Vermögen anderer“ vermeidet die Engführung auf Bargeld und gibt die fremden Ressourcen präzise wieder.
