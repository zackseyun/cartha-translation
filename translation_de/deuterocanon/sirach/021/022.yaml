  text: A fool’s foot hurries to a house[a], but a man of schemes bows low before the great.
translation:
  language: de
  text: Der Fuß eines Toren eilt zu einem Haus, doch ein Mann voller Pläne beugt sich vor den Großen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Parallelüberlieferung lautet im zweiten Satzteil sinngemäß: »Ein sehr erfahrener Mann wird sich vor einem Angesicht / in jemandes Gegenwart schämen.« Hebräischer und griechischer Text unterscheiden sich hier deutlich.'
    reason: alternative_reading
lexical_decisions:
- source_word: רֶגֶל
  choice: der Fuß
  rationale: Bewahrt den bildhaften Singular des Hebräischen und den sprichwortartigen Stil; auch das griechische ποὺς entspricht »Fuß«.
- source_word: נָבָל
  choice: eines Toren
  rationale: »Tor« ist eine natürliche, würdige Bezeichnung der Weisheitsliteratur und gibt den moralisch-intellektuellen Sinn wieder, ohne ihn zu »niederträchtig« zu verschärfen.
- source_word: מִהֲרָה
  choice: eilt
  rationale: Gibt die Hast knapp und idiomatisch wieder und lässt die im Zusammenhang negative Färbung erkennen.
- source_word: אֶל בָּיִת
  choice: zu einem Haus
  rationale: Bewahrt die unbestimmte Form des Hebräischen und den allgemeinen Charakter des Spruchs.
- source_word: אִישׁ מְזִימוֹת
  choice: ein Mann voller Pläne
  rationale: Gibt אִישׁ ausdrücklich wieder und bewahrt bei מְזִימוֹת die Mehrdeutigkeit zwischen planvollem Denken und möglicherweise berechnenden Absichten besser als eindeutig positive Wörter wie »verständig«.
- source_word: יַכְנִיעַ
  choice: beugt sich
  rationale: Vermittelt das Sich-Erniedrigen beziehungsweise die ehrerbietige Unterordnung in natürlichem Deutsch, ohne sicher zu behaupten, ob die Handlung freiwillig oder erzwungen ist.
- source_word: לָרַבִּים
  choice: vor den Großen
  rationale: רַבִּים kann »die Vielen« oder »die Großen« bezeichnen. Im Zusammenhang des Sich-Beugens ergibt die soziale Bedeutung »die Großen« einen stimmigen, jedoch nicht völlig sicheren Sinn.
theological_decisions:
- issue: Vorrang des erhaltenen hebräischen Textes bei erheblicher Abweichung der griechischen Parallelüberlieferung im zweiten Halbvers
  choice: Der Haupttext folgt dem hebräischen Geniza-Text.
  alternative: »Ein sehr erfahrener Mann wird sich vor einem Angesicht / in jemandes Gegenwart schämen.«
  rationale: Da ein hebräischer Text erhalten ist, bildet er die Grundlage. Die griechische Fassung stimmt im ersten Halbvers weitgehend überein, weicht im zweiten jedoch in Wortlaut und Sinn deutlich ab; deshalb wird sie in einer Fußnote dokumentiert, nicht stillschweigend mit dem Hebräischen vermischt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper, sprichwortartiger Satzform. Die ungewöhnliche Bildrede »Der Fuß eines Toren« bleibt erhalten. »Voller Pläne« lässt die moralische Färbung von מְזִימוֹת bewusst offen; die abweichende griechische Überlieferung wird transparent ausgewiesen.
