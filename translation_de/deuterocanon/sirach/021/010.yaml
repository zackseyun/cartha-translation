  text: The way of sinners is paved with stones[b][a], and at its end is the pit of Hades.
translation:
  language: de
  text: 'Der Weg der Sünder ist mit Steinen gepflastert[a], und an seinem Ende liegt die Grube des Hades[b].


    [a] Oder: „ist mit Steinen geebnet“. Das griechische Wort bezeichnet einen Weg, der eben oder glatt gemacht worden ist; zusammen mit „aus Steinen“ liegt das Bild einer Pflasterung nahe.


    [b] „Hades“ bezeichnet hier das Totenreich; auch möglich: „die Unterwelt“. Gemeint ist nicht ausdrücklich die später entwickelte Vorstellung von der Hölle.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ist mit Steinen geebnet“. Das griechische Wort bezeichnet einen Weg, der eben oder glatt gemacht worden ist; zusammen mit „aus Steinen“ liegt das Bild einer Pflasterung nahe.'
    reason: lexical_alternative
  - marker: b
    text: '„Hades“ bezeichnet hier das Totenreich; auch möglich: „die Unterwelt“. Gemeint ist nicht ausdrücklich die später entwickelte Vorstellung von der Hölle.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὁδὸς
  choice: Weg
  rationale: „Weg“ wahrt sowohl das konkrete Straßenbild als auch die übertragene Bedeutung eines Lebenswandels.
- source_word: ἁμαρτωλῶν
  choice: der Sünder
  rationale: Der Genitiv wird knapp und unmittelbar wiedergegeben und bewahrt die moralische Bezeichnung des Ausgangstextes.
- source_word: ὡμαλισμένη ἐκ λίθων
  choice: ist mit Steinen gepflastert
  rationale: Das Partizip bezeichnet etwas Geebnetes oder Glattgemachtes. In Verbindung mit dem Materialausdruck „aus Steinen“ gibt „gepflastert“ das naheliegende Straßenbild in natürlichem Deutsch wieder; die wörtlichere Möglichkeit wird in der Fußnote bewahrt.
- source_word: ἐπʼ ἐσχάτῳ αὐτῆς
  choice: an seinem Ende
  rationale: Die Wendung bezeichnet das äußerste Ende und zugleich bildhaft den Ausgang des Weges.
- source_word: βόθρος
  choice: Grube
  rationale: „Grube“ bewahrt das konkrete Bild einer tiefen Vertiefung und dessen bedrohliche Wirkung.
- source_word: ᾅδου
  choice: des Hades
  rationale: Der griechische Ausdruck benennt das Totenreich. „Hades“ ist textnah und vermeidet eine vorschnelle Gleichsetzung mit „Hölle“.
theological_decisions:
- issue: Wiedergabe von ᾅδου im Bild der Weisheitsliteratur
  choice: des Hades
  alternative: des Totenreichs / der Unterwelt
  rationale: Die Transliteration bewahrt die Begriffswelt des griechischen Textes und lässt offen, wie das Totenreich genauer theologisch zu bestimmen ist, statt eine spätere Höllenvorstellung einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das konkrete Straßenbild bleibt erhalten und trägt zugleich die metaphorische Aussage über Lebensweg und Ausgang. „Doch“ gibt den im griechischen καί kontextuell liegenden scharfen Gegensatz idiomatisch wieder.
