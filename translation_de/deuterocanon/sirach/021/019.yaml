  yaml_path: translation/deuterocanon/sirach/021/019.yaml
  text: Instruction is shackles on the feet of the senseless[a], and like handcuffs on the right hand.
translation:
  language: de
  text: Unterweisung ist für Unverständige wie Fesseln an den Füßen[a] und wie Handschellen an der rechten Hand.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Zucht ist für Unverständige wie Fußfesseln und wie Handschellen an der rechten Hand.“'
    reason: 'Lexikalische Alternative: παιδεία kann neben „Unterweisung“ auch „Zucht“ oder disziplinierende Erziehung bedeuten; πέδαι lässt sich spezifischer als „Fußfesseln“ wiedergeben.'
lexical_decisions:
- source_word: πέδαι ἐν ποσὶν
  choice: Fesseln an den Füßen
  rationale: πέδαι bezeichnet besonders Fußfesseln; die Formulierung bewahrt das konkrete Bild und klingt im modernen Deutschen natürlich.
- source_word: ἀνοήτοις
  choice: für Unverständige
  rationale: ἀνόητος bezeichnet Menschen, denen Einsicht oder Verständnis fehlt. „Unverständige“ entspricht dem Sprachgebrauch der Weisheitsliteratur, ohne den Ausdruck auf mangelnde Intelligenz zu verengen.
- source_word: παιδεία
  choice: Unterweisung
  rationale: παιδεία umfasst Unterweisung, Erziehung und Zucht. „Unterweisung“ gibt hier den pädagogischen Grundsinn wieder; die mögliche disziplinierende Nuance wird in der Fußnote kenntlich gemacht.
- source_word: χειροπέδαι
  choice: Handschellen
  rationale: χειροπέδαι sind Fesseln für die Hände. „Handschellen“ ist die klare, moderne deutsche Entsprechung.
- source_word: ἐπὶ χειρὸς δεξιᾶς
  choice: an der rechten Hand
  rationale: Die Übersetzung erhält ausdrücklich die rechte Hand und den Singular des griechischen Textes.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle Weisheitssprache. Das vorangestellte „für Unverständige“ verdeutlicht idiomatisch, dass Unterweisung von ihnen als belastende Fessel erfahren wird, ohne die Bildspannung aufzulösen.
