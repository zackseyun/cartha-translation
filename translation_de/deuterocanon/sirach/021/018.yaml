translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Parallelismus zwischen Weisheit/Erkenntnis und Tor/Unverständigem bleibt erhalten. Die ungewöhnliche Bild- und Satzlogik des Griechischen wird nicht harmonisiert; Fußnoten markieren echte lexikalische Mehrdeutigkeit.
