  text: Wisdom to a fool is like a ruined house, and the knowledge of one without understanding is words that cannot be examined.
translation:
  language: de
  text: Wie ein zerstörtes Haus ist die Weisheit für einen Toren[a], und die Erkenntnis eines Unverständigen besteht aus Worten, die sich nicht ergründen lassen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wie ein vernichtetes Haus ist die Weisheit bei einem Toren.“'
    reason: Die griechischen Ausdrücke können sowohl die Zerstörung des Hauses als auch die Zuordnung der Weisheit zum Toren unterschiedlich akzentuieren.
  - marker: b
    text: 'Oder: „unergründliche Worte“; gemeint sein können auch unverständliche oder nicht sinnvoll zu prüfende Worte.'
    reason: Das seltene griechische Wort kann sowohl die Undurchdringlichkeit als auch die Unverständlichkeit der Worte hervorheben.
lexical_decisions:
- source_word: οἶκος ἠφανισμένος
  choice: ein zerstörtes Haus
  rationale: ἠφανισμένος bezeichnet etwas, das beseitigt, vernichtet oder dem Verfall preisgegeben wurde. „Zerstörtes Haus“ bewahrt das konkrete Bild und klingt im Deutschen natürlicher als „verschwundenes Haus“.
- source_word: μωρῷ
  choice: für einen Toren
  rationale: 'Der Dativ bezeichnet hier wahrscheinlich die Zuordnung: Weisheit ist im Blick auf einen Toren wie ein zerstörtes Haus. „Für einen Toren“ gibt dies idiomatisch wieder.'
- source_word: σοφία
  choice: Weisheit
  rationale: Die übliche und kontextgemäße Wiedergabe.
- source_word: γνῶσις
  choice: Erkenntnis
  rationale: „Erkenntnis“ hält den Ausdruck von σοφία („Weisheit“) auseinander und wahrt den Parallelismus.
- source_word: ἀσυνέτου
  choice: eines Unverständigen
  rationale: ἀσύνετος bezeichnet jemanden, dem Verständnis oder Einsicht fehlt. „Unverständiger“ wahrt diesen Bezug, ohne das zuvor gebrauchte μωρός ebenfalls mit „Tor“ wiederzugeben.
- source_word: ἀδιεξέταστοι λόγοι
  choice: unergründliche Worte
  rationale: ἀδιεξέταστοι kann Worte bezeichnen, die sich nicht durchforschen, nachvollziehen oder sinnvoll erschließen lassen. „Unergründliche Worte“ ist knapp und natürlich, lässt aber die mögliche Nuance unverständlicher Rede offen.
