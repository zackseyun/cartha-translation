translation:
  language: de
  text: Im Mund der Toren ist ihr Herz[a], doch das Herz der Weisen ist ihr Mund.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sinngemäß kann die Gegenüberstellung auch so verstanden werden: „Der Mund der Weisen ist in ihrem Herzen“ – die Weisen lassen ihr Reden von ihrem Inneren leiten. Der griechische Wortlaut ist knapp und gegensätzlich gebaut; diese Deutung macht einen möglichen Sinn der ungewöhnlichen zweiten Satzhälfte ausdrücklich.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν στόματι
  choice: im Mund
  rationale: 'Die örtliche Wendung bewahrt das konkrete Bild des griechischen Spruches: Was im Herzen der Toren ist, gelangt ohne innere Kontrolle in ihren Mund.'
- source_word: μωρῶν
  choice: der Toren
  rationale: Die substantivische Wiedergabe ist im Deutschen knapp, würdig und für einen Weisheitsspruch natürlich.
- source_word: καρδία
  choice: Herz
  rationale: „Herz“ bewahrt den biblischen Sinn des inneren Menschen einschließlich Denken, Wollen und Gesinnung, statt ihn auf Gefühle zu verengen.
- source_word: σοφῶν
  choice: der Weisen
  rationale: Die substantivische Form entspricht dem griechischen Genitiv Plural und dem prägnanten Stil eines Sprichworts.
- source_word: καρδία δὲ σοφῶν στόμα αὐτῶν
  choice: doch das Herz der Weisen ist ihr Mund
  rationale: Die bewusst knappe, elliptische Gegenüberstellung des überlieferten griechischen Textes bleibt erhalten, ohne ihre schwer deutbare Umkehrung stillschweigend aufzulösen.
theological_decisions:
- issue: Sinn der umgekehrten zweiten Satzhälfte
  choice: Die formale Reihenfolge „das Herz der Weisen ist ihr Mund“ wird im Haupttext bewahrt.
  alternative: „Der Mund der Weisen ist in ihrem Herzen“, im Sinn von innerlich beherrschtem Reden.
  rationale: Der griechische Text ist knapp und in seiner Antithese ungewöhnlich. Die interpretierende Alternative ist plausibel, darf aber die genuine Mehrdeutigkeit des überlieferten Wortlauts nicht im Haupttext ersetzen.
translation_notes:
  register: Moderner standarddeutscher, knapper Spruchstil. Das konkrete Bild von Mund und Herz sowie die auffällige antithetische Wortstellung bleiben erhalten; die Fußnote bietet eine verständliche Deutung, ohne sie zum allein möglichen Sinn zu erklären.
