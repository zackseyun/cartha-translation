    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ φυλάσσων νόμον
  choice: Wer das Gesetz befolgt
  rationale: Das substantivierte Präsenspartizip bezeichnet allgemein jeden, der fortwährend nach dem Gesetz handelt. »Befolgt« gibt φυλάσσω im Zusammenhang mit νόμος natürlich als beachten bzw. halten wieder.
- source_word: κατακρατεῖ
  choice: beherrscht
  rationale: Das Verb kann »festhalten«, »in Besitz behalten« oder »Gewalt über etwas haben« bedeuten. Mit dem Genitiv τοῦ ἐννοήματος bezeichnet »beherrscht« am ehesten die gewonnene Herrschaft über das innere Denken, ohne die möglichen Bedeutungen »festhalten« und »bewahren« auszuschließen.
- source_word: τοῦ ἐννοήματος αὐτοῦ
  choice: sein Denken
  rationale: ἐννόημα kann Gedanke, Absicht, Sinn oder Verstehen bezeichnen. »Sein Denken« ist im Deutschen idiomatisch und bewahrt die Breite zwischen innerem Gedankenvermögen und konkreter Gesinnung; Alternativen werden in der Fußnote genannt.
- source_word: συντέλεια
  choice: Vollendung
  rationale: Das Substantiv bezeichnet Abschluss, Erfüllung oder das Erreichen des vollen Maßes. »Vollendung« bildet diese Ziel- und Abschlussbedeutung knapp ab.
- source_word: τοῦ φόβου Κυρίου
  choice: der Furcht des Herrn
  rationale: Die feste weisheitliche Wendung bezeichnet ehrfürchtige, auf den Herrn gerichtete Furcht. Der Genitiv und die traditionelle, weiterhin verständliche Formulierung bleiben erhalten.
- source_word: σοφία
  choice: Weisheit
  rationale: Die übliche und kontextuell eindeutige Wiedergabe des zentralen weisheitlichen Begriffs.
theological_decisions:
- issue: Verhältnis von Gesetzesbefolgung und ἐννόημα in der knappen Wendung κατακρατεῖ τοῦ ἐννοήματος αὐτοῦ
  choice: Die Befolgung des Gesetzes befähigt den Menschen, sein Denken zu beherrschen.
  alternative: Wer das Gesetz befolgt, hält an seinem Vorsatz fest bzw. bewahrt sein Verständnis.
  rationale: κατακρατέω mit Genitiv kann Herrschaft, Festhalten oder Bewahren ausdrücken, und ἐννόημα kann sowohl Denken als auch Absicht bezeichnen. Die Hauptfassung passt zum weisheitlichen Zusammenhang, während die Fußnote die echte lexikalische Mehrdeutigkeit wahrt.
- issue: Bedeutung von συντέλεια im Verhältnis zur Furcht des Herrn
  choice: Weisheit ist die Vollendung der Furcht des Herrn.
  alternative: Weisheit ist die Erfüllung, der Abschluss oder das Ziel der Furcht des Herrn.
  rationale: Die griechische Nominalkonstruktion bestimmt nicht näher, ob Vollendung eher als Erfüllung, Abschluss oder erreichtes Ziel zu verstehen ist. »Vollendung« bewahrt diese Spannung, ohne einen zeitlichen oder heilsgeschichtlichen Sinn einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Das Gesetz befolgt« ist natürlicher als das wörtlichere »das Gesetz bewacht«; »beherrscht sein Denken« bleibt gehoben, aber allgemein verständlich. Die parallele griechische Satzstruktur und die sachliche weisheitliche Aussageform werden bewahrt.
