  text: Whoever keeps the law controls his understanding[b][a], and the fulfillment of the fear of the Lord is wisdom.
translation:
  language: de
  text: Wer das Gesetz befolgt, beherrscht sein Denken[a], und die Vollendung[b] der Furcht des Herrn ist Weisheit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »hält an seinem Vorsatz fest«, »hat seinen Sinn in der Gewalt« oder »bewahrt sein Verständnis«. Die griechische Wendung ist knapp; ἐννόημα kann Denken, Gedanke, Absicht oder Verständnis bedeuten.'
    reason: lexical_alternative
  - marker: b
