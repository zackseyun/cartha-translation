- from: Die Lippen Fremder werden daran[a] schwer tragen, doch die Worte der Verständigen werden auf die Waage gestellt.[b]
  to: Die Lippen Fremder werden durch diese Dinge[a] beschwert, die Worte der Verständigen aber werden auf die Waage gelegt.[b]
