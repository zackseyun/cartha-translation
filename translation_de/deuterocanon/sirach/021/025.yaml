base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/021/025.yaml
  text: The lips of strangers will be weighed down by these things[b][a], but the words of the wise will be set on a balance.
translation:
  language: de
  text: Die Lippen Fremder werden durch diese Dinge[a] beschwert, die Worte der Verständigen aber werden auf die Waage gelegt.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: »bei diesen Dingen« oder »in diesen Dingen«; die griechische Wendung kann den Bezug zu den zuvor behandelten Dingen ausdrücken, während die Übersetzung hier den naheliegenden kausal-instrumentalen Sinn wiedergibt.'
    reason: lexical_alternative
  - marker: b
    text: Das Bild von der Waage stellt die Worte der Verständigen als abgewogen und maßvoll dar.
    reason: cultural_note
lexical_decisions:
- source_word: χείλη
  choice: Lippen
  rationale: 'Die konkrete Metonymie des griechischen Textes bleibt erhalten: Die Lippen stehen für das Reden, ohne dass das Bild zu »Rede« verflacht wird.'
- source_word: ἀλλοτρίων
  choice: Fremder
  rationale: Die Bezeichnung wahrt die im Griechischen ausgedrückte soziale Distanz, ohne wie »Ausländer« unnötig eine bestimmte ethnische oder staatliche Herkunft anzudeuten.
- source_word: ἐν τούτοις
  choice: daran
  rationale: Die Wendung verweist auf die zuvor behandelten Dinge. »Daran« ist im Deutschen natürlich und lässt neben einer ursächlichen auch eine allgemeinere bezügliche Lesart zu.
- source_word: βαρυνθήσεται
  choice: werden … schwer tragen
  rationale: Die deutsche Wendung gibt das Bild des Schwerwerdens beziehungsweise Belastetseins verständlich wieder und bewahrt zugleich die Verbindung zum anschließenden Bild des Wägens.
- source_word: λόγοι
  choice: Worte
  rationale: »Worte« ist die direkte, im Weisheitsspruch natürliche Entsprechung und erhält die knappe Formulierung.
- source_word: φρονίμων
  choice: der Verständigen
  rationale: Das substantivierte Adjektiv bezeichnet einsichtige, klug urteilende Menschen. »Verständige« gibt diesen Akzent wieder, ohne eine besondere religiöse Gruppe vorauszusetzen.
- source_word: ἐν ζυγῷ
  choice: auf die Waage
  rationale: ζυγός bezeichnet hier im Zusammenhang des Wägens die Waage beziehungsweise den Waagebalken, nicht ein Joch.
- source_word: σταθήσονται
  choice: werden … gestellt
  rationale: Die futurische Form kann im Zusammenhang mit der Waage das Platzieren beziehungsweise Stehen zum Zweck des Wiegens ausdrücken. Die passive deutsche Form bildet diese Bildsprache natürlich ab.
theological_decisions: []
translation_notes:
  register: Knappes, würdiges Sprichwortdeutsch. Die Parallelität von »Lippen« und »Worte« sowie die zusammenhängende Bildwelt von Schwere und Waage bleiben erhalten; »schwer tragen« vermeidet zugleich eine unnatürlich wörtliche Formulierung.
