  source_fidelity: Die Parallelität und die Bilder von Schwere und Waage sind grundsätzlich erhalten. »werden daran schwer tragen« ist jedoch keine idiomatische deutsche Wiedergabe von βαρυνθήσεται und verschiebt das passive Bild des Beschwertwerdens zu einem aktiven Tragen. »durch diese Dinge beschwert werden« gibt den futurischen Passivgebrauch und die in der englischen Auditspur bevorzugte kausal-instrumentale Lesart von ἐν τούτοις klar wieder.
  naturalness: Die Formulierung »Die Lippen Fremder werden daran schwer tragen« wirkt im modernen Standarddeutsch unnatürlich, da gewöhnlich Personen, nicht Lippen, etwas »schwer tragen«. »Die Lippen Fremder werden durch diese Dinge beschwert« ist als bewusste Metonymie verständlich und sprichwörtlich knapp.
  terminology: »Lippen«, »Fremde«, »Worte der Verständigen« und »Waage« sind angemessen. »Verständige« ist für φρόνιμοι eine gute, nicht konfessionell verengte Wahl. »auf die Waage gelegt« ist idiomatischer als »auf die Waage gestellt« und wahrt die Bildsprache.
