base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/021/015.yaml
  text: If an intelligent man hears a wise word[a], he will praise it and add to it; a wasteful man heard it and rejected it[c][b], and he cast it behind his back.
translation:
  language: de
  text: Wenn ein verständiger Mann ein weises Wort[a] hört, wird er es loben und ihm etwas hinzufügen[b]. Ein ausschweifender Mann hörte es, doch es missfiel ihm[c], und er warf es hinter seinen Rücken.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „einen weisen Ausspruch“. Das griechische λόγον σοφόν kann eine geäußerte Weisheit umfassender bezeichnen als ein einzelnes Wort.'
    reason: lexical_alternative
  - marker: b
    text: „Ihm etwas hinzufügen“ meint wahrscheinlich, den weisen Ausspruch weiterzuführen und durch zusätzliche Einsicht zu ergänzen.
    reason: lexical_alternative
  - marker: c
    text: 'Die griechische Wendung ist schwierig. Möglich ist auch: „er lehnte es ab“; wörtlicher beschreibt sie, dass das Gehörte ihm missfiel.'
    reason: alternative_reading
lexical_decisions:
- source_word: λόγον σοφόν
  choice: ein weises Wort
  rationale: λόγος bezeichnet hier eine geäußerte Weisheit und nicht bloß ein einzelnes lexikalisches Wort. „Ein weises Wort“ bewahrt die knappe singularische Form; die Fußnote nennt die weitere Bedeutungsmöglichkeit.
- source_word: ἐπιστήμων
  choice: ein verständiger Mann
  rationale: Das Wort bezeichnet einen Menschen mit Einsicht oder Kenntnis. „Verständig“ ist im Deutschen natürlich und bildet den sprichwörtlichen Gegensatz zum ausschweifenden Hörer ab.
- source_word: αἰνέσει αὐτόν
  choice: wird er es loben
  rationale: Die Zukunftsform und die positive Würdigung des weisen Wortes werden unmittelbar wiedergegeben.
- source_word: ἐπʼ αὐτὸν προσθήσει
  choice: wird ihm etwas hinzufügen
  rationale: Die Formulierung bleibt nahe am griechischen Bild und lässt offen, worin die Ergänzung besteht; wahrscheinlich ist ein weiterführender eigener Einsichtsbeitrag gemeint.
- source_word: ὁ σπαταλῶν
  choice: ein ausschweifender Mann
  rationale: Das Partizip bezeichnet jemanden, der üppig, zügellos oder verschwenderisch lebt. „Ausschweifend“ bewahrt diese sittliche Breite besser als das vorwiegend wirtschaftlich verstandene „verschwenderisch“.
- source_word: ἀπῄρεσεν αὐτῷ
  choice: es missfiel ihm
  rationale: 'Die schwierige griechische Wendung wird in ihrer relationalen Form bewahrt: Das Gehörte löst bei ihm Missfallen aus. Die Übersetzung vermeidet es, die Aussage vorschnell auf einen rein willentlichen Akt des Ablehnens festzulegen.'
- source_word: ἀπέστρεψεν αὐτοῦ ὀπίσω τοῦ νώτου αὐτοῦ
  choice: er warf es hinter seinen Rücken
  rationale: Die anschauliche Geste drückt Missachtung und Verwerfung aus. Die deutsche Form bewahrt sowohl das aktive Wegtun als auch das Bild des Rückens.
theological_decisions:
- issue: Generisches Maskulinum im Weisheitsspruch
  choice: „ein verständiger Mann“ und „ein ausschweifender Mann“
  alternative: „ein verständiger Mensch“ und „ein ausschweifender Mensch“
  rationale: Der griechische Text verwendet in beiden Gegenüberstellungen maskuline Singularformen. Die Übersetzung erhält diese repräsentative Form, ohne ihr eine über den Text hinausgehende lehrmäßige Bedeutung zu geben.
- issue: Art der negativen Reaktion auf das Weisheitswort
  choice: „es missfiel ihm“
  alternative: „er lehnte es ab“
  rationale: Die griechische Wendung ist semantisch schwierig. „Es missfiel ihm“ erhält die Spannung zwischen innerer negativer Reaktion und der anschließenden sichtbaren Geste des Wegwerfens, statt beide zu einem einzigen Ablehnungsakt zu verschmelzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer sprichwörtlicher Gegenüberstellung. Der Tempuswechsel des Griechischen — Zukunft im ersten Satz, Vergangenheit im zweiten — bleibt erhalten. Das konkrete Bild des Hinter-den-Rücken-Werfens wird nicht durch eine bloße abstrakte Umschreibung ersetzt.
