translation:
  language: de
  text: Flieh vor der Sünde wie vor einer Schlange[a]; denn wenn du ihr nahe kommst, wird sie dich beißen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Flieh vor der Sünde wie vor dem Angesicht einer Schlange.“ Die Wendung bezeichnet die unmittelbare Gegenüberstellung mit der Schlange.'
    reason: lexical_alternative
  - marker: b
    text: Die an dieser Stelle vorgelegte hebräische Zeile aus den Kairoer Geniza-Handschriften stimmt nicht mit dem griechischen Wortlaut dieses Verses überein und scheint versetzt oder falsch zugeordnet zu sein. Die Übersetzung folgt deshalb hier dem griechischen Zeugen.
    reason: textual_variant
lexical_decisions:
- source_word: φεῦγε
  choice: Flieh
  rationale: Der griechische Imperativ bezeichnet ein entschiedenes Fliehen und bewahrt die Dringlichkeit der Warnung.
- source_word: ἁμαρτίας
  choice: vor der Sünde
  rationale: „Sünde“ gibt die moralische und theologische Bedeutung von ἁμαρτία präzise und im Deutschen idiomatisch wieder.
- source_word: ὡς ἀπὸ προσώπου ὄφεως
  choice: wie vor einer Schlange
  rationale: Die natürliche deutsche Wendung gibt das Bild einer unmittelbaren Begegnung wieder; das wörtliche „vor dem Angesicht einer Schlange“ wäre unnötig sperrig und wird in der Fußnote dokumentiert.
- source_word: ἐὰν ... προσέλθῃς
  choice: wenn du ihr nahe kommst
  rationale: Die Formulierung gibt das Annähern konkret und natürlich wieder und erhält den Bezug auf die als Schlange dargestellte Sünde.
- source_word: δήξεταί σε
  choice: wird sie dich beißen
  rationale: Das Verb bezeichnet ausdrücklich das Beißen und bewahrt so die konkrete Konsequenz des Schlangenbildes.
theological_decisions:
- issue: Textgrundlage bei deutlicher Abweichung zwischen dem zugeordneten hebräischen Text und der griechischen Überlieferung
  choice: Der Haupttext folgt für diesen Vers dem griechischen Zeugen.
  alternative: 'Den vorgelegten hebräischen Satz als Sirach 21,2 übersetzen: „Ein Fürst, der an Trinkhäuser gewöhnt ist, der einen Sitz auf den Höhen der Stadt errichtet.“'
  rationale: Der angegebene hebräische Satz entspricht inhaltlich nicht Sirach 21,2 in der griechischen Überlieferung und ist offenbar versetzt oder falsch zugeordnet. Daher dient der griechische Paralleltext als Übersetzungsgrundlage; die textkritische Unsicherheit wird ausdrücklich vermerkt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit direkter Anrede. Die knappe Warnung und das anschauliche Schlangenbild bleiben erhalten; eine unnatürlich wörtliche Wiedergabe von ἀπὸ προσώπου wird vermieden und in der Fußnote erläutert.
