  text: The knowledge of a wise man will increase like a flood[b][a], and his counsel is like a spring of life.
translation:
  language: de
  text: Die Erkenntnis eines Weisen wird sich wie eine Flut mehren, und sein Rat ist wie eine Quelle des Lebens.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γνῶσις
  choice: Erkenntnis
  rationale: „Erkenntnis“ gibt γνῶσις im Weisheitskontext treffend wieder und bezeichnet erworbenes Wissen mit Einsicht, ohne den Begriff auf bloße Klugheit zu verengen.
- source_word: σοφοῦ
  choice: eines Weisen
  rationale: Der griechische Genitiv ist maskulin und singular. „Eines Weisen“ bewahrt die Form eines einzelnen, exemplarisch dargestellten weisen Mannes.
- source_word: ὡς κατακλυσμός
  choice: wie eine Flut
  rationale: κατακλυσμός bezeichnet eine große Wasserflut. „Flut“ ist bildkräftig, verständlich und weniger schwerfällig als „Überschwemmung“.
- source_word: πληθυνθήσεται
  choice: wird sich mehren
  rationale: Die mediale beziehungsweise passive Zukunftsform beschreibt eine Zunahme. „Wird sich mehren“ bewahrt diesen Sinn und den gehobenen Ton des Weisheitsspruchs.
- source_word: βουλή
  choice: Rat
  rationale: βουλή meint hier den Rat beziehungsweise die beratende Einsicht des Weisen. „Rat“ ist im Deutschen klar und passt zum lebensspendenden Vergleich.
- source_word: πηγὴ ζωῆς
  choice: Quelle des Lebens
  rationale: πηγή bezeichnet eine Quelle oder einen Brunnen. „Quelle des Lebens“ erhält das konkrete Bild und klingt im modernen Deutschen natürlich.
theological_decisions:
- issue: Geschlecht und Numerus von σοφοῦ
  choice: eines Weisen
  alternative: der Weisen; eines weisen Menschen
  rationale: Die Übersetzung bewahrt den grammatisch maskulinen Singular des Griechischen und damit die Darstellung eines einzelnen exemplarischen Weisen, ohne ihn zu einer Gruppe oder abstrakten Kategorie zu machen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die im zweiten Satzteil des Griechischen ausgelassene Kopula wird zur natürlichen deutschen Satzbildung mit „wird … sein“ ergänzt; die parallele Zukunftsaussage bleibt dadurch deutlich.
