  yaml_path: translation/deuterocanon/sirach/021/007.yaml
  text: A man mighty in tongue is known from afar[b][a], but one with understanding knows when he slips.
translation:
  language: de
  text: Ein Mann, der mächtig im Reden ist, ist von Weitem bekannt[a]; ein Verständiger aber erkennt ihn, wenn er ins Straucheln gerät[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ist aus der Ferne zu erkennen“. Das Griechische kann sowohl auffälliges Reden als auch einen Ruf bezeichnen, der ihm vorauseilt.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich auch: „wenn er ausgleitet“. Das griechische Bild kann tatsächliches Stolpern oder übertragen einen Fehler bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γνωστὸς μακρόθεν
  choice: schon von Weitem bekannt
  rationale: Die knappe griechische Wendung bezeichnet Erkennbarkeit oder Bekanntheit aus der Ferne. Die deutsche Fassung bewahrt sowohl die räumliche Vorstellung als auch die mögliche Bedeutung eines vorauseilenden Rufs.
- source_word: ὁ δυνατὸς ἐν γλώσσῃ
  choice: ein Mann, der mächtig im Reden ist
  rationale: δυνατός bezeichnet Stärke oder Macht, ἐν γλώσσῃ wörtlich „mit/in der Zunge“ und idiomatisch die Rede. Die Formulierung erhält das kraftvolle Bild, klingt aber in modernem Deutsch natürlich.
- source_word: ὁ δὲ νοήμων
  choice: ein Verständiger aber
  rationale: νοήμων bezeichnet einen verständigen, einsichtigen oder urteilsfähigen Menschen. „Ein Verständiger“ bildet einen klaren Gegensatz zur bloßen Macht der Rede.
- source_word: οἶδεν
  choice: erkennt ihn
  rationale: οἶδα kann hier das Erkennen oder Durchschauen einer Person ausdrücken. Das Akkusativpronomen αὐτόν wird ausdrücklich mit „ihn“ wiedergegeben und auf den sprachmächtigen Mann bezogen.
- source_word: ἐν τῷ ὀλισθάνειν αὐτόν
  choice: wenn er ins Straucheln gerät
  rationale: Die Konstruktion ἐν mit substantiviertem Infinitiv hat zeitlichen Sinn. ὀλισθάνειν bezeichnet ein Ausgleiten oder Straucheln und kann sowohl ein tatsächliches Stolpern als auch einen Fehler im Reden oder Handeln meinen.
theological_decisions:
- issue: Bezug des Pronomens αὐτόν
  choice: Der Verständige erkennt den sprachmächtigen Mann, wenn dieser ins Straucheln gerät.
  alternative: Der Verständige weiß, wann er selbst ins Straucheln gerät.
  rationale: αὐτόν ist der Akkusativ als Subjekt des Infinitivs und verweist am natürlichsten auf den zuvor genannten sprachmächtigen Mann. Die ausdrückliche Wiedergabe mit „ihn“ folgt der griechischen Syntax und vermeidet eine unbegründete Verschiebung auf den Verständigen.
- issue: Bildliches oder wörtliches Straucheln
  choice: Das Bild „ins Straucheln geraten“ bleibt offen.
  alternative: Die Stelle ausdrücklich als sprachlichen oder moralischen Fehler deuten.
  rationale: Das griechische ὀλισθάνειν lässt sowohl körperliches Ausgleiten als auch übertragenes Fehlgehen zu. Die Übersetzung entscheidet diese Spannung nicht vorschnell.
- issue: Generisches Maskulinum
  choice: „Ein Mann“ und „ein Verständiger“ geben die maskulinen Singularformen repräsentativ wieder.
  alternative: Vollständig geschlechtsneutrale Personenbezeichnungen verwenden.
  rationale: Der griechische Text verwendet maskuline Singularformen. Die deutsche Fassung bildet diese grammatische Gestalt ab, ohne daraus eine lehrmäßige Beschränkung auf Männer abzuleiten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Rede-Metaphorik bleibt erhalten, während die griechische Syntax mit dem ausdrücklichen Objekt „ihn“ klar wiedergegeben wird. Die Semikolon-Struktur bewahrt den pointierten Gegensatz beider Satzhälften.
