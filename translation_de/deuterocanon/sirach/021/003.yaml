base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/021/003.yaml
  text: Like one who grasps a woman’s private parts and urinates[b][a], so is one who suddenly enters his neighbor’s house.
translation:
  language: de
  text: Wie einer, der eine Frau an den Geschlechtsteilen packt und uriniert,[a][b] so ist einer, der plötzlich das Haus seines Nächsten betritt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der hebräische Text bietet hier einen derben körperlichen Spruch. Das mit „Geschlechtsteilen“ wiedergegebene Wort kann im Hebräischen auch anderes bedeuten, doch in diesem Zusammenhang passt die anstößige Bedeutung am besten.
    reason: lexical_alternative
  - marker: b
    text: 'Der griechische Text hat hier eine ganz andere Zeile: „Ihre Zähne sind Zähne eines Löwen, die Menschenleben vernichten.“ Offenbar liegt ihm eine erheblich abweichende Textform zugrunde.'
    reason: textual_variant
lexical_decisions:
- source_word: הָאוֹחֵז
  choice: wie einer, der … packt
  rationale: Das Partizip von אחז bezeichnet ein konkretes Ergreifen oder Festhalten. „Packt“ bewahrt die anschauliche, bewusst anstößige Bildsprache des Spruchs.
- source_word: בָּאַמָה
  choice: eine Frau an den Geschlechtsteilen
  rationale: Das Wort kann unter anderem „Unterarm“ oder „Elle“ bedeuten; diese Bedeutungen passen hier jedoch kaum zur körperlich-derben Verbindung mit dem Urinieren. Die gewählte Formulierung gibt den wahrscheinlich obszönen Sinn deutlich, aber nicht vulgär wieder.
- source_word: וּמַשְׁתִּין מָיִם
  choice: und uriniert
  rationale: Die hebräische Wendung lautet wörtlich etwa „und lässt Wasser“. „Uriniert“ ist im modernen Deutschen idiomatisch, präzise und körperlich deutlich, ohne umgangssprachlich-vulgär zu wirken.
- source_word: וְהַנִּכְנָס
  choice: so ist einer, der … betritt
  rationale: Im Hebräischen sind die beiden Partizipialgruppen mit „und“ verbunden. Die ausdrückliche Vergleichsform „wie … so“ macht die sprichwörtliche Beziehung im Deutschen verständlich, ohne den Sinn festzulegen, der über den Vergleich hinausgeht.
- source_word: לְבֵית חֲבֵרוֹ
  choice: das Haus seines Nächsten
  rationale: חבר bezeichnet einen sozial nahestehenden Menschen, etwa Gefährten, Mitmenschen oder Nachbarn. „Nächster“ ist für Weisheitsliteratur passend und setzt keine enge Freundschaft voraus.
- source_word: פִּתְאוֹם
  choice: plötzlich
  rationale: Das Adverb bezeichnet ein plötzliches oder unerwartetes Geschehen. „Plötzlich“ gibt die unangekündigte, übergriffige Art des Eintretens knapp wieder.
- source_word: ὀδόντες λέοντος οἱ ὀδόντες αὐτῆς, ἀναιροῦντες ψυχὰς ἀνθρώπων
  choice: nur als textkritische Kontrolllesart verwendet
  rationale: Der griechische Text weicht inhaltlich grundlegend ab. Da ein hebräischer Text mit hoher Sicherheit vorliegt, wird dieser im Haupttext übersetzt und die griechische Fassung in einer Fußnote dokumentiert.
theological_decisions:
- issue: Wahl des Grundtextes bei stark voneinander abweichender hebräischer und griechischer Überlieferung
  choice: Der erhaltene hebräische Spruch steht im Haupttext; die griechische Fassung wird als Textvariante in einer Fußnote wiedergegeben.
  alternative: Die griechische Zeile über Löwenzähne als Haupttext übersetzen oder beide Fassungen miteinander verbinden.
  rationale: Die beiden Überlieferungen unterscheiden sich nicht nur im Wortlaut, sondern im gesamten Inhalt. Eine Harmonisierung würde diesen Befund verdecken. Da hier ein hebräischer Text mit hoher Sicherheit erhalten ist, erhält er den Vorrang; die bedeutsame griechische Abweichung bleibt transparent.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst unverhüllter, aber nicht vulgärer Wiedergabe der derben Bildsprache. Die syntaktische Vergleichsform „wie … so“ verdeutlicht den sprichwörtlichen Aufbau. Beide Fußnotenzeichen stehen an der einschlägigen Stelle im Haupttext.
