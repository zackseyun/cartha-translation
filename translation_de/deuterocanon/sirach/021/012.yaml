  text: He who is not shrewd will not be instructed;[a]
translation:
  language: de
  text: Wer nicht schlau ist, wird nicht belehrt werden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „klug“ oder „gewitzt“; das griechische Wort kann in anderen Zusammenhängen auch negativ „listig“ oder „verschlagen“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ παιδευθήσεται
  choice: wird nicht belehrt werden
  rationale: Das Futur Passiv von παιδεύω bezeichnet hier das Unterweisen, Erziehen oder Zurechtweisen. „Belehrt werden“ wahrt den passiven Satzbau und lässt offen, ob vor allem Lehre oder korrigierende Unterweisung gemeint ist.
- source_word: ὃς
  choice: Wer
  rationale: Das relative ὃς bezeichnet verallgemeinernd eine Person. Das deutsche „Wer“ gibt dies natürlich und ohne unnötige Festlegung auf ein grammatisches Geschlecht wieder.
- source_word: οὐκ ἔστιν
  choice: nicht … ist
  rationale: Die einfache kopulative Verneinung wird unmittelbar wiedergegeben.
- source_word: πανοῦργος
  choice: schlau
  rationale: πανοῦργος kann je nach Zusammenhang positiv oder neutral „klug, gewitzt“ und andernorts negativ „listig, verschlagen“ bedeuten. „Schlau“ bewahrt im Deutschen diese mögliche Spannweite besser als das eindeutig positive „weise“ oder das deutlich negative „verschlagen“.
theological_decisions:
- issue: Moralische Wertung von πανοῦργος in einem Weisheitsspruch
  choice: Relativ neutral als „schlau“ wiedergeben
  alternative: „klug“, „gewitzt“ oder negativ „listig“
  rationale: Da die genannte Eigenschaft hier mit der Möglichkeit verbunden ist, belehrt zu werden, liegt eine neutral-positive Bedeutung nahe. Zugleich soll die auch negativ mögliche Färbung des griechischen Wortes nicht völlig verdeckt werden; „schlau“ und die Fußnote erhalten diese Spannung.
translation_notes:
  register: Kurzer, sentenzartiger Weisheitsspruch in modernem, würdigem Standarddeutsch. Die passive Form des Griechischen bleibt erhalten; „schlau“ ist alltagssprachlich verständlich und zugleich semantisch offen genug für die Spannweite von πανοῦργος.
