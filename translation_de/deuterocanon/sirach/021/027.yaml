  text: When the ungodly curses the Adversary[a], he curses his own soul.
translation:
  language: de
  text: Wenn der Gottlose den Widersacher[a] verflucht, verflucht er seine eigene Seele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Satan«. Im Griechischen steht satanas, ein aus dem Semitischen übernommener Ausdruck mit der Bedeutung »Widersacher«.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν τῷ καταρᾶσθαι
  choice: Wenn … verflucht
  rationale: Die Verbindung ἐν mit dem substantivierten Infinitiv bezeichnet hier einen zeitlichen Umstand. Die Wiedergabe mit „Wenn“ ist im Deutschen natürlich und bewahrt den sprichwortartigen Charakter.
- source_word: ἀσεβῆ
  choice: der Gottlose
  rationale: Das substantivisch gebrauchte Adjektiv bezeichnet einen einzelnen Menschen als allgemeingültigen Typus. „Der Gottlose“ gibt den moralisch-religiösen Sinn prägnant wieder.
- source_word: τὸν σατανᾶ
  choice: den Widersacher
  rationale: σατανᾶς gibt einen semitischen Ausdruck für einen Widersacher oder Ankläger wieder. „Widersacher“ bewahrt diese Wortbedeutung; die Großschreibung weist zugleich auf einen persönlichen Bezug hin, ohne die mögliche Namenslesart festzuschreiben.
- source_word: αὐτὸς
  choice: er
  rationale: Das Pronomen nimmt das Subjekt wieder auf und trägt eine leichte Hervorhebung. Im Deutschen genügt hier das natürliche „er“.
- source_word: καταρᾶται
  choice: verflucht
  rationale: Dasselbe Verb steht in beiden Satzhälften. Die identische Wiedergabe erhält die pointierte Wiederholung des griechischen Textes.
- source_word: τὴν ἑαυτοῦ ψυχήν
  choice: seine eigene Seele
  rationale: ψυχή kann auch „Leben“ oder „Selbst“ bezeichnen. „Seele“ bewahrt hier die moralisch-geistliche Tragweite, während „eigene“ das rückbezügliche ἑαυτοῦ ausdrücklich wiedergibt.
theological_decisions:
- issue: Ob σατανᾶ als Titel beziehungsweise Gattungsbezeichnung oder als Eigenname wiederzugeben ist
  choice: den Widersacher
  alternative: Satan
  rationale: Der griechische Ausdruck bewahrt die Bedeutung „Widersacher“, kann in diesem Zusammenhang jedoch auch als Name verstanden werden. Der Haupttext übersetzt die Wortbedeutung; die geläufige Namensform bleibt in der Fußnote erhalten.
translation_notes:
  register: Knappe, würdige und sprichwortartige Standardsprache. Die Wiederholung von „verflucht“ bildet die rhetorische Zuspitzung des griechischen Satzes ab.
