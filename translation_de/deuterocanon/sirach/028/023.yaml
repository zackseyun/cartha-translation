base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/028/023.yaml
  text: Those who forsake the Lord will fall into it[a], and it will burn among them and will certainly not be quenched; it will be sent against them like a lion[c][b], and like a leopard it will ravage them.
translation:
  language: de
  text: Die den Herrn verlassen, werden in sie hineinfallen[a], und sie wird unter ihnen auflodern und gewiss nicht erlöschen; sie wird gegen sie ausgesandt werden wie ein Löwe und sie wie ein Leopard verwüsten[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Sie“ bezieht sich auf die im vorausgehenden Zusammenhang beschriebene verderbliche Zunge beziehungsweise schädliche Rede.
    reason: cross_reference
  - marker: b
    text: 'Oder: „sie wird in ihnen entfacht werden“; das Griechische kann statt „unter ihnen“ auch einen innerlichen Sinn haben. Für „Leopard“ ist auch die Wiedergabe „Panther“ möglich.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ καταλείποντες Κύριον
  choice: Die den Herrn verlassen
  rationale: καταλείπω bezeichnet hier das Verlassen oder Aufgeben; zusammen mit κύριος gibt „den Herrn verlassen“ die religiöse Beziehung natürlich und ohne zusätzliche konfessionelle Deutung wieder.
- source_word: ἐμπεσοῦνται εἰς αὐτήν
  choice: werden in sie hineinfallen
  rationale: Die Wendung bedeutet wörtlich „in sie hineinfallen“. Das feminine Pronomen bleibt als „sie“ erhalten und verweist auf die im vorausgehenden Zusammenhang beschriebene verderbliche Zunge beziehungsweise Rede.
- source_word: ἐν αὐτοῖς ἐκκαήσεται
  choice: sie wird unter ihnen auflodern
  rationale: ἐκκαίω bezeichnet das Entzünden oder heftige Brennen. „Unter ihnen auflodern“ wahrt die räumliche Mehrdeutigkeit von ἐν αὐτοῖς besser als eine ausschließlich innerliche Deutung.
- source_word: οὐ μὴ σβεσθῇ
  choice: gewiss nicht erlöschen
  rationale: Die Verbindung οὐ μή mit dem Konjunktiv drückt eine nachdrückliche Verneinung aus; „gewiss nicht“ bildet diese Verstärkung ab.
- source_word: ἐξαποσταλήσεται ἐπʼ αὐτοῖς
  choice: sie wird gegen sie ausgesandt werden
  rationale: Das Passiv von ἐξαποστέλλω bedeutet „aussenden“; ἐπί trägt im Zusammenhang feindliche Richtung, daher „gegen sie“.
- source_word: ὡς λέων
  choice: wie ein Löwe
  rationale: Direkte und natürliche Wiedergabe des Vergleichs.
- source_word: ὡς πάρδαλις
  choice: wie ein Leopard
  rationale: πάρδαλις bezeichnet eine gefleckte Großkatze, gewöhnlich einen Leoparden; „Leopard“ ist im modernen Deutsch die klarste Entsprechung.
- source_word: λυμανεῖται αὐτούς
  choice: sie wie ein Leopard verwüsten
  rationale: λυμαίνομαι bezeichnet schwere Schädigung, Zerstörung oder Verwüstung. „Verwüsten“ bewahrt die Heftigkeit des Raubtierbildes, ohne den Vorgang unnötig auf „zerfleischen“ einzuengen.
theological_decisions:
- issue: Bezugswort des femininen Pronomens αὐτήν und des unausgesprochenen Subjekts
  choice: Das feminine Pronomen wird mit „sie“ wiedergegeben und auf die verderbliche Zunge beziehungsweise Rede des unmittelbaren Zusammenhangs bezogen.
  alternative: Das Bezugswort im Haupttext ausdrücklich als „die Zunge“ ergänzen oder unpersönlich mit „es“ wiedergeben.
  rationale: Der griechische Vers wiederholt das Bezugswort nicht. Das deutsche feminine Pronomen bewahrt die grammatische Rückbindung und die Mehrdeutigkeit, ohne eine im Vers selbst fehlende Erläuterung in den Haupttext einzutragen.
- issue: Lokale oder innerliche Bedeutung von ἐν αὐτοῖς
  choice: „unter ihnen“
  alternative: „in ihnen“
  rationale: Beides ist sprachlich möglich. „Unter ihnen“ lässt das Bild eines sich ausbreitenden Feuers hervortreten, ohne eine ausschließlich innere Wirkung festzulegen; die Alternative wird in der Fußnote dokumentiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur folgt dem griechischen Bildgang eng, bleibt aber idiomatisch. Das feminine Pronomen wird bewusst beibehalten; die wiederholten Formen von „sie“ sind referenziell eindeutig, obwohl beim letzten Teilsatz die deutsche Wortstellung zur Klarheit angepasst wurde.
