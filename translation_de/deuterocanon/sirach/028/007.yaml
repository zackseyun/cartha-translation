  yaml_path: translation/deuterocanon/sirach/028/007.yaml
  text: Remember the commandments[a], and do not be angry with your neighbor; remember the covenant of the Most High, and overlook ignorance.
translation:
  language: de
  text: Denk an die Gebote und sei deinem Nächsten nicht böse; denk an den Bund des Höchsten und sieh über Unwissenheit hinweg.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „geh über eine unwissentliche Verfehlung hinweg“. Das griechische Wort bezeichnet wörtlich Unwissenheit; gemeint sein kann eine Verfehlung, die aus Unwissenheit geschieht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μνήσθητι
  choice: Denk an
  rationale: Der Aoristimperativ fordert zur bewussten Erinnerung auf. „Denk an“ ist direkt, natürlich und trägt im Deutschen beide nachfolgenden Objekte; vor „den Bund“ wird die Wendung zur Klarheit wiederholt.
- source_word: ἐντολῶν
  choice: die Gebote
  rationale: „Gebote“ bewahrt den religiös-ethischen Gehalt des griechischen Ausdrucks, ohne den im Ausgangstext nicht ausdrücklich genannten Zusatz „des Gesetzes“ einzuführen.
- source_word: μὴ μηνίσῃς
  choice: sei … nicht böse
  rationale: μηνίω bezeichnet Zorn oder anhaltenden Unmut. „Jemandem böse sein“ entspricht der Dativkonstruktion, klingt in modernem Deutsch natürlich und passt zur Aufforderung, Verfehlungen nachzusehen.
- source_word: τῷ πλησίον
  choice: deinem Nächsten
  rationale: In ethischem Zusammenhang bezeichnet πλησίον den Mitmenschen als „Nächsten“. Der Dativ wird idiomatisch mit „jemandem böse sein“ verbunden.
- source_word: διαθήκην Ὑψίστου
  choice: den Bund des Höchsten
  rationale: διαθήκη ist im biblischen Griechisch „Bund“. Der Genitiv und der Gottesname werden formal gewahrt; „mit dem Höchsten“ wäre bereits eine Deutung der Beziehung.
- source_word: πάριδε
  choice: sieh … hinweg
  rationale: Der Imperativ bezeichnet das Vorübersehen beziehungsweise Nachsehen. „Über etwas hinwegsehen“ bringt die ethische Aufforderung zur Nachsicht zum Ausdruck, ohne die Sache für nicht vorhanden zu erklären.
- source_word: ἄγνοιαν
  choice: Unwissenheit
  rationale: Das Substantiv bedeutet zunächst „Unwissenheit“ oder fehlende Kenntnis. Eine aus Unwissenheit begangene Verfehlung liegt im Zusammenhang nahe, wird aber nicht in den Haupttext hineingedeutet.
theological_decisions:
- issue: Ellipse beim zweiten Objekt des Erinnerns
  choice: „Denk an“ wird vor „den Bund des Höchsten“ wiederholt.
  alternative: 'Die griechische Ellipse als verblosen Ausdruck stehen lassen: „und den Bund des Höchsten“'
  rationale: Die Wiederholung macht den syntaktischen Bezug im Deutschen eindeutig, ohne einen neuen Gedanken hinzuzufügen.
- issue: Bedeutungsumfang von ἄγνοιαν
  choice: Im Haupttext bleibt das abstrakte „Unwissenheit“ erhalten.
  alternative: 'Konkretisierend: „eine aus Unwissenheit begangene Verfehlung“'
  rationale: Der Zusammenhang legt eine unwissentliche Verfehlung nahe, doch der griechische Wortlaut nennt nur „Unwissenheit“. Die Fußnote erläutert die mögliche kontextuelle Bedeutung, ohne sie festzuschreiben.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit unmittelbarer Mahnrede. „Denk an“ ist bewusst idiomatischer als „Erinnere dich an“, während „Bund des Höchsten“ die biblische Begrifflichkeit wahrt. Der Fußnotenmarker steht unmittelbar nach der einschlägigen Wendung.
