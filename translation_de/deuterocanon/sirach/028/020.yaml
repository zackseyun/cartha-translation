  text: For her yoke is an iron yoke[a], and her bonds are bronze bonds.
translation:
  language: de
  text: Denn ihr Joch ist ein eisernes Joch, und ihre Fesseln sind Fesseln aus Bronze.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ζυγός
  choice: Joch
  rationale: Das konkrete Bild eines Jochs wird bewahrt; eine Verallgemeinerung zu „Last“ würde die Vorstellung bedrückender Unterwerfung abschwächen.
- source_word: σιδηροῦς
  choice: eisern
  rationale: Das Adjektiv bezeichnet ein Joch aus Eisen. „Ein eisernes Joch“ ist im Deutschen knapp, natürlich und bildkräftig.
- source_word: δεσμοί
  choice: Fesseln
  rationale: Der Ausdruck bezeichnet bindende Einschränkungen, ohne zwingend eine bestimmte Form wie Ketten festzulegen. „Fesseln“ erhält dieses Bedeutungsspektrum.
- source_word: χαλκεῖοι
  choice: aus Bronze
  rationale: Das Adjektiv bezeichnet aus Bronze beziehungsweise Kupfer gefertigtes Material. „Aus Bronze“ ist im modernen Deutsch eindeutig und vermeidet das altertümliche „ehern“.
- source_word: αὐτῆς
  choice: ihr / ihre
  rationale: Die wiederholten femininen Pronomen werden entsprechend dem griechischen Text beibehalten. Im deutschen Zusammenhang beziehen sie sich natürlich auf die feminine „Zunge“ und erhalten zugleich deren Personifizierung.
theological_decisions:
- issue: Beibehaltung der femininen Personifizierung
  choice: „ihr“ und „ihre“ verwenden
  alternative: Die Bezüge durch „dieses“ oder durch eine Wiederholung des Bezugswortes entpersonalisieren
  rationale: Das Griechische wiederholt αὐτῆς und stellt die schädliche Zunge beziehungsweise Rede als bedrückende Macht dar. Die feminine Form bewahrt die literarische Wirkung, ohne eine zusätzliche Lehraussage einzuführen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Wiederholung von „Joch“ und „Fesseln“ folgt bewusst der pointierten Struktur des griechischen Spruchs; „aus Bronze“ ist gegenüber dem heute altertümlichen „ehern“ verständlicher.
