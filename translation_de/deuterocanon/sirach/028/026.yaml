  text: Take care lest you slip by it, lest you fall before one lying in wait.
translation:
  language: de
  text: Gib acht, dass du nicht durch sie[a] ausgleitest und vor einem, der dir auflauert, zu Fall kommst.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: in ihr; gemeint ist im Zusammenhang wahrscheinlich die Zunge.'
    reason: Das feminine αὐτῇ hat einen kontextabhängigen Bezug. Die Übersetzung „durch sie“ gibt die im Zusammenhang naheliegende instrumentale beziehungsweise kausale Nuance idiomatisch wieder; die wörtlich-räumliche Möglichkeit bleibt vermerkt.
lexical_decisions:
- source_word: πρόσεχε μὴ πῶς
  choice: Gib acht, dass du nicht
  rationale: Gibt die eindringliche Warnung idiomatisch und klar wieder; μή πως bezeichnet hier eine zu vermeidende Möglichkeit.
- source_word: ὀλισθήσῃς
  choice: ausgleitest
  rationale: Bewahrt das griechische Bild des Ausgleitens, das zugleich einen sprachlichen Fehltritt andeuten kann.
- source_word: ἐν αὐτῇ
  choice: mit ihr
  rationale: Das feminine Pronomen verweist im Zusammenhang wahrscheinlich auf die Zunge; ἐν kann hier instrumental verstanden werden. Die wörtlich-räumliche Möglichkeit wird in der Fußnote offengehalten.
- source_word: κατέναντι ἐνεδρεύοντος
  choice: vor einem, der dir auflauert
  rationale: Gibt sowohl die Gegenüberstellung durch κατέναντι als auch das feindliche Auflauern des substantivierten Partizips natürlich wieder.
theological_decisions:
- issue: Bezug und Funktion von ἐν αὐτῇ
  choice: „mit ihr“ mit erläuternder Fußnote
  alternative: „in ihr“ oder „durch sie“
  rationale: Der feminine Rückverweis gilt wahrscheinlich der Zunge. Das instrumentale „mit ihr“ ist im Deutschen verständlich, ohne die im Griechischen mögliche räumliche Lesart zu verschweigen.
translation_notes:
  register: Moderne, würdige Warnsprache. Das Bild des Ausgleitens und Zu-Fall-Kommens bleibt erhalten; „dir“ macht die im Auflauern liegende Zielrichtung im Deutschen natürlich deutlich.
