  language: de
  text: Halte dich von Streit fern, und du wirst weniger Sünden begehen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀπόσχου
  choice: Halte dich … fern
  rationale: Der Aorist-Medium-Imperativ fordert dazu auf, sich bewusst von etwas zurückzuhalten beziehungsweise fernzuhalten. Die Formulierung ist im modernen Deutsch natürlich und gibt den auffordernden Charakter klar wieder.
- source_word: μάχης
  choice: Streit
  rationale: μάχη kann Kampf, Auseinandersetzung oder Streit bezeichnen. Im weisheitlichen Zusammenhang erfasst „Streit“ den zwischenmenschlichen und moralischen Sinn, ohne die Aussage auf körperliche Gewalt zu beschränken.
- source_word: ἐλαττώσεις
  choice: wirst du … vermindern
  rationale: Das Futur bezeichnet die Folge des Fernbleibens vom Streit. „Vermindern“ bewahrt die aktive Aussage des griechischen Verbs und seine Verbindung mit dem Akkusativobjekt.
- source_word: ἁμαρτίας
  choice: Sünden
  rationale: Der griechische Plural bezeichnet einzelne sündhafte Taten oder Verfehlungen und wird daher auch im Deutschen als Plural wiedergegeben.
theological_decisions:
- issue: Art des Zusammenhangs zwischen Streitvermeidung und Sünden
  choice: Die Folgewirkung wird direkt als „dann wirst du Sünden vermindern“ wiedergegeben.
  alternative: „damit wirst du weniger sündigen“
  rationale: Der griechische Text stellt eine praktische Folge fest, ohne Sündlosigkeit oder eine mechanische Heilswirkung zu behaupten. Die gewählte Fassung wahrt zudem das konkrete Pluralobjekt „Sünden“.
translation_notes:
  register: Kurzer, würdevoller Weisheitsspruch in modernem Standarddeutsch. „Halte dich … fern“ ist allgemein verständlich; „Streit“ deckt verbale und sonstige zwischenmenschliche Auseinandersetzungen ab. Die Satzverknüpfung mit „dann“ macht die im griechischen καί liegende Ergebnisfolge idiomatisch deutlich.
