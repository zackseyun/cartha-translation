  text: A third tongue has driven out strong women[a], and has deprived them of the fruit of their labor;
translation:
  language: de
  text: Eine dritte Zunge hat starke Frauen vertrieben[a] und sie um den Ertrag ihrer Mühen gebracht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Eine entzweiende Zunge“ beziehungsweise „eine verleumderische Zunge“. Wörtlich steht im Griechischen „eine dritte Zunge“. Gemeint ist wahrscheinlich eine Rede, die sich als dritte Partei zwischen Menschen drängt und sie voneinander trennt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γλῶσσα τρίτη
  choice: eine dritte Zunge
  rationale: Die wörtliche und ungewöhnliche Wendung bleibt erhalten. Gemeint ist wahrscheinlich verleumderische oder entzweiende Rede, die sich als dritte Partei zwischen Menschen drängt; diese Deutung wird nicht in den Haupttext eingetragen.
- source_word: γυναῖκας ἀνδρείας
  choice: starke Frauen
  rationale: ἀνδρείας bezeichnet hier Tapferkeit, Tüchtigkeit oder Stärke. „Starke Frauen“ ist natürlich, verständlich und wahrt den ausdrücklichen Bezug auf Frauen.
- source_word: ἐξέβαλεν
  choice: hat … vertrieben
  rationale: Das Verb bedeutet hinauswerfen, vertreiben oder ausstoßen. „Vertrieben“ gibt die gewaltsame soziale Verdrängung prägnant wieder.
- source_word: ἐστέρεσεν
  choice: hat … um … gebracht
  rationale: Die Wendung bezeichnet das Berauben oder Vorenthalten von etwas und klingt im Deutschen natürlicher als eine starre Wiedergabe mit „beraubt“.
- source_word: τῶν πόνων αὐτῶν
  choice: den Ertrag ihrer Mühen
  rationale: Wörtlich steht „ihre Mühen/Arbeiten“. Im Zusammenhang mit ἐστέρεσεν ist wahrscheinlich das durch diese Mühen Erworbene oder Hervorgebrachte gemeint; „Ertrag ihrer Mühen“ macht den Sinn idiomatisch deutlich.
