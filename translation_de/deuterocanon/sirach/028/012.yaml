translation:
  language: de
  text: Vor ihm befand sich eine Kohle; er blies sie an[a], und sie flammte auf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Parallelfassung lautet: „Wenn du einen Funken anbläst, entzündet er sich; und wenn du darauf spuckst, erlischt er. Beides kommt aus deinem Mund.“ Der hebräische Textzeuge ist kürzer und lautet: „Vor ihm befand sich eine Kohle; er blies sie an, und sie flammte auf.“'
    reason: alternative_reading
lexical_decisions:
- source_word: הָיְתָה
  choice: lag
  rationale: Das hebräische Existenzverb wird zusammen mit לְפָנָיו im Deutschen natürlich als „vor ihm lag“ wiedergegeben; der schlichte Zustandssinn bleibt erhalten.
- source_word: לְפָנָיו
  choice: vor ihm
  rationale: Die Präposition mit maskulinem Singularsuffix bedeutet am ehesten „vor ihm“. Der Personenbezug des hebräischen Zeugen bleibt stehen, obwohl die griechische Parallelfassung in die zweite Person wechselt.
- source_word: גַחֶלֶת
  choice: eine Kohle
  rationale: „Kohle“ gibt das konkrete hebräische Bild direkt wieder. „Glut“ oder „glühende Kohle“ wären möglich, würden den Ausdruck jedoch stärker ausdeuten.
- source_word: נָפַח בָּה
  choice: er blies sie an
  rationale: נפח bezeichnet Blasen oder Hauchen. „Eine Kohle anblasen“ ist im Deutschen idiomatisch und bewahrt das Bild des Anfachens.
- source_word: וּבָעֲרָה
  choice: und sie flammte auf
  rationale: בער bezeichnet hier das Entzünden oder Brennen; „flammte auf“ bringt die durch das Anblasen ausgelöste Zustandsänderung natürlich zum Ausdruck.
- source_word: ἐὰν φυσήσῃς σπινθῆρα ἐκκαήσεται
  choice: nur in der Fußnote berücksichtigt
  rationale: Die griechische Parallelfassung hat die zweite Person und „Funken“ statt „Kohle“ und erweitert den Spruch. Da ein zuverlässiger hebräischer Text vorliegt, folgt der Haupttext diesem und dokumentiert die griechische Fassung in der Fußnote.
