base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/028/019.yaml
  text: Blessed is the one sheltered from it[a], who has not passed through its wrath, who has not drawn its yoke, and has not been bound in its chains.
translation:
  language: de
  text: Wohl dem, der vor ihr geschützt ist, der nicht durch ihren Zorn gegangen ist, der ihr Joch nicht gezogen hat und nicht in ihren Fesseln gebunden wurde.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μακάριος
  choice: Wohl dem
  rationale: Die geläufige Weisheitsformel bewahrt den Charakter eines Glückwunsches beziehungsweise einer Seligpreisung, ohne das subjektive Empfinden von »glücklich« in den Vordergrund zu stellen.
- source_word: σκεπασθεὶς ἀπʼ αὐτῆς
  choice: der vor ihr geschützt ist
  rationale: Das passive Partizip bezeichnet ein Bedeckt- und dadurch Geschütztsein. »Vor ihr geschützt« gibt die Schutzvorstellung in natürlichem Deutsch wieder.
- source_word: διῆλθεν ἐν τῷ θυμῷ αὐτῆς
  choice: nicht durch ihren Zorn hindurchmusste
  rationale: Die Formulierung erhält sowohl die Bewegungsvorstellung von διέρχομαι als auch die zerstörerische Heftigkeit von θυμός. »Hindurchmusste« klingt im Deutschen natürlicher als eine rein wörtliche Wiedergabe mit »hindurchging«.
- source_word: εἵλκυσεν τὸν ζυγὸν αὐτῆς
  choice: ihr Joch nicht gezogen hat
  rationale: Die Wiedergabe hält an dem konkreten Bild des Ziehens und des Jochs fest, statt es deutend zu »Last« oder »Knechtschaft« aufzulösen.
- source_word: ἐν τοῖς δεσμοῖς αὐτῆς οὐκ ἐδέθη
  choice: nicht in ihre Fesseln gebunden wurde
  rationale: »Fesseln« und »gebunden« bewahren das anschauliche Bild der Gefangenschaft und geben das griechische Passiv wieder.
theological_decisions:
- issue: Bezug und Geschlecht der femininen Pronomen
  choice: Die femininen Formen werden mit »ihr/ihren/ihre« wiedergegeben und beziehen sich im Zusammenhang auf die zerstörerische Zunge.
  alternative: Den Bezug ausdrücklich wiederholen, etwa mit »vor der Zunge«; oder die Personifikation durch eine unpersönlichere Umschreibung abschwächen.
  rationale: Da »Zunge« auch im Deutschen feminin ist, lässt sich die grammatische Personifikation des Griechischen natürlich und ohne erklärenden Zusatz bewahren. Der Vers bleibt dabei auf seinen unmittelbaren Kontext angewiesen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit der vertrauten Weisheitsformel »Wohl dem«. Die parallelen Relativsätze und die Bilder von Joch und Fesseln bleiben erhalten; leicht ungewöhnliche Bildsprache wird nicht vorschnell geglättet.
