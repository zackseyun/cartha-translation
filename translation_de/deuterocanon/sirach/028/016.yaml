  yaml_path: translation/deuterocanon/sirach/028/016.yaml
  text: Whoever pays attention to it will never find rest[a], nor will he settle down in peace.
translation:
  language: de
  text: Wer auf sie achtet, wird niemals Ruhe finden und auch nicht in Frieden wohnen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „und auch nicht in Ruhe sein Lager aufschlagen“.'
    reason: Die Fußnote bewahrt das konkrete Lagerbild von κατασκηνόω und die wörtliche Bedeutung „Ruhe/Stille“ von ἡσυχία.
lexical_decisions:
- source_word: ὁ προσέχων αὐτῇ
  choice: Wer auf sie achtet
  rationale: Das substantivierte Präsenspartizip bezeichnet allgemein jeden, der ihr fortwährend Beachtung schenkt. „Sie“ bewahrt den Rückbezug auf die im Kontext genannte Zunge und damit die im Griechischen erkennbare Personifikation.
- source_word: οὐ μὴ εὑρῇ
  choice: wird niemals … finden
  rationale: Die Verbindung οὐ μή mit dem Konjunktiv ist eine nachdrückliche Verneinung; „niemals“ gibt diese Verstärkung in natürlichem Deutsch wieder.
- source_word: ἀνάπαυσιν
  choice: Ruhe
  rationale: „Ruhe“ ist die direkte und kontextgemäße Entsprechung und kann sowohl äußere als auch innere Ruhe bezeichnen.
- source_word: οὐδὲ κατασκηνώσει
  choice: und auch nicht … wohnen
  rationale: κατασκηνόω bedeutet wörtlich „sein Lager aufschlagen“ und daraus „wohnen“. „Wohnen“ erhält das Bild eines dauerhaften Aufenthalts, ohne im Deutschen unnötig befremdlich zu wirken.
- source_word: μεθʼ ἡσυχίας
  choice: in Frieden
  rationale: ἡσυχία bezeichnet Ruhe, Stille oder Ungestörtheit. „In Frieden“ drückt hier den Zustand ruhigen, ungestörten Wohnens idiomatisch aus; die wörtlichere Nuance wird in der Fußnote genannt.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die feminine Bezugnahme „sie“ wahrt die Personifikation der zuvor genannten Zunge. Der zweite Satzteil wird flüssig formuliert, während die Fußnote das griechische Bild offenlegt.
