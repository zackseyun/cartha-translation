  yaml_path: translation/deuterocanon/sirach/028/009.yaml
  text: For an angry man kindles strife[a], and a sinful man stirs up friends[b], and among those making peace he casts slander.
translation:
  language: de
  text: Denn ein jähzorniger Mensch entfacht Streit, und ein sündiger Mann versetzt Freunde in Unruhe; unter Menschen, die Frieden stiften, streut er Verleumdung aus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θυμώδης
  choice: jähzornig
  rationale: Das Adjektiv bezeichnet einen Menschen, der von Zorn oder einem heftigen Temperament geprägt ist. „Jähzornig“ gibt diesen charakterlichen Zug im Deutschen prägnant wieder.
- source_word: ἐκκαύσει μάχην
  choice: entfacht Streit
  rationale: „Entfacht“ bewahrt das Bild des Anzündens, während „Streit“ μάχη im Zusammenhang einer Weisheitsmahnung natürlich und nicht unnötig auf einen körperlichen Kampf beschränkt wiedergibt.
- source_word: ἁμαρτωλός
  choice: sündig
  rationale: Die adjektivische Wiedergabe erhält die Parallele zu „jähzornig“ und beschreibt den Charakter, ohne daraus eine feste Personenbezeichnung zu machen.
- source_word: ταράξει φίλους
  choice: bringt Freunde gegeneinander auf
  rationale: ταράσσω bezeichnet Beunruhigen, Aufwühlen oder In-Unordnung-Bringen. Im sozialen Zusammenhang macht die Formulierung deutlich, dass Freunde entzweit werden, ohne das Bild des folgenden Satzglieds vorwegzunehmen.
- source_word: εἰρηνευόντων
  choice: Menschen, die Frieden stiften
  rationale: 'Die aktive verbale Bedeutung des Partizips bleibt erhalten: Gemeint sind Menschen, die Frieden herstellen oder Versöhnung betreiben.'
- source_word: ἐκβάλλει διαβολήν
  choice: streut Verleumdung aus
  rationale: διαβολή bezeichnet verleumderische Rede oder üble Nachrede. „Streut … aus“ gibt das aktive Hineintragen solcher Rede idiomatisch und anschaulich wieder, auch wenn es das wörtliche „hinauswerfen“ nicht formal nachbildet.
- source_word: ἄνθρωπος / ἀνήρ
  choice: Mensch / Mann
  rationale: Die wechselnden griechischen Bezeichnungen werden sichtbar gehalten. Beide stehen hier in einer allgemeinen, sprichwörtlichen Aussage.
theological_decisions:
- issue: Generisch gebrauchte maskuline Personenbezeichnungen in einer Weisheitsaussage
  choice: „Mensch“ für ἄνθρωπος und „Mann“ für ἀνήρ beibehalten
  alternative: Beide Vorkommen mit „Mensch“ oder „Person“ wiedergeben
  rationale: Die Übersetzung bildet den lexikalischen Wechsel der Vorlage ab, ohne die Aussage auf Männer zu beschränken; der Zusammenhang ist sprichwörtlich und allgemein.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer sprichwörtlicher Parallelstruktur. Die Feuer-Metapher im ersten Satzglied bleibt erhalten; die sozialen Folgen werden idiomatisch und unmittelbar verständlich formuliert.
