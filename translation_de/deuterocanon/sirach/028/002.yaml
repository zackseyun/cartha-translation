translation:
  language: de
  text: Vergib deinem Nächsten sein Unrecht; dann werden dir, wenn du betest, deine Sünden erlassen[a].[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »deine Sünden werden gelöst«. Gemeint sein kann auch: »deine Sünden werden vergeben« oder »erlassen«.'
    reason: lexical_alternative
  - marker: b
    text: 'Der für diese Stelle angegebene hebräische Text lautet sinngemäß: »Vielleicht kommt morgen, und er ist nicht mehr da; so grämt er sich über eine Welt, die nicht ihm gehört.« Da dieser Text inhaltlich nicht Sirach 28,2 entspricht, folgt die Übersetzung hier dem griechischen Paralleltext.'
    reason: textual_variant
lexical_decisions:
- source_word: ἄφες
  choice: Vergib
  rationale: Der Aoristimperativ kann »lass los« oder »vergib« bedeuten. Im Zusammenhang eines Unrechts gegenüber dem Nächsten ist »Vergib« die natürliche und sachlich passende Wiedergabe.
- source_word: ἀδίκημα
  choice: sein Unrecht
  rationale: Das Substantiv bezeichnet ein begangenes Unrecht oder eine Verfehlung. »Sein Unrecht« macht im Deutschen knapp und verständlich deutlich, dass es um das Unrecht des Nächsten geht.
- source_word: τῷ πλησίον σου
  choice: deinem Nächsten
  rationale: »Nächster« ist die geläufige biblische und zugleich weiterhin verständliche Bezeichnung für den Mitmenschen im ethischen Sinn.
- source_word: δεηθέντος σου
  choice: wenn du betest
  rationale: Der Genitivus absolutus bezeichnet den Zeitpunkt einer Bitte oder eines Flehens. »Wenn du betest« gibt den religiösen Sinn in natürlichem modernem Deutsch wieder.
- source_word: αἱ ἁμαρτίαι σου λυθήσονται
  choice: deine Sünden werden gelöst
  rationale: Das Passiv von λύω bedeutet wörtlich »lösen« oder »losmachen«. Die Wiedergabe bewahrt das auffällige Bild des griechischen Textes, statt es stillschweigend durch die geläufigere Formulierung »vergeben werden« zu ersetzen.
theological_decisions:
- issue: Auswahl der Textgrundlage für Sirach 28,2
  choice: Der griechische Paralleltext dient als unmittelbare Grundlage; die Abweichung des überlieferten hebräischen Textes wird in einer Fußnote offengelegt.
  alternative: Den angegebenen hebräischen Text als Sirach 28,2 übersetzen.
  rationale: Der angegebene hebräische Text handelt davon, dass jemand morgen nicht mehr da sein und sich über eine Welt grämen könnte, die ihm nicht gehört. Er entspricht inhaltlich nicht Sirach 28,2 in der überlieferten Verszählung. Der griechische Text bietet dagegen die kohärente und für diese Stelle bekannte Lesart. Die Unsicherheit wird nicht verschwiegen.
- issue: Metapher der Lösung von Sünden
  choice: »deine Sünden werden gelöst«
  alternative: »deine Sünden werden vergeben« oder »dir werden deine Sünden erlassen«
  rationale: Die ungewöhnliche Formulierung wahrt die Metapher des griechischen Verbs λύω und lässt offen, ob an Vergebung, Freisetzung oder Aufhebung gedacht ist, ohne eine bestimmte dogmatische Deutung einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Anrede in der zweiten Person Singular und der Ausdruck »dein Nächster« bewahren den persönlichen Weisungscharakter. Die bewusst ungewohnte Wendung »Sünden gelöst« erhält das griechische Bild und wird durch die Fußnote erläutert.
