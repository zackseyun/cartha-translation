  naturalness: Die eingeschobene Wortstellung »dann werden, wenn du betest, deine Sünden gelöst« ist schwerfällig. »Dann werden dir, wenn du betest, deine Sünden erlassen« ist modernes, würdiges Standarddeutsch und wahrt durch die Fußnote die wörtliche Bildsprache des Griechischen.
  terminology: »Nächster«, »Unrecht«, »betest« und »Sünden« treffen den ethisch-religiösen Registerton. »Erlassen« ist für die griechische Freigabe-/Lösungsmetapher im Deutschen die idiomatische Wiedergabe; die Anmerkung muss klarstellen, dass »gelöst« die wörtliche griechische Formulierung ist.
