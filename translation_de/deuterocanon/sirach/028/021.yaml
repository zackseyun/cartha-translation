base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/028/021.yaml
  text: Its death is an evil death[b][a], and its Hades is more advantageous.
translation:
  language: de
  text: Ihr Tod ist ein schlimmer Tod[a], und ihr Hades ist vorteilhafter[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das feminine „ihr“ bezieht sich auf das feminine Bezugswort im vorhergehenden Zusammenhang, wahrscheinlich auf die Zunge oder auf verleumderische Rede. Auch möglich: „Der Tod durch sie ist ein schlimmer Tod.“'
    reason: lexical_alternative
  - marker: b
    text: 'Sinngemäß auch: „Der Hades ist ihr gegenüber vorzuziehen“ oder „Das Totenreich ist besser als sie.“ Der griechische Vergleich nennt das Vergleichsobjekt nicht ausdrücklich.'
    reason: alternative_reading
lexical_decisions:
- source_word: θάνατος
  choice: Tod
  rationale: Das Substantiv steht zweimal und wird deshalb zur Wahrung der nachdrücklichen Parallelität beide Male mit „Tod“ wiedergegeben.
- source_word: πονηρός
  choice: schlimm
  rationale: Im Zusammenhang mit „Tod“ bezeichnet das Wort dessen verderbliche und furchtbare Art. „Schlimm“ ist im Deutschen natürlicher als „böse“, ohne die Aussage moralisch zu verengen.
- source_word: αὐτῆς
  choice: ihr
  rationale: Das feminine Pronomen verweist auf ein feminines Bezugswort aus dem vorhergehenden Zusammenhang, wahrscheinlich die Zunge beziehungsweise verleumderische Rede. Das deutsche „ihr“ bewahrt diesen Rückbezug.
- source_word: λυσιτελής
  choice: vorteilhafter
  rationale: Das Wort bezeichnet etwas Nützliches oder Vorteilhaftes. Der Komparativ gibt die zugespitzte Aussage wieder, dass selbst der Hades im Vergleich vorzuziehen ist.
- source_word: μᾶλλον
  choice: -er (Komparativ in „vorteilhafter“)
  rationale: Die vergleichende Bedeutung von μᾶλλον wird idiomatisch durch den deutschen Komparativ ausgedrückt.
- source_word: ᾅδης
  choice: Hades
  rationale: Die Transliteration hält den griechischen Begriff transparent und legt ihn weder auf das physische Grab noch auf eine spätere Vorstellung von Hölle fest.
theological_decisions:
- issue: Wiedergabe von ᾅδης
  choice: Hades
  alternative: Totenreich; Grab; Scheol
  rationale: „Hades“ entspricht dem ausdrücklichen griechischen Ausdruck und vermeidet sowohl eine Beschränkung auf das Grab als auch die Eintragung einer späteren Lehre von der Hölle.
- issue: Bezug des femininen Pronomens αὐτῆς
  choice: „ihr“ mit Rückbezug auf das feminine Bezugswort im vorhergehenden Zusammenhang
  alternative: Unpersönliche Umschreibung wie „der Tod durch sie“
  rationale: Die pronominale Form des Griechischen bleibt sichtbar; zugleich wird in einer Fußnote erklärt, dass wahrscheinlich die Zunge oder verleumderische Rede gemeint ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die auffällige Wiederholung von „Tod“ und die zugespitzte, im Deutschen ungewöhnliche Verbindung „ihr Hades“ bleiben erhalten, weil sie die knappe Parallelität und die echte Mehrdeutigkeit des griechischen Textes spiegeln.
