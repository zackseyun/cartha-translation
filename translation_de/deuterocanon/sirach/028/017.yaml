  text: A blow from a whip makes welts[a], but a blow from the tongue shatters bones.
translation:
  language: de
  text: Ein Peitschenhieb hinterlässt Striemen[a], doch ein Hieb der Zunge wird Knochen zerschmettern.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Blutergüsse“; das griechische Wort bezeichnet Spuren, die Schläge hinterlassen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πληγὴ μάστιγος
  choice: Peitschenhieb
  rationale: Die kompakte Zusammensetzung gibt den vom Instrument bestimmten Schlag natürlich und anschaulich wieder.
- source_word: ποιεῖ
  choice: hinterlässt
  rationale: Im Zusammenhang mit den Striemen bezeichnet das Verb idiomatisch, dass der Hieb sichtbare Spuren hervorbringt.
- source_word: μώλωπας
  choice: Striemen
  rationale: Das Wort bezeichnet durch Schläge verursachte Spuren oder Blutergüsse; bei einem Peitschenhieb ist „Striemen“ im Deutschen besonders treffend.
- source_word: πληγὴ ... γλώσσης
  choice: ein Hieb der Zunge
  rationale: Die konkrete Metapher und die Wiederholung von πληγή bleiben erhalten; gemeint ist verletzende Rede, ohne dass das Bild aufgelöst wird.
- source_word: συγκλάσει
  choice: wird ... zerschmettern
  rationale: Das Futur des griechischen Textes bleibt trotz des Präsens im ersten Satzglied sichtbar; „zerschmettern“ vermittelt die verstärkte Bedeutung von συγκλάω.
- source_word: ὀστᾶ
  choice: Knochen
  rationale: Der artikellose Plural wird innerhalb der drastischen Metapher knapp und idiomatisch wiedergegeben.
