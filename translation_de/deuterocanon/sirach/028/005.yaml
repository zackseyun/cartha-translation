translation:
  language: de
  text: Obwohl er selbst Fleisch ist, hält er am Zorn fest. Wer wird für seine Sünden Sühne leisten?[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der erhaltene hebräische Wortlaut dieser Zeile ist schwer verständlich und in der Kairoer Geniza-Überlieferung offenbar verderbt oder stark elliptisch. Die griechische Fassung lautet: „Obwohl er selbst Fleisch ist, hält er am Zorn fest; wer wird für seine Sünden Sühne leisten?“ Die Übersetzung folgt diesem wiedergewinnbaren Sinn.'
    reason: textual_variant
  - marker: b
    text: 'Oder: „hegt weiterhin Groll“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „Wer wird ihm seine Sünden vergeben?“ Das griechische Verb bezeichnet genauer das Leisten von Sühne oder Entsühnung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקַל מֵחָתָן, אֹרֵחַ מַכְנִיס אֹרֵחַ
  choice: Wiedergabe nach der griechischen Parallelüberlieferung
  rationale: Der erhaltene hebräische Text ergibt in diesem Zusammenhang keinen sicher verständlichen Sinn und scheint verderbt oder stark elliptisch zu sein. Daher dient die kohärente griechische Parallelüberlieferung als Übersetzungsgrundlage.
- source_word: αὐτὸς σὰρξ ὢν
  choice: obwohl er selbst nur Fleisch ist
  rationale: Die Wendung bewahrt das konkrete biblische Bild menschlicher Schwachheit. „Obwohl“ bringt den im Zusammenhang liegenden Gegensatz zum Festhalten am Zorn natürlich zum Ausdruck; „nur“ verdeutlicht die Begrenztheit, ohne „Fleisch“ als technische Bezeichnung einer sündigen Natur umzudeuten.
- source_word: διατηρεῖ μῆνιν
  choice: hält er am Zorn fest
  rationale: Die Formulierung gibt das fortdauernde Bewahren beziehungsweise Nähren des Zorns wieder und klingt im modernen Deutschen natürlich und würdig.
- source_word: τίς ἐξιλάσεται
  choice: Wer wird … Sühne schaffen?
  rationale: Das Verb bezeichnet Sühne beziehungsweise Entsühnung und nicht lediglich zwischenmenschliches Vergeben. Die fragende Form und die theologische Spannung bleiben erhalten.
- source_word: τὰς ἁμαρτίας αὐτοῦ
  choice: für seine Sünden
  rationale: Dies ist die übliche und idiomatische deutsche Wiedergabe in Verbindung mit „Sühne schaffen“.
theological_decisions:
- issue: Bedeutung von σάρξ im Weisheitskontext
  choice: nur Fleisch
  alternative: sterblich
  rationale: Gemeint ist menschliche Begrenztheit und Gebrechlichkeit, nicht ausdrücklich eine dogmatische Lehre von einer „sündigen Natur“. Das konkrete Bild bleibt deshalb stehen.
- issue: Sühnesprache in ἐξιλάσεται
  choice: Sühne schaffen
  alternative: seine Sünden vergeben
  rationale: Die gewählte Fassung bewahrt den kultisch-theologischen Bedeutungsgehalt des griechischen Verbs, ohne festzulegen, durch wen oder auf welche Weise die Sühne geschieht.
- issue: Textgrundlage bei schwierigem hebräischem Zeugnis
  choice: dem wiedergewinnbaren Sinn der griechischen Parallelüberlieferung folgen
  alternative: den überlieferten hebräischen Wortlaut wörtlich als Aussage über einen Bräutigam und einen Gast wiedergeben
  rationale: Der hebräische Wortlaut ist an dieser Stelle kontextuell unverständlich und wahrscheinlich verderbt oder stark elliptisch. Die griechische Überlieferung bietet einen kohärenten Vers, der zum unmittelbaren Zusammenhang über Zorn und Vergebung passt; die Abweichung wird ausdrücklich in einer Fußnote offengelegt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Weisheitston. Das konkrete Bild „Fleisch“ und die Sühnesprache bleiben erhalten; die textkritische Unsicherheit wird transparent ausgewiesen.
