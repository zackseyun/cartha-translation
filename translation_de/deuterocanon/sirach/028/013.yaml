  text: Curse the whisperer and the double-tongued[a], for they have destroyed many who were at peace.
translation:
  language: de
  text: Spuck darauf, und es erlischt; [beide sind aus deinem Mund].[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der überlieferte hebräische Text ist am Schluss unsicher; die eckigen Klammern entsprechen der Ausgabe. Die Bezugnahme von „beide“ bleibt unklar. Der griechische Paralleltext bietet stattdessen: „Verflucht den Flüsterer und den Doppelzüngigen; denn sie haben viele zugrunde gerichtet, die in Frieden lebten.“'
    reason: alternative_reading
lexical_decisions:
- source_word: Ψίθυρον
  choice: Einflüsterer
  rationale: Das Wort bezeichnet jemanden, der heimlich und schädlich über andere redet. „Einflüsterer“ bewahrt das Bild des leisen, verdeckten Redens, ohne das allgemeinere und stärkere „Verleumder“ in den Text einzutragen.
- source_word: δίγλωσσον
  choice: Doppelzüngigen
  rationale: Die wörtliche Metapher für unaufrichtiges, widersprüchliches Reden bleibt erhalten und ist im heutigen Deutschen verständlich.
- source_word: καταράσθε
  choice: Verflucht
  rationale: Der griechische Imperativ der zweiten Person Plural wird direkt und knapp wiedergegeben.
- source_word: ἀπώλεσαν
  choice: zugrunde gerichtet
  rationale: Die Form bezeichnet schweres Verderben oder Vernichten. „Zugrunde gerichtet“ wahrt die Stärke, ohne zwingend festzulegen, dass ausschließlich physische Tötung gemeint ist.
- source_word: εἰρηνεύοντας
  choice: die in Frieden lebten
  rationale: Die partizipiale Aussage beschreibt Menschen, die sich in einem Zustand des Friedens befanden; die verbale deutsche Fassung klingt natürlich und bleibt nah am Sinn.
- source_word: רָקַק בָּהּ וְכָבְתָה
  choice: Spuck darauf, dann erlischt es
  rationale: Diese eng am überlieferten Hebräisch liegende Wiedergabe wird wegen der starken Abweichung vom griechischen Paralleltext in der Fußnote bewahrt.
- source_word: '[וּשְׁנֵיהֶם מִפִּיךָ הֵם]'
  choice: '[beides kommt aus deinem Mund]'
  rationale: Die eckigen Klammern der hebräischen Edition signalisieren textliche Unsicherheit; Wortlaut und Unsicherheitszeichen werden deshalb in der Fußnote erhalten.
theological_decisions:
- issue: Starke Abweichung zwischen dem erhaltenen hebräischen Text und dem griechischen Paralleltext
  choice: Der Haupttext folgt der zusammenhängenden griechischen Mahnung gegen heimlich verleumderisches und doppelzüngiges Reden.
  alternative: 'Der hebräische Wortlaut lässt sich etwa wiedergeben: „Spuck darauf, dann erlischt es; [beides kommt aus deinem Mund].“'
  rationale: Das Hebräische ist an dieser Stelle schwierig und teilweise in Klammern überliefert, während der griechische Text einen vollständigen, im Zusammenhang verständlichen Satz bietet. Die abweichende hebräische Lesart wird ausdrücklich dokumentiert, damit die textliche Spannung nicht verdeckt wird.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Einflüsterer“ und „Doppelzüngiger“ bewahren die Bilder des griechischen Textes; die Satzführung bleibt für heutige Leser klar.
