  yaml_path: translation/deuterocanon/sirach/028/025.yaml
  text: And make for your words a balance and a measure[a], and make for your mouth a door and a bolt.
translation:
  language: de
  text: Mach für deine Worte eine Waage[a] und ein Gewicht, und mach für deinen Mund eine Tür und einen Riegel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das griechische Wort ζυγός bedeutet gewöhnlich »Joch«. In Verbindung mit »Gewicht« ist hier jedoch wahrscheinlich eine Waage beziehungsweise ein Wiegegerät gemeint: Worte sollen abgewogen und beherrscht werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λόγοις
  choice: Worten
  rationale: Das Wort bezeichnet hier das, was jemand sagt; »Worte« gibt die konkrete Mahnung direkt und natürlich wieder.
- source_word: ζυγόν
  choice: Waage
  rationale: Obwohl ζυγός gewöhnlich »Joch« bedeutet, weist die Verbindung mit σταθμός hier auf das Bild des Wiegens hin.
- source_word: σταθμόν
  choice: Gewicht
  rationale: σταθμός kann ein beim Wiegen verwendetes Gewicht oder einen Maßstab bezeichnen; »Gewicht« bewahrt gemeinsam mit »Waage« das konkrete Bild.
- source_word: στόματί
  choice: Mund
  rationale: Die wörtliche Wiedergabe erhält das körperlich-konkrete Bild, das durch Tür und Riegel fortgeführt wird.
- source_word: θύραν
  choice: Tür
  rationale: »Tür« ist die direkte Entsprechung und vermittelt das Bild eines verschließbaren Zugangs.
- source_word: μοχλόν
  choice: Riegel
  rationale: μοχλός bezeichnet eine Stange oder Vorrichtung zum Sichern einer Tür; »Riegel« ist im Deutschen dafür natürlich und prägnant.
- source_word: ποίησον
  choice: lege … an / versieh … mit
  rationale: Das zweimalige ποίησον bedeutet wörtlich »mache«. Im Deutschen geben die idiomatischen Formulierungen die beiden Metaphern natürlich wieder, ohne ihren parallelen Aufforderungscharakter aufzugeben.
