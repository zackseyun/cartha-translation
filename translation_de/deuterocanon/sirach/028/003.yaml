translation:
  language: de
  text: Ein Mensch hegt gegen einen anderen Zorn und sucht beim Herrn Heilung?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der für diese Stelle angegebene hebräische Text lautet: „Alles wog ich auf der Waagschale, und nichts fand ich leichter als Kleie.“ Da dieser Satz nicht in den Zusammenhang von Sirach 28,3 passt, folgt die Übersetzung hier der griechischen Überlieferung.'
    reason: textual_variant
lexical_decisions:
- source_word: ἄνθρωπος ἀνθρώπῳ
  choice: ein Mensch … gegen einen anderen
  rationale: ἄνθρωπος ist hier allgemein und repräsentativ gebraucht. „Ein Mensch … einen anderen“ gibt die Wiederholung natürlich und geschlechtsübergreifend wieder.
- source_word: συντηρεῖ
  choice: hält … fest
  rationale: Das Verb bezeichnet das fortdauernde Bewahren oder Aufrechterhalten; „am Zorn festhalten“ ist im Deutschen idiomatisch und bewahrt den durativen Sinn.
- source_word: ὀργήν
  choice: Zorn
  rationale: „Zorn“ entspricht der deutlichen, anhaltenden Verärgerung und passt zum würdevollen Register; „Wut“ wäre stärker affektiv und „Ärger“ schwächer.
- source_word: παρὰ Κυρίου
  choice: beim Herrn
  rationale: In Verbindung mit dem Suchen einer Heilung bezeichnet παρά die Person, von der diese erwartet wird. „Beim Herrn Heilung suchen“ ist natürliches Deutsch und bewahrt diese Herkunftsbeziehung.
- source_word: ζητεῖ
  choice: sucht
  rationale: Die schlichte Präsensform erhält sowohl den fortdauernden Vorgang als auch die rhetorische Zuspitzung.
- source_word: ἴασιν
  choice: Heilung
  rationale: „Heilung“ lässt den körperlichen, inneren und zwischenmenschlichen Bedeutungsumfang offen und ist weiter als „Heilmittel“ oder „Genesung“.
theological_decisions:
- issue: Konflikt zwischen dem zugeordneten hebräischen Text und der griechischen Überlieferung
  choice: Der Vers wird nach dem griechischen Text wiedergegeben.
  alternative: „Alles wog ich auf der Waagschale, und nichts fand ich leichter als Kleie.“
  rationale: Der gelieferte hebräische Satz entspricht inhaltlich nicht Sirach 28,3 und unterbricht den Zusammenhang über Zorn, Vergebung und erbetene Heilung. Die griechische Überlieferung bietet dagegen den kontextuell passenden Vers. Die Abweichung wird in einer Fußnote transparent dokumentiert.
- issue: Rhetorische Frage
  choice: Die Aussage bleibt als Frage formuliert.
  alternative: Aussage mit implizitem Tadel
  rationale: Das griechische Fragezeichen und der Zusammenhang legen eine tadelnde rhetorische Frage nahe. Die deutsche Fassung wahrt diese Spannung, ohne eine ausdrückliche Schlussfolgerung hinzuzufügen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die idiomatische Wendung „am Zorn festhalten“ macht die Dauerhaftigkeit des Grolls verständlich; die knappe rhetorische Frage bleibt erhalten.
