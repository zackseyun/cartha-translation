translation:
  language: de
  text: Ein hastig vorangetriebener Streit entfacht Feuer, und ein hastiger Kampf vergießt Blut.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔρις
  choice: Streit
  rationale: Bezeichnet Zwist oder Auseinandersetzung; »Streit« ist im Deutschen klar, geläufig und dem Bildzusammenhang angemessen.
- source_word: κατασπευδομένη
  choice: rasch vorangetriebener
  rationale: Das mediopassive Partizip beschreibt einen Streit, der beschleunigt oder eifrig weitergetrieben wird. Die Formulierung bewahrt diesen passiven Zug, ohne eine Ursache hinzuzufügen.
- source_word: ἐκκαίει πῦρ
  choice: entfacht Feuer
  rationale: Gibt das Bild des Anzündens beziehungsweise heftigen Entflammens knapp und idiomatisch wieder.
- source_word: μάχη
  choice: Kampf
  rationale: Entspricht der tätlichen Auseinandersetzung, die gegenüber dem vorausgehenden »Streit« eine Steigerung erkennen lässt.
- source_word: κατασπεύδουσα
  choice: ungestümer
  rationale: Das aktive Partizip stellt den Kampf als vorwärtsdrängend und hastig dar. »Ungestüm« vermittelt diese Dynamik in natürlichem Deutsch.
- source_word: ἐκχέει αἷμα
  choice: vergießt Blut
  rationale: Die feste deutsche Wendung entspricht dem wörtlichen Bild »gießt Blut aus« und bewahrt dessen Gewaltsamkeit.
theological_decisions: []
translation_notes:
  register: Knappes, sprichwortartiges Deutsch mit parallelem Satzbau. Die unterschiedliche grammatische Perspektive der beiden griechischen Partizipien wird durch »vorangetriebener« und »ungestümer« erkennbar gehalten.
