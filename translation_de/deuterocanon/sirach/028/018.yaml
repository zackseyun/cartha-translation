  terminology: Die Begriffe »Schwert«, »Mund« und »Zunge« sind konsequent und bewahren den rhetorischen Kontrast des griechischen Textes. Es werden keine konfessionell oder auslegungsseitig belasteten Begriffe eingeführt.
