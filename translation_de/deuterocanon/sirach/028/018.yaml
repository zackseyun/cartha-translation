  yaml_path: translation/deuterocanon/sirach/028/018.yaml
  text: Many have fallen by the mouth of the sword[a], but not as those who have fallen because of the tongue.
translation:
  language: de
  text: Viele sind durch den Mund des Schwertes[a] gefallen, doch nicht in dem Maß wie diejenigen, die durch die Zunge gefallen sind.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »durch den Mund des Schwertes«. Gemeint sein kann die Schneide des Schwertes; die wörtliche Form bewahrt jedoch den Gegensatz zur »Zunge« im zweiten Satzteil.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  choice: Viele
  rationale: Die schlichte Mengenangabe wird direkt und in einem Weisheitsspruch natürlich wiedergegeben.
- source_word: ἔπεσαν
  choice: sind … gefallen
  rationale: Das Perfekt entspricht im Deutschen dem sprichwortartigen Rückblick auf eine vielfach erfahrene Wirklichkeit und bewahrt das Bild des Fallens.
- source_word: ἐν στόματι μαχαίρας
  choice: durch den Mund des Schwertes
  rationale: Die bildhafte, im Griechischen wörtliche Formulierung wird trotz ihrer Ungewöhnlichkeit beibehalten, weil sie den rhetorischen Bezug zur »Zunge« trägt.
- source_word: καὶ οὐχ ὡς
  choice: doch nicht in dem Maß wie
  rationale: Die Wendung markiert einen Vergleich, ohne das im Griechischen nicht wiederholte »viele« ausdrücklich einzufügen. »In dem Maß« lässt offen, ob vor allem Zahl oder Ausmaß im Blick ist.
- source_word: οἱ πεπτωκότες
  choice: diejenigen, die … gefallen sind
  rationale: Die substantivierte Perfektpartizipialform wird natürlich wiedergegeben und die Wiederholung des Fallmotivs bleibt erhalten.
- source_word: διὰ γλῶσσαν
  choice: durch die Zunge
  rationale: διά mit Akkusativ kann Ursache oder Mittel bezeichnen. »Durch« bewahrt diese leichte Offenheit und das konkrete Bild zerstörerischer Rede.
theological_decisions:
- issue: Bildhafter Gegensatz zwischen Schwert und Zunge
  choice: Die Körperteilbilder »Mund« und »Zunge« werden bewahrt.
  alternative: »durch die Schärfe/Schneide des Schwertes« und »durch Worte/durch üble Rede«
  rationale: Der Vers gewinnt seine Weisheitswirkung aus dem auffälligen Gegensatz zwischen dem »Mund« der Waffe und der menschlichen Zunge. Eine Glättung würde diesen Zusammenhang abschwächen.
- issue: Art des Vergleichs in καὶ οὐχ ὡς
  choice: »doch nicht in dem Maß wie«
  alternative: »doch nicht so viele wie« oder formal »und nicht wie«
  rationale: Der griechische Wortlaut nennt im zweiten Glied keine ausdrückliche Mengenangabe. Die gewählte Form macht den Vergleich verständlich, ohne ihn ausschließlich als zahlenmäßigen Vergleich festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnliche Wendung »Mund des Schwertes« ist bewusst bildtreu; die Fußnote erläutert den geläufigen idiomatischen Sinn. Der parallele Satzbau erhält den knappen, sprichwortartigen Charakter.
