  source_fidelity: Der deutsche Text gibt die griechische Bildsprache und den elliptischen Vergleich sachgerecht wieder. »durch den Mund des Schwertes« bewahrt στόμα, während die Wiederholung von »gefallen« sowohl ἔπεσαν als auch οἱ πεπτωκότες erkennbar aufnimmt. »doch nicht in dem Maß wie« macht die in καὶ οὐχ ὡς vorausgesetzte Vergleichsrelation verständlich, ohne die nicht ausdrücklich wiederholte Mengenangabe als »so viele« festzulegen. »durch die Zunge« erhält die konkrete Metapher und lässt die bei διά mögliche Nähe von Mittel und Ursache offen.
