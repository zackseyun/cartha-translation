  yaml_path: translation/deuterocanon/sirach/028/022.yaml
  text: It will never overpower the godly[a], and they will not be burned in its flame.
translation:
  language: de
  text: Sie wird die Gottesfürchtigen niemals überwältigen[a], und in ihrer Flamme werden sie nicht verbrannt werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sie wird die Gottesfürchtigen niemals ergreifen“ beziehungsweise „niemals die Oberhand über sie gewinnen“. Das griechische Verb kann ein Ergreifen, Beherrschen oder Überwältigen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ μὴ
  choice: niemals
  rationale: Die emphatische Verneinung οὐ μή mit dem Aorist Konjunktiv bezeichnet eine nachdrückliche Verneinung für die Zukunft; „niemals“ gibt diese Stärke in natürlichem Deutsch wieder.
- source_word: κρατήσῃ
  choice: überwältigen
  rationale: κρατέω kann „ergreifen“, „festhalten“ oder „die Oberhand gewinnen“ bedeuten. Im Zusammenhang mit der zerstörerischen Macht der Zunge und dem Feuerbild drückt „überwältigen“ die feindliche Bemächtigung treffend aus.
- source_word: εὐσεβῶν
  choice: die Gottesfürchtigen
  rationale: Der substantivierte Genitiv Plural von εὐσεβής bezeichnet Menschen, deren Leben von Ehrfurcht vor Gott geprägt ist. „die Gottesfürchtigen“ ist verständlich und bewahrt den religiösen Bezug ausdrücklich.
- source_word: φλογὶ
  choice: Flamme
  rationale: φλόξ bezeichnet spezifisch eine Flamme und nicht bloß Feuer im Allgemeinen; „Flamme“ erhält das anschauliche Bild.
- source_word: καήσονται
  choice: werden verbrannt werden
  rationale: Das Futur Passiv bezeichnet, dass die Betroffenen dem Verbrennen ausgesetzt werden. Die passive Wiedergabe bewahrt die grammatische Form und legt nicht zusätzlich fest, dass sie völlig verzehrt würden.
theological_decisions:
- issue: Bezug des femininen Pronomens αὐτῆς
  choice: „ihrer“, mit Bezug auf die im Kontext als Feuer dargestellte Zunge
  alternative: 'Unpersönlicher: „in dessen Flamme“, mit Bezug auf das Feuer oder die zerstörerische Macht'
  rationale: Im Griechischen ist αὐτῆς feminin und kann unmittelbar auf die feminine „Zunge“ zurückweisen. Das deutsche „ihrer“ erhält sowohl diesen grammatischen Bezug als auch die mögliche Personifikation, ohne die Metapher näher festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die weibliche Singularform „Sie“ knüpft an die im unmittelbaren Kontext vorausgesetzte Zunge an. Die Wiederholung „werden … werden“ ist formal korrekt, klingt jedoch leicht schwer; sie wurde beibehalten, um Futur und Passiv des griechischen καήσονται präzise wiederzugeben.
