  text: He has no mercy on a man like himself[b][a], yet he asks for his own sins to be forgiven?
translation:
  language: de
  text: Er hat kein Erbarmen mit einem Menschen, der ihm gleich ist – und bittet er wegen seiner eigenen Sünden?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die erhaltene hebräische Zeile in der angegebenen Kahana-Ausgabe entspricht offenbar nicht diesem Vers. Daher folgt die Übersetzung hier dem griechischen Textzeugen.
    reason: textual_variant
  - marker: b
    text: 'Es kann gemeint sein: „und bittet er darum, dass ihm seine eigenen Sünden vergeben werden?“ Der griechische Text lässt den erbetenen Ausgang unausgesprochen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπʼ ἄνθρωπον ὅμοιον αὐτῷ
  choice: mit einem Menschen, der ihm gleich ist
  rationale: Da die überlieferte hebräische Zeile offenbar nicht zu diesem Vers gehört, dient der griechische Paralleltext als Grundlage. ἄνθρωπος bezeichnet hier einen Mitmenschen; die Formulierung wahrt den Gedanken, dass der Betreffende einem selbst gleich ist.
- source_word: οὐκ ἔχει ἔλεος
  choice: hat er kein Erbarmen
  rationale: ἔλεος bedeutet in diesem ethischen Zusammenhang „Erbarmen“ oder „Barmherzigkeit“. „Kein Erbarmen haben“ bildet die griechische Wendung natürlich und würdig ab.
- source_word: καὶ περὶ τῶν ἁμαρτιῶν αὐτοῦ δεῖται
  choice: und wegen seiner eigenen Sünden bittet er?
  rationale: δέομαι kann „bitten“, „flehen“ oder „beten“ bedeuten. Der griechische Text nennt das erbetene Ergebnis nicht ausdrücklich. Die knappe Wiedergabe bewahrt diese Offenheit und den rhetorischen Fragesinn; „eigene“ verdeutlicht den Rückbezug von αὐτοῦ.
theological_decisions:
- issue: Auswahl der Textgrundlage bei einer nicht entsprechenden hebräischen Zeile
  choice: Der griechische Zeuge wird für diesen Vers übersetzt; die Abweichung der hebräischen Überlieferung wird in einer Fußnote offengelegt.
  alternative: Die vorhandene hebräische Zeile trotz ihres offenkundig anderen Inhalts als Sirach 28,4 übersetzen.
  rationale: Die angegebene hebräische Zeile handelt von einem Bräutigam im Haus seines Schwiegervaters und entspricht weder dem griechischen Sirach 28,4 noch dessen Zusammenhang über Zorn, Erbarmen und Vergebung. Der griechische Text bietet daher hier den einschlägigen Verszeugen.
- issue: Unausgesprochener Gegenstand der Bitte
  choice: Die Bitte um der eigenen Sünden willen bleibt in ihrer Zielrichtung unausgeführt.
  alternative: 'Ausdrücklich ergänzen: „bittet er darum, dass ihm seine eigenen Sünden vergeben werden?“'
  rationale: Der Zusammenhang legt Vergebung nahe, doch der griechische Wortlaut sagt nur, dass er wegen beziehungsweise hinsichtlich seiner Sünden bittet. Die Hauptübersetzung bewahrt diese echte sprachliche Offenheit; die naheliegende Deutung wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die rhetorische Spannung wird durch die Frage und den Gedankenstrich hervorgehoben. „Mensch“ gibt ἄνθρωπος natürlich und ohne unnötige geschlechtliche Verengung wieder; „Erbarmen“ passt zum Weisheits- und Vergebungskontext.
