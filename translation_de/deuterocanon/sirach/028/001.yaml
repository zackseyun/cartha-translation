translation:
  language: de
  text: Wer Rache übt, wird vom Herrn Rache erfahren, und der Herr wird seine Sünden gewiss festhalten.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die für diesen Vers vorgelegte erhaltene hebräische Zeile lautet: „Fürchte nicht die Not von morgen, denn du weißt nicht, was ein Tag hervorbringen wird.“ Sie stimmt nicht mit dem griechischen Text von Sirach 28,1 überein und gehört offenbar zu einem anderen Vers oder beruht auf einer Überlieferungsverwechslung. Die Übersetzung folgt daher hier dem griechischen Zeugen.'
    reason: textual_variant
  - marker: b
    text: 'Wörtlich etwa: „und seine Sünden wird er bewahrend bewahren.“ Die Wiederholung desselben griechischen Verbs verstärkt die Aussage. „Festhalten“ meint hier, die Sünden gegen ihn zu bewahren; auch möglich: „im Gedächtnis behalten“ oder „aufbewahren“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἐκδικῶν
  choice: Wer Rache übt
  rationale: Die substantivierte Partizipialkonstruktion bezeichnet allgemein jemanden, der Rache nimmt. Die Formulierung ist im modernen Deutsch verständlich und bewahrt den gewohnheitsmäßigen Sinn.
- source_word: παρὰ Κυρίου
  choice: vom Herrn
  rationale: παρά mit Genitiv bezeichnet hier die Quelle; „vom Herrn“ gibt dies knapp und natürlich wieder.
- source_word: εὑρήσει ἐκδίκησιν
  choice: wird … Rache erfahren
  rationale: „Erfahren“ klingt im Deutschen natürlicher als das wörtliche „Rache finden“. Durch „Rache übt … Rache erfahren“ bleibt die Wortstammverbindung mit ἐκδικῶν sichtbar.
- source_word: τὰς ἁμαρτίας αὐτοῦ
  choice: seine Sünden
  rationale: Dies ist die direkte und moralisch ungeschmälerte Wiedergabe von ἁμαρτίαι; das Pronomen bleibt wie im Griechischen formal mehrdeutig.
- source_word: διατηρῶν διατηρήσει
  choice: wird er gewiss festhalten
  rationale: Die Verbindung von Partizip und finitem Verb desselben Stammes verstärkt die Aussage. „Gewiss“ bildet die Emphase ab; „festhalten“ vermittelt, dass die Sünden nicht fallengelassen oder vergessen, sondern gegen den Betreffenden bewahrt werden.
theological_decisions:
- issue: Abweichung zwischen dem überlieferten hebräischen Eintrag und dem griechischen Text von Sirach 28,1
  choice: Dem griechischen Zeugen für Sirach 28,1 folgen
  alternative: 'Die vorgelegte hebräische Zeile übersetzen: „Fürchte nicht die Not von morgen, denn du weißt nicht, was ein Tag hervorbringen wird.“'
  rationale: Die angegebene hebräische Zeile entspricht inhaltlich nicht Sirach 28,1, sondern einer sprichwortartigen Aussage, die mit Sprüche 27,1 verwandt ist. Daher dient hier der griechische Text als maßgeblicher Verszeuge; die Abweichung wird in einer Fußnote offengelegt.
- issue: Bezug des unausgedrückten Subjekts in διατηρῶν διατηρήσει
  choice: Die grammatische Mehrdeutigkeit durch „er“ bewahren
  alternative: 'Ausdrücklich schreiben: „der Herr wird seine Sünden festhalten“'
  rationale: Im Zusammenhang liegt der Herr als Handelnder nahe, doch die griechische Form benennt das Subjekt des zweiten Satzteils nicht nochmals ausdrücklich. Die Übersetzung soll diese Spannung nicht stillschweigend auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung wahrt die Wortverbindung zwischen Racheüben und Racheerfahren sowie die Mehrdeutigkeit des griechischen Subjekts. Beide Fußnotenmarker erscheinen im Haupttext.
