  text: Remember the end[a], and stop being hostile; remember decay and death[b], and remain in the commandments.
translation:
  language: de
  text: Denk an das Ende[a] und hör auf, feindselig zu sein; denk an Verfall und Tod[b] und halte dich an die Gebote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Griechisch wörtlich: „die letzten Dinge“. Gemeint sein kann das eigene Lebensende oder der endgültige Ausgang.'
    reason: lexical_alternative
  - marker: b
    text: 'Der hier gelieferte hebräische Zeuge bietet einen anderen Spruch, ungefähr: „… jemand antwortet auf eine Sache, bevor er sie gehört hat.“ Das deutet eher auf eine fehlerhafte Zuordnung der Textstelle als auf eine gewöhnliche Lesart dieses Verses hin.'
    reason: textual_variant
lexical_decisions:
- source_word: μνήσθητι
  choice: Denk an
  rationale: Der hebräische Text ist an dieser Stelle offenbar falsch zugeordnet; daher dient der zusammenhängende griechische Paralleltext als Grundlage. „Denk an“ gibt den Imperativ natürlich und unmittelbar wieder.
- source_word: τὰ ἔσχατα
  choice: das Ende
  rationale: Wörtlich steht „die letzten Dinge“. „Das Ende“ ist im Deutschen knapp und verständlich und lässt sowohl das persönliche Lebensende als auch den endgültigen Ausgang anklingen; die Mehrdeutigkeit wird in einer Fußnote erläutert.
- source_word: παῦσαι ἐχθραίνων
  choice: hör auf, feindselig zu sein
  rationale: Die Konstruktion bezeichnet das Beenden fortdauernder Feindschaft oder feindseligen Verhaltens. Die Wiedergabe ist modern und legt den Ausdruck nicht unnötig auf das innere Gefühl des Hasses fest.
- source_word: καταφθοράν
  choice: Verfall
  rationale: Das Substantiv kann Verfall, Verderben oder Vernichtung bezeichnen. Zusammen mit „Tod“ hebt „Verfall“ passend die Vergänglichkeit hervor, ohne den Begriff moralisch einzuengen.
- source_word: θάνατον
  choice: Tod
  rationale: Direkte und übliche Entsprechung; im griechischen Text steht der Begriff neben „Verfall“.
- source_word: ἔμμενε
  choice: halte dich an
  rationale: Der Imperativ fordert beständige Bindung und Beharrlichkeit. „Halte dich an“ ist im Deutschen mit „Gebote“ idiomatischer als eine formale Wiedergabe wie „bleibe in“.
- source_word: ἐντολαῖς
  choice: die Gebote
  rationale: Der griechische Text nennt keinen ausdrücklichen Besitzer. „Die Gebote“ bewahrt den religiös-ethischen Gehalt, ohne „Gottes“ ergänzend einzufügen.
theological_decisions:
- issue: Textgrundlage für diesen Vers
  choice: Der griechische Paralleltext wird als maßgebliche Textgrundlage für Sirach 28,6 übersetzt; die abweichende hebräische Zeile wird in einer Fußnote dokumentiert.
  alternative: 'Die vorgelegte hebräische Zeile direkt wiedergeben: „Und leichter als ein Wanderer ist, wer eine Sache beantwortet, bevor er sie hört“ (ungefähre Wiedergabe).'
  rationale: Die gelieferte hebräische Zeile entspricht inhaltlich nicht Sirach 28,6 nach der griechischen Überlieferung und scheint aus einem anderen Spruch beziehungsweise einer fehlerhaften Quellenzuordnung zu stammen. Der griechische Text bildet dagegen einen zusammenhängenden Vers. Die Unsicherheit wird nicht verschwiegen, sondern ausdrücklich vermerkt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch in knapper Weisheitssprache. Die parallelen Imperative werden mit „Denk an …“ wiedergegeben. „Halte dich an die Gebote“ ist bewusst idiomatisch, ohne den im Griechischen nicht ausdrücklich genannten Zusatz „Gottes“.
