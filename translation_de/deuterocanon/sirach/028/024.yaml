    rationale: Die deutsche Wendung hat überwiegend die Bedeutung „achte darauf/pass auf“ und verschiebt die bloße Aufforderung zum Hinschauen bzw. Aufmerken. „Sieh“ bewahrt die Funktion des griechischen Imperativs besser.
  - severity: low
    issue: „verwahre sicher“ für κατάδησον
    rationale: Die Formulierung paraphrasiert den Sinn, lässt aber das ausdrückliche Bild des Festbindens im laufenden Text weg. Da eine direkte, verständliche Wiedergabe möglich ist, sollte sie bevorzugt werden.
