  text: See[a], fence in your property with thorns; bind up your silver and your gold.
translation:
  language: de
  text: 'Sieh: Umgib deinen Besitz mit Dornen; binde dein Silber und dein Gold fest.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἴδε
  choice: Sieh zu
  rationale: Der Imperativ lenkt nachdrücklich die Aufmerksamkeit auf die folgende Mahnung. „Sieh zu“ gibt diese auffordernde Kraft im Deutschen natürlich wieder.
- source_word: περίφραξον
  choice: umgib
  rationale: Das Verb bezeichnet das ringsum Einhegen oder Einschließen. Zusammen mit „mit Dornen“ bleibt das konkrete Bild einer schützenden Umfriedung erhalten.
- source_word: τὸ κτῆμά σου
  choice: deinen Besitz
  rationale: κτῆμα bezeichnet Eigentum oder Besitz. „Besitz“ ist weit genug und in diesem Weisheitsspruch natürlich verständlich.
- source_word: ἀκάνθαις
  choice: mit Dornen
  rationale: Der Dativ bezeichnet das Mittel der Einhegung. Die konkrete und sprichwörtliche Bildsprache wird unverändert bewahrt.
- source_word: τὸ ἀργύριόν σου
  choice: dein Silber
  rationale: Obwohl Silber auch Geld bezeichnen kann, nennt der griechische Text ausdrücklich das Metall; dies bewahrt zudem die Parallele zu Gold.
- source_word: καὶ τὸ χρυσίον
  choice: und dein Gold
  rationale: Die konkrete Bezeichnung des Edelmetalls wird beibehalten, statt sie verallgemeinernd als Reichtum wiederzugeben.
- source_word: κατάδησον
  choice: verwahre sicher
  rationale: Das Verb bedeutet wörtlich, etwas festzubinden. Im Zusammenhang mit Silber und Gold drückt „verwahre sicher“ die beabsichtigte sorgfältige Sicherung in natürlichem modernem Deutsch aus, während die wörtliche Bildfassung in der Fußnote dokumentiert wird.
theological_decisions: []
translation_notes:
  register: Moderner, würdevoller Weisheitsstil mit knappen Imperativen. Der Doppelpunkt nach „Sieh zu“ macht die einleitende Aufmerksamkeitsformel im Deutschen klar; das Semikolon erhält den Parallelismus der beiden Mahnungen.
