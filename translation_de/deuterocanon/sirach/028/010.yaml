  yaml_path: translation/deuterocanon/sirach/028/010.yaml
  text: As the fuel of a fire, so it will be kindled; according to a man's strength, so will his wrath be; and according to his wealth he will raise up his anger, and according to the firmness of the conflict it will be kindled.
translation:
  language: de
  text: Je nach dem Brennstoff eines Feuers wird es entfacht; je nach der Kraft eines Menschen ist sein Zorn. Je nach seinem Reichtum steigert er seine Wut, und je nach der Heftigkeit des Streits[a] wird es entfacht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „je nach der Festigkeit des Streits wird es entfacht“. στερέωσις kann Festigkeit, Stärke oder Verhärtung bezeichnen; „Heftigkeit“ gibt die im Zusammenhang naheliegende Intensität des Streits wieder.'
    reason: Die Verbindung στερέωσις τῆς μάχης ist im Deutschen bei wörtlicher Wiedergabe schwer verständlich. Die Anmerkung dokumentiert die lexikalische Offenheit, ohne den elliptischen Bildbezug des griechischen Textes festzulegen.
lexical_decisions:
- source_word: ὕλην
  choice: Brennstoff
  rationale: Im Zusammenhang mit Feuer bezeichnet ὕλη das brennbare Material, das ein Feuer nährt. „Brennstoff“ ist im Deutschen natürlich und weiter als das mögliche, aber engere „Holz“.
- source_word: ἐκκαυθήσεται
  choice: wird entfacht / wird aufflammen
  rationale: Das Futur Passiv bezeichnet das Entzündetwerden beziehungsweise heftige Aufbrennen. Die leicht variierte Wiedergabe ergibt in beiden Satzteilen natürliches Deutsch und bewahrt die Feuermetapher.
- source_word: ἰσχὺν
  choice: Kraft
  rationale: ἰσχύς meint Stärke oder Leistungsvermögen; „Kraft“ passt zur sprichwörtlichen Gegenüberstellung mit dem Ausmaß des Zorns.
- source_word: ἀνθρώπου
  choice: eines Menschen
  rationale: ἄνθρωπος ist hier generisch gebraucht. „Mensch“ bewahrt Numerus und allgemeine Aussage, ohne im Deutschen ein unnötig männlich begrenztes Verständnis nahezulegen.
- source_word: θυμός
  choice: Zorn
  rationale: θυμός bezeichnet leidenschaftlichen Zorn. „Zorn“ ist würdig und verständlich und lässt eine gewisse Unterscheidung vom folgenden ὀργή zu.
- source_word: πλοῦτον
  choice: Reichtum
  rationale: πλοῦτος bezeichnet materiellen Reichtum beziehungsweise verfügbare Mittel; „Reichtum“ ist die direkte und natürliche Entsprechung.
- source_word: ἀνυψώσει
  choice: wird ... steigern
  rationale: Das Verb bedeutet wörtlich „emporheben“. In Verbindung mit Grimm gibt „steigern“ die Intensivierung idiomatisch wieder, ohne den Grundgedanken des Erhöhens zu verlieren.
- source_word: ὀργήν
  choice: Grimm
  rationale: ὀργή bezeichnet Zorn oder Entrüstung. „Grimm“ wahrt gegenüber θυμός = „Zorn“ eine hörbare, aber nicht überpräzise lexikalische Unterscheidung.
- source_word: στερέωσιν
  choice: Heftigkeit
  rationale: στερέωσις bezeichnet Festigkeit oder Stärke. Beim Streit ist im Deutschen „Heftigkeit“ die natürliche kontextuelle Wiedergabe für dessen Stärke beziehungsweise verhärtete Intensität.
- source_word: μάχης
  choice: Streit
  rationale: μάχη kann Kampf, Auseinandersetzung oder Streit bedeuten. Im Kontext zwischenmenschlicher Zorneskonflikte ist „Streit“ klar und nicht unnötig militärisch.
theological_decisions:
- issue: Generischer Singular ἀνθρώπου
  choice: eines Menschen
  alternative: eines Mannes
  rationale: Der griechische Ausdruck bezeichnet hier den Menschen allgemein. Die deutsche Wiedergabe wahrt diese generische Reichweite und den Singular.
- issue: Unterscheidung von θυμός und ὀργή
  choice: θυμός = „Zorn“; ὀργή = „Grimm“
  alternative: beide als „Zorn“ oder „Ärger“
  rationale: Die beiden semantisch überlappenden Begriffe werden unterscheidbar wiedergegeben, ohne einen scharfen theologischen Gegensatz zu behaupten.
- issue: Bezug des zweimaligen ἐκκαυθήσεται
  choice: unpersönliches „es“ beibehalten
  alternative: ausdrücklich „der Zorn“ oder „der Streit“ als Subjekt einsetzen
  rationale: Der griechische Wortlaut lässt den Bezug elliptisch und bildhaft. Die Übersetzung wahrt diese Offenheit, statt das Gemeinte stillschweigend festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit sprichwörtlicher Parallelstruktur. Das wiederholte „entsprechend“ bildet κατὰ konsequent ab; die Semikolonstruktur erhält den gestuften Gedankengang.
