translation:
  language: de
  text: Eine dritte Zunge hat viele erschüttert und sie von Volk zu Volk zerstreut.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eine verleumderische Zunge“, „eine doppelzüngige Rede“ oder allgemeiner „entzweiende Rede“. Im Griechischen steht wörtlich „eine dritte Zunge“; diese ungewöhnliche Wendung bleibt im Haupttext sichtbar.'
    reason: lexikalische Alternative und Bewahrung einer mehrdeutigen griechischen Wendung
lexical_decisions:
- source_word: γλῶσσα
  choice: Zunge
  rationale: Das griechische Wort bezeichnet wörtlich die Zunge und übertragen die Rede. „Zunge“ bewahrt hier das auffällige Bild der sprichwörtlich wirkenden Wendung.
- source_word: τρίτη
  choice: dritte
  rationale: Das Adjektiv ist im vorliegenden griechischen Text eindeutig eine Ordnungszahl. Die ungewöhnliche Formulierung bleibt im Haupttext erhalten, statt sie durch eine bestimmte Deutung zu ersetzen.
- source_word: ἐσάλευσεν
  choice: hat erschüttert
  rationale: Das Verb bedeutet schütteln, ins Wanken bringen oder aufwühlen. „Hat erschüttert“ erhält das konkrete Bild und passt zugleich zu den schweren sozialen Folgen.
- source_word: διέστησεν
  choice: hat … zerstreut
  rationale: Das Verb bezeichnet ein Trennen oder Auseinanderbringen. Zusammen mit „von Volk zu Volk“ gibt „zerstreut“ die dadurch entstandene räumliche und soziale Trennung natürlich wieder, ohne den Vorgang unnötig zu präzisieren.
- source_word: ἀπὸ ἔθνους εἰς ἔθνος
  choice: von Volk zu Volk
  rationale: Die Wendung beschreibt eine Bewegung oder Verlagerung über Volksgrenzen hinweg. „Volk“ ist für ἔθνος in diesem Zusammenhang natürlich und wahrt dessen Wiederholung.
theological_decisions:
- issue: Deutung der Wendung γλῶσσα τρίτη
  choice: Die wörtliche Formulierung „eine dritte Zunge“ bleibt im Haupttext stehen.
  alternative: Eine verleumderische Zunge; eine doppelzüngige Rede; entzweiende Rede.
  rationale: Der bereitgestellte griechische Text lautet wörtlich „dritte Zunge“. Da die Wendung mehrdeutig und wohl idiomatisch ist, soll keine einzelne Auslegung stillschweigend in den Haupttext aufgenommen werden; mögliche Sinnrichtungen werden in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnliche Wendung „dritte Zunge“ ist bewusst nicht geglättet; Satzbau und Wortwahl bleiben dennoch klar und gut verständlich.
