translation:
  language: de
  text: Beuge deine Schulter und trage sie; ekle dich nicht vor ihren Fesseln.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der hebräische Ausdruck, der hier mit »Fesseln« wiedergegeben wird, ist schwer zu deuten; die griechische Überlieferung hat »ihre Fesseln«.
    reason: textual_variant
lexical_decisions:
- source_word: הַט שִׁכְמְךָ
  choice: Beuge deine Schulter
  rationale: Der Imperativ von נטה und שכם bewahren das konkrete Bild, sich unter eine Last beziehungsweise ein Joch zu stellen; die griechische Parallele bestätigt »Schulter«.
- source_word: וְשָׂאֶהָ
  choice: und trage sie
  rationale: נשׂא bezeichnet hier das Aufnehmen und Tragen; das feminine Objektsuffix verweist auf die personifizierte Weisheit.
- source_word: וְאַל תָּקוֹץ
  choice: ekle dich nicht
  rationale: קוץ drückt Abscheu oder widerwilliges Zurückschrecken aus. Die Wendung ist im heutigen Deutsch natürlich und wahrt die stärkere Empfindung des Hebräischen.
- source_word: בְּתַחְבּוּלוֹתֶיהָ
  choice: vor ihren Fesseln
  rationale: Der überlieferte hebräische Ausdruck ist an dieser Stelle schwierig. Das griechische δεσμοῖς αὐτῆς stützt »ihre Fesseln« und führt das Bild der bindenden, fordernden Zucht der Weisheit fort.
theological_decisions:
- issue: Weibliche Personifikation der Weisheit
  choice: Das feminine Pronomen »sie« wird beibehalten.
  alternative: Die Weisheit sachlich mit »es« wiedergeben oder ausdrücklich wiederholen.
  rationale: Das feminine hebräische Objektsuffix und die griechische Parallele entsprechen der Weisheit als weiblich personifizierter Gestalt im Zusammenhang.
- issue: Textkritisch schwieriges תַחְבּוּלוֹתֶיהָ
  choice: Im Haupttext steht das von der griechischen Parallele gestützte »Fesseln«; die Unsicherheit wird in einer Fußnote offengelegt.
  alternative: »Lenkungen«, »Künste«, »Ratschläge« oder »Zucht« nach möglichen Bedeutungen der hebräischen Form.
  rationale: Die hebräische Lesart ist semantisch auffällig und textkritisch unsicher, während das griechische »Fesseln« ein klares, zum Kontext passendes Belastungs- und Bindungsbild bewahrt. Die Fußnote verhindert, dass diese Klärung als zweifelsfreie hebräische Lesart erscheint.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappen Imperative und das körperliche Bild des Tragens bleiben erhalten; »ekle dich nicht vor« gibt die Abscheu des hebräischen Verbs verständlich wieder.
