translation:
  language: de
  text: Wenn du danach verlangst[a], mein Sohn, wirst du weise werden; und wenn du dein Herz darauf richtest[b], wirst du klug werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Griechisch: „Wenn du willst, Kind, wirst du unterwiesen werden; und wenn du deine Seele hingibst, wirst du gewandt sein.“ Hebräisch und Griechisch stimmen im Gesamtsinn überein; das Griechische betont jedoch Unterweisung, wo das Hebräische davon spricht, weise zu werden.'
    reason: alternative_reading
  - marker: b
    text: Die hebräische Wendung „das Herz darauf richten“ bezeichnet bewusste Aufmerksamkeit und entschlossene Hingabe.
    reason: cultural_note
lexical_decisions:
- source_word: אִם תַּחְפּוֹץ
  choice: Wenn du danach verlangst
  rationale: חפץ bezeichnet Verlangen, Gefallen oder einen willentlichen Wunsch. „Danach“ ergänzt im Deutschen idiomatisch den aus dem Zusammenhang erschlossenen Bezug auf die Weisheit.
- source_word: בְּנִי
  choice: mein Sohn
  rationale: Das Hebräische ist ausdrücklich maskulin Singular und als Anrede formuliert; daher wird die geschlechtsspezifische Form beibehalten.
- source_word: תִּתְחַכָּם
  choice: wirst du weise werden
  rationale: Die Hitpael-Form von חכם bezeichnet hier das Erlangen beziehungsweise die Entwicklung von Weisheit. Die Wiedergabe folgt dem hebräischen Hauptzeugen statt der griechischen Nuance „unterwiesen werden“.
- source_word: וְאִם תָּשִׂים לִבְּךָ
  choice: und wenn du dein Herz darauf richtest
  rationale: Die hebräische Wendung שים לב drückt bewusste Aufmerksamkeit und innere Entschlossenheit aus. Das Bild vom Ausrichten des Herzens bleibt im Deutschen verständlich und bewahrt die Ausdrucksweise des Originals.
- source_word: תַּעֲרֹם
  choice: wirst du klug werden
  rationale: ערם bezeichnet im positiven Weisheitszusammenhang praktische Klugheit oder Umsicht. „Klug“ ist natürlich und würdig, ohne den im Deutschen oft negativen Beiklang von „gerissen“ oder „verschlagen“ einzutragen.
