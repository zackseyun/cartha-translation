  register: Moderne, würdige Standardsprache mit bewahrter hebräischer Herz-Metapher. Der Parallelismus und die direkte Lehrer-Schüler-Anrede bleiben erhalten; „klug“ vermeidet eine unbeabsichtigt negative Färbung.
