translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallelen Körperbilder von Gaumen/Mund und Lippen werden teilweise bewahrt, zugleich wird die schwer verständliche hebräische Syntax idiomatisch erschlossen. Die Fußnoten legen sowohl die Textunsicherheit der ersten Zeile als auch die Mehrdeutigkeit der Grußformel offen.
