translation:
  language: de
  text: Ein angenehmer Mund gewinnt Freunde,[a] und Lippen voller Freundlichkeit erkundigen sich nach dem Wohlergehen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hebräische Wortlaut ist schwierig und bedeutet wörtlich etwa: »mehrt einen Liebenden«. Der griechische Paralleltext liest: »vermehrt seine Freunde«; diesem klareren Sinn folgt die Übersetzung.'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlich etwa: »Lippen der Gunst, die nach Wohlergehen fragen«. Die Wendung kann eine freundliche Begrüßung oder die herzliche Erkundigung nach dem Ergehen eines anderen meinen. Der griechische Paralleltext spricht von »freundlichen Anreden«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵךְ עָרֵב
  choice: ein freundlicher Mund
  rationale: חֵךְ bezeichnet wörtlich den Gaumen bzw. Mund und steht hier als Körperbild für das Reden; עָרֵב bedeutet »angenehm, lieblich, süß«. »Freundlicher Mund« bewahrt das Körperbild und gibt dessen soziale Funktion in natürlichem Deutsch wieder.
- source_word: יַרְבֶּה אוֹהֵב
  choice: gewinnt viele Freunde
  rationale: Der hebräische Wortlaut ist schwierig und lautet formal etwa »mehrt einen Liebenden«. Der griechische Paralleltext hat »wird seine Freunde vermehren«. »Gewinnt viele Freunde« bringt den wahrscheinlichen Sinn verständlich und idiomatisch zum Ausdruck.
- source_word: שִׂפְתֵי חֵן
  choice: wohlwollende Worte
  rationale: Wörtlich »Lippen der Gunst/Anmut«. Da die Lippen metonymisch für das Gesprochene stehen, vermittelt »wohlwollende Worte« die ethisch-soziale Bedeutung von חֵן natürlicher als das im Deutschen ungebräuchliche »Lippen der Anmut«.
- source_word: שׁוֹאֲלֵי שָׁלוֹם
  choice: führen zu herzlichen Grüßen
  rationale: Die Wendung bezeichnet wörtlich Menschen, die nach Frieden bzw. Wohlergehen fragen, und kann freundliches Grüßen oder Erkundigen nach dem Ergehen meinen. Die Wiedergabe versteht die partizipiale Form als Ergebnis wohlwollender Rede; der griechische Paralleltext stützt mit »freundliche Anreden« den sozialen Grußkontext.
