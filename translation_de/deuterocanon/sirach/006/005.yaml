- from: Ein freundlicher Mund gewinnt viele Freunde,[a] und wohlwollende Worte führen zu herzlichen Grüßen.[b]
  to: Ein angenehmer Mund gewinnt Freunde,[a] und Lippen voller Freundlichkeit erkundigen sich nach dem Wohlergehen.[b]
