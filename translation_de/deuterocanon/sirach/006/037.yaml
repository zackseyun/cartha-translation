  text: He will give understanding to your heart[a], and what you have desired will make you wise.
translation:
  language: de
  text: Er wird deinem Herzen Einsicht geben[a], und was du ersehnt hast, wird dich weise machen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Paralleltext lautet: „Er selbst wird dein Herz stärken, und dein Verlangen nach Weisheit wird dir gewährt werden.“ Das hebräische Textzeugnis liest hier dagegen: „Er wird deinem Herzen Einsicht geben, und was du ersehnt hast, wird dich weise machen.“'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהוּא
  choice: Er
  rationale: Das maskuline Singularpronomen bezeichnet im Zusammenhang am ehesten den Herrn. Der griechische Paralleltext stützt diesen persönlichen Bezug ausdrücklich mit αὐτός („er selbst“).
- source_word: יָבִין
  choice: wird … Einsicht geben
  rationale: 'Die Hifil-Form von בין hat hier kausativen Sinn: verstehen lassen beziehungsweise Einsicht verleihen. Die gewählte Formulierung ist natürliches Deutsch und bewahrt diesen Sinn.'
- source_word: לִבֶּךָ
  choice: deinem Herzen
  rationale: לֵב bezeichnet im Hebräischen das innere Zentrum von Denken, Wollen und Entscheiden. „Herz“ bewahrt dieses Menschenbild; „Einsicht geben“ verdeutlicht zugleich die gedankliche Seite.
- source_word: וַאֲשֶׁר
  choice: und was
  rationale: Das Relativwort führt das Ersehnte ein, ohne es ausdrücklich zu benennen. „Was“ erhält diese Offenheit in natürlichem Deutsch.
- source_word: אִוִּיתָה
  choice: du ersehnt hast
  rationale: Das Verb אוה bezeichnet ein Begehren oder Sehnen. „Ersehnt“ gibt die Intensität würdig wieder; das Perfekt drückt die vorausgehende, weiterhin bedeutsame Sehnsucht aus.
- source_word: יְחַכְּמֶךָּ
  choice: wird dich weise machen
  rationale: Die kausative Verbform von חכם bedeutet, jemanden weise zu machen. Die direkte verbale Wiedergabe bleibt näher am Hebräischen als die abstraktere Formulierung „wird dir Weisheit geben“.
theological_decisions:
- issue: Bezug des Pronomens „Er“
  choice: Das Pronomen bezieht sich auf den Herrn.
  alternative: Es könnte isoliert betrachtet auf die Weisheit, das Nachsinnen oder einen nicht näher bestimmten Bezug verweisen.
  rationale: Im hebräischen Teilsatz ist das Bezugswort nicht ausdrücklich genannt. Der griechische Paralleltext spricht jedoch zuvor von den Geboten des Herrn und fährt mit „er selbst“ fort. Daher ist der Herr der wahrscheinlichste Bezug, ohne dass sein Name in den Haupttext ergänzt wird.
- issue: Gegenstand des Ersehnens
  choice: Der Haupttext lässt mit „was du ersehnt hast“ offen, was genau ersehnt wurde.
  alternative: Das Ersehnte ausdrücklich als Weisheit zu bestimmen.
  rationale: Der hebräische Text enthält an dieser Stelle kein ausdrückliches Substantiv für „Weisheit“. Obwohl Zusammenhang und griechischer Paralleltext auf Weisheit weisen, soll die grammatische Offenheit des hebräischen Zeugnisses erhalten bleiben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Einsicht geben“ und „weise machen“ bilden die kausativen hebräischen Verben möglichst unmittelbar ab. „Herz“ bewahrt die hebräische Ausdrucksweise, während „ersehnt“ die Intensität des Verlangens natürlich wiedergibt.
