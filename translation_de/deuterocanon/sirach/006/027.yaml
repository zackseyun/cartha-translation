  text: Search out and investigate; seek[a], and find. Hold fast to her, and do not let her go.
translation:
  language: de
  text: Spüre ihr nach und erforsche sie; suche[a] und finde. Halte an ihr fest und lass sie nicht los.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Paralleltext lautet: „Suche, dann wird sie dir bekannt werden.“ Der hebräische Text sagt unmittelbarer: „Suche und finde.“'
    reason: alternative_reading
lexical_decisions:
- source_word: דְּרֹש
  choice: Spüre ihr nach
  rationale: דרש bezeichnet hier ein aktives, zielgerichtetes Suchen und Nachforschen. „Ihr nachspüren“ bewahrt diese Intensität und unterscheidet sich vom folgenden בקש.
- source_word: וַחֲקֹר
  choice: und erforsche sie
  rationale: חקר meint gründliches Prüfen oder Erforschen. Die Wiedergabe erhält die Steigerung der beiden ersten Aufforderungen.
- source_word: בַּקֵּש
  choice: suche
  rationale: בקש ist das gewöhnliche Verb für „suchen“. Die knappe Wiedergabe bewahrt die Häufung der Suchverben im Hebräischen.
- source_word: וּמְצָא
  choice: und finde
  rationale: Der hebräische Text bietet eine Folge von Imperativen. Daher wird formal „und finde“ wiedergegeben, während die abweichende griechische Lesart in einer Fußnote erscheint.
- source_word: וְהֶחֱזַקְתָּהּ
  choice: Halte an ihr fest
  rationale: Die Hifil-Form von חזק mit femininem Objektsuffix bezeichnet ein festes Ergreifen beziehungsweise beharrliches Festhalten. Die deutsche Wendung ist natürlich und bewahrt das Bild.
- source_word: וְאַל תַּרְפֶּהָ
  choice: und lass sie nicht los
  rationale: רפה bezeichnet das Lockerlassen oder Nachlassen. Im Zusammenhang mit dem vorherigen Festhalten gibt „lass sie nicht los“ das Bild klar wieder.
theological_decisions:
- issue: Bezug der femininen Suffixe
  choice: Die Weisheit wird mit „ihr/sie“ als weiblich personifiziert wiedergegeben.
  alternative: Eine sachliche Wiedergabe mit „daran/es“, bezogen auf Unterweisung oder Erkenntnis.
  rationale: Der nähere Zusammenhang personifiziert die Weisheit als Frau; die femininen hebräischen Suffixe greifen diese Darstellung auf. Die Übersetzung bewahrt das literarische und theologische Bild, ohne es zusätzlich auszudeuten.
- issue: Abweichung zwischen hebräischem und griechischem Text in der Fundklausel
  choice: Der Haupttext folgt der hebräischen Imperativfolge „suche und finde“.
  alternative: 'Nach dem griechischen Paralleltext: „suche, dann wird sie dir bekannt werden“.'
  rationale: Da ein hebräischer Textzeuge mit hoher Konfidenz vorliegt, bildet er die Grundlage. Die inhaltlich bedeutsame griechische Abweichung wird wegen des festgestellten größeren Unterschieds in einer Fußnote dokumentiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die vier Such- und Forschungsaufforderungen bleiben rhythmisch knapp; die weibliche Personifikation der Weisheit sowie das Bild des festen Ergreifens werden beibehalten.
