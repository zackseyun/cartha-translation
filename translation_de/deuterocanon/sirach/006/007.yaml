  text: If you acquire a friend, acquire him through testing, and do not quickly put your trust in him.
translation:
  language: de
  text: Wenn du einen Freund gewinnen willst, dann gewinne ihn durch Erprobung,[a] und vertraue ihm nicht vorschnell.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „gewinne ihn in der Bewährung“. Das hebräische Wort kann eine Prüfung, Erprobung oder Bewährungsprobe bezeichnen; ebenso lässt die Präposition offen, ob die Prüfung als Mittel oder als Situation gemeint ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קָנִיתָ / קְנֵהוּ
  choice: gewinnen willst / gewinne ihn
  rationale: קנה bedeutet grundsätzlich „erwerben, erlangen“. Bei einer Freundschaft gibt „gewinnen“ das Bild des Erlangens natürlich wieder und bewahrt zugleich die Wiederholung des hebräischen Verbs.
- source_word: אוֹהֵב
  choice: Freund
  rationale: אוֹהֵב bezeichnet hier im Zusammenhang eine Person, zu der eine Freundschaftsbeziehung besteht; das griechische φίλον bestätigt diese Bedeutung.
- source_word: בְּנִסָּיוֹן
  choice: indem du ihn prüfst
  rationale: ניסיון bezeichnet Prüfung oder Erprobung. Die Formulierung gibt die instrumentale Bedeutung der Präposition בְּ wieder und macht im Deutschen klar, dass die Verlässlichkeit des möglichen Freundes geprüft werden soll.
- source_word: וְאַל תְּמַהֵר
  choice: nicht vorschnell
  rationale: מהר warnt hier vor übereiltem Handeln. „Vorschnell“ ist knapp, gegenwärtig und entspricht dem mahnenden Ton.
- source_word: לִבְטוֹחַ עָלָיו
  choice: vertraue ihm
  rationale: בטח על bedeutet, auf jemanden zu vertrauen oder sich auf ihn zu verlassen. Das direkte deutsche „jemandem vertrauen“ gibt den Sinn natürlich wieder.
theological_decisions:
- issue: Generisches Maskulinum in der Weisheitsunterweisung
  choice: Singular „einen Freund / ihn / ihm“ beibehalten
  alternative: Geschlechtsneutrale Pluralform oder Doppelnennung
  rationale: Der hebräische und der griechische Text stehen im maskulinen Singular. Die deutsche Fassung bewahrt diese Form, ohne über den allgemeinen Anwendungsbereich der Weisheitsregel hinauszugehen.
- issue: Art der Prüfung eines möglichen Freundes
  choice: Allgemein „prüfen“
  alternative: „in einer Bewährungsprobe gewinnen“ oder „nach einer Prüfung gewinnen“
  rationale: Der Text nennt weder die konkrete Prüfung noch deren Umstände. Die Übersetzung lässt diese inhaltliche Offenheit bestehen.
translation_notes:
  register: Moderne, würdige Weisheitssprache. Die doppelte Verwendung von „gewinnen“ bildet die Wiederholung von קנה ab, vermeidet aber das im Deutschen stark besitzhafte „erwerben“. Der einleitende Wunschsatz gibt die vom griechischen Paralleltext bestätigte Bedingung idiomatisch wieder.
