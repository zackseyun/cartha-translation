    rationale: Die Formulierung klingt wie eine körperliche Beschreibung und kann unnötig an eine „gespaltene“ bzw. gegabelte Zunge denken lassen. Das Griechische bezeichnet eindeutig einen doppelzüngigen Menschen; diese Bedeutung kann ohne Verlust idiomatisch übersetzt werden.
  - severity: low
    issue: „So ist es mit“ gibt die elliptische Schlussfolgerung nur unbestimmt wieder.
    rationale: Die Aussage bezieht sich auf das zuvor genannte Ergehen. „So ergeht es auch …“ macht diesen Zusammenhang im Deutschen klar, ohne eine zusätzliche inhaltliche Behauptung einzuführen.
