review_pass:
  verdict: revise
  source_fidelity: Der Entwurf bildet den längeren griechischen Text einschließlich der Mahnung zutreffend ab und dokumentiert korrekt, dass der erhaltene hebräische Zeuge kürzer ist. Die Metapher von Erben bleibt entsprechend dem griechischen κληρονομήσει erhalten. Die unsichere hebräische Schlussformulierung sollte jedoch nicht durch die spezifische, im Deutschen ungewohnte Bildformulierung „eine gespaltene Zunge haben“ stärker festgelegt werden, als es nötig ist; die griechische Deutung δίγλωσσος lässt sich idiomatisch als „doppelzüngig“ wiedergeben.
  naturalness: „Werde nicht statt eines Freundes zum Feind“ ist verständlich und angemessen. „Ein schlechter Name wird Schande und Schmach erben“ ist absichtlich bildhaft und darf wegen der Quellenlage stehen bleiben. „So ist es mit einem sündigen Menschen, der eine gespaltene Zunge hat“ ist dagegen im Deutschen weniger idiomatisch und schwächer als die klare griechische Charakterisierung. „So ergeht es auch einem doppelzüngigen Sünder“ ist natürlich, wahrt die elliptische Folgerung und macht die Bezugsrelation zur vorangehenden Konsequenz deutlich.
  terminology: „Schande und Schmach“ gibt αἰσχύνη und ὄνειδος bzw. die hebräische Begriffspaarung gut differenziert wieder. „Doppelzüngig“ ist die etablierte moderne deutsche Entsprechung zu δίγλωσσος. „Sünder“ folgt dem griechischen ἁμαρτωλός; die Fußnote hält den abweichenden hebräischen Wortlaut „böser Mensch“ und dessen dunklen Schluss offen.
