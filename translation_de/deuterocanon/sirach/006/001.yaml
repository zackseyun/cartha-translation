base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/006/001.yaml
  text: Do not become an enemy instead of a friend, for an evil name will inherit shame and disgrace[b][a]; so it is with a sinful man of double tongue.
translation:
  language: de
  text: Werde nicht statt eines Freundes zum Feind; denn ein schlechter Name wird Schande und Schmach erben.[a] So ergeht es auch einem doppelzüngigen Sünder.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der erhaltene hebräische Text ist kürzer und lautet ungefähr: »Ein schlechter Name wird Schande und Schmach erben; so auch ein böser Mensch, ein Besitzer von zweien.« Das Griechische fügt die einleitende Warnung hinzu: »Werde nicht statt eines Freundes zum Feind«, und versteht den Schluss als Hinweis auf einen doppelzüngigen Menschen.'
    reason: textual_variant
  - marker: b
    text: 'Wörtlich im Hebräischen etwa: »ein Besitzer von zweien«. Der Ausdruck ist dunkel; das Griechische deutet ihn ausdrücklich als »doppelzüngig«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֵׁם רַע / ὄνομα πονηρόν
  choice: ein schlechter Name
  rationale: Die wörtliche Wendung beider Zeugen bleibt erhalten; im Deutschen ist zugleich erkennbar, dass damit auch der Ruf einer Person gemeint ist.
- source_word: וְקָלוֹן / αἰσχύνη
  choice: Schande
  rationale: Bezeichnet öffentliche Beschämung oder Ehrverlust und lässt sich von dem folgenden Begriff unterscheiden.
- source_word: חֶרְפָּה / ὄνειδος
  choice: Schmach
  rationale: Gibt den Gedanken von Vorwurf, Entehrung und öffentlicher Schande würdig und knapp wieder.
- source_word: תּוֹרִישׁ / κληρονομήσει
  choice: wird … erben
  rationale: Hebräisch und Griechisch stützen die Erbmetapher; sie wird trotz ihrer ungewohnten Ausdrucksweise nicht geglättet.
- source_word: אִישׁ רַע / ὁ ἁμαρτωλός
  choice: ein sündiger Mensch
  rationale: Vermittelt den moralischen Sinn sowohl des hebräischen »bösen Menschen« als auch des griechischen »Sünders«, ohne einen Zeugen ausschließlich zu bevorzugen.
- source_word: בַּעַל שְׁתָּיִם / ὁ δίγλωσσος
  choice: der eine gespaltene Zunge hat
  rationale: Das Griechische deutet die dunkle hebräische Formulierung als Doppelzüngigkeit. Die bildhafte Rede bleibt in verständlichem Deutsch erhalten.
- source_word: ἀντὶ φίλου μὴ γίνου ἐχθρός
  choice: Werde nicht statt eines Freundes zum Feind
  rationale: Der im griechischen Paralleltext klare Mahnsatz wird direkt und natürlich wiedergegeben; im erhaltenen hebräischen Text fehlt er.
theological_decisions:
- issue: Starke Abweichung zwischen dem erhaltenen hebräischen Text und dem griechischen Paralleltext
  choice: Der klare griechische Mahnsatz wird aufgenommen; der gemeinsame Kern wird quellennah übersetzt, und die Abweichung wird in einer Fußnote offengelegt.
  alternative: 'Nur den kürzeren hebräischen Wortlaut übersetzen: »Ein schlechter Name wird Schande und Schmach erben; so ein böser Mensch, ein Besitzer von zweien.«'
  rationale: Der hebräische Zeuge hat Vorrang, ist hier jedoch kürzer und am Ende dunkel. Das Griechische bietet tatsächliche alte Textüberlieferung und klärt den Zusammenhang, ohne dass die Differenz verschwiegen wird.
- issue: Deutung von בַּעַל שְׁתָּיִם
  choice: Doppelzüngigkeit, bildhaft als »eine gespaltene Zunge haben«
  alternative: 'Wörtlich und unbestimmt: »ein Besitzer von zweien«'
  rationale: Die hebräische Form bleibt für sich genommen mehrdeutig; das griechische δίγλωσσος bezeugt früh die Deutung als doppelzüngig. Die Fußnote bewahrt die Unsicherheit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnliche Erbmetapher und die Bildsprache der gespaltenen Zunge bleiben erhalten; textkritische Unsicherheit wird nicht stillschweigend aufgelöst.
