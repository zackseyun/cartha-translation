translation:
  language: de
  text: Es wird deine Blätter verzehren und deine Frucht vernichten[a] und dich wie einen dürren Baum zurücklassen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das Hebräische ist hier schwierig. Der griechische Paralleltext hat sinngemäß: »deine Blätter verzehren und deine Früchte vernichten«.'
    reason: textual_variant
lexical_decisions:
- source_word: עָלֶיךָ
  choice: deine Blätter
  rationale: Der überlieferte hebräische Ausdruck ist schwierig; der griechische Paralleltext τὰ φύλλα σου bestätigt im Zusammenhang mit »Frucht« die Lesart »deine Blätter«.
- source_word: תֹּאכַל
  choice: wird … verzehren
  rationale: Das Verb bedeutet wörtlich »essen« und bezeichnet hier bildhaft eine zerstörerische Wirkung. Das Subjekt »es« ergibt sich aus dem vorangehenden Zusammenhang.
- source_word: וּפֶרְיְךָ תְּשָׁרֵשׁ
  choice: deine Frucht vernichten
  rationale: »Frucht« bewahrt das Baumbild. Das folgende hebräische Verb ist unsicher; der griechische Paralleltext bietet einen Ausdruck für »vernichten/verlieren«. »Vernichten« gibt den sicheren Zerstörungssinn wieder, ohne das schwer verständliche Hebräisch durch »entwurzeln« stärker festzulegen.
- source_word: וְהִנִיחַתְךָ
  choice: dich … zurücklassen
  rationale: Die Kausativform kann hier »zurücklassen« bedeuten. Dies passt zum Ergebnis der beschriebenen Zerstörung und wird durch den griechischen Paralleltext gestützt.
- source_word: כְּעֵץ יָבֵשׁ
  choice: wie einen dürren Baum
  rationale: »Dürr« gibt יָבֵשׁ im natürlichen deutschen Baumbild prägnant wieder und bewahrt die drastische Schlussmetapher.
theological_decisions:
- issue: Verhältnis des schwierigen hebräischen Textes zum griechischen Paralleltext
  choice: Der hebräische Text bleibt maßgeblich; bei den unsicheren Formen verdeutlicht der griechische Paralleltext das zusammenhängende Bild von Blättern, Frucht und dürrem Baum.
  alternative: Das Hebräische isoliert und wörtlich als »Auf dir wird es essen …« wiederzugeben oder vollständig der griechischen Syntax zu folgen.
  rationale: Die isoliert verstandene hebräische Formulierung ergibt an mehreren Stellen keinen klaren Sinn. Der alte griechische Zeuge bestätigt das durchgehende Baumbild, ohne dass dessen reflexive Syntax in die deutsche Übersetzung übernommen werden muss.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe, eindringliche Baum-Metaphorik bleibt erhalten; »dürrer Baum« klingt natürlich und zugleich schriftsprachlich.
