translation:
  language: de
  text: Denke über die Furcht vor dem Höchsten und über seine Gebote nach[a]; sinne beständig nach.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Fassung lautet: „Wenn du einen verständigen Menschen siehst, geh früh zu ihm, und dein Fuß möge die Schwellen seiner Türen abnutzen.“ Der erhaltene hebräische Text weicht hier erheblich vom griechischen ab.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִתְבּוֹנַנְתָּ
  choice: Denke … nach
  rationale: Die Hitpael-Form von בין bezeichnet aufmerksames Betrachten oder reflektierendes Nachdenken. Die deutsche Wendung ist natürlich und bewahrt den besinnlichen Charakter.
- source_word: בְּיִרְאַת עֶלְיוֹן
  choice: über die Furcht vor dem Höchsten
  rationale: יראה bezeichnet in der Weisheitsliteratur ehrfürchtige, religiöse Furcht. „Furcht vor“ ist im heutigen Deutsch eindeutig, während „Furcht des Höchsten“ missverständlich sein könnte; עליון bleibt als etablierter Gottesname „der Höchste“ erhalten.
- source_word: וּבְמִצוֹתָיו
  choice: und über seine Gebote
  rationale: Die wiederholte Präposition verbindet die Gebote als zweiten Gegenstand mit dem vorausgehenden Nachdenken. „Gebote“ wahrt den biblischen und rechtlich-religiösen Gehalt von מצוה.
- source_word: וֶהְגֵה
  choice: sinne … nach
  rationale: הגה kann meditierendes Nachdenken und leises Rezitieren bezeichnen. „Nachsinnen“ gibt den meditativen Sinn in würdigem, verständlichem Deutsch wieder, ohne die mögliche Art der Ausübung unnötig festzulegen.
- source_word: תָמִיד
  choice: beständig
  rationale: תמיד bezeichnet fortdauernde oder regelmäßig wiederkehrende Beschäftigung. „Beständig“ bewahrt diesen durativen Sinn.
theological_decisions:
- issue: Starke Abweichung zwischen dem erhaltenen hebräischen Text und der griechischen Überlieferung
  choice: Der erhaltene hebräische Text bildet den Haupttext; die griechische Fassung wird in einer Fußnote vollständig als abweichende Lesart wiedergegeben.
  alternative: 'Dem griechischen Text folgen: „Wenn du einen verständigen Menschen siehst, geh früh zu ihm, und dein Fuß möge die Stufen seiner Türen abnutzen.“'
  rationale: Für Jesus Sirach hat der erhaltene hebräische Wortlaut Vorrang. Da die griechische Fassung hier nicht nur geringfügig, sondern inhaltlich vollständig abweicht, muss sie zur textgeschichtlichen Transparenz sichtbar bleiben.
- issue: Unausgesprochenes Objekt von וֶהְגֵה
  choice: „sinne beständig nach“ ohne ergänztes Objekt
  alternative: „sinne beständig darüber nach“
  rationale: Im Hebräischen steht das zweite Verb ohne ausdrückliches Objekt. Der deutsche Haupttext erhält diese Offenheit, statt „darüber“ einzufügen und dadurch die vorher genannten Gegenstände ausdrücklich auch dem zweiten Verb zuzuordnen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit verständlicher biblischer Prägung. „Furcht vor dem Höchsten“ vermeidet die Mehrdeutigkeit des Genitivs; „sinne … nach“ erhält den weisheitlich-meditativen Ton. Der Semikolon trennt entsprechend dem Hebräischen das Nachdenken über die beiden genannten Gegenstände vom folgenden, objektlosen Aufruf zum beständigen Nachsinnen.
