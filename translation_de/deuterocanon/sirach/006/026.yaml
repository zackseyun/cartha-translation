translation:
  language: de
  text: Wende dich ihr mit ganzer Seele zu, und halte dich mit deiner ganzen Kraft an ihre Wege.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν πάσῃ ψυχῇ σου
  choice: mit ganzer Seele
  rationale: Gibt die umfassende persönliche Hingabe des griechischen Ausdrucks knapp und würdig wieder.
- source_word: πρόσελθε αὐτῇ
  choice: Wende dich ihr … zu
  rationale: προσέρχομαι bezeichnet das Herantreten oder Sich-Nähern; „sich zuwenden“ klingt im Deutschen natürlich und bewahrt hier den Gedanken bewusster Annäherung.
- source_word: ἐν ὅλῃ δυνάμει σου
  choice: mit deiner ganzen Kraft
  rationale: Entspricht der umfassenden Bedeutung von ὅλῃ und der Kraft bzw. Fähigkeit von δύναμις.
- source_word: συντήρησον τὰς ὁδοὺς αὐτῆς
  choice: halte dich … an ihre Wege
  rationale: συντηρέω kann bewahren, sorgfältig beachten oder einhalten bedeuten. In Verbindung mit „Wege“ vermittelt die Formulierung fortgesetzte treue Orientierung, ohne das Bild einzuebnen.
theological_decisions:
- issue: Personifizierung der Weisheit
  choice: Die weiblichen Pronomen bleiben erhalten.
  alternative: Das Bezugswort „Weisheit“ ausdrücklich ergänzen.
  rationale: Der griechische Vers verwendet αὐτῇ und αὐτῆς und setzt den weiblichen Bezug aus dem Kontext voraus. Eine Ergänzung wäre erklärend und ist für diesen Einzelvers nicht erforderlich.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Weisheitsliteratur-Ton; die parallele Struktur des griechischen Satzes bleibt erhalten.
