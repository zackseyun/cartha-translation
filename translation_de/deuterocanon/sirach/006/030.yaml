translation:
  language: de
  text: Ihr Joch ist goldener Schmuck[a], und ihre Fesseln sind eine blauviolette Schnur[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das Hebräische bewahrt hier das Bild des Jochs; die griechische Parallele betont stärker den Schmuck: „Goldschmuck ist auf ihr“. Die Übersetzung hält beide Bildseiten zusammen.'
    reason: alternative_reading
  - marker: b
    text: 'Auch möglich: „violettblaue Schnur“ oder „hyazinthblaue Schnur“. Das Wort bezeichnet wertvolles blau bis violett gefärbtes Textilmaterial.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֻלֵּי / עֻלָּהּ
  choice: Goldschmuck ist ihr Joch
  rationale: Die hebräische Formulierung verbindet in einem Wortspiel Joch und Schmuck. Die Übersetzung bewahrt das Jochbild aus dem Zusammenhang und zugleich den vom griechischen Paralleltext bestätigten Schmuckcharakter.
- source_word: זָהָב
  choice: Goldschmuck
  rationale: Die kompakte Zusammensetzung klingt im Deutschen natürlich und gibt das Gold als Material des Schmuckes wieder.
- source_word: מוֹסְרוֹתֶיהָ
  choice: ihre Fesseln
  rationale: Das Wort bezeichnet bindende oder fesselnde Vorrichtungen. „Fesseln“ hält das Bild der disziplinierenden Bindung an die personifizierte Weisheit deutlich fest.
- source_word: פְּתִיל
  choice: Schnur
  rationale: Gemeint ist ein gedrehter Faden beziehungsweise eine Schnur. „Schnur“ bewahrt sowohl die konkrete Beschaffenheit als auch die Festigkeit des Bildes.
- source_word: תְּכֵלֶת
  choice: blauviolettes Garn
  rationale: Der Ausdruck bezeichnet kostbares blau bis violett gefärbtes Textilmaterial. „Blauviolett“ wahrt das Farbspektrum, während „Garn“ die stoffliche Bedeutung verständlich macht.
theological_decisions:
- issue: Die Zucht der Weisheit erscheint zugleich als Einschränkung und als Kostbarkeit.
  choice: Joch und Fesseln bleiben ausdrücklich stehen und werden zugleich als Goldschmuck und kostbares farbiges Garn beschrieben.
  alternative: Das Bild entweder rein dekorativ als Schmuck und Halskette oder rein belastend als Joch und Fesseln wiederzugeben.
  rationale: Der hebräische Text und die griechische Parallele halten Belastung, Bindung, Schönheit und Wert bewusst zusammen. Die Übersetzung löst diese Spannung nicht einseitig auf.
translation_notes:
  register: Moderne, würdige Standardsprache. Die vorangestellte Wendung „Goldschmuck ist ihr Joch“ erhält die poetische Prägnanz und die Spannung zwischen Last und Zierde; ungebräuchliche Fachwörter wurden vermieden.
