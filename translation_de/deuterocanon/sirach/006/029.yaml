  text: Its net will become for you a strong refuge[b][a], and its cords garments of fine gold.
translation:
  language: de
  text: Ihr Netz wird dir zu einer festen Zuflucht[a], und ihre Schnüre werden zu Gewändern aus Feingold.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Bild zeigt, wie das, was zunächst einengend erscheint, schließlich Schutz und festen Halt bietet.
    reason: cross_reference
  - marker: b
    text: 'Die griechische Parallele lautet: „Ihre Fesseln werden dir zum starken Schutz und ihre Zweige zu einem Ehrengewand.“ Sie weicht deutlich vom erhaltenen Hebräisch ab, das von „ihrem Netz“, „ihren Schnüren“ und „Gewändern aus Feingold“ spricht.'
    reason: alternative_reading
lexical_decisions:
- source_word: רִשְׁתָּהּ
  choice: ihr Netz
  rationale: רשת bezeichnet ein Netz oder Geflecht. „Netz“ gibt das erhaltene Hebräisch unmittelbar wieder und passt zu den „Schnüren“ im zweiten Satzglied.
- source_word: מְכוֹן עֹז
  choice: eine feste Zuflucht
  rationale: מכון kann einen fest gegründeten Ort, eine Stätte oder einen festen Standort bezeichnen; עז bringt Stärke und Schutz zum Ausdruck. „Feste Zuflucht“ wahrt die Schutzmetapher in natürlichem Deutsch, ohne die mögliche Grundbedeutung vorschnell auf „Fundament“ einzuengen.
- source_word: חַבְלֹתֶיהָ
  choice: ihre Schnüre
  rationale: חבל bedeutet Schnur, Seil oder Strick. „Schnüre“ verbindet sich bildlich sowohl mit dem Netz als auch mit den Gewändern.
- source_word: בִּגְדֵי כָתֶם
  choice: Gewänder aus Feingold
  rationale: בגדים sind Kleider oder Gewänder; כתם bezeichnet erlesenes beziehungsweise feines Gold. Die gehobene Formulierung erhält das kostbare Bild des Hebräischen.
- source_word: וְהָיְתָה לְךָ
  choice: Dann wird … dir zu
  rationale: 'Die Formulierung gibt den zukünftigen beziehungsweise resultativen Sinn idiomatisch wieder: Was zunächst bindend wirkt, erweist sich für den Lernenden als Schutz und Ehre.'
theological_decisions:
- issue: Vorrang des erhaltenen hebräischen Textes gegenüber der deutlich abweichenden griechischen Parallele
  choice: Der Haupttext folgt dem Hebräischen mit „Netz“, „Schnüre“ und „Gewändern aus Feingold“; die griechische Fassung wird in einer Fußnote dokumentiert.
  alternative: 'Nach dem Griechischen: „Ihre Fesseln werden dir zum Schutz der Stärke und ihre Zweige zum Ehrengewand.“'
  rationale: Da für diesen Vers ein hebräischer Text erhalten ist, bildet er die Grundlage. Die griechische Parallele kann auf eine abweichende Vorlage oder eine deutende Wiedergabe zurückgehen. Ihre markante andere Bildsprache bleibt aus Gründen der Transparenz in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallele Satzstruktur und die überraschende Verwandlung einschränkender Bilder in Schutz und kostbare Kleidung bleiben erhalten. „Feingold“ ist gehoben, aber allgemein verständlich.
