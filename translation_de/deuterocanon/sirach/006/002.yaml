  verdict: revise
  source_fidelity: Der erste Satzteil gibt die hebräische Wendung אַל תִּפּוֹל בְּיַד („nicht in die Hand/Gewalt geraten“) idiomatisch und angemessen wieder. נַפְשְׁךָ kann hier kontextgerecht „eigenes Verlangen“ bezeichnen. Der zweite hebräische Satzteil ist jedoch textlich und semantisch unsicher; die vorliegende Fassung legt mit „es“ unbegründet das Verlangen als handelndes Subjekt fest. Der griechische Paralleltext bestätigt eine Warnung vor selbstschädigender Selbstlenkung, hat aber ausdrücklich die „Seele“ und nicht die „Kraft“ als Subjekt des Zerrissenwerdens.
  naturalness: „Gerate nicht in die Gewalt deines eigenen Verlangens“ ist modernes, natürliches Standarddeutsch mit passendem Weisheitston. Die Umstellung zu einer unpersönlichen Passivform im Folgesatz vermeidet den mehrdeutigen und quellenmäßig nicht gesicherten Bezug von „es“, bleibt dabei flüssig und bewahrt die warnende Aussage.
  terminology: „Verlangen“ ist für נפש in diesem Kontext besser als ein metaphysisch missverständliches „Seele“. „Kraft“ ist als Wiedergabe von חיל möglich, auch wenn „Vermögen“ lexikalisch ebenfalls denkbar ist. Die Fußnote muss die griechische Lesart präzise als Paralleltext und nicht als eindeutige Auflösung des hebräischen Wortlauts kennzeichnen.
