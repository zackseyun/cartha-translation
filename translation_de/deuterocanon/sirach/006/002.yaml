  text: Do not fall into the power of your own desire[a], lest your strength be consumed against you.
translation:
  language: de
  text: Gerate nicht in die Gewalt deines eigenen Verlangens,[a] sonst wird deine Kraft zu deinem eigenen Schaden aufgezehrt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Gerate nicht in die Hand deiner Seele.“ Das hebräische Wort für „Seele“ kann hier das eigene Verlangen oder den inneren Trieb bezeichnen. Der zweite Satzteil ist im Hebräischen schwer verständlich. Der griechische Paralleltext lautet: „Überhebe dich nicht im Rat deiner Seele, damit deine Seele nicht wie ein Stier zerrissen wird.“ Die Übersetzung gibt den warnenden Zusammenhang wieder; die genaue Beziehung zwischen dem hebräischen Wortlaut und der griechischen Parallele bleibt unsicher.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תִּפּוֹל בְּיַד
  choice: Gerate nicht in die Gewalt
  rationale: Die Wendung bedeutet wörtlich „Falle nicht in die Hand“, bezeichnet idiomatisch jedoch das Geraten unter eine beherrschende Macht. Die gewählte Formulierung bewahrt das Bild und klingt im Deutschen natürlich.
- source_word: נַפְשְׁךָ
  choice: deines eigenen Verlangens
  rationale: נפש kann in der Weisheitsliteratur das Selbst, den Lebenstrieb, den Appetit oder das Begehren bezeichnen. Im Zusammenhang ist nicht eine metaphysisch verstandene „Seele“, sondern das eigene unbeherrschte Verlangen gemeint.
- source_word: וּתְעַבֶּה
  choice: sonst verzehrt es
  rationale: Die überlieferte hebräische Form und der gesamte zweite Satzteil sind schwer verständlich. Die Wiedergabe bringt den im griechischen Paralleltext klar bezeugten Gedanken selbstzerstörerischer Folgen zum Ausdruck, ohne eine irreführend wörtliche Deutung vorzutäuschen.
- source_word: חֵילֵךָ
  choice: deine Kraft
  rationale: חיל kann Kraft, Vermögen oder Reichtum bedeuten. Hier passt „Kraft“ am besten zur Warnung vor der Zerstörung der eigenen Lebenskraft.
- source_word: עָלֶיךָ
  choice: zu deinem eigenen Schaden
  rationale: Das häufig „auf/über“ bedeutende עַל erhält hier im Warnspruch eine nachteilige, gegen die angesprochene Person gerichtete Bedeutung.
theological_decisions:
- issue: Heranziehung des griechischen Paralleltextes bei einem schwierigen hebräischen Satzteil
  choice: Der Vers warnt davor, sich dem eigenen Verlangen auszuliefern, weil es die eigene Kraft selbstzerstörerisch aufzehrt.
  alternative: 'Eine formalere, aber unklare Wiedergabe wie: „Falle nicht in die Hand deiner Seele, und mäste deine Kraft gegen dich.“'
  rationale: Der hebräische Text bleibt im verständlichen ersten Satzteil maßgeblich; der schwer deutbare zweite Satzteil wird im Licht des griechischen Paralleltextes als Warnung vor Selbstzerstörung wiedergegeben. Die Unsicherheit wird in der Fußnote offengelegt, statt durch eine scheinbar eindeutige Lehrdeutung verdeckt zu werden.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Weisheitston. Das Bild „in die Gewalt geraten“ bewahrt den hebräischen Ausdruck, während der schwierige zweite Satzteil sinngemäß und mit offengelegter Textunsicherheit wiedergegeben wird.
