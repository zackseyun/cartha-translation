translation:
  language: de
  text: Wenn dich Unglück einholt[a], wendet er sich gegen dich und versteckt sich vor dir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Griechisch: „Wenn du erniedrigt wirst“, statt hebräisch: „Wenn dich Unglück einholt“.'
