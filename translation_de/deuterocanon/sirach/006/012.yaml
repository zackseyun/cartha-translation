lexical_decisions:
- source_word: אִם תַּשִּׂיגְךָ רָעָה
  choice: Wenn dich Unglück einholt
  rationale: Die Bedingungspartikel אִם wird mit „wenn“ wiedergegeben. תַּשִּׂיגְךָ bezeichnet ein Erreichen oder Einholen; רָעָה meint hier situationsbedingt Unglück oder Not, nicht moralisch Böses. „Unglück einholt“ bewahrt das anschauliche Bild des Hebräischen.
- source_word: יֵהָפֵךְ בְּךָ
  choice: wendet er sich gegen dich
  rationale: הפך mit ב bezeichnet hier den Umschwung im Verhalten des vermeintlichen Freundes. Die deutsche Wendung gibt den feindseligen Beziehungswechsel natürlich und präzise wieder.
- source_word: וּמִפָּנֶיךָ יִסָּתֵר
  choice: und versteckt sich vor dir
  rationale: מִפָּנֶיךָ bedeutet wörtlich „vor deinem Angesicht/von deiner Gegenwart weg“. In Verbindung mit יִסָּתֵר bezeichnet es, dass der falsche Freund sich dem Betroffenen entzieht. „Sich vor dir verstecken“ ist im Deutschen natürlich und bleibt bildnah.
theological_decisions:
- issue: Abweichung zwischen dem erhaltenen hebräischen Text und der griechischen Überlieferung im Bedingungssatz
  choice: 'Der Haupttext folgt dem Hebräischen: „Wenn dich Unglück einholt“.'
  alternative: 'Nach dem Griechischen: „Wenn du erniedrigt wirst“ oder „Wenn du in eine niedrige Lage gerätst“.'
  rationale: Da ein sicher bezeugter hebräischer Text vorliegt, bildet er die Grundlage des Haupttextes. Die sachlich relevante griechische Abweichung wird in einer Fußnote offengelegt, ohne beide Lesarten miteinander zu vermischen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Formulierung bleibt knapp und sprichwortartig; das männliche Pronomen knüpft an den im Zusammenhang beschriebenen unzuverlässigen Freund an.
