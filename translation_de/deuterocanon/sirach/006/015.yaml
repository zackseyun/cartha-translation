translation:
  language: de
  text: Für einen treuen Freund[a] gibt es keinen Preis, und seine Güte lässt sich nicht aufwiegen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das Hebräische lautet wörtlich: „für einen, der Treue liebt“; die griechische Fassung hat: „einen treuen Freund“.'
    reason: alternative_reading
  - marker: b
    text: 'Die griechische Fassung lautet: „Für seine Schönheit gibt es kein Maß“; „Schönheit“ kann hier auch seine edle Vortrefflichkeit bezeichnen.'
    reason: textual_and_lexical_alternative
lexical_decisions:
- source_word: לְאוֹהֵב אֱמוּנָה
  choice: für einen treuen Freund
  rationale: Der überlieferte hebräische Ausdruck bedeutet wörtlich etwa „für einen, der Treue liebt“. Im Zusammenhang von Sirach 6,14–16 bezeichnet er jedoch wahrscheinlich einen durch Treue gekennzeichneten Freund; dies wird durch das griechische φίλου πιστοῦ bestätigt.
- source_word: אֵין מְחִיר
  choice: gibt es keinen Preis
  rationale: מְחִיר bezeichnet einen Preis oder Tauschwert. Die Formulierung bewahrt das Bild des Hebräischen und drückt aus, dass ein solcher Freund unbezahlbar ist.
- source_word: מִשְׁקָל
  choice: lässt sich nicht aufwiegen
  rationale: מִשְׁקָל gehört zum Bedeutungsfeld von Gewicht und Wiegen. Die verbale deutsche Wendung gibt das Bild natürlich wieder, ohne es zu einem bloß abstrakten „Maß“ abzuschwächen.
- source_word: לְטוֹבָתוֹ
  choice: seine Güte
  rationale: Das hebräische טוֹבָה kann Güte, Gutes, Wohlergehen oder Nutzen bezeichnen. „Güte“ wahrt den hebräischen Wortlaut und die positive Qualität des Freundes; im Zusammenhang schwingt zugleich sein unschätzbarer Wert mit.
