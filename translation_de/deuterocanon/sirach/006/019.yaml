base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/006/019.yaml
  text: Draw near to her like one who plows and reaps[a], and wait for her abundant produce. For in her service you will labor only a little[b], and before long you will eat her fruit.
translation:
  language: de
  text: Tritt an sie heran wie einer, der pflügt und erntet[a], und warte auf ihren reichen Ertrag. Denn in ihrem Dienst wirst du nur wenig Mühe haben, und schon morgen[b] wirst du von ihrer Frucht essen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Überlieferung lautet: „wie einer, der pflügt und sät“, statt „pflügt und erntet“.'
    reason: textual_variant
  - marker: b
    text: 'Wörtlich im Hebräischen: „morgen“. Die griechische Überlieferung hat allgemeiner „schnell“ oder „bald“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּחוֹרֵשׁ וּכְקוֹצֵר
  choice: wie einer, der pflügt und erntet
  rationale: Die verbale Form bewahrt das landwirtschaftliche Bild und folgt dem erhaltenen hebräischen Text; die abweichende griechische Lesart wird in einer Fußnote genannt.
- source_word: קְרַב אֵלֶיהָ
  choice: Tritt an sie heran
  rationale: Gibt den Imperativ des Sich-Näherns natürlich und würdig wieder und erhält die weibliche Personifikation der Weisheit.
- source_word: וְקַוֵּה
  choice: warte auf
  rationale: Das Verb kann Hoffen oder erwartungsvolles Warten bezeichnen; im Bild von Ackerbau und Ertrag passt geduldiges Warten besonders gut.
- source_word: לְרֹב תְּבוּאָתָהּ
  choice: auf ihren reichen Ertrag
  rationale: רֹב bezeichnet die Fülle, תְּבוּאָה den Ertrag oder die Feldfrucht. Die Formulierung ist prägnant und hält das Erntebild fest.
- source_word: בַעֲבֹדָתָהּ מְעַט תַּעֲבוֹד
  choice: in ihrem Dienst wirst du nur wenig Mühe haben
  rationale: עבודה umfasst Arbeit und Dienst. Wegen der personifizierten Weisheit wahrt „Dienst“ die Beziehungsebene; „Mühe haben“ gibt den hier gemeinten geringen Arbeitsaufwand verständlich wieder.
- source_word: וּלְמָחָר
  choice: und schon morgen
  rationale: Die Hauptübersetzung erhält die konkrete hebräische Zeitangabe „morgen“. „Schon“ macht den Sinn baldiger Belohnung im Deutschen deutlich, ohne die Metapher stillschweigend zu verallgemeinern; die griechische Parallele wird vermerkt.
- source_word: תֹּאכַל פִּרְיָהּ
  choice: wirst du von ihrer Frucht essen
  rationale: Bewahrt sowohl das Erntebild als auch die feminine Personifikation der Weisheit.
theological_decisions:
- issue: Weibliche Personifikation der Weisheit
  choice: Durchgehend feminine Bezüge („sie“, „ihr“)
  alternative: Die Weisheit unpersönlich mit „es“ wiedergeben
  rationale: Das Hebräische personifiziert die Weisheit in diesem Zusammenhang als Frau; die Übersetzung erhält diese literarisch und theologisch bedeutsame Gestalt.
- issue: Abweichung zwischen hebräischem und griechischem Landwirtschaftsbild
  choice: Im Haupttext dem Hebräischen „pflügt und erntet“ folgen
  alternative: Nach dem Griechischen „pflügt und sät“
  rationale: Der erhaltene hebräische Text ist hier die primäre Grundlage. Die griechische Lesart ist bedeutsam, wird aber als Textvariante in der Fußnote bewahrt.
- issue: Zeitangabe למחר
  choice: Die wörtliche hebräische Angabe „schon morgen“ im Haupttext bewahren
  alternative: Sinngemäß „bald“ oder „in Kürze“ nach der griechischen Parallele
  rationale: Die konkrete Zeitangabe des Hebräischen sollte nicht ohne Not aufgelöst werden. „Schon morgen“ kann im Deutschen zugleich die verheißene zeitliche Nähe ausdrücken; die abweichende griechische Formulierung wird transparent vermerkt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem weisheitlichem Ton. Die landwirtschaftliche Bildsprache und die weibliche Personifikation bleiben erhalten. Die konkrete hebräische Zeitangabe steht im Haupttext; die griechischen Abweichungen werden knapp dokumentiert.
