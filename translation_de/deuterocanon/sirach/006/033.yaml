translation:
  language: de
  text: Wenn du bereit bist zuzuhören[a] und dein Ohr neigst, wirst du unterwiesen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der erhaltene hebräische Text ist kürzer als die griechische Fassung. Diese lautet sinngemäß: „Wenn du gern zuhörst, wirst du [Unterweisung] annehmen, und wenn du dein Ohr neigst, wirst du weise sein.“'
    reason: textual_variant
lexical_decisions:
- source_word: אִם תּוֹבֵא לִשְׁמֹעַ
  choice: Wenn du bereit bist zuzuhören
  rationale: Die ungewöhnliche hebräische Form bezeichnet im Zusammenhang die Bereitschaft beziehungsweise den Wunsch zu hören. Die griechische Parallele ἐὰν ἀγαπήσῃς ἀκούειν („wenn du das Hören liebst“) stützt diese voluntative Bedeutung.
- source_word: וְתֵט אָזְנְךָ
  choice: und dein Ohr neigst
  rationale: Die im Hebräischen geläufige Metapher für aufmerksames Zuhören bleibt erhalten und ist auch im Deutschen verständlich.
- source_word: תִּוָּסֵר
  choice: wirst du unterwiesen
  rationale: Die Form von יסר bezeichnet hier das Empfangen von Unterweisung oder Zurechtweisung. „Unterwiesen“ wahrt die Passivbedeutung, ohne den Ausdruck unnötig auf Bestrafung zu verengen.
