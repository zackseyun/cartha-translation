  text: For in the end you will find its rest[b][a], and it will turn for you into delight.
translation:
  language: de
  text: Denn am Ende[a] wirst du ihre Ruhe[b] finden, und sie wird sich für dich in Freude verwandeln.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch wörtlich etwa »danach« oder »später«; die griechische Überlieferung hat »zuletzt«. Gemeint ist der schließlich eintretende Ausgang.
    reason: lexical_alternative
  - marker: b
    text: Die weiblichen Formen beziehen sich im Zusammenhang auf die personifizierte Weisheit. »Ihre Ruhe« kann die Ruhe bezeichnen, die zu ihr gehört oder die man bei beziehungsweise durch sie findet.
    reason: ambiguity
lexical_decisions:
- source_word: לְאָחוֹר
  choice: am Ende
  rationale: 'Das hebräische Wort bezeichnet wörtlich das Danach- oder Rückwärtige und hat hier zeitlichen Sinn: »später, schließlich«. Die griechische Parallele ἐπ᾽ ἐσχάτων stützt »am Ende« als Hinweis auf den Ausgang beharrlichen Lernens.'
- source_word: תִּמְצָא
  choice: wirst du … finden
  rationale: Die direkte Zukunftsaussage von מצא wird in natürlichem modernem Deutsch wiedergegeben.
- source_word: מְנוּחָתָהּ
  choice: ihre Ruhe
  rationale: Die feminine Endung verweist im Zusammenhang auf die personifizierte Weisheit. Die formal nahe Wiedergabe bewahrt zugleich die mögliche Spannung zwischen der Ruhe, die zu ihr gehört, und der Ruhe, die man bei oder durch sie findet.
- source_word: וְתֵהָפֵךְ
  choice: sie wird sich … verwandeln
  rationale: הפך bezeichnet ein Wenden oder Verwandeln. Die reflexive deutsche Form gibt den resultativen Übergang zur Freude natürlich wieder, ohne ihn zum bloßen »Werden« abzuflachen.
- source_word: לְךָ
  choice: für dich
  rationale: Der Dativ bezeichnet hier die persönliche Wirkung beziehungsweise den Nutzen für den Angesprochenen.
- source_word: לְתַעֲנוּג
  choice: in Freude
  rationale: תענוג bezeichnet Freude, Wonne oder Genuss. »Freude« ist verständlich, würdig und passt zur resultativen Konstruktion »sich in … verwandeln«.
theological_decisions:
- issue: Bezug der femininen Formen in »ihre Ruhe« und »sie wird sich … verwandeln«
  choice: Die Formen werden auf die im Zusammenhang personifizierte Weisheit bezogen.
  alternative: Sie können sinngemäß auf den Umgang mit der Weisheit beziehungsweise auf ihre anfangs beschwerliche Unterweisung bezogen werden.
  rationale: Der unmittelbare Kontext stellt die Weisheit als weibliche Gestalt dar, und auch die griechische Parallele bewahrt den femininen Bezug. Die Übersetzung lässt offen, ob streng die Weisheit selbst oder die Erfahrung ihrer Unterweisung zur Freude wird.
translation_notes:
  register: Modernes, gehobenes Standarddeutsch mit direkter Anrede. Die feminine Personifikation der Weisheit bleibt sichtbar; die knappe Bildsprache von Ruhe, Verwandlung und Freude wird erhalten.
