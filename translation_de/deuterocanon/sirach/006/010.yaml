base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/006/010.yaml
  text: There is a friend who is a table-companion[b][a], but he will not be found in a day of trouble.
translation:
  language: de
  text: Mancher Freund ist ein Tischgefährte[a], doch am Tag des Unglücks wird er nicht zu finden sein[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „ein Freund des Tisches“. Die griechische Parallelüberlieferung lautet „ein Teilhaber an Tischen“ und verdeutlicht, dass jemand gemeint ist, der die Mahlzeiten mit einem teilt.'
    reason: lexical_alternative
  - marker: b
    text: Der hebräische Text sagt „wird nicht gefunden werden“; die griechische Parallelüberlieferung hat „wird nicht bleiben“. Beide Lesarten beschreiben, dass ein solcher Freund in der Not nicht da ist.
    reason: alternative_reading
lexical_decisions:
- source_word: יֵשׁ אוֹהֵב חָבֵר שֻׁלְחָן
  choice: Mancher Freund ist ein Tischgefährte
  rationale: Die knappe hebräische Wendung bezeichnet einen Menschen, dessen Freundschaft sich in der Tischgemeinschaft zeigt. „Mancher Freund“ gibt die einleitende Existenzformel יֵשׁ idiomatisch wieder; „Tischgefährte“ bewahrt das konkrete Bild, ohne es deutend zu „Schönwetterfreund“ auszuweiten.
- source_word: וְלֹא יִמָּצֵא
  choice: wird er nicht zu finden sein
  rationale: Das Nifal von מצא bedeutet hier wörtlich „gefunden werden“. Die Formulierung hält sich an den vorrangigen hebräischen Text und bringt zugleich natürlich zum Ausdruck, dass der Betreffende in der Not nicht da ist.
- source_word: בְּיוֹם רָעָה
  choice: am Tag des Unglücks
  rationale: רָעָה bezeichnet hier widrige Umstände oder Unheil, nicht moralische Bosheit. „Am Tag des Unglücks“ bewahrt das Zeitbild des Hebräischen und entspricht dem griechischen Hinweis auf Bedrängnis.
