  text: It will be upon him like a heavy stone[a], and he will not delay to throw it off.
translation:
  language: de
  text: Wie ein schwerer Stein[a] wird sie auf ihm lasten, und er wird nicht zögern, sie abzuwerfen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „wie ein Laststein“. Die griechische Parallele lautet: „wie ein starker Stein der Erprobung“ und hebt damit zusätzlich den Gedanken der Bewährung hervor.'
    reason: alternative_reading
lexical_decisions:
- source_word: כְּאֶבֶן מַשָּׂא
  choice: wie ein schwerer Stein
  rationale: Die Vergleichspartikel כְּ wird mit „wie“ wiedergegeben. מַשָּׂא bezeichnet eine Last oder Bürde; „schwerer Stein“ vermittelt das Lastbild im natürlichen Deutschen, während das wörtliche „Laststein“ ungebräuchlich wäre.
- source_word: תִּהְיֶה עָלָיו
  choice: wird sie auf ihm lasten
  rationale: Die feminine Verbform wird durch „sie“ bewahrt und verweist im Zusammenhang auf die Weisheit beziehungsweise Unterweisung. „Auf ihm lasten“ gibt sowohl die Lagebeziehung als auch die Gewichtsmetapher idiomatisch wieder.
- source_word: וְלֹא יְאַחֵר
  choice: und er wird nicht zögern
  rationale: Das Hifil von אחר bedeutet hier „zögern“ oder „sich verspäten“. Vor dem folgenden Infinitiv ist „nicht zögern“ im Deutschen natürlich.
- source_word: לְהַשְׁלִיכָה
  choice: sie abzuwerfen
  rationale: Das Verb bedeutet „werfen, wegwerfen“. Das feminine Suffix wird als „sie“ wiedergegeben; „abwerfen“ passt zugleich zum Bild einer drückenden Last.
theological_decisions:
- issue: Verhältnis des hebräischen Lastbildes zur griechischen Lesart der Erprobung
  choice: Das hebräische Lastbild steht im Haupttext; die zusätzliche griechische Nuance wird in einer Fußnote dokumentiert.
  alternative: „Wie ein schwerer Stein der Erprobung wird sie auf ihm lasten“
  rationale: Der erhaltene hebräische Text nennt eine Last, nicht ausdrücklich eine Erprobung. Die griechische Parallele ist wichtig für die Textgeschichte und mögliche Deutung, sollte ihre zusätzliche Nuance aber nicht unmarkiert in den hebräisch begründeten Haupttext eintragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das feminine Pronomen „sie“ hält den Bezug auf die Weisheit beziehungsweise Unterweisung offen und bewahrt zugleich die grammatische Form des Hebräischen.
