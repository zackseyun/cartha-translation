translation:
  language: de
  text: Lege deine Füße in ihre Fußfesseln und deinen Hals in ihre Halsfessel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der hier überlieferte hebräische Text weicht grundlegend ab und scheint nicht diesem Vers zu entsprechen. Die Übersetzung folgt daher der griechischen Überlieferung.
    reason: Die angegebene hebräische Fassung ist als erhebliche Textabweichung gekennzeichnet und stimmt weder mit der griechischen Parallelüberlieferung noch mit dem Verszusammenhang überein.
lexical_decisions:
- source_word: πέδας
  choice: Fesseln
  rationale: Das griechische Wort bezeichnet Fußfesseln; die Wiedergabe bewahrt das konkrete Bild der freiwillig angenommenen Zucht der Weisheit.
- source_word: κλοιόν
  choice: Halseisen
  rationale: κλοιός bezeichnet einen Halsring beziehungsweise eine Halsfessel. „Halseisen“ erhält das Bild der Gefangenenfessel genauer als „Joch“ und klingt im Deutschen natürlicher und deutlicher als das mehrdeutige „Halsband“.
- source_word: εἴσενεγκον
  choice: Lege … in
  rationale: Der griechische Imperativ fordert dazu auf, die Füße bewusst in die Fesseln hineinzubringen. Die deutsche Formulierung ist unmittelbar und bewahrt die aktive, freiwillige Handlung.
theological_decisions:
- issue: Personifizierung der Weisheit
  choice: Die femininen Bezüge „ihre“ und „ihr“ bleiben erhalten.
  alternative: Die Weisheit ausdrücklich im Vers nennen.
  rationale: Der Vers setzt den weiblichen Bezug aus dem Zusammenhang fort. Eine ausdrückliche Ergänzung würde mehr sagen als der überlieferte Vers.
- issue: Bild von Unterordnung und Zucht
  choice: Die harten Bilder „Fesseln“ und „Halseisen“ werden nicht abgeschwächt.
  alternative: Freier mit „nimm ihre Weisung an“ übersetzen.
  rationale: Der griechische Text verwendet bewusst drastische Fesselbilder. Ihre Spannung soll nicht durch eine erklärende Paraphrase aufgelöst werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der parallele Imperativ und die anschauliche Fesselmetaphorik bleiben erhalten; „Halseisen“ vermeidet sowohl das heute meist tierbezogene „Halsband“ als auch die sachlich weniger genaue Deutung „Joch“.
