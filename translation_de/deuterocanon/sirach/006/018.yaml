translation:
  language: de
  text: Mein Sohn[a], nimm von deiner Jugend an Unterweisung an, und bis zu grauem Haar wirst du Weisheit erlangen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Griechischen steht „wähle Unterweisung“, während der hebräische Text „nimm Unterweisung an“ lautet. Hier wird dem hebräischen Text gefolgt; beide Fassungen rufen dazu auf, sich von Jugend an prägen und unterweisen zu lassen.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּנִי
  choice: Mein Sohn
  rationale: Die hebräische Anrede ist ausdrücklich männlich und entspricht der väterlichen Lehrrede Ben Siras; sie wird daher nicht neutralisiert.
- source_word: מִנְּעוּרֶיךָ
  choice: von deiner Jugend an
  rationale: Die Wendung bezeichnet den Beginn in jungen Jahren und klingt im modernen Deutschen natürlich.
- source_word: קַח לֶקַח
  choice: nimm … Unterweisung an
  rationale: קַח bedeutet wörtlich „nimm“, während לֶקַח Lehre oder Unterweisung bezeichnet. Die feste deutsche Wendung „Unterweisung annehmen“ gibt sowohl den aktiven Imperativ als auch den Bildungssinn wieder.
- source_word: וְעַד שֵׂיבָה
  choice: bis ins hohe Alter
  rationale: שֵׂיבָה bezeichnet wörtlich graues Haar und metonymisch das Greisenalter. „Bis ins hohe Alter“ ist idiomatisch und bewahrt den zeitlichen Lebensbogen.
- source_word: תַּשִּׂיג
  choice: wirst du … erlangen
  rationale: Das Verb bezeichnet das Erreichen oder Erlangen eines Ziels; hier ist Weisheit das Ergebnis langjähriger Unterweisung.
- source_word: חָכְמָה
  choice: Weisheit
  rationale: Dies ist die übliche und kontextgerechte Wiedergabe des zentralen Begriffs der Weisheitsliteratur.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Weisheitsrede. Die männliche Anrede des hebräischen Textes bleibt erhalten. „Bis ins hohe Alter“ gibt das Bild des grauen Haares idiomatisch wieder; das Semikolon und „dann“ verdeutlichen den im Vers angelegten Zusammenhang zwischen früher Unterweisung und später erlangter Weisheit.
