  text: Be eager to hear every discourse[a], and do not let a proverb of understanding escape you.
translation:
  language: de
  text: Höre dir jedes Gespräch gern an,[a] und lass dir keinen verständigen Spruch entgehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Parallelüberlieferung lautet: „Halte dich zu einer großen Zahl von Ältesten; und wer ist weise? Schließe dich ihm an.“ Der erhaltene hebräische Text weicht hier deutlich ab; der Haupttext folgt dem Hebräischen.'
    reason: alternative_reading
lexical_decisions:
- source_word: כָּל שִׂיחָה
  choice: jedem Gespräch
  rationale: כָּל ist hier distributiv wiedergegeben. שִׂיחָה bezeichnet Rede oder Gespräch; „Gespräch“ ist im modernen Deutsch natürlich und bleibt weit genug für einen Austausch mit belehrendem Gehalt.
- source_word: חֲפוֹץ לִשְׁמֹעַ
  choice: Höre … mit Freude zu
  rationale: חפץ drückt Verlangen oder Gefallen aus, während שמע hier aufmerksames Hören meint. Die Formulierung gibt den auffordernden Sinn idiomatisch wieder, ohne bloße akustische Wahrnehmung nahezulegen.
- source_word: וּמְשַׁל
  choice: und … keinen … Spruch
  rationale: מָשָׁל kann Sprichwort, Sinnspruch oder vergleichenden Ausspruch bezeichnen. „Spruch“ bewahrt diese Bedeutungsbreite besser als das stärker festgelegte „Sprichwort“.
- source_word: בִּינָה
  choice: verständigen
  rationale: Das Substantiv „Einsicht/Verständnis“ bestimmt den Spruch näher. Das deutsche Adjektiv ist natürlich und lässt offen, ob vor allem dessen Inhalt oder Herkunft als einsichtsvoll gekennzeichnet wird.
- source_word: אַל יֵצְאֶךָּ
  choice: lass dir … nicht entgehen
  rationale: Die hebräische Wendung warnt davor, dass etwas dem Angesprochenen entgeht. Die idiomatische deutsche Fassung erhält diesen Sinn ohne unnatürliche Wörtlichkeit.
theological_decisions:
- issue: Deutliche Abweichung zwischen dem erhaltenen hebräischen Text und der griechischen Parallelüberlieferung
  choice: Der Haupttext folgt dem erhaltenen hebräischen Zeugen.
  alternative: „Stell dich in die Gemeinschaft der Ältesten; und wenn einer weise ist, schließe dich ihm an.“
  rationale: Da für diesen Vers ein hoch bewerteter hebräischer Text erhalten ist, hat er als ausgangssprachlicher Zeuge Vorrang. Die griechische Fassung bezeugt eine verwandte Weisheitsmahnung, bietet aber einen deutlich anderen Wortlaut und wird deshalb transparent in der Fußnote genannt, nicht in den Haupttext eingearbeitet.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Mit Freude zuhören“ bringt die auffordernde Verbindung von Verlangen und Hören natürlich zum Ausdruck; „verständiger Spruch“ wahrt den Charakter der Weisheitsliteratur. Der Fußnotenmarker steht unmittelbar bei der Aussage, zu der die abweichende griechische Überlieferung gehört.
