review_pass:
  verdict: revise
  source_fidelity: Der Haupttext folgt zutreffend dem erhaltenen hebräischen Text und übernimmt nicht den abweichenden griechischen Wortlaut. „Mit Freude“ ist für חָפֵץ jedoch etwas zu stark auf Freude/Genuss eingeengt; die Aufforderung betrifft eher bereitwilliges bzw. gern erfolgendes Zuhören. Die Fußnote gibt die griechische Parallele im Grundsatz richtig wieder, sollte aber πλήθει als „große Zahl/Menge“ und τίς σοφός als offene Frage („wer ist weise?“) genauer abbilden.
  naturalness: „Höre dir jedes Gespräch gern an“ ist modernes, flüssiges Standarddeutsch und gibt die Verbindung von Hörbereitschaft und aufmerksamem Zuhören idiomatisch wieder. „Verständiger Spruch“ ist verständlich und dem Weisheitsregister angemessen.
  terminology: „Gespräch“ ist als weite Wiedergabe von שִׂיחָה vertretbar. „Spruch“ bewahrt bei מָשָׁל die notwendige Offenheit besser als „Sprichwort“. „Verständiger“ gibt בִּינָה angemessen wieder, ohne die etwas offene genitivische Beziehung zu überdeuten.
  issues:
  - severity: low
    issue: „mit Freude“ verengt חָפֵץ
    rationale: Das hebräische Wort bezeichnet Wollen, Gefallen oder Begierde. „Gern“ bewahrt den positiven, auffordernden Sinn, ohne ausdrücklich Freude als Gefühlszustand zu behaupten.
  - severity: medium
    issue: Die Übersetzung der griechischen Parallelüberlieferung ist nicht ganz genau
    rationale: ἐν πλήθει πρεσβυτέρων verlangt „bei/in einer großen Zahl von Ältesten“, nicht lediglich „in die Gemeinschaft der Ältesten“. τίς σοφός ist als Frage „wer ist weise?“ formuliert, nicht als Konditionalsatz.
  revised_text: Höre dir jedes Gespräch gern an,[a] und lass dir keinen verständigen Spruch entgehen.
