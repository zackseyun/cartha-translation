translation:
  language: de
  text: Höre, mein Kind, und nimm meine Weisung an; weise meinen Rat nicht zurück.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hier überlieferte hebräische Satz scheint nicht zu diesem Vers zu gehören oder verderbt zu sein. Die Übersetzung folgt daher dem kohärenten griechischen Paralleltext: „Höre, Kind, und nimm meine Weisung an; weise meinen Rat nicht zurück.“'
