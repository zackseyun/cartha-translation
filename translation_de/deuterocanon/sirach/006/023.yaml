lexical_decisions:
- source_word: ἄκουσον
  choice: Höre
  rationale: Der Imperativ fordert nicht nur akustisches Hören, sondern aufmerksames Beachten; „Höre“ bewahrt die knappe, würdige Form der Weisheitsunterweisung.
- source_word: τέκνον
  choice: mein Sohn
  rationale: Das griechische Wort bedeutet allgemein „Kind“. In der persönlichen Anrede eines Weisheitslehrers an seinen Schüler gibt „mein Sohn“ die damalige Lehrsituation und den Singular im Deutschen natürlich wieder; die breitere Wortbedeutung wird in Fußnote [a] offengelegt.
- source_word: δέξαι
  choice: nimm … an
  rationale: Die Wendung bezeichnet die willige Aufnahme des Gesagten und klingt im modernen Deutsch natürlicher als das wörtlichere „empfange“.
- source_word: γνώμην
  choice: Einsicht
  rationale: γνώμη kann Urteil, Auffassung oder überlegte Einsicht bezeichnen. „Einsicht“ erhält den Gedanken wohlüberlegter Weisung, ohne wie „Urteil“ nach einem richterlichen Spruch zu klingen.
- source_word: ἀπαναίνου
  choice: weise … nicht zurück
  rationale: Das Verb bedeutet ablehnen oder verweigern. „Nicht zurückweisen“ wahrt die Kraft des verneinten Imperativs und verbindet sich idiomatisch mit „Rat“.
- source_word: συμβουλίαν
  choice: Rat
  rationale: „Rat“ ist die klare, gegenwärtige Entsprechung für beratende Anleitung und passt zum Register der Weisheitsliteratur.
theological_decisions:
- issue: Textgrundlage bei einem nicht zu Sirach 6,23 passenden hebräischen Textzeugen
  choice: Der kohärente griechische Paralleltext wird als operative Textgrundlage übersetzt; die Abweichung des vorgelegten hebräischen Textes wird ausdrücklich vermerkt.
  alternative: 'Den vorgelegten hebräischen Satz als Sirach 6,23 übersetzen: „Ein Gefäß des Töpfers …“'
  rationale: Der hebräische Satz handelt von einem Töpfergefäß, einem Ofen und der Prüfung eines Menschen und entspricht weder dem griechischen Wortlaut noch dem Zusammenhang dieses Verses. Der griechische Text bietet dagegen eine zusammenhängende Mahnung, die an die umgebende Weisheitsunterweisung anschließt. Die Unsicherheit wird nicht verdeckt, sondern in Fußnote [b] dokumentiert.
translation_notes:
  register: Knappe, eindringliche Weisheitsunterweisung in modernem, würdigem Standarddeutsch. Das Semikolon bildet die Zweiteilung der Mahnung ab. „Einsicht“ und „Rat“ halten die beiden griechischen Begriffe auseinander, ohne unnatürlich oder fachsprachlich zu wirken.
