lexical_decisions:
- source_word: בְּטוֹבָתְךָ
  choice: in deinem Wohlergehen
  rationale: טוֹבָה bezeichnet hier günstige Lebensumstände und steht im Gegensatz zu רָעָה. „Wohlergehen“ wahrt die breite Bedeutung, ohne sie auf materiellen Wohlstand zu verengen.
- source_word: הוּא כָמוֹךָ
  choice: ist er wie du
  rationale: 'Die einfache Vergleichsformulierung bleibt bewusst offen: Der vermeintliche Freund gleicht sich dem Angesprochenen in guten Zeiten an. Auch die griechische Überlieferung stützt diesen Wortlaut.'
- source_word: וּבְרָעָתְךָ
  choice: doch in deinem Unglück
  rationale: רָעָה meint im Gegensatz zu טוֹבָה widrige Umstände oder Not. „Doch“ gibt den adversativen Sinn des Parallelismus natürlich wieder.
- source_word: יִתְנַדֶּה מִמֶּךָּ
  choice: zieht er sich von dir zurück
  rationale: Die reflexive Verbform bezeichnet ein Sich-Distanzieren oder Sich-Absondern. Die deutsche Wendung ist natürlich und bewahrt die bewusste Entfernung vom Betroffenen.
