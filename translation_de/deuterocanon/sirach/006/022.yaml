  text: For discipline is true to its name[a], and it is not evident to many.
translation:
  language: de
  text: Denn die Unterweisung entspricht ihrem Namen[a], und vielen ist sie nicht offenbar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Paralleltext lautet: „Denn die Weisheit entspricht ihrem Namen, und vielen ist sie nicht offenbar.“ Der hebräische Text hat hier „Unterweisung“ statt „Weisheit“.'
    reason: alternative_reading
lexical_decisions:
- source_word: הַמּוּסָר
  choice: die Unterweisung
  rationale: מוּסָר bezeichnet erziehende Unterweisung, Zurechtweisung oder Disziplin. „Unterweisung“ gibt den hebräischen Hauptzeugen verständlich und ohne unnötig strafenden Beiklang wieder; die abweichende griechische Lesart „Weisheit“ wird in der Fußnote dokumentiert.
- source_word: בִּשְׁמָהּ כֵּן הִיא
  choice: sie entspricht ihrem Namen
  rationale: Die Wendung bedeutet wörtlich etwa „ihrem Namen gemäß ist sie“. Die gewählte Formulierung bewahrt den Bezug zwischen Wesen und Benennung in natürlichem Deutsch.
- source_word: נְכוֹחָה
  choice: offenbar
  rationale: Im Zusammenhang bezeichnet das Wort etwas Klares oder Erkennbares. „Offenbar“ stimmt zudem mit dem griechischen φανερά überein, ohne die Aussage stärker auszudeuten.
- source_word: לְרַבִּים
  choice: vielen
  rationale: Die knappe Dativform gibt „für/gegenüber vielen“ idiomatisch wieder.
theological_decisions:
- issue: Abweichung zwischen dem hebräischen und dem griechischen Hauptbegriff
  choice: Im Haupttext steht nach dem hebräischen Zeugnis „Unterweisung“.
  alternative: Der griechische Paralleltext liest „Weisheit“.
  rationale: Wo Sirach auf Hebräisch erhalten ist, erhält der hebräische Text Vorrang. Da die Abweichung inhaltlich erheblich ist, wird die griechische Lesart nicht stillschweigend angeglichen, sondern in einer Fußnote bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Unterweisung“ ist allgemein verständlich und erfasst den erzieherischen Sinn von מוּסָר; „offenbar“ wahrt die knappe, leicht spruchhafte Form des Verses.
