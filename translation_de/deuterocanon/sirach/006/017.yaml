  text: For as he is[a], so is his friend, and as his name, so are his deeds.
translation:
  language: de
  text: Denn wie er ist, so ist auch sein Freund; und wie sein Name, so sind seine Taten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Griechisch: „Wer den Herrn fürchtet, richtet seine Freundschaft recht aus; denn wie er ist, so ist auch sein Nächster.“ Der hebräische Text weicht hier besonders im ersten Satzteil erheblich ab.'
    reason: alternative_reading
lexical_decisions:
- source_word: כָמוֹהוּ
  choice: wie einer ist
  rationale: Die hebräische Vergleichsform bedeutet hier am natürlichsten „wie er/einer ist“. Das unbestimmte „einer“ macht den sprichwörtlichen Bezug im Deutschen klar, ohne den knappen Sinn zu erweitern.
- source_word: רֵעֵהוּ
  choice: sein Freund
  rationale: רֵעַ kann Freund, Gefährte oder Nächster bedeuten. Im Zusammenhang des Abschnitts über Freundschaft ist „Freund“ die treffendste Wiedergabe.
- source_word: כִּשְׁמוֹ
  choice: wie sein Name
  rationale: Die wörtliche Wiedergabe bewahrt die knappe Bildsprache. „Name“ kann den Ruf einschließen, doch diese Deutung wird nicht ausdrücklich in den Haupttext eingetragen.
- source_word: מַעֲשָׂיו
  choice: seine Taten
  rationale: מַעֲשִׂים bezeichnet Handlungen oder Taten. „Taten“ ist in deutscher Weisheitsliteratur natürlich und bewahrt den möglichen moralischen Klang.
theological_decisions:
- issue: Hebräischer Text gegenüber der erheblich abweichenden griechischen Überlieferung
  choice: Der erhaltene hebräische Wortlaut bildet den Haupttext.
  alternative: 'Griechisch: „Wer den Herrn fürchtet, richtet seine Freundschaft recht aus; denn wie er ist, so ist auch sein Nächster.“'
  rationale: Da ein hebräischer Text erhalten ist, wird er vorrangig übersetzt. Die griechische Fassung weicht besonders im ersten Satzteil erheblich ab und wird deshalb transparent in einer Fußnote dokumentiert, ohne beide Überlieferungen zu vermischen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper sprichwörtlicher Satzform. Das „auch“ verdeutlicht die Entsprechung zwischen Mensch und Freund; die wörtliche Wendung „wie sein Name“ wahrt die Mehrdeutigkeit zwischen Name und Ruf.
