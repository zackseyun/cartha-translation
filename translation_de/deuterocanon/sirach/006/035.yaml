translation:
  language: de
  text: Sieh, wer verständig ist, und suche ihn auf;[a] lauf dir an seiner Schwelle den Fuß ab.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Parallelüberlieferung lautet: „Begehre, jede göttliche Rede zu hören, und lass dir keine Sprüche der Einsicht entgehen.“ Der hebräische und der griechische Text unterscheiden sich hier erheblich, rufen aber beide dazu auf, eifrig nach Weisheit zu streben.'
    reason: alternative_reading
  - marker: b
    text: Das schwierige hebräische Bild spricht davon, sich durch häufiges Kommen an seiner Schwelle den Fuß abzulaufen. Gemeint ist, das Haus eines verständigen Menschen oft aufzusuchen, um von ihm zu lernen.
    reason: lexical_alternative
lexical_decisions:
- source_word: רְאֵה
  choice: Sieh
  rationale: Der Imperativ fordert dazu auf, einen verständigen Menschen zu erkennen und ausfindig zu machen. „Sieh“ bewahrt die knappe, unmittelbare Form des Hebräischen.
- source_word: מִי יָבִין
  choice: wer verständig ist
  rationale: Die Wendung bezeichnet hier einen Menschen, der von Einsicht geprägt ist. „Verständig“ ist im modernen Deutschen natürlich und wahrt den Bezug zur Weisheit.
- source_word: וְשַׁחֲרֵהוּ
  choice: und suche ihn auf
  rationale: שחר bezeichnet hier ein nachdrückliches, zielgerichtetes Suchen. „Suche ihn auf“ vermittelt sowohl das Bemühen als auch den Gedanken, den Verständigen persönlich zu besuchen.
- source_word: וְתִשְׁחוֹק
  choice: soll … abnutzen
  rationale: Das schwierige Verb beschreibt im Zusammenhang mit Fuß und Schwelle ein Abreiben oder Abnutzen durch häufiges Kommen. Die Wiedergabe bewahrt dieses anschauliche Bild.
- source_word: בְּסִפּוֹ
  choice: seine Schwelle
  rationale: סַף bedeutet Türschwelle oder Schwelle. „Schwelle“ passt zum gehobenen Stil der Weisheitsliteratur, ohne altertümlich zu wirken.
- source_word: רַגְלְךָ
  choice: dein Fuß
  rationale: Der hebräische Singular bleibt erhalten und ist auch im Deutschen innerhalb des Bildworts verständlich.
theological_decisions:
- issue: Vorrang der hebräischen Lesart trotz erheblicher Abweichung der griechischen Überlieferung
  choice: Der erhaltene und verständliche hebräische Text bildet den Haupttext; die deutlich abweichende griechische Lesart wird in einer Fußnote vollständig wiedergegeben.
  alternative: „Begehre, jede göttliche Rede zu hören, und lass dir keine Sprüche der Einsicht entgehen.“
  rationale: Beide Textzeugen mahnen zum eifrigen Streben nach Weisheit, gestalten diese Mahnung aber erheblich unterschiedlich. Die hebräische Fassung beschreibt den beharrlichen Besuch bei einem verständigen Menschen, die griechische das aufmerksame Hören auf göttliche Rede und Weisheitssprüche. Die Differenz wird nicht harmonisiert oder stillschweigend aufgelöst.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper weisheitlicher Mahnrede. Das konkrete Bild von Fuß und Schwelle bleibt erhalten; seine Bedeutung wird nicht in eine bloße Erklärung im Haupttext aufgelöst.
