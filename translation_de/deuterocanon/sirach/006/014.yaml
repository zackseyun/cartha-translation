  text: A faithful friend is a strong refuge[a], and whoever finds one has found a treasure.
translation:
  language: de
  text: Ein treuer Freund ist eine starke Zuflucht[a]; wer ihn findet, hat einen Schatz gefunden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der erhaltene hebräische Text ist hier schwierig und weicht deutlich vom griechischen Zeugen ab. Wörtlicher nach dem überlieferten Hebräischen etwa: »Ein Liebhaber der Treue [ist/liebt] Stärke; wer ihn/es findet, hat Vermögen gefunden.« Der Haupttext folgt dem klareren Sinn des griechischen Paralleltextes: »Ein treuer Freund ist eine starke Zuflucht.«'
    reason: textual_variant
lexical_decisions:
- source_word: אוֹהֵב אֱמוּנָה / φίλος πιστός
  choice: ein treuer Freund
  rationale: Der überlieferte hebräische Ausdruck bedeutet wörtlich etwa »einer, der Treue liebt«, ist hier jedoch sprachlich schwierig. Das griechische φίλος πιστός bezeugt klar »treuer Freund« und ergibt zusammen mit dem zweiten Satzteil einen geschlossenen Spruch.
- source_word: תְּקוֹף / σκέπη κραταιά
  choice: eine starke Zuflucht
  rationale: Das schwierige hebräische תְּקוֹף weist auf Stärke; das griechische σκέπη κραταιά bezeichnet einen kräftigen Schutz oder eine starke Zuflucht. »Starke Zuflucht« bewahrt das Schutzbild und klingt im Deutschen würdig und verständlich.
- source_word: וּמוֹצְאוֹ / ὁ δὲ εὑρὼν αὐτόν
  choice: wer ihn findet
  rationale: Das männliche Pronomen bezieht sich natürlich auf »Freund«. Die deutsche Formulierung ist knapp und entspricht dem persönlichen Bezug des griechischen Zeugen.
- source_word: הוֹן / θησαυρόν
  choice: einen Schatz
  rationale: Hebräisch הוֹן kann »Vermögen« oder »Reichtum« bedeuten, während das Griechische ausdrücklich »Schatz« hat. »Schatz« führt die bildhafte Wertung des Freundes treffend fort.
theological_decisions:
- issue: Gewichtung des schwierigen hebräischen Textes gegenüber dem griechischen Parallelzeugen
  choice: 'Der Haupttext folgt für den ersten Satzteil dem klaren Sinn des griechischen Zeugen: »Ein treuer Freund ist eine starke Zuflucht.«'
  alternative: »Wer Treue liebt, liebt Stärke; und wer ihn/sie findet, hat Vermögen gefunden.«
  rationale: Der erhaltene hebräische Wortlaut ist syntaktisch und semantisch schwierig und weicht erheblich vom griechischen Text ab. Der griechische Parallelzeuge bietet einen kohärenten Spruch, der zum zweiten Satzteil passt. Die Unsicherheit wird nicht verschwiegen, sondern in der Fußnote dokumentiert.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch in würdig-sprichwörtlichem Ton. »Starke Zuflucht« bewahrt das konkrete Schutzbild; der Semikolon gliedert die beiden parallelen Aussagen knapp.
