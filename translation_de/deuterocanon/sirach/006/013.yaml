lexical_decisions:
- source_word: מִשֹּׂנְאֶיךָ
  choice: von denen, die dich hassen
  rationale: Das substantivierte Partizip bezeichnet wörtlich »die dich Hassenden«. Die verbale Wiedergabe bleibt nahe am Hebräischen und klingt im modernen Deutschen natürlich.
- source_word: הִבָּדֵל
  choice: Halte dich … fern
  rationale: Der Nifal-Imperativ von בדל fordert dazu auf, sich abzusondern beziehungsweise Abstand zu halten. »Halte dich … fern« gibt diesen reflexiven und fortdauernden Sinn idiomatisch wieder.
- source_word: וּמֵאֹהֲבֶיָך
  choice: vor denen …, die dich lieben
  rationale: Der hebräische Text sagt wörtlich »von denen, die dich lieben«. Die Konstruktion mit »vor« wird durch das folgende Verb im Deutschen idiomatisch verlangt; die relationale Bezeichnung des hebräischen Hauptzeugen bleibt erhalten.
- source_word: הֵשָּׁמֵר
  choice: nimm dich … in Acht
  rationale: Der Imperativ von שמר bedeutet hier, sich zu hüten oder vorsichtig zu sein. »Nimm dich … in Acht« bewahrt die deutliche Warnung und entspricht auch dem griechischen πρόσεχε.
theological_decisions:
- issue: Bezeichnung der zweiten Personengruppe
  choice: denen, die dich lieben
  alternative: deinen Freunden
  rationale: Der vorrangige hebräische Zeuge hat אֹהֲבֶיךָ, »die dich lieben«, während die griechische Parallele φίλων, »Freunde«, liest. Der Haupttext folgt dem erhaltenen Hebräisch; die engere griechische Fassung wird in einer Fußnote dokumentiert, ohne die Spannung des Spruchs abzuschwächen.
translation_notes:
  register: Knappe, einprägsame Mahnrede in modernem Standarddeutsch. Die parallele Satzstruktur und der scharfe Gegensatz zwischen Hassenden und Liebenden bleiben erhalten.
