translation:
  language: de
  text: Ein treuer Freund ist ein Bündel des Lebens[a], und wer den Herrn fürchtet, wird ihn finden.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich lautet das Hebräische etwa: „ein Bündel des Lebens, einer, der Treue liebt“. Die griechische Parallelüberlieferung hat: „Ein treuer Freund ist ein Heilmittel des Lebens.“ Die Übersetzung bewahrt das hebräische Bild und folgt beim Verständnis von „treuer Freund“ zugleich dem griechischen Zeugen.'
    reason: alternative_reading
  - marker: b
    text: 'Der letzte Satzteil ist im Hebräischen textlich schwierig: Ein ausdrückliches Objekt zu „fürchtet“ fehlt, und die folgende Form lässt sich etwa als „sie erreichen/einholen“ verstehen. Die griechische Parallelüberlieferung lautet: „Die den Herrn fürchten, werden ihn finden.“'
    reason: textual_variant
lexical_decisions:
- source_word: צְרוֹר חַיִּים
  choice: ein Bündel des Lebens
  rationale: Die Wiedergabe bewahrt das ungewöhnliche hebräische Bild eines kostbaren, bewahrenden und lebensspendenden Bündels. Das griechische φάρμακον ζωῆς („Heilmittel des Lebens“) bestätigt die lebensfördernde Bedeutung, ersetzt aber nicht das primäre hebräische Bild.
- source_word: אוֹהֵב אֱמוּנָה
  choice: ein treuer Freund
  rationale: Wörtlich steht im überlieferten Hebräisch die gedrängte Formulierung „einer, der Treue liebt“. Der Zusammenhang und das griechische φίλος πιστός stützen die natürliche personenbezogene Wiedergabe „ein treuer Freund“.
- source_word: יְרֵא
  choice: wer … fürchtet
  rationale: Das Partizip wird als allgemeine Weisheitsaussage wiedergegeben. Die Konstruktion „wer …, wird …“ ist in modernem Deutsch natürlich.
- source_word: וְאַל
  choice: und
  rationale: Als gewöhnliche Verneinung beziehungsweise Aufforderung verstanden ergäbe die hebräische Form hier keinen schlüssigen Satz. Das einfache Bindewort folgt dem erkennbaren Zusammenhang und wird durch die griechische Parallelüberlieferung gestützt.
- source_word: יַשִּׂיגֵם
  choice: wird ihn finden
  rationale: Die hebräische Form kann „sie erreichen/einholen“ bedeuten, doch Zahl und Bezug des Objekts sind schwierig. Das griechische εὑρήσουσιν αὐτόν bietet den kohärenten Singular „werden ihn finden“, der sich auf den treuen Freund bezieht.
- source_word: Κύριον
  choice: den Herrn
  rationale: Die griechische Parallelüberlieferung nennt ausdrücklich den Herrn als Objekt der Furcht und vervollständigt damit die im erhaltenen Hebräisch verkürzte Aussage.
theological_decisions:
- issue: Ergänzung des Objekts bei „fürchten“
  choice: wer den Herrn fürchtet
  alternative: wer sich fürchtet / wer fürchtet
  rationale: Im erhaltenen hebräischen Wortlaut fehlt ein ausdrückliches Objekt; die griechische Parallelüberlieferung hat jedoch eindeutig „die den Herrn fürchten“. Die Ergänzung klärt den wahrscheinlich beabsichtigten Sinn, ohne eine konfessionelle Sonderdeutung einzuführen.
- issue: Bezug des Schlusspronomens
  choice: wird ihn finden
  alternative: wird sie erreichen
  rationale: Der griechische Singular bezieht sich schlüssig auf den treuen Freund. Die schwierige hebräische Pluralform wird in der Fußnote offengelegt, statt im Haupttext eine unklare Referenz zu erzeugen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das auffällige Bild „Bündel des Lebens“ bleibt bewusst erhalten; die Fußnoten erklären sowohl die hebräische Bildsprache als auch die textkritisch schwierige Schlussklausel.
