translation:
  language: de
  text: Es gibt einen Freund, der zum Feind wird, und er wird den Streit aufdecken, der dir Schande bringt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „und den Streit deiner Schande wird er aufdecken“. Die hebräische Verbindung ist knapp und kann auch einen beschämenden Streit oder einen Streit bezeichnen, durch den deine Schande öffentlich wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵשׁ אוֹהֵב
  choice: Es gibt einen Freund
  rationale: אוֹהֵב bezeichnet wörtlich einen Liebenden beziehungsweise jemanden, der liebt; im Weisheitskontext und nach dem griechischen φίλος ist hier ein Freund gemeint. Die existentielle Wendung יֵשׁ bleibt erhalten.
- source_word: נֶהְפָּךְ לְשׂוֹנֵא
  choice: der zum Feind wird
  rationale: 'Die Wendung beschreibt den Umschlag einer Beziehung: Aus dem Freund wird einer, der hasst. „Zum Feind wird“ gibt dies knapp und natürlich wieder; der griechische Paralleltext bestätigt den Übergang zur Feindschaft.'
- source_word: רִיב
  choice: den Streit
  rationale: רִיב kann Streit, Auseinandersetzung oder Rechtsstreit bedeuten. Hier legt der Zusammenhang einen persönlichen Streit nahe, ohne dass ein förmliches Gerichtsverfahren vorausgesetzt werden muss.
- source_word: חֶרְפָּתְךָ
  choice: der dir Schande bringt
  rationale: Die knappe hebräische Verbindung lautet wörtlich etwa „der Streit deiner Schande“. Die Relativkonstruktion gibt den wahrscheinlichen Zusammenhang verständlich wieder, ohne die Mehrdeutigkeit in der Fußnote zu verschweigen.
- source_word: יַחְשֹׂף
  choice: deckt … auf
  rationale: Das Verb bedeutet entblößen, aufdecken oder offenlegen. „Aufdecken“ passt zur feindseligen Bekanntmachung des beschämenden Streits und entspricht dem griechischen ἀποκαλύψει.
