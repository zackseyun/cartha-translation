  text: For there is a friend for the occasion[a], and he will not stand firm in the day of distress.
translation:
  language: de
  text: Denn es gibt einen Freund für den Augenblick,[a] und am Tag der Not hält er nicht stand.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „entsprechend der Zeit“. Auch möglich: „für eine Zeit“ oder „wenn es ihm gelegen kommt“. Die hebräische Wendung bezeichnet einen Freund, dessen Freundschaft zeit- oder gelegenheitsbedingt ist; die genaue Nuance bleibt offen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹהֵב
  choice: Freund
  rationale: Das substantivierte Partizip bezeichnet hier im weisheitlichen Zusammenhang einen Freund oder Gefährten, nicht einen romantischen Liebhaber. Das griechische φίλος bestätigt diesen Sinn.
- source_word: כְּפִי עֵת
  choice: solange es die Umstände erlauben
  rationale: Die ungewöhnliche Wendung bedeutet wörtlich etwa „nach Maß der Zeit“ und beschreibt eine zeit- oder umstandsabhängige Freundschaft. Die Formulierung gibt den opportunistischen Unterton natürlich wieder, ohne die Mehrdeutigkeit zu verschweigen.
- source_word: יַעֲמוֹד
  choice: steht er … zu dir
  rationale: עמד bedeutet wörtlich „stehen“, bezeichnet hier aber beständiges Ausharren und loyales Beistehen. „Zu dir stehen“ bewahrt das Bild und klingt im Deutschen idiomatisch.
- source_word: בְּיוֹם צָרָה
  choice: am Tag der Not
  rationale: Die traditionelle hebräische Zeitformel bleibt erhalten; „Not“ gibt צָרָה knapp und natürlich als Bedrängnis oder schwere Lage wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Mancher“ gibt die existenzielle Wendung כִּי יֵשׁ idiomatisch wieder. Das deutsche „zu dir“ wird durch den Zusammenhang und zusätzlich durch das griechische „am Tag deiner Bedrängnis“ gestützt; der hebräische Text hat an dieser Stelle kein ausdrückliches Possessivpronomen.
