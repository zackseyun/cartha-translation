  text: You will wear her like garments of honor[a], and you will crown yourself with her like a crown of splendor.
translation:
  language: de
  text: Du wirst sie mit Ehrengewändern bekleiden und sie mit einer Krone der Pracht krönen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Griechisch im zweiten Halbvers: „Du wirst dir eine Krone des Jubels aufsetzen“ statt hebräisch „du wirst sie mit einer Krone der Pracht krönen“.'
    reason: alternative_reading
lexical_decisions:
- source_word: בִּגְדֵי כָבוֹד
  choice: Ehrengewänder
  rationale: Die Wendung bezeichnet wörtlich Gewänder der Ehre beziehungsweise Herrlichkeit. „Ehrengewänder“ bewahrt das konkrete Kleidungsbild und klingt im Deutschen würdevoll und verständlich.
- source_word: תִלְבְּשֶׁנָּה
  choice: du wirst sie … tragen
  rationale: Das Verb לבשׁ bedeutet „anziehen, tragen“; das feminine Suffix verweist im Zusammenhang auf die personifizierte Weisheit. „Sie tragen“ gibt das Bild im Deutschen natürlicher wieder als „sie anziehen“.
- source_word: וַעֲטֶרֶת תִּפְאֶרֶת
  choice: wie mit einer Krone der Pracht
  rationale: תִּפְאֶרֶת kann Schönheit, Herrlichkeit oder Pracht bezeichnen. „Pracht“ erhält die erhabene Bildsprache und unterscheidet sich zugleich sinnvoll von כָבוֹד im ersten Halbvers.
- source_word: תְּעַטְּרֶנָּה
  choice: dich mit ihr … krönen
  rationale: עטר bedeutet „krönen, umgeben, schmücken“. Die Form enthält ein feminines Objektsuffix, das auf die Weisheit zurückweist; die reflexive deutsche Fassung macht verständlich, dass der Angesprochene sie sich als Krone aufsetzt. Der griechische Paralleltext stützt diesen reflexiven Sinn ausdrücklich.
theological_decisions:
- issue: Bezug der femininen Suffixe
  choice: Die Weisheit bleibt als personifizierte Gestalt durch „sie“ und „mit ihr“ ausdrücklich erhalten.
  alternative: 'Die Metaphern ohne feminines Pronomen wiedergeben, etwa: „Du wirst Ehrengewänder tragen.“'
  rationale: Der unmittelbare Zusammenhang personifiziert die Weisheit als Frau. Eine unpersönliche Wiedergabe würde diese literarische und theologische Dimension abschwächen.
- issue: Abweichung des griechischen Paralleltextes bei der Krone
  choice: Der Haupttext folgt dem hebräischen תִּפְאֶרֶת mit „Pracht“.
  alternative: Nach dem Griechischen ἀγαλλίαμα mit „Jubel“ oder „Freude“ übersetzen.
  rationale: Der vorhandene hebräische Text ist hier klar und für den Haupttext maßgeblich; die bedeutsame griechische Variante wird in einer Fußnote bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallelen Bilder von Gewand und Krone sowie die Personifikation der Weisheit bleiben erhalten; „Ehrengewänder“ und „Krone der Pracht“ tragen den poetischen Ton, ohne altertümlich zu wirken.
