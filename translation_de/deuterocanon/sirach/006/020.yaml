translation:
  language: de
  text: Für einen Toren ist sie schwer zu bewältigen[a], und wer ohne Verstand ist[b], hält sie nicht aus[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Für einen Toren ist sie rau und schwer gangbar.“ Die griechische Parallele lautet: „Wie überaus rau ist sie für die Ungebildeten.“'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „wer kein Herz hat“; „Herz“ steht hier für Verstand und Einsicht.'
    reason: hebrew_idiom
  - marker: c
    text: 'Oder: „kann nicht an ihr festhalten“. Die griechische Parallele hat: „wird nicht in ihr bleiben“.'
    reason: textual_parallel
lexical_decisions:
- source_word: עֲקֻבָּה
  choice: schwer zu bewältigen
  rationale: Das seltene hebräische Wort bezeichnet hier etwas Schwieriges, Raues oder schwer Gangbares. „Schwer zu bewältigen“ gibt dieses Bild in natürlichem Deutsch wieder, ohne die im Hebräischen nicht ausdrücklich vorhandene Verstärkung „sehr“ einzutragen; die griechische Parallele bestätigt die Grundbedeutung „rau/schwierig“.
- source_word: לָאֱוִיל
  choice: für einen Toren
  rationale: אֱוִיל ist ein geläufiger Begriff der Weisheitsliteratur für einen moralisch und geistig uneinsichtigen Menschen. „Tor“ bewahrt diesen traditionellen, aber weiterhin verständlichen Sinn.
- source_word: וְלֹא יְכַלְכְּלֶנָּה
  choice: hält sie nicht aus
  rationale: כלכל kann „tragen“, „aushalten“ oder „ertragen“ bedeuten. Das feminine Suffix bezieht sich auf die Weisheit. Die griechische Parallele („wird nicht in ihr bleiben“) zeigt zusätzlich den Gedanken mangelnden Durchhaltevermögens.
- source_word: חֲסַר לֵב
  choice: wer ohne Verstand ist
  rationale: Wörtlich „dem es an Herz fehlt“. „Herz“ bezeichnet im hebräischen Sprachgebrauch hier Einsicht und Urteilsvermögen; eine wörtliche Wiedergabe wäre im Deutschen missverständlich.
theological_decisions:
- issue: Weiblicher Bezug auf die Weisheit
  choice: Das feminine Pronomen „sie“ wird beibehalten.
  alternative: Abstraktes „es“ oder Wiederholung von „die Weisheit“
  rationale: Die femininen Formen im Hebräischen beziehen sich im Zusammenhang auf die Weisheit. Das deutsche Femininum gibt diesen Bezug natürlich wieder, ohne über den Text hinaus eine zusätzliche Personifikation festzulegen.
- issue: Allgemeingültigkeit der Bezeichnung חֲסַר לֵב
  choice: „wer ohne Verstand ist“
  alternative: „ein unverständiger Mann“
  rationale: Die grammatisch maskuline Personenbezeichnung formuliert einen allgemeinen Weisheitstyp und schränkt die Aussage nicht auf Männer ein.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Tor“ erhält den charakteristischen Begriff der Weisheitsliteratur; die übrige Formulierung ist bewusst gegenwärtig und leicht verständlich. Die Satzstruktur folgt eng dem hebräischen Parallelismus.
