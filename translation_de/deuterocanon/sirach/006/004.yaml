  text: For a fierce soul destroys its owner[a], and the rejoicing of an enemy overtakes him.
translation:
  language: de
  text: Denn eine ungezügelte Seele richtet ihren Besitzer zugrunde und macht ihn zur Schadenfreude seiner Feinde.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hebräische Wortlaut der zweiten Satzhälfte ist schwierig und lautet formal etwa: „und die Freude eines Feindes wird sie einholen“. Das letzte Verb hat im überlieferten Text eine unklare Numeruszuordnung. Die griechische Überlieferung liest sinngemäß: „und sie wird ihn zur Freude der Feinde machen“; ihr folgt der Haupttext.'
    reason: textual_variant
lexical_decisions:
- source_word: נֶפֶשׁ עַזָּה
  choice: eine ungezügelte Seele
  rationale: נפש bezeichnet hier das innere Wesen bzw. die Gesinnung; עזה meint wörtlich etwas Starkes oder Heftiges, im Kontext jedoch eine übermächtige, nicht beherrschte Wesensart. „Ungezügelt“ gibt diese negative Kraft natürlich wieder, ohne sie schlicht mit „böse“ gleichzusetzen.
- source_word: תַּשְׁחִית
  choice: richtet … zugrunde
  rationale: Das Verb שחת bezeichnet Zerstören oder Verderben. Die deutsche Wendung bringt die selbstzerstörerische Folge klar und idiomatisch zum Ausdruck.
- source_word: בְּעָלֶיהָ
  choice: ihren Besitzer
  rationale: בעליה bezeichnet denjenigen, dem sie gehört bzw. der sie besitzt. „Besitzer“ wahrt das auffällige Bild des Hebräischen und entspricht dem griechischen κτησάμενον.
- source_word: וְשִׂמְחַת שׂוֹנֵא
  choice: zur Schadenfreude seiner Feinde
  rationale: שמחה ist Freude oder Jubel; im Zusammenhang mit Feinden bezeichnet es deren Freude über das Unglück des Betroffenen. „Schadenfreude“ drückt diesen Sinn im Deutschen prägnant aus. Der formal singularische שונא kann kollektiv verstanden werden; die griechische Parallele hat den Plural.
- source_word: תַּשִּׂיגֵם
  choice: macht ihn zu
  rationale: 'Der überlieferte hebräische Ausdruck bedeutet formal etwa „wird sie erreichen/einholen“, weist aber eine schwierige Numeruszuordnung auf. Für den Haupttext wird die kohärente griechische Parallele ποιήσει αὐτόν aufgenommen: Die ungezügelte Seele macht ihren Besitzer zum Gegenstand feindlicher Freude.'
theological_decisions:
- issue: Textgrundlage der schwierigen Schlussklausel
  choice: 'Die hebräische Bildwelt wird beibehalten, während die syntaktische Aussage der griechischen Parallele folgt: „macht ihn zur Schadenfreude seiner Feinde“.'
  alternative: „und die Freude eines Feindes wird sie einholen“ bzw. „und die Freude eines Feindes wird sie erreichen“
  rationale: Die erhaltene hebräische Form תַּשִּׂיגֵם ist in Numerus und Bezug schwierig und ergibt mit dem vorausgehenden Singular keinen klaren Satz. Die griechische Parallele bietet mit „sie wird ihn zur Freude der Feinde machen“ einen kohärenten, wahrscheinlich intendierten Sinn. Die Fußnote legt die Unsicherheit offen, statt sie stillschweigend aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Ungezügelte Seele“ bewahrt die anthropologische Bildsprache und vermittelt zugleich die moralisch negative Heftigkeit. „Schadenfreude“ ist idiomatisch und macht verständlich, dass der Betroffene zum Gegenstand des Jubels seiner Feinde wird.
