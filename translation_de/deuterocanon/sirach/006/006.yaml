translation:
  language: de
  text: Viele Menschen sollen mit dir in Frieden leben, doch nur einer von tausend sei dein Vertrauter[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Griechisch: „deine Ratgeber“ oder „deine Berater“ (οἱ δὲ σύμβουλοί σου); im Hebräischen steht ein Ausdruck für jemanden, der an deinem vertraulichen Rat oder Geheimnis Anteil hat, was die persönlichere Bedeutung „Vertrauter“ stützt.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַנְשֵׁי שְׁלוֹמְךָ
  choice: Menschen, die mit dir in Frieden leben
  rationale: Die Wendung bedeutet wörtlich „Menschen deines Friedens“ und bezeichnet Menschen, die mit jemandem in Frieden oder freundschaftlicher Beziehung leben. Die Formulierung bewahrt den Friedensaspekt und stimmt mit dem griechischen Paralleltext überein.
- source_word: יִהְיוּ רַבִּים
  choice: soll es viele geben
  rationale: Das hebräische Imperfekt hat hier im weisheitlichen Zusammenhang auffordernden beziehungsweise wünschenden Sinn. Die deutsche Fassung gibt diesen Sinn natürlich wieder.
- source_word: וּבַעַל סוֹדְךָ
  choice: doch dein Vertrauter
  rationale: בעל סוד bezeichnet wörtlich jemanden, der am Geheimnis oder vertraulichen Rat eines anderen Anteil hat. „Vertrauter“ bringt die persönliche Nähe und das besondere Vertrauen prägnant zum Ausdruck.
- source_word: אֶחַד מֵאָלֶף
  choice: einer von tausend
  rationale: Die idiomatische deutsche Wendung bewahrt das Bild äußerster Seltenheit und sorgfältiger Auswahl.
theological_decisions:
- issue: Hebräischer Hauptzeuge und abweichende Nuance des griechischen Paralleltextes
  choice: Der hebräische Text wird als Hauptzeuge übersetzt; die persönliche Vertrauensnuance von סוד erscheint im Haupttext als „Vertrauter“.
  alternative: Nach dem Griechischen allgemeiner „deine Ratgeber“ oder „deine Berater“.
  rationale: Beide Textzeugen stellen vielen friedlich verbundenen Menschen einen äußerst kleinen Kreis tief Vertrauenswürdiger gegenüber. Der erhaltene hebräische Wortlaut benennt jedoch ausdrücklich das Geheimnis beziehungsweise den vertraulichen Rat und rechtfertigt daher die intimere Wiedergabe.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch in knapper, würdevoller Weisheitssprache. Der Parallelismus und der Gegensatz zwischen vielen friedlich Verbundenen und einem seltenen Vertrauten bleiben erhalten.
