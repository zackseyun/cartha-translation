  source_fidelity: 'Die Übersetzung folgt dem griechischen Text präzise: εἰσακούσατέ μου ist treffend als „Hört auf mich“ wiedergegeben; die maskuline Anrede υἱοὶ bleibt mit „Söhne“ erhalten. „Frommen“ gibt ὅσιοι im vorliegenden appellativen Kontext idiomatisch und ohne unzulässige dogmatische Zuspitzung wieder. „Treibt aus“ bildet βλαστήσατε als allgemeines Hervorsprossen ab, und der Relativsatz zu φυόμενον ist sachgerecht. „An einem Bach auf dem Feld“ ist eine natürliche deutsche Entfaltung der knappen, im Genitivanschluss nicht völlig spezifischen Ortsangabe ἐπὶ ῥεύματος ἀγροῦ.'
