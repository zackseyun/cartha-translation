  terminology: „Fromm“ ist für ὅσιοι hier besser verständlich und semantisch angemessener als „heilig“, das im Deutschen leicht eine stärkere, statusartige Heiligkeitsaussage nahelegen könnte. „Söhne“ wahrt die ausdrücklich maskuline Form des griechischen Textes. Die Pflanzen- und Wasserbildsprache bleibt konkret.
