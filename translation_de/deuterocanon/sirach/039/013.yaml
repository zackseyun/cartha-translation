  yaml_path: translation/deuterocanon/sirach/039/013.yaml
  text: Listen to me[a], holy sons, and bud forth like a rose growing beside a stream in a field[b],
translation:
  language: de
  text: Hört auf mich, ihr frommen Söhne, und treibt aus wie eine Rose, die an einem Bach auf dem Feld wächst.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „und blüht auf wie eine Rose, die an einem Wasserlauf auf dem Feld wächst.“ Das griechische Wachstumsverb kann das Austreiben oder Aufblühen bezeichnen; auch der knappe Ausdruck für den Ort am fließenden Wasser lässt mehrere natürliche Wiedergaben zu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσακούσατέ
  choice: Hört auf mich
  rationale: Der Aoristimperativ fordert zum aufmerksamen Hören auf; „Hört auf mich“ ist im modernen Deutsch direkt und natürlich.
- source_word: υἱοὶ
  choice: Söhne
  rationale: Das griechische Substantiv ist ausdrücklich maskulin im Plural; „Söhne“ bewahrt die Form der Anrede.
- source_word: ὅσιοι
  choice: frommen
  rationale: ὅσιος bezeichnet hier Menschen, deren Haltung und Lebensführung von Gottesverehrung geprägt ist. „Fromm“ gibt dies natürlicher wieder als die im Deutschen missverständliche Anrede „heilige Söhne“.
- source_word: βλαστήσατε
  choice: treibt aus
  rationale: Das Verb bezeichnet hervorsprießendes Pflanzenwachstum. „Treibt aus“ bewahrt das Bild und vermeidet die stärkere Festlegung auf das volle Erblühen.
- source_word: ῥόδον
  choice: Rose
  rationale: ῥόδον bezeichnet gewöhnlich eine Rose; die knappe konkrete Pflanzenbezeichnung bleibt erhalten.
- source_word: φυόμενον
  choice: die … wächst
  rationale: Das Partizip beschreibt das fortdauernde Wachstum der Rose und wird in natürlichem Deutsch als Relativsatz wiedergegeben.
- source_word: ἐπὶ ῥεύματος
  choice: an einem Bach
  rationale: Die Wendung bezeichnet in diesem Bild die Lage an fließendem Wasser; „an einem Bach“ ist anschaulich und idiomatisch.
- source_word: ἀγροῦ
  choice: auf dem Feld
  rationale: ἀγρός bezeichnet Feld oder offenes Kulturland. Der Genitivanschluss ist im Griechischen knapp und etwas mehrdeutig; „auf dem Feld“ gibt den konkreten Schauplatz verständlich wieder.
theological_decisions:
- issue: Anrede υἱοὶ ὅσιοι
  choice: ihr frommen Söhne
  alternative: ihr heiligen Söhne / ihr frommen Kinder
  rationale: „Söhne“ wahrt die grammatisch männliche Anrede. „Fromm“ vermittelt den gottesdienstlich-sittlichen Sinn von ὅσιοι, ohne eine Aussage über kultische Heiligkeit oder Vollkommenheit aufzudrängen.
- issue: Wachstumsstadium in βλαστήσατε
  choice: treibt aus
  alternative: blüht auf
  rationale: Das griechische Verb bezeichnet allgemein das Hervortreiben oder Sprießen und legt nicht eindeutig bereits die volle Blüte fest. Daher bleibt die Übersetzung beim weiteren Wachstumsbild.
translation_notes:
  register: Moderne, würdige exhortative Sprache. Die direkte Anrede bleibt maskulin und der Pflanzenvergleich konkret. Ein Fußnotenhinweis bewahrt die Mehrdeutigkeit des Wachstumsverbs und der Ortsangabe.
