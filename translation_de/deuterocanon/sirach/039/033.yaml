translation:
  language: de
  text: Gottes Werke sind alle gut[a], und für jeden Bedarf sorgt er zu seiner Zeit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Parallelüberlieferung lautet: »Die Werke des Herrn sind alle gut.« Der hebräische Text hat hier »Gott« statt »der Herr«.'
    reason: alternative_reading
lexical_decisions:
- source_word: מעשה אל
  choice: Gottes Werke
  rationale: מעשה steht zwar formal im Singular, wird durch כלם kollektiv aufgefasst; der griechische Paralleltext bestätigt den Plural »Werke«. אל wird entsprechend dem hebräischen Hauptzeugen mit »Gott« wiedergegeben.
- source_word: טובים
  choice: gut
  rationale: Die direkte und unverkürzte Wiedergabe bewahrt die umfassende positive Aussage über Gottes Werke.
- source_word: לכל צורך
  choice: für jeden Bedarf
  rationale: צורך bezeichnet Bedarf oder Notwendigkeit. »Für jeden Bedarf« ist im Deutschen idiomatisch und vermeidet die Verengung auf ein subjektiv empfundenes Bedürfnis.
- source_word: בעתו
  choice: zu seiner Zeit
  rationale: Die Formulierung bewahrt den Rückbezug des Suffixes auf den jeweiligen Bedarf und legt nicht ausdrücklich das stärker deutende »zur rechten Zeit« fest.
- source_word: יספיק
  choice: sorgt er
  rationale: Das Verb bezeichnet ausreichendes Versorgen beziehungsweise Bereitstellen. In Verbindung mit »für jeden Bedarf« gibt »sorgt er« den aktiven Versorgungssinn natürlich wieder; das Präsens versteht die hebräische Imperfektform als allgemeingültige Aussage.
theological_decisions:
- issue: Gottesbezeichnung im ersten Satzteil
  choice: »Gott« im Haupttext
  alternative: »der Herr«
  rationale: Der erhaltene hebräische Hauptzeuge liest אל (»Gott«), während die griechische Parallelüberlieferung Κυρίου (»des Herrn«) bietet. Der Haupttext folgt dem Hebräischen; die abweichende Gottesbezeichnung des Griechischen wird in der Fußnote bewahrt.
- issue: Zeitbezug der Versorgung
  choice: 'allgemeingültiges Präsens: »sorgt er«'
  alternative: 'futurisch: »wird er sorgen«'
  rationale: Die hebräische Imperfektform kann hier eine regelmäßig oder grundsätzlich geltende Aussage ausdrücken. Das Präsens passt zum sentenzartigen Charakter, ohne Gottes Versorgung auf ein einzelnes zukünftiges Ereignis zu beschränken.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Weisheitsspruch-Struktur bleibt erhalten; »zu seiner Zeit« wahrt den sachlichen Zeitbezug, ohne ihn durch »zur rechten Zeit« auszudeuten.
