  text: Thinking further[a], I will set forth instruction, and I was filled like the full moon.
translation:
  language: de
  text: Noch weiter nachdenkend werde ich eine Auswahl treffen; und wie der Vollmond wurde ich erfüllt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „wie die Monatsmitte“. Der griechische Ausdruck kann den Vollmond bezeichnen, der um die Mitte des Monats erscheint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔτι
  choice: noch weiter
  rationale: Das Adverb bezeichnet hier die Fortsetzung bzw. Erweiterung des Nachdenkens, ohne einen Gegensatz einzuführen.
- source_word: διανοηθεὶς
  choice: nachdem ich … nachgedacht habe
  rationale: Das deponentische Aoristpartizip wird als vorzeitiger Nebensatz wiedergegeben und behält den Sinn gründlicher Überlegung.
- source_word: ἐκλογήσομαι
  choice: werde ich auswählen
  rationale: Der Futur Medium bezeichnet eine bewusste eigene Auswahl. Die Wiedergabe bleibt beim unmittelbaren Wortsinn und ergänzt nicht ausdrücklich „Unterweisung“, da dies im griechischen Satz nicht genannt wird.
- source_word: διχομηνία
  choice: Vollmond
  rationale: Das Wort bezeichnet wörtlich die Monatsmitte und kann davon abgeleitet den Vollmond meinen; im Vergleich mit dem Erfülltwerden ist „Vollmond“ im Deutschen die natürliche Bildbezeichnung.
- source_word: ἐπληρώθην
  choice: ich bin erfüllt worden
  rationale: Die passive Form wird bewahrt; „erfüllt“ erhält zugleich die Verbindung zum Bild des vollen Mondes.
