  source_fidelity: 'Der Entwurf gibt die wesentlichen Elemente des griechischen Textes wieder: fortgesetztes Nachdenken (ἔτι διανοηθείς), die zukünftige, persönlich vollzogene Auswahl (ἐκλογήσομαι) und das Erfülltwerden im Vergleich zur διχομηνία. Eine Wiedergabe mit „Unterweisung“ wäre hier nicht durch den vorliegenden griechischen Wortlaut gedeckt. Die vorgeschlagene Revision vermeidet jedoch die unnötig stark vorzeitige Festlegung von „Nachdem ich ... nachgedacht habe“ und gibt den Vergleich syntaktisch klarer wieder.'
  naturalness: „Nachdem ich noch weiter nachgedacht habe, werde ich auswählen“ ist im Deutschen zwar verständlich, aber durch die Verbindung von abgeschlossenem Perfekt-Nebensatz und Zukunft etwas schwerfällig. „Noch weiter nachdenkend werde ich eine Auswahl treffen“ ist würdig, idiomatisch und bewahrt die partizipiale Offenheit. „Wie der Vollmond wurde ich erfüllt“ macht die Vergleichsbeziehung klarer als die Stellung am Satzende.
  terminology: „Eine Auswahl treffen“ gibt das reflexiv bzw. persönlich beteiligte Futurmedium ἐκλογήσομαι natürlich wieder, ohne ein nicht genanntes Objekt oder eine theologisch bzw. kontextuell ergänzte „Unterweisung“ einzutragen. „Vollmond“ ist für διχομηνία im Bild des Erfülltwerdens eine gute deutsche Hauptwiedergabe; die Fußnote wahrt die wörtliche Bedeutung „Monatsmitte“.
