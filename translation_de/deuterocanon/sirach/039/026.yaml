base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/039/026.yaml
  text: The essentials for human life are water[a], fire, iron, and salt; wheat flour, milk, and honey; the blood of the grape, oil[b], and clothing.
translation:
  language: de
  text: Grundlegend für das menschliche Leben sind Wasser, Feuer, Eisen und Salz, Weizenmehl[a], Milch und Honig, das Blut der Traube[b], Öl und Kleidung.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der hebräische Wortlaut bei „Weizenmehl“ ist in den Handschriften aus der Kairoer Geniza schwierig; die griechische Parallelüberlieferung stützt den Sinn „Weizenmehl“ oder „feines Weizenmehl“.
    reason: textual_variant
  - marker: b
    text: Wörtlich „das Blut der Traube“; gemeint ist ein Getränk aus Trauben, möglicherweise Wein. Die Übersetzung bewahrt das Bild des Ausgangstextes.
    reason: lexical_alternative
lexical_decisions:
- source_word: ראש לחיי אדם
  choice: Grundlegend für das menschliche Leben
  rationale: ראש bezeichnet hier idiomatisch das Vorrangige oder Grundlegende, nicht einen zeitlichen Anfang. Die Formulierung gibt den allgemeinen Bezug von אדם natürlich und inklusiv wieder.
- source_word: מים, ואש וברזל ומלח
  choice: Wasser, Feuer, Eisen und Salz
  rationale: Die konkreten Grundgüter werden wörtlich und in der Reihenfolge des Hebräischen wiedergegeben.
- source_word: חלב חטה
  choice: Weizenmehl
  rationale: Der überlieferte hebräische Wortlaut ist schwierig; das griechische σεμίδαλις πυρός stützt die Bedeutung „Weizenmehl“ beziehungsweise „feines Weizenmehl“.
- source_word: חלב
  choice: Milch
  rationale: Im Zusammenhang der Nahrungsmittel und gemäß dem griechischen γάλα ist „Milch“ gemeint, nicht „Fett“.
- source_word: דבש
  choice: Honig
  rationale: Die übliche konkrete Bedeutung passt zum Kontext und wird durch das griechische μέλι bestätigt.
- source_word: דם עינב
  choice: das Blut der Traube
  rationale: Die bildhafte Wendung des Hebräischen wird bewahrt; auch das Griechische bietet wörtlich „Blut der Traube“. So wird nicht vorschnell auf Traubensaft oder Wein festgelegt.
- source_word: יצהר
  choice: Öl
  rationale: Das Wort bezeichnet gewöhnlich frisches Öl, meist Olivenöl. „Öl“ bleibt präzise, ohne eine im Vers nicht ausdrücklich genannte Sorte hinzuzufügen.
- source_word: בגד
  choice: Kleidung
  rationale: Der kollektive Singular wird im Deutschen natürlich als Sammelbegriff wiedergegeben.
theological_decisions:
- issue: Generischer Gebrauch von אדם
  choice: das menschliche Leben
  alternative: das Leben des Mannes / das Leben eines Menschen
  rationale: אדם bezeichnet hier die Menschheit allgemein und nicht speziell männliche Personen. „Das menschliche Leben“ bringt diesen allgemeinen Sinn präzise zum Ausdruck.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die Aufzählung bleibt knapp und rhythmisch; echte textliche und lexikalische Unsicherheiten werden in den Fußnoten offengelegt.
