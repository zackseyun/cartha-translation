  terminology: כל בשר sollte im Haupttext als »alles Fleisch« beziehungsweise in der Genitivverbindung »alles Fleisches« erhalten bleiben, da der Ausdruck bewusst weit ist. Die Fußnote muss die zitierte Grundform korrekt als »alles Fleisch« angeben, nicht als »alles Fleisches«.
