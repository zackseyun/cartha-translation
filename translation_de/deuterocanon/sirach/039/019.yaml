  text: The deeds of all flesh are before him[b][a], and nothing is hidden from before his eyes.
translation:
  language: de
  text: 'Das Tun alles Fleisches[a] liegt vor ihm, und nichts ist seinen Augen verborgen.[b]


    [a] Wörtlich: »alles Fleisch«. Der hebräische Ausdruck kann alle Lebewesen oder die gesamte Menschheit bezeichnen.


    [b] Die griechische Überlieferung formuliert die Unmöglichkeit etwas ausdrücklicher: »und es ist nicht möglich, sich seinen Augen zu verbergen«.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »alles Fleisch«. Der hebräische Ausdruck kann alle Lebewesen oder die gesamte Menschheit bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Die griechische Überlieferung formuliert die Unmöglichkeit etwas ausdrücklicher: »und es ist nicht möglich, sich seinen Augen zu verbergen«.'
    reason: alternative_reading
lexical_decisions:
- source_word: מעשה
  choice: alles, was … tun
  rationale: Das hebräische Singularwort bezeichnet hier kollektiv das Tun beziehungsweise die Taten. Die verbale Formulierung ist in modernem Deutsch natürlich und bewahrt den konkreten Bezug auf Handlungen; das griechische ἔργα bestätigt diesen Sinn.
- source_word: כל בשר
  choice: die Lebewesen
  rationale: Wörtlich steht »alles Fleisch«, ein weiter hebräischer Sammelausdruck, der je nach Zusammenhang alle Lebewesen oder die gesamte Menschheit meinen kann. »Lebewesen« wahrt die Breite besser als eine Beschränkung auf Menschen; die wörtliche Wendung wird in der Fußnote angegeben.
- source_word: נגדו
  choice: liegt vor ihm
  rationale: נגדו bezeichnet, dass etwas vor jemandem beziehungsweise in seiner Gegenwart liegt. »Liegt vor ihm« ist knapp, verständlich und entspricht auch dem griechischen ἐνώπιον αὐτοῦ.
- source_word: אין נסתר
  choice: nichts ist … verborgen
  rationale: Diese Formulierung gibt die hebräische Feststellung unmittelbar wieder, ohne die im Griechischen ausdrücklichere Unmöglichkeitskonstruktion in den Haupttext einzutragen.
- source_word: מנגד עיניו
  choice: seinen Augen
  rationale: »Seinen Augen verborgen« ist eine natürliche deutsche Wiedergabe des hebräischen Bildes und hält den ausdrücklichen Bezug auf Gottes Augen fest.
theological_decisions:
- issue: Reichweite von כל בשר unter Gottes Blick
  choice: Den weiten Sinn mit »Lebewesen« bewahren und die wörtliche Wendung in einer Fußnote nennen.
  alternative: »alle Menschen« oder das wörtlichere, aber im modernen Deutsch unnatürliche »alles Fleisch«
  rationale: Hebräisch und griechische Parallele verwenden den umfassenden Ausdruck »alles Fleisch«. Der Haupttext soll dessen Reichweite nicht stillschweigend auf die Menschheit verengen; die Fußnote bewahrt zugleich die genuine Mehrdeutigkeit.
- issue: Aussage über die Unmöglichkeit des Verbergens
  choice: 'Der hebräischen Aussage folgen: »nichts ist seinen Augen verborgen«.'
  alternative: 'Nach dem Griechischen: »Niemand kann sich vor seinen Augen verbergen« beziehungsweise »Es ist nicht möglich, sich vor seinen Augen zu verbergen«.'
  rationale: Der hebräische Text stellt den Zustand umfassender Sichtbarkeit fest; die griechische Parallele hebt die Unmöglichkeit des Sichverbergens etwas stärker hervor. Diese Nuance wird dokumentiert, nicht in den Haupttext eingemischt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Umformung zu »Alles, was … tun« vermeidet die schwerfällige oder altertümliche Genitivfügung »die Taten allen Fleisches«, während die Fußnote den hebräischen Bildausdruck und seine offene Reichweite erhält.
