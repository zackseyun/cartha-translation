base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/039/004.yaml
  text: He will serve among great men[a], and will appear before a ruler; he will travel through the land of foreign nations, for he has tested good and evil among men.
translation:
  language: de
  text: Unter hochgestellten Männern wird er dienen, und vor einem Herrscher wird er erscheinen. Er wird das Land fremder Völker durchqueren; denn er hat Gutes und Böses unter den Menschen erprobt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „denn er hat Gutes und Böses unter den Menschen erfahren.“ Das griechische Verb kann sowohl das Prüfen und Erproben als auch das Kennenlernen durch eigene Erfahrung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνὰ μέσον μεγιστάνων
  choice: unter hochgestellten Männern
  rationale: ἀνὰ μέσον bedeutet idiomatisch „mitten unter“ bzw. „unter“. μεγιστάνων bezeichnet einflussreiche, hochrangige Personen; „hochgestellte Männer“ bewahrt hier sowohl den gesellschaftlichen Rang als auch die maskuline Form des griechischen Ausdrucks.
- source_word: ὑπηρετήσει
  choice: wird er dienen
  rationale: Das Verb bezeichnet Dienstleistung oder persönliche Amtshilfe. „dienen“ ist im höfisch-öffentlichen Zusammenhang verständlich, ohne dem Ausdruck einen ausschließlich religiösen Sinn zu geben.
- source_word: ἔναντι ἡγουμένου ὀφθήσεται
  choice: vor einem Herrscher wird er erscheinen
  rationale: ἔναντι bezeichnet die Gegenwart vor jemandem; ἡγούμενος ist hier eine führende oder regierende Person. Das passive ὀφθήσεται („wird gesehen werden“) wird idiomatisch als „wird erscheinen“ wiedergegeben und lässt an eine Audienz denken, ohne sie ausdrücklich vorauszusetzen.
- source_word: ἐν γῇ ἀλλοτρίων ἐθνῶν
  choice: das Land fremder Völker
  rationale: Die Übersetzung bewahrt den Singular γῇ und den Plural ἐθνῶν. ἀλλοτρίων bezeichnet Völker, die aus Sicht des Reisenden fremd sind.
- source_word: διελεύσεται
  choice: wird … durchqueren
  rationale: Das Verb bedeutet hindurchgehen oder durch ein Gebiet ziehen. „durchqueren“ ist knapp, natürlich und gibt die räumliche Bewegung deutlich wieder.
- source_word: ἐπείρασεν
  choice: hat … erprobt
  rationale: πειράω kann prüfen, erproben oder durch Erfahrung kennenlernen bedeuten. „erprobt“ erhält den aktiven Aspekt des Prüfens, ohne die mögliche Erfahrungsbedeutung auszuschließen.
- source_word: ἀγαθὰ καὶ κακὰ
  choice: Gutes und Böses
  rationale: Die substantivierten Adjektive bilden einen weiten Gegensatz, der moralische wie erfahrungsbezogene Dimensionen haben kann. Die direkte Wiedergabe vermeidet eine Verengung auf Glück und Unglück.
- source_word: ἐν ἀνθρώποις
  choice: unter den Menschen
  rationale: ἄνθρωποι bezeichnet hier Menschen bzw. die menschliche Gesellschaft allgemein. Das deutsche „Menschen“ ist die direkte, natürliche Entsprechung und legt keine ausschließlich männliche Gruppe nahe.
theological_decisions:
- issue: Bedeutungsumfang von ἀγαθὰ καὶ κακὰ
  choice: Gutes und Böses
  alternative: Gutes und Schlechtes; Glück und Unglück
  rationale: Der griechische Gegensatz kann sowohl moralisch als auch allgemein erfahrungsbezogen verstanden werden. „Gutes und Böses“ bewahrt seine traditionelle Breite und Spannung, statt ihn auf Lebensumstände zu beschränken.
- issue: Prüfen oder erfahren in ἐπείρασεν
  choice: erprobt
  alternative: erfahren; durch Erfahrung kennengelernt
  rationale: Die aktive Form kann ein Prüfen durch Versuch ebenso wie erworbene Erfahrung bezeichnen. Der Haupttext erhält mit „erprobt“ die aktive Nuance; die Fußnote nennt die wichtige Erfahrungslesart.
- issue: Personenbezeichnungen in μεγιστάνων und ἀνθρώποις
  choice: „hochgestellten Männern“ für μεγιστάνων, aber „Menschen“ für das generische ἀνθρώποις
  alternative: „Mächtigen“ und „Männern“
  rationale: Der erste Ausdruck bezeichnet konkrete Angehörige einer historisch männlich geprägten Führungsschicht und wird entsprechend markiert. ἀνθρώποις ist dagegen die übliche allgemeine Bezeichnung für Menschen; im modernen Deutschen gibt „Menschen“ diesen Umfang genauer wieder.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzführung. „Hochgestellte Männer“ macht den gesellschaftlichen Rang verständlich, ohne das seltene Fremdwort „Magnaten“ zu verwenden. Der Semikolonanschluss bildet die begründende Fortsetzung mit γάρ ab.
