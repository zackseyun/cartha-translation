  yaml_path: translation/deuterocanon/sirach/039/008.yaml
  text: He himself makes plain the instruction of his teaching[b][a], and in the law of the Lord’s covenant he will boast.
translation:
  language: de
  text: Er selbst macht die Unterweisung seiner Lehre deutlich[a], und im Gesetz des Bundes des Herrn wird er sich rühmen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „bringt die formende Unterweisung seiner Lehre ans Licht“. Die griechischen Wörter können sowohl das Erziehen und Schulen als auch das Sichtbar- oder Deutlichmachen bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „wird er sich des Gesetzes des Bundes des Herrn rühmen“; auch: „wird er sich im Gesetz des Bundes des Herrn seiner Ehre rühmen“. Das griechische Verb kann ein Sich-Rühmen oder ein freudiges Sich-Berufen auf etwas ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτὸς
  choice: Er selbst
  rationale: Das betonte Pronomen hebt die handelnde Person hervor; „Er selbst“ bewahrt diesen Nachdruck.
- source_word: ἐκφαίνει
  choice: macht … deutlich
  rationale: Das Verb bezeichnet, dass etwas ans Licht gebracht oder klar erkennbar gemacht wird. Die Formulierung ist im modernen Deutsch natürlich und bewahrt den Gedanken des Verdeutlichens.
- source_word: παιδείαν
  choice: Unterweisung
  rationale: παιδεία umfasst in der Weisheitsliteratur Lehre, Bildung und formende Erziehung. „Unterweisung“ gibt den pädagogischen Sinn wieder, ohne einseitig an Strafe denken zu lassen.
- source_word: διδασκαλίας
  choice: Lehre
  rationale: „Lehre“ wahrt den allgemeinen pädagogischen Sinn von διδασκαλία und klingt weniger fachkirchlich als „Doktrin“.
- source_word: νόμῳ
  choice: Gesetz
  rationale: Im jüdischen Weisheitskontext verweist νόμος natürlicherweise auf das Gesetz beziehungsweise die Tora; „Gesetz“ ist die klare, geläufige Wiedergabe.
- source_word: διαθήκης
  choice: Bundes
  rationale: Im biblischen Sprachgebrauch bezeichnet διαθήκη den Bund. Der Genitiv wird entsprechend der griechischen Struktur an „Gesetz“ angeschlossen.
- source_word: Κυρίου
  choice: des Herrn
  rationale: κύριος wird im biblischen Gottesbezug mit „Herr“ wiedergegeben; der Genitiv fügt sich natürlich in die Nominalgruppe ein.
- source_word: καυχήσεται
  choice: wird er sich rühmen
  rationale: Das Futur Medium bezeichnet ein Sich-Rühmen oder Stolz-Sein. „Sich rühmen“ ist direkt, würdig und lässt die mögliche positive oder negative Wertung des Verbs offen.
theological_decisions:
- issue: Verhältnis von „Gesetz“ und „Bund“ in ἐν νόμῳ διαθήκης Κυρίου
  choice: „im Gesetz des Bundes des Herrn“; διαθήκης wird als Genitivattribut zu νόμῳ verstanden.
  alternative: „im Gesetz, dem Bund des Herrn“ oder „im Bundesgesetz des Herrn“
  rationale: Die gewählte Fassung bildet die Genitivverknüpfung des Griechischen eng ab, ohne genauer festzulegen, in welchem Sinn Gesetz und Bund aufeinander bezogen sind.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die leicht dichte Wendung „Unterweisung seiner Lehre“ bewahrt die griechische Verbindung zweier pädagogischer Begriffe; die Fußnote erläutert deren Bedeutungsbreite. Die gestufte Genitivfolge „Gesetz des Bundes des Herrn“ ist bewusst beibehalten, um die theologische Beziehung zwischen Gesetz und Bund nicht aufzulösen.
