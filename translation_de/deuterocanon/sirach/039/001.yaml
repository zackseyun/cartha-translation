  yaml_path: translation/deuterocanon/sirach/039/001.yaml
  text: But the one who gives himself over to it and meditates on the law of the Most High will seek out the wisdom of all the ancients[b][a], and will occupy himself with prophecies.
translation:
  language: de
  text: 'Anders ist es bei dem, der sich mit ganzer Seele hingibt[a] und über das Gesetz des Höchsten nachdenkt: Er wird die Weisheit aller Menschen der Vorzeit erforschen und sich mit Prophezeiungen[b] beschäftigen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „der seine Seele beziehungsweise sein Selbst hingibt“. Das Ziel dieser Hingabe bleibt im Griechischen unausgesprochen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „mit prophetischen Schriften“. Wörtlich steht hier „mit Prophezeiungen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πλὴν τοῦ
  choice: Anders ist es bei dem
  rationale: Die Wendung setzt diese Person in Kontrast zu den zuvor beschriebenen Arbeitern. Im Deutschen gibt „Anders ist es bei dem“ die adversative Kraft natürlich wieder und lässt zugleich erkennen, dass der Vers syntaktisch an den vorherigen Zusammenhang anschließt.
- source_word: τοῦ ἐπιδιδόντος τὴν ψυχὴν αὐτοῦ
  choice: der sich ganz hingibt
  rationale: Wörtlich ist vom Hingeben der eigenen ψυχή, also der Seele beziehungsweise des ganzen Selbst, die Rede. Die reflexive Formulierung gibt die umfassende persönliche Hingabe idiomatisch wieder, ohne ein im Griechischen nicht genanntes Objekt festzulegen.
- source_word: διανοουμένου
  choice: nachdenkt
  rationale: Das Partizip bezeichnet eine bewusste, anhaltende geistige Beschäftigung. „Nachdenken“ ist gegenwärtig und verständlich, ohne eine spezielle religiöse Praxis stärker zu behaupten, als der griechische Ausdruck verlangt.
- source_word: ἐν νόμῳ Ὑψίστου
  choice: über das Gesetz des Höchsten
  rationale: Bei einem Verb des Denkens ist „über“ im Deutschen idiomatisch. νόμος wird als „Gesetz“ und Ὕψιστος als der etablierte Gottes-Titel „der Höchste“ wiedergegeben.
- source_word: σοφίαν πάντων ἀρχαίων
  choice: die Weisheit aller Menschen aus alter Zeit
  rationale: ἀρχαῖοι bezeichnet hier die Menschen früherer Zeiten. Die Formulierung ist klarer und natürlicher als das im heutigen Deutsch leicht distanzierte oder missverständliche „die Alten“.
- source_word: ἐκζητήσει
  choice: wird … erforschen
  rationale: Das verstärkte Suchverb bezeichnet ein gründliches Aufsuchen und Untersuchen. „Erforschen“ bewahrt diese Intensität in natürlichem Deutsch.
- source_word: ἐν προφητείαις ἀσχοληθήσεται
  choice: wird sich mit Prophezeiungen beschäftigen
  rationale: ἀσχολέομαι bedeutet, sich eingehend mit etwas zu befassen; προφητεῖαι bezeichnet unmittelbar Prophezeiungen. Die Übersetzung bleibt bei dieser offenen Bezeichnung und legt nicht stillschweigend fest, dass ausschließlich prophetische Schriften gemeint sind.
theological_decisions:
- issue: Nicht genanntes Bezugsobjekt der Hingabe
  choice: 'Kein Objekt ergänzen: „der sich ganz hingibt“'
  alternative: „der sich dem Studium der Weisheit/des Gesetzes hingibt“
  rationale: Das Griechische nennt nach „seine Seele hingeben“ kein ausdrückliches Ziel der Hingabe. Der Kontext legt die gelehrte Beschäftigung nahe, bestimmt sie an dieser Stelle aber nicht näher. Die deutsche reflexive Wendung bleibt grammatisch möglich und bewahrt diese Offenheit.
- issue: Bedeutungsumfang von προφητείαις
  choice: „Prophezeiungen“
  alternative: „prophetische Schriften“
  rationale: Der griechische Plural kann Prophezeiungen beziehungsweise prophetische Überlieferungen meinen; die Eingrenzung auf schriftliche Texte ist im Wort selbst nicht ausdrücklich enthalten und wird daher nur in der Fußnote als mögliche Deutung genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der einleitende Kontrast wird wegen des syntaktischen Anschlusses an den vorherigen Abschnitt mit „Anders ist es bei dem“ ausgedrückt. Die Satzgliederung mit Doppelpunkt macht den Wechsel von der Personenbeschreibung zur Zukunftsaussage verständlich, ohne den Gedankengang zu glätten.
