  text: If he remains steadfast[a], he will leave behind a name beyond a thousand; and if he comes to rest[b], he still accomplishes them.
translation:
  language: de
  text: Wenn er standhaft bleibt, wird er einen Namen hinterlassen, der den von tausend überragt[a]; und wenn er zur Ruhe kommt[b], bringt er diese Dinge dennoch zustande[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich steht im Griechischen knapp: „einen Namen hinterlassen als tausend“. Wahrscheinlich ist gemeint, dass sein Name den Namen von tausend anderen überragt.'
    reason: lexical_alternative
  - marker: b
    text: „Zur Ruhe kommen“ kann hier auch den Tod andeuten, ohne darauf beschränkt zu sein.
    reason: alternative_reading
  - marker: c
    text: Worauf sich „diese Dinge“ bezieht, bleibt im Griechischen unbestimmt; möglicherweise sind die Werke oder Wirkungen des Weisen gemeint.
    reason: textual_difficulty
lexical_decisions:
- source_word: ἐὰν ἐμμένῃ
  choice: Wenn er fortbesteht
  rationale: ἐμμένω bezeichnet das Bleiben, Fortdauern oder beharrliche Verharren. „Fortbesteht“ passt zum Gegensatz mit dem anschließenden Zur-Ruhe-Kommen, ohne den Ausdruck ausdrücklich auf ein langes Leben oder auf Standhaftigkeit festzulegen.
- source_word: ὄνομα καταλείψει
  choice: wird er einen Namen hinterlassen
  rationale: Die biblische Wendung bezeichnet einen bleibenden Namen beziehungsweise Nachruhm. Die konkrete Bildsprache des Griechischen bleibt erhalten und ist im Deutschen verständlich.
- source_word: ἢ χίλιοι
  choice: der den von tausend überragt
  rationale: 'Das überlieferte ἢ ist in dieser knappen Form schwierig. Im Zusammenhang liegt ein Vergleich nahe: Der hinterlassene Name überragt den Namen von tausend anderen. Die Ergänzung „den von“ macht diesen wahrscheinlichen Sinn auf Deutsch verständlich, während eine Fußnote die sprachliche Schwierigkeit offenlegt.'
- source_word: ἐὰν ἀναπαύσηται
  choice: wenn er zur Ruhe kommt
  rationale: ἀναπαύομαι bedeutet ruhen oder zur Ruhe kommen und kann hier zugleich auf den Tod anspielen. Die Formulierung bewahrt diese Mehrdeutigkeit.
- source_word: ἐμποιεῖ
  choice: bringt ... zustande
  rationale: ἐμποιέω kann „hervorbringen“, „bewirken“ oder „zustande bringen“ bedeuten. Die gewählte Wendung ist natürlich und lässt die Art der fortwirkenden Leistung offen.
- source_word: αὐτά
  choice: diese Dinge
  rationale: Das griechische Pronomen steht im Neutrum Plural und hat einen nicht eindeutig bestimmten Bezug. „Diese Dinge“ bewahrt Numerus und Unbestimmtheit, statt einen bestimmten Nachruhm oder bestimmte Werke einzusetzen.
theological_decisions:
- issue: Möglicher Hinweis auf den Tod in ἀναπαύσηται
  choice: „wenn er zur Ruhe kommt“
  alternative: „wenn er stirbt“
  rationale: Der Zusammenhang kann an den Tod des Weisen und das Fortwirken seines Lebenswerks denken. Da das griechische Verb jedoch allgemein „ruhen“ bedeutet, wird der Tod nicht ausdrücklich in den Haupttext eingetragen.
- issue: Fortdauernde Wirkung des Weisen nach seiner Ruhe
  choice: Das unbestimmte „diese Dinge“ bleibt erhalten
  alternative: Ausdrückliche Deutung als fortwirkender Ruhm oder fortwirkende Werke
  rationale: Der griechische Plural αὐτά nennt seinen Bezug nicht eindeutig. Eine präzisere theologische Aussage über Nachruhm oder posthume Wirkung würde den schwierigen Wortlaut stärker festlegen, als es die Quelle erlaubt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bleibt eng am knappen griechischen Parallelismus. Die schwierige Vergleichsformel und der unklare Bezug des Schlusspronomens werden nicht stillschweigend zu einer bestimmten Lehraussage geglättet.
