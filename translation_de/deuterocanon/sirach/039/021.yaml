  text: One should not say[a], “Why this and why that?” For everything will prevail in its time.
translation:
  language: de
  text: 'Man soll nicht sagen: »Warum dies und warum das?« Denn alles wird zu seiner Zeit die Oberhand gewinnen[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Griechisch: »Denn alles wurde für ihren Bedarf/Nutzen geschaffen.« Hebräisch: »Denn alles wird zu seiner Zeit die Oberhand gewinnen.«'
    reason: alternative_reading
lexical_decisions:
- source_word: אין לאמר
  choice: Man soll nicht sagen
  rationale: Die unpersönliche hebräische Wendung bezeichnet hier eine allgemeine Mahnung. »Man soll nicht sagen« ist im modernen Deutschen natürlich und bewahrt ihren nicht unmittelbar befehlenden Charakter.
- source_word: זה למה זה
  choice: »Warum dies und warum das?«
  rationale: Die Wiedergabe erhält die wiederholte Gegenüberstellung mit זה und den rhetorisch-fragenden Ton. Die knappe Parallelstruktur klingt zugleich natürlich auf Deutsch.
- source_word: כי
  choice: Denn
  rationale: Die Konjunktion leitet die Begründung der vorangehenden Mahnung ein.
- source_word: הכל
  choice: alles
  rationale: Das substantivisch gebrauchte »alles« gibt den umfassenden Geltungsbereich knapp und idiomatisch wieder.
- source_word: בעתו
  choice: zu seiner Zeit
  rationale: Die Form bezeichnet die jeweils eigene oder angemessene Zeit. »Zu seiner Zeit« bewahrt den pronominalen Bezug, ohne »rechtzeitig« oder »zur bestimmten Zeit« interpretierend einzutragen.
- source_word: יגבר
  choice: wird die Oberhand gewinnen
  rationale: Das Verb גבר bedeutet stark oder überlegen sein beziehungsweise sich durchsetzen. »Die Oberhand gewinnen« hält diese Kraft- und Überlegenheitsnuance deutlicher fest als eine freie Zweckdeutung.
theological_decisions:
- issue: Abweichung zwischen hebräischem und griechischem zweiten Satzteil
  choice: 'Der erhaltene hebräische Text steht im Haupttext: »Denn alles wird zu seiner Zeit die Oberhand gewinnen.«'
  alternative: »Denn alles wurde für seinen jeweiligen Bedarf/Nutzen geschaffen.«
  rationale: Da ein hoch eingestufter hebräischer Text vorliegt, bildet er die Grundlage. Die griechische Überlieferung bietet eine sachlich deutlich andere Begründung, die nicht in den Haupttext eingemischt, aber wegen ihres Gewichts in einer Fußnote dokumentiert wird.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die allgemeine Weisheitsmahnung bleibt knapp; die kräftige, im Deutschen leicht ungewöhnliche Aussage des hebräischen Verbs wird bewusst nicht zu einer Zweck- oder Nützlichkeitsaussage geglättet.
