  text: All these things are for good to the good[a]; so also for the wicked they are turned to harm.
translation:
  language: de
  text: All dies kommt den Guten zugute[a]; so wird es für die Bösen zum Schaden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die griechische Parallele hat „den Gottesfürchtigen“ statt schlicht „den Guten“. Der hebräische Text lautet „den Guten“.
    reason: alternative_reading
lexical_decisions:
- source_word: כל אלה
  choice: All dies
  rationale: Gibt die umfassende hebräische Wendung knapp und natürlich wieder.
- source_word: לטובים ייטיבו
  choice: kommt den Guten zugute
  rationale: Bewahrt sowohl den Personenbezug von לטובים („den Guten“) als auch die wohltuende Wirkung von ייטיבו in idiomatischem Deutsch.
- source_word: כן
  choice: dagegen
  rationale: Im antithetischen Parallelismus markiert כן hier die entsprechende, jedoch gegensätzliche Folge für die Bösen; „dagegen“ macht diesen Zusammenhang natürlich deutlich.
- source_word: לרעים
  choice: den Bösen
  rationale: Das substantivierte Adjektiv bezeichnet moralisch schlechte Menschen; die Wiedergabe folgt dem Hebräischen und vermeidet die engere griechische Lesart „Sünder“.
- source_word: לרעה נהפכו
  choice: verwandelt es sich zum Schaden
  rationale: Die reflexiv-passive Bedeutung von הפך und die nachteilige Folge von רעה werden gewahrt. Das singularische „es“ nimmt das zusammenfassende „all dies“ idiomatisch wieder auf.
theological_decisions:
- issue: Moralisch-religiöse Bezeichnung der Begünstigten
  choice: den Guten
  alternative: den Gottesfürchtigen / den Frommen
  rationale: Der hebräische Haupttext hat טובים („Gute“), während die griechische Parallele εὐσεβεῖς („Gottesfürchtige/Fromme“) bietet. Der Haupttext folgt dem Hebräischen; die engere religiöse Deutung wird in der Fußnote ausgewiesen.
- issue: Bezeichnung der negativ charakterisierten Gruppe
  choice: den Bösen
  alternative: den Sündern
  rationale: Hebräisch רעים ist breiter als das griechische ἁμαρτωλοί. Daher wird die hebräische moralische Bezeichnung beibehalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der knappe Weisheitsspruch bleibt in seiner antithetischen Struktur erhalten; die hebräische Lesart hat Vorrang, die abweichende Nuance der griechischen Parallele wird transparent vermerkt.
