review_pass:
  verdict: revise
  source_fidelity: Der erste Halbvers ist zutreffend als Nutzen für „die Guten“ wiedergegeben. Im zweiten Halbvers bezeichnet כן jedoch eine entsprechende Parallele („so/ebenso“) und nicht ausdrücklich einen Gegensatz. נהפכו beschreibt, dass dieselben Dinge für die Bösen zu Schaden werden. Die Revision gibt dies ohne die etwas unidiomatische reflexive Formulierung „verwandelt es sich“ wieder.
  naturalness: „Den Bösen dagegen verwandelt es sich zum Schaden“ ist im modernen Standarddeutsch syntaktisch schwerfällig und die Bezugnahme von „es“ bleibt unerquicklich. „So wird es für die Bösen zum Schaden“ ist knapp, natürlich und bewahrt den weisheitlichen Parallelismus.
  terminology: „die Guten“ und „die Bösen“ geben טובים beziehungsweise רעים angemessen wieder. Die Fußnote weist sachgerecht darauf hin, dass die griechische Parallele die erste Gruppe als „Gottesfürchtige“ präzisiert, ohne diese engere Lesart in den hebräischbasierten Haupttext zu übernehmen.
  issues:
  - severity: medium
    issue: „dagegen“ für כן
    rationale: כן bedeutet hier primär „so/ebenso“ und markiert die Entsprechung der beiden Glieder. Der inhaltliche Kontrast ergibt sich aus Nutzen und Schaden; „dagegen“ fügt eine explizite kontrastive Verknüpfung hinzu, die im Hebräischen nicht ausgedrückt ist.
  - severity: medium
    issue: „verwandelt es sich zum Schaden“
    rationale: Die Formulierung ist im Deutschen unnatürlich. Außerdem ist die hebräische Pluralform auf „all diese Dinge“ bezogen; eine Konstruktion mit „wird ... zum Schaden“ gibt die resultative Wendung klarer wieder.
  revised_text: All dies kommt den Guten zugute[a]; so wird es für die Bösen zum Schaden.
