base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/039/028.yaml
  text: There are spirits created for judgment[a], and in their anger they move mountains; at the time of wrath they display their might[b], and they stir up a storm from the open country.
translation:
  language: de
  text: Es gibt Geister, die zum Gericht erschaffen wurden[a], und in ihrem Zorn versetzen sie Berge; zur Zeit des Zorns zeigen sie ihre Macht[b] und erregen vom offenen Land her einen Sturm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Winde, die zur Strafe erschaffen wurden«. Das hebräische רוחות und das griechische πνεύματα können sowohl »Geister« als auch »Winde« bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: Der zweite Satzteil steht in der hebräischen Kairoer-Geniza-Ausgabe in Klammern, was auf eine gewisse textliche Unsicherheit hinweist; der griechische Text stützt die Aufnahme des erweiterten Verssinns.
    reason: textual_variant
lexical_decisions:
- source_word: רוחות
  choice: Geister
  rationale: Das hebräische Wort kann sowohl »Geister« als auch »Winde« bezeichnen; auch das griechische πνεύματα lässt beide Bedeutungen zu. »Geister« gibt im Haupttext die als geschaffen und handelnd dargestellten Mächte wieder, während die Wetterbedeutung in der Fußnote erhalten bleibt.
- source_word: למשפט
  choice: zum Gericht
  rationale: Die Wendung bezeichnet den Zweck ihrer Erschaffung. »Zum Gericht« wahrt die Breite des Ausdrucks und schließt strafendes Handeln ein, ohne es darauf zu verengen.
- source_word: נוצרו
  choice: erschaffen wurden
  rationale: Die Passivform bezeichnet ihr Erschaffen beziehungsweise Formen und stimmt mit dem griechischen ἔκτισται überein.
- source_word: ובאפם
  choice: in ihrem Zorn
  rationale: אף bezeichnet idiomatisch den Zorn; dies wird auch durch das griechische ἐν θυμῷ αὐτῶν gestützt.
- source_word: הרים יעתיקו
  choice: versetzen sie Berge
  rationale: Das Verb beschreibt das Verrücken oder Entfernen von Bergen. »Berge versetzen« bewahrt das starke Bild und ist im Deutschen natürlich.
- source_word: בעת זעם
  choice: zur Zeit des Zorns
  rationale: Die Formulierung gibt den Zeitpunkt ihres machtvollen Wirkens eng und verständlich wieder.
- source_word: גבורתם יראו
  choice: zeigen sie ihre Macht
  rationale: Die hebräische Wendung besagt, dass ihre Stärke sichtbar wird beziehungsweise von ihnen gezeigt wird.
- source_word: וסער מן שדה יעוררו
  choice: und entfachen einen Sturm aus dem offenen Land
  rationale: סער ist ein Sturm, יעוררו bezeichnet das Erregen oder Entfachen, und שדה meint wörtlich Feld beziehungsweise offenes Land. Die Wiedergabe bewahrt das Landschaftsbild, ohne es unnötig zu »Ödland« zu verengen.
theological_decisions:
- issue: Sind רוחות/πνεύματα unpersönliche Winde oder personifiziert handelnde Geister?
  choice: Im Haupttext »Geister«, die zum Gericht erschaffen wurden
  alternative: »Winde, die zur Strafe erschaffen wurden«
  rationale: Hebräisch und Griechisch lassen beide Lesarten zu; die Rede von Erschaffung, Zorn und handelnder Macht spricht für die personifizierte Wiedergabe, während die meteorologische Lesart durch die Fußnote ausdrücklich offengehalten wird.
- issue: Umgang mit dem im hebräischen Text eingeklammerten zweiten Versteil
  choice: Den Versteil im Haupttext aufnehmen und seine textliche Unsicherheit anmerken
  alternative: Den eingeklammerten Versteil auslassen
  rationale: Die Klammern in der Kahana-Ausgabe signalisieren Unsicherheit, doch der griechische Paralleltext bezeugt einen entsprechenden erweiterten Vers. Aufnahme mit transparenter Fußnote wahrt beide Befunde.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die Satzstruktur folgt der poetischen Parallelität des Hebräischen; »offenes Land« gibt שדה konkreter und weniger interpretierend wieder als »Ödland«.
