  text: He will preserve the accounts of famous men, and he will enter into the twists of parables.
translation:
  language: de
  text: Er wird die Erzählungen berühmter Männer bewahren und in die Wendungen der Gleichnisse eindringen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διηγήσεις
  choice: Erzählungen
  rationale: Bezeichnet Berichte oder erzählende Darstellungen; „Erzählungen“ gibt den Sinn im Deutschen klar und würdig wieder.
- source_word: ἀνδρῶν ὀνομαστῶν
  choice: berühmter Männer
  rationale: ὀνομαστός bezeichnet namentlich bekannte, angesehene oder berühmte Personen; die konkrete maskuline Form wird beibehalten.
- source_word: συντηρήσει
  choice: bewahren
  rationale: Gibt den Grundsinn des sorgfältigen Erhaltens oder Im-Gedächtnis-Behaltens wieder, ohne zwischen äußerer Überlieferung und innerem Erinnern zu entscheiden.
- source_word: στροφαῖς παραβολῶν
  choice: Wendungen der Gleichnisse
  rationale: στροφή kann Drehung, Wendung oder verwickelte Gedankenführung bezeichnen. „Wendungen“ wahrt das Bild und die mögliche Bedeutung von Feinheiten oder verschlungenen Zügen.
- source_word: συνεισελεύσεται
  choice: eindringen
  rationale: Die Zusammensetzung bezeichnet hier ein Hineingehen beziehungsweise vertieftes Erschließen; „eindringen“ ist im Deutschen natürlich und bringt die intensive Beschäftigung zum Ausdruck.
