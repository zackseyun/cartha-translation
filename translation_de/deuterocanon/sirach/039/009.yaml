base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/039/009.yaml
  text: Many will praise his understanding; it will not be blotted out forever. His remembrance will not depart[a], and his name will live for generations of generations.
translation:
  language: de
  text: Viele werden seine Einsicht rühmen; sie wird in Ewigkeit nicht ausgelöscht werden. Sein Andenken wird nicht vergehen, und sein Name wird durch Generationen und Generationen hindurch leben.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „für Generationen von Generationen“. Die griechische Wendung bezeichnet ein Fortdauern durch immer neue Generationen hindurch.'
    reason: lexical_alternative
lexical_decisions:
- source_word: αἰνέσουσιν
  choice: werden … rühmen
  rationale: Das Futur von αἰνέω bezeichnet öffentliches Lob. „Rühmen“ ist im Deutschen würdig und passt zur bleibenden Anerkennung eines Weisen.
- source_word: σύνεσιν
  choice: Einsicht
  rationale: σύνεσις bezeichnet Verständnis, Einsicht oder Urteilsvermögen. „Einsicht“ klingt in der Weisheitsliteratur natürlich und vermeidet eine rein intellektuelle Verengung.
- source_word: ἕως τοῦ αἰῶνος
  choice: in Ewigkeit
  rationale: Die Wendung drückt unbegrenzte Dauer aus. „In Ewigkeit“ gibt den idiomatischen Sinn wieder und wahrt zugleich den feierlichen Ton.
- source_word: ἐξαλειφθήσεται
  choice: wird … nicht ausgelöscht werden
  rationale: Das Verb bezeichnet ein Auswischen oder Auslöschen. „Ausgelöscht“ bewahrt das konkrete Bild des griechischen Textes.
- source_word: μνημόσυνον
  choice: Andenken
  rationale: μνημόσυνον kann Erinnerung, Gedenken oder Erinnerungszeichen bedeuten. Im Parallelismus mit dem fortlebenden Namen bezeichnet „Andenken“ am natürlichsten die fortdauernde Erinnerung an die Person.
- source_word: ἀποστήσεται
  choice: wird nicht vergehen
  rationale: Das Verb bedeutet grundsätzlich fortgehen, weichen oder sich entfernen. Mit „Andenken“ als Subjekt drückt „nicht vergehen“ denselben Fortbestand in natürlichem Deutsch aus.
- source_word: ὄνομα
  choice: Name
  rationale: Die direkte Entsprechung erhält das Bild, wonach der Name für Ansehen und fortdauernden Ruhm steht.
- source_word: ζήσεται
  choice: wird … leben
  rationale: Die wörtliche Wiedergabe bewahrt die anschauliche Personifikation des Namens.
- source_word: εἰς γενεὰς γενεῶν
  choice: von Generation zu Generation
  rationale: Die griechische, semitisch geprägte Steigerungsformel bezeichnet das Fortdauern über aufeinanderfolgende Generationen. Die gewählte deutsche Wendung ist idiomatisch und erhält diesen Sinn.
theological_decisions:
- issue: Grad der Bildtreue bei der Aussage über den bleibenden Ruhm
  choice: Die Bilder vom Auslöschen, vom fortbestehenden Andenken und vom lebenden Namen bleiben erhalten.
  alternative: Sein Vermächtnis wird für immer fortbestehen.
  rationale: Der griechische Text verwendet mehrere konkrete poetische Bilder. Eine Zusammenfassung als „Vermächtnis“ würde deren literarische und theologische Spannung einebnen.
- issue: Unausgesprochenes Subjekt von ἐξαλειφθήσεται
  choice: Das Pronomen „sie“ bezieht sich auf die unmittelbar zuvor genannte „Einsicht“.
  alternative: Die Verbform unpersönlich oder auf das spätere „Andenken“ beziehen.
  rationale: Die nächstliegende syntaktische Rückbindung gilt der vorausgehenden σύνεσις. Der deutsche Satz macht diese Verbindung deutlich, ohne ein zusätzliches inhaltliches Substantiv einzuführen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem weisheitlichem Ton. Der Parallelismus und die konkreten Bilder des griechischen Textes bleiben erhalten; schwerfällige Gräzismen werden vermieden.
