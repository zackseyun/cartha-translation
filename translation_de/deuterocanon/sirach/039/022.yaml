  text: Blessings overflowed like the Nile[b][a], and like a river they drenched the world.
translation:
  language: de
  text: Segnungen[a] strömten wie der Nil über und durchtränkten wie ein Strom die Welt.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: »Segnungen«; die griechische Parallelüberlieferung liest im Singular: »sein Segen«.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: »bewässerten die Welt« oder »sättigten die Welt mit Wasser«. Die griechische Parallelüberlieferung liest: »und wie eine Flut durchtränkte er das trockene Land«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ברכות
  choice: Segnungen
  rationale: Die hebräische Vorlage hat die Pluralform »Segnungen«. Diese wird im Haupttext bewahrt, obwohl die griechische Parallelüberlieferung den Singular »sein Segen« bietet.
- source_word: כיאור
  choice: wie der Nil
  rationale: יאור bezeichnet gewöhnlich den Nil; die konkrete Anspielung auf dessen lebensspendende Überschwemmung bleibt so erhalten.
- source_word: הציפה
  choice: strömten über
  rationale: Das Verb beschreibt ein Überfluten oder Überströmen. Die deutsche Pluralform richtet sich nach dem hebräischen Subjekt »Segnungen« und gibt das Bild natürlich wieder.
- source_word: וכנהר
  choice: wie ein Strom
  rationale: Die zweite Vergleichsfigur setzt das Wasserbild fort. »Strom« ist hier würdevoll und vermeidet die unmittelbare Wiederholung von »Nil« als Fluss.
- source_word: תבל
  choice: die Welt
  rationale: תבל bezeichnet die Welt, häufig als bewohnte Welt verstanden. »Die Welt« ist im Deutschen natürlich und wahrt die Weite des Bildes.
- source_word: ריותה
  choice: tränkten
  rationale: Die Form bezeichnet reichliches Bewässern oder Sättigen mit Wasser. »Tränkten« bewahrt das lebensspendende Bild, ohne die im Griechischen mögliche Nuance des Durchnässens zu übersteigern.
theological_decisions:
- issue: Numerus von »Segen/Segnungen«
  choice: 'Plural: »Segnungen«'
  alternative: 'Singular: »sein Segen«'
  rationale: Der hebräische Ausgangstext bietet ausdrücklich den Plural. Die abweichende griechische Lesart wird transparent in einer Fußnote dokumentiert, aber nicht an die Stelle des hoch bewerteten hebräischen Textes gesetzt.
- issue: Göttlicher Bezug der Segnungen
  choice: Kein Possessivpronomen ergänzt
  alternative: »sein Segen« oder »Gottes Segen«
  rationale: Im vorliegenden hebräischen Wortlaut steht kein Possessivsuffix. Der Kontext mag den Geber erkennen lassen, doch der Vers wird nicht durch eine ausdrückliche Identifizierung erweitert.
- issue: Ziel der Bewässerung
  choice: »die Welt« nach dem Hebräischen
  alternative: »das trockene Land« nach dem Griechischen
  rationale: Die hebräische Vorlage liest תבל, »Welt«. Die griechische Parallelüberlieferung hat dagegen »trockenes Land«; diese echte Textdifferenz wird in der Fußnote erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe poetische Parallelstruktur und das doppelte Wasserbild werden bewahrt. Der hebräische Plural erhält Vorrang; Abweichungen der griechischen Überlieferung werden nicht harmonisiert, sondern in den Fußnoten offengelegt.
