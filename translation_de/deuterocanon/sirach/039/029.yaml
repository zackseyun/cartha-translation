  text: Fire and hail[a], famine and pestilence—these also were created for judgment.
translation:
  language: de
  text: Feuer und Hagel, Hungersnot und Seuche – auch diese wurden zum Gericht erschaffen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Griechisch: „All diese Dinge wurden zur Vergeltung erschaffen“ oder „All diese Dinge wurden zur Bestrafung erschaffen.“ Der hebräische Text lautet: „zum Gericht“.'
    reason: alternative_reading
lexical_decisions:
- source_word: אש
  choice: Feuer
  rationale: Die gewöhnliche Bedeutung des hebräischen Substantivs ist „Feuer“; dies entspricht auch dem griechischen πῦρ.
- source_word: ברד
  choice: Hagel
  rationale: Die direkte und natürliche deutsche Bezeichnung des Wetterphänomens; bestätigt durch griechisch χάλαζα.
- source_word: רעב
  choice: Hungersnot
  rationale: Im Zusammenhang einer Reihe öffentlicher Katastrophen bezeichnet רעב eher eine Hungersnot als lediglich individuellen Hunger; dazu passt griechisch λιμός.
- source_word: דבר
  choice: Seuche
  rationale: דבר bezeichnet häufig eine verheerende Seuche oder Pest. „Seuche“ ist in modernem Deutsch verständlich und bewahrt den Katastrophensinn, ohne das Wort wie das griechische θάνατος allgemein als „Tod“ wiederzugeben.
- source_word: גם אלה
  choice: auch diese
  rationale: Die Wendung fügt die genannten zerstörerischen Erscheinungen dem zuvor Besprochenen hinzu und bewahrt so die additive Bedeutung.
- source_word: למשפט
  choice: zum Gericht
  rationale: משפט kann Gericht oder Gerechtigkeit bezeichnen. „Zum Gericht“ bewahrt hier den weiteren richterlichen Sinn, ohne ihn vorschnell auf Strafe oder Vergeltung zu verengen.
- source_word: נוצרו
  choice: wurden erschaffen
  rationale: Die passive Pluralform weist auf das Hervorbringen dieser Dinge hin. „Erschaffen“ ist im Schöpfungszusammenhang natürlich und lässt die im Text nicht ausdrücklich genannte göttliche Urheberschaft implizit.
theological_decisions:
- issue: Nuance des Schlusssatzes im Hebräischen gegenüber dem Griechischen
  choice: Der Haupttext folgt dem hebräischen „zum Gericht“.
  alternative: Das Griechische kann mit „zur Vergeltung“ oder „zur Bestrafung“ wiedergegeben werden.
  rationale: Der vorhandene hebräische Text ist die primäre Grundlage und liest למשפט. Die griechische Parallele εἰς ἐκδίκησιν verschärft die Aussage in Richtung strafender Vergeltung. Diese Abweichung wird in der Fußnote bewahrt, ohne den hebräischen Haupttext entsprechend einzuengen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Aufzählung und der passive Schöpfungssatz des Hebräischen bleiben erhalten; der Gedankenstrich markiert den Übergang zur zusammenfassenden Aussage.
