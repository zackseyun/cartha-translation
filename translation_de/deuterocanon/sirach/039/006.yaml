  text: If the great Lord wills[a], he will be filled with a spirit of understanding; he himself will pour forth words of wisdom like rain[b], and in prayer he will give thanks to the Lord.
translation:
  language: de
  text: Wenn der große Herr es will, wird er mit einem Geist der Einsicht erfüllt werden. Er selbst wird Worte der Weisheit herabregnen lassen[a] und im Gebet dem Herrn danken[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Worte der Weisheit wie Regen ausschütten“. Das griechische Verb verwendet ein Regenbild.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „den Herrn preisen“ oder „sich vor dem Herrn bekennen“. Das griechische Verb kann auch Lob, Anerkennung oder Bekenntnis ausdrücken; der Gebetszusammenhang legt hier dankendes Lob nahe.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐὰν ... θελήσῃ
  choice: Wenn ... es will
  rationale: Die Verbindung von ἐάν mit dem Aorist Konjunktiv bezeichnet eine offene Bedingung. „Wenn … es will“ gibt den Willensaspekt natürlich und präzise wieder.
- source_word: Κύριος ὁ μέγας
  choice: der große Herr
  rationale: Die attributive Wortgruppe wird direkt und in würdigem, heutigem Deutsch wiedergegeben.
- source_word: πνεύματι συνέσεως
  choice: mit einem Geist der Einsicht
  rationale: Der Dativ bezeichnet hier wahrscheinlich den Inhalt, mit dem jemand erfüllt wird. „Einsicht“ gibt συνέσις als verständiges Erfassen treffend wieder.
- source_word: ἐμπλησθήσεται
  choice: wird ... erfüllt werden
  rationale: Die Form ist Futur Passiv; die Übersetzung bewahrt sowohl Zeitstufe als auch Passiv.
- source_word: ἀνομβρήσει
  choice: wird ... wie Regen ausströmen lassen
  rationale: Das seltene Verb enthält ausdrücklich ein Regenbild. Die Formulierung bewahrt dieses Bild, ohne im Deutschen unnatürlich zu klingen.
- source_word: ῥήματα σοφίας
  choice: Worte der Weisheit
  rationale: ῥήματα bezeichnet gesprochene Worte oder Aussprüche; die gewählte Wendung ist direkt und idiomatisch.
- source_word: αὐτός
  choice: Er selbst
  rationale: Das ausdrücklich gesetzte Pronomen ist emphatisch und wird deshalb sichtbar wiedergegeben.
- source_word: ἐν προσευχῇ
  choice: im Gebet
  rationale: Die Wendung bezeichnet den Bereich oder die Weise, in der die folgende Handlung geschieht.
- source_word: ἐξομολογήσεται
  choice: wird ... danken
  rationale: Im Gebetszusammenhang bezeichnet das Verb wahrscheinlich dankendes Bekennen oder Preisen. „Danken“ ist hier natürlich, während die weiteren möglichen Bedeutungen in der Fußnote erhalten bleiben.
theological_decisions:
- issue: Bedeutung von ἐξομολογήσεται im Zusammenhang des Gebets
  choice: dem Herrn danken
  alternative: sich zum Herrn bekennen / den Herrn anerkennen oder preisen
  rationale: Der Zusammenhang von Weisheit und Gebet spricht für dankendes Lob. Da das Verb jedoch ein breiteres Bedeutungsspektrum hat, wird die echte Mehrdeutigkeit durch eine Fußnote bewahrt, ohne ein Sündenbekenntnis in den Text hineinzulesen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das Regenbild des seltenen griechischen Verbs und die Betonung durch αὐτός bleiben erhalten. Der erste griechische Satzschluss wird zur besseren Lesbarkeit als Punkt wiedergegeben; der gedankliche Zusammenhang bleibt unverändert.
