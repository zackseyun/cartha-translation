translation:
  language: de
  text: Den Guten ist von Anfang an Gutes als Anteil bestimmt; ebenso[a] den Bösen Gutes und Böses.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Parallelüberlieferung lautet: „Gutes wurde für die Guten von Anfang an geschaffen, ebenso für die Sünder Böses.“ Der hier zugrunde gelegte hebräische Text bietet ausführlicher: „den Bösen Gutes und Böses“.'
    reason: alternative_reading
lexical_decisions:
- source_word: טוב
  choice: Gutes
  rationale: Das substantivierte Adjektiv bewahrt die breite Bedeutung dessen, was gut oder wohltuend ist, und hält die knappe Wiederholung des Hebräischen fest.
- source_word: חלק
  choice: als Anteil bestimmt
  rationale: חלק bezeichnet formal einen Anteil oder ein Los. Die deutsche Wiedergabe ergänzt idiomatisch ein Prädikat und erhält zugleich das Bild der Zuteilung.
- source_word: מראש
  choice: von Anfang an
  rationale: Die Wendung bezeichnet den zeitlichen Ausgangspunkt und entspricht natürlich dem deutschen „von Anfang an“; auch die griechische Parallele hat ἀπ’ ἀρχῆς.
- source_word: לרעים
  choice: den Bösen
  rationale: רעים bezeichnet hier im weisheitlichen Gegensatz moralisch böse Menschen. Der Dativ gibt die hebräische Präposition knapp und natürlich wieder.
- source_word: טוב ורע
  choice: Gutes und Böses
  rationale: Die Wiedergabe wahrt die offene, scharfe Polarität des Hebräischen, ohne sie auf Wohlergehen und Unglück einzuengen.
theological_decisions:
- issue: Verhältnis des Schlussglieds zur griechischen Parallelüberlieferung
  choice: Der erhaltene hebräische Wortlaut sagt, dass den Bösen sowohl Gutes als auch Böses zukommt.
  alternative: 'Die griechische Parallele bietet nur: „ebenso für Sünder Böses“.'
  rationale: Der hebräische Hauptzeuge enthält ausdrücklich טוב ורע, „Gutes und Böses“. Diese spannungsreiche, umfassendere Aussage wird nicht zugunsten der vereinfachten griechischen Gegenüberstellung geglättet; die Abweichung wird in einer Fußnote offengelegt.
translation_notes:
  register: Knappes, würdevolles Weisheitsdeutsch mit erhaltener Parallelstruktur. „Als Anteil bestimmt“ macht den nominalen hebräischen Ausdruck verständlich, ohne die Zuteilungsidee aufzugeben; die ungewöhnliche Aussage des Schlussglieds bleibt bewusst unaufgelöst.
