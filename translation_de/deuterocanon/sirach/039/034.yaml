  text: Do not say[a], “This is bad[b]; what is this?” for everything will prevail in its time.
translation:
  language: de
  text: 'Sag nicht[a]: »Dies ist schlechter als jenes«, denn alles wird sich zu seiner Zeit als gut erweisen.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hebräische Wortlaut ist hier schwierig; das griechische Parallelzeugnis verdeutlicht den Sinn als: »Dies ist schlechter als jenes.«'
    reason: textual_variant
  - marker: b
    text: 'Auch möglich: »denn alles wird zu seiner Zeit gedeihen« oder »zu seiner Zeit Anerkennung finden«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אל לאמר
  choice: Sag nicht
  rationale: אל ist hier die prohibitive Partikel; zusammen mit dem Infinitiv לאמר ergibt sich im natürlichen Deutschen die Aufforderung »Sag nicht«.
- source_word: זה רע מה זה
  choice: Dies ist schlechter als jenes
  rationale: 'Der überlieferte hebräische Wortlaut ist schwierig, doch das griechische Parallelzeugnis Τοῦτο τούτου πονηρότερον bestätigt einen Vergleich: »Dies ist schlechter als jenes«.'
- source_word: כי
  choice: denn
  rationale: כי leitet die Begründung für das Verbot ein; »denn« gibt diesen Zusammenhang knapp und würdig wieder.
- source_word: הכל
  choice: alles
  rationale: Die umfassende Aussage des hebräischen Ausdrucks wird im Deutschen idiomatisch mit »alles« wiedergegeben.
- source_word: בעתו
  choice: zu seiner Zeit
  rationale: Die Form bezeichnet die jeweils eigene oder angemessene Zeit einer Sache, ohne ausdrücklich eine göttliche Festsetzung hinzuzufügen.
- source_word: יגביר
  choice: wird sich als gut erweisen
  rationale: Das hebräische Verb ist an dieser Stelle schwierig. Das griechische εὐδοκιμηθήσεται weist auf Bewährung, Anerkennung oder gutes Gedeihen; im argumentativen Zusammenhang ist »sich als gut erweisen« die verständlichste Wiedergabe.
theological_decisions:
- issue: Verhältnis des schwierigen hebräischen Wortlauts zum griechischen Parallelzeugnis
  choice: Die Aussage wird als Verbot wiedergegeben, eine Sache gegenüber einer anderen als schlechter einzustufen; anschließend wird ihr guter Ausgang zur rechten Zeit ausgesagt.
  alternative: '»Sag nicht: Dies ist schlecht – was ist dies? Denn alles wird zu seiner Zeit die Oberhand gewinnen.«'
  rationale: Der erhaltene hebräische Wortlaut bleibt die Grundlage, ist aber syntaktisch und lexikalisch schwierig. Das griechische Parallelzeugnis klärt sowohl den vergleichenden Sinn des ersten Satzes als auch die positive Bedeutung des Schlussverbs, ohne eine konfessionelle Deutung einzutragen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die direkte Rede bleibt knapp; die Unsicherheit des schwierigen hebräischen Textes wird in den Fußnoten offengelegt.
