  text: The teeth of wild beasts, and scorpions and vipers, and a sword that takes vengeance to destroy the wicked— all these were created for their purpose, and they are kept in store until the time they are appointed.
translation:
  language: de
  text: Die Zähne wilder Tiere, Skorpione und Vipern[a] und ein Schwert, das Rache übt, um die Frevler zu vernichten[b] – sie alle wurden für ihren Zweck geschaffen. Sie werden in einem Vorratshaus aufbewahrt und zur festgesetzten Zeit aufgeboten.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Giftschlangen«, »Nattern« oder »Aspisschlangen«. Das hebräische Wort bezeichnet eine giftige Schlange; die genaue Art ist ungewiss. Auch der griechische Paralleltext verwendet eine allgemeine Bezeichnung für eine Viper oder Schlange.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Verb bedeutet »vernichten«, kann aber auch den stärkeren Sinn »der Vernichtung weihen« oder »ausrotten« haben.
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »Sie befinden sich im Vorratshaus, und zur festgesetzten Zeit werden sie aufgeboten.« Der letzte Satz ist im Hebräischen knapp formuliert. Gemeint ist, dass diese Kräfte bis zu der für ihren Einsatz bestimmten Zeit zurückgehalten werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: חית שן
  choice: die Zähne wilder Tiere
  rationale: Die hebräische Genitivverbindung bezeichnet im Kontext gefährliche Tiere; der Singular »Zahn« ist kollektiv gebraucht. Der griechische Paralleltext stützt den Plural und die Bedeutung »wilde Tiere«.
- source_word: עקרב
  choice: Skorpione
  rationale: Als kollektiver Plural wiedergegeben, passend zur Aufzählung und zum griechischen Paralleltext.
- source_word: פתן
  choice: Vipern
  rationale: Das Wort bezeichnet eine giftige Schlange, deren genaue zoologische Art unsicher ist. »Vipern« ist im modernen Deutsch klar und entspricht dem griechischen Parallelbegriff, ohne eine exakte Art vorzutäuschen.
- source_word: חרב נקמות
  choice: ein Schwert, das Rache übt
  rationale: Die aktive Formulierung gibt den Charakter des hebräischen Ausdrucks natürlich wieder und stimmt mit dem griechischen Partizip »rächend« überein.
- source_word: להחרים
  choice: um ... zu vernichten
  rationale: Dies gibt den klaren Zerstörungssinn idiomatisch wieder. Der mögliche stärkere oder technische Sinn des Bannens beziehungsweise der völligen Vernichtung bleibt in der Fußnote sichtbar.
- source_word: רשעים
  choice: die Frevler
  rationale: »Frevler« bezeichnet moralisch schuldige Menschen in einem würdigen, aber noch verständlichen Register und entspricht dem hebräischen Ausdruck für die Bösen.
- source_word: לצורכם
  choice: für ihren Zweck
  rationale: Die Formulierung bewahrt den funktionalen Sinn von Bedarf, Gebrauch oder Bestimmung, ohne genauer festzulegen, wessen Bedürfnis gemeint ist.
- source_word: נבראו
  choice: wurden ... geschaffen
  rationale: Die passive Vergangenheitsform gibt die ausdrückliche Schöpfungsaussage des Hebräischen direkt wieder.
- source_word: באוצר
  choice: liegen im Vorrat
  rationale: Die Wiedergabe bewahrt das Bild eines aufbewahrten Bestands in natürlichem Deutsch; die konkretere Möglichkeit »im Vorratshaus« erscheint in der Fußnote.
- source_word: ולעת יפקדו
  choice: und zu ihrer Zeit werden sie aufgerufen
  rationale: פקד kann hier das Aufrufen, Aufbieten oder Mustern zum Einsatz bezeichnen. Die knappe Formulierung wahrt die zeitliche Reservierung, ohne die Mehrdeutigkeit unnötig festzulegen.
theological_decisions:
- issue: Schädliche Geschöpfe und zerstörerische Kräfte als Teile der geschaffenen Ordnung unter göttlicher Verfügung
  choice: Die ausdrückliche Aussage, dass sie geschaffen wurden, für einen Zweck bestimmt sind und bis zu ihrer Zeit bereitliegen, bleibt ungemildert stehen.
  alternative: Die Aussage lediglich als Naturbeobachtung wiederzugeben oder »wurden geschaffen« zu einer unpersönlichen Entstehungsaussage abzuschwächen.
  rationale: Der hebräische Text schreibt diesen gefährlichen und zerstörerischen Kräften ausdrücklich Geschaffensein, Zweck und einen Zeitpunkt des Einsatzes zu. Die daraus entstehende theologische Spannung darf die Übersetzung nicht auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit verständlicher Satzführung. Die Aufzählung und das Vorratsbild des Hebräischen bleiben erhalten; seltenere zoologische und semantische Alternativen werden in Fußnoten erläutert.
