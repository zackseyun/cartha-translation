revisions:
- from: 'Die Zähne wilder Tiere, Skorpione und Vipern[a] und ein Schwert, das Rache übt, um die Frevler zu vernichten[b] – sie alle wurden für ihren Zweck geschaffen. Sie liegen im Vorrat, und zu ihrer Zeit werden sie aufgerufen.[c]


    [a] Oder: »Giftschlangen«, »Nattern« oder »Aspisschlangen«. Das hebräische Wort bezeichnet eine giftige Schlange; die genaue Art ist ungewiss. Auch der griechische Paralleltext verwendet eine allgemeine Bezeichnung für eine Viper oder Schlange.


    [b] Das hebräische Verb bedeutet »vernichten«, kann aber auch den stärkeren Sinn »der Vernichtung weihen« oder »ausrotten« haben.


    [c] Oder: »Sie befinden sich im Vorratshaus, und zur festgesetzten Zeit werden sie aufgeboten.« Der letzte Satz ist im Hebräischen knapp formuliert. Gemeint ist, dass diese Kräfte bis zu der für ihren Einsatz bestimmten Zeit zurückgehalten werden.'
  to: Die Zähne wilder Tiere, Skorpione und Vipern[a] und ein Schwert, das Rache übt, um die Frevler zu vernichten[b] – sie alle wurden für ihren Zweck geschaffen. Sie werden in einem Vorratshaus aufbewahrt und zur festgesetzten Zeit aufgeboten.[c]
  rationale: Die einzige notwendige Änderung ersetzt die unnatürliche und semantisch weniger präzise Wendung »im Vorrat liegen« durch eine Formulierung mit »Vorratshaus« und »aufbewahrt«. Damit bleibt die Aussage erhalten, dass diese zerstörerischen Kräfte bis zu ihrem Einsatz reserviert sind, ohne die im hebräischen פקד liegende Nuance des Aufbietens aufzugeben.
