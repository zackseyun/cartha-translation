  text: The ways of the blameless are made straight[b][a]; but for strangers they become ruinous.
translation:
  language: de
  text: Die Wege der Untadeligen verlaufen gerade; doch für Fremde[a] werden sie zum Verhängnis.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Griechisch: »für die Gesetzlosen«. Die griechische Fassung deutet die hebräischen »Fremden« offenbar als Menschen, die Gottes Weg fremd sind.'
    reason: alternative_reading
  - marker: b
    text: Das letzte hebräische Verb ist schwer zu deuten. Die Wiedergabe »zum Verhängnis werden« berücksichtigt den griechischen Paralleltext, der »Stolpersteine« liest.
    reason: textual_variant
lexical_decisions:
- source_word: ארחות
  choice: Wege
  rationale: Der Plural von אֹרַח bezeichnet konkrete oder übertragene Wege und bewahrt hier das Bild für Lebensführung und Lebenslauf.
- source_word: תמים
  choice: der Untadeligen
  rationale: תמים kann »untadelig«, »lauter« oder »unversehrt« bedeuten. Der substantivierte Plural ist im Deutschen natürlich und gibt den moralischen Sinn wieder, ohne die griechische Deutung als »fromm/heilig« zu übernehmen.
- source_word: יישרו
  choice: verlaufen gerade
  rationale: Die Form gehört zu ישר, »gerade/richtig sein oder werden«. »Verlaufen gerade« bewahrt das Wegbild und klingt im modernen Deutschen natürlicher als »werden gerade gemacht«.
- source_word: כן
  choice: doch
  rationale: כן bedeutet gewöhnlich »so/ebenso«. Im antithetischen Parallelismus stellt es hier die entsprechende Gegenwirkung heraus; »doch« macht diesen Gegensatz im Deutschen verständlich.
- source_word: לזרים
  choice: für Fremde
  rationale: זר bedeutet wörtlich »Fremder« oder »Außenstehender«. Die hebräische Lesart bleibt im Haupttext erhalten, statt sie nach dem Griechischen unmittelbar moralisch als »Gesetzlose« auszulegen.
- source_word: יסתוללו
  choice: werden sie zum Verhängnis
  rationale: Das seltene beziehungsweise schwierige Verb ist in seiner genauen Bedeutung unsicher. Der griechische Paralleltext versteht das Ergebnis als »Stolpersteine«. »Zum Verhängnis werden« gibt die negative Folge wieder, ohne eine sichere hebräische Etymologie vorzutäuschen.
theological_decisions:
- issue: Hebräisch »Fremde« gegenüber griechisch »Gesetzlose«
  choice: Die hebräische Lesart »Fremde« steht im Haupttext.
  alternative: »für die Gesetzlosen«
  rationale: Da ein zuverlässiger hebräischer Text vorliegt, hat er Vorrang. Die griechische Fassung deutet die Fremden offenbar als Menschen, die Gottes Ordnung fernstehen; diese Deutung wird in der Fußnote offengelegt, aber nicht in den Haupttext eingetragen.
- issue: Negative Wirkung der Wege im zweiten Halbvers
  choice: »werden sie zum Verhängnis«
  alternative: »werden sie zu Stolpersteinen«
  rationale: Die genaue Bedeutung des hebräischen Verbs bleibt unsicher. Die Formulierung wahrt diese Unsicherheit, während sie die durch den griechischen Paralleltext bezeugte Vorstellung von Hindernis und Fall berücksichtigt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das Wegbild bleibt erhalten; die knappe, sprichwortartige Gegenüberstellung wird mit einem Semikolon und »doch« kenntlich gemacht. Die Unsicherheit des Schlussverbs sowie die abweichende griechische Deutung werden nicht im Haupttext aufgelöst, sondern transparent in Fußnoten ausgewiesen.
