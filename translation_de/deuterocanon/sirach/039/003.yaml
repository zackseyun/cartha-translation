  text: He will seek out the hidden things of proverbs[b][a], and will occupy himself with the riddles of parables.
translation:
  language: de
  text: Er wird das Verborgene der Sprichwörter ergründen[a] und sich mit den Rätseln der Gleichnisse befassen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wird die verborgenen Dinge der Sprichwörter erforschen“. Das griechische ἀπόκρυφα kann allgemein Verborgenes oder Dunkles bezeichnen und meint nicht ausdrücklich nur den verborgenen Sinn.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „wird sich unter den Rätseln der Gleichnisse bewegen“. Das griechische Verb kann das Sichbewegen, Verweilen oder Tätigsein innerhalb eines Bereichs ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπόκρυφα
  choice: das Verborgene
  rationale: Das substantivierte Adjektiv bezeichnet Verborgenes oder schwer Zugängliches. „Das Verborgene“ bewahrt die Offenheit des Griechischen, ohne es ausdrücklich auf einen verborgenen Sinn einzuengen.
- source_word: παροιμιῶν
  choice: der Sprichwörter
  rationale: παροιμία bezeichnet sprichwörtliche Rede oder einen Sinnspruch; „Sprichwörter“ ist hier die direkte und allgemein verständliche Entsprechung.
- source_word: ἐκζητήσει
  choice: wird … ergründen
  rationale: Das Kompositum bezeichnet ein gründliches, zielgerichtetes Suchen. „Ergründen“ gibt diesen intensiven Erkenntniswillen im Deutschen natürlich wieder.
- source_word: ἐν αἰνίγμασι
  choice: mit den Rätseln
  rationale: In Verbindung mit ἀναστραφήσεται bezeichnet ἐν den Bereich, in dem sich jemand bewegt beziehungsweise womit er sich beschäftigt.
- source_word: παραβολῶν
  choice: der Gleichnisse
  rationale: παραβολή kann Vergleich, bildhafte Rede oder Gleichnis bedeuten. „Gleichnisse“ wahrt den literarischen Charakter und ist im Deutschen geläufig.
- source_word: ἀναστραφήσεται
  choice: wird sich … befassen
  rationale: Das Verb beschreibt hier ein anhaltendes Sichbewegen oder Verweilen in einem Gegenstandsbereich. „Sich befassen“ ist natürlich und gibt die fortgesetzte Beschäftigung wieder.
