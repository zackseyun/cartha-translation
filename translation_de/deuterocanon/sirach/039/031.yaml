  text: At his command they rejoice[b][a], and in their appointed order they do not rebel against his word.
translation:
  language: de
  text: Auf seinen Befehl hin jubeln sie,[b] und in ihrer festgesetzten Ordnung widersetzen sie sich nicht seinem Wort.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch wörtlich: »seinem Mund«.'
    reason: lexical_alternative
  - marker: b
    text: 'Die griechische Parallelfassung erweitert den Vers: »Auf der Erde werden sie für die jeweiligen Bedürfnisse bereitgemacht, und zu ihren Zeiten werden sie kein Wort übertreten.« Das unterstreicht, dass die geschaffenen Dinge in der ihnen zugewiesenen Ordnung wirken.'
    reason: alternative_reading
lexical_decisions:
- source_word: בצותו
  choice: Auf seinen Befehl hin
  rationale: 'Die Präposition ב mit dem Infinitiv von צוה bezeichnet hier den zeitlich-umständlichen Zusammenhang: Sobald beziehungsweise indem er befiehlt. Die gewählte Formulierung ist natürlich und knapp; auch das griechische ἐν τῇ ἐντολῇ αὐτοῦ stützt den Bezug auf seinen Befehl.'
- source_word: ישישו
  choice: jubeln sie
  rationale: Das Verb שושׂ/שׂישׂ bezeichnet freudiges Frohlocken oder Jubeln. »Jubeln« gibt die kräftige, personifizierende Aussage des Hebräischen würdig und verständlich wieder.
- source_word: ובחקם
  choice: und in ihrer festgesetzten Ordnung
  rationale: חקם kann ihre Satzung, ihre festgesetzte Grenze oder ihre zugewiesene Ordnung bezeichnen. Im Kontext der geschaffenen Dinge trifft »festgesetzte Ordnung« ihre von Gott bestimmte Funktion, ohne den Ausdruck auf ein Gesetz im engeren Sinn zu verengen.
- source_word: לא ימרו פיו
  choice: widersetzen sie sich nicht seinem Wort
  rationale: מרה bezeichnet Widersetzlichkeit oder Ungehorsam. Das wörtliche »seinem Mund« ist im Hebräischen eine Redeweise für das, was Gott ausspricht; »seinem Wort« vermittelt diesen Sinn im Deutschen natürlich. Die griechische Parallele οὐ παραβήσονται λόγον bestätigt den Bezug auf das gesprochene Wort.
theological_decisions:
- issue: Anthropomorphe Rede von Gottes Mund
  choice: seinem Wort
  alternative: seinem Mund
  rationale: Die idiomatische Wiedergabe bezeichnet Gottes Ausspruch, ohne über den Quelltext hinauszugehen. Die wörtliche anthropomorphe Form bleibt in einer Fußnote sichtbar.
- issue: Zuordnung der Ordnung zu den geschaffenen Dingen
  choice: in ihrer festgesetzten Ordnung
  alternative: nach ihrer Satzung
  rationale: Die Formulierung wahrt die mögliche Bedeutung von חק als festgesetzter Ordnung oder Bestimmung und vermeidet eine unnötig enge juristische Deutung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Personifizierung der geschaffenen Dinge wird mit »jubeln« und »sich widersetzen« bewahrt; die hebräische Bildrede »seinem Mund« wird idiomatisch im Text und wörtlich in der Fußnote wiedergegeben.
