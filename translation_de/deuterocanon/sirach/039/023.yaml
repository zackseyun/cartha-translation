translation:
  language: de
  text: So wird auch sein Zorn Völker vertreiben[a], und er wird ihren Trank in Salzlake verwandeln.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Überlieferung lautet: »Sein Zorn wird Völker erben.« Der hebräische Ausdruck kann im Gerichtszusammenhang »Völker vertreiben« bedeuten.'
    reason: alternative_reading
  - marker: b
    text: 'Griechisch: »Wasser«; das Hebräische hat den allgemeineren Ausdruck »Trank« beziehungsweise »das, was getrunken wird«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כן
  choice: So wird auch
  rationale: Gibt den anknüpfenden und vergleichenden Sinn des hebräischen Ausdrucks in natürlichem Deutsch wieder.
- source_word: זעמו
  choice: sein Zorn
  rationale: Bewahrt die Schwere des göttlichen Gerichts und entspricht dem griechischen ὀργή.
- source_word: גוים
  choice: Völker
  rationale: Ist die übliche, kontextgerechte Wiedergabe, ohne den später geprägten Gegensatz von Juden und Heiden einzutragen.
- source_word: יוריש
  choice: vertreiben
  rationale: Das Hifil von ירש kann bedeuten, jemanden seines Besitzes oder Landes zu berauben beziehungsweise ihn daraus zu vertreiben. Im Gerichtskontext ist „vertreiben“ klar und idiomatisch, ohne die stärkere Bedeutung „vernichten“ einzutragen.
- source_word: ויהפך
  choice: verwandeln
  rationale: Die mit ו verbundene Verbform wird als Fortsetzung der Zukunftsaussage wiedergegeben; das gemeinsame Subjekt „sein Zorn“ bleibt wie im Hebräischen erhalten.
- source_word: למלח
  choice: in Salzlake
  rationale: Gemeint ist im Zusammenhang eine salzige, untrinkbare Flüssigkeit; „Salzlake“ gibt dies konkreter wieder als das abstrakte „Salz“.
- source_word: משקה
  choice: ihren Trank
  rationale: משקה bezeichnet allgemein etwas, das getrunken wird. „Trank“ wahrt diese Breite und passt in den würdevollen poetischen Zusammenhang; das Possessivpronomen wird aus dem Bezug auf die Völker ergänzt.
theological_decisions:
- issue: Bedeutung von יוריש im Verhältnis zur abweichenden griechischen Überlieferung
  choice: sein Zorn wird Völker vertreiben
  alternative: sein Zorn wird Völker erben
  rationale: Der erhaltene hebräische Text hat Vorrang und ergibt im Gerichtszusammenhang mit der Bedeutung „vertreiben/enterben“ einen stimmigen Sinn. Die auffällige griechische Alternative wird in einer Fußnote bewahrt.
- issue: Generische Bedeutung von משקה oder die spezifischere griechische Lesart „Wasser“
  choice: ihren Trank
  alternative: ihre Wasser
  rationale: Der Haupttext folgt dem breiteren hebräischen Ausdruck; die griechische Spezifizierung wird transparent in der Fußnote genannt.
- issue: Subjekt des zweiten Verbs
  choice: „sein Zorn“ bleibt gemeinsames Subjekt beider Verben
  alternative: „er“ als neu eingesetztes Subjekt
  rationale: Im Hebräischen steht vor ויהפך kein ausdrücklich neues Subjekt. Die deutsche Satzfügung bewahrt diese grammatische Offenheit, statt stillschweigend zu Gott als ausgesprochenem Subjekt zu wechseln.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper poetischer Satzführung. „Trank“ ist leicht gehoben, aber allgemein verständlich und bewahrt die Breite des hebräischen משקה besser als das engere „Trinkwasser“.
