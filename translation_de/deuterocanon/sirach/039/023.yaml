  naturalness: „So wird auch sein Zorn Völker vertreiben, und er wird ihren Trank in Salzlake verwandeln“ ist modernes, würdiges und klar verständliches Deutsch. Das ausdrückliche „er“ verhindert die sachlich unzutreffende Aussage, der Zorn selbst verwandle den Trank.
