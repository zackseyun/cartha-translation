translation:
  language: de
  text: Er selbst wird seinen Rat und seine Erkenntnis ordnen und über seine verborgenen Dinge[a] nachdenken.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „seine geheimen Dinge“ oder „seine verborgenen Angelegenheiten“. Der knappe griechische Ausdruck kann sowohl verborgene Lehren als auch Dinge bezeichnen, die Gegenstand seines inneren Nachdenkens sind.'
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτὸς
  choice: er selbst
  rationale: Das ausdrücklich gesetzte Pronomen ist betont; „er selbst“ bewahrt diesen Nachdruck.
- source_word: κατευθυνεῖ
  choice: wird … recht ausrichten
  rationale: Das Verb bezeichnet ein Gerademachen oder rechtes Ausrichten. Die Wiedergabe erhält diesen aktiven Sinn, ohne den gemeinten Vorgang näher festzulegen.
- source_word: βουλήν
  choice: Rat
  rationale: βουλή kann Rat, Überlegung, Plan oder Entschluss bedeuten. „Rat“ passt zum Weisheitskontext und lässt sowohl innere Beratung als auch praktische Orientierung offen.
- source_word: ἐπιστήμην
  choice: Erkenntnis
  rationale: ἐπιστήμη bezeichnet Wissen, Verständnis oder kundige Einsicht. „Erkenntnis“ ist im deutschen Weisheitsstil natürlich und bildet neben „Rat“ einen passenden abstrakten Begriff.
- source_word: ἀποκρύφοις
  choice: verborgene Dinge
  rationale: Das substantivierte Adjektiv bezeichnet Verborgenes oder Geheimes. Die wörtliche Formulierung vermeidet eine unnötige Festlegung auf esoterische Geheimlehren.
- source_word: διανοηθήσεται
  choice: wird … nachdenken
  rationale: Die mediale Verbform beschreibt eine innere gedankliche Beschäftigung; „über … nachdenken“ gibt dies in natürlichem Deutsch wieder.
- source_word: αὐτοῦ
  choice: seinen / seine
  rationale: Die wiederholten Genitive beziehen sich grammatisch am ehesten auf dasselbe männliche Subjekt. Die Possessivformen bewahren diesen Zusammenhang, ohne den Referenten über den Vers hinaus zu bestimmen.
theological_decisions:
- issue: Referent der wiederholten Pronomen
  choice: Das männliche Subjekt und die auf es bezogenen Possessivformen bleiben durchgehend erhalten.
  alternative: Die Possessivformen könnten kontextbezogen allgemeiner oder unpersönlicher wiedergegeben werden.
  rationale: Der griechische Vers bietet ein männliches Subjekt im Singular und wiederholt αὐτοῦ, nennt den Referenten innerhalb des Verses aber nicht. Die Übersetzung bewahrt diese grammatische Geschlossenheit und löst die kontextuelle Identität nicht stillschweigend auf.
- issue: Bedeutung der verborgenen Dinge
  choice: Die Formulierung bleibt allgemein und bezeichnet „seine verborgenen Dinge“.
  alternative: Man könnte ausdrücklich von geheimen Lehren, Geheimnissen oder inneren Gedanken sprechen.
  rationale: Der knappe griechische Ausdruck kann auf verborgenes Lehrgut oder auf Gegenstände seines eigenen inneren Nachdenkens weisen. Eine engere Deutung würde die im Ausgangstext bestehende Spannung auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die etwas markante Verbindung „Rat und Erkenntnis recht ausrichten“ folgt bewusst der kompakten griechischen Ausdrucksweise und vermeidet eine erklärende Ausdeutung.
