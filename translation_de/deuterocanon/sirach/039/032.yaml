lexical_decisions:
- source_word: על כן
  choice: Darum
  rationale: Gibt die folgernde Verbindung zum vorausgehenden Gedankengang knapp und natürlich wieder.
- source_word: מראש
  choice: von Anfang an
  rationale: Bewahrt den zeitlichen Sinn des Hebräischen; das griechische ἐξ ἀρχῆς bestätigt ihn.
- source_word: התיצבתי
  choice: habe ich … Stellung bezogen
  rationale: Der Hitpael von יצב bezeichnet ein bewusstes Sich-Hinstellen oder Einnehmen einer Position. Die Formulierung ist im Deutschen idiomatisch und folgt dem primären hebräischen Zeugen.
- source_word: והתבוננתי
  choice: darüber nachgedacht
  rationale: Drückt aufmerksames Erwägen und reflektierendes Verstehen natürlich aus; das ergänzte „darüber“ stellt den deutschen Satzbezug her, ohne den Gegenstand näher festzulegen.
- source_word: ובכתב הנחתי
  choice: und es schriftlich festgehalten
  rationale: Gibt das Niederlegen beziehungsweise Bewahren in Schrift in natürlichem modernem Deutsch wieder.
