  text: Raise your voices and bless together[a], and give thanks to Yahweh for all his works.
translation:
  language: de
  text: Erhebt eure Stimmen und preist gemeinsam[a]; dankt Jahwe für alle seine Werke.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Parallelüberlieferung lautet: »Verströmt wie Weihrauch Wohlgeruch und blüht wie eine Lilie; verbreitet Duft und singt ein Loblied.« Diese ausführlichere Fassung bezeugt eine andere Textform als die erhaltene hebräische Zeile.'
    reason: alternative_reading
lexical_decisions:
- source_word: הרימו קולכם
  choice: Erhebt eure Stimmen
  rationale: Der pluralische Imperativ mit dem kollektiv-singularischen »eure Stimme« wird im natürlichen Deutschen als »eure Stimmen« wiedergegeben; das konkrete Bild des Erhebens bleibt erhalten.
- source_word: וברכו
  choice: und preist
  rationale: ברך bedeutet im Piel grundsätzlich »segnen«; wenn Menschen Gott gegenüber handeln, gibt »preisen« den gemeinten liturgischen Sinn im heutigen Deutsch natürlicher wieder als »segnen«.
- source_word: יחדו
  choice: gemeinsam
  rationale: Gibt den gemeinschaftlichen Sinn von יחדו direkt und idiomatisch wieder.
- source_word: והודו
  choice: dankt
  rationale: ידה im Hifil bezeichnet im gottesdienstlichen Zusammenhang das Danken; die knappe Imperativform entspricht dem Hebräischen.
- source_word: ליהוה
  choice: Jahwe
  rationale: Der ausdrücklich gesetzte Gottesname יהוה wird als »Jahwe« wiedergegeben.
- source_word: על כל מעשיו
  choice: für alle seine Werke
  rationale: »Werke« bewahrt die substantivische Ausdrucksweise von מעשים und passt zum biblischen Lobpreisregister.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich; »Jahwe« bewahrt den Eigennamen, ohne ihn durch einen Titel zu ersetzen.
- issue: Stark abweichende griechische Parallelüberlieferung
  choice: Der Haupttext folgt der erhaltenen hebräischen Zeile; die griechische Fassung steht in der Fußnote.
  alternative: Die ausführlichere griechische Zeile in den Haupttext aufnehmen.
  rationale: Der hoch bewertete hebräische Text ist in sich verständlich und hat für den Haupttext Vorrang. Die wesentlich anderslautende griechische Textform wird zur Wahrung der Überlieferungstransparenz vollständig dokumentiert.
- issue: Wiedergabe von ברך bei an Gott gerichteter Rede
  choice: preist
  alternative: segnet
  rationale: »Segnet Jahwe« wäre formal näher, klingt im modernen Deutsch jedoch leicht so, als verliehen Menschen Gott Segen. »Preist« vermittelt hier die natürliche kultische Bedeutung, ohne eine besondere konfessionelle Deutung einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knappen pluralischen Imperativen. Die hebräische Hauptüberlieferung bleibt maßgeblich; die deutlich abweichende griechische Parallelfassung wird in einer Fußnote kenntlich gemacht.
