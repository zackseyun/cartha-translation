base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/039/005.yaml
  text: He will devote his heart to rising early to the Lord who made him[a], and he will make supplication before the Most High; he will open his mouth in prayer, and he will make supplication for his sins.
translation:
  language: de
  text: Er wird sein Herz darauf richten, frühmorgens[a] zum Herrn aufzustehen, der ihn geschaffen hat, und vor dem Höchsten wird er flehen; er wird seinen Mund im Gebet öffnen und wegen seiner Sünden flehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „früh den Herrn zu suchen“. Das griechische Verb bezeichnet frühes Aufstehen und kann im Zusammenhang ein eifriges, frühes Suchen ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιδώσει τὴν καρδίαν αὐτοῦ
  choice: wird sein Herz darauf richten
  rationale: Die Wendung bewahrt das Herz als Sitz der inneren Ausrichtung und gibt die bewusste Hinwendung zu einem Vorhaben in natürlichem Deutsch wieder.
- source_word: ὀρθρίσαι πρὸς Κύριον
  choice: sich früh zum Herrn aufzumachen
  rationale: Die Formulierung verbindet den im Verb enthaltenen Gedanken des frühen Aufstehens mit der durch πρὸς bezeichneten Ausrichtung auf den Herrn, ohne ein nicht ausdrücklich genanntes Objekt in den Infinitiv einzutragen.
- source_word: τὸν ποιήσαντα αὐτόν
  choice: der ihn geschaffen hat
  rationale: Die partizipiale Bezeichnung des Herrn als desjenigen, der ihn gemacht hat, wird transparent und idiomatisch wiedergegeben.
- source_word: ἔναντι Ὑψίστου
  choice: vor dem Höchsten
  rationale: Dies bewahrt sowohl die Gegenwartsvorstellung von ἔναντι als auch die geläufige Gottesbezeichnung für Ὕψιστος.
- source_word: δεηθήσεται
  choice: wird flehen
  rationale: Das Verb bezeichnet eine eindringliche Bitte. „Flehen“ ist im Deutschen knapp, würdig und lässt sich an beiden Stellen wiederholen.
- source_word: ἀνοίξει στόμα αὐτοῦ ἐν προσευχῇ
  choice: wird seinen Mund im Gebet öffnen
  rationale: Die bildhafte Ausdrucksweise und die Präpositionalfügung des Griechischen bleiben erhalten.
- source_word: περὶ τῶν ἁμαρτιῶν αὐτοῦ
  choice: wegen seiner Sünden
  rationale: Die Wendung benennt die Sünden als Gegenstand beziehungsweise Anlass seines Flehens, ohne ausdrücklich Vergebung, Sühne oder eine bestimmte Bekenntnisformel einzufügen.
theological_decisions:
- issue: Wiedergabe von Κύριος im griechischen Weisheitskontext
  choice: Herr
  alternative: Gebieter
  rationale: „Herr“ ist die natürliche reverenzielle Gottesbezeichnung und entspricht der theologischen Kraft des Kontextes.
- issue: Inhalt des Flehens hinsichtlich der eigenen Sünden
  choice: wegen seiner Sünden flehen
  alternative: hinsichtlich seiner Sünden flehen
  rationale: Der griechische Text bestimmt nicht näher, ob es sich um Bekenntnis, Vergebungsbitte oder eine andere Bitte handelt. Die gewählte Fassung wahrt diese Offenheit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung von „flehen“ bildet die Wiederholung von δεηθήσεται ab; die anschauliche Wendung vom Öffnen des Mundes bleibt erhalten.
