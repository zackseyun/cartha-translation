  source_fidelity: 'Die Satzglieder, die zwei Vorkommen von δεηθήσεται und die Gottesbezeichnungen sind im Wesentlichen zutreffend wiedergegeben. „Sich früh zum Herrn aufzumachen“ ist jedoch im Deutschen semantisch und idiomatisch unsicher: Es legt einen Ortswechsel nahe, den der griechische Text nicht ausdrückt. Die Konstruktion „früh zum Herrn aufzustehen“ bildet die Verbindung von ὀρθρίσαι mit πρὸς Κύριον enger ab.'
  naturalness: Die vorgeschlagene Fassung ist in modernem, würdigem Standarddeutsch klarer. „Frühmorgens zum Herrn aufzustehen“ ist als religiös-poetische Formulierung verständlich und vermeidet die unpassende Wegmach-Metapher. Die Wiederholung von „flehen“ bewahrt den Parallelismus.
  terminology: „Herr“, „der Höchste“, „Herz“, „Gebet“ und „Sünden“ sind angemessen. „Wegen seiner Sünden“ kann als Angabe des Anlasses bzw. Gegenstands des Flehens stehen und legt weder Vergebung noch eine bestimmte Lehre fest.
