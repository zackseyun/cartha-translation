  text: The desire of his will succeeds[a], and there is no hindrance to his salvation.
translation:
  language: de
  text: Was er will, gelingt[a], und seiner Rettung steht nichts im Weg.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Woran er Gefallen hat, gedeiht.« Die griechische Parallelüberlieferung lautet: »In seinem Gebot liegt alles Wohlgefallen, und niemand kann seine Rettung vermindern.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: תאות רצונו
  choice: Was er will
  rationale: Die Verbindung kann wörtlich als »das Begehren seines Willens« verstanden werden, bezeichnet idiomatisch aber das, was seinem Willen entspricht oder ihm gefällt. Die verbale Wiedergabe ist im Deutschen natürlich und bewahrt den Gedanken göttlichen Wollens.
- source_word: יצליח
  choice: gelingt
  rationale: Das Verb bezeichnet Erfolg oder Gelingen. »Gelingt« gibt den Sinn knapp wieder, ohne den im Deutschen leicht wirtschaftlich klingenden Ausdruck »gedeiht« in den Haupttext zu setzen.
- source_word: מעצור
  choice: steht nichts im Weg
  rationale: Das Substantiv bezeichnet ein Hemmnis oder etwas, das zurückhält. Die idiomatische Formulierung entspricht der hebräischen Aussage, dass es kein Hindernis gibt.
- source_word: תשועתו
  choice: seiner Rettung
  rationale: תשועה bezeichnet Rettung, Befreiung oder rettendes Eingreifen. »Rettung« wahrt hier die breite Bedeutung und vermeidet eine unnötige Verengung auf einen späteren dogmatischen Fachbegriff.
theological_decisions:
- issue: Bedeutungsumfang von תשועתו
  choice: seiner Rettung
  alternative: seinem Heil; seiner Befreiung
  rationale: Hebräisch תשועה und griechisch σωτήριον bezeichnen Gottes rettendes Handeln beziehungsweise dessen Ergebnis. »Rettung« hält diese Aussage offen und trägt ihr theologisches Gewicht, ohne sie auf eine bestimmte Heilslehre festzulegen.
- issue: Verhältnis von Gottes Willen und seinem sicheren Vollzug
  choice: Was er will, gelingt
  alternative: Woran er Gefallen hat, gedeiht; Das Verlangen seines Willens hat Erfolg
  rationale: Die Übersetzung spricht die Wirksamkeit des göttlichen Wollens aus, ohne über den Vers hinaus zu erklären, auf welche Weise dieses Wollen verwirklicht wird.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die idiomatische Satzform vermeidet die schwer verständliche wörtliche Wendung »das Verlangen seines Willens«, während die Fußnote die Bedeutungsalternative und die abweichende griechische Parallelüberlieferung dokumentiert.
