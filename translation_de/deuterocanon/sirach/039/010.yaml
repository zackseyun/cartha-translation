  text: Nations will recount his wisdom[a], and the assembly will proclaim his praise.
translation:
  language: de
  text: Die Völker werden von seiner Weisheit erzählen, und die Versammlung[a] wird sein Lob verkünden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Gemeinde“. Das griechische Wort bezeichnet die versammelte Gemeinschaft.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διηγήσονται
  choice: werden … erzählen
  rationale: Das Futur von διηγέομαι bezeichnet ein ausführlicheres Erzählen oder Berichten. „Von … erzählen“ klingt im modernen Deutsch natürlich und bewahrt den öffentlichen Zeugnischarakter.
- source_word: ἔθνη
  choice: die Völker
  rationale: ἔθνη bezeichnet hier allgemein Völker beziehungsweise Nationen. „Die Völker“ ist im Deutschen idiomatischer und vermeidet einen nicht ausdrücklich gesetzten Gegensatz zwischen Juden und Nichtjuden.
- source_word: σοφίαν
  choice: Weisheit
  rationale: „Weisheit“ gibt den in Sirach maßgeblichen moralischen und verstandesbezogenen Sinn von σοφία angemessen wieder.
- source_word: ἐξαγγελεῖ
  choice: wird … verkünden
  rationale: ἐξαγγέλλω bezeichnet ein öffentliches Bekanntmachen. „Verkünden“ wahrt den gehobenen Ton und entspricht dem öffentlichen Reden im ersten Satzglied.
- source_word: ἐκκλησία
  choice: Versammlung
  rationale: Im vorchristlich-jüdischen Kontext bezeichnet ἐκκλησία die versammelte Gemeinschaft. „Versammlung“ ist sachgerecht und vermeidet die anachronistische Wiedergabe „Kirche“.
- source_word: ἔπαινον
  choice: Lob
  rationale: ἔπαινος bedeutet Lob oder Anerkennung. „Lob verkünden“ bewahrt den Sinn öffentlicher Ehrung.
- source_word: αὐτοῦ
  choice: seiner / sein
  rationale: Die beiden Vorkommen des maskulinen Singularpronomens beziehen sich im Kontext auf den weisen Mann. Die deutsche Wiedergabe behält Numerus und Genus bei.
theological_decisions:
- issue: Wiedergabe von ἐκκλησία in einem vorchristlich-jüdischen Weisheitstext
  choice: Versammlung
  alternative: Gemeinde; Kirche
  rationale: „Versammlung“ bezeichnet die zusammengekommene Gemeinschaft, ohne den späteren spezifisch christlichen Begriff „Kirche“ in den Text einzutragen. „Gemeinde“ bleibt als mögliche kontextuelle Alternative in der Fußnote erhalten.
- issue: Geschlechtsbezug von αὐτοῦ
  choice: seiner / sein
  alternative: deren / ihr
  rationale: Das griechische maskuline Singularpronomen verweist auf die einzelne weise Person im Zusammenhang; eine Neutralisierung zum Plural würde die Form des Ausgangstextes verändern.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit parallelem Satzbau. „Die Völker“ und „Versammlung“ sind allgemein verständlich; „verkünden“ erhält den feierlichen Charakter, ohne altertümlich zu wirken.
