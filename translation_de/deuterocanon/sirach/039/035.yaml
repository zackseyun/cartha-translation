  text: Now with all your heart sing for joy[a], and bless the name of the Holy One.
translation:
  language: de
  text: Jetzt jubelt von ganzem Herzen und segnet den Namen des Heiligen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Paralleltext lautet: „und segnet den Namen des Herrn“. Der hebräische Text hat „des Heiligen“.'
    reason: alternative_reading
lexical_decisions:
- source_word: עתה
  choice: Jetzt
  rationale: Gibt den zeitlichen beziehungsweise gliedernden Auftakt der abschließenden Aufforderung knapp wieder; das im griechischen Paralleltext zusätzlich stehende καί wird nicht ergänzt.
- source_word: בכל לב
  choice: von ganzem Herzen
  rationale: Natürliche deutsche Wiedergabe der hebräischen Wendung für ungeteilte, aufrichtige Hingabe.
- source_word: הרנינו
  choice: jubelt
  rationale: Der Imperativ von רנן bezeichnet hörbaren, freudigen Jubel. „Jubelt“ bewahrt diese stimmliche und feierliche Kraft, ohne Gesang ausdrücklich vorauszusetzen.
- source_word: וברכו
  choice: und segnet
  rationale: Bewahrt den biblisch-doxologischen Sprachgebrauch von ברך genauer als das allgemeinere „preist“.
- source_word: את שם
  choice: den Namen
  rationale: Gibt das direkte Objekt und die ehrfürchtige biblische Rede vom Namen Gottes unmittelbar wieder.
- source_word: הקדוש
  choice: des Heiligen
  rationale: Folgt dem überlieferten hebräischen Gottesprädikat „der Heilige“ und verbindet es im Deutschen idiomatisch mit „Name“.
theological_decisions:
- issue: 'Gottesbezeichnung im Schlusssatz: hebräisch הקדוש gegenüber griechisch Κυρίου'
  choice: des Heiligen
  alternative: des Herrn
  rationale: Der erhaltene hebräische Text ist hier die primäre Grundlage und liest „der Heilige“. Der griechische Paralleltext bietet „der Herr“; diese bedeutsame Abweichung der Gottesbezeichnung wird in einer Fußnote dokumentiert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Plural der beiden hebräischen Imperative wird durch „jubelt“ und „segnet“ sichtbar. „Von ganzem Herzen“ ist idiomatisch und allgemein verständlich; „des Heiligen“ wahrt die Gottesbezeichnung des hebräischen Haupttextes.
