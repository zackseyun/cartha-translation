  text: From eternity to eternity he looks on[a], and nothing is too wondrous or too strong for him.
translation:
  language: de
  text: Von Ewigkeit zu Ewigkeit schaut er hin,[a] und nichts ist zu wunderbar oder zu stark für ihn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Paralleltext lautet: „Von Zeitalter zu Zeitalter blickte er, und nichts ist wunderbar vor ihm.“ Der zusätzliche hebräische Ausdruck „oder zu stark“ fehlt dort.'
    reason: textual_variant
lexical_decisions:
- source_word: מעולם ועד עולם
  choice: Von Ewigkeit zu Ewigkeit
  rationale: Die hebräische Wendung bezeichnet eine umfassende zeitliche Spanne. Diese gehobene, im Deutschen vertraute Formulierung bewahrt sowohl den Gedanken von Zeitalter zu Zeitalter als auch den Ewigkeitsklang.
- source_word: יביט
  choice: schaut er hin
  rationale: Das Verb bezeichnet aufmerksames Schauen oder Hinsehen. Das hebräische Imperfekt wird als allgemeingültige Aussage im Präsens wiedergegeben; „hinschauen“ bewahrt dabei stärker als bloßes „sehen“ den visuellen und aufmerksamen Gehalt.
- source_word: נפלא
  choice: zu wunderbar
  rationale: Das Wort bezeichnet etwas Außergewöhnliches oder die Fähigkeiten Übersteigendes. In Verbindung mit der Verneinung gibt „nichts ist zu wunderbar für ihn“ natürlich wieder, dass nichts sein Erkennen oder Vermögen übersteigt.
- source_word: חזק
  choice: zu stark
  rationale: Der hebräische Text enthält ausdrücklich ein zweites Prädikat aus dem Bedeutungsfeld Stärke/Macht. Die Wiedergabe bewahrt diesen gegenüber dem griechischen Paralleltext zusätzlichen Gedanken.
- source_word: ממנו
  choice: für ihn
  rationale: Im Zusammenhang der verneinten Prädikate ist „für ihn“ im Deutschen idiomatisch und verständlich. Ein wörtlicheres „als er“ wäre besonders beim ersten Prädikat unnatürlich.
theological_decisions:
- issue: Das Subjekt ist im Hebräischen nur in der Verbform enthalten.
  choice: Das Subjekt wird mit „er“ wiedergegeben und bezieht sich aus dem Kontext auf Gott.
  alternative: „Gott“ ausdrücklich einsetzen.
  rationale: Das Pronomen erfüllt die grammatischen Anforderungen des Deutschen, bewahrt aber die knappe Ausdrucksweise des Ausgangstextes und fügt den Gottesnamen nicht ausdrücklich hinzu.
- issue: Verhältnis von Gottes Erkenntnis und Macht in der zweiten Vershälfte
  choice: 'Beide hebräischen Aussagen werden nebeneinandergestellt: Nichts ist ihm zu wunderbar und nichts zu stark.'
  alternative: Nach dem griechischen Paralleltext nur „nichts ist wunderbar vor ihm“ wiedergeben.
  rationale: Der hebräische Hauptzeuge enthält חזק ausdrücklich. Die Übersetzung bewahrt daher sowohl die Spannung zum griechischen Text als auch die zweifache Aussage über Gottes unüberbietbare Erkenntnis beziehungsweise Macht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit leicht gehobenem biblischem Klang. Die Satzstruktur bleibt knapp und nahe am Hebräischen; die Fußnote macht die Abweichung des griechischen Paralleltextes transparent.
