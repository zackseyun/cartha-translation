base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/039/015.yaml
  text: With the service of harp and instruments of music[c][b][a], so you shall speak with a shout of praise.
translation:
  language: de
  text: 'Beim Spiel von Harfe[a] und allerlei Musikinstrumenten sollt ihr so sprechen: mit Jubelruf.[b][c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Leier“. Das hebräische Wort bezeichnet ein altes Saiteninstrument, dessen genaue moderne Entsprechung unsicher ist.
    reason: lexical_alternative
  - marker: b
    text: Oder „mit lautem Ruf“, „mit Zuruf“; das hebräische Wort kann auch einen signalartigen Trompetenstoß bezeichnen.
    reason: lexical_alternative
  - marker: c
    text: Die griechische Fassung dieses Verses ist erheblich ausführlicher. Sie fordert ausdrücklich dazu auf, den Herrn für alle seine Werke zu segnen, seinem Namen Größe zu geben und ihn mit Lob, Liedern und Saitenspiel zu preisen. Der hier übersetzte hebräische Zeuge bewahrt nur den Abschnitt über Musik und Jubelruf.
    reason: textual_variant
lexical_decisions:
- source_word: בשירות
  choice: Beim Spiel
  rationale: Im musikalischen Zusammenhang bezeichnet die Wendung die musikalische Darbietung bzw. Begleitung. „Beim Spiel“ ist im Deutschen natürlich und vermeidet das missverständliche „im Dienst“.
- source_word: נבל
  choice: Harfe
  rationale: נבל bezeichnet ein altes Saiteninstrument. „Harfe“ ist die geläufige deutsche Wiedergabe; die genaue Bauart ist jedoch unsicher.
- source_word: כלי מינים
  choice: allerlei Musikinstrumenten
  rationale: Wörtlich sind „Instrumente/Geräte verschiedener Arten“ gemeint. Der Kontext macht die musikalische Bedeutung eindeutig; „allerlei“ bewahrt den Gedanken verschiedener Arten.
- source_word: וכן
  choice: so
  rationale: 'וכן leitet die Weise des folgenden Sprechens ein: „und so/auf diese Weise“.'
- source_word: תאמרו
  choice: sollt ihr … sprechen
  rationale: Die Verbform bezeichnet das Sagen oder Sprechen. „Sollt ihr sprechen“ wahrt den auffordernden bzw. zukunftsbezogenen Charakter, ohne sie unnötig zu verschärfen.
- source_word: בתרועה
  choice: mit Jubelruf
  rationale: תרועה kann einen lauten Freuden- oder Huldigungsruf, eine Akklamation oder auch einen Signalstoß bezeichnen. „Jubelruf“ passt zum musikalischen Lobkontext, während die mögliche Bedeutungsbreite in der Fußnote erhalten bleibt.
theological_decisions:
- issue: Verhältnis des erhaltenen hebräischen Textes zur erheblich längeren griechischen Fassung
  choice: Der kürzere hebräische Wortlaut wird übersetzt; die griechischen Zusätze werden nicht in den Haupttext aufgenommen.
  alternative: Nach der griechischen Fassung ausdrücklich zum Segen des Herrn, zur Verherrlichung seines Namens und zum Lob aufrufen.
  rationale: Da für diesen Vers ein hebräischer Zeuge vorliegt, hat er als Ausgangstext Vorrang. Die griechische Parallele bestätigt den Kontext musikalischen Lobes, darf aber ihre zusätzlichen Aussagen nicht stillschweigend in den hebräischen Haupttext eintragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung ist gut verständlich, bleibt aber nahe an der knappen hebräischen Satzstruktur. Der Doppelpunkt verdeutlicht, dass וכן die Art des folgenden Sprechens einführt.
