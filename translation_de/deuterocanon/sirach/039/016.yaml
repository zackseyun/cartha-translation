  text: All the works of God are good[a], and for every need he provides in its time.
translation:
  language: de
  text: Alle Werke Gottes sind gut[a], und für jeden Bedarf stellt er zu seiner Zeit genug bereit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Parallele lautet: „Die Werke des Herrn sind alle sehr gut, und jedes Gebot wird zu seiner Zeit erfüllt werden.“ Der hebräische Zeuge spricht dagegen von den „Werken Gottes“ und davon, dass für jeden Bedarf genug bereitgestellt wird. Der Haupttext folgt dem erhaltenen Hebräisch und berücksichtigt zugleich die abweichende griechische Überlieferung.'
    reason: alternative_reading
lexical_decisions:
- source_word: מעשי אל
  choice: Werke Gottes
  rationale: מעשי bezeichnet umfassend das, was Gott tut oder schafft; „Werke“ bewahrt diese Breite. אל ist im hebräischen Zeugen der Gottesbezeichnung „Gott“ entsprechend wiedergegeben, nicht mit „Herr“.
- source_word: כלם טובים
  choice: alle … sind gut
  rationale: כלם betont die Gesamtheit, während טובים eine allgemeine positive Bewertung ausdrückt. Das griechische σφόδρα („sehr“) hat im erhaltenen Hebräisch keine Entsprechung und wird daher nicht in den Haupttext aufgenommen.
- source_word: לכל צורך
  choice: für jeden Bedarf
  rationale: צורך bezeichnet einen Bedarf oder eine Notwendigkeit. „Bedarf“ passt zum folgenden Gedanken ausreichender Versorgung und ist weniger subjektiv als „Bedürfnis“.
- source_word: בעתו
  choice: zu seiner Zeit
  rationale: Die Form bezeichnet die jeweilige Zeit des Bedarfs beziehungsweise der betreffenden Situation. Die knappe Formulierung bewahrt den Bezug, ohne durch „zur rechten Zeit“ eine wertende Präzisierung hinzuzufügen.
- source_word: יספיק
  choice: stellt er … genug bereit
  rationale: Das Hifil von ספק bezeichnet das ausreichende Versorgen oder Bereitstellen. Das singularische Verb nennt sein Subjekt nicht ausdrücklich; aus dem Zusammenhang wird Gott als Handelnder verstanden. „Genug“ gibt den Aspekt des Ausreichens wieder.
theological_decisions:
- issue: Gottesbezeichnung
  choice: Gott
  alternative: der Herr
  rationale: Der hebräische Text hat אל („Gott“), während die griechische Parallele Κυρίου („des Herrn“) liest. Wegen des Vorrangs des vorhandenen hebräischen Zeugen folgt der Haupttext dessen Gottesbezeichnung.
- issue: Unausgesprochenes Subjekt von יספיק
  choice: Gott wird durch „er“ als Handelnder ausgedrückt
  alternative: unpersönlich oder auf den Bedarf bezogen formulieren
  rationale: Das hebräische Verb ist singularisch und lässt das Subjekt formal unausgesprochen. Im Zusammenhang mit den Werken Gottes liegt Gott als derjenige nahe, der ausreichend bereitstellt; die deutsche Fassung macht dies zur Verständlichkeit sichtbar, ohne die Aussage weiter zu bestimmen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, knappem Satzbau. „Für jeden Bedarf“ und „genug bereitstellen“ bilden die Versorgungsaussage natürlich ab; „zu seiner Zeit“ bewahrt die knappe zeitliche Zuordnung des Hebräischen.
