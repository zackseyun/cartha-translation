  text: At his word the waters pile up like a heap[a], and at the utterance of his mouth are storehouses of water.
translation:
  language: de
  text: Auf sein Wort hin schichtet er das Wasser wie einen Haufen auf, und beim Ausspruch seines Mundes sind Wasserspeicher.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hebräische Text lautet hier knapp: „und beim Ausspruch seines Mundes sein Speicher“. Die griechische Überlieferung hat „Wasserspeicher“ und verdeutlicht so den gemeinten Sinn.'
    reason: alternative_reading
lexical_decisions:
- source_word: בדברו
  choice: Auf sein Wort hin
  rationale: 'Die Präposition ב kann instrumental oder zeitlich verstanden werden. „Auf sein Wort hin“ bewahrt beides: Das Wort ist Anlass und wirksamer Befehl.'
- source_word: יעריך
  choice: schichtet er … auf
  rationale: ערך bedeutet grundlegend „anordnen, aufstellen“. Zusammen mit dem Bild des aufgehäuften Wassers gibt „aufschichten“ die konkrete Wirkung natürlich wieder; anders als die griechische Parallelüberlieferung hat der hebräische Text hier ein aktives Verb mit Gott als implizitem Subjekt.
- source_word: כנד מים
  choice: das Wasser wie einen Haufen
  rationale: נד bezeichnet eine aufgehäufte Masse und wird auch für aufgestautes Wasser gebraucht. Das ungewöhnliche, aber anschauliche Bild bleibt erhalten.
- source_word: ובמוצא פיו
  choice: und beim Ausspruch seines Mundes
  rationale: מוצא bezeichnet wörtlich das Hervorgehen und hier das Hervorgebrachte beziehungsweise die Äußerung. Die Formulierung erhält die konkrete Bildsprache und den Parallelismus zu „auf sein Wort hin“.
- source_word: אוצרו
  choice: stehen die Wasserspeicher bereit
  rationale: Der überlieferte hebräische Wortlaut ist elliptisch und bietet wörtlich nur „sein Speicher/Vorratshaus“. Die griechische Parallelüberlieferung hat „Wasserspeicher“ im Plural. „stehen … bereit“ ergänzt im Deutschen den aus dem Parallelismus erschließbaren verbalen Sinn, ohne ein Öffnen oder Erschaffen der Speicher ausdrücklich zu behaupten.
theological_decisions:
- issue: Bezug der Suffixe in „sein Wort“, „sein Mund“ und „sein Speicher“
  choice: Die Pronomen beziehen sich im Zusammenhang auf Gott; der Gottesname wird jedoch nicht in den Vers eingefügt.
  alternative: Eine im Einzelvers nicht ausdrücklich identifizierte Person als Bezug der Pronomen
  rationale: Der Schöpfungshymnus macht Gott zum natürlichen Bezugswort. Die Übersetzung wahrt dennoch die pronominale Ausdrucksweise des hebräischen Textes und vermeidet eine erläuternde Erweiterung.
- issue: Art der Wirksamkeit des göttlichen Wortes
  choice: „Auf … hin“ lässt offen, ob vor allem Zeitpunkt, Befehl oder schöpferisches Mittel gemeint ist.
  alternative: 'Eindeutig instrumental: „Durch sein Wort“'
  rationale: Das hebräische ב trägt beide Nuancen; die Übersetzung soll diese theologische und sprachliche Spannung nicht unnötig festlegen.
translation_notes:
  register: Moderne, würdige Standardsprache mit bewahrter poetischer Bildlichkeit. „Wie einen Haufen“ ist bewusst etwas markant, da das hebräische Bild von aufgeschichtetem Wasser nicht geglättet werden soll. Der Fußnotenmarker [a] steht im Haupttext.
