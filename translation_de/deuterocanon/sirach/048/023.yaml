  text: In his days the sun stood still[b][a], and life was added to the king.
translation:
  language: de
  text: In seinen Tagen stand die Sonne still[b], und dem König wurde Lebenszeit hinzugefügt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das heißt: Die Lebenszeit des Königs wurde verlängert; im Zusammenhang ist Hiskija gemeint.'
    reason: cross_reference
  - marker: b
    text: 'Griechisch: „Er hemmte die Sonne“ oder „die Sonne wurde aufgehalten“; die schwierige Formulierung entspricht dem hebräischen „die Sonne stand still“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עמד
  choice: stand still
  rationale: Das hebräische Verb bedeutet wörtlich „stehen“; mit der Sonne als Subjekt bezeichnet es hier ihr Stillstehen in ihrem Lauf. „stand … still“ ist quellennah und im Deutschen verständlich. Die schwierige griechische Parallele ἀνεπόδισεν stützt den Gedanken einer Hemmung oder Unterbrechung.
- source_word: השמש
  choice: die Sonne
  rationale: Direkte Wiedergabe des bestimmten hebräischen Substantivs.
- source_word: ונוסף
  choice: wurde … hinzugefügt
  rationale: Die passive Form bewahrt das hebräische Bild des Hinzufügens. Im Deutschen macht die Verbindung mit „Lebenszeit“ den gemeinten Sinn natürlich verständlich.
- source_word: חיי
  choice: Lebenszeit
  rationale: Das hebräische Konstrukt bezeichnet hier das Leben beziehungsweise die Lebensdauer des Königs. „Lebenszeit“ ist im Deutschen idiomatischer als „Leben wurde hinzugefügt“ und vermeidet zugleich die stärkere Paraphrase „verlängert“.
- source_word: המלך
  choice: dem König
  rationale: Der bestimmte Titel des Ausgangstextes bleibt erhalten; der im Zusammenhang erkennbare Hiskija wird nicht im Haupttext namentlich ergänzt.
theological_decisions:
- issue: Soll die Anspielung durch den Namen Hiskija im Haupttext ausdrücklich gemacht werden?
  choice: Den Quelltext entsprechend „dem König“ beibehalten.
  alternative: „dem König Hiskija“ oder „Hiskija“
  rationale: Der hebräische Text nennt lediglich „den König“. Der Zusammenhang identifiziert ihn als Hiskija; eine Namensnennung im Vers wäre erklärender Zusatz.
- issue: Soll das hinzugefügte Leben ausdrücklich als Verlängerung seiner Lebensdauer formuliert werden?
  choice: „Lebenszeit wurde hinzugefügt“
  alternative: „das Leben des Königs wurde verlängert“
  rationale: Die gewählte Form wahrt das Bild des hebräischen ונוסף, während die Fußnote den sachlichen Bezug auf die Verlängerung von Hiskijas Leben erläutert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bleibt knapp und parallel zum Hebräischen. „Lebenszeit“ sorgt für natürliche Verständlichkeit, ohne das Quellbild durch eine vollständig ausdeutende Formulierung zu ersetzen.
