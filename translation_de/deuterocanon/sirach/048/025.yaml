translation:
  language: de
  text: Er verkündete, was bis in alle Zukunft geschehen würde[a], und verborgene Dinge, bevor sie eintraten.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: „bis in Ewigkeit“ oder „bis zum Ende der Weltzeit“. Die hebräische Wendung kann einen unabsehbaren zukünftigen Zeitraum bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „verborgene Dinge vor ihrem Kommen“.'
    reason: literal_rendering
lexical_decisions:
- source_word: עד עולם
  choice: bis in alle Zukunft
  rationale: Die Wendung verbindet „bis“ mit „Ewigkeit/Weltzeit“ und bezeichnet hier einen zeitlich unabsehbaren Horizont. „Bis in alle Zukunft“ ist im modernen Deutschen natürlich und bewahrt die Weite der hebräischen Aussage; das griechische ἕως τοῦ αἰῶνος bestätigt diesen zeitlichen Sinn.
- source_word: הגיד
  choice: verkündete
  rationale: Das Verb bedeutet „mitteilen, kundtun“. „Verkündete“ entspricht dem prophetischen Zusammenhang und dem würdevollen Ton, ohne über das hebräische Verb hinaus eine besondere Offenbarungslehre festzulegen.
- source_word: נהיות
  choice: was … geschehen würde
  rationale: Das Wort bezeichnet künftige Geschehnisse. Die verbale Wiedergabe ist im Deutschen natürlicher als „die zukünftigen Dinge“ und wird durch das griechische τὰ ἐσόμενα gestützt.
- source_word: ונסתרות
  choice: und was verborgen war
  rationale: Der hebräische Plural bezeichnet Verborgenes oder geheime Dinge. Die substantivische Relativkonstruktion klingt im Deutschen idiomatisch und wahrt den allgemeinen Sinn; auch das griechische τὰ ἀπόκρυφα bedeutet „das Verborgene“.
- source_word: לפני בואן
  choice: bevor es geschah
  rationale: Wörtlich heißt die Wendung „vor ihrem Kommen“. Da von künftigen Geschehnissen und Verborgenem die Rede ist, gibt „bevor es geschah“ den gemeinten Eintritt natürlich wieder; die wörtlichere Bildsprache wird in der Fußnote kenntlich gemacht.
theological_decisions:
- issue: Zeitliche Reichweite prophetischer Erkenntnis
  choice: was bis in alle Zukunft geschehen würde
  alternative: was bis in Ewigkeit geschehen würde; was bis zum Ende der Weltzeit geschehen würde
  rationale: Die Formulierung bewahrt den umfassenden Zukunftshorizont der Aussage, ohne daraus eine systematische Behauptung vollständiger Allwissenheit abzuleiten. Die mögliche Bedeutung von עולם als „Ewigkeit“ oder „Weltzeit“ bleibt in der Fußnote sichtbar.
- issue: Syntaktischer Bezug von עד עולם
  choice: Bezug auf den zeitlichen Horizont dessen, was geschehen würde
  alternative: Bis in alle Zukunft verkündete er …
  rationale: Der Zusammenhang und die griechische Parallele legen nahe, dass die Wendung die Reichweite der vorausgesagten Ereignisse bezeichnet. Da die hebräische Wortstellung auch einen adverbialen Bezug auf „verkündete“ zulassen kann, wird diese Möglichkeit nicht dogmatisch ausgeschlossen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem prophetischem Ton. Die Satzstruktur ist flüssig, vermeidet jedoch eine konfessionell geprägte Ausdeutung. Beide Fußnotenmarker erscheinen unmittelbar an den betreffenden Textstellen.
