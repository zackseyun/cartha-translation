  text: He struck the camp of Assyria[a], and threw it into confusion with a plague.
translation:
  language: de
  text: Er schlug das assyrische Heerlager[a] und versetzte es durch eine Plage in Verwirrung.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Griechisch: „Er schlug das Heerlager der Assyrer, und sein Engel vernichtete sie.“'
    reason: alternative_reading
lexical_decisions:
- source_word: ויך
  choice: Er schlug
  rationale: Das hebräische נכה bezeichnet hier ein machtvolles Schlagen. „Er schlug“ ist direkt, würdig und vermeidet sowohl archaisches „schlug ... mit“ als auch die stärkere Festlegung „vernichtete“.
- source_word: מחנה אשור
  choice: das Heerlager Assurs
  rationale: Die hebräische Status-constructus-Verbindung bedeutet wörtlich „das Lager Assurs“. „Heerlager“ macht den militärischen Zusammenhang natürlich und eindeutig; „Assurs“ bewahrt die im Hebräischen verwendete Landesbezeichnung.
- source_word: ויהמם
  choice: und versetzte es ... in Verwirrung
  rationale: המם hat kausativen Sinn und kann Bestürzung, Verwirrung oder panische Auflösung bezeichnen. Die Formulierung wahrt diesen Bedeutungsumfang und bezieht das singularische Pronomen auf das Heerlager.
- source_word: במגפה
  choice: durch eine Plage
  rationale: מגפה bezeichnet eine Plage beziehungsweise tödliche Heimsuchung. „Durch“ gibt den instrumentalen Sinn der Präposition ב im Deutschen natürlich wieder, ohne die Art der Plage unnötig festzulegen.
theological_decisions:
- issue: Abweichung zwischen hebräischem und griechischem Text in der zweiten Vershälfte
  choice: 'Dem Hebräischen folgen: „versetzte es durch eine Plage in Verwirrung“'
  alternative: 'Dem Griechischen folgen: „und sein Engel vernichtete sie“'
  rationale: Der erhaltene, als zuverlässig bewertete hebräische Text ist hier die vorrangige Grundlage. Die griechische Überlieferung nennt ausdrücklich Gottes Engel und spricht von Vernichtung; diese theologisch bedeutsame Variante wird nicht in den Haupttext eingetragen, sondern in einer Fußnote vollständig bewahrt.
translation_notes:
  register: Modernes, gehobenes Standarddeutsch mit klarer militärischer Bildsprache. Der Satz bleibt knapp und parallel gebaut. „Plage“ ist gegenüber „Pest“ weniger eng und entspricht dem Bedeutungsumfang von מגפה.
