base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/048/017.yaml
  text: Hezekiah fortified his city[a], and brought water into its midst; he cut through rock like bronze[b], and dammed up a reservoir in the mountains.
translation:
  language: de
  text: Hiskija befestigte seine Stadt und leitete Wasser in ihr Inneres. Er hieb Felsen wie Bronze[a] und sperrte in den Bergen ein Wasserbecken ab.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die hebräische Formulierung „wie Bronze“ ist schwierig. Der griechische Text liest stattdessen „mit Eisen“, was beim Behauen von Fels gut in den Zusammenhang passt.
    reason: textual_variant
  - marker: b
    text: Der hebräische Ausdruck ist stark verkürzt. Er kann auch im Sinn von „er staute in den Bergen ein Wasserbecken auf“ verstanden werden; der griechische Text spricht allgemeiner vom Anlegen von Wasserstellen.
    reason: alternative_reading
lexical_decisions:
- source_word: יחזקיהו חזק עירו
  choice: Hiskija befestigte seine Stadt
  rationale: חזק bezeichnet bei einer Stadt die Verstärkung ihrer Befestigungsanlagen; „Hiskija“ ist die gebräuchliche deutsche Namensform.
- source_word: בהטות אל תוכה מים
  choice: und leitete Wasser in ihr Inneres
  rationale: Die Wendung beschreibt das gezielte Hineinführen beziehungsweise Umleiten von Wasser in die Stadt.
- source_word: ויחצב ... צורים
  choice: Er hieb Felsen
  rationale: חצב bezeichnet das Hauen oder Behauen von Stein; der Plural צורים wird im Deutschen natürlich mit „Felsen“ wiedergegeben.
- source_word: כנחשת
  choice: wie Bronze
  rationale: Dies bildet den überlieferten hebräischen Wortlaut formal ab, ohne die schwierige Formulierung stillschweigend nach dem griechischen Zeugen zu korrigieren.
- source_word: ויחסום הרים מקוה
  choice: und dämmte in den Bergen ein Wasserbecken ab
  rationale: Die knappe hebräische Wortfolge beschreibt eine Absperrung im Zusammenhang mit einem Sammelbecken; „abdämmen“ bewahrt das konkrete Bild eines Wasserbauwerks.
