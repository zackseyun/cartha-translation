translation_notes:
  register: Moderne, würdevolle Standardsprache. Die ungewöhnliche Lesart des hebräischen Hauptzeugen bleibt im Text sichtbar; die leichter verständliche griechische Variante wird nicht stillschweigend übernommen, sondern in der Fußnote genannt.
