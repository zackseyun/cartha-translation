translation:
  language: de
  text: der im Sturm nach oben entrückt wurde, in Feuerscharen zum Himmel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Griechisch: „der in einem Feuersturm entrückt wurde, auf einem Wagen mit feurigen Pferden“. Diese ausführlichere Fassung macht die Anspielung auf Elija in 2. Könige 2,11 deutlicher.'
    reason: alternative_reading
lexical_decisions:
- source_word: הנלקח
  choice: der … entrückt wurde
  rationale: Das passive Partizip von לקח bezeichnet hier im Zusammenhang mit Elija sein Hinwegnehmen beziehungsweise seine Aufnahme. „Entrückt“ gibt die Aufwärtsbewegung prägnant wieder, ohne eine gewöhnliche Wegnahme nahezulegen.
- source_word: בסערה
  choice: im Sturm
  rationale: סערה bedeutet Sturm oder Sturmwind. „Im Sturm“ folgt dem hebräischen Zeugen, ohne ihn an die vertraute Formulierung aus 2. Könige 2,11 anzugleichen.
- source_word: מעלה
  choice: in die Höhe
  rationale: מעלה bezeichnet hier die Richtung nach oben. Die Wiedergabe bewahrt diesen Richtungsbegriff, statt ihn mit dem später folgenden שמים zusammenzuziehen.
- source_word: ובגדודי אש
  choice: und in Feuerscharen
  rationale: גדודים bezeichnet Scharen, Trupps oder Verbände, nicht ausdrücklich Wagen. „Feuerscharen“ erhält das ungewöhnliche Bild des hebräischen Textes und vermeidet eine Harmonisierung mit der griechischen Fassung.
- source_word: שמים
  choice: zum Himmel
  rationale: שמים benennt das Ziel der Bewegung. Im Deutschen ist der Singular „Himmel“ in diesem Zusammenhang natürlicher als „Himmel“ im Plural; die Richtungsangabe „zum“ bildet zugleich die knappe hebräische poetische Konstruktion verständlich ab.
theological_decisions:
- issue: Soll die hebräische Lesart an die ausführlichere Elija-Darstellung der griechischen Fassung und an 2. Könige 2,11 angeglichen werden?
  choice: Die eigentümliche hebräische Bildsprache „in Feuerscharen“ bleibt im Haupttext erhalten.
  alternative: „in einem Feuersturm, auf einem Wagen mit feurigen Pferden“
  rationale: Der vorhandene hebräische Text nennt weder Wagen noch Pferde. Die ausführlichere griechische Lesart erhellt den Bezug auf Elija, darf aber den primären hebräischen Zeugen nicht stillschweigend ersetzen; sie wird deshalb in einer Fußnote dokumentiert.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Der Vers bleibt als Relativsatz an den vorangehenden Zusammenhang angeschlossen. „Feuerscharen“ ist bewusst ungewöhnlich, weil auch das hebräische Bild ungewöhnlich ist.
