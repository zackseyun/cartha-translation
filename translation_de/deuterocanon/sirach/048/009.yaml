    issue: Die Formulierung „in die Höhe … und in Feuerscharen zum Himmel“ ist im Deutschen durch die zwei aufeinanderfolgenden Richtungsangaben etwas schwerfällig.
    rationale: Die hebräische Zeile ist elliptisch und darf nicht geglättet werden; eine geringe Umstellung zu „nach oben“ verbessert jedoch die Lesbarkeit, ohne ihre Mehrdeutigkeit oder Bildsprache aufzulösen.
