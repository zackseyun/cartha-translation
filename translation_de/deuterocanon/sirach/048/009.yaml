- from: der im Sturm in die Höhe entrückt wurde und in Feuerscharen zum Himmel.[a]
  to: der im Sturm nach oben entrückt wurde, in Feuerscharen zum Himmel.[a]
  rationale: 'Die Revision ist rein stilistisch-syntaktisch: „nach oben“ gibt מעלה idiomatischer wieder als „in die Höhe“, ohne das abschließende שמים vorwegzunehmen. Die auffällige Verbindung „in Feuerscharen zum Himmel“ bleibt absichtlich bestehen, da der hebräische Text selbst keine ausdrücklich harmonisierte Aussage über Wagen oder Pferde bietet. Die griechische Vollform bleibt ausschließlich in der Fußnote.'
