translation:
  language: de
  text: Da verzagten sie in ihrem Herzensstolz[a], und sie wanden sich wie eine Frau in den Wehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Griechisch: »Da wurden ihr Herz und ihre Hände erschüttert, und sie wanden sich wie Gebärende.« Im Haupttext wird dem hebräischen Textzeugen gefolgt; der griechische Text dient als Parallele.'
    reason: alternative_reading
lexical_decisions:
- source_word: נמוגו
  choice: schwand ... der Mut
  rationale: Das hebräische Verb bezeichnet ein Schmelzen oder Schwinden und wird bildhaft für den Verlust von Festigkeit und Mut gebraucht. Die deutsche Wendung gibt diesen Zusammenbruch natürlich wieder.
- source_word: בגאון לבם
  choice: in ihrem stolzen Herzen
  rationale: Die gedrängte hebräische Formulierung lässt גאון als Stolz, Erhebung oder innere Aufgeblähtheit verstehen. Die Übersetzung bewahrt sowohl das Herzmotiv als auch die mögliche Bedeutung stolzer Selbstsicherheit, ohne die Spannung aufzulösen.
- source_word: ויחילו
  choice: sie wanden sich
  rationale: Das Verb kann Zittern, Sichwinden oder Geburtswehen bezeichnen. »Sie wanden sich« erhält das körperliche Bild und vermeidet eine unnötige Wiederholung der unmittelbar folgenden Wehenmetapher.
- source_word: כיולדה
  choice: wie eine Frau in den Wehen
  rationale: Das singularische Partizip bezeichnet eine Gebärende. Die gewählte Formulierung ist im modernen Deutsch idiomatisch und macht den Vergleich deutlich.
