  source_fidelity: 'Der Haupttext gibt die hebräische Abfolge und Bildsprache zuverlässig wieder: Zusammenbruch/Verzagen im Zusammenhang mit dem Hochmut des Herzens sowie das Sichwinden wie bei einer Gebärenden. Die bisherige Umschreibung mit »der Mut schwand« ist zwar sinnentsprechend, fügt aber »Mut« als nicht ausdrücklich genanntes Bezugswort ein und macht den Satz syntaktisch schwerfällig.'
  naturalness: »Da verzagten sie in ihrem Herzensstolz« ist im modernen Standarddeutsch klarer und flüssiger als »Da schwand ihnen in ihrem stolzen Herzen der Mut«. »Sie wanden sich wie eine Frau in den Wehen« ist idiomatisch und wahrt die körperliche Metapher.
