  terminology: „Sanherib“, „Rabschake“, „Zion“ und „Hochmut“ sind passend. „Gott lästerte“ gibt גדף אל wieder, ohne die Aussage über den klaren Textbefund hinaus auszubauen. Die Fußnote kennzeichnet die griechische Abweichung korrekt.
