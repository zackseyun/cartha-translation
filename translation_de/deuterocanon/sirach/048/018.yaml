  text: In his days Sennacherib came up and sent Rabshakeh[a]; he stretched out his hand against Zion and blasphemed in his pride.
translation:
  language: de
  text: In seinen Tagen zog Sanherib herauf und sandte den Rabschake. Er streckte seine Hand gegen Zion aus und lästerte Gott in seinem Hochmut.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Parallelüberlieferung lautet: „und er rühmte sich in seiner Überheblichkeit“. Der Haupttext folgt dem hebräischen Textzeugen, der davon spricht, dass er Gott lästerte.'
    reason: alternative_reading
lexical_decisions:
- source_word: עלה
  choice: zog … herauf
  rationale: Das hebräische Verb bezeichnet ein Hinaufziehen und kann zugleich einen militärischen Vormarsch ausdrücken; die Formulierung bleibt anschaulich und im Deutschen natürlich.
- source_word: וישלח
  choice: sandte
  rationale: Direkte, erzählerisch passende Wiedergabe von שלח.
- source_word: רבשקה
  choice: Rabschake
  rationale: Der assyrische Titel wird in seiner im Deutschen bibelsprachlich etablierten Form transliteriert; der hebräische Zeuge hat hier keinen Artikel.
- source_word: ויט ידו
  choice: Er streckte seine Hand … aus
  rationale: Die hebräische Wendung bezeichnet hier eine feindselige Gebärde oder Machtausübung. Die wörtlich nahe Wiedergabe erhält das Bild, ohne die konkrete Handlung zu präzisieren.
- source_word: על ציון
  choice: gegen Zion
  rationale: Im Zusammenhang einer feindseligen Handlung gibt gegen die adversative Bedeutung von על natürlich wieder.
- source_word: ויגדף
  choice: lästerte
  rationale: גדף bezeichnet verächtliche, frevelhafte Rede. „Lästerte“ bewahrt im Deutschen das religiöse Gewicht, ohne ein im Hebräischen nicht eindeutig ausgesprochenes Objekt einzufügen.
- source_word: אל
  choice: kein ausdrückliches Objekt
  rationale: אל könnte auf Gott als Ziel der Lästerung weisen, ist in der überlieferten Form jedoch syntaktisch mehrdeutig. Deshalb wird „Gott“ nicht ergänzend in den Haupttext aufgenommen.
- source_word: בגאונו
  choice: in seinem Hochmut
  rationale: גאון bezeichnet hier stolze Selbstüberhebung. „Hochmut“ ist würdig, verständlich und erfasst die negative Wertung.
theological_decisions:
- issue: Verhältnis des hebräischen Schlusses zur griechischen Parallelüberlieferung
  choice: 'Der Haupttext folgt dem Hebräischen: „lästerte in seinem Hochmut“.'
  alternative: „rühmte sich in seiner Überheblichkeit“
  rationale: Der vorhandene hebräische Text hat für den Haupttext Vorrang und spricht ausdrücklich von frevelhafter Rede. Die griechische Parallelüberlieferung bietet eine inhaltlich verwandte, aber weniger ausdrücklich theologische Lesart, die in der Fußnote erhalten bleibt.
- issue: Objekt der Lästerung
  choice: Das Objekt bleibt unausgesprochen.
  alternative: „lästerte Gott“
  rationale: Obwohl der Zusammenhang und möglicherweise אל Gott als Ziel nahelegen, ist die Konstruktion nicht eindeutig genug, um „Gott“ ohne Kennzeichnung in den Haupttext einzufügen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewahrter hebräischer Bildsprache. „Rabschake“ bleibt als historischer assyrischer Titel transliteriert; die textliche Spannung zwischen hebräischer und griechischer Überlieferung wird nicht eingeebnet.
