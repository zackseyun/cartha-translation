  source_fidelity: 'Die Wiedergabe von המושח als relativ anschließendes „der … salbte“ und von ונביא תחליף תחתיך als Einsetzung eines Propheten als Nachfolger trifft den hebräischen Satzbau und Kontext im Grundsatz. „Vollstrecker“ ist jedoch im erhaltenen, schwierigen Hebräisch nicht ausgedrückt: Es macht aus dem unsicheren Objekt bzw. der Wortgruppe מלא תשלומות ausdrücklich einen handelnden Strafagenten. Die sicherere deutsche Fassung lässt dies offen. Die abweichende griechische Überlieferung ist angemessen als solche gekennzeichnet.'
  naturalness: „der einen zur Vergeltung salbte … und einen Propheten als deinen Nachfolger“ ist modernes, würdiges Standarddeutsch und funktioniert als Relativsatzanschluss an den vorigen Vers. „Als deinen Nachfolger“ ist idiomatischer als „zu deinem Nachfolger“ und gibt die funktionale Bedeutung der Wendung klar wieder.
  terminology: „Vergeltung“ gibt תשלומות zurückhaltend und passend wieder. „Salbte“ und „Propheten“ sind etablierte biblische Begriffe. Die Formulierung „zur Vergeltung“ vermeidet die überpräzise, im Hebräischen nicht gesicherte Bezeichnung „Vollstrecker“.
