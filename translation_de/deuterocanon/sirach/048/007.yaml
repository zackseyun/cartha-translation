  text: der einen zur Vergeltung salbte[b][a] und einen Propheten als deinen Nachfolger.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Überlieferung lautet: »der am Sinai Zurechtweisung hörte und am Horeb Urteile der Vergeltung.« Der erhaltene hebräische Text weicht hier deutlich von der griechischen Überlieferung ab.'
    reason: alternative_reading
  - marker: b
    text: Die hebräische Wortgruppe, die hier mit »einen zur Vergeltung« wiedergegeben wird, ist in dem aus Geniza-Handschriften zusammengesetzten Text schwierig; die Übersetzung folgt dem wahrscheinlichen Sinn im Zusammenhang.
    reason: textual_variant
lexical_decisions:
- source_word: המושח
  choice: der … salbte
  rationale: Als substantiviertes Partizip beziehungsweise Relativanschluss verstanden, der die Beschreibung Elias fortsetzt. Die Vergangenheitsform ist im deutschen Satzfluss natürlich.
- source_word: מלא תשלומות
  choice: einen zum Vollstrecker der Vergeltung
  rationale: Die hebräische Wortgruppe ist schwierig. מלא wird im Zusammenhang als Bezeichnung einer Person verstanden, die Vergeltung ausführt; diese Wiedergabe vermeidet das im Deutschen unklare wörtliche »einen voll von Vergeltungen«.
- source_word: ונביא
  choice: und einen Propheten
  rationale: Die artikellose Form wird im Deutschen unbestimmt wiedergegeben.
- source_word: תחליף תחתיך
  choice: zu deinem Nachfolger
  rationale: Die Verbindung aus חלף und תחת bezeichnet hier die Einsetzung eines anderen an Elias Stelle; »Nachfolger« gibt die funktionale Nachfolge natürlich wieder.
theological_decisions:
- issue: Deutliche Abweichung zwischen dem erhaltenen hebräischen Text und der griechischen Überlieferung
  choice: 'Der Haupttext folgt dem hebräischen Zeugnis: Elia salbt einen Vollstrecker der Vergeltung und bestellt einen Propheten zu seinem Nachfolger.'
  alternative: 'Griechisch: »der am Sinai Zurechtweisung hörte und am Horeb Urteile der Vergeltung.«'
  rationale: Wo der hebräische Sirachtext erhalten ist, bildet er die Hauptgrundlage. Die erheblich abweichende griechische Lesart wird jedoch als echtes Textzeugnis in einer Fußnote bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Verszeile bleibt als Relativsatz an den vorhergehenden Zusammenhang angeschlossen. »Vollstrecker der Vergeltung« macht den personalen und strafenden Sinn verständlich, ohne die schwierige hebräische Formulierung als sicherer auszugeben, als sie ist.
