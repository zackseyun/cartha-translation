  text: Then a prophet arose like fire[b][a], and his words were like a burning furnace.
translation:
  language: de
  text: Da trat ein Prophet auf wie Feuer,[a] und seine Worte waren wie ein brennender Ofen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Griechisch: „Da trat der Prophet Elija auf wie Feuer.“ Im Hebräischen steht hier lediglich „ein Prophet“, obwohl der Zusammenhang eindeutig von Elija handelt.'
    reason: alternative_reading
  - marker: b
    text: 'Der griechische Paralleltext lautet: „Sein Wort brannte wie eine Fackel.“ Hebräisch: „Seine Worte waren wie ein brennender Ofen.“'
    reason: textual_variant
lexical_decisions:
- source_word: עד אשר
  choice: Da
  rationale: Die Wendung leitet hier den nächsten Schritt der Erzählung ein. „Da“ gibt diesen zeitlichen Übergang im Deutschen natürlich wieder, ohne ein vom vorausgehenden Zusammenhang abhängiges „bis“ zu erzwingen.
- source_word: קם
  choice: trat … auf
  rationale: Bei einer prophetischen Gestalt bezeichnet קם ihr Hervortreten. „Trat auf“ ist im modernen Deutsch idiomatischer als das wörtliche „stand auf“ und bewahrt den gehobenen Erzählton.
- source_word: נביא
  choice: ein Prophet
  rationale: Der hebräische Text nennt keinen Eigennamen. Der Zusammenhang weist auf Elija, doch diese Identifizierung wird nicht in den Haupttext eingefügt.
- source_word: כאש
  choice: wie Feuer
  rationale: Die knappe, eindringliche Vergleichsform des Hebräischen bleibt erhalten.
- source_word: ודבריו
  choice: und seine Worte
  rationale: Der Plural des hebräischen Textes wird bewahrt; der griechische Paralleltext hat dagegen den Singular.
- source_word: כתנור בוער
  choice: wie ein brennender Ofen
  rationale: Die Wiedergabe hält sowohl das Ofenbild von תנור als auch das Partizip בוער („brennend“) fest. Sie vermeidet eine Angleichung an das abweichende griechische Bild einer Fackel.
theological_decisions:
- issue: Soll der Prophet im Haupttext ausdrücklich als Elija bezeichnet werden?
  choice: Der hebräische Wortlaut „ein Prophet“ bleibt im Haupttext stehen.
  alternative: „Da trat der Prophet Elija auf wie Feuer.“
  rationale: Der primäre hebräische Zeuge nennt Elija hier nicht ausdrücklich, während der griechische Paralleltext seinen Namen bietet. Die eindeutige Identifizierung durch den Zusammenhang und die griechische Lesart wird in einer Fußnote transparent gemacht, nicht stillschweigend in den Haupttext aufgenommen.
- issue: Soll das zweite Versglied an die griechische Lesart angeglichen werden?
  choice: Der hebräische Plural und das Bild des brennenden Ofens werden beibehalten.
  alternative: „und sein Wort brannte wie eine Fackel.“
  rationale: Zwischen Hebräisch und Griechisch bestehen Unterschiede sowohl im Numerus als auch im Bild. Da der hebräische Text vorliegt, wird er übersetzt; die bedeutsame griechische Variante erscheint in der Fußnote.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, knappem poetischem Ton. Die anschaulichen Bilder und die Parallelstruktur des Hebräischen bleiben erhalten.
