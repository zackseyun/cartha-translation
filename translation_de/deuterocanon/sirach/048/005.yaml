translation:
  language: de
  text: der einen Toten vom Tod und aus der Scheol auferweckte, nach dem Willen des HERRN.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Parallele lautet: „durch das Wort des Höchsten“. Der hebräische Text liest: „nach dem Willen des HERRN“.'
