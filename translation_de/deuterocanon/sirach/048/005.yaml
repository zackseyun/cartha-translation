lexical_decisions:
- source_word: המקים
  choice: der … auferweckte
  rationale: Das Hifil-Partizip von קום bezeichnet hier Elijas Handlung, einen Toten wieder zum Leben zu bringen. „Auferweckte“ gibt dies natürlich wieder, ohne die Aussage ausdrücklich mit einer späteren allgemeinen Auferstehungslehre gleichzusetzen.
- source_word: גוע
  choice: einen Toten
  rationale: Das Wort bezeichnet hier einen Menschen, der gestorben ist. „Einen Toten“ entspricht dem singularischen Objekt und ist im poetischen Lob würdevoller und weniger körperlich verengt als „einen Leichnam“.
- source_word: ממות
  choice: vom Tod
  rationale: Die Präposition מן ist separativ; „vom Tod“ bewahrt die knappe Bildsprache des Hebräischen.
- source_word: ומשאול
  choice: und aus dem Scheol
  rationale: „Scheol“ erhält die Begriffswelt des hebräischen Textes und bezeichnet den Bereich der Toten, ohne ihn auf das Grab zu verengen oder mit späteren Vorstellungen von Hades oder Hölle gleichzusetzen.
- source_word: כרצון יהוה
  choice: nach dem Willen des HERRN
  rationale: Der hebräische Zeuge bietet wörtlich „nach/gemäß dem Willen JHWHs“. Diese Lesart steht im Haupttext; die deutlich abweichende griechische Lesart wird in der Fußnote dokumentiert.
theological_decisions:
- issue: Formulierung der göttlichen Wirksamkeit am Versende
  choice: nach dem Willen des HERRN
  alternative: durch das Wort des Höchsten
  rationale: Der vorrangige hebräische Text liest כרצון יהוה, während die griechische Parallele ἐν λόγῳ Ὑψίστου bietet. Da der Unterschied zwischen göttlichem Willen und göttlichem Wort theologisch bedeutsam ist, folgt der Haupttext dem Hebräischen und bewahrt die griechische Variante in einer Fußnote.
- issue: Bedeutung des Scheol
  choice: Scheol als unbestimmt belassener Totenbereich
  alternative: Grab, Hades oder Hölle
  rationale: Der Ausgangstext legt keine präzisere spätere Jenseitstopografie fest. Die Transliteration bewahrt diese Offenheit.
translation_notes:
  register: Moderne, würdige und knappe Standardsprache. Die deutsche Satzgestalt verbindet „vom Tod und aus dem Scheol“ als parallele Herkunftsangaben. „HERR“ gibt das Tetragramm יהוה nach verbreiteter deutschsprachiger Bibelkonvention wieder.
