translation:
  language: de
  text: Er zerbrach ihnen den Stab des Brotes[a] und verringerte in seinem Eifer ihre Zahl.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Stab des Brotes“; ein Bild für die tragende Nahrungsversorgung. Die griechische Parallelüberlieferung lautet: „Er brachte eine Hungersnot über sie.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: וישבר
  choice: Er zerbrach
  rationale: Das hebräische שבר bezeichnet ein Brechen oder Zerbrechen. „Zerbrach“ bewahrt das konkrete Bild und führt Elijas Handeln als Einzeltäter fort.
- source_word: מטה לחם
  choice: den Stab des Brotes
  rationale: Die Wendung bezeichnet bildhaft die tragende Versorgung mit Brot, also die Nahrungsgrundlage. Die formnahe Wiedergabe erhält das hebräische Bild; die Fußnote erklärt den Sinn. Das griechische λιμόν („Hungersnot“) bestätigt diese Deutung.
- source_word: ובקנאתו
  choice: in seinem Eifer
  rationale: קנאה kann Eifer oder Eifersucht bezeichnen. Im Zusammenhang mit Elija ist „Eifer“ die natürliche und sachlich passende Wiedergabe; „in“ bildet die Präposition ב ab.
- source_word: המעיטם
  choice: verringerte … ihre Zahl
  rationale: Das Hifil von מעט bedeutet „wenig machen, vermindern“. „Verringerte ihre Zahl“ gibt die resultative Bedeutung in natürlichem Deutsch wieder, ohne genauer festzulegen, auf welche Weise die Menschen weniger wurden.
- source_word: λιμόν
  choice: Hungersnot
  rationale: Die griechische Parallelüberlieferung deutet das hebräische Bild ausdrücklich als Hungersnot und stützt damit die Erklärung der Wendung „Stab des Brotes“.
theological_decisions:
- issue: Wörtliche oder deutende Wiedergabe der hebräischen Brot-Metapher
  choice: Das Bild „Stab des Brotes“ bleibt im Haupttext erhalten; seine Bedeutung wird in einer Fußnote erklärt.
  alternative: „Er brachte eine Hungersnot über sie“ oder „Er entzog ihnen die Brotversorgung“.
  rationale: Der gut bezeugte hebräische Text ist vorrangig und enthält ein bewusst konkretes Bild. Die griechische Parallele bestätigt dessen Sinn, rechtfertigt aber nicht, das Bild im Haupttext stillschweigend durch seine Deutung zu ersetzen.
- issue: Bedeutungsumfang von המעיטם
  choice: „verringerte … ihre Zahl“
  alternative: „machte sie gering“ oder „machte sie zu wenigen“.
  rationale: Die gewählte Formulierung bewahrt den Gedanken einer zahlenmäßigen Verminderung, lässt aber die im Vers nicht ausdrücklich genannte Art und Ursache dieser Verminderung offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter biblischer Bildsprache. Die ungewöhnliche Wendung „Stab des Brotes“ wird wegen ihrer Aussagekraft und Quellennähe beibehalten und unmittelbar durch eine Fußnote erschlossen.
