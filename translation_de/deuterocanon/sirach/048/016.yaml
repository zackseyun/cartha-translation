  text: A remnant was left to Judah[a], and to the house of David a ruler. Some of them did what was right, but some of them greatly increased apostasy.
translation:
  language: de
  text: Juda blieb nur ein kleiner Rest, und dem Haus Davids blieb noch ein Herrscher. Einige von ihnen taten, was recht war; andere aber begingen maßlosen Treuebruch.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Parallelüberlieferung lautet: „Einige von ihnen vermehrten die Sünden.“ Das Hebräische spricht schärfer von maßlosem Treuebruch.'
    reason: alternative_reading
lexical_decisions:
- source_word: וישאר ליהודה מזער
  choice: Juda blieb nur ein kleiner Rest
  rationale: Die Formulierung bewahrt den Gedanken eines sehr kleinen verbliebenen Teils; „nur ein kleiner Rest“ gibt מזער im Zusammenhang von Gericht und Fortbestand natürlich wieder.
- source_word: ועוד לבית דוד קצין
  choice: und dem Haus Davids blieb noch ein Herrscher
  rationale: „Noch“ bildet ועוד ab und unterstreicht den Fortbestand der davidischen Herrschaft. קצין bezeichnet allgemein eine Person mit Herrschaftsgewalt, ohne einen genaueren Titel festzulegen.
- source_word: עשו יושר
  choice: taten, was recht war
  rationale: Die idiomatische Wendung gibt das Tun von יושר als moralisch richtiges Handeln in klarem, modernem Deutsch wieder.
- source_word: הפליאו מעל
  choice: steigerten ihren Treuebruch ins Maßlose
  rationale: הפליאו verstärkt das folgende Handeln als außergewöhnlich oder übermäßig; מעל bezeichnet einen schuldhaften Bruch von Treue, besonders im Verhältnis zu Gott. Die Wiedergabe hält diese Schärfe fest, ohne sie auf eine bestimmte Form des Abfalls einzuengen.
theological_decisions:
- issue: Bedeutungsstärke von מעל in der Zusammenfassung der Königsgeschichte
  choice: Treuebruch
  alternative: Abfall; Untreue; Sünden
  rationale: Das hebräische מעל bezeichnet stärker als ein allgemeines Wort für Sünde den Bruch geschuldeter Treue. „Treuebruch“ bewahrt diese Beziehungsebene, während die griechische Parallelüberlieferung allgemeiner von „Sünden“ spricht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung von „blieb“ macht den Fortbestand von Volk und davidischer Herrschaft deutlich; „Haus Davids“ bewahrt die vertraute dynastische Ausdrucksweise. Das Semikolon bildet den Gegensatz zwischen den beiden Gruppen klar ab.
