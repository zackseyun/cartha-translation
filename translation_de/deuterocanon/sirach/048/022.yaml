base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/048/022.yaml
  text: For Hezekiah did what was good[a], and was strong in the ways of David, as Isaiah the prophet commanded him[b], the one praised among the prophets.
translation:
  language: de
  text: Denn Hiskia tat, was gut war,[a] und blieb auf den Wegen Davids standhaft, wie der Prophet Jesaja ihm geboten hatte,[b] der unter den Propheten gepriesen wird.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Griechisch: „tat, was dem Herrn gefiel“. Der erhaltene hebräische Text lautet lediglich: „tat, was gut war“.'
    reason: alternative_reading
  - marker: b
    text: 'Der griechische Text beschreibt Jesaja stattdessen als „den großen Propheten, treu in seiner Schau“. Im Hebräischen heißt es: „der unter den Propheten gepriesen wird“.'
    reason: textual_variant
lexical_decisions:
- source_word: כי
  choice: Denn
  rationale: Die Konjunktion leitet eine begründende oder erläuternde Aussage ein; „Denn“ bewahrt diese Verknüpfung in natürlichem Deutsch.
- source_word: עשה ... את הטוב
  choice: tat, was gut war
  rationale: Das Hebräische lautet wörtlich „tat das Gute“. Die gewählte Form ist idiomatisch und erhält die moralische Wertung, ohne den im griechischen Paralleltext ergänzten Gottesbezug in den Haupttext zu übernehmen.
- source_word: ויחזק
  choice: hielt ... fest
  rationale: חזק kann hier ein Starksein oder Sich-Festigen bezeichnen. Zusammen mit „an den Wegen Davids“ gibt „hielt fest“ die beharrliche Ausrichtung natürlich wieder, ohne ein im Hebräischen nicht genanntes Objekt einzuführen.
- source_word: בדרכי דוד
  choice: an den Wegen Davids
  rationale: „Wege“ bewahrt die biblische Metapher für Lebensführung und Verhalten. Mit „festhalten an“ ergibt sich eine verständliche deutsche Wendung.
- source_word: כאשר צוהו
  choice: wie ... es ihm geboten hatte
  rationale: צוה bezeichnet ein Gebieten oder Anweisen. Das Pronomen „es“ verweist natürlich auf die zuvor beschriebene Lebensführung; das Plusquamperfekt verdeutlicht die zeitliche Abfolge.
- source_word: ישעיה הנביא
  choice: der Prophet Jesaja
  rationale: Diese Wortstellung ist im modernen Deutschen natürlich und entspricht inhaltlich dem hebräischen Titel mit Namen.
- source_word: המהלל בנביאים
  choice: der unter den Propheten gepriesen wird
  rationale: Die appositionelle, knappe hebräische Formulierung wird als Relativsatz wiedergegeben. Der passive Sinn von המהלל und die Zuordnung Jesajas zu den Propheten bleiben erhalten.
theological_decisions:
- issue: Ob „dem Herrn“ aus dem griechischen Paralleltext in den Haupttext aufgenommen wird
  choice: Im Haupttext ausgelassen
  alternative: „tat, was dem Herrn gefiel“
  rationale: Der erhaltene hebräische Text sagt lediglich, Hiskia habe getan, was gut war. Der griechische Zusatz ist als bedeutsame Lesart in der Fußnote dokumentiert, bestimmt aber nicht den Haupttext.
- issue: Abweichende abschließende Beschreibung Jesajas
  choice: 'Hebräische Lesart: „der unter den Propheten gepriesen wird“'
  alternative: 'Griechische Lesart: „der große Prophet, treu in seiner Schau“'
  rationale: Hebräisch und Griechisch bieten materiell verschiedene Beschreibungen. Da ein hebräischer Text vorliegt, steht dessen Lesart im Haupttext; die griechische Variante wird transparent in der Fußnote bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit erkennbarer biblischer Bildsprache. Die Satzstruktur bleibt nahe am Hebräischen, wird aber durch idiomatische Verbfügung und einen Relativsatz verständlich gestaltet. Sämtliche Fußnotenmarker stehen im Haupttext.
