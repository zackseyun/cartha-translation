  terminology: Die Namen Hiskia, David und Jesaja sowie „Prophet“ sind korrekt und konsistent. „Unter den Propheten gepriesen“ gibt die hebräische appositionelle Charakterisierung angemessen wieder, ohne die abweichende griechische Charakterisierung einzuarbeiten.
