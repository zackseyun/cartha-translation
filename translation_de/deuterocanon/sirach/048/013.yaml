base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/048/013.yaml
  text: In his days he did not tremble before anyone[a], and no flesh mastered his spirit. No word was too wondrous for him[b], and beneath him his flesh was created.
translation:
  language: de
  text: Zeit seines Lebens zitterte er vor niemandem, und kein Sterblicher herrschte über seinen Geist. Kein Wort[a] war ihm zu wunderbar, und im Schlaf weissagte sein Leib.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Keine Sache“ oder „Keine Angelegenheit“. Das hebräische Wort kann sowohl „Wort“ als auch „Sache“ bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Die griechische Überlieferung lautet: „und im Schlaf weissagte sein Leib“. „Schlaf“ kann im Zusammenhang auch eine Umschreibung des Todes sein. Der erhaltene hebräische Text ist hier schwierig und lautet wörtlich ungefähr: „und unter ihm wurde sein Fleisch erschaffen“. Vermutlich liegt eine Textstörung vor.'
    reason: textual_variant
lexical_decisions:
- source_word: מימיו לא זע מכל
  choice: Zeit seines Lebens zitterte er vor niemandem
  rationale: מימיו wird als zeitliche Wendung natürlich mit „Zeit seines Lebens“ wiedergegeben. זע bezeichnet Zittern oder Erschüttertwerden; „vor niemandem“ bringt im Zusammenhang die Furchtlosigkeit des Propheten zum Ausdruck, ohne das Verb abzuschwächen.
- source_word: ולא משל ברוחו כל בשר
  choice: und kein Sterblicher herrschte über seinen Geist
  rationale: כל בשר („alles Fleisch“) bezeichnet idiomatisch die sterbliche Menschheit. „Kein Sterblicher“ bewahrt diesen Aspekt, während משל ברוחו mit „herrschte über seinen Geist“ eng am Hebräischen bleibt.
- source_word: כל דבר לא נפלא ממנו
  choice: Kein Wort war ihm zu wunderbar
  rationale: דבר kann „Wort“ oder „Sache/Angelegenheit“ bedeuten; „Wort“ entspricht zugleich dem griechischen λόγος. נפלא wird als „zu wunderbar“ wiedergegeben, statt die Aussage deutend zu „verborgen“ oder „unmöglich“ zu glätten.
- source_word: ἐν κοιμήσει ἐπροφήτευσεν τὸ σῶμα αὐτοῦ
  choice: und im Todesschlaf weissagte sein Leib
  rationale: Die erhaltene hebräische Schlusszeile ist in diesem Zusammenhang schwer verständlich. Die griechische Parallelüberlieferung bietet eine klare, kontextgerechte Lesart. „Todesschlaf“ macht hier die auf Elischas Tod bezogene Bedeutung von κοίμησις verständlich; „Leib“ gibt σῶμα würdig und präzise wieder.
theological_decisions:
- issue: Textgrundlage der schwierigen Schlusszeile
  choice: 'Die Hauptübersetzung folgt für den letzten Satzteil der griechischen Parallelüberlieferung: „und im Todesschlaf weissagte sein Leib“.'
  alternative: 'Eine formnahe Wiedergabe des erhaltenen Hebräischen wäre etwa: „und unter ihm wurde sein Fleisch erschaffen“.'
  rationale: Der überlieferte hebräische Wortlaut ist syntaktisch übersetzbar, ergibt im Kontext jedoch einen schwer nachvollziehbaren Sinn und dürfte eine Textstörung widerspiegeln. Die griechische Lesart fügt sich in die anschließende Vorstellung von Elischas Wirksamkeit nach dem Tod ein. Die Fußnote legt die Abweichung offen, statt die Unsicherheit zu verdecken.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Zeit seines Lebens“ und „kein Sterblicher“ sind allgemein verständlich, bewahren aber den gehobenen Ton. Die ungewöhnliche Aussage über den weissagenden Leib bleibt als bewusste Spannung des Quelltextes stehen und wird nicht dogmatisch erklärt.
