translation:
  language: de
  text: Du ließest am Sinai Zurechtweisungen hören[a] und am Horeb Urteile der Vergeltung.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Parallelüberlieferung bietet hier eine wesentlich andere Lesart, sinngemäß: „du Könige zur Vergeltung salbtest und Propheten zu Nachfolgern nach ihm [einsetztest]“. Der hebräische und der griechische Text scheinen unterschiedliche Textformen dieses Verses zu bewahren.'
    reason: textual_variant
lexical_decisions:
- source_word: השמע
  choice: du ließest … hören
  rationale: 'Die unpunktierte Form wird entsprechend der primären hebräischen Textentscheidung als kausative Form von שמע wiedergegeben: etwas hören lassen bzw. zu Gehör bringen. So bleibt die ungewöhnliche Ausdrucksweise des hebräischen Zeugnisses erhalten.'
- source_word: בסיני
  choice: am Sinai
  rationale: Die Präposition ב bezeichnet hier den Ort des Geschehens; bei einem Bergnamen ist „am“ im Deutschen idiomatisch.
- source_word: תוכחות
  choice: Zurechtweisungen
  rationale: תוכחות bezeichnet nachdrückliche Rügen oder zurechtweisende Mahnungen. „Zurechtweisungen“ bewahrt sowohl den mahnenden als auch den tadelnden Gehalt.
- source_word: ובחורב
  choice: und am Horeb
  rationale: Die Ortsangabe wird parallel zu „am Sinai“ formuliert.
- source_word: משפטי נקם
  choice: Urteile der Vergeltung
  rationale: משפטי ist eine Konstruktform und wird formal mit „Urteile der …“ verbunden; נקם bezeichnet Vergeltung oder Rache. „Vergeltung“ gibt den gerichtlichen Strafaspekt wieder, ohne die Wendung unnötig auszudeuten.
theological_decisions:
- issue: Starke Abweichung zwischen dem hebräischen Textzeugen und der griechischen Parallelüberlieferung
  choice: 'Der Haupttext folgt dem erhaltenen Hebräisch: „Du ließest am Sinai Zurechtweisungen hören und am Horeb Urteile der Vergeltung.“'
  alternative: 'Die griechische Überlieferung hat sinngemäß: „der Könige zur Vergeltung salbte und Propheten zu Nachfolgern nach ihm“.'
  rationale: Wo für Jesus Sirach ein hebräischer Text erhalten ist, bildet er die primäre Grundlage. Die griechische Fassung stellt hier keine bloße Übersetzungsvariante, sondern offenbar eine deutlich andere Textform dar; deshalb wird sie transparent in der Fußnote dokumentiert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallele Satzstruktur und die markante Gerichtssprache des Hebräischen bleiben erhalten; die erhebliche griechische Textvariante wird nicht in den Haupttext eingemischt.
