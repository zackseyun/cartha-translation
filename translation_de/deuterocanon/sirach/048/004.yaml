translation:
  language: de
  text: Wie furchtgebietend bist du, Elija![a] Und wer kann sich rühmen wie du?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Parallelüberlieferung lautet: „Wie bist du verherrlicht worden, Elija, durch deine Wunder! Und wer ist dir gleich, sich zu rühmen?“ Der hebräische Text lautet wörtlicher: „Wie furchtgebietend bist du, Elija!“; ihm folgt die Übersetzung.'
    reason: alternative_reading
lexical_decisions:
- source_word: מה נורא
  choice: Wie furchtgebietend
  rationale: Das ausrufende מה zusammen mit נורא drückt staunende Bewunderung und zugleich Scheu aus. „Furchtgebietend“ bewahrt diese Spannung besser als das abgeschwächte „beeindruckend“ oder das stärker wertende „herrlich“.
- source_word: אתה
  choice: bist du
  rationale: Der hebräische Nominalsatz bezeichnet Elijas gegenwärtig vorgestellte Eigenschaft; im Deutschen ist dafür die Kopula „bist“ erforderlich.
- source_word: אליהו
  choice: Elija
  rationale: Gebräuchliche deutsche Form des biblischen Namens.
- source_word: ואשר כמוך יתפאר
  choice: Und wer kann sich rühmen wie du?
  rationale: Der überlieferte hebräische Wortlaut ist syntaktisch auffällig, doch der Zusammenhang und die griechische Parallele stützen eine rhetorische Frage. „Sich rühmen“ gibt יתפאר idiomatisch wieder; „wie du“ erhält den Vergleich, ohne den schwierigen Wortlaut unnötig festzulegen.
theological_decisions:
- issue: Abweichung zwischen dem hebräischen Hauptzeugen und der griechischen Parallele
  choice: Die hebräische Aussage „Wie furchtgebietend bist du“ wird im Haupttext wiedergegeben.
  alternative: „Wie bist du verherrlicht worden, Elija, durch deine Wunder!“
  rationale: Der vorhandene hebräische Text ist hier der primäre Ausgangspunkt und bewahrt mit נורא den Aspekt ehrfürchtiger Scheu. Die griechische Fassung wird als wichtiger Parallelzeuge in der Fußnote genannt und hilft, die rhetorische Struktur des zweiten Satzteils zu bestätigen, ersetzt aber nicht die eigenständige Aussage des Hebräischen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Furchtgebietend“ ist bewusst gehoben, aber allgemein verständlich und erhält den ehrfurchtgebietenden Klang des Hebräischen. Die rhetorische Schlussfrage ist knapp und natürlich formuliert.
