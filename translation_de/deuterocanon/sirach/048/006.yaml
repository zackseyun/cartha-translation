lexical_decisions:
- source_word: המוריד
  choice: hinabstürzte
  rationale: Das Hifil-Partizip von ירד bezeichnet ein Veranlassen des Hinabgehens. „Hinabstürzte“ bewahrt sowohl die räumliche Bewegung als auch den bildlichen Sinn des Sturzes von Macht und Leben; das griechische καταγαγών bestätigt die abwärts gerichtete Aussage.
- source_word: מלכים
  choice: Könige
  rationale: מלכים bezeichnet ausdrücklich Könige; eine Verallgemeinerung zu „Herrschern“ ist nicht erforderlich.
- source_word: על שחת
  choice: ins Verderben
  rationale: שחת kann Grube, Untergang oder Verderben bezeichnen. Hier gibt „ins Verderben“ den resultativen Sinn natürlich wieder; die griechische Parallele εἰς ἀπώλειαν stützt diese Deutung.
- source_word: ונכבדים
  choice: und Angesehene
  rationale: נכבדים bezeichnet Menschen von Gewicht, Ehre oder hohem Rang. „Angesehene“ wahrt den breiten Sinn, ohne ihn auf einen erblichen Adel einzuengen.
- source_word: ממטותם
  choice: von ihren Betten
  rationale: מטותם bedeutet wörtlich „ihre Betten“ beziehungsweise „ihre Lager“. „Betten“ ist im heutigen Deutsch natürlich und bewahrt das konkrete Bild.
theological_decisions:
- issue: Ob der zweite Halbvers allgemein einen gesellschaftlichen Sturz beschreibt oder gezielt auf Elijas Gerichtswort über einen bettlägerigen König anspielt
  choice: Das konkrete Bild „Angesehene von ihren Betten“ bleibt im Haupttext stehen; die mögliche Anspielung wird nur in einer Fußnote genannt.
  alternative: 'Deutender: „Angesehene von ihren Krankenlagern“ oder allgemeiner: „Vornehme von ihren Lagern“.'
  rationale: Sowohl der hebräische Text als auch die griechische Parallele nennen tatsächlich Betten beziehungsweise Lager. Die wahrscheinliche Erzählanspielung soll die Auslegung erhellen, aber nicht als ausdrückliche Aussage in den Haupttext eingeführt werden.
translation_notes:
  register: Poetisch verdichtetes, würdevolles Standarddeutsch. Die Ellipse im zweiten Satzglied folgt der knappen hebräischen Parallelstruktur; „hinabstürzte“ ist sinngemäß auch dort mitzudenken.
