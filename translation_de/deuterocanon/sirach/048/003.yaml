translation:
  language: de
  text: Durch Gottes Wort hielt er den Himmel zurück[a] und ließ dreimal Feuer herabkommen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der erhaltene hebräische Text lautet knapp „durch das Wort Gottes“. Die griechische Parallele hat ausdrücklich: „Durch das Wort des Herrn verschloss er den Himmel.“ Wegen der knappen hebräischen Formulierung ist die genaue syntaktische Zuordnung nicht in allen Einzelheiten sicher.'
    reason: textual_uncertainty
  - marker: b
    text: 'Wörtlich: „drei Feuer“; gemeint ist wahrscheinlich, dass er bei drei Gelegenheiten Feuer herabkommen ließ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בדבר אל
  choice: Durch Gottes Wort
  rationale: בדבר hat instrumentalen Sinn („durch/mit dem Wort“), und אל bedeutet gewöhnlich „Gott“. Die griechische Parallele ἐν λόγῳ Κυρίου („durch das Wort des Herrn“) stützt diese Lesart. Zugleich bleibt die knappe unvokalisierte hebräische Fügung syntaktisch nicht völlig eindeutig; deshalb wird die mögliche andere Zuordnung in einer Fußnote genannt.
- source_word: עצר שמים
  choice: verschloss er den Himmel
  rationale: עצר bezeichnet das Zurückhalten oder Verschließen. Gemeint ist im Elija-Kontext, dass der Himmel keinen Regen gab; die Übersetzung bewahrt jedoch wie der hebräische Text das Bild, ohne „Regen“ ausdrücklich hinzuzufügen. שמים ist im Hebräischen formal pluralisch, bezeichnet hier aber idiomatisch den Himmel.
- source_word: ויורד
  choice: und ließ … herabkommen
  rationale: 'Die Form drückt hier ein Veranlassen aus: Elija bewirkte, dass Feuer herabkam. „ließ … herabkommen“ gibt diese kausative Bedeutung natürlich wieder.'
- source_word: שלוש אשות
  choice: dreimal Feuer
  rationale: Wörtlich steht „drei Feuer“. Die griechische Parallele τρὶς πῦρ bestätigt, dass drei Ereignisse beziehungsweise dreimaliges Herabkommen von Feuer gemeint sind, nicht drei gleichzeitig unterschiedene Feuer.
theological_decisions:
- issue: Bezeichnet אל Gott, oder ist die knappe hebräische Wortfolge anders zu gliedern?
  choice: „Durch Gottes Wort“ im Haupttext
  alternative: „Auf ein Wort hin verschloss er den Himmel“ beziehungsweise „Auf ein Wort hin hielt Gott den Himmel zurück“
  rationale: אל wird seinem normalen hebräischen Sinn entsprechend als „Gott“ verstanden; zudem bietet die alte griechische Überlieferung ausdrücklich „durch das Wort des Herrn“. Die syntaktische Knappheit des unvokalisierten hebräischen Textes wird dennoch nicht verschwiegen. Der Handelnde des Verses bleibt im Zusammenhang Elija, ohne dass seine Vollmacht von Gottes Wort gelöst wird.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Den Himmel verschließen“ bewahrt das biblische Bild und bleibt für heutige Leser verständlich; „dreimal Feuer“ vermeidet die missverständliche wörtliche Wendung „drei Feuer“.
