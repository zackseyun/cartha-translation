base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/048/015.yaml
  text: Yet for all this the people did not turn back[a], and they did not cease from their sins[c][b], until they were uprooted from their land and were scattered throughout the earth.
translation:
  language: de
  text: Trotz alledem kehrte das Volk nicht um[a] und ließ nicht von seinen Sünden ab, bis es aus seinem Land entwurzelt und über die ganze Erde zerstreut wurde.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »bereute nicht«. Wörtlich heißt es im Hebräischen: »kehrte nicht um«; der griechische Paralleltext verwendet ausdrücklich ein Wort für Bereuen beziehungsweise Umdenken.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »in alle Länder«. Die hebräische Wendung kann eine weite Zerstreuung unter viele Länder bezeichnen.'
    reason: alternative_reading
  - marker: c
    text: 'Der griechische Paralleltext fährt über den erhaltenen hebräischen Text hinaus fort: »Und das Volk blieb nur in sehr geringer Zahl übrig, und ein Herrscher aus dem Haus Davids.« Der Haupttext folgt dem erhaltenen Hebräisch.'
    reason: textual_variant
lexical_decisions:
- source_word: בכל זאת
  choice: Doch trotz alledem
  rationale: Gibt die konzessiv-adversative Kraft der Wendung im Zusammenhang natürlich und würdig wieder.
- source_word: לא שב
  choice: kehrte ... nicht um
  rationale: Bewahrt das konkrete Bild des hebräischen שוב und lässt zugleich den sittlich-religiösen Sinn erkennen; das griechische μετενόησεν bestätigt den Sinn »bereute nicht«.
- source_word: העם
  choice: das Volk
  rationale: Entspricht dem kollektiven Gebrauch von עם und ist hier natürlicher als eine politisch gefärbte Wiedergabe mit »Nation«.
- source_word: ולא חדלו מחטאתם
  choice: und ließ nicht von seinen Sünden ab
  rationale: Die idiomatische deutsche Wendung gibt חדל מן präzise wieder; »seinen Sünden« bewahrt die Mehrzahl, die auch im griechischen Paralleltext belegt ist.
- source_word: עד אשר נסחו מארצם
  choice: bis es aus seinem Land entwurzelt ... wurde
  rationale: »Entwurzelt« bringt die gewaltsame Entfernung aus dem Land anschaulich zum Ausdruck und eignet sich für den Exilkontext.
- source_word: ויפוצו בכל הארץ
  choice: und über die ganze Erde zerstreut wurde
  rationale: Gibt פוץ als Zerstreuung und בכל הארץ in seinem wahrscheinlich weiten, über das eigene Land hinausreichenden Sinn wieder.
theological_decisions:
- issue: Umkehrsprache in לא שב gegenüber griechisch μετενόησεν
  choice: kehrte ... nicht um
  alternative: bereute nicht
  rationale: Der erhaltene hebräische Text bleibt maßgeblich. »Umkehren« bewahrt sein Bild, während der griechische Paralleltext den religiös-ethischen Sinn bestätigt.
- issue: Reichweite von ארץ in בכל הארץ
  choice: über die ganze Erde
  alternative: in alle Länder
  rationale: Im Exilzusammenhang bezeichnet die Wendung eine weiträumige Zerstreuung. Wegen der möglichen distributiven Bedeutung wird »in alle Länder« als Alternative vermerkt.
- issue: Längerer griechischer Text nach dem erhaltenen hebräischen Wortlaut
  choice: Der Haupttext endet mit der Zerstreuung
  alternative: 'Ergänzung: »Und das Volk blieb nur in sehr geringer Zahl übrig und ein Herrscher für das Haus Davids.«'
  rationale: Der vorhandene hebräische Text ist die primäre Grundlage; die nur im griechischen Paralleltext vorliegende Fortsetzung wird als Textvariante dokumentiert, nicht stillschweigend aufgenommen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die kollektive Einzahl »das Volk ... es« wird konsequent beibehalten. Die Fußnotenmarker stehen jeweils an der sachlich zugehörigen Stelle im Haupttext.
