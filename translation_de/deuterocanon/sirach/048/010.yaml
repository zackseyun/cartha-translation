  text: who was appointed for the appointed time[a], to calm wrath before fury, to turn the heart of fathers to sons[c][b], and to restore the tribes of Israel.
translation:
  language: de
  text: der für die rechte Zeit bestimmt ist[a], um den Zorn zu stillen, bevor Gottes Grimm entbrennt, um das Herz der Väter den Söhnen zuzuwenden[b] und die Stämme Israels wiederherzustellen.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hebräische Wortlaut ist schwer verständlich und lautet wörtlicher etwa: „der Aufgeschriebene, bereit für die Zeit“. Im Griechischen heißt es: „der in Zurechtweisungen für Zeiten verzeichnet wurde“.'
    reason: alternative_reading
  - marker: b
    text: Im Hebräischen steht „Väter … Söhne“ im Plural; im Griechischen „Vater … Sohn“ im Singular.
    reason: textual_variant
  - marker: c
    text: Der griechische Text hat „die Stämme Jakobs“ statt „die Stämme Israels“.
    reason: textual_variant
lexical_decisions:
- source_word: הכתוב נכון לעת / ὁ καταγραφεὶς ἐν ἐλεγμοῖς εἰς καιρούς
  choice: der für die rechte Zeit bestimmt ist
  rationale: Der überlieferte hebräische Ausdruck ist schwierig und bezeichnet Elija offenbar als jemanden, der für einen künftigen, passenden Zeitpunkt vorgesehen oder verzeichnet ist. Die griechische Parallele bestätigt den Gedanken zeitlicher Bestimmung, enthält aber zusätzlich die unsichere Wendung „in Zurechtweisungen“. Die Übersetzung gibt den tragenden Sinn natürlich wieder, ohne die Unklarheit durch eine zu wörtliche Formulierung zu verdecken.
- source_word: להשבית אף
  choice: den Zorn zu stillen
  rationale: להשבית bedeutet, etwas aufhören zu lassen; „stillen“ ist im Deutschen idiomatisch und entspricht zugleich dem griechischen κοπάσαι, ohne eine vollständige Beseitigung des Zorns zu behaupten.
- source_word: לפני חרון אל
  choice: bevor Gottes Grimm entbrennt
  rationale: Der hebräische Text nennt ausdrücklich den heftigen Zorn Gottes. Die verbale Formulierung „entbrennt“ gibt חרון natürlich wieder und bewahrt die zeitliche Beziehung von לפני.
- source_word: להשיב לב אבות על בנים
  choice: das Herz der Väter den Söhnen zuzuwenden
  rationale: Die Übersetzung folgt dem erhaltenen hebräischen Plural und bewahrt die prophetische Wendung „das Herz zuwenden“, statt sie deutend als vollständige Versöhnung wiederzugeben.
- source_word: ולהכין שבטי ישראל
  choice: die Stämme Israels wiederherzustellen
  rationale: להכין kann „bereiten“, „festigen“ oder „in einen rechten Zustand bringen“ bedeuten. Im Zusammenhang der endzeitlichen Erneuerung gibt „wiederherstellen“ den Sinn angemessen wieder; „Israel“ folgt dem hebräischen Text.
theological_decisions:
- issue: Verhältnis des erhaltenen hebräischen Sirachtextes zur griechischen Parallelüberlieferung
  choice: Der Haupttext folgt dem erhaltenen Hebräisch; die griechische Fassung dient zur Klärung und wird bei Abweichungen in den Fußnoten genannt.
  alternative: Eine vorrangig griechische Wiedergabe wie „der in Zurechtweisungen für bestimmte Zeiten verzeichnet wurde“
  rationale: Da dieser Vers auf Hebräisch erhalten ist, besitzt dieser Text Vorrang. Die schwer verständliche Anfangsformel bleibt jedoch durch eine Fußnote transparent, und echte Varianten werden nicht stillschweigend harmonisiert.
- issue: Prophetische Formel von der Zuwendung des Herzens
  choice: Die bildhafte Wendung „das Herz ... zuwenden“ bleibt erhalten.
  alternative: „Väter und Söhne miteinander versöhnen“
  rationale: Die wörtliche Bildsprache bewahrt den Bezug zur Elija-Verheißung und legt nicht fest, ob ausschließlich soziale Versöhnung oder eine umfassendere geistliche Umkehr gemeint ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur setzt den vorausgehenden Relativsatz über Elija fort. Bildhafte prophetische Sprache und textliche Spannungen zwischen Hebräisch und Griechisch bleiben erkennbar.
