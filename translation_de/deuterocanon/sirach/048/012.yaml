base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/048/012.yaml
  text: Elijah was hidden in the storehouse[a], and Elisha was filled with his spirit. Twice as many signs, and many wonders[b], came from his mouth.
translation:
  language: de
  text: Elija war in der Schatzkammer verborgen[a], und Elischa wurde mit seinem Geist erfüllt. Doppelt so zahlreich waren seine vielen Zeichen[b], und alle Worte seines Mundes waren Wunder.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Im Griechischen heißt es: »Elija, der von einem Sturmwind verhüllt wurde.« Der hebräische Text lautet dagegen: »Elija war in der Schatzkammer verborgen.«'
    reason: textual_variant
  - marker: b
    text: Wörtlich steht im Hebräischen eine knappe Wendung für »das Doppelte«; sie erinnert wahrscheinlich an Elischas doppelten Anteil.
    reason: lexical_alternative
lexical_decisions:
- source_word: שבאוצר נסתר
  choice: war in der Schatzkammer verborgen
  rationale: Das erhaltene Hebräisch nennt ausdrücklich eine אוצר, eine Schatz- oder Vorratskammer. Die rätselhafte Bildsprache bleibt im Haupttext erhalten; die deutlich abweichende griechische Lesart wird in einer Fußnote genannt.
- source_word: ונמלא רוחו אלישע
  choice: und Elischa wurde mit seinem Geist erfüllt
  rationale: Das Suffix in רוחו bezieht sich am natürlichsten auf Elija. Die Kleinschreibung von »Geist« vermeidet eine ausdrückliche Identifikation mit dem göttlichen Geist, die der Satz nicht eindeutig vornimmt.
- source_word: פי שנים
  choice: doppelt so viele
  rationale: Die Wendung bezeichnet wörtlich ein Zweifaches bzw. Doppeltes und erinnert wahrscheinlich an Elischas Bitte um einen doppelten Anteil. Die deutsche Formulierung gibt die elliptische Mengenangabe verständlich wieder, ohne ihren Bezug dogmatisch festzulegen.
- source_word: אותות הרבה
  choice: Zeichen
  rationale: אותות wird als »Zeichen« wiedergegeben. Das im Ausdruck stehende הרבה wird im Deutschen zusammen mit פי שנים als Mengenangabe verstanden, während die knappe hebräische Fügung in der Fußnote erläutert wird.
- source_word: ומופתים
  choice: und viele Wunder
  rationale: מופתים bezeichnet machtvolle Wunderzeichen. »Wunder« bildet mit »Zeichen« die geläufige biblische Wortverbindung; »viele« bewahrt die im hebräischen Satz hervorgehobene Fülle.
- source_word: כל מוצא פיהו
  choice: gingen aus seinem Mund hervor
  rationale: Die Wendung lautet bildhaft etwa »bei jedem Hervorgehen seines Mundes« und bezieht sich auf Elischas Ausspruch. Die Übersetzung erhält das Mund-Bild in natürlichem Deutsch.
theological_decisions:
- issue: Abweichung zwischen dem hebräischen und dem griechischen Text im ersten Satzteil
  choice: 'Der Haupttext folgt dem Hebräischen: Elija war in der Schatzkammer verborgen.'
  alternative: Nach dem Griechischen wurde Elija von einem Wirbelsturm verhüllt bzw. entrückt.
  rationale: Da ein belastbarer hebräischer Text vorliegt, erhält er im Haupttext Vorrang. Die alte und inhaltlich stimmige griechische Lesart wird wegen ihrer erheblichen Abweichung in einer Fußnote bewahrt.
- issue: Bezug von »seinem Geist«
  choice: Das Possessivpronomen verweist am ehesten auf Elija; »Geist« bleibt kleingeschrieben.
  alternative: Die Formulierung könnte ausdrücklich auf den göttlichen Geist bezogen und »Geist« großgeschrieben werden.
  rationale: Hebräisches Suffix und griechisches αὐτοῦ weisen grammatisch auf Elija als nächsten Bezugspunkt. Eine stärkere pneumatologische Festlegung wäre eine unnötige Vereindeutigung.
- issue: Sinn von פי שנים
  choice: Als Mengenangabe »doppelt so viele« wiedergegeben, mit Hinweis auf die wörtliche Knappheit.
  alternative: »einen doppelten Anteil« oder verbal »er verdoppelte«.
  rationale: Die Formulierung lässt einen Anklang an Elischas doppelten Anteil erkennen, nennt hier aber unmittelbar Zeichen. Die gewählte Fassung wahrt diesen Anklang, ohne einen nicht ausdrücklich genannten Gegenstand einzusetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Namen folgen den im Deutschen üblichen Formen »Elija« und »Elischa«. Die rätselhafte »Schatzkammer« und die gedrängte Aussage über das Doppelte werden nicht stillschweigend geglättet; notwendige textkritische und lexikalische Hinweise stehen in den Fußnoten.
