translation:
  language: de
  text: Da riefen sie zu Gott, dem Höchsten,[a] und breiteten ihre Hände zu ihm hin aus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Parallelüberlieferung fährt fort: „Und der Heilige erhörte sie rasch vom Himmel her und rettete sie durch Jesaja.“'
    reason: alternative_reading
lexical_decisions:
- source_word: ויקראו
  choice: Da riefen sie
  rationale: קרא bezeichnet hier das an Gott gerichtete Rufen im Gebet. „Riefen“ ist natürlich und lässt die im Zusammenhang mögliche Dringlichkeit erkennen, ohne sie durch „schrien“ zu überzeichnen.
- source_word: אל אל עליון
  choice: zu Gott, dem Höchsten
  rationale: Das erste אֶל ist die Präposition „zu“, das zweite אֵל bezeichnet Gott, und עֶלְיוֹן ist der appositionelle Gottestitel „der Höchste“. Die deutsche Apposition gibt die kompakte hebräische Fügung klar wieder.
- source_word: ויפרשו
  choice: und breiteten ... aus
  rationale: פרש bezeichnet hier das Ausbreiten beziehungsweise Ausstrecken der Hände als Gebetsgeste. „Die Hände ausbreiten“ ist im Deutschen idiomatisch und bildhaft.
- source_word: כפים
  choice: ihre Hände
  rationale: כפים kann genauer die Handflächen bezeichnen; bei dieser Gebetshaltung ist „Hände“ jedoch die natürliche deutsche Wiedergabe.
- source_word: אליו
  choice: zu ihm
  rationale: Die Präposition bezeichnet die Ausrichtung der Gebetsgeste auf Gott. „Zu ihm“ bewahrt die Formulierung des Hebräischen knapp und verständlich.
theological_decisions:
- issue: Hebräischer Text gegenüber der längeren griechischen Parallelüberlieferung
  choice: Nur den erhaltenen hebräischen Satz im Haupttext wiedergeben; den griechischen Zusatz in einer Fußnote dokumentieren.
  alternative: 'Den griechischen Zusatz in den Haupttext aufnehmen: „Und der Heilige erhörte sie schnell vom Himmel und rettete sie durch Jesaja.“'
  rationale: Der vorhandene hebräische Text ist für den Haupttext maßgeblich. Die längere griechische Überlieferung ist textgeschichtlich bedeutsam, darf aber nicht stillschweigend in den hebräischen Wortlaut eingetragen werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Da“ setzt die Handlung erzählerisch fort. Die traditionelle, aber weiterhin verständliche Gebetsgeste „die Hände ausbreiten“ bleibt anschaulich erhalten.
