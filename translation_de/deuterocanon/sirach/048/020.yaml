  source_fidelity: 'Der Haupttext gibt den erhaltenen hebräischen Wortlaut vollständig und treffend wieder: Gebetsanrufung an „Gott, den Höchsten“ sowie das Ausbreiten der Hände zu ihm hin. Die längere griechische Überlieferung bleibt zutreffend auf die Fußnote beschränkt.'
  naturalness: „Die Hände zu ihm ausbreiten“ ist verständlich, wirkt im heutigen Standarddeutsch jedoch syntaktisch etwas unvollständig. „Die Hände zu ihm hin ausbreiten“ ist idiomatischer und wahrt die gerichtete Gebetsgeste. In der Fußnote ist „rasch vom Himmel her“ klarer als die potenziell mehrdeutige Stellung von „schnell vom Himmel“.
  terminology: „Gott, dem Höchsten“ gibt אֵל עֶלְיוֹן angemessen als Gottesbezeichnung wieder. „Der Heilige“ und „Jesaja“ in der Fußnote entsprechen dem griechischen Paralleltext; es werden keine theologischen Deutungen ergänzt.
