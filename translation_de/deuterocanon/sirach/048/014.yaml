translation:
  language: de
  text: Zu seinen Lebzeiten tat er Wunder, und in seinem Tod waren seine Taten staunenswert.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, dem Griechischen enger folgend: »Und an seinem Ende waren seine Taten wunderbar.« Im Hebräischen steht »in seinem Tod«; die Formulierung des letzten Satzteils ist dort etwas schwierig. Das Griechische bestätigt den Sinn von staunenswerten Taten, die mit seinem Tod verbunden sind.'
    reason: alternative_reading
lexical_decisions:
- source_word: בחייו
  choice: Zu seinen Lebzeiten
  rationale: Die Präposition ב bezeichnet hier den Zeitraum von Elischas Leben. Die Formulierung ist im modernen Deutsch natürlich und entspricht dem griechischen ἐν ζωῇ αὐτοῦ.
- source_word: עשה
  choice: tat
  rationale: עשה ist das gewöhnliche Verb für »tun/machen«. Zusammen mit »Wunder« bewahrt »tat« die schlichte Ausdrucksweise des Hebräischen.
- source_word: נפלאות
  choice: Wunder
  rationale: Das Wort bezeichnet außergewöhnliche, wunderbare Taten. »Wunder« ist prägnant und wird durch das griechische τέρατα gestützt.
- source_word: ובמותו
  choice: und in seinem Tod
  rationale: Die Wiedergabe folgt bewusst dem erhaltenen hebräischen Wortlaut. Das Griechische hat allgemeiner »an seinem Ende«; diese Variante wird in der Fußnote genannt.
- source_word: תמהי
  choice: staunenswert
  rationale: Die hebräische Form ist schwierig, bezeichnet im Zusammenhang jedoch etwas Staunen Erregendes. Das griechische θαυμάσια bestätigt diesen Sinn.
- source_word: מעשה
  choice: seine Taten
  rationale: Die formal singularische beziehungsweise kollektiv gebrauchte Form wird durch den griechischen Plural τὰ ἔργα αὐτοῦ verdeutlicht. »Taten« passt im Deutschen natürlich zu den außergewöhnlichen Handlungen im Kontext.
theological_decisions:
- issue: Vorrang des hebräischen Zeugen bei einer schwierigen Schlussformulierung
  choice: Der Haupttext folgt »in seinem Tod« aus dem Hebräischen und gibt die Schlussaussage als »seine Taten [waren] staunenswert« wieder.
  alternative: 'Dem Griechischen enger folgen: »und an seinem Ende waren seine Taten wunderbar«; oder den formalen Singular des Hebräischen als »seine Tat« wiedergeben.'
  rationale: Der erhaltene hebräische Text bleibt Grundlage. Wegen der schwierigen Form תמהי und des kollektiv deutbaren מעשה dient das Griechische zur Bestätigung des Sinns, ohne die abweichende Zeitangabe des Hebräischen im Haupttext zu ersetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Zu seinen Lebzeiten« ist idiomatisch, während »in seinem Tod« die auffällige und theologisch offene Formulierung des hebräischen Zeugen bewusst bewahrt.
