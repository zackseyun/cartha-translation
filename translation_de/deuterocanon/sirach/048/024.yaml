    reason: lexical_alternative
lexical_decisions:
- source_word: ברוח גבורה
  choice: Durch einen Geist der Kraft
  rationale: Die Präposition ב kann hier das Mittel oder den Wirkungsbereich bezeichnen. „Durch“ wahrt den instrumentalen Sinn; „Geist der Kraft“ gibt גבורה als Stärke oder Macht wieder, ohne den Geist ausdrücklich mit dem Geist Gottes gleichzusetzen.
- source_word: חזה
  choice: schaute er
  rationale: חזה bezeichnet ein Sehen, häufig mit prophetischem oder visionärem Klang. „Schaute“ bewahrt diesen Unterton, ohne ihn erklärend auszubauen.
- source_word: אחרית
  choice: das Ende
  rationale: אחרית kann das Ende, den Ausgang oder die Zukunft bezeichnen. „Das Ende“ folgt dem Hebräischen knapp und entspricht zugleich dem griechischen τὰ ἔσχατα, ohne die zeitliche Bedeutung einseitig als „Zukunft“ festzulegen.
- source_word: וינחם
  choice: und er tröstete
  rationale: Die Form von נחם hat hier den Sinn des Tröstens. Die gewählte Formulierung ist direkt, natürlich und entspricht dem griechischen παρεκάλεσεν im Kontext.
- source_word: אבלי ציון
  choice: die Trauernden Zions
  rationale: Die hebräische Status-constructus-Verbindung lässt offen, ob sie um Zion trauern oder zu Zion gehören. „Die Trauernden Zions“ erhält diese knappe Mehrdeutigkeit; die örtliche Lesart des Griechischen wird in der Fußnote genannt.
theological_decisions:
- issue: Art der prophetischen Inspiration in ברוח גבורה
  choice: Durch einen Geist der Kraft
  alternative: In einem großen Geist
  rationale: Der hebräische Hauptzeuge spricht von einem durch Kraft gekennzeichneten Geist, während das Griechische „in einem großen Geist“ bietet. Der Haupttext folgt dem Hebräischen und lässt offen, wie genau dieser Geist theologisch zu bestimmen ist; die griechische Lesart wird dokumentiert.
- issue: Bezug der Trauernden auf Zion
  choice: die Trauernden Zions
  alternative: die in Zion Trauernden
  rationale: Das Hebräische kann eine Zugehörigkeit zu Zion oder Trauer um Zion ausdrücken; das Griechische formuliert ausdrücklich örtlich. Die Hauptfassung wahrt die Mehrdeutigkeit des hebräischen Textes.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Schaute“ trägt den prophetisch-visionären Unterton von חזה; Satzbau und Wortwahl bleiben knapp und poetisch. Sämtliche Fußnotenmarker stehen unmittelbar bei der jeweils erläuterten Wendung.
