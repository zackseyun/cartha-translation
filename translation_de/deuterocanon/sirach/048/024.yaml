translation:
  language: de
  text: Durch einen Geist der Kraft schaute er das Ende[a], und er tröstete die Trauernden Zions[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Griechisch: „In einem großen Geist sah er die letzten Dinge.“ Der hebräische Text lautet: „Durch einen Geist der Kraft schaute er das Ende.“'
    reason: alternative_reading
  - marker: b
