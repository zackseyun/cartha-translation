  text: Happy is the one who saw you and died[a], and happy are you, for you will surely live.
translation:
  language: de
  text: Glücklich, wer dich sah und starb;[a] und glücklich bist du, denn du wirst ganz gewiss leben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Parallelfassung lautet: „Glücklich sind, die dich sahen und die mit Liebe geschmückt sind; denn auch wir werden leben.“ Der hebräische Text liest stattdessen: „Und glücklich bist du, denn du wirst ganz gewiss leben.“'
    reason: alternative_reading
lexical_decisions:
- source_word: אשרי
  choice: Glücklich
  rationale: Die hebräische Seligpreisungsformel bezeichnet einen Menschen als glücklich beziehungsweise beneidenswert gesegnet. „Glücklich“ ist im heutigen Deutsch natürlich und bewahrt den ausrufartigen Charakter.
- source_word: ראך
  choice: wer dich sah
  rationale: Das Qal-Perfekt von ראה mit Suffix der 2. Person Singular wird schlicht wiedergegeben; angesprochen ist Elija.
- source_word: ומת
  choice: und starb
  rationale: Die Konjunktion mit dem Perfekt wird formal offen wiedergegeben, ohne ein im Hebräischen nicht ausdrücklich vorhandenes „obwohl“ oder „danach“ einzutragen.
- source_word: ואשריך
  choice: und glücklich bist du
  rationale: Das Suffix verlangt eine direkte Anrede in der 2. Person Singular. Die neue Seligpreisung wahrt den Parallelismus.
- source_word: כי
  choice: denn
  rationale: „Denn“ gibt die begründende Funktion der Partikel hier natürlich und ohne unnötige Festlegung wieder.
- source_word: חיה תחיה
  choice: du wirst ganz gewiss leben
  rationale: Die Verbindung von Infinitivus absolutus und finitem Verb verstärkt die Aussage. „Ganz gewiss“ bringt diese emphatische Konstruktion in natürlichem Deutsch zum Ausdruck.
theological_decisions:
- issue: Verhältnis der hebräischen und griechischen Textform
  choice: Der erhaltene hebräische Text steht im Haupttext; die deutlich abweichende griechische Parallelfassung wird in einer Fußnote dokumentiert.
  alternative: 'Die griechische Fassung könnte als Haupttext übersetzt werden: „Glücklich sind, die dich sahen und die mit Liebe geschmückt sind; denn auch wir werden leben.“'
  rationale: Da für diesen Vers ein als zuverlässig bewerteter hebräischer Zeuge vorliegt, bildet er die primäre Grundlage. Die erhebliche Abweichung der griechischen Überlieferung ist jedoch textgeschichtlich und inhaltlich bedeutsam und darf nicht stillschweigend übergangen werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe poetische Parallelstruktur und die direkte Anrede bleiben erhalten. Das Semikolon verdeutlicht die zwei parallelen Seligpreisungen; der Fußnotenmarker steht an der Stelle, an der die griechische Fassung vom hebräischen Haupttext abzuweichen beginnt.
