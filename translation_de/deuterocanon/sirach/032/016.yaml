  text: One who fears Yahweh will understand judgment[d][c][b][a], and from the dawn he will bring forth wise sayings from his heart.
translation:
  language: de
  text: Wer Jahwe fürchtet, wird das Urteil verstehen[a] und bei Tagesanbruch[b] weise Worte aus seinem Herzen hervorbringen.[c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die hebräischen Textzeugen unterscheiden sich: Einige haben „das Urteil“, andere „sein Urteil“.'
    reason: alternative_reading
  - marker: b
    text: Der hebräische Ausdruck ist unsicher. Er kann „bei Tagesanbruch“ oder „früh“ bedeuten, möglicherweise aber auch allgemeiner auf die Morgen- oder Abenddämmerung verweisen.
    reason: lexical_alternative
  - marker: c
    text: 'Eine andere hebräische Fassung lautet: „Die Jahwe fürchten, werden sein Urteil verstehen und es mit großer Weisheit aus ihrem Herzen hervorbringen.“'
    reason: textual_variant
  - marker: d
    text: Der erhaltene griechische Paralleltext hat einen wesentlich anderen Wortlaut und bezeugt hier offenbar eine abweichende Texttradition.
    reason: textual_variant
lexical_decisions:
- source_word: ירא יהוה
  choice: Wer Jahwe fürchtet
  rationale: Die erste hebräische Fassung hat eine repräsentative Singularform. Die deutsche Relativkonstruktion ist natürlich und bewahrt den Sinn der Gottesfurcht.
- source_word: יבין
  choice: wird … verstehen
  rationale: בין bezeichnet hier das Verstehen beziehungsweise Erkennen; „verstehen“ ist im Weisheitskontext klar und idiomatisch.
- source_word: משפט
  choice: das Urteil
  rationale: משפט kann Recht, gerechte Entscheidung oder Urteil bedeuten. „Das Urteil“ hält den konkreten Sinn offen; die Variante משפטו („sein Urteil“) wird in der Fußnote genannt.
- source_word: מנשף
  choice: vom Morgengrauen an
  rationale: נשף kann je nach Zusammenhang Morgen- oder Abenddämmerung bezeichnen. Hier folgt die Übersetzung der möglichen zeitlichen Bedeutung „von früher Morgenstunde an“, ohne die Unsicherheit zu verschweigen.
- source_word: ותחבולום … יוציא
  choice: wird er kluge Gedanken hervorbringen
  rationale: Die überlieferte Wortform ist schwierig, weist aber im Weisheitszusammenhang wahrscheinlich auf überlegte Gedanken, Ratschläge oder Weisheitssprüche. „hervorbringen“ bewahrt das Bild des Herausbringens in יוציא.
- source_word: מלבם
  choice: aus ihrem Herzen
  rationale: Diese Lesart steht in der abweichenden hebräischen Fassung. „Herz“ bewahrt die hebräische Vorstellung vom Inneren als Sitz des Denkens und Wollens und wird in der Variantenfußnote wörtlich wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird als „Jahwe“ wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- issue: Textgrundlage bei stark abweichender griechischer Überlieferung
  choice: Die erhaltene hebräische Fassung bildet die Grundlage; die griechische Abweichung wird vermerkt.
  alternative: Den griechischen Text übersetzen oder beide Überlieferungen harmonisieren
  rationale: Da für diese Stelle hebräisches Textmaterial erhalten ist, bleibt es die primäre Grundlage. Der griechische Paralleltext bezeugt offenbar eine deutlich andere Texttradition und wird nicht mit dem Hebräischen vermischt.
- issue: Numerus der Gottesfürchtigen
  choice: Repräsentativer Singular nach der ersten hebräischen Fassung
  alternative: Plural nach der zweiten hebräischen Fassung
  rationale: Die beiden hebräischen Fassungen wechseln zwischen Singular und Plural. Der Haupttext folgt dem Singular der ersten Fassung; die pluralische Fassung erscheint vollständig in einer Fußnote.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die schwer verständliche hebräische Wendung wird knapp und natürlich wiedergegeben; ihre lexikalische Unsicherheit sowie die abweichende zweite hebräische Fassung bleiben durch Fußnoten sichtbar.
