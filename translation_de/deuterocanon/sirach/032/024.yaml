  yaml_path: translation/deuterocanon/sirach/032/024.yaml
  text: He who keeps the law guards his life[a], and he who trusts in Yahweh will not be put to shame.
translation:
  language: de
  text: Wer die Weisung bewahrt, bewahrt sein Leben[a]; und wer auf den HERRN vertraut, wird nicht zuschanden werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Überlieferung hat an dieser Stelle einen wesentlich anderen Text: »bis er einem Menschen nach seinen Taten vergilt und die Werke der Menschen nach ihren Gedanken«. Der Haupttext folgt hier dem erhaltenen hebräischen Zeugen.'
    reason: textual_variant
lexical_decisions:
- source_word: נוצר תורה
  choice: die Weisung bewahrt
  rationale: נצר bezeichnet sorgfältiges Bewahren oder Befolgen. תורה kann »Gesetz« bedeuten, umfasst hier aber auch Gottes Unterweisung; »Weisung« erhält diese Bedeutungsbreite, ohne den verbindlichen Charakter abzuschwächen.
- source_word: שומר נפשו
  choice: bewahrt sein Leben
  rationale: נפש bezeichnet hier das Leben beziehungsweise die eigene Person, nicht eine vom Körper getrennte »Seele«. Die Wiederholung von »bewahrt« gibt den Parallelismus der beiden verwandten Schutzverben נצר und שמר natürlich wieder.
- source_word: ובוטח ביהוה
  choice: und wer auf den HERRN vertraut
  rationale: Die partizipiale Form wird als allgemeine Aussage wiedergegeben. בטח bedeutet hier vertrauensvolles Sichverlassen auf jemanden; יהוה wird nach der üblichen jüdisch-biblischen Lesetradition mit »der HERR« wiedergegeben.
- source_word: לא יבוש
  choice: wird nicht zuschanden
  rationale: בוש kann Scham, enttäuschte Hoffnung und das Scheitern gesetzten Vertrauens bezeichnen. »Nicht zuschanden werden« bewahrt diese biblische Bedeutungsweite und passt unmittelbar zum Vertrauen auf den HERRN.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: der HERR
  alternative: JHWH / Jahwe
  rationale: »Der HERR« folgt der überlieferten jüdischen Lesepraxis und der verbreiteten deutschen Bibeltradition, ohne eine unsichere Aussprache des Namens festzuschreiben.
- issue: Erhebliche Abweichung zwischen hebräischem und griechischem Text
  choice: Der Haupttext folgt dem erhaltenen hebräischen Zeugen; die griechische Fassung wird in einer Fußnote dokumentiert.
  alternative: 'Dem griechischen Text folgen: »bis er einem Menschen nach seinen Taten vergilt und die Werke der Menschen nach ihren Gedanken«'
  rationale: Da ein belastbarer hebräischer Text vorliegt, bildet er die Grundlage der Übersetzung. Die griechische Überlieferung bietet hier jedoch einen ganz anderen Spruch und darf deshalb weder harmonisiert noch verschwiegen werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der knappe Parallelismus des Hebräischen bleibt erhalten. »Weisung« wahrt die Bedeutungsbreite von תורה; »zuschanden werden« ist bewusst bibelsprachlich, aber im heutigen Deutsch noch verständlich.
