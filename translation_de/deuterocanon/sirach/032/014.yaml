  text: One who seeks what pleases God will accept instruction[a], and the one who seeks him early will receive an answer through his prayer.
translation:
  language: de
  text: Wer nach dem sucht, was Gott will, nimmt Belehrung an[a]; und Gott wird ihm in seinem Gebet antworten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Überlieferung lautet: »Biete keine Bestechungsgaben an, denn er wird sie nicht annehmen.« Der erhaltene hebräische Text weicht hier erheblich vom griechischen ab.'
    reason: textual_variant
lexical_decisions:
- source_word: דורש חפצי אל
  choice: Wer danach sucht, was Gott gefällt
  rationale: Die komprimierte hebräische Fügung bezeichnet jemanden, der fortwährend nach Gottes Wohlgefallen beziehungsweise Willen sucht. Die deutsche Formulierung ist natürlich und vermeidet die missverständliche Rede von »Gottes Wünschen«.
- source_word: יקח לקח
  choice: nimmt Unterweisung an
  rationale: Wörtlich »nimmt Lehre/Unterweisung«; die Wendung meint das bereitwillige Empfangen von Belehrung. »Unterweisung annehmen« bewahrt sowohl Inhalt als auch weisheitlichen Ton.
- source_word: ומשחרהו
  choice: und wer ihn früh sucht
  rationale: שחר kann das frühe und dadurch zugleich eifrige Suchen ausdrücken. »früh sucht« erhält die zeitliche Bildlichkeit, ohne sie auf bloßen Fleiß zu reduzieren; das Pronomen bezieht sich wahrscheinlich auf Gott.
- source_word: ישיג מענה
  choice: wird … Antwort erhalten
  rationale: Die Wendung bedeutet wörtlich »eine Antwort erlangen«. »Antwort erhalten« ist gegenwärtiges, idiomatisches Deutsch.
- source_word: ויענהו בתפלתו
  choice: wird durch sein Gebet Antwort erhalten
  rationale: Die Präposition kann Mittel oder Bereich bezeichnen. »durch sein Gebet« verbindet die Antwort mit dem Gebet, ohne ihre genaue Weise weiter festzulegen.
- source_word: μὴ δωροκόπει, οὐ γὰρ προσδέξεται
  choice: nicht in den Haupttext übernommen
  rationale: 'Die griechische Überlieferung weicht grundlegend vom erhaltenen Hebräisch ab: »Versuche nicht zu bestechen, denn er wird es nicht annehmen.« Da der hebräische Text vorhanden ist, bildet er die Grundlage; die gewichtige griechische Variante wird in der Fußnote dokumentiert.'
theological_decisions:
- issue: Starke Abweichung zwischen hebräischer und griechischer Textüberlieferung
  choice: Der erhaltene hebräische Wortlaut steht im Haupttext; die griechische Lesart erscheint als Textvariante in der Fußnote.
  alternative: 'Nach der griechischen Überlieferung übersetzen: »Versuche nicht zu bestechen, denn er wird es nicht annehmen.«'
  rationale: Der hebräische Zeuge spricht vom Suchen nach Gottes Wohlgefallen, von Unterweisung und Gebet, während der griechische Text vor Bestechung warnt. Diese Spannung darf nicht harmonisiert werden; der hebräische Ausgangstext bleibt maßgeblich, die deutlich andere griechische Tradition wird offengelegt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem weisheitlichem Ton. Die parallele Satzstruktur des Hebräischen bleibt erhalten; »früh sucht« bewahrt bewusst die konkrete und zugleich hingebungsvolle Nuance des hebräischen Verbs.
