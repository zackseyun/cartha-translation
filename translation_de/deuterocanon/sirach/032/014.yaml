- from: Wer danach sucht, was Gott gefällt, nimmt Unterweisung an[a]; und wer ihn früh sucht, wird durch sein Gebet Antwort erhalten.
  to: Wer nach dem sucht, was Gott will, nimmt Belehrung an[a]; und Gott wird ihm in seinem Gebet antworten.
  rationale: Die Revision übersetzt den nach der Versnummer überlieferten hebräischen Text von Sirach 32,14 ohne Einmischung des vorangehenden Verses. Die Subjektzuweisung im zweiten Satz macht die im Kontext naheliegende Gottesreferenz verständlich; eine konfessionelle Deutung wird dadurch nicht eingeführt. Die stark abweichende griechische Tradition bleibt vollständig als Textvariante dokumentiert.
