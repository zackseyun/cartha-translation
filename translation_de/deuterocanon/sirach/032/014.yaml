    issue: Vermischung von zwei getrennten hebräischen Textabschnitten
    rationale: Der Entwurf übernimmt »wer ihn früh sucht« aus dem Text vor der Versnummer (Vers 13) und lässt dafür den Schluss von Vers 14, ויענהו בתפלתו, zu einer bloßen Angabe des Mittels umformen. Der Text von Vers 14 selbst enthält weder ומשחרהו noch ישיג מענה.
  - severity: medium
    issue: Aktive Antworthandlung wird abgeschwächt
    rationale: ויענהו בתפלתו lautet wörtlich etwa »und er wird ihm in seinem Gebet antworten«. »wird durch sein Gebet Antwort erhalten« unterdrückt den im Hebräischen vorhandenen Antwortenden und verändert die Satzstruktur.
  - severity: low
    issue: Formulierung der griechischen Variante
    rationale: Die griechische Lesart spricht konkret vom Darbringen von Bestechungsgaben. »Biete keine Bestechungsgaben an« ist genauer als »Versuche nicht zu bestechen«.
