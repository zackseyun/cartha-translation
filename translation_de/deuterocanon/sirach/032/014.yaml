  source_fidelity: 'Der Entwurf folgt zwar dem englischen Audittext, vermischt aber den vor der Versnummer stehenden hebräischen Wortlaut mit Vers 14. Für Sirach 32,14 ist der nach der Versnummer überlieferte Text maßgeblich: דורש חפצי אל יקח לקח, ויענהו בתפלתו. Daher gehören »wer ihn früh sucht« und »Antwort erhalten« nicht in den Haupttext dieses Verses. Das abschließende Hebräisch besagt aktiv, dass ihm in seinem Gebet geantwortet wird; die impliziten Bezüge sind nicht völlig eindeutig.'
  naturalness: »Wer nach dem sucht, was Gott will, nimmt Belehrung an« ist modernes, verständliches Standarddeutsch mit angemessenem Weisheitsregister. »Gott wird ihm in seinem Gebet antworten« ist idiomatisch und gibt die aktive Verbform klar wieder.
  terminology: »Belehrung« gibt לקח hier gut wieder. »Was Gott will« ist für חפצי אל natürlich und weniger umständlich als die bisherige Formulierung. Die griechische Variante sollte von Bestechungsgaben sprechen, nicht allgemein von einem Versuch zu bestechen.
  issues:
