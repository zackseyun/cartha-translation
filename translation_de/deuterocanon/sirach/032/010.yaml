  text: Vor dem Hagel leuchtet der Blitz auf, und vor der Schande zeigt sich Gunst[a].[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Gnade“ oder „Anmut“ (hebräisch חֵן).'
    reason: lexical_alternative
  - marker: b
    text: 'Die griechische Parallelüberlieferung lautet wesentlich anders: „Mit einem guten Auge verherrliche den Herrn, und schmälere nicht die Erstlingsgabe deiner Hände.“ Der Haupttext folgt hier dem erhaltenen hebräischen Zeugnis.'
    reason: alternative_reading
lexical_decisions:
- source_word: לִפְנֵי
  choice: vor
  rationale: 'Die Präposition bezeichnet in beiden Satzhälften eine zeitliche Abfolge: Das eine tritt vor dem anderen ein.'
- source_word: בָרָד
  choice: Hagel
  rationale: Die übliche und im Wetterbild eindeutige deutsche Entsprechung.
- source_word: יִנְצַח
  choice: fährt … hervor / tritt … hervor
  rationale: Im vorliegenden Zusammenhang ist das Verb am besten als Hervortreten oder vorheriges Erscheinen zu verstehen, nicht als „siegen“. Die unterschiedliche deutsche Formulierung entspricht den natürlichen Verbindungen mit „Blitz“ und „Gunst“, während „hervor“ die Parallelität wahrt.
- source_word: בָּרָק
  choice: Blitz
  rationale: Die reguläre Bezeichnung für den Blitz; sie bildet mit „Hagel“ das meteorologische Bild.
- source_word: בוֹשׁ
  choice: Schande
  rationale: Das Wort bezeichnet Scham oder Schande. „Schande“ passt hier besonders zur öffentlichen beziehungsweise sozialen Gegenüberstellung mit Gunst.
- source_word: חֵן
  choice: Gunst
  rationale: חֵן kann Gunst, Anmut oder Gnade bezeichnen. „Gunst“ bewahrt hier den sozialen Sinn des Weisheitsspruchs und vermeidet eine unnötige dogmatische Aufladung.
theological_decisions:
- issue: Wiedergabe von חֵן im Weisheitskontext
  choice: Gunst
  alternative: Gnade oder Anmut
  rationale: Der Zusammenhang handelt nicht ausdrücklich von heilsmittlerischer Gnade. „Gunst“ lässt den sozialen und ethischen Sinn erkennen, ohne andere mögliche Bedeutungsnuancen des hebräischen Wortes auszuschließen.
- issue: Stark abweichende griechische Parallelüberlieferung
  choice: Der erhaltenen hebräischen Fassung folgen
  alternative: 'Griechisch: „Mit einem guten Auge verherrliche den Herrn, und schmälere nicht die Erstlingsgabe deiner Hände.“'
  rationale: Da ein hoch sicher bezeugter hebräischer Text vorliegt und die griechische Fassung inhaltlich grundlegend abweicht, bildet die hebräische Überlieferung den Haupttext; die griechische Lesart wird transparent in einer Fußnote dokumentiert.
translation_notes:
  register: Modernes, gehobenes Standarddeutsch mit knapper, sprichwortartiger Parallelstruktur. Die Wiederaufnahme von „hervor“ bewahrt die formale Entsprechung der beiden hebräischen Satzhälften; „fährt“ beim Blitz und „tritt“ bei der Gunst sorgen zugleich für idiomatisches Deutsch.
