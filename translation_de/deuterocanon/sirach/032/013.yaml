base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/032/013.yaml
  text: For all these things bless your Maker[a], who fills you with his goodness. He who seeks the law will obtain favor[c][b], but the hypocrite will be caught by it.
translation:
  language: de
  text: Für all dies preise deinen Schöpfer[a], der dich mit seiner Güte erfüllt. Wer Gott sucht, hofft auf Wohlgefallen[b]; wer sich aber selbst etwas vormacht, verfängt sich darin[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hebräische Textzeuge weicht hier erheblich vom Griechischen ab. Dort heißt es: „Denn der Herr vergilt, und er wird dir siebenfach vergelten.“ In der hebräischen Ausgabe steht die Verszahl 13 erst vor dem folgenden Satz; der erste Satz kann daher noch zum vorhergehenden Vers gehören.'
    reason: textual_variant
  - marker: b
    text: 'Wörtlich etwa: „Wer Gott sucht, wird auf Wohlgefallen hoffen.“ Das Hebräische ist schwierig; אל kann auch anders aufgefasst werden. Im Zusammenhang ist daher auch eine Deutung auf die Suche nach göttlicher Weisung oder dem Gesetz möglich.'
    reason: alternative_reading
  - marker: c
    text: Das hier übersetzte Wort ist unsicher. Möglich sind auch Bezeichnungen wie „der Prahler“, „der Verblendete“ oder „der Heuchler“. Ebenso ist der Bezug von „darin“ nicht völlig eindeutig.
    reason: lexical_alternative
lexical_decisions:
- source_word: ברך עושך
  choice: preise deinen Schöpfer
  rationale: ברך bezeichnet hier das lobende Segnen Gottes. „Preise“ ist im heutigen Deutsch natürlicher, während „Schöpfer“ die persönliche Beziehung des Suffixes in עושך knapp bewahrt.
- source_word: המרוך מטובתו
  choice: der dich mit seiner Güte erfüllt
  rationale: Die Formulierung des zusammengesetzten hebräischen Textzeugen ist nicht ganz sicher; sie beschreibt jedoch, dass der Schöpfer den Angeredeten reichlich an seiner Güte teilhaben lässt. Die Wiedergabe bleibt nah am vorliegenden Sinn, ohne ihn zu überdehnen.
- source_word: דורש אל
  choice: Wer Gott sucht
  rationale: אל kann im überlieferten hebräischen Wortlaut am unmittelbarsten als „Gott“ verstanden werden. Anders als die englische Konsultationsfassung wird daher nicht stillschweigend „das Gesetz“ ergänzt.
- source_word: יקוה רצון
  choice: darf auf Wohlgefallen hoffen
  rationale: יקוה bedeutet „hoffen, erwarten“, רצון „Wohlgefallen, Gunst“. „Darf … hoffen“ gibt die zuversichtliche Erwartung idiomatisch wieder, ohne sie zu einem sicheren Erhalt umzudeuten.
- source_word: ומתלהלה
  choice: wer sich aber selbst etwas vormacht
  rationale: Die seltene oder unsichere Form bezeichnet im antithetischen Zusammenhang wahrscheinlich einen verblendeten, prahlerischen oder unaufrichtigen Menschen. Die deutsche Formulierung hält den Gedanken der Selbsttäuschung fest, ohne die enger belegungsbedürftige Bezeichnung „Heuchler“ festzuschreiben.
- source_word: יוקש בו
  choice: verfängt sich darin
  rationale: Das Verb bezeichnet das Gefangen- oder Verstricktwerden. „Darin“ bewahrt die Unbestimmtheit des hebräischen Pronomens, dessen Bezug nicht völlig eindeutig ist.
theological_decisions:
- issue: Hebräischer Text gegenüber der stark abweichenden griechischen Überlieferung
  choice: Der Haupttext folgt dem erhaltenen hebräischen Zeugnis; die griechische Lesart wird in einer Fußnote vollständig mitgeteilt.
  alternative: 'Dem Griechischen folgen: „Denn der Herr vergilt, und er wird dir siebenfach vergelten.“'
  rationale: Wo ein hebräischer Sirach-Text erhalten ist, hat er für diese Übersetzung Vorrang. Da die griechische Überlieferung hier einen inhaltlich ganz anderen Vers bietet, darf diese Spannung nicht harmonisiert oder verschwiegen werden.
- issue: Deutung von אל
  choice: „Gott“
  alternative: „das Gesetz“ beziehungsweise „göttliche Weisung“
  rationale: Der überlieferte Konsonantentext lässt die direkte Lesung „Gott“ zu. Eine Wiedergabe als „Gesetz“ wäre eine kontextuelle Konjektur und wird deshalb nur als mögliche Deutung in der Fußnote genannt.
- issue: Aussage über רצון
  choice: Hoffnung auf Wohlgefallen
  alternative: sicheres Erlangen von Gunst
  rationale: Die Verbform drückt zunächst Hoffnung oder Erwartung aus. Die Übersetzung vermeidet es, aus dieser Hoffnung ohne zwingenden sprachlichen Grund eine garantierte Zuerkennung zu machen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Preise“ und „Wohlgefallen“ erhalten einen bibelnahen Ton, bleiben aber verständlich. Die schwierigen Stellen werden nicht konfessionell festgelegt; insbesondere wird אל im Haupttext als „Gott“ übersetzt und die mögliche Deutung als Weisung oder Gesetz in der Fußnote offengehalten.
