translation:
  language: de
  text: Wenn es Zeit zum Aufbruch ist, zögere nicht; geh nach Hause und erfülle deinen Wunsch.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und tu, was dir gefällt“. Das Hebräische sagt nicht ausdrücklich, wessen Wunsch oder Wille gemeint ist; רצון kann auch „Wohlgefallen“ oder „Gunst“ bedeuten.'
    reason: Präzisiert die semantische Offenheit von רצון und ersetzt die unidiomatische Formulierung „erfülle das Wohlgefallen“.
lexical_decisions:
- source_word: בעת מפקד
  choice: Wenn es Zeit zum Aufbruch ist
  rationale: מפקד bezeichnet hier im Zusammenhang des Gastmahls den Zeitpunkt des Sich-Verabschiedens bzw. Aufbruchs; die zeitliche Wendung בעת wird natürlich mit „wenn es Zeit … ist“ wiedergegeben.
- source_word: אל תתאחר
  choice: zögere nicht
  rationale: Das Verb bedeutet, sich zu verspäten oder länger als angebracht zu verweilen; „zögere nicht“ ist knapp und idiomatisch.
- source_word: פטר לביתך
  choice: geh nach Hause
  rationale: פטר trägt hier den Sinn, sich zu entfernen bzw. aufzubrechen; לביתך gibt das Ziel „zu deinem Haus/nach Hause“ an.
- source_word: ושלם רצון
  choice: und erfülle deinen Wunsch
  rationale: שלם heißt „vollenden, erfüllen“, רצון „Wille, Wunsch, Wohlgefallen“. Die formal nähere Wiedergabe bewahrt die mögliche Mehrdeutigkeit besser als „tu, was dir gefällt“.
theological_decisions:
- issue: Bezug von רצון
  choice: deinen Wunsch
  alternative: was dir gefällt / Wohlgefallen
  rationale: Der hebräische Ausdruck nennt nicht ausdrücklich, wessen Wohlgefallen gemeint ist. Im unmittelbaren Zusammenhang liegt der eigene Wunsch nahe, doch die Formulierung sollte nicht stärker moralisch oder theologisch festgelegt werden als der Ausgangstext.
translation_notes:
  register: Kurze, würdige Mahnsprache in modernem Standarddeutsch. Der vorgelegte hebräische Text enthält vor dieser Verszeile offenbar noch Material des vorausgehenden Verses; übersetzt wurde entsprechend der angegebenen Referenz Sirach 32,11 die mit der hebräischen Verszahl יא markierte Zeile. Der stark abweichende griechische Paralleltext wurde nicht zur Ersetzung des gut bezeugten hebräischen Wortlauts herangezogen.
