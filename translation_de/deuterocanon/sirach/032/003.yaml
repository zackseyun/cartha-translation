  text: Speak[a], elder, for it is fitting for you; but with sound understanding[b], and do not hinder song.
translation:
  language: de
  text: Sprich, du Älterer, denn es ist dir angemessen; doch zeige dabei verständige Zurückhaltung[a] und halte den Gesang nicht auf.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die gedrängte hebräische Wendung kann auch mit „mit rechter Einsicht“, „sei bescheiden in deiner Einsicht“ oder „zeige kluge Zurückhaltung“ verstanden werden.
    reason: lexical_alternative
  - marker: b
