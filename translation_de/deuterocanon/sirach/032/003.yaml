    reason: textual_variant
lexical_decisions:
- source_word: מלל
  choice: Rede
  rationale: Der Imperativ bedeutet „sprechen, reden“. „Rede“ ist knapp, würdig und passt zur Aufforderung im Rahmen eines Festmahls.
- source_word: שב
  choice: Ältester
  rationale: Das Wort bezeichnet hier wahrscheinlich einen älteren, gesellschaftlich geachteten Mann. „Ältester“ bewahrt sowohl den Alters- als auch den Ehrenaspekt.
- source_word: כי הוא לך
  choice: denn es steht dir zu
  rationale: Die Wendung bezeichnet hier die Angemessenheit beziehungsweise das Vorrecht, in dieser Rolle zu sprechen. „Es steht dir zu“ gibt dies idiomatisch wieder.
- source_word: והצנא שכל
  choice: doch zeige dabei verständige Zurückhaltung
  rationale: Die hebräische Formulierung ist gedrängt und unsicher. Die Wiedergabe verbindet die wahrscheinliche Bedeutung von צנע, „zurückhaltend/bescheiden sein“, mit שכל, „Einsicht, verständiges Handeln“, ohne die Aussage auf bloßes Wissen zu verengen.
- source_word: ואל תמנע שיר
  choice: und halte den Gesang nicht auf
  rationale: מנע kann „zurückhalten, verhindern, hindern“ bedeuten. Im Festmahlkontext ist gemeint, dass die Rede den Gesang nicht behindern oder unterbrechen soll; „halte … nicht auf“ bleibt nahe am Bild und klingt natürlich.
theological_decisions:
- issue: Anrede שב im Weisheits- und Festmahlkontext
  choice: Ältester
  alternative: alter Mann; Betagter
  rationale: Die ehrenvolle soziale Stellung und nicht nur das biologische Alter soll hörbar bleiben. Die Wahl führt keine besondere Amtsbezeichnung ein, sondern gibt die respektvolle Anrede wieder.
- issue: Verhältnis von Rede, Einsicht und Zurückhaltung in והצנא שכל
  choice: verständige Zurückhaltung
  alternative: mit rechter Einsicht; sei bescheiden in deiner Einsicht
  rationale: Der komprimierte hebräische Ausdruck lässt mehrere syntaktische und lexikalische Deutungen zu. Die Hauptfassung bewahrt die Spannung zwischen dem Auftrag zu reden und der Mahnung, dies maßvoll und einsichtig zu tun; die Alternativen werden in der Fußnote offengelegt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Anrede „Ältester“ wahrt den respektvollen Ton des Weisheitsunterrichts; „halte den Gesang nicht auf“ ist im Festmahlkontext klar und natürlich. Die Unsicherheit der hebräischen Wendung והצנא שכל sowie die stark abweichende griechische Lesart werden ausdrücklich in den Fußnoten dokumentiert.
