  text: Like a gold ornament set with onyx and sapphire[c][b][a], so are beautiful words at a banquet of wine.
translation:
  language: de
  text: Wie ein goldener Halsschmuck, besetzt mit Onyx[a] und Saphir[b], so sind schöne Worte bei einem Weingelage.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Welcher Edelstein mit dem hebräischen Wort gemeint ist, lässt sich nicht sicher bestimmen; vorgeschlagen wurden unter anderem Karfunkel, Granat oder Türkis.
    reason: lexical_alternative
  - marker: b
    text: Der in antiken Texten als „Saphir“ bezeichnete Stein muss nicht genau dem heutigen Edelstein entsprechen; möglicherweise ist Lapislazuli gemeint.
    reason: lexical_alternative
  - marker: c
    text: Der zu diesem Vers angegebene griechische Paralleltext stimmt inhaltlich nicht mit dem hebräischen Wortlaut überein und scheint einer anderen Text- oder Verszuordnung zu folgen.
    reason: textual_variant
lexical_decisions:
- source_word: כרביד זהב
  choice: Wie ein goldener Halsschmuck
  rationale: רביד bezeichnet einen am Hals getragenen Schmuck, möglicherweise eine Kette. „Halsschmuck“ bewahrt das konkrete Bild, ohne die genaue Form stärker festzulegen, als es der hebräische Ausdruck erlaubt.
- source_word: נפך
  choice: Onyx
  rationale: Die genaue Bestimmung des antiken Edelsteins ist unsicher. „Onyx“ folgt einer verbreiteten traditionellen Wiedergabe; die Unsicherheit wird in einer Fußnote offengelegt.
- source_word: ספיר
  choice: Saphir
  rationale: „Saphir“ ist die herkömmliche Wiedergabe, obwohl der antike Stein möglicherweise Lapislazuli war. Eine Fußnote bewahrt diese lexikalische Unsicherheit.
- source_word: כך נאים דברים יפים
  choice: so sind schöne Worte
  rationale: Die Formulierung erhält den knappen Vergleich und die ästhetische Wertung des Hebräischen. נאים kann sowohl Schönheit als auch Angemessenheit ausdrücken; im Zusammenhang mit dem Schmuckbild liegt „schön“ nahe.
- source_word: על משתה היין
  choice: bei einem Weingelage
  rationale: „Weingelage“ bezeichnet natürlich und knapp ein geselliges Festmahl, das vom Wein geprägt ist, und gibt den sozialen Rahmen des hebräischen Ausdrucks wieder.
theological_decisions:
- issue: Textgrundlage angesichts des abweichenden griechischen Paralleltexts
  choice: Übersetzung nach dem erhaltenen hebräischen Ben-Sira-Text
  alternative: Dem angegebenen griechischen Text folgen, der vom Abstehen von Bosheit und Unrecht spricht
  rationale: Der hebräische Text ist an dieser Stelle zusammenhängend und mit hoher Sicherheit bezeugt. Der gelieferte griechische Paralleltext entspricht seinem Inhalt nach nicht diesem Vers und scheint einer anderen Verszuordnung oder Textüberlieferung anzugehören; daher bestimmt hier das Hebräische den Haupttext.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das konkrete Schmuckbild bleibt erhalten; „Halsschmuck“ vermeidet eine unnötige Festlegung auf Kette oder Halsband. „Weingelage“ ist gehoben, aber allgemein verständlich und gibt den festlichen Rahmen knapp wieder.
