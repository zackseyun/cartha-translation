  text: Do not trust in a way of stumbling[b][a], and in your end be on guard.
translation:
  language: de
  text: Verlass dich nicht auf einen Weg, der dich zu Fall bringt[a][b], und sei im Blick auf dein Ende auf der Hut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort מחתף ist schwer zu deuten. Gemeint ist wahrscheinlich etwas, das zum Stolpern oder Fallen führt; möglich wären auch Wiedergaben wie „ein glatter Weg“ oder „ein tückischer Pfad“.
    reason: lexical_alternative
  - marker: b
    text: Die hier mitgelieferte griechische Parallele scheint einen anderen Vers wiederzugeben. Wo sie dem erhaltenen hebräischen Text widerspricht, wurde ihr daher nicht gefolgt.
    reason: textual_variant
lexical_decisions:
- source_word: אל תבטח
  choice: Vertrau nicht
  rationale: בטח bezeichnet Vertrauen oder Sichverlassen auf etwas. „Vertrau nicht“ gibt die Warnung unmittelbar und idiomatisch wieder.
- source_word: בדרך
  choice: auf einen Weg
  rationale: דרך kann einen wirklichen Weg oder bildlich einen Lebensweg beziehungsweise eine Handlungsweise bezeichnen. „Weg“ bewahrt diese Offenheit und das hebräische Bild.
- source_word: מחתף
  choice: der zu Fall bringt
  rationale: Die seltene und schwierige Form weist im Zusammenhang wahrscheinlich auf Stolpern, Ausgleiten oder Zu-Fall-Kommen. Die Wiedergabe beschreibt die wahrscheinliche Wirkung, ohne sie vorschnell als „glatt“ oder „tückisch“ festzulegen.
- source_word: ובאחריתך
  choice: was dein Ende betrifft
  rationale: אחרית mit dem Suffix der zweiten Person kann das persönliche Ende, den Ausgang oder die Zukunft meinen. Die Formulierung erhält den persönlichen Bezug und lässt die genaue Reichweite offen.
- source_word: השמר
  choice: sei auf der Hut
  rationale: Der Imperativ fordert dazu auf, sich selbst zu hüten und wachsam zu sein. „Sei auf der Hut“ ist im heutigen Deutsch natürlich und wahrt den warnenden Ton.
theological_decisions:
- issue: Bedeutung von אחריתך
  choice: was dein Ende betrifft
  alternative: in deiner Zukunft / bei deinem Ausgang
  rationale: Der hebräische Ausdruck kann auf das Lebensende, den späteren Ausgang oder die Zukunft zielen. Die Übersetzung entscheidet diese mögliche Spannung nicht einseitig.
translation_notes:
  register: Moderne, würdige Standardsprache mit direktem Mahnton. Das Wegbild und der persönliche Bezug von „dein Ende“ bleiben erhalten; die schwierige Wortform מחתף wird verständlich, aber nicht übermäßig spezifisch wiedergegeben.
