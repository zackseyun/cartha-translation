translation:
  language: de
  text: Wer die Weisung sucht, wird sie erlangen; wer sich aber verstellt, wird durch sie gefangen werden.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort ומתלהלה ist unsicher; gemeint sein kann jemand, der sich verstellt, sich selbst täuscht oder sich ähnlich unaufrichtig verhält.
    reason: lexical_alternative
