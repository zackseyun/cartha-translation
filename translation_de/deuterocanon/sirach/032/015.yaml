lexical_decisions:
- source_word: דורש
  choice: sucht
  rationale: Das Partizip von דרש bezeichnet ein ernsthaftes Suchen oder Erforschen; „sucht“ gibt diese aktive Hinwendung natürlich wieder.
- source_word: תורה
  choice: die Weisung
  rationale: תורה kann das Gesetz beziehungsweise die Tora meinen, bezeichnet aber zugleich göttliche Unterweisung. „Weisung“ bewahrt diese Bedeutungsbreite, ohne den Ausdruck auf ein einzelnes modernes Verständnis von „Gesetz“ zu verengen.
- source_word: יפיקנה
  choice: wird sie erlangen
  rationale: הפיק bezeichnet hier wahrscheinlich das Erlangen oder Gewinnen des Gesuchten. „Erlangen“ ist näher am hebräischen Ausdruck als eine ausschließlich verstandesbezogene Wiedergabe wie „begreifen“.
- source_word: ומתלהלה
  choice: wer sich aber verstellt
  rationale: Das schwierige Wort scheint eine unechte, vorgebliche oder selbsttäuschende Haltung zu bezeichnen. „Sich verstellen“ wahrt die Gegenüberstellung zum aufrichtigen Suchen, ohne die unsichere Nuance zu stark festzulegen.
- source_word: יוקש
  choice: wird gefangen
  rationale: Die passive Verbform bezeichnet das Gefangen- oder Verstricktwerden; „wird gefangen“ ist klar und bildet das Fallen in eine Schlinge sinngemäß ab.
- source_word: בו
  choice: durch sie
  rationale: Das Suffix kann isoliert mehrdeutig sein. Der nächste plausible Bezug ist תורה; daher wird die unaufrichtige Person durch eben jene Weisung gefangen, die der aufrichtige Mensch sucht.
theological_decisions:
- issue: Bedeutungsumfang von תורה
  choice: die Weisung
  alternative: das Gesetz / die Tora
  rationale: Die Übersetzung lässt sowohl den Charakter göttlicher Unterweisung als auch den möglichen Bezug auf die autoritative Tora erkennen, ohne die Stelle konfessionell einzuengen.
- issue: Deutung des unsicheren ומתלהלה
  choice: wer sich verstellt
  alternative: der Heuchler / der Selbstgetäuschte / der Leichtfertige
  rationale: Der hebräische Ausdruck ist unsicher. Die gewählte Formulierung erhält den Kontrast zwischen aufrichtigem Suchen und unechtem Verhalten, während die Fußnote andere Möglichkeiten offenhält.
- issue: Bezug des Suffixes in בו
  choice: durch sie, bezogen auf die Weisung
  alternative: darin / durch ihn
  rationale: Der feminine unmittelbare Bezug תורה liegt syntaktisch und im antithetischen Aufbau am nächsten, doch die isolierte Form bleibt grundsätzlich auslegungsfähig.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper weisheitlicher Parallelstruktur. Die hebräische Fassung bleibt maßgeblich; die starke Abweichung der griechischen Überlieferung wird transparent in einer Fußnote dokumentiert.
