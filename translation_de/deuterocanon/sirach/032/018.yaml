  source_fidelity: 'Der Hauptsinn des hebräischen Textes ist richtig wiedergegeben: Der Weise nimmt keine Bestechung an, während זד ולץ die תורה nicht befolgt. Die zusammenfassende Wiedergabe von זד ולץ als „ein überheblicher Spötter“ ist möglich, muss aber – wie geschehen – als alternative syntaktische Analyse kenntlich bleiben. Die griechische Parallelüberlieferung gehört offenbar nicht zu dieser hebräischen Zeile; die textkritische Fußnote ist daher sachlich erforderlich.'
  naturalness: „Ein weiser Mann nimmt keine Bestechung an“ ist im heutigen Standarddeutsch idiomatischer und genauer als „nimmt kein Bestechungsgeschenk an“. „Hält sich nicht an die Weisung“ ist verständlich und angemessen; „Weisung“ wahrt den knappen, würdigen Weisheitsspruchstil.
  terminology: „Bestechung“ gibt שחד präzise wieder, ohne den im Hebräischen nicht ausdrücklich enthaltenen Bestandteil „Geschenk“ hinzuzufügen. „Überheblich“ ist für זד vertretbar; „Spötter“ trifft לץ im weisheitlichen Sinn. „Weisung“ ist eine gute Hauptwiedergabe von תורה; die Alternativen „Gesetz“ und „Unterweisung“ sollen in der Fußnote bleiben.
