translation:
  language: de
  text: Ein weiser Mann nimmt keine Bestechung an,[a] doch ein überheblicher Spötter[b] hält sich nicht an die Weisung.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die überlieferte griechische Parallelzeile stimmt an dieser Stelle nicht mit dem hebräischen Text überein; die Übersetzung folgt daher vorrangig dem erhaltenen hebräischen Text.
    reason: textual_variant
  - marker: b
    text: 'Hebräisch זד ולץ kann auch zwei Charaktertypen bezeichnen: „der Überhebliche und der Spötter“.'
    reason: alternative_reading
  - marker: c
    text: 'Oder: „das Gesetz“ beziehungsweise „die Unterweisung“. Das hebräische תורה kann verbindliche Lehre in einem weiteren Sinn bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: איש חכם
  choice: ein weiser Mann
  rationale: Gibt die ausdrücklich maskuline Singularform genau wieder und lässt zugleich den sprichwörtlichen Charakter erkennen.
- source_word: לא יקח
  choice: nimmt … nicht an
  rationale: Das Yiqtol bezeichnet hier typisches Verhalten; das deutsche Präsens ist dafür in einem Weisheitsspruch natürlich.
- source_word: שחד
  choice: Bestechungsgeschenk
  rationale: Bezeichnet eine Gabe, mit der jemand bestochen werden soll; die Wahl ist präzise und würdevoll.
- source_word: זד ולץ
  choice: ein überheblicher Spötter
  rationale: Bewahrt beide Charakterzüge in einer zusammengesetzten Bezeichnung. Da die asyndetische Folge auch zwei Personentypen bezeichnen kann, wird diese Möglichkeit in einer Fußnote genannt.
- source_word: לא ישמור
  choice: hält sich nicht an
  rationale: שמר bezeichnet in Verbindung mit תורה das Befolgen bzw. Beachten; die Formulierung ist im modernen Deutsch idiomatisch.
- source_word: תורה
  choice: Weisung
  rationale: Bewahrt die Bedeutungsbreite von תורה als verbindliche Unterweisung, ohne den Ausdruck vorschnell auf ein Gesetzbuch einzuengen.
theological_decisions:
- issue: Wiedergabe von תורה im weisheitlichen Zusammenhang
  choice: Weisung
  alternative: Gesetz; Unterweisung
  rationale: „Weisung“ umfasst autoritative Lehre und ethische Verpflichtung. „Gesetz“ ist möglich, könnte die Bedeutungsbreite hier jedoch stärker verengen.
- issue: Bezug von זד ולץ
  choice: 'eine zusammengesetzte Charakterisierung: „ein überheblicher Spötter“'
  alternative: 'zwei Personentypen: „der Überhebliche und der Spötter“'
  rationale: Das Hebräische enthält keine Konjunktion und lässt beide Auffassungen zu; der Haupttext folgt der sprachlich geschlossenen Lesart, ohne die Alternative zu verschweigen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der parallel gebaute Weisheitsspruch bleibt knapp; echte textliche und lexikalische Unsicherheiten werden in Fußnoten offengelegt.
