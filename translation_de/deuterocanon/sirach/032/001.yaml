base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/032/001.yaml
  text: If they have made you the leader[a], do not exalt yourself; be among them like one of them. Care for them, and then recline; prepare what is needed[c][b], and then take your place.
translation:
  language: de
  text: Bist du zum Leiter einer Festgesellschaft erwählt worden, überhebe dich nicht, und setz dich nicht an die Spitze der Vornehmen.[a] Sei unter ihnen wie einer von ihnen. Kümmere dich um sie,[b] und erst dann leg dich zu Tisch.[c] Bereite alles Nötige vor, und danach nimm deinen Platz ein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die beiden einleitenden Mahnungen stehen in Kahanas hebräischer Ausgabe in eckigen Klammern; ihre Textgestalt ist daher unsicher. Der hier beigegebene griechische Paralleltext weicht vollständig ab und bestätigt ihren Wortlaut nicht.
    reason: textual_variant
  - marker: b
    text: 'Oder: „Sorge für sie.“ Das hebräische Verb kann sowohl besorgte Anteilnahme als auch praktische Fürsorge bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: Bei förmlichen Mahlzeiten lag man in der Antike gewöhnlich zu Tisch.
    reason: cultural_note
lexical_decisions:
- source_word: ראש נבחרת
  choice: zum Leiter einer Festgesellschaft erwählt
  rationale: Die Wendung bezeichnet den Leiter beziehungsweise Vorsteher einer ausgewählten Gruppe. Der anschließende Zusammenhang mit der Sorge für die Anwesenden und dem Platznehmen bei Tisch legt eine Fest- oder Tischgesellschaft nahe; die Formulierung macht diese Situation verständlich, ohne den Leiter ausdrücklich zum Gastgeber zu erklären.
- source_word: אל תתרומם
  choice: überhebe dich nicht
  rationale: Das reflexive Verb bezeichnet Selbsterhöhung. „Überhebe dich nicht“ bewahrt sowohl das Bild als auch den moralischen Aufruf zur Demut in natürlichem Deutsch.
- source_word: ובראש גדולים אל תשב
  choice: und setz dich nicht an die Spitze der Vornehmen
  rationale: Die zweite, im hebräischen Text ebenfalls eingeklammerte Mahnung wird anders als in der englischen Konsultationsfassung ausdrücklich wiedergegeben. ראש bezeichnet hier die Spitze beziehungsweise den Ehrenplatz; גדולים sind gesellschaftlich Große oder Vornehme.
- source_word: היה להם כאחד מהם
  choice: Sei unter ihnen wie einer von ihnen
  rationale: Die Wiedergabe bringt die geforderte Gleichstellung und Nähe zur Gruppe zum Ausdruck und vermeidet eine unnötig hölzerne Nachbildung von „sei ihnen wie einer von ihnen“.
- source_word: דאג להם
  choice: Kümmere dich um sie
  rationale: Das Verb kann innere Sorge wie auch praktische Fürsorge bezeichnen. Im Zusammenhang einer Mahlzeit ist „sich kümmern um“ breit genug, um beides offenzuhalten.
- source_word: תסב
  choice: leg dich zu Tisch
  rationale: Das Verb verweist auf das bei festlichen Mahlzeiten übliche Liegen zu Tisch. Die Formulierung bewahrt den historischen Brauch und ist im Deutschen verständlicher als das isolierte „leg dich hin“.
- source_word: הכן מרכם
  choice: Bereite alles Nötige vor
  rationale: Die überlieferte Wortfolge ist schwierig und lässt den genauen Gegenstand der Vorbereitung nicht sicher erkennen. Die kontextuelle Wiedergabe wahrt den Handlungsablauf, ohne eine ungesicherte Einzeldeutung vorzutäuschen.
- source_word: תרבץ
  choice: nimm deinen Platz ein
  rationale: Das Verb kann „sich lagern“ oder „sich niederlegen“ bedeuten. Da unmittelbar zuvor bereits die antike Tischhaltung ausdrücklich wiedergegeben wird, vermittelt „nimm deinen Platz ein“ die erneute Aufforderung idiomatisch, ohne die hebräische Abfolge aufzulösen.
