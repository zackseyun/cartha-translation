  text: Do not walk on a path full of obstacles[b][a], and do not stumble over the same hazard twice.
translation:
  language: de
  text: Geh nicht auf einem Weg voller Fallstricke[a], und strauchle nicht zweimal an einem Hindernis.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: ein Weg der מוקשות. Das Wort kann Fallstricke, Fallen oder Hindernisse bezeichnen, an denen man strauchelt.'
    reason: lexical_alternative
  - marker: b
    text: 'Die griechische Überlieferung bietet hier einen völlig anderen Text: „Wer mit Wohlgefallen dient, wird angenommen werden, und sein Bittgebet wird bis zu den Wolken reichen.“ Der Haupttext folgt dem erhaltenen hebräischen Zeugnis.'
    reason: textual_variant
lexical_decisions:
- source_word: בדרך
  choice: auf einem Weg
  rationale: דרך bezeichnet einen Weg oder Pfad und kann zugleich bildlich für den Lebenswandel stehen; „auf einem Weg“ bewahrt beide Ebenen.
- source_word: מוקשות
  choice: voller Fallstricke
  rationale: Das Wort bezeichnet Dinge, die fangen oder zu Fall bringen können. „Fallstricke“ wahrt sowohl die konkrete Gefahr als auch den übertragenen Sinn, ohne sie bloß als gewöhnliche Unebenheiten festzulegen.
- source_word: אל תלך
  choice: Geh nicht
  rationale: הלך bedeutet „gehen“ oder „wandeln“. Die schlichte Aufforderung ist im modernen Deutschen natürlich und erhält das Wegmotiv.
- source_word: ואל תתקל
  choice: und komm nicht … zu Fall
  rationale: Die Verbform bezeichnet hier ein Straucheln oder Zu-Fall-Kommen. Die deutsche Wendung fügt sich natürlich mit dem folgenden Hindernis zusammen.
- source_word: בנגף
  choice: an demselben Hindernis
  rationale: נגף kann einen Stoß oder etwas bezeichnen, das zu Fall bringt. „Hindernis“ hält den konkreten und übertragenen Sinn offen; „demselben“ ergibt sich im Zusammenhang mit dem singularischen Hindernis und „zweimal“, ist jedoch nicht als eigenes Wort ausgedrückt.
- source_word: פעמים
  choice: zweimal
  rationale: Das Wort wird hier in seinem gewöhnlichen adverbialen Sinn „zweimal“ verstanden.
