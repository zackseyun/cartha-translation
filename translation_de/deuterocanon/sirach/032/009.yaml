translation:
  language: de
  text: Dem Hagel geht der Blitz voraus;[a] und dem Demütigen[b] geht Gunst voraus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Text bietet hier stattdessen: „Das Opfer eines Gerechten findet Annahme, und sein Gedächtnis wird nicht vergessen werden.“ Dies weist auf eine andere Texttradition oder Verszuordnung hin.'
    reason: textual_variant
  - marker: b
    text: 'Oder: „dem Niedrigen“ beziehungsweise „dem Niedergedrückten“. Das hebräische Wort kann sowohl einen demütigen als auch einen erniedrigten oder bedrückten Menschen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִפְנֵי
  choice: geht … voraus
  rationale: Die zeitliche beziehungsweise aufeinanderfolgende Bedeutung bestimmt beide parallelen Satzhälften und lässt sich im Deutschen natürlich mit „vorausgehen“ wiedergeben.
- source_word: בָרָד
  choice: Hagel
  rationale: Dies ist die gewöhnliche Bedeutung; zusammen mit dem Blitz entsteht ein Wetterbild.
- source_word: יִנְצַח
  choice: geht … voraus
  rationale: Das Verb ist hier schwierig und kann sonst etwa „siegen“, „hervortreten“ oder „sich auszeichnen“ bedeuten. Im Parallelismus mit לִפְנֵי und im Bild vom Blitz vor dem Hagel passt die Bedeutung des vorangehenden Erscheinens am besten.
- source_word: בָּרָק
  choice: Blitz
  rationale: Die übliche Bedeutung des hebräischen Wortes und die natürliche Entsprechung im Wetterbild.
- source_word: דַכָּא
  choice: dem Demütigen
  rationale: Das Wort kann einen demütigen, niedrigen oder niedergedrückten Menschen bezeichnen. „Der Demütige“ wahrt im Zusammenhang eines Weisheitsspruchs die wahrscheinlich ethische Bedeutung, ohne die möglichen Nebenbedeutungen zu verschweigen.
- source_word: חֵן
  choice: Gunst
  rationale: In sozialen und weisheitlichen Zusammenhängen bezeichnet חֵן häufig wohlwollende Annahme oder Gunst; „Gunst“ ist hier klar und vermeidet eine vorschnell theologische Engführung von „Gnade“.
theological_decisions:
- issue: Hebräischer Text gegenüber dem abweichenden griechischen Paralleltext
  choice: Der erhaltene hebräische Spruch bildet den Haupttext.
  alternative: 'Dem griechischen Text folgen: „Das Opfer eines Gerechten findet Annahme, und sein Gedächtnis wird nicht vergessen werden.“'
  rationale: Für Jesus Sirach ist der erhaltene hebräische Text vorrangig. Der angegebene griechische Zeuge bietet hier einen vollständig anderen Satz, wahrscheinlich aufgrund einer abweichenden Texttradition oder Verszählung; diese Abweichung wird daher in einer Fußnote dokumentiert.
- issue: Bedeutung von דַכָּא
  choice: dem Demütigen
  alternative: dem Niedrigen / dem Niedergedrückten
  rationale: Der Zusammenhang legt eine charakterliche Demut nahe, doch das hebräische Wort kann ebenso einen niedrigen oder erniedrigten Zustand bezeichnen. Die Fußnote hält diese Spannung offen.
translation_notes:
  register: Knapper, würdevoller Weisheitsspruch in modernem Standarddeutsch. Die Wiederholung von „geht … voraus“ bildet den hebräischen Parallelismus sichtbar ab; das Semikolon wahrt die enge Verbindung der beiden Satzhälften.
