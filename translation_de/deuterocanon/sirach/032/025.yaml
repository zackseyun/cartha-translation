  text: until he judges the case of his people and gladdens them with his mercy[a].
translation:
  language: de
  text: bis er über die Sache seines Volkes entscheidet und sie durch sein Erbarmen erfreut.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „bis er seinem Volk Recht verschafft“; auch möglich: „bis er das Urteil über sein Volk fällt“. Die griechische Wendung ist wörtlich wiederholend und kann idiomatisch das Entscheiden einer Rechtssache oder das Ausüben von Recht bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕως
  choice: bis
  rationale: Die Konjunktion bezeichnet den zeitlichen Endpunkt der vorausgehenden Handlung; „bis“ ist im Deutschen die natürliche Entsprechung.
- source_word: κρίνῃ τὴν κρίσιν
  choice: über die Sache … entscheidet
  rationale: Die im Griechischen formelhaft wiederholte Wortwurzel bezeichnet hier das Fällen eines Urteils. Die deutsche Fassung gibt den idiomatischen Sinn natürlich wieder, ohne festzulegen, ob Entscheidung, Rechtsprechung oder Rechtverschaffung im Vordergrund steht.
- source_word: τοῦ λαοῦ αὐτοῦ
  choice: seines Volkes
  rationale: Der Genitiv wird formal bewahrt und lässt offen, ob es um die Sache des Volkes, eine Entscheidung über das Volk oder Recht für das Volk geht.
- source_word: εὐφράνει αὐτούς
  choice: sie … erfreut
  rationale: 'Das Verb ist transitiv und kausativ: Er bewirkt ihre Freude. „Erfreut“ ist würdig, verständlich und knapp.'
- source_word: ἐν τῷ ἐλέει αὐτοῦ
  choice: durch sein Erbarmen
  rationale: ἐν kann hier Mittel oder Wirkungsbereich bezeichnen. „Durch“ macht den instrumentalen Sinn natürlich deutlich; „Erbarmen“ gibt ἔλεος in diesem Zusammenhang angemessen wieder.
theological_decisions:
- issue: Deutung von κρίνῃ τὴν κρίσιν
  choice: über die Sache seines Volkes entscheidet
  alternative: seinem Volk Recht verschafft; das Urteil über sein Volk fällt
  rationale: Die griechische Wendung ist formal wiederholend und kann die Entscheidung eines Rechtsfalls oder die Ausübung beziehungsweise Verschaffung von Recht bezeichnen. Der Haupttext vermeidet eine konfessionelle oder theologisch einengende Festlegung; die Fußnote bewahrt die wesentlichen Möglichkeiten.
translation_notes:
  register: Modernes, gehobenes Standarddeutsch. „Über die Sache … entscheidet“ ist natürlicher als eine wörtliche Wiedergabe wie „das Urteil richtet“, während die Fußnote die echte Mehrdeutigkeit der gerichtlichen Wendung erhält.
