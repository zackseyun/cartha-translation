  text: so that you may rejoice in their honor[b][a], and receive a reward for your instruction.
translation:
  language: de
  text: damit du dich an ihrer Ehre freust und für Unterweisung[b] Lohn empfängst.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Parallele lautet hier ganz anders: „Wer auf die Gebote achtet, bringt ein Heilsopfer dar.“ Der Haupttext folgt dem erhaltenen hebräischen Text, der dort, wo er überliefert ist, die vorrangige Grundlage für die Übersetzung des Buches Jesus Sirach bildet.'
    reason: alternative_reading
  - marker: b
    text: Oder „Erziehung“, „Zucht“ oder „gute Ordnung“. Das hebräische Wort מוסר kann mehrere Bedeutungen aus dem Bereich der Weisheitslehre haben.
    reason: lexical_alternative
lexical_decisions:
- source_word: למען
  choice: damit
  rationale: Leitet einen Zweck oder eine Folge ein und gibt die hebräische Konstruktion in natürlichem Deutsch wieder.
- source_word: תשמח
  choice: du dich freust
  rationale: שמח bezeichnet Freude oder Sichfreuen; die Form bewahrt die direkte Anrede und klingt gegenwärtig und würdig.
- source_word: בכבודם
  choice: an ihrer Ehre
  rationale: כבוד kann „Ehre“ oder „Herrlichkeit“ bedeuten. Die Formulierung lässt offen, ob es um die ihnen eigene oder die ihnen erwiesene Ehre geht.
- source_word: ועל
  choice: und für
  rationale: Gibt die Verknüpfung sowie den Grund oder Bezug des folgenden Lohnes knapp und idiomatisch wieder.
- source_word: מוסר
  choice: Unterweisung
  rationale: מוסר umfasst Unterweisung, Erziehung, Zucht und Mahnung. „Unterweisung“ passt zum weisheitlichen Zusammenhang, ohne vorschnell einen strafenden Sinn festzulegen.
- source_word: תשא
  choice: empfängst
  rationale: נשא bedeutet wörtlich „heben“ oder „tragen“, hat mit שכר hier aber idiomatisch den Sinn „Lohn erhalten“.
- source_word: שכר
  choice: Lohn
  rationale: שכר bezeichnet Lohn, Vergeltung oder Belohnung. „Lohn“ ist knapp und bewahrt die mögliche Spannung zwischen Entgelt und Anerkennung.
theological_decisions:
- issue: Vorrang des erhaltenen hebräischen Textes gegenüber der stark abweichenden griechischen Parallele
  choice: Der Haupttext übersetzt die erhaltene hebräische Fassung im Zusammenhang des Gastmahls.
  alternative: „Wer auf die Gebote achtet, bringt ein Heilsopfer dar.“
  rationale: Wo der hebräische Sirachtext erhalten ist, bildet er die primäre Grundlage. Da die griechische Parallele hier in Wortlaut und Aussage erheblich abweicht, wird sie nicht in den Haupttext eingearbeitet, sondern in einer Fußnote dokumentiert.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem weisheitlichem Ton. Die knappe Parallelstruktur des Hebräischen bleibt erhalten; unnötige Besitzangaben wie „deine Unterweisung“, die im Hebräischen nicht ausdrücklich stehen, werden vermieden.
