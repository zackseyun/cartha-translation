translation:
  language: de
  text: Wie ein Siegel auf einem Beutel mit Gold ist ein Lied für Gott bei einem Festmahl mit Wein.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „ein Gotteslied“. Die hebräische Wortverbindung ist knapp und kann ein an Gott gerichtetes oder ein auf Gott bezogenes Lied bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Die vorausgehenden hebräischen Zeilen dieser Verseinheit sind in der Überlieferung textlich schwierig. Dieser abschließende Vergleich ist der klarste Teil und wird unmittelbar nach dem erhaltenen hebräischen Text übersetzt; die griechische Überlieferung bietet eine abweichende Fassung.
    reason: textual_variant
lexical_decisions:
- source_word: כחותם
  choice: Wie ein Siegel
  rationale: Die Präposition כ kennzeichnet einen Vergleich. חותם bezeichnet allgemein ein Siegel; „Siegelring“ wäre enger als der hebräische Ausdruck.
- source_word: על כיס זהב
  choice: auf einem Beutel voll Gold
  rationale: כיס ist ein Beutel oder Geldbeutel für Wertsachen. „Voll Gold“ gibt die knappe hebräische Verbindung im Deutschen natürlich und anschaulich wieder.
- source_word: שיר
  choice: ein Lied
  rationale: Das singularische Substantiv wird in diesem sprichwortartigen Vergleich konkret wiedergegeben.
- source_word: אל
  choice: für Gott
  rationale: Die knappe Verbindung שיר אל lässt das Verhältnis zwischen Lied und Gott offen. „Für Gott“ wahrt die mögliche Ausrichtung auf Gott, ohne eine engere liturgische Deutung festzulegen.
- source_word: על משתה היין
  choice: bei einem Festmahl mit Wein
  rationale: משתה bezeichnet ein Fest- oder Trinkmahl, und היין nennt ausdrücklich den Wein. Die Präposition על wird hier kontextgemäß mit „bei“ wiedergegeben.
theological_decisions:
- issue: Die knappe Wortverbindung שיר אל
  choice: ein Lied für Gott
  alternative: ein Gotteslied
  rationale: Das Hebräische kann ein an Gott gerichtetes oder allgemeiner auf Gott bezogenes Lied bezeichnen. Der Haupttext lässt diese Beziehung möglichst offen; die Fußnote nennt die substantivische Alternative.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der konkrete Bildvergleich bleibt erhalten; „Festmahl mit Wein“ ist verständlich und vermeidet den abwertenden Beiklang von „Trinkgelage“.
