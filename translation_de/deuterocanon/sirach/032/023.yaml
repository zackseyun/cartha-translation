  text: In all your deeds guard yourself[b][a], for the one who does this keeps the commandment.
translation:
  language: de
  text: Achte bei allem, was du tust, auf dich selbst[a]; denn wer das tut, hält das Gebot[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »bewahre deine Seele« oder »bewahre dein Leben«; das hebräische Wort nefesch kann die eigene Person, die Seele oder das Leben bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »hält ein Gebot«. Der Singular »Gebot« kann hier allgemein beziehungsweise zusammenfassend gebraucht sein.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בכל מעשיך
  choice: bei allem, was du tust
  rationale: Die Wendung bezeichnet umfassend den Bereich des Handelns. Die verbale Formulierung ist im modernen Deutschen natürlicher als „in allen deinen Taten“, ohne den ethischen Gehalt abzuschwächen.
- source_word: שמור
  choice: achte ... auf
  rationale: Der Imperativ von שמר fordert zu wachsamer Bewahrung auf. „Achte auf dich selbst“ gibt die reflexive Wendung idiomatisch wieder; „bewahre dich“ wäre zwar formnäher, klänge hier aber weniger natürlich.
- source_word: נפשך
  choice: dich selbst
  rationale: נפש kann die Person selbst, das Leben oder die Seele bezeichnen. Im Zusammenhang des gesamten Handelns meint es wahrscheinlich die ganze Person und ihre Lebensführung, ohne eine Trennung von Körper und Seele vorauszusetzen.
- source_word: כי
  choice: denn
  rationale: כי leitet die Begründung der Mahnung ein; „denn“ bewahrt diesen argumentativen Zusammenhang knapp und würdig.
- source_word: עושה זה
  choice: wer das tut
  rationale: Das Partizip mit Demonstrativpronomen hat allgemeinen, nicht auf Männer beschränkten Bezug. „Wer das tut“ ist prägnantes und natürliches Deutsch.
- source_word: שומר מצוה
  choice: hält das Gebot
  rationale: Die Wiedergabe bewahrt die Wiederaufnahme der Wurzel שמר zumindest sinngemäß. Das artikellose Singularwort מצוה kann ein bestimmtes beziehungsweise zusammenfassend verstandenes „Gebot“ oder generisch „ein Gebot“ meinen.
theological_decisions:
- issue: Bedeutungsumfang von נפש
  choice: dich selbst
  alternative: deine Seele; dein Leben
  rationale: „Dich selbst“ umfasst hier die ganze Person und vermeidet, dem hebräischen נפש eine ausschließlich immaterielle Bedeutung aufzuerlegen. Die echten lexikalischen Alternativen werden in der Fußnote bewahrt.
- issue: Bestimmtheit von מצוה
  choice: das Gebot
  alternative: ein Gebot
  rationale: Der artikellose Singular lässt sowohl eine zusammenfassende Auffassung des göttlichen Gebots als auch eine generische Auffassung zu. Der Haupttext wählt die im Weisheitsstil prägnante Form „das Gebot“, während die Alternative ausdrücklich vermerkt wird.
- issue: Allgemeiner Personenbezug in עושה זה
  choice: wer das tut
  alternative: derjenige, der das tut
  rationale: Die hebräische maskuline Singularform dient allgemein-repräsentativ. „Wer“ wahrt diesen universalen Bezug ohne unnötige geschlechtliche Festlegung.
translation_notes:
  register: Modernes, klares und zugleich würdiges Weisheitsdeutsch. Die zweimalige hebräische Wurzel שמר lässt sich idiomatisch nicht vollständig mit demselben deutschen Verb wiedergeben; „achte ... auf“ und „hält“ bewahren Wachsamkeit im ersten und Gebotstreue im zweiten Satzteil. Die bereitgestellte griechische Parallelstelle stimmt inhaltlich nicht mit dem hebräischen Vers überein und wurde daher wegen der als hoch eingestuften hebräischen Textgrundlage nicht zur Korrektur des Haupttextes herangezogen.
