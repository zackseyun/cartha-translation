translation:
  language: de
  text: Tu nichts ohne Rat; und nach deinem Handeln ärgere dich nicht.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „werde nicht ungehalten“; im Zusammenhang kann auch gemeint sein: „bereue es nicht“.'
    reason: lexical_alternative
  - marker: b
    text: Die überlieferte griechische Parallelfassung stimmt an dieser Stelle nicht mit dem hebräischen Wortlaut überein. Die Übersetzung folgt daher dem erhaltenen hebräischen Text.
    reason: textual_variant
lexical_decisions:
- source_word: בלא עצה
  choice: ohne Rat
  rationale: Die Wendung bezeichnet Handeln ohne Rat, Beratung oder Überlegung. „Ohne Rat“ ist knapp, natürlich und entspricht dem Sprachgebrauch der Weisheitsliteratur.
- source_word: אל תפעל דבר
  choice: Tu nichts
  rationale: דבר hat im verneinten Gebot die umfassende Bedeutung „irgendetwas“; die deutsche Formulierung gibt diesen Geltungsbereich idiomatisch wieder.
- source_word: ואחר מעשיך
  choice: und nach deinem Handeln
  rationale: Wörtlich steht „und nach deinen Taten“. Das substantivierte „Handeln“ bewahrt die zeitliche Abfolge und klingt im Deutschen natürlicher, ohne ein zusätzliches Bezugswort einzuführen.
- source_word: אל תתקצף
  choice: ärgere dich nicht
  rationale: Die reflexive Form kann bedeuten, dass man zornig, ungehalten oder innerlich aufgebracht wird. „Ärgere dich nicht“ hält diese Bedeutungsbreite eher offen als die stärker deutende Wiedergabe „bereue es nicht“.
