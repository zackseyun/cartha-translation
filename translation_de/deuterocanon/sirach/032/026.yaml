  yaml_path: translation/deuterocanon/sirach/032/026.yaml
  text: Mercy is beautiful in the time of his distress[b][a], like rain clouds in a time without rain.
translation:
  language: de
  text: Schön[a] ist Erbarmen zur Zeit seiner Bedrängnis[b], wie Regenwolken in regenloser Zeit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Passend ist Erbarmen in einer Zeit der Bedrängnis.“ Das Adjektiv kann Schönheit, Annehmlichkeit oder Angemessenheit hervorheben.'
    reason: lexical_alternative
  - marker: b
    text: Wörtlich steht im Griechischen „seiner Bedrängnis“; das maskuline Singularpronomen wird hier in einem allgemeinen Weisheitsspruch gebraucht.
    reason: cultural_note
lexical_decisions:
- source_word: ὡραῖον
  choice: schön
  rationale: Das Adjektiv bezeichnet hier Schönheit, Anmut oder Angemessenheit. „Schön“ bewahrt die bildhafte und wertende Kraft; die mögliche Bedeutung „passend“ wird in einer Fußnote genannt.
- source_word: ἔλεος
  choice: Erbarmen
  rationale: ἔλεος bezeichnet barmherzige Zuwendung oder Hilfe. „Erbarmen“ ist im Deutschen gewichtig, verständlich und passt zur Notlage des Betroffenen.
- source_word: ἐν καιρῷ
  choice: in der Zeit / in einer Zeit
  rationale: Die Wendung hebt den maßgeblichen Zeitpunkt hervor. Die wiederholte Zeitangabe bleibt in beiden Vershälften sichtbar; beim konkreten Bezug auf seine Bedrängnis steht „der“, beim allgemeinen Vergleich „einer“.
- source_word: θλίψεως
  choice: Bedrängnis
  rationale: θλῖψις kann Druck, Not oder Bedrängnis bezeichnen. „Bedrängnis“ bewahrt die Intensität, ohne einen unnötig technischen theologischen Sinn einzutragen.
- source_word: αὐτοῦ
  choice: seiner
  rationale: Das griechische maskuline Singularpronomen wird formgetreu wiedergegeben. Sein allgemeiner Gebrauch in der Weisheitsrede wird in einer Fußnote erläutert.
- source_word: νεφέλαι ὑετοῦ
  choice: Regenwolken
  rationale: Der beschreibende Genitiv bezeichnet Wolken, die Regen bringen; „Regenwolken“ ist natürlich und erhält das klare Bild.
- source_word: ἀβροχίας
  choice: einer Zeit ohne Regen
  rationale: Das Substantiv bezeichnet Regenlosigkeit. Die Umschreibung bleibt nahe am Griechischen und erhält die parallele Zeitstruktur besser als das komprimierte „Dürre“.
theological_decisions:
- issue: Generisches maskulines Pronomen αὐτοῦ in der Weisheitsrede
  choice: „seiner“ im Haupttext
  alternative: „eines Menschen“ oder „der eigenen“
  rationale: Der griechische Text verwendet eine maskuline Singularform in repräsentativem Sinn. Die Übersetzung erhält diese Form und erklärt ihren allgemeinen Weisheitsgebrauch in der Fußnote, statt sie stillschweigend zu neutralisieren.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper poetischer Parallelität. Die ungewöhnliche, aber verständliche Anfangsstellung „Schön ist Erbarmen“ bewahrt den hervorgehobenen Wertungsakzent des griechischen ὡραῖον.
