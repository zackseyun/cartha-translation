base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/032/006.yaml
  text: Like settings of gold and a seal of beryl[b][a], so is the sound of a psalm with the sweetness of new wine.
translation:
  language: de
  text: Wie Einfassungen aus Feingold und ein Siegel aus Beryll[a], so ist der Klang eines Psalms beim Wohlgeschmack jungen Weins.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein Siegel aus Smaragd“. Welche Edelsteinart ברקת genau bezeichnet, ist unsicher.'
    reason: lexical_alternative
  - marker: b
    text: 'Die griechische Parallelüberlieferung lautet an dieser Stelle: „Erscheine nicht mit leeren Händen vor dem Herrn.“ Sie folgt offenbar einer anderen Text- oder Versüberlieferung. Der Haupttext gibt den erhaltenen hebräischen Wortlaut wieder.'
    reason: textual_variant
lexical_decisions:
- source_word: מלואות פז
  choice: Einfassungen aus Feingold
  rationale: מלואות bezeichnet in diesem poetischen Schmuckbild wahrscheinlich Fassungen oder Einlagen; פז ist feines, geläutertes Gold. „Einfassungen aus Feingold“ ist verständlich und bewahrt das kostbare Bild.
- source_word: חותם ברקת
  choice: ein Siegel aus Beryll
  rationale: חותם bedeutet „Siegel“ oder „Siegelstein“. ברקת bezeichnet einen Edelstein, dessen genaue Bestimmung unsicher ist; „Beryll“ ist eine verbreitete wissenschaftliche Wiedergabe, ohne einen Siegelring vorauszusetzen.
- source_word: קול מזמור
  choice: der Klang eines Psalms
  rationale: קול kann Stimme oder Klang bedeuten, מזמור einen Psalm beziehungsweise ein musikalisch vorgetragenes Lied. Die Wiedergabe erhält den poetisch-musikalischen Charakter.
- source_word: על נועם תירוש
  choice: zu lieblichem jungen Wein
  rationale: תירוש bezeichnet jungen Wein, נועם dessen Lieblichkeit oder angenehmen Genuss. Das mehrdeutige על wird mit „zu“ als begleitende Zuordnung wiedergegeben, ohne die Beziehung unnötig festzulegen.
theological_decisions:
- issue: Vorrang des erhaltenen hebräischen Textes gegenüber der abweichenden griechischen Parallele
  choice: Die poetische hebräische Zeile bildet den Haupttext.
  alternative: 'Die griechische Parallele lautet: „Erscheine nicht mit leeren Händen vor dem Herrn.“'
  rationale: Der griechische Text entspricht semantisch nicht der erhaltenen hebräischen Zeile und bezeugt offenbar eine andere Text- oder Versüberlieferung. Da der hebräische Text hier erhalten und verlässlich bezeugt ist, wird er übersetzt; die erhebliche Abweichung wird in einer Fußnote offengelegt.
translation_notes:
  register: Moderne, gehobene Standardsprache mit knapper poetischer Parallelstruktur. Das ergänzte Vergleichspaar „Wie … so“ macht die im Hebräischen elliptische Bildbeziehung auf Deutsch verständlich. „Lieblich“ bewahrt נועם als sinnliche Qualität des jungen Weins; „zu“ lässt die genaue Art der Begleitung bewusst offen.
