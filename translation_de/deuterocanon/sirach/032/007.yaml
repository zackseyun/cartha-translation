base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/032/007.yaml
  text: Speak[a], young man, if there is need for you to do so, with restraint[b], two or three times if you are asked.
translation:
  language: de
  text: Rede, junger Mann, wenn es für dich nötig ist; mit Zurückhaltung[a], zwei- oder dreimal, wenn man dich fragt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hier mit „mit Zurückhaltung“ wiedergegebene hebräische Wort ist in dieser Zeile unsicher. Möglich wären auch „knapp“ oder „mit Bedacht“. Die griechische Überlieferung weicht an dieser Stelle erheblich ab.
    reason: textual_variant
lexical_decisions:
- source_word: דבר
  choice: Rede
  rationale: Der Imperativ fordert unmittelbar zum Sprechen auf; „Rede“ ist im Deutschen natürlich und würdevoll.
- source_word: נער
  choice: junger Mann
  rationale: Das hebräische Substantiv steht im maskulinen Singular und bezeichnet hier einen jungen männlichen Menschen.
- source_word: אם צריך אתה
  choice: wenn es für dich nötig ist
  rationale: Die Formulierung bewahrt sowohl die Bedingung als auch den ausdrücklichen Bezug auf die angesprochene Person.
- source_word: בחזק
  choice: mit Zurückhaltung
  rationale: Die Wendung ist an dieser Stelle textkritisch und lexikalisch schwierig. Im Zusammenhang der Mahnung zu maßvollem Reden gibt „mit Zurückhaltung“ den wahrscheinlichen Sinn wieder, ohne die unsichere Lesart im Haupttext unnötig wörtlich abzubilden.
- source_word: פעמים ושלש
  choice: zwei- oder dreimal
  rationale: Die koordinierte Zahlenangabe begrenzt die Häufigkeit des Redens; die deutsche Formulierung gibt dies knapp und natürlich wieder.
- source_word: אם ישאלך
  choice: wenn man dich fragt
  rationale: Das unbestimmte „man“ gibt das nicht eigens genannte Subjekt idiomatisch wieder und bewahrt den konditionalen Sinn.
