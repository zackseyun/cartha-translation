base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/032/022.yaml
  text: Do not trust in the way of the wicked[a], and be careful in your paths. In all your ways guard yourself, for everyone who does these things keeps the commandment.
translation:
  language: de
  text: Verlass dich nicht auf den Weg der Frevler und hüte dich auf deinen Pfaden.[a] Hüte dich auf all deinen Wegen; denn wer all dies tut, hält das Gebot.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: In der hebräischen Ausgabe steht dieser Satz vor der Verszahl. Die angegebene griechische Parallelüberlieferung bietet für diesen Vers einen deutlich abweichenden Text. Daher ist unsicher, ob der Satz zu diesem Vers oder zum angrenzenden Text gehört.
    reason: textual_variant
lexical_decisions:
- source_word: אל תבטח בדרך רשעים
  choice: Vertrau nicht auf den Weg der Frevler
  rationale: Die Übersetzung bewahrt das hebräische Bild vom »Weg« als Lebensführung. »Frevler« gibt רשעים als moralisch schuldige Menschen in einem würdigen, im Weisheitskontext geläufigen Register wieder.
- source_word: ובארחותיך הזהר
  choice: und sei auf deinen Pfaden achtsam
  rationale: »Pfade« erhält die Wegmetapher von ארחות, während »achtsam sein« die warnende, reflexive Bedeutung von הזהר natürlich ausdrückt.
- source_word: בכל דרכיך
  choice: auf all deinen Wegen
  rationale: Die konkrete Wegmetapher für sämtliche Lebensbereiche bleibt erhalten und klingt im Deutschen natürlich.
- source_word: שמור נפשך
  choice: Gib auf dich acht
  rationale: נפש bezeichnet hier am ehesten die eigene Person beziehungsweise das eigene Leben, nicht ausdrücklich eine vom Körper getrennte Seele. Die Formulierung gibt den praktischen Mahnruf idiomatisch wieder.
- source_word: כי
  choice: denn
  rationale: כי leitet die Begründung der vorausgehenden Mahnung ein; »denn« wahrt diesen knappen sprichwortartigen Zusammenhang.
- source_word: כל עושה אלה
  choice: jeder, der dies tut
  rationale: Die substantivierte Partizipialkonstruktion ist allgemein formuliert. Das pluralische אלה verweist zusammenfassend auf die genannten Verhaltensweisen; im Deutschen ist »dies« dafür idiomatisch.
- source_word: שומר מצוה
  choice: hält das Gebot
  rationale: »Das Gebot halten« bewahrt die hebräische Ausdrucksweise und lässt offen, ob מצוה kollektiv die göttliche Weisung oder ein bestimmtes Gebot bezeichnet.
theological_decisions:
- issue: Bedeutungsumfang von מצוה im Weisheitskontext
  choice: das Gebot
  alternative: ein Gebot; die Weisung des Gesetzes
  rationale: Der hebräische Singular wird beibehalten, ohne מצוה ausdrücklich mit dem gesamten Gesetz gleichzusetzen. So wird keine engere lehrmäßige Bestimmung in den Text eingetragen.
- issue: Textzugehörigkeit des ersten Satzes
  choice: im Haupttext beibehalten und textkritisch kennzeichnen
  alternative: als angrenzendes Textmaterial aus Vers 22 auslassen
  rationale: Der hebräische Zeuge überliefert den Satz unmittelbar im vorgelegten Zusammenhang, setzt die Verszahl jedoch erst danach. Seine Zugehörigkeit zu diesem Vers bleibt daher unsicher und wird nicht stillschweigend entschieden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter Wegmetaphorik. Die Formulierungen sind für heutige Leser verständlich, ohne den knappen Charakter der hebräischen Weisheitsmahnung aufzulösen.
