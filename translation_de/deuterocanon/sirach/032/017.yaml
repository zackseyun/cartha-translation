  yaml_path: translation/deuterocanon/sirach/032/017.yaml
  text: A wise man will incline himself to reproof[a], but one who is deceived will follow his own desire. A wise man will not conceal anger, but a scoffer will not guard his tongue.
translation:
  language: de
  text: Ein weiser Mann wendet sich Zurechtweisungen zu, doch ein Leichtgläubiger lässt sich von seinem eigenen Verlangen leiten. Ein weiser Mann verbirgt Zorn nicht[b], doch ein Spötter hütet seine Zunge nicht.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Überlieferung lautet: „Er wird die Bitte einer Waise nicht übersehen und auch nicht die Witwe, wenn sie ihre Klage ausschüttet.“ Der hier erhaltene hebräische Text weicht an dieser Stelle erheblich vom griechischen ab.'
    reason: alternative_reading
  - marker: b
    text: Die überlieferte hebräische Wortgruppe ist schwierig; die Übersetzung folgt der möglichen Deutung „Zorn“ beziehungsweise „Grimm“.
    reason: textual_uncertainty
lexical_decisions:
- source_word: איש חכם
  choice: ein weiser Mann
  rationale: Die hebräische Wendung steht grammatisch im maskulinen Singular und ist als sprichwörtliche Personenbezeichnung formuliert.
- source_word: יטה תוכחות
  choice: neigt sich Zurechtweisungen zu
  rationale: יטה bezeichnet ein Neigen oder Sich-Zuwenden; die Formulierung bewahrt dieses Bild und gibt den Plural תוכחות als korrigierende Ermahnungen wieder.
- source_word: ואחר צרכו ימשך נפתה
  choice: doch ein Verführbarer lässt sich von seinem eigenen Verlangen mitziehen
  rationale: נפתה bezeichnet einen leicht zu verführenden oder irregeleiteten Menschen; ימשך ist passivisch als Sich-mitziehen-Lassen gefasst. צרכו kann Bedarf, eigenes Anliegen oder Verlangen meinen; „eigenes Verlangen“ passt zum Gegensatz zur angenommenen Zurechtweisung, ohne die Bildlichkeit des Verbs aufzugeben.
- source_word: לא יכסה כחמה
  choice: verbirgt seinen Zorn nicht
  rationale: Die überlieferte hebräische Formulierung ist schwierig. חמה kann Zorn oder Grimm bedeuten; diese Wiedergabe folgt dem naheliegenden Sinn, während eine Fußnote die sprachliche Unsicherheit offenlegt.
- source_word: לץ
  choice: Spötter
  rationale: לץ ist ein fester Begriff der Weisheitsliteratur für einen hochmütig-spöttischen und unbelehrbaren Menschen.
- source_word: לא ישמר לשונו
  choice: hütet seine Zunge nicht
  rationale: Die deutsche Wendung bewahrt das hebräische Bild vom Bewachen der Zunge und bezeichnet mangelnde Selbstbeherrschung beim Reden.
theological_decisions:
- issue: Stark voneinander abweichende hebräische und griechische Textüberlieferung
  choice: Die erhaltene hebräische Fassung mit ihren zwei Spruchzeilen steht im Haupttext; die griechische Fassung wird in einer Fußnote vollständig dokumentiert.
  alternative: 'Dem griechischen Text folgen: „Er wird die Bitte einer Waise nicht übersehen und auch nicht die Witwe, wenn sie ihre Klage ausschüttet.“'
  rationale: Für Jesus Sirach hat die erhaltene hebräische Überlieferung Vorrang. Die griechische Parallelüberlieferung bietet hier keinen bloßen Wortlautunterschied, sondern einen inhaltlich völlig anderen Vers und muss deshalb sichtbar erhalten bleiben.
- issue: Deutung der schwierigen Wendung לא יכסה כחמה
  choice: „verbirgt seinen Zorn nicht“ mit Hinweis auf die Unsicherheit
  alternative: Eine stärker wörtliche, aber im Deutschen unverständliche Wiedergabe der unvokalisierten Buchstabenfolge
  rationale: חמה lässt die Bedeutung „Zorn/Grimm“ zu, doch die genaue Konstruktion der überlieferten Wendung ist unsicher. Die Übersetzung gibt den wahrscheinlichsten zusammenhängenden Sinn, ohne die Unsicherheit zu verschweigen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter Weisheitssprache. Die parallele Satzstruktur und die Bilder des Sich-Zuneigens, Mitgezogenwerdens und Hütens der Zunge bleiben erhalten; schwer verständliche Altertümlichkeit wird vermieden.
