  source_fidelity: 'Die Übersetzung gibt den wahrscheinlichen Sinn des stark elliptischen hebräischen Weisheitsspruchs treffend wieder: Wenig reden, auch bei großem Wissen, und Wissen mit Schweigen verbinden. Die Ergänzung „du viel weißt“ ist nicht explizit im ersten Glied ausgedrückt, wird aber durch יודֵע im zweiten Glied sinnvoll gestützt. Der abweichende griechische Paralleltext darf hierfür nicht maßgeblich gemacht werden.'
