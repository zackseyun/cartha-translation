  text: Speak briefly[a], though you know much, and be like one who knows and keeps silent.
translation:
  language: de
  text: Rede kurz[a], auch wenn du viel weißt, und sei wie einer, der weiß und schweigt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der hebräische Text ist stark verdichtet und möglicherweise elliptisch. Das erste Satzglied lässt sich nur unsicher wörtlich umschreiben; es enthält die Wörter „sprechen“, „wenig“ und „viel“. Die Übersetzung gibt den wahrscheinlichen Sinn als Aufforderung zu zurückhaltendem Reden wieder. Der griechische Text, der unter dieser Versangabe überliefert ist, entspricht dieser hebräischen Zeile nicht; daher folgt die Übersetzung hier dem Hebräischen als Hauptzeugen.
    reason: textual_variant
lexical_decisions:
- source_word: כל לאמר ומעט הרבה
  choice: Rede kurz, auch wenn du viel weißt
  rationale: Der überlieferte hebräische Wortlaut ist stark verdichtet und möglicherweise elliptisch. Die Wiedergabe versteht מעט im Sinn weniger Worte und ergänzt bei הרבה sinngemäß das bereits im folgenden Glied enthaltene Wissen, ohne die Aussage weiter auszudeuten.
- source_word: ודמה
  choice: und sei wie
  rationale: דמה bezeichnet hier das Gleichsein beziehungsweise Sich-Verhalten wie jemand; die imperativische Wiedergabe führt die Mahnung natürlich fort.
- source_word: ליודע
  choice: einer, der weiß
  rationale: Das ל wird nach דמה vergleichend verstanden. Die substantivierte Partizipialform bleibt allgemein und bezeichnet einen Wissenden.
- source_word: ומחריש יחדו
  choice: und schweigt
  rationale: מחריש bezeichnet bewusstes Schweigen; יחדו verbindet Wissen und Schweigen als gleichzeitig vorhandene Eigenschaften. Im Deutschen bringt die einfache Verbindung mit „und“ dies knapp und ohne zusätzliche Kontrastdeutung zum Ausdruck.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch in knapper weisheitlicher Form. „Rede kurz“ wahrt die Prägnanz; „einer, der weiß und schweigt“ lässt das Nebeneinander von Wissen und bewusstem Schweigen ohne konfessionelle oder psychologisierende Zusätze stehen.
