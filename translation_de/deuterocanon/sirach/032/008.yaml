  terminology: Keine problematischen theologischen oder eigennamlichen Begriffe. „Schweigt“ gibt מחריש angemessen als bewusstes Schweigen wieder. Die Fußnote benötigt jedoch eine vorsichtigere Darstellung des unsicheren Wortlauts, da ihre gegenwärtige angeblich wörtliche Wiedergabe den hebräischen Text nicht verständlich und nicht hinreichend präzise abbildet.
