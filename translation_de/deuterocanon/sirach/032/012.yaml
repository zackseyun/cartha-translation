translation:
  language: de
  text: Und erfülle deinen Wunsch in Ehrfurcht vor Gott und ohne jeden Mangel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Griechisch: „Gib dem Höchsten entsprechend seiner Gabe und mit großzügigem Blick entsprechend dem, was deine Hand findet.“ Der griechische Textzeuge bietet eine wesentlich andere Fassung des Verses als das erhaltene Hebräisch.'
    reason: alternative_reading
lexical_decisions:
- source_word: ושלם
  choice: Und erfülle
  rationale: Die Form von שלם fordert dazu auf, etwas zu vollenden oder zur Erfüllung zu bringen. Zusammen mit רצון gibt „erfülle“ den hebräischen Ausdruck knapp und natürlich wieder.
- source_word: רצון
  choice: deinen Wunsch
  rationale: רצון kann Wunsch, Wille, Wohlgefallen oder Gunst bezeichnen. „Deinen Wunsch“ bewahrt hier den persönlichen Sinn, ohne den knappen hebräischen Ausdruck unnötig festzulegen.
- source_word: ביראת אל
  choice: in Ehrfurcht vor Gott
  rationale: Die geläufige deutsche Wendung „Ehrfurcht vor Gott“ vermittelt die im hebräischen Weisheitsdenken gemeinte, von Achtung und Frömmigkeit geprägte Gottesfurcht. „In“ bewahrt die umstandsbezeichnende Funktion der Präposition ב.
- source_word: אל
  choice: Gott
  rationale: אל ist hier eine allgemeine Gottesbezeichnung und wird im modernen Standarddeutsch am klarsten mit „Gott“ wiedergegeben.
- source_word: ולא בחסר כל
  choice: und ohne jeden Mangel
  rationale: Die hebräische Schlusswendung ist stark verdichtet. חסר bezeichnet Mangel oder Fehlen, und כל verallgemeinert dies umfassend. „Ohne jeden Mangel“ bleibt eng am überlieferten Hebräisch und vermeidet eine nicht ausdrücklich genannte Ergänzung.
theological_decisions:
- issue: Verhältnis des erhaltenen hebräischen Textes zum deutlich abweichenden griechischen Zeugen
  choice: Der Haupttext folgt dem erhaltenen Hebräisch; die wesentlich andere griechische Fassung wird in einer Fußnote vollständig angegeben.
  alternative: „Gib dem Höchsten entsprechend seiner Gabe und mit großzügigem Blick entsprechend dem, was deine Hand findet.“
  rationale: Wo für Jesus Sirach ein belastbarer hebräischer Text erhalten ist, bildet er die Grundlage. Die griechische Fassung bezeugt hier offenbar eine erheblich andere Textform und darf daher weder stillschweigend in den hebräischen Haupttext eingearbeitet noch verschwiegen werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Ehrfurcht vor Gott“ ist gegenüber dem wörtlicheren „Furcht Gottes“ für heutige Leser verständlicher, ohne den Weisheitsbegriff abzuschwächen. Die ungewöhnlich knappe Schlusswendung bleibt bewusst knapp, da das Hebräische keinen eindeutigen Gegenstand des Mangels nennt.
