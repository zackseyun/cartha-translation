  text: Men of falsehood will not attain her[b][a], and men of insolence will not see her.
translation:
  language: de
  text: Menschen der Lüge[a] werden sie nicht erlangen[b], und anmaßende Menschen werden sie nicht sehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich im Hebräischen: „Menschen der Falschheit“. Der griechische Paralleltext hat „unverständige Menschen“; dies kann auf einer abweichenden hebräischen Vorlage oder auf einer deutenden Wiedergabe beruhen.'
    reason: alternative_reading
  - marker: b
    text: Das hebräische Verb bedeutet in seiner üblichen Form „sie führen/leiten“ und ist hier schwierig. Der griechische Paralleltext stützt den Sinn „sie ergreifen“ oder „sie erlangen“.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא יַדְרִיכוּהָ
  choice: werden sie nicht erlangen
  rationale: Die Hifil-Form von דרך bedeutet gewöhnlich „führen/leiten“, ergibt mit der Weisheit als Objekt hier jedoch einen schwierigen Sinn. Der griechische Paralleltext mit καταλήμψονται stützt „ergreifen/erlangen“. „Erlangen“ passt zum Weisheitskontext, ohne den Vers zu einer bloßen Aussage über intellektuelles Begreifen zu verengen.
- source_word: מְתֵי שָׁוְא
  choice: Menschen der Lüge
  rationale: מְתֵי ist eine konstruktgebundene Pluralform „Menschen von“, während שָׁוְא Falschheit, Nichtigkeit oder Täuschung bezeichnen kann. „Menschen der Lüge“ gibt die hebräische Wendung knapp und im Deutschen verständlich wieder.
- source_word: וְאַנְשֵׁי זָדוֹן
  choice: und anmaßende Menschen
  rationale: זָדוֹן bezeichnet hochmütige Anmaßung oder vermessenes Aufbegehren. „Anmaßend“ bewahrt diese moralische Färbung und ist natürlicher als eine substantivische Konstruktion wie „Menschen der Anmaßung“.
- source_word: לֹא יִרְאוּהָ
  choice: werden sie nicht sehen
  rationale: ראה bedeutet unmittelbar „sehen“. Auch wenn im Weisheitskontext Wahrnehmen oder Erkennen mitschwingen kann, wahrt „sehen“ die Bildsprache und entspricht zudem dem griechischen ἴδωσιν.
theological_decisions:
- issue: Verhältnis des erhaltenen hebräischen Textes zum griechischen Paralleltext im schwierigen ersten Halbvers
  choice: Die hebräische Personenbezeichnung bleibt maßgeblich; das schwierige Verb wird mithilfe des griechischen Paralleltextes als „erlangen“ wiedergegeben.
  alternative: '„Menschen der Lüge werden sie nicht leiten“ oder nach dem Griechischen insgesamt: „Unverständige Menschen werden sie niemals ergreifen“.'
  rationale: Der erhaltene hebräische Zeuge hat Vorrang, doch der griechische Paralleltext ist als frühe Text- und Verständnisstütze ernst zu nehmen. So bleibt die hebräische moralische Charakterisierung erhalten, während das Verb einen im Kontext sinnvollen Ausdruck erhält.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Satzstruktur und das feminine Pronomen für die im Zusammenhang personifizierte Weisheit bleiben erhalten; „Menschen“ vermeidet eine unnötig geschlechtsspezifische Verengung der hebräischen Kollektivbezeichnungen.
