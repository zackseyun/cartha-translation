translation:
  language: de
  text: 'Sag nicht: „Er hat mich zu Fall gebracht“[a]; denn er hat gewalttätige Menschen nicht nötig[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Paralleltext lautet: „Er hat mich in die Irre geführt“; dies ist weiter gefasst als das hebräische Bild davon, jemanden zu Fall zu bringen.'
    reason: alternative_reading
  - marker: b
    text: Der griechische Paralleltext hat hier „einen sündigen Menschen“ statt des hebräischen „gewalttätige Menschen“.
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּן תֹּאמַר
  choice: Sag nicht
  rationale: In dieser Weisheitsmahnung hat פן mit Imperfekt verbietende Kraft. „Sag nicht“ gibt sie im modernen Deutschen direkt und natürlich wieder.
- source_word: הוּא
  choice: Er
  rationale: Das Pronomen bezieht sich im Zusammenhang auf Gott. Die Großschreibung am Satzanfang ist regulär und fügt keine zusätzliche Deutung hinzu.
- source_word: הִתְקִילָנִי
  choice: hat mich zu Fall gebracht
  rationale: Die hebräische Form bezeichnet ein Verursachen des Stolperns oder Zu-Fall-Kommens. Diese Formulierung bewahrt das konkrete Bild und klingt im Deutschen natürlicher als „ließ mich stolpern“, ohne dem griechischen „führte mich irre“ zu folgen.
- source_word: כִּי
  choice: denn
  rationale: „Denn“ erhält den begründenden Zusammenhang und den knappen weisheitlichen Stil.
- source_word: אֵין צֹרֶךְ
  choice: hat keinen Bedarf
  rationale: Die Wendung besagt, dass Gott solche Menschen nicht benötigt. „Hat keinen Bedarf an“ ist idiomatisches modernes Deutsch und erhält die Aussage direkt.
- source_word: בְּאַנְשֵׁי חָמָס
  choice: an gewalttätigen Menschen
  rationale: חמס bezeichnet Gewalt beziehungsweise gewaltsames Unrecht. „Gewalttätige Menschen“ bewahrt die spezifischere Aussage des hebräischen Zeugnisses; „Menschen“ gibt die generische Gruppe natürlich wieder.
theological_decisions:
- issue: Soll die Aussage nach dem Hebräischen als Verursachen eines Falls oder nach dem griechischen Paralleltext als Irreführung wiedergegeben werden?
  choice: Er hat mich zu Fall gebracht
  alternative: Er hat mich irregeführt
  rationale: Der erhaltene, als zuverlässig eingestufte hebräische Text ist die primäre Grundlage und bewahrt das konkrete Bild des Stolperns beziehungsweise Falls. Die weitere Bedeutung des griechischen Paralleltexts wird in einer Fußnote dokumentiert.
- issue: Soll חָמָס spezifisch als Gewalttätigkeit oder unter Einfluss des Griechischen allgemein als Sündhaftigkeit übersetzt werden?
  choice: gewalttätige Menschen
  alternative: ein sündiger Mensch / Sünder
  rationale: Das Hebräische nennt ausdrücklich Menschen der Gewalt beziehungsweise des gewaltsamen Unrechts. Die allgemeinere griechische Lesart darf diese spezifische ethische Kategorie im Haupttext nicht verdrängen.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit knapper weisheitlicher Satzführung. Das konkrete hebräische Bild und die spezifische Bezeichnung von Gewalt bleiben erhalten; relevante Abweichungen des griechischen Paralleltexts stehen in den Fußnoten.
