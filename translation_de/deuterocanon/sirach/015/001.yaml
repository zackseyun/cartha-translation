base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/015/001.yaml
  text: He who fears Yahweh will do this[b][a], and he who grasps the law will attain her.
translation:
  language: de
  text: Wer den HERRN fürchtet, wird dies tun, und wer an der Weisung[a] festhält, wird sie erlangen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort תּוֹרָה kann auch mit „Tora“ oder „Gesetz“ wiedergegeben werden.
    reason: lexical_alternative
  - marker: b
    text: Die überlieferte hebräische Verbform ist hier schwierig und kann an ein Führen denken lassen. Die griechische Fassung lautet „wird sie erlangen“; „sie“ bezeichnet im Zusammenhang die Weisheit.
    reason: textual_variant
lexical_decisions:
- source_word: יְרֵא יְהֹוָה
  choice: Wer den HERRN fürchtet
  rationale: Das substantivisch gebrauchte Partizip wird im Deutschen natürlich und geschlechterübergreifend mit „Wer …“ wiedergegeben. Der Gottesname יהוה erscheint gemäß der üblichen Bibelkonvention als „der HERR“.
- source_word: יַעֲשֶׂה זֹאת
  choice: wird dies tun
  rationale: Die feminine Singularform des Demonstrativpronomens bedeutet unmittelbar „dies“. Die knappe Formulierung bewahrt den nicht ausdrücklich genannten Bezug.
- source_word: וְתוֹפֵשׂ תּוֹרָה
  choice: und wer an der Weisung festhält
  rationale: תפש bezeichnet ein festes Ergreifen oder Festhalten. „An … festhält“ bewahrt das Bild in idiomatischem Deutsch. „Weisung“ lässt bei תּוֹרָה sowohl die göttliche Unterweisung als auch die Tora anklingen, ohne den Ausdruck auf ein modernes Gesetzesverständnis zu verengen.
- source_word: יַדְרִיכֶנָּה
  choice: wird sie erlangen
  rationale: Die überlieferte hebräische Verbform ist in diesem Zusammenhang schwierig. Die griechische Parallele καταλήμψεται αὐτήν stützt „wird sie erlangen“; das feminine Pronomen verweist im weiteren Zusammenhang auf die personifizierte Weisheit.
theological_decisions:
- issue: Bezug des femininen Pronomens im letzten Satzteil
  choice: „sie“ bezieht sich im Zusammenhang auf die personifizierte Weisheit.
  alternative: Das Pronomen könnte enger mit der Weisung/Tora verbunden oder der schwierige hebräische Ausdruck als eine Form des Führens verstanden werden.
  rationale: Sirach 14,20–15,10 stellt die Weisheit als Frau dar, und die griechische Parallele hat ausdrücklich ein feminines Objekt. Das Pronomen „sie“ erhält die Personifikation, während die Fußnote die textliche Schwierigkeit offenlegt.
- issue: Wiedergabe von תּוֹרָה
  choice: Weisung
  alternative: Tora; Gesetz
  rationale: „Weisung“ gibt den Bedeutungsumfang des hebräischen Wortes verständlich wieder. Die Alternativen werden in der Fußnote genannt, damit sein spezifisch jüdischer und bundestheologischer Gehalt nicht verloren geht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper sprichwörtlicher Satzform. „Wer“ vermeidet unnötig männlich markierte Sprache; „der HERR“ folgt der etablierten typografischen Wiedergabe des Gottesnamens. Die Mehrdeutigkeit von תּוֹרָה und die Schwierigkeit des Schlussverbs werden nicht stillschweigend beseitigt, sondern in Fußnoten kenntlich gemacht.
