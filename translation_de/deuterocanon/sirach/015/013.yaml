base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/015/013.yaml
  text: Yahweh hates evil and abomination[a], and he will not permit it to those who fear him.
translation:
  language: de
  text: Böses und Abscheuliches hasst Jahwe, und er lässt es denen, die ihn fürchten, nicht widerfahren.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Parallelüberlieferung lautet: „Und denen, die ihn fürchten, ist es nicht lieb (oder: angenehm).“ Der hebräische Text hat dagegen: „Und er lässt es denen, die ihn fürchten, nicht widerfahren.“'
    reason: alternative_reading
lexical_decisions:
- source_word: רָעָה
  choice: Böses
  rationale: Im Zusammenhang mit תוֹעֵבָה bezeichnet das Wort moralisch Böses, nicht Unglück oder eine Katastrophe.
- source_word: תוֹעֵבָה
  choice: Abscheuliches
  rationale: Die substantivierte Form gibt das von Gott Verabscheute in kräftigem, zugleich verständlichem Deutsch wieder, ohne den Begriff unnötig auf kultische Vergehen einzuengen.
- source_word: שָׂנֵא
  choice: hasst
  rationale: Das Präsens entspricht der sprichwortartigen Aussage des hebräischen Satzes und gibt die starke Ablehnung unmittelbar wieder.
- source_word: יְהֹוָה
  choice: Jahwe
  rationale: Die gebräuchliche deutsche Wiedergabe des im hebräischen Ausgangstext stehenden Gottesnamens bewahrt dessen Eigennamencharakter.
- source_word: וְלֹא יְאַנֶּנָּה
  choice: und er lässt es … nicht widerfahren
  rationale: Die Formulierung folgt dem hoch bewerteten hebräischen Zeugnis und gibt die Vorstellung wieder, dass Jahwe es nicht geschehen lässt. Das Pronomen „es“ nimmt die zuvor zusammen genannte Wirklichkeit des Bösen und Abscheulichen auf.
- source_word: לִירֵאָיו
  choice: denen, die ihn fürchten
  rationale: Diese geläufige biblische Wendung bezeichnet Menschen, die Gott ehrfürchtig begegnen, ohne die Bedeutung auf bloße Angst zu reduzieren.
theological_decisions:
- issue: Abweichung zwischen dem hebräischen Text und der griechischen Parallele im zweiten Satzteil
  choice: 'Dem Hebräischen folgen: „er lässt es denen, die ihn fürchten, nicht widerfahren“'
  alternative: 'Nach dem Griechischen: „und denen, die ihn fürchten, ist es nicht lieb/angenehm“'
  rationale: Da ein hoch bewertetes hebräisches Zeugnis vorliegt, bildet es die Grundlage des Haupttextes. Die deutlich abweichende griechische Lesart wird in einer Fußnote offengelegt, statt beide Aussagen miteinander zu harmonisieren.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Voranstellung von „Böses und Abscheuliches“ bewahrt den Nachdruck des hebräischen Satzbaus. „Nicht widerfahren lassen“ hält die ungewöhnliche und theologisch spannungsvolle Aussage des hebräischen Zeugnisses fest.
