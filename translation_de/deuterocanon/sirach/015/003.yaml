  text: He will feed him with the bread of understanding[b][a], and give him the water of insight to drink.
translation:
  language: de
  text: Sie wird ihn mit dem Brot der Einsicht speisen und ihm Wasser des Verständnisses zu trinken geben.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die griechische Überlieferung hat hier »Wasser der Weisheit« statt »Wasser des Verständnisses«.
    reason: textual_variant
lexical_decisions:
- source_word: וְהֶאֱכִילַתְהוּ
  choice: Sie wird ihn … nähren
  rationale: Die Hifil-Form von אכל bedeutet »zu essen geben, speisen«. Die feminine Singularform verweist im Zusammenhang auf die personifizierte Weisheit. »Nähren« gibt die Handlung natürlich wieder, ohne das Bild des Brotes aufzulösen.
- source_word: לֶחֶם
  choice: Brot
  rationale: Das konkrete Bild wird bewahrt und bildet mit dem Wasser das metaphorische Wortpaar des Verses.
- source_word: שָׂכֶל
  choice: Einsicht
  rationale: שכל bezeichnet verständige Einsicht oder guten Verstand. »Einsicht« ist im Deutschen würdig und verständlich und lässt sich von תבונה unterscheiden.
- source_word: וּמֵי
  choice: Wasser
  rationale: Obwohl מַיִם formal pluralisch ist, verlangt der deutsche Sprachgebrauch hier den Stoffbegriff im Singular.
- source_word: תְבוּנָה
  choice: Erkenntnis
  rationale: תבונה bezeichnet Verständnis, Urteilsvermögen oder Erkenntnis. »Erkenntnis« wahrt eine erkennbare Nuance gegenüber שכל, ohne die verwandten Bedeutungsfelder künstlich weit zu trennen.
- source_word: תַּשְׁקֶנּוּ
  choice: ihm … zu trinken geben
  rationale: שקה bedeutet »tränken, zu trinken geben«. Die gewählte Formulierung ist im modernen Deutschen natürlich und erhält den Inhalt der Kausativform.
theological_decisions:
- issue: Geschlecht des unausgesprochenen Subjekts
  choice: »Sie« als Verweis auf die personifizierte Weisheit
  alternative: Ein nicht näher bestimmtes maskulines Subjekt
  rationale: Die hebräischen Verbformen sind feminin singularisch, und der Zusammenhang nennt die Weisheit als handelndes Subjekt. Daher sollte das Deutsche die Personifikation ausdrücklich mit »sie« fortführen.
- issue: Unterschied zwischen den beiden Weisheitsbegriffen
  choice: שכל mit »Einsicht« und תבונה mit »Erkenntnis« wiedergeben
  alternative: Beide Begriffe mit »Verständnis« wiedergeben
  rationale: Die beiden Wörter überschneiden sich semantisch, sind aber nicht identisch. Unterschiedliche, eng verwandte deutsche Begriffe bewahren die poetische Spannung, ohne eine starre fachsprachliche Unterscheidung zu behaupten.
translation_notes:
  register: Modernes, gehobenes Standarddeutsch. Die parallelen Bilder von Brot und Wasser bleiben erhalten; der Satz folgt der hebräischen Zukunftsfolge und macht das im Zusammenhang eindeutig feminine Subjekt sichtbar.
