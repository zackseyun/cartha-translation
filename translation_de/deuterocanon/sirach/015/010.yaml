translation:
  language: de
  text: Aus dem Mund eines Weisen wird Lob ausgesprochen; wer es beherrscht, wird es lehren.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Parallelüberlieferung lautet: »Denn in Weisheit wird Lob gesprochen, und der Herr wird ihm Gelingen schenken.« Das griechische Pronomen kann sich auch auf das dort grammatisch männliche Wort für »Lob« beziehen.'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּפֶה חָכָם
  choice: Aus dem Mund eines Weisen
  rationale: Die Wendung bewahrt das hebräische Bild des Mundes als Ursprung der Rede. Der Singular חָכָם wird als allgemeine, geschlechtsübergreifend verständliche Personenbezeichnung wiedergegeben.
- source_word: תֵּאָמֵר תְּהִלָּה
  choice: wird Lob gesprochen
  rationale: Der Nifal-Imperfekt wird entsprechend dem sprichwortartigen Zusammenhang als allgemeine Aussage wiedergegeben. תְּהִלָּה bedeutet hier am natürlichsten „Lob“; auch das griechische αἶνος stützt diese Bedeutung.
- source_word: וּמשֵׁל בָּהּ
  choice: wer es beherrscht
  rationale: משל bezeichnet Herrschaft oder Verfügungsmacht. „beherrscht“ ist im Deutschen natürlicher als „darüber herrscht“, bewahrt aber den Gedanken der Meisterschaft. „es“ lässt den knappen und nicht völlig eindeutigen Bezug des hebräischen Femininpronomens offen.
- source_word: יִלַמְּדֶנָּה
  choice: wird es lehren
  rationale: Die Wiedergabe folgt eng dem Verb למד („lehren“) und dem femininen Objektsuffix. Das deutsche „es“ bezieht sich grammatisch auf „Lob“, ohne die gedrängte Ausdrucksweise des Hebräischen auszudeuten.
theological_decisions:
- issue: Verhältnis der erhaltenen hebräischen zweiten Vershälfte zur griechischen Parallelüberlieferung
  choice: 'Die erhaltene hebräische Lesart steht im Haupttext: „wer es beherrscht, wird es lehren“.'
  alternative: 'Die griechische Parallelüberlieferung bietet: „und der Herr wird ihm Gelingen schenken“, wobei sich das Pronomen auch auf das griechische Wort für „Lob“ beziehen kann.'
  rationale: Da der hebräische Text erhalten, sicher bezeugt und als primäre Ausgangsbasis vorgegeben ist, bestimmt er den Haupttext. Die erheblich abweichende griechische Lesart wird in einer Fußnote dokumentiert, ohne beide Fassungen harmonisierend miteinander zu vermischen.
translation_notes:
  register: Moderne, würdige Standardsprache mit sprichwortartiger Kürze. Die leicht ungewohnte Formulierung „es beherrscht ... es lehren“ erhält bewusst die gedankliche Dichte und Mehrdeutigkeit des hebräischen zweiten Halbverses.
