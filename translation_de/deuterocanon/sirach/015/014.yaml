base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/015/014.yaml
  text: God[a], from the beginning, created man, and placed him in the hand of his own violence[b]; he gave him over to the hand of his own inclination.
translation:
  language: de
  text: Gott schuf den Menschen von Anfang an und setzte ihn in die Hand seiner eigenen Gewalt[a]; er gab ihn in die Hand seiner eigenen Neigung.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das hebräische Wort, das hier mit „Gewalt“ wiedergegeben wird, ist textlich und lexikalisch schwierig. Griechisch: „und er ließ ihn in der Hand seines eigenen Ratschlusses.“'
    reason: alternative_reading
lexical_decisions:
- source_word: מִבְּרֵאשִׁית
  choice: von Anfang an
  rationale: Gibt die temporale Bedeutung von מן + ראשית natürlich wieder und wird durch das griechische ἐξ ἀρχῆς bestätigt.
- source_word: בָּרָא
  choice: schuf
  rationale: Entspricht dem üblichen Schöpfungsverb ברא, besonders mit Gott als Subjekt.
- source_word: אָדָם
  choice: den Menschen
  rationale: Der singularische Ausdruck bezeichnet hier den Menschen repräsentativ und kann die Menschheit kollektiv einschließen.
- source_word: וַיְשִׁיתֵהוּ
  choice: stellte ihn
  rationale: Bewahrt die Grundbedeutung von שית und passt zur folgenden Hand-Metapher.
- source_word: בְּיַד
  choice: in die Hand
  rationale: Erhält das hebräische Bild von Verfügungsgewalt beziehungsweise Kontrolle.
- source_word: חוֹתְפוֹ
  choice: seiner eigenen Gewalt
  rationale: Die schwierige Form wird möglichst nah an der Bedeutung von gewaltsamem Ergreifen wiedergegeben; die Unsicherheit wird durch eine Fußnote kenntlich gemacht.
- source_word: וַיִּתְּנֵהוּ
  choice: er gab ihn
  rationale: Gibt נתן mit ביד schlicht und bildgetreu wieder, ohne die Aussage unnötig zu verstärken.
- source_word: יִצְרוֹ
  choice: seiner eigenen Neigung
  rationale: יצר bezeichnet in weisheitlicher Anthropologie die innere Neigung oder Disposition; „Neigung“ wahrt dabei eine mögliche moralische Offenheit.
theological_decisions:
- issue: Menschliche moralische Selbstbestimmung
  choice: Gott schafft den Menschen und überlässt ihn seiner eigenen inneren Verfügungsgewalt und Neigung, ohne absolute Autonomie zu behaupten.
  alternative: Gott ließ ihn in der Hand seines eigenen Ratschlusses.
  rationale: Der schwierige hebräische Text und die griechische Parallele weisen beide auf menschliche Selbstleitung, unterscheiden sich aber in deren genauer Beschreibung. Die Übersetzung bewahrt diese Spannung und löst sie nicht zugunsten einer bestimmten Willenslehre auf.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wiederholte Hand-Metapher des Hebräischen bleibt erhalten; „den Menschen“ ist idiomatisch und kann hier den einzelnen Menschen wie auch die Menschheit repräsentieren.
