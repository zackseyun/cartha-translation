base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/015/005.yaml
  text: And he will exalt him above his companions[a], and in the midst of the assembly he will open his mouth.
translation:
  language: de
  text: Sie wird ihn über seine Gefährten erheben[a], und mitten in der Versammlung wird sie seinen Mund öffnen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „über seinen Gefährten“. Im Hebräischen steht die Einzahl; der griechische Paralleltext hat jedoch die Mehrzahl „seine Nächsten“, die wahrscheinlich dem hier gemeinten weiteren Sinn entspricht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרוֹמְמַתְהוּ
  choice: Sie wird ihn … erheben
  rationale: Das Verb רומם bezeichnet ein Erhöhen, das zugleich öffentliche Auszeichnung ausdrücken kann. „Erheben“ bewahrt dieses Bild und entspricht dem griechischen ὑψώσει.
- source_word: מֵרֵעֵהוּ
  choice: über seine Gefährten
  rationale: Das hebräische רֵעַ steht formal im Singular, kann hier aber kollektiv verstanden werden. Der griechische Paralleltext mit dem Plural τοὺς πλησίον αὐτοῦ stützt die soziale Mehrzahl; „Gefährten“ bezeichnet passend die Menschen seines Umfelds.
- source_word: וּבְתוֹךְ קָהָל
  choice: mitten in der Versammlung
  rationale: Die Wendung gibt den öffentlichen Ort der Rede konkret wieder. „Versammlung“ ist für קָהָל neutraler als das stärker religiös geprägte „Gemeinde“.
- source_word: תִּפְתַּח פִּיו
  choice: wird sie seinen Mund öffnen
  rationale: Die konkrete hebräische Redewendung wird beibehalten, statt sie auf „ihn sprechen lassen“ zu verkürzen; sie bezeichnet die Befähigung zu öffentlicher Rede.
theological_decisions:
- issue: Subjekt der Verben
  choice: Die Weisheit wird durch „sie“ als handelndes Subjekt wiedergegeben.
  alternative: Ein nicht näher bestimmtes männliches oder unpersönliches Subjekt könnte aus dem Zusammenhang ergänzt werden.
  rationale: Die hebräischen Verbformen וְרוֹמְמַתְהוּ und תִּפְתַּח sind feminin Singular und weisen im Zusammenhang auf die personifizierte Weisheit zurück. Daher folgt die deutsche Fassung der Grammatik des hebräischen Textes, ohne die Weisheit mit Gott gleichzusetzen oder beide voneinander zu trennen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die bildhaften Wendungen „erheben“ und „seinen Mund öffnen“ bleiben erhalten; Satzbau und Wortwahl sind zugleich für heutige Leser unmittelbar verständlich.
