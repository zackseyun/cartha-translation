  terminology: »Jahwe« gibt den ausdrücklich vorhandenen Gottesnamen wieder und stimmt mit der maßgeblichen theologischen Entscheidung im Audit Trail überein. »Weisheit«, »Kraft« und »alles« sind terminologisch konsistent und kontextgerecht. Der Fußnotenanker ist korrekt gesetzt und die Fußnote erläutert die relevante Alternative sachlich.
