translation:
  language: de
  text: Denn die Weisheit Jahwes ist groß[a]; er ist mächtig an Kraft und sieht alles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische סָפְקָה kann auch »genügt«, »ist hinreichend« oder möglicherweise »hat gegeben« bedeuten. Die griechische Parallelüberlieferung hat »groß/reichlich« und stützt damit die Wiedergabe »ist groß«.
    reason: lexical_alternative
lexical_decisions:
- source_word: סָפְקָה
  choice: ist groß
  rationale: Das hebräische Wort kann Fülle oder Genügen ausdrücken und möglicherweise auch als Verbform im Sinn von »hat gegeben/geliefert« verstanden werden. Das griechische πολλὴ stützt hier die prädikative Bedeutung »groß/reichlich«. »Ist groß« ist im Deutschen natürlich und wahrt die Aussage über die Fülle der göttlichen Weisheit.
- source_word: חָכְמַת
  choice: die Weisheit
  rationale: Die übliche und kontextgerechte Wiedergabe von חָכְמָה.
- source_word: יְהֹוָה
  choice: Jahwes
  rationale: Der im hebräischen Text ausdrücklich stehende Gottesname wird in der im Deutschen geläufigen Form »Jahwe« wiedergegeben; der Status constructus wird natürlich durch den Genitiv ausgedrückt.
- source_word: אַמִּיץ גְּבוּרוֹת
  choice: mächtig an Kraft
  rationale: אַמִּיץ bezeichnet Stärke oder Macht. Der Plural גְּבוּרוֹת kann Kraft, Machterweise oder mächtige Taten bezeichnen. Die abstrakte Wiedergabe wird durch das griechische ἰσχυρὸς ἐν δυναστείᾳ gestützt, ohne die Wendung auf einzelne Taten festzulegen.
- source_word: וְחוֹזֶה כֹל
  choice: und sieht alles
  rationale: חזה bedeutet »sehen/schauen«; zusammen mit כֹל wird Gottes umfassende Wahrnehmung ausgedrückt. »Sieht alles« ist klar, knapp und idiomatisch.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Ausgangstext enthält den Eigennamen ausdrücklich. »Jahwe« bewahrt diesen als Namen, ohne ihn durch einen Titel zu ersetzen.
- issue: Umfang des göttlichen Sehens
  choice: sieht alles
  alternative: sieht alle Dinge
  rationale: כֹל bezeichnet hier umfassend alles. Die knappe Form wahrt die uneingeschränkte Aussage, ohne sie näher zu systematisieren.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Parallelstruktur des hebräischen Satzes bleibt erhalten; »mächtig an Kraft« bewahrt dabei bewusst den leicht gehobenen Ausdruck des Ausgangstextes.
