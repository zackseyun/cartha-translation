  source_fidelity: Der Entwurf folgt dem vollständigen hebräischen Text, einschließlich des gegenüber der griechischen Parallelüberlieferung längeren Schlusssatzes. »Kraft gegeben« ist für הֶחֱלִים als vorsichtige Wiedergabe von »stärken« vertretbar. אַנְשֵׁי כָזָב ist jedoch weiter als bloß »Lügner« und bezeichnet Menschen, die durch Falschheit bzw. Täuschung geprägt sind.
  naturalness: Der Text ist grundsätzlich modernes, würdevolles Deutsch. Die Verbindung »kein Erbarmen mit … oder mit …« ist unter der Verneinung verständlich, aber weniger klar und weniger quellennah als eine und-Verbindung bzw. »weder … noch«.
  terminology: »Menschen der Falschheit« wahrt die Breite von אַנְשֵׁי כָזָב besser als »Lügner«. »Vergebliches tut« und »ein Geheimnis preisgibt« sind angemessen; sie vermeiden eine unbegründete dogmatische oder rechtliche Präzisierung.
