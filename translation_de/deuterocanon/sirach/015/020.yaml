  text: He did not command anyone to be ungodly, and he did not permit anyone to sin.
translation:
  language: de
  text: Er hat keinem Menschen befohlen zu sündigen und Menschen der Falschheit keine Kraft gegeben.[a] Er hat kein Erbarmen mit dem, der Vergebliches tut, und mit dem, der ein Geheimnis preisgibt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Paralleltext lautet abweichend: »Er befahl niemandem, gottlos zu handeln, und gab niemandem die Freiheit zu sündigen.« Die anschließende Aussage über Erbarmen, vergebliches Tun und das Preisgeben eines Geheimnisses fehlt dort.'
    reason: Die griechische Überlieferung bietet sowohl im zweiten Satzteil als auch im Umfang des Verses eine bedeutende Textvariante.
lexical_decisions:
- source_word: אֱנוֹשׁ
  choice: Mensch
  rationale: Das hebräische Singularwort bezeichnet hier allgemein einen Menschen; »keinem Menschen« gibt den verneinten generischen Sinn natürlich wieder.
- source_word: הֶחֱלִים
  choice: Kraft gegeben
  rationale: Die Kausativform von חלם bedeutet hier wahrscheinlich »stark machen« oder »Kraft geben«. Die Formulierung bleibt nahe am bezeugten hebräischen Text, ohne sie mit der abweichenden griechischen Lesart »erlauben« gleichzusetzen.
- source_word: אַנְשֵׁי כָזָב
  choice: Lügner
  rationale: Wörtlich »Männer der Lüge/Falschheit«; »Lügner« ist im modernen Deutschen knapp und idiomatisch.
- source_word: עֹשֶׂה שָׁוְא
  choice: der Vergebliches tut
  rationale: שָׁוְא kann Nichtigkeit, Vergeblichkeit, Falschheit oder Unrecht bezeichnen. »Vergebliches« bewahrt die semantische Offenheit besser als eine eindeutige moralische Festlegung.
- source_word: מְגַלֶּה סוֹד
  choice: der ein Geheimnis preisgibt
  rationale: Die Wendung bezeichnet jemanden, der Vertrauliches aufdeckt; »preisgibt« ist natürlich und trägt den negativen Beiklang.
theological_decisions:
- issue: Gottes Verhältnis zur menschlichen Sünde
  choice: Gott befiehlt keinem Menschen zu sündigen und gibt Lügnern keine Kraft.
  alternative: »Er befahl niemandem, gottlos zu handeln, und erlaubte niemandem zu sündigen« nach dem griechischen Paralleltext.
  rationale: Der hoch bewertete hebräische Ausgangstext wird vorrangig übersetzt. Er weist Sünde nicht Gottes Gebot zu, formuliert den zweiten Gedanken jedoch anders als die griechische Überlieferung; diese Spannung wird nicht harmonisiert.
- issue: Aussage über Erbarmen
  choice: Die negative Aussage des hebräischen Textes wird ohne dogmatische Abschwächung wiedergegeben.
  alternative: Den Satz auslassen, wie es der kürzere griechische Paralleltext und die englische Konsultationsfassung nahelegen könnten.
  rationale: Die übermittelte hebräische Quelle enthält den Satz ausdrücklich. Seine theologische Härte wird weder beseitigt noch durch ergänzende Bedingungen erklärt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Formulierungen sind verständlich, bleiben aber eng an der hebräischen Bild- und Begriffswelt. Die koordinierte Negation wurde im Deutschen zur Klarheit wiederholt; »oder« gibt die Reichweite der Verneinung in der zweiten Aussage idiomatisch wieder.
