base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/015/015.yaml
  text: If you desire[a], you will keep the commandment, and to act faithfully is a matter of your good pleasure. If you trust in him[c][b], you too will live.
translation:
  language: de
  text: Wenn du willst, wirst du das Gebot[a] halten; und Einsicht besteht darin, seinen Willen zu tun.[b] Wenn du ihm vertraust,[c] wirst auch du leben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Hebräischen steht „Gebot“ in der Einzahl; die griechische Parallelüberlieferung hat „Gebote“ im Plural.
    reason: textual_variant
  - marker: b
    text: 'Das hebräische Mittelglied ist sprachlich schwierig. Die griechische Parallelüberlieferung lautet wörtlich etwa: „und Treue zu üben [ist] des Wohlgefallens“; sie kann auf einer anderen hebräischen Vorlage oder auf einer deutenden Übersetzung beruhen.'
    reason: alternative_reading
  - marker: c
    text: 'Oder: „Wenn du an ihn glaubst“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם תַּחְפֹּץ
  choice: Wenn du willst
  rationale: חפץ bezeichnet hier Wollen oder Begehren. „Wenn du willst“ gibt die willentliche Bedingung natürlich wieder, ohne daraus eine weitergehende Aussage über menschliche Willensfreiheit zu machen.
- source_word: תִּשְׁמֹר מִצְוָה
  choice: wirst du das Gebot halten
  rationale: Der hebräische Text hat מִצְוָה im Singular. „Das Gebot halten“ wahrt diese Form und lässt zugleich einen umfassenden Sinn zu.
- source_word: וְתָבִינָה
  choice: und Einsicht bedeutet
  rationale: Die überlieferte Form lässt sich als Bezeichnung für „Einsicht/Verständnis“ auffassen. Die kopulative Wiedergabe ergibt zusammen mit dem folgenden Infinitiv einen verständlichen deutschen Satz, ohne die schwierige Stelle vorschnell an den griechischen Wortlaut anzugleichen.
- source_word: לַעֲשׂוֹת רְצוֹנוֹ
  choice: seinen Willen zu tun
  rationale: 'Dies entspricht unmittelbar dem hebräischen Wortlaut: לעשות „zu tun“ und רצונו „seinen Willen“. Das männliche Suffix bleibt wie im Ausgangstext erhalten.'
- source_word: אִם תַּאֲמִין בּוֹ
  choice: Wenn du ihm vertraust
  rationale: אמן mit ב kann Vertrauen oder Glauben an eine Person ausdrücken. „Ihm vertrauen“ ist im heutigen Deutsch idiomatisch und bewahrt den relationalen Sinn.
- source_word: גַּם אַתָּה תִּחְיֶה
  choice: wirst auch du leben
  rationale: „Auch du“ gibt die Hervorhebung durch גַּם אַתָּה wieder; תִּחְיֶה bedeutet schlicht „du wirst leben“.
theological_decisions:
- issue: Spannung zwischen dem schwierigen hebräischen Mittelglied und der griechischen Parallelüberlieferung
  choice: und Einsicht bedeutet, seinen Willen zu tun
  alternative: und treu zu handeln, steht in deinem Wohlgefallen
  rationale: Da ein hebräischer Text vorliegt, folgt der Haupttext dessen klar erkennbaren Bestandteilen „Einsicht“, „tun“ und „sein Wille“. Die abweichende griechische Fassung wird in einer Fußnote genannt, statt unbemerkt zur Grundlage des Haupttextes gemacht zu werden.
- issue: Menschliches Wollen und Gehorsam
  choice: Wenn du willst, wirst du das Gebot halten
  alternative: Wenn du dich entscheidest, kannst du die Gebote halten
  rationale: Die bedingte und willentliche Aussage wird bewahrt, aber nicht zu einer philosophischen oder konfessionellen Lehre über einen autonomen freien Willen ausgebaut.
- issue: Bedeutung von אמן mit ב
  choice: ihm vertraust
  alternative: an ihn glaubst
  rationale: Beide Bedeutungsnuancen sind möglich. Der Haupttext wählt die relationale Bedeutung „vertrauen“; die Alternative wird offen ausgewiesen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Das Gebot halten“ bewahrt die biblisch-weisheitliche Ausdrucksweise, bleibt aber allgemein verständlich. Das Semikolon markiert die enge Verbindung der beiden Aussagen, ohne die schwierige Syntax des Hebräischen künstlich zu glätten.
