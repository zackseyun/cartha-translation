translation:
  language: de
  text: Vor den Menschen liegen Leben und Tod.[a] Was immer er begehrt,[b] wird ihm gegeben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Für die Menschen gibt es Leben und Tod.« Die hebräische Präposition lässt diese Deutung zu; das griechische Parallelzeugnis unterstützt jedoch den Sinn »vor den Menschen«.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: »Was immer er wählt.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי אָדָם
  choice: Vor den Menschen liegen
  rationale: Die hebräische Wendung bedeutet wörtlich »den/für die Menschen«; das griechische Parallelzeugnis ἔναντι ἀνθρώπων stützt jedoch die räumlich-bildhafte Aussage, dass die Möglichkeiten vor den Menschen liegen. Das ergänzte »liegen« ergibt im Deutschen eine natürliche Formulierung.
- source_word: חַיִּים וָמָוֶת
  choice: Leben und Tod
  rationale: Die beiden Substantive bezeichnen die einander gegenüberstehenden Möglichkeiten. Das formal plurale חַיִּים wird idiomatisch mit dem deutschen Singular »Leben« wiedergegeben.
- source_word: אֲשֶׁר יַחְפֹּץ
  choice: Was er davon begehrt
  rationale: חפץ bezeichnet Begehren, Gefallen oder Wollen. »begehrt« bewahrt diese willentliche Nuance, ohne sie auf einen rein verstandesmäßigen Wahlakt zu verengen; »davon« bezieht die Aussage verständlich auf Leben und Tod zurück.
- source_word: יִנָּתֵן לוֹ
  choice: wird ihm gegeben
  rationale: Die Passivform von נתן wird unmittelbar wiedergegeben. So bleibt der im Vers nicht ausdrücklich genannte Handelnde auch in der Übersetzung ungenannt.
theological_decisions:
- issue: Menschliche Entscheidungsfreiheit und das nicht genannte Handeln Gottes
  choice: Der Vers stellt Leben und Tod als Möglichkeiten vor die Menschen und sagt, dass einem Menschen das von ihm Begehrte gegeben wird; der Geber bleibt ungenannt.
  alternative: Die Aussage ausdrücklich als autonome menschliche Selbstbestimmung oder umgekehrt als göttliche Vorherbestimmung auslegen.
  rationale: Weder der hebräische Text noch das griechische Parallelzeugnis lösen das Verhältnis von menschlichem Wollen und göttlichem Handeln systematisch auf. Die passive Formulierung bewahrt diese Spannung.
- issue: Generisches Menschsein und grammatischer Numeruswechsel
  choice: »den Menschen« für die kollektive Wendung לִבְנֵי אָדָם, danach generisches Singularpronomen »er/ihm«
  alternative: Den gesamten Vers pluralisieren oder durchgehend mit »der Mensch« formulieren.
  rationale: Damit bleibt der Wechsel des Ausgangstextes von der Menschheit als Gesamtheit zum einzelnen Menschen grammatisch sichtbar, ohne לִבְנֵי אָדָם wörtlich und missverständlich als »Menschensöhne« wiederzugeben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Bildsprache »vor den Menschen liegen« ist gut verständlich; »begehrt« ist bewusst etwas gehobener als »will«, entspricht aber der Bedeutungsbreite von חפץ und bewahrt die Spannung zwischen Wunsch und Wahl.
