translation:
  language: de
  text: Sie ist fern von Spöttern,[a] und Lügner werden sich nicht an sie erinnern.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Griechisch: „Sie ist fern vom Hochmut, und lügnerische Männer werden sich gewiss nicht an sie erinnern.“ Der hebräische Text hat „Spötter“, wo im Griechischen „Hochmut“ steht; möglicherweise liegt eine abweichende hebräische Vorlage oder eine deutende Wiedergabe vor.'
    reason: alternative_reading
lexical_decisions:
- source_word: רְחוֹקָה הִיא
  choice: Sie ist fern
  rationale: Die feminine Form und das Pronomen führen die im Kontext personifizierte Weisheit fort; „fern sein“ bewahrt das räumliche Bild in natürlichem Deutsch.
- source_word: מִלֵּצִים
  choice: von Spöttern
  rationale: לֵצִים bezeichnet höhnische, überhebliche Spötter. Der hebräische Haupttext wird gegenüber dem abweichenden griechischen Paralleltext bevorzugt.
- source_word: וְאַנְשֵׁי כָזָב
  choice: und Menschen der Lüge
  rationale: Die Wiedergabe hält die hebräische Wendung „Männer/Menschen der Falschheit“ sichtbar und bezeichnet Personen, deren Wesen oder Handeln von Lüge geprägt ist. „Menschen“ ist im heutigen Deutsch natürlich und schließt den generischen Sinn der maskulinen Personenbezeichnung ein.
- source_word: לֹא יִזְכְּרוּהָ
  choice: werden sich nicht an sie erinnern
  rationale: זכר im Qal bedeutet hier „sich erinnern/an jemanden denken“; die griechische Parallele bestätigt den Erinnerungssinn.
theological_decisions:
- issue: Bezug und Personifikation des femininen Pronomens
  choice: Die Weisheit wird mit „sie/ihr“ als weiblich personifiziert wiedergegeben.
  alternative: Abstrakte Wiedergabe der Weisheit mit „es“ beziehungsweise ohne personales Pronomen.
  rationale: Der unmittelbare Zusammenhang führt die Weisheit in weiblich-personaler Sprache ein. Die Übersetzung wahrt diese literarische und theologische Spannung, ohne die Personifikation weiter auszudeuten.
- issue: Verhältnis von hebräischem Text und griechischer Parallele
  choice: Dem hebräischen לֵצִים „Spötter“ wird im Haupttext gefolgt.
  alternative: 'Nach griechisch ὑπερηφανίας: „Hochmut“ beziehungsweise „Stolz“.'
  rationale: Der angegebene hebräische Text ist die vorrangige, hochgradig verlässliche Ausgangsbasis. Die echte Abweichung der griechischen Überlieferung wird in einer Fußnote dokumentiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die personifizierte Weisheit bleibt durch „sie“ erkennbar. „Menschen der Lüge“ bewahrt bewusst die markante hebräische Ausdrucksweise; die Satzstruktur bleibt knapp und parallel.
