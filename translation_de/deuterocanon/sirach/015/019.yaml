    reason: ambiguity
lexical_decisions:
- source_word: עֵינֵי אֵל
  choice: Die Augen Gottes
  rationale: Bewahrt das konkrete anthropomorphe Bild des Hebräischen und gibt אֵל natürlich mit „Gott“ wieder.
- source_word: יִרְאוּ מַעֲשָׂיו
  choice: sehen seine Taten
  rationale: Die direkte Formulierung erhält sowohl das schlichte Verb „sehen“ als auch die im Hebräischen nicht ausdrücklich aufgelöste Beziehung des männlichen Suffixes in „seine“.
- source_word: יַכִּיר
  choice: er erkennt
  rationale: „Erkennt“ wahrt die Nuance von הכיר als erkennen, wahrnehmen oder genau erfassen; „kennt“ wäre ebenfalls möglich, klingt bei einer einzelnen Tat jedoch weniger natürlich.
- source_word: כָּל מִפְעַל
  choice: jede Tat
  rationale: Beim singularischen Substantiv gibt „jede“ das distributive כָּל idiomatisch wieder; „Tat“ passt zum moralischen Zusammenhang.
- source_word: אִישׁ
  choice: eines Mannes
  rationale: Gibt die männliche Singularform des Hebräischen formal wieder, ohne ihre mögliche allgemeine Verwendung in der Weisheitsliteratur zu verschweigen; diese wird in der Fußnote erläutert.
theological_decisions:
- issue: Anthropomorphe Rede von Gottes Wahrnehmung
  choice: Das Bild „Die Augen Gottes“ wird beibehalten.
  alternative: „Gott sieht“
  rationale: Das Hebräische spricht konkret von Gottes Augen. Eine abstraktere Wiedergabe würde das poetische Bild unnötig einebnen.
- issue: Männliche, möglicherweise generische Form אִישׁ
  choice: Im Haupttext steht „eines Mannes“.
  alternative: „eines Menschen“ / „einer Person“
  rationale: Die Übersetzung bewahrt die grammatisch männliche Form, während die Fußnote offenlegt, dass sie in der Weisheitsliteratur allgemein auf einen Menschen bezogen sein kann.
- issue: Bezug von „seine Taten“
  choice: Das Possessivpronomen bleibt wie im Hebräischen unausgelegt.
  alternative: Explizite Festlegung auf „die Taten des Menschen“ oder „Gottes Taten“
  rationale: Das hebräische Suffix ist formal männlich singularisch, doch im isolierten Vers fehlt ein ausdrückliches Bezugswort. Die deutsche Formulierung erhält diese Ambiguität.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Parallelismus und das konkrete Bild des Ausgangstextes bleiben erhalten; „Tat“ wird in beiden Satzhälften bewusst wiederholt, um die enge lexikalische und inhaltliche Entsprechung von מַעֲשָׂיו und מִפְעַל sichtbar zu machen.
