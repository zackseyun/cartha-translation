translation:
  language: de
  text: Die Augen Gottes sehen seine Taten[c], und er erkennt jede Tat eines Mannes.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'Oder: „jedes Menschen“. Das hebräische אִישׁ („Mann“) ist eine männliche Singularform, die in der Weisheitsliteratur auch allgemein gebraucht werden kann.'
    reason: lexical_alternative
  - marker: c
