base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/015/009.yaml
  text: Praise is not fitting in the mouth of a wicked man[a], for it has not been allotted to him by God.
translation:
  language: de
  text: Lob ist im Mund eines Frevlers nicht angebracht[a], denn es ist ihm nicht von Gott zugeteilt worden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Text lautet: „denn es wurde nicht vom Herrn gesandt“. Das Hebräische heißt wörtlicher: „denn es ist ihm nicht von Gott zugeteilt worden“.'
    reason: alternative_reading
lexical_decisions:
- source_word: לֹא נָאֲתָה
  choice: ziemt sich nicht
  rationale: Die Wendung bezeichnet, was sich nicht gehört oder nicht angemessen ist. „Ziemt sich nicht“ bewahrt diesen sittlichen Sinn in würdigem, verständlichem Deutsch.
- source_word: תְהִלָּה
  choice: Lob
  rationale: Das Substantiv bezeichnet allgemein Lob oder Lobpreis. Da der Vers nicht ausdrücklich von einem Lied spricht, ist „Lob“ die präziseste Wiedergabe.
- source_word: בְּפִי
  choice: im Mund
  rationale: Die konkrete hebräische Metapher wird formal bewahrt und entspricht auch dem griechischen Paralleltext.
- source_word: רָשָׂע
  choice: eines Frevlers
  rationale: „Frevler“ gibt die moralische Bedeutung des hebräischen רָשָׁע wieder und bewahrt den maskulinen Singular, ohne ihn mit dem griechischen „Sünder“ gleichzusetzen.
- source_word: נֶחְלְקָה לּוֹ
  choice: ist ihm … zugeteilt worden
  rationale: Die passive Form von חלק drückt Zuteilung oder Zumessung aus. „Zuge­teilt“ bewahrt dieses Bild genauer als das allgemeinere „gegeben“.
- source_word: מֵאֵל
  choice: von Gott
  rationale: אל bezeichnet hier Gott; „von Gott“ bildet die hebräische Präposition ab und ist zusammen mit dem deutschen Passiv natürlich.
theological_decisions:
- issue: Verhältnis des hebräischen und griechischen Wortlauts im zweiten Satzteil
  choice: 'Der Haupttext folgt dem Hebräischen: „es ist ihm nicht von Gott zugeteilt worden“.'
  alternative: 'Der griechische Paralleltext lautet: „denn es wurde nicht vom Herrn gesandt“.'
  rationale: Der erhaltene hebräische Text ist hier sicher bezeugt und hat für die Übersetzung Vorrang. Die abweichende griechische Aussage wird nicht harmonisiert, sondern in einer Fußnote offengelegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Ziemt sich“ und „Frevler“ sind leicht gehoben, passen jedoch zur weisheitlichen Sentenz und bleiben allgemein verständlich. Die hebräische Mund-Metapher und das Bild der Zuteilung werden bewahrt.
