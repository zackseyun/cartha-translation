    rationale: Der hebräische Text liest שְׁלַח יָדֶיךָ („strecke deine Hände aus“). Der griechische Paralleltext hat zwar χεῖρά σου im Singular, aber bei einer Übersetzung mit hebräischem Ausgangstext ist der Plural zu bewahren, sofern die Abweichung nicht eigens als griechische Lesart markiert wird.
  - severity: low
    issue: „dir hingestellt“ lässt לְפָנֶיךָ weniger anschaulich erkennen
    rationale: לְפָנֶיךָ bedeutet ausdrücklich „vor dir/vor dich“. „Vor dich hingestellt“ bewahrt die räumliche Bildlichkeit und bleibt idiomatisch.
  - severity: low
