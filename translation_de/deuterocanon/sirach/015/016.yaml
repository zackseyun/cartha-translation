translation:
  language: de
  text: Feuer und Wasser sind vor dich hingestellt[a]; strecke deine Hände nach dem aus, wonach du verlangst.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die hebräische Form מוּצָק ist hier ungewöhnlich. Der Sinn „sind vor dich hingestellt“ wird durch den Zusammenhang und den griechischen Paralleltext gestützt: „Er hat dir … vorgelegt.“'
    reason: textual_variant
lexical_decisions:
- source_word: מוּצָק לְפָנֶיךָ
  choice: sind dir hingestellt
  rationale: מוּצָק ist in diesem hebräischen Textzeugen eine ungewöhnliche Form. Zusammen mit לְפָנֶיךָ und dem griechischen Paralleltext παρέθηκέν σοι bezeichnet sie hier plausibel, dass Feuer und Wasser dem Menschen zur Wahl vorgelegt beziehungsweise hingestellt sind. Die deutsche Formulierung ist natürlich und wahrt das konkrete Bild.
- source_word: אֵשׁ וָמָיִם
  choice: Feuer und Wasser
  rationale: Das konkrete Gegensatzpaar wird entsprechend dem Hebräischen und dem griechischen Paralleltext wörtlich beibehalten.
- source_word: בַּאֲשֶׁר תַּחְפֹּץ
  choice: wonach du verlangst
  rationale: חפץ bezeichnet Wollen, Gefallen oder Verlangen. Die Wiedergabe bewahrt diesen unmittelbaren Willensaspekt, ohne ihn ausdrücklich durch das stärker deutende Verb „wählen“ zu ersetzen.
- source_word: שְׁלַח יָדֶיךָ
  choice: danach strecke deine Hand aus
  rationale: Das Bild bezeichnet das Ausstrecken der Hand nach einer der vorgelegten Möglichkeiten. „Danach“ nimmt im Deutschen das vorausgehende „wonach“ auf. Der Singular „Hand“ wird durch den griechischen Paralleltext τὴν χεῖρά σου und den idiomatischen Sinn gestützt.
theological_decisions:
- issue: Menschliche Entscheidungsfähigkeit und moralische Verantwortung
  choice: Die beiden Möglichkeiten werden dem Angeredeten wirklich vorgelegt; er soll die Hand nach dem ausstrecken, wonach er verlangt.
  alternative: Eine deterministische Auslegung, welche die im Vers ausgedrückte menschliche Willensbetätigung abschwächt.
  rationale: Hebräischer und griechischer Text stellen Alternativen vor den Menschen und formulieren eine Aufforderung zum Handeln. Die Übersetzung gibt diese Aussage wieder, ohne sie durch spätere dogmatische Einschränkungen oder weitergehende Behauptungen aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das konkrete Bild von Feuer, Wasser und ausgestreckter Hand bleibt erhalten; die korrelative Formulierung „wonach … danach“ gibt den Satz flüssig und quellenah wieder.
