  text: He will find gladness and joy[a], and an everlasting name will be his inheritance.
translation:
  language: de
  text: Jubel und Freude wird er finden, und ein ewiger Name wird ihm als Erbe zufallen[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Er wird einen ewigen Namen erben“ oder: „Sie wird ihm einen ewigen Namen als Erbe geben.“ Der hebräische Ausdruck ist knapp und lässt mehrere Konstruktionen zu; die griechische Überlieferung verwendet ausdrücklich ein Verb des Erbens.'
    reason: alternative_reading
lexical_decisions:
- source_word: שָׂשׂוֹן
  choice: Jubel
  rationale: Das Wort bezeichnet freudige Hochstimmung. „Jubel“ wahrt im Zusammenspiel mit שִׂמְחָה die poetische Paarung zweier nah verwandter Begriffe.
- source_word: שִׂמְחָה
  choice: Freude
  rationale: „Freude“ ist die klare, natürliche Entsprechung und unterscheidet sich ausreichend von „Jubel“, ohne den Parallelismus abzuschwächen.
- source_word: יִמְצָא
  choice: wird er finden
  rationale: Die Grundbedeutung von מצא ist „finden“. Die Formulierung bleibt im Deutschen idiomatisch und hält sich eng an den hebräischen Wortlaut.
- source_word: שֵׂם עוֹלָם
  choice: ein ewiger Name
  rationale: Wörtlich steht hier „ein Name für ewig“. „Ein ewiger Name“ bewahrt das biblische Bild dauernden Ansehens; auch das griechische ὄνομα αἰώνιον stützt diese Wiedergabe.
- source_word: תּוֹרִישֶׁנּוּ
  choice: wird ihm als Erbe zufallen
  rationale: Die hebräische Form ist syntaktisch gedrängt und lässt unterschiedliche Konstruktionen zu. Die gewählte Formulierung bewahrt das vom Verb und von der griechischen Parallele gestützte Erbmotiv, ohne ein nicht sicher bestimmbares Subjekt ausdrücklich einzusetzen.
theological_decisions:
- issue: Deutung des Schlusssatzes mit תּוֹרִישֶׁנּוּ im Verhältnis zur griechischen Parallele
  choice: Der ewige Name fällt dem Menschen als Erbe zu.
  alternative: 'Er wird einen ewigen Namen erben; oder: Sie wird ihm einen ewigen Namen als Erbe geben.'
  rationale: Der knappe hebräische Ausdruck kann verschieden konstruiert werden; die Lesarten stimmen jedoch darin überein, dass der Mensch einen bleibenden Namen als Erbe empfängt. Die griechische Parallele bestätigt ausdrücklich die Erbvorstellung. Die Übersetzung gibt das gemeinsame Aussagezentrum wieder und bewahrt die syntaktische Offenheit in einer Fußnote.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die poetische Doppelung „Jubel und Freude“ sowie das biblische Bild des „ewigen Namens“ bleiben erhalten. Die Schlussformulierung ist bewusst natürlich und zugleich offen genug, um die Unsicherheit der hebräischen Syntax nicht stillschweigend aufzulösen.
