base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/015/004.yaml
  text: He will lean on her and not be shaken[c][b][a]; he will trust in her and not be put to shame.
translation:
  language: de
  text: Er wird sich auf sie[a] stützen und nicht wanken[b]; er wird auf sie vertrauen und nicht beschämt werden.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint ist die Weisheit, die im Zusammenhang als Frau dargestellt wird.
    reason: cross_reference
  - marker: b
    text: 'Oder: „nicht ins Wanken geraten“; auch: „nicht zu Fall kommen“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „nicht zuschanden werden“; die Wendung kann auch bedeuten, dass jemand in seinem Vertrauen nicht enttäuscht wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִשְׁעַן עָלֶיהָ
  choice: Er wird sich auf sie stützen
  rationale: שׁען mit עַל bezeichnet ein Sich-Anlehnen oder Sich-Stützen und daraus folgendes Sich-Verlassen auf jemanden. Die Wiedergabe bewahrt das konkrete Bild und klingt im modernen Deutschen natürlich.
- source_word: וְלֹא יִמּוֹט
  choice: und nicht wanken
  rationale: מוט bezeichnet das Schwanken, Wanken oder Aus-der-Festigkeit-Geraten. „Nicht wanken“ erhält das Bild, das durch das vorausgehende Sich-Stützen vorbereitet wird.
- source_word: וּבָהּ יִבְטַח
  choice: er wird auf sie vertrauen
  rationale: בטח drückt Vertrauen und das Gefühl von Sicherheit aus. „Auf sie vertrauen“ gibt die Konstruktion mit dem femininen Suffix direkt und idiomatisch wieder.
- source_word: וְלֹא יֵבוֹשׁ
  choice: und nicht beschämt werden
  rationale: בוש kann Beschämung, Schande oder die Enttäuschung einer fehlgeschlagenen Hoffnung bezeichnen. „Nicht beschämt werden“ wahrt die öffentliche Dimension, ohne die Bedeutung auf bloße innere Scham einzuengen; die weitere Nuance wird in der Fußnote genannt.
theological_decisions:
- issue: Bezug und Geschlecht der Pronomen
  choice: Die femininen Suffixe werden mit „sie“ wiedergegeben und auf die personifizierte Weisheit bezogen.
  alternative: Ein neutrales Pronomen verwenden und die Personifikation abschwächen.
  rationale: Das Hebräische verwendet ausdrücklich feminine Formen, und der Zusammenhang stellt die Weisheit als Frau dar. Die feminine Bildsprache gehört zur literarischen und theologischen Aussage des Abschnitts.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallelen Satzglieder und die weibliche Personifikation der Weisheit bleiben erhalten; „sich auf sie stützen“ bewahrt zugleich das konkrete Bild und den Sinn des Vertrauens.
