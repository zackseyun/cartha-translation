translation:
  language: de
  text: Sie geht ihm entgegen wie eine Mutter und nimmt ihn auf wie die Frau seiner Jugend.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Griechisch: „wie eine Frau der Jungfräulichkeit“, das heißt, wie eine junge Braut oder jungfräuliche Ehefrau.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְקִדְּמַתְהוּ
  choice: Sie geht ihm entgegen
  rationale: קדם bezeichnet hier das aktive Entgegenkommen; das griechische ὑπαντήσεται bestätigt diese Nuance und bewahrt die Initiative der personifizierten Weisheit.
- source_word: כָאֵם
  choice: wie eine Mutter
  rationale: Die Vergleichspartikel כ wird direkt und natürlich als „wie“ wiedergegeben.
- source_word: וּכְאֵשֶׁת נְעוּרִים
  choice: wie die Frau seiner Jugend
  rationale: Die hebräische Wendung bezeichnet die mit der eigenen Jugend verbundene Ehefrau und trägt den Klang früher ehelicher Nähe. Der bestimmte Artikel entspricht im Deutschen der idiomatischen Form der Wendung.
- source_word: תְּקַבְּלֶנּוּ
  choice: nimmt ihn auf
  rationale: קבל bedeutet „empfangen, annehmen, aufnehmen“. „Nimmt ihn auf“ klingt im Deutschen natürlich und kann sowohl liebevollen Empfang als auch Annahme ausdrücken.
theological_decisions:
- issue: Weibliche Personifikation der Weisheit in mütterlichen und ehelichen Bildern
  choice: 'Die weibliche Personenrede und beide Vergleiche bleiben erhalten: „Sie ... wie eine Mutter ... wie die Frau seiner Jugend“.'
  alternative: Die Weisheit unpersönlich mit „sie/es“ als bloßen abstrakten Begriff wiedergeben oder die Bilder auflösen.
  rationale: Die femininen Verbformen und die ausdrücklichen Vergleiche verlangen die weibliche Personifikation; eine Abstraktion würde die poetische und theologische Spannung des Textes einebnen.
- issue: Verhältnis von אֵשֶׁת נְעוּרִים zum griechischen γυνὴ παρθενείας
  choice: Der Haupttext folgt dem erhaltenen Hebräisch mit „die Frau seiner Jugend“.
  alternative: „eine jungfräuliche Frau“, „eine junge Braut“ oder „eine Frau ihrer Jungfräulichkeit“.
  rationale: Da der hebräische Text erhalten und als Primärquelle hoch eingestuft ist, bestimmt er den Haupttext. Die griechische Nuance von Jungfräulichkeit beziehungsweise Brautstand wird transparent in einer Fußnote bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Geht ihm entgegen“ wahrt die aktive Bewegung; „nimmt ihn auf“ ist natürlich und zugleich gehoben genug. Die weibliche Personifikation der Weisheit wird ausdrücklich erhalten.
