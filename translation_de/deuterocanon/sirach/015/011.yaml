  text: Do not say[a], “My transgression is from God,” for he has not done what he hates.
translation:
  language: de
  text: 'Sag nicht[a]: »Meine Übertretung kommt von Gott«, denn was er hasst, hat er nicht getan.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Parallele lautet: »Sag nicht: ›Durch den Herrn bin ich abgefallen‹; denn was er gehasst hat, wirst du nicht tun.« Sie gibt eine verwandte, aber nicht identische Textform wieder.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תֹּאמַר
  choice: Sag nicht
  rationale: Der hebräische verneinte Imperativ wird knapp und unmittelbar wiedergegeben; die moderne Anrede mit »du« entspricht dem zugänglichen Gegenwartsdeutsch.
- source_word: מֵאֵל
  choice: kommt von Gott
  rationale: Die Präposition מִן bezeichnet hier am natürlichsten Herkunft oder Ursprung. Die Formulierung weist zurück, dass die eigene Verfehlung ihren Ursprung in Gott habe.
- source_word: פִּשְׁעִי
  choice: meine Übertretung
  rationale: פשע bezeichnet eine schuldhafte, oft vorsätzliche Grenzüberschreitung oder Auflehnung. »Übertretung« bewahrt den ernsten moralischen Gehalt, ohne die politische Nuance von »Auflehnung« überzubetonen.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion führt die Begründung des Verbots ein und erhält den knappen Weisheitsspruch-Ton.
- source_word: אֶת אֲשֶׁר שָׂנֵא
  choice: was er hasst
  rationale: Die Relativkonstruktion wird natürlich wiedergegeben; das Subjekt von »hasst« ist der zuvor genannte Gott.
- source_word: לֹא עָשָׂה
  choice: hat er nicht getan
  rationale: Die hebräische Perfektform wird formal und zugleich idiomatisch als deutsches Perfekt wiedergegeben. Damit bleibt der Wortlaut des hoch bewerteten hebräischen Zeugen maßgeblich, obwohl die griechische Parallele die zweite Person im Futur hat.
theological_decisions:
- issue: Bestreitet der Vers den göttlichen Ursprung der Sünde oder bezeichnet er Gott als deren Anlass?
  choice: »Meine Übertretung kommt von Gott« bestreitet, dass die eigene Übertretung ihren Ursprung in Gott hat.
  alternative: »Durch den Herrn bin ich abgefallen« beziehungsweise »Wegen des Herrn bin ich abgefallen« nach der griechischen Parallele.
  rationale: Der primäre hebräische Text מֵאֵל פִּשְׁעִי spricht am natürlichsten von Herkunft oder Ursprung. Die verwandte, aber nicht identische griechische Lesart wird in der Fußnote bewahrt.
- issue: Stärke der Wiedergabe von פשע
  choice: Übertretung
  alternative: Auflehnung; Sünde
  rationale: »Übertretung« lässt den Aspekt persönlicher Schuld und möglicher Vorsätzlichkeit erkennen, ohne den Ausdruck unnötig politisch zu verengen oder ihn mit dem allgemeineren »Sünde« einzuebnen.
- issue: Subjekt und Zeitform im Begründungssatz
  choice: »was er hasst, hat er nicht getan« folgt dem hebräischen Text mit Gott als Subjekt.
  alternative: »was er hasst, wirst du nicht tun« nach dem griechischen Text.
  rationale: Der hoch bewertete hebräische Zeuge ist für den Haupttext vorrangig. Die deutlich abweichende griechische Form wird nicht harmonisiert, sondern in der Fußnote kenntlich gemacht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit direkter Anrede. Der Satzbau bleibt nah am knappen hebräischen Weisheitsspruch. »Übertretung« ist bewusst ernster als »Fehler«, aber allgemein verständlich; die echte Differenz zwischen hebräischem Hauptzeugen und griechischer Parallele wird durch die Fußnote offengehalten.
