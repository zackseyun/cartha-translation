base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/014/016.yaml
  text: Give to a brother[a], and be gracious, and indulge yourself, for in Sheol there is no seeking pleasure. And whatever is good to do[b], do it before God.
translation:
  language: de
  text: Gib einem Bruder, sei gütig und verwöhne dich selbst[a]; denn im Scheol gibt es kein Streben nach Genuss[b]. Was immer gut zu tun ist, tu vor Gott.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Überlieferung lautet: „Gib und nimm, und täusche deine Seele.“ Die schwierige Wendung weist im Zusammenhang wohl ebenfalls auf genussvolles Erleben hin. Der hebräische Text sagt klarer: „verwöhne dich selbst“.'
    reason: alternative_reading
  - marker: b
    text: „Scheol“ bezeichnet das Reich der Toten; auch „Totenreich“, „Unterwelt“ oder, enger gefasst, „Grab“ sind mögliche Wiedergaben.
    reason: lexical_alternative
lexical_decisions:
- source_word: תֵּן לְאָח
  choice: Gib einem Bruder
  rationale: Bewahrt die konkrete hebräische Bezeichnung „Bruder“, die hier auch einen Mitmenschen oder ein Mitglied der Gemeinschaft meinen kann, ohne sie vorschnell zu verallgemeinern.
- source_word: וְחֹנֵן
  choice: sei gütig
  rationale: Gibt die aus חנן stammende Aufforderung in natürlichem modernem Deutsch wieder. „Sei gnädig“ wäre formaler, klingt im zwischenmenschlichen Zusammenhang aber weniger geläufig.
- source_word: וּפַנֵּק נַפְשֶׁךָ
  choice: verwöhne dich selbst
  rationale: פנק bezeichnet ein behutsames oder genussvolles Behandeln. Die Wiedergabe wahrt die anschauliche Aufforderung des Hebräischen und den Bezug auf die eigene Person.
- source_word: כִּי אֵין בִּשְׁאוֹל לְבַקֵּשׁ תַּעֲנוּג
  choice: denn im Scheol kann man keine Freude suchen
  rationale: „Scheol“ bewahrt die Bezeichnung für das Totenreich. Die unpersönliche Konstruktion „kann man“ macht die hebräische Existenzkonstruktion im Deutschen verständlich, während „Freude suchen“ Verb und Substantiv eng wiedergibt.
- source_word: וְכָל דָּבָר שֶׁיָּפֶה לַעֲשׂוֹת
  choice: Und alles, was zu tun gut ist
  rationale: יפה bezeichnet hier wahrscheinlich das Gute, Angemessene oder Schickliche. Die Formulierung bewahrt die breite ethische Aussage und die Struktur des Hebräischen.
- source_word: לִפְנֵי אֱלֹהִים עֲשֶׂה
  choice: tu vor Gott
  rationale: „Vor Gott“ entspricht der räumlich-theologischen Wendung wörtlich und lässt offen, ob besonders Gottes Gegenwart, sein Blick oder die Verantwortung vor ihm betont ist.
theological_decisions:
- issue: Wiedergabe von שְׁאוֹל
  choice: Scheol
  alternative: Grab; Totenreich; Unterwelt
  rationale: Die Transkription erhält die alte Vorstellung vom Aufenthaltsbereich der Toten, ohne den Ausdruck auf das Grab zu verengen oder mit einer späteren Lehre von der Hölle gleichzusetzen.
- issue: Aufforderung zum eigenen Genuss
  choice: verwöhne dich selbst
  alternative: lass es dir gut gehen; gönne dir etwas; täusche deine Seele
  rationale: Der vorhandene hebräische Text ist vorrangig und spricht mit פנק deutlich vom genussvollen Behandeln der eigenen Person. Die abweichende und schwierige griechische Formulierung wird in einer Fußnote bewahrt, statt den Haupttext zu bestimmen.
- issue: Handeln לִפְנֵי אֱלֹהִים
  choice: vor Gott
  alternative: in Gottes Gegenwart; unter Gottes Augen
  rationale: Die knappe Wiedergabe erhält die Mehrdeutigkeit zwischen Gegenwart, Wahrnehmung und Rechenschaft vor Gott.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knappen Imperativen. „Gib einem Bruder“ und „vor Gott“ bewahren bewusst die konkrete Ausdrucksweise des Hebräischen; „sei gütig“ und „kann man keine Freude suchen“ sorgen zugleich für natürliche Verständlichkeit.
