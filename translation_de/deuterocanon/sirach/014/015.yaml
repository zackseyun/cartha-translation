  source_fidelity: Die rhetorische Frage, „Reichtum“ für חֵילֶךָ und „einem anderen hinterlassen“ geben den hebräischen Text treffend wieder. „Mühsamen Ertrag“ legt יְגִיעַ jedoch einseitig als Ertrag aus und fügt mit „mühsam“ eine im Deutschen zwar naheliegende, im hebräischen Ausdruck aber nicht eigens gesetzte Nuance hinzu. יְגִיעַ kann Mühe/Arbeit oder das dadurch Erworbene bezeichnen. Die schwierige Wendung לְיוֹדְעֵי גוֹרָל sollte nicht zu bestimmt auf handelnde Erbteiler festgelegt werden; der griechische Paralleltext stützt den Bezug auf eine Los- oder Erbteilung, bestimmt die genaue Rolle der Personen aber nicht abschließend.
