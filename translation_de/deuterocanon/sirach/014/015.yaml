translation:
  language: de
  text: Wirst du deinen Reichtum nicht einem anderen hinterlassen und deine Mühe denen, die das Los teilen?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher etwa: „den Kennern des Loses“. Die hebräische Wendung ist idiomatisch. Sie kann sich auf Personen im Zusammenhang mit einer Los- oder Erbteilung beziehen; der griechische Paralleltext weist auf die Aufteilung eines Losanteils oder Erbes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: Wirst du … nicht
  rationale: Bewahrt die rhetorische Frage, die eine bejahende Antwort erwartet, und ihren mahnenden Ton.
- source_word: לְאַחֵר תַּעֲזוֹב
  choice: einem anderen hinterlassen
  rationale: Gibt das Zurücklassen zugunsten eines anderen natürlich wieder, ohne den rechtstechnischen Sinn von „vererben“ ausdrücklich in den hebräischen Wortlaut einzutragen.
- source_word: חֵילֶךָ
  choice: deinen Reichtum
  rationale: חיל bezeichnet hier im weisheitlichen Zusammenhang den materiellen Besitz beziehungsweise das Vermögen.
- source_word: וִיגִיעֲךָ
  choice: deinen mühsamen Ertrag
  rationale: יגיע kann sowohl die Mühe als auch das durch Mühe Erworbene bezeichnen. Im Zusammenhang mit dem Hinterlassen ist der Ertrag gemeint, während „mühsam“ die persönliche Arbeit hörbar hält.
- source_word: לְיוֹדֵי גוֹרָל
  choice: denen, die das Los teilen
  rationale: Die wörtlich schwierige Wendung („Kenner des Loses“) wird im Licht des griechischen Parallelttexts als Aufteilung eines Erb- oder Losanteils verstanden; die Los-Metaphorik bleibt erhalten.
