  terminology: „Reichtum“ und „hinterlassen“ sind angemessen. „Das Los teilen“ erhält das Losbild; die Fußnote erläutert die idiomatische Wendung, ohne sie im Haupttext zu einer bestimmten erbrechtlichen Technik oder Personengruppe zu verengen.
