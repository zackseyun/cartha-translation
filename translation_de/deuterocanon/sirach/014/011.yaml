translation:
  language: de
  text: Mein Sohn[a], wenn du die Mittel hast, behandle dich selbst gut; und wenn du etwas hast, tu dir Gutes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Parallelüberlieferung lautet abweichend: „Kind, je nachdem, was du hast, tu dir Gutes und bring dem Herrn angemessene Opfergaben dar.“ Der erhaltene hebräische Text hat dagegen zwei parallele Aussagen darüber, sich selbst Gutes zu tun.'
    reason: textual_variant
lexical_decisions:
- source_word: בְּנִי
  choice: Mein Sohn
  rationale: Die direkte Anrede mit בֵּן und Suffix der 1. Person Singular ist im erhaltenen hebräischen Text ausdrücklich maskulin und wird daher genau wiedergegeben.
- source_word: אִם יֵשׁ לְךָ
  choice: wenn du die Mittel hast / wenn du etwas hast
  rationale: Die hebräische Existenzkonstruktion bezeichnet idiomatisch Besitz oder verfügbare Mittel. Die leicht variierte Wiedergabe erhält die Wiederholung, klingt im Deutschen aber natürlich.
- source_word: שָׁרֵית נַפְשֶׁךָ
  choice: behandle dich selbst gut
  rationale: Die ungewöhnliche, gedrängte Wendung zielt im Zusammenhang darauf, die verfügbaren Mittel auch zum eigenen Wohlergehen einzusetzen. Die Wiedergabe wahrt den reflexiven Sinn, ohne eine unsichere wörtliche Deutung vorzutäuschen.
- source_word: הֵיטִיב לָךְ
  choice: tu dir Gutes
  rationale: Der Hifil von יטב mit לָךְ hat hier reflexiven Sinn. „Tu dir Gutes“ ist nah am Hebräischen, verständlich und würdevoll.
- source_word: προσφορὰς Κυρίῳ ἀξίως πρόσαγε
  choice: bring dem Herrn angemessene Opfergaben dar
  rationale: Diese zusätzliche Aussage steht nur in der griechischen Parallelüberlieferung. Sie wird in der Fußnote vollständig wiedergegeben, aber nicht in den hebräischen Haupttext eingefügt.
theological_decisions:
- issue: Zusätzlicher Opfergaben-Satz der griechischen Parallelüberlieferung
  choice: Nicht in den Haupttext aufnehmen, sondern in einer Fußnote dokumentieren
  alternative: „… und bring dem Herrn angemessene Opfergaben dar“ in den Haupttext aufnehmen
  rationale: Der vorliegende hebräische Text ist erhalten und enthält stattdessen zwei parallele Aufforderungen zum eigenen Wohlergehen. Die griechische Fassung bezeugt eine bedeutsame abweichende beziehungsweise möglicherweise vollständigere Textgestalt; diese Spannung wird offengelegt, nicht stillschweigend aufgelöst.
- issue: Wiedergabe von Κύριος in der griechischen Variante
  choice: der Herr
  alternative: Herr
  rationale: Im Zusammenhang der Opfergaben bezeichnet Κύριος Gott; „der Herr“ ist die übliche transparente deutsche Wiedergabe.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdevoller Weisheitsliteratur-Färbung. Die Wiederholung des Hebräischen bleibt erkennbar; die schwierige erste Wendung wird vorsichtig sinngemäß wiedergegeben. Der Fußnotenmarker [a] steht unmittelbar nach der Anrede und verweist auf die abweichende griechische Textgestalt.
