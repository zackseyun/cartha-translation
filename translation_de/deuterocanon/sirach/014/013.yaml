base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/014/013.yaml
  text: Before you die[a], do good to one you love, and according to what your hand attains[b], give to him.
translation:
  language: de
  text: Bevor du stirbst, tu einem Menschen, den du liebst, Gutes, und gib ihm, so viel deine Hand vermag.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „das Erreichen deiner Hand“. Gemeint ist: entsprechend deinen Mitteln oder Möglichkeiten. Die griechische Parallelfassung lautet: „… und strecke dich nach deiner Kraft aus und gib ihm.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּטֶרֶם תָּמוּת
  choice: Bevor du stirbst
  rationale: Die temporale Wendung und das gewöhnliche Verb für Sterben werden direkt, natürlich und würdig wiedergegeben.
- source_word: הֵיטִב לְאוֹהֵב
  choice: tu einem Menschen, den du liebst, Gutes
  rationale: Der Hifil-Imperativ bezeichnet tätiges Wohltun; אוֹהֵב bleibt entsprechend dem primären hebräischen Zeugnis relational weit gefasst. „Einem Menschen“ macht den substantivierten Bezug im Deutschen idiomatisch.
- source_word: וְהַשִּׂיגַת יָדְךָ
  choice: so viel deine Hand vermag
  rationale: 'Die Wiedergabe bewahrt das hebräische Bild der Hand und vermittelt zugleich dessen idiomatischen Sinn: entsprechend den eigenen Mitteln oder Möglichkeiten.'
- source_word: תֶּן לוֹ
  choice: gib ihm
  rationale: Der schlichte Imperativ mit indirektem Objekt lässt sich im Deutschen knapp und genau wiedergeben.
theological_decisions:
- issue: Beziehungsbezeichnung in לְאוֹהֵב gegenüber griechisch φίλῳ
  choice: einem Menschen, den du liebst
  alternative: einem Freund
  rationale: Das Hebräische ist primär und bezeichnet einen geliebten beziehungsweise liebenden Menschen; das Griechische stützt als Parallele die engere Bedeutung „Freund“. Die Hauptfassung erhält die größere Bedeutungsweite des Hebräischen.
- issue: Umfang des Gebens in וְהַשִּׂיגַת יָדְךָ
  choice: so viel deine Hand vermag
  alternative: nach deinen Mitteln
  rationale: Die bildhafte, inhaltlich offene Formulierung kann sowohl Vermögen als auch praktische Fähigkeit umfassen und soll nicht unnötig auf finanzielle Mittel eingeengt werden.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Weisheitston. Die Anrede bleibt im Singular. Das Hand-Bild des Hebräischen wird erhalten, aber idiomatisch formuliert.
