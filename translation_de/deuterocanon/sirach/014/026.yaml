  text: He sets his nest in her foliage[a], and lodges among her branches.
translation:
  language: de
  text: Er baut sein Nest in ihrem Laub[a] und nächtigt in ihren Zweigen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Parallele lautet: „Er wird seine Kinder in ihren Schutz bringen und unter ihren Zweigen nächtigen.“ Im Hebräischen steht „sein Nest“ und „in ihrem Laub“.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְיָשִׂים
  choice: Er baut
  rationale: שׂים bedeutet grundsätzlich „setzen, stellen, legen“. Im Deutschen ist „ein Nest bauen“ die natürliche Verbindung; sie gibt das konkrete Einrichten des Nestes wieder, ohne das Bild aufzulösen.
- source_word: קִנּוֹ
  choice: sein Nest
  rationale: Das hebräische קֵן bezeichnet eindeutig ein Nest. Der erhaltene hebräische Text ist hier schlüssig und hat gegenüber der abweichenden griechischen Parallele Vorrang.
- source_word: בְעָפְיָהּ
  choice: in ihrem Laub
  rationale: עֳפִי bezeichnet dichtes Blattwerk beziehungsweise Laub. „Laub“ ist im Deutschen anschaulich und bewahrt den femininen Bezug auf die personifizierte Weisheit im vorausgehenden Baumbild.
- source_word: וּבַעֲנָפֶיהָ
  choice: in ihren Zweigen
  rationale: עָנָף bedeutet „Zweig“ oder „Ast“. Die Präposition ב wird direkt mit „in“ wiedergegeben; die griechische Lesart „unter“ bleibt in der Fußnote erhalten.
- source_word: יִתְלוֹנָן
  choice: nächtigt
  rationale: Das Verb לון bezeichnet das Übernachten beziehungsweise Verbringen der Nacht. „Nächtigt“ wahrt diese präzise Bedeutung und passt zum Bild eines sicheren Ruheplatzes.
theological_decisions:
- issue: Vorrang des erhaltenen hebräischen Sirachtextes gegenüber der abweichenden griechischen Parallele
  choice: Im Haupttext stehen „sein Nest“, „in ihrem Laub“ und „in ihren Zweigen“ entsprechend dem Hebräischen.
  alternative: 'Die griechische Parallele lautet sinngemäß: „Er wird seine Kinder in ihren Schutz bringen und unter ihren Zweigen nächtigen.“'
  rationale: Wo ein verständlicher hebräischer Sirachtext erhalten ist, bildet er die Grundlage. Die griechische Überlieferung dient als Kontrollzeuge; ihre sachlich bedeutsame Abweichung wird nicht harmonisiert, sondern in einer Fußnote dokumentiert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit konkretem Baumbild. „Nächtigt“ ist leicht gehoben, aber allgemein verständlich und semantisch genauer als das weiter gefasste „wohnt“.
