  source_fidelity: Die Übersetzung bewahrt die feminine Personifikation sowie die räumliche Bildsprache der „Eingänge“ und gibt יְרַצֵּד mit „lauere“ angemessen scharf wieder; dies wird durch das griechische ἐνέδρευε gestützt. „um ihr nachzuforschen“ verschiebt jedoch die Bewegungs- und Verfolgungsmetapher von לָצֵאת אַחֲרֶיהָ zu einem eher sachlich-ermittelnden Nachforschen über eine Person.
  naturalness: „Ihr nachforschen“ ist in modernem Deutsch zwar verständlich, klingt aber unidiomatisch und legt nahe, dass Weisheit untersucht wird. „Ihr auf der Suche nach“ ist natürlich, bewahrt die personifizierte Verfolgungsbewegung und lässt die investigative Nuance von בְחֵקֶר bestehen.
  terminology: „Lauere“ trifft das durch den griechischen Paralleltext nahegelegte Bild des Auflauerns. Die Fußnote sollte die Alternative nicht als „weniger bildhaft“ bezeichnen, da „Wache halten“ ebenfalls bildhaft ist; sie ist vielmehr weniger scharf beziehungsweise weniger bedrohlich gefärbt.
