translation:
  language: de
  text: Zieh aus, ihr auf der Suche nach, und lauere an all ihren Eingängen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder weniger scharf: „halte an all ihren Eingängen Wache“. Das seltene hebräische Verb ist nicht völlig sicher; der griechische Paralleltext spricht vom Auflauern.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָצֵאת אַחֲרֶיהָ בְחֵקֶר
  choice: Zieh aus, um ihr nachzuforschen
  rationale: „Zieh aus“ gibt das imperativisch gebrauchte לָצֵאת wieder; „ihr nachzuforschen“ verbindet die Verfolgungsrichtung von אַחֲרֶיהָ mit dem suchenden und untersuchenden Sinn von בְחֵקֶר in natürlichem Deutsch.
- source_word: מְבוֹאֶיהָ
  choice: ihren Eingängen
  rationale: Die konkrete räumliche Metapher des hebräischen Plurals bleibt erhalten; auch der griechische Paralleltext hat „Eingänge“.
- source_word: יְרַצֵּד
  choice: lauere
  rationale: Das seltene Verb bezeichnet offenbar ein aufmerksames, verborgenes Warten. Der griechische Paralleltext ἐνέδρευε stützt ausdrücklich das Bild des Auflauerns; die Fußnote wahrt eine weniger scharf gefärbte Alternative.
theological_decisions:
- issue: Weibliche Personifikation der Weisheit
  choice: Das feminine Pronomen „ihr“ sowie das Possessivpronomen „ihren“ werden beibehalten.
  alternative: „der Weisheit“ wiederholen oder geschlechtsneutral umschreiben
  rationale: Die femininen Singularsuffixe beziehen sich im Kontext auf die personifizierte Weisheit. Die Pronomen bewahren diese literarische und theologische Gestaltung, ohne sie weiter auszudeuten.
- issue: Schärfe des Bildes vom Auflauern
  choice: „lauere“ im Haupttext
  alternative: „halte Wache“ oder „halte dich bereit“
  rationale: Die seltene hebräische Verbform und besonders der griechische Paralleltext tragen ein deutliches Bild des Auflauerns. Dieses spannungsvolle Bild sollte nicht stillschweigend abgeschwächt werden; eine neutralere Verständnisalternative steht in der Fußnote.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Zieh aus“ bewahrt den auffordernden und bewegungsbetonten Charakter, während „nachforschen“ für heutige Leser idiomatisch ist. Das ungewöhnlich scharfe „lauere“ erhält bewusst die Metapher des Ausgangstextes.
