  - severity: low
    issue: Die Fußnote beschreibt „Wache halten“ unzutreffend als „weniger bildhaft“.
    rationale: Die Alternative schwächt vor allem die Schärfe des Auflauerns ab, nicht die Bildhaftigkeit als solche.
