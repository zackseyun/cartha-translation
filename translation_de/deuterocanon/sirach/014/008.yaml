  yaml_path: translation/deuterocanon/sirach/014/008.yaml
  text: Evil is the man with an envious eye[b][a], turning away his face and despising lives.
translation:
  language: de
  text: Böse ist, wer einen neidischen Blick hat[a], das Gesicht abwendet und Menschen[b] verachtet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »einen bösen Blick hat«. Die griechische Wendung kann eine missgünstige, neidische Haltung bezeichnen und zugleich an die Vorstellung vom »bösen Blick« erinnern.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich auch: »Seelen«; je nach Verständnis ebenso: »Leben«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πονηρὸς
  choice: Böse ist
  rationale: Das prädikative Adjektiv bezeichnet die sittliche Verwerflichkeit der beschriebenen Person. Die knappe Satzstellung bewahrt die pointierte Form des Griechischen.
- source_word: ὁ βασκαίνων ὀφθαλμῷ
  choice: wer einen neidischen Blick hat
  rationale: Die Wiedergabe vermittelt die missgünstige, neidische Haltung in natürlichem Deutsch und bewahrt zugleich das Bild des Blicks. Die mögliche Anspielung auf den »bösen Blick« wird in der Fußnote offengehalten.
- source_word: ἀποστρέφων πρόσωπον
  choice: das Gesicht abwendet
  rationale: Die konkrete körperliche Geste des Abweisens oder Vorenthaltens wird eng und idiomatisch wiedergegeben.
- source_word: ὑπερορῶν
  choice: verachtet
  rationale: Das Verb bezeichnet hier geringschätziges Übersehen beziehungsweise Herabsehen. »Verachtet« bringt die ethische Schärfe in einem knappen, würdigen Register zum Ausdruck.
- source_word: ψυχάς
  choice: Menschen
  rationale: ψυχή bezeichnet hier wahrscheinlich Personen beziehungsweise menschliche Wesen und nicht eigens einen vom Körper getrennten Seelenteil. »Menschen« ist im Deutschen natürlich; die formal näheren Möglichkeiten werden in der Fußnote genannt.
theological_decisions:
- issue: Deutung von βασκαίνων ὀφθαλμῷ
  choice: einen neidischen Blick hat
  alternative: einen bösen Blick hat
  rationale: Im Weisheitskontext steht die missgünstige, knauserige Haltung im Vordergrund. Da das Griechische zugleich den kulturell geprägten Ausdruck vom »bösen Blick« aufrufen kann, bleibt diese Möglichkeit in einer Fußnote erhalten.
- issue: Bedeutung von ψυχάς
  choice: Menschen
  alternative: Seelen oder Leben
  rationale: Die Hauptfassung vermeidet eine unnötig technische anthropologische Festlegung. Zugleich dokumentiert die Fußnote die größere Bedeutungsbreite des griechischen Wortes.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit knapper weisheitlicher Satzform. Die konkreten Bilder des Blicks und des abgewandten Gesichts bleiben erhalten; potenziell theologisch überladene Terminologie wird nicht ohne Not in den Haupttext aufgenommen.
