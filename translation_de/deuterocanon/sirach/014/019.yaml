  text: All his works rot away[a], and the work of his hands is dragged along behind him.
translation:
  language: de
  text: Alle seine Werke verrotten[a], und das Werk seiner Hände wird hinter ihm hergezogen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Griechisch: „Jedes Werk, das verfällt, vergeht, und wer es vollbringt, wird mit ihm dahingehen.“ Der hebräische Text spricht dagegen davon, dass das Werk seiner Hände hinter ihm hergezogen wird.'
    reason: alternative_reading
lexical_decisions:
- source_word: כָּל מַעֲשָׂיו
  choice: Alle seine Werke
  rationale: Der Ausdruck bezeichnet umfassend alles, was der Mensch tut oder hervorbringt. „Werke“ bewahrt den literarischen und zugleich konkreten Sinn.
- source_word: רָקוֹב יִרְקָבוּ
  choice: verrotten
  rationale: Die hebräische Verbindung aus verwandten Wortformen verstärkt das Bild des Verfalls. Das natürliche deutsche Verb „verrotten“ gibt dieses Bild prägnant wieder, ohne die Konstruktion unidiomatisch nachzubilden.
- source_word: וּפֹעַל יָדָיו
  choice: und was seine Hände geschaffen haben
  rationale: Die Wiedergabe erhält das konkrete Bild der Hände und bringt zugleich idiomatisch zum Ausdruck, dass פֹעַל hier das hervorgebrachte Werk bezeichnet.
- source_word: יִמָּשֵׁךְ אַחֲרָיו
  choice: wird hinter ihm hergezogen
  rationale: Die passive Form und die räumliche Vorstellung von אַחֲרָיו werden direkt bewahrt. „Hinter ihm hergezogen“ lässt die auffällige Bildsprache des Hebräischen stehen.
theological_decisions:
- issue: Abweichung zwischen hebräischem und griechischem Text im zweiten Satzglied
  choice: 'Dem hebräischen Text folgen: Das von seinen Händen Geschaffene wird hinter ihm hergezogen.'
  alternative: 'Dem Griechischen folgen: „Und wer es vollbringt, wird mit ihm dahingehen.“'
  rationale: Da ein zuverlässiger hebräischer Text vorliegt, bildet er die Grundlage der Hauptübersetzung. Die griechische Fassung wechselt das Subjekt vom Werk zum Handelnden und wird deshalb als bedeutsame Textabweichung in der Fußnote dokumentiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnliche Bildsprache des hebräischen zweiten Satzglieds bleibt bewusst erhalten; die Wurzelwiederholung bei „verrotten“ wird zugunsten natürlicher deutscher Ausdrucksweise nicht mechanisch nachgebildet.
