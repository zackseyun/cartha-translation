  text: Wealth is not fitting for a small-hearted man, and riches are not fitting for a man with an evil eye.
translation:
  language: de
  text: Reichtum steht einem kleinlichen Menschen nicht gut, und Gold steht einem Menschen mit bösem Blick[a] nicht gut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ein »böser Blick« bezeichnet hier eine geizige, neidische oder missgünstige Haltung.
    reason: Erläutert die hebräische Redewendung, deren Bedeutung im Deutschen sonst missverstanden werden könnte.
lexical_decisions:
- source_word: לְלֵב קָטֹן
  choice: einem engherzigen Menschen
  rationale: Wörtlich »einem kleinen Herzen«. Gemeint ist nach dem Zusammenhang und dem griechischen μικρολόγῳ ein kleinlicher beziehungsweise geiziger Mensch. »Engherzig« bewahrt das hebräische Herzbild und ist zugleich verständlich.
- source_word: לֹא נָאוֶה
  choice: steht … nicht gut
  rationale: נאה bezeichnet, was passend, angemessen oder geziemend ist. Die deutsche Wendung gibt diesen Sinn natürlich wieder, ohne eine bloß ästhetische Aussage nahezulegen.
- source_word: רַע עַיִן
  choice: mit bösem Blick
  rationale: Die hebräische Bildrede wird im Haupttext bewahrt; sie kann Geiz, Neid oder Missgunst bezeichnen. Eine Fußnote erläutert die Spannweite, statt sie einseitig festzulegen.
- source_word: חָרוּץ
  choice: Gold
  rationale: חָרוּץ kann kostbares Gold bezeichnen. Der griechische Paralleltext bietet allgemeiner χρήματα (Geld/Besitz); »Gold« folgt vorrangig dem erhaltenen hebräischen Wortlaut.
theological_decisions:
- issue: Moralische Bedeutung von »bösem Blick«
  choice: Das Bild wörtlich bewahren und seine idiomatische Bedeutung in einer Fußnote erklären.
  alternative: Direkt »geiziger« oder »missgünstiger Mann« schreiben.
  rationale: Das Hebräische lässt Geiz, Neid und Missgunst mitschwingen. Die bildhafte Wiedergabe bewahrt diese Mehrdeutigkeit und vermeidet eine unnötige Verengung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Parallelstruktur des hebräischen Spruchs bleibt erhalten; die Ellipse im zweiten Satzglied wirkt im Deutschen knapp und sprichwortartig.
