  text: He takes refuge in its shade from the heat[a], and he dwells in its shelters.
translation:
  language: de
  text: Er sucht Zuflucht in ihrem Schatten vor der Hitze[a] und wohnt in ihren Behausungen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Paralleltext lautet näher: „Er wird von ihr vor der sengenden Hitze beschirmt werden und in ihrer Herrlichkeit Herberge nehmen.“ Der hebräische Text hat „in ihren Behausungen“, der griechische dagegen „in ihrer Herrlichkeit“.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְחוֹסֶה
  choice: Er sucht Zuflucht
  rationale: Das Partizip von חסה bezeichnet das Suchen von Schutz und wird hier als allgemeingültige Aussage im Präsens wiedergegeben; das verbindende וְ wird im fortlaufenden deutschen Satz nicht eigens mit „und“ ausgedrückt.
- source_word: בְּצִלָּהּ
  choice: in ihrem Schatten
  rationale: צֵל bedeutet „Schatten“ beziehungsweise schützenden Schatten. Das feminine Suffix verweist auf die im Zusammenhang personifizierte Weisheit und wird im Deutschen natürlich mit „ihrem“ bewahrt.
- source_word: מֵחֹרֶב
  choice: vor der Hitze
  rationale: חֹרֶב kann Hitze, Trockenheit oder sengende Bedingungen bezeichnen. Der griechische Paralleltext καύματος stützt hier eindeutig die konkrete Bedeutung „Hitze“.
- source_word: וּבִמְעוֹנוֹתֶיהָ
  choice: in ihren Behausungen
  rationale: מְעוֹנוֹת bezeichnet Wohnstätten oder Behausungen. „Behausungen“ erhält die räumliche Bedeutung deutlicher als das stärker funktional deutende „Zufluchtsorte“ und wahrt den Plural.
- source_word: יִשְׁכֹּן
  choice: wohnt
  rationale: שכן bedeutet wohnen, sich niederlassen oder verweilen. Das Präsens passt zum parallel stehenden Partizip und zum allgemeingültigen Weisheitsspruch.
theological_decisions:
- issue: Geschlecht des personifizierten Bezugsworts
  choice: Die femininen Suffixe werden mit „ihrem/ihren“ wiedergegeben.
  alternative: „in dessen Schatten … in dessen Behausungen“ mit sachlichem Bezug auf das unmittelbar vorausgehende Bild.
  rationale: Im Hebräischen beziehen sich beide femininen Suffixe auf die personifizierte Weisheit beziehungsweise ihr Bild. Das Deutsche kann diese Personifikation ohne Unnatürlichkeit ausdrücklich bewahren.
- issue: Zeitwert von יִשְׁכֹּן im poetischen Parallelismus
  choice: Präsens „wohnt“.
  alternative: Futur „wird wohnen“.
  rationale: Das Imperfekt kann zukünftiges oder nicht abgeschlossenes Geschehen ausdrücken. Im Parallelismus mit dem Partizip וְחוֹסֶה ist ein allgemeingültiges Präsens natürlich und lässt den Spruch als fortdauernde Aussage erkennen.
- issue: Abweichung zwischen hebräischem und griechischem Schlussglied
  choice: Dem hebräischen Haupttext folgend „in ihren Behausungen“.
  alternative: Nach dem Griechischen „in ihrer Herrlichkeit wird er Herberge nehmen“.
  rationale: Der verlässlich überlieferte hebräische Text ist hier die primäre Grundlage. Die griechische Lesart δόξῃ („Herrlichkeit“) ist sachlich deutlich verschieden und wird deshalb transparent in der Fußnote genannt, nicht in den Haupttext eingemischt.
translation_notes:
  register: Moderne, würdige Standardsprache mit poetischem Parallelismus. „Behausungen“ ist leicht gehoben, aber allgemein verständlich und gibt den konkreten Plural des Hebräischen wieder.
