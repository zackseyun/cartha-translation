  source_fidelity: Der Haupttext gibt das hebräische Partizip וְחוֹסֶה idiomatisch als allgemeingültiges Präsens wieder und wahrt die Schutzmetaphorik von בְּצִלָּהּ מֵחֹרֶב. „in ihren Behausungen“ entspricht dem Plural מְעוֹנוֹתֶיהָ, und „wohnt“ ist als gnomisches Präsens für יִשְׁכֹּן im Parallelismus gut vertretbar. Die Abweichung des griechischen Paralleltexts im zweiten Glied wird korrekt nicht in den hebräischen Haupttext übernommen.
