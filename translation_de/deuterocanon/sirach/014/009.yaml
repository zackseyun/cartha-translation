  text: In the eye of the greedy[a], his portion is too little, and by taking his neighbor’s share he destroys his own portion.
translation:
  language: de
  text: In den Augen des Habgierigen[a] ist sein Anteil zu klein; indem er den Anteil seines Nächsten an sich nimmt, vernichtet er seinen eigenen Anteil.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich steht im Hebräischen etwa: »In den Augen des … ist sein Anteil klein.« Das hier mit »Habgierigen« wiedergegebene hebräische Wort ist in dieser Textüberlieferung schwierig. Der griechische Paralleltext lautet: »Das Auge des Habgierigen wird von einem Anteil nicht gesättigt«, und stützt diese Deutung.'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּעֵין
  choice: In den Augen
  rationale: Die hebräische Wendung bezeichnet, wie jemand etwas wahrnimmt oder beurteilt. Die Wiedergabe mit »Augen« bewahrt zugleich das anschauliche Bild.
- source_word: כּוֹשֵׁל
  choice: des Habgierigen
  rationale: Die hebräische Form ist in dieser Textüberlieferung schwierig. Der griechische Paralleltext hat πλεονέκτου (»des Habgierigen«) und stützt im Zusammenhang die Deutung als unersättlich begehrenden Menschen.
- source_word: מְעַט
  choice: zu klein
  rationale: Gemeint ist nicht nur eine objektiv geringe Menge, sondern dass der eigene Anteil dem Habgierigen nicht genügt. »Zu klein« bringt diese wertende Nuance natürlich zum Ausdruck.
- source_word: חֶלְקוֹ
  choice: sein Anteil / seinen eigenen
  rationale: »Anteil« gibt חֵלֶק in beiden Vorkommen einheitlich wieder; beim zweiten wird das Substantiv aus stilistischen Gründen mit »seinen eigenen« aufgenommen, wobei der Bezug auf den eigenen Anteil eindeutig bleibt.
- source_word: וְלוֹקֵחַ חֵלֶק רֵעֵהוּ
  choice: und indem er den Anteil seines Nächsten an sich nimmt
  rationale: Die partizipiale Handlung wird als Mittel beziehungsweise begleitende Handlung verstanden. »An sich nimmt« verdeutlicht im Deutschen den unrechtmäßigen, habgierigen Zugriff, ohne über den Zusammenhang hinauszugehen.
- source_word: מְאַבֵּד
  choice: vernichtet
  rationale: Das Kausativ bezeichnet aktives Zugrunderichten oder Vernichten. Die kräftige Formulierung erhält die zugespitzte moralische Warnung des Spruchs.
theological_decisions:
- issue: Heranziehung des griechischen Paralleltexts zur Deutung einer schwierigen hebräischen Lesart
  choice: כּוֹשֵׁל wird im Kontext als »Habgieriger« verstanden; der erste Halbvers beschreibt dessen unstillbares Begehren.
  alternative: 'Wörtlicher »der Strauchelnde« beziehungsweise: »In den Augen eines Strauchelnden ist sein Anteil klein.«'
  rationale: 'Die überlieferte hebräische Form ist kontextuell schwierig und als größere Abweichung gekennzeichnet. Der griechische Paralleltext lautet sinngemäß: »Das Auge des Habgierigen wird von einem Anteil nicht gesättigt« und bietet damit starke textgeschichtliche Unterstützung für die gewählte Deutung, ohne die hebräische Satzgestalt unnötig aufzugeben.'
translation_notes:
  register: Moderne, würdige Standardsprache mit sprichwörtlicher Prägnanz. Das Bild der Augen und die Wiederholung von »Anteil« werden soweit möglich bewahrt; die schwierige Lesart wird transparent in einer Fußnote ausgewiesen.
