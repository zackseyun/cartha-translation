  text: Refresh yourself while you still have the power; remember that there is no pleasure in Sheol[a], and death does not delay, and the decree of Sheol has not been made known to you.
translation:
  language: de
  text: 'Lass es dir gut gehen, solange du noch die Kraft dazu hast; denk daran: Im Scheol gibt es keinen Genuss[a], der Tod zögert nicht, und die Bestimmung für den Scheol ist dir nicht bekannt.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Paralleltext lautet: „Denk daran, dass der Tod nicht zögern wird und dir der Bund des Hades nicht gezeigt wurde.“ Der hebräische Text spricht dagegen von der „Bestimmung für den Scheol“, die dir nicht bekannt ist.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּלְאֵל יָדְךָ הִדָּשֵׁן
  choice: Gönn dir Gutes, solange du noch die Kraft dazu hast
  rationale: Die schwierige Wendung verbindet das Bild der verfügbaren Kraft beziehungsweise Mittel der Hand mit dem Verb דשן, das reichlich versorgen, erquicken oder genießen lassen kann. Die Fassung ist im Deutschen natürlich, bewahrt den Aufruf zum gegenwärtigen Lebensgenuss und vermeidet das missverständliche wörtliche „mäste dich“.
- source_word: זְכוֹר
  choice: denk daran
  rationale: Gibt den Imperativ direkt und in gegenwärtigem, würdigem Deutsch wieder.
- source_word: כִּי לֹא בִשְׁאוֹל תַּעֲנוּג
  choice: Im Scheol gibt es keinen Genuss
  rationale: תַּעֲנוּג bezeichnet Genuss oder Freude. „Scheol“ wahrt den althebräischen Begriff für den Bereich der Toten, ohne ihn mit „Hölle“ gleichzusetzen.
- source_word: וְלֹא מָוֶת יִתְמַהְמַהּ
  choice: der Tod zögert nicht
  rationale: Das Verb bezeichnet Zögern oder Sichverspäten; die präsentische Formulierung wahrt den sprichwortartigen Charakter. Der griechische Paralleltext bestätigt diesen Sinn.
- source_word: וְחֹק לִשְׁאוֹל לֹא הֻגַּד לָךְ
  choice: die Bestimmung des Scheols ist dir nicht bekannt
  rationale: חֹק kann eine feste Satzung, Ordnung oder Bestimmung bezeichnen; לִשְׁאוֹל stellt sie in Beziehung zum Scheol. „Ist dir nicht bekannt“ gibt das passive נגד idiomatisch wieder und lässt offen, ob Zeitpunkt, Ordnung oder Anspruch des Todes gemeint ist.
theological_decisions:
- issue: Wiedergabe von שְׁאוֹל
  choice: Scheol
  alternative: Totenreich; Grab; Hades
  rationale: „Scheol“ bewahrt die Begriffswelt hebräischer Weisheitsliteratur und vermeidet die Eintragung späterer Vorstellungen von Hölle oder endgültigem Gericht.
- issue: Verhältnis des hebräischen חֹק zum griechischen διαθήκη
  choice: Bestimmung des Scheols
  alternative: Bund des Hades
  rationale: Der hebräische, hier vorrangige Text bezeichnet eine feste Bestimmung oder Ordnung; der griechische Paralleltext hat dagegen „Bund des Hades“. Die Abweichung wird in der Fußnote offengelegt, nicht harmonisiert.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Weisheitston. „Gönn dir Gutes“ macht den lebensbejahenden Imperativ natürlich verständlich; „Scheol“ erhält den historischen theologischen Begriff. Die Satzglieder bleiben knapp und eindringlich.
