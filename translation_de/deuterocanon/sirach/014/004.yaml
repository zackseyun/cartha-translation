translation:
  language: de
  text: Wer sich selbst etwas vorenthält, häuft für einen anderen an, und an seinem Besitz wird sich ein Fremder[a] gütlich tun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: »ein Fremder«; die griechische Parallelüberlieferung hat den Plural »andere«.'
    reason: alternative_reading
lexical_decisions:
- source_word: מוֹנֵעַ לְנַפְשׁוֹ
  choice: sich selbst etwas vorenthält
  rationale: מנע bezeichnet das Vorenthalten oder Verweigern; נפשׁו ist hier idiomatisch reflexiv zu verstehen. Die Formulierung bewahrt den Gedanken selbst auferlegter Entbehrung, ohne das hebräische »seiner Seele« unnatürlich wörtlich wiederzugeben.
- source_word: יִקְבֹּץ לְאַחֵר
  choice: häuft für einen anderen an
  rationale: קבץ bedeutet sammeln oder zusammenbringen. »anhäufen« macht in diesem Kontext das Ansammeln von Besitz und die Ironie deutlich, dass letztlich ein anderer davon profitiert.
- source_word: וּבְטוֹבָתוֹ
  choice: an seinem Besitz
  rationale: טובה bezeichnet hier konkret die guten Dinge beziehungsweise die Habe des Menschen. »Besitz« ist im Deutschen natürlich und wird durch das griechische τοῖς ἀγαθοῖς αὐτοῦ gestützt.
- source_word: יִתְבַּעְבֵּעַ
  choice: wird sich gütlich tun
  rationale: Die seltene reflexiv-intensive Form bezeichnet üppigen oder genussvollen Gebrauch. »sich gütlich tun« gibt diesen nachdrücklichen Genuss wieder und entspricht dem griechischen τρυφήσουσιν.
- source_word: זָר
  choice: ein Fremder
  rationale: Das hebräische Wort steht im Singular und bezeichnet jemanden, der dem Besitzenden nicht zugehört. Die Übersetzung wahrt diese Form, während die griechische Parallelüberlieferung einen pluralischen Sinn bezeugt.
