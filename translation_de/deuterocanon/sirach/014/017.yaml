  source_fidelity: 'Die Übersetzung folgt dem hebräischen Text eng: כָּל־הַבָּשָׂר ist treffend mit „Alles Fleisch“ wiedergegeben, יִבְלֶה mit „verschleißt“, und der Vergleich mit einem Gewand bleibt erhalten. „Ein ewiges Gesetz“ gibt וְחֹק עוֹלָם sachgerecht wieder. Der schwierige, in seiner Numerusverbindung auffällige Schluss גֹּוֵעַ יִגְוָעוּ wird nicht unzulässig geglättet; „Sterbend sterben sie“ bewahrt sowohl die Kürze als auch den pluralischen Abschluss. Die Fußnote erklärt die Schwierigkeit und zieht den griechischen Paralleltext nur erläuternd heran.'
  naturalness: Der Satz ist würdiges, verständliches modernes Standarddeutsch. „Sterbend sterben sie“ ist absichtlich markiert und im Haupttext ohne Anmerkung möglicherweise ungewohnt, aber als formnahe Wiedergabe eines selbst schwierigen hebräischen Kolons vertretbar; die unmittelbar gesetzte Fußnote sichert die Verständlichkeit. „Gewand“ und „ewiges Gesetz“ passen zum gehobenen Weisheitsregister.
  terminology: „Fleisch“, „Gewand“ und „Gesetz“ sind konsistent und registergerecht. Die Formulierung vermeidet eine konfessionell oder lehrmäßig vorentscheidende Auslegung. Die Anmerkung bezeichnet die allgemeine Sterblichkeit angemessen als Sinngehalt, ohne die hebräische Uneindeutigkeit aufzuheben.
