  text: All flesh wears out like a garment[a], and the everlasting decree is, “Dying, they shall die.”
translation:
  language: de
  text: 'Alles Fleisch verschleißt wie ein Gewand, und ein ewiges Gesetz lautet: »Sterbend sterben sie.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich gibt der schwierige hebräische Schluss etwa den Sinn wieder: »Der Sterbende – sie sterben.« Gemeint ist die allgemeine Sterblichkeit. Der griechische Paralleltext versteht die Worte als eine seit jeher geltende Todesbestimmung.'
    reason: alternative_reading
lexical_decisions:
- source_word: כָּל הַבָּשָׂר
  choice: Alles Fleisch
  rationale: Bewahrt die konkrete hebräische Kollektivformulierung für alle sterblichen Lebewesen und entspricht dem griechischen πᾶσα σὰρξ.
- source_word: כַּבֶּגֶד
  choice: wie ein Gewand
  rationale: בגד bezeichnet allgemein ein Kleidungsstück; »Gewand« ist würdevoll und trägt das Bild des Verschleißens natürlich.
- source_word: יִבְלֶה
  choice: verschleißt
  rationale: בלה bezeichnet das Alt- oder Abgenutztwerden und passt unmittelbar zum Vergleich mit einem Gewand.
- source_word: וְחֹק עוֹלָם
  choice: und ein ewiges Gesetz lautet
  rationale: חק bezeichnet eine feste Satzung oder Ordnung; »ewiges Gesetz« bewahrt deren dauerhafte Geltung, während »lautet« den folgenden knappen Spruch einführt.
- source_word: גֹּוֵעַ יִגְוָעוּ
  choice: Sterbend sterben sie
  rationale: Die bewusst knappe Wiedergabe erhält die schwierige hebräische Wortfigur und die dritte Person Plural, ohne sie durch eine zweite Person oder eine glättende Deutung zu ersetzen.
theological_decisions:
- issue: Wiedergabe des schwierigen Schlusskolons über die allgemeine Sterblichkeit
  choice: »Sterbend sterben sie.«
  alternative: »Sie müssen gewiss sterben.« / »Dem Tod wirst du sterben.«
  rationale: Der überlieferte hebräische Wortlaut ist grammatisch ungewöhnlich und knapp. Die gewählte Fassung bewahrt seine Spannung und die dritte Person Plural; die Fußnote erläutert die idiomatische Aussage und den klareren griechischen Paralleltext, ohne diesen an die Stelle des vorhandenen Hebräischen zu setzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die markante Formulierung »Sterbend sterben sie« ist absichtlich ungewöhnlich, weil auch das Hebräische an dieser Stelle knapp und schwierig ist; die Fußnote sichert die Verständlichkeit.
