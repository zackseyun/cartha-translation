  text: One who looks in through her window[a], and at her doorway he will listen.
translation:
  language: de
  text: Wer durch ihr Fenster späht[a], lauscht an ihren Türen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „hineinblickt“. Das hebräische Verb bezeichnet ein gezieltes Schauen oder Spähen; der griechische Paralleltext hat „durch ihre Fenster hineinschauen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּשְׁקִיף
  choice: Wer … späht
  rationale: Das Partizip von שׁקף bezeichnet ein gezieltes Schauen oder Spähen. Zusammen mit בְּעַד und dem griechischen παρακύπτων ist mehr als ein beiläufiger Blick gemeint.
- source_word: בְּעַד חֲלוֹנָה
  choice: durch ihr Fenster
  rationale: בְּעַד hat hier räumlich die Bedeutung „durch“. Das feminine Bezugswort wird entsprechend der personifizierten Weisheit mit „ihr“ wiedergegeben.
- source_word: וְעַל פְּתָחֶיהָ
  choice: und an ihren Türen
  rationale: 'Der hebräische Text hat den Plural mit femininem Suffix: „an/bei ihren Öffnungen, Eingängen oder Türen“. „An ihren Türen“ bewahrt Numerus und Hausmetaphorik.'
- source_word: יְצוֹתֵת
  choice: lauscht
  rationale: Das Verb bezeichnet aufmerksames, womöglich heimliches Hören. „Lauschen“ bewahrt diese Bedeutungsbreite natürlicher als das stärker wertende „belauschen“; das hebräische Imperfekt kann in der deutschen Sentenz mit Präsens wiedergegeben werden.
theological_decisions:
- issue: Personifizierung der Weisheit als weiblich
  choice: Das feminine Pronomen „ihr“ bleibt erhalten.
  alternative: Abstrakte Wiedergabe ohne weibliches Pronomen.
  rationale: Der Zusammenhang personifiziert die Weisheit als Frau beziehungsweise Hausherrin. Die feminine Bildsprache des Hebräischen und des griechischen Paralleltexts soll nicht eingeebnet werden.
translation_notes:
  register: Knappe, sprichwortartige Syntax in modernem, würdigem Standarddeutsch. Der Plural „Türen“ folgt bewusst dem Hebräischen; „lauscht“ erhält die Spannung zwischen aufmerksamem und möglicherweise heimlichem Hören.
