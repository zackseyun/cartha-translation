translation:
  language: de
  text: Glücklich ist der Mensch, der durch seinen Mund nicht zu Fall gekommen ist[a] und dessen Herz ihn nicht verurteilt hat.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hebräische Wortlaut ist schwierig und lautet wörtlich etwa: „den sein Mund nicht verlassen hat“. Die griechische Parallele hat: „der in seinem Mund nicht ausgeglitten ist“, also beim Reden keinen Fehltritt begangen hat.'
    reason: alternative_reading
  - marker: b
    text: 'Die hebräische Verbform ist unsicher; möglich ist auch: „dessen Herz ihn nicht getadelt (oder verurteilt) hat“. Die griechische Parallele lautet dagegen: „und der nicht vom Schmerz der Sünde durchbohrt worden ist“.'
    reason: textual_variant
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: Glücklich ist
  rationale: Die hebräische Weisheitsformel bezeichnet einen Menschen in einer beneidenswert guten Lage. „Glücklich ist“ klingt im heutigen Deutsch natürlich und bewahrt den Charakter eines Weisheitsspruchs, ohne einen ausdrücklich genannten göttlichen Segensakt vorauszusetzen.
- source_word: אֱנוֹשׁ
  choice: der Mensch
  rationale: אֱנוֹשׁ bezeichnet hier allgemein den Menschen. Das deutsche Maskulinum „der Mensch“ gibt die repräsentative Einzahl wieder, ohne die Aussage auf Männer zu beschränken.
- source_word: לֹא עֲזָבוֹ פִיהוּ
  choice: der durch seinen Mund nicht zu Fall gekommen ist
  rationale: Der überlieferte hebräische Wortlaut bedeutet wörtlich etwa „den sein Mund nicht verlassen hat“ und ist schwierig. Die griechische Parallele spricht vom Ausgleiten „mit/in seinem Mund“ und bestätigt, dass ein Fehltritt im Reden gemeint ist. Die gewählte Formulierung bewahrt „Mund“ und gibt den wahrscheinlichen Sinn verständlich wieder.
- source_word: וְלֹא אָבַח עָלָיו דִּין לִבּוֹ
  choice: und den das Urteil seines Herzens nicht angeklagt hat
  rationale: Die ungewöhnliche Verbform ist unsicher. דִּין לִבּוֹ enthält jedoch ausdrücklich die Vorstellung vom inneren Urteil des Herzens. „angeklagt“ hält den gerichtlichen und auf das Gewissen bezogenen Sinn offen, ohne „Herz“ vorschnell durch „Gewissen“ zu ersetzen.
theological_decisions:
- issue: Wiedergabe der Seligpreisungsformel
  choice: Glücklich ist der Mensch
  alternative: Selig ist der Mensch
  rationale: Im Kontext der Weisheitsliteratur bezeichnet אַשְׁרֵי vor allem einen beneidenswerten Zustand. „Glücklich“ vermittelt dies in gegenwärtigem Deutsch, während „selig“ stärker religiös festgelegt klingen könnte.
- issue: Textlich schwierige Aussage über den Mund
  choice: der durch seinen Mund nicht zu Fall gekommen ist
  alternative: den sein Mund nicht verlassen hat
  rationale: Eine rein wörtliche Wiedergabe des schwierigen Hebräischen wäre unverständlich. Die griechische Parallele stützt den Sinn eines sprachlichen Fehltritts; die Übersetzung macht diesen wahrscheinlichsten Sinn sichtbar, kennzeichnet die Unsicherheit aber in der Fußnote.
- issue: Inneres Urteil und Sündenschmerz
  choice: den das Urteil seines Herzens nicht angeklagt hat
  alternative: der nicht vom Schmerz über die Sünde durchbohrt worden ist
  rationale: Der hebräische Text spricht vom Urteil des Herzens, während die griechische Parallele den Schmerz der Sünde nennt. Der Haupttext folgt dem Hebräischen; die abweichende oder ergänzende griechische Deutung wird nicht eingearbeitet, sondern in der Fußnote bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit weisheitlicher Prägnanz. Die schwer verständlichen hebräischen Wendungen werden sinnorientiert, aber quellennah wiedergegeben; die griechische Parallele dient zur Klärung und wird bei abweichender Aussage ausdrücklich in den Fußnoten genannt.
