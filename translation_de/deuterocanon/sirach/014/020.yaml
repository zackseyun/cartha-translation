translation:
  language: de
  text: Glücklich ist der Mensch, der über Weisheit nachsinnt[a] und sich der Einsicht zuwendet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: »Gesegnet ist der Mensch.« Die hebräische Seligpreisungsformel bezeichnet einen beneidenswerten, begünstigten Zustand, nicht nur ein Gefühl. Der griechische Paralleltext weicht ab: »Glücklich der Mann, der in Weisheit sein Ende finden wird und der in seiner Einsicht reden wird.«'
    reason: Lexikalische Alternative und abweichende griechische Lesart
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: Glücklich
  rationale: Die hebräische Seligpreisungsformel bezeichnet einen beneidenswerten, begünstigten Zustand. „Glücklich“ ist im Deutschen eine natürliche, würdige Entsprechung; Fußnote [a] nennt die traditionelle Alternative.
- source_word: אֱנוֹשׁ
  choice: der Mensch
  rationale: אֱנוֹשׁ bezeichnet hier den Menschen als Einzelnen. Das grammatische Maskulinum ist im Deutschen in „der Mensch“ bewahrt, ohne die Aussage unnötig auf einen Mann einzuengen.
- source_word: בְּחָכְמָה יֶהְגֶּה
  choice: der über Weisheit nachsinnt
  rationale: הגה bezeichnet ein anhaltendes Sinnen oder Murmeln. Mit בְּ ist „über Weisheit nachsinnen“ im modernen Deutschen idiomatisch und bleibt dem kontemplativen Sinn nahe.
- source_word: וּבִתְבוּנָה יִשְׁעֶה
  choice: und verständig überlegt
  rationale: ישע ist hier selten und kann eine aufmerksame Hinwendung oder Betrachtung ausdrücken. „Verständig überlegt“ wahrt den Parallelismus, ohne die unsichere Bedeutung zu stark auf körperliches Schauen oder Sich-Neigen festzulegen.
theological_decisions:
- issue: Reichweite des maskulinen Singulars in der Weisheitsseligpreisung
  choice: der Mensch
  alternative: der Mann
  rationale: Das hebräische אֱנוֹשׁ ist grammatisch maskulin singular, bezeichnet lexikalisch jedoch häufig den Menschen allgemein. „Der Mensch“ bewahrt Numerus und Form einer exemplarischen Einzelperson, ohne eine ausschließlich männliche Geltung zu behaupten.
- issue: Abweichende griechische Parallelüberlieferung
  choice: Der hebräische Text wird im Haupttext übersetzt.
  alternative: „Glücklich der Mann, der in Weisheit sein Ende finden wird und sich über seine Einsicht unterhalten wird.“
  rationale: Der griechische Paralleltext weicht besonders bei τελευτήσει deutlich vom gut bezeugten hebräischen יֶהְגֶּה ab. Wegen der hohen Zuverlässigkeit des angegebenen hebräischen Textes bestimmt dieser den Haupttext; die griechische Variante wird dokumentiert.
translation_notes:
  register: Moderne, gehobene Weisheitssprache mit knapper Seligpreisungsformel. „Nachsinnen“ bewahrt den meditativen Charakter; „verständig überlegen“ klingt natürlich und lässt die genaue Nuance des seltenen zweiten Verbs bewusst offen.
