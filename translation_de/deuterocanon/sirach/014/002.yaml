  text: Blessed is the man whom his soul has not reproached[a], and whose hope has not ceased.
translation:
  language: de
  text: Glücklich ist der Mann, den seine Seele nicht angeklagt hat[a] und dessen Hoffnung nicht erloschen ist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hebräische Wortlaut dieser Satzhälfte ist in der erhaltenen Überlieferung der Kairoer Geniza schwierig. Die griechische Parallele lautet: „dessen Seele ihn nicht verurteilt hat“. Möglich sind auch die Nuancen „ihm keine Vorwürfe gemacht“ oder „ihn beschämt“.'
    reason: textual_variant
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: Glücklich ist
  rationale: Leitet einen weisheitlichen Glückwunsch ein. „Glücklich ist“ ist im heutigen Deutsch natürlich und bezeichnet hier nicht bloß ein Gefühl, sondern den begünstigten Zustand des Betreffenden.
- source_word: אִישׁ
  choice: der Mann
  rationale: Gibt den grammatisch maskulinen Singular des Hebräischen formgetreu wieder; im Weisheitsspruch steht der Mann zugleich beispielhaft für einen Menschen.
- source_word: לֹא חִסַּדְתּוֹ נַפְשׁוֹ
  choice: den seine Seele nicht angeklagt hat
  rationale: Der überlieferte hebräische Wortlaut ist schwierig. „Seele“ bewahrt נַפְשׁוֹ, statt es deutend durch „Gewissen“ zu ersetzen; „angeklagt“ gibt den durch das griechische κατέγνω gestützten Sinn wieder, ohne ihn bis zu „verurteilt“ zu verschärfen.
- source_word: וְלֹא שָׁבְתָה
  choice: nicht geschwunden ist
  rationale: שבת bezeichnet hier das Aufhören oder Ausbleiben. Bei „Hoffnung“ ist „nicht geschwunden“ im Deutschen natürlich und wahrt den Sinn des Fortbestehens.
- source_word: תּוֹחַלְתּוֹ
  choice: dessen Hoffnung
  rationale: „Hoffnung“ ist die naheliegende weisheitliche Bedeutung und wird auch durch das griechische ἐλπίς bestätigt.
theological_decisions:
- issue: Wiedergabe der schwierigen ersten Vershälfte bei einer geringfügig unstimmigen hebräischen Überlieferung
  choice: den seine Seele nicht angeklagt hat
  alternative: dem seine Seele keine Vorwürfe gemacht hat; den seine Seele nicht verurteilt hat; den sein Innerstes nicht beschämt hat
  rationale: Das erhaltene Hebräisch bleibt Ausgangspunkt, doch seine schwierige Verbform wird mithilfe der griechischen Parallele κατέγνω geklärt. „Angeklagt“ hält die Spannweite zwischen „Vorwürfe machen“ und „verurteilen“ offen und vermeidet die interpretierende Ersetzung von „Seele“ durch „Gewissen“.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit der knappen Form eines Weisheitsspruchs. Die ungewöhnliche Rede von der anklagenden „Seele“ wurde bewusst beibehalten, um die Bildsprache und Mehrdeutigkeit des Ausgangstextes nicht auf „Gewissen“ festzulegen.
