  text: An evil eye is stingy over bread[b][a], and there is meanness at his table.
translation:
  language: de
  text: Ein missgünstiges Auge[a] geizt mit Brot, und an seinem Tisch herrscht Kargheit.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das „missgünstige Auge“ ist eine hebräische Redewendung für eine neidische, widerwillige oder geizige Haltung; der griechische Paralleltext stützt diesen Sinn.
    reason: lexical_alternative
  - marker: b
    text: Der hebräische Wortlaut des zweiten Satzteils ist schwierig. Der griechische Paralleltext stützt den Sinn einer kargen oder geizigen Bewirtung am Tisch.
    reason: alternative_reading
lexical_decisions:
- source_word: עַיִן רַע / ὀφθαλμὸς πονηρός
  choice: ein missgünstiges Auge
  rationale: Die hebräische Wendung bezeichnet eine neidische, missgünstige und geizige Haltung. „Missgünstiges Auge“ bewahrt das Bild und macht dessen ethischen Sinn im Deutschen zugleich verständlich.
- source_word: תָּעִיט / φθονερός
  choice: geizt
  rationale: Die hebräische Form ist schwierig; der griechische Paralleltext stützt den Sinn des neidischen oder missgünstigen Vorenthaltens. „Geizt mit“ gibt dieses Verhalten beim Austeilen von Nahrung natürlich wieder.
- source_word: לָחֶם / ἄρτος
  choice: Brot
  rationale: Hebräischer und griechischer Text nennen wörtlich Brot. Das konkrete biblische Bild für alltägliche Nahrung bleibt erhalten.
- source_word: מְהוּמָה / ἐνλεπής
  choice: Kargheit
  rationale: Die hebräische Lesart ist schwierig. Im Zusammenhang und im Licht des griechischen Paralleltexts bezeichnet sie wahrscheinlich dürftige, geizige Bewirtung; „Kargheit“ erfasst diesen sozialen und moralischen Sinn.
- source_word: שֻׁלְחָנוֹ / τῆς τραπέζης αὐτοῦ
  choice: an seinem Tisch
  rationale: Die gemeinsame Bildsprache des Hebräischen und Griechischen wird direkt und idiomatisch wiedergegeben.
