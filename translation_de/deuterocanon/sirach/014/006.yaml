translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die erste Aussage ist bewusst allgemein gehalten, während die Fußnote die engere griechische Deutung als selbstschädigenden Geiz nennt. Die ungewöhnliche hebräische Wendung וְעִמּוֹ wird im Haupttext erkennbar bewahrt und in der Fußnote erläutert.
