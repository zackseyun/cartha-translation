translation:
  language: de
  text: Wer sich selbst Böses antut[a], ist schlimmer als jeder andere; und mit ihm kommt die Vergeltung seiner Bosheit.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Griechisch: »wer sich selbst nichts gönnt« oder »wer gegen sich selbst geizig ist«; damit wird selbstschädigender Geiz ausdrücklich benannt.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »und dies ist die Vergeltung seiner Bosheit.« Hebräisch wörtlich: »und mit/bei ihm ist die Vergeltung seiner Bosheit«; die griechische Fassung hat »und dies ist die Vergeltung seiner Bosheit«.'
    reason: textual_or_syntactic_ambiguity
lexical_decisions:
- source_word: רַע לְנַפְשׁוֹ
  choice: wer sich selbst Böses antut
  rationale: Die hebräische Nominalwendung bedeutet wörtlich etwa »böse gegen sich selbst/seine Seele«. Die gewählte Formulierung ist im modernen Deutschen verständlich, bewahrt die moralische Aussage und lässt offen, auf welche Weise der Betreffende sich selbst schadet.
- source_word: אֵין רַע מִמֶּנּוּ
  choice: ist schlimmer als jeder andere
  rationale: Die idiomatische deutsche Vergleichsform gibt die hebräische Aussage wieder, dass niemand schlimmer ist als ein solcher Mensch.
- source_word: תּשְלוּמַת
  choice: Vergeltung
  rationale: Das Substantiv bezeichnet Rückerstattung, Ausgleich oder Vergeltung. Im Zusammenhang einer moralischen Folge ist »Vergeltung« prägnant und würdevoll.
- source_word: רָעָתוֹ
  choice: seine Bosheit
  rationale: »Bosheit« bewahrt den moralischen Gehalt des wiederholten Stammes רע. Eine vollständige Wiederholung mit demselben deutschen Wort ist wegen der natürlichen Formulierung »schlimmer« nicht möglich, doch der Zusammenhang bleibt erkennbar.
- source_word: וְעִמּוֹ
  choice: und bei ihm liegt
  rationale: Die Wendung bedeutet wörtlich »und bei/mit ihm«. »Bei ihm liegt« erhält diese ungewöhnliche Formulierung, ohne sie vorschnell als bloßes »dies ist« aufzulösen.
- source_word: τοῦ βασκαίνοντος ἑαυτόν
  choice: wer sich selbst Böses antut
  rationale: Die griechische Parallele präzisiert die Aussage in Richtung selbstbezogenen Missgönnens oder Geizes. Da der hebräische Text breiter formuliert, bleibt diese Nuance in der Fußnote.
