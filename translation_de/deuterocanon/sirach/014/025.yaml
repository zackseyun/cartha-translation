  text: Er schlägt sein Zelt an ihrer Seite auf[a] und wohnt in einer guten Wohnstätte.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „an/bei ihrer Hand“; die Wendung bezeichnet hier Nähe zu ihr. Auch der griechische Paralleltext hat „bei ihren Händen“.'
