    reason: alternative_reading
lexical_decisions:
- source_word: וְנוֹטֶה
  choice: Er schlägt … auf
  rationale: נטה bezeichnet zusammen mit אהל das Ausspannen beziehungsweise Aufschlagen eines Zeltes. Die deutsche Wendung bewahrt das konkrete Bild natürlich.
- source_word: אָהֳלוֹ
  choice: sein Zelt
  rationale: אהל ist das gewöhnliche Wort für „Zelt“; eine Verallgemeinerung zu „Unterkunft“ würde das Bild abschwächen.
- source_word: עַל יָדָהּ
  choice: an ihrer Seite
  rationale: Wörtlich steht „an/bei ihrer Hand“. Die Wendung bezeichnet hier räumliche Nähe; „an ihrer Seite“ gibt dies idiomatisch wieder und bewahrt zugleich die feminine Personifikation der Weisheit.
- source_word: וְשָׁכַן
  choice: und wohnt
  rationale: שכן bedeutet „wohnen, sich niederlassen“. Im Zusammenhang mit dem Zeltbild ist „wohnt“ im Deutschen knapp und passend.
- source_word: שֹׁכֶן טוֹב
  choice: an einem guten Wohnplatz
  rationale: Die hebräische Fügung ist knapp und ungewöhnlich, etwa „ein guter Wohnort/eine gute Wohnstätte“. Die gewählte Form erhält den Wohnbereich, ohne die griechische Lesart „bei den Guten/guten Dingen“ in den hebräischen Text einzutragen.
theological_decisions:
- issue: Weibliche Personifikation der Weisheit
  choice: Das feminine Pronomen wird mit „ihrer“ beibehalten.
  alternative: Die Weisheit durch ein sächliches Pronomen entpersonalisieren.
  rationale: Der Zusammenhang stellt die Weisheit als Frau dar. Diese literarische und theologische Bildsprache ist im Hebräischen und im griechischen Paralleltext ausdrücklich vorhanden.
- issue: Konkrete Zelt- und Wohnmetaphorik
  choice: Zelt, Wohnen und Wohnplatz bleiben als konkrete Bilder erhalten.
  alternative: 'Abstrakt umschreiben, etwa: „Er bleibt der Weisheit nahe und lebt gut.“'
  rationale: Der Vers beschreibt die Nähe zur Weisheit durch ein anschauliches Wohnbild. Eine abstrakte Paraphrase würde diese Spannung und Bildkraft einebnen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz bleibt bildhaft und knapp; „an ihrer Seite“ vermeidet die im Deutschen missverständliche Wörtlichkeit „bei ihrer Hand“, während die Fußnote die hebräische Form offenlegt.
