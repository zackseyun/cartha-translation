  text: He who sets his heart on her ways and considers her insights[a].
translation:
  language: de
  text: Wer sein Herz auf ihre Wege richtet und über ihre Einsichten nachsinnt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Parallelüberlieferung lautet: „und er wird in ihren verborgenen Dingen Verständnis gewinnen“, auch möglich: „in ihren Geheimnissen“. Der hebräische Text hat „ihre Einsichten“; ihm folgt der Haupttext.'
    reason: alternative_reading
lexical_decisions:
- source_word: הַשָּׂם
  choice: Wer … richtet
  rationale: Der mit Artikel substantivierte Partizip bezeichnet denjenigen, der etwas bewusst ausrichtet. Die deutsche Relativkonstruktion ist natürlich und lässt die grammatisch maskuline Einzelperson im anschließenden „sein“ erkennen.
- source_word: עַל דְרָכֶיהַ לִבּוֹ
  choice: sein Herz auf ihre Wege richtet
  rationale: 'Die Wendung wird in ihrer Bildhaftigkeit bewahrt: לֵב bezeichnet Denken, Wollen und innere Ausrichtung, nicht nur den Verstand; דְּרָכִים entspricht „Wege“ und stimmt mit der griechischen Parallele überein.'
- source_word: וּבִתְבוּנֹתֶיהַ
  choice: und über ihre Einsichten
  rationale: Das hebräische תבונותיה bezeichnet ihre Einsichten bzw. Erkenntnisse. Die Hauptübersetzung folgt dem sicheren hebräischen Text; die abweichende griechische Lesart wird in der Fußnote dokumentiert.
- source_word: יִתְבּוֹנָן
  choice: nachsinnt
  rationale: Die Hitpolel-Form drückt aufmerksames, vertieftes Betrachten und Erwägen aus. „nachsinnt“ gibt diesen kontemplativen Zug idiomatisch wieder.
theological_decisions:
- issue: Weibliche Personifikation der Weisheit
  choice: ihre
  alternative: deren / ihre Sache
  rationale: Der Zusammenhang personifiziert die Weisheit weiblich, wie es auch die femininen Formen im Hebräischen und Griechischen anzeigen. „ihre“ erhält diese literarische und theologische Gestalt.
- issue: Grammatisch maskuline Einzelperson
  choice: Wer sein Herz … richtet
  alternative: Derjenige, der sein Herz … richtet / Wer das Herz … richtet
  rationale: Das hebräische substantivierte Partizip ist maskulin singular. Die Formulierung mit „sein Herz“ bildet dies ab, ohne im Deutschen schwerfällig zu wirken.
- issue: Hebräischer Text gegenüber griechischer Parallelüberlieferung
  choice: Einsichten
  alternative: verborgene Dinge / Geheimnisse
  rationale: Der hebräische Text ist hier sicher bezeugt und textkritisch vorrangig. Die griechische Parallele bewahrt eine abweichende Deutung, die nicht in den Haupttext eingetragen, sondern transparent angemerkt wird.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die poetische Bildsprache mit „Herz“ und „Wege“ bleibt erhalten; „nachsinnt“ vermittelt die ruhige, vertiefte Reflexion des Hebräischen.
