  text: If he is evil to himself[a], to whom will he do good? He will not enjoy his own good things.
translation:
  language: de
  text: Wer sich selbst Böses tut, wem wird er Gutes tun? Sein eigenes Gut wird er nicht genießen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Er wird sein Gutes nicht sehen.“ Gemeint ist wohl, dass er das ihm gehörende Gute nicht erlebt oder genießt. Die griechische Parallele macht diesen Sinn mit „Er wird sich nicht an seinen Besitztümern freuen“ ausdrücklich.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַע לְנַפְשׁוֹ
  choice: gegen sich selbst schlecht handelt
  rationale: Die Wendung beschreibt, dass jemand sich selbst gegenüber schlecht beziehungsweise schädlich handelt. „Sich selbst“ gibt נֶפֶשׁ hier idiomatisch wieder, ohne eine bestimmte Lehre über die Seele einzutragen; „schlecht handelt“ bewahrt die ethische Färbung von רַע.
- source_word: לְמִי יֵיטִיב
  choice: wem wird er Gutes tun?
  rationale: Das Hifil von יטב bezeichnet hier das Tun von Gutem oder das Wohltun. Die Formulierung erhält den pointierten Gegensatz zwischen schlechtem Handeln gegen sich selbst und Gutestun an anderen.
- source_word: וְלֹא יִרְאֶה
  choice: wird er nicht genießen
  rationale: Wörtlich steht „wird er nicht sehen“. Im Zusammenhang bezeichnet „sehen“ wahrscheinlich das Erleben oder Genießen; die griechische Parallele mit „sich freuen“ stützt dieses Verständnis.
- source_word: בְּטוֹבָתוֹ
  choice: sein eigenes Gut
  rationale: טוֹבָה kann das Gute, Wohlergehen, Wohlstand oder vorhandene Güter bezeichnen. „Gut“ hält die Bedeutung weiter als „Besitz“ oder „Vermögen“, während „eigenes“ den Bezug des Suffixes hervorhebt.
