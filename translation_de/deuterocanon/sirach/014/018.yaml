base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/014/018.yaml
  text: 'Like the leaves budding on a luxuriant tree—one withers and another sprouts—so are the generations of flesh and blood: one dies and another is born[a].'
translation:
  language: de
  text: 'Wie Blätter, die an einem üppig grünen Baum sprießen – eines verwelkt, ein anderes treibt aus –, so sind die Generationen der Menschen aus Fleisch und Blut: Die eine stirbt, eine andere wird geboren[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Hebräischen ist bei „eine andere“ auch „reift heran“ oder eine ähnliche Bedeutung möglich; der griechische Text hat „wird geboren“.
    reason: alternative_reading
lexical_decisions:
- source_word: כְּפֶרַח עָלֶה
  choice: Wie Blätter, die … sprießen
  rationale: Die verdichtete hebräische Wendung beschreibt hervorkommendes beziehungsweise gedeihendes Laub; der griechische Paralleltext ὡς φύλλον θάλλον bestätigt das Bild sprießender Blätter. Der deutsche Plural gibt das kollektive Bild natürlich wieder.
- source_word: עֵץ רַעֲנָן
  choice: an einem üppig grünen Baum
  rationale: רַעֲנָן bezeichnet frische, kräftige, üppige Begrünung; die Formulierung bewahrt sowohl die Farbe als auch die Vorstellung reichen Wachstums.
- source_word: שֶׁזֶּה נוֹבֵל וְאַחֵר צוֹמֵחַ
  choice: eines verwelkt, ein anderes treibt aus
  rationale: נוֹבֵל bezeichnet Verwelken oder Verblassen, צוֹמֵחַ Wachstum beziehungsweise Austreiben. So bleibt der Gegensatz von Vergehen und neuem Pflanzenwachstum erhalten.
- source_word: כֵּן דּוֹרוֹת בָּשָׂר וָדָם
  choice: so sind die Generationen aus Fleisch und Blut
  rationale: Die Vergleichsstruktur und das konkrete semitische Menschenbild werden direkt bewahrt. „Generationen“ bezeichnet hier die aufeinanderfolgenden menschlichen Geschlechter.
- source_word: אֶחַד גֹּוֵעַ
  choice: Die eine stirbt
  rationale: גֹּוֵעַ bedeutet sterben beziehungsweise den letzten Atemzug tun. Das feminine Pronomen bezieht sich im Deutschen natürlich auf „Generation“.
- source_word: וְאֶחַד גּוֹמֵל
  choice: eine andere wird geboren
  rationale: Das hebräische גּוֹמֵל kann Reifung oder Heranwachsen ausdrücken; der griechische Parallelzeuge ἑτέρα δὲ γεννᾶται liest ausdrücklich „eine andere wird geboren“. Diese Lesart passt zum Wechsel der Generationen, während die hebräische Möglichkeit in der Fußnote erhalten bleibt.
theological_decisions:
- issue: Anthropologische Wendung בָּשָׂר וָדָם
  choice: „aus Fleisch und Blut“ beibehalten
  alternative: „der Menschen“ beziehungsweise „der Menschheit“
  rationale: Die wörtliche, auch im Deutschen verständliche Wendung betont die leibliche Sterblichkeit und bewahrt die Bildsprache des hebräischen sowie des griechischen Textes.
- issue: Bedeutung von וְאֶחַד גּוֹמֵל
  choice: „eine andere wird geboren“ im Haupttext
  alternative: „eine andere reift heran“
  rationale: Die griechische Überlieferung stützt ausdrücklich die Geburt einer neuen Generation. Da das Hebräische jedoch eine andere Nuance zulässt, wird diese nicht beseitigt, sondern in einer Fußnote ausgewiesen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der parallele Satzbau und das Pflanzenbild bleiben klar erkennbar; Gedankenstriche gliedern den ausgedehnten Vergleich, ohne seine Spannung aufzulösen.
