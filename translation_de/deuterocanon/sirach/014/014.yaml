translation:
  language: de
  text: Versage dir nicht das Gute eines Tages, und lass dir keinen Anteil an gutem Verlangen entgehen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ein hebräischer Textzeuge enthält zusätzlich den eingeklammerten Satz: „Und enthalte dir selbst nichts Gutes vor.“ Seine Textgestalt ist unsicher und möglicherweise sekundär. Auch die anschließende erhaltene hebräische Fortsetzung ist schwierig und weicht von der hier wiedergegebenen zweiten Satzhälfte ab. Diese folgt der griechischen Überlieferung: „Und lass deinen Anteil an einem guten Verlangen nicht an dir vorübergehen.“'
    reason: textual_variant
lexical_decisions:
- source_word: אַל תִּמְנַע מִטּוֹבַת יוֹם / μὴ ἀφυστερήσῃς ἀπὸ ἀγαθῆς ἡμέρας
  choice: Versage dir nicht das Gute eines Tages
  rationale: „Versagen“ bewahrt die hebräische Warnung, etwas Gutes vorzuenthalten, während „das Gute eines Tages“ die konkrete, gegenwärtige Lebensfreude ausdrückt, ohne sie auf Vergnügen zu verengen.
- source_word: '[וְאַל תִּמְנַע מִטּוֹבָה נַפְשֶׁךָ]'
  choice: nicht im Haupttext wiedergegeben
  rationale: Der Zusatz ist in der vorgelegten hebräischen Ausgabe eingeklammert, textlich unsicher und inhaltlich weitgehend eine Wiederholung des ersten Satzglieds; er wird deshalb in der Fußnote dokumentiert.
- source_word: μερὶς
  choice: deinen Anteil
  rationale: Das griechische Wort bezeichnet einen Teil oder Anteil. Das Possessivpronomen macht im Deutschen den persönlichen Bezug deutlich, der sich aus dem Zusammenhang und dem Pronomen σε ergibt.
- source_word: ἐπιθυμίας ἀγαθῆς
  choice: an einem guten Verlangen
  rationale: Die bewusst offene Formulierung bewahrt die positive, aber nicht näher bestimmte Bedeutung von ἐπιθυμία und deutet sie weder als bloße Lust noch als Wohlstand oder materiellen Genuss aus.
- source_word: μὴ σε παρελθάτω
  choice: lass … nicht an dir vorübergehen
  rationale: Die deutsche Wendung gibt das griechische Bild von etwas wieder, das an einem Menschen vorbeigeht, ohne von ihm ergriffen oder wahrgenommen zu werden.
theological_decisions:
- issue: Textgrundlage der zweiten Vershälfte
  choice: Der sichere hebräische Anfang wird mit der kohärenten griechischen zweiten Hälfte verbunden.
  alternative: Den eingeklammerten beziehungsweise schwer verständlichen hebräischen Wortlaut vollständig in den Haupttext aufnehmen.
  rationale: Der erhaltene hebräische Text hat grundsätzlich Vorrang; an dieser Stelle ist ein Zusatz jedoch ausdrücklich als unsicher markiert, und die weitere hebräische Formulierung ist schwierig beziehungsweise abweichend. Die griechische Überlieferung bietet eine verständliche zweite Vershälfte. Die Fußnote macht diese textkritische Entscheidung sichtbar, ohne die Unsicherheit zu verdecken.
- issue: Bedeutung des guten Verlangens
  choice: Die positive, aber offene Formulierung „gutes Verlangen“ bleibt erhalten.
  alternative: Als Vergnügen, Genuss, Wunschgut oder sittlich besonders würdigen Wunsch ausdeuten.
  rationale: Der Text bejaht ein gutes Verlangen im Rahmen der Lebensfreude, bestimmt dessen Gegenstand aber nicht näher. Eine stärkere Festlegung würde die im Ausgangstext vorhandene Offenheit beseitigen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Das Gute eines Tages“ hält die anschauliche hebräische Ausdrucksweise fest; „gutes Verlangen“ bleibt absichtlich offen und vermeidet konfessionelle oder moralistische Zusatzdeutungen.
