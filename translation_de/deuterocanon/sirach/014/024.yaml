translation:
  language: de
  text: Wer rings um ihr Haus lagert und seine Zeltpflöcke in ihre Mauer treibt—[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wer nahe bei ihrem Haus Unterkunft nimmt und einen Pflock an ihren Mauern befestigt.“ Die griechische Parallelüberlieferung sagt ausdrücklich „nahe“, während das Hebräische anschaulich „rings um“ formuliert.'
    reason: Lexikalische Alternative und Abweichung der griechischen Parallelüberlieferung.
lexical_decisions:
- source_word: הַחוֹנֶה
  choice: Wer … lagert
  rationale: Das Partizip von חנה bezeichnet jemanden, der lagert beziehungsweise sein Lager aufschlägt. „Lagert“ bewahrt das konkrete Bild und lässt den charakterisierenden Sinn erkennen.
- source_word: סְבִיבוֹת
  choice: rings um
  rationale: Die hebräische Form bezeichnet die Umgebung rings um etwas und ist bildhafter als bloßes „nahe“. „Rings um“ gibt diese räumliche Nähe natürlich wieder.
- source_word: בֵּיתָהּ
  choice: ihr Haus
  rationale: Die feminine Possessivform wird wörtlich wiedergegeben. Im Zusammenhang bezieht sie sich auf die personifizierte Weisheit.
- source_word: וְהֵבִיא
  choice: treibt
  rationale: Das Verb bedeutet formal „bringt“; zusammen mit den Pflöcken bezeichnet es hier deren Anbringen. Das griechische πήξει („befestigen, einschlagen“) stützt die idiomatische Wiedergabe „treibt“.
- source_word: יְתֵדָיו
  choice: seine Zeltpflöcke
  rationale: יתד bezeichnet einen Pflock oder Pfahl, im Lagerbild besonders einen Zeltpflock. Die hebräische Mehrzahl wird im Deutschen beibehalten.
- source_word: בְּקִירָהּ
  choice: in ihre Mauer
  rationale: קיר bedeutet „Mauer“ oder „Wand“. Die Präposition ב־ wird räumlich mit „in“ wiedergegeben; zusammen mit „treibt“ bleibt das kräftige hebräische Bild erhalten.
theological_decisions:
- issue: Bezug der femininen Pronomen
  choice: Die femininen Pronomen beziehen sich auf die personifizierte Weisheit.
  alternative: Eine gewöhnliche Frau beziehungsweise die Frau eines Haushalts.
  rationale: Der unmittelbare Zusammenhang handelt vom Suchen und Beobachten der Weisheit; das Bild ihres Hauses führt diese Personifikation fort.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das konkrete Lager- und Hausbild des Hebräischen bleibt erhalten; der Gedankenstrich markiert den inhaltlichen Fortgang über diesen Vers hinaus.
