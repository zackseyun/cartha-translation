  text: Even if he does good[a], he does it in forgetfulness, and in the end he reveals his evil.
translation:
  language: de
  text: Selbst wenn er Gutes tut, tut er es, ohne daran zu denken,[a] und am Ende bringt er seine Bosheit ans Licht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »tut er es in Vergessenheit«; möglich ist auch: »tut er es vergesslich« oder »als wäre es vergessen«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κἂν
  choice: Selbst wenn
  rationale: Die Zusammenziehung aus καὶ ἐάν leitet hier eine konzessive Bedingung ein; »selbst wenn« gibt diesen Sinn im Deutschen natürlich wieder.
- source_word: εὖ ποιῇ
  choice: er Gutes tut
  rationale: εὖ ποιεῖν bezeichnet gutes oder wohltätiges Handeln; »Gutes tun« ist prägnant und idiomatisch.
- source_word: ἐν λήθῃ
  choice: ohne daran zu denken
  rationale: Wörtlich »in Vergessenheit«; die ungewöhnliche Wendung lässt an unachtsames, gedankenloses oder nicht im Gedächtnis bleibendes Tun denken. Die Übersetzung bleibt verständlich, während die Fußnote die Mehrdeutigkeit bewahrt.
- source_word: ποιεῖ
  choice: tut er es
  rationale: Die Wiederholung von ποιεῖ wird beibehalten; »es« nimmt das zuvor genannte gute Handeln auf.
- source_word: ἐπʼ ἐσχάτων
  choice: am Ende
  rationale: Die temporale Wendung bedeutet »zuletzt« oder »schließlich«; »am Ende« ist natürlich und wahrt den zeitlichen Sinn.
- source_word: ἐκφαίνει
  choice: bringt … ans Licht
  rationale: Das Verb bedeutet, etwas hervortreten oder sichtbar werden zu lassen; »ans Licht bringen« bildet diese Aussage anschaulich ab.
- source_word: τὴν κακίαν αὐτοῦ
  choice: seine Bosheit
  rationale: κακία bezeichnet moralische Schlechtigkeit, Bosheit oder Verderbtheit. »Bosheit« ist hier idiomatisch, ohne den Sinn auf bloße Schadenfreude oder einzelne böse Taten zu verengen.
