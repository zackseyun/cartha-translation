base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/038/025.yaml
  text: How can one who guides the plow become wise[b][a], who drives the ox with a goad and whose concerns are with the cattle?
translation:
  language: de
  text: Wie soll einer weise werden, der den Pflug lenkt und den Ochsen antreibt, um den Acker aufzubrechen,[a] und dessen Gedanken beim Vieh sind?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hebräische Wortlaut des ersten Satzteils ist schwierig. Der griechische Paralleltext lautet ausführlicher: »Wie wird der weise, der den Pflug hält … und Ochsen treibt?« Die Übersetzung folgt dem Hebräischen und zieht das Griechische zur Klärung des landwirtschaftlichen Bildes heran.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: »und dessen Gespräche vom Vieh handeln«. Das hebräische Wort kann sowohl die Gedanken und Beschäftigungen eines Menschen als auch seine Rede bezeichnen; der griechische Paralleltext weist eher auf »Rede« oder »Erzählung« hin.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אלוף
  choice: einer, der … lenkt
  rationale: Das hebräische Wort ist hier schwer zu deuten. Im landwirtschaftlichen Zusammenhang bezeichnet die Wiedergabe funktional den Menschen, der die Pflugarbeit leitet, ohne das Wort vorschnell als Titel wie »Meister« zu verstehen.
- source_word: ינהג
  choice: lenkt
  rationale: Das Verb bezeichnet das Führen oder Treiben. »Lenkt« passt im Deutschen natürlich zum Pflug und lässt die anschließende Formulierung das Antreiben des Ochsen ausdrücken.
- source_word: ישובב
  choice: antreibt
  rationale: Die Form ist nicht völlig sicher; im Zusammenhang mit der Feldarbeit gibt »antreibt« die aktive Führung des Zugtiers verständlich wieder. Der griechische Paralleltext bestätigt das Bild des Ochsentreibens.
- source_word: לשדד
  choice: um den Acker aufzubrechen
  rationale: Die zugrunde liegende Wurzel bezeichnet das Aufbrechen beziehungsweise Bearbeiten des Bodens. Die zweckbestimmte Formulierung bildet den landwirtschaftlichen Sinn natürlich ab.
- source_word: בשור
  choice: den Ochsen
  rationale: Obwohl die Präposition auch instrumental verstanden werden kann (»mit einem Ochsen«), ergibt sich zusammen mit dem Verb im Deutschen idiomatisch »den Ochsen antreibt«.
- source_word: שעיותיו
  choice: dessen Gedanken … sind
  rationale: Das Nomen kann Gedanken, Beschäftigung oder Rede bezeichnen. »Gedanken« bewahrt den breiten Sinn geistiger Beschäftigung; die konkretere Möglichkeit »Gespräche« wird in der Fußnote genannt.
- source_word: בני בקר
  choice: beim Vieh
  rationale: Wörtlich steht »Söhne des Rindes/Rindviehs«, eine Bezeichnung für Rinderbestand. »Vieh« ist im Zusammenhang idiomatisch und vermeidet eine unbegründete Eingrenzung auf Jungstiere.
