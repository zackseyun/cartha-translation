  text: Do not set your heart on him any longer[a]; let his memory go[c][b], and remember the end.
translation:
  language: de
  text: Richte dein Herz nicht länger auf ihn[a]; lass die Erinnerung an ihn los[b], und denke an das Ende[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Lege dein Herz nicht länger auf ihn.“ Gemeint ist, innerlich nicht weiter auf den Verstorbenen fixiert zu bleiben.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Gib die Erinnerung an ihn frei“ beziehungsweise „lass sein Andenken ruhen“. Das hebräische Verb ist in dieser Wendung schwierig; die griechische Parallele weist ebenfalls darauf, über die Trauer hinauszugehen.'
    reason: alternative_reading
  - marker: c
    text: 'Auch möglich: „Denke an sein Ende“ oder „denke an dein eigenes Ende“. Im Hebräischen steht nur „das Ende“; der Bezug bleibt offen.'
    reason: alternative_reading
lexical_decisions:
- source_word: אל תשים אליו לב
  choice: Richte dein Herz nicht länger auf ihn
  rationale: Die Wiedergabe bewahrt das hebräische Bild, das Herz auf jemanden zu richten, und bezeichnet im Zusammenhang, innerlich nicht weiter am Verstorbenen festzuhalten. Das idiomatisch mögliche „Achte nicht mehr auf ihn“ wäre zu flach.
- source_word: עוד
  choice: nicht länger
  rationale: Das Adverb bezeichnet hier die Fortdauer eines bisherigen Verhaltens; die Mahnung fordert dazu auf, anhaltende Trauer nicht fortzusetzen.
- source_word: פרע זכרו
  choice: lass die Erinnerung an ihn los
  rationale: Das Verb פרע ist in dieser Wendung schwierig. Die gewählte Formulierung drückt ein Loslassen aus, ohne ein vollständiges Vergessen zu verlangen; dies passt zum Trauerkontext und wird durch die griechische Parallele als Bewegung über die Trauer hinaus gestützt.
- source_word: וזכור אחרית
  choice: und denke an das Ende
  rationale: אחרית kann das Ende, den Ausgang oder das letzte Geschick bezeichnen. „Das Ende“ erhält die Kürze und die Offenheit des Hebräischen, ohne festzulegen, wessen Ende gemeint ist.
theological_decisions:
- issue: Bezug von אחרית („das Ende“)
  choice: 'Der Bezug bleibt allgemein und offen: Tod, letzter Ausgang oder Sterblichkeit können mitschwingen.'
  alternative: „Denke an sein Ende“ oder „denke an dein eigenes Ende“.
  rationale: Im Hebräischen fehlt ein ausdrückliches Bezugswort. Die Übersetzung bewahrt diese möglicherweise beabsichtigte Mehrdeutigkeit, statt sie zugunsten des Verstorbenen oder des Trauernden aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Herz-Metapher des Hebräischen bleibt erhalten; „loslassen“ ist im Trauerzusammenhang natürlich und vermeidet die Härte eines Befehls zum Vergessen. Die knappe Mehrdeutigkeit von „das Ende“ wird bewusst bewahrt.
