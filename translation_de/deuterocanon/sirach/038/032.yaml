  source_fidelity: Die erste Satzhälfte gibt ἐν βραχίονι αὐτοῦ τυπώσει πηλόν zutreffend wieder. In der zweiten Satzhälfte bleiben πρὸ ποδῶν und ἰσχὺν αὐτοῦ zwar formal erhalten, doch »seine Kraft beugen« ist im Deutschen keine verständliche Wendung und bildet die griechische Verdichtung zu mechanisch nach. »setzt er seine Kraft ein« gibt den wahrscheinlichen Sinn des Kraftaufwands idiomatisch wieder; die in κάμψει liegende mögliche Vorstellung des Sichbeugens wird in der Fußnote vermerkt.
