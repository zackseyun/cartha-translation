translation:
  language: de
  text: Mit seinem Arm formt er Ton, und vor seinen Füßen setzt er seine Kraft ein.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »und vor seinen Füßen beugt er seine Kraft«. Die verdichtete griechische Wendung kann den Kraftaufwand bei der Arbeit bezeichnen; möglicherweise spielt sie zugleich auf die gebeugte Haltung des Handwerkers über seiner Arbeit an.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν βραχίονι αὐτοῦ
  choice: Mit seinem Arm
  rationale: Die instrumentale Wendung bezeichnet den Arm als Werkzeug körperlicher Arbeit und bewahrt das anschauliche Bild des Handwerkers.
- source_word: τυπώσει
  choice: wird er … formen
  rationale: Im Zusammenhang mit Ton meint das Verb das gestaltende Bearbeiten des Materials; »formen« ist präzise und im heutigen Deutsch natürlich.
- source_word: πηλόν
  choice: Ton
  rationale: Für den Werkstoff eines Töpfers ist »Ton« die sachlich und idiomatisch passende deutsche Wiedergabe.
- source_word: πρὸ ποδῶν
  choice: vor seinen Füßen
  rationale: Die räumliche Formulierung des Griechischen bleibt konkret erhalten, ohne eine nicht ausdrücklich genannte Töpferscheibe einzutragen.
- source_word: κάμψει
  choice: wird … beugen
  rationale: Das Verb bedeutet grundsätzlich »beugen« oder »krümmen«. Die wörtliche Wiedergabe bewahrt die körperliche Bildlichkeit und die ungewöhnliche Verdichtung des Satzes.
- source_word: ἰσχὺν αὐτοῦ
  choice: seine Kraft
  rationale: ἰσχύς bezeichnet körperliche Kraft oder Stärke. »Seine Kraft« erhält die Mehrdeutigkeit zwischen Körperhaltung und Kraftaufwand.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnliche Formulierung »seine Kraft beugen« wurde bewusst beibehalten und in der Fußnote erläutert, damit die Mehrdeutigkeit des griechischen Textes nicht vorschnell aufgelöst wird.
