  text: Also give the physician a place[a], and do not dismiss him, for there is need of him as well.
translation:
  language: de
  text: Gib auch dem Arzt Raum[a], und lass ihn nicht weichen; denn auch er wird gebraucht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Fassung fügt hier hinzu: „Denn der Herr hat auch ihn erschaffen“, und fährt dann fort: „und lass ihn nicht von dir weichen“.'
    reason: alternative_reading
lexical_decisions:
- source_word: וגם
  choice: Auch
  rationale: Bewahrt die additive Verknüpfung mit dem vorausgehenden Zusammenhang knapp und natürlich.
- source_word: לרופא
  choice: dem Arzt
  rationale: רופא bezeichnet einen Arzt oder Heiler; „Arzt“ ist im modernen Standarddeutsch die natürliche, würdevolle generische Bezeichnung.
- source_word: תן מקום
  choice: räume seinen Platz ein
  rationale: Gibt das Bild von „einen Platz geben“ idiomatisch wieder und drückt aus, dass dem Arzt angemessener Raum und Geltung zugestanden werden sollen.
- source_word: ולא ימוש
  choice: lass ihn nicht von dir weichen
  rationale: מוש bedeutet weichen oder sich entfernen. Die Formulierung bewahrt dieses Bewegungsbild; „von dir“ wird durch die griechische Parallele gestützt und macht den gemeinten Bezug im Deutschen klar.
- source_word: כי גם בו צורך
  choice: denn auch er wird gebraucht
  rationale: Gibt die unpersönliche Aussage über die Notwendigkeit des Arztes in natürlichem Deutsch wieder und erhält die Betonung durch גם.
theological_decisions:
- issue: Hebräischer Haupttext gegenüber der erweiterten griechischen Lesart
  choice: Die erhaltene hebräische Fassung bildet den Haupttext; der griechische Zusatz über die Erschaffung des Arztes durch den Herrn erscheint nur in der Fußnote.
  alternative: „Auch dem Arzt räume seinen Platz ein, denn der Herr hat auch ihn erschaffen, und lass ihn nicht von dir weichen; denn er wird gebraucht.“
  rationale: Der hebräische Text enthält den Schöpfungssatz nicht. Seine Aufnahme in den Haupttext würde die maßgebliche erhaltene hebräische Lesart erweitern; als bedeutende griechische Variante soll er jedoch dokumentiert werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Räume seinen Platz ein“ wahrt das hebräische Bild, ohne altertümlich zu klingen; „lass ihn nicht von dir weichen“ erhält die konkrete Bedeutung des Verbs und die Spannung zwischen ärztlicher Hilfe und dem religiösen Zusammenhang.
