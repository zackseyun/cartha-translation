  to: Ebenso sitzt der Schmied nahe beim Amboss und betrachtet aufmerksam das unbearbeitete Eisen[a]. Der Dunst des Feuers wird sein Fleisch schmelzen, und er wird mit der Hitze des Ofens ringen.
  rationale: Die Revision bewahrt die handwerkliche Bildsprache und die lexikalische Offenheit von ἀργῷ, gibt aber die explizite Nähe zum Amboss und die beiden griechischen Futurformen wieder. „Schmelzen“ steht nun im Haupttext, weil es die bildhafte, körperlich drastische Aussage des Griechischen direkt überträgt; daher wird keine Fußnote zur Abschwächung benötigt.
