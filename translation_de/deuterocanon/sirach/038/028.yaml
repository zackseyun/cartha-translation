  text: So the smith sits near the anvil and studies the raw iron; the vapor of the fire wastes his flesh, and he struggles with the heat of the furnace.
translation:
  language: de
  text: Ebenso sitzt der Schmied nahe beim Amboss und betrachtet aufmerksam das unbearbeitete Eisen[a]. Der Dunst des Feuers wird sein Fleisch schmelzen, und er wird mit der Hitze des Ofens ringen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Adjektiv kann „untätig“ oder „noch nicht bearbeitet“ bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: χαλκεύς
  choice: Schmied
  rationale: Der allgemeine griechische Ausdruck bezeichnet einen Metallhandwerker; da unmittelbar Eisen genannt wird, ist „Schmied“ im Deutschen knapp und sachgerecht, ohne unnötig auf ein bestimmtes Metall festzulegen.
- source_word: ἐγγὺς ἄκμονος
  choice: am Amboss
  rationale: „Am Amboss“ gibt die räumliche Nähe idiomatisch wieder und passt zum deutschen Sprachgebrauch im Handwerkskontext.
- source_word: καταμανθάνων
  choice: prüft aufmerksam
  rationale: Das Partizip bezeichnet eingehende, aufmerksame Betrachtung. „Prüft aufmerksam“ wirkt im Zusammenhang mit der Bearbeitung des Eisens natürlicher als das akademisch klingende „studiert“.
- source_word: ἀργῷ σιδήρῳ
  choice: das unbearbeitete Eisen
  rationale: ἀργός bezeichnet hier am ehesten etwas Untätiges beziehungsweise noch nicht Bearbeitetes. „Unbearbeitetes Eisen“ bewahrt diesen Sinn, ohne einen metallurgischen Zustand zu unterstellen.
- source_word: ἀτμὶς πυρός
  choice: der Dunst des Feuers
  rationale: ἀτμίς bedeutet Dunst, Dampf oder Ausdünstung. „Dunst“ erhält das Bild der vom Feuer ausgehenden Ausströmung und unterscheidet es von der anschließend ausdrücklich genannten Hitze.
- source_word: τήξει σάρκας αὐτοῦ
  choice: zehrt sein Fleisch aus
  rationale: Das Verb bedeutet wörtlich „schmelzen“. Mit „Fleisch“ als Objekt beschreibt es anschaulich die körperliche Auszehrung durch die Arbeit; die deutsche Wendung gibt diese Wirkung natürlich wieder, während eine Fußnote den Wortlaut festhält.
- source_word: ἐν θέρμῃ καμίνου
  choice: mit der Hitze des Ofens
  rationale: Die Formulierung bewahrt θέρμη als „Hitze“ und κάμινος als den im Metallhandwerk verwendeten Ofen, ohne durch „Schmelzofen“ eine engere Funktion festzulegen.
- source_word: διαμαχήσεται
  choice: er ringt
  rationale: Das Verb bezeichnet ein heftiges Kämpfen oder Sich-Abmühen. „Ringt“ erhält die kraftvolle Bildsprache und bezeichnet den fortdauernden Kampf gegen die Ofenhitze.
