  text: A physician’s knowledge will raise his horn[a], and before nobles he will stand.
translation:
  language: de
  text: Das Wissen eines Arztes erhöht sein Ansehen, und vor Vornehmen wird er stehen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „richtet sein Horn auf“. Der griechische Text lautet: „Die Kenntnis eines Arztes wird sein Haupt erheben, und vor Mächtigen wird er bewundert werden.“'
    reason: Das hebräische Idiom sowie die abweichende griechische Parallelüberlieferung werden transparent gemacht.
lexical_decisions:
- source_word: דעת
  choice: Wissen
  rationale: Das Substantiv bezeichnet Wissen oder Erkenntnis; zusammen mit „Arzt“ ist die erworbene medizinische Sachkenntnis gemeint. „Wissen“ bleibt nah am Hebräischen und ist allgemein verständlich.
- source_word: רופא
  choice: Arzt
  rationale: Das Wort bezeichnet einen Heiler beziehungsweise medizinischen Fachmann. „Arzt“ ist im modernen Standarddeutsch die natürliche und präzise Entsprechung.
- source_word: תרים קרנו
  choice: erhöht sein Ansehen
  rationale: Wörtlich heißt die Wendung „richtet sein Horn auf“. Das aufgerichtete oder erhöhte Horn ist ein hebräisches Bild für Ehre, Stärke und erhöhten Rang. „Erhöht sein Ansehen“ gibt die idiomatische Bedeutung natürlich wieder, ohne den Bezug auf gesellschaftliche Anerkennung zu überdehnen.
- source_word: נדיבים
  choice: Vornehmen
  rationale: Gemeint sind gesellschaftlich hochgestellte, angesehene Menschen. „Vornehme“ bewahrt diese soziale Bedeutung, ohne einen bestimmten Adelstitel vorauszusetzen.
- source_word: יתיצב
  choice: wird er stehen
  rationale: Das Verb bedeutet, sich hinzustellen, seinen Platz einzunehmen oder vor jemandem zu stehen. Die Wiedergabe folgt bewusst dem gut bezeugten hebräischen Text und lässt offen, ob Zugang, Dienst oder ehrenvolle Gegenwart gemeint ist.
theological_decisions:
- issue: Abweichung zwischen dem hebräischen und dem griechischen Text
  choice: 'Im Haupttext dem Hebräischen folgen: „vor Vornehmen wird er stehen“'
  alternative: 'Griechisch: „vor Mächtigen wird er bewundert werden“'
  rationale: Der vorhandene hebräische Text ist hier sicher bezeugt und hat als Ausgangstext Vorrang. Die griechische Fassung verändert die Aussage von der Stellung beziehungsweise Gegenwart vor hochgestellten Menschen zu deren Bewunderung; diese bedeutsame Variante wird deshalb in einer Fußnote bewahrt.
- issue: Hebräisches Bild vom erhöhten Horn
  choice: Die idiomatische Bedeutung mit „erhöht sein Ansehen“ wiedergeben
  alternative: „richtet sein Horn auf“
  rationale: Eine wörtliche Wiedergabe wäre im heutigen Deutsch ohne Erklärung leicht missverständlich. Die gewählte Formulierung vermittelt den Sinn des Bildes, nämlich Ehre und gesellschaftliche Erhöhung, ohne eine konfessionelle Deutung einzutragen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Weisheitsliteratur-Ton. Die Satzstruktur bleibt eng am hebräischen Parallelismus; das schwer verständliche Horn-Bild wird im Haupttext idiomatisch wiedergegeben und in der Fußnote dokumentiert.
