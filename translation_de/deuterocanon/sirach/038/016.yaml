  text: My son[a], shed tears for the dead, be bitter, and begin the lament.
translation:
  language: de
  text: Mein Sohn, vergieße Tränen um den Toten, sei von bitterem Schmerz erfüllt und stimme die Totenklage an.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das letzte Verb des hebräischen Textes ist schwer zu deuten. Die griechische Parallelüberlieferung lautet: »und beginne, wie einer, der Schreckliches erleidet, mit der Klage«; sie stützt die hier wiedergegebene Bedeutung.'
    reason: textual_variant
lexical_decisions:
- source_word: בני
  choice: Mein Sohn
  rationale: Der Vokativ Singular mit Suffix der 1. Person bewahrt die persönliche, väterliche Anrede der Weisheitslehre.
- source_word: על המת
  choice: um den Toten
  rationale: על bezeichnet hier den Anlass beziehungsweise Gegenstand der Trauer; »um den Toten« ist im Deutschen idiomatisch und nah am Hebräischen.
- source_word: הזיב דמעה
  choice: vergieße Tränen
  rationale: Das hebräische Bild bezeichnet das Fließenlassen einer Träne; der Plural klingt im Deutschen natürlich und wird durch das griechische κατάγαγε δάκρυα gestützt.
- source_word: התמרר
  choice: sei von bitterem Schmerz erfüllt
  rationale: Der Hitpael-Imperativ bezeichnet das Eintreten in bitteren Schmerz. Die Formulierung bewahrt die Eigenständigkeit des Imperativs, ohne im Deutschen das missverständliche »sei verbittert« zu verwenden.
- source_word: וגהה קינה
  choice: stimme die Totenklage an
  rationale: קינה ist eine förmliche Klage um einen Verstorbenen. Das überlieferte Verb ist schwierig; die griechische Parallele ἔναρξαι θρήνου stützt den Sinn »die Klage beginnen«.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle Weisheitssprache. »Totenklage« macht die förmliche Bedeutung von קינה deutlich; »sei von bitterem Schmerz erfüllt« vermeidet das heute oft charakterbezogene »verbittert«.
