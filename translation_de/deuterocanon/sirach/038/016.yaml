  source_fidelity: 'Die Übersetzung gibt die hebräischen Imperative treffend wieder: בני als persönliche Anrede, על המת als Anlass der Trauer, הזיב דמעה als Aufforderung zum Weinen sowie התמרר als bitteres Trauern. Für das schwierige וגהה קינה ist „stimme die Totenklage an“ eine gut vertretbare, durch die griechische Parallelüberlieferung gestützte Wiedergabe, ohne eine weitergehende textkritische Sicherheit vorzutäuschen.'
