  text: For from grief disaster comes forth[a]; so a sorrowful heart wastes away in sadness.
translation:
  language: de
  text: Denn aus Trauer geht Unheil hervor[a]; so zehrt sich ein bekümmertes Herz vor Kummer auf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Griechisch: „Denn aus Trauer geht der Tod hervor, und Herzensleid beugt die Kraft.“ Im Hebräischen steht „Unheil“ statt „Tod“; daher folgt der Haupttext dem hebräischen Zeugnis und nennt hier die griechische Alternative.'
    reason: alternative_reading
lexical_decisions:
- source_word: מדין
  choice: aus Trauer
  rationale: Die hebräische Form ist für sich genommen schwierig; die griechische Parallele ἀπὸ λύπης stützt im Zusammenhang des Trauerns deutlich die Bedeutung „aus Trauer“ statt „aus Streit“.
- source_word: יוצא
  choice: geht … hervor
  rationale: Die Wendung gibt das Bild eines hervorgehenden Ergebnisses eng und zugleich idiomatisch auf Deutsch wieder.
- source_word: אסון
  choice: Unheil
  rationale: Das hebräische Wort bezeichnet schweres Unglück oder Unheil. Der Haupttext folgt dem hebräischen Zeugnis; die abweichende griechische Lesart „Tod“ wird in der Fußnote bewahrt.
- source_word: כן
  choice: so
  rationale: „So“ bildet die folgernde beziehungsweise vergleichende Verknüpfung der beiden Halbverse knapp ab.
- source_word: רע לבב
  choice: ein bekümmertes Herz
  rationale: Wörtlich steht eine Wendung wie „schlecht/böse am Herzen“. Im Trauerkontext bezeichnet sie innere Bedrängnis, nicht moralische Bosheit; „bekümmert“ wahrt diese kontextuelle Bedeutung.
- source_word: יכלה עצבה
  choice: zehrt sich … vor Kummer auf
  rationale: Die schwierige Verbindung beschreibt ein durch Kummer verursachtes Vergehen oder Aufgezehrtwerden. Die reflexive deutsche Fassung folgt der im konsultierten Text vertretenen Deutung, ohne den emotionalen und körperlichen Verfall abzuschwächen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Unheil“ ist natürlich und textnah; „bekümmertes Herz“ vermeidet eine missverständliche moralische Deutung von רע לבב. Die leichte Wiederaufnahme von „Trauer“ durch „Kummer“ bewahrt den Parallelismus ohne unnötige sprachliche Härte.
