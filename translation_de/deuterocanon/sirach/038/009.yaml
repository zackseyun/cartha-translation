base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/038/009.yaml
  text: My son[a], in your sickness do not be negligent; pray to God[b], for he will heal you.
translation:
  language: de
  text: Mein Sohn, sei in deiner Krankheit nicht nachlässig[a]; bete zu Gott[b], denn er wird dich heilen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „vernachlässige sie nicht“ / „sieh nicht darüber hinweg“. Die genaue Nuance der hebräischen Wendung ist unsicher; der griechische Paralleltext legt nahe, die Krankheit nicht unbeachtet zu lassen.'
    reason: lexical_alternative
  - marker: b
    text: 'Der griechische Paralleltext hat: „zum Herrn“. Der hebräische Text liest hier: „zu Gott“.'
    reason: alternative_reading
lexical_decisions:
- source_word: בני
  choice: Mein Sohn
  rationale: Der hebräische Vokativ bedeutet wörtlich „mein Sohn“ und bewahrt den väterlichen Lehrton des Sirachbuches; das griechische τέκνον ist allgemeiner („Kind“), doch der vorhandene hebräische Text ist maßgeblich.
- source_word: בחולי
  choice: in deiner Krankheit
  rationale: Die Verbindung aus ב und חולי bezeichnet den Zustand beziehungsweise die Zeit der Krankheit. Die formal nahe Wiedergabe ist im Deutschen natürlich und wird durch das griechische ἐν ἀρρωστήματί σου bestätigt.
- source_word: על תתעבר
  choice: sei … nicht nachlässig
  rationale: Die hebräische Wendung ist in ihrer genauen Nuance unsicher. Das griechische μὴ παράβλεπε stützt den Sinn „nicht vernachlässigen/übersehen“. Die gewählte Formulierung lässt das im Hebräischen nicht ausdrücklich genannte Objekt offen.
- source_word: התפלל
  choice: bete
  rationale: Das Verb bedeutet schlicht „beten“; eine verstärkende Erweiterung ist nicht angezeigt. Das griechische εὔξαι bestätigt diese Bedeutung.
- source_word: אל אל
  choice: zu Gott
  rationale: Der hebräische Zeuge liest „zu Gott“. Diese Lesart erhält gegenüber dem griechischen „zum Herrn“ den Vorrang.
- source_word: כי הוא ירפא
  choice: denn er wird dich heilen
  rationale: כי führt hier die Begründung für die Aufforderung zum Gebet ein. Das Objekt „dich“ ergibt sich aus dem Zusammenhang und steht ausdrücklich im griechischen Paralleltext (σε).
theological_decisions:
- issue: Gottesbezeichnung in der Gebetsaufforderung
  choice: Gott
  alternative: der Herr
  rationale: Der sichere hebräische Text bietet אל („Gott“), der griechische Paralleltext dagegen Κυρίῳ („zum Herrn“). Der Haupttext folgt dem Hebräischen; die abweichende griechische Lesart wird transparent in einer Fußnote bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter väterlicher Anrede. Der Satz bleibt nah an der hebräischen Struktur, ohne im Deutschen steif zu wirken. Die echte lexikalische Unsicherheit und die abweichende griechische Gottesbezeichnung werden in Fußnoten offengelegt.
