  text: The sound of the hammer strikes his ear[a], and his eyes are on the form of the vessel;
translation:
  language: de
  text: Der Klang des Hammers dringt ihm ins Ohr[a], und seine Augen sind auf die Form des Gefäßes gerichtet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Der Klang des Hammers schlägt ihm ans Ohr.“ Das griechische Verb ist an dieser Stelle schwer zu deuten und kann die wiederholte Einwirkung des Hammergeräuschs auf sein Gehör ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: φωνὴ σφύρης
  choice: der Klang des Hammers
  rationale: φωνή bezeichnet hier das hörbare Geräusch des Hammers, nicht eine Stimme; „Klang“ ist im Deutschen natürlich und bewahrt den sinnlichen Werkstattbezug.
- source_word: καινεῖ
  choice: dringt … ins Ohr
  rationale: Das Verb ist in diesem Zusammenhang schwierig. Statt des außerhalb dieses Kontexts üblichen Sinnes „erneuert“ gibt die Formulierung die fortgesetzte Einwirkung des Hammerklangs auf das Ohr verständlich wieder, ohne eine einzelne Schlagbewegung zu behaupten.
- source_word: τὸ οὖς αὐτοῦ
  choice: ihm ins Ohr
  rationale: Der Singular des Griechischen bleibt erhalten; die deutsche Konstruktion klingt natürlicher als „sein Ohr“ bei „dringt“.
- source_word: κατέναντι
  choice: sind auf … gerichtet
  rationale: Das Wort bezeichnet wörtlich die Lage gegenüber oder vor etwas; im Zusammenhang der konzentrierten Arbeit gibt „auf … gerichtet“ die Blickrichtung idiomatisch wieder.
- source_word: ὁμοιώματος
  choice: Form
  rationale: „Form“ wahrt die mögliche Bedeutung als Gestalt oder Abbild und vermeidet die stärkere Festlegung auf eine Vorlage oder ein Muster.
- source_word: σκεύους
  choice: Gefäß
  rationale: Im handwerklichen Zusammenhang bezeichnet σκεῦος den hergestellten Gegenstand, wahrscheinlich ein Gefäß; die Wahl entspricht der konkreten Bildwelt des Verses.
- source_word: οἱ ὀφθαλμοὶ αὐτοῦ
  choice: seine Augen
  rationale: Die konkrete Körpermetaphorik des griechischen Textes wird unmittelbar beibehalten.
