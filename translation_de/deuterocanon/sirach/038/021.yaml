  text: Do not keep remembering him[a], for there is no return; you will not help him, and you will harm yourself.
translation:
  language: de
  text: Denk nicht immer wieder an ihn, denn für ihn gibt es keine Hoffnung[a]. Du nützt ihm damit nicht, dir selbst aber schadest du.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Parallelüberlieferung lautet: „Denn es gibt keine Rückkehr.“'
    reason: alternative_reading
lexical_decisions:
- source_word: אל תזכרנו
  choice: Denk nicht immer wieder an ihn
  rationale: זכר bedeutet „sich erinnern, an jemanden denken“ und kann auch „erwähnen“ heißen. Im Zusammenhang anhaltender Trauer gibt „nicht immer wieder“ den fortgesetzten Rückblick wieder, ohne jedes liebevolle Erinnern grundsätzlich zu verbieten.
- source_word: כי אין לו תקוה
  choice: denn für ihn gibt es keine Hoffnung
  rationale: 'Dies folgt unmittelbar dem hebräischen Wortlaut: תקוה bedeutet gewöhnlich „Hoffnung“. Die abweichende, kontextuell naheliegende griechische Lesart „keine Rückkehr“ wird in der Fußnote bewahrt.'
- source_word: מה תועיל
  choice: Ihm nützt du damit nicht
  rationale: 'Wörtlich fragt das Hebräische: „Was wirst du nützen?“ Im Zusammenhang ist der Verstorbene das naheliegende unausgesprochene Objekt. Die Aussageform ist im Deutschen natürlicher und wird durch das griechische τοῦτον οὐκ ὠφελήσεις gestützt.'
- source_word: ולך תרע
  choice: dir selbst aber schadest du
  rationale: Die Wendung warnt vor dem Schaden für den Trauernden. „Dir selbst“ gibt den hebräischen Dativ natürlich wieder und entspricht dem ausdrücklichen griechischen Reflexivpronomen.
theological_decisions:
- issue: Bedeutet תקוה hier „Hoffnung“ oder, entsprechend der griechischen Parallele, „Rückkehr“?
  choice: für ihn gibt es keine Hoffnung
  alternative: es gibt keine Rückkehr
  rationale: Da der hebräische Text als primäre Vorlage sicher bezeugt ist, steht seine reguläre lexikalische Bedeutung im Haupttext. Die griechische Parallele kann den Sinn auf die ausbleibende Rückkehr des Toten zuspitzen, darf aber die echte Differenz der Überlieferung nicht verdecken; daher erscheint sie in der Fußnote.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Formulierung „nicht immer wieder“ macht den Bezug auf anhaltende, selbstschädigende Trauer verständlich; der knappe Gegensatz „Ihm … nicht, dir selbst aber …“ wahrt den sentenzartigen Charakter.
