base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/038/024.yaml
  text: The wisdom of a scribe comes with the opportunity for leisure, and the one who is less occupied with his work will become wise.[a]
translation:
  language: de
  text: Die Weisheit eines Schriftgelehrten gedeiht, wenn er Muße hat; und wer durch seine Arbeit weniger beansprucht ist, wird weise.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der erhaltene hebräische Wortlaut dieser Zeile ist schwer verständlich und stimmt nicht eindeutig mit der griechischen Überlieferung überein. Die Übersetzung folgt hier dem klareren Sinn des Griechischen, besonders bei „Schriftgelehrter“ und bei der Verbindung von Weisheit mit Muße.
    reason: textual_variant
lexical_decisions:
- source_word: חכם / יתחכם || σοφία / σοφισθήσεται
  choice: Weisheit / wird weise
  rationale: Der überlieferte hebräische Wortlaut ist schwierig; die griechische Parallele stellt jedoch klar Weisheit und das Weisewerden in den Mittelpunkt. Die Wiedergabe bewahrt dieses weisheitliche Leitmotiv, ohne den unsicheren hebräischen Wortlaut künstlich zu glätten.
- source_word: תומך מלמד || γραμματέως
  choice: Schriftgelehrter
  rationale: Das hebräische תומך מלמד ist in diesem Zusammenhang textlich unsicher und ergibt keinen verlässlichen Sinn. Das griechische γραμματεύς bezeichnet hier einen schriftkundigen Gelehrten; „Schriftgelehrter“ ist dafür im Kontext antiker Weisheitslehre die treffendste deutsche Bezeichnung.
- source_word: ἐν εὐκαιρίᾳ σχολῆς
  choice: wenn er Muße hat
  rationale: Die griechische Wendung bezeichnet eine günstige Gelegenheit zu ungestörter, von dringender Arbeit freier Zeit. „Wenn er Muße hat“ gibt dies natürlich und verständlich wieder; „gedeiht“ macht die Muße als günstige Bedingung der Weisheit deutlich.
- source_word: ὁ ἐλασσούμενος πράξει αὐτοῦ
  choice: wer durch seine Arbeit weniger beansprucht ist
  rationale: Die Wendung beschreibt jemanden, dessen praktische Tätigkeit vermindert ist oder weniger Zeit beansprucht. Die deutsche Formulierung erhält den Gegensatz zwischen Arbeitsbelastung und verfügbarer Zeit zum Lernen.
theological_decisions:
- issue: Gewichtung des schwierigen hebräischen Textzeugen gegenüber der griechischen Parallelüberlieferung
  choice: Der Hauptsinn folgt der kohärenten griechischen Fassung und wird durch eine textkritische Fußnote offengelegt.
  alternative: Eine mutmaßlich wörtliche Wiedergabe des erhaltenen Hebräischen, etwa mit Pflug und Treibstachel.
  rationale: Der vorliegende hebräische Wortlaut ist offenbar gestört beziehungsweise schwer verständlich und lässt sich nicht sicher mit der griechischen Fassung vermitteln. Die griechische Überlieferung bietet einen zusammenhängenden Spruch über Muße als Voraussetzung gelehrter Weisheit. Diese Entscheidung ist textkritisch, nicht konfessionell; die Fußnote wahrt Transparenz über die Überlieferungslage.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem weisheitlichem Ton. „Muße“ ist bewusst beibehalten, weil es prägnant freie Zeit für Studium und Nachdenken bezeichnet; der Satzbau bleibt sprichwortartig und klar.
