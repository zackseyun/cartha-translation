  source_fidelity: 'Die erste Satzhälfte gibt καρδίαν αὐτοῦ δώσει εἰς συντέλειαν ἔργων zutreffend und idiomatisch wieder. In der zweiten Satzhälfte trifft »bleibt wach« die Aussage von ἡ ἀγρυπνία αὐτοῦ grundsätzlich, doch »bis zum Abschluss auszugestalten« ist im Deutschen semantisch und stilistisch unnötig doppelt: »ausgestalten« legt selbst bereits einen abschließenden Gestaltungsvorgang nahe, während ἐπὶ συντελείας die Ausrichtung auf die Vollendung bezeichnet. Eine leicht gestraffte Fassung bewahrt die Wiederaufnahme des Vollendungsgedankens und die offene Bedeutung von κοσμῆσαι.'
