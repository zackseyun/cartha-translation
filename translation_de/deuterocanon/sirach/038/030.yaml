  text: He will apply his heart to the completion of his work[a], and his wakefulness is to bring it to perfection.
translation:
  language: de
  text: Er richtet sein Herz darauf, seine Arbeiten zu vollenden[a], und bleibt wach, um sie zur Vollendung zu gestalten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »Er wird sein Herz auf die Vollendung von Arbeiten richten, und sein Wachsein darauf, sie zur Vollendung zu gestalten.« Die griechische Formulierung ist knapp; κοσμῆσαι kann hier sowohl Ordnen und Gestalten als auch Ausschmücken bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καρδίαν αὐτοῦ δώσει εἰς
  choice: Er richtet sein Herz darauf
  rationale: Die Wendung bedeutet idiomatisch, dass er seine innere Aufmerksamkeit und Entschlossenheit auf ein Ziel richtet. »Herz« bewahrt dabei das konkrete Menschenbild des griechischen Textes.
- source_word: συντέλειαν ἔργων
  choice: seine Arbeiten zu vollenden
  rationale: συντέλεια bezeichnet hier den Abschluss handwerklicher Arbeiten. Der Plural ἔργων bleibt durch »Arbeiten« erkennbar; das Possessivpronomen ist aus dem Zusammenhang ergänzt.
- source_word: ἀγρυπνία αὐτοῦ
  choice: bleibt wach
  rationale: Das Substantiv bezeichnet Wachsein beziehungsweise Schlaflosigkeit. Die verbale Wiedergabe klingt im modernen Deutschen natürlich und erhält das Bild ausdauernder, auch nächtlicher Mühe.
- source_word: κοσμῆσαι
  choice: auszugestalten
  rationale: κοσμέω kann schmücken, ordnen oder gehörig gestalten bedeuten. »Ausgestalten« wahrt die handwerkliche Vorstellung einer sorgfältigen abschließenden Formgebung, ohne den Sinn auf bloße Verzierung zu verengen.
- source_word: ἐπὶ συντελείας
  choice: bis zum Abschluss
  rationale: Die komprimierte Zielangabe nimmt den Gedanken der Vollendung erneut auf. »Bis zum Abschluss« bildet diese Wiederholung enger ab als die theologisch oder qualitativ stärker gefärbte Wiedergabe »zur Vollkommenheit«.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Übersetzung bewahrt »Herz« und das Bild des Wachbleibens, löst jedoch die gedrängte griechische Syntax behutsam auf. Die wiederholte Abschlussvorstellung wird nicht als metaphysische »Vollkommenheit« überdeutet.
