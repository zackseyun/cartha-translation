  text: Whoever sins before his Maker will be defiant before a physician[a].
translation:
  language: de
  text: Wer vor seinem Schöpfer sündigt, wird sich einem Arzt gegenüber abweisend verhalten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Griechisch: „wird in die Hände eines Arztes fallen“. Der hebräische Text lautet: „wird sich einem Arzt gegenüber abweisend verhalten“.'
    reason: alternative_reading
lexical_decisions:
- source_word: אשר
  choice: Wer
  rationale: Leitet einen verallgemeinernden Relativsatz ein und bewahrt die sprichwortartige Aussage in natürlichem Deutsch.
- source_word: חואט
  choice: sündigt
  rationale: Gibt das hebräische חטא mit seiner moralisch-religiösen Bedeutung präzise wieder.
- source_word: לפני
  choice: vor / gegenüber
  rationale: Im ersten Satzteil bedeutet לפני natürlich „vor“; im zweiten bezeichnet es die Haltung gegenüber dem Arzt. Die kontextgerechte Variation bewahrt die Relation, ohne im Deutschen steif zu wirken.
- source_word: עושהו
  choice: seinem Schöpfer
  rationale: Wörtlich „dem, der ihn gemacht hat“ beziehungsweise „seinem Macher“. „Schöpfer“ ist im Deutschen würdig, verständlich und bezeichnet hier eindeutig Gott, ohne die Aussage weiter auszudeuten.
- source_word: יתנכר
  choice: wird sich … abweisend verhalten
  rationale: Das Hitpael von נכר kann ein Sichfremdstellen, Sichentziehen oder feindselig-distanziertes Verhalten ausdrücken. „Sich abweisend verhalten“ bewahrt diese Distanzierung, ohne sie vorschnell als offenen Trotz festzulegen.
- source_word: רופא
  choice: einem Arzt
  rationale: Die indefinite Form passt zum artikellosen hebräischen Ausdruck und zum medizinischen Zusammenhang; „Arzt“ ist im modernen Standarddeutsch natürlicher als „Heiler“.
theological_decisions:
- issue: Abweichung zwischen dem hebräischen und dem griechischen zweiten Satzteil
  choice: 'Der Haupttext folgt dem erhaltenen Hebräisch: Der Sünder verhält sich einem Arzt gegenüber abweisend.'
  alternative: 'Die griechische Überlieferung lautet: „wird in die Hände eines Arztes fallen“.'
  rationale: Da ein hoch eingestufter hebräischer Text vorliegt, erhält er Vorrang. Die erheblich abweichende griechische Lesart wird in der Fußnote vollständig offengelegt, sodass die unterschiedliche Aussage nicht eingeebnet wird.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper, sprichwortartiger Struktur. „Abweisend“ hält die Bedeutungsbreite von יתנכר eher offen als das stärkere „trotzig“.
