  text: All these have trusted in their hands[a], and each becomes skillful in his own work.
translation:
  language: de
  text: Sie alle vertrauen auf ihre Hände[a], und jeder zeigt sich geschickt in seiner Arbeit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Wortlaut ist ungewöhnlich. Die Wendung kann auch verstanden werden als: „Sie alle sind ihren Händen anvertraut worden“ oder: „Sie setzen ihr Vertrauen auf ihre Hände.“ Gemeint ist wahrscheinlich, dass diese Handwerker sich auf ihre manuelle Geschicklichkeit verlassen.'
    reason: alternative_reading
lexical_decisions:
- source_word: πάντες οὗτοι
  choice: Sie alle
  rationale: Die Wendung verweist auf die zuvor genannten Handwerker. „Sie alle“ ist im Deutschen natürlich und fügt keine im Griechischen nicht ausdrücklich enthaltene Personenbezeichnung hinzu.
- source_word: εἰς χεῖρας αὐτῶν ἐνεπίστευσαν
  choice: vertrauen auf ihre Hände
  rationale: 'Die ungewöhnliche Konstruktion wird aktiv verstanden: Die Handwerker verlassen sich auf die Geschicklichkeit ihrer Hände. Wegen der sprachlichen Schwierigkeit und der möglichen passiven Deutung bleibt die Alternative in einer Fußnote erhalten.'
- source_word: ἕκαστος
  choice: jeder
  rationale: Gibt den distributiven Sinn knapp und idiomatisch wieder.
- source_word: ἐν τῷ ἔργῳ αὐτοῦ
  choice: in seiner Arbeit
  rationale: Bewahrt sowohl den Tätigkeitsbereich als auch den Possessivbezug; „Arbeit“ ist weiter und quellennäher als das kontextuell mögliche „Handwerk“.
- source_word: σοφίζεται
  choice: zeigt sich geschickt
  rationale: Im Zusammenhang handwerklicher Berufe bezeichnet das Verb praktische Weisheit beziehungsweise Sachkunde. „Zeigt sich geschickt“ gibt diesen Sinn wieder, ohne eine Entwicklung des Könnens zwingend vorauszusetzen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die ungewöhnliche Bildlichkeit der Hände bleibt im Haupttext erhalten; die echte syntaktische Mehrdeutigkeit wird nicht stillschweigend beseitigt, sondern in der Fußnote dokumentiert.
