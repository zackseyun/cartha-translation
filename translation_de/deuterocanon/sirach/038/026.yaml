translation:
  language: de
  text: Sein Eifer gilt der Fertigstellung des Viehstalls[a]; er richtet sein Herz darauf, die Furchen zu eggen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Griechisch: „Und seine Wachsamkeit gilt dem Futter der jungen Rinder.“ Das stützt den Sinn beständiger Sorge für die Fütterung des Viehs. Der hebräische Wortlaut richtet den Blick eher auf einen Vieh-, Fütterungs- oder Maststall, der griechische auf das Futter der Tiere.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „Er setzt seinen Sinn darauf, die Furchen zu bearbeiten.“ Das hebräische Verb kann das Eggen, Aufbrechen oder weitere Bearbeiten des gepflügten Bodens bezeichnen; der griechische Text hat dagegen „Furchen zu ziehen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ושקידתו
  choice: sein unermüdlicher Einsatz
  rationale: Das von שקד abgeleitete Wort bezeichnet anhaltende Aufmerksamkeit und beharrlichen Fleiß. Im Zusammenhang bäuerlicher Arbeit gibt „unermüdlicher Einsatz“ den Gedanken natürlicher wieder als das wörtlichere „Wachsamkeit“.
- source_word: לכלות
  choice: der vollständigen Versorgung
  rationale: כלה kann „vollenden, zu Ende bringen“ bedeuten. Zusammen mit מרבק ist wohl gemeint, die mit dem Futterstall verbundene Arbeit vollständig auszuführen; die Formulierung bewahrt den Vollendungsgedanken, ohne eine bestimmte Einzeltätigkeit vorauszusetzen.
- source_word: מרבק
  choice: des Futterstalls
  rationale: מרבק bezeichnet einen Stall beziehungsweise Fütterungs- oder Mastplatz für Rinder. „Futterstall“ ist knapp, verständlich und berücksichtigt die durch das griechische Parallelzeugnis bestätigte Fütterungsfunktion.
- source_word: לב ישית
  choice: er richtet sein Herz darauf
  rationale: Die hebräische Wendung beschreibt entschlossene, konzentrierte Aufmerksamkeit. Die Wiedergabe erhält das Bild des Herzens und bleibt im Deutschen verständlich.
- source_word: לשדד
  choice: aufzubrechen
  rationale: Das Verb bezeichnet hier die Bearbeitung bereits gepflügten Bodens, etwa das Aufbrechen von Schollen oder Eggen. „Aufbrechen“ vermeidet eine zu enge Festlegung auf ein bestimmtes landwirtschaftliches Gerät.
- source_word: בתלמים
  choice: die Furchen
  rationale: תלמים sind Pflugfurchen oder gepflügte Reihen. „Die Furchen“ bewahrt das konkrete Bild des Ackers.
