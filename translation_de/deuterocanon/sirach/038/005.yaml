base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/038/005.yaml
  text: Was not water made sweet by wood[c][b][a], so that his power might be made known to every man?
translation:
  language: de
  text: Wurde nicht Wasser durch Holz süß gemacht,[a][b] damit seine Macht allen Menschen bekannt würde?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „durch ein Stück Holz“.'
    reason: alternative_reading
  - marker: b
    text: Wahrscheinlich eine Anspielung darauf, dass bitteres Wasser mithilfe von Holz süß gemacht wurde (2. Mose 15,25).
    reason: cross_reference
  - marker: c
    text: 'Oder: „dessen Kraft“, wenn sich das Pronomen auf das Holz bezieht. Hebräisch und Griechisch lassen diesen Bezug zu; im Zusammenhang ist jedoch wahrscheinlich Gottes Macht gemeint, die durch das verwendete Mittel sichtbar wird.'
    reason: alternative_reading
lexical_decisions:
- source_word: הלא
  choice: Wurde nicht
  rationale: Leitet eine rhetorische Frage ein, die Zustimmung erwartet; auch das griechische οὐκ stützt diese Satzfunktion.
- source_word: בעץ
  choice: durch Holz
  rationale: Die Präposition ב bezeichnet hier das Mittel. „Holz“ bewahrt die unbestimmte Ausdrucksweise des Hebräischen und des griechischen ξύλου, ohne vorschnell „Baum“ oder „Holzstück“ festzulegen.
- source_word: המתיקו מים
  choice: Wasser … süß gemacht
  rationale: Das Verb bedeutet konkret „süß machen“. Die Formulierung erhält das Bild der Verwandlung und vermeidet die deutendere Wiedergabe „genießbar gemacht“.
- source_word: בעבור להודיע
  choice: damit … bekannt würde
  rationale: Gibt die Zweckangabe wieder und lässt den verursachenden Handelnden im Deutschen ebenso unausgesprochen wie die Infinitivkonstruktion im Hebräischen.
- source_word: כל אנוש
  choice: allen Menschen
  rationale: אנוש bezeichnet hier den Menschen allgemein. „Allen Menschen“ ist im modernen Deutschen natürlich, inklusiv und bewahrt den universalen Sinn von כל.
- source_word: כחו
  choice: seine Macht
  rationale: Das maskuline Suffix wird im Kontext am ehesten auf Gott bezogen. „Macht“ bezeichnet die offenbarte göttliche Wirksamkeit idiomatischer als „Kraft“.
theological_decisions:
- issue: Bezug des Pronomens in כחו / αὐτοῦ
  choice: „seine“ bezieht sich im Haupttext auf Gott
  alternative: „dessen Kraft“ mit Bezug auf das Holz; denkbar ist auch ein Bezug auf Mose
  rationale: Der Satz beschreibt den Zweck des Zeichens wahrscheinlich als Offenbarung göttlicher Macht. Da die grammatische Form den Bezug jedoch nicht eindeutig festlegt, wird die sachliche Mehrdeutigkeit in einer Fußnote offengelegt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die rhetorische Frage und das konkrete Bild des Süßmachens bleiben erhalten. „Allen Menschen“ gibt den generischen und universalen Sinn natürlich wieder. Die Marker stehen unmittelbar an den jeweils erläuterten Textstellen.
