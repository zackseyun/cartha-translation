  language: en
  yaml_path: translation/deuterocanon/sirach/038/027.yaml
  text: So too every craftsman and planner[a], who labors by night as by day.
translation:
  language: de
  text: Ebenso müht sich der Handwerker und Gestalter bei Nacht wie bei Tag ab.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Hebräische ist knapp und bezeichnet einen Handwerker sowie einen Planer oder Entwerfer. Es enthält nicht ausdrücklich „jeder“; die griechische Parallele hat „jeder Handwerker und Baumeister“ und führt anschließend Graveure sowie ihre wache Ausdauer bis zur Vollendung des Werkes an. Der Haupttext folgt dem Hebräischen und lässt die genaue Art des Gestaltens offen.
    reason: alternative_reading
lexical_decisions:
- source_word: אף
  choice: Ebenso
  rationale: Das Wort führt vergleichend eine weitere Berufsgruppe im Zusammenhang ein.
- source_word: עשה חרש
  choice: jeder Handwerker
  rationale: Die knappe hebräische Verbindung bezeichnet einen Menschen, der ein qualifiziertes Handwerk ausübt; eine Festlegung auf Schmied oder Zimmermann wäre zu eng.
- source_word: וחשב
  choice: und Gestalter
  rationale: Das Wortfeld umfasst planendes, entwerfendes und kunstfertiges Arbeiten. „Gestalter“ bewahrt die handwerklich-künstlerische Färbung, ohne einen modernen Einzelberuf vorauszusetzen.
- source_word: אשר
  choice: der
  rationale: Das Relativpronomen leitet die nähere Beschreibung des Handwerkers ein.
- source_word: לילה כיום
  choice: nachts wie tags
  rationale: Die knappe Vergleichsformel wird im Deutschen idiomatisch wiedergegeben und bezeichnet Arbeit bis in die Nacht.
- source_word: יגיע
  choice: sich abmüht
  rationale: Das Verb drückt anstrengende, ermüdende Arbeit aus; „sich abmühen“ erhält diese Intensität.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die kurze Satzform des Hebräischen bleibt erhalten; „Handwerker und Gestalter“ gibt die zwei eng verbundenen Tätigkeitsbezeichnungen wieder, ohne sie auf ein bestimmtes Gewerbe festzulegen.
