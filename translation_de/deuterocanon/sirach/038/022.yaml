lexical_decisions:
- source_word: מושבת מתו
  choice: Die Ruhestätte des Toten
  rationale: מושבת bezeichnet einen Sitz-, Wohn- oder Aufenthaltsort. Im Bestattungskontext gibt „Ruhestätte“ den Sinn natürlich wieder, ohne das im Hebräischen nicht ausdrücklich genannte „Grab“ einzutragen; מתו wird als „des Toten“ wiedergegeben.
- source_word: שבת זכרו
  choice: ist seine Bleibe
  rationale: Die überlieferte Wortfolge ist schwierig und laut Quellenangabe geringfügig unstimmig. Die Fassung folgt der geprüften hebräischen Lesart des Konsultationstextes und gibt den Gedanken eines bleibenden Aufenthaltsorts wieder, ohne aus dem unsicheren Ausdruck einen nicht eindeutig belegten Imperativ „Erinnere dich“ zu machen.
- source_word: והנחם
  choice: lass dich trösten
  rationale: Die Form bezeichnet das Empfangen beziehungsweise Annehmen von Trost. „Lass dich trösten“ wahrt die passive oder reflexive Nuance und klingt im heutigen Deutsch natürlich.
- source_word: עם צאת
  choice: wenn … dahingeht
  rationale: עם hat hier zeitliche Funktion; צאת bezeichnet das Hinaus- oder Fortgehen. Die deutsche Formulierung gibt die Todesumschreibung verständlich und würdig wieder.
- source_word: נפשו
  choice: sein Leben
  rationale: נפש kann Leben, Seele, Selbst oder Lebenshauch bedeuten. Im Haupttext vermeidet „Leben“ eine unnötige Festlegung auf eine bestimmte Lehre vom Wesen der Seele; die ebenfalls mögliche Wiedergabe „Seele“ steht in der Fußnote.
theological_decisions:
- issue: Wiedergabe von נפש im Zusammenhang mit dem Tod
  choice: wenn sein Leben dahingeht
  alternative: wenn seine Seele dahingeht
  rationale: Die Bedeutungsbreite von נפש soll nicht zugunsten einer bestimmten Anthropologie verengt werden. „Leben“ ist im Kontext idiomatisch; „Seele“ bleibt als lexikalisch mögliche traditionelle Lesart sichtbar.
- issue: Starke Abweichung zwischen hebräischem Text und griechischer Parallelüberlieferung
  choice: Der Haupttext folgt dem erhaltenen hebräischen Zeugnis.
  alternative: '„Denk daran: Sein Geschick ist wie deins: gestern ich, heute du.“'
  rationale: Für den erhaltenen hebräischen Sirachtext gilt Quellenprimat. Da die griechische Fassung erheblich abweicht und offenbar eine andere Textgestalt bezeugt, wird sie nicht in den Haupttext eingemischt, sondern vollständig in einer Fußnote dokumentiert.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die knappe, spruchhafte Struktur bleibt erhalten; die Unsicherheit des hebräischen ersten Satzteils und die semantische Offenheit von נפש werden nicht stillschweigend aufgelöst.
