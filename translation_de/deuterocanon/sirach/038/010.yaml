translation:
  language: de
  text: Lass ab vom Unrecht und richte dein Handeln recht aus[a]; reinige dein Herz von allen Vergehen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hebräische Wortlaut dieses Satzteils ist in den erhaltenen Handschriften schwierig. Der griechische Paralleltext lautet wörtlich: „Richte deine Hände gerade aus“; die Hände stehen hier wahrscheinlich für das Handeln.'
    reason: textual_variant
  - marker: b
    text: 'Oder: „von allen Übertretungen“. Das hebräische Wort kann bewusste oder auflehnende Verfehlungen bezeichnen; der griechische Paralleltext hat „von jeder Sünde“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נום מעול
  choice: Lass ab vom Unrecht
  rationale: Die erste hebräische Form ist unsicher; im Zusammenhang und nach dem griechischen ἀπόστησον ist eine Aufforderung gemeint, sich vom Bösen zu entfernen. עול bezeichnet Unrecht, Verfehlung oder Rechtsbruch. „Lass ab vom Unrecht“ ist natürlich, würdevoll und bewahrt den Imperativ.
- source_word: ומהכר פנים
  choice: und richte deine Hände auf das Rechte aus
  rationale: Der überlieferte hebräische Wortlaut ist schwierig und stimmt offenbar nicht genau mit dem griechischen Paralleltext überein. Dieser liest εὔθυνον χεῖρας, „richte deine Hände gerade/recht aus“. Die Übersetzung folgt hier dem klareren griechischen Zeugnis, behält aber das Bild der Hände für das praktische Handeln bei.
- source_word: ומכל פשעים
  choice: von allen Vergehen
  rationale: 'פשעים bezeichnet Übertretungen und kann den stärkeren Beiklang aufrührerischer oder bewusster Verfehlungen tragen. „Vergehen“ wahrt diesen konkreten ethischen Akzent besser als das allgemeinere „Sünden“; der griechische Paralleltext hat den Singular in umfassendem Sinn: „von jeder Sünde“.'
- source_word: טהר לב
  choice: reinige dein Herz
  rationale: טהר bedeutet reinigen oder läutern. „Reinige dein Herz“ bewahrt sowohl den moralischen als auch den kultisch anklingenden Bedeutungsraum und entspricht der knappen Imperativform.
theological_decisions:
- issue: Heranziehung des griechischen Paralleltexts bei schwierigem hebräischem Wortlaut
  choice: Das Hebräische bleibt der Hauptzeuge; die unklare mittlere Wendung wird jedoch nach dem griechischen Paralleltext als Aufforderung verstanden, die eigenen Taten recht auszurichten.
  alternative: Die schwierige hebräische Wendung wörtlich wiedergeben oder unabhängig vom Griechischen als Ausdruck über das Ansehen der Person deuten.
  rationale: Die erhaltene hebräische Lesart ist an dieser Stelle textkritisch schwierig, während der griechische Text eine klare, zum Kontext passende Folge von Imperativen bietet. Die Fußnote macht transparent, dass die Formulierung der mittleren Aussage auf diesem Parallelzeugnis beruht.
- issue: Wiedergabe von פשעים
  choice: Vergehen
  alternative: Sünden; Übertretungen; Auflehnungen
  rationale: „Vergehen“ bewahrt die stärkere ethische Färbung des hebräischen Wortes, ohne eine bestimmte Lehre über die Einteilung von Sünden einzutragen. Die umfassende Aussage bleibt erhalten.
translation_notes:
  register: Modernes Standarddeutsch in knapper, würdevoller Mahnrede. Die parallelen Imperative und das biblische Bild von Händen und Herz bleiben erhalten. Die schwer verständliche Wendung „die Hände recht ausrichten“ wird durch „auf das Rechte ausrichten“ leicht erschlossen, ohne das Bild durch die abstrakte Erklärung „Handeln“ zu ersetzen.
