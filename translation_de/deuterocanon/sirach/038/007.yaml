  source_fidelity: 'Der Satzbau und die zentralen Beziehungen des hebräischen Textes sind zutreffend wiedergegeben: „Mit ihnen“ bewahrt den knappen Rückbezug, der Arzt lindert Schmerz, und der רוקח stellt eine מרקחת her. „Arzneimischung“ legt jedoch stärker als der Wortlaut fest, dass das Gemisch selbst ein Arzneimittel ist. מרקחת bezeichnet zunächst eine zubereitete Mischung, besonders von Salb-, Duft- oder Würzstoffen; der medizinische Kontext ist vorhanden, aber im Substantiv nicht ausdrücklich markiert.'
