  text: By them the physician eases pain, and so the perfumer prepares a mixture.
translation:
  language: de
  text: Mit ihnen lindert der Arzt Schmerzen, und ebenso bereitet der Salbenmischer eine Mischung.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בהם
  choice: Mit ihnen
  rationale: Der Rückbezug auf die zuvor genannten Heilmittel bzw. Stoffe bleibt wie im Hebräischen knapp und offen.
- source_word: רופא
  choice: der Arzt
  rationale: Die gewöhnliche moderne Entsprechung für den medizinisch Behandelnden.
- source_word: יניח מכאוב
  choice: lindert … Schmerzen
  rationale: Das Verb נוח im Kausativ bezeichnet hier das Zur-Ruhe-Bringen bzw. Erleichtern von Schmerz; die deutsche Wendung ist natürlich und wahrt den Sinn.
- source_word: וכן
  choice: und ebenso
  rationale: Gibt die koordinierende Vergleichs- bzw. Entsprechungsformel des Hebräischen wieder, ohne einen stärkeren Folgeschluss einzutragen.
- source_word: רוקח
  choice: der Salbenmischer
  rationale: Bezeichnet im antiken Kontext den kundigen Hersteller gemischter Duft-, Salb- oder Arzneistoffe; dies ist konkreter als das heute leicht missverständliche „Parfümeur“.
- source_word: עושה מרקחת
  choice: bereitet … eine Arzneimischung
  rationale: מרקחת ist ein zubereitetes Gemisch, hier im medizinischen Zusammenhang wahrscheinlich eine Arzneimischung; „bereitet“ entspricht idiomatisch עושה.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der parallele Satzbau des Hebräischen bleibt erhalten. „Salbenmischer“ bewahrt den antiken Berufskontext, während „Arzneimischung“ die medizinische Einbettung des Verses deutlich macht.
