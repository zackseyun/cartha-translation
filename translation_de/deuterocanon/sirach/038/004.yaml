  text: The Lord created medicines from the earth[b][a], and a sensible man will not despise them.
translation:
  language: de
  text: Gott bringt Heilmittel aus der Erde hervor[a], und ein verständiger Mann verschmäht sie nicht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die hebräische Verbform ist schwierig. Die griechische Parallele lautet: „Der Herr erschuf Heilmittel aus der Erde.“'
    reason: textual_variant
lexical_decisions:
- source_word: אל
  choice: Gott
  rationale: Das hebräische אֵל bezeichnet hier Gott als handelndes Subjekt. Die griechische Parallele hat Κύριος („Herr“), doch der gut bezeugte hebräische Text wird im Haupttext unmittelbar wiedergegeben.
- source_word: מארץ
  choice: aus der Erde
  rationale: מִן mit אֶרֶץ bezeichnet hier die Erde als Herkunft der Heilmittel; dies stimmt mit griechisch ἐκ γῆς überein.
- source_word: מצוציא
  choice: bringt … hervor
  rationale: Die überlieferte hebräische Form ist schwierig, legt aber im Zusammenhang ein Hervorbringen aus der Erde nahe. Diese Wiedergabe bleibt näher an der hebräischen Ausdrucksweise als „erschafft“, während die griechische Parallele mit ἔκτισεν die göttliche Urheberschaft bestätigt.
- source_word: תרופות
  choice: Heilmittel
  rationale: Das Wort bezeichnet Mittel zur Heilung. „Heilmittel“ ist im modernen Deutschen natürlich, konkret und weiter gefasst als ausschließlich pharmazeutische „Medikamente“.
- source_word: גבר מבין
  choice: ein verständiger Mann
  rationale: גבר bezeichnet einen Mann, מבין einen Menschen mit Einsicht und Urteilsvermögen. „Verständig“ gibt diese praktische Einsicht würdig und natürlich wieder.
- source_word: אל ימאס בם
  choice: verschmäht sie nicht
  rationale: מאס bedeutet verwerfen oder geringschätzen. „Verschmähen“ bewahrt den wertenden Gehalt und lässt sich als allgemeine Aussage lesen.
theological_decisions:
- issue: 'Göttliches Subjekt: hebräisch אל gegenüber griechisch Κύριος'
  choice: Gott
  alternative: der Herr
  rationale: Da die hebräische Quelle אֵל bietet und als primäre Textgrundlage mit hoher Sicherheit gilt, steht „Gott“ im Haupttext. Die Lesart der griechischen Parallele wird in einer Fußnote offengelegt; die Aussage über Gottes Urheberschaft bleibt in beiden Lesarten gleich.
- issue: Schwierige hebräische Verbform מצוציא
  choice: bringt … hervor
  alternative: erschuf
  rationale: „Bringt … hervor“ wahrt die im Hebräischen erkennbare Herkunftsbewegung aus der Erde, ohne die schwierige Form stillschweigend ausschließlich nach dem griechischen ἔκτισεν aufzulösen. Die griechische Alternative wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz bleibt knapp und sprichwortartig; „verständiger Mann“ bewahrt die maskuline Einzelform des Hebräischen, und „Heilmittel“ ist allgemeinverständlich, ohne den Sinn auf moderne Arzneimittel zu verengen.
