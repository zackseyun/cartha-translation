  yaml_path: translation/deuterocanon/sirach/038/035.yaml
  text: but they will sustain the order of the age[b][a], and their prayer is in the work of their craft.
translation:
  language: de
  text: Doch sie werden das Gefüge der Welt erhalten,[a] und ihr Gebet ist in der Arbeit ihres Handwerks.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: „das Geschaffene des Zeitalters“ oder „die Ordnung der Welt“. Der knappe griechische Ausdruck kann das dauerhafte Gefüge der menschlichen Gesellschaft oder umfassender die bestehende Weltordnung bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „ihre Bitte ist bei der Arbeit ihres Handwerks“. Der griechische Wortlaut verbindet ihr Gebet eng mit ihrer fachkundigen Arbeit, ohne die Art dieser Verbindung näher zu bestimmen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Doch
  rationale: Kennzeichnet den Gegensatz zur vorherigen Aussage über die fehlende Rolle der Handwerker in Rat und öffentlichem Amt; „Doch“ ist im Deutschen knapp und würdig.
- source_word: κτίσμα αἰῶνος
  choice: das Gefüge der Welt
  rationale: κτίσμα bezeichnet etwas Geschaffenes oder Hervorgebrachtes, αἰών kann „Zeitalter“, „Welt“ oder eine lange Dauer bezeichnen. „Gefüge der Welt“ passt zum gesellschaftlichen Zusammenhang, ohne den Ausdruck ausschließlich gesellschaftlich oder kosmologisch festzulegen.
- source_word: στηρίσουσιν
  choice: werden … erhalten
  rationale: στηρίζω bedeutet fest machen, stützen oder Bestand geben. „Erhalten“ drückt hier aus, dass die handwerkliche Arbeit dem Welt- und Gesellschaftsgefüge dauerhaften Bestand gibt.
- source_word: ἡ δέησις αὐτῶν
  choice: ihr Gebet
  rationale: δέησις bezeichnet eine Bitte oder ein Bittgebet. „Gebet“ ist die klare, allgemein verständliche Wiedergabe, während die mögliche Nuance der Bitte in einer Fußnote genannt wird.
- source_word: ἐν ἐργασίᾳ τέχνης
  choice: in der Arbeit ihres Handwerks
  rationale: Die bewusst nahe Wiedergabe erhält die ungewöhnliche Verknüpfung von Gebet und handwerklicher Arbeit. τέχνη meint hier aufgrund des Kontexts ein erlerntes, fachkundiges Handwerk.
theological_decisions:
- issue: Verhältnis von Gebet und handwerklicher Arbeit
  choice: Das Gebet wird in den Bereich der handwerklichen Arbeit gestellt; die Formulierung lässt offen, ob es sich darin ausdrückt oder sie begleitet.
  alternative: Ihre Bitte gilt dem Erfolg ihrer handwerklichen Arbeit.
  rationale: ἐν bezeichnet zunächst den Bereich, in dem sich das Gebet befindet. Eine eindeutig instrumentale Deutung der Arbeit als Gebet oder eine Beschränkung auf die Bitte um beruflichen Erfolg würde die Spannung des griechischen Satzes vorschnell auflösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die leicht ungewohnte Wendung „ihr Gebet ist in der Arbeit“ wurde bewusst beibehalten, damit die Bildhaftigkeit und Mehrdeutigkeit des griechischen Textes nicht durch eine glattere Deutung ersetzt wird.
