  text: Honor the physician according to your need of him[a], for God has also given him a portion.
translation:
  language: de
  text: Ehre den Arzt, wie es dein Bedarf an ihm erfordert[a]; denn auch ihm hat Gott einen Anteil gegeben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder nach dem Griechischen: »Ehre den Arzt für seine Dienste, denn auch ihn hat der Herr geschaffen.« Wörtlicher lautet das Hebräische: »Denn auch bei ihm ist ein Anteil von Gott.«'
    reason: alternative_reading
lexical_decisions:
- source_word: רעי
  choice: Ehre
  rationale: Der Imperativ ist zwar auch im Sinn von »freundlich behandeln« oder »wertschätzen« deutbar, doch das griechische Τίμα bestätigt hier die Bedeutung »ehren«. »Ehre« bewahrt zugleich den würdevollen Ton der Weisheitsliteratur.
- source_word: רופא
  choice: den Arzt
  rationale: רופא bezeichnet einen Heiler beziehungsweise Arzt. »Arzt« ist im modernen Standarddeutsch natürlich, präzise und weniger altertümlich als »Heilkünstler« oder »Heiler«.
- source_word: לפני צרכו
  choice: wie es dein Bedarf an ihm erfordert
  rationale: Die knappe hebräische Wendung verbindet die Achtung des Arztes mit dem Bedarf an ihm. Die Formulierung gibt diesen Zusammenhang verständlich wieder, ohne die im Griechischen anklingenden Dienstleistungen oder Honorare ausdrücklich in den Haupttext einzutragen.
- source_word: חלק אל
  choice: hat Gott einen Anteil gegeben
  rationale: חלק bedeutet »Anteil« oder »Teil«. Da der hebräische Nominalsatz die Herkunft beziehungsweise Zuweisung durch Gott ausdrückt, macht die deutsche Verbalkonstruktion den Sinn natürlich verständlich, ohne den Anteil näher zu bestimmen.
theological_decisions:
- issue: Theologische Begründung für die Ehrung des Arztes
  choice: denn auch ihm hat Gott einen Anteil gegeben
  alternative: denn auch ihn hat der Herr geschaffen
  rationale: Der erhaltene hebräische Text spricht von einem »Anteil« Gottes, während die griechische Parallelüberlieferung die Erschaffung des Arztes durch den Herrn nennt. Der Haupttext folgt dem hebräischen Zeugen; die griechische Lesart und der wörtlichere hebräische Wortlaut werden in der Fußnote offengelegt, damit die Spannung zwischen den Überlieferungen erhalten bleibt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz bleibt für gewöhnliche Leser verständlich, während die ungewöhnliche Rede vom göttlich gegebenen »Anteil« bewusst erhalten und nicht konfessionell ausgedeutet wird.
