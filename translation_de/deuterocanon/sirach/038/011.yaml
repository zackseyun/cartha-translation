translation:
  language: de
  text: Bringe eine wohlgefällige Gedächtnisgabe dar[a] und statte das zugerichtete Opfer mit dem Besten deines Vermögens reichlich aus.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: »Bring eine wohlgefällige Gedächtnisgabe dar.« Der Ausdruck gehört zur Opfersprache; ניחוח kann dabei sowohl den angenehmen Duft als auch die Wohlgefälligkeit des Opfers bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »… mit den Flügeln deines Vermögens.« Das hebräische Bild ist nicht völlig eindeutig und meint hier wahrscheinlich das Beste oder das volle Ausmaß der eigenen Mittel. Die griechische Fassung lautet abweichend: »Gib Wohlgeruch und eine Gedächtnisgabe aus Feinmehl und mache die Opfergabe reich, wie einer, der nicht mehr da ist.«'
    reason: alternative_reading
lexical_decisions:
- source_word: הגש
  choice: Bring … dar
  rationale: Der Imperativ bezeichnet im Opferkontext das Heranbringen beziehungsweise Darbringen einer Gabe; die deutsche Wendung bewahrt den kultischen Sinn.
- source_word: ניחוח
  choice: wohlgefällige
  rationale: Das Wort bezeichnet in der Opfersprache Wohlgeruch beziehungsweise die wohlgefällige Annahme. Da im Hebräischen hier kein ausdrückliches Substantiv für „Duft“ steht, gibt „wohlgefällig“ den Sinn knapp wieder.
- source_word: אזכרה
  choice: Gedächtnisgabe
  rationale: Der kultische Fachausdruck bezeichnet die Gedächtnisgabe beziehungsweise den Gedächtnisanteil eines Opfers und soll nicht zu einem allgemeinen „Gedenken“ abgeschwächt werden.
- source_word: ודשן
  choice: mache … reich
  rationale: Das Verb kann „fett/reich machen“ bedeuten. Die Formulierung vermittelt hier die großzügige Ausstattung des Opfers, ohne im Deutschen irreführend von einem „Mästen“ zu sprechen.
- source_word: ערוך
  choice: das zugerichtete Opfer
  rationale: Das Wort bezeichnet etwas Geordnetes oder Zubereitetes, wahrscheinlich die auf dem Altar angeordneten Opferteile. „Zugerichtetes Opfer“ ist natürlich und bewahrt den kultischen Bezug; das griechische προσφορά bestätigt den allgemeinen Opfersinn.
- source_word: בכנפי
  choice: mit dem Besten
  rationale: Wörtlich steht „mit den Flügeln/Rändern“. In Verbindung mit Vermögen liegt eine idiomatische Aussage über das Beste oder Äußerste der eigenen Mittel nahe; die Fußnote bewahrt das konkrete Bild und seine Unsicherheit.
- source_word: הוניך
  choice: deines Vermögens
  rationale: הון bezeichnet Besitz, Habe oder Vermögen. „Vermögen“ passt zum gehobenen, aber modernen Register und kann zugleich die verfügbaren Mittel bezeichnen.
theological_decisions:
- issue: Kultische Bildsprache im Weisheitskontext
  choice: Die ausdrückliche Opfersprache mit „Gedächtnisgabe“ und „Opfer“ bleibt erhalten.
  alternative: Die Begriffe könnten allgemein als „Gedenken“, „Gabe“ oder geistliche Frömmigkeit wiedergegeben werden.
  rationale: Sowohl der hebräische Text als auch die griechische Parallele sprechen in Opferbegriffen. Eine Verallgemeinerung oder Vergeistlichung würde die theologische Textur des Verses abschwächen.
- issue: Abweichende Schlusswendung der griechischen Parallele
  choice: 'Dem hoch bewerteten hebräischen Text wird gefolgt: großzügiges Geben aus dem eigenen Vermögen.'
  alternative: 'Nach dem Griechischen: „und mache die Opfergabe reich, als wärest du nicht mehr da“.'
  rationale: Die griechische Schlusswendung weicht erheblich ab. Da der hebräische Zeuge als Grundlage validiert ist, wird seine Lesart übersetzt und die griechische Variante lediglich dokumentiert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Gedächtnisgabe“ erhält den kultischen Fachsinn; „zugerichtetes Opfer“ vermeidet die im Deutschen missverständliche wörtliche Verbindung „zugerichtetes Fett“. Die Fußnoten kennzeichnen sowohl das hebräische Idiom als auch die deutlich abweichende griechische Lesart.
