lexical_decisions:
- source_word: למען
  choice: damit
  rationale: Leitet einen Zweck oder eine beabsichtigte Folge ein und entspricht im Deutschen natürlich der hebräischen Konstruktion.
- source_word: לא ישבות
  choice: nicht aufhört
  rationale: שבת bezeichnet hier das Aufhören oder Stillstehen einer Tätigkeit; die Formulierung bleibt nah am Hebräischen und ist zugleich gegenwärtiges Deutsch.
- source_word: מעשהו
  choice: sein Werk
  rationale: Das Substantiv bezeichnet die Tätigkeit beziehungsweise das hervorgebrachte Werk der zuvor genannten Person; „Werk“ bewahrt die knappe Einzahl des Hebräischen.
- source_word: ותושיה
  choice: und wirksame Hilfe
  rationale: תושיה ist an dieser Stelle schwer zu bestimmen und kann Tüchtigkeit, Gelingen, Bestand oder wirksame Hilfe bezeichnen. „wirksame Hilfe“ hält den praktischen Ergebnissinn fest, ohne das Wort auf bloßen technischen Erfolg zu verengen.
- source_word: מבני אדם
  choice: durch Menschen
  rationale: Wörtlich steht „von den Söhnen des Menschen/der Menschen“. Die Wendung meint Menschen allgemein; „durch Menschen“ gibt hier den wahrscheinlichen Gedanken menschlicher Vermittlung natürlich und geschlechtsneutral wieder.
theological_decisions:
- issue: Verhältnis des schwierigen hebräischen Satzteils ותושיה מבני אדם zur abweichenden griechischen Überlieferung
  choice: Den erhaltenen hebräischen Text mit „wirksame Hilfe durch Menschen“ als Haupttext wiedergeben und seine Bedeutungsbreite in einer Fußnote offenlegen.
  alternative: „und Friede von ihm liegt auf der ganzen Erde“ nach der griechischen Parallelüberlieferung.
  rationale: Der erhaltene hebräische Text ist vorrangig, bleibt aber semantisch knapp und mehrdeutig. Die griechische Fassung bezeugt entweder eine abweichende Vorlage oder eine deutende Erweiterung; sie darf deshalb nicht unmarkiert an die Stelle des Hebräischen treten.
translation_notes:
  register: Natürliches, würdevolles Standarddeutsch. Der knappe Zweck- beziehungsweise Folgesatz des Hebräischen bleibt erhalten; „Menschen“ gibt die generische hebräische Wendung ohne männliche Einschränkung wieder.
