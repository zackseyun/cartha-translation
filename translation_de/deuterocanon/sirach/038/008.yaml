translation:
  language: de
  text: damit sein Werk nicht aufhört und wirksame Hilfe von Menschen ausgeht.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das hebräische Wort für „wirksame Hilfe“ ist hier schwer zu deuten; es kann auch Gelingen, Bestand oder Tüchtigkeit meinen. Die griechische Überlieferung lautet abweichend: „und Friede von ihm ist auf der ganzen Erde“.'
