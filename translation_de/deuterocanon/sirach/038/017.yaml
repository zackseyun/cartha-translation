  text: My son[a], make the mourning bitter and complete the lament; perform his mourning as is fitting for him. For a day or two, because of slander, shed tears[b]; then be comforted because of grief.
translation:
  language: de
  text: 17 Mach die Totenklage bitter, mein Sohn, und führe das Klagen zu Ende. Halte die Trauer um ihn, wie es ihm gebührt. Einen oder zwei Tage lang weine[a]; dann tröste dich über deinen Kummer.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch wörtlich: „einen Tag und zwei um der Träne willen“. Die griechische Überlieferung liest dagegen: „einen oder zwei Tage um übler Nachrede willen“, vermutlich um Kritik wegen unterlassener Trauer zu vermeiden.'
    reason: textual_variant
  - marker: b
    text: Das hier mit „Kummer“ wiedergegebene hebräische Wort bedeutet gewöhnlich „Schuld“ oder „Vergehen“, kann aber auch Unheil oder Leid bezeichnen. Die griechische Überlieferung hat „Traurigkeit“.
    reason: alternative_reading
lexical_decisions:
- source_word: המר
  choice: Mach die Totenklage bitter
  rationale: Der Hifil-Imperativ von מרר bewahrt das hebräische Bild einer bitteren, intensiven Klage; auch das griechische πίκρανον stützt diese Wiedergabe.
- source_word: והתם מספד
  choice: und führe das Klagen zu Ende
  rationale: תם bezeichnet hier das vollständige Durchführen der Totenklage, nicht einen abrupten Abbruch. Die Formulierung ist im Deutschen natürlich und hält die Wiederholung des Klagegedankens fest.
- source_word: ושית אבלו כיוצא בו
  choice: Halte die Trauer um ihn so, wie es ihm gebührt
  rationale: Die Wendung bezeichnet eine dem Verstorbenen angemessene Trauer. Das griechische κατὰ τὴν ἀξίαν αὐτοῦ bestätigt diesen Sinn.
- source_word: יום ושנים בעבור דמעה
  choice: Einen oder zwei Tage lang weine
  rationale: Der hebräische Text spricht wörtlich von einem oder zwei Tagen ‚um der Träne willen‘. Die verbale Wiedergabe drückt dies in natürlichem Deutsch aus, ohne die abweichende griechische Lesart in den Haupttext zu übernehmen.
- source_word: הנחם
  choice: lass dich … trösten
  rationale: Der Imperativ bezeichnet den Übergang von der ausdrücklichen Trauer zum Annehmen von Trost; die Formulierung entspricht auch dem griechischen παρακλήθητι.
- source_word: בעבור עון
  choice: in deinem Kummer
  rationale: עון ist an dieser Stelle mehrdeutig und kann gewöhnlich ‚Schuld‘ bedeuten; im Trauerzusammenhang und angesichts des griechischen λύπη ist ‚Kummer‘ beziehungsweise ‚Leid‘ wahrscheinlich.
theological_decisions:
- issue: Verhältnis des erhaltenen hebräischen Textes zur abweichenden griechischen Überlieferung
  choice: Der erhaltene hebräische Wortlaut bildet den Haupttext; die griechischen Abweichungen werden in Fußnoten dokumentiert und zur Klärung der Schlusswendung herangezogen.
  alternative: Die griechische Lesart ‚um übler Nachrede willen‘ direkt in den Haupttext übernehmen.
  rationale: Der hebräische Text ist hier erhalten und hat nach den Projektgrundsätzen Vorrang. Zugleich darf die echte textliche Differenz nicht verschwiegen werden.
- issue: Bedeutung von עון in der Schlusswendung
  choice: Im Haupttext kontextuell als ‚Kummer‘ wiedergeben.
  alternative: Wörtlicher ‚Schuld‘ oder ‚Vergehen‘.
  rationale: Der Trauerkontext und das griechische λύπη sprechen für Leid oder Kummer; eine Fußnote erhält die ungewöhnliche hebräische Mehrdeutigkeit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das markante hebräische Bild der ‚bitteren‘ Totenklage bleibt erhalten; schwer verständliche Nominalwendungen werden behutsam verbalisiert. Die textliche Spannung zwischen Hebräisch und Griechisch wird nicht stillschweigend aufgelöst.
