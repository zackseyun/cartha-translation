translation:
  language: de
  text: Denn seine Bitte möge gelingen[a], und seine Heilung dient der Erhaltung des Lebens.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das hebräische Wort פשרה ist hier unsicher. Der griechische Paralleltext lautet ausführlicher: „Denn auch sie werden den Herrn bitten, dass er ihnen Linderung und Heilung gewähre, damit sie weiterleben können.“'
    reason: alternative_reading
lexical_decisions:
- source_word: פשרה
  choice: seine Bitte
  rationale: Das hebräische Substantiv ist an dieser Stelle unsicher. Der griechische Paralleltext mit δεηθήσονται („sie werden bitten/beten“) stützt ein Verständnis als Bitte oder Flehen. „Bitte“ ist natürlich und legt nicht unnötig eine bestimmte Form des Gebets fest.
- source_word: יצלח לו
  choice: kann Erfolg haben
  rationale: Das Verb bezeichnet Gelingen oder Erfolg. „Kann Erfolg haben“ wahrt angesichts der unsicheren Überlieferung die offene Modalität und gibt den möglichen Erfolg der Bitte idiomatisch wieder.
- source_word: ורפאות
  choice: seine Heilung
  rationale: Die hebräische Form kann Heilungen, Heilmittel oder den Heilungsvorgang bezeichnen; griechisch ἴασιν bestätigt den Sinn „Heilung“. Der Singular entspricht hier natürlichem deutschen Sprachgebrauch.
- source_word: למען מחיה
  choice: dient der Erhaltung des Lebens
  rationale: Die Wendung bezeichnet den Zweck, Leben zu erhalten beziehungsweise weiterzuleben. Diese Formulierung gibt den Zweckgedanken klar und würdevoll wieder und stimmt mit griechisch χάριν ἐμβιώσεως überein.
theological_decisions:
- issue: Abgleich des schwierigen hebräischen Wortlauts mit dem ausführlicheren griechischen Paralleltext
  choice: Der Haupttext folgt der knappen hebräischen Satzstruktur; der griechische Text hilft, פשרה als Bitte und den Schlusssatz als lebensbewahrende Heilung zu verstehen.
  alternative: „Denn sein Gebet wird gelingen, und Heilmittel dienen dem Leben.“
  rationale: Die hebräische Überlieferung ist besonders bei פשרה schwer verständlich. Der griechische Paralleltext darf die Bedeutung erhellen, ohne seine ausführlicheren Aussagen vollständig in den Haupttext einzutragen. So bleiben Unsicherheit und Spannung sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Struktur des Hebräischen bleibt erhalten; die Fußnote macht die textliche Unsicherheit und die ausführlichere griechische Lesart transparent.
