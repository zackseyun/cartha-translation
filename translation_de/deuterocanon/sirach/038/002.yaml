  text: From God the physician becomes wise[c][b][a], and from the king he receives a gift.
translation:
  language: de
  text: Der Arzt wird durch Gott weise,[a] und vom König empfängt er Gaben.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Text lautet abweichend: „Denn die Heilung kommt vom Höchsten.“ Die hebräische Überlieferung nennt dagegen Gott und den Arzt; ihre Konstruktion ist schwierig und kann aussagen, dass der Arzt durch Gott weise wird.'
    reason: textual_variant
  - marker: b
    text: 'Oder: „eine Belohnung“. Die hebräische Wendung ist mehrdeutig und bedeutet wörtlich etwa „Lasten heben/tragen“; im Zusammenhang kann sie empfangene Gaben oder eine Belohnung bezeichnen. Der griechische Text hat: „Er wird eine Gabe empfangen.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: מאת אל
  choice: Von Gott
  rationale: Der hebräische Hauptzeuge nennt אל („Gott“). Das griechische Ὑψίστου („dem Höchsten“) wird als bedeutsame Variante in der Fußnote bewahrt.
- source_word: יחכם רופא
  choice: wird der Arzt weise
  rationale: Dies gibt die überlieferte hebräische Wortfolge und die Grundbedeutung von חכם im Hifil möglichst direkt wieder. Die Konstruktion ist im Zusammenhang schwierig; die deutlich abweichende griechische Lesart über die Heilung wird deshalb nicht stillschweigend in den Haupttext übernommen.
- source_word: מאת מלך
  choice: vom König
  rationale: Die generische hebräische Wendung lässt sowohl „von einem König“ als auch „vom König“ zu. „Vom König“ entspricht dem griechischen Paralleltext und bildet einen natürlichen Gegensatz zu „von Gott“.
- source_word: ישא משאות
  choice: empfängt er Geschenke
  rationale: Wörtlich kann die Wendung auf das Tragen oder Aufnehmen von Lasten bzw. Gaben weisen. Im Kontext bezeichnet sie wahrscheinlich empfangene Gaben oder eine Belohnung; dies wird durch das griechische λήμψεται δόμα („er wird eine Gabe empfangen“) gestützt.
