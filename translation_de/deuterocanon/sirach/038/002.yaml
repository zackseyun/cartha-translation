translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Arzt“ ist allgemein verständlich und entspricht רופא; „weise werden“ bewahrt den auffälligen hebräischen Wortlaut, während die Fußnote die abweichende griechische Überlieferung offenlegt.
