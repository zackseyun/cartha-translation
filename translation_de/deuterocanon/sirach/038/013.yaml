  text: For there is a time when success is in his hands[a], for he too will make supplication to God.
translation:
  language: de
  text: Denn es gibt eine Zeit, in der das Gelingen in seiner Hand liegt[a]; denn auch er fleht zu Gott.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Griechisch: „Es gibt eine Zeit, in der das Gelingen auch in ihren Händen liegt.“ Der hebräische Text hat den Singular („in seiner Hand“), dem der Haupttext folgt.'
    reason: textual_variant
lexical_decisions:
- source_word: כי
  choice: denn
  rationale: Die kausale Konjunktion erklärt im Zusammenhang, warum der Arzt nicht gering geachtet werden soll; „denn“ bildet diese Begründung natürlich ab.
- source_word: יש עתם
  choice: es gibt eine Zeit
  rationale: Die unbestimmte Singularform wird bewusst beibehalten und nicht zu „es gibt Zeiten“ verallgemeinert.
- source_word: בידו
  choice: in seiner Hand
  rationale: Die hebräische Singularform und das anschauliche Bild praktischer Handlungsmacht bleiben erhalten, ohne den Erfolg ausschließlich menschlicher Kontrolle zuzuschreiben.
- source_word: מצלחת
  choice: das Gelingen
  rationale: „Gelingen“ bezeichnet einen günstigen Ausgang und passt zum medizinischen Zusammenhang; zugleich entspricht es dem griechischen εὐοδία.
- source_word: גם הוא
  choice: auch er
  rationale: Die Formulierung hebt hervor, dass neben dem Kranken auch der Arzt sich an Gott wendet.
- source_word: אל אל
  choice: zu Gott
  rationale: Die Folge wird als Präposition אֶל plus Gottesbezeichnung אֵל verstanden und idiomatisch mit „zu Gott“ wiedergegeben.
- source_word: יעתיר
  choice: fleht
  rationale: „Flehen“ gibt den Sinn eindringlichen Bittens gewichtiger wieder als das allgemeinere „beten“. Das deutsche Präsens eignet sich im allgemeinen Aussagesatz für das hebräische Imperfekt.
- source_word: ἐν χερσὶν αὐτῶν
  choice: in seiner Hand
  rationale: Der griechische Paralleltext hat den Plural „in ihren Händen“, doch der primäre hebräische Text bietet den Singular. Die Variante wird in einer Fußnote ausgewiesen.
theological_decisions:
- issue: Verhältnis von ärztlichem Können und göttlichem Wirken
  choice: Der Arzt kann wirklichen Erfolg haben und wendet sich zugleich flehend an Gott.
  alternative: Die Aussage könnte schwächer lediglich feststellen, dass Ärzte bisweilen Erfolg haben; der griechische Plural kann sie außerdem auf Ärzte im Allgemeinen beziehen.
  rationale: Die Übersetzung bewahrt das Nebeneinander menschlichen Handelns und der Abhängigkeit von Gott. Sie führt Heilung weder ausschließlich auf ärztliche Technik noch ausschließlich auf unmittelbares göttliches Eingreifen zurück.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung von „denn“ und das Bild „in seiner Hand“ folgen bewusst der hebräischen Satzstruktur; „fleht“ ist verständlich und wahrt die Eindringlichkeit des Verbs.
