base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/038/031.yaml
  text: So the potter[a], sitting at his work and turning the wheel with his feet, is continually anxious over his work, and all his labor is by number;
translation:
  language: de
  text: 'Ebenso der Töpfer: Er sitzt bei seiner Arbeit und dreht mit den Füßen die Töpferscheibe. Ständig ist er um sein Werk besorgt, und seine ganze Arbeit ist gezählt.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Sein ganzes Werk ist gezählt.« Das griechische Wort für »Arbeit« kann auch das Erzeugnis der Arbeit bezeichnen; »gezählt« kann auch mit »nummeriert« oder »zahlenmäßig erfasst« wiedergegeben werden.'
    reason: Die griechischen Wörter ἐργασία und ἐνάριθμος lassen offen, ob die Tätigkeit insgesamt oder die einzelnen Erzeugnisse als gezählt beschrieben werden.
lexical_decisions:
- source_word: κεραμεύς
  choice: Töpfer
  rationale: Die übliche und im Handwerkskontext natürliche deutsche Bezeichnung für einen Hersteller von Tongefäßen.
- source_word: καθήμενος ἐν ἔργῳ αὐτοῦ
  choice: Er sitzt bei seiner Arbeit
  rationale: Gibt Körperhaltung und Tätigkeit konkret und in natürlichem Deutsch wieder.
- source_word: συστρέφων ἐν ποσὶν αὐτοῦ τροχόν
  choice: dreht mit den Füßen die Töpferscheibe
  rationale: Das Drehen mit den Füßen bezeichnet die Bedienung der Scheibe; „Töpferscheibe“ macht den im Kontext eindeutigen Gegenstand auf Deutsch klar.
- source_word: ἐν μερίμνῃ κεῖται διὰ παντὸς ἐπὶ τὸ ἔργον αὐτοῦ
  choice: Ständig ist er um sein Werk besorgt
  rationale: μερίμνη bezeichnet anhaltende Sorge oder angespannte Aufmerksamkeit. „Besorgt“ wahrt diesen stärkeren Sinn, ohne eine krankhafte Angst zu unterstellen.
- source_word: πᾶσα ἡ ἐργασία αὐτοῦ
  choice: alles, was er anfertigt
  rationale: ἐργασία kann sowohl die Arbeit als auch deren Erzeugnisse bezeichnen. Im Zusammenhang mit dem Zählen ist die produktbezogene Wiedergabe verständlich und sachgerecht.
- source_word: ἐνάριθμος
  choice: ist abgezählt
  rationale: Das Adjektiv bedeutet „gezählt“, „nummeriert“ oder „zahlenmäßig erfasst“. „Abgezählt“ ist idiomatisch und bewahrt den Bezug auf eine bestimmte Zahl, ohne die nicht ausdrücklich genannte Vorstellung des Messens einzutragen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der einleitende Satzanschluss „Ebenso der Töpfer“ wahrt den aufzählenden Charakter des Zusammenhangs. Zwei Sätze vermeiden eine schwerfällige Nachbildung der langen griechischen Partizipial- und Relativkonstruktion.
