  naturalness: Modernes, gut verständliches und würdiges Deutsch. Die Aufteilung in zwei Sätze ist idiomatisch. „Seine ganze Arbeit ist gezählt“ ist ebenso natürlich und näher an der offenen Aussage des Ausgangstextes.
  terminology: „Töpfer“, „Töpferscheibe“ und „besorgt“ sind angemessen. Für ἐνάριθμος ist „gezählt“ die neutrale, idiomatische Wiedergabe; sie bewahrt die im Griechischen bestehende Offenheit besser als „abgezählt“.
