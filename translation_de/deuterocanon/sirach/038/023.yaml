  text: A scribe’s wisdom increases wisdom[a], and one free from busyness will become wise.
translation:
  language: de
  text: Die Weisheit eines Schriftgelehrten mehrt Weisheit, und wer von Geschäften frei ist, wird weise.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „wem es an Beschäftigung oder Geschäften fehlt“. Der unter dieser Versnummer überlieferte griechische Text handelt dagegen von der Ruhe eines Verstorbenen und entspricht inhaltlich nicht diesem hebräischen Satz.'
    reason: textual_variant
lexical_decisions:
- source_word: חכמת
  choice: Weisheit
  rationale: Das Substantiv bezeichnet hier Weisheit und wird in der deutschen Fassung trotz der stilistischen Wiederholung mit חכמה beibehalten.
- source_word: סופר
  choice: Schriftgelehrter
  rationale: Im Kontext Ben Siras ist nicht nur ein Schreiber gemeint, sondern ein gelehrter, mit Texten befasster Berufsstand. „Schriftgelehrter“ gibt diese soziale und intellektuelle Rolle im Deutschen klar wieder.
- source_word: תרבה
  choice: mehrt
  rationale: 'Die Hifil-Form hat einen kausativen Sinn: Die Weisheit des Schriftgelehrten lässt Weisheit zunehmen. „mehrt“ bewahrt diesen Gedanken knapp und würdevoll.'
- source_word: וחסר עסק
  choice: wer von Geschäften frei ist
  rationale: Wörtlich liegt die Vorstellung vor, dass es jemandem an Beschäftigung oder Geschäften fehlt. Die Formulierung bezeichnet hier verfügbaren Freiraum für das Weisheitsstudium, ohne Arbeitslosigkeit als solche zu behaupten.
- source_word: יתחכם
  choice: wird weise
  rationale: Die Hitpael-Form beschreibt hier das Erlangen beziehungsweise Wachsen in Weisheit; „wird weise“ ist direkt und idiomatisch.
