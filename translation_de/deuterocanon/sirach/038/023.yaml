translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die auffällige Wiederholung von „Weisheit“ gibt die hebräische Form bewusst wieder. „Von Geschäften frei“ bewahrt die Mehrdeutigkeit von עסק zwischen Beschäftigung, Arbeit und praktischen Angelegenheiten; die Fußnote weist zugleich transparent auf die erhebliche Abweichung des angegebenen griechischen Paralleltexts hin.
