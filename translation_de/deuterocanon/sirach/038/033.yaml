translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die Herz-Metapher des Griechischen bleibt erhalten; schwerfällige Nominalformulierungen werden zugunsten eines natürlichen deutschen Satzbaus verbal wiedergegeben. Die Unsicherheit bei χάρισμα wird nicht im Haupttext aufgelöst, sondern ausdrücklich in der Fußnote offengelegt.
