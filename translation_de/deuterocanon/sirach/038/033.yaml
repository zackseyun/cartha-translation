  text: He will apply his heart to complete the glaze[b][a], and his wakefulness is to cleanse the furnace.
translation:
  language: de
  text: Er setzt sein Herz daran, die Verzierung[a] zu vollenden, und seine Wachsamkeit gilt dem Reinigen des Brennofens[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Bedeutung von χάρισμα ist hier unsicher. Wörtlich bedeutet das Wort gewöhnlich „Gabe“; im Zusammenhang der Töpferarbeit kann es eine Verzierung, eine abschließende Ausgestaltung oder das vollendete Werkstück bezeichnen.
    reason: alternative_reading
  - marker: b
    text: 'Oder: „Ofen“. Das griechische Wort kann einen Ofen oder Brennofen bezeichnen; im Zusammenhang der Töpferei ist wohl ein Brennofen gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καρδίαν ἐπιδώσει
  choice: Er setzt sein Herz daran
  rationale: Die Wendung bewahrt das konkrete Bild des Herzens und drückt zugleich die entschlossene Hinwendung des Handwerkers zu seiner Aufgabe in natürlichem Deutsch aus.
- source_word: συντελέσαι
  choice: zu vollenden
  rationale: Das Verb bezeichnet das vollständige Zu-Ende-Bringen der Arbeit; „vollenden“ gibt diesen Zielaspekt knapp und würdig wieder.
- source_word: τὸ χάρισμα
  choice: die Glasur
  rationale: Die gewöhnliche Bedeutung „Gabe“ passt hier kaum. Im unmittelbaren Zusammenhang mit Töpferarbeit und Brennofen liegt eine abschließende Beschichtung oder Gestaltung des Gefäßes nahe; wegen der sprachlichen Unsicherheit wird dies in einer Fußnote kenntlich gemacht.
- source_word: ἡ ἀγρυπνία αὐτοῦ
  choice: bleibt wach
  rationale: Die verbale Wiedergabe klingt im Deutschen natürlicher als „sein Wachsein“ und bewahrt das Bild der wachen, anhaltenden Aufmerksamkeit.
- source_word: καθαρίσαι
  choice: zu reinigen
  rationale: „Reinigen“ entspricht dem handwerklichen Kontext und vermeidet einen hier nicht angezeigten kultischen Beiklang von „läutern“.
- source_word: κάμινον
  choice: den Brennofen
  rationale: Im Zusammenhang mit der Töpferei bezeichnet κάμινος am ehesten den Ofen zum Brennen der Gefäße; „Brennofen“ ist hier genauer und natürlicher als das allgemeinere „Ofen“.
