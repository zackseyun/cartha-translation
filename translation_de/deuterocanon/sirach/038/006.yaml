  source_fidelity: 'Der Text gibt ויתן לאנוש בינה להתפאר בגבורתו präzise wieder: die vergangene Gabe, den kollektiven menschlichen Empfänger, בינה als „Einsicht“ und גבורה als „Macht“. Der deutsche Plural „den Menschen … sie“ ist idiomatisch und wahrt den Kollektivsinn von אנוש. Die Konstruktion „damit sie sich seiner Macht rühmen“ bildet den Zweckinfinitiv angemessen nach. Der Gottesbezug des Suffixes ist im Kontext und durch die griechische Parallele gut begründet, während die Fußnote die grammatische Restmöglichkeit eines menschlichen Bezugs wahrt.'
