  text: And he gave man understanding[c][b][a], to glory in his might.
translation:
  language: de
  text: Und er gab den Menschen Einsicht, damit sie sich seiner Macht rühmen.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „damit sie sich seiner Machttaten rühmen“. Die griechische Parallele hat „seiner Wundertaten“ und versteht die Macht als in Gottes Werken sichtbar.'
    reason: alternative_reading
  - marker: b
    text: „Sich rühmen“ kann hier auch „sich brüsten“ bedeuten. Im Zusammenhang bezieht sich „seiner“ am ehesten auf Gott; grammatisch ist ein Bezug auf den Menschen jedoch nicht völlig ausgeschlossen.
    reason: theological_ambiguity
lexical_decisions:
- source_word: ויתן
  choice: Und er gab
  rationale: Die hebräische Erzählform bezeichnet hier eine in der Vergangenheit vollzogene Gabe; auch das griechische ἔδωκεν bestätigt diese Wiedergabe.
- source_word: לאנוש
  choice: den Menschen
  rationale: אֱנוֹשׁ bezeichnet den sterblichen Menschen und steht hier kollektiv für die Menschheit. Der griechische Plural ἀνθρώποις stützt die natürliche deutsche Wiedergabe im Plural.
- source_word: בינה
  choice: Einsicht
  rationale: בִּינָה bedeutet Einsicht, Verständnis oder Urteilsvermögen. „Einsicht“ ist knapp, würdig und passt zum Zusammenhang menschlicher Heilkunst.
- source_word: להתפאר
  choice: damit sie sich … rühmen
  rationale: Der Hitpael-Infinitiv kann „sich rühmen“, „sich brüsten“ oder in gehobenem Sinn „sich einer Sache rühmen“ bedeuten. Die Formulierung bewahrt diese Spannung, ohne sie zu bloßem Lobpreis umzudeuten.
- source_word: בגבורתו
  choice: seiner Macht
  rationale: גְּבוּרָה bezeichnet Macht, Stärke oder machtvolle Taten. „Macht“ gibt den hebräischen Singular unmittelbar wieder; die griechische Parallele deutet zugleich auf Gottes sichtbar gewordene Wundertaten.
theological_decisions:
- issue: Bezug des Suffixes in בגבורתו („seiner Macht“)
  choice: Das Pronomen wird im Haupttext auf Gott bezogen.
  alternative: Es könnte grammatisch auf den Menschen bezogen und als Rühmen eigener Stärke verstanden werden.
  rationale: Der Zusammenhang stellt Gott als Geber von Heilmitteln und Einsicht dar; zudem hat die griechische Parallele „seine Wundertaten“, was den Gottesbezug deutlich stützt. Da das Hebräische allein den Bezug nicht ausdrücklich bezeichnet, wird die Alternative in einer Fußnote bewahrt.
- issue: Sinn von להתפאר
  choice: „sich … rühmen“ bewahrt sowohl freudiges Rühmen als auch die mögliche Nuance des Sich-Brüstens.
  alternative: „preisen“ würde eindeutig Gotteslob ausdrücken; „sich brüsten“ würde die selbstbezogene Nuance verstärken.
  rationale: Die hebräische Reflexivform lässt eine semantische Spannung bestehen. Eine eindeutige Festlegung auf Lobpreis oder selbstgefälliges Prahlen wäre enger als die Quelle.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Der Plural „den Menschen … sie“ gibt den kollektiven Sinn natürlich wieder. Die reflexive Wendung „sich seiner Macht rühmen“ erhält die Mehrdeutigkeit des hebräischen Verbs und vermeidet eine konfessionell festgelegte Auslegung.
