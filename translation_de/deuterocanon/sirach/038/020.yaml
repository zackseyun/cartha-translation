  text: 'Remember his lot, for it is your lot: his yesterday, and your today.'
translation:
  language: de
  text: 'Denk an sein Los[a], denn es ist dein Los: Gestern traf es ihn, heute dich.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „seine Bestimmung“ beziehungsweise „seinen festgesetzten Anteil“. Das hebräische Wort חק kann eine Festsetzung, Satzung oder einen zugewiesenen Anteil bezeichnen; hier meint es wahrscheinlich das jedem Menschen bestimmte Geschick des Todes.'
    reason: lexical_alternative
  - marker: b
    text: 'Die griechische Parallelüberlieferung lautet abweichend: „Überlass dein Herz nicht der Trauer; weise sie von dir und denk an das Ende.“ Sie bestätigt den Bezug auf die Sterblichkeit, gibt den hebräischen Wortlaut aber nicht unmittelbar wieder.'
    reason: alternative_reading
lexical_decisions:
- source_word: זכור
  choice: Denk an
  rationale: Der Imperativ von זכר fordert zum bewussten Erinnern auf. „Denk an“ ist im modernen Deutschen natürlich und bewahrt den mahnenden Ton.
- source_word: חקו / חקך
  choice: sein Los / dein Los
  rationale: חק bezeichnet häufig eine Festsetzung oder einen bestimmten Anteil. Im Zusammenhang von Tod und Trauer ist „Los“ als zugewiesenes Geschick am verständlichsten; die Fußnote bewahrt die mögliche Nuance von „Bestimmung“ oder „festgesetztem Anteil“.
- source_word: לו אתמול ולך היום
  choice: Gestern traf es ihn, heute dich
  rationale: 'Das Hebräische ist elliptisch: wörtlich etwa „ihm gestern und dir heute“. Die knappe Ergänzung „traf es“ macht den Bezug auf das gemeinsame Los im Deutschen verständlich, ohne ausdrücklich „sterben“ einzutragen.'
theological_decisions:
- issue: Bedeutung von חק im Zusammenhang mit Tod und Trauer
  choice: Los als jedem Menschen zugewiesenes Geschick
  alternative: Bestimmung, Festsetzung oder festgesetzter Anteil
  rationale: Der Kontext handelt von Sterblichkeit, nicht von einer gesetzlichen Satzung. „Los“ gibt das gemeinsame, zugewiesene Geschick wieder, ohne eine besondere dogmatische Deutung einzuführen.
- issue: Deutung der elliptischen Schlusszeile
  choice: Die Ellipse knapp mit „traf es“ verdeutlichen
  alternative: 'Wörtlich: „ihm gestern und dir heute“'
  rationale: Die Ergänzung bezieht sich grammatisch auf „Los“ und erhält die dichterische Kürze. Sie vermeidet die stärkere Auslegung „Er starb gestern, du stirbst heute“.
- issue: Verhältnis zur abweichenden griechischen Parallelüberlieferung
  choice: Den gut bezeugten hebräischen Text übersetzen und die griechische Lesart in einer Fußnote nennen
  alternative: 'Der griechischen Form folgen: das Herz nicht der Trauer überlassen und an das Ende denken'
  rationale: Die angegebene hebräische Quelle ist sicher bezeugt und Grundlage der Übersetzung; die deutlich abweichende griechische Überlieferung ist dennoch textgeschichtlich und für den Sterblichkeitsbezug relevant.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Gegenüberstellung des Hebräischen bleibt erhalten; „traf es“ verdeutlicht lediglich die im Original vorausgesetzte Beziehung zum Los.
