  text: You who fear Yahweh[a], hope for good[b], and for everlasting joy and mercy.
translation:
  language: de
  text: Ihr, die ihr Jahwe fürchtet, hofft auf Gutes[a], auf ewige Freude und auf Erbarmen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Text hat den Plural: „auf gute Dinge“.'
    reason: alternative_reading
  - marker: b
    text: Das hebräische Wort kann auch mit „Güte“, „beständiger Liebe“ oder „Freundlichkeit“ wiedergegeben werden; der griechische Paralleltext hat ebenfalls „Erbarmen“.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְאֵי יְהֹוָה
  choice: Ihr, die ihr Jahwe fürchtet
  rationale: Die hebräische partizipiale Wendung steht als direkte Anrede im Plural. Diese Form bewahrt den mahnenden Charakter und gibt den Gottesnamen ausdrücklich als „Jahwe“ wieder.
- source_word: קַוּוּ
  choice: hofft
  rationale: Der Imperativ bezeichnet erwartungsvolles Sich-Ausrichten. „Hofft“ entspricht sowohl dem Hebräischen als auch dem griechischen ἐλπίσατε und klingt im Deutschen natürlich.
- source_word: לְטוֹב
  choice: auf Gutes
  rationale: Der hebräische Singular bezeichnet allgemein das Gute beziehungsweise Gutes, ohne einzelne Wohltaten festzulegen. Die Präposition „auf“ ist im Deutschen durch das Verb „hoffen“ gefordert.
- source_word: וּלְשִׁמְחַת עוֹלָם
  choice: auf ewige Freude
  rationale: „Ewige Freude“ gibt die dauerhafte Dimension von עוֹלָם knapp und idiomatisch wieder und stimmt sachlich mit dem griechischen Paralleltext überein.
- source_word: וָחֶסֶד
  choice: und auf Erbarmen
  rationale: חֶסֶד kann Erbarmen, Güte oder beständige Liebe bezeichnen. „Erbarmen“ passt zum griechischen ἐλέους, ohne die im Hebräischen vorhandene Bedeutungsbreite dogmatisch zu verengen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Die ausdrückliche Wiedergabe als „Jahwe“ folgt dem Projektstandard und bewahrt den Gottesnamen, während der griechische Paralleltext ehrfürchtig Κύριον („Herr“) verwendet.
- issue: Verhältnis des hebräischen Textes zum griechischen Paralleltext
  choice: Der erhaltene hebräische Text ist die primäre Grundlage; der griechische Text dient zur Kontrolle.
  alternative: Übersetzung allein nach dem griechischen Text, einschließlich des Plurals „gute Dinge“
  rationale: Der hebräische Vers ist erhalten und inhaltlich stabil, während der griechische Paralleltext den Gesamtsinn bestätigt. Die Abweichung zwischen hebräischem Singular und griechischem Plural wird nicht eingeebnet, sondern in einer Fußnote ausgewiesen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Anrede und der Imperativ erhalten den eindringlichen Weisheitston. Die dreimalige Präposition „auf“ macht die Zuordnung zum Verb „hoffen“ klar und sorgt trotz der Reihung für einen natürlichen deutschen Satz.
