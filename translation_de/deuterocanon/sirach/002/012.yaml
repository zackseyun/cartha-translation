  text: Woe to the faint of heart and the slack hands[a], and to the sinner of crooked ways.
translation:
  language: de
  text: Wehe den verzagten Herzen und den kraftlosen Händen und dem Sünder, der krumme Wege geht.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das Hebräische lässt sich wörtlich etwa wiedergeben: »dem Frevler/Sünder, der in seinen Wegen krumm oder verkehrt ist«. Die griechische Parallelüberlieferung hat dagegen: »dem Sünder, der auf zwei Pfaden geht«; dies kann schwankendes oder doppelzüngiges Verhalten bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: אוֹי
  choice: Wehe
  rationale: Bewahrt den kräftigen Ton einer Klage- und Warnformel, wie er in prophetischer und weisheitlicher Sprache üblich ist.
- source_word: לְרַכֵּי לֵב
  choice: den verzagten Herzen
  rationale: Die hebräische Wendung bezeichnet negativ verstandene Weichheit oder Mutlosigkeit des Herzens; das griechische δειλαῖς καρδίαις bestätigt den Sinn von Ängstlichkeit oder Verzagtheit.
- source_word: וּרְפֵה יָדָיִם
  choice: und den kraftlosen Händen
  rationale: Die konkrete Körpermetapher für mangelnde Kraft und Entschlossenheit bleibt erhalten; auch das griechische παρειμέναις bezeichnet erschlaffte oder gelähmte Hände.
- source_word: וְלָרָשָׁע
  choice: und dem Sünder
  rationale: רשע kann »Frevler« oder »Gottloser« bedeuten; »Sünder« wird durch das griechische ἁμαρτωλῷ gestützt und ist im Zusammenhang klar und allgemein verständlich.
- source_word: עִקֵּשׁ דְּרָכַיִם
  choice: auf krummen Wegen
  rationale: Die Formulierung bildet das hebräische Bild von verdrehten oder verkehrten Wegen natürlich ab, ohne die textlich abweichende griechische Lesart vorschnell zum Haupttext zu machen.
theological_decisions:
- issue: Schwieriger hebräischer Schluss gegenüber der abweichenden griechischen Parallelüberlieferung
  choice: Im Haupttext steht »dem Sünder auf krummen Wegen« nach dem erhaltenen Hebräisch.
  alternative: »dem Sünder, der auf zwei Pfaden geht« nach dem Griechischen
  rationale: Der hebräische Text ist knapp, aber verständlich und spricht von krummen beziehungsweise verkehrten Wegen. Die griechische Fassung deutet möglicherweise auf geteiltes oder doppelzüngiges Verhalten. Da beide Überlieferungen eine verwandte, aber nicht identische Aussage bieten, wird die hebräische Lesart im Haupttext bewahrt und die griechische Alternative in der Fußnote offengelegt.
translation_notes:
  register: Moderne, würdige Weisheitssprache. Die parallelen Körperbilder »Herzen« und »Hände« bleiben erhalten; »verzagt« und »kraftlos« sind gegenwärtig verständlich, ohne den mahnenden Ton abzuschwächen.
