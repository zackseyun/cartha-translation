base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/002/008.yaml
  text: You who fear Yahweh[a], trust in him, and your reward will not be delayed.
translation:
  language: de
  text: Ihr, die ihr Jahwe fürchtet, vertraut auf ihn; er wird euren Lohn nicht über Nacht zurückhalten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Er wird euren Lohn nicht über Nacht bleiben lassen.“ Die griechische Parallele lautet dagegen: „Ihr werdet euren Lohn gewiss nicht verlieren.“'
    reason: Die Fußnote dokumentiert die ungewöhnliche hebräische Wendung und die abweichende Formulierung der griechischen Überlieferung.
lexical_decisions:
- source_word: יִרְאֵי יְהֹוָה
  choice: Ihr, die ihr Jahwe fürchtet
  rationale: Die partizipiale Wendung steht im Zusammenhang als direkte Anrede an eine Mehrzahl. Die deutsche Form bewahrt sowohl die Anrede als auch den Gottesnamen.
- source_word: הַאֲמִינוּ בּוֹ
  choice: vertraut auf ihn
  rationale: אמן mit ב bezeichnet hier ein sich stützendes Vertrauen, nicht nur ein intellektuelles Fürwahrhalten. Der Pluralimperativ wird ausdrücklich wiedergegeben.
- source_word: וְהוּא לֹא יָלִין
  choice: er wird … nicht über Nacht zurückhalten
  rationale: Das hebräische Subjekt וְהוּא bleibt erhalten. לין bezeichnet grundsätzlich das Übernachten beziehungsweise Verbleiben über Nacht; in der kausativen Form mit ‚Lohn‘ ergibt sich das Bild, dass Gott den Lohn nicht über Nacht zurückbehält.
- source_word: שְׂכַרְכֶם
  choice: euren Lohn
  rationale: שכר kann Lohn oder Belohnung bedeuten. ‚Lohn‘ lässt das hebräische Bild des nicht über Nacht zurückgehaltenen Entgelts klar hervortreten und passt zugleich zur Weisheitslehre über göttliche Vergeltung.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהֹוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. ‚Jahwe‘ gibt den persönlichen Gottesnamen wieder, ohne ihn durch einen Titel zu ersetzen.
- issue: Deutung der Schlussaussage
  choice: er wird euren Lohn nicht über Nacht zurückhalten
  alternative: ihr werdet euren Lohn gewiss nicht verlieren
  rationale: Die Hauptfassung folgt der konkreten hebräischen Ausdrucksweise und erhält Gott als grammatisches Subjekt. Die abweichende griechische Parallele wird in einer Fußnote genannt, damit die Spannung zwischen den Textzeugen nicht eingeebnet wird.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit direkter Anrede. Das Semikolon gliedert Aufforderung und Zusage. Die anschauliche hebräische Rede vom Zurückhalten über Nacht bleibt im Haupttext erhalten.
