  source_fidelity: 'Die Übersetzung folgt dem hebräischen Text eng: Die pluralische Anrede der Gottesfürchtigen und der Imperativ „vertraut auf ihn“ sind sachgerecht wiedergegeben. „Er wird euren Lohn nicht über Nacht zurückhalten“ gibt וְהוּא לֹא יָלִין שְׂכַרְכֶם als Aussage mit Gott als explizitem Subjekt wieder und bewahrt das Bild des nicht über Nacht einbehaltenen Lohns. Damit wird die klarere, aber anders konstruierte griechische Parallele nicht unzulässig in den Haupttext eingetragen.'
  naturalness: Das Deutsch ist modernes, würdiges Standarddeutsch. „Ihr, die ihr Jahwe fürchtet“ ist als direkte Anrede klar; „Lohn nicht über Nacht zurückhalten“ ist idiomatisch genug und macht das zugrunde liegende Bild verständlich. Das Semikolon gliedert Ermahnung und Zusage sinnvoll.
  terminology: „Jahwe“ gibt das Tetragramm angemessen wieder. „Vertraut auf ihn“ trifft die Bedeutung von אמן mit ב. „Lohn“ ist für שכר hier treffend und unterstützt zugleich die Bildsprache des Zurückhaltens. Die Fußnote unterscheidet sauber zwischen der wörtlichen hebräischen Formulierung und der abweichenden griechischen Parallele.
