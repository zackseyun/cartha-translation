base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/002/015.yaml
  text: Those who fear Yahweh will not rebel against his ways[a], and those who love him will keep his paths.
translation:
  language: de
  text: Diejenigen, die Jahwe fürchten, werden sich nicht gegen seine Wege auflehnen[a], und diejenigen, die ihn lieben, werden seine Pfade bewahren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Parallelüberlieferung lautet: „werden seinen Worten nicht ungehorsam sein“ statt des hebräischen „werden sich nicht gegen seine Wege auflehnen“. Hier wird dem hebräischen Text aus der Kairoer Geniza gefolgt; beide Fassungen beschreiben insgesamt treuen Gehorsam.'
    reason: alternative_reading
lexical_decisions:
- source_word: יִרְאֵי יְהֹוָה
  choice: Die Jahwe fürchten
  rationale: Die substantivisch gebrauchte Partizipialfügung bezeichnet Menschen, die durch die Furcht Jahwes geprägt sind. „Fürchten“ bewahrt den kräftigen Sprachgebrauch der Weisheitstradition; „Jahwe“ gibt den Gottesnamen יְהֹוָה als Eigennamen wieder.
- source_word: לֹא יַמְרוּ
  choice: werden sich nicht … auflehnen
  rationale: מרה bezeichnet häufig widersetzliches oder rebellisches Verhalten und ist stärker als ein bloßes Nichtbefolgen. Die futurische Formulierung gibt den hebräischen Imperfekt in diesem weisheitlichen Aussagesatz natürlich wieder.
- source_word: בִּדְרָכָיו
  choice: gegen seine Wege
  rationale: Die Präposition ב bezeichnet hier in Verbindung mit מרה wahrscheinlich das Ziel des Widerstands. „Gegen seine Wege“ macht dieses Verhältnis im Deutschen ausdrücklich.
- source_word: וְאוֹהֲבָיו
  choice: die ihn lieben
  rationale: Das Partizip mit Objektsuffix bezeichnet die Menschen, die Gott lieben. Die gewählte Form ist idiomatisch und bewahrt den persönlichen Bezug.
- source_word: יִצְרוּ
  choice: werden … bewahren
  rationale: נצר kann „bewahren“, „hüten“ oder „einhalten“ bedeuten. „Bewahren“ erhält sowohl den Gedanken treuer Befolgung als auch den des sorgfältigen Hütens.
- source_word: אָרְחוֹתָיו
  choice: seine Pfade
  rationale: „Pfade“ bildet die Wegmetaphorik ab und bewahrt zugleich die poetische Variation gegenüber דְּרָכָיו, „Wege“, im ersten Halbvers.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהֹוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Tetragrammaton als Gottesnamen. Die Form „Jahwe“ gibt ihn im modernen Standarddeutsch als Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Stärke von מרה
  choice: sich gegen seine Wege auflehnen
  alternative: seinen Worten nicht gehorchen
  rationale: Die Übersetzung folgt vorrangig dem hebräischen Zeugen und bewahrt dessen stärkere Sprache von Widerstand beziehungsweise Auflehnung. Die griechische Parallele bietet eine mildere Gehorsamsformulierung und nennt „Worte“ statt „Wege“.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer poetischer Parallelität. Die Pluralformen und das Futur des hebräischen Aussagesatzes bleiben erhalten; „Wege/Pfade“ bildet die lexikalische Variation der beiden Halbverse ab.
