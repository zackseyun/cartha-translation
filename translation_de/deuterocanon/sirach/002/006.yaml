  text: Trust in him[a], and he will uphold you; make your ways straight[b], and hope in him.
translation:
  language: de
  text: Vertraue ihm[a], und er wird dich stützen. Richte deine Wege gerade aus[b] und hoffe auf ihn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Glaube ihm“ oder „Setze dein Vertrauen auf ihn“. Das Hebräische und das Griechische bezeichnen vertrauendes Sichverlassen, nicht nur gedankliche Zustimmung.'
    reason: lexical_alternative
  - marker: b
    text: 'Der mittlere Satz ist im Hebräischen und Griechischen als Aufforderung formuliert: „Richte deine Wege gerade aus.“ Manche Übersetzungen verstehen ihn dagegen als Verheißung: „Er wird deine Wege gerade machen/lenken.“'
    reason: alternative_reading
lexical_decisions:
- source_word: הַאֲמֵן בּוֹ / πίστευσον αὐτῷ
  choice: Vertraue ihm
  rationale: Der hebräische Hifil-Imperativ von אמן und das griechische πίστευσον bezeichnen hier vertrauendes Sichverlassen, nicht bloß gedankliche Zustimmung. „Vertraue ihm“ ist im modernen Deutsch natürlich und wahrt den Aufforderungscharakter.
- source_word: יַחֲזִיק בְּךָ / ἀντιλήμψεται σου
  choice: er wird dich stützen
  rationale: Hebräisch החזיק ב und griechisch ἀντιλαμβάνομαι vermitteln das Bild, jemanden ergreifend zu unterstützen oder ihm Halt zu geben. „Stützen“ bewahrt dieses Bild und klingt gegenwärtig und klar.
- source_word: יַשֵּׁר אָרְחוֹתֶיךָ / εὐθύνας τὰς ὁδούς σου
  choice: Richte deine Wege gerade
  rationale: Die hebräische und die griechische Form sind am besten als Imperativ an den Angeredeten zu verstehen. Die Formulierung erhält sowohl das Gerademachen als auch das weisheitliche Wegbild.
- source_word: אָרְחוֹתֶיךָ / ὁδούς σου
  choice: deine Wege
  rationale: Beide Ausdrücke bezeichnen bildlich die Lebensführung. „Wege“ ist im Deutschen verständlich und bewahrt die Metapher ohne erklärende Erweiterung.
- source_word: וְקַוֵּה אֵלָיו / καὶ ἔλπισον ἐπʼ αὐτόν
  choice: und hoffe auf ihn
  rationale: Hebräisch קוה kann sowohl Hoffen als auch erwartendes Warten ausdrücken; das griechische ἐλπίζω stützt hier besonders den Sinn „hoffen“. „Auf ihn hoffen“ ist die natürliche deutsche Verbindung.
theological_decisions:
- issue: Subjekt und Aussageweise des mittleren Satzglieds
  choice: 'Aufforderung an den Angeredeten: „Richte deine Wege gerade.“'
  alternative: 'Verheißung mit Gott als Subjekt: „Er wird deine Wege gerade machen/lenken.“'
  rationale: Die Formen יַשֵּׁר und εὐθύνας stehen innerhalb einer Reihe von Aufforderungen und sind morphologisch als Imperative zu lesen. Die Übersetzung folgt diesem Befund, weist jedoch auf die abweichende traditionelle Deutung hin.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knappen Imperativen und dem bewahrten weisheitlichen Bild der „Wege“. „Stützen“ ist verständlicher und gegenwärtiger als das gehobenere „aufrechterhalten“; „hoffe auf ihn“ bleibt bewusst schlicht.
