translation:
  language: de
  text: Nimm alles an, was über dich kommt, und bleib geduldig, wenn du zerbrochen wirst.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: »in deinem Zerbruch« oder »wenn du zerbrochen wirst«; die griechische Parallelüberlieferung lautet: »in den Wechselfällen deiner Erniedrigung«.'
    reason: Abweichende Überlieferung und mögliche wörtlichere Wiedergabe des Hebräischen.
lexical_decisions:
- source_word: כָּל הַבָּא עָלֶיךָ
  choice: alles, was über dich kommt
  rationale: Die Wendung bedeutet wörtlich »alles, was über dich kommt«. Die gewählte Formulierung ist im Deutschen natürlich und bewahrt den umfassenden, offenen Sinn.
- source_word: קַבֵּל
  choice: nimm … an
  rationale: Der Imperativ fordert dazu auf, das Widerfahrende anzunehmen. »Nimm an« ist hier idiomatischer als das ebenfalls mögliche »empfange«; »heiße willkommen« wäre zu positiv.
- source_word: וּבְשִׁבְרְךָ
  choice: wenn du zerbrochen wirst
  rationale: Das hebräische שבר bezeichnet Brechen, Zerbruch oder Zusammenbruch. Die verbale deutsche Fassung gibt das Bild verständlich wieder, ohne es auf bloße Traurigkeit oder allgemein auf Not zu reduzieren. Die abweichende griechische Überlieferung wird in der Fußnote dokumentiert.
- source_word: הַאֲרֵךְ רוּחַ
  choice: bleib geduldig
  rationale: Die hebräische Redewendung bedeutet wörtlich etwa »mache den Geist lang« und bezeichnet geduldiges, langmütiges Ausharren. »Bleib geduldig« ist klares, modernes Deutsch; das griechische μακροθύμησον bestätigt diesen Sinn.
theological_decisions:
- issue: Verhältnis des erhaltenen hebräischen Wortlauts zur abweichenden griechischen Parallelüberlieferung
  choice: Der Haupttext folgt dem hebräischen Bild des Zerbrochenwerdens.
  alternative: »und harre geduldig aus, während deine Erniedrigung wechselnde Formen annimmt« beziehungsweise »in den Wechselfällen deiner Erniedrigung«
  rationale: Da ein hebräischer Text vorliegt, hat er für den Haupttext Vorrang. Das Griechische bezeugt jedoch eine deutlich andere beziehungsweise erweiterte Formulierung und wird deshalb nicht stillschweigend in den Haupttext eingemischt, sondern transparent in einer Fußnote angegeben. So bleiben Quellenlage und Spannung zwischen den Zeugen sichtbar.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, knappem Mahnton. Das konkrete hebräische Bild des Zerbrechens bleibt erhalten; eine konfessionelle oder psychologisierende Deutung wird vermieden.
