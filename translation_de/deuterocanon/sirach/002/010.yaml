base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/002/010.yaml
  text: 'Look to the generations of old and see: who believed in Yahweh and was put to shame? Or who trusted in him and was abandoned? Or who called on him and was not answered?[a][b]'
translation:
  language: de
  text: 'Blickt auf die früheren Generationen: Wer glaubte an Jahwe und wurde beschämt? Oder wer vertraute auf ihn und wurde verlassen? Oder wer rief zu ihm und erhielt keine Antwort?[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Griechisch: „Wer blieb in seiner Furcht und wurde verlassen?“ Der erhaltene hebräische Text lautet dagegen: „Wer vertraute auf ihn und wurde verlassen?“'
    reason: alternative_reading
  - marker: b
    text: 'Griechisch: „Wer rief ihn an, und er übersah ihn?“ Der hebräische Text lautet: „Wer rief zu ihm und erhielt keine Antwort?“'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבִּיטוּ לְדוֹרוֹת רִאשׂוֹנִים
  choice: Blickt auf die früheren Generationen
  rationale: Der pluralische Imperativ fordert dazu auf, frühere Generationen als geschichtliche Zeugen zu betrachten. „Frühere Generationen“ ist natürlich und bewahrt den zeitlichen Bezug von רִאשׂוֹנִים.
- source_word: הֶאֱמִין בַּיהֹוָה
  choice: glaubte an Jahwe
  rationale: „Glaubte an“ gibt אמן wieder und hält die Wortwahl bewusst von בָּטַח „vertraute“ im nächsten Satzglied verschieden. Der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
- source_word: וַיֵּבוֹשׁ
  choice: wurde beschämt
  rationale: Die resultative Passivform bringt zum Ausdruck, dass sich das Vertrauen als beschämend erwiesen hätte; sie stimmt auch mit dem griechischen κατῃσχύνθη überein.
- source_word: בָּטַח בּוֹ
  choice: vertraute auf ihn
  rationale: בטח bezeichnet verlässliches Sich-Stützen auf jemanden. „Auf ihn vertrauen“ ist im modernen Deutschen idiomatisch.
- source_word: וְנֶעֱזַב
  choice: wurde verlassen
  rationale: Die passive Form von עזב bezeichnet, ohne Beistand zurückgelassen zu werden. „Verlassen“ ist direkt und würdevoll.
- source_word: קָרָא אֵלָיו
  choice: rief zu ihm
  rationale: Die Wendung bezeichnet einen an Gott gerichteten Hilferuf oder ein Gebet. „Zu ihm rufen“ bewahrt die Richtung des hebräischen אֵלָיו.
- source_word: וְלֹא נֶעֱנָה
  choice: erhielt keine Antwort
  rationale: Die passive Form bedeutet wörtlich „wurde nicht erhört/beantwortet“. Die gewählte Formulierung ist natürlich und vermeidet die zusätzliche religiöse Nuance, die „nicht erhört“ im Deutschen haben kann.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. „Jahwe“ gibt den Eigennamen wieder, ohne ihn durch einen Titel zu ersetzen.
- issue: Abweichungen zwischen hebräischem und griechischem Textzeugen
  choice: Der Haupttext folgt dem erhaltenen hebräischen Text; die griechischen Lesarten stehen in Fußnoten.
  alternative: Die griechischen Lesarten in den Haupttext übernehmen.
  rationale: Der hebräische Wortlaut ist hier mit hoher Sicherheit bezeugt und daher vorrangig. Die sachlich bedeutsamen griechischen Abweichungen werden jedoch nicht verschwiegen.
- issue: Unterscheidung von אמן und בטח
  choice: „glaubte“ und „vertraute“
  alternative: Beide Verben mit „vertraute“ wiedergeben.
  rationale: Die unterschiedliche Wortwahl des Hebräischen bleibt sichtbar, ohne einen unnatürlichen deutschen Satz zu erzeugen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Weisheitston. Die drei rhetorischen Fragen und der hebräische Parallelismus bleiben erhalten; unnötig altertümliche Ausdrücke werden vermieden.
