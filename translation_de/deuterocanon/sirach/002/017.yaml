  text: Those who fear Yahweh will prepare their hearts[a], and before him they will humble their spirits.
translation:
  language: de
  text: Diejenigen, die Jahwe fürchten, werden ihre Herzen vorbereiten, und vor ihm werden sie ihren Geist demütigen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Parallele lautet: „Sie werden ihre Seelen demütigen.“ Der hebräische Text liest „ihren Geist“; dieser Lesart folgt der Haupttext.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְאֵי יְהֹוָה
  choice: die Jahwe fürchten
  rationale: Die substantivierte Wendung bezeichnet Menschen, die durch die Furcht vor Jahwe geprägt sind. „Jahwe fürchten“ bewahrt den geläufigen biblischen Ausdruck, ohne ihn zu „verehren“ abzuschwächen.
- source_word: יָכִינוּ לְבָבָם
  choice: werden ihr Herz bereit machen
  rationale: Das Hifil von כון kann „bereit machen“, „vorbereiten“ oder „festigen“ bedeuten. „Das Herz bereit machen“ ist im Deutschen natürlich, bewahrt die ethische Ausrichtung und entspricht auch dem griechischen ἑτοιμάσουσιν.
- source_word: לְבָבָם
  choice: ihr Herz
  rationale: לֵבָב meint den inneren Menschen einschließlich Denken und Wollen. „Herz“ erhält die biblische Metapher; der hebräische Singular mit pluralischem Besitzer wird im Deutschen idiomatisch als „ihr Herz“ wiedergegeben.
- source_word: וּלְפָנָיו
  choice: vor ihm
  rationale: Dies entspricht unmittelbar der hebräischen Orts- und Beziehungsformel und bezeichnet hier die Haltung in Gottes Gegenwart.
- source_word: יַכְנִיעוּ רוּחָם
  choice: werden sie ihren Geist demütigen
  rationale: Der hebräische Text nennt ausdrücklich רוּחַ, „Geist“. Die relativ formnahe Wiedergabe erhält diesen anthropologischen Begriff und die bewusste Selbsterniedrigung, statt die Wendung zu „sich demütigen“ einzuebnen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהֹוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält das Tetragramm. „Jahwe“ gibt den persönlichen Bundesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Anthropologischer Begriff in יַכְנִיעוּ רוּחָם
  choice: ihren Geist demütigen
  alternative: ihre Seele demütigen
  rationale: Der maßgebliche hebräische Zeuge liest „ihren Geist“, während die griechische Parallele „ihre Seelen“ bietet. Der Haupttext folgt dem Hebräischen; die abweichende griechische Lesart wird in einer Fußnote dokumentiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter biblischer Bildsprache. Der Satzbau folgt der hebräischen Parallelstruktur, bleibt aber für heutige Leser verständlich.
