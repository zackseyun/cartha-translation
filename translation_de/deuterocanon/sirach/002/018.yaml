base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/002/018.yaml
  text: Let us fall into the hand of Yahweh[a], and not into the hand of man, for as his greatness is[b], so also is his mercy.
translation:
  language: de
  text: Lasst uns in die Hand Jahwes[a] fallen und nicht in die Hand eines Menschen; denn wie groß er ist, so groß ist auch sein Erbarmen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der griechische Text hat in beiden Satzgliedern den Plural „Hände“ („in die Hände des Herrn … nicht in die Hände von Menschen“); der hebräische Text liest jeweils „Hand“ im Singular.
    reason: textual_variant
  - marker: b
    text: 'Oder: „seine beständige Liebe“ beziehungsweise „seine Güte“. Das hebräische Wort חֶסֶד bezeichnet gnädige, loyale Zuwendung; der griechische Text hat „Erbarmen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נִפֹּל
  choice: Lasst uns … fallen
  rationale: Der hebräische Kohortativ der 1. Person Plural drückt eine gemeinsame Aufforderung aus. Die konkrete Bildsprache von נפל bleibt erhalten.
- source_word: בְּיַד
  choice: in die Hand
  rationale: Der hebräische Hauptzeuge hat in beiden Satzgliedern den Singular. Die Formulierung wahrt das Bild, dass man in jemandes Gewalt gerät.
- source_word: יְהֹוָה
  choice: Jahwes
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben; der Genitiv fügt sich natürlich in die Wendung „in die Hand Jahwes“ ein.
- source_word: אָדָם
  choice: eines Menschen
  rationale: אָדָם bezeichnet hier im Gegensatz zu Gott einen Menschen allgemein. Der unbestimmte Singular erhält den rhetorischen Gegensatz, ohne ausschließlich einen Mann zu bezeichnen.
- source_word: כְּגָדְלוֹ כֵּן
  choice: wie groß er ist, so groß
  rationale: Die korrelative Struktur כ…כן wird in natürlichem Deutsch mit „wie … so“ bewahrt. Die adjektivische Fassung vermeidet das schwerfällige „wie seine Größe“.
- source_word: חַסְדּוֹ
  choice: sein Erbarmen
  rationale: חסד kann loyale Güte, beständige Liebe oder Barmherzigkeit bezeichnen. Im Zusammenhang des Fallens in Gottes Hand hebt „Erbarmen“ seine gnädige Zuwendung hervor und entspricht dem griechischen ἔλεος.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. „Jahwe“ gibt den persönlichen Gottesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutungsumfang von חסד
  choice: Erbarmen
  alternative: beständige Liebe / Güte
  rationale: Der unmittelbare Kontext stellt Gottes Größe seiner rettenden und gnädigen Zuwendung gegenüber. „Erbarmen“ ist daher kontextuell passend, während eine Fußnote die echte lexikalische Breite offenhält.
- issue: Generischer Singular אדם
  choice: eines Menschen
  alternative: der Menschen / eines Mannes
  rationale: Gemeint ist menschliche Gewalt im Gegensatz zu Gottes Hand, nicht ausdrücklich eine männliche Person. Der Singular des hebräischen Hauptzeugen bleibt erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die gemeinsame Aufforderung und die hebräische Bildsprache bleiben erhalten; der parallele Vergleich wird idiomatisch formuliert. Sämtliche Fußnotenmarker stehen im Haupttext.
