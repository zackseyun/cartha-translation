  text: For gold is tested in fire[a], and men who are accepted, in the furnace of affliction.
translation:
  language: de
  text: Denn Gold wird im Feuer geprüft und Menschen, die Anerkennung finden, im Schmelzofen der Bedrängnis.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die zweite Vershälfte ist im Hebräischen schwer verständlich. Der griechische Paralleltext lautet: „angenommene Menschen im Ofen der Erniedrigung“. Die Übersetzung folgt diesem Sinn, bleibt aber an den erhaltenen hebräischen Wortlaut gebunden.'
    reason: alternative_reading
lexical_decisions:
- source_word: יִבָּחֵן
  choice: wird geprüft
  rationale: Das Verb בחן bezeichnet das Prüfen oder Erproben. „Wird geprüft“ gibt den Vorgang klar wieder, ohne wie „wird geläutert“ bereits ein Ergebnis vorauszusetzen.
- source_word: זָהָב
  choice: Gold
  rationale: Direkte und eindeutige Entsprechung.
- source_word: בְּנֵי אָדָם
  choice: Menschen
  rationale: Die hebräische Wendung bedeutet allgemein Menschen. Das moderne generische „Menschen“ ist natürlich und schließt den gesamten Bezugskreis ein.
- source_word: בְּכוּר
  choice: die Annahme finden
  rationale: Die überlieferte hebräische Form ist im Zusammenhang schwierig. Die griechische Parallele δεκτοί stützt den Sinn „angenommen/annehmbar“. „Die Annahme finden“ bewahrt diesen Sinn, lässt aber offen, von wem die Menschen angenommen werden.
- source_word: עֹנִי
  choice: Bedrängnis
  rationale: עֹנִי kann Not, Elend, Erniedrigung oder Bedrängnis bezeichnen. „Bedrängnis“ passt zum Bild der Prüfung und wahrt die weitere hebräische Bedeutungsbreite.
- source_word: καμίνῳ
  choice: Schmelzofen
  rationale: Der griechische Paralleltext nennt ausdrücklich den Ofen. „Schmelzofen“ führt das Bild der Goldprüfung idiomatisch fort; im überlieferten hebräischen Wortlaut ist das entsprechende Substantiv nicht ausdrücklich vorhanden.
theological_decisions:
- issue: Klärung der schwierigen zweiten Vershälfte mithilfe des griechischen Paralleltextes
  choice: Die zweite Hälfte spricht von Menschen, die Annahme finden und in Bedrängnis geprüft werden.
  alternative: 'Mechanisch: „und Menschen in der Glut/Probe der Bedrängnis“; oder בְּכוּר als „Erstgeborene“ beziehungsweise „Auserwählte“ wiedergeben.'
  rationale: Der erhaltene hebräische Wortlaut ist an dieser Stelle kontextuell schwierig. Die griechische Überlieferung bietet mit „angenommene/annehmbare Menschen im Ofen der Erniedrigung“ einen stabilen parallelen Sinn. Die Übersetzung nutzt diesen Zeugen zur Klärung, ohne den annehmenden Akteur ausdrücklich mit Gott gleichzusetzen oder Erwählungssprache einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die elliptische Fortführung von „wird geprüft“ wahrt den knappen Parallelismus des Weisheitsspruchs. „Die Annahme finden“ klingt natürlicher als „angenommen sind“ und vermeidet es, den im Text nicht genannten Handelnden zu bestimmen.
