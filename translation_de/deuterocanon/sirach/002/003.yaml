  text: Cling to him and do not turn away[a], so that you may be exalted in your latter end.
translation:
  language: de
  text: Halte dich an ihn und wende dich nicht ab, damit du am Ende groß wirst.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: damit du zuletzt zunimmst / erhöht wirst. Das hebräische Wort bedeutet „groß werden“; der griechische Paralleltext hat „vermehrt werden“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִדָּבֵק בּוֹ
  choice: Halte dich an ihn
  rationale: Das Verb דבק bezeichnet ein festes Sich-Anschließen oder Haften. „Halte dich an ihn“ ist im heutigen Deutsch natürlich und bewahrt den Gedanken treuer, beständiger Verbundenheit; das Pronomen bezieht sich im Kontext auf Gott.
- source_word: וְאַל תָּסוּר
  choice: und wende dich nicht ab
  rationale: סור kann „abweichen“, „sich entfernen“ oder „sich abwenden“ bedeuten. Die gewählte Formulierung gibt sowohl die räumliche als auch die relationale Bedeutung wieder und entspricht dem griechischen μὴ ἀποστῇς.
- source_word: לְמַעַן
  choice: damit
  rationale: לְמַעַן leitet hier einen Zweck beziehungsweise eine erwartete Folge ein. „Damit“ ist knapp und idiomatisch.
- source_word: תִּגְדַּל
  choice: du … groß wirst
  rationale: גדל bedeutet grundlegend „groß werden“, kann aber auch Zunahme, Bedeutung oder Erhöhung bezeichnen. Die direkte Wiedergabe vermeidet es, die Art der verheißenen Größe vorschnell festzulegen.
- source_word: בְּאַחֲרִיתֶךָ
  choice: am Ende
  rationale: אַחֲרִית bezeichnet das spätere Ende, die Zukunft oder den endgültigen Ausgang eines Lebenswegs. „Am Ende“ bewahrt die für Weisheitsliteratur typische Offenheit zwischen Lebensende und letztlichem Ausgang.
theological_decisions:
- issue: Bezug des Pronomens בּוֹ („an ihn“)
  choice: Das Pronomen wird personal wiedergegeben und auf Gott bezogen.
  alternative: Bezug auf Weisheit oder Unterweisung
  rationale: Im unmittelbaren Zusammenhang gilt die Aufforderung dem Vertrauen auf den Herrn; weder der hebräische noch der griechische Text führt einen neuen Bezugsgegenstand ein.
- issue: Art der Verheißung im Schlusssatz
  choice: „groß wirst“ lässt offen, ob Zunahme, Ansehen oder Erhöhung gemeint ist.
  alternative: „erhöht wirst“ als ausdrückliche Verheißung göttlicher Erhöhung
  rationale: Das hebräische גדל bezeichnet zunächst ein Großwerden, während das griechische αὐξηθῇς ein Vermehrt- oder Gesteigertwerden ausdrückt. Die offene Formulierung vermeidet eine Verengung auf materiellen Wohlstand oder eine bestimmte endzeitliche Deutung.
- issue: Bedeutung von אַחֲרִיתֶךָ
  choice: „am Ende“ bezeichnet den späteren beziehungsweise endgültigen Ausgang, ohne ihn näher festzulegen.
  alternative: „in deiner Zukunft“ oder „am Ende deines Lebens“
  rationale: Das Wort kann Zukunft, Lebensende oder letztlichen Ausgang meinen. Die Übersetzung bewahrt diese zeitliche und theologische Spannung.
translation_notes:
  register: Modernes, schlichtes und würdevolles Standarddeutsch. Der kurze Imperativcharakter des hebräischen Weisheitsspruchs bleibt erhalten; die mehrdeutigen Begriffe für „groß werden“ und den endgültigen Ausgang werden nicht konfessionell oder dogmatisch vereindeutigt.
