  text: You who fear Yahweh[a], wait for his mercy, and do not turn aside, lest you fall.
translation:
  language: de
  text: Ihr, die ihr Jahwe fürchtet, wartet auf sein Erbarmen[a] und weicht nicht ab, damit ihr nicht fallt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort חסד kann auch „beständige Liebe“, „Güte“ oder „Bundestreue“ bedeuten; die griechische Parallele hat hier „Erbarmen“.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְאֵי יְהֹוָה / οἱ φοβούμενοι Κύριον
  choice: Ihr, die ihr Jahwe fürchtet
  rationale: Die hebräische Pluralkonstruktion wirkt wie eine direkte Anrede; auch das griechische Partizip bezeichnet die Angeredeten. Die Formulierung bewahrt den unmittelbaren Mahnruf. Der Gottesname יְהוָה wird im Deutschen als „Jahwe“ wiedergegeben.
- source_word: חַכּוּ / ἀναμείνατε
  choice: wartet auf
  rationale: Beide Überlieferungen verwenden einen Imperativ für geduldiges, erwartungsvolles Warten. „Auf … warten“ gibt zugleich die Beziehung zum folgenden Gegenstand natürlich wieder.
- source_word: לְחַסְדּוֹ / τὸ ἔλεος αὐτοῦ
  choice: auf sein Erbarmen
  rationale: חסד kann beständige Liebe, Güte oder Bundestreue bezeichnen. Das griechische ἔλεος stützt hier besonders die Wiedergabe „Erbarmen“, ohne die hebräische Bedeutungsbreite zu leugnen.
- source_word: וְאַל תִּטּוּ / καὶ μὴ ἐκκλίνητε
  choice: weicht nicht vom Weg ab
  rationale: Das Verb bezeichnet ein Abbiegen oder Abweichen. Die im Ausgangstext angelegte Wegmetapher wird durch „vom Weg“ im modernen Deutschen klar und idiomatisch ausgedrückt.
- source_word: פֶּן תִּפֹלוּ / ἵνα μὴ πέσητε
  choice: damit ihr nicht fallt
  rationale: Hebräisch פן und griechisch ἵνα μή formulieren eine Warnung vor einem möglichen negativen Ausgang. Die Übersetzung lässt offen, ob das Fallen moralisch, geistlich oder in einem weiteren Sinn gemeint ist.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält ausdrücklich das Tetragramm. „Jahwe“ gibt den Eigennamen im üblichen modernen deutschen Schriftbild wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutungsnuance von חסד im Licht der griechischen Parallele
  choice: Erbarmen
  alternative: beständige Liebe / Güte / Bundestreue
  rationale: Die griechische Parallele ἔλεος spricht in diesem Vers deutlich für „Erbarmen“. Eine Fußnote bewahrt zugleich die weitere Bedeutungsbreite des hebräischen חסד.
- issue: Art des angekündigten Fallens
  choice: nicht näher bestimmt
  alternative: moralischer oder geistlicher Fall
  rationale: Weder der hebräische noch der griechische Wortlaut legt ausdrücklich fest, worin das Fallen besteht. Die Übersetzung konkretisiert es daher nicht konfessionell oder dogmatisch.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit direkter pluralischer Anrede. „Vom Weg abweichen“ macht die Wegmetapher idiomatisch verständlich; die abschließende Warnung bleibt bewusst offen.
