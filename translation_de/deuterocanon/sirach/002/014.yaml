base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/002/014.yaml
  text: Woe to you who have lost hope[b][a]; what will you do at the visitation of Yahweh?
translation:
  language: de
  text: Wehe euch, die ihr die Hoffnung verloren habt![a] Was werdet ihr tun, wenn der HERR eingreift?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Griechisch: „die ihr die Ausdauer verloren habt“ oder „die ihr die Geduld verloren habt“ (τὴν ὑπομονήν); im Hebräischen steht „Hoffnung“.'
    reason: alternative_reading
  - marker: b
    text: Das hebräische Wort bezeichnet das wirksame Sich-Zuwenden oder Eingreifen des HERRN; im Zusammenhang kann besonders sein Eingreifen zum Gericht gemeint sein.
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹי
  choice: Wehe
  rationale: Die Interjektion verbindet Klage und Drohung; „Wehe“ bewahrt den prophetischen Ernst.
- source_word: אוֹבְדֵי תִּקְוָה
  choice: die ihr die Hoffnung verloren habt
  rationale: Die hebräische Wendung bezeichnet am natürlichsten Menschen, denen die Hoffnung abhandengekommen ist. Die direkte Anrede wird im Deutschen idiomatisch mit einem Relativsatz wiedergegeben.
- source_word: תִּקְוָה
  choice: Hoffnung
  rationale: „Hoffnung“ ist hier die gewöhnliche und im weisheitlichen Zusammenhang passende Bedeutung; die griechische Parallelüberlieferung bietet dagegen „Ausdauer“ beziehungsweise „Geduld“.
- source_word: בִּפְקוֹד יְהֹוָה
  choice: wenn der HERR eingreift
  rationale: Die Konstruktion lässt sich zeitlich als „wenn der HERR heimsucht/eingreift“ verstehen. „Eingreift“ ist gegenwärtiges, natürliches Deutsch und bewahrt, ohne die Bedeutung ausdrücklich auf Strafe festzulegen, den Gedanken des wirksamen göttlichen Handelns.
- source_word: יְהֹוָה
  choice: der HERR
  rationale: Das Tetragramm wird entsprechend der jüdischen Lesetradition und der etablierten deutschen Bibelsprache mit „der HERR“ wiedergegeben.
theological_decisions:
- issue: Ob das Eingreifen des HERRN ausdrücklich als Strafe bezeichnet werden soll
  choice: wenn der HERR eingreift
  alternative: wenn der HERR euch zur Rechenschaft zieht
  rationale: Der Zusammenhang mit „Wehe“ verleiht dem Satz einen drohenden Klang, doch das hebräische פקד bezeichnet allgemeiner ein aufmerksames, wirksames Sich-Zuwenden oder Eingreifen. Die Übersetzung bewahrt diese Spannung, statt das Handeln ausdrücklich auf Bestrafung zu verengen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Wehe“ bewahrt den eindringlichen Weisheits- und Warnstil; „eingreift“ vermeidet das heute altertümlich oder ausschließlich strafend wirkende „heimsucht“, ohne den bedrohlichen Kontext abzuschwächen.
