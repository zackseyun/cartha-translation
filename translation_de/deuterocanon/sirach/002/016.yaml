base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/002/016.yaml
  text: Those who fear Yahweh will seek his favor[b][a], and those who love him will learn his law.
translation:
  language: de
  text: Die den HERRN fürchten, werden seine Gunst suchen, und die ihn lieben, werden seine Weisung[a] lernen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »sein Gesetz«.'
    reason: lexical_alternative
  - marker: b
    text: 'Der griechische Paralleltext lautet: »und die ihn lieben, werden mit dem Gesetz erfüllt werden«.'
    reason: alternative_reading
lexical_decisions:
- source_word: יִרְאֵי יְהֹוָה
  choice: die den HERRN fürchten
  rationale: Die Form bezeichnet Menschen, deren Haltung von Gottesfurcht geprägt ist. Die vertraute Wendung bewahrt sowohl Ehrfurcht als auch die religiös-bundestheologische Bedeutung.
- source_word: יְהֹוָה
  choice: der HERR
  rationale: Der Gottesname wird nach der üblichen deutschen Bibeltradition mit HERR wiedergegeben.
- source_word: יְבַקְּשׁוּ
  choice: werden suchen
  rationale: Das Imperfekt kann hier charakteristisches beziehungsweise zukünftiges Handeln ausdrücken; die Futurform entspricht zudem dem griechischen ζητήσουσιν.
- source_word: רְצוֹנוֹ
  choice: seine Gunst
  rationale: רצון kann Gunst, Wohlgefallen oder das, was jemandem gefällt, bezeichnen. »Gunst« ist hier knapp und natürlich und wird durch das griechische εὐδοκία gestützt.
- source_word: וְאֹהֲבָיו
  choice: und die ihn lieben
  rationale: Das Suffix verweist auf den HERRN zurück; die Formulierung gibt die persönliche Hingabe natürlich wieder.
- source_word: יִלְמְדוּ
  choice: werden lernen
  rationale: Das Qal von למד bedeutet am ehesten »lernen«. Damit folgt der Haupttext dem erhaltenen hebräischen Zeugnis.
- source_word: תוֹרָתוֹ
  choice: seine Weisung
  rationale: תורה umfasst göttliche Unterweisung und kann auch mit »Gesetz« wiedergegeben werden. »Weisung« vermeidet eine unnötige Verengung auf einen Gesetzeskodex, ohne den verbindlichen Charakter abzuschwächen.
theological_decisions:
- issue: Abweichung zwischen dem hebräischen und dem griechischen Text im zweiten Satzglied
  choice: 'Dem Hebräischen folgend: »werden seine Weisung lernen«'
  alternative: 'Der griechische Paralleltext lautet: »werden vom Gesetz erfüllt werden«'
  rationale: Da hier ein hoch bewertetes hebräisches Zeugnis vorliegt, bildet es die Grundlage des Haupttextes. Die deutlich abweichende griechische Lesart wird zur Transparenz in einer Fußnote bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Satzstruktur des Hebräischen bleibt erhalten. »HERR« markiert die Wiedergabe des Gottesnamens; »Weisung« gibt die Bedeutungsbreite von תורה verständlich wieder.
