  text: Prepare your heart[a], and be strong; and do not be alarmed in a time of calamity.
translation:
  language: de
  text: Bereite dein Herz vor und sei stark; sei nicht bestürzt am Tag des Unheils.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Griechisch: »Handle nicht übereilt in einer Zeit der Bedrängnis (oder: Heimsuchung).« Das Hebräische betont, nicht bestürzt zu sein; das Griechische warnt vor übereiltem Handeln in der Prüfung.'
    reason: alternative_reading
lexical_decisions:
- source_word: הָכֵן
  choice: Mach … bereit
  rationale: Das Hifil von כון bedeutet hier »bereitmachen«, »festigen« oder »ausrichten«. »Mach dein Herz bereit« gibt den hebräischen Sinn natürlich wieder und lässt zugleich die im griechischen εὐθυνον anklingende innere Ausrichtung erkennen.
- source_word: לִבְּךָ
  choice: dein Herz
  rationale: לֵב bezeichnet den inneren Menschen, insbesondere Denken, Willen und Entschlossenheit. »Herz« wahrt die biblische Bildsprache und ist im Deutschen verständlich.
- source_word: וְהִתְחַזֵּק
  choice: und sei stark
  rationale: Die reflexive Form kann »stärke dich« oder »erweise dich als stark« bedeuten; das griechische καρτέρησον betont Standhaftigkeit und Ausharren. »Sei stark« ist knapp, natürlich und umfasst Entschlossenheit wie Ausdauer.
- source_word: וְאַל תִּבָּהֵל
  choice: erschrick nicht
  rationale: בהל bezeichnet bestürzt, erschrocken oder außer Fassung geraten. »Erschrick nicht« folgt dem hebräischen Hauptzeugen und klingt im Deutschen unmittelbar und würdig.
- source_word: בְּיוֹם אֵד
  choice: am Tag des Unheils
  rationale: Die Wendung bedeutet wörtlich »am Tag des Unheils/Verderbens«. Die formnahe Wiedergabe bewahrt die prägnante hebräische Zeitvorstellung, ohne sie unnötig auf einen einzelnen Kalendertag zu beschränken.
theological_decisions:
- issue: Verhältnis des hebräischen und griechischen Wortlauts im Schlusssatz
  choice: Der Haupttext folgt dem erhaltenen Hebräisch und warnt davor, angesichts des Unheils zu erschrecken.
  alternative: Die griechische Überlieferung warnt davor, in einer Zeit der Bedrängnis oder Heimsuchung übereilt zu handeln.
  rationale: Da der hebräische Wortlaut hier sicher bezeugt ist, bildet er die Grundlage des Haupttextes. Die griechische Fassung setzt mit der Warnung vor übereiltem Handeln einen eigenständigen Akzent, der nicht stillschweigend mit dem hebräischen Sinn gleichgesetzt wird und daher in der Fußnote erhalten bleibt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper weisheitlicher Satzstruktur. Die biblische Rede vom Herzen und vom »Tag des Unheils« bleibt erhalten; die Abweichung der griechischen Überlieferung wird transparent ausgewiesen.
