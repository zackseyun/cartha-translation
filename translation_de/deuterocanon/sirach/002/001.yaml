translation:
  language: de
  text: Mein Sohn, wenn du dich nahst, um Jahwe zu dienen, bereite dich auf jede Prüfung vor.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Bereite deine Seele auf jede Prüfung vor.“ Das hebräische Wort kann auch „Erprobung“ bedeuten; das entsprechende griechische Wort kann je nach Zusammenhang außerdem „Versuchung“ heißen.'
    reason: Bewahrt die wörtlichere anthropologische Formulierung sowie die Bedeutungsbreite des hebräischen und griechischen Prüfungsbegriffs.
lexical_decisions:
- source_word: בְּנִי
  choice: Mein Sohn
  rationale: Die hebräische Anrede ist ausdrücklich singularisch und männlich. „Mein Sohn“ bewahrt den persönlichen Lehrton der Weisheitsliteratur; das griechische τέκνον ist weiter gefasst, doch der hebräische Text ist hier vorrangig.
- source_word: תִּקְרַב
  choice: du dich nahst
  rationale: קרב bezeichnet das Näherkommen oder Herantreten. „Sich nahen“ erhält den möglichen gottesdienstlichen Beiklang des Hinzutretens zu Gott und ist in würdigem modernem Deutsch verständlich.
- source_word: לַעֲבוֹד
  choice: um … zu dienen
  rationale: עבד umfasst im Blick auf Gott Dienst, Gehorsam und gottesdienstliche Verehrung. „Dienen“ wahrt diese Breite, ohne den Sinn auf „anbeten“ zu verengen.
- source_word: אֶת יְהֹוָה
  choice: Jahwe
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm. „Jahwe“ gibt den persönlichen Gottesnamen wieder; das griechische Κυρίῳ bezeugt die traditionelle Wiedergabe als „Herr“, ist hier aber nur Parallelquelle.
- source_word: הָכֵן נַפְשְׁךָ
  choice: bereite dich … vor
  rationale: Wörtlich steht „bereite deine נפש vor“. In diesem Zusammenhang bezeichnet נפש die ganze Person; die reflexive deutsche Formulierung vermeidet eine ungewollte Trennung von Seele und Leib.
- source_word: לְכָל נִסָּיוֹן
  choice: auf jede Prüfung
  rationale: נִסָּיוֹן bezeichnet Erprobung oder Prüfung. „Jede Prüfung“ bewahrt sowohl den umfassenden Sinn von לְכָל als auch den Gedanken bevorstehender Bewährung; „Versuchung“ wäre nach dem hebräischen Haupttext zu eng.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהֹוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Haupttext enthält den Gottesnamen selbst. Seine Wiedergabe als „Jahwe“ macht diese Eigenheit sichtbar, während „der HERR“ der griechischen und späteren Lesetradition entsprechen würde.
- issue: Anthropologische Bedeutung von נַפְשְׁךָ
  choice: dich
  alternative: deine Seele
  rationale: נפש kann Seele, Leben oder die ganze Person bezeichnen. „Dich“ gibt hier die ganzheitliche Aufforderung natürlich wieder und legt keine Leib-Seele-Dualität fest; die wörtlichere Möglichkeit wird in der Fußnote bewahrt.
- issue: Prüfung oder Versuchung
  choice: Prüfung
  alternative: Versuchung/Erprobung
  rationale: Das hebräische נִסָּיוֹן bezeichnet vor allem Prüfung oder Erprobung. Das griechische πειρασμός kann zusätzlich „Versuchung“ bedeuten. Der Haupttext folgt dem hebräischen Zeugnis, während die semantische Spannung in der Fußnote erhalten bleibt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Sich nahen“ hebt den möglichen kultischen beziehungsweise bundestheologischen Beiklang hervor, ohne altertümliche Satzformen zu verwenden; „bereite dich … vor“ ist bewusst idiomatisch und ganzheitlich.
