  text: Woe to the heart that does not trust[a], for it also will not stand.
translation:
  language: de
  text: Wehe dem Herzen, das nicht vertraut[a]; auch es wird keinen Bestand haben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Griechisch: „Wehe dem erschlafften Herzen, weil es nicht glaubt; darum wird es keinen Schutz finden.“ Im Hebräischen steht lediglich „Herz“ und am Ende „wird keinen Bestand haben“.'
    reason: alternative_reading
lexical_decisions:
- source_word: אוֹי
  choice: Wehe
  rationale: Bewahrt den eindringlichen Klage- und Warnruf der hebräischen Weisheitssprache.
- source_word: לְלֵב
  choice: dem Herzen
  rationale: Das Herz bezeichnet im Hebräischen den inneren Menschen einschließlich Denken, Wollen und Haltung; die konkrete Bildsprache bleibt erhalten.
- source_word: אֲשֶׁר לֹא יַאֲמִין
  choice: das nicht vertraut
  rationale: אמן kann glauben beziehungsweise vertrauen bedeuten. Im Zusammenhang des standhaften Vertrauens auf Gott gibt „vertraut“ den praktischen Beziehungssinn natürlich wieder.
- source_word: וְאַף הוּא
  choice: auch es
  rationale: Gibt die hervorhebende Hinzufügung knapp wieder, ohne den syntaktischen Zusammenhang stärker als im Hebräischen kausal festzulegen.
- source_word: לֹא יָקוּם
  choice: wird keinen Bestand haben
  rationale: קום bedeutet wörtlich aufstehen oder stehen. Die idiomatische Wendung bezeichnet hier das Nichtbestehen beziehungsweise fehlende Standhalten und bewahrt zugleich das Motiv der Festigkeit.
theological_decisions:
- issue: Wiedergabe des Verbs אמן in einer Weisheitsmahnung
  choice: nicht vertraut
  alternative: nicht glaubt
  rationale: Beide Bedeutungen sind möglich; „vertraut“ hebt in diesem Kontext die tätige, beständige Ausrichtung auf Gott hervor, ohne einen späteren dogmatischen Glaubensbegriff einzutragen.
- issue: Deutung von לא יקום
  choice: wird keinen Bestand haben
  alternative: wird nicht bestehen / wird nicht aufstehen
  rationale: Die gewählte Fassung macht die kontextuelle Bedeutung des Standhaltens verständlich, ohne die Aussage auf körperliches Aufstehen oder Auferstehung zu verengen.
translation_notes:
  register: Moderne, würdige Standardsprache mit dem traditionellen Warnruf „Wehe“. „Keinen Bestand haben“ ist idiomatisch und verständlich; die Fußnote dokumentiert die erheblich ausführlichere griechische Parallelfassung.
