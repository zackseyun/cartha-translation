translation:
  language: de
  text: Denn der HERR ist barmherzig und gnädig; er vergibt Sünden und rettet in der Zeit der Not.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רָחוּם וְחַנּוּן
  choice: barmherzig und gnädig
  rationale: Die traditionelle und zugleich heute verständliche Wortpaarung gibt beide Eigenschaften prägnant wieder und entspricht auch dem griechischen Paralleltext οἰκτίρμων καὶ ἐλεήμων.
- source_word: יְהֹוָה
  choice: der HERR
  rationale: Die deutsche Wiedergabe in Kapitälchen folgt der etablierten Bibelkonvention für den Gottesnamen JHWH, ohne eine unsichere Aussprache festzulegen.
- source_word: וְסוֹלֵחַ לַעֲוֹנוֹת
  choice: er vergibt Sünden
  rationale: עֲוֹנוֹת kann Schuld, Vergehen oder Sünden bezeichnen. „Sünden“ ist im Zusammenhang natürlich und wird durch das griechische ἁμαρτίας gestützt.
- source_word: וּמוֹשִׁיעַ
  choice: und rettet
  rationale: Das Partizip beschreibt das beständige Handeln des HERRN; das deutsche Präsens bewahrt diesen Sinn.
- source_word: בְּעֵת צָרָה
  choice: in der Zeit der Not
  rationale: Die Formulierung bildet die zeitliche Wendung eng ab; צָרָה bezeichnet Bedrängnis oder Not, wobei „Not“ idiomatisch und umfassend ist.
theological_decisions:
- issue: Gegenstand der Vergebung
  choice: Sünden
  alternative: Schuld / Vergehen
  rationale: Die Wiedergabe lässt die moralisch-theologische Bedeutung deutlich werden, ohne eine besondere Lehre über den Modus der Vergebung einzutragen.
- issue: Darstellung des göttlichen Namens
  choice: der HERR
  alternative: JHWH / Jahwe
  rationale: Die konventionelle Wiedergabe wahrt die Identifikation mit dem Tetragramm und vermeidet eine Festlegung auf dessen Aussprache.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit vertrauter biblischer Sprachprägung. Der Parallelismus und die knappe Begründungsstruktur des hebräischen Satzes bleiben erhalten.
