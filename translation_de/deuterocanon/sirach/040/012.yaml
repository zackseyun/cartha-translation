  yaml_path: translation/deuterocanon/sirach/040/012.yaml
  text: Every gift and injustice will be wiped away[b][a], but faith will stand forever.
translation:
  language: de
  text: Jede Gabe[b] und jedes Unrecht wird ausgelöscht werden, doch der Glaube[a] wird für immer bestehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Treue wird für immer bestehen“. Das griechische Wort kann sowohl „Glaube“ als auch „Treue“ bezeichnen.'
    reason: alternative_reading
  - marker: b
    text: Ein älterer hebräischer Textzeuge aus Masada scheint hier eine Lesart im Sinn von „Darlehen“ vorauszusetzen, während der griechische Text „Gabe“ hat.
    reason: textual_variant
lexical_decisions:
- source_word: πᾶν
  choice: jede / jedes
  rationale: Die distributive Wiedergabe passt zu den beiden singularischen Substantiven und bewahrt den Gedanken, dass jede einzelne Gabe und jedes einzelne Unrecht gemeint ist.
- source_word: δῶρον
  choice: Gabe
  rationale: „Gabe“ ist die unmittelbare und im Deutschen würdige Entsprechung von δῶρον. „Bestechungsgeschenk“ wäre ohne eindeutigere Kontextsignale eine Überinterpretation.
- source_word: ἀδικία
  choice: Unrecht
  rationale: „Unrecht“ bewahrt sowohl die ethische als auch die gesellschaftliche Bedeutung und klingt im modernen Deutschen natürlicher als „Ungerechtigkeit“ in dieser knappen Gegenüberstellung.
- source_word: ἐξαλειφθήσεται
  choice: wird ausgelöscht werden
  rationale: Die Formulierung erhält sowohl das Futur als auch das Bild vollständiger Tilgung oder Entfernung.
- source_word: πίστις
  choice: Glaube
  rationale: „Glaube“ gibt πίστις direkt wieder; da im Weisheitskontext auch „Treue“ möglich ist, wird diese echte Mehrdeutigkeit in einer Fußnote erhalten.
- source_word: εἰς τὸν αἰῶνα
  choice: für immer
  rationale: Die feste Wendung bezeichnet bleibende Dauer; „für immer“ ist die klare, idiomatische deutsche Entsprechung.
- source_word: στήσεται
  choice: wird bestehen
  rationale: „Wird bestehen“ bewahrt die Vorstellung von Festigkeit und dauerhaftem Bestand, ohne im Deutschen unnötig wörtlich zu klingen.
theological_decisions:
- issue: Wiedergabe von πίστις
  choice: Glaube
  alternative: Treue; Vertrauen
  rationale: πίστις kann Glaube, Vertrauen oder Treue bezeichnen. Der Haupttext wählt „Glaube“, während die im Kontrast zu „Unrecht“ besonders naheliegende Bedeutung „Treue“ ausdrücklich in der Fußnote genannt wird.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe antithetische Satzform und das Zukunftstempus des Griechischen bleiben erhalten. Die distributive Konstruktion „jede … und jedes … wird“ behandelt beide Größen jeweils einzeln.
