  text: Grace and beauty delight the eye[b][a], and better than both is the vegetation of the field.
translation:
  language: de
  text: Schönheit und Gestalt erfreuen das Auge[a], doch besser als beide ist der Pflanzenwuchs des Feldes[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Schönheit und Gestalt“; die griechische Parallele lautet „Anmut und Schönheit“.'
    reason: lexical_alternative
  - marker: b
    text: Hebräisch „die Gewächse“ oder „der Aufwuchs des Feldes“; die griechische Parallele spricht vom „Grün der Saat“.
    reason: alternative_reading
lexical_decisions:
- source_word: יפי ותאר
  choice: Schönheit und Wohlgestalt
  rationale: יפי bezeichnet Schönheit; תאר meint Gestalt oder äußere Erscheinung. „Wohlgestalt“ gibt die positive ästhetische Aussage knapp wieder, ohne die beiden hebräischen Begriffe gleichzusetzen. Die griechische Parallele hat „Anmut und Schönheit“.
- source_word: יחמידו עין
  choice: erfreuen das Auge
  rationale: חמד bezeichnet Begehren oder Gefallenfinden. Die idiomatische deutsche Wendung bewahrt den visuellen Bezug und passt zum positiven Weisheitsspruch.
- source_word: ומשניהם
  choice: doch besser als beide
  rationale: Der hebräische Ausdruck ist knapp und wörtlich etwa „und von/mehr als beide“. Die griechische Parallele ὑπὲρ ἀμφότερα bestätigt den vergleichenden Sinn „über beiden/besser als beide“.
- source_word: צמחי שדה
  choice: das Grün des Feldes
  rationale: צמחי bezeichnet Gewächse, Sprosse oder Aufwuchs. „Das Grün des Feldes“ klingt natürlich und bewahrt das Bild frischen Pflanzenwuchses; die griechische Parallele χλόην σπόρου stützt diesen Sinn.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Wohlgestalt“ ist leicht gehoben, aber verständlich und bildet den ästhetischen Parallelismus präziser ab als das neutrale „Aussehen“.
