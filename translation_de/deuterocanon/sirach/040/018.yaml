  text: Wine and strong drink sweeten life[a], but better than both is finding a treasure.
translation:
  language: de
  text: Wein und berauschendes Getränk versüßen das Leben; doch besser als beides ist es, einen Schatz zu finden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hebräische Wortlaut ist knapp und kann wörtlicher wiedergegeben werden: „Wein und berauschendes Getränk machen das Leben süß, und über beide hinaus: einen Schatz zu finden.“ Die griechische Überlieferung stützt im zweiten Halbvers den vergleichenden Sinn („über beide“), hat im ersten Halbvers jedoch abweichend: „Das Leben eines selbstgenügsamen Arbeiters wird angenehm sein.“'
    reason: Textvariante und Erhalt der knappen, vergleichenden hebräischen Formulierung.
lexical_decisions:
- source_word: חיי
  choice: das Leben
  rationale: 'Die konstruktartige hebräische Wendung ist knapp und idiomatisch gemeint: Wein und berauschendes Getränk machen das Leben angenehm. „Das Leben“ bewahrt den nominalen Ausdruck in natürlichem Deutsch.'
- source_word: יין
  choice: Wein
  rationale: Die übliche und sachlich genaue Wiedergabe des hebräischen Begriffs.
- source_word: ושכר
  choice: und berauschendes Getränk
  rationale: שכר bezeichnet ein alkoholisches Getränk neben Wein, ohne hier eine bestimmte Getränkeart festzulegen. Die Formulierung ist im modernen Deutsch verständlich und vermeidet das zu enge „Bier“.
- source_word: ימתקו
  choice: versüßen
  rationale: Das Verb מתק bezeichnet das Süß- beziehungsweise Angenehmmachen. Im Zusammenhang mit dem Leben gibt „versüßen“ die bildhafte Aussage knapp und natürlich wieder.
- source_word: ומשניהם
  choice: doch besser als beides
  rationale: Die hebräische Wendung kann wörtlich „und über/mehr als beide“ verstanden werden. Der griechische Vergleich ὑπὲρ ἀμφότερα bestätigt den steigernden Sinn; „doch besser als beides“ macht ihn idiomatisch deutlich.
- source_word: מוצא
  choice: es ist, … zu finden
  rationale: Die nominale beziehungsweise partizipiale Form wird als deutscher Infinitivsatz wiedergegeben. Dadurch bleibt der Vorgang des Findens im Mittelpunkt, ohne den möglichen Sinn „wer einen Schatz findet“ auszuschließen.
- source_word: אוצר
  choice: einen Schatz
  rationale: Hier ist ein wertvoller Fund gemeint, nicht ein Vorratshaus. Auch das griechische θησαυρόν stützt „Schatz“.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, spruchhaftem Rhythmus. Das Semikolon bildet die Steigerung des hebräischen Satzes ab; „berauschendes Getränk“ ist präziser und heute verständlicher als das traditionelle „starkes Getränk“.
