  text: For a shameless man, begging is sweet, but within him it burns like fire.
translation:
  language: de
  text: Einem schamlosen Menschen[a] erscheint das Betteln[b] süß, doch in seinem Innern brennt es wie Feuer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch wörtlich etwa: „einem Menschen von starker Seele“; die griechische Parallele hat „im Mund eines schamlosen Menschen“ und stützt damit die Wiedergabe „schamlos“.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „das Bitten“. Die griechische Parallele bezeichnet genauer das Betteln beziehungsweise Almosenbitten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לאיש עוז נפש
  choice: einem schamlosen Menschen
  rationale: Der hebräische Ausdruck lautet wörtlich etwa „einem Menschen von starker Seele“ und ist mehrdeutig. Im Zusammenhang bezeichnet er wahrscheinlich nicht lobenswerte Seelenstärke, sondern dreiste Unverschämtheit. Die griechische Parallele ἐν στόματι ἀναιδοῦς („im Mund eines Schamlosen“) stützt diese negative Bedeutung deutlich.
- source_word: תמתיק שאלה
  choice: erscheint das Betteln süß
  rationale: שאלה bezeichnet grundsätzlich ein Bitten oder Ersuchen; die griechische Parallele ἐπαίτησις präzisiert es als Betteln. „erscheint … süß“ bewahrt das Bild des angenehmen Geschmacks, ohne das Hebräische unnatürlich wörtlich wiederzugeben.
- source_word: ובקרבו
  choice: doch in seinem Innern
  rationale: קרב meint die inneren Teile beziehungsweise das Innere eines Menschen. „in seinem Innern“ ist natürliches Deutsch und lässt sowohl die leibliche als auch die seelische Dimension anklingen. Das adversative „doch“ gibt den sachlichen Gegensatz zwischen äußerer Süße und innerem Brennen wieder.
- source_word: תבער כמו אש
  choice: brennt es wie Feuer
  rationale: Das feminine Verb kann sich sinngemäß auf das Betteln oder dessen Erfahrung zurückbeziehen. Die Formulierung erhält den kräftigen Vergleich, ohne näher festzulegen, worin das innere Brennen besteht.
theological_decisions:
- issue: Deutung des schwierigen Ausdrucks לאיש עוז נפש
  choice: 'negative moralische Bedeutung: „einem schamlosen Menschen“'
  alternative: „einem Menschen von starker Seele“ oder „einem kühnen Menschen“
  rationale: Der hebräische Wortlaut allein lässt eine wörtliche Deutung als Stärke oder Kühnheit zu. Die griechische Parallele versteht den Ausdruck jedoch als Schamlosigkeit, was zum warnenden Weisheitsspruch passt. Da die hebräische Mehrdeutigkeit echt ist, wird die wörtlichere Alternative in der Fußnote offengelegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Mensch“ gibt איש hier geschlechtsübergreifend und sprichwortartig wieder. Die knappe Gegenüberstellung von scheinbarer Süße und innerem Brennen bleibt erhalten; die schwierige hebräische Lesart wird nicht verschwiegen, sondern in der Fußnote dokumentiert.
