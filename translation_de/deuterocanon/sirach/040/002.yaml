  text: from the day he comes out from his mother's womb until the day he returns to the mother of all the living[a].
translation:
  language: de
  text: von dem Tag an, an dem er aus dem Mutterleib kommt, bis zu dem Tag, an dem er zur Mutter alles Lebendigen zurückkehrt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „zur Mutter alles Lebendigen“. Gemeint ist wahrscheinlich die Erde, zu der der Mensch im Tod zurückkehrt. Der griechische Paralleltext spricht ausdrücklich vom „Tag des Todes“. Die Formulierung kann zugleich an Eva als „Mutter alles Lebendigen“ erinnern (1. Mose 3,20).'
    reason: Erläuterung der mehrdeutigen poetischen Metapher und des griechischen Parallelzeugnisses
lexical_decisions:
- source_word: מיום
  choice: von dem Tag an
  rationale: מן mit יום bezeichnet den Anfangspunkt einer Zeitspanne; die deutsche Wendung gibt diese zeitliche Grenze klar und natürlich wieder.
- source_word: צאתו
  choice: an dem er … kommt
  rationale: Die Form von יצא bezeichnet sein Herauskommen. Die verbale Wiedergabe bewahrt das konkrete Geburtsbild und steht parallel zu „zurückkehrt“.
- source_word: מרחם אמו
  choice: aus dem Leib seiner Mutter
  rationale: רחם meint hier den Mutterleib. „Leib seiner Mutter“ ist würdig und verständlich und vermeidet die im Deutschen teils medizinisch wirkende Formulierung „Gebärmutter“.
- source_word: עד יום
  choice: bis zu dem Tag
  rationale: Die Wendung markiert den Endpunkt derselben Zeitspanne und spiegelt die Struktur des hebräischen Satzes.
- source_word: שובו
  choice: an dem er … zurückkehrt
  rationale: שוב bedeutet „zurückkehren“. Die finite Form ist im Deutschen natürlich und wahrt die Bewegung vom Lebensanfang bis zum Tod.
- source_word: אל אם כל חי
  choice: zur Mutter alles Lebendigen
  rationale: Die wörtliche poetische Metapher bleibt erhalten, ohne sie im Haupttext vorschnell als „Erde“ oder „Grab“ auszulegen. „Alles Lebendigen“ wahrt zudem die mögliche sprachliche Nähe zu Genesis 3,20, ohne eine eindeutige Anspielung zu behaupten.
theological_decisions:
- issue: Metaphorische Bezeichnung des Todes in „Mutter alles Lebendigen“
  choice: Die hebräische Metapher bleibt im Haupttext stehen.
  alternative: „zur Erde“, „ins Grab“ oder ausdrücklich „bis zum Tod“
  rationale: Der primäre hebräische Zeuge formuliert poetisch und nennt weder Erde noch Grab ausdrücklich. Der griechische Paralleltext macht den Bezug auf den Tod deutlich, rechtfertigt aber nicht, die Bildsprache des Hebräischen im Haupttext aufzulösen.
- issue: Mögliche Anspielung auf Genesis 3,20
  choice: Die Formulierung „alles Lebendigen“ wird bewahrt, ohne Eva ausdrücklich zu nennen.
  alternative: Explizite Identifizierung der Mutter mit Eva oder ausschließliche Deutung als Mutter Erde
  rationale: Die Wortwahl kann an die Bezeichnung Evas als Mutter alles Lebendigen erinnern, doch im Zusammenhang des Zurückkehrens liegt zugleich die Erde als Todesmetapher nahe. Die Übersetzung lässt diese Spannung bestehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung „von dem Tag … bis zu dem Tag“ folgt bewusst der hebräischen Spannweite. Die konkrete Geburts- und Rückkehrbewegung sowie die poetische Mehrdeutigkeit des Schlussbildes bleiben erhalten.
