  text: from one seated on a lofty throne[a], to one returning to dust and ashes.
translation:
  language: de
  text: Von dem, der auf einem hohen Thron sitzt,[a] bis zu dem, der zu Staub und Asche zurückkehrt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Parallele lautet: „von einem, der auf einem Thron in Herrlichkeit sitzt, bis zu einem, der in Erde und Asche erniedrigt ist“. Sie spricht Herrlichkeit und Erniedrigung ausdrücklich aus, während der hebräische Text knapper formuliert.'
    reason: alternative_reading
lexical_decisions:
- source_word: מיושב
  choice: Vom Menschen, der … sitzt
  rationale: Die Präposition מ bezeichnet den Ausgangspunkt der Spannweite („von“), und das Partizip יושב beschreibt einen Sitzenden. Die explizite Wiedergabe mit „Menschen“ macht den elliptischen deutschen Satz natürlich, ohne den Sinn einzuengen.
- source_word: כסא
  choice: Thron
  rationale: כסא bezeichnet in diesem erhöhten, rangbezogenen Zusammenhang einen Thron; das griechische θρόνος bestätigt diese Bedeutung.
- source_word: לגבה
  choice: hoch
  rationale: Die Wendung bezeichnet Höhe beziehungsweise Erhabenheit. „Hoher Thron“ bewahrt im Deutschen sowohl die räumliche als auch die gesellschaftliche Konnotation, ohne das griechische „in Herrlichkeit“ in den hebräischen Haupttext einzutragen.
- source_word: עד
  choice: bis zu
  rationale: עד kennzeichnet hier den anderen Endpunkt einer umfassenden Spannweite. „Bis zu“ bildet die Konstruktion „vom … bis zu dem …“ idiomatisch ab und vermeidet eine rein zeitliche Deutung.
- source_word: לשוב
  choice: zurückkehrt
  rationale: Der Infinitiv mit ל bezeichnet den zweiten Pol der Spannweite und bewahrt das biblische Motiv der Rückkehr zum Staub. Ein Relativsatz ist im Deutschen klar und natürlich.
- source_word: עפר ואפר
  choice: Staub und Asche
  rationale: Die feste Wortverbindung bringt Sterblichkeit, Niedrigkeit und menschliche Hinfälligkeit zum Ausdruck und entspricht dem etablierten deutschen biblischen Sprachgebrauch.
theological_decisions:
- issue: Vorrang des hebräischen Textzeugen gegenüber der ausführlicheren griechischen Parallele
  choice: Der Haupttext folgt der knappen hebräischen Gegenüberstellung eines Menschen auf hohem Thron und eines Menschen, der zu Staub und Asche zurückkehrt.
  alternative: „Von einem, der in Herrlichkeit auf einem Thron sitzt, bis zu einem, der in Erde und Asche erniedrigt ist.“
  rationale: Der erhaltene hebräische Text ist hier der maßgebliche Ausgangstext. Die griechische Parallele bestätigt den Gegensatz, macht aber Herrlichkeit und Erniedrigung ausdrücklich. Diese interpretierenden Elemente werden deshalb nicht stillschweigend in den Haupttext aufgenommen, sondern in einer Fußnote dokumentiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die symmetrische Formulierung „vom Menschen … bis zu dem …“ verdeutlicht die soziale und existenzielle Spannweite. „Hoher Thron“ bleibt bewusst näher am Hebräischen als das interpretierende griechische „Thron in Herrlichkeit“.
