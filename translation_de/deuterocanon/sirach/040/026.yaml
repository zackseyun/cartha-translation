base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/040/026.yaml
  text: Wealth and strength lift up the heart[a], and the fear of God is beyond both. In the fear of God there is no lack[b], and there is no need to seek support along with it.
translation:
  language: de
  text: Vermögen und Kraft erheben das Herz, und Gottesfurcht übertrifft beides.[a] Bei Gottesfurcht gibt es keinen Mangel, und neben ihr braucht man keine Stütze zu suchen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „und von beiden“; gemeint ist im Zusammenhang, dass Gottesfurcht Vermögen und Kraft übertrifft. Auch möglich: „ist mehr als beides“.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „und mit ihr braucht man keine Hilfe zu suchen“. Gemeint ist, dass neben der Gottesfurcht keine zusätzliche Stütze nötig ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חיל
  choice: Vermögen
  rationale: In der Verbindung mit כח bezeichnet חיל hier am ehesten materielle Mittel oder Besitz; das griechische χρήματα bestätigt diesen Sinn. „Vermögen“ ist zugleich natürlich und würdig.
- source_word: כח
  choice: Kraft
  rationale: Entspricht unmittelbar dem hebräischen כח und dem griechischen ἰσχύς, ohne die Art der Kraft unnötig einzuengen.
- source_word: יגדלו לב
  choice: erheben das Herz
  rationale: Bewahrt das hebräische Bild und lässt offen, ob Zuversicht, Hochgefühl oder Stolz gemeint ist.
- source_word: ומשניהם
  choice: doch … übertrifft beides
  rationale: 'Der Zusammenhang verlangt einen vergleichenden Sinn: Gottesfurcht steht über Vermögen und Kraft. „Doch“ gibt den inhaltlichen Gegensatz im natürlichen Deutschen wieder, obwohl das Hebräische formal mit einer einfachen Konjunktion anschließt.'
- source_word: יראת אלהים
  choice: Gottesfurcht
  rationale: Bewahrt den gewichtigen Weisheitsbegriff des Hebräischen und gibt ausdrücklich אלהים („Gott“) wieder, ohne ihn auf bloße Ehrfurcht zu verengen.
- source_word: מחסור
  choice: Mangel
  rationale: Gibt den Zustand fehlender Versorgung oder Unzulänglichkeit knapp und idiomatisch wieder.
- source_word: ואין לבקש עמה משען
  choice: und neben ihr braucht man keine Stütze zu suchen
  rationale: עמה bezeichnet etwas, das zusätzlich zu ihr gesucht würde; משען ist eine Stütze oder ein Halt. Die Formulierung bringt die Aussage der Genügsamkeit klar zum Ausdruck.
theological_decisions:
- issue: Wiedergabe von יראת אלהים
  choice: Gottesfurcht
  alternative: Ehrfurcht vor Gott
  rationale: „Gottesfurcht“ erhält die für die Weisheitsliteratur zentrale Spannung zwischen Scheu, Ehrfurcht, Vertrauen und Gehorsam; „Ehrfurcht“ allein wäre enger und milder.
- issue: Verhältnis von Gottesfurcht zu Vermögen und Kraft
  choice: übertrifft beides
  alternative: ist mehr als beides
  rationale: Der knappe hebräische Ausdruck ומשניהם ist formal ungewöhnlich, wird aber im Kontext und durch die griechische Parallele als Überordnung verstanden. Die Fußnote hält die wörtlichere Möglichkeit sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die traditionelle Wortbildung „Gottesfurcht“ erhält das biblische Leitmotiv; die Bildsprache von Herz und Stütze bleibt bewahrt. Alle Fußnotenmarker stehen im Haupttext.
