base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/040/013.yaml
  text: From force to force[a], like a perennial wadi, and from a mighty channel[c][b], with a crash of sounds.
translation:
  language: de
  text: Von Kraft zu Kraft[a], wie ein ständig wasserführendes Wadi[c], und aus einem mächtigen Flussbett, unter lautem Getöse.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Parallelüberlieferung lautet: „Der Reichtum der Ungerechten wird wie ein Fluss austrocknen, und wie ein gewaltiger Donner im Regen wird er widerhallen.“ Sie bezeugt eine deutlich andere Textform als der erhaltene hebräische Wortlaut.'
    reason: alternative_reading
  - marker: b
    text: Der hebräische Text dieser Zeile ist schwer verständlich, und das Masada-Fragment zu diesem Vers ist zu unvollständig, um den Wortlaut sicher zu klären. Die Übersetzung folgt dem Hebräischen aus der Kairoer Geniza und berücksichtigt zugleich die griechische Parallelüberlieferung.
    reason: textual_variant
  - marker: c
    text: 'Oder: „wie ein beständiger Wasserlauf“. Hebräisch נחל bezeichnet oft ein Wadi oder einen Wildbach, und איתן deutet auf Beständigkeit oder dauerndes Fließen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מחיל אל חיל
  choice: Von Kraft zu Kraft
  rationale: חיל kann Kraft, Macht, Vermögen oder Heer bezeichnen. Der erhaltene hebräische Wortlaut ist elliptisch und schwierig; im Zusammenhang mit den folgenden Wasserbildern gibt „Kraft“ am ehesten die Vorstellung einer sich steigernden oder fortwirkenden Wucht wieder, ohne die abweichende griechische Lesart in den Haupttext einzutragen.
- source_word: נחל איתן
  choice: ein immer fließender Wadi
  rationale: נחל bezeichnet häufig ein Wadi oder dessen Wasserlauf, während איתן hier Beständigkeit und anhaltende Strömung nahelegt. „Immer fließender Wadi“ bewahrt das Landschaftsbild und ist zugleich für heutige Leser verständlich.
- source_word: אפיק אדיר
  choice: ein mächtiges Flussbett
  rationale: אפיק bezeichnet ein Bett, eine Rinne oder einen Wasserlauf; אדיר bedeutet mächtig. „Mächtiges Flussbett“ erhält das konkrete topografische Bild und den Parallelismus.
- source_word: בחזיז קולות
  choice: unter lautem Getöse
  rationale: Die seltene Wendung ist schwer zu deuten. קולות kann Laute, Stimmen oder Donner bezeichnen. „Unter lautem Getöse“ gibt die akustische Wucht wieder, ohne den unsicheren hebräischen Wortlaut ausdrücklich auf Donner festzulegen.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die ungewöhnliche, elliptische Bildfolge des schwierigen hebräischen Textes bleibt sichtbar; „Wadi“ bewahrt den nahöstlichen Landschaftsbezug, während „Flussbett“ und „Getöse“ das Bild natürlich verständlich machen.
