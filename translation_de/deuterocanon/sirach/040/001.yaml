    rationale: Der griechische Paralleltext spricht ausdrücklich vom Tag der Bestattung in der „Mutter aller“. Die Rückkehr ist eine interpretierende Verdeutlichung; die Bestattung kann im Haupttext ohne Verlust des Bildes genannt werden.
