base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/040/001.yaml
  text: Great toil is allotted[c][b][a], and a heavy burden upon the children of man—from the day they come forth from their mother’s womb until the day they return to the mother of all.
translation:
  language: de
  text: Große Mühsal ist zugeteilt[a], und eine schwere Last liegt auf den Menschen[b] – von dem Tag an, an dem sie aus dem Schoß ihrer Mutter hervorgehen, bis zum Tag ihrer Bestattung in der Mutter aller.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die hebräische Wendung ist stark verkürzt und nicht ganz eindeutig. Sie kann ein zugeteiltes Los bezeichnen; der griechische Paralleltext lautet: „ist für jeden Menschen geschaffen“ und nennt keinen göttlichen Akteur ausdrücklich.'
    reason: textual_ambiguity
  - marker: b
    text: 'Griechisch: „ein schweres Joch auf den Söhnen Adams“. Das Hebräische ist knapper; „schwere Last“ gibt den Sinn wieder, ohne die griechische Metapher im Haupttext zu erzwingen.'
    reason: lexical_alternative
  - marker: c
    text: 'Der erhaltene hebräische Wortlaut endet früher. Der griechische Paralleltext ergänzt: „von dem Tag, an dem sie aus dem Schoß ihrer Mutter hervorgehen, bis zum Tag der Bestattung in der Mutter aller“. Die „Mutter aller“ bezeichnet bildlich die Erde als gemeinsamen Ort der Bestattung.'
    reason: alternative_reading
lexical_decisions:
- source_word: עסק גדול
  choice: Große Mühsal
  rationale: עסק bezeichnet hier eine belastende Beschäftigung oder mühevolle Arbeit. „Mühsal“ gibt den beschwerlichen Charakter natürlich und würdig wieder und stimmt mit dem griechischen ἀσχολία μεγάλη überein.
- source_word: חלק אל
  choice: ist auferlegt
  rationale: Die überlieferte hebräische Wendung ist knapp und nicht völlig eindeutig. Die passive Formulierung bewahrt den Gedanken eines zugeteilten Loses, ohne Gott ausdrücklich als Handelnden festzulegen; der griechische Paralleltext spricht davon, dass es jedem Menschen geschaffen beziehungsweise bestimmt ist.
- source_word: ועל כבד
  choice: und eine schwere Last liegt
  rationale: Das Hebräische ist elliptisch. Der griechische Paralleltext bietet ζυγὸς βαρύς, wörtlich „ein schweres Joch“. „Schwere Last“ vermittelt den Sinn in gegenwärtigem Deutsch, während die genaue griechische Metapher in der Fußnote erhalten bleibt.
- source_word: על בני אדם
  choice: auf den Menschenkindern
  rationale: „Menschenkinder“ bewahrt die konkrete, anthropologische Ausdrucksweise von בני אדם, ohne sie auf männliche Personen zu beschränken. Zugleich bleibt der mögliche Bezug auf Adam stärker hörbar als bei dem abstrakten „Menschheit“.
- source_word: ἀφʼ ἡμέρας ἐξόδου ἐκ γαστρὸς μητρὸς αὐτῶν
  choice: von dem Tag an, an dem sie aus dem Schoß ihrer Mutter hervorgehen
  rationale: Die aus dem griechischen Paralleltext übernommene Zeitangabe wird anschaulich und quellennah wiedergegeben. „Hervorgehen“ ist würdig, aber im modernen Deutsch noch verständlich.
- source_word: ἕως ἡμέρας ἐπὶ ταφῇ εἰς μητέρα πάντων
  choice: bis zu dem Tag, an dem sie zur Mutter aller zurückkehren
  rationale: Der griechische Text bezeichnet den Tag der Bestattung in der „Mutter aller“. „Zurückkehren“ macht das Bild von der Erde als gemeinsamem Ursprung und Grab verständlich, ohne die Metapher aufzulösen.
theological_decisions:
- issue: Verwendung des vollständigeren griechischen Paralleltexts neben dem kürzeren hebräischen Zeugen
  choice: Der hebräische Kernsatz wird übersetzt und durch die griechisch überlieferte Zeitspanne von Geburt bis Bestattung ergänzt.
  alternative: Nur den kürzeren erhaltenen hebräischen Satz wiedergeben.
  rationale: Das Hebräische bleibt für den erhaltenen Wortlaut vorrangig; der griechische Paralleltext bewahrt jedoch offenbar eine vollständigere Versgestalt. Die Fußnote legt diese textliche Grundlage offen, statt den Unterschied zwischen den Zeugen zu verdecken.
- issue: Anthropologische Wendung בני אדם / υἱοὶ Ἀδάμ
  choice: Menschenkinder
  alternative: Adamssöhne; Menschen; Menschheit
  rationale: „Menschenkinder“ wahrt die konkrete Redeweise und den möglichen Adam-Anklang, bezeichnet im Deutschen aber Menschen beiderlei Geschlechts.
- issue: Mögliche Nennung Gottes in חלק אל
  choice: Kein ausdrückliches göttliches Subjekt im Haupttext
  alternative: „von Gott zugeteilt“ oder „Gottes Anteil“
  rationale: Der hebräische Wortlaut ist an dieser Stelle komprimiert und kann entsprechend verstanden werden, während der griechische Paralleltext Gott nicht ausdrücklich als Subjekt nennt. Die passive Form lässt die theologische Spannung bestehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz bleibt bildhaft und gut verständlich; „Menschenkinder“ bewahrt die quellensprachliche Konkretheit, während die Gedankenstriche die von Geburt bis Tod reichende Ergänzung klar absetzen.
