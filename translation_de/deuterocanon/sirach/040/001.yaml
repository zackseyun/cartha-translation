  naturalness: „Menschenkinder“ ist im heutigen Standarddeutsch unnötig altertümlich und wirkt hier weniger natürlich als „Menschen“. Die Formulierung „Tag ihrer Bestattung in der Mutter aller“ ist näher am griechischen Wortlaut und verständlicher als ein nicht ausdrücklich belegtes „zurückkehren“.
  terminology: „Mühsal“ und „schwere Last“ sind treffend. Der Adam-Bezug des Griechischen sollte in der Fußnote genannt werden, nicht durch das im Deutschen unübliche „Menschenkinder“ im Haupttext erzwungen werden.
