    rationale: Die Bezeichnung ist im modernen Standarddeutsch markiert und bewahrt keinen eindeutigen Adam-Bezug, da בני אדם im Hebräischen eine gewöhnliche Bezeichnung für Menschen ist. „Menschen“ ist natürlicher; die griechische Lesart „Söhne Adams“ gehört in die Anmerkung.
