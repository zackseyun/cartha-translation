    rationale: Die passive Wendung kann eine auferlegte Verpflichtung oder Strafe nahelegen. Das schwierige hebräische חלק legt eher ein zugeteiltes Los nahe; der griechische Paralleltext nennt keinen göttlichen Akteur.
  - severity: medium
