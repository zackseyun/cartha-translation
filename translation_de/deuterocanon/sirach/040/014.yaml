  text: At the opening of his hands they will rejoice[b][a], but the transgressors will suddenly come to an end forever.
translation:
  language: de
  text: Wenn er seine Hände öffnet, wird er sich freuen[a][b]; so werden die Übertreter plötzlich für immer ein Ende finden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der erste Halbvers ist im Hebräischen schwer verständlich und könnte auf eine andere Lesart zurückgehen, die ungefähr von „Volk“ und vom Plündern spricht. Der griechische Text lautet: „Wenn er seine Hände öffnet, wird er sich freuen.“'
    reason: alternative_reading
  - marker: b
    text: Von Masada ist hier nur eine fragmentarische Lesart erhalten; der Text der Kairoer Geniza und der griechische Text weichen im ersten Halbvers erheblich voneinander ab.
    reason: textual_variant
lexical_decisions:
- source_word: שאתו כפים / ἐν τῷ ἀνοῖξαι αὐτὸν χεῖρας
  choice: Wenn er seine Hände öffnet
  rationale: Der hebräische Wortlaut ist an dieser Stelle schwer verständlich und wohl textlich gestört. Die griechische Parallele bietet eindeutig das Öffnen der Hände; die finite deutsche Formulierung ist natürlich und bewahrt den zeitlichen Sinn.
- source_word: עם עם / εὐφρανθήσεται
  choice: freuen sie sich
  rationale: Das überlieferte Hebräisch ist unklar und textlich instabil; die griechische Parallele hat „wird sich freuen“. Der Plural folgt der im Konsultationstext vorausgesetzten Bezugsgruppe, während die erhebliche Abweichung vom Hebräischen in den Fußnoten offengelegt wird.
- source_word: פתאם
  choice: plötzlich
  rationale: Das hebräische Adverb bedeutet direkt „plötzlich“ oder „unvermittelt“ und verstärkt die Warnung.
- source_word: לנצח
  choice: für immer
  rationale: Die Wendung bezeichnet Dauer beziehungsweise Endgültigkeit. „Für immer“ bewahrt diese Aussage ohne erklärende Abschwächung.
- source_word: יתם / ἐκλείψουσιν
  choice: ein Ende finden
  rationale: Hebräisch und Griechisch bezeichnen das Aufhören oder Verschwinden. Die deutsche Wendung gibt dies idiomatisch wieder, ohne eine bestimmte Art des Untergangs hinzuzufügen.
- source_word: οἱ παραβαίνοντες
  choice: die Übertreter
  rationale: Die griechische Parallele nennt ausdrücklich diejenigen, die Gebote oder Grenzen übertreten. „Übertreter“ ist knapp, würdig und lässt den genauen Gegenstand der Übertretung offen.
theological_decisions:
- issue: Verwendung der griechischen Parallele bei schwierigem hebräischem Text
  choice: 'Der Haupttext folgt im ersten Halbvers dem klareren griechischen Sinn: „Wenn er seine Hände öffnet, freuen sie sich.“'
  alternative: Eine stärker am erhaltenen Hebräisch orientierte Wiedergabe würde undeutlich von „Volk um Volk“ und vom Rauben beziehungsweise Plündern sprechen.
  rationale: Das erhaltene Hebräisch des ersten Halbverses ist erheblich gestört und weicht stark von der griechischen Überlieferung ab. Daher dient das Griechische hier als Übersetzungsgrundlage; die hebräische Alternative wird transparent in einer Fußnote bewahrt.
- issue: Verhältnis der beiden Halbverse
  choice: doch
  alternative: so
  rationale: Weder der schwierige hebräische Text noch das griechische οὕτως verlangt eindeutig einen adversativen Anschluss; inhaltlich steht jedoch die Freude beim Öffnen der Hände dem endgültigen Ende der Übertreter gegenüber. „Doch“ macht diesen Kontrast lesbar, ohne einen engen Kausalzusammenhang zu behaupten.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die textkritische Unsicherheit wird nicht im Haupttext überfrachtet, sondern durch unmittelbar markierte Fußnoten offengelegt.
