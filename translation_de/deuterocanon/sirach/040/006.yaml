base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/040/006.yaml
  text: For a little while[a], like a moment, he is quiet in vain; then, from the terrors of his heart[b], he is shaken—like one fleeing from before a pursuer.
translation:
  language: de
  text: Für kurze Zeit, für einen Augenblick, kommt er vergeblich zur Ruhe; dann erschüttern ihn die Schrecken seines Herzens.[a] Kurz irrt er umher in der Schau seiner Seele,[b] wie ein Entronnener, der vor einem Verfolger flieht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die Verbindung vor »die Schrecken seines Herzens« ist im Hebräischen schwierig. Der griechische Paralleltext beschreibt die Unruhe im Schlaf ausführlicher: »in Träumen wie an einem Tag der Wache«.'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlich steht im Hebräischen etwa: »Kurz irrt er umher aus/in der Schau seiner Seele«. Die genaue syntaktische Verbindung ist unsicher. Der anschließende Vergleich lautet im hebräischen Text »wie ein Entronnener, der vor einem Verfolger flieht«; der griechische Paralleltext hat entsprechend »wie einer, der dem Krieg entronnen ist«.'
    reason: textual_variant
lexical_decisions:
- source_word: מעט
  choice: für kurze Zeit
  rationale: Das Adverb bezeichnet hier eine sehr kurze Dauer. Die Wendung ist im heutigen Deutsch natürlich und bewahrt die im hebräischen Text betonte Kürze.
- source_word: לריק
  choice: vergeblich
  rationale: 'Das Wort bedeutet gewöhnlich »vergeblich« oder »zu nichts«. Es kennzeichnet die kurze Ruhe als wirkungslos: Sie bringt keine bleibende Erholung.'
- source_word: כרגע
  choice: kaum einen Augenblick
  rationale: כ mit רגע unterstreicht die Augenblicklichkeit. Die idiomatische deutsche Formulierung gibt die äußerst knappe Dauer wieder, ohne daraus eine längere Ruhephase zu machen.
- source_word: ישקוט
  choice: kommt er zur Ruhe
  rationale: Das Verb bezeichnet Stillwerden oder Ruhen. »Kommt er zur Ruhe« klingt natürlich und lässt den folgenden jähen Umschlag deutlich hervortreten.
- source_word: ומבין
  choice: dann … von
  rationale: Die hebräische Verbindung ist schwierig. Im Zusammenhang bezeichnet sie den Übergang von der kurzen Ruhe zur inneren Beunruhigung; »dann … von« gibt diesen Zusammenhang knapp wieder, ohne die unsichere Syntax künstlich festzulegen.
- source_word: בהלות לבו
  choice: die Schrecken seines Herzens
  rationale: בהלות kann plötzliches Entsetzen, Angst oder Panik bezeichnen. »Schrecken seines Herzens« bewahrt den inneren Ursprung der Erschütterung und entspricht dem Bild des griechischen Paralleltextes.
- source_word: נרעש
  choice: wird … erschüttert
  rationale: Das Verb beschreibt heftige innere oder körperliche Unruhe. »Erschüttert« hält beide Bedeutungsbereiche offen.
- source_word: כשריד בורח מפני רודף
  choice: wie einer, der vor einem Verfolger flieht
  rationale: 'Die genaue Textgestalt ist schwierig, doch das Kernbild ist klar: Ein Mensch flieht in Angst vor einem Verfolger. Die Übersetzung bewahrt dieses Bild, ohne die unsichere Deutung von שריד als »Entronnener« oder »Überlebender« festzuschreiben.'
