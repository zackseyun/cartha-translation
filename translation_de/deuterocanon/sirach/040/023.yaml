base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/040/023.yaml
  text: A companion and a friend conduct themselves for a time, but better than both is an intelligent wife.
translation:
  language: de
  text: Ein Gefährte und ein Freund gehen eine Zeit lang[a] mit; doch besser als beide ist eine verständige Ehefrau[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zur rechten Zeit“ beziehungsweise „für eine bestimmte Zeit“. Das Hebräische und der griechische Paralleltext lassen sowohl eine begrenzte Dauer als auch einen passenden Zeitpunkt anklingen.'
    reason: alternative_reading
  - marker: b
    text: 'Hebräisch: „Frau“; der griechische Paralleltext weist hier deutlicher auf eine Ehefrau.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עמית
  choice: Gefährte
  rationale: Das Wort bezeichnet einen Nahestehenden oder Weggenossen. „Gefährte“ bewahrt die persönliche Beziehung und unterscheidet sich ausreichend von רע.
- source_word: רע
  choice: Freund
  rationale: In der Paarung mit עמית bezeichnet רע am natürlichsten einen Freund; so bleiben die beiden verwandten, aber nicht völlig identischen Beziehungen erkennbar.
- source_word: לעת
  choice: eine Zeit lang
  rationale: Die Wendung kann eine begrenzte Dauer bezeichnen. Auch das griechische εἰς καιρόν lässt diese Deutung zu, ohne die mögliche Bedeutung „zur rechten Zeit“ ganz auszuschließen.
- source_word: ינהגו
  choice: gehen … mit
  rationale: Die Form von נהג beschreibt hier, dass die genannten Personen für eine gewisse Zeit mitgehen beziehungsweise Gemeinschaft halten. Die deutsche Wendung ist natürlich und wahrt den bildhaften verbalen Charakter, ohne eine bestimmte Art von Nutzen einzutragen.
- source_word: ומשניהם
  choice: doch besser als beide
  rationale: Die hebräische Form bezeichnet ein Darüberhinausgehen; der Vergleich und das griechische ὑπὲρ ἀμφότερα stützen die ausdrückliche Wiedergabe als Überlegenheit.
- source_word: אשה
  choice: Ehefrau
  rationale: Das Hebräische kann „Frau“ oder „Ehefrau“ bedeuten. Der griechische Paralleltext γυνὴ μετὰ ἀνδρός weist hier auf die eheliche Beziehung, weshalb „Ehefrau“ im Haupttext gewählt wird; die allgemeinere Möglichkeit wird in einer Fußnote bewahrt.
- source_word: משכלת
  choice: verständige
  rationale: Das Wort bezeichnet Einsicht und praktische Urteilskraft. „Verständig“ ist im Deutschen klar, würdevoll und umfasst mehr als bloße intellektuelle Begabung.
theological_decisions:
- issue: Ob אשה allgemein als „Frau“ oder im ehelichen Sinn als „Ehefrau“ wiederzugeben ist
  choice: Ehefrau
  alternative: Frau
  rationale: Das Hebräische allein lässt beide Möglichkeiten zu. Der griechische Paralleltext beschreibt eine Frau in Beziehung zu einem Mann beziehungsweise Ehemann und legt damit den ehelichen Sinn nahe. Da die Entscheidung lexikalisch und kontextuell, nicht lehrmäßig, begründet ist, nennt die Fußnote ausdrücklich die offenere hebräische Alternative.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit knapper, spruchhafter Satzform. „Gehen … mit“ gibt den hebräischen Verbalgedanken idiomatisch wieder, ohne die Beziehung ausdrücklich als bloßen Nutzen zu deuten. Das Semikolon erhält die Zweiteiligkeit und den steigernden Gegensatz des Weisheitsspruchs.
