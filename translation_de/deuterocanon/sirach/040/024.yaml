  text: A brother and a companion are for a time of trouble[a], but righteousness delivers more than both.
translation:
  language: de
  text: Ein Bruder und ein Gefährte sind für die Zeit der Not da; doch Gerechtigkeit rettet mehr als beide.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Parallelüberlieferung liest hier „Mildtätigkeit“ (auch: „Almosengeben“ oder „Barmherzigkeit“) statt „Gerechtigkeit“.'
    reason: alternative_reading
lexical_decisions:
- source_word: אח
  choice: Bruder
  rationale: Das hebräische Wort bezeichnet zunächst den leiblichen Bruder und kann erweitert einen nahen Verwandten oder Verbundenen meinen. Der konkrete familiäre Ausdruck bleibt erhalten.
- source_word: ושותף
  choice: und ein Gefährte
  rationale: שותף bezeichnet jemanden, der mit einem anderen Anteil hat oder an etwas teilnimmt. „Gefährte“ gibt hier die persönliche Verbundenheit und gegenseitige Unterstützung natürlicher wieder als das im Deutschen oft geschäftlich oder partnerschaftlich verstandene „Partner“.
- source_word: לעת צרה
  choice: für die Zeit der Not
  rationale: Die Wendung bezeichnet eine bedrängende Krisenzeit. „Zeit der Not“ ist verständlich, würdig und nah am hebräischen Ausdruck.
- source_word: ומשניהם
  choice: doch … mehr als beide
  rationale: Die hebräische Formulierung stellt das Folgende vergleichend über die beiden zuvor genannten menschlichen Stützen. „Mehr als beide“ bewahrt diesen knappen Vergleich.
- source_word: צדק
  choice: Gerechtigkeit
  rationale: Der erhaltene hebräische Text bietet צדק, dessen Grundbedeutung „Gerechtigkeit“ beziehungsweise „Rechtschaffenheit“ ist. Die abweichende ethische Akzentsetzung der griechischen Parallelüberlieferung wird in der Fußnote bewahrt.
- source_word: מצלת
  choice: rettet
  rationale: Das Verb bezeichnet das Befreien oder Retten aus Gefahr. „Rettet“ ist im heutigen Deutsch unmittelbar verständlich und trägt hier keinen notwendig eingeengten heilsgeschichtlichen Sinn.
theological_decisions:
- issue: Hebräisches צדק gegenüber griechischem ἐλεημοσύνη im Höhepunkt des Vergleichs
  choice: Im Haupttext steht nach dem erhaltenen Hebräisch „Gerechtigkeit“.
  alternative: Die griechische Parallelüberlieferung hat „Mildtätigkeit“, auch als „Almosengeben“ oder „Barmherzigkeit“ übersetzbar.
  rationale: Der vorhandene hebräische Zeuge hat für den Haupttext Vorrang. Da die griechische Lesart den ethischen Schwerpunkt deutlich verändert und möglicherweise auf einer abweichenden Vorlage oder einer deutenden Übersetzung beruht, wird sie ausdrücklich in einer Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Weisheitsspruchform und der zugespitzte Vergleich des Hebräischen bleiben erhalten; das Semikolon macht die Steigerung im Deutschen klar.
