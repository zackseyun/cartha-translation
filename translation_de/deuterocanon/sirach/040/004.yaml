translation_notes:
  register: Moderne, würdige Standardsprache. Die symmetrische Formulierung „von dem, der …, bis zu dem, der …“ macht die im Hebräischen knappe Spannweitenformel verständlich; die ungewöhnliche Kleidungsbildsprache bleibt erhalten.
