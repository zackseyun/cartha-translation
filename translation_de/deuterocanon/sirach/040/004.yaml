  text: from one with a small turban and a flowered crown[a], even to one wrapped in a garment of skin.
translation:
  language: de
  text: von dem, der Turban und Diadem trägt,[a] bis zu dem, der in ein Fellgewand gehüllt ist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Griechisch: „von dem, der Blaupurpur und einen Kranz trägt, bis zu dem, der mit grobem Leinen bekleidet ist.“ Die hebräischen und griechischen Textzeugen unterscheiden sich in den konkreten Kleidungsbildern, bezeichnen aber dieselbe gesellschaftliche Spannweite.'
    reason: textual_variant
lexical_decisions:
- source_word: מעוטה
  choice: kleinen
  rationale: Als attributive Bestimmung zu צניף verstanden. „Klein“ gibt den hebräischen Wortlaut zurück, ohne den gesellschaftlichen Rang ausdrücklich auszudeuten.
- source_word: צניף
  choice: Turban
  rationale: Bezeichnet eine gewickelte Kopfbedeckung; „Turban“ ist im Deutschen knapp, anschaulich und im Zusammenhang mit dem Kopfschmuck natürlich.
- source_word: וציץ
  choice: und ein Blütendiadem
  rationale: ציץ kann eine Blüte und übertragen einen Stirnschmuck oder ein Diadem bezeichnen. „Blütendiadem“ bewahrt sowohl die florale Bildkomponente des Hebräischen als auch den im griechischen Zeugen erkennbaren Sinn eines Kranzes beziehungsweise einer Krone.
- source_word: ועד
  choice: bis zu
  rationale: Kennzeichnet den Endpunkt der im größeren Zusammenhang beschriebenen gesellschaftlichen Spannweite.
- source_word: עוטה
  choice: gehüllt ist
  rationale: Das Partizip beschreibt das Bedeckt- oder Eingehülltsein und verbindet sich im Deutschen natürlich mit einem Gewand.
- source_word: שמלת עור
  choice: Fellgewand
  rationale: Gibt die wörtliche Bedeutung „Gewand aus Haut/Fell“ knapp wieder, ohne festzulegen, ob verarbeitetes Leder oder rohe Tierhaut gemeint ist.
