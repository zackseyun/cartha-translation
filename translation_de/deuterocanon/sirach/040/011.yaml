  text: Everything from the earth returns to the earth[a], and what is from above to what is above.
translation:
  language: de
  text: Alles, was von der Erde stammt, kehrt zur Erde zurück,[a] und was von oben stammt, kehrt zu dem zurück, was oben ist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Text lautet: „Und aus den Wassern kehrt es zum Meer zurück.“'
    reason: alternative_reading
lexical_decisions:
- source_word: כל
  choice: Alles, was
  rationale: Das hebräische כל ist umfassend; zusammen mit dem folgenden Ausdruck lässt es sich im Deutschen natürlich als „Alles, was“ wiedergeben, ohne den Bezug auf Personen einzuengen.
- source_word: מארץ אל ארץ
  choice: von der Erde … zur Erde
  rationale: Die Wiederholung von ארץ wird bewahrt und bezeichnet Herkunft und Rückkehr. „Erde“ passt zum kosmischen Parallelismus besser als das engere „Erdboden“.
- source_word: ישוב
  choice: kehrt … zurück
  rationale: שוב bedeutet hier „zurückkehren“; die deutsche Verbklammer gibt die Rückbewegung klar und idiomatisch wieder.
- source_word: ואשר
  choice: und was
  rationale: Der Relativausdruck wird sachlich statt personal verstanden, entsprechend dem umfassenden, kosmischen Zusammenhang.
- source_word: ממרום אל מרום
  choice: von oben … zu dem, was oben ist
  rationale: Die räumliche Bildsprache und die rätselhafte Wiederholung von מרום bleiben erhalten, ohne den Ausdruck vorschnell als „Himmel“ zu bestimmen.
theological_decisions:
- issue: Abweichung der zweiten Vershälfte zwischen hebräischem und griechischem Text
  choice: 'Der erhaltene hebräische Wortlaut wird im Haupttext wiedergegeben: „und was von oben kommt, zu dem, was oben ist“.'
  alternative: 'Der griechische Text lautet sinngemäß: „und aus den Wassern kehrt es zum Meer zurück“.'
  rationale: Wo der hebräische Sirachtext erhalten ist, dient er als Primärzeuge. Seine knappe und mehrdeutige Formulierung wird nicht harmonisiert; die wesentlich abweichende griechische Überlieferung wird in einer Fußnote dokumentiert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz bewahrt den Parallelismus und die echte Unbestimmtheit des hebräischen zweiten Glieds; „von oben“ vermeidet eine unbelegte Festlegung auf den Himmel.
