translation:
  language: de
  text: Die Furcht vor Gott ist wie ein Garten voller Segen[a]; mehr als alle Herrlichkeit bietet sie Schutz.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „wie ein Eden des Segens“; die griechische Parallele lautet „wie ein Paradies des Segens“.'
    reason: lexical_alternative
  - marker: b
    text: 'Der letzte Satzteil ist im knappen Hebräisch schwierig. Die griechische Parallele stützt das Bild schützenden Bedeckens, hat aber formal die Lesart: „und sie bedeckten ihn mehr als alle Herrlichkeit“.'
    reason: alternative_reading
lexical_decisions:
- source_word: יִרְאַת אֱלֹהִים
  choice: die Furcht vor Gott
  rationale: Die Übersetzung folgt dem erhaltenen hebräischen Text mit אֱלֹהִים („Gott“) und bewahrt mit „Furcht“ den biblischen Ausdruck, ohne ihn auf bloße Ehrfurcht zu verengen.
- source_word: כְּעֵדֶן בְּרָכָה
  choice: wie ein Garten voller Segen
  rationale: עֵדֶן weckt das Bild Edens; die griechische Parallele παράδεισος bestätigt die Vorstellung eines Gartens. Die Formulierung gibt das Bild in natürlichem Deutsch wieder, während die Fußnote die wörtlichere Fassung nennt.
- source_word: וְעַל כָּל כָּבוֹד
  choice: mehr als alle Herrlichkeit
  rationale: עַל hat hier, gestützt durch griechisch ὑπὲρ πᾶσαν δόξαν, vergleichenden Sinn. „Herrlichkeit“ bewahrt die religiöse und bildhafte Weite von כָּבוֹד besser als das engere „Ehre“.
- source_word: חָפְתָה
  choice: bietet sie Schutz
  rationale: Das Verb bezeichnet ein Bedecken beziehungsweise schützendes Umhüllen. Die deutsche Fassung bringt die Schutzwirkung idiomatisch zum Ausdruck, ohne ein im vorliegenden hebräischen Wortlaut nicht ausdrücklich genanntes Objekt einzuführen.
theological_decisions:
- issue: Gottesbezeichnung im Haupttext
  choice: Gott
  alternative: Herr
  rationale: Der erhaltene hebräische Zeuge liest אֱלֹהִים („Gott“). Das griechische Κυρίου („Herrn“) wird als Parallelüberlieferung berücksichtigt, ersetzt aber hier nicht die hebräische Lesart.
- issue: Bedeutungsumfang der Gottesfurcht
  choice: Furcht vor Gott
  alternative: Ehrfurcht vor Gott
  rationale: „Furcht“ erhält die Spannung des biblischen Begriffs und lässt dessen Bedeutungsspektrum einschließlich ehrfürchtiger Scheu offen; „Ehrfurcht“ allein würde den Ausdruck vorschnell abschwächen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Parallelismus und das Bild vom schützenden Bedecken bleiben erkennbar; die knappe hebräische Schlussklausel wird für verständliches Deutsch behutsam idiomatisiert.
