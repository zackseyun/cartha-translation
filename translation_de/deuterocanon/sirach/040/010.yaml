  verdict: revise
  source_fidelity: 'Der Hauptsatz folgt dem erhaltenen Hebräisch: על רשע wird als generischer Singular wiedergegeben, רעה bleibt mit „Übel“ bewusst weit, und die schwer verständliche Schlusswendung wird nicht durch die griechische Sintflutlesart ersetzt. Die griechische Fassung ist in der Fußnote zutreffend als wesentlich abweichende Parallelüberlieferung dokumentiert.'
  naturalness: „Die Vernichtung ... ist vollendet“ ist im Deutschen unnötig schwerfällig und wirkt semantisch tautologisch. „Ganz vollzogen“ gibt die gedachte vollständige Auswirkung idiomatischer wieder, ohne den knappen und schwierigen Charakter der hebräischen Klausel aufzulösen.
  terminology: „Frevler“ hat ein passendes weisheitlich-gerichtliches Register und wahrt den generischen Singular. „Übel“ ist als offene Wiedergabe von רעה angemessen. „Vernichtung“ ist für כלה als mögliche Lesung vertretbar; die Formulierung der Vollendung sollte jedoch sprachlich geglättet werden.
  issues:
