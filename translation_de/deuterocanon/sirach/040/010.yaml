  text: For the wicked[a], evil was created, and because of them destruction will cease only when it is complete.
translation:
  language: de
  text: Für den Frevler wurde Übel erschaffen, und seinetwegen weicht die Vernichtung erst, wenn sie ganz vollzogen ist.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Parallelüberlieferung lautet: „Dies alles wurde für die Gesetzlosen erschaffen, und ihretwegen entstand die Sintflut.“ Ihr Schlusssatz weicht wesentlich vom erhaltenen hebräischen Text ab.'
    reason: alternative_reading
lexical_decisions:
- source_word: על רשע
  choice: Für den Frevler
  rationale: על kann hier eine Beziehung im Sinn von „für“, „über“ oder „gegen“ bezeichnen. „Für den Frevler“ lässt die genaue Richtung offen; der hebräische Singular wird als generische Bezeichnung beibehalten.
- source_word: נבראה רעה
  choice: wurde Übel erschaffen
  rationale: רעה kann sowohl moralisch Böses als auch erfahrbares Unheil oder Verderben bezeichnen. „Übel“ bewahrt diese Bedeutungsbreite besser als das stärker moralisch klingende „Böses“ oder das enger gefasste „Unheil“.
- source_word: ובעבור
  choice: und seinetwegen
  rationale: 'בעבור bezeichnet Ursache oder Anlass: „wegen, um ... willen“. Das im knappen Hebräisch nicht ausdrücklich genannte Bezugswort wird aus dem vorangehenden generischen Singular „der Frevler“ erschlossen.'
- source_word: תמוש
  choice: hört ... auf
  rationale: מוש kann „weichen“, „sich entfernen“ oder „aufhören“ bedeuten. Im Zusammenhang mit כלה ergibt „aufhören“ eine verständliche deutsche Formulierung, ohne die Vorstellung des Endens aufzugeben.
- source_word: כלה
  choice: die Vernichtung ... wenn sie vollendet ist
  rationale: כלה kann Ende, vollständigen Verbrauch oder Vernichtung bezeichnen. Die schwierige, gedrängte Wendung wird so wiedergegeben, dass das Aufhören erst mit der vollständigen Auswirkung der Vernichtung eintritt; die im Griechischen genannte Flut wird nicht in den hebräischen Haupttext übernommen.
theological_decisions:
- issue: Bedeutet רעה moralisch Böses oder strafendes Unheil?
  choice: Übel
  alternative: Böses; Unheil; Verderben
  rationale: „Übel“ erhält die semantische Spannung zwischen moralischem Bösen und widerfahrendem Unheil und vermeidet eine unnötige dogmatische Festlegung darüber, was erschaffen wurde.
- issue: Abweichung der hebräischen Schlussklausel von der griechischen Überlieferung
  choice: Der Haupttext folgt dem erhaltenen Hebräisch; die griechische Lesart steht in der Fußnote.
  alternative: „und ihretwegen entstand die Sintflut“
  rationale: Da ein hebräischer Textzeuge vorhanden ist, bildet er die Grundlage. Die griechische Parallelüberlieferung bietet eine materiell andere Schlussaussage, die für die Textgeschichte bedeutsam ist und deshalb ausdrücklich dokumentiert wird.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Frevler“ entspricht dem weisheitlichen Gerichtsregister; „Übel“ bewahrt die Mehrdeutigkeit von רעה. Die ungewöhnliche Aussage des hebräischen Schlusssatzes wird nicht durch die klarere griechische Fassung ersetzt.
