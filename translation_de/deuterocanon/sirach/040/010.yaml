    issue: Die Wendung „wenn sie vollendet ist“
    rationale: Das feminine Pronomen bezieht sich zwar formal auf „Vernichtung“, doch „eine Vernichtung wird vollendet“ klingt im modernen Standarddeutsch unnatürlich und verschleiert die Aussage. „Wenn sie ganz vollzogen ist“ wahrt die beabsichtigte Vorstellung vollständiger Auswirkung klarer.
