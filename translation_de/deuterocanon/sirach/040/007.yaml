  text: Again he prepares for battle[a], and he wakes up, and there is no terror; then he finds rest.
translation:
  language: de
  text: Wieder macht er sich zum Kampf bereit[a]; dann wacht er auf, und kein Schrecken ist da; so findet er Ruhe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Wieder ordnet er zum Kampf.“ Die griechische Fassung weicht deutlich ab und lautet sinngemäß: „Zur Zeit seiner Rettung erwacht er und wundert sich, dass keine Furcht da ist.“ Der Haupttext folgt dem erhaltenen hebräischen Text, der für Jesus Sirach, soweit vorhanden, die vorrangige Textgrundlage bildet.'
    reason: alternative_reading
lexical_decisions:
- source_word: עוד
  choice: Wieder
  rationale: Das Wort führt eine weitere, sich wiederholende bedrängende Erfahrung in der Abfolge ein.
- source_word: עורך מלחמה
  choice: macht er sich zum Kampf bereit
  rationale: ערך bezeichnet das Ordnen oder Aufstellen, besonders zum Kampf. Die deutsche Wendung gibt das militärische Bild natürlich wieder, ohne unnötig konkrete Taktik einzutragen.
- source_word: והקיץ
  choice: dann wacht er auf
  rationale: קיץ bedeutet aus dem Schlaf erwachen. „Dann“ verdeutlicht lediglich die im hebräischen Satz angelegte zeitliche Folge.
- source_word: ואימה אין
  choice: und kein Schrecken ist da
  rationale: Die knappe, verblos formulierte Aussage wird möglichst unmittelbar wiedergegeben; der beim Erwachen als unwirklich erkannte Schrecken ist nicht mehr vorhanden.
- source_word: ומצא מנוח
  choice: so findet er Ruhe
  rationale: מנוח bezeichnet Ruhe oder Rast. „So“ verbindet das Finden der Ruhe behutsam mit dem Erwachen und dem Ausbleiben des Schreckens.
