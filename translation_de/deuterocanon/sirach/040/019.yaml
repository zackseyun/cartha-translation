  source_fidelity: Der Haupttext gibt die griechische Vergleichslesart γυνὴ ἄμωμος sachgerecht wieder und dokumentiert die abweichende, an dieser Stelle schwierige hebräische Geniza-Lesart in der Fußnote. »Kinder« entspricht dem kollektiven hebräischen ילד und dem griechischen Plural τέκνα. Für οἰκοδομὴ πόλεως ist »der Aufbau einer Stadt« angemessen.
  naturalness: Die vorliegende Formulierung ist verständlich, doch »einen Namen fortbestehen lassen« wirkt im modernen Deutschen semantisch und stilistisch weniger idiomatisch. »einen Namen sichern« ist knapper, natürlich und wahrt die Bildsprache des Ausgangstextes. »gilt« ist für den aphoristischen Vergleich natürlicher als die Passivform »wird ... geschätzt«.
  terminology: »Untadelige Frau« gibt γυνὴ ἄμωμος präzise und ohne unzulässige dogmatische Zuspitzung wieder. »Frau« erhält gegenüber dem engeren »Ehefrau« die lexikalische Offenheit des Griechischen. Die Fußnoten beschreiben das Textproblem zutreffend; die hebräische Formulierung sollte jedoch nicht durch »offenbar« stärker als nötig als verderbt beurteilt werden.
