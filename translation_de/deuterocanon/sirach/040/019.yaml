  text: Children and the building of a city establish a name[b][a], but better than both is a blameless wife.
translation:
  language: de
  text: Kinder und der Aufbau einer Stadt sichern einen Namen; doch höher als beide gilt eine untadelige Frau.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hebräische Text aus der Kairoer Geniza lautet hier ungefähr: »Und aus beiden geht Weisheit hervor.« Der griechische Paralleltext hat dagegen: »Doch höher als beide gilt eine untadelige Frau.« Da das hebräische Satzglied textlich unsicher ist, folgt der Haupttext der klareren griechischen Lesart.'
    reason: alternative_reading
  - marker: b
    text: Die ältere Masada-Rolle ist an dieser Stelle nur bruchstückhaft erhalten und bietet nicht genug Text, um den genauen Wortlaut sicher zu bestimmen.
    reason: textual_variant
lexical_decisions:
- source_word: ילד / τέκνα
  choice: Kinder
  rationale: Das hebräische Singularwort wird hier kollektiv gebraucht; der griechische Plural bestätigt den Sinn »Kinder/Nachkommen«.
- source_word: ועיר יעמידו שם / οἰκοδομὴ πόλεως στηρίζουσιν ὄνομα
  choice: der Aufbau einer Stadt lassen einen Namen fortbestehen
  rationale: Das überlieferte Hebräisch ist knapp und schwierig. Der griechische Paralleltext verdeutlicht den Stadtaufbau; »einen Namen fortbestehen lassen« bewahrt das Bild eines dauerhaft begründeten Namens beziehungsweise Ansehens.
- source_word: שם
  choice: einen Namen
  rationale: »Name« kann im Hebräischen bleibendes Ansehen oder Nachruhm bezeichnen. Die wörtliche Bildsprache bleibt im Deutschen verständlich.
- source_word: ὑπὲρ ἀμφότερα … λογίζεται
  choice: doch höher als beide wird … geschätzt
  rationale: Die Formulierung gibt den ausdrücklichen Vergleich des griechischen Textes wieder, ohne ihn unnötig zu verstärken.
- source_word: γυνὴ ἄμωμος
  choice: eine untadelige Frau
  rationale: »Untadelig« bezeichnet einen einwandfreien Ruf oder Lebenswandel, ohne absolute Sündlosigkeit zu behaupten. »Frau« erhält die im Griechischen mögliche Spannung zwischen Frau und Ehefrau.
theological_decisions:
- issue: Abweichung zwischen dem erhaltenen hebräischen Text und dem griechischen Paralleltext im letzten Satzglied
  choice: Der Haupttext folgt der in sich stimmigen griechischen Lesart »eine untadelige Frau«.
  alternative: 'Den hebräischen Text als »und aus beiden geht Weisheit hervor« beziehungsweise »und mehr als beide: Weisheit zu finden« wiedergeben.'
  rationale: Das hebräische מוצא חכמה ist an dieser Stelle textkritisch unsicher und passt nur schwer zum Vergleichsgefüge. Der griechische Paralleltext bietet eine klare, kohärente Lesart; die abweichende hebräische Überlieferung wird ausdrücklich in der Fußnote bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper weisheitlicher Satzstruktur. Die Wendung »einen Namen fortbestehen lassen« wahrt das semitische Bild, während »höher … geschätzt« den griechischen Vergleich natürlich ausdrückt.
