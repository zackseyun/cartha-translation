base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/040/015.yaml
  text: The offspring of violence will not go unpunished[b][a], for the root of the godless is on a jagged crag.
translation:
  language: de
  text: Was der Gewalt entspringt, bleibt nicht ungestraft[a]; denn die Wurzel des Gottlosen steht auf einem schroffen Felszahn[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Parallele lautet: „Die Nachkommen der Gottlosen werden keine zahlreichen Zweige treiben, und unreine Wurzeln liegen auf einem schroff abgehauenen Felsen.“ Sie bestätigt das Bild verdorbenen Wachstums, weicht aber vom erhaltenen hebräischen Wortlaut ab.'
    reason: alternative_reading
  - marker: b
    text: Die hebräische Schlusswendung ist schwierig. Wörtlich steht dort ein „Zahn“ aus Fels, also ein scharfer Felsvorsprung oder eine schroffe Felsklippe.
    reason: lexical_alternative
lexical_decisions:
- source_word: נוצר
  choice: was … entspringt
  rationale: Die Form bezeichnet hier am ehesten das Hervorgebrachte beziehungsweise die Nachkommenschaft. Die offene Formulierung bewahrt diese Spannweite; die griechische Parallele ἔκγονα stützt besonders den Gedanken an Nachkommen.
- source_word: מחמס
  choice: der Gewalt
  rationale: חמס bezeichnet Gewalt, Unrecht oder gewaltsame Rücksichtslosigkeit. „Gewalt“ gibt den scharfen Grundsinn des erhaltenen hebräischen Textes wieder.
- source_word: לא ינקה
  choice: bleibt nicht ungestraft
  rationale: Die verneinte Form von נקה drückt idiomatisch aus, dass jemand oder etwas nicht freigesprochen beziehungsweise nicht von Strafe verschont wird.
- source_word: שרש
  choice: Wurzel
  rationale: Der hebräische Text hat den Singular und setzt das Bild eines Gewächses fort.
- source_word: חנף
  choice: des Gottlosen
  rationale: חנף bezeichnet hier einen gottlosen oder frevlerischen Menschen. „Gottloser“ gibt die moralisch-religiöse Bedeutung verständlich wieder, ohne sie auf Heuchelei zu verengen.
- source_word: על שן תלע
  choice: auf einem schroffen Felszahn
  rationale: שן bedeutet wörtlich „Zahn“ und kann bildlich einen scharfen Felsvorsprung bezeichnen; תלע weist wahrscheinlich auf eine steile oder zerklüftete Felsformation. „Felszahn“ bewahrt das konkrete Bild, während „schroff“ die durch die griechische Parallele bestätigte Beschaffenheit ausdrückt.
theological_decisions:
- issue: Vorrang des hebräischen Textes gegenüber der abweichenden griechischen Parallele
  choice: 'Der erste Halbvers folgt dem Hebräischen: Was der Gewalt entspringt, bleibt nicht ungestraft.'
  alternative: Die Nachkommen der Gottlosen werden keine zahlreichen Zweige treiben.
  rationale: Da ein hebräischer Text erhalten ist, bildet er die Grundlage. Die griechische Fassung bezeugt eine verwandte Vorstellung von verdorbenem Nachwuchs und misslingendem Wachstum, weicht aber in Wortlaut und Akzent deutlich ab; sie wird deshalb in einer Fußnote dokumentiert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Was der Gewalt entspringt“ klingt natürlich und bewahrt die mögliche Bedeutung als Nachkommenschaft oder als hervorgebrachte Folge. „Felszahn“ erhält das markante hebräische Bild; die Fußnote erläutert die schwierige Wendung.
