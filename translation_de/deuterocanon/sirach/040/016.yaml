translation:
  language: de
  text: Wie Gestrüpp an den Pflanzungen eines Baches[a][b] verdorren sie vor jedem Regen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische כקרדמות ist unsicher. Die griechische Parallelüberlieferung spricht von Bewuchs an Wasser und Flussufer, der noch vor allem anderen Gras ausgerissen wird. „Gestrüpp“ bezeichnet daher allgemein wenig beständigen Bewuchs und keine sicher bestimmte Pflanzenart.
    reason: lexical_alternative
  - marker: b
    text: Der ältere Textzeuge aus Masada scheint an dieser Stelle eine deutlich andere Lesart zu bieten als der hier zugrunde gelegte hebräische Text aus der Kairoer Geniza. Wegen der nur bruchstückhaften Überlieferung folgt der Haupttext der Kairoer Lesart.
    reason: textual_variant
lexical_decisions:
- source_word: כקרדמות
  choice: wie Gestrüpp
  rationale: Das seltene bzw. unsichere Wort bezeichnet hier wahrscheinlich niedrigen, wenig beständigen Bewuchs. „Gestrüpp“ bewahrt die allgemeine Pflanzenmetapher, ohne eine bestimmte Art vorzutäuschen.
- source_word: על מטעי נחל
  choice: an den Pflanzungen eines Baches
  rationale: מטעי bezeichnet Pflanzungen, נחל einen Bach bzw. ein zeitweise wasserführendes Tal. Die Formulierung hält sowohl den landwirtschaftlichen als auch den gewässernahen Bildbereich fest.
- source_word: מפני כל מטר
  choice: vor jedem Regen
  rationale: מפני kann räumlich oder ursächlich „vor, angesichts, wegen“ bedeuten. Die formnahe Wiedergabe „vor jedem Regen“ erhält diese leichte Mehrdeutigkeit.
- source_word: נדעכו
  choice: verdorren sie
  rationale: Das Verb bezeichnet ein Erlöschen, Vergehen oder Dahinschwinden. Im Pflanzenbild gibt „verdorren“ den Vorgang natürlich wieder, ohne die sonst mögliche Löschmetapher einzuführen.
