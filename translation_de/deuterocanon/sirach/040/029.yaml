base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/040/029.yaml
  text: A man who watches another’s table—his life is not to be counted as life[a]; he defiles his appetite with another man’s delicacies[b], but a man who knows inward restraint will beware.
translation:
  language: de
  text: Ein Mann, der auf den Tisch eines anderen blickt – sein Leben ist nicht als Leben zu zählen.[a] Er verunreinigt sich durch die Speisen eines anderen; doch ein Mann, der innere Selbstbeherrschung kennt[b], wird sich hüten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich steht im Hebräischen »der Tisch eines anderen«; auch das Griechische hat »ein Tisch, der einem anderen gehört«. Gemeint ist die Abhängigkeit von den Lebensmitteln eines anderen, nicht notwendig von einem Menschen anderer Herkunft.
    reason: lexical_alternative
  - marker: b
    text: 'Der hebräische Schluss ist schwer verständlich; wörtlich heißt es etwa »ein Mann, der das Geheimnis der Eingeweide kennt«. Das Griechische deutet: »Ein verständiger und gebildeter Mann wird sich hüten.« Dies stützt den Sinn innerer Selbstbeherrschung oder besonnener Zurückhaltung.'
    reason: alternative_reading
lexical_decisions:
- source_word: איש משגיח
  choice: Ein Mann, der … schaut
  rationale: Die maskuline Einzahl und das Bild des aufmerksamen Blickens bleiben erhalten; der Zusammenhang lässt zugleich Abhängigkeit vom Essen eines anderen anklingen.
- source_word: שלחן זר
  choice: der Tisch eines anderen
  rationale: זר bezeichnet hier am ehesten etwas, das einem anderen gehört, nicht notwendig etwas ethnisch Fremdes. Das griechische ἀλλοτρίαν τράπεζαν bestätigt diese Bedeutung.
- source_word: אין חייו למנות חיים
  choice: sein Leben ist nicht als Leben zu zählen
  rationale: Die betonte Wiederholung von חיים wird bewahrt; zugleich bleibt die sprichwortartige Aussage im Deutschen verständlich.
- source_word: מעוג לנפש מטעמו
  choice: Er verunreinigt sein Verlangen mit den Leckerbissen eines anderen
  rationale: Der hebräische Wortlaut ist schwierig. נפש kann im Zusammenhang des Essens das Verlangen beziehungsweise den Appetit bezeichnen. Die griechische Parallele spricht vom Verunreinigen der eigenen ψυχή durch fremde Speisen und stützt den Gesamtsinn.
- source_word: סוד מעים
  choice: innere Selbstbeherrschung
  rationale: Wörtlich ist von einem »Geheimnis/inneren Rat der Eingeweide« die Rede. Die Wiedergabe erhält den Gedanken einer inneren Regung und bringt ihn mit der griechischen Deutung als besonnenes Sich-Hüten zusammen.
- source_word: φυλάξεται
  choice: wird sich hüten
  rationale: Die griechische Parallele macht die Folgerung ausdrücklich und beschreibt umsichtiges Selbstbewahren.
theological_decisions:
- issue: Verhältnis des schwierigen hebräischen Schlusses zur griechischen Parallele
  choice: Der Haupttext verbindet das hebräische Bild des Inneren mit dem griechisch bezeugten Gedanken besonnener Zurückhaltung.
  alternative: 'Wörtlich: »ein Mann, der das Geheimnis der Eingeweide kennt«; nach dem Griechischen: »ein verständiger und gebildeter Mann wird sich hüten«.'
  rationale: Die gewählte Fassung vermeidet sowohl eine unverständliche Wort-für-Wort-Wiedergabe als auch die vollständige Ersetzung des hebräischen Bildes durch die griechische Auslegung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die sprichwortartige Wiederholung von »Leben« bleibt erhalten. Der schwierige hebräische Schluss wird lesbar wiedergegeben, ohne seine Bildwelt oder die abweichend deutende griechische Überlieferung zu verschweigen.
