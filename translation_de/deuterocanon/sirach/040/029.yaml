  source_fidelity: 'Die Grundaussage wird zutreffend wiedergegeben: Das Ausrichten auf den Tisch eines anderen steht für erniedrigende Abhängigkeit; die Wiederholung von »Leben« bleibt erhalten. Der schwierige mittlere hebräische Satzteil wird mit Hilfe der griechischen Parallele vertretbar als Verunreinigung durch die Speisen eines anderen verstanden. »Verlangen« ist für נפש im Essenskontext jedoch weniger treffend und im heutigen Deutsch unnötig mehrdeutig; »sich durch die Speisen eines anderen verunreinigen« gibt die griechisch gestützte Aussage direkter wieder. Der dunkle Schluss darf nicht als eindeutige hebräische Aussage über »Selbstbeherrschung« erscheinen; die Fußnote muss unmittelbar dort verankert sein.'
