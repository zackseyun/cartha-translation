  terminology: »Tisch eines anderen«, »Leben«, »Speisen« und »sich hüten« sind angemessen. »Innere Selbstbeherrschung« ist als lesbare, aber deutende Wiedergabe des unklaren סוד מעים nur mit einer direkt zugeordneten Erläuterung vertretbar.
