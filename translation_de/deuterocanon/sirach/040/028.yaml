base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/040/028.yaml
  text: My child[a], do not live the life of a beggar[b]; it is better to die than to beg.
translation:
  language: de
  text: Mein Kind[a], führe nicht das Leben eines Bettlers[b]; es ist besser, zu sterben[c], als zu betteln[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Anrede „Mein Kind“ steht im griechischen Paralleltext; in der erhaltenen hebräischen Zeile fehlt sie.
    reason: textual_source
  - marker: b
    text: Der zugrunde liegende hebräische Ausdruck ist schwer verständlich. Der griechische Paralleltext bezeichnet eindeutig ein Leben vom Betteln oder Almosenerbitten.
    reason: lexical_alternative
  - marker: c
    text: Hebräisch wörtlich „gesammelt zu werden“, eine Umschreibung für den Tod; der griechische Paralleltext sagt ausdrücklich „zu sterben“.
    reason: idiom
  - marker: d
    text: Das entsprechende hebräische Wort ist dunkel; die Bedeutung „betteln“ wird durch den griechischen Paralleltext gestützt.
    reason: alternative_reading
lexical_decisions:
- source_word: חיי
  choice: das Leben eines
  rationale: Die Konstruktform bezeichnet hier idiomatisch eine Lebensweise. Die deutsche Wendung bewahrt das Lebensmotiv und klingt zugleich natürlich.
- source_word: מכי מתן
  choice: Bettlers
  rationale: Der hebräische Ausdruck ist schwierig. Der griechische Paralleltext mit ἐπαίτησις weist klar auf ein vom Betteln beziehungsweise Almosenerbitten geprägtes Leben.
- source_word: אל תחי
  choice: führe nicht
  rationale: Wörtlich steht „lebe nicht“. In Verbindung mit „das Leben eines Bettlers“ ist „führe nicht“ im Deutschen die natürliche Wiedergabe.
- source_word: טוב
  choice: es ist besser
  rationale: טוב wird hier vergleichend gebraucht; der griechische Paralleltext bestätigt dies mit κρεῖσσον.
- source_word: נאסף
  choice: zu sterben
  rationale: Das hebräische „gesammelt werden“ ist eine Umschreibung für den Tod. Der griechische Paralleltext gibt den Sinn ausdrücklich mit ἀποθανεῖν wieder.
- source_word: כמסתולל
  choice: als zu betteln
  rationale: Die hebräische Form ist dunkel; das griechische ἐπαιτεῖν stützt eindeutig die Bedeutung „betteln“.
- source_word: τέκνον
  choice: Mein Kind
  rationale: Die Anrede steht im griechischen Paralleltext, fehlt jedoch in der erhaltenen hebräischen Zeile. „Mein Kind“ gibt die persönliche Weisheitsanrede geschlechtsübergreifend und idiomatisch wieder.
