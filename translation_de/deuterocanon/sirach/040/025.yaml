lexical_decisions:
- source_word: זהב וכסף
  choice: Gold und Silber
  rationale: Die geläufige Paarformel für materiellen Reichtum wird entsprechend dem Hebräischen und dem griechischen Paralleltext wörtlich bewahrt.
- source_word: יעמידו רגל
  choice: geben sicheren Halt
  rationale: Wörtlich wird der Fuß zum Stehen gebracht. Die deutsche Wendung gibt die Bedeutung natürlicher wieder, während die Fußmetapher in der Fußnote offengelegt wird.
- source_word: ומשניהם
  choice: doch mehr als beide
  rationale: Die knappe hebräische Vergleichsformulierung bedeutet, dass der folgende Rat Gold und Silber übertrifft; das griechische ὑπὲρ ἀμφότερα bestätigt diesen komparativen Sinn.
- source_word: עצה טובה
  choice: guter Rat
  rationale: Dies entspricht den Grundbedeutungen von עצה und טובה eng und klingt im Deutschen natürlich und sprichwortartig.
