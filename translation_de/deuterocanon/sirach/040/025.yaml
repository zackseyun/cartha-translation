  footnotes:
  - marker: a
    text: 'Wörtlich: »Gold und Silber geben dem Fuß festen Stand, und über beide hinaus: guter Rat.« Auch der griechische Paralleltext bewahrt das Bild vom Fuß und stellt den Rat über beides.'
