base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/040/005.yaml
  text: Yet envy[a], anxiety, and fear, and the dread of death, bring contention in abundance; and at the time of his rest upon his bed[b], the sleep of night changes his misery.
translation:
  language: de
  text: 'Doch Neid, Sorge und Angst, Todesfurcht, Zorn und Streit.


    Wenn er auf seinem Lager ruht, verändert der Schlaf der Nacht sein Leid.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „verändert seine Not“ oder „wandelt sein Unglück“. Gemeint ist wahrscheinlich sein leidvoller Zustand, nicht moralische Bosheit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קנאה
  choice: Neid
  rationale: Im Zusammenhang mit Sorge, Angst und Todesfurcht bezeichnet das Wort eine quälende Leidenschaft. „Neid“ gibt diesen negativen Sinn im heutigen Deutsch klar wieder; möglich wäre auch „Eifersucht“.
- source_word: דאגה
  choice: Sorge
  rationale: Das hebräische Wort bezeichnet belastende, beunruhigende Sorge. „Sorge“ ist natürlich und bewahrt die emotionale Schwere.
- source_word: פחד
  choice: Angst
  rationale: „Angst“ entspricht hier dem allgemeinen menschlichen Erschrecken und bildet mit der nachfolgenden stärkeren Todesfurcht eine verständliche Steigerung.
- source_word: אימת מות
  choice: die Furcht vor dem Tod
  rationale: Die Genitivverbindung bezeichnet ausgeprägte Todesfurcht. Die Formulierung ist würdig und verständlich, ohne die Intensität unnötig zu überzeichnen.
- source_word: תחרה ורב
  choice: entfachen heftigen Streit
  rationale: Die hebräische Wendung ist stark verdichtet und unsicher. Die Wiedergabe nimmt den wahrscheinlichen Gedanken des Anfachens und des großen beziehungsweise heftigen Streits auf; die griechische Parallele stützt den Bezug auf Zorn und Streit.
- source_word: ועת נוחו על משכבו
  choice: Und wenn er auf seinem Lager ruht
  rationale: Die temporale Aussage wird idiomatisch wiedergegeben. „Lager“ erhält den leicht gehobenen, poetischen Ton.
- source_word: שינת לילה
  choice: der Schlaf der Nacht
  rationale: Die Genitivkonstruktion des Hebräischen bleibt erhalten und klingt im Deutschen bewusst poetisch.
- source_word: תשנה
  choice: verändert
  rationale: Das Verb bedeutet „ändern, verändern“; auch die griechische Parallele bestätigt diesen Grundsinn.
- source_word: רעתו
  choice: sein Leid
  rationale: רעה bezeichnet hier wahrscheinlich den leidvollen Zustand des Menschen und nicht moralische Bosheit. „Leid“ wahrt diese Bedeutung und lässt die knappe Aussage des Hebräischen bestehen.
theological_decisions:
- issue: Hebräischen Text als Hauptzeugnis verwenden und die schwierige erste Zeile mithilfe der griechischen Parallele prüfen
  choice: Die Hauptübersetzung folgt dem erhaltenen Hebräisch und gibt תחרה ורב vorsichtig als „entfachen heftigen Streit“ wieder.
  alternative: Die griechische Aufzählung ausdrücklich erweitern und zusätzlich Zorn, Aufruhr und Wut nennen.
  rationale: Das erhaltene Hebräisch ist die primäre Grundlage. Die griechische Parallele bestätigt zwar das Bedeutungsfeld von Zorn und Streit, rechtfertigt aber nicht, ihre vollständigere Aufzählung ohne Kennzeichnung in den Haupttext einzufügen.
- issue: Bedeutung von רעתו im Zusammenhang mit dem nächtlichen Schlaf
  choice: „sein Leid“ als Bezeichnung des bedrängten Zustands
  alternative: „sein Unglück“, „seine Not“ oder wörtlich „sein Böses“
  rationale: Der Kontext behandelt menschliche Bedrängnis, nicht persönliche moralische Bosheit. Zugleich bleibt mit „Leid“ offen, in welcher Weise der nächtliche Schlaf diesen Zustand verändert.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit leicht gehobenem poetischem Klang. Die parallele Satzführung und „Lager“ bewahren die Würde der Weisheitsdichtung; schwierige Stellen werden nicht durch eine konfessionelle oder spekulative Deutung vereindeutigt.
