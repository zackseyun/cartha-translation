  text: Pestilence and bloodshed, strife and the sword, devastation and ruin, calamity and death.
translation:
  language: de
  text: Pest und Blutvergießen, Streit[a] und Schwert, Verwüstung und Verderben, Unheil und Tod.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das seltene hebräische Wort kann auch im Sinn von »Zwietracht« oder »entfachter Streit« verstanden werden.
    reason: Bewahrt die lexikalische Unsicherheit von חרחר, ohne den Haupttext unnötig zu belasten.
lexical_decisions:
- source_word: דבר
  choice: Pest
  rationale: Bezeichnet eine tödliche Seuche oder Pest; die knappe deutsche Wiedergabe entspricht dem katalogartigen Stil.
- source_word: דם
  choice: Blutvergießen
  rationale: Wörtlich »Blut«; in dieser Reihe menschlicher Bedrängnisse bezeichnet es naheliegend gewaltsames Blutvergießen.
- source_word: חרחר
  choice: Streit
  rationale: Das seltene Wort wird als Bezeichnung für entfachten Streit beziehungsweise Zwietracht verstanden; auch die griechische Parallele ἔρις stützt »Streit«.
- source_word: חרב
  choice: Schwert
  rationale: Direkte und bildkräftige Entsprechung für Krieg und gewaltsamen Tod.
- source_word: שד
  choice: Verwüstung
  rationale: Gibt Zerstörung und Verheerung wieder und bewahrt die Paarung mit dem folgenden Begriff.
- source_word: שבר
  choice: Verderben
  rationale: Kann Bruch, Zusammenbruch oder Ruin bezeichnen; »Verderben« klingt in der Aufzählung natürlich und unterscheidet sich von שד.
- source_word: רעה
  choice: Unheil
  rationale: Im Kontext nicht moralisch verengend als »Böses«, sondern als widerfahrendes Unglück beziehungsweise Unheil wiedergegeben.
- source_word: מות
  choice: Tod
  rationale: Unmittelbare Entsprechung des hebräischen Nomens.
