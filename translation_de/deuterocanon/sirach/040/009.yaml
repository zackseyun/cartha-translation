  source_fidelity: 'Die Übersetzung folgt dem hebräischen Text in der Abfolge und in allen acht Gliedern: דבר („Pest/Seuche“), דם („Blut“, kontextgemäß „Blutvergießen“), חרחר, חרב, שד, שבר, רעה und מות. „Streit“ für das seltene חרחר wird durch die griechische Parallele ἔρις zusätzlich gestützt. Die gegenüber der griechischen Parallele abweichende erste Lesart wird zu Recht nach dem vorliegenden hebräischen Text als „Pest“ wiedergegeben.'
