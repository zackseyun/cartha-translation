  text: Kindness will never be shaken[b][a], and righteousness will stand forever.
translation:
  language: de
  text: Güte wird niemals wanken[a][b], und Gerechtigkeit wird für immer Bestand haben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Eine abweichende hebräische Lesart aus Masada ist an dieser Stelle nur bruchstückhaft erhalten und erlaubt keine hinreichend sichere vollständige Übersetzung.
    reason: textual_variant
  - marker: b
    text: 'Die griechische Parallelüberlieferung lautet: „Gnade ist wie ein Paradies voller Segnungen, und Almosengeben bleibt in Ewigkeit bestehen.“ Der hebräische Text bietet dagegen „Güte … und Gerechtigkeit …“.'
    reason: alternative_reading
lexical_decisions:
- source_word: וחסד
  choice: Güte
  rationale: חסד umfasst Güte, Barmherzigkeit und beständige Zuwendung. Da hier kein ausdrücklicher Bundesrahmen vorliegt, gibt „Güte“ die ethische Tugend klar und allgemein verständlich wieder.
- source_word: לעולם לא ימוט
  choice: wird niemals wanken
  rationale: ימוט bezeichnet das Wanken oder den Verlust festen Standes. „Wird niemals wanken“ bewahrt dieses Bild dauerhafter Festigkeit in natürlichem Deutsch.
- source_word: וצדקה
  choice: Gerechtigkeit
  rationale: צדקה kann Gerechtigkeit, rechtschaffenes Handeln und in späterem Sprachgebrauch auch Wohltätigkeit bezeichnen. Der vorhandene hebräische Text spricht hier für „Gerechtigkeit“; die abweichende griechische Überlieferung wird in einer Fußnote dokumentiert.
- source_word: לעד תכון
  choice: wird für immer Bestand haben
  rationale: תכון bezeichnet Feststehen, Gefestigtsein oder dauerhaften Bestand. Die Formulierung ist idiomatisch und erhält die Parallele zur Beständigkeit im ersten Satzglied.
theological_decisions:
- issue: Hebräischer Kairo-Geniza-Text gegenüber der griechischen Parallelüberlieferung
  choice: Im Haupttext der hebräischen Lesart „Gerechtigkeit wird für immer Bestand haben“ folgen.
  alternative: 'Die griechische Überlieferung lautet sinngemäß: „Gnade ist wie ein Paradies voller Segnungen, und Almosengeben bleibt in Ewigkeit bestehen.“'
  rationale: Da ein hebräischer Text mit hoher Sicherheit vorliegt, erhält er Vorrang. Die erheblich abweichende griechische Fassung wird transparent in einer Fußnote bewahrt, ohne beide Überlieferungen stillschweigend anzugleichen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die beiden parallelen Aussagen bleiben knapp und bildhaft; „Güte“ und „Gerechtigkeit“ bewahren die Breite der hebräischen Tugendbegriffe, während die Fußnoten die textgeschichtliche Spannung offenlegen.
