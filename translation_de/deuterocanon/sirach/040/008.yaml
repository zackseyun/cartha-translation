  source_fidelity: 'Der Haupttext gibt die hebräische Zeile vollständig wieder: Sorge begleitet „alles Fleisch“, und der Reichtum stört beziehungsweise vertreibt den Schlaf. Die griechische Erweiterung bleibt zutreffend als abweichende, ausführlichere Parallelüberlieferung in der Fußnote.'
  naturalness: „Bei allem Fleisch ist ihre Sorge bei ihnen“ ist im Deutschen unnötig schwerfällig und die doppelte Ortsbestimmung klingt unnatürlich. „Alle Lebewesen werden von Sorge begleitet“ vermittelt den kollektiven Sinn von כל בשר in modernem, würdevollem Deutsch. „Ihnen den Schlaf vertreibt“ ist idiomatischer als „ihren Schlaf vertreibt“.
  terminology: „Lebewesen“ ist hier als natürliche deutsche Wiedergabe von „alles Fleisch“ angemessen, ohne die im griechischen Paralleltext ausdrücklich genannte Weite von Mensch bis Tier zu unterschlagen. „Sorge“ und „Reichtum“ treffen die hebräischen Begriffe sachgerecht.
