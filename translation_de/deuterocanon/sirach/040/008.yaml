  yaml_path: translation/deuterocanon/sirach/040/008.yaml
  text: And with all flesh their anxiety is with them[a], and their wealth drives away their sleep.
translation:
  language: de
  text: Und alle Lebewesen werden von Sorge begleitet, und ihr Reichtum vertreibt ihnen den Schlaf.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Parallelüberlieferung lautet ausführlicher: „bei allem Fleisch, vom Menschen bis zum Tier, und bei den Sündern siebenfach mehr als dies.“ Diese zusätzlichen Worte stehen nicht in der hier zugrunde gelegten erhaltenen hebräischen Zeile.'
    reason: alternative_reading
lexical_decisions:
- source_word: ועם כל בשר
  choice: Und bei allem Fleisch
  rationale: בשר ist hier kollektiv gebraucht. Die bewusst knappe Wendung „alles Fleisch“ bewahrt die Bildsprache und den umfassenden Bezug des Hebräischen.
- source_word: דאגתם עמם
  choice: ist ihre Sorge bei ihnen
  rationale: דאגה bezeichnet belastende Sorge oder Unruhe; עמם bedeutet wörtlich „bei/mit ihnen“. Die Formulierung erhält das Bild einer Sorge, die sie begleitet.
- source_word: ועשרם
  choice: und ihr Reichtum
  rationale: עשרם bezeichnet ihren Reichtum beziehungsweise ihre Habe. „Reichtum“ ist im Deutschen natürlich und semantisch direkt.
- source_word: מניד שנתם
  choice: vertreibt ihren Schlaf
  rationale: Die Wendung beschreibt, wie der Schlaf in Bewegung gebracht, gestört oder verscheucht wird. „Vertreibt ihren Schlaf“ bewahrt das kräftige Bild und klingt idiomatisch.
- source_word: ἐπὶ ἁμαρτωλῶν ἑπταπλάσια πρὸς ταῦτα
  choice: nicht in den Haupttext aufgenommen
  rationale: Die griechische Parallelüberlieferung enthält einen zusätzlichen Satzteil, der in der vorliegenden hebräischen Zeile fehlt; er wird deshalb nur in der Fußnote dokumentiert.
theological_decisions:
- issue: Vorrang der erhaltenen hebräischen Fassung gegenüber der ausführlicheren griechischen Parallelüberlieferung
  choice: Der Haupttext folgt der erhaltenen hebräischen Zeile; die griechische Erweiterung steht in der Fußnote.
  alternative: „… vom Menschen bis zum Tier, und über die Sünder siebenfach mehr als dies.“ in den Haupttext aufnehmen.
  rationale: Wo für Jesus Sirach Hebräisch erhalten ist, bildet es die primäre Textgrundlage. Die griechische Fassung ist ein wichtiger Zeuge, doch ihre hier zusätzliche Aussage soll nicht stillschweigend in den hebräisch begründeten Haupttext eingefügt werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wendung „alles Fleisch“ bleibt als verständliche biblische Kollektivbezeichnung erhalten; der leicht fremdartige Parallelismus folgt bewusst der knappen hebräischen Dichtung.
