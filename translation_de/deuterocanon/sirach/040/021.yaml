  text: Flute and harp make song sweet[a], but better than both is a pure tongue.
translation:
  language: de
  text: Flöte und Harfe lassen ein Lied lieblich klingen, doch besser als beide ist eine reine Zunge.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Parallele hat: „doch mehr als beide eine liebliche Zunge“, sinngemäß auch: „angenehme Rede“.'
    reason: alternative_reading
lexical_decisions:
- source_word: חליל
  choice: Flöte
  rationale: Das hebräische Wort bezeichnet ein Blasinstrument, eine Flöte oder Pfeife. „Flöte“ ist die verständlichste heutige Entsprechung und passt zum griechischen αὐλός.
- source_word: נבל
  choice: Harfe
  rationale: Gemeint ist ein gezupftes Saiteninstrument. „Harfe“ entspricht dem vertrauten biblischen Sprachgebrauch; auch das griechische ψαλτήριον weist auf ein Zupfinstrument.
- source_word: יעריבו שיר
  choice: lassen ein Lied lieblich klingen
  rationale: יעריבו beschreibt hier das Angenehm- oder Lieblichmachen. Die Formulierung gibt den verursachenden Sinn idiomatisch wieder und bewahrt שיר als „Lied“.
- source_word: ומשניהם
  choice: doch besser als beide
  rationale: Die knappe hebräische Vergleichsformulierung bedeutet sinngemäß „über beide hinaus“. Im Deutschen bringt „besser als beide“ den wertenden Vergleich klar zum Ausdruck; das griechische ὑπὲρ ἀμφότερα bestätigt ihn.
- source_word: לשון
  choice: Zunge
  rationale: Das konkrete Bild der Zunge wird beibehalten, obwohl das Wort hier metonymisch für das Reden steht. Dies entspricht auch dem griechischen γλῶσσα.
- source_word: ברה
  choice: rein
  rationale: Das hebräische Adjektiv bedeutet am ehesten „rein“ oder „lauter“. „Rein“ bewahrt die ethische oder qualitative Schärfe des hebräischen Textes, während die griechische Parallele „lieblich/angenehm“ liest.
theological_decisions:
- issue: Hebräisch-griechische Bedeutungsnuance in der Schlusswendung
  choice: eine reine Zunge
  alternative: eine liebliche Zunge; angenehme Rede
  rationale: Der erhaltene hebräische Text לשון ברה ist vorrangig und wird am natürlichsten als „eine reine Zunge“ verstanden. Die griechische Parallele γλῶσσα ἡδεῖα bietet die bedeutsame Nuance „eine liebliche/angenehme Zunge“, die in der Fußnote erhalten bleibt, ohne die hebräische Lesart zu verdrängen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Lieblich klingen“ gibt die Wirkung der Instrumente natürlich wieder; „reine Zunge“ erhält das konkrete biblische Bild und die Mehrdeutigkeit zwischen Zunge und Rede.
