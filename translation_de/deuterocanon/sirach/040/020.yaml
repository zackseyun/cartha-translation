translation:
  language: de
  text: Wein und Rauschtrank erfreuen das Herz, doch mehr als beide erfreut die Liebe Liebender.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: „die Liebe Liebender“; der Ausdruck kann auch Liebkosungen oder erotische Liebe bezeichnen. Die griechische Überlieferung liest abweichend: „und mehr als beide die Liebe zur Weisheit“; dort steht außerdem „Musik“ statt „Rauschtrank“.'
    reason: Die semantische Mehrdeutigkeit des hebräischen Ausdrucks und die erhebliche Abweichung des griechischen Paralleltexts sollen sichtbar bleiben.
lexical_decisions:
- source_word: שכר
  choice: Rauschtrank
  rationale: Das hebräische Wort bezeichnet ein berauschendes, von Wein unterschiedenes Getränk; „Rauschtrank“ bewahrt diese Weite, ohne es unbelegt auf Bier oder hochprozentigen Schnaps festzulegen.
- source_word: יעליצו לב
  choice: erfreuen das Herz
  rationale: Gibt die kausative Bedeutung von עלץ natürlich und würdig wieder.
- source_word: אהבת דודים
  choice: die Liebe Liebender
  rationale: Bewahrt die mehrdeutige Verbindung aus Liebe und Liebenden beziehungsweise Geliebten und klingt im Deutschen knapper und natürlicher als „die Liebe von Liebenden“.
theological_decisions:
- issue: Abweichung der hebräischen und griechischen Überlieferung
  choice: 'Dem angegebenen hebräischen Quelltext folgen: „Rauschtrank“ und „Liebe Liebender“'
  alternative: 'Nach dem griechischen Paralleltext: „Musik“ und „Liebe zur Weisheit“'
  rationale: Der hebräische Text ist hier mit hoher Sicherheit als primäre Quelle vorgegeben. Die erheblich abweichende griechische Lesart wird deshalb nicht in den Haupttext eingemischt, sondern transparent in einer Fußnote genannt.
- issue: Deutung von אהבת דודים
  choice: Die zwischenmenschlich-erotische Mehrdeutigkeit als „Liebe Liebender“ erhalten
  alternative: Vereindeutigend „Liebeslust“, „Zärtlichkeit“ oder „Liebe zu den Geliebten“
  rationale: Der Ausdruck kann die Liebe von Liebenden, Liebkosungen oder erotische Liebe bezeichnen. Eine engere Festlegung würde die Spannung des Hebräischen unnötig auflösen.
translation_notes:
  register: Modernes, knappes und würdevolles Standarddeutsch. „Rauschtrank“ ist bewusst weiter als „Bier“ oder „Schnaps“; die ungewöhnliche, aber verständliche Formulierung „Liebe Liebender“ erhält die poetische Mehrdeutigkeit des Hebräischen.
