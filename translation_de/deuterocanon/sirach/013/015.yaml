translation:
  language: de
  text: Jede Art von Lebewesen hält sich zu ihresgleichen[a], und der Mensch wird mit seinesgleichen verbunden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Paralleltext lautet: »Jedes Lebewesen liebt seinesgleichen und jeder Mensch seinen Nächsten.« Der hebräische Haupttext betont dagegen, dass man sich mit seinesgleichen verbindet.'
    reason: alternative_reading
lexical_decisions:
- source_word: מִין כָּל בָּשָׂר
  choice: Jede Art von Lebewesen
  rationale: Die hebräische Wendung lautet wörtlich etwa »Art allen Fleisches«. »Art von Lebewesen« bewahrt sowohl den Artbegriff מִין als auch den umfassenden Bezug von בָּשָׂר auf belebte Geschöpfe und ist im Deutschen verständlich.
- source_word: אֶצְלוֹ
  choice: hält sich zu ihresgleichen
  rationale: Der erste Halbvers ist im Hebräischen elliptisch. Die Formulierung gibt die räumlich-soziale Nähe wieder, ohne ausdrücklich das im griechischen Paralleltext stehende »liebt« in den hebräischen Haupttext einzutragen.
- source_word: יְחֻבַּר
  choice: wird … verbunden
  rationale: Die passive Form von חבר bezeichnet das Verbunden- oder Zusammengeschlossenwerden. Die passive deutsche Wiedergabe bleibt der hebräischen Form nahe.
- source_word: אָדָם
  choice: der Mensch
  rationale: אָדָם bezeichnet hier den Menschen im allgemeinen, nicht eigens einen erwachsenen Mann. »Der Mensch« erhält die generische, sprichwortartige Aussage in natürlichem modernem Deutsch.
- source_word: מִינוֹ
  choice: seinesgleichen
  rationale: Die Wendung bezeichnet Angehörige derselben Art oder Gruppe. »Seinesgleichen« gibt diese soziale Entsprechung knapp und idiomatisch wieder.
theological_decisions:
- issue: Hebräischer Hauptzeuge gegenüber dem abweichenden griechischen Paralleltext
  choice: Der Haupttext folgt der komprimierten hebräischen Aussage über die Verbindung mit seinesgleichen.
  alternative: »Jedes Lebewesen liebt seinesgleichen und jeder Mensch seinen Nächsten.«
  rationale: Da der hebräische Text erhalten und als zuverlässig bewertet ist, bestimmt er die Übersetzung. Der griechische Paralleltext bestätigt das Motiv der Ähnlichkeit, formuliert jedoch ausdrücklich »liebt« und im zweiten Halbvers »seinen Nächsten«; diese Unterschiede werden in der Fußnote bewahrt, statt in den Haupttext eingearbeitet zu werden.
translation_notes:
  register: Sprichwortartig, würdig und in modernem Standarddeutsch. Die Wiederholung von »seinesgleichen« bildet die parallele Struktur des Hebräischen ab; die Ellipse des ersten Halbverses wird behutsam zu einer verständlichen Aussage ergänzt.
