  naturalness: '„Von einem Freund zum anderen abgewiesen“ ist im Deutschen syntaktisch und semantisch weniger klar: „abweisen“ bezeichnet gewöhnlich die Zurückweisung durch eine Person, nicht eine Bewegung zu einer weiteren Person. „Von Freund zu Freund fortgetrieben“ gibt die hebräische Bewegungsfolge und die Härte von נִדְחָה klarer und idiomatischer wieder.'
  terminology: „Reicher“, „Armer“, „ins Wanken geraten“ und „gestützt“ sind modernes, angemessen würdiges Standarddeutsch und bewahren die sprichwörtliche Bildlichkeit. Die Wiedergabe der griechischen Variante ist sachlich und ohne dogmatische Vorentscheidung formuliert.
