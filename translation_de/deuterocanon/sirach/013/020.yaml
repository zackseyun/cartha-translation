  text: When a rich man stumbles[a], he is supported by a friend; but when a poor man stumbles[b], he is driven away from friend to friend.
translation:
  language: de
  text: Gerät ein Reicher ins Wanken, wird er von einem Freund gestützt; gerät aber ein Armer ins Wanken, wird er von Freund zu Freund fortgetrieben.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Wendung beschreibt, dass der Arme wiederholt von einem Freund zum nächsten weitergeschickt oder fortgetrieben wird, statt wirkliche Unterstützung zu erhalten.
    reason: lexical_alternative
  - marker: b
    text: 'Die griechische Überlieferung weicht hier erheblich ab: „Dem Hochmütigen ist Niedrigkeit ein Gräuel, ebenso ist dem Reichen ein Armer ein Gräuel.“ Wo der hebräische Text erhalten ist, dient er hier als Hauptquelle.'
    reason: textual_variant
lexical_decisions:
- source_word: עָשִׁיר
  choice: ein Reicher
  rationale: Der substantivierte Singular ist sprichwörtlich gebraucht und bezeichnet beispielhaft einen wohlhabenden Menschen.
- source_word: מוּט / נָמוֹט
  choice: ins Wanken geraten
  rationale: Die beiden Formen desselben Verbs bezeichnen Schwanken oder Taumeln, nicht notwendig einen endgültigen Sturz. Dieselbe Wiedergabe erhält den hebräischen Parallelismus.
- source_word: נִסְמָךְ
  choice: wird gestützt
  rationale: Die Passivform von סמך beschreibt konkrete Unterstützung und bildet den klaren Gegensatz zum Abgewiesenwerden des Armen.
- source_word: מֵרֵעַ
  choice: von einem Freund
  rationale: רֵעַ bezeichnet hier einen Freund oder Gefährten; die Präposition מן gibt im Zusammenhang die Person an, von der die Hilfe kommt.
- source_word: דַל
  choice: ein Armer
  rationale: דַל bezeichnet einen armen oder sozial schwachen Menschen und steht hier im wirtschaftlich-sozialen Gegensatz zu עָשִׁיר.
- source_word: נִדְחָה
  choice: wird … abgewiesen
  rationale: Das Verb bezeichnet Wegstoßen, Vertreiben oder Zurückweisen. „Abgewiesen“ klingt im Deutschen natürlich und bringt den sozialen Ausschluss zum Ausdruck.
- source_word: מֵרֵעַ אֶל רֵעַ
  choice: von einem Freund zum anderen
  rationale: Die Wendung bewahrt die Bewegungsrichtung des Hebräischen und deutet an, dass der Arme wiederholt weitergeschickt wird, statt Unterstützung zu erhalten.
theological_decisions:
- issue: Stark abweichende griechische Parallelüberlieferung
  choice: Der erhaltene hebräische Wortlaut bildet den Haupttext.
  alternative: 'Nach dem Griechischen: „Dem Hochmütigen ist Niedrigkeit ein Gräuel, ebenso ist dem Reichen ein Armer ein Gräuel.“'
  rationale: Für diesen Vers liegt ein verständlicher hebräischer Text vor. Die erhebliche Abweichung der griechischen Überlieferung wird deshalb nicht in den Haupttext eingearbeitet, sondern transparent in einer Fußnote dokumentiert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer sprichwörtlicher Parallelstruktur. „Ins Wanken geraten“ wahrt die Bildhaftigkeit des hebräischen Verbs, während „abgewiesen“ den sozialen Gegensatz zu „gestützt“ natürlich ausdrückt.
