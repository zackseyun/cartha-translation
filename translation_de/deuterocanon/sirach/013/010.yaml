  source_fidelity: Der Haupttext gibt die hebräische Mahnung mit ihrer antithetischen Spannung angemessen wieder. „Komm nicht zu nahe“ entspricht אַל תִּתְקָרֵב. Die schwierige erste Folge תִּתְרַחֵק wird mit „wirst du auf Abstand gehalten“ vorsichtig und im Licht der griechischen Parallele (Zurück-/Fortstoßen) sinnvoll wiedergegeben, ohne eine zu enge konkrete Szene festzulegen. „Halte dich aber auch nicht zu fern“ und „wirst du gehasst“ entsprechen dem zweiten hebräischen Glied; die abweichende griechische Folge „vergessen/vernachlässigt“ ist korrekt als Variante vermerkt.
  naturalness: Die Formulierung ist modernes, klares Standarddeutsch mit knappem, sprichwortartigem Rhythmus. „Auf Abstand gehalten“ ist idiomatisch und bewahrt die soziale Bildlichkeit; „aber auch“ hebt die beabsichtigte Ausgewogenheit der beiden Warnungen natürlich hervor.
  terminology: Die wesentlichen Begriffe sind treffend und registergerecht gewählt. „Gehasst“ wahrt die Stärke von תִּשָּׂנֵא und wird nicht durch eine theologisch oder sozial abschwächende Deutung ersetzt. Die Fußnoten unterscheiden zutreffend zwischen der Schwierigkeit des hebräischen ersten Glieds und der abweichenden griechischen Lesart im zweiten.
