  register: Knappe, würdige und sprichwortartige Standardsprache. Die beiden Gefahren—aufdringliche Nähe und übermäßige Distanz—werden durch den parallelen Satzbau hervorgehoben. „Auf Abstand gehalten“ vermeidet eine übermäßig konkrete Deutung und bewahrt die Unsicherheit der ersten hebräischen Satzhälfte.
