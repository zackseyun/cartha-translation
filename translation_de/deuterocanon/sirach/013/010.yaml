  text: Do not draw near[a], lest you be pushed away; and do not stay far off[b], lest you be hated.
translation:
  language: de
  text: Komm nicht zu nahe[a], sonst wirst du auf Abstand gehalten; halte dich aber auch nicht zu fern[b], sonst wirst du gehasst.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die erste Satzhälfte ist im überlieferten Hebräisch schwierig. Wörtlich kann sie auch verstanden werden: „Komm nicht nahe, sonst entfernst du dich.“ Die griechische Überlieferung hat sinngemäß: „Dränge dich nicht heran, damit du nicht zurückgewiesen wirst.“'
    reason: textual_variant
  - marker: b
    text: 'Die griechische Überlieferung hat hier statt „sonst wirst du gehasst“: „sonst wirst du vergessen“ oder „vernachlässigt“. Der Haupttext folgt dem erhaltenen hebräischen Wortlaut.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תִּתְקָרֵב
  choice: Komm nicht zu nahe
  rationale: Die Verneinung mit אַל formuliert ein Verbot. „Zu nahe kommen“ bewahrt den räumlichen und zugleich sozialen Sinn des hebräischen Verbs und klingt im Deutschen wie eine natürliche Weisheitsmahnung.
- source_word: פֶּן
  choice: sonst
  rationale: „Sonst“ gibt die warnende Folge von פֶּן in beiden Satzhälften knapp und idiomatisch wieder.
- source_word: תִּתְרַחֵק
  choice: du wirst auf Abstand gehalten
  rationale: Die überlieferte hebräische Form ist in der ersten Satzhälfte schwierig. Diese Wiedergabe bleibt beim Gedanken des Fernhaltens und berücksichtigt zugleich die griechische Parallele ἀπωσθῇς, „zurückgewiesen/abgestoßen werden“.
- source_word: וְאַל תִּתְרַחֵק
  choice: halte dich aber auch nicht zu fern
  rationale: Hier bezeichnet dasselbe hebräische Verbum eindeutig die entgegengesetzte Gefahr. Das ergänzte „aber auch“ macht die ausgewogene Mahnung im Deutschen deutlich, ohne ihren Sinn zu verändern.
- source_word: תִּשָּׂנֵא
  choice: du wirst gehasst
  rationale: Das hebräische Verb bedeutet gewöhnlich „gehasst werden“. Die kräftige Formulierung bleibt im Haupttext erhalten; die abweichende, mildere griechische Lesart wird in einer Fußnote genannt.
