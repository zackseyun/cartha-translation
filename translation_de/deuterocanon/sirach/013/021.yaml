  text: A rich man speaks[a], and many are his supporters; even his ugly words are made beautiful.
translation:
  language: de
  text: Ein Reicher spricht, und viele stehen ihm bei; selbst seine hässlichen Worte werden schöngeredet.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Parallelüberlieferung weicht erheblich ab: „Gerät ein Reicher ins Wanken, wird er von Freunden gestützt; fällt aber ein Geringer, wird er sogar von Freunden weggestoßen.“ Der hebräische Text betont stattdessen, wie wohlwollend die Worte eines Reichen aufgenommen werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: עָשִׁיר
  choice: ein Reicher
  rationale: Der substantivierte Singular bezeichnet in sprichwörtlicher Weise einen beispielhaften reichen Mann; „ein Reicher“ ist im Deutschen knapp und natürlich.
- source_word: מְדַבֵּר
  choice: spricht
  rationale: Das Präsens bewahrt den allgemeinen, sprichwörtlichen Charakter der Aussage.
- source_word: וְעוֹזְרָיו רַבִּים
  choice: und viele stehen ihm bei
  rationale: 'Wörtlich: „und seine Helfer sind zahlreich“. Die idiomatische Formulierung gibt die gesellschaftliche Unterstützung wieder, ohne den Gedanken auf bloß praktische Hilfe zu verengen.'
- source_word: דְבָרָיו מְכוֹעֲרִין
  choice: seine hässlichen Worte
  rationale: „Hässlich“ bewahrt das anschauliche Gegensatzpaar mit dem folgenden Verb und kann im Deutschen auch moralisch oder inhaltlich Anstößiges bezeichnen.
- source_word: מְיוּפִּין
  choice: werden schöngeredet
  rationale: Die passive Form lässt erkennen, dass andere seine anstößigen Worte in ein günstiges Licht rücken. „Schöngeredet“ ist natürliches modernes Deutsch und bewahrt zugleich die Ironie des hebräischen Gegensatzes.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit sprichwörtlicher Kürze. „Schöngeredet“ vermittelt den passiven sozialen Vorgang idiomatisch und erhält den pointierten Gegensatz zwischen „hässlich“ und „schön“.
