  text: A man's heart changes his face, whether for good or for bad.
translation:
  language: de
  text: Das Herz eines Menschen verändert sein Gesicht – zum Guten oder zum Schlechten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der griechische Paralleltext weicht hier deutlich ab. Sinngemäß spricht er von einem heiteren Gesicht als Zeichen eines auf Gutes gerichteten Herzens und fügt einen schwierigen Satz über das mühevolle Finden von Gleichnissen an. Da der hebräische Text dieses Verses erhalten ist, folgt der Haupttext dem Hebräischen; das Griechische bestätigt lediglich den allgemeinen Zusammenhang zwischen innerer Haltung und äußerem Ausdruck, nicht aber den genauen Wortlaut.
    reason: textual_variant
lexical_decisions:
- source_word: לֵב
  choice: Herz
  rationale: 'Bewahrt das konkrete hebräische Menschenbild: Das Herz bezeichnet hier das innere Denken und Empfinden, das sich im Gesicht zeigt.'
- source_word: אֱנוֹשׁ
  choice: eines Menschen
  rationale: Gibt den generisch gebrauchten Ausdruck natürlich und geschlechtsübergreifend wieder, ohne seine Einzahl aufzugeben.
- source_word: יְשַׁנֵּא
  choice: verändert
  rationale: Entspricht unmittelbar der Bedeutung „ändern, verändern“ und bezeichnet die Wirkung des Inneren auf den sichtbaren Gesichtsausdruck.
- source_word: פָנָיו
  choice: sein Gesicht
  rationale: Gibt die konkrete Körperbezeichnung wörtlich und in modernem Deutsch natürlich wieder.
- source_word: אִם לְטוֹב וְאִם לְרָע
  choice: zum Guten oder zum Schlechten
  rationale: Bewahrt die gegensätzlichen Möglichkeiten, ohne רָע unnötig auf moralisch Böses einzuengen.
