  source_fidelity: 'Der Haupttext gibt das Hebräische eng und zutreffend wieder: לֵב als „Herz“, אֱנוֹשׁ als generisches „eines Menschen“, יְשַׁנֵּא als „verändert“ und פָנָיו konkret als „sein Gesicht“. Die abschließende Gegenüberstellung „zum Guten oder zum Schlechten“ bewahrt die knappe, nicht weiter spezifizierte Gegensatzformel אִם לְטוֹב וְאִם לְרָע, ohne sie zu moralisieren oder auf konkrete Umstände festzulegen.'
