translation:
  language: de
  text: Wenn ein Vornehmer dich zu sich ruft[a], halte dich zurück; dann wird er dich umso näher zu sich rufen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das knappe Hebräisch kann wörtlicher auch verstanden werden: „Tritt zu einem Vornehmen; halte dich fern.“ Die griechische Parallelüberlieferung stützt die hier gewählte Bedeutung: Wenn ein Mächtiger dich ruft, halte dich zunächst zurück; dann wird er dich umso mehr zu sich rufen.'
    reason: alternative_reading
lexical_decisions:
- source_word: קָרֵב
  choice: dich zu sich ruft
  rationale: Die hebräische Form ist knapp und kann als Imperativ „Tritt näher“ verstanden werden. Im Zusammenhang mit יַגִּישֶׁךָ und gestützt durch das griechische προσκαλεσαμένου σε wird sie hier als Aufforderung beziehungsweise Einladung des Vornehmen wiedergegeben.
- source_word: נָדִיב
  choice: ein Vornehmer
  rationale: Das Wort bezeichnet hier einen gesellschaftlich hochgestellten und einflussreichen Menschen. „Vornehmer“ bewahrt die Statusaussage, ohne eine bestimmte Herrscherstellung vorauszusetzen.
- source_word: הֱיֶה רָחוֹק
  choice: halte dich zurück
  rationale: Der Imperativ fordert zu Abstand und gesellschaftlicher Zurückhaltung auf. Die Wendung klingt im modernen Deutschen natürlich und entspricht auch dem griechischen ὑποχωρῶν γίνου.
- source_word: וּכְדֵי כֵן
  choice: dann … umso
  rationale: Die Formulierung bezeichnet die entsprechende beziehungsweise gesteigerte Folge der Zurückhaltung. Das griechische τόσῳ μᾶλλον stützt ausdrücklich die Steigerung „umso“.
- source_word: יַגִּישֶׁךָ
  choice: wird er dich … näher zu sich rufen
  rationale: Das Verb mit Objektsuffix bezeichnet hier das Näherbringen. In Verbindung mit dem griechischen προσκαλέσεταί σε wird die gesellschaftliche Einladung idiomatisch als „zu sich rufen“ ausgedrückt; „näher“ erhält den Kontrast zum Zurückhalten.
theological_decisions: []
translation_notes:
