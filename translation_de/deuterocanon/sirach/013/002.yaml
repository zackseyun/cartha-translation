translation:
  language: de
  text: 'Was willst du tragen, das schwerer ist als du? Und wie willst du dich mit einem verbinden, der reicher ist als du?[a]


    Wie kann eine Tonscherbe mit einem Topf verbunden werden? Wenn der Topf an sie stößt, zerbricht die Scherbe. Oder wie kann ein Reicher mit einem Armen verbunden werden?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hebräische Text formuliert rhetorische Fragen. Der griechische Paralleltext hat Verbote: »Trage keine Last, die schwerer ist als du, und verbinde dich nicht mit einem, der mächtiger und reicher ist als du.«'
    reason: Dokumentiert die abweichende Satzform und den Zusatz »mächtiger« im griechischen Paralleltext, ohne ihn in den hebräischen Haupttext einzutragen.
lexical_decisions:
- source_word: כָּבֵד מִמְּךָ
  choice: eine Last, die zu schwer für dich ist
  rationale: Das Hebräische lautet wörtlich etwa »schwerer als du«; im Deutschen macht »Last« den durch נשׂא (tragen) vorausgesetzten Gegenstand natürlich und verständlich.
- source_word: תִּתְחַבָּר
  choice: schließ dich … an
  rationale: Die reflexive Hitpael-Form bezeichnet hier das Eingehen einer Verbindung oder Gemeinschaft. »Sich anschließen« bewahrt die allgemeine soziale Bedeutung, ohne eine besondere Vertrags- oder Freundschaftsbeziehung festzulegen.
- source_word: עָשִׁיר מִמְּךָ
  choice: der reicher ist als du
  rationale: Entspricht unmittelbar dem sicheren hebräischen Wortlaut und vermeidet es, den im griechischen Paralleltext zusätzlich genannten Gedanken größerer Macht ungekennzeichnet in den Haupttext aufzunehmen.
theological_decisions:
- issue: Form der Mahnung
  choice: 'Verbotssätze: »Trag keine …; schließ dich keinem … an«'
  alternative: 'Rhetorische Fragen: »Was willst du tragen …? Warum willst du dich … anschließen?«'
  rationale: Der erhaltene hebräische Text ist rhetorisch formuliert, während der griechische Paralleltext eindeutige Verbote bietet. Die imperativische Wiedergabe trifft die pragmatische Aussage der Weisheitsmahnung und stimmt mit der breiten Textüberlieferung überein; die Formabweichung wird in der Fußnote offengelegt.
translation_notes:
  register: Moderne, knappe und würdige Weisheitssprache. »Trag« und »schließ dich … an« sind allgemein verständlich; die Bildlichkeit der Last bleibt erhalten. Der Haupttext beschränkt sich entsprechend der Referenzabgrenzung auf den ersten hebräischen Sinnabschnitt.
