base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/013/007.yaml
  text: As long as you are useful[a], he will make sport of you; two or three times he will flatter you. Then he will look at you as if to pass beyond you[b], and he will shake his head at you.
translation:
  language: de
  text: Solange du ihm nützlich bist, treibt er sein Spiel mit dir[a]; zwei- oder dreimal schmeichelt er dir. Danach sieht er dich an, als wolle er an dir vorübergehen[b], und schüttelt den Kopf über dich.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort kann bedeuten, jemanden zu verspotten, zu täuschen oder geringschätzig mit ihm zu spielen.
    reason: lexical_alternative
  - marker: b
    text: 'Der hebräische Wortlaut dieses Satzteils ist schwierig. Der griechische Text führt den Gedanken weiter aus: Nachdem er dich ausgenutzt hat, sieht er dich später und lässt dich zurück. Die Übersetzung bewahrt vorsichtig das hebräische Bild des Vorübergehens und berücksichtigt zugleich den griechischen Paralleltext.'
    reason: textual_variant
lexical_decisions:
- source_word: עַד אֲשֶׁר תּוֹעִיל
  choice: Solange du ihm nützlich bist
  rationale: Die Wendung bezeichnet die Dauer beziehungsweise Bedingung seiner Zuwendung. Das im Deutschen ergänzte „ihm“ verdeutlicht den im Kontext und durch das griechische χρείαν ἔσχηκέν σου bestätigten Nutzen für den Reichen.
- source_word: יְהָתֵל בָּךְ
  choice: treibt er sein Spiel mit dir
  rationale: התל kann Verspotten, Täuschen oder ein geringschätziges Spiel mit jemandem bezeichnen. Die deutsche Wendung bewahrt den ausbeuterischen und spöttischen Beiklang, ohne die Bedeutung vorschnell auf offenen Hohn oder Betrug festzulegen.
- source_word: פַעֲמַיִם שָׁלֹשׁ
  choice: zwei- oder dreimal
  rationale: Die konkrete Zahlenfolge wird in einer natürlichen deutschen Form wiedergegeben und bezeichnet eine begrenzte Wiederholung.
- source_word: יַעֲרִיצֶךָ
  choice: schmeichelt er dir
  rationale: Im Zusammenhang ist keine aufrichtige Ehrung gemeint, sondern eine eigennützige, übertriebene Wertschätzung. Auch der griechische Paralleltext mit freundlichem Lächeln, schönen Worten und geweckter Hoffnung stützt diese Wiedergabe.
- source_word: וּבְכֵן
  choice: Danach
  rationale: Das Übergangswort markiert den Wechsel von vorübergehender Gunst zu abweisender Geringschätzung.
- source_word: יִרְאֲךָ לְהִתְעַבֵּר בָּךְ
  choice: sieht er dich nur an, um an dir vorüberzugehen
  rationale: Die schwierige hebräische Formulierung enthält wahrscheinlich die Vorstellung des Vorübergehens. „Nur“ bringt die demonstrative Nichtbeachtung idiomatisch zum Ausdruck; der griechische Paralleltext „er wird dich sehen und dich verlassen“ stützt den Sinn einer abweisenden Abkehr.
- source_word: וּבְרֹאשׁוֹ יָנִיעַ אֵלֶיךָ
  choice: schüttelt den Kopf über dich
  rationale: Die Kopfbewegung bezeichnet im Kontext Geringschätzung oder ablehnenden Spott. „Den Kopf über jemanden schütteln“ ist dafür die natürliche heutige deutsche Wendung und entspricht zugleich dem griechischen Paralleltext.
