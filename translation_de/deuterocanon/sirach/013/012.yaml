    rationale: Das hebräische קוֹשֵׂר קָשֶׁר ist eine intensivierende Verbindung derselben Wurzel und kann ein konspiratives Planen ausdrücken. „Verschwörung“ legt jedoch eher eine konkrete, häufig gemeinschaftlich organisierte Verschwörung nahe; „einen Plan schmieden“ wahrt die feindselige Planung mit weniger Zusatzannahmen.
  - severity: low
    issue: Die Fußnote bietet die unidiomatische Formulierung „er verschwört eine Verschwörung“.
    rationale: Sie bildet weder eine natürliche deutsche Wendung noch die hebräische figura etymologica sinnvoll ab. Die Wiederholung lässt sich mit „er plant einen Plan“ erläutern.
  - severity: low
    issue: „Er bestätigt den allgemeinen Sinn“ beschreibt das Verhältnis des stark abweichenden griechischen Paralleltexts zu positiv.
    rationale: Der griechische Text bietet in der ersten Vershälfte eine wesentlich andere Lesart. Er kann auf einen ähnlichen Kontext erbarmungslosen Handelns hinweisen, bestätigt aber nicht den hebräischen Wortlaut.
