translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit sprichwortartigem Präsens. Die Bildsprache des Stolpersteins, der Singular „das Leben“ und die feindselige Ausrichtung von עַל bleiben erhalten; die hebräische Wurzelwiederholung wird im Haupttext idiomatisch und in der Fußnote formal sichtbar gemacht.
