translation:
  language: de
  text: Ein grausamer Mensch legt einen Stolperstein und kennt kein Erbarmen.[a] Gegen das Leben vieler schmiedet er einen Plan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Paralleltext weicht wesentlich ab: „Erbarmungslos ist, wer Worte nicht bewahrt; und er wird gewiss nicht schonen, wenn es um Misshandlung und Fesseln geht.“ Er weist ebenfalls auf erbarmungslose Schädigung hin, doch der Haupttext folgt dem erhaltenen hebräischen Wortlaut.'
    reason: textual_variant
  - marker: b
    text: 'Wörtlich steht im Hebräischen mit nachdrücklicher Wiederholung derselben Wortwurzel: „Er plant einen Plan.“ Sinngemäß: „Er schmiedet Pläne gegen das Leben vieler.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַכְזָרִי
  choice: ein grausamer Mensch
  rationale: Das substantivisch gebrauchte Adjektiv bezeichnet einen grausamen oder erbarmungslosen Menschen. Die Formulierung wahrt den repräsentativen Singular und klingt im heutigen Deutsch natürlich.
- source_word: יִתֵּן כֹּשֶׂל
  choice: legt einen Stolperstein
  rationale: Die knappe hebräische Wendung bezeichnet, dass jemand etwas zum Straucheln oder Scheitern bereitet. „Einen Stolperstein legen“ bleibt dem Bild nahe und ist zugleich verständliches Deutsch.
- source_word: וְלֹא יַחְמוֹל
  choice: und kennt kein Erbarmen
  rationale: חמל kann „verschonen“ oder „Mitleid haben“ bedeuten. Die gewählte Wendung gibt die erbarmungslose Haltung prägnant wieder, ohne den Sinn übermäßig festzulegen.
- source_word: עַל נֶפֶשׁ רַבִּים
  choice: gegen das Leben vieler
  rationale: נפש bezeichnet hier angesichts der drohenden Schädigung am ehesten das Leben. Der Singular wird bewahrt; על erhält wegen der feindseligen Absicht die Bedeutung „gegen“.
- source_word: קוֹשֵׂר קָשֶר
  choice: schmiedet er eine Verschwörung
  rationale: Die figura etymologica derselben hebräischen Wurzel verstärkt das planvolle Verschwören. Die deutsche Verbindung „eine Verschwörung schmieden“ gibt den Nachdruck natürlich wieder, auch wenn sie die Wurzelwiederholung nicht formal nachbildet.
