  text: What fellowship has a wolf with a lamb? So a wicked man with a righteous man[b][a], and likewise a rich man with a man brought low.
translation:
  language: de
  text: Welche Gemeinschaft hat der Wolf mit dem Lamm? Ebenso wenig der Frevler mit dem Gerechten und der Reiche mit einem erniedrigten Mann.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: „der Reiche mit einem erniedrigten Mann“. Der letzte Ausdruck ist nicht ganz sicher; er kann einen gesellschaftlich niedrig gestellten oder in eine niedrige Lage geratenen Menschen bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Die griechische Parallelfassung lautet: „Alles Fleisch findet sich nach seiner Art zusammen, und ein Mensch wird sich an seinesgleichen halten.“ Sie bietet eine andere Gestalt des Spruchs, stimmt aber mit seinem Grundgedanken überein, dass sich Gleichartige miteinander verbinden.'
    reason: alternative_reading
lexical_decisions:
- source_word: מַה יְּחֻבַּר
  choice: Welche Gemeinschaft hat
  rationale: Das passive Verb חבר fragt rhetorisch nach Verbindung oder Gemeinschaft. Die gewählte Formulierung ist im Deutschen natürlich und bewahrt die rhetorische Kraft.
- source_word: זְאֵב אֶל כֶּבֶשׂ
  choice: der Wolf mit dem Lamm
  rationale: Die Tierbezeichnungen sind eindeutig; „Lamm“ hebt im Bild den Gegensatz zwischen Raubtier und verletzlichem Beutetier hervor.
- source_word: רָשָׁע לַצַּדִיק
  choice: der Frevler mit dem Gerechten
  rationale: Die substantivierten maskulinen Singularformen werden entsprechend der sprichwörtlichen Parallelstruktur wiedergegeben. „Frevler“ bezeichnet prägnant einen Menschen, der Unrecht tut.
- source_word: עָשִׁיר
  choice: der Reiche
  rationale: Die substantivierte generische Bezeichnung entspricht knapp und natürlich dem hebräischen Singular.
- source_word: אִישׁ נֶאֱצָל
  choice: einem erniedrigten Mann
  rationale: Der schwierige Ausdruck bezeichnet im Gegensatz zum Reichen wahrscheinlich einen gesellschaftlich herabgesetzten oder in niedrige Lage geratenen Mann. „Erniedrigt“ wahrt diese Breite, ohne die Bedeutung auf wirtschaftliche Armut festzulegen.
theological_decisions:
- issue: Repräsentativ maskuline Personenbezeichnungen im Weisheitsspruch
  choice: der Frevler / der Gerechte / der Reiche / ein erniedrigter Mann
  alternative: ein böser Mensch / ein gerechter Mensch / ein reicher Mensch / ein niedrig gestellter Mensch
  rationale: Der hebräische Text verwendet maskuline Singularformen. Die Übersetzung bewahrt diese grammatische und sprichwörtliche Gestalt, ohne den allgemeinen Anwendungsbereich des Spruchs einzuschränken.
- issue: Hebräischer Hauptzeuge gegenüber der abweichenden griechischen Parallelfassung
  choice: Das hebräische Bild von Wolf und Lamm steht im Haupttext
  alternative: „Alles Fleisch findet sich nach seiner Art zusammen, und ein Mensch wird sich an seinesgleichen halten.“
  rationale: Der erhaltene hebräische Text ist hier der primäre und mit hoher Sicherheit bezeugte Ausgangstext. Die deutlich anderslautende griechische Fassung wird als alternative Überlieferung in einer Fußnote dokumentiert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper sprichwörtlicher Struktur. „Ebenso wenig“ macht die rhetorisch verneinende Entsprechung im Deutschen ausdrücklich, ohne die Aussage sachlich zu erweitern. Die Fußnotenmarker stehen am Versende in ihrer normalen Reihenfolge.
