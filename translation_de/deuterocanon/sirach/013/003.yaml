base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/013/003.yaml
  text: If a rich man does wrong[a], he acts arrogantly; but if a poor man does wrong, he himself pleads for mercy.
translation:
  language: de
  text: Tut ein Reicher Unrecht, tritt er selbst überheblich auf; tut aber ein Armer Unrecht, fleht er selbst um Erbarmen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Text bietet hier einen völlig anderen Spruch: „Was hat ein Tontopf mit einem Kessel gemeinsam? Der eine stößt an, und der andere wird zerschmettert.“'
    reason: alternative_reading
lexical_decisions:
- source_word: עָשִׁיר
  choice: ein Reicher
  rationale: Die substantivierte Personenbezeichnung gibt den sozialen Gegensatz zu דַּל knapp und natürlich wieder.
- source_word: יְעַוֶּה
  choice: Unrecht tun
  rationale: Das Verb bezeichnet verkehrtes beziehungsweise schuldhaftes Handeln. „Unrecht tun“ bewahrt die moralische Aussage, ohne die Art des Vergehens enger festzulegen.
- source_word: יִתְנַוֶּה
  choice: überheblich auftreten
  rationale: Die reflexive Verbform beschreibt hier ein hochmütiges, anmaßendes Gebaren. Die Formulierung gibt sowohl die innere Haltung als auch ihr sichtbares Hervortreten wieder.
- source_word: דַּל
  choice: ein Armer
  rationale: Im Parallelismus bezeichnet דַּל einen sozial und wirtschaftlich Schwachen und steht im Gegensatz zum Reichen.
- source_word: יִתְחַנָּן
  choice: um Erbarmen flehen
  rationale: Das reflexive Verb aus חנן bezeichnet inständiges Bitten um Gunst oder Erbarmen; „flehen“ erhält die soziale Erniedrigung des Armen im Kontrast zum Hochmut des Reichen.
- source_word: הוּא
  choice: selbst
  rationale: Das zweimalige ausdrückliche Pronomen ist im Hebräischen betont. „Selbst“ bewahrt diese Hervorhebung in beiden parallelen Satzhälften.
theological_decisions:
- issue: Starke Abweichung zwischen dem hebräischen und dem griechischen Textzeugen
  choice: Der überlieferte hebräische Spruch über den Reichen und den Armen steht im Haupttext.
  alternative: 'Der griechische Text bietet stattdessen das Gefäßsprichwort: „Was hat ein Tontopf mit einem Kessel gemeinsam? Der eine stößt an, und der andere wird zerschmettert.“'
  rationale: Der angegebene hebräische Ausgangstext ist als hoch zuverlässig eingestuft und ergibt einen geschlossenen antithetischen Parallelismus. Die wesentlich andere griechische Überlieferung darf nicht mit ihm harmonisiert werden und wird daher als eigenständige Lesart in einer Fußnote dokumentiert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der symmetrische Satzbau bildet den hebräischen Gegensatz nach; das zweimalige „selbst“ erhält die Betonung von הוּא. „Tritt … überheblich auf“ ist verständlicher und idiomatischer als eine enge, aber im Deutschen unnatürliche Wiedergabe wie „gebärdet sich hochmütig“.
