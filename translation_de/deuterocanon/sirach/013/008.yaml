  text: Be careful not to be too bold[a], and do not make yourself like those who lack understanding.
translation:
  language: de
  text: Hüte dich, allzu vermessen aufzutreten,[a] und mach dich nicht denen gleich, denen es an Einsicht fehlt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Parallelüberlieferung lautet: „Gib acht, dass du nicht irregeführt wirst, und lass dich in deiner Freude nicht erniedrigen.“ Der hebräische und der griechische Text unterscheiden sich in diesem Vers erheblich.'
    reason: textual_variant
lexical_decisions:
- source_word: הִשָּׁמֵר
  choice: Hüte dich
  rationale: Der Niphal-Imperativ von שׁמר formuliert hier eine eindringliche Warnung. „Hüte dich“ ist im Deutschen natürlich, würdig und etwas stärker als „Sei vorsichtig“.
- source_word: אַל תִּרְהַב מְאֹד
  choice: allzu vermessen aufzutreten
  rationale: רהב bezeichnet hier ein anmaßendes, übermäßig selbstsicheres oder kühnes Verhalten. „Vermessen auftreten“ bewahrt den Verhaltensaspekt, ohne ausdrücklich Hochmut als innere Haltung festzulegen; „allzu“ gibt מְאֹד im Zusammenhang mit der Verneinung idiomatisch wieder.
- source_word: וְאַל תִּדְמֶה
  choice: mach dich nicht … gleich
  rationale: דמה bedeutet in diesem Zusammenhang „gleichen, ähnlich werden/sein“. Die reflexiv-volitionale Formulierung gibt die Aufforderung natürlich wieder, sich nicht das Verhalten der genannten Menschen anzueignen.
- source_word: בַּחֲסֵירֵי מַדָּע
  choice: denen, denen es an Einsicht fehlt
  rationale: חסירי מדע bezeichnet Menschen, denen Wissen, Verstand oder Einsicht fehlt. „Einsicht“ passt zum Kontext der Weisheitsliteratur und vermeidet das pauschal abwertende Substantiv „Unwissende“.
theological_decisions:
- issue: Erhebliche Abweichung zwischen dem erhaltenen hebräischen Text und der griechischen Parallelüberlieferung in beiden Vershälften
  choice: Der erhaltene hebräische Text steht im Haupttext; die griechische Fassung wird in einer Fußnote vollständig dokumentiert.
  alternative: 'Griechisch: „Gib acht, dass du nicht irregeführt wirst, und lass dich in deiner Freude nicht erniedrigen.“'
  rationale: Wo für Jesus Sirach Hebräisch erhalten ist, bildet es die vorrangige Ausgangsbasis. Da die griechische Fassung hier inhaltlich erheblich abweicht und nicht nur anders formuliert, wird die Differenz transparent festgehalten, ohne sie in den Haupttext einzumischen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Warnung bleibt knapp und eindringlich; „vermessen auftreten“ wahrt die Bedeutungsbreite von רהב zwischen übertriebener Kühnheit, Anmaßung und Selbstüberschätzung.
