translation:
  language: de
  text: Dem Hochmut ist Demut verhasst[a], und dem Reichen ist der Arme verhasst.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Text lautet: „Wildesel sind in der Wüste die Beute der Löwen; so sind die Armen die Nahrung der Reichen.“ Der hier erhaltene hebräische Text lautet dagegen: „Dem Hochmut ist Demut verhasst, und dem Reichen ist der Arme verhasst.“'
    reason: alternative_reading
lexical_decisions:
- source_word: תּוֹעֲבַת
  choice: ist … verhasst
  rationale: Die hebräische Konstruktverbindung bezeichnet starke Abneigung. „Ist … verhasst“ gibt die relationale Aussage natürlich und kräftig wieder, ohne den hier nicht zwingenden kultischen Beiklang von „Gräuel“ einzutragen.
- source_word: גַּאֲוָה
  choice: Stolz
  rationale: Das Abstraktum bezeichnet Stolz beziehungsweise Hochmut. „Stolz“ ist direkt, verständlich und wahrt die formale Gegenüberstellung mit „Demut“.
- source_word: עֲנָוָה
  choice: Demut
  rationale: Das Abstraktum bezeichnet Demut oder Niedrigkeit. „Demut“ ist im modernen Standarddeutsch die natürliche Entsprechung und verengt die Bedeutung nicht auf Sanftmut.
- source_word: עָשִׁיר
  choice: dem Reichen
  rationale: Der hebräische Singular steht sprichwörtlich und repräsentativ. Der substantivierte Singular erhält die Form des Ausgangstextes und bezeichnet zugleich allgemein den reichen Menschen.
- source_word: אֶבְיוֹן
  choice: der Arme
  rationale: Das Wort bezeichnet einen armen oder bedürftigen Menschen. „Der Arme“ bewahrt den repräsentativen Singular und bildet den klaren sozialen Gegensatz zu „dem Reichen“.
theological_decisions:
- issue: Hebräischer Text der Kairoer Geniza gegenüber der erheblich abweichenden griechischen Überlieferung
  choice: 'Der erhaltene hebräische Wortlaut bestimmt den Haupttext: „Dem Stolz ist Demut verhasst, und dem Reichen ist der Arme verhasst.“'
  alternative: 'Nach dem griechischen Zeugen: „Wildesel sind in der Wüste die Beute der Löwen; so sind die Armen die Weide der Reichen.“'
  rationale: Da für diesen Vers ein sicher bezeugter hebräischer Text vorliegt, erhält er Vorrang. Die griechische Fassung bietet nicht bloß eine stilistische Variante, sondern ein deutlich anderes Bild; deshalb wird sie als wichtige alternative Überlieferung in der Fußnote vollständig dokumentiert.
translation_notes:
  register: Knappes, würdiges Sprichwort in modernem Standarddeutsch. Die parallele Satzstruktur des Hebräischen bleibt erhalten; „verhasst“ vermittelt die starke Abneigung idiomatisch, ohne unnötig kultische Sprache zu verwenden.
