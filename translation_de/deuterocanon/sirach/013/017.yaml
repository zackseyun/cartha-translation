base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/013/017.yaml
  text: What peace can there be between a hyena and a dog? What peace can there be between a rich man and a poor man?[a]
translation:
  language: de
  text: Wie kann es Frieden geben zwischen einer Hyäne und einem Hund? Wie kann es Frieden geben zwischen einem reichen und einem armen Mann?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Parallelüberlieferung lautet: „Was hat ein Wolf mit einem Lamm gemeinsam? Ebenso ein Sünder mit einem Gottesfürchtigen.“ Der hebräische Text hat dagegen „Hyäne … Hund“ und „reicher Mann … armer Mann“.'
    reason: alternative_reading
lexical_decisions:
- source_word: מֵאַיִן
  choice: Wie kann es … geben?
  rationale: Die Wendung ist rhetorisch und bestreitet die Möglichkeit eines solchen Friedens; die deutsche Frageform gibt diese Funktion natürlich wieder.
- source_word: שָׁלוֹם
  choice: Frieden
  rationale: Das Wort bezeichnet Frieden beziehungsweise ein friedliches Verhältnis und wird direkt und würdevoll wiedergegeben.
- source_word: צָבוּעַ
  choice: Hyäne
  rationale: Im nachbiblischen Hebräisch und bei Ben Sira bezeichnet das Wort gewöhnlich die Hyäne; die abweichende Tiermetapher der griechischen Überlieferung bestimmt den erhaltenen hebräischen Wortlaut nicht.
- source_word: כָּלֶב
  choice: Hund
  rationale: Direkte lexikalische Entsprechung.
- source_word: עָשִׁיר
  choice: reichen Mann
  rationale: Bewahrt den maskulinen Singular und den sozialen Gegensatz zu רָשׁ.
- source_word: רָשׁ
  choice: armen Mann
  rationale: Bezeichnet einen armen oder bedürftigen Menschen; zusammen mit עָשִׁיר wird die maskuline singularische Paarung gewahrt.
theological_decisions:
- issue: Abweichung zwischen dem erhaltenen hebräischen Text und der griechischen Parallelüberlieferung
  choice: Im Haupttext steht das hebräische Bild „Hyäne … Hund“ sowie der Gegensatz „reicher … armer Mann“.
  alternative: 'Die griechische Parallelüberlieferung lautet: „Was hat ein Wolf mit einem Lamm gemeinsam? Ebenso ein Sünder mit einem Gottesfürchtigen.“'
  rationale: Wo der hebräische Text erhalten ist, hat er Vorrang. Die griechische Fassung bietet jedoch eine inhaltlich erheblich abweichende moralische Gegenüberstellung und wird deshalb in einer Fußnote dokumentiert, statt die Spannung aufzulösen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem sprichwörtlichem Ton. Die Wiederholung der vollständigen Frage bildet den hebräischen Parallelismus eng nach; die Formen „einem reichen und einem armen Mann“ vermeiden zugleich unnötige Schwerfälligkeit.
