translation:
  language: de
  text: Wenn ein Reicher spricht, verstummen alle; seine Einsicht[a] lassen sie bis an die Wolken reichen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Griechisch: »sein Wort«. Der hebräische Text hat »seine Einsicht« beziehungsweise »seinen Verstand«; ihm folgt die Übersetzung hier.'
    reason: alternative_reading
lexical_decisions:
- source_word: עָשִׁיר דּוֹבֵר
  choice: Wenn ein Reicher spricht
  rationale: Der substantivierte Ausdruck bezeichnet allgemein einen reichen Menschen; die Präsensform gibt den sprichwörtlichen Charakter natürlich wieder.
- source_word: הַכֹּל נִסְכָּתוּ
  choice: verstummen alle
  rationale: Die Bedeutung »schweigen/verstummen« wird durch die griechische Parallele ἐσίγησαν gestützt. Die knappe Wortstellung wahrt die pointierte Weisheitssprache.
- source_word: שִׂכְלוֹ
  choice: seine Einsicht
  rationale: שׂכל bezeichnet Verstand, Einsicht oder verständiges Urteil. »Einsicht« ist im Deutschen idiomatisch und lässt die ironische Kritik an der übertriebenen Wertschätzung des Reichen bestehen.
- source_word: עַד עָב יַגִּיעוּ
  choice: lassen sie bis an die Wolken reichen
  rationale: Die kausative Verbform wird als »reichen lassen« wiedergegeben; zugleich bleibt das anschauliche Bild maßloser Erhöhung bis zu den Wolken erhalten.
