translation:
  language: de
  text: Wenn du etwas hast[a], wird er freundlich mit dir reden und dich ausplündern, ohne dass es ihm leidtut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Parallelüberlieferung lautet: »Wenn du ihm nützlich bist, arbeitet er mit dir; und wenn es dir an etwas fehlt, verlässt er dich.« Sie bietet eine deutlich andere Fassung des Verses als der erhaltene hebräische Text.'
    reason: alternative_reading
lexical_decisions:
- source_word: אִם שַלְּךָ
  choice: Wenn du etwas hast
  rationale: Die überlieferte hebräische Wendung ist schwierig. Im Zusammenhang weist sie wahrscheinlich auf vorhandene Mittel hin, durch die jemand für den Reichen von Nutzen ist. Die offene Formulierung bewahrt diese Unbestimmtheit und berührt zugleich den Sinn der griechischen Parallele.
- source_word: יֵיטִיב דְּבָרָיו עִמָּךְ
  choice: redet er freundlich mit dir
  rationale: 'Wörtlich etwa: »macht er seine Worte bei dir gut«. Gemeint ist freundliches oder einschmeichelndes Reden; die deutsche Fassung bleibt beim sprachlichen Handeln.'
- source_word: וִירֹשֶׁשְׁךָ
  choice: dann bringt er dich um alles
  rationale: Das Verb bezeichnet das Verarmenlassen oder Berauben. »Um alles bringen« gibt die ausbeuterische Handlung in natürlichem, gegenwärtigem Deutsch wieder, ohne unnötig bildhaft über den hebräischen Ausdruck hinauszugehen.
- source_word: וְלֹא יִכְאַב לוֹ
  choice: ohne dass es ihm wehtut
  rationale: Die Wendung besagt, dass der Ausbeuter dabei keinen Schmerz oder Kummer empfindet. Die Formulierung erhält sowohl das Schmerzbild als auch die moralische Gefühlskälte.
theological_decisions:
- issue: Hebräischer Geniza-Text gegenüber der deutlich abweichenden griechischen Parallelüberlieferung
  choice: Der Haupttext folgt dem erhaltenen Hebräisch; die griechische Lesart wird in einer Fußnote vollständig wiedergegeben.
  alternative: 'Primär nach dem Griechischen: »Wenn du ihm nützlich bist, macht er sich dich zunutze; und wenn es dir an etwas fehlt, verlässt er dich.«'
  rationale: Da für diesen Vers ein hebräischer Text erhalten ist, bildet er die Grundlage. Die materiell abweichende griechische Überlieferung darf jedoch nicht harmonisiert oder verschwiegen werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Anrede bleibt im Singular. Der schwierige Versanfang wird bewusst offen wiedergegeben; die ausbeuterische Pointe ist klar, ohne die abweichende griechische Fassung in den Haupttext einzumischen.
