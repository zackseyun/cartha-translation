  source_fidelity: 'Der Haupttext folgt sinnvoll dem erhaltenen, jedoch schwierigen Hebräisch: אִם שַלְּךָ bleibt mit „Wenn du etwas hast“ bewusst offen; יֵיטִיב דְּבָרָיו ist als freundliches Reden wiedergegeben; וִירֹשֶׁשְׁךָ verlangt eine ausdrückliche Aussage des Beraubens/Verarmenlassens. Die abweichende griechische Überlieferung bleibt korrekt als alternative Fassung markiert.'
  naturalness: Die vorliegende Fassung ist überwiegend idiomatisch. „Dann“ fügt jedoch eine im Hebräischen nicht ausgedrückte zeitlich-konsekutive Nuance hinzu. „Ohne dass es ihm wehtut“ hat zudem ein unbestimmtes „es“ und klingt im Kontext weniger präzise als eine auf die Gefühllosigkeit des Handelnden bezogene Formulierung.
  terminology: „Ausplündern“ gibt den ausbeuterischen Sinn von וִירֹשֶׁשְׁךָ in modernem Standarddeutsch klar wieder. „Ohne dass es ihm leidtut“ bewahrt die Aussage, dass ihn das Vorgehen weder schmerzt noch kümmert, ohne eine spezifische psychologische Deutung festzulegen. Die Fußnote gibt die griechische Alternative möglichst nah wieder; „arbeitet er mit dir“ vermeidet die stärkere, interpretierende Wendung „macht er sich dich zunutze“.
  issues:
  - severity: low
    issue: Zusatz „dann“ im Haupttext
    rationale: Das Hebräische reiht die Verben koordinierend aneinander; „dann“ kann einen nicht ausdrücklich vorhandenen zeitlichen Ablauf nahelegen.
  - severity: medium
    issue: Unpräziser Anschluss in „ohne dass es ihm wehtut“
    rationale: Das Pronomen „es“ hat keinen eindeutigen Bezug. Der hebräische Ausdruck bezieht die Schmerz- bzw. Kummerlosigkeit auf den Handelnden.
  - severity: low
    issue: Fußnote deutet die griechische Formulierung stärker aus
    rationale: ἐργᾶται ἐν σοί lässt sich unmittelbar als „arbeitet er mit dir“ wiedergeben. „Macht er sich dich zunutze“ ist möglich, aber interpretierender und weicht vom englischen Audit-Trail („work with you“) ab.
  revised_text: Wenn du etwas hast[a], wird er freundlich mit dir reden und dich ausplündern, ohne dass es ihm leidtut.
