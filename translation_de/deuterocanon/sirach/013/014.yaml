translation:
  language: de
  text: Alles Fleisch liebt seinesgleichen, und jeder Mensch den, der ihm gleicht.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Griechisch: „und jeder Mensch seinen Nächsten“. Das Hebräische lautet wörtlicher: „den, der ihm gleicht“.'
    reason: alternative_reading
lexical_decisions:
- source_word: כָּל הַבָּשָׂר
  choice: Alles Fleisch
  rationale: Die wörtliche hebräische Wendung wird bewahrt. In dieser sprichwörtlichen Verallgemeinerung bezeichnet sie die Gesamtheit der Lebewesen und erhält zugleich den erdnahen, leiblichen Klang des Originals.
- source_word: יֶאֱהַב
  choice: liebt
  rationale: Das Imperfekt formuliert hier eine allgemeingültige Beobachtung; das deutsche Präsens gibt diesen gnomischen Gebrauch natürlich wieder.
- source_word: מִינוֹ
  choice: seinesgleichen
  rationale: מִין bezeichnet Art oder Gattung. „Seinesgleichen“ ist idiomatisch, knapp und drückt die Zugehörigkeit zur eigenen Art aus.
- source_word: וְכָל אָדָם
  choice: und jeder Mensch
  rationale: אָדָם bezeichnet hier allgemein den Menschen. „Jeder Mensch“ ist im modernen Standarddeutsch natürlich und gibt den generischen Sinn ohne unnötige geschlechtliche Verengung wieder.
- source_word: אֶת הַדּוֹמֶה לוֹ
  choice: den, der ihm gleicht
  rationale: Die hebräische Formulierung bezeichnet denjenigen, der ihm ähnlich ist. Die Übersetzung bewahrt den Vergleichssinn und vermeidet es, die abweichende griechische Lesart „Nächster“ in den Haupttext einzutragen.
theological_decisions:
- issue: Nuance des zweiten Satzglieds im Hebräischen und Griechischen
  choice: Im Haupttext der hebräischen Lesart „den, der ihm gleicht“ folgen
  alternative: „seinen Nächsten“ nach dem griechischen Paralleltext
  rationale: Da der hebräische Text erhalten und sicher ist, bildet er die Grundlage. Das Griechische verschiebt den Akzent von Ähnlichkeit zu sozialer Nähe; diese bedeutende alte Variante wird deshalb in einer Fußnote dokumentiert, aber nicht in den Haupttext übernommen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst beibehaltener biblischer Wendung „Alles Fleisch“. Der parallele und sprichwörtlich knappe Satzbau des Hebräischen bleibt erhalten.
