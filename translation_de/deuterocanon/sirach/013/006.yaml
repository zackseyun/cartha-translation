lexical_decisions:
- source_word: צֹרֶךְ לוֹ עִמְּךָ
  choice: Braucht er dich
  rationale: Die schwierige hebräische Wendung bezeichnet sein eigennütziges Bedürfnis nach dem Angesprochenen. Die konditionale Formulierung klingt im Deutschen natürlich und wird durch das griechische ἐὰν ἔχῃς gestützt, ohne dessen abweichenden Bezug ausdrücklich in den Haupttext zu übernehmen.
- source_word: וְהָשִׁיעַ לָךְ
  choice: wird er dich ausnutzen
  rationale: Die hebräische Form ist textlich schwierig und ergibt in ihrer naheliegenden Gestalt keinen guten Sinn im Zusammenhang. Das griechische ἀποκενώσει σε („wird dich ausleeren“) weist auf schädigende Ausbeutung. „Ausnutzen“ gibt diesen Sinn idiomatisch wieder, ohne das Bild des Ausleerens in den hebräischen Haupttext einzutragen.
- source_word: וְשׁוֹחֵק לְךָ
  choice: er lächelt dich an
  rationale: שׂחק kann Lachen oder Spielen bezeichnen; im Zusammenhang einer freundlich auftretenden, aber eigennützigen Person bringt „lächelt dich an“ die manipulative Freundlichkeit klar und natürlich zum Ausdruck.
- source_word: וְהִבְטִיחֶךָ
  choice: wiegt dich in Sicherheit
  rationale: Der Hifil von בטח bedeutet, jemanden sicher oder zuversichtlich zu machen. Die deutsche Wendung bewahrt diesen kausativen Sinn und lässt zugleich die trügerische Wirkung im Kontext erkennen.
- source_word: ἀποκενώσει σε
  choice: wird er dich ausnutzen
  rationale: Das griechische Parallelzeugnis bedeutet wörtlich etwa „er wird dich ausleeren“ und bezeichnet das Aufzehren der Mittel des anderen. Es klärt wahrscheinlich den Sinn der schwierigen hebräischen Lesart.
