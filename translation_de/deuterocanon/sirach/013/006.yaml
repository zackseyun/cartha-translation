review_pass:
  verdict: revise
  source_fidelity: Die Wiedergabe von וְהָשִׁיעַ לָךְ als „nutzt er dich aus“ folgt sinnvoll dem griechischen Paralleltext ἀποκενώσει σε („wird dich ausleeren“), weicht aber von der naheliegenden hebräischen Lesung „wird dir helfen“ ab. Diese erhebliche textliche Spannung muss in der Anmerkung ausdrücklich benannt werden. Für וְהִבְטִיחֶךָ ist „beruhigt dich“ eine natürliche, weniger interpretierende Wiedergabe des kausativen „dich sicher/zuversichtlich machen“ als „wiegt dich in Sicherheit“.
  naturalness: Der gnomenhafte Präsenssatz („Braucht er dich, nutzt er dich aus“) ist im modernen Deutschen knapp und idiomatisch. „Er lächelt dich an und beruhigt dich“ ist natürlich und wahrt die spruchhafte Reihung.
  terminology: „Ausnutzen“ gibt den durch das Griechische nahegelegten Sinn der Ausbeutung gut wieder, darf jedoch nicht als unproblematische direkte Übersetzung des Hebräischen erscheinen. Die Fußnote zum letzten Verb sollte dessen Bedeutung erklären, ohne eine im Wortlaut nicht ausdrücklich markierte Täuschungsabsicht festzulegen.
  issues:
  - severity: medium
    issue: Die Anmerkung zu [a] erklärt die schwierige hebräische Lesung nicht konkret genug.
    rationale: Der masoretisch/vokalisiert vorliegende hebräische Wortlaut kann „und er wird dir helfen“ bedeuten, während die griechische Parallelüberlieferung „er wird dich ausleeren“ bietet. Da der Haupttext dem griechisch gestützten Sinn „ausnutzen“ folgt, muss die Fußnote beide Seiten der Abweichung transparent machen.
  - severity: low
    issue: „Wiegt dich in Sicherheit“ verstärkt den Sinn des Schlussverbs interpretierend.
    rationale: Die Wendung setzt eine trügerische Sicherheit voraus. Das Hebräische bezeichnet unmittelbarer, dass er den anderen sicher oder zuversichtlich macht; „beruhigt dich“ bleibt näher an dieser Wirkung und lässt den Kontext die Wertung tragen.
  revised_text: Braucht er dich, nutzt er dich aus[a]; er lächelt dich an und beruhigt dich[b].
  revised_footnotes:
  - marker: a
    text: 'Der hebräische Wortlaut ist schwierig und kann „und er wird dir helfen“ bedeuten. Die griechische Parallelüberlieferung lautet: „er wird dich ausleeren“, das heißt, deine Mittel aufzehren oder dich ausbeuten. Die Übersetzung folgt für den Sinn dieser griechisch gestützten Lesart.'
    reason: textual_variant
  - marker: b
    text: 'Wörtlich: „macht er dich sicher“ oder „zuversichtlich“.'
    reason: translation_clarity
  revision_rationale: Die Revision macht die zentrale Abweichung zwischen dem problematischen hebräischen Wortlaut und der griechischen Parallelüberlieferung ausdrücklich sichtbar, ohne die griechisch gestützte, im Kontext plausible Haupttextwiedergabe zu verschleiern. Der Schlusssatz wird zugleich idiomatischer und weniger interpretierend formuliert.
