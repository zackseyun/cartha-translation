  text: A poor man totters[a]; he speaks, and they cry, “Away, away!”; but an intelligent man speaks[b], and there is no place for him.
translation:
  language: de
  text: 'Ein Armer gerät ins Wanken; spricht er, erhebt man den Ruf: »Weg, weg!«[a] Doch redet ein Verständiger, ist kein Raum für ihn.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der verdoppelte hebräische Zuruf ist knapp und nicht völlig eindeutig. Er drückt wahrscheinlich Abweisung oder Tadel aus; der griechische Paralleltext sagt, dass man den Niedrigen zurechtweist.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »Es gibt keinen Raum für ihn.« Gemeint sein kann, dass man ihm keinen Raum gibt oder seiner einsichtigen Rede kein Gehör schenkt. Der griechische Paralleltext bezieht die einsichtige Rede auf den Niedrigen; der hebräische Wortlaut kann dagegen einen Verständigen als eigenes Subjekt verstehen lassen.'
    reason: alternative_reading
lexical_decisions:
- source_word: דַּל
  choice: ein Armer
  rationale: דַּל bezeichnet einen armen, schwachen oder gesellschaftlich niedrig stehenden Menschen. Die substantivierte Form »ein Armer« bewahrt den Singular und klingt im Deutschen natürlich.
- source_word: נָמוֹט
  choice: gerät ins Wanken
  rationale: מוט kann ein Wanken, Ausgleiten oder Erschüttertwerden bezeichnen. »Gerät ins Wanken« erhält das Bild einer unsicheren Lage, ohne festzulegen, ob ein moralisches Versagen oder ein äußerer Rückschlag gemeint ist.
- source_word: גָּע גָּע יִשֶּׂא
  choice: 'erhebt man den Ruf: »Weg, weg!«'
  rationale: Die knappe, schwierige hebräische Wendung enthält einen verdoppelten Zuruf der Zurückweisung. Das unpersönliche »man« gibt die gesellschaftliche Reaktion wieder, ohne bestimmte Handelnde einzuführen.
- source_word: וְדִבֶּר מַשְׂכִּיל
  choice: und redet er verständig
  rationale: 'Die komprimierte Formulierung lässt sich auf das fortbestehende Subjekt, den Armen, beziehen: Selbst wenn er mit Einsicht redet, wird ihm kein Raum gegeben. Dies stimmt mit dem griechischen Paralleltext überein, in dem der Niedrige Einsicht äußert. Zugleich wird מַשְׂכִּיל als Art seines Redens wiedergegeben, nicht als neuer, ausdrücklich eingeführter Mensch.'
- source_word: וְאֵין לוֹ מָקוֹם
  choice: ist kein Platz für ihn
  rationale: Die wörtliche Raum-Metapher des Hebräischen bleibt erhalten. Im Zusammenhang bezeichnet sie fehlenden gesellschaftlichen Raum beziehungsweise mangelndes Gehör für seine einsichtige Rede.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache mit knapper sprichwörtlicher Satzführung. Die Wiederholung »Weg, weg!« bewahrt die Schärfe des hebräischen Zurufs. Die fortlaufende Beziehung auf den Armen folgt dem hebräischen Zusammenhang und wird durch den griechischen Paralleltext gestützt; die soziale Bildsprache von »Platz« bleibt bewusst erhalten.
