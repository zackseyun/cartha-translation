  text: The wild beasts of the wilderness are food for the lion[b][a]; so the poor are the pasture of the rich.
translation:
  language: de
  text: Die Wildesel der Wüste[a] sind Nahrung für den Löwen; ebenso sind die Armen Weide für die Reichen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch allgemeiner verstanden: „die wilden Tiere der Wüste“. Das hebräische Wort bezeichnet jedoch vorrangig Wildesel.'
    reason: lexical_alternative
  - marker: b
    text: 'Griechisch: „Welchen Frieden hat eine Hyäne mit einem Hund? Und welchen Frieden hat ein Reicher mit einem Armen?“ Die griechische Parallelüberlieferung bewahrt ein anderes Sprichwort über den Gegensatz zwischen Reich und Arm.'
    reason: alternative_reading
lexical_decisions:
- source_word: מַאֲכַל
  choice: Nahrung für
  rationale: Das Substantiv bezeichnet das, was gegessen wird. „Nahrung für“ wahrt das Bild des Fressens, ohne die Bedeutung unnötig auf „Beute“ zu verengen.
- source_word: אֲרִי
  choice: Löwen
  rationale: Die gewöhnliche und eindeutige Wiedergabe der Tierbezeichnung; der Dativ folgt aus der natürlichen deutschen Fügung „Nahrung für den Löwen“.
- source_word: פִּרְאֵי מִדְבָּר
  choice: die wilden Tiere der Wüste
  rationale: Die Formulierung wird als allgemeine Bezeichnung für wilde Tiere des offenen Wüstenlandes verstanden. Eine engere Deutung als „Wildesel“ bleibt möglich und wird in einer Fußnote genannt.
- source_word: כֵּן
  choice: ebenso
  rationale: Leitet die entsprechende Anwendung des sprichwörtlichen Vergleichs klar und würdig ein.
- source_word: מַרְעִית
  choice: die Weide
  rationale: 'Die wörtliche Metapher von Weide beziehungsweise Weideplatz bleibt erhalten: Die Reichen nähren sich bildlich an den Armen. Eine Glättung zu „Beute“ würde das hebräische Bild ersetzen.'
- source_word: עָשִׁיר
  choice: der Reichen
  rationale: Das hebräische Singularwort bezeichnet hier sprichwörtlich eine gesellschaftliche Gruppe; im Deutschen drückt der substantivierte Plural diese generische Bedeutung natürlich aus.
- source_word: דַּלִּים
  choice: die Armen
  rationale: Bezeichnet arme beziehungsweise bedürftige Menschen und bildet hier den wirtschaftlich-sozialen Gegensatz zu den Reichen ab.
theological_decisions:
- issue: Abweichung zwischen dem erhaltenen hebräischen Text und der griechischen Parallelüberlieferung
  choice: Der Haupttext folgt dem erhaltenen hebräischen Sprichwort vom Fressen und Weiden.
  alternative: „Welchen Frieden hat eine Hyäne mit einem Hund? Und welchen Frieden hat ein Reicher mit einem Armen?“
  rationale: Wo bei Jesus Sirach ein zuverlässiger hebräischer Text erhalten ist, hat er als Ausgangstext Vorrang. Die griechische Fassung bietet ein deutlich anderes Sprichwort, das denselben gesellschaftlichen Gegensatz als Feindschaft statt als Ausbeutung durch Fressen darstellt. Diese bedeutsame Variante wird deshalb in einer Fußnote bewahrt, ohne den hebräischen Haupttext zu verdrängen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper sprichwörtlicher Parallelstruktur. Die auffällige Weidemetapher des Hebräischen wird bewusst nicht geglättet, da sie die Armen als das darstellt, wovon die Reichen sich nähren.
