  text: Whoever touches pitch will have his hand stick to it[a], and whoever associates with a scoffer will learn his way.
translation:
  language: de
  text: Wer Pech berührt, dessen Hand bleibt daran kleben,[a] und wer sich einem Spötter anschließt, wird seinen Weg lernen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Parallelüberlieferung lautet: „Wer Pech berührt, wird beschmutzt werden, und wer Gemeinschaft mit einem Hochmütigen hat, wird ihm gleich werden.“ Der hebräische Text spricht dagegen von einem Spötter und davon, dass man seinen Weg lernt.'
    reason: alternative_reading
lexical_decisions:
- source_word: נוֹגֵעַ בְּזֶפֶת
  choice: Wer Pech berührt
  rationale: Das Partizip bezeichnet verallgemeinernd jeden, der Pech anfasst. „Pech“ gibt den klebrigen schwarzen Stoff im Deutschen natürlich wieder.
- source_word: תִּדְבַּק יָדוֹ
  choice: dessen Hand bleibt daran kleben
  rationale: Die Formulierung bewahrt das konkrete hebräische Bild vom Haften der Hand; „daran“ verdeutlicht den im Kontext vorausgesetzten Bezug auf das Pech.
- source_word: וְחוֹבֵר אֶל
  choice: und wer sich … anschließt
  rationale: Das Verb bezeichnet das Sichverbinden oder den Umgang mit jemandem. „Sich anschließen“ ist prägnant und wahrt die aktive Hinwendung.
- source_word: לֵץ
  choice: einem Spötter
  rationale: לֵץ bezeichnet in der hebräischen Weisheitsliteratur typischerweise einen Spötter oder Verächter. Der erhaltene hebräische Wortlaut hat hier Vorrang vor dem griechischen „Hochmütigen“.
- source_word: יִלְמַד דַּרְכּוֹ
  choice: wird seinen Weg lernen
  rationale: Die bewusst etwas markante Formulierung folgt eng dem Hebräischen und bezeichnet die Übernahme der Lebens- und Verhaltensweise des Spötters, ohne sie zur griechischen Lesart „wird ihm gleich werden“ umzuformen.
theological_decisions:
- issue: Abweichung zwischen dem erhaltenen hebräischen Text und der griechischen Parallelüberlieferung
  choice: 'Der Haupttext folgt dem Hebräischen: Die Hand bleibt kleben; wer sich einem Spötter anschließt, lernt seinen Weg.'
  alternative: Nach der griechischen Parallelüberlieferung wird der Berührende „beschmutzt“, und wer Gemeinschaft mit einem Hochmütigen hat, „wird ihm gleich werden“.
  rationale: Da ein belastbarer hebräischer Zeuge vorliegt, bildet er die Grundlage. Die griechische Fassung vermittelt denselben Grundgedanken, verschiebt jedoch die Nuancen von Anhaften zu Beschmutzung sowie von Spötter und erlernter Lebensweise zu Hochmut und Gleichwerden. Diese Differenz wird offengelegt statt harmonisiert.
translation_notes:
  register: Moderne, würdige Spruchsprache mit einer klaren Wenn-dann-artigen Parallelstruktur. „Seinen Weg lernen“ bleibt als charakteristische hebräische Wendung erhalten; der Zusammenhang macht deutlich, dass damit die Übernahme seiner Verhaltensweise gemeint ist.
