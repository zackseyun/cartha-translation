  text: Wealth is good if there is no iniquity[b][a], and poverty is bad according to the mouth of arrogance.
translation:
  language: de
  text: Reichtum ist gut, sofern kein Unrecht vorliegt; Armut aber ist schlimm im Urteil des Hochmuts[b][a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Parallelüberlieferung bietet eine wesentlich andere Lesart: „Das Herz eines Menschen verändert sein Gesicht, sei es zum Guten oder zum Bösen.“'
    reason: textual_variant
  - marker: b
    text: 'Wörtlich: „nach dem Mund des Hochmuts“. Die schwierige hebräische Wendung kann die Rede oder das Urteil des Hochmuts beziehungsweise eines Hochmütigen meinen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב הָעֹשֶׂר
  choice: Reichtum ist gut
  rationale: Die knappe Wertung bewahrt den sprichwörtlichen Gegensatz zum zweiten Satzteil; עֹשֶׁר bezeichnet Reichtum oder Wohlstand.
- source_word: אִם אֵין עָוֹן
  choice: sofern kein Unrecht vorliegt
  rationale: Die Formulierung gibt die Bedingung und die existentielle Wendung אֵין natürlich wieder. „Unrecht“ wahrt die moralische Tragweite von עָוֹן, ohne ausschließlich Tat, Schuldzustand oder Sünde festzulegen.
- source_word: וְרַע הָעוֹנִי
  choice: Armut aber ist schlimm
  rationale: „Schlimm“ bildet einen natürlichen deutschen Gegenpol zu „gut“, während „aber“ den zugespitzten Gegensatz der beiden Spruchhälften verdeutlicht.
- source_word: עַל פִּי זָדוֹן
  choice: im Urteil des Hochmuts
  rationale: עַל פִּי heißt wörtlich „nach dem Mund von“ und kann auf Aussage, Beurteilung oder Entscheid verweisen. Die gewählte Formulierung ist verständliches Deutsch, lässt den personifizierten Hochmut stehen und kennzeichnet die Unsicherheit in einer Fußnote.
theological_decisions:
- issue: Vorrang des erhaltenen hebräischen Textes gegenüber der stark abweichenden griechischen Parallelüberlieferung
  choice: Der hebräische Spruch über Reichtum und Armut steht im Haupttext.
  alternative: 'Dem griechischen Text folgen: „Das Herz eines Menschen verändert sein Gesicht, sei es zum Guten oder zum Bösen.“'
  rationale: Wo der hebräische Sirachtext erhalten ist, bildet er die primäre Textgrundlage. Da die griechische Überlieferung hier einen wesentlich anderen Satz bietet, wird sie nicht in den Haupttext eingemischt, sondern als bedeutsame Textvariante dokumentiert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper sprichwörtlicher Satzform. Der schwer verständliche hebräische Ausdruck wird im Haupttext maßvoll idiomatisiert, während seine Bildlichkeit und Mehrdeutigkeit in der Fußnote offengelegt werden.
