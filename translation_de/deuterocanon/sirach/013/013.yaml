translation:
  language: de
  text: Sei auf der Hut und sei vorsichtig, und geh nicht mit gewalttätigen Männern.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Paralleltext lautet: „denn du gehst mit deinem Untergang“ oder „mit deinem Fall“. Der hebräische Textzeuge hat dagegen: „und geh nicht mit gewalttätigen Männern“.'
    reason: Textvariante
lexical_decisions:
- source_word: הִשָּׁמֵר
  choice: Sei auf der Hut
  rationale: Der Nifal-Imperativ von שמר fordert dazu auf, sich selbst zu schützen und wachsam zu sein. „Sei auf der Hut“ ist im heutigen Deutsch natürlich und bewahrt den warnenden, reflexiven Sinn.
- source_word: וֶהְיֵה זָהִיר
  choice: und sei vorsichtig
  rationale: זָהִיר bezeichnet Vorsicht oder Umsicht. Das Hebräische enthält hier keinen ausdrücklichen Verstärker; deshalb wird trotz des griechischen σφοδρῶς kein „sehr“ ergänzt.
- source_word: וְאַל תִּתְהַלֵּךְ
  choice: und geh nicht
  rationale: Der Hitpael von הלך kann „umhergehen“ oder „seinen Weg gehen“ bedeuten. Mit עִם bezeichnet die Wendung zugleich Begleitung beziehungsweise Gemeinschaft. „Geh nicht mit“ bewahrt das hebräische Bild, ohne den Sinn auf bloße räumliche Bewegung einzuengen.
- source_word: עִם
  choice: mit
  rationale: Die Präposition bezeichnet Begleitung oder Gemeinschaft; „mit“ entspricht ihr unmittelbar und fügt sich natürlich in die Warnung ein.
- source_word: אַנְשֵׁי חָמָס
  choice: gewalttätigen Männern
  rationale: חָמָס umfasst Gewalt, Unrecht und rücksichtsloses Handeln. „Gewalttätige Männer“ ist konkret und verständlich; „Männer“ gibt das maskuline אַנְשֵׁי sachgerecht wieder.
theological_decisions:
- issue: Abweichung zwischen dem hebräischen und dem griechischen Textzeugen im zweiten Satzteil
  choice: 'Dem erhaltenen Hebräisch folgen: „und geh nicht mit gewalttätigen Männern“'
  alternative: 'Griechisch: „denn du gehst mit deinem Untergang“ beziehungsweise „mit deinem Fall“'
  rationale: Der erhaltene hebräische Text bietet eine in sich stimmige Weisheitsmahnung und ist hier die primäre Textgrundlage. Die erheblich abweichende griechische Lesart wird nicht in den Haupttext eingemischt, sondern als echte Textvariante in der Fußnote dokumentiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Mahnform bleibt erhalten. Die Wiederholung „Sei … und sei …“ bildet die zweifache hebräische Aufforderung ab; das Bild des Gehens wird nicht durch eine rein deutende Formulierung wie „pflege keinen Umgang“ ersetzt.
