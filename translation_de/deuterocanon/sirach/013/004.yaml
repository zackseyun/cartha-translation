  text: If you are useful to him[a], he will make use of you; and if you bow down, he will not spare you.
translation:
  language: de
  text: Wenn du ihm von Nutzen bist[a], wird er dich gebrauchen; und wenn du dich beugst, wird er dich nicht schonen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Überlieferung lautet abweichend: »Ein Reicher tut Unrecht und fährt auch noch grob auf; einem Armen geschieht Unrecht, und er muss auch noch bitten.« Der hier übersetzte hebräische Text warnt dagegen, dass jemand einen Menschen gebraucht, solange dieser ihm nützt, und ihn nicht schont, wenn er sich beugt.'
    reason: alternative_reading
lexical_decisions:
- source_word: אִם תִּכְשַׁר לוֹ
  choice: Wenn du ihm von Nutzen bist
  rationale: כשר bezeichnet hier, was für jemanden geeignet, vorteilhaft oder brauchbar ist. Die Formulierung gibt den praktischen Nutzen im ausbeuterischen sozialen Zusammenhang natürlich wieder.
- source_word: יַעֲבֹד בָּךְ
  choice: wird er dich für sich arbeiten lassen
  rationale: Das Verb עבד mit ב kann ausdrücken, dass jemand an oder mit einer Person arbeitet beziehungsweise sie in seinen Dienst nimmt. Die Wiedergabe wahrt das Wortfeld von Arbeit und Dienst, ohne die stärkere Deutung »ausbeuten« ausdrücklich in den Text einzutragen.
- source_word: וְאִם תִּכְרַע
  choice: doch wenn du zusammenbrichst
  rationale: כרע kann sich beugen, niederknien oder zusammenbrechen bedeuten. Der Gegenpol zur vorherigen Brauchbarkeit legt hier den Zusammenbruch oder das Erliegen nahe; »zusammenbrichst« erhält zugleich das körperliche Bild.
- source_word: לֹא יַחְמֹל עָלֶיךָ
  choice: wird er dich nicht schonen
  rationale: חמל umfasst Mitleid haben und verschonen. »Nicht schonen« ist knapp, idiomatisch und lässt sowohl fehlendes Mitgefühl als auch rücksichtsloses Handeln erkennen.
theological_decisions:
- issue: Erhebliche Abweichung zwischen dem erhaltenen hebräischen Text und der griechischen Überlieferung
  choice: Der erhaltene hebräische Wortlaut wird als Haupttext direkt übersetzt.
  alternative: »Ein Reicher tut Unrecht und fährt auch noch grob auf; einem Armen geschieht Unrecht, und er muss auch noch bitten.«
  rationale: Da ein verständlicher hebräischer Text erhalten ist, bildet er die Grundlage. Die stark abweichende griechische Fassung wird nicht mit ihm vermischt, sondern als echte Texttradition vollständig in einer Fußnote dokumentiert.
- issue: Mehrdeutigkeit von כרע
  choice: zusammenbrichst
  alternative: dich beugst / niederkniest / erniedrigt wirst
  rationale: Der Kontext kontrastiert die Nutzbarkeit einer Person mit ihrem Niedergang. Die gewählte Übersetzung bewahrt das Bild des Einknickens, ohne eine freiwillige Unterwerfung oder ausschließlich einen sozialen Statusverlust festzulegen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, knappem Spruchton. Das Semikolon bildet die scharfe Zweiteilung des hebräischen Satzes ab; »doch« verdeutlicht den Gegensatz, ohne ihn auszudeuten.
