base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/013/011.yaml
  text: Do not trust his ease with you[a], and do not believe his many words; for with much talk he is testing you, and while laughing with you he is probing you.
translation:
  language: de
  text: Verlass dich nicht auf einen ungezwungenen Umgang mit ihm[a], und glaube seinen vielen Worten nicht; denn durch sein vieles Reden prüft er dich, und während er mit dir lacht, forscht er dich aus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Verlass dich nicht auf die Freiheit, die du bei ihm hast“, das heißt, auf einen unbefangenen Umgang oder darauf, in seiner Gegenwart offen reden zu können. Das Hebräische spricht von „Freiheit“; die griechische Parallelüberlieferung weist auf freies beziehungsweise gleichberechtigtes Reden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּבְטַח לְחֹפֶשׁ עִמּוֹ
  choice: Vertraue nicht darauf, dass du ungezwungen mit ihm umgehen kannst
  rationale: חֹפֶשׁ bezeichnet wörtlich Freiheit; zusammen mit עִמּוֹ und im Licht des griechischen ἰσηγορεῖσθαι geht es hier um unbefangenen, freimütigen Umgang auf vermeintlich gleicher Ebene. Die Formulierung gibt die Warnung in natürlichem Deutsch wieder, ohne die mögliche Nuance des offenen Redens auszuschließen.
- source_word: וְאַל תַּאֲמִין לְרֹב שִׂיחוֹ
  choice: und glaube seinen vielen Worten nicht
  rationale: אמן im Hifil bedeutet hier glauben beziehungsweise Vertrauen schenken. Da die zahlreichen Worte das Bezugsobjekt sind, ist „glaube … nicht“ idiomatisch und präzise.
- source_word: כִּי מַרְבִּית שִׂיחוֹ נִסּיוֹן
  choice: denn mit seinem vielen Gerede stellt er dich auf die Probe
  rationale: Der hebräische Ausdruck ist knapp und syntaktisch verdichtet. Das griechische πειράσει σε bestätigt, dass die angesprochene Person geprüft wird. „Mit seinem vielen Gerede“ bewahrt Sprache als Mittel der Prüfung.
- source_word: וְשֹׂחֵק לְךָ
  choice: und während er mit dir lacht
  rationale: Das Partizip bezeichnet eine gleichzeitig stattfindende, äußerlich freundliche Handlung. „Mit dir lacht“ bewahrt diese Oberfläche, ohne bereits eine spöttische Absicht festzulegen.
- source_word: וַחֲקָרֶךָ
  choice: forscht er dich aus
  rationale: Die Wurzel חקר bezeichnet gründliches Erforschen oder Prüfen; das griechische ἐξετάσει σε stützt diesen Sinn. „Ausforschen“ passt zur zwischenmenschlichen Warnung und bringt das verborgene Ermitteln zum Ausdruck.
