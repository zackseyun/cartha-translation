  text: When a poor man speaks[a], they say, “Who is this?” and if he stumbles[b], they push him down all the more.
translation:
  language: de
  text: 'Wenn ein Armer spricht, sagen sie: »Wer ist denn der?« Und wenn er stolpert, stoßen auch sie ihn nieder.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »stoßen auch sie ihn«. Gemeint sein kann, dass andere zu seinem Fall beitragen, statt ihm aufzuhelfen; möglich ist auch eine steigernde Auffassung: »stoßen sie ihn erst recht nieder«.'
    reason: lexical_alternative
  - marker: b
    text: 'Die griechische Überlieferung weicht hier erheblich ab: »Reichtum ist gut, wenn keine Sünde an ihm ist, und schlimm ist Armut im Mund eines Gottesfürchtigen.« Der Haupttext folgt dem erhaltenen hebräischen Text; das Griechische bezeugt eine abweichende Texttradition.'
    reason: textual_variant
lexical_decisions:
- source_word: דַּל
  choice: ein Armer
  rationale: דַּל bezeichnet einen armen, schwachen oder gesellschaftlich gering geachteten Menschen. Die substantivierte Form »ein Armer« wahrt den männlichen Singular und passt zum sprichwortartigen Charakter.
- source_word: דּוֹבֵר
  choice: spricht
  rationale: Das Partizip beschreibt eine typische, wiederkehrende Situation. Im deutschen Konditionalsatz gibt »spricht« diesen allgemeinen Sinn natürlich wieder.
- source_word: מִי זֶה
  choice: Wer ist denn der?
  rationale: מִי זֶה bedeutet wörtlich »Wer ist dieser?«. Die Partikel »denn« und das demonstrative »der« vermitteln im Deutschen die im Zusammenhang erkennbare geringschätzige Direktheit.
- source_word: נִתְקַל
  choice: stolpert
  rationale: Das Verb kann konkretes Stolpern sowie übertragenes Straucheln oder Scheitern bezeichnen. »stolpert« erhält dieses Bild und seine übertragene Offenheit.
- source_word: גַּם הֵם
  choice: auch sie
  rationale: Die formal naheliegende Wiedergabe bewahrt die etwas schwierige hebräische Formulierung, statt sie eindeutig als bloße Steigerung aufzulösen.
- source_word: יֶהְדֳּפוּהוּ
  choice: stoßen … ihn nieder
  rationale: הדף bezeichnet Wegstoßen, Fortdrängen oder Niederstoßen. Zusammen mit dem vorausgehenden Stolpern macht »ihn niederstoßen« anschaulich, dass andere seinen Fall verschlimmern.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper sprichwortartiger Satzführung. »Wer ist denn der?« lässt die verächtliche Haltung hörbar werden, ohne zusätzliche Erklärung in den Haupttext einzutragen. Die schwierige Wendung גַּם הֵם bleibt durch »auch sie« sichtbar; alternative Deutungen werden in der Fußnote offengelegt.
