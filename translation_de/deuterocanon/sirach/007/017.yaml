  footnotes:
  - marker: a
    text: 'Der zu dieser Stelle überlieferte griechische Text lautet: „Demütige deine Seele sehr.“ Der in den Quelldaten angegebene hebräische Wortlaut bietet dagegen einen völlig anderen Satz und scheint nicht zu diesem Vers zu gehören.'
