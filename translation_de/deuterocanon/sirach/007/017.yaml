lexical_decisions:
- source_word: ταπείνωσον
  choice: Demütige
  rationale: Der griechische Imperativ bezeichnet ein bewusstes Erniedrigen beziehungsweise Demütigen; die aktive Form und der Aufforderungscharakter bleiben erhalten.
- source_word: σφόδρα
  choice: sehr
  rationale: Gibt die starke Gradangabe schlicht und unmittelbar wieder.
- source_word: τὴν ψυχήν σου
  choice: deine Seele
  rationale: Bewahrt die ausdrückliche Nennung der Seele, statt sie lediglich durch das reflexive „dich“ wiederzugeben.
theological_decisions:
- issue: Textgrundlage bei auseinandergehenden Quellen
  choice: Der Haupttext folgt dem griechischen Paralleltext, der eindeutig Sirach 7,17 entspricht.
  alternative: 'Dem beigefügten hebräischen Wortlaut folgen: „Überstürze dich nicht, zu mir zu sagen: ‚Brich durch‘; wälze es auf Gott und nimm seinen Weg an.“'
  rationale: Der angegebene hebräische Text weicht in Inhalt und Wortlaut vollständig vom griechischen Vers und von der geprüften englischen Konsultationsfassung ab und dürfte hier trotz der Kennzeichnung als nur geringfügige Abweichung nicht zu Sirach 7,17 gehören. Die Abweichung wird deshalb offengelegt und nicht stillschweigend harmonisiert.
translation_notes:
  register: Kurze, würdige Mahnung in modernem Standarddeutsch. Die etwas feierliche Wendung „deine Seele“ bleibt wegen ihrer ausdrücklichen Entsprechung im Griechischen erhalten.
