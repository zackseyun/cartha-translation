  text: Humble pride very much[a], for the hope of man is worms.
translation:
  language: de
  text: Erniedrige den Hochmut ganz und gar,[a] denn die Hoffnung des Menschen sind Würmer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Parallelüberlieferung lautet: „Rechne dich nicht zur Menge der Sünder.“ Offenbar liegt hier eine andere Texttradition vor und nicht nur eine geringfügig abweichende Formulierung.'
