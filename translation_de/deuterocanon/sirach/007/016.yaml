lexical_decisions:
- source_word: מְאֹד מְאֹד
  choice: sehr, sehr
  rationale: Die Wiederholung verstärkt den Imperativ nachdrücklich. Sie bleibt sichtbar, ohne durch eine interpretierende Steigerung ersetzt zu werden.
- source_word: הַשְׁפִּיל
  choice: Erniedrige
  rationale: Der Hifil-Imperativ verlangt ein aktives Herabsetzen. „Erniedrige“ gibt diese kausative Kraft genauer wieder als das reflexive „demütige dich“.
- source_word: גַּאֲוָה
  choice: den Hochmut
  rationale: Das Substantiv bezeichnet Stolz beziehungsweise Selbstüberhebung. „Hochmut“ passt zum negativen Zusammenhang und lässt offen, ob der eigene Hochmut oder Hochmut allgemein gemeint ist.
- source_word: תִקְוַת
  choice: die Hoffnung
  rationale: תקוה bedeutet gewöhnlich „Hoffnung“ oder „Erwartung“. Die ungewöhnliche Aussage des hebräischen Textes wird nicht zu „Ende“ umgedeutet.
- source_word: אֱנוֹשׁ
  choice: des Menschen
  rationale: אֱנוֹשׁ bezeichnet den sterblichen, gebrechlichen Menschen. „Des Menschen“ bewahrt den Singular und klingt im Deutschen würdig und allgemein.
- source_word: רִמָּה
  choice: Würmer
  rationale: Das Wort bezeichnet Würmer oder Maden im Zusammenhang mit Verwesung. Der Plural „Würmer“ gibt das Todesbild natürlich wieder und entspricht der prädikativen Aussage.
theological_decisions:
- issue: Starke Abweichung zwischen dem erhaltenen hebräischen Text und der griechischen Parallelüberlieferung
  choice: 'Der Haupttext folgt dem Hebräischen: „Erniedrige den Hochmut sehr, sehr, denn die Hoffnung des Menschen sind Würmer.“'
  alternative: 'Die griechische Parallelüberlieferung lautet: „Rechne dich nicht zur Menge der Sünder.“'
  rationale: Da hier ein zuverlässiger hebräischer Zeuge vorliegt, bildet er die Grundlage. Das Griechische bietet keine bloße Wortvariante, sondern offenbar eine andere Texttradition; diese wird daher in einer Fußnote vollständig dokumentiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die markante hebräische Wiederholung „sehr, sehr“ und die theologisch spannungsvolle Wendung „die Hoffnung des Menschen sind Würmer“ bleiben bewusst erhalten.
