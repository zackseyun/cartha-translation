  text: Do not despise a man in bitterness of spirit[a]; remember that there is one who exalts and humbles.
translation:
  language: de
  text: Verachte keinen Menschen, dessen Geist von Bitterkeit erfüllt ist; denk daran, dass es einen gibt, der erhöht und erniedrigt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hebräische Text lautet: „der erhöht und erniedrigt“; die griechische Überlieferung hat die umgekehrte Reihenfolge: „der erniedrigt und erhöht“.'
    reason: textual_variant
lexical_decisions:
- source_word: אַל תִּבֶז
  choice: Verachte nicht
  rationale: Das hebräische בזה bezeichnet eine geringschätzige, verächtliche Haltung. „Verachten“ bewahrt den weiteren Sinn des Hebräischen, ohne ihn wie „verspotten“ auf offenen Spott zu verengen.
- source_word: לֶאֱנוֹשׁ
  choice: einen Menschen
  rationale: אֱנוֹשׁ bezeichnet hier einen einzelnen Menschen und kann zugleich dessen Gebrechlichkeit anklingen lassen. Im Deutschen gibt „Mensch“ die repräsentative Bedeutung natürlicher wieder als „Mann“.
- source_word: בְּמַר רוּחַ
  choice: dessen Geist von Bitterkeit erfüllt ist
  rationale: Die Wiedergabe bewahrt die hebräischen Begriffe „Bitterkeit“ und „Geist“, ist aber idiomatischer als „in Bitterkeit des Geistes“. Sie lässt offen, ob innere Not, Verbitterung oder beides gemeint ist.
- source_word: זְכוֹר
  choice: denk daran
  rationale: Die singularische Aufforderung wird in natürlichem, modernem Deutsch wiedergegeben.
- source_word: כִּי יֵשׁ
  choice: dass es einen gibt
  rationale: Nach „denk daran“ gibt diese Formulierung die Existenzkonstruktion יֵשׁ natürlich wieder und lässt das Subjekt wie im Ausgangstext unbenannt.
- source_word: מֵרִים וּמַשְׁפִּיל
  choice: der erhöht und erniedrigt
  rationale: 'Die Reihenfolge folgt dem vorliegenden hebräischen Text: zuerst „erhöhen“, dann „erniedrigen“. Beide Partizipien bezeichnen denselben ungenannten Handelnden.'
theological_decisions:
- issue: Unausgesprochenes Subjekt des Erhöhens und Erniedrigens
  choice: Das Subjekt bleibt mit „einen“ unbenannt.
  alternative: „Gott, der erhöht und erniedrigt“ oder „der Herr erhöht und erniedrigt“
  rationale: Hebräisch und Griechisch legen einen göttlichen Handelnden nahe, nennen ihn hier aber nicht ausdrücklich. Die Übersetzung bewahrt diese Zurückhaltung.
- issue: Reihenfolge der Umkehrung menschlicher Stellung
  choice: „erhöht und erniedrigt“ nach dem hebräischen Haupttext
  alternative: „erniedrigt und erhöht“ nach der griechischen Parallele
  rationale: Da der hebräische Text mit hoher Sicherheit vorliegt, bleibt seine Reihenfolge im Haupttext erhalten. Die abweichende griechische Reihenfolge wird transparent in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz bleibt knapp und spruchhaft; „dessen Geist von Bitterkeit erfüllt ist“ bewahrt die Bildsprache, ohne die Art der inneren Not vorschnell festzulegen.
