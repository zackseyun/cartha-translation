translation:
  language: de
  text: Behandle einen treuen Arbeiter nicht schlecht[a], ebenso wenig einen Lohnarbeiter, der sich ganz einsetzt.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »einen Arbeiter der Wahrheit«; möglich ist auch: »einen Diener, der treu arbeitet«.'
    reason: lexical_alternative
  - marker: b
    text: 'Der hebräische Wortlaut des zweiten Satzteils ist schwierig. Die griechische Überlieferung lautet: »einen Lohnarbeiter, der sein Leben hingibt«, und stützt den Sinn »der sich ganz einsetzt«.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תָּרֵעַ
  choice: Behandle … nicht schlecht
  rationale: Das Hiphil von רעע bezeichnet hier schädigendes oder schlechtes Behandeln. Die griechische Parallele μὴ κακώσῃς bestätigt diesen zwischenmenschlichen Sinn.
- source_word: עוֹבֵד אֱמֶת
  choice: einen Arbeiter, der treu arbeitet
  rationale: Wörtlich steht hier »Arbeiter der Wahrheit«. Die Formulierung gibt den ethischen Sinn – zuverlässiges, ehrliches Arbeiten – in natürlichem Deutsch wieder, ohne die mögliche Bedeutung »Diener« zu verschweigen.
- source_word: וְכֵן
  choice: ebenso wenig
  rationale: Die Verbindung führt nach dem ersten Verbot ein paralleles zweites Glied ein. »Ebenso wenig« bildet diese koordinierende negative Aussage idiomatisch ab.
- source_word: שׁוֹמֵר
  choice: einen Lohnarbeiter
  rationale: Der überlieferte hebräische Ausdruck ist an dieser Stelle schwierig und könnte für sich genommen »Hüter« bedeuten. Das griechische μίσθιον, »Lohnarbeiter«, bietet jedoch eine starke textliche Stütze für diese Wiedergabe.
- source_word: נוֹחֵן נַפְשׁוֹ
  choice: der sich ganz einsetzt
  rationale: Die hebräische Lesart ist schwierig; die griechische Parallele διδόντα ψυχὴν αὐτοῦ lautet wörtlich »der seine Seele/sein Leben gibt«. Im Arbeitskontext bezeichnet dies volle persönliche Hingabe. »Sich ganz einsetzen« bewahrt diesen Sinn, ohne fälschlich einen buchstäblichen Tod nahezulegen.
