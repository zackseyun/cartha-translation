  text: Bread of the mighty and an offering of the hand[a], sacrifices of righteousness and a holy contribution.
translation:
  language: de
  text: Brot der Mächtigen und eine Gabe aus der Hand[a], Opfer der Gerechtigkeit und eine heilige Abgabe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Parallelüberlieferung lautet: „Und streck dem Armen deine Hand entgegen, damit dein Segen vollkommen werde.“ Der hebräische und der griechische Text unterscheiden sich hier erheblich; möglicherweise liegt eine abweichende Textüberlieferung oder eine Textverderbnis vor.'
    reason: textual_variant
lexical_decisions:
- source_word: לֶחֶם
  choice: Brot
  rationale: Die Grundbedeutung ist „Brot“; der schwierige Zusammenhang bietet keinen hinreichenden Grund für die Verallgemeinerung zu „Nahrung“.
- source_word: אַבִּירִים
  choice: der Mächtigen
  rationale: Das Wort kann Mächtige oder Starke, in bestimmten Zusammenhängen auch Stiere bezeichnen. Die formal offene Wiedergabe bewahrt die Unsicherheit des hebräischen Ausdrucks.
- source_word: וּתְרוּמַת יָד
  choice: und eine Gabe aus der Hand
  rationale: תְּרוּמָה bezeichnet eine Abgabe oder Opfergabe. „Aus der Hand“ gibt die hebräische Bildsprache natürlich wieder, ohne vorschnell einen eng bestimmten kultischen Fachbegriff festzulegen.
- source_word: זִבְחֵי צֶדֶק
  choice: Opfer der Gerechtigkeit
  rationale: Die formale Genitivfügung wahrt die mögliche moralische und kultische Bedeutungsweite von צֶדֶק.
- source_word: וּתְרוּמַת קֹדֶשׁ
  choice: und eine heilige Abgabe
  rationale: Die Formulierung bezeichnet eine geheiligte beziehungsweise dem Heiligtum bestimmte Abgabe und erhält den kultischen Sprachton.
theological_decisions:
- issue: Erhebliche Abweichung zwischen dem erhaltenen hebräischen Text und der griechischen Parallelüberlieferung
  choice: Der Haupttext folgt dem erhaltenen Hebräisch; die wesentlich andere griechische Lesart wird in einer Fußnote dokumentiert.
  alternative: „Streck auch dem Armen deine Hand entgegen, damit dein Segen vollkommen werde.“
  rationale: Wo bei Jesus Sirach ein hebräischer Text erhalten ist, bildet er hier die primäre Grundlage. Die griechische Fassung unterscheidet sich nicht nur stilistisch, sondern inhaltlich grundlegend und weist daher auf eine abweichende Textüberlieferung oder eine Textverderbnis hin.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst formnaher Wiedergabe des schwierigen hebräischen Verses. Die kultische Wortwahl und die echte Unklarheit von „der Mächtigen“ bleiben erhalten.
