translation:
  language: de
  text: Bemühe dich nicht bei Gott um Herrschaft[a] und ebenso wenig beim König um einen Ehrenplatz.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Textzeuge bietet hier einen anderen Spruch: »Mein Sohn, säe nicht in Furchen des Unrechts, dann wirst du nicht siebenfach ernten.« Der Haupttext folgt an dieser Stelle dem erhaltenen hebräischen Textzeugen.'
    reason: textual_variant
lexical_decisions:
- source_word: אַל תְּבַקֵּשׁ
  choice: Bemühe dich nicht … um
  rationale: בקש kann »suchen«, »erbitten« oder »anstreben« bedeuten. Die deutsche Wendung wahrt sowohl das gezielte Streben als auch die Möglichkeit einer Bitte, ohne den Sinn auf einen bloßen mündlichen Antrag festzulegen.
- source_word: מֵאֵל
  choice: bei Gott
  rationale: אֵל bezeichnet hier schlicht Gott. In Verbindung mit »sich um etwas bemühen« gibt »bei Gott« die Herkunft beziehungsweise denjenigen wieder, von dem die Stellung erwartet wird, ohne einen zusätzlichen Gottesnamen einzuführen.
- source_word: מֶמְשֶׁלַת
  choice: Herrschaft
  rationale: ממשלה bezeichnet Herrschaft, Regierungsgewalt oder Leitungsbefugnis. »Herrschaft« bewahrt die Breite des hebräischen Ausdrucks und passt zur Parallele eines vom König gewährten Ehrenplatzes.
- source_word: וְכֵן
  choice: und ebenso wenig
  rationale: Wörtlich bedeutet die Verbindung »und ebenso/so auch«. Im Deutschen führt »ebenso wenig« die Verneinung des ersten Satzglieds idiomatisch im parallelen zweiten Satzglied fort.
- source_word: מִמֶּלֶךְ
  choice: beim König
  rationale: Die Präposition מן bezeichnet hier den König als denjenigen, von dem die ehrenvolle Stellung erwartet wird. Mit der gewählten deutschen Verbfügung ist »beim König« natürlich; der bestimmte Singular entspricht der hebräischen Form und kann allgemein verstanden werden.
- source_word: מוֹשַׁב כָּבוֹד
  choice: einen Ehrenplatz
  rationale: מוֹשָׁב kann Sitz, Sitzplatz oder Stellung bedeuten, כָּבוֹד Ehre beziehungsweise Ansehen. »Ehrenplatz« bewahrt das konkrete Bild und lässt zugleich den gesellschaftlichen Rang anklingen.
theological_decisions:
- issue: Verhältnis des hebräischen und des griechischen Textzeugen
  choice: Der erhaltene hebräische Wortlaut steht im Haupttext; die erheblich abweichende griechische Lesart wird in einer Fußnote dokumentiert.
  alternative: »Mein Sohn, säe nicht in Furchen des Unrechts, dann wirst du ihre Frucht nicht siebenfach ernten.«
  rationale: Für Jesus Sirach hat der erhaltene hebräische Text Vorrang. Da der griechische Zeuge an dieser Stelle einen inhaltlich anderen Spruch bietet, dürfen beide Überlieferungen nicht harmonisiert werden; die Fußnote erhält die bedeutsame Textvariante.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallele Satzstruktur ist knapp und mahnend; »Herrschaft« und »Ehrenplatz« bewahren sowohl den politischen als auch den gesellschaftlichen Bezug.
