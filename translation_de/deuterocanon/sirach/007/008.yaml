lexical_decisions:
- source_word: אַל תִּקְשׁוֹר
  choice: Verstrick dich nicht
  rationale: Die hebräische Wendung verwendet das Bild des Bindens oder Festknüpfens; das reflexive deutsche „sich verstricken“ bewahrt dieses Bild in natürlicher, warnender Sprache. Auch das griechische καταδεσμεύσῃς stützt die Bindemetapher.
- source_word: לְשָׁנוֹת
  choice: ein zweites Mal
  rationale: Der Ausdruck bezeichnet eine Wiederholung. „Ein zweites Mal“ gibt dies klarer wieder als das mögliche „zweimal“ und lässt offen, ob eine konkrete Sünde wiederholt oder weitere Sünde hinzugefügt wird.
- source_word: חֵטְ
  choice: Sünde
  rationale: „Sünde“ entspricht dem hebräischen Substantiv unmittelbar und wird durch das griechische ἁμαρτίαν bestätigt.
- source_word: כִּי
  choice: denn
  rationale: „Denn“ gibt die knappe Begründung der vorausgehenden Warnung idiomatisch wieder.
- source_word: בְאַחַת
  choice: schon wegen einer einzigen
  rationale: Das Hebräische sagt knapp „bei/in einer“, ebenso das Griechische. Die deutsche Formulierung verdeutlicht den Bezug auf eine einzige Sünde, ohne den Satz unnötig auszudeuten.
- source_word: לֹא תִנָּקֶה
  choice: wirst du nicht ungestraft bleiben
  rationale: Das Nifal von נקה kann sowohl das Ausbleiben von Strafe als auch Freispruch oder Reinwaschung bezeichnen. Im Warnspruch ist „nicht ungestraft bleiben“ natürlich und unmittelbar; die forensische Bedeutung wird in der Fußnote bewahrt.
theological_decisions:
- issue: Ist לֹא תִנָּקֶה vorwiegend als Strafandrohung oder als forensischer Nichtfreispruch wiederzugeben?
  choice: wirst du nicht ungestraft bleiben
  alternative: wirst du nicht freigesprochen / für schuldlos erklärt werden
  rationale: Der Weisheitsspruch warnt vor den Folgen selbst einer einzigen Sünde. Die strafbezogene Wiedergabe entspricht diesem Zusammenhang, während die ebenfalls mögliche Gerichtssprache in einer Fußnote erhalten bleibt.
- issue: Bezeichnet die erste Zeile die Wiederholung derselben Sünde oder das Hinzufügen weiterer Sünde?
  choice: Verstrick dich nicht ein zweites Mal in Sünde
  alternative: Füge nicht ein zweites Mal Sünde hinzu
  rationale: Der hebräische Ausdruck verbindet eine Bindemetapher mit dem Gedanken der Wiederholung und bleibt in seinem genauen Bezug knapp. Die gewählte Form bewahrt Bild und Mehrdeutigkeit, statt ausschließlich das Wiederholen derselben Tat oder das Anhäufen verschiedener Sünden festzulegen.
translation_notes:
  register: Moderne, allgemein verständliche Standardsprache mit würdigem Ton. „Verstrick dich“ erhält das konkrete Quellenbild, ohne im Deutschen hölzern zu wirken; „schon wegen einer einzigen“ macht den elliptischen Bezug verständlich. Die Anrede bleibt entsprechend dem hebräischen Singular persönlich und direkt.
