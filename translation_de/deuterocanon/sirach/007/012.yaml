  text: Do not plot violence against a brother, nor do the like against a friend or companion together.
translation:
  language: de
  text: Sinne nicht auf Gewalt gegen einen Bruder[a], ebenso wenig gegen Freund und Gefährten gleichermaßen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Überlieferung lautet an dieser Stelle: „Sinne nicht auf Lüge gegen deinen Bruder“; der hebräische Text hat „Gewalt“.'
    reason: Dokumentiert eine bedeutungsrelevante Abweichung zwischen dem primären hebräischen Text und der griechischen Parallelüberlieferung.
lexical_decisions:
- source_word: תַּחֲרוֹשׁ
  choice: Sinne … auf
  rationale: Das Verb bedeutet wörtlich „pflügen“, wird mit עַל aber bildlich für das Planen oder Aushecken von Bösem gegen jemanden gebraucht. „Auf etwas sinnen“ bewahrt die bewusste, vorbereitende Absicht in natürlichem, würdigem Deutsch.
- source_word: חָמָס
  choice: Gewalt
  rationale: חמס bezeichnet Gewalt, gewaltsames Unrecht oder Frevel. „Gewalt“ gibt die primäre Bedeutung knapp wieder, ohne sie zum bloßen Betrug abzuschwächen.
- source_word: אָח
  choice: Bruder
  rationale: Die direkte Verwandtschafts- und Gemeinschaftsbezeichnung wird beibehalten; der Kontext legt keine engere oder ausschließlich leibliche Bedeutung fest.
- source_word: רֵעַ וְחָבֵר
  choice: Freund oder Gefährte
  rationale: Die beiden nah verwandten Personenbezeichnungen werden unterscheidbar und idiomatisch wiedergegeben. Das deutsche „oder“ bezeichnet hier die beiden betroffenen Personengruppen, ohne einen Gegensatz zwischen ihnen einzuführen.
- source_word: יַחְדָּו
  choice: ebenso wenig
  rationale: Das abschließende „zusammen/gleichermaßen“ wird als parallele Einbeziehung von Freund und Gefährten ausgedrückt. Eine wörtliche Stellung mit „zusammen“ wäre im Deutschen missverständlich.
theological_decisions:
- issue: Art des geplanten Unrechts
  choice: Gewalt nach dem hebräischen חמס
  alternative: Lüge/Falschheit nach dem griechischen ψεῦδος
  rationale: Der vorgelegte, als zuverlässig bewertete hebräische Text ist die primäre Grundlage. Die abweichende griechische Lesart wird transparent in einer Fußnote dokumentiert.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Weisheitston. „Sinne nicht auf“ ist leicht gehoben, aber geläufig und gibt das bildhafte hebräische Verb natürlicher wieder als das wörtliche „pflüge nicht“.
