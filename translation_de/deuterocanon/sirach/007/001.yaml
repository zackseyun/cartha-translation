base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/007/001.yaml
  text: Do not do evil[a], and evil will not overtake you; keep far from iniquity[b], and it will turn away from you.
translation:
  language: de
  text: Tu nichts Böses[a], und das Böse wird dich nicht einholen. Halte dich fern vom Unrecht[b], und es wird von dir weichen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Beim zweiten Vorkommen kann dasselbe hebräische Wort auch „Unheil“ oder „Schaden“ bedeuten: „Tu nichts Böses, und kein Unheil wird dich einholen.“ Hebräisch und Griechisch verwenden jedoch in beiden Satzteilen jeweils dasselbe Wort.'
    reason: lexical_alternative
  - marker: b
    text: Der letzte Satzteil ist im Hebräischen knapp und kann auch mit „und es wird sich von dir abwenden“ wiedergegeben werden. Gemeint sein kann das Unrecht selbst oder die von ihm ausgehende Gefahr und Wirkung.
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תַּעַשׂ
  choice: Tu nicht
  rationale: 'Die direkte Verneinung mit עשה wird knapp und imperativisch wiedergegeben. Im Zusammenhang mit dem substantivierten Adjektiv ergibt sich natürlich: „Tu nichts Böses“.'
- source_word: רָעָה
  choice: Böses / das Böse
  rationale: Das hebräische Wort steht zweimal und bezeichnet zunächst moralisch Böses; beim zweiten Vorkommen kann es zugleich dessen schädliche Folge meinen. Die Wiederholung im Deutschen bewahrt die rhetorische Verknüpfung und stimmt mit dem griechischen Paralleltext überein.
- source_word: יַשִּׂיגְךָ
  choice: wird dich einholen
  rationale: Das Verb bezeichnet hier das Erreichen oder Einholen eines Verfolgten. „Einholen“ erhält das anschauliche Bild und klingt im Deutschen natürlich.
- source_word: הַרְחֵק
  choice: Halte dich fern
  rationale: Die Form fordert zu aktiver Distanz auf. „Halte dich fern“ bewahrt das räumliche Bild des Hebräischen.
- source_word: מֵעָוֹן
  choice: vom Unrecht
  rationale: עָוֹן kann Unrecht, Schuld oder die daraus entstehende Belastung bezeichnen. „Unrecht“ trägt hier den moralischen Sinn und ermöglicht zugleich, die knappe Folgeaussage nicht unnötig festzulegen.
- source_word: וְיֵט מִמְּךָ
  choice: und es wird von dir weichen
  rationale: Die knappe Formulierung wird ohne ergänztes Subjekt wiedergegeben. „Weichen“ wahrt die Bewegungsvorstellung und lässt offen, ob vor allem das Unrecht selbst oder seine gefährliche Wirkung gemeint ist.
theological_decisions:
- issue: Moralisch Böses oder schädliches Unheil beim zweiten רָעָה
  choice: Beide Vorkommen werden mit „Böses/das Böse“ wiedergegeben.
  alternative: Das zweite Vorkommen könnte mit „Unheil“ oder „Schaden“ übersetzt werden.
  rationale: Hebräisch und Griechisch wiederholen jeweils denselben Ausdruck. Die einheitliche Wiedergabe erhält die Spannung zwischen böser Tat und dem Bösen, das den Täter als Folge einholt, ohne diese Beziehung dogmatisch zu vereinfachen.
- issue: Bezug der Schlussaussage וְיֵט מִמְּךָ
  choice: „und es wird von dir weichen“
  alternative: „und seine Folgen werden von dir weichen“ oder „und es wird sich von dir abwenden“
  rationale: Der hebräische Satz ist knapp und nennt kein neues Subjekt. Die gewählte Form bewahrt diese Offenheit, statt ausdrücklich Folgen, Strafe oder eine handelnde Person einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit kurzen, einprägsamen Mahnsätzen. Die Wiederholung von „Böses“ bildet die hebräische Wortwiederholung sichtbar nach; „Unrecht“ ist allgemein verständlich und weniger altertümlich als „Missetat“ oder „Frevel“.
