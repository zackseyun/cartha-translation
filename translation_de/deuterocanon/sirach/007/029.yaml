translation:
  language: de
  text: Fürchte Gott von ganzem Herzen und achte seine Priester als heilig.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „heilige seine Priester“; der griechische Paralleltext hat: „ehre seine Priester“.'
    reason: Dokumentiert die ungewöhnlich starke hebräische Formulierung und die abweichende griechische Wiedergabe, ohne die Spannung im Haupttext aufzulösen.
lexical_decisions:
- source_word: בְּכָל לִבְּך
  choice: von ganzem Herzen
  rationale: Gibt die hebräische Wendung natürlich und vollständig wieder; לֵב bezeichnet hier die ganze innere Haltung und Entschlossenheit.
- source_word: פְּחַד
  choice: Fürchte
  rationale: Der hebräische Imperativ fordert zur Gottesfurcht auf. „Fürchte“ bewahrt sowohl Ehrfurcht als auch den ernsten Anspruch des Ausdrucks, ohne ihn auf bloßen Respekt abzuschwächen.
- source_word: אִל
  choice: Gott
  rationale: אֵל ist hier die allgemeine Gottesbezeichnung „Gott“. Der griechische Paralleltext hat „den Herrn“, doch die gut bezeugte hebräische Lesart ist vorrangig.
- source_word: הַקְדִישׁ
  choice: achte … als heilig
  rationale: Der Hifil-Imperativ von קדש bedeutet wörtlich „heilige“ beziehungsweise „erkläre/halte für heilig“. Die gewählte Formulierung ist im modernen Deutschen verständlich und bewahrt den Heiligkeitsbezug deutlicher als das allgemeinere „ehre“.
theological_decisions:
- issue: Wie die geforderte Haltung gegenüber den Priestern wiederzugeben ist
  choice: achte seine Priester als heilig
  alternative: ehre seine Priester / heilige seine Priester
  rationale: „Ehre“ stimmt mit der Auslegungstradition und dem griechischen θαύμαζε überein, gibt jedoch קדש nur abgeschwächt wieder. Das wörtliche „heilige“ könnte im Deutschen so verstanden werden, als solle der Leser den Priestern selbst Heiligkeit verleihen. „Als heilig achten“ bewahrt die Aussage, dass sie Gott geweiht sind, ohne eine weitergehende priesterliche Lehre einzutragen.
translation_notes:
  register: Kurzer, würdevoller Mahnspruch in modernem Standarddeutsch. Die parallelen Imperative und die direkte Anrede bleiben erhalten; die Formulierung ist verständlich, ohne den kultischen Heiligkeitsbezug des Hebräischen zu glätten.
