  source_fidelity: '„Fürchte Gott von ganzem Herzen“ gibt בְּכָל־לִבְּךָ פְּחַד אֵל treffend wieder. „Achte seine Priester als heilig“ ist eine angemessene, idiomatische Auslegung von וְאֶת־כֹּהֲנָיו הַקְדִּישׁ: Sie bewahrt den Heiligkeitsbezug des hebräischen Hifil-Imperativs, ohne im Deutschen missverständlich so zu klingen, als solle der Leser Priester selbst heilig machen. Die Fußnote kennzeichnet die wörtlichere Möglichkeit und den abweichenden griechischen Paralleltext sachgerecht.'
  naturalness: Der kurze Mahnspruch ist modernes, würdiges Standarddeutsch. Die Stellung „achte seine Priester als heilig“ ist verständlich und im gegebenen Weisheits- und Kultregister natürlich.
  terminology: „Gott“, „Fürchte“ und „Priester“ sind terminologisch korrekt. Die Wiedergabe des hebräischen הקדיש mit „als heilig achten“ ist gegenüber dem englischen Audit-Trail „honor“ quellentreuer; sie behauptet keine konfessionell spezifische Priesterlehre.
