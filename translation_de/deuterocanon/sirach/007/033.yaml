translation:
  language: de
  text: Streck auch dem Armen deine Hand entgegen[a], damit dein Segen vollkommen wird.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Parallelfassung lautet: „Lass jedem Lebenden die Güte einer Gabe zuteilwerden, und verweigere auch einem Toten keine Güte.“ Der hebräische Textzeuge bietet hier dagegen: „Streck auch dem Armen deine Hand entgegen, damit dein Segen vollkommen wird.“'
    reason: alternative_reading
lexical_decisions:
- source_word: וְגַם
  choice: auch
  rationale: Gibt die additive Verknüpfung mit den vorangehenden Mahnungen knapp und natürlich wieder.
- source_word: לְאֶבְיוֹן
  choice: dem Armen
  rationale: אֶבְיוֹן bezeichnet einen armen oder bedürftigen Menschen; die substantivierte Singularform entspricht der hebräischen Form und ist im Deutschen idiomatisch.
- source_word: הוֹשִׁיט יָד
  choice: streck … deine Hand entgegen
  rationale: Bewahrt das konkrete Bild des Hebräischen, das hier auf helfendes oder gebendes Handeln zielt, ohne dieses Bild interpretierend aufzulösen.
- source_word: לְמַעַן
  choice: damit
  rationale: Drückt den möglichen Zweck- beziehungsweise Folgebezug des hebräischen Ausdrucks klar und zeitgemäß aus.
- source_word: תִּשְׁלַם
  choice: vollkommen wird
  rationale: Die Form von שלם bezeichnet hier am ehesten das Vollständig- oder Ganzwerden; die Wiedergabe legt nicht auf Vergeltung oder Rückzahlung fest.
- source_word: בִּרְכָתֶךָ
  choice: dein Segen
  rationale: Bewahrt die Mehrdeutigkeit von בְּרָכָה zwischen Segen und einer konkret gewährten Segensgabe, statt sie vorschnell als Wohltat oder Geschenk zu deuten.
theological_decisions:
- issue: Starke Abweichung zwischen dem hebräischen und dem griechischen Textzeugen
  choice: Der Haupttext folgt dem erhaltenen hebräischen Wortlaut; die griechische Parallelfassung wird in einer Fußnote vollständig dokumentiert.
  alternative: 'Griechisch: „Lass jedem Lebenden die Güte einer Gabe zuteilwerden, und verweigere auch einem Toten keine Güte.“'
  rationale: Da für diesen Vers ein belastbarer hebräischer Text vorliegt, bildet er die Grundlage. Die griechische Fassung ist keine bloße Übersetzungsvariante, sondern bezeugt einen erheblich anderen Text und darf daher weder in den Haupttext eingemischt noch verschwiegen werden.
- issue: Bedeutungsumfang von בִּרְכָתֶךָ
  choice: „dein Segen“ bleibt im Haupttext offen.
  alternative: „deine Segensgabe“ oder „deine Wohltat“
  rationale: Der hebräische Ausdruck kann den Segen selbst oder konkreter eine segensreiche Gabe bezeichnen. Die offenere Wiedergabe erhält diese inhaltliche Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die körperliche Bildsprache des Ausstreckens der Hand bleibt erhalten; „vollkommen wird“ wahrt die semantische Offenheit von שלם. Der Fußnotenmarker steht unmittelbar bei der inhaltlich abweichenden hebräischen Hauptlesart.
