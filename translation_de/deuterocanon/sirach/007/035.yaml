  terminology: „Weinende“, „Trauernde“ und „trauere mit“ geben die hebräischen Personenbezeichnungen und die reflexiv-partizipative Aufforderung angemessen wieder. Die Fußnote sollte das griechische „durch solches/dadurch“ nicht spezifizierend als „durch solche Taten“ wiedergeben, da das griechische τοιούτων keine ausdrückliche Benennung von Taten enthält.
