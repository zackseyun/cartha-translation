  text: Do not delay with those who weep[a], and mourn with those who mourn.
translation:
  language: de
  text: Zögere nicht, bei den Weinenden zu sein,[a] und trauere mit den Trauernden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Überlieferung lautet: „Zögere nicht, einen Kranken zu besuchen; denn dadurch wirst du geliebt werden.“ Sie weicht erheblich vom erhaltenen hebräischen Text ab.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תִּתְאַחֵר מִבּוֹכִים
  choice: Halte dich nicht von den Weinenden fern
  rationale: Das Verb bezeichnet ein Sich-Verspäten oder Zurückhalten. Zusammen mit der hebräischen Präposition, die formal „von“ bedeutet, ergibt sich im parallelen Zusammenhang die Aufforderung, sich Weinenden nicht zu entziehen. Diese Fassung bewahrt sowohl die sprachliche Form als auch den Sinn solidarischer Nähe.
- source_word: בּוֹכִים
  choice: die Weinenden
  rationale: Das Partizip bezeichnet Menschen, die weinen. „Die Weinenden“ ist präzise, verständlich und wahrt die Parallele zu „den Trauernden“.
- source_word: אֲבֵלִים
  choice: die Trauernden
  rationale: Das Wort bezeichnet Menschen in Trauer, besonders Trauernde im Zusammenhang eines Todesfalls. Die substantivierte Form ist knapp und lässt den genauen Anlass offen.
- source_word: תִּתְאַבָּל
  choice: trauere
  rationale: Die reflexive Verbform bezeichnet das Eintreten in oder Vollziehen von Trauer. „Trauere mit“ gibt die Aufforderung zu gemeinsam getragener Trauer natürlich wieder.
theological_decisions:
- issue: Verhältnis des erhaltenen hebräischen Textes zur griechischen Überlieferung
  choice: Der Haupttext folgt dem erhaltenen Hebräisch und fordert zur Solidarität mit Weinenden und Trauernden auf.
  alternative: 'Die griechische Überlieferung lautet sinngemäß: „Zögere nicht, einen Kranken zu besuchen; denn durch solche Taten wirst du geliebt werden.“'
  rationale: Wo für Jesus Sirach ein zuverlässiger hebräischer Text erhalten ist, dient er als primäre Grundlage. Da die griechische Fassung hier nicht bloß eine kleine Variante, sondern einen wesentlich anderen Satz bietet, wird sie als bedeutsame alternative Überlieferung in einer Fußnote dokumentiert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallelen Bezeichnungen „Weinenden“ und „Trauernden“ sowie die Wiederaufnahme von „Trauernden“ durch „trauere“ bilden die hebräische Struktur nach. „Halte dich nicht … fern“ verdeutlicht die im Hebräischen formal spannungsreiche Verbindung von Verzögerung beziehungsweise Zurückhaltung mit der Präposition „von“, ohne sie als Aufforderung zur Distanz misszuverstehen.
