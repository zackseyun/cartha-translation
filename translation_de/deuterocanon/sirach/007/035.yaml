  source_fidelity: Der Haupttext muss dem erhaltenen Hebräisch folgen. „Halte dich nicht … fern“ gibt zwar die solidarische Stoßrichtung wieder, ersetzt aber das Verbot zu zögern bzw. sich aufzuhalten (אַל תִּתְאַחֵר) durch ein anderes Bild der Distanz. „Zögere nicht, bei den Weinenden zu sein“ bewahrt sowohl die zeitlich-dringliche Aufforderung als auch die durch מִן im Zusammenhang nahegelegte Zuwendung. Der zweite Halbvers ist treffend wiedergegeben.
