translation:
  language: de
  text: Strebe nicht danach, Herrscher zu werden, wenn dir die Kraft fehlt, der Anmaßung ein Ende zu setzen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Text lautet: „Rechtfertige dich nicht vor dem Herrn, und handle vor einem König nicht klug.“ Er bietet damit eine wesentlich andere Fassung des Verses.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תְּבַקֵּשׁ
  choice: Strebe nicht danach
  rationale: בקש bezeichnet hier das bewusste Anstreben eines Amtes. „Strebe nicht danach“ ist im Deutschen natürlich und gibt den warnenden Sinn präziser wieder als das missverständliche „Suche nicht“.
- source_word: לִהְיוֹת מוֹשֵׁל
  choice: Herrscher zu werden
  rationale: מושל bezeichnet eine regierende oder herrschende Person. Mit „zu werden“ bleibt der auf das angestrebte Amt gerichtete Sinn der hebräischen Fügung erhalten.
- source_word: חַיִל
  choice: Kraft
  rationale: חיל kann Kraft, Fähigkeit, Macht oder Mittel bezeichnen. „Kraft“ bewahrt die Breite des Ausdrucks und lässt hier sowohl persönliche Durchsetzungsfähigkeit als auch praktische Befähigung anklingen.
- source_word: לְהַשְׁבִּית
  choice: ein Ende zu setzen
  rationale: Der Hifil von שבת bedeutet, etwas aufhören zu lassen. Die Wendung bezeichnet ein entschiedenes Beenden, ohne unnötig gewaltsame Untertöne einzutragen.
- source_word: זָדוֹן
  choice: Anmaßung
  rationale: זדון bezeichnet stolze, vermessene und mitunter boshafte Selbstüberhebung. „Anmaßung“ erfasst sowohl die innere Überheblichkeit als auch ihr sozial schädliches Auftreten.
- source_word: μὴ δικαίου ἔναντι Κυρίου, καὶ παρὰ βασιλεῖ μὴ σοφίζου
  choice: nur in der Fußnote als abweichende griechische Textform wiedergegeben
  rationale: Der griechische Text weicht wesentlich vom erhaltenen Hebräisch ab. Da für Jesus Sirach vorhandener hebräischer Text vorrangig ist, bestimmt er den Haupttext; die griechische Form wird zur textkritischen Transparenz dokumentiert.
theological_decisions:
- issue: Stark voneinander abweichende hebräische und griechische Fassungen von Sirach 7,5
  choice: Die erhaltene hebräische Fassung steht im Haupttext.
  alternative: 'Griechisch: „Rechtfertige dich nicht vor dem Herrn, und vor einem König spiele nicht den Weisen.“'
  rationale: Die hebräische Textüberlieferung ist hier vorhanden und wird deshalb als Ausgangstext übersetzt. Die deutlich andere griechische Fassung wird nicht harmonisiert oder verschwiegen, sondern als eigenständige Textform in der Fußnote bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Formulierung ist allgemein verständlich, wahrt jedoch den prägnanten Ton einer Weisheitsmahnung. „Herrscher“ bleibt geschlechtsgenerisch und entspricht dem historischen Regierungsamt; „Anmaßung“ hält die moralische und gesellschaftliche Dimension des hebräischen Ausdrucks offen.
