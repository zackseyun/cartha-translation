  text: Do not count yourself among the people’s dead[b][a]; remember that passing away will not pass over.
translation:
  language: de
  text: 'Rechne dich nicht zu den Toten des Volkes; denk daran: Das Dahinscheiden geht an niemandem vorüber.[b][a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Überlieferung lautet: „Hasse nicht mühevolle Arbeit und den Ackerbau, der vom Höchsten geschaffen wurde.“ Sie weicht hier erheblich vom erhaltenen hebräischen Text ab.'
    reason: alternative_reading
  - marker: b
    text: Das Hebräische ist schwierig und enthält vermutlich ein Wortspiel mit „dahinscheiden“ und „vorübergehen“. Gemeint ist wohl, dass Tod oder Sterblichkeit niemanden auslassen.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תַּחְשׁוֹבְךָ
  choice: Rechne dich nicht
  rationale: Die Wendung mit חשב bezeichnet hier das Zurechnen zu einer Gruppe. „Rechne dich nicht“ bewahrt die knappe Mahnform des Hebräischen.
- source_word: בָּמֳתֵי עָם
  choice: zu den Toten des Volkes
  rationale: Die komprimierte hebräische Fügung wird konkret als Zugehörigkeit zu den Toten des Volkes wiedergegeben, ohne sie zu einer abstrakten Aussage über den Tod umzudeuten.
- source_word: זְכוֹר
  choice: denk daran
  rationale: Der Imperativ von זכר wird in natürlichem modernem Deutsch wiedergegeben; „denk daran“ trägt hier denselben mahnenden Sinn wie „erinnere dich“.
- source_word: עִבָּרוֹן
  choice: das Dahinscheiden
  rationale: Das schwierige Substantiv wird im Zusammenhang mit Sterblichkeit als „Dahinscheiden“ verstanden. Die Wahl hält den Bezug zum Fortgehen bzw. Vorübergehen erkennbar, ohne eine unsichere Deutung wie „Zorn“ oder „Übertretung“ einzutragen.
- source_word: לֹא יִתְעַבָּר
  choice: geht an niemandem vorüber
  rationale: Die Form von עבר bezeichnet etwas, das nicht vorbeigeht oder niemanden auslässt. Die idiomatische deutsche Formulierung vermittelt diesen Sinn und lässt zugleich das hebräische Wortspiel mit עִבָּרוֹן anklingen.
- source_word: μὴ μισήσῃς ἐπίπονον ἐργασίαν καὶ γεωργίαν ὑπὸ Ὑψίστου ἐκτισμένην
  choice: nicht in den Haupttext aufgenommen
  rationale: Die griechische Überlieferung weicht grundlegend vom erhaltenen hebräischen Text ab. Da hier ein hochsicherer hebräischer Zeuge vorliegt, wird die griechische Fassung transparent in einer Fußnote dokumentiert.
theological_decisions:
- issue: Abweichung zwischen dem erhaltenen hebräischen Ben-Sira-Text und der griechischen Überlieferung
  choice: Der Haupttext folgt dem erhaltenen Hebräisch; die griechische Fassung steht in einer Fußnote.
  alternative: „Hasse nicht mühevolle Arbeit und den Ackerbau, der vom Höchsten geschaffen wurde.“
  rationale: Wo der hebräische Sirachtext erhalten und verlässlich ist, bildet er die Grundlage. Die erheblich abweichende griechische Tradition darf jedoch nicht verschwiegen oder in den Haupttext eingearbeitet werden.
- issue: Deutung des schwierigen Wortspiels עִבָּרוֹן / יִתְעַבָּר
  choice: Als Aussage über das unausweichliche Dahinscheiden wiedergegeben
  alternative: Deutungen im Sinn von „Übertretung“, „Zorn“ oder „Abwendung“
  rationale: Der unmittelbare Zusammenhang mit „den Toten“ und die Wiederholung der Wurzel עבר sprechen für ein Wortspiel über Dahinscheiden und Vorübergehen. Wegen der sprachlichen Schwierigkeit wird die Unsicherheit in der Fußnote offengelegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Mahnform bleibt erhalten; die zweite Satzhälfte ist leicht idiomatisiert, damit das schwierige hebräische Wortspiel verständlich wird, ohne seine Unsicherheit zu verdecken.
