  source_fidelity: Der Haupttext muss die hebräische Vorlage wiedergeben. Die eröffnende Wortstellung „Hast du eine Frau“ wird im heutigen Deutsch regelmäßig als Frage verstanden, obwohl das Hebräische keine Frage formuliert. Außerdem ist שְׂנוּאָה eine passive/adjektivische Form („verhasst“, „gehasst“); ein ausdrückliches „die du hasst“ legt den im Hebräischen nicht genannten Handelnden fest.
  naturalness: „Verabscheue deine Frau nicht“ und „einer verhassten Frau vertraue nicht“ sind klare, moderne und zugleich würdige Weisheitssprache. Sie vermeiden die unbeabsichtigte Frageform. Die griechische Fußnote wird mit idiomatischem, genauerem „nach deinem Wunsch“ und der korrekten Imperativform „Verstoße“ formuliert.
  terminology: „Frau“ ist im Kontext die angemessene Wiedergabe von אִשָּׁה; „deine Frau“ macht die durch לְךָ bezeichnete persönliche Beziehung natürlich sichtbar. „Verabscheuen“ gibt die Stärke von תעב wieder; „vertrauen“ entspricht אמן im Hifil mit ב. „Verhasst“ bewahrt die nicht weiter bestimmte passive/adjektivische Form שְׂנוּאָה.
  issues:
