    issue: Die Eröffnung „Hast du eine Frau“ ist als Frage formuliert.
    rationale: Die hebräische Vorlage enthält keine Interrogativpartikel und stellt keine Frage. Im Deutschen wird Verb-Erststellung hier normalerweise interrogativ verstanden.
  - severity: medium
    issue: „die du hasst“ bestimmt den Bezug von שְׂנוּאָה zu eng.
    rationale: Die hebräische Form ist passiv/adjektivisch und nennt nicht, wer die Frau hasst. „Verhassten“ erhält diese Offenheit.
  - severity: low
    issue: Die griechische Fußnote hat „Verstoß“ statt „Verstoße“ und „nach deinem Herzen“ ist weniger genau.
    rationale: Der Imperativ von „verstoßen“ lautet „Verstoße“. κατὰ ψυχήν bezeichnet hier eher Wunsch bzw. Neigung als das im Deutschen stärker emotional gefärbte „Herz“.
