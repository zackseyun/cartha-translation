translation:
  language: de
  text: Verabscheue deine Frau nicht; einer verhassten Frau vertraue nicht.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Parallelüberlieferung lautet: „Hast du eine Frau nach deinem Wunsch? Verstoße sie nicht.“ Der erhaltene hebräische und der griechische Text weichen in diesem Vers deutlich voneinander ab; der Haupttext folgt dem Hebräischen.'
    reason: alternative_reading
lexical_decisions:
- source_word: אִשָּׁה לְךָ
  choice: Hast du eine Frau
  rationale: Die Verbindung aus אִשָּׁה und לְךָ bezeichnet hier am natürlichsten die eigene Ehefrau. Die deutsche Wendung ist verständlich und gibt die hebräische Zugehörigkeitskonstruktion wieder, ohne ein zusätzliches Possessivpronomen zu erzwingen.
- source_word: אַל תְּתַעֲבֶהָ
  choice: verabscheue sie nicht
  rationale: תעב bezeichnet starke Abneigung oder Zurückweisung. „Verabscheuen“ bewahrt diese Intensität genauer als das schwächere „verachten“ und bleibt im modernen Standarddeutsch natürlich.
- source_word: וּשְׂנוּאָה
  choice: doch einer Frau, die du hasst
  rationale: Die Form kann wörtlich eine „Gehasste“ oder „Verhasste“ bezeichnen. Die Relativkonstruktion macht den relationalen Sinn im Deutschen klar, ohne zu unterstellen, dass sie allgemein oder von anderen gehasst wird. „Doch“ bildet den im Hebräischen knappen Gegensatz idiomatisch ab.
- source_word: אַל תַּאֲמֵן בָּהּ
  choice: vertraue nicht
  rationale: אמן im Hifil mit ב bedeutet, jemandem Vertrauen zu schenken oder sich auf jemanden zu verlassen. Das einfache „vertraue nicht“ gibt den Sinn ohne den im Hebräischen nicht ausdrücklich enthaltenen Zusatz „dich ihr an“ wieder.
theological_decisions:
- issue: Deutliche Abweichung zwischen dem erhaltenen hebräischen Text und der griechischen Parallelüberlieferung
  choice: Der Haupttext folgt dem hebräischen Zeugen; die eigenständige griechische Lesart wird in einer Fußnote vollständig bewahrt.
  alternative: 'Griechisch: „Hast du eine Frau nach deinem Herzen? Verstoß sie nicht.“'
  rationale: Da für diesen Vers ein hoch eingestufter hebräischer Textzeuge vorliegt, bildet er die Grundlage. Die griechische Überlieferung unterscheidet sich jedoch sowohl in der Beschreibung der Frau als auch dadurch, dass sie statt des hebräischen zweiten Satzteils ein Verbot des Verstoßens bietet; diese bedeutende Variante darf nicht stillschweigend eingeebnet werden.
translation_notes:
  register: Moderne, würdige Weisheitssprache mit direkter Anrede. Die schroffe Spannung des hebräischen Parallelismus wird beibehalten und nicht harmonisiert.
