  text: Do not justify yourself before a king[a], and do not show understanding before a king.
translation:
  language: de
  text: Rechtfertige dich nicht vor einem König,[a] und zeige dich vor einem König nicht als verständig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Text lautet: „Strebe vom Herrn keine Herrschaft an und von einem König keinen Ehrensitz.“ Der hier zugrunde gelegte hebräische Text weicht erheblich davon ab.'
    reason: textual_variant
lexical_decisions:
- source_word: אַל תִּצְטַדֵּק
  choice: Rechtfertige dich nicht
  rationale: 'Das Hitpael von צדק hat hier reflexive Kraft: sich als gerecht erweisen oder sich rechtfertigen. Die gewählte Formulierung bewahrt diese Reflexivität, ohne das Verhalten vorschnell als Selbstgerechtigkeit zu deuten.'
- source_word: לִפְנֵי מֶלֶךְ
  choice: vor einem König
  rationale: לִפְנֵי bezeichnet hier die Gegenwart beziehungsweise das Angesicht einer Person; מֶלֶךְ steht ohne Artikel, daher ist „einem König“ angemessen.
- source_word: וּמִפְּנֵי מֶלֶךְ
  choice: und … vor einem König
  rationale: Die Wendung ist eng parallel zum ersten Halbvers. Die Wiederholung von „vor einem König“ bildet diese Parallelität kompakt ab.
- source_word: אַל תִּתְבּוֹנֵן
  choice: zeige dich … nicht als verständig
  rationale: Die Form von בין bezeichnet im Zusammenhang nicht nur inneres Nachdenken, sondern ein Auftreten als einsichtig oder klug. Die reflexive deutsche Wendung gibt diesen sozialen Aspekt wieder und lässt offen, ob vor allem zur Schau gestellte Einsicht oder anmaßende Klugheit gemeint ist.
theological_decisions:
- issue: Erhebliche Abweichung zwischen dem hebräischen und dem griechischen Textzeugen
  choice: 'Der erhaltene hebräische Text wird als Haupttext übersetzt: Warnung vor Selbstrechtfertigung und davor, sich vor einem König als verständig zu zeigen.'
  alternative: 'Der griechische Text lautet sinngemäß: „Strebe vom Herrn keine Herrschaft an und von einem König keinen Ehrensitz.“'
  rationale: Da für diesen Vers ein belastbarer hebräischer Zeuge vorliegt, erhält er den Vorrang. Der griechische Paralleltext bietet eine wesentlich andere Aussage und wird deshalb transparent in einer Fußnote dokumentiert, nicht in den Haupttext eingemischt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung „vor einem König“ bewahrt den hebräischen Parallelismus; „zeige dich … als verständig“ klingt bewusst mahnend, ohne das mehrdeutige Verb auf bloße Angeberei oder innere Überlegung festzulegen.
