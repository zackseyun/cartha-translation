  text: With all your strength[a], love your Maker[b], and do not forsake his ministers.
translation:
  language: de
  text: Liebe deinen Schöpfer mit all deiner Kraft[a], und verlass seine Diener[b] nicht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit deiner ganzen Macht“. Gemeint ist der volle Einsatz der eigenen Kräfte.'
    reason: lexical_alternative
  - marker: b
    text: 'Möglicherweise sind besonders diejenigen gemeint, die Gott im Heiligtum dienen; auch: „die ihm dienen“.'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּכָל מְאֹדְךָ
  choice: mit all deiner Kraft
  rationale: מְאֹד bezeichnet in dieser Wendung die ganze Kraft oder Macht eines Menschen. Die griechische Parallele ἐν ὅλῃ δυνάμει bestätigt dieses Verständnis. Die Formulierung ist im heutigen Deutsch natürlich und gibt die uneingeschränkte Hingabe wieder.
- source_word: אֱהוֹב
  choice: Liebe
  rationale: Der Imperativ von אהב wird direkt und ohne interpretierende Erweiterung mit „Liebe“ wiedergegeben.
- source_word: עוֹשֶׂךָ
  choice: deinen Schöpfer
  rationale: Das Partizip bedeutet wörtlich „den, der dich gemacht hat“. „Deinen Schöpfer“ ist knapp, würdig und bezeichnet hier eindeutig Gott; auch die griechische Parallele τὸν ποιήσαντά σε stützt diese Bedeutung.
- source_word: מְשָׁרְתָיו
  choice: seine Diener
  rationale: שרת bezeichnet Menschen, die einen Dienst ausüben, häufig mit amtlichem oder kultischem Bezug. „Diener“ bewahrt die mögliche sakrale Bedeutung, ohne sie auf Priester allein festzulegen.
- source_word: לֹא תַעֲזֹב
  choice: verlass … nicht
  rationale: עזב bedeutet „verlassen, im Stich lassen, aufgeben“. Die knappe Wiedergabe folgt der hebräischen Form und bewahrt den nachdrücklichen Aufruf zur Treue.
theological_decisions:
- issue: Bezeichnung Gottes durch עוֹשֶׂךָ
  choice: deinen Schöpfer
  alternative: den, der dich gemacht hat
  rationale: Der Ausdruck bezeichnet Gott in seiner persönlichen Beziehung zum Menschen als dessen Schöpfer. Die substantivische Wiedergabe fügt keine weitergehende Lehraussage hinzu.
- issue: Bezugsgruppe von מְשָׁרְתָיו
  choice: seine Diener
  alternative: die ihm dienen
  rationale: Hebräisch und Griechisch lassen an Personen in Gottes Dienst denken, wahrscheinlich mit kultischem oder priesterlichem Beiklang. Da der genaue Personenkreis nicht ausdrücklich eingegrenzt wird, bleibt die Übersetzung allgemein und erläutert die engere Möglichkeit in einer Fußnote.
translation_notes:
  register: Modernes, klares und würdiges Standarddeutsch. Der Satzbau bleibt nahe am hebräischen Imperativstil. „Diener“ erhält die mögliche kultische Nuance, während die Fußnote eine vorschnelle Beschränkung auf einen bestimmten Stand vermeidet.
