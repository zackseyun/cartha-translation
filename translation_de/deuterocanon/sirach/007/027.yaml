  text: With all your heart honor your father[a], and do not forget the labor pains of your mother.
translation:
  language: de
  text: Ehre deinen Vater von ganzem Herzen, und vergiss nicht die Geburtswehen deiner Mutter.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hebräische Wortlaut ist knapp und kann auch wiedergegeben werden: „und vergiss nicht die Mutter, die dich geboren hat“. Die griechische Parallele lautet ausdrücklich: „Vergiss nicht die Geburtswehen deiner Mutter.“'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּכָל לִבְּךָ
  choice: von ganzem Herzen
  rationale: Die geläufige deutsche Wendung gibt die hebräische Aussage von ungeteilter, aufrichtiger Hingabe eng und natürlich wieder.
- source_word: כַּבֵּד
  choice: Ehre
  rationale: Das Verb כבד bezeichnet hier, wie auch im biblischen Gebot gegenüber den Eltern, das Erweisen der gebührenden Achtung.
- source_word: לְאָבִיךָ
  choice: deinen Vater
  rationale: Die konkrete familiäre Bezeichnung und die Anrede in der zweiten Person werden unmittelbar beibehalten.
- source_word: וְאֵם יוֹלַדְתְּךָ
  choice: deiner Mutter
  rationale: Wörtlich steht im Hebräischen etwa „und die Mutter, die dich geboren hat“. Die persönliche Zuordnung ist im Deutschen mit „deiner Mutter“ klar; der Geburtsbezug bleibt durch „Geburtswehen“ erhalten.
- source_word: אַל תִּשֶּׁה
  choice: vergiss nicht
  rationale: Die griechische Parallele μὴ ἐπιλάθῃ stützt die Bedeutung „vergiss nicht“ und klärt den knappen hebräischen Schluss.
- source_word: μητρὸς ὠδῖνας
  choice: die Geburtswehen deiner Mutter
  rationale: Die griechische Parallele macht die im Hebräischen stark verkürzte Aussage ausdrücklich. „Geburtswehen“ ist präzise, verständlich und bewahrt den Bezug auf das Leiden der Mutter bei der Geburt.
theological_decisions:
- issue: Verhältnis des hebräischen Hauptzeugen zur erläuternden griechischen Parallele
  choice: Der hebräische Text bleibt maßgeblich; die griechische Parallele erläutert den knappen zweiten Satzteil als Erinnerung an die Geburtswehen der Mutter.
  alternative: 'Den hebräischen Wortlaut formal nachbilden, etwa: „und die Mutter, die dich geboren hat, vergiss nicht“.'
  rationale: Die alternative Fassung wäre möglich und näher an der erhaltenen hebräischen Syntax. Die griechische Parallele bietet jedoch eine alte, inhaltlich schlüssige Ausformulierung, die das Objekt des Nichtvergessens als die Geburtswehen bestimmt. Eine Fußnote macht diese textliche Spannung transparent.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Von ganzem Herzen“ ist idiomatisch; „Geburtswehen“ ist klar und gegenwärtig, ohne klinisch oder altertümlich zu wirken.
