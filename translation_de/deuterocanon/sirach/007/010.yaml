translation:
  language: de
  text: Verliere beim Beten nicht den Mut, und versäume es nicht, Almosen zu geben.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort צדקה kann auch „Gerechtigkeit“ bedeuten; hier gibt die griechische Parallelüberlieferung ausdrücklich den Sinn „Almosen geben“ wieder.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּתְקַצֵּר
  choice: Verliere … nicht den Mut
  rationale: Die hebräische Form ist für sich genommen schwierig. Das griechische Parallelzeugnis μὴ ὀλιγοψυχήσῃς stützt deutlich den Sinn, beim Beten nicht mutlos zu werden, statt das Gebet nicht zu verkürzen.
- source_word: בַּתְּפִלָּה
  choice: beim Beten
  rationale: Das Hebräische bedeutet wörtlich „im Gebet“. „Beim Beten“ ist im modernen Deutschen natürlich und fügt anders als das Griechische kein ausdrückliches Possessivpronomen hinzu.
- source_word: וּבִצְדָקָה
  choice: Almosen zu geben
  rationale: צדקה kann „Gerechtigkeit“ bezeichnen, steht im späteren Hebräisch aber auch für Wohltätigkeit bzw. Almosengeben. Das griechische ἐλεημοσύνην ποιῆσαι bestätigt hier diesen konkreten Sinn.
- source_word: אַל תִּתְעַבָּר
  choice: versäume es nicht
  rationale: Das Verb vermittelt den Gedanken des Vorübergehens oder Außerachtlassens; das griechische μὴ παρίδῃς bestätigt „nicht übersehen/vernachlässigen“. „Versäume es nicht“ ist eine natürliche deutsche Mahnformel.
