  text: Do not chatter in the assembly of rulers[b][a], and do not repeat a word in your prayer.
translation:
  language: de
  text: Führe in der Versammlung der Mächtigen kein Geschwätz,[a] und wiederhole im Gebet kein Wort.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „Schwatze nicht“ oder „rede nicht weitschweifig“. Die griechische Parallele warnt entsprechend vor müßigem oder übermäßigem Reden unter Ältesten.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Wiederhole im Gebet kein Wort.“ Gemeint ist wahrscheinlich unnötige oder mechanische Wiederholung, nicht ausnahmslos jede wiederholte Bitte.'
    reason: alternative_reading
lexical_decisions:
- source_word: תְּסַוֵּר
  choice: rede nicht geschwätzig
  rationale: Das Verb bezeichnet hier, gestützt durch das griechische ἀδολέσχει, weitschweifiges, müßiges oder undiszipliniertes Reden. Die Formulierung ist verständlich, ohne das Verbot auf jedes Sprechen auszudehnen.
- source_word: בַּעֲדַת
  choice: in der Versammlung
  rationale: עֵדָה bezeichnet eine versammelte Gemeinschaft oder Körperschaft; „Versammlung“ bewahrt den formellen öffentlichen Rahmen.
- source_word: שָׂרִים
  choice: der Herrschenden
  rationale: שָׂרִים bezeichnet hochgestellte Personen mit Macht oder Amtsgewalt. „Herrschende“ ist weiter als „Fürsten“ und bildet den hebräischen Ausdruck unmittelbarer ab als das griechische „Älteste“.
- source_word: תִּישֶׁן דָּבָר
  choice: wiederhole … kein Wort
  rationale: Die schwierige hebräische Wendung wird durch das griechische μὴ δευτερώσῃς λόγον im Sinn von „kein Wort wiederholen“ gestützt. Die konkrete, etwas ungewohnte Ausdrucksweise erhält die Offenheit des Ausgangstextes.
- source_word: בַּתְּפִלָּה
  choice: im Gebet
  rationale: Dies gibt den hebräischen Ausdruck unmittelbar wieder. Das Possessivpronomen des griechischen Paralleltexts muss im Deutschen nicht ergänzt werden.
theological_decisions:
- issue: Ob der zweite Halbvers jede Wiederholung im Gebet oder leere beziehungsweise mechanische Wiederholung untersagt
  choice: Der Haupttext bleibt bei der wörtlich nahen Mahnung, im Gebet kein Wort zu wiederholen; die Fußnote erläutert die wahrscheinlich gemeinte unnötige oder mechanische Wiederholung.
  alternative: „Wiederhole dich nicht beim Beten“ oder eine ausdrückliche Deutung als Verbot bloß gedankenloser Wiederholung.
  rationale: Hebräischer Text und griechische Parallele sprechen konkret vom Wiederholen eines Wortes. Eine interpretierende Einschränkung im Haupttext würde die echte Spannung vorschnell auflösen; zugleich verhindert die Fußnote, dass daraus ohne Weiteres ein Verbot jeder wiederholten Bitte abgeleitet wird.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Rede nicht geschwätzig“ hält die Warnung vor übermäßigem Gerede fest, ohne umgangssprachlich zu wirken. Die parallelen Imperative und die knappe Satzgestalt des hebräischen Weisheitsspruchs bleiben erhalten.
