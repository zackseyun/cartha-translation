translation:
  language: de
  text: Hast du Vieh, behalte es im Auge[a]; und wenn es brauchbar ist[b], behalte es.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „sieh [mit] deinen Augen“. Gemeint ist, das Vieh aufmerksam zu beaufsichtigen oder zu prüfen.'
    reason: lexical_alternative
  - marker: b
    text: Die genaue Bedeutungsnuance des hebräischen אֻמָּנָה ist hier unsicher; die griechische Parallelüberlieferung hat „nützlich“ oder „brauchbar“.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּהֵמָה לְךָ
  choice: Hast du Vieh
  rationale: Die verblos formulierte hebräische Wendung bezeichnet Besitz. „Vieh“ erfasst hier kollektiv gehaltene Nutztiere und entspricht auch dem griechischen κτήνη, ohne die Aussage auf Rinder zu verengen.
- source_word: רְאֵה עֵינֶיךָ
  choice: behalte es im Auge
  rationale: Die wörtliche Wendung „sieh [mit] deinen Augen“ fordert in diesem Zusammenhang zu aufmerksamer Beaufsichtigung oder Prüfung auf. Die deutsche Redewendung bewahrt das Bild der Augen und gibt den praktischen Sinn natürlich wieder.
- source_word: אֻמָּנָה
  choice: brauchbar
  rationale: Die genaue Bedeutung des hebräischen Wortes an dieser Stelle ist unsicher. Das griechische χρήσιμα stützt „brauchbar“ beziehungsweise „nützlich“; „einträglich“ würde den wirtschaftlichen Aspekt stärker festlegen, als es die Quellen verlangen.
- source_word: הַעֲמִידָהּ
  choice: behalte es
  rationale: Die Hifil-Form von עמד bedeutet wörtlich etwa „stehen lassen/erhalten“. Im Zusammenhang ist gemeint, das Tier weiterhin zu halten. Das singularische Pronomen folgt dem grammatisch singularischen hebräischen Sammelbegriff.
