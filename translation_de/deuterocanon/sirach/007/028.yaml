    rationale: Die hebräische Formulierung ist elliptisch und textlich bzw. syntaktisch schwierig; die Fußnote sollte diese Schwierigkeit nicht durch einen scheinbar präzisen, aber unidiomatischen Wortlaut verdecken. Der griechische Paralleltext kann als ausdrücklichere Klärung benannt werden.
