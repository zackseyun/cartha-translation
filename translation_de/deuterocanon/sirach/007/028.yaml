base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/007/028.yaml
  text: Remember that if not for them[a], you would not have come into the world[b]; and what can you do for them as they have done for you?
translation:
  language: de
  text: 'Denk daran: Ohne sie[a] wärst du nicht zur Welt gekommen. Was könntest du ihnen für das zurückgeben, was sie für dich getan haben?[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint sind deine Eltern; das Pronomen ergibt sich aus dem unmittelbaren Zusammenhang.
    reason: cross_reference
  - marker: b
    text: 'Das Hebräische ist hier knapp und elliptisch und fragt wörtlich etwa, was du für sie tust im Verhältnis zu dem, was sie dir erweisen. Die griechische Überlieferung formuliert den Gedanken ausdrücklich als Frage nach einer Erwiderung: „Was wirst du ihnen zurückerstatten, entsprechend dem, was sie für dich getan haben?“'
    reason: lexical_alternative
lexical_decisions:
- source_word: זְכוֹר
  choice: Denk daran
  rationale: Der Imperativ von זכר fordert zu bewusstem Erinnern auf; „Denk daran“ ist im modernen Standarddeutsch unmittelbar und natürlich.
- source_word: לוּלֵי הֵם
  choice: Ohne sie
  rationale: Die hebräische Wendung bezeichnet eine kontrafaktische Abhängigkeit. „Ohne sie“ gibt dies knapp und idiomatisch wieder; das griechische διʼ αὐτῶν bestätigt den Bezug.
- source_word: לֹא בָאתָ לָעוֹלָם
  choice: wärst du nicht zur Welt gekommen
  rationale: Die Formulierung bewahrt das hebräische Bild vom Kommen in die Welt und drückt zusammen mit „ohne sie“ den kontrafaktischen Sinn aus.
- source_word: וּמָה אַתָּה עוֹשֶׂה לָהֶם
  choice: Was kannst du ihnen zurückgeben
  rationale: Das Hebräische fragt wörtlich nach dem Tun für sie; die rhetorische Aussage zielt jedoch auf eine kaum mögliche Gegenleistung. Das griechische ἀνταποδώσεις stützt ausdrücklich den Gedanken des Zurückgebens.
- source_word: שֶׁהֵם גּוֹמְלִים לָךְ
  choice: für das, was sie für dich getan haben
  rationale: גמל kann „vergelten“, „erweisen“ oder „jemandem etwas tun“ bedeuten. Die Wiedergabe hält die Wohltat der Eltern fest, ohne eine genaue Gleichwertigkeit der Gegenleistung in den Text einzutragen.
theological_decisions:
- issue: Bezugswort des Pronomens „sie“
  choice: Das Pronomen bleibt im Haupttext stehen und bezeichnet im Zusammenhang die Eltern.
  alternative: „deine Eltern“ ausdrücklich in den Haupttext einsetzen
  rationale: Hebräisch und Griechisch nennen an dieser Stelle nur das Pronomen; der unmittelbare Zusammenhang liefert den Bezug auf Vater und Mutter. Eine Fußnote macht ihn deutlich, ohne die Form des Ausgangstextes zu erweitern.
- issue: Art der möglichen Gegenleistung
  choice: Die rhetorische Frage wird als Zurückgeben für empfangene Wohltat formuliert.
  alternative: „Was tust du ihnen, wie sie dir tun?“
  rationale: Die wörtlichere Alternative wäre im Deutschen unklar. Die griechische Parallelüberlieferung verwendet ἀνταποδώσεις und macht den Vergeltungs- bzw. Rückerstattungsaspekt ausdrücklich, ohne zu behaupten, eine gleichwertige Gegenleistung sei tatsächlich möglich.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter Anrede. Der erste Satz folgt eng dem hebräischen Bild; der zweite wird durch die griechische Parallelüberlieferung verständlich als rhetorische Frage nach einer Gegenleistung formuliert. Alle Fußnotenmarker stehen im Haupttext.
