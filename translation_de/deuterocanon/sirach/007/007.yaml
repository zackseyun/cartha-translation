translation:
  language: de
  text: Mach dich nicht schuldig in der Versammlung an den Toren Gottes[a], und bring dich in der Gemeinde nicht zu Fall.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Parallele lautet: „Sündige nicht in der Menge einer Stadt, und bring dich nicht selbst in einer Menschenmenge zu Fall.“ Dies kann auf eine andere hebräische Lesart oder auf eine deutende Glättung der hebräischen Wendung „Tore Gottes“ zurückgehen.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תַּרְשִׁיעֲךָ
  choice: Mach dich nicht schuldig
  rationale: Der Hifil von רשע kann das Schuldigwerden oder Schuldig-machen bezeichnen. Mit dem rückbezüglichen Suffix liegt hier nahe, dass jemand Schuld auf sich lädt; die griechische Parallele bestätigt den moralischen Sinn, ist aber allgemeiner.
- source_word: בַּעֲדַת
  choice: in der Versammlung
  rationale: עֵדָה bezeichnet eine versammelte Gruppe oder Gemeinschaft. „Versammlung“ gibt den öffentlichen, gemeinschaftlichen Rahmen natürlich wieder.
- source_word: שַׁעֲרֵי אֵל
  choice: an den Toren Gottes
  rationale: Die ungewöhnliche hebräische Wendung lautet wörtlich „Tore Gottes“. Die Übersetzung bewahrt sie und lässt ihre mögliche öffentliche oder gerichtliche Konnotation offen.
- source_word: וְאַל תַּפִּילְךָ
  choice: und bring dich nicht selbst zu Fall
  rationale: Die Hifil-Form von נפל mit rückbezüglichem Suffix beschreibt, dass jemand den eigenen Fall beziehungsweise Niedergang herbeiführt. Die deutsche Wendung erhält das Bild und klingt zugleich natürlich.
- source_word: בַּקְּהִלָּה
  choice: in der Gemeinde
  rationale: קְהִלָּה bezeichnet eine versammelte Gemeinschaft. „Gemeinde“ unterscheidet den Ausdruck leicht von עֵדָה, ohne den öffentlichen Gemeinschaftsbezug zu verlieren.
theological_decisions:
- issue: Hebräisch „Tore Gottes“ gegenüber griechisch „Menge der Stadt“
  choice: Die hebräische Lesart „in der Versammlung an den Toren Gottes“ steht im Haupttext.
  alternative: „Sündige nicht in der Menge der Stadt.“
  rationale: Der erhaltene hebräische Text besitzt hier Vorrang und ist mit hoher Sicherheit bezeugt, obwohl die Formulierung ungewöhnlich ist. Die griechische Parallele kann auf eine abweichende hebräische Vorlage oder eine glättende Deutung zurückgehen und wird deshalb in der Fußnote dokumentiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Parallelismus und die Bildsprache des Hebräischen bleiben erhalten; die ungewöhnliche Wendung „Tore Gottes“ wird nicht stillschweigend vereindeutigt.
