  text: Do not be hasty in the army[a], for it is laborious work allotted by God.
translation:
  language: de
  text: Sei nicht vorschnell beim Kriegsdienst[a], denn er ist eine mühevolle Arbeit, die von Gott zugeteilt ist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Parallelüberlieferung lautet: „Sag nicht: Er wird auf die Menge meiner Gaben schauen, und wenn ich Gott, dem Höchsten, opfere, wird er sie annehmen.“ Sie bezeugt hier eine wesentlich andere Texttradition als der erhaltene hebräische Text.'
    reason: textual_variant
lexical_decisions:
- source_word: אַל תָּאִיץ
  choice: Sei nicht vorschnell
  rationale: Der verneinte Ausdruck warnt davor, sich zu übereilen oder voreilig voranzudrängen. „Sei nicht vorschnell“ ist natürliches modernes Deutsch und legt kein genaueres Motiv fest.
- source_word: בַּצָּבָא
  choice: beim Kriegsdienst
  rationale: צָבָא kann Heer, Heeresdienst oder Dienst bezeichnen. Im vorliegenden hebräischen Zusammenhang gibt „Kriegsdienst“ den militärischen Sinn verständlich wieder und verbindet sich im Deutschen natürlich mit der Warnung vor Übereilung.
- source_word: מְלֶאכֶת עֲבֹדָה
  choice: mühevolle Arbeit
  rationale: Die Verbindung von „Arbeit/Werk“ und „Dienst/Arbeit“ hebt den arbeitsreichen, belastenden Charakter hervor. „Mühevolle Arbeit“ bewahrt diese Verstärkung ohne unnatürliche Doppelung.
- source_word: הִיא
  choice: er ist
  rationale: Das Pronomen nimmt sinngemäß den im Deutschen maskulinen „Kriegsdienst“ auf und verbindet ihn kopulativ mit der folgenden Beschreibung.
- source_word: מֵאֵל
  choice: von Gott
  rationale: Die Präposition kann Quelle oder Urheber bezeichnen. „Von Gott“ bewahrt diese leichte Offenheit und klingt im Deutschen natürlich.
- source_word: נֶחֱלָקָה
  choice: zugeteilt ist
  rationale: Die Passivform von חלק bezeichnet etwas, das verteilt, zugemessen oder zugeteilt wird. „Zuge­teilt ist“ gibt den Gedanken einer von Gott bemessenen Aufgabe knapp wieder.
theological_decisions:
- issue: Starke Abweichung zwischen dem erhaltenen hebräischen Text und der griechischen Parallelüberlieferung
  choice: Der erhaltene hebräische Text steht im Haupttext.
  alternative: 'Die griechische Überlieferung lautet sinngemäß: „Sag nicht: Er wird auf die Menge meiner Gaben schauen, und wenn ich Gott, dem Höchsten, opfere, wird er sie annehmen.“'
  rationale: Da für diese Stelle ein belastbarer hebräischer Text vorliegt, bildet er die Grundlage der Übersetzung. Die griechische Fassung bezeugt offenbar eine wesentlich andere Texttradition und wird deshalb nicht in den Haupttext eingemischt, sondern transparent in einer Fußnote dokumentiert.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch in würdigem Weisheitston. „Kriegsdienst“ ist gegenüber dem wörtlicheren „Heer“ im Satz idiomatischer; die knappe Warnform und die Aussage über Gottes Zuteilung bleiben erhalten.
