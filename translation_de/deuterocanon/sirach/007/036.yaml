  text: In all your words remember your end, and you will never sin.[a]
translation:
  language: de
  text: Denk bei allem, was du sagst, an dein Ende, dann wirst du niemals sündigen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hebräische Textzeuge (Kahana, zusammengesetzter Text nach Handschriften aus der Kairoer Geniza) lautet ungefähr: »Wende dein Herz nicht von einem ab, der dich liebt; denn von ihm wirst du geliebt werden.« Der hebräische Wortlaut weicht hier erheblich von der griechischen Überlieferung ab; der Haupttext folgt deshalb dem griechischen Paralleltext.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν πᾶσι τοῖς λόγοις σου
  choice: Bei all deinen Worten
  rationale: Die Wiedergabe bleibt nahe am griechischen Wortlaut. λόγοι kann sowohl »Worte« als auch »Angelegenheiten« bezeichnen; »Worte« bewahrt diese konkrete Formulierung, ohne sie auf alles Handeln auszuweiten.
- source_word: μιμνήσκου
  choice: denk an
  rationale: Der Imperativ fordert dazu auf, etwas beständig im Bewusstsein zu halten. »Denk an« ist direkt und in modernem Deutsch natürlicher als »erinnere dich an«.
- source_word: τὰ ἔσχατά σου
  choice: dein Ende
  rationale: Die knappe Formulierung wahrt die Offenheit zwischen Lebensende und endgültigem Ausgang, ohne eine bestimmte Lehre über Tod oder Gericht einzutragen.
- source_word: καὶ εἰς τὸν αἰῶνα οὐχ ἁμαρτήσεις
  choice: dann wirst du niemals sündigen
  rationale: In Verbindung mit der Verneinung gibt εἰς τὸν αἰῶνα idiomatisch den Sinn »niemals« wieder. »Dann« macht den Folgezusammenhang des griechischen καί im Deutschen verständlich.
- source_word: אַל תִּשָּׂא לֵב מֵאוֹהֵב, כִּי מִמֶּנוּ תֵּאָהֵב
  choice: als stark abweichende hebräische Lesart in der Fußnote wiedergegeben
  rationale: Der erhaltene hebräische Text weicht inhaltlich erheblich von der zusammenhängenden griechischen Überlieferung ab. Die Hauptzeile folgt daher dem griechischen Paralleltext; die hebräische Lesart wird aus Gründen der Transparenz vollständig vermerkt.
theological_decisions:
- issue: Soll »dein Ende« ausdrücklich eschatologisch erklärt werden?
  choice: dein Ende
  alternative: dein endgültiges Schicksal
  rationale: Der griechische Text nennt das Ende, legt aber nicht ausdrücklich fest, ob allein der Tod, das Gericht oder der endgültige Ausgang gemeint ist. Die Übersetzung erhält diese theologische Offenheit.
- issue: Textgrundlage bei starker Abweichung zwischen hebräischem und griechischem Zeugnis
  choice: Der Haupttext folgt dem griechischen Paralleltext; die hebräische Lesart steht in der Fußnote.
  alternative: Der Haupttext folgt dem erhaltenen hebräischen Wortlaut.
  rationale: Der hebräische Wortlaut ist zwar verständlich annäherbar, steht hier jedoch in keinem erkennbaren inhaltlichen Zusammenhang mit der stabilen griechischen Mahnung und kann eine beschädigte oder abweichende Rezension vertreten. Die Fußnote macht den Befund sichtbar, ohne beide Lesarten zu vermischen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzform ist knapp und spruchhaft; »denk an« ist allgemein verständlich, während »sündigen« die ethische und theologische Schärfe des griechischen ἁμαρτάνω bewahrt.
