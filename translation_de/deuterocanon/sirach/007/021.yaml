  text: Love an intelligent servant as yourself[a], and do not withhold freedom from him.
translation:
  language: de
  text: Liebe einen verständigen[a] Sklaven wie dich selbst und verweigere ihm nicht die Freiheit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch „verständigen“; der griechische Paralleltext hat „guten“: „Liebe einen guten Sklaven wie dich selbst.“'
    reason: alternative_reading
lexical_decisions:
- source_word: עֶבֶד
  choice: Sklave
  rationale: Das hebräische Wort bezeichnet einen Unfreien beziehungsweise Sklaven. Da der zweite Halbvers ausdrücklich von seiner Freiheit spricht, ist der rechtlich unfreie Status hier deutlich; „Diener“ wäre zu abschwächend.
- source_word: מַשְׂכִּיל
  choice: verständig
  rationale: Das Partizip bezeichnet jemanden, der Einsicht besitzt oder einsichtig handelt. „Verständig“ ist im Deutschen prägnant und würdevoll und lässt sowohl Klugheit als auch besonnenes Handeln anklingen.
- source_word: חַבֵּב
  choice: Liebe
  rationale: Der Imperativ fordert auf, den Betreffenden lieb zu haben beziehungsweise hochzuschätzen. „Liebe“ gibt die unmittelbare ethische Forderung wieder und wird vom griechischen Paralleltext gestützt.
- source_word: כְּנֶפֶש
  choice: wie dich selbst
  rationale: Wörtlich steht eine Wendung mit „Seele/Leben/Selbst“. „Wie dich selbst“ gibt den idiomatischen Sinn im modernen Deutschen natürlich wieder, ohne die persönliche Intensität abzuschwächen.
- source_word: וְאַל תִּמְנַע
  choice: und verweigere ihm nicht
  rationale: Das Verb bedeutet, etwas zurückzuhalten oder jemandem vorzuenthalten. Mit „Freiheit“ als Objekt ist „verweigere ihm nicht“ eine klare und natürliche deutsche Formulierung.
- source_word: חֹפֶשׁ
  choice: Freiheit
  rationale: Gemeint ist die Entlassung aus dem unfreien Status. „Freiheit“ ist verständlich und quellennah; „Freilassung“ wäre konkreter, würde aber die Nominalbedeutung enger festlegen.
theological_decisions:
- issue: Bezeichnung des sozialen Status bei עֶבֶד
  choice: Sklave
  alternative: Diener
  rationale: Die Aufforderung, ihm die Freiheit nicht zu verweigern, macht den unfreien Status ausdrücklich zum Thema. Daher wird die Härte der gesellschaftlichen Wirklichkeit nicht durch „Diener“ verdeckt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit knapper weisheitlicher Mahnform. Die direkte Bezeichnung „Sklave“ bewahrt die soziale Härte des Ausgangstextes; die Formulierung billigt die Institution nicht, sondern gibt die historische Aussage unverhüllt wieder.
