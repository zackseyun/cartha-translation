base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/007/018.yaml
  text: Do not trade away a friend for a price[c][b][a], or a brother who is worth the gold of Ophir.
translation:
  language: de
  text: Gib einen Freund nicht für einen Preis her[b] und auch keinen Bruder[c], der Gold aus Ofir wert ist.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Überlieferung bietet hier einen ganz anderen Wortlaut: „Denk daran, dass der Zorn nicht lange anhält.“ Der in der Kairoer Geniza erhaltene hebräische Text warnt stattdessen davor, einen Freund oder Bruder um materiellen Gewinns willen herzugeben.'
    reason: textual_variant
  - marker: b
    text: 'Oder: „Tausche einen Freund nicht gegen Bezahlung ein.“'
    reason: lexical_alternative
  - marker: c
    text: „Bruder“ kann einen leiblichen Bruder, aber auch einen nahen Verwandten oder engen Gefährten bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּמִיר
  choice: gib … nicht … her
  rationale: Der Hifil von מור bezeichnet hier das Eintauschen oder Weggeben im Austausch. „Hergeben“ klingt im Deutschen natürlich und bewahrt zusammen mit „für einen Preis“ den geschäftlichen Unterton.
- source_word: אוֹהֵב
  choice: Freund
  rationale: Wörtlich ist dies „einer, der liebt“; in der Weisheitsliteratur bezeichnet das Wort gewöhnlich einen Freund oder treuen Gefährten.
- source_word: בִּמְחִיר
  choice: für einen Preis
  rationale: Die Wendung erhält den merkantilen Bildbereich des hebräischen מְחִיר, ohne die Gegenleistung unnötig auf Bargeld einzuengen.
- source_word: אָח
  choice: Bruder
  rationale: „Bruder“ gibt den konkreten hebräischen Verwandtschaftsbegriff wieder; je nach Zusammenhang kann er auch einen nahen Verwandten oder engen Gefährten bezeichnen.
- source_word: תָּלוּי
  choice: der … wert ist
  rationale: Die Form ist schwierig. Im Parallelismus mit „für einen Preis“ und in Verbindung mit dem Gold aus Ofir liegt eine Aussage über Wert oder Abwägung näher als die wörtliche Bedeutung „hängend“.
- source_word: בִּזְהַב אוֹפִיר
  choice: Gold aus Ofir
  rationale: Die Ortsbezeichnung bleibt erhalten und verweist auf das sprichwörtlich kostbare Gold aus Ofir.
theological_decisions:
- issue: Hebräischer Text gegenüber der stark abweichenden griechischen Überlieferung
  choice: Der Haupttext folgt dem erhaltenen hebräischen Zeugen aus der Kairoer Geniza.
  alternative: 'Griechisch: „Denk daran, dass der Zorn nicht lange anhält.“'
  rationale: Wo der hebräische Text des Sirachbuches erhalten ist, bildet er die primäre Grundlage. Da die griechische Fassung hier einen völlig anderen Satz bietet, wird diese erhebliche textgeschichtliche Abweichung in einer Fußnote offengelegt.
- issue: Deutung des schwierigen אָח תָּלוּי
  choice: „einen Bruder, der Gold aus Ofir wert ist“
  alternative: „einen Bruder gegen Gold aus Ofir“
  rationale: Die gewählte Fassung macht die im Parallelismus naheliegende Wertschätzung verständlich, kennzeichnet aber in den Übersetzungsentscheidungen, dass die hebräische Form nicht eindeutig ist. Das unbelegte Attribut „wahr“ wird nicht ergänzt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Hergeben“ ist allgemein verständlich; „für einen Preis“ erhält bewusst die kaufmännische Bildsprache. Die ungewöhnliche Bewertung des Bruders wird nicht durch ein unbelegtes „wahrer Bruder“ geglättet.
