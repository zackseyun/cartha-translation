  text: Give a gift before every living person[a], and do not withhold kindness even from the dead.
translation:
  language: de
  text: Gib in Gegenwart jedes Lebenden eine Gabe[a], und versage auch einem Toten keine Güte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Überlieferung lautet: „Entziehe dich nicht den Weinenden, und trauere mit den Trauernden.“ Sie bezeugt an dieser Stelle eine wesentlich andere Texttradition.'
    reason: textual_variant
lexical_decisions:
- source_word: תֵּן מַתָּן
  choice: Gib … eine Gabe
  rationale: Die Verbindung aus Imperativ נתן und dem Substantiv מַתָּן wird direkt und würdig wiedergegeben; „Gabe“ bleibt weit und vermeidet kultische Zusatzbedeutungen.
- source_word: לִפְנֵי כָל חָי
  choice: jedem Lebenden
  rationale: Wörtlich steht „vor jedem Lebenden“. Im Zusammenhang des Gebens bezeichnet לִפְנֵי idiomatisch den Empfänger beziehungsweise denjenigen, dem die Gabe zugewandt wird; „jedem Lebenden“ ist im Deutschen natürlich und bewahrt den umfassenden Sinn.
- source_word: וְגַם מִמֵּת
  choice: auch einem Toten
  rationale: וְגַם hat additive, hier hervorhebende Kraft. Der singularische Ausdruck מֵת wird als allgemeiner Einzelfall wiedergegeben und hält die Gegenüberstellung von Lebendem und Totem fest.
- source_word: אַל תִּמְנַע
  choice: versage … keine
  rationale: מנע bezeichnet das Vorenthalten oder Verweigern. Die deutsche Konstruktion „jemandem keine … versagen“ gibt das Verbot natürlich und prägnant wieder.
- source_word: חָסֶד
  choice: Güte
  rationale: חסד meint hier tätige, verlässliche Zuwendung, auch im Umgang mit Verstorbenen. „Güte“ ist weiter als „Barmherzigkeit“ und vermeidet eine ausschließlich bundestheologische Festlegung.
theological_decisions:
- issue: Verhältnis des erhaltenen hebräischen Textes zur erheblich abweichenden griechischen Überlieferung
  choice: Der erhaltene hebräische Text bildet den Haupttext.
  alternative: 'Griechisch: „Entziehe dich nicht den Weinenden, und trauere mit den Trauernden.“'
  rationale: Wo der hebräische Sirachtext erhalten ist, hat er für diese Übersetzung Vorrang. Die griechische Fassung bezeugt hier keine bloße Wortvariante, sondern eine wesentlich andere Texttradition; diese wird deshalb in einer Fußnote vollständig kenntlich gemacht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper weisheitlicher Satzform. Die Parallelität zwischen „jedem Lebenden“ und „einem Toten“ bleibt erhalten; konfessionell geprägte Zusätze werden vermieden.
