  language: en
  yaml_path: translation/deuterocanon/sirach/007/031.yaml
  text: Honor God and honor the priest[a], and give them their portion[b], as you were commanded.
translation:
  language: de
  text: Ehre Gott und erweise dem Priester Ehre[a]; gib ihnen ihren Anteil[b], wie dir geboten wurde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Paralleltext lautet: „Fürchte den Herrn und verherrliche den Priester; gib ihm seinen Anteil, wie es dir von Anfang an geboten worden ist“, und nennt anschließend ausführlicher die Abgaben für die Priester.'
    reason: alternative_reading
  - marker: b
    text: 'Im Hebräischen steht „ihren Anteil“ in der Mehrzahl, wohl mit Blick auf die den Priestern insgesamt zustehenden Abgaben. Der griechische Paralleltext glättet zum Singular: „ihm seinen Anteil“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּבֵּד אֵל
  choice: Ehre Gott
  rationale: Das Piel von כבד fordert dazu auf, jemandem die gebührende Ehre zu erweisen. אֵל ist im klar überlieferten hebräischen Text schlicht „Gott“; der abweichende griechische Gottesname wird nicht in den Haupttext übernommen.
- source_word: וַהֲדַר כֹּהֵן
  choice: und erweise dem Priester Ehre
  rationale: הדר bezeichnet hier eine ehrende, würdigende Behandlung. Die Formulierung wahrt die semantische Nähe zum ersten Imperativ, ohne im Deutschen beide unterschiedlichen hebräischen Verben identisch wiederzugeben. כֹּהֵן steht als institutioneller beziehungsweise repräsentativer Singular.
- source_word: וְתֵן
  choice: gib
  rationale: Der einfache Imperativ wird direkt und natürlich mit „gib“ wiedergegeben.
- source_word: חֶלְקָם
  choice: ihnen ihren Anteil
  rationale: Das hebräische Possessivsuffix ist Plural. Die Übersetzung bewahrt diese Numerusdifferenz zum unmittelbar vorausgehenden Singular „Priester“ und lässt den Bezug auf die Priesterschaft beziehungsweise ihre Abgaben offen.
- source_word: כַּאֲשֶׁר צֻוֵּיתָה
  choice: wie es dir geboten wurde
  rationale: Die passive Form bezeichnet ein zuvor an den Angeredeten ergangenes Gebot. Die deutsche Wendung ist knapp und wahrt das unpersönliche Passiv des Hebräischen.
theological_decisions:
- issue: Gottesbezeichnung im Hauptsatz
  choice: Das hebräische אֵל wird mit „Gott“ wiedergegeben.
  alternative: Nach dem griechischen Paralleltext „den Herrn“ beziehungsweise „den Herrn fürchten“.
  rationale: Der vorhandene und sichere hebräische Text hat Vorrang. Die griechische Abweichung bleibt wegen ihres textgeschichtlichen Gewichts in der Fußnote sichtbar.
- issue: Numerus und Bezug von חֶלְקָם
  choice: Der Plural wird als „ihnen ihren Anteil“ erhalten.
  alternative: Numerusangleichung zu „gib ihm seinen Anteil“ oder kollektiv „gib dem Priester seinen Anteil“.
  rationale: Das hebräische Suffix ist eindeutig pluralisch. Eine Glättung würde die im Ausgangstext vorhandene Spannung zwischen dem repräsentativen Singular „Priester“ und der Mehrzahl der Anspruchsberechtigten beseitigen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die bewusste Wiederaufnahme von „Ehre“ bildet die enge Bedeutungsbeziehung der beiden hebräischen Imperative ab; das Semikolon trennt die Aufforderung zur Ehrung von ihrer konkreten Folge. Alle Fußnotenmarker stehen im Haupttext.
