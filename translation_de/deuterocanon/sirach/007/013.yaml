  verdict: revise
  source_fidelity: Der Haupttext trifft die Mahnung gegen fortgesetzte bzw. sich häufende Falschheit grundsätzlich. „Eine Lüge zu wiederholen“ ist jedoch enger als die hebräische Verbindung לְכַחֵש עַל־כָּחַש („auf/über Falschheit lügen bzw. falsch handeln“), die eher das Häufen von Falschheit nahelegt. „Ausgang ist nicht gut“ folgt sinnvoll der griechischen Parallele, entfernt sich aber von der hebräischen Aussage, dass das Ende bzw. Ergebnis nicht angenehm sein wird.
  naturalness: Der Entwurf ist gut verständlich; „Hab kein Verlangen danach“ wirkt jedoch leicht umständlich. „Habe kein Verlangen danach, Lüge auf Lüge zu häufen“ ist für moderne, würdige Weisheitssprache idiomatischer und bildet die Bildlichkeit des Hebräischen klarer ab.
  terminology: „Lüge auf Lüge häufen“ gibt כחש und die Wiederholungs-/Aufschichtungsnuance von עַל כָּחַש angemessen wieder, ohne eine einzelne konkrete Lüge vorauszusetzen. „Ende“ und „angenehm“ entsprechen תִּקְוָתוֹ und תִנְעָם unmittelbarer. Die Fußnote muss die wörtliche Formulierung idiomatisch und ohne irreführendes deutsches „Lüge nicht“ erklären.
  issues:
