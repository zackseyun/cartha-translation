    issue: Die Fußnote gibt die hebräische Wendung mit „Lüge nicht auf Falschheit“ unidiomatisch und potenziell missverständlich wieder.
    rationale: Das deutsche „Lüge nicht“ wird regelmäßig als Verbot verstanden, während לְכַחֵש hier ein Infinitiv nach „begehre nicht“ ist. Eine erläuternde Wiedergabe als „auf Falschheit lügen/falsch handeln“ vermeidet diese falsche syntaktische Lesung.
  - severity: low
    issue: „Eine Lüge zu wiederholen“ verengt die kumulative hebräische Wendung.
    rationale: Die Formulierung kann zwar Wiederholung einschließen, doch „Lüge auf Lüge häufen“ bewahrt auch die naheliegende Nuance, einer Falschheit weitere Falschheit hinzuzufügen.
  - severity: low
    issue: „Ihr Ausgang ist nicht gut“ glättet die hebräische Ausdrucksweise stark.
    rationale: Die griechische Parallele stützt „nicht gut“, doch der hebräische Wortlaut spricht von einem nicht angenehmen Ende/Ergebnis. Diese Nuance lässt sich im Deutschen natürlich erhalten.
