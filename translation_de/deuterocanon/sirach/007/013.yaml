translation:
  language: de
  text: Habe kein Verlangen danach, Lüge auf Lüge zu häufen[a], denn ihr Ende wird nicht angenehm sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „auf Falschheit lügen“ oder „auf Falschheit falsch handeln“. Die Wendung kann bedeuten, einer Lüge weitere Falschheit hinzuzufügen oder Falsches wiederholt zu tun. Die griechische Überlieferung lautet: „Wünsche keine Lüge.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תַּחְפֹּץ
  choice: Hab kein Verlangen danach
  rationale: Gibt das verneinte חפץ als eindringliche Mahnung wieder und bewahrt dessen willentliche Nuance in natürlichem modernem Deutsch.
- source_word: לְכַחֵש עַל כָּחַש
  choice: eine Lüge zu wiederholen
  rationale: Die Wendung lautet wörtlich ungefähr „auf Falschheit falsch handeln/lügen“ und kann das Hinzufügen einer Lüge zu einer anderen bezeichnen. Die klare Wiedergabe wahrt den kumulativen Sinn; die echte sprachliche Unsicherheit wird in der Fußnote genannt.
- source_word: כִּי
  choice: denn
  rationale: Leitet die Begründung der Mahnung knapp und idiomatisch ein.
- source_word: תִקְוָתוֹ
  choice: ihr Ausgang
  rationale: תִּקְוָה bedeutet gewöhnlich „Hoffnung“ oder „Erwartung“, bezeichnet hier bei der Lüge aber wahrscheinlich das, was von ihr zu erwarten ist, also ihren Ausgang.
- source_word: לֹא תִנְעָם
  choice: ist nicht gut
  rationale: נעם bezeichnet wörtlich Angenehmsein oder Lieblichkeit. Zusammen mit dem griechischen οὐκ εἰς ἀγαθόν wird die negative Wertung in schlichtem, natürlichem Deutsch wiedergegeben.
