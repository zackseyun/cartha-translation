translation:
  language: de
  text: Verachte eine verständige Ehefrau[a] nicht, denn ihre Anmut ist kostbarer als Perlen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eine verständige Frau“ beziehungsweise „eine kluge Frau“. Das hebräische Wort kann Frau oder Ehefrau bedeuten; מַשְׁכֶּלֶת hebt Einsicht und gutes Urteilsvermögen hervor.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher lässt sich der zweite Satzteil auch mit „und Anmut ist kostbarer als Perlen“ wiedergeben. Der griechische Text lautet: „Übergehe nicht eine weise und gute Frau, denn ihre Anmut übertrifft Gold.“'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תִּמְאַס
  choice: Verachte … nicht
  rationale: מָאַס kann sowohl Ablehnung als auch Verachtung bezeichnen. Im zwischenmenschlichen Mahnwort gibt „verachten“ den warnenden Ton und die Gefahr geringschätziger Behandlung treffend wieder.
- source_word: אִשָּׁה מַשְׁכֶּלֶת
  choice: eine verständige Ehefrau
  rationale: מַשְׁכֶּלֶת bezeichnet eine einsichtige, kluge oder umsichtig handelnde Person. „Verständig“ bewahrt diese Bedeutungsbreite. אִשָּׁה kann „Frau“ oder „Ehefrau“ heißen; der häusliche Zusammenhang spricht für „Ehefrau“, ohne die sprachliche Mehrdeutigkeit zu leugnen.
- source_word: וְטוֹבַת חֵן
  choice: denn ihre Anmut ist kostbarer
  rationale: Die hebräische Wendung ist knapp und syntaktisch nicht völlig eindeutig. Im Zusammenhang preist sie die anziehende, wohlgefällige Qualität der Frau; „Anmut“ gibt חֵן wieder, ohne es auf körperliche Schönheit zu beschränken. Das sinngemäße „denn ihre“ stellt den Zusammenhang im Deutschen natürlich her, wird aber nicht als einzig mögliche Analyse ausgegeben.
- source_word: מִפְּנִינִים
  choice: als Perlen
  rationale: פְּנִינִים bezeichnet einen besonders kostbaren Schmuckstoff und kann je nach Kontext als Perlen, Korallen oder Edelsteine verstanden werden. „Perlen“ ist hier eine geläufige und gut begründete Wiedergabe; die abweichende griechische Bildsprache wird in der Fußnote dokumentiert.
theological_decisions:
- issue: Bezug von אִשָּׁה im Weisheitswort
  choice: Ehefrau
  alternative: Frau
  rationale: Das hebräische Wort lässt beide Bedeutungen zu. Wegen des Zusammenhangs mit häuslichen und persönlichen Beziehungen wird die spezifischere Bedeutung „Ehefrau“ im Haupttext gewählt; die weitere Möglichkeit bleibt in einer Fußnote sichtbar.
- issue: Bezug und Satzfunktion von וְטוֹבַת חֵן
  choice: 'Begründung mit Bezug auf die Ehefrau: „denn ihre Anmut“'
  alternative: 'Koordinierter, unpersönlicher Satz: „und Anmut ist kostbarer“'
  rationale: Die Formulierung ist im Hebräischen verdichtet. Der griechische Paralleltext bezieht χάρις ausdrücklich auf die Frau und stützt die gewählte natürliche Lesart. Da das Hebräische weder das Possessivpronomen noch eine ausdrückliche kausale Konjunktion bietet, wird die Alternative in der textkritischen Fußnote kenntlich gemacht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Mahnform. „Verständig“ ist allgemein verständlich und weniger akademisch als „intelligent“, während „Anmut“ den gehobenen Ton der Weisheitsliteratur wahrt. Die ungewöhnliche Kürze des Hebräischen wird im Haupttext idiomatisch erschlossen und in den Fußnoten transparent dokumentiert.
