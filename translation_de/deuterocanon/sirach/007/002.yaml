  text: Do not sow furrows of injustice against a brother[b][a], lest you reap it sevenfold.
translation:
  language: de
  text: Säe keine Furchen des Unrechts gegen einen Bruder; sonst erntest du es[a] siebenfach.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich kann das hebräische Suffix „ihn“ oder „es“ bedeuten. Hier wird es auf das gesäte Unrecht bezogen, weil dies am besten zum Bild von Säen und Ernten passt.
    reason: lexical_alternative
  - marker: b
    text: 'Die griechische Parallelüberlieferung lautet allgemeiner: „Wende dich vom Unrecht ab, dann wird es sich von dir abwenden.“ Sie bewahrt damit eine andere Fassung des Spruchs als der erhaltene hebräische Text.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תִּזְרַע
  choice: Säe keine
  rationale: Die negative Aufforderung wird in natürlichem Deutsch wiedergegeben; „säen“ bewahrt das ausdrücklich landwirtschaftliche Bild und entspricht dem späteren „ernten“.
- source_word: חֲרוּשֵׁי
  choice: Furchen
  rationale: Das Wort gehört zum Bedeutungsfeld des Pflügens. „Furchen“ erhält die ungewöhnliche, aber erkennbare Ackerbaumetaphorik, statt sie zu allgemeinen „Taten“ abzuflachen.
- source_word: עָוֶל
  choice: Unrecht
  rationale: „Unrecht“ bezeichnet hier treffend moralisches und zwischenmenschliches Fehlverhalten und ist im heutigen Deutsch klarer und weniger kirchensprachlich als „Frevel“ oder „Missetat“.
- source_word: עַל אָח
  choice: gegen einen Bruder
  rationale: Die Präposition hat im Zusammenhang feindliche beziehungsweise nachteilige Bedeutung. Der unbestimmte Ausdruck „einen Bruder“ gibt das Hebräische wieder, ohne ein nicht ausdrücklich vorhandenes Possessivpronomen hinzuzufügen.
- source_word: פֶּן
  choice: sonst
  rationale: „Sonst“ vermittelt die warnende Folge in gegenwärtigem, knappen Deutsch natürlicher als eine Konstruktion mit „damit nicht“.
- source_word: תִּקְצְרֵהוּ
  choice: erntest du es
  rationale: „Ernten“ führt die Metapher des Säens fort. Das Suffix wird im Haupttext auf das gesäte Unrecht bezogen; seine formale Mehrdeutigkeit bleibt in einer Fußnote sichtbar.
- source_word: שִׁבְעָתָיִם
  choice: siebenfach
  rationale: „Siebenfach“ bewahrt sowohl die Zahl als auch den Gedanken einer gesteigerten beziehungsweise vollständigen Vergeltung und ist idiomatisches Deutsch.
theological_decisions:
- issue: Bezugswort des pronominalen Suffixes in תִּקְצְרֵהוּ
  choice: 'Das Objekt bezieht sich auf das gesäte Unrecht: „du erntest es siebenfach“.'
  alternative: 'Formal kann das Suffix auch auf den Bruder bezogen werden: „du erntest ihn siebenfach“; die griechische Überlieferung bietet zudem eine deutlich andere Fassung des Spruchs.'
  rationale: Die Abfolge von Säen und Ernten legt nahe, dass geerntet wird, was zuvor als Unrecht gesät wurde. Da das hebräische Suffix für sich genommen mehrdeutig ist und der griechische Text abweicht, wird die Spannung nicht stillschweigend beseitigt, sondern in den Fußnoten dokumentiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper Spruchweisheitsform. Die im Deutschen ungewöhnliche Verbindung „Furchen des Unrechts säen“ bleibt bewusst erhalten, um die markante hebräische Ackerbaumetaphorik nicht zu glätten.
