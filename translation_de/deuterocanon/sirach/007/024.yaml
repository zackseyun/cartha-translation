  source_fidelity: 'Die Übersetzung folgt dem hebräischen Text eng: »Hast du Töchter?« gibt die elliptische possessive Eröffnung idiomatisch wieder; »Hüte« entspricht נְצוֹר. »Ihren Leib« bewahrt die konkrete, im Hebräischen mit »Fleisch« ausgedrückte Körperlichkeit und wird durch die griechische Parallele σώμα gestützt. Die zweite Satzhälfte erhält das Gesichtsbild des Hebräischen und Griechischen, ohne es im Haupttext zu einer bestimmten Erziehungsmaxime zu paraphrasieren.'
