  text: Do you have daughters? Guard their chastity[a], and do not show them a cheerful face.
translation:
  language: de
  text: Hast du Töchter? Hüte ihren Leib[a] und zeige ihnen kein allzu freundliches Gesicht.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »ihr Fleisch«. Die griechische Überlieferung hat »ihren Körper«. Gemeint sein kann auch der Schutz ihrer sexuellen Unversehrtheit; »Keuschheit« steht jedoch nicht ausdrücklich im Text.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »Lass dein Gesicht ihnen gegenüber nicht leuchten.« Gemeint ist wahrscheinlich, ihnen gegenüber nicht übermäßig nachgiebig oder verwöhnend zu sein.'
    reason: idiom
lexical_decisions:
- source_word: בָּנוֹת לְךָ
  choice: Hast du Töchter?
  rationale: Die elliptische hebräische Wendung bedeutet wörtlich etwa »Töchter sind dir/gehören zu dir«. Als einleitende Frage gibt sie den mahnenden Zusammenhang im heutigen Deutsch klar und knapp wieder; auch die griechische Parallele versteht die Wendung existential.
- source_word: נְצוֹר
  choice: Hüte
  rationale: Das Verb bezeichnet aufmerksames Bewahren, Behüten oder Bewachen. »Hüte« erhält sowohl den Schutzgedanken als auch die Kürze des Imperativs.
- source_word: שְׁאֵרָם
  choice: ihren Leib
  rationale: שְׁאֵר bezeichnet hier das Fleisch beziehungsweise den leiblichen Körper; die griechische Parallele hat ausdrücklich »ihren Körper«. »Leib« bewahrt diese konkrete Bedeutung, ohne die im Kontext mögliche Beziehung zu sexueller Unversehrtheit als alleinige Bedeutung festzulegen.
- source_word: וְאַל תָּאִיר אֲלֵיהֶם פָּנִים
  choice: und zeige ihnen kein allzu freundliches Gesicht
  rationale: Wörtlich soll das Gesicht ihnen gegenüber nicht »leuchten«; die griechische Parallele spricht entsprechend davon, das Gesicht nicht heiter oder freundlich zu machen. Die deutsche Formulierung bewahrt das Bild vom Gesicht, während »allzu« den wahrscheinlichen idiomatischen Sinn übermäßiger Nachgiebigkeit erkennen lässt.
theological_decisions:
- issue: Ethische Tragweite der Aufforderung, den Leib der Töchter zu hüten
  choice: Die konkrete Rede vom Leib bleibt im Haupttext erhalten.
  alternative: »Bewahre ihre Keuschheit« oder »Achte auf ihre Unberührtheit«
  rationale: Der Zusammenhang kann sexuelle Sittsamkeit oder Unversehrtheit einschließen, doch weder das hebräische Wort für »Fleisch/Leib« noch die griechische Wiedergabe »Körper« nennt Keuschheit ausdrücklich. Eine engere Deutung würde die Mehrdeutigkeit des Ausgangstextes auflösen.
- issue: Warnung vor einem freundlichen Gesicht
  choice: Das konkrete Gesichtsbild wird beibehalten und als Warnung vor übermäßiger Nachgiebigkeit kenntlich gemacht.
  alternative: »Sei ihnen gegenüber nicht nachgiebig« oder »Verwöhne sie nicht«
  rationale: Eine rein abstrakte Wiedergabe wäre zwar verständlicher, würde aber das gemeinsame Bild des hebräischen und griechischen Textes beseitigen und eine bestimmte Erziehungstheorie stärker festlegen, als es der Wortlaut erlaubt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Hüte ihren Leib« ist bewusst etwas gehobener, erhält aber die knappe Schutzaufforderung und die Körperlichkeit des hebräischen Ausdrucks. Das ungewöhnliche Bild vom Gesicht bleibt erkennbar und wird in der Fußnote erläutert.
