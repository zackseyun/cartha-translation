  text: Marry off a daughter[a], and the matter will be settled[b]; and give her to an intelligent man.
translation:
  language: de
  text: Verheirate eine Tochter, dann ist die Angelegenheit erledigt[a]; und gib sie einem verständigen Mann zur Frau.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „und die Angelegenheit wird hinausgehen“. Gemeint ist, dass sie zum Abschluss kommt. Die griechische Fassung lautet ausdrücklicher: „Dann wirst du ein großes Werk vollendet haben.“'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlicher: „und verbinde sie mit einem verständigen Mann“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹצֵא בַת
  choice: Verheirate eine Tochter
  rationale: הוֹצֵא bedeutet wörtlich „hinausführen/fortgeben“, bezeichnet hier aber idiomatisch das Verheiraten einer Tochter; die griechische Parallele ἔκδου bestätigt diesen ehelichen Sinn. Der unbestimmte Ausdruck „eine Tochter“ bewahrt das fehlende Possessivpronomen im Hebräischen.
- source_word: וְיֵצֵא עֵסֶק
  choice: dann ist die Angelegenheit erledigt
  rationale: Wörtlich heißt die Wendung etwa „und die Angelegenheit geht hinaus“. Gemeint ist im Zusammenhang, dass die betreffende Aufgabe oder Sorge zum Abschluss kommt. Die griechische Parallele („du wirst ein großes Werk vollendet haben“) stützt dieses Verständnis.
- source_word: נָבוֹן
  choice: verständig
  rationale: Das Wort bezeichnet einen einsichtigen, urteilsfähigen oder klugen Menschen. „Verständig“ gibt diese praktische Einsicht in natürlichem, würdigem Deutsch wieder.
- source_word: חַבְּרָהּ
  choice: gib sie … zur Frau
  rationale: Die Form von חבר bedeutet grundsätzlich „sie verbinden/zugesellen“. Im Heiratszusammenhang ist „jemandem zur Frau geben“ die klare deutsche idiomatische Wiedergabe; die wörtlichere Möglichkeit wird in einer Fußnote genannt.
