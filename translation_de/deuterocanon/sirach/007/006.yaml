  text: Do not cower before a noble[a], lest you set a bribe against your integrity.
translation:
  language: de
  text: Lass dich von einem Vornehmen nicht einschüchtern, sonst mischst du deiner Lauterkeit unredlichen Gewinn bei.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hebräische Wortlaut ist knapp und kann wörtlicher wiedergegeben werden: »sonst bringst du unredlichen Gewinn in deine Lauterkeit hinein«. Das Griechische lautet allgemeiner: »sonst legst du einen Stolperstein in deine Rechtschaffenheit«; im Zusammenhang kann der unredliche Gewinn insbesondere Bestechungsgeld meinen.'
    reason: alternative_reading
lexical_decisions:
- source_word: תָגוּר
  choice: lass dich … nicht einschüchtern
  rationale: Das Verb bezeichnet hier ein angstbedingtes Zurückweichen vor einer einflussreichen Person. Die griechische Parallele bestätigt den Sinn »sich einschüchtern lassen«.
- source_word: נָדִיב
  choice: einem Vornehmen
  rationale: Das Wort kann einen gesellschaftlich hochgestellten, einflussreichen Mann bezeichnen. »Vornehmer« bewahrt den sozialen Rang des hebräischen Ausdrucks, ohne ihn unnötig auf ein bestimmtes Amt festzulegen.
- source_word: בֶּצַע
  choice: unredlichen Gewinn
  rationale: בֶּצַע bezeichnet eigennützigen, häufig unrechtmäßig erworbenen Gewinn. Diese Wiedergabe bewahrt die lexikalische Breite besser als das im Kontext ebenfalls mögliche »Bestechungsgeld«.
- source_word: בִּתְמִימִיךָ
  choice: deine Lauterkeit
  rationale: Der Ausdruck bezeichnet moralische Unversehrtheit, Aufrichtigkeit oder Integrität. »Lauterkeit« entspricht auch dem ethischen Sinn der griechischen Parallele ἐν εὐθύτητί σου.
- source_word: וְנָתוּן
  choice: setzt … aufs Spiel
  rationale: Wörtlich steht eine Form von »geben/setzen«. Die deutsche Wendung gibt die konkrete Vorstellung eines Eingriffs in die eigene Lauterkeit natürlich wieder, ohne die moralische Folge zu verschleiern.
theological_decisions:
- issue: Deutung der knappen hebräischen Wendung וְנָתוּן בֶּצַע בִּתְמִימִיךָ im Verhältnis zur griechischen Parallele
  choice: Den hebräischen Hinweis auf unredlichen Gewinn im Haupttext bewahren und als Gefährdung der eigenen Lauterkeit ausdrücken.
  alternative: »und legst einen Stolperstein in deine Rechtschaffenheit« nach dem Griechischen; oder konkreter »für Bestechungsgeld« statt »für unredlichen Gewinn«.
  rationale: Der erhaltene hebräische Text ist vorrangig und nennt ausdrücklich בֶּצַע, unredlichen Gewinn. Die griechische Lesart beschreibt allgemeiner einen Stolperstein in der Rechtschaffenheit. Die Übersetzung lässt die konkrete wirtschaftliche Korruption im Haupttext stehen und dokumentiert die breitere griechische Fassung in der Fußnote.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Vornehmer« bezeichnet eine gesellschaftlich hochgestellte Person; »Lauterkeit« hält den ethischen Ton des hebräischen und griechischen Zeugnisses fest. Die idiomatische Wendung »aufs Spiel setzen« macht den schwierigen hebräischen Satz verständlich, während die Fußnote dessen Bildsprache und die abweichende griechische Überlieferung bewahrt.
