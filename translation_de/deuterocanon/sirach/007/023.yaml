  text: Do you have sons? Discipline them[a], and get wives for them in their youth.
translation:
  language: de
  text: Hast du Söhne, so erziehe sie und verheirate sie in ihrer Jugend[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Parallelüberlieferung lautet: »Hast du Kinder? Erziehe sie und beuge ihren Nacken von Jugend an.« Der hebräische Text liest stattdessen: »… und verheirate sie in ihrer Jugend.«'
    reason: alternative_reading
lexical_decisions:
- source_word: בָּנִים
  choice: Söhne
  rationale: Der hebräische maskuline Plural bezeichnet hier Söhne; die anschließende Aufforderung, für ihre Eheschließung zu sorgen, bestätigt den spezifischen Bezug.
- source_word: יַסֵּר
  choice: erziehe sie mit strenger Hand
  rationale: יסר bezeichnet zurechtweisende, formende Erziehung. Die Wendung gibt sowohl Korrektur als auch Erziehung natürlich wieder, ohne das altertümliche »züchtigen« zu verwenden.
- source_word: וְשָׂא לָהֶם נָשִׁים
  choice: sorge dafür, dass sie heiraten
  rationale: Die hebräische Wendung meint, dass der Vater die Eheschließung seiner Söhne herbeiführt beziehungsweise arrangiert. Die deutsche Formulierung ist natürlich und vermeidet, Frauen als zu beschaffende Gegenstände erscheinen zu lassen.
- source_word: בִּנְעוּרֵיהֶם
  choice: in jungen Jahren
  rationale: Die Wendung bezeichnet die Zeit ihrer Jugend und gehört im hebräischen Text zur Anweisung über die Eheschließung.
theological_decisions:
- issue: Abweichung des zweiten Halbverses zwischen dem hebräischen Text und der griechischen Parallelüberlieferung
  choice: 'Dem Hebräischen folgen: »sorge dafür, dass sie in jungen Jahren heiraten«'
  alternative: 'Dem Griechischen folgen: »beuge ihnen von Jugend an den Nacken«'
  rationale: Wo der hebräische Sirachtext erhalten und sinnvoll ist, erhält er Vorrang. Die erheblich abweichende griechische Lesart wird zur Wahrung der Textspannung in einer Fußnote dokumentiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der bedingte hebräische Eingang wird idiomatisch mit »Hast du …, so …« wiedergegeben. »Mit strenger Hand« verdeutlicht den korrektiven Gehalt von יסר, ohne körperliche Züchtigung ausdrücklich festzulegen.
