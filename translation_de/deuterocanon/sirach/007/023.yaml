revisions:
- from: Hast du Söhne, so erziehe sie mit strenger Hand[a] und sorge dafür, dass sie in jungen Jahren heiraten.
  to: Hast du Söhne, so erziehe sie und verheirate sie in ihrer Jugend[a].
  rationale: Die Revision entfernt die nicht im Hebräischen festgelegte Charakterisierung „mit strenger Hand“ und stellt die aktive, elterlich arrangierende Dimension der Eheschließung wieder her. Die erheblich abweichende griechische Parallellesart bleibt als solche in der Fußnote transparent dokumentiert.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T05:12:33Z'
review_pass:
  verdict: revise
  source_fidelity: Der Eingang und „Söhne“ geben den hebräischen Text zutreffend wieder. „Mit strenger Hand“ fügt jedoch eine nicht ausdrücklich vorhandene Härte hinzu. „Sorge dafür, dass sie ... heiraten“ schwächt zudem die im Hebräischen ausgedrückte aktive elterliche Veranlassung/Organisation der Eheschließung ab.
  naturalness: „Hast du Söhne, so ...“ ist modernes, würdiges Standarddeutsch. „Verheirate sie in ihrer Jugend“ ist knapp, verständlich und gibt die im Ausgangstext vorausgesetzte Rolle des Elternteils beim Zustandekommen der Ehe idiomatischer wieder.
  terminology: „Erziehe sie“ bildet יַסֵּר ohne zusätzliche Festlegung auf körperliche oder besonders harte Disziplin ab. „Verheirate sie“ gibt וְשָׂא לָהֶם נָשִׁים im historischen Kontext als arrangierende Verheiratung wieder. Die Fußnote muss im griechischen Zitat „ihren Nacken“ statt des unidiomatischen und semantisch verschobenen „ihnen ... den Nacken“ haben.
  issues:
  - severity: medium
    issue: „mit strenger Hand“ ergänzt den hebräischen Text.
    rationale: יַסֵּר bezeichnet korrektive bzw. formende Erziehung/Disziplin, spezifiziert aber weder besondere Strenge noch ein Mittel der Erziehung.
  - severity: medium
    issue: „sorge dafür, dass sie ... heiraten“ gibt die aktive Eheschließungsregelung nur abgeschwächt wieder.
    rationale: Die hebräische Wendung bezeichnet, dass für die Söhne Frauen genommen bzw. ihre Ehen arrangiert werden; „verheirate sie“ bewahrt diese transitive, elterliche Handlung.
  - severity: low
    issue: Die Formulierung der griechischen Lesart ist im Deutschen unpräzise.
    rationale: Das griechische τὸν τράχηλον αὐτῶν bedeutet „ihren Nacken“, nicht „beuge ihnen ... den Nacken“.
  revised_text: Hast du Söhne, so erziehe sie und verheirate sie in ihrer Jugend[a].
  revised_footnotes:
