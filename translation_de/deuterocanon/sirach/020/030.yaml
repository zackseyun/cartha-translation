  text: Hidden wisdom and an unseen treasure—what benefit is there in either of them?[a]
translation:
  language: de
  text: Verborgene Weisheit und ein unsichtbarer Schatz – welchen Nutzen haben beide?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σοφία
  choice: Weisheit
  rationale: Im Kontext der Weisheitsliteratur ist „Weisheit“ die naheliegende und thematisch passende Wiedergabe.
- source_word: κεκρυμμένη
  choice: verborgen
  rationale: Das Partizip bezeichnet etwas, das verborgen worden ist und verborgen bleibt; „verborgen“ ist knapp, natürlich und würdevoll.
- source_word: θησαυρός
  choice: Schatz
  rationale: Das konkrete Bild eines wertvollen Schatzes bildet die passende Parallele zur Weisheit.
- source_word: ἀφανής
  choice: unsichtbar
  rationale: Das Wort bezeichnet etwas, das nicht sichtbar oder nicht wahrnehmbar ist. „Unsichtbar“ wahrt die Parallele, ohne „verborgen“ zu wiederholen.
- source_word: τίς ὠφέλεια
  choice: welchen Nutzen haben
  rationale: Diese deutsche Wendung gibt die Frage nach dem praktischen Wert klar und idiomatisch wieder.
- source_word: ἐν ἀμφοτέροις
  choice: beide
  rationale: ἀμφότεροι verweist gemeinsam auf die zwei zuvor genannten Dinge. „Welchen Nutzen haben beide?“ bewahrt diesen Bezug, ohne ihn als ausdrücklich distributives „keines von beiden“ auszudeuten.
