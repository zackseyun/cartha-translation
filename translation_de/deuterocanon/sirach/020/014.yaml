  text: He gives little and heaps on many reproaches[a], and he opens his mouth like a herald.
translation:
  language: de
  text: Er gibt wenig und macht viele Vorwürfe[a], und er öffnet seinen Mund wie ein Herold.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher mit den griechischen Futurformen: „Er wird wenig geben und viele Vorwürfe machen“; wahrscheinlich beschreiben sie hier in sprichwörtlicher Weise ein typisches Verhalten.'
    reason: grammatical_alternative
lexical_decisions:
- source_word: ὀλίγα
  choice: wenig
  rationale: Das substantivierte neutrale Plural bezeichnet hier den geringen Umfang dessen, was gegeben wird; im Deutschen gibt „wenig“ dies natürlich und knapp wieder.
- source_word: δώσει
  choice: er gibt
  rationale: Der griechische Futur kann in einem Weisheitsspruch ein typisches, wiederkehrendes Verhalten ausdrücken. Das deutsche Präsens vermittelt diesen sprichwörtlichen Sinn natürlich.
- source_word: πολλὰ ὀνειδίσει
  choice: macht viele Vorwürfe
  rationale: ὀνειδίζω umfasst Vorwürfe, Schmähungen und Beschimpfungen. Die Wendung „viele Vorwürfe machen“ bewahrt den Gegensatz zwischen wenig Geben und reichlichem Tadeln, ohne die Aussage unnötig zu verschärfen.
- source_word: ἀνοίξει τὸ στόμα αὐτοῦ
  choice: er öffnet seinen Mund
  rationale: Die bildhafte Redeweise für öffentliches oder nachdrückliches Sprechen ist auch im Deutschen verständlich und leitet unmittelbar zum Vergleich über.
- source_word: ὡς κῆρυξ
  choice: wie ein Herold
  rationale: κῆρυξ bezeichnet einen öffentlichen Ausrufer oder Herold. „Herold“ erhält den würdevollen antiken Bildbereich und den Gedanken lauter öffentlicher Bekanntmachung.
