  yaml_path: translation/deuterocanon/sirach/020/004.yaml
  text: There is one who keeps silent and is found wise[a], and there is one who is hated because of much talk.
translation:
  language: de
  text: Mancher schweigt und wird für weise befunden[a]; mancher aber ist wegen seines vielen Redens verhasst.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „erweist sich als weise“ oder „gilt als weise“.'
    reason: Das griechische Passiv εὑρισκόμενος kann sowohl ein Erkennen aufgrund von Beobachtung als auch ein entsprechendes Urteil oder Ansehen bezeichnen.
  - marker: b
    text: 'Wörtlich: „von vielem Reden her“.'
    reason: Die Präposition ἀπό drückt hier die Ursache aus; die wörtliche Formulierung ist im Deutschen jedoch weniger natürlich.
lexical_decisions:
- source_word: ἔστιν … καὶ ἔστιν
  choice: Mancher … mancher aber
  rationale: Die wiederholte Existenzformel stellt sprichwortartig zwei Menschentypen einander gegenüber. Die deutsche Fassung gibt diesen Kontrast natürlich und knapp wieder.
- source_word: σιωπῶν
  choice: schweigt
  rationale: Das Präsenspartizip bezeichnet anhaltendes oder charakteristisches Schweigen. „Schweigt“ ist im Deutschen natürlicher als eine umständliche Verlaufsform.
- source_word: εὑρισκόμενος σοφός
  choice: wird für weise befunden
  rationale: Die passive Form bleibt erhalten und lässt offen, ob jemand bei näherer Beobachtung als weise erkannt wird oder lediglich in diesem Ruf steht.
- source_word: μισητός
  choice: verhasst
  rationale: Das prädikative Adjektiv bezeichnet jemanden, der Hass oder starke Abneigung hervorruft. „Verhasst“ bewahrt die adjektivische Form und klingt im Deutschen idiomatisch.
- source_word: ἀπὸ πολλῆς λαλιᾶς
  choice: wegen seines vielen Redens
  rationale: ἀπό bezeichnet hier den Grund; λαλιά meint Reden bzw. Gesprächigkeit. Die Formulierung wahrt die Ursache und den Gegensatz zum Schweigen, ohne ausdrücklich Geschwätzigkeit zu unterstellen.
