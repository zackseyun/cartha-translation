translation:
  language: de
  text: Besser ist ein Mensch, der seine Torheit verbirgt, als ein Mensch, der seine Weisheit verbirgt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κρείσσων
  choice: Besser ist
  rationale: Der Komparativ eröffnet einen sprichwörtlichen Vergleich. Die Voranstellung bewahrt die pointierte Struktur des Griechischen und klingt im Deutschen würdig und natürlich.
- source_word: ἄνθρωπος
  choice: ein Mensch
  rationale: ἄνθρωπος bezeichnet hier allgemein einen Menschen. „Ein Mensch“ wahrt den generischen Sinn und gibt zugleich die zweimalige Wiederholung des griechischen Substantivs wieder.
- source_word: ἀποκρύπτων
  choice: der … verbirgt
  rationale: Das Präsenspartizip kennzeichnet jeweils die betreffende Person. Der Relativsatz ist im modernen Deutschen idiomatisch und bewahrt durch die Wiederholung die Parallelstruktur.
- source_word: μωρίαν
  choice: Torheit
  rationale: μωρία meint Torheit oder törichtes Wesen. „Torheit“ ist prägnant, verständlich und für den weisheitlichen, sprichwörtlichen Ton angemessen.
- source_word: σοφίαν
  choice: Weisheit
  rationale: „Weisheit“ ist die sachlich genaue und im Buch Jesus Sirach zentrale Entsprechung für σοφία.
