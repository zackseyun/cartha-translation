translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, knappem Weisheitston. Der griechische Futur und die zweifache lexikalische Offenheit der Schlusswendung bleiben gewahrt; die Hauptfassung liest die Wendung idiomatisch als Klage über ausbleibenden Dank.
