translation:
  language: de
  text: 'Ein Tor wird sagen: »Ich habe keinen Freund, und für meine guten Taten gibt es keinen Dank.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »und für meine Wohltaten gibt es keine Anerkennung.« Das griechische χάρις kann »Dank«, »Anerkennung« oder »Gunst« bedeuten; τοῖς ἀγαθοῖς μου kann auch »meine guten Dinge« oder »meine Wohltaten« meinen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μωρός
  choice: ein Tor
  rationale: Bezeichnet in der Weisheitsliteratur einen törichten Menschen. »Ein Tor« wahrt den sprichwortartigen, generischen Charakter und entspricht dem würdevollen biblischen Sprachgebrauch.
- source_word: ἐρεῖ
  choice: wird sagen
  rationale: Gibt den griechischen Futur Indikativ unmittelbar wieder und klingt auch im sentenzartigen Zusammenhang natürlich.
- source_word: Οὐχ ὑπάρχει μοι φίλος
  choice: Ich habe keinen Freund
  rationale: Die Konstruktion mit ὑπάρχει und Dativ drückt hier idiomatisch Besitz beziehungsweise das Vorhandensein für die sprechende Person aus.
- source_word: χάρις
  choice: Dank
  rationale: Im Zusammenhang bezeichnet χάρις wahrscheinlich die dankbare Anerkennung erwiesener Wohltaten. »Dank« ist im Deutschen natürlich und vermeidet die hier missverständliche theologische Bedeutung »Gnade«.
- source_word: τοῖς ἀγαθοῖς μου
  choice: für meine guten Taten
  rationale: Das substantivierte Adjektiv im Plural kann die guten Dinge, Leistungen oder Wohltaten des Sprechers bezeichnen. »Gute Taten« gibt den wahrscheinlich gemeinten sozialen und moralischen Sinn verständlich wieder.
