  yaml_path: translation/deuterocanon/sirach/020/019.yaml
  text: An ungracious person is an untimely saying[a]; in the mouth of the undisciplined it will be repeated continually.
translation:
  language: de
  text: Ein Mensch ohne Anmut – eine Rede zur Unzeit[a]; im Mund der Ungebildeten wird sie ständig wiederholt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: »Ein unangenehmer Mensch – eine unzeitige Erzählung.« Beide Satzglieder sind im Griechischen knapp und ohne ausdrückliches Verb nebeneinandergestellt; daher sind mehrere eng verwandte Deutungen möglich.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄνθρωπος ἄχαρις
  choice: ein Mensch ohne Anmut
  rationale: ἄνθρωπος ist allgemein »Mensch«; ἄχαρις bezeichnet hier jemanden, dem Anmut, gewinnendes Wesen oder soziale Gefälligkeit fehlt. »Ohne Anmut« bewahrt diese Bedeutungsbreite besser als eine Verengung auf Undankbarkeit.
- source_word: μῦθος
  choice: Rede
  rationale: μῦθος meint hier am ehesten eine Äußerung oder einen Ausspruch, nicht notwendig eine ausgeführte Erzählung. »Rede« passt zum Bild vom Mund und zum sprichwortartigen Zusammenhang.
- source_word: ἄκαιρος
  choice: zur Unzeit
  rationale: Die Wendung bezeichnet etwas, das nicht zum passenden Zeitpunkt kommt. »Zur Unzeit« ist knapp, idiomatisch und dem gehobenen Spruchstil angemessen.
- source_word: ἀπαιδεύτων
  choice: der Unerzogenen
  rationale: ἀπαίδευτος bezeichnet einen Mangel an Bildung, Unterweisung und charakterlicher Formung. »Unerzogen« hebt im gegebenen sozialen Zusammenhang die fehlende Schulung des Verhaltens hervor, ohne den Ausdruck nur auf Schulbildung zu beziehen.
- source_word: ἐνδελεχισθήσεται
  choice: wird ständig wiederholt
  rationale: Die passive Zukunftsform drückt fortgesetztes oder immer wiederkehrendes Reden aus. Die deutsche Formulierung macht diesen kontextuellen Sinn verständlich.
- source_word: ἐν στόματι
  choice: im Mund
  rationale: Die konkrete griechische Metapher für hervorgebrachte Rede bleibt erhalten und ist auch im Deutschen verständlich.
