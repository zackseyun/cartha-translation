  naturalness: Die revidierte Fassung bleibt in modernem Standarddeutsch verständlich und bewahrt den würdigen, knappen Spruchstil. Der Gedankenstrich ist für die bewusst elliptische Spruchform idiomatisch; der Bezug von »sie« auf »Rede« ist klar.
