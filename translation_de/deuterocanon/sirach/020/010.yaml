  text: There is a humiliation for the sake of glory, and there is one who from humiliation has lifted up his head.
translation:
  language: de
  text: Es gibt eine Erniedrigung[a] um der Ehre willen, und mancher hat aus der Erniedrigung sein Haupt erhoben.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »eine Minderung«. Das griechische Wort kann Verminderung, Herabsetzung oder Erniedrigung bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: »Sein Haupt erheben« ist ein Bild dafür, aus einem niedrigen Zustand zu Würde oder neuer Zuversicht aufzusteigen.
    reason: cultural_note
lexical_decisions:
- source_word: ἐλάττωσις
  choice: Erniedrigung
  rationale: Das Substantiv bezeichnet eine Verminderung oder ein Herabgesetztwerden. »Erniedrigung« gibt hier die soziale Abwertung verständlich wieder und wahrt den Gegensatz zur Ehre.
- source_word: ἕνεκεν
  choice: um ... willen
  rationale: Die Wendung kann Zweck oder Grund bezeichnen. »Um der Ehre willen« folgt der griechischen Formulierung eng, ohne den Zusammenhang weiter auszudeuten.
- source_word: δόξης
  choice: Ehre
  rationale: δόξα bezeichnet in diesem weisheitlichen Zusammenhang besonders Ansehen und gesellschaftliche Ehre. »Ehre« ist im modernen Deutschen natürlicher als »Herrlichkeit«, ohne den Gegensatz zur Erniedrigung abzuschwächen.
- source_word: ταπεινώσεως
  choice: Erniedrigung
  rationale: Gemeint ist der niedrige oder herabgesetzte Zustand, aus dem jemand aufsteigt. Die Wiedergabe vermeidet »Demut«, das hier fälschlich eine Tugend bezeichnen könnte.
- source_word: ἦρεν κεφαλήν
  choice: hat ... sein Haupt erhoben
  rationale: Die konkrete bildhafte Rede des Griechischen bleibt erhalten. Das Perfekt gibt den griechischen Aorist in dem allgemeinen Sinnspruch idiomatisch wieder.
- source_word: ἔστιν ὃς
  choice: mancher
  rationale: »Mancher« gibt die sprichwörtliche Bezeichnung eines Menschentyps knapp und natürlich wieder.
theological_decisions:
- issue: Beziehung zwischen Erniedrigung und Ehre
  choice: um der Ehre willen
  alternative: wegen der Ehre
  rationale: Der griechische Ausdruck lässt eine zweckhafte oder begründende Beziehung zu. Die gewählte Form wahrt den paradoxen Gedanken, ohne eine bestimmte Lehre über den Grund der Erniedrigung festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit sprichwörtlichem Rhythmus. »Haupt« bewahrt bewusst das konkrete biblische Bild; »mancher« vermeidet eine schwerfällige wörtliche Konstruktion.
