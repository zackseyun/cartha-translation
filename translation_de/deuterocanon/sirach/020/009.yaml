  text: There is a gift that will not profit you[a], and there is a gift whose repayment is double.
translation:
  language: de
  text: Es gibt eine Gabe, die dir keinen Nutzen bringen wird,[a] und es gibt eine Gabe, deren Gegenleistung doppelt ausfällt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Es gibt ein Geben, das dir keinen Nutzen bringen wird, und es gibt ein Geben, dessen Ertrag doppelt ausfällt.“'
    reason: 'Lexikalische Alternative: δόσις kann den Akt des Gebens statt einer konkreten Gabe bezeichnen; ἀνταπόδομα kann entsprechend allgemeiner als Ertrag oder Rückgabe verstanden werden.'
lexical_decisions:
- source_word: δόσις
  choice: Gabe
  rationale: Das Substantiv kann sowohl das Geben als auch eine konkrete Gabe bezeichnen. „Gabe“ ist im sprichwortartigen Zusammenhang knapp und natürlich; die mögliche Lesart „Geben“ bleibt in der Fußnote erhalten.
- source_word: λυσιτελήσει
  choice: wird Nutzen bringen
  rationale: Die Wiedergabe bewahrt den Zukunftsbezug und bezeichnet allgemein einen Vorteil oder Nutzen, ohne ihn auf finanziellen Gewinn einzuengen.
- source_word: σοι
  choice: dir
  rationale: Der Dativ bezeichnet die betroffene oder begünstigte Person und wird im Deutschen unmittelbar mit „dir“ wiedergegeben.
- source_word: ἀνταπόδομα
  choice: Gegenleistung
  rationale: Das Wort bezeichnet das, was als Erwiderung oder Ausgleich zurückgegeben wird. „Gegenleistung“ macht den wechselseitigen Sinn verständlich, ohne ausdrücklich eine rechtliche Rückzahlung vorauszusetzen.
- source_word: διπλοῦν
  choice: doppelt ausfällt
  rationale: διπλοῦν bedeutet „doppelt“ beziehungsweise „zweifach“. Mit „ausfällt“ entsteht ein natürlicher deutscher Satz, ohne die Art der Gegenleistung näher festzulegen.
theological_decisions: []
translation_notes:
  register: Knapper, würdevoller und sprichwortartiger Satz in modernem Standarddeutsch. Die Wiederholung von „Es gibt eine Gabe“ bildet die parallele Struktur des Griechischen ab; die Mehrdeutigkeit zwischen Gabe und Geben wird nicht stillschweigend beseitigt.
