  text: A wise man keeps silent until the right time[a], but a fool does not observe the right time.
translation:
  language: de
  text: Ein Weiser schweigt bis zur rechten Zeit; ein Tor aber achtet nicht auf die rechte Zeit.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „bis zur Zeit“. Der hebräische Ausdruck kann die passende oder angemessene Zeit meinen. Die griechische Fassung dieses Verses lautet deutlich anders: „Wer viele Worte macht, wird verabscheut werden, und wer sich eigenmächtig gebärdet, wird gehasst werden.“'
    reason: alternative_reading
lexical_decisions:
- source_word: חָכָם
  choice: ein Weiser
  rationale: Das substantivierte Adjektiv bezeichnet im sprichwörtlichen Stil einen weisen Menschen. „Ein Weiser“ ist im Deutschen idiomatisch und bewahrt die grammatisch maskuline Einzahl.
- source_word: יַחֲרִישׁ
  choice: schweigt
  rationale: Das Verb bedeutet „schweigen/still sein“. Das Präsens gibt den allgemeinen Sinn des Weisheitsspruchs natürlich wieder.
- source_word: עַד עֵת
  choice: bis zur rechten Zeit
  rationale: Wörtlich steht „bis zur Zeit“. Im Kontext bezeichnet עֵת den passenden Zeitpunkt; „zur rechten Zeit“ ist natürlich und bleibt nah am hebräischen Ausdruck.
- source_word: וּכְסִיל
  choice: ein Tor aber
  rationale: ו verbindet hier gegensätzliche Aussagen. Die Nachstellung von „aber“ ergibt einen natürlichen deutschen Kontrast.
- source_word: לֹא יִשְׁמוֹר עֵת
  choice: achtet nicht auf die rechte Zeit
  rationale: Wörtlich etwa „bewahrt/beachtet die Zeit nicht“. „Auf die rechte Zeit achten“ drückt verständlich aus, dass der Tor den passenden Zeitpunkt nicht wahrt, ohne den Sinn auf bloßes Warten einzuengen.
theological_decisions: []
translation_notes:
  register: Moderner, würdiger Spruchstil mit knapper antithetischer Parallelstruktur. „Ein Weiser“ und „ein Tor“ entsprechen dem traditionellen Weisheitsvokabular und sind allgemein verständlich.
