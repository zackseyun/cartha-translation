  yaml_path: translation/deuterocanon/sirach/020/029.yaml
  text: Hospitality and gifts blind the eyes of the wise[b][a], and like a muzzle on the mouth they turn away rebukes.
translation:
  language: de
  text: Gastfreundschaft[a] und Geschenke[b] blenden die Augen der Weisen, und wie ein Maulkorb am Mund halten sie Zurechtweisungen ab.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Gastgeschenke“. Das griechische Wort ξένια kann Gastfreundschaft oder Geschenke im Rahmen einer Gastfreundschaftsbeziehung bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: „Geschenke“ meint hier Begünstigungen, die das Urteil beeinflussen können; im Griechischen steht jedoch nicht ausdrücklich „Bestechungsgeschenke“.
    reason: lexical_alternative
lexical_decisions:
- source_word: ξένια
  choice: Gastfreundschaft
  rationale: Das Wort kann Gastfreundschaft oder mit einer Gastfreundschaftsbeziehung verbundene Gastgeschenke bezeichnen. „Gastfreundschaft“ wahrt neben „Geschenke“ die soziale Begünstigung als eigenständigen Gedanken.
- source_word: δῶρα
  choice: Geschenke
  rationale: Die Grundbedeutung ist „Geschenke“. Der Zusammenhang deutet eine Beeinflussung des Urteils an, ohne ausdrücklich von Bestechung zu sprechen.
- source_word: ἀποτυφλοῖ
  choice: blenden
  rationale: Das Verb bezeichnet ein Blindmachen. „Blenden“ bewahrt das Bild und klingt im Deutschen bei beeinträchtigtem Urteil natürlich.
- source_word: ὀφθαλμοὺς σοφῶν
  choice: die Augen der Weisen
  rationale: Die Genitivverbindung wird unmittelbar und geschlechtsübergreifend wiedergegeben.
- source_word: φιμός
  choice: Maulkorb
  rationale: Das konkrete Bild eines Maulkorbs am Mund wird beibehalten; es bezeichnet bildlich die Unterdrückung offenen Widerspruchs.
- source_word: ἀποτρέπει
  choice: wehren … ab
  rationale: Das Verb bedeutet „abwenden, abwehren“. Die Formulierung gibt wieder, dass Zurechtweisungen durch die genannten Begünstigungen verhindert oder abgefangen werden.
- source_word: ἐλεγμούς
  choice: Zurechtweisungen
  rationale: Gemeint sind tadelnde oder korrigierende Äußerungen. „Zurechtweisungen“ bewahrt sowohl den moralischen Ernst als auch den verbalen Charakter.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die konkrete Bildsprache des griechischen Textes bleibt erhalten; „Maulkorb im Mund“ ist bewusst nah an der ungewöhnlichen Formulierung der Vorlage. Die Fußnoten bewahren die Bedeutungsbreite von ξένια und vermeiden, δῶρα voreilig als ausdrückliche Bestechung festzulegen.
