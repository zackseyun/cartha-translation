  text: How good it is to reprove rather than to become angry[a], and the one who confesses will be kept from loss.
translation:
  language: de
  text: Wie gut ist es, zurechtzuweisen, statt zornig zu werden! Und wer offen bekennt, wird vor Schaden bewahrt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „Und wer es offen eingesteht, wird vor Verlust oder Nachteil bewahrt.“ Im Griechischen bleibt unausgesprochen, was bekannt oder eingestanden wird; das Wort für die Folge kann Schaden, Verlust, Minderung oder Nachteil bedeuten.'
    reason: Die griechischen Ausdrücke ἀνθομολογούμενος und ἐλάττωσις lassen sowohl beim Gegenstand des Bekenntnisses als auch bei dessen negativer Folge mehrere Deutungen zu.
lexical_decisions:
- source_word: Ὡς καλὸν
  choice: Wie gut ist es
  rationale: Die exklamative Wendung bewertet die folgende Handlung moralisch; die gewählte Form ist natürlich, würdig und bewahrt den Ausrufcharakter.
- source_word: ἐλέγξαι
  choice: zurechtzuweisen
  rationale: Das Verb bezeichnet hier tadelnde, auf Korrektur zielende Rede. „Zurechtweisen“ ist im heutigen Deutsch klarer und weniger altertümlich als „rügen“.
- source_word: ἢ θυμοῦσθαι
  choice: statt zornig zu werden
  rationale: Die Konstruktion bildet den Gegensatz zur konstruktiven Zurechtweisung ab; „zornig werden“ gibt den möglichen inchoativen Sinn von θυμοῦσθαι wieder.
- source_word: ὁ ἀνθομολογούμενος
  choice: wer sein Unrecht eingesteht
  rationale: Das Partizip kann ein Bekennen oder offenes Eingestehen bezeichnen. „sein Unrecht“ erschließt den ethischen Zusammenhang, während die Fußnote darauf hinweist, dass das Objekt im Griechischen unausgesprochen bleibt.
- source_word: ἀπὸ ἐλαττώσεως
  choice: vor Schaden
  rationale: ἐλάττωσις kann Minderung, Verlust, Schaden oder Nachteil meinen. „Schaden“ ist im Deutschen breit genug, ohne die Art der negativen Folge festzulegen.
- source_word: κωλυθήσεται
  choice: wird … bewahrt
  rationale: Der zukünftige Passivsatz mit ἀπό bezeichnet hier das Fernhalten von einer schädlichen Folge; „bewahrt“ ist idiomatisch und gibt den resultativen Sinn wieder.
