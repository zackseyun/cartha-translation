  source_fidelity: 'Der Satz gibt die griechische Prädikatsstruktur sachgerecht wieder: ψεῦδος ist „eine Lüge“, μῶμος πονηρός „ein schlimmer Makel“, und ἐν ἀνθρώπῳ wird mit dem generischen „an einem Menschen“ idiomatisch übertragen. Die zweite Satzhälfte bewahrt sowohl das Bild der Lüge „im Mund“ als auch den fortdauernden Zukunftssinn von ἐνδελεχισθήσεται.'
  naturalness: „Eine Lüge ist ein schlimmer Makel an einem Menschen; im Mund der Unerzogenen bleibt sie beständig“ ist knappes, gut verständliches modernes Spruchdeutsch. Die Stellung von „beständig“ ist leicht gehoben, aber für Weisheitsliteratur passend und nicht künstlich.
  terminology: „Unerzogenen“ ist im gegebenen Weisheitskontext eine vertretbare Wiedergabe von ἀπαίδευτοι, da nicht lediglich fehlende Schulbildung, sondern fehlende Unterweisung und sittliche Formung gemeint sein kann. Die Fußnoten erläutern die wesentlichen lexikalischen Alternativen. Die Marker stehen jeweils bei dem erläuterten Ausdruck.
