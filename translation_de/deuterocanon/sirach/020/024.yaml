base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/020/024.yaml
  text: A lie is a shameful blemish in a person[b][a]; in the mouth of the undisciplined it will be continually present.
translation:
  language: de
  text: Eine Lüge ist ein schlimmer Makel an einem Menschen[a]; im Mund der Unerzogenen[b] bleibt sie beständig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »eine üble Schande für einen Menschen«; μῶμος kann auch »Schande« oder »Vorwurf« bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: »Unerzogenen« kann auch »Ununterrichteten« oder »Ungebildeten« bedeuten; gemeint ist hier wahrscheinlich vor allem fehlende sittliche Formung.
    reason: lexical_alternative
lexical_decisions:
- source_word: μῶμος πονηρός
  choice: ein schlimmer Makel
  rationale: μῶμος bezeichnet einen Makel, Schandfleck oder Anlass zum Vorwurf; πονηρός qualifiziert ihn als schlimm beziehungsweise übel. „Schlimmer Makel“ bewahrt das konkrete Bild und klingt im Deutschen natürlich.
- source_word: ἐν ἀνθρώπῳ
  choice: an einem Menschen
  rationale: Der griechische generische Singular bezeichnet einen Menschen allgemein. Bei „Makel“ ist „an einem Menschen“ im Deutschen idiomatischer als das wörtliche „in einem Menschen“.
- source_word: ψεῦδος
  choice: eine Lüge
  rationale: ψεῦδος kann „Lüge“ oder „Falschheit“ bedeuten. „Eine Lüge“ erhält die konkrete, zugespitzte Form des Weisheitsspruchs.
- source_word: ἀπαιδεύτων
  choice: der Unerzogenen
  rationale: ἀπαίδευτος meint im Kontext der Weisheitsliteratur Menschen ohne Unterweisung und sittliche Formung, nicht bloß Menschen ohne Schulbildung. „Unerzogen“ bringt diesen Bildungs- und Charakteraspekt knapp zum Ausdruck.
- source_word: ἐνδελεχισθήσεται
  choice: bleibt sie beständig
  rationale: Das Verb drückt fortdauerndes Verweilen oder Beharren aus. „Bleibt sie beständig“ gibt den durativen Sinn verständlich wieder und passt zum Bild der Lüge im Mund.
theological_decisions:
- issue: Generischer Singular ἐν ἀνθρώπῳ
  choice: an einem Menschen
  alternative: an einem Mann
  rationale: ἄνθρωπος ist hier generisch und nicht auf männliche Personen beschränkt. Das moderne deutsche „Mensch“ bewahrt Umfang und Einzahl ohne eine nicht vorhandene Geschlechtsspezifizierung.
- issue: Bedeutung von ἀπαίδευτος
  choice: der Unerzogenen
  alternative: der Ungebildeten
  rationale: Im Weisheitskontext betrifft der Ausdruck fehlende Erziehung, Unterweisung und sittliche Formung. Eine rein schulische oder intellektuelle Deutung wäre zu eng.
translation_notes:
  register: Knappes, würdiges Sprichwortdeutsch. Der Parallelismus und das konkrete Bild von Makel und Mund bleiben erhalten; archaische oder unnötig akademische Formulierungen werden vermieden.
