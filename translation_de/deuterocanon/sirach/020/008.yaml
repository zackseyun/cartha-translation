  text: There is success for a man in evil things[a], and there is a gain that leads to loss.
translation:
  language: de
  text: Mancher Mann hat Erfolg mit bösen Dingen,[a] und mancher Gewinn führt zu Verlust.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Mancher Mann hat Wohlergehen im Unglück.« Die knappe griechische Wendung kann moralisch auf böse Dinge oder situativ auf Übel und widrige Umstände bezogen werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐοδία
  choice: Erfolg
  rationale: Das Substantiv bezeichnet einen guten Verlauf oder günstigen Ausgang. »Erfolg« ist im modernen Deutschen natürlich und bewahrt die ironische Spannung des Spruchs.
- source_word: ἐν κακοῖς
  choice: mit bösen Dingen
  rationale: 'Die Wendung ist mehrdeutig und könnte auch widrige Umstände bezeichnen. Im warnenden, sprichwörtlichen Zusammenhang liegt die moralische Lesart nahe: Erfolg in oder mittels böser Angelegenheiten.'
- source_word: ἀνδρί
  choice: Mann
  rationale: Der griechische Text hat den maskulinen Singular. Die sprichwörtliche Aussage wird daher geschlechtsgenau wiedergegeben, ohne sie unnötig zu verallgemeinern.
- source_word: εὕρεμα
  choice: Gewinn
  rationale: Das Wort kann einen Fund, etwas Erlangtes oder einen Vorteil bezeichnen. »Gewinn« bildet mit dem folgenden Verlust einen klaren, im Deutschen idiomatischen Gegensatz.
- source_word: εἰς ἐλάττωσιν
  choice: führt zu Verlust
  rationale: Wörtlich weist die Formulierung auf Verminderung oder Verringerung hin. »Führt zu Verlust« gibt die paradoxe Folge eines vermeintlichen Gewinns verständlich wieder.
