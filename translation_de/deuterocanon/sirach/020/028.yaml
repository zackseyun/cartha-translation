base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/020/028.yaml
  text: The one who works the land will raise up his grain heap[a], and the one who pleases great men will atone for injustice.
translation:
  language: de
  text: Wer das Land bearbeitet, wird seinen Getreidehaufen hoch auftürmen; und wer den Mächtigen gefällt, wird Unrecht sühnen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »wird Unrecht zudecken«. Das griechische Verb bedeutet wörtlich »Sühne schaffen« beziehungsweise »sühnen«; hier kann damit auch die praktische Wirkung gemeint sein, die Gunst mächtiger Menschen zu gewinnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἐργαζόμενος γῆν
  choice: Wer das Land bearbeitet
  rationale: Das substantivierte Partizip wird als allgemeiner Wer-Satz wiedergegeben. »Das Land bearbeiten« ist im landwirtschaftlichen Zusammenhang natürlich und wahrt den Sinn von γῆν.
- source_word: ἀνυψώσει
  choice: wird … hoch auftürmen
  rationale: Die Wiedergabe bewahrt das Bild des Erhöhens und klingt zusammen mit einem Getreidehaufen im Deutschen natürlicher als das wörtliche »emporheben«.
- source_word: θιμωνιὰν αὐτοῦ
  choice: seinen Getreidehaufen
  rationale: Das Wort bezeichnet einen Haufen aus geerntetem Getreide oder Garben. »Getreidehaufen« ist verständlich, ohne die Art des Ernteguts enger festzulegen.
- source_word: ὁ ἀρέσκων
  choice: wer … gefällt
  rationale: ἀρέσκων bedeutet unmittelbar »gefallen«. Eine Formulierung wie »sich einschmeichelt« würde eine negative Absicht hinzufügen, die im griechischen Wortlaut nicht ausdrücklich enthalten ist.
- source_word: μεγιστᾶσιν
  choice: den Mächtigen
  rationale: Gemeint sind hochgestellte und einflussreiche Personen. »Die Mächtigen« gibt diesen sozialen Rang im heutigen Deutsch prägnant wieder, ohne sie speziell als Herrscher zu bestimmen.
- source_word: ἐξιλάσεται ἀδικίαν
  choice: wird Unrecht sühnen
  rationale: »Sühnen« erhält die sühnende beziehungsweise entsühnende Aussagekraft von ἐξιλάσεται. »Unrecht« deckt den moralischen und sozialen Bedeutungsbereich von ἀδικία ab und lässt offen, wessen Unrecht gemeint ist.
theological_decisions:
- issue: Ob das Gefallen der Mächtigen tatsächlich Unrecht sühnt oder es praktisch nur zudeckt
  choice: wird Unrecht sühnen
  alternative: wird Unrecht zudecken
  rationale: Der griechische Text verwendet mit ἐξιλάσεται ein Wort aus dem Bedeutungsfeld von Sühne und Versöhnung. Die Hauptfassung bewahrt dieses starke und möglicherweise zugespitzte Bild, statt es als bloße gesellschaftliche Einflussnahme auszudeuten; die pragmatische Lesart wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch in sprichwortartiger Form. Der parallele Satzbau bleibt erhalten; das Semikolon macht die beiden Glieder klar. Die mögliche moralische Spannung im zweiten Glied wird nicht aufgelöst.
