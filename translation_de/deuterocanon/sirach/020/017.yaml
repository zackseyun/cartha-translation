base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/020/017.yaml
  text: Those who eat my bread are evil of tongue[a]; how often, and how many[b], will laugh at him?
translation:
  language: de
  text: Die mein Brot essen, haben eine böse Zunge. Wie oft und wie viele[a] werden ihn verspotten[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der zweite Satz ist im Griechischen ungewöhnlich knapp und möglicherweise verkürzt überliefert. Die Übersetzung bewahrt diese auffällige Formulierung, statt sie stark zu glätten.
    reason: textual_variant
  - marker: b
    text: 'Wörtlich auch: „über ihn lachen“; das griechische Verb kann ein verächtliches Auslachen oder Verspotten bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ ἐσθίοντες
  choice: die … essen
  rationale: Das substantivierte Präsenspartizip bezeichnet allgemein diejenigen, die essen; die deutsche Relativkonstruktion gibt dies natürlich wieder.
- source_word: τὸν ἄρτον μου
  choice: mein Brot
  rationale: Die konkrete Rede vom Brot bleibt erhalten und kann zugleich Tischgemeinschaft oder empfangene Versorgung anklingen lassen.
- source_word: φαῦλοι γλώσσῃ
  choice: haben eine böse Zunge
  rationale: Die idiomatische deutsche Wendung bewahrt das konkrete Bild der Zunge und die moralisch negative Kraft von φαῦλος, ohne in die unnatürliche Formulierung „böse mit der Zunge“ zu verfallen.
- source_word: ποσάκις
  choice: wie oft
  rationale: Direkte und idiomatische Wiedergabe des interrogativen Adverbs.
- source_word: καὶ ὅσοι
  choice: und wie viele
  rationale: Die knappe, auffällige Koordination des Griechischen wird nicht durch eine erklärende Ergänzung geglättet.
- source_word: καταγελάσονται
  choice: werden … verspotten
  rationale: καταγελάω bezeichnet hier abfälliges Auslachen beziehungsweise Verspotten; „verspotten“ bringt diese stärkere Bedeutung im Deutschen prägnant zum Ausdruck.
- source_word: αὐτοῦ
  choice: ihn
  rationale: Der Genitiv fungiert als Objekt zu καταγελάω und ist maskulin; der im knappen griechischen Wortlaut nicht ausdrücklich erklärte Personenbezug bleibt bestehen.
theological_decisions:
- issue: Abrupter beziehungsweise möglicherweise verkürzter Wortlaut des zweiten Satzes
  choice: Wie oft und wie viele werden ihn verspotten?
  alternative: Wie oft werden ihn so viele verspotten?
  rationale: Die gewählte Fassung erhält die auffällige Zweigliedrigkeit von ποσάκις καὶ ὅσοι und löst die schwierige Syntax nicht spekulativ auf.
- issue: Nicht ausdrücklich genannter Bezug von αὐτοῦ
  choice: ihn
  alternative: diesen Menschen
  rationale: Das grammatische Maskulinum wird wiedergegeben, ohne einen im unmittelbaren Wortlaut nicht genannten Bezug einzusetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Eine böse Zunge haben“ ist allgemein verständlich, bewahrt das Körperbild des Griechischen und bezeichnet böswillige Rede. Der zweite Satz bleibt bewusst etwas abrupt, entsprechend dem überlieferten Ausgangstext.
