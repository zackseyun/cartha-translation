  yaml_path: translation/deuterocanon/sirach/020/020.yaml
  text: A proverb will be rejected from the mouth of a fool[a], for he will certainly not speak it at its proper time.
translation:
  language: de
  text: Aus dem Mund eines Toren wird ein Sprichwort verworfen[a]; denn er wird es gewiss nicht zur rechten Zeit sagen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Aus dem Mund eines Toren wird ein Gleichnis verworfen“, wenn παραβολή hier in einem weiteren Sinn verstanden wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ στόματος
  choice: Aus dem Mund
  rationale: Die Präpositionalphrase bezeichnet die Herkunft des Ausspruchs. Die konkrete griechische Wendung bleibt im Deutschen natürlich und rhetorisch wirksam.
- source_word: μωροῦ
  choice: eines Toren
  rationale: μωρός bezeichnet in der Weisheitsliteratur einen moralisch und praktisch unverständigen Menschen. „Tor“ ist eine knappe, würdige und im biblischen Weisheitswort vertraute Entsprechung.
- source_word: ἀποδοκιμασθήσεται
  choice: wird … verworfen
  rationale: Das Futur Passiv besagt, dass der Ausspruch wegen seines ungeeigneten Sprechers keine Anerkennung findet. „Verworfen“ bewahrt Passiv und Nachdruck, ohne den gesellschaftlichen Vorgang näher auszudeuten.
- source_word: παραβολή
  choice: ein Sprichwort
  rationale: παραβολή meint im Weisheitskontext hier am ehesten einen prägnanten Weisheitsspruch. Die breitere Bedeutung „Gleichnis“ bleibt in der Fußnote erhalten.
- source_word: οὐ γὰρ μὴ
  choice: denn er wird … gewiss nicht
  rationale: Die Verbindung οὐ μή drückt eine nachdrückliche Verneinung aus; „gewiss nicht“ gibt diesen Nachdruck in natürlichem modernem Deutsch wieder.
- source_word: εἴπῃ αὐτὴν
  choice: es … sagen
  rationale: Das Pronomen bezieht sich auf das Sprichwort. „Sagen“ ist die unmittelbare und idiomatische Wiedergabe von εἴπῃ.
- source_word: ἐν καιρῷ αὐτῆς
  choice: zur rechten Zeit
  rationale: καιρός bezeichnet den passenden, günstigen Zeitpunkt. „Zur rechten Zeit“ gibt sowohl den zeitlichen als auch den situationsgerechten Aspekt wieder; αὐτῆς wird auf das Sprichwort und seinen passenden Anlass bezogen.
