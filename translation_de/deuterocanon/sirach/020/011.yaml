  text: There is one who buys much for little[b][a], and repays it sevenfold.
translation:
  language: de
  text: Mancher kauft vieles für wenig[a] und zahlt es siebenfach zurück.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der griechische Satz ist stark verdichtet. Gemeint sein kann, dass jemand vieles günstig kauft, später aber siebenmal so viel dafür entrichten muss; allgemeiner kann es darum gehen, dass sich ein vermeintlich günstiger Kauf als sehr teuer erweist.
    reason: alternative_reading
  - marker: b
    text: 'Wörtlicher: „und zahlt sie siebenfach zurück“. Das griechische Pronomen steht in der Mehrzahl. Sein genauer Bezug und worauf sich die siebenfache Bemessung bezieht, bleiben in der knappen Formulierung offen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔστιν ἀγοράζων
  choice: Mancher kauft
  rationale: Die griechische Existenzformel mit Partizip führt spruchweisheitlich einen möglichen Menschentyp oder Fall ein. „Mancher kauft“ ist im modernen Deutschen natürlich und bleibt knapp.
- source_word: πολλὰ
  choice: viel
  rationale: Das substantivierte Neutrum Plural bezeichnet hier die gekauften Dinge beziehungsweise eine große Menge; „viel“ wahrt die gedrängte Ausdrucksweise.
- source_word: ὀλίγου
  choice: für wenig
  rationale: Der Genitiv bezeichnet bei einem Kauf den Preis. „Für wenig“ gibt die geringe Kaufsumme formal nah und sprichwortartig wieder.
- source_word: ἀποτιννύων
  choice: bezahlt ... zurück
  rationale: Das Verb bezeichnet das Entrichten oder Zurückzahlen einer Schuld. Die Wiedergabe bewahrt den finanziellen Zusammenhang, ohne festzulegen, weshalb die spätere Zahlung anfällt.
- source_word: αὐτὰ
  choice: es
  rationale: Das griechische Pronomen ist formal Neutrum Plural und verweist auf das Gekaufte. Im Deutschen kann dieses kollektiv mit „es“ aufgenommen werden; die wörtlichere Mehrzahl steht in der Fußnote.
- source_word: ἑπταπλάσιον
  choice: siebenfach
  rationale: Das Wort bezeichnet ein siebenfaches Maß. „Siebenfach“ erhält die prägnante Form und lässt offen, ob Preis, Wert oder Rückzahlung gemeint ist.
theological_decisions:
- issue: Deutung des Gegensatzes zwischen billigem Kauf und siebenfacher Rückzahlung
  choice: Die wirtschaftliche Bildsprache bleibt ohne moralische oder heilsgeschichtliche Ausdeutung stehen.
  alternative: Ausdrückliche Deutung als Warnung, dass ein vermeintliches Schnäppchen am Ende teuer wird.
  rationale: Der griechische Text ist knapp und nennt weder den Grund der Rückzahlung noch ausdrücklich die moralische Folgerung. Die Übersetzung bewahrt diese Spannung.
translation_notes:
  register: Knappes, würdiges und sprichwortartiges Standarddeutsch. „Mancher“ entspricht dem weisheitlichen Fallbeispiel; die ungewöhnliche Formulierung „für wenig“ hält bewusst die Prägnanz des Griechischen fest. Sämtliche Fußnotenmarker stehen im Haupttext.
