  source_fidelity: Der erste Satzteil gibt ἔστιν ἀπολλύων ... διʼ αἰσχύνην zutreffend wieder. Im zweiten Satzteil ist „Auftreten“ jedoch eine weitergehende Idiomatisierung von πρόσωπον, das primär „Gesicht“ bzw. „Antlitz“ bedeutet. Die auffällige Bildlichkeit des griechischen Weisheitsspruchs sollte im Haupttext erhalten bleiben. Die Wiederaufnahme von ψυχή durch „es“ und das Futur „wird ... verlieren“ sind sachgerecht.
  naturalness: „Mancher richtet sein eigenes Leben aus Scham zugrunde“ ist modernes, würdiges Deutsch. „Wegen eines törichten Gesichts“ ist absichtlich ungewohnt, aber verständlich und für die quellensprachliche, möglicherweise schwierige Formulierung angemessener als die deutende Wiedergabe „Auftreten“.
  terminology: „Leben“ für ψυχή ist im Kontext gut vertretbar und die Fußnote wahrt „Seele“ sowie „Selbst“ als lexikalische Möglichkeiten. „Scham“ und „töricht“ treffen αἰσχύνη und ἄφρων. Die Fußnote zu πρόσωπον soll keine nicht im griechischen Wortlaut angelegte personale Deutung („eines törichten Menschen“) als Möglichkeit ausgeben.
