  yaml_path: translation/deuterocanon/sirach/020/022.yaml
  text: There is one who destroys his own life through shame[b][a], and because of a foolish face he will lose it.
translation:
  language: de
  text: Mancher richtet sein eigenes Leben[a] aus Scham zugrunde, und wegen eines törichten Gesichts[b] wird er es verlieren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: seine eigene Seele; griechisch ψυχή kann „Leben“, „Selbst“ oder „Seele“ bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „von/wegen eines törichten Gesichts“. πρόσωπον kann „Gesicht“, „Antlitz“ oder „Erscheinung“ bedeuten; die knappe griechische Wendung ist im Zusammenhang schwer zu deuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔστιν ἀπολλύων
  choice: Mancher richtet … zugrunde
  rationale: Die existenziale Wendung mit Partizip bezeichnet eine Person, die entsprechend handelt. „Mancher“ ist im Deutschen natürlich; „zugrunde richten“ bewahrt die starke Bedeutung von ἀπόλλυμι.
- source_word: τὴν ψυχὴν αὐτοῦ
  choice: sein eigenes Leben
  rationale: ψυχή kann Leben, Selbst oder Seele bezeichnen. Im Zusammenhang selbstschädigenden Handelns ist „Leben“ natürlich, während „eigenes“ den Rückbezug von αὐτοῦ verdeutlicht, ohne eine engere anthropologische Deutung festzulegen.
- source_word: διʼ αἰσχύνην
  choice: aus Scham
  rationale: διά mit Akkusativ bezeichnet hier Ursache oder Beweggrund. „Aus Scham“ ist im Deutschen knapp und idiomatisch.
- source_word: ἀπὸ ἄφρονος προσώπου
  choice: wegen eines törichten Auftretens
  rationale: Die ungewöhnliche Wendung bedeutet wörtlich etwa „von/wegen eines törichten Gesichts“. πρόσωπον kann Gesicht, Erscheinung oder äußeres Auftreten bezeichnen. „Auftreten“ erhält den Bezug zur nach außen sichtbaren Selbstdarstellung, ohne die schwer verständliche Formulierung „törichtes Gesicht“ in den Haupttext zu übernehmen.
- source_word: ἀπολεῖ αὐτήν
  choice: wird er es verlieren
  rationale: Das Futur greift dasselbe Verb wie im ersten Satzteil auf; das Pronomen bezieht sich auf ψυχή zurück. „Verlieren“ gibt den resultativen Sinn natürlich wieder und erhält zugleich den Zusammenhang mit „Leben“.
theological_decisions:
- issue: Bedeutung von ψυχή in diesem Weisheitsspruch
  choice: Leben
  alternative: Seele; sich selbst
  rationale: Der praktische Warnspruch beschreibt die verheerenden Folgen von Scham und törichtem Auftreten. „Leben“ wahrt die konkrete Tragweite, ohne aus dem Vers eine Aussage über die metaphysische Beschaffenheit der Seele zu machen.
- issue: Deutung von ἀπὸ ἄφρονος προσώπου
  choice: wegen eines törichten Auftretens
  alternative: wegen eines törichten Gesichtsausdrucks; vor einem törichten Menschen; aus Rücksicht auf einen Toren
  rationale: Die griechische Formulierung ist mehrdeutig und ungewöhnlich. Der Haupttext gibt die naheliegende äußerliche Bedeutung idiomatisch wieder; die Fußnote bewahrt die wörtliche Bildsprache und die mögliche personale Deutung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Parallelismus und die starke Wiederholung von ἀπόλλυμι werden sinngemäß durch „zugrunde richten“ und „verlieren“ wiedergegeben. Die schwer verständliche Bildsprache des zweiten Satzteils wird im Haupttext moderat idiomatisiert und in der Fußnote offengelegt.
