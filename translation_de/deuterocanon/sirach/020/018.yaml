base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/020/018.yaml
  text: A slip is better from the ground than from the tongue[a]; so the downfall of the wicked will come in haste.
translation:
  language: de
  text: Ein Ausgleiten auf dem Boden ist besser als eines mit der Zunge; so wird der Sturz der Bösen rasch kommen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „so wird der Sturz der Übel rasch kommen.“ Das griechische κακῶν kann persönlich („der Bösen“) oder abstrakt („der Übel“) verstanden werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ὀλίσθημα
  choice: ausgleiten
  rationale: Das Substantiv bezeichnet ein Ausgleiten oder Straucheln. Die verbale Fassung klingt im deutschen Vergleich natürlich und bewahrt das konkrete Bild.
- source_word: ἀπὸ ἐδάφους
  choice: auf dem Boden
  rationale: Gemeint ist das Ausgleiten aufgrund des Bodens beziehungsweise des Untergrunds; „auf dem Boden“ gibt das Bild im Deutschen idiomatisch wieder.
- source_word: μᾶλλον ἢ ἀπὸ γλώσσης
  choice: besser … als mit der Zunge
  rationale: Der griechische Vergleich ist elliptisch. „Besser … als“ macht ihn verständlich; „mit der Zunge“ bewahrt das konkrete Bild für einen sprachlichen Fehltritt.
- source_word: πτῶσις
  choice: Sturz
  rationale: „Sturz“ entspricht dem Grundsinn eng und nimmt zugleich das Bild des Ausgleitens aus dem ersten Satzteil auf.
- source_word: κακῶν
  choice: der Bösen
  rationale: Der Genitiv wird hier personal verstanden und bezeichnet böse beziehungsweise gottlose Menschen; die abstrakte Lesart bleibt in der Fußnote erhalten.
- source_word: κατὰ σπουδήν
  choice: eilends
  rationale: Das Wort gibt Schnelligkeit und Dringlichkeit wieder und passt zum würdevollen Spruchstil.
- source_word: ἥξει
  choice: wird … kommen
  rationale: Dies bildet das Futur des griechischen Verbs unmittelbar und natürlich ab.
theological_decisions:
- issue: Referent von κακῶν
  choice: 'personal: „der Bösen“'
  alternative: 'abstrakt: „des Bösen“ oder „der Übel“'
  rationale: In Verbindung mit πτῶσις ergibt die personale Deutung einen stimmigen Weisheitsspruch. Da κακῶν grammatisch auch abstrakt verstanden werden kann, wird diese echte Mehrdeutigkeit in einer Fußnote offengelegt.
translation_notes:
  register: Moderner, knapper und würdevoller Spruchstil. Die konkrete Gegenüberstellung von körperlichem Ausgleiten und einem Fehltritt der Zunge bleibt erhalten; „eilends“ bewahrt die Dringlichkeit von κατὰ σπουδήν.
