  text: A wise man will make himself beloved by his words[a], but the favors of fools will be poured out.
translation:
  language: de
  text: Ein Weiser wird sich durch sein Reden beliebt machen; doch die Gunstbeweise der Toren werden ausgeschüttet.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „doch die Anmut / der Reiz der Toren wird ausgeschüttet.“ Das griechische Wort χάριτες kann Gunstbeweise und freundliche Zuwendungen, aber auch Anmut oder Reize bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ σοφὸς
  choice: ein Weiser
  rationale: Das substantivierte Adjektiv steht im maskulinen Singular. „Ein Weiser“ bewahrt diese Form und klingt im Deutschen natürlich.
- source_word: ἐν λόγῳ
  choice: durch sein Reden
  rationale: Die Präpositionalverbindung bezeichnet hier das Mittel oder den Bereich. „Durch sein Reden“ gibt den instrumentalen Sinn wieder, ohne den Singular λόγος unnatürlich auf ein einziges Wort zu verengen.
- source_word: ἑαυτὸν προσφιλῆ ποιήσει
  choice: wird sich … beliebt machen
  rationale: Die Wiedergabe wahrt sowohl die reflexive Konstruktion als auch den Beziehungssinn von προσφιλής („lieb, geschätzt, beliebt“).
- source_word: χάριτες
  choice: Gunstbeweise
  rationale: Der Plural kann konkrete freundliche oder begünstigende Zuwendungen bezeichnen. „Gunstbeweise“ ist hier verständlich, lässt aber die ebenfalls mögliche Bedeutung von Anmut oder Reiz nicht vollständig erkennen; deshalb wird die Mehrdeutigkeit in einer Fußnote ausgewiesen.
- source_word: μωρῶν
  choice: der Toren
  rationale: Der Genitiv wird knapp und idiomatisch als Zugehörigkeitsangabe wiedergegeben.
- source_word: ἐκχυθήσονται
  choice: werden ausgeschüttet
  rationale: Die Form ist Futur Passiv von ἐκχέω. „Ausgeschüttet“ bewahrt das Bild des Ausgießens und kann ein unbedachtes oder verschwenderisches Verteilen anklingen lassen, ohne diese Deutung ausdrücklich in den Text einzutragen.
