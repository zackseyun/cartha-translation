translation:
  language: de
  text: Ein Dieb ist einem Menschen vorzuziehen, der beharrlich lügt; doch beide werden Verderben erben.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αἱρετὸν
  choice: ist … vorzuziehen
  rationale: Das Adjektiv bezeichnet, was eher zu wählen beziehungsweise vorzuziehen ist. Die deutsche Wendung gibt den vergleichenden Sinn des Spruchs natürlich wieder.
- source_word: κλέπτης
  choice: ein Dieb
  rationale: κλέπτης bezeichnet gewöhnlich einen Dieb, nicht einen gewalttätigen Räuber.
- source_word: ἐνδελεχίζων
  choice: der beharrlich
  rationale: Das Partizip drückt fortgesetztes oder gewohnheitsmäßiges Verhalten aus; »beharrlich« bewahrt diesen durativen Sinn.
- source_word: ψεύδει
  choice: lügt
  rationale: Der Dativ bezeichnet hier den Bereich der fortgesetzten Handlung. Die verbale Wiedergabe »beharrlich lügt« ist im Deutschen knapper und natürlicher als »im Lügen verharrt«.
- source_word: ἀμφότεροι
  choice: beide
  rationale: Die einfache, beide genannten Personen umfassende Bedeutung wird direkt wiedergegeben.
- source_word: ἀπώλειαν
  choice: Verderben
  rationale: ἀπώλεια meint hier den endgültigen Ruin beziehungsweise Untergang. »Verderben« ist gewichtig, ohne unnötig eine spätere dogmatische Fachbedeutung festzulegen.
- source_word: κληρονομήσουσιν
  choice: werden … erben
  rationale: 'Die wörtliche Erbmetaphorik bleibt erhalten und bewahrt die Ironie des Spruchs: Ihr Erbteil ist Verderben.'
theological_decisions:
- issue: Moralischer Vergleich im Spruch
  choice: Der Dieb wird gegenüber einem Menschen, der beharrlich lügt, als das geringere Übel dargestellt; dennoch werden beide dem Verderben anheimfallen.
  alternative: Der Vergleich könnte ausschließlich als zugespitzte Weisheitsrhetorik verstanden werden, die die besondere Schwere fortgesetzten Lügens hervorhebt.
  rationale: Der griechische Text enthält einen wirklichen Vergleich, entschuldigt den Diebstahl jedoch nicht, weil der zweite Satz beide gemeinsam dem Verderben zuordnet. Diese Spannung bleibt bestehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit sprichwortartiger Kürze. Die Satzstellung »Ein Dieb ist einem Menschen vorzuziehen« macht den Vergleich eindeutig; »doch« bildet den kontrastierenden zweiten Halbvers ab.
