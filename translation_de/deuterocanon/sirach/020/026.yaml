translation:
  language: de
  text: Der Charakter eines verlogenen Menschen ist Unehre, und seine Schande bleibt ständig bei ihm.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἦθος
  choice: Charakter
  rationale: ἦθος bezeichnet hier die gefestigte sittliche Art beziehungsweise Wesensprägung eines Menschen. »Charakter« ist im modernen Deutschen natürlich und weiter gefasst als »Gewohnheit«.
- source_word: ἀνθρώπου ψευδοῦς
  choice: eines verlogenen Menschen
  rationale: Das Genitivattribut kennzeichnet einen Menschen, der von Falschheit beziehungsweise Lügen geprägt ist. »Verlogen« drückt diese charakterliche Ausrichtung idiomatisch aus; »Mensch« gibt ἄνθρωπος ohne unnötige geschlechtliche Verengung wieder.
- source_word: ἀτιμία
  choice: bringt Unehre
  rationale: ἀτιμία bezeichnet Ehrlosigkeit, Entehrung oder Schmach. Die prädikative Aussage »bringt Unehre« macht den knappen griechischen Nominalsatz im Deutschen verständlich, ohne ἀτιμία mit αἰσχύνη gleichzusetzen.
- source_word: αἰσχύνη
  choice: Schande
  rationale: »Schande« bezeichnet die beschämende Entehrung, die dem verlogenen Menschen anhaftet, und hält den Begriff von der vorausgehenden »Unehre« unterscheidbar.
- source_word: μετʼ αὐτοῦ
  choice: bei ihm
  rationale: Die Wendung bedeutet wörtlich »mit ihm«. In Verbindung mit »bleibt« ist »bei ihm« im Deutschen natürlich und bewahrt die Vorstellung dauernder Begleitung.
- source_word: ἐνδελεχῶς
  choice: ständig
  rationale: Das Adverb bezeichnet fortdauernde beziehungsweise beständige Gegenwart. »Ständig« gibt dies klar und knapp wieder.
