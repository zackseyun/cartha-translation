base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/020/021.yaml
  text: There is one who is prevented from sinning by poverty[b][a], and in his rest he will feel no remorse.
translation:
  language: de
  text: Mancher wird durch Armut daran gehindert zu sündigen[a], und in seiner Ruhe empfindet er keine Gewissensqual[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »aus Mangel« oder »wegen seiner Bedürftigkeit«. Gemeint ist, dass fehlende Mittel ihn zurückhalten.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »wird er nicht durchbohrt/gestochen werden«; gemeint ist eine innere Gewissensnot oder Reue.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κωλυόμενος
  choice: wird … daran gehindert
  rationale: Die passive Form bezeichnet, dass jemand durch einen äußeren Umstand zurückgehalten oder gehindert wird.
- source_word: ἁμαρτάνειν
  choice: zu sündigen
  rationale: Bewahrt die moralisch-religiöse Bedeutung des griechischen Verbs, ohne sie zum allgemeineren »Unrecht tun« abzuschwächen.
- source_word: ἀπὸ ἐνδείας
  choice: durch Armut
  rationale: ἐνδεία bezeichnet Mangel, Bedürftigkeit oder Armut; die Präposition gibt hier den Grund beziehungsweise das hindernde Mittel an.
- source_word: ἐν τῇ ἀναπαύσει αὐτοῦ
  choice: wenn er zur Ruhe kommt
  rationale: Gibt den zeitlich-situativen Sinn der Wendung in natürlichem Deutsch wieder, ohne festzulegen, ob körperliche Ruhe, Erleichterung oder ein ruhiger Zustand gemeint ist.
- source_word: οὐ κατανυγήσεται
  choice: empfindet er keine Gewissensqual
  rationale: Das Verb bezeichnet wörtlich ein inneres Durchbohrt- oder Gestochenwerden und kann übertragen Gewissensnot oder Reue ausdrücken. »Gewissensqual« erhält den Gedanken innerer Betroffenheit, ohne ausdrücklich eine voll entwickelte Umkehr vorauszusetzen.
theological_decisions:
- issue: Moralische Bedeutung der Armut als Hindernis für Sünde
  choice: Der Vers stellt beobachtend fest, dass Armut einen Menschen am Sündigen hindern kann.
  alternative: Armut könnte als an sich tugendhaft oder gerechtmachend verstanden werden.
  rationale: Der griechische Text nennt Mangel als Ursache der Verhinderung, spricht ihm aber keine eigene moralische Verdienstlichkeit zu.
- issue: Bezug der fehlenden inneren Betroffenheit
  choice: Die fehlende Gewissensqual wird auf die Ruhe beziehungsweise den ruhigen Zustand der betreffenden Person bezogen.
  alternative: Die Aussage könnte stärker als ausdrückliche Freiheit von Reue formuliert werden.
  rationale: κατανύσσομαι trägt das Bild inneren Gestochenwerdens; »Gewissensqual« bewahrt diese Spannung und legt den Begriff nicht ausschließlich auf Reue fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Mancher« gibt das unbestimmte ἔστιν knapp und natürlich wieder. Die Formulierung wahrt die beobachtende Weisheitsaussage und lässt die genaue Art der »Ruhe« offen.
