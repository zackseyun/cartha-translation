translation_notes:
  register: Knappes, parallel gebautes Sprichwort in modernem, würdigem Standarddeutsch. „Mancher“ gibt die generischen Personentypen ohne unnötige geschlechtliche Festlegung wieder; „vieles Reden“ klingt natürlich und bewahrt den kritischen Ton gegenüber übermäßigem Sprechen.
