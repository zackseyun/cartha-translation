base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/020/005.yaml
  text: There is one who keeps silent and is considered wise[a], and there is one who is despised because of much talk.
translation:
  language: de
  text: Mancher schweigt und gilt als weise,[a] mancher aber wird wegen seines vielen Redens verachtet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Griechisch: „Mancher schweigt, weil er keine Antwort hat, und mancher schweigt, weil er den rechten Zeitpunkt kennt.“ Der hier erhaltene hebräische Text weicht erheblich davon ab; der Haupttext folgt dem vorhandenen Hebräisch als der vorrangigen Quelle für Jesus Sirach, wo es erhalten ist.'
    reason: alternative_reading
lexical_decisions:
- source_word: יֵשׁ ... וְיֵשׁ
  choice: Mancher ... mancher aber
  rationale: Die doppelte Existenzformel führt zwei Menschentypen ein. Die deutsche Fassung gibt die parallele Spruchform knapp und natürlich wieder.
- source_word: מַחֲרִישׁ
  choice: schweigt
  rationale: Das Partizip von חרש bezeichnet anhaltendes Schweigen. Im Deutschen drückt das Präsens in einem allgemeinen Weisheitsspruch denselben charakteristischen Sinn idiomatisch aus.
- source_word: וְנֶחְשָׁב חָכָם
  choice: und gilt als weise
  rationale: Das Nifal von חשב bezeichnet, wie jemand von anderen eingeschätzt wird. „Gilt als weise“ ist natürlich und bewahrt den sozialen Bewertungscharakter.
- source_word: נִמְאָס
  choice: wird ... verachtet
  rationale: מאס kann Ablehnung oder Geringschätzung bezeichnen. „Verachtet“ bildet den deutlichen Gegensatz zu „gilt als weise“ ab.
- source_word: בְּרוֹב שִׂיחַ
  choice: wegen seines vielen Redens
  rationale: בְּרוֹב bezeichnet hier den Grund beziehungsweise Anlass, und שִׂיחַ das Reden. Die possessive Formulierung ist im Deutschen natürlich und macht deutlich, dass die übermäßige Rede der betreffenden Person gemeint ist.
