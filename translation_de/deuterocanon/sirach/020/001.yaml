  yaml_path: translation/deuterocanon/sirach/020/001.yaml
  text: There is a rebuke that is not timely[a], and there is one who keeps silent and is himself wise.
translation:
  language: de
  text: Es gibt eine Zurechtweisung, die nicht zur rechten Zeit kommt[a], und es gibt einen, der schweigt und selbst klug ist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die nicht angebracht / passend ist«. Das griechische Adjektiv kann »zur rechten Zeit«, »angemessen« oder in anderen Zusammenhängen »schön« bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγχος
  choice: Zurechtweisung
  rationale: Das Wort bezeichnet das Aufzeigen eines Fehlers beziehungsweise eine tadelnde Korrektur. »Zurechtweisung« ist im Deutschen klar, würdig und trifft den sprichwortartigen Zusammenhang besser als das schärfere »Rüge«.
- source_word: ὡραῖος
  choice: zur rechten Zeit
  rationale: Das Adjektiv kann »zeitgemäß«, »passend« oder auch »schön« bedeuten. In Verbindung mit einer Zurechtweisung liegt vor allem der Gedanke des rechten Zeitpunkts nahe; die Fußnote bewahrt die weitere Bedeutung der Angemessenheit.
- source_word: σιωπῶν
  choice: der schweigt
  rationale: Das substantivierte Partizip bezeichnet einen Menschen, der schweigt. Die schlichte Wiedergabe ist natürlich und erhält den Gegensatz zur Zurechtweisung.
- source_word: φρόνιμος
  choice: klug
  rationale: Das Wort bezeichnet praktische Einsicht, Besonnenheit oder Klugheit. »Klug« ist hier idiomatisch und lässt die praktische Weisheit des Schweigens erkennen, ohne den Begriff unnötig einzuengen.
- source_word: καὶ αὐτός
  choice: und selbst
  rationale: Die Formulierung hebt die schweigende Person ausdrücklich hervor. »Selbst« erhält diese Betonung, ohne zusätzlich zu behaupten, dass gerade das Schweigen allein ihre Klugheit ausmacht.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit sprichwortartig knapper und würdiger Satzführung. Die Wiederholung »es gibt« bildet die griechische Parallelstruktur ab; die Formulierung vermeidet es, den Zusammenhang zwischen Schweigen und Klugheit stärker festzulegen, als der Ausgangstext es tut.
