  text: Today he lends[a], and tomorrow he demands it back; such a man is hateful.
translation:
  language: de
  text: Heute leiht er aus, und morgen fordert er es zurück; ein solcher Mensch ist verhasst.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „verabscheuungswürdig“. Das griechische Wort kann sowohl bedeuten, dass dieser Mensch gehasst wird, als auch, dass er Abscheu erregt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σήμερον
  choice: Heute
  rationale: Bewahrt den knappen zeitlichen Gegensatz zu αὔριον im sprichwörtlichen Stil.
- source_word: δανιεῖ
  choice: leiht er aus
  rationale: Das Futur bezeichnet hier pointiert das typische beziehungsweise unmittelbar bevorstehende Verhalten; im deutschen Weisheitsspruch klingt das Präsens natürlich. „Ausleihen“ bezeichnet hier das Geben eines Darlehens, nicht das Entleihen.
- source_word: αὔριον
  choice: morgen
  rationale: Gibt den scharfen Gegensatz zu „heute“ unmittelbar wieder.
- source_word: ἀπαιτήσει
  choice: fordert er es zurück
  rationale: ἀπαιτέω bedeutet etwas zurückfordern oder eintreiben. Das Pronomen nimmt den im Leihen enthaltenen, im Griechischen unausgesprochenen Gegenstand auf.
- source_word: μισητὸς
  choice: verhasst
  rationale: Das Adjektiv kann sowohl die hervorgerufene Ablehnung („verhasst“) als auch den abstoßenden Charakter („verabscheuungswürdig“) bezeichnen. „Verhasst“ erhält die passive Bedeutungsseite, ohne die andere Möglichkeit zu verdecken.
- source_word: ἄνθρωπος
  choice: Mensch
  rationale: ἄνθρωπος bezeichnet hier allgemein einen menschlichen Typus; „Mensch“ ist im Deutschen genau, natürlich und nicht unnötig geschlechtsspezifisch.
- source_word: ὁ τοιοῦτος
  choice: ein solcher
  rationale: Die Wendung kennzeichnet knapp den soeben beschriebenen Menschentyp.
theological_decisions:
- issue: Mehrdeutigkeit von μισητός als moralische Eigenschaft oder hervorgerufene Reaktion
  choice: verhasst
  alternative: verabscheuungswürdig / ein Mensch, den man hasst
  rationale: Der Haupttext gibt die naheliegende passive Bedeutung wieder; die Fußnote bewahrt die echte lexikalische Mehrdeutigkeit, ohne sie theologisch oder moralisch einseitig aufzulösen.
- issue: Generischer Gebrauch von ἄνθρωπος im Weisheitsspruch
  choice: Mensch
  alternative: Mann
  rationale: Das griechische Substantiv ist hier nicht auf männliches Geschlecht beschränkt, sondern bezeichnet einen repräsentativen Menschentyp. „Mensch“ bildet diesen allgemeinen Bezug im modernen Deutschen sachgerecht ab.
translation_notes:
  register: Knapp, sprichwörtlich und würdevoll. Die Gegenüberstellung „heute … morgen“ und die zugespitzte Schlusswertung bleiben erhalten. „Leiht … aus“ wird transitiv im Sinn von „gibt als Darlehen“ verwendet.
