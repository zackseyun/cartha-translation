  text: Like a eunuch’s desire to deflower a young woman, so is one who executes judgments by force.
translation:
  language: de
  text: Dem Verlangen eines Eunuchen, eine junge Frau zu entjungfern, gleicht, wer Urteile mit Gewalt[a] vollstreckt.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „gewaltsam“. Die griechische Wendung kann Zwang oder gewaltsames Handeln hervorheben.'
    reason: lexical_alternative
  - marker: b
    text: Das Bild kann sowohl die Verwerflichkeit eines durch Zwang vollstreckten Urteils als auch dessen widersinnige Unangemessenheit und Vergeblichkeit hervorheben.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπιθυμία
  choice: Verlangen
  rationale: Das Substantiv bezeichnet allgemein ein Begehren oder starkes Verlangen. „Verlangen“ bewahrt die Offenheit des Ausdrucks, während der sexuelle Bezug bereits durch den Infinitiv deutlich wird.
- source_word: εὐνούχου
  choice: eines Eunuchen
  rationale: „Eunuch“ ist die übliche und sachlich genaue Wiedergabe; die körperliche und kulturelle Bedeutung gehört zum Bild des Spruchs.
- source_word: ἀποπαρθενῶσαι
  choice: zu entjungfern
  rationale: Das Verb bezeichnet konkret, einer jungen Frau die Jungfräulichkeit zu nehmen. „Entjungfern“ gibt dies knapp und präzise wieder, ohne den Vorgang allgemeiner als im Griechischen zu formulieren.
- source_word: νεάνιδα
  choice: eine junge Frau
  rationale: Der Ausdruck bezeichnet eine junge weibliche Person. „Junge Frau“ ist gegenwärtig und würdevoll; „Mädchen“ könnte hier ein nicht gesichertes Kindesalter nahelegen.
- source_word: οὕτως
  choice: gleicht
  rationale: Die deutsche Vergleichskonstruktion „Dem … gleicht, wer …“ gibt die mit οὕτως markierte Entsprechung natürlich wieder.
- source_word: ὁ ποιῶν
  choice: wer … vollstreckt
  rationale: Wörtlich steht „der Tuende“. Zusammen mit κρίματα bezeichnet die Wendung das Ausführen oder Vollziehen von Urteilen; „wer … vollstreckt“ ist im Deutschen idiomatisch.
- source_word: ἐν βίᾳ
  choice: mit Gewalt
  rationale: Die Präpositionalphrase kann Zwang oder gewaltsames Handeln bezeichnen. „Mit Gewalt“ lässt beide Aspekte erkennen.
- source_word: κρίματα
  choice: Urteile
  rationale: Der Plural bezeichnet gerichtliche Entscheidungen oder Urteilssprüche. „Urteile“ bewahrt sowohl den juristischen Sinn als auch die Mehrzahl.
theological_decisions:
- issue: Aussageabsicht des Vergleichs
  choice: Das Bild bleibt ohne eindeutige Ausdeutung stehen und kennzeichnet das gewaltsame Vollstrecken von Urteilen als unpassend, widersprüchlich oder vergeblich.
  alternative: Der Spruch könnte ausschließlich die moralische Verwerflichkeit gewaltsamer Rechtsprechung oder ausschließlich deren Ohnmacht und Aussichtslosigkeit betonen.
  rationale: Der griechische Text nennt nur den Vergleich und erklärt dessen tertium comparationis nicht. Haupttext und Fußnote bewahren deshalb die Spannung zwischen ethischer Kritik, widersinniger Unangemessenheit und Vergeblichkeit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Vergleichskonstruktion ist gegenüber einer starren Nachbildung der griechischen Wortfolge geglättet; das anstößige und spannungsreiche Bild selbst bleibt unverändert erhalten.
