base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/020/023.yaml
  text: There is one who promises a favor out of shame to a friend[a], and so acquires him as an enemy for nothing.
translation:
  language: de
  text: Mancher verspricht einem Freund aus Scham einen Gefallen und macht ihn sich so ohne Grund zum Feind.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »völlig umsonst«. Das griechische Wort kann sowohl »ohne Grund« als auch »ohne jeden Nutzen« bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: χάριν
  choice: einen Gefallen
  rationale: Im gesellschaftlichen Zusammenhang bezeichnet χάρις hier eine Gefälligkeit oder einen Freundschaftsdienst, nicht »Gnade« im theologischen Sinn.
- source_word: αἰσχύνης
  choice: aus Beschämung
  rationale: 'Der Genitiv bezeichnet den Beweggrund: Das Versprechen entsteht unter dem Druck empfundenen Schams. »Beschämung« lässt offen, ob innere Scham oder sozialer Druck im Vordergrund steht.'
- source_word: ἐπαγγελλόμενος
  choice: verspricht
  rationale: Das Partizip beschreibt das Zusagen eines Gefallens; die finite Wiedergabe ist im Deutschen natürlich und bewahrt den Sinn.
- source_word: φίλῳ
  choice: einem Freund
  rationale: Der Dativ bezeichnet am naheliegendsten den Empfänger des versprochenen Gefallens.
- source_word: ἐκτήσατο
  choice: macht ihn sich ... zum Feind
  rationale: κτάομαι bedeutet »für sich erwerben/gewinnen«. Die idiomatische deutsche Wendung bewahrt sowohl den reflexiven Zug als auch die Ironie des unerwünschten Ergebnisses.
- source_word: ἐχθρόν
  choice: zum Feind
  rationale: Die übliche Bedeutung »Feind« wird ohne Abschwächung wiedergegeben.
- source_word: δωρεάν
  choice: ohne Grund
  rationale: Das Adverb kann »umsonst/vergeblich« oder »ohne Grund« bedeuten. Im Zusammenhang ist »ohne Grund« natürlich; die alternative Nuance wird in der Fußnote bewahrt.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Weisheitssprache. »Mancher« gibt die griechische Existenzformel knapp und idiomatisch wieder; »dadurch« macht den Folgezusammenhang deutlich, ohne eine zusätzliche Begründung einzutragen.
