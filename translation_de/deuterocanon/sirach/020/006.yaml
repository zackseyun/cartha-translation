  source_fidelity: 'Der Haupttext folgt dem erhaltenen hebräischen Wortlaut genau: Die zweimalige partizipiale Aussage מחריש wird idiomatisch durch „schweigt“ wiedergegeben; מֵאֵין מַעֲנֶה bleibt mit „weil es keine Antwort gibt“ sinnvoll offen. „Die rechte Zeit erkennt“ gibt רֹאֶה עֵת als verständliche deutsche Sinnentsprechung wieder und wahrt die im Weisheitskontext naheliegende Angemessenheitsnuance, ohne die griechische Fassung in den Haupttext einzutragen.'
