base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/020/006.yaml
  text: There is one who keeps silent because there is no answer[b][a], and there is one who keeps silent because he sees the right time.
translation:
  language: de
  text: Mancher schweigt, weil es keine Antwort gibt,[a] und mancher schweigt, weil er die rechte Zeit erkennt.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „aus Mangel an einer Antwort“ / „weil er keine Antwort hat“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „weil er die Zeit sieht“. Die griechische Parallele lautet: „Ein weiser Mensch wird bis zur rechten Zeit schweigen, aber ein Schwätzer und ein Tor wird die rechte Zeit überschreiten.“ Die hebräische und die griechische Form dieses Spruchs unterscheiden sich deutlich; der Haupttext folgt dem erhaltenen hebräischen Zeugnis.'
    reason: textual_variant
lexical_decisions:
- source_word: מַחֲרִישׁ
  choice: schweigt
  rationale: Das Partizip von חרש bezeichnet hier das bewusste Unterlassen des Redens. „Schweigt“ ist im Deutschen natürlich und bewahrt den allgemeinen, sprichwortartigen Charakter.
- source_word: מֵאֵין מַעֲנֶה
  choice: weil es keine Antwort gibt
  rationale: Die hebräische Wendung bezeichnet das Fehlen einer Antwort oder Entgegnung. Die Formulierung lässt offen, ob dem Schweigenden selbst eine Antwort fehlt oder ob überhaupt keine Antwort möglich beziehungsweise vorhanden ist.
- source_word: עֵת
  choice: die rechte Zeit
  rationale: עֵת bedeutet „Zeit“ oder „Zeitpunkt“ und bezeichnet im Weisheitskontext häufig den passenden Augenblick. „Die rechte Zeit“ gibt diese Nuance knapp und würdig wieder; die griechische Parallele mit καιρός stützt den Gedanken des angemessenen Zeitpunkts.
- source_word: רֹאֶה עֵת
  choice: die rechte Zeit erkennt
  rationale: Wörtlich steht „Zeit sieht“. Das deutsche „erkennt“ vermittelt die gemeinte Wahrnehmung des passenden Augenblicks natürlicher, ohne den Sinn weiter aufzulösen.
theological_decisions:
- issue: Deutlich abweichende hebräische und griechische Überlieferungsform
  choice: Der Haupttext folgt dem erhaltenen hebräischen Wortlaut.
  alternative: 'Dem griechischen Spruch folgen: Der Weise schweigt bis zur rechten Zeit, während Schwätzer und Tor sie überschreiten.'
  rationale: Der angegebene hebräische Text ist die primäre und mit hoher Zuverlässigkeit belegte Ausgangsgrundlage. Die griechische Fassung wird nicht in den Haupttext eingemischt, sondern als eigenständige Textvariante dokumentiert, sodass die Spannung zwischen beiden Überlieferungsformen erhalten bleibt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch in knapper, würdiger Spruchform. „Mancher … und mancher …“ bildet die parallele hebräische Konstruktion idiomatisch ab. „Die rechte Zeit“ wahrt den weisheitlichen Ton, ohne altertümlich zu wirken.
