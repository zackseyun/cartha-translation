  text: A wise man will advance himself by his words[a], and a prudent man will please great men.
translation:
  language: de
  text: Ein Weiser wird sich durch seine Worte voranbringen, und ein verständiger Mann wird den Mächtigen[a] gefallen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: den Großen, den Vornehmen oder den Herrschenden. Das griechische Wort bezeichnet allgemein gesellschaftlich herausragende oder einflussreiche Menschen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σοφὸς
  choice: ein Weiser
  rationale: Im Kontext der Weisheitsliteratur bezeichnet σοφός einen Menschen mit praktischer Weisheit; „ein Weiser“ ist die natürliche und würdige deutsche Entsprechung.
- source_word: ἐν λόγοις
  choice: durch seine Worte
  rationale: 'ἐν hat hier instrumentale Bedeutung: Die Worte beziehungsweise die Rede sind das Mittel, durch das der Weise vorankommt.'
- source_word: προάξει ἑαυτόν
  choice: wird sich … voranbringen
  rationale: προάγω bedeutet „vorwärtsbringen“ oder „voranführen“; mit dem Reflexivpronomen ἑαυτόν ist gemeint, dass der Weise sich selbst voranbringt. Die Wiedergabe vermeidet den modernen, möglicherweise eigennützigen Beiklang von „sich selbst vermarkten“.
- source_word: ἄνθρωπος φρόνιμος
  choice: ein verständiger Mann
  rationale: φρόνιμος bezeichnet praktische Einsicht und vernünftiges Urteilsvermögen. „Verständig“ klingt im heutigen Deutsch natürlicher als „klug“ oder „umsichtig“ und bewahrt den Weisheitsbezug; ἄνθρωπος wird hier entsprechend der grammatisch männlichen Einzelfigur mit „Mann“ wiedergegeben.
- source_word: ἀρέσει
  choice: wird … gefallen
  rationale: ἀρέσκω bedeutet unmittelbar „gefallen“ oder „wohlgefällig sein“. Die direkte Wiedergabe bewahrt die Aussage, ohne sie als bloßes Erlangen von Gunst umzudeuten.
- source_word: μεγιστᾶσιν
  choice: den Mächtigen
  rationale: Das Wort bezeichnet gesellschaftlich herausragende oder einflussreiche Personen. „Die Mächtigen“ ist im modernen Deutsch verständlich und gibt den sozialen Rang beziehungsweise Einfluss wieder, ohne ein bestimmtes Amt vorauszusetzen.
