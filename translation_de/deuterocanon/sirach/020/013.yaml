base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/020/013.yaml
  text: A wise man speaks little for himself[c][b][a], but the goodness of fools pours out wisdom.
translation:
  language: de
  text: Ein Weiser spricht mit wenigen Worten für sich selbst[b][c], doch die Gabe der Toren schüttet Weisheit aus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Griechisch: „Die Gabe eines Toren wird dir nichts nützen, denn statt eines Auges hat er viele.“ Der hebräische und der griechische Text weichen in diesem Vers erheblich voneinander ab. Der Haupttext folgt dem erhaltenen hebräischen Zeugen.'
    reason: textual_variant
  - marker: b
    text: 'Oder: „Ein Weiser spricht kurz.“'
    reason: lexical_alternative
  - marker: c
    text: 'Der Schlusssatz kann ironisch gemeint sein: Toren schütten Worte aus, als würden sie Weisheit verbreiten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָכָם
  choice: ein Weiser
  rationale: Das substantivisch gebrauchte maskuline Singularadjektiv bezeichnet sprichwörtlich einen weisen Menschen; „ein Weiser“ ist knapp und würdevoll.
- source_word: בִּמְעַט דִבֶּר
  choice: spricht mit wenigen Worten
  rationale: Gibt die Aussage über sparsames beziehungsweise kurzes Reden natürlich wieder und bewahrt die sprichwörtliche Gegenwartsform.
- source_word: נַפְשׁוֹ
  choice: für sich selbst
  rationale: נפשׁ ist hier wahrscheinlich reflexiv oder idiomatisch gebraucht; die Wendung lässt Selbstbezug oder Eigeninteresse anklingen, ohne „Seele“ einzutragen.
- source_word: וְטוֹבַת
  choice: doch die Gabe
  rationale: טובה kann Gutes, Wohltat oder Gabe bedeuten. „Gabe“ ist im Deutschen konkret und wird durch das griechische δόσις gestützt, bleibt wegen der erheblichen Textabweichung jedoch unsicher.
- source_word: כְּסִילִים
  choice: der Toren
  rationale: Wiedergabe der Genitivbeziehung; „Toren“ entspricht dem gehobenen, aber allgemein verständlichen Weisheitswortschatz.
- source_word: יִשְׁפוֹךְ חָכְמָה
  choice: schüttet Weisheit aus
  rationale: Bewahrt das kräftige Bild des Ausgießens. Die Formulierung kann wörtlich oder ironisch verstanden werden und wird daher nicht erklärend aufgelöst.
- source_word: δόσις ἄφρονος οὐ λυσιτελήσει σοι
  choice: Die Gabe eines Toren wird dir nichts nützen
  rationale: Natürliche und genaue Wiedergabe des stark abweichenden griechischen Paralleltextes für die Variantenfußnote.
theological_decisions:
- issue: Mögliche Ironie in der Schlusszeile
  choice: Die bildhafte Aussage bleibt im Haupttext unaufgelöst.
  alternative: „Toren schütten Worte aus, als wären sie Weisheit.“
  rationale: Der hebräische Wortlaut nennt ausdrücklich „Weisheit“; eine eindeutige Ironisierung würde eine mögliche Deutung in den Text selbst verlagern.
translation_notes:
  register: Modernes Standarddeutsch mit knapper, würdevoller Spruchweisheitsform. „Ein Weiser“ und „Toren“ halten den traditionellen Weisheitswortschatz verständlich; die erhebliche hebräisch-griechische Textdifferenz wird transparent in einer Fußnote dokumentiert.
