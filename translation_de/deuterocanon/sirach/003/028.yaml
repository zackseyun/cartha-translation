  text: Do not hurry to heal the wound of a scoffer[a], for there is no healing for it, for they were planted from an evil planting.
translation:
  language: de
  text: Beeile dich nicht, die Wunde eines Spötters zu heilen[a]; denn für sie gibt es keine Heilung, denn sie sind aus einer bösen Pflanzung hervorgegangen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Parallele lautet: „Denn eine Pflanze der Bosheit hat in ihm Wurzeln geschlagen.“ Der hebräische Schlusssatz ist textlich schwierig und weist eine Pluralform auf.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תָּרוּץ
  choice: Beeile dich nicht
  rationale: רוץ bedeutet wörtlich „laufen“, bezeichnet hier aber idiomatisch übereiltes Handeln. Die Formulierung ist im Deutschen natürlich und bewahrt den mahnenden Ton.
- source_word: לְרַפְּאוֹת מַכַּת
  choice: die Wunde … zu heilen
  rationale: רפא bezeichnet „heilen“, während מכה je nach Zusammenhang Schlag, Verletzung oder Wunde bedeuten kann. Zusammen ergibt sich ein klares medizinisches Bild.
- source_word: לֵץ
  choice: Spötter
  rationale: לץ bezeichnet in der Weisheitsliteratur einen verächtlichen, überheblichen Menschen, der sich der Zurechtweisung widersetzt. „Spötter“ ist dafür die geläufige prägnante Entsprechung.
- source_word: אֵין לָהּ רְפוּאָה
  choice: für sie gibt es keine Heilung
  rationale: Das feminine Pronomen bezieht sich grammatisch auf „Wunde“. „Heilung“ wahrt zudem die Wortverbindung mit dem vorangehenden Verb „heilen“.
- source_word: מִנֶּטַע רַע
  choice: aus einer bösen Pflanzung
  rationale: נטע kann eine Pflanzung oder etwas Gepflanztes bezeichnen. Die Übersetzung erhält das botanische Herkunftsbild, ohne den schwierigen Text zu präzisieren.
- source_word: נִטְעוֹ
  choice: sie … gepflanzt wurden
  rationale: Die überlieferte hebräische Form ist pluralisch und passt syntaktisch nur schwer zu den vorhergehenden Singulargrößen. Der Plural bleibt im Haupttext sichtbar, statt stillschweigend angeglichen zu werden.
theological_decisions:
- issue: Textliche Spannung zwischen dem hebräischen Schluss und der griechischen Parallele
  choice: 'Der Haupttext folgt der überlieferten hebräischen Pluralform: „sie … gepflanzt wurden“.'
  alternative: „Denn eine Pflanze der Bosheit hat in ihm Wurzeln geschlagen.“
  rationale: Dem vorhandenen hebräischen Text wird Vorrang eingeräumt, auch wenn sein Schluss grammatisch und inhaltlich schwierig ist. Die glattere griechische Lesart wird in der Fußnote dokumentiert, damit die echte Überlieferungsspannung erhalten bleibt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung „heilen/Heilung“ bildet die hebräische Wortverbindung ab; die ungewöhnliche Schlussformulierung bewahrt bewusst die textliche Schwierigkeit.
