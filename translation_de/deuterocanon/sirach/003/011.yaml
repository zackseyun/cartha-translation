  yaml_path: translation/deuterocanon/sirach/003/011.yaml
  text: For a man's honor is the honor of his father, and one who dishonors his mother multiplies sin.
translation:
  language: de
  text: Die Ehre eines Mannes ist die Ehre seines Vaters, und wer seine Mutter entehrt[a], häuft Sünde an.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wer seine Mutter verflucht“. Das hebräische Verb kann ausdrücklich „verfluchen“ bedeuten; der Gegensatz von Ehre und Schande sowie die griechische Überlieferung stützen hier jedoch den weiteren Sinn „entehren“.'
    reason: lexical_alternative
  - marker: b
    text: 'Die griechische Parallele lautet: „Denn die Herrlichkeit eines Menschen kommt von der Ehre seines Vaters, und eine Mutter in Schande ist ihren Kindern ein Vorwurf.“ Damit bietet sie besonders in der zweiten Vershälfte eine abweichende Fassung gegenüber dem erhaltenen hebräischen Text.'
    reason: alternative_reading
lexical_decisions:
- source_word: כְּבוֹד אִישׁ כִּבּוּד אָבִיו
  choice: Die Ehre eines Mannes liegt darin, seinen Vater zu ehren
  rationale: Die hebräische Zeile ist ohne Kopulaverb knapp formuliert. כְּבוֹד bezeichnet die Ehre des Mannes, während כִּבּוּד als Verbalnomen das Ehren des Vaters ausdrücken kann. Die deutsche Formulierung gibt diesen Zusammenhang natürlich wieder, ohne die Ehre lediglich als gesellschaftlichen Rang zu verstehen.
- source_word: אִישׁ
  choice: eines Mannes
  rationale: Das maskuline Singularwort wird formgetreu wiedergegeben und hat hier sprichwörtlich-repräsentative Funktion.
- source_word: מְקַלֵּל אִמּוֹ
  choice: wer seine Mutter entehrt
  rationale: קלל im Piel kann konkret „verfluchen“ oder allgemeiner „geringschätzen, mit Verachtung behandeln“ bedeuten. „Entehrt“ wahrt den Gegensatz zum Ehren des Vaters und stimmt mit dem Ehr-/Schandmotiv der griechischen Parallele überein; die engere Bedeutung wird in einer Fußnote genannt.
- source_word: וּמַרְבֶּה חֵטְא
  choice: häuft Sünde an
  rationale: Die Wendung beschreibt ein Vermehren der Sünde. „Häuft Sünde an“ ist im Deutschen idiomatisch und bewahrt die aktive Steigerung.
theological_decisions:
- issue: Geschlecht des sprichwörtlichen Subjekts
  choice: eines Mannes
  alternative: eines Menschen
  rationale: אִישׁ ist maskuliner Singular. Die Übersetzung bewahrt die Form des Ausgangstextes, ohne die sprichwörtliche Anwendbarkeit einzuschränken.
- issue: Bedeutung von מְקַלֵּל im Zusammenhang mit der Elternpflicht
  choice: entehrt
  alternative: verflucht
  rationale: Der unmittelbare Gegensatz zwischen dem Ehren des Vaters und dem Verhalten gegenüber der Mutter sowie die griechische Parallele stützen den weiteren Sinn „entehren“. Da das hebräische Verb auch ausdrücklich „verfluchen“ bedeuten kann, bleibt diese Möglichkeit in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Spruchform wird durch zwei parallele Hauptaussagen bewahrt; „häuft Sünde an“ ist verständlich und zugleich gehoben genug für einen Weisheitstext.
