base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/003/002.yaml
  text: For Yahweh honored the father above the children[b][a], and he established the mother's authority over her children.
translation:
  language: de
  text: Denn der HERR hat dem Vater gegenüber den Kindern Ehre verliehen und das Recht der Mutter[a] über ihre Kinder[b] bekräftigt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Autorität der Mutter“ oder „der Anspruch der Mutter“. Das hebräische Wort kann „Recht“, „Rechtsanspruch“, „Urteil“ oder eine rechtlich geregelte Stellung bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: Die griechische Überlieferung hat im zweiten Satz „über die Söhne“, während der hebräische Text „über ihre Kinder“ lautet. Die Übersetzung folgt hier dem Hebräischen.
    reason: textual_variant
lexical_decisions:
- source_word: יְהֹוָה
  choice: der HERR
  rationale: Wiedergabe des Gottesnamens in der ehrfürchtigen jüdischen Lesetradition; sie entspricht zugleich dem griechischen Κύριος.
- source_word: כִּבֵּד
  choice: hat … Ehre verliehen
  rationale: Das Piel von כבד bedeutet „ehren, Ehre geben“. Die Formulierung lässt Gott als denjenigen erkennen, der dem Vater seinen Ehrenrang zuweist.
- source_word: לִפְנֵי הַבָּנִים
  choice: vor den Kindern
  rationale: Bewahrt das Bild des hebräischen לִפְנֵי („vor, im Angesicht von“) und lässt dessen mögliche Bedeutung als Vorrang oder öffentlich zuerkannte Stellung offen.
- source_word: מִשְׁפַּט הָאֵם
  choice: den Anspruch der Mutter
  rationale: מִשְׁפָּט bezeichnet hier wahrscheinlich einen rechtmäßigen Anspruch beziehungsweise eine verbindliche Stellung. „Anspruch“ bewahrt die rechtliche Färbung deutlicher als das stärker auslegende „Autorität“.
- source_word: קִיֵּם
  choice: bekräftigt
  rationale: Das Verb bezeichnet das Festmachen, Bestätigen oder Aufrechterhalten; „bekräftigt“ gibt diese validierende Aussage natürlich wieder.
- source_word: עַל יְלָדֶיהָ
  choice: gegenüber ihren Kindern
  rationale: עַל beschreibt hier die relationale Geltung des Anspruchs. „Gegenüber“ ist im Deutschen idiomatisch und vermeidet, bereits im Haupttext ausschließlich eine Herrschaftsbeziehung festzulegen.
theological_decisions:
- issue: Ehrenstellung des Vaters
  choice: dem Vater vor den Kindern Ehre verliehen
  alternative: den Vater über die Kinder erhoben
  rationale: Die gewählte Fassung bewahrt die räumlich-soziale Metapher von לִפְנֵי und behauptet nicht eindeutiger als der hebräische Wortlaut eine hierarchische Überordnung.
- issue: Bedeutung von מִשְׁפַּט הָאֵם
  choice: Anspruch der Mutter
  alternative: Autorität der Mutter / Recht der Mutter / Urteil der Mutter
  rationale: „Anspruch“ erhält die rechtlich-relationalen Bedeutungsanteile von מִשְׁפָּט, ohne den Ausdruck auf institutionelle Autorität oder richterliches Urteilen zu verengen.
- issue: Geschlechtsspezifische Parallelität
  choice: Vater … Mutter … ihre Kinder
  alternative: Eltern … Kinder
  rationale: Der hebräische Text nennt Vater und Mutter ausdrücklich und parallel; diese Unterscheidung wird beibehalten, statt sie zu einem geschlechtsneutralen Sammelbegriff zusammenzuziehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt spruchhaft und parallel. „Vor den Kindern“ und „Anspruch“ bewahren die Mehrdeutigkeit des hebräischen Wortlauts; die Fußnoten erläutern die wichtigsten lexikalischen und textlichen Alternativen.
