translation:
  language: de
  text: Ein schweres Herz wird am Ende zugrunde gehen[b][a], und wer die guten Dinge liebt, wird von ihnen geleitet werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Parallele lautet: „Ein hartes Herz wird zuletzt geplagt werden.“ Das Hebräische hat wörtlich: „Ein schweres Herz wird an seinem Ende übel riechen.“'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „wird faul werden“. Das hebräische Verb bedeutet wörtlich „stinken“ oder „faul werden“ und beschreibt hier bildhaft einen verhängnisvollen Ausgang.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵב כָּבֵד
  choice: ein schweres Herz
  rationale: Die wörtliche hebräische Wendung bleibt erhalten. Sie kann einen moralisch oder geistlich belasteten beziehungsweise ungeordneten inneren Zustand bezeichnen und ist nicht vorschnell auf Traurigkeit oder Verstocktheit einzuengen.
- source_word: תִּבְאַשׁ
  choice: wird zugrunde gehen
  rationale: Das Verb bedeutet wörtlich „stinken, faul werden“. Zusammen mit „am Ende“ bezeichnet es hier bildhaft einen verhängnisvollen Ausgang; die wörtlichere Möglichkeit wird in einer Fußnote bewahrt.
- source_word: אַחֲרִיתוֹ
  choice: am Ende
  rationale: Die Form bezeichnet Ende, Ausgang oder spätes Geschick. „Am Ende“ ist natürliches Deutsch und lässt offen, ob besonders das Ende des Herzenszustands, der Person oder deren Weg gemeint ist.
- source_word: וְאֹוהֵב טוֹבוֹת
  choice: und wer das Gute liebt
  rationale: Der substantivierte Plural טוֹבוֹת ist weit gefasst und kann Gutes, gute Dinge, Wohltaten oder Annehmlichkeiten bezeichnen. „Das Gute“ erhält diese Offenheit in würdigem, idiomatischem Deutsch.
- source_word: יִנְהַג בָּהֶם
  choice: wird sich davon leiten lassen
  rationale: נהג bedeutet führen, leiten oder treiben. Die reflexive deutsche Form gibt verständlich wieder, dass das Geliebte den Lebensweg der Person bestimmt, ohne unnötig einen ausdrücklich grammatischen Passivsatz anzunehmen.
theological_decisions:
- issue: Hebräisches „schweres Herz“ gegenüber griechischem „hartes Herz“
  choice: Im Haupttext steht „ein schweres Herz“ nach dem erhaltenen hebräischen Zeugen.
  alternative: „ein hartes Herz“ nach der griechischen Parallele
  rationale: Das vorhandene Hebräisch ist die primäre Grundlage. Die griechische Fassung kann auf einer abweichenden Vorlage oder einer deutenden Wiedergabe beruhen; sie wird deshalb transparent in der Fußnote genannt, ohne die Spannung aufzulösen.
- issue: Generische Aussage über eine Person
  choice: „wer das Gute liebt“
  alternative: „der das Gute liebt“ beziehungsweise eine ausdrücklich männliche Form
  rationale: Die sprichwörtliche Aussage gilt allgemein. Die deutsche Wer-Konstruktion gibt dies natürlich wieder und fügt keine geschlechtliche Einschränkung hinzu.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Spruchweisheitsstil. Die ungewöhnliche hebräische Metapher „schweres Herz“ bleibt im Haupttext erhalten; die drastische Geruchs- beziehungsweise Fäulnisbildlichkeit wird wegen ihrer idiomatischen Funktion im Haupttext sinngemäß und in den Fußnoten wörtlicher wiedergegeben.
