translation:
  language: de
  text: Denn Gottes Erweise des Erbarmens sind zahlreich, und den Demütigen enthüllt er sein Geheimnis[a].[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „seinen vertraulichen Ratschluss“. Das hebräische Wort kann ein im Vertrauen mitgeteiltes Geheimnis oder einen vertraulichen Rat bezeichnen, nicht nur verborgene Information.'
    reason: lexical_alternative
  - marker: b
    text: 'Die griechische Parallelüberlieferung lautet: „Denn groß ist die Herrschaft des Herrn, und von den Demütigen wird er verherrlicht.“ Der hebräische Text weicht hier erheblich vom griechischen ab.'
    reason: alternative_reading
lexical_decisions:
- source_word: רַבִּים רַחֲמֵי אֱלֹהִים
  choice: Gottes Erweise des Erbarmens sind zahlreich
  rationale: Die Formulierung wahrt den hebräischen Plural und gibt רַבִּים prädikativ mit „zahlreich“ wieder. „Erweise des Erbarmens“ klingt im heutigen Deutsch natürlicher als das wörtlichere „Erbarmungen“ und lässt konkrete, wiederholte Zuwendungen Gottes erkennen.
- source_word: וְלַעֲנָוִים
  choice: und den Demütigen
  rationale: „Die Demütigen“ erfasst hier die ethische und soziale Bedeutung von ענוים in der Weisheitsliteratur, ohne sie auf bloße Sanftmut zu verengen.
- source_word: יְגַלֶּה
  choice: enthüllt er
  rationale: „Enthüllen“ gibt die Offenlegung von etwas zuvor Verborgenem prägnant wieder und passt idiomatisch zum Objekt „Geheimnis“.
- source_word: סוֹדוֹ
  choice: sein Geheimnis
  rationale: סוד bezeichnet ein Geheimnis, kann aber auch vertraulichen Rat oder einen im vertrauten Kreis mitgeteilten Ratschluss meinen. Die direkte Wiedergabe steht im Haupttext; die weitere Bedeutungsbreite wird in einer Fußnote erhalten.
theological_decisions:
- issue: Deutliche Abweichung zwischen dem erhaltenen hebräischen Text und der griechischen Parallelüberlieferung
  choice: 'Der Haupttext folgt dem Hebräischen: Gottes Erweise des Erbarmens sind zahlreich, und den Demütigen enthüllt er sein Geheimnis.'
  alternative: 'Die griechische Parallelüberlieferung lautet: „Denn groß ist die Herrschaft des Herrn, und von den Demütigen wird er verherrlicht.“'
  rationale: Da ein zuverlässiger hebräischer Zeuge vorliegt, bildet er die Grundlage des Haupttexts. Die erheblich abweichende griechische Fassung betrifft die Aussage des ganzen Verses und wird deshalb als echte Textalternative in einer Fußnote dokumentiert, nicht stillschweigend harmonisiert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Erweise des Erbarmens“ vermeidet das heute ungebräuchliche „Erbarmungen“, bewahrt aber den konkreten Plural des Hebräischen. Die Satzstellung bleibt klar und leicht verständlich; „enthüllt“ hält den Bildgehalt des hebräischen Verbs fest.
