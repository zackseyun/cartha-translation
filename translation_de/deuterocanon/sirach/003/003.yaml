base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/003/003.yaml
  text: Whoever honors his father makes atonement for his sins[b][a], and whoever honors his mother stores up treasure.
translation:
  language: de
  text: Wer seinen Vater ehrt, dessen Sünde wird gesühnt[a]; und wer seine Mutter ehrt, legt einen Schatz zurück[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich steht im Hebräischen „seine Sünde“ im Singular; dieser kann kollektiv gemeint sein. Die griechische Parallele liest „Sünden“.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „sammelt einen Schatz an“. Gemeint ist das Bild eines wie Reichtum für später verwahrten Wertes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְכַבֵּד
  choice: ehrt
  rationale: Das Piel-Partizip von כבד bezeichnet hier, Vater oder Mutter die gebührende Ehre zu erweisen. „Ehrt“ ist im Deutschen natürlich und bewahrt die ethische Stärke besser als das schwächere „respektiert“.
- source_word: אָב
  choice: seinen Vater
  rationale: Der hebräische Text nennt ausdrücklich den Vater im Singular; die possessive Wiedergabe entspricht dem Suffix in חַטָּאתוֹ und dem Parallelismus mit „seine Mutter“.
- source_word: תְּכֻפַּר
  choice: wird gesühnt
  rationale: Die passive Form von כפר wird formal als Sühnevorgang wiedergegeben. Diese Fassung folgt dem hebräischen Satzbau enger als eine aktive Umschreibung und wird durch das griechische ἐξιλάσεται inhaltlich gestützt.
- source_word: חַטָּאתוֹ
  choice: dessen Sünde
  rationale: Der hebräische Singular wird im Haupttext bewahrt. Er kann kollektiv gemeint sein; die griechische Parallele hat entsprechend den Plural „Sünden“.
- source_word: וְגוֹנֵז אוֹצָר
  choice: legt einen Schatz zurück
  rationale: גנז beschreibt das Verwahren oder Zurücklegen, אוצר einen Schatz. Die Formulierung erhält das Bild eines für später aufbewahrten Wertes, ohne die negative Nebenbedeutung von „horten“.
- source_word: אִמּוֹ
  choice: seine Mutter
  rationale: Das ausdrückliche Possessivsuffix und der Parallelismus zu „seinen Vater“ werden beibehalten.
theological_decisions:
- issue: Sühneaussage im Weisheitskontext
  choice: Die ausdrückliche Sühneter­minologie wird mit „dessen Sünde wird gesühnt“ bewahrt.
  alternative: „dem werden seine Sünden vergeben“ oder „dessen Sünde wird bedeckt“
  rationale: Hebräisch כפר und griechisch ἐξιλάσεται tragen eine klare sühnende beziehungsweise entsühnende Bedeutung. Die Übersetzung soll diese theologische Spannung nicht zu einem bloß allgemeinen moralischen Nutzen abschwächen und zugleich keine spätere Lehrsystematik eintragen.
- issue: Singular oder kollektiver Plural bei חַטָּאתוֹ
  choice: Im Haupttext steht der hebräische Singular „Sünde“; eine Fußnote weist auf den möglichen kollektiven Sinn und den griechischen Plural hin.
  alternative: „dessen Sünden werden gesühnt“
  rationale: So bleibt die konkrete Form des hoch eingestuften hebräischen Ausgangstextes sichtbar, während die durch die griechische Parallele gestützte kollektive Deutung offengehalten wird.
- issue: Geschlechtsspezifische Bezeichnungen der Eltern
  choice: „Vater“ und „Mutter“ werden einzeln genannt.
  alternative: „Eltern“
  rationale: Der Ausgangstext unterscheidet ausdrücklich Vater und Mutter; diese Parallelstruktur ist für den Vers wesentlich.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der passive Satzbau bewahrt die Zurückhaltung des Hebräischen hinsichtlich des Handelnden der Sühne; die knappe Parallelstruktur des Weisheitsspruchs bleibt erhalten.
