  naturalness: »Die Gerechtigkeit eines Vaters« ist idiomatisches, würdiges Deutsch. »Sie wird an die Stelle von Sünden gepflanzt« bewahrt das ungewöhnliche Bild, ist aber syntaktisch klarer als »und anstelle von Sünden wird sie eingepflanzt«.
  terminology: »Gerechtigkeit«, »ausgelöscht«, »Sünden« und »an die Stelle von« geben die hebräischen Begriffe angemessen wieder. Die Fußnote sollte die griechische Lesart präzise als abweichende Überlieferung benennen und nicht »gegenüber einem Vater« als deren zwingenden Sinn festlegen, da πατρός ebenfalls genitivisch offen ist.
