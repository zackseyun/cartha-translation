  text: A father's righteousness will not be wiped away[a], and in place of sins it will be planted.
translation:
  language: de
  text: Die Gerechtigkeit eines Vaters wird nicht ausgelöscht[a], und an die Stelle von Sünden wird sie gepflanzt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die hebräische Wendung kann im Zusammenhang auch »Gerechtigkeit gegenüber dem Vater« bedeuten. Griechisch: »Denn die Mildtätigkeit eines Vaters wird nicht vergessen werden, und anstelle von Sünden wird sie für dich aufgebaut werden.« Die griechische Fassung weicht besonders bei »Mildtätigkeit«, »nicht vergessen«, »für dich« und »aufgebaut« vom Hebräischen ab.'
    reason: alternative_reading
lexical_decisions:
- source_word: צִדְקַת אָב
  choice: die Gerechtigkeit gegenüber dem Vater
  rationale: Die hebräische Genitivverbindung kann formal »Gerechtigkeit eines Vaters« bedeuten, doch im unmittelbaren Zusammenhang ist die dem Vater erwiesene rechte Fürsorge wahrscheinlich. »Gegenüber dem Vater« gibt diese Kontextbedeutung wieder, ohne sie auf Almosen einzuengen.
- source_word: לֹא תִּמָּחֶה
  choice: wird nicht ausgelöscht
  rationale: Das Nifal von מחה bezeichnet das Auslöschen oder Tilgen. »Ausgelöscht« bewahrt das Bild eines Eintrags oder Andenkens, das nicht beseitigt wird.
- source_word: וּתְמוּר
  choice: und anstelle von
  rationale: תמור bezeichnet Austausch oder Stellvertretung. »Anstelle von« erhält diese starke Zuordnung, ohne einen bestimmten dogmatischen Mechanismus festzulegen.
- source_word: חַטָּאת
  choice: Sünden
  rationale: Der Weisheitskontext und der griechische Plural ἁμαρτιῶν sprechen für moralische Verfehlungen und gegen die kultische Bedeutung »Sündopfer«.
- source_word: הִיא תְּנַתֵּעַ
  choice: wird sie eingepflanzt
  rationale: Die hebräische Form wird von נטע, »pflanzen«, her verstanden. Das Pronomen nimmt die Gerechtigkeit wieder auf; ein Dativ wie »für dich« steht im vorliegenden Hebräisch nicht und wird daher nur in der Fußnote zur griechischen Lesart genannt.
theological_decisions:
- issue: Ob die dem Vater erwiesene Gerechtigkeit Sünden aufwiegt oder sühnt
  choice: Die Austauschformulierung »anstelle von Sünden« bleibt stehen, ohne ihre Wirkungsweise dogmatisch zu bestimmen.
  alternative: Die Tat wird trotz der Sünden in Erinnerung behalten; sie sühnt Sünden; oder sie bewirkt nach der Sünde Wiederherstellung.
  rationale: Der Vers spricht in der starken Vergeltungs- und Ausgleichssprache der Weisheitstradition. Eine Abschwächung zu bloßem Erinnern wäre ebenso deutend wie die Festlegung auf eine ausgearbeitete Sühne- oder Verdienstlehre.
- issue: Zuordnung von צִדְקַת אָב
  choice: Gerechtigkeit gegenüber dem Vater
  alternative: Gerechtigkeit eines Vaters
  rationale: Der Status constructus ist sprachlich mehrdeutig. Der Zusammenhang mit der Ehrung und Versorgung der Eltern legt den objektiven Bezug nahe; die Fußnote dokumentiert die mögliche formale Alternative und die abweichende griechische Fassung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Eingepflanzt« bewahrt bewusst das ungewöhnliche hebräische Bild. Die Satzstellung macht den Rückbezug von »sie« auf »Gerechtigkeit« deutlich.
