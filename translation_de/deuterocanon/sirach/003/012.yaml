  text: My son[a], be strong in honoring your father, and do not forsake him all the days of your life.
translation:
  language: de
  text: Mein Sohn[a], halte unbeirrt daran fest, deinen Vater zu ehren, und verlass ihn nicht, solange du lebst.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Griechisch: „Kind, unterstütze deinen Vater im Alter und betrübe ihn nicht, solange er lebt.“'
    reason: Bedeutende abweichende Lesart der alten griechischen Parallelüberlieferung.
lexical_decisions:
- source_word: בְּנִי
  choice: Mein Sohn
  rationale: Die Anrede mit בן und Suffix der 1. Person Singular ist maskulin und wörtlich „mein Sohn“. Sie bewahrt den persönlichen Lehrton der hebräischen Weisheitsliteratur.
- source_word: הִתְחַזֵּק בִּכִבּוּד
  choice: halte unbeirrt daran fest, … zu ehren
  rationale: Der Hitpael-Imperativ von חזק bezeichnet ein Sich-Stärken bzw. standhaftes Verhalten; zusammen mit בִּכִבּוּד wird die beharrliche Praxis des Ehrens ausgedrückt. Die idiomatische deutsche Wiedergabe erhält diese Kraft besser als das missverständliche „sei stark im Ehren“.
- source_word: אָבִיךָ
  choice: deinen Vater
  rationale: Direkte Wiedergabe des Substantivs mit Possessivsuffix der 2. Person maskulin Singular.
- source_word: וְאַל תַּעַזְבֵהוּ
  choice: und verlass ihn nicht
  rationale: עזב kann „verlassen“, „zurücklassen“ oder „im Stich lassen“ bedeuten. „Verlass ihn nicht“ wahrt die Breite und den moralischen Ernst des hebräischen Verbots, ohne die Bedeutung unnötig zu verschärfen.
- source_word: כָּל יְמֵי חַיֶּיךָ
  choice: solange du lebst
  rationale: Natürliche moderne Wiedergabe der hebräischen Zeitformel „alle Tage deines Lebens“; der Sinn lebenslanger Dauer bleibt vollständig erhalten.
theological_decisions:
- issue: Abweichung zwischen dem erhaltenen hebräischen Text und der griechischen Parallelüberlieferung
  choice: 'Der Haupttext folgt dem Hebräischen: beharrlich den Vater ehren und ihn lebenslang nicht verlassen.'
  alternative: Die griechische Überlieferung fordert dazu auf, den Vater im Alter zu unterstützen und ihn zu seinen Lebzeiten nicht zu betrüben.
  rationale: Wo ein belastbarer hebräischer Sirachtext erhalten ist, hat er für den Haupttext Vorrang. Die deutlich abweichende alte griechische Lesart wird in einer Fußnote bewahrt, ohne beide Fassungen stillschweigend miteinander zu harmonisieren.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Halte unbeirrt daran fest“ vermittelt die hebräische Vorstellung von Festigkeit idiomatisch; „solange du lebst“ gibt die lebenslange Dauer natürlich wieder. Die Fußnote erhält die genuine Spannung zwischen hebräischer und griechischer Überlieferung.
