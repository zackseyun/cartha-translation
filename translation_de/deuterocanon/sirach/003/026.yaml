translation:
  language: de
  text: Die Schmerzen eines schweren Herzens nehmen zu,[a] und wer sich zügellos verhält,[b] häuft Schuld auf Schuld.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Parallelüberlieferung lautet: »Ein hartes Herz wird am Ende Leid erfahren« und »Ein hartes Herz wird am Ende schwer belastet werden.«'
    reason: alternative_reading
  - marker: b
    text: Das hier zugrunde liegende hebräische Wort ist schwer zu deuten. Es kann auch wildes oder leichtsinniges Handeln, Selbsttäuschung oder prahlerische Überheblichkeit bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵב כָּבֵד
  choice: ein schweres Herz
  rationale: Die hebräische Fassung bietet wörtlich »ein schweres Herz«. Das Bild kann Belastung, Unempfänglichkeit oder Starrsinn andeuten; die griechische Überlieferung deutet es als »hartes Herz«. Der Haupttext bewahrt das hebräische Bild.
- source_word: יִרְבּוּ מַכְאֹבָיו
  choice: vermehrt seine Schmerzen
  rationale: Das Verb bezeichnet Mehrwerden bzw. Zunehmen. Mit »vermehrt« bleibt die enge Verbindung zu »seine Schmerzen« erhalten, ohne die Aussage auf körperliches oder seelisches Leiden einzuengen.
- source_word: וּמִתְהוֹלֵל
  choice: wer sich zügellos verhält
  rationale: Die schwierige Form kann wildes, töricht-selbsttäuschendes, prahlerisches oder rücksichtsloses Verhalten bezeichnen. »Sich zügellos verhalten« gibt den moralischen Sinn wieder, ohne eine der unsicheren Nuancen allein festzuschreiben.
- source_word: מוֹסִיף
  choice: häuft
  rationale: Wörtlich steht »fügt hinzu«. In Verbindung mit »Schuld auf Schuld« bringt »häuft« die fortgesetzte Anhäufung natürlich und prägnant zum Ausdruck.
- source_word: עָוֹן עַל עָוֹן
  choice: Schuld auf Schuld
  rationale: עָוֹן kann sowohl Verfehlung als auch die daraus erwachsende Schuld bezeichnen. »Schuld auf Schuld« bewahrt diese Spannung und die steigernde Wiederholung mit עַל.
theological_decisions:
- issue: Abweichung zwischen hebräischer und griechischer Überlieferung im ersten Satzteil
  choice: Im Haupttext wird die erhaltene hebräische Lesart »Ein schweres Herz vermehrt seine Schmerzen« wiedergegeben.
  alternative: 'Die griechische Parallelüberlieferung lautet sinngemäß: »Ein hartes Herz wird am Ende Leid erfahren« und »Ein hartes Herz wird am Ende schwer belastet werden.«'
  rationale: Wo der hebräische Sirachtext erhalten und belastbar ist, bildet er die Hauptgrundlage. Da die griechische Fassung hier erheblich abweicht und offenbar eine andere oder erweiterte Überlieferung bezeugt, wird sie nicht in den Haupttext eingemischt, sondern in einer Fußnote dokumentiert.
- issue: Bedeutung von עָוֹן
  choice: Schuld
  alternative: Sünde; Verfehlung; Unrecht
  rationale: Der Ausdruck kann Tat und Schuldfolge umfassen. »Schuld« lässt diese moralisch-theologische Mehrdeutigkeit offen und vermeidet eine unnötige Festlegung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das konkrete hebräische Bild vom »schweren Herzen« bleibt erhalten. »Zügellos« ist allgemein verständlich und wahrt die Unbestimmtheit der schwierigen hebräischen Form; die wichtigsten Bedeutungsalternativen stehen in der Fußnote.
