  text: My son[a], honor your father in word and deed, so that all blessings may come upon you.
translation:
  language: de
  text: Mein Sohn, ehre deinen Vater mit Wort und Tat, damit alle Segnungen dich erreichen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Parallelüberlieferung lautet: „damit Segen von ihm über dich komme“; dadurch wird der Vater deutlicher als Quelle des Segens bezeichnet.'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּנִי
  choice: Mein Sohn
  rationale: Die direkte Anrede ist männlich und singularisch; „Mein Sohn“ gibt sie genau und natürlich wieder.
- source_word: בְּמַאֲמָר וּבְמַעֲשֶׂה
  choice: mit Wort und Tat
  rationale: Die feste deutsche Wendung bewahrt die knappe ethische Gegenüberstellung von Reden und Handeln; beide hebräischen Begriffe bleiben erkennbar.
- source_word: כַּבֵּד אָבִיךָ
  choice: ehre deinen Vater
  rationale: כבד bezeichnet hier, dem Vater das ihm gebührende Gewicht und die entsprechende Achtung zu geben; „ehren“ ist im Deutschen die klare und etablierte Entsprechung.
- source_word: עֲבוּר
  choice: damit
  rationale: Leitet hier eine Ziel- oder Folgeaussage ein, ohne das Verhältnis unnötig enger festzulegen.
- source_word: יַשִׂיגוּךָ
  choice: dich erreichen
  rationale: Gibt das Bild des hebräischen Verbs, wonach die Segnungen die angesprochene Person erreichen oder einholen, unmittelbar wieder.
- source_word: כֹּל בְּרָכוֹת
  choice: alle Segnungen
  rationale: Bewahrt gegen eine kollektivische Singularisierung den hebräischen Plural und den umfassenden Sinn von כֹּל.
theological_decisions:
- issue: Ursprung der verheißenen Segnungen
  choice: Im Haupttext wird keine Quelle der Segnungen genannt.
  alternative: Die Segnung kommt vom Vater; so formuliert es die griechische Parallelüberlieferung mit „von ihm“.
  rationale: Der vorrangige hebräische Text nennt lediglich die Segnungen, die den Sohn erreichen. Eine göttliche oder väterliche Quelle ausdrücklich einzusetzen, würde die im Hebräischen bestehende Offenheit auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die geläufige Paarformel „mit Wort und Tat“ sorgt für natürliche Verständlichkeit, während „alle Segnungen“ den hebräischen Plural und „dich erreichen“ dessen konkretes Bild bewahren.
