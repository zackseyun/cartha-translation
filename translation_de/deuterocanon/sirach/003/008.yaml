  source_fidelity: 'Der deutsche Haupttext gibt den hebräischen Text vollständig und treffend wieder: „Mein Sohn“ wahrt die männliche Singularanrede; „ehre deinen Vater“ entspricht כַּבֵּד אָבִיךָ; „mit Wort und Tat“ ist eine natürliche Entsprechung für die ethische Paarformel; und „damit alle Segnungen dich erreichen“ bewahrt sowohl Zweck/Folge als auch Plural und Bildlichkeit von יַשִׂיגוּךָ כֹּל בְּרָכוֹת. Der im Hebräischen nicht genannte Ursprung der Segnungen wird nicht ergänzt.'
