  text: In the day of distress it will be remembered for your benefit; like heat upon frost[a], your sins will be blotted out.
translation:
  language: de
  text: Am Tag der Not wird es zu deinem Vorteil in Erinnerung gerufen werden; wie Hitze auf Reif[a] werden deine Sünden beseitigt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nach dem Hebräischen: „wie Hitze auf Reif“. Der griechische Paralleltext lautet sinngemäß: „wie heiteres Wetter auf Reif, so werden deine Sünden aufgelöst.“ Beide Fassungen zeichnen das Bild von Reif, der verschwindet.'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּיוֹם צָרָה
  choice: Am Tag der Not
  rationale: צָרָה bezeichnet Not, Bedrängnis oder Drangsal. „Am Tag der Not“ wahrt das konkrete Zeitbild und klingt in modernem, würdigem Deutsch natürlich.
- source_word: תִּזָּכֵר לָךְ
  choice: wird es dir zugutekommend in Erinnerung gebracht
  rationale: Das feminine Singularverb verweist wahrscheinlich auf die zuvor genannte kindliche Fürsorge beziehungsweise Wohltat. לָךְ wird als Dativ des Vorteils verstanden; die unpersönliche Form bewahrt den möglichen Rückbezug, ohne ausdrücklich Gott als Handelnden einzusetzen.
- source_word: כְּחֹם עַל כְּפוֹר
  choice: wie Wärme auf Reif
  rationale: חֹם bedeutet Wärme oder Hitze, כְּפוֹר Reif beziehungsweise Frost. „Wärme auf Reif“ erhält das konkrete Bild des verschwindenden Reifs; „Reif“ ist im Deutschen für diese Bildwirkung anschaulicher als das abstraktere „Frost“.
- source_word: לְהַשְׁבִּית עֲוֹנֶיךָ
  choice: werden deine Sünden beseitigt
  rationale: שׁבת im Hifil bedeutet aufhören lassen, beseitigen oder zum Verschwinden bringen. „Beseitigt“ gibt die kausative Bedeutung genauer wieder als das lediglich bildhafte „schmelzen dahin“, während „Sünden“ עֲוֹנֶיךָ verständlich wiedergibt, ohne dessen mögliche Schuldkomponente auszuschließen.
theological_decisions:
- issue: Verhältnis zwischen der erinnerten guten Tat und der Beseitigung der Sünden
  choice: Die gute Tat wird zugunsten des Menschen in Erinnerung gebracht, und seine Sünden werden beseitigt; der genaue Wirkzusammenhang bleibt unausgeführt.
  alternative: Die Ehrung der Eltern sühnt in einem mechanischen oder ausdrücklich verdienstlichen Sinn unmittelbar die Sünden.
  rationale: Der Vers verbindet Erinnerung zugunsten des Menschen und Sündenbeseitigung, erklärt jedoch weder den Handelnden noch einen dogmatischen Mechanismus. Die Übersetzung bewahrt diese Spannung und fügt keine spätere Lehrformel hinzu.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung bleibt dem hebräischen Bildaufbau nahe. Der etwas markierte Ausdruck „dir zugutekommend“ macht den Vorteilsdativ לָךְ sichtbar und vermeidet die zweideutige Aussage „du wirst in Erinnerung gebracht“.
