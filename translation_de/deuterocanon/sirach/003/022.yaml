translation:
  language: de
  text: Denke über das nach, was dir aufgetragen ist[a]; mit verborgenen Dingen hast du nichts zu schaffen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: „wozu du ermächtigt worden bist“ oder „was dir erlaubt worden ist“; die griechische Parallele lautet: „was dir aufgetragen wurde“.'
    reason: alternative_reading
lexical_decisions:
- source_word: בַּמֶּה שֶׁהוּרְשֵׁיתָ
  choice: über das, was dir aufgetragen ist
  rationale: Die Wendung bezeichnet den dem Menschen zugewiesenen Bereich. „Aufgetragen“ gibt den verpflichtenden Sinn der griechischen Parallele (προσετάγη) wieder, ohne so eng wie „befohlen“ zu formulieren; die abweichende mögliche Bedeutung des hebräischen Verbs wird in der Fußnote bewahrt.
- source_word: הִתְבּוֹנֵן
  choice: Denke … nach
  rationale: Das Verb fordert zu aufmerksamer, verständiger Betrachtung auf. „Nachdenken über“ ist im modernen Deutschen natürlich und entspricht dem weisheitlichen Zusammenhang.
- source_word: וְאֵין לְךָ עֵסֶק
  choice: hast du nichts zu schaffen
  rationale: Die deutsche Redewendung bewahrt die mahnende Aussage, dass dieser Bereich nicht Sache des Angesprochenen ist, und entspricht dem hebräischen Gedanken von Beschäftigung oder Befassung.
- source_word: בְּנִסְתָּרוֹת
  choice: mit verborgenen Dingen
  rationale: Die sachliche Formulierung bezeichnet dem Menschen entzogene Gegenstände, ohne durch „Mysterien“ spätere theologische Nebenbedeutungen einzutragen.
theological_decisions:
- issue: Verhältnis zwischen hebräischem הוּרְשֵׁיתָ und griechischem προσετάγη
  choice: Im Haupttext „was dir aufgetragen ist“
  alternative: „wozu du ermächtigt worden bist“ oder „was dir erlaubt worden ist“
  rationale: Das Hebräische kann Erlaubnis oder Ermächtigung ausdrücken, während die griechische Parallele ausdrücklich von einem Auftrag oder Gebot spricht. „Aufgetragen“ wahrt den verpflichtenden Sinn des Griechischen und lässt zugleich eher als „befohlen“ die Vorstellung eines zugewiesenen Zuständigkeitsbereichs erkennen. Die echte Textspannung wird in der Fußnote offengelegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der knappe Imperativ und die idiomatische Wendung „nichts zu schaffen haben“ erhalten den mahnenden Ton; das Semikolon bildet die enge gedankliche Verbindung der beiden Satzhälften ab.
