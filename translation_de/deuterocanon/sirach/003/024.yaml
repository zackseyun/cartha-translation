  text: For many are the speculations of the sons of man[b][a], and evil imaginings lead astray.
translation:
  language: de
  text: Denn zahlreich sind die Mutmaßungen[a] der Menschen, und böse Vorstellungen führen in die Irre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das seltene hebräische Wort kann auch „Gedanken“, „Überlegungen“ oder „Annahmen“ bedeuten. Die griechische Parallele hat „Meinung“ oder „Annahme“.
    reason: alternative_reading
lexical_decisions:
- source_word: רַבִּים
  choice: zahlreich
  rationale: Gibt die quantitative Aussage prägnant wieder und bewahrt die hervorgehobene Satzstellung des Hebräischen.
- source_word: עֶשְׁתּוֹנֵי
  choice: Mutmaßungen
  rationale: Das seltene und in seiner Bedeutung nicht völlig sichere Wort bezeichnet hier wahrscheinlich selbstgebildete Gedanken oder Annahmen. „Mutmaßungen“ bewahrt den warnenden Unterton und wird durch die griechische Parallele ὑπόλημψις gestützt.
- source_word: בְּנֵי אָדָם
  choice: der Menschen
  rationale: Die hebräische Wendung bedeutet wörtlich „der Menschensöhne“, bezeichnet hier jedoch allgemein die Menschen. Die idiomatische deutsche Wiedergabe ist natürlich und schließt die gesamte Menschheit ein.
- source_word: דִמְיוֹנוֹת
  choice: Vorstellungen
  rationale: Bezeichnet innere Gedankengebilde oder Einbildungen; „Vorstellungen“ ist im Deutschen verständlich und lässt die genauere Färbung offen.
- source_word: רָעוֹת
  choice: böse
  rationale: Bewahrt die wahrscheinlich moralische Wertung des Hebräischen, die auch durch griechisch πονηρά gestützt wird.
- source_word: מַתְעוֹת
  choice: führen in die Irre
  rationale: Gibt die kausative Bedeutung des hebräischen Ausdrucks wieder, ohne ein im Ausgangstext nicht ausdrücklich genanntes Objekt einzufügen.
theological_decisions:
- issue: Anthropologische Wendung בְּנֵי אָדָם
  choice: der Menschen
  alternative: der Menschensöhne / der Menschenkinder
  rationale: Die Wendung ist hier eine allgemeine Bezeichnung für die Menschheit und kein besonderer Titel. Die idiomatische Form vermeidet eine im Deutschen missverständliche geschlechtliche Verengung, ohne den Sinn zu verändern.
- issue: Nicht genanntes Objekt bei מַתְעוֹת
  choice: führen in die Irre
  alternative: führen sie in die Irre / bringen den Verstand der Menschen zu Fall
  rationale: Der hebräische Text nennt kein ausdrückliches Objekt. Die objektlose deutsche Form bewahrt diese Offenheit; die ausführlichere griechische Parallele darf den hebräischen Wortlaut nicht stillschweigend erweitern.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Satzstruktur und der warnende Weisheitston bleiben erhalten. „Mutmaßungen“ ist verständlicher als „Spekulationen“ und vermittelt zugleich, dass es um unsichere, selbstgebildete Annahmen geht.
