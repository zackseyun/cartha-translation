translation:
  language: de
  text: Hört[a], Kinder, auf die Weisung eines Vaters und handelt danach, damit ihr lebt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Griechisch: „Hört auf mich, euren Vater … damit ihr gerettet werdet.“ Der hebräische Text formuliert allgemeiner: „auf die Weisung eines Vaters … damit ihr lebt“.'
    reason: alternative_reading
lexical_decisions:
- source_word: שִׁמְעוּ
  choice: Hört
  rationale: Der Imperativ bezeichnet aufmerksames Hören. „Hört“ bewahrt diesen Grundsinn, ohne ihn vorschnell auf „gehorcht“ zu verengen; das anschließende Handeln macht die praktische Folge deutlich.
- source_word: בָנִים
  choice: Kinder
  rationale: Die formal maskuline Pluralform dient in der Weisheitsunterweisung als allgemeine familiäre Anrede. „Kinder“ gibt diesen Sinn im heutigen Deutsch natürlich wieder.
- source_word: מִשְׁפַט
  choice: Weisung
  rationale: Im Zusammenhang bezeichnet das Wort keinen gerichtlichen Urteilsspruch, sondern die maßgebliche Unterweisung beziehungsweise Richtlinie eines Vaters. „Weisung“ erhält deren verbindlichen Charakter.
- source_word: אָב
  choice: eines Vaters
  rationale: Der hebräische Text enthält kein Possessivsuffix. Die unbestimmte Formulierung wahrt daher gegenüber der ausdrücklichen Selbstbezeichnung im Griechischen den Wortlaut des hebräischen Hauptzeugen.
- source_word: וַעֲשׂוּ
  choice: und handelt danach
  rationale: Das Verb bedeutet grundsätzlich „tun, handeln“. „Handelt danach“ macht im Deutschen natürlich deutlich, dass die zuvor genannte Weisung ausgeführt werden soll.
- source_word: לְמַעַן
  choice: damit
  rationale: Die Konjunktion leitet einen Zwecksatz ein; „damit“ ist die klare und idiomatische deutsche Entsprechung.
- source_word: תִּחְיוּ
  choice: ihr lebt
  rationale: Die Form von חיה bedeutet „leben“. Der abweichende griechische Wortlaut „gerettet werdet“ wird nicht in den Haupttext übernommen, sondern in der Fußnote dokumentiert.
theological_decisions:
- issue: Abweichung zwischen Hebräisch und Griechisch bei der Selbstbezeichnung des Vaters
  choice: Im Haupttext steht nach dem Hebräischen allgemein „eines Vaters“.
  alternative: Das Griechische lautet sinngemäß „Hört auf mich, den Vater“.
  rationale: Wo der hebräische Sirachtext erhalten und sicher ist, bildet er die primäre Grundlage. Die ausdrückliche erste Person des griechischen Paralleltextes wird als bedeutsame Variante in der Fußnote bewahrt.
- issue: Zielaussage „leben“ gegenüber griechisch „gerettet werden“
  choice: Der Haupttext folgt dem hebräischen תחיו mit „damit ihr lebt“.
  alternative: Das Griechische bietet „damit ihr gerettet werdet“.
  rationale: Die beiden Überlieferungen setzen unterschiedliche Akzente. Der klare hebräische Wortlaut wird übersetzt, während die theologisch bedeutsame griechische Lesart offengelegt und nicht stillschweigend harmonisiert wird.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Anrede und der knappe weisheitliche Mahnton bleiben erhalten; „handelt danach“ verbindet Verständlichkeit mit enger Bindung an den hebräischen Handlungsimperativ.
