  text: Even if a man lacks understanding[a], be patient with him[b], and do not shame him all the days of his life.
translation:
  language: de
  text: Auch wenn einem Mann die Einsicht fehlt, hab Nachsicht mit ihm[b] und beschäme ihn nicht, solange er lebt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Griechisch: „und entehr ihn nicht mit deiner ganzen Kraft“. Der hebräische Text lautet „alle Tage seines Lebens“. Der Haupttext folgt hier dem hebräischen Hauptzeugen; das Griechische dürfte eine andere hebräische Vorlage oder eine deutende Wiedergabe spiegeln.'
    reason: textual_variant
  - marker: b
    text: 'Oder: „lass es ihm nach“; „übe Nachsicht mit ihm“. Der hebräische Ausdruck bezeichnet ein Lassen oder Nachlassen; die griechische Parallele verdeutlicht den Sinn als nachsichtige Geduld.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: Auch wenn
  rationale: Die Verbindung ist im Zusammenhang konzessiv zu verstehen; das griechische κἂν bestätigt den Sinn „auch wenn“.
- source_word: אִישׁ
  choice: ein Mann
  rationale: Dies gibt den singularischen maskulinen Ausdruck אִישׁ direkt wieder und passt zum unmittelbaren Zusammenhang der Weisung über den Vater.
- source_word: יֶחְסַר מַדָּעוֹ
  choice: an Einsicht verliert
  rationale: Wörtlich geht es darum, dass seine Erkenntnis oder Einsicht abnimmt beziehungsweise fehlt. Die Formulierung gibt den möglichen Vorgang des geistigen Nachlassens natürlich wieder; griechisch σύνεσις stützt „Einsicht“.
- source_word: עֲזָב לוֹ
  choice: sei nachsichtig mit ihm
  rationale: Das hebräische Verb kann ein Lassen oder Nachlassen bezeichnen. Das griechische συγγνώμην ἔχε verdeutlicht hier die Aufforderung zu Nachsicht; die gewählte Formulierung ist idiomatisch und bewahrt den ethischen Gehalt.
- source_word: וְאַל תַּכְלִים אוֹתוֹ
  choice: beschäme ihn nicht
  rationale: Das hebräische Verb bezeichnet das Zufügen von Schande oder Beschämung. „Beschämen“ ist direkt, verständlich und gibt auch die zwischenmenschliche Stoßrichtung wieder.
- source_word: כָּל יְמֵי חַיָיו
  choice: solange er lebt
  rationale: Die idiomatische deutsche Wendung entspricht dem hebräischen „alle Tage seines Lebens“, ohne dessen zeitlichen Umfang abzuschwächen.
