  text: A father's blessing establishes roots[a], but a mother's curse uproots a plant.
translation:
  language: de
  text: Der Segen eines Vaters lässt Wurzeln schlagen[a], doch der Fluch einer Mutter reißt eine Pflanze aus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Paralleltext lautet: »Denn der Segen eines Vaters stärkt die Häuser der Kinder, doch der Fluch einer Mutter reißt Fundamente aus.« Der hebräische Text verwendet stattdessen die Bilder von Wurzeln und einer Pflanze.'
    reason: alternative_reading
lexical_decisions:
- source_word: בִּרְכַת אָב
  choice: Der Segen eines Vaters
  rationale: Die hebräische Genitivverbindung bezeichnet den vom Vater ausgesprochenen Segen. Die singularische Form bewahrt die Entsprechung zu »einer Mutter« im zweiten Halbvers.
- source_word: תְּיַסֵּד שֹׁרֶשׁ
  choice: lässt Wurzeln schlagen
  rationale: יסד bedeutet »gründen, fest begründen«. Die geläufige deutsche Wendung gibt die Wirkung im landwirtschaftlichen Bild natürlich wieder; der Plural »Wurzeln« erfasst den kollektiven Sinn des singularischen שֹׁרֶשׁ.
- source_word: וְקִלְלַת אֵם
  choice: doch der Fluch einer Mutter
  rationale: Das hebräische וְ kann »und« heißen; »doch« bringt hier den klaren antithetischen Parallelismus idiomatisch zum Ausdruck, ohne den Sachgehalt zu verändern.
- source_word: תִּנְתּשׁ נֶטַע
  choice: reißt eine Pflanze aus
  rationale: נטש bezeichnet in diesem Zusammenhang das Herausreißen aus dem Boden, נֶטַע etwas Gepflanztes. Die Formulierung bewahrt das konkrete landwirtschaftliche Bild und klingt im Deutschen natürlicher als eine wörtlich nominale Wiedergabe.
theological_decisions:
- issue: Vorrangiges Bild bei abweichender hebräischer und griechischer Überlieferung
  choice: 'Das landwirtschaftliche Bild des Hebräischen wird beibehalten: Wurzeln schlagen und eine Pflanze ausreißen.'
  alternative: 'Dem griechischen Paralleltext folgen: Der Segen des Vaters stärkt die Häuser der Kinder, der Fluch der Mutter reißt Fundamente aus.'
  rationale: Der erhaltene hebräische Text ist hier sicher und in sich schlüssig; deshalb bestimmt er den Haupttext. Die deutlich abweichende griechische Bildsprache wird als wichtige Textvariante in der Fußnote dokumentiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die sprichwörtliche Kürze und der Gegensatz der beiden Halbverse bleiben erhalten; die hebräische Agrarmetaphorik wird in natürlicher deutscher Ausdrucksweise wiedergegeben.
