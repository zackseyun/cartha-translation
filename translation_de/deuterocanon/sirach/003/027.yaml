  text: Without the pupil[a], light is lacking; and without knowledge, wisdom is lacking.
translation:
  language: de
  text: Wo keine Pupille ist, fehlt das Licht; wo keine Erkenntnis ist, fehlt Weisheit.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der erhaltene griechische Textzeuge bietet hier einen anderen Spruch: „Ein hartes Herz wird von Leiden niedergedrückt werden, und der Sünder wird Sünde auf Sünde häufen.“'
    reason: textual_variant
lexical_decisions:
- source_word: בְּאֵין
  choice: ohne
  rationale: Die Verbindung bezeichnet das Fehlen oder Nichtvorhandensein von etwas. „Ohne“ ist knapp, natürlich und bewahrt die Parallelstruktur des Spruchs.
- source_word: אִישׁוֹן
  choice: Pupille
  rationale: Im Zusammenhang mit „Licht“ bezeichnet das Wort die Pupille des Auges. „Pupille“ gibt den anatomischen Sinn im heutigen Deutsch klar wieder.
- source_word: יֶחְסַר / תֶּחְסַר
  choice: fehlt
  rationale: חסר bezeichnet einen Mangel oder ein Fehlen. Die gleiche Wiedergabe an beiden Stellen erhält die hebräische Wiederholung und den ausgewogenen Satzbau.
- source_word: אוֹר
  choice: Licht
  rationale: Der Grundsinn ist „Licht“; zugleich passt das Wort zum konkreten Bild des Sehens im ersten Satzglied.
- source_word: דַעַת
  choice: Erkenntnis
  rationale: דעת bezeichnet Wissen beziehungsweise Erkenntnis. „Erkenntnis“ klingt in deutscher Weisheitsliteratur natürlich und bleibt von „Weisheit“ unterschieden.
- source_word: חָכְמָה
  choice: Weisheit
  rationale: Dies ist die übliche und kontextgerechte Wiedergabe des zentralen Begriffs der Weisheitsliteratur.
theological_decisions:
- issue: Deutliche Abweichung zwischen dem erhaltenen hebräischen und dem griechischen Textzeugen zu Sirach 3,27
  choice: Der erhaltene hebräische Spruch steht im Haupttext; die wesentlich andere griechische Fassung wird in einer Fußnote dokumentiert.
  alternative: 'Griechisch: „Ein hartes Herz wird von Leiden niedergedrückt werden, und der Sünder wird Sünde auf Sünde häufen.“'
  rationale: Da für diesen Vers ein hebräischer Text erhalten ist, wird er als primäre Ausgangsbasis übersetzt. Die griechische Überlieferung bietet nicht nur eine kleine Variante, sondern einen anderen Spruch; deshalb darf sie den Haupttext nicht stillschweigend ersetzen, muss aber aus Gründen textkritischer Transparenz genannt werden.
translation_notes:
  register: Knappes, würdiges modernes Standarddeutsch mit bewusst erhaltener Parallelität. Die Wiederholung von „fehlt“ bildet die hebräische Form ab; „Pupille“ hält das konkrete Bild verständlich.
