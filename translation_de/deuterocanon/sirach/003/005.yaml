base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/003/005.yaml
  text: Whoever honors his father will rejoice in his children[b][a], and his prayer will be heard and answered.
translation:
  language: de
  text: Wer seinen Vater ehrt, wird sich an seinem Sohn freuen[a], und sein Gebet wird erhört und beantwortet[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der griechische Paralleltext hat „durch seine Kinder“ statt des hebräischen Singulars „an seinem Sohn“.
    reason: alternative_reading
  - marker: b
    text: Der griechische Paralleltext sagt am Versende nur „wird erhört“; das hebräische Zeugnis fügt „und beantwortet“ hinzu.
    reason: alternative_reading
lexical_decisions:
- source_word: מְכַבֵּד
  choice: ehrt
  rationale: Das Piel-Partizip von כבד bezeichnet, jemandem die gebührende Ehre und Bedeutung zu geben. „Ehrt“ ist im Deutschen natürlich und bewahrt die ethische Aussage.
- source_word: אָבִיו
  choice: seinen Vater
  rationale: Der hebräische Text nennt ausdrücklich den Vater; eine geschlechtsneutrale Verallgemeinerung wäre hier nicht textgemäß.
- source_word: יִשְׂמַח
  choice: wird sich freuen
  rationale: Das Verb bezeichnet Freude und passt als Futur zu der weisheitlichen Folgerung beziehungsweise Verheißung.
- source_word: בִּבְנוֹ
  choice: an seinem Sohn
  rationale: Der hebräische Text hat den Singular „an/über seinem Sohn“. „Sich an seinem Sohn freuen“ gibt die Bedeutung der Präposition ב idiomatisch wieder, ohne den Singular nach dem griechischen Paralleltext zu verallgemeinern.
- source_word: וּתְפִלָתוֹ
  choice: und sein Gebet
  rationale: תפלה ist die übliche Bezeichnung für ein Gebet; die einfache deutsche Entsprechung ist klar und angemessen.
- source_word: יִשְׁמַע וְיַעֲנֶה
  choice: wird erhört und beantwortet werden
  rationale: Die passive deutsche Form macht das Gebet zum Satzgegenstand und lässt den im Hebräischen nicht ausdrücklich genannten Handelnden unausgesprochen. Zugleich bewahrt sie beide Verben des hebräischen Zeugnisses.
theological_decisions:
- issue: Die Verheißung, die mit der Ehre gegenüber dem Vater verbunden ist
  choice: Als weisheitliche Folge beziehungsweise Verheißung wiedergeben, ohne Gott im Haupttext ausdrücklich als Handelnden zu nennen.
  alternative: Gott ausdrücklich als denjenigen nennen, der das Gebet hört und beantwortet.
  rationale: Göttliches Handeln ist sachlich naheliegend, doch der hebräische Wortlaut nennt Gott hier nicht ausdrücklich. Die Übersetzung bewahrt diese Zurückhaltung und löst die theologische Spannung nicht auf.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper weisheitlicher Satzstruktur. Der hebräische Singular und die nicht ausdrücklich benannte göttliche Handlung bleiben erhalten; die griechischen Abweichungen werden in Fußnoten dokumentiert.
