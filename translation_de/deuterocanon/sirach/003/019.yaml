base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/003/019.yaml
  text: Many are lofty and renowned[a], but mysteries are revealed to the gentle.
translation:
  language: de
  text: Viele sind hochgestellt und angesehen, doch den Sanftmütigen[a] werden Geheimnisse offenbart.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den Milden“ beziehungsweise „den Demütigen“. Das griechische Wort bezeichnet Menschen von sanfter, milder oder demütiger Haltung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  choice: Viele
  rationale: Die substantivisch gebrauchte unbestimmte Mehrzahl wird knapp und sprichwortartig mit „Viele“ wiedergegeben.
- source_word: ὑψηλοὶ
  choice: hochgestellt
  rationale: Das Adjektiv bezeichnet hier eine hohe gesellschaftliche Stellung; „hochgestellt“ bewahrt diesen Statusbezug und vermeidet eine unnötig moralische Festlegung.
- source_word: ἐπίδοξοι
  choice: angesehen
  rationale: Das Wort bezeichnet Personen, die öffentlich in Ansehen oder Ehre stehen. „Angesehen“ ist im modernen Deutsch natürlich und bildet zusammen mit „hochgestellt“ das soziale Gewicht der Wendung ab.
- source_word: πραέσιν
  choice: den Sanftmütigen
  rationale: Der Dativ Plural bezeichnet Menschen von milder, nicht selbstbehauptender Haltung. „Sanftmütig“ ist eine geläufige biblische Entsprechung und lässt sowohl Milde als auch Demut anklingen, ohne beides gleichzusetzen.
- source_word: ἀποκαλύπτεται
  choice: werden … offenbart
  rationale: Das Präsens Passiv wird bewahrt; der Handelnde bleibt wie im Griechischen ungenannt. Wegen des pluralischen Subjekts steht im Deutschen „werden“.
- source_word: μυστήρια
  choice: Geheimnisse
  rationale: „Geheimnisse“ gibt verborgene oder geheime Dinge in natürlichem Deutsch wieder und vermeidet, dem Ausdruck vorschnell einen fachtheologischen Sinn zu geben.
theological_decisions:
- issue: Wiedergabe von πραέσιν zwischen Sanftmut, Milde und Demut
  choice: den Sanftmütigen
  alternative: den Milden; den Demütigen
  rationale: Der Ausdruck bezeichnet eine milde, nicht selbstbehauptende Haltung. Der Kontrast zu den Hochgestellten und Angesehenen lässt auch Demut mitschwingen, setzt πραΰς aber nicht schlicht mit „demütig“ gleich. Eine Fußnote bewahrt die echte Bedeutungsbreite.
- issue: Ungenannter Urheber der Offenbarung
  choice: Passiv ohne Ergänzung eines Handelnden
  alternative: Gott offenbart den Sanftmütigen Geheimnisse
  rationale: Das griechische Passiv nennt den Offenbarenden nicht. Obwohl ein göttliches Handeln im Kontext mitgemeint sein kann, darf es nicht ausdrücklich in den Haupttext eingefügt werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper, sprichwortartiger Satzform. „Doch“ gibt den deutlichen Gegensatz natürlich wieder; die passive Form und die semantische Offenheit des griechischen Textes bleiben erhalten.
