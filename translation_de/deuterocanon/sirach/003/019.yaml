  source_fidelity: 'Der Text gibt die griechische Aussage vollständig und treffend wieder: „Viele“ entspricht πολλοί; „hochgestellt und angesehen“ bildet ὑψηλοὶ καὶ ἐπίδοξοι idiomatisch als soziale Hervorhebung ab; „den Sanftmütigen“ wahrt den Dativ Plural von πραέσιν; und „werden Geheimnisse offenbart“ erhält das präsente, den Offenbarenden nicht nennende Passiv ἀποκαλύπτεται μυστήρια.'
