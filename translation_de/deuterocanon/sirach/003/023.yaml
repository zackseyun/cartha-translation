  text: Do not probe into what is beyond you[b][a], for what is too great for you has been shown to you.
translation:
  language: de
  text: Forsche nicht nach dem, was über dich hinausgeht[a]; denn was deine Möglichkeiten übersteigt, ist dir gezeigt worden.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Erforsche nicht Dinge, die größer sind als du.“ Das hebräische Verb ist schwierig; die griechische Parallelüberlieferung lautet: „Sei bei deinen vielen Tätigkeiten nicht übermäßig neugierig.“'
    reason: lexical_alternative
  - marker: b
    text: 'Das Hebräische kann auch verstanden werden: „Denn du hast vieles gesehen, das über dich hinausgeht.“ Die griechische Parallelüberlieferung stützt jedoch: „Was deine Möglichkeiten übersteigt, ist dir gezeigt worden.“'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּיוֹתֵר מִמְּךָ
  choice: was über dein Vermögen hinausgeht
  rationale: Die Wendung bezeichnet etwas, das den eigenen Maßstab oder die eigene Erkenntnisfähigkeit übersteigt. Die Formulierung ist im Deutschen natürlich und bewahrt den Vergleichssinn.
- source_word: אַל תַּמֵּר
  choice: Forsche nicht nach
  rationale: Die hebräische Verbform ist schwierig. Im Zusammenhang und im Licht des griechischen μὴ περιεργάζου warnt sie vor übermäßiger, die eigenen Grenzen überschreitender Erkundung. „Nachforschen“ gibt diesen Sinn wieder, ohne bloße Wissbegier grundsätzlich abzuwerten.
- source_word: כִּי
  choice: denn
  rationale: Leitet knapp die Begründung der vorausgehenden Mahnung ein.
- source_word: רַב מִמְּךָ
  choice: was zu groß für dich ist
  rationale: Die Wendung bezeichnet Dinge, welche das menschliche Maß oder Vermögen übersteigen. „Zu groß für dich“ erhält Bild und Weisheitston des Hebräischen.
- source_word: הָרְאֵיתָ
  choice: ist dir gezeigt worden
  rationale: Die hebräische Form kann auch aktiv verstanden werden, doch das griechische ὑπεδείχθη σοι stützt deutlich den passiven Sinn. Die Passivform lässt zugleich offen, wer das Zeigen bewirkt hat.
theological_decisions:
- issue: Diathese von הָרְאֵיתָ im Verhältnis zur griechischen Parallelüberlieferung
  choice: 'passiver Sinn: „ist dir gezeigt worden“'
  alternative: 'aktiver Sinn: „hast du gesehen“'
  rationale: Obwohl die hebräische Form eine aktive Lesart zulässt, bezeugt die griechische Parallelüberlieferung ausdrücklich eine passive Aussage. Die Übersetzung wahrt diese textliche Spannung durch eine Fußnote und benennt keinen Handelnden, den der Vers selbst nicht nennt.
- issue: Gegenstand der Warnung
  choice: Warnung vor Nachforschung jenseits des eigenen Vermögens
  alternative: allgemeine Verurteilung von Wissbegier oder Forschung
  rationale: Der Vergleich מִמְּךָ begrenzt die Mahnung auf das, was den Menschen übersteigt. Daher wird keine pauschale theologische Ablehnung von Erkenntnissuche in den Text eingetragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Über dein Vermögen hinausgeht“ bezeichnet verständlich die Grenzen menschlicher Fähigkeit und Erkenntnis; „Forsche nicht nach“ klingt gegenwärtig, ohne salopp oder unnötig technisch zu sein. Die beiden echten textlichen Unsicherheiten werden in Fußnoten offengelegt.
