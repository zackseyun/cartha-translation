    text: 'Griechisch: »Wer Wohltaten vergilt, denkt an das, was danach kommt.« Die erste Vershälfte unterscheidet sich im Griechischen erheblich vom erhaltenen hebräischen Text; in der zweiten stimmen beide darin überein, dass man in einer Zeit des Fallens eine Stütze findet.'
