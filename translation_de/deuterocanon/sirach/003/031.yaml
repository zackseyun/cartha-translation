lexical_decisions:
- source_word: פועל טוב
  choice: Wer Gutes tut
  rationale: Die hebräische Wendung bezeichnet eine einzelne Person, die Gutes tut. Die deutsche Wer-Konstruktion gibt den allgemeinen Sinn natürlich wieder, ohne das im Hebräischen nicht eigens stehende Substantiv »Mann« einzufügen.
- source_word: יקראנו
  choice: wird … glücklich gepriesen
  rationale: Die Form bedeutet wörtlich etwa »man wird ihn nennen/ausrufen«. Im Zusammenhang ist ein anerkennendes Urteil gemeint; »glücklich preisen« bringt dies idiomatisch zum Ausdruck, ohne die Aussage mit einer bestimmten handelnden Person zu verbinden.
- source_word: בדרכיו
  choice: wegen seines Lebenswandels
  rationale: Wörtlich steht »aufgrund/in seinen Wegen«. »Lebenswandel« erschließt die in der Weisheitsliteratur übliche Bedeutung von »Wegen« als Verhalten, während die kausale Beziehung erhalten bleibt.
- source_word: בעת מוטו
  choice: wenn er ins Wanken gerät
  rationale: מוט bezeichnet Wanken, Gleiten oder Stürzen. Die Formulierung bewahrt das Bild und legt sich nicht unnötig auf einen endgültigen Untergang fest.
- source_word: ימצא משען
  choice: findet er eine Stütze
  rationale: משען bezeichnet etwas, worauf man sich stützen kann. »Eine Stütze finden« ist im Deutschen sowohl konkret als auch übertragen verständlich und entspricht auch dem griechischen στήριγμα.
theological_decisions:
- issue: Generische maskuline Einzahl im Weisheitsspruch
  choice: Wer Gutes tut
  alternative: Ein Mann, der Gutes tut
  rationale: Das Hebräische gebraucht eine maskuline Singularform mit allgemeiner Aussagekraft. Die deutsche Wer-Konstruktion wahrt die Einzahl und den Personenbezug, ohne ein ausdrücklich nicht vorhandenes »Mann« einzufügen.
- issue: Hebräischer Text oder abweichende griechische erste Vershälfte
  choice: Der hebräischen ersten Vershälfte folgen; die griechische Abweichung in der Fußnote dokumentieren
  alternative: 'Nach dem Griechischen übersetzen: »Wer Wohltaten vergilt, denkt an das, was danach kommt«'
  rationale: Da für diese Stelle ein hebräischer Text mit hoher Sicherheit vorliegt, bildet er die Grundlage. Das Griechische bestätigt den Gedanken der Stütze beim Fallen in der zweiten Hälfte, weicht aber in der ersten erheblich ab und wird deshalb transparent in der Fußnote wiedergegeben.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem weisheitlichem Ton. »Lebenswandel«, »glücklich preisen« und »Stütze« sind geläufig, ohne umgangssprachlich zu wirken; die Bildsprache des Wankens bleibt erhalten.
