  text: One who does good will be called blessed for his ways[a], and at the time of his stumbling he will find support.
translation:
  language: de
  text: 'Wer Gutes tut, wird wegen seines Lebenswandels glücklich gepriesen[a]; und wenn er ins Wanken gerät, findet er eine Stütze.


    [a] Griechisch: »Wer Wohltaten vergilt, denkt an das, was danach kommt.« Die erste Vershälfte unterscheidet sich im Griechischen erheblich vom erhaltenen hebräischen Text; in der zweiten stimmen beide darin überein, dass man in einer Zeit des Fallens eine Stütze findet.'
  philosophy: optimal-equivalence
  footnotes:
