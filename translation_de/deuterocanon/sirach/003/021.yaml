  text: Do not seek what is too wondrous for you[a], and do not search out what is hidden from you.
translation:
  language: de
  text: Was zu wunderbar für dich ist, danach forsche nicht[a], und was dir verborgen ist, das ergründe nicht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, enger nach der griechischen Parallele: „Was zu schwer für dich ist, danach suche nicht, und was deine Kraft übersteigt, das untersuche nicht.“ Das Hebräische betont das zu Wunderbare und Verborgene, das Griechische dagegen das, was die eigenen Fähigkeiten übersteigt.'
    reason: alternative_reading
lexical_decisions:
- source_word: פְּלָאוֹת מִמְּךָ
  choice: was zu wunderbar für dich ist
  rationale: פְּלָאוֹת bezeichnet Außerordentliches oder Wunderbares; מִמְּךָ markiert hier idiomatisch etwas, das den eigenen Bereich oder die eigene Fähigkeit übersteigt. Die Formulierung bewahrt das hebräische Bild und vermittelt zugleich die Grenze menschlicher Erkenntnis.
- source_word: אַל תִּדְרוֹשׁ
  choice: danach forsche nicht
  rationale: דרש kann suchen, nachfragen oder forschen bedeuten. „Forschen“ passt zum Zusammenhang einer eindringlichen Untersuchung und bildet dennoch eine erkennbare Abstufung zu „ergründen“ im zweiten Halbvers.
- source_word: וּמְכֻסֶּה מִמְּךָ
  choice: was dir verborgen ist
  rationale: Das Partizip von כסה bezeichnet etwas Verhülltes oder Verborgenes. „Dir verborgen“ gibt die relationale Aussage von מִמְּךָ in natürlichem Deutsch wieder, ohne festzulegen, warum es verborgen ist.
- source_word: אַל תַּחְקוֹר
  choice: das ergründe nicht
  rationale: חקר meint gründliches Untersuchen oder Ausforschen. „Ergründen“ wahrt gegenüber דרש die stärkere Nuance des tiefen Eindringens.
- source_word: χαλεπότερά σου / ἰσχυρότερά σου
  choice: im Fußnotenhinweis als „was zu schwer für dich ist“ / „was deine Kraft übersteigt“
  rationale: Die griechische Parallele weicht lexikalisch vom Hebräischen ab, bestätigt aber die Aussage, dass es um Dinge geht, die das eigene Vermögen überschreiten.
theological_decisions:
- issue: Ob der Vers jede Erforschung göttlicher Geheimnisse verbietet oder vor der Erforschung dessen warnt, was die eigene Reichweite beziehungsweise Offenbarung übersteigt
  choice: Eine Weisheitsmahnung, nicht nach Dingen zu forschen, die das eigene Vermögen übersteigen oder verborgen bleiben
  alternative: Ein uneingeschränktes Verbot theologischer Forschung
  rationale: Die hebräischen Ausdrücke „zu wunderbar für dich“ und „dir verborgen“ sowie die griechische Parallele betonen die Grenze des Menschen. Die Übersetzung lässt offen, worin diese Grenze jeweils besteht, und macht daraus kein allgemeines Forschungsverbot.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die vorangestellten Relativsätze bilden den hebräischen Parallelismus natürlich nach; „forschen“ und „ergründen“ bewahren die Steigerung der beiden Untersuchungsverben.
