  source_fidelity: Die erste Zeile ist zutreffend wiedergegeben. In der zweiten Zeile legt »erstattet Gott etwas zurück« jedoch eine Rückerstattung durch den Menschen an Gott nahe. Der hebräische Nominalausdruck וּגְמוּל אֱלֹהִים עַל מְכַבֵּד אִמּוֹ bedeutet dem Wortlaut nach vielmehr, dass Gottes Vergeltung bzw. Lohn demjenigen gilt, der seine Mutter ehrt. Das ergänzte »etwas« hat im Hebräischen keinen Anhalt.
  naturalness: »Dessen Tage werden zahlreich sein« ist verständlich, aber etwas steif. »Wird lange leben« ist modernes, natürliches Deutsch und gibt die idiomatische Aussage von יִרְבּוּ יָמָיו zuverlässig wieder. »Gottes Lohn gilt dem« ist klar und würdig, ohne die knappe hebräische Konstruktion übermäßig auszuformulieren.
  terminology: »Ehrt« ist für מְכַבֵּד angemessen. »Gottes Lohn« gibt גְּמוּל אֱלֹהִים in seinem Kontext als von Gott kommende Vergeltung wieder; damit wird keine bestimmte theologische Lehre ergänzt. Die Fußnote gibt den abweichenden griechischen Paralleltext sachgerecht wieder.
  issues:
