revisions:
- from: Wer seinen Vater ehrt, dessen Tage werden zahlreich sein; und wer seine Mutter ehrt, erstattet Gott etwas zurück.[a]
  to: Wer seinen Vater ehrt, wird lange leben; und Gottes Lohn gilt dem, der seine Mutter ehrt.[a]
  rationale: Der Haupttext folgt dem vorhandenen hebräischen Wortlaut. Die zweite Zeile wird als knappe Aussage über Gottes Lohn für die Ehrung der Mutter übersetzt, statt eine im Text nicht belegte Rückerstattung an Gott zu behaupten. Der deutlich abweichende griechische Paralleltext bleibt in der Fußnote erhalten.
