base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/003/006.yaml
  text: Whoever honors his father will have long days[a], and whoever honors his mother repays God.
translation:
  language: de
  text: Wer seinen Vater ehrt, wird lange leben; und Gottes Lohn gilt dem, der seine Mutter ehrt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Paralleltext lautet: »Wer auf den Herrn hört, wird seiner Mutter Ruhe verschaffen.« Die zweite Zeile unterscheidet sich erheblich vom Hebräischen.'
    reason: alternative_reading
lexical_decisions:
- source_word: מְכַבֵּד
  choice: ehrt
  rationale: Das Partizip von כבד bezeichnet hier, Vater oder Mutter die gebührende Ehre zu erweisen. »Ehrt« ist im Deutschen natürlich und bewahrt den Bezug zur Gebotstradition.
- source_word: אָבִיו
  choice: seinen Vater
  rationale: Der Singular mit Suffix der 3. Person maskulin Singular wird ausdrücklich wiedergegeben.
- source_word: יִרְבּוּ יָמָיו
  choice: dessen Tage werden zahlreich sein
  rationale: Die Formulierung erhält das hebräische Bild wörtlicher als »wird lange leben«, bleibt aber verständlich.
- source_word: וּגְמוּל אֱלֹהִים עַל
  choice: erstattet Gott etwas zurück
  rationale: Die überlieferte hebräische Wendung ist knapp und syntaktisch schwierig. Diese Wiedergabe versteht גמול als Gegenleistung beziehungsweise Rückerstattung an Gott, ohne einen genaueren Gegenstand zu ergänzen.
- source_word: אִמּוֹ
  choice: seine Mutter
  rationale: Das Suffix der 3. Person maskulin Singular wird parallel zum ersten Satzglied bewahrt.
theological_decisions:
- issue: Abweichung zwischen der hebräischen und der griechischen zweiten Zeile
  choice: 'Der erhaltene hebräische Text steht im Haupttext: Wer seine Mutter ehrt, erstattet Gott etwas zurück.'
  alternative: 'Nach dem Griechischen: »Wer auf den Herrn hört, wird seiner Mutter Ruhe verschaffen.«'
  rationale: Da ein hebräischer Textzeuge mit hoher Zuverlässigkeit vorliegt, erhält er Vorrang. Die erhebliche und theologisch bedeutsame Abweichung des griechischen Paralleltextes wird jedoch in einer Fußnote vollständig sichtbar gemacht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die leicht ungewohnte Wendung »dessen Tage werden zahlreich sein« bewahrt bewusst das hebräische Bild; »erstattet Gott etwas zurück« bildet die knappe und schwierige zweite Zeile verständlich ab, ohne die Abweichung zum Griechischen zu glätten.
