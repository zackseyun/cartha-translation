    issue: Die zweite Zeile verkehrt die wahrscheinliche Richtung von גְּמוּל אֱלֹהִים.
    rationale: »Erstattet Gott etwas zurück« macht den Ehrenden zum Handelnden gegenüber Gott. Der hebräische Ausdruck bezeichnet natürlicher Gottes Lohn/Vergeltung für denjenigen, der seine Mutter ehrt.
  - severity: low
    issue: »Etwas« ist eine unbelegte Ergänzung.
    rationale: Der hebräische Text nennt keinen Gegenstand einer Rückerstattung.
  - severity: low
    issue: »Dessen Tage werden zahlreich sein« ist unnötig sperrig.
    rationale: Die idiomatische Aussage ist ein langes Leben; »wird lange leben« wahrt den Sinn in modernem Standarddeutsch.
