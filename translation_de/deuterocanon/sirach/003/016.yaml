  text: For one who despises his father is insolent[b][a], and one who provokes his mother is cursed by his Creator.
translation:
  language: de
  text: Denn wer seinen Vater verachtet, ist vermessen[a]; und wer seine Mutter verflucht, erzürnt seinen Schöpfer.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Paralleltext formuliert abweichend und stärker: »Wer seinen Vater verlässt, ist wie ein Lästerer.«'
    reason: alternative_reading
  - marker: b
    text: 'Der griechische Paralleltext lautet: »Wer seine Mutter erzürnt, ist vom Herrn verflucht.«'
    reason: alternative_reading
lexical_decisions:
- source_word: מֵזִיד
  choice: handelt vermessen
  rationale: Das Partizip von זיד bezeichnet anmaßendes, überhebliches oder vermessenes Handeln. Die prädikative Wiedergabe entspricht der hebräischen Satzfunktion und klingt im Deutschen natürlich.
- source_word: בּוֹזֶה
  choice: wer … verachtet
  rationale: בזה bedeutet, jemanden zu verachten oder geringschätzig zu behandeln. »Verachtet« gibt die deutliche moralische Wertung knapp wieder.
- source_word: וּמַכְעִיס
  choice: erzürnt
  rationale: Das Hifil-Partizip von כעס bedeutet, Zorn hervorzurufen. Nach der hebräischen Wortstellung und Parallelstruktur bezieht sich das Verb auf »seinen Schöpfer«.
- source_word: בּוֹרְאוֹ
  choice: seinen Schöpfer
  rationale: Das hebräische Wort bezeichnet ausdrücklich den Schöpfer des Handelnden; das Possessivsuffix wird beibehalten.
- source_word: מְקַלֵּל
  choice: wer … verflucht
  rationale: Das Piel-Partizip von קלל bezeichnet hier den, der seine Mutter verflucht. Diese aktive Bedeutung folgt unmittelbar aus der hebräischen Konstruktion und wird nicht nach dem abweichenden griechischen Paralleltext passiv umgedeutet.
- source_word: אִמּוֹ
  choice: seine Mutter
  rationale: Das ausdrückliche Possessivsuffix bleibt erhalten und bildet den Parallelismus zu »seinen Vater«.
theological_decisions:
- issue: Zuordnung der Handlungen und ihrer Folgen im zweiten Halbvers
  choice: Wer seine Mutter verflucht, erzürnt seinen Schöpfer.
  alternative: Wer seine Mutter erzürnt, ist vom Herrn verflucht.
  rationale: Der klare hebräische Wortlaut verbindet מְקַלֵּל mit אִמּוֹ und מַכְעִיס mit בּוֹרְאוֹ. Der griechische Paralleltext ordnet Handlung und Folge anders zu; diese Abweichung wird in einer Fußnote bewahrt, nicht in den hebräischen Haupttext eingetragen.
- issue: Wiedergabe von מֵזִיד gegenüber griechisch βλάσφημος
  choice: handelt vermessen
  alternative: ist ein Lästerer
  rationale: Das Hebräische bezeichnet vermessenes beziehungsweise anmaßendes Verhalten, während das Griechische stärker und spezifischer als »Lästerer« formuliert. Die Hauptübersetzung folgt dem Hebräischen; die griechische Zuspitzung wird vermerkt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Umstellung in zwei »wer«-Sätze macht den hebräischen Parallelismus transparent. »Vermessen handeln« bewahrt die moralische Schärfe, ohne die spezifischere griechische Deutung »Lästerer« in den hebräischen Haupttext einzutragen.
