translation:
  language: de
  text: Und er wird denen, die ihn gezeugt haben, wie Herren dienen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wie Gebietern“; das griechische Wort bezeichnet Personen mit weitreichender Autorität und wird hier als starker Vergleich für das Verhalten gegenüber den Eltern gebraucht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δεσπόταις
  choice: wie Herren
  rationale: δεσπότης bezeichnet Personen mit weitreichender Verfügungsgewalt. „Herren“ bewahrt hier den starken Vergleich, ohne das Verhältnis zu den Eltern wörtlich als Besitzverhältnis darzustellen; „Gebietern“ bleibt als mögliche Verdeutlichung in der Fußnote erhalten.
- source_word: δουλεύσει
  choice: wird … dienen
  rationale: Das Futur von δουλεύω bezeichnet einen Dienst in untergeordneter Stellung. „dienen“ ist im Deutschen natürlich und behält zusammen mit „wie Herren“ die deutliche Unterordnung des griechischen Ausdrucks bei.
- source_word: ἐν τοῖς γεννήσασιν αὐτόν
  choice: denen, die ihn gezeugt haben
  rationale: Die substantivierte Partizipialwendung benennt diejenigen, die ihn hervorgebracht haben, und begründet die Verpflichtung ausdrücklich in der Abstammung. Die relativische Wiedergabe bleibt näher am Griechischen als das deutende „seinen Eltern“.
theological_decisions:
- issue: Stärke des Bildes von der kindlichen Verpflichtung
  choice: Der Vergleich, den Eltern wie Herren zu dienen, bleibt ungemildert erhalten.
  alternative: Er wird seinen Eltern pflichtbewusst dienen.
  rationale: δεσπόταις und δουλεύσει zeichnen bewusst ein starkes Bild der Unterordnung. Eine bloße Wiedergabe als Achtung oder pflichtbewusste Hilfe würde die ethische Schärfe des Ausgangstextes abschwächen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung bleibt klar und bibelsprachlich gehoben, ohne altertümliche Formen. „gezeugt haben“ ist bewusst quellenah; der Zusammenhang bezieht die Eltern insgesamt ein.
