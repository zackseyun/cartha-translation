translation:
  language: de
  text: Mach dich klein bei all deiner Größe,[a] und vor Gott wirst du Erbarmen finden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Überlieferung lautet: „Je größer du bist, desto mehr demütige dich selbst.“'
    reason: Die griechische Parallele bietet eine klare proportionale Formulierung, während der hebräische Text wörtlicher vom Sich-klein-Machen angesichts aller Größe spricht.
lexical_decisions:
- source_word: מַעֵט נַפְשְךָ
  choice: Mach dich klein
  rationale: Die hebräische Wendung bedeutet wörtlich, sich selbst gering oder klein zu machen. Die Wiedergabe bleibt anschaulich und drückt freiwillige Demut aus, ohne das Bild durch einen abstrakten Begriff zu ersetzen.
- source_word: מִכָּל גְּדוּלָה
  choice: bei all deiner Größe
  rationale: Der schwierige hebräische Ausdruck verbindet die Selbsterniedrigung mit jeder Form beziehungsweise jedem Maß von Größe. Diese Fassung ist im Deutschen natürlich und bewahrt den Gegensatz von Größe und Sich-klein-Machen; die griechische Parallele formuliert daraus ausdrücklich eine Steigerungsrelation.
- source_word: אֵל
  choice: Gott
  rationale: Die allgemeine hebräische Gottesbezeichnung wird im modernen Standarddeutsch unmittelbar als „Gott“ wiedergegeben.
- source_word: רַחֲמִים
  choice: Erbarmen
  rationale: Das Wort bezeichnet mitfühlende Barmherzigkeit. „Erbarmen“ wahrt den personalen und theologischen Gehalt und passt zur Wendung „Erbarmen finden“.
theological_decisions:
- issue: Verhältnis von menschlicher Größe und Demut
  choice: Die hebräische Bildsprache „Mach dich klein bei all deiner Größe“ bleibt im Haupttext erhalten.
  alternative: „Je größer du bist, desto mehr demütige dich selbst“ nach der griechischen Parallele.
  rationale: Die griechische Fassung und die englische Konsultationsschicht machen eine proportionale Aussage. Der vorrangige hebräische Text ist jedoch anders gebaut und soll nicht stillschweigend an die griechische Form angeglichen werden. Eine Fußnote dokumentiert die wichtige Parallelüberlieferung.
- issue: Göttliches Erbarmen als Fund
  choice: „vor Gott wirst du Erbarmen finden“
  alternative: „bei dem Herrn wirst du Gnade finden“ nach der griechischen Parallele.
  rationale: Die Wahl folgt den hebräischen Wörtern אֵל und רַחֲמִים und vermeidet eine Harmonisierung mit den abweichenden griechischen Begriffen Κύριος und χάρις.
translation_notes:
  register: Modernes, dignifiziertes Standarddeutsch. Der kurze Weisheitsspruch behält das konkrete Bild des Sich-klein-Machens; die Satzstruktur ist klar und für heutige Leser unmittelbar verständlich.
