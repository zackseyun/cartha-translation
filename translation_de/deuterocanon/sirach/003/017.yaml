  text: My son[a], in your prosperity walk in humility, and you will be loved more than one who gives gifts.
translation:
  language: de
  text: Mein Sohn[a], lebe in deinem Wohlstand demütig, und du wirst mehr geliebt werden als jemand, der Geschenke gibt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Parallele lautet: »Kind, führe deine Werke in Sanftmut aus, und du wirst von einem anerkannten Menschen geliebt werden.« Der hebräische Text lautet dagegen: »Mein Sohn, lebe in deinem Wohlstand demütig, und du wirst mehr geliebt werden als jemand, der Geschenke gibt.«'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּנִי
  choice: Mein Sohn
  rationale: Die maskuline Anrede mit Suffix der ersten Person wird entsprechend dem erhaltenen hebräischen Text direkt wiedergegeben. Die griechische Parallele hat allgemeiner »Kind«.
- source_word: בְּעָשְׁרְךָ
  choice: in deinem Wohlstand
  rationale: Das zugrunde liegende עֹשֶׁר bezeichnet Reichtum oder Wohlstand. »Wohlstand« wahrt den materiellen Bezug, klingt im Deutschen aber natürlicher als »in deinem Reichtum«.
- source_word: הִתְהַלֵּךְ
  choice: lebe
  rationale: Der Hitpael-Imperativ von הלך beschreibt bildhaft die Lebensführung. »Lebe« gibt diese idiomatische Bedeutung in natürlichem Deutsch wieder; die wörtlichere Wiedergabe »wandle« wäre heute weniger allgemein verständlich.
- source_word: בַּעֲנָוָה
  choice: demütig
  rationale: ענוה bezeichnet Demut oder Sanftmut. Die adverbiale Formulierung ist im Deutschen knapp und natürlich und passt zum ethischen Aufruf.
- source_word: וְתֵאָהֵב
  choice: und du wirst mehr geliebt werden
  rationale: Die Form hat passiven Sinn und bezeichnet die Liebe, die dem Angeredeten von anderen entgegengebracht wird. Die Zukunftsform bewahrt den Zusammenhang von Aufforderung und Folge.
- source_word: מִנּוֹתֵן מַתָּנוֹת
  choice: als einer, der Geschenke gibt
  rationale: Das komparative מן und die partizipiale Wendung werden ausdrücklich wiedergegeben. So bleibt der Vergleich zwischen demütiger Lebensführung und dem Gewinnen von Zuneigung durch Geschenke erhalten.
theological_decisions:
- issue: Abweichung zwischen dem erhaltenen hebräischen Text und der griechischen Parallele
  choice: 'Der Haupttext folgt dem Hebräischen: Wohlstand, demütige Lebensführung und größere Liebe als für einen Geber von Geschenken.'
  alternative: 'Nach der griechischen Parallele: »Kind, führe deine Werke in Sanftmut aus, und du wirst von einem angesehenen Menschen geliebt werden.«'
  rationale: Da hier ein erhaltener hebräischer Text mit hoher Vertrauenswürdigkeit vorliegt, bestimmt er die Übersetzung. Die erheblich abweichende griechische Lesart wird in der Fußnote offengelegt, statt mit dem Hebräischen harmonisiert zu werden.
translation_notes:
  register: Modernes, allgemein verständliches und würdevolles Standarddeutsch. »Lebe … demütig« gibt die hebräische Metapher der Lebensführung natürlich wieder; die deutlich abweichende griechische Überlieferung bleibt durch die Fußnote sichtbar.
