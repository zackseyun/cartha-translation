  text: The heart of the wise understands the sayings of the wise[b][a], and an attentive ear rejoices in wisdom.
translation:
  language: de
  text: Das Herz eines Weisen versteht die Sprüche der Weisen,[a] und ein aufmerksames Ohr freut sich an der Weisheit.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort kann auch mit »Sinnsprüche« oder »Gleichnisse« übersetzt werden; der griechische Paralleltext hat hier den Singular »Gleichnis«.
    reason: lexical_alternative
  - marker: b
    text: 'Der griechische Paralleltext weicht in der zweiten Vershälfte ab und lautet ungefähr: »und das Ohr eines Hörers ist das Verlangen eines Weisen«. Die Übersetzung folgt hier dem erhaltenen hebräischen Text.'
    reason: textual_variant
lexical_decisions:
- source_word: לֵב חָכָם
  choice: das Herz eines Weisen
  rationale: Bewahrt das hebräische Bild vom Herzen als Zentrum des Denkens und Verstehens; der Singular wird repräsentativ wiedergegeben.
- source_word: יָבִין
  choice: versteht
  rationale: Gibt בין hier direkt als Erfassen des Sinnes weiser Unterweisung wieder.
- source_word: מִשְׁלֵי
  choice: die Sprüche
  rationale: משל bezeichnet im Kontext der Weisheitsliteratur prägnante Lehrsprüche, kann aber auch weiter gefasst als Gleichnisse oder Sinnsprüche verstanden werden.
- source_word: חֲכָמִים
  choice: der Weisen
  rationale: Gibt den Plural als allgemeine Bezeichnung für weise Menschen oder Weisheitslehrer wieder, ohne das Geschlecht unnötig hervorzuheben.
- source_word: אֹזֶן מַקְשֶׁבֶת
  choice: ein aufmerksames Ohr
  rationale: Bewahrt das konkrete hebräische Bild und bringt zugleich das aktive, sorgfältige Zuhören zum Ausdruck.
- source_word: לְחָכְמָה תִּשְׂמָח
  choice: freut sich an der Weisheit
  rationale: Gibt שמח als Freude wieder und fasst die Präposition ל natürlich als den Gegenstand dieser Freude.
theological_decisions:
- issue: Abweichung des griechischen Paralleltextes in der zweiten Vershälfte
  choice: Der erhaltene hebräische Wortlaut wird als Haupttext übersetzt.
  alternative: 'Dem Griechischen folgend etwa: „und das Ohr eines Hörers ist das Verlangen eines Weisen.“'
  rationale: Der Auftrag weist den hebräischen Text als primären, mit hoher Sicherheit bezeugten Ausgangstext aus. Die echte Textabweichung wird jedoch in einer Fußnote offengelegt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewahrtem hebräischem Bildgebrauch. Der Satzbau bleibt knapp und parallel; „Sprüche“ ist allgemein und nicht als ausdrücklicher Verweis auf das gleichnamige biblische Buch gemeint.
