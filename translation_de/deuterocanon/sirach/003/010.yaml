translation:
  language: de
  text: Suche keine Ehre in der Schande deines Vaters[a]; denn das ist keine Ehre für dich.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Verschaffe dir nicht durch die Schande deines Vaters Ehre.“ Die hebräische Präposition kann sowohl „in“ als auch „durch“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּתְכַּבֵּד
  choice: Suche keine Ehre
  rationale: Der verneinte Hitpael von כבד bezeichnet hier das Streben nach eigener Ehre oder das Sich-Ehre-Verschaffen. Die Formulierung gibt den reflexiven Sinn natürlich wieder, ohne ihn auf bloßes Prahlen zu verengen.
- source_word: בְּקְלוֹן
  choice: in der Schande
  rationale: קלון bedeutet Schande, Schmach oder Entehrung. Das ב kann hier den Bereich oder das Mittel bezeichnen; „in“ bewahrt diese Offenheit weitgehend, während die instrumentale Deutung in der Fußnote genannt wird.
- source_word: אָבִיךָ
  choice: deines Vaters
  rationale: Gibt das Substantiv mit singularischem Possessivsuffix unmittelbar wieder.
- source_word: כִּי
  choice: denn
  rationale: Leitet die Begründung der vorangehenden Mahnung ein und entspricht dem knappen Stil eines Weisheitsspruchs.
- source_word: לֹא כָבוֹד הוּא לָךְ
  choice: das ist keine Ehre für dich
  rationale: Bewahrt die nominale Aussage und die Wiederaufnahme des Wortstamms כבד/כבוד. Auch die griechische Parallele bestätigt das Wortfeld Ehre/Ruhm.
theological_decisions: []
translation_notes:
  register: Moderner, würdevoller Weisheitsstil. Die Wiederholung von „Ehre“ bildet das hebräische Wortspiel zwischen dem Verb כבד und dem Substantiv כבוד ab; die Mehrdeutigkeit der Präposition wird nicht stillschweigend aufgelöst.
