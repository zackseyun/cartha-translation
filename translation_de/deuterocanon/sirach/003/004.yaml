  yaml_path: translation/deuterocanon/sirach/003/004.yaml
  text: And whoever honors his mother is like one who stores up treasure.
translation:
  language: de
  text: Und wer seine Mutter ehrt, ist wie einer, der einen Schatz ansammelt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δοξάζων
  choice: ehrt
  rationale: Im Zusammenhang der Weisheitslehre bezeichnet das Wort die gebührende Achtung gegenüber der Mutter; „ehrt“ ist im Deutschen natürlich und vermeidet einen kultischen Beiklang von „verherrlicht“.
- source_word: ἀποθησαυρίζων
  choice: einen Schatz ansammelt
  rationale: Das Partizip beschreibt das Aufhäufen oder Ansammeln in einem Schatzhaus. Die Formulierung bewahrt das konkrete Bild eines wachsenden Schatzes, ohne dessen Art näher festzulegen.
- source_word: μητέρα αὐτοῦ
  choice: seine Mutter
  rationale: Die ausdrücklich singularische und maskulin bezogene Form des griechischen Spruches wird beibehalten.
- source_word: ὡς
  choice: ist wie einer, der
  rationale: Die Vergleichspartikel leitet ein Gleichnis ein. Das im Griechischen fehlende finite Verb wird für ein idiomatisches deutsches Verständnis ergänzt.
theological_decisions:
- issue: Angedeutete Belohnung für die Ehrung der Mutter
  choice: Das Ehren der Mutter wird mit dem Ansammeln eines Schatzes verglichen, ohne die Art dieses Schatzes festzulegen.
  alternative: Der Schatz könnte als materieller Wohlstand, himmlischer Lohn oder allgemeiner sittlicher Gewinn gedeutet werden.
  rationale: Der griechische Text erklärt nicht, worin der Schatz besteht. Die offene Metapher bewahrt diese Mehrdeutigkeit und vermeidet eine konfessionell oder dogmatisch bestimmte Auslegung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer proverbialer Satzstruktur. Das einleitende „Und“ gibt καί wieder und erhält den Zusammenhang mit dem vorhergehenden Vers.
