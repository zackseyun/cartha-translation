  text: Water extinguishes a blazing fire[b][a]; so almsgiving makes atonement for sin.
translation:
  language: de
  text: Wasser löscht loderndes Feuer; ebenso sühnt das Geben von Almosen[a] Sünde.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Mildtätigkeit“; das hebräische Wort kann auch „Gerechtigkeit“ oder „gerechtes Handeln“ bedeuten. Die griechische Fassung hat hier „Almosengeben“.
    reason: lexical_alternative
  - marker: b
    text: Die griechische Fassung hat „Sünden“ im Plural; der hebräische Singular kann hier allgemein oder kollektiv gemeint sein.
    reason: alternative_reading
lexical_decisions:
- source_word: אש לוהטת
  choice: loderndes Feuer
  rationale: Die Wendung bezeichnet ein heftig brennendes Feuer. „Loderndes Feuer“ gibt das anschauliche Bild natürlich wieder und wird durch das griechische φλογιζόμενον bestätigt.
- source_word: יכבו מים
  choice: Wasser löscht
  rationale: Das hebräische מים ist formal pluralisch, wird aber kollektiv gebraucht; im Deutschen ist „Wasser“ im Singular idiomatisch. כבה bezeichnet das Löschen beziehungsweise Erlöschen eines Feuers.
- source_word: כן
  choice: ebenso
  rationale: Das Wort verbindet die beiden Satzhälften als Vergleich. „Ebenso“ bewahrt die knappe, sprichwortartige Form.
- source_word: צדקה
  choice: das Geben von Almosen
  rationale: צדקה kann allgemein „Gerechtigkeit“ oder „gerechtes Handeln“ bedeuten, bezeichnet hier jedoch wahrscheinlich konkrete Hilfe für Bedürftige. Das griechische ἐλεημοσύνη stützt ausdrücklich den Sinn „Almosengeben“.
- source_word: תכפר
  choice: sühnt
  rationale: Das Piel von כפר bezeichnet hier das Sühnen. „Sühnt“ bewahrt die starke theologische Aussage des Textes, ohne sie zu „gleicht aus“ oder „macht wiedergut“ abzuschwächen.
- source_word: חטאת
  choice: Sünde
  rationale: Gemeint ist Sünde beziehungsweise Schuld, nicht ein Sündopfer. Der hebräische Singular kann kollektiv verstanden werden; die griechische Parallele hat den Plural „Sünden“.
theological_decisions:
- issue: Bedeutung von צדקה in Verbindung mit Sühne
  choice: „das Geben von Almosen … sühnt Sünde“
  alternative: „Gerechtigkeit/gerechtes Handeln sühnt Sünde“
  rationale: Der weitere Bedeutungsumfang des hebräischen Wortes bleibt in der Fußnote sichtbar. Im unmittelbaren Kontext und angesichts der griechischen Wiedergabe ἐλεημοσύνη ist konkrete Mildtätigkeit jedoch die wahrscheinlichste Bedeutung. Die Aussage über Sühne wird nicht dogmatisch erklärt oder abgeschwächt, sondern in ihrer Spannung bewahrt.
translation_notes:
  register: Knapper, würdevoller Spruchstil in modernem Standarddeutsch. „Das Geben von Almosen“ ist verständlicher und weniger substantivisch verdichtet als „Almosengeben“, während „sühnt“ die bewusste theologische Schärfe des Ausgangstextes erhält.
