  text: Prepare your words[a], and then you will be heard; bind together instruction, and answer.
translation:
  language: de
  text: Bereite deine Worte vor[a], dann wird man dir zuhören; bündele die Unterweisung und antworte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Bereite ein Wort / eine Rede vor, und so wirst du gehört werden; bündele die Unterweisung und antworte.“ Das griechische λόγον steht im Singular und kann „ein Wort“ oder „eine Rede“ bedeuten. σύνδησον παιδείαν ist ein Bild für das Zusammenführen der Unterweisung und kann auch im Sinn von „die Unterweisung ordnen“ verstanden werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑτοίμασον
  choice: Bereite … vor
  rationale: Der Aoristimperativ von ἑτοιμάζω fordert zu bewusster Vorbereitung auf; die deutsche Wendung ist natürlich und bewahrt den Imperativ.
- source_word: λόγον
  choice: deine Worte
  rationale: λόγος kann ein Wort, eine Rede, eine Sache oder eine Darlegung bezeichnen. Im Zusammenhang ist das gemeint, was gesagt werden soll; der idiomatische Plural gibt dies im Deutschen verständlich wieder, während die formale Singularmöglichkeit in der Fußnote erhalten bleibt.
- source_word: οὕτως
  choice: dann
  rationale: Das Adverb kann Art und Weise oder Folge ausdrücken. „Dann“ stellt hier knapp den praktischen Zusammenhang zwischen Vorbereitung und Gehörfinden her.
- source_word: ἀκουσθήσῃ
  choice: wird man dir zuhören
  rationale: Die sinngemäße deutsche Passivwiedergabe vermittelt, dass die angesprochene Person Gehör findet, ohne das Verb lediglich auf akustisches Hören zu verengen.
- source_word: σύνδησον
  choice: binde … zusammen
  rationale: Der Imperativ von συνδέω bedeutet wörtlich „zusammenbinden“. Die bildhafte Ausdrucksweise des Griechischen bleibt bewusst erhalten.
- source_word: παιδείαν
  choice: Unterweisung
  rationale: παιδεία bezeichnet hier formende Belehrung oder geschulte Einsicht. „Unterweisung“ passt in den Weisheitskontext und vermeidet den vorwiegend strafenden Klang von „Disziplin“.
- source_word: ἀποκρίθητι
  choice: antworte
  rationale: Der Aoristimperativ von ἀποκρίνομαι wird direkt und idiomatisch wiedergegeben.
