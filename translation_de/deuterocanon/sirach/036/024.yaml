  text: A woman's beauty brightens the face[b][a], and surpasses every desire of a man.
translation:
  language: de
  text: Die Schönheit einer Frau lässt das Gesicht strahlen[a] und übertrifft jedes Verlangen eines Mannes.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „erheitert das Gesicht“ oder „macht das Gesicht froh“. Der griechische Text sagt nicht ausdrücklich, wessen Gesicht gemeint ist.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „jedes Verlangen eines Menschen“. Das griechische Wort kann je nach Zusammenhang „Mann“ oder allgemeiner „Mensch“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κάλλος γυναικός
  choice: die Schönheit einer Frau
  rationale: κάλλος bezeichnet Schönheit bzw. ansprechendes Aussehen; γυναικός ist hier am natürlichsten allgemein als „einer Frau“ zu verstehen, nicht enger als „einer Ehefrau“.
- source_word: ἱλαρύνει πρόσωπον
  choice: lässt das Gesicht strahlen
  rationale: ἱλαρύνει bedeutet „heiter machen, erfreuen, aufhellen“. Die deutsche Wendung bewahrt sowohl die sichtbare Bildlichkeit des Gesichts als auch die Wirkung der Freude.
- source_word: ὑπὲρ πᾶσαν ἐπιθυμίαν
  choice: übertrifft jedes Verlangen
  rationale: ὑπέρ mit Akkusativ und ὑπεράγει drücken ein Hinausgehen über etwas bzw. Übertreffen aus; ἐπιθυμία wird hier ohne unnötige Präzisierung als „Verlangen“ wiedergegeben.
- source_word: ἀνθρώπου
  choice: eines Mannes
  rationale: ἄνθρωπος kann allgemein „Mensch“ bedeuten, doch die Gegenüberstellung zur Schönheit einer Frau legt in diesem Weisheitsspruch eine männliche Bezugsperson nahe. Die geschlechtliche Form des Ausgangstextes bleibt daher im Haupttext erhalten.
- source_word: ὑπεράγει
  choice: übertrifft
  rationale: Das Verb bezeichnet das Übertreffen oder Hinausragen und wird im Deutschen knapp und idiomatisch wiedergegeben.
theological_decisions:
- issue: Geschlechtliche oder generische Wiedergabe von ἀνθρώπου
  choice: „eines Mannes“ im Haupttext
  alternative: „eines Menschen“
  rationale: Das Wort kann generisch gebraucht werden; im unmittelbaren Zusammenhang mit „einer Frau“ ist jedoch eine geschlechtlich geprägte Aussage über Anziehung wahrscheinlich. Eine Fußnote erhält die echte lexikalische Offenheit.
- issue: Wessen Gesicht gemeint ist
  choice: „das Gesicht“ ohne ergänzte Besitzangabe
  alternative: „sein Gesicht“ oder „ihr Gesicht“
  rationale: Der griechische Text nennt keinen Besitzer des Gesichts. Die Übersetzung lässt diese Bezugsoffenheit bestehen, statt sie zugunsten der Frau oder des betrachtenden Mannes aufzulösen.
translation_notes:
  register: Moderne, würdige und sprichwortartige Standardsprache. „Lässt das Gesicht strahlen“ ist anschaulich und allgemein verständlich; die Fußnoten bewahren die lexikalische und syntaktische Offenheit des Griechischen.
