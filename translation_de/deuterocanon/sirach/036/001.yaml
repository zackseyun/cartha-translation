translation:
  language: de
  text: Wer den Herrn fürchtet, dem wird kein Unheil begegnen[a]; doch in der Prüfung wird der Herr ihn wieder retten.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dem wird nichts Böses begegnen“ beziehungsweise „dem wird kein Unglück widerfahren“. Das griechische Wort kann Böses, Schaden oder Unglück bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „in der Erprobung“ beziehungsweise „in der Versuchung“. Das griechische Wort kann eine Prüfung, Erprobung oder Versuchung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τῷ φοβουμένῳ Κύριον
  choice: Wer den Herrn fürchtet
  rationale: Das substantivierte Partizip bezeichnet allgemein einen Menschen, dessen Haltung von Ehrfurcht vor dem Herrn geprägt ist. Die deutsche Wer-Konstruktion gibt den sprichwortartigen Sinn natürlich wieder.
- source_word: οὐκ ἀπαντήσει
  choice: dem wird … begegnen
  rationale: ἀπαντάω bezeichnet ein Begegnen oder Entgegentreten. Die Verbindung mit dem Dativ wird im Deutschen idiomatisch durch „dem … begegnen“ wiedergegeben.
- source_word: κακόν
  choice: kein Unheil
  rationale: κακόν kann Böses, Schaden oder Unglück bezeichnen. „Unheil“ passt zum Zusammenhang äußerer Bedrängnis, ohne den Ausdruck auf bloßen materiellen Schaden zu verengen.
- source_word: ἐν πειρασμῷ
  choice: in der Prüfung
  rationale: πειρασμός kann Prüfung, Erprobung oder Versuchung bedeuten. Hier deutet die anschließende Rettung vor allem auf eine bedrängende Prüfung; die mögliche Bedeutungsbreite wird in der Fußnote bewahrt.
- source_word: καὶ πάλιν
  choice: wieder
  rationale: πάλιν bedeutet gewöhnlich „wieder“ oder „erneut“ und weist hier auf erneute beziehungsweise wiederholte Rettung hin.
- source_word: ἐξελεῖται
  choice: wird er ihn … retten
  rationale: Das Verb bezeichnet Befreiung oder Rettung. Das im Griechischen unausgesprochene Subjekt wird aus dem Kontext als der Herr verstanden, das Objekt als der Gottesfürchtige.
theological_decisions:
- issue: Verhältnis zwischen „kein Unheil begegnet“ und der folgenden Prüfung
  choice: 'Die Spannung bleibt bestehen: Dem Gottesfürchtigen begegnet kein Unheil, und dennoch gerät er in eine Prüfung, aus der der Herr ihn rettet.'
  alternative: Den ersten Satz abschwächen zu „Kein Unheil wird ihn überwältigen“ oder „dauerhaft treffen“.
  rationale: Der griechische Text formuliert beide Aussagen unmittelbar nebeneinander. Eine erklärende Einschränkung im Haupttext würde die sprichwortartige theologische Spannung auflösen, statt sie zu bewahren.
- issue: Unausgesprochenes Subjekt von ἐξελεῖται
  choice: „er“ bezeichnet den Herrn.
  alternative: Eine unpersönliche Wiedergabe wie „wird er wieder gerettet werden“.
  rationale: Der zuvor genannte Herr ist das naheliegende Subjekt der Rettung. Im Deutschen muss das Subjekt ausdrücklich bezeichnet werden; das kleingeschriebene Pronomen vermeidet eine überinterpretierende Hervorhebung.
- issue: Bedeutung von κακόν
  choice: „Unheil“ als umfassender Ausdruck für schädliches Widerfahrnis.
  alternative: „Böses“, das stärker auch moralisches Böse anklingen lässt.
  rationale: Im Zusammenhang mit Prüfung und Rettung steht widerfahrendes Leid im Vordergrund. Die Übersetzung schließt die allgemeine Aussage über das Böse nicht völlig aus, während die Fußnote die Alternativen nennt.
translation_notes:
  register: Moderne, würdevolle Spruchsprache mit klarer Wer-dem-Konstruktion. „Unheil“ und „Prüfung“ sind allgemein verständlich und bewahren die semantische sowie theologische Spannung des griechischen Textes.
