  yaml_path: translation/deuterocanon/sirach/036/003.yaml
  text: A man of understanding will trust in the law, and the law is as trustworthy to him as an oracle of the righteous.
translation:
  language: de
  text: Ein verständiger Mensch vertraut dem Gesetz, und das Gesetz ist für ihn so verlässlich wie ein Orakelspruch der Gerechten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄνθρωπος συνετός
  choice: ein verständiger Mensch
  rationale: Gibt die geschlechtsallgemeine Bedeutung von ἄνθρωπος und die Einsicht bzw. Urteilskraft von συνετός in natürlichem Deutsch wieder.
- source_word: ἐμπιστεύσει νόμῳ
  choice: vertraut dem Gesetz
  rationale: Das Futur kann hier als allgemeingültige Aussage verstanden werden; deutsches Präsens klingt dafür natürlich. νόμος wird entsprechend seiner grundlegenden Bedeutung mit „Gesetz“ wiedergegeben.
- source_word: πιστός
  choice: verlässlich
  rationale: Bewahrt den Sinn von Treue und Vertrauenswürdigkeit und passt idiomatisch auf das Gesetz.
- source_word: ἐρώτημα δικαίων
  choice: Ausspruch der Gerechten
  rationale: ἐρώτημα kann eine Anfrage, Antwort oder autoritative Auskunft bezeichnen. „Ausspruch“ erhält den orakelartigen Vergleich, ohne ausdrücklich eine heidnisch-kultische Vorstellung einzutragen; der Genitiv δικαίων bleibt bewusst mehrdeutig.
theological_decisions:
- issue: Art und Autorität des Gesetzes
  choice: Das Gesetz wird als verlässlich bezeichnet.
  alternative: Das Gesetz wird als göttliches Orakel bezeichnet.
  rationale: Der griechische Text vergleicht seine Verlässlichkeit mit einem ἐρώτημα δικαίων, identifiziert es aber nicht ausdrücklich mit einem göttlichen Orakel.
- issue: Mehrdeutigkeit von δικαίων
  choice: „der Gerechten“
  alternative: „gerechter Menschen“ oder „gerechter Dinge/Entscheidungen“
  rationale: Der substantivierte Genitiv Plural wird formal bewahrt, damit offenbleibt, ob gerechte Personen oder ein engerer sachlicher Bezug gemeint ist.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Parallelstruktur des griechischen Satzes bleibt erhalten; das gnomenhafte Futur wird idiomatisch im Präsens wiedergegeben.
