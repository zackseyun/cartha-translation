    rationale: »Bedeutender« verschiebt den Vergleich von Überlegenheit/Vorrang zu bloßer Wichtigkeit. »Übertrifft« bewahrt die direkte komparative Aussage des griechischen Verbs.
  - severity: low
    issue: Genitivverbindung bei πᾶν φῶς ἡμέρας ἐνιαυτοῦ
    rationale: »Alles Tageslicht des Jahres« ist möglich, kann aber die Beziehung zu den einzelnen Tagen verdecken. Die Hauptfassung gibt die distributive Lesart deutlich wieder; die Fußnote dokumentiert die alternative Gesamtlesart.
