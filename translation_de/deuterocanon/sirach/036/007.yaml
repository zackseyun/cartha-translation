base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/036/007.yaml
  text: Why does one day surpass another[a], when every daylight of the year comes from the sun?
translation:
  language: de
  text: Warum übertrifft ein Tag einen anderen,[a] wenn doch das Tageslicht jedes Tages im Jahr von der Sonne kommt?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Warum übertrifft ein Tag einen anderen, wenn doch alles Tageslicht des Jahres von der Sonne kommt?«'
    reason: Alternative Zuordnung der Genitive in πᾶν φῶς ἡμέρας ἐνιαυτοῦ.
lexical_decisions:
- source_word: διὰ τί
  choice: Warum
  rationale: Gibt die direkte Frage nach dem Grund natürlich und präzise wieder.
- source_word: ἡμέρα ἡμέρας ὑπερέχει
  choice: ist ein Tag bedeutender als ein anderer
  rationale: Der Genitiv bezeichnet den Vergleich. »Bedeutender« bewahrt die offene Frage nach dem besonderen Rang eines Tages, ohne sie ausdrücklich moralisch oder kultisch festzulegen.
- source_word: πᾶν φῶς ἡμέρας ἐνιαυτοῦ
  choice: alles Tageslicht des Jahres
  rationale: Gibt die Gesamtheit des Tageslichts über die Tage des Jahres hinweg in natürlichem Deutsch wieder.
- source_word: ἀφ᾽ ἡλίου
  choice: von der Sonne kommt
  rationale: ἀπό bezeichnet hier die Quelle; die Formulierung ist im Deutschen idiomatisch.
theological_decisions:
- issue: Vergleichende Bedeutung von ὑπερέχει
  choice: bedeutender als ein anderer
  alternative: einem anderen überlegen / höher als ein anderer
  rationale: Die Weisheitsfrage betrifft Unterschiede im Rang der Tage trotz ihrer gemeinsamen Lichtquelle. »Bedeutender« lässt offen, worin dieser Vorrang besteht, und vermeidet eine unnötig starke Wertung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das einleitende »obwohl doch« macht den im griechischen καί liegenden fragenden Gegensatz natürlich verständlich, ohne ihn inhaltlich aufzulösen.
