revisions:
- from: Warum ist ein Tag bedeutender als ein anderer,[a] obwohl doch alles Tageslicht des Jahres von der Sonne kommt?
  to: Warum übertrifft ein Tag einen anderen,[a] wenn doch das Tageslicht jedes Tages im Jahr von der Sonne kommt?
  rationale: Die Revision ersetzt die semantisch abgeschwächte Wiedergabe »bedeutender« durch das direkte, offene Vergleichsverb »übertrifft«. Sie verdeutlicht außerdem in der Hauptfassung die mögliche distributive Beziehung des Lichts zu jedem Tag, ohne die alternative genitivische Zuordnung zu unterschlagen; diese bleibt in der Fußnote erhalten.
