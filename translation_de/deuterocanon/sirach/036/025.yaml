  text: If there is mercy and gentleness on her tongue[b][a], her husband is not like the sons of men.
translation:
  language: de
  text: Wenn Barmherzigkeit und Sanftmut auf ihrer Zunge liegen, ist ihr Mann nicht wie andere Männer.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „wie die Söhne der Menschen“. Gemeint ist wahrscheinlich: wie gewöhnliche oder andere Männer.'
    reason: lexical_alternative
  - marker: b
    text: Der griechische Satz ist ungewöhnlich formuliert. Sein Sinn scheint zu sein, dass ein Mann, dessen Frau mit Barmherzigkeit und Sanftmut spricht, nicht zu den gewöhnlichen Männern gezählt wird.
    reason: cultural_note
lexical_decisions:
- source_word: ἐπὶ γλώσσης αὐτῆς
  choice: auf ihrer Zunge
  rationale: Die bildhafte griechische Wendung wird im Deutschen bewahrt und bezeichnet das, was ihr Reden prägt.
- source_word: ἔλεος
  choice: Barmherzigkeit
  rationale: Die Wiedergabe erhält den moralisch-religiösen Klang einer mitfühlenden und gütigen Haltung.
- source_word: πραΰτης
  choice: Sanftmut
  rationale: „Sanftmut“ bezeichnet im gehobenen, aber noch allgemein verständlichen Deutsch eine milde, nicht harte Haltung und entspricht der Tugendbezeichnung im Griechischen.
- source_word: ὁ ἀνὴρ αὐτῆς
  choice: ihr Mann
  rationale: Im ehelichen Zusammenhang bezeichnet ἀνήρ den Ehemann; „ihr Mann“ ist die natürliche deutsche Form.
- source_word: καθʼ υἱοὺς ἀνθρώπων
  choice: wie andere Männer
  rationale: Die wörtliche Wendung „wie die Söhne der Menschen“ wirkt im Deutschen dunkel. Die idiomatische Wiedergabe erschließt den wahrscheinlichen Vergleich, während eine Fußnote die auffällige griechische Form bewahrt.
theological_decisions:
- issue: Geschlechtsspezifischer und sprichwörtlicher Ausdruck καθʼ υἱοὺς ἀνθρώπων
  choice: wie andere Männer
  alternative: wie die Söhne der Menschen
  rationale: Der unmittelbare Zusammenhang handelt vom Ehemann; daher bleibt der männliche Bezug erhalten. Die idiomatische Haupttextfassung vermeidet jedoch eine im Deutschen missverständliche Semitisierung. Die wörtliche Form wird in der Fußnote genannt, ohne die ungewöhnliche Ausdrucksweise des Ausgangstextes zu verschweigen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Zungenmetapher und die Tugendbegriffe bleiben erhalten; nur der schwer verständliche Schlussvergleich wird im Haupttext behutsam idiomatisiert und in den Fußnoten transparent gemacht.
