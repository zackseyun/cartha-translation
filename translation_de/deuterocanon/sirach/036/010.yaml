  yaml_path: translation/deuterocanon/sirach/036/010.yaml
  text: And all men are from the ground[a], and Adam was created from the earth.
translation:
  language: de
  text: Und alle Menschen stammen vom Erdboden, und Adam wurde aus Erde erschaffen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄνθρωποι πάντες
  choice: alle Menschen
  rationale: Die Wendung bezeichnet die gesamte Menschheit. „Alle Menschen“ gibt den generischen Sinn im modernen Deutschen natürlich und genau wieder, ohne die im Deutschen missverständliche Beschränkung von „alle Männer“.
- source_word: ἀπὸ ἐδάφους
  choice: vom Erdboden
  rationale: ἐδάφος bezeichnet hier den Boden beziehungsweise die Erdoberfläche. „Erdboden“ bewahrt das konkrete Schöpfungsbild und unterscheidet den Ausdruck zugleich leicht vom folgenden γῆς.
- source_word: ἐκ γῆς
  choice: aus Erde
  rationale: γῆ kann Erde, Land oder Boden bedeuten. „Aus Erde“ ist im Schöpfungskontext idiomatisch und erhält die leichte lexikalische Variation gegenüber ἐδάφος.
- source_word: ἐκτίσθη
  choice: wurde ... erschaffen
  rationale: Der passive Aorist von κτίζω bezeichnet das Erschaffen. Die Formulierung wahrt das Passiv und den Schöpfungsbezug.
- source_word: Ἀδάμ
  choice: Adam
  rationale: Der Eigenname wird in seiner etablierten deutschen Form wiedergegeben und nicht zu einer allgemeinen Bezeichnung für den Menschen umgedeutet.
theological_decisions:
- issue: Das Verhältnis der allgemeinen Aussage über alle Menschen zur Erschaffung Adams
  choice: 'Die beiden Aussagen bleiben nebeneinandergestellt: Alle Menschen stammen vom Erdboden, und Adam wurde aus Erde erschaffen.'
  alternative: Der zweite Satzteil könnte ausdrücklich als Begründung oder paradigmatische Erläuterung des ersten formuliert werden.
  rationale: Das griechische καί verbindet die Aussagen lediglich mit „und“. Die Übersetzung fügt daher weder ein erklärendes „denn“ noch eine ausdrückliche Gleichsetzung Adams mit der ganzen Menschheit ein und bewahrt so die mögliche repräsentative Funktion Adams, ohne sie festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung „Erdboden/Erde“ bildet die griechische Variation ἐδάφος/γῆ ab. Es ist keine Fußnote nötig, da „alle Menschen“ sowohl den Umfang als auch den generischen Sinn von ἄνθρωποι πάντες unmittelbar wiedergibt.
