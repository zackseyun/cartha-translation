  yaml_path: translation/deuterocanon/sirach/036/014.yaml
  text: Have mercy on the people, O Lord, who are called by your name, and on Israel, whom you likened to a firstborn son.
translation:
  language: de
  text: Hab Erbarmen mit dem Volk, Herr, das nach deinem Namen genannt ist, und mit Israel, das du einem Erstgeborenen gleichgemacht hast.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Deutend: »das du zu deinem Erstgeborenen gemacht hast«; vgl. 2. Mose 4,22. Wörtlicher sagt das Griechische, dass du Israel einem Erstgeborenen gleichgemacht hast.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐλέησον
  choice: Hab Erbarmen mit
  rationale: Der Aoristimperativ formuliert eine unmittelbare, feierliche Bitte um Gottes erbarmendes Handeln.
- source_word: λαόν
  choice: dem Volk
  rationale: Der Kontext bestimmt das artikellose Substantiv als das Volk, das Gottes Namen trägt; ein nicht ausdrücklich vorhandenes »deinem« wird nicht ergänzt.
- source_word: Κύριε
  choice: Herr
  rationale: Die Vokativform wird in natürlicher deutscher Anrede ohne das heute altertümliche »o« wiedergegeben.
- source_word: κεκλημένον ἐπʼ ὀνόματί σου
  choice: das nach deinem Namen genannt ist
  rationale: Die Formulierung bewahrt das Namensmotiv und gibt das Perfektpassiv als bestehenden Status wieder. »Nach deinem Namen« bezeichnet Benennung und Zugehörigkeit, ohne die Wendung unnötig zu erklären.
- source_word: Ἰσραήλ
  choice: Israel
  rationale: Der Eigenname wird in seiner üblichen deutschen Form wiedergegeben.
- source_word: ὃν πρωτόγονον ὡμοίωσας
  choice: das du einem Erstgeborenen gleichgestellt hast
  rationale: »Gleichgestellt« wahrt die vergleichende Kraft von ὁμοιόω und klingt im Deutschen natürlicher als »ähnlich gemacht«. Das substantivierte »einem Erstgeborenen« ergänzt nicht ausdrücklich »Sohn« und erhält damit die sprachliche Offenheit des Griechischen.
theological_decisions:
- issue: Ob Israel als Gottes Erstgeborener bezeichnet oder lediglich einem Erstgeborenen gleichgesetzt wird
  choice: das du einem Erstgeborenen gleichgestellt hast
  alternative: das du zu deinem Erstgeborenen gemacht hast
  rationale: ὡμοίωσας bezeichnet grundsätzlich ein Ähnlichmachen oder Gleichstellen und nicht unmittelbar eine Identitätsaussage. Deshalb bleibt die vergleichende Aussage im Haupttext erhalten; die stärkere, durch Exodus 4,22 nahegelegte Deutung steht in der Fußnote.
translation_notes:
  register: Modernes, würdevolles Gebetsdeutsch. Die direkte Anrede »Herr« bleibt schlicht; die Satzstruktur folgt dem griechischen Parallelismus. Der Relativsatz bezieht sich grammatisch auf Israel, daher steht im Deutschen das neutrale Pronomen »das«.
