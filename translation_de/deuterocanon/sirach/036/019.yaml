  yaml_path: translation/deuterocanon/sirach/036/019.yaml
  text: according to the blessing of Aaron over your people[a], and all those on the earth will know that you are the Lord[b], the God of the ages.
translation:
  language: de
  text: entsprechend dem Segen Aarons über dein Volk.[a] Dann werden alle auf der Erde erkennen, dass du der Herr bist, der Gott der Zeitalter.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „für dein Volk“ oder „hinsichtlich deines Volkes“. Die griechische Wendung kann auf den Segen bezogen werden, den Aaron über Israel aussprach.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „der ewige Gott“. Wörtlicher lautet die griechische Wendung: „der Gott der Zeitalter“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ τὴν εὐλογίαν
  choice: entsprechend dem Segen
  rationale: κατά mit Akkusativ bezeichnet hier am natürlichsten die Übereinstimmung mit dem Segen; die Formulierung bleibt im Deutschen klar und nah am griechischen Wortlaut.
- source_word: Ἀαρὼν
  choice: Aarons
  rationale: Der Personenname wird in seiner geläufigen deutschen biblischen Form wiedergegeben; der Genitiv entspricht der griechischen Namensbeifügung.
- source_word: περὶ τοῦ λαοῦ σου
  choice: über dein Volk
  rationale: Im Zusammenhang mit einem ausgesprochenen Segen gibt „über“ die Beziehung idiomatisch wieder, ohne die möglichen Nuancen „für“ und „hinsichtlich“ auszuschließen.
- source_word: γνώσονται
  choice: werden erkennen
  rationale: Das Futur bezeichnet ein künftiges Erkennen bzw. Zur-Kenntnis-Kommen; „erkennen“ klingt in diesem Aussagezusammenhang natürlicher und stärker als bloßes Faktenwissen.
- source_word: πάντες οἱ ἐπὶ τῆς γῆς
  choice: alle auf der Erde
  rationale: Die knappe Wiedergabe bewahrt den umfassenden Personenkreis der griechischen Formulierung, ohne „Bewohner“ ergänzend einzutragen.
- source_word: Κύριος
  choice: der Herr
  rationale: „Herr“ ist die übliche und sachgerechte Wiedergabe des hier als Gottesbezeichnung gebrauchten κύριος.
- source_word: ὁ θεὸς τῶν αἰώνων
  choice: der Gott der Zeitalter
  rationale: Die formnahe Wiedergabe erhält den Plural αἰώνων und damit die zeitliche Weite der Aussage, statt sie ausschließlich als Eigenschaft „ewig“ auszulegen.
theological_decisions:
- issue: Wiedergabe der Gottesbezeichnung Κύριος
  choice: der Herr
  alternative: der Gebieter
  rationale: „Der Herr“ entspricht dem etablierten biblischen Sprachgebrauch und vermeidet eine unnötige Verengung auf menschliche Herrschaft.
- issue: Deutung von ὁ θεὸς τῶν αἰώνων
  choice: der Gott der Zeitalter
  alternative: der ewige Gott
  rationale: Die gewählte Form bewahrt das konkrete Bild und den Plural des griechischen Textes. „Der ewige Gott“ ist idiomatischer, legt die Wendung jedoch eindeutiger als abstrakte Aussage über Gottes Ewigkeit aus.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Der Vers setzt syntaktisch einen vorausgehenden Gebetsgedanken fort; „entsprechend“ bleibt daher bewusst kleingeschrieben. Der griechische Anschluss mit καί wird zur natürlichen deutschen Satzgliederung als „Dann“ wiedergegeben.
