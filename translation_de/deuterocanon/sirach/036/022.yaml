  text: A crooked heart causes grief[b][a], and a very experienced man will repay him.
translation:
  language: de
  text: Ein verkehrtes Herz[a] wird Kummer bereiten, und ein vielerfahrener Mensch wird ihm vergelten.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „verdrehtes“ oder „entstelltes Herz“.'
    reason: lexical_alternative
  - marker: b
    text: Das griechische Verb kann auch allgemeiner bedeuten, dass der vielerfahrene Mensch ihm entsprechend antwortet oder etwas erwidert. Wie diese Reaktion genau aussieht, bleibt offen.
    reason: alternative_reading
lexical_decisions:
- source_word: καρδία
  choice: Herz
  rationale: Bewahrt die biblisch vertraute Bezeichnung für das innere Denken, Wollen und die charakterliche Haltung.
- source_word: στρεβλὴ
  choice: verkehrtes
  rationale: Gibt das Bild einer verdrehten oder moralisch fehlgerichteten inneren Haltung natürlich wieder, ohne den Grad der Verderbtheit genauer festzulegen.
- source_word: δώσει λύπην
  choice: wird Kummer bereiten
  rationale: Entspricht der futurischen Form und gibt die Wendung im modernen Deutschen natürlich wieder.
- source_word: ἄνθρωπος
  choice: Mensch
  rationale: Das griechische Wort bezeichnet hier in einem allgemeinen Weisheitsspruch einen Menschen; „Mensch“ wahrt den generischen Sinn ohne unnötige geschlechtliche Festlegung.
- source_word: πολύπειρος
  choice: vielerfahren
  rationale: Die kompakte, gehobene deutsche Form bewahrt den Gedanken einer Person, die durch vielfältige Erfahrung erprobt ist.
- source_word: ἀνταποδώσει
  choice: wird vergelten
  rationale: Bewahrt den wechselseitigen Sinn des Zurückgebens oder Erwider ns, ohne Art oder moralische Wertung der Reaktion festzulegen.
- source_word: αὐτῷ
  choice: ihm
  rationale: Gibt den Dativ Singular wieder und lässt wie der griechische Text den Bezug auf den durch das verkehrte Herz gekennzeichneten Menschen knapp und implizit.
theological_decisions:
- issue: Allgemeiner Personenbezug von ἄνθρωπος
  choice: Mensch
  alternative: Mann
  rationale: Im Spruch ist ἄνθρωπος generisch gebraucht. „Mensch“ bildet diesen Sinn im modernen Deutschen genau ab, ohne eine ausschließlich männliche Aussage zu erzeugen.
- issue: Bedeutung von ἀνταποδώσει im Zusammenhang
  choice: wird ihm vergelten
  alternative: wird ihm antworten / wird es ihm heimzahlen
  rationale: Der griechische Text bestimmt weder den Inhalt noch die moralische Qualität der Reaktion. „Vergelten“ erhält den reziproken Sinn und lässt diese Spannung bestehen.
translation_notes:
  register: Moderner, würdevoller Weisheitsstil. „Vielerfahren“ ist leicht gehoben, aber verständlich und bildet πολύπειρος prägnant ab; die beiden Futurformen des griechischen Textes bleiben erhalten.
