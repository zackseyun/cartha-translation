  language: en
  yaml_path: translation/deuterocanon/sirach/036/015.yaml
  text: Have compassion on the city of your sanctuary[a], Jerusalem, the city of your dwelling place.
translation:
  language: de
  text: Hab Erbarmen mit der Stadt deines Heiligtums, Jerusalem, der Stadt deiner Ruhe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Stadt deiner Wohnstätte“.'
    reason: κατάπαυμα kann sowohl den Gedanken der Ruhe als auch den eines Ruhe- oder Wohnortes ausdrücken.
lexical_decisions:
- source_word: οἰκτείρησον
  choice: Hab Erbarmen
  rationale: Der Aoristimperativ von οἰκτείρω ist eine Bitte um mitfühlendes Erbarmen. „Hab Erbarmen mit“ ist im Deutschen natürlich, würdevoll und bewahrt sowohl die emotionale als auch die barmherzige Komponente.
- source_word: πόλιν
  choice: der Stadt
  rationale: Obwohl πόλιν artikellos steht, ist die Stadt durch die Genitivattribute und die Apposition „Jerusalem“ eindeutig bestimmt. Nach „Hab Erbarmen mit“ verlangt das Deutsche den Dativ.
- source_word: ἁγιάσματός σου
  choice: deines Heiligtums
  rationale: ἁγίασμα bezeichnet etwas Geheiligtes, hier am natürlichsten ein Heiligtum. Die Genitivverbindung des griechischen Textes bleibt erhalten, ohne Jerusalem und das Heiligtum gleichzusetzen.
- source_word: Ἰερουσαλήμ
  choice: Jerusalem
  rationale: Gebräuchliche deutsche Form des Ortsnamens; als Apposition bezeichnet er die zuvor genannte Stadt.
- source_word: καταπαύματός σου
  choice: deiner Ruhe
  rationale: κατάπαυμα kann den Ort beziehungsweise Zustand des Ruhens und damit auch eine bleibende Wohnstätte bezeichnen. „Stadt deiner Ruhe“ bewahrt das Ruhe-Motiv des griechischen Ausdrucks; die mögliche Bedeutung „Wohnstätte“ wird in der Fußnote genannt.
theological_decisions:
- issue: Wiedergabe der beiden Genitivbeschreibungen Jerusalems
  choice: Jerusalem wird als „Stadt deines Heiligtums“ und „Stadt deiner Ruhe“ bezeichnet.
  alternative: Jerusalem, deine heilige Stadt und deine Wohnstätte
  rationale: Der griechische Text bietet zwei parallele Beschreibungen mit πόλιν und jeweils einem Genitiv. Die Übersetzung erhält diese Struktur und lässt die Beziehung zwischen Gottes Heiligtum, Ruhe und Gegenwart offen, statt sie zu einer eindeutigen Aussage über Gottes Wohnen umzuformen.
- issue: Bedeutung von κατάπαυμα
  choice: Ruhe
  alternative: Wohnstätte
  rationale: „Ruhe“ gibt die Grundbedeutung des Wortes unmittelbar wieder und bewahrt die mögliche theologische Anspielung auf Gottes Ruhe. Da der Ausdruck zugleich einen Ort dauernder Niederlassung bezeichnen kann, wird „Wohnstätte“ als Alternative in der Fußnote angegeben.
translation_notes:
  register: Modernes, würdiges Gebetsdeutsch. Die zweimalige Bezeichnung als „Stadt“ folgt der Parallelstruktur des Griechischen. „Stadt deiner Ruhe“ ist bewusst bildhaft und etwas feierlicher; die geläufigere räumliche Deutung steht in der Fußnote.
