  text: The inward parts of a fool are like a cartwheel[a], and his thinking is like a turning axle.
translation:
  language: de
  text: Die Eingeweide eines Toren sind wie ein Wagenrad, und sein Denken gleicht einer sich drehenden Achse.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τροχὸς ἁμάξης
  choice: ein Wagenrad
  rationale: Die konkrete Wortgruppe bezeichnet das Rad eines Wagens. »Wagenrad« ist im Deutschen knapp und bewahrt das anschauliche Bild.
- source_word: σπλάγχνα
  choice: das Innere
  rationale: Das Wort bezeichnet wörtlich die inneren Organe oder Eingeweide und übertragen das innere Wesen. »Das Innere« bewahrt den körperlichen Bezug, ohne die Aussage auf Gefühle oder das Herz einzuengen.
- source_word: μωροῦ
  choice: eines Toren
  rationale: μωρός bezeichnet in der Weisheitsliteratur einen törichten Menschen. »Tor« erhält diesen moralisch-intellektuellen Sinn und passt zum würdigen sprichwörtlichen Stil.
- source_word: διαλογισμὸς
  choice: Denken
  rationale: διαλογισμός kann Gedanke, Überlegung oder Denkweise bedeuten. »Denken« ist natürlich und lässt die genaue Nuance offen.
- source_word: ὡς ἄξων στρεφόμενος
  choice: gleicht einer Achse, die sich dreht
  rationale: Die Formulierung gibt das fortdauernde Drehen des Partizips στρεφόμενος klar wieder und erhält die mechanische Bildsprache.
