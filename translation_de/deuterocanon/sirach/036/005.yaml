translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Weisheitsliteratur-Ton. Die parallelen Bilder von Wagenrad und sich drehender Achse bleiben erhalten; die ungewöhnliche körperliche Metapher wird im Haupttext behutsam verständlich gemacht und in der Fußnote wörtlicher ausgewiesen.
