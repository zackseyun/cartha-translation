translation:
  language: de
  text: Gib deinen Geschöpfen, die du am Anfang geschaffen hast, ein Zeugnis[a], und richte die Weissagungen auf, die in deinem Namen ergangen sind[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Gib deinen Schöpfungswerken vom Anfang her ein Zeugnis.“ Die knappe griechische Wendung kann Geschöpfe oder allgemeiner das von Gott am Anfang Geschaffene bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Sinngemäß möglicherweise: „Lass die Weissagungen, die in deinem Namen ergangen sind, in Erfüllung gehen.“ Wörtlich steht im Griechischen „richte die Weissagungen auf“.'
    reason: alternative_reading
lexical_decisions:
- source_word: δὸς
  choice: Gib
  rationale: Der Aoristimperativ von δίδωμι wird unmittelbar und im Deutschen natürlich als „Gib“ wiedergegeben.
- source_word: μαρτύριον
  choice: ein Zeugnis
  rationale: „Zeugnis“ bewahrt den bezeugenden, möglicherweise auch rechtlichen oder offenbarenden Sinn von μαρτύριον, ohne ihn näher festzulegen.
- source_word: τοῖς ... κτίσμασίν σου
  choice: deinen Geschöpfen
  rationale: κτίσμα bezeichnet etwas Geschaffenes oder ein Geschöpf. „Geschöpfe“ ist verständlich und lässt grundsätzlich sowohl Lebewesen als auch Geschaffenes im weiteren Sinn zu; der griechische Dativ bleibt als deutsches Dativobjekt erhalten.
- source_word: τοῖς ἐν ἀρχῇ
  choice: die von Anfang an bestehen
  rationale: Die attributive Wendung bezieht sich grammatisch auf κτίσμασιν. Die Wiedergabe macht diesen Bezug im Deutschen deutlich, ohne die Geschöpfe ausdrücklich mit Israel, den Vorfahren oder bestimmten Urwerken gleichzusetzen.
- source_word: ἔγειρον
  choice: richte ... auf
  rationale: ἐγείρω bedeutet grundlegend „aufrichten“, „aufwecken“ oder „erwecken“. Die metaphorische Wiedergabe „richte ... auf“ wahrt das ungewöhnliche Bild und legt nicht eindeutig fest, ob Erfüllung, Bekräftigung oder neues Wirksamwerden gemeint ist.
- source_word: προφητείας
  choice: die Weissagungen
  rationale: „Weissagungen“ bezeichnet hier die prophetischen Aussprüche und entspricht dem Plural mit Artikel, ohne den Gegenstand auf bloße Vorhersagen einzuengen.
- source_word: τὰς ἐπʼ ὀνόματί σου
  choice: die in deinem Namen ergangen sind
  rationale: „In deinem Namen“ gibt Vollmacht und Zuordnung der prophetischen Worte wieder. „Ergangen sind“ ergänzt im Deutschen die bei „Weissagungen“ vorausgesetzte Äußerung, ohne einen menschlichen Sprecher in den Text einzutragen.
theological_decisions:
- issue: Bezug der „Geschöpfe von Anfang an“
  choice: Gottes Geschöpfe beziehungsweise geschaffene Dinge, die von Anfang an bestehen
  alternative: Das von Gott in alter Zeit gebildete Volk oder die frühen Vorfahren; allgemeiner Gottes ursprüngliche Schöpfungswerke
  rationale: κτίσμασιν spricht seinem gewöhnlichen Sinn nach von Geschaffenem, doch die knappe griechische Formulierung und der Gebetskontext lassen eine konkretere geschichtliche Beziehung offen. Der Haupttext vermeidet daher eine unbelegte Festlegung auf Israel oder seine Vorfahren.
- issue: Bedeutung von „die Weissagungen aufrichten“
  choice: Die prophetischen Worte sollen durch Gottes Hand aufgerichtet und wirksam bestätigt werden
  alternative: Gott soll die Weissagungen erfüllen; Gott soll sie neu beleben oder wieder zur Geltung bringen
  rationale: Grammatisches Objekt sind die Weissagungen, nicht die Propheten. Die bildhafte Wiedergabe lässt offen, ob vor allem ihre Erfüllung, Bestätigung oder erneute Wirksamkeit erbeten wird.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die ungewöhnliche Metapher „Weissagungen aufrichten“ wird bewusst beibehalten, da eine glattere Formulierung die mögliche Bedeutung vorschnell auf Erfüllung festlegen würde.
