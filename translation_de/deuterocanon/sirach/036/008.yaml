  text: By the knowledge of the Lord they were distinguished, and he altered seasons and festivals.
translation:
  language: de
  text: Durch die Erkenntnis des Herrn wurden sie voneinander unterschieden, und er veränderte Zeiten und Feste.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν γνώσει Κυρίου
  choice: Durch die Erkenntnis des Herrn
  rationale: Gibt die instrumentale Bedeutung von ἐν natürlich wieder und bewahrt γνώσις als »Erkenntnis«, ohne ausdrücklich festzulegen, ob damit das Wissen des Herrn oder die Erkenntnis des Herrn durch Menschen gemeint ist.
- source_word: διεχωρίσθησαν
  choice: wurden sie voneinander unterschieden
  rationale: Das Passiv bezeichnet eine Unterscheidung beziehungsweise Absonderung; »voneinander unterschieden« passt zum Zusammenhang von Zeiten und Festen und vermeidet eine unnötig räumliche Deutung.
- source_word: ἠλλοίωσεν
  choice: veränderte
  rationale: Entspricht dem Grundsinn von ἀλλοιόω und bleibt gegenüber stärker deutenden Wiedergaben neutral.
- source_word: καιρούς
  choice: Zeiten
  rationale: Gibt die bestimmten oder festgesetzten Zeitabschnitte allgemein und verständlich wieder.
- source_word: ἑορτάς
  choice: Feste
  rationale: Die übliche, natürliche Wiedergabe für religiöse Festzeiten.
theological_decisions:
- issue: Mehrdeutigkeit von »Erkenntnis des Herrn«
  choice: Die Genitivverbindung bleibt als »Erkenntnis des Herrn« offen.
  alternative: »durch das Wissen des Herrn« oder »durch die Erkenntnis, die vom Herrn kommt«
  rationale: Der griechische Genitiv Κυρίου kann unterschiedlich bestimmt werden; der Haupttext soll diese genuine Offenheit nicht stillschweigend auflösen.
- issue: Nicht ausdrücklich genanntes Subjekt des zweiten Verbs
  choice: »er« bleibt kleingeschrieben und bezieht sich im naheliegenden Zusammenhang auf den Herrn.
  alternative: »der Herr veränderte«
  rationale: Das griechische Verb enthält nur ein implizites Subjekt. Die pronominale Wiedergabe bewahrt die Textgestalt, ohne den Bezug unnötig zu explizieren.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt eng am Griechischen, ist aber idiomatisch; die sachliche Kürze und die mögliche Spannung der Genitivverbindung werden bewahrt.
