base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/036/018.yaml
  text: Give a reward to those who wait for you[a], and let your prophets be trusted. Hear, O Lord[b], the prayer of your suppliants.
translation:
  language: de
  text: Gib denen Lohn, die auf dich warten[a], und lass deine Propheten Glauben finden[b]. Höre, Herr, das Flehen deiner Bittenden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die für dich ausharren“ oder „die dir gegenüber standhaft bleiben“. Das griechische Verb kann sowohl Warten als auch beharrliches Standhalten ausdrücken.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „lass deine Propheten als glaubwürdig erwiesen werden“ beziehungsweise „lass deinen Propheten geglaubt werden“. Die knappe griechische Formulierung kann sowohl die erwiesene Zuverlässigkeit der Propheten als auch das ihnen entgegengebrachte Vertrauen bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: δὸς μισθὸν
  choice: Gib … Lohn
  rationale: Der direkte Imperativ und μισθός werden knapp und gebetsgemäß wiedergegeben; „Lohn“ bezeichnet hier eine von Gott gewährte Vergeltung, ohne notwendig einen geschäftlichen Sinn zu tragen.
- source_word: τοῖς ὑπομένουσίν σε
  choice: denen, die auf dich warten
  rationale: ὑπομένω kann Ausharren, Standhalten oder Warten ausdrücken. Mit Gott als persönlichem Bezug ist „auf dich warten“ im Gebetszusammenhang natürlich und lässt treue Beharrlichkeit anklingen.
- source_word: οἱ προφῆταί σου ἐμπιστευθήτωσαν
  choice: lass deine Propheten Glauben finden
  rationale: Die passive Imperativform ist gedrängt und kann bedeuten, dass den Propheten vertraut beziehungsweise geglaubt wird. „Glauben finden“ bewahrt diese passive Ausrichtung in natürlichem Deutsch, ohne ausdrücklich eine Erweis- oder Bestätigungsnuance hinzuzufügen.
- source_word: εἰσάκουσον, Κύριε
  choice: Höre, Herr
  rationale: εἰσακούω bezeichnet in Gebeten ein erhörendes Hören; die knappe traditionelle Wendung ist zugleich verständlich und würdevoll.
- source_word: δεήσεως τῶν ἱκετῶν σου
  choice: das Flehen derer, die dich anrufen
  rationale: δέησις bezeichnet eine inständige Bitte, ἱκέτης einen flehentlich Bittenden. Die verbale Wiedergabe ist im heutigen Deutsch natürlicher als „deiner Bittflehenden“ und erhält die Gebetssituation.
theological_decisions:
- issue: Bedeutung von τοῖς ὑπομένουσίν σε
  choice: die auf dich warten
  alternative: die für dich ausharren / dir gegenüber standhaft bleiben
  rationale: Der Kontext ist eine Bitte um Gottes Eingreifen; „warten“ gibt die vertrauensvolle Erwartung wieder. Da das Verb zugleich Beharrlichkeit ausdrücken kann, wird diese echte Mehrdeutigkeit in einer Fußnote bewahrt.
- issue: Aussage über die Propheten in ἐμπιστευθήτωσαν
  choice: lass deine Propheten Glauben finden
  alternative: lass deine Propheten als glaubwürdig erwiesen werden / lass deinen Propheten geglaubt werden
  rationale: Der griechische Passivimperativ kann sowohl das Vertrauen der Hörenden als auch die bestätigte Glaubwürdigkeit der Propheten nahelegen. Der Haupttext löst diese Spannung nicht zugunsten einer ausdrücklichen göttlichen Beglaubigung auf.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem Gebetston. Die Imperative bleiben direkt; altertümliche Formen und unnötige Fachwörter werden vermieden. Beide Fußnotenmarker stehen an den jeweils mehrdeutigen Aussagen im Haupttext.
