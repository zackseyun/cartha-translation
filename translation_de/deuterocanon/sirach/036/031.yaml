base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/036/031.yaml
  text: For who will trust a well-armed robber[b][a], stumbling from city to city? So it is with a man who has no nest and lodges wherever evening finds him.
translation:
  language: de
  text: Denn wer wird einem gut gerüsteten Räuber[a] vertrauen, der von Stadt zu Stadt taumelt? So ist es auch mit einem Mann, der kein Nest[b] hat und dort einkehrt, wo immer es für ihn Abend wird.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „gut gegürteten Räuber“. Das griechische Adjektiv bezeichnet wörtlich jemanden, der gut gegürtet oder ausgerüstet und dadurch zum Handeln bereit ist.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „kein Nest“; ein Bild dafür, dass er kein festes Zuhause und keinen sicheren Ruheplatz hat.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐζώνῳ
  choice: gut gerüsteten
  rationale: Das Adjektiv bezeichnet wörtlich jemanden, der gut gegürtet beziehungsweise ausgerüstet und damit handlungsbereit ist. „Gut gerüstet“ bleibt im Deutschen verständlich, ohne die im Griechischen nicht ausdrücklich genannten Waffen einzutragen.
- source_word: λῃστῇ
  choice: Räuber
  rationale: Das Wort bezeichnet einen Räuber oder Wegelagerer, oft mit dem Beiklang gewaltsamer Kriminalität. „Räuber“ ist klar, gegenwärtig und nicht unnötig altertümlich.
- source_word: σφαλλομένῳ
  choice: taumelt
  rationale: Das Partizip kann Stolpern, Schwanken oder aus der Bahn Geraten bezeichnen. „Taumelt“ bewahrt das Bild instabiler Bewegung und glättet es nicht zu bloßem Wandern.
- source_word: νοσσιὰν
  choice: Nest
  rationale: Das Substantiv bezeichnet wörtlich ein Nest beziehungsweise einen Brutplatz. Das konkrete Bild eines fehlenden festen und sicheren Ortes bleibt so erhalten.
- source_word: καταλύοντι
  choice: einkehrt
  rationale: Das Verb bezeichnet hier das Unterkommen oder Übernachten an einem Ort. „Einkehrt“ passt natürlich zum rastlosen Aufenthalt an wechselnden Orten.
- source_word: οὗ ἐὰν ὀψίσῃ
  choice: wo immer es für ihn Abend wird
  rationale: Die Wendung bezieht sich auf das Spätwerden beziehungsweise den Einbruch des Abends. Die Übersetzung gibt idiomatisch wieder, dass der Mann jeweils dort bleibt, wo ihn die Abendzeit erreicht, ohne einen festen Wohnort zu haben.
- source_word: ἀνθρώπῳ
  choice: einem Mann
  rationale: Der griechische Text verwendet die maskuline Singularform in einer sprichwörtlichen Aussage. „Einem Mann“ wahrt diese Form.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die sprichwörtliche Bildsprache des griechischen Textes wird bewahrt; insbesondere bleiben das Taumeln und das Nest als konkrete Metaphern stehen. Die elliptische Vergleichsformel οὕτως ἀνθρώπῳ wird für natürliches Deutsch mit „So ist es auch mit einem Mann“ ergänzt.
