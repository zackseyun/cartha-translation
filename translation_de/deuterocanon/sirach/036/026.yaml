  text: He who acquires a wife begins an acquisition[b][a], a helper corresponding to him and a pillar of rest.
translation:
  language: de
  text: 'Wer eine Ehefrau erwirbt, macht den Anfang mit einem Erwerb[a]: einer Hilfe, die ihm entspricht[b], und einer Säule der Ruhe.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit einem Besitz“. Im Griechischen stehen „erwirbt“ und „Erwerb“ als verwandte Wörter nebeneinander.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „gemäß ihm“; gemeint sein kann eine ihm entsprechende oder zu ihm passende Hilfe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ κτώμενος
  choice: Wer … erwirbt
  rationale: Das substantivierte Partizip ist allgemein-sprichwörtlich und grammatisch männlich; die deutsche Wer-Konstruktion gibt diesen allgemeinen Sinn natürlich wieder. „Erwirbt“ bewahrt zugleich die Wortverwandtschaft mit κτήσεως.
- source_word: γυναῖκα
  choice: eine Ehefrau
  rationale: Im Zusammenhang ist γυνή als Ehefrau zu verstehen. Die ausdrücklichere deutsche Bezeichnung vermeidet die mögliche Lesart, es gehe lediglich um irgendeine Frau.
- source_word: ἐνάρχεται κτήσεως
  choice: macht den Anfang mit einem Besitz
  rationale: Die Wendung bezeichnet den Beginn beziehungsweise ersten Schritt eines Erwerbs oder Besitzes. Die bewusst etwas markante Formulierung hält die sachliche Spannung des griechischen Ausdrucks fest, ohne sie zu erklären oder abzuschwächen.
- source_word: βοηθὸν κατʼ αὐτόν
  choice: einer Hilfe, die ihm entspricht
  rationale: βοηθός bezeichnet eine helfende Person oder Hilfe; κατʼ αὐτόν drückt hier Entsprechung beziehungsweise Angemessenheit aus. „Die ihm entspricht“ bleibt näher am Griechischen als eine bloße Aussage über Nützlichkeit.
- source_word: στύλον ἀναπαύσεως
  choice: einer Säule der Ruhe
  rationale: Die konkrete architektonische Metapher „Säule“ und das mehrdeutige ἀνάπαυσις als Ruhe oder Erquickung werden in kompakter Form bewahrt.
theological_decisions:
- issue: Männlich geprägte sprichwörtliche Perspektive
  choice: Wer eine Ehefrau erwirbt
  alternative: Wer heiratet
  rationale: Die Übersetzung erhält die Perspektive des griechischen Textes, in dem ein Mann als derjenige erscheint, der eine Frau zur Ehefrau erwirbt. Eine geschlechtsneutrale Umformung würde diese historische und sprachliche Eigenart verdecken.
- issue: Beschreibung der Ehefrau als Besitz, Hilfe und Säule
  choice: Die drei Ausdrücke bleiben nebeneinandergestellt
  alternative: Die Besitzsprache abschwächen und die Frau nur als Gefährtin oder Stütze bezeichnen
  rationale: Der griechische Text verbindet κτῆσις ausdrücklich mit βοηθός und στῦλος. Die Übersetzung bewahrt diese Spannung, ohne sie zu modernisieren oder theologisch umzudeuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst beibehaltener sprichwörtlicher Knappheit. Die ungewöhnliche Besitzsprache und das Bild von der „Säule der Ruhe“ werden nicht geglättet; zwei Fußnoten machen Wortspiel und Mehrdeutigkeit transparent.
