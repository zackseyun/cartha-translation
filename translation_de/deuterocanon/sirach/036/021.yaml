translation:
  language: de
  text: Die Kehle kostet Speisen von der Jagd[a]; ebenso prüft[b] ein verständiges Herz falsche Worte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Speisen von der Jagd“ kann auch mit „Jagdbeute“ oder „Wildbret“ wiedergegeben werden.
    reason: alternative_reading
  - marker: b
    text: 'Im Griechischen steht im zweiten Satzglied kein ausdrückliches Verb; „prüft“ ist aus dem Vergleich ergänzt. Wörtlich: „Die Kehle kostet Speisen von der Jagd; ebenso ein verständiges Herz falsche Worte.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: φάρυγξ
  choice: Kehle
  rationale: Das Substantiv bezeichnet wörtlich Kehle oder Rachen. „Kehle“ bewahrt das körperliche Geschmacksbild und klingt im Deutschen weniger grob als „Rachen“.
- source_word: γεύεται
  choice: kostet
  rationale: Das Verb bezeichnet das Schmecken oder Probieren. „Kostet“ gibt hier die prüfende Geschmackswahrnehmung wieder und bereitet den Vergleich mit dem verständigen Herzen vor.
- source_word: βρώματα θήρας
  choice: Speisen von der Jagd
  rationale: βρώματα bezeichnet Essbares oder Speisen; der Genitiv θήρας weist wahrscheinlich auf die Jagd als Herkunft hin. Die Wiedergabe bleibt nahe am ungewöhnlichen griechischen Ausdruck, ohne ihn auf „Wildbret“ zu verengen.
- source_word: καρδία συνετή
  choice: ein verständiges Herz
  rationale: In der Weisheitsliteratur steht das Herz für Verstehen und Urteilsvermögen. „Verständiges Herz“ erhält dieses Menschenbild und gibt συνετή angemessen wieder.
- source_word: λόγους ψευδεῖς
  choice: falsche Worte
  rationale: Die Wortgruppe bezeichnet Worte, die durch Unwahrheit gekennzeichnet sind. „Falsche Worte“ ist weit genug und legt nicht ausschließlich bewusste Lüge oder Täuschungsabsicht fest.
- source_word: '[elliptischer Vergleich in οὕτως καρδία συνετὴ λόγους ψευδεῖς]'
  choice: prüft
  rationale: Im zweiten Satzglied fehlt im überlieferten griechischen Text ein ausdrückliches Verb. „Prüft“ ergänzt die aus γεύεται erschließbare vergleichende Handlung in natürlichem Deutsch, ohne sie mit „schmeckt“ unverständlich wörtlich zu wiederholen.
