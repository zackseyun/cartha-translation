base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/036/028.yaml
  text: For who will trust a well-armed robber[b][a], staggering from city to city? So it is with a man who has no nest and lodges wherever night finds him.
translation:
  language: de
  text: Denn wer wird einem gut gerüsteten Räuber[a] vertrauen, der von Stadt zu Stadt taumelt? So ergeht es einem Menschen, der kein Nest[b] hat und dort übernachtet, wo die Nacht ihn überrascht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „einem gut gegürteten Räuber“. Das griechische Wort bezeichnet wörtlich jemanden, der gut gegürtet und damit zum Handeln bereit ist.'
    reason: lexical_alternative
  - marker: b
    text: „Nest“ bewahrt das griechische Bild für einen festen und sicheren Aufenthaltsort.
    reason: lexical_alternative
lexical_decisions:
- source_word: τίς γὰρ πιστεύσει
  choice: Denn wer wird ... vertrauen
  rationale: πιστεύω bezeichnet hier das Vertrauen zu einer Person; „Denn“ bewahrt die begründende Funktion von γάρ.
- source_word: εὐζώνῳ λῃστῇ
  choice: einem gut gerüsteten Räuber
  rationale: εὔζωνος bedeutet wörtlich „gut gegürtet“ und bezeichnet hier einen zur Tat ausgerüsteten oder bereiten Räuber. „Gut gerüstet“ erhält diese Bildhaftigkeit, ohne ausdrücklich Waffen in den Text einzutragen.
- source_word: σφαλλομένῳ ἐκ πόλεως εἰς πόλιν
  choice: der von Stadt zu Stadt taumelt
  rationale: σφάλλομαι kann ein Taumeln, Straucheln oder unsicheres Umhergetriebensein bezeichnen. „Taumelt“ bewahrt die auffällige Instabilität des griechischen Ausdrucks.
- source_word: οὕτως ἀνθρώπῳ
  choice: So ergeht es einem Menschen
  rationale: Die Formulierung gibt den knappen Vergleich idiomatisch wieder. ἄνθρωπος ist hier allgemein menschlich gebraucht, daher „Mensch“ statt eines unnötig geschlechtsspezifischen Ausdrucks.
- source_word: μὴ ἔχοντι νοσσιὰν
  choice: der kein Nest hat
  rationale: νοσσιά bezeichnet wörtlich ein Nest beziehungsweise einen Nistplatz. Das konkrete Bild wird bewahrt und nicht vorschnell zu „Heim“ verflacht.
- source_word: καταλύοντι
  choice: übernachtet
  rationale: καταλύω bezeichnet in diesem Zusammenhang das Einkehren oder Quartiernehmen; „übernachtet“ passt besonders zum folgenden Abend- beziehungsweise Nachtmotiv.
- source_word: οὗ ἐὰν ὀψίσῃ
  choice: wo die Nacht ihn überrascht
  rationale: ὀψίζω bezieht sich auf das Spätwerden oder den Eintritt des Abends. Die deutsche Wendung gibt den Sinn natürlich wieder, ohne einen festen Aufenthaltsort zu unterstellen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter Spruchbildlichkeit. Die ungewöhnliche Bewegung des Räubers wird mit „taumelt“ wiedergegeben; der Parallelismus verbindet ihn mit dem Menschen ohne festen Aufenthaltsort. Alle Fußnotenmarker stehen an den einschlägigen Stellen im Haupttext.
