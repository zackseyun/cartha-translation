  terminology: »Zaun«, »Besitz« und »geplündert« sind passende, nicht überbestimmende Entsprechungen. »Ehefrau« vermeidet, dass »Frau« hier als beliebige weibliche Person verstanden wird, ohne eine über den Kontext hinausgehende Deutung einzutragen.
