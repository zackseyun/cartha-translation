base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/036/027.yaml
  text: Where there is no fence[a], the property will be plundered; and where there is no wife[b], he will groan as he wanders.
translation:
  language: de
  text: Wo kein Zaun[a] ist, wird der Besitz geplündert; und wo keine Ehefrau[b] ist, wird er seufzen, während er umherwandert.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Hecke« beziehungsweise »Einfriedung«. Das griechische Wort bezeichnet eine schützende Abgrenzung um einen Besitz.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich steht im Griechischen: »und wo keine Frau ist, wird seufzen, umherwandernd«; der Mann beziehungsweise Hausherr ist als Subjekt nur mitgedacht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: φραγμός
  choice: Zaun
  rationale: Das Wort bezeichnet eine schützende Abgrenzung oder Einfriedung. »Zaun« bewahrt das konkrete Bild, ohne eine Mauer oder Hecke vorauszusetzen.
- source_word: διαρπαγήσεται
  choice: wird geplündert
  rationale: Das Futur Passiv drückt aus, dass andere den Besitz gewaltsam an sich nehmen; »wird geplündert« gibt diese Gefährdung treffend wieder.
- source_word: κτῆμα
  choice: Besitz
  rationale: Der Ausdruck kann Eigentum oder Besitz allgemein bezeichnen. »Besitz« ist verständlich und legt weder ein großes Landgut noch ausschließlich bewegliche Güter nahe.
- source_word: γυνή
  choice: Frau
  rationale: Im häuslichen Zusammenhang ist eine Ehefrau gemeint. Das deutsche »Frau« ist natürlich und bewahrt zugleich die im Einzelwort vorhandene Bedeutungsbreite.
- source_word: στενάξει
  choice: wird seufzen
  rationale: »Seufzen« bezeichnet hörbar ausgedrückte Bedrängnis und entspricht dem Verb im sprichwörtlichen Zusammenhang natürlicher als das körperlich stärker wirkende »stöhnen«.
- source_word: πλανώμενος
  choice: während er umherirrt
  rationale: Die präsentische Partizipialform beschreibt den begleitenden, andauernden Zustand. Die Nebensatzform ist im modernen Deutschen natürlich und erhält das zeitliche Verhältnis.
- source_word: οὗ οὐκ ἔστιν ... καὶ οὗ οὐκ ἔστιν
  choice: Wo kein ... ist; und wo keine ... ist
  rationale: Die wiederholte Ortskonstruktion erhält den parallelen, sprichwortartigen Aufbau des Griechischen.
theological_decisions:
- issue: Unausgesprochenes Subjekt im zweiten Satzteil
  choice: wird er seufzen
  alternative: wird ein Mann seufzen
  rationale: Im Griechischen steht kein ausdrückliches Substantiv als Subjekt. Das Pronomen »er« lässt den durch den häuslichen Zusammenhang nahegelegten Mann erkennen, ohne »ein Mann« ausdrücklich in den Text einzufügen.
- issue: Bedeutung von γυνή im häuslichen Zusammenhang
  choice: Frau im Sinn von Ehefrau
  alternative: Frau im allgemeinen Sinn
  rationale: Die Gegenüberstellung von geschütztem Besitz und geordnetem Haushalt legt »Ehefrau« nahe; die Übersetzung mit »Frau« vermeidet jedoch eine unnötige Ausdeutung im Haupttext.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewahrtem Parallelismus. Die etwas ungewöhnliche Subjektsetzung des zweiten Satzteils wird nicht durch ein zusätzliches Substantiv geglättet; eine Fußnote erläutert die griechische Ellipse.
