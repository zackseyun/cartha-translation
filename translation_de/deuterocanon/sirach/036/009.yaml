translation:
  language: de
  text: Manche von ihnen erhob und heiligte er, andere ordnete er in die Reihe der Tage ein.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: »setzte er in eine Zahl von Tagen«. Im Zusammenhang sind wohl die gewöhnlichen Tage im Unterschied zu den besonders geheiligten gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπ᾽ αὐτῶν / ἐξ αὐτῶν
  choice: Einige von ihnen / andere
  rationale: Beide Wendungen bezeichnen eine Auswahl aus derselben zuvor genannten Gruppe. Die Gegenüberstellung „einige … andere“ gibt den partitiv-kontrastiven Sinn im Deutschen natürlich wieder, ohne die Bezugsgröße ausdrücklich zu benennen.
- source_word: ἀνύψωσεν
  choice: erhob
  rationale: Das Verb bedeutet „emporheben, erhöhen, auszeichnen“. „Erhob“ wahrt das Bild und den gehobenen Ton, ohne den Sinn ausschließlich auf Rang oder Ehre festzulegen.
- source_word: ἡγίασεν
  choice: heiligte
  rationale: „Heiligte“ entspricht dem religiösen Gehalt von ἁγιάζω unmittelbar und lässt offen, ob das Heiligmachen zugleich eine kultische Weihe bezeichnet.
- source_word: ἔθηκεν
  choice: rechnete … zur
  rationale: τίθημι bedeutet grundsätzlich „setzen, stellen, bestimmen“. In Verbindung mit „zur Zahl der Tage“ ist „zurechnen“ im Deutschen idiomatischer als eine räumlich klingende Wiedergabe.
- source_word: εἰς ἀριθμὸν ἡμερῶν
  choice: zur Zahl der Tage
  rationale: Die Formulierung bleibt nahe am griechischen „in die Zahl von Tagen“ und vermeidet es, das im Kontext wahrscheinlich gemeinte „gewöhnliche Tage“ ohne Kennzeichnung in den Haupttext einzutragen.
theological_decisions:
- issue: Das Subjekt der griechischen Verben ist nicht ausdrücklich genannt.
  choice: er
  alternative: Gott / der Herr
  rationale: Das deutsche Pronomen erhält den Rückbezug und fügt keinen Gottesnamen oder Titel ein, der in diesem Versglied nicht steht.
- issue: Deutung des Gegensatzes zwischen geheiligten und gezählten Tagen
  choice: zur Zahl der Tage
  alternative: zu den gewöhnlichen Tagen
  rationale: Der Kontext legt wahrscheinlich gewöhnliche, nicht besonders geheiligte Tage nahe. Da „gewöhnlich“ jedoch nicht ausdrücklich im griechischen Wortlaut steht, bleibt die knappere Form im Haupttext erhalten und die wahrscheinliche Deutung wird in der Fußnote erläutert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der parallele Satzbau macht den Gegensatz deutlich; die leicht ungewöhnliche Wendung „zur Zahl der Tage“ bewahrt zugleich die Bildsprache und Mehrdeutigkeit des griechischen Textes.
