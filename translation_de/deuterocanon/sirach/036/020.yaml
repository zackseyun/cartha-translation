translation_notes:
  register: Modernes, klares und zugleich würdiges Standarddeutsch. Die sentenzartige Kürze des griechischen Verses bleibt erhalten; auf eine Fußnote wurde verzichtet, da die idiomatische Vergleichsform den Sinn vollständig und ohne theologische Glättung wiedergibt.
