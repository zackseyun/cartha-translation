  text: Every food is eaten by the stomach[a], but one food is better than another.
translation:
  language: de
  text: Jede Speise nimmt der Magen auf, doch eine Speise ist besser als die andere.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πᾶν βρῶμα
  choice: Jede Speise
  rationale: Die distributive Wiedergabe erfasst die allgemeine, sprichwortartige Aussage. „Speise“ ist ein würdiges, noch gut verständliches Wort für βρῶμα.
- source_word: φάγεται
  choice: nimmt … auf
  rationale: Die formal futurische Passivform hat hier wohl gnomische Bedeutung. Eine wörtliche Wiedergabe wie „wird gegessen“ wäre mit „Magen“ als Handelndem im Deutschen unnatürlich; „nimmt … auf“ bewahrt die Aussage über die Aufnahme von Nahrung.
- source_word: κοιλία
  choice: Magen
  rationale: Im Zusammenhang mit Speise bezeichnet κοιλία den Verdauungsbereich; „Magen“ ist im modernen Deutsch präzise und idiomatisch.
- source_word: ἔστιν δὲ
  choice: doch
  rationale: '„Doch“ gibt den knappen adversativen Übergang wieder: Der Magen nimmt jede Speise auf, dennoch unterscheiden sich Speisen in ihrer Güte.'
- source_word: βρῶμα βρώματος κάλλιον
  choice: eine Speise ist besser als die andere
  rationale: Die griechische Vergleichskonstruktion lautet wörtlich etwa „Speise ist besser als Speise“. Die gewählte deutsche Form gibt den Vergleich natürlich wieder, ohne ihn inhaltlich auszuweiten.
