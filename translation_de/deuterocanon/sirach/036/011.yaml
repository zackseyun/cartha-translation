  yaml_path: translation/deuterocanon/sirach/036/011.yaml
  text: In fiery wrath let the survivor be consumed[a], and let those who do injustice to your people meet destruction.
translation:
  language: de
  text: In feurigem Zorn werde der Entronnene verzehrt[a], und mögen alle, die deinem Volk Unrecht tun, das Verderben finden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: »der Gerettete« oder »der Bewahrte«. Die griechische Wendung ist in diesem Zusammenhang schwierig und kann einen Feind meinen, der der Vernichtung bisher entronnen ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ὀργῇ πυρός
  choice: In feurigem Zorn
  rationale: Die Wendung lautet wörtlich etwa »im Zorn des Feuers«. Die attributive Wiedergabe bewahrt sowohl den Zorn als auch das Feuerbild und klingt zugleich in modernem Deutsch natürlich.
- source_word: καταβρωθήτω
  choice: werde ... verzehrt
  rationale: Der passive Imperativ bezeichnet ein vollständiges Aufgezehrt- oder Verzehrtwerden. »Verzehrt« passt zum unmittelbar vorausgehenden Feuerbild, ohne dieses Verb selbst auf »verbrennen« zu verengen.
- source_word: ὁ σωζόμενος
  choice: der Entronnene
  rationale: Das substantivierte Partizip kann denjenigen bezeichnen, der gerettet oder bewahrt wird. Im feindlichen Gerichtskontext liegt jedoch der Sinn »der bisher Entronnene« nahe. Die echte Mehrdeutigkeit bleibt in einer Fußnote sichtbar.
- source_word: οἱ ἀδικοῦντες τὸν λαόν σου
  choice: alle, die deinem Volk Unrecht tun
  rationale: Die Formulierung gibt die fortdauernde verbale Handlung wieder und vermeidet die inhaltliche Verengung auf eine bestimmte Art der Unterdrückung.
- source_word: εὕροισαν ἀπώλειαν
  choice: mögen ... das Verderben finden
  rationale: Der Optativ drückt hier einen Wunsch beziehungsweise eine Bitte aus. »Das Verderben finden« bleibt dem griechischen Ausdruck eng verbunden und ist im gehobenen biblischen Register verständlich.
theological_decisions:
- issue: Verwünschender beziehungsweise bittender Gerichtscharakter
  choice: Die Bitte um Gericht wird als unmittelbarer Wunsch beibehalten.
  alternative: Den Satz zu einer bloßen Vorhersage kommenden Gerichts abschwächen.
  rationale: Sowohl der passive Imperativ καταβρωθήτω als auch der Optativ εὕροισαν tragen im Kontext imprekative Kraft. Die theologische Spannung der Bitte um vernichtendes Gericht darf nicht aufgelöst werden.
- issue: Mehrdeutigkeit von ὁ σωζόμενος
  choice: Im Haupttext kontextuell »der Entronnene«, mit wörtlicherer Alternative in der Fußnote.
  alternative: Ohne Erläuterung »der Gerettete« oder »der Bewahrte« schreiben.
  rationale: Eine ausschließlich soteriologische Wiedergabe wäre im Kontext missverständlich; zugleich darf die lexikalisch mögliche Bedeutung »der Gerettete/Bewahrte« nicht verschwiegen werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Konstruktionen »werde ... verzehrt« und »mögen ... finden« erhalten den Gebets- und Gerichtscharakter, ohne unnötig altertümlich zu wirken.
