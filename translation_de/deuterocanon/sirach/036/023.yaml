  text: A woman will accept any male[a], but one daughter is better than another.
translation:
  language: de
  text: Eine Frau wird jeden Mann annehmen[a], doch eine Tochter ist besser als die andere.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Eine Ehefrau wird jeden Mann annehmen.“ Das griechische Wort γυνή kann sowohl „Frau“ als auch „Ehefrau“ bedeuten; ἄρρην bezeichnet wörtlich eine männliche Person.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα ἄρρενα
  choice: jeden Mann
  rationale: 'πάντα mit dem Singular ἄρρενα hat distributiven Sinn: „jeden/beliebigen Mann“. ἄρρην bezeichnet das männliche Geschlecht ausdrücklich; im Deutschen wäre „jedes Männliche“ jedoch unnatürlich und entmenschlichend, während „jeden Mann“ den Bezug auf eine männliche Person idiomatisch wiedergibt.'
- source_word: ἐπιδέξεται
  choice: nimmt … an
  rationale: Das Futur Medium bezeichnet hier das Annehmen oder Akzeptieren. Das deutsche Präsens eignet sich für eine zeitlos formulierte sprichwörtliche Aussage und gibt die Aussage natürlicher wieder als ein ausdrücklich zukünftiges „wird annehmen“.
- source_word: γυνή
  choice: eine Frau
  rationale: γυνή kann „Frau“ oder „Ehefrau“ bedeuten. Da der griechische Satz den Ehestatus nicht ausdrücklich festlegt, bewahrt „eine Frau“ die allgemeinere Bedeutung; die mögliche eheliche Lesart wird in der Fußnote genannt.
- source_word: ἔστιν δὲ
  choice: doch
  rationale: δέ kennzeichnet den Gegensatz zwischen den beiden Satzhälften. „Doch“ gibt diesen knappen, sprichwörtlichen Kontrast würdig und natürlich wieder.
- source_word: θυγάτηρ θυγατρὸς
  choice: eine Tochter … als die andere
  rationale: 'Die Wiederholung des Substantivs mit dem Genitiv beim Komparativ ist vergleichend zu verstehen: Eine Tochter ist besser als eine andere. Eine wörtliche Wiedergabe als „Tochter einer Tochter“ wäre irreführend.'
- source_word: κρεῖσσον
  choice: ist besser
  rationale: κρεῖσσον ist der Komparativ „besser/überlegen“. „Ist besser“ ist im Deutschen die klare und natürliche Formulierung.
theological_decisions:
- issue: Sozialer Kontext des Sprichworts
  choice: Die Aussage als allgemeine Beobachtung über Frauen und Töchter wiedergeben, ohne Ehe, Moral oder Bewertung erläuternd hinzuzufügen.
  alternative: γυνή ausdrücklich als „Ehefrau“ deuten und den Satz eindeutig auf die Partnerwahl beziehen oder seine patriarchalische Ausdrucksweise abschwächen.
  rationale: Der griechische Text ist knapp, geschlechtsspezifisch und sprichwörtlich. Die Übersetzung bewahrt diese Spannung und die soziale Vorstellungswelt des Textes, ohne sie zu bestätigen, zu entschärfen oder konfessionell auszudeuten.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit knapper, würdiger Spruchform. Das Präsens gibt den gnomischen Charakter wieder. Die im Griechischen vorhandene geschlechtsspezifische Aussage bleibt unverändert erkennbar.
