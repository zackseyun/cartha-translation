  yaml_path: translation/deuterocanon/sirach/036/016.yaml
  text: Fill Zion with your praises[b][a], and your people with your glory.
translation:
  language: de
  text: Fülle Zion mit deinem Lobpreis[a] und dein Volk mit deiner Herrlichkeit[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit der Verkündigung deiner mächtigen Taten“ oder „mit dem Ruhm deiner Vorzüge“. Das griechische Wort kann den Lobpreis oder das rühmende Erzählen lobenswerter Eigenschaften und Taten bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „und dein Volk von deiner Herrlichkeit“ beziehungsweise „aus deiner Herrlichkeit“. Gemeint ist sinngemäß, dass Gottes Volk mit der von ihm kommenden Herrlichkeit erfüllt wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πλῆσον
  choice: Fülle
  rationale: Der Aoristimperativ formuliert eine unmittelbare Bitte und bewahrt mit „Fülle“ das konkrete Bild des Erfüllens.
- source_word: Σιὼν
  choice: Zion
  rationale: „Zion“ ist die im modernen deutschen Bibelgebrauch übliche Namensform.
- source_word: ἀρεταλογίας σου
  choice: mit deinem Lobpreis
  rationale: Das seltene Substantiv kann Lobpreis sowie die rühmende Verkündigung hervorragender Eigenschaften oder mächtiger Taten bezeichnen. „Lobpreis“ ist im Gebetszusammenhang natürlich, ohne die Bedeutung auf eine einzelne Art von Tat festzulegen; die weitere Spannweite wird in einer Fußnote erhalten.
- source_word: ἀπὸ τῆς δόξης σου
  choice: mit deiner Herrlichkeit
  rationale: Obwohl ἀπό gewöhnlich „von/aus“ bedeutet, bezeichnet die Wendung beim Verb des Füllens sinngemäß den Ursprung beziehungsweise Inhalt der Fülle. Im Deutschen gibt „mit deiner Herrlichkeit“ dies natürlich wieder.
- source_word: τὸν λαόν σου
  choice: dein Volk
  rationale: Direkte und idiomatische Wiedergabe des Akkusativobjekts mit possessivem Genitiv.
theological_decisions:
- issue: Bedeutungsumfang von ἀρεταλογία im Wiederherstellungsgebet
  choice: „Lobpreis“ im Haupttext
  alternative: „Verkündigung deiner mächtigen Taten“, „Ruhm deiner Vorzüge“ oder „Rühmen deiner großen Taten“
  rationale: Der griechische Ausdruck kann sowohl das Lob selbst als auch das rühmende Erzählen von Gottes Eigenschaften und Taten hervorheben. Der Haupttext bleibt lesbar; die echte lexikalische Offenheit wird in der Fußnote ausgewiesen.
- issue: Funktion von ἀπό nach dem Verb des Füllens
  choice: „mit deiner Herrlichkeit“
  alternative: „von deiner Herrlichkeit“ oder „aus deiner Herrlichkeit“
  rationale: Eine wörtliche Wiedergabe mit „von/aus“ wäre im Deutschen schwer verständlich. „Mit“ bezeichnet idiomatisch das, womit das Volk erfüllt wird, während die Fußnote den möglichen Herkunftsaspekt des griechischen Ausdrucks dokumentiert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch in knapper Gebetssprache. Die parallele Satzform des Griechischen bleibt erhalten; das im zweiten Glied ergänzte Verb „fülle“ wird im Deutschen wie im Ausgangstext elliptisch mitverstanden.
