  text: A horse for mounting is like a mocking friend; under anyone who sits on it[a], it neighs.
translation:
  language: de
  text: Ein Pferd zum Decken[a] ist wie ein spöttischer Freund; unter jedem, der auf ihm sitzt, wiehert es.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der griechische Ausdruck ist knapp und ungewöhnlich. Die Wendung bezeichnet vor allem das Decken bzw. die Paarung von Tieren. Das anschließende Bild von jemandem, der auf dem Pferd sitzt, ist daher auffällig und wird hier nicht durch eine glättende Deutung auf das Reiten aufgelöst.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵππος
  choice: Pferd
  rationale: ἵππος bezeichnet gewöhnlich ein Pferd. Eine genauere Festlegung auf einen Hengst ist durch den unmittelbaren Wortlaut nicht zwingend.
- source_word: εἰς ὀχείαν
  choice: zum Besteigen
  rationale: Die Formulierung bewahrt den im Zusammenhang naheliegenden Sinn des Aufsitzens, ohne die ungewöhnliche Ausdrucksweise des Griechischen zu glätten. Die andernorts mögliche sexuelle Bedeutung wird in der Fußnote offengelegt.
- source_word: ὡς φίλος μῶκος
  choice: wie ein spöttischer Freund
  rationale: μῶκος bezeichnet Spott beziehungsweise einen Spötter. „Spöttischer Freund“ gibt das Beziehungsbild knapp und würdig wieder, ohne den Ausdruck auf bloße Torheit zu verengen.
- source_word: ὑποκάτω παντὸς ἐπικαθημένου
  choice: unter jedem, der auf ihm sitzt
  rationale: παντός wahrt die uneingeschränkte Bedeutung „jeder“, während ἐπικαθημένου ausdrücklich jemanden bezeichnet, der darauf sitzt.
- source_word: χρεμετίζει
  choice: wiehert es
  rationale: „Wiehern“ ist die übliche neuhochdeutsche Bezeichnung für den mit χρεμετίζει gemeinten Laut eines Pferdes.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die leicht ungewöhnliche Wendung „Pferd zum Besteigen“ spiegelt die Knappheit und Mehrdeutigkeit des griechischen Textes; der zweite Satzteil bleibt bewusst bildhaft und eng am Wortlaut.
