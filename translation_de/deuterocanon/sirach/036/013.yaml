translation:
  language: de
  text: Sammle alle Stämme Jakobs und weise ihnen ihr Erbe zu wie am Anfang.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: „und nimm sie wie am Anfang als Erbe in Besitz“ oder „und teile sie wie am Anfang als Erbe zu“. Das seltene griechische Verb bezeichnet Erben, Erbbesitz oder Zuteilung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σύναγε
  choice: Sammle
  rationale: Der Imperativ von συνάγω fordert unmittelbar dazu auf, die zerstreuten Stämme zusammenzuführen. „Sammle“ ist natürlich und bewahrt die Gebetsform.
- source_word: πάσας φυλὰς Ἰακώβ
  choice: alle Stämme Jakobs
  rationale: Die Wendung wird direkt wiedergegeben; der ausdrücklich genannte Name Jakob wird nicht durch Israel ersetzt.
- source_word: κατακληρονομήσεις
  choice: weise ihnen ihr Erbe zu
  rationale: Das seltene Verb gehört zum Wortfeld von Erbe, Erbbesitz und Zuteilung. Die gewählte Formulierung drückt im Zusammenhang die Wiederherstellung der Stämme in ihrem angestammten Erbteil aus, ohne den Erbgedanken aufzugeben.
- source_word: αὐτούς
  choice: ihnen
  rationale: Das griechische Akkusativpronomen bezieht sich auf die Stämme. In der deutschen Wendung „ihnen ihr Erbe zuweisen“ wird diese Beziehung idiomatisch durch den Dativ ausgedrückt.
- source_word: καθὼς ἀπʼ ἀρχῆς
  choice: wie am Anfang
  rationale: Die knappe Zeitangabe bleibt offen dafür, ob die ursprüngliche Ordnung, die erste Landverteilung oder allgemein die frühere Anfangszeit gemeint ist.
theological_decisions:
- issue: Bedeutung der Erbschaftssprache in κατακληρονομήσεις
  choice: Bitte an Gott, den Stämmen ihr Erbe wieder zuzuweisen
  alternative: „nimm sie wie am Anfang als Erbe in Besitz“ oder „teile sie wie am Anfang als Erbe zu“
  rationale: Die aktive Form mit αὐτούς als direktem Objekt kann formal auch so verstanden werden, dass Gott die Stämme erbt oder sie als Erbe zuteilt. Im Zusammenhang des Sammelns der Stämme liegt jedoch die Wiederherstellung ihrer ursprünglichen Erbordnung nahe. Eine Fußnote bewahrt die echte lexikalische Mehrdeutigkeit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der kurze Gebetsimperativ bleibt erhalten; „wie am Anfang“ wird bewusst nicht näher erklärt. Die ungewöhnliche Konstruktion des griechischen Erbverbs wird im Haupttext verständlich wiedergegeben und in der Fußnote offengelegt.
