base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/036/002.yaml
  text: A wise man will not hate the law[a], but the one who is hypocritical in it is like a ship in a storm.
translation:
  language: de
  text: Ein weiser Mann wird das Gesetz nicht hassen; wer aber dem Gesetz gegenüber heuchelt[a], gleicht einem Schiff im Sturm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wer sich ihm gegenüber verstellt“. Das griechische Partizip kann Heucheln, Verstellung oder das Spielen einer Rolle bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνὴρ σοφὸς
  choice: ein weiser Mann
  rationale: ἀνήρ ist ausdrücklich maskulin; σοφός bezeichnet im Kontext der Weisheitsliteratur einen weisen Menschen. Die Formulierung bewahrt beides in natürlichem Deutsch.
- source_word: οὐ μισήσει
  choice: wird nicht hassen
  rationale: Die Futurform und die gewöhnliche Bedeutung von μισέω werden direkt wiedergegeben; eine Abschwächung zu „verachten“ ist nicht nötig.
- source_word: νόμον
  choice: das Gesetz
  rationale: Im jüdischen Weisheitskontext weist νόμος wahrscheinlich auf Gottes Gesetz beziehungsweise die Tora, ohne dass diese Deutung im Text ausdrücklich erweitert werden muss.
- source_word: ὁ δὲ ὑποκρινόμενος ἐν αὐτῷ
  choice: wer aber darin heuchelt
  rationale: Die substantivierte Partizipialkonstruktion wird als Relativsatz natürlich wiedergegeben. „Heuchelt“ bewahrt den aktiven Sinn des Verstellens oder Vorspielens; „darin“ nimmt knapp auf das Gesetz Bezug.
- source_word: ὡς ἐν καταιγίδι πλοῖον
  choice: gleicht einem Schiff im Sturm
  rationale: Die elliptische griechische Vergleichskonstruktion wird idiomatisch ergänzt. „Sturm“ gibt καταιγίς klar und würdig wieder.
theological_decisions:
- issue: Bedeutung von νόμος
  choice: „das Gesetz“ im jüdisch-weisheitlichen Sinn
  alternative: allgemeine Weisung oder Unterweisung
  rationale: Bei Jesus Sirach bezeichnet νόμος häufig Gottes Gesetz beziehungsweise die Tora, kann dabei aber zugleich den Klang göttlicher Unterweisung tragen. Die knappe Wiedergabe lässt diese Bedeutungsweite bestehen.
- issue: Aussage von ὑποκρινόμενος
  choice: aktives Heucheln in Bezug auf das Gesetz
  alternative: statische Bezeichnung als „Heuchler“ oder allgemeiner „sich verstellen“
  rationale: Das Partizip beschreibt ein Verhalten und nicht nur eine feststehende Personengruppe. Die Übersetzung bewahrt den Gegensatz zwischen echter Weisheit und instabiler, nur vorgespielter Gesetzestreue, ohne ihn auszudeuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Semikolon-Satz bewahrt die knappe Gegenüberstellung; „gleicht“ macht den im Griechischen elliptischen Vergleich flüssig, ohne seinen Gehalt zu erweitern.
