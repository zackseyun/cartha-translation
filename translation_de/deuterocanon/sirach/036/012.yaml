  yaml_path: translation/deuterocanon/sirach/036/012.yaml
  text: Crush the heads of enemy rulers[a], who say, “There is no one but us.”
translation:
  language: de
  text: 'Zerschmettere die Köpfe der Herrscher der Feinde, die sagen: »Es gibt niemanden außer uns.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: »Niemand ist da außer uns.« Die griechische Formulierung drückt ausschließende Selbstüberhebung aus. Sie kann als noch stärkere, beinahe göttliche Anmaßung verstanden werden; das Wort »Gott« steht jedoch nicht im Text.'
    reason: Bewahrt die mögliche theologische Tragweite der Aussage, ohne sie durch eine nicht ausdrücklich vorhandene Ergänzung festzulegen.
lexical_decisions:
- source_word: σύντριψον
  choice: Zerschmettere
  rationale: Der Aoristimperativ von συντρίβω bezeichnet eine gewaltsame, vernichtende Handlung. »Zerschmettere« bewahrt die Härte und Bildkraft des griechischen Verbs.
- source_word: κεφαλὰς
  choice: die Köpfe
  rationale: Das konkrete Bild des griechischen Plurals wird beibehalten und nicht zu »Macht« oder einer ähnlichen Abstraktion abgeschwächt.
- source_word: ἀρχόντων
  choice: der Herrscher
  rationale: Ἄρχων bezeichnet Personen mit Leitungs- oder Regierungsgewalt. »Herrscher« ist im Deutschen verständlich und entspricht dem politischen Autoritätsbegriff.
- source_word: ἐχθρῶν
  choice: der Feinde
  rationale: 'Der Genitiv wird formal bewahrt und am natürlichsten auf »Herrscher« bezogen: »die Herrscher der Feinde«.'
- source_word: λεγόντων
  choice: die sagen
  rationale: Das genitivische Partizip wird als deutscher Relativsatz wiedergegeben. Im Satzzusammenhang charakterisiert er die genannten Herrscher.
- source_word: Οὐκ ἔστιν πλὴν ἡμῶν
  choice: Es gibt niemanden außer uns
  rationale: Die Formulierung gibt die ausschließende Selbstüberhebung idiomatisch wieder, ohne »Gott« in den Text einzutragen.
theological_decisions:
- issue: Art der Selbstüberhebung der Feinde
  choice: »Es gibt niemanden außer uns« als Aussage ausschließender Selbstüberhebung
  alternative: »Es gibt keinen Gott außer uns«
  rationale: Im Griechischen steht das Wort »Gott« nicht. Eine quasi-göttliche Anmaßung kann mitschwingen, soll aber nicht durch eine ausdrückliche Ergänzung zur einzig möglichen Lesart gemacht werden.
- issue: Bezug des Partizips λεγόντων
  choice: Der Relativsatz wird auf die Herrscher der Feinde bezogen.
  alternative: Bezug auf die Feinde allgemein
  rationale: Wegen der übereinstimmenden Genitiv-Plural-Formen bleibt die grammatische Anbindung grundsätzlich offen; der unmittelbare Bezug auf ἀρχόντων und der Sinnzusammenhang sprechen für die gewählte Fassung.
translation_notes:
  register: Gehobenes, aber gegenwärtiges Standarddeutsch. Die gewaltsame Bildsprache des Ausgangstextes bleibt unverändert erhalten; der Ausspruch ist bewusst knapp und idiomatisch formuliert.
