  source_fidelity: Der Imperativ »Zerschmettere« gibt σύντριψον kraftvoll und konkret wieder; »Köpfe« bewahrt das wörtliche Bild. »Herrscher der Feinde« entspricht dem Genitiv ἀρχόντων ἐχθρῶν, ohne die Feinde näher zu bestimmen. Der Relativsatz kann im Deutschen, wie das griechische Genitiv-Plural-Partizip, im Kontext auf die Herrscher bezogen werden, ohne eine zusätzliche theologische Aussage einzutragen. Die Rede »Es gibt niemanden außer uns« gibt die exklusive Selbstüberhebung von Οὐκ ἔστιν πλὴν ἡμῶν angemessen wieder.
