translation:
  language: de
  text: Vieles habe ich gehasst, doch nichts davon habe ich ihm gleichgesetzt; und der Herr wird ihn hassen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πολλὰ
  choice: Vieles
  rationale: Das substantivisch gebrauchte Neutrum Plural bezeichnet viele Dinge oder Verhaltensweisen; „Vieles“ ist im Deutschen knapp und natürlich.
- source_word: ἐμίσησα
  choice: habe ich gehasst
  rationale: Das Perfekt gibt den griechischen Aorist als Rückblick auf die gesammelte Erfahrung des Sprechers idiomatisch wieder.
- source_word: οὐχ ὡμοίωσα αὐτῷ
  choice: ich bin ihm nicht gleich geworden
  rationale: ὁμοιόω kann „gleich machen“ sowie in intransitivem Sinn „gleich werden“ bedeuten. Hier liegt ein moralisches Gleichwerden mit dem zuvor genannten Mann nahe; die Formulierung bewahrt zugleich die Bildlichkeit des Griechischen.
- source_word: ὁ κύριος
  choice: der Herr
  rationale: Im weisheitlichen Zusammenhang bezeichnet κύριος Gott und wird der etablierten deutschen Bibelsprache entsprechend mit „der Herr“ wiedergegeben.
- source_word: μισήσει
  choice: wird hassen
  rationale: Das Futur von μισέω wird direkt wiedergegeben. Die Wiederholung desselben Verbs wie in ἐμίσησα bleibt erhalten.
- source_word: αὐτόν
  choice: ihn
  rationale: Das maskuline Singularpronomen verweist auf den zuvor beschriebenen Mann und wird knapp mit „ihn“ wiedergegeben.
theological_decisions:
- issue: Aussage vom Hass des Herrn
  choice: der Herr wird ihn hassen
  alternative: der Herr wird ihn verabscheuen
  rationale: Der griechische Text verwendet für den Sprecher und für den Herrn dasselbe Verb μισέω. „Hassen“ erhält die bewusste Wiederholung und die Härte der Aussage, ohne sie theologisch abzuschwächen.
translation_notes:
  register: Moderne, würdige Standardsprache mit sprichwortartiger Prägnanz. Die Parallelität der beiden Formen von „hassen“ wird bewahrt; „gleich geworden“ klingt leicht gehoben, bleibt aber allgemein verständlich.
