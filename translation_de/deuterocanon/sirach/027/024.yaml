    issue: Aktive Verbform ὡμοίωσα wird als Zustandsveränderung des Sprechers wiedergegeben.
    rationale: „Ich bin ihm nicht gleich geworden“ macht den Sprecher dem genannten Mann moralisch unähnlich. Das griechische Aktiv besagt vielmehr, dass der Sprecher die zuvor genannten vielen Dinge ihm nicht gleichsetzt; das ausgelassene Objekt und der Maßstab sollen nicht weiter ausgelegt werden.
