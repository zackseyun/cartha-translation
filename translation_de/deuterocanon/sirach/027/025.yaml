lexical_decisions:
- source_word: ὁ βάλλων λίθον εἰς ὕψος
  choice: Wer einen Stein in die Höhe wirft
  rationale: Gibt die bildhafte Konstruktion wörtlich und zugleich in natürlichem modernem Deutsch wieder.
- source_word: ἐπὶ κεφαλὴν αὐτοῦ βάλλει
  choice: wirft ihn auf seinen eigenen Kopf
  rationale: Bewahrt die Wiederholung von βάλλει und den Rückbezug auf den Täter; das ergänzte Pronomen „ihn“ macht den deutschen Satz eindeutig.
- source_word: πληγὴ δολία
  choice: ein heimtückischer Schlag
  rationale: „Heimtückisch“ bildet den Gedanken von δόλος als Arglist oder Hinterlist idiomatisch ab; „Schlag“ ist die direkte Bedeutung von πληγή im Kontext.
- source_word: διελεῖ τραύματα
  choice: reißt Wunden auf
  rationale: Gibt die trennende beziehungsweise aufspaltende Wirkung des Verbs anschaulich wieder und wahrt die ungewöhnliche Verbindung mit dem pluralischen „Wunden“.
