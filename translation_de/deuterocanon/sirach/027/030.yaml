  yaml_path: translation/deuterocanon/sirach/027/030.yaml
  text: Resentment and anger—these also are abominations[b][a], and a sinful man will cling to them.
translation:
  language: de
  text: Groll[a] und Zorn – auch sie sind Gräuel, und ein sündiger Mann hält an ihnen fest.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Rachzorn“. Μῆνις kann tief sitzenden oder rachsüchtigen Zorn bezeichnen, während ὀργή der allgemeinere Ausdruck für Zorn ist.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher etwa: „wird ihrer mächtig sein“ oder „wird Herr über sie sein“. Die griechische Wendung ist schwierig; hier wird sie im Sinn eines beharrlichen Festhaltens an diesen Lastern verstanden.'
    reason: alternative_reading
lexical_decisions:
- source_word: Μῆνις
  choice: Groll
  rationale: Das Wort bezeichnet hier einen tief sitzenden, anhaltenden und möglicherweise rachsüchtigen Zorn. „Groll“ gibt diese Dauerhaftigkeit wieder und unterscheidet den Begriff von ὀργή.
- source_word: ὀργή
  choice: Zorn
  rationale: Der geläufige Ausdruck für Zorn oder heftigen Ärger. „Zorn“ passt zum würdevollen Register und bildet neben „Groll“ keine unnötige Doppelung.
- source_word: βδελύγματα
  choice: Gräuel
  rationale: „Gräuel“ bewahrt das starke moralisch-religiöse Gewicht des griechischen Ausdrucks für verabscheuungswürdige Dinge.
- source_word: ἀνὴρ ἁμαρτωλός
  choice: ein sündiger Mann
  rationale: Die ausdrücklich maskuline Singularform und die attributive Verbindung von Substantiv und Adjektiv werden genau wiedergegeben.
- source_word: ἐγκρατὴς ἔσται αὐτῶν
  choice: hält an ihnen fest
  rationale: Die griechische Wendung ist ungewöhnlich. Im verurteilenden Zusammenhang bezeichnet sie am ehesten das feste Behalten dieser Laster; die gewählte Formulierung ist natürlich, ohne die Schwierigkeit des Ausdrucks in der Fußnote zu verschweigen.
theological_decisions:
- issue: Geschlechtsspezifische Wiedergabe von ἀνήρ
  choice: Mann
  alternative: Mensch; jemand
  rationale: Der griechische Text verwendet ausdrücklich ein maskulines Substantiv. Die Übersetzung bewahrt diese Form, ohne über ihre mögliche beispielhafte Reichweite hinauszugehen.
- issue: Deutung von ἐγκρατής im negativen moralischen Zusammenhang
  choice: hält an ihnen fest
  alternative: wird ihrer mächtig sein; wird sie beherrschen; wird von ihnen beherrscht werden
  rationale: Die übliche Bedeutung von ἐγκρατής ist hier wegen des Genitivs und der Verurteilung von Groll und Zorn schwer einzuordnen. Der Haupttext folgt der kontextuell plausiblen Bedeutung des Festhaltens, während die Fußnote die wörtlichere Lesart und damit die echte Auslegungsunsicherheit offenhält.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem weisheitlichem Ton. Der Gedankenstrich hebt die zusammenfassende Wertung hervor; „Gräuel“ erhält die starke moralisch-religiöse Aussage des Ausgangstextes.
