base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/027/028.yaml
  text: Mockery and reproach are for the proud[b][a], and vengeance will lie in wait for him like a lion.
translation:
  language: de
  text: Spott und Schmach sind für die Hochmütigen, und die Vergeltung[a] wird ihm wie ein Löwe auflauern.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Rache«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμπαιγμός
  choice: Spott
  rationale: Das Substantiv bezeichnet spöttische, höhnische Behandlung. »Spott« ist im heutigen Deutsch prägnant und bildet mit »Schmach« ein natürliches Wortpaar.
- source_word: ὀνειδισμός
  choice: Schmach
  rationale: Der Ausdruck umfasst Beschimpfung, Vorwurf und die damit verbundene öffentliche Entehrung. »Schmach« bewahrt diese soziale Dimension besser als das allgemeinere »Beleidigung«.
- source_word: ὑπερηφάνων
  choice: die Hochmütigen
  rationale: Der Genitiv Plural bezeichnet hochmütige oder überhebliche Menschen als Gruppe. »Die Hochmütigen« ist knapp, würdig und erhält den ethischen Gehalt.
- source_word: ἐκδίκησις
  choice: Vergeltung
  rationale: Das Wort bezeichnet Rache beziehungsweise vergeltende Ahndung. »Vergeltung« erhält die Schärfe der Warnung, ohne einen im Text nicht genannten persönlichen Rächer vorauszusetzen.
- source_word: ἐνεδρεύσει
  choice: wird … auflauern
  rationale: Das Verb bezeichnet verborgenes Warten mit der Absicht eines Überfalls. »Auflauern« gibt das Bild des jagenden Löwen natürlich und anschaulich wieder.
- source_word: αὐτόν
  choice: ihm
  rationale: Das griechische Objektpronomen steht im Singular, obwohl zuvor eine Personengruppe im Plural genannt wird. Der deutsche Singular bewahrt diese individualisierende Wendung der Vorlage.
theological_decisions:
- issue: Wechsel vom Plural der Hochmütigen zum singularischen Pronomen
  choice: Den Singular »ihm« beibehalten
  alternative: »ihnen« oder »einem solchen Menschen«
  rationale: Die Vorlage wechselt von der allgemeinen Gruppe im Plural zu einem einzelnen repräsentativen Angehörigen dieser Gruppe. Eine Angleichung an den Plural würde die Form des griechischen Textes glätten.
- issue: Wiedergabe von ἐκδίκησις
  choice: »Vergeltung«
  alternative: »Rache«, »Strafe« oder »Recht«
  rationale: »Vergeltung« bewahrt den Gedanken einer unheilvollen retributiven Folge und die Härte des Löwenbildes. »Recht« wäre zu schwach, während »Rache« leichter einen emotional handelnden Rächer nahelegt, den der Vers nicht nennt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit knapper, sprichwortartiger Satzform. Der auffällige Wechsel vom Plural »die Hochmütigen« zum Singular »ihm« bleibt entsprechend der griechischen Vorlage erhalten.
