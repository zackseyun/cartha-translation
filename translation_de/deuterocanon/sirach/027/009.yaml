  text: Birds settle with their own kind[b][a], and truth returns to those who practice it.
translation:
  language: de
  text: Vögel lassen sich bei ihresgleichen nieder, und die Wahrheit wird zu denen zurückkehren, die sie verwirklichen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die sie tun“ oder „die sie praktizieren“. Das Griechische spricht davon, die Wahrheit zu „tun“, das heißt sie praktisch zu verwirklichen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πετεινὰ
  choice: Vögel
  rationale: Das substantivierte Neutrum im Plural bezeichnet allgemein Vögel; die natürliche deutsche Wiedergabe bewahrt das sprichwörtliche Bild.
- source_word: πρὸς τὰ ὅμοια αὐτοῖς
  choice: bei ihresgleichen
  rationale: Die Wendung bezeichnet das, was ihnen ähnlich ist. „Bei ihresgleichen“ gibt die Zugehörigkeit idiomatisch wieder, ohne die Aussage auf eine bestimmte Vogelart einzuengen.
- source_word: καταλύσει
  choice: lassen sich nieder
  rationale: Das Verb kann hier „einkehren“, „Unterkunft nehmen“ oder „sich niederlassen“ bedeuten. Bei Vögeln ist „lassen sich nieder“ anschaulich und natürlich.
- source_word: ἀλήθεια
  choice: die Wahrheit
  rationale: Die Grundbedeutung „Wahrheit“ wahrt die begriffliche Weite und ermöglicht zugleich die im Satz angelegte Personifikation.
- source_word: πρὸς τοὺς ἐργαζομένους αὐτὴν
  choice: zu denen, die sie tun
  rationale: ἐργάζομαι mit direktem Objekt bezeichnet das Tun oder Verwirklichen. Die bewusst knappe Formulierung „die Wahrheit tun“ bewahrt die konkrete ethische Aussage des Griechischen besser als das abstraktere „wahrhaftig leben“.
- source_word: ἐπανήξει
  choice: kehrt ... zurück
  rationale: Das Futur bezeichnet ausdrücklich ein Zurückkommen. Das deutsche Präsens ist im parallel gebauten allgemeinen Weisheitsspruch idiomatisch und bewahrt die personifizierende Bewegung der Wahrheit.
theological_decisions:
- issue: Personifikation der Wahrheit und ethische Entsprechung
  choice: Die Wahrheit „kehrt zurück“ zu denen, die sie tun.
  alternative: Die Wahrheit kommt zu denen, die nach ihr handeln.
  rationale: ἐπανήξει bezeichnet nicht bloß ein Kommen oder eine Verbindung, sondern ein Zurückkehren. Die Wiedergabe wahrt die offene, personifizierte Logik des Weisheitsspruchs, ohne den Mechanismus dieser Entsprechung dogmatisch zu erklären.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit sprichwörtlicher Knappheit. Die Parallelität der beiden Satzhälften und die Personifikation der Wahrheit bleiben erhalten.
