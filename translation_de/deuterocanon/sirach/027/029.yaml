base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/027/029.yaml
  text: Those who rejoice at the fall of the godly will be caught in a trap[a], and pain will consume them before their death.
translation:
  language: de
  text: Wer sich über den Fall gottesfürchtiger Menschen freut, wird in einer Falle gefangen werden, und Schmerz wird ihn noch vor seinem Tod verzehren.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παγίδι
  choice: in einer Falle
  rationale: Der Dativ bezeichnet hier den Bereich oder das Mittel des Gefangenwerdens. „Falle“ ist im heutigen Deutsch klar und bewahrt das Bild.
- source_word: ἁλώσονται
  choice: wird … gefangen werden
  rationale: Das Futur Passiv bezeichnet ein künftiges Gefangenwerden und fügt sich unmittelbar in das Bild der Falle.
- source_word: οἱ εὐφραινόμενοι
  choice: Wer sich … freut
  rationale: Das substantivierte Partizip bezeichnet Menschen, die Freude an dem genannten Ereignis haben. Die singularische deutsche Verallgemeinerung mit „wer“ ist natürlich und erlaubt einen klaren Satzbau.
- source_word: πτώσει
  choice: über den Fall
  rationale: „Fall“ gibt πτῶσις direkt wieder, ohne genauer festzulegen, ob ein moralischer, gesellschaftlicher oder sonstiger Niedergang gemeint ist.
- source_word: εὐσεβῶν
  choice: gottesfürchtiger Menschen
  rationale: εὐσεβής bezeichnet hier Menschen, deren Haltung von Ehrfurcht vor Gott und Frömmigkeit geprägt ist. „Gottesfürchtig“ ist verständlich und vermeidet den im heutigen Deutsch teils abwertenden Klang von „fromm“.
- source_word: ὀδύνη
  choice: Schmerz
  rationale: Der Ausdruck kann körperlichen Schmerz oder schwere seelische Qual bezeichnen. „Schmerz“ bewahrt diese Offenheit.
- source_word: καταναλώσει
  choice: wird … verzehren
  rationale: „Verzehren“ erhält das kräftige Bild des Aufbrauchens oder Vernichtens.
- source_word: πρὸ τοῦ θανάτου αὐτῶν
  choice: noch vor seinem Tod
  rationale: Die Wendung ist zeitlich. „Noch vor“ gibt die warnende Zuspitzung natürlich wieder; das Singularpronomen folgt der deutschen „wer“-Konstruktion.
theological_decisions:
- issue: Wiedergabe von εὐσεβῶν in der Weisheitsliteratur
  choice: gottesfürchtiger Menschen
  alternative: der Frommen / der Gottesfürchtigen
  rationale: Die Formulierung bewahrt die moralisch-religiöse Bedeutung, ohne eine spätere technische Kategorie einzutragen. Das ergänzte „Menschen“ macht den substantivischen Gebrauch im modernen Deutsch transparent.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die kollektiv-pluralische griechische Aussage wird idiomatisch als allgemeiner „Wer“-Satz formuliert; Aussagekraft und Vergeltungsstruktur bleiben erhalten.
