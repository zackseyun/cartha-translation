  text: One who winks with the eye devises evil things[a], and no one will turn him away from them.
translation:
  language: de
  text: Wer mit dem Auge Zeichen gibt, schmiedet Böses, und niemand wird ihn davon abbringen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das griechische Pronomen steht im Singular: wörtlich „von ihm“ oder „davon“. Gemeint ist wahrscheinlich das Böse beziehungsweise das böse Vorhaben, doch der genaue Bezug bleibt offen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διανεύων ὀφθαλμῷ
  choice: mit dem Auge Zeichen gibt
  rationale: Das Partizip bezeichnet ein Zeichen oder eine Geste; zusammen mit dem instrumentalen Dativ ὀφθαλμῷ ist ein verstohlenes Augensignal gemeint. Die Formulierung ist im Deutschen klarer und weniger mehrdeutig als „zwinkert“.
- source_word: τεκταίνει
  choice: schmiedet
  rationale: Das Verb bezeichnet ursprünglich das handwerkliche Herstellen und hier bildlich das planvolle Ausdenken. „Schmiedet“ bewahrt dieses Bild und passt idiomatisch zu einem bösen Vorhaben.
- source_word: κακά
  choice: Böses
  rationale: Der substantivierte Plural bezeichnet böse Dinge oder Taten in offener Breite. Das kollektive deutsche „Böses“ erhält die moralische Aussage, ohne sie auf bestimmte Anschläge oder Pläne einzuengen.
- source_word: οὐδεὶς αὐτὸν ἀποστήσει
  choice: niemand wird ihn abbringen
  rationale: Die Wendung bezeichnet, dass jemand von seinem Tun oder Vorhaben abgebracht wird. Die deutsche Formulierung gibt den kausativen Sinn natürlich wieder.
- source_word: ἀπʼ αὐτοῦ
  choice: davon
  rationale: Das griechische Pronomen steht im Singular und sein genauer Bezug bleibt grammatisch offen. „Davon“ ist im Deutschen idiomatisch und bewahrt diese Unbestimmtheit besser als eine pluralische Auflösung.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. „Mit dem Auge Zeichen gibt“ macht die verstohlene Geste verständlich; „schmiedet Böses“ bewahrt zugleich das handwerkliche Bild des griechischen Verbs. Die Schlusswendung lässt die echte Bezugsunschärfe des griechischen Singularpronomens bestehen.
