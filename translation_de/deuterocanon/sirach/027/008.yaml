translation:
  language: de
  text: Wenn du dem Rechten[a] nachjagst, wirst du es erlangen und es anziehen wie ein bis zu den Füßen reichendes Gewand der Herrlichkeit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Gerechtigkeit“; auch: „der Rechtschaffenheit“. Der griechische Ausdruck umfasst sowohl das sittlich Rechte als auch gerechtes Handeln.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διώκῃς
  choice: dem ... nachjagst
  rationale: Das Verb bezeichnet ein entschlossenes Verfolgen oder Nachstreben. „Nachjagen“ bewahrt diese aktive, intensive Bildsprache besser als das schwächere „suchen“.
- source_word: τὸ δίκαιον
  choice: dem Rechten
  rationale: Das substantivierte Neutrum bezeichnet breit das, was recht und gerecht ist. „Das Rechte“ ist im Deutschen natürlich und bewahrt die mögliche Beziehung sowohl auf persönliche Rechtschaffenheit als auch auf gerechtes Handeln.
- source_word: καταλήμψῃ
  choice: wirst du es erlangen
  rationale: Das Verb kann wörtlich „einholen“ oder „ergreifen“ bedeuten. Im Zusammenhang des moralischen Nachstrebens drückt „erlangen“ das erfolgreiche Erreichen idiomatisch aus, während die Verfolgungsmetapher im ersten Satzteil erhalten bleibt.
- source_word: ἐνδύσῃ
  choice: es anziehen
  rationale: Die mediale Form wird im Deutschen natürlich mit „anziehen“ wiedergegeben und erhält das Kleidungsbild unmittelbar.
- source_word: ποδήρη
  choice: Gewand
  rationale: Das Wort bezeichnet ein bis zu den Füßen reichendes Kleid. „Gewand“ ist würdig und verständlich; die genauere Längenangabe wird in der Fußnote nicht benötigt, da sie für die Kernaussage nicht entscheidend ist.
- source_word: δόξης
  choice: der Herrlichkeit
  rationale: Der Genitiv bleibt als „der Herrlichkeit“ erhalten. Dies wahrt die gehobene Bildsprache und die semantische Weite zwischen sichtbarem Glanz, Ehre und Herrlichkeit.
theological_decisions:
- issue: Wiedergabe von τὸ δίκαιον im weisheitlichen Kontext
  choice: das Rechte
  alternative: Gerechtigkeit; Rechtschaffenheit
  rationale: Der griechische Ausdruck ist ein substantiviertes Neutrum und kann sowohl das sittlich Rechte als auch Gerechtigkeit oder rechtschaffenes Verhalten bezeichnen. „Das Rechte“ bewahrt diese Breite besser als das im Deutschen potenziell institutionell oder sozial verengte „Gerechtigkeit“ und vermeidet zugleich eine ausschließlich innere Deutung durch „Rechtschaffenheit“.
- issue: Bildhafte Beziehung zwischen Verfolgen und Erlangen
  choice: nachjagen ... erlangen
  alternative: verfolgen ... einholen
  rationale: „Einholen“ würde die fortlaufende Metapher besonders eng abbilden, klingt beim abstrakten Objekt „das Rechte“ jedoch weniger natürlich. „Erlangen“ wahrt den Erfolg des Strebens, ohne die Aussage theologisch zu überbestimmen.
translation_notes:
  register: Moderne, würdige Standardsprache. „Nachjagen“ erhält die kräftige Bewegungsmetapher; „Gewand der Herrlichkeit“ bewahrt die gehobene, bildhafte Form des Griechischen.
