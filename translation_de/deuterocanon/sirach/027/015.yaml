translation:
  language: de
  text: Der Kampf der Hochmütigen ist Blutvergießen[a], und ihre Beschimpfungen sind unerquicklich anzuhören.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Der Streit der Hochmütigen ist Blutvergießen, und ihre Beschimpfung ist eine üble Kunde.“ Der griechische Wortlaut lässt sowohl bei „Kampf/Streit“ als auch bei „Hören/Kunde“ eine formalere Wiedergabe zu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔκχυσις αἵματος
  choice: Blutvergießen
  rationale: Die Wortverbindung bezeichnet wörtlich das Vergießen von Blut; „Blutvergießen“ ist im Deutschen natürlich und bewahrt die gewaltsame Aussage.
- source_word: μάχη
  choice: Streit
  rationale: μάχη kann Kampf, Gefecht oder Streit bezeichnen. Im weisheitlichen Zusammenhang gibt „Streit“ zwischenmenschliche Auseinandersetzung wieder, ohne den möglichen gewaltsamen Ausgang auszublenden.
- source_word: ὑπερηφάνων
  choice: der Hochmütigen
  rationale: Die substantivierte Bezeichnung kennzeichnet Menschen durch Hochmut. „Die Hochmütigen“ ist prägnant und entspricht dem würdevollen Register.
- source_word: διαλοιδόρησις
  choice: Beschimpfungen
  rationale: Das Wort bezeichnet schmähende, beleidigende Rede. „Beschimpfungen“ ist gegenwärtiges, allgemein verständliches Deutsch und lässt offen, ob die Schmähungen einseitig oder wechselseitig sind.
- source_word: ἀκοὴ μοχθηρά
  choice: anzuhören ist schlimm
  rationale: ἀκοή kann „Hören“ oder „Kunde/Bericht“ heißen, während μοχθηρά „schlimm“, „übel“ oder „beschwerlich“ bedeuten kann. Die gewählte Fassung gibt im Kontext den naheliegenden Sinn einer unangenehmen und moralisch üblen Hörerfahrung wieder.
theological_decisions:
- issue: Zusammenhang zwischen Hochmut, gewaltsamem Streit und verletzender Rede
  choice: Der Vers wird als Weisheitsspruch über die zerstörerischen Folgen hochmütiger Auseinandersetzungen wiedergegeben; „führt zu“ macht den im nominalen griechischen Satz naheliegenden Zusammenhang idiomatisch verständlich.
  alternative: 'Formal: „Blutvergießen ist der Kampf der Hochmütigen, und ihre Beschimpfung ist eine schlimme Kunde.“'
  rationale: Der knappe griechische Nominalsatz lässt die genaue Beziehung zwischen „Blutvergießen“ und „Streit/Kampf“ sowie die Bedeutung von ἀκοή offen. Die Hauptfassung gibt den wahrscheinlichen Sinn wieder, während die Fußnote die formalere Alternative bewahrt, ohne die moralische Spannung zu glätten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Hochmütige“, „Blutvergießen“ und „Beschimpfungen“ bewahren den weisheitlichen Ernst, bleiben aber für heutige Leser unmittelbar verständlich.
