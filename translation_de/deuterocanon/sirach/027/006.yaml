  text: The fruit shows the cultivation of a tree[a]; so a man's reasoning shows the inclination of his heart.
translation:
  language: de
  text: An der Frucht erkennt man, wie ein Baum gepflegt wurde; so lässt eine Überlegung die innere Neigung eines Menschen erkennen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch wörtlich etwa: »so eine Überlegung über die Neigung eines Einzelnen«. Der griechische Paralleltext lautet: »So [zeigt] das Wort den Gedanken des Herzens eines Menschen« und betont damit, dass ein äußerer Ausdruck das Innere erkennen lässt.'
    reason: alternative_reading
lexical_decisions:
- source_word: עֲבֹדַת עֵץ
  choice: wie ein Baum gepflegt wurde
  rationale: Die Wendung bedeutet wörtlich etwa »Arbeit/Pflege eines Baumes«. Der griechische Paralleltext γεώργιον ξύλου bestätigt den landwirtschaftlichen Sinn. Die verbale Formulierung ist im Deutschen natürlich und macht deutlich, dass die Frucht die Pflege erkennen lässt.
- source_word: פֶרִי
  choice: Frucht
  rationale: Die übliche Bezeichnung für den Ertrag eines Baumes; sie bewahrt sowohl das konkrete Bild als auch dessen sprichwörtliche Wirkung.
- source_word: חֶשְׁבּוֹן
  choice: Überlegung
  rationale: Das Wort kann Berechnung, Erwägung oder Gedankengang bezeichnen. »Überlegung« erhält den gedanklichen Sinn, ohne es eindeutig als gesprochenes Wort wiederzugeben; der griechische Paralleltext deutet allerdings auf einen nach außen tretenden Ausdruck des inneren Denkens.
- source_word: יֵצֶר
  choice: was … angelegt ist
  rationale: יֵצֶר bezeichnet die innere Prägung, Ausrichtung oder Neigung. Die idiomatische Wendung vermeidet eine unnötig dogmatische Festlegung und lässt die anthropologische Weite des Begriffs bestehen.
- source_word: אֶחָד
  choice: eines Menschen
  rationale: Das isoliert etwas schwierige אֶחָד bedeutet hier wahrscheinlich »eines Einzelnen/eines Menschen«. Der griechische Paralleltext hat ausdrücklich ἀνθρώπου und stützt diese generische Wiedergabe.
theological_decisions:
- issue: Innere Anlage und äußerer Ausdruck
  choice: Die Überlegung zeigt, was im Herzen eines Menschen angelegt ist.
  alternative: Das Wort aus dem Gedanken des menschlichen Herzens zeigt den Menschen.
  rationale: Der hebräische Text stellt חֶשְׁבּוֹן und יֵצֶר einander gegenüber, bleibt aber hinsichtlich eines gesprochenen Ausdrucks weniger ausdrücklich als der griechische Paralleltext. Die Übersetzung folgt primär dem Hebräischen und lässt durch eine Fußnote erkennen, dass das Griechische stärker auf das nach außen tretende Wort weist.
- issue: Generische Personenbezeichnung
  choice: eines Menschen
  alternative: eines Mannes
  rationale: Hebräisch אֶחָד bezeichnet hier einen Einzelnen, während griechisch ἀνθρώπου generisch »Mensch« bedeuten kann. »Eines Menschen« ist geschlechtsübergreifend und quellengenau, ohne den Sinn männlich zu verengen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer sprichwörtlicher Parallelstruktur. »An der Frucht erkennt man« gibt die Aussagefunktion des hebräischen Satzes idiomatisch wieder; »gepflegt wurde« hält das landwirtschaftliche Bild lebendig. Die Fußnote dokumentiert die schwierige hebräische zweite Zeile und die abweichende Akzentsetzung des griechischen Paralleltextes.
