  yaml_path: translation/deuterocanon/sirach/027/020.yaml
  text: Do not pursue him[a], for he has gone far away[b], and has escaped like a gazelle from a snare.
translation:
  language: de
  text: Verfolge ihn nicht[a], denn er hat sich weit entfernt und ist entkommen wie eine Gazelle aus einer Schlinge[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Jage ihm nicht nach.« Das griechische Verb kann allgemein das Verfolgen oder Hinterherjagen bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Gemeint ist das Bild eines schnellen Wildtiers, das einer Fangschlinge entkommt. »Gazelle« kann auch mit »Reh« oder »Antilope« wiedergegeben werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ αὐτὸν διώξῃς
  choice: Verfolge ihn nicht
  rationale: διώκω bezeichnet hier das Verfolgen oder Hinterherjagen. »Verfolge« bewahrt die gebotartige Form und lässt offen, ob die Verfolgung wörtlich oder übertragen gemeint ist; »ihn« entspricht dem maskulinen Singular αὐτόν.
- source_word: μακρὰν ἀπέστη
  choice: er hat sich weit entfernt
  rationale: ἀφίστημι bezeichnet hier ein Sichentfernen oder Fortgehen; zusammen mit μακράν gibt »hat sich weit entfernt« den vollzogenen Abstand in natürlichem Deutsch wieder.
- source_word: ἐξέφυγεν
  choice: ist entkommen
  rationale: ἐκφεύγω beschreibt das erfolgreiche Entkommen aus einer Gefahr oder Falle und führt unmittelbar zum folgenden Tiervergleich.
- source_word: ὡς δορκὰς
  choice: wie eine Gazelle
  rationale: δορκάς bezeichnet ein gazellen- oder rehähnliches Wildtier. »Gazelle« ist eine klare heutige Entsprechung und vermittelt zugleich das Bild schneller Flucht.
- source_word: ἐκ παγίδος
  choice: aus einer Schlinge
  rationale: παγίς bezeichnet eine Fangschlinge oder Falle. »Schlinge« erhält das konkrete Jagdbild und passt idiomatisch zur entkommenden Gazelle.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Mahnung und das anschauliche Jagdbild des griechischen Textes bleiben erhalten; die mögliche wörtliche oder übertragene Bedeutung von »verfolgen« wird nicht eingeengt.
