  source_fidelity: 'Der deutsche Text gibt alle wesentlichen Elemente des griechischen Textes präzise wieder: das prohibitive μὴ ... διώξῃς („Verfolge ihn nicht“), den maskulinen Bezug von αὐτόν („ihn“), die vollzogene weite Entfernung (μακρὰν ἀπέστη) sowie das Entkommen im Vergleich mit einer δορκάς aus einer παγίς. „Schlinge“ ist für παγίς im Jagdbild sachgerecht.'
