  source_fidelity: Der Entwurf gibt die Vergleichs- und Begründungsstruktur von καθὼς γὰρ … οὕτως sowie die Wiederholung von ἀπόλλυμι sachgerecht wieder. Das deutsche Perfekt ist in moderner Standardsprache für die beiden abgeschlossenen Handlungen idiomatisch. „Ein Mensch“ trifft den generischen, nicht spezifisch männlichen Gebrauch von ἄνθρωπος. „Vernichtet“ bewahrt die bewusst harte Parallelisierung zwischen Feind und Freundschaft, ohne den Sinn zu verändern.
  naturalness: „Denn wie ein Mensch seinen Feind vernichtet hat, so hast du die Freundschaft deines Nächsten vernichtet“ ist verständliches, würdiges modernes Deutsch. Die leicht formelhafte Vergleichsperiode entspricht dem Weisheitsspruch und ist nicht unnatürlich.
  terminology: „Feind“, „Freundschaft“ und „Nächster“ sind treffende und im biblisch-ethischen Register etablierte Entsprechungen. Die Formulierung „die Freundschaft deines Nächsten“ folgt der Genitivform des Griechischen; die Fußnote wahrt angemessen die mögliche relationale Deutung „Freundschaft mit deinem Nächsten“.
