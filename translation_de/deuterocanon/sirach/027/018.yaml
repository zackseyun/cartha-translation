  text: For just as a man has destroyed his enemy[a], so you have destroyed the friendship of your neighbor;
translation:
  language: de
  text: Denn wie ein Mensch seinen Feind vernichtet hat, so hast du die Freundschaft deines Nächsten vernichtet.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Freundschaft mit deinem Nächsten“. Der griechische Genitiv kann sowohl die Freundschaft des Nächsten als auch die Freundschaftsbeziehung zu ihm bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς γὰρ
  choice: Denn wie
  rationale: „Denn“ bewahrt den begründenden Anschluss, während „wie … so“ die Vergleichsstruktur des Griechischen natürlich wiedergibt.
- source_word: ἀπώλεσεν / ἀπώλεσας
  choice: vernichtet hat / hast … vernichtet
  rationale: Die Wiederholung desselben starken Verbs erhält die rhetorische Entsprechung beider Satzhälften. Das deutsche Perfekt gibt die abgeschlossene Handlung in natürlicher gegenwärtiger Sprache wieder.
- source_word: ἄνθρωπος
  choice: ein Mensch
  rationale: ἄνθρωπος bezeichnet hier allgemein einen Menschen. Die deutsche Wiedergabe bleibt generisch, ohne ein biologisches Geschlecht zum Aussagepunkt zu machen.
- source_word: τὸν ἐχθρὸν αὐτοῦ
  choice: seinen Feind
  rationale: Dies ist die direkte und idiomatische Entsprechung und wahrt den Gegensatz zwischen Feind und Freundschaft.
- source_word: τὴν φιλίαν τοῦ πλησίον
  choice: die Freundschaft deines Nächsten
  rationale: Die Formulierung bleibt eng an der griechischen Genitivkonstruktion. Da der Genitiv sowohl Zugehörigkeit als auch eine Beziehung zum Nächsten ausdrücken kann, wird die Mehrdeutigkeit in einer Fußnote offengelegt.
theological_decisions:
- issue: Generische Personenbezeichnung im Weisheitsspruch
  choice: ein Mensch
  alternative: ein Mann
  rationale: Das griechische ἄνθρωπος ist zwar grammatisch maskulin, bezeichnet hier aber allgemein einen Menschen. „Ein Mensch“ gibt diese repräsentative Aussage im modernen Deutschen präzise wieder.
- issue: Stärke der Sprache über den Verlust der Freundschaft
  choice: vernichtet
  alternative: zerstört / zugrunde gerichtet
  rationale: Das zweimal verwendete ἀπόλλυμι ist stark. Die identische Wiedergabe mit „vernichtet“ wahrt die scharfe Parallele zwischen der Vernichtung des Feindes und der Vernichtung der Freundschaft.
- issue: Bezug des Genitivs τοῦ πλησίον
  choice: die Freundschaft deines Nächsten
  alternative: die Freundschaft mit deinem Nächsten
  rationale: Der griechische Genitiv lässt offen, ob die Freundschaft als diejenige des Nächsten oder als die Beziehung zu ihm verstanden wird. Der Haupttext folgt formal der Genitivkonstruktion; die relationale Lesart bleibt durch die Fußnote ausdrücklich erhalten.
translation_notes:
  register: Moderne, würdige Standardsprache. Die parallele Satzform und die Wiederholung von „vernichtet“ bewahren die knappe, eindringliche Wirkung des griechischen Weisheitsspruchs.
