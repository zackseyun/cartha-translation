base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/027/003.yaml
  text: If he does not hold fast with diligence in the fear of the Lord[a], his house will quickly be overthrown.
translation:
  language: de
  text: Wenn er nicht mit allem Ernst in der Furcht des Herrn standhaft bleibt, wird sein Haus[a] schon bald zugrunde gehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: seine Hausgemeinschaft. Das griechische Wort für »Haus« kann auch den Hausstand, die Familie oder die gesamte häusliche Gemeinschaft bezeichnen.'
    reason: 'Lexikalische Alternative: οἶκος hat hier einen weiteren möglichen Bedeutungsumfang als nur das Gebäude.'
lexical_decisions:
- source_word: ἐὰν μὴ
  choice: Wenn … nicht
  rationale: Gibt die negative Bedingung klar und idiomatisch wieder, ohne sie zu einer stärkeren Ausschließlichkeitsformulierung umzudeuten.
- source_word: ἐν φόβῳ Κυρίου
  choice: in der Furcht des Herrn
  rationale: Bewahrt die in der biblischen Weisheitsliteratur geprägte Wendung und ihre theologische Aussagekraft, statt sie auf bloße Ehrfurcht oder Frömmigkeit einzuengen.
- source_word: κρατήσῃ
  choice: standhaft bleibt
  rationale: Das objektlos gebrauchte Verb bezeichnet hier festes, beharrliches Festhalten. Die intransitive deutsche Form ist im Satz natürlich und vermeidet ein im Griechischen nicht genanntes Objekt.
- source_word: κατὰ σπουδήν
  choice: mit allem Ernst
  rationale: Drückt ernsthaften Eifer und entschiedene Sorgfalt in natürlichem modernem Deutsch aus.
- source_word: ἐν τάχει
  choice: schon bald
  rationale: Gibt die zeitliche Nähe beziehungsweise Schnelligkeit des Untergangs idiomatisch wieder.
- source_word: καταστραφήσεται
  choice: wird … zugrunde gehen
  rationale: Vermittelt den drohenden Zusammenbruch oder Ruin des Hauses, ohne die Bildsprache unnötig auf ein wörtliches Umstürzen zu beschränken.
- source_word: αὐτοῦ ὁ οἶκος
  choice: sein Haus
  rationale: Bewahrt die breite Bildsprache von οἶκος, das sowohl das Gebäude als auch Hausstand, Familie oder häusliche Gemeinschaft bezeichnen kann.
theological_decisions:
- issue: Bedeutung der »Furcht des Herrn«
  choice: Die traditionelle biblische Wendung »Furcht des Herrn« wird beibehalten.
  alternative: Ehrfurcht vor dem Herrn; Hingabe an den Herrn
  rationale: Die Formulierung trägt in der Weisheitsliteratur ein vielschichtiges theologisches Gewicht. Eine Paraphrase würde den Begriff auf nur einen seiner Aspekte verengen.
- issue: Bedeutungsumfang von οἶκος
  choice: Im Haupttext steht »Haus«; die mögliche Bedeutung »Hausgemeinschaft/Familie« wird in der Fußnote genannt.
  alternative: Hausgemeinschaft; Familie; Hausstand
  rationale: Der griechische Ausdruck legt keine dieser engeren Bedeutungen eindeutig fest. Die Übersetzung bewahrt daher die echte Mehrdeutigkeit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die traditionelle Weisheitsformel »Furcht des Herrn« bleibt erhalten; »standhaft bleibt« und »zugrunde gehen« sorgen zugleich für einen natürlichen deutschen Satzfluss.
