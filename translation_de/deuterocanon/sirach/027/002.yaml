  text: A peg will be driven in between the joints of stones[b][a], and sin will be wedged in between selling and buying.
translation:
  language: de
  text: Zwischen den Fugen der Steine wird ein Pflock fest eingetrieben,[a] und zwischen Verkauf und Kauf wird die Sünde zerrieben.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das Bild stammt aus dem Mauerwerk: Ein Pflock wird fest zwischen den Fugen von Steinen eingetrieben.'
    reason: cultural_note
  - marker: b
    text: Das griechische Verb kann „zerbrochen“, „zermalmt“ oder „zerschmettert werden“ bedeuten. Es wird nicht an das Bild des eingetriebenen Pflocks angeglichen.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνὰ μέσον
  choice: zwischen
  rationale: Die zweimalige Wendung bezeichnet jeweils den Raum zwischen zwei Seiten und trägt die parallele Struktur des Spruchs.
- source_word: ἁρμῶν λίθων
  choice: den Fugen der Steine
  rationale: ἁρμός bezeichnet eine Verbindung oder Fuge; im Zusammenhang mit Steinen ist „Fugen“ im Deutschen das natürliche Wort aus dem Mauerwerksbild.
- source_word: παγήσεται
  choice: wird … festgetrieben
  rationale: Das Futur Passiv von πήγνυμι beschreibt, wie der Pflock fest eingesetzt wird. „Festgetrieben“ erhält sowohl die konkrete Bewegung als auch das feste Sitzen.
- source_word: πάσσαλος
  choice: Pflock
  rationale: Das Wort kann einen Pflock, Zapfen oder Pfahl bezeichnen. „Pflock“ passt zur Größe und Funktion des zwischen Steinfugen befestigten Gegenstands, ohne das Bild unnötig festzulegen.
- source_word: πράσεως καὶ ἀγορασμοῦ
  choice: Verkauf und Kauf
  rationale: Die Substantive bezeichnen das Verkaufen und Kaufen. Das knappe Paar „Verkauf und Kauf“ bewahrt die formale, sprichwortartige Gegenüberstellung.
- source_word: συντριβήσεται
  choice: wird … zerrieben
  rationale: Das Futur Passiv von συντρίβω bedeutet grundsätzlich „zerbrechen, zermalmen, zerschmettern“. „Zerrieben“ ist im Deutschen mit dem Eingeklemmtsein zwischen zwei Seiten vereinbar und bewahrt zugleich die Härte des griechischen Verbs.
- source_word: ἁμαρτία
  choice: die Sünde
  rationale: „Sünde“ erhält die moralische und theologische Tragweite des Ausdrucks, statt ihn auf unlauteres Geschäftsverhalten zu verengen.
theological_decisions:
- issue: Moralische Tragweite von ἁμαρτία im Handelskontext
  choice: die Sünde
  alternative: das Unrecht
  rationale: Der griechische Ausdruck bezeichnet moralisches Verfehlen in voller Breite. Der geschäftliche Zusammenhang zeigt den Schauplatz, begrenzt die Aussage aber nicht ausdrücklich auf eine bestimmte Art von Betrug.
- issue: Verhältnis des zweiten Verbs zum Bild des festgetriebenen Pflocks
  choice: wird … zerrieben
  alternative: setzt sich … fest / wird … eingekeilt
  rationale: Der überlieferte griechische Text hat συντριβήσεται, dessen gewöhnlicher Sinn „wird zerbrochen/zerrieben“ ist. Eine Angleichung an das erste Halbversbild wäre kontextuell verständlich, würde jedoch die auffällige Spannung des griechischen Wortlauts stillschweigend beseitigen.
translation_notes:
  register: Knappe, würdige Spruchform in modernem Standarddeutsch. Die parallele Satzstruktur des Griechischen bleibt sichtbar. Der ungewöhnliche Wortlaut des zweiten Halbverses wird nicht harmonisiert, sondern durch eine Fußnote erläutert.
