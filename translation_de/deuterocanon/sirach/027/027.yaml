  to: Wer Böses tut, auf ihn wird es rollen[a], und er wird gewiss nicht erkennen, woher es über ihn kam.
  rationale: Das nicht ausdrücklich im griechischen Text enthaltene „zurück-“ wurde entfernt. So bleiben die gerichtete Bewegung auf den Täter hin und das konkrete Rollbild erhalten, ohne die retributive Bildlogik weiter auszuformulieren als der Wortlaut es tut. Die zweite Satzhälfte und die emphatische Verneinung bleiben unverändert.
