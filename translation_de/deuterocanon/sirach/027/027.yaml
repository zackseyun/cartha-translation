review_pass:
  verdict: revise
  source_fidelity: 'Die Grundbedeutung ist richtig wiedergegeben: Das vom Täter verübte Böse wird ihn treffen, und er wird dessen Herkunft nicht erkennen. Das im Haupttext ergänzte „zurück-“ ist jedoch im griechischen Wortlaut nicht ausdrücklich enthalten. εἰς αὐτὸν κυλισθήσεται beschreibt die Bewegung „auf ihn/zu ihm hin wird es rollen“; dass dies ein Zurückkehren des Bösen ist, liegt als sprichwörtlicher Zusammenhang nahe, sollte aber nicht durch das Verb selbst festgelegt werden.'
  naturalness: „Wer Böses tut, auf ihn wird es rollen“ ist modernes, bewusst sprichwörtlich-markiertes Standarddeutsch und bewahrt die Bildlichkeit. „woher es über ihn kam“ ist idiomatisch und vermittelt das widerfahrende Eintreffen angemessen.
  terminology: „Böses“ ist für πονηρά treffend. „Gewiss nicht erkennen“ gibt die Emphase von οὐ μή angemessen wieder, ohne sie zu überzeichnen. Die Fußnote sollte nicht als wörtliche Aussage ein „Zurückrollen“ ausgeben, wenn der griechische Text nur das Rollen auf den Täter hin explizit ausdrückt.
  issues:
  - severity: medium
    issue: „zurückrollen“ im Haupttext
    rationale: Das Präfix „zurück-“ deutet ausdrücklich eine Rückbewegung an. Die retributive Pointe ist kontextuell plausibel, aber εἰς αὐτόν κυλισθήσεται sagt unmittelbar nur, dass es auf ihn hin rollen wird. Die Bildfolge sollte im Deutschen ohne diese zusätzliche Festlegung stehen.
  - severity: low
    issue: Fußnote bezeichnet die Rückkehr als ausdrückliches griechisches Bild
    rationale: Die Erklärung ist als Kontextdeutung möglich, aber die Formulierung kann den Eindruck erwecken, das griechische Verb selbst enthalte „zurück“. Eine neutralere Erklärung wahrt die textliche Präzision.
  revised_text: Wer Böses tut, auf ihn wird es rollen[a], und er wird gewiss nicht erkennen, woher es über ihn kam.
  revised_footnotes:
  - marker: a
    text: Das griechische Verb zeichnet das Bild von etwas, das auf den Täter zu rollt.
