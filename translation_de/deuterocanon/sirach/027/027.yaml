  text: Whoever does evil[a], onto himself it will roll, and he will certainly not know from where it came upon him.
translation:
  language: de
  text: Wer Böses tut, auf ihn wird es rollen[a], und er wird gewiss nicht erkennen, woher es über ihn kam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Verb zeichnet das Bild von etwas, das auf den Täter zu rollt.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ποιῶν πονηρὰ
  choice: Wer Böses tut
  rationale: Der substantivierte Präsenspartizip ὁ ποιῶν hat allgemeingültige Aussagekraft; „Wer … tut“ gibt diese im heutigen Deutsch natürlich wieder. Das substantivierte Neutrum Plural πονηρά wird kollektiv als „Böses“ wiedergegeben.
- source_word: εἰς αὐτὸν κυλισθήσεται
  choice: auf den wird es zurückrollen
  rationale: Die Wendung bezeichnet eine auf den Täter gerichtete Rollbewegung. „zurückrollen“ macht die im Zusammenhang liegende Rückwirkung verständlich, ohne das anschauliche Bild durch eine abstrakte Folgerung zu ersetzen.
- source_word: οὐ μὴ ἐπιγνῷ
  choice: wird gewiss nicht erkennen
  rationale: οὐ μή mit dem Aorist Konjunktiv drückt eine nachdrückliche Verneinung aus; „gewiss nicht“ bewahrt diese Verstärkung. „erkennen“ entspricht dem präfigierten Verb ἐπιγινώσκω.
- source_word: πόθεν ἧκε αὐτῷ
  choice: woher es über ihn kam
  rationale: πόθεν bezeichnet die Herkunft, während ἧκε das Eintreffen ausdrückt. „über ihn kam“ bewahrt gegenüber dem neutraleren „zu ihm kam“ den widerfahrenden, unheilvollen Charakter.
theological_decisions:
- issue: 'Vergeltungsbild: Das Böse kehrt zum Täter zurück'
  choice: Das Bild des Zurückrollens bleibt im Haupttext erhalten.
  alternative: „Das Böse wird auf ihn zurückfallen“ oder „Seine Bosheit wird ihn selbst treffen“.
  rationale: Der griechische Text formuliert die moralische Vergeltung sprichwörtlich und mit einem konkreten Bild. Eine abstrakte Wiedergabe würde diese Bildkraft abschwächen.
- issue: Unwissenheit des Täters über den Ursprung des widerfahrenden Unheils
  choice: „er wird gewiss nicht erkennen, woher es über ihn kam“
  alternative: „er wird nie merken, woher es kommt“.
  rationale: Die Formulierung erhält sowohl die emphatische Verneinung als auch den Herkunftsaspekt von πόθεν, ohne zu erklären, weshalb der Täter den Zusammenhang nicht erkennt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit sprichwörtlicher Knappheit. Die etwas markierte Satzstellung „auf den wird es zurückrollen“ hält die gerichtete Bewegung und das Rollbild sichtbar; „Böses“ ist allgemein verständlich und bewahrt den moralischen Gehalt.
