  text: The talk of one who swears much makes the hair stand up[a], and their quarrel stops the ears.
translation:
  language: de
  text: Das Gerede eines Menschen, der viel flucht, lässt einem die Haare zu Berge stehen[a], und der Streit solcher Leute verschließt die Ohren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort πολυκόρυφου ist in seiner Bedeutung unsicher. Es kann einen Menschen meinen, der häufig flucht oder schwört, möglicherweise aber auch jemanden, der laut, anstößig oder prahlerisch redet.
    reason: lexical_alternative
lexical_decisions:
- source_word: λαλιὰ
  choice: Gerede
  rationale: Das Wort bezeichnet allgemein Rede oder Sprechen. „Gerede“ passt hier zum missbilligenden Kontext und klingt in einem deutschen Weisheitsspruch natürlich.
- source_word: πολυκόρυφου
  choice: eines Menschen, der viel flucht
  rationale: Das seltene und lexikalisch schwierige Wort dürfte einen Menschen bezeichnen, der viele Flüche oder Schwüre gebraucht; möglicherweise ist allgemeiner lautes, anstößiges oder prahlerisches Reden gemeint. Die gewählte Wiedergabe folgt dem wahrscheinlichsten Sinn, während die Unsicherheit in der Fußnote erhalten bleibt.
- source_word: ὀρθώσει τρίχας
  choice: lässt einem die Haare zu Berge stehen
  rationale: Die geläufige deutsche Wendung bewahrt das anschauliche Bild des griechischen Ausdrucks und vermittelt Entsetzen oder Schauder.
- source_word: μάχη
  choice: Streit
  rationale: Im Zusammenhang mit anstößigem Reden liegt ein Wortstreit oder Zank näher als eine buchstäbliche Schlacht.
- source_word: ἐμφραγμὸς ὤτιων
  choice: verschließt die Ohren
  rationale: Die natürliche deutsche Formulierung gibt das Bild einer Verstopfung beziehungsweise eines Verschließens der Ohren knapp wieder, ohne die anstößige Wirkung des Streits näher auszudeuten.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit sprichwörtlicher Prägnanz. „Gerede“ trägt den negativen Kontext, und „die Haare zu Berge stehen“ bewahrt das lebendige Bild. Der Wechsel vom Singular („eines Menschen“) zum griechischen Pluralbezug („ihr Streit“) wird nicht erklärend harmonisiert.
