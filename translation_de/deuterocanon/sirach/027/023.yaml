base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/027/023.yaml
  text: Before your eyes his mouth speaks sweetly[a], and he will marvel at your words; but afterward he will twist his mouth and, in regard to your words, he will cause offense.
translation:
  language: de
  text: Vor deinen Augen redet er dir honigsüß[a] zu und staunt über deine Worte; doch später verzieht er den Mund und erregt mit deinen Worten Anstoß.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „wird er deinen Mund versüßen“. Die überlieferte griechische Formulierung ist ungewöhnlich; sie kann eine schmeichelnde, süße Ansprache meinen. Möglich ist auch: „spricht er dir süß zu“.'
    reason: Die Fußnote weist die auffällige Lesart mit „deinen Mund“ nach, ohne ihre genaue idiomatische Erklärung als sicher festzulegen.
  - marker: b
    text: 'Oder: „macht er aus deinen Worten einen Fallstrick“ oder „benutzt er deine Worte, um andere oder dich zu Fall zu bringen“. Das griechische σκάνδαλον kann einen Anstoß, ein Ärgernis, ein Hindernis oder eine Falle bezeichnen.'
    reason: Die Fußnote dokumentiert die Bedeutungsbreite von σκάνδαλον und kennzeichnet die auf einen Betroffenen bezogene Deutung als Ergänzung des Kontexts.
lexical_decisions:
- source_word: ἀπέναντι τῶν ὀφθαλμῶν σου
  choice: Vor deinen Augen
  rationale: Bewahrt das anschauliche griechische Idiom und bezeichnet zugleich das Verhalten in der unmittelbaren Gegenwart des Angesprochenen.
- source_word: γλυκανεῖ στόμα σου
  choice: redet er honigsüß
  rationale: Gibt die Wirkung süßer, schmeichelnder Rede in natürlichem Deutsch wieder. Die auffällige Formulierung mit σου wird in einer Fußnote offengelegt, statt durch eine unverständliche wörtliche Wiedergabe den Sinn festzulegen.
- source_word: ἐκθαυμάσει
  choice: staunt
  rationale: Gibt die zur Schau gestellte starke Bewunderung knapp wieder, ohne die im Kontext naheliegende Unaufrichtigkeit ausdrücklich in den Wortlaut einzutragen.
- source_word: ὕστερον δὲ
  choice: doch später
  rationale: Markiert klar den Gegensatz zwischen dem schmeichelnden Auftreten und dem späteren feindseligen Verhalten.
- source_word: διαστρέψει τὸ στόμα αὐτοῦ
  choice: verzieht er den Mund
  rationale: Erhält das körperliche Bild des verdrehten Mundes und klingt zugleich idiomatisch; eine rein abstrakte Wiedergabe wie „verdreht er seine Rede“ wäre stärker deutend.
- source_word: ἐν τοῖς λόγοις σου δώσει σκάνδαλον
  choice: erregt mit deinen Worten Anstoß
  rationale: Bewahrt den verursachenden Sinn von δώσει und lässt ἐν als Mittel oder Bezugsbereich offen. „Anstoß“ hält sowohl die Bedeutung eines Ärgernisses als auch die Bildwelt eines Hindernisses im Blick.
theological_decisions:
- issue: Bedeutung von σκάνδαλον im Schlussglied
  choice: Anstoß erregen
  alternative: aus deinen Worten einen Fallstrick machen / deine Worte benutzen, um dich zu Fall zu bringen
  rationale: Der griechische Ausdruck kann ein Ärgernis, einen Anlass zum Straucheln oder eine Falle bezeichnen. Der Haupttext bleibt bewusst weit; die konkretere, im Kontext mögliche Bedeutung wird in der Fußnote genannt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Weisheitston. „Honigsüß“ macht die schmeichelnde Wirkung knapp hörbar; „verzieht den Mund“ erhält den körperlichen Kontrast. Die beiden Fußnoten legen die auffällige Lesart von στόμα σου und die Bedeutungsbreite von σκάνδαλον offen.
