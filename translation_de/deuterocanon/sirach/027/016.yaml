  text: Whoever reveals secrets destroys trust[b][a], and will never find a friend for his soul.
translation:
  language: de
  text: Wer Geheimnisse preisgibt[a], zerstört Vertrauen und wird niemals einen Freund finden, der ihm entspricht.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Vertrauliches“; wörtlich auch „Mysterien“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „einen Freund für seine Seele“. Die Wendung kann einen Freund meinen, der ihm beziehungsweise seinem innersten Wesen entspricht oder zu ihm passt.'
    reason: idiom_explanation
lexical_decisions:
- source_word: Ὁ ἀποκαλύπτων
  choice: Wer … preisgibt
  rationale: Das substantivierte Präsenspartizip formuliert eine allgemeine, sprichwörtliche Aussage. „Wer … preisgibt“ ist im Deutschen natürlich und bringt das unbefugte Offenlegen klar zum Ausdruck.
- source_word: μυστήρια
  choice: Geheimnisse
  rationale: Im Zusammenhang geht es um vertrauliche Angelegenheiten, nicht vorrangig um religiöse Mysterien. „Geheimnisse“ wahrt den weiten Sinn.
- source_word: ἀπώλεσεν
  choice: zerstört
  rationale: Der Aorist stellt die Folge als entschieden und wirksam dar. Im deutschen Sprichwortstil gibt das Präsens „zerstört“ diese allgemeingültige Konsequenz natürlich wieder.
- source_word: πίστιν
  choice: Vertrauen
  rationale: Der Zusammenhang von verratenen Geheimnissen und verlorener Freundschaft verlangt hier den zwischenmenschlichen Sinn „Vertrauen“, nicht den theologischen Sinn „Glaube“.
- source_word: οὐ μὴ εὕρῃ
  choice: wird niemals … finden
  rationale: οὐ μή mit dem Konjunktiv ist eine nachdrückliche Verneinung mit Zukunftsbezug; „wird niemals … finden“ bewahrt diese Stärke.
- source_word: φίλον
  choice: einen Freund
  rationale: Der unbestimmte Singular wird in der allgemeinen Aussage idiomatisch mit „einen Freund“ wiedergegeben.
- source_word: πρὸς τὴν ψυχὴν αὐτοῦ
  choice: der ihm wirklich nahesteht
  rationale: Die wörtliche Wendung „für seine Seele“ bezeichnet offenbar einen Freund, der dem innersten Selbst eng verbunden beziehungsweise ihm gemäß ist. Die Übersetzung gibt den idiomatischen Sinn natürlich wieder, während die Fußnote das Bild des Ausgangstextes dokumentiert.
theological_decisions:
- issue: Bedeutung von πίστις in einem nichttheologischen Weisheitskontext
  choice: Vertrauen
  alternative: Glaube; Treue; Zuverlässigkeit
  rationale: Der Vers handelt vom Preisgeben vertraulicher Dinge und dessen Auswirkung auf Freundschaft. „Vertrauen“ bildet daher den relationalen Sinn ab, ohne einen hier nicht geforderten theologischen Gehalt einzutragen.
- issue: Deutung von πρὸς τὴν ψυχὴν αὐτοῦ
  choice: der ihm wirklich nahesteht
  alternative: für seine Seele; der zu seinem Innersten passt
  rationale: Die griechische Wendung bleibt bildhaft und etwas mehrdeutig. Der Haupttext vermittelt ihre wahrscheinliche relationale Bedeutung, ohne eine besondere Lehre über die Seele daraus abzuleiten; die wörtliche Form bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit sprichwörtlicher Knappheit. „Preisgibt“ bezeichnet den Vertrauensbruch deutlicher als das neutrale „offenbart“. Die schwerfällige wörtliche Seelenwendung wird im Haupttext idiomatisch wiedergegeben und in der Fußnote bewahrt.
