- from: Wer Geheimnisse preisgibt[a], zerstört Vertrauen und wird niemals einen Freund finden, der ihm wirklich nahesteht.[b]
  to: Wer Geheimnisse preisgibt[a], zerstört Vertrauen und wird niemals einen Freund finden, der ihm entspricht.[b]
  rationale: Die Übersetzung wird nur bei der idiomatischen Wendung πρὸς τὴν ψυχὴν αὐτοῦ angepasst. „Der ihm entspricht“ ist natürliches Deutsch und lässt die im Griechischen vorhandene Offenheit zwischen persönlicher Verbundenheit und Angemessenheit bestehen. Die Fußnote bewahrt das Bild der „Seele“, ohne die Aussage einseitig festzulegen.
