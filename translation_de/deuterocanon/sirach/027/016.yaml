    issue: Die Haupttextwiedergabe von πρὸς τὴν ψυχὴν αὐτοῦ ist zu eng.
    rationale: „Der ihm wirklich nahesteht“ legt eine spezifisch emotionale Nähe fest. Die griechische Wendung ist idiomatisch und kann einen Freund bezeichnen, der ihm bzw. seinem Wesen entspricht oder zu ihm passt. Eine offenere deutsche Formulierung bewahrt diese Nuance.
