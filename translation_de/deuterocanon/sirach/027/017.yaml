translation:
  language: de
  text: Liebe einen Freund und erweise dich ihm als treu; wenn du aber seine Geheimnisse preisgibst, wirst du ihm ganz gewiss nicht nachsetzen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Dann sollst du ihm keinesfalls nachsetzen.“ Das Griechische kann als Aussage über die Folge verstanden werden, möglicherweise aber auch als Verbot.'
    reason: alternative_reading
lexical_decisions:
- source_word: στέργον
  choice: Liebe
  rationale: Das Imperativverb bezeichnet herzliche, beständige Zuneigung. „Liebe“ ist im Deutschen natürlich und bewahrt die persönliche Wärme des Ausdrucks.
- source_word: φίλον
  choice: einen Freund
  rationale: Das substantivierte Akkusativobjekt ist formal unbestimmt und passt als „einen Freund“ zum sprichwortartigen Stil.
- source_word: πιστώθητι μετʼ αὐτοῦ
  choice: erweise dich ihm als treu
  rationale: Der mediale/passive Imperativ fordert dazu auf, sich in der Beziehung als treu und verlässlich zu bewähren. Die deutsche Formulierung ist idiomatischer als eine wörtliche Wiedergabe von μετά mit „mit“.
- source_word: ἀποκαλύψῃς
  choice: offenbarst
  rationale: Das Verb meint, Verborgenes aufzudecken oder preiszugeben; „offenbaren“ wahrt das Bild und ist in diesem Zusammenhang verständlich.
- source_word: τὰ μυστήρια αὐτοῦ
  choice: seine Geheimnisse
  rationale: Gemeint sind hier vertrauliche Angelegenheiten eines Freundes, nicht notwendig religiöse Mysterien.
- source_word: οὐ μὴ
  choice: ganz gewiss nicht
  rationale: Die Verbindung mit dem Konjunktiv drückt eine besonders starke Verneinung aus.
- source_word: καταδιώξῃς ὀπίσω αὐτοῦ
  choice: wirst du ihm … nicht mehr nachlaufen
  rationale: Die Wendung bezeichnet ein Verfolgen oder Hinterherlaufen. „Nachlaufen“ erhält das anschauliche Bild; „mehr“ verdeutlicht im Deutschen die Folge des vorausgegangenen Vertrauensbruchs.
theological_decisions:
- issue: Aussageweise des letzten Satzteils nach dem Vertrauensbruch
  choice: 'Als sprichwortlich angekündigte Folge: „wirst du ihm ganz gewiss nicht mehr nachlaufen“'
  alternative: 'Als Verbot: „Lauf ihm dann keinesfalls nach“'
  rationale: Die griechische Form mit οὐ μή und Konjunktiv lässt sich am ehesten als nachdrückliche Voraussage verstehen, kann jedoch auch prohibitiv gehört werden. Die Fußnote bewahrt diese echte Spannung, ohne sie dogmatisch festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Anrede bleibt in der sprichwortartigen zweiten Person Singular. Die Semikolonstruktur bildet den Gegensatz zwischen Treue und gebrochenem Vertrauen klar ab.
