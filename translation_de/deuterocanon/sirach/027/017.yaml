    issue: Die Ergänzung „nicht mehr“ ist nicht im griechischen Wortlaut markiert.
    rationale: οὐ μὴ καταδιώξῃς ὀπίσω αὐτοῦ verneint nachdrücklich das Verfolgen/Nachsetzen; ein zeitliches „nicht mehr“ wird weder durch das Verb noch durch ein Adverb ausgedrückt. Es sollte nicht ergänzt werden.
  - severity: low
    issue: „offenbarst“ ist hier weniger idiomatisch als „preisgibst“.
    rationale: Bei den vertraulichen μυστήρια eines Freundes bezeichnet „preisgeben“ im heutigen Deutsch unmittelbar das Verraten von Geheimnissen; „offenbaren“ kann stärker feierlich oder religiös klingen.
