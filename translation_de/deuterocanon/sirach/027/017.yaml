  rationale: Die Revision entfernt die nicht markierte zeitliche Nuance „mehr“ und ersetzt zwei Ausdrücke durch im Kontext der verletzten Vertraulichkeit präzisere, natürliche Formulierungen. Die Satzform, die nachdrückliche Negation und die in der Fußnote dokumentierte Auslegungsambiguität bleiben erhalten.
