    rationale: „Bleib beständig“ kann Standhaftigkeit oder Dauerhaftigkeit in einem nicht genannten Zustand bedeuten. ἐνδελέχιζε fordert hier fortgesetztes Verweilen bzw. Sich-Aufhalten unter/bei dem Einsichtigen.
  - severity: low
    issue: Die Fußnotenalternative „hüte den passenden Augenblick“ ist im modernen Deutsch nicht idiomatisch.
    rationale: Sie kann den Eindruck erwecken, der Augenblick selbst müsse bewacht werden. „Warte den passenden Zeitpunkt ab“ bewahrt die mögliche Bedeutung in natürlicher Form.
