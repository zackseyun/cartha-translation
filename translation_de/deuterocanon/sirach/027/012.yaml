  to: Unter Unverständigen[a] warte den richtigen Zeitpunkt ab; unter einem Einsichtigen aber halte dich beständig auf.
  rationale: Die Revision ergänzt bei der zweiten Aufforderung das im Deutschen notwendige Verbgefüge „halte dich ... auf“. Dadurch wird das fortgesetzte Verweilen ausgedrückt, ohne eine nicht im griechischen Text genannte Tätigkeit wie Reden oder Lernen einzutragen. Die knappe antithetische Struktur und der Singular „einem Einsichtigen“ bleiben erhalten.
