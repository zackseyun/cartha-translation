  text: Among the senseless[a], watch for the right time; but among the thoughtful, be constant.
translation:
  language: de
  text: Unter Unverständigen[a] warte den richtigen Zeitpunkt ab; unter einem Einsichtigen aber halte dich beständig auf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Unter Toren warte den passenden Zeitpunkt ab; bei einem Einsichtigen aber halte dich fortwährend auf.«'
    reason: Lexikalische Alternative zu „Unverständigen“ und stilistisch natürliche Wiedergabe der Bedeutungsbreite von συντηρέω, καιρός und ἐνδελεχίζω.
lexical_decisions:
- source_word: ἀσυνέτων
  choice: Unverständigen
  rationale: Das substantivierte Adjektiv bezeichnet Menschen, denen Einsicht oder Urteilsvermögen fehlt. „Unverständige“ wahrt die geistige und sittliche Nuance, ohne sie bloß als dumm zu bezeichnen.
- source_word: συντήρησον καιρόν
  choice: warte den richtigen Zeitpunkt ab
  rationale: συντηρέω bezeichnet hier ein achtsames Bewahren oder Abwarten, καιρός den passenden, günstigen Zeitpunkt. Die Formulierung gibt die gebotene Zurückhaltung unter Unverständigen natürlich wieder.
- source_word: διανοουμένου
  choice: einem Verständigen
  rationale: Das substantivierte Partizip bezeichnet jemanden, der nachdenkt und Einsicht besitzt. Der Singular des griechischen Textes bleibt erhalten und bildet einen klaren Gegensatz zu den Unverständigen.
- source_word: ἐνδελέχιζε
  choice: bleib beständig
  rationale: Der Imperativ drückt fortgesetztes, beharrliches Verweilen aus. „Bleib beständig“ bewahrt diese Dauer, ohne eine im Griechischen nicht ausdrücklich genannte Tätigkeit festzulegen.
- source_word: εἰς μέσον ... εἰς μέσον δέ
  choice: unter ... unter ... aber
  rationale: Die wiederholte Wendung bedeutet in diesem gesellschaftlichen Zusammenhang idiomatisch „unter“ beziehungsweise „inmitten von“ und stellt die beiden Arten von Gesellschaft einander gegenüber.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe antithetische Struktur des griechischen Satzes bleibt erhalten; die zweite Aufforderung wird bewusst nicht durch eine ergänzte Tätigkeit wie „im Gespräch“ näher bestimmt.
