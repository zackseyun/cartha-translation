  verdict: revise
  source_fidelity: 'Die Gegenüberstellung von ἀσυνέτων („Unverständige“) und dem singularischen διανοουμένου („ein Einsichtiger/Nachdenkender“) sowie das Abwarten des passenden Zeitpunkts sind zutreffend wiedergegeben. Die Wiedergabe von ἐνδελέχιζε mit „bleib beständig“ ist jedoch im Deutschen semantisch unvollständig: Sie benennt kein Verweilen bzw. fortgesetztes Sich-Aufhalten in der Gesellschaft des Einsichtigen.'
  naturalness: „Warte den richtigen Zeitpunkt ab“ ist idiomatisch. „Unter einem Verständigen aber bleib beständig“ klingt dagegen elliptisch und nicht natürlich, weil „beständig bleiben“ ohne ergänzte Bezugsgröße nicht die gemeinte fortdauernde Anwesenheit ausdrückt.
  terminology: „Unverständigen“ und „Einsichtigen“ sind für den Weisheitskontext sachgerecht und bewahren den Gegensatz ohne überzogene Abwertung. „Beständig aufhalten“ gibt die durative Kraft von ἐνδελέχιζε verständlich wieder.
