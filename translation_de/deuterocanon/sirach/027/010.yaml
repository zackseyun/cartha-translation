  text: Ein Löwe lauert auf Beute; ebenso lauern Sünden denen auf, die Unrecht tun.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέων
  choice: Ein Löwe
  rationale: Der artikellose Singular formuliert in diesem Weisheitsspruch eine allgemeine Wahrheit; der unbestimmte Artikel gibt das im Deutschen natürlich wieder.
- source_word: θήραν
  choice: auf Beute
  rationale: Das Substantiv bezeichnet Jagdbeute. In Verbindung mit ἐνεδρεύει ist „auf Beute lauern“ die natürliche und bildhafte deutsche Wendung.
- source_word: ἐνεδρεύει
  choice: lauert … auf
  rationale: Das Verb bezeichnet das Auflauern oder Legen eines Hinterhalts. „lauern auf“ bewahrt das Bild des lauernden Raubtiers und lässt sich in der zweiten Satzhälfte passend ergänzen.
- source_word: οὕτως
  choice: ebenso
  rationale: Das Wort stellt den Vergleich zwischen dem Löwen und den personifizierten Sünden knapp und klar her.
- source_word: ἁμαρτίαι
  choice: Sünden
  rationale: Der griechische Plural wird unmittelbar wiedergegeben. Die Sünden erscheinen dabei bildhaft als etwas, das den Übeltätern auflauert.
- source_word: ἐργαζομένους
  choice: die … tun
  rationale: Das substantivierte Partizip bezeichnet Menschen, die entsprechend handeln. Zusammen mit ἄδικα ergibt „die Unrecht tun“ eine natürliche, genaue deutsche Formulierung.
- source_word: ἄδικα
  choice: Unrecht
  rationale: Der substantivierte beziehungsweise objektartig gebrauchte neutrale Plural bezeichnet ungerechte Taten. „Unrecht tun“ bewahrt den ethischen Gehalt ohne unnötige Abstraktion.
theological_decisions:
- issue: Personifikation von ἁμαρτίαι
  choice: Sünden werden als lauernde Verfolger derer dargestellt, die Unrecht tun.
  alternative: Die Folgen oder Strafen der Sünden lauern den Übeltätern auf.
  rationale: Im griechischen Text steht ausdrücklich „Sünden“, nicht „Folgen“ oder „Strafen“. Die Übersetzung erhält daher die eindringliche Personifikation und löst ihre theologische Spannung nicht deutend auf.
translation_notes:
  register: Knappes, würdiges und gegenwärtiges Standarddeutsch. Die parallele Wiederholung von „lauern“ macht die im Griechischen elliptische zweite Satzhälfte verständlich und erhält zugleich die prägnante Form des Weisheitsspruchs.
