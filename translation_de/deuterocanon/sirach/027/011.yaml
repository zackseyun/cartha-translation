translation:
  language: de
  text: Die Rede eines Gottesfürchtigen ist immer Weisheit[a]; doch der Tor verändert sich wie der Mond.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Die Darlegung eines Frommen ist zu jeder Zeit Weisheit.“'
    reason: lexical_alternative
  - marker: b
    text: 'Der Vergleich spielt wahrscheinlich auf die wechselnden Mondphasen an: Der Tor ist unbeständig und wechselhaft.'
    reason: cultural_note
lexical_decisions:
- source_word: διήγησις
  choice: Rede
  rationale: Das Substantiv kann Erzählung, Darlegung oder Rede bezeichnen. Im weisheitlichen Zusammenhang gibt „Rede“ den allgemeinen Bezug auf das Gesagte knapp und natürlich wieder.
- source_word: εὐσεβοῦς
  choice: eines Gottesfürchtigen
  rationale: Der substantivisch gebrauchte Genitiv Singular bezeichnet einen frommen, Gott ergebenen Menschen. „Gottesfürchtig“ bewahrt den religiös-ethischen Gehalt in geläufiger biblischer Sprache.
- source_word: διὰ παντός
  choice: allezeit
  rationale: Die Wendung bedeutet „durchgehend“ beziehungsweise „zu jeder Zeit“. „Allezeit“ ist prägnant, würdevoll und erhält den sprichwortartigen Rhythmus.
- source_word: σοφία
  choice: Weisheit
  rationale: Das Griechische setzt das Substantiv prädikativ. Die wörtliche Wiedergabe bewahrt die zugespitzte Aussage, statt sie zu „weise Rede“ abzuschwächen.
- source_word: ὁ ἄφρων
  choice: der Tor
  rationale: Dies ist der übliche Begriff der Weisheitsliteratur für einen Menschen, dem Einsicht fehlt. „Der Tor“ hält den Gegensatz zur Gottesfurcht knapp fest.
- source_word: ἀλλοιοῦται
  choice: verändert sich
  rationale: Das Verb bezeichnet ein Anderswerden oder Sichverändern. Die reflexive Formulierung gibt den intransitiven Sinn natürlich wieder.
- source_word: ὡς σελήνη
  choice: wie der Mond
  rationale: Die ausdrückliche Vergleichsform bleibt erhalten; wahrscheinlich sind die wechselnden Mondphasen als Bild für Unbeständigkeit gemeint.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst sprichwortartiger Kürze. „Gottesfürchtiger“ und „Tor“ entsprechen dem Register der Weisheitsliteratur, ohne eine konfessionelle Sonderdeutung einzutragen.
