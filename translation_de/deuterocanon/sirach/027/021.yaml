base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/027/021.yaml
  text: For a wound may be bound up, and after insults there may be reconciliation; but one who has revealed secrets has lost hope.
translation:
  language: de
  text: Denn eine Wunde lässt sich verbinden, und nach Beschimpfungen ist Versöhnung möglich; wer aber Geheimnisse preisgegeben hat, hat die Hoffnung verloren.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ist ohne Hoffnung“ oder „ist verzweifelt“. Der griechische Text sagt nicht, worauf sich die verlorene Hoffnung richtet; im Zusammenhang ist wahrscheinlich die Hoffnung auf wiederhergestelltes Vertrauen nach einem Vertrauensbruch gemeint.'
    reason: lexikalische Alternative und Wahrung der Mehrdeutigkeit
lexical_decisions:
- source_word: τραῦμά
  choice: eine Wunde
  rationale: Das Substantiv bezeichnet eine körperliche Wunde oder Verletzung. „Wunde“ bewahrt das konkrete Bild, auf dem der Gegensatz zum Vertrauensbruch beruht.
- source_word: καταδῆσαι
  choice: lässt sich verbinden
  rationale: Der Infinitiv bezeichnet das Binden beziehungsweise Verbinden einer Wunde. Die deutsche Konstruktion gibt die unpersönliche Möglichkeit natürlich wieder.
- source_word: λοιδορίας
  choice: Beschimpfungen
  rationale: Der Plural bezeichnet beleidigende oder schmähende Äußerungen. „Beschimpfungen“ ist gegenwärtig, verständlich und bildet den zwischenmenschlichen Konflikt klar ab.
- source_word: διαλλαγή
  choice: Versöhnung
  rationale: Das Wort bezeichnet die Wiederherstellung einer gestörten Beziehung. „Versöhnung“ wahrt diesen relationalen Sinn.
- source_word: ἀποκαλύψας
  choice: preisgegeben hat
  rationale: Das Partizip bezeichnet das Aufdecken oder Offenlegen. Bei anvertrauten Geheimnissen bringt „preisgegeben“ den Vertrauensbruch idiomatisch zum Ausdruck, ohne dessen Folgen weiter auszudeuten.
- source_word: μυστήρια
  choice: Geheimnisse
  rationale: Im weisheitlichen Zusammenhang sind vertrauliche, verborgene Angelegenheiten gemeint, nicht endzeitliche „Mysterien“.
- source_word: ἀφήλπισεν
  choice: hat die Hoffnung verloren
  rationale: Das Verb bezeichnet den Verlust oder die Aufgabe von Hoffnung. Die Formulierung lässt wie der griechische Text offen, worauf sich die verlorene Hoffnung richtet.
theological_decisions:
- issue: Sinn des Schlusssatzes ὁ δὲ ἀποκαλύψας μυστήρια ἀφήλπισεν
  choice: Derjenige, der Geheimnisse preisgegeben hat, hat die Hoffnung verloren, ohne dass ihr Gegenstand benannt wird.
  alternative: 'Er ist absolut hoffnungslos; oder: Er ist persönlich verzweifelt; oder: Er hat keine Hoffnung mehr auf die Wiederherstellung von Vertrauen und Beziehung.'
  rationale: Der Zusammenhang legt den Verlust der Hoffnung auf erneuertes Vertrauen oder Versöhnung nahe. Da der griechische Wortlaut den Gegenstand der Hoffnung jedoch nicht nennt, wird diese Deutung nicht in den Haupttext aufgenommen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallelen Aussagen sind knapp und sprichwortartig formuliert; der abschließende Gegensatz wird durch „wer aber“ deutlich markiert.
