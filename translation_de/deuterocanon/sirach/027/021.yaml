  source_fidelity: Die Übersetzung gibt die drei knapp antithetisch gereihten Aussagen des Griechischen zuverlässig wieder. „lässt sich verbinden“ trifft καταδῆσαι idiomatisch; „nach Beschimpfungen ist Versöhnung möglich“ gibt den Sinn von λοιδορίας ἐστὶ διαλλαγή natürlich wieder. Der abgeschlossene Ausdruck „Geheimnisse preisgegeben hat“ entspricht dem Aoristpartizip ἀποκαλύψας, und „hat die Hoffnung verloren“ bewahrt die im Griechischen unbestimmte Bezugsgröße von ἀφήλπισεν.
  naturalness: Modernes, würdiges und gut lesbares Standarddeutsch. Die Satzfolge und der Gegensatz mit „wer aber“ sind sprichwortartig knapp, ohne unnatürlich wörtlich zu wirken.
