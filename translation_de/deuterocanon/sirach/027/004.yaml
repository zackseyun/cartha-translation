  text: When a sieve is shaken[a], the refuse remains; so a person's filth is revealed in his thoughts.
translation:
  language: de
  text: Beim Schütteln eines Siebes bleibt der Unrat zurück; so zeigt sich der Unrat eines Menschen in seinem Denken.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „so der Unrat eines Menschen in seinem Denken“. Das zweite Satzglied enthält im Griechischen kein ausdrückliches Verb. „Unrat“ kann an beiden Stellen auch Mist, Abfall oder Kot bezeichnen.'
    reason: Die Fußnote bewahrt die elliptische Satzform und die bewusst grobe, mehrdeutige Abfallmetaphorik des Griechischen.
lexical_decisions:
- source_word: ἐν σείσματι κοσκίνου
  choice: Beim Schütteln eines Siebes
  rationale: Die Präpositionalfügung kann temporal oder instrumental verstanden werden. Die substantivische deutsche Form bewahrt diese leichte Offenheit und klingt in einem Weisheitsspruch natürlich.
- source_word: διαμενεῖ
  choice: bleibt ... zurück
  rationale: Das Verb bezeichnet fortdauerndes Verbleiben; „bleibt zurück“ passt besonders gut zum Bild des Siebens.
- source_word: κοπρία
  choice: Unrat
  rationale: Das Wort kann Mist oder Dung bezeichnen. „Unrat“ erhält das Bild groben Abfalls, ohne es unnötig auf einen landwirtschaftlichen Zusammenhang festzulegen.
- source_word: σκύβαλα
  choice: Unrat
  rationale: Das Wort bezeichnet Abfall, Unrat oder auch Kot. Die Wiederholung von „Unrat“ macht die genaue Entsprechung zwischen Bild und Anwendung sichtbar und vermeidet eine unbelegte ausdrückliche Moralisierung.
- source_word: ἀνθρώπου
  choice: eines Menschen
  rationale: ἄνθρωπος bezeichnet hier im allgemeinen Weisheitsspruch einen Menschen; die natürliche deutsche generische Form ist geschlechtsübergreifend.
- source_word: ἐν λογισμῷ αὐτοῦ
  choice: in seinem Denken
  rationale: λογισμός kann Denken, Überlegung oder Gedankengang bedeuten. „Denken“ wahrt den inneren, vernunftbezogenen Vorgang, ohne ihn auf einzelne Gedanken zu verengen.
theological_decisions:
- issue: Worin der Unrat eines Menschen erkennbar wird
  choice: zeigt sich ... in seinem Denken
  alternative: wird ... durch seine Überlegung offenbar
  rationale: Im zweiten Satzglied steht im Griechischen kein ausdrückliches Verb; es ist aus der vergleichenden Struktur zu ergänzen. „Zeigt sich“ gibt die Aussage zurückhaltend wieder, ohne festzulegen, ob das Denken selbst, sein Inhalt oder sein verbaler Ausdruck gemeint ist.
- issue: Generischer Bezug von ἀνθρώπου
  choice: eines Menschen
  alternative: eines Mannes
  rationale: Der Spruch betrifft den Menschen allgemein. Das grammatische Maskulinum verlangt im Deutschen keine Beschränkung auf Männer.
translation_notes:
  register: Moderner, würdiger Spruchstil mit klarer Parallelstruktur. Die zweimalige Verwendung von „Unrat“ bildet die griechische Bildentsprechung ab; die Fußnote erklärt, dass im Ausgangstext im zweiten Satzglied kein Verb steht.
