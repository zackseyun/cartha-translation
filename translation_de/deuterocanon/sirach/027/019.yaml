revisions:
- from: Und wie du einen Vogel aus deiner Hand freigelassen hast, so hast du deinen Nächsten gehen lassen, und du wirst ihn nicht wieder einfangen.[a]
  to: Und wie du einen Vogel aus deiner Hand freigelassen hast, so hast du deinen Nächsten gehen lassen, und du wirst ihn nicht erjagen.[a]
  rationale: Die Revision entfernt das nicht im Griechischen ausgedrückte „wieder“ und gibt θηρεύσεις mit „erjagen“ wieder, wodurch die Jagdmetaphorik des Ausgangstextes erhalten bleibt. Der parallele Aufbau sowie die natürliche Differenzierung von „freilassen“ und „gehen lassen“ bleiben bestehen.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T06:03:10Z'
review_pass:
  verdict: revise
  source_fidelity: Der Parallelismus von ἀπέλυσας und ἀφῆκας ist treffend durch „freigelassen“ und „gehen lassen“ wiedergegeben. Auch „deinen Nächsten“ entspricht τὸν πλησίον. Das zusätzliche „wieder“ in „nicht wieder einfangen“ hat jedoch keine ausdrückliche Grundlage im griechischen Text. θηρεύσεις bezeichnet zudem spezifischer das Jagen bzw. Erjagen als bloßes Einfangen.
  naturalness: Der Satz ist klar, idiomatisch und im würdevollen modernen Standarddeutsch gehalten. „Ihn erjagen“ bewahrt am Schluss die absichtlich fortgeführte Jagdmetaphorik, auch wenn sie bildhaft auf den Nächsten bezogen ist.
  terminology: „Vogel“, „Hand“ und „Nächster“ sind angemessen. „Erjagen“ gibt die Jagdnuance von θηρεύω genauer wieder; „fangen“ kann als lesbarere Ergebnisumschreibung in der Fußnote stehen.
  issues:
  - severity: medium
    issue: „wieder“ fügt eine nicht ausgedrückte Wiederholungs- bzw. Rückgewinnungsnuance hinzu.
    rationale: Der griechische Text lautet lediglich οὐ θηρεύσεις αὐτόν („du wirst ihn nicht jagen/erjagen“) und enthält kein Äquivalent zu „wieder“ oder „mehr“. Die Bildlogik kann diese Folgerung nahelegen, sie sollte aber nicht in den Übersetzungstext aufgenommen werden.
  - severity: low
    issue: „einfangen“ schwächt die lexikalische Jagdnuance von θηρεύω ab.
    rationale: „Einfangen“ beschreibt vor allem das Ergebnis; θηρεύω ruft dagegen ausdrücklich die Tätigkeit des Jagens bzw. Erjagens auf. Eine Fußnote kann die resultative Alternative dokumentieren.
  revised_text: Und wie du einen Vogel aus deiner Hand freigelassen hast, so hast du deinen Nächsten gehen lassen, und du wirst ihn nicht erjagen.[a]
  revised_footnotes:
  - marker: a
    text: 'Oder: „du wirst ihn nicht fangen“. Das griechische Verb hat Jagdbildlichkeit.'
    reason: lexical_alternative
  revision_rationale: Die Revision entfernt das nicht im Griechischen ausgedrückte „wieder“ und gibt θηρεύσεις mit „erjagen“ wieder, wodurch die Jagdmetaphorik des Ausgangstextes erhalten bleibt. Der parallele Aufbau sowie die natürliche Differenzierung von „freilassen“ und „gehen lassen“ bleiben bestehen.
