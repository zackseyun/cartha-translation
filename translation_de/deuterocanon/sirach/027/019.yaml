  yaml_path: translation/deuterocanon/sirach/027/019.yaml
  text: And as a bird from your hand you have let go[a], so you have let your neighbor go, and you will not catch him.
translation:
  language: de
  text: Und wie du einen Vogel aus deiner Hand freigelassen hast, so hast du deinen Nächsten gehen lassen, und du wirst ihn nicht erjagen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „du wirst ihn nicht fangen“. Das griechische Verb hat Jagdbildlichkeit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πετεινὸν
  choice: einen Vogel
  rationale: Das Substantiv bezeichnet allgemein einen Vogel; die natürliche deutsche Entsprechung bewahrt das Bild.
- source_word: ἐκ χειρός σου
  choice: aus deiner Hand
  rationale: Die konkrete räumliche Wendung bildet ab, dass der Vogel aus dem eigenen Griff freigelassen wird.
- source_word: ἀπέλυσας
  choice: freigelassen hast
  rationale: Das Verb bedeutet hier freilassen oder loslassen. „Freigelassen“ passt natürlich zum Vogelbild.
- source_word: ἀφῆκας
  choice: hast ... gehen lassen
  rationale: Im Parallelismus zu ἀπέλυσας bedeutet das Verb hier los- beziehungsweise gehen lassen. Eine leicht variierte Wiedergabe klingt im Deutschen natürlich und erhält den Vergleich.
- source_word: τὸν πλησίον
  choice: deinen Nächsten
  rationale: Die Wendung bezeichnet einen sozial nahestehenden Mitmenschen. „Deinen Nächsten“ wahrt den ethischen Klang der Weisheitsliteratur.
- source_word: οὐ θηρεύσεις αὐτόν
  choice: du wirst ihn nicht wieder einfangen
  rationale: Das Verb trägt Jagdbildlichkeit und bezeichnet das Erbeuten oder Fangen. „Wieder einfangen“ macht im Deutschen die im Zusammenhang gemeinte Unwiederbringlichkeit deutlich, ohne die Vogelmetapher aufzugeben.
theological_decisions:
- issue: Ob das Schlussverb ausdrücklich als Jagen oder ergebnisbezogen als Einfangen wiederzugeben ist
  choice: du wirst ihn nicht wieder einfangen
  alternative: du wirst ihn nicht mehr erjagen
  rationale: Das griechische θηρεύω ruft die Jagd auf ein Tier auf. „Wieder einfangen“ hält diese Bildwelt im Zusammenhang mit dem Vogel lebendig und drückt zugleich aus, dass der losgelassene Nächste nicht zurückgewonnen werden kann. Die Fußnote dokumentiert die wörtlichere Jagdnuance.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der parallele Aufbau des griechischen Satzes bleibt erhalten; „freilassen“ und „gehen lassen“ vermeiden zugleich eine schwerfällige identische Wiederholung. Das Adverb „wieder“ ist im Deutschen aus dem Zusammenhang idiomatisch erschlossen und verdeutlicht den Versuch, den zuvor Losgelassenen zurückzugewinnen.
