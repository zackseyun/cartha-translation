translation:
  language: de
  text: Die Gefäße eines Töpfers werden im Brennofen geprüft; ebenso wird ein Mann an seinem Denken geprüft.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „an seinen Überlegungen“ oder „an seinem Gedankengang“; der griechische Paralleltext lautet: „in seiner Überlegung“.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: כְּלֵי יוֹצֵר
  choice: die Gefäße eines Töpfers
  rationale: Die hebräische Status-constructus-Verbindung bezeichnet die Gefäße beziehungsweise Töpferwaren, die ein Töpfer herstellt. Die konkrete Bildsprache bleibt erhalten.
- source_word: לְבָעֵר כִּבְשָׁן
  choice: werden im Brennofen geprüft
  rationale: 'Der hebräische Ausdruck ist knapp und kann wörtlicher auf das Brennen im Ofen bezogen werden. Der griechische Paralleltext („ein Ofen prüft“) bestätigt den im Kontext gemeinten Gedanken: Beim Brennen zeigt sich die Qualität der Gefäße. Die passive Form ist im Deutschen natürlich.'
- source_word: וְכָמֹהוּ
  choice: ebenso
  rationale: Das Wort leitet den Vergleich zwischen dem Brennofen und der Beurteilung eines Menschen knapp und idiomatisch ein.
- source_word: אִישׁ
  choice: ein Mann
  rationale: אִישׁ ist ein maskulines Substantiv im Singular. Die Übersetzung bewahrt diese Form, ohne ihre sprichwörtlich-repräsentative Verwendung einzuschränken.
- source_word: עַל חֶשְׁבּוֹנוֹ
  choice: an seinem Denken
  rationale: חֶשְׁבּוֹן kann Berechnung, Überlegung oder Gedankengang bezeichnen. „An seinem Denken“ erhält die Bedeutungsbreite besser als eine stärker festlegende Wiedergabe wie „an seiner Vernunft“; der griechische Paralleltext verweist ebenfalls auf Überlegung beziehungsweise Gedankengang.
theological_decisions:
- issue: Anthropologische Formulierung und Geschlechtsgenauigkeit
  choice: ein Mann
  alternative: ein Mensch
  rationale: Der hebräische Text verwendet ausdrücklich das maskuline אִישׁ. Die grammatische Gestalt wird bewahrt, wobei der Weisheitsspruch repräsentativen Charakter hat.
- issue: Woran sich ein Mensch erweist
  choice: an seinem Denken
  alternative: an seinen Überlegungen / an seinem Gedankengang
  rationale: Die offene anthropologische Aussage des hebräischen חֶשְׁבּוֹן wird nicht auf eine bestimmte moralische oder konfessionelle Deutung verengt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer sprichwörtlicher Parallelstruktur. „Brennofen“ macht den Töpferkontext unmittelbar verständlich; „geprüft“ wird durch den griechischen Paralleltext gestützt und erschließt die knappe hebräische Formulierung.
