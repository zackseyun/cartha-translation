translation:
  language: de
  text: Das Gerede der Toren ist unerquicklich[a], und ihr Lachen geschieht in sündiger Ausschweifung[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Das Reden der Toren ist ein Ärgernis.“ προσόχθισμα kann etwas bezeichnen, das Ärger, Unmut oder Widerwillen hervorruft.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „und ihr Lachen ist in der Ausschweifung der Sünde.“ σπατάλη kann selbstsüchtigen Genuss, luxuriösen Überfluss oder zügelloses Leben bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διήγησις
  choice: Gerede
  rationale: Das Substantiv kann eine Erzählung, Darlegung oder Rede bezeichnen. Im weisheitlichen Zusammenhang meint es allgemein das Reden der Toren; „Gerede“ ist natürlich und trägt hier passend eine abwertende Färbung.
- source_word: μωρῶν
  choice: der Toren
  rationale: „Toren“ ist der etablierte Ausdruck der Weisheitsliteratur und bewahrt die moralische wie verstandesbezogene Schärfe des griechischen Begriffs.
- source_word: προσόχθισμα
  choice: erregt Widerwillen
  rationale: Das seltene Substantiv bezeichnet etwas, das Unmut, Verdruss oder Abscheu hervorruft. Die verbale Wendung gibt diese Wirkung in natürlichem Deutsch wieder, ohne den Begriff auf bloße Belästigung zu verengen.
- source_word: γέλως
  choice: Lachen
  rationale: Der Grundsinn ist „Lachen“. Eine ausdrückliche Festlegung auf Spott wäre stärker als der griechische Wortlaut.
- source_word: ἐν
  choice: ist von … geprägt
  rationale: Die Präposition bezeichnet hier den Bereich oder Zusammenhang, in dem sich das Lachen bewegt. Die deutsche Wendung gibt diese Beziehung idiomatisch wieder, ohne eine genaue instrumentale Bedeutung zu behaupten.
- source_word: σπατάλῃ
  choice: Ausschweifung
  rationale: Der Begriff bezeichnet selbstgefälligen, luxuriösen oder zügellosen Genuss. „Ausschweifung“ bewahrt die Vorstellung maßlosen Lebens, ohne sie allein auf materiellen Luxus festzulegen.
- source_word: ἁμαρτίας
  choice: sündiger
  rationale: Der Genitiv bestimmt die Ausschweifung als zur Sünde gehörig. Das Adjektiv ist im Deutschen knapp und bewahrt die ausdrückliche moralische Kategorie.
theological_decisions:
- issue: Moralische Aussage der Weisheitssprache
  choice: μωρῶν mit „Toren“ und ἁμαρτίας ausdrücklich mit „sündig“ wiedergegeben
  alternative: „Unverständige“ und „verwerflich“
  rationale: Der Vers verwendet moralisch gewichtige Kategorien. Eine neutralisierende Wiedergabe würde seine ethische Schärfe ohne textliche Grundlage abschwächen.
- issue: Verhältnis des Lachens zur Ausschweifung
  choice: „von sündiger Ausschweifung geprägt“
  alternative: „in der Ausschweifung der Sünde“
  rationale: Das griechische ἐν lässt den genauen Zusammenhang offen und kann einen Bereich oder Zustand bezeichnen. Die gewählte Formulierung wahrt diesen Zusammenhang, ohne eine weitergehende kausale oder wesensmäßige Aussage festzuschreiben.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem weisheitlichem Ton. „Gerede“ und „Toren“ bewahren die kritische Schärfe; die zweite Vershälfte wird idiomatisch formuliert, während die Fußnote die ungewöhnliche griechische Konstruktion sichtbar hält.
