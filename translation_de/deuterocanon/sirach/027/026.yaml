translation:
  language: de
  text: Wer eine Grube gräbt, wird selbst hineinfallen, und wer eine Falle stellt, wird darin gefangen werden.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ὀρύσσων
  choice: Wer … gräbt
  rationale: Das substantivierte Präsenspartizip wird als allgemeiner Relativsatz wiedergegeben; dies klingt im modernen Deutschen natürlich und bewahrt den sprichwörtlichen Charakter.
- source_word: βόθρον
  choice: eine Grube
  rationale: „Grube“ entspricht dem Bild eines ausgehobenen Lochs, das jemandem zum Verhängnis werden soll, und ist in dieser sprichwörtlichen Wendung idiomatisch.
- source_word: εἰς αὐτὸν
  choice: hinein
  rationale: Das Pronomen verweist sinngemäß auf βόθρον. „Hinein“ gibt die Richtung knapp und natürlich wieder, ohne das Bezugswort unnötig zu wiederholen.
- source_word: ἐμπεσεῖται
  choice: wird selbst hineinfallen
  rationale: Das Futur wird direkt wiedergegeben. „Selbst“ ist im Deutschen zur Verdeutlichung der Rückwirkung des Handelns idiomatisch, ohne den Sinn zu verändern.
- source_word: ὁ ἱστῶν
  choice: wer … stellt
  rationale: ἵστημι bezeichnet hier das Aufstellen oder Auslegen einer Fangvorrichtung; „eine Falle stellen“ ist die natürliche deutsche Verbindung.
- source_word: παγίδα
  choice: eine Falle
  rationale: „Falle“ ist im heutigen Standarddeutsch klarer und geläufiger als „Schlinge“, während das konkrete Fangbild erhalten bleibt.
- source_word: ἐν αὐτῇ
  choice: darin
  rationale: Das feminine Pronomen bezieht sich auf παγίδα. „Darin“ bewahrt die Parallelität zum ersten Satzteil und ist idiomatisch.
- source_word: ἁλώσεται
  choice: wird sich … fangen
  rationale: Das Passiv bedeutet im Fallenbild „gefangen werden“. Die reflexive deutsche Formulierung „sich in einer Falle fangen“ drückt dasselbe Ergebnis natürlich aus.
