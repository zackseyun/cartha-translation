  source_fidelity: 'Der erste Satzteil gibt βόθρον, εἰς αὐτόν und ἐμπεσεῖται treffend wieder. Im zweiten Satzteil entspricht „eine Falle stellt“ dem Bild von παγίς gut, aber „wird sich darin fangen“ ist im Deutschen semantisch reflexiv und legt nahe, dass die Person sich selbst aktiv fängt. Das griechische ἁλώσεται ist Futurpassiv: Sie wird in der Falle gefangen werden bzw. sich darin verfangen.'
  naturalness: „Wer eine Grube gräbt, fällt selbst hinein“ und „wer eine Falle stellt, wird darin gefangen“ sind knapp, idiomatisch und bewahren den sprichwörtlichen Parallelismus. Das explizite „selbst“ ist als kontrastierende Verstärkung natürlich.
