base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/027/001.yaml
  text: For the sake of gain many have sinned[b][a], and whoever seeks to increase it will turn away his eye.
translation:
  language: de
  text: Um des Gewinns willen[a] haben viele gesündigt, und wer ihn zu vermehren sucht, wird den Blick abwenden[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Vorteils« beziehungsweise »Profits«. Das griechische Wort bezeichnet hier wahrscheinlich materiellen Gewinn.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »wird ein Auge abwenden«. Gemeint ist ein bewusstes Wegsehen; wovon der Blick abgewandt wird, lässt der griechische Text offen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: χάριν ἀδιαφόρου
  choice: um des Gewinns willen
  rationale: χάριν mit dem Genitiv bezeichnet hier den Beweggrund. Obwohl ἀδιάφορος sonst »gleichgültig« oder »ohne Unterschied« bedeuten kann, weist der Zusammenhang mit dem angestrebten Vermehren auf materiellen Vorteil beziehungsweise Gewinn.
- source_word: πολλοὶ ἥμαρτον
  choice: haben viele gesündigt
  rationale: Der deutsche Perfektgebrauch gibt die allgemeingültige, sprichwortartige Feststellung natürlich wieder.
- source_word: ὁ ζητῶν πληθῦναι
  choice: wer ihn zu vermehren sucht
  rationale: Das substantivierte Partizip wird als allgemeines »wer« wiedergegeben. Das Pronomen »ihn« nimmt den zuvor genannten Gewinn als das im Griechischen unausgesprochene Objekt des Vermehrens auf.
- source_word: ἀποστρέψει ὀφθαλμόν
  choice: wird den Blick abwenden
  rationale: Die Wendung bewahrt das Bild des Wegsehens, klingt im heutigen Deutsch jedoch natürlicher als das wörtliche »wird ein Auge abwenden«. Das Futur des griechischen Textes bleibt erhalten.
theological_decisions:
- issue: Moralische Bedeutung des abgewandten Blicks
  choice: Das Bild des Wegsehens bleibt offen und wird nicht auf einen bestimmten Gegenstand festgelegt.
  alternative: wird über Unrecht hinwegsehen
  rationale: Der griechische Text nennt nicht, wovon der Blick abgewandt wird. Eine ausdrückliche Nennung von Unrecht, Not oder Betrug würde die moralische Aussage stärker bestimmen, als es die Vorlage tut.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit sprichwortartigem Satzbau. »Um des Gewinns willen« wahrt den gehobenen Ton, ohne altertümlich zu wirken; »den Blick abwenden« erhält das konkrete Bild in natürlicher deutscher Form.
