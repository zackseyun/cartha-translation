  source_fidelity: Die Übersetzung gibt χάριν ἀδιαφόρου treffend als Beweggrund („Um des Gewinns willen“) wieder und bewahrt die allgemeine Aussage von πολλοὶ ἥμαρτον. „Wer ihn zu vermehren sucht“ erschließt das im Griechischen elliptische Bezugsobjekt plausibel aus dem Kontext, ohne den Sinn zu erweitern. „Wird den Blick abwenden“ gibt ἀποστρέψει ὀφθαλμόν idiomatisch und bildhaft wieder; die Offenheit darüber, wovon weggesehen wird, bleibt erhalten.
