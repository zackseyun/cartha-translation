  text: Do not praise a man before he speaks his mind[b][a], for this is the test of men.
translation:
  language: de
  text: Lobe einen Menschen nicht, bevor sein Denken erkennbar wird[a]; denn dies ist die Prüfung der Menschen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „vor dem Denken/Überlegen“. Gemeint sein kann auch: bevor jemand überlegt hat oder bevor sein Gedankengang beziehungsweise Urteil bekannt ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸ λογισμοῦ
  choice: bevor sein Denken erkennbar wird
  rationale: λογισμός bezeichnet Denken, Überlegung oder Urteil. Die Formulierung gibt im Zusammenhang des Spruchs wieder, dass ein Mensch erst beurteilt werden soll, wenn sein Denken zutage tritt, ohne dies ausschließlich auf gesprochenes Reden festzulegen.
- source_word: μὴ ἐπαινέσῃς
  choice: Lobe ... nicht
  rationale: Der Aorist Konjunktiv mit μή drückt hier ein Verbot aus; „loben“ ist die direkte und natürliche Entsprechung.
- source_word: ἄνδρα
  choice: einen Menschen
  rationale: ἀνήρ steht hier in einem allgemeinen Weisheitsspruch repräsentativ für einen Menschen. Die Wiedergabe vermeidet im modernen Deutschen eine unnötige Beschränkung auf Männer.
- source_word: οὗτος
  choice: dies
  rationale: Das Demonstrativpronomen verweist auf den zuvor beschriebenen Prüfmaßstab.
- source_word: πειρασμὸς
  choice: Prüfung
  rationale: Im Weisheitskontext bezeichnet das Wort eine Erprobung oder Bewährung, nicht vorrangig eine Versuchung.
- source_word: ἀνθρώπων
  choice: der Menschen
  rationale: Der Genitiv Plural wird formal als „der Menschen“ wiedergegeben und bewahrt die allgemeine Aussage des griechischen Textes.
theological_decisions: []
