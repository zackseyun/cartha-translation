base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/045/015.yaml
  text: Moses ordained him and anointed him with holy oil[a]. It became for him an everlasting covenant, and for his offspring[c][b], for as long as the heavens endure.
translation:
  language: de
  text: Mose setzte ihn in das Priesteramt ein und salbte ihn mit heiligem Öl.[a] So wurde ihm und seinen Nachkommen[c] ein ewiger Bund zuteil, solange der Himmel besteht.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Mose füllte seine Hand«. Das ist ein hebräischer Fachausdruck für die Einsetzung in das Priesteramt; auch der griechische Text hat hier »füllte die Hände«.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »wie die Tage des Himmels«; die Wendung drückt eine sehr lange, fortdauernde Geltung aus.'
    reason: lexical_alternative
  - marker: c
    text: 'Der griechische Paralleltext fährt über den hier erhaltenen hebräischen Wortlaut hinaus fort: »um ihm zu dienen und als Priester zu wirken und sein Volk in seinem Namen zu segnen«. Der Haupttext folgt dem erhaltenen Hebräisch als dem primären Textzeugen.'
    reason: alternative_reading
lexical_decisions:
- source_word: וימלא משה את ידו
  choice: Mose setzte ihn in das Priesteramt ein
  rationale: Die Wendung »jemandem die Hand füllen« ist ein hebräischer Fachausdruck für die Einsetzung in ein priesterliches Amt. Die funktionsbezogene Wiedergabe ist im heutigen Deutsch verständlich; die wörtliche Form wird in Fußnote [a] dokumentiert. Das griechische Parallelzeugnis bestätigt das zugrunde liegende Bild mit »füllte die Hände«.
- source_word: וימשחהו
  choice: und salbte ihn
  rationale: Das Verb משח bezeichnet unmittelbar die rituelle Salbung; die Wiedergabe bewahrt die konkrete Handlung und entspricht dem griechischen ἔχρισεν.
- source_word: בשמן הקדש
  choice: mit heiligem Öl
  rationale: Die Wendung bezeichnet das für den heiligen Ritus bestimmte Öl. »Heiliges Öl« ist präzise, knapp und im modernen Deutsch natürlich.
- source_word: ברית עולם
  choice: ein ewiger Bund
  rationale: Die feste Wendung bezeichnet einen dauerhaft geltenden Bund. »Ewiger Bund« bewahrt die starke zeitliche Aussage, ohne sie über den Wortlaut hinaus dogmatisch auszudeuten.
- source_word: ולזרעו
  choice: und seinen Nachkommen
  rationale: זרע ist hier kollektiv gebraucht. »Nachkommen« gibt diesen Sinn im Deutschen klarer wieder als das wörtliche »Same«.
- source_word: כימי שמים
  choice: solange der Himmel besteht
  rationale: Wörtlich heißt die Wendung »wie die Tage des Himmels«. Die gewählte Formulierung gibt ihre zeitliche Bedeutung wieder und bewahrt zugleich das Bild vom Himmel als Maß langer Dauer.
theological_decisions:
- issue: Reichweite der Bundeszusage im priesterlichen Zusammenhang
  choice: Der Bund gilt Aaron und seinen Nachkommen und wird als dauerhaft bezeichnet.
  alternative: Die Aussage als ausdrückliche dogmatische Garantie eines unter allen Umständen ununterbrochenen Priestertums auszubauen oder auf Aarons Lebenszeit zu beschränken.
  rationale: Der hebräische Text verbindet den ewigen Bund sowohl mit Aaron als auch mit seinen Nachkommen und verwendet für seine Dauer das Bild von den Tagen des Himmels. Die Übersetzung erhält diese Spannung, ohne zusätzliche Bedingungen oder Folgerungen einzutragen.
- issue: Wiedergabe des Einsetzungsidioms »die Hand füllen«
  choice: Im Haupttext steht die verständliche Funktionsangabe »in das Priesteramt einsetzen«.
  alternative: Die wörtliche, im Deutschen missverständliche Form »seine Hand füllen« oder die allgemeinere Form »weihen«.
  rationale: Der Kontext bezeichnet eine konkrete priesterliche Amtseinsetzung. Die gewählte Form macht diese Funktion deutlich, während Fußnote [a] die hebräische Bildsprache transparent hält.
- issue: Textumfang am Versende
  choice: Der Haupttext folgt dem erhaltenen hebräischen Wortlaut; die längere griechische Fortsetzung wird in Fußnote [c] genannt.
  alternative: Die nur im griechischen Paralleltext erhaltene Fortsetzung unmittelbar in den Haupttext aufzunehmen.
  rationale: Der angegebene hebräische Text ist das primäre Ausgangszeugnis. Die griechische Fassung ist wichtig für die Textgeschichte, soll aber nicht stillschweigend mit dem hebräischen Haupttext verschmolzen werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der technische priesterliche Ausdruck wird im Haupttext verständlich wiedergegeben und in der Fußnote wörtlich offengelegt. Die Satzführung bleibt knapp und bibelnah; textkritische Unterschiede werden nicht in den Haupttext eingemischt.
