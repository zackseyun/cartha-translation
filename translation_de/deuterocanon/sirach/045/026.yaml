  text: And now[a], please bless Yahweh[b], the good one.
translation:
  language: de
  text: Und nun[a] preist doch Jahwe, den Guten.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Text lautet hier wesentlich anders: „Er gebe euch Weisheit in eure Herzen, damit ihr sein Volk in Gerechtigkeit richtet, sodass ihre Güter nicht verschwinden und ihre Herrlichkeit über ihre Generationen hin.“'
    reason: textual_variant
  - marker: b
    text: Im Hebräischen steht der Gottesname JHWH; traditionell wird er mit „der HERR“ wiedergegeben.
    reason: alternative_reading
lexical_decisions:
- source_word: וְעַתָּה
  choice: Und nun
  rationale: Bewahrt sowohl die zeitliche Bedeutung als auch die verbindende Funktion des hebräischen Ausdrucks.
- source_word: בָּרֲכוּ־נָא
  choice: preist doch
  rationale: Der Imperativ steht im Plural; die Partikel נָא mildert ihn zu einer eindringlichen Bitte. Bei Gott bedeutet ברך im Deutschen idiomatisch „preisen“ statt „segnen“.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den im Hebräischen ausdrücklich stehenden Gottesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: הַטּוֹב
  choice: den Guten
  rationale: Der bestimmte substantivierte Ausdruck steht appositionell zum Gottesnamen. „Den Guten“ erhält diese knappe Form und lässt offen, ob der Ausdruck als Beiname oder als Wesensbeschreibung verstanden wird.
- source_word: δόῃ ὑμῖν σοφίαν ἐν καρδίᾳ ὑμῶν ...
  choice: nicht in den Haupttext übernommen
  rationale: Der griechische Text weicht erheblich vom sicher bezeugten hebräischen Text ab. Daher bleibt das Hebräische Grundlage des Haupttextes; die griechische Fassung wird als bedeutende Textvariante dokumentiert.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Gottesnamen selbst. Die Umschrift „Jahwe“ macht dies sichtbar, während die traditionelle Ersatzlesung in der Fußnote genannt wird.
- issue: Verhältnis des hebräischen zum griechischen Textzeugen
  choice: Der Haupttext folgt dem erhaltenen Hebräisch; die abweichende griechische Fassung steht in der Fußnote.
  alternative: Die griechische Fassung als Haupttext verwenden oder beide Fassungen miteinander verbinden.
  rationale: Der hebräische Text ist an dieser Stelle mit hoher Sicherheit erhalten. Eine Vermischung würde zwei deutlich verschiedene Textformen unkenntlich machen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Preist doch“ ist eine natürliche deutsche Wiedergabe des höflich-eindringlichen Pluralimperativs; „den Guten“ bewahrt die knappe appositionelle Form des Hebräischen.
