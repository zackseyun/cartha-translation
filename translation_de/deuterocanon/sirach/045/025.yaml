base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/045/025.yaml
  text: 'And his covenant was with David son of Jesse, from the tribe of Judah: the inheritance of the king is from son to son alone, but the inheritance of Aaron is also for his offspring[a].'
translation:
  language: de
  text: 'Das Hohepriestertum soll ihm und seinen Nachkommen für immer gehören. Auch bestand sein Bund mit David, dem Sohn Isais, aus dem Stamm Juda: Das Königserbe geht allein von Sohn zu Sohn; Aarons Erbe aber gehört auch seinen Nachkommen.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hebräische Textzeuge ist hier kürzer und wirkt zusammengedrängt: Er nennt das Hohepriestertum, das ihm und seinen Nachkommen für immer gehören soll, sowie den Bund mit David. Der griechische Paralleltext bewahrt zudem die ausführlichere Gegenüberstellung: Das Königserbe geht in einer einzigen dynastischen Linie weiter, Aarons Erbe dagegen gehört seinen Nachkommen.'
    reason: textual_variant
lexical_decisions:
- source_word: וגם בריתו עם דוד
  choice: Und sein Bund galt David
  rationale: Das erhaltene Hebräisch bezeichnet den Bund mit David. „Galt“ gibt die Beziehung idiomatisch wieder, ohne den im Kontext auf Gott bezogenen Urheber ausdrücklich einzufügen.
- source_word: בן ישי
  choice: dem Sohn Isais
  rationale: Wiedergabe des Patronyms in der im Deutschen geläufigen biblischen Namensform.
- source_word: למטה יהודה
  choice: aus dem Stamm Juda
  rationale: מַטֶּה bezeichnet im genealogischen Zusammenhang den Stamm; die Formulierung bewahrt die Herkunftsangabe.
- source_word: κληρονομία βασιλέως
  choice: Das Erbe des Königs
  rationale: Der griechische Paralleltext bewahrt hier den im erhaltenen hebräischen Wortlaut fehlenden Gegenpol. Die konkrete Genitivform bleibt erhalten.
- source_word: υἱοῦ ἐξ υἱοῦ μόνου
  choice: geht allein von Sohn zu Sohn
  rationale: Die Formulierung bildet sowohl die dynastische Weitergabe als auch die durch μόνου bezeichnete Ausschließlichkeit knapp und natürlich ab.
- source_word: κληρονομία Ἀαρὼν καὶ τῷ σπέρματι αὐτοῦ
  choice: Aarons Erbe aber gehört auch seinen Nachkommen
  rationale: „Nachkommen“ gibt σπέρμα in diesem genealogischen Zusammenhang natürlich wieder; „aber“ macht den im Griechischen angelegten Gegensatz zur einzelnen königlichen Linie deutlich.
theological_decisions:
- issue: Verhältnis des verkürzten hebräischen Zeugen zum vollständigeren griechischen Paralleltext
  choice: Die erhaltene hebräische Aussage über den Bund mit David wird vorrangig übersetzt und durch den griechisch überlieferten Gegensatz zwischen davidischem Königtum und aaronitischem Erbe ergänzt.
  alternative: Nur den vorgelegten hebräischen Wortlaut wiedergeben oder den gesamten Vers ausschließlich nach dem Griechischen übersetzen.
  rationale: Der hebräische Zeuge ist als stark abweichend und offenbar komprimiert gekennzeichnet. Die kombinierte Wiedergabe wahrt das erhaltene Hebräisch und lässt zugleich den im Griechischen bewahrten vollständigen Gedanken erkennen, ohne die textliche Spannung zu verschweigen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit geläufiger biblischer Namensform. Der Doppelpunkt und die Gegenüberstellung machen den argumentativen Aufbau verständlich; die Fußnote legt die unsichere Textüberlieferung offen.
