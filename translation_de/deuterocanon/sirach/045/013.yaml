base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/045/013.yaml
  text: Before him there had not been such garments[a], and no foreigner will ever wear them; only his sons and his descendants throughout their generations.
translation:
  language: de
  text: Vor ihm hatte es keine solchen Gewänder gegeben[a], und niemals wird ein Fremder sie tragen; nur seine Söhne und ihre Nachkommen für alle Generationen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hebräische Wortlaut in der zweiten Vershälfte ist schwierig; annähernd wörtlich: „Er vertraute/bestätigte es ihm und seinen Söhnen in gleicher Weise, und so seinen Söhnen für ihre Generationen.“ Der griechische Paralleltext lautet dagegen ausdrücklich: „außer seinen Söhnen allein und seinen Nachkommen fortwährend“; ihm folgt die Sinnentfaltung im Haupttext.'
    reason: alternative_reading
lexical_decisions:
- source_word: לפניו
  choice: Vor ihm
  rationale: Die Wendung bezeichnet hier am natürlichsten die Zeit vor Aaron; das griechische πρὸ αὐτοῦ bestätigt diese zeitliche Lesart.
- source_word: לא היה כן
  choice: hatte es solche … nicht gegeben
  rationale: Die knappe hebräische Aussage besagt, dass zuvor nichts Vergleichbares existiert hatte.
- source_word: im Kontext vorausgesetzte Priesterkleidung / griechisch ὡραῖα
  choice: Gewänder
  rationale: Der Gegenstand ist im Hebräischen nur implizit, wird aber durch den Zusammenhang der vorher beschriebenen hohepriesterlichen Kleidung eindeutig. Auf „prächtige“ wird verzichtet, da diese Wertung im erhaltenen Hebräisch nicht ausdrücklich steht.
- source_word: זר / ἀλλογενής
  choice: ein Fremder
  rationale: Gemeint ist jemand außerhalb der dazu bestimmten priesterlichen Abstammungslinie; „Fremder“ bewahrt die knappe Ausdrucksweise beider Zeugen.
- source_word: לעולם לא ילבשם
  choice: niemals wird … sie tragen
  rationale: Dies gibt den dauerhaften Ausschluss in natürlichem Deutsch wieder; לבש bezeichnet das Tragen oder Anlegen von Kleidung.
- source_word: האמין לו ולבניו כזה
  choice: nur seine Söhne
  rationale: Der überlieferte hebräische Wortlaut ist schwierig und kann wörtlich als Anvertrauen oder Bestätigen verstanden werden. Der griechische Paralleltext bietet ausdrücklich die Ausnahme „nur seine Söhne“ und klärt damit wahrscheinlich den gemeinten Zusammenhang.
- source_word: וכן בניו לדורותם / τὰ ἔκγονα αὐτοῦ διὰ παντός
  choice: und seine Nachkommen durch alle ihre Generationen hindurch
  rationale: Die Formulierung verbindet die hebräische Generationenangabe mit der im Griechischen deutlich ausgedrückten fortdauernden Nachkommenschaft.
theological_decisions:
- issue: Beschränkung der hohepriesterlichen Gewänder auf Aarons Linie
  choice: Der Haupttext formuliert den Ausschluss Fremder und die Weitergabe innerhalb von Aarons Nachkommenschaft.
  alternative: Der schwierige hebräische Schlussteil kann enger als Aussage verstanden werden, dass Gott Aaron und seinen Söhnen etwas anvertraute oder bestätigte.
  rationale: Die gewählte Fassung folgt dem Zusammenhang und dem klareren griechischen Paralleltext, während die abweichende mögliche Deutung des Hebräischen in der Fußnote offengelegt wird.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Syntax bleibt nahe am knappen hebräischen Ausdruck; die Fußnote bewahrt die textliche Unsicherheit, statt sie im Haupttext stillschweigend aufzulösen.
