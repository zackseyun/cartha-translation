  text: Therefore he also established for him a statute[a], an everlasting covenant, to sustain the sanctuary.
translation:
  language: de
  text: Darum bestimmte er auch für ihn eine feste Ordnung[a], einen ewigen Bund, um für das Heiligtum zu sorgen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Parallelüberlieferung ist ausführlicher: „Darum wurde für ihn ein Bund des Friedens begründet, als Schutzherr der heiligen Dinge und seines Volkes, damit ihm und seinen Nachkommen die Würde des Priestertums für immer gehöre.“ Der hebräische Text ist hier kürzer und spricht von einer festen Ordnung und einem ewigen Bund, um für das Heiligtum zu sorgen.'
    reason: alternative_reading
lexical_decisions:
- source_word: לכן
  choice: Darum
  rationale: Kennzeichnet knapp und natürlich die Folge aus dem vorausgehenden Handeln des Pinhas.
- source_word: גם לו
  choice: auch für ihn
  rationale: Bewahrt sowohl den ergänzenden Sinn von גם als auch den persönlichen Bezug auf Pinhas.
- source_word: הכין
  choice: setzte … fest
  rationale: Gibt im rechtlich-bundestheologischen Zusammenhang das Einrichten beziehungsweise dauerhafte Festlegen einer Ordnung wieder.
- source_word: חק
  choice: eine Ordnung
  rationale: Bezeichnet eine festgesetzte rechtliche oder kultische Bestimmung; „Ordnung“ ist im Deutschen verständlich und weniger staatsrechtlich verengt als „Gesetz“.
- source_word: ברית עולם
  choice: einen ewigen Bund
  rationale: Entspricht der geläufigen biblischen Bundessprache und wahrt die dauerhafte Geltung von עולם.
- source_word: לכלכל
  choice: um … zu sorgen
  rationale: Gibt den Zweck des Versorgens, Unterhaltens oder Aufrechterhaltens wieder, ohne ihn auf finanzielle Versorgung zu beschränken.
- source_word: מקדש
  choice: das Heiligtum
  rationale: Bezeichnet den heiligen Ort beziehungsweise Kultbereich, ohne den Ausdruck unnötig auf ein bestimmtes Tempelgebäude einzuengen.
theological_decisions:
- issue: Abweichung zwischen der hebräischen und der griechischen Überlieferung beim Inhalt der Verheißung
  choice: 'Die kürzere erhaltene hebräische Fassung steht im Haupttext: eine festgesetzte Ordnung und ein ewiger Bund mit Bezug auf die Sorge für das Heiligtum.'
  alternative: Die griechische Fassung nennt einen „Bund des Friedens“, die Aufsicht über die heiligen Dinge und das Volk sowie die ewige Würde des Priestertums für Pinhas und seine Nachkommen.
  rationale: Wo ein belastbarer hebräischer Text erhalten ist, bildet er die Grundlage. Die erheblich ausführlichere griechische Überlieferung wird wegen ihrer inhaltlichen und theologischen Bedeutung vollständig in der Fußnote dokumentiert, ohne sie in den hebräischen Haupttext einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Ordnung festsetzen“ wahrt den rechtlich-kultischen Klang, während „für das Heiligtum sorgen“ die offene Bedeutung von לכלכל natürlich wiedergibt.
