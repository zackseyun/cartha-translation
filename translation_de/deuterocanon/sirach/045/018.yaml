base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/045/018.yaml
  text: Strangers grew angry with him[a], and in the wilderness they were jealous of him—men of Dathan and Abiram, and the company of Korah, in fury and wrath.
translation:
  language: de
  text: Fremde gerieten in Zorn gegen ihn[a], und in der Wüste waren sie eifersüchtig auf ihn – die Männer um Datan und Abiram und die Gemeinschaft Korachs, voller Wut und Zorn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der erhaltene hebräische Textzeuge ist kürzer: »Fremde gerieten in Zorn gegen ihn, und in der Wüste waren sie eifersüchtig auf ihn.« Der griechische Paralleltext nennt ausdrücklich die Männer um Datan und Abiram sowie die Gemeinschaft Korachs.'
    reason: textual_variant
lexical_decisions:
- source_word: ויחרו בו
  choice: gerieten in Zorn über ihn
  rationale: Das Verb חרה mit ב bezeichnet gegen jemanden entbrennenden Zorn. Die Formulierung ist gegenwärtiges, würdiges Deutsch und bewahrt das Aufkommen des Zorns.
- source_word: זרים
  choice: Fremde
  rationale: Die wörtliche Bedeutung ist »Fremde« beziehungsweise Außenstehende. Da der griechische Paralleltext israelitische Aufständische nennt, ist hier nicht zwingend an ethnische Ausländer zu denken; die anschließende Identifizierung verdeutlicht den Bezug.
- source_word: ויקנאו בו
  choice: waren sie eifersüchtig auf ihn
  rationale: קנא kann Eifersucht, Neid oder Eifer ausdrücken. Im Zusammenhang des Aufstands gegen Aaron gibt »eifersüchtig auf ihn« die persönliche Rivalität wieder, ohne die Mehrdeutigkeit durch eine stärker deutende Formulierung unnötig aufzulösen.
- source_word: במדבר
  choice: in der Wüste
  rationale: »Wüste« ist die geläufige deutsche Wiedergabe für מדבר im Kontext der Wüstenwanderung.
- source_word: ἄνδρες οἱ περὶ Δαθὰν καὶ Ἀβειρών
  choice: die Männer um Datan und Abiram
  rationale: Die Wendung οἱ περὶ bezeichnet die mit Datan und Abiram verbundenen Männer. »Die Männer um« bildet dies genauer ab als das möglicherweise besitzanzeigende »Männer Datans und Abirams«.
- source_word: ἡ συναγωγὴ Κόρε
  choice: die Gemeinschaft Korachs
  rationale: συναγωγή meint hier die versammelte Gruppe beziehungsweise Gefolgschaft Korachs. »Gemeinschaft« ist verständlich und vermeidet einen anachronistisch kirchlichen Klang.
- source_word: ἐν θυμῷ καὶ ὀργῇ
  choice: voller Wut und Zorn
  rationale: Die Wiedergabe erhält die steigernde griechische Doppelung und klingt im modernen Deutschen natürlich.
theological_decisions:
- issue: Kürzerer hebräischer Textzeuge gegenüber dem ausführlicheren griechischen Paralleltext
  choice: Der Haupttext folgt zunächst den beiden hebräischen Aussagen und nimmt danach die griechische Identifizierung der Aufständischen samt abschließender Zornesformel als appositionale Erweiterung auf.
  alternative: 'Nur den erhaltenen hebräischen Wortlaut wiedergeben: »Fremde gerieten in Zorn über ihn, und in der Wüste waren sie eifersüchtig auf ihn.«'
  rationale: Der vorhandene hebräische Text bleibt strukturell und lexikalisch vorrangig. Zugleich bewahrt der griechische Paralleltext eine ausführlichere Fassung, die Datan, Abiram und Korach nennt. Die Aufnahme mit transparenter Fußnote berücksichtigt beide Textzeugen, ohne ihre Differenz zu verschweigen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch in würdigem biblischem Register. Die Eigennamen folgen den im Deutschen geläufigen Formen Datan, Abiram und Korach; die Textabweichung zwischen Hebräisch und Griechisch wird offen ausgewiesen.
