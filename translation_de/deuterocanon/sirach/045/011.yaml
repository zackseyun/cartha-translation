  text: precious stones upon the breastpiece[a], engraved like a seal in their settings—every precious stone as a memorial[b], engraved with writing according to the number of the sons of Israel.
translation:
  language: de
  text: kostbare Steine auf der Brusttasche, mit Siegelgravuren in ihren Fassungen – jeder kostbare Stein zum Gedenken, mit einer eingravierten Inschrift entsprechend der Zahl der Söhne Israels.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die griechische Fassung lautet „entsprechend der Zahl der Stämme Israels“ und erwähnt außerdem ausdrücklich eine goldene Fassung. Der hebräische Text hat „Söhne Israels“ und nennt Gold nicht.
    reason: alternative_reading
lexical_decisions:
- source_word: אבני חפץ
  choice: kostbare Steine
  rationale: Die hebräische Wendung bezeichnet besonders wertvolle Steine; „kostbare Steine“ ist im Zusammenhang des priesterlichen Schmucks natürlich und wird durch griechisch λίθοις πολυτελέσιν gestützt.
- source_word: החשן
  choice: Brustschild
  rationale: Im Kontext der hohepriesterlichen Kleidung bezeichnet חשן das mit Edelsteinen besetzte, auf der Brust getragene Stück. „Brustschild“ ist verständlich und vermeidet die Vorstellung eines Rüstungsteils.
- source_word: פתוחי חותם
  choice: wie Siegel graviert
  rationale: Die Formulierung beschreibt eine Gravur nach Art eines Siegelsteins; auch das griechische γλύμματος σφραγῖδος stützt diesen Sinn.
- source_word: במלואים
  choice: eingefasst
  rationale: Im Schmuckkontext geht es um eingesetzte beziehungsweise gefasste Steine. Das Hebräische nennt das Material der Fassung nicht ausdrücklich.
- source_word: לזכרון
  choice: zum Gedenken
  rationale: Die Wiedergabe bewahrt den kultischen Erinnerungscharakter des Ausdrucks und entspricht griechisch εἰς μνημόσυνον.
- source_word: בכתב חרות
  choice: mit einer eingravierten Inschrift
  rationale: Die Formulierung bringt sowohl den Schriftcharakter als auch das Eingravieren idiomatisch zum Ausdruck.
- source_word: למספר בני ישראל
  choice: entsprechend der Zahl der Söhne Israels
  rationale: Der hebräische Text hat ausdrücklich „Söhne Israels“. Diese primäre Lesart bleibt im Haupttext erhalten; die griechische Variante „Stämme Israels“ wird in einer Fußnote dokumentiert.
theological_decisions:
- issue: Bezug und Funktion der gravierten Steine
  choice: Die Steine dienen dem Gedenken und tragen Inschriften entsprechend den Söhnen Israels.
  alternative: Die Steine werden lediglich als aufwendig gearbeiteter Schmuck beschrieben, ohne besondere Erinnerungsfunktion.
  rationale: Hebräisch לזכרון und griechisch εἰς μνημόσυνον benennen ausdrücklich eine Erinnerungsfunktion. Die Übersetzung wahrt diese kultische Bedeutung, ohne ihren theologischen Gehalt weiter auszudeuten.
- issue: Söhne oder Stämme Israels
  choice: Söhne Israels
  alternative: Stämme Israels
  rationale: Der vorhandene hebräische Text ist die primäre Grundlage und liest בני ישראל. Die griechische Parallele bietet φυλῶν Ἰσραήλ, „Stämme Israels“, was den sachlichen Bezug verdeutlicht, aber nicht stillschweigend in den Haupttext übernommen wird.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe nominale Satzgestalt des hebräischen Zusammenhangs bleibt erhalten. „Brustschild“ und „eingefasst“ sind verständlich, ohne eine Rüstung oder eine ausdrücklich goldene Fassung in den hebräischen Haupttext hineinzulesen.
