  terminology: „Brandopfer“ und „Sühne“ sind etablierte, sachgerechte kultische Begriffe. „Ihm Dienst zu tun und ihm als Priester zu dienen“ wahrt die Unterscheidung von לשרת und לכהן, ohne die Bedeutung von לו mit dem potenziell mehrdeutigen „für ihn“ zu verschieben.
