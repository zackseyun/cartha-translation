  text: to minister and to serve as priest to him[a], and to bless his people in his name. He chose him from among all the living to present burnt offerings and fat portions.
translation:
  language: de
  text: um ihm Dienst zu tun und ihm als Priester zu dienen und sein Volk in seinem Namen zu segnen. Er erwählte ihn unter allen Lebenden, um Brandopfer und Fettanteile darzubringen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Parallelüberlieferung ist ausführlicher: „dem Herrn eine Opfergabe darzubringen, Räucherwerk und Wohlgeruch zum Gedenken, um für dein Volk Sühne zu erwirken.“ Der hebräische Textzeuge ist hier kürzer.'
    reason: textual_variant
lexical_decisions:
- source_word: לשרת
  choice: ihm zu dienen
  rationale: Das Verb bezeichnet hier den Dienst im Heiligtum. „Dienen“ ist im Deutschen natürlich und erhält im Zusammenhang mit dem folgenden Priesterdienst seine kultische Bedeutung.
- source_word: ולכהן לו
  choice: für ihn den Priesterdienst auszuüben
  rationale: Das denominative Verb von כהן bezeichnet ausdrücklich priesterliches Handeln. Die Formulierung macht dieses Amt deutlich und vermeidet eine schwerfällige Wiederholung von „dienen“.
- source_word: ולברך את עמו בשמו
  choice: sein Volk in seinem Namen zu segnen
  rationale: Die Formulierung gibt sowohl den Gegenstand des Segens als auch dessen Vollzug unter Gottes Namen unmittelbar wieder.
- source_word: ויבחר בו מכל חי
  choice: Er erwählte ihn unter allen Lebenden
  rationale: 'מכל חי ist wörtlich weit gefasst: „aus/unter allem Lebenden“. „Unter allen Lebenden“ bewahrt diese Breite, ohne den Ausdruck unnötig auf Männer oder Menschen einzuengen.'
- source_word: להגיש
  choice: damit er … darbringe
  rationale: Im Opferzusammenhang bedeutet das Verb, eine Gabe heranzubringen beziehungsweise darzubringen. Der Zwecksatz klingt im Deutschen würdig und gibt den hebräischen Infinitiv funktional wieder.
- source_word: עלה
  choice: Brandopfer
  rationale: עלה ist der übliche Fachausdruck für das vollständig verbrannte Opfer. Der deutsche Plural gibt hier den kollektiven beziehungsweise wiederholten Opferdienst angemessen wieder.
- source_word: וחלבים
  choice: Fettstücke
  rationale: Der Plural bezeichnet die für den Altar bestimmten Fettanteile der Opfertiere, nicht Fett im allgemeinen Sinn.
- source_word: προσαγαγεῖν κάρπωσιν Κυρίῳ, θυμίαμα καὶ εὐωδίαν εἰς μνημόσυνον, ἐξιλάσκεσθαι περὶ τοῦ λαοῦ σου
  choice: nicht in den Haupttext aufgenommen; als ausführlichere griechische Parallelüberlieferung in der Fußnote wiedergegeben
  rationale: Der griechische Text enthält zusätzliche Angaben zu Opfergabe, Räucherwerk, Gedenken und Sühne. Da der erhaltene hebräische Wortlaut kürzer ist, bestimmt er den Haupttext; die bedeutende Abweichung wird jedoch transparent dokumentiert.
theological_decisions:
- issue: Kürzerer hebräischer Wortlaut gegenüber der ausführlicheren griechischen Parallelüberlieferung
  choice: Der Haupttext folgt dem erhaltenen Hebräischen; die griechischen Zusätze stehen in einer Fußnote.
  alternative: Den ausführlicheren griechischen Text als Haupttext übersetzen oder beide Überlieferungen zu einem Satz verbinden.
  rationale: Die vorhandene hebräische Überlieferung ist hier die primäre Textgrundlage. Eine Verschmelzung würde Räucherwerk, Gedenk- und Sühnesprache in den hebräischen Haupttext eintragen, obwohl sie dort fehlen; ein vollständiges Verschweigen der griechischen Fassung würde dagegen eine erhebliche Textvariante verbergen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer kultischer Terminologie. Die Satzfügung wahrt den feierlichen Charakter, bleibt aber für heutige Leser verständlich; die breite Bedeutung von מכל חי und die erhebliche Differenz zwischen hebräischer und griechischer Überlieferung werden nicht eingeebnet.
