  text: The men of Dathan and Abiram[a], and the company of Korah in the strength of their anger— Yahweh saw and was enraged[b], and he consumed them in the heat of his anger.
translation:
  language: de
  text: 19 Jahwe sah es und wurde zornig; er vernichtete sie in der Glut seines Zorns.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Fassung lautet ausführlicher: „Sie fanden im Grimm des Zorns ihr Ende; er tat Zeichen an ihnen, um sie im Feuer seiner Flamme zu verzehren.“ Der hebräische Text ist hier kürzer.'
    reason: alternative_reading
lexical_decisions:
- source_word: וירא יהוה
  choice: Jahwe sah es
  rationale: ראה bedeutet schlicht „sehen“. Das im Deutschen nötige Objekt „es“ nimmt das zuvor geschilderte Aufbegehren auf. Der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
- source_word: ויתאנף
  choice: und wurde zornig
  rationale: Das Verb אנף bezeichnet das Entbrennen oder Zeigen von Zorn. „Wurde zornig“ ist unmittelbar verständlich und wahrt die Aussage des Hebräischen ohne unnötige Steigerung.
- source_word: ויכלם
  choice: er vernichtete sie
  rationale: Die Form von כלה bezeichnet hier die vollständige Beseitigung beziehungsweise Vernichtung der Aufständischen. Die griechische Parallele bestätigt den Zusammenhang eines endgültigen Strafgerichts, auch wenn sie ausführlicher formuliert.
- source_word: בחרון אפו
  choice: in der Glut seines Zorns
  rationale: Die feste hebräische Wendung bezeichnet heftigen, entbrannten Zorn. „Glut seines Zorns“ bewahrt das Bild und klingt im modernen Deutschen würdig und natürlich.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm. „Jahwe“ gibt den persönlichen Gottesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Abgrenzung von Vers 19 gegenüber dem vorangehenden Satz
  choice: Vers 19 beginnt mit „Jahwe sah es“
  alternative: Die Männer Datans und Abirams sowie die Gemeinschaft Korachs in Vers 19 einbeziehen
  rationale: Im vorgelegten hebräischen Text steht die Versmarke יט unmittelbar vor וירא יהוה; auch die griechische Parallele zu 45,19 beginnt mit εἶδεν Κύριος. Der vorangehende Satz gehört daher nicht in den Haupttext dieses Verses.
- issue: Verhältnis des hebräischen Textes zur längeren griechischen Fassung
  choice: Der kürzere hebräische Wortlaut steht im Haupttext; die griechische Erweiterung wird in einer Fußnote dokumentiert
  alternative: Die Hinweise auf Wunderzeichen und verzehrendes Feuer aus dem Griechischen in den Haupttext aufnehmen
  rationale: Da für diesen Vers ein gut bezeugter hebräischer Text vorliegt, hat er Vorrang. Die griechische Fassung bietet zusätzliche Einzelheiten, die nicht stillschweigend in den hebräischen Haupttext eingefügt werden dürfen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe, kraftvolle Satzstruktur des Hebräischen bleibt erhalten. Die vor der hebräischen Versmarke stehende Erwähnung Datans, Abirams und Korachs wurde wegen der klaren Versabgrenzung nicht in Vers 19 übernommen.
