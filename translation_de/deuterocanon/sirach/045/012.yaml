translation:
  language: de
  text: Glanz der Herrlichkeit und Ruhm der Stärke[a], eine Freude für die Augen und der Inbegriff der Schönheit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Parallelfassung lautet sinngemäß: „Ruhm der Ehre, ein Werk der Kraft, begehrenswerter Schmuck für die Augen.“ Der hebräische Text weicht im Wortlaut deutlich davon ab; beide Fassungen beschreiben jedoch den hohepriesterlichen Schmuck in erhabenen Worten.'
    reason: alternative_reading
lexical_decisions:
- source_word: הוד
  choice: Glanz
  rationale: הוד bezeichnet Hoheit, Pracht oder Glanz. „Glanz“ wahrt die poetische Erhabenheit und bleibt zugleich von כבוד („Herrlichkeit“) unterscheidbar.
- source_word: כבוד
  choice: Herrlichkeit
  rationale: כבוד kann „Herrlichkeit“ oder „Ehre“ bedeuten. Im Zusammenhang der prachtvollen hohepriesterlichen Gewänder passt „Herrlichkeit“ zum erhöhten poetischen Register.
- source_word: ותהלת עז
  choice: und Ruhm der Stärke
  rationale: תהלה kann Lob, Ruhm oder rühmlichen Glanz bezeichnen, עז Stärke oder Macht. „Ruhm der Stärke“ gibt die knappe hebräische Fügung wieder, ohne sie erklärend aufzulösen.
- source_word: מחמד עין
  choice: eine Freude für die Augen
  rationale: מחמד bezeichnet etwas Begehrenswertes oder Erfreuliches; zusammen mit עין ist die sichtbare Schönheit gemeint. Die Formulierung ist natürlich und würdevoll.
- source_word: ומכלל יופי
  choice: und der Inbegriff der Schönheit
  rationale: מכלל kann Fülle, Vollendung oder Inbegriff ausdrücken. „Inbegriff der Schönheit“ vermittelt den zusammenfassenden, steigernden Sinn der poetischen Wendung.
theological_decisions:
- issue: Hebräischer Text gegenüber der deutlich abweichenden griechischen Parallelüberlieferung
  choice: Der erhaltene hebräische Wortlaut bildet den Haupttext; die griechische Fassung wird in einer Fußnote dokumentiert.
  alternative: 'Eine stärker an der griechischen Fassung orientierte Wiedergabe: „Ruhm der Ehre, ein Werk der Kraft, begehrenswerter Schmuck für die Augen“.'
  rationale: Der hebräische Text ist hier erhalten, in sich stimmig und als Primärquelle vorgegeben. Da die griechische Parallelfassung den Schmuck ebenfalls mit erhabenen Ausdrücken beschreibt, aber im Wortlaut erheblich abweicht, darf sie die hebräische Lesart nicht unmarkiert ersetzen.
translation_notes:
  register: Poetisch, feierlich und zugleich in modernem Standarddeutsch verständlich. Die knappen Nominalfügungen des Hebräischen bleiben erhalten. Der im gelieferten Quellenausschnitt vor der Versmarkierung (יב) stehende Satzteil wurde nicht in Vers 12 aufgenommen.
