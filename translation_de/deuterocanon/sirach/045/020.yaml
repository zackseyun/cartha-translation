  text: And he added honor to Aaron[a], and gave him his inheritance.
translation:
  language: de
  text: Und er mehrte Aarons Ehre[a] und gab ihm sein Erbteil.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Im Griechischen folgt noch: „Die Erstlingsgaben der Erstgeburten teilte er ihnen zu; als Erste bereitete er ihnen Brot in Fülle.“ Der hier erhaltene hebräische Text ist kürzer als der griechische.'
    reason: textual_variant
lexical_decisions:
- source_word: ויוסף
  choice: und er mehrte
  rationale: Die Hifil-Form von יסף bezeichnet hier ein Vermehren oder Hinzufügen. „Mehrte“ gibt den Sinn im Deutschen natürlich wieder und entspricht zugleich dem griechischen προσέθηκεν.
- source_word: לאהרן כבודו
  choice: Aarons Ehre
  rationale: כבוד kann „Ehre“ oder „Herrlichkeit“ bedeuten. Im Zusammenhang mit Aarons erhöhter priesterlicher Stellung ist „Ehre“ die natürlichere Wiedergabe. Die Formulierung versteht das Suffix als auf Aaron bezogen, ohne die Art dieser Ehre näher festzulegen.
- source_word: ויתן לו
  choice: und gab ihm
  rationale: Eine schlichte, direkte Wiedergabe von נתן mit indirektem Objekt; sie bewahrt die klare Satzstruktur des Hebräischen.
- source_word: נחלתו
  choice: sein Erbteil
  rationale: נחלה bezeichnet ein Erbe beziehungsweise einen zugewiesenen Anteil. „Erbteil“ bewahrt sowohl den biblischen Klang als auch die mögliche Bedeutung eines priesterlichen Anteils.
- source_word: κληρονομίαν
  choice: Erbteil
  rationale: Die griechische Parallelüberlieferung bestätigt die Bedeutung „Erbe/Erbteil“ und stützt damit die Lesart des hebräischen Textes.
theological_decisions:
- issue: Art von Aarons Erbteil
  choice: sein Erbteil
  alternative: sein zugewiesener Anteil
  rationale: Gemeint ist wahrscheinlich Aarons von Gott bestimmter priesterlicher Anteil, nicht zwingend Landbesitz. „Erbteil“ erhält die biblisch-theologische Resonanz, ohne die kultische Bedeutung auszuschließen.
- issue: Bezug von כבודו
  choice: Aarons Ehre
  alternative: seine eigene Ehre für Aaron
  rationale: Im unmittelbaren Zusammenhang liegt es nahe, das Suffix auf Aarons Ehre zu beziehen. Die knappe hebräische Formulierung ist jedoch syntaktisch nicht völlig spannungsfrei; daher wird keine weitergehende theologische Deutung in den Haupttext eingetragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Mehrte“ und „Erbteil“ halten die knappe, feierliche Ausdrucksweise des Hebräischen fest, ohne unnötig altertümlich zu wirken.
