translation:
  language: de
  text: In seiner Treue und Demut[a] erwählte er ihn aus allen Menschen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Parallelüberlieferung lautet: „In seinem Glauben und seiner Sanftmut heiligte er ihn; er erwählte ihn aus allem Fleisch.“ Im hebräischen Text fehlt das ausdrückliche „heiligte er ihn“; außerdem kann das hebräische Wort statt „Treue“ auch „Glaube“ bedeuten.'
    reason: alternative_reading
lexical_decisions:
- source_word: באמונתו
  choice: wegen seiner Treue
  rationale: אֱמוּנָה kann „Treue, Zuverlässigkeit“ oder „Glaube“ bezeichnen. Zusammen mit „Demut“ liegt hier die Beschreibung einer vorbildlichen Eigenschaft Moses nahe. Die Präposition ב wird im Deutschen natürlich kausal mit „wegen“ wiedergegeben; die mögliche Bedeutung „Glaube“ bleibt in der Fußnote erhalten.
- source_word: ובענותו
  choice: und seiner Demut
  rationale: עֲנָוָה bezeichnet Demut, Sanftmut oder Bescheidenheit. „Demut“ ist im modernen Standarddeutsch klar und würdig und passt zur Charakterisierung Moses.
- source_word: בחר בו
  choice: erwählte er ihn
  rationale: בחר mit ב bedeutet idiomatisch „jemanden auswählen/erwählen“. „Erwählte“ bewahrt hier den feierlichen biblischen Ton, ohne eine zusätzliche konfessionelle Aussage einzutragen.
- source_word: מכל בשר
  choice: aus allen Menschen
  rationale: Wörtlich „aus allem Fleisch“. Die Wendung meint hier die Gesamtheit der Menschen; „aus allen Menschen“ ist im Deutschen unmittelbar verständlich und bewahrt den universalen Umfang.
theological_decisions:
- issue: Bedeutung von אמונה beziehungsweise πίστις in der Würdigung Moses
  choice: Treue
  alternative: Glaube
  rationale: Der hebräische Hauptzeuge beschreibt wahrscheinlich Moses’ verlässliche Charakterhaltung neben seiner Demut. Die griechische Parallele lässt auch „Glaube“ zu; diese echte Mehrdeutigkeit wird in der Fußnote offengelegt.
- issue: Zusätzliches griechisches Verb ἡγίασεν
  choice: nicht in den Haupttext aufgenommen
  alternative: „heiligte er ihn“
  rationale: Der hebräische Hauptzeuge enthält kein entsprechendes Verb. Da die griechische Parallele eine umfangreichere Lesart bietet, wird sie nicht in den hebräisch gegründeten Haupttext eingetragen, sondern vollständig in der Fußnote dokumentiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Aus allen Menschen“ gibt die Bedeutung des hebräischen Idioms מכל בשר natürlicher wieder als das im Deutschen missverständliche „aus allem Fleisch“. Der Fußnotenmarker steht unmittelbar bei der Wortgruppe, deren Bedeutungs- und Textvariante erläutert wird.
