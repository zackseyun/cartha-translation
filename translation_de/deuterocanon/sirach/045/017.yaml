  text: And he gave him his commandments[a], and granted him authority in statute and judgment, to teach Jacob his testimonies and to enlighten Israel with his law.
translation:
  language: de
  text: Und er gab ihm seine Gebote[a] und verlieh ihm Vollmacht im Bereich von Satzung und Recht, um Jakob in Gottes Weisungen zu unterweisen und Israel durch Gottes Gesetz zu erleuchten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der erhaltene hebräische Text aus der Kairoer Geniza ist hier kürzer: „Und er gab ihm seine Gebote und verlieh ihm Vollmacht im Bereich von Satzung und Recht.“ Die Sätze „um Jakob in Gottes Weisungen zu unterweisen und Israel durch Gottes Gesetz zu erleuchten“ sind im griechischen Text bezeugt und hier aufgenommen, weil die hebräische Zeile anscheinend verkürzt ist.'
    reason: textual_variant
lexical_decisions:
- source_word: ויתן לו מצותיו
  choice: Und er gab ihm seine Gebote
  rationale: Die Wiedergabe folgt dem einfachen Sinn von נתן und bewahrt mit „Gebote“ den bundesrechtlichen Gehalt von מצותיו. Das anlautende „Und“ entspricht dem hebräischen ו.
- source_word: וימשילהו
  choice: und verlieh ihm Vollmacht
  rationale: Der Hifil von משל bezeichnet hier verliehene Herrschafts- oder Entscheidungsbefugnis. „Vollmacht“ gibt die delegierte priesterlich-rechtliche Autorität wieder, ohne ein Königtum anzudeuten.
- source_word: בחוק ומשפט
  choice: in Satzung und Recht
  rationale: Die formelle Wendung erhält die rechtlich-bundestheologische Prägung des hebräischen Wortpaars. „In“ bewahrt die knappe, mehrdeutige Präposition ב und bezeichnet den Bereich der Vollmacht.
- source_word: διδάξαι τὸν Ἰακὼβ τὰ μαρτύρια
  choice: um Jakob seine Zeugnisse zu lehren
  rationale: Die griechische Zweckkonstruktion wird als „um … zu“ wiedergegeben. „Zeugnisse“ wahrt den traditionellen rechtlich-bundestheologischen Sinn von μαρτύρια, auch wenn „Weisungen“ im Deutschen geläufiger wäre.
- source_word: καὶ ἐν νόμῳ αὐτοῦ φωτῖσαι Ἰσραήλ
  choice: und Israel durch sein Gesetz zu erleuchten
  rationale: „Erleuchten“ erhält die Metapher von φωτίζω; „durch sein Gesetz“ versteht ἐν instrumental und formuliert den Sinn im Deutschen natürlich.
theological_decisions:
- issue: Ergänzung des kürzeren erhaltenen hebräischen Textes durch den griechischen Zeugen
  choice: Die griechisch bezeugten Zwecksätze über die Unterweisung Jakobs und die Erleuchtung Israels stehen im Haupttext.
  alternative: 'Nur den erhaltenen hebräischen Wortlaut wiedergeben: „Und er gab ihm seine Gebote und verlieh ihm Vollmacht in Satzung und Recht.“'
  rationale: Der erhaltene Geniza-Text ist an dieser Stelle kürzer und als erhebliche Abweichung gekennzeichnet. Der griechische Text bietet eine inhaltlich stimmige Fortsetzung über Aarons Lehrauftrag. Die Ergänzung wird durch eine textkritische Fußnote transparent gemacht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die rechtlich-bundestheologische Ausdrucksweise bleibt mit „Gebote“, „Vollmacht“, „Satzung“, „Recht“, „Zeugnisse“ und „Gesetz“ bewusst formal; der Satzbau bleibt dennoch verständlich.
