  terminology: „Gebote“, „Vollmacht“, „Satzung“, „Recht“ und „Gesetz“ bewahren den rechtlich-kultischen Registerton. „Weisungen“ gibt die griechischen μαρτύρια in natürlichem modernen Deutsch als göttliche verbindliche Unterweisung wieder, ohne eine spezifische konfessionelle Terminologie festzulegen.
