  yaml_path: translation/deuterocanon/sirach/045/007.yaml
  text: He put splendor upon him and ministered to him with his glory[b][a]; he girded him with the horns of a wild ox and clothed him with bells.
translation:
  language: de
  text: Er verlieh ihm Glanz und diente ihm mit seiner Herrlichkeit;[a] er umgürtete ihn mit den Hörnern eines Wildstiers[b] und bekleidete ihn mit Schellen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Parallelüberlieferung lautet: „Er schloss mit ihm einen ewigen Bund und gab ihm das Priestertum des Volkes; er segnete ihn mit Schmuck und umgürtete ihn mit einem Gewand der Herrlichkeit.“ Der hebräische Text weicht hier erheblich vom griechischen ab.'
    reason: alternative_reading
  - marker: b
    text: 'Vielleicht auch: „mit der erhabenen Kraft eines Wildstiers“. Die hebräische Wendung ist schwierig; das Bild muss nicht von einem wirklichen Hörnerschmuck sprechen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוד
  choice: Glanz
  rationale: הוד bezeichnet sichtbare Hoheit oder Pracht. „Glanz“ passt zum Zusammenhang der priesterlichen Einkleidung und bleibt von כבוד, „Herrlichkeit“, unterscheidbar.
- source_word: וישרתהו
  choice: und diente ihm
  rationale: שרת bedeutet „dienen, Dienst tun“. Die ungewöhnliche Aussage wird nicht geglättet; die erheblich abweichende griechische Überlieferung steht in Fußnote [a].
- source_word: בכבודו
  choice: mit seiner Herrlichkeit
  rationale: Die Wiedergabe bewahrt die Präposition und das Possessivsuffix sowie den feierlichen Klang von כבוד.
- source_word: ויאזרהו
  choice: er umgürtete ihn
  rationale: אזר bezeichnet im Zusammenhang mit Kleidung das Umgürten und passt zur zeremoniellen Ausstattung.
- source_word: בתועפות ראם
  choice: mit den Hörnern eines Wildstiers
  rationale: Die schwierige Wendung wird in ihrer anschaulichen möglichen Bedeutung wiedergegeben; die Deutung als erhabene Kraft bleibt in Fußnote [b] erhalten.
- source_word: וילבישהו פעמונים
  choice: bekleidete ihn mit Schellen
  rationale: פעמונים sind die Schellen beziehungsweise Glöckchen am priesterlichen Gewand. „Bekleidete“ folgt dem hebräischen Verb und wahrt das Einkleidungsmotiv.
theological_decisions:
- issue: Hebräischer Text gegenüber der stark abweichenden griechischen Parallelüberlieferung
  choice: Der Haupttext folgt dem erhaltenen hebräischen Wortlaut.
  alternative: Die griechische Fassung spricht von einem ewigen Bund, dem Priestertum des Volkes, Schmuck und einem Ehrengewand.
  rationale: Wo ein hebräischer Sirach-Text erhalten ist, besitzt er Vorrang. Da die griechische Überlieferung hier erheblich abweicht, wird sie nicht harmonisiert, sondern vollständig in einer Fußnote dokumentiert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die ungewöhnliche Rede davon, dass Gott Aaron „diente“, bleibt als Spannung des hebräischen Textes erhalten. „Schellen“ ist im Zusammenhang priesterlicher Gewänder natürlicher als „Glocken“; die Satzstruktur folgt eng der zeremoniellen Abfolge im Hebräischen.
