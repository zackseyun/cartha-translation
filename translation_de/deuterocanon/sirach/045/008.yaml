base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/045/008.yaml
  text: He clothed him with perfect splendor[a], and adorned him with glory and strength, with trousers, tunics, and a robe[b]; and he encircled him with bells.
translation:
  language: de
  text: Er bekleidete ihn mit vollendeter Pracht[a] und schmückte ihn mit Herrlichkeit und Stärke, mit Beinkleidern, Tuniken und einem Obergewand; ringsum versah er ihn mit Glocken.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit voller Pracht“. Die hebräische Wendung ist knapp und feierlich; auch die griechische Überlieferung verwendet eine stark gesteigerte Formulierung.'
    reason: lexical_alternative
  - marker: b
    text: Der erhaltene hebräische und der griechische Text unterscheiden sich hier in den Einzelheiten der priesterlichen Kleidung. Der hebräische Text nennt Beinkleider, Tuniken, ein Obergewand und Glocken; der griechische Text bietet eine andere Folge und nennt auch das Efod.
    reason: textual_variant
lexical_decisions:
- source_word: וילבישהו
  choice: Er kleidete ihn
  rationale: Der Hifil von לבש bedeutet, jemanden zu bekleiden. Die Formulierung ist natürlich und bewahrt den feierlichen Zusammenhang.
- source_word: כליל תפארת
  choice: in vollendete Pracht
  rationale: כליל bezeichnet Ganzheit oder Vollendung, תפארת Pracht, Schönheit oder Herrlichkeit. „Vollendete Pracht“ gibt die knappe, gesteigerte Wendung wieder, ohne sie dogmatisch auszudeuten.
- source_word: ויפארהו
  choice: schmückte ihn
  rationale: Das Verb פאר bezeichnet hier das prächtige Ausstatten Aarons; „schmückte“ verbindet den konkreten Gewandkontext mit der ehrenden Bedeutung.
- source_word: בכבוד ועוז
  choice: mit Herrlichkeit und Stärke
  rationale: כבוד und עוז bedeuten Herrlichkeit/Ehre und Stärke/Macht. Die nahe Wiedergabe erhält die feierliche Begriffspaarung.
- source_word: מכנסים
  choice: Beinkleider
  rationale: Das Wort bezeichnet das priesterliche Kleidungsstück für den Unterkörper. „Beinkleider“ ist genauer als das allgemeinere „Untergewänder“ und im Deutschen weniger modern-alltäglich als „Hosen“.
- source_word: כתנות
  choice: Gewänder
  rationale: כתנות ist der Plural von כתנת, einem tunikaartigen Kleidungsstück. „Gewänder“ ist verständlich und würdevoll; „Tuniken“ wäre fachsprachlicher.
- source_word: ומעיל
  choice: und einem Obergewand
  rationale: מעיל bezeichnet ein mantel- oder robenartiges äußeres Kleidungsstück. „Obergewand“ ist klar und im biblischen Kontext passend.
- source_word: ויקיפהו
  choice: er umgab ihn
  rationale: Das Verb vermittelt das Umgeben oder ringsum Anbringen; die Glocken sind im Zusammenhang rings um den Saum angeordnet.
- source_word: פעמונים
  choice: Glocken
  rationale: Der hebräische Text nennt lediglich Glocken. „Goldene“ wird nicht ergänzt, obwohl andere priesterliche Texte diese näher bestimmen.
theological_decisions:
- issue: Verhältnis des erhaltenen hebräischen Textes zur abweichenden griechischen Überlieferung
  choice: Der erhaltene hebräische Text bestimmt Wortlaut und Kleidungsfolge; die griechische Fassung dient als Kontrollzeugnis.
  alternative: Der griechischen Folge mit langem Gewand und Efod folgen.
  rationale: Der hebräische Text ist an dieser Stelle zusammenhängend und nennt Beinkleider, Gewänder, Obergewand und Glocken. Die griechische Überlieferung weicht in Einzelheiten ab und nennt insbesondere das Efod; diese echte Textspannung wird in einer Fußnote offengelegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit enger Bindung an den hebräischen Wortlaut. Die Satzstruktur bleibt feierlich, ohne unnötige Archaismen; textliche Unterschiede zur griechischen Überlieferung werden nicht in den Haupttext eingemischt, sondern transparent vermerkt.
