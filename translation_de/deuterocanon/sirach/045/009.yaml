translation:
  language: de
  text: und Granatäpfel in großer Zahl ringsum[a], um bei seinen Schritten Klang ertönen zu lassen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Überlieferung bietet eine ausführlichere Fassung: „Und er umgab ihn mit Granatäpfeln und mit vielen goldenen Glöckchen ringsum, damit bei seinen Schritten ein hörbarer Klang entstand …“ Der hebräische Text ist hier kürzer und erwähnt nur die Granatäpfel und den Klang bei seinen Schritten.'
    reason: textual_variant
lexical_decisions:
- source_word: ורמונים
  choice: und Granatäpfel
  rationale: Das Hebräische nennt konkret Granatäpfel, im Zusammenhang wohl Granatapfelornamente am Gewand. Die ausdrückliche Ergänzung „Glöckchen“ aus der griechischen Parallelüberlieferung wird nicht in den Haupttext übernommen.
- source_word: המון
  choice: in großer Zahl
  rationale: המון bezeichnet eine Menge oder Fülle; „in großer Zahl“ gibt den Sinn natürlich und präzise wieder.
- source_word: סביב
  choice: ringsum
  rationale: Das Adverb bezeichnet die umlaufende Anordnung am Gewand.
- source_word: לתת
  choice: damit ... entstand
  rationale: Der Infinitiv bezeichnet hier Zweck oder Ergebnis. Die deutsche Konstruktion formuliert diesen Zusammenhang idiomatisch.
- source_word: נעינה
  choice: ein Klang
  rationale: Das seltene beziehungsweise unsichere Wort bezeichnet hier offenbar einen hörbaren, möglicherweise musikalischen Laut. „Klang“ wahrt diese Offenheit besser als das stärker deutende „Melodie“.
- source_word: בצעדיו
  choice: bei seinen Schritten
  rationale: Die Präposition verbindet den entstehenden Klang mit seiner Bewegung; „bei seinen Schritten“ ist im Deutschen natürlich und bleibt nah am Hebräischen.
theological_decisions:
- issue: Verhältnis des kürzeren hebräischen Textes zur ausführlicheren griechischen Parallelüberlieferung
  choice: Der Haupttext folgt dem erhaltenen Hebräisch; die ausführlichere griechische Lesart wird in einer Fußnote dokumentiert.
  alternative: „Und er umgab ihn mit Granatäpfeln und mit vielen goldenen Glöckchen ringsum, damit bei seinen Schritten ein hörbarer Klang entstand ...“
  rationale: Der hebräische Zeuge ist vorhanden und wird als Grundlage übersetzt, nennt jedoch weder ausdrücklich goldene Glöckchen noch die weiteren Aussagen über Tempel und Erinnerung. Diese erhebliche Textvariante soll nicht stillschweigend in den Haupttext eingetragen werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Granatäpfel“ bewahrt das konkrete Bild; „Klang“ vermeidet eine unnötige Festlegung auf Melodie oder Glockenklang. Die Satzkonstruktion ist flüssig, ohne die Kürze des hebräischen Zeugen aufzugeben.
