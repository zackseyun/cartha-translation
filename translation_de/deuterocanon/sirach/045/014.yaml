  text: His grain offering shall be burned up whole[a], every day, twice a day.
translation:
  language: de
  text: Sein Speisopfer soll vollständig in Rauch aufgehen[a], Tag für Tag zweimal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Paralleltext lautet: „Seine Opfer sollen vollständig verbrannt werden, beständig, zweimal täglich.“ Der hebräische Text bezeichnet die Gabe genauer als „sein Speisopfer“.'
    reason: alternative_reading
lexical_decisions:
- source_word: מנחתו
  choice: sein Speisopfer
  rationale: מִנְחָה bezeichnet im priesterlich-kultischen Zusammenhang gewöhnlich ein Speisopfer; der deutsche Fachausdruck bewahrt die gegenüber dem griechischen Paralleltext größere Genauigkeit des Hebräischen.
- source_word: כליל תקטר
  choice: soll vollständig in Rauch aufgehen
  rationale: כליל bezeichnet die vollständige Darbringung, während קטר im Opferkontext das Verbrennen beziehungsweise Aufsteigenlassen in Rauch meint. Die Formulierung gibt beides wieder, ohne das Speisopfer fälschlich als Brandopfer zu bezeichnen.
- source_word: בכל יום
  choice: jeden Tag
  rationale: Die Zeitangabe wird unmittelbar und in natürlichem Deutsch wiedergegeben.
- source_word: צמיד
  choice: regelmäßig (im Zusammenhang durch „jeden Tag“ ausgedrückt)
  rationale: Das Wort bezeichnet kultische Beständigkeit beziehungsweise Regelmäßigkeit. Da „jeden Tag zweimal“ diese regelmäßige Wiederholung bereits klar ausdrückt, würde ein zusätzliches „beständig“ im Deutschen schwerfällig oder missverständlich wirken.
- source_word: פעמים
  choice: zweimal
  rationale: Im Einklang mit dem griechischen δίς bezeichnet das Wort hier zwei tägliche Darbringungen.
theological_decisions:
- issue: Genauigkeit der Opferbezeichnung
  choice: Dem hebräischen Text folgend „Speisopfer“
  alternative: Dem griechischen Paralleltext folgend „Opfer“ im Plural
  rationale: Der erhaltene hebräische Zeuge ist spezifischer und hat als Ausgangstext Vorrang. Die breitere griechische Lesart wird transparent in einer Fußnote dokumentiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „In Rauch aufgehen“ ist im Opferzusammenhang anschaulich und quellengetreu; „jeden Tag zweimal“ ist klarer und natürlicher als eine Häufung von „beständig“, „täglich“ und „zweimal“.
