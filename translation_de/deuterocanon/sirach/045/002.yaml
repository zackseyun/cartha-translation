  text: God honored him[a], and strengthened him in the heights.
translation:
  language: de
  text: Gott erwies ihm Ehre[a] und stärkte ihn in den Höhen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Text lautet ausführlicher: „Er machte ihn der Herrlichkeit der Heiligen gleich und machte ihn groß in den Schrecken der Feinde.“ Der hebräische Text dagegen lautet: „Gott erwies ihm Ehre und stärkte ihn in den Höhen.“'
    reason: textual_variant
lexical_decisions:
- source_word: ויכבדהו
  choice: erwies ihm Ehre
  rationale: Das Piʿel von כבד bezeichnet hier, jemandem Ehre bzw. Gewicht und Ansehen zu verleihen. „Erwies ihm Ehre“ gibt dies natürlich wieder, ohne die stärkere Deutung „verherrlichte ihn“ festzulegen.
- source_word: אלהים
  choice: Gott
  rationale: Im Zusammenhang ist אלהים eindeutig die Bezeichnung des einen Gottes und Subjekt des Satzes.
- source_word: ויאמצהו
  choice: stärkte ihn
  rationale: 'אמץ hat hier kausative Bedeutung: stark machen bzw. stärken. Die knappe Wiedergabe folgt unmittelbar dem hebräischen Wortlaut.'
- source_word: במרומים
  choice: in den Höhen
  rationale: מרומים bezeichnet Höhen oder hohe Orte. „In den Höhen“ bewahrt das räumliche Bild und lässt offen, ob himmlische Erhöhung, ein erhöhter Rang oder ein anderer hoher Bereich gemeint ist.
theological_decisions:
- issue: Erhebliche Abweichung zwischen dem hebräischen und dem griechischen Text
  choice: 'Der erhaltene hebräische Wortlaut steht im Haupttext: „Gott erwies ihm Ehre und stärkte ihn in den Höhen.“'
  alternative: 'Der griechische Text lautet ausführlicher: „Er machte ihn der Herrlichkeit der Heiligen gleich und machte ihn groß in den Schrecken der Feinde.“'
  rationale: Der hebräische Zeuge ist hier vorhanden und mit hoher Sicherheit belegt; deshalb bildet er die Grundlage des Haupttexts. Die erhebliche griechische Abweichung wird jedoch transparent in einer Fußnote bewahrt und nicht harmonisiert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Formulierung ist knapp wie das Hebräische; „in den Höhen“ erhält die echte Bedeutungsunschärfe des Ausgangstextes.
