  yaml_path: translation/deuterocanon/sirach/045/021.yaml
  text: He gave him the choicest holy bread[a]; they shall eat the food offerings of Yahweh. The bread of the Presence is his portion[c][b], a gift to him and to his offspring.
translation:
  language: de
  text: Er gab ihm das Beste von den heiligen Gaben als Brot[a]; von den Feueropfern Jahwes sollen sie essen[b]. Das Brot der Gegenwart ist sein Anteil[c], eine Gabe für ihn und seine Nachkommen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: „Den ersten Anteil von den heiligen Dingen gab er ihm als Brot.“ Der hebräische Ausdruck ist stark verdichtet; „das Beste“ kann auch den ersten oder vornehmsten Anteil bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: „Feueropfer“ bezeichnet Opfergaben, die Jahwe auf dem Altar dargebracht wurden. Die Priester aßen die ihnen zugewiesenen Anteile davon.
    reason: cultic_clarification
  - marker: c
    text: Das „Brot der Gegenwart“ war heiliges Brot, das vor Gottes Angesicht ausgelegt wurde; traditionell wird es auch „Schaubrot“ genannt.
    reason: lexical_clarification
lexical_decisions:
- source_word: ראשית קדש
  choice: das Beste von den heiligen Gaben
  rationale: ראשית bezeichnet hier das Erste, Vorrangige oder Beste; קדש meint die geheiligten Dinge beziehungsweise Gaben. Die Wiedergabe wahrt den komprimierten hebräischen Ausdruck, ohne ihn vorschnell auf eine bestimmte Opferklasse festzulegen.
- source_word: לחם
  choice: als Brot
  rationale: Das hebräische Wort bedeutet ausdrücklich „Brot“. Die Konstruktion wird als Bestimmung der heiligen Gabe verstanden, bleibt aber durch die Fußnote für eine formalere Deutung offen.
- source_word: אשי יהוה
  choice: die Feueropfer Jahwes
  rationale: אשי bezeichnet kultische, dem Feuer übergebene Opfergaben. „Feueropfer“ ist quellennah und hält den Opferkontext sichtbar; die Fußnote erläutert, dass die Priester deren zugewiesene Anteile aßen.
- source_word: יאכלון
  choice: werden sie essen
  rationale: Die Pluralform bezieht Aaron und die priesterliche Nachkommenschaft als Begünstigte ein. Das Futur gibt die gewährte, fortdauernde priesterliche Berechtigung natürlich wieder.
- source_word: לחם פנים
  choice: das Schaubrot
  rationale: Dies ist der gebräuchliche deutsche Kultbegriff für das Brot, das vor Gottes Angesicht ausgelegt wurde. Eine Fußnote erklärt den heute nicht unmittelbar durchsichtigen Ausdruck.
- source_word: חלקו
  choice: ist sein Anteil
  rationale: חלק bezeichnet den zugeteilten Anteil. Die präsentische Formulierung entspricht dem knappen Nominalsatz und lässt die bleibende Zuweisung erkennen.
- source_word: ומתנה לו ולזרעו
  choice: eine Gabe für ihn und seine Nachkommen
  rationale: מתנה ist eine Gabe oder Zuwendung; זרעו bezeichnet in diesem Zusammenhang Aarons fortbestehende priesterliche Linie. „Nachkommen“ ist im modernen Deutschen klarer als das wörtliche „Same“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. „Jahwe“ gibt den Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Priesterliche Opferanteile
  choice: Feueropfer / Schaubrot
  alternative: Opfergaben / Brot der Gegenwart
  rationale: Die gewählten Ausdrücke bewahren den konkreten Kultzusammenhang. Zugleich erklärt eine Fußnote, dass nicht das vollständig Verbrannte, sondern die den Priestern zustehenden Anteile gegessen wurden.
- issue: Textumfang und Versabgrenzung
  choice: Beide im gelieferten hebräischen Text stehenden Sätze werden wiedergegeben
  alternative: Nur „Das Schaubrot ist sein Anteil …“ als Vers 21
  rationale: Im vorgelegten hebräischen Text steht die Verszahl erst vor לחם פנים, während die griechische Parallelüberlieferung für Vers 21 Motive aus dem vorausgehenden Satz mit der Gabe an Aaron und seine Nachkommen verbindet. Die Übersetzung folgt deshalb dem bereitgestellten Textrahmen, ohne die Überlieferungsdifferenz im Haupttext aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau bleibt knapp und parallel zum Hebräischen. Weniger geläufige Kultbegriffe werden beibehalten, aber in Fußnoten allgemeinverständlich erläutert. Die Mehrdeutigkeit von ראשית קדש wird nicht auf eine einzelne technische Opferkategorie verengt.
