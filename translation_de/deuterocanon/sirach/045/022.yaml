  language: en
  yaml_path: translation/deuterocanon/sirach/045/022.yaml
  text: But in their land he will not inherit[a], and among them he will not be allotted an inheritance; the offerings of Yahweh are his portion and his inheritance among the sons of Israel.
translation:
  language: de
  text: Doch in ihrem Land wird er keinen Erbbesitz erhalten, und in ihrer Mitte wird ihm kein Erbteil zugeteilt; die Feueropfer des HERRN sind sein Anteil und sein Erbbesitz inmitten der Israeliten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Parallele bietet stattdessen sinngemäß: »Denn er selbst ist dein Anteil und dein Erbbesitz.« Sie bezeugt damit eine andere Fassung des Schlusssatzes als der erhaltene hebräische Text: »Die Feueropfer des HERRN sind sein Anteil und sein Erbbesitz.«'
    reason: alternative_reading
lexical_decisions:
- source_word: אך
  choice: Doch
  rationale: Leitet den Gegensatz zur vorausgehenden Zuwendung an Aaron und seine Nachkommen würdig und natürlich ein.
- source_word: בארצם לא ינחל
  choice: in ihrem Land wird er keinen Erbbesitz erhalten
  rationale: Gibt נחל im Zusammenhang der Landzuteilung wieder und macht deutlich, dass es um erblichen Landbesitz geht.
- source_word: ובתוכם לא יחלק נחלה
  choice: in ihrer Mitte wird ihm kein Erbteil zugeteilt
  rationale: Die kontextuell passive Bedeutung wird durch die griechische Parallele gestützt; die Formulierung bewahrt zugleich den Begriff נחלה als »Erbteil«.
- source_word: אשי יהוה
  choice: die Feueropfer des HERRN
  rationale: אשי bezeichnet hier die dem HERRN dargebrachten Feueropfer; die präzisere Wiedergabe wahrt den kultischen Sinn des hebräischen Textes.
- source_word: חלקו ונחלתו
  choice: sein Anteil und sein Erbbesitz
  rationale: Bewahrt das rechtlich-kultische Begriffspaar und unterscheidet den laufenden Anteil von vererbtem Besitz.
- source_word: בתוך בני ישראל
  choice: inmitten der Israeliten
  rationale: Natürliches modernes Deutsch für die kollektiv gebrauchte Wendung »Söhne Israels«, ohne den Volksbezug abzuschwächen.
theological_decisions:
- issue: Abweichung zwischen dem hebräischen Schluss (die Feueropfer des HERRN als Anteil) und der griechischen Parallele (er selbst als Anteil und Erbe)
  choice: Der Haupttext folgt dem erhaltenen Hebräisch und bezeichnet die Feueropfer des HERRN als priesterlichen Anteil und Erbbesitz.
  alternative: 'Die griechische Parallele lautet sinngemäß: »Denn er selbst ist dein Anteil und Erbe.«'
  rationale: Der erhaltene hebräische Ben-Sira-Text ist die primäre Grundlage. Da die griechische Lesart eine theologisch bedeutsame andere Textform bezeugt, wird sie nicht harmonisiert, sondern in einer Fußnote dokumentiert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Erbbesitz« und »Erbteil« erhalten die Land- und Erbterminologie; »Feueropfer« gibt den kultischen Ausdruck präzise wieder. Die Fußnotenmarkierung steht am Versende, da sie die abweichende Fassung des gesamten Schlusssatzes betrifft.
