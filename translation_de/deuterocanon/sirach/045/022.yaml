  source_fidelity: 'Der Haupttext folgt dem erhaltenen hebräischen Text zuverlässig: אך ist angemessen adversativ mit „Doch“ wiedergegeben; die Verneinung eines Land-/Erbanteils und die kultische Bestimmung von אשי יהוה als „Feueropfer des HERRN“ bleiben erhalten. Die Singularformen („er“, „sein“) entsprechen dem Hebräischen. „Inmitten der Israeliten“ gibt בתוך בני ישראל idiomatisch und sachlich zutreffend wieder.'
  naturalness: Der Vers ist modernes, würdiges Standarddeutsch und bewahrt die juristisch-kultische Terminologie verständlich. Die Verbindung „sein Anteil und sein Erbbesitz inmitten der Israeliten“ ist möglich und spiegelt die Stellung der hebräischen Orts-/Gruppenangabe angemessen.
  terminology: '„Feueropfer“ ist für אשי יהוה präzise. „Erbbesitz“ und „Erbteil“ unterscheiden die beiden Aussagen verständlich, ohne den Sinn zu verändern. In der Fußnote ist jedoch „Erbe“ nicht passend: Im gegenwärtigen Deutsch bezeichnet es gewöhnlich eine Person, die erbt, statt den Besitz bzw. das Erbteil. Die griechische κληρονομία muss dort als „Erbbesitz“ oder „Erbteil“ wiedergegeben werden.'
