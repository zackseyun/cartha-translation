base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/045/006.yaml
  text: He exalted Aaron[a], a holy one like himself, from the tribe of Levi[b], and made him an everlasting statute.
translation:
  language: de
  text: Er erhob Aaron[a], einen Heiligen aus dem Stamm Levi, und setzte ihn als ewige Ordnung ein.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Parallelüberlieferung lautet ausführlicher: „Aaron erhob er, heilig wie er, seinen Bruder, aus dem Stamm Levi.“ „Wie er“ bezieht sich dort wahrscheinlich auf Mose.'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlicher auch: „und machte ihn zu einer ewigen Satzung“. Gemeint ist wahrscheinlich Aarons bleibende Einsetzung in die priesterliche Ordnung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וירם
  choice: Er erhob
  rationale: Der Hifil von רום bedeutet hier „erheben“ beziehungsweise „hoch erhöhen“. „Er erhob“ wahrt den ehrenvollen Zusammenhang und entspricht dem griechischen ὕψωσεν, ohne den im Vers unausgesprochenen Handelnden ausdrücklich als Gott zu benennen.
- source_word: קדוש
  choice: einen Heiligen
  rationale: Das artikellose קדוש steht als Apposition zu Aaron. Der unbestimmte Ausdruck bewahrt diese Form und vermeidet die überdeutende Wiedergabe „den Heiligen“.
- source_word: את אהרן
  choice: Aaron
  rationale: את kennzeichnet das direkte Objekt; der Personenname wird in seiner üblichen deutschen Form wiedergegeben.
- source_word: למטה לוי
  choice: aus dem Stamm Levi
  rationale: מַטֶּה bezeichnet im genealogischen Zusammenhang einen Stamm. Die Präposition ל־ kann Zugehörigkeit ausdrücken; idiomatisches Deutsch gibt dies hier mit „aus dem Stamm Levi“ wieder, in Übereinstimmung mit dem griechischen ἐκ φυλῆς Λευεί.
- source_word: וישימהו
  choice: und setzte ihn … ein
  rationale: שׂים kann „setzen“, „bestimmen“ oder „einsetzen“ bedeuten. „Setzte ihn … ein“ lässt den institutionellen Sinn erkennen, ohne das im Ausgangstext nicht ausdrücklich genannte Priestertum einzufügen.
- source_word: לחק עולם
  choice: als ewige Ordnung
  rationale: חֹק bezeichnet eine festgesetzte Ordnung, Satzung oder Bestimmung; עוֹלָם drückt bleibende beziehungsweise unabsehbare Dauer aus. „Ewige Ordnung“ erhält den rechtlich-bundestheologischen Klang und ist im Deutschen verständlicher als die wörtlichere Form „zu einer ewigen Satzung“.
- source_word: ὅμοιον αὐτῷ ἀδελφὸν αὐτοῦ
  choice: 'in der Fußnote: „heilig wie er, seinen Bruder“'
  rationale: Diese griechische Erweiterung fehlt in der vorliegenden hebräischen Zeile. Sie wird als wichtige Parallelüberlieferung dokumentiert, aber wegen des gut bezeugten hebräischen Textes und des mehrdeutigen Bezugs von αὐτῷ nicht in den Haupttext aufgenommen.
theological_decisions:
- issue: Identität des unausgesprochenen Subjekts
  choice: Das Pronomen „Er“ bleibt ohne ausdrückliche Benennung stehen.
  alternative: „Gott erhob Aaron“ oder „Der Herr erhob Aaron“
  rationale: Das hebräische Verb enthält ein männliches Subjekt der dritten Person, nennt dieses aber nicht. Der Zusammenhang weist auf Gott, doch eine ausdrückliche Benennung würde dem Vers Wörter hinzufügen.
- issue: Verhältnis der griechischen Erweiterung zum hebräischen Hauptzeugen
  choice: Die griechische Lesart wird in einer textkritischen Fußnote wiedergegeben.
  alternative: „Er erhob Aaron, einen Heiligen wie ihn, seinen Bruder aus dem Stamm Levi“ im Haupttext
  rationale: Der hebräische Text ist hier mit hoher Sicherheit überliefert und enthält weder „wie er“ noch „seinen Bruder“. Zudem könnte „wie er“ im deutschen Haupttext irreführend auf Gott statt auf Mose bezogen werden. Die Fußnote bewahrt den vollständigen griechischen Parallelzeugen, ohne ihn stillschweigend in den hebräischen Text einzubauen.
- issue: Bedeutung von לחק עולם in Bezug auf Aaron
  choice: „setzte ihn als ewige Ordnung ein“
  alternative: „bestimmte ihn zu einer ewigen Satzung“ oder „setzte ihn in ein immerwährendes Priesteramt ein“
  rationale: Die hebräische Wendung identifiziert Aaron in gedrängter Form mit einer dauerhaften Ordnung. Die gewählte Fassung erhält diese Spannung; eine ausdrückliche Nennung des Priesteramts wäre zwar sachlich naheliegend, ginge aber über den Wortlaut hinaus.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Ewige Ordnung“ wahrt den rechtlich-feierlichen Ton, während „setzte … ein“ die stark verdichtete hebräische Konstruktion verständlich macht. Die griechische Erweiterung wird wegen ihres Umfangs und ihres potenziell missverständlichen Pronominalbezugs nicht in den Haupttext vermischt.
