translation:
  language: de
  text: heilige Gewänder aus Goldfäden, blauem und purpurfarbenem Garn, in kunstvoller Musterarbeit; die Brusttasche der Rechtsprechung[a], das Efod und die Schärpe sowie scharlachrotes Garn[b], Webarbeit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die »Brusttasche der Rechtsprechung« entspricht der priesterlichen Bezeichnung im Buch Exodus; gemeint ist die vom Hohepriester getragene Brusttasche, die mit der Ermittlung einer Entscheidung verbunden war.
    reason: cross_reference
  - marker: b
    text: 'Oder: karmesinrotes Garn. Das Hebräische bezeichnet das scharlach- beziehungsweise karmesinrote Textilmaterial der Priestergewänder.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בגדי קודש
  choice: heilige Gewänder
  rationale: Die knappe Status-constructus-Verbindung wird direkt und in der deutschen Kultsprache natürlich wiedergegeben.
- source_word: זהב תכלת, וארגמן
  choice: aus Gold, blauem und purpurfarbenem Stoff
  rationale: Die Reihe nennt kostbare Materialien beziehungsweise Farbstoffe der Priesterkleidung. Die Ergänzung „Stoff“ macht im Deutschen verständlich, dass Blau und Purpur textile Materialien bezeichnen, ohne einen exakten Farbton festzulegen.
- source_word: מעשה חשב
  choice: kunstvoll gearbeitet
  rationale: Die Wendung bezeichnet anspruchsvolle, wohl gemusterte Textilarbeit. Die Übersetzung bewahrt die handwerkliche Kunstfertigkeit, ohne die konkrete Technik als Stickerei oder Weberei zu präzisieren.
- source_word: חשן משפט
  choice: Brusttasche des Rechtsspruchs
  rationale: „Brusttasche“ bezeichnet das priesterliche Kultobjekt verständlich; „des Rechtsspruchs“ wahrt den Bezug von משפט auf richterliche beziehungsweise entscheidende Weisung.
- source_word: אפוד
  choice: Efod
  rationale: Für den technischen kultischen Gegenstand gibt es keine genaue knappe deutsche Entsprechung; daher ist die etablierte Transkription angemessen.
- source_word: ואזור
  choice: die Schärpe
  rationale: „Schärpe“ ist eine verständliche moderne Bezeichnung für das gürtelartige Kleidungsstück.
- source_word: ושני תולעת
  choice: karmesinrotes Garn
  rationale: Die hebräische Textilbezeichnung meint scharlach- beziehungsweise karmesinrotes Material. „Garn“ passt zum unmittelbaren Webkontext.
- source_word: מעשה אורג
  choice: von einem Weber gefertigt
  rationale: Die ausdrückliche Nennung des Webers bleibt erhalten und wird von der allgemeineren kunstvollen Arbeit in der ersten Vershälfte unterschieden.
theological_decisions:
- issue: Kultische Fachsprache der hohepriesterlichen Gewänder
  choice: Den technischen Ausdruck „Efod“ beibehalten und die übrigen Gegenstände verständlich übersetzen.
  alternative: Alle Kleidungsstücke rein beschreibend wiedergeben.
  rationale: Der Vers greift die Terminologie der Priesterschriften auf. „Efod“ hat keine eindeutige deutsche Sachentsprechung; bei den anderen Ausdrücken ist eine verständliche Übersetzung möglich.
- issue: Bedeutung von משפט in חשן משפט
  choice: „Brusttasche des Rechtsspruchs“
  alternative: „Brusttasche des Gerichts“ oder „Entscheidungstasche“
  rationale: „Rechtsspruch“ erhält sowohl den forensischen als auch den entscheidungsbezogenen Sinn, ohne die Funktion des Gegenstands dogmatisch festzulegen.
translation_notes:
  register: 'Modernes, würdiges Standarddeutsch. Die parallelen Handwerksausdrücke werden unterschieden: zuerst allgemeine kunstvolle Arbeit, dann ausdrücklich die Arbeit eines Webers. Gegenüber dem unvollständigeren griechischen Paralleltext folgt der Entwurf dem gut bezeugten hebräischen Text.'
