base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/045/023.yaml
  text: And Phinehas son of Eleazar inherited a third place in might[c][b][a], because he was zealous for the God of all and stood in the breach for his people.
translation:
  language: de
  text: Auch Pinhas, der Sohn Eleasars, nahm in Tapferkeit den dritten Rang ein[a], weil er für den Gott des Alls eiferte und für sein Volk in die Bresche trat[b].[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Griechisch: „der Dritte zur Herrlichkeit“; das Hebräische verbindet seinen dritten Rang mit Tapferkeit bzw. Stärke.'
    reason: textual_variant
  - marker: b
    text: „In die Bresche treten“ ist ein hebräisches Bild für schützendes oder stellvertretendes Eingreifen in einer Gefahr für die Gemeinschaft.
    reason: cultural_note
  - marker: c
    text: 'Der griechische Text fährt fort: „Und er schaffte Sühne für Israel.“ Dieser Satz fehlt hier im erhaltenen hebräischen Text.'
    reason: textual_variant
lexical_decisions:
- source_word: נחל שלישי
  choice: fiel … der dritte Rang zu
  rationale: נחל bezeichnet wörtlich das Erben bzw. Empfangen eines Anteils. Im Zusammenhang ist ein Ehrenrang gemeint. „Fiel … zu“ bewahrt den Gedanken des Empfangens, klingt im Deutschen aber natürlicher als „erbte den dritten Rang“.
- source_word: בגבורה
  choice: durch seine Tapferkeit
  rationale: גבורה bezeichnet Stärke, Heldenmut oder Tapferkeit. Die instrumentale Wiedergabe passt zum Zusammenhang und folgt dem hebräischen Zeugnis gegenüber dem griechischen „zur Herrlichkeit“.
- source_word: בקנאו
  choice: weil er … eiferte
  rationale: Die Präposition ב mit dem Infinitiv kann Umstand, Mittel oder Grund bezeichnen. Hier gibt „weil“ den naheliegenden Zusammenhang zwischen dem Eifer des Pinhas und seiner Ehrung verständlich wieder, ohne die Anspielung weiter auszudeuten.
- source_word: לאלוה כל
  choice: für den Gott des Alls
  rationale: Die ungewöhnliche Gottesbezeichnung wird eng am Hebräischen wiedergegeben. „Des Alls“ bringt die umfassende Aussage zum Ausdruck, ohne sie an eine geläufigere Formel anzugleichen.
- source_word: ויעמוד בפרץ
  choice: trat … in die Bresche
  rationale: Die hebräische Wendung bezeichnet entschlossenes schützendes oder stellvertretendes Eingreifen in einer gemeinschaftlichen Krise. Das deutsche Idiom bewahrt sowohl das Bild als auch seine Funktion.
- source_word: עמו
  choice: für sein Volk
  rationale: Im Zusammenhang mit „in die Bresche treten“ macht „für“ deutlich, dass Pinhas zugunsten seines Volkes handelt. Gemeint ist Israel.
theological_decisions:
- issue: Verhältnis zwischen dem Eifer des Pinhas und seinem Ehrenrang
  choice: Sein Rang wird als Folge seines Eifers für Gott und seines Eingreifens für das Volk dargestellt.
  alternative: 'Die Formulierung kann zeitlich oder modal verstanden werden: Er erhielt den Rang, als oder indem er eiferte.'
  rationale: Das hebräische בְּקַנְאוֹ lässt mehrere eng verwandte Verhältnisbestimmungen zu. Im Kontext ist die kausale Nuance wahrscheinlich, doch die Übersetzung fügt keine über den Vers hinausgehende Begründung hinzu.
- issue: Sühnendes Handeln des Pinhas
  choice: Der Satz „und er schaffte Sühne für Israel“ wird nicht in den Haupttext aufgenommen.
  alternative: Die griechische Überlieferung nennt ausdrücklich, dass Pinhas für Israel Sühne schaffte.
  rationale: Dieser Satz steht im griechischen Paralleltext, fehlt jedoch im vorliegenden hebräischen Zeugnis. Er wird deshalb als bedeutsame Textvariante in einer Fußnote dokumentiert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die ungewöhnliche Gottesbezeichnung „der Gott des Alls“ und das anschauliche Idiom „in die Bresche treten“ bleiben erhalten. Die syntaktisch schwerfällige wörtliche Form „erbte den dritten Rang“ wird zugunsten von „fiel … der dritte Rang zu“ natürlich wiedergegeben.
