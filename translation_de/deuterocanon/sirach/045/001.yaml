translation:
  language: de
  text: Geliebt von Gott und Menschen war Mose,[a] sein Andenken ist zum Segen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die griechische Fassung ist länger. Vor der Nennung des Mose heißt es dort, Gott habe aus ihm „einen Mann des Erbarmens“ hervorgehen lassen, der „Gunst in den Augen allen Fleisches“ fand. Diese Worte fehlen im vorliegenden hebräischen Text.
    reason: textual_variant
  - marker: b
    text: 'Wörtlicher: „Sein Andenken ist zum Guten.“ Die griechische Fassung lautet: „Sein Andenken ist in Segnungen.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: אהוב
  choice: geliebt
  rationale: Die passive Bedeutung wird direkt und natürlich wiedergegeben; zugleich bleibt der ehrende Ton erhalten. Das griechische ἠγαπημένον bestätigt diese Auffassung.
- source_word: אלהים
  choice: Gott
  rationale: Im Zusammenhang mit Mose bezeichnet אלהים eindeutig den Gott Israels.
- source_word: ואנשים
  choice: und Menschen
  rationale: אנשים kann Männer oder allgemein Menschen bezeichnen. Hier ist „Menschen“ im Deutschen natürlich und wird durch das allgemeinere griechische ἀνθρώπων gestützt.
- source_word: משה
  choice: Mose
  rationale: Gebräuchliche deutsche Namensform.
- source_word: זכרו
  choice: sein Andenken
  rationale: „Andenken“ gibt die ehrende Erinnerung an Mose im Deutschen idiomatisch wieder und entspricht auch dem griechischen μνημόσυνον.
- source_word: לטובה
  choice: bleibt in Segen
  rationale: Wörtlich bedeutet die Wendung „zum Guten“. Im Zusammenhang ehrenden Gedenkens bezeichnet sie ein gesegnetes Andenken; das griechische ἐν εὐλογίαις bestätigt diesen Sinn. „Bleibt“ macht die im nominalen hebräischen Satz ausgedrückte fortdauernde Geltung natürlich verständlich.
theological_decisions:
- issue: Verhältnis des hebräischen Textes zur längeren griechischen Fassung
  choice: Der Haupttext folgt dem erhaltenen hebräischen Wortlaut; die griechischen Zusätze werden nur in einer Fußnote genannt.
  alternative: Die griechischen Worte aufnehmen, wonach Gott aus ihm „einen Mann des Erbarmens“ hervorgehen ließ, der „Gunst in den Augen allen Fleisches“ fand.
  rationale: Der vorliegende hebräische Zeuge hat für den Haupttext Vorrang. Die längere griechische Fassung ist textgeschichtlich bedeutsam, darf aber nicht stillschweigend in den hebräischen Wortlaut eingefügt werden.
- issue: Deutung von זכרו לטובה
  choice: sein Andenken bleibt in Segen
  alternative: sein Andenken ist zum Guten
  rationale: Die Übersetzung gibt den idiomatischen Sinn verständlich wieder, ohne ihn konfessionell oder dogmatisch auszudeuten. Die griechische Parallele „in Segnungen“ stützt diese Wiedergabe.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe, feierliche Form des hebräischen Lobspruchs bleibt erhalten; die Wortstellung nennt Mose erst nach dem Prädikat und bewahrt so den rhetorischen Nachdruck.
