  text: At his word the signs came quickly[a], and he strengthened him before a king. He commanded him concerning the people[c][b], and showed him his glory.
translation:
  language: de
  text: Auf sein Wort hin kamen die Zeichen schnell[a], und er stärkte ihn vor einem König[b]. Er gab ihm Weisungen für das Volk, und ließ ihn seine Herrlichkeit sehen[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Fassung lautet: „Durch seine Worte brachte er Zeichen zum Stillstand“, statt: „kamen die Zeichen schnell“.'
    reason: textual_variant
  - marker: b
    text: 'Die griechische Fassung hat: „Er verherrlichte ihn vor Königen“, statt: „Er stärkte ihn vor einem König“.'
    reason: textual_variant
  - marker: c
    text: 'Der überlieferte hebräische Wortlaut ist hier schwierig und kann „und sie sahen seine Herrlichkeit“ bedeuten. Die griechische Fassung stützt den im Haupttext wiedergegebenen Sinn: „und ließ ihn seine Herrlichkeit sehen“.'
    reason: textual_variant
lexical_decisions:
- source_word: בדבריו
  choice: Auf sein Wort hin
  rationale: Die Wendung gibt die instrumentale beziehungsweise auslösende Kraft von ב־דבר wieder. Der deutsche Singular klingt natürlich, während das Hebräische und das griechische ἐν λόγοις αὐτοῦ weiterhin im Blick bleiben.
- source_word: האותות
  choice: die Zeichen
  rationale: „Zeichen“ ist die direkte und theologisch offene Wiedergabe von אותות und entspricht dem griechischen σημεῖα; „Wunder“ wäre deutender.
- source_word: מהרו
  choice: kamen ... schnell
  rationale: Das hebräische Verb bezeichnet Eile. Da „die Zeichen eilten“ im Deutschen unnatürlich wirkt, vermittelt diese Formulierung den Sinn lesbar.
- source_word: ויחזקהו
  choice: er stärkte ihn
  rationale: Die Hifilform von חזק bedeutet gewöhnlich „stärken“ oder „stark machen“. Die abweichende griechische Lesart wird in einer Fußnote bewahrt.
- source_word: לפני מלך
  choice: vor einem König
  rationale: Das Hebräische hat keinen Artikel und steht im Singular. Daher ist „vor einem König“ formal angemessener als „vor dem König“.
- source_word: ויצוהו אל העם
  choice: Er gab ihm Weisungen für das Volk
  rationale: צוה bezeichnet das Gebieten oder Erteilen von Weisungen. Die Präposition אל ist hier schwierig; „für das Volk“ gibt den wahrscheinlichen Bezug der Weisungen idiomatisch wieder, ohne ihn unnötig einzuengen.
- source_word: ויראו את כבודו
  choice: und ließ ihn seine Herrlichkeit sehen
  rationale: Der überlieferte hebräische Wortlaut scheint „und sie sahen seine Herrlichkeit“ zu ergeben, ist im Zusammenhang jedoch schwierig. Das griechische ἔδειξεν αὐτῷ τῆς δόξης αὐτοῦ stützt den Sinn, dass Gott ihn seine Herrlichkeit sehen ließ.
theological_decisions:
- issue: Gewichtung des erhaltenen hebräischen Textes gegenüber der griechischen Parallelüberlieferung
  choice: Wo der hebräische Text verständlich ist, bestimmt er den Haupttext; im schwierigen Schlussglied wird der griechisch gestützte Sinn verwendet.
  alternative: 'Den hebräischen Konsonantentext durchgehend wiedergeben: „und sie sahen seine Herrlichkeit“; oder vollständig der griechischen Fassung folgen.'
  rationale: So bleibt der hebräische Zeuge vorrangig, während die als erhebliche Textabweichung gekennzeichnete Schlussform mithilfe der alten griechischen Überlieferung verständlich wiedergegeben wird. Sämtliche bedeutenden Abweichungen werden offengelegt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt nahe am Hebräischen, wird aber dort idiomatisch geglättet, wo eine wörtliche Wiedergabe missverständlich oder unnatürlich wäre. Die Gottesbezüge bleiben wie in der Quelle pronominal und werden nicht erklärend ergänzt.
