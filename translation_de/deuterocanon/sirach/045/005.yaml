    text: 'Der griechische Text liest: »Gebote« statt »das Gebot«.'
    reason: textual_variant
  - marker: b
    text: 'Der griechische Text lautet hier: »damit er Jakob den Bund und Israel seine Rechtsbestimmungen lehre«; der hebräische Text hat: »Jakob seine Satzungen und Israel seine Zeugnisse und Rechtsbestimmungen«.'
    reason: alternative_reading
lexical_decisions:
- source_word: וישמיעהו את קולו
  choice: Er ließ ihn seine Stimme hören
  rationale: Der Hifil von שמע ist kausativ. Die Formulierung gibt natürlich wieder, dass Gott Mose seine Stimme hören ließ, ohne die Kausalität zu überzeichnen.
- source_word: ויגישהו לערפל
  choice: führte ihn in das Dunkel der Wolke
  rationale: נגש im Hifil bezeichnet das Heranführen; ערפל ist die dichte, dunkle Erscheinungswolke der Theophanie. Die Wendung bewahrt sowohl das Dunkel als auch den im Kontext naheliegenden Wolkencharakter.
- source_word: מצוה
  choice: das Gebot
  rationale: Der Singular des hebräischen Hauptzeugen wird beibehalten. Der griechische Paralleltext hat dagegen den Plural, der in der Fußnote dokumentiert wird.
- source_word: תורת חיים ותבונה
  choice: eine Weisung zum Leben und zur Einsicht
  rationale: תורה kann Gesetz oder Weisung bedeuten. »Weisung« klingt im modernen Deutsch natürlich und wahrt den umfassenderen Sinn; die Genitivverbindung wird idiomatisch als Ziel beziehungsweise Wirkung verstanden. תבונה bezeichnet Einsicht oder Verständnis.
- source_word: ללמד ביעקב חוקיו
  choice: damit er Jakob seine Satzungen ... lehre
  rationale: Der Infinitiv bezeichnet den Zweck. Das ב bei Jakob wird entsprechend dem idiomatischen deutschen Gebrauch als Personenobjekt wiedergegeben; חוקים sind festgesetzte Satzungen.
- source_word: ועדותיו ומשפטיו לישראל
  choice: und Israel seine Zeugnisse und Rechtsentscheide
  rationale: עדותיו wird als »seine Zeugnisse« wiedergegeben und bewahrt den Bundes- und Offenbarungsbezug, ohne ihn auf »Bund« festzulegen. משפטיו hat rechtlichen Nachdruck; »Rechtsentscheide« ist präziser und gegenwärtiger als das missverständliche »Gerichte«.
theological_decisions:
- issue: Theophanische Bildsprache von ערפל
  choice: das Dunkel der Wolke
  alternative: dichtes Dunkel; Dunkelheit
  rationale: Die Übersetzung hält Verborgenheit und Wolkenerscheinung am Sinai zusammen, ohne die Bildsprache auf bloße Finsternis oder eine gewöhnliche Wolke zu reduzieren.
- issue: Abweichung zwischen hebräischem und griechischem Text bei den Rechtsbegriffen
  choice: das Gebot ... seine Satzungen ... seine Zeugnisse und Rechtsentscheide
  alternative: Gebote ... den Bund und seine Rechtsentscheide
  rationale: Der erhaltene, als zuverlässig eingestufte hebräische Text ist die Grundlage des Haupttexts. Die substanzielle griechische Variante wird transparent in den Fußnoten bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Weisung« vermeidet eine unnötige Verengung von תורה, während »Satzungen«, »Zeugnisse« und »Rechtsentscheide« die unterschiedlichen hebräischen Rechtstermini erkennbar halten. Alle Variantenmarker stehen an den einschlägigen Stellen im Haupttext.
