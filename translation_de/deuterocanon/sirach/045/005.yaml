base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/045/005.yaml
  text: He let him hear his voice[a], and brought him near into the dark cloud. He placed in his hand the commandment, a law of life and understanding, to teach Jacob his statutes[b], and Israel his testimonies and judgments.
translation:
  language: de
  text: Er ließ ihn seine Stimme hören und führte ihn in das dichte Dunkel. Er legte das Gebot[a] in seine Hand, eine Weisung für Leben und Einsicht, damit er Jakob seine Satzungen und Israel seine Zeugnisse und Rechtsbestimmungen lehre.[b]
  philosophy: optimal-equivalence
  footnotes:
