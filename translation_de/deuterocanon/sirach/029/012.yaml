  text: Store up almsgiving in your treasuries[b][a], and it will rescue you from every affliction.
translation:
  language: de
  text: Schließe das Almosengeben in deinen Schatzkammern ein,[a] dann wird es dich aus jeder Bedrängnis befreien.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Schließe das Almosengeben in deinen Schatzkammern ein“; sinngemäß auch: „Bewahre Wohltätigkeit in deinen Vorratskammern auf“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „dann wird es dich von jeder Misshandlung befreien“; das griechische Wort kann auch Not, Leid oder Bedrückung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σύγκλεισον
  choice: Schließe … ein
  rationale: Das Verb bedeutet wörtlich „zusammenschließen, einschließen“. Die konkrete Bildsprache des sicheren Verwahrens bleibt damit erhalten.
- source_word: ἐλεημοσύνην
  choice: das Almosengeben
  rationale: Im hellenistisch-jüdischen Sprachgebrauch bezeichnet das Wort hier konkrete wohltätige Hilfe für Bedürftige, nicht nur ein allgemeines Gefühl des Erbarmens.
- source_word: ἐν τοῖς ταμείοις σου
  choice: in deinen Schatzkammern
  rationale: ταμεῖον kann Vorratsraum, Kammer oder Schatzkammer bedeuten. „Schatzkammern“ bringt das Bild eines sicher verwahrten kostbaren Gutes prägnant zum Ausdruck.
- source_word: ἐξελεῖταί
  choice: wird … befreien
  rationale: Das Verb bezeichnet das Herausreißen oder Befreien aus einer Notlage. „Befreien“ ist natürlich und vermeidet eine unnötige dogmatische Festlegung durch „retten“.
- source_word: ἐκ πάσης κακώσεως
  choice: aus jeder Bedrängnis
  rationale: κακώσις kann Misshandlung, Not, Bedrückung oder Leid bezeichnen. „Bedrängnis“ wahrt die Breite und passt zum Kontext der Befreiung aus Not.
theological_decisions:
- issue: Personifizierte Schutzwirkung des Almosengebens
  choice: dann wird es dich aus jeder Bedrängnis befreien
  alternative: und dieses wird dich von allem Übel erlösen
  rationale: Der griechische Text schreibt dem Almosengeben unmittelbar eine schützende Wirkung zu. Diese theologische Spannung wird weder abgeschwächt noch durch spätere Lehrbegriffe erklärt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die bewusst ungewöhnliche Metapher des Einschließens von Almosengeben in Schatzkammern bleibt erhalten; die Fußnoten erläutern ihre idiomatische Bedeutung und die Spannweite von κακώσις.
