  text: Go out[a], sojourner, from the place of honor, for my brother has become my guest[b], and I need the lodging.
translation:
  language: de
  text: Geh hinaus, Fremder, fort vom Ehrenplatz[a]; denn mein Bruder ist bei mir zu Gast, und ich brauche die Unterkunft[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „von dem geehrten Platz“; wörtlicher etwa: „weg vom Angesicht der Ehre“. Die griechische Wendung ist ungewöhnlich. Wahrscheinlich soll der Fremde einen hervorgehobenen oder ehrenvollen Platz verlassen, um einem anderen Gast Raum zu geben.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „ich brauche Gastfreundschaft“ oder „es besteht Bedarf an Unterkunft“. Das Griechische betont die Notwendigkeit, die durch die Aufnahme eines weiteren Gastes entsteht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔξελθε
  choice: Geh hinaus
  rationale: Der direkte Imperativ von ἐξέρχομαι wird knapp und mit der schroffen Wirkung der Aufforderung wiedergegeben.
- source_word: πάροικε
  choice: Fremder
  rationale: πάροικος bezeichnet einen nicht einheimischen, sozial weniger abgesicherten Bewohner auf Zeit. „Fremder“ ist im heutigen Deutsch verständlich und vermeidet das fachsprachliche „ansässiger Ausländer“ sowie das altertümliche „Beisasse“.
- source_word: ἀπὸ προσώπου δόξης
  choice: fort vom Ehrenplatz
  rationale: Wörtlich etwa „weg vom Angesicht der Ehre/Herrlichkeit“. Die ungewöhnliche Wendung bezeichnet im Zusammenhang wahrscheinlich einen hervorgehobenen oder ehrenvollen Platz; „fort vom Ehrenplatz“ bewahrt sowohl die räumliche Bewegung als auch diesen wahrscheinlichen Sinn.
- source_word: ἐπεξενώταί μοι
  choice: ist bei mir zu Gast
  rationale: Die Perfektform eines Verbs aus dem Bedeutungsfeld von Fremdsein und Gastfreundschaft beschreibt den eingetretenen Zustand, dass jemand als Gast aufgenommen worden ist. „Bei mir zu Gast sein“ ist dafür natürliches modernes Deutsch.
- source_word: ὁ ἀδελφός
  choice: mein Bruder
  rationale: Der griechische Artikel steht hier in einem sozialen Zusammenhang, in dem das Deutsche idiomatisch ein Possessivpronomen verwendet. „Bruder“ lässt offen, ob ein leiblicher Bruder oder ein naher Angehöriger beziehungsweise Gemeinschaftsgenosse gemeint ist.
- source_word: χρεία τῆς ξενίας
  choice: ich brauche die Unterkunft
  rationale: χρεία bezeichnet Bedarf oder Notwendigkeit, ξενία kann Gastfreundschaft oder Unterkunft bedeuten. Die verbale deutsche Fassung ist natürlich; „Unterkunft“ passt zur konkreten Notwendigkeit, für den neu aufgenommenen Gast Raum bereitzustellen.
