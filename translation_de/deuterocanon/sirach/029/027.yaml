translation_notes:
  register: Moderne, würdige Standardsprache. Der schroffe Imperativ und die soziale Verletzlichkeit des angesprochenen Fremden bleiben erhalten. Die ungewöhnliche Bildsprache von ἀπὸ προσώπου δόξης und die Bedeutungsbreite von ξενία werden im Haupttext lesbar wiedergegeben und in den Fußnoten offengehalten.
