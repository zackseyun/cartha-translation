  text: A sinner will overturn the good things of a guarantor,[a]
translation:
  language: de
  text: Ein Sünder wird Hab und Gut eines Bürgen zugrunde richten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher und weiter gefasst: „wird die guten Dinge eines Bürgen zunichtemachen“. Das griechische Wort kann gute Dinge, Vorteile oder Besitz bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγαθὰ
  choice: Hab und Gut
  rationale: Das substantivierte Neutrum Plural bezeichnet allgemein gute Dinge und kann besonders Besitz oder Vermögen meinen. Im Zusammenhang mit einer Bürgschaft gibt „Hab und Gut“ den naheliegenden wirtschaftlichen Sinn natürlich wieder; die größere Bedeutungsbreite wird in der Fußnote offengehalten.
- source_word: ἐγγύου
  choice: eines Bürgen
  rationale: ἐγγύος bezeichnet jemanden, der für einen anderen eine Bürgschaft übernimmt. „Bürge“ ist der klare und übliche deutsche Rechts- und Finanzbegriff.
- source_word: ἀνατρέψει
  choice: wird … zugrunde richten
  rationale: ἀνατρέπω bedeutet wörtlich „umstürzen, umkehren“ und kann übertragen „ruinieren, zugrunde richten“ heißen. Bei Hab und Gut ist die übertragene deutsche Wendung idiomatisch und bewahrt die zerstörerische Stärke des Verbs.
- source_word: ἁμαρτωλός
  choice: Ein Sünder
  rationale: Der artikellose Singular ist hier am besten generisch zu verstehen. „Ein Sünder“ gibt die moralische Bezeichnung direkt wieder, ohne zusätzliche geschlechtliche oder lehrmäßige Bestimmungen einzuführen.
theological_decisions:
- issue: Moralische Bezeichnung des Handelnden
  choice: Ein Sünder
  alternative: Ein sündiger Mensch
  rationale: Die knappe substantivische Bezeichnung entspricht dem griechischen ἁμαρτωλός und bewahrt den Charakter einer ethischen Warnung, ohne die Aussage abzuschwächen oder auszuweiten.
- issue: Umfang des Schadens für den Bürgen
  choice: wirtschaftlicher Ruin, mit offengehaltener weiterer Bedeutung
  alternative: Zerstörung all dessen, was für den Bürgen gut ist
  rationale: Der Bürgschaftskontext legt Besitz und Vermögen nahe, doch ἀγαθὰ ist lexikalisch weiter. Die Hauptübersetzung folgt dem Kontext, während die Fußnote die echte Bedeutungsbreite ausdrücklich bewahrt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdig-knapper Spruchweisheit. „Hab und Gut“ ist idiomatisch und passt zum Bürgschaftskontext; die Fußnote verhindert eine unnötige Verengung des griechischen Ausdrucks.
