  yaml_path: translation/deuterocanon/sirach/029/022.yaml
  text: Better is the life of a poor man under shelter than splendid food in another's house[a][b].
translation:
  language: de
  text: Besser ist das Leben eines Armen unter einem schützenden Dach[a] als prächtige Speisen in einem fremden Haus[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das griechische Partizip δοκῶν ist an dieser Stelle textlich oder lexikalisch schwierig; gewöhnlich bedeutet es »scheinend« oder »meinend«. Die Übersetzung folgt dem erkennbaren Sinn des Sprichworts: Ein bescheidenes Leben mit schützendem Obdach ist besser als üppige Mahlzeiten in Abhängigkeit von anderen.'
    reason: textual_variant
  - marker: b
    text: 'Oder: »prächtige Speisen unter Fremden« beziehungsweise »in Häusern anderer«. Das griechische ἐν ἀλλοτρίοις kann allgemeiner das bezeichnen, was anderen gehört, oder den Aufenthalt unter Fremden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κρείσσων
  choice: Besser ist
  rationale: Der Komparativ leitet eine sprichwörtliche Gegenüberstellung ein; die Formulierung ist im Deutschen natürlich und würdevoll.
- source_word: βίος πτωχοῦ
  choice: das Leben eines Armen
  rationale: βίος bezeichnet hier das Leben beziehungsweise die Lebensweise insgesamt; der Genitiv πτωχοῦ wird formal bewahrt.
- source_word: ὑπὸ σκέπην
  choice: unter einem schützenden Dach
  rationale: σκέπη bezeichnet Schutz oder Obdach. Die Wendung erhält das konkrete Bild und klingt im modernen Deutschen natürlich.
- source_word: δοκῶν
  choice: im Haupttext nicht gesondert wiedergegeben
  rationale: Das überlieferte Partizip ist im Zusammenhang schwierig und bedeutet gewöhnlich »scheinend« oder »meinend«. Eine wörtliche Wiedergabe ergäbe hier keinen klaren Sinn; die Unsicherheit wird ausdrücklich in Fußnote [a] offengelegt.
- source_word: ἢ
  choice: als
  rationale: Übliche deutsche Wiedergabe der Vergleichspartikel nach einem Komparativ.
- source_word: ἐδέσματα λαμπρά
  choice: prächtige Speisen
  rationale: ἐδέσματα sind zubereitete Speisen; λαμπρά bezeichnet hier deren Glanz beziehungsweise luxuriöse Qualität.
- source_word: ἐν ἀλλοτρίοις
  choice: in einem fremden Haus
  rationale: Die substantivierte Pluralform kann auf fremden Besitz, andere Menschen oder deren Häuser weisen. Im Zusammenhang von Obdach und Mahlzeiten bringt »in einem fremden Haus« den naheliegenden Gegensatz prägnant zum Ausdruck, ohne ihn in der Fußnote als einzig mögliche Deutung auszugeben.
theological_decisions: []
translation_notes:
  register: Moderne, allgemein verständliche Standardsprache mit bewahrter Spruchweisheitsform. »Schützendes Dach« konkretisiert σκέπη maßvoll; die schwierige Lesart δοκῶν und die Mehrdeutigkeit von ἐν ἀλλοτρίοις werden nicht stillschweigend verdeckt, sondern in den Fußnoten dokumentiert.
