translation:
  language: de
  text: Leih deinem Nächsten in seiner Not und zahle deinem Nächsten rechtzeitig zurück.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δάνεισον
  choice: Leih
  rationale: Der Imperativ bezeichnet das Gewähren eines Darlehens; „leihen“ ist im Deutschen natürlich und wahrt die Aufforderung.
- source_word: τῷ πλησίον
  choice: deinem Nächsten
  rationale: Entspricht der ethisch geprägten Bezeichnung für den Mitmenschen und erhält die Wiederholung des griechischen Textes.
- source_word: ἐν καιρῷ χρείας αὐτοῦ
  choice: wenn er in Not ist
  rationale: Gibt den Zeitpunkt seiner Bedürftigkeit idiomatisch wieder, ohne die Notlage näher festzulegen.
- source_word: πάλιν
  choice: seinerseits
  rationale: Markiert hier die entsprechende Gegenpflicht desjenigen, der selbst Schuldner ist; „seinerseits“ stellt den Rollenwechsel klar, ohne einen zeitlichen Sinn zu erzwingen.
- source_word: ἀπόδος
  choice: zahle … zurück
  rationale: Im Zusammenhang eines Darlehens bedeutet das Verb, das Geschuldete zurückzugeben beziehungsweise zurückzuzahlen.
- source_word: εἰς τὸν καιρόν
  choice: rechtzeitig
  rationale: Gibt die fristgerechte Rückzahlung natürlich wieder; der griechische Ausdruck nennt keinen ausdrücklich „festgesetzten“ Termin.
theological_decisions: []
translation_notes:
  register: Kurzer, paralleler Weisheitsspruch in moderner, würdiger Standardsprache. Die Wiederholung von „deinem Nächsten“ bleibt als strukturelles Merkmal erhalten; die beiden Imperative sprechen offenbar nacheinander den Darlehensgeber und den Schuldner an.
