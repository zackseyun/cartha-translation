  yaml_path: translation/deuterocanon/sirach/029/001.yaml
  text: He who shows mercy lends to his neighbor[a], and he who strengthens him with his hand keeps the commandments.
translation:
  language: de
  text: Wer Barmherzigkeit übt, wird seinem Nächsten leihen; und wer ihn mit seiner Hand unterstützt[a], hält die Gebote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „mit seiner Hand stärkt“. Das griechische Bild bezeichnet konkrete, praktische Hilfe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὁ ποιῶν ἔλεος
  choice: Wer Barmherzigkeit übt
  rationale: Die semitisch geprägte Wendung bezeichnet tätige Barmherzigkeit. „Barmherzigkeit üben“ ist im Deutschen natürlich und bewahrt den aktiven Sinn.
- source_word: δανιεῖ
  choice: wird … leihen
  rationale: Der griechische Futur Indikativ wird formal als Zukunft wiedergegeben. Im Zusammenhang des Kapitels ist ein konkretes Darlehen gemeint.
- source_word: τῷ πλησίον
  choice: seinem Nächsten
  rationale: πλησίον bezeichnet im ethischen Zusammenhang den Mitmenschen beziehungsweise Nächsten; „seinem Nächsten“ ist geläufig und prägnant.
- source_word: ὁ ἐπισχύων
  choice: wer ihn … unterstützt
  rationale: ἐπισχύω kann „stärken“ oder „unterstützen“ bedeuten. „Unterstützt“ klingt mit dem Bild der Hand natürlich und lässt konkrete Hilfe erkennen.
- source_word: τῇ χειρὶ αὐτοῦ
  choice: mit seiner Hand
  rationale: Die instrumentale Formulierung wird bildhaft bewahrt. Sie verweist auf greifbare, praktische Hilfe, ohne diese in eine abstrakte Umschreibung aufzulösen.
- source_word: τηρεῖ ἐντολάς
  choice: hält die Gebote
  rationale: τηρέω mit ἐντολή bezeichnet das Halten oder Befolgen von Geboten. Die bestimmte Form lässt hier den religiös-ethischen Bezug auf Gottes Gebote erkennen.
theological_decisions:
- issue: Ob ἐντολάς allgemein als „Anweisungen“ oder religiös als „die Gebote“ wiederzugeben ist
  choice: die Gebote
  alternative: Gebote / Anweisungen
  rationale: Im Weisheitskontext Sirachs verweist der Ausdruck naheliegend auf Gottes Gebote. Obwohl im Griechischen kein Artikel steht, ist die bestimmte Form im Deutschen idiomatisch und bewahrt das religiöse Gewicht.
- issue: Ob die praktische Hilfe als bloßes Gefühl oder als tätige Unterstützung verstanden wird
  choice: mit seiner Hand unterstützt
  alternative: stärkt
  rationale: Die Verbindung von ἐπισχύω mit „Hand“ stellt konkrete Hilfe dar. Die Übersetzung wahrt das Körperbild, ohne Art oder Umfang der Hilfe konfessionell oder dogmatisch festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der parallele Weisheitsspruch bleibt knapp; das Futur des griechischen Textes und das konkrete Bild der Hand werden erhalten.
