  source_fidelity: 'Die Übersetzung gibt die Satzglieder und den Sinn des Griechischen zuverlässig wieder: „Ein guter Mann“ entspricht ἀνὴρ ἀγαθός, „für seinen Nächsten bürgen“ trifft ἐγγυήσεται τὸν πλησίον, und „wird ihn im Stich lassen“ gibt καταλείψει αὐτόν idiomatisch und im Kontext angemessen wieder. „sein Schamgefühl verloren hat“ bildet ὁ ἀπολωλεκὼς αἰσχύνην treffend als Zustand eines zuvor erlittenen moralischen Verlustes ab.'
