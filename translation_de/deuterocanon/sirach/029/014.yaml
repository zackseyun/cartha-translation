  text: A good man will stand surety for his neighbor[a], but one who has lost shame will abandon him.
translation:
  language: de
  text: Ein guter Mann wird für seinen Nächsten bürgen; wer aber sein Schamgefühl verloren hat[a], wird ihn im Stich lassen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „wer Scham verloren hat“; auch möglich: „der Schamlose“.'
    reason: Die Fußnote bewahrt die konkrete griechische Wendung und nennt die naheliegende knappere Wiedergabe.
lexical_decisions:
- source_word: ἀνὴρ ἀγαθός
  choice: ein guter Mann
  rationale: ἀνήρ bezeichnet ausdrücklich einen Mann; ἀγαθός beschreibt hier seine moralische Güte beziehungsweise Rechtschaffenheit. Die direkte Wiedergabe bewahrt die männliche Einzahl des griechischen Spruchs.
- source_word: ἐγγυήσεται
  choice: wird … bürgen
  rationale: Das Verb bezeichnet das Eintreten als Bürge für einen anderen. „Für jemanden bürgen“ gibt den rechtlich-finanziellen Sinn im Deutschen klar und idiomatisch wieder.
- source_word: τὸν πλησίον
  choice: für seinen Nächsten
  rationale: πλησίον bezeichnet im sozialen und ethischen Zusammenhang den Mitmenschen oder Nächsten. Das Possessivpronomen ist im Deutschen zur natürlichen Zuordnung ergänzt.
- source_word: ὁ ἀπολωλεκὼς αἰσχύνην
  choice: wer … sein Schamgefühl verloren hat
  rationale: Die Formulierung bewahrt das griechische Bild des verlorenen Schamgefühls und gibt das Perfektpartizip natürlich wieder, ohne es vorschnell zum bloßen Adjektiv „schamlos“ zu verkürzen.
- source_word: καταλείψει αὐτόν
  choice: wird ihn im Stich lassen
  rationale: καταλείπω bedeutet zurücklassen oder verlassen. „Im Stich lassen“ bringt in diesem Zusammenhang die persönliche Untreue gegenüber dem Nächsten idiomatisch zum Ausdruck.
theological_decisions:
- issue: Männliche Einzahl in der Weisheitslehre
  choice: ein guter Mann
  alternative: ein guter Mensch
  rationale: Der griechische Text verwendet ausdrücklich ἀνήρ in der männlichen Einzahl. Obwohl der Spruch verallgemeinernd gebraucht wird, bleibt diese sprachliche Form in der Übersetzung erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Zukunftsformen bewahren den sprichwortartigen griechischen Futurgebrauch. Das kontrastierende „aber“ macht den sachlichen Gegensatz der beiden Satzhälften deutlich.
