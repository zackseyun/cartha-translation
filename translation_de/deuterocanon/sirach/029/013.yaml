  text: More than a strong shield and more than a mighty spear, it will fight for you against an enemy.
translation:
  language: de
  text: Mehr als ein starker Schild und mehr als ein mächtiger Speer wird es[a] für dich gegen einen Feind kämpfen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Griechischen wird das Subjekt hier nicht wiederholt. Gemeint ist das im vorherigen Vers Gelobte, das bildlich für dich kämpft; dem Zusammenhang nach könnte etwa „deine Güte“ oder „dein Pfand“ ergänzt werden.
    reason: alternative_reading
lexical_decisions:
- source_word: ὑπὲρ ἀσπίδα κράτους
  choice: mehr als ein starker Schild
  rationale: Das erste ὑπέρ ist im parallelen Vergleich als Überlegenheit zu verstehen. Der Qualitätsgenitiv κράτους wird im natürlichen Deutschen adjektivisch mit „stark“ wiedergegeben.
- source_word: ὑπὲρ δόρυ ἀλκῆς
  choice: mehr als ein mächtiger Speer
  rationale: Die Wiederholung von „mehr als“ bewahrt den Parallelismus. ἀλκή bezeichnet Kraft beziehungsweise Wehrhaftigkeit; „mächtig“ gibt dies hier verständlich und würdevoll wieder.
- source_word: κατέναντι ἐχθροῦ
  choice: gegen einen Feind
  rationale: Die Wendung bezeichnet feindliche Gegenüberstellung. Da ἐχθροῦ keinen Artikel trägt, bleibt die deutsche Wiedergabe unbestimmt.
- source_word: πολεμήσει
  choice: wird … kämpfen
  rationale: Das Futur wird direkt wiedergegeben; „kämpfen“ ist modern, klar und weniger schwerfällig als „Krieg führen“.
- source_word: ὑπὲρ σοῦ
  choice: für dich
  rationale: 'Hier ist ὑπέρ nicht vergleichend, sondern benefaktiv: Der Kampf geschieht zugunsten des Angesprochenen.'
- source_word: unausgesprochenes Subjekt von πολεμήσει
  choice: es
  rationale: Der griechische Vers nennt das aus dem Kontext zu ergänzende Subjekt nicht erneut. Das neutrale Pronomen erhält diese Unbestimmtheit, ohne eigenmächtig „Güte“, „Pfand“ oder eine Person einzusetzen.
theological_decisions:
- issue: Unausgesprochenes, aus dem vorherigen Vers übernommenes Subjekt
  choice: Das neutrale Pronomen „es“ verwenden und die Unbestimmtheit in einer Fußnote erklären.
  alternative: „Deine Güte“, „dein Pfand“ oder ein personenbezogenes Pronomen ausdrücklich als Subjekt einsetzen.
  rationale: Eine ausdrückliche Identifizierung würde die vom griechischen Text offengelassene Rückbeziehung unnötig festlegen. Die Personifikation und ihre mögliche ethische Bedeutung bleiben so erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der militärische Parallelismus und der Wechsel der Bedeutung von ὑπέρ – zunächst vergleichend, am Ende benefaktiv – bleiben erkennbar.
