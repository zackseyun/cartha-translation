  yaml_path: translation/deuterocanon/sirach/029/003.yaml
  text: Keep your word[a], and be faithful to him, and at all times you will find what you need.
translation:
  language: de
  text: Steh zu deinem Wort und erweise dich als zuverlässig[a]; dann wirst du jederzeit finden, was du brauchst.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »mit ihm«; dies kann denjenigen bezeichnen, dem du dein Wort gegeben hast, oder sich auf das Wort beziehungsweise die Zusage beziehen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: στερέωσον λόγον
  choice: Steh zu deinem Wort
  rationale: στερεόω bezeichnet ein Festmachen oder Bestätigen. Im Zusammenhang mit Darlehen und Verpflichtungen gibt die geläufige deutsche Wendung den Sinn wieder, das zugesagte Wort durch verlässliches Handeln zu bekräftigen.
- source_word: πιστώθητι
  choice: erweise dich … als zuverlässig
  rationale: Der Imperativ trägt hier den Sinn, sich als treu beziehungsweise vertrauenswürdig zu bewähren. »Erweise dich als zuverlässig« ist im heutigen Deutsch klar und passt zum praktischen Zusammenhang.
- source_word: μετʼ αὐτοῦ
  choice: ihm gegenüber
  rationale: Die Wendung kann sich persönlich auf den anderen Beteiligten beziehen. »Ihm gegenüber« gibt diese Beziehung im Deutschen natürlicher wieder als das wörtliche »mit ihm«, ohne die mögliche Rückbeziehung auf λόγον zu verschweigen.
- source_word: ἐν παντὶ καιρῷ
  choice: jederzeit
  rationale: Die Formulierung bezeichnet jede Zeit oder Gelegenheit; »jederzeit« bewahrt den umfassenden zeitlichen Sinn knapp und idiomatisch.
- source_word: εὑρήσεις τὴν χρείαν σου
  choice: wirst du … finden, was du brauchst
  rationale: Die Wiedergabe hält am wörtlichen Verb »finden« fest und überträgt χρεία idiomatisch als das, was jemand benötigt.
