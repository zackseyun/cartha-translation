  source_fidelity: 'Die Wiedergabe von βαρέα und ἀνθρώπῳ ἔχοντι φρόνησιν ist sinngemäß zutreffend. δανιστοῦ ist korrekt als „Gläubigers“ gefasst. Die Ersetzung von οἰκίας durch „Hausherrn“ ist jedoch im griechischen Wortlaut nicht gedeckt: οἰκία bedeutet Haus bzw. Haushalt, nicht Hausherr. Der Genitiv bleibt zudem hinsichtlich seiner genauen Beziehung offen und sollte nicht personifizierend eingeengt werden.'
