  text: 'Schwer wiegt dies für einen verständigen Menschen: der Tadel eines Haushalts und die Schmähung des Gläubigers.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βαρέα
  choice: Schwer wiegt
  rationale: Gibt die übertragene Bedeutung „belastend, schwer zu ertragen“ idiomatisch und würdevoll wieder.
- source_word: ἀνθρώπῳ ἔχοντι φρόνησιν
  choice: für einen verständigen Menschen
  rationale: Bewahrt die Aussage über einen Menschen, der Einsicht beziehungsweise praktische Vernunft besitzt.
- source_word: ἐπιτίμησις οἰκίας
  choice: der Tadel des Hausherrn
  rationale: οἰκία kann metonymisch für die Person stehen, die über das Haus verfügt; im Kontext fremder Unterkunft ist „Hausherr“ im Deutschen verständlicher als der unnatürliche „Tadel eines Hauses“.
- source_word: ὀνειδισμὸς δανιστοῦ
  choice: die Schmähung des Gläubigers
  rationale: ὀνειδισμός bezeichnet beschämenden Vorwurf oder Schmach; δανιστής ist der Geldverleiher beziehungsweise Gläubiger.
