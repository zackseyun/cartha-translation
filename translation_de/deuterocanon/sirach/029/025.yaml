  text: You will host and give drink to the ungrateful[a], and besides these things you will hear bitter words.
translation:
  language: de
  text: Du wirst Undankbare als Gäste aufnehmen und ihnen zu trinken geben; obendrein wirst du Bitteres hören.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „bittere Worte hören“. Das Griechische lässt offen, was genau gehört wird; „Worte“ ist eine mögliche natürliche Ergänzung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ξενιεῖς
  choice: Du wirst Gäste aufnehmen
  rationale: Das Futur von ξενίζω bezeichnet hier das Aufnehmen beziehungsweise Beherbergen von Gästen. Die Ergänzung „Gäste“ macht das im Griechischen vorausgesetzte Objekt im Deutschen natürlich deutlich.
- source_word: ποτιεῖς
  choice: ihnen zu trinken geben
  rationale: ποτίζω bedeutet, jemandem zu trinken zu geben. Das Pronomen „ihnen“ nimmt die bei ξενιεῖς vorausgesetzten Gäste auf.
- source_word: εἰς ἀχάριστα
  choice: ohne Dank dafür
  rationale: Die neutrale Wendung bezeichnet eher die Undankbarkeit beziehungsweise das Ausbleiben von Dank als ausdrücklich „undankbare Menschen“. „Ohne Dank dafür“ gibt diesen Sinn idiomatisch wieder, ohne einen bestimmten persönlichen Empfänger in den Text einzutragen.
- source_word: πρὸς ἐπὶ τούτοις
  choice: obendrein
  rationale: Die pleonastisch wirkende additive Wendung kündigt eine weitere Belastung an. „Obendrein“ ist knapp, gegenwärtig und wahrt die Steigerung.
- source_word: πικρὰ ἀκούσει
  choice: wirst du Bitteres hören
  rationale: πικρά ist ein substantiviertes Neutrum im Plural; der Gegenstand des Hörens bleibt allgemein. „Bitteres“ bewahrt diese Offenheit besser als die ausdrückliche Ergänzung „Worte“.
