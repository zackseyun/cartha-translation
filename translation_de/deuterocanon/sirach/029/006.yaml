base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/029/006.yaml
  text: If he is able[a], he will scarcely recover half, and will count it as a find; but if not, he has been deprived of his money, and has gained an enemy for nothing. He will repay him with curses and insults[b], and instead of honor he will repay him with dishonor.
translation:
  language: de
  text: Wenn er dazu imstande ist, wird er kaum die Hälfte zurückerhalten und sie als einen Fund ansehen. Wenn nicht, hat der Schuldner ihn um sein Geld gebracht und ihn sich nicht umsonst zum Feind gemacht.[a] Er wird ihm mit Flüchen und Beschimpfungen vergelten und ihm statt Ehre Schande erweisen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „und hat ihn sich nicht umsonst zum Feind erworben“. Die Wendung beschreibt die bittere Ironie: Der Schuldner hat den Darlehensgeber nicht nur um sein Geld gebracht, sondern ihn auch zum Feind gewonnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν ἰσχύσῃ
  choice: Wenn es ihm gelingt
  rationale: ἰσχύω bezeichnet hier das Vermögen beziehungsweise den Erfolg, wenigstens einen Teil des Darlehens zurückzuerlangen. Die Formulierung lässt offen, wodurch dies gelingt.
- source_word: μόλις κομίσεται τὸ ἥμισυ
  choice: wird er kaum die Hälfte zurückbekommen
  rationale: κομίζω bezeichnet in diesem Zusammenhang das Zurückerhalten des Geliehenen; μόλις betont die Schwierigkeit beziehungsweise den geringen Erfolg.
- source_word: λογιεῖται αὐτὸ ὡς εὕρεμα
  choice: wird sie wie einen Fund betrachten
  rationale: 'Die Wendung bewahrt das Bild des zufällig Gefundenen: Selbst die halbe Rückzahlung erscheint wie unerwartet erlangtes Geld.'
- source_word: ἀπεστέρησεν αὐτὸν τῶν χρημάτων αὐτοῦ
  choice: ist er um sein Geld gebracht worden
  rationale: Die passive Formulierung gibt das Ergebnis für den Darlehensgeber wieder, ohne stärker als der griechische Text vorsätzlichen Betrug oder gewaltsamen Raub zu behaupten.
- source_word: ἐκτήσατο αὐτὸν ἐχθρὸν οὐ δωρεάν
  choice: hat sich damit einen Feind eingehandelt – nicht ohne Kosten
  rationale: 'κτάομαι bezeichnet das Erwerben oder Gewinnen; οὐ δωρεάν bedeutet wörtlich ‚nicht umsonst‘. Die Wiedergabe erhält die bittere Ironie: Zum Geldverlust kommt noch Feindschaft hinzu.'
- source_word: κατάρας καὶ λοιδορίας
  choice: Flüchen und Beschimpfungen
  rationale: Die beiden Wörter bezeichnen feindselige Rede und werden in gegenwärtigem, allgemein verständlichem Deutsch unterschieden wiedergegeben.
- source_word: ἀποδώσει αὐτῷ
  choice: wird es ihm … vergelten
  rationale: ἀποδίδωμι bedeutet zurückgeben, erstatten oder vergelten. ‚Vergelten‘ erhält die Ironie, dass anstelle des Geldes Misshandlungen zurückkommen.
- source_word: ἀντὶ δόξης ... ἀτιμίαν
  choice: statt Ehre Schande
  rationale: Das Gegensatzpaar betrifft gesellschaftliche Achtung und Missachtung; ‚Ehre‘ und ‚Schande‘ geben dies knapp und würdig wieder.
theological_decisions:
- issue: Sozialethische Einordnung des gescheiterten Darlehens
  choice: Konkrete Weisheitslehre über Geldverlust, entstehende Feindschaft und die beschämende Reaktion des Schuldners
  alternative: Eine ausdrückliche Verurteilung von Zinsnahme oder eine Aussage über göttliches Gericht
  rationale: Der griechische Text beschreibt die praktischen Folgen des Darlehens, ohne Zins, Betrug als sichere Absicht oder göttliches Gericht ausdrücklich zu thematisieren.
- issue: Zuordnung der wechselnden Handlungsträger
  choice: Der Darlehensgeber erhält allenfalls die Hälfte zurück und gewinnt den Schuldner als Feind; dieser vergilt ihm mit Flüchen und Schande.
  alternative: Alle Verben ohne erkennbaren Subjektwechsel auf dieselbe Person beziehen
  rationale: Die pronominalen Bezüge und die Ironie des Zurückvergeltens sprechen für einen im Griechischen nur implizit angezeigten Wechsel zum feindseligen Schuldner im letzten Satz. ‚Der‘ macht diesen Bezug im Deutschen verständlich, ohne eine zusätzliche Benennung einzuführen.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Weisheitsstil. Das Fund-Bild und die Wiedervergeltungs-Ironie bleiben erhalten; schwerfällige Verwaltungs- und Finanzsprache wird vermieden.
