  yaml_path: translation/deuterocanon/sirach/029/011.yaml
  text: Store up your treasure according to the commandments of the Most High[a], and it will profit you more than gold.
translation:
  language: de
  text: Lege deinen Schatz nach den Geboten des Höchsten an, und er wird dir mehr nützen als Gold.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θὲς
  choice: Lege … an
  rationale: Der Aoristimperativ von τίθημι bedeutet grundsätzlich »setzen/legen«. Zusammen mit »Schatz« und dem wirtschaftlichen Vergleich bezeichnet »anlegen« im Deutschen treffend ein bewusstes, gewinnbringendes Verwahren, ohne eine Ansammlung ausdrücklich vorauszusetzen.
- source_word: τὸν θησαυρόν σου
  choice: deinen Schatz
  rationale: θησαυρός bezeichnet einen Schatz oder aufbewahrten Reichtum. »Schatz« erhält sowohl den konkreten Vermögensbezug als auch den weiteren Weisheitssinn dessen, was als wertvoll gilt.
- source_word: κατʼ ἐντολὰς
  choice: nach den Geboten
  rationale: κατά mit Akkusativ bezeichnet hier die Ausrichtung an einer Norm. Der Plural ἐντολάς wird als »Geboten« bewahrt; »nach« ist im modernen Deutsch knapp und natürlich.
- source_word: Ὑψίστου
  choice: des Höchsten
  rationale: »der Höchste« ist die geläufige deutsche Wiedergabe des jüdisch-griechischen Gottestitels Ὕψιστος.
- source_word: λυσιτελήσει σοι
  choice: wird er dir … Gewinn bringen
  rationale: λυσιτελέω bedeutet »nützen, vorteilhaft oder einträglich sein«. »Gewinn bringen« klingt natürlich und erhält das wirtschaftliche Bild sowie den ausdrücklichen Bezug σοι (»dir«).
- source_word: μᾶλλον ἢ τὸ χρυσίον
  choice: mehr … als Gold
  rationale: Die Wiedergabe bildet die Vergleichskonstruktion μᾶλλον ἤ unmittelbar ab. Der griechische Artikel bei χρυσίον verlangt im Deutschen keinen bestimmten Artikel.
theological_decisions:
- issue: Ob der Schatz ausdrücklich als Almosengeben zu bestimmen ist
  choice: 'Die Formulierung bleibt allgemein: Der Schatz soll nach Gottes Geboten angelegt werden.'
  alternative: Gib Almosen und lege dir dadurch einen Schatz nach dem Gebot des Höchsten an.
  rationale: Der Kontext handelt von Darlehen und Großzügigkeit, doch der griechische Wortlaut dieses Verses nennt Almosen nicht ausdrücklich. Die breitere Aussage wahrt daher den Text und lässt die kontextuelle Anwendung offen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung mit »dann« gibt die Folgebeziehung von καί idiomatisch wieder. Das Finanzwort »anlegen« und die Wendung »Gewinn bringen« bewahren die durch Schatz, Nutzen und Gold entstehende wirtschaftliche Bildsprache.
