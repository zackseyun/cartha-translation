translation:
  language: de
  text: Hilf dem Armen um des Gebots willen und schick ihn nicht mit leeren Händen fort, sondern entsprechend seiner Bedürftigkeit.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χάριν ἐντολῆς
  choice: um des Gebots willen
  rationale: Die Wendung gibt den motivierenden bzw. begründenden Sinn von χάριν mit Genitiv wieder und bewahrt zugleich den bestimmten, aber nicht näher bezeichneten Charakter von ἐντολή.
- source_word: ἀντιλαβοῦ
  choice: hilf
  rationale: Der Imperativ bezeichnet aktives Beistehen oder unterstützendes Eingreifen; „hilf“ ist im Deutschen klar, natürlich und nicht überdeutend.
- source_word: πένητος
  choice: dem Armen
  rationale: πένης bezeichnet einen armen bzw. bedürftigen Menschen. Der substantivierte Singular entspricht der konkreten Einzahl des griechischen Textes.
- source_word: κατὰ τὴν ἔνδειαν αὐτοῦ
  choice: in seiner Not
  rationale: ἔνδεια bezeichnet Mangel oder Bedürftigkeit. Im Zusammenhang mit dem Abweisen ist „in seiner Not“ idiomatisch und bewahrt den Bezug auf seine tatsächliche Bedürftigkeit.
- source_word: μὴ ἀποστρέψῃς αὐτὸν κενόν
  choice: weise ihn nicht mit leeren Händen ab
  rationale: ἀποστρέφω beschreibt hier das Abweisen, κενόν das Fortgehen ohne empfangene Hilfe. Die deutsche Wendung erhält beide Aspekte anschaulich.
theological_decisions:
- issue: Bezug von ἐντολῆς („des Gebots“)
  choice: Das bestimmte, aber nicht näher bezeichnete „Gebot“ bleibt stehen.
  alternative: Ausdrückliche Festlegung auf ein bestimmtes Gebot der Tora oder allgemeinere Wiedergabe als „Weisung“.
  rationale: Der griechische Singular hat bestimmtes Gewicht, nennt jedoch weder den Urheber noch ein konkretes Gesetz. Die Übersetzung bewahrt diese Offenheit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe imperativische Form und die konkrete Bildsprache des Ausgangstextes bleiben erhalten.
