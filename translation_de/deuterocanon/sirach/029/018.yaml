base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/029/018.yaml
  text: Surety has destroyed many who were upright[a], and has shaken them like a wave of the sea; it has driven mighty men from their homes, and they wandered among foreign nations.
translation:
  language: de
  text: Eine Bürgschaft hat viele zugrunde gerichtet, die auf geradem Weg waren,[a] und hat sie erschüttert wie eine Meereswoge. Sie hat mächtige Männer aus ihrer Heimat vertrieben, und sie irrten unter fremden Völkern um.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die geradeaus gingen“; das kann Menschen bezeichnen, deren Weg geordnet und erfolgreich verlief, möglicherweise auch rechtschaffene Menschen.'
    reason: Die griechische Wendung κατευθύνοντας lässt sowohl eine bildlich-räumliche als auch eine übertragene Deutung zu.
lexical_decisions:
- source_word: ἐγγύη
  choice: Bürgschaft
  rationale: Das Substantiv bezeichnet das Einstehen als Sicherheit für die Schuld eines anderen. „Bürgschaft“ ist im modernen Deutschen der klare und knappe Rechts- und Finanzbegriff.
- source_word: ἀπώλεσεν
  choice: hat … zugrunde gerichtet
  rationale: Die Wendung bewahrt die Schärfe des Verbs, ohne zwingend den Tod der Betroffenen zu behaupten; gemeint sein kann ihr wirtschaftlicher und gesellschaftlicher Ruin.
- source_word: κατευθύνοντας
  choice: die auf geradem Weg waren
  rationale: Die Formulierung hält das Bild des geraden, guten Verlaufs fest und vermeidet eine vorschnelle Verengung entweder auf moralische Rechtschaffenheit oder auf wirtschaftlichen Erfolg.
- source_word: ἐσάλευσεν
  choice: hat sie hin und her geworfen
  rationale: Das Verb bezeichnet heftiges Bewegen oder Erschüttern. Mit Blick auf die folgende Meereswoge gibt diese Wendung das konkrete Bild natürlich wieder.
- source_word: ὡς κῦμα θαλάσσης
  choice: wie eine Meereswoge
  rationale: Die knappe Wiedergabe bewahrt den singulären, eindrücklichen Vergleich.
- source_word: ἄνδρας δυνατούς
  choice: mächtige Männer
  rationale: „Mächtige“ kann sowohl Stärke als auch gesellschaftliche Stellung ausdrücken; „Männer“ gibt das ausdrücklich maskuline ἄνδρας wieder.
- source_word: ἀπῴκισεν
  choice: hat … aus ihrer Heimat vertrieben
  rationale: Das Verb bezeichnet die erzwungene Entfernung aus Heimat oder Land. Die gewählte Formulierung verbindet den Verlust der Heimat mit dem anschließenden Umherirren.
- source_word: ἐπλανήθησαν
  choice: sie irrten … um
  rationale: Im Zusammenhang der Vertreibung bezeichnet das Verb räumliches Umherirren, nicht notwendig moralische Verführung.
- source_word: ἐν ἔθνεσιν ἀλλοτρίοις
  choice: unter fremden Völkern
  rationale: Die Wendung gibt die Zugehörigkeit zu anderen, nicht eigenen Völkern idiomatisch und ohne unnötig moderne staatliche Konnotationen wieder.
theological_decisions:
- issue: Bedeutung von κατευθύνοντας
  choice: die auf geradem Weg waren
  alternative: denen es gut ging / die rechtschaffen waren
  rationale: Das Griechische kann einen geraden beziehungsweise gelingenden Weg bezeichnen. Die bildhafte Wiedergabe bewahrt diese Mehrdeutigkeit zwischen geordnetem Lebensgang, Erfolg und Rechtschaffenheit.
- issue: Geschlechtsspezifische Wiedergabe von ἄνδρας δυνατούς
  choice: mächtige Männer
  alternative: mächtige Menschen / die Mächtigen
  rationale: Da der griechische Text ausdrücklich ἄνδρας verwendet, wird die männliche Bezeichnung nicht neutralisiert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur folgt dem griechischen Parallelismus, während „Bürgschaft“, „aus ihrer Heimat vertrieben“ und „unter fremden Völkern“ für heutige Leser unmittelbar verständlich bleiben.
