    issue: „hin und her geworfen“ für ἐσάλευσεν
    rationale: Das Verb bedeutet primär erschüttern bzw. zum Wanken bringen. „Hin und her werfen“ fügt ein konkreteres, gewaltsameres Bewegungsbild hinzu, das der griechische Wortlaut nicht ausdrücklich verlangt. „Erschüttert“ erhält Bild und Intensität, ohne die Bedeutung einzuengen oder zu steigern.
