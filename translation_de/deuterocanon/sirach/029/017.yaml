  text: And one who is ungrateful in mind will abandon the one who rescued him[a].
translation:
  language: de
  text: Und wer in seiner Gesinnung undankbar ist, wird den verlassen, der ihn gerettet hat.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀχάριστος
  choice: undankbar
  rationale: Das Adjektiv bezeichnet fehlende Dankbarkeit. „Undankbar“ ist die klare und sachlich genaue moderne Entsprechung.
- source_word: ἐν διανοίᾳ
  choice: in seiner Gesinnung
  rationale: Die Wendung beschreibt die innere Denk- und Willenshaltung. „In seiner Gesinnung“ bewahrt diesen inneren Aspekt und klingt im Deutschen natürlicher als das wörtlichere „im Denken“.
- source_word: ἐγκαταλείψει
  choice: wird ... verlassen
  rationale: Das Futur bezeichnet das Zurücklassen oder Verlassen einer Person. „Verlassen“ gibt den Sinn hier direkt wieder, ohne die Aussage unnötig zu verstärken.
- source_word: ῥυσάμενον
  choice: den, der ihn gerettet hat
  rationale: Das substantivisch gebrauchte Aoristpartizip bezeichnet denjenigen, der ihn aus einer Notlage befreit hat. Das im Griechischen aus dem Zusammenhang erschlossene Objekt wird im Deutschen mit „ihn“ ausdrücklich genannt.
theological_decisions:
- issue: Generische Personenbezeichnung ohne ausdrückliches Substantiv
  choice: wer ... ist
  alternative: ein undankbarer Mann
  rationale: Das griechische Adjektiv steht substantivisch und bezeichnet allgemein einen Menschen mit dieser Haltung. Die deutsche Wer-Konstruktion gibt die generische Aussage natürlich wieder, ohne ein im Ausgangstext nicht vorhandenes Substantiv einzufügen.
- issue: Innere Undankbarkeit
  choice: in seiner Gesinnung undankbar
  alternative: undankbar im Denken
  rationale: Die Übersetzung erhält die ausdrückliche Bestimmung ἐν διανοίᾳ und damit den Bezug auf die innere Haltung, ohne sie auf bloße verstandesmäßige Gedanken zu verengen.
translation_notes:
  register: Knapper, würdevoller Spruchstil in modernem Standarddeutsch. Die Satzverknüpfung mit „Und“ folgt dem griechischen καί; die innere Haltung und die anschließende illoyale Handlung bleiben deutlich voneinander unterschieden.
