base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/029/005.yaml
  text: Until he receives it[a], he will kiss his neighbor's hand, and for his neighbor’s money he will lower his voice; but at the time of repayment he will delay[b], and he will repay with words of indifference and blame the timing.
translation:
  language: de
  text: Bis er es erhalten hat, wird er ihm die Hand küssen und wegen des Geldes seines Nächsten unterwürfig die Stimme senken.[a] Doch wenn die Rückzahlung fällig ist, wird er die Rückzahlung hinauszögern und mit gleichgültigen Worten zurückzahlen[b]; den Zeitpunkt wird er dafür verantwortlich machen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die Stimme erniedrigen“; gemeint ist ein leiser, unterwürfiger Ton.'
    reason: lexical_alternative
  - marker: b
    text: '„Zurückzahlen“ ist hier ironisch gebraucht: Statt das Geld zurückzugeben, gibt er nur gleichgültige Worte zurück.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕως οὗ λάβῃ
  choice: Bis er es erhalten hat
  rationale: Die Formulierung bezeichnet den Zeitraum bis zum Empfang des erbetenen Geldes; das Objekt bleibt wie im Griechischen unausgesprochen und ist aus dem Zusammenhang zu ergänzen.
- source_word: καταφιλήσει χεῖρα αὐτοῦ
  choice: wird er ihm die Hand küssen
  rationale: Die konkrete Geste übertriebener Ehrerbietung bleibt erhalten. Das deutsche „ihm“ gibt das griechische αὐτοῦ wieder, ohne die Person ausdrücklich als Nächsten festzulegen.
- source_word: ἐπὶ τῶν χρημάτων τοῦ πλησίον
  choice: wegen des Geldes seines Mitmenschen
  rationale: ἐπί bezeichnet hier Anlass oder Beweggrund des unterwürfigen Auftretens. „Mitmensch“ gibt πλησίον in diesem weisheitlichen Zusammenhang natürlich und ohne unnötige konfessionelle Färbung wieder.
- source_word: ταπεινώσει φωνήν
  choice: unterwürfig die Stimme senken
  rationale: Die wörtliche Vorstellung vom Erniedrigen der Stimme wird in verständlichem Deutsch als leises, demütiges Sprechen wiedergegeben.
- source_word: ἐν καιρῷ ἀποδόσεως
  choice: wenn die Rückzahlung fällig ist
  rationale: Die Wendung meint den Zeitpunkt, zu dem die Schuld zurückgezahlt werden soll; „fällig“ entspricht dem finanziellen Zusammenhang natürlich.
- source_word: παρελκύσει χρόνον
  choice: wird er die Sache hinauszögern
  rationale: Das griechische Idiom bezeichnet bewusstes Verzögern oder Hinhalten. Die deutsche Formulierung bewahrt den Vorgang, ohne das unnatürliche „die Zeit hinziehen“ zu verwenden.
- source_word: ἀποδώσει λόγους ἀκηδίας
  choice: mit gleichgültigen Worten zurückzahlen
  rationale: '„Zurückzahlen“ bewahrt die Ironie von ἀποδώσει: Statt des Geldes gibt der Schuldner nur Worte zurück. ἀκηδία bezeichnet hier Gleichgültigkeit, Nachlässigkeit oder mangelnde Anteilnahme.'
- source_word: τὸν καιρὸν αἰτιάσεται
  choice: dem Zeitpunkt wird er die Schuld geben
  rationale: Die Wiedergabe lässt die Mehrdeutigkeit von καιρός zwischen Zeitpunkt, Gelegenheit und Umständen möglichst offen und bewahrt das Motiv der Schuldverschiebung.
