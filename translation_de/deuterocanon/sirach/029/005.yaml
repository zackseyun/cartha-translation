translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der sprichwortartige Satz behält die Zukunftsformen des Griechischen bei. Die konkrete Geste des Handkusses und das Wortspiel mit der Rückzahlung bleiben erhalten; erklärende Fußnoten stehen jeweils unmittelbar bei der betreffenden Wendung.
