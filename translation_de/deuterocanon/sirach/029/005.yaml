revisions:
- from: Bis er es erhalten hat, wird er ihm die Hand küssen und wegen des Geldes seines Mitmenschen unterwürfig die Stimme senken.[a] Doch wenn die Rückzahlung fällig ist, wird er die Sache hinauszögern und mit gleichgültigen Worten zurückzahlen[b]; dem Zeitpunkt wird er die Schuld geben.
  to: Bis er es erhalten hat, wird er ihm die Hand küssen und wegen des Geldes seines Nächsten unterwürfig die Stimme senken.[a] Doch wenn die Rückzahlung fällig ist, wird er die Rückzahlung hinauszögern und mit gleichgültigen Worten zurückzahlen[b]; den Zeitpunkt wird er dafür verantwortlich machen.
  rationale: Die Revision beseitigt zwei unnötig unnatürliche bzw. unspezifische Formulierungen, ohne den Sinn zu verändern. „Die Rückzahlung hinauszögern“ macht den von ἐν καιρῷ ἀποδόσεως bestimmten Bezug von παρελκύσει χρόνον deutlich. „Den Zeitpunkt ... verantwortlich machen“ gibt τὸν καιρόν αἰτιάσεται idiomatisch wieder und bewahrt die zeitlich-umständliche Offenheit des griechischen καιρός. Die vorhandenen Fußnoten bleiben sachlich richtig und an den passenden Stellen verankert.
