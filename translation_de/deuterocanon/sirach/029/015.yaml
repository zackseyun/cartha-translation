  text: Do not forget the kindnesses of a guarantor[b][a], for he gave his life for you.
translation:
  language: de
  text: Vergiss die Wohltaten eines Bürgen nicht[a], denn er hat sein Leben für dich gegeben.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die Gefälligkeiten dessen, der für dich gebürgt hat«.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »seine Seele« (bzw. »sein Leben«). Die Wendung kann die Hingabe des eigenen Lebens oder der eigenen Person für dich bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: χάριτας
  choice: Wohltaten
  rationale: Der Plural bezeichnet hier konkrete erwiesene Gunstbeweise beziehungsweise hilfreiche Taten, nicht »Gnade« als theologischen Begriff.
- source_word: ἐγγύου
  choice: eines Bürgen
  rationale: ἐγγύος bezeichnet jemanden, der für die Schuld oder Verpflichtung eines anderen einsteht. »Bürge« ist der übliche und verständliche deutsche Ausdruck.
- source_word: μὴ ἐπιλάθῃ
  choice: Vergiss ... nicht
  rationale: Die direkte Aufforderung gibt das griechische Verbot natürlich und präzise wieder.
- source_word: ἔδωκεν
  choice: hat ... eingesetzt
  rationale: Zusammen mit »sein Leben« drückt »eingesetzt« im Deutschen die Selbstgefährdung des Bürgen natürlich aus, ohne zwingend seinen tatsächlichen Tod zu behaupten.
- source_word: τὴν ψυχὴν αὐτοῦ
  choice: sein Leben
  rationale: ψυχή bezeichnet hier im Zusammenhang des persönlichen Risikos das Leben beziehungsweise die eigene Person, nicht ausdrücklich eine vom Körper unterschiedene Seele.
- source_word: ὑπὲρ σοῦ
  choice: für dich
  rationale: Die knappe Wendung wahrt den Sinn des Eintretens zugunsten beziehungsweise anstelle des Angesprochenen.
theological_decisions:
- issue: Bedeutung von ψυχή und Tragweite von ἔδωκεν
  choice: sein Leben für dich eingesetzt
  alternative: seine Seele für dich gegeben / sein Leben für dich hingegeben
  rationale: Der Zusammenhang handelt von der persönlichen und wirtschaftlichen Gefährdung eines Bürgen. Die gewählte Formulierung bewahrt den Ernst seines Einsatzes, ohne eine anthropologische Aussage über die Seele oder einen tatsächlich eingetretenen Opfertod hineinzulesen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Bürge« hält den rechtlich-finanziellen Zusammenhang klar; »Wohltaten« bewahrt den konkreten Plural. Die Fußnoten markieren die genuine Bedeutungsbreite von χάριτες und ψυχή.
