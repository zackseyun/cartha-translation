    rationale: Das Verb ἔδωκεν bedeutet »gab«; »einsetzen« legt speziell ein riskierendes Handeln nahe. Die mögliche idiomatische Bedeutung von ψυχή als »Leben« rechtfertigt nicht, das Geben im Haupttext zu einem bloßen Einsatz umzudeuten.
  - severity: low
    issue: Die Fußnote b erklärt die Wendung zu einseitig als bloßes »aufs Spiel setzen«.
    rationale: Die Formulierung kann im Kontext äußerste Gefährdung einschließen, doch der griechische Wortlaut sagt zunächst, dass der Bürge sein Leben bzw. sich selbst für den Angesprochenen gegeben hat. Die Erklärung sollte diese Offenheit bewahren.
