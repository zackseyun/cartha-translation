translation_notes:
  register: Knapp, würdig und sprichwortartig. Die Aufzählung bleibt konkret; die idiomatische Wiedergabe von Ἀρχὴ ζωῆς vermeidet im Deutschen das missverständliche „Anfang des Lebens“, ohne den Sinn zu einer ausführlichen Erklärung auszuweiten.
