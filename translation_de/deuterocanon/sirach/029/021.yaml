translation:
  language: de
  text: Die Grundlage des Lebens sind Wasser, Brot, Kleidung und ein Haus, das die Blöße bedeckt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „… ein Haus, das Schande verhüllt“ oder „… ein Haus, das die Nacktheit bedeckt“. Das griechische Wort kann allgemein Schande oder Anstößigkeit bezeichnen; in diesem Zusammenhang kann es sich auch konkret auf die zu bedeckende Blöße beziehen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀρχὴ ζωῆς
  choice: Die Grundlagen des Lebens
  rationale: Wörtlich ist von „Anfang/Grundlage des Lebens“ die Rede. Im sprichwortartigen Zusammenhang bezeichnet die Wendung die grundlegenden Lebensbedürfnisse; der Plural ergibt im Deutschen mit der folgenden Aufzählung einen natürlichen, prägnanten Satz.
- source_word: ὕδωρ
  choice: Wasser
  rationale: Direkte Wiedergabe des konkreten Grundbedürfnisses.
- source_word: ἄρτος
  choice: Brot
  rationale: Bewahrt das konkrete Bild des griechischen Wortes, ohne es verallgemeinernd als „Nahrung“ wiederzugeben.
- source_word: ἱμάτιον
  choice: Kleidung
  rationale: Der Singular hat hier kollektiven Sinn; „Kleidung“ ist im modernen Deutschen natürlicher als „Gewand“.
- source_word: οἶκος
  choice: ein Haus
  rationale: Bewahrt das konkrete Bild einer Wohnstätte; „Obdach“ wäre stärker deutend.
- source_word: καλύπτων
  choice: das … bedeckt
  rationale: Gibt das Partizip als deutschen Relativsatz wieder und macht seinen Bezug auf „Haus“ eindeutig.
- source_word: ἀσχημοσύνην
  choice: die Blöße
  rationale: Im Zusammenhang von Kleidung und Haus liegt körperliche Entblößung nahe. „Blöße“ wahrt zugleich den Beiklang von Scham und Anstößigkeit besser als das rein anatomische „Nacktheit“.
