  text: Be content with little and with much[a].
translation:
  language: de
  text: Sei mit wenig und mit viel zufrieden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Habe Wohlgefallen an wenig und an viel.“ Im Griechischen steht das Substantiv „Wohlgefallen“ oder „Zufriedenheit“ mit dem Verb „haben“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπὶ μικρῷ καὶ μεγάλῳ
  choice: mit wenig wie mit viel
  rationale: ἐπί mit dem Dativ bezeichnet hier die jeweiligen Lebensumstände beziehungsweise die verfügbare Menge. Die Formulierung bewahrt den Gegensatz zwischen wenig und viel und klingt zugleich natürlich.
- source_word: εὐδοκίαν
  choice: zufrieden
  rationale: Das Substantiv kann Wohlgefallen, Gefallen oder Zufriedenheit bezeichnen. Zusammen mit ἔχε fordert es zu einer bejahenden, zufriedenen Haltung auf.
- source_word: ἔχε
  choice: Sei
  rationale: Wörtlich bedeutet das Imperativverb „habe“. Im Deutschen wird die Verbindung εὐδοκίαν ἔχε idiomatisch und klar mit „Sei … zufrieden“ wiedergegeben.
