translation_notes:
  register: Kurzer, einprägsamer Imperativ in modernem Standarddeutsch. „Wie“ hält die beiden gegensätzlichen Lebenslagen eng zusammen; die Fußnote dokumentiert die substantivische Ausdrucksweise des Griechischen.
