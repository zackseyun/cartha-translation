  text: A sinner who falls into surety and pursues contracts will fall into lawsuits[a][b].
translation:
  language: de
  text: Ein Sünder, der sich auf eine Bürgschaft[a] einlässt und Vertragsgeschäften[b] nachjagt, wird in Rechtsstreitigkeiten geraten.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Eine Bürgschaft bedeutet, für die Schuld oder Verpflichtung eines anderen einzustehen.
    reason: cultural_note
  - marker: b
    text: 'Oder: „Aufträgen“ oder „geschäftlichen Unternehmungen“. Das griechische Wort bezeichnet vertraglich übernommene Arbeiten oder Geschäfte.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „in Gerichtsverfahren“ oder „in Urteile“. Das griechische κρίσεις kann sowohl gerichtliche Auseinandersetzungen als auch Entscheidungen oder Urteile bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἁμαρτωλός
  choice: ein Sünder
  rationale: Das substantivierte Adjektiv steht im Singular und bezeichnet allgemein einen moralisch verwerflich handelnden Menschen. „Ein Sünder“ bewahrt diese Charakterisierung, ohne den Bezug auf eine bestimmte Person einzuengen.
- source_word: ἐμπεσὼν εἰς ἐγγύην
  choice: der sich auf eine Bürgschaft einlässt
  rationale: ἐγγύη bezeichnet eine Bürgschaft beziehungsweise das Einstehen für die Verpflichtung eines anderen. Die idiomatische Wendung „sich auf … einlassen“ gibt das riskante Hineingeraten des Verbs ἐμπίπτω natürlich wieder.
- source_word: διώκων
  choice: nachjagt
  rationale: Das Partizip bezeichnet ein aktives, nachdrückliches Verfolgen. „Nachjagt“ erhält den warnenden, tadelnden Ton deutlicher als das neutralere „anstrebt“.
- source_word: ἐργολαβίας
  choice: Vertragsgeschäften
  rationale: Das Wort kann vertraglich übernommene Arbeiten, Aufträge oder geschäftliche Unternehmungen bezeichnen. „Vertragsgeschäfte“ hält den vertraglichen und wirtschaftlichen Bezug zusammen, ohne die Tätigkeit enger festzulegen.
- source_word: ἐμπεσεῖται εἰς κρίσεις
  choice: wird in Rechtsstreitigkeiten geraten
  rationale: κρίσεις kann Urteile, gerichtliche Verfahren oder Rechtsstreitigkeiten bezeichnen. Im Zusammenhang mit Bürgschaften und Vertragsgeschäften liegt die rechtliche Bedeutung nahe; „geraten“ nimmt zugleich das Bild von ἐμπίπτω auf.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kräftige Formulierung „nachjagt“ bewahrt den warnenden Ton; die rechtlich-wirtschaftlichen Begriffe bleiben für heutige Leser verständlich und werden in den Fußnoten erläutert.
