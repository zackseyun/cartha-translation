  text: Many have regarded a loan as a windfall[a], and have caused trouble for those who helped them.
translation:
  language: de
  text: Viele hielten ein Darlehen für einen unverhofften Fund[a] und bereiteten denen Mühe, die ihnen geholfen hatten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „wie etwas Gefundenes“ – also so, als wäre das geliehene Geld ein unerwarteter Gewinn und müsste nicht zurückgezahlt werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  choice: Viele
  rationale: Das substantivisch gebrauchte „Viele“ gibt den unbestimmten Personenplural knapp und natürlich wieder.
- source_word: ὡς εὕρεμα
  choice: für einen unverhofften Fund
  rationale: εὕρεμα bezeichnet etwas Gefundenes und kann einen unerwarteten Gewinn meinen. „Unverhoffter Fund“ bewahrt das Bild des griechischen Textes und macht im Zusammenhang verständlich, dass das Darlehen wie ein nicht zurückzuzahlender Gewinn behandelt wird.
- source_word: ἐνόμισαν
  choice: hielten … für
  rationale: νομίζω bedeutet hier „ansehen als“ oder „halten für“. Das deutsche Präteritum entspricht dem griechischen Aorist und passt zum sentenzartigen Erzählton.
- source_word: δάνος
  choice: ein Darlehen
  rationale: δάνος bezeichnet konkret geliehenes Geld beziehungsweise ein Darlehen, nicht bloß den abstrakten Zustand der Verschuldung.
- source_word: παρέσχον πόνον
  choice: bereiteten … Mühe
  rationale: Die Verbindung bedeutet wörtlich, jemandem Mühe, Beschwernis oder Leid zu verschaffen. „Mühe bereiten“ bleibt nah am Ausdruck, klingt jedoch idiomatisch.
- source_word: τοῖς βοηθήσασιν αὐτοῖς
  choice: denen, die ihnen geholfen hatten
  rationale: Die substantivierte Partizipialkonstruktion bezeichnet allgemein die Personen, die ihnen Hilfe geleistet hatten; der Text nennt sie nicht ausdrücklich „Gläubiger“ oder „Wohltäter“.
