translation:
  language: de
  text: Gib Silber für einen Bruder und einen Freund preis, und lass es nicht unter einem Stein verrosten[a] und zugrunde gehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „korrodieren und so verloren gehen“. Das griechische Verb ist an dieser Stelle schwierig; gemeint ist offenbar, dass verborgenes und gehortetes Geld verdirbt oder nutzlos verloren geht, statt einem nahestehenden Menschen zu helfen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπόλεσον
  choice: gib … preis
  rationale: Der Aoristimperativ von ἀπόλλυμι fordert hier dazu auf, um eines anderen willen einen Verlust hinzunehmen beziehungsweise sich vom Geld zu trennen. „Gib … preis“ bewahrt den zugespitzten, opferbereiten Sinn und klingt im Deutschen natürlicher als das wörtliche „Verliere“.
- source_word: ἀργύριον
  choice: Silber
  rationale: Das Wort bezeichnet wörtlich Silber und kann zugleich als Bezeichnung für Geld dienen. „Silber“ erhält das konkrete antike Bild und den sprichwortartigen Ton.
- source_word: διʼ ἀδελφὸν καὶ φίλον
  choice: für einen Bruder und Freund
  rationale: διά mit Akkusativ bezeichnet hier den Beweggrund oder den Begünstigten. Die artikellosen Substantive werden ohne einen im Griechischen nicht ausdrücklich vorhandenen Possessivzusatz wiedergegeben.
- source_word: μὴ ἰωθῇ
  choice: lass es nicht … verrosten
  rationale: Das seltene beziehungsweise textlich schwierige Verb beschreibt im Zusammenhang das Verderben gehorteten Silbers. „Verrosten“ erhält die antike Bildsprache, auch wenn Silber im heutigen naturwissenschaftlichen Sprachgebrauch eher anläuft oder korrodiert.
- source_word: ὑπὸ τὸν λίθον
  choice: unter einem Stein
  rationale: Die Wendung zeichnet das konkrete Bild von verborgenem oder gehortetem Geld. Der unbestimmte Artikel entspricht hier natürlichem Deutsch.
- source_word: εἰς ἀπώλειαν
  choice: und zugrunde gehen
  rationale: 'Die Präpositionalwendung bezeichnet das Ergebnis: Das ungenutzte Silber endet im Verlust oder Verderben. Die verbale Wiedergabe ist im Deutschen klarer als „zum Verderben“, ohne die Aussage abzuschwächen.'
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache mit bewahrter antiker Geldmetaphorik. „Gib … preis“ vermittelt die paradoxe Aufforderung zum freiwilligen materiellen Verlust; die zweite Satzhälfte bleibt als eindringliches Bild des Hortens stehen.
