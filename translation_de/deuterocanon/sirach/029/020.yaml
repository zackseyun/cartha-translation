  text: Support your neighbor according to your ability[a], and watch yourself lest you fall.
translation:
  language: de
  text: Steh deinem Nächsten bei, soweit du kannst, und gib auf dich acht, damit du nicht zu Fall kommst.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: »damit du nicht in Schwierigkeiten gerätst« oder »damit du nicht in eine Falle gerätst«. Im Griechischen bleibt die Gefahr unbestimmt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀντιλαβοῦ
  choice: Steh … bei
  rationale: Der mediale Imperativ von ἀντιλαμβάνομαι bezeichnet tatkräftige Hilfe. „Jemandem beistehen“ gibt dies natürlich und ohne unnötige Ausdeutung wieder.
- source_word: τοῦ πλησίον
  choice: deinem Nächsten
  rationale: Der Genitiv hängt von ἀντιλαβοῦ ab. „Dein Nächster“ ist im ethischen Zusammenhang die geläufige und angemessene Wiedergabe von πλησίον.
- source_word: κατὰ δύναμίν σου
  choice: soweit du kannst
  rationale: κατά mit Akkusativ bezeichnet hier Maß oder Grenze. Die Formulierung ist modernes, klares Deutsch und bewahrt den Gedanken einer Hilfe im Rahmen der eigenen Möglichkeiten.
- source_word: πρόσεχε σεαυτῷ
  choice: gib auf dich acht
  rationale: Die idiomatische Warnformel fordert zu selbstbezogener Wachsamkeit auf. „Gib auf dich acht“ ist würdig, verständlich und nicht altertümlich.
- source_word: μὴ ἐμπέσῃς
  choice: damit du nicht zu Fall kommst
  rationale: ἐμπίπτω bedeutet wörtlich „hineinfallen“, doch ein Ziel oder eine Gefahr wird nicht genannt. „Zu Fall kommen“ lässt die Art des möglichen Schadens offen und klingt im Deutschen vollständig.
theological_decisions:
- issue: Reichweite der Warnung μὴ ἐμπέσῃς
  choice: Allgemeine Mahnung, beim Beistand für den Nächsten nicht selbst zu Fall zu kommen
  alternative: damit du nicht in Schwierigkeiten gerätst; damit du nicht in eine Falle gerätst
  rationale: Der Vers verbindet Hilfsbereitschaft mit Umsicht. Da der griechische Text weder eine finanzielle noch eine moralische oder andere konkrete Gefahr nennt, bleibt die Warnung bewusst offen.
translation_notes:
  register: Modernes Standarddeutsch in würdigem Weisheitston. Der parallele Imperativcharakter bleibt erhalten; die nicht näher bestimmte Gefahr wird weder finanziell noch moralisch eingeengt.
