  yaml_path: translation/deuterocanon/sirach/029/026.yaml
  text: Move along[a], sojourner; set the table in order, and if you have anything in your hand, feed me with it.
translation:
  language: de
  text: Komm herein[a], Fremder[b]; deck den Tisch, und wenn du etwas zur Hand hast, gib mir davon zu essen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Geh weiter“ beziehungsweise „Geh vorüber“. Das griechische Verb kann eine Bewegung heran, hinein oder vorbei bezeichnen; die Richtung ist aus dem Zusammenhang nicht völlig eindeutig.'
    reason: lexical_ambiguity
  - marker: b
    text: Das griechische Wort bezeichnet jemanden, der bei anderen als Außenstehender wohnt, etwa einen ansässigen Fremden oder Beisassen.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάρελθε
  choice: Komm her
  rationale: Der Aoristimperativ von παρέρχομαι kann je nach Blickrichtung „komm her“, „geh vorüber“ oder „geh weiter“ bedeuten. Im Zusammenhang einer direkten Anweisung im Haus ist „Komm her“ natürlich und gut belegt; die Richtungsmehrdeutigkeit wird in einer Fußnote bewahrt.
- source_word: πάροικε
  choice: Fremder
  rationale: πάροικος bezeichnet jemanden, der als Außenstehender bei anderen wohnt, etwa einen Beisassen oder ansässigen Fremden. „Fremder“ ist im modernen Deutsch verständlich und wahrt die soziale Distanz, ohne den Ausdruck technisch oder bloß als „Gast“ wiederzugeben.
- source_word: κόσμησον τράπεζαν
  choice: deck den Tisch
  rationale: κοσμέω bedeutet hier praktisch „ordnen, herrichten“. In Verbindung mit τράπεζα entspricht dem im Deutschen idiomatisch „den Tisch decken“.
- source_word: εἴ τι ἐν τῇ χειρί σου
  choice: wenn du etwas zur Hand hast
  rationale: Die Formulierung bewahrt das konkrete Bild der Hand in einer natürlichen deutschen Wendung und bezeichnet das, worüber der Angesprochene verfügt.
- source_word: ψώμισόν με
  choice: gib mir davon zu essen
  rationale: ψωμίζω bezeichnet das Geben von Nahrung beziehungsweise das Speisen mit Bissen. Die deutsche Formulierung gibt die direkte Forderung idiomatisch wieder und nimmt das zuvor genannte Vorhandene mit „davon“ auf.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knappen Imperativen. „Komm her“ und „gib mir davon zu essen“ erhalten den schroffen, persönlich gerichteten Ton; „Fremder“ wahrt den Außenseiterstatus des Angesprochenen.
