  text: But be patient with the humble[a], and do not keep him waiting for almsgiving.
translation:
  language: de
  text: Doch hab Geduld mit dem Bedürftigen, und lass ihn nicht auf ein Almosen warten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Halte ihn wegen eines Almosens nicht hin.“ Das griechische Verb kann bedeuten, etwas aufzuschieben oder in die Länge zu ziehen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πλὴν
  choice: Doch
  rationale: Leitet einen einschränkenden Gegensatz zum vorausgehenden Rat ein und gibt die adversative Kraft knapp und natürlich wieder.
- source_word: ἐπὶ ταπεινῷ
  choice: mit dem Bedürftigen
  rationale: ταπεινός bezeichnet einen niedrig Gestellten, Armen oder Bedrängten. Im Zusammenhang von Darlehen und Almosen steht die soziale und wirtschaftliche Bedürftigkeit im Vordergrund; „Bedürftiger“ ist im Deutschen natürlicher als „Demütiger“ und vermeidet eine primär charakterliche Deutung.
- source_word: μακροθύμησον
  choice: hab Geduld
  rationale: Der Imperativ fordert zu geduldiger Nachsicht beziehungsweise Langmut gegenüber der betreffenden Person auf. „Hab Geduld“ ist gegenwärtig, verständlich und würdevoll.
- source_word: ἐπʼ ἐλεημοσύνην
  choice: auf ein Almosen
  rationale: ἐλεημοσύνη bezeichnet im jüdisch-griechischen Sprachgebrauch häufig eine konkrete mildtätige Gabe. In Verbindung mit dem Warten entspricht „auf ein Almosen“ natürlichem Deutsch.
- source_word: μὴ παρελκύσῃς
  choice: lass … nicht … warten
  rationale: Das Verb kann bedeuten, etwas hinauszuzögern oder in die Länge zu ziehen. Da αὐτόν eine Person bezeichnet, bringt die Formulierung das persönliche Hinhalten idiomatisch zum Ausdruck.
- source_word: αὐτόν
  choice: ihn
  rationale: Das maskuline Singularpronomen verweist auf den zuvor genannten Bedürftigen und wird entsprechend beibehalten.
