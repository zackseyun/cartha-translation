translation:
  language: de
  text: Viele zogen sich wegen der Bosheit zurück; sie fürchteten, ohne Gegenleistung um etwas gebracht zu werden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sie fürchteten, vergeblich um etwas gebracht zu werden.“'
    reason: δωρεάν kann „ohne Gegenleistung“, „umsonst“ oder „vergeblich“ bedeuten. ἀποστερηθῆναι bezeichnet, um etwas gebracht bzw. dessen beraubt zu werden; ein konkretes Objekt wird im griechischen Text nicht genannt.
lexical_decisions:
- source_word: πολλοὶ
  choice: Viele
  rationale: Der substantivische Plural bezeichnet allgemein eine unbestimmte größere Zahl von Menschen; „Viele“ gibt dies knapp und natürlich wieder.
- source_word: χάριν
  choice: wegen
  rationale: Als nachgestellte Präposition mit Genitiv bezeichnet χάριν hier den Grund oder Anlass, nicht „Gnade“ oder „Gefallen“.
- source_word: πονηρίας
  choice: Bosheit
  rationale: Das Wort benennt moralisch verwerfliches Verhalten. „Bosheit“ bewahrt diese ethische Wertung, ohne sie ausschließlich auf Betrug einzuengen.
- source_word: ἀπέστρεψαν
  choice: wandten sich … ab
  rationale: Die Wendung gibt den Rückzug beziehungsweise die Weigerung wieder, ohne ein im Griechischen nicht genanntes Objekt wie „Hilfe“ oder „Darlehen“ ausdrücklich einzufügen.
- source_word: ἀποστερηθῆναι
  choice: betrogen zu werden
  rationale: Das passive Verb bedeutet, um etwas gebracht oder dessen beraubt zu werden, häufig durch unredliches Handeln. Im finanziellen Zusammenhang ist „betrogen zu werden“ idiomatisch und treffend.
- source_word: δωρεὰν
  choice: ohne Grund
  rationale: Das Adverb kann „umsonst“, „vergeblich“ oder „ohne Grund“ bedeuten. Hier bezeichnet es am ehesten eine als unbegründet oder nutzlos empfundene Schädigung; die alternative Nuance wird in der Fußnote offengehalten.
- source_word: εὐλαβήθησαν
  choice: sie fürchteten
  rationale: Im Kontext bezeichnet das Verb vorsichtige Besorgnis beziehungsweise Furcht vor einem Verlust; „fürchteten“ ist klar und wahrt die motivierende Kraft.
theological_decisions:
- issue: Bezug und moralische Tragweite von πονηρίας
  choice: „wegen der Bosheit“, ohne den Träger der Bosheit ausdrücklich festzulegen
  alternative: „wegen der Schlechtigkeit“ oder kontextuell enger „wegen der Unehrlichkeit anderer“
  rationale: Der griechische Text nennt nicht ausdrücklich, wessen Bosheit den Rückzug veranlasst. Die Übersetzung bewahrt diese Offenheit und vermeidet es, dem Vers eine engere moralische oder soziale Deutung aufzuzwingen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der knappe Parallelismus des griechischen Satzes bleibt erhalten; nicht ausdrücklich genannte Objekte oder Akteure werden nicht ergänzt.
