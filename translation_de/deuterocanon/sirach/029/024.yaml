  yaml_path: translation/deuterocanon/sirach/029/024.yaml
  text: A miserable life is to go from house to house[a], and where one stays as a stranger[b], he will not open his mouth.
translation:
  language: de
  text: Ein elendes Leben ist es, von Haus zu Haus zu ziehen[a]; und wo man als Fremder wohnt[b], öffnet man den Mund nicht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Ein elendes Leben: von Haus zu Haus.“ Gemeint ist offenbar das unstete Leben eines Menschen, der immer wieder bei anderen Unterkunft suchen muss.'
    reason: lexical_alternative
  - marker: b
    text: Das griechische Verb bezeichnet das Wohnen als Ortsfremder oder Beisasse, also ohne die volle Zugehörigkeit zu einem Haushalt oder Gemeinwesen.
    reason: cultural_note
lexical_decisions:
- source_word: ζωὴ πονηρά
  choice: ein elendes Leben
  rationale: In Verbindung mit ζωή bezeichnet πονηρά hier am ehesten ein beschwerliches, beklagenswertes Leben und nicht moralische Bosheit. „Elendes Leben“ gibt die soziale Notlage knapp und natürlich wieder.
- source_word: ἐξ οἰκίας εἰς οἰκίαν
  choice: von Haus zu Haus zu ziehen
  rationale: Die griechische Wendung beschreibt das unstete Wechseln zwischen Haushalten. Der ergänzte Infinitiv macht den elliptischen Ausdruck im Deutschen verständlich und bewahrt das Bild.
- source_word: παροικήσει
  choice: als Fremder wohnt
  rationale: παροικέω bezeichnet das Wohnen an einem Ort ohne volle Zugehörigkeit, als Beisasse oder Ortsfremder. „Als Fremder wohnen“ wahrt diesen sozialen Aspekt in allgemein verständlicher Sprache.
- source_word: οὐκ ἀνοίξει στόμα
  choice: öffnet man den Mund nicht
  rationale: Die bildhafte griechische Redewendung wird wörtlich und idiomatisch wiedergegeben; sie lässt offen, ob Schweigen aus Unsicherheit, Abhängigkeit oder mangelndem Ansehen entsteht.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das unpersönliche „man“ gibt die allgemeine Aussage des griechischen Singulars im Deutschen natürlich wieder. Die parallele Satzstruktur und das anschauliche Bild vom verschlossenen Mund bleiben erhalten.
