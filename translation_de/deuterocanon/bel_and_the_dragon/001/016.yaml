  yaml_path: translation/deuterocanon/bel_and_the_dragon/001/016.yaml
  text: And their children too[a], and they ate up everything and drank it all. Then the king rose early in the morning, and Daniel with him.
translation:
  language: de
  text: Auch ihre Kinder[a]. Sie aßen alles auf und tranken alles aus. Früh am Morgen stand der König auf, und Daniel war bei ihm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Satz setzt die Aufzählung aus dem vorhergehenden Vers fort.
    reason: contextual_clarity
lexical_decisions:
- source_word: τὰ τέκνα αὐτῶν
  choice: auch ihre Kinder
  rationale: τέκνα bezeichnet allgemein Kinder, nicht speziell Söhne; καί setzt die Aufzählung fort und wird natürlich mit „auch“ wiedergegeben.
- source_word: κατέφαγον πάντα
  choice: sie aßen alles auf
  rationale: Das zusammengesetzte Verb καταφαγεῖν bezeichnet vollständiges oder gründliches Verzehren; „alles aufessen“ gibt diese verstärkende Bedeutung idiomatisch wieder.
- source_word: ἐξέπιον
  choice: tranken alles aus
  rationale: Das Verb bezeichnet vollständiges Austrinken; „alles aus“ macht die Totalität im Deutschen deutlich.
- source_word: ὤρθρισεν … πρωί
  choice: früh am Morgen stand … auf
  rationale: ὤρθρισεν bezeichnet frühes Aufstehen, während πρωί den Morgen nennt. Die Formulierung bewahrt beide Bedeutungsanteile ohne unnatürliche Wiederholung.
- source_word: Δανιὴλ μετʼ αὐτοῦ
  choice: Daniel war bei ihm
  rationale: Die griechische verblos formulierte Begleitung wird im Deutschen durch „war bei ihm“ klar und knapp ausgedrückt, ohne zusätzliche Bewegung zu unterstellen.
theological_decisions: []
translation_notes:
  register: Moderne, gut verständliche Standardsprache mit knappem Erzählstil. „Aßen … auf“ und „tranken … aus“ erhalten den Nachdruck des vollständigen Verzehrs; „früh am Morgen“ gibt die griechische zeitliche Verstärkung natürlich wieder.
