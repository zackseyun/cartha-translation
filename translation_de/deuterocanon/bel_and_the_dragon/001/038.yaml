base_translation:
  language: en
  yaml_path: translation/deuterocanon/bel_and_the_dragon/001/038.yaml
  text: Take the meal that God has sent you. And Daniel said[a], “For you have remembered me, O God, and have not forsaken those who love you.”
translation:
  language: de
  text: '»Nimm die Mahlzeit[a], die Gott dir geschickt hat.« Da sagte Daniel: »Denn du hast an mich gedacht, Gott, und diejenigen, die dich lieben, nicht verlassen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die beste Speise« oder »die Hauptmahlzeit«; griechisch τὸ ἄριστον kann ausgezeichnetes Essen oder eine Hauptmahlzeit bezeichnen.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: λάβε
  choice: Nimm
  rationale: Der Aoristimperativ von λαμβάνω wird als unmittelbare, natürliche Aufforderung wiedergegeben.
- source_word: τὸ ἄριστον
  choice: die Mahlzeit
  rationale: Das substantivierte ἄριστον kann die Hauptmahlzeit beziehungsweise ausgezeichnete Speise bezeichnen; im Kontext der gebrachten Nahrung ist »Mahlzeit« idiomatisch und vermeidet eine unbelegte Festlegung auf eine besondere Portion.
- source_word: ἀπέστειλέν
  choice: geschickt hat
  rationale: Das deutsche Perfekt bringt die abgeschlossene Sendung mit ihrer gegenwärtigen Folge natürlich zum Ausdruck.
- source_word: Ἐμνήσθης
  choice: du hast an mich gedacht
  rationale: Die deponentische Aoristform bezeichnet erinnerndes, fürsorgliches Gedenken; »an mich gedacht« ist im heutigen Deutsch natürlich und bewahrt den persönlichen Sinn.
- source_word: ἐγκατέλιπες
  choice: nicht verlassen
  rationale: Das Verb bezeichnet Zurücklassen oder Preisgeben; »verlassen« bewahrt hier Gewicht und Gebetston ohne altertümlich zu wirken.
- source_word: τοὺς ἀγαπῶντάς
  choice: die, die dich lieben
  rationale: Das substantivierte Partizip bezeichnet die Liebenden; das im griechischen Text unausgesprochene Objekt ergibt sich aus der direkten Anrede Gottes und muss im Deutschen ergänzt werden.
theological_decisions:
- issue: Unausgesprochenes Objekt bei τοὺς ἀγαπῶντάς
  choice: die, die dich lieben
  alternative: die, die Gott lieben
  rationale: Daniel redet Gott unmittelbar an. Daher ist »dich« die natürliche Ergänzung des im Griechischen kontextuell vorausgesetzten Objekts, ohne eine zusätzliche Lehraussage einzutragen.
- issue: Bedeutung des göttlichen Erinnerns
  choice: du hast an mich gedacht
  alternative: du hast dich meiner erinnert
  rationale: Die gewählte Formulierung lässt das biblische Motiv fürsorglichen göttlichen Gedenkens bestehen, drückt es jedoch in natürlichem modernem Deutsch aus.
translation_notes:
  register: Moderne, würdige Standardsprache mit direkter Rede. »Mahlzeit« ist für τὸ ἄριστον bewusst kontextbezogen gewählt; die lexikalische Spannweite wird nicht unnötig durch eine Fußnote belastet, da der Verskontext Nahrung eindeutig voraussetzt.
