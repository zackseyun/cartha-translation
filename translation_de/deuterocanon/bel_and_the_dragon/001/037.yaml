  yaml_path: translation/deuterocanon/bel_and_the_dragon/001/037.yaml
  text: And Habakkuk cried out[a], saying, “Daniel, Daniel, take the meal that God has sent you.”
translation:
  language: de
  text: 'Und Habakuk rief laut: „Daniel, Daniel! Nimm die Mahlzeit, die Gott dir geschickt hat.“[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die hier vorliegende griechische Zeile bricht nach „Daniel, Daniel“ mit einem einzelnen Buchstaben ab. Der restliche Satz folgt der bekannten Fortsetzung dieses Verses in der Theodotion-Fassung von Bel und der Drache: Habakuk nennt Daniel die Mahlzeit, die Gott ihm geschickt hat.'
    reason: textual_variant
lexical_decisions:
- source_word: ἐβόησεν
  choice: rief laut
  rationale: Das Verb bezeichnet einen lauten Ruf. „Rief laut“ gibt seine Stärke natürlich wieder, ohne den Ruf unnötig als zorniges Schreien festzulegen.
- source_word: Ἀμβακοὺμ
  choice: Habakuk
  rationale: Verwendet die im Deutschen übliche Namensform des Propheten statt einer mechanischen Umschrift der griechischen Form.
- source_word: λέγων
  choice: 'rief laut:'
  rationale: Das Partizip leitet die direkte Rede ein. Im modernen Deutschen wird es idiomatisch durch den Doppelpunkt wiedergegeben, statt mit dem schwerfälligen „indem er sagte“.
- source_word: Δανιὴλ Δανιήλ
  choice: Daniel, Daniel!
  rationale: Die doppelte Anrede bleibt erhalten und vermittelt Nachdruck und Dringlichkeit; das Ausrufezeichen entspricht der Rufhandlung.
- source_word: '[standard continuation: λαβὲ τὸ ἄριστον ὃ ἀπέστειλέ σοι ὁ θεός]'
  choice: Nimm die Mahlzeit, die Gott dir geschickt hat.
  rationale: Die gelieferte Zeile bricht nach der Anrede ab. Die Übersetzung ergänzt transparent die bekannte Fortsetzung der Theodotion-Fassung; „Mahlzeit“ gibt das für Daniel bestimmte Essen im Zusammenhang natürlich wieder.
theological_decisions:
- issue: Umgang mit der abgebrochenen griechischen Vorlage
  choice: Die bekannte Fortsetzung der Theodotion-Fassung wird übersetzt und die Ergänzung in einer Fußnote offengelegt.
  alternative: 'Nur den sichtbar erhaltenen Wortlaut übersetzen: „Und Habakuk rief laut: Daniel, Daniel …“'
  rationale: So entsteht ein lesbarer vollständiger Vers, ohne den unvollständigen Zustand der bereitgestellten griechischen Zeile oder die Grundlage der Ergänzung zu verschweigen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede ist knapp und lebendig; „rief laut“ bewahrt die Intensität des griechischen Verbs, während die Wiederholung des Namens unverändert bleibt. Die textkritisch ergänzte Fortsetzung wird nicht stillschweigend als vollständig erhalten ausgegeben.
