  text: There were seven lions in the pit[a], and each day they were given two bodies and two sheep; but then nothing was given to them, so that they might devour Daniel.
translation:
  language: de
  text: In der Grube waren sieben Löwen. Jeden Tag gab man ihnen zwei Leiber[a] und zwei Schafe; diesmal aber gab man ihnen nichts, um Daniel zu verschlingen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zwei Körper“ beziehungsweise „zwei Leichname“. Im Griechischen steht σώματα, wörtlich „Körper“ oder „Leiber“; der Zusammenhang legt nahe, dass damit Futter für die Löwen gemeint ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λάκκῳ
  choice: Grube
  rationale: Das griechische Wort bezeichnet eine Grube oder eine zisternenartige Vertiefung. „Grube“ bleibt näher am Wortlaut als das deutendere „Löwengrube“.
- source_word: ἑπτὰ λέοντες
  choice: sieben Löwen
  rationale: Direkte Wiedergabe von Zahlwort und Substantiv.
- source_word: ἐδίδοτο αὐτοῖς τὴν ἡμέραν
  choice: Jeden Tag gab man ihnen
  rationale: Der Imperfekt bezeichnet zusammen mit der Zeitangabe die regelmäßig wiederkehrende Fütterung. Die aktivische unpersönliche Formulierung ist im Deutschen natürlich.
- source_word: δύο σώματα
  choice: zwei Leiber
  rationale: σώματα bedeutet wörtlich „Körper“ oder „Leiber“. Im Zusammenhang handelt es sich wohl um tote Körper als Löwenfutter; „Leiber“ bewahrt jedoch die Offenheit des griechischen Ausdrucks.
- source_word: δύο πρόβατα
  choice: zwei Schafe
  rationale: Natürliche und genaue Wiedergabe von πρόβατα.
- source_word: τότε δὲ οὐκ ἐδόθη αὐτοῖς
  choice: diesmal aber gab man ihnen nichts
  rationale: τότε hebt hier den betreffenden Zeitpunkt gegenüber der täglichen Gewohnheit hervor. „Diesmal“ gibt diesen Kontrast idiomatisch wieder; „nichts“ ergänzt im Deutschen das im Griechischen elliptisch ausgesparte Futter.
- source_word: ἵνα καταφάγωσιν
  choice: damit sie … verschlingen sollten
  rationale: καταφάγωσιν bezeichnet ein vollständiges Aufzehren oder Verschlingen. Der deutsche Finalsatz wahrt Zweckbezug und Erzählperspektive.
- source_word: τὸν Δανιήλ
  choice: Daniel
  rationale: Gebräuchliche deutsche Namensform.
theological_decisions:
- issue: Zweckangabe der vorenthaltenen Fütterung
  choice: damit sie Daniel verschlingen sollten
  alternative: sodass sie Daniel verschlingen würden
  rationale: ἵνα drückt ausdrücklich einen Zweck aus. Die Übersetzung lässt offen, wer diesen Zweck verfolgte, und deutet das Geschehen nicht theologisch um.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Kurze, klare Satzführung; „Leiber“ ist bewusst etwas gehobener als „Körper“, bewahrt aber die lexikalische Offenheit und den erzählerischen Ernst.
