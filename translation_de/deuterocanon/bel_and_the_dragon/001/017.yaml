  text: And he said[a], “Are the seals intact, Daniel?” And he said, “They are intact, O king.”
translation:
  language: de
  text: 'Und er fragte: „Sind die Siegel unversehrt, Daniel?“ Er antwortete: „Sie sind unversehrt, König.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Σῶοι
  choice: unversehrt
  rationale: Das Adjektiv bedeutet „sicher, heil, unversehrt“. Auf Siegel bezogen bezeichnet „unversehrt“ natürlich und präzise, dass sie nicht beschädigt oder gebrochen wurden.
- source_word: αἱ σφραγῖδες
  choice: die Siegel
  rationale: Gemeint sind Siegel beziehungsweise Siegelabdrücke, mit denen der Zugang gesichert wurde; „die Siegel“ ist im Deutschen die klare, übliche Wiedergabe.
- source_word: βασιλεῦ
  choice: König
  rationale: Der Vokativ bezeichnet die direkte Anrede. Im modernen Deutschen gibt „König“ diese ohne den altertümlichen Zusatz „o“ wieder.
- source_word: καὶ εἶπεν ... ὁ δὲ εἶπεν
  choice: Und er fragte ... Er antwortete
  rationale: Obwohl das Griechische zweimal „sagte“ verwendet, machen Frageform und Antwortfunktion die idiomatische Wiedergabe mit „fragte“ und „antwortete“ eindeutig, ohne zusätzliche Aussage einzutragen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede bleibt knapp; die im Deutschen unnötig schwerfällige Wiederholung von „sagte“ wird funktionsgerecht als „fragte“ und „antwortete“ wiedergegeben.
