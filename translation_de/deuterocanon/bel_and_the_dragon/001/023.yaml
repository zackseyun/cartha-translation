  text: And there was a great dragon[a], and the Babylonians worshiped it.
translation:
  language: de
  text: Und es gab einen großen Drachen, den die Babylonier anbeteten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »verehrten«. Das griechische Verb bezeichnet religiöse Ehrfurcht oder Verehrung, hier wahrscheinlich kultische Anbetung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δράκων
  choice: Drache
  rationale: Das griechische Wort bezeichnet einen Drachen oder eine große Schlange. »Drache« entspricht dem überlieferten Titel und lässt die genaue Gestalt des Wesens offen.
- source_word: μέγας
  choice: groß
  rationale: Die naheliegende Wiedergabe bewahrt sowohl die mögliche Größenangabe als auch den gehobenen Erzählton.
- source_word: ἐσέβοντο
  choice: anbeteten
  rationale: Das Verb bezeichnet religiöse Verehrung und hat hier, da der Drache als Kultobjekt erscheint, wahrscheinlich den Sinn von Anbetung.
- source_word: οἱ Βαβυλώνιοι
  choice: die Babylonier
  rationale: Dies ist die direkte und im Deutschen natürliche Bezeichnung der betreffenden Bevölkerungsgruppe.
theological_decisions:
- issue: Art der Beziehung der Babylonier zum Drachen
  choice: Das Verb wird als ausdrückliche religiöse Anbetung wiedergegeben.
  alternative: Die Babylonier verehrten den Drachen.
  rationale: Der Zusammenhang legt kultische Verehrung nahe. Die Fußnote bewahrt jedoch die etwas weitere Bedeutungsmöglichkeit des griechischen Verbs.
translation_notes:
  register: Moderne, klare und würdige Erzählsprache. Der Relativsatz vermeidet im Deutschen die missverständliche pronominale Bezugnahme von »ihn« auf einen grammatisch männlichen Drachen; der Fußnotenmarker steht unmittelbar bei der relevanten Aussage.
