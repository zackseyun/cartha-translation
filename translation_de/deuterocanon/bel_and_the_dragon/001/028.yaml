base_translation:
  language: en
  yaml_path: translation/deuterocanon/bel_and_the_dragon/001/028.yaml
  text: And it happened that when the Babylonians heard[a], they became indignant and gathered together against the king and said, “The king has become a Jew; he has torn down Bel and killed the dragon and slaughtered the priests.”
translation:
  language: de
  text: 'Als die Babylonier davon hörten, empörten sie sich, scharten sich gegen den König zusammen und sagten: »Der König ist ein Jude geworden![a] Er hat Bel niedergerissen, den Drachen getötet und die Priester abgeschlachtet.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Der König ist ein Judäer geworden!« Das griechische Wort kann sowohl die ethnisch-religiöse Zugehörigkeit (»Jude«) als auch die geografisch-politische Zugehörigkeit (»Judäer«) bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ὡς ἤκουσαν
  choice: Als ... davon hörten
  rationale: Die griechische Erzählformel leitet den nächsten Handlungsschritt ein. Im modernen Deutschen gibt »Als ... hörten« den zeitlichen Übergang natürlich wieder; »davon« ergänzt idiomatisch den aus dem Kontext erschließbaren Inhalt, ohne stärkere Unmittelbarkeit zu behaupten.
- source_word: οἱ Βαβυλώνιοι
  choice: die Babylonier
  rationale: Direkte und im Deutschen natürliche Bezeichnung der ethnisch-städtischen Gruppe.
- source_word: ἠγανάκτησαν
  choice: wurden sie empört
  rationale: Das Verb bezeichnet starken Unwillen beziehungsweise Entrüstung. »Empört« bewahrt diese Wertung, ohne bereits die nachfolgende feindselige Aktion vorwegzunehmen.
- source_word: συνεστράφησαν ἐπὶ τὸν βασιλέα
  choice: Sie rotteten sich gegen den König zusammen
  rationale: Die Formulierung bezeichnet ein kollektives Zusammenkommen beziehungsweise Sich-Zusammenschließen gegen den König. »Sich zusammenrotten« bringt die offene, feindselige Gruppenbildung zum Ausdruck, ohne ein geheimes Komplott einzutragen.
- source_word: Ἰουδαῖος γέγονεν ὁ βασιλεύς
  choice: Der König ist ein Jude geworden
  rationale: Im Kontext richtet sich der Vorwurf gegen die religiös-ethnische Hinwendung des Königs zu Daniels Seite. Die mögliche Bedeutung »Judäer« wird wegen der echten lexikalischen Mehrdeutigkeit in einer Fußnote bewahrt.
- source_word: τὸν Βὴλ κατέσπασεν
  choice: Er hat Bel niedergerissen
  rationale: κατασπάω bezeichnet das Herab- beziehungsweise Niederreißen. Die direkte Konstruktion des Griechischen bleibt erhalten, ohne ausdrücklich festzulegen, ob Bel hier vor allem als Bild oder Kultgegenstand gedacht ist.
- source_word: τὸν δράκοντα ἀπέκτεινεν
  choice: den Drachen getötet
  rationale: Klare, gegenwärtige Wiedergabe des gewöhnlichen Verbs für Töten; »Drache« entspricht der traditionellen und kontextuell passenden Bezeichnung für δράκων.
- source_word: τοὺς ἱερεῖς κατέσφαξεν
  choice: die Priester abgeschlachtet
  rationale: κατασφάζω ist stärker als ein neutrales »töten« und bezeichnet gewaltsames Niedermetzeln. »Abgeschlachtet« erhält diese Härte.
theological_decisions:
- issue: Wiedergabe von Ἰουδαῖος
  choice: Jude
  alternative: Judäer
  rationale: Ἰουδαῖος kann eine ethnisch-religiöse oder eine geografisch-politische Zugehörigkeit bezeichnen. Im Erzählzusammenhang werfen die Babylonier dem König seine Parteinahme für Daniels Volk und dessen Gottesverehrung vor; daher steht »Jude« im Haupttext. Die sachlich mögliche Alternative »Judäer« bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit lebendiger Erzählbewegung. Die direkte Rede bleibt kraftvoll; die starken Verben des Ausgangstextes werden nicht abgeschwächt. Die erzählerische Eingangsformel wird natürlich statt hölzern wiedergegeben.
