  yaml_path: translation/deuterocanon/bel_and_the_dragon/001/030.yaml
  text: And the king saw that they were pressing him very hard, and being compelled, he handed Daniel over to them.
translation:
  language: de
  text: Und als der König sah, dass sie ihn heftig bedrängten, war er gezwungen, ihnen Daniel auszuliefern.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπείγουσιν
  choice: bedrängten
  rationale: Das Verb bezeichnet hier anhaltenden, starken Druck und nicht bloß eine Bitte; „bedrängten“ gibt diesen politischen und sozialen Druck natürlich wieder.
- source_word: σφόδρα
  choice: sehr
  rationale: Das Adverb verstärkt das Bedrängen ausdrücklich; „sehr“ bewahrt die Intensität in idiomatischem modernem Deutsch.
- source_word: ἀναγκασθείς
  choice: gab er ihrem Zwang nach
  rationale: Das passive Partizip zeigt, dass der König unter äußerem Zwang handelt. Die Formulierung ist im Deutschen flüssig, ohne körperliche Gewalt zu unterstellen.
- source_word: παρέδωκεν
  choice: lieferte ... aus
  rationale: Das Verb bezeichnet die Übergabe eines Menschen in die Gewalt anderer; „ausliefern“ trifft diesen Sinn prägnant.
- source_word: Δανιήλ
  choice: Daniel
  rationale: Übliche deutsche Form des Personennamens.
theological_decisions:
- issue: Grad des auf den König ausgeübten Zwangs
  choice: Der König handelt unter starkem gesellschaftlichem oder politischem Druck.
  alternative: Der König wurde lediglich überzeugt oder aber körperlich gezwungen.
  rationale: Die Verbindung von ἐπείγουσιν ... σφόδρα und ἀναγκασθείς beschreibt massiven Druck und daraus folgendes erzwungenes Handeln, ohne die Art des Zwangs genauer festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz bleibt knapp und erzählerisch; „ihrem Zwang nachgeben“ vermeidet eine unnatürliche Partizipialkonstruktion und wahrt zugleich die passive Zwangslage des Königs.
