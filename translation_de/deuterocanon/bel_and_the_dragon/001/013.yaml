  text: But they were unconcerned[a], because they had made a hidden entrance under the table, and through it they would go in
translation:
  language: de
  text: Sie aber machten sich darüber keine Gedanken[a], denn sie hatten unter dem Tisch einen verborgenen Eingang angelegt, durch den sie immer hineingingen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sie achteten nicht darauf“; auch möglich: „Sie sahen verächtlich darauf herab.“ Das griechische Verb kann sowohl Geringschätzung als auch unbekümmerte Missachtung ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατεφρόνουν
  choice: machten sich darüber keine Gedanken
  rationale: Das Verb kann Geringschätzung, Missachtung oder unbekümmerte Gleichgültigkeit ausdrücken. Im Zusammenhang bezeichnet es ihre sorglose Haltung, weil sie auf den verborgenen Zugang vertrauten; die Formulierung bewahrt diese Bedeutungsbreite in natürlichem Deutsch.
- source_word: πεποιήκεσαν
  choice: hatten … angelegt
  rationale: Das Plusquamperfekt gibt eine bereits zuvor ausgeführte Handlung wieder. Bei einem verborgenen baulichen Zugang klingt „angelegt“ im Deutschen natürlich.
- source_word: ὑπὸ τὴν τράπεζαν κεκρυμμένην εἴσοδον
  choice: unter dem Tisch einen verborgenen Eingang
  rationale: Die räumliche Angabe und das Partizip werden nah am Griechischen wiedergegeben, ohne „Tisch“ als Altar oder Opfertisch auszudeuten.
- source_word: διʼ αὐτῆς
  choice: durch den
  rationale: Das feminine Pronomen bezieht sich auf εἴσοδον; im Deutschen wird der Bezug mit dem Relativpronomen eindeutig und flüssig ausgedrückt.
- source_word: εἰσεπορεύοντο
  choice: immer hineingingen
  rationale: Der Imperfekt bezeichnet hier ein wiederholtes bzw. gewohnheitsmäßiges Hineingehen. „immer“ macht diesen iterativen Aspekt idiomatisch sichtbar.
