  text: Daniel[a], and there is no other besides you. And he pulled him up. But he threw those responsible for his destruction into the pit[b], and they were devoured at once before him.
translation:
  language: de
  text: Daniel[a], außer dir gibt es keinen anderen. Und er zog ihn herauf. Die aber, die für seinen Untergang verantwortlich waren, warf er in die Grube[b], und sie wurden sofort vor ihm verschlungen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Text beginnt unvermittelt mit „Daniel, außer dir gibt es keinen anderen“ und führt wahrscheinlich die Rede aus dem vorherigen Vers fort. Manche Übersetzungen ergänzen sinngemäß: „Der König sagte“.'
    reason: textual_variant
  - marker: b
    text: 'Oder: „in die Löwengrube“. Das griechische Wort bedeutet wörtlich „Grube“; im Zusammenhang ist die Grube der Löwen gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἔστιν πλὴν σοῦ ἄλλος
  choice: außer dir gibt es keinen anderen
  rationale: Die Formulierung bewahrt die emphatische Ausschließlichkeit des Griechischen und richtet das Lob unmittelbar an Daniel.
- source_word: ἀνέσπασεν
  choice: zog ... herauf
  rationale: Das Verb bezeichnet ein Heraufziehen von unten und passt daher genau zur Rettung aus der Grube.
- source_word: τοὺς ... αἰτίους τῆς ἀπωλείας αὐτοῦ
  choice: diejenigen, die für seinen Untergang verantwortlich waren
  rationale: αἴτιος umfasst Verursachung und Schuld; ἀπώλεια wird mit dem hinreichend weiten „Untergang“ wiedergegeben, ohne es unnötig auf „Tod“ zu verengen.
- source_word: ἐνέβαλεν εἰς τὸν λάκκον
  choice: warf ... in die Grube
  rationale: „Warf“ gibt die gewaltsame Handlung wieder; λάκκος bedeutet wörtlich „Grube“, auch wenn hier die Löwengrube gemeint ist.
- source_word: κατεβρώθησαν
  choice: wurden ... verschlungen
  rationale: Die passive Form und das vollständige Gefressenwerden durch die Löwen werden prägnant und idiomatisch ausgedrückt.
- source_word: παραχρῆμα
  choice: sofort
  rationale: Das Wort bezeichnet unmittelbares Geschehen ohne Verzögerung.
- source_word: ἐνώπιον αὐτοῦ
  choice: vor seinen Augen
  rationale: Die idiomatische deutsche Wendung macht deutlich, dass das Geschehen in seiner Gegenwart stattfand; im Zusammenhang ist der König gemeint.
theological_decisions:
- issue: Abrupter Satzanfang im griechischen Zeugen
  choice: Die überlieferte Anrede an Daniel wird ohne ergänzendes Redeverb übersetzt.
  alternative: 'Einleitend ergänzen: „Der König sagte: Daniel ...“'
  rationale: Der griechische Text setzt unvermittelt mit „Daniel, und ...“ ein und führt wahrscheinlich die Rede des vorherigen Verses fort. Eine Ergänzung im Haupttext würde eine nicht ausdrücklich überlieferte Angabe festlegen.
