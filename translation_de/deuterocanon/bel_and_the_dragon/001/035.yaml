base_translation:
  language: en
  yaml_path: translation/deuterocanon/bel_and_the_dragon/001/035.yaml
  text: And Habakkuk said[a], “Lord, I have not seen Babylon, and I do not know the pit.”
translation:
  language: de
  text: 'Und Habakuk sagte: „Herr, ich habe Babylon nicht gesehen und kenne die Grube[a] nicht.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „das Verlies“ oder „die Zisterne“. Das griechische Wort bezeichnet allgemein eine grubenartige Vertiefung und bezieht sich hier auf den Ort, an dem Daniel gefangen gehalten wird.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀμβακοὺμ
  choice: Habakuk
  rationale: Die im Deutschen übliche Namensform des Propheten.
- source_word: Κύριε
  choice: Herr
  rationale: Der Vokativ von κύριος richtet sich hier an Gott; „Herr“ ist die natürliche und traditionelle deutsche Entsprechung.
- source_word: Βαβυλῶνα
  choice: Babylon
  rationale: Die standarddeutsche Form des Ortsnamens.
- source_word: οὐχ ἑώρακα
  choice: ich habe … nicht gesehen
  rationale: Das griechische Perfekt bezeichnet Habakuks bisherige Erfahrung und wird im Deutschen angemessen mit dem Perfekt wiedergegeben.
- source_word: τὸν λάκκον
  choice: die Grube
  rationale: λάκκος ist eine allgemeine Bezeichnung für eine Vertiefung, Grube, Zisterne oder ein höhlenartiges Verlies. „Grube“ bleibt direkt und vermeidet eine unnötige Festlegung.
- source_word: οὐ γινώσκω
  choice: kenne … nicht
  rationale: Im Zusammenhang mit einem Ort drückt γινώσκω fehlende Kenntnis beziehungsweise Vertrautheit aus; „kennen“ ist idiomatischer als „wissen“.
theological_decisions:
- issue: Wiedergabe von κύριος in der direkten Anrede Gottes
  choice: Herr
  alternative: Gebieter
  rationale: „Herr“ ist die sachgerechte und natürliche Wiedergabe, ohne über den griechischen Wortlaut hinauszugehen.
translation_notes:
  register: Moderne, würdige Standardsprache. Die Satzstruktur bleibt nah am Griechischen; „kenne die Grube nicht“ ist im Deutschen natürlich und bewahrt die Unterscheidung zwischen nicht gesehen haben und nicht kennen.
