  source_fidelity: Die Wiedergabe von γῆ, πάσης σαρκὸς, ζῶν θεός und ὅσα ἐσθίει ist grundsätzlich treffend. Der griechische Ausschnitt setzt jedoch nach τὴν γῆν mit dem Partizip ἔχοντα fort; die deutsche Fassung „und der über alles Fleisch Herrschaft hat“ erzeugt ohne sichtbares Bezugswort eine nicht tragfähige Konstruktion. Eine partizipiale Fortsetzung bildet den fragmentarischen griechischen Anschluss unmittelbarer ab.
