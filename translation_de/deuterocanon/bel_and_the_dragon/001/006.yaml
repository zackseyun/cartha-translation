translation:
  language: de
  text: 'die Erde und Herrschaft über alles Fleisch habend. Und der König sagte zu ihm: „Scheint dir Bel nicht ein lebendiger Gott zu sein? Oder siehst du nicht, wie viel er isst und[a]“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der für diesen Vers vorliegende griechische Textausschnitt beginnt mitten im Satz und bricht nach „und“ ab. Die Übersetzung bewahrt diese offenen Anschlüsse, ohne den fehlenden Wortlaut zu ergänzen.
    reason: textual_variant
lexical_decisions:
- source_word: γῆν
  choice: die Erde
  rationale: Im Zusammenhang bezeichnet γῆ die Erde als Teil der Schöpfung, nicht ein bestimmtes Land. Der Akkusativ bleibt als Fortsetzung des vorausgehenden, hier nicht enthaltenen Satzteils erkennbar.
- source_word: ἔχοντα πάσης σαρκὸς κυρίαν
  choice: der über alles Fleisch Herrschaft hat
  rationale: Die Wendung bezeichnet umfassende Herrschaft. „Alles Fleisch“ bewahrt die biblische Ausdrucksweise und lässt offen, ob vor allem Menschen oder alle Lebewesen gemeint sind.
- source_word: δοκεῖ σοι
  choice: Scheint dir … nicht
  rationale: Die Formulierung gibt die rhetorische Frage und den auf Daniel gerichteten Eindruck unmittelbar wieder.
- source_word: ζῶν θεός
  choice: ein lebendiger Gott
  rationale: Die artikellose Prädikatswendung wird unbestimmt wiedergegeben; dadurch wird Bels Bezeichnung im Mund des Königs nicht mit dem Bekenntnistitel „der lebendige Gott“ gleichgesetzt.
- source_word: ὅσα ἐσθίει
  choice: wie viel er isst
  rationale: ὅσα hebt hier die als Beweis angeführte Menge des Verzehrten hervor, nicht eine Aufzählung einzelner Speisen.
theological_decisions:
- issue: Bedeutungsumfang von πάσης σαρκὸς in der Aussage über Gottes Herrschaft
  choice: alles Fleisch
  alternative: alle Menschen; jedes Lebewesen
  rationale: Die traditionelle biblische Wendung erhält den weiten, im Griechischen nicht abschließend bestimmten Bedeutungsumfang.
- issue: Wiedergabe von ζῶν θεός in der Rede des heidnischen Königs
  choice: ein lebendiger Gott
  alternative: der lebendige Gott
  rationale: Da die griechische Prädikatswendung keinen Artikel hat und sich auf Bel bezieht, wäre der bestimmte Bekenntnistitel „der lebendige Gott“ eine theologische Überbestimmung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die biblische Wendung „alles Fleisch“ bleibt erhalten; der fragmentarische Anfang und Schluss des bereitgestellten Quellsegments werden nicht geglättet.
