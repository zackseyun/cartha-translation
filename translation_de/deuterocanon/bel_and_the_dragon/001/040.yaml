base_translation:
  language: en
  yaml_path: translation/deuterocanon/bel_and_the_dragon/001/040.yaml
  text: He set Habakkuk down at once in his own place[a]. Then the king came on the seventh day to mourn for Daniel, and he came to the pit and looked in, and behold[b], Daniel was sitting there.
translation:
  language: de
  text: Sogleich brachte er Habakuk an seinen Ort zurück. Am siebten Tag kam der König, um Daniel zu betrauern. Er ging zur Grube und blickte hinein, und siehe, da saß Daniel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατέστησεν
  choice: brachte ... zurück
  rationale: Im Zusammenhang mit Habakuks vorheriger Versetzung bezeichnet das Verb, dass er wieder an seinen Ort gebracht wird. Das natürliche deutsche »zurückbringen« macht den kontextuell gegebenen Rückkehrgedanken deutlich, ohne die Art der Beförderung auszumalen.
- source_word: παραχρῆμα
  choice: sogleich
  rationale: Das Adverb bezeichnet unmittelbares Geschehen; »sogleich« ist knapp, würdig und allgemein verständlich.
- source_word: εἰς τὸν τόπον αὐτοῦ
  choice: an seinen Ort
  rationale: Die Wendung bezeichnet den Habakuk zugehörigen beziehungsweise vorherigen Ort. »An seinen Ort« bewahrt die Zielrichtung von εἰς und lässt offen, welcher Ort genau gemeint ist.
- source_word: πενθῆσαι
  choice: um Daniel zu betrauern
  rationale: Der finale Infinitiv nennt den Zweck des Kommens. »Betrauern« gibt die Erwartung des Königs wieder, Daniel sei gestorben, ohne darüber hinauszugehen.
- source_word: λάκκον
  choice: Grube
  rationale: λάκκος ist die allgemeine Bezeichnung für eine Grube oder Vertiefung. »Grube« bleibt näher am griechischen Wort als das durch den Erzählzusammenhang spezialisierte »Löwengrube«.
- source_word: ἐνέβλεψεν
  choice: blickte hinein
  rationale: Im Zusammenhang mit der Bewegung zur Grube bezeichnet das Verb ein Hineinsehen. »blickte hinein« ist präzise und natürlich.
- source_word: ἰδοὺ
  choice: siehe
  rationale: Die Präsentationspartikel hebt die überraschende Entdeckung erzählerisch hervor. Das literarische »siehe« erhält diesen Effekt.
- source_word: καθήμενος
  choice: da saß Daniel
  rationale: Das Partizip bezeichnet Daniels sitzende Haltung. Die deutsche Konstruktion »da saß Daniel« verbindet Haltung und vorgefundene Anwesenheit idiomatisch.
theological_decisions:
- issue: Die Trauerhandlung des Königs gegenüber Daniel
  choice: um Daniel zu betrauern
  alternative: um Daniel zu beklagen / um Daniel zu trauern
  rationale: Die Formulierung lässt erkennen, dass der König Daniel für tot hält und deshalb kommt. Sie bewahrt die erzählerische Spannung zur unmittelbar folgenden Entdeckung des lebenden Daniel, ohne eine weitergehende theologische Deutung einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Erzählbewegung. Das literarische »siehe« wurde bewusst beibehalten, um die plötzliche Entdeckung zu markieren; ansonsten vermeidet der Text altertümliche Formen. Keine Fußnote ist erforderlich, da »Grube« die Breite von λάκκος direkt wahrt und »an seinen Ort« die Zielrichtung der griechischen Wendung angemessen erhält.
