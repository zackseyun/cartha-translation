lexical_decisions:
- source_word: ἐπελάβετο
  choice: packte
  rationale: Das Verb bezeichnet hier ein entschiedenes Ergreifen. „Packte“ gibt die plötzliche, kraftvolle Handlung natürlich wieder.
- source_word: ἄγγελος Κυρίου
  choice: Engel des Herrn
  rationale: Der Erzählzusammenhang meint ein übernatürliches Wesen; Κυρίου wird ohne Eintragung eines nicht ausdrücklich vorliegenden Gottesnamens mit „des Herrn“ wiedergegeben.
- source_word: κορυφῆς
  choice: am Scheitel
  rationale: κορυφή bezeichnet beim Menschen den obersten Teil des Kopfes. „Am Scheitel“ ist im Deutschen präzise und idiomatisch.
- source_word: βαστάσας
  choice: trug
  rationale: Das Partizip beschreibt das Befördern der Person nach Babylon; „trug“ erhält diesen Bewegungssinn.
- source_word: κόμης τῆς κεφαλῆς
  choice: am Haar seines Kopfes
  rationale: Die Wiedergabe bewahrt die ausdrückliche Bezugnahme auf das Kopfhaar, ohne durch „Locken“ oder „langes Haar“ zusätzliche Merkmale einzutragen.
- source_word: ἔθηκεν
  choice: setzte … ab
  rationale: Im Zusammenhang einer Beförderung bezeichnet das Verb das Platzieren am Ziel; „setzte … ab“ klingt im deutschen Erzählstil natürlich.
- source_word: ἐπάνω τοῦ λάκκου
  choice: über der Grube
  rationale: Die Formulierung bewahrt die räumliche Angabe „oberhalb/über“, ohne die genaue Position näher festzulegen.
- source_word: ἐν τῷ ῥοίζῳ τοῦ
  choice: im Brausen des
  rationale: ῥοίζος bezeichnet ein sausendes oder brausendes Geräusch. Da der vorgelegte griechische Text nach dem Artikel τοῦ abbricht, bleibt auch die deutsche Wortgruppe bewusst unvollständig.
theological_decisions:
- issue: Wiedergabe von κύριος in ἄγγελος Κυρίου
  choice: Herr
  alternative: HERR
  rationale: Der griechische Zeuge hat Κυρίου und weist an dieser Stelle nicht ausdrücklich den hebräischen Gottesnamen aus. Daher wird kein typografisch hervorgehobenes „HERR“ eingetragen.
- issue: Unvollständiger Schluss des vorgelegten griechischen Textes
  choice: Nur den erhaltenen Wortlaut übersetzen und den Satzabbruch sichtbar bewahren
  alternative: Den mutmaßlichen Schluss aus anderen Textzeugen oder dem Kontext ergänzen
  rationale: Der bereitgestellte Primärtext endet mitten in der Genitivgruppe ἐν τῷ ῥοίζῳ τοῦ. Eine Ergänzung im Haupttext würde nicht belegte Wörter einführen.
translation_notes:
  register: Moderner, würdiger Erzählstil. „Packte“ vermittelt die Kraft der Handlung, ohne altertümlich zu wirken. Der ungewöhnliche und unvollständige Versschluss wird aus Gründen der Quellentreue nicht geglättet.
