  text: And Daniel took pitch and fat and hair[a], and boiled them together and made cakes, and put them into the dragon’s mouth; and when the dragon had eaten them, it burst apart. And he said, “See your objects of worship.”
translation:
  language: de
  text: 'Daniel nahm Pech, Fett und Haare, kochte alles zusammen und formte daraus Fladen. Die gab er dem Drachen ins Maul. Als der Drache sie gefressen hatte, barst er auseinander. Da sagte Daniel: »Seht, was ihr verehrt![a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »eure Verehrungsgegenstände« beziehungsweise »eure Heiligtümer«. Das griechische Wort bezeichnet Dinge, die ehrfürchtig verehrt oder angebetet werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πίσσαν
  choice: Pech
  rationale: πίσσα bezeichnet Pech beziehungsweise einen teer- oder harzartigen Stoff; »Pech« ist im Deutschen knapp, geläufig und sachlich passend.
- source_word: στῖρ
  choice: Fett
  rationale: Das Wort bezeichnet tierisches Fett. »Fett« wahrt die Breite des Ausdrucks, ohne ihn unnötig als Talg oder Schmalz zu präzisieren.
- source_word: τρίχας
  choice: Haare
  rationale: Die konkrete Pluralform wird direkt und verständlich wiedergegeben.
- source_word: ἥψησεν ἐπὶ τὸ αὐτό
  choice: kochte alles zusammen
  rationale: ἕψω kann kochen oder sieden bedeuten; ἐπὶ τὸ αὐτό betont, dass die Zutaten gemeinsam zu einer Mischung verarbeitet werden.
- source_word: μάζας
  choice: Fladen
  rationale: μᾶζα bezeichnet geformte, geknetete Kuchen oder Klumpen. »Fladen« wirkt im Erzählzusammenhang natürlich und vermeidet die heute leicht süßliche Assoziation von »Kuchen«.
- source_word: δράκοντος
  choice: Drachen
  rationale: »Drache« entspricht dem Erzählzusammenhang und der üblichen Wiedergabe von δράκων; »Schlange« wäre hier unnötig abschwächend.
- source_word: φαγὼν
  choice: Als der Drache sie gefressen hatte
  rationale: Das Aoristpartizip wird als vorzeitige temporale Handlung wiedergegeben; »fressen« ist für ein Tier idiomatisch.
- source_word: διερράγη
  choice: barst er auseinander
  rationale: Das Verb bezeichnet ein heftiges Aufreißen oder Bersten. Die Formulierung erhält die dramatische Wirkung.
- source_word: τὰ σεβάσματα ὑμῶν
  choice: was ihr verehrt
  rationale: Die substantivierte Form bezeichnet das, was ehrfürchtig verehrt oder angebetet wird. Die deutsche Formulierung bleibt breit und lässt die Ironie des Zusammenhangs wirken, ohne ausdrücklich »Götzen« einzutragen.
theological_decisions:
- issue: Wiedergabe von τὰ σεβάσματα ὑμῶν im polemischen Zusammenhang der Götterverehrung
  choice: was ihr verehrt
  alternative: eure Götzen; eure Heiligtümer; eure Verehrungsgegenstände
  rationale: Der griechische Ausdruck bezeichnet allgemein verehrte oder kultisch angebetete Dinge. »Was ihr verehrt« bewahrt diese Bedeutungsbreite und die polemische Spannung, ohne die wertende Deutung durch »Götzen« ausdrücklich vorwegzunehmen.
translation_notes:
  register: Moderne, gut verständliche und zugleich würdige Erzählsprache. Kürzere deutsche Sätze vermeiden eine schwerfällige Reihung. »Barst« erhält den kraftvollen Ton des griechischen Verbs; das Pronomen »er« bezieht sich eindeutig auf den Drachen.
