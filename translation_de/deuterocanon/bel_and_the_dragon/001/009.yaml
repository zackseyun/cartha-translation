translation:
  language: de
  text: Für diesen Aufwand werdet ihr sterben; wenn ihr aber zeigt, dass Bel sie verzehrt, wird Daniel sterben, weil er gegen Bel gelästert hat. Und[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der griechische Text endet hier mit „Und“; der Satz wird im nächsten Vers fortgesetzt.
    reason: Das ungewöhnliche offene Versende folgt der Versabgrenzung der griechischen Quelle.
lexical_decisions:
- source_word: δαπάνην ταύτην
  choice: für diesen Aufwand
  rationale: δαπάνη bezeichnet den Aufwand beziehungsweise die Kosten für Bels tägliche Versorgung. Die Wendung setzt einen im vorigen Vers begonnenen Satz fort; „für diesen Aufwand“ gibt den Bezug im Deutschen natürlich wieder.
- source_word: ἀποθανεῖσθε
  choice: werdet ihr sterben
  rationale: Das Futur formuliert hier eine gerichtliche Todesandrohung. Die Wiedergabe ist klar und modern, ohne das altertümliche „sollt ihr sterben“.
- source_word: δείξητε
  choice: zeigt
  rationale: Das Verb bedeutet „zeigen“ oder „nachweisen“. „Zeigt“ bleibt eng am griechischen Wortlaut und passt zur geforderten Beweisführung.
- source_word: κατεσθίει αὐτά
  choice: die Gaben verzehrt
  rationale: κατεσθίω bezeichnet ein vollständiges oder kräftiges Verzehren; αὐτά verweist auf die zuvor genannten Speisegaben. Die ausdrückliche Wiederaufnahme als „die Gaben“ ist im deutschen Versfragment verständlicher als ein isoliertes Pronomen.
- source_word: ἐβλασφήμησεν εἰς τὸν Βήλ
  choice: Bel gelästert hat
  rationale: βλασφημέω bezeichnet hier die aus Sicht der Sprecher frevelhafte Schmähung einer Gottheit. Die idiomatische deutsche Verbindung „jemanden lästern“ bewahrt den religiösen Anklagecharakter, ohne Bels Göttlichkeit zu bestätigen.
- source_word: καὶ
  choice: Und
  rationale: Das abschließende καὶ verbindet den Satz mit dem folgenden Vers. Es wird trotz des offenen Satzendes nicht ausgelassen.
theological_decisions:
- issue: βλασφημέω im Zusammenhang mit einer heidnischen Gottheit
  choice: Bel gelästert hat
  alternative: gegen Bel gelästert hat
  rationale: Die Formulierung gibt die religiöse Anklage aus der Perspektive der Sprecher wieder. Sie bezeichnet Bel dadurch nicht aus Sicht des Erzählers als wirklichen Gott und löst die Spannung des Textes nicht auf.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Vers beginnt und endet als Satzfragment, weil die überlieferte Versgrenze mitten durch den fortlaufenden griechischen Satz verläuft.
