lexical_decisions:
- source_word: ἀναβοήσας
  choice: er rief
  rationale: Das Aoristpartizip bezeichnet einen kräftigen Ausruf. Die finite Reihung mit »und« entspricht natürlichem Deutsch und bewahrt die Intensität zusammen mit »mit lauter Stimme«.
- source_word: φωνῇ μεγάλῃ
  choice: mit lauter Stimme
  rationale: Die geläufige Wendung gibt die hörbare Stärke ausdrucksvoll und zugleich quellennah wieder.
- source_word: Μέγας εἶ
  choice: Groß bist du
  rationale: Die Voranstellung von »Groß« bewahrt die Betonung und den feierlich-ausrufenden Ton des Griechischen.
- source_word: Κύριε
  choice: Herr
  rationale: In der Anrede an Gott ist »Herr« die sachgemäße und traditionelle deutsche Wiedergabe von κύριος.
- source_word: ὁ θεὸς
  choice: der Gott
  rationale: Der Artikel wird in der Apposition ausdrücklich wiedergegeben; »Herr, der Gott« bildet die griechische Struktur ab.
- source_word: τοῦ
  choice: des
  rationale: Der vorgelegte griechische Text endet mit dem Genitivartikel. »des« erhält diesen unvollständigen Anschluss, ohne den fehlenden Bezug aus dem Kontext zu ergänzen.
theological_decisions:
- issue: Wiedergabe von κύριος in der Anrede Gottes
  choice: Herr
  alternative: Gebieter
  rationale: Die Anrede gilt dem Gott Israels. »Herr« ist hier die natürliche Wiedergabe des göttlichen Titels und vermeidet eine unnötige Umdeutung.
- issue: Umgang mit dem am Genitivartikel τοῦ abbrechenden Quelltext
  choice: Den Satz als unvollständig stehen lassen
  alternative: Die mutmaßliche Fortsetzung aus dem Kontext ergänzen
  rationale: Die bereitgestellte Primärquelle bricht an dieser Stelle ab. Aus Gründen der Quellentreue wird keine nicht vorgelegte Fortsetzung ergänzt; eine Fußnote macht den Befund transparent.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die markierte Wortstellung »Groß bist du« erhält den feierlichen Nachdruck; die ansonsten natürliche Satzfügung vermeidet unnötig altertümliche Sprache.
