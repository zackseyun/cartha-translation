base_translation:
  language: en
  yaml_path: translation/deuterocanon/bel_and_the_dragon/001/034.yaml
  text: And an angel of the Lord said to Habakkuk[a], “Carry the meal that you have to Babylon[b], to Daniel in the lions’ pit.”
translation:
  language: de
  text: 'Und ein Engel des Herrn sagte zu Habakuk: »Bring die Mahlzeit, die du hast, nach Babylon zu Daniel in die Löwengrube.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄγγελος Κυρίου
  choice: ein Engel des Herrn
  rationale: Vor ἄγγελος steht kein Artikel; daher ist die unbestimmte Wiedergabe vorzuziehen. Κυρίου bezeichnet hier den Gott Israels und wird mit „des Herrn“ wiedergegeben.
- source_word: Ἀμβακοὺμ
  choice: Habakuk
  rationale: Gebräuchliche deutsche Namensform des Propheten.
- source_word: Ἀπένεγκε
  choice: Bring
  rationale: Der Imperativ fordert Habakuk auf, die Mahlzeit zu Daniel zu transportieren. „Bring“ ist im Deutschen idiomatisch und gibt die durch die Zielangaben bestimmte Richtung natürlich wieder.
- source_word: τὸ ἄριστον
  choice: die Mahlzeit
  rationale: ἄριστον bezeichnet eine Mahlzeit, je nach Sprachstufe häufig am Morgen oder Mittag. „Mahlzeit“ vermeidet eine unbegründete Festlegung auf eine genaue Tageszeit.
- source_word: ὃ ἔχεις
  choice: die du hast
  rationale: Direkte und natürliche Wiedergabe des Relativsatzes ohne erläuternde Erweiterung.
- source_word: εἰς Βαβυλῶνα
  choice: nach Babylon
  rationale: Bei Städtenamen wird das zielgerichtete εἰς im Deutschen idiomatisch mit „nach“ wiedergegeben.
- source_word: εἰς τὸν λάκκον τῶν λεόντων
  choice: zu Daniel in die Löwengrube
  rationale: Der Ausdruck bezeichnet Daniels Aufenthaltsort. „Löwengrube“ ist die geläufige deutsche Entsprechung und bewahrt das konkrete Bild einer Grube, das λάκκος trägt.
theological_decisions:
- issue: Wiedergabe von κύριος in der Wendung ἄγγελος Κυρίου
  choice: Herr
  alternative: Gebieter
  rationale: In diesem Zusammenhang bezieht sich κύριος auf den Gott Israels. „Herr“ ist dafür die angemessene, etablierte deutsche Gottesbezeichnung.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch in würdigem Erzählstil. Die knappe Satzstruktur des Griechischen bleibt erhalten; auf eine zeitliche Präzisierung von ἄριστον wird bewusst verzichtet.
