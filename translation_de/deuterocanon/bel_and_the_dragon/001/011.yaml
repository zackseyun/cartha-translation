  to: 'Der König ging mit Daniel in das Haus Bels.[a] Da sagten die Priester Bels: »Sieh, wir gehen hinaus. Du aber, König, stell die Speisen hin, misch den Wein und stell ihn hin, und verschließ die Tür.«'
  rationale: Die einzige nötige Korrektur ersetzt „stell ihn dazu“ durch „stell ihn hin“. Dadurch bleibt die Anweisung, den gemischten Wein aufzustellen, klar und idiomatisch, ohne eine im griechischen Text nicht ausdrücklich enthaltene Zuordnung zu den Speisen einzutragen. Text und Fußnotenanker bleiben vollständig strukturell gültig.
