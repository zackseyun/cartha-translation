base_translation:
  language: en
  yaml_path: translation/deuterocanon/bel_and_the_dragon/001/011.yaml
  text: The king went with Daniēl into the house of Bel. And the priests of Bel said, “Look, we are going outside. But you, O king, set out the food, and after mixing the wine, set it out, and shut the door.”
translation:
  language: de
  text: 'Der König ging mit Daniel in das Haus Bels.[a] Da sagten die Priester Bels: »Sieh, wir gehen hinaus. Du aber, König, stell die Speisen hin, misch den Wein und stell ihn hin, und verschließ die Tür.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »in den Tempel Bels«. Wörtlich steht im Griechischen »in das Haus Bels«; damit ist hier sein Heiligtum gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ βασιλεὺς μετὰ Δανιὴλ
  choice: Der König ging mit Daniel
  rationale: Das im überlieferten Satz elliptische Bewegungsverb wird aus εἰς und dem Zusammenhang natürlich ergänzt; μετά mit Genitiv bezeichnet Begleitung. Die im Deutschen geläufige Namensform ist Daniel.
- source_word: εἰς τὸν οἶκον τοῦ Βήλ
  choice: in das Haus Bels
  rationale: οἶκος bedeutet wörtlich „Haus“ und bezeichnet hier Bels Heiligtum. Die formnahe Wiedergabe bewahrt das kultische Bild; eine Fußnote nennt die kontextuelle Alternative.
- source_word: Ἰδοὺ
  choice: Sieh
  rationale: Die Aufmerksamkeitspartikel wird als natürliche, zugleich würdige Aufforderung wiedergegeben.
- source_word: ἡμεῖς ἀποτρέχομεν ἔξω
  choice: wir gehen hinaus
  rationale: ἀποτρέχω kann ein Fortlaufen ausdrücken; hier steht funktional das Verlassen des Raumes im Vordergrund. „Hinausgehen“ vermeidet eine unbegründete Betonung der Geschwindigkeit.
- source_word: σύ δέ, βασιλεῦ
  choice: Du aber, König
  rationale: Die betonte Anrede erhält den Kontrast zwischen den hinausgehenden Priestern und dem Handeln des Königs.
- source_word: παράθες τὰ βρώματα
  choice: stell die Speisen hin
  rationale: παρατίθημι bezeichnet das Vorsetzen oder Bereitstellen; βρώματα ist ein Plural für Essbares und wird hier passend mit „Speisen“ wiedergegeben.
- source_word: τὸν οἶνον κεράσας θές
  choice: misch den Wein und stell ihn dazu
  rationale: κεράσας bezeichnet das damals übliche Mischen beziehungsweise Zubereiten des Weins; θές fordert anschließend dessen Aufstellen. Die koordinierte deutsche Form gibt die Handlungsfolge klar wieder, ohne die Partizipialkonstruktion unnatürlich nachzubilden.
- source_word: ἀπόκλεισον τὴν θύραν
  choice: verschließ die Tür
  rationale: ἀποκλείω bedeutet, einen Zugang zu schließen oder abzusperren. „Verschließen“ ist stärker als bloßes „Schließen“, behauptet aber kein ausdrücklich genanntes Schloss.
theological_decisions:
- issue: Kultische Bedeutung von οἶκος τοῦ Βήλ
  choice: Haus Bels
  alternative: Tempel Bels / Heiligtum Bels
  rationale: Obwohl sachlich ein Tempel oder Heiligtum gemeint ist, bewahrt „Haus“ die konkrete Ausdrucksweise des griechischen Textes und vermeidet eine unnötige interpretierende Ersetzung.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Direkte Rede ist knapp und imperativisch gehalten; archaische Anredeformen werden vermieden.
