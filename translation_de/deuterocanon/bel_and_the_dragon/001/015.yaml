lexical_decisions:
- source_word: οἱ δὲ ἱερεῖς
  choice: Doch die Priester
  rationale: δέ kennzeichnet hier die Fortführung der Erzählung mit leichtem Gegensatz; „doch“ gibt diese Nuance natürlich wieder. ἱερεῖς bedeutet „Priester“.
- source_word: ἦλθον τὴν νύκτα
  choice: kamen in der Nacht
  rationale: ἦλθον ist der narrative Aorist von ἔρχομαι; der Akkusativ τὴν νύκτα bezeichnet den Zeitpunkt beziehungsweise Zeitraum. „Kamen in der Nacht“ ist nah am Griechischen und im modernen Deutsch idiomatisch.
- source_word: κατὰ τὸ ἔθος αὐτῶν
  choice: wie es ihr Brauch war
  rationale: ἔθος bezeichnet eine wiederkehrende Gewohnheit oder einen Brauch. Die gewählte Formulierung ist natürlich und bewahrt den Sinn der griechischen Wendung.
- source_word: καὶ αἱ γυναῖκες
  choice: und die Frauen
  rationale: γυναῖκες kann je nach Zusammenhang allgemein „Frauen“ oder spezifisch „Ehefrauen“ bedeuten. Die vorliegende Formulierung legt keine der beiden Bedeutungen eindeutig fest; daher bleibt die offenere Wiedergabe „Frauen“ im Haupttext.
