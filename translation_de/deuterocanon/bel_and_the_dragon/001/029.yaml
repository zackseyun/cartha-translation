base_translation:
  language: en
  yaml_path: translation/deuterocanon/bel_and_the_dragon/001/029.yaml
  text: And they came to the king and said[a], “Hand Daniel over to us[b]; otherwise we will kill you and your household.”
translation:
  language: de
  text: 'Da kamen sie zum König und sagten: »Liefere uns Daniel aus[a]; sonst töten wir dich und dein Haus[b].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Übergib uns Daniel.«'
    reason: lexical_alternative
  - marker: b
    text: Mit »Haus« kann hier die Hausgemeinschaft oder Familie des Königs gemeint sein, nicht nur das Gebäude.
    reason: lexical_alternative
lexical_decisions:
- source_word: Παράδος
  choice: Liefere … aus
  rationale: Der Aoristimperativ von παραδίδωμι verlangt, Daniel in ihre Gewalt zu übergeben. »Ausliefern« gibt diese Forderung im modernen Deutschen klar und nachdrücklich wieder.
- source_word: ἡμῖν
  choice: uns
  rationale: Der Dativ bezeichnet ausdrücklich die Empfänger der verlangten Auslieferung.
- source_word: τὸν Δανιήλ
  choice: Daniel
  rationale: Gebräuchliche deutsche Namensform.
- source_word: εἰ δὲ μή
  choice: sonst
  rationale: Die knappe deutsche Formulierung bewahrt den Charakter eines Ultimatums.
- source_word: ἀποκτενοῦμέν
  choice: töten wir
  rationale: Die schlichte Wiedergabe des Futurs von ἀποκτείνω vermeidet sowohl rechtliche als auch moralisch wertende Zusatzbedeutungen.
- source_word: σε
  choice: dich
  rationale: Singularisches Akkusativpronomen in der direkten Anrede an den König.
- source_word: τὸν οἶκόν σου
  choice: dein Haus
  rationale: Die formnahe Wiedergabe erhält die mögliche Bedeutungsspanne von οἶκος zwischen Haus, Hausgemeinschaft und Familie; eine Fußnote erläutert den im Drohkontext wahrscheinlichen Personenbezug.
- source_word: ἐλθόντες πρὸς τὸν βασιλέα
  choice: Da kamen sie zum König
  rationale: Das Partizip wird als finites Verb wiedergegeben, sodass die Abfolge der Handlungen natürlich und klar bleibt.
theological_decisions:
- issue: Umfang von οἶκος in der Drohung
  choice: dein Haus
  alternative: deine Hausgemeinschaft / deine Familie
  rationale: οἶκος kann sowohl das Haus als auch die dazugehörigen Menschen bezeichnen. Die Übersetzung bewahrt diese Mehrdeutigkeit, während die Fußnote deutlich macht, dass die Todesdrohung im Zusammenhang wahrscheinlich dem königlichen Haushalt beziehungsweise der Familie gilt.
translation_notes:
  register: Modernes, klares und zugleich würdiges Standarddeutsch. Die direkte Drohung bleibt knapp und ungeschönt; »dein Haus« wahrt die Mehrdeutigkeit des griechischen οἶκος.
