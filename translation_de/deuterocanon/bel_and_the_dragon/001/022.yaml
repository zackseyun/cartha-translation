  naturalness: „Und der König tötete sie, übergab Bel an Daniel und zerstörte ihn und seinen Tempel“ ist modernes, knappes Standarddeutsch und bildet die griechische Parataxe natürlich ab. Das Semikolon und das isolierte „er“ sind nicht erforderlich.
  terminology: „Bel“, „tötete“, „übergab“, „zerstörte“ und „Tempel“ sind angemessen. Die maskulinen Pronomen bewahren die griechische grammatische Form; eine knappe Anmerkung kann erläutern, dass im Kontext auch das Götterbild mitgemeint sein kann, ohne den Bezug festzulegen.
