  text: And the king killed them[a], and he gave Bel over to Daniel[b], and he destroyed him and his temple.
translation:
  language: de
  text: Und der König tötete sie, übergab Bel an Daniel und zerstörte ihn und seinen Tempel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπέκτεινεν
  choice: tötete
  rationale: Das Aoristverb bezeichnet unmittelbar das Töten. „Tötete“ ist klar, modern und fügt anders als „ließ töten“ keine ausdrücklich beauftragten Vollstrecker hinzu.
- source_word: ἔδωκεν ... ἔκδοτον
  choice: übergab
  rationale: Die Verbindung aus „geben“ und ἔκδοτον bezeichnet die Auslieferung beziehungsweise Übergabe in die Gewalt eines anderen. „Übergab“ gibt dies im Deutschen knapp und natürlich wieder.
- source_word: τὸν Βὴλ
  choice: Bel
  rationale: Der Name beziehungsweise Titel der Gottheit wird in der geläufigen deutschen Form „Bel“ wiedergegeben.
- source_word: κατέστρεψεν
  choice: zerstörte
  rationale: Das Verb bezeichnet Vernichtung oder Zerstörung und kann hier sowohl auf Bel als auch auf den Tempel bezogen werden. „Zerstörte“ deckt beide Objekte ohne unnötige Präzisierung ab.
- source_word: τὸ ἱερὸν
  choice: Tempel
  rationale: ἱερόν bezeichnet hier die Kultstätte Bels; „Tempel“ ist dafür die verständlichste und sachlich passende deutsche Bezeichnung.
- source_word: αὐτὸν ... αὐτοῦ
  choice: ihn ... seinen
  rationale: Die griechischen Pronomen sind maskulin und beziehen sich grammatisch auf den maskulinen Namen Βήλ. Die maskuline Wiedergabe bewahrt die Form und die mögliche Personifizierung des griechischen Textes.
theological_decisions:
- issue: Ob Bel mit einem persönlichen oder sächlichen Pronomen bezeichnet wird
  choice: „ihn“ und „seinen“ entsprechend den maskulinen griechischen Pronomen
  alternative: „es“ und „seinen/dessen“, wenn Bel ausschließlich als Götterbild verstanden wird
  rationale: Der griechische Text verwendet ausdrücklich maskuline Formen. Eine sächliche Wiedergabe würde Bel bereits interpretierend auf das materielle Götterbild festlegen; die maskuline Form wahrt die sprachliche und theologische Spannung.
- issue: Wer Bel und den Tempel zerstört
  choice: Das mehrdeutige „er“ bleibt im Haupttext stehen
  alternative: Daniel ausdrücklich als Handelnden nennen; oder den König ausdrücklich als fortgesetztes Subjekt verstehen
  rationale: Im Griechischen ist kein neues Subjekt genannt. Der König ist das zuvor ausdrücklich genannte Subjekt, während Daniel unmittelbar davor steht und dem Erzählzusammenhang nach als Handelnder verstanden werden kann. Eine eindeutige Namensnennung würde diese syntaktische Offenheit auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper parataktischer Satzführung nach dem griechischen Text. Das Semikolon macht den letzten Handlungsschritt lesbar, ohne dessen nicht ausdrücklich genanntes Subjekt festzulegen.
