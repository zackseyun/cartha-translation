translation_notes:
  register: Modernes, würdiges ErzählDeutsch. Die langen griechischen καί-Verknüpfungen werden zur besseren Lesbarkeit auf zwei Sätze verteilt. Das möglicherweise emphatische αὐτός wird nicht eigens mit »selbst« wiedergegeben, da es hier natürlich als Subjektfortführung verstanden werden kann.
