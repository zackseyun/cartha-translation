  yaml_path: translation/deuterocanon/bel_and_the_dragon/001/033.yaml
  text: And Habakkuk the prophet was in Judea[a], and he had cooked a stew and crumbled bread into a bowl[c][b], and was going to the field to bring it to the reapers.
translation:
  language: de
  text: Der Prophet Habakuk war in Judäa[a]. Er hatte ein gekochtes Gericht zubereitet, Brotlaibe in eine Schüssel zerkrümelt und war auf dem Weg zum Feld, um es den Schnittern zu bringen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Juda«. Das griechische Ἰουδαία kann die Region Judäa bezeichnen, in manchen Zusammenhängen aber auch Juda.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀμβακοὺμ
  choice: Habakuk
  rationale: Die im Deutschen übliche Namensform des Propheten.
- source_word: ὁ προφήτης
  choice: der Prophet
  rationale: Der Artikel kennzeichnet Habakuk als den bekannten Propheten.
- source_word: ἐν τῇ Ἰουδαίᾳ
  choice: in Judäa
  rationale: Die griechische Bezeichnung meint hier am ehesten die Region Judäa; »Juda« bleibt lexikalisch möglich.
- source_word: ἥψησεν ἕψεμα
  choice: hatte ein Eintopfgericht gekocht
  rationale: Das Verb und sein verwandtes Substantiv bezeichnen das Kochen beziehungsweise etwas Gekochtes; »Eintopfgericht« ist natürlich, ohne bestimmte Zutaten vorauszusetzen.
- source_word: ἐνέθρυψεν ἄρτους
  choice: Brotlaibe … gebrochen
  rationale: Bewahrt den Plural ἄρτους und gibt das Zerteilen des Brotes wieder, ohne eine feinere Konsistenz als im Griechischen festzulegen.
- source_word: εἰς σκάφην
  choice: in eine Schüssel
  rationale: Im Zusammenhang mit zubereitetem Essen bezeichnet σκάφη plausibel ein schüsselartiges Gefäß.
- source_word: τὸ πεδίον
  choice: das Feld
  rationale: Der Bezug auf die Schnitter macht »Feld« zur naheliegenden kontextuellen Entsprechung.
- source_word: ἀπενέγκαι
  choice: um es … zu bringen
  rationale: Der Infinitiv bezeichnet den Zweck seines Weges; das Pronomen nimmt die zubereitete Speise auf.
- source_word: τοῖς θερισταῖς
  choice: den Schnittern
  rationale: Eine präzise und im biblischen Erzählregister verständliche Bezeichnung für Menschen bei der Getreideernte.
