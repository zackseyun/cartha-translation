base_translation:
  language: en
  yaml_path: translation/deuterocanon/bel_and_the_dragon/001/005.yaml
  text: Why do you not bow down to Bel? But he said[a], “Because I do not revere idols made by hands, but the living God, who created heaven and”
translation:
  language: de
  text: '„Warum wirfst du dich nicht vor Bel nieder?“ Er aber sagte: „Weil ich keine von Menschenhand gemachten Götzen verehre, sondern den lebendigen Gott, der den Himmel geschaffen hat und[a]“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der für diesen Vers vorliegende griechische Quelltext bricht mitten im Satz nach „und“ (καί) ab. Deshalb bleibt der Satz hier unvollendet; fehlende Wörter werden nicht aus dem Zusammenhang ergänzt.
    reason: textual_variant
lexical_decisions:
- source_word: προσκυνεῖς
  choice: wirfst du dich … nieder
  rationale: Die Wendung bewahrt den körperlichen und zugleich religiösen Charakter der ehrerbietigen Unterwerfung, ohne ausschließlich die innere Haltung mit „anbeten“ zu bezeichnen.
- source_word: σέβομαι
  choice: verehre
  rationale: Das Verb bezeichnet religiöse Verehrung. „Verehren“ unterscheidet Daniels Aussage sprachlich von προσκυνέω und passt natürlich zur Zurückweisung der Götzen.
- source_word: εἴδωλα χειροποίητα
  choice: von Menschenhand gemachte Götzen
  rationale: „Götzen“ gibt im kultischen Zusammenhang die polemische Bedeutung von εἴδωλα wieder; „von Menschenhand gemacht“ betont den Gegensatz zum lebendigen Schöpfer.
- source_word: τὸν ζῶντα θεόν
  choice: den lebendigen Gott
  rationale: Die bestimmte Form bezeichnet im Gegensatz zu den Götzen den bekannten wahren Gott; die traditionelle Formulierung ist zugleich klar und natürlich.
- source_word: τὸν κτίσαντα τὸν οὐρανὸν
  choice: der den Himmel geschaffen hat
  rationale: Das Partizip kennzeichnet Gott durch sein Schöpfungshandeln. „Geschaffen“ wahrt den theologischen Gehalt von κτίζω, und „den Himmel“ entspricht dem griechischen Singular.
theological_decisions:
- issue: Unvollständiger Satz im bereitgestellten griechischen Quelltext
  choice: Den Vers mit „und“ abbrechen lassen
  alternative: Ein Satzglied wie „die Erde“ aus dem Zusammenhang ergänzen
  rationale: Der vorgelegte griechische Text endet mit καί. Die unfertige Satzkonstruktion wird daher transparent bewahrt, statt nicht vorhandenen Wortlaut stillschweigend zu ergänzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede bleibt klar und mündlich; „von Menschenhand gemacht“ erhält den biblischen Gegensatz zwischen menschengemachten Götzen und dem lebendigen Schöpfer. Der Fußnotenmarker steht unmittelbar am erhaltenen Satzende.
