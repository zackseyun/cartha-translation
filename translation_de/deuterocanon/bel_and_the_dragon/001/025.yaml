  yaml_path: translation/deuterocanon/bel_and_the_dragon/001/025.yaml
  text: And Daniel said[a], “I will bow down to the Lord my God, because he is the living God.”
translation:
  language: de
  text: 'Und Daniel sagte: »Vor dem Herrn, meinem Gott, will ich mich niederwerfen[a], denn er ist der lebendige Gott.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »will ich anbeten«. Das griechische Verb kann sowohl das Niederwerfen als auch die Anbetung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκυνήσω
  choice: will ich mich niederwerfen
  rationale: Das Verb bezeichnet eine ehrerbietige körperliche Niederwerfung und kann zugleich »anbeten« bedeuten. »Mich niederwerfen« bewahrt die konkrete Handlung und lässt ihre kultische Bedeutung im Zusammenhang erkennen.
- source_word: Κυρίῳ τῷ θεῷ μου
  choice: vor dem Herrn, meinem Gott
  rationale: Der Dativ bezeichnet den Empfänger der Huldigung. Bei »sich niederwerfen« ist im Deutschen die Verbindung mit »vor« natürlich; »dem Herrn, meinem Gott« gibt die zusammengehörige griechische Wortgruppe klar wieder.
- source_word: ὅτι
  choice: denn
  rationale: Die Konjunktion führt die Begründung für Daniels Niederwerfung ein. »Denn« entspricht dem kausalen Zusammenhang in würdigem, natürlichem Deutsch.
- source_word: θεὸς ζῶν
  choice: der lebendige Gott
  rationale: Die prädikative Wendung wird idiomatisch als »der lebendige Gott« wiedergegeben und betont den Gegensatz zu einem leblosen Götzen.
theological_decisions:
- issue: Wiedergabe von κύριος als Bezeichnung für Israels Gott
  choice: der Herr
  alternative: Herr
  rationale: »Der Herr, mein Gott« ist eine natürliche und quellgetreue Wiedergabe der griechischen Formulierung, ohne zusätzliche Deutung einzutragen.
- issue: Ob προσκυνέω ausdrücklich mit »anbeten« wiederzugeben ist
  choice: mich niederwerfen
  alternative: anbeten
  rationale: Die gewählte Form bewahrt den körperlichen Bildgehalt des griechischen Verbs. Dass die Handlung hier Anbetung ausdrückt, ergibt sich aus ihrem Empfänger und aus Daniels Bekenntnis zum lebendigen Gott; die mögliche direkte Wiedergabe steht in der Fußnote.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede ist flüssig formuliert; die konkrete Bildlichkeit von προσκυνέω und die darin liegende Mehrdeutigkeit zwischen Niederwerfung und Anbetung bleiben erhalten.
