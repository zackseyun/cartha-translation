  text: But you[a], O king, give me authority, and I will kill the dragon without sword or staff. And the king said, “I give it to you.”
translation:
  language: de
  text: 'Du aber, König, gib mir Vollmacht, und ich werde den Drachen ohne Schwert und Stab töten. Da sagte der König: „Ich gebe sie dir.“[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ich gewähre sie dir“, nämlich die Vollmacht, um die Daniel gebeten hatte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σὺ δέ
  choice: Du aber
  rationale: δέ kennzeichnet einen Übergang oder Gegensatz; das ausdrücklich gesetzte σὺ hebt den Angesprochenen hervor. „Du aber“ bewahrt beides in natürlichem Deutsch.
- source_word: βασιλεῦ
  choice: König
  rationale: Der griechische Vokativ wird durch die direkte Anrede „König“ wiedergegeben. Ein höfischer Titel wie „Majestät“ wäre eine nicht im Ausgangstext enthaltene Ausgestaltung.
- source_word: δός μοι ἐξουσίαν
  choice: gib mir Vollmacht
  rationale: ἐξουσία bezeichnet hier die vom König verliehene Befugnis, gegen den Drachen vorzugehen. „Vollmacht“ wahrt diesen amtlichen Sinn deutlicher als „Macht“ und stärker als bloße „Erlaubnis“.
- source_word: ἀποκτενῶ
  choice: ich werde … töten
  rationale: Das Futur bezeichnet schlicht die angekündigte Tötung; „töten“ ist klar und modern.
- source_word: τὸν δράκοντα
  choice: den Drachen
  rationale: δράκων bezeichnet in dieser Erzählung das von den Babyloniern verehrte Lebewesen. „Drache“ ist die etablierte und kontextgerechte Wiedergabe.
- source_word: ἄνευ μαχαίρας καὶ ῥάβδου
  choice: ohne Schwert und Stab
  rationale: ἄνευ bezieht sich auf beide Substantive. „Schwert“ und „Stab“ geben die gewöhnlichen Bedeutungen von μαχαίρα und ῥάβδος formal und würdig wieder, ohne den Stab ausdrücklich als Keule festzulegen.
- source_word: Δίδωμί σοι
  choice: Ich gebe sie dir
  rationale: Das im Griechischen ausgelassene Objekt ist die zuvor erbetene ἐξουσία. Das feminine Pronomen „sie“ nimmt im Deutschen „Vollmacht“ knapp und eindeutig wieder auf.
