  yaml_path: translation/deuterocanon/bel_and_the_dragon/001/007.yaml
  text: Does he drink every day? And Daniel said[a], laughing, “Do not be deceived, O king; for this one is clay inside and bronze outside, and never—”
translation:
  language: de
  text: 'Trinkt er jeden Tag? Und Daniel sagte lachend: „Lass dich nicht täuschen, König! Denn dieser ist innen aus Ton, außen aber aus Bronze und nicht—“[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der für diesen Vers bereitgestellte griechische Text bricht nach „und nicht“ (καὶ οὐ) ab; der Satz ist daher in der hier verwendeten Vorlage unvollständig.
    reason: textual_variant
lexical_decisions:
- source_word: πίνει καθʼ ἑκάστην ἡμέραν
  choice: Trinkt er jeden Tag?
  rationale: Die griechische Frageform und die distributive Zeitangabe werden in natürlichem modernem Deutsch wiedergegeben.
- source_word: γελάσας
  choice: lachend
  rationale: Das Aoristpartizip beschreibt Daniels begleitende Haltung beim Sprechen; „lachend“ ist knapp und wahrt die Aussage stärker als „lächelnd“.
- source_word: Μὴ πλανῶ
  choice: Lass dich nicht täuschen
  rationale: Die isoliert überlieferte Form ist sprachlich schwierig; im Zusammenhang warnt Daniel den König davor, sich durch den vermeintlich lebendigen Gott täuschen zu lassen.
- source_word: βασιλεῦ
  choice: König
  rationale: Der Vokativ wird als direkte, würdige Anrede wiedergegeben; ein zusätzliches „o“ wäre im heutigen Deutsch unnötig altertümlich.
- source_word: οὗτος
  choice: dieser
  rationale: Das Demonstrativpronomen bleibt ohne erklärenden Zusatz wie „Gott“ oder „Götze“, da ein solches Substantiv im griechischen Text nicht steht.
- source_word: ἔσωθέν ἐστι πηλός
  choice: ist innen aus Ton
  rationale: Die Formulierung gibt sowohl die innere Lage als auch den Baustoff idiomatisch und genau wieder.
- source_word: ἔξωθεν δὲ χαλκός
  choice: außen aber aus Bronze
  rationale: „Aber“ bildet den ausdrücklichen Gegensatz zwischen innerem Ton und äußerer Metallhülle ab; χαλκός bezeichnet hier sachgerecht Bronze beziehungsweise Kupfermetall.
- source_word: καὶ οὐ
  choice: und nicht —
  rationale: Der bereitgestellte griechische Text bricht unmittelbar nach der Verneinung ab. Die unvollständige deutsche Wendung bildet diesen Befund transparent ab, ohne eine Fortsetzung zu ergänzen.
theological_decisions:
- issue: Unvollständiger Schluss des bereitgestellten griechischen Textes
  choice: Nur den vorhandenen Wortlaut übersetzen und den Abbruch sichtbar stehen lassen
  alternative: Die in umfassenderen Textausgaben oder aus dem Zusammenhang bekannte Fortsetzung ergänzen
  rationale: Die Vorlage endet mit καὶ οὐ. Eine Ergänzung würde über den ausdrücklich bereitgestellten Quellenwortlaut hinausgehen und die textliche Unvollständigkeit verdecken.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte König Anrede bleibt respektvoll, ohne das heute stark altertümelnde „o König“. Der abrupte Satzschluss ist absichtlich bewahrt.
