base_translation:
  language: en
  yaml_path: translation/deuterocanon/bel_and_the_dragon/001/012.yaml
  text: And seal it with your ring. Then[a], when you come in the morning, if you do not find everything eaten by Bel, we will die—or else Daniel, who is lying against us.
translation:
  language: de
  text: Und versiegle sie mit deinem Ring. Wenn du dann am Morgen kommst und nicht alles von Bel aufgezehrt findest, werden wir sterben – oder Daniel, der falsche Anschuldigungen gegen uns erhebt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „der gegen uns lügt“; die griechische Wendung kann auch bedeuten, dass jemand andere fälschlich beschuldigt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σφράγισον
  choice: versiegle
  rationale: Der Imperativ bezeichnet das Verschließen beziehungsweise Sichern mit einem Siegel; „versiegle“ ist im Zusammenhang präzise und natürlich.
- source_word: τῷ δακτυλίῳ σου
  choice: mit deinem Ring
  rationale: δάκτυλιος bezeichnet einen Ring, der hier zum Siegeln verwendet wird. Der Zusammenhang macht die Funktion als Siegelring deutlich, ohne dass sie ausdrücklich ergänzt werden muss.
- source_word: ἐλθὼν πρωὶ
  choice: wenn du dann am Morgen kommst
  rationale: Das Partizip wird als temporaler Nebensatz wiedergegeben; πρωί bedeutet hier „am Morgen“.
- source_word: πάντα βεβρωμένα
  choice: alles … aufgezehrt
  rationale: Das perfekte Passivpartizip bezeichnet den Zustand, dass alles verzehrt worden ist. „Aufgezehrt“ passt zum Opfermahl und bewahrt die resultative Aussage.
- source_word: ὑπὸ τοῦ Βήλ
  choice: von Bel
  rationale: Die Agensangabe wird direkt wiedergegeben; der griechische Text fügt keine Bezeichnung wie „Gott“ hinzu.
- source_word: ἀποθανούμεθα
  choice: werden wir sterben
  rationale: Das Futur wird unmittelbar und in modernem Deutsch wiedergegeben.
- source_word: ὁ ψευδόμενος καθʼ ἡμῶν
  choice: der falsche Anschuldigungen gegen uns erhebt
  rationale: ψεύδομαι mit κατά kann ein gegen andere gerichtetes Lügen beziehungsweise falsches Beschuldigen ausdrücken. Die Formulierung gibt den anklagenden Zug idiomatisch wieder.
theological_decisions:
- issue: Wiedergabe des Vorwurfs gegen Daniel
  choice: der falsche Anschuldigungen gegen uns erhebt
  alternative: der gegen uns lügt; der Lügen über uns verbreitet
  rationale: Der Zusammenhang hat einen anklagenden Zug, ohne zwingend ein förmliches Gerichtsverfahren zu bezeichnen. Die Hauptfassung ist natürliches Deutsch; die Fußnote bewahrt die wörtlichere und weniger festgelegte Möglichkeit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Siegelvorgang und die Wenn-dann-Struktur bleiben klar; der Gegensatz „wir … oder Daniel“ wird durch den Gedankenstrich hervorgehoben.
