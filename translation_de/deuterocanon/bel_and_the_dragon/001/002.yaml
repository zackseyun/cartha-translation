  text: And Cyrus the Persian received his kingdom[a], and Daniel was a companion of the king and honored above all his friends.
translation:
  language: de
  text: Und Kyros, der Perser, empfing sein Königreich. Daniel war ein Gefährte des Königs und angesehener als alle Freunde des Königs[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Hofleute“ oder „Vertraute“; an einem Königshof kann „Freunde“ die engen Gefolgsleute des Königs bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρέλαβεν
  choice: empfing
  rationale: Das Verb bezeichnet hier, dass Kyros in den Besitz der Königsherrschaft gelangte. „Empfing“ bleibt nahe am Griechischen und legt nicht fest, ob er sie erbte, übernahm oder auf andere Weise erlangte.
- source_word: τὴν βασιλείαν αὐτοῦ
  choice: sein Königreich
  rationale: βασιλεία kann Königreich, Herrschaft oder Königtum bedeuten. „Sein Königreich“ bewahrt die im Zusammenhang mögliche sachliche und personale Mehrdeutigkeit und entspricht natürlichem Deutsch.
- source_word: συνβιωτής
  choice: ein Gefährte
  rationale: Das seltene Wort bezeichnet wörtlich jemanden, der mit einem anderen zusammenlebt, hier aber wohl einen engen persönlichen Vertrauten am Königshof. „Gefährte“ gibt die enge Verbundenheit wieder, ohne ein bloßes gemeinsames Wohnen zu behaupten.
- source_word: ἔνδοξος
  choice: angesehener
  rationale: Im höfischen Zusammenhang bezeichnet ἔνδοξος eine Person, die hohes Ansehen oder besondere Ehre genießt. Der deutsche Komparativ bildet die durch ὑπέρ ausgedrückte Rangordnung natürlich ab.
- source_word: ὑπὲρ πάντας τοὺς φίλους αὐτοῦ
  choice: als alle seine Freunde
  rationale: φίλοι bedeutet wörtlich „Freunde“, kann im hellenistischen Hofmilieu jedoch auch die engen königlichen Gefolgsleute oder Hofangehörigen bezeichnen. Der Haupttext wahrt die Grundbedeutung; die Fußnote nennt die höfische Nuance.
theological_decisions:
- issue: Höfische Bedeutung von φίλοι
  choice: Freunde
  alternative: Hofleute oder königliche Vertraute
  rationale: Die wörtliche Bedeutung soll im Haupttext sichtbar bleiben. Zugleich kann φίλοι in königlichem Kontext eine annähernd titulare Bezeichnung für enge Angehörige des Hofes sein; diese Möglichkeit wird nicht dogmatisch festgelegt, sondern in der Fußnote bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper erzählerischer Syntax. „Gefährte“ hält den seltenen griechischen Ausdruck erkennbar, während „angesehener als“ die höfische Rangordnung idiomatisch wiedergibt.
