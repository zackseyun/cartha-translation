  text: and they consumed them completely. And it happened that[a], when those men had gone out, the king set the food before Bel, and Daniel commanded his young servants, and they brought ashes and scattered them over the whole temple in the presence of the king alone. Then, after going out, they shut the door and sealed it with the king’s signet ring, and went away.
translation:
  language: de
  text: und verzehrten sie vollständig. Als jene Männer hinausgegangen waren, stellte der König Bel die Speisen hin. Daniel befahl seinen jungen Dienern, Asche zu bringen, und sie streuten sie im ganzen Tempel aus, allein vor den Augen des Königs.[a] Dann gingen sie hinaus, verschlossen die Tür, versiegelten sie mit dem Siegelring des Königs und gingen fort.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wobei nur der König anwesend war“. Der griechische Ausdruck hebt hervor, dass das Ausstreuen der Asche allein in Gegenwart des Königs geschah.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διόλου καὶ ἀνήλουν αὐτά
  choice: und verzehrten sie vollständig
  rationale: Das Adverb διόλου betont die vollständige Beseitigung; ἀναλόω bezeichnet hier im Zusammenhang mit Speisen deren Verzehr. Das vorangestellte „und“ bewahrt den fragmentarischen Anschluss an den vorhergehenden Vers.
- source_word: παρέθηκεν τὰ βρώματα τῷ Βήλ
  choice: stellte der König Bel die Speisen hin
  rationale: παρατίθημι bezeichnet das Vorsetzen oder Hinstellen von Speisen. „Speisen“ wahrt den Opfermahl-Kontext und klingt würdiger als das allgemeinere „Essen“.
- source_word: ἐπέταξεν Δανιὴλ τοῖς παιδαρίοις αὐτοῦ
  choice: Daniel befahl seinen jungen Dienern
  rationale: ἐπιτάσσω ist ein ausdrückliches Befehlen. παιδάρια kann junge Männer oder junge Diener bezeichnen; die Wiedergabe hält Alter und dienende Funktion zusammen.
- source_word: ἤνεγκαν τέφραν, καὶ κατέσποραν ὅλον τὸν ναόν
  choice: Asche zu bringen, und sie streuten sie im ganzen Tempel aus
  rationale: τέφρα wird im Deutschen natürlich als Massennomen „Asche“ wiedergegeben. κατασπείρω bezeichnet das flächige Ausstreuen; „im ganzen Tempel“ ist idiomatisch und vermeidet die missverständliche Vorstellung, die Tempelaußenflächen seien bestreut worden.
- source_word: ἐνώπιον τοῦ βασιλέως μόνου
  choice: allein vor den Augen des Königs
  rationale: Die Formulierung gibt die exklusive Anwesenheit beziehungsweise Zeugenschaft des Königs wieder, ohne den griechischen Bezug von μόνου unnötig zu überpräzisieren.
- source_word: ἐσφραγίσαντο ἐν τῷ δακτυλίῳ τοῦ βασιλέως
  choice: versiegelten sie mit dem Siegelring des Königs
  rationale: Der königliche Ring dient als amtliches Siegel; „Siegelring“ macht diese Funktion im modernen Deutschen unmittelbar verständlich.
