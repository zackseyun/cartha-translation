  text: Not even one. And Daniel laughed[a], and held the king back from going inside, and said, “Now look at the floor, and take notice.”
translation:
  language: de
  text: 'Nicht einmal einer. Da lachte Daniel, hielt den König davon ab, hineinzugehen, und sagte: »Sieh dir doch den Boden an und achte genau darauf[a].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »erkenne« oder »nimm wahr«; gemeint ist, dass der König genau hinsieht und wahrnimmt, was der Boden zeigt.'
