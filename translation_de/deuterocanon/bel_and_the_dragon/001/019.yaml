lexical_decisions:
- source_word: οὐδὲ εἷς
  choice: Nicht ein Einziger
  rationale: Die knappe, nachdrückliche Verneinung bleibt ebenso elliptisch und unvermittelt wie im Griechischen.
- source_word: ἐγέλασεν
  choice: lachte
  rationale: Gibt die Grundbedeutung wieder, ohne Daniels Reaktion als Spott zu deuten oder zu einem bloßen Lächeln abzuschwächen.
- source_word: ἐκράτησεν
  choice: hielt … davon ab
  rationale: Bringt den verhindernden Sinn der Konstruktion natürlich zum Ausdruck, ohne unnötig Gewalt anzudeuten.
- source_word: τοῦ μὴ εἰσελθεῖν αὐτὸν ἔσω
  choice: hineinzugehen
  rationale: Die Infinitivkonstruktion bezeichnet hier das Eintreten, das Daniel verhindert.
- source_word: Ἴδε δὴ
  choice: Sieh dir doch … an
  rationale: Der Imperativ fordert zum Hinsehen auf; »doch« vermittelt die nachdrückliche, situationsbezogene Partikel δή in natürlichem Deutsch.
- source_word: τὸ ἔδαφος
  choice: den Boden
  rationale: Im Innenraum des Heiligtums ist »Boden« kontextuell passend und weniger allgemein als »Erdboden«.
- source_word: γνῶθι
  choice: achte genau darauf
  rationale: Im Zusammenhang fordert Daniel den König auf, den Boden aufmerksam wahrzunehmen und daraus eine Erkenntnis zu gewinnen; die Fußnote bewahrt die wörtlichere Bedeutung.
