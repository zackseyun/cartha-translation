lexical_decisions:
- source_word: ΚΑΙ
  choice: Und
  rationale: Bewahrt als schlichter Erzählanschluss den parataktischen Fluss des Griechischen, ohne eine nicht ausdrücklich bezeichnete zeitliche Abfolge einzutragen.
- source_word: ὁ βασιλεὺς Ἀστυάγης
  choice: König Astyages
  rationale: Im Deutschen steht der Herrschertitel vor einem Eigennamen idiomatisch ohne Artikel; der Name wird in seiner üblichen Form wiedergegeben.
- source_word: προσετέθη
  choice: wurde versammelt
  rationale: Gibt im Zusammenhang mit »zu seinen Vätern« die biblische Todeswendung natürlich und würdevoll wieder, ohne sie zum bloßen Aussagegehalt »starb« zu verflachen.
- source_word: πρὸς τοὺς πατέρας αὐτοῦ
  choice: zu seinen Vätern
  rationale: Bewahrt das konkrete Bild und den biblischen Anklang des griechischen Ausdrucks; »Vorfahren« wäre erklärender, aber weniger formnah.
theological_decisions:
- issue: Wiedergabe der Todeswendung προσετέθη πρὸς τοὺς πατέρας αὐτοῦ
  choice: wurde zu seinen Vätern versammelt
  alternative: wurde seinen Vätern hinzugefügt; starb
  rationale: Die gewählte Fassung erhält die traditionelle biblische Bildsprache und ihre mögliche Verbindung mit Tod und Zugehörigkeit zu den Vorfahren. Sie vermeidet sowohl eine unnatürlich wörtliche Formulierung als auch die vollständige Auflösung des Bildes.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt bewusst schlicht und bibelnah; die Fußnote erläutert die heute nicht überall unmittelbar verständliche Todeswendung.
