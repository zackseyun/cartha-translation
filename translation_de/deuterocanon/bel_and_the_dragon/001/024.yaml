base_translation:
  language: en
  yaml_path: translation/deuterocanon/bel_and_the_dragon/001/024.yaml
  text: And the king said to Daniel[a], “You cannot say that this is not a living god; and bow down to him.”
translation:
  language: de
  text: 'Und der König sagte zu Daniel: „Du kannst nicht sagen, dass dieser kein lebendiger Gott ist; und wirf dich vor ihm nieder.[a]“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „bete ihn an“. Das griechische Verb kann sowohl das Niederwerfen als Huldigung als auch die Anbetung bezeichnen, besonders wenn die Handlung einer Gottheit gilt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐ δύνασαι εἰπεῖν
  choice: Du kannst nicht sagen
  rationale: Die Wendung gibt die verneinte Form von δύναμαι mit Infinitiv direkt wieder und lässt offen, ob der König von Unvermögen, Unzulässigkeit oder rhetorischer Unmöglichkeit spricht.
- source_word: οὐκ ἔστιν οὗτος θεὸς ζῶν
  choice: dass dieser kein lebender Gott ist
  rationale: „Dieser“ bewahrt den demonstrativen Bezug von οὗτος; „ein lebender Gott“ gibt die prädikative, nicht als Hoheitstitel gebrauchte Wendung θεὸς ζῶν aus der Perspektive des Königs wieder.
- source_word: προσκύνησον αὐτῷ
  choice: wirf dich vor ihm nieder
  rationale: Die konkrete Gebärde des προσκυνέω wird verständlich wiedergegeben, ohne die im Kontext naheliegende religiöse Bedeutung durch die eindeutige Übersetzung „anbeten“ festzuschreiben.
- source_word: βασιλεὺς
  choice: der König
  rationale: Der bestimmte Artikel bezeichnet den aus dem Zusammenhang bekannten König.
- source_word: τῷ Δανιήλ
  choice: zu Daniel
  rationale: Der Dativ bezeichnet den Adressaten der Rede; der Personenname wird in seiner geläufigen deutschen Form wiedergegeben.
- source_word: καὶ προσκύνησον
  choice: und wirf dich … nieder
  rationale: Das einfache καί wird als „und“ wiedergegeben, ohne eine im Griechischen nicht ausdrücklich markierte Folgebeziehung wie „also“ oder „deshalb“ hinzuzufügen.
theological_decisions:
- issue: Ob θεὸς ζῶν als vertrauter Titel des wahren Gottes wiederzugeben ist
  choice: lebender Gott
  alternative: der lebendige Gott
  rationale: Der heidnische König bezeichnet das verehrte Wesen als Gott. Die unbestimmte und kontextbezogene Wiedergabe vermeidet, seine Aussage mit dem biblischen Bekenntnistitel „der lebendige Gott“ gleichzusetzen, und bewahrt die erzählerische Ironie.
- issue: Ob προσκύνησον ausdrücklich als Anbetung übersetzt werden soll
  choice: wirf dich vor ihm nieder
  alternative: bete ihn an
  rationale: Das Verb kann sowohl die körperliche Niederwerfung als auch religiöse Verehrung bezeichnen. Die Hauptübersetzung hält beide Aspekte offen; der religiöse Sinn ergibt sich aus dem Bezug auf einen vermeintlichen Gott.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der etwas nachdrückliche Anschluss mit „und“ folgt bewusst dem einfachen griechischen καί und vermeidet eine zusätzlich eingetragene Folgerung. Die direkte Rede bleibt klar und natürlich; die religiöse Mehrdeutigkeit von προσκυνέω wird durch Haupttext und Fußnote erhalten.
