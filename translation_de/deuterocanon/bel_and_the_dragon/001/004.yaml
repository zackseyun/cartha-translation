  text: and forty sheep and six measures of wine. And the king revered him and went every day to bow down to him[a], but Daniel bowed down to his God. And the king said to him,
translation:
  language: de
  text: 'und vierzig Schafe und sechs Maß Wein. Der König verehrte ihn und ging jeden Tag hin, um sich vor ihm niederzuwerfen[a]; Daniel aber warf sich vor seinem Gott nieder. Da sagte der König zu ihm:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »um ihn anzubeten«; das griechische Verb kann je nach Zusammenhang sowohl das Niederwerfen als auch das Anbeten bezeichnen. Dasselbe Verb steht anschließend für Daniels Verhalten gegenüber seinem Gott.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πρόβατα τεσσεράκοντα
  choice: vierzig Schafe
  rationale: πρόβατα bezeichnet allgemein Schafe beziehungsweise Kleinvieh; »Schafe« ist hier die natürliche und hinreichend genaue Wiedergabe.
- source_word: οἴνου μετρηταὶ ἕξ
  choice: sechs Maß Wein
  rationale: μετρητής ist ein Flüssigkeitsmaß. »Maß« bewahrt die Mengenangabe, ohne eine unsichere Umrechnung in eine moderne Einheit vorzunehmen.
- source_word: ἐσέβετο αὐτόν
  choice: verehrte ihn
  rationale: σέβομαι kann Verehrung oder kultische Anbetung bezeichnen. »Verehrte« wahrt die Abgrenzung zum folgenden προσκυνέω, ohne den kultischen Zusammenhang abzuschwächen.
- source_word: ἐπορεύετο καθʼ ἑκάστην ἡμέραν
  choice: ging jeden Tag hin
  rationale: Der Imperfekt beschreibt eine regelmäßig wiederholte Handlung; »ging jeden Tag hin« gibt dies natürlich wieder.
- source_word: προσκυνεῖν αὐτῷ
  choice: um sich vor ihm niederzuwerfen
  rationale: προσκυνέω kann sowohl die körperliche Niederwerfung als auch Anbetung bezeichnen. Die konkrete Formulierung erhält diese Bedeutungsweite und passt zur parallelen Handlung Daniels.
- source_word: προσεκύνει τῷ θεῷ αὐτοῦ
  choice: warf sich vor seinem Gott nieder
  rationale: Dieselbe deutsche Wendung wie beim vorherigen προσκυνέω erhält den erzählerischen Kontrast zwischen dem König und Daniel.
- source_word: ὁ βασιλεὺς
  choice: der König
  rationale: Standardentsprechung für βασιλεύς.
- source_word: Δανιήλ
  choice: Daniel
  rationale: Gebräuchliche deutsche Namensform.
- source_word: καὶ εἶπεν αὐτῷ ὁ βασιλεὺς
  choice: 'Da sagte der König zu ihm:'
  rationale: Das einleitende καί wird im fortlaufenden deutschen Erzählen natürlich mit »Da« wiedergegeben; der Doppelpunkt zeigt an, dass die Rede im folgenden Vers fortgesetzt wird.
theological_decisions:
- issue: Ob die kultischen Verben ausdrücklich mit »anbeten« wiederzugeben sind
  choice: Für σέβομαι steht »verehren«, für beide Vorkommen von προσκυνέω dieselbe Wendung »sich niederwerfen«.
  alternative: »anbeten« für die Handlung des Königs gegenüber Bel und für Daniels Handlung gegenüber Gott
  rationale: Der griechische Text verwendet zunächst σέβομαι und danach zweimal προσκυνέω. Die gewählte Wiedergabe erhält sowohl den Unterschied zwischen den beiden Verben als auch die bewusste Parallelität der beiden Vorkommen von προσκυνέω und lässt dessen kultische Bedeutungsweite offen.
translation_notes:
  register: Moderne, würdige Standardsprache. Der Vers beginnt als Fortsetzung einer Aufzählung und endet mit der Einleitung einer im nächsten Vers fortgesetzten Rede. »Maß« bleibt bewusst ohne moderne Mengenangabe; die parallele Formulierung für προσκυνέω bewahrt die literarische und theologische Spannung.
