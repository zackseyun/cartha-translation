base_translation:
  language: en
  yaml_path: translation/deuterocanon/bel_and_the_dragon/001/003.yaml
  text: And there was an idol among the Babylonians whose name was Bel, and for it twelve artabas of fine flour were spent each day.
translation:
  language: de
  text: Bei den Babyloniern gab es ein Götzenbild namens Bel. Für dieses wurden täglich zwölf Artaben Feinmehl aufgewendet.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Eine Artabe war ein antikes Hohlmaß, dessen genaue Größe je nach Zeit und Region variierte.
    reason: Die Maßeinheit ist heutigen Lesern meist unbekannt, und eine exakte moderne Umrechnung wäre wegen historischer Schwankungen irreführend.
lexical_decisions:
- source_word: εἴδωλον
  choice: Götzenbild
  rationale: Bezeichnet hier ein kultisch verehrtes Bild; „Götzenbild“ gibt den religiös-kritischen Sinn im natürlichen modernen Deutsch wieder.
- source_word: τοῖς Βαβυλωνίοις
  choice: bei den Babyloniern
  rationale: Drückt idiomatisch aus, dass das Bild im babylonischen Gemeinwesen beziehungsweise Kult vorhanden war.
- source_word: ἐδαπανῶντο εἰς αὐτόν
  choice: für dieses wurden … aufgewendet
  rationale: Bewahrt die passive Form und den Zweckbezug der Ausgaben, ohne das Götzenbild unnötig zu personifizieren.
- source_word: σεμιδάλεως
  choice: Feinmehl
  rationale: Übliche und sachlich passende Wiedergabe für feines Weizenmehl.
- source_word: ἀρτάβαι
  choice: Artaben
  rationale: Der antike Hohlmaßbegriff bleibt erhalten, weil sein genauer Umfang regional und zeitlich schwankte.
theological_decisions:
- issue: Bezeichnung Bels als εἴδωλον
  choice: Götzenbild
  alternative: Bildnis / Kultbild
  rationale: Die wertende religiöse Konnotation des griechischen Ausdrucks wird bewahrt, ohne darüber hinaus eine konfessionelle Deutung einzuführen.
translation_notes:
  register: Modernes, klares und würdiges Standarddeutsch. Die Satzteilung verbessert die Lesbarkeit, ohne Inhalt oder Erzählfolge zu verändern.
