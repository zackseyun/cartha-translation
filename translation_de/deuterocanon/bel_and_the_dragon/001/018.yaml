base_translation:
  language: en
  yaml_path: translation/deuterocanon/bel_and_the_dragon/001/018.yaml
  text: And it happened, when the doors were opened, that the king looked at the table and cried out with a loud voice, “Great are you, Bel, and there is no deceit with you.”
translation:
  language: de
  text: 'Und als die Türen geöffnet wurden, blickte der König auf den Tisch und rief mit lauter Stimme: »Groß bist du, Bel, und bei dir gibt es keinen Betrug!«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ ἐγένετο
  choice: Und als
  rationale: Die griechische Erzählungsformel leitet das folgende Geschehen ein. Im Deutschen lässt sie sich zusammen mit der Zeitangabe natürlich durch »Und als« wiedergeben, ohne das schwerfällige »Und es geschah«.
- source_word: ἅμα τῷ ἀνοῖξαι τὰς θύρας
  choice: als die Türen geöffnet wurden
  rationale: Gibt die temporale Konstruktion direkt und idiomatisch wieder. »Sobald« wäre möglich, würde die Unmittelbarkeit jedoch stärker hervorheben.
- source_word: ἐπιβλέψας
  choice: blickte ... auf
  rationale: Bewahrt die schlichte visuelle Handlung, ohne sie als prüfendes Untersuchen zu deuten.
- source_word: τὴν τράπεζαν
  choice: den Tisch
  rationale: τράπεζα bezeichnet hier wörtlich den Tisch; dass darauf Opfergaben lagen, ergibt sich aus dem Kontext und wird nicht in den Ausdruck eingetragen.
- source_word: ἐβόησεν φωνῇ μεγάλῃ
  choice: rief mit lauter Stimme
  rationale: Gibt sowohl das kräftige Rufen als auch die ausdrücklich genannte laute Stimme in natürlichem Deutsch wieder.
- source_word: Μέγας εἶ
  choice: Groß bist du
  rationale: Die vorangestellte Betonung von »groß« bleibt in einer gehobenen, aber verständlichen deutschen Wortstellung erhalten.
- source_word: Βήλ
  choice: Bel
  rationale: Der Name der Gottheit wird in der im Deutschen gebräuchlichen Form »Bel« wiedergegeben.
- source_word: οὐκ ἔστιν παρὰ σοὶ δόλος
  choice: bei dir gibt es keinen Betrug
  rationale: »Bei dir« bildet παρὰ σοὶ eng ab; »Betrug« trifft δόλος im Kontext der heimlichen Täuschung durch die Priester.
theological_decisions:
- issue: Die Aussage des Königs über Bel könnte als Zustimmung des Erzählers missverstanden werden.
  choice: Die Behauptung bleibt unverändert als direkte Rede des Königs stehen.
  alternative: Eine erläuternde Paraphrase wie »wie der König meinte« oder eine abschwächende Distanzierung.
  rationale: Der griechische Text gibt den Ausruf unmittelbar wieder. Die unkommentierte direkte Rede erhält die dramatische Ironie und enthält keine erzählerische Bestätigung der Aussage.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur ist gegenüber der griechischen Erzählungsformel leicht geglättet, während der feierliche Ausruf und die ausdrückliche Lautstärke bewahrt bleiben.
