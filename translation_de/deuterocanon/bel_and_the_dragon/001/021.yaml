  source_fidelity: 'Die Grundbedeutungen sind zutreffend wiedergegeben: Der König wird zornig, lässt die Priester mitsamt ihren Frauen und Kindern festnehmen, und diese zeigen ihm die verborgenen Zugänge. Die beiden griechischen Imperfekta εἰσεπορεύοντο und ἐδαπάνων bezeichnen jedoch die frühere wiederholte Praxis. Die deutschen Plusquamperfektformen „waren ... hineingegangen“ und „verzehrt hatten“ legen eher abgeschlossene Vorzeitigkeit nahe und bilden den habitualen Aspekt nicht optimal ab.'
