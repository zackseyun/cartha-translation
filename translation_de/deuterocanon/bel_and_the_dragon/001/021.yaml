    text: 'Oder: »verborgenen Türen«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀργισθεὶς
  choice: wurde zornig
  rationale: Das aoristische Partizip bezeichnet den Eintritt des Zorns; die Formulierung ist natürlich und bewahrt die erzählerische Abfolge.
- source_word: συνέλαβεν
  choice: ließ ... festnehmen
  rationale: Im gerichtlichen Zusammenhang bezeichnet das Verb eine obrigkeitliche Festnahme. Die kausative Formulierung passt idiomatisch zum Handeln des Königs, ohne zu behaupten, er habe sie eigenhändig ergriffen.
- source_word: τὰς γυναῖκας καὶ τὰ τέκνα αὐτῶν
  choice: ihren Frauen und Kindern
  rationale: Die Verbindung mit den Kindern und das Possessivpronomen sprechen dafür, γυναῖκας relational als Ehefrauen zu verstehen; modernes Deutsch verwendet dafür natürlich »Frauen«.
- source_word: τὰς κρυπτὰς θύρας
  choice: die geheimen Türen
  rationale: Die Türen dienten als nicht offen bekannter Zugang. »Geheim« gibt κρυπτός konkret wieder; »verborgen« bleibt als echte lexikalische Alternative in der Fußnote erhalten.
- source_word: διʼ ὧν εἰσεπορεύοντο
  choice: durch die sie immer hineingegangen waren
  rationale: Der Imperfekt bezeichnet die wiederholte frühere Praxis. »Immer« vermittelt diesen gewohnheitsmäßigen Aspekt in natürlichem Deutsch.
- source_word: ἐδαπάνων
  choice: verzehrt hatten
  rationale: δαπανάω bedeutet grundsätzlich aufbrauchen oder verbrauchen; bezogen auf das, was auf dem Tisch lag, ist »verzehren« präzise, ohne »Speisen« ausdrücklich in den Text einzutragen.
- source_word: τὰ ἐπὶ τῇ τραπέζῃ
  choice: was auf dem Tisch lag
  rationale: Die substantivierte Wendung bezeichnet die dort befindlichen Dinge. Diese Wiedergabe ist idiomatisch und vermeidet die kontextuell naheliegende, aber nicht ausdrücklich genannte Ergänzung »Speisen«.
theological_decisions:
- issue: Bedeutung von γυναῖκας in der Haushaltsaufzählung
  choice: Frauen im Sinn von Ehefrauen
  alternative: Frauen ohne ausdrückliche relationale Festlegung
  rationale: Die Zuordnung durch αὐτῶν und die gemeinsame Nennung mit den Kindern legt die eheliche Beziehung nahe, ohne eine weitergehende theologische Aussage einzutragen.
- issue: Rechtscharakter von συνέλαβεν
  choice: ließ ... festnehmen
  alternative: ergriff
  rationale: Der König übt nach der Aufdeckung des Betrugs obrigkeitliche Gewalt aus. »Festnehmen« macht diesen Erzählzusammenhang verständlich, während »ergreifen« auch nur körperliches Packen bedeuten könnte.
translation_notes:
  register: Modernes, würdiges Erzähldeutsch. »Samt« fasst die betroffene Familiengruppe knapp zusammen; die Plusquamperfektformen machen deutlich, dass das wiederholte Eindringen und Verzehren der nun erfolgten Enthüllung vorauslag.
