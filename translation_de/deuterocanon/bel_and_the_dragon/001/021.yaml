  terminology: „ließ ... festnehmen“ gibt συνέλαβεν im erzählten obrigkeitlich-strafenden Kontext angemessen wieder. „Frauen und Kindern“ ist für γυναῖκας καὶ τέκνα αὐτῶν sachgerecht; „geheime Türen“ ist als konkrete Wiedergabe von κρυπτὰς θύρας vertretbar. Die Fußnote bietet mit „verborgenen Türen“ eine passende lexikalische Alternative.
