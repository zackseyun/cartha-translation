  text: Then the king became angry and arrested the priests and their wives and children[b][a], and they showed him the secret doors through which they used to go in and consume what was on the table.
translation:
  language: de
  text: Da wurde der König zornig und ließ die Priester samt ihren Frauen und Kindern festnehmen. Sie zeigten ihm die geheimen Türen[a], durch die sie immer hineingingen und verzehrten, was auf dem Tisch lag.
  philosophy: optimal-equivalence
  footnotes:
