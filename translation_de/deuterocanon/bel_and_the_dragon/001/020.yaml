  text: Whose footprints are these? And the king said, “I see the footprints of men and women and children.”
translation:
  language: de
  text: '»Wessen Fußspuren sind das?« Und der König sagte: »Ich sehe die Fußspuren von Männern, Frauen und Kindern.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τίνος
  choice: Wessen
  rationale: Der interrogative Genitiv fragt nach der Zugehörigkeit beziehungsweise Identität; »Wessen« ist im Deutschen direkt und idiomatisch.
- source_word: ἴχνη
  choice: Fußspuren
  rationale: Gemeint sind sichtbare, von Füßen hinterlassene Abdrücke; »Fußspuren« ist hier genauer als das allgemeinere »Spuren«.
- source_word: ταῦτα
  choice: das
  rationale: Das griechische Demonstrativpronomen verweist auf die sichtbaren Fußspuren; im natürlichen deutschen Fragesatz ist der singularische Sammelbezug »das« idiomatisch.
- source_word: Ὁρῶ
  choice: Ich sehe
  rationale: Die präsentische Wahrnehmungsaussage wird schlicht und quellennah wiedergegeben.
- source_word: ἀνδρῶν
  choice: Männern
  rationale: ἀνήρ bezeichnet hier erwachsene männliche Personen, nicht Menschen allgemein.
- source_word: γυναικῶν
  choice: Frauen
  rationale: In der Aufzählung bezeichnet γυνή Frauen allgemein, nicht speziell Ehefrauen.
- source_word: παιδίων
  choice: Kindern
  rationale: Das Wort bezeichnet Kinder; »Kindern« ist klar und vermeidet eine unbelegte nähere Altersbestimmung.
