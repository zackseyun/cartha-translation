  text: Sie aber warfen ihn in die Löwengrube, und er war sechs Tage dort.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δὲ
  choice: Sie aber
  rationale: δέ setzt die Erzählung mit einer leicht gegensätzlichen oder weiterführenden Nuance fort; die Nachstellung von „aber“ gibt dies im Deutschen knapp und würdig wieder.
- source_word: ἔβαλον
  choice: warfen
  rationale: Der Aorist von βάλλω bezeichnet hier eine entschlossene, gewaltsame Handlung; „warfen“ bewahrt diese Kraft besser als „brachten“ oder „setzten“.
- source_word: εἰς τὸν λάκκον τῶν λεόντων
  choice: in die Löwengrube
  rationale: λάκκος bezeichnet eine Grube oder Vertiefung. Das natürliche deutsche Kompositum „Löwengrube“ bleibt näher am griechischen Ausdruck als „Löwenhöhle“ und ist ohne erklärende Fußnote verständlich.
- source_word: ἦν ἐκεῖ
  choice: blieb … dort
  rationale: Wörtlich steht „war dort“; im erzählenden Zusammenhang gibt „blieb dort“ den fortdauernden Aufenthalt idiomatisch wieder, ohne zusätzliche Sachinformation einzutragen.
- source_word: ἡμέρας ἕξ
  choice: sechs Tage
  rationale: Der Akkusativ bezeichnet die zeitliche Dauer. Im Deutschen ist „blieb sechs Tage dort“ natürlich und macht die Dauer bereits eindeutig.
