  text: Daniel said to the king[a], “Let it be according to your word.” And there were seventy priests of Bel, besides women and children[c][b]; and he came in.
translation:
  language: de
  text: 'Daniel sagte zum König: »Es geschehe nach deinem Wort.«[a] Die Priester Bels aber waren siebzig, Frauen und Kinder nicht mitgezählt.[b] Und er kam.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Es geschehe nach deinem Wort.« Gemeint ist Daniels Zustimmung zu dem Vorschlag des Königs.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »außer Frauen und Kindern«; diese sind in der Zahl siebzig nicht enthalten.'
    reason: lexical_alternative
  - marker: c
    text: Der griechische Vers endet mit »und er kam«; wohin er kam, ergibt sich erst aus dem folgenden Zusammenhang.
    reason: cross_reference
lexical_decisions:
- source_word: Γινέσθω κατὰ τὸ ῥῆμά σου
  choice: Es geschehe nach deinem Wort
  rationale: Der Imperativ Γινέσθω drückt Daniels Zustimmung aus; die formnahe Wendung bewahrt zugleich den feierlichen Ton und gibt ῥῆμα als gesprochenes Wort wieder, ohne es zu einem ausdrücklichen Befehl zu verstärken.
- source_word: ἱερεῖς τοῦ Βὴλ
  choice: die Priester Bels
  rationale: ἱερεῖς bezeichnet kultische Priester; der Genitiv wird im Deutschen natürlich mit »Bels« wiedergegeben.
- source_word: ἑβδομήκοντα
  choice: siebzig
  rationale: Direkte Wiedergabe der Kardinalzahl.
- source_word: ἐκτὸς γυναικῶν καὶ τέκνων
  choice: Frauen und Kinder nicht mitgezählt
  rationale: ἐκτός schließt Frauen und Kinder aus der Zahl siebzig aus. Die gewählte Formulierung ist im heutigen Deutsch eindeutig und natürlich.
- source_word: καὶ ἦλθεν
  choice: Und er kam …
  rationale: ἦλθεν ist der Aorist von ἔρχομαι und nennt in diesem Vers weder Ziel noch ausdrückliches Eintreten. Die Auslassungspunkte machen den im überlieferten Versabbruch offenen Anschluss sichtbar, ohne ein Ziel hinzuzufügen.
