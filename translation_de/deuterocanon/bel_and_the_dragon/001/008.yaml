lexical_decisions:
- source_word: βέβρωκεν οὐδέποτε
  choice: hat noch nie gegessen
  rationale: Das Perfekt βέβρωκεν bezeichnet eine abgeschlossene Handlung mit fortwirkender Bedeutung; zusammen mit οὐδέποτε wird dies im modernen Deutsch natürlich mit „hat noch nie gegessen“ wiedergegeben.
- source_word: θυμωθεὶς
  choice: Da wurde … zornig
  rationale: Das Aoristpartizip bezeichnet den eintretenden Zorn als Begleitumstand der folgenden Handlung. „wurde zornig“ bewahrt diesen ingressiven Sinn, ohne ihn zu „geriet in Wut“ zu verstärken.
- source_word: ὁ βασιλεὺς
  choice: der König
  rationale: Direkte und übliche Wiedergabe des Titels.
- source_word: ἐκάλεσεν
  choice: rief
  rationale: καλέω kann „rufen“ oder „herbeirufen“ bedeuten. „rief seine Priester“ ist natürlich und bleibt nahe am Wortlaut.
- source_word: τοὺς ἱερεῖς αὐτοῦ
  choice: seine Priester
  rationale: ἱερεῖς bezeichnet Priester; αὐτοῦ wird als einfaches Possessivpronomen wiedergegeben, ohne eine im Text nicht ausdrücklich genannte kultische Zuordnung näher zu bestimmen.
- source_word: εἶπεν αὐτοῖς
  choice: sagte zu ihnen
  rationale: Formale und zugleich idiomatische Wiedergabe der griechischen Redeformel.
- source_word: Ἐὰν μὴ εἴπητέ μοι
  choice: Wenn ihr mir nicht sagt
  rationale: Die Bedingung mit ἐὰν μή und Konjunktiv wird transparent und direkt wiedergegeben.
- source_word: τίς ὁ κατεσθίων τὴν
  choice: wer die
  rationale: Der vorgelegte griechische Vers bricht nach dem Artikel τὴν ab. Im Deutschen muss das Partizip κατεσθίων wegen der Wortstellung bis zur Fortsetzung zurückgestellt werden; daher bleibt „wer die“ bewusst unvollendet.
