lexical_decisions:
- source_word: σε
  choice: dich
  rationale: Akkusativ der zweiten Person Singular; das Wort schließt die Rede des vorhergehenden Verses ab.
- source_word: ἀναστὰς
  choice: stand auf
  rationale: Das Aoristpartizip bezeichnet das Aufstehen vor der anschließenden Handlung; im Deutschen wird die Handlungsfolge natürlich mit einem finiten Verb wiedergegeben.
- source_word: ἔφαγεν
  choice: aß
  rationale: Schlichter narrativer Aorist von ἐσθίω; das einfache Präteritum gibt ihn unmittelbar wieder.
- source_word: ὁ δὲ ἄγγελος τοῦ θεοῦ
  choice: der Engel Gottes aber
  rationale: ἄγγελος bezeichnet hier aufgrund des Erzählzusammenhangs ein himmlisches Wesen. Das nachgestellte „aber“ gibt δέ wieder, ohne einen starken Gegensatz zu behaupten.
- source_word: ἀπε-
  choice: ging fort—
  rationale: Der überlieferte Auszug bricht mitten im Wort ab. Der sichtbare Wortanfang weist auf ein Verb des Fortgehens; Gedankenstrich und Fußnote bewahren die Unvollständigkeit des Quellenbefunds.
theological_decisions:
- issue: Wiedergabe von ἄγγελος bei übernatürlichem Handeln
  choice: Engel
  alternative: Bote
  rationale: Die Erzählung stellt die Gestalt als himmlisches, in Gottes Auftrag handelndes Wesen dar; „Engel“ entspricht daher dem unmittelbaren Sinn, ohne zusätzliche konfessionelle Deutung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der fragmentarische Versanfang „dich“ bleibt erhalten, weil er den vorhergehenden Satz abschließt. Der Quellenabbruch am Versende wird sichtbar markiert und nicht stillschweigend ergänzt.
