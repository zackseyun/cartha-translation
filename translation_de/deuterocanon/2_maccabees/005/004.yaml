translation:
  language: de
  text: Daher nahmen alle an, die Erscheinung werde zum Guten ausschlagen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Alle waren der Ansicht, die Erscheinung sei zum Guten.“ Das Griechische lässt sowohl eine eher statische Wiedergabe („sei“) als auch eine stärker auf das Ergebnis bezogene („werde zum Guten ausschlagen“) zu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διό
  choice: Daher
  rationale: Die folgernde Konjunktion stellt den ursächlichen Zusammenhang mit dem zuvor geschilderten Himmelszeichen knapp und natürlich her.
- source_word: πάντες
  choice: alle
  rationale: Die Bezeichnung bezieht sich umfassend auf die im Zusammenhang vorausgesetzten Menschen, ohne den Personenkreis näher einzugrenzen.
- source_word: ἥξιουν
  choice: nahmen … an
  rationale: Das Imperfekt von ἀξιόω bezeichnet hier ein Dafürhalten oder eine Erwartung; „nahmen an“ passt zur Deutung des beobachteten Zeichens und legt den zeitlichen Aspekt nicht unnötig fest.
- source_word: ἐπ᾽ ἀγαθῷ
  choice: zum Guten
  rationale: Die Wendung bezeichnet eine günstige Bedeutung oder einen guten Ausgang, ohne genauer festzulegen, worin das Gute bestehen würde.
- source_word: τὴν ἐπιφάνειαν
  choice: die Erscheinung
  rationale: Gemeint ist das zuvor beschriebene sichtbare Phänomen. „Erscheinung“ ist im Deutschen natürlich und vermeidet eine unnötige theologische Technisierung.
- source_word: γενέσθαι
  choice: werde … ausschlagen
  rationale: Der Infinitiv kann hier resultativ verstanden werden. „Zum Guten ausschlagen“ gibt einen erwarteten günstigen Ausgang idiomatisch wieder, während die Fußnote die statischere Möglichkeit wahrt.
