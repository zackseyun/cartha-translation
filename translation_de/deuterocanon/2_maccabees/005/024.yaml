base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/005/024.yaml
  text: But he sent Apollonius[a], the chief polluter, with an army of twenty-two thousand, commanding him to slaughter all those in their prime and to sell the women and the younger ones.
translation:
  language: de
  text: Doch er schickte Apollonius, den Erzbeflecker, mit einem Heer von zweiundzwanzigtausend. Er befahl ihm, alle, die im besten Alter waren, abzuschlachten, die Frauen und die Jüngeren aber zu verkaufen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Gemeint ist im Zusammenhang wahrscheinlich: in die Sklaverei zu verkaufen. Im Griechischen steht jedoch nur „verkaufen“.'
    reason: lexikalische Alternative und kontextuelle Erläuterung
lexical_decisions:
- source_word: ἔπεμψεν
  choice: er schickte
  rationale: Das einfache Präteritum gibt den Aorist von πέμπω natürlich und sachlich wieder.
- source_word: μυσάρχην
  choice: den Anführer der Befleckung
  rationale: Das seltene, abwertende Wort bezeichnet seinem Wortlaut nach einen Anführer der Verunreinigung oder Befleckung. Die Wiedergabe bewahrt den polemischen Charakter, ohne daraus einen unbelegten neutralen Amtstitel zu machen.
- source_word: μετὰ στρατεύματος
  choice: mit einem Heer
  rationale: στράτευμα bezeichnet eine militärische Streitmacht; „Heer“ ist hier prägnant und dem hohen Erzählregister angemessen.
- source_word: δισμυρίους δὲ τοῖς δισχιλίοις
  choice: von zweiundzwanzigtausend
  rationale: Die griechische Formulierung zählt zwanzigtausend und zweitausend zusammen. „Mann“ wird nicht ergänzt, da es im Griechischen nicht ausdrücklich steht und „Heer von …“ im Deutschen verständlich ist.
- source_word: προστάξας
  choice: Er befahl ihm
  rationale: Der griechische Begleitumstand wird zur besseren Lesbarkeit als eigener deutscher Hauptsatz wiedergegeben; Apollonius bleibt eindeutig der Empfänger des Befehls.
- source_word: τοὺς ἐν ἡλικίᾳ πάντας
  choice: alle im besten Alter
  rationale: Die Wendung bezeichnet Menschen im vollen oder kräftigsten Lebensalter. Diese Fassung vermeidet die engeren, im Ausgangstext nicht ausdrücklich genannten Kategorien „Erwachsene“ oder „Wehrfähige“.
- source_word: κατασφάξαι
  choice: niederzumetzeln
  rationale: Das verstärkte Verb bezeichnet brutales Abschlachten und ist deutlich schärfer als ein neutrales „töten“.
- source_word: τὰς δὲ γυναῖκας
  choice: die Frauen
  rationale: Im Gegensatz zu den zuvor Genannten ist die allgemeine Bedeutung „Frauen“ gemeint; „Ehefrauen“ wäre unnötig verengt.
- source_word: τοὺς νεωτέρους
  choice: die Jüngeren
  rationale: Der Komparativ wird bewahrt und nicht vorschnell auf „Kinder“ oder „Jugendliche“ eingeengt.
- source_word: πωλεῖν
  choice: zu verkaufen
  rationale: Das Verb bedeutet unmittelbar „verkaufen“. Dass damit im Kriegskontext der Verkauf in die Sklaverei gemeint ist, wird in der Fußnote erläutert, aber nicht in den Haupttext eingetragen.
theological_decisions:
- issue: Soll die bei πωλεῖν naheliegende Versklavung im Haupttext ausdrücklich genannt werden?
  choice: zu verkaufen
  alternative: in die Sklaverei zu verkaufen
  rationale: Der historische Zusammenhang legt Versklavung nahe, doch das griechische Verb sagt lediglich „verkaufen“. Die knappere Fassung wahrt den Wortlaut; die wahrscheinliche Folge wird transparent in einer Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die seltene pejorative Bezeichnung μυσάρχης bleibt als „Anführer der Befleckung“ erkennbar. Der lange griechische Satz wird zur natürlichen deutschen Lesbarkeit in zwei Sätze gegliedert, ohne seine logischen Beziehungen zu verändern.
