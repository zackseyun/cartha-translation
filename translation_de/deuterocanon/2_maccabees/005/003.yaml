translation_notes:
  register: Moderner, würdiger Erzählstil. Die aneinandergereihte Struktur des griechischen Visionsberichts bleibt erkennbar, wird im Deutschen jedoch ohne wiederholtes „und“ vor jedem Glied flüssig gestaltet. Militärische Fachsprache wurde nur dort verwendet, wo sie allgemein verständlich ist.
