  text: and the brandishing of swords[a], and squadrons of cavalry drawn up, and attacks and counterattacks by both sides, and the movement of shields, and masses of spears, and the shooting of missiles, and the gleaming of golden ornaments[b], and all kinds of armor.
translation:
  language: de
  text: und das Zücken der Schwerter, in Schlachtordnung aufgestellte Reiterverbände, Angriffe und Vorstöße beider Seiten[a], die Bewegungen der Schilde, Mengen von Lanzen[b], das Abschießen von Geschossen, das Aufblitzen goldener Verzierungen und Rüstungen aller Art.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Überfälle beider Seiten“. Das griechische Wort kann stürmische Vorstöße, Angriffe oder Überfälle bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Der hier mit „Lanzen“ wiedergegebene griechische Ausdruck ist in diesem Zusammenhang schwer verständlich; möglicherweise sind allgemeiner Stangenwaffen oder ähnliche Kampfgeräte gemeint.
    reason: textual_variant
lexical_decisions:
- source_word: μαχαιρῶν σπασμούς
  choice: das Zücken der Schwerter
  rationale: σπασμός bezeichnet grundlegend ein Ziehen oder Herausziehen. „Zücken“ gibt die sichtbare Kampfhandlung natürlich und genauer wieder als ein bloßes „Aufblitzen“.
- source_word: ἴλας ἵππων διατεταγμένας
  choice: in Schlachtordnung aufgestellte Reiterverbände
  rationale: ἴλη bezeichnet eine Reiterabteilung, während διατεταγμένας ihre geordnete Aufstellung zum Kampf ausdrückt. „Reiterverbände“ ist verständlicher und weniger anachronistisch festgelegt als „Schwadronen“.
- source_word: προσβολὰς γινομένας
  choice: Angriffe
  rationale: προσβολή ist im militärischen Zusammenhang ein Angriff oder Ansturm; „Angriffe“ wahrt die allgemeine Bedeutung.
- source_word: καταδρομὰς ἑκατέρων
  choice: Vorstöße beider Seiten
  rationale: καταδρομή kann einen stürmischen Vorstoß, Angriff oder Überfall bezeichnen. „Vorstöße“ erhält die Bewegungsbedeutung, ohne den Ausdruck zwingend als Gegenangriff oder Plünderungszug festzulegen.
- source_word: ἀσπίδων κινήσεις
  choice: das Bewegen der Schilde
  rationale: κίνησις bedeutet Bewegung. Die neutrale Formulierung vermeidet die unbelegte Festlegung auf Schütteln oder Schwingen.
- source_word: καμάτων πλήθη
  choice: Mengen von Lanzen
  rationale: καμάτων ist an dieser Stelle schwierig und passt in seiner gewöhnlichen Bedeutung nicht ohne Weiteres in die Aufzählung von Kampfhandlungen und Ausrüstung. Im Kontext wird ein Bezug auf Stangenwaffen beziehungsweise Lanzen angenommen; die Unsicherheit wird in einer Fußnote offengelegt.
- source_word: βελῶν βολάς
  choice: das Abschießen von Geschossen
  rationale: βέλος bezeichnet allgemein ein Geschoss, etwa Pfeil oder Wurfgeschoss, und βολή dessen Wurf oder Schuss. Die Übersetzung bewahrt diese begriffliche Weite.
- source_word: χρυσέων κόσμων ἐκλάμψεις
  choice: das Aufblitzen goldener Verzierungen
  rationale: κόσμος kann Schmuck oder Verzierung bezeichnen, ἔκλαμψις ein Hervor- oder Aufblitzen. Im militärischen Bild sind goldene Verzierungen der Ausrüstung naheliegend, ohne dass der griechische Text sie näher bestimmt.
- source_word: παντοίους θωρακισμούς
  choice: Rüstungen aller Art
  rationale: θωρακισμός bezeichnet Panzerung oder Rüstung; παντοίους hebt deren Vielfalt hervor.
