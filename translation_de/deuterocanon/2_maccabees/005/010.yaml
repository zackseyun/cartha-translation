base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/005/010.yaml
  text: And after casting out a multitude unburied, he himself became unwept, and shared in no burial at all, nor in his ancestral tomb.
translation:
  language: de
  text: Und nachdem er eine Menge Menschen unbestattet hinausgeworfen hatte, wurde er selbst unbetrauert und hatte weder an irgendeiner Bestattung noch am Brauch seiner Väter Anteil.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: am väterlichen Gesetz; gemeint sein kann der überlieferte Bestattungsbrauch seiner Vorfahren.'
    reason: Bewahrt die Bedeutungsbreite von νόμος und macht transparent, dass der griechische Text von Gesetz oder Brauch, nicht ausdrücklich von einem Ahnengrab, spricht.
lexical_decisions:
- source_word: ἐκρίψας
  choice: hinausgeworfen hatte
  rationale: Gibt das kräftige Bild von ἐκρίπτω („hinauswerfen, wegwerfen“) wieder und glättet es nicht zu einem bloßen „unbestattet lassen“.
- source_word: ἀτάφων
  choice: unbestattet
  rationale: Bezeichnet Menschen, denen ein Grab beziehungsweise eine Bestattung versagt blieb.
- source_word: ἀπένθητος
  choice: unbetrauert
  rationale: 'Bewahrt die pointierte Vergeltungsstruktur: Wer andere unbestattet hinauswarf, blieb selbst ohne Trauernde.'
- source_word: κηδείας οὐδ᾽ ἥτινος
  choice: weder irgendeine Bestattung
  rationale: 'Drückt die verstärkte Verneinung aus: Ihm wurde keinerlei Bestattung zuteil.'
- source_word: πατρῴου νόμου
  choice: Brauch seiner Väter
  rationale: νόμος kann „Gesetz“ oder „Brauch/Sitte“ bedeuten; im Bestattungskontext bezeichnet die Wendung wahrscheinlich den überlieferten väterlichen Bestattungsbrauch, nicht ein „Ahnengrab“.
theological_decisions:
- issue: Bedeutung von πατρῴου νόμου
  choice: Brauch seiner Väter
  alternative: Gesetz seiner Väter
  rationale: Die kontextuelle Bedeutung als überlieferter Bestattungsbrauch wird im Haupttext natürlich wiedergegeben; die wörtlichere und möglicherweise religiös-rechtliche Lesart bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung „unbestattet … unbetrauert … Bestattung“ erhält die rhetorische Vergeltungsstruktur des griechischen Satzes; „hinausgeworfen“ bewahrt dessen Härte.
