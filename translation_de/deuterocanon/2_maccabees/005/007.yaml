  register: Modernes, würdiges Standarddeutsch. Die betonte Gegenüberstellung von misslungenem Herrschaftserwerb und schändlichem Ausgang bleibt erhalten. »Als Flüchtling« gibt das eigenständige griechische φυγάς wieder.
