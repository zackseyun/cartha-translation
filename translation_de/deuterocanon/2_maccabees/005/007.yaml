base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/005/007.yaml
  text: He did not gain control of the government[a], but in the end, receiving shame from the plot[b], he again fled away to Ammanitis.
translation:
  language: de
  text: Die Herrschaft jedoch konnte er nicht an sich bringen[a]. Doch der Ausgang seines Anschlags brachte ihm Schande ein, und er floh erneut als Flüchtling nach Ammanitis[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Die Herrschaft erlangte er jedoch nicht« beziehungsweise »Die Macht konnte er nicht sichern«. Das griechische Verb ist an dieser Stelle ungewöhnlich; dem Zusammenhang nach scheiterte er daran, die angestrebte Herrschaft zu gewinnen.'
    reason: lexical_alternative
  - marker: b
    text: »Ammanitis« bezeichnet das Gebiet der Ammoniter.
    reason: cultural_note
lexical_decisions:
- source_word: ἀρχῆς
  choice: die Herrschaft
  rationale: ἀρχή bezeichnet hier im politischen Zusammenhang die angestrebte Herrschaftsgewalt, nicht einen Anfang.
- source_word: οὐκ ἐκρίτησεν
  choice: konnte er nicht an sich bringen
  rationale: Das in diesem Zusammenhang ungewöhnliche Verb wird vom Erzählkontext her als misslungener Erwerb der Herrschaft verstanden; die deutsche Formulierung bleibt wegen der lexikalischen Unsicherheit bewusst mit einer Fußnote versehen.
- source_word: τὸ δὲ τέλος τῆς ἐπιβουλῆς
  choice: Am Ende trug ihm sein Anschlag nur Schande ein
  rationale: τέλος hat hier resultativen Sinn; ἐπιβουλή bezeichnet einen feindseligen Anschlag oder eine Intrige. Die Wiedergabe drückt idiomatisch aus, dass der Anschlag schließlich Schande zur Folge hatte.
- source_word: αἰσχύνην λαβών
  choice: trug ihm … Schande ein
  rationale: Die griechische Wendung lautet wörtlich ‚Schande empfangend‘; die deutsche Formulierung bewahrt den Sinn in natürlicher Sprache.
- source_word: φυγὰς πάλιν … ἀπῆλθεν
  choice: er floh erneut als Flüchtling
  rationale: φυγάς kennzeichnet ihn ausdrücklich als Flüchtling beziehungsweise Verbannten; πάλιν bezeichnet die Wiederholung seiner Flucht.
- source_word: Ἀμμανῖτιν
  choice: Ammanitis
  rationale: Der griechische Gebietsname wird transliteriert; eine Fußnote erläutert seine geografisch-ethnische Bedeutung.
theological_decisions: []
