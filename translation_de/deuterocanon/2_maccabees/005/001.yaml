  text: About that time Antiochus launched his second expedition into Egypt[a].
translation:
  language: de
  text: Um diese Zeit unternahm Antiochus seinen zweiten Feldzug nach Ägypten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zog zu seinem zweiten Angriff nach Ägypten“. Das griechische Verb kann wörtlicher mit „entsandte“ wiedergegeben werden und in dieser Verwendung auch „brach auf“ bedeuten; ἔφοδος kann „Angriff“, „Feldzug“ oder „Unternehmen“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Περὶ δὲ τὸν καιρὸν τοῦτον
  choice: Um diese Zeit
  rationale: Die Wendung mit περί und dem Akkusativ bezeichnet hier einen ungefähren Zeitpunkt. „Um diese Zeit“ ist im Deutschen natürlich und bewahrt diese zeitliche Unschärfe.
- source_word: τὴν δευτέραν ἔφοδον
  choice: seinen zweiten Feldzug
  rationale: ἔφοδος kann einen Angriff, ein militärisches Unternehmen oder einen Feldzug bezeichnen. Im historischen Zusammenhang erfasst „Feldzug“ den länger angelegten militärischen Vorstoß, ohne ihn auf einen einzelnen Angriff zu verengen. Das Possessivpronomen verdeutlicht natürlich, dass Antiochus der Handelnde ist.
- source_word: ὁ Ἀντίοχος
  choice: Antiochus
  rationale: Der Personenname wird in seiner etablierten deutschen Form wiedergegeben.
- source_word: εἰς Αἴγυπτον
  choice: nach Ägypten
  rationale: εἰς bezeichnet die Richtung auf ein Ziel beziehungsweise hinein. Bei Ländernamen ist „nach Ägypten“ die natürliche deutsche Entsprechung.
- source_word: ἐστέλατο
  choice: begann
  rationale: Die mediale Verbform kann ausdrücken, dass Antiochus das Unternehmen in Gang setzte oder sich dazu aufmachte. In Verbindung mit „Feldzug“ gibt „begann“ den Sinn idiomatisch wieder, während die wörtlicheren Möglichkeiten in der Fußnote erhalten bleiben.
