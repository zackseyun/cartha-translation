base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/005/005.yaml
  text: But when a false rumor arose that Antiochus had passed from life[a], Jason, taking no fewer than a thousand men, launched a sudden attack against the city. When those on the wall had been driven back, and at last the city was already being taken, Menelaus fled into the citadel.
translation:
  language: de
  text: Als aber das falsche Gerücht aufkam, Antiochus sei aus dem Leben geschieden[a], nahm Jason nicht weniger als tausend Mann mit sich und unternahm einen überraschenden Angriff auf die Stadt. Nachdem diejenigen auf der Mauer zurückgedrängt worden waren und die Einnahme der Stadt schließlich schon im Gange war, floh Menelaus in die Zitadelle.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »habe das Leben gewechselt«; eine verhüllende Ausdrucksweise dafür, dass Antiochus gestorben sei.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λαλιάς ψευδοῦς
  choice: das falsche Gerücht
  rationale: λαλιά bezeichnet hier eine umlaufende Nachricht; »Gerücht« gibt den politischen Zusammenhang natürlich und präzise wieder.
- source_word: μετηλλαχότος ... τὸν βίον
  choice: sei aus dem Leben geschieden
  rationale: Die euphemistische griechische Wendung bedeutet, dass Antiochus gestorben sei. Die deutsche Form bewahrt den verhüllenden Charakter der Aussage.
- source_word: παραλαβὼν
  choice: nahm ... mit sich
  rationale: Das Partizip beschreibt, dass Jason die Truppe mitnahm bzw. um sich sammelte; die finite Wiedergabe ist im Deutschen flüssig.
- source_word: οὐκ ἐλάττους τῶν χιλίων
  choice: nicht weniger als tausend Mann
  rationale: Bewahrt die betonte zahlenmäßige Untergrenze; »Mann« ist in diesem militärischen Zusammenhang idiomatisch.
- source_word: ἐφνιδίως
  choice: überraschenden
  rationale: Das Adverb bezeichnet einen unerwarteten, überraschenden Angriff und wird im Deutschen natürlich attributiv wiedergegeben.
- source_word: συνετελέσατο ἐπίθεσιν
  choice: führte ... einen Angriff ... aus
  rationale: Gibt die Durchführung des Angriffs eng am griechischen Ausdruck und zugleich in verständlichem Deutsch wieder.
- source_word: τῶν ... ἐπὶ τῷ τείχει
  choice: die Männer auf der Mauer
  rationale: Die Ergänzung »Männer« macht den substantivierten Ausdruck im Deutschen verständlich, ohne sie ausdrücklich als Verteidiger zu deuten.
- source_word: συνελασθέντων
  choice: zurückgedrängt worden waren
  rationale: Im Belagerungszusammenhang bezeichnet die Passivform das gewaltsame Zurückdrängen der auf der Mauer Befindlichen.
- source_word: καταλαμβανομένης τῆς πόλεως
  choice: die Stadt ... schon eingenommen wurde
  rationale: Die Verlaufsform zeigt eine bereits im Gang befindliche Einnahme; »wurde eingenommen« lässt den Vorgang im Kontext erkennen, ohne vorschnell dessen Abschluss zu behaupten.
- source_word: ἐφυγάδευεν
  choice: floh
  rationale: »Floh« gibt die Bewegung in Sicherheit wieder, ohne einen im Griechischen nicht ausdrücklich genannten Zweck hinzuzufügen.
- source_word: ἀκρόπολιν
  choice: Zitadelle
  rationale: Bezeichnet hier die befestigte Hochburg und ist für heutige Leser verständlicher als die Transliteration »Akropolis«.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer historischer Erzählweise. Der Konjunktiv »sei« kennzeichnet den Tod des Antiochus als Inhalt des falschen Gerüchts, nicht als Tatsachenbehauptung.
