review_pass:
  verdict: revise
  source_fidelity: Der Entwurf gibt den falschen Todesbericht, Jasons Mindestzahl von tausend Männern, den überraschenden Angriff und Menelaus’ Flucht in die Zitadelle zuverlässig wieder. Die griechische Formulierung καταλαμβανομένης τῆς πόλεως bezeichnet jedoch ausdrücklich eine noch andauernde Einnahme; »die Stadt ... eingenommen wurde« kann im Deutschen leicht als abgeschlossener Vorgang verstanden werden.
  naturalness: Modernes Standarddeutsch und der Konjunktiv zur Markierung des Gerüchtinhalts sind gelungen. »einen Angriff ... ausführen« ist zwar verständlich, aber weniger idiomatisch als »einen Angriff unternehmen«. Die explizite Formulierung »die Einnahme ... im Gange war« ist klar und bewahrt den Aspekt des Griechischen.
  terminology: »falsches Gerücht«, »aus dem Leben geschieden«, »Zitadelle« und die Fußnote sind angemessen. »diejenigen auf der Mauer« vermeidet die unbegründete geschlechtliche Spezifizierung von τῶν ... ἐπὶ τῷ τείχει und bleibt idiomatisch.
  issues:
  - severity: medium
    issue: Der Verlaufsaspekt von καταλαμβανομένης τῆς πόλεως ist nicht eindeutig wiedergegeben.
    rationale: Das Passivpartizip Präsens beschreibt, dass die Einnahme der Stadt im Gang war. Die deutsche Form »eingenommen wurde« kann, besonders zusammen mit »schon«, als vollzogene Eroberung gelesen werden.
  - severity: low
    issue: »führte einen überraschenden Angriff ... aus« ist stilistisch schwerfällig.
    rationale: Die Wendung ist nicht falsch, doch »unternahm einen überraschenden Angriff« entspricht modernem deutschen Erzählstil besser und gibt συνετελέσατο ἐπίθεσιν ohne Bedeutungsverschiebung wieder.
