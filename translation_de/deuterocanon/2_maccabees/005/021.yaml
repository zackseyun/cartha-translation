base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/005/021.yaml
  text: So Antiochus[a], after carrying off from the temple eighteen hundred talents, quickly departed for Antioch, thinking in his arrogance to make the land navigable and the sea passable on foot[b], because of the exaltation of his heart.
translation:
  language: de
  text: Nachdem Antiochus eintausendachthundert Talente aus dem Tempel fortgeschafft hatte, brach er eilig nach Antiochia auf. In seinem Hochmut meinte er, das Land schiffbar und das Meer begehbar machen zu können[a], weil sein Herz sich erhoben hatte.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das Bild ist bewusst übersteigert: Antiochus hielt sich für fähig, die natürliche Ordnung umzukehren – Land für Schiffe und das Meer für Fußgänger passierbar zu machen.'
    reason: cultural_note
  - marker: b
    text: 'Wörtlicher: „wegen der Erhebung seines Herzens“. Gemeint ist seine hochmütige Selbstüberschätzung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀκτακόσια πρὸς τοῖς χιλίοις
  choice: eintausendachthundert
  rationale: Die griechische Wendung bezeichnet achthundert zusätzlich zu tausend, also genau 1.800.
- source_word: ἀπενεγκάμενος ἐκ τοῦ ἱεροῦ
  choice: aus dem Tempel fortschleppte
  rationale: Das Partizip bezeichnet das Wegtragen; „fortschleppen“ lässt im Kontext den gewaltsamen Tempelraub erkennen, ohne den Umfang von ἱερόν auf das innere Heiligtum zu verengen.
- source_word: θᾶττον … ἐχωρίσθη
  choice: begab sich eilig
  rationale: Die Formulierung gibt sowohl die Abreise als auch die ausdrücklich hervorgehobene Eile in natürlichem Deutsch wieder.
- source_word: ἀπὸ τῆς ὑπερηφανίας
  choice: in seinem Hochmut
  rationale: ὑπερηφανία bezeichnet hier den Hochmut, aus dem Antiochus seine vermessene Vorstellung ableitet.
- source_word: τὴν μὲν γῆν πλωτὴν καὶ τὸ πέλαγος πορευτὸν θέσθαι
  choice: das Land schiffbar und das Meer begehbar machen zu können
  rationale: Die gegensätzlichen Begriffe bewahren das absichtlich übersteigerte Bild einer Umkehrung der natürlichen Ordnung. „Begehbar“ bringt beim Meer die Fortbewegung zu Fuß idiomatisch zum Ausdruck.
- source_word: διὰ τὸν μετεωρισμὸν τῆς καρδίας
  choice: weil sich sein Herz so hoch erhoben hatte
  rationale: Die Wiedergabe erhält das griechische Bild des erhobenen Herzens und macht zugleich dessen negative Bedeutung als überhebliche Selbstüberschätzung verständlich.
theological_decisions:
- issue: Biblische Anthropologie in τῆς καρδίας
  choice: sein Herz
  alternative: sein Denken / sein Inneres
  rationale: „Herz“ bleibt als biblische Bezeichnung für das Zentrum von Gesinnung, Absicht und Hochmut erhalten und wird nicht auf einen rein verstandesmäßigen Vorgang reduziert.
- issue: Verhältnis der beiden Aussagen über Hochmut
  choice: ἀπὸ τῆς ὑπερηφανίας als „in seinem Hochmut“ und διὰ τὸν μετεωρισμὸν τῆς καρδίας als abschließende Begründung
  alternative: Beide Wendungen zu einer einzigen Aussage über seine Arroganz zusammenziehen
  rationale: 'Die getrennte Wiedergabe bewahrt die rhetorische Wiederholung des Griechischen: Sein Hochmut prägt seine Vorstellung, und die Erhebung seines Herzens wird als deren Grund genannt.'
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die Satzstruktur wurde für gute Lesbarkeit leicht gegliedert; die Hyperbel und das biblische Bild vom erhobenen Herzen bleiben erhalten.
