revisions:
- from: So schleppte Antiochus eintausendachthundert Talente aus dem Tempel fort und begab sich eilig nach Antiochia. In seinem Hochmut meinte er, das Land schiffbar und das Meer begehbar machen zu können[a], weil sich sein Herz so hoch erhoben hatte.[b]
  to: Nachdem Antiochus eintausendachthundert Talente aus dem Tempel fortgeschafft hatte, brach er eilig nach Antiochia auf. In seinem Hochmut meinte er, das Land schiffbar und das Meer begehbar machen zu können[a], weil sein Herz sich erhoben hatte.[b]
  rationale: Die Überarbeitung wahrt Aussage und Register des Entwurfs, gibt aber das griechische Partizip als vorausgehende Handlung genauer wieder, vermeidet die spezifischere Nuance von „schleppen“ und entfernt eine nicht markierte Intensivierung. Die bildhafte Rede vom erhobenen Herzen sowie die rhetorische Wiederholung des Hochmuts bleiben erhalten.
