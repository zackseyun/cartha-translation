translation:
  language: de
  text: Und er hielt alle Juden bei der öffentlichen Schau[a] fest und stürmte mit Waffen in die Stadt und richtete ein großes Blutbad an.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „bei der Festveranstaltung“ oder „bei der öffentlichen Vorführung“. Das griechische Wort kann einen Anlass zum Zuschauen oder eine festliche Schau bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: θεωρίαν
  choice: öffentliche Vorführung
  rationale: Das Wort bezeichnet hier einen Anlass zum Zuschauen, eine öffentliche Schau oder möglicherweise eine Festveranstaltung. „Öffentliche Vorführung“ wahrt diesen konkreten, aber nicht völlig eindeutigen Sinn.
- source_word: συνεκέκλεισεν
  choice: schloss … ein
  rationale: Das Verb bezeichnet das gemeinsame Einschließen oder Zusammendrängen einer Gruppe und bewahrt den Zwangscharakter der Handlung.
- source_word: εἰσδραμὼν
  choice: stürmte … in die Stadt
  rationale: Das Partizip schildert ein rasches, gewaltsames Eindringen; „stürmte“ gibt diese Dynamik idiomatisch wieder.
- source_word: σὺν τοῖς ὅπλοις
  choice: mit den Waffen
  rationale: Die konkrete Erwähnung der Waffen wird beibehalten, statt sie lediglich mit „bewaffnet“ zusammenzufassen.
- source_word: ἱκανὰ … πλήθη
  choice: eine große Menge Menschen
  rationale: ἱκανά bezeichnet hier eine beträchtliche Zahl; die deutsche Formulierung drückt das Ausmaß natürlich aus, ohne eine bestimmte Zahl einzutragen.
- source_word: κατέστησεν … πλήθη
  choice: brachte … zu Fall
  rationale: Die knappe griechische Wendung ist im Zusammenhang gewaltsam und bezeichnet, dass viele Menschen niedergemacht wurden. „Zu Fall bringen“ wahrt das Bild und vermeidet eine unnötige Präzisierung darüber, ob ausnahmslos alle Getroffenen starben.
