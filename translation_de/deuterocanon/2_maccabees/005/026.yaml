  terminology: „Juden“ ist die sachgerechte und quellentreue Wiedergabe von Ἰουδαίους. „Öffentliche Schau“ ist für θεωρία geeignet; die Fußnote erhält die mögliche festliche Bedeutung. „Mit Waffen“ gibt σὺν τοῖς ὅπλοις natürlich und konkret wieder.
