base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/005/023.yaml
  text: and in Gerizim[a], Andronicus; and besides these, Menelaus surpassed the others in wickedness toward the citizens[b], having a hateful disposition toward the Jewish citizens.
translation:
  language: de
  text: und auf dem Garizim[a] Andronikus. Außerdem übertraf Menelaus die anderen an Bosheit gegenüber den Bürgern[b]; er hegte eine feindselige Haltung gegenüber den jüdischen Bürgern.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „am Garizim“. Die Präposition kann bei diesem Ortsnamen den Standort beziehungsweise den zugehörigen Bereich bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich etwa: „übertraf die anderen aufs Schlimmste“; gemeint ist, dass er die anderen an Bosheit übertraf.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν δὲ Γαριζεὶν
  choice: und auf dem Garizim
  rationale: ἐν bezeichnet hier den Ort bzw. Amtsbereich. Bei einem Bergnamen ist im Deutschen „auf dem Garizim“ natürlicher als „in Garizim“; „am Garizim“ bleibt möglich.
- source_word: Ἀνδρόνικον
  choice: Andronikus
  rationale: Der Personenname wird nach geläufiger deutscher Transkriptionskonvention wiedergegeben.
- source_word: πρὸς δὲ τούτοις
  choice: Neben diesen
  rationale: Die Wendung fügt Menelaus den zuvor genannten Amtsträgern hinzu und wahrt knapp die additive Bedeutung.
- source_word: Μενέλαον
  choice: Menelaus
  rationale: Der Personenname wird in seiner im Deutschen etablierten Form wiedergegeben.
- source_word: χείριστα τῶν ἄλλων ὑπερήρτετο
  choice: übertraf die anderen an Bosheit
  rationale: Die Formulierung bewahrt sowohl den steigernden Vergleich von ὑπερήρτετο als auch die stark negative Wertung von χείριστα, ohne sie in eine bestimmte Tatbeschreibung aufzulösen.
- source_word: τοῖς πολίταις
  choice: gegenüber den Bürgern
  rationale: Der Dativ bezeichnet die von Menelaus’ Bosheit Betroffenen. „Bürger“ erhält die ausdrücklich politische und gesellschaftliche Nuance von πολίταις.
- source_word: ἀπεχθῆ ... διάθεσιν
  choice: feindlich gesinnt
  rationale: Die idiomatische deutsche Wendung gibt die feindselige Haltung von ἀπεχθῆ διάθεσιν natürlich und mit angemessenem Nachdruck wieder.
- source_word: πρὸς τοὺς πολίτας Ἰουδαίους
  choice: den jüdischen Bürgern
  rationale: Die Wiedergabe erhält sowohl die jüdische Identität als auch die durch πολίτας bezeichnete bürgerliche Zugehörigkeit.
- source_word: ἔχων
  choice: er war ... gesinnt
  rationale: Der griechische Partizipialsatz wird für natürliches modernes Deutsch als beigeordneter Satz wiedergegeben, ohne die inhaltliche Beziehung zu verändern.
theological_decisions:
- issue: Ob πολίταις / πολίτας zu „Leuten“ oder „Volk“ verallgemeinert werden soll
  choice: An beiden Stellen „Bürger“ beibehalten
  alternative: Leute; Landsleute; Volk
  rationale: Das Griechische wiederholt den politischen beziehungsweise gesellschaftlichen Begriff πολίτης. Die Übersetzung bewahrt deshalb neben der ethnischen auch die bürgerliche Dimension der Feindseligkeit.
- issue: Stärke und Form der Wiedergabe von χείριστα τῶν ἄλλων ὑπερήρτετο
  choice: „übertraf die anderen an Bosheit“
  alternative: „war schlimmer als die anderen“; „übertraf alle anderen im Bösestun“
  rationale: Die gewählte Form wahrt die vergleichende und scharf verurteilende Aussage, ohne konkrete böse Handlungen einzutragen, die der griechische Ausdruck hier nicht eigens benennt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Vers ist im Griechischen Teil einer Aufzählung; deshalb bleibt der erste Satz knapp und elliptisch. Die Wiederholung von „Bürger“ ist bewusst beibehalten, um die civic-politische Nuance des Ausgangstextes nicht zu verwischen.
