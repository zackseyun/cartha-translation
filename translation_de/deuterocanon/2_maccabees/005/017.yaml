base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/005/017.yaml
  text: And Antiochus became arrogant in mind[a], not perceiving that the Master had been angered for a little while because of the sins of those dwelling in the city[c][b]; therefore there came to be disregard for the place.
translation:
  language: de
  text: Antiochus aber war in seinem Denken hochmütig[a]. Er erkannte nicht, dass der Gebieter[b] wegen der Sünden der Stadtbewohner für kurze Zeit zornig geworden war. Daher wurde die Stätte übersehen.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „war in seinem Denken erhoben“; gemeint ist seine hochmütige Selbstüberhebung.'
    reason: lexical_alternative
  - marker: b
    text: „Gebieter“ gibt das griechische Wort despótēs wieder, einen anderen Titel als kýrios („Herr“).
    reason: lexical_alternative
  - marker: c
    text: 'Auch möglich: „wurde die Stätte vernachlässigt“ oder „wurde über die Stätte hinweggesehen“. Gemeint ist wohl, dass das Heiligtum zeitweilig der Entweihung preisgegeben war.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐμετεωρίζετο τὴν διάνοιαν
  choice: überhob sich in seinen Gedanken
  rationale: Die Wendung verbindet das bildhafte Sich-Erheben mit Antiochus’ innerer Haltung und bezeichnet hier seine hochmütige Selbstüberhebung.
- source_word: οὐ συνορῶν
  choice: Er erkannte nicht
  rationale: Das Partizip bezeichnet das mangelnde Erfassen des eigentlichen Geschehens; „erkennen“ gibt den wahrnehmenden und verstehenden Sinn natürlich wieder.
- source_word: ἀπώργισται
  choice: zornig geworden war
  rationale: Die Wiedergabe wahrt den resultativen Aspekt des griechischen Perfekts, ohne die Aussage über Gottes Zorn abzuschwächen.
- source_word: βραχέως
  choice: für kurze Zeit
  rationale: Die zeitliche Begrenzung des Zorns wird ausdrücklich und in natürlichem Deutsch erhalten.
- source_word: ὁ δεσπότης
  choice: der Gebieter
  rationale: „Gebieter“ bringt die uneingeschränkte Autorität von δεσπότης zum Ausdruck und wahrt die lexikalische Unterscheidung gegenüber κύριος („Herr“).
- source_word: τῶν τὴν πόλιν οἰκούντων
  choice: der Stadtbewohner
  rationale: Die kompakte deutsche Form gibt die Bewohner der Stadt als diejenigen wieder, deren Sünden den Zorn veranlassten.
- source_word: πάρορασις
  choice: blieb unbeachtet
  rationale: Die seltene Substantivbildung bezeichnet ein Übersehen, Nichtbeachten oder Vernachlässigen. Die Formulierung ist natürlich und lässt offen, wie genau die zeitweilige Preisgabe der Stätte zu verstehen ist.
- source_word: περὶ τὸν τόπον
  choice: die Stätte
  rationale: Im Zusammenhang ist der heilige Ort beziehungsweise Tempelbereich gemeint; „Stätte“ deutet den sakralen Bezug an, ohne ihn stärker festzulegen als der griechische Ausdruck.
theological_decisions:
- issue: Göttlicher Titel δεσπότης
  choice: der Gebieter
  alternative: der Herr; der Herrscher
  rationale: Die Übersetzung bewahrt die Unterscheidung zwischen δεσπότης und κύριος und hebt Gottes Verfügungsgewalt hervor, ohne einen konfessionellen Sondergebrauch einzuführen.
- issue: Zeitweilige Nichtbeachtung der heiligen Stätte
  choice: Deshalb blieb die Stätte unbeachtet.
  alternative: Deshalb wurde die Stätte vernachlässigt; deshalb wurde über die Stätte hinweggesehen.
  rationale: Die Aussage erklärt Antiochus’ Erfolg durch eine zeitlich begrenzte Folge der Sünden der Stadtbewohner, nicht durch göttliche Ohnmacht. Zugleich bleibt die im seltenen Wort πάρορασις liegende Unschärfe hinsichtlich Art und unmittelbarem Urheber der Nichtbeachtung bestehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzfolge wurde gegenüber der langen griechischen Periode leicht gegliedert. „Überhob sich“ bewahrt die Bildsprache und klingt gehoben, bleibt aber allgemein verständlich; „Stätte“ hält den Bezug auf den heiligen Ort knapp und respektvoll.
