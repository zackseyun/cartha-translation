base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/005/025.yaml
  text: But when this man arrived in Jerusalem and pretended to be peaceable[a], he held back until the holy day of the Sabbath; and taking the Jews off guard, he ordered those under his command to arm themselves.
translation:
  language: de
  text: Als dieser Mann nach Jerusalem kam und sich als friedfertig ausgab, hielt er sich bis zum heiligen Tag des Sabbats zurück. Als er die Juden bei der Begehung des Sabbats antraf,[a] befahl er seinen Untergebenen, sich zu bewaffnen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die griechische Formulierung ist knapp und setzt den Sabbat als Objekt von „begehen“ voraus. Sie kann auch den Beiklang haben, dass er die Juden bei ihrer Sabbatbegehung überrumpelte und ihre dadurch bedingte Verwundbarkeit ausnutzte.
    reason: lexical_alternative
lexical_decisions:
- source_word: παραγενόμενος εἰς Ἰερουσόλυμα
  choice: nach Jerusalem kam
  rationale: Das Partizip bezeichnet sein Eintreffen in Jerusalem; die schlichte narrative Wendung ist im Deutschen natürlich und inhaltlich genau.
- source_word: τὸν εἰρηνικὸν ὑποκριθεὶς
  choice: sich als friedfertig ausgab
  rationale: ὑποκρίνομαι bezeichnet hier das Vorspielen einer Rolle, εἰρηνικός eine friedfertige Haltung. Die Übersetzung bringt die Täuschungsabsicht zum Ausdruck, ohne sie weiter auszudeuten.
- source_word: ἐπέσχεν
  choice: hielt er sich … zurück
  rationale: Das Verb bezeichnet hier das vorläufige Zurückhalten der beabsichtigten Handlung bis zu einem taktisch gewählten Zeitpunkt.
- source_word: ἕως τῆς ἁγίας ἡμέρας τοῦ σαββάτου
  choice: bis zum heiligen Tag des Sabbats
  rationale: Die Formulierung bewahrt sowohl ἁγία als auch die ausdrückliche Bezeichnung des Sabbats.
- source_word: λαβὼν ἄγοντας τοὺς Ἰουδαίους
  choice: Dann überraschte er die Juden, während sie ihn begingen
  rationale: Die gedrängte griechische Wendung lässt sich im Zusammenhang so verstehen, dass er die Juden während der Begehung des Sabbats antraf beziehungsweise überraschte. Das Pronomen „ihn“ bezieht sich auf den unmittelbar zuvor genannten Sabbat.
- source_word: τοῖς ὑφʼ ἑαυτὸν
  choice: seinen Untergebenen
  rationale: Die Wendung bezeichnet die Männer unter seiner Befehlsgewalt; „Untergebene“ passt zum militärischen Zusammenhang.
- source_word: ἐξοπλίαν παρήγγειλεν
  choice: befahl …, sich zu bewaffnen
  rationale: παραγγέλλω bezeichnet einen Befehl, ἐξοπλία die Ausrüstung beziehungsweise Bewaffnung zum Kampf. Die deutsche Infinitivkonstruktion gibt dies idiomatisch wieder.
theological_decisions:
- issue: Kennzeichnung des Sabbats als heilig
  choice: heiligen Tag des Sabbats
  alternative: heiligen Sabbattag
  rationale: Das Griechische nennt den Sabbat ausdrücklich einen heiligen Tag. Diese Bezeichnung wird als Aussage des Textes beibehalten, ohne zusätzliche konfessionelle Deutung.
- issue: Bedeutung der gedrängten Wendung λαβὼν ἄγοντας τοὺς Ἰουδαίους
  choice: Er überraschte die Juden während der Begehung des Sabbats
  alternative: Er traf die Juden an, als sie den Sabbat begingen / er überrumpelte die unvorbereiteten Juden
  rationale: ἄγειν kann im Zusammenhang mit einem Fest oder heiligen Tag dessen Begehung bezeichnen; λαμβάνειν kann hier das Antreffen oder Überraschen ausdrücken. Da die Syntax gedrängt ist, wird die Unsicherheit in einer Fußnote offengelegt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Täuschung und der taktische Aufschub werden klar wiedergegeben; die ungewöhnlich gedrängte griechische Formulierung zur Sabbatbegehung wird im Haupttext lesbar übersetzt und in der Fußnote transparent gemacht.
