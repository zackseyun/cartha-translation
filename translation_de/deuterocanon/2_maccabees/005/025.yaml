    rationale: „als er die Juden ihn begehen antraf“ ist keine verständliche deutsche Satzfügung und verschleiert, dass das Objekt zu ἄγοντας aus dem Kontext (der Sabbat) ergänzt wird. Die Fußnote sollte die Ellipse und die Deutungsoptionen klar benennen.
