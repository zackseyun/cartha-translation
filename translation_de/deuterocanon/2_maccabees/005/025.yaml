  verdict: revise
  source_fidelity: Der Entwurf gibt Ankunft, vorgetäuschte Friedfertigkeit, taktisches Zuwarten bis zum heiligen Sabbattag sowie den Befehl zur Bewaffnung zutreffend wieder. Bei λαβὼν ἄγοντας τοὺς Ἰουδαίους legt „überraschte“ jedoch eine stärkere Bedeutung fest, als die knappe und syntaktisch schwierige griechische Wendung sicher trägt. „Bei der Begehung des Sabbats antraf“ wahrt den naheliegenden Bezug von ἄγοντας auf die Sabbatfeier und lässt die mögliche Nuance des Überrumpelns offen.
  naturalness: „Sich als friedfertig ausgab“, „hielt er sich ... zurück“ und „befahl seinen Untergebenen, sich zu bewaffnen“ sind idiomatisches modernes Standarddeutsch. Die Umformung der problematischen Mittelpartie zu „als er ... antraf“ ist klarer als das pronomenhaltige „während sie ihn begingen“ und vermeidet einen etwas abrupten Bedeutungswechsel zu „Dann überraschte er“.
  terminology: „heiliger Tag des Sabbats“ bewahrt die ausdrückliche Heiligkeitsbezeichnung des griechischen Textes. „Untergebene“ ist für τοῖς ὑφʼ ἑαυτὸν angemessen; „sich bewaffnen“ gibt ἐξοπλίαν παρήγγειλεν natürlich wieder. Keine theologisch lenkende Terminologie wurde eingeführt.
