translation:
  language: de
  text: Mit befleckten Händen nahm er die heiligen Geräte an sich und schleppte mit unheiligen Händen fort, was viele Könige zur Mehrung, zum Ruhm und zur Ehre des Ortes[b] aufgestellt[a] hatten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „gestiftet hatten“. Das griechische Partizip bedeutet wörtlicher „aufgestellt“; gemeint sind hier wahrscheinlich königliche Weihgaben im Tempel.'
    reason: lexical_alternative
  - marker: b
    text: „Der Ort“ ist eine ehrfürchtige Bezeichnung für den Tempel.
    reason: cultural_note
lexical_decisions:
- source_word: μιαραῖς
  choice: befleckten
  rationale: Das Wort bezeichnet kultische und moralische Verunreinigung. „Befleckt“ bewahrt diesen Sinn und bildet einen deutlichen Gegensatz zu den heiligen Geräten.
- source_word: ἱερὰ σκεύη
  choice: die heiligen Geräte
  rationale: Gemeint sind Gegenstände des Tempeldienstes. „Heilige Geräte“ ist im Deutschen verständlich und gibt den kultischen Charakter präzise wieder.
- source_word: ἀνασταθέντα
  choice: aufgestellt
  rationale: Die Grundbedeutung des Partizips bleibt sichtbar; im Zusammenhang sind wahrscheinlich königliche Weihgaben gemeint, die im Tempel aufgestellt beziehungsweise gestiftet wurden.
- source_word: πρὸς αὔξησιν καὶ δόξαν τοῦ τόπου καὶ τιμήν
  choice: zur Mehrung, zum Ruhm und zur Ehre des Ortes
  rationale: Die dreigliedrige Zweckangabe und das Substantiv αὔξησις werden bewahrt, ohne sie erklärend zu glätten.
- source_word: βεβήλοις
  choice: unheiligen
  rationale: „Unheilig“ bezeichnet den Gegensatz zum sakralen Bereich klar und natürlich; so bleibt die kultische Gegenüberstellung zu den heiligen Geräten erhalten.
- source_word: συνσύρων
  choice: schleppte ... fort
  rationale: Die Form bezeichnet ein gewaltsames Zusammen- beziehungsweise Fortschleppen. „Fortschleppen“ bewahrt die Gewaltsamkeit und Entehrung besser als das neutralere „wegnehmen“.
- source_word: τοῦ τόπου
  choice: des Ortes
  rationale: Die griechische ehrfürchtige Umschreibung für den Tempel wird beibehalten, statt sie im Haupttext ausdrücklich als „Tempel“ aufzulösen.
theological_decisions:
- issue: Kultische Sprache für die Entweihung der Tempelgegenstände und des Heiligtums
  choice: Der Gegensatz zwischen „befleckten Händen“, „heiligen Geräten“ und „unheiligen Händen“ bleibt ausdrücklich erhalten.
  alternative: Allgemeinere Formulierungen wie „schmutzige Hände“, „Gegenstände“ oder „gottlose Hände“ verwenden.
  rationale: Der Vers verurteilt die Handlung besonders als Sakrileg. Die kultische Spannung des griechischen Textes darf daher nicht zu einer bloßen Aussage über moralisches Fehlverhalten abgeschwächt werden.
- issue: τοῦ τόπου als ehrfürchtige Umschreibung
  choice: „des Ortes“ im Haupttext beibehalten und die Tempelbedeutung in einer Fußnote erläutern.
  alternative: Direkt mit „des Tempels“ übersetzen.
  rationale: Die Umschreibung gehört zum Ton und zur theologischen Ehrfurcht des Ausgangstextes; zugleich verhindert die Fußnote ein Missverständnis.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Wiederholung der Hände folgt dem griechischen Aufbau und hebt den Gegensatz zwischen dem Heiligen und seiner Entweihung hervor. „An sich nahm“ und „fortschleppte“ machen die fortlaufende gewaltsame Wegnahme idiomatisch verständlich.
