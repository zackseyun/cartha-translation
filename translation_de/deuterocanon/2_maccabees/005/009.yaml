base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/005/009.yaml
  text: He who had made many exiles from their homeland perished in a foreign land[b][a], having gone up to the Lacedaemonians as though he would obtain protection because of the kinship.
translation:
  language: de
  text: Er, der viele aus ihrer Heimat vertrieben hatte, kam in der Fremde um, nachdem er zu den Lakedämoniern[a] gebracht worden war, in der Hoffnung, aufgrund der Verwandtschaft[b] Schutz zu erlangen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zu den Spartanern“. „Lakedämonier“ gibt die griechische Volksbezeichnung wörtlicher wieder.'
    reason: lexical_alternative
  - marker: b
    text: Mit der „Verwandtschaft“ ist wahrscheinlich die überlieferte, beanspruchte Beziehung zwischen Juden und Spartanern gemeint; vergleiche 1. Makkabäer 12,6–23.
    reason: cross_reference
lexical_decisions:
- source_word: συχνούς
  choice: viele
  rationale: Das substantivisch gebrauchte Adjektiv bezeichnet eine große Zahl von Menschen; im Deutschen genügt das natürliche substantivische „viele“, ohne ein Geschlecht hinzuzufügen.
- source_word: τῆς πατρίδος
  choice: aus ihrer Heimat
  rationale: πατρίς bezeichnet das Heimat- oder Vaterland. „Heimat“ ist gegenwärtig und wahrt den deutlichen Gegensatz zur folgenden „Fremde“.
- source_word: ἀποξενώσας
  choice: vertrieben hatte
  rationale: Das Verb bedeutet hier, Menschen ihrer Heimat fremd zu machen beziehungsweise sie daraus zu entfernen. „Vertrieben“ gibt die konkrete, verursachende Handlung im Zusammenhang klar wieder.
- source_word: ἐπὶ ξένης
  choice: in der Fremde
  rationale: Die elliptische Wendung bezeichnet fremdes Land. „In der Fremde“ bewahrt knapp den ironischen Gegensatz zu „ihrer Heimat“.
- source_word: ἀπώλετο
  choice: kam ... um
  rationale: Der mediale Aorist von ἀπόλλυμι bezeichnet sein Verderben beziehungsweise seinen Tod. „Kam um“ trägt mehr Gewicht als das neutrale „starb“, ohne eine Todesart hinzuzufügen.
- source_word: πρὸς Λακεδαιμονίους
  choice: zu den Lakedämoniern
  rationale: Die formnahe ethnische Bezeichnung wird beibehalten; die heute geläufigere Benennung „Spartaner“ steht in der Fußnote.
- source_word: ἀναχθείς
  choice: war ... aufgebrochen
  rationale: ἀνάγω kann in Reise- und besonders in Seefahrtszusammenhängen „aufbrechen/auslaufen“ bedeuten. Die neutrale Wiedergabe vermeidet, einen im Kontext nicht sicheren Zwang in die passive Form hineinzulesen.
- source_word: ὡς ... τευξόμενος
  choice: in der Erwartung, ... zu finden
  rationale: ὡς mit dem Futurpartizip kennzeichnet die Absicht oder subjektive Erwartung. Die Formulierung wahrt, dass der erhoffte Schutz nicht tatsächlich erlangt wurde.
- source_word: διὰ τὴν συγγένειαν
  choice: aufgrund der Verwandtschaft
  rationale: συγγένεια bezeichnet eine verwandtschaftliche Beziehung oder gemeinsame Abstammung. Der bestimmte Ausdruck bleibt neutral und erklärt die historische Behauptung nicht im Haupttext.
- source_word: σκέπης
  choice: Schutz
  rationale: σκέπη kann Schutz, Zuflucht oder Obdach bedeuten. Hier passt „Schutz“ zur erwarteten Aufnahme durch ein anderes Gemeinwesen.
theological_decisions:
- issue: Historischer Bezug der συγγένεια
  choice: „aufgrund der Verwandtschaft“ ohne wertende Kennzeichnung im Haupttext
  alternative: „aufgrund der angeblichen Verwandtschaft“
  rationale: Der griechische Text setzt die Beziehung als bekannt voraus, bezeichnet sie aber nicht ausdrücklich als bloße Behauptung. Eine historische Einordnung gehört daher in die Fußnote.
- issue: Vergeltende Ironie zwischen Heimat und Fremde
  choice: Den Gegensatz „aus ihrer Heimat“ / „in der Fremde“ ausdrücklich bewahren
  alternative: Die Wendungen freier als „ins Exil schicken“ / „im Ausland sterben“ wiedergeben
  rationale: Die sprachliche Spiegelung ist ein wesentlicher Bestandteil der wertenden Erzählung, soll aber ohne zusätzliche theologische Deutung sichtbar bleiben.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die zwei Sätze lösen die dichte griechische Partizipialkonstruktion lesefreundlich auf, während der ironische Gegensatz von Heimat und Fremde sowie die nur erwartete Schutzgewährung erhalten bleiben.
