  to: Judas aber, der auch Makkabäus genannt wurde, war mit einer Gruppe von etwa zehn Männern[a] und zog sich zurück. Mit seinen Begleitern lebte er in den Bergen wie ein wildes Tier. Sie ernährten sich fortwährend von pflanzlicher Nahrung, um nicht an der Verunreinigung teilzuhaben.
