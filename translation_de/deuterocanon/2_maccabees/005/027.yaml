  yaml_path: translation/deuterocanon/2_maccabees/005/027.yaml
  text: But Judas[a], who was also called Maccabeus, having become about the tenth and having withdrawn, lived in the mountains like a wild animal with those who were with him, and they continued feeding on vegetation so as not to share in the defilement.
translation:
  language: de
  text: Judas aber, der auch Makkabäus genannt wurde, war mit einer Gruppe von etwa zehn Männern[a] und zog sich zurück. Mit seinen Begleitern lebte er in den Bergen wie ein wildes Tier. Sie ernährten sich fortwährend von pflanzlicher Nahrung, um nicht an der Verunreinigung teilzuhaben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „Nachdem er ungefähr der Zehnte geworden war.“ Die griechische Wendung ist knapp und mehrdeutig; wahrscheinlich besagt sie, dass seine Gruppe auf ungefähr zehn Männer geschrumpft war.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰούδας ... ὁ καὶ Μακκαβαῖος
  choice: Judas aber, der auch Makkabäus genannt wurde
  rationale: ὁ καὶ führt einen weiteren Namen oder Beinamen ein. „Makkabäus“ gibt die griechische Namensform Μακκαβαῖος in der im Deutschen geläufigen Gestalt wieder.
- source_word: δέκατός που γενηθεὶς
  choice: mit einer Gruppe von insgesamt etwa zehn Männern[a]
  rationale: Die griechische Wendung ist elliptisch und bedeutet wörtlich ungefähr „etwa der Zehnte geworden“. Gemeint ist wahrscheinlich, dass Judas zu einer auf ungefähr zehn Männer geschrumpften Gruppe gehörte. Die Übersetzung macht diesen wahrscheinlichen Sinn verständlich; die Fußnote bewahrt die ungewöhnliche wörtliche Form und ihre Unsicherheit.
- source_word: ἀναχωρήσας
  choice: zog sich ... zurück
  rationale: ἀναχωρέω bezeichnet hier den Rückzug aus Gefahr beziehungsweise aus der Öffentlichkeit, ohne zwingend einen bestimmten militärischen Vorgang auszudrücken.
- source_word: ἐν τοῖς ὄρεσι
  choice: in den Bergen
  rationale: Direkte und natürliche Wiedergabe der Ortsangabe.
- source_word: θηρίων τρόπον διέζη
  choice: lebte ... wie ein wildes Tier
  rationale: Die Wendung beschreibt ein Leben nach Art der wilden Tiere. Der deutsche Singular gibt den Vergleich natürlich wieder, ohne das Bild abzuschwächen.
- source_word: σὺν τοῖς μετʼ αὐτοῦ
  choice: mit seinen Begleitern
  rationale: Das Griechische bezeichnet offen diejenigen, die bei Judas waren. „Begleiter“ ist knapp und legt ihre genauere Rolle nicht fest.
- source_word: τὴν χορτώδη τροφὴν σιτούμενοι διετέλουν
  choice: Sie ernährten sich fortwährend von Pflanzen
  rationale: χορτώδης bezeichnet pflanzliche beziehungsweise krautartige Nahrung; διετέλουν drückt die andauernde Lebensweise aus. „Pflanzen“ ist verständlich und vermeidet das missverständliche „Gras“.
- source_word: πρὸς τῷ μὴ μετασχεῖν τοῦ μολυσμοῦ
  choice: um sich nicht an der Verunreinigung zu beteiligen
  rationale: μετέχω bezeichnet Teilhabe oder Beteiligung, μολυσμός eine religiös und moralisch gewichtige Verunreinigung. Die Formulierung bewahrt beides, ohne die Art der Verunreinigung enger festzulegen.
theological_decisions:
- issue: Bedeutung von μολυσμός im Verfolgungskontext
  choice: Verunreinigung mit offenbleibender kultischer und moralischer Bedeutung
  alternative: ausschließlich rituelle Unreinheit oder allgemein sittliche Verderbnis
  rationale: Im Zusammenhang der antiochenischen Verfolgung können verbotene Speisen, aufgezwungene Praktiken und Abfall vom Glauben zugleich mitschwingen. „Verunreinigung“ erhält diese Spannung, statt sie auf nur eine Kategorie zu beschränken.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die elliptische Zahlenangabe wird im Haupttext verständlich erschlossen und in der Fußnote in ihrer wörtlichen Form und verbleibenden Unsicherheit dokumentiert. Kurze Hauptsätze vermeiden eine schwerfällige Kette griechischer Partizipien.
