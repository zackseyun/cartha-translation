  terminology: „Makkabäus“, „Berge“, „wildes Tier“ und „pflanzliche Nahrung“ sind angemessen. „Verunreinigung“ wahrt die kultisch-moralische Offenheit von μολυσμός. Die Fügung „an der Verunreinigung teilhaben“ gibt μετασχεῖν präziser wieder, ohne die Art der Befleckung auszudeuten.
