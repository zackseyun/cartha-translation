base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/005/019.yaml
  text: But the Lord did not choose the nation for the sake of the place, but the place for the sake of the nation.
translation:
  language: de
  text: Doch der Herr hat nicht das Volk um des Ortes willen erwählt, sondern den Ort um des Volkes willen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀλλʼ
  choice: Doch
  rationale: Kennzeichnet den starken Gegensatz zum vorausgehenden Gedanken und klingt im Deutschen würdig und natürlich.
- source_word: διὰ
  choice: um ... willen
  rationale: Die Präposition mit Akkusativ bezeichnet hier den maßgeblichen Grund beziehungsweise die Ausrichtung; die Wendung bewahrt zudem die prägnante Parallelstruktur.
- source_word: τόπον
  choice: den Ort
  rationale: Der griechische Text nennt allgemein den Ort. Obwohl im Kontext Jerusalem beziehungsweise das Heiligtum gemeint ist, wird dies nicht präzisierend in den Haupttext eingetragen.
- source_word: ἔθνος
  choice: das Volk
  rationale: Gemeint ist Israel als gemeinschaftliche, ethnisch-religiöse Größe. Im modernen Deutschen ist »Volk« hier natürlicher und weniger staatsbezogen als »Nation«.
- source_word: ὁ κύριος
  choice: der Herr
  rationale: Entspricht der üblichen und kontextuell angemessenen Wiedergabe des griechischen Gottesnamens κύριος.
- source_word: ἐξελέξατο
  choice: hat ... erwählt
  rationale: »Erwählen« bewahrt gegenüber dem neutraleren »auswählen« den biblischen Zusammenhang göttlicher Wahl. Das einmal gesetzte Verb gilt durch die Ellipse für beide Glieder der Antithese.
theological_decisions:
- issue: Verhältnis zwischen dem heiligen Ort und dem erwählten Volk
  choice: 'Die Wahl des Ortes ist auf das Volk bezogen: Der Herr erwählte nicht das Volk wegen des Ortes, sondern den Ort wegen des Volkes.'
  alternative: Der Ort sei unabhängig erwählt worden und habe dem Volk erst seine besondere Stellung verliehen.
  rationale: Die griechische Nicht-sondern-Konstruktion stellt die Priorität ausdrücklich heraus. Die Übersetzung erhält diese Spannung, ohne über den Wortlaut hinaus zu erklären, worin die Erwählung des Volkes oder des Ortes besteht.
translation_notes:
  register: Modernes, gehobenes Standarddeutsch mit klarer antithetischer Satzstruktur. »Um ... willen« ist bewusst in beiden Gliedern wiederholt; die verbale Ellipse des Griechischen wird im Deutschen natürlich beibehalten.
