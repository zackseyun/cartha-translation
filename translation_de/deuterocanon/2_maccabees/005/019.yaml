  source_fidelity: 'Der Entwurf gibt die griechische antithetische Konstruktion präzise wieder: Nicht um des Ortes willen erwählte der Herr das Volk, sondern um des Volkes willen den Ort. Die Bezüge von „Volk“ (ἔθνος), „Ort“ (τόπος), „Herr“ (ὁ κύριος) und „erwählt“ (ἐξελέξατο) sind vollständig und ohne sachliche Einengung übertragen.'
  naturalness: „Doch der Herr hat nicht das Volk um des Ortes willen erwählt, sondern den Ort um des Volkes willen“ ist idiomatisches modernes Standarddeutsch. Die bewusst parallele Wiederholung von „um ... willen“ trägt den rhetorischen Kontrast des Griechischen angemessen.
  terminology: „Der Herr“ und „erwählt“ sind im biblischen Register angemessen. „Volk“ ist hier gegenüber „Nation“ die natürlichere deutsche Wiedergabe von ἔθνος und bewahrt den korporativen Bezug. „Ort“ folgt dem nicht weiter spezifizierten τόπος; eine erläuternde Fußnote ist nicht erforderlich.
