  text: And he ordered the soldiers to cut down without mercy those they encountered[b][a], and to slaughter those who went up into the houses.
translation:
  language: de
  text: Und er befahl den Soldaten, alle, denen sie begegneten[a], erbarmungslos niederzuhauen und diejenigen abzuschlachten, die in die Häuser hinaufstiegen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „alle, die ihnen in den Weg kamen“. Das griechische Partizip kann Menschen bezeichnen, denen die Soldaten auf ihrem Weg begegneten; es muss nicht bedeuten, dass diese die Soldaten angriffen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „die in die Häuser hinaufstiegen“. Gemeint sein kann das Hinaufsteigen über Stufen oder in obere Räume; die genaue bauliche Situation bleibt offen.'
    reason: cultural_note
lexical_decisions:
- source_word: ἐκέλευσεν
  choice: er befahl
  rationale: Der Aorist von κελεύω bezeichnet das Erteilen eines Befehls; „befahl“ gibt die verbindliche militärische Anordnung natürlich und prägnant wieder.
- source_word: κόπτειν
  choice: niederzuhauen
  rationale: κόπτω bedeutet grundsätzlich „schlagen, hauen“ und bezeichnet hier tödliche Gewalt. „Niederhauen“ bewahrt die drastische Bildlichkeit des griechischen Ausdrucks.
- source_word: ἀφειδῶς
  choice: erbarmungslos
  rationale: Das Adverb bedeutet, ohne jemanden zu schonen. „Erbarmungslos“ bringt die rücksichtslose Grausamkeit in gegenwärtigem Deutsch klar zum Ausdruck.
- source_word: τοὺς ἐμπίπτοντας
  choice: alle, denen sie begegneten
  rationale: ἐμπίπτω kann hier Menschen bezeichnen, die den Soldaten begegneten oder ihnen in den Weg kamen. Die Formulierung vermeidet den unbegründeten Eindruck, die Opfer hätten die Soldaten angegriffen.
- source_word: ἀναβαίνοντας
  choice: die ... hinaufstiegen
  rationale: ἀναβαίνω bedeutet wörtlich „hinaufgehen, hinaufsteigen“. Die Übersetzung erhält die räumliche Bewegung, ohne genauer festzulegen, ob Treppen, erhöhte Eingänge oder obere Räume gemeint sind.
- source_word: κατασφάζειν
  choice: abzuschlachten
  rationale: Das verstärkte Verb bezeichnet brutales Töten. „Abschlachten“ bewahrt die besondere Härte des Ausdrucks und passt zum geschilderten Massaker.
- source_word: οἰκίαις
  choice: Häuser
  rationale: οἰκία kann Haus oder Hausgemeinschaft bedeuten; hier verlangt die räumliche Verbindung mit ἀναβαίνω die Bedeutung „Häuser“.
