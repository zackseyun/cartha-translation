base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/005/018.yaml
  text: But if we had not become involved in many sins[a], then, just as Heliodorus, who was sent by King Seleucus to inspect the treasury, was immediately scourged and turned back from his boldness when he came forward, so also would we have been struck down.
translation:
  language: de
  text: Wenn wir jedoch nicht in viele Sünden verstrickt gewesen wären,[a] wäre dieser Mann, sobald er vorgetreten wäre, sofort gegeißelt und von seiner Vermessenheit abgebracht worden, wie Heliodor, den König Seleukus zur Überprüfung der Schatzkammer entsandt hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Wenn es sich aber nicht ergeben hätte, dass wir in viele Sünden verstrickt waren …“ Der griechische Satz lässt die kontrafaktische Folge elliptisch erkennen: Der mit Heliodor verglichene „dieser Mann“ wäre bei seinem Auftreten sofort bestraft und von seiner Vermessenheit abgebracht worden.'
    reason: Die Anmerkung erläutert die elliptische irreale Bedingung und stellt klar, dass die ergänzte Folge sich auf „dieser Mann“ (οὗτος), nicht auf „wir“, bezieht.
lexical_decisions:
- source_word: συνέβην προενέχεσθαι
  choice: wir uns … verstrickt hätten
  rationale: Die Verbindung bezeichnet in der irrealen Bedingung das Verwickeltsein in Sünden. Die natürliche deutsche Formulierung bewahrt die moralische Beteiligung und die rückblickende Irrealität.
- source_word: πολλοῖς ἁμαρτήμασιν
  choice: in viele Sünden
  rationale: Der Dativ ergänzt προενέχεσθαι; „sich in viele Sünden verstricken“ ist idiomatisches modernes Deutsch.
- source_word: ἐπὶ τὴν ἐπίσκεψιν
  choice: zur Untersuchung
  rationale: Die Präpositionalfügung bezeichnet den Zweck des königlichen Auftrags und dessen amtlichen Charakter.
- source_word: γαζοφυλακίου
  choice: der Schatzkammer
  rationale: Das Wort bezeichnet eine Schatzkammer beziehungsweise ein Schatzhaus. Der unmittelbare Zusammenhang identifiziert sie als die bereits bekannte Tempelschatzkammer, ohne dass „Tempel-“ im Vers ergänzt werden muss.
- source_word: προαχθεὶς
  choice: als … herantrat
  rationale: Im Zusammenhang liegt das aktive Vorrücken Heliodors zu seinem Vorhaben näher als ein passives „vorgeführt werden“.
- source_word: παραχρῆμα
  choice: auf der Stelle
  rationale: Die Wendung gibt die unverzügliche Folge anschaulich und in würdigem Gegenwartsdeutsch wieder.
- source_word: μαστιγωθεὶς
  choice: wurde … gegeißelt
  rationale: „Gegeißelt“ entspricht der schweren Bestrafung durch Schläge und wahrt den gehobenen Erzählton.
- source_word: ἀνετράπη τοῦ θράσους
  choice: von seinem dreisten Vorhaben abgebracht
  rationale: Die Formulierung bewahrt sowohl die Umkehr beziehungsweise Vereitelung als auch den negativen Sinn von θράσος. Im Deutschen ist dies natürlicher als eine wörtliche Wendung wie „von seiner Dreistigkeit umgewendet“.
theological_decisions:
- issue: Im Griechischen nur implizite Folge des irrealen Bedingungssatzes
  choice: „wäre es uns ebenso ergangen wie Heliodor“ macht die implizierte Vergleichsfolge ausdrücklich
  alternative: 'Die Satzfolge formal unvollständig lassen: „Wenn wir uns aber nicht … verstrickt hätten, wie Heliodor …“'
  rationale: Der griechische Satz lässt die Folge aus dem Heliodor-Vergleich erschließen. Für einen verständlichen deutschen Satz wird sie knapp expliziert, ohne eine bestimmte, im Ausgangstext nicht genannte Strafart für „uns“ hinzuzufügen.
- issue: Bezug göttlicher Strafe und menschlicher Sünde
  choice: Die kontrafaktische Verknüpfung bleibt bestehen, ohne den theologischen Mechanismus weiter auszudeuten
  alternative: Ausdrücklich ergänzen, Gott habe wegen der Sünden zeitweilig nicht eingegriffen
  rationale: Der Vers stellt einen Zusammenhang zwischen den vielen Sünden und dem ausgebliebenen sofortigen Schicksal Heliodors her; die genaue Art dieses Zusammenhangs soll nicht über den Wortlaut hinaus dogmatisch festgelegt werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der lange griechische Periodensatz wird durch einen Doppelpunkt gegliedert. „Gegeißelt“ wahrt den ernsten historischen Ton; „dreistes Vorhaben“ macht die auf das Handeln gerichtete Bedeutung von θράσος verständlich, ohne konfessionelle Deutung.
