  terminology: „Schatzkammer“ und „gegeißelt“ sind angemessen. Für θράσος ist „Vermessenheit“ genauer als „dreistes Vorhaben“, da das griechische Wort die anmaßende Haltung beziehungsweise Dreistigkeit bezeichnet und kein bestimmtes Vorhaben nennt. Heliodor und Seleukus sind korrekt wiedergegeben.
