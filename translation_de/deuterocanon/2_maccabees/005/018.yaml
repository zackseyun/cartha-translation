revisions:
- from: 'Wenn wir uns aber nicht in viele Sünden verstrickt hätten,[a] wäre es uns ebenso ergangen wie Heliodor: Als dieser, von König Seleukus zur Untersuchung der Schatzkammer entsandt, herantrat, wurde er auf der Stelle gegeißelt und von seinem dreisten Vorhaben abgebracht.'
  to: Wenn wir jedoch nicht in viele Sünden verstrickt gewesen wären,[a] wäre dieser Mann, sobald er vorgetreten wäre, sofort gegeißelt und von seiner Vermessenheit abgebracht worden, wie Heliodor, den König Seleukus zur Überprüfung der Schatzkammer entsandt hatte.
  rationale: 'Die Übersetzung wird am griechischen Satzbau ausgerichtet: Die Bedingung betrifft „wir“, die im Vergleich mit Heliodor erschlossene Folge aber „dieser Mann“. Die deutsche Ergänzung bleibt auf die aus dem Vergleich unmittelbar erschließbare Strafe beschränkt. „Vermessenheit“ bewahrt die Bedeutung von θράσος, ohne ein im Text nicht genanntes Vorhaben einzutragen.'
