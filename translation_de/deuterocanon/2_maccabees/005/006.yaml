base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/005/006.yaml
  text: But Jason kept carrying out merciless slaughter of his own fellow citizens[a], not understanding that prosperity against kinsmen is the greatest calamity[b], and thinking that he was winning trophies over enemies and not over his own countrymen.
translation:
  language: de
  text: Jason aber richtete an seinen eigenen Mitbürgern schonungslos ein Blutbad an[a]. Dabei begriff er nicht, dass Erfolg gegen die eigenen Verwandten das größte Unglück ist[b], und meinte, er errichte Siegeszeichen über Feinde und nicht über Angehörige seines eigenen Volkes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „übte an seinen eigenen Mitbürgern schonungslos Gemetzel“ bzw. „verschonte seine eigenen Mitbürger beim Abschlachten nicht“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „dass Wohlergehen gegenüber den Verwandten das größte Unglück ist“; gemeint ist, dass vermeintlicher Erfolg gegen die eigenen Angehörigen in Wahrheit unheilvoll ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σφαγὰς ... ἀφειδῶς
  choice: richtete ... schonungslos ein Blutbad an
  rationale: σφαγαί bezeichnet gewaltsames Abschlachten; die idiomatische deutsche Wendung bewahrt die Härte des Ausdrucks. ἀφειδῶς wird mit „schonungslos“ eng und natürlich wiedergegeben.
- source_word: τῆς πόλεως τῶν ἰδίων
  choice: unter seinen eigenen Mitbürgern
  rationale: Die Formulierung bezeichnet die Menschen der Stadt, die zu Jasons eigener Gemeinschaft gehörten. „Mitbürger“ erhält den städtisch-politischen Bezug.
- source_word: οὐ συννοῶν
  choice: Dabei begriff er nicht
  rationale: Das Partizip bezeichnet fehlende Einsicht in die moralische Verkehrung seines vermeintlichen Erfolgs.
- source_word: εὐημερίαν ... δυσημερίαν
  choice: Erfolg ... Unglück
  rationale: Im politischen und militärischen Zusammenhang meint εὐημερία günstiges Ergehen beziehungsweise Erfolg, während δυσημερία dessen katastrophale Kehrseite bezeichnet. Das deutsche Gegensatzpaar ist verständlich und wahrt die pointierte Umkehrung.
- source_word: συγγενεῖς
  choice: die eigenen Verwandten
  rationale: Die Grundbedeutung der gemeinsamen Abstammung beziehungsweise Verwandtschaft bleibt erhalten; „eigenen“ macht den reflexiven Zusammenhang im Deutschen deutlich.
- source_word: τρόπαια καταβάλλεσθαι
  choice: Siegeszeichen erringe
  rationale: τρόπαιον ist das Siegeszeichen über einen geschlagenen Gegner. Die kontextuelle Wiedergabe „erringen“ bildet Jasons eingebildeten militärischen Triumph natürlich ab, ohne ein modernes Sportverständnis von „Trophäen“ aufzudrängen.
- source_word: ὁμοεθνῶν
  choice: Angehörige seines eigenen Volkes
  rationale: ὁμοεθνής bezeichnet Menschen desselben Volkes beziehungsweise derselben ethnischen Gemeinschaft und wird so von συγγενεῖς unterschieden.
theological_decisions:
- issue: Moralische Umkehrung von vermeintlichem Erfolg und wirklichem Unglück
  choice: 'Die Aussage wird als ausdrückliches Urteil des Erzählers wiedergegeben: Erfolg gegen die eigenen Verwandten ist das größte Unglück.'
  alternative: 'Wörtlicher: „Wohlergehen gegenüber den Verwandten ist das größte Missgeschick.“'
  rationale: Der griechische Text selbst formuliert die paradoxe moralische Wertung. Die Übersetzung macht sie verständlich, ohne sie konfessionell auszudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz wurde zur besseren Verständlichkeit in zwei Sätze gegliedert. Die Wiederholung von „eigenen“ erhält die Betonung, dass Jason gegen seine eigene Gemeinschaft vorging; „Verwandte“ und „Angehörige seines eigenen Volkes“ bewahren die unterschiedliche Reichweite von συγγενεῖς und ὁμοεθνῶν.
