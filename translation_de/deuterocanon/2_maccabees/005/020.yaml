  - severity: low
    issue: „in aller Herrlichkeit hergestellt“
    rationale: Die Formulierung klingt sperrig und „hergestellt“ ist für ἐπανωρθώθη weniger treffend als „wiederhergestellt“. „In voller Herrlichkeit“ gibt μετὰ πάσης δόξης idiomatisch wieder.
