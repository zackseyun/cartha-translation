base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/005/020.yaml
  text: Therefore even the place itself[a], after sharing in the nation's misfortunes, later also shared in its benefits; and though it had been overtaken in the wrath of the Almighty, it was restored again in the reconciliation of the great Master[b], with all glory.
translation:
  language: de
  text: Darum hatte auch der Ort selbst[a] Anteil an den Nöten des Volkes und nahm später ebenso an seinen Wohltaten teil. Und nachdem er im Zorn des Allmächtigen erfasst worden war, wurde er in der Versöhnung des großen Gebieters[b] in voller Herrlichkeit wiederhergestellt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit dem „Ort“ ist im Zusammenhang der Tempel beziehungsweise der Tempelort gemeint.
    reason: contextual_clarification
  - marker: b
    text: „Gebieter“ gibt ein griechisches Wort wieder, das unumschränkte Autorität betont; auch „Herrscher“ wäre möglich. Die Wendung „Versöhnung des großen Gebieters“ kann sein wiederhergestelltes Wohlwollen bezeichnen, ohne die genaue Beziehungsrichtung ausdrücklich festzulegen.
    reason: lexical_and_semantic_ambiguity
lexical_decisions:
- source_word: διόπερ
  choice: Darum
  rationale: Gibt die starke folgernde Verbindung zum vorausgehenden Gedankengang knapp und natürlich wieder.
- source_word: αὐτὸς ὁ τόπος
  choice: auch der Ort selbst
  rationale: Bewahrt die Betonung durch αὐτός und legt den im Kontext gemeinten Tempel beziehungsweise Tempelort nicht ausdrücklich in den Haupttext hinein.
- source_word: συμμετασχὼν ... ἐκοινώνησεν
  choice: hatte ... Anteil an ... und nahm ... an ... teil
  rationale: Erhält das wiederholte Motiv gemeinsamer Teilhabe und formuliert zugleich idiomatisch auf Deutsch.
- source_word: τοῦ ἔθνους
  choice: des Volkes
  rationale: ἔθνος bezeichnet hier das jüdische Volk als geschichtliche Gemeinschaft; „Volk“ ist im Deutschen natürlicher als „Nation“ und vermeidet moderne staatsrechtliche Nebenbedeutungen.
- source_word: δυσπετημάτων
  choice: Unglücksfällen
  rationale: Bezeichnet schwere widrige Erfahrungen und bildet einen verständlichen Gegensatz zu den folgenden Wohltaten.
- source_word: εὐεργετημάτων
  choice: Wohltaten
  rationale: Bewahrt den positiven Gegenbegriff und lässt offen, in welcher konkreten Form die erwiesenen Güter beziehungsweise Begünstigungen bestanden.
- source_word: καταληφθεὶς
  choice: erfasst worden war
  rationale: Passt idiomatisch zum Zorn als wirkender Größe und bewahrt den passiven Charakter.
- source_word: παντοκράτορος
  choice: Allherrschers
  rationale: Gibt den Titel παντοκράτωρ als Bezeichnung umfassender Herrschaft wieder und unterscheidet ihn vom folgenden δεσπότης.
- source_word: ὀργῇ
  choice: Zorn
  rationale: Bewahrt den feierlichen Ausdruck für göttliches Gericht.
- source_word: καταλλαγῇ
  choice: Versöhnung
  rationale: Bewahrt die relationale Umkehr von Zorn zu wiederhergestelltem Wohlwollen, ohne eine im Ausdruck nicht genannte kultische Sühnehandlung einzutragen.
- source_word: μεγάλου δεσπότου
  choice: des großen Gebieters
  rationale: „Gebieter“ bringt die in δεσπότης liegende unumschränkte Autorität zum Ausdruck und bleibt vom üblichen Wort für „Herr“ unterscheidbar.
- source_word: μετὰ πάσης δόξης ἐπανωρθώθη
  choice: wurde ... wieder in aller Herrlichkeit hergestellt
  rationale: Gibt Wiederaufrichtung beziehungsweise Wiederherstellung und die vollständige Herrlichkeit des erneuerten Ortes klar wieder.
theological_decisions:
- issue: Unterscheidung der beiden Gottestitel παντοκράτωρ und δεσπότης
  choice: der Allherrscher … der große Gebieter
  alternative: der Allmächtige … der große Herr
  rationale: Der griechische Text verwendet bewusst zwei verschiedene Titel. Die gewählte Fassung erhält diese Differenz und hebt sowohl umfassende Herrschaft als auch gebietende Autorität hervor.
- issue: Bedeutungsrichtung von καταλλαγή mit dem Genitiv des Gebieters
  choice: bei der Versöhnung des großen Gebieters
  alternative: als der große Gebieter wieder Gnade erwies / bei der Versöhnung mit dem großen Gebieter
  rationale: Der griechische Genitiv lässt die genaue Beziehungsrichtung unausgesprochen. Die formale Genitivkonstruktion bewahrt diese Offenheit, statt eindeutig festzulegen, ob Gottes wiederhergestelltes Wohlwollen oder die Versöhnung mit ihm im Vordergrund steht.
translation_notes:
  register: 'Modernes, würdiges Standarddeutsch mit leicht biblischem Klang. Der Satzbau bleibt nahe an der antithetischen Struktur des Griechischen: gemeinsames Unglück und gemeinsame Wohltat, Zorn und Versöhnung, Erfassung und Wiederherstellung.'
