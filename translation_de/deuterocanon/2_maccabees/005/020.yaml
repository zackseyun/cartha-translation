  to: Darum hatte auch der Ort selbst[a] Anteil an den Nöten des Volkes und nahm später ebenso an seinen Wohltaten teil. Und nachdem er im Zorn des Allmächtigen erfasst worden war, wurde er in der Versöhnung des großen Gebieters[b] in voller Herrlichkeit wiederhergestellt.
