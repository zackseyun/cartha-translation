  yaml_path: translation/deuterocanon/2_maccabees/005/013.yaml
  text: There was a killing of young and old, a destruction of men and women and children, and slaughters of virgins and infants.
translation:
  language: de
  text: Junge und Alte wurden getötet[a], Männer, Frauen und Kinder vernichtet und Jungfrauen[b] und Säuglinge abgeschlachtet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder »junge Männer und Älteste«, wenn die Altersbezeichnungen enger verstanden werden; der Zusammenhang spricht jedoch eher für den allgemeinen Gegensatz zwischen Jungen und Alten.
    reason: lexical_alternative
  - marker: b
    text: »Jungfrauen« gibt eine Bezeichnung wieder, die genauer unverheiratete junge Frauen jungfräulichen Standes meint; »junge Frauen« ist möglich, aber weniger genau.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγίνετο
  choice: wurden
  rationale: Das Imperfekt schildert das fortdauernde Geschehen. Eine Passivkonstruktion ist im Deutschen natürlich und bewahrt, dass kein Täter ausdrücklich genannt wird.
- source_word: νέων
  choice: Junge
  rationale: Zusammen mit πρεσβυτέρων bildet das Wort hier am ehesten einen allgemeinen Gegensatz der Altersgruppen; die Wiedergabe legt sich nicht unnötig auf junge Männer fest.
- source_word: πρεσβυτέρων
  choice: Alte
  rationale: Im Gegensatz zu νέων bezeichnet das Wort hier eher alte Menschen als Träger eines Ältestenamtes.
- source_word: ἀναίρεσις
  choice: getötet
  rationale: Das Wort bezeichnet hier die gewaltsame Tötung. Die verbale Wiedergabe klingt im Deutschen natürlicher als eine schwere Nominalkonstruktion und lässt die Steigerung zu „abgeschlachtet“ bestehen.
- source_word: ἀφανισμός
  choice: vernichtet
  rationale: Der Ausdruck bezeichnet Beseitigung bis hin zur Auslöschung. „Vernichtet“ gibt die Schärfe bei Personengruppen idiomatisch wieder, ohne zwingend die vollständige Ausrottung aller Betroffenen zu behaupten.
- source_word: παρθένων
  choice: Jungfrauen
  rationale: Die Wiedergabe erhält die ausdrückliche Bezeichnung unverheirateter junger Frauen jungfräulichen Standes, statt sie auf ein bloßes Lebensalter zu reduzieren.
- source_word: νηπίων
  choice: Säuglinge
  rationale: Das Wort bezeichnet sehr kleine, insbesondere noch nicht sprechende Kinder; „Säuglinge“ ist präzise und dem ernsten Ton angemessen.
- source_word: σφαγαί
  choice: abgeschlachtet
  rationale: Das starke Wort bezeichnet blutiges Niedermetzeln. „Abgeschlachtet“ bewahrt die rhetorische Verschärfung gegenüber dem vorherigen „getötet“.
