translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz unterscheidet bewusst zwischen der dem König übermittelten Nachricht, seiner daraus gezogenen Schlussfolgerung und seinem anschließenden gewaltsamen Vorgehen. Das Tierbild des griechischen Textes bleibt erhalten; der militärische Fachausdruck wird im Haupttext verständlich wiedergegeben und in der Fußnote erläutert.
