  text: When the king was informed about what had happened[a], he concluded that Judea was in revolt; so, after setting out from Egypt, savage in spirit, he took the city by force of arms.
translation:
  language: de
  text: Als dem König über das Geschehene berichtet wurde, schloss er daraus, Judäa stehe im Aufstand. Darauf brach er aus Ägypten auf, von tierischer Wildheit erfüllt, und eroberte die Stadt mit Waffengewalt.[a]
