lexical_decisions:
- source_word: Προεστώτων ... τῷ Βασιλεῖ περὶ τῶν γεγονότων
  choice: Als dem König über das Geschehene berichtet wurde
  rationale: Die Genitivus-absolute-Konstruktion bezeichnet, dass dem König die Ereignisse vorgetragen beziehungsweise gemeldet wurden. Das deutsche Passiv wahrt die im Griechischen nicht genannten Berichterstatter.
- source_word: διέλαβεν
  choice: schloss er daraus
  rationale: Das Verb bezeichnet hier ein aus den Berichten gewonnenes Urteil. „Schloss er daraus“ macht den Folgerungscharakter deutlich, ohne die Annahme als objektive Tatsache auszugeben.
- source_word: ἀποστατεῖν
  choice: stehe im Aufstand
  rationale: Im politischen Zusammenhang geht es um Auflehnung gegen die königliche Herrschaft, nicht vorrangig um religiösen Abfall. Der Konjunktiv der indirekten Rede gibt die Einschätzung des Königs wieder.
- source_word: ἀναζεύξας
  choice: brach er aus Ägypten auf
  rationale: Das Partizip bezeichnet das Aufbrechen beziehungsweise Abmarschieren. Die Wiedergabe ist natürlich und lässt offen, wie stark der militärische Nebensinn zu gewichten ist.
- source_word: θηριωμένος τῇ ψυχῇ
  choice: im Innersten zum wilden Tier geworden
  rationale: Die Formulierung bewahrt das drastische Bild einer tierhaft gewordenen inneren Haltung. Sie vermeidet eine Abschwächung zu bloßem Zorn und legt zugleich keine bestimmte Gefühlsregung fest.
- source_word: ἔλαβεν τὴν μὲν πόλιν
  choice: eroberte die Stadt
  rationale: λαμβάνω wird hier militärisch vom Einnehmen einer Stadt gebraucht. „Eroberte“ ist im modernen Deutschen klar und idiomatisch.
- source_word: δοριαλώτον
  choice: mit Waffengewalt
  rationale: Das Adjektiv bedeutet wörtlich etwa „mit dem Speer erbeutet“ und bezeichnet idiomatisch die gewaltsame Einnahme durch einen bewaffneten Angriff. Die Fußnote erhält das konkrete griechische Bild.
