  yaml_path: translation/deuterocanon/2_maccabees/005/015.yaml
  text: But not satisfied with these things[a], he even dared to enter the most holy temple in all the earth, with Menelaus as his guide, the one who had become a traitor both to the laws and to his homeland,
translation:
  language: de
  text: Doch damit nicht zufrieden, wagte er es sogar, den heiligsten Tempel auf der ganzen Erde[a] zu betreten. Dabei hatte er Menelaus als Führer, der zum Verräter sowohl an den Gesetzen als auch an seiner Heimat geworden war.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den heiligsten Tempel im ganzen Land“. Das griechische Wort γῆ kann sowohl „Erde“ als auch „Land“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἀρκεσθεὶς δὲ τούτοις
  choice: Doch damit nicht zufrieden
  rationale: Die Wendung greift die vorangegangenen Taten auf und leitet eine weitere Steigerung ein. „Damit nicht zufrieden“ ist im Deutschen natürlich und bewahrt den rückverweisenden Plural sinngemäß.
- source_word: κατετόλμησεν
  choice: wagte er es sogar
  rationale: Das Verb bezeichnet ein vermessenes, dreistes Wagen; „sogar“ macht die erzählerische Steigerung deutlich, ohne eine zusätzliche Sachbehauptung einzuführen.
- source_word: πάσης τῆς γῆς
  choice: auf der ganzen Erde
  rationale: γῆ kann „Erde“ oder „Land“ bedeuten. Im Haupttext wird die universal klingende Aussage bewahrt; die örtlich engere Deutung steht in der Fußnote.
- source_word: ἁγιώτατον ἱερὸν
  choice: den heiligsten Tempel
  rationale: Der Superlativ ἁγιώτατον wird ausdrücklich wiedergegeben. ἱερόν bezeichnet hier den Tempel beziehungsweise den heiligen Tempelbereich; „Tempel“ ist im Kontext klar und allgemein verständlich.
- source_word: εἰσελθεῖν
  choice: zu betreten
  rationale: „Betreten“ gibt das Hineingehen in den Tempel idiomatisch und präzise wieder.
- source_word: ὁδηγὸν ἔχων τὸν Μενέλαον
  choice: Dabei hatte er Menelaus als Führer
  rationale: Die partizipiale Begleitumstandsangabe bleibt erhalten und bezeichnet Menelaus als denjenigen, der ihn hineinführte.
- source_word: προδότην γεγονότα
  choice: der zum Verräter … geworden war
  rationale: Der Perfektpartizip beschreibt einen eingetretenen und fortbestehenden Zustand; „geworden war“ bildet diesen Aspekt angemessen ab.
- source_word: τῶν νόμων
  choice: an den Gesetzen
  rationale: Der ausdrückliche griechische Plural wird beibehalten. Die Verbindung „Verräter an“ ist gehobenes, aber verständliches Deutsch.
- source_word: τῆς πατρίδος
  choice: an seiner Heimat
  rationale: „Heimat“ gibt πατρίς natürlich wieder und bewahrt dessen persönliche wie nationale Bedeutung.
theological_decisions:
- issue: Bezeichnung des Tempels und Reichweite seines Heiligkeitsanspruchs
  choice: der heiligste Tempel auf der ganzen Erde
  alternative: das heiligste Heiligtum im ganzen Land
  rationale: Der Haupttext bewahrt den Superlativ und die universal mögliche Bedeutung von γῆ, ohne den Anspruch abzuschwächen. Da γῆ ebenso „Land“ bedeuten kann, wird diese echte lexikalische Mehrdeutigkeit in einer Fußnote offengelegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz wird zur besseren Verständlichkeit in zwei Sätze gegliedert; die rhetorische Steigerung und die scharfe Beurteilung des Menelaus bleiben erhalten.
