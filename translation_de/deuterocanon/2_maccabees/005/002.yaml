lexical_decisions:
- source_word: συνέβη
  choice: waren … zu sehen
  rationale: Die unpersönliche Ereignisformel wird im Deutschen natürlich in die Aussage über das sichtbare Geschehen einbezogen; der Ereignischarakter bleibt erhalten, ohne das schwerfällige „es geschah, dass“.
- source_word: καθʼ ὅλην τὴν πόλιν σχεδὸν
  choice: fast in der ganzen Stadt
  rationale: κατά mit Akkusativ bezeichnet hier die räumliche Ausdehnung, während σχεδόν diese als nahezu vollständig qualifiziert.
- source_word: ἐφʼ ἡμέρας τεσσεράκοντα
  choice: vierzig Tage lang
  rationale: Natürliche deutsche Wiedergabe der Zeitdauer.
- source_word: φαίνεσθαι
  choice: zu sehen
  rationale: Gibt die Sichtbarkeit des Phänomens wieder, ohne eindeutig festzulegen, ob der Nachdruck auf dem Erscheinen oder auf dem Gesehenwerden liegt; die Alternative wird in der Fußnote bewahrt.
- source_word: διὰ τῶν ἀέρων
  choice: durch die Lüfte
  rationale: Der deutsche Plural entspricht dem auffälligen griechischen Plural und klingt in der visionären Schilderung natürlich und würdig.
- source_word: τρέχοντας ἱππεῖς
  choice: Reiter … die … jagten
  rationale: ἱππεῖς bezeichnet berittene Männer; „jagten“ vermittelt die schnelle Bewegung von τρέχω idiomatischer als „liefen“, ohne ausdrücklich einen Angriff hinzuzufügen.
- source_word: διαχρύσους στολὰς ἔχοντας
  choice: goldverzierte Gewänder trugen
  rationale: διαχρύσους bezeichnet mit Gold durchwirkte oder reich mit Gold versehene Kleidung; „goldverziert“ vermeidet die unnötige Festlegung, die Gewänder hätten vollständig aus Gold bestanden.
- source_word: λόγχας
  choice: Lanzen
  rationale: λόγχη kann Speer oder Lanze bedeuten; im Zusammenhang mit Reitern ist „Lanzen“ treffend.
- source_word: σπειρηδὸν
  choice: in Schlachtordnung aufgestellt
  rationale: Das Adverb bezeichnet eine organisierte militärische Formation. Die Wiedergabe macht diese Ordnung deutlich, ohne eine bestimmte Größe der Einheit festzulegen.
- source_word: ἐξωπλισμένους
  choice: bewaffnet
  rationale: Prägnante und natürliche Wiedergabe für das Ausgerüstetsein mit Waffen.
theological_decisions:
- issue: Wirklichkeitsstatus der Himmelserscheinung
  choice: „zu sehen“ mit Fußnote „erschienen“
  alternative: nur „erschienen“ oder ausdrücklich „wurden gesehen“
  rationale: φαίνεσθαι kann sowohl das Erscheinen als auch das Sichtbarwerden beziehungsweise Gesehenwerden hervorheben. Die Übersetzung entscheidet nicht, ob damit eine Vision oder eine gegenständlich anwesende Erscheinung gemeint ist.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdig-erzählerischem Klang. „Durch die Lüfte“ bewahrt die Bildhaftigkeit und den griechischen Plural; „Schlachtordnung“ vermittelt die militärische Organisation, ohne eine konkrete Truppeneinheit zu behaupten.
