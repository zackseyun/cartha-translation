translation:
  language: de
  text: Fast in der ganzen Stadt geschah es, dass vierzig Tage lang Reiter zu sehen waren[a], die durch die Lüfte dahineilten, goldverzierte Gewänder trugen und, in Schlachtordnung aufgestellt[b], mit Lanzen bewaffnet waren.
