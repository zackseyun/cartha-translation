    rationale: „Bei Aretas ... eingeschlossen, floh er“ kann im Deutschen nahelegen, dass die Flucht während der Einschließung geschah. Die griechischen Partizipien können eine Abfolge von Umständen verdichten; Deutsch sollte die Gefangensetzung als vorausgehenden Umstand klarer ausdrücken.
  - severity: low
