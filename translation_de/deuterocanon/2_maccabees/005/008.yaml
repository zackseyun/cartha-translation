base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/005/008.yaml
  text: 'So he met the end of a miserable ruin: confined with Aretas[a], the ruler of the Arabs, fleeing from city to city, pursued by all, hated as an apostate from the laws and abhorred as the destroyer of his homeland and fellow citizens[b], he was driven into Egypt.'
translation:
  language: de
  text: 'So fand er ein elendes Ende: Bei Aretas[a], dem Herrscher der Araber, war er eingeschlossen; er floh von Stadt zu Stadt, wurde von allen verfolgt, als Abtrünniger von den Gesetzen gehasst und als Verderber seiner Heimat und seiner Mitbürger verabscheut und nach Ägypten hinausgetrieben.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dem Tyrannen der Araber“. Das griechische Wort kann „Tyrann“ bedeuten, hier aber auch neutraler einen Herrscher bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „hinausgeworfen“; das griechische Verb ist sehr kräftig und kann bildhaft sogar ein Ausstoßen oder Ausspeien bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πέρας οὖν κακῆς καταστροφῆς ἔτυχεν
  choice: So fand er schließlich ein elendes Ende
  rationale: Die idiomatische Wendung bezeichnet das Erreichen beziehungsweise Erleiden eines schlimmen Ausgangs. Die deutsche Formulierung ist natürlich und bewahrt den wertenden Erzählton.
- source_word: ἐγκλεισθεὶς πρὸς Ἀρέταν
  choice: Bei Aretas eingeschlossen
  rationale: ἐγκλεισθείς bezeichnet Einschließung oder Gefangensetzung, ohne zwingend eine formelle Haft zu meinen. πρός bei einer Person bleibt mit „bei“ hinsichtlich des genauen Verhältnisses offen.
- source_word: τύραννον
  choice: Herrscher
  rationale: τύραννος kann in hellenistischer Zeit einen Machthaber bezeichnen, ohne notwendig die moderne moralische Wertung von „Tyrann“ zu tragen; die Alternative wird in einer Fußnote bewahrt.
- source_word: πόλιν ἐκ πόλεως φεύγων
  choice: floh er von Stadt zu Stadt
  rationale: Die distributive Wendung wird in natürlichem Deutsch genau wiedergegeben.
- source_word: διωκόμενος ὑπὸ πάντων
  choice: von allen verfolgt
  rationale: Die Formulierung bewahrt die konkrete Bedeutung der Verfolgung, ohne sie auf religiöse Verfolgung einzuengen.
- source_word: στυγούμενος ὡς τῶν νόμων ἀποστάτης
  choice: als Abtrünniger von den Gesetzen gehasst
  rationale: „Abtrünniger“ gibt die starke Abkehr von der gesetzlichen und religiösen Ordnung wieder und ist im Deutschen verständlicher und würdevoller als das Fremdwort „Apostat“.
- source_word: βδελυσσόμενος ὡς πατρίδος καὶ πολιτῶν δήμιος
  choice: als Verderber seiner Heimat und seiner Mitbürger verabscheut
  rationale: βδελύσσομαι drückt heftige Abscheu aus. δήμιος kann wörtlich einen Henker, erweitert aber auch einen Verderber oder tödlichen Feind bezeichnen; im parallelen Bezug auf Heimat und Mitbürger ist „Verderber“ natürlich und semantisch tragfähig.
- source_word: εἰς Αἴγυπτον ἐξεβράσθη
  choice: wurde er nach Ägypten hinausgetrieben
  rationale: Das starke Verb ἐκβράζω bezeichnet ein gewaltsames Hinauswerfen oder Ausstoßen. „Hinausgetrieben“ bewahrt Richtung und Nachdruck, ohne die im Deutschen übermäßig bildhafte Wiedergabe „ausgespien“ in den Haupttext zu setzen.
theological_decisions:
- issue: Moralische Charakterisierung des Aretas durch τύραννον
  choice: Herrscher
  alternative: Tyrann
  rationale: Das griechische Wort kann hier als Herrschertitel dienen. Die Übersetzung vermeidet es, eine zusätzliche moralische Verurteilung des Aretas einzutragen, während die lexikalische Alternative in der Fußnote erhalten bleibt.
- issue: Stärke von ἀποστάτης im Verhältnis zu den Gesetzen
  choice: Abtrünniger von den Gesetzen
  alternative: einer, der sich von den Gesetzen losgesagt hatte
  rationale: „Abtrünniger“ bewahrt die schwere religiös-rechtliche Anklage, ohne deren genaue Tragweite dogmatisch weiter auszulegen.
- issue: Bildhaftigkeit des göttlich-moralischen Vergeltungsnarrativs bei ἐξεβράσθη
  choice: nach Ägypten hinausgetrieben
  alternative: nach Ägypten hinausgeworfen / ausgespien
  rationale: Die gewaltsame Erniedrigung bleibt erkennbar, doch die Übersetzung legt nicht fest, ob das bildhafte Verb als ausdrückliches göttliches Handeln oder als geschichtlicher Vorgang zu verstehen ist.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die lange griechische Partizipialkonstruktion wurde durch finite Verben und eine semikolongetrennte Satzfolge lesbar gemacht. Alle in den Fußnoten behandelten Stellen sind im Haupttext markiert.
