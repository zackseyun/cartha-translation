  yaml_path: translation/deuterocanon/2_maccabees/005/014.yaml
  text: 'And in the three whole days[a], eighty thousand were destroyed: forty thousand by violent hands[b], and no fewer than those who were slaughtered were sold.'
translation:
  language: de
  text: 'Im Verlauf dieser insgesamt drei Tage wurden achtzigtausend Menschen zugrunde gerichtet: Vierzigtausend kamen durch gewaltsame Hände[a] um, und nicht weniger als die Hingeschlachteten wurden verkauft.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „unter den Gesetzen der Hände“. Der griechische Ausdruck ist dunkel; er wird hier als Hinweis auf gewaltsame Tötung durch Menschenhand verstanden.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „wurden in die Sklaverei verkauft“. Im Griechischen steht lediglich „wurden verkauft“; Versklavung ist im Zusammenhang vorausgesetzt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀκτὼ ... μυριάδες
  choice: achtzigtausend
  rationale: μυριάς bezeichnet zehntausend; ὀκτὼ μυριάδες wird im natürlichen modernen Deutsch als „achtzigtausend“ wiedergegeben.
- source_word: ἐν ταῖς πάσαις ἡμέραις τρισίν
  choice: im Verlauf dieser insgesamt drei Tage
  rationale: Die Formulierung wahrt den zeitlichen Rahmen und gibt die durch πάσαις betonte Gesamtdauer der drei Tage idiomatisch wieder.
- source_word: κατεφθάρησαν
  choice: wurden ... zugrunde gerichtet
  rationale: Das Verb kann gewaltsame Vernichtung oder umfassendes Verderben bezeichnen. „Zugrunde gerichtet“ umfasst hier sowohl die Getöteten als auch die anschließend genannten Verkauften, ohne alle achtzigtausend ausdrücklich für tot zu erklären.
- source_word: τέσσαρες μὲν
  choice: vierzigtausend
  rationale: Die zuvor genannte Einheit μυριάδες ist elliptisch mitzudenken; vier Myriaden entsprechen vierzigtausend.
- source_word: ἐν χειρῶν νόμοις
  choice: durch Gewalttat
  rationale: Die wörtlich schwer verständliche Wendung („in den Gesetzen der Hände“) bezeichnet im Zusammenhang offenbar gewaltsames Handeln. Die klare Wiedergabe bleibt durch eine Fußnote als Deutung kenntlich.
- source_word: τῶν ἐσφαγμένων
  choice: als hingeschlachtet worden waren
  rationale: σφάζω bezeichnet ein brutales Abschlachten; „hingeschlachtet“ bewahrt die Härte des griechischen Ausdrucks.
- source_word: ἐπράθησαν
  choice: wurden verkauft
  rationale: Das Verb sagt ausdrücklich nur, dass sie verkauft wurden. Die im Kontext naheliegende Versklavung wird nicht in den Haupttext eingefügt, sondern in der Fußnote erläutert.
