translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die ungewöhnliche griechische Wendung ἐν χειρῶν νόμοις wird im Haupttext verständlich wiedergegeben, ihre Unsicherheit jedoch ausdrücklich in der Fußnote bewahrt. Die Satzstruktur hält die erschütternde Zahlengegenüberstellung knapp und deutlich.
