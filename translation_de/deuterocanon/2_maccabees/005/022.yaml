translation_notes:
  register: Modernes, würdiges Standarddeutsch mit enger Bindung an die griechische Satzstruktur. Der Doppelpunkt und das abschließende Semikolon zeigen, dass die Aufzählung über diesen Vers hinaus weitergeführt wird. „Barbarischer“ bewahrt bewusst die polemische Wertung des Ausgangstextes.
