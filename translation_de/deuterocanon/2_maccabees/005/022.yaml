base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/005/022.yaml
  text: 'He also left overseers to mistreat the nation: in Jerusalem[a], Philip, a Phrygian by birth, but in character more barbarous than the one who appointed him[b];'
translation:
  language: de
  text: 'Er ließ auch Aufseher zurück, die das Volk misshandeln sollten[a]: in Jerusalem Philippus, ein Phryger von Herkunft, der seinem Wesen nach jedoch barbarischer war als der, der ihn eingesetzt hatte[b];'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die das Volk unterdrücken sollten“. Der griechische Infinitiv τοῦ κακοῦν kann schädigen, misshandeln oder unterdrücken bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: '„Barbarischer als der, der ihn eingesetzt hatte“ verschärft das moralische Urteil des Erzählers: Philippus wird als noch grausamer dargestellt als derjenige, der ihn eingesetzt hatte.'
    reason: cultural_note
lexical_decisions:
- source_word: κατέλειπεν
  choice: ließ … zurück
  rationale: Das Verb bezeichnet das Zurücklassen beziehungsweise Zurücklassen im Amt. Die Formulierung bewahrt das griechische Bild, während der Zusammenhang die Beauftragung erkennen lässt.
- source_word: ἐπιστάτας
  choice: Aufseher
  rationale: Der Ausdruck bezeichnet Personen, die über andere gesetzt sind. „Aufseher“ gibt die übertragene Vollmacht wieder, ohne ein genaueres Amt vorauszusetzen, als der griechische Text nennt.
- source_word: τοῦ κακοῦν
  choice: die … misshandeln sollten
  rationale: Der substantivierte Infinitiv bezeichnet hier Zweck oder Aufgabe. „Misshandeln“ bringt fortgesetztes schädigendes Vorgehen natürlich zum Ausdruck, ohne es ausschließlich als politische Unterdrückung festzulegen.
- source_word: τὸ γένος
  choice: das Volk
  rationale: Gemeint ist das jüdische Volk als ethnische und gemeinschaftliche Größe. „Volk“ ist im heutigen Deutschen klarer und weniger missverständlich als „Geschlecht“ oder „Rasse“.
- source_word: τὸ μὲν γένος Φρύγα
  choice: von Herkunft ein Phryger
  rationale: Die Wendung bezeichnet die ethnische beziehungsweise geografische Herkunft des Philippus und bildet den Gegensatz zur anschließenden Charakterisierung seines Wesens ab.
- source_word: τὸν δὲ τρόπον
  choice: seinem Wesen nach
  rationale: τρόπος bezeichnet hier Wesensart, Haltung oder Charakter. Die Formulierung stellt die beabsichtigte Gegenüberstellung von Herkunft und Wesen klar heraus.
- source_word: βαρβαρώτερον ἔχοντα
  choice: barbarischer
  rationale: Der Komparativ und die scharfe wertende Sprache des Erzählers bleiben erhalten. „Brutaler“ wäre enger und würde die historische Rhetorik stärker auslegen.
- source_word: τοῦ καταστήσαντος
  choice: als der, der ihn eingesetzt hatte
  rationale: Das Partizip bezeichnet denjenigen, der Philippus in seine Stellung einsetzte. Die Wiedergabe bleibt so nah am Text und lässt die im Vers nicht ausdrücklich genannte Person unbenannt.
