  - marker: b
    text: 'Wörtlicher: „als eine einmütige Zustimmung sichtbar wurde“; das Griechische betont, dass ein Konsens erkennbar geworden war.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πλείονος δὲ γενομένης περὶ τούτων ἐπισκέψεως
  choice: Nachdem diese Fragen eingehender geprüft worden waren
  rationale: Der Genitivus absolutus bezeichnet einen vorausgehenden Umstand. „Eingehender“ bewahrt den komparativen Sinn von πλείονος; ἐπίσκεψις meint hier Prüfung oder Erörterung, nicht Heimsuchung.
- source_word: τοῦ ἡγουμένου
  choice: der Anführer
  rationale: Die substantivierte Partizipialform bezeichnet den Leitenden, ohne ein bestimmtes Amt ausdrücklich festzulegen.
- source_word: τοῖς πλήθεσιν
  choice: die versammelten Menschen
  rationale: Das pluralische πλήθη bezeichnet die anwesenden Menschenmengen. Diese Wiedergabe klingt im modernen Deutschen natürlicher als „den Massen“ und wahrt den kollektiven Sinn.
- source_word: ἀνακοινωσαμένου
  choice: darüber informiert hatte
  rationale: Das Verb bezeichnet das Mitteilen oder Bekanntgeben. „Darüber informiert“ gibt den Bezug auf die beratenen Fragen idiomatisch wieder, ohne eine förmliche Verkündigung vorauszusetzen.
- source_word: φανείσης ὁμοψήφου συγγνώμης
  choice: sich einstimmige Zustimmung zeigte
  rationale: ὁμόψηφος bedeutet sinngemäß „einstimmig“, während συγγνώμη hier Zustimmung beziehungsweise Einverständnis meint. Die Formulierung bewahrt, dass dieser Konsens sichtbar oder erkennbar wurde.
- source_word: ἔνευσαν ταῖς συνθήκαις
  choice: stimmten sie den Bedingungen zu
  rationale: ἔνευσαν bezeichnet zustimmendes Einwilligen, möglicherweise ursprünglich durch ein Zeichen; συνθῆκαι sind vereinbarte Bedingungen oder Abmachungen. Die deutsche Wendung ist präzise und natürlich.
