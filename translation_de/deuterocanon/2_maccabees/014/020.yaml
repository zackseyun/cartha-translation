- from: Nachdem diese Fragen eingehender geprüft worden waren[a], der Anführer die versammelten Menschen darüber informiert hatte und sich einstimmige Zustimmung zeigte[b], stimmten sie den Bedingungen zu.
  to: Nachdem diese Angelegenheiten eingehender erörtert worden waren[a], der Leiter dies den versammelten Menschen mitgeteilt hatte und einstimmige Zustimmung sichtbar geworden war[b], stimmten sie den Vereinbarungen zu.
  rationale: Die Revision behebt die deutsche Satzverknüpfung, ohne die Abfolge oder die drei Genitivus-absolutus-Konstruktionen inhaltlich zu verändern. Zugleich werden „Leiter“ und „Vereinbarungen“ gewählt, um die im Griechischen offene Rollenbezeichnung bzw. den Charakter von συνθῆκαι als vereinbarte Abmachungen genauer wiederzugeben. Beide Fußnotenanker bleiben unmittelbar an den jeweiligen Ausdrücken stehen.
