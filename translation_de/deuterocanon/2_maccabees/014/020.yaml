  source_fidelity: 'Die Grundbedeutung wird getroffen: eingehendere Beratung, Mitteilung an die versammelte Menge, sichtbar gewordene einmütige Zustimmung und Zustimmung zu den συνθῆκαι. Die deutsche Satzfügung des Entwurfs lässt jedoch die zweite und dritte vom griechischen Genitivus absolutus abhängige Voraussetzung syntaktisch unverbunden erscheinen. „Leiter“ ist für ὁ ἡγούμενος weniger unnötig zugespitzt als „Anführer“; „Vereinbarungen“ gibt συνθῆκαι als gegenseitig vereinbarte Abmachungen angemessen wieder.'
