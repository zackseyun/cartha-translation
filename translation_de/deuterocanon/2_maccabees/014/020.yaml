  terminology: „Leiter“ wahrt die Amts- bzw. Rollenoffenheit von ὁ ἡγούμενος. „Einstimmige Zustimmung“ gibt ὁμόψηφος συγγνώμη ohne theologische oder institutionelle Überdeutung wieder. „Vereinbarungen“ ist für συνθῆκαι präzise und natürlicher als ein bloß einseitig klingendes „Bedingungen“.
