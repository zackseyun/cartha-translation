  text: But after fuller consideration of these matters[a], and when the leader had communicated it to the crowds, and unanimous agreement had become evident[b], they assented to the terms.
translation:
  language: de
  text: Nachdem diese Angelegenheiten eingehender erörtert worden waren[a], der Leiter dies den versammelten Menschen mitgeteilt hatte und einstimmige Zustimmung sichtbar geworden war[b], stimmten sie den Vereinbarungen zu.
  philosophy: optimal-equivalence
  footnotes:
