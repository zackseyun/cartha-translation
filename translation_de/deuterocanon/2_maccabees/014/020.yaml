  - severity: low
    issue: „Anführer“ spezifiziert die Rolle stärker als der griechische Ausdruck
    rationale: ὁ ἡγούμενος bezeichnet allgemein den Leitenden. „Leiter“ bewahrt diese Offenheit besser und vermeidet militärische Konnotationen von „Anführer“.
