base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/014/041.yaml
  text: But when the crowds were about to seize the tower[a], and were forcing the courtyard gate, and were ordering that fire be brought and the doors set on fire, he, completely surrounded, put the sword to himself;
translation:
  language: de
  text: Als aber die Menschenmengen im Begriff waren, den Turm einzunehmen, das Hoftor gewaltsam zu öffnen suchten und befahlen, Feuer herbeizubringen und die Tore anzuzünden und zu verbrennen, richtete er, von allen Seiten eingeschlossen, das Schwert gegen sich selbst.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »stürzte er sich in sein Schwert«; auch möglich: »stieß er sich das Schwert in den Leib«. Die ungewöhnliche griechische Wendung bedeutet wörtlich etwa: »Er richtete das Schwert gegen sich selbst.«'
    reason: Der griechische Ausdruck beschreibt die gegen sich selbst gerichtete Verwendung des Schwertes, lässt aber den genauen Bewegungsablauf offen.
lexical_decisions:
- source_word: τῶν ... πληθῶν
  choice: die Menschenmengen
  rationale: πλῆθος bezeichnet eine Menge oder Menschenmenge. Die Wiedergabe vermeidet die abwertende Zusatzbedeutung von »Mob«.
- source_word: μελλόντων
  choice: im Begriff waren
  rationale: Die Konstruktion bezeichnet eine unmittelbar bevorstehende Handlung, nicht bereits deren Vollendung.
- source_word: τὸν πύργον καταλαβέσθαι
  choice: den Turm einzunehmen
  rationale: καταλαμβάνω meint hier, den Turm in Besitz zu bringen beziehungsweise zu erobern; »einnehmen« ist im Belagerungskontext natürlich.
- source_word: τὴν αὐλαίαν θύραν
  choice: das Hoftor
  rationale: αὐλαία weist auf den Hofbereich, θύρα in diesem baulichen Zusammenhang auf ein Tor.
- source_word: βιαζομένων
  choice: gewaltsam aufzubrechen
  rationale: Das Verb bezeichnet die Anwendung von Gewalt. Im Zusammenhang mit einem Tor bringt »gewaltsam aufbrechen« den konkreten Vorgang verständlich zum Ausdruck.
- source_word: κελευόντων πῦρ προσάγειν
  choice: befahlen, Feuer herbeizubringen
  rationale: Die Übersetzung bewahrt sowohl das ausdrückliche Befehlen als auch das Heranbringen des Feuers.
- source_word: τὰς θύρας ὑφάπτειν καὶ τὰς θύρας φλέγειν
  choice: die Tore anzuzünden und in Brand zu setzen
  rationale: Die beiden nahezu gleichbedeutenden griechischen Verben werden nicht zu einem einzigen Ausdruck zusammengezogen; so bleibt die rhetorische Häufung erhalten.
- source_word: περικάλυπτος γενόμενος
  choice: von allen Seiten eingeschlossen
  rationale: Im Angriffskontext bezeichnet die Wendung, dass Razis vollständig umringt beziehungsweise eingeschlossen war.
- source_word: ὑπέθηκεν ἑαυτῷ τὸ ξίφος
  choice: setzte ... das Schwert gegen sich selbst
  rationale: Die Formulierung bleibt nahe an der ungewöhnlichen griechischen Wendung und legt die genaue Körperbewegung nicht eindeutiger fest als der Ausgangstext.
theological_decisions:
- issue: Darstellung der Selbsttötung des Razis
  choice: setzte er ... das Schwert gegen sich selbst
  alternative: stürzte er sich in sein Schwert / stieß er sich das Schwert in den Leib
  rationale: Die ethisch und erzählerisch gewichtige Handlung wird weder beschönigt noch in ihrem genauen Bewegungsablauf über den griechischen Wortlaut hinaus festgelegt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der lange Satzbau folgt dem raschen Ablauf des griechischen Berichts, bleibt jedoch durch klare Infinitivgruppen verständlich. Die doppelte Brandformulierung bewahrt die rhetorische Häufung des Ausgangstextes.
