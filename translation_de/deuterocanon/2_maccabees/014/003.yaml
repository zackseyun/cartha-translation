base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/014/003.yaml
  text: But a certain Alcimus[a], who had formerly become high priest and had willingly defiled himself in the times of separation, realized that in no way was there safety for him, nor any longer access to the holy altar,
translation:
  language: de
  text: Ein gewisser Alkimos, der früher Hoher Priester gewesen war und sich in den Zeiten der Absonderung[a] freiwillig verunreinigt hatte, erkannte jedoch, dass es für ihn auf keinerlei Weise Rettung und auch keinen Zugang mehr zum heiligen Altar gab,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »in den Zeiten des Abfalls«. Der griechische Ausdruck lautet wörtlich etwa »in den Zeiten der Nichtvermischung« beziehungsweise »der Absonderung« und kann hier eine Zeit religiöser Verunreinigung und Entfremdung bezeichnen.'
    reason: Lexikalische Alternative und Bewahrung der historisch-kontextuellen Mehrdeutigkeit von ἀμιξία.
lexical_decisions:
- source_word: Ἄλκιμος
  choice: Alkimos
  rationale: Der griechische Personenname wird in einer dem Ausgangstext nahen deutschen Form transliteriert.
- source_word: προγεγονὼς ἀρχιερεύς
  choice: der zuvor Hoher Priester geworden war
  rationale: Die verbale Bedeutung des Partizips προγεγονώς wird bewahrt; die Formulierung bezeichnet einen bereits zuvor eingetretenen Status.
- source_word: ἑκουσίως
  choice: freiwillig
  rationale: Das Adverb kennzeichnet die Verunreinigung als bewusst und aus eigenem Willen erfolgt.
- source_word: μεμολυσμένος
  choice: sich ... verunreinigt hatte
  rationale: Das Perfektpartizip bezeichnet eine vollzogene Verunreinigung mit fortwirkendem Zustand und kann sowohl kultische als auch moralische Unreinheit umfassen.
- source_word: ἐν τοῖς τῆς ἀμιξίας χρόνοις
  choice: in den Zeiten der Absonderung
  rationale: ἀμιξία bezeichnet wörtlich Nichtvermischung beziehungsweise Absonderung. Die Übersetzung hält diese ungewöhnliche und kontextuell offene Bezeichnung sichtbar.
- source_word: συννοήσας
  choice: erkannte
  rationale: Das Partizip beschreibt, dass Alkimos seine aussichtslose Lage einsah; im Deutschen wird es für einen natürlichen Satzbau als finites Verb wiedergegeben.
- source_word: καθʼ ὁντιναοῦν τρόπον
  choice: auf keinerlei Weise
  rationale: In Verbindung mit der Verneinung wird jede denkbare Möglichkeit ausgeschlossen.
- source_word: σωτηρία
  choice: Rettung
  rationale: Der Kontext legt Schutz, Bewahrung oder Entkommen nahe; „Rettung“ wahrt zugleich die semantische Breite des griechischen Wortes, ohne es ausdrücklich auf das ewige Heil festzulegen.
- source_word: πρὸς τὸ ἅγιον θυσιαστήριον ἔτι πρόσοδος
  choice: auch keinen Zugang mehr zum heiligen Altar
  rationale: πρόσοδος bezeichnet Zugang oder Zutritt; ἔτι mit der Verneinung wird idiomatisch durch „nicht/keinen ... mehr“ ausgedrückt.
theological_decisions:
- issue: Bedeutung von ἀμιξία im religionsgeschichtlichen Zusammenhang
  choice: Zeiten der Absonderung
  alternative: Zeiten des Abfalls; Zeit der Ausgrenzung
  rationale: Der Ausdruck bezeichnet wörtlich Nichtvermischung oder Absonderung, doch seine genaue historische und religiöse Wertung ist unsicher. Der Haupttext vermeidet daher, die Stelle eindeutig als „Abfall“ zu deuten; eine Fußnote nennt diese kontextuell mögliche Lesart.
- issue: Bedeutung von σωτηρία
  choice: Rettung
  alternative: Sicherheit; Heil
  rationale: Gemeint ist im unmittelbaren Zusammenhang wahrscheinlich Alkimos’ persönliche Bewahrung oder ein Ausweg aus seiner Lage. „Rettung“ bleibt breit genug, ohne eine ausschließlich soteriologische Bedeutung festzuschreiben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Partizipialstruktur wurde zur besseren Verständlichkeit teilweise in Relativ- und Hauptsatzformen überführt. Das abschließende Komma bleibt stehen, weil der Vers syntaktisch in den folgenden Vers weiterführt.
