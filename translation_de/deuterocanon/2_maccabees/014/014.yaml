base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/014/014.yaml
  text: But those in Judea who had driven Judas out kept flocking in droves to Nicanor from among the nations[a], thinking that the misfortunes and disasters of the Jews would become their own prosperity.
translation:
  language: de
  text: Die aber, die vor Judas aus Judäa geflohen waren, schlossen sich Nikanor scharenweise zusammen mit den Völkern[a] an, weil sie meinten, das Unglück und die Katastrophen der Juden würden ihnen selbst zum Wohlergehen gereichen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „schlossen sich Nikanor scharenweise aus den Völkern an“. Die gedrängte griechische Konstruktion mit ἔθνη („Völker“, in jüdischem Zusammenhang oft „Heiden“) lässt die genaue Zuordnung offen.'
    reason: lexikalische und syntaktische Alternative
lexical_decisions:
- source_word: οἱ ... πεφυγαδευκότες τὸν Ἰούδαν
  choice: diejenigen, die ... Judas vertrieben hatten
  rationale: 'Das Perfektpartizip von φυγαδεύω ist kausativ: Sie hatten Judas zur Flucht gezwungen beziehungsweise vertrieben. „Vertrieben hatten“ wahrt diese Bedeutung knapp und natürlich.'
- source_word: ἐπὶ τῆς Ἰουδαίας
  choice: in Judäa
  rationale: Die Präpositionalfügung bezeichnet am natürlichsten den Aufenthalts- beziehungsweise Handlungsbereich der genannten Gegner. Wegen der möglichen Verbindung mit πεφυγαδευκότες bleibt die Ortsbeziehung jedoch syntaktisch nicht völlig eindeutig.
- source_word: συνέμιγνυν ἀγεληδόν
  choice: schlossen sich scharenweise ... an
  rationale: συνέμιγνυν bedeutet wörtlich „vermischten/verbanden sich“, während ἀγεληδόν die massenhafte, herdenartige Bewegung bezeichnet. „Scharenweise anschließen“ gibt beides in gegenwärtigem Deutsch wieder.
- source_word: ἔθνη
  choice: den Völkern
  rationale: ἔθνη kann in jüdischem Kontext „Heiden“ bedeuten, heißt lexikalisch aber zunächst „Völker“. Da die gedrängte Konstruktion mehrere syntaktische Zuordnungen zulässt, vermeidet „Völker“ eine vorschnelle ethnisch-theologische Festlegung.
- source_word: τῷ Νικάνορι
  choice: Nikanor
  rationale: Der Dativ bezeichnet bei συνέμιγνυν denjenigen, dem sie sich anschlossen. Im Deutschen verlangt „sich anschließen“ den Dativ.
- source_word: ἀτυχίας καὶ συμφοράς
  choice: das Unglück und die Katastrophen
  rationale: 'Die beiden Ausdrücke werden unterschieden: ἀτυχία bezeichnet Missgeschick oder Unglück, συμφορά schweres Unheil beziehungsweise Katastrophen. Der Singular „Unglück“ ist im Deutschen idiomatisch, obwohl das Griechische den Plural hat.'
- source_word: ἰδίας εὐημερίας
  choice: ihnen selbst zum Wohlergehen
  rationale: εὐημερία bezeichnet Wohlergehen oder Gedeihen. Die Konstruktion „zum Wohlergehen gereichen“ bildet den erwarteten Vorteil ab, ohne eine buchstäbliche Verwandlung des jüdischen Unheils in eigenen Wohlstand zu behaupten.
- source_word: δοκοῦντες ἔσεσθαι
  choice: weil sie meinten, ... würden ... gereichen
  rationale: Das Partizip mit Futurinfinitiv drückt ihre subjektive Erwartung aus. „Weil sie meinten“ macht den gedanklichen Beweggrund verständlich und bewahrt die Zukunftsperspektive im Konjunktiv.
theological_decisions:
- issue: Bedeutung und syntaktische Zuordnung von ἔθνη
  choice: zusammen mit den Völkern Nikanor anschließen
  alternative: als Angehörige der Völker scharenweise zu Nikanor strömen
  rationale: Die griechische Wortfolge οἱ ... ἔθνη συνέμιγνυν ... τῷ Νικάνορι ist gedrängt. ἔθνη kann als mitverbundene Gruppe oder appositionell/prädikativ verstanden werden. Der Haupttext folgt der engeren Bedeutung von συμμείγνυμι „sich mit jemandem verbinden“ und dokumentiert die andere Möglichkeit in der Fußnote, ohne „Völker“ automatisch als „Heiden“ festzulegen.
- issue: Moralische Bewertung der Gegner
  choice: ihre Erwartung wird als eigennützig beschrieben, aber nicht zusätzlich kommentiert
  alternative: explizit abwertende Bezeichnung als Verräter oder Gottlose
  rationale: Der Text stellt ihren Opportunismus durch den Gegensatz zwischen jüdischem Unheil und eigenem Wohlergehen deutlich heraus. Eine darüber hinausgehende konfessionelle oder moralische Etikettierung wäre ein Zusatz.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Scharenweise“ bewahrt das anschauliche ἀγεληδόν, ohne das im Deutschen stark tierisch-abwertende „herdenweise“ zu erzwingen. Die Fußnote hält die echte syntaktische Mehrdeutigkeit offen.
