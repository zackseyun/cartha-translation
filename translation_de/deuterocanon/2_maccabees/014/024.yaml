  text: And he kept Judas continually before him[b][a]; he was inwardly drawn to the man.
translation:
  language: de
  text: Und er hatte Judas ständig vor Augen[a]; innerlich war er dem Mann zugetan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Er hatte Judas stets bei sich.“ Die griechische Wendung kann sowohl körperliche Nähe als auch fortwährende Aufmerksamkeit bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Er fühlte sich innerlich zu dem Mann hingezogen“ beziehungsweise „Er empfand tiefe Zuneigung zu dem Mann.“ Die griechischen Wörter bezeichnen eine innere, gefestigte Neigung, ohne deren genaue Art eindeutig festzulegen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶχεν ... ἐν προσώπῳ
  choice: hatte ... vor Augen
  rationale: Die Wendung bewahrt das Bild des griechischen Ausdrucks und lässt wie das Original offen, ob Judas sich fortwährend in seiner Gegenwart befand oder beständig Gegenstand seiner Aufmerksamkeit war.
- source_word: διὰ παντός
  choice: ständig
  rationale: Die Formulierung gibt die anhaltende beziehungsweise immer wiederkehrende Nähe oder Aufmerksamkeit in natürlichem modernem Deutsch wieder.
- source_word: ψυχικῶς
  choice: innerlich
  rationale: Das ungewöhnliche, von ψυχή abgeleitete Adverb bezeichnet hier eine innere, persönliche Haltung. „Innerlich“ bewahrt diesen Bezug, ohne im Deutschen eine unnatürliche Wendung wie „in seiner Seele“ zu erzwingen.
- source_word: προσεκέκλιτο
  choice: war ... zugetan
  rationale: Die Form beschreibt eine gefestigte Neigung oder wohlwollende Verbundenheit. „Zuge­tan“ drückt diese bleibende Haltung aus, ohne sie als förmliches Bündnis oder ausdrücklich romantische Zuneigung festzulegen.
- source_word: τῷ ἀνδρί
  choice: dem Mann
  rationale: Die ausdrückliche Wiedergabe entspricht dem griechischen Wortlaut und hebt Judas als Person leicht hervor.
