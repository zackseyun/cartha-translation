  to: Ein gewisser Rasis, einer der Ältesten aus Jerusalem, wurde Nikanor als ein Mann angezeigt[a], der seiner Stadt treu ergeben[b] war und sehr hohes Ansehen genoss und der wegen seines Wohlwollens »Vater der Juden« genannt wurde.
