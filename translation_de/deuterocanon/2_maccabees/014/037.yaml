base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/014/037.yaml
  text: A certain Razis[a], one of the elders from Jerusalem, was reported to Nicanor—a man devoted to his city and very highly regarded[b], and because of his goodwill called the father of the Jews.
translation:
  language: de
  text: Ein gewisser Rasis, einer der Ältesten aus Jerusalem, wurde Nikanor als ein Mann angezeigt[a], der seiner Stadt treu ergeben[b] war und sehr hohes Ansehen genoss und der wegen seines Wohlwollens »Vater der Juden« genannt wurde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: »wurde Nikanor gemeldet«. Das griechische Verb kann in diesem feindseligen Zusammenhang eine belastende Anzeige bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »seine Stadt liebend«; gemeint ist seine Hingabe an das Wohl seiner Stadt und ihrer Gemeinschaft.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ῥαζεὶς
  choice: Rasis
  rationale: Der Personenname wird nach der im Deutschen üblichen Form wiedergegeben und nicht übersetzt.
- source_word: πρεσβυτέρων
  choice: Ältesten
  rationale: Der Ausdruck bezeichnet hier am ehesten anerkannte ältere beziehungsweise führende Mitglieder der Jerusalemer Gemeinschaft, nicht nur alte Männer.
- source_word: ἐμηνύθη
  choice: wurde bei Nikanor angezeigt
  rationale: Das Passiv bezeichnet eine Mitteilung an Nikanor; im feindseligen Kontext liegt der Sinn einer belastenden Anzeige nahe, ohne dass ein förmliches Gerichtsverfahren vorausgesetzt wird.
- source_word: φιλοπολίτης
  choice: seiner Stadt treu ergeben
  rationale: Das Kompositum bezeichnet einen Menschen, der seine Polis liebt und sich ihrem Wohl verpflichtet weiß. Die Wiedergabe vermeidet den möglicherweise anachronistischen Ausdruck »patriotisch«.
- source_word: σφόδρα καλῶς ἀκούων
  choice: genoss höchstes Ansehen
  rationale: Die griechische Wendung bezeichnet einen ausgesprochen guten Ruf und hohes öffentliches Ansehen.
- source_word: εὔνοιαν
  choice: Wohlwollen
  rationale: Das Substantiv bezeichnet eine wohlwollende, gütige Haltung und erklärt hier den Ehrennamen.
- source_word: πατὴρ τῶν Ἰουδαίων
  choice: »Vater der Juden«
  rationale: Die Formulierung ist als ehrende Bezeichnung, nicht als Aussage biologischer Vaterschaft, zu verstehen.
- source_word: προσαγορευόμενος
  choice: wurde ... genannt
  rationale: Das Partizip bezeichnet eine gebräuchliche Anrede oder Benennung.
theological_decisions:
- issue: Ehrende Darstellung des Rasis
  choice: Die positiven bürgerlichen und gemeinschaftlichen Charakterisierungen werden ohne Abschwächung wiedergegeben.
  alternative: Deutender mit »Patriot« oder »Wohltäter des Volkes« übersetzen.
  rationale: Der griechische Text zeichnet Rasis ausdrücklich in hohem Ansehen; zugleich sollte die Übersetzung keine ideologisch oder theologisch weitergehenden Titel hinzufügen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die beiden koordinierenden Partizipialbeschreibungen werden zur besseren Verständlichkeit in selbstständigen Sätzen wiedergegeben; die stark positive Würdigung und der kausale Zusammenhang bleiben erhalten.
