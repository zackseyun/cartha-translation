base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/014/030.yaml
  text: But Maccabaeus[a], perceiving from Nicanor’s actions toward him that he had assumed a harsher than usual manner, and understanding that this severity did not come from the better course, gathered not a few of his men and kept himself hidden from Nicanor.
translation:
  language: de
  text: Als Makkabäus jedoch an Nikanors Verhalten ihm gegenüber erkannte, dass er bei der sonst üblichen Begegnung schroffer auftrat, und begriff, dass diese Strenge nicht aus guter Absicht kam[a], scharte er nicht wenige seiner Männer um sich und hielt sich vor Nikanor verborgen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dass diese Strenge nicht zum Besten war“. Die griechische Wendung kann sich auf Nikanors Absicht oder auf die Angemessenheit beziehungsweise Zweckmäßigkeit seines Vorgehens beziehen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: αἰσθητήριον διεξαγαγόντος ... τὰ πρὸς αὐτόν
  choice: an Nikanors Verhalten ihm gegenüber
  rationale: Die schwierige Wortverbindung bezeichnet im Zusammenhang die wahrnehmbare Haltung beziehungsweise das gezeigte Verhalten Nikanors gegenüber Makkabäus. Die deutsche Fassung gibt dies natürlich wieder, ohne ein bloßes Wahrnehmungsvermögen anzunehmen.
- source_word: συνιδὼν
  choice: erkannte
  rationale: Das Partizip beschreibt ein einsichtiges Wahrnehmen aufgrund von Nikanors Verhalten, nicht nur ein äußeres Sehen.
- source_word: τὴν ἠθισμένην ἀπάντησιν ἀγριωτέρως ἐσχηκότα
  choice: dass dessen sonst übliche Art der Begegnung schroffer geworden war
  rationale: ἀπάντησις bezeichnet hier die Begegnung beziehungsweise das Auftreten bei einer Begegnung; der Komparativ markiert eine merklich rauere oder schroffere Haltung als zuvor.
- source_word: νοήσας
  choice: begriff
  rationale: Das Wort bezeichnet die aus den Beobachtungen gezogene verständige Folgerung.
- source_word: οὐκ ἀπὸ τοῦ βελτίστου τὴν αὐστηρίαν εἶναι
  choice: dass diese Strenge nicht aus guter Absicht kam
  rationale: Die idiomatische Wendung lässt sowohl eine Deutung auf die Beweggründe als auch auf das zweckmäßig Gute zu. Im Haupttext steht eine natürliche, motivbezogene Fassung; die Fußnote bewahrt die andere Möglichkeit.
- source_word: συστρέψας οὐκ ὀλίγους τῶν περὶ αὐτὸν
  choice: scharte er nicht wenige seiner Männer um sich
  rationale: συστρέφω bezeichnet das Zusammenziehen einer Gruppe; die Litotes οὐκ ὀλίγους bleibt als „nicht wenige“ erhalten, und der militärische Zusammenhang legt „seiner Männer“ nahe.
- source_word: συνεκρύπτετο τὸν Νικάνορα
  choice: hielt sich vor Nikanor verborgen
  rationale: Das Imperfekt drückt fortdauernde Verborgenheit aus; die reflexive deutsche Wendung gibt den medialen Sinn idiomatisch wieder.
theological_decisions:
- issue: Mehrdeutigkeit von οὐκ ἀπὸ τοῦ βελτίστου
  choice: nicht aus guter Absicht
  alternative: nicht zum Besten / nicht der besten Vorgehensweise entsprechend
  rationale: Der Kontext erlaubt eine Aussage über Nikanors Beweggrund, doch die griechische Wendung kann ebenso auf den Nutzen oder die richtige Vorgehensweise zielen. Diese Spannung wird durch die Fußnote offengehalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Makkabäus“ und „Nikanor“ folgen den im Deutschen geläufigen Namensformen. Der Satzbau bewahrt die Abfolge von Wahrnehmung, Schlussfolgerung und taktischer Reaktion, wird aber für heutige Leser leicht gegliedert.
