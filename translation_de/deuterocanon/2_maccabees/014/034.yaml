base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/014/034.yaml
  text: 'After saying these things[a], he went away. But the priests, stretching out their hands toward heaven, were calling on the one who is always the champion of our nation, saying these things:'
translation:
  language: de
  text: 'Nachdem er dies gesagt hatte, ging er weg. Die Priester aber streckten ihre Hände zum Himmel aus und riefen den an, der allezeit für unser Volk kämpft,[a] und sprachen:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »der allezeit unser Volk verteidigt«; das griechische Wort bezeichnet einen Kämpfer, der für andere eintritt und sie verteidigt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοσαῦτα ... εἰπὼν
  choice: Nachdem er dies gesagt hatte
  rationale: Gibt das temporale Partizip idiomatisch wieder; »dies« verweist knapp und eindeutig auf die vorausgehende Rede.
- source_word: ἀπῆλθεν
  choice: ging er weg
  rationale: Schlichte, gegenwartssprachliche Wiedergabe des erzählenden Verbs der Entfernung.
- source_word: προτείναντες τὰς χεῖρας εἰς τὸν οὐρανόν
  choice: streckten ihre Hände zum Himmel aus
  rationale: Bewahrt die ausdrücklich beschriebene Gebetsgeste und ihre Richtung.
- source_word: ἐπεκαλοῦντο
  choice: riefen ... an
  rationale: »Anrufen« ist im Deutschen für einen Gebetsruf natürlich und gibt das Imperfekt im Erzählzusammenhang angemessen wieder.
- source_word: τὸν διὰ παντὸς ὑπέρμαχον τοῦ ἔθνους ἡμῶν
  choice: den, der allezeit für unser Volk kämpft
  rationale: Bewahrt sowohl die dauernde Hilfe (διὰ παντός) als auch den martialisch-schützenden Sinn von ὑπέρμαχος; »Volk« bezeichnet hier die jüdische Gemeinschaft natürlicher als »Nation«.
- source_word: ταῦτα λέγοντες
  choice: und sprachen
  rationale: Leitet die unmittelbar folgende Gebetsrede würdig und idiomatisch ein, ohne den im Deutschen schwerfälligen Ausdruck »indem sie dies sagten« zu wiederholen.
theological_decisions:
- issue: Gottesbezeichnung τὸν διὰ παντὸς ὑπέρμαχον
  choice: der allezeit für unser Volk kämpft
  alternative: der allezeit der Verteidiger unseres Volkes ist
  rationale: Die verbale Fassung erhält die aktive, kampfbezogene Schutzfunktion des griechischen ὑπέρμαχος. Sie legt nicht fest, auf welche Weise Gott kämpft oder schützt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur folgt dem griechischen Ablauf, vermeidet aber unnatürliche Partizipialhäufungen. »Allezeit« wahrt den gehobenen Gebetsregisterton, ohne altertümlich zu wirken.
