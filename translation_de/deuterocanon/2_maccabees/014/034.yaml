  source_fidelity: 'Die Übersetzung gibt den Ablauf und die Syntax des griechischen Textes zuverlässig wieder: das vorzeitige Partizip εἰπών, die Abreise, die zum Himmel ausgestreckten Hände, das anhaltende Anrufen und die Einleitung der folgenden Rede. „der allezeit für unser Volk kämpft“ trifft den fortdauernden, kämpferisch-schützenden Sinn von διὰ παντὸς ὑπέρμαχον angemessen.'
  naturalness: Modernes, gut lesbares Standarddeutsch mit einem für Gebet und Erzählung passenden würdigen Ton. „Allezeit“ ist leicht gehoben, aber in diesem Kontext natürlich und nicht unverständlich. Die abschließende Formel „und sprachen:“ ist idiomatisch und führt klar in den folgenden Vers.
  terminology: „Volk“ ist für ἔθνος im jüdischen Kontext eine natürliche und sachgerechte Wahl. „anrufen“ ist als Bezeichnung des Gebetsrufs treffend. Die gewählte verbale Wiedergabe von ὑπέρμαχος bewahrt dessen aktiven Schutz- und Kampfbezug; die Fußnote bietet mit „verteidigt“ eine sinnvolle lexikalische Alternative.
