  text: he came to King Demetrius in the one hundred fifty-first year, bringing him a gold crown and a palm branch, and besides these the customary offerings from the temple foliage; and on that day he kept quiet.
translation:
  language: de
  text: Im einhunderteinundfünfzigsten Jahr kam er zu König Demetrius und brachte ihm eine goldene Krone, einen Palmzweig und außerdem die üblichen Gaben, nämlich grüne Zweige vom Tempel.[a] An jenem Tag verhielt er sich ruhig.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und außerdem die herkömmlichen Gaben aus grünen Zweigen des Tempels“. Der griechische Ausdruck ist knapp und mehrdeutig.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „er hatte/bewahrte Ruhe“. Im Zusammenhang kann dies bedeuten, dass er an diesem Tag nichts weiter unternahm oder noch keine Anklage vorbrachte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθεν πρὸς τὸν βασιλέα Δημήτριον
  choice: kam er zu König Demetrius
  rationale: ἔρχομαι mit πρός und Akkusativ bezeichnet hier die Bewegung auf den König zu; die deutsche Wendung ist natürlich und bewahrt die Erzählperspektive.
- source_word: ὡς πρώτῳ καὶ ἑκατοστῷ καὶ πεντηκοστῷ ἔτει
  choice: Im einhunderteinundfünfzigsten Jahr
  rationale: Die Wortgruppe dient als chronologische Jahresangabe. Das in dieser Formel stehende ὡς muss im Deutschen nicht eigens mit „etwa“ wiedergegeben werden.
- source_word: προσάγων αὐτῷ
  choice: brachte ihm
  rationale: Das begleitende Partizip bezeichnet die mitgebrachten beziehungsweise vor den König gebrachten Gegenstände.
- source_word: στέφανον χρυσοῦν
  choice: eine goldene Krone
  rationale: στέφανος kann Kranz oder Krone bedeuten; als höfische Gabe aus Gold ist „goldene Krone“ im Deutschen am klarsten.
- source_word: φοίνικα
  choice: einen Palmzweig
  rationale: φοῖνιξ bezeichnet hier nach dem Zusammenhang einen zeremoniell verwendeten Zweig der Palme.
- source_word: πρὸς δὲ τούτοις τοῖς νομιζομένοις θαλλῶν τοῦ ἱεροῦ
  choice: und außerdem die üblichen Gaben, nämlich grüne Zweige vom Tempel
  rationale: Der griechische Ausdruck ist gedrängt und elliptisch. τοῖς νομιζομένοις bezeichnet das Herkömmliche oder Übliche, θαλλῶν frische Triebe beziehungsweise grüne Zweige; „nämlich“ macht die wahrscheinlich appositionelle Beziehung lesbar, ohne die Unsicherheit zu verschweigen.
- source_word: καὶ τὴν ἡμέραν ἐκείνην ἡσυχίαν ἔσχεν
  choice: An jenem Tag jedoch hielt er sich noch zurück
  rationale: ἡσυχίαν ἔχειν bedeutet stillhalten beziehungsweise untätig bleiben. Im Kontext ist gemeint, dass er an diesem Tag noch nicht weiter gegen Judas vorging; „hielt er sich noch zurück“ gibt das idiomatisch wieder, ohne ein bloßes Schweigen zu behaupten.
