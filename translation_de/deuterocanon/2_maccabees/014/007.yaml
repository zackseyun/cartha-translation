  text: to obtain stability for the kingdom. Therefore[a], having taken away the ancestral
translation:
  language: de
  text: damit das Königreich Stabilität erlangt. Deshalb[a] nahm er das von den Vorfahren stammende …
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der hier vorliegende griechische Text ist nur fragmentarisch erhalten und bricht offenbar mitten im Satz nach „das von den Vorfahren stammende …“ ab. Übersetzt wird deshalb nur der Wortlaut des überlieferten Zeugen; das fehlende Bezugswort wird nicht ergänzt.
    reason: textual_variant
lexical_decisions:
- source_word: βασιλείαν
  choice: das Königreich
  rationale: Der Akkusativ bezeichnet das, dem Stabilität zukommen soll. „Königreich“ lässt sowohl das Herrschaftsgebiet als auch dessen politische Ordnung anklingen, ohne einseitig nur das Königtum zu meinen.
- source_word: εὐσταθείας
  choice: Stabilität
  rationale: Das Substantiv bezeichnet Festigkeit oder einen gesicherten Zustand; im politischen Zusammenhang ist „Stabilität“ die natürliche moderne Wiedergabe.
- source_word: τυχεῖν
  choice: erlangt
  rationale: Der Infinitiv bedeutet hier „erlangen/teilhaftig werden“. Im deutschen Finalsatz fügt sich „erlangt“ natürlich ein und bewahrt den Gedanken des Erreichens eines gewünschten Zustands.
- source_word: ὅθεν
  choice: Deshalb
  rationale: Das Adverb führt hier eine Folgerung aus dem Vorhergehenden ein; „Deshalb“ gibt diese kausal-konsekutive Beziehung klar wieder.
- source_word: ἀφελόμενος
  choice: nahm …
  rationale: Das Partizip von ἀφαιρέω bedeutet „wegnehmen/entziehen“. Eine finite Wiedergabe ist im Deutschen natürlicher; wegen des abgebrochenen Textes bleibt offen, wie die Konstruktion zu vervollständigen wäre.
- source_word: προγονικὴν
  choice: das von den Vorfahren stammende …
  rationale: Das substantivisch gebrauchte feminine Adjektiv bezeichnet etwas Überliefertes oder von den Vorfahren Stammendes. Da das Bezugswort im vorliegenden Fragment fehlt, vermeidet diese Formulierung die Ergänzung eines nicht bezeugten Substantivs.
