  text: For he thought that by arresting him he would bring disaster on these people[a].
translation:
  language: de
  text: Denn er meinte, er werde diesen Leuten durch die Festnahme jenes Mannes Unheil zufügen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder formnäher: „Denn er meinte, nachdem er jenen ergriffen hatte, diesen Leuten Unheil zu bewirken.“'
    reason: Die Alternative macht die griechische Partizipialkonstruktion sowie die demonstrativen Bezüge von ἐκεῖνον und τούτοις sichtbar. Der Haupttext gibt die Beziehung der Festnahme zum beabsichtigten Unheil idiomatisch als Mittelangabe wieder.
lexical_decisions:
- source_word: ἔδοξεν
  choice: er meinte
  rationale: Das Verb bezeichnet hier die Einschätzung oder Erwartung des Handelnden. „Er meinte“ ist im Deutschen natürlich und lässt die im Griechischen mögliche Nuance zwischen Urteil und Entschluss weitgehend offen.
- source_word: συλλαβών
  choice: wenn er ihn festnähme
  rationale: Das Partizip bezeichnet hier das Ergreifen einer Person zum Zweck des Gewahrsams. Die konditionale Wiedergabe mit Konjunktiv macht deutlich, dass die Festnahme zu diesem Zeitpunkt beabsichtigt beziehungsweise vorgestellt ist.
- source_word: ἐκεῖνον
  choice: ihn
  rationale: Das Demonstrativpronomen verweist auf den zuvor genannten Mann. Im Deutschen ist das Pronomen in diesem Zusammenhang natürlicher als das betonte „jenen“.
- source_word: τούτοις
  choice: diesen Leuten
  rationale: Der Dativ bezeichnet die von dem Unheil betroffene Gruppe. „Diesen Leuten“ bewahrt den demonstrativen Bezug und vermeidet eine unnötige Beschränkung auf erwachsene Männer.
- source_word: ἐνεργάσασθαι
  choice: zuzufügen
  rationale: Das Verb bedeutet hier, etwas zu bewirken oder herbeizuführen. Zusammen mit „Unheil“ gibt „zufügen“ die kausative Bedeutung idiomatisch wieder.
- source_word: συμφοράν
  choice: Unheil
  rationale: Das Substantiv bezeichnet schweres Unglück, Schaden oder eine Katastrophe. „Unheil“ passt zum gehobenen Erzählregister und lässt Art und Ausmaß des beabsichtigten Schadens offen.
