translation:
  language: de
  text: weil er lieber in Würde sterben wollte, als diesen Verbrechern in die Hände zu fallen und auf eine Weise entehrend behandelt zu werden, die seiner eigenen Würde nicht entsprach.[a]
  philosophy: optimal-equivalence
  footnotes:
