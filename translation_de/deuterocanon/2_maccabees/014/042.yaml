    text: 'Oder: »misshandelt« oder »beleidigt«; das griechische Verb kann allgemein eine überhebliche, demütigende Behandlung bezeichnen und ist nicht auf Beschimpfungen oder körperliche Misshandlung beschränkt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐγενῶς
  choice: in Würde
  rationale: Das Adverb bezeichnet ein Sterben, das edler Haltung oder Herkunft entspricht. »In Würde« ist im modernen Deutschen natürlich und hält zusammen mit εὐγενείας das Leitmotiv der Würde fest.
- source_word: θέλων
  choice: weil er … wollte
  rationale: Das Partizip drückt hier Absicht beziehungsweise bewusste Entscheidung aus; die kausale Wiedergabe fügt sich natürlich in den deutschen Satzanschluss ein.
- source_word: ἀποθανεῖν
  choice: sterben
  rationale: Schlichte und genaue Wiedergabe des Infinitivs.
- source_word: ἤπερ
  choice: lieber … als
  rationale: Die Konstruktion bringt die bewusste Bevorzugung des Todes gegenüber der Unterwerfung zum Ausdruck.
- source_word: ἀλιτηρίοις
  choice: diesen Verbrechern
  rationale: Das stark abwertende Wort bezeichnet schuldige, ruchlose Menschen. »Verbrecher« gibt die moralische und mögliche rechtliche Verurteilung verständlich wieder.
- source_word: ὑποχείριος γενέσθαι
  choice: in die Hände zu fallen
  rationale: Die griechische Wendung bedeutet, unter die Gewalt oder Verfügungsgewalt anderer zu geraten; die deutsche Redensart vermittelt den feindlichen Zugriff treffend.
- source_word: τῆς ἰδίας εὐγενείας
  choice: seiner eigenen Würde
  rationale: εὐγένεια kann sowohl edle Herkunft als auch vornehme Gesinnung und persönliche Würde bezeichnen. »Würde« bewahrt die Offenheit zwischen sozialem Rang und moralischem Adel besser als das heute stärker auf Abstammung bezogene »Adel«.
- source_word: ἀναξίως
  choice: auf eine Weise …, die … nicht entsprach
  rationale: Die Umschreibung gibt die Beziehung der unwürdigen Behandlung zu seiner εὐγένεια in natürlichem Deutsch wieder.
- source_word: ὑβρισθῆναι
  choice: misshandelt zu werden
  rationale: Das Verb umfasst überhebliche Erniedrigung, Beschimpfung und gegebenenfalls gewaltsame Misshandlung. »Misshandelt« lässt Art und Ausmaß der entehrenden Behandlung offen.
