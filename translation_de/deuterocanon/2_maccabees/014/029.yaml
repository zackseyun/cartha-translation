  yaml_path: translation/deuterocanon/2_maccabees/014/029.yaml
  text: But since it was not possible to oppose the king[a], he kept watching for an opportunity to accomplish it by a stratagem.
translation:
  language: de
  text: Da er sich aber dem König nicht widersetzen konnte, hielt er nach einer günstigen Gelegenheit Ausschau, es[a] mit einer List auszuführen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Griechische nennt nicht ausdrücklich, was er ausführen wollte.
    reason: implicit_object
lexical_decisions:
- source_word: ἐπεὶ δὲ
  choice: Da … aber
  rationale: Gibt sowohl den kausalen Sinn von ἐπεί als auch den weiterführend-adversativen Ton von δέ in natürlichem Deutsch wieder.
- source_word: τῷ βασιλεῖ ἀντιπρᾶξαι οὐκ ἦν
  choice: er sich dem König nicht widersetzen konnte
  rationale: Die unpersönliche griechische Wendung bezeichnet die Unmöglichkeit, gegen den König zu handeln. Die persönliche deutsche Form ist idiomatisch und bewahrt den Sinn, ohne das im Griechischen nicht ausdrücklich enthaltene „offen“ hinzuzufügen.
- source_word: εὔκαιρον
  choice: nach einer günstigen Gelegenheit
  rationale: Das substantivisch gebrauchte Adjektiv bezeichnet einen geeigneten oder günstigen Zeitpunkt; „günstige Gelegenheit“ ist im Deutschen natürlich und umfasst beide Nuancen.
- source_word: ἐτήρει
  choice: hielt … Ausschau
  rationale: Das Imperfekt bezeichnet ein fortdauerndes Beobachten oder Abwarten; „hielt Ausschau“ bringt diese Verlaufsbedeutung zum Ausdruck.
- source_word: στρατηγήματι
  choice: mit einer List
  rationale: Das Wort bezeichnet einen planvollen Kunstgriff oder ein taktisches Manöver. „List“ ist verständlich und wahrt den Gedanken eines indirekten, berechneten Vorgehens.
- source_word: τοῦ ἐπιτελέσαι
  choice: es … auszuführen
  rationale: Der artikulierte Infinitiv bezeichnet hier das beabsichtigte Ausführen oder Vollenden. Das neutrale Pronomen lässt wie der griechische Text offen, was genau ausgeführt werden soll.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. Die fortdauernde Handlung des Imperfekts wird durch „hielt … Ausschau“ wiedergegeben; die im Griechischen bestehende Leerstelle beim Objekt von ἐπιτελέσαι bleibt erhalten.
