base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/014/008.yaml
  text: 'I have now come a second time concerning the high priesthood: first[a], because I sincerely have in mind the interests of the king, and second, because I am also considering those of my own fellow citizens; for by the folly of the men mentioned before'
translation:
  language: de
  text: 'Was aber die Hohepriesterwürde betrifft, so bin ich jetzt zum zweiten Mal gekommen: erstens, weil mir die Interessen des Königs aufrichtig am Herzen liegen, und zweitens, weil ich auch an meine eigenen Mitbürger denke; denn durch die Unvernunft der bereits erwähnten Männer …[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der griechische Satz wird im folgenden Vers fortgesetzt. Da der vorliegende Quellenausschnitt hier unvollständig endet, kennzeichnen die Auslassungspunkte den offenen Satz.
    reason: textual_variant
lexical_decisions:
- source_word: τὴν ἀρχιερωσύνην
  choice: die Hohepriesterwürde
  rationale: Das Wort bezeichnet das Amt beziehungsweise die Würde des Hohepriesters. „Hohepriesterwürde“ ist im Deutschen prägnant und lässt offen, ob vor allem das Amt oder dessen Rang im Blick ist.
- source_word: δεύτερον νῦν ἐλήλυθα
  choice: ich bin jetzt zum zweiten Mal gekommen
  rationale: Die Wiedergabe bewahrt sowohl die zeitliche Angabe νῦν als auch die Ordnungszahl δεύτερον und klingt im Deutschen natürlich.
- source_word: ὑπὲρ τῶν ἀνηκόντων τῷ βασιλεῖ
  choice: die Interessen des Königs
  rationale: τὰ ἀνήκοντα bezeichnet hier die Angelegenheiten oder Belange, die den König betreffen. Im politischen Zusammenhang gibt „Interessen des Königs“ den Sinn idiomatisch wieder.
- source_word: γνησίως φρονῶν
  choice: mir … aufrichtig am Herzen liegen
  rationale: γνησίως drückt Echtheit oder Aufrichtigkeit aus, während φρονῶν die innere Haltung und das Bedachtsein auf etwas bezeichnet. Die Formulierung verbindet beide Aspekte in natürlichem Deutsch.
- source_word: τῶν ἰδίων πολιτῶν
  choice: meine eigenen Mitbürger
  rationale: πολῖται sind Mitbürger; ἰδίων betont ihre besondere Zugehörigkeit zu dem Sprecher, ohne eine ethnische Bedeutung hinzuzufügen.
- source_word: στοχαζόμενος
  choice: an … denke
  rationale: Das Partizip bezeichnet ein bewusstes Bedachtsein auf jemanden oder dessen Wohl. „An … denke“ ist verständlich und wahrt die Parallelität zur Sorge um die königlichen Interessen.
- source_word: τῇ μὲν γὰρ τῶν προειρημένων
  choice: denn durch … der bereits erwähnten Männer
  rationale: Die im Ausschnitt unvollständige Konstruktion eröffnet einen begründenden Satz, der im folgenden Vers weitergeführt wird. „Bereits erwähnt“ entspricht προειρημένων, während „durch“ die dativische Ursache beziehungsweise das Mittel wiedergibt.
