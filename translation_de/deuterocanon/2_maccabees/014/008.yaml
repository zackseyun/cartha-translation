  verdict: approve
  source_fidelity: 'Die Übersetzung gibt die zentrale Syntax und Semantik des griechischen Satzes zuverlässig wieder: τὴν ἀρχιερωσύνην wird angemessen als Gegenstand seines Kommens aufgefasst, δεύτερον νῦν wahrt „jetzt“ und „zum zweiten Mal“, und die beiden partizipialen Begründungen werden klar parallel wiedergegeben. Die anfangs im bereitgestellten Ausschnitt isoliert stehende Form δόξαν ist ohne ihren vorangehenden Kontext syntaktisch nicht als selbstständiger Bestandteil von V. 8 übersetzbar; die gewählte Wiedergabe folgt insofern zu Recht dem zusammenhängenden Satz ab λέγων. Der am Ende offene Kausalsatz wird nicht inhaltlich vervollständigt.'
  naturalness: Modernes, gut lesbares und zugleich dem höfisch-politischen Kontext angemessen würdevolles Deutsch. „Was aber die Hohepriesterwürde betrifft“ sowie die ausgewogene Gliederung mit „erstens … und zweitens“ sind idiomatisch.
  terminology: „Hohepriesterwürde“ ist für ἀρχιερωσύνη sachgerecht und lässt die Nuance von Amt beziehungsweise Würde offen. „Mitbürger“, „Interessen des Königs“ und „bereits erwähnte Männer“ sind präzise, registergerecht und ohne konfessionelle Überformung.
