  yaml_path: translation/deuterocanon/2_maccabees/014/043.yaml
  text: But since he had not succeeded in the blow because of the urgency of the struggle[a], and the crowds were rushing in within the gates[b], he ran up bravely onto the wall and hurled himself manfully down into the crowds.
translation:
  language: de
  text: Da er aber mit dem Schlag sein Ziel nicht erreicht hatte, wegen der Hast des Kampfes,[a] und die Menschenmassen durch die Tore ins Innere drängten, lief er mutig auf die Mauer hinauf und stürzte sich mannhaft[b] in die Menge hinab.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »mit dem Schlag nicht zum Ziel gekommen war, weil der Kampf so dringend war«. Das Griechische besagt, dass der erste selbst zugefügte Schlag nicht die beabsichtigte Wirkung hatte; es nennt dabei die Hast oder Dringlichkeit des Kampfes.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »beherzt«. Das griechische Wort bezeichnet Tapferkeit mit einem ausdrücklich männlich geprägten Ausdruck.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ ... πληγῇ μὴ κατευκτήσας
  choice: mit dem Schlag sein Ziel nicht erreicht hatte
  rationale: πληγή bezeichnet hier im Zusammenhang den selbst zugefügten Schlag, während κατευκτήσας das Erreichen des beabsichtigten Ergebnisses ausdrückt. Die Formulierung gibt das misslungene Vorhaben wieder, ohne πληγή vorschnell als »Wunde« festzulegen.
- source_word: διὰ τὴν τοῦ ἀγῶνος σπουδήν
  choice: weil der Kampf so heftig war
  rationale: ἀγών bezeichnet hier die gewaltsame Auseinandersetzung; σπουδή vermittelt den starken Zeit- und Handlungsdruck. Die idiomatische deutsche Wendung beschreibt die Heftigkeit, die zum misslungenen Schlag beitrug.
- source_word: τῶν ὄχλων
  choice: die Menschenmassen / die Menge
  rationale: Der griechische Plural ὄχλοι wird zunächst mit »Menschenmassen« wiedergegeben. Beim Ziel des Sturzes ist das deutsche Kollektiv »die Menge« natürlicher, ohne die Identität der Gruppe zu verändern.
- source_word: ἔσω τῶν θυρωμάτων εἰσβαλλόντων
  choice: durch die Tore ins Innere drängten
  rationale: Die Wiedergabe bewahrt sowohl die Bewegung hinein als auch die Richtung ins Innere. »Drängten« entspricht der durch die Situation nahegelegten stürmischen Bewegung, ohne zusätzlich ein gewaltsames Durchbrechen zu behaupten.
- source_word: ἀναδραμὼν γενναίως ἐπὶ τὸ τεῖχος
  choice: lief er mutig auf die Mauer hinauf
  rationale: ἀνατρέχω bezeichnet eine rasche Aufwärtsbewegung, γενναίως Tapferkeit, und τεῖχος eine Befestigungs- oder Stadtmauer.
- source_word: ἀπεκρήμνισεν ἑαυτόν
  choice: stürzte sich ... hinab
  rationale: Das Verb bezeichnet das Hinabwerfen von einer Höhe. Die reflexive Formulierung ist im Deutschen natürlich und erhält die absichtliche Bewegung.
- source_word: ἀνδρωδῶς
  choice: mannhaft
  rationale: Das Adverb beschreibt Mut ausdrücklich in männlich codierter Sprache. »Mannhaft« erhält diese Nuance, statt sie durch ein zweites neutrales »mutig« einzuebnen.
theological_decisions:
- issue: Männlich codiertes Adverb ἀνδρωδῶς
  choice: mannhaft
  alternative: mutig; beherzt
  rationale: Die geschlechtlich markierte Ausdrucksweise des griechischen Textes wird sichtbar bewahrt. Sie ist eine Charakterisierung der Tat und keine darüber hinausgehende Lehraussage.
- issue: Bewertung des versuchten Suizids durch wertende Adverbien
  choice: Die beiden positiven Mutbegriffe des Ausgangstextes werden übersetzt.
  alternative: Die wertenden Begriffe neutralisieren oder auslassen.
  rationale: γενναίως und ἀνδρωδῶς gehören ausdrücklich zum Erzähltext. Ihre Wiedergabe bewahrt dessen Spannung, ohne daraus eine allgemeine theologische Billigung der Handlung abzuleiten.
translation_notes:
  register: Modernes, würdevolles Erzähldeutsch. »Menschenmassen« erhält zunächst den griechischen Plural, während »die Menge« am Satzende idiomatisches Deutsch ermöglicht. Die Wiederholung der Mutcharakterisierung wird beibehalten, da der Ausgangstext sowohl γενναίως als auch ἀνδρωδῶς verwendet.
