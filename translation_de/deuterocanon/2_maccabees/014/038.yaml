base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/014/038.yaml
  text: For in earlier times[a], when separation was being judged, he had come under accusation for Judaism[b], and had risked both body and soul for Judaism with all earnestness.
translation:
  language: de
  text: Denn schon früher[a], als die Absonderung vor Gericht stand, war er wegen seines Judentums[b] angeklagt worden und hatte mit ganzem Einsatz Leib und Seele für das Judentum aufs Spiel gesetzt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „als ein Verfahren wegen der Absonderung beziehungsweise des Nichtumgangs geführt wurde“. Die griechische Formulierung ist stark verdichtet und weist wahrscheinlich auf ein Gerichtsverfahren hin.'
    reason: lexical_alternative
  - marker: b
    text: „Judentum“ bezeichnet hier nicht nur eine abstrakte Religion, sondern auch die überlieferte jüdische Identität und Lebensweise, die unter Druck stand.
    reason: cultural_note
lexical_decisions:
- source_word: ἐν τοῖς ἔμπροσθεν χρόνοις
  choice: schon früher
  rationale: Gibt den rückblickenden Zeitsinn knapp und in natürlichem Gegenwartsdeutsch wieder.
- source_word: τῆς ἀμιξίας κρίσις
  choice: als die Absonderung vor Gericht stand
  rationale: Bewahrt sowohl den Gedanken des Sichfernhaltens beziehungsweise der Nichtvermischung als auch den wahrscheinlich gerichtlichen Sinn von κρίσις. Die verdichtete griechische Fügung wird nicht eindeutiger gemacht, als sie ist.
- source_word: εἰσενηνεγμένος Ἰουδαισμοῦ
  choice: war er wegen seines Judentums angeklagt worden
  rationale: Der Perfektpartizip deutet im Zusammenhang mit κρίσις darauf, dass er in ein gerichtliches Verfahren hineingezogen beziehungsweise unter Anklage gestellt worden war. Der Genitiv bezeichnet den Grund oder Gegenstand der Anklage.
- source_word: Ἰουδαισμοῦ / τοῦ Ἰουδαισμοῦ
  choice: seines Judentums / das Judentum
  rationale: 'Das deutsche Kognat wahrt die historische Bedeutungsbreite des Ausdrucks: jüdischer Glaube, überlieferte Lebensweise und Zugehörigkeit, nicht bloß eine abstrakte Religion.'
- source_word: σῶμα καὶ ψυχὴν
  choice: Leib und Seele
  rationale: Erhält das betonte anthropologische Wortpaar und bringt die Ganzheit seines persönlichen Einsatzes zum Ausdruck.
- source_word: παραβεβλημένος
  choice: aufs Spiel gesetzt
  rationale: Eine natürliche deutsche Wiedergabe für das bewusste Aussetzen gegenüber Gefahr; sie passt idiomatisch zu „Leib und Seele“.
- source_word: μετὰ πάσης ἐκτενίας
  choice: mit ganzem Einsatz
  rationale: Drückt die volle Intensität und Entschlossenheit aus, ohne den Ausdruck auf eine rein innere Haltung zu verengen.
theological_decisions:
- issue: Bedeutungsumfang von Ἰουδαισμός im Kontext des Zweiten Tempels
  choice: Judentum
  alternative: jüdische Lebensweise
  rationale: „Judentum“ lässt die Verbindung von Glaube, überlieferter Praxis und jüdischer Identität offen und verengt den Ausdruck weder auf Religion noch auf Volkszugehörigkeit allein.
- issue: Deutung der verdichteten gerichtlichen Formulierung τῆς ἀμιξίας κρίσις εἰσενηνεγμένος
  choice: als die Absonderung vor Gericht stand, war er … angeklagt worden
  alternative: als ein Verfahren wegen der Absonderung geführt wurde, war er … vor Gericht gebracht worden
  rationale: Die gewählte Fassung macht den wahrscheinlichen Rechtskontext verständlich, lässt aber in der Fußnote erkennen, dass Syntax und genauer Bezug der griechischen Wendung unsicher sind.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Vor Gericht stand“ und „aufs Spiel gesetzt“ sind allgemein verständlich, ohne umgangssprachlich zu wirken. Die Wiederholung von „Judentum“ folgt der Wiederholung im Griechischen; „Leib und Seele“ bewahrt dessen emphatische Ganzheitsaussage.
