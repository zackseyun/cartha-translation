  source_fidelity: Die Übersetzung gibt Aufenthalt, einwandfreies Verhalten und das Wegschicken der versammelten Menge zutreffend wieder. „Zusammengeströmt“ fügt jedoch eine im griechischen Partizip συναχθέντας nicht ausdrücklich enthaltene Bewegungs- bzw. Entstehungsnuance hinzu. Die abwertende, herdenbezogene Nuance von ἀγελαίους wird sachgerecht in einer Fußnote erläutert.
  naturalness: „Nikanor hielt sich in Jerusalem auf und tat nichts Ungehöriges“ ist natürliches modernes Standarddeutsch. Die koordinierende Verbindung mit „und“ entspricht dem zurückhaltenden δέ besser als das stärker kontrastierende „jedoch“.
  terminology: Nikanor ist die übliche deutsche Namensform. „Ungehöriges“ ist für ἄτοπον in diesem Kontext angemessen. „Menschenmengen“ gibt ὄχλους idiomatisch wieder; die Fußnote wahrt die besondere Bildlichkeit und abwertende Konnotation von ἀγελαίους, ohne sie mit einer künstlichen deutschen Haupttextformulierung zu überladen.
