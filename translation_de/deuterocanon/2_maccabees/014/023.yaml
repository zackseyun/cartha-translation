    rationale: δέ kann zwar einen Gegensatz andeuten, fungiert hier aber auch schlicht verbindend; „und“ bleibt näher an der unmarkierten griechischen Verknüpfung.
  - severity: low
    issue: Die Fußnote erklärt „ungeordnet“ als Teil der Bedeutung.
    rationale: Das herdenartige Bild und die abwertende Anwendung auf Menschen sind gesichert; „ungeordnet“ ist als feste semantische Komponente weniger eindeutig und sollte nicht hinzugefügt werden.
