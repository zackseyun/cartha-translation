  yaml_path: translation/deuterocanon/2_maccabees/014/023.yaml
  text: Nicanor stayed on in Jerusalem and did nothing out of place[a]; and he dismissed the gathered crowds.
translation:
  language: de
  text: Nikanor hielt sich in Jerusalem auf und tat nichts Ungehöriges. Die versammelten Menschenmengen[a] schickte er fort.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die versammelten, herdenartigen Menschenmengen“; das griechische Adjektiv ruft bei Menschen abwertend das Bild einer Herde hervor.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διέτριβεν
  choice: hielt sich … auf
  rationale: Das Imperfekt bezeichnet einen andauernden Aufenthalt. Die Wendung ist im modernen Deutschen natürlich, ohne eine über den Text hinausgehende Aufenthaltsdauer festzulegen.
- source_word: ἔπραττεν οὐδὲν ἄτοπον
  choice: tat nichts Ungehöriges
  rationale: ἄτοπος kann etwas Ungehöriges, Unangebrachtes oder Befremdliches bezeichnen. „Nichts Ungehöriges“ bewahrt diese Bedeutungsbreite und passt zum geschilderten Verhalten Nikanors.
- source_word: τοὺς δὲ συναχθέντας ἀγελαίους ὄχλους
  choice: Die zusammengeströmten Menschenmassen jedoch
  rationale: „Zusammengeströmt“ gibt συναχθέντας idiomatisch wieder und lässt zusammen mit „Menschenmassen“ den abwertenden Klang von ἀγελαίους erkennen. Eine Fußnote macht dessen wörtliches Herdenbild und die echte lexikalische Spannung sichtbar.
- source_word: ἀπέλυσεν
  choice: schickte er fort
  rationale: Gemeint ist hier das Wegschicken beziehungsweise Zerstreuen der versammelten Menge, nicht die Freilassung von Gefangenen.
