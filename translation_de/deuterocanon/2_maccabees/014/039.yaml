base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/014/039.yaml
  text: But Nikanor[a], wanting to make plain the hostility he had toward the Jews, sent more than five hundred soldiers to arrest him.
translation:
  language: de
  text: Nikanor aber wollte seine Feindseligkeit gegenüber den Juden offen zeigen und schickte mehr als fünfhundert Soldaten aus, um ihn festzunehmen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βουλόμενος
  choice: wollte
  rationale: Das Partizip bezeichnet Nikanors Absicht; „wollte“ gibt den Willensaspekt natürlich wieder, ohne eine längere Planung zu unterstellen.
- source_word: πρόδηλον ποιῆσαι
  choice: offen zeigen
  rationale: Die Wendung bedeutet, etwas deutlich beziehungsweise öffentlich erkennbar zu machen. „Offen zeigen“ bewahrt diesen Sinn in geläufigem Deutsch.
- source_word: δυσμένειαν
  choice: Feindseligkeit
  rationale: Das Substantiv bezeichnet eine feindliche Haltung oder Gesinnung. „Feindseligkeit“ passt zum politischen und militärischen Zusammenhang, ohne den Begriff auf ein bloßes Gefühl zu verengen.
- source_word: ἀπέστειλεν
  choice: schickte … aus
  rationale: „Ausschicken“ ist im Zusammenhang mit einem militärischen Auftrag natürlich und gibt die zielgerichtete Entsendung wieder.
- source_word: στρατιώτας
  choice: Soldaten
  rationale: Der griechische Plural bezeichnet einzelne Angehörige des Militärs; „Soldaten“ ist die direkte und verständliche Entsprechung.
- source_word: ὑπὲρ τοὺς πεντακοσίους
  choice: mehr als fünfhundert
  rationale: ὑπέρ mit Akkusativ bezeichnet hier das Überschreiten einer Zahl; „mehr als fünfhundert“ ist eindeutig und idiomatisch.
- source_word: συλλαβεῖν
  choice: festzunehmen
  rationale: Im Kontext einer ausgesandten Soldatengruppe bezeichnet das Verb das Ergreifen und Ingewahrsamnehmen einer Person. „Festnehmen“ ist präziser als das allgemeinere „ergreifen“.
- source_word: αὐτόν
  choice: ihn
  rationale: Das Pronomen verweist im Kontext auf den zuvor genannten Rasis und wird im Deutschen natürlich mit „ihn“ wiedergegeben.
