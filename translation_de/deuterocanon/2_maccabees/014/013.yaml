  text: 'to Judah with letters: that he should capture Judas himself, scatter those with him, and appoint Alcimus as high priest of the greatest temple.'
translation:
  language: de
  text: 'mit Briefen nach Judäa: Judas selbst gefangen zu nehmen, die mit ihm zu zerstreuen und Alkimos als Hohepriester des größten Heiligtums einzusetzen.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰούδᾳ
  choice: nach Juda
  rationale: Der Dativ bezeichnet hier im Satzanschluss das Ziel der Sendung. „Juda“ wahrt die Form des griechischen Ortsnamens und unterscheidet ihn vom unmittelbar folgenden Personennamen Ἰουδὰ („Judas“).
- source_word: ἐπανελέσθαι
  choice: zu beseitigen
  rationale: Das Verb bedeutet in diesem Zusammenhang, jemanden aus dem Weg zu räumen beziehungsweise zu töten; „gefangen zu nehmen“ wäre zu eng und schwächer als der griechische Ausdruck.
- source_word: τοὺς … σὺν αὐτῷ
  choice: seine Gefährten
  rationale: Natürliches Deutsch für „die mit ihm“, ohne die Gruppe unnötig als Heer oder bestimmte Truppengattung festzulegen.
- source_word: σκορπίσαι
  choice: zu zerstreuen
  rationale: Entspricht dem Bild des Auseinandertreibens oder Auflösens der Gruppe.
- source_word: καταστῆσαι
  choice: einzusetzen
  rationale: Gibt die amtliche Bestellung des Alkimos präzise und idiomatisch wieder.
- source_word: τοῦ μεγίστου ἱεροῦ
  choice: des größten Heiligtums
  rationale: Bewahrt den Superlativ μεγίστου und gibt ἱερόν als Heiligtum beziehungsweise Tempelbezirk wieder.
theological_decisions:
- issue: Wiedergabe von ἀρχιερεύς
  choice: Hohepriester
  alternative: Oberster Priester
  rationale: „Hohepriester“ ist die etablierte, allgemein verständliche deutsche Amtsbezeichnung und trägt keine zusätzliche konfessionelle Deutung ein.
translation_notes:
  register: Der vorgelegte griechische Text ist ein Satzfragment, das syntaktisch an den vorhergehenden Vers anschließt; die deutsche Fassung bewahrt diesen Anschluss mit kleingeschriebenem Beginn und Doppelpunkt. Der Stil ist knapp, amtlich und erzählerisch.
