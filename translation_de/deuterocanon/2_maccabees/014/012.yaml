  text: And he immediately selected Nikanor[a], who had become commander of the elephants, and appointed him general over Judea, and sent him out.
translation:
  language: de
  text: Er wählte sofort Nikanor aus, der Befehlshaber der Kriegselefanten geworden war, ernannte ihn zum Strategen von Judäa[a] und entsandte ihn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zum General über Judäa“ oder „zum Militärstatthalter von Judäa“. Der griechische Titel στρατηγός kann sowohl einen militärischen Befehlshaber als auch einen regionalen Amtsträger bezeichnen; hier können beide Aufgabenbereiche gemeint sein.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προχειρισάμενος
  choice: wählte … aus
  rationale: Das Partizip bezeichnet die Auswahl oder Bestimmung für eine Aufgabe. „Auswählen“ unterscheidet diesen Vorgang sprachlich von der anschließenden förmlichen Ernennung.
- source_word: εὐθέως
  choice: sofort
  rationale: Gibt die unverzügliche Handlung knapp und in modernem Standarddeutsch wieder.
- source_word: τὸν γενόμενον ἐλεφαντάρχην
  choice: der Befehlshaber der Kriegselefanten gewesen war
  rationale: ἐλεφαντάρχης bezeichnet einen Offizier über militärisch eingesetzte Elefanten. „Kriegselefanten“ macht die militärische Funktion natürlich verständlich; der Plusquamperfekt wahrt den Rückbezug von γενόμενον.
- source_word: στρατηγὸν
  choice: Strategen
  rationale: Der historische Amtstitel bewahrt die mögliche Verbindung militärischer Führung und regionaler Verwaltung, ohne die im Griechischen offene Funktionsbreite einseitig als „General“ oder „Statthalter“ festzulegen.
- source_word: ἀναδείξας
  choice: ernannte
  rationale: Das Verb bezeichnet die offizielle Bestimmung zu einem Amt; „ernannte“ ist dafür im Deutschen idiomatisch.
- source_word: ἐξαπέστειλεν
  choice: entsandte ihn
  rationale: „Entsenden“ gibt die zielgerichtete offizielle Aussendung prägnant wieder und trägt der verstärkenden Form des Verbs Rechnung.
