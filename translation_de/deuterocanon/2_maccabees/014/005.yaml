  yaml_path: translation/deuterocanon/2_maccabees/014/005.yaml
  text: That day was quiet. But when he found an opportunity suitable for his own folly[a], and had been summoned by Demetrius to the council and asked in what disposition and purpose the Jews stood,
translation:
  language: de
  text: An jenem Tag hatte er Ruhe. Doch als er eine Gelegenheit ergriff, die seiner eigenen Torheit Vorschub leistete,[a] wurde er von Demetrius in den Rat gerufen und gefragt, welche Haltung und Absicht die Juden hätten,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »als er eine Gelegenheit ergriffen hatte, die eine Mitwirkende seiner eigenen Torheit war«. Das Griechische ist stark verdichtet und stellt die Gelegenheit bildhaft als Helferin seines törichten Vorhabens dar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὴν ἡμέραν ἐκείνην ἡσυχίαν ἔσχεν
  choice: An jenem Tag blieb es ruhig
  rationale: Die griechische Wendung bedeutet wörtlich, dass jener Tag Ruhe hatte. Die unpersönliche deutsche Formulierung ist natürlich und lässt offen, ob Ruhe, Ordnung oder das Ausbleiben von Unruhen gemeint ist.
- source_word: καιρὸν δὲ λαβών
  choice: Doch als er eine Gelegenheit fand
  rationale: καιρός bezeichnet hier einen günstigen Zeitpunkt beziehungsweise eine passende Gelegenheit; die temporale Wiedergabe fügt sich natürlich in den Satzbau ein.
- source_word: τῆς ἰδίας ἀνοίας συνεργόν
  choice: die seiner eigenen Torheit Vorschub leistete
  rationale: Das komprimierte Bild bezeichnet die Gelegenheit als Mitwirkende an seiner Torheit. „Vorschub leistete“ bewahrt den Gedanken aktiver Förderung, ohne die Personifikation im Deutschen zu überziehen.
- source_word: προσκληθεὶς εἰς συνέδριον ὑπὸ τοῦ Δημητρίου
  choice: wurde er von Demetrius in den Rat gerufen
  rationale: συνέδριον bezeichnet eine beratende Versammlung oder einen Rat. „In den Rat gerufen“ gibt die offizielle Vorladung prägnant wieder.
- source_word: ἐπερωτηθείς
  choice: gefragt
  rationale: Das Verb kann „befragen“ oder „verhören“ bedeuten; der Kontext verlangt nicht zwingend den schärferen Ton eines Verhörs.
- source_word: ἐν τίνι διαθέσει καὶ βουλῇ καθεστήκασιν
  choice: welche Haltung und Absicht ... hätten
  rationale: 'διάθεσις und βουλή werden als zwei unterscheidbare Aspekte wiedergegeben: gegenwärtige Haltung und beabsichtigtes Vorgehen. Der deutsche abhängige Fragesatz erfordert idiomatisch den Konjunktiv.'
- source_word: οἱ Ἰουδαῖοι
  choice: die Juden
  rationale: Im makkabäischen Kontext ist dies eine ethnisch-religiöse und politische Bezeichnung für das jüdische Volk, nicht nur für Einwohner Judäas.
theological_decisions:
- issue: Wiedergabe von οἱ Ἰουδαῖοι
  choice: die Juden
  alternative: die Judäer
  rationale: Der Zusammenhang bezieht sich auf das jüdische Volk als ethnisch-religiöse und politische Gemeinschaft. „Judäer“ würde den Bezug unnötig auf eine geografische Herkunft verengen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem erzählerischem Ton. Die Satzperiode bleibt eng am griechischen Aufbau, wird jedoch für natürliche deutsche Syntax gegliedert. Der Vers endet entsprechend der Vorlage mit dem Inhalt der Frage, ohne den folgenden Vers vorwegzunehmen.
