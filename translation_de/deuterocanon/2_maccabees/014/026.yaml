  source_fidelity: Die Übersetzung gibt συνιδών, εὔνοια, die Kenntnisnahme der geschlossenen συνθῆκαι sowie den politischen Vorwurf gegen Nikanor insgesamt treffend wieder. „Fremde Interessen“ ist als idiomatische Wiedergabe von ἀλλότρια φρονεῖν τῶν πραγμάτων vertretbar. In „zu seinem Nachfolger bestimmt“ fügt das Possessivpronomen jedoch einen im Griechischen nicht ausgedrückten und im Deutschen primär auf Nikanor bezogenen Nachfolgebezug ein; dies steht zudem im Widerspruch zur Fußnote, die Demetrios als den naheliegenden Bezug nennt.
  naturalness: Der Stil ist modernes, würdiges Standarddeutsch. „verfolge in den Staatsangelegenheiten fremde Interessen“ ist verständlich, wenn auch leicht formal, und passt zum politischen Kontext. Die ersatzlose Formulierung „als Nachfolger eingesetzt“ ist ebenso natürlich und vermeidet die problematische zusätzliche Festlegung.
  terminology: Die Namen Alkimos, Demetrios, Nikanor und Judas entsprechen dem üblichen deutschen griechischen Namensgebrauch. „Wohlwollen“, „Vereinbarungen“, „Ränke schmiede“ und „Nachfolger“ treffen die maßgeblichen Begriffe angemessen. Die Fußnote zu „Nachfolger“ muss die im Haupttext nicht mehr vorhandene possessive Festlegung nicht behaupten, sondern die offene Bezugsfrage erläutern.
