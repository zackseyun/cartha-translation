base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/014/026.yaml
  text: But Alcimus[a], perceiving the goodwill toward one another and learning of the agreements that had been made, came to Demetrius and said that Nicanor was favoring interests contrary to the state; for he had appointed Judas, the plotter against his kingdom[b], as successor.
translation:
  language: de
  text: Alkimos aber bemerkte das gegenseitige Wohlwollen und erfuhr von den getroffenen Vereinbarungen.[a] Da ging er zu Demetrios und sagte, Nikanor verfolge in den Staatsangelegenheiten fremde Interessen; denn er habe Judas, der gegen sein Königreich Ränke schmiede, als Nachfolger eingesetzt.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Vereinbarungen“ kann auch mit „Abmachungen“, „Vertragsbedingungen“ oder „Verträgen“ wiedergegeben werden.
    reason: lexical_alternative
  - marker: b
    text: Das Griechische bezeichnet Judas als „Nachfolger“, ohne ausdrücklich zu sagen, wessen Nachfolger er sein sollte. Im Zusammenhang liegt ein Bezug auf Demetrios beziehungsweise dessen Königreich nahe.
    reason: ambiguity
lexical_decisions:
- source_word: συνιδὼν
  choice: bemerkte
  rationale: Das Partizip bezeichnet hier das Erkennen oder Wahrnehmen der freundschaftlichen Annäherung, nicht nur ein äußerliches Sehen.
- source_word: τὴν πρὸς ἀλλήλους εὔνοιαν
  choice: das gegenseitige Wohlwollen
  rationale: Die Wendung beschreibt die beiderseitige günstige Gesinnung und bleibt näher am Griechischen als eine stärkere Bezeichnung wie „Freundschaft“.
- source_word: τὰς γενομένας συνθήκας λαβὼν
  choice: erfuhr von den getroffenen Vereinbarungen
  rationale: λαβών ist in diesem Zusammenhang idiomatisch als Kenntnisnahme zu verstehen; συνθῆκαι bezeichnet Abmachungen, Vereinbarungen oder gegebenenfalls Vertragsbedingungen.
- source_word: ἀλλότρια φρονεῖν τῶν πραγμάτων
  choice: verfolge in den Staatsangelegenheiten fremde Interessen
  rationale: Die bewusst leicht ungewöhnliche Formulierung bewahrt das Bild von etwas den öffentlichen Angelegenheiten „Fremdem“ und vermittelt zugleich den politischen Vorwurf mangelnder Loyalität.
- source_word: ἐπίβουλον τῆς βασιλείας αὐτοῦ
  choice: der gegen sein Königreich Ränke schmiede
  rationale: ἐπίβουλος bezeichnet jemanden, der feindselig Anschläge oder Pläne gegen jemanden beziehungsweise etwas hegt. Der Relativsatz klingt im Deutschen natürlich und bewahrt den Charakter einer Anschuldigung.
- source_word: διάδοχον ἀπέδειξεν
  choice: zu seinem Nachfolger bestimmt
  rationale: ἀποδείκνυμι kann eine Ernennung oder Bestimmung bezeichnen; διάδοχος meint einen Nachfolger, ohne notwendig eine erbliche Stellung auszudrücken.
theological_decisions:
- issue: Politischer Sinn des Vorwurfs gegen Nikanor
  choice: „verfolge in den Staatsangelegenheiten fremde Interessen“
  alternative: „handle gegen die Interessen des Staates“
  rationale: Die gewählte Fassung erhält die eigentümliche Offenheit von ἀλλότρια φρονεῖν und macht zugleich verständlich, dass Alkimos Nikanor politische Illoyalität vorwirft.
- issue: Bezug des Possessivpronomens in „sein Königreich“ und „sein Nachfolger“
  choice: Im Haupttext bleibt „sein“ stehen; bei „Nachfolger“ wird der naheliegende Bezug auf Demetrios in einer Fußnote erläutert.
  alternative: „zum Nachfolger des Demetrios“
  rationale: Das griechische αὐτοῦ bei βασιλείας bezieht sich natürlich auf Demetrios. Bei διάδοχον ist der Nachfolgebezug sachlich naheliegend, wird aber nicht durch ein ausdrückliches Possessivpronomen markiert; die Fußnote vermeidet eine stille Überbestimmung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Namen folgen den im Deutschen üblichen griechischen Formen. Der politisch zugespitzte, als Anschuldigung berichtete Charakter der Rede bleibt erhalten; „fremde Interessen“ bewahrt zudem die Bildlichkeit des griechischen Idioms.
