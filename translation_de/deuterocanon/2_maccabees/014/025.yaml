  text: He urged him to marry and have children; he married[a], settled down, and shared in common life.
translation:
  language: de
  text: Er drängte ihn zu heiraten und Kinder zu bekommen. Er heiratete, wurde sesshaft und hatte Anteil am gemeinsamen Leben.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „nahm am Leben teil“ oder „führte ein geregeltes Leben“. Die griechische Wendung ἐκοινώνησεν βίου ist idiomatisch; sie kann die Teilhabe am gemeinsamen menschlichen beziehungsweise gesellschaftlichen Leben bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεκάλεσεν
  choice: drängte
  rationale: Das Verb bezeichnet hier nachdrückliches Zureden; „drängte“ gibt die eindringliche Aufforderung natürlich wieder.
- source_word: γῆμαι
  choice: zu heiraten
  rationale: Die schlichte moderne Wiedergabe entspricht dem Aoristinfinitiv von γαμέω, ohne die Formulierung unnötig auf „eine Frau nehmen“ festzulegen.
- source_word: παιδοποιήσασθαι
  choice: Kinder zu bekommen
  rationale: Die Wendung gibt das Hervorbringen von Nachkommen in heutigem, allgemein verständlichem Deutsch wieder.
- source_word: ἐγάμησεν
  choice: heiratete er
  rationale: Direkte und natürliche Wiedergabe des narrativen Aorists.
- source_word: εὐστάθησεν
  choice: wurde sesshaft
  rationale: Im Zusammenhang von Heirat und Familiengründung bezeichnet das Verb plausibel den Übergang zu einem gefestigten, beständigen Leben.
- source_word: ἐκοινώνησεν βίου
  choice: nahm am gewöhnlichen Leben teil
  rationale: Die idiomatische Verbindung bezeichnet die Teilhabe am üblichen menschlichen beziehungsweise gesellschaftlichen Leben; die Übersetzung bewahrt diese Weite.
