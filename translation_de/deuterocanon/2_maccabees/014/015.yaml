base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/014/015.yaml
  text: But when they heard of Nikanor’s advance and the attack of the Gentiles[a], they sprinkled dust upon themselves and implored the one who had established his people forever[c][b], and who always comes to the aid of his own portion with manifestation.
translation:
  language: de
  text: Als sie aber von Nikanors Vormarsch und dem Angriff der nichtjüdischen Völker[a] hörten, streuten sie Erde auf sich und flehten den an, der sein Volk für immer gegründet hatte und seinem eigenen Anteil[b] stets durch sichtbares Eingreifen[c] zu Hilfe kommt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „der Völker“. Gemeint sind hier die nichtjüdischen Völker, die den Juden feindlich gegenüberstehen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „seinem eigenen Erbteil“. Das Bild bezeichnet Gottes Volk als den ihm gehörenden Anteil.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „in sichtbarer Erscheinung“ beziehungsweise „offenbar“. Der griechische Ausdruck kann eine deutlich erkennbare göttliche Hilfe bis hin zu einer Erscheinung bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀκούσαντες
  choice: Als sie ... hörten
  rationale: Das Aoristpartizip bezeichnet den zeitlichen Umstand der Haupthandlung; die finite deutsche Konstruktion ist natürlich und präzise.
- source_word: ἔφοδον
  choice: Vormarsch
  rationale: Bezeichnet hier eine feindliche militärische Bewegung und bleibt vom folgenden ἐπίθεσιν („Angriff“) unterschieden.
- source_word: ἐπίθεσιν
  choice: Angriff
  rationale: Gibt den militärischen Sinn direkt wieder und bewahrt die Paarung mit „Vormarsch“.
- source_word: τῶν ἐθνῶν
  choice: der nichtjüdischen Völker
  rationale: ἔθνη meint im jüdischen Erzählzusammenhang die Völker außerhalb Israels; die Formulierung ist verständlicher und neutraler als das heute teils missverständliche „Heiden“.
- source_word: καταπασάμενοι γῆν
  choice: streuten sie sich Erde auf
  rationale: Bewahrt das konkrete Trauer- und Bittzeichen des griechischen Ausdrucks samt reflexivem Sinn der medialen Form.
- source_word: ἐλιτάνευσαν
  choice: flehten ... an
  rationale: Drückt die eindringliche Bitte natürlich und würdig aus.
- source_word: τὸν ἄχρι αἰῶνος συστήσαντα τὸν αὐτοῦ λαόν
  choice: den, der sein Volk für immer gegründet hatte
  rationale: „Gegründet“ gibt συστήσαντα als dauerhaftes Einsetzen beziehungsweise Bestehenlassen des Volkes wieder; das Plusquamperfekt ordnet die Handlung vor dem Flehen ein.
- source_word: ἀεὶ δὲ ... ἀντιλαμβανόμενον
  choice: und ... stets ... zu Hilfe kommt
  rationale: Das Präsenspartizip beschreibt Gottes charakteristisches, fortdauerndes Helfen.
- source_word: μετʼ ἐπιφανείας
  choice: durch sichtbares Eingreifen
  rationale: Gibt die erkennbare, offenbar werdende Art der Hilfe verständlich wieder, ohne den Ausdruck vorschnell als technische „Epiphanie“ festzulegen.
- source_word: τῆς ἑαυτοῦ μερίδος
  choice: seinem eigenen Anteil
  rationale: Bewahrt das Bild eines Gott zugeteilten beziehungsweise ihm gehörenden Anteils und damit den möglichen Bundes- und Erbsinn.
theological_decisions:
- issue: Bedeutung von τῶν ἐθνῶν im jüdischen Bundeszusammenhang
  choice: der nichtjüdischen Völker
  alternative: der Völker; der Heiden
  rationale: Die Übersetzung macht den Gegensatz zu Israel deutlich, ohne einen abwertenden oder konfessionell geprägten deutschen Ausdruck zu wählen.
- issue: Deutung von μετʼ ἐπιφανείας
  choice: durch sichtbares Eingreifen
  alternative: in sichtbarer Erscheinung; offenbar; mit Offenbarwerden
  rationale: Die Formulierung lässt offen, ob eine eigentliche Gotteserscheinung oder allgemein ein deutlich erkennbares göttliches Handeln gemeint ist.
- issue: Metaphorik von τῆς ἑαυτοῦ μερίδος
  choice: seinem eigenen Anteil
  alternative: seinem eigenen Erbteil
  rationale: „Anteil“ bleibt formal nahe am Griechischen und bewahrt die Möglichkeit, Gottes Volk als sein zugeteiltes Eigentum oder Erbteil zu verstehen, ohne diese Nuance im Haupttext festzuschreiben.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur folgt dem griechischen Gedankengang, wird aber idiomatisch gegliedert. Konkrete Bilder wie das Aufstreuen von Erde und Gottes „Anteil“ bleiben erhalten; erklärungsbedürftige Mehrdeutigkeiten werden in Fußnoten ausgewiesen.
