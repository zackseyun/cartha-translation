  yaml_path: translation/deuterocanon/2_maccabees/014/010.yaml
  text: For as long as Judas remains[a], it is impossible for affairs to attain peace.
translation:
  language: de
  text: Denn solange Judas noch am Leben ist[a], kann die Lage unmöglich Frieden finden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Anfangsworte des erhaltenen griechischen Textes sind textlich schwierig. Gemeint ist offenbar, dass das Fortleben oder die fortdauernde Anwesenheit des Judas Frieden unmöglich macht.
    reason: textual_variant
lexical_decisions:
- source_word: ἰσχρὰ
  choice: solange
  rationale: Die überlieferte Form ist textlich schwierig und ergibt isoliert keinen sicheren Sinn. Zusammen mit περιὼν verlangt der Zusammenhang eine temporale Aussage über das Fortleben beziehungsweise die fortdauernde Anwesenheit des Judas.
- source_word: Ἰούδας
  choice: Judas
  rationale: Die im Deutschen für diese Person eingebürgerte Namensform.
- source_word: περιὼν
  choice: noch lebt
  rationale: περίειμι kann hier das Fortbestehen oder Überleben bezeichnen. „Noch lebt“ gibt den politischen Zusammenhang klar und natürlich wieder, ohne mehr als das Fortdauern seiner Person auszusagen.
- source_word: ἀδύνατον
  choice: unmöglich
  rationale: Bewahrt die starke, uneingeschränkte Aussage des griechischen Prädikats.
- source_word: εἰρήνης
  choice: zur Ruhe
  rationale: Das griechische Wort bedeutet „Frieden“. In Verbindung mit τὰ πράγματα gibt die idiomatische deutsche Wendung „die Lage kommt zur Ruhe“ den Gedanken eines befriedeten Zustands natürlich wieder.
- source_word: τυχεῖν
  choice: kommen
  rationale: τυγχάνω mit dem Genitiv bezeichnet hier das Erlangen oder Erreichen eines Zustands; in der deutschen Wendung entspricht dem „zur Ruhe kommen“.
- source_word: τὰ πράγματα
  choice: die Lage
  rationale: Bezeichnet die politischen Verhältnisse beziehungsweise die allgemeine Situation. „Die Lage“ ist im modernen Deutsch natürlich und bewahrt die Breite des Ausdrucks.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die idiomatische Wendung „die Lage zur Ruhe kommen“ vermeidet eine im Deutschen unnatürliche wörtliche Verbindung von „Angelegenheiten“ und „Frieden erlangen“.
