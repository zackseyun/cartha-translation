base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/014/022.yaml
  text: Judas stationed armed men[a], ready in strategic places, lest some treachery from the enemies should suddenly arise; and they held the fitting conference.
translation:
  language: de
  text: Judas stellte bewaffnete Männer einsatzbereit an strategisch wichtigen Stellen auf, damit nicht plötzlich eine böswillige Tat vonseiten der Feinde geschähe; und sie führten eine der Situation angemessene Unterredung.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »und sie berieten sich in angemessener Weise.« Die griechische Wendung kann eine den Umständen entsprechende gemeinsame Unterredung oder Beratung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διέταξεν
  choice: stellte … auf
  rationale: Im militärischen Zusammenhang mit bewaffneten Männern und Ortsangaben bezeichnet das Verb hier deren Aufstellung beziehungsweise Stationierung, nicht nur einen erteilten Befehl.
- source_word: ἐνόπλους ἑτοίμους
  choice: bewaffnete Männer einsatzbereit
  rationale: ἐνόπλους bezeichnet bewaffnete Personen, ohne sie ausdrücklich als Soldaten zu bestimmen; ἑτοίμους hebt ihre Bereitschaft zum Eingreifen hervor.
- source_word: ἐν τοῖς ἐπικαίροις τόποις
  choice: an strategisch wichtigen Stellen
  rationale: ἐπικαίροις meint in diesem militärischen Zusammenhang taktisch günstige oder entscheidende Positionen.
- source_word: μή ποτε
  choice: damit es nicht
  rationale: Die Wendung leitet den befürchteten Fall ein, gegen den Judas vorsorglich handelt.
- source_word: ἐκ τῶν πολεμίων
  choice: der Feinde
  rationale: Der Genitivanschluss gibt in natürlichem Deutsch den Ursprung beziehungsweise die Urheber der befürchteten Tat wieder.
- source_word: ἐφνιδίως
  choice: plötzlich
  rationale: Das Adverb bezeichnet ein unvermitteltes, überraschendes Geschehen.
- source_word: κακουργία
  choice: heimtückische Tat
  rationale: Das Wort bezeichnet eine böse oder verbrecherische Handlung. Der diplomatisch-militärische Kontext legt Heimtücke nahe, ohne zwingend einen konkreten Anschlag vorauszusetzen.
- source_word: γένηται
  choice: es … käme
  rationale: Die unpersönliche deutsche Wendung »es kommt zu« gibt das Eintreten des befürchteten Geschehens idiomatisch wieder.
- source_word: τὴν ἁρμόζουσαν ἐποίησαν κοινολογίαν
  choice: Dann führten sie das der Situation angemessene Gespräch
  rationale: Die idiomatische griechische Wendung bezeichnet eine wechselseitige Unterredung, die den Umständen entsprach. »Gespräch führen« ist im heutigen Deutsch natürlich und bewahrt den gegenseitigen Charakter.
