  yaml_path: translation/deuterocanon/2_maccabees/014/036.yaml
  text: And now, O Lord, holy in every holiness, keep this house, recently purified, undefiled forever.
translation:
  language: de
  text: Und nun, Herr, du Heiliger in aller Heiligkeit,[a] bewahre dieses Haus,[b] das erst vor Kurzem gereinigt wurde, für immer unbefleckt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die ungewöhnliche griechische Anrede kann auch etwa als »du Heiliger über jede Heiligung hinaus« verstanden werden. Der Ausdruck verbindet in verdichteter Weise »heilig« mit »jeder Heiligung« beziehungsweise »aller Weihe«; die genaue Beziehung bleibt offen.
    reason: lexical_alternative
  - marker: b
    text: Gemeint ist der Tempel. Das griechische Wort bedeutet wörtlich »Haus« und ist eine geläufige biblische Bezeichnung für das Heiligtum.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄγιε παντὸς ἁγιασμοῦ κύριε
  choice: Herr, du Heiliger aller Heiligkeit
  rationale: Die ungewöhnliche, feierliche Anrede wird eng am Griechischen wiedergegeben. „Du Heiliger“ bildet den Vokativ ἄγιε natürlich ab; „aller Heiligkeit“ wahrt die mehrdeutige Genitivverbindung, ohne Gott ausdrücklich als Quelle der Heiligkeit zu deuten.
- source_word: διατήρησον
  choice: bewahre
  rationale: Das Verb bezeichnet hier die fortdauernde Erhaltung des gereinigten Zustands; „bewahre“ ist im Gebet natürlich und präzise.
- source_word: εἰς αἰῶνα
  choice: für immer
  rationale: Dies ist die geläufige deutsche Wiedergabe einer unbegrenzten Dauer.
- source_word: ἀμίαντον
  choice: unbefleckt
  rationale: „Unbefleckt“ erhält den kultischen Reinheitsbezug und passt grammatisch zum als Objekt bezeichneten Haus.
- source_word: τόνδε τὸν ... οἶκον
  choice: dieses Haus
  rationale: οἶκος bedeutet wörtlich „Haus“ und bezeichnet hier in biblischer Ausdrucksweise den Tempel beziehungsweise das Heiligtum.
- source_word: προσφάτως κεκαθερισμένον
  choice: das erst vor Kurzem gereinigt wurde
  rationale: Die Relativkonstruktion klingt im Deutschen klar und natürlich; „erst vor Kurzem“ erhält die zeitliche Betonung von προσφάτως, „gereinigt“ den vollzogenen Zustand des Perfektpartizips.
theological_decisions:
- issue: Bezeichnung des Tempels durch οἶκος
  choice: Haus
  alternative: Tempel
  rationale: „Haus“ bewahrt die wörtliche und biblisch geläufige Bezeichnung des Heiligtums; eine Fußnote klärt den konkreten Bezug.
- issue: Deutung der Anrede ἄγιε παντὸς ἁγιασμοῦ
  choice: du Heiliger aller Heiligkeit
  alternative: du Quelle aller Heiligkeit / über alle Heiligkeit erhaben
  rationale: Die gewählte Form bewahrt die ungewöhnliche Verdichtung und lässt offen, ob der Genitiv intensiv, vergleichend oder anderweitig relationell zu verstehen ist. Explizite Aussagen über Quelle oder Überlegenheit würden stärker auslegen.
translation_notes:
  register: Feierliche, aber gegenwärtige Gebetssprache. Die Satzstellung bleibt gut verständlich; die ungewöhnliche Gottesbezeichnung wird bewusst nicht geglättet oder dogmatisch ausgedeutet.
