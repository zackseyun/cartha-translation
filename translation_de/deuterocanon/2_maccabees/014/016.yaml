  yaml_path: translation/deuterocanon/2_maccabees/014/016.yaml
  text: But when the commander gave the order[a], he broke camp from there at once and joined battle with them near the village of Lessaou.
translation:
  language: de
  text: Als der Befehlshaber den Befehl gegeben hatte, brach er sofort von dort auf und trat mit ihnen in der Nähe des Dorfes Lessaou[a] in den Kampf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zog zum Dorf Lessaou und traf dort auf sie“. Das griechische συνμίσγει bedeutet wörtlich „vermischt sich mit“ und bezeichnet hier im militärischen Zusammenhang ein Zusammentreffen oder einen Kampf; ἐπὶ κώμην kann eine Bewegung zum Dorf hin oder ein Geschehen bei ihm ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προστάξαντος
  choice: den Befehl gab
  rationale: Das aoristische Partizip bezeichnet den Befehl, der das folgende Handeln auslöst; die deutsche Wendung ist natürlich und wahrt den militärischen Zusammenhang.
- source_word: τοῦ ἡγουμένου
  choice: der Befehlshaber
  rationale: ἡγούμενος bezeichnet hier im militärischen Zusammenhang den führenden Kommandeur, ohne ein ziviles Amt vorauszusetzen.
- source_word: ἀναζεύξας
  choice: brach ... auf
  rationale: Das Verb kann das Aufbrechen eines Lagers beziehungsweise den Abmarsch bezeichnen. „brach auf“ gibt die Bewegung knapp und idiomatisch wieder, ohne ein ausdrücklich genanntes Lager einzutragen.
- source_word: συνμίσγει αὐτοῖς
  choice: trat ... mit ihnen in den Kampf
  rationale: Das wörtliche „sich mit ihnen vermischen“ bezeichnet im militärischen Kontext das Zusammentreffen beziehungsweise den Kampf; die gewählte Formulierung macht diesen Sinn deutlich.
- source_word: ἐπὶ κώμην
  choice: bei dem Dorf
  rationale: ἐπί mit Akkusativ kann hier eine Bewegung zum Dorf hin oder das Geschehen bei ihm bezeichnen. „bei“ lässt die genaue räumliche Beziehung offen.
- source_word: Λεσσαού
  choice: Lessaou
  rationale: Der Ortsname wird entsprechend der griechischen Form transliteriert.
