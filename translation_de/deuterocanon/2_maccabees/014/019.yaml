  source_fidelity: Die Übersetzung gibt den Folgeschluss, das Senden der drei Gesandten und die gegenseitige Geste der Vertrauensbekundung zutreffend wieder. Die griechische Wendung δοῦναι καὶ λαβεῖν δεξιάς bezeichnet jedoch nicht zwei getrennte Vorgänge des Gebens bzw. Empfangens eines einzelnen „Handschlags“, sondern das wechselseitige Reichen der rechten Hand als Bekräftigung.
  naturalness: „Den Handschlag zu geben und zu empfangen“ ist im modernen Standarddeutsch unnötig sperrig und klingt, als werde ein Handschlag als Gegenstand übertragen. „Einander die rechte Hand zu reichen“ ist idiomatisch, würdig und bewahrt den konkreten Gestus.
  terminology: Die Namen Posidonius, Theodotus und Mattathias sind angemessen. „Die rechte Hand reichen“ gibt δεξιάς als kulturell geprägte Geste wieder, ohne den offenen Charakter der dadurch bekräftigten Zusicherung oder Vereinbarung dogmatisch einzuengen.
