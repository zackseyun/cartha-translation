  yaml_path: translation/deuterocanon/2_maccabees/014/019.yaml
  text: Therefore he sent Posidonius and Theodotus and Mattathias to give and receive pledges[a].
translation:
  language: de
  text: Darum sandte er Posidonius, Theodotus und Mattathias, um einander die rechte Hand zu reichen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »rechte Hände geben und empfangen«; das Reichen der rechten Hand war ein Zeichen gegenseitiger Zusicherung oder einer Vereinbarung.'
    reason: cultural_note
lexical_decisions:
- source_word: διόπερ
  choice: Darum
  rationale: Die folgernde Konjunktion knüpft an die vorausgehende Lage an; »Darum« ist natürlich und bewahrt den begründenden Schluss.
- source_word: ἔπεμψεν
  choice: sandte er
  rationale: Schlichte Wiedergabe des Aorists von πέμπω; »sandte« entspricht dem würdigen Erzählregister.
- source_word: Ποσίδωνιον καὶ Θεόδοτον καὶ Ματταθίαν
  choice: Posidonius, Theodotus und Mattathias
  rationale: Die Personennamen werden in den im Deutschen üblichen gräzisierten Formen wiedergegeben; die Aufzählung folgt natürlicher deutscher Koordination.
- source_word: δοῦναι καὶ λαβεῖν
  choice: zu geben und zu empfangen
  rationale: Die beiden Infinitive werden konkret und parallel wiedergegeben, statt den Vorgang nur abstrakt als Vereinbarung zu bezeichnen.
- source_word: δεξιάς
  choice: den Handschlag
  rationale: Wörtlich steht der Plural »rechte Hände«; im Deutschen bezeichnet »Handschlag« natürlich die entsprechende gegenseitige Geste der Zusicherung. Die konkrete Bildsprache bleibt erhalten, während die kulturelle Bedeutung in der Fußnote erläutert wird.
