    issue: Eigenname als „den Makkabäer“ wiedergegeben
    rationale: Μακκαβαῖον bezeichnet hier Makkabäus (Judas Makkabäus), nicht allgemein einen Angehörigen der Makkabäer. Die deutsche Namensform „Makkabäus“ vermeidet eine Bedeutungsverschiebung.
  - severity: low
    issue: „Er schrieb Nikanor“
    rationale: Im modernen Standarddeutsch lautet die Konstruktion „an jemanden schreiben“. Die Ergänzung „an“ verbessert die Grammatik ohne Bedeutungsänderung.
  - severity: low
    issue: „wurde ... aufgebracht“ nach „geriet in Zorn“
    rationale: Die Formulierung ist verständlich, klingt aber leicht redundant. „durch ... angestachelt“ gibt ἐρεθισθείς als von den Verleumdungen bewirkte Anstachelung präziser wieder.
