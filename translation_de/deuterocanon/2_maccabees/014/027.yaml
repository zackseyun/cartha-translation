revisions:
- from: Doch der König geriet in Zorn und wurde durch die Verleumdungen jenes durch und durch bösen Mannes aufgebracht. Er schrieb Nikanor, er sei über die Vereinbarung[a] sehr ungehalten, und befahl ihm, den Makkabäer unverzüglich als Gefangenen[b] nach Antiochia zu schicken.
  to: Doch der König geriet in Zorn und wurde durch die Verleumdungen jenes durch und durch bösen Mannes angestachelt. Er schrieb an Nikanor, er sei über die Vereinbarung[a] sehr ungehalten, und befahl ihm, Makkabäus unverzüglich als Gefangenen[b] nach Antiochia zu schicken.
  rationale: Die Revision berichtigt die deutsche Rektion bei „an Nikanor schreiben“ und die Namensform „Makkabäus“. „Angestachelt“ bringt die durch die Verleumdungen ausgelöste Reizung des Königs idiomatisch und quellentreu zum Ausdruck. Die Fußnotenanker bleiben unmittelbar an den jeweils erläuterten Ausdrücken stehen.
