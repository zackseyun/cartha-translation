base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/014/027.yaml
  text: But the king became enraged[a], and, provoked by the slanders of that utterly wicked man, wrote to Nikanor[b], saying that he took the treaty very badly and ordering him to send Maccabeus to Antioch as a prisoner at once.
translation:
  language: de
  text: Doch der König geriet in Zorn und wurde durch die Verleumdungen jenes durch und durch bösen Mannes angestachelt. Er schrieb an Nikanor, er sei über die Vereinbarung[a] sehr ungehalten, und befahl ihm, Makkabäus unverzüglich als Gefangenen[b] nach Antiochia zu schicken.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „über die Abmachungen“ beziehungsweise „über die Friedensbedingungen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „Makkabäus gebunden“; gemeint ist seine Überstellung als Gefangener.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔθυμος γενόμενος
  choice: geriet in Zorn
  rationale: Die Wendung bezeichnet das Aufwallen heftigen Zorns; „geriet in Zorn“ ist natürlich, würdig und bewahrt den Vorgangscharakter.
- source_word: πανπονήρου
  choice: durch und durch bösen
  rationale: Die verstärkende Zusammensetzung mit πονηρός verlangt eine starke moralische Wertung, ohne sie über den griechischen Text hinaus auszubauen.
- source_word: διαβολαῖς
  choice: Verleumdungen
  rationale: Im Zusammenhang sind böswillige, herabsetzende Beschuldigungen gemeint; „Verleumdungen“ gibt diese negative Konnotation prägnant wieder.
- source_word: ἐρεθισθεὶς
  choice: aufgebracht
  rationale: Das Partizip beschreibt, wie der König durch die Verleumdungen gereizt beziehungsweise angestachelt wurde.
- source_word: συνθηκῶν
  choice: Vereinbarung
  rationale: Der Plural kann Abmachungen, Vertragsbestimmungen oder eine Friedensvereinbarung bezeichnen. Der deutsche Singular „Vereinbarung“ passt zum politischen Kontext, ohne den Rechtscharakter zu eng festzulegen.
- source_word: φάσκων βαρέως φέρειν
  choice: er sei ... sehr ungehalten
  rationale: Die indirekte Rede wahrt φάσκων; „sehr ungehalten sein“ gibt das idiomatische βαρέως φέρειν als starke Missbilligung wieder.
- source_word: δέσμιον
  choice: als Gefangenen
  rationale: Das prädikative Adjektiv bezeichnet Makkabäus als gebundenen Gefangenen; „als Gefangenen“ ist im Deutschen genauer und natürlicher als eine zwingende Konkretisierung auf Ketten.
- source_word: ἐξαποστέλλειν
  choice: zu schicken
  rationale: Das Verb bedeutet hier, jemanden an einen anderen Ort abzusenden; „schicken“ ist im Befehlszusammenhang idiomatisch.
- source_word: ταχέως
  choice: unverzüglich
  rationale: Das Adverb fordert rasches Handeln; „unverzüglich“ vermittelt die Dringlichkeit eines königlichen Befehls.
theological_decisions:
- issue: Moralische Charakterisierung durch πανπονήρου
  choice: jenes durch und durch bösen Mannes
  alternative: jenes völlig niederträchtigen Mannes
  rationale: Die starke moralische Beurteilung steht ausdrücklich im griechischen Text und wird weder abgeschwächt noch konfessionell ausgelegt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem erzählerischem Ton. Die Satzfolge wurde zur besseren deutschen Lesbarkeit geteilt; die logischen Beziehungen und die indirekte Rede des griechischen Textes bleiben erhalten.
