base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/014/035.yaml
  text: You[a], O Lord, though needing nothing from anyone[b], were pleased for a temple of your dwelling to come into being among us.
translation:
  language: de
  text: Du, Herr, obwohl du nichts brauchst[a], fandest Gefallen daran, dass unter uns[b] ein Tempel als Stätte deines Wohnens entstand.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »obwohl du aller Dinge nicht bedürftig bist«; gemeint ist, dass der Herr auf nichts und niemanden angewiesen ist.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »in uns«. Das griechische ἐν ἡμῖν lässt beides zu; wegen des Tempelzusammenhangs ist hier »unter uns« wahrscheinlicher.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπροσδεὴς τῶν ὅλων
  choice: obwohl du nichts brauchst
  rationale: 'ἀπροσδεής bezeichnet völlige Bedürfnislosigkeit; τῶν ὅλων erweitert sie auf alles. Die deutsche Formulierung ist natürlich und bewahrt zugleich den unausgesprochenen Gegensatz: Gott braucht keinen Tempel und wollte dennoch einen Ort seines Wohnens unter seinem Volk.'
- source_word: ηὐδόκησας
  choice: hattest Gefallen daran
  rationale: Die Wendung gibt sowohl das Wohlgefallen als auch die zustimmende Willensentscheidung des Verbs wieder, ohne bloße Freude oder einen Zwang auszudrücken.
- source_word: ναὸν
  choice: Tempel
  rationale: ναός bezeichnet hier eindeutig das Heiligtum als Ort der göttlichen Gegenwart; „Tempel“ ist die klare und kontextgemäße deutsche Entsprechung.
- source_word: τῆς σῆς σκηνώσεως
  choice: als Stätte deines Wohnens
  rationale: σκηνώσις bezeichnet das Wohnen beziehungsweise die Wohnstätte. „Als Stätte deines Wohnens“ macht die Beziehung zum Tempel im Deutschen verständlich, ohne den Begriff mit späterer theologischer Fachsprache zu überladen.
- source_word: ἐν ἡμῖν
  choice: unter uns
  rationale: Im Zusammenhang mit dem Tempel ist die räumlich-gemeinschaftliche Bedeutung am wahrscheinlichsten. Die ebenfalls mögliche Wiedergabe „in uns“ wird in der Fußnote bewahrt.
- source_word: γενέσθαι
  choice: entstand
  rationale: γίνομαι bedeutet „werden“ oder „entstehen“. „Entstand“ vermeidet die nicht ausdrücklich im griechischen Text enthaltene Festlegung auf „erbaut wurde“.
theological_decisions:
- issue: Gottes Selbstgenügsamkeit und sein Wohlgefallen am Tempel
  choice: obwohl du nichts brauchst
  alternative: da du von allem unabhängig bist
  rationale: Die konzessive Wiedergabe wahrt die Spannung, dass Gott auf nichts angewiesen ist und dennoch den Tempel als Ort seines Wohnens wollte. Sie macht daraus weder eine abstrakte philosophische Aussage noch lässt sie den Gegensatz verschwinden.
- issue: Gemeinschaftliche oder innerliche Bedeutung von ἐν ἡμῖν
  choice: unter uns
  alternative: in uns
  rationale: Der Tempelzusammenhang spricht vorrangig für Gottes Wohnen inmitten der Gemeinschaft. Da das Griechische auch „in uns“ zulässt, bleibt diese Möglichkeit ausdrücklich in der Fußnote erhalten.
- issue: Art des göttlichen Wohnens im Tempel
  choice: als Stätte deines Wohnens
  alternative: Tempel deiner Einwohnung
  rationale: Die gewählte Formulierung spricht wirklich von Gottes Wohnen, bestimmt aber nicht näher, in welchem metaphysischen oder kulttheologischen Sinn seine Gegenwart im Tempel zu verstehen ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Anrede bleibt knapp und gebetsartig; ungebräuchliche Bildungen wie „Einwohnung“ oder „Zelten“ werden im Haupttext vermieden. Die Satzstruktur bewahrt die theologische Spannung zwischen Gottes Bedürfnislosigkeit und seinem freien Wohlgefallen am Tempel.
