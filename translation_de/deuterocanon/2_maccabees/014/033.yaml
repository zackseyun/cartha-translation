base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/014/033.yaml
  text: 'Stretching out his right hand toward the temple[a], he swore this: “If you do not hand Judas over to me as a prisoner, I will make this sanctuary of God a plain, tear down the altar, and raise up here a splendid temple to Dionysus.”'
translation:
  language: de
  text: 'Er streckte seine rechte Hand auf den Tempel zu aus und schwor: »Wenn ihr mir Judas nicht als Gefangenen ausliefert, werde ich dieses Heiligtum Gottes dem Erdboden gleichmachen[a], den Altar niederreißen und hier dem Dionysos einen prächtigen Tempel errichten.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »werde ich dieses Heiligtum Gottes zu einer Ebene machen«.'
    reason: Die Fußnote bewahrt das konkrete Bild von εἰς πεδίον ποιήσω, während der Haupttext die im Deutschen natürliche Wendung verwendet.
lexical_decisions:
- source_word: προτείνας τὴν δεξιὰν
  choice: Er streckte seine rechte Hand aus
  rationale: Gibt die konkrete, den Schwur begleitende Geste natürlich wieder; das im Deutschen erforderliche Possessivpronomen wird ergänzt.
- source_word: ἐπὶ τὸν νεών
  choice: gegen den Tempel
  rationale: ἐπί bezeichnet bei der Gebärde am ehesten die Ausrichtung. „Gegen“ bewahrt zugleich die im Kontext mögliche feindselige Nuance, ohne sie festzuschreiben.
- source_word: δέσμιον ... παραδῶτε
  choice: als Gefangenen ausliefert
  rationale: Bewahrt die prädikative Bedeutung von δέσμιον, ohne buchstäbliche Fesseln vorauszusetzen; „ausliefern“ passt zum erzwungenen Übergeben.
- source_word: τὸν τοῦ θεοῦ σηκόν
  choice: dieses Heiligtum Gottes
  rationale: σηκός bezeichnet hier die heilige Tempelstätte beziehungsweise den Tempelbau. „Heiligtum“ unterscheidet den Ausdruck von νεώς und vom späteren ἱερόν.
- source_word: εἰς πεδίον ποιήσω
  choice: dem Erdboden gleichmachen
  rationale: Natürliches deutsches Drohwort für die völlige Einebnung eines Bauwerks; die bildhafte Bedeutung, daraus freie ebene Fläche zu machen, bleibt in der Fußnote sichtbar.
- source_word: κατασκάψω
  choice: niederreißen
  rationale: Gibt die angedrohte Zerstörung des Altars idiomatisch und ohne unnötige Spezifizierung wieder.
- source_word: ἱερὸν ... ἐπιφανές
  choice: einen prächtigen Tempel
  rationale: ἱερόν bezeichnet hier ein Dionysos geweihtes Heiligtum; ἐπιφανές charakterisiert es als auffällig, stattlich oder ruhmvoll. „Prächtig“ trifft den prahlerischen Ton.
- source_word: ἀναστήσω
  choice: errichten
  rationale: Standardmäßige, natürliche Wiedergabe für das Aufrichten beziehungsweise Bauen eines Tempels.
theological_decisions:
- issue: Unterschiedliche Bezeichnungen für sakrale Räume
  choice: νεώς als „Tempel“, σηκός als „Heiligtum Gottes“ und ἱερόν als „Tempel“
  alternative: Alle drei Ausdrücke einheitlich mit „Tempel“ wiedergeben
  rationale: Die teilweise Unterscheidung spiegelt die Variation des griechischen Textes, ohne im Deutschen künstlich zu wirken. Sie legt keine besondere kulttheologische Abstufung fest.
- issue: Ausrichtung der Schwurgeste
  choice: „gegen den Tempel“
  alternative: „zum Tempel hin“ oder „über den Tempel“
  rationale: ἐπὶ mit Akkusativ kann die Richtung der ausgestreckten Hand bezeichnen. „Gegen“ lässt sowohl die räumliche Ausrichtung als auch die bedrohliche Situation anklingen, ohne eine Berührung oder einen Schwur auf den Tempel zu behaupten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt kraftvoll und verständlich; sakrale Begriffe werden differenziert, aber nicht technisch oder konfessionell aufgeladen.
