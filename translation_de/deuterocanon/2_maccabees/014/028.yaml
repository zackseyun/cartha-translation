base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/014/028.yaml
  text: But when these men fell before Nikanor[a], he was thrown into confusion and took it badly that he should set aside the agreed terms[b], though the man had done no wrong.
translation:
  language: de
  text: Als diese Männer jedoch vor Nikanor niederfielen[a], geriet er in Verwirrung. Es missfiel ihm sehr, die getroffenen Vereinbarungen[b] aufheben zu sollen, obwohl der Mann kein Unrecht begangen hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihm zu Füßen fielen“; als Geste flehentlicher Bitte.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „die bereits getroffenen Regelungen“ oder „die Abmachung“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσπεσόντων
  choice: vor … niederfielen
  rationale: Das Aoristpartizip von προσπίπτω bezeichnet hier wahrscheinlich ein Niederfallen vor einer Person als flehentliche Gebärde. Die Formulierung bewahrt das körperliche Bild, ohne die Bitte ausdrücklich in den Haupttext einzutragen.
- source_word: συνεκέχυτο
  choice: geriet er in Verwirrung
  rationale: Die Form beschreibt Nikanors innere Erschütterung oder Verwirrung infolge des an ihn gerichteten Drängens.
- source_word: δυσφόρως ἔφερεν
  choice: Es fiel ihm schwer
  rationale: Die idiomatische Wendung bezeichnet, dass jemand etwas nur schwer erträgt oder mit Unbehagen aufnimmt. Die deutsche Fassung ist natürlich und lässt offen, ob eher Gewissensnot, Unmut oder Bedrängnis gemeint ist.
- source_word: τὰ διεσταλμένα
  choice: die getroffenen Vereinbarungen
  rationale: Das substantivierte Partizip bezeichnet bereits festgelegte oder vereinbarte Regelungen. Der Plural wird gewahrt, ohne den Ausdruck unnötig zu präzisieren.
- source_word: ἀθετήσει
  choice: aufheben
  rationale: Das Verb kann verwerfen, außer Kraft setzen oder ungültig machen bedeuten. „Aufheben“ passt zum diplomatischen Zusammenhang und legt den genauen rechtlichen Vorgang nicht fest.
- source_word: μηδὲν τἀνδρὸς ἠδικηκότος
  choice: obwohl der Mann kein Unrecht begangen hatte
  rationale: Der Genitivus absolutus stellt fest, dass der betreffende Mann in dieser Sache nichts Unrechtes getan hatte. Die Übersetzung wahrt den begrenzten moralisch-rechtlichen Aussagegehalt.
- source_word: Νικάνορι
  choice: Nikanor
  rationale: Der Personenname wird unmittelbar nach der griechischen Form transliteriert.
theological_decisions:
- issue: Reichweite der Unschuldsfeststellung in μηδὲν τἀνδρὸς ἠδικηκότος
  choice: Der Mann hatte kein Unrecht begangen.
  alternative: Der Mann hatte niemandem Unrecht getan.
  rationale: Die Formulierung gibt die konkrete moralisch-rechtliche Feststellung des Verses wieder, ohne daraus eine umfassende Aussage über die Person abzuleiten.
- issue: Art von Nikanors innerer Reaktion
  choice: Die Übersetzung spricht von Verwirrung und davon, dass ihm die Aufhebung schwerfiel.
  alternative: Nikanor war erzürnt oder widersetzte sich aus rein politischen Gründen.
  rationale: Der griechische Text beschreibt starke innere Bedrängnis, nennt aber weder eindeutig ihr Motiv noch eine bestimmte moralische Bewertung. Diese Spannung bleibt erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzteilung erhöht die Verständlichkeit, ohne den Gedankengang des griechischen Satzes zu verändern. „Aufheben zu sollen“ gibt den belastenden äußeren Druck wieder, ohne Nikanors spätere Handlung vorwegzunehmen.
