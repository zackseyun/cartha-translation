  text: But when they quickly drew back[a], and a space opened up, he came into the middle of the courtyard.
translation:
  language: de
  text: Als die anderen aber schnell zurückwichen und eine Lücke entstand, gelangte er in die Mitte des Hofes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in den offenen Hof“. Das griechische Wort bezeichnet einen offenen Hof oder Hofraum.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναποδισάντων
  choice: zurückwichen
  rationale: Das Partizip bezeichnet eine rückwärtige Bewegung der Umstehenden. „Zurückwichen“ ist natürliches Deutsch und passt zur unmittelbaren körperlichen Reaktion, ohne unnötig militärisch zu klingen.
- source_word: ταχέως
  choice: schnell
  rationale: Das Adverb bezeichnet die Geschwindigkeit des Zurückweichens und wird direkt und idiomatisch wiedergegeben.
- source_word: γενομένου διαστήματος
  choice: eine Lücke entstand
  rationale: Der Genitivus absolutus beschreibt den dadurch entstandenen Zwischenraum. „Eine Lücke entstand“ bewahrt das Bild und ist im Deutschen flüssig.
- source_word: ἦλθεν
  choice: stürzte
  rationale: Wörtlich bedeutet das Verb „kam/gelangte“. Im Zusammenhang mit dem unmittelbar vorausgehenden Sprung gibt „stürzte“ die resultierende Bewegung ins Zentrum natürlich wieder, ohne zusätzliche Absicht zu unterstellen.
- source_word: κατὰ μέσον
  choice: mitten in
  rationale: Die Wendung bezeichnet das Gelangen in den mittleren Bereich; „mitten in“ ist prägnant und idiomatisch.
- source_word: κενεῶνα
  choice: Innenhof
  rationale: Das seltene Substantiv bezeichnet wahrscheinlich einen offenen Hof beziehungsweise freien Hofraum. „Innenhof“ vermittelt diese räumliche Vorstellung modernen Lesern verständlich.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur folgt dem griechischen Ablauf, während „stürzte“ den erzählerischen Zusammenhang des Sprungs verständlich ausdrückt. Die lexikalische Unsicherheit bei κενεών wird in der Fußnote offengelegt.
