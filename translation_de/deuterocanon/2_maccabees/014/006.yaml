  text: In reply he said[a], “Those among the Jews who are called Hasideans, whose leader is Judas Maccabaeus, keep feeding war and stirring up rebellion[b], not allowing
translation:
  language: de
  text: 'Darauf erwiderte er: »Diejenigen unter den Juden, die Hasidäer genannt werden[a] und deren Anführer Judas Makkabäus ist, nähren Krieg und stiften Aufruhr, ohne zuzulassen …[b]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die sogenannten Hasidäer«, falls λεγόμενοι hier distanzierend oder abwertend gemeint ist.'
    reason: lexical_alternative
  - marker: b
    text: Der griechische Satz wird im nächsten Vers fortgesetzt; dieser Vers endet mit »ohne zuzulassen« und nennt noch nicht, was sie nicht zulassen.
    reason: syntax_continuation
lexical_decisions:
- source_word: πρὸς ταῦτα ἔφη
  choice: Darauf erwiderte er
  rationale: Die Wendung kennzeichnet eine Antwort auf das Vorangehende; die deutsche Formulierung gibt diese Gesprächsfunktion natürlich wieder, ohne den Ton zu verstärken.
- source_word: Οἱ λεγόμενοι τῶν Ἰουδαίων
  choice: Diejenigen unter den Juden, die … genannt werden
  rationale: Die neutrale Bedeutung von λεγόμενοι bleibt im Haupttext erhalten; eine mögliche distanzierende Nuance wird in der Fußnote genannt.
- source_word: Ἀσιδαῖοι
  choice: Hasidäer
  rationale: Da das Wort eine bestimmte historische jüdische Gruppierung bezeichnet, ist die im Deutschen gebräuchliche lautnahe Namensform einer wertenden Übersetzung wie „die Frommen“ vorzuziehen.
- source_word: ὧν ἀφηγεῖται
  choice: deren Anführer … ist
  rationale: ἀφηγέομαι bezeichnet hier das Führen beziehungsweise Anführen einer Gruppe; die gewählte Formulierung ist idiomatisches modernes Deutsch.
- source_word: Ἰούδας ὁ Μακκαβαῖος
  choice: Judas der Makkabäer
  rationale: Gebräuchliche deutsche Wiedergabe des Namens und Beinamens.
- source_word: πολεμοτροφοῦσιν
  choice: nähren den Krieg
  rationale: Die Formulierung bewahrt das anschauliche Bild des griechischen Kompositums, nach dem der Krieg gleichsam genährt und am Leben erhalten wird.
- source_word: στασιάζουσιν
  choice: stiften Aufruhr
  rationale: Das Verb bezeichnet parteilichen Unfrieden, Aufruhr oder Rebellion; „stiften Aufruhr“ gibt die aktive Verursachung knapp und verständlich wieder.
- source_word: οὐκ ἐῶντες
  choice: Sie lassen nicht zu …
  rationale: Die Übersetzung lässt die Aussage bewusst offen, weil ihr Gegenstand erst in der Fortsetzung des griechischen Satzes im nächsten Vers folgt.
theological_decisions:
- issue: Bezeichnung der Gruppe Ἀσιδαῖοι
  choice: Hasidäer
  alternative: die Frommen; Assidäer
  rationale: Eine Namensform wahrt die historische Eigenständigkeit der Gruppe und vermeidet, ihr durch die Übersetzung unmittelbar eine positive religiöse Bewertung zuzuschreiben.
- issue: Nuance von Οἱ λεγόμενοι
  choice: die … genannt werden
  alternative: die sogenannten
  rationale: Eine distanzierende oder abwertende Färbung ist möglich, aber nicht eindeutig; deshalb steht die neutrale Lesart im Text und die Alternative in der Fußnote.
- issue: Unvollständiger Satz am Versende
  choice: Sie lassen nicht zu …
  alternative: das Satzobjekt aus dem folgenden Vers vorwegnehmen
  rationale: Die syntaktische Spannung der griechischen Verseinteilung bleibt erhalten; es wird kein im vorliegenden Vers fehlendes Objekt ergänzt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Rede bleibt klar und anklagend; das bildhafte „nähren den Krieg“ bewahrt die Eigenart des Griechischen. Auslassungspunkte markieren transparent die syntaktische Fortsetzung über die Versgrenze hinweg.
