  register: Moderne, würdige Standardsprache. Die Satzstruktur bleibt nah am griechischen Ablauf, wird aber durch einen temporalen Nebensatz und einen Relativsatz für heutige Leser klar gegliedert. Der mögliche Hoftitel »Freunde« und die Unsicherheit des seltenen Verbs werden nicht stillschweigend vereindeutigt, sondern in Fußnoten offengelegt.
