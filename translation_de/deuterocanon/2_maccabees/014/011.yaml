base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/014/011.yaml
  text: When this man had said such things[a], the rest of the Friends, being quickly ill-disposed toward Judas[b], further incited Demetrius.
translation:
  language: de
  text: Als dieser Mann so gesprochen hatte, stachelten die übrigen Freunde[a], die Judas gegenüber etwas feindselig eingestellt waren, Demetrius umso schneller weiter gegen ihn auf.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit den »Freunden« sind hier wahrscheinlich nicht Freunde im gewöhnlichen Sinn gemeint, sondern königliche Vertraute oder Höflinge; das griechische Wort kann als Hoftitel gebraucht sein.
    reason: cultural_note
  - marker: b
    text: Das seltene griechische Verb kann auch bedeuten, dass sie Demetrius weiter gegen Judas einnahmen, aufbrachten oder erbitterten.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοιούτων δὲ ῥηθέντων ὑπὸ τούτου
  choice: Als dieser Mann so gesprochen hatte
  rationale: Der Genitivus absolutus wird als natürlicher temporaler Nebensatz wiedergegeben. »Dieser Mann« bewahrt den leicht distanzierenden Rückverweis von τούτου auf den vorherigen Sprecher.
- source_word: θᾶττον
  choice: umso schneller
  rationale: Die komparative Form bezeichnet hier die beschleunigte Reaktion auf die vorausgegangene Rede; »umso schneller« bewahrt diese Nuance besser als ein bloßes »sogleich«.
- source_word: οἱ λοιποὶ φίλοι
  choice: die übrigen Freunde
  rationale: Die wörtliche Wiedergabe lässt erkennen, dass φίλοι im seleukidischen Hofzusammenhang wahrscheinlich eine Bezeichnung für königliche Vertraute beziehungsweise Höflinge ist; dies wird in der Fußnote erläutert.
- source_word: δυσμενῶς ἔχοντες τι πρὸς τὸν Ἰούδαν
  choice: die Judas gegenüber feindselig eingestellt waren
  rationale: Die idiomatische Wendung bezeichnet eine ablehnende oder feindselige Haltung gegenüber Judas. Das abschwächende τι bleibt im Deutschen implizit, da »etwas feindselig eingestellt« unnatürlich und missverständlich klänge.
- source_word: προετετύρωμαν
  choice: stachelten ... gegen ihn auf
  rationale: Das seltene Verb bezeichnet im Kontext ein weiteres Anfachen der feindseligen Haltung des Demetrius. »Aufstacheln« gibt die kausative und emotionale Kraft wieder, ohne die genaue, unsichere Bildlichkeit festzulegen.
- source_word: τὸν Δημήτριον
  choice: Demetrius
  rationale: Gebräuchliche deutsche Form des Königsnamens.
theological_decisions: []
