  yaml_path: translation/deuterocanon/2_maccabees/014/031.yaml
  text: But when the other man realized that he had been outmaneuvered by the man’s boldness[a], he came to the greatest and holy temple, while the priests were offering the customary sacrifices, and ordered them to hand over the man.
translation:
  language: de
  text: Als der andere jedoch erkannte, dass der Mann ihn durch sein mutiges Vorgehen ausmanövriert hatte, begab er sich zum größten und heiligen Tempel[a]. Während die Priester die vorgeschriebenen Opfer darbrachten, befahl er ihnen, den Mann auszuliefern.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »zum großen und heiligen Tempel«. Der griechische Text verwendet den Superlativ »größten«, der hier auch als feierlich gesteigerte Bezeichnung des Tempels gemeint sein kann.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Συγνοὺς δὲ ὁ ἕτερος
  choice: Als der andere jedoch erkannte
  rationale: Die aoristische Partizipialkonstruktion wird als zeitlicher Nebensatz wiedergegeben; „jedoch“ nimmt den fortführend-kontrastierenden Wert von δέ auf.
- source_word: γενναίως ὑπὸ τοῦ ἀνδρὸς ἐστρατήγηται
  choice: dass der Mann ihn durch sein mutiges Vorgehen ausmanövriert hatte
  rationale: στρατηγέω bezeichnet hier strategisches Überlisten oder Ausmanövrieren. Die aktive deutsche Form ist natürlicher und bewahrt den Mann als Handelnden; γενναίως wird nicht ausgelassen, sondern als „durch sein mutiges Vorgehen“ wiedergegeben.
- source_word: παραγενόμενος
  choice: begab er sich
  rationale: Bezeichnet in der Erzählfolge das Hingehen beziehungsweise Eintreffen am Tempel; „begab er sich“ passt zum würdigen Erzählton.
- source_word: ἐπὶ τὸ μέγιστον καὶ ἅγιον ἱερόν
  choice: zum größten und heiligen Tempel
  rationale: „größten“ bewahrt formal den Superlativ μέγιστον; ἱερόν bezeichnet hier den Tempel beziehungsweise Tempelbezirk.
- source_word: τὰς καθηκούσας θυσίας
  choice: die vorgeschriebenen Opfer
  rationale: καθηκούσας bezeichnet die gebührenden, festgelegten oder ordnungsgemäßen Opfer. „Vorgeschriebenen“ macht ihren geregelten Charakter deutlich.
- source_word: προσαγόντων
  choice: darbrachten
  rationale: Im Opferkontext ist „Opfer darbringen“ die geläufige und präzise deutsche Wendung.
- source_word: ἐκέλευσεν παραδοῦναι τὸν ἄνδρα
  choice: befahl er ihnen, den Mann auszuliefern
  rationale: Die Wendung bezeichnet einen autoritativen Befehl zur Übergabe des gesuchten Mannes; die Priester sind aus der Genitivus-absolute-Konstruktion als Adressaten erschließbar.
theological_decisions:
- issue: Bedeutung von ἱερόν für das Jerusalemer Heiligtum
  choice: Tempel
  alternative: Heiligtum; Tempelbezirk
  rationale: „Tempel“ ist im Deutschen die natürliche Bezeichnung und kann hier wie ἱερόν die gesamte Tempelanlage meinen, ohne die Referenz unnötig auf das innere Heiligtum zu verengen.
- issue: Superlativ μέγιστον in der Tempelbezeichnung
  choice: größten
  alternative: großen
  rationale: Der griechische Superlativ wird im Haupttext bewahrt. Da er auch als feierlich gesteigerte Bezeichnung verstanden werden kann, wird die idiomatische Alternative in einer Fußnote genannt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Satzstruktur wurde für natürlichen deutschen Lesefluss in zwei Sätze gegliedert; strategische, kultische und autoritative Nuancen des griechischen Textes bleiben erhalten.
