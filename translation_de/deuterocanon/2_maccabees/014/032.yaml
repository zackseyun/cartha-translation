lexical_decisions:
- source_word: τῶν δὲ ... φασκόντων
  choice: Als sie aber ... erklärten
  rationale: Der Genitivus absolutus bezeichnet den begleitenden zeitlichen Umstand. „Als sie ... erklärten“ gibt die Konstruktion natürlich wieder; δέ markiert die Fortführung beziehungsweise den Gegensatz mit „aber“.
- source_word: μεθʼ ὅρκων
  choice: unter Eid
  rationale: Wörtlich „mit Eiden“. „Unter Eid“ bewahrt die feierliche Bekräftigung, ohne zwingend einen modernen förmlichen Gerichtsvorgang vorauszusetzen.
- source_word: μὴ γινώσκειν
  choice: sie wüssten nicht
  rationale: Der Infinitiv gibt den Inhalt ihrer Erklärung wieder. Der deutsche Konjunktiv I kennzeichnet die indirekte Rede und lässt offen, ob ihre Behauptung wahr war.
- source_word: ποῦ ποτʼ ἐστίν
  choice: wo sich ... befinde
  rationale: Die griechische Gegenwartsform innerhalb der berichteten Rede wird durch den Konjunktiv Präsens gewahrt. ποτε verleiht der Ortsfrage eine unbestimmte Nuance, die im Deutschen keiner ausdrücklichen Verstärkung bedarf.
- source_word: ὁ ζητούμενος
  choice: der Gesuchte
  rationale: Das substantivierte Passivpartizip bezeichnet die Person, nach der gesucht wird. „Der Gesuchte“ ist knapp, natürlich und erhält den passiven Sinn.
