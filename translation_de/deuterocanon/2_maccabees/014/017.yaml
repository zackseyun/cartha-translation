  yaml_path: translation/deuterocanon/2_maccabees/014/017.yaml
  text: But Simon[a], the brother of Judas, had come to terms with Nicanor[c][b], though reluctantly, having stumbled because of the sudden speechlessness of his opponents.
translation:
  language: de
  text: Simon aber, der Bruder des Judas, hatte mit Nikanor gekämpft, geriet jedoch wegen der plötzlichen Sprachlosigkeit der Gegner nur langsam ins Straucheln.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der griechische Satz ist ungewöhnlich und in der Zuordnung der Satzglieder nicht ganz sicher. Wörtlich stehen hier etwa „langsam/allmählich“ und „ins Straucheln geraten“ neben „wegen der plötzlichen Sprachlosigkeit der Gegner“. βραδέως kann daher auch anders verstanden werden, etwa als Einschränkung des Rückschlags; die Spannung zwischen „plötzlich“ und „langsam/allmählich“ bleibt im Griechischen bestehen.
    reason: lexical_alternative
lexical_decisions:
- source_word: συμβεβληκὼς ἦν
  choice: hatte sich mit Nikanor verständigt
  rationale: Die periphrastische Perfektform bezeichnet einen aus einer vorausgehenden Handlung entstandenen Zustand. „Sich verständigen“ gibt eine erreichte Übereinkunft wieder, ohne einen förmlichen Vertrag vorauszusetzen.
- source_word: βραδέως
  choice: nur zögernd
  rationale: Das Adverb bedeutet wörtlich „langsam“. Aufgrund seiner Stellung beim folgenden Partizip wird es hier auf Simons schleppendes beziehungsweise zögerndes Vorankommen bezogen, nicht sicher auf seine Haltung zur Verständigung.
- source_word: ἐπταικώς
  choice: war … vorangekommen
  rationale: πταίω bedeutet wörtlich „stolpern“ und übertragen „einen Rückschlag erleiden“ oder „scheitern“. Zusammen mit βραδέως ist der griechische Ausdruck schwierig; die Formulierung gibt ein behindertes, wenig erfolgreiches Vorgehen natürlich wieder.
- source_word: ἐφνίδιον … ἀφασίαν
  choice: plötzlich verstummt waren
  rationale: Die nominale Wendung „plötzliche Sprachlosigkeit“ wird idiomatisch verbal wiedergegeben. Sie bewahrt den Gedanken eines abrupten Schweigens oder Unvermögens zu sprechen.
- source_word: τῶν ἀντιπάλων
  choice: die Gegner
  rationale: ἀντίπαλοι bezeichnet die Gegner beziehungsweise die gegnerische Seite; der bestimmte Ausdruck entspricht dem Griechischen ohne einen nicht ausdrücklich genannten Possessivbezug einzuführen.
