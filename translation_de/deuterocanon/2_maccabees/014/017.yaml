  terminology: „Mit Nikanor kämpfen“ gibt den hier militärisch zu verstehenden Ausdruck συμβεβληκὼς ἦν zuverlässig wieder. „Ins Straucheln geraten“ bewahrt die Metapher von πταίω. „Sprachlosigkeit“ entspricht ἀφασία präziser als die bloße Aussage, die Gegner seien verstummt; ein Possessivpronomen wird nicht ergänzt.
