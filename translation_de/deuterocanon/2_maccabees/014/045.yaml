  rationale: Die Konjunktion „Obwohl“ wird durch „Während“ ersetzt, damit die neutrale begleitende Funktion des griechischen Genitivus absolutus gewahrt bleibt. „Lief durch die Menschenmengen“ ist eine natürlichere deutsche Entsprechung für die Bewegung „im Lauf“. Bei ἀπορρώγος wird im Text mit „schroffen“ eine breite, nicht überbestimmende Lösung gewählt; die Fußnote dokumentiert die möglichen räumlichen Nuancen. Das abschließende Komma bleibt bestehen, da der Satz im folgenden Vers fortgeführt wird.
