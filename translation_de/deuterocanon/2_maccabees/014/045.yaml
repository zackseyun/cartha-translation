lexical_decisions:
- source_word: ἔτι δὲ ἔμπνους ὑπάρχων
  choice: Doch noch immer atmend
  rationale: ἔμπνους bezeichnet wörtlich jemanden, der noch Atem hat, also noch lebt. Die Wiedergabe bewahrt das anschauliche körperliche Bild; δέ dient als erzählerischer Übergang.
- source_word: πεπυρωμένος τοῖς θυμοῖς
  choice: vor Zorn brennend
  rationale: Das Perfektpartizip πεπυρωμένος bezeichnet ein Entflammtsein; θυμοῖς verweist hier auf heftigen Zorn. Die deutsche Wendung ist natürlich und erhält die Intensität.
- source_word: ἐξαναστὰς
  choice: richtete er sich auf
  rationale: Das Aoristpartizip beschreibt, wie der schwer Verwundete sich wieder erhebt. „Richtete er sich auf“ passt zum körperlichen Kontext, ohne zusätzliche Dramatik einzutragen.
- source_word: φερομένων κρουνηδὸν τῶν αἱμάτων
  choice: sein Blut in Strömen hervorschoss
  rationale: κρουνηδόν schildert einen quell- oder brunnenartigen, schwallenden Blutfluss. „In Strömen hervorschoss“ gibt sowohl die Menge als auch die kraftvolle Bewegung wieder.
- source_word: δυσχερῶν τῶν τραυμάτων ὄντων
  choice: seine Wunden schwer waren
  rationale: δυσχερής kann schwer, schlimm oder schwer erträglich bedeuten. „Schwer“ ist im körperlichen Zusammenhang klar und lässt die genaue Nuance offen.
- source_word: δρόμῳ τοὺς ὄχλους διελθών
  choice: durchquerte er im Lauf die Menschenmengen
  rationale: δρόμῳ bezeichnet die Art der Bewegung, nämlich laufend; der Plural ὄχλους wird mit „Menschenmengen“ bewahrt.
- source_word: στὰς ἐπί τινος πέτρας ἀπορρώγος
  choice: stellte sich auf einen steil abfallenden Felsen
  rationale: πέτρα bezeichnet einen Felsen oder eine Felsklippe; ἀπορρώγος kann etwas Abgerissenes, Vorspringendes oder schroff Abfallendes beschreiben. Die Wiedergabe erhält die topografische Gefährlichkeit, ohne die Form zu eng festzulegen.
