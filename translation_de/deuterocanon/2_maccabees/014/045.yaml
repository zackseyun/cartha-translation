  text: Doch noch immer atmend und vor Zorn brennend richtete er sich auf. Während sein Blut in Strömen hervorschoss[a] und seine Wunden schwer waren, lief er durch die Menschenmengen und stellte sich auf einen schroffen Felsen[b],
