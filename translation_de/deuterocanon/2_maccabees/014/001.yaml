lexical_decisions:
- source_word: Μετὰ δὲ τριετῆ χρόνον
  choice: Doch nach drei Jahren
  rationale: μετά mit Akkusativ bezeichnet den Zeitpunkt nach Ablauf des genannten Zeitraums; δέ setzt die Erzählung mit einem leichten Übergang fort.
- source_word: προσέπεσεν τοῖς περὶ τὸν Ἰούδαν
  choice: erfuhren Judas und seine Gefährten[a]
  rationale: προσπίπτω bedeutet wörtlich „darauffallen“, bezeichnet hier aber idiomatisch, dass eine Nachricht die Betreffenden erreichte. οἱ περὶ τὸν Ἰούδαν umfasst Judas und die Menschen in seinem Umfeld beziehungsweise seine Gefährten.
- source_word: Δημήτριον τὸν τοῦ Σελεύκου
  choice: Demetrius, der Sohn des Seleukus
  rationale: Die Konstruktion aus Artikel und Genitiv bezeichnet die Abstammung; die ausdrückliche Wiedergabe mit „Sohn“ ist im Deutschen klar und natürlich.
- source_word: διὰ τοῦ κατὰ Τρίπολιν λιμένος εἰσπλεύσαντα
  choice: durch den Hafen bei Tripolis eingelaufen war
  rationale: εἰσπλέω bezeichnet das Hinein- oder Einlaufen auf dem Seeweg; διά mit Genitiv gibt den Weg durch den bei Tripolis gelegenen Hafen an. Das Plusquamperfekt ordnet das Partizip sachgerecht der empfangenen Nachricht unter.
- source_word: μετὰ πλήθους ἰσχυροῦ καὶ στόλου
  choice: mit einer starken Streitmacht und einer Flotte
  rationale: πλῆθος bezeichnet im militärischen Zusammenhang eine Truppenmacht; ἰσχυρός hebt ihre Stärke hervor, während στόλος die Flotte gesondert nennt.
