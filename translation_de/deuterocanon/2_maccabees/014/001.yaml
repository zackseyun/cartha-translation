translation:
  language: de
  text: Doch nach drei Jahren erfuhren Judas und seine Gefährten[a], dass Demetrius, der Sohn des Seleukus, mit einer starken Streitmacht und einer Flotte in den Hafen bei Tripolis eingelaufen war,
