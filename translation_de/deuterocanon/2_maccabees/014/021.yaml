base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/014/021.yaml
  text: So they set a day on which they would come together privately; and from each side a sedan chair was brought forward[a], and seats were set out.
translation:
  language: de
  text: Sie vereinbarten einen Tag, an dem sie privat zusammentreffen sollten. Von jeder Seite wurde eine Sänfte[a] herbeigebracht, und man stellte Sitze auf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort δίφραξ ist hier selten und kann eine Sänfte, einen Tragsessel oder einen ähnlichen tragbaren Sitz bezeichnen; die genaue Art des Gegenstands ist ungewiss.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐτάξαντο
  choice: sie vereinbarten
  rationale: Der mediale Gebrauch von τάσσω bezeichnet hier die gemeinsame Festlegung eines Tages; „vereinbarten“ passt natürlich zu zwei Verhandlungsparteien.
- source_word: ἡμέραν
  choice: einen Tag
  rationale: Das artikellose Substantiv bezeichnet einen bestimmten, von den Parteien festzulegenden Tag, ohne ihn näher zu bestimmen.
- source_word: κατʼ ἰδίαν
  choice: unter vier Augen
  rationale: Die Wendung bezeichnet ein nicht öffentliches Zusammentreffen. Die geläufige deutsche Formulierung gibt den Sinn im Kontext zweier Verhandlungsführer natürlich wieder.
- source_word: ἥξουσιν εἰς τὸ αὐτό
  choice: an demselben Ort zusammenkommen wollten
  rationale: Die Wiedergabe bewahrt sowohl die räumliche Aussage von εἰς τὸ αὐτό als auch den im Deutschen durch die indirekte Rede erforderlichen Zukunftssinn.
- source_word: προῆλθε
  choice: wurde ... herbeigebracht
  rationale: Obwohl das griechische Verb formal aktiv und singular ist, legt der Sachzusammenhang nahe, dass der Gegenstand für das Treffen herbeigeschafft wurde. Die deutsche Passivform vermeidet eine unnatürliche Personifizierung.
- source_word: παρʼ ἑκάστου
  choice: von jeder Seite
  rationale: Gemeint sind im Kontext wahrscheinlich die beiden beteiligten Parteien, nicht jeder einzelne Anwesende.
- source_word: δίφραξ
  choice: Sänfte
  rationale: Das seltene Wort bezeichnet vermutlich einen tragbaren Sitz oder ein ähnliches Beförderungsmittel. „Sänfte“ ist im Deutschen verständlich, doch die genaue Form bleibt unsicher und wird in der Fußnote offengelegt.
- source_word: ἔθεσαν δίφρους
  choice: man stellte Sitze auf
  rationale: δίφρος kann einen Sitz, Hocker oder Stuhl bezeichnen. „Sitze“ wahrt die Unbestimmtheit; das unpersönliche „man“ gibt den nicht genannten pluralischen Handlungsträger wieder.
