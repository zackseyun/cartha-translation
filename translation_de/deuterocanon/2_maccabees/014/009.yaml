base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/014/009.yaml
  text: Since you know each of these things[a], O king, take thought for the country and for our nation that is being hard pressed[b], according to the gracious goodwill you have toward all.
translation:
  language: de
  text: Da du, König, jedes Einzelne davon genau kennst, nimm dich des Landes und unseres Volkes an, das bedrängt wird[a], entsprechend der bereitwilligen Güte[b], die du allen entgegenbringst.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „unseres Volkes, das ringsum bedrängt wird“ beziehungsweise „unseres bedrängten Volkes“. Das griechische Partizip kann ein Umringtsein oder allgemeiner eine starke Bedrängnis bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Der griechische Ausdruck ist selten und bezeichnet eine menschenfreundliche Güte, die bereitwillig erwiesen wird oder anderen zugänglich ist.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕκαστα ... τούτων
  choice: jedes Einzelne davon
  rationale: Die Formulierung bewahrt den verteilenden Sinn von ἕκαστα mit τούτων und bleibt im Deutschen natürlich.
- source_word: ἐπεγνωκώς
  choice: genau kennst
  rationale: Das Perfektpartizip bezeichnet eine bereits erlangte, klare Kenntnis; „genau kennst“ gibt dies knapp und idiomatisch wieder.
- source_word: προσνοήθητι
  choice: nimm dich ... an
  rationale: Der Imperativ fordert nicht nur Aufmerksamkeit, sondern fürsorgliches Handeln; die deutsche Wendung passt zudem zur Genitivkonstruktion des Griechischen.
- source_word: χώρας
  choice: des Landes
  rationale: χώρα bezeichnet hier im politischen Zusammenhang das betroffene Territorium; „Land“ ist präzise und natürlich.
- source_word: τοῦ περιισταμένου γένους ἡμῶν
  choice: unseres Volkes, das bedrängt wird
  rationale: γένος meint hier das eigene Volk. Das Präsenspartizip wird als fortdauernde Bedrängnis wiedergegeben, ohne festzulegen, ob diese räumlich oder allgemein zu verstehen ist.
- source_word: καθ᾽ ἣν ἔχεις ... φιλανθρωπίαν
  choice: entsprechend der ... Güte, die du ... entgegenbringst
  rationale: κατά bezeichnet den Maßstab des erbetenen Handelns. „Güte“ vermittelt die menschenfreundliche, wohlwollende Haltung von φιλανθρωπία in diesem höfisch-politischen Kontext.
- source_word: εὐαπάντητον
  choice: bereitwilligen
  rationale: Das seltene Adjektiv beschreibt eine Güte, die zugänglich beziehungsweise bereitwillig erwiesen wird. „Bereitwillig“ bewahrt diesen Zug, ohne eine ungesicherte Spezialbedeutung festzuschreiben.
- source_word: πρὸς ἅπαντας
  choice: allen entgegenbringst
  rationale: Die Formulierung gibt die auf alle Menschen gerichtete Haltung idiomatisch wieder.
