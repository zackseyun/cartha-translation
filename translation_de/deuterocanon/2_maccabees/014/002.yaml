translation:
  language: de
  text: die Herrschaft über das Land an sich gebracht habe, nachdem er Antiochus und dessen Vormund Lysias beseitigt hatte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „nachdem er Antiochus und dessen Regenten Lysias entmachtet hatte“. Das griechische Wort für „Vormund“ kann auch einen Verwalter oder Regenten bezeichnen; „beseitigt“ lässt offen, auf welche Weise sie ausgeschaltet wurden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κεκρατηκέναι τῆς χώρας
  choice: die Herrschaft über das Land an sich gebracht habe
  rationale: Der Perfektinfinitiv von κρατέω bezeichnet hier erlangte Herrschaft oder Kontrolle. Der deutsche Konjunktiv fügt sich in die indirekte Rede des übergeordneten Satzes ein; „Land“ gibt χώρα im politischen Sinn wieder.
- source_word: ἐπανελόμενον
  choice: nachdem er … beseitigt hatte
  rationale: Das Partizip von ἐπαναιρέω bezeichnet hier die Beseitigung politischer Gegner, ohne im Haupttext eine bestimmte Art der Ausschaltung festzulegen.
- source_word: Ἀντίοχον
  choice: Antiochus
  rationale: Der Personenname wird in seiner üblichen deutschen Form wiedergegeben.
- source_word: τὸν τούτου ἐπίτροπον
  choice: dessen Vormund
  rationale: ἐπίτροπος kann einen Vormund, Verwalter oder Regenten bezeichnen. „Vormund“ ist eine direkte, verständliche Wiedergabe; Lysias’ politische Funktion wird in der Fußnote kenntlich gemacht.
- source_word: Λυσίαν
  choice: Lysias
  rationale: Der Personenname wird nach der üblichen deutschen Form wiedergegeben.
