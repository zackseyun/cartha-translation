base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/014/018.yaml
  text: Yet when Nicanor heard of the valor that those around Judas had[a], and of their courage in the struggles for their fatherland, he was reluctant to settle the matter by bloodshed.
translation:
  language: de
  text: Doch als Nikanor von der Tapferkeit der Männer um Judas und von ihrem Mut in den Kämpfen für die Heimat hörte, scheute er sich, die Entscheidung durch Blutvergießen herbeizuführen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Sache durch Blutvergießen zu entscheiden“; wörtlicher: „die Entscheidung durch Blut herbeizuführen“.'
    reason: Die griechische Wendung τὴν κρίσιν διʼ αἵματος ποιήσασθαι ist idiomatisch; κρίσις kann hier Entscheidung, Urteil oder Beilegung bezeichnen.
lexical_decisions:
- source_word: ὅμως δὲ
  choice: Doch
  rationale: Kennzeichnet knapp und natürlich die einräumend-adversative Wendung gegenüber dem vorausgehenden Zusammenhang.
- source_word: ἀκούων
  choice: als ... hörte
  rationale: Das Partizip wird als temporaler Begleitumstand wiedergegeben; dies entspricht hier natürlichem modernem Deutsch.
- source_word: ἀνδραγαθίαν
  choice: Tapferkeit
  rationale: Bezeichnet mutige Bewährung, besonders im kämpferischen Zusammenhang, ohne die im Deutschen unnatürliche etymologische Geschlechtsmarkierung nachzuahmen.
- source_word: οἱ περὶ τὸν Ἰούδαν
  choice: die Männer um Judas
  rationale: Gibt die idiomatische Bezeichnung für Judas und die mit ihm verbundene Gruppe verständlich und kontextgemäß wieder.
- source_word: ἐν τοῖς περὶ τῆς πατρίδος ἀγῶσιν
  choice: in den Kämpfen für die Heimat
  rationale: ἀγῶνες bezeichnet hier die militärisch-politischen Kämpfe; πατρίς wird mit dem natürlichen und emotional passenden „Heimat“ wiedergegeben.
- source_word: εὐψυχίαν
  choice: Mut
  rationale: Vermittelt die gemeinte Beherztheit und innere Standhaftigkeit klar und idiomatisch.
- source_word: ὑπευλαβεῖτο
  choice: scheute er sich
  rationale: Bewahrt den Sinn vorsichtiger Zurückhaltung beziehungsweise des Zurückschreckens stärker als ein bloßes „zögerte“.
- source_word: τὴν κρίσιν διʼ αἵματος ποιήσασθαι
  choice: die Entscheidung durch Blutvergießen herbeizuführen
  rationale: Bewahrt κρίσις als „Entscheidung“ und gibt die idiomatische Wendung mit διʼ αἵματος in verständlichem Deutsch wieder, ohne sie auf eine einzelne Deutung wie „die Sache beilegen“ zu verengen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Die Männer um Judas“ ist im militärischen Zusammenhang natürlicher als das formal nähere „die um Judas“. Der Haupttext wahrt mit „Entscheidung“ die Offenheit von κρίσις; die Fußnote dokumentiert die idiomatischen Alternativen.
