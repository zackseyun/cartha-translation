base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/007/030.yaml
  text: And while she was still finishing[a], the young man said, “What are you waiting for? I do not obey the king’s command, but I obey the command of the law that was given to our fathers through Moses.”
translation:
  language: de
  text: 'Während sie noch ihre Worte zu Ende brachte, sagte der junge Mann: »Worauf wartet ihr? Ich gehorche nicht dem Befehl des Königs, sondern dem Befehl des Gesetzes, das unseren Vätern durch Mose gegeben wurde.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔτι δὲ ταύτης καταληγούσης
  choice: Während sie noch ihre Worte zu Ende brachte
  rationale: Der Genitivus absolutus bezeichnet eine gleichzeitig ablaufende Handlung der Mutter. καταλήγω meint hier das Beenden ihrer Rede; die Ergänzung »ihre Worte« macht den im Griechischen nur mitgedachten Bezug im Deutschen natürlich verständlich.
- source_word: ὁ νεανίας
  choice: der junge Mann
  rationale: νεανίας bezeichnet einen jungen männlichen Menschen; »der junge Mann« ist gegenwärtiges, natürliches Standarddeutsch.
- source_word: Τίνα μένετε;
  choice: Worauf wartet ihr?
  rationale: Die elliptische Frage bedeutet wörtlich etwa »Auf was wartet ihr?«. »Worauf wartet ihr?« ist im Deutschen idiomatisch und bewahrt die herausfordernde Frage.
- source_word: οὐχ ὑπακούω
  choice: Ich gehorche nicht
  rationale: Die Präsensform wird eng am Griechischen wiedergegeben und drückt im Zusammenhang die grundsätzliche Weigerung aus.
- source_word: τοῦ προστάγματος τοῦ βασιλέως
  choice: dem Befehl des Königs
  rationale: πρόσταγμα bezeichnet eine Anordnung oder einen Befehl. »Befehl« passt zum königlichen Anspruch und bildet einen deutlichen Gegensatz zum Gebot des Gesetzes.
- source_word: τοῦ δὲ προστάγματος ἀκούω τοῦ νόμου
  choice: sondern dem Gebot des Gesetzes
  rationale: ἀκούω mit Genitiv kann »hören auf«, »befolgen« oder »gehorchen« bedeuten. Das aus dem ersten Satzteil fortwirkende »gehorche« gibt den praktischen Sinn wieder; »Gebot« entspricht πρόσταγμα und klingt in Verbindung mit dem Gesetz natürlich.
- source_word: τοῦ δοθέντος τοῖς πατράσιν ἡμῶν
  choice: das unseren Vätern gegeben wurde
  rationale: πατράσιν bedeutet wörtlich »Vätern« und trägt hier die Sprache der überlieferten Bundesgeschichte; die maskuline Bezeichnung wird daher nicht verallgemeinert.
- source_word: διὰ Μωσῆ
  choice: durch Mose
  rationale: διά mit Genitiv bezeichnet Vermittlung; »durch Mose« gibt diese Funktion präzise wieder.
theological_decisions:
- issue: Bezeichnung der Vorfahren mit πατράσιν
  choice: unseren Vätern
  alternative: unseren Vorfahren
  rationale: Die ausdrücklich maskuline Form erinnert an die väterliche Überlieferungs- und Bundeslinie. »Väter« bewahrt diese Färbung, ohne darüber hinaus eine theologische Deutung einzutragen.
- issue: Verhältnis von königlichem Befehl und Gesetz
  choice: Befehl des Königs / Gebot des Gesetzes
  alternative: Anordnung des Königs / Anordnung des Gesetzes
  rationale: 'Das gleiche griechische Substantiv πρόσταγμα steht in beiden Wendungen. Im Deutschen ist eine leichte lexikalische Differenzierung idiomatischer: »Befehl« bezeichnet passend die königliche Anordnung, »Gebot« die verbindliche Forderung des Gesetzes. Der rhetorische Gegensatz bleibt erhalten.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede ist entschieden, aber nicht unnötig gehoben. Keine Fußnote ist erforderlich, da Τίνα μένετε? im Deutschen mit »Worauf wartet ihr?« sowohl natürlich als auch nahe an der griechischen Ellipse wiedergegeben werden kann.
