base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/007/036.yaml
  text: For our brothers[a], having now endured a brief pain, have fallen under God's covenant into everlasting life; but you, by the judgment of God, will justly bear the penalties of your arrogance.
translation:
  language: de
  text: Denn unsere Brüder sind, nachdem sie jetzt ein kurzes Leiden ertragen haben, nach Gottes Bund zum unvergänglichen Leben gefallen[a]. Du aber wirst durch Gottes Urteil die gerechten Strafen für deinen Hochmut tragen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Wendung ist sehr verdichtet. Wörtlich steht etwa: „sind unter Gottes Bund zum unvergänglichen Leben gefallen“. „Gefallen“ bezeichnet im Zusammenhang ihren Tod; die genaue Beziehung von Gottes Bund und dem unvergänglichen Leben bleibt syntaktisch offen.'
    reason: alternative_reading
lexical_decisions:
- source_word: βραχὺν ἐπενέγκαντες πόνον
  choice: eine kurze Qual ertragen
  rationale: Die Wendung bezeichnet das Tragen beziehungsweise Durchstehen eines nur kurz dauernden Leidens. „Qual“ entspricht dem Folterkontext, ohne die Aussage weiter auszudeuten.
- source_word: ἀενάου ζωῆς
  choice: für das ewige Leben
  rationale: ἀέναος bezeichnet etwas Fortdauerndes oder Unaufhörliches. „Ewiges Leben“ ist im Deutschen klar und würdig; die Zuordnung des Genitivs bleibt wegen der gedrängten griechischen Syntax erläuterungsbedürftig.
- source_word: ὑπὸ διαθήκην θεοῦ
  choice: unter Gottes Bund
  rationale: Die ungewöhnliche Formulierung bewahrt sowohl die Präposition ὑπό mit Akkusativ als auch den ausdrücklichen Bundesbegriff, statt ihn zu einer bloßen Verheißung abzuschwächen.
- source_word: πεπτώκασιν
  choice: sind ... gefallen
  rationale: Das Perfekt von πίπτω bedeutet wörtlich „sind gefallen“. Im Martyriumskontext bezeichnet es ihren Tod; „gefallen“ erhält zugleich das Bild des Ausgangstextes.
- source_word: τῇ τοῦ θεοῦ κρίσει
  choice: nach Gottes Urteil
  rationale: κρίσις bezeichnet hier Gottes richterliches Urteil. „Nach“ gibt den Maßstab beziehungsweise die richterliche Grundlage der Strafe natürlich wieder.
- source_word: δίκαια τὰ πρόστιμα
  choice: die gerechten Strafen
  rationale: πρόστιμα kann auferlegte Bußen oder Strafen bezeichnen; im Zusammenhang des göttlichen Gerichts ist „Strafen“ treffender als das engere „Geldbußen“. δίκαια wird attributiv mit „gerecht“ wiedergegeben.
- source_word: ὑπερηφανίας
  choice: Hochmut
  rationale: Das Wort bezeichnet überheblichen Stolz. „Hochmut“ ist im Deutschen geläufig, prägnant und dem feierlich-gerichtlichen Ton angemessen.
- source_word: ἀποίσῃ
  choice: wirst ... tragen
  rationale: Das Futur von ἀποφέρω hat hier den Sinn, auferlegte Strafen zu tragen beziehungsweise zu erdulden. Die knappe Wiedergabe bewahrt die direkte Drohung.
theological_decisions:
- issue: Verhältnis von Martyrium, Gottes Bund und ewigem Leben in ἀενάου ζωῆς ὑπὸ διαθήκην θεοῦ πεπτώκασιν
  choice: Die Brüder sind nach kurzem Leiden „unter Gottes Bund für das ewige Leben gefallen“.
  alternative: Die Brüder sind „unter Gottes Bund des ewigen Lebens gefallen“ beziehungsweise „im Bund Gottes für das ewige Leben gestorben“.
  rationale: Die griechische Wortfolge ist stark verdichtet und lässt die genaue syntaktische Beziehung von „ewigem Leben“, „Bund Gottes“ und „gefallen“ offen. Der Haupttext erhält Bundesbegriff und Fallensbild und vermeidet eine weitergehende dogmatische Erklärung; die Fußnote nennt die naheliegenden Verständnismöglichkeiten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau bleibt klar und direkt; die ungewöhnliche Bundesformulierung wird bewusst nicht geglättet, weil die griechische Syntax echte Mehrdeutigkeit enthält.
