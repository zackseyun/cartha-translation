base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/007/008.yaml
  text: But he answered in the language of his fathers and said[a], “No.” Therefore this one also received the next torture, like the first.
translation:
  language: de
  text: 'Er aber antwortete in der Sprache seiner Vorfahren[a]: »Nein.« Darum erlitt auch dieser die folgende Folter wie der erste.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »in seiner angestammten Sprache« oder »in seiner Muttersprache«. Das Griechische spricht wörtlich von der väterlichen beziehungsweise von den Vorfahren überlieferten Sprache.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς
  choice: antwortete
  rationale: Das aoristische Partizip von ἀποκρίνομαι ist hier deponentisch gebraucht und bezeichnet eine unmittelbare Antwort.
- source_word: τῇ πατρίῳ φωνῇ
  choice: in der Sprache seiner Vorfahren
  rationale: πατρίος bezeichnet das von den Vätern beziehungsweise Vorfahren Überkommene; φωνή meint hier im Zusammenhang Sprache oder Sprechweise. Die Formulierung bewahrt den Bezug auf Herkunft und Identität, ohne eine bestimmte Sprache festzulegen.
- source_word: προσεῖπεν
  choice: direkte Rede nach Doppelpunkt
  rationale: Das Verb führt die folgende Äußerung ein. Im Deutschen gibt der Doppelpunkt diese Funktion natürlich wieder; ein zusätzliches »sagte« wäre nach »antwortete« unnötig schwerfällig.
- source_word: Οὐχί
  choice: Nein
  rationale: Die verstärkte Verneinung steht als entschiedene knappe Antwort. »Nein« gibt sie im Deutschen unmittelbar wieder, ohne zusätzliche Erläuterung einzutragen.
- source_word: διόπερ
  choice: Darum
  rationale: Die Konjunktion bezeichnet die Folge seiner Weigerung. »Darum« ist klar, gegenwärtig und bewahrt den Folgerungszusammenhang.
- source_word: οὗτος
  choice: dieser
  rationale: Das Demonstrativpronomen verweist betont auf den gerade genannten Bruder; »dieser« erhält diesen Verweis stärker als ein bloßes »er«.
- source_word: τὴν ἑξῆς βάσανον
  choice: die nächste Folter
  rationale: ἑξῆς bezeichnet das in der Reihenfolge Folgende, während βάσανος im gewaltsamen Kontext Folter meint.
- source_word: ἔλαβεν
  choice: musste … erleiden
  rationale: Wörtlich steht »empfing«. Die deutsche Wendung drückt idiomatisch aus, dass ihm die Folter zugefügt wurde, ohne seine Freiwilligkeit anzudeuten.
- source_word: ὡς ὁ πρῶτος
  choice: wie der erste
  rationale: Die knappe Vergleichsform bleibt erhalten und verweist auf den zuerst gefolterten Bruder.
theological_decisions:
- issue: Bedeutung von τῇ πατρίῳ φωνῇ
  choice: in der Sprache seiner Vorfahren
  alternative: in seiner Vatersprache; in seiner Muttersprache; in seiner angestammten Sprache
  rationale: Die Wendung verbindet Sprache mit väterlicher beziehungsweise angestammter Herkunft und trägt im Verfolgungskontext eine Identitätsdimension. Die gewählte Fassung bewahrt diese, ohne die gemeinte Sprache zu bestimmen oder den Ausdruck auf bloße Muttersprache zu verengen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Antwort und die harte Folgerung bleiben erhalten. Der Doppelpunkt vermeidet die im Deutschen schwerfällige Doppelung »antwortete … und sagte«.
