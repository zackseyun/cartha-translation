translation:
  language: de
  text: Zuletzt[a], nach den Söhnen, starb die Mutter.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die knappe griechische Wendung lässt sich auch enger am Wortlaut mit „Als Letzte nach den Söhnen“ wiedergeben.
