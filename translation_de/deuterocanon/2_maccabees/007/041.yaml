lexical_decisions:
- source_word: ἐσχάτῃ
  choice: Zuletzt
  rationale: Die feminine Dativform von ἔσχατος wird hier adverbial als Angabe der Reihenfolge verstanden. „Zuletzt“ gibt diese knappe Erzählfolge im Deutschen natürlich wieder.
- source_word: τῶν υἱῶν
  choice: nach den Söhnen
  rationale: υἱῶν bezeichnet ausdrücklich die Söhne. Der Genitiv steht bei der Reihenfolgeangabe und wird im Deutschen sinngemäß mit „nach“ wiedergegeben, ohne ein im Griechischen nicht ausdrücklich vorhandenes Possessivpronomen einzufügen.
- source_word: ἡ μήτηρ
  choice: die Mutter
  rationale: Die bestimmte Nominalgruppe wird formal entsprechend als „die Mutter“ wiedergegeben; „ihre Mutter“ wäre kontextuell verständlich, fügte aber ein nicht ausdrücklich vorhandenes Possessivpronomen hinzu.
- source_word: ἐτελεύτησεν
  choice: starb
  rationale: τελευτάω bedeutet hier schlicht „sterben“. „Starb“ bewahrt die nüchterne, feierlich-knappe Ausdrucksweise und vermeidet einen Euphemismus.
