lexical_decisions:
- source_word: Ἐκθύμως
  choice: in heftigen Zorn
  rationale: Die Wendung gibt die starke, aufwallende Wut natürlich und würdig wieder, ohne die Intensität zum bloßen „zornig“ abzuschwächen.
- source_word: γενόμενος
  choice: geriet
  rationale: Das Partizip bezeichnet hier den Eintritt in einen Zustand; „geriet in heftigen Zorn“ ist im Deutschen idiomatisch und bewahrt den ingressiven Sinn.
- source_word: ὁ βασιλεὺς
  choice: der König
  rationale: Direkte und sachgerechte Wiedergabe des griechischen Titels.
- source_word: προσέταξεν
  choice: befahl
  rationale: Das Verb bezeichnet einen verbindlichen Befehl; „befahl“ bewahrt dessen autoritativen Nachdruck.
- source_word: τήγανα
  choice: Bratpfannen
  rationale: Das Wort bezeichnet Pfannen zum Braten oder Backen; „Bratpfannen“ ist die klare moderne Entsprechung.
- source_word: λέβητας
  choice: Kessel
  rationale: Gemeint sind größere Metallgefäße; „Kessel“ ist im Deutschen präzise und weniger altertümlich als „Kesseltöpfe“.
- source_word: ἐκπυροῦν
  choice: glühend heiß zu machen
  rationale: Das Verb bezeichnet starkes Erhitzen durch Feuer. Die Formulierung vermittelt die Intensität natürlicher als das schwächere „zu erhitzen“, ohne zwingend zu behaupten, dass das Metall sichtbar rot glühte.
