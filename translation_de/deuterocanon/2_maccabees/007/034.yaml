base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/007/034.yaml
  text: But you[a], O unholy one, most defiled of all men, do not be vainly puffed up, inflamed with uncertain hopes, having raised your hands against the children of heaven.
translation:
  language: de
  text: Du aber, du Gottloser, der du unter allen Menschen am meisten befleckt bist, überhebe dich nicht vergeblich, entflammt von ungewissen Hoffnungen, nachdem du deine Hände gegen die Kinder des Himmels[a] erhoben hast.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die himmlischen Kinder«. Das griechische οὐρανίους kann entweder die Kinder selbst als »himmlisch« kennzeichnen oder ihre Zugehörigkeit zum Himmel ausdrücken.'
    reason: Die Übersetzung von οὐρανίους als Zugehörigkeitsgenitiv ist möglich, aber nicht die einzige Lesart; die Fußnote erhält die Ambiguität.
lexical_decisions:
- source_word: ἀνόσιε
  choice: du Unheiliger
  rationale: Der Vokativ ist eine direkte religiös-moralische Anklage. »Unheiliger« bewahrt diesen Bezug und die scharfe persönlichen Anrede.
- source_word: μιαρώτατε
  choice: Beflecktester aller Menschen
  rationale: Der Superlativ von μιαρός bezeichnet höchste kultische oder moralische Befleckung. Die ungewöhnlich kräftige Form bewahrt sowohl den Superlativ als auch die Unreinheitsmetaphorik.
- source_word: μὴ μάτην μετεωρίζου
  choice: überhebe dich nicht vergeblich
  rationale: μετεωρίζου kann ein Sich-Erheben oder Sich-Überheben bezeichnen; im Zusammenhang ist hochmütige Selbsterhöhung gemeint, während μάτην deren Vergeblichkeit ausdrückt.
- source_word: φρυττόμενος
  choice: entflammt
  rationale: Das Partizip vermittelt das Bild des Erhitzens oder Entbrennens und beschreibt hier die emotionale Erregung durch die Hoffnungen.
- source_word: ἀδήλοις ἐλπίσιν
  choice: von ungewissen Hoffnungen
  rationale: ἄδηλος bedeutet nicht offenbar, unklar oder ungewiss. »Ungewiss« wahrt die Unsicherheit, ohne die Hoffnungen ausdrücklich als trügerisch auszulegen.
- source_word: οὐρανίους παῖδας
  choice: die Kinder des Himmels
  rationale: παῖδας wird allgemein als »Kinder« wiedergegeben; »des Himmels« bewahrt die Zugehörigkeitsnuance des Adjektivs, ohne einen im Griechischen nicht ausdrücklich genannten Gottestitel einzufügen.
- source_word: ἐπαράμενος χεῖρας
  choice: nachdem du deine Hände gegen ... erhoben hast
  rationale: Die Wendung mit ἐπί und Akkusativ bezeichnet eine feindselige Handlung gegen jemanden. Die deutsche Formulierung erhält das körperliche Bild und gibt das vorzeitige Partizip natürlich wieder.
theological_decisions:
- issue: Bedeutung von οὐρανίους in οὐρανίους παῖδας
  choice: die Kinder des Himmels
  alternative: die himmlischen Kinder
  rationale: Das Adjektiv kann die Kinder als himmlisch kennzeichnen oder ihre Zugehörigkeit zum Himmel ausdrücken. Der Haupttext wählt die Zugehörigkeitslesart; die Fußnote erhält die echte Mehrdeutigkeit, ohne »Gottes« in den Text einzutragen.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit bewusst scharfer Anrede. »Beflecktester« ist markiert, aber verständlich und erhält den Superlativ sowie die Unreinheitssprache des griechischen Textes.
