base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/007/037.yaml
  text: But I[a], like my brothers, give up both body and life for the laws of our fathers, calling on God quickly to become merciful to the nation, and for you, through torments and whippings[b], to confess that he alone is God.
translation:
  language: de
  text: Ich aber gebe wie meine Brüder Leib und Leben[a] für die Gesetze unserer Väter preis und rufe Gott an, damit er dem Volk bald gnädig wird und du unter Foltern und Geißelhieben bekennst[b], dass er allein Gott ist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Los“ oder „Schicksal“. Das griechische Wort τύχη kann das Los oder Geschick eines Menschen bezeichnen; hier ist konkret das im Martyrium hingegebene Leben gemeint.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „offen anerkennst“. Das griechische Verb kann ein ausdrückliches öffentliches Eingeständnis bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθάπερ οἱ ἀδελφοί
  choice: wie meine Brüder
  rationale: Gibt den Vergleich mit den bereits gemarterten Brüdern schlicht und unmittelbar wieder.
- source_word: σῶμα καὶ τύχην
  choice: Leib und Leben
  rationale: σῶμα bezeichnet den leiblichen Körper; τύχη bedeutet wörtlich Los, Geschick oder Schicksal, meint hier im Zusammenhang des Martyriums jedoch das aufgegebene Leben. Die feste deutsche Verbindung „Leib und Leben“ ist natürlich und trifft den konkreten Sinn.
- source_word: προδίδωμι
  choice: gebe … preis
  rationale: Bezeichnet hier die bewusste Hingabe an Leiden und Tod. „Preisgeben“ wahrt den Ernst der Selbsthingabe, ohne fälschlich den üblichen Sinn „verraten“ aufzudrängen.
- source_word: περὶ τῶν πατρίων νόμων
  choice: für die Gesetze unserer Väter
  rationale: περί bezeichnet hier den Grund beziehungsweise die Sache, für die der Sprecher stirbt; πατρίων bewahrt die familiäre und überlieferungsgeschichtliche Prägung.
- source_word: ἐπικαλούμενοι τὸν θεόν
  choice: Dabei rufe ich Gott an
  rationale: Gibt den begleitenden Gebetsruf idiomatisch wieder. Der griechische Plural des Partizips steht auffällig neben dem Singular ἐγώ; der Zusammenhang legt dennoch die Äußerung des einzelnen Sprechers nahe.
- source_word: ἵλεων ταχὺ τῷ ἔθνει γενέσθαι
  choice: er möge dem Volk bald gnädig werden
  rationale: ἵλεως bezeichnet eine gnädige oder versöhnte Zuwendung; ἔθνος meint hier das jüdische Volk. Die Stellung von „bald“ hält die Dringlichkeit des Gebets fest.
- source_word: μετὰ ἐτασμῶν καὶ μαστίγων
  choice: durch Folterverhöre und Geißelhiebe
  rationale: ἐτασμός kann eine Prüfung oder Untersuchung bezeichnen und meint in diesem Strafkontext ein Verhör unter Folter; μάστιγες sind Geißeln beziehungsweise die damit versetzten Hiebe.
- source_word: ἐξομολογήσασθαι
  choice: zu bekennen
  rationale: Das Verb kann ein ausdrückliches, offenes Eingeständnis oder Bekenntnis bezeichnen. „Bekennen“ erhält den feierlichen Charakter der erzwungenen Anerkennung.
- source_word: διότι μόνος αὐτὸς θεὸς ἐστίν
  choice: dass er allein Gott ist
  rationale: Bewahrt den Rückverweis von αὐτός auf den zuvor genannten Gott und die durch μόνος hervorgehobene Ausschließlichkeit.
theological_decisions:
- issue: Ausschließlicher Gottesanspruch im Schlusssatz
  choice: dass er allein Gott ist
  alternative: dass er der einzige Gott ist
  rationale: Die gewählte Fassung bildet μόνος αὐτός eng ab und lässt den emphatischen Rückbezug auf den angerufenen Gott bestehen, ohne den Satz erklärend auszuweiten.
- issue: Familiärer Charakter der überlieferten Gesetze
  choice: die Gesetze unserer Väter
  alternative: die überlieferten Gesetze / die Gesetze unserer Vorfahren
  rationale: Die Formulierung bewahrt die konkrete Rede von den Vätern und damit die familiäre sowie geschichtliche Textur des griechischen πατρίων.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Leib und Leben preisgeben“ ist gut verständlich und trägt den feierlichen Ernst der Märtyrerrede. Der lange griechische Satz wurde zur besseren Lesbarkeit in zwei Sätze gegliedert; die Gebetsstruktur und die Abfolge der Aussagen bleiben erhalten.
