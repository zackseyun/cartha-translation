base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/007/025.yaml
  text: But since the young man was paying no attention at all, the king called the mother to him and urged her to become an adviser to the youth for his preservation.
translation:
  language: de
  text: Da der junge Mann jedoch überhaupt nicht darauf achtete[a], ließ der König die Mutter zu sich rufen und drängte sie, dem jungen Mann zu seiner Rettung[b] mit Rat zur Seite zu stehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „überhaupt nicht zuhörte“. Das Griechische betont, dass er dem Gesagten keinerlei Beachtung schenkte.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „zu seiner Bewahrung“, „zu seiner Sicherheit“ oder „zu seinem Heil“. Das griechische Wort kann Rettung, Bewahrung, Sicherheit oder Heil bezeichnen; hier steht unmittelbar die Rettung seines Lebens im Blick.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦ ... νεανίου
  choice: der junge Mann
  rationale: Bezeichnet einen jungen Mann; die natürliche moderne Wiedergabe passt zum Erzählzusammenhang.
- source_word: μηδαμῶς προσέχοντος
  choice: überhaupt nicht darauf einging
  rationale: Gibt die durch μηδαμῶς betonte völlige Weigerung wieder, dem Gesagten Beachtung zu schenken, ohne bloße Unaufmerksamkeit zu unterstellen.
- source_word: προσκαλεσάμενος
  choice: ließ ... zu sich rufen
  rationale: Der mediale Aorist bezeichnet, dass der König die Mutter in seine Gegenwart rufen ließ.
- source_word: παρῄνει
  choice: drängte
  rationale: Spiegelt den nachdrücklichen Versuch des Königs wider, die Mutter zu entsprechendem Handeln zu bewegen.
- source_word: γενέσθαι ... σύμβουλον
  choice: zu raten
  rationale: Gibt die Funktion als Ratgeberin in natürlichem Deutsch wieder; das Griechische formuliert wörtlicher, sie solle eine Ratgeberin werden.
- source_word: τοῦ μειρακίου
  choice: dem jungen Mann
  rationale: μειράκιον bezeichnet einen jungen Menschen. Die Wiederholung ist im Deutschen klarer und natürlicher als „dem Jugendlichen“, auch wenn dadurch die griechische Wortvariation nicht sichtbar bleibt.
- source_word: ἐπὶ σωτηρία
  choice: zu seinem Überleben
  rationale: Im unmittelbaren Zusammenhang geht es um die Bewahrung seines Lebens vor der Hinrichtung. Die Wiedergabe wahrt den konkreten Sinn, während die weitere Bedeutungsbreite von σωτηρία in der Fußnote genannt wird.
theological_decisions:
- issue: Bedeutung von σωτηρία im Martyriumskontext
  choice: zu seinem Überleben
  alternative: zu seiner Rettung / zu seinem Heil
  rationale: Der König will durch den Rat der Mutter erreichen, dass der junge Mann sein Leben rettet. Die konkrete zeitliche Rettung steht hier im Vordergrund; die mögliche weitere Bedeutung des griechischen Wortes wird nicht geleugnet, sondern in einer Fußnote bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Darauf einging“ bringt die bewusste Verweigerung besser zum Ausdruck als eine Formulierung, die nur Unaufmerksamkeit nahelegt. „Zu seinem Überleben“ ist idiomatisch und im Kontext konkret; die semantische und theologische Spannweite von σωτηρία bleibt in der Fußnote erhalten.
