lexical_decisions:
- source_word: Ἐχομένως
  choice: Danach
  rationale: Das Adverb kennzeichnet den nächsten Schritt in der Abfolge; „Danach“ ist im Deutschen natürlich und hält den Erzählfluss aufrecht.
- source_word: δὲ
  choice: nicht eigens wiedergegeben
  rationale: Die weiterführende Partikel wird durch den deutschen Satzanschluss bereits idiomatisch ausgedrückt; „aber“ würde hier einen unnötigen Gegensatz nahelegen.
- source_word: τὸν πέμπτον
  choice: den fünften
  rationale: Das substantivierte Zahlwort bedeutet wörtlich „den fünften“. Gemeint ist aus dem Zusammenhang der fünfte Bruder, doch das im Griechischen unausgesprochene Substantiv wird im Haupttext nicht ergänzt.
- source_word: προσάγοντες
  choice: führten sie … vor
  rationale: Das Partizip bezeichnet, dass man ihn heran- beziehungsweise vorführte. „Vorführen“ passt natürlich zum Kontext der Gewalt vor dem Herrscher.
- source_word: ᾐκίζοντο
  choice: folterten ihn
  rationale: Das Verb bezeichnet schwere Misshandlung beziehungsweise Folter. Das im Deutschen nötige Objekt „ihn“ ergibt sich eindeutig aus „den fünften“.
