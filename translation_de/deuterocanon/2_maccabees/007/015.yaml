  source_fidelity: „Danach“ gibt Ἐχομένως als Abfolgeangabe treffend wieder. „führten sie den fünften vor“ entspricht προσάγοντες τὸν πέμπτον, und „folterten ihn“ vermittelt die Bedeutung von ᾐκίζοντο klar und angemessen. Das im Griechischen implizite Bezugswort „Bruder“ wird nicht unzulässig in den Haupttext eingefügt.
  naturalness: Der Satz ist knapp, idiomatisch und in modernem Standarddeutsch für einen erzählenden Schrifttext natürlich. Das Präteritum „führten … vor und folterten“ ist im Deutschen als narrative Wiedergabe des griechischen Imperfekts unauffällig und ausreichend.
  terminology: „Folterten“ gibt die schwere gewaltsame Misshandlung ohne Abschwächung wieder. „Den fünften“ erhält die quellsprachliche Auslassung; die Fußnote erklärt den Kontext sachlich und ohne interpretative Überladung.
