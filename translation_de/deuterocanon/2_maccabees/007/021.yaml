base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/007/021.yaml
  text: And she encouraged each one of them in the language of their fathers[a], filled with a noble spirit, and, stirring her womanly reasoning with manly courage, she said to them[b],
translation:
  language: de
  text: 'Sie ermutigte jeden von ihnen in der Sprache ihrer Vorfahren[a]. Von edler Gesinnung erfüllt, rüttelte sie ihr weibliches Denken mit männlichem Mut auf und sagte zu ihnen[b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „in der Sprache der Väter“, „in der Sprache ihrer Ahnen“ oder „in ihrer Muttersprache“. Das griechische Wort bezeichnet wörtlich die väterliche beziehungsweise überlieferte Sprache.'
    reason: lexical_alternative
  - marker: b
    text: 'Der griechische Text verwendet einen bewussten geschlechtlichen Gegensatz, wörtlich etwa: „indem sie das weibliche Denken mit männlichem Mut aufrüttelte“. Diese Ausdrucksweise entspricht antiken Vorstellungen von Weiblichkeit und Mut.'
    reason: cultural_note
lexical_decisions:
- source_word: ἕκαστον
  choice: Jeden von ihnen
  rationale: Der Akkusativ Singular ist distributiv gebraucht und hebt hervor, dass sie jeden Einzelnen ansprach.
- source_word: παρεκάλει
  choice: ermutigte
  rationale: Im Zusammenhang des Martyriums bezeichnet das Verb stärkendes Zureden und Ermahnen, nicht bloß Trost.
- source_word: τῇ πατρίῳ φωνῇ
  choice: in der Sprache ihrer Vorfahren
  rationale: πατρίῳ bezeichnet das von den Vätern beziehungsweise Vorfahren Überlieferte; φωνή meint hier die gesprochene Sprache. Die Formulierung bewahrt den Herkunftsbezug, ohne eine bestimmte Sprache ausdrücklich zu benennen.
- source_word: γενναίῳ ... φρονήματι
  choice: Von edler Gesinnung erfüllt
  rationale: φρόνημα kann Gesinnung, innere Haltung oder Entschlossenheit bezeichnen; „edle Gesinnung“ gibt die moralisch erhöhte Charakterisierung natürlich und würdevoll wieder.
- source_word: τὸν θῆλυν λογισμόν
  choice: ihr weibliches Denken
  rationale: λογισμός bezeichnet Denken oder Überlegung, während θῆλυς ausdrücklich die weibliche Seite der antiken Gegenüberstellung markiert.
- source_word: ἄρσενι θυμῷ
  choice: mit männlichem Mut
  rationale: θυμός bezeichnet hier beherzte Kraft beziehungsweise Mut, nicht vorrangig Zorn; ἄρσενι bildet den ausdrücklichen Gegenpol zu θῆλυν.
- source_word: διεγείρασα
  choice: aufrüttelte
  rationale: Das Aoristpartizip beschreibt ein Anregen oder Aufwecken innerer Kräfte; „aufrüttelte“ wahrt das kraftvolle Bild.
- source_word: λέγουσα πρὸς αὐτούς
  choice: sagte sie zu ihnen
  rationale: Das Partizip leitet die folgende direkte Rede ein und wird im Deutschen idiomatisch als finites Verb wiedergegeben.
theological_decisions:
- issue: Geschlechtlich geprägter rhetorischer Gegensatz in der Charakterisierung der Mutter
  choice: Der ausdrückliche Gegensatz zwischen „weiblichem Denken“ und „männlichem Mut“ bleibt im Haupttext erhalten.
  alternative: Den Gegensatz neutralisieren, etwa als „natürliche Schwäche“ und „tapfere Entschlossenheit“, oder mildern zu „mütterlichem Empfinden“ und „starkem Mut“.
  rationale: Der griechische Text stellt θῆλυς und ἄρσην bewusst gegenüber. Eine Neutralisierung würde die antike Rhetorik und die Spannung des Ausgangstextes beseitigen; die Fußnote erläutert die kulturell fremd gewordene Ausdrucksweise, ohne sie umzudeuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur wurde für gute Verständlichkeit leicht gegliedert; die markante geschlechtliche Gegenüberstellung des Griechischen bleibt bewusst sichtbar. Der Doppelpunkt weist auf die in Vers 22 folgende direkte Rede voraus.
