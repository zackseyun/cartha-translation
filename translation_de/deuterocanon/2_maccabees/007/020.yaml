base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/007/020.yaml
  text: But the mother was especially admirable and worthy of honorable memory[a]; seeing her seven sons perish in a single day[b], she bore it courageously because of her hopes in the Lord.
translation:
  language: de
  text: Doch die Mutter war über alle Maßen bewundernswert und eines ehrenvollen Andenkens würdig[a]. Obwohl sie mitansah, wie ihre sieben Söhne an einem einzigen Tag umkamen[b], ertrug sie es mutig wegen ihrer Hoffnungen auf den Herrn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „einer guten Erinnerung würdig“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „getötet wurden“; das griechische Wort bedeutet allgemeiner „zugrunde gehen“ oder „umkommen“ und steht hier im Zusammenhang ihrer Hinrichtung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑπεραγόντως
  choice: über alle Maßen
  rationale: Das Adverb verstärkt das folgende Lob deutlich; die Wendung ist im Deutschen natürlich und gibt die hohe Intensität wieder.
- source_word: ἀγαθὴ
  choice: bewundernswert
  rationale: Wörtlich bedeutet das Wort „gut“; im lobenden Zusammenhang bezeichnet es jedoch die außergewöhnliche moralische Haltung der Mutter.
- source_word: μνήμης ἀγαθῆς ἀξία
  choice: eines ehrenvollen Andenkens würdig
  rationale: Die Formulierung bewahrt den Gedanken, dass sie verdient, in guter und ehrender Erinnerung behalten zu werden, ohne eine spätere religiöse Formel einzutragen.
- source_word: ἥτις
  choice: obwohl sie
  rationale: Der Relativsatz erläutert ihre bewundernswerte Haltung angesichts des Erlebten; die konzessive Wiedergabe ist im Deutschen flüssig, ohne den sachlichen Zusammenhang zu verändern.
- source_word: ἀπολλυμένους
  choice: umkamen
  rationale: Das Partizip bezeichnet das gewaltsame Zugrundegehen beziehungsweise Sterben der Söhne. „Umkamen“ bleibt weiter als „hingerichtet wurden“ und passt zum Kontext.
- source_word: συνορῶσα
  choice: mitansehen musste
  rationale: Das Verb bezeichnet das umfassende Wahrnehmen des Geschehens. „Mit ansehen“ bringt ihre unmittelbare Zeugenschaft zum Ausdruck; „musste“ ergibt sich idiomatisch aus der erlittenen Situation.
- source_word: μιᾷ τοῦ καιροῦ ἡμέρᾳ
  choice: an einem einzigen Tag
  rationale: Die Wendung hebt hervor, dass sich das ganze Geschehen innerhalb dieses einen Tages vollzog.
- source_word: εὐψύχως
  choice: mutig
  rationale: Das Adverb bezeichnet eine beherzte, standhafte Haltung unter schwerer Bedrängnis.
- source_word: ἔφερεν
  choice: ertrug sie es
  rationale: Das Verb bedeutet hier, eine schwere Erfahrung zu tragen beziehungsweise auszuhalten; das Pronomen ergänzt im Deutschen das im Griechischen implizite Objekt.
- source_word: διὰ τὰς ἐπὶ Κύριον ἐλπίδας
  choice: wegen ihrer Hoffnungen auf den Herrn
  rationale: Der Plural „Hoffnungen“ bleibt erhalten. „Auf den Herrn“ gibt die Ausrichtung und das Vertrauen dieser Hoffnungen idiomatisch wieder.
- source_word: Κύριον
  choice: den Herrn
  rationale: „Herr“ ist die sachgemäße Wiedergabe von κύριος als Bezeichnung Gottes; der bestimmte Artikel wird durch die deutsche Syntax verlangt.
theological_decisions:
- issue: Wiedergabe von κύριος
  choice: den Herrn
  alternative: Herrn
  rationale: Gemeint ist Gott als Ziel der Hoffnungen der Mutter. Der Artikel gehört in der gewählten deutschen Fügung zur natürlichen Standardsprache und legt keine zusätzliche Deutung fest.
- issue: Plural von ἐλπίδας
  choice: ihre Hoffnungen auf den Herrn
  alternative: ihre Hoffnung auf den Herrn
  rationale: Der griechische Plural wird bewahrt, sodass die möglichen Inhalte dieser Hoffnungen nicht zu einem abstrakten Singular vereinheitlicht oder näher bestimmt werden.
- issue: Art des Todes der Söhne
  choice: umkamen
  alternative: getötet wurden
  rationale: Der weitere Ausdruck des griechischen ἀπόλλυμι bleibt erhalten. Der Hinrichtungskontext ist deutlich, doch der Vers verwendet hier nicht das engere Verb „töten“.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die Satzstruktur bleibt eng am griechischen Gedankengang, wird aber für natürliche deutsche Lesbarkeit gegliedert. Der Plural „Hoffnungen“ und die allgemeinere Todesbezeichnung wurden bewusst bewahrt.
