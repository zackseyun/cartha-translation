base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/007/017.yaml
  text: But do not think that our nation has been abandoned by God. But as for you[a], endure and see his great power, how it will torture you and your offspring.
translation:
  language: de
  text: Doch glaube nicht, dass unser Volk von Gott verlassen worden ist. Du aber halte stand und sieh, wie seine gewaltige Macht dich und deine Nachkommen quälen wird.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wie er dich und deine Nachkommen quälen wird“, wenn Gott und nicht „seine gewaltige Macht“ als unausgesprochenes Subjekt verstanden wird.'
    reason: alternative_reading
lexical_decisions:
- source_word: μὴ δόκει
  choice: glaube nicht
  rationale: Der verneinte Präsensimperativ formuliert ein direktes Verbot; „glaube nicht“ ist natürlich und gibt die gedankliche wie theologische Aussage angemessen wieder.
- source_word: τὸ γένος ἡμῶν
  choice: unser Volk
  rationale: γένος bezeichnet hier im Zusammenhang des Martyriums das jüdische Volk als Gemeinschaft; „Volk“ ist im Deutschen natürlicher und weniger biologisierend als „Rasse“ oder „Geschlecht“.
- source_word: ὑπὸ τοῦ θεοῦ καταλελεῖφθαι
  choice: von Gott verlassen worden ist
  rationale: Der Perfektinfinitiv bezeichnet den eingetretenen beziehungsweise fortbestehenden Zustand des Verlassenseins.
- source_word: σὺ δὲ καρτέρει
  choice: Du aber halte stand
  rationale: καρτερέω fordert zu standhaftem Ausharren auf. Die adversative Wortstellung und die ausdrückliche Anrede werden mit „Du aber“ bewahrt.
- source_word: θεώρει
  choice: sieh
  rationale: Der Imperativ bedeutet hier „sieh“ oder „schau“ und leitet die angekündigte Erfahrung göttlicher Macht ein.
- source_word: τὸ μεγαλεῖον αὐτοῦ κράτος
  choice: seine gewaltige Macht
  rationale: μεγαλεῖον verstärkt κράτος und bezeichnet die Größe beziehungsweise Erhabenheit der Macht; „gewaltige Macht“ ist würdig, verständlich und nicht unnötig abstrakt.
- source_word: ὡς σὲ καὶ τὸ σπέρμα σου βασανιεῖ
  choice: wie sie dich und deine Nachkommen quälen wird
  rationale: „sie“ bezieht sich syntaktisch auf die unmittelbar zuvor genannte Macht. βασανίζω hat hier den starken Sinn „quälen/foltern“; „quälen“ eignet sich für die angekündigte göttliche Strafwirkung, ohne die Härte zu verdecken. σπέρμα wird idiomatisch mit „Nachkommen“ wiedergegeben.
theological_decisions:
- issue: Subjekt von βασανιεῖ
  choice: 'Gottes unmittelbar zuvor genannte Macht ist grammatisch das Subjekt: „wie sie ... quälen wird“.'
  alternative: 'Gott selbst ist das unausgesprochene Subjekt: „wie er ... quälen wird“.'
  rationale: Die Oberflächensyntax legt den Rückbezug auf τὸ ... κράτος nahe. Da der griechische Singular jedoch auch Gott als implizites handelndes Subjekt zulässt, wird diese theologisch relevante Mehrdeutigkeit in einer Fußnote bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte, herausfordernde Anrede des Herrschers bleibt erhalten; die echte syntaktische Mehrdeutigkeit des letzten Verbs wird nicht stillschweigend aufgelöst.
