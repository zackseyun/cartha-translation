  yaml_path: translation/deuterocanon/2_maccabees/007/013.yaml
  text: And when this one also had died[a], they were torturing the fourth in the same way, abusing him.
translation:
  language: de
  text: Und nachdem auch dieser gestorben war[a], folterten sie den vierten ebenso und misshandelten ihn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „aus dem Leben geschieden war“. Das griechische Verb kann als respektvolle Umschreibung für das Sterben gebraucht werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μεταλλάξαντος
  choice: gestorben war
  rationale: Das Verb μεταλλάσσω bezeichnet hier im Genitivus absolutus idiomatisch das Sterben beziehungsweise das Scheiden aus dem Leben. „Gestorben war“ ist im modernen Deutschen klar und passt zur Abfolge der Martyrien.
- source_word: τοῦτον δὲ
  choice: auch dieser
  rationale: τοῦτον verweist auf den zuvor genannten Bruder; δέ erhält zusammen mit καί den fortführend-additiven Sinn „auch“. Die Wortwahl bewahrt den demonstrativen Bezug.
- source_word: τὸν τέταρτον
  choice: den vierten
  rationale: Der griechische Text nennt ausdrücklich nur „den vierten“. Der Bezug auf den vierten Bruder ist aus dem Zusammenhang verständlich und muss nicht ergänzt werden.
- source_word: ὡσαύτως
  choice: ebenso
  rationale: Das Adverb zeigt, dass die gleiche Behandlung wiederholt wurde. „Ebenso“ gibt dies knapp und natürlich wieder.
- source_word: ἐβασάνιζον
  choice: folterten sie
  rationale: βασανίζω bezeichnet hier körperliche Folter. Das deutsche Präteritum erzählt die im griechischen Imperfekt als andauernd dargestellte Handlung natürlich weiter.
- source_word: αἰκιζόμενοι
  choice: misshandelten ihn
  rationale: Das Partizip bezeichnet die gewaltsame, entwürdigende Misshandlung, die mit der Folter einherging. Eine koordinierte deutsche Verbform vermeidet eine schwerfällige Partizipialkonstruktion; „ihn“ ist aus dem Kontext ergänzt.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Reihung des griechischen Berichts bleibt erhalten; „den vierten“ wird ohne die kontextuell erschließbare Ergänzung „Bruder“ wiedergegeben.
