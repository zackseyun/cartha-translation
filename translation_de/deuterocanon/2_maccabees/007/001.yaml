  to: Auch geschah es, dass sieben Brüder zusammen mit ihrer Mutter festgenommen und vom König gezwungen wurden, von verbotenem Schweinefleisch zu essen,[a] während sie mit Peitschen und Riemen[b] gefoltert wurden.
  rationale: Die Überarbeitung verbindet die im Griechischen zusammengehörenden Aussagen in einem Satz und macht dadurch deutlich, dass die Zwangsausübung und Folter grammatisch die sieben Brüder betreffen. Die Mutter bleibt, wie im Ausgangstext, als mit ihnen anwesend und festgenommen genannt. Die Fußnote zu ἐφάπτεσθαι wurde sprachlich und semantisch präzisiert, ohne eine umstrittene engere Bedeutung festzulegen.
