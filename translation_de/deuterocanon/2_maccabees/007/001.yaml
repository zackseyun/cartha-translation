  verdict: revise
  source_fidelity: Die Übersetzung gibt Handlung, Zwang durch den König, den Verstoß gegen das Speisegebot sowie die Folterinstrumente zutreffend wieder. Die griechischen Partizipien αἰκιζομένους und ἀναγκάζεσθαι beziehen sich jedoch grammatisch auf die sieben Brüder; die Mutter wird mit ihnen genannt, ist aber nicht als grammatisches Objekt dieser Partizipien ausgewiesen.
  naturalness: Die Formulierung ist grundsätzlich klares modernes Standarddeutsch. Durch die Aufteilung in zwei Sätze kann das Pronomen „sie“ jedoch leicht auf Brüder und Mutter zusammen bezogen werden. Eine Satzfassung, deren grammatisches Subjekt ausdrücklich die sieben Brüder bleibt, ist präziser und ebenso natürlich.
  terminology: „verbotenes Schweinefleisch“, „Peitschen und Riemen“ sowie „folterten“ sind sachgerecht. Die Fußnoten erhalten die relevante lexikalische Alternative, sollten aber bei Anmerkung a etwas genauer formuliert werden.
