  yaml_path: translation/deuterocanon/2_maccabees/007/001.yaml
  text: It also happened that seven brothers, along with their mother, having been arrested, were being forced by the king to taste the unlawful flesh of swine, while being tortured with whips and cords.
translation:
  language: de
  text: Auch geschah es, dass sieben Brüder zusammen mit ihrer Mutter festgenommen und vom König gezwungen wurden, von verbotenem Schweinefleisch zu essen,[a] während sie mit Peitschen und Riemen[b] gefoltert wurden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Verb kann wörtlich „berühren“ bedeuten; im Zusammenhang mit Speisen bezeichnet es hier, davon zu essen beziehungsweise daran teilzuhaben.
    reason: lexical_alternative
  - marker: b
    text: Oder „Strängen“; das griechische Wort kann Riemen oder Stränge, ursprünglich aus Sehnen, als Folterinstrumente bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: Συνέβη δὲ καὶ
  choice: Auch geschah es, dass
  rationale: Bewahrt den erzählerischen Übergang und die additive Kraft von καί in würdigem, verständlichem Deutsch.
- source_word: ἑπτὰ ἀδελφοὺς μετὰ τῆς μητρὸς
  choice: sieben Brüder zusammen mit ihrer Mutter
  rationale: ἀδελφοί bezeichnet hier männliche Geschwister; die deutsche Formulierung gibt ihre gemeinsame Festnahme natürlich wieder.
- source_word: συλλημφθέντας
  choice: festgenommen wurden
  rationale: Passt zum staatlichen Zwang durch den König und wahrt die passive Aussage des Griechischen.
- source_word: ἀναγκάζεσθαι ὑπὸ τοῦ βασιλέως
  choice: Der König zwang sie
  rationale: Eine natürliche deutsche Aktivkonstruktion, die Verursacher, Zwang und Betroffene eindeutig wiedergibt.
- source_word: ἀπὸ τῶν ἀθεμίτων υἱείων κρεῶν
  choice: von dem verbotenen Schweinefleisch
  rationale: ἀθέμιτος bedeutet hier verboten beziehungsweise gesetzwidrig; „verboten“ bewahrt den religiös-rechtlichen Sinn, ohne „unrein“ in den Text einzutragen.
- source_word: ἐφάπτεσθαι
  choice: zu essen
  rationale: Das Verb bedeutet wörtlich „berühren/anfassen“, bezeichnet im Speisekontext aber die Teilnahme am Verzehr. „Essen“ ist im Deutschen klar und natürlich; die Ambiguität wird in der Fußnote offengelegt.
- source_word: μάστιξιν καὶ νευραῖς
  choice: mit Peitschen und Riemen
  rationale: μάστιγες sind Peitschen beziehungsweise Geißeln; νευραί bezeichnet aus Sehnen gefertigte Stränge oder Riemen und hier Folterinstrumente.
- source_word: αἰκιζομένους
  choice: während man sie … folterte
  rationale: Gibt die schwere gewaltsame Misshandlung angesichts der ausdrücklich genannten Instrumente angemessen wieder.
theological_decisions:
- issue: Bezeichnung des Verstoßes gegen die jüdischen Speisegebote
  choice: verbotenes Schweinefleisch
  alternative: unreines Schweinefleisch
  rationale: Der griechische Text verwendet ἀθέμιτος („verboten/gesetzwidrig“) und nicht ausdrücklich den kultischen Begriff „unrein“. Die Übersetzung wahrt diese Wortwahl.
- issue: Umfang der erzwungenen Handlung
  choice: zu essen
  alternative: davon zu kosten / es anzurühren
  rationale: Im Kontext geht es um erzwungene Beteiligung am Verzehr. Die Übersetzung legt weder eine bestimmte Menge noch einen erfolgreichen Vollzug nahe; die wörtlichere Bedeutung wird in der Fußnote bewahrt.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem Erzählton. Der lange griechische Satz wurde zur besseren Verständlichkeit in zwei Sätze gegliedert. Keine konfessionell geprägte Terminologie wurde ergänzt.
