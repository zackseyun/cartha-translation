  yaml_path: translation/deuterocanon/2_maccabees/007/018.yaml
  text: After him they brought the sixth[a], and as he was about to die he said, “Do not be deceived; for we are suffering these things because of ourselves, having sinned against our own God[b]. Astonishing things have happened.”
translation:
  language: de
  text: 'Nach ihm führten sie den sechsten herbei. Als er im Begriff war zu sterben, sagte er: »Täusch dich nicht länger![a] Denn wir erleiden dies durch eigene Schuld, weil wir gegen unseren eigenen Gott gesündigt haben. Erstaunliche Dinge sind geschehen.[b]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Irr dich nicht weiter!« beziehungsweise: »Lass dich nicht täuschen!« Die knappe griechische Wendung kann einen Irrtum, eine Täuschung oder ein weiteres Abirren bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »Des Staunens würdige Dinge sind geschehen.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ τοῦτον ἤγον τὸν ἕκτον
  choice: Nach ihm führten sie den sechsten herbei
  rationale: Μετὰ τοῦτον bezeichnet die Abfolge; ἤγον wird im deutschen Erzählstil natürlich mit Präteritum wiedergegeben. „Den sechsten“ ergänzt nicht ausdrücklich „Bruder“, das nur aus dem Zusammenhang hervorgeht.
- source_word: μέλλον ἀποθνήσκειν
  choice: Als er im Begriff war zu sterben
  rationale: μέλλω mit Infinitiv bezeichnet das unmittelbar Bevorstehende; die Formulierung ist würdevoll und verständlich.
- source_word: Μὴ πλανῶ μάλλον
  choice: Täusch dich nicht länger!
  rationale: Die komprimierte griechische Wendung lässt bei πλανάω sowohl Irrtum als auch Täuschung anklingen; μάλλον kann hier eine Fortsetzung oder Steigerung bezeichnen. „Nicht länger“ wahrt diese offene Nuance natürlicher als ein steifes „mehr“.
- source_word: ἡμεῖς γὰρ διʼ ἑαυτοὺς ταῦτα πάσχομεν
  choice: Denn wir erleiden dies durch eigene Schuld
  rationale: διʼ ἑαυτούς bezeichnet hier die in ihnen selbst liegende Ursache. „Durch eigene Schuld“ macht den durch das folgende Partizip erklärten Schuldzusammenhang im Deutschen klar.
- source_word: ἁμαρτόντες εἰς τὸν ἑαυτῶν θεόν
  choice: weil wir gegen unseren eigenen Gott gesündigt haben
  rationale: Das Partizip erläutert ursächlich das Leiden; εἰς bezeichnet die gegen Gott gerichtete Sünde. „Unseren eigenen Gott“ bewahrt den Nachdruck von ἑαυτῶν.
- source_word: ἄξια θαυμασμοῦ γέγονε
  choice: Erstaunliche Dinge sind geschehen
  rationale: Die Wendung bedeutet wörtlich, dass Dinge geschehen sind, die des Staunens würdig sind. Ohne Konjunktion wird kein zusätzliches „deshalb“ eingefügt.
theological_decisions:
- issue: Ursache des Leidens der Brüder
  choice: Der Sprecher führt das Leiden auf die eigene Schuld und die Sünde gegen Gott zurück.
  alternative: Die Aussage könnte allgemeiner als Leiden „unseretwegen“ wiedergegeben werden.
  rationale: πάσχομεν wird durch ἁμαρτόντες ausdrücklich mit ihrem Sündigen verbunden; dieser Zusammenhang darf nicht abgeschwächt werden.
- issue: Bezug der erstaunlichen Geschehnisse
  choice: Der letzte Satz bleibt als eigenständige, nicht weiter erklärte Feststellung stehen.
  alternative: Er könnte durch „deshalb“ ausdrücklich als Folgerung oder als Hinweis auf göttliche Strafgerichte gedeutet werden.
  rationale: Im griechischen Text steht vor ἄξια θαυμασμοῦ γέγονε keine ausdrückliche Folgerungspartikel. Die Übersetzung bewahrt daher die mögliche Verbindung, legt sie aber nicht fest.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau bleibt gut verständlich; das nicht ausdrücklich genannte Wort „Bruder“ wird nicht ergänzt. Die Anrede steht im Singular, entsprechend dem griechischen Verb.
