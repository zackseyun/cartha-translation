base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/007/031.yaml
  text: But you[a], having become the inventor of every evil against the Hebrews, will certainly not escape the hands of God.
translation:
  language: de
  text: Du aber, der du zum Urheber[a] alles Bösen gegen die Hebräer geworden bist, wirst den Händen Gottes keinesfalls entkommen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Erfinder“ oder „Ausdenker“ alles Bösen.'
    reason: Lexikalische Alternativen zu εὑρετής; das Wort kann sowohl das Erfinden als auch das Ausdenken und Verursachen bezeichnen.
lexical_decisions:
- source_word: σὺ δὲ
  choice: Du aber
  rationale: δέ kennzeichnet den Gegensatz zum vorangehenden Gedanken; „Du aber“ bewahrt die direkte, konfrontative Anrede.
- source_word: πάσης κακίας
  choice: alles Bösen
  rationale: κακία bezeichnet umfassend Bosheit oder Böses. „Alles Bösen“ erhält die weitreichende moralische Anklage, ohne sie auf einzelne Verbrechen zu verengen.
- source_word: εὑρετὴς γενόμενος
  choice: zum Urheber geworden
  rationale: εὑρετής kann einen Erfinder, Urheber oder Ausdenker bezeichnen. „Urheber“ drückt hier natürliche deutsche Sprache und aktive Verantwortlichkeit aus; „geworden“ gibt γενόμενος ausdrücklich wieder.
- source_word: εἰς τοὺς Ἑβραίους
  choice: gegen die Hebräer
  rationale: Im feindseligen Kontext bezeichnet εἰς die Ausrichtung gegen die Betroffenen. „Hebräer“ entspricht der konkreten ethnischen Bezeichnung Ἑβραίους.
- source_word: οὐ μὴ διαφύγῃς
  choice: wirst ... auf keinen Fall entkommen
  rationale: οὐ μή mit dem Aorist Konjunktiv ist eine nachdrückliche Verneinung. „Auf keinen Fall“ gibt diese Gewissheit in gegenwärtigem Deutsch deutlich wieder.
- source_word: τὰς χεῖρας τοῦ θεοῦ
  choice: den Händen Gottes
  rationale: Die konkrete Bildsprache des griechischen Plurals bleibt erhalten und wird nicht abstrakt als Gottes Macht oder Gericht wiedergegeben.
theological_decisions:
- issue: Anthropomorphe Rede vom göttlichen Gericht
  choice: den Händen Gottes
  alternative: Gottes Macht; Gottes Gericht
  rationale: Die Übersetzung bewahrt das konkrete biblische Bild und seine Aussage über Gottes richterliches Eingreifen, ohne es durch eine abstrakte Deutung zu ersetzen.
- issue: Ethnische Bezeichnung Ἑβραίους
  choice: die Hebräer
  alternative: die Juden
  rationale: Der Ausgangstext verwendet ausdrücklich „Hebräer“. Diese Bezeichnung wird beibehalten, statt sie durch eine verwandte, aber nicht identische Benennung zu ersetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Relativsatz bildet die griechische Partizipialkonstruktion verständlich ab; die emphatische Verneinung und die konkrete Gerichtssprache bleiben erhalten.
