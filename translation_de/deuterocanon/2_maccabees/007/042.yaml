translation:
  language: de
  text: Damit sei genug gesagt über die Regungen des Mitgefühls und die außerordentlichen Folterungen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Was die Regungen des Mitgefühls und die alles Maß übersteigenden Misshandlungen betrifft, sei dies bis zu diesem Umfang dargelegt.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ... περὶ τοὺς σπλαγχνισμούς
  choice: über die Regungen des Mitgefühls
  rationale: Der Plural σπλαγχνισμούς bezeichnet tiefe innere Regungen, besonders Mitgefühl oder innige Zuneigung. Die Formulierung bewahrt den Plural und vermeidet es, die im unmittelbaren Satz nicht ausdrücklich genannte Mutter in den Text einzufügen; aus dem Erzählzusammenhang ist der Bezug dennoch erkennbar.
- source_word: τὰς ὑπερβαλλούσας αἰκίας
  choice: die außergewöhnlichen Folterqualen
  rationale: αἰκίαι bezeichnet Misshandlungen, Gewalttaten oder Folter; im Kontext der Martyrien gibt „Folterqualen“ sowohl die konkrete Gewalt als auch das erlittene Leid wieder. „Außergewöhnlich“ bildet die steigernde Bedeutung von ὑπερβαλλούσας ab.
- source_word: ἐπὶ τοσούτου δεδηλώσθω
  choice: Damit sei genug gesagt
  rationale: 'Die Verbindung aus dem perfektischen Passivimperativ δεδηλώσθω und ἐπὶ τοσούτου ist eine abschließende Erzählformel: Das bisher Dargelegte soll in diesem Umfang genügen. Die deutsche Wendung ist natürlich und bewahrt den formellen Abschlusscharakter.'
theological_decisions: []
translation_notes:
  register: Dignischer, moderner Erzählabschluss. Die Übersetzung bleibt beim griechischen Plural und fügt „der Mutter“ nicht ausdrücklich ein. „Folterqualen“ ist im Deutschen anschaulich und kontextgerecht; die Fußnote dokumentiert die formalere Wiedergabe.
