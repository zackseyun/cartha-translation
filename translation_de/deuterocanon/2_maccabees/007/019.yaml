    rationale: Der Konjunktiv II kann im Deutschen eine irreale oder hypothetische Aussage nahelegen. Der griechische Futurinfinitiv bezeichnet hier die zukünftige Folge der angesprochenen Handlung; „bleiben wirst“ bildet dies klarer ab.
  - severity: low
    issue: „nachdem du versucht hast“
    rationale: Die temporale Konjunktion macht aus dem Partizip eine ausdrücklich zeitliche Abfolge. Die Konstruktion kann hier begründend verstanden werden; „da du versucht hast“ gibt diese naheliegende Beziehung idiomatisch wieder, ohne zusätzliche theologische Deutung.
  - severity: low
    issue: „ohne Schuld bleiben“
    rationale: Die Wendung ist möglich, aber weniger natürlich und kann den Eindruck eines bloßen Fortbestehens eines Zustands erwecken. „schuldlos bleiben“ ist knapper und idiomatischer.
