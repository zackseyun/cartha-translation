base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/007/019.yaml
  text: But as for you[a], do not suppose that you will be innocent, having attempted to fight against God.
translation:
  language: de
  text: Du aber glaube nicht, dass du schuldlos bleiben wirst, da du versucht hast, gegen Gott zu kämpfen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „da du versucht hast, dich Gott zu widersetzen“. Das griechische Verb bedeutet wörtlich „gegen Gott kämpfen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σὺ δὲ
  choice: Du aber
  rationale: Bewahrt sowohl den Gegensatz durch δέ als auch die betonte direkte Anrede durch σὺ in knapper, natürlicher Form.
- source_word: μὴ νομίσῃς
  choice: sollst nicht meinen
  rationale: Gibt die warnende Aufforderung idiomatisch wieder und bezeichnet eine für irrig erklärte Annahme.
- source_word: ἀθῷος
  choice: ohne Schuld
  rationale: Bewahrt den primären Sinn der Freiheit von Schuld oder Haftung, ohne die bloß erschlossene Folge „ungestraft“ in den Text einzutragen.
- source_word: ἔσεσθαι
  choice: du würdest … bleiben
  rationale: Der Futurinfinitiv hängt von νομίσῃς ab; der deutsche Konjunktiv in der abhängigen Aussage ist natürlich und erhält den Zukunftsbezug im Kontext.
- source_word: θεομαχεῖν
  choice: gegen Gott zu kämpfen
  rationale: Gibt das zusammengesetzte Verb ausdrücklich und nahezu wörtlich wieder; es ist stärker als das allgemeinere „sich Gott zu widersetzen“.
- source_word: ἐπιχειρήσας
  choice: nachdem du versucht hast
  rationale: Gibt das vorzeitige Aoristpartizip verständlich wieder und bewahrt den Gedanken des Versuchs beziehungsweise Unternehmens, ohne die mögliche logische Beziehung übermäßig festzulegen.
theological_decisions:
- issue: Wiedergabe von θεομαχεῖν
  choice: gegen Gott zu kämpfen
  alternative: sich Gott zu widersetzen
  rationale: Die Verfolgung wird als Kampf gegen Gott selbst bezeichnet. Die konkrete Formulierung erhält die Schärfe der Anklage, ohne sie konfessionell auszudeuten.
- issue: Bedeutung von ἀθῷος
  choice: ohne Schuld bleiben
  alternative: ungestraft bleiben
  rationale: Der griechische Ausdruck bezeichnet zunächst Schuldlosigkeit beziehungsweise Freiheit von Haftung. „Ungestraft“ würde eine mögliche Konsequenz an die Stelle des unmittelbaren Wortlauts setzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe, scharf zugespitzte direkte Anrede bleibt erhalten; „ohne Schuld“ vermeidet zugleich altertümliches „schuldlos“ und die interpretierende Verengung auf Straffreiheit.
