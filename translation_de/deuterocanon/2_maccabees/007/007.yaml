  source_fidelity: Die Übersetzung gibt den Genitivus absolutus als abgeschlossene Vorgeschichte angemessen wieder und bewahrt die elliptischen Bezeichnungen „der Erste“ und „den Zweiten“. „führten sie den Zweiten vor, um ihn zu verhöhnen“ vermittelt die Zuführung zur Verspottung (ἐπὶ τὸν ἐμπαιγμόν) idiomatisch. Das gewaltsame Abziehen der Kopfhaut samt Haaren sowie die Frage nach dem Essen vor der gliedweisen körperlichen Bestrafung sind sachlich getroffen. „Gefoltert“ konkretisiert zwar τιμωρηθῆναι („bestraft werden“), ist im unmittelbaren Folterkontext jedoch eine vertretbare, nicht sinnverändernde Wiedergabe.
  naturalness: Modernes, gut lesbares Standarddeutsch mit würdig-nüchternem Erzählton. Die Aufteilung des griechischen Satzes in zwei deutsche Sätze verbessert die Lesbarkeit, ohne den Ablauf zu verändern. „Kopfhaut samt den Haaren“ und „Glied für Glied“ sind präzise und natürlich.
  terminology: Die Begriffe sind konsistent und kontextgerecht. „Kopfhaut“ ist eine treffende natürliche Entsprechung zu „die Haut des Kopfes“, und die Fußnote dokumentiert die wörtlichere Form. Die Fußnote zu „essen“ erläutert den im Vers nicht ausdrücklich genannten Gegenstand anhand des Kontextes, ohne ihn in den Haupttext einzutragen.
