base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/007/007.yaml
  text: When the first had died in this way[a], they brought the second to the mockery; and after tearing off the skin of his head with the hair, they asked[b], “Will you eat before your body is punished limb by limb?”
translation:
  language: de
  text: 'Nachdem der Erste auf diese Weise gestorben war, führten sie den Zweiten vor, um ihn zu verhöhnen. Sie zogen ihm die Kopfhaut samt den Haaren ab[a] und fragten ihn: „Willst du essen[b], bevor dein Körper Glied für Glied gefoltert wird?“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „die Haut des Kopfes samt den Haaren“.'
    reason: lexical_alternative
  - marker: b
    text: Gemeint ist nach dem Zusammenhang das Essen des Fleisches, das nach dem überlieferten Gesetz verboten war.
    reason: cross_reference
lexical_decisions:
- source_word: Μεταλλάξαντος
  choice: gestorben war
  rationale: Das Verb bezeichnet hier im erzählerischen Zusammenhang den Tod des ersten Bruders; die wörtlichere Grundvorstellung eines Fortgehens oder Wechsels wäre im Deutschen missverständlich.
- source_word: τοῦ πρώτου / τὸν δεύτερον
  choice: der Erste / den Zweiten
  rationale: Die knappe Ellipse des Griechischen bleibt erhalten und ist durch den Zusammenhang verständlich.
- source_word: ἦγον ἐπὶ τὸν ἐμπαιγμόν
  choice: führten sie … vor, um ihn zu verhöhnen
  rationale: ἐμπαιγμός bezeichnet Spott und demütigende Misshandlung. Die deutsche Formulierung gibt Ziel und öffentlichen Charakter der Handlung natürlich wieder.
- source_word: τὸ τῆς κεφαλῆς δέρμα σὺν ταῖς θριξὶν
  choice: die Kopfhaut samt den Haaren
  rationale: „Kopfhaut“ ist die präzise und natürliche deutsche Entsprechung für „Haut des Kopfes“; „samt den Haaren“ bewahrt die ausdrückliche Ergänzung.
- source_word: περισύραντες
  choice: zogen … ab
  rationale: Das Verb beschreibt ein gewaltsames Abziehen oder Abstreifen. Im Zusammenhang mit der Kopfhaut bringt „abziehen“ den Vorgang klar zum Ausdruck.
- source_word: ἐπηρώτων
  choice: fragten
  rationale: Das deutsche Präteritum ist im Erzählfluss natürlich; der griechische Imperfekt kann ein andauerndes oder wiederholtes Fragen andeuten, verlangt dies hier aber nicht zwingend.
- source_word: Εἰ φάγεσαι
  choice: Willst du essen
  rationale: Die direkte Frage bleibt knapp wie im Griechischen. Was gegessen werden soll, ergibt sich aus dem Kontext und wird nicht in den Haupttext eingefügt.
- source_word: πρὸ τοῦ τιμωρηθῆναι κατὰ μέλος τὸ σῶμα
  choice: bevor dein Körper Glied für Glied gefoltert wird
  rationale: τιμωρέω kann allgemein „bestrafen“ bedeuten; die konkrete Situation ist jedoch körperliche Folter. „Glied für Glied“ erhält die distributive Aussage von κατὰ μέλος.
