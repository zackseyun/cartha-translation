  yaml_path: translation/deuterocanon/2_maccabees/007/011.yaml
  text: And he said bravely, “From heaven I received these, and for his laws I disregard them, and from him I hope to receive them back again.”
translation:
  language: de
  text: 'Und mutig sagte er: „Vom Himmel habe ich sie erhalten. Um seiner Gesetze willen achte ich sie gering, und von ihm hoffe ich, sie wiederzuerhalten.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γενναίως
  choice: mutig
  rationale: Gibt das adverbiale Lob seiner tapferen, standhaften Rede in natürlichem modernem Deutsch wieder.
- source_word: Ἐξ οὐρανοῦ
  choice: Vom Himmel
  rationale: Bewahrt die konkrete Ausdrucksweise des Griechischen, ohne den Bezug ausdrücklich als „von Gott“ auszudeuten.
- source_word: ταῦτα
  choice: sie
  rationale: Das Pronomen verweist im Kontext auf die zuvor genannten Körperteile; „sie“ ist im Deutschen natürlicher als das substantivierte „diese“.
- source_word: ὑπερορῶ
  choice: achte ich sie gering
  rationale: Drückt aus, dass er sein gegenwärtiges körperliches Wohlergehen um der Gesetze willen hintanstellt, ohne ein unpassend schroffes „verachte“ zu erzwingen.
- source_word: πάλιν ἐλπίζω κομίσεσθαι
  choice: hoffe ich, sie wiederzuerhalten
  rationale: Bewahrt sowohl die Hoffnung als auch die Erwartung einer künftigen Wiedererstattung.
theological_decisions:
- issue: Bezug von „vom Himmel“ und „von ihm“
  choice: Die indirekte Gottesbezeichnung bleibt erhalten.
  alternative: „Von Gott habe ich sie erhalten … und von Gott hoffe ich …“
  rationale: Der griechische Text nennt zunächst den Himmel und verwendet danach ein Pronomen. Die Übersetzung soll diese Bildsprache und den impliziten Bezug nicht ausdrücklich auflösen.
- issue: Art der erhofften Wiedererstattung
  choice: Keine nähere Erklärung der Auferstehung wird in den Vers eingefügt.
  alternative: „bei der Auferstehung wiederzuerhalten“
  rationale: Der Zusammenhang legt leibliche Wiederherstellung nahe, doch der Vers selbst formuliert lediglich die Hoffnung, sie von ihm zurückzuerhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt knapp und entschlossen; die Wiederholung des griechischen Demonstrativpronomens wird zugunsten eines natürlichen deutschen Pronominalbezugs nicht mechanisch nachgebildet.
