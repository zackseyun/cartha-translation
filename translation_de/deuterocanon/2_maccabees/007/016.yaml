  text: But looking at him[a], he said, “Though you have authority among men, being mortal, you do what you want[b];
translation:
  language: de
  text: 'Er aber sah ihn an und sagte: »Du hast Macht unter den Menschen und tust, was du willst, obwohl du sterblich[a] bist.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »vergänglich« oder »dem Verfall unterworfen«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ πρὸς αὐτὸν ἰδὼν εἶπεν
  choice: Er aber sah ihn an und sagte
  rationale: Die finite Formulierung gibt die griechische Partizipialkonstruktion natürlich wieder. »Sah ihn an« bewahrt den direkten, konfrontativen Blick; »aber« entspricht dem erzählerischen δέ.
- source_word: Ἐξουσίαν ἐν ἀνθρώποις ἔχων
  choice: Du hast Macht unter den Menschen
  rationale: ἐξουσία bezeichnet hier politische Macht beziehungsweise Autorität. »Macht« ist im Deutschen in diesem Zusammenhang idiomatisch; »unter den Menschen« wahrt die mit ἐν bezeichnete Sphäre, ohne ein ausschließlich männliches Verständnis nahezulegen.
- source_word: ὃ θέλεις ποιεῖς
  choice: und tust, was du willst
  rationale: Die schlichte relative Aussage wird unmittelbar und in modernem Deutsch wiedergegeben. Das verbindende »und« macht die Beziehung zum vorausgehenden Partizip idiomatisch deutlich.
- source_word: φθαρτὸς ὤν
  choice: obwohl du sterblich bist
  rationale: φθαρτός bezeichnet Vergänglichkeit beziehungsweise Verfall; im Tadel des Herrschers steht seine begrenzte, sterbliche menschliche Existenz im Vordergrund. Die konzessive Formulierung bringt die rhetorische Spannung natürlich zum Ausdruck.
theological_decisions:
- issue: Anthropologische Bedeutung von φθαρτὸς ὤν im Tadel eines irdischen Herrschers
  choice: obwohl du sterblich bist
  alternative: obwohl du vergänglich / dem Verfall unterworfen bist
  rationale: »Sterblich« hebt den Gegensatz zwischen zeitweiliger menschlicher Macht und menschlicher Endlichkeit klar hervor, ohne eine besondere Lehre über moralische Verderbtheit einzutragen. Die weitere Bedeutungsbreite wird in der Fußnote erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter Rede. Die Satzstruktur ist für natürliche Verständlichkeit leicht geglättet; der konfrontative Ton und der Gegensatz zwischen politischer Macht und menschlicher Sterblichkeit bleiben erhalten.
