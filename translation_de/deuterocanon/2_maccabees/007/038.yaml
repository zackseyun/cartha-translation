base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/007/038.yaml
  text: and in me and my brothers bring to an end the wrath of the Almighty that has justly been kindled against our whole nation[a].
translation:
  language: de
  text: und an mir und meinen Brüdern den Zorn des Allmächtigen zum Stillstand zu bringen, der sich mit Recht gegen unser ganzes Volk entzündet hat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit mir und meinen Brüdern enden zu lassen“. Wörtlich steht im Griechischen „in mir und meinen Brüdern“; damit wird ausgedrückt, dass der Zorn bei ihnen seinen Endpunkt erreichen soll.'
    reason: Lexikalische Alternative und Erklärung der ungewöhnlichen griechischen Wendung; die wörtliche Bedeutung von ἐν wird präzise angegeben.
lexical_decisions:
- source_word: στῆσαι
  choice: zum Stillstand zu bringen
  rationale: Der aoristische Infinitiv von ἵστημι ist hier kausativ gebraucht. Die Wendung gibt wieder, dass der Zorn an einen Endpunkt gelangen soll, und bewahrt dabei die kausative Aussage deutlicher als ein bloßes „aufzuhalten“.
- source_word: παντοκράτορος
  choice: des Allmächtigen
  rationale: „Der Allmächtige“ ist die natürliche und würdevolle deutsche Wiedergabe des göttlichen Titels παντοκράτωρ.
- source_word: ὀργήν
  choice: den Zorn
  rationale: „Zorn“ bewahrt den ernsten, gerichtlichen Gehalt von ὀργή besser als das schwächere „Ärger“.
- source_word: σύμπαν ἡμῶν γένος
  choice: unser ganzes Volk
  rationale: γένος bezeichnet hier das jüdische Volk als ethnische und gemeinschaftliche Gesamtheit; σύμπαν betont dessen Ganzheit. „Unser ganzes Volk“ ist im Deutschen klarer und natürlicher als „unser ganzes Geschlecht“.
- source_word: δικαίως
  choice: mit Recht
  rationale: Die idiomatische Wendung gibt die moralische Berechtigung des Zorns wieder, ohne die Aussage abzuschwächen.
- source_word: ἐπημμένην
  choice: sich … entzündet hat
  rationale: Das Perfektpartizip beschreibt den bereits entflammten und fortdauernden Zorn. Die reflexive deutsche Form bewahrt das Bild eines entzündeten Zorns.
- source_word: ἐν ἐμοὶ δὲ καὶ τοῖς ἀδελφοῖς μου
  choice: und an mir und meinen Brüdern
  rationale: '„An“ bewahrt die örtlich beziehungsweise begrenzend wirkende Vorstellung von ἐν: Der Zorn soll in der Person des Sprechers und seiner Brüder seinen Endpunkt erreichen. Zugleich ist die Formulierung im Deutschen verständlicher als das wörtliche „in mir und meinen Brüdern“.'
theological_decisions:
- issue: Der Tod der Brüder als Punkt, an dem Gottes Gericht endet
  choice: Die Bitte wird so wiedergegeben, dass der gerechte Zorn des Allmächtigen an dem Sprecher und seinen Brüdern zum Stillstand kommen möge.
  alternative: Man könnte die Aussage als „mit mir und meinen Brüdern enden lassen“ oder als ein Ruhen des Zorns auf ihnen verstehen.
  rationale: Die kausative Bedeutung von στῆσαι zusammen mit ὀργή und die Wendung ἐν ἐμοὶ … sprechen im Zusammenhang am ehesten für das Beenden des Zorns an ihnen. Die Übersetzung lässt die theologische Spannung stehen und deutet die Aussage nicht als ausformulierte spätere Sühnelehre.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Da der griechische Text als Fortsetzung des vorhergehenden Satzes mit „und“ sowie einem Infinitiv beginnt, bleibt auch die deutsche Fassung ein syntaktisch abhängiger Satzteil. Die ungewöhnliche Endpunktvorstellung wird im Haupttext bewahrt und in der Fußnote erläutert.
