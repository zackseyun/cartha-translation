  text: For we are suffering because of our own sins;
translation:
  language: de
  text: Denn wir leiden wegen unserer eigenen Sünden.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡμεῖς
  choice: wir
  rationale: Das ausdrücklich gesetzte Personalpronomen wird beibehalten und hebt die Sprecher als diejenigen hervor, die leiden.
- source_word: γὰρ
  choice: denn
  rationale: „Denn“ bewahrt die begründende und erklärende Verknüpfung mit dem vorausgehenden Zusammenhang.
- source_word: διὰ
  choice: wegen
  rationale: Mit dem Akkusativ bezeichnet διά hier den Grund; „wegen“ gibt diese kausale Bedeutung knapp und natürlich wieder.
- source_word: τὰς ἑαυτῶν ἁμαρτίας
  choice: unserer eigenen Sünden
  rationale: „Eigenen“ erhält die reflexive Betonung von ἑαυτῶν und damit das ausdrückliche Eingeständnis persönlicher beziehungsweise gemeinsamer Schuld.
- source_word: πάσχομεν
  choice: leiden
  rationale: Das Präsens bezeichnet das gegenwärtige Leiden; das deutsche einfache Präsens gibt dies idiomatisch und ohne zusätzliche Aspektfestlegung wieder.
theological_decisions:
- issue: Ursache des Leidens der Sprecher
  choice: Das Leiden wird ausdrücklich auf die eigenen Sünden der Sprecher zurückgeführt.
  alternative: 'Eine weniger betonte Wiedergabe wäre: „Wir leiden wegen unserer Sünden.“'
  rationale: Der griechische Text enthält mit ἑαυτῶν eine reflexive Hervorhebung. Die Übersetzung bewahrt dieses schuldbewusste Bekenntnis, ohne es abzuschwächen oder theologisch auszuweiten.
translation_notes:
  register: Modernes, klares und würdiges Standarddeutsch. Die knappe Satzstruktur des griechischen Textes bleibt erhalten; „leiden“ ist gegenüber „müssen leiden“ vorzuziehen, weil der Ausgangstext keine ausdrückliche Notwendigkeit formuliert.
