base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/007/023.yaml
  text: Therefore the Creator of the world, who formed the origin of man and devised the origin of all things, will in mercy give back to you both breath and life, since you now disregard yourselves for the sake of his laws.
translation:
  language: de
  text: Darum wird der Schöpfer der Welt, der den Ursprung des Menschen geformt und den Ursprung aller Dinge ersonnen hat, euch in seinem Erbarmen Atem und Leben wiedergeben, weil ihr jetzt um seiner Gesetze willen euch selbst nicht achtet.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ τοῦ κόσμου κτίστης
  choice: der Schöpfer der Welt
  rationale: Gibt die geläufige Gottesbezeichnung präzise und in würdigem modernem Deutsch wieder.
- source_word: ὁ πλάσας ἀνθρώπου γένεσιν
  choice: der den Ursprung des Menschen geformt hat
  rationale: Bewahrt das Bild von πλάσσω („formen“) und die Bedeutung von γένεσις als Ursprung bzw. Entstehung.
- source_word: πάντων ἐξευρὼν γένεσιν
  choice: den Ursprung aller Dinge ersonnen hat
  rationale: „Ersinnen“ bildet den schöpferisch-planenden Sinn von ἐξευρίσκω ab, ohne die parallele Verwendung von γένεσις einzuebnen.
- source_word: τὸ πνεῦμα καὶ τὴν ζωὴν
  choice: Atem und Leben
  rationale: πνεῦμα kann Atem oder Geist bedeuten; im Kontext der Wiederbelebung ist „Atem“ natürlich und wahrt die Unterscheidung von ζωή.
- source_word: ὑπερορᾶτε ἑαυτοὺς
  choice: ihr euch selbst nicht achtet
  rationale: Drückt die Selbstmissachtung bzw. das Zurückstellen des eigenen Lebens aus, ohne eine stärkere Aussage wie „opfern“ einzutragen.
theological_decisions:
- issue: Art der endzeitlichen Wiederherstellung
  choice: „Atem und Leben wiedergeben“
  alternative: „Geist und Leben wiedergeben“
  rationale: Die Formulierung lässt die im Kontext erkennbare Hoffnung auf leibliche Wiederherstellung stehen, ohne πνεῦμα eindeutig als immateriellen Geist festzulegen.
- issue: Göttliches Erbarmen und menschliche Gesetzestreue
  choice: „in seinem Erbarmen … weil ihr … um seiner Gesetze willen“
  alternative: eine verdienstlogische Formulierung
  rationale: Die syntaktische Verbindung bleibt erhalten, ohne näher zu bestimmen, ob die Wiederherstellung als Lohn, Antwort oder barmherzige Gabe verstanden werden soll.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallele Rede vom „Ursprung“ wurde bewusst bewahrt; „nicht achten“ ist verständlich und vermeidet eine überdeutende Märtyrersprache.
