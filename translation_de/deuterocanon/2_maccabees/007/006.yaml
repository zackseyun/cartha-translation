base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/007/006.yaml
  text: The Lord God is watching[a], and in truth he is being moved to compassion for us, just as Moses made clear in the song that testifies openly, saying[c][b], “And he will be moved to compassion for his servants.”
translation:
  language: de
  text: 'Gott, der Herr, sieht zu und hat wahrhaftig Erbarmen mit uns.[a] So hat Mose es durch das Lied deutlich gemacht, das offen Zeugnis ablegt,[b] als er sagte: »Und über seine Sklaven wird er sich erbarmen.«[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Verb kann auch den Sinn »getröstet werden« oder »sich trösten lassen« haben. Im Zusammenhang mit dem folgenden Zitat aus dem Moselied ist hier wahrscheinlich Gottes Erbarmen mit uns gemeint.
    reason: lexical_alternative
  - marker: b
    text: Gemeint ist das Moselied; siehe 5. Mose 31,19–21.28–30 und 32,1–43. Das griechische Wort für »Zeugnis ablegen« kann dabei einen gegnerischen bzw. anklagenden Unterton haben.
    reason: cross_reference_and_lexical_note
  - marker: c
    text: Die Worte nehmen 5. Mose 32,36 auf. Das griechische δούλοις bedeutet wörtlich »Sklaven«; »Diener« ist eine kontextuelle, weniger genaue Alternative.
    reason: cross_reference_and_lexical_alternative
lexical_decisions:
- source_word: ἐφορᾷ
  choice: sieht es
  rationale: Das Präsens bezeichnet Gottes gegenwärtiges Sehen. Das ergänzte »es« ist im Deutschen idiomatisch und vermeidet sowohl das missverständliche »schaut zu« als auch die stärker deutende Wiedergabe »wacht über uns«.
- source_word: ταῖς ἀληθείαις
  choice: in Wahrheit
  rationale: Der Dativ Plural wird hier adverbial verstanden. »In Wahrheit« bewahrt die griechische Ausdrucksweise würdig und natürlich.
- source_word: παρακαλεῖται
  choice: lässt er sich unseretwegen zum Erbarmen bewegen
  rationale: Im Zusammenhang mit dem anschließenden Zitat aus dem Moselied bezeichnet das Verb ein Bewegtwerden zu Mitleid oder Erbarmen. Die Formulierung erhält die passive beziehungsweise mediale Gestalt, ohne zu behaupten, Gott werde von Menschen getröstet.
- source_word: διεσάφησεν
  choice: hat es … deutlich gemacht
  rationale: Das Verb bezeichnet das Klarstellen oder deutliche Darlegen; die deutsche Formulierung ist präzise und gegenwärtig verständlich.
- source_word: κατὰ πρόσωπον ἀντιμαρτυρούσης
  choice: das offen gegen sie Zeugnis ablegt
  rationale: ἀντιμαρτυρέω enthält einen gegenläufigen oder anklagenden Zeugnischarakter, während κατὰ πρόσωπον die offene, unmittelbare Konfrontation ausdrückt. Das im Deutschen ergänzte »sie« bezieht sich sinngemäß auf das Volk, gegen das das Moselied als Zeuge auftritt.
- source_word: δούλοις
  choice: Knechte
  rationale: Im feierlichen Schriftzitat bezeichnet das Wort Menschen, die Gott gehören und ihm dienen. »Knechte« bewahrt Abhängigkeit und Zugehörigkeit deutlicher als das allgemeinere »Diener«, ist in diesem Kontext aber natürlicher als »Sklaven«.
- source_word: παρακληθήσεται
  choice: wird er sich erbarmen
  rationale: Das Futur wird entsprechend dem deuteronomischen Zusammenhang als göttliches Erbarmen beziehungsweise Sich-bewegen-Lassen verstanden. Die idiomatische deutsche Wendung erhält die semantische Verbindung zum ersten Vorkommen, auch wenn sie dessen Passivform nicht wörtlich nachbildet.
theological_decisions:
- issue: Bedeutung von παρακαλεῖται und παρακληθήσεται im Bezug auf das Moselied
  choice: Beide Formen werden als Gottes Bewegtwerden zum Erbarmen mit seinem Volk verstanden.
  alternative: »wird getröstet« beziehungsweise »lässt sich trösten«
  rationale: Der unmittelbare Rückbezug auf Deuteronomium 32,36 spricht für Erbarmen oder Einlenken. Eine Fußnote erhält die sprachliche Mehrdeutigkeit, ohne im Haupttext einen theologisch irreführenden Eindruck zu erzeugen.
- issue: Wiedergabe von δούλοις
  choice: seine Knechte
  alternative: seine Sklaven
  rationale: »Knechte« hält im deutschen Schriftregister sowohl Zugehörigkeit als auch Dienst fest. Die wörtlichere soziale Bezeichnung »Sklaven« wird als Alternative offengelegt.
- issue: Zeugnischarakter des Moseliedes
  choice: Das Lied legt offen gegen das Volk Zeugnis ab.
  alternative: Das Lied »bezeugt offen«, ohne ausdrücklich gegnerischen Sinn.
  rationale: Die Wiedergabe bewahrt den adversativen Gehalt von ἀντιμαρτυρούσης und den Zusammenhang des Moseliedes als Zeuge gegen Israel, ohne seine spätere Zusage des göttlichen Erbarmens aufzulösen.
translation_notes:
  register: Moderner, würdiger Bibelton mit klarer Satzführung. »Knechte« ist bewusst schriftsprachlich, aber allgemein verständlich. Die Wiederholung des Erbarmens verbindet Aussage und Schriftzitat; die Fußnoten bewahren die Mehrdeutigkeit des griechischen Verbs und die stärkere soziale Bedeutung von δούλοις.
