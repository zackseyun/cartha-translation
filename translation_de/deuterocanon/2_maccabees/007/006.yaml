  naturalness: »Der Herr, Gott« und besonders »sieht es« wirken im modernen Deutschen unidiomatisch. »Gott, der Herr, sieht zu« ist klar und bewahrt die offene Objektstelle. »Hat wahrhaftig Erbarmen mit uns« ist eine natürliche deutsche Wiedergabe des im Kontext barmherzigen Sinns.
  terminology: »Sklaven« gibt δούλοις im Zitat transparent wieder und ist gegenüber dem historisierenden »Knechte« die klarere moderne Bezeichnung. Die adversative Konnotation von ἀντιμαρτυρούσης wird in der Fußnote erläutert, ohne im Haupttext ein nicht ausgedrücktes »sie« einzuführen.
