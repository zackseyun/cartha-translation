  to: 'Gott, der Herr, sieht zu und hat wahrhaftig Erbarmen mit uns.[a] So hat Mose es durch das Lied deutlich gemacht, das offen Zeugnis ablegt,[b] als er sagte: »Und über seine Sklaven wird er sich erbarmen.«[c]'
