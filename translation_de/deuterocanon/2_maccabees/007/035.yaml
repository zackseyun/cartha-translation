  source_fidelity: Die Hauptzeile folgt dem im unmittelbaren Kontext klar erwarteten negativen Sinn von ἐκπέφευγας und kennzeichnet transparent in der Fußnote, dass der angegebene Swete-Text formal keine Negation enthält. Die Fußnote bewahrt damit die abweichende überlieferte Lesart. Die Stellung der Gottesbezeichnungen wird mit einer idiomatischeren deutschen Konstruktion genauer wiedergegeben.
  naturalness: „Wächter“ als substantivische Apposition zu Gott („Gottes, des allmächtigen Wächters“) wirkt im modernen Standarddeutsch ungewohnt und kann primär an einen Wachposten denken lassen. Die adjektivische Wiedergabe „des allmächtigen, wachenden Gottes“ ist flüssiger und wahrt den Beobachtungs- und Aufsichtsgedanken von ἐπόπτου.
  terminology: „Gericht“ ist für κρίσις treffend. „allmächtig“ gibt παντοκράτωρ etabliert und angemessen wieder. „wachend“ ist hier für ἐπόπτης/ἐπόπτου natürlicher als „Wächter“, ohne den Text durch „alles sehend“ zu erweitern.
