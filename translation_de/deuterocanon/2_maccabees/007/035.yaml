  text: For in this way you have not escaped the judgment of God[a], the all-powerful overseer.
translation:
  language: de
  text: Denn so bist du dem Gericht des allmächtigen, wachenden Gottes nicht entkommen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der bei Swete überlieferte griechische Wortlaut lautet wörtlich: „Denn so bist du dem Gericht des allmächtigen, wachenden Gottes entkommen.“ Der Zusammenhang spricht stark für den negativen Sinn: „bist du … nicht entkommen“.'
    reason: textual_variant
lexical_decisions:
- source_word: οὕτω
  choice: so
  rationale: Gibt das rück- oder folgernd verweisende Adverb knapp und natürlich wieder, ohne seine genaue Beziehung im schwierigen überlieferten Satz festzulegen.
- source_word: γὰρ
  choice: denn
  rationale: Bewahrt den begründenden Anschluss an die vorausgehende Aussage.
- source_word: κρίσιν
  choice: Gericht
  rationale: Bezeichnet hier Gottes richterliches Urteil und Handeln, ohne vorschnell nur das Strafmaß oder die Strafe selbst zu meinen.
- source_word: ἐκπέφευγας
  choice: bist du … nicht entkommen
  rationale: Das Perfekt bezeichnet den gegenwärtigen Zustand nach einem Entkommen oder Fluchtversuch. Die Negation steht nicht im überlieferten griechischen Wortlaut, ist aber vom unmittelbaren Zusammenhang zwingend nahegelegt und wird deshalb durch eine textkritische Fußnote offengelegt.
- source_word: παντοκράτορος
  choice: allmächtigen
  rationale: Die geläufige, würdevolle deutsche Wiedergabe bringt Gottes uneingeschränkte Macht zum Ausdruck.
- source_word: ἐπόπτου
  choice: Wächters
  rationale: Bezeichnet den, der beobachtet und Aufsicht führt. „Wächter“ ist im Deutschen natürlicher als „Aufseher“ und bewahrt den Gedanken, dass dem göttlichen Blick nichts entgeht.
- source_word: θεοῦ
  choice: Gottes
  rationale: Gibt den Genitiv wieder; die nachgestellte Apposition „des allmächtigen Wächters“ nimmt die beiden göttlichen Bezeichnungen auf.
theological_decisions:
- issue: Wiedergabe der Gottesbezeichnungen παντοκράτορος ἐπόπτου θεοῦ
  choice: Gottes, des allmächtigen Wächters
  alternative: des allmächtigen, alles überblickenden Gottes
  rationale: Die gewählte Form lässt Macht und wachsame Aufsicht als zwei ausdrücklich benannte Eigenschaften stehen, ohne „alles“ ergänzend in den Text einzutragen oder eine spätere dogmatische Formel zu importieren.
- issue: Behandlung der bejahten Verbform ohne ausdrückliche Negation
  choice: nicht entkommen
  alternative: entkommen
  rationale: Der überlieferte Wortlaut ist grammatisch bejahend, widerspricht jedoch der Warnung an den Verfolger im unmittelbaren Zusammenhang. Die Hauptzeile gibt daher den kontextuell geforderten negativen Sinn wieder; die formale Lesart des überlieferten Griechisch bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz bleibt knapp und anklagend. „Gericht“ wahrt den biblisch-juristischen Gehalt; „Wächter“ vermeidet das heute oft verwaltungssprachlich oder abwertend klingende „Aufseher“.
