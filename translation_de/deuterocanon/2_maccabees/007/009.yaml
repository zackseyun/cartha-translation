base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/007/009.yaml
  text: And as he was at his last breath[a], he said, “You, accursed wretch, release us from this present life, but the King of the world will raise us up, who have died for his laws[b], into an everlasting renewal of life.”
translation:
  language: de
  text: 'Als er nun seinen letzten Atemzug tat, sagte er: „Du Verfluchter[a], du entlässt uns aus diesem gegenwärtigen Leben. Der König der Welt aber wird uns, die wir für seine Gesetze gestorben sind, zu einem ewigen Wiederaufleben des Lebens[b] auferwecken.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „du Elender“ beziehungsweise „du Ruchloser“. Das griechische Wort ist eine heftige Beschimpfung.'
    reason: lexical_alternative
  - marker: b
    text: 'Die ungewöhnliche griechische Wendung verbindet „ewig“ mit einem seltenen Wort für das Wiederaufleben oder erneute Lebendigwerden; auch möglich: „zu einer ewigen Auferstehung zum Leben“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν ἐσχάτῃ ... πνοῇ γενόμενος
  choice: Als er nun seinen letzten Atemzug tat
  rationale: Die Wendung bezeichnet anschaulich den Augenblick des Sterbens. Die deutsche Formulierung ist natürlich und bewahrt das Bild des letzten Atemzugs.
- source_word: ἀλάστωρ
  choice: Verfluchter
  rationale: Das seltene Wort dient hier als heftige Beschimpfung und bezeichnet einen verfluchten oder ruchlosen Menschen. „Verfluchter“ erhält die Schärfe, ohne eine mythologische Sonderbedeutung wie „Rächer“ einzutragen.
- source_word: ἐκ τοῦ παρόντος ... ζῆν ἀπολύεις
  choice: du entlässt uns aus diesem gegenwärtigen Leben
  rationale: 'Die Wiedergabe bewahrt das Verb „entlassen“ und damit den bitter-ironischen Kontrast: Der Herrscher kann das jetzige Leben beenden, während Gott neues Leben schenkt.'
- source_word: ὁ ... τοῦ κόσμου βασιλεὺς
  choice: der König der Welt
  rationale: Dies gibt die Herrschaft über den κόσμος direkt wieder und erhält den Gegensatz zum angesprochenen irdischen König.
- source_word: ἀποθανόντας ἡμᾶς ὑπὲρ τῶν αὐτοῦ νόμων
  choice: uns, die wir für seine Gesetze gestorben sind
  rationale: Die Formulierung bildet das Partizip als abgeschlossene Handlung ab; „für“ lässt sowohl den Gedanken der Treue zu den Gesetzen als auch den Anlass ihres Todes erkennen.
- source_word: εἰς αἰώνιον ἀναβίωσιν ζωῆς
  choice: zu einem ewigen Wiederaufleben des Lebens
  rationale: Die bewusst ungewöhnliche Formulierung wahrt die Seltenheit von ἀναβίωσις („Wiederaufleben“, „wieder lebendig werden“) und glättet sie nicht zur geläufigeren Auferstehungsterminologie.
- source_word: ἀναστήσει
  choice: wird ... auferwecken
  rationale: „Auferwecken“ ist im Deutschen klare Auferstehungssprache und bildet das aktive Handeln des Königs der Welt ab.
theological_decisions:
- issue: Auferweckung der Märtyrer nach ihrem Tod
  choice: Gott wird die für seine Gesetze Gestorbenen zu einem ewigen Wiederaufleben des Lebens auferwecken.
  alternative: Gott wird sie zu einer ewigen Auferstehung zum Leben erwecken.
  rationale: Der griechische Text verbindet das gewöhnliche Auferweckungsverb ἀναστήσει mit der seltenen Wendung ἀναβίωσις ζωῆς. Die Hauptfassung erhält beide Ausdrucksebenen, statt sie zu einer einzigen dogmatischen Formel zusammenzuziehen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der direkte Vorwurf bleibt scharf; die ungewöhnliche Ausdrucksweise für das künftige Leben wird bewusst nicht vollständig geglättet.
