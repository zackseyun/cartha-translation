  text: But the king became furious and treated this one more cruelly than the others[a], taking the mockery bitterly.
translation:
  language: de
  text: Da geriet der König außer sich vor Wut und behandelte ihn grausamer als die anderen, denn er nahm ihm den Spott bitter übel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκθύμως … γενόμενος
  choice: geriet … außer sich vor Wut
  rationale: Die Verbindung bezeichnet das Eintreten eines heftigen Zorneszustands. Die deutsche Wendung gibt Intensität und Zustandswechsel natürlich wieder.
- source_word: τούτῳ παρὰ τοὺς ἄλλους χειρίστως ἀπήντησεν
  choice: behandelte ihn grausamer als die anderen
  rationale: παρὰ τοὺς ἄλλους macht den Vergleich ausdrücklich; χειρίστως bezeichnet hier die besonders schlimme beziehungsweise grausame Art, in der der König mit ihm verfuhr.
- source_word: πικρῶς φέρων ἐπὶ τῷ μυκτηρισμῷ
  choice: denn er nahm ihm den Spott bitter übel
  rationale: Die Wendung beschreibt die erbitterte Reaktion des Königs auf den spöttischen Hohn. „jemandem etwas übel nehmen“ ist im modernen Deutsch idiomatisch und bewahrt den kausalen Zusammenhang.
