lexical_decisions:
- source_word: ἄχρηστον ... τοῖς λοιποῖς γενόμενον
  choice: für die Übrigen unbrauchbar geworden war
  rationale: Die Wiedergabe bewahrt die harte, entmenschlichende Aussage des Griechischen und lässt den Bezug von τοῖς λοιποῖς auf die übrigen Anwesenden beziehungsweise Brüder bestehen, ohne ihn näher auszudeuten.
- source_word: τῇ πυρᾷ προσάγειν
  choice: ans Feuer zu bringen
  rationale: πυρά bezeichnet hier das für die Folter eingesetzte Feuer; „Feuer“ ist im Deutschen natürlicher und sachlich passender als „Scheiterhaufen“.
- source_word: ἔτινουν
  choice: noch bei Atem
  rationale: Die Form verstärkt, dass das Opfer noch nicht gestorben war. „Noch bei Atem“ gibt dies anschaulich wieder, ohne über den griechischen Befund hinauszugehen.
- source_word: τηγανίζειν
  choice: in der Pfanne zu braten
  rationale: Das von τηγάνον hergeleitete Verb benennt ausdrücklich das Braten in oder auf einer Pfanne; die konkrete Grausamkeit des Ausdrucks bleibt erhalten.
- source_word: τῆς ... ἀτμίδος ... τοῦ τηγάνου
  choice: die Pfanne ... Dampf von sich gab
  rationale: ἀτμίς kann Dampf oder sonstigen aufsteigenden Qualm bezeichnen. Die deutsche Konstruktion macht die Pfanne idiomatisch zur Quelle des Dampfes.
- source_word: ἐφʼ ἱκανὸν διδούσης
  choice: geraume Zeit reichlich ... von sich gab
  rationale: Die Wendung bezeichnet ein beträchtliches Maß und kann zeitlich oder mengenmäßig verstanden werden. Die Formulierung lässt beide Aspekte anklingen.
- source_word: ἀλλήλους παρεκάλουν σὺν τῇ μητρὶ
  choice: ermutigten sie einander zusammen mit ihrer Mutter
  rationale: παρακαλέω umfasst Ermutigen und dringendes Zureden; der Satz schließt die Mutter ausdrücklich in die gegenseitige Stärkung ein.
- source_word: γενναίως τελευτᾷν
  choice: in edler Haltung zu sterben
  rationale: γενναίως verbindet Tapferkeit mit einer ehrenvollen, würdigen Haltung. Die Formulierung gibt beide Nuancen in natürlichem Deutsch wieder.
theological_decisions:
- issue: Moralische Charakterisierung des Todes der Brüder
  choice: in edler Haltung zu sterben
  alternative: tapfer zu sterben
  rationale: Die Übersetzung erhält den ehrenden und mutbezogenen Sinn von γενναίως, ohne spätere Kategorien des Martyriums oder eine konfessionelle Deutung einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst schonungsloser Konkretheit. Der Satzbau folgt dem griechischen Ablauf, bleibt aber flüssig; die doppelte Maßangabe „geraume Zeit reichlich“ hält die mögliche zeitliche und quantitative Nuance von ἐφʼ ἱκανόν offen.
