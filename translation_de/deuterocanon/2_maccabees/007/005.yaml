  text: 'And when he had become useless to the others[a], he ordered him to be brought to the fire while still breathing and to be fried in the pan. And when the vapor from the pan had spread considerably, they encouraged one another, together with their mother, to die nobly[b], saying this:'
translation:
  language: de
  text: 'Als dieser für die Übrigen unbrauchbar geworden war, befahl der König, ihn noch lebend ans Feuer zu bringen und in der Pfanne zu braten. Als reichlich Dampf aus der Pfanne aufstieg, ermutigten sie einander zusammen mit ihrer Mutter, tapfer zu sterben, und sagten:'
