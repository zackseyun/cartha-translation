  source_fidelity: 'Die Grundaussage ist zutreffend wiedergegeben. Eine sichere Korrektur ist jedoch bei ἐφʼ ἱκανόν nötig: Die Formulierung „geraume Zeit“ fügt eine zeitliche Komponente ein, die der griechische Text nicht verlangt; der Ausdruck bezeichnet hier am ehesten reichliches bzw. beträchtliches Ausströmen. Die Wiedergabe von ἔτι ζῶν als „noch lebend“ wahrt zudem klar den Umstand, dass die Misshandlung vor dem Tod fortgesetzt wurde.'
  naturalness: Der Entwurf ist überwiegend modernes Standarddeutsch. „Noch bei Atem“ ist hier weniger idiomatisch als „noch lebend“. Außerdem kann die Abfolge „Als er …, befahl er“ im Deutschen den Eindruck erwecken, beide Pronomina bezögen sich auf dieselbe Person. Die kontextuell eindeutige Benennung „der König“ stellt den im griechischen Erzählzusammenhang impliziten Subjektwechsel klar.
  terminology: „für die Übrigen unbrauchbar“, „ans Feuer“, „in der Pfanne braten“ und „Dampf“ sind quellentreu. Für γενναίως τελευτᾷν ist „tapfer zu sterben“ idiomatisch und gibt die mutig-ehrenvolle Wertung wieder, ohne eine zusätzliche Deutung durch „Haltung“ einzutragen.
