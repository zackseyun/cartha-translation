base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/007/014.yaml
  text: 'And when he was about to die[a], he said this: “It is preferable, when dying at the hands of men, to await the hopes given by God—that one will be raised again by him[b]. But for you there will be no resurrection to life.”'
translation:
  language: de
  text: 'Und als er im Begriff war zu sterben, sagte er: »Es ist vorzuziehen, von Menschen getötet zu werden und die von Gott gegebenen Hoffnungen zu erwarten, wieder von ihm auferweckt zu werden.[a] Für dich aber wird es keine Auferstehung zum Leben geben.[b]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: »Es ist besser, wenn man von Menschen getötet wird, auf die Hoffnung zu setzen, von Gott wieder auferweckt zu werden.«'
    reason: 'Die griechische Satzfügung ist verdichtet: μεταλλάσσω kann hier das Sterben beziehungsweise Getötetwerden bezeichnen; der Plural »Hoffnungen« wird durch die nähere Bestimmung konkretisiert, wieder von Gott auferweckt zu werden.'
  - marker: b
    text: »Keine Auferstehung zum Leben« kann den Ausschluss von einer heilvollen Auferstehung bezeichnen, ohne ausdrücklich jede Art von Auferstehung zu verneinen.
    reason: Die Zielangabe »zum Leben« lässt eine theologisch bedeutsame Mehrdeutigkeit bestehen, die nicht im Haupttext aufgelöst werden soll.
lexical_decisions:
- source_word: γενόμενος πρὸς τῷ τελευτᾷν
  choice: als er im Begriff war zu sterben
  rationale: Die Wendung πρὸς τῷ mit Infinitiv bezeichnet das unmittelbar Bevorstehende. Die deutsche Formulierung gibt dies natürlich und genau wieder.
- source_word: οὕτως ἔφη
  choice: sagte er
  rationale: Das schlichte deutsche Redeeinleitungsverb ist im Zusammenhang natürlich; der deiktische Gehalt von οὕτως wird durch den unmittelbar folgenden Wortlaut hinreichend deutlich.
- source_word: Αἱρετὸν
  choice: Es ist vorzuziehen
  rationale: Αἱρετόν bezeichnet etwas Wählenswertes oder Vorzuziehendes. Die Wiedergabe wahrt den abwägenden Sinn stärker als ein bloßes »besser«.
- source_word: μεταλλάσσοντας ἀπὸ ἀνθρώπων
  choice: durch Menschen aus dem Leben zu scheiden
  rationale: μεταλλάσσω bezeichnet hier das Scheiden aus dem Leben; ἀπὸ ἀνθρώπων kennzeichnet die menschliche Verursachung. Die Formulierung bleibt nahe am griechischen Ausdruck, ohne im Deutschen unverständlich zu wirken.
- source_word: τὰς ὑπὸ τοῦ θεοῦ προσδοκᾷν ἐλπίδας
  choice: auf die von Gott gegebenen Hoffnungen zu warten
  rationale: Der Plural »Hoffnungen« und Gott als deren Urheber werden bewahrt. »Gegeben« drückt die durch ὑπό bezeichnete Herkunft aus, ohne das im Text nicht ausdrücklich stehende »verheißen« einzutragen.
- source_word: πάλιν ἀναστήσεσθαι ὑπʼ αὐτοῦ
  choice: von ihm wieder auferweckt zu werden
  rationale: Die passive Form und Gottes ausdrückliche Urheberschaft bleiben erhalten. »Auferweckt« ist im Deutschen natürlich und theologisch präzise.
- source_word: ἀνάστασις εἰς ζωὴν
  choice: Auferstehung zum Leben
  rationale: Die knappe, theologisch gewichtige Zielangabe εἰς ζωήν wird formal bewahrt und nicht zu einer pauschalen Leugnung jeder Auferstehung erweitert.
theological_decisions:
- issue: Auferstehungshoffnung des Märtyrers gegenüber der Aussage über den Verfolger
  choice: Gott wird die Sterbenden wieder auferwecken; der Angeredete wird keine »Auferstehung zum Leben« haben.
  alternative: Der Angeredete wird überhaupt keine Auferstehung haben.
  rationale: εἰς ζωήν qualifiziert ausdrücklich ἀνάστασις. Die Übersetzung bewahrt deshalb die Möglichkeit, dass eine zum Leben führende, heilvolle Auferstehung verneint wird, ohne zu entscheiden, ob jede Art von Auferstehung ausgeschlossen ist.
- issue: Zahl und Bezug der Auferstehungshoffnung
  choice: Die allgemeine Aussage wird unpersönlich formuliert und die griechische Passivkonstruktion »von ihm wieder auferweckt zu werden« beibehalten.
  alternative: »dass er uns wieder auferwecken wird«
  rationale: Der griechische Akkusativ Plural bei μεταλλάσσοντας legt einen allgemeinen oder gemeinschaftlichen Bezug nahe, nennt jedoch kein ausdrückliches »uns«. Die gewählte Form wahrt diese Offenheit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Rede bleibt direkt und eindringlich; ungewöhnliche, aber bedeutungstragende Züge des Griechischen wie der Plural »Hoffnungen«, die göttliche Urheberschaft und »Auferstehung zum Leben« werden bewahrt.
