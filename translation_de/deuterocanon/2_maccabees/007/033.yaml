base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/007/033.yaml
  text: But if our living Lord has become angry for a little while for the sake of rebuke and discipline[b][a], he will again be reconciled with his own servants.
translation:
  language: de
  text: Doch wenn unser lebendiger Herr um der Zurechtweisung und Erziehung willen für kurze Zeit zornig geworden ist, wird er sich wieder mit seinen eigenen Dienern[a] versöhnen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „seinen eigenen Sklaven“. Das griechische Wort δοῦλοι kann je nach Zusammenhang „Sklaven“ oder „Diener“ bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „wird er seinen eigenen Dienern gegenüber wieder besänftigt sein“. Das griechische Verb kann die wiederhergestellte Gunst nach einer Zeit des Zorns betonen.'
    reason: alternative_reading
lexical_decisions:
- source_word: εἰ δὲ
  choice: Doch wenn
  rationale: Gibt den bedingenden Übergang und den leichten Gegensatz zum vorausgehenden Zusammenhang natürlich wieder.
- source_word: χάριν ἐπιπλήξεως καὶ παιδίας
  choice: um der Zurechtweisung und Erziehung willen
  rationale: χάριν mit Genitiv bezeichnet hier Zweck oder Grund. „Zurechtweisung“ erfasst den Tadel, „Erziehung“ die auf Besserung zielende disziplinierende Unterweisung.
- source_word: ὁ ζῶν κύριος ἡμῶν
  choice: unser lebendiger Herr
  rationale: Bewahrt die attributive Aussage ζῶν und die feierliche, aber verständliche Gottesbezeichnung κύριος.
- source_word: βραχέως ἐπωργίσται
  choice: für kurze Zeit zornig geworden ist
  rationale: βραχέως bezeichnet eine begrenzte Dauer; das Perfekt beschreibt den aus dem Zorn hervorgegangenen gegenwärtigen Zustand.
- source_word: καὶ πάλιν καταλλαγήσεται
  choice: wird er sich wieder … versöhnen
  rationale: Gibt die künftige Wiederherstellung der Beziehung nach dem zeitweiligen Zorn wieder, ohne deren Mechanismus näher festzulegen.
- source_word: τοῖς ἑαυτοῦ δούλοις
  choice: mit seinen eigenen Dienern
  rationale: „Diener“ ist im gegenwärtigen deutschen Bibelregister natürlich und bewahrt das Verhältnis zum Herrn; „eigenen“ bildet ἑαυτοῦ ausdrücklich ab. Die stärkere soziale Bedeutung „Sklaven“ bleibt in der Fußnote sichtbar.
theological_decisions:
- issue: Bedeutung von δοῦλοι im Verhältnis zu κύριος
  choice: Diener
  alternative: Sklaven
  rationale: Der Kontext hebt Zugehörigkeit und Dienst gegenüber dem Herrn hervor. „Diener“ ist hier im Deutschen idiomatischer; die mögliche stärkere Bezeichnung des unfreien Status wird nicht verschwiegen, sondern in Fußnote [a] festgehalten.
- issue: Sinn von καταλλαγήσεται im Verhältnis Gottes zu seinen Dienern
  choice: wird er sich wieder mit seinen eigenen Dienern versöhnen
  alternative: wird er seinen eigenen Dienern gegenüber wieder besänftigt sein
  rationale: Die Hauptfassung bewahrt die relationale Wiederherstellung nach dem Zorn. Die Alternative macht den möglichen Akzent auf dem Ende des göttlichen Zorns sichtbar, ohne die Ambiguität im Haupttext einseitig aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die leicht gehobene Wendung „um … willen“ entspricht dem feierlichen Kontext, bleibt aber allgemein verständlich. Beide Fußnotenmarker stehen an den jeweils betroffenen Ausdrücken im Haupttext.
