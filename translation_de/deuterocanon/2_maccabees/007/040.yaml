  yaml_path: translation/deuterocanon/2_maccabees/007/040.yaml
  text: And so this one also passed away in purity[b][a], having placed his full confidence in the Lord.
translation:
  language: de
  text: So schied auch dieser in Reinheit aus dem Leben[a], im vollen Vertrauen auf den Herrn.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „starb in reiner, unbefleckter Weise“. Das griechische Adverb hat wahrscheinlich einen sittlichen Gehalt.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „wobei er voll und ganz auf den Herrn vertraute“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ οὗτος οὖν
  choice: So … auch dieser
  rationale: Bewahrt die folgernde und anknüpfende Kraft von καὶ … οὖν sowie die Hervorhebung durch οὗτος und fügt sich natürlich in die fortlaufende Märtyrererzählung ein.
- source_word: καθαρῶς
  choice: in Reinheit
  rationale: Gibt das Adverb als Bestimmung der Todesweise wieder und lässt seinen wahrscheinlichen sittlich-religiösen Gehalt erkennen, ohne ihn auf rituelle Reinheit einzuengen.
- source_word: μετήλλαξεν
  choice: schied … aus dem Leben
  rationale: Entspricht dem ehrerbietigen griechischen Ausdruck für das Sterben und ist im Deutschen würdevoller als das schlichte „starb“, ohne den Sinn auszuweiten.
- source_word: παντελῶς
  choice: voll
  rationale: Drückt die uneingeschränkte, vollständige Ausrichtung des Vertrauens idiomatisch aus.
- source_word: ἐπὶ τῷ κυρίῳ
  choice: auf den Herrn
  rationale: Bei πεποιθώς bezeichnet ἐπί mit Dativ denjenigen, auf den sich das Vertrauen stützt; „auf den Herrn vertrauen“ bildet dies im Deutschen unmittelbar ab.
- source_word: πεποιθώς
  choice: im … Vertrauen
  rationale: Die nominale Wendung gibt den durch das Perfektpartizip bezeichneten gefestigten und fortdauernden Zustand des Vertrauens natürlich wieder.
- source_word: κύριος
  choice: Herr
  rationale: „Herr“ ist die sachgemäße Standardwiedergabe von κύριος und bezeichnet hier den souveränen Gott.
theological_decisions:
- issue: Sittlich-religiöser Gehalt von καθαρῶς bei der Beschreibung seines Todes
  choice: Die Wendung besagt, dass er in Reinheit beziehungsweise unbefleckter Lauterkeit starb.
  alternative: Das Wort könnte allgemeiner bedeuten, dass er auf untadelige oder edle Weise starb, ohne ausdrücklich religiösen Reinheitsbezug.
  rationale: Der Zusammenhang des treuen Festhaltens an Gottes Gesetz legt einen sittlich-religiösen Klang nahe. „In Reinheit“ erhält diesen, ohne eine bestimmte rituelle Kategorie festzuschreiben.
- issue: Bezug und Stärke von παντελῶς
  choice: 'Das Adverb bestimmt sein Vertrauen als vollständig: „im vollen Vertrauen“.'
  alternative: Es kann enger adverbial als „wobei er ganz auf den Herrn vertraute“ wiedergegeben werden.
  rationale: Beide Fassungen beziehen die Totalität auf πεποιθώς. Die gewählte Form ist idiomatisch und bewahrt die uneingeschränkte Ausrichtung auf den Herrn.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Schied aus dem Leben“ erhält den ehrerbietigen Ton des griechischen Sterbeidioms; „in Reinheit“ bewahrt die knappe, theologisch offene Formulierung.
