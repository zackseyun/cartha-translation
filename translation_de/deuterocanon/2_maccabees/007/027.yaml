base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/007/027.yaml
  text: 'But bending down to him[a], and mocking the cruel tyrant, she spoke in her native tongue as follows: “My son, have mercy on me, who carried you in the womb for nine months, nursed you for three years, raised you, brought you to this age[b], and cared for you.”'
translation:
  language: de
  text: 'Sie beugte sich jedoch zu ihm hinunter[a] und verhöhnte den grausamen Tyrannen. Dann sagte sie in ihrer Muttersprache[b]: »Mein Sohn, hab Erbarmen mit mir, die ich dich neun Monate im Mutterleib getragen und dich drei Jahre gestillt habe. Ich habe dich großgezogen, dich bis zu diesem Alter gebracht und für dich gesorgt.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sie verbeugte sich vor ihm.“ Das griechische Verb kann ein Niederbeugen bis hin zum Niederwerfen bezeichnen; hier ist wahrscheinlich die körperliche Hinwendung zu ihrem Sohn gemeint.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „in der väterlichen Sprache“, also in ihrer angestammten Sprache.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκύψασα αὐτῷ
  choice: sie beugte sich zu ihm hinunter
  rationale: Das Partizip bezeichnet eine körperliche Bewegung des Sich-Niederbeugens in seine Richtung. Die Formulierung passt natürlich zur Szene, ohne daraus Verehrung oder Unterwerfung zu machen.
- source_word: χλενάσασα
  choice: verhöhnte
  rationale: Das Verb bezeichnet spöttische, verächtliche Verspottung; „verhöhnen“ gibt die trotzige Schärfe der Handlung wieder.
- source_word: τὸν ὠμὸν τύραννον
  choice: den grausamen Tyrannen
  rationale: ὠμός bezeichnet hier erbarmungslose Grausamkeit; „grausam“ ist im Deutschen klar, kräftig und idiomatisch.
- source_word: τῇ πατρίᾳ φωνῇ
  choice: in ihrer Muttersprache
  rationale: Die Wendung meint die angestammte beziehungsweise eigene Sprache. „Muttersprache“ ist die natürliche moderne deutsche Entsprechung.
- source_word: ἐλέησόν με
  choice: hab Erbarmen mit mir
  rationale: Die Wendung bewahrt die Eindringlichkeit des Imperativs und den emotionalen Charakter der mütterlichen Bitte.
- source_word: τὴν ἐν γαστρὶ περιενέγκασάν σε μῆνας ἐννέα
  choice: die ich dich neun Monate im Mutterleib getragen habe
  rationale: Die konkrete Schwangerschaftsaussage wird vollständig und in würdigem, geläufigem Deutsch wiedergegeben.
- source_word: θηλάσασάν σε ἔτη τρία
  choice: dich drei Jahre gestillt habe
  rationale: θηλάζω bezeichnet ausdrücklich das Stillen an der Brust; „gestillt“ ist präzise und natürlich.
- source_word: ἐκθρέψασάν σε
  choice: ich habe dich großgezogen
  rationale: Das Verb umfasst Ernährung und Aufziehen eines Kindes; „großgezogen“ gibt diesen weiteren Sinn knapp wieder.
- source_word: ἀγαγοῦσαν εἰς τὴν ἡλικίαν ταύτην
  choice: dich bis zu diesem Alter gebracht
  rationale: Die Formulierung bleibt nah an der griechischen Aussage, dass sie ihn bis zu seinem gegenwärtigen Lebensalter geführt und erhalten hat.
- source_word: τροφοφορήσασαν
  choice: für dich gesorgt
  rationale: Das seltene Verb bezeichnet versorgendes Ernähren beziehungsweise Unterhalten. „Für dich gesorgt“ wahrt die Breite des Ausdrucks und vermeidet eine ungesicherte Verengung.
theological_decisions:
- issue: Die Bitte der Mutter in ἐλέησόν με
  choice: hab Erbarmen mit mir
  alternative: hab Mitleid mit mir
  rationale: „Erbarmen“ erhält die starke, unmittelbare Bitte des griechischen Imperativs, ohne die Wendung hier zu einer besonderen dogmatischen Formel zu machen.
- issue: Die Identitätssprache in τῇ πατρίᾳ φωνῇ
  choice: in ihrer Muttersprache
  alternative: in ihrer angestammten Sprache
  rationale: Die Übersetzung macht die familiär-ethnische Sprachzugehörigkeit verständlich, ohne eine bestimmte historische Sprache zu ergänzen, die der Vers nicht ausdrücklich nennt.
