base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/007/029.yaml
  text: Do not fear this executioner[a], but, becoming worthy of your brothers, accept death[c][b], so that in mercy I may receive you back together with your brothers.
translation:
  language: de
  text: Fürchte dich nicht vor diesem Henker[a], sondern erweise dich deiner Brüder würdig und nimm den Tod an, damit ich dich durch das Erbarmen[b] zusammen mit deinen Brüdern zurückerhalte[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „diesem Folterer“. Das griechische Wort bezeichnet genauer einen Henker, auch wenn der Zusammenhang Folter einschließt.'
    reason: lexical_alternative
  - marker: b
    text: Das „Erbarmen“ meint wahrscheinlich Gottes Erbarmen; Gott wird in diesem griechischen Satzteil jedoch nicht ausdrücklich genannt.
    reason: alternative_reading
  - marker: c
    text: 'Oder: „ich dich wiedererlange“ beziehungsweise „ich dich empfange“. Die Worte drücken die Hoffnung der Mutter aus, mit ihrem Sohn und seinen Brüdern wieder vereint zu werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ φοβηθῇς
  choice: Fürchte dich nicht
  rationale: Die verneinte Aufforderung wird direkt, knapp und in würdigem modernem Deutsch wiedergegeben.
- source_word: τὸν δήμιον τοῦτον
  choice: diesem Henker
  rationale: δήμιος bezeichnet hier am genauesten denjenigen, der die Hinrichtung vollzieht; der Kontext schließt Folter ein, ohne dass dies die primäre Wortbedeutung sein muss.
- source_word: τῶν ἀδελφῶν σου ἄξιος γενόμενος
  choice: erweise dich deiner Brüder würdig
  rationale: Die Formulierung gibt das partizipiale γενόμενος idiomatisch als Aufforderung wieder und bewahrt den Bezug auf die leiblichen Brüder.
- source_word: ἐπίδεξαι τὸν θάνατον
  choice: nimm den Tod an
  rationale: ἐπιδέχομαι kann ‚annehmen‘ oder ‚empfangen‘ bedeuten; hier geht es um die bewusste Annahme des bevorstehenden Todes.
- source_word: ἐν τῷ ἐλέει
  choice: im Erbarmen
  rationale: Die knappe Wiedergabe lässt offen, wessen Erbarmen gemeint ist, wie auch der griechische Wortlaut Gott an dieser Stelle nicht ausdrücklich nennt.
- source_word: σὺν τοῖς ἀδελφοῖς σου
  choice: zusammen mit deinen Brüdern
  rationale: Die Wiedergabe macht die durch σύν bezeichnete Gemeinschaft und den Gedanken der Wiedervereinigung deutlich.
- source_word: κομίσωμαί σε
  choice: ich dich … zurückerhalte
  rationale: κομίζω kann ‚zurückerhalten‘, ‚wiedererlangen‘ oder ‚empfangen‘ bedeuten. ‚Zurückerhalten‘ bewahrt die Hoffnung der Mutter auf Wiedervereinigung, ohne den Vorgang näher auszuführen.
theological_decisions:
- issue: Ob Gott als Urheber des Erbarmens ausdrücklich genannt werden soll
  choice: „im Erbarmen“, ohne „Gottes“ hinzuzufügen
  alternative: „in Gottes Erbarmen“ oder „durch Gottes Erbarmen“
  rationale: Der Zusammenhang legt göttliches Erbarmen nahe, doch im griechischen Satz wird Gott nicht ausdrücklich genannt. Die Übersetzung bewahrt diese implizite theologische Aussage.
- issue: Auferstehungs- beziehungsweise Wiedervereinigungsgehalt von κομίσωμαί σε
  choice: „ich dich … zurückerhalte“
  alternative: „ich dich empfange“ oder „ich dich wiedererlange“
  rationale: Die Formulierung lässt die erhoffte Wiedervereinigung über den Tod hinaus erkennen, ohne die Art und Weise der Auferstehung stärker auszudeuten als der griechische Text.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte mütterliche Aufforderung bleibt eindringlich; ungewöhnliche, aber theologisch offene Wendungen wie „im Erbarmen“ werden nicht durch erklärende Zusätze im Haupttext vereindeutigt.
