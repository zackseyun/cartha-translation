base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/007/022.yaml
  text: I do not know how you appeared in my womb[a], nor was it I who granted you spirit and life, and it was not I who arranged the formation of each of you.
translation:
  language: de
  text: Ich weiß nicht, wie ihr in meinen Mutterleib gekommen seid; auch habe nicht ich euch Geist[a] und Leben geschenkt, und auch die Zusammensetzung jedes Einzelnen von euch habe nicht ich geordnet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Atem. Das griechische Wort kann „Geist“, „Atem“ oder „Wind“ bedeuten; hier bezeichnet es das belebende Lebensprinzip.'
    reason: Lexikalische Bedeutungsalternative zu πνεῦμα.
lexical_decisions:
- source_word: Οὐκ οἶδʼ ὅπως
  choice: Ich weiß nicht, wie
  rationale: Die schlichte deutsche Wendung gibt das Eingeständnis der Mutter natürlich und genau wieder, ohne die Art und Weise näher festzulegen.
- source_word: εἰς τὴν ἐμὴν ἐφάνητε κοιλίαν
  choice: ihr in meinem Mutterleib erschienen seid
  rationale: „Erschienen seid“ bewahrt die Bildlichkeit von ἐφάνητε und damit den geheimnisvollen Charakter ihrer Entstehung. „Mutterleib“ bezeichnet κοιλίαν im gegebenen Zusammenhang eindeutig und würdig.
- source_word: τὸ πνεῦμα καὶ τὴν ζωὴν ὑμῖν ἐχαρισάμην
  choice: euch Geist und Leben geschenkt
  rationale: „Geschenkt“ gibt den Charakter von ἐχαρισάμην als freies Gewähren wieder. „Geist“ hält die Bedeutungsbreite von πνεῦμα offen und bleibt von „Leben“ unterschieden.
- source_word: τὴν ἑκάστου στοιχείωσιν
  choice: die Bildung eines jeden von euch
  rationale: στοιχείωσις meint hier die Ausbildung beziehungsweise Zusammensetzung des einzelnen Menschen. „Bildung“ ist verständlich, ohne den Ausdruck unnötig medizinisch festzulegen; „eines jeden von euch“ bewahrt den distributiven Sinn von ἑκάστου.
- source_word: οὐκ ἐγὼ διερρύθμισα
  choice: nicht ich habe … geordnet
  rationale: Die Wortstellung erhält die Betonung von ἐγώ. „Geordnet“ gibt das planvolle Anordnen von διερρύθμισα wieder, ohne einen bestimmten biologischen Vorgang hineinzulesen.
theological_decisions:
- issue: Bedeutung von πνεῦμα in der Aussage über den Ursprung menschlichen Lebens
  choice: Geist
  alternative: Atem beziehungsweise Lebensatem
  rationale: Da πνεῦμα neben ζωή („Leben“) steht, werden die beiden Begriffe nicht zu einer einzigen Aussage verschmolzen. „Geist“ wahrt die mögliche anthropologische und theologische Weite; die Fußnote nennt die ebenfalls mögliche Bedeutung „Atem“.
- issue: Tragweite der mütterlichen Verneinung
  choice: Die Formulierung verneint den letztursächlichen Anteil der Mutter an Geist, Leben und leiblicher Bildung, ohne ihre tatsächliche Mutterschaft zu bestreiten.
  alternative: Die Mutter bestreitet jede eigene kausale Mitwirkung.
  rationale: Die Übersetzung lässt die emphatische dreifache Verneinung stehen, fügt aber keine Erklärung ein, die über den griechischen Wortlaut hinausginge.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau bewahrt die wiederholte Hervorhebung „nicht ich“, bleibt aber für heutige Leser flüssig. „Mutterleib“ ist im Kontext klarer als das allgemeinere „Leib“ oder „Bauch“.
