    issue: „ihr in meinem Mutterleib erschienen seid“
    rationale: Die Formulierung ist im heutigen Deutsch unidiomatisch und lässt die bei εἰς vorhandene Bewegung bzw. das Hineinkommen in den Mutterleib verblassen. „in meinen Mutterleib gekommen seid“ ist natürlicher und sachnäher.
  - severity: medium
    issue: „die Bildung eines jeden von euch geordnet“
    rationale: „Bildung ordnen“ ist im Deutschen semantisch unklar; „Bildung“ kann zudem Erziehung meinen. στοιχείωσις bezeichnet hier die Zusammensetzung bzw. Konstitution des Einzelnen. „die Zusammensetzung jedes Einzelnen von euch geordnet“ ist klarer und entspricht διερρύθμισα besser.
