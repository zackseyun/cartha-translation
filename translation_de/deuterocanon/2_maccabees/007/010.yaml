base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/007/010.yaml
  text: After him[a], the third was mocked, and when his tongue was demanded, he quickly held it out and courageously stretched out his hands.
translation:
  language: de
  text: Nach ihm wurde der dritte verspottet. Als man von ihm die Zunge verlangte[a], streckte er sie sofort heraus und streckte mutig die Hände aus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „als seine Zunge verlangt worden war“. Im Griechischen steht ein passives Partizip; wer die Forderung stellt, wird nicht ausdrücklich genannt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ τοῦτον
  choice: Nach ihm
  rationale: Die Wendung bezeichnet die zeitliche Abfolge der Brüder; „Nach ihm“ ist im Deutschen natürlich und bewahrt den Personenbezug.
- source_word: ὁ τρίτος
  choice: der dritte
  rationale: Die Ordnungszahl steht substantivisch. Dass der dritte Bruder gemeint ist, ergibt sich aus dem Zusammenhang und muss nicht ergänzt werden.
- source_word: ἐνεπαίζετο
  choice: wurde verspottet
  rationale: Das Verb bezeichnet Spott oder höhnische Behandlung. Die Übersetzung gibt die Demütigung wieder, ohne die Folter, die der Kontext bereits erkennen lässt, eigens in das Verb hineinzulesen.
- source_word: τὴν γλῶσσαν αἰτηθεὶς
  choice: Als man von ihm die Zunge verlangte
  rationale: Das passive Partizip von αἰτέω wird als natürlicher deutscher Temporalsatz wiedergegeben. „Verlangte“ trägt dem Zwangskontext Rechnung; der ungenannte Handelnde wird mit dem unpersönlichen „man“ ausgedrückt.
- source_word: ταχέως
  choice: sofort
  rationale: Das Adverb bezeichnet rasches, unverzügliches Handeln; „sofort“ passt hier flüssig und prägnant.
- source_word: προέβαλλεν
  choice: streckte er sie heraus
  rationale: Das Verb bedeutet, etwas nach vorn zu bringen oder hervorzustrecken. Mit der Zunge als erschlossenem Objekt ist diese Formulierung idiomatisch und anschaulich.
- source_word: τὰς χεῖρας εὐθαρσῶς προέτεινεν
  choice: hielt mutig seine Hände hin
  rationale: εὐθαρσῶς bezeichnet mutiges, beherztes Handeln. „Die Hände hinhalten“ gibt in diesem konkreten Zusammenhang das freiwillige Ausstrecken zur bevorstehenden Misshandlung natürlicher wieder als eine mechanisch wörtliche Formulierung.
