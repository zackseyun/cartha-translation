base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/007/024.yaml
  text: But Antiochus[a], thinking that he was being despised and taking note of the reproachful tone, while the youngest was still alive, not only urged him with words, but also assured him with oaths that he would both make him rich and make him blessed, if he turned away from the traditions of his fathers[c][b], and that he would have him as a friend and entrust him with offices.
translation:
  language: de
  text: 'Antiochus aber meinte, man verachte ihn, und bemerkte den vorwurfsvollen Ton.[a] Solange der Jüngste noch am Leben war, versuchte er deshalb, ihn nicht nur mit Worten zu überreden, sondern versicherte ihm auch unter Eiden: Er werde ihn reich machen und in eine beneidenswerte Lage versetzen, wenn er sich von den Überlieferungen seiner Vorfahren abwende; er werde ihn zu seinem Freund[b] machen und ihm Aufgaben[c] anvertrauen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »die vorwerfende Stimme«; auch möglich: »die beleidigende Rede«.'
    reason: lexical_alternative
  - marker: b
    text: »Freund« kann hier auch einen königlichen Vertrauten oder einen Angehörigen des Hofes bezeichnen.
    reason: cultural_note
  - marker: c
    text: 'Auch möglich: »Ämter« oder »Verantwortungsbereiche«; gemeint sind vom König anvertraute Pflichten oder Funktionen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἰόμενος καταφρονεῖσθαι
  choice: meinte, man verachte ihn
  rationale: Gibt die subjektive Einschätzung des Antiochus und den passiven Sinn knapp und natürlich wieder.
- source_word: τὴν ὀνειδίζουσαν ... φωνήν
  choice: den vorwurfsvollen Ton
  rationale: Das Griechische lautet wörtlich »die vorwerfende Stimme«; »Ton« vermittelt im Deutschen idiomatisch die wahrgenommene Art des Sprechens.
- source_word: ὑφορώμενος
  choice: bemerkte
  rationale: Passt zur kontextuellen Bedeutung des Wahrnehmens, ohne den möglichen Beiklang des Argwohns überzubetonen.
- source_word: ἔτι τοῦ νεωτέρου περιόντος
  choice: Solange der Jüngste noch am Leben war
  rationale: Im Zusammenhang der nacheinander getöteten Brüder bezeichnet περιόντος sein fortdauerndes Überleben.
- source_word: ἐποιεῖτο τὴν παράκλησιν
  choice: versuchte er ... zu überreden
  rationale: Gibt den werbenden und drängenden Charakter des königlichen Appells natürlich wieder.
- source_word: διʼ ὅρκων ἐπίστου
  choice: versicherte ihm auch unter Eiden
  rationale: Bewahrt sowohl die eidliche Bekräftigung als auch die auf Überzeugung zielende Zusicherung.
- source_word: πλουτιεῖν
  choice: reich machen
  rationale: Direkte und verständliche Wiedergabe des materiellen Versprechens.
- source_word: μακαριστὸν ποιήσειν
  choice: in eine beneidenswerte Lage versetzen
  rationale: Drückt hier weltliches Glück und privilegierten Status aus, ohne unnötig einen religiösen Sinn von »selig« einzutragen.
- source_word: μεταθέμενον ἀπὸ τῶν πατρίων
  choice: wenn er sich von den Überlieferungen seiner Vorfahren abwende
  rationale: Der konditionale Sinn des Partizips und die Abkehr vom angestammten religiösen Erbe bleiben erhalten.
- source_word: φίλον ἕξειν
  choice: ihn zu seinem Freund machen
  rationale: Natürliches Deutsch; die mögliche höfische Amtsbedeutung von »Freund« wird in einer Fußnote offengehalten.
- source_word: χρείας ἐμπιστεύσειν
  choice: ihm wichtige Aufgaben anvertrauen
  rationale: χρείας bezeichnet anvertraute Angelegenheiten, Pflichten oder Funktionen; »Aufgaben« vermeidet eine zu enge Festlegung auf formale Ämter.
theological_decisions:
- issue: Bedeutung von πατρίων im Zusammenhang des Abfalls
  choice: Überlieferungen seiner Vorfahren
  alternative: angestammte Bräuche
  rationale: Die Formulierung wahrt den familiären und religiösen Erbzusammenhang, ohne die griechische Wendung dogmatisch zu präzisieren.
- issue: Bedeutung von μακαριστόν im königlichen Versprechen
  choice: in eine beneidenswerte Lage versetzen
  alternative: glücklich machen / selig machen
  rationale: Im Kontext von Reichtum und königlicher Förderung bezeichnet das Wort wahrscheinlich eine öffentlich als glücklich oder beneidenswert geltende Stellung; religiöse Seligkeit ist nicht gefordert.
- issue: Möglicher Titelcharakter von φίλος
  choice: Freund im Haupttext, höfische Bedeutung in der Fußnote
  alternative: Hofbeamter / königlicher Vertrauter
  rationale: Die wörtliche Bezeichnung bleibt erhalten, während ihre mögliche institutionelle Bedeutung transparent gemacht wird.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur wurde für gute Verständlichkeit behutsam gegliedert; subjektive Perspektive, höfisch-politischer Kontext und lexikalische Mehrdeutigkeiten bleiben gewahrt.
