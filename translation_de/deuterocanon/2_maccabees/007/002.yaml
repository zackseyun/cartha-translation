base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/007/002.yaml
  text: But one of them[a], becoming their spokesman, said, “What do you intend to ask and learn from us? For we are ready to die rather than transgress the ancestral laws.”
translation:
  language: de
  text: 'Doch einer von ihnen trat als Sprecher auf und sagte: »Was willst du uns fragen und von uns erfahren? Wir sind nämlich bereit zu sterben, statt die Gesetze unserer Vorfahren[a] zu übertreten.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die angestammten Gesetze«.'
    reason: Lexikalische Alternative für πατρῷα νόμους; die Wendung kann sowohl den Bezug auf die Vorfahren als auch den ererbten Charakter der Gesetze hervorheben.
lexical_decisions:
- source_word: εἷς δὲ αὐτῶν
  choice: Doch einer von ihnen
  rationale: Die partitive Fügung bedeutet eindeutig „einer von ihnen“. „Doch“ gibt δέ als Übergang zu ihrer entschlossenen Antwort natürlich wieder.
- source_word: γενόμενος προήγορος
  choice: trat als Sprecher auf
  rationale: προήγορος bezeichnet hier denjenigen, der zuerst beziehungsweise stellvertretend für die Gruppe spricht. Die idiomatische Wendung wahrt die Funktion, ohne ihn zum förmlichen Anführer zu machen.
- source_word: Μέλλεις ἐρωτᾷν, καὶ μανθάνειν ἡμῶν;
  choice: Was willst du uns fragen und von uns erfahren?
  rationale: μέλλεις bezeichnet Absicht oder Bevorstehen; im rhetorischen Zusammenhang klingt „Was willst du …?“ im Deutschen natürlich. ἡμῶν wird sinngemäß auf beide Verben bezogen, bei μανθάνειν ausdrücklich als „von uns“.
- source_word: ἕτοιμοι γάρ ἀποθνήσκειν ἐσμέν
  choice: Wir sind nämlich bereit zu sterben
  rationale: Die Konstruktion mit ἕτοιμοι und Infinitiv besagt unmittelbar, dass sie zum Sterben bereit sind. „Nämlich“ gibt die begründende Funktion von γάρ im gesprochenen Deutsch passend wieder.
- source_word: ἢ … παραβαίνειν
  choice: statt … zu übertreten
  rationale: ἢ stellt hier die Alternative beziehungsweise Vorzugsentscheidung zwischen Sterben und Gesetzesübertretung heraus. „Übertreten“ bewahrt den rechtlich-moralischen Ernst von παραβαίνειν.
- source_word: τὰ πατρῷα νόμους
  choice: die Gesetze unserer Vorfahren
  rationale: πατρῷα kennzeichnet das von den Vorfahren ererbte Recht. Die Formulierung erhält den gemeinschaftlichen und traditionsbezogenen Sinn und ist in modernem Deutsch klar.
theological_decisions:
- issue: Wiedergabe der ererbten jüdischen Gesetzestradition in πατρῷα νόμους
  choice: die Gesetze unserer Vorfahren
  alternative: die angestammten Gesetze
  rationale: Die Hauptfassung bewahrt den konkreten Bezug auf die Vorfahren und damit die gemeinschaftliche Identität unter Verfolgung. Die Alternative gibt denselben ererbten Charakter knapper wieder; keine Fassung legt eine spätere konfessionelle Deutung in den Text.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Direkte und entschlossene Rede; keine unnötig altertümlichen Formulierungen. Die Anrede steht entsprechend dem griechischen Singular im vertrauten „du“.
