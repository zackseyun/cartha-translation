  text: so that the king himself and those with him were astonished at the young man's spirit, because he regarded the sufferings as nothing.
translation:
  language: de
  text: Der König selbst und die, die bei ihm waren, staunten daher über die innere Haltung des jungen Mannes, weil er die Qualen für nichts hielt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ψυχήν
  choice: innere Haltung
  rationale: Hier bezeichnet ψυχή im Kontext nicht bloß das Leben oder eine vom Körper getrennte Seele, sondern die angesichts der Folter sichtbar werdende innere Verfassung und Standhaftigkeit des jungen Mannes. „Innere Haltung“ gibt dies im modernen Deutschen natürlich wieder, ohne den Begriff auf bloßen Mut zu verengen.
- source_word: ἀλγηδόνας
  choice: Qualen
  rationale: Das Wort bezeichnet starke Schmerzen beziehungsweise Leiden; im unmittelbaren Folterkontext ist „Qualen“ prägnant und angemessen.
- source_word: ἐνʼ οὐδενὶ ... ἐτίθετο
  choice: für nichts achtete
  rationale: Die idiomatische Wendung bedeutet, etwas für nichts zu halten beziehungsweise ihm keinen Wert oder kein Gewicht beizumessen. Die gewählte Form bewahrt die zugespitzte Aussage.
- source_word: τοὺς σὺν αὐτῷ
  choice: seine Begleiter
  rationale: Wörtlich „die mit ihm [waren]“; „seine Begleiter“ ist eine natürliche, nicht weiter spezifizierende deutsche Wiedergabe.
theological_decisions:
- issue: Bedeutungsumfang von ψυχή
  choice: innere Haltung
  alternative: Seele; Mut; Geist
  rationale: „Seele“ wäre formal möglich, kann im Deutschen jedoch eine spezifische anthropologische Lehre nahelegen, die der Kontext nicht verlangt. „Mut“ wäre kontextuell treffend, verengt aber das breitere ψυχή. „Geist“ könnte mit πνεῦμα verwechselt werden. „Innere Haltung“ wahrt die kontextuelle Bedeutung ohne unnötige dogmatische Festlegung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau folgt dem griechischen Folgesatz, bleibt aber eigenständig verständlich. „Für nichts achten“ ist leicht gehoben und entspricht dem feierlich-historischen Erzählregister.
