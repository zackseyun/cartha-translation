  text: And after he had urged her much[a], she agreed to persuade her son.
translation:
  language: de
  text: Nachdem er ihr eindringlich zugeredet hatte,[a] erklärte sie sich bereit, ihren Sohn zu überzeugen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Nachdem er lange auf sie eingeredet hatte, verpflichtete sie sich, ihren Sohn zu überzeugen.«'
    reason: Lexikalische Alternativen für πολλὰ παραινέσαντος und ἐπεδέξατο; der griechische Wortlaut kann sowohl das Ausmaß beziehungsweise die Dauer als auch die Übernahme des Vorhabens hervorheben.
lexical_decisions:
- source_word: πολλὰ
  choice: lange
  rationale: Der adverbiale Akkusativ bezeichnet hier das Ausmaß beziehungsweise die Dauer des Einwirkens. »Lange« gibt dies im Deutschen natürlich wieder, ohne eine genaue Wiederholungszahl festzulegen.
- source_word: παραινέσαντος
  choice: auf sie eingeredet hatte
  rationale: Das Partizip steht in einem Genitivus absolutus. Im Kontext bezeichnet παραινέω ein nachdrückliches Zureden zur Mutter; »auf sie eingeredet« trifft diesen situationsbezogenen Nachdruck besser als das mildere »ihr geraten«.
- source_word: ἐπεδέξατο
  choice: erklärte sie sich bereit
  rationale: Die mediale Form bezeichnet die Annahme beziehungsweise Übernahme des verlangten Vorhabens. »Erklärte sich bereit« ist idiomatisch und bewahrt die Nuance des Einwilligens und Sich-Verpflichtens.
- source_word: πεῖσειν
  choice: zu überzeugen
  rationale: Der Futurinfinitiv von πείθω bezeichnet das beabsichtigte Einwirken auf den Sohn. »Überzeugen« ist hier eine direkte, natürliche Wiedergabe; ob dies gelingt, wird nicht vorweggenommen.
- source_word: τὸν υἱόν
  choice: ihren Sohn
  rationale: 'Der griechische Artikel wird im Deutschen kontextgemäß durch das Possessivpronomen wiedergegeben: Gemeint ist der Sohn der Mutter.'
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz folgt der griechischen zeitlichen Konstruktion natürlich; das ausdrückliche Objekt »sie« wird aus dem unmittelbaren Erzählzusammenhang ergänzt. Der Fußnotenmarker steht unmittelbar nach dem Ausdruck, auf den sich die Alternative bezieht.
