base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/007/028.yaml
  text: I beg you[a], child, look at heaven and earth and see everything in them, and know that God made them not out of existing things, and that the human race comes to be in the same way.
translation:
  language: de
  text: 'Ich bitte dich, mein Kind: Blicke zum Himmel und auf die Erde, sieh alles, was in ihnen ist, und erkenne, dass Gott all dies nicht aus bereits Vorhandenem[a] gemacht hat und dass auch das Menschengeschlecht so entsteht.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „nicht aus Seiendem“. Deutend wird die Wendung auch mit „aus nichts“ wiedergegeben.'
    reason: Die Fußnote bewahrt die wörtliche griechische Ausdrucksweise und kennzeichnet „aus nichts“ ausdrücklich als interpretierende Kurzformel.
lexical_decisions:
- source_word: ἀξιῶ σε
  choice: Ich bitte dich
  rationale: Die Wendung drückt hier die eindringliche Bitte der Mutter aus. „Ich bitte dich“ ist im Deutschen ernst und natürlich, ohne die mögliche Bedeutung unnötig zu steigern.
- source_word: τέκνον
  choice: mein Kind
  rationale: Das griechische Wort bezeichnet das Kind beziehungsweise den Nachkommen. Die Anrede „mein Kind“ ist im Deutschen natürlich und bewahrt die innige, geschlechtsneutrale Form des Ausgangstextes, obwohl der Angesprochene ein Sohn ist.
- source_word: ἀναβλέψαντα εἰς τὸν οὐρανὸν καὶ τὴν γῆν
  choice: Blicke zum Himmel und auf die Erde
  rationale: „Blicke“ gibt die auffordernde Kraft des Partizips im Zusammenhang wieder. Die unterschiedlichen deutschen Präpositionen sorgen bei dem kosmischen Paar „Himmel und Erde“ für natürliche Sprache und lassen den beim Himmel anklingenden Aufwärtsblick erkennen.
- source_word: τὰ ἐν αὐτοῖς πάντα
  choice: alles, was in ihnen ist
  rationale: Diese Formulierung gibt die umfassende Bedeutung von πάντα klar wieder und bezieht das Pronomen wie im Griechischen auf Himmel und Erde.
- source_word: γνῶναι
  choice: erkenne
  rationale: „Erkenne“ bezeichnet hier das durch Betrachten und Sehen gewonnene Wissen und passt idiomatisch zur Aufforderung.
- source_word: οὐκ ἐξ ὄντων
  choice: nicht aus bereits Vorhandenem
  rationale: Die Formulierung bewahrt die Aussage, dass Gottes Schaffen nicht von schon existierendem Material ausging, ohne die griechischen Worte im Haupttext durch die spätere Kurzformel „aus nichts“ zu ersetzen.
- source_word: ἐποίησεν
  choice: gemacht hat
  rationale: Das gewöhnliche Verb ποιέω bedeutet „machen“. Diese Wiedergabe bleibt quellennah; der Schöpfungsbezug ergibt sich eindeutig aus dem Zusammenhang.
- source_word: τὸ τῶν ἀνθρώπων γένος
  choice: das Menschengeschlecht
  rationale: Die kollektive Bezeichnung meint die Menschheit als Gattung. „Menschengeschlecht“ entspricht dieser Bedeutung in würdigem, allgemein verständlichem Deutsch.
- source_word: οὕτω γίγνεται
  choice: so entsteht
  rationale: γίγνεται bezeichnet das Werden oder Ins-Dasein-Kommen. Das anaphorische „so“ bewahrt die knappe Form des Griechischen und verweist auf die zuvor beschriebene Weise.
theological_decisions:
- issue: Ob οὐκ ἐξ ὄντων mit der theologischen Kurzformel „aus nichts“ wiederzugeben ist
  choice: nicht aus bereits Vorhandenem
  alternative: aus nichts
  rationale: Der griechische Text sagt wörtlich, dass Gott die Dinge „nicht aus Seiendem“ machte. Das weist auf Schöpfung ohne bereits vorhandenes Ausgangsmaterial hin, formuliert aber nicht unmittelbar die spätere Kurzformel. Der Haupttext bewahrt daher die Ausdrucksweise der Quelle; die geläufige Deutung steht in der Fußnote.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Anrede und die Folge von Aufforderungen bewahren die Eindringlichkeit der mütterlichen Ermahnung. Der Doppelpunkt strukturiert die längere Aussage lesefreundlich.
