  text: Therefore[a], for those who come down until the thirtieth of Xanthicus, there will be a right hand of assurance together with permission[b],
translation:
  language: de
  text: Für diejenigen also, die bis zum dreißigsten Tag des Xanthikos[a] hinabziehen, wird es eine verbindliche Zusicherung zusammen mit Erlaubnis[b] geben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Xanthikos ist der Name eines makedonischen Monats, der in hellenistischer Zeit verwendet wurde.
    reason: cultural_note
  - marker: b
    text: 'Wörtlich: „eine rechte Hand zusammen mit Erlaubnis“. „Rechte Hand“ bezeichnet hier idiomatisch ein verbindliches Treuepfand oder eine Zusicherung. Das griechische Wort für „Erlaubnis“ kann je nach Zusammenhang auch Freiheit oder die Erlaubnis zum ungehinderten Gehen bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῖς ... καταπορευομένοις
  choice: wer ... zurückkehrt
  rationale: Das substantivierte Partizip bezeichnet eine abwärts beziehungsweise fort gerichtete Bewegung. Im Zusammenhang des Schreibens ist die Rückkehr gemeint; „zurückkehrt“ gibt dies in natürlichem Deutsch wieder, ohne ein Ziel hinzuzufügen.
- source_word: μέχρι τριακάδος Ξανθικοῦ
  choice: bis zum dreißigsten Tag des Xanthikos
  rationale: Die Wendung setzt eine Frist bis zum dreißigsten Tag des makedonischen Monats Xanthikos.
- source_word: ὑπάρξει
  choice: werden ... gewährt
  rationale: Die futurische Aussage bezeichnet hier das, was den Betreffenden zustehen wird. Die deutsche Passivform fügt sich natürlich in den amtlichen Kontext.
- source_word: δεξιὰ
  choice: ein Handschlag als Zusicherung
  rationale: Wörtlich steht „rechte Hand“. In diplomatischer und rechtlicher Sprache bezeichnet die gereichte rechte Hand eine verbindliche Zusicherung; die Übersetzung bewahrt sowohl das Bild als auch seine Funktion.
- source_word: μετὰ τῆς ἀδείας
  choice: und Straffreiheit
  rationale: ἄδεια kann Erlaubnis, Freiheit, Sicherheit oder Straflosigkeit bezeichnen. Im Zusammenhang einer fristgebundenen Rückkehr bezeichnet „Straffreiheit“ am ehesten die zugesicherte unbehelligte Rückkehr; die weitere Bedeutungsbreite wird in der Fußnote offengehalten.
