  rationale: Die Revision bewahrt die im Griechischen ausgedrückte, aber nicht näher erklärte Bewegungsrichtung mit „hinabziehen“, ohne eine Rückkehr zu behaupten. Sie gibt δεξιά idiomatisch als „verbindliche Zusicherung“ wieder und lässt die wörtliche Metapher in der Fußnote sichtbar. „Erlaubnis“ ist für ἄδεια die neutrale Grundbedeutung und vermeidet die unbelegte Einengung auf Straffreiheit. Die Konstruktion „wird es … geben“ entspricht dem unpersönlich-existenziellen ὑπάρξει.
