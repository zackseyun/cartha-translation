base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/011/031.yaml
  text: that the Jews may make use of their own provisions and laws[a], just as before[b]; and none of them shall in any way be harassed concerning the things done in ignorance.
translation:
  language: de
  text: dass die Juden wie zuvor ihre eigenen Vorräte[a] nutzen und ihre Gesetze befolgen dürfen; und keiner von ihnen soll hinsichtlich dessen, was aus Unwissenheit geschehen ist[b], in irgendeiner Weise behelligt werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort kann auch „Aufwendungen“, „Versorgung“ oder „übliche Speisen“ bedeuten. Es bezeichnet hier wahrscheinlich die eigenen praktischen Mittel beziehungsweise Regelungen der jüdischen Lebensweise; eine Beschränkung auf Lebensmittel ist nicht sicher.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „hinsichtlich der übersehenen beziehungsweise nicht erkannten Angelegenheiten“. Die griechische Wendung ist weit gefasst und kann sich auf Handlungen beziehen, die unbeabsichtigt oder ohne volle Kenntnis geschahen.'
    reason: alternative_reading
lexical_decisions:
- source_word: χρῆσθαι
  choice: verwenden und … leben dürfen
  rationale: Der Infinitiv bezeichnet die erteilte Erlaubnis. Da sich im Deutschen dasselbe Verb nicht natürlich sowohl mit Lebensmitteln als auch mit Gesetzen verbinden lässt, wird die gemeinsame griechische Verbform idiomatisch aufgelöst.
- source_word: δαπανήμασιν
  choice: Lebensmittel
  rationale: Das Wort kann Aufwendungen oder bereitgestellte Mittel bezeichnen; im Zusammenhang mit der den Juden wieder zugestandenen eigenen Lebensweise liegt die konkrete Bedeutung von Versorgung beziehungsweise Lebensmitteln nahe. Die weitere Bedeutungsbreite wird in einer Fußnote offengehalten.
- source_word: νόμοις
  choice: nach ihren Gesetzen leben
  rationale: νόμοις behält den formalen und religiös-rechtlichen Sinn von „Gesetzen“. Die deutsche Formulierung gibt den Gebrauch beziehungsweise die Befolgung dieser Gesetze natürlich wieder.
- source_word: καθὰ καὶ τὸ πρότερον
  choice: wie zuvor
  rationale: Die knappe Wendung bezeichnet die Wiederherstellung der früheren Praxis.
- source_word: παρενοχληθήσεται
  choice: soll … behelligt werden
  rationale: Das Futur Passiv beschreibt störende oder bedrängende Einmischung. „Behelligt“ ist verständlich, würdig und lässt deren genaue amtliche oder gesellschaftliche Form offen.
- source_word: περὶ τῶν ἠγνοημένων
  choice: wegen dessen, was aus Unwissenheit geschehen ist
  rationale: Die Formulierung bewahrt den unbestimmten Umfang des substantivierten Partizips und legt weder bestimmte Vergehen noch die Person fest, deren Unwissenheit gemeint ist.
theological_decisions:
- issue: Reichweite der schutz- beziehungsweise amnestieartigen Klausel περὶ τῶν ἠγνοημένων
  choice: Allgemeiner Schutz vor Behelligung wegen dessen, was aus Unwissenheit geschehen ist
  alternative: Schutz wegen zuvor übersehener Angelegenheiten oder wegen unbeabsichtigter Verstöße gegen jüdisches beziehungsweise königliches Recht
  rationale: Der griechische Text bestimmt weder die betreffenden Handlungen noch den Träger der Unwissenheit genauer. Die Übersetzung lässt diese rechtlich und theologisch bedeutsame Offenheit bestehen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die im Griechischen mögliche Verbindung eines einzigen Verbs mit Lebensmitteln und Gesetzen wird zur natürlichen deutschen Formulierung „Lebensmittel verwenden und nach ihren Gesetzen leben“ entfaltet; die sachliche und rechtliche Unbestimmtheit der Schlussklausel bleibt erhalten.
