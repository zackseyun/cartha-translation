base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/011/027.yaml
  text: 'And to the nation the king’s letter was as follows: “King Antiochus to the council of elders of the Jews and to the other Jews[b][a], greetings.”'
translation:
  language: de
  text: 'An das Volk aber lautete der Brief des Königs folgendermaßen: »König Antiochos entbietet dem Ältestenrat der Juden[a] und den übrigen Juden[b] seinen Gruß.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort bezeichnet ein offizielles Gremium von Ältesten; auch »Senat der Juden« wäre möglich.
    reason: cultural_note
  - marker: b
    text: 'Oder: »den anderen Juden«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πρὸς δὲ τὸ ἔθνος
  choice: An das Volk aber
  rationale: πρός mit Akkusativ bezeichnet hier den Adressaten des Briefes. »Volk« gibt ἔθνος in diesem jüdischen Zusammenhang natürlich wieder; »aber« bewahrt den fortführend-kontrastierenden Anschluss von δέ.
- source_word: ἡ τοῦ βασιλέως ἐπιστολὴ τοιαύδε ἦν
  choice: lautete der Brief des Königs folgendermaßen
  rationale: Die deutsche Dokumentenformel gibt τοιαύδε ἦν idiomatisch wieder und bewahrt die einfache Genitivverbindung »des Königs«.
- source_word: Βασιλεὺς Ἀντίοχος
  choice: König Antiochos
  rationale: Die im Griechischen vorangestellte Amtsbezeichnung bleibt erhalten; »Antiochos« folgt der geläufigen deutschen Wiedergabe der griechischen Namensform.
- source_word: τῇ γερουσίᾳ τῶν Ἰουδαίων
  choice: dem Ältestenrat der Juden
  rationale: γερουσία bezeichnet ein offizielles Gremium von Ältesten. »Ältestenrat« ist verständlich und vermeidet die modernen politischen Nebenbedeutungen von »Senat«.
- source_word: τοῖς ἄλλοις Ἰουδαίοις
  choice: den übrigen Juden
  rationale: ἄλλοις unterscheidet die weitere jüdische Bevölkerung vom zuvor genannten Ältestenrat. »Übrigen« ist hier im Deutschen natürlicher als »anderen«.
- source_word: χαίρειν
  choice: entbietet … seinen Gruß
  rationale: χαίρειν ist die übliche griechische Briefformel. Die deutsche Formulierung macht ihren syntaktischen Bezug auf König Antiochos und beide Empfängergruppen klar, ohne sie wörtlich als Aufforderung »Freut euch« misszuverstehen.
