  text: not at all taking into account the might of God[b][a], but puffed up by the tens of thousands of foot soldiers and the thousands of horsemen and the eighty elephants.
translation:
  language: de
  text: Er berücksichtigte die Macht Gottes überhaupt nicht[a], sondern war angesichts der Zehntausende an Fußsoldaten[b], der Tausende an Reitern und der achtzig Elefanten überheblich.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Er zog die Macht Gottes überhaupt nicht in Betracht.'
    reason: lexical_alternative
  - marker: b
    text: Griechisch „Myriaden von Fußsoldaten“; gemeint sein können wörtlich Zehntausende oder allgemeiner eine sehr große Zahl.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδάμως
  choice: überhaupt nicht
  rationale: Die Formulierung gibt die nachdrückliche Verneinung idiomatisch und mit voller Stärke wieder.
- source_word: ἐπιλογιζόμενος
  choice: rechnete … mit
  rationale: Das Verb bezeichnet ein bedachtes Erwägen oder Einberechnen; „mit etwas rechnen“ passt zugleich zum militärischen Zusammenhang.
- source_word: τὸ τοῦ θεοῦ κράτος
  choice: die Macht Gottes
  rationale: κράτος bezeichnet hier wirksame Stärke beziehungsweise Macht im Gegensatz zu den menschlichen Streitkräften. „Macht“ ist im modernen Deutschen natürlich und lässt die genaue Nuance offen.
- source_word: πεφρονηματισμένος
  choice: war aufgebläht vor Stolz
  rationale: Das Perfektpartizip beschreibt einen anhaltenden Zustand übersteigerter Selbstgewissheit. Die Wendung bewahrt das Bild stolzer Aufgeblasenheit.
- source_word: μυριάσιν τῶν πεζῶν
  choice: die Zehntausende Fußsoldaten
  rationale: μυριάδες kann wörtlich Zehntausende oder allgemeiner eine sehr große Zahl bezeichnen; die Wiedergabe erhält die zahlenmäßige Färbung und wird durch eine Fußnote abgesichert.
- source_word: χιλιάσι τῶν ἱππέων
  choice: die Tausende Reiter
  rationale: Die konkrete Wiedergabe entspricht der parallelen militärischen Aufzählung und bewahrt den Plural der Zahlbezeichnung.
- source_word: ἐλέφασιν τοῖς ὀγδοήκοντα
  choice: die achtzig Elefanten
  rationale: Die genaue Zahl und die Gliederung der Aufzählung werden direkt wiedergegeben.
theological_decisions:
- issue: Wiedergabe von τὸ τοῦ θεοῦ κράτος im Gegensatz zu militärischer Stärke
  choice: die Macht Gottes
  alternative: die Stärke Gottes; Gottes Herrschaft
  rationale: „Macht“ bezeichnet Gottes wirksame Überlegenheit, ohne κράτος vorschnell als besonderen Lehrbegriff für Herrschaft festzulegen. Der Kontrast zwischen göttlicher Macht und menschlicher Rüstung bleibt erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der im Griechischen partizipiale Anschluss wird für einen eigenständig lesbaren Vers als vollständiger Satz mit „Er“ wiedergegeben. Die stolze Selbstüberschätzung bleibt deutlich, ohne zusätzliche Motive einzutragen.
