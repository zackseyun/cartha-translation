lexical_decisions:
- source_word: Μετʼ ὀλίγον δὲ παντελῶς χρονίσκον
  choice: Schon nach ganz kurzer Zeit
  rationale: Die Verbindung von μετʼ ὀλίγον mit dem durch παντελῶς verstärkten Diminutiv χρονίσκον hebt die Kürze des Zeitraums nachdrücklich hervor. Die deutsche Formulierung gibt dies natürlich und knapp wieder.
- source_word: ἐπίτροπος τοῦ Βασιλέως
  choice: der Vormund des Königs
  rationale: ἐπίτροπος bezeichnet hier den mit der Fürsorge und Vertretung des jungen Königs Betrauten. „Vormund“ wahrt den Grundsinn, ohne Lysias’ Amt vorschnell als verfassungsrechtlich genau bestimmten Regententitel festzulegen.
- source_word: συγγενής
  choice: sein Verwandter
  rationale: Die Wiedergabe ist im heutigen Deutsch klar und lässt offen, ob neben einer tatsächlichen Verwandtschaft auch ein höfischer Rangtitel mitschwingt.
- source_word: ἐπὶ τῶν πραγμάτων
  choice: der Leiter der Staatsgeschäfte
  rationale: Die Wendung bezeichnet Lysias’ amtliche Verantwortung für die öffentlichen beziehungsweise königlichen Angelegenheiten. „Staatsgeschäfte“ macht den politischen Kontext deutlich, ohne einen spezifischeren Amtstitel einzutragen.
- source_word: λίαν βαρέως φέρων ἐπὶ τοῖς γεγονόσι
  choice: er nahm das Geschehene sehr schwer
  rationale: βαρέως φέρειν bezeichnet eine starke negative Reaktion, die Betrübnis, Unmut oder Empörung einschließen kann. Die deutsche Wendung erhält diese gewisse emotionale Offenheit, statt ausschließlich Trauer oder Zorn festzulegen.
