  text: But after a very short time[a], Lysias, the king’s guardian and kinsman and administrator of affairs, taking the events very hard[c][b],
translation:
  language: de
  text: Schon nach ganz kurzer Zeit nahm Lysias, der Vormund des Königs, sein Verwandter und Leiter der Staatsgeschäfte, das Geschehene sehr schwer[b],
