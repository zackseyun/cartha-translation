  register: Modernes, würdiges Standarddeutsch. Die höfisch-amtliche Aufzählung bleibt erhalten. Das Schlusskomma signalisiert bewusst, dass der griechische Satz in Vers 2 weitergeht; die eingeschobene finite Formulierung „er nahm“ dient der natürlichen deutschen Lesbarkeit, ohne den syntaktischen Fortgang als abgeschlossen darzustellen.
