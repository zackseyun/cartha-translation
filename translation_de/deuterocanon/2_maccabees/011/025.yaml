base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/011/025.yaml
  text: Therefore[a], since we also choose that this nation should be free from disturbance, we decide that the temple should be restored to them, and that they should live according to the customs of their ancestors.
translation:
  language: de
  text: Da wir also wünschen, dass auch dieses Volk von Unruhen verschont bleibt, beschließen wir, dass ihnen der Tempel wiederhergestellt wird und sie ihr gemeinschaftliches Leben nach den Bräuchen aus der Zeit ihrer Vorfahren gestalten sollen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und nach den Bräuchen ihrer Vorfahren leben sollen.“'
    reason: Die kürzere Wiedergabe versteht πολιτεύεσθαι allgemeiner als „leben“ und die folgende Wendung primär als Hinweis auf die Bräuche der Vorfahren statt auf die Bräuche aus ihrer Zeit.
lexical_decisions:
- source_word: αἱρούμενοι
  choice: Da wir … wollen
  rationale: Das mediale Partizip bezeichnet hier die gewählte beziehungsweise bevorzugte politische Absicht. Die kausale Wiedergabe mit „da“ bildet seinen syntaktischen Bezug zu „beschließen wir“ in natürlichem Deutsch ab.
- source_word: ἐκτὸς ταραχῆς
  choice: von Unruhen verschont
  rationale: Die Wendung meint Freiheit von Aufruhr oder öffentlicher Unordnung. „Von Unruhen verschont“ wahrt den politisch-administrativen Sinn und klingt im Deutschen idiomatisch.
- source_word: ἔθνος
  choice: Volk
  rationale: Gemeint ist das jüdische Volk als unterscheidbare Gemeinschaft. „Volk“ gibt dies im Deutschen natürlicher wieder als „Nation“, ohne einen modernen Nationalstaat anzudeuten.
- source_word: κρίνομεν
  choice: wir beschließen
  rationale: Das Verb bezeichnet ein Entscheiden oder Bestimmen. Im königlichen Verwaltungsschreiben trifft „beschließen“ den verbindlichen Charakter, ohne einen besonderen technischen Erlassbegriff einzuführen.
- source_word: τὸ ἱερόν
  choice: der Tempel
  rationale: Der Ausdruck bezeichnet in diesem Zusammenhang den Jerusalemer Tempel beziehungsweise Tempelbezirk; „Tempel“ ist die klare, geläufige Wiedergabe.
- source_word: ἀποκατασταθῆναι
  choice: wiederhergestellt wird
  rationale: Der passive Infinitiv bezeichnet die Wiederherstellung eines früheren Zustands oder Status. Die passive deutsche Form bewahrt diese Aussage.
- source_word: πολιτεύεσθαι
  choice: ihr gemeinschaftliches Leben … gestalten dürfen
  rationale: Das Verb umfasst die Lebensführung als geordnete Gemeinschaft und kann staatsbürgerliche Untertöne tragen. Die Formulierung hält diesen gemeinschaftlichen Sinn fest, ohne daraus politische Selbstständigkeit abzuleiten.
- source_word: κατὰ τὰ ἐπὶ τῶν προγόνων αὐτῶν ἔθη
  choice: nach den Bräuchen aus der Zeit ihrer Vorfahren
  rationale: Die Formulierung kann sowohl auf die Bräuche der Vorfahren als auch zeitlich auf die unter ihnen geltenden Bräuche weisen. „Aus der Zeit ihrer Vorfahren“ bewahrt die zeitliche Nuance des griechischen Ausdrucks.
theological_decisions:
- issue: Reichweite von πολιτεύεσθαι im Verhältnis zu jüdischem Gesetz und Brauch
  choice: Als Gestaltung des gemeinschaftlichen Lebens nach den überlieferten Bräuchen wiedergegeben
  alternative: sich nach den Bräuchen ihrer Vorfahren selbst regieren
  rationale: Der Zusammenhang behandelt eine königliche Gewährung, die Tempel und überlieferte Lebensordnung betrifft. Obwohl das Verb staatsbürgerliche Obertöne haben kann, sagt der Text nicht eindeutig, dass politische Unabhängigkeit oder volle Selbstregierung eingeräumt wird.
translation_notes:
  register: Modernes, würdiges Standarddeutsch in einem königlich-administrativen Ton. Der Satzbau bleibt dem griechischen Begründungs- und Beschlussgefüge nahe, ist aber für heutige Leser flüssig. Die gemeinschaftliche Dimension von πολιτεύεσθαι bleibt im Haupttext sichtbar; die allgemeinere Lesart steht in der Fußnote.
