base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/011/020.yaml
  text: But concerning these matters in detail[b][a], I have given orders that both these men and those from me should speak with you.
translation:
  language: de
  text: Was aber diese Angelegenheiten im Einzelnen betrifft, so habe ich sowohl diese Männer als auch meine Vertreter[a] angewiesen, mit euch darüber zu sprechen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »die von mir«; vermutlich sind eigene Beauftragte oder Vertreter des Absenders gemeint.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »sich mit euch darüber zu beraten« beziehungsweise »darüber mit euch zu verhandeln«. Das griechische Verb kann eine Besprechung oder Verhandlung bezeichnen, nicht nur ein Sprechen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπὲρ δὲ τούτων
  choice: Was aber diese Angelegenheiten betrifft
  rationale: ὑπέρ mit Genitiv bedeutet hier in amtlich-brieflichem Zusammenhang »über/betreffs«. δέ markiert einen leichten Übergang und wird mit »aber« wiedergegeben; τούτων verweist auf die zuvor genannten Angelegenheiten.
- source_word: κατὰ μέρος
  choice: im Einzelnen
  rationale: Die Wendung bezeichnet eine Behandlung nach einzelnen Punkten beziehungsweise im Detail. »Im Einzelnen« ist im Deutschen natürlich und entspricht dem amtlichen Ton.
- source_word: ἐντέταλμαι
  choice: habe ich … angewiesen
  rationale: Das Perfekt von ἐντέλλομαι bezeichnet eine erteilte, weiterhin geltende Weisung. »Angewiesen« bewahrt den verbindlichen Charakter, ohne unnötig scharf zu klingen.
- source_word: τούτους τε καὶ
  choice: sowohl diese Männer als auch
  rationale: Die Verbindung τε … καί koordiniert zwei Personengruppen. »Sowohl … als auch« bildet diese Struktur klar ab; »diese Männer« verweist im Zusammenhang auf die bereits genannten Gesandten.
- source_word: τοὺς παρʼ ἐμοῦ
  choice: meine Vertreter
  rationale: Wörtlich steht »die von mir«. Gemeint sind wahrscheinlich eigene Beauftragte oder Repräsentanten des Absenders. »Meine Vertreter« ist idiomatisches Deutsch; eine Fußnote hält die knappere, weniger bestimmte Formulierung des Griechischen fest.
- source_word: διαλεχθῆναι ὑμῖν
  choice: mit euch darüber zu sprechen
  rationale: διαλέγομαι kann ein Gespräch, eine Beratung oder eine Verhandlung bezeichnen. »Mit euch darüber zu sprechen« wahrt die Bedeutungsbreite; »darüber« stellt im Deutschen den natürlichen Rückbezug auf die Angelegenheiten her.
theological_decisions: []
translation_notes:
