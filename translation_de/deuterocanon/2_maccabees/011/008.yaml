base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/011/008.yaml
  text: And there[a], when they were near Jerusalem, a horseman appeared going before them[b], clothed in white and brandishing golden armor.
translation:
  language: de
  text: Als sie nun dort nahe bei Jerusalem waren, erschien ein Reiter[b], der vor ihnen herzog[a], in einem weißen Gewand und eine goldene Vollrüstung schwingend.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der ihnen vorausging“. Das griechische Partizip kann lediglich besagen, dass er sich vor ihnen befand beziehungsweise vor ihnen herging, ohne ausdrücklich eine Befehls- oder Führungsstellung zu bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Der Text bezeichnet den Reiter nicht ausdrücklich näher. Die Schilderung lässt an einen himmlischen Beschützer denken, ohne ihn ausdrücklich als solchen zu benennen.
    reason: cultural_note
lexical_decisions:
- source_word: αὐτόθι
  choice: dort
  rationale: Das Ortsadverb verweist auf den zuvor genannten Ort und wird daher räumlich, nicht vorwiegend zeitlich, wiedergegeben.
- source_word: πρὸς τοῖς Ἱεροσολύμοις
  choice: nahe bei Jerusalem
  rationale: πρός mit dem Dativ bezeichnet hier räumliche Nähe; die Formulierung gibt die Umgebung der Stadt natürlich wieder.
- source_word: ὄντων
  choice: als sie … waren
  rationale: Der Genitivus absolutus mit erschlossenem Subjekt wird als natürlicher deutscher Temporalsatz wiedergegeben.
- source_word: ἐφάνη
  choice: erschien
  rationale: Die Wiedergabe bezeichnet das Sichtbarwerden der Gestalt, ohne deren Wesen näher festzulegen.
- source_word: προηγούμενος αὐτῶν
  choice: der vor ihnen herzog
  rationale: Die Formulierung bewahrt das Bild einer Bewegung vor der Gruppe, ohne ausdrücklich eine militärische Führungsfunktion zu behaupten.
- source_word: ἔφιππος
  choice: ein Reiter
  rationale: Das substantivisch gebrauchte Adjektiv bezeichnet hier knapp und verständlich eine berittene Gestalt.
- source_word: ἐν λευκῇ ἐσθῆτι
  choice: in einem weißen Gewand
  rationale: Die konkrete Gewandbezeichnung erhält die auffällige weiße Kleidung und den würdevollen Erzählton.
- source_word: πανοπλίαν χρυσῆν
  choice: eine goldene Vollrüstung
  rationale: πανοπλία bezeichnet die vollständige Rüstung beziehungsweise Waffenausstattung; „Vollrüstung“ wahrt diesen Umfang genauer als bloß „Rüstung“.
- source_word: κραδαίνων
  choice: schwingend
  rationale: Das Partizip beschreibt eine kräftige, demonstrative Bewegung; „schwingend“ erhält das ungewöhnliche Bild, dass die Vollrüstung selbst grammatisch das bewegte Objekt ist.
theological_decisions:
- issue: Identität des berittenen Erscheinenden
  choice: Die Gestalt wird lediglich als erscheinender Reiter beschrieben.
  alternative: ein Engel oder ein von Gott gesandter himmlischer Krieger
  rationale: Der griechische Text schildert die sichtbare Gestalt, identifiziert sie jedoch nicht ausdrücklich. Die Übersetzung lässt daher die naheliegende Deutung als himmlischen Beschützer offen, ohne sie in den Haupttext einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau folgt dem griechischen Erscheinungsbericht, bleibt aber gut verständlich. Das ungewöhnliche Bild vom Schwingen einer Vollrüstung wird nicht erklärend geglättet, da der griechische Wortlaut gerade πανοπλίαν als Objekt von κραδαίνων setzt.
