  source_fidelity: Die Satzglieder und die beiden Aussagen werden im Wesentlichen zutreffend wiedergegeben. Allerdings hat διεσάφησα im Griechischen kein ausdrücklich genanntes indirektes Objekt. Das ergänzte „ihm“ kann zwar aus dem Kontext auf den König bezogen werden, verschiebt die Satzstruktur jedoch dahin, dass der König sowohl Empfänger der Darlegung als auch derjenige ist, dem etwas vorgelegt werden soll. Eine objektbezogene Wiedergabe wahrt den griechischen Wortlaut genauer.
  naturalness: Die Übersetzung ist ansonsten klares, modernes Standarddeutsch mit angemessen sachlich-administrativem Register. „Klargestellt“ ist hier natürlich und lässt sich ohne die ergänzende, potenziell irreführende Bezugnahme „ihm“ verwenden.
  terminology: „Dem König vorgelegt“, „möglich“ und „zugestanden“ treffen den administrativen Kontext und lassen die semantische Offenheit von ἐνδεχόμενα und συνεχώρησεν bestehen. Die Fußnote bietet vertretbare lexikalische Alternativen.
