  yaml_path: translation/deuterocanon/2_maccabees/011/018.yaml
  text: So then[a], whatever had to be presented also to the king I made clear, and whatever was possible he granted.
translation:
  language: de
  text: Was also dem König vorgelegt werden musste, habe ich klargestellt; und was möglich war, hat er zugestanden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und was durchführbar war, hat er zugestanden.“ Das griechische ἐνδεχόμενα kann das unter den Umständen Mögliche oder Durchführbare bezeichnen; συνεχώρησεν kann „gewähren“, „zugestehen“ oder „erlauben“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅσα μὲν οὖν
  choice: Was also
  rationale: „Also“ gibt die folgernde und zugleich überleitende Funktion von μὲν οὖν in natürlichem modernem Deutsch wieder.
- source_word: ἔδει
  choice: musste
  rationale: Das unpersönliche ἔδει bezeichnet hier eine Notwendigkeit; „musste“ passt idiomatisch zum rückblickenden Bericht.
- source_word: καὶ τῷ βασιλεῖ
  choice: auch dem König
  rationale: „Auch“ bewahrt καί und macht deutlich, dass die Angelegenheiten zusätzlich dem König vorgelegt werden mussten.
- source_word: προσενεχθῆναι
  choice: vorgelegt werden
  rationale: Im administrativen Zusammenhang bezeichnet das Verb das Vorbringen einer Sache vor einer Autorität; „vorlegen“ ist präzise und natürlich.
- source_word: διεσάφησα
  choice: habe ich ihm erklärt
  rationale: Das Verb bezeichnet ein Klarstellen oder ausführliches Erklären. Das im Deutschen ergänzte „ihm“ identifiziert den König als naheliegenden Adressaten, ohne den Sachgehalt zu verändern.
- source_word: ἃ δὲ ἦν ἐνδεχόμενα
  choice: was möglich war
  rationale: ἐνδεχόμενα bezeichnet das unter den Umständen Mögliche oder Durchführbare, ohne festzulegen, ob praktische oder rechtliche Möglichkeit gemeint ist.
- source_word: συνεχώρησεν
  choice: hat er gewährt
  rationale: Im Kontext von Bitten und königlichen Entscheidungen bedeutet das Verb, etwas zuzugestehen, zu erlauben oder zu gewähren; „gewährt“ passt zum politisch-administrativen Zusammenhang.
