base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/011/034.yaml
  text: 'The Romans also sent them a letter[a], worded as follows: “Quintus Memmius and Titus Manius, elders of the Romans, to the people of the Jews, greetings.”'
translation:
  language: de
  text: 'Auch die Römer schickten ihnen einen Brief, der folgendermaßen lautete: »Quintus Memmius und Titus Manius, Älteste der Römer[a], grüßen das jüdische Volk.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »römische Älteste«; dem Zusammenhang nach möglicherweise: »Gesandte der Römer«. Das griechische Wort bedeutet wörtlich »Älteste«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐπέμψαν δὲ καὶ οἱ Ῥωμαῖοι
  choice: Auch die Römer schickten
  rationale: Gibt den Aorist von πέμπω schlicht als »schickten« wieder und bewahrt καί als »auch«; δέ markiert hier lediglich den Fortgang und braucht im Deutschen keine zusätzliche Konjunktion.
- source_word: πρὸς αὐτοὺς ἐπιστολήν
  choice: ihnen einen Brief
  rationale: Die deutsche Konstruktion mit Dativobjekt gibt πρὸς αὐτούς natürlich wieder; »Brief« ist die gewöhnliche Bedeutung von ἐπιστολή.
- source_word: ἔχουσαν οὕτως
  choice: der folgendermaßen lautete
  rationale: Natürliche deutsche Wiedergabe der dokumentarischen Einleitungsformel, ohne den Sinn des Partizips zu erweitern.
- source_word: Κόιντος Μέμμιος, Τίτος Μάνιος
  choice: Quintus Memmius und Titus Manius
  rationale: Die Namen werden nach geläufiger deutscher beziehungsweise lateinischer Form wiedergegeben; das im Griechischen asyndetische Nebeneinander wird zur Klarheit mit »und« verbunden.
- source_word: πρεσβυταὶ Ῥωμαίων
  choice: Älteste der Römer
  rationale: Bewahrt die wörtliche Amts- beziehungsweise Ehrenbezeichnung πρεσβυταί und vermeidet, die Männer im Haupttext eindeutiger als Gesandte zu bestimmen, als es der Ausdruck selbst erlaubt.
- source_word: τῷ δήμῳ τῶν Ἰουδαίων
  choice: das jüdische Volk
  rationale: δήμος bezeichnet hier das Volk als politische Gemeinschaft. »Das jüdische Volk« ist im modernen Deutschen natürlich und entspricht dem griechischen Sinn, ohne das schwerfällige »Volk der Juden«.
- source_word: χαίρειν
  choice: grüßen
  rationale: Gibt die übliche briefliche Grußformel idiomatisch wieder und fügt sich grammatisch in den deutschen Absendervermerk ein.
theological_decisions: []
