base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/011/019.yaml
  text: If[a], then, you maintain your goodwill in these matters, I will also continue from now on to try to be the cause of good things for you.
translation:
  language: de
  text: Wenn ihr nun in diesen Angelegenheiten euer Wohlwollen bewahrt, werde auch ich mich künftig bemühen, Gutes zu bewirken.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »Ursache von Gutem zu werden«; gemeint sein kann auch, Wohltaten oder Vorteile herbeizuführen.'
    reason: Die ungewöhnliche Konstruktion mit αἰτιαῖος betont die ursächliche Verantwortung, während ἀγαθῶν inhaltlich offenbleibt.
lexical_decisions:
- source_word: συντηρήσητε
  choice: bewahrt
  rationale: Das Verb bezeichnet das fortdauernde Erhalten einer bereits vorhandenen Haltung; »bewahrt« gibt diesen Sinn knapp und natürlich wieder.
- source_word: εὔνοιαν
  choice: Wohlwollen
  rationale: Das Substantiv bezeichnet eine wohlwollende, günstige Haltung und passt zum diplomatischen Ton des Schreibens.
- source_word: εἰς τὰ πράγματα
  choice: in diesen Angelegenheiten
  rationale: Die Wendung verweist allgemein auf die gegenwärtigen Verhältnisse oder zur Debatte stehenden Angelegenheiten, ohne sie näher festzulegen.
- source_word: εἰς τὸ λοιπόν
  choice: künftig
  rationale: Die Zeitangabe richtet den Blick auf die folgende Zeit; »künftig« ist in einem formellen Schreiben natürlich und präzise.
- source_word: πειράσομαι
  choice: werde … mich bemühen
  rationale: Das Futur bezeichnet eine beabsichtigte Anstrengung, nicht die Gewährleistung eines Ergebnisses.
- source_word: αἰτιαῖος … γίνεσθαι
  choice: zu bewirken
  rationale: Die Konstruktion bezeichnet das ursächliche Herbeiführen von etwas. »Bewirken« erhält den kausalen Sinn in idiomatischem Deutsch.
- source_word: ἀγαθῶν
  choice: Gutes
  rationale: Der substantivierte Plural bleibt inhaltlich weit und kann Wohltaten, Vorteile oder gute Folgen umfassen; »Gutes« wahrt diese Offenheit.
