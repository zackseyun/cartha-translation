base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/011/037.yaml
  text: Therefore hurry[a], and send some men[b], so that we too may learn what your intention is.
translation:
  language: de
  text: Darum beeilt euch und schickt einige Leute[a], damit auch wir erfahren, welche Absicht ihr habt.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „einige Personen“ oder „einige Abgesandte“. Das griechische indefinite Pronomen τινας bestimmt die Gruppe nicht näher.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „welcher Meinung ihr seid“. Das griechische γνώμη kann hier Meinung, Haltung, Entschluss oder Absicht bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διό
  choice: Darum
  rationale: Die folgernde Konjunktion verbindet die Aufforderung mit dem vorangehenden Schreiben; „Darum“ ist knapp, natürlich und bewahrt den logischen Anschluss.
- source_word: σπεύσατε
  choice: beeilt euch
  rationale: Der Aoristimperativ fordert zu unverzüglichem Handeln auf. „Beeilt euch“ gibt die Dringlichkeit in heutigem Deutsch ohne altertümlichen Ton wieder.
- source_word: πέμψατέ τινας
  choice: schickt einige Leute
  rationale: πέμψατε bedeutet „schickt“, während das indefinite τινας die betreffenden Personen nicht näher bestimmt. Im diplomatischen Zusammenhang sind vermutlich Abgesandte gemeint, doch die Übersetzung legt dies nicht ausdrücklich fest.
- source_word: ὅπως
  choice: damit
  rationale: ὅπως leitet hier einen Zwecksatz ein; „damit“ gibt diese Funktion idiomatisch wieder.
- source_word: καὶ ἡμεῖς
  choice: auch wir
  rationale: Das καί schließt die Sprecher betont ein; die Wortstellung „auch wir“ erhält diese Hervorhebung.
- source_word: ἐπιγνῶμεν
  choice: erfahren
  rationale: Der Aoristkonjunktiv von ἐπιγινώσκω bezeichnet hier das Erlangen verlässlicher Kenntnis. „Erfahren“ passt zum Zweck der erbetenen Gesandtschaft und ist natürlicher als „vollständig erkennen“.
- source_word: ὁποῖοί ἐστε γνώμης
  choice: welche Absicht ihr habt
  rationale: Die griechische Wendung fragt wörtlich nach der Art ihrer γνώμη, also ihrer Meinung, Haltung oder Absicht. Im Verhandlungskontext ist „welche Absicht ihr habt“ gut verständlich; eine Fußnote hält die weiter gefasste Bedeutung offen.
