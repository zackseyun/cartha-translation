  naturalness: Der offene Satzschluss mit Komma ist korrekt, da der Satz im folgenden Vers fortläuft. „Ihre eigene Lebensweise wählen“ ist verständlich, aber „bevorzugen“ ist im Deutschen in diesem Kontrast natürlicher. „Griechische Lebensformen“ ist idiomatischer als „griechische Lebensweisen“ und vermeidet die Wiederholung von „Lebensweise“.
