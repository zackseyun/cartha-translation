base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/011/024.yaml
  text: Having heard that the Jews did not approve of my father's change to Greek ways[a], but were choosing their own way of life and asking that their lawful customs be permitted to them,
translation:
  language: de
  text: Da wir gehört haben, dass die Juden der von meinem Vater vorgenommenen Umstellung auf griechische Lebensformen[a] nicht zustimmen, sondern ihre eigene Lebensweise bevorzugen und darum bitten, dass ihnen ihre gesetzlichen Vorschriften zugestanden werden,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „auf griechische Bräuche“. Der griechische Ausdruck bezeichnet hier die Hinwendung zu hellenistischen Lebensformen, nicht unbedingt nur den Gebrauch der griechischen Sprache.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκηκοότες
  choice: Da wir gehört haben
  rationale: Das Perfektpartizip nennt den Anlass für die königliche Reaktion. Die kausale Wiedergabe ist im Deutschen natürlich und bewahrt den formellen Briefstil sowie den pluralischen Sprecherbezug.
- source_word: μὴ συνεὐδοκοῦντας
  choice: nicht zustimmen
  rationale: συνευδοκέω bezeichnet Zustimmung oder Billigung. „Nicht zustimmen“ gibt die Haltung gegenüber der angeordneten Umstellung klar und idiomatisch wieder.
- source_word: τῇ τοῦ πατρὸς εἰς τὰ Ἑλληνικὰ μεταθέσει
  choice: der von meinem Vater betriebenen Umstellung auf griechische Lebensweisen
  rationale: μετάθεσις bezeichnet eine Veränderung oder Umstellung; εἰς τὰ Ἑλληνικά meint im Kontext die Hinwendung zu hellenistischen Lebensformen und nicht lediglich zur griechischen Sprache. „Betriebenen“ lässt erkennen, dass der Vater die Umstellung veranlasste, ohne ihren genauen politischen Umfang festzulegen.
- source_word: τὴν ἑαυτῶν ἀγωγήν
  choice: ihre eigene Lebensweise
  rationale: ἀγωγή kann Lebensführung, Lebensweise oder Verhalten bezeichnen. Hier steht die gemeinschaftlich-kulturelle Lebensordnung der Juden im Gegensatz zur Hellenisierung.
- source_word: αἱρετίζοντας
  choice: wählen
  rationale: Das Partizip bezeichnet eine bewusste Wahl oder Bevorzugung. „Wählen“ bewahrt diesen aktiven, willentlichen Sinn.
- source_word: ἀξιοῦν
  choice: darum bitten
  rationale: ἀξιόω hat hier den Sinn, etwas zu erbitten oder zu beantragen. Die Wiedergabe vermeidet sowohl Umgangssprache als auch die Überbetonung eines Rechtsanspruchs.
- source_word: συγχωρηθῆναι αὐτοῖς τὰ νόμιμα
  choice: dass ihnen ihre hergebrachten Vorschriften zugestanden werden
  rationale: τὰ νόμιμα umfasst geltende, durch Brauch oder Ordnung bestimmte Vorschriften und Gebräuche. „Hergebrachte Vorschriften“ wahrt die rechtliche und traditionelle Komponente; „zugestanden werden“ bildet den passiven Infinitiv und die erbetene Erlaubnis ab.
theological_decisions:
- issue: Bedeutung von εἰς τὰ Ἑλληνικά
  choice: kulturelle Hellenisierung („griechische Lebensweisen“)
  alternative: Wechsel zur griechischen Sprache oder Übernahme griechischer Bräuche
  rationale: Der Zusammenhang in 2 Makkabäer stellt hellenistische Lebensformen der jüdischen Lebensordnung und ihren Vorschriften gegenüber. Daher ist eine kulturelle, nicht bloß sprachliche Bedeutung am wahrscheinlichsten; die Fußnote hält die engere Alternative „Bräuche“ sichtbar.
translation_notes:
  register: Moderner, würdiger deutscher Briefstil. Der Vers bleibt entsprechend dem griechischen Satzbau als Nebensatz mit abschließendem Komma offen, da der Gedanke im folgenden Vers fortgeführt wird. Das königliche „wir“ in ἀκηκοότες und der kontextuell erschlossene Bezug „mein Vater“ werden beibehalten.
