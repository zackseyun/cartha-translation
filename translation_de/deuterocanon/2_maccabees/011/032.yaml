translation:
  language: de
  text: Und ich habe auch Menelaus gesandt, um euch zuzureden[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „euch zu ermutigen“, „euch zu ermahnen“ oder „an euch zu appellieren“. Das griechische Wort kann je nach Zusammenhang Ermutigung, eindringliches Zureden oder einen Appell bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πέπομφα
  choice: ich habe gesandt
  rationale: Das griechische Perfekt bezeichnet eine abgeschlossene Sendung mit fortwirkender Bedeutung; das deutsche Perfekt gibt dies natürlich wieder.
- source_word: δὲ
  choice: und
  rationale: δέ führt den Gedanken hier locker weiter und markiert keinen starken Gegensatz.
- source_word: καὶ
  choice: auch
  rationale: Das Wort hebt Menelaus als zusätzlich Entsandten beziehungsweise als weiteres Mittel der Einflussnahme hervor.
- source_word: τὸν Μενέλαον
  choice: Menelaus
  rationale: Der Personenname wird in seiner üblichen deutschen Form wiedergegeben.
- source_word: παρακαλέσοντα
  choice: damit er euch Mut zuspricht
  rationale: Das futurische Partizip bezeichnet hier den Zweck der Sendung. παρακαλέω kann je nach Kontext ermutigen, ermahnen, zureden oder bitten bedeuten; »Mut zusprechen« passt zum diplomatisch-versöhnlichen Zusammenhang, ohne den weiteren Bedeutungsumfang zu verschweigen.
- source_word: ὑμᾶς
  choice: euch
  rationale: Das Pronomen bezeichnet als Akkusativobjekt die Empfänger des Schreibens.
