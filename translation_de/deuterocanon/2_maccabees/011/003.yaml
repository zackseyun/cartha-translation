  text: and to make the sanctuary taxable in silver[a], like the other temples of the nations, and to make the high priesthood sold each year[b];
translation:
  language: de
  text: und das Heiligtum mit einer Geldabgabe zu belegen[a], wie die übrigen Tempel der Völker, und das Hohepriesteramt jedes Jahr zum Verkauf zu stellen[b];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »einer Geldsteuer zu unterwerfen« beziehungsweise »zu Geldabgaben heranzuziehen«. Das seltene griechische Wort bezeichnet das Heiligtum als Quelle von Geldeinnahmen, entsprechend den nichtjüdischen Tempeln.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: »das Hohepriesteramt jedes Jahr verkäuflich zu machen«. Im Griechischen wird das Amt selbst als käuflich dargestellt; dadurch tritt seine beabsichtigte Entweihung hervor.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἱερὸν
  choice: Heiligtum
  rationale: Bezeichnet hier den heiligen Bezirk in Jerusalem. »Heiligtum« bewahrt den kultischen Sinn und legt die Bedeutung nicht allein auf das Tempelgebäude fest.
- source_word: ἀργυρολόγητον
  choice: mit einer Geldabgabe zu belegen
  rationale: Das seltene Adjektiv verbindet Silber beziehungsweise Geld mit dem Einziehen einer Abgabe. Die Formulierung gibt verständlich wieder, dass das Heiligtum abgabenpflichtig und so zu einer Einnahmequelle gemacht werden sollte.
- source_word: τεμένη
  choice: Tempel
  rationale: Gemeint sind die heiligen Bezirke der Völker. »Tempel« ist im modernen Deutsch die natürlichste Entsprechung in diesem Vergleich.
- source_word: πρατὴν
  choice: zum Verkauf zu stellen
  rationale: Das Adjektiv bezeichnet etwas Verkäufliches. Die deutsche Wendung erhält den anstößigen Gedanken, dass das Amt selbst käuflich gemacht werden sollte.
- source_word: ἀρχιερωσύνην
  choice: das Hohepriesteramt
  rationale: Das Wort bezeichnet Amt und Würde des Hohepriesters, nicht lediglich dessen Person.
- source_word: κατʼ ἔτος
  choice: jedes Jahr
  rationale: Gibt die regelmäßig wiederkehrende jährliche Veräußerung des Amtes direkt wieder.
- source_word: ποιήσειν
  choice: zu belegen / zum Verkauf zu stellen
  rationale: Der griechische Infinitiv hat bei beiden Vorhaben verursachende Kraft. Im Deutschen wird dies mit zwei idiomatischen Wendungen wiedergegeben.
