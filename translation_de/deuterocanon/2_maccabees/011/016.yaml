base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/011/016.yaml
  text: 'For letters had been written to the Jews from Lysias[a], containing this form: “Lysias to the multitude of the Jews[b], greetings.”'
translation:
  language: de
  text: 'Denn an die Juden waren Briefe geschrieben worden, darunter einer von Lysias, mit folgendem Wortlaut[a]: »Lysias an die Gesamtheit der Juden[b]: Gruß!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »mit folgendem Wortlaut«. Der griechische Ausdruck kann die Form oder den genauen Wortlaut des Briefes bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »an die Versammlung der Juden« beziehungsweise »an die Körperschaft der Juden«. Das griechische Wort bezeichnet eine große zusammengehörige Gruppe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦσαν γὰρ γεγραμμέναι
  choice: Denn … waren Briefe geschrieben worden
  rationale: Die periphrastische passive Verbform bezeichnet einen bereits vollzogenen Schreibvorgang; »waren … geschrieben worden« gibt diesen Vorzeitcharakter wieder. γάρ verbindet die Aussage begründend mit dem vorausgehenden Zusammenhang.
- source_word: τοῖς Ἰουδαίοις
  choice: an die Juden
  rationale: Gemeint ist hier die jüdische Volks- und Religionsgemeinschaft, nicht lediglich die Bevölkerung Judäas. Bei Briefen ist »an« im Deutschen die natürliche Kennzeichnung der Adressaten.
- source_word: ἐπιστολαὶ
  choice: Briefe
  rationale: Das Wort bezeichnet schriftliche Korrespondenz; »Briefe« ist modern, klar und dem administrativen Zusammenhang angemessen.
- source_word: παρὰ μὲν Λυσίου
  choice: zunächst von Lysias
  rationale: παρά mit Genitiv bezeichnet die Herkunft. Das korrelative μέν weist auf weitere Schreiben beziehungsweise Absender im folgenden Abschnitt voraus; »zunächst« macht diese Gliederungsfunktion im Deutschen verständlich, ohne ein ausdrückliches »einerseits« zu erzwingen.
- source_word: περιέχουσαι τὸν τρόπον τοῦτον
  choice: Sie hatten folgende Form
  rationale: Das Partizip mit τὸν τρόπον τοῦτον leitet den nachfolgenden Brieftext ein. »Form« bewahrt die mögliche Bezugnahme auf Gestalt oder Wortlaut der Schreiben.
- source_word: τῷ πλήθει τῶν Ἰουδαίων
  choice: die Gesamtheit der Juden
  rationale: πλῆθος bezeichnet hier den großen kollektiven Verband der Adressaten. »Gesamtheit« klingt im Deutschen natürlicher als »Menge« und legt nicht ohne Weiteres eine förmliche Versammlung nahe.
- source_word: χαίρειν
  choice: grüßt
  rationale: Der Infinitiv ist die übliche griechische Briefformel. In einer deutschen Absender-Anschrift gibt »grüßt« ihre Funktion knapp und idiomatisch wieder.
