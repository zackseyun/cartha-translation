  text: But since he was not foolish[a], but was considering the defeat that had happened to him and had realized that the Hebrews were unconquerable, because the mighty God was fighting alongside them, he sent ahead
translation:
  language: de
  text: Da er jedoch nicht unklug war, erwog er bei sich den Rückschlag, der ihn getroffen hatte, und erkannte, dass die Hebräer unbesiegbar waren, weil der mächtige Gott ihnen als Verbündeter beistand[a], und sandte voraus
  philosophy: optimal-equivalence
  footnotes:
