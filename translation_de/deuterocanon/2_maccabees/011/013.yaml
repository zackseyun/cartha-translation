    text: 'Oder: »weil der mächtige Gott an ihrer Seite kämpfte«. Das griechische Wort συμμαχοῦντος bezeichnet besonders im militärischen Zusammenhang das Handeln als Verbündeter.'
    reason: Lexikalische Alternative zu συμμαχοῦντος αὐτοῖς.
lexical_decisions:
- source_word: οὐκ ἀνόους δὲ ὑπάρχων
  choice: Da er jedoch nicht unvernünftig war
  rationale: Die Verneinung und der wertende Sinn von ἀνόους bleiben als bewusstes Understatement erhalten; „unvernünftig“ ist im heutigen Deutsch natürlich und weniger hölzern als „nicht ohne Verstand“.
- source_word: πρὸς ἑαυτὸν ἀντιβάλλων
  choice: bedachte er
  rationale: ἀντιβάλλω bezeichnet hier ein inneres Abwägen oder vergleichendes Erwägen. „bedachte“ gibt die gedankliche Selbstprüfung natürlich wieder, ohne einen ausdrücklich genannten Vergleichsgegenstand hinzuzufügen.
- source_word: τὸ γεγονὸς περὶ αὐτὸν ἐλάττωμα
  choice: den Rückschlag, der ihn getroffen hatte
  rationale: ἐλάττωμα kann einen Verlust, Nachteil oder militärischen Rückschlag bezeichnen. „Rückschlag“ wahrt die Bedeutungsbreite besser als das stärkere „Niederlage“; γεγονός und περὶ αὐτόν werden idiomatisch als „der ihn getroffen hatte“ wiedergegeben.
- source_word: συννοήσας
  choice: und erkannte
  rationale: Das Aoristpartizip bezeichnet eine gewonnene Einsicht vor der anschließenden Handlung. „erkannte“ gibt diesen kognitiven Abschluss knapp und klar wieder.
- source_word: ἀνικήτους εἶναι τοὺς Ἑβραίους
  choice: dass die Hebräer unbesiegbar waren
  rationale: „unbesiegbar“ entspricht der starken Aussage von ἀνίκητος und bewahrt die Bezeichnung „Hebräer“ des griechischen Textes.
- source_word: τοῦ δυναμένου θεοῦ
  choice: der mächtige Gott
  rationale: Das substantivierte Partizip betont Gottes wirksame Macht. „der mächtige Gott“ ist würdig und idiomatisch, ohne die Aussage weiter auszudeuten.
- source_word: συμμαχοῦντος αὐτοῖς
  choice: an ihrer Seite kämpfte
  rationale: συμμαχέω bezeichnet militärisches Mitkämpfen beziehungsweise das Handeln als Verbündeter. Die Formulierung macht den militärischen Zusammenhang deutlich und bewahrt Gottes aktive Unterstützung.
- source_word: προαποστείλας
  choice: Daher sandte er im Voraus
  rationale: Das Partizip bezeichnet ein vorweggenommenes Entsenden und leitet zur im folgenden Vers genannten Ergänzung über. Die fragmentarische Offenheit am Versende bleibt erhalten.
theological_decisions:
- issue: Gottes Beistand im Kampf
  choice: weil der mächtige Gott an ihrer Seite kämpfte
  alternative: da sie den mächtigen Gott als Verbündeten hatten
  rationale: Der Text führt die Unbesiegbarkeit der Hebräer ausdrücklich auf Gottes aktives Eintreten als Mitkämpfer zurück. Die Übersetzung wahrt diese Aussage, ohne sie zu bloßer allgemeiner Vorsehung abzuschwächen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die Partizipialfolge wird in einen kausalen Hauptsatzbau überführt; das offene Versende bleibt bewusst bestehen.
