translation:
  language: de
  text: Menelaus hat uns mitgeteilt, dass ihr, nachdem ihr herabgekommen seid, euch euren eigenen Angelegenheiten widmen wollt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dass ihr, nachdem ihr herabgekommen seid, bei den Euren sein wollt.“ Der griechische Ausdruck kann sich auf die eigenen Angelegenheiten, die eigenen Leute oder den eigenen Besitz beziehen; auch das Ziel des „Herabkommens“ wird nicht genannt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνεφάνισεν
  choice: hat uns mitgeteilt
  rationale: Das Verb bezeichnet hier, jemandem etwas bekannt zu machen oder mitzuteilen; die Formulierung passt zum amtlichen Briefstil.
- source_word: βουλόμενος
  choice: dass ihr … sein wollt
  rationale: Das Partizip drückt den Wunsch beziehungsweise Willen der angesprochenen Gruppe aus. Die deutsche Nebensatzkonstruktion gibt den Sinn natürlich wieder.
- source_word: κατελθόντας
  choice: nach eurer Rückkehr
  rationale: Das aoristische Partizip ist zeitlich zu verstehen. Wörtlich steht „nachdem ihr hinabgegangen seid“; im Zusammenhang bezeichnet es offenbar die Rückkehr in die Heimat, ohne dass das Ziel ausdrücklich genannt wird.
- source_word: γίνεσθαι πρὸς τοῖς ἰδίοις
  choice: bei den Euren sein
  rationale: Der schwierige Ausdruck kann die eigenen Leute, den eigenen Besitz oder die eigenen Angelegenheiten bezeichnen. „Bei den Euren sein“ bewahrt den personalen Sinn von τοῖς ἰδίοις und vermeidet die zusätzliche Vorstellung eines aktiven Sichkümmerns.
- source_word: ὑμᾶς
  choice: ihr / eurer
  rationale: Das Pronomen steht im Plural und richtet sich an die angesprochene Gemeinschaft.
- source_word: Μενέλαος
  choice: Menelaus
  rationale: Der Personenname wird in seiner geläufigen deutschen Form wiedergegeben.
