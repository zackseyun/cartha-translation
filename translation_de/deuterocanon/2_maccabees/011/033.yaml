translation_notes:
  register: Moderne, würdevolle Briefsprache. Die knappe Schlussformel und die historische Datierungsweise bleiben erhalten; die im griechischen Text nicht bezeichnete Jahresära wird nicht erläuternd in den Haupttext eingefügt.
