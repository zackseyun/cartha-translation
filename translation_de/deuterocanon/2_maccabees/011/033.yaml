lexical_decisions:
- source_word: ἔρρωσθε
  choice: Lebt wohl!
  rationale: Die Form ist eine übliche briefliche Schlussformel. „Lebt wohl!“ gibt ihren Abschiedscharakter im Deutschen natürlich wieder, statt die Grundbedeutung wörtlich als Aufforderung zur Stärke auszudrücken.
- source_word: ἔτους
  choice: Jahr
  rationale: Bestandteil der griechischen Datierungsformel; schlicht und unmittelbar mit „Jahr“ wiedergegeben.
- source_word: ἑκατοστοῦ τεσσερακοστοῦ ὀγδόου
  choice: '148.'
  rationale: Die Ordinalzahl wird in der im modernen Deutschen üblichen Ziffernschreibweise wiedergegeben; die im Ausgangstext nicht eigens benannte Ära bleibt unausgesprochen.
- source_word: Ξανθικοῦ
  choice: Xanthikos
  rationale: Der makedonische Monatsname wird in einer dem Griechischen nahen Form transliteriert und nicht durch einen modernen Monatsnamen ersetzt.
- source_word: πεντεκαιδεκάτῃ
  choice: am fünfzehnten Tag
  rationale: In der Datierungsformel bezeichnet der feminine Dativ den Monatstag. „Tag“ wird zur natürlichen und eindeutigen deutschen Formulierung ergänzt.
