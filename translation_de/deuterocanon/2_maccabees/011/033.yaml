  text: Farewell. In the one hundred forty-eighth year[a], on the fifteenth day of Xanthicus.
translation:
  language: de
  text: Lebt wohl! Im 148. Jahr, am fünfzehnten Tag des Monats Xanthikos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Xanthikos ist ein makedonischer Monatsname, der hier in griechischer Form überliefert ist.
