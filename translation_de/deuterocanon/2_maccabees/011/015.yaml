  text: And Maccabeus agreed to everything that Lysias urged, being concerned for what was advantageous; for whatever Maccabeus set before Lysias in writing concerning the Jews, the king granted.
translation:
  language: de
  text: 15 Makkabäus stimmte allem zu, worum Lysias ihn bat, und hatte dabei im Blick, was vorteilhaft war. Denn alles, was Makkabäus Lysias wegen der Juden schriftlich vorlegte, bewilligte der Sekretär.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der vorliegende griechische Text lautet „der Sekretär“; eine andere Textüberlieferung hat „der König“.
    reason: Die Lesarten führen zu unterschiedlichen handelnden Personen; der Haupttext folgt der angegebenen Swete-Ausgabe, während die bekannte Alternative offengelegt wird.
lexical_decisions:
- source_word: ἐπένευσε
  choice: stimmte … zu
  rationale: Gibt die Zustimmung zu den von Lysias vorgebrachten Anliegen natürlich und präzise wieder.
- source_word: παρεκάλει
  choice: wozu … ihn drängte
  rationale: Bewahrt hier den nachdrücklichen Charakter von παρακαλέω, ohne einen Zwang auszudrücken.
- source_word: τοῦ συμφέροντος φροντίζων
  choice: denn er war auf das bedacht, was von Vorteil war
  rationale: Gibt sowohl das besonnene Erwägen als auch den Nutzen wieder, ohne näher festzulegen, für wen der Vorteil galt.
- source_word: ἔδωκεν … διὰ γραπτῶν
  choice: schriftlich vorlegte
  rationale: Idiomatiche Wiedergabe dafür, dass Makkabäus seine Anliegen in schriftlicher Form an Lysias übergab beziehungsweise ihm unterbreitete.
- source_word: συνεχώρησεν
  choice: bewilligte
  rationale: Passt zum administrativen Kontext und bezeichnet das Gewähren der schriftlich vorgelegten Anliegen.
- source_word: ὁ γραμματεύς
  choice: der Sekretär
  rationale: Folgt dem ausdrücklich gebotenen griechischen Text der angegebenen Swete-Ausgabe; γραμματεύς bezeichnet hier am ehesten einen Amtsschreiber oder Sekretär.
theological_decisions:
- issue: Wer die Forderungen bewilligte
  choice: der Sekretär
  alternative: der König
  rationale: Die vorgelegte griechische Ausgangsausgabe liest eindeutig ὁ γραμματεύς. Die Übersetzung folgt daher der Originalsprachengrundlage und weist die abweichende verbreitete Lesart transparent in einer Fußnote aus.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau wurde leicht gegliedert, damit der lange griechische Zusammenhang verständlich bleibt. Die unbestimmte Formulierung „was von Vorteil war“ bewahrt die Offenheit des griechischen Ausdrucks.
