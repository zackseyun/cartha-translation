  source_fidelity: 'Der Entwurf gibt die Satzstruktur und den Sinn des griechischen Textes zuverlässig wieder: Johannes und Absalom sind von den Adressaten entsandt, übergeben ein Schriftstück und tragen eine Bitte zu den dadurch bezeichneten Sachverhalten vor. »Nachstehende[s] Schreiben« bildet ὑπογεγραμμένον in seinem dokumentarischen Kontext vertretbar ab, ohne die nicht ganz sichere technische Nuance von χρηματισμός unzulässig festzulegen. Der Bezug von »darin« auf das Schreiben entspricht dem naheliegenden Bezug von αὐτοῦ.'
