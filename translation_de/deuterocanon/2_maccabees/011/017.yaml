  terminology: Die Namen »Johannes« und »Absalom« sind die etablierten deutschen biblischen Formen. »Schreiben«, »übergaben« und »baten« treffen Register und Aussage des griechischen Textes. Die Fußnote benennt sachgerecht die dokumentarische und semantisch nicht restlos eindeutige Wendung, ohne eine bestimmte Deutung als sicher auszugeben.
