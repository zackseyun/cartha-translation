  yaml_path: translation/deuterocanon/2_maccabees/011/017.yaml
  text: John and Absalom[a], who were sent by you, delivered the written memorandum and made request concerning the matters indicated in it.
translation:
  language: de
  text: Johannes und Absalom, die von euch gesandt worden waren, übergaben das nachstehende Schreiben[a] und baten hinsichtlich der darin bezeichneten Angelegenheiten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die beigefügte schriftliche Mitteilung« beziehungsweise »den unten niedergeschriebenen Erlass«. Der griechische Ausdruck ist urkundensprachlich und in seiner genauen Bedeutung nicht eindeutig.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰωάνης
  choice: Johannes
  rationale: Die im Deutschen gebräuchliche biblische Namensform gibt den griechischen Eigennamen wieder.
- source_word: Ἀβεσσαλώμ
  choice: Absalom
  rationale: Die geläufige deutsche biblische Namensform wahrt die Wiedererkennbarkeit.
- source_word: οἱ πεμφθέντες παρʼ ὑμῶν
  choice: die von euch gesandt worden waren
  rationale: Die Relativkonstruktion gibt das passive Partizip und die Sendung durch die Adressaten natürlich wieder; das Plusquamperfekt macht die zeitliche Vorordnung gegenüber den folgenden Handlungen deutlich.
- source_word: ἐπιδόντες
  choice: übergaben
  rationale: Das Verb bezeichnet hier die förmliche Aushändigung eines Schriftstücks.
- source_word: τὸν ὑπογεγραμμένον χρηματισμόν
  choice: das nachstehende Schreiben
  rationale: ὑπογεγραμμένον weist wörtlich auf etwas darunter beziehungsweise nachstehend Geschriebenes; χρηματισμός bezeichnet in diesem urkundlichen Zusammenhang eine offizielle schriftliche Mitteilung. »Schreiben« erhält den dokumentarischen Ton, ohne sich vorschnell auf »Erlass« festzulegen.
- source_word: ἠξίουν
  choice: baten
  rationale: Das Imperfekt bezeichnet ihr förmliches Ersuchen; die schlichte deutsche Formulierung ist natürlich und bewahrt den Sinn.
- source_word: περὶ τῶν διʼ αὐτοῦ σημαινομένων
  choice: hinsichtlich der darin bezeichneten Angelegenheiten
  rationale: Die Formulierung bewahrt den Bezug auf die durch das Schreiben angezeigten oder mitgeteilten Sachverhalte, ohne den Inhalt der Bitte näher festzulegen.
