  text: They advanced in battle formation[a], having the ally from heaven before them, because the Lord had shown them mercy.
translation:
  language: de
  text: Sie rückten kampfbereit vor[a] und hatten den Verbündeten vom Himmel vor sich, weil der Herr ihnen Erbarmen erwiesen hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sie rückten in Schlachtordnung vor, wobei der Verbündete vom Himmel ihnen vorausging.“ Der griechische Satzanfang ist stark verkürzt und lässt sich unterschiedlich verbinden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ πρόηγον
  choice: sie rückten … vor
  rationale: Der komprimierte und syntaktisch schwierige griechische Ausdruck wird als Beschreibung ihres Vorrückens verstanden. „Sie rückten vor“ ist im militärischen Zusammenhang natürlich und wahrt die Bewegungsrichtung, ohne einen menschlichen Anführer einzuführen.
- source_word: ἐν διασκευῇ
  choice: kampfbereit
  rationale: διασκευή bezeichnet hier Ausrüstung beziehungsweise Zurüstung zum Kampf. „Kampfbereit“ gibt dies idiomatisch wieder, ohne die im Griechischen nicht eindeutig ausgesagte Aufstellung in einer bestimmten Formation festzulegen.
- source_word: σύμμαχον
  choice: Verbündeten
  rationale: σύμμαχος bezeichnet jemanden, der auf derselben Seite mitkämpft. „Verbündeter“ bewahrt den militärischen Sinn besser als das allgemeinere „Helfer“.
- source_word: ἀπʼ οὐρανοῦ
  choice: vom Himmel
  rationale: Im religiösen Kontext bezeichnet οὐρανός den Himmel als Herkunft göttlicher beziehungsweise himmlischer Hilfe.
- source_word: ἔχοντες
  choice: hatten … bei sich
  rationale: Das Partizip beschreibt einen begleitenden Umstand. „Bei sich haben“ lässt offen, auf welche Weise der himmlische Verbündete gegenwärtig war, und vermeidet wegen der schwierigen Eingangskonstruktion eine unnötig feste räumliche Deutung.
- source_word: ἐλεήσαντος αὐτοὺς τοῦ κυρίου
  choice: weil der Herr ihnen Erbarmen erwiesen hatte
  rationale: Der Genitivus absolutus nennt den begründenden Umstand. Das Plusquamperfekt gibt die Vorzeitigkeit des aoristischen Partizips wieder; „Erbarmen erweisen“ bewahrt das Motiv göttlicher Barmherzigkeit.
theological_decisions:
- issue: Identität des „Verbündeten vom Himmel“
  choice: nicht näher bestimmt als „der Verbündete vom Himmel“
  alternative: ein Engel; Gottes unmittelbare Hilfe
  rationale: Der griechische Text identifiziert den Verbündeten nicht ausdrücklich. Die Übersetzung hält diese theologische Offenheit aufrecht.
- issue: Räumliche Beziehung des himmlischen Verbündeten
  choice: „bei sich“ im Haupttext, mit wörtlicherer Alternative in der Fußnote
  alternative: „vor sich“ beziehungsweise „der ihnen vorausging“
  rationale: Die komprimierte Formulierung τὸ πρόηγον kann mit dem Vorrücken der Kämpfer oder mit einem Vorausgehen des Verbündeten verbunden werden. Der Haupttext vermeidet eine ungesicherte Festlegung; die Fußnote dokumentiert die andere plausible Konstruktion.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die militärische Bildsprache bleibt erhalten; die syntaktische Mehrdeutigkeit des griechischen Satzanfangs wird im Haupttext lesbar wiedergegeben und in der Fußnote offengelegt.
