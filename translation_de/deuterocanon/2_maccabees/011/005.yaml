base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/011/005.yaml
  text: But after entering Judea and approaching Beth-zur[a], a fortified place about five schoeni from Jerusalem[b], he was besieging it.
translation:
  language: de
  text: Nachdem er aber nach Judäa gekommen und bis nahe an Bet-Zur, einem befestigten Ort, der etwa fünf Schoinen[a] von Jerusalem entfernt lag, herangerückt war, bedrängte er diesen Ort.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Eine Schoinos war ein antikes Längenmaß, dessen genaue Länge je nach Zeit und Region schwankte.
    reason: cultural_note
  - marker: b
    text: 'Oder: „belagerte ihn“. Das griechische Verb bedeutet wörtlich „bedrängen“ oder „unter Druck setzen“ und bezeichnet hier militärischen Druck gegen Bet-Zur.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσελθὼν
  choice: nach Judäa hineingezogen
  rationale: Das Aoristpartizip bezeichnet eine der Haupthandlung vorausgehende Bewegung. „Hineingezogen“ passt zum militärischen Zusammenhang, ohne mehr als das griechische „hineingehen/eintreten“ festzulegen.
- source_word: συνεγγίσας
  choice: bis nahe an Bet-Zur herangerückt
  rationale: Das Partizip bezeichnet die Annäherung an den Ort. „Herangerückt“ ist im militärischen Kontext natürlich und bewahrt die räumliche Aussage.
- source_word: Βεθσουρῶν
  choice: Bet-Zur
  rationale: Gebräuchliche deutsche Wiedergabe des semitischen Ortsnamens.
- source_word: ἐρυμνῷ χωρίῳ
  choice: einen befestigten Ort
  rationale: ἐρυμνός bezeichnet einen starken beziehungsweise befestigten Ort; χωρίον bleibt mit „Ort“ bewusst allgemein.
- source_word: σχοίνους πέντε
  choice: fünf Schoinen
  rationale: Die antike Maßeinheit wird transliteriert, weil ihre Länge je nach Zeit und Region schwankte und eine moderne Umrechnung Scheingenauigkeit erzeugen würde.
- source_word: τοῦτο
  choice: den Ort
  rationale: Das Demonstrativpronomen verweist auf Bet-Zur. Die ausdrückliche Wiederaufnahme mit „den Ort“ ist im Deutschen klarer als ein mehrdeutiges Pronomen.
- source_word: ἔθλιβε
  choice: bedrängte
  rationale: Das Imperfekt beschreibt anhaltenden Druck. „Bedrängte“ bewahrt das Grundbild von θλίβω und lässt offen, ob eine förmliche Belagerung gemeint ist.
