translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur macht die zeitliche Abfolge deutlich; der Gedankenstrich hält die Ortsbeschreibung lesbar. Die militärische Bedeutung wird hörbar, ohne ἔθλιβε vorschnell auf den technischen Begriff „belagern“ zu verengen.
