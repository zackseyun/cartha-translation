base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/011/022.yaml
  text: 'And the king’s letter contained this: “King Antiochus to his brother Lysias[b][a], greetings.”'
translation:
  language: de
  text: Der Brief des Königs lautete folgendermaßen:[a] »König Antiochus grüßt seinen Bruder[b] Lysias.«
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »enthielt so«; die Wendung leitet den Wortlaut des Briefes ein.'
    reason: lexical_alternative
  - marker: b
    text: »Bruder« kann hier ein höfischer Titel für politische Nähe sein und muss keine leibliche Verwandtschaft bezeichnen.
    reason: cultural_note
lexical_decisions:
- source_word: Ἡ ... τοῦ βασιλέως ἐπιστολή
  choice: Der Brief des Königs
  rationale: ἐπιστολή bezeichnet einen Brief beziehungsweise eine schriftliche Mitteilung; der Genitiv τοῦ βασιλέως wird natürlich mit »des Königs« wiedergegeben.
- source_word: περιεῖχεν οὕτως
  choice: lautete folgendermaßen
  rationale: Wörtlich bedeutet die Wendung etwa »enthielt so«; hier führt sie idiomatisch den genauen Wortlaut des Briefes ein.
- source_word: Βασιλεὺς Ἀντίοχος
  choice: König Antiochus
  rationale: Die Verbindung aus Titel und Name ist Bestandteil des üblichen antiken Briefformulars.
- source_word: τῷ ἀδελφῷ
  choice: seinen Bruder
  rationale: Der bestimmte Artikel bezeichnet in der Absender-Empfänger-Formel die Beziehung zu Antiochus; »Bruder« bewahrt den griechischen Ausdruck, auch wenn er ein höfischer Titel sein kann.
- source_word: Λυσίᾳ
  choice: Lysias
  rationale: Der Eigenname wird in seiner etablierten deutschen Form wiedergegeben.
- source_word: χαίρειν
  choice: grüßt
  rationale: χαίρειν ist die konventionelle griechische Briefformel. Im Deutschen fügt sich »grüßt« natürlich in die Absender-Empfänger-Formel ein.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die antike Briefformel wird knapp und natürlich wiedergegeben; die mögliche titulare Bedeutung von »Bruder« bleibt durch eine Fußnote erhalten.
