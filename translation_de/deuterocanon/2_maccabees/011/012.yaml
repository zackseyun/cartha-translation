  text: But most of them escaped wounded and naked[a], and Lysias himself also escaped by fleeing shamefully.
translation:
  language: de
  text: Die meisten von ihnen aber entkamen verwundet und nackt[a]; Lysias selbst aber entkam, indem er schmachvoll floh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „entblößt“ oder „ihrer Kleidung beraubt“. Das griechische Wort kann im Zusammenhang einer Flucht auch bedeuten, dass sie nicht völlig unbekleidet, sondern ihrer Kleidung beraubt waren.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ πλείονες
  choice: die meisten von ihnen
  rationale: Der substantivierte Komparativ bezeichnet hier den größeren Teil; die Formulierung gibt den quantitativen Sinn natürlich und genau wieder.
- source_word: τραυματίαι
  choice: verwundet
  rationale: Das Wort bezeichnet Verwundete. Als prädikative Zustandsangabe ist „verwundet“ im Deutschen knapp und idiomatisch.
- source_word: γυμνοὶ
  choice: nackt
  rationale: „Nackt“ entspricht dem unbestimmten Grundsinn. Im militärischen Zusammenhang kann auch gemeint sein, dass sie ihrer Kleidung oder Ausrüstung beraubt waren; diese mögliche Nuance wird in der Fußnote bewahrt.
- source_word: διεσώθησαν / διεσώθη
  choice: entkamen / entkam
  rationale: διασῴζω bezeichnet hier, dass die Betreffenden lebend aus der Schlacht davonkamen; „entkommen“ passt zum Fluchtkontext.
- source_word: αἰσχρῶς
  choice: schmachvoll
  rationale: Das Adverb bewertet die Flucht als ehrlos oder beschämend. „Schmachvoll“ bewahrt diesen pointierten erzählerischen Tadel in würdigem Register.
- source_word: φεύγων
  choice: indem er … floh
  rationale: Das präsentische Partizip bezeichnet die begleitende Art und Weise seines Entkommens; die finite Nebensatzform klingt im modernen Deutschen natürlich.
