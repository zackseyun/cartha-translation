  source_fidelity: 'Die Übersetzung gibt die wesentlichen Elemente des Griechischen zuverlässig wieder: die dynastische Bezeichnung „unser Vater“, die ausdrücklich polytheistische höfische Todesumschreibung, die erklärte Absicht der Briefabsender, die allgemein gehaltene Gruppe der zum Reich Gehörenden, ihren ungestörten Zustand sowie die verdichtete Bezugnahme auf die Fürsorge bzw. Angelegenheiten der Juden. „Menschen im Reich“ ist eine vertretbare, nicht übermäßig spezifizierende Wiedergabe von τοὺς ἐκ τῆς βασιλείας.'
