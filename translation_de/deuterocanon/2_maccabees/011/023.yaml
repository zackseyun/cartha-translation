base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/011/023.yaml
  text: Since our father has departed to the gods[a], and since we want those in the kingdom, being free from disturbance, to turn to the care of the Jews[b],
translation:
  language: de
  text: Da unser Vater zu den Göttern hinübergegangen ist[a] und wir wollen, dass die Menschen im Reich unbehelligt leben und sich der Angelegenheiten der Juden annehmen[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »zu den Göttern hinübergegangen«; eine hellenistische königliche Umschreibung für den Tod. Manche Übersetzungen vereinfachen zu »gestorben«.'
    reason: lexical_alternative
  - marker: b
    text: 'Der letzte Satzteil ist im Griechischen syntaktisch stark verdichtet. Er kann auch im engeren Sinn verstanden werden: »den Juden Fürsorge zukommen lassen«.'
    reason: alternative_reading
lexical_decisions:
- source_word: τοῦ πατρὸς ἡμῶν
  choice: unser Vater
  rationale: Bewahrt die dynastische und höfische Ausdrucksweise des königlichen Schreibens, ohne den verstorbenen Vorgänger näher zu bestimmen.
- source_word: εἰς θεοὺς μεταστάντος
  choice: zu den Göttern hinübergegangen ist
  rationale: Gibt die hellenistische königliche Umschreibung für den Tod einschließlich ihrer ausdrücklich polytheistischen Sprache wieder, statt sie zu „gestorben ist“ zu verflachen.
- source_word: βουλόμενοι
  choice: wir wollen
  rationale: Gibt die erklärte Absicht der Verfasser in natürlichem, gegenwärtigem Deutsch wieder.
- source_word: τοὺς ἐκ τῆς βασιλείας
  choice: die Menschen im Reich
  rationale: Bezeichnet die zum Herrschaftsgebiet gehörenden Menschen allgemein, ohne sie durch „Untertanen“ stärker zu spezifizieren, als es der griechische Wortlaut verlangt.
- source_word: ἀπερισπάστως ὄντας
  choice: unbehelligt leben
  rationale: Vermittelt im politischen Zusammenhang einen ungestörten, von Unruhen freien Zustand und klingt im Deutschen natürlicher als eine wörtliche Partizipialkonstruktion.
- source_word: γενέσθαι πρὸς τὴν τῶν Ἰουδαίων ἐπιμέλειαν
  choice: sich der Angelegenheiten der Juden annehmen
  rationale: Gibt die komprimierte Konstruktion mit ἐπιμέλεια als Zuwendung, Fürsorge oder Befassung verständlich wieder, ohne die verbleibende syntaktische Mehrdeutigkeit zu verschweigen.
theological_decisions:
- issue: Beibehaltung der paganen königlichen Todesformel
  choice: zu den Göttern hinübergegangen
  alternative: gestorben
  rationale: Die Formulierung gehört zum hellenistischen Königsschreiben und nennt ausdrücklich „die Götter“. Diese historische und religiöse Eigenart des Quelltexts wird nicht monotheistisch neutralisiert.
- issue: Bezug der abschließenden Wendung
  choice: sich der Angelegenheiten der Juden annehmen
  alternative: den Juden Fürsorge zukommen lassen
  rationale: Der griechische Ausdruck ist syntaktisch gedrängt und kann die Befassung mit jüdischen Angelegenheiten oder unmittelbarer die Fürsorge für die Juden bezeichnen. Die Hauptfassung wählt die im politischen Briefkontext breitere Lesart; die Alternative bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch im Stil eines königlichen Schreibens. Die pagane Hofsprache bleibt erkennbar. Der Vers ist ein fortlaufender, mit Komma endender Satzteil; die Fußnotenmarker stehen vollständig im Haupttext.
