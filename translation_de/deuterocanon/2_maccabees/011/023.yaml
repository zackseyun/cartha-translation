  terminology: „Zu den Göttern hinübergegangen“ bewahrt die pagane Königsterminologie treffend. „Sich der Angelegenheiten der Juden annehmen“ ist als breite, politisch-administrative Wiedergabe von ἐπιμέλεια möglich; die Fußnote hält die engere Lesart einer Fürsorge für die Juden sachgerecht offen.
