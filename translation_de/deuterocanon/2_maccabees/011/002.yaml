base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/011/002.yaml
  text: After gathering about eighty thousand men and all the cavalry[a], he advanced against the Jews, intending to make the city a dwelling place for Greeks,
translation:
  language: de
  text: Nachdem er etwa achtzigtausend Mann und die gesamte Reiterei zusammengezogen hatte, rückte er gegen die Juden[a] vor, mit der Absicht, die Stadt zu einer Wohnstätte für Griechen zu machen,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Judäer“. Das griechische Wort Ἰουδαίους kann je nach Zusammenhang das jüdische Volk oder die Menschen aus Judäa bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: συναθροίσας
  choice: Nachdem er … zusammengezogen hatte
  rationale: Der Aoristpartizip bezeichnet eine Handlung, die dem Vorrücken vorausgeht. Die temporale Konstruktion gibt diese Abfolge in natürlichem Deutsch wieder.
- source_word: περὶ τὰς ὀκτὼ μυριάδας
  choice: etwa achtzigtausend Mann
  rationale: μυριάς bezeichnet zehntausend; acht Myriaden ergeben achtzigtausend. περί drückt bei Zahlen eine ungefähre Angabe aus. „Mann“ wird aus dem militärischen Zusammenhang ergänzt.
- source_word: τὴν ἵππον ἅπασαν
  choice: die gesamte Reiterei
  rationale: ἵππος kann im militärischen Sprachgebrauch kollektiv die Kavallerie bezeichnen; „Reiterei“ ist im Deutschen klar und idiomatisch.
- source_word: παρεγένετο ἐπὶ τοὺς Ἰουδαίους
  choice: rückte er gegen die Juden vor
  rationale: ἐπί mit Akkusativ bezeichnet hier eine feindliche Bewegung auf ein Ziel zu. „gegen … vorrücken“ bewahrt den militärischen Sinn.
- source_word: λογιζόμενος
  choice: Er beabsichtigte
  rationale: Das Partizip bezeichnet im Kontext den gefassten Plan. Ein neuer deutscher Hauptsatz ist flüssig, ohne die inhaltliche Beziehung aufzulösen.
- source_word: τὴν μὲν πόλιν
  choice: die Stadt
  rationale: Die Stadt ist aus dem Zusammenhang bestimmt. μέν kündigt eine Fortsetzung beziehungsweise Gegenüberstellung im folgenden Vers an; deshalb bleibt der Satz mit einem Komma offen.
- source_word: Ἕλλησιν
  choice: für Griechen
  rationale: Der Dativ bezeichnet hier am ehesten die vorgesehenen Bewohner beziehungsweise Begünstigten. Der artikellose Ausdruck wird entsprechend ohne bestimmten Artikel wiedergegeben.
- source_word: οἰκητήριον ποιήσειν
  choice: zu einer Wohnstätte … zu machen
  rationale: Die Wendung bedeutet, etwas zu einem bewohnbaren Ort beziehungsweise Wohnsitz zu machen. „Wohnstätte“ ist würdig und verständlich, ohne eine stärker deutende Vorstellung wie „Kolonie“ einzutragen.
theological_decisions:
- issue: Bedeutungsumfang von Ἰουδαίους
  choice: die Juden
  alternative: die Judäer
  rationale: Die Bezeichnung kann sowohl ethnisch-religiös als auch geografisch verstanden werden. Hier richtet sich der Angriff gegen das jüdische Volk als Gruppe, weshalb „die Juden“ im Haupttext natürlicher ist; die geografisch akzentuierte Wiedergabe bleibt als echte Alternative in der Fußnote erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer militärischer Ausdrucksweise. Die offene Satzfügung am Versende wird durch das abschließende Komma bewahrt, da μέν auf die Fortsetzung im nächsten Vers vorausweist.
