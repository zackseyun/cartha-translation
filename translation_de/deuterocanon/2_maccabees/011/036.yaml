  yaml_path: translation/deuterocanon/2_maccabees/011/036.yaml
  text: But whatever he has decided should be presented to the king, send someone at once to examine these matters, so that we may settle them as is fitting for us; for we are going on to Antioch.
translation:
  language: de
  text: Was er aber beschlossen hat, dem König vorzulegen, dazu schickt unverzüglich jemanden, der diese Angelegenheiten prüft, damit wir damit so verfahren können, wie es für uns angemessen ist.[a] Denn wir ziehen weiter nach Antiochia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „damit wir die Angelegenheiten so behandeln können, wie es für uns angemessen ist“. Wörtlich heißt es im Griechischen: „damit wir sie so haben, wie es uns zukommt“. Die ungewöhnliche Wendung meint wahrscheinlich, dass in diesen Angelegenheiten in angemessener Weise verfahren wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἃ δὲ
  choice: Was er aber
  rationale: Das Relativpronomen wird im Deutschen idiomatisch mit „was“ wiedergegeben; δέ markiert einen leichten Übergang beziehungsweise Gegensatz und wird durch „aber“ ausgedrückt.
- source_word: ἔκρινεν προσανενεχθῆναι τῷ Βασιλεῖ
  choice: dem König vorzulegen beschlossen hat
  rationale: κρίνω bezeichnet hier eine amtliche Entscheidung, während der passive Infinitiv προσανενεχθῆναι die Vorlage beim König meint. Die deutsche Infinitivkonstruktion gibt den Verwaltungskontext natürlich wieder.
- source_word: πέμψατέ τινα παραχρῆμα
  choice: schickt unverzüglich jemanden
  rationale: Der Imperativ wird direkt wiedergegeben; τις bleibt unbestimmt und ohne unnötige Geschlechtsangabe. παραχρῆμα fordert sofortiges Handeln.
- source_word: ἐπισκεψόμενον περὶ τούτων
  choice: der die Angelegenheiten prüft
  rationale: Das futurische Partizip bezeichnet den Zweck der Entsendung. „prüft“ wahrt den Sinn von untersuchen beziehungsweise in Augenschein nehmen, ohne das Verfahren näher festzulegen.
- source_word: ἵνʼ ἔχωμεν ὡς καθήκει ἡμῖν
  choice: damit wir sie so regeln können, wie es uns zukommt
  rationale: ἔχω ist wörtlich „haben“, wirkt hier aber als administrative Wendung für die angemessene Behandlung der Angelegenheiten. „regeln“ macht diesen Sinn verständlich; die Fußnote bewahrt die sprachliche Offenheit.
- source_word: ἡμεῖς γὰρ προσάγομεν πρὸς Ἀντιοχίαν
  choice: Denn wir ziehen weiter nach Antiochia
  rationale: γάρ begründet die Aufforderung. προσάγω bezeichnet mit Zielangabe hier die Weiterbewegung nach Antiochia; „ziehen weiter“ passt zum Reise- beziehungsweise Heereskontext, ohne übermäßig technisch zu klingen.
