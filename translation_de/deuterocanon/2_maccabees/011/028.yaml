  register: Moderner, würdiger Briefstil. Der formelhafte Abschiedsgruß und der anschließende Wunsch bleiben als getrennte Sätze erhalten; das Semikolon bildet die enge Verbindung zum abschließenden Gesundheitsvermerk ab.
