  text: Lebt wohl. Möge es so sein, wie wir es wünschen; auch wir selbst sind wohlauf.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔρρωσθε
  choice: Lebt wohl
  rationale: Der Imperativ Plural von ῥώννυμι dient im Briefstil als Abschiedsgruß. „Lebt wohl“ gibt diese konventionelle Funktion in würdigem, verständlichem Deutsch wieder.
- source_word: εἴη ἂν
  choice: Möge es so sein
  rationale: Der Optativ mit ἄν drückt hier einen Wunsch aus. Die deutsche Wunschform mit „möge“ bewahrt diesen Modus.
- source_word: ὡς βούλομεθα
  choice: wie wir wünschen
  rationale: βούλομαι bezeichnet Wollen oder Wünschen; „wünschen“ passt zum höflich-formellen Briefstil.
- source_word: καὶ αὐτοὶ δὲ
  choice: auch wir selbst
  rationale: „auch“ gibt die hinzufügende Beziehung wieder, während „wir selbst“ die leichte Hervorhebung durch αὐτοί bewahrt. Das adversative δέ wirkt hier vor allem als überleitende Partikel und verlangt kein starkes „aber“.
- source_word: ὑγιαίνομεν
  choice: sind gesund
  rationale: Das Verb bedeutet, gesund oder wohlauf zu sein. „sind gesund“ ist direkt, natürlich und erhält den ausdrücklichen Gesundheitsbezug.
