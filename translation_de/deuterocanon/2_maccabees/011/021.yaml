  text: Farewell. In the one hundred forty-eighth year[a], on the twenty-fourth day of Dios Corinthios.
translation:
  language: de
  text: Lebt wohl. Im Jahr 148, am vierundzwanzigsten Tag des Monats Dios Corinthios.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der griechische Text bewahrt mit »Dios Corinthios« den makedonischen Monatsnamen, statt einen unmittelbar entsprechenden Monat eines anderen Kalenders anzugeben.
    reason: cultural_note
lexical_decisions:
- source_word: ἔρρωσθε
  choice: Lebt wohl
  rationale: Die Form ist eine übliche briefliche Schlussformel mit dem Sinn »seid gesund/wohl«; »Lebt wohl« bewahrt den formelhaften, würdigen Abschiedscharakter im Deutschen.
- source_word: ἔτους ἑκατοστοῦ τεσσερακοστοῦ ὀγδόου
  choice: Im 148. Jahr
  rationale: Die griechische Datierungsformel wird knapp und natürlich wiedergegeben; die Ordnungszahl bleibt erhalten.
- source_word: Διὸς Κορινθίου
  choice: Dios Corinthios
  rationale: Der überlieferte makedonische Monatsname wird transliteriert, statt ihm unsicher einen Monat eines anderen Kalenders zuzuordnen.
- source_word: τετράδι καὶ εἰκάδι
  choice: am vierundzwanzigsten Tag
  rationale: Die wörtliche griechische Zählweise »am vierten und zwanzigsten« bezeichnet idiomatisch den vierundzwanzigsten Monatstag.
