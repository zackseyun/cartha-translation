  source_fidelity: Die Übersetzung gibt ὑπὲρ ὧν sachgerecht mit dem vorangestellten „Was …“ wieder. „der Verwandte des Königs“ entspricht συγγενής, ohne den Verwandtschaftsgrad zu überbestimmen. „euch zugestanden hat“ trifft συνεχώρησεν im Kontext einer amtlichen Konzession; „dem stimmen auch wir zu“ gibt die mitzustimmende Billigung von συνευδοκοῦμεν zutreffend wieder.
