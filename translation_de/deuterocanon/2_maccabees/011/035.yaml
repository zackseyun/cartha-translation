  yaml_path: translation/deuterocanon/2_maccabees/011/035.yaml
  text: Concerning the things that Lysias, the king’s kinsman, granted to you, we also approve.
translation:
  language: de
  text: Was Lysias, der Verwandte des Königs, euch zugestanden hat, dem stimmen auch wir zu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπὲρ ὧν
  choice: Was …
  rationale: Die Wendung führt den Gegenstand der Zustimmung ein. Im Deutschen gibt ein vorangestellter Relativsatz den Zusammenhang natürlich und präzise wieder.
- source_word: Λυσίας
  choice: Lysias
  rationale: Der Eigenname wird nach der üblichen deutschen Form wiedergegeben.
- source_word: ὁ συγγενὴς τοῦ βασιλέως
  choice: der Verwandte des Königs
  rationale: συγγενής bezeichnet einen Verwandten oder Angehörigen. „Verwandte“ ist im heutigen Standarddeutsch klar und vermeidet eine unnötig altertümliche Färbung.
- source_word: συνεχώρησεν ὑμῖν
  choice: euch zugestanden hat
  rationale: Im diplomatischen Zusammenhang bezeichnet das Verb eine gewährte Konzession. „Zugestanden“ bewahrt diesen amtlichen Sinn und die Zuordnung zu den Empfängern.
- source_word: καὶ ἡμεῖς συνευδοκοῦμεν
  choice: dem stimmen auch wir zu
  rationale: Das Verb drückt gemeinsame Billigung oder Zustimmung aus. Die Formulierung macht deutlich, dass die Absender die Zugeständnisse des Lysias bestätigen.
