base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/011/009.yaml
  text: And all together they blessed the merciful God and were strengthened in spirit[a], being ready to wound not only men but even the fiercest wild beasts and iron walls.
translation:
  language: de
  text: Alle gemeinsam priesen den barmherzigen Gott und wurden innerlich gestärkt[a]. Sie waren bereit, nicht nur Menschen zu verwunden, sondern selbst die wildesten Tiere und eiserne Mauern.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „wurden in ihren Seelen gestärkt“. Gemeint ist innere Stärkung oder neuer Mut.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁμοῦ δὲ πάντες
  choice: Alle gemeinsam
  rationale: Die Verbindung von ὁμοῦ und πάντες betont das einmütige, gemeinsame Handeln der ganzen Gruppe.
- source_word: εὐλόγησαν
  choice: priesen
  rationale: Wenn Gott das Objekt ist, bezeichnet εὐλογέω das lobende Preisen. „Priesen“ ist im modernen Deutschen natürlicher als „segneten“, ohne den religiösen Sinn abzuschwächen.
- source_word: τὸν ἐλεήμονα θεόν
  choice: den barmherzigen Gott
  rationale: „Barmherzig“ gibt ἐλεήμων als ausdrücklich hervorgehobene Eigenschaft Gottes präzise und in würdigem Deutsch wieder.
- source_word: ἐπερρώσθησαν ταῖς ψυχαῖς
  choice: wurden innerlich gestärkt
  rationale: Die Wendung beschreibt hier innere Festigkeit und Kampfesmut. „Innerlich“ vermittelt den idiomatischen Sinn, während die Fußnote die wörtlichere Form bewahrt.
- source_word: ἀνθρώπους
  choice: Menschen
  rationale: „Menschen“ ist die natürliche, geschlechtsübergreifende Wiedergabe des griechischen Plurals und passt zum Gegensatz mit Tieren und Mauern.
- source_word: θῆρας δὲ τοὺς ἀγριωτάτους
  choice: sondern selbst die wildesten Tiere
  rationale: θῆρας bezeichnet wilde Tiere; der Superlativ ἀγριωτάτους wird durch „wildesten“ bewahrt. „Selbst“ bringt die steigernde Gegenüberstellung zum Ausdruck.
- source_word: σιδηρᾶ τείχη
  choice: eiserne Mauern
  rationale: Die direkte Wiedergabe erhält das starke, hyperbolische Bild militärischer Entschlossenheit.
- source_word: τιτρώσκειν
  choice: zu verwunden
  rationale: Das Verb bedeutet, eine Wunde oder Verletzung zuzufügen. Die ungewöhnliche Verbindung mit eisernen Mauern wird bewusst beibehalten, statt das Bild erklärend zu glätten.
- source_word: ὄντες ἕτοιμοι
  choice: Sie waren bereit
  rationale: Die Auflösung des Partizips in einen neuen Hauptsatz ergibt klares, flüssiges Deutsch und erhält den Bezug auf ihren gestärkten Zustand.
theological_decisions:
- issue: Wiedergabe von ψυχαῖς in einer Aussage über den Mut vor dem Kampf
  choice: wurden innerlich gestärkt
  alternative: wurden in ihren Seelen gestärkt
  rationale: Die Formulierung bezeichnet hier innere Stärkung und Entschlossenheit, nicht notwendig eine technische Lehre über die menschliche Seele. Die Hauptübersetzung gibt den kontextuellen Sinn wieder; die Fußnote bewahrt die anthropologisch wörtlichere Möglichkeit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der lange griechische Satz wird zur besseren Verständlichkeit in zwei Sätze gegliedert. Das auffällige Bild, sogar eiserne Mauern zu „verwunden“, bleibt als bewusste Hyperbel des Ausgangstextes erhalten.
