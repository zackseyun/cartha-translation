  to: Als aber die Leute um Makkabäus erfuhren, dass Lysias die Festungen belagerte, flehten sie zusammen mit den Menschenmengen unter Klagen und Tränen den Herrn an, einen guten Engel zur Rettung Israels[a] zu senden.
