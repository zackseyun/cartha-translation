base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/011/006.yaml
  text: But when those around Maccabeus learned that he was besieging the strongholds[a], they, together with the crowds, pleaded with the Lord with lamentations and tears to send a good angel for the salvation of Israel.
translation:
  language: de
  text: Als aber die Leute um Makkabäus erfuhren, dass Lysias die Festungen belagerte, flehten sie zusammen mit den Menschenmengen unter Klagen und Tränen den Herrn an, einen guten Engel zur Rettung Israels[a] zu senden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zum Heil Israels“. Das griechische Wort σωτηρία kann sowohl konkrete Rettung oder Befreiung aus einer Notlage als auch Heil in einem umfassenderen Sinn bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μετέλαβον
  choice: erfuhren
  rationale: Das Verb bezeichnet hier das Erlangen einer Nachricht oder Erkenntnis; „erfuhren“ ist im Deutschen idiomatisch und kontextgerecht.
- source_word: οἱ περὶ τὸν Μακκαβαῖον
  choice: die Leute um Makkabäus
  rationale: Die Wendung bezeichnet die mit Makkabäus verbundene Gruppe, ohne ausdrücklich festzulegen, ob er selbst jeweils mitgemeint ist.
- source_word: πολιορκοῦντα
  choice: dass er … belagerte
  rationale: Das Partizip von πολιορκέω beschreibt eine andauernde Belagerung; der deutsche Nebensatz gibt den Vorgang natürlich wieder.
- source_word: τὰ ὀχυρώματα
  choice: die Festungen
  rationale: ὀχυρώματα sind befestigte Orte oder Stützpunkte; „Festungen“ bewahrt den militärischen Sinn.
- source_word: μετὰ ὀδυρμῶν καὶ δακρύων
  choice: unter Klagen und Tränen
  rationale: Die Formulierung vermittelt die starke Trauer und Verzweiflung, mit der das Gebet vorgebracht wird.
- source_word: ἱκέτευον
  choice: flehten … an
  rationale: Das Verb bezeichnet ein eindringliches, demütiges Bitten; „anflehen“ ist im modernen Deutschen klar und würdevoll.
- source_word: σὺν τοῖς ὄχλοις
  choice: gemeinsam mit den Volksmengen
  rationale: ὄχλοι verweist auf größere versammelte Menschengruppen; „Volksmengen“ erhält diesen kollektiven Charakter.
- source_word: τὸν κύριον
  choice: den Herrn
  rationale: Im jüdischen Gebetskontext bezeichnet κύριος Gott; „der Herr“ bewahrt die traditionelle und lexikalische Form.
- source_word: ἀγαθὸν ἄγγελον
  choice: einen guten Engel
  rationale: Die direkte Wiedergabe lässt offen, ob ἀγαθός besonders Güte, Wohlwollen oder hilfreiches Handeln hervorhebt.
- source_word: ἀποστεῖλαι
  choice: zu senden
  rationale: Dies ist die direkte und natürliche Wiedergabe des Infinitivs.
- source_word: πρὸς σωτηρίαν τῷ Ἰσραήλ
  choice: zur Rettung Israels
  rationale: Im unmittelbaren militärischen Krisenkontext bezeichnet σωτηρία konkret die Rettung oder Befreiung Israels; die weiter gefasste Bedeutung „Heil“ bleibt in der Fußnote sichtbar.
theological_decisions:
- issue: Wiedergabe von κύριος im jüdischen Gebetskontext
  choice: der Herr
  alternative: Gott
  rationale: Der griechische Text hat κύριος. „Der Herr“ bewahrt sowohl die Wortwahl als auch den ehrfürchtigen Schriftgebrauch, ohne den Ausdruck erklärend zu ersetzen.
- issue: Wiedergabe von σωτηρία in einer militärischen Notlage
  choice: Rettung
  alternative: Heil
  rationale: „Rettung“ entspricht dem konkreten Zusammenhang einer drohenden militärischen Gefahr. Da σωτηρία zugleich einen umfassenderen theologischen Sinn haben kann, wird „Heil“ als echte Alternative in der Fußnote genannt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Die Satzstruktur folgt dem griechischen Gedankengang, wird aber durch einen deutschen dass-Satz natürlich lesbar gemacht. Die nicht ausdrücklich identifizierte Person hinter „er“ bleibt entsprechend dem Ausgangstext unbenannt.
