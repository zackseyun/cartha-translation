  yaml_path: translation/deuterocanon/2_maccabees/011/011.yaml
  text: But springing at the enemies like lions, they struck down eleven thousand of them, and sixteen hundred cavalry; and they forced them all to flee.
translation:
  language: de
  text: Wie Löwen stürzten sie sich auf die Feinde, streckten von ihnen elftausend Mann und dazu sechzehnhundert Reiter nieder und zwangen alle zur Flucht.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λεόντινων δὲ ἐντινάξαντες εἰς τοὺς πολεμίους
  choice: Wie Löwen stürzten sie sich auf die Feinde
  rationale: Die seltene bzw. textlich auffällige Form λεόντινων wird im Kontext als löwenartiger Vergleich verstanden; ἐντινάξαντες bezeichnet einen heftigen Angriff oder ein Sich-Stürzen auf den Gegner.
- source_word: κατέστρωσαν
  choice: streckten ... nieder
  rationale: Gibt das gewaltsame Niederwerfen bzw. Töten im Kampf natürlich und würdig wieder.
- source_word: χιλίους πρὸς τοῖς μυρίοις
  choice: elftausend Mann
  rationale: Wörtlich ‚tausend zusätzlich zu den zehntausend‘, also insgesamt elftausend.
- source_word: ἱππεῖς δὲ ἑξακοσίους πρὸς χιλίοις
  choice: und dazu sechzehnhundert Reiter
  rationale: Wörtlich ‚sechshundert zusätzlich zu tausend Reitern‘; ‚Reiter‘ entspricht ἱππεῖς genauer als eine abstrakte Kollektivbezeichnung.
- source_word: τοὺς δὲ πάντας ἠνάγκασαν φεύγειν
  choice: und zwangen alle zur Flucht
  rationale: Knappe, idiomatische Wiedergabe des griechischen Kausativausdrucks, ohne die Aussage abzuschwächen.
