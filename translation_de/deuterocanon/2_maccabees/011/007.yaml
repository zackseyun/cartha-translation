base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/011/007.yaml
  text: But Maccabeus himself[a], taking up arms first, urged the others, risking danger along with him, to come to the aid of their brothers[b]; and together they also rushed out eagerly.
translation:
  language: de
  text: Der Makkabäer selbst aber griff als Erster zu den Waffen und spornte die anderen an, sich mit ihm in Gefahr zu begeben[a] und ihren Brüdern[b] zu Hilfe zu kommen. Gemeinsam und voller Eifer zogen sie aus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „mit ihm das Wagnis einzugehen“.'
    reason: lexical_alternative
  - marker: b
    text: Mit den „Brüdern“ sind hier wahrscheinlich ihre jüdischen Volksgenossen oder Verwandten gemeint.
    reason: cultural_note
lexical_decisions:
- source_word: αὐτὸς δὲ πρῶτος ὁ Μακκαβαῖος
  choice: Der Makkabäer selbst aber ... als Erster
  rationale: αὐτός betont die Person, πρῶτος seine führende Initiative. δέ wird als milder erzählerischer Übergang mit „aber“ wiedergegeben; der griechische Beiname wird als „der Makkabäer“ bewahrt.
- source_word: ἀναλαβὼν τὰ ὅπλα
  choice: griff ... zu den Waffen
  rationale: Die idiomatische deutsche Wendung gibt das Ergreifen beziehungsweise Anlegen der Waffen im militärischen Zusammenhang natürlich wieder.
- source_word: προετρέψατο τοὺς ἄλλους
  choice: ermutigte die anderen
  rationale: προτρέπω kann „anspornen“, „ermahnen“ oder „ermutigen“ bedeuten. „ermutigte“ passt zum gemeinsamen gefährlichen Einsatz, ohne einen schroffen Befehl zu unterstellen.
- source_word: ἅμα αὐτῷ διακινδυνεύοντας
  choice: die gemeinsam mit ihm die Gefahr auf sich nahmen
  rationale: Das Akkusativpartizip bezieht sich grammatisch auf „die anderen“. Die Formulierung erhält diese Zuordnung und gibt sowohl die Gemeinsamkeit als auch das bewusste Eingehen der Gefahr wieder.
- source_word: ἐπιβοηθεῖν τοῖς ἀδελφοῖς αὐτῶν
  choice: ihren Brüdern zu Hilfe zu kommen
  rationale: ἐπιβοηθέω bezeichnet das Herbeieilen oder Kommen zur Hilfe. Die konkrete Verwandtschafts- und Gemeinschaftssprache von ἀδελφοί bleibt im Haupttext erhalten.
- source_word: ὁμοῦ δὲ καὶ προθύμως ἐξώρμησαν
  choice: Und gemeinsam zogen sie voller Eifer los
  rationale: ὁμοῦ bezeichnet gemeinsames Handeln, προθύμως willige Entschlossenheit beziehungsweise Eifer und ἐξορμάω das energische Aufbrechen. „zogen ... los“ vermeidet die unbelegte Präzisierung zu einem förmlichen Angriff.
theological_decisions:
- issue: Bedeutung von ἀδελφοῖς αὐτῶν
  choice: ihren Brüdern
  alternative: ihren Volksgenossen / ihren Verwandten
  rationale: Wörtlich steht „ihren Brüdern“. Im Zusammenhang sind wahrscheinlich jüdische Volks- oder Glaubensgenossen gemeint; die Übersetzung bewahrt jedoch die vom Text gewählte Verwandtschaftssprache und erläutert den möglichen weiteren Bezug in einer Fußnote.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer militärischer Erzählweise. Die griechische Partizipialkonstruktion wird als Relativsatz wiedergegeben, damit eindeutig bleibt, dass „die anderen“ gemeinsam mit dem Makkabäer die Gefahr auf sich nahmen.
