    issue: Unklare syntaktische und semantische Anbindung von „die gemeinsam mit ihm die Gefahr auf sich nahmen“.
    rationale: Das griechische διακινδυνεύοντας bezieht sich auf „die anderen“ und steht eng bei dem Infinitiv ἐπιβοηθεῖν. Der deutsche Relativsatz kann nahelegen, die anderen hätten die Gefahr bereits auf sich genommen, bevor sie zur Hilfe aufgefordert wurden. Die Revision gibt beide Aspekte als Gegenstand der Ermutigung wieder.
