  verdict: revise
  source_fidelity: 'Die Grundbedeutung wird gut getroffen. Doch die Relativsatzkonstruktion stellt das gemeinsame Eingehen der Gefahr als bereits gegebenen Umstand dar, während das griechische Akkusativpartizip mit dem Infinitiv sinnvoll als Inhalt der Aufforderung gelesen werden kann: Die anderen sollen sich mit ihm der Gefahr aussetzen und den Brüdern helfen.'
  naturalness: Der Entwurf ist weitgehend modernes, würdiges Standarddeutsch. Die Abfolge „die ... die Gefahr auf sich nahmen, ihren Brüdern ... zu Hilfe zu kommen“ ist jedoch syntaktisch schwerfällig und lässt die Handlungsbeziehung unnötig unklar. Eine koordinierte Infinitivkonstruktion ist klarer und natürlich.
  terminology: „der Makkabäer“, „zu den Waffen greifen“, „Brüder“ und „zu Hilfe kommen“ sind angemessen. „Voller Eifer“ gibt προθύμως gut wieder. „Ausziehen“ wahrt im militärischen Kontext das energische Aufbrechen von ἐξώρμησαν, ohne einen Angriff zu behaupten.
  issues:
