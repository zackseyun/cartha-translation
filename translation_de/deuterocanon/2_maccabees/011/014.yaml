base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/011/014.yaml
  text: He persuaded him to come to terms on all the just demands[a], and that he would also persuade the king, compelling him to become their friend.
translation:
  language: de
  text: Er überzeugte ihn, sich über alle berechtigten Forderungen[a] zu einigen, und davon, dass er auch den König überzeugen und ihn dazu zwingen werde, ihr Freund zu werden.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »sich in allen berechtigten Angelegenheiten zu versöhnen« beziehungsweise »sich über alle rechtmäßigen Ansprüche zu einigen«. Das griechische συλλύεσθαι ist knapp formuliert und bezeichnet hier das Erreichen einer Verständigung.'
    reason: lexical_alternative
  - marker: b
    text: 'Das mit »dass« wiedergegebene griechische διότι kann auch kausal verstanden werden: »weil er auch den König überzeugen werde«.'
    reason: source_ambiguity
lexical_decisions:
- source_word: ἔπεισεν
  choice: Er überzeugte ihn
  rationale: Der Aorist von πείθω bezeichnet hier ein erfolgreiches Überzeugen oder Bewegen. Das im Deutschen nötige Objekt »ihn« folgt dem erschlossenen Zusammenhang und der geprüften Konsultationsfassung.
- source_word: συλλύεσθαι
  choice: sich … zu einigen
  rationale: Das komprimierte mediale Verb bezeichnet im diplomatischen Zusammenhang das Beilegen eines Konflikts beziehungsweise das Erzielen einer Einigung.
- source_word: ἐπὶ πᾶσι τοῖς δικαίοις
  choice: über alle berechtigten Forderungen
  rationale: τὰ δίκαια meint hier das, was in Verhandlungen recht und berechtigt ist, nicht eine ausdrücklich theologische Gerechtigkeit.
- source_word: διότι καὶ τὸν βασιλέα πείσει
  choice: und versicherte ihm, dass er auch den König überzeugen werde
  rationale: Die Formulierung gibt den inhaltlichen Anschluss an das Überzeugen verständlich wieder und bewahrt mit »werde« den Zukunftsbezug von πείσει; die mögliche kausale Deutung von διότι wird in einer Fußnote offengehalten.
- source_word: φίλον αὐτοῖς
  choice: ihr Freund
  rationale: Die prädikative Wendung beschreibt eine freundschaftliche beziehungsweise politisch wohlwollende Stellung ihnen gegenüber.
- source_word: ἀναγκάζων γενέσθαι
  choice: indem er ihn dazu zwinge, … zu werden
  rationale: ἀναγκάζω drückt tatsächlichen Zwang oder starken Druck aus. Die auffällige Spannung zwischen »überzeugen« und »zwingen« bleibt erhalten.
theological_decisions:
- issue: Bedeutung von τοῖς δικαίοις im politisch-rechtlichen Zusammenhang
  choice: berechtigte Forderungen
  alternative: gerechte Angelegenheiten; rechtmäßige Ansprüche
  rationale: Die Wendung betrifft Verhandlungsansprüche und soll keine zusätzliche lehrhafte Bedeutung von Gerechtigkeit eintragen.
- issue: Verhältnis von πείσει und ἀναγκάζων
  choice: überzeugen … indem er ihn dazu zwinge
  alternative: dazu bringen … ihr Freund zu werden
  rationale: Die wörtliche Spannung zwischen Überzeugung und Zwang ist im Griechischen vorhanden und wird nicht harmonisierend abgeschwächt.
- issue: Anschluss von διότι
  choice: Inhalt einer ergänzenden Versicherung
  alternative: 'kausal: weil/denn er auch den König überzeugen werde'
  rationale: Im Zusammenhang kann die Aussage als zugesicherter Inhalt verstanden werden; da διότι gewöhnlich auch kausal ist, wird diese echte Mehrdeutigkeit ausdrücklich vermerkt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die diplomatisch-rechtliche Sprache bleibt allgemein verständlich; die syntaktische Mehrdeutigkeit von διότι und die Spannung zwischen Überzeugen und Zwingen werden nicht stillschweigend aufgelöst.
