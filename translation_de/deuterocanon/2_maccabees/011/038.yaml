translation_notes:
  register: Knappe, würdevolle Briefschluss- und Datierungsformel in modernem Standarddeutsch. Die historische Monatsbezeichnung und die nicht ausdrücklich genannte Ära bleiben erhalten beziehungsweise unausgedeutet.
