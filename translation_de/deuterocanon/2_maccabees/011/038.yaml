  yaml_path: translation/deuterocanon/2_maccabees/011/038.yaml
  text: Farewell[a]. In the one hundred forty-eighth year[b], on the fifteenth day of Xanthicus.
translation:
  language: de
  text: Lebt wohl.[a] Im 148. Jahr, am fünfzehnten Tag des Monats Xanthikos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Seid gesund.« Als Briefschluss entspricht dies sinngemäß »Lebt wohl.«'
    reason: lexical_alternative
  - marker: b
    text: Xanthikos ist ein makedonischer Monatsname, der bei Datierungen nach der seleukidischen Zeitrechnung verwendet wurde.
    reason: cultural_note
lexical_decisions:
- source_word: ὑγιαίνετε
  choice: Lebt wohl
  rationale: Wörtlich bedeutet die Form »Seid gesund«; am Schluss eines Briefes dient sie jedoch als konventionelle Abschiedsformel. »Lebt wohl« gibt diese Funktion in natürlichem, würdigem Deutsch wieder.
- source_word: ἔτους
  choice: Jahr
  rationale: Der Genitiv gehört zur üblichen Datierungsformel und wird im Deutschen mit »im … Jahr« wiedergegeben.
- source_word: ἑκατοστοῦ τεσσερακοστοῦ ὀγδόου
  choice: '148.'
  rationale: Die griechische Ordinalzahl bezeichnet das 148. Jahr der zugrunde liegenden Zeitrechnung; die Ziffernschreibung ist in einer deutschen Datumsangabe klar und natürlich.
- source_word: Ξανθικοῦ
  choice: Xanthikos
  rationale: Der makedonische Monatsname wird nach der griechischen Form transliteriert und nicht durch einen modernen Monatsnamen ersetzt.
- source_word: πεντεκαιδεκάτῃ
  choice: am fünfzehnten Tag
  rationale: Die feminine Dativform setzt »Tag« voraus. Das Deutsche macht dieses im Griechischen ausgelassene Wort für eine klare Datumsangabe ausdrücklich.
