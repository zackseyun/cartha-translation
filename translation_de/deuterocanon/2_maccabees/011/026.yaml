base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/011/026.yaml
  text: Therefore you will do well to send to them and give them pledges of good faith[a], so that, knowing our intention, they may be encouraged and may gladly attend to the securing of their own affairs.
translation:
  language: de
  text: Du wirst also gut daran tun, ihnen eine Botschaft zu senden und ihnen Zusicherungen zu geben[a], damit sie unsere Absicht kennen, guten Mutes sind und sich gern um ihre eigenen Angelegenheiten kümmern.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »rechte Hände geben«; eine diplomatische Wendung für das Gewähren von Zusicherungen oder die Bekräftigung guten Glaubens.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὖ οὖν ποιήσεις
  choice: Du wirst also gut daran tun
  rationale: Die idiomatische Zukunftsform spricht eine Empfehlung aus und wird im Deutschen natürlich mit »gut daran tun« wiedergegeben.
- source_word: διαπεμψάμενος πρὸς αὐτούς
  choice: ihnen eine Botschaft zu senden
  rationale: Das Partizip bezeichnet ein Hinsenden zu ihnen; »eine Botschaft senden« vermeidet die unbelegte Festlegung auf bestimmte Boten und ist im diplomatischen Zusammenhang verständlich.
- source_word: δοὺς δεξιάς
  choice: ihnen die rechte Hand als Zeichen der Zusicherung zu geben
  rationale: Die wörtliche Bildsprache der gegebenen rechten Hand bleibt sichtbar, während »als Zeichen der Zusicherung« ihre diplomatische Bedeutung erschließt.
- source_word: τὴν ἡμετέραν προαίρεσιν
  choice: unsere Absicht
  rationale: προαίρεσις bezeichnet hier die bewusst gefasste Absicht oder den Entschluss, ohne dass ausdrücklich Wohlwollen ausgesagt wird.
- source_word: εὔθυμοί τε ὦσιν
  choice: guten Mutes sind
  rationale: Die Wendung bewahrt den Zustandscharakter des griechischen Adjektivs und dessen Sinn von Zuversicht und innerer Ermutigung.
- source_word: ἡδέως διαγίνωνται πρὸς τῇ τῶν ἰδίων ἀντιλήψει
  choice: sich gern um ihre eigenen Angelegenheiten kümmern
  rationale: Die Formulierung gibt das fortgesetzte, bereitwillige Sichbefassen mit dem Eigenen natürlich wieder und lässt offen, ob Besitz, Interessen oder allgemein eigene Belange gemeint sind.
