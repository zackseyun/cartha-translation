base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/012/010.yaml
  text: From there[a], after they had gone nine stadia, while making their march against Timotheus, Arabs fell upon him, no fewer than five thousand, and five hundred horsemen.
translation:
  language: de
  text: Nachdem sie von dort neun Stadien weitergezogen waren, marschierten sie gegen Timotheus. Da griffen ihn[a] Araber an, nicht weniger als fünftausend Mann, dazu fünfhundert Reiter.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Im Griechischen steht das Pronomen im Singular: »ihn« (αὐτῷ). Gemeint sein kann Judas als Anführer der Truppe; manche Übersetzungen geben den Bezug kollektiv mit »sie« wieder.'
    reason: Die grammatische Einzahl und der mögliche kollektive Bezug sollen transparent bleiben.
lexical_decisions:
- source_word: ἀποστάντες σταδίους ἐννέα
  choice: nachdem sie von dort neun Stadien weitergezogen waren
  rationale: Das Aoristpartizip bezeichnet das Zurücklegen einer Strecke vom bisherigen Ort aus. Die antike Maßeinheit »Stadien« bleibt ohne ungenaue moderne Umrechnung erhalten.
- source_word: ποιουμένων τὴν πορίαν ἐπὶ τὸν Τιμόθεον
  choice: marschierten sie gegen Timotheus
  rationale: Der Genitivus absolutus schildert den laufenden militärischen Vormarsch; ἐπί mit Akkusativ bezeichnet hier die feindliche Stoßrichtung gegen Timotheus.
- source_word: ἐπέβαλον
  choice: griffen … an
  rationale: Im militärischen Zusammenhang bezeichnet das Verb einen feindlichen, möglicherweise plötzlichen Angriff. »Angreifen« ist im heutigen Deutsch klar und würdig.
- source_word: Ἄραβες
  choice: Araber
  rationale: Dies ist die direkte und gegenwärtig übliche deutsche Bezeichnung für die genannte Volksgruppe.
- source_word: αὐτῷ
  choice: ihn
  rationale: Der griechische Text bietet ausdrücklich ein Pronomen im Singular. Die Übersetzung bewahrt diese Form, statt sie kontextuell zu »sie« zu ändern.
- source_word: οὐκ ἐλάττους τῶν πεντακισχιλίων
  choice: nicht weniger als fünftausend Mann
  rationale: Die Wendung gibt eine Mindestzahl an. »Mann« macht im Deutschen deutlich, dass Kämpfer gezählt werden, ohne eine zusätzliche Truppengattung festzulegen.
- source_word: ἱππεῖς δὲ πεντακόσιοι
  choice: dazu fünfhundert Reiter
  rationale: ἱππεῖς bezeichnet berittene Kämpfer. »Dazu« gibt den ergänzenden Charakter von δέ in der Zahlenangabe natürlich wieder.
