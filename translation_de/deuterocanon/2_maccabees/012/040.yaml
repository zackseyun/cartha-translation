base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/012/040.yaml
  text: But under the tunic of each of the dead they found sacred tokens of the idols of Jamnia[a], which the law forbids the Jews to have[b]; and it became clear to all that for this reason these men had fallen.
translation:
  language: de
  text: Doch unter dem Untergewand jedes Toten fand man geweihte Gegenstände[a] der Götzen aus Jamnia, von denen das Gesetz die Juden fernhält. Da wurde allen klar, dass diese Männer aus diesem Grund gefallen waren.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Heiligtümer“, „Weihegaben“ oder möglicherweise „Amulette“, die zu den Götzen aus Jamnia gehörten.'
    reason: lexical_alternative
  - marker: b
    text: „Gefallen“ ist hier eine Wendung für den Tod im Kampf.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἱερώματα
  choice: geweihte Gegenstände
  rationale: Der Ausdruck bezeichnet Gegenstände kultischer Verehrung, ohne ihre genaue Art festzulegen. Die Übersetzung vermeidet daher die stärker deutende Festlegung auf Amulette oder Weihegaben.
- source_word: χιτῶνας
  choice: Untergewand
  rationale: χιτών bezeichnet gewöhnlich ein unmittelbar am Körper getragenes Gewand. „Untergewand“ ist im Deutschen präzise und für den antiken Zusammenhang verständlich.
- source_word: τῶν ἀπὸ Ἰαμνίας εἰδώλων
  choice: der Götzen von Jamnia
  rationale: Die Wendung verbindet die Götzen beziehungsweise die zu ihnen gehörenden Kultgegenstände mit Jamnia, ohne die syntaktische Beziehung weiter festzulegen.
- source_word: ἀπήργει
  choice: fernhält
  rationale: Das Verb bezeichnet hier das gesetzliche Abhalten beziehungsweise Ausschließen. „Fernhält“ bewahrt diese Grundbedeutung, ohne wie „zu besitzen verbietet“ ein im Griechischen nicht ausdrücklich genanntes Verb zu ergänzen.
- source_word: πεπτωκέναι
  choice: gefallen waren
  rationale: Die wörtliche Kampfesrede von πίπτω wird bewahrt; im Zusammenhang bedeutet sie, dass die Männer im Kampf ums Leben gekommen waren.
- source_word: τούσδε
  choice: diese Männer
  rationale: Das Demonstrativpronomen verweist auf die zuvor genannten Toten; „diese Männer“ macht den Bezug in natürlichem Deutsch deutlich.
- source_word: διὰ τήνδε τὴν αἰτίαν
  choice: aus diesem Grund
  rationale: Die Formulierung gibt den ausdrücklich genannten ursächlichen Zusammenhang knapp und idiomatisch wieder.
theological_decisions:
- issue: Ursächlicher Zusammenhang zwischen den kultischen Gegenständen und dem Tod der Männer
  choice: „Da wurde allen klar, dass diese Männer aus diesem Grund gefallen waren.“
  alternative: Die Aussage lediglich als subjektive Vermutung der Gemeinschaft zu kennzeichnen.
  rationale: Der griechische Text sagt ausdrücklich, es sei allen klar geworden, dass die Männer aus diesem Grund gefallen waren. Die Übersetzung gibt diese Aussage wieder, ohne zusätzliche theologische Erklärung oder Abschwächung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau wurde gegenüber dem langen griechischen Satz behutsam gegliedert. „Götzen“ erhält die wertende Aussage von εἴδωλα im jüdischen Kontext; „geweihte Gegenstände“ bewahrt die Unbestimmtheit von ἱερώματα.
