  source_fidelity: 'Die Übersetzung bildet den griechischen Satzbau und die wesentlichen Aussagen zuverlässig ab: die Gegenstände werden unter dem Untergewand jedes Gefallenen gefunden, das Gesetz hält die Juden von den betreffenden Dingen bzw. Götzen fern, und der Tod der Männer wird ausdrücklich auf diesen Grund zurückgeführt. „Gefallen“ bewahrt zutreffend die kriegerische Bildsprache von πεπτωκέναι. Eine kleine Präzisierung ist bei der Herkunftsangabe angezeigt: ἀπὸ Ἰαμνίας bedeutet am unmittelbarsten „aus Jamnia“, nicht bloß die weitere Zuordnung „von Jamnia“.'
  naturalness: Modernes, würdiges Deutsch. „Unter dem Untergewand jedes Toten“ und „Da wurde allen klar“ sind klar und idiomatisch. Die Formulierung „von denen das Gesetz die Juden fernhält“ bewahrt sinnvoll die im Griechischen mögliche Bezugsoffenheit zwischen den geweihten Gegenständen und den Götzen.
  terminology: „Untergewand“ entspricht χιτών im antiken Kontext angemessen. „Geweihte Gegenstände“ gibt ἱερώματα bewusst ohne unzulässige Festlegung auf Amulette wieder. „Götzen“ ist für εἴδωλα im jüdisch-polemischen Kontext sachgerecht. „Aus Jamnia“ gibt die Präposition ἀπό genauer wieder.
