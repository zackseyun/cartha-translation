revisions:
- from: Doch unter dem Untergewand jedes Toten fand man geweihte Gegenstände der Götzen von Jamnia[a], von denen das Gesetz die Juden fernhält. Da wurde allen klar, dass diese Männer aus diesem Grund gefallen waren.[b]
  to: Doch unter dem Untergewand jedes Toten fand man geweihte Gegenstände[a] der Götzen aus Jamnia, von denen das Gesetz die Juden fernhält. Da wurde allen klar, dass diese Männer aus diesem Grund gefallen waren.[b]
  rationale: Die Revision beschränkt sich auf „aus Jamnia“, um ἀπὸ Ἰαμνίας präziser wiederzugeben, und setzt den Fußnotenanker a unmittelbar an das erläuterte Wort „Gegenstände“. Die Bezugsoffenheit der Relativformulierung „von denen“ bleibt erhalten, da die griechische Form ὧν sowohl auf die Gegenstände als auch auf die Götzen bezogen werden kann. Die Aussage über den als Ursache verstandenen Tod wird weder verstärkt noch theologisch ausgelegt.
