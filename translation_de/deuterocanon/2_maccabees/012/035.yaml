  yaml_path: translation/deuterocanon/2_maccabees/012/035.yaml
  text: But a certain Dositheus[a], one of Bacenor’s men, a horseman and a strong man, had hold of Gorgias; and seizing his cloak, he was dragging him along forcefully, intending to take the accursed man alive, when one of the Thracian horsemen rushed upon him and cut off his shoulder, and Gorgias escaped to Marisa.
translation:
  language: de
  text: Ein gewisser Dositheus, einer von Bakenors Männern, ein berittener, kräftiger Mann, hielt Gorgias fest. Er packte ihn am Mantel und schleppte ihn mit aller Kraft fort, um den Verfluchten lebend gefangen zu nehmen. Da stürmte einer der thrakischen Reiter auf ihn zu und versetzte ihm einen schweren Schlag gegen die Schulter[a]; so entkam Gorgias nach Marisa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »schlug ihm die Schulter ab« beziehungsweise »machte seine Schulter kampfunfähig«. Der griechische Ausdruck bezeichnet eine schwere Verletzung im Schulterbereich; die genaue anatomische Folge bleibt unklar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Δωσίθεος
  choice: Dositheus
  rationale: Gebräuchliche deutsche Umschrift des griechischen Personennamens.
- source_word: τῶν τοῦ Βακινόρος
  choice: einer von Bakenors Männern
  rationale: Gibt die Zugehörigkeit zu Bakenors Gruppe natürlich wieder, ohne einen militärischen Rang hinzuzufügen.
- source_word: ἔφιππος ἀνὴρ καὶ καρτερός
  choice: ein Reiter und ein kräftiger Mann
  rationale: Bewahrt sowohl die Aussage, dass Dositheus beritten war, als auch den Hinweis auf seine körperliche Stärke.
- source_word: εἶχεν τοῦ Γοργίου
  choice: hatte Gorgias gepackt
  rationale: Der Genitiv bei ἔχω bezeichnet hier das körperliche Ergreifen und Festhalten.
- source_word: λαβόμενος τῆς χλαμύδος
  choice: er ergriff ihn beim Mantel
  rationale: χλαμύς bezeichnet einen Mantel, häufig einen militärischen; die Formulierung macht klar, woran Dositheus Gorgias festhielt.
- source_word: ἦγεν αὐτὸν εὐρώστως
  choice: schleppte ihn mit aller Kraft fort
  rationale: Im Kampfzusammenhang bezeichnet ἦγεν ein gewaltsames Fortführen; εὐρώστως hebt den kräftigen Einsatz hervor.
- source_word: βουλόμενον τὸν κατάρατον λαβεῖν ζωγρείαν
  choice: um den Verfluchten lebend gefangen zu nehmen
  rationale: ζωγρείαν bezeichnet die Gefangennahme eines Lebenden; κατάρατος bleibt als scharfer erzählerischer Ausdruck erhalten.
- source_word: τῶν ἱππέων τινὸς Θρακῶν
  choice: einer der thrakischen Reiter
  rationale: Natürliche Wiedergabe eines Angehörigen der thrakischen Reiterei.
- source_word: ἐπενεχθέντος αὐτῷ
  choice: stürmte ... gegen ihn heran
  rationale: Gibt die plötzliche, feindliche Bewegung des Partizips im Kampfgeschehen wieder.
- source_word: τὸν ὦμον καθελόντος
  choice: schlug ihm die Schulter ab
  rationale: καθαιρέω kann ein Herab- oder Abschlagen bezeichnen; die drastische Formulierung bewahrt die Gewalt des griechischen Ausdrucks, während die anatomische Unschärfe in einer Fußnote vermerkt wird.
- source_word: διέφυγεν Γοργίας εἰς Μαρισά
  choice: so entkam Gorgias nach Marisa
  rationale: Gibt Flucht und Zielort knapp und idiomatisch wieder; „so“ markiert den erzählerischen Zusammenhang, ohne eine zusätzliche Ursache einzuführen.
