translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem erzählerischem Ton. Die lange griechische Satzperiode wurde zur besseren Lesbarkeit in drei Sätze gegliedert. Der feindselige Ausdruck »den Verfluchten« und die drastische, jedoch unsichere Schilderung der Schulterverletzung wurden nicht abgeschwächt; die Unsicherheit wird durch Fußnote [a] kenntlich gemacht.
