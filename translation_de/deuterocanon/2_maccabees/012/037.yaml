  yaml_path: translation/deuterocanon/2_maccabees/012/037.yaml
  text: Beginning the battle cry in the language of his fathers[a], with hymns[b], he shook those around Gorgias by surprise and put them to flight.
translation:
  language: de
  text: Er stimmte in der Sprache seiner Vorfahren[a] den von Lobgesängen begleiteten Schlachtruf an, versetzte die Männer um Gorgias unerwartet in Schrecken und schlug sie in die Flucht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in der angestammten Sprache“. Das Griechische kann die verwendete Sprache oder allgemeiner ihre überlieferte, von den Vorfahren stammende Art hervorheben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καταρξάμενος
  choice: Er stimmte … an
  rationale: Das aoristische Medium-Partizip bezeichnet die einleitende Handlung. Die finite deutsche Form mit „anstimmen“ verbindet sich natürlich mit einem Ruf und den begleitenden Lobgesängen.
- source_word: τῇ πατρίῳ φωνῇ
  choice: in der Sprache seiner Vorfahren
  rationale: πατρίῳ bezeichnet das von den Vorfahren Überkommene; φωνή kann Stimme, Rede oder Sprache bedeuten. Im Zusammenhang liegt die angestammte Sprache nahe, ohne die mögliche Nuance einer überlieferten Ausdrucksweise auszuschließen.
- source_word: τὴν μεθʼ ὕμνων κραυγήν
  choice: den von Lobgesängen begleiteten Schlachtruf
  rationale: κραυγή ist ein lauter Ruf und hat hier einen militärischen Zusammenhang; μεθʼ ὕμνων bezeichnet die Begleitung durch religiöse Lieder. „Lobgesänge“ gibt ὕμνοι würdig und verständlich wieder.
- source_word: ἐνσείσας
  choice: versetzte … in Schrecken
  rationale: Das Verb bedeutet wörtlich „erschüttern“ und bezeichnet hier die plötzliche Bestürzung der gegnerischen Truppe. Die deutsche Wendung macht die Wirkung klar, ohne den folgenden Rückzug vorwegzunehmen.
- source_word: ἀπροσδοκήτως
  choice: unerwartet
  rationale: Die adverbiale Form benennt unmittelbar das Überraschungsmoment und bleibt eng am griechischen Ausdruck.
- source_word: τοῖς περὶ τὸν Γοργίαν
  choice: die Männer um Gorgias
  rationale: Die substantivierte Wendung bezeichnet Gorgias und seine Gefolgschaft beziehungsweise Truppe. „Die Männer um Gorgias“ ist knapp und idiomatisch.
- source_word: τροπὴν ἐποιήσατο αὐτῶν
  choice: schlug sie in die Flucht
  rationale: τροπή bezeichnet im militärischen Sprachgebrauch die Wendung zur Flucht oder Niederlage. Die deutsche Redewendung bewahrt diese konkrete militärische Bedeutung.
theological_decisions:
- issue: Religiöser Charakter des Kampfrufs
  choice: Der Schlachtruf wird als von Lobgesängen begleitet dargestellt.
  alternative: Ein reiner Lobpreisruf oder ein bloß weltlicher Kampfruf.
  rationale: μεθʼ ὕμνων und κραυγή verbinden ausdrücklich kultisch-religiösen Gesang mit militärischem Rufen. Beide Aspekte bleiben erhalten, ohne darüber hinaus eine Lehraussage einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzfolge bildet die rasche Bewegung vom Anstimmen des Rufes über die überraschende Erschütterung des Gegners bis zu dessen Flucht ab.
