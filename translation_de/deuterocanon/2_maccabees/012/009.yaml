  text: And making a night attack on the people of Jamnia[a], he set the harbor and the fleet on fire, so that the rays of the light were visible as far as Jerusalem[b], it being two hundred forty stadia away.
translation:
  language: de
  text: Dann griff er die Einwohner von Jamnia bei Nacht an und setzte den Hafen samt der Flotte in Brand. Der Lichtschein war bis nach Jerusalem zu sehen – bei einer Entfernung von zweihundertvierzig Stadien[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ein Stadion war ein antikes Längenmaß. Zweihundertvierzig Stadien entsprechen ungefähr 43–45 Kilometern.
    reason: cultural_note
lexical_decisions:
- source_word: τοῖς Ἰαμνίταις
  choice: die Einwohner von Jamnia
  rationale: Der Dativ bezeichnet bei ἐπιβαλών das Angriffsziel. Die Formulierung ist im modernen Deutschen natürlicher als „die Jamniten“ und wahrt den geografischen Bezug.
- source_word: νυκτὸς ἐπιβαλών
  choice: griff ... bei Nacht an
  rationale: Die partizipiale Wendung bezeichnet einen nächtlichen, wohl überraschenden Angriff; die finite Form fügt sich flüssig in den deutschen Erzählstil ein.
- source_word: ἐνέπρησεν
  choice: setzte ... in Brand
  rationale: Das Verb bedeutet, etwas anzuzünden beziehungsweise in Brand zu setzen, und passt zu Hafen und Flotte als Objekten.
- source_word: τὸν λιμένα σὺν τῷ στόλῳ
  choice: den Hafen samt der Flotte
  rationale: λιμήν ist der Hafen; στόλος bezeichnet hier den Schiffsverband beziehungsweise die Flotte. „samt“ gibt σύν knapp und präzise wieder.
- source_word: τὰς αὐγὰς τοῦ φέγγους
  choice: der Lichtschein
  rationale: Die wörtliche Verbindung „Strahlen des Lichtscheins“ wirkt im Deutschen redundant. „Lichtschein“ bewahrt den sichtbaren Helligkeitseindruck, ohne die im Griechischen nur kontextuell erschlossene Brandquelle ausdrücklich einzusetzen.
- source_word: εἰς τὰ Ἱεροσόλυμα
  choice: bis nach Jerusalem
  rationale: εἰς bezeichnet hier die räumliche Reichweite der Sichtbarkeit.
- source_word: σταδίων ὄντων διακοσίων τεσσεράκοντα
  choice: obwohl es zweihundertvierzig Stadien entfernt war
  rationale: Der Genitivus absolutus nennt die Entfernung. Die konzessive Formulierung bringt die bemerkenswerte Sichtweite natürlich zum Ausdruck, auch wenn der griechische Ausdruck selbst primär begleitend ist.
