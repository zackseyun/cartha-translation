  yaml_path: translation/deuterocanon/2_maccabees/012/016.yaml
  text: And when they had taken the city by the will of God[a], they made an immeasurable slaughter, so that the nearby lake, having a width of two stadia, appeared to be overflowing[b], filled with blood.
translation:
  language: de
  text: Und als sie die Stadt nach Gottes Willen eingenommen hatten, richteten sie ein unermessliches Blutbad an, sodass der nahe gelegene See, der zwei Stadien[a] breit war, voll Blut zu sein schien, das herabströmte.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ein Stadion war ein antikes Längenmaß; zwei Stadien entsprechen ungefähr 370 Metern.
    reason: cultural_note
  - marker: b
    text: Die griechische Schlusswendung ist bildhaft und syntaktisch schwierig. Sie verbindet den Anschein, dass der See voll Blut war, mit der Vorstellung herabströmenden Blutes, ohne dessen genaue Fließrichtung eindeutig zu bestimmen.
    reason: lexical_alternative
lexical_decisions:
- source_word: καταλαβόμενοι
  choice: als sie … eingenommen hatten
  rationale: Das Aoristpartizip bezeichnet im militärischen Zusammenhang die Einnahme der Stadt und wird im Deutschen natürlich als vorzeitiger Nebensatz wiedergegeben.
- source_word: τῇ τοῦ θεοῦ θελήσει
  choice: nach Gottes Willen
  rationale: Die Dativfügung kann Mittel oder Übereinstimmung ausdrücken. „Nach Gottes Willen“ bewahrt die ausdrückliche theologische Zuschreibung, ohne sie über den Wortlaut hinaus zu entfalten.
- source_word: ἀμυθήτους … σφαγάς
  choice: ein unermessliches Blutbad
  rationale: ἀμύθητος bezeichnet etwas nicht Erzähl- oder Bezifferbares; σφαγή meint massenhaftes Töten. Die deutsche Wendung gibt die hyperbolische Gewalt des griechischen Plurals idiomatisch wieder.
- source_word: παρακειμένην λίμνην
  choice: der nahe gelegene See
  rationale: παράκειμαι bezeichnet die räumliche Nähe; λίμνη meint hier am natürlichsten einen See beziehungsweise ein stehendes Gewässer.
- source_word: τὸ πλάτος ἔχουσαν σταδίους δύο
  choice: der zwei Stadien breit war
  rationale: Die Formulierung gibt die angegebene Breite knapp und natürlich wieder und lässt das antike Maß im Text stehen.
- source_word: καταρρεῖν τὸ αἷμα πεπληρωμένην φαίνεσθαι
  choice: mit Blut gefüllt zu überströmen schien
  rationale: Die Wiedergabe erhält φαίνεσθαι als Wahrnehmungs- beziehungsweise Erscheinungsaussage, πεπληρωμένην als „gefüllt“ und die lebhafte Fließbewegung von καταρρεῖν, ohne die schwer bestimmbare Richtung des Fließens festzulegen.
theological_decisions:
- issue: Göttlicher Wille bei der Einnahme der Stadt
  choice: nach Gottes Willen
  alternative: durch Gottes Willen
  rationale: Der griechische Text bringt die Einnahme ausdrücklich mit Gottes Willen in Verbindung. „Nach“ erhält die mögliche Bedeutung der Übereinstimmung und vermeidet, die grammatisch mögliche Mittelbedeutung als alleinige Deutung festzuschreiben.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Blutbad“ vermittelt die Gewalt von σφαγαί natürlicher als das im heutigen Deutsch ungebräuchliche „Schlachtungen“. Die Stellung der Fußnotenmarker ordnet [a] dem antiken Maß und [b] der mehrdeutigen Schlusswendung zu.
