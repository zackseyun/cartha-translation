  yaml_path: translation/deuterocanon/2_maccabees/012/001.yaml
  text: After these agreements had been made[a], Lysias went away to the king[b], but the Jews occupied themselves with farming.
translation:
  language: de
  text: Nachdem diese Vereinbarungen getroffen worden waren, ging Lysias zum König, die Juden aber widmeten sich der Landwirtschaft.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Γενομένων
  choice: getroffen worden waren
  rationale: Der Aoristpartizip im Genitivus absolutus bezeichnet den Abschluss der Vereinbarungen vor den folgenden Handlungen; die deutsche Wendung ist natürlich und wahrt die zeitliche Abfolge.
- source_word: συνθηκῶν
  choice: Vereinbarungen
  rationale: Der Ausdruck bezeichnet Abmachungen oder Übereinkünfte. „Vereinbarungen“ ist weit genug und vermeidet die möglicherweise zu enge staatsrechtliche Bedeutung von „Verträge“.
- source_word: ἀπῆε
  choice: ging
  rationale: Das Imperfekt bezeichnet hier, dass Lysias sich entfernte beziehungsweise zum König begab. „Ging“ gibt dies knapp und idiomatisch wieder.
- source_word: πρὸς τὸν βασιλέα
  choice: zum König
  rationale: πρός mit Akkusativ bezeichnet die Richtung auf eine Person hin. Ein „zurück“ wird nicht ergänzt, da es im Griechischen nicht ausdrücklich steht.
- source_word: περὶ τὴν γεωργίαν ἐγίνοντο
  choice: widmeten sich der Landwirtschaft
  rationale: Die Verbindung ist idiomatisch und beschreibt, dass die Juden sich mit landwirtschaftlicher Arbeit beschäftigten. Die Wiedergabe klingt im modernen Deutschen natürlich, ohne die Bedeutung unnötig einzuengen.
