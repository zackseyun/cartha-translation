  text: But of the local commanders[a], Timotheus and Apollonius son of Gennaeus, and further Hieronymus and Demophon, and besides these Nicanor the Cypriarch, would not let them live in peace.
translation:
  language: de
  text: Doch die örtlichen Befehlshaber – Timotheus und Apollonius, der Sohn des Gennaios, außerdem Hieronymus und Demophon sowie Nikanor, der Kypriarch[a] – ließen sie nicht in Frieden leben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Griechisch „Kypriarch“: ein Amtstitel mit Bezug zu Zypern; seine genaue Bedeutung und sein Amtsrang sind unklar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τῶν ... κατὰ τόπον στρατηγῶν
  choice: die Befehlshaber in den einzelnen Gebieten
  rationale: κατὰ τόπον bezeichnet eine örtliche beziehungsweise regionale Zuständigkeit. Die Wiedergabe wahrt diesen administrativen Sinn, ohne einen bestimmten militärischen Rang vorauszusetzen.
- source_word: ὁ τοῦ Γενναίου
  choice: der Sohn des Gennaios
  rationale: Die Verbindung aus Artikel und Genitiv dient hier als Patronym und wird im Deutschen am klarsten mit „der Sohn des Gennaios“ wiedergegeben.
- source_word: ἔτι δὲ
  choice: außerdem
  rationale: Das Wort führt weitere Namen in derselben Aufzählung an und klingt im modernen Deutsch natürlich.
- source_word: πρὸς δὲ τούτοις
  choice: sowie
  rationale: Die Wendung fügt Nikanor den bereits genannten Personen hinzu; „sowie“ gibt diese additive Funktion knapp wieder.
- source_word: ὁ Κυπριάρχης
  choice: der Kypriarch[a]
  rationale: Die Transliteration bewahrt den ungewöhnlichen griechischen Amtstitel, dessen genauer Rang nicht sicher aus dem Ausdruck hervorgeht. Eine Fußnote erschließt seine wörtliche Beziehung zu Zypern.
- source_word: οὐκ εἴων
  choice: ließen ... nicht
  rationale: Der Imperfekt bezeichnet ein andauerndes Verhindern beziehungsweise eine fortgesetzte Weigerung; die deutsche Formulierung ist idiomatisch und wahrt den durativen Zusammenhang.
- source_word: ἡσυχίαν ἄγειν
  choice: in Frieden leben
  rationale: Die griechische Wendung meint, ein ruhiges, unbehelligtes Leben zu führen. Im Kontext feindlicher Amtsträger trifft „in Frieden leben“ den Sinn natürlich.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Gedankenstriche gliedern die lange Namensliste und machen deutlich, dass die genannten Personen die zuvor bezeichneten regionalen Befehlshaber sind. Der seltene Amtstitel bleibt zur Wahrung der Quellenform stehen und wird in der Fußnote erklärt.
