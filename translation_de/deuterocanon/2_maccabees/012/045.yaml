  text: for if he was looking to the splendid reward laid up for those who have fallen asleep in godliness[a], the thought was holy and devout. Therefore he made atonement for the dead[b], so that they might be released from sin.
translation:
  language: de
  text: Denn wenn er auf die herrlichste Belohnung blickte, die für diejenigen bereitliegt, die in Gottesfurcht entschlafen sind[a], war der Gedanke heilig und fromm. Deshalb vollzog er für die Toten Sühne[b], damit sie von der Sünde befreit würden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder möglicherweise: „die herrlichste Gabe, die bereitliegt“. Das hier verwendete griechische Wort εὐχαριστήριον ist ungewöhnlich und kann eine Dankesgabe bezeichnen; im Zusammenhang kann es auch im Sinn einer vorbehaltenen Wohltat oder Belohnung verstanden werden.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „bewirkte er für die Toten Entsühnung“ beziehungsweise „Versöhnung“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶτε
  choice: Denn wenn
  rationale: Bewahrt die bedingt-begründende Verknüpfung mit dem vorausgehenden Zusammenhang, ohne sie eindeutig kausal aufzulösen.
- source_word: ἐμβλέπων
  choice: er ... blickte
  rationale: Gibt die bildhafte, zielgerichtete Hinwendung zu der künftig bereitliegenden Belohnung wieder.
- source_word: τοῖς μετʼ εὐσεβίας κοιμωμένοις
  choice: die in Gottesfurcht entschlafen sind
  rationale: „Entschlafen“ bewahrt den griechischen Euphemismus für den Tod; „in Gottesfurcht“ gibt εὐσέβεια in natürlichem, religiösem Deutsch wieder.
- source_word: κάλλιστον ἀποκείμενον εὐχαριστήριον
  choice: die herrliche Belohnung, die ... bereitliegt
  rationale: „Herrlich“ trägt den Superlativwert von κάλλιστον idiomatisch; „Belohnung“ ergibt mit ἀποκείμενον im Kontext einen verständlichen Sinn, während die ungewöhnliche Wortwahl in einer Fußnote offengehalten wird.
- source_word: ὁσία καὶ εὐσεβὴς ἡ ἐπίνοια
  choice: war der Gedanke heilig und fromm
  rationale: Gibt die doppelte religiös-ethische Wertung knapp und würdig wieder; „Gedanke“ lässt sowohl Überlegung als auch Absicht zu.
- source_word: ὅθεν
  choice: Deshalb
  rationale: Kennzeichnet die Folgerung aus der vorausgehenden Beurteilung.
- source_word: περὶ τῶν τεθνηκότων
  choice: für die Toten
  rationale: Ist im Deutschen idiomatisch und bezeichnet die Begünstigten der Handlung, ohne eine bestimmte spätere Lehrform festzulegen.
- source_word: τὸν ἐξιλασμὸν ἐποιήσατο
  choice: vollzog er ... Sühne
  rationale: „Sühne vollziehen“ ist verständlich und kultisch angemessen; es vermeidet die Festlegung auf eine engere Theorie von Sühne oder Versöhnung.
- source_word: τῆς ἁμαρτίας ἀπολυθῆναι
  choice: damit sie von der Sünde befreit würden
  rationale: Bewahrt die finale beziehungsweise konsekutive Aussage und das passive Bild der Befreiung von Sünde.
theological_decisions:
- issue: Art des nach dem Tod erhofften Nutzens der Sühnehandlung
  choice: Der Text sagt unmittelbar, dass für die Toten Sühne vollzogen wurde, damit sie von der Sünde befreit würden.
  alternative: Die Aussage lediglich als Gedächtnishandlung zu verstehen oder sie ausdrücklich in ein später ausgearbeitetes Lehrsystem einzuordnen.
  rationale: Die Übersetzung wahrt die ausdrückliche Aussage des Griechischen, ohne sie durch spätere konfessionelle Deutungen einzuschränken oder auszuweiten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit verständlicher biblischer Bildsprache. „Entschlafen“ ist bewusst als geläufiger religiöser Euphemismus beibehalten; ungewöhnliche und theologisch gewichtige Begriffe werden nicht paraphrasierend eingeebnet.
