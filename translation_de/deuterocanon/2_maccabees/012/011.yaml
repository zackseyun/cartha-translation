review_pass:
  verdict: revise
  source_fidelity: Die Wiedergabe der Kampfstärke, der göttlichen Hilfe, der geschwächten Nomaden und der Geste mit der rechten Hand entspricht dem griechischen Text gut. βοσκήματα bezeichnet hier jedoch eher Vieh bzw. Herden als Weidemöglichkeiten. Das überlieferte Satzende ist tatsächlich schwierig, doch die Fußnote sollte die daraus folgende unsichere syntaktische Zuordnung präziser und ohne die unzutreffende Bezeichnung einer bloßen „abweichenden Verbform“ erläutern.
  naturalness: Der Text ist gut verständliches modernes Standarddeutsch. „Hilfe Gottes“ ist idiomatischer als „Hilfe von Gott“. Die ausdrückliche Nennung von Judas und seinen Leuten beim Nutzenversprechen verhindert ein missverständliches „ihnen“.
  terminology: „Erbitterter Kampf“, „Leute um Judas“, „Nomaden“ und „die rechte Hand reichen“ sind angemessen. „Vieh“ trifft βοσκήματα im vorliegenden Kontext besser als „Weidemöglichkeiten“. Die Fußnote zur rechten Hand sollte von Friedensschluss oder Bündnis sprechen, nicht von „Bündnistreue“.
  issues:
  - severity: medium
    issue: βοσκήματα wird als „Weidemöglichkeiten“ wiedergegeben.
    rationale: Das Wort bezeichnet in diesem Kontext am ehesten Vieh/Herden (gegebenenfalls auch Futter), nicht primär Weideland oder Möglichkeiten zum Weiden. „Vieh zu geben“ ist die naheliegendere und weniger umschreibende Wiedergabe.
  - severity: low
    issue: Die Fußnote b beschreibt den Befund als „abweichende Verbform“.
    rationale: Die überlieferte Form ὠφέλησεν steht zwar auffällig neben dem von ὑπισχνούμενοι abhängigen Infinitiv δώσειν, doch das Problem betrifft die Konstruktion bzw. den Wortlaut am Satzende. Die Erläuterung sollte keine spezifische textkritische Diagnose behaupten.
  - severity: low
    issue: Die Referenz von „ihnen künftig von Nutzen zu sein“ bleibt im Deutschen unnötig unklar.
    rationale: Der Sinn des Angebots ist Hilfe für Judas und seine Leute; deren ausdrückliche Nennung macht die im schwierigen griechischen Satzende gemeinte Zuordnung verständlich, ohne den Grad der Hilfe zu erweitern.
