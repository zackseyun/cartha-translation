revisions:
- from: Als es aber zu einem erbitterten Kampf gekommen war und die Leute um Judas dank der Hilfe von Gott Erfolg hatten, baten die geschwächten Nomaden Judas, ihnen die rechte Hand zu reichen.[a] Dabei versprachen sie, Weidemöglichkeiten bereitzustellen und ihnen künftig von Nutzen zu sein.[b]
  to: Als es aber zu einem erbitterten Kampf gekommen war und die Leute um Judas dank der Hilfe Gottes Erfolg hatten, baten die geschwächten Nomaden Judas, ihnen die rechte Hand zu reichen[a]. Dabei versprachen sie, Vieh zu geben und Judas und seinen Leuten künftig von Nutzen zu sein[b].
  rationale: Die Revision ersetzt die zu enge bzw. unzutreffende Wiedergabe von βοσκήματα durch „Vieh“, verbessert die idiomatische Gottesbezeichnung und präzisiert die Fußnoten. Sie bewahrt die Aussage des schwierigen Satzendes als kontextgeleitete Wiedergabe und weist weiterhin transparent auf dessen grammatische Schwierigkeit hin.
