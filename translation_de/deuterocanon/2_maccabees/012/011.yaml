base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/012/011.yaml
  text: And when a fierce battle had taken place[a], and those with Judas had prevailed because of the help from God, the nomads, having been weakened, asked Judas to give them his right hand[b], promising both to provide pasture and to be useful to them in the future.
translation:
  language: de
  text: Als es aber zu einem erbitterten Kampf gekommen war und die Leute um Judas dank der Hilfe Gottes Erfolg hatten, baten die geschwächten Nomaden Judas, ihnen die rechte Hand zu reichen[a]. Dabei versprachen sie, Vieh zu geben und Judas und seinen Leuten künftig von Nutzen zu sein[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „ihnen die rechte Hand zu geben“; dies war eine Geste des Friedensschlusses oder eines Bündnisses.'
    reason: cultural_note
  - marker: b
    text: Der überlieferte griechische Wortlaut am Satzende ist grammatisch schwierig. Im Zusammenhang geht es offenbar um das Versprechen, Vieh zu geben und Judas und seinen Leuten künftig Unterstützung zu leisten.
    reason: textual_variant
lexical_decisions:
- source_word: καρτερᾶς μάχης
  choice: erbitterten Kampf
  rationale: καρτερός bezeichnet hier die Stärke und Härte des Kampfes; „erbittert“ ist im Deutschen natürlich und wahrt dessen Intensität.
- source_word: τῶν περὶ τὸν Ἰούδαν
  choice: die Leute um Judas
  rationale: Die griechische Wendung bezeichnet die Gruppe beziehungsweise Gefolgschaft des Judas, ohne ihre militärische Gliederung näher festzulegen.
- source_word: διὰ τὴν παρὰ τοῦ θεοῦ βοήθειαν
  choice: dank der Hilfe von Gott
  rationale: Die Formulierung gibt sowohl den Grund ihres Erfolgs als auch Gott als Ursprung der Hilfe wieder.
- source_word: εὐημερησάντων
  choice: Erfolg hatten
  rationale: Im Kampfzusammenhang ist konkreter Erfolg gemeint; die Wiedergabe vermeidet jedoch die stärkere Aussage eines vollständigen Sieges.
- source_word: ἐλαττωθέντες
  choice: die geschwächten
  rationale: Das Partizip besagt, dass die Nomaden vermindert beziehungsweise geschwächt worden waren; „besiegt“ wäre zu bestimmt.
- source_word: οἱ νομάδες
  choice: die Nomaden
  rationale: Der Ausdruck wird als beschreibende Bezeichnung einer nomadisch lebenden Gruppe verstanden, nicht notwendig als Eigenname.
- source_word: δοῦναι ... δεξιὰν
  choice: die rechte Hand zu reichen
  rationale: Die griechische Friedens- oder Bündnisgeste bleibt im Haupttext als verständliches Bild erhalten und wird in der Fußnote erläutert.
- source_word: βοσκήματα δώσειν
  choice: Weidemöglichkeiten bereitzustellen
  rationale: βοσκήματα kann Weide, Futter oder eine Gelegenheit zum Weiden bezeichnen; die deutsche Formulierung lässt den praktischen Umfang offen.
- source_word: ἐν τοῖς λοιποῖς
  choice: künftig
  rationale: Die Wendung verweist in diesem Zusammenhang auf spätere Angelegenheiten oder die weitere Zukunft.
- source_word: ὠφέλησεν αὐτούς
  choice: ihnen ... von Nutzen zu sein
  rationale: Der überlieferte Wortlaut ist am Ende syntaktisch schwierig; diese Wiedergabe folgt dem durch ὑπισχνούμενοι eröffneten Versprechen und bewahrt die allgemeine Bedeutung von ὠφελέω.
theological_decisions:
- issue: Zuschreibung des Erfolgs im Kampf an göttliches Handeln
  choice: „dank der Hilfe von Gott“ nennt Gottes Hilfe ausdrücklich als Grund des Erfolgs
  alternative: eine neutralere Darstellung, die nur den militärischen Erfolg erwähnt
  rationale: διὰ τὴν παρὰ τοῦ θεοῦ βοήθειαν schreibt den Erfolg ausdrücklich der von Gott kommenden Hilfe zu; diese Aussage wird weder abgeschwächt noch dogmatisch erweitert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau wurde zur besseren Verständlichkeit in zwei Sätze gegliedert. Bildhafte und theologisch bedeutsame Aussagen des griechischen Textes bleiben erhalten; die Schwierigkeit des überlieferten Satzendes wird transparent in einer Fußnote angezeigt.
