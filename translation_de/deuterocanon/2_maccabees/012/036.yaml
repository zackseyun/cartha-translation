base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/012/036.yaml
  text: But those with Esdrin were fighting for a longer time and were exhausted[a], so Judas called on the Lord to appear as an ally and as the leader of the battle.
translation:
  language: de
  text: Als aber die Männer um Esdrin schon längere Zeit kämpften und erschöpft waren, rief Judas den Herrn an, er möge als Verbündeter und als Führer im Kampf erscheinen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „er möge sich als Verbündeter und als Führer im Kampf zeigen.“ Das griechische Wort kann besonders jemanden bezeichnen, der vorausgeht und den Weg weist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τῶν δὲ περὶ τὸν Ἔσδριν
  choice: Als aber die Männer um Esdrin
  rationale: Die Wendung περὶ mit einem Personennamen bezeichnet die zu dieser Person gehörende Gruppe. „Die Männer um Esdrin“ ist im militärischen Zusammenhang natürlich, ohne Esdrins genaue Befehlsstellung festzulegen.
- source_word: ἐπὶ πλεῖον μαχομένων
  choice: schon längere Zeit kämpften
  rationale: ἐπὶ πλεῖον bezeichnet hier am ehesten die längere Dauer des Kampfes. „Schon“ verdeutlicht idiomatisch, dass der Kampf bereits geraume Zeit andauerte.
- source_word: κατακόπων ὄντων
  choice: erschöpft waren
  rationale: κατάκοπος bezeichnet starke Ermüdung infolge von Anstrengung; „erschöpft“ gibt dies klar und ohne Übertreibung wieder.
- source_word: ἐπικαλεσάμενος
  choice: rief ... an
  rationale: Im Gebetszusammenhang bedeutet das Verb, sich bittend an Gott zu wenden. „Den Herrn anrufen“ ist zugleich verständlich und würdig.
- source_word: τὸν κύριον
  choice: den Herrn
  rationale: κύριος bezeichnet hier den von Judas angerufenen Gott; „der Herr“ ist die angemessene traditionelle und kontextgerechte Wiedergabe.
- source_word: σύμμαχον
  choice: als Verbündeter
  rationale: σύμμαχος meint einen Mitstreiter oder militärischen Verbündeten und bewahrt damit den kriegerischen Bildgehalt.
- source_word: προοδηγὸν ... τοῦ πολέμου
  choice: als Wegbereiter im Kampf
  rationale: προοδηγός bezeichnet jemanden, der vorausgeht und den Weg weist. „Wegbereiter im Kampf“ erhält dieses räumlich-militärische Bild besser als das allgemeinere „Anführer“.
- source_word: φανῆναι
  choice: erscheinen
  rationale: Das Verb bezeichnet ein Sichtbar- oder Offenbarwerden. „Erscheinen“ wahrt offen, ob eine sichtbare Manifestation oder erfahrbares göttliches Eingreifen gemeint ist.
theological_decisions:
- issue: Wiedergabe von κύριος beim Gebet zu Gott
  choice: den Herrn
  alternative: den Gebieter
  rationale: Judas ruft Gott um Beistand an. „Herr“ bewahrt den religiösen Klang und vermeidet eine unnötige Abschwächung.
- issue: Art des göttlichen Erscheinens in φανῆναι
  choice: er möge ... erscheinen
  alternative: er möge sich als ... erweisen
  rationale: Der griechische Ausdruck lässt offen, ob an sichtbares Erscheinen oder an manifestes Eingreifen gedacht ist. „Erscheinen“ erhält diese theologische Spannung.
- issue: Gottes Rolle als προοδηγός
  choice: Wegbereiter im Kampf
  alternative: Anführer des Kampfes
  rationale: Die gewählte Fassung bewahrt das Bild dessen, der vorausgeht, ohne daraus eine präzise militärische Rangbezeichnung zu machen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur ist gegenüber dem griechischen Genitivus absolut natürlich geglättet; die fortdauernde Kampfsituation, die Erschöpfung und die doppelte militärische Rollenbeschreibung Gottes bleiben erhalten.
