  text: So they all blessed the righteous Judge[a], the Lord, who makes the hidden things manifest,
translation:
  language: de
  text: Da priesen sie alle das Walten[a] des Herrn, des gerechten Richters, der das Verborgene offenbar macht,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »die Dinge des Herrn, der gerecht richtet«. Die griechische Formulierung ist elliptisch und kann sich auf sein Handeln, seine Taten oder sein Walten beziehen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντες οὖν εὐλογήσαντες
  choice: Da priesen sie alle
  rationale: Das aoristische Partizip wird im fortlaufenden deutschen Satz als beigeordnete Handlung wiedergegeben. „priesen“ ist für an Gott gerichtetes εὐλογέω natürlich und würdevoll; οὖν wird durch „Da“ im folgernden Sinn aufgenommen.
- source_word: τὰ τοῦ δικαιοκρίτου κυρίου
  choice: das Walten des Herrn, des gerechten Richters
  rationale: τὰ mit Genitiv ist elliptisch und bezeichnet hier das, was vom Herrn ausgeht beziehungsweise sein Handeln. „Walten“ lässt die im Griechischen offene Bedeutung weiter als „Taten“ und passt zum gerechten Gericht im Kontext; die Ellipse wird in einer Fußnote kenntlich gemacht.
- source_word: δικαιοκρίτου
  choice: des gerechten Richters
  rationale: Das Kompositum bezeichnet einen, der gerecht richtet. Die Formulierung bewahrt sowohl den Gedanken der Gerechtigkeit als auch den des Richtens.
- source_word: κυρίου
  choice: des Herrn
  rationale: κύριος ist hier Gottes ehrfürchtiger Titel und wird entsprechend mit „Herr“ wiedergegeben.
- source_word: τὰ κεκρυμμένα
  choice: das Verborgene
  rationale: Das substantivierte Partizip bezeichnet verborgene Dinge kollektiv. „das Verborgene“ ist im Deutschen prägnant und bewahrt den substantivischen Charakter.
- source_word: φανερὰ ποιοῦντος
  choice: offenbar macht
  rationale: 'Die Wendung wird kausativ und formal nah wiedergegeben: Der Herr macht sichtbar beziehungsweise offenbar, was verborgen ist.'
theological_decisions:
- issue: Elliptische Wendung τὰ τοῦ δικαιοκρίτου κυρίου
  choice: das Walten des Herrn, des gerechten Richters
  alternative: die Taten / die Dinge des Herrn, des gerechten Richters
  rationale: Das Griechische benennt nicht ausdrücklich, worauf sich das substantivierte Neutrum bezieht. „Walten“ beschreibt Gottes gerechtes Handeln, ohne es auf einzelne Taten zu verengen; die wörtlichere Offenheit bleibt in der Fußnote sichtbar.
- issue: Wiedergabe von κύριος als Gottesbezeichnung
  choice: Herr
  alternative: Gebieter
  rationale: „Herr“ ist die übliche und sachgerechte Wiedergabe des göttlichen Titels, ohne eine zusätzliche konfessionelle Deutung einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das Präteritum fügt sich in die Erzählung ein; das abschließende Komma bleibt stehen, weil der griechische Vers syntaktisch in den folgenden Zusammenhang weiterführt.
