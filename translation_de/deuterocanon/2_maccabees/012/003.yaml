  text: Ἰοππῖται δὲ τηλικοῦτο συνετελέσαντο δυσσέβημα, παρακαλέσαντες τοὺς ἐν ἑαυτοῖς οἰκοῦντας Ἰουδαίους ἐμβῆναι εἰς τὰ παρακατασταθέντα ὑπʼ αὐτῶν σκάφη σὺν γυναιξὶ καὶ τέκνοις, ὡς μηδεμίας ἐνεστώσης πρὸς αὐτοὺς δυσμενείας·
