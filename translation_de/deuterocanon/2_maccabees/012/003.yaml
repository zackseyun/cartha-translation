base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/012/003.yaml
  text: 'But the people of Joppa committed such a great act of impiety: they invited the Jews living among them to embark, with their wives and children, in the boats provided by them, as though there were no hostility toward them at all;'
translation:
  language: de
  text: 'Die Einwohner von Joppe aber begingen eine so schwere Freveltat: Sie luden die bei ihnen lebenden Juden ein, mit ihren Frauen und Kindern die von ihnen bereitgestellten Boote zu besteigen, als bestünde keinerlei Feindseligkeit gegen sie.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰοππῖται
  choice: die Einwohner von Joppe
  rationale: Die bürgerlich-ethnische Bezeichnung meint die Bevölkerung Joppes; diese Wiedergabe ist im modernen Deutsch natürlich und bewahrt den kollektiven Sinn.
- source_word: τηλικοῦτο
  choice: eine so schwere
  rationale: Das Wort hebt das Ausmaß der Tat hervor. Im Deutschen verbindet sich „schwer“ idiomatisch mit „Freveltat“ und erhält die emphatische Wertung.
- source_word: συνετελέσαντο
  choice: begingen
  rationale: In Verbindung mit einer bösen Tat bezeichnet das Verb deren Ausführung; „begingen“ ist dafür die treffende deutsche Kollokation.
- source_word: δυσσέβημα
  choice: Freveltat
  rationale: Der Ausdruck bezeichnet eine Tat mit religiös-moralischem Gewicht, nicht bloß allgemeines Unrecht. „Freveltat“ wahrt diese Dimension in würdigem, verständlichem Deutsch.
- source_word: παρακαλέσαντες
  choice: sie luden … ein
  rationale: Im Zusammenhang handelt es sich um eine scheinbar freundliche, tatsächlich arglistige Einladung; „einladen“ gibt diese soziale Handlung passend wieder.
- source_word: τοὺς ἐν ἑαυτοῖς οἰκοῦντας Ἰουδαίους
  choice: die bei ihnen lebenden Juden
  rationale: Die Formulierung bezeichnet Juden, die innerhalb ihrer Gemeinschaft wohnten, ohne mehr über ihren rechtlichen Status auszusagen.
- source_word: ἐμβῆναι
  choice: zu besteigen
  rationale: Das Verb bezeichnet hier das Anbordgehen. Mit „Boote“ ist „besteigen“ präzise und natürlich.
- source_word: τὰ παρακατασταθέντα ὑπʼ αὐτῶν σκάφη
  choice: die von ihnen bereitgestellten Boote
  rationale: παρακατασταθέντα bezeichnet das Bereitstellen oder Verfügbarmachen, σκάφη kleinere Wasserfahrzeuge beziehungsweise Boote.
- source_word: σὺν γυναιξὶ καὶ τέκνοις
  choice: zusammen mit Frauen und Kindern
  rationale: Das Griechische enthält kein ausdrückliches Possessivpronomen. Die deutsche Form wahrt diese formale Offenheit, wobei der Zusammenhang die Familienzugehörigkeit nahelegt.
- source_word: ὡς μηδεμίας ἐνεστώσης πρὸς αὐτοὺς δυσμενείας
  choice: als bestünde keinerlei Feindseligkeit gegen sie
  rationale: Die Genitivus-absolutus-Konstruktion beschreibt den trügerischen Anschein. „Keinerlei“ gibt die starke Verneinung μηδεμίας wieder.
theological_decisions:
- issue: Religiös-moralische Kraft von δυσσέβημα
  choice: Freveltat
  alternative: böse Tat; gottlose Tat
  rationale: „Freveltat“ erhält die ausdrücklich religiös-moralische Verurteilung, ohne eine spezifische spätere Lehrkategorie einzutragen.
- issue: Trügerischer Anschein in ὡς mit Genitivus absolutus
  choice: als bestünde keinerlei Feindseligkeit gegen sie
  alternative: da angeblich keinerlei Feindseligkeit gegen sie bestand
  rationale: Der Konjunktiv wahrt den im Griechischen ausgedrückten Anschein beziehungsweise Vorwand, ohne die behauptete Friedfertigkeit als Tatsache darzustellen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit erzählerischer Klarheit. Der Doppelpunkt erhält den erklärenden Anschluss der Partizipialkonstruktion; der Satz bleibt wie in der Quelle auf die Fortsetzung im nächsten Vers hin offen.
