lexical_decisions:
- source_word: ἔφοδον
  choice: Vormarsch
  rationale: Das Wort bezeichnet hier Judas’ herannahende militärische Bewegung. „Vormarsch“ bewahrt den militärischen Sinn, ohne bereits einen begonnenen Angriff vorauszusetzen.
- source_word: μεταλαβὼν
  choice: davon erfuhr
  rationale: Das Partizip hat hier den Sinn, eine Nachricht oder Kenntnis zu erhalten. Die deutsche Wendung ist idiomatisch und lässt die genaue Art der Nachrichtenübermittlung offen.
- source_word: προεξαπέστειλεν
  choice: schickte … voraus
  rationale: Die Vorsilben des Verbs drücken aus, dass etwas vorab beziehungsweise nach vorn geschickt wird; „voraus“ gibt dies knapp und natürlich wieder.
- source_word: ἀποσκευήν
  choice: Gepäck
  rationale: Gemeint ist die mitgeführte bewegliche Habe beziehungsweise Ausrüstung. „Gepäck“ bleibt allgemein und führt keine im Text nicht ausdrücklich genannten Vorräte ein.
- source_word: τὸ λεγόμενον Κάρνιον
  choice: den Ort, der Karnion genannt wurde
  rationale: Die Formulierung führt die Bezeichnung des Ortes ein. Die Wiedergabe ist sachlich und vermeidet den im Deutschen oft skeptisch klingenden Ausdruck „das sogenannte Karnion“.
- source_word: δυσπολιόρκητον
  choice: schwer zu belagern
  rationale: Das Adjektiv bezeichnet einen Ort, dessen Belagerung schwierig ist, und wird mit seinem konkreten militärischen Sinn wiedergegeben.
- source_word: δυσπρόσιτον
  choice: schwer zugänglich
  rationale: Das Wort bezeichnet erschwerten Zugang, nicht völlige Unzugänglichkeit. „Schwer zugänglich“ wahrt diese Abstufung.
- source_word: χωρίον
  choice: Ort
  rationale: Der allgemeine Ausdruck bezeichnet hier die Örtlichkeit. „Ort“ vermeidet die unbelegte Präzisierung als Festung oder Region.
- source_word: διὰ τὴν πάντων τῶν τόπων στενότητα
  choice: weil alle Zugänge in der Umgebung eng waren
  rationale: Wörtlich ist von der Enge aller Orte beziehungsweise Geländeabschnitte die Rede. Im militärisch-geografischen Zusammenhang sind die verengten Zugänge um den Ort gemeint; die Fußnote bewahrt die formale Ausdrucksweise des Griechischen.
