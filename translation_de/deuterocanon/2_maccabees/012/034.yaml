  text: And when they had joined battle[b][a], it happened that a few of the Jews fell.
translation:
  language: de
  text: Als sie sich zur Schlacht aufgestellt hatten[a], geschah es, dass wenige der Juden fielen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Als sie sich zum Kampf aufgestellt hatten« beziehungsweise »Als sie den Kampf aufgenommen hatten«. Das griechische Militärwort kann sowohl die Schlachtordnung als auch das Eintreten in den Kampf hervorheben.'
    reason: lexical_alternative
  - marker: b
    text: »Fielen« bedeutet in diesem Schlachtzusammenhang wahrscheinlich, dass sie starben; im Griechischen steht jedoch nicht ausdrücklich »wurden getötet«.
    reason: lexical_alternative
lexical_decisions:
- source_word: παραταξαμένους
  choice: als sie sich zur Schlacht aufgestellt hatten
  rationale: Das aoristische mediale Partizip von παρατάσσω bezeichnet im militärischen Zusammenhang das Aufstellen zur Schlacht und kann zugleich den Übergang zum Kampf einschließen. Die temporale Wiedergabe mit »als« entspricht dem griechischen Erzählzusammenhang und bleibt im Deutschen natürlich.
- source_word: συνέβη
  choice: geschah es
  rationale: Die unpersönliche Konstruktion wird mit der im Deutschen geläufigen Wendung »es geschah« bewahrt, ohne den Vorgang stärker kausal zu deuten.
- source_word: πεσεῖν
  choice: fielen
  rationale: πίπτω bedeutet wörtlich »fallen«. Im Schlachtzusammenhang ist wahrscheinlich der Tod gemeint; da der griechische Text jedoch nicht ausdrücklich »getötet wurden« sagt, bleibt die bildhafte und leicht offene Formulierung erhalten.
- source_word: ὀλίγους
  choice: einige wenige
  rationale: Das substantivisch gebrauchte Adjektiv bezeichnet eine kleine Zahl. »Einige wenige« ist idiomatisch und gibt die quantitative Aussage klar wieder.
- source_word: τῶν Ἰουδαίων
  choice: von den Juden
  rationale: Der partitive Genitiv wird direkt mit »von den Juden« wiedergegeben. »Juden« ist hier die übliche und sachlich passende ethnisch-religiöse Bezeichnung.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die militärische Bedeutung des Partizips und die bewusste Offenheit von »fielen« werden im Haupttext erhalten und durch knappe Fußnoten erläutert.
