  yaml_path: translation/deuterocanon/2_maccabees/012/026.yaml
  text: Then he advanced against Carnion and Atargatis[b][a], and slaughtered twenty-five thousand men.
translation:
  language: de
  text: Dann zog er gegen Karnion und das Atargateion[a] und schlachtete fünfundzwanzigtausend Menschen[b] nieder.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Möglicherweise ist damit nicht ein weiterer Ortsname, sondern ein Heiligtum der Göttin Atargatis gemeint.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „zwei Myriaden an Leibern und fünftausend“, also insgesamt fünfundzwanzigtausend Getötete.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐξελθὼν
  choice: Dann zog er
  rationale: Das Partizip bezeichnet sein Aufbrechen beziehungsweise Vorrücken. Im militärischen Erzählzusammenhang gibt „zog er“ die Bewegung natürlich wieder, ohne die Art des Marsches näher festzulegen.
- source_word: ἐπὶ
  choice: gegen
  rationale: In Verbindung mit dem anschließenden Angriff bezeichnet ἐπί die gegen ein Ziel gerichtete Bewegung.
- source_word: τὸ Κάρνιον
  choice: Karnion
  rationale: Der Ortsname wird nach der griechischen Form ins Deutsche übertragen.
- source_word: τὸ Ἀτεργάτιον
  choice: das Atargateion
  rationale: Die substantivierte griechische Bezeichnung wird transliteriert. Sie kann einen der Atargatis geweihten Ort oder ein Heiligtum bezeichnen; diese Unsicherheit wird nicht im Haupttext aufgelöst.
- source_word: κατέσφαξεν
  choice: schlachtete … nieder
  rationale: Das starke Verb bezeichnet gewaltsames Abschlachten und ist deutlich schärfer als ein neutrales „tötete“.
- source_word: μυριάδας σωμάτων δύο πεντακισχιλίους
  choice: fünfundzwanzigtausend Menschen
  rationale: Die Zahlenangabe ergibt insgesamt 25.000. σώματα bedeutet wörtlich „Leiber“, zählt hier jedoch getötete Personen; „Menschen“ vermeidet eine im Griechischen nicht ausdrücklich enthaltene Festlegung auf Männer.
