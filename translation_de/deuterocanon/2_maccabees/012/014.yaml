  - severity: low
    issue: „sogar“ gibt προσέτι nur angenähert wieder.
    rationale: προσέτι bedeutet „außerdem/überdies“ und fügt eine weitere Handlung hinzu. „Darüber hinaus“ erhält diesen additiven Charakter deutlicher.
