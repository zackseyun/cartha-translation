base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/012/014.yaml
  text: But those inside[a], trusting in the strength of the walls and in the supply of provisions, treated Judas and his men more arrogantly, reviling them[b], and even blaspheming and speaking what is not lawful.
translation:
  language: de
  text: 'Diejenigen im Inneren verhielten sich gegenüber Judas und seinen Leuten[a] im Vertrauen auf die Stärke der Mauern und auf ihren Lebensmittelvorrat umso anmaßender: Sie beschimpften sie, lästerten darüber hinaus und sagten, was man nicht sagen darf.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „denen um Judas“; gemeint sind Judas und die zu ihm gehörende Gruppe.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „und sagten, was nicht erlaubt ist“ oder „was sich nicht gehört“. Der griechische Ausdruck kann moralische oder religiöse Geltung haben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ ἔνδον
  choice: Die Männer drinnen aber
  rationale: Die räumliche Angabe bezeichnet die Verteidiger innerhalb der Befestigung. „Die Männer drinnen“ ist klar und gibt die maskuline Form des griechischen Ausdrucks wieder, ohne den Ort näher zu bestimmen, als es der Text tut.
- source_word: πεποιθότες
  choice: vertrauten auf
  rationale: Das Perfektpartizip bezeichnet ein gefestigtes Vertrauen beziehungsweise Sichverlassen auf die vorhandenen Schutzmittel.
- source_word: τῇ τῶν τειχέων ἐρυμνότητι
  choice: auf die Stärke der Mauern
  rationale: ἐρυμνότης meint die Wehrhaftigkeit oder schützende Stärke. Die Formulierung ist im Deutschen natürlich und behält den militärischen Sinn.
- source_word: τῇ τε τῶν βρωμάτων παραθέσει
  choice: auf ihren Vorrat an Lebensmitteln
  rationale: Im Belagerungszusammenhang bezeichnet παράθεσις zusammen mit βρώματα die vorhandene Versorgung beziehungsweise den Lebensmittelvorrat, nicht ein bloßes Auftragen von Speisen.
- source_word: ἀναυθαγέστερον ἐχρῶντο
  choice: begegneten ... umso anmaßender
  rationale: χράομαι mit Dativ beschreibt hier das Verhalten gegenüber einer Personengruppe; der Komparativ wird mit „umso anmaßender“ verständlich wiedergegeben und an das zuvor genannte Vertrauen angeschlossen.
- source_word: τοῖς περὶ τὸν Ἰούδαν
  choice: Judas und seinen Leuten
  rationale: Die griechische Wendung bezeichnet Judas und die zu ihm gehörende Gruppe. Die natürliche deutsche Wiedergabe macht den kollektiven, wahrscheinlich militärischen Bezug deutlich.
- source_word: λοιδοροῦντες
  choice: Sie beschimpften sie
  rationale: Das Verb bezeichnet heftige verbale Schmähung. „Beschimpften“ ist gegenwärtiges, allgemein verständliches Deutsch und bewahrt die Schärfe.
- source_word: βλασφημοῦντες
  choice: lästerten sogar
  rationale: „Lästerten“ lässt sowohl schmähende als auch ausdrücklich gotteslästerliche Rede anklingen und bewahrt damit die Bedeutungsbreite sowie die Steigerung gegenüber dem vorherigen Beschimpfen.
- source_word: λαλοῦντες ἃ μὴ θέμις
  choice: sagten Dinge, die man nicht sagen darf
  rationale: θέμις betrifft das, was erlaubt, geboten oder sittlich beziehungsweise religiös statthaft ist. Die idiomatische Formulierung hält den moralisch-religiösen Ernst fest, ohne eine bestimmte Rechtsnorm einzutragen.
theological_decisions:
- issue: Bedeutung von βλασφημοῦντες neben λοιδοροῦντες
  choice: Mit „lästerten“ als eigener, gesteigerter Aussage wiedergeben
  alternative: Als bloßes weiteres Beschimpfen oder ausdrücklich als „Gott lästern“ übersetzen
  rationale: Die Reihung unterscheidet Beschimpfen, Lästern und unerlaubte Rede. „Lästerten“ wahrt die mögliche religiöse Tragweite, legt aber kein im griechischen Satz nicht ausdrücklich genanntes Objekt fest.
- issue: Moralisch-religiöse Kraft von ἃ μὴ θέμις
  choice: „Dinge, die man nicht sagen darf“
  alternative: „was nicht gesetzlich erlaubt ist“ oder „was sich nicht gehört“
  rationale: Die gewählte Fassung bewahrt das Verbot und seine mögliche religiöse Dimension, ohne θέμις auf staatliches Gesetz oder bloße Umgangsformen zu verengen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der lange griechische Satz ist zur besseren Verständlichkeit in zwei Sätze gegliedert; „Deshalb“ macht den sachlich gegebenen Zusammenhang des Partizips deutlich. Die verbale Steigerung von Beschimpfung über Lästerung bis zu verbotener Rede bleibt erhalten.
