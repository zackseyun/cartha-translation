- from: 'Die Männer drinnen aber vertrauten auf die Stärke der Mauern und auf ihren Vorrat an Lebensmitteln. Deshalb begegneten sie Judas und seinen Leuten[a] umso anmaßender: Sie beschimpften sie, lästerten sogar und sagten Dinge, die man nicht sagen darf.[b]'
