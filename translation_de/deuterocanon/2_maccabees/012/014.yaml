  terminology: „Stärke der Mauern“, „Lebensmittelvorrat“, „beschimpften“ und „lästerten“ sind angemessen. „Lästerten“ bewahrt bei βλασφημοῦντες die mögliche religiöse Bedeutung, ohne ein im Text nicht genanntes Objekt wie Gott zu ergänzen. Die Fußnoten sind inhaltlich passend; die Alternativformulierung zu θέμις wahrt dessen moralisch-religiöse Spannweite.
