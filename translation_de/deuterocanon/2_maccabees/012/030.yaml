  text: And when the Jews who were settled there testified to the goodwill that the people of Scythopolis had toward them[a], and to their gentle treatment in times of misfortune,
translation:
  language: de
  text: Als aber die dort ansässigen Juden das Wohlwollen bezeugten, das die Einwohner von Skythopolis ihnen entgegenbrachten, sowie die freundliche Aufnahme in Zeiten des Unglücks,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »eine milde/freundliche Begegnung«. Auch möglich: »schonende Behandlung in Zeiten des Unglücks«.'
    reason: Die Wendung ἥμερον ἀπάντησιν ist idiomatisch. »Freundliche Aufnahme« gibt den Kontext wieder, während die Fußnote die wörtlichere und offenere Bedeutung von ἀπάντησις kenntlich macht.
lexical_decisions:
- source_word: ἀπομαρτυρησάντων
  choice: bezeugten
  rationale: Das Aoristpartizip führt den Inhalt dessen ein, was die ansässigen Juden bestätigten; »bezeugten« wahrt den Zeugnischarakter.
- source_word: τῶν ἐκεῖ καθεστώτων Ἰουδαίων
  choice: die dort ansässigen Juden
  rationale: καθεστώτων bezeichnet hier die an diesem Ort niedergelassenen beziehungsweise ansässigen Juden; die Formulierung ist präzise und natürlich.
- source_word: οἱ Σκυθοπολεῖται
  choice: die Einwohner von Skythopolis
  rationale: Das Ethnikon bezeichnet die Bevölkerung von Skythopolis; die Umschreibung ist für heutige Leser verständlicher als ein ungebräuchliches deutsches Demonym.
- source_word: εὔνοιαν
  choice: Wohlwollen
  rationale: εὔνοια bezeichnet eine wohlgesinnte, günstige Haltung; »Wohlwollen« bildet diesen Sinn im städtisch-sozialen Kontext treffend ab.
- source_word: ἐν τοῖς τῆς ἀτυχίας καιροῖς
  choice: in Zeiten des Unglücks
  rationale: ἀτυχία meint Unglück oder widrige Umstände, ohne zwingend eine Katastrophe zu bezeichnen.
- source_word: ἥμερον ἀπάντησιν
  choice: wie freundlich sie sie … aufgenommen hatten
  rationale: ἀπάντησις bedeutet wörtlich Begegnung oder Entgegenkommen, ἥμερος sanft beziehungsweise freundlich. Im Kontext gibt »freundlich aufgenommen« die praktische Art ihres Umgangs natürlich wieder.
