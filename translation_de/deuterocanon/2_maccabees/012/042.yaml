  text: they turned to supplication[a], asking that the sin that had been committed might be completely blotted out. But the noble Judas urged the multitude to keep themselves free from sin, since they had seen before their eyes the things that had happened because of the sin of those who had fallen.
translation:
  language: de
  text: Da wandten sie sich zum Flehen und baten darum, dass die begangene Sünde vollständig ausgelöscht werde. Der edle Judas aber ermahnte die Menge, sich frei von Sünde zu halten[a], da sie vor Augen gesehen hatten, was wegen der Sünde der Gefallenen geschehen war.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „sich sündlos zu bewahren“ oder „ohne Sünde zu bleiben“.'
    reason: Die Fußnote macht die formal nähere Wiedergabe von ἀναμαρτήτους sichtbar, während der Haupttext eine natürliche deutsche Formulierung verwendet.
lexical_decisions:
- source_word: εἰς ἱκεσίαν ἐτράπησαν
  choice: Da wandten sie sich flehend an Gott
  rationale: Die Wendung bezeichnet den Übergang zu inständigem Flehen. „An Gott“ ist im Deutschen als aus dem Gebetskontext erschlossene Ergänzung nötig, damit „sich flehend wenden“ ein natürliches Ziel erhält; der Adressat bleibt dabei eindeutig der implizite Empfänger der Bitte.
- source_word: ἀξιώσαντες
  choice: und baten darum
  rationale: Das Partizip führt den Inhalt des Flehens ein. „Baten darum“ ist idiomatisch und bewahrt den bittenden Sinn, ohne ihn unnötig zu verstärken.
- source_word: τὸ γεγονὸς ἁμάρτημα
  choice: die begangene Sünde
  rationale: Das Perfektpartizip bezeichnet die Sünde als bereits vollzogene Tat. „Die begangene Sünde“ gibt dies knapp und natürlich wieder.
- source_word: τελείως ἐξαλειφθῆναι
  choice: vollständig ausgelöscht werde
  rationale: ἐξαλείφω bedeutet auslöschen oder wegwischen und kann auf Schuld bezogen werden. „Vollständig“ bildet τελείως ausdrücklich ab.
- source_word: ὁ δὲ γενναῖος Ἰούδας
  choice: Der edle Judas aber
  rationale: γενναῖος kann sowohl „edel“ als auch „tapfer“ bedeuten. „Edel“ wahrt hier die ehrende, charakterliche Färbung, ohne den Ausdruck auf militärische Tapferkeit zu verengen.
- source_word: παρεκάλεσε τὸ πλῆθος
  choice: ermahnte die Menge
  rationale: παρακαλέω hat hier auffordernden beziehungsweise ermahnenden Sinn. „Die Menge“ bildet das Kollektiv τὸ πλῆθος direkt ab.
- source_word: συντηρεῖν αὐτοὺς ἀναμαρτήτους εἶναι
  choice: sich frei von Sünde zu halten
  rationale: Die gedrängte griechische Konstruktion fordert dazu auf, den Zustand des Freiseins von Sünde zu bewahren. Die deutsche Formulierung ist idiomatisch und vermeidet, stärker als der Kontext eine absolute sittliche Vollkommenheit zu behaupten.
- source_word: ὑπʼ ὄψιν ἑωρακότας
  choice: da sie mit eigenen Augen gesehen hatten
  rationale: Die Wendung betont unmittelbare Augenzeugenschaft. „Mit eigenen Augen“ gibt diese Anschaulichkeit natürlich wieder.
- source_word: τὰ γεγονότα
  choice: was ... geschehen war
  rationale: Das substantivierte Perfektpartizip verweist auf die bereits eingetretenen und sichtbaren Ereignisse beziehungsweise Folgen.
- source_word: διὰ τὴν τῶν προπεπτωκότων ἁμαρτίαν
  choice: wegen der Sünde der Gefallenen
  rationale: προπίπτω bezeichnet im Zusammenhang die im Kampf Gefallenen. Die Übersetzung lässt den vom griechischen Text ausdrücklich gesetzten ursächlichen Bezug zu ihrer Sünde bestehen.
theological_decisions:
- issue: Aussage über den moralischen Zustand in ἀναμαρτήτους
  choice: sich frei von Sünde zu halten
  alternative: sich sündlos zu bewahren / ohne Sünde zu bleiben
  rationale: Die Formulierung gibt die Aufforderung wieder, die betreffende Übertretung zu meiden, ohne unbemerkt eine Lehre absoluter Sündlosigkeit einzutragen. Die wörtlicheren Möglichkeiten werden in der Fußnote offengelegt.
- issue: Tilgung der begangenen Sünde
  choice: dass die begangene Sünde vollständig ausgelöscht werde
  alternative: dass die begangene Sünde vollständig weggewischt werde
  rationale: Der Text lässt offen, auf welche genaue Weise die Sünde ausgelöscht wird. Die Übersetzung bewahrt diese theologische Offenheit und ergänzt weder ein bestimmtes Sühnemodell noch eine konfessionelle Erklärung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bleibt nahe an der griechischen Abfolge, wird jedoch für flüssiges Deutsch leicht gegliedert. Die einzige erschlossene Ergänzung „an Gott“ verdeutlicht den im Flehen impliziten Adressaten. Der Fußnotenmarker steht unmittelbar bei der Wendung, auf die sich die Anmerkung bezieht.
