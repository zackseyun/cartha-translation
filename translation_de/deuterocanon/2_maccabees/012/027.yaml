  yaml_path: translation/deuterocanon/2_maccabees/012/027.yaml
  text: But after the rout and destruction of these men[a], he marched also against Ephron, a fortified city, in which there were mixed multitudes; and strong young men, stationed before the walls, were fighting vigorously[b], while there were many stores of engines and missiles there.
translation:
  language: de
  text: Nach der Niederlage und Vernichtung dieser Leute zog er auch gegen Ephron, eine befestigte Stadt. In ihr befanden sich zahlreiche Menschen aus verschiedenen Völkern oder Gruppen.[a] Kräftige junge Männer, die vor den Mauern postiert waren, wehrten sich mit großer Kraft; dort gab es auch zahlreiche Vorräte an Kriegsmaschinen und Geschossen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Menschen aller Art/Völker“. Der griechische Ausdruck bezeichnet Menschen verschiedener Völker oder Herkunftsgruppen, ohne diese näher zu bestimmen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „zahlreiche Lagerbestände“. Der griechische Ausdruck bezeichnet hier wahrscheinlich bereitgehaltene oder angesammelte militärische Ausrüstung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τροπή
  choice: Niederlage
  rationale: Im militärischen Zusammenhang bezeichnet das Wort das Zurückweichen beziehungsweise die Flucht nach einer Niederlage. „Niederlage“ ist im modernen Deutschen klar und natürlich.
- source_word: ἀπώλεια
  choice: Vernichtung
  rationale: Zusammen mit τροπή bezeichnet es den schweren, zerstörerischen Ausgang des Kampfes und bewahrt die Intensität des griechischen Ausdrucks.
- source_word: ἐπεστράτευσεν
  choice: zog ... gegen
  rationale: Das Verb bezeichnet einen militärischen Zug gegen einen Ort; die gewählte Formulierung ist idiomatisch und präzise.
- source_word: πόλιν ὀχυράν
  choice: eine befestigte Stadt
  rationale: ὀχυρά beschreibt die Verteidigungsstärke der Stadt; „befestigt“ gibt dies sachlich wieder.
- source_word: πάμφυλα πλήθη
  choice: eine bunt gemischte Menschenmenge
  rationale: πάμφυλα weist auf Menschen verschiedener Herkunft oder Gruppen hin. Die Formulierung bewahrt den zusammengesetzten Charakter, ohne bestimmte ethnische Kategorien hinzuzufügen.
- source_word: νεανίαι ... ῥωμαλέοι
  choice: kräftige junge Männer
  rationale: Die Wendung verbindet Jugend mit körperlicher Stärke; „kräftige junge Männer“ ist unmittelbar verständlich.
- source_word: πρὸ τῶν τειχῶν καθεστῶτες
  choice: die vor den Mauern Stellung bezogen hatten
  rationale: καθεστῶτες bezeichnet hier ein Aufgestellt- oder Postiertsein in militärischer Position.
- source_word: εὐρώστως ἀπεμάχοντο
  choice: leisteten entschlossenen Widerstand
  rationale: Das Imperfekt beschreibt anhaltende Gegenwehr; εὐρώστως betont deren kraftvolle, standhafte Art.
- source_word: ὀργάνων
  choice: Kriegsmaschinen
  rationale: Im Zusammenhang mit Geschossen sind militärische Maschinen gemeint. „Kriegsmaschinen“ ist verständlicher und weniger eng als „Belagerungsmaschinen“.
- source_word: βελῶν
  choice: Geschossen
  rationale: Der Ausdruck umfasst verschiedene geworfene oder abgeschossene Projektile und sollte nicht auf Pfeile oder Wurfspeere verengt werden.
- source_word: παραθέσεις
  choice: Vorräte
  rationale: In diesem Zusammenhang bezeichnet das Substantiv wahrscheinlich bereitgestellte beziehungsweise angesammelte militärische Ausrüstung; die genaue Nuance bleibt jedoch unsicher und wird in einer Fußnote kenntlich gemacht.
