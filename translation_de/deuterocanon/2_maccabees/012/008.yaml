lexical_decisions:
- source_word: μεταλαβὼν
  choice: als er … erfuhr
  rationale: Das Partizip eröffnet einen Umstandssatz, dessen Hauptsatz erst im folgenden Vers steht. Im Zusammenhang ist das Bekanntwerden der Absicht der Leute von Jamnia gemeint; die Wiedergabe wahrt zugleich den offenen Satzbau.
- source_word: τοὺς ἐν Ἰαμνίᾳ
  choice: von den Leuten in Jamnia
  rationale: Der substantivierte präpositionale Ausdruck bezeichnet die betreffende Personengruppe in Jamnia, ohne sie genauer festzulegen.
- source_word: τὸν αὐτὸν … τρόπον
  choice: ebenso
  rationale: Die knappe adverbiale Wiedergabe gibt die Bedeutung „auf dieselbe Weise“ in natürlichem Deutsch wieder und verweist auf das zuvor geschilderte Vorgehen.
- source_word: ἐπιτελεῖν
  choice: verfahren
  rationale: Zusammen mit τὸν αὐτὸν τρόπον bezeichnet das Verb die beabsichtigte Durchführung derselben Handlungsweise. „Ebenso verfahren“ ist idiomatisch und lässt den im Kontext erschließbaren Inhalt unausgesprochen.
- source_word: βουλομένους
  choice: wollten
  rationale: Das Imperfekt gibt die Absicht der betreffenden Personen schlicht und natürlich wieder.
- source_word: τοῖς κατοικοῦσιν Ἰουδαίοις
  choice: mit den dort lebenden Juden
  rationale: Der Dativ bezeichnet die von dem beabsichtigten Vorgehen betroffenen Juden. „Dort lebend“ gibt κατοικοῦσιν natürlich wieder.
