base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/012/029.yaml
  text: Then they broke camp from there and set out for the city of the Scythians[a], six hundred stadia from Jerusalem.
translation:
  language: de
  text: Dann brachen sie von dort auf und zogen zur Stadt der Skythen[a], sechshundert Stadien von Jerusalem entfernt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Möglicherweise ist Skythopolis gemeint; der griechische Text hat wörtlich „Stadt der Skythen“.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀναζεύξαντές
  choice: brachen sie … auf
  rationale: Das Partizip bezeichnet im Reise- und Militärkontext den Aufbruch beziehungsweise das Abbrechen des Lagers. „Aufbrechen“ gibt dies im Deutschen natürlich wieder, ohne ein im Griechischen nicht ausdrücklich genanntes Lager einzufügen.
- source_word: ὥρμησαν
  choice: zogen
  rationale: Das Verb kann eine heftige Bewegung bezeichnen, meint hier im Reisebericht jedoch die zielgerichtete Bewegung zu einem Ort. „Zogen“ passt zum erzählerischen und militärischen Zusammenhang.
- source_word: ἐπὶ Σκυθῶν πόλιν
  choice: zur Stadt der Skythen
  rationale: Die Formulierung wird als Richtungsangabe verstanden und möglichst nah an der beschreibenden griechischen Wendung wiedergegeben, statt den wahrscheinlichen Ortsnamen stillschweigend einzusetzen.
- source_word: ἀπέχουσαν
  choice: … entfernt
  rationale: Das attributive Partizip gibt die Entfernung der Stadt von Jerusalem an. Die deutsche Nachstellung ist knapp und idiomatisch.
- source_word: σταδίους ἑξακοσίους
  choice: sechshundert Stadien
  rationale: Die antike Maßeinheit bleibt erhalten, da eine Umrechnung von der zugrunde gelegten Länge des Stadions abhängt.
theological_decisions: []
translation_notes:
  register: Moderne, gut verständliche Standardsprache mit würdigem erzählerischem Ton. Die beschreibende Ortsbezeichnung und die antike Entfernungseinheit werden beibehalten; die wahrscheinliche Identifizierung mit Skythopolis steht in der Fußnote.
