base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/012/015.yaml
  text: But those around Judas[a], having called on the great Sovereign of the world—the one who, in the time of Joshua, brought down Jericho without rams or siege engines—assaulted the wall fiercely.
translation:
  language: de
  text: Die um Judas aber riefen den großen Herrscher der Welt an, der zur Zeit Josuas[a] Jericho ohne Rammböcke und Belagerungsmaschinen zum Einsturz gebracht hatte, und griffen die Mauer mit ungestümer Wucht an.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Griechischen steht hier die Namensform Iēsous; gemeint ist Josua, unter dessen Führung Jericho fiel.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ περὶ τὸν Ἰούδαν
  choice: Die Männer um Judas aber
  rationale: Die Wendung bezeichnet die zu Judas gehörende Gruppe. „Die Männer um Judas“ ist im Deutschen natürlich, ohne ihre genaue militärische Funktion stärker festzulegen als der griechische Text.
- source_word: ἐπικαλεσάμενοι
  choice: riefen … an
  rationale: Das mediale Partizip bezeichnet hier den an Gott gerichteten Hilferuf. Die finite deutsche Konstruktion bildet den Handlungsablauf klar und idiomatisch ab.
- source_word: τὸν μέγαν τοῦ κόσμου δυνάστην
  choice: den großen Herrscher der Welt
  rationale: δυνάστης bezeichnet einen machtvollen Herrscher. „Herrscher“ bewahrt Würde und Machtanspruch, bleibt aber für heutige Leser unmittelbar verständlich.
- source_word: τὸν ἄτερ κριῶν καὶ μηχανῶν ὀργανικῶν
  choice: ohne Rammböcke und Belagerungsmaschinen
  rationale: κριοί sind im Belagerungskontext Rammböcke; μηχαναί ὀργανικαί bezeichnet konstruierte Kriegs- beziehungsweise Belagerungsgeräte. Die Übersetzung gibt den militärischen Zusammenhang präzise wieder.
- source_word: κατακρημνίσαντα τὴν Ἰερειχώ
  choice: Jericho … zum Einsturz gebracht hatte
  rationale: Das Verb beschreibt ein gewaltsames Herabstürzen oder Zusammenbrechenlassen. Mit Blick auf Jerichos Befestigung vermittelt „zum Einsturz gebracht“ das anschauliche Ergebnis.
- source_word: κατὰ τοὺς Ἰησοῦ χρόνους
  choice: zur Zeit Josuas
  rationale: Ἰησοῦ ist die Genitivform des griechischen Namens, der sowohl Jesus als auch Josua wiedergeben kann. Der eindeutige Jericho-Bezug weist hier auf Josua, den Sohn Nuns.
- source_word: ἐνέσεισαν θηριωδῶς τῷ τείχει
  choice: griffen die Mauer mit ungestümer Wucht an
  rationale: ἐνέσεισαν bezeichnet ein heftiges Einwirken oder Anstürmen gegen die Mauer; θηριωδῶς trägt die Vorstellung tierhafter Wildheit. Die Formulierung wahrt die Angriffssituation und die außergewöhnliche Heftigkeit, ohne im Deutschen unbeholfen zu wirken.
theological_decisions:
- issue: Identität von Ἰησοῦ in der Anspielung auf Jericho
  choice: Josua
  alternative: Jesus beziehungsweise formale Wiedergabe derselben griechischen Namensform
  rationale: Die Erwähnung des Falls von Jericho macht den historischen Bezug auf Josua eindeutig. „Jesus“ würde moderne Leser irreführen; die Fußnote macht zugleich die sprachliche Form des griechischen Namens transparent.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau wurde gegenüber der griechischen Partizipialkonstruktion behutsam geglättet. „Mit ungestümer Wucht“ vermittelt die in θηριωδῶς liegende wilde Heftigkeit, ohne die Männer ausdrücklich mit Tieren gleichzusetzen.
