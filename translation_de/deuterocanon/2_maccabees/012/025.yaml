  text: But when he had assured them at length that he would restore these men unharmed[b][a], they released him for the safety of their brothers.
translation:
  language: de
  text: Nachdem er jedoch mit vielen Worten[a] bekräftigt hatte, die Vereinbarung einzuhalten und diese Männer unversehrt zurückzubringen, ließen sie ihn um der Rettung ihrer Brüder willen frei.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ausführlich“. Wörtlich steht hier eine elliptische Wendung: „durch viele [Worte]“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „um der Sicherheit ihrer Brüder willen“ oder „um der Befreiung ihrer Brüder willen“. Das griechische Wort kann auch „Heil“ bedeuten, meint hier aber wahrscheinlich die Rettung aus körperlicher Gefahr.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πιστώσαντος
  choice: bekräftigt hatte
  rationale: Das Aoristpartizip von πιστόω bezeichnet hier das glaubhafte Bestätigen oder Bekräftigen einer Zusage beziehungsweise Vereinbarung. Die Formulierung passt syntaktisch zu τὸν ὁρισμόν und bleibt im Deutschen natürlich.
- source_word: διὰ πλειόνων
  choice: mit vielen Worten
  rationale: Die elliptische Wendung kann eine ausführliche, durch viele Worte gegebene Versicherung bezeichnen. Die relativ formnahe Wiedergabe bewahrt stärker als „ausführlich“ die Struktur des Griechischen.
- source_word: τὸν ὁρισμὸν ἀποκαταστῆσαι
  choice: die Vereinbarung … zurückzubringen
  rationale: ὁρισμός kann eine Festlegung, Abmachung oder Vereinbarung bezeichnen. Der Infinitiv gibt ihren Inhalt an. Die nominale Wiedergabe bewahrt die im Griechischen ausdrücklich genannte Festlegung, statt sie ganz in einen dass-Satz aufzulösen.
- source_word: τούτους ἀπημάντους
  choice: diese Männer unversehrt
  rationale: ἀπήμαντος bedeutet unversehrt oder vor Schaden bewahrt. „Diese Männer“ gibt den menschlichen, männlichen Bezug von τούτους im Kontext klar wieder.
- source_word: ἀπέλυσαν αὐτόν
  choice: ließen sie ihn frei
  rationale: ἀπολύω bedeutet hier freilassen beziehungsweise gehen lassen; „ließen … frei“ ist in modernem erzählendem Deutsch idiomatisch.
- source_word: ἕνεκα τῆς τῶν ἀδελφῶν σωτηρίας
  choice: um ihre Brüder zu retten
  rationale: σωτηρία bezeichnet in diesem militärischen Zusammenhang vorrangig Rettung beziehungsweise Bewahrung vor körperlicher Gefahr. Die finale Formulierung gibt ἕνεκα natürlich wieder; „ihre Brüder“ macht den kontextuell naheliegenden Beziehungsbezug deutlich.
theological_decisions:
- issue: Bedeutung von σωτηρία im militärischen Erzählzusammenhang
  choice: retten
  alternative: Heil; Sicherheit; Befreiung
  rationale: Der unmittelbare Zusammenhang betrifft die Bewahrung gefährdeter Angehöriger und keine ausdrücklich geistliche oder endzeitliche Heilslehre. „Retten“ wahrt den starken Bedeutungsgehalt, ohne eine dogmatische Engführung einzutragen.
- issue: Bezug von ἀδελφῶν
  choice: ihre Brüder
  alternative: die Brüder; ihre Verwandten; ihre Volksgenossen
  rationale: Das griechische Maskulinum Plural wird beibehalten. Der Zusammenhang kann leibliche Brüder, Verwandte oder Volksgenossen meinen; „Brüder“ bewahrt diese mögliche Spannung besser als eine erklärende Festlegung.
translation_notes:
  register: Modernes, würdiges Erzählprosa-Deutsch. Die nominale Formulierung „die Vereinbarung“ wahrt den schwer eindeutig aufzulösenden Ausdruck τὸν ὁρισμόν; die Satzstellung bleibt dennoch für heutige Leser verständlich.
