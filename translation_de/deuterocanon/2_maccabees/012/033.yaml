lexical_decisions:
- source_word: ἐξῆλθεν
  choice: zog … aus
  rationale: Der Aorist von ἐξέρχομαι bezeichnet das Hinausgehen oder Ausziehen. Im militärischen Zusammenhang ist „zog … aus“ natürlich und bewahrt die erzählerische Bewegung, ohne ein bestimmtes taktisches Manöver hinzuzufügen.
- source_word: μετὰ
  choice: mit
  rationale: Die Präposition bezeichnet hier Begleitung; „mit“ ist die direkte und natürliche deutsche Entsprechung.
- source_word: πεζῶν
  choice: Fußsoldaten
  rationale: πεζός bezeichnet im militärischen Gegensatz zur Reiterei Soldaten zu Fuß. „Fußsoldaten“ ist klar, personbezogen und näher an der griechischen Form als das kollektive „Infanterie“.
- source_word: τρισχιλίων
  choice: dreitausend
  rationale: Die Kardinalzahl wird direkt wiedergegeben.
- source_word: ἱππέων
  choice: Reitern
  rationale: ἱππεύς bezeichnet einen Reiter beziehungsweise Kavalleristen. „Reiter“ ist im Deutschen natürlich und bewahrt den Personenbezug des griechischen Substantivs.
- source_word: τετρακοσίων
  choice: vierhundert
  rationale: Die Kardinalzahl wird direkt wiedergegeben.
