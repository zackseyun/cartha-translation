  text: But they did not catch Timotheus in those places[a], for he had then withdrawn from the places without accomplishing anything, though he had left a garrison in a certain place[b], and a very strong one at that.
translation:
  language: de
  text: Timotheus aber trafen sie an jenen Orten nicht an,[a] denn er hatte sich damals unverrichteter Dinge von dort zurückgezogen. Er hatte jedoch an einem Ort eine Besatzung zurückgelassen, und zwar eine besonders starke.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »holten sie an jenen Orten nicht ein« oder »bekamen sie dort nicht zu fassen«. Das griechische Verb kann das Antreffen, Einholen oder Ergreifen bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: »Eine besonders starke« bezieht sich grammatisch am unmittelbarsten auf die Besatzung; zugleich kann die Stärke beziehungsweise Befestigung ihres Standorts mitgemeint sein.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατέλαβον
  choice: trafen … nicht an
  rationale: Das Verb kann in diesem militärischen Zusammenhang »einholen«, »ergreifen« oder »antreffen« bedeuten. »Nicht antreffen« gibt natürlich wieder, dass Timotheus bei ihrer Ankunft bereits fort war, ohne eine gewaltsame Ergreifung festzulegen.
- source_word: ἐπὶ τῶν τόπων
  choice: in jenen Gegenden
  rationale: Der pluralische Ortsausdruck verweist auf die zuvor genannten Örtlichkeiten. »Gegenden« bewahrt den räumlichen Bezug und klingt im Deutschen natürlicher als »an den Orten«.
- source_word: ἄπρακτον
  choice: unverrichteter Dinge
  rationale: Die feste deutsche Wendung drückt prägnant aus, dass Timotheus nichts erreicht oder ausgeführt hatte.
- source_word: ἐκ τῶν τόπων ἐκλελυκότα
  choice: sich … von dort zurückgezogen
  rationale: Das Partizip bezeichnet hier sein Weggehen aus dem Gebiet; »zurückgezogen« entspricht dem militärischen Zusammenhang.
- source_word: καταλελοιπότα
  choice: zurückgelassen
  rationale: Das Perfektpartizip stellt dem eigenen Rückzug Timotheus’ die von ihm dort belassene Truppe gegenüber.
- source_word: φρουράν
  choice: Besatzung
  rationale: Im militärischen Kontext bezeichnet φρουρά eine zur Sicherung oder Verteidigung zurückgelassene Truppe. »Besatzung« ist im Deutschen idiomatischer als das ebenfalls mögliche »Garnison«.
- source_word: ἐν τινι τόπῳ
  choice: an einem Ort
  rationale: Die unbestimmte Ortsangabe bleibt bewusst unspezifisch.
- source_word: μάλιστα ὀχυράν
  choice: eine besonders starke
  rationale: Das feminine Adjektiv bezieht sich grammatisch unmittelbar auf φρουράν. »Besonders stark« bewahrt diese Zuordnung, ohne auszuschließen, dass auch die befestigte Stellung zur Stärke beitrug.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzglieder wurden zur besseren Lesbarkeit auf zwei Sätze verteilt. »Unverrichteter Dinge« ist eine geläufige, leicht gehobene Wendung; die örtliche Wiederholung des Griechischen wurde mit »in jenen Gegenden … von dort« natürlich wiedergegeben.
