base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/012/020.yaml
  text: But Maccabeus[a], after arranging the troops around him in companies, stationed them over against the companies; and they charged against Timothy, who had around him twelve myriads of foot soldiers, two thousand horsemen[b], and besides these seven thousand more.
translation:
  language: de
  text: Makkabäus aber stellte die Truppen, die bei ihm waren, in Abteilungen auf und setzte sie den feindlichen Abteilungen gegenüber. Dann stürmten sie gegen Timotheus vor, der zwölf Myriaden Fußsoldaten[a] und zweitausend Reiter bei sich hatte, dazu noch siebentausend weitere Männer.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Zwölf Myriaden sind 120.000 Fußsoldaten.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich ist der abschließende griechische Ausdruck knapp formuliert: „und dazu die siebentausend“. Welche Art von Truppen damit gemeint ist, wird nicht ausdrücklich gesagt.'
    reason: alternative_reading
lexical_decisions:
- source_word: διατάξας τὴν περὶ αὐτὸν στρατιὰν
  choice: stellte die Truppen, die bei ihm waren, ... auf
  rationale: Das Aoristpartizip bezeichnet die vorausgehende militärische Aufstellung; περὶ αὐτόν meint die ihn begleitende Streitmacht.
- source_word: σπειρηδόν
  choice: in Abteilungen
  rationale: Gibt die Gliederung nach militärischen Einheiten wieder, ohne den möglicherweise anachronistisch-technischen Ausdruck „Kohorten“ zu verwenden.
- source_word: κατέστησεν αὐτοὺς ἐπὶ τῶν σπειρῶν
  choice: setzte sie den feindlichen Abteilungen gegenüber
  rationale: Die komprimierte Wendung wird im Kampfzusammenhang als gegnerische Gegenüberstellung verstanden; „feindlichen“ macht den Bezug natürlich verständlich, ohne eine bestimmte Truppengattung einzutragen.
- source_word: ὥρμησαν
  choice: stürmten ... vor
  rationale: Im militärischen Zusammenhang bezeichnet das Verb einen entschlossenen, schnellen Angriff.
- source_word: μυριάδας δώδεκα πεζῶν
  choice: zwölf Myriaden Fußsoldaten
  rationale: Bewahrt die griechische Zahlbezeichnung; die rechnerische Entsprechung wird in der Fußnote erklärt.
- source_word: ἱππεῖς δὲ δισχιλίους
  choice: zweitausend Reiter
  rationale: Natürliche und genaue deutsche Bezeichnung für berittene Kämpfer.
- source_word: καὶ πρὸς τοῖς ἑπτακισχιλίοις
  choice: dazu noch siebentausend weitere Männer
  rationale: πρός mit Dativ hat hier additiven Sinn. Da die Gattung der zusätzlichen Truppen nicht ausdrücklich genannt ist, bleibt „Männer“ bewusst allgemein.
