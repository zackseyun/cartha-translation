  text: But Dositheus and Sosipater, commanders under Maccabaeus, went out and destroyed those left behind by Timothy in the stronghold, more than ten thousand men.
translation:
  language: de
  text: Dositheus und Sosipater aber, zwei Befehlshaber aus dem Umfeld des Makkabäus, zogen aus und vernichteten die mehr als zehntausend Männer, die Timotheus in der Festung zurückgelassen hatte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τῶν περὶ τὸν Μακκαβαῖον ἡγουμένων
  choice: zwei Befehlshaber aus dem Kreis um Makkabäus
  rationale: Die Genitivwendung ordnet Dositheus und Sosipater den militärischen Führungspersonen um Makkabäus zu. Diese Wiedergabe bewahrt sowohl ihre Leitungsfunktion als auch die durch περὶ ausgedrückte Zugehörigkeit, ohne ein im Griechischen nicht ausdrücklich bezeichnetes Dienstverhältnis zu behaupten.
- source_word: ἐξοδεύσαντες
  choice: zogen aus
  rationale: Im militärischen Zusammenhang bezeichnet das Partizip das Ausziehen beziehungsweise Aufbrechen; „zogen aus“ ist idiomatisch und wahrt diesen Kontext.
- source_word: ἀπώλεσαν
  choice: vernichteten
  rationale: Das Verb kann „vernichten“, „umbringen“ oder „zugrunde richten“ bedeuten. Bei einer großen militärischen Einheit gibt „vernichteten“ den umfassenden Kampfbezug wieder.
- source_word: τοὺς ὑπὸ Τιμοθέου καταλειφθέντας
  choice: die Timotheus … zurückgelassen hatte
  rationale: ὑπὸ Τιμοθέου gehört als Angabe des Handelnden zum passiven Partizip καταλειφθέντας. Ein deutscher Relativsatz bildet die Beziehung klar und natürlich ab.
- source_word: ἐν τῷ ὀχυρώματι
  choice: in der Festung
  rationale: ὀχύρωμα bezeichnet einen befestigten Ort oder Stützpunkt. „Festung“ ist im militärischen Erzählzusammenhang prägnant und verständlich.
- source_word: πλείους τῶν μυρίων ἀνδρῶν
  choice: mehr als zehntausend Männer
  rationale: Die Vergleichsformulierung bezeichnet ausdrücklich eine Zahl von über zehntausend Männern. Durch die Einfügung vor „Männer“ wird im Deutschen eindeutig, auf wen sich die Zahlenangabe bezieht.
