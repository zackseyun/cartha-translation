  text: And after taking up a collection man by man[a], he sent two thousand silver drachmas to Jerusalem to provide a sin offering, acting very well and nobly, because he was reasoning about the resurrection.
translation:
  language: de
  text: Nachdem er Mann für Mann[a] eine Sammlung von zweitausend Silberdrachmen erhoben hatte, schickte er das Geld nach Jerusalem, um ein Sündopfer darbringen zu lassen. Dabei handelte er sehr gut und edel, weil er über die Auferstehung nachdachte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „durch eine für jeden einzelnen Mann erhobene Umlage“; die griechische Wendung ist technisch und kann eine individuelle Veranlagung oder eine Erhebung nach einer Männerliste bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιησάμενός τε κατʼ ἀνδρολόγιον
  choice: Nachdem er Mann für Mann eine Sammlung ... durchgeführt hatte
  rationale: Das Partizip bezeichnet eine vorausgehende Handlung; aus dem Zusammenhang ergibt sich eine Geldsammlung. „Mann für Mann“ bewahrt den distributiven Sinn der technisch anmutenden, in ihrer genauen administrativen Bedeutung jedoch unsicheren Wendung κατʼ ἀνδρολόγιον.
- source_word: εἰς ἀργυρίου δραχμὰς δισχιλίας
  choice: in Höhe von zweitausend Silberdrachmen
  rationale: Die Formulierung gibt die erreichte beziehungsweise bestimmte Gesamtsumme an und hält sowohl Münzeinheit als auch Material ausdrücklich fest.
- source_word: ἀπέστειλεν εἰς Ἰερουσαλήμ
  choice: schickte er das Geld nach Jerusalem
  rationale: Das ergänzte Objekt „das Geld“ ist im Deutschen für einen natürlichen Satzbau nötig und wird durch die unmittelbar zuvor genannte Geldsumme eindeutig erschlossen.
- source_word: προσαγαγεῖν περὶ ἁμαρτίας θυσίαν
  choice: um ein Sündopfer darbringen zu lassen
  rationale: „Sündopfer“ gibt die feste kultische Verbindung knapp wieder. „Darbringen zu lassen“ macht deutlich, dass Judas das Geld sandte, damit das Opfer in Jerusalem vollzogen wurde, ohne ihn selbst als Opfernden darzustellen.
- source_word: πάνυ καλῶς καὶ ἀστείως πράττων
  choice: Damit handelte er sehr gut und edel
  rationale: Die Wiedergabe erhält die ausdrückliche und nachdrückliche Zustimmung des Erzählers. ἀστείως bezeichnet hier feines, angemessenes beziehungsweise edles Handeln.
- source_word: ὑπὲρ ἀναστάσεως διαλογιζόμενος
  choice: denn er bedachte die Auferstehung
  rationale: Die kausale Verbindung gibt den Beweggrund seines Handelns wieder. „Bedachte“ bewahrt den Sinn reflektierten Erwägens, ohne das griechische Substantiv ἀνάστασις durch einen ausdrücklichen Zusatz zu erweitern.
theological_decisions:
- issue: Erzählerische Billigung der Geldsendung für ein Sündopfer
  choice: Die deutliche Wertung wird mit „sehr gut und edel“ uneingeschränkt wiedergegeben.
  alternative: Eine neutralere Formulierung, welche die moralische Zustimmung abschwächt.
  rationale: πάνυ καλῶς καὶ ἀστείως πράττων spricht ausdrücklich anerkennend über Judas’ Handeln. Diese theologische Spannung darf nicht aus konfessionellen Gründen abgeschwächt werden.
- issue: Bedeutung von ἀνάστασις
  choice: die Auferstehung
  alternative: die Auferstehung der Toten
  rationale: Im Griechischen steht kein ausdrücklicher Genitiv. Der Kontext betrifft zwar Tote, doch die Übersetzung fügt diese Präzisierung nicht in den Haupttext ein.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzfolge bleibt klar und erzählerisch; kultische Fachsprache wird mit dem geläufigen Ausdruck „Sündopfer“ wiedergegeben. Die Fußnote bewahrt die administrative Unschärfe von κατʼ ἀνδρολόγιον.
