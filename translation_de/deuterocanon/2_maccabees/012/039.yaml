  text: On the following day[a], the men with Judas came, when the need had arisen, to gather up the bodies of those who had fallen and to restore them with their relatives to the tombs of their fathers.
translation:
  language: de
  text: Am folgenden Tag kamen die Männer um Judas, als es nötig geworden war, um die Leichname der Gefallenen zu bergen und sie zusammen mit ihren Angehörigen in die Gräber ihrer Vorfahren zurückzubringen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τῇ δὲ ἐχομένῃ
  choice: Am folgenden Tag
  rationale: Die idiomatische Zeitangabe wird natürlich und quellentreu wiedergegeben.
- source_word: οἱ περὶ τὸν Ἰούδαν
  choice: die Männer um Judas
  rationale: Die Wendung bezeichnet die zu Judas gehörende Gruppe, ohne sie ausdrücklich als Heer oder Soldaten zu bestimmen.
- source_word: καθʼ ὃν χρόνον τὸ τῆς χρείας ἐγέγονει
  choice: als es nötig geworden war
  rationale: Dies bewahrt den Gedanken, dass die Umstände die Handlung nun erforderlich machten, in natürlichem Deutsch.
- source_word: τὰ σώματα τῶν προπεπτωκότων
  choice: die Leichname der Gefallenen
  rationale: Im Bestattungskontext ist „Leichname“ eindeutig; „der Gefallenen“ bewahrt das griechische Bild des Fallens.
- source_word: ἀνακομίσασθαι
  choice: zu bergen
  rationale: Das Verb bezeichnet hier das Aufnehmen und Abtransportieren der Leichname vom Ort des Kampfes; „bergen“ ist dafür im Deutschen präzise und idiomatisch.
- source_word: ἀποκαταστῆσαι
  choice: beizusetzen
  rationale: Obwohl das Verb grundsätzlich „zurückbringen/wiederherstellen“ bedeutet, bezeichnet es im Zusammenhang die Rückführung zur Bestattung; „beisetzen“ ergibt zusammen mit der Zielangabe natürliches Deutsch.
- source_word: μετὰ τῶν συγγενῶν
  choice: bei ihren Angehörigen
  rationale: „Bei“ gibt die räumliche Verbindung im Begräbniszusammenhang wieder, ohne eine genauere Anordnung zu behaupten.
- source_word: εἰς τοὺς πατρῴους τάφους
  choice: in den Gräbern ihrer Vorfahren
  rationale: πατρῴους bezeichnet hier die ererbten bzw. angestammten Familiengräber; die Formulierung bewahrt den Bezug zur Abstammung und klingt im Deutschen natürlich.
theological_decisions:
- issue: Verbindung von Verwandtschaft und angestammter Begräbnisstätte
  choice: sie bei ihren Angehörigen in den Gräbern ihrer Vorfahren beizusetzen
  alternative: sie zusammen mit ihren Verwandten in die väterlichen Gräber zurückzubringen
  rationale: Der griechische Text nennt sowohl die Angehörigen als auch die von den Vorfahren her bestimmten Gräber. Die gewählte Fassung erhält beide Elemente, ohne sie zu einem einzigen Begriff wie „Familiengräber“ zu verschmelzen oder eine theologische Folgerung einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nah am griechischen Ablauf, wird aber durch idiomatische Bestattungssprache verständlich gehalten. Es sind keine Fußnoten erforderlich.
