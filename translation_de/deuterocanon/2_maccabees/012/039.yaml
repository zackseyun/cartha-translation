    issue: „beizusetzen“ für ἀποκαταστῆσαι
    rationale: Das deutsche Verb bezeichnet primär die Bestattung selbst. Das griechische Verb betont dagegen das Zurückbringen bzw. Wiederanbringen der Gefallenen an ihren angestammten Begräbnisort.
  - severity: low
    issue: „bei ihren Angehörigen“ für μετὰ τῶν συγγενῶν
    rationale: Die Formulierung ist möglich, aber „zusammen mit ihren Angehörigen“ gibt die griechische Präposition μετὰ unmittelbarer wieder und vermeidet eine bloß lose räumliche Zuordnung.
