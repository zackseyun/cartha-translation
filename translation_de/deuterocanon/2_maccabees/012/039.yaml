  verdict: revise
  source_fidelity: 'Die Wiedergabe trifft den Handlungsablauf insgesamt: Judas’ Gruppe kommt am folgenden Tag, um die Leichname zu bergen und sie an die angestammte Begräbnisstätte zurückzuführen. „Beisetzen“ ist jedoch enger als ἀποκαταστῆσαι („zurückbringen/wieder an den zugehörigen Ort bringen“) und schwächt die ausdrücklich gerichtete Zielangabe εἰς ab. „Zusammen mit“ bildet μετὰ zudem unmittelbarer ab als „bei“.'
  naturalness: Der Entwurf ist in modernem Standarddeutsch gut verständlich und würdig. Die revidierte Fassung bleibt flüssig; „zurückzubringen“ ist bei der Rückführung von Leichnamen idiomatisch und wahrt zugleich den griechischen Wiederherstellungs-/Rückkehrgedanken.
  terminology: „Männer um Judas“, „Leichname der Gefallenen“ und „Gräber ihrer Vorfahren“ sind sachgerecht. „Gräber ihrer Vorfahren“ gibt πατρῴους τάφους natürlich wieder, ohne die doppelte Bezugnahme auf Angehörige und angestammte Gräber zu verschmelzen.
  issues:
