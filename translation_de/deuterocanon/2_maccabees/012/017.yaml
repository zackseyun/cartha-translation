  yaml_path: translation/deuterocanon/2_maccabees/012/017.yaml
  text: From there they marched seven hundred fifty stadia and came to Charax and to the Jews called Toubianoi[a].
translation:
  language: de
  text: Von dort brachen sie auf, legten siebenhundertfünfzig Stadien zurück und kamen nach Charax und zu den Juden, die Tubianer genannt wurden[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zu den tubianischen Juden“; der Gruppenname Τουβιηνοί kann auch deutend als „Tobiaden“ wiedergegeben werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποσπάσαντες
  choice: brachen sie auf
  rationale: Das Partizip bezeichnet hier das Sichlösen von einem Ort und den Aufbruch. „Brachen sie auf“ ist im deutschen Reise- und Militärkontext natürlich, ohne die Art der Fortbewegung überzubestimmen.
- source_word: σταδίους ἑπτακοσίους πεντήκοντα
  choice: siebenhundertfünfzig Stadien
  rationale: Das antike Längenmaß wird entsprechend dem griechischen Text beibehalten; eine moderne Umrechnung würde zusätzliche Unsicherheit in den Haupttext eintragen.
- source_word: διήνυσαν
  choice: legten … zurück und kamen
  rationale: Das Verb bezeichnet das Zurücklegen beziehungsweise Bewältigen einer Strecke. Die Formulierung verbindet die genannte Entfernung idiomatisch mit dem anschließenden Ziel.
- source_word: εἰς τὸν Χάρακα
  choice: nach Charax
  rationale: Der Ortsname wird transliteriert; „nach“ ist bei einer Ortsbezeichnung die natürliche deutsche Richtungsangabe.
- source_word: τοὺς λεγομένους Τουβιηνοὺς Ἰουδαίους
  choice: zu den sogenannten tubianischen Juden
  rationale: „Sogenannt“ gibt λεγομένους wieder, ohne zwingend einen abwertenden Unterton anzunehmen. „Tubianisch“ bildet den griechischen Gruppennamen Τουβιηνοί in lesbarer deutscher Form ab; die mögliche Deutung als Tobiadische Juden bleibt in der Fußnote erhalten.
theological_decisions: []
translation_notes:
  register: Moderner, würdiger Erzählstil. Das historische Längenmaß und der Ortsname bleiben erhalten; der wenig sichere Gruppenname wird im Haupttext nur behutsam eingedeutscht und in der Fußnote erläutert.
