review_pass:
  verdict: revise
  source_fidelity: 'Der Reiseverlauf, die Distanz von 750 Stadien und die beiden Zielangaben entsprechen dem griechischen Text. Die Wiedergabe von λεγομένους durch „sogenannten“ ist jedoch weniger genau: Das griechische Partizip bedeutet hier neutral „genannt/als ... bekannt“ und setzt keine distanzierende Nuance voraus.'
  naturalness: Der Satz ist insgesamt flüssig und modern. „Juden, die Tubianer genannt wurden“ ist idiomatisches Standarddeutsch und macht die im Griechischen als Gruppenbezeichnung gebrauchte Form transparenter als das ungewöhnliche Adjektiv „tubianisch“.
  terminology: Charax und das antike Längenmaß „Stadien“ sollten beibehalten werden. „Tubianer“ ist als behutsame deutsche Wiedergabe von Τουβιηνοί vorzuziehen; „Tobiaden“ bleibt als interpretierende, nicht als sichere Haupttext-Wiedergabe in der Fußnote.
  issues:
  - severity: medium
    issue: „sogenannten“ für λεγομένους
    rationale: „Sogenannt“ kann im heutigen Deutsch eine skeptische oder abwertende Distanz signalisieren. λεγομένους bezeichnet hier neutral eine Benennung; „die Tubianer genannt wurden“ bildet dies ohne zusätzliche Konnotation ab.
  - severity: low
    issue: „tubianischen Juden“ als Haupttextform
    rationale: Die adjektivische Bildung ist zwar verständlich, aber ungebräuchlich und verdeckt, dass Τουβιηνοί eine Gruppenbezeichnung ist. Die Formulierung mit „Tubianer“ ist klarer und näher an der griechischen Konstruktion.
  revised_text: Von dort brachen sie auf, legten siebenhundertfünfzig Stadien zurück und kamen nach Charax und zu den Juden, die Tubianer genannt wurden[a].
