base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/012/022.yaml
  text: But when Judas’s company first appeared[a], and dread came upon the enemies—fear also coming upon them from the appearing of the One who watches over all things—they rushed into flight, each man being driven a different way, so that they were often injured by their own men and run through by the points of their swords.
translation:
  language: de
  text: Als aber die Truppe des Judas zuerst in Erscheinung trat und Schrecken über die Feinde kam, ja sie auch Furcht befiel aufgrund der Erscheinung dessen, der alles überschaut,[a] stürzten sie sich in die Flucht. Jeder wurde in eine andere Richtung getrieben, sodass sie oft von den eigenen Leuten verletzt und von Schwertspitzen durchbohrt wurden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „aufgrund des Erscheinens dessen, der alles sieht“. Im Griechischen wird hier dieselbe Wortwurzel für „Erscheinung“ wiederholt, die zuvor vom Auftreten der Truppe des Judas gebraucht wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιφανείσης … ἐπιφανίας
  choice: in Erscheinung trat … Erscheinung
  rationale: Die Wiederholung desselben griechischen Wortstamms wird im Deutschen sichtbar gehalten. Beim Auftreten der Truppe ist die verbale Wendung natürlich; bei der göttlichen Manifestation bewahrt „Erscheinung“ die mögliche epiphanische Bedeutung.
- source_word: σπείρης
  choice: Truppe
  rationale: Das Wort bezeichnet hier eine militärische Einheit, ohne dass ihre genaue Größe sicher bestimmt werden kann. „Truppe“ vermeidet die zu präzise technische Festlegung auf eine Kohorte.
- source_word: δέους … φόβου
  choice: Schrecken … Furcht
  rationale: Die beiden bedeutungsnahen griechischen Begriffe werden unterschieden, ohne ihren Zusammenhang zu verwischen.
- source_word: τοῦ τὰ πάντα ἐφορῶντος
  choice: dessen, der alles überschaut
  rationale: ἐφοράω kann sowohl das Sehen als auch das überblickende Beaufsichtigen ausdrücken. „Alles überschaut“ wahrt diese Bedeutungsbreite und klingt als Gottesumschreibung würdig.
- source_word: εἰς φυγὴν ὥρμησαν
  choice: stürzten sie sich in die Flucht
  rationale: Die Formulierung gibt die plötzliche, heftige Bewegung des Verbs ὁρμάω und den panischen Rückzug anschaulich wieder.
- source_word: ἄλλος ἀλλαχῇ φερόμενος
  choice: Jeder wurde in eine andere Richtung getrieben
  rationale: 'Die distributive und passive Aussage des Griechischen wird bewahrt: Die Fliehenden werden im Chaos auseinandergetrieben.'
- source_word: βλάπτεσθαι
  choice: verletzt
  rationale: Das Verb bezeichnet allgemein eine Schädigung; im militärischen Zusammenhang ist „verletzt“ natürlich, ohne die Art der Verwundung genauer festzulegen.
- source_word: ἀναπείρεσθαι … ταῖς τῶν ξιφῶν ἀκμαῖς
  choice: von Schwertspitzen durchbohrt
  rationale: Die Wendung bewahrt das konkrete Bild des Durchbohrens mit den Spitzen der Schwerter.
theological_decisions:
- issue: Göttliche Bezeichnung τοῦ τὰ πάντα ἐφορῶντος
  choice: dessen, der alles überschaut
  alternative: dessen, der alles sieht / der über alles wacht
  rationale: Die Übersetzung bezeugt Gottes umfassende Wahrnehmung, legt aber nicht einseitig fest, ob vor allem sein Sehen oder seine fürsorglich-richterliche Aufsicht gemeint ist.
- issue: ἐπιφάνεια als göttliche Erscheinung
  choice: Erscheinung
  alternative: Offenbarung / sichtbares Eingreifen
  rationale: „Erscheinung“ erhält den Bezug zum vorangehenden ἐπιφανείσης und lässt offen, in welcher konkreten Weise Gottes Gegenwart sichtbar oder wirksam wurde.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzfolge bleibt der gesteigerten griechischen Darstellung nahe, wird aber zur besseren Lesbarkeit nach der Flucht geteilt. Militärische Fachbegriffe werden nicht genauer bestimmt, als es der Kontext erlaubt.
