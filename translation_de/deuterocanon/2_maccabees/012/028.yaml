  naturalness: Der Satz ist insgesamt würdevoll und gut verständlich. „Durch Gerichte“ ist jedoch im modernen Deutsch missverständlich und unidiomatisch. „Durch Gerichtstaten“ gibt den gemeinten Sinn klarer wieder und bewahrt den feierlich-narrativen Registerton.
  terminology: „Herrscher“ ist als Wiedergabe von τὸν δυνάστην vertretbar; die Fußnote wahrt die möglichen Nuancen. „Streitkräfte der Feinde“, „in ihre Gewalt bringen“ und „niederstrecken“ sind im Kontext angemessen. Die textkritische Fußnote zu κρίτους bleibt erforderlich.
