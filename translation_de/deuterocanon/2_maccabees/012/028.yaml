  to: Nachdem sie aber den Herrscher[a] angerufen hatten, der die Streitkräfte der Feinde durch Gerichtstaten[b] zerschmettert, brachten sie die Stadt in ihre Gewalt[c] und streckten fünfundzwanzigtausend von denen nieder, die sich darin befanden.
  rationale: Die einzige sichere Änderung ersetzt das missverständliche „durch Gerichte“ durch „durch Gerichtstaten“. Damit wird die wahrscheinliche Bedeutung der schwierigen griechischen Wendung idiomatisch wiedergegeben; die Fußnote macht weiterhin deutlich, dass der überlieferte Wortlaut ungewöhnlich ist. Alle übrigen Formulierungen bleiben erhalten, da sie den griechischen Text und den vorgesehenen modernen, würdevollen Stil angemessen abbilden.
