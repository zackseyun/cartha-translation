base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/012/028.yaml
  text: But after calling on the Sovereign[a], who with judgments shatters the forces of the enemies, they took the city under their control[c][b], and struck down twenty-five thousand of those inside.
translation:
  language: de
  text: Nachdem sie aber den Herrscher[a] angerufen hatten, der die Streitkräfte der Feinde durch Gerichtstaten[b] zerschmettert, brachten sie die Stadt in ihre Gewalt[c] und streckten fünfundzwanzigtausend von denen nieder, die sich darin befanden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den Mächtigen“ oder „den Machthaber“; das Wort ist hier ein göttlicher Titel.'
    reason: lexical_alternative
  - marker: b
    text: Die mit „durch Gerichtstaten“ wiedergegebene griechische Wendung enthält im überlieferten Text eine ungewöhnliche Form. Gemeint ist wahrscheinlich, dass Gott die Feinde durch Akte des Gerichts zerschmettert.
    reason: textual_variant
  - marker: c
    text: 'Oder: „nahmen sie die Stadt ein“; wörtlich: „nahmen sie die Stadt unter ihre Hand“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπικαλεσάμενοι
  choice: Nachdem sie … angerufen hatten
  rationale: Das Partizip Aorist bezeichnet die vorausgehende Anrufung Gottes; die temporale Wiedergabe wahrt die Abfolge und klingt im Deutschen natürlich.
- source_word: τὸν δυνάστην
  choice: den Herrscher
  rationale: Das Wort bezeichnet hier Gott als den, der Macht und Herrschaft besitzt. „Herrscher“ bewahrt den Charakter eines göttlichen Titels, ohne einen im Griechischen nicht genannten Gottesnamen einzutragen.
- source_word: μετὰ κρίτους
  choice: durch Gerichte
  rationale: Die überlieferte griechische Form ist ungewöhnlich. „Durch Gerichte“ gibt die naheliegende Deutung als richterliche Machttaten Gottes knapp wieder, ohne die textliche Schwierigkeit zu verdecken.
- source_word: συντρίβοντα
  choice: zerschmettert
  rationale: Das Präsenspartizip beschreibt eine kennzeichnende Handlung des Herrschers; „zerschmettert“ erhält die kraftvolle militärische Bildsprache.
- source_word: τὰς τῶν πολεμίων ὀλκάς
  choice: die Streitkräfte der Feinde
  rationale: Im militärischen Zusammenhang bezeichnet die Wendung am ehesten die Macht beziehungsweise die Verbände des Feindes. „Streitkräfte“ ist konkret und fügt sich in das Bild des Zerschmetterns.
- source_word: ἔλαβον τὴν πόλιν ὑποχείριον
  choice: brachten sie die Stadt in ihre Gewalt
  rationale: Die Formulierung gibt sowohl die Einnahme als auch die Unterwerfung unter ihre Hand beziehungsweise Macht wieder.
- source_word: κατέστρωσαν
  choice: streckten … nieder
  rationale: Im Kriegsbericht bezeichnet das Verb das Fällen beziehungsweise Töten einer großen Zahl. Die Wendung ist ernst, idiomatisch und nicht unnötig drastisch.
- source_word: τῶν ἔνδον
  choice: von denen, die sich darin befanden
  rationale: Die neutrale Formulierung bleibt beim griechischen Ausdruck und ergänzt weder ausdrücklich „Männer“ noch „Bewohner“.
- source_word: εἰς μυριάδας δύο πεντακισχιλίους
  choice: fünfundzwanzigtausend
  rationale: Die griechische Zahlenangabe ergibt insgesamt 25.000 und wird im Deutschen unmittelbar wiedergegeben.
theological_decisions:
- issue: Göttlicher Titel τὸν δυνάστην
  choice: den Herrscher
  alternative: den Mächtigen; den Machthaber
  rationale: Der Titel hebt Gottes Macht und Herrschaft hervor. „Herrscher“ bewahrt diesen theologischen Akzent, ohne einen spezifischeren Hoheits- oder Bundesnamen einzuführen.
- issue: Gott zerschmettert die feindlichen Kräfte μετὰ κρίτους
  choice: durch Gerichte
  alternative: durch Gerichtstaten
  rationale: Die Wiedergabe versteht die schwierige Form als Hinweis auf Gottes richterisches Handeln, kennzeichnet die Unsicherheit aber in einer Fußnote, statt sie dogmatisch zu glätten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau folgt der griechischen Handlungsfolge, vermeidet jedoch unnatürliche Partizipialhäufungen. Die militärische Gewalt wird klar benannt, ohne sie sprachlich auszuschmücken.
