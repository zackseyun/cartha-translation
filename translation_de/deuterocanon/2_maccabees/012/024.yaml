base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/012/024.yaml
  text: But Timothy himself[a], having fallen into the hands of those with Dositheus and Sosipater, begged with much cunning to be let go unharmed, because he had the parents of many of them, and of others their brothers[b], and it would happen that these would be disregarded.
translation:
  language: de
  text: Timotheus selbst aber geriet in die Hände der Männer um Dositheus und Sosipater. Mit viel List[a] bat er inständig, ihn unversehrt freizulassen; denn er hatte die Eltern vieler von ihnen und die Brüder anderer in seiner Gewalt, und es würde dazu kommen, dass diese missachtet würden.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit großer Hinterlist“ beziehungsweise „mit viel Täuschung“. Das griechische Wort bezeichnet hier wahrscheinlich listiges, betrügerisches Bitten und nicht buchstäbliche Zauberei.'
    reason: lexical_alternative
  - marker: b
    text: Der griechische Satz ist stark verkürzt. Timotheus verweist darauf, dass sich die Eltern vieler Männer und die Brüder anderer in seiner Gewalt befinden. Die genaue Folge von „dass diese missachtet würden“ wird nicht näher ausgeführt.
    reason: cultural_note
lexical_decisions:
- source_word: ἐμπεσὼν τοῖς περὶ τὸν Δωσίθεον καὶ Σωσίπατρον
  choice: fiel den Männern um Dositheus und Sosipater in die Hände
  rationale: Das griechische ἐμπίπτω bezeichnet wörtlich ein Hinein- oder Unter-etwas-Geraten; im Zusammenhang ist Gefangennahme beziehungsweise das Geraten in ihre Gewalt gemeint. Die Wendung οἱ περὶ mit Akkusativ bezeichnet die genannten Anführer samt ihren Leuten.
- source_word: ἠξίου
  choice: flehte er darum
  rationale: Das Verb kann bitten oder verlangen bedeuten; die Lage des gefangenen Timotheus und sein Versuch, seine Freilassung zu erreichen, legen hier ein dringliches Flehen nahe.
- source_word: μετὰ πολλῆς γοητίας
  choice: mit großer Verschlagenheit
  rationale: γοητία kann Zauberei, Gaukelei oder betrügerische List bezeichnen. Hier charakterisiert es am ehesten die raffinierte, manipulative Art seines Flehens, nicht buchstäbliche Magie.
- source_word: ἐξαφεῖναι ὡς σῷον αὐτόν
  choice: ihn unversehrt freizulassen
  rationale: ἐξαφίημι bezeichnet das Freilassen; ὡς σῷον αὐτόν verlangt, dass Timotheus dabei heil beziehungsweise unversehrt bleibt.
- source_word: διὰ τὸ πλειόνων μὲν γονεῖς, ὧν δὲ ἀδελφοὺς ἔχειν
  choice: denn er hatte die Eltern vieler von ihnen und die Brüder anderer in seiner Gewalt
  rationale: ἔχειν bedeutet formal „haben“, meint im Kontext jedoch, dass Timotheus die Angehörigen festhielt oder über sie verfügen konnte. „In seiner Gewalt“ macht diese im Griechischen implizite Geisellage verständlich.
- source_word: καὶ τούτους ἀλογηθῆναι συμβήσεται
  choice: und sonst würden diese keine Schonung erfahren
  rationale: ἀλογέω bedeutet nicht beachten, nicht berücksichtigen oder für nichts achten. Im Kontext ist die Drohung gemeint, dass die Angehörigen bei Timotheus’ Tod ohne Rücksicht behandelt würden. Die Formulierung gibt die konkrete Folge wieder, ohne ihr genaues Ausmaß festzulegen.
