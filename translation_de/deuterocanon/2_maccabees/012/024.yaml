    issue: Die Formulierung „und sonst würden diese keine Schonung erfahren“ fügt eine Bedingung und eine spezifischere Konsequenz ein.
    rationale: καὶ τούτους ἀλογηθῆναι συμβήσεται besagt lediglich, dass es dazu kommen werde, dass jene als nicht beachtenswert behandelt bzw. missachtet würden. Weder ein „sonst“ noch eine konkrete mangelnde Schonung steht ausdrücklich im Text.
  - severity: medium
    issue: Fußnote b setzt voraus, dass Timotheus getötet würde.
    rationale: Die Fußnote erklärt die Folge mit „Wenn sie ihn töten“. Dies mag kontextuell denkbar sein, wird aber nicht vom griechischen Wortlaut gesagt und sollte daher nicht als Inhalt des Verses ausgegeben werden.
