translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzfolge wurde gegenüber dem langen griechischen Satz geteilt, um die Geiseldrohung klar verständlich zu machen. „Keine Schonung erfahren“ bewahrt, dass der griechische Text die angedrohte Behandlung der Angehörigen nicht genauer benennt.
