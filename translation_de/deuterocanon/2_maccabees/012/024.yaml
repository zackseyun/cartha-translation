revisions:
- from: Timotheus selbst aber fiel den Männern um Dositheus und Sosipater in die Hände. Mit großer Verschlagenheit[a] flehte er darum, ihn unversehrt freizulassen; denn er hatte die Eltern vieler von ihnen und die Brüder anderer in seiner Gewalt, und sonst würden diese keine Schonung erfahren.[b]
  to: Timotheus selbst aber geriet in die Hände der Männer um Dositheus und Sosipater. Mit viel List[a] bat er inständig, ihn unversehrt freizulassen; denn er hatte die Eltern vieler von ihnen und die Brüder anderer in seiner Gewalt, und es würde dazu kommen, dass diese missachtet würden.[b]
  rationale: Die Revision entfernt die nicht ausdrücklich im griechischen Text enthaltene Bedingung „sonst“ und vermeidet die in Fußnote b eingeführte Annahme einer Tötung. „Missachtet würden“ gibt ἀλογηθῆναι unmittelbar wieder und lässt offen, welche konkrete Behandlung Timotheus den Angehörigen androht. Die übrigen inhaltlichen Entscheidungen bleiben erhalten.
