lexical_decisions:
- source_word: τὸ κοινὸν τῆς πόλεως ψήφισμα
  choice: die Stadt einen gemeinsamen Beschluss gefasst
  rationale: ψήφισμα bezeichnet einen förmlichen Beschluss; τὸ κοινόν hebt seinen gemeinschaftlichen beziehungsweise öffentlichen Charakter hervor. Die verbale Fassung ist im Deutschen natürlicher als „der gemeinsame Beschluss der Stadt“.
- source_word: τούτων ἐπιδεξαμένων
  choice: diese Männer ihm zugestimmt hatten
  rationale: ἐπιδέχομαι bezeichnet hier das Annehmen oder Billigen des städtischen Beschlusses beziehungsweise der damit verbundenen Vereinbarung. „Zugestimmt“ gibt diesen Sinn idiomatisch wieder.
- source_word: ὡς ἂν εἰρηνεύειν θέλοντων
  choice: da sie in Frieden leben wollten
  rationale: Die Wendung beschreibt die Männer als friedenswillig. „In Frieden leben“ wahrt den durativen Sinn von εἰρηνεύειν, ohne ihnen bloß taktisches Verhalten zu unterstellen.
- source_word: μηδὲν ὑπόπτον ἐχόντων
  choice: nichts Verdächtiges vermuteten
  rationale: Die Formulierung lässt sich als fehlender Argwohn der Opfer verstehen und passt so zum erzählerischen Zusammenhang. Da ὑπόπτον auch etwas an ihnen Verdächtiges bezeichnen kann, wird die Alternative in einer Fußnote bewahrt.
- source_word: ἀχθέντας αὐτούς
  choice: brachte man sie fort
  rationale: Das passive Partizip von ἄγω bezeichnet ihr Wegführen oder Fortbringen. Die unpersönliche deutsche Konstruktion vermeidet eine unnötige Festlegung auf einen ausdrücklich genannten Täter oder Zielort.
- source_word: ἐβύθισαν
  choice: ertränkte sie
  rationale: βυθίζω bedeutet versenken oder in die Tiefe bringen; bei Menschen gibt „ertränken“ die beabsichtigte tödliche Handlung klar und natürlich wieder.
- source_word: ὄντας οὐκ ἔλαττον τῶν διακοσίων
  choice: nicht weniger als zweihundert
  rationale: Die Formulierung bewahrt die Untergrenze der griechischen Mengenangabe und bezieht sie unmittelbar auf die Getöteten.
