  text: But after the common resolution of the city[a], and when these men had accepted it as though they wanted peace and had nothing suspicious in mind, they took them away and drowned them, no fewer than two hundred of them.
translation:
  language: de
  text: Nachdem jedoch die Stadt einen gemeinsamen Beschluss gefasst und diese Männer ihm zugestimmt hatten, als ob sie in Frieden leben wollten und nichts Verdächtiges im Sinn hatten,[a] führte man sie fort und ertränkte sie, mindestens zweihundert von ihnen.
  philosophy: optimal-equivalence
