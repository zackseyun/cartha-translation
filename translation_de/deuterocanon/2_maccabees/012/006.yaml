  yaml_path: translation/deuterocanon/2_maccabees/012/006.yaml
  text: 'And calling on God[a], the righteous judge, he came against the murderers of his brothers: by night he set the harbor on fire and burned the ships, and he stabbed those who had fled there.'
translation:
  language: de
  text: Er rief Gott, den gerechten Richter, an, zog gegen die Mörder seiner Brüder und setzte bei Nacht den Hafen in Brand und verbrannte die Schiffe; die aber, die dorthin geflohen waren[a], durchbohrte er.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: die dort Zuflucht gesucht hatten.'
    reason: Das griechische Partizip συμφυγόντας kann neben der gemeinsamen Flucht an diesen Ort auch hervorheben, dass die Betroffenen dort Schutz suchten.
lexical_decisions:
- source_word: ἐπικαλεσάμενος
  choice: Er rief … an
  rationale: Das Partizip bezeichnet hier die Anrufung Gottes vor dem Vorgehen. „anrufen“ ist im Deutschen natürlich und bewahrt den religiösen Sinn.
- source_word: τὸν δίκαιον κριτὴν θεόν
  choice: Gott, den gerechten Richter
  rationale: Die Apposition wird im Deutschen natürlich wiedergegeben. „gerecht“ bewahrt sowohl die moralische als auch die richterliche Bedeutung von δίκαιος.
- source_word: παραγενόμενος ἐπὶ
  choice: zog gegen
  rationale: Im militärischen Zusammenhang bezeichnet die Wendung eine gegen feindliche Personen gerichtete Bewegung. „zog gegen“ ist prägnant und erzählerisch angemessen.
- source_word: τοὺς μιαιφόνους τῶν ἀδελφῶν
  choice: die Mörder seiner Brüder
  rationale: μιαιφόνος bezeichnet mit starkem Ausdruck blutschuldige Mörder. Das Possessivpronomen verdeutlicht im Deutschen den aus dem Kontext erschließbaren Bezug auf Judas’ jüdische Brüder beziehungsweise Volksgenossen.
- source_word: τὸν μὲν λιμένα
  choice: den Hafen
  rationale: λιμήν bezeichnet einen Hafen. Die konkrete Ortsbezeichnung passt zur geschilderten nächtlichen Vergeltungsaktion.
- source_word: νύκτωρ
  choice: bei Nacht
  rationale: Die knappe adverbiale Zeitangabe wahrt den gehobenen Erzählton.
- source_word: ἐνέπρησεν
  choice: setzte … in Brand
  rationale: Das Verb bezeichnet das Entzünden beziehungsweise Inbrandsetzen und wird so im Deutschen idiomatisch wiedergegeben.
- source_word: τὰ σκάφη κατέφλεξεν
  choice: verbrannte die Schiffe
  rationale: σκάφη bezeichnet hier die Wasserfahrzeuge im Hafen; „Schiffe“ passt zum militärischen Zusammenhang. κατέφλεξεν drückt ihre Verbrennung aus.
- source_word: τοὺς δὲ ἐκεῖ συμφυγόντας
  choice: die aber, die dorthin geflohen waren
  rationale: Das Partizip beschreibt Menschen, die gemeinsam dorthin geflohen waren. Die Formulierung bewahrt die Fluchtbewegung; die mögliche Betonung des Zufluchtnehmens wird in der Fußnote genannt.
- source_word: ἐξεκέντησεν
  choice: durchbohrte er
  rationale: Das Verb bezeichnet das Durchstechen mit einer spitzen Waffe. „durchbohrte“ bleibt nah am griechischen Bild, ohne eine nicht ausdrücklich genannte Todesfolge hinzuzufügen.
theological_decisions:
- issue: Bezeichnung Gottes als Richter im Zusammenhang militärischer Vergeltung
  choice: Gott, den gerechten Richter
  alternative: Gott, den gerechten Richter, um Hilfe bittend
  rationale: Der Text verbindet Judas’ Anrufung Gottes unmittelbar mit seinem Vorgehen gegen die Mörder. Die Übersetzung bewahrt diese Spannung und die richterliche Gottesbezeichnung, ohne daraus eine weitergehende theologische Billigung der Handlung abzuleiten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit straffer historischer Erzählweise. Die Satzfolge folgt dem griechischen Handlungsablauf; das Gegensatzpaar μέν/δέ wird durch das Semikolon und „aber“ erkennbar gemacht.
