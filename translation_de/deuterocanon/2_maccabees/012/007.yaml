  text: But when the place had been closed up[a], he withdrew, intending to come again and root out the entire citizen body of the people of Joppa.
translation:
  language: de
  text: Nachdem der Ort abgeriegelt worden war, zog er ab, in der Absicht, wiederzukommen und die gesamte Bürgerschaft von Joppe[a] mit der Wurzel auszurotten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das gesamte Gemeinwesen von Joppe“. Das griechische Wort kann die Bürgerschaft, das Gemeinwesen oder die politische Gemeinschaft bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦ ... χωρίου
  choice: der Ort
  rationale: χωρίον bezeichnet einen Ort, ein Gebiet oder eine Örtlichkeit. „Ort“ bleibt bewusst neutral und legt nicht fest, ob eine befestigte Anlage oder ein größeres Gebiet gemeint ist.
- source_word: συγκλεισθέντος
  choice: abgeriegelt worden war
  rationale: Das passive Partizip von συγκλείω bezeichnet ein Einschließen oder Abriegeln. „Abgeriegelt“ ist im militärischen Zusammenhang natürlich, bewahrt das Passiv und lässt die genaue Maßnahme offen.
- source_word: ἀνέλυσεν
  choice: zog er ab
  rationale: ἀναλύω kann im erzählenden, militärischen Zusammenhang das Aufbrechen oder Fortziehen bezeichnen. „Zog er ab“ gibt den vorläufigen Rückzug mit beabsichtigter Wiederkehr prägnant wieder.
- source_word: πάλιν ἥξων
  choice: Er hatte vor, wiederzukommen
  rationale: Das Futurpartizip drückt hier Absicht oder Zweck aus. Die eigenständige deutsche Satzform gibt diesen Sinn natürlich und eindeutig wieder.
- source_word: τὸ σύμπαν ... πολίτευμα
  choice: die gesamte Bürgerschaft
  rationale: πολίτευμα kann die organisierte Bürgergemeinschaft, das Gemeinwesen oder die politische Gemeinschaft bezeichnen. „Bürgerschaft“ wahrt den korporativ-politischen Sinn, ohne den Ausdruck allein auf die Regierung oder unterschiedslos auf sämtliche Einwohner zu verengen; „gesamte“ entspricht σύμπαν.
- source_word: τῶν Ἰοππιτῶν
  choice: von Joppe
  rationale: Ἰοππῖται bezeichnet die Einwohner beziehungsweise Bürger Joppes. In Verbindung mit „Bürgerschaft“ ist „von Joppe“ idiomatisch und vermeidet die schwerfällige Doppelung „Bürgerschaft der Einwohner von Joppe“.
- source_word: ἐκριζῶσαι
  choice: mit der Wurzel auszurotten
  rationale: ἐκριζόω bedeutet wörtlich „entwurzeln“ und übertragen vollständig beseitigen. Die feste deutsche Wendung bewahrt sowohl das Bild als auch die Härte der angekündigten Handlung.
theological_decisions:
- issue: Härte und Umfang der beabsichtigten Handlung gegen Joppe
  choice: Korporativ als „die gesamte Bürgerschaft von Joppe mit der Wurzel auszurotten“ wiedergeben
  alternative: „alle Einwohner von Joppe zu vernichten“ oder „das ganze Gemeinwesen von Joppe zu beseitigen“
  rationale: Der griechische Ausdruck stellt πολίτευμα, eine bürgerlich-politische Gemeinschaft, in den Mittelpunkt und bestimmt sie durch σύμπαν als vollständig. Die Übersetzung bewahrt diesen korporativen Umfang, ohne ihn auf bloße Regierungsstrukturen einzuengen oder ausdrücklich mit jedem einzelnen Einwohner gleichzusetzen. Die drastische Absicht wird weder gemildert noch über den Wortlaut hinaus ausgeweitet.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Kurze, klare Satzglieder geben den erzählenden und militärischen Ton wieder. „Mit der Wurzel ausrotten“ erhält das griechische Bild und seine Schärfe; die Fußnote wahrt die Bedeutungsbreite von πολίτευμα.
