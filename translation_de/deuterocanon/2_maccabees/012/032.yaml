  yaml_path: translation/deuterocanon/2_maccabees/012/032.yaml
  text: But after the so-called Pentecost, they moved out against Gorgias, the governor of Idumea.
translation:
  language: de
  text: Nach dem sogenannten Pfingstfest[a] zogen sie gegen Gorgias, den Befehlshaber von Idumäa[b], aus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „nach dem sogenannten Pfingsten“; griechisch auch: „nach dem, was Pfingsten genannt wird“.'
    reason: lexical_alternative
  - marker: b
    text: Das griechische Wort kann auch „Statthalter“ oder „Heerführer“ bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ
  choice: Nach
  rationale: Die Präposition bezeichnet hier den Zeitpunkt nach dem genannten Fest.
- source_word: τὴν λεγομένην πεντηκοστήν
  choice: dem sogenannten Pfingstfest
  rationale: „Pfingstfest“ ist die geläufige deutsche Bezeichnung; „sogenannten“ gibt λεγομένην eng wieder, ohne die Wendung als ausdrückliche Infragestellung zu deuten.
- source_word: ὥρμησαν
  choice: zogen ... aus
  rationale: Im militärischen Zusammenhang bezeichnet das Verb den entschlossenen Aufbruch; „ausziehen“ ist natürlich und überbetont weder Eile noch Angriffswucht.
- source_word: ἐπὶ Γοργίαν
  choice: gegen Gorgias
  rationale: ἐπί mit Akkusativ bezeichnet bei einer militärischen Bewegung hier die feindliche Zielrichtung.
- source_word: στρατηγόν
  choice: Befehlshaber
  rationale: στρατηγός bezeichnet vor allem einen militärischen Führer, kann bei regionaler Zuständigkeit aber auch einen Statthalter meinen. „Befehlshaber“ passt zum unmittelbaren Feldzugskontext; die andere Möglichkeit bleibt in der Fußnote erhalten.
- source_word: Ἰδουμαίας
  choice: Idumäa
  rationale: „Idumäa“ ist die etablierte deutsche Form des griechischen geografischen Namens.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung mit „zogen ... aus“ bewahrt den militärischen Kampagnencharakter und bleibt für heutige Leser gut verständlich. Das isolierte abschließende „Α“ der vorgelegten Editionszeile wurde als kein Bestandteil des Verses behandelt.
