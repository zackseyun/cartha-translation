base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/012/023.yaml
  text: But Judas pressed the pursuit more vigorously[a], and, striking down the wretches, he destroyed as many as three thousand men.
translation:
  language: de
  text: Judas aber setzte die Verfolgung mit noch größerem Nachdruck fort, schlug die Frevler nieder und vernichtete bis zu dreißigtausend Mann.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »bis zu drei Myriaden von Männern«, also bis zu dreißigtausend Mann. Diese überlieferte Zahlenangabe ist im Zusammenhang schwierig; vielfach wird hier eine Zahl von dreitausend angenommen.'
    reason: Die griechische Überlieferung nennt drei Myriaden, während Kontext und verbreitete Übersetzungstradition für dreitausend sprechen. Die Fußnote bewahrt diese textliche und auslegerische Spannung.
lexical_decisions:
- source_word: ἐποίει ... τὸν διωγμόν
  choice: setzte die Verfolgung ... fort
  rationale: Die griechische Wendung bezeichnet das Betreiben beziehungsweise Fortführen der Verfolgung; die deutsche Formulierung ist natürlich und bewahrt den Handlungsverlauf.
- source_word: εὐτονώτερον
  choice: mit noch größerem Nachdruck
  rationale: Der Komparativ bezeichnet gesteigerte Kraft oder Intensität und passt hier zum militärischen Verfolgungsgeschehen.
- source_word: συνετίνων
  choice: schlug ... nieder
  rationale: Das Partizip beschreibt im Kampf ein heftiges Angreifen oder Niederschlagen, ohne eine bestimmte Waffe vorauszusetzen.
- source_word: τοὺς ἀλιτηρίους
  choice: die Frevler
  rationale: Das stark abwertende Wort bezeichnet schuldige, verwerfliche oder fluchbeladene Menschen. »Frevler« bewahrt das moralische Urteil des Erzählers, ohne einen modernen juristischen Sinn einzutragen.
- source_word: διέφθειρεν
  choice: vernichtete
  rationale: διαφθείρω kann im militärischen Zusammenhang »vernichten« oder »töten« bedeuten. »Vernichtete« entspricht der Aussagebreite des griechischen Verbs.
- source_word: εἰς μυριάδας τρεῖς ἀνδρῶν
  choice: bis zu dreißigtausend Mann
  rationale: Der überlieferte griechische Text nennt wörtlich drei Myriaden, also dreißigtausend. Die Hauptübersetzung folgt deshalb trotz der kontextuellen Schwierigkeit dem bezeugten Ausgangstext; die verbreitete Deutung als dreitausend wird in der Fußnote dokumentiert.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der militärische Erzählstil bleibt knapp und energisch; die stark wertende Bezeichnung ἀλιτηρίους wird mit »Frevler« wiedergegeben. Die schwer verständliche überlieferte Zahlenangabe wird im Haupttext nicht stillschweigend berichtigt.
