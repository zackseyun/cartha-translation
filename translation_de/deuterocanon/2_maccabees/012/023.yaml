  source_fidelity: Die Übersetzung gibt den militärischen Verfolgungsvorgang, den gesteigerten Nachdruck (Komparativ εὐτονώτερον), die abwertende Personenbezeichnung ἀλιτηρίους und διέφθειρεν im kriegerischen Sinn treffend wieder. Die im überlieferten griechischen Text stehenden drei Myriaden werden im Haupttext mit dreißigtausend bewahrt. Die Fußnote kennzeichnet sachgerecht, dass die Zahl im Kontext schwierig ist und häufig als dreitausend verstanden wird, ohne den Ausgangstext stillschweigend zu emendieren.
  naturalness: „Judas aber setzte die Verfolgung mit noch größerem Nachdruck fort“ ist modernes, würdiges und im erzählerisch-militärischen Kontext gut verständliches Standarddeutsch. Auch „schlug die Frevler nieder“ und „vernichtete … Mann“ sind in diesem knappen historiographischen Register natürlich.
  terminology: „Frevler“ gibt die stark pejorative, moralisch wertende Bezeichnung τοὺς ἀλιτηρίους angemessen wieder, ohne eine spezifische konfessionelle Deutung festzulegen. „Mann“ ist für ἀνδρῶν im militärischen Kontext idiomatisch. Der Fußnotenanker steht unmittelbar bei der strittigen Zahlenangabe.
