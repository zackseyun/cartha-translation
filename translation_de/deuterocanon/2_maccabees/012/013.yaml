  - severity: low
    issue: „bunt gemischten Völkern“ ist stilistisch markiert
    rationale: Die Wendung kann zwar eine vielfältige Zusammensetzung bezeichnen, ist aber weniger neutral. Eine Formulierung mit „Menschen aus vielen verschiedenen Völkern“ gibt den pluralischen ethnischen Bezug verständlich und ohne zusätzliche Konnotation wieder.
