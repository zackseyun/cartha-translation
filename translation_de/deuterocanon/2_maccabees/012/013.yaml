  text: He also advanced against a certain city of bridges[a], strongly fortified and enclosed with walls, inhabited by mixed peoples; its name was Caspin.
translation:
  language: de
  text: Er zog auch gegen eine gewisse Stadt mit Brücken[a], die stark befestigt, von Mauern umschlossen und von Menschen aus vielen verschiedenen Völkern bewohnt war. Sie hieß Kaspin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder wörtlicher: „eine Stadt der Brücken“. Die knappe griechische Wendung kann eine Stadt bezeichnen, die durch Brücken oder Dammwerke geprägt war, ohne dass damit ein förmlicher Beiname gemeint sein muss.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐπέβαλεν
  choice: zog … gegen
  rationale: Die Wendung gibt das militärische Vorgehen gegen die Stadt wieder, ohne bereits eine bestimmte Form des Angriffs vorwegzunehmen.
- source_word: ἐπί τινα πόλιν
  choice: gegen eine gewisse Stadt
  rationale: „Eine gewisse“ bewahrt die unbestimmte Einführung durch τινα; „gegen“ entspricht dem feindlichen Vorgehen im Zusammenhang.
- source_word: γεφυρῶν
  choice: Stadt der Brücken
  rationale: Der komprimierte Genitiv wird möglichst eng wiedergegeben und bezeichnet wahrscheinlich eine durch Brücken oder brückenartige Bauwerke charakterisierte Stadt; die genaue Beziehung bleibt offen und wird in der Fußnote erläutert.
- source_word: ὀχυρὰν
  choice: stark befestigt
  rationale: Das Adjektiv bezeichnet hier die militärische beziehungsweise defensive Stärke der Stadt.
- source_word: τείχεσιν περιτεφραγμένην
  choice: von Mauern umschlossen
  rationale: Die Formulierung bewahrt das Bild einer ringsum durch Mauern eingefassten Stadt.
- source_word: παμμιγέσιν ἔθνεσιν
  choice: von bunt gemischten Völkern
  rationale: παμμιγής hebt die weitgehende Mischung hervor, während der Plural „Völker“ die ethnische Vielheit von ἔθνεσιν wahrt.
- source_word: κατοικουμένην
  choice: bewohnt
  rationale: Dies ist die direkte und natürliche Wiedergabe des passiven Partizips.
- source_word: ὄνομα δὲ Κασπείν
  choice: Sie hieß Kaspin
  rationale: Die deutsche Namensformel gibt den Sinn knapp und natürlich wieder; Κασπείν wird als „Kaspin“ transliteriert.
