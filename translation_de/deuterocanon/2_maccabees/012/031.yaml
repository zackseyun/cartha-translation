base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/012/031.yaml
  text: After giving thanks and urging them beforehand also in the future to be well-disposed toward the nation[a], they came to Jerusalem, as the feast of weeks was approaching.
translation:
  language: de
  text: Nachdem sie Dank gesagt und sie zuvor ermahnt hatten, dem Volk auch künftig wohlgesinnt zu sein, kamen sie nach Jerusalem, als das Wochenfest[a] nahe war.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traditionell: Pfingsten.'
    reason: Nennt die geläufige traditionelle Bezeichnung, ohne sie an die Stelle der ausdrücklichen griechischen Festbezeichnung zu setzen.
lexical_decisions:
- source_word: εὐχαριστήσαντες
  choice: Nachdem sie Dank gesagt hatten
  rationale: Das Aoristpartizip bezeichnet eine vorausgehende Handlung. „Dank gesagt“ lässt wie der griechische Text offen, wem der Dank galt, und vermeidet eine nicht ausdrücklich genannte Ergänzung.
- source_word: προπαρακαλέσαντες
  choice: und sie zuvor ermahnt hatten
  rationale: „Ermahnt“ gibt den auffordernden Sinn von παρακαλέω wieder; „zuvor“ bewahrt die zeitliche Nuance der Vorsilbe προ-.
- source_word: εἰς τὰ λοιπά
  choice: auch künftig
  rationale: Die Wendung blickt auf die kommende Zeit und wird im Deutschen knapp und idiomatisch mit „künftig“ wiedergegeben; „auch“ spiegelt die Fortsetzung des bisherigen Wohlwollens.
- source_word: πρὸς τὸ γένος
  choice: dem Volk
  rationale: γένος bezeichnet hier das jüdische Volk als ethnisch-nationale Gemeinschaft. „Volk“ ist im Deutschen natürlich und vermeidet die biologisch belastete Wiedergabe „Rasse“.
- source_word: εὐμενεῖς εἶναι
  choice: wohlgesinnt zu sein
  rationale: Die Wendung bezeichnet eine freundliche, günstige Haltung; „wohlgesinnt“ ist präzise, verständlich und dem historischen Erzählstil angemessen.
- source_word: παρεγενήθησαν
  choice: kamen sie
  rationale: Das Verb bezeichnet im Erzählzusammenhang das Kommen beziehungsweise Eintreffen an einem Ort; „kamen“ ist schlicht und idiomatisch.
- source_word: τῆς τῶν ἑβδομάδων ἑορτῆς
  choice: das Wochenfest
  rationale: Die deutsche jüdisch-biblische Festbezeichnung gibt den griechischen Ausdruck unmittelbar wieder, ohne ihn durch den später geläufigen Namen „Pfingsten“ zu ersetzen.
- source_word: οὔσης ὑπογύου
  choice: als … unmittelbar bevorstand
  rationale: Der Genitivus absolutus gibt einen begleitenden zeitlichen Umstand an. ὑπόγυος bezeichnet etwas, das nahe oder unmittelbar bevorstehend ist.
theological_decisions:
- issue: Benennung von τῆς τῶν ἑβδομάδων ἑορτῆς
  choice: Wochenfest
  alternative: Pfingsten
  rationale: Der griechische Text nennt das jüdische Fest mit seiner beschreibenden Bezeichnung. „Wochenfest“ folgt dieser Formulierung unmittelbar; „Pfingsten“ wird nur als traditionelle Bezeichnung in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau bewahrt die Abfolge der griechischen Partizipien, bleibt aber flüssig. Die nicht ausdrücklich genannte Bezugsgröße des Dankes wird nicht ergänzt; beim Mahnen macht das Pronomen „sie“ den aus dem Zusammenhang hervorgehenden Adressaten kenntlich.
