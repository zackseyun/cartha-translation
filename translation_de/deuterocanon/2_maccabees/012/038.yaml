  terminology: „Heer“, „reinigten sie sich“, „nach dem Brauch“ und „Sabbat“ sind angemessen. Für den in deutschen Bibeltraditionen geläufigen Ortsnamen ist „Adullam“ vorzuziehen; er entspricht dem griechischen Ὀδολλάμ als etablierte deutsche Namensform.
