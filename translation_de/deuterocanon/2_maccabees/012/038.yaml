  text: Then Judas[a], taking the army, came to the city of Odollam. And as the week was ending, they purified themselves there according to the custom and spent the Sabbath there.
translation:
  language: de
  text: Judas nahm das Heer mit sich und kam in die Stadt Adullam. Als aber der siebte Tag nahte[a], reinigten sie sich dort nach dem Brauch, und er verbrachte dort den Sabbat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „als die Woche herankam“. Die griechische Wendung ist nicht ganz eindeutig; der Zusammenhang und die anschließende Erwähnung des Sabbats weisen auf das Nahen des siebten Tages hin.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναλαβὼν
  choice: nahm ... mit sich
  rationale: Das Partizip bezeichnet hier, dass Judas das Heer mitnahm und mit ihm weiterzog. Die Formulierung ist im Deutschen natürlich, ohne ein erneutes Sammeln oder eine Rückkehr ausdrücklich in den Text hineinzulesen.
- source_word: στράτευμα
  choice: Heer
  rationale: στράτευμα bezeichnet einen militärischen Verband; „Heer“ ist eine direkte und für den historischen Erzählstil angemessene Entsprechung.
- source_word: ἧκεν
  choice: kam
  rationale: Das Verb bezeichnet das Gelangen an einen Ort. „Kam ... in die Stadt“ gibt die erzählte Bewegung knapp und idiomatisch wieder.
- source_word: Ὀδολλὰμ πόλιν
  choice: in die Stadt Odollam
  rationale: πόλις wird ausdrücklich als „Stadt“ wiedergegeben; der Ortsname wird in der überlieferten Form transliteriert.
- source_word: τῆς ... ἑβδομάδος ἐπιβαλλούσης
  choice: als nun das Ende der Woche nahte
  rationale: Die griechische Wendung lautet wörtlicher, dass die Woche „herankam“. Wegen des unmittelbar folgenden Sabbats ist das Nahen des Wochenendes gemeint. Die Übersetzung macht den zeitlichen Bezug verständlich; die wörtlichere Möglichkeit wird in der Fußnote bewahrt.
- source_word: κατὰ τὸν ἐθισμόν
  choice: nach dem Brauch
  rationale: ἐθισμός bezeichnet eine übliche oder überlieferte Praxis. „Nach dem Brauch“ ist knapp, würdig und in modernem Deutsch geläufig.
- source_word: ἁγνισθέντες
  choice: reinigten sie sich
  rationale: Die Formulierung bewahrt den rituellen Sinn der Reinigung. Der reflexive Ausdruck gibt den passivischen griechischen Partizipialausdruck im Deutschen natürlich wieder.
- source_word: αὐτόθι
  choice: dort
  rationale: Das einfache Ortsadverb wird direkt und idiomatisch wiedergegeben.
- source_word: τὸ σάββατον διῆγεν
  choice: verbrachten dort den Sabbat
  rationale: διάγω bezeichnet das Verbringen einer Zeitspanne. Diese Wiedergabe vermeidet es, über die erkennbare Sabbatpraxis hinaus eine bestimmte liturgische Handlung einzutragen.
theological_decisions:
- issue: Rituelle Reinigung vor dem Sabbat
  choice: reinigten sie sich dort nach dem Brauch
  alternative: wuschen sie sich dort, wie es üblich war
  rationale: ἁγνίζω trägt einen rituellen beziehungsweise kultischen Sinn. „Reinigten sie sich“ erhält diesen Bedeutungsgehalt, ohne eine nicht genannte konkrete Waschhandlung oder weitere Zeremonie hinzuzufügen.
- issue: Zeitangabe vor dem Sabbat
  choice: als nun das Ende der Woche nahte
  alternative: als nun die Woche herankam
  rationale: Die griechische Wendung ist ungewöhnlich und kann formaler wiedergegeben werden; der folgende Hinweis auf den Sabbat zeigt jedoch, dass der Abschluss der Woche bevorstand. Die Hauptübersetzung verdeutlicht den Kontext, während die Fußnote die formale Ambiguität offenlegt.
translation_notes:
  register: Moderner, würdiger Erzählstil mit klarer Satzführung. Der Ortsname und der ausdrücklich genannte Sabbat bleiben erhalten. Die rituelle Sprache wird weder säkularisiert noch konfessionell ausgeweitet.
