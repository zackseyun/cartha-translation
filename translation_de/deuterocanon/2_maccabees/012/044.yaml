  yaml_path: translation/deuterocanon/2_maccabees/012/044.yaml
  text: For if he were not expecting those who had fallen to rise again[a], it would be excessive and foolish to pray for the dead.
translation:
  language: de
  text: Denn wenn er nicht erwartet hätte, dass die Gefallenen wieder auferstehen[a], wäre es überflüssig und töricht, für die Toten zu beten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dass die Verstorbenen wieder auferstehen“; wörtlich: „die Gefallenen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προπεπτωκότας
  choice: die Gefallenen
  rationale: Das substantivierte Partizip Perfekt bewahrt das griechische Bild des Fallens und bezeichnet im militärischen Zusammenhang die im Kampf Verstorbenen.
- source_word: ἀναστῆναι
  choice: wieder auferstehen
  rationale: Der Infinitiv bezeichnet hier die Auferstehung. „Wieder auferstehen“ ist im Deutschen eindeutig und gibt die aktive Form wieder, ohne einen im Griechischen nicht ausgedrückten Passivsatz zu erzwingen.
- source_word: προσεδόκα
  choice: erwartet hätte
  rationale: Das Verb bedeutet „erwarten“ oder „entgegensehen“. Der Irrealis der Vergangenheit gibt die Bedingung im Deutschen natürlich wieder.
- source_word: περισσὸν
  choice: überflüssig
  rationale: Das Adjektiv bezeichnet hier etwas, das unnötig oder ohne Nutzen ist. „Überflüssig“ trifft diesen Sinn idiomatisch und ohne stärkere Deutung.
- source_word: ληρῶδες
  choice: töricht
  rationale: Das Wort bezeichnet etwas Unsinniges oder Närrisches. „Töricht“ wahrt den würdevollen biblischen Sprachton und die rhetorische Schärfe.
- source_word: ὑπὲρ νεκρῶν
  choice: für die Toten
  rationale: ὑπέρ mit dem Genitiv bezeichnet hier das Gebet zugunsten Verstorbener; „für die Toten“ ist die natürliche deutsche Formulierung.
- source_word: εὔχεσθαι
  choice: zu beten
  rationale: Im Zusammenhang bezeichnet das Medium das Beten. Die schlichte Wiedergabe ist klar und idiomatisch.
theological_decisions:
- issue: Auferstehungserwartung als Begründung des Gebets für die Toten
  choice: 'Die Bedingung wird unmittelbar wiedergegeben: Ohne die Erwartung der Auferstehung der Gefallenen wäre das Gebet für die Toten überflüssig und töricht.'
  alternative: Man könnte ausdrücklich von der „leiblichen Auferstehung“ sprechen oder den Satz durch spätere Lehren über den Zustand nach dem Tod erläutern.
  rationale: Der griechische Text stellt die Verbindung her, entfaltet sie jedoch nicht weiter. Die Übersetzung bewahrt diese theologische Spannung und fügt weder eine Lehre vom Zwischenzustand noch von einer Läuterung hinzu.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. „Die Gefallenen“ erhält das militärische Bild; die Fußnote erklärt die gemeinte Todesreferenz.
