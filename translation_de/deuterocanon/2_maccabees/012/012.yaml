  yaml_path: translation/deuterocanon/2_maccabees/012/012.yaml
  text: But Judas[a], recognizing that they were truly useful to them in many ways, agreed to keep peace with them; and after giving right hands, they parted to their tents.
translation:
  language: de
  text: Judas aber erkannte, dass sie ihnen in vieler Hinsicht wirklich nützlich waren, und erklärte sich bereit, mit ihnen Frieden zu halten. Nachdem sie einander die rechte Hand gegeben hatten[a], kehrten sie jeweils zu ihren Zelten zurück.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „nachdem sie rechte Hände genommen hatten“ – eine übliche Geste zur Bekräftigung einer Zusage oder Vereinbarung.'
    reason: cultural_note
lexical_decisions:
- source_word: ὑπολαβών
  choice: erkannte
  rationale: Das Partizip bezeichnet hier Judas’ Einschätzung der Lage; „erkannte“ gibt das erwogene Urteil natürlich und knapp wieder.
- source_word: ὡς ἀληθῶς
  choice: wirklich
  rationale: Die Wendung bekräftigt die tatsächliche Nützlichkeit und wird im modernen Deutsch idiomatisch mit „wirklich“ wiedergegeben.
- source_word: ἐν πολλοῖς
  choice: in vieler Hinsicht
  rationale: Die weite, idiomatische Formulierung bewahrt den Gedanken eines Nutzens in mehreren Belangen, ohne diese näher festzulegen.
- source_word: χρησίμους
  choice: von Nutzen
  rationale: Die Wendung gibt den praktischen Nutzen im politischen und militärischen Zusammenhang wieder, ohne ein bestimmtes Motiv hineinzulesen.
- source_word: ὑπεχώρησεν εἰρήνην ἄξειν πρὸς αὐτούς
  choice: erklärte sich bereit, mit ihnen Frieden zu halten
  rationale: ὑποχωρέω bezeichnet hier ein Einlenken oder Zugeständnis; εἰρήνην ἄγειν meint die Aufrechterhaltung friedlicher Beziehungen.
- source_word: λαβόντες δεξιάς
  choice: nachdem sie einander die rechte Hand gegeben hatten
  rationale: Die konkrete Geste wird bewahrt und durch „einander“ als gegenseitige Handlung verständlich ausgedrückt.
- source_word: εἰς τὰς σκηνὰς ἐχωρίσθησαν
  choice: kehrten sie jeweils zu ihren Zelten zurück
  rationale: Die Übersetzung vermittelt sowohl das Auseinandergehen als auch die Rückkehr zu den jeweiligen Zelten in natürlichem Deutsch.
theological_decisions:
- issue: Diplomatische Geste in λαβόντες δεξιάς
  choice: Das konkrete Bild des gegenseitigen Händereichens bleibt im Haupttext erhalten.
  alternative: Idiomatish als „sie schlossen einen Bund“ oder „sie besiegelten die Vereinbarung“ wiedergeben.
  rationale: Die griechische Formulierung nennt die Geste, legt aber ihre genaue rechtliche Bedeutung nicht ausdrücklich fest. Die konkrete Wiedergabe wahrt diese Offenheit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur wurde für gute Verständlichkeit leicht gegliedert; die diplomatische Geste und die offene Aussage über den praktischen Nutzen bleiben erhalten.
