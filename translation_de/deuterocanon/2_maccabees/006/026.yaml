  source_fidelity: 'Der Vers ist im Kern treffend wiedergegeben: Der Gegensatz zwischen einer von Menschen ausgehenden Strafe und der Unentrinnbarkeit vor den „Händen des Allmächtigen“ bleibt erhalten. „Jetzt“ ist jedoch enger als ἐπὶ τοῦ παρόντος, das den vorläufigen Charakter („für den Augenblick“) hervorhebt.'
  naturalness: Der Satz ist modernes, würdiges Standarddeutsch und syntaktisch natürlich. „Für den Augenblick“ gibt die zeitliche Einschränkung etwas genauer wieder als „jetzt“, ohne unnatürlich zu wirken.
  terminology: „der Allmächtige“ ist eine angemessene, etablierte Wiedergabe von παντοκράτωρ; das Bild von dessen „Händen“ bleibt zu Recht erhalten. Die vorhandene Fußnote deutet das Bild allerdings als „Gericht“ aus und formuliert eine weitergehende Erklärung, die der knappen Aussage des griechischen Textes nicht hinzugefügt werden sollte.
