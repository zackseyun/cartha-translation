  - severity: medium
    issue: Die Fußnote ersetzt die metaphorischen „Hände“ durch „Gericht“ und erläutert den Tod stärker als der Text selbst.
    rationale: Der griechische Text sagt, dass der Sprecher weder lebend noch nach dem Tod den Händen des Allmächtigen entkommen wird. Eine Fußnote sollte diese Aussage nicht zu einer ausdrücklich formulierten Lehre vom göttlichen Gericht ausbauen.
