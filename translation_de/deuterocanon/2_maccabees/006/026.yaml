base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/006/026.yaml
  text: For even if for the present I escape the punishment from men[b][a], yet I will escape neither alive nor dead from the hands of the Almighty.
translation:
  language: de
  text: Denn selbst wenn ich für den Augenblick der Strafe durch Menschen entgehe, werde ich den Händen des Allmächtigen weder lebend noch tot entkommen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰ γὰρ καὶ
  choice: Denn selbst wenn
  rationale: Bewahrt die begründende Funktion von γάρ und gibt die konzessive Verbindung εἰ ... καί in natürlichem Deutsch wieder.
- source_word: ἐπὶ τοῦ παρόντος
  choice: jetzt
  rationale: Gibt die zeitliche Begrenzung knapp und idiomatisch wieder; gemeint ist ein gegenwärtiges, nur vorläufiges Entkommen.
- source_word: ἐξελοῦμαι
  choice: ich ... entgehe
  rationale: Das Medium bezeichnet hier das Entrinnen aus einer drohenden Strafe; „entgehen“ passt im Deutschen unmittelbar zur Strafe.
- source_word: τὴν ἐξ ἀνθρώπων τιμωρίαν
  choice: der Strafe durch Menschen
  rationale: Macht deutlich, dass Menschen die Strafe verhängen, und erhält den Gegensatz zum Zugriff des Allmächtigen.
- source_word: ἀλλὰ
  choice: werde ... [dennoch nicht]
  rationale: Der starke Gegensatz wird im Deutschen bereits durch die Satzwendung und die Negation „weder ... noch“ deutlich; ein zusätzliches „doch“ wäre möglich, aber nicht nötig.
- source_word: τὰς τοῦ παντοκράτορος χεῖρας
  choice: den Händen des Allmächtigen
  rationale: Bewahrt das anschauliche biblische Bild und gibt παντοκράτωρ mit dem geläufigen, würdevollen Titel „der Allmächtige“ wieder.
- source_word: οὔτε ζῶν οὔτε ἀποθανών
  choice: weder lebend noch tot
  rationale: Erhält die zugespitzte Polarität des Griechischen und lässt offen, wie die Aussage über Gottes Zugriff nach dem Tod näher zu entfalten ist.
- source_word: ἐκφεύξομαι
  choice: werde ich ... entkommen
  rationale: Gibt das Futur und die Bedeutung des Entrinnens idiomatisch wieder; der Dativ bei „den Händen entkommen“ ist im Deutschen natürlich.
theological_decisions:
- issue: Wiedergabe von παντοκράτωρ
  choice: des Allmächtigen
  alternative: des Allherrschers
  rationale: „Der Allmächtige“ ist die geläufige und präzise Gottesbezeichnung. Sie fügt das im Griechischen nicht ausdrücklich stehende Wort „Gott“ nicht hinzu.
- issue: Aussage von οὔτε ζῶν οὔτε ἀποθανών über die Reichweite göttlichen Gerichts
  choice: weder lebend noch tot
  alternative: weder im Leben noch nach dem Tod
  rationale: 'Die knappe Form bewahrt die theologische Spannung: Auch der Tod ermöglicht kein Entkommen vor dem Allmächtigen, ohne eine ausführlichere Jenseitslehre in den Vers hineinzutragen.'
translation_notes:
  register: 'Modernes, würdiges Standarddeutsch. Der Satz bleibt eng an der griechischen Kontraststruktur, verwendet aber natürliche deutsche Verbindungen: einer Strafe entgehen und Händen entkommen.'
