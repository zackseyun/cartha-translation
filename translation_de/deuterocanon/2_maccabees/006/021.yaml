base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/006/021.yaml
  text: But those who had been appointed over the unlawful meal[a], because of their long-standing acquaintance with the man, took him aside privately and urged him to bring meat that it was proper for him to use, prepared by himself, and to pretend that he was eating the meats from the sacrifice that had been ordered by the king[b],
translation:
  language: de
  text: Diejenigen aber, die für das gesetzwidrige Mahl[a] eingeteilt waren, hatten Mitleid mit ihm, weil sie ihn schon seit langer Zeit kannten. Sie nahmen ihn privat beiseite und forderten ihn auf, Fleisch mitzubringen, das er essen durfte und das er selbst zubereitet hatte, und so zu tun, als esse er von dem Fleisch aus dem Opfer, dessen Verzehr der König angeordnet hatte[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „für die gesetzwidrigen Dinge“. Gemeint ist im Zusammenhang das erzwungene Essen von Fleisch, das nach dem Gesetz nicht gegessen werden durfte.'
    reason: Die griechische Wendung τὰ παράνομα ist elliptisch und nennt den konkreten Bezug nicht ausdrücklich.
  - marker: b
    text: Gemeint ist Fleisch aus heidnischen Opfergaben, dessen Verzehr der König angeordnet hatte.
    reason: Die kulturelle Bedeutung von „Fleisch aus dem Opfer“ ist heutigen Lesern möglicherweise nicht unmittelbar klar.
lexical_decisions:
- source_word: οἱ ... πρὸς τὰ παράνομα ... τεταγμένοι
  choice: die für das gesetzwidrige Mahl eingeteilt waren
  rationale: τεταγμένοι bezeichnet eine vorausgegangene Einteilung oder Beauftragung. τὰ παράνομα bleibt im Griechischen elliptisch; aus dem Zusammenhang ergibt sich das gesetzeswidrige Essen, ohne dass es mit θυσία gleichgesetzt werden sollte.
- source_word: σπλαγχνισμοῦ
  choice: hatten Mitleid mit ihm
  rationale: Das Wort bezeichnet ausdrücklich Mitleid oder Erbarmen. Die deutsche Formulierung macht dieses im Griechischen vorhandene Motiv sichtbar.
- source_word: διὰ τὴν ἐκ τῶν παλαιῶν χρόνων πρὸς τὸν ἄνδρα γνῶσιν
  choice: weil sie ihn schon seit langer Zeit kannten
  rationale: γνῶσις meint hier persönliche Bekanntschaft, nicht abstraktes Wissen; die Wendung wird in natürlichem modernem Deutsch wiedergegeben.
- source_word: ἀπολαμβάνοντες αὐτὸν κατʼ ἰδίαν ἐκάλουν
  choice: Sie nahmen ihn heimlich beiseite und forderten ihn auf
  rationale: ἀπολαμβάνειν κατ’ ἰδίαν beschreibt das Absondern von den anderen; ἐκάλουν leitet hier den Vorschlag beziehungsweise die Aufforderung ein.
- source_word: ἐνέγκοντα κρέα, οἷς καθῆκον αὐτῷ χρᾶσθαι, διʼ αὐτοῦ παρασκευασθέντα
  choice: selbst zubereitetes Fleisch mitzubringen, das er essen durfte
  rationale: 'Die Übersetzung erhält die drei Aussagen: Er sollte Fleisch mitbringen, es sollte von ihm selbst zubereitet sein, und sein Gebrauch als Speise sollte für ihn zulässig sein. Im Speisekontext ist „essen durfte“ natürlicher und präziser als „gebrauchen durfte“.'
- source_word: ὑποκρῖναι
  choice: so zu tun, als
  rationale: Das Verb bedeutet hier, einen falschen Anschein zu erwecken oder etwas vorzutäuschen.
- source_word: τὰ ὑπὸ τοῦ βασιλέως τεταγμένα τῶν ἀπὸ τῆς θυσίας κρεῶν
  choice: das vom König angeordnete Fleisch aus dem Opfer
  rationale: Die Formulierung bewahrt sowohl den königlichen Zwang als auch die Herkunft des Fleisches aus einem Opfer. Der deutsche Singular „Fleisch“ gibt das griechische κρέα idiomatisch als Sammelbegriff wieder.
theological_decisions:
- issue: Bezug von τὰ παράνομα
  choice: gesetzwidriges Mahl
  alternative: gesetzwidrige Dinge; gesetzwidriges Opfer
  rationale: Der unmittelbare Kontext handelt vom erzwungenen Essen verbotenen Fleisches. „Mahl“ konkretisiert die Ellipse behutsam, während „Opfer“ τὰ παράνομα vorzeitig mit der später ausdrücklich genannten θυσία gleichsetzen würde.
- issue: Ausdruck des σπλαγχνισμοῦ
  choice: Mitleid ausdrücklich im Haupttext genannt
  alternative: Mitleid nur indirekt durch die langjährige Bekanntschaft andeuten
  rationale: Das griechische Wort nennt Mitleid ausdrücklich. Seine Wiedergabe verhindert, dass eines der beiden Motive – Mitleid und langjährige Bekanntschaft – verloren geht.
- issue: Moralische Spannung des vorgeschlagenen Vorgehens
  choice: das Vortäuschen ohne wertende Ergänzung wiedergegeben
  alternative: das Vorgehen als berechtigte List oder als sündhafte Täuschung kennzeichnen
  rationale: Der Vers berichtet den Vorschlag, bewertet ihn hier aber noch nicht ausdrücklich. Die Übersetzung soll diese erzählerische und theologische Spannung nicht vorwegnehmen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzfolge wurde gegenüber der langen griechischen Periode geteilt, um Verständlichkeit zu schaffen, ohne Aussagen oder Motive auszulassen. „Heimlich beiseite“ gibt κατ’ ἰδίαν kontextgerecht wieder; „selbst zubereitet“ bleibt bewusst nahe an δι’ αὐτοῦ παρασκευασθέντα.
