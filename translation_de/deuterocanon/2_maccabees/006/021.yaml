  text: οἱ δὲ πρὸς τὰ παράνομα σπλαγχνισμοῦ τεταγμένοι διὰ τὴν ἐκ τῶν παλαιῶν χρόνων πρὸς τὸν ἄνδρα γνῶσιν ἀπολαμβάνοντες αὐτὸν κατʼ ἰδίαν ἐκάλουν, ἐνέγκοντα κρέα, οἷς καθῆκον αὐτῷ χρᾶσθαι, διʼ αὐτοῦ παρασκευασθέντα, ὑποκρῖναι δὲ ὡς ἐσθίοντα τὰ ὑπὸ τοῦ βασιλέως τεταγμένα τῶν ἀπὸ τῆς θυσίας κρεῶν,
