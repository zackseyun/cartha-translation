  yaml_path: translation/deuterocanon/2_maccabees/006/012.yaml
  text: Therefore I urge those who read this book not to be disheartened because of these calamities[a], but to consider that these punishments are not for destruction[c][b], but for the discipline of our people.
translation:
  language: de
  text: 'Darum bitte ich die Leser dieses Buches, sich durch dieses Unheil nicht entmutigen zu lassen, sondern zu bedenken: Diese Strafen sind nicht zu unserem Untergang, sondern zur Erziehung[a] unseres Volkes.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Erziehung“ kann hier auch mit „Zurechtweisung“, „Unterweisung“ oder „Disziplin“ wiedergegeben werden. Das griechische Wort bezeichnet eine formende, korrigierende Erziehung.
    reason: lexical_alternative
lexical_decisions:
- source_word: Παρακαλῶ
  choice: bitte ich
  rationale: παρακαλέω bezeichnet hier einen eindringlichen Appell. „Bitte ich“ klingt im modernen Deutschen natürlich und würdig, ohne die Aussage unnötig zu verschärfen.
- source_word: τοὺς ἐντυγχάνοντας τῇδε τῇ βίβλῳ
  choice: die Leser dieses Buches
  rationale: ἐντυγχάνω bedeutet wörtlich „begegnen/auf etwas treffen“, kann bei einem Buch aber idiomatisch dessen Leser bezeichnen. „Die Leser dieses Buches“ ist im Deutschen klarer als „die diesem Buch begegnen“.
- source_word: μὴ συντελεσθαι
  choice: sich … nicht entmutigen zu lassen
  rationale: Die Form bezeichnet hier, dass jemand durch das Erlebte innerlich überwältigt oder niedergedrückt wird. Die gewählte Wendung gibt den idiomatischen Sinn verständlich wieder.
- source_word: διὰ τὰς συμφορὰς
  choice: durch diese Unglücksfälle
  rationale: συμφοραί bezeichnet schwere Missgeschicke, Unglücksfälle oder Katastrophen. „Unglücksfälle“ wahrt den Ernst des Zusammenhangs und vermeidet die heute oft naturbezogene Verengung von „Katastrophen“.
- source_word: λογίζεσθαι
  choice: zu bedenken
  rationale: λογίζομαι fordert zu einer überlegten Beurteilung auf. „Bedenken“ ist prägnant und natürlich.
- source_word: τὰς τιμωρίας
  choice: diese Strafen
  rationale: τιμωρία bezeichnet Strafe oder Ahndung. Das hinweisende „diese“ stellt im Deutschen den natürlichen Bezug zu den zuvor genannten Unglücksfällen her.
- source_word: μὴ πρὸς ὄλεθρον
  choice: nicht unserem Untergang
  rationale: ὄλεθρος kann „Untergang“, „Verderben“ oder „Vernichtung“ bedeuten. „Untergang“ bewahrt die mögliche Bedeutungsbreite und passt zum kollektiven Bezug.
- source_word: ἀλλὰ πρὸς παιδείαν
  choice: sondern der Erziehung
  rationale: παιδεία umfasst Erziehung, Zurechtweisung, Schulung und formende Disziplin. „Erziehung“ hält den korrektiven und zugleich formenden Charakter offen; eine Fußnote nennt mögliche Alternativen.
- source_word: τοῦ γένους ἡμῶν
  choice: unseres Volkes
  rationale: γένος bezeichnet hier die gemeinschaftliche Herkunfts- und Volksgruppe. „Unser Volk“ ist natürlich und vermeidet die missverständlichen modernen Konnotationen von „Rasse“.
- source_word: εἶναι
  choice: dienen
  rationale: Im Zusammenhang mit zweimaligem πρὸς bringt „dienen“ den Zweckbezug idiomatisch zum Ausdruck, ohne eine zusätzliche Aussage über göttliche Absicht einzuführen.
theological_decisions:
- issue: Untergang oder korrigierende Formung als Zweck der Strafen
  choice: Die Strafen dienen nicht dem Untergang, sondern der Erziehung des Volkes.
  alternative: Die Leiden seien lediglich allgemeine Belehrung oder ausschließlich politische Folgen menschlichen Handelns.
  rationale: Der griechische Text stellt mit μὴ πρὸς ὄλεθρον, ἀλλὰ πρὸς παιδείαν ausdrücklich Untergang und formende Zurechtweisung gegenüber. Die Übersetzung wahrt diese Spannung, ohne eine umfassendere Lehre über Vorsehung oder Strafgericht hinzuzufügen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch in würdigem Erzählton. Der Satzbau folgt dem griechischen Gegensatz, ist aber für flüssiges Deutsch leicht gegliedert. Der einzige Fußnotenmarker [a] steht unmittelbar nach dem Ausdruck, den die Anmerkung erläutert.
