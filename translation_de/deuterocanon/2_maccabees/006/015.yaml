  text: so that[a], when our sins have reached their full measure[b], he may not afterward take vengeance on us.
translation:
  language: de
  text: damit er[a] nicht, wenn unsere Sünden ihr volles Maß erreicht haben,[b] später an uns Vergeltung übt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Subjekt »er« steht nicht ausdrücklich im griechischen Satz, sondern ergibt sich aus dem unmittelbaren Zusammenhang und bezieht sich auf den Herrn.
    reason: cross_reference
  - marker: b
    text: 'Wörtlicher: »ans Ende gekommen sind«. Gemeint ist wahrscheinlich, dass die Sünden ihre äußerste Grenze oder ihr volles Maß erreicht haben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα μὴ
  choice: damit … nicht
  rationale: Gibt die verneinte Absichts- bzw. Zweckkonstruktion im Deutschen natürlich wieder und bewahrt den Bezug zur Begründung im vorausgehenden Kontext.
- source_word: πρὸς τέλος
  choice: ihr volles Maß
  rationale: Die Wendung bezeichnet hier das Erreichen eines Endpunkts oder einer Grenze. Bei Sünden drückt »volles Maß« diesen Gedanken idiomatisch aus, ohne ihn lediglich zeitlich als »Ende« zu verstehen.
- source_word: ἀφικομένων
  choice: erreicht haben
  rationale: Das Verb bezeichnet das Gelangen an einen Ziel- oder Endpunkt. Zusammen mit πρὸς τέλος ist »erreicht haben« eine präzise und natürliche Wiedergabe.
- source_word: ἡμῶν τῶν ἁμαρτιῶν
  choice: unsere Sünden
  rationale: Natürliche deutsche Wiedergabe der possessiven Genitivkonstruktion innerhalb des Genitivus absolutus.
- source_word: ὕστερον
  choice: später
  rationale: Bewahrt den zeitlichen Gegensatz zur gegenwärtigen, nicht bis zuletzt aufgeschobenen Züchtigung im Kontext.
- source_word: ἐκδικά
  choice: an uns Vergeltung übt
  rationale: Bewahrt den richterlich-vergeltenden Sinn des Verbs deutlicher als das allgemeinere »bestraft«, ohne eine zusätzliche Deutung einzutragen.
theological_decisions:
- issue: Das göttliche Subjekt ist in diesem Satzglied nur aus dem Kontext erschließbar.
  choice: er … an uns Vergeltung übt
  alternative: der Herr … an uns Vergeltung übt
  rationale: Das Deutsche verlangt ein ausdrückliches Subjekt. Das Pronomen »er« wahrt die knappe Ausdrucksweise des Griechischen; der unmittelbare Kontext identifiziert den Herrn als Handelnden.
- issue: Die Sünden gelangen an einen Endpunkt beziehungsweise eine Grenze.
  choice: wenn unsere Sünden ihr volles Maß erreicht haben
  alternative: wenn unsere Sünden ans Ende gekommen sind
  rationale: »Volles Maß« gibt den kontextuellen Gedanken einer erreichten Grenze verständlich wieder, ohne näher festzulegen, wie dieses Maß theologisch zu bestimmen ist.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung bleibt gut verständlich und erhält sowohl die Zweckbeziehung als auch den zeitlichen Kontrast. »Vergeltung üben« bewahrt den gerichtlichen Nachdruck des griechischen Verbs.
