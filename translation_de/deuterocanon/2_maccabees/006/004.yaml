  yaml_path: translation/deuterocanon/2_maccabees/006/004.yaml
  text: For the sanctuary was filled by the Gentiles with debauchery and revelry, boldly carousing with prostitutes, approaching women in the sacred precincts, and even bringing inside things that were not proper.
translation:
  language: de
  text: 'Denn Nichtjuden erfüllten das Heiligtum mit Ausschweifungen und Gelagen: Sie führten sich schamlos mit Prostituierten[a] auf, näherten sich Frauen in den heiligen Bezirken[b] und brachten sogar Dinge hinein, die sich dort nicht gehörten.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Kurtisanen“. Das griechische Wort kann Frauen bezeichnen, die zur sexuellen Gesellschaft unterhalten wurden.'
    reason: lexical_alternative
  - marker: b
    text: Die Wendung „sich Frauen nähern“ deutet hier wahrscheinlich auf sexuell anstößiges Verhalten in den heiligen Tempelbezirken hin; der griechische Wortlaut ist jedoch weniger ausdrücklich als „mit Frauen verkehren“.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἱερόν
  choice: Heiligtum
  rationale: Bezeichnet hier den Jerusalemer Tempel als geheiligten Raum; „Heiligtum“ bewahrt den kultischen Akzent.
- source_word: ἀσωτίας καὶ κώμων
  choice: Ausschweifungen und Gelage
  rationale: Die Verbindung bezeichnet zügellose Lebensführung und lärmende, enthemmte Festgelage. Der deutsche Plural gibt die griechischen Formen natürlich wieder.
- source_word: ἐθνῶν
  choice: Nichtjuden
  rationale: Im jüdischen Kontext bezeichnet der Ausdruck Menschen aus den Völkern im Gegensatz zum jüdischen Volk. „Nichtjuden“ ist präzise und vermeidet die zusätzliche religiöse Wertung von „Heiden“.
- source_word: θρασυνόντων μεθ’ ἑταίρων
  choice: Schamlos trieben sie ihr Spiel mit Prostituierten
  rationale: Das Partizip bezeichnet dreistes, unverschämtes Verhalten; ἑταῖραι sind im hellenistischen Sprachgebrauch häufig Kurtisanen beziehungsweise Prostituierte. Die Wendung gibt den anstößigen Charakter wieder, ohne einen bestimmten sexuellen Akt festzulegen.
- source_word: ἐν τοῖς ἱεροῖς … γυναιξὶ πλησιαζόντων
  choice: näherten sich Frauen in den heiligen Bezirken
  rationale: „Sich nähern“ wahrt die zurückhaltende Formulierung von πλησιάζω, während der Zusammenhang unsittliches sexuelles Verhalten nahelegt. „Heilige Bezirke“ bezeichnet die verschiedenen geheiligten Tempelbereiche, ohne die Architektur genauer festzulegen.
- source_word: τὰ μὴ καθήκοντα ἔνδον εἰσφερόντων
  choice: brachten sogar Dinge hinein, die sich dort nicht gehörten
  rationale: Die bewusst allgemeine Aussage wird nicht auf bestimmte verbotene Gegenstände oder Handlungen eingeengt; „dort“ macht im Deutschen den Bezug auf das Heiligtum deutlich.
theological_decisions:
- issue: Wiedergabe von ἐθνῶν bei der Schändung des jüdischen Heiligtums
  choice: Nichtjuden
  alternative: Heiden; Angehörige der Völker
  rationale: Die ethnisch-religiöse Gegenüberstellung bleibt erhalten, ohne durch „Heiden“ eine über den griechischen Ausdruck hinausgehende polemische Wertung einzutragen.
- issue: Grad der Explizitheit bei γυναιξὶ πλησιαζόντων
  choice: näherten sich Frauen
  alternative: hatten Verkehr mit Frauen; ließen sich mit Frauen ein
  rationale: Der Zusammenhang legt sexuelles Fehlverhalten nahe, doch das griechische Verb formuliert selbst weniger ausdrücklich. Die Übersetzung bewahrt diese Spannung und erläutert die Implikation in der Fußnote.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem erzählerischem Ton. Die Satzteilung erhöht die Lesbarkeit, ohne die logische Verbindung des griechischen Satzes aufzulösen. Die Fußnotenmarker stehen unmittelbar bei den erklärungsbedürftigen Wendungen.
