translation:
  language: de
  text: Doch der Altar war von denen, die sich von den Gesetzen abgewandt hatten, mit Verbotenem[a] angefüllt worden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »mit Abscheulichem« oder »mit unerlaubten Dingen«. Das griechische Wort bezeichnet im Zusammenhang mit kultischer Entweihung, was unzulässig oder verboten ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: θυσιαστήριον
  choice: Altar
  rationale: „Altar“ ist die gewöhnliche und im Zusammenhang eindeutige Bedeutung; „Opferaltar“ würde den griechischen Ausdruck unnötig erweitern.
- source_word: ἀποδιεσταλμένοις
  choice: denen, die sich … abgewandt hatten
  rationale: Die Form bezeichnet eine Trennung oder Entfremdung von den Gesetzen. „Sich abgewandt hatten“ gibt dies natürlich wieder, ohne mit „Abtrünnige“ bereits eine wertende Bezeichnung einzuführen.
- source_word: νόμων
  choice: den Gesetzen
  rationale: Der griechische Text hat ausdrücklich den Plural. Dass die jüdischen Gesetze gemeint sind, ergibt sich aus dem Zusammenhang und muss nicht ergänzend in den Text aufgenommen werden.
- source_word: ἀθεμίτοις
  choice: mit Verbotenem
  rationale: Das substantivisch gebrauchte Adjektiv bezeichnet hier Dinge, die unerlaubt, unzulässig oder tabu sind. „Verbotenem“ bewahrt diese rechtlich-kultische Bedeutung, ohne sie vorschnell als „Gräuel“ zuzuspitzen.
- source_word: ἐπεπλήρωτο
  choice: war … angefüllt worden
  rationale: Der griechische Plusquamperfekt im Passiv beschreibt eine bereits vollzogene Befüllung und ihren fortbestehenden Zustand. Das deutsche Plusquamperfekt bildet sowohl die Vorzeitigkeit als auch das Passiv ab.
theological_decisions:
- issue: Stärke der kultischen Wertung in ἀθεμίτοις
  choice: Verbotenem
  alternative: Abscheulichem; unerlaubten Dingen
  rationale: Der Zusammenhang handelt von kultischer Entweihung, erlaubt also eine stärkere Wiedergabe. Das griechische Wort bezeichnet jedoch zunächst, was nicht erlaubt oder nicht geheiligt ist. „Verbotenem“ wahrt diese Offenheit und vermeidet eine unnötige theologische Zuspitzung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung macht sowohl die Handelnden als auch den Inhalt der Entweihung klar. Der Plural „Gesetze“ und die unbestimmte Bezeichnung des Verbotenen bleiben entsprechend dem griechischen Text erhalten.
