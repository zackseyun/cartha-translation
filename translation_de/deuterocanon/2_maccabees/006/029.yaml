  text: Those who were leading him changed the goodwill they had shown him a little earlier into hostility because of the words just spoken[a], since they regarded them, as they supposed, as madness.
translation:
  language: de
  text: Die Männer aber verwandelten das Wohlwollen, das sie ihm noch kurz zuvor entgegengebracht hatten, in Feindseligkeit, weil sie die eben gesprochenen Worte, wie sie meinten, für Wahnsinn[a] hielten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Unvernunft«, »Torheit« oder »Verzweiflung«. Das griechische Wort gibt wieder, wie die Männer seine Worte einschätzten, nicht unbedingt das Urteil des Erzählers.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τῶνδε ἀγόντων ... τὴν ... εὐμένειαν δυσμένειαν
  choice: Die Männer aber verwandelten ... das Wohlwollen ... in Feindseligkeit
  rationale: 'ἀγόντων hat hier εὐμένειαν als Objekt und δυσμένειαν als Ziel beziehungsweise Prädikativ: Die Männer führen nicht ihn, sondern lassen ihr Wohlwollen in Feindseligkeit umschlagen. Das griechische δέ ist als „aber“ wiedergegeben.'
- source_word: πρὸς αὐτὸν τὴν μικρῷ πρότερον εὐμένειαν
  choice: das Wohlwollen, das sie ihm noch kurz zuvor entgegengebracht hatten
  rationale: εὐμένεια bezeichnet Wohlwollen oder freundliche Gesinnung; πρὸς αὐτόν gibt deren Ausrichtung auf Eleasar an, und μικρῷ πρότερον bezeichnet den kurzen zeitlichen Abstand.
- source_word: δυσμένειαν
  choice: Feindseligkeit
  rationale: Der Ausdruck bildet den deutlichen Gegensatz zu εὐμένεια und bezeichnet den Wechsel von Wohlwollen zu feindlicher Gesinnung.
- source_word: διὰ τὴν τῶν προειρημένων λόγων ... ἀπόνοιαν
  choice: weil sie die eben gesprochenen Worte ... für Wahnsinn hielten
  rationale: Die substantivische griechische Fügung wird im Deutschen idiomatisch verbal wiedergegeben. προειρημένων verweist auf die unmittelbar zuvor gesprochenen Worte.
- source_word: ὡς αὐτοὶ ὑπελάμβανον
  choice: wie sie meinten
  rationale: Die Parenthese kennzeichnet die Beurteilung ausdrücklich als Meinung der Männer und nicht als Urteil des Erzählers.
- source_word: ἀπόνοιαν
  choice: Wahnsinn
  rationale: ἀπόνοια kann eine als vernunftlos, töricht oder verzweifelt wahrgenommene Haltung bezeichnen. „Wahnsinn“ bewahrt hier die Schärfe des abwertenden Urteils; weniger starke Alternativen werden in der Fußnote genannt.
theological_decisions:
- issue: Abstand des Erzählers zum Urteil der Männer
  choice: Die Worte werden nur aus Sicht der Männer als „Wahnsinn“ bezeichnet.
  alternative: Die Worte selbst werden vom Erzähler unmittelbar als Wahnsinn bewertet.
  rationale: ὡς αὐτοὶ ὑπελάμβανον weist die Bewertung ausdrücklich den Männern zu. „wie sie meinten“ wahrt diesen Perspektivabstand.
- issue: Handlung von ἀγόντων
  choice: Die Männer verwandeln ihr Wohlwollen in Feindseligkeit.
  alternative: Die Männer führen Eleasar ab.
  rationale: In der vorliegenden griechischen Syntax ist εὐμένειαν das Objekt zu ἀγόντων, während πρὸς αὐτόν das Wohlwollen auf Eleasar bezieht. Die Wiedergabe „die ihn abführten“ würde αὐτόν statt πρὸς αὐτόν als Objekt erwarten lassen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur ist gegenüber dem griechischen Genitivgefüge zu einem selbstständigen deutschen Satz geglättet; die Gegensätzlichkeit von Wohlwollen und Feindseligkeit sowie der ausdrücklich subjektive Charakter des Urteils bleiben erhalten.
