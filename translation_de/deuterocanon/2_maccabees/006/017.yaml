  text: But let this be said by way of reminder for us; now we must proceed with the narrative in a few words.
translation:
  language: de
  text: Doch dies sei uns zur Erinnerung gesagt; nun müssen wir mit wenigen Worten zur Erzählung übergehen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πλὴν
  choice: Doch
  rationale: Markiert knapp den abschließenden Übergang und den Gegensatz zum folgenden Fortgang der Erzählung.
- source_word: ἕως ὑπομνήσεως
  choice: zur Erinnerung
  rationale: Gibt den Zweck der vorangehenden Bemerkungen natürlich wieder; das ungewöhnliche ἕως hat hier sinngemäß eine begrenzende bzw. zweckbezogene Funktion.
- source_word: ἡμῖν
  choice: uns
  rationale: Bewahrt den ausdrücklich genannten Dativ und damit die Einbeziehung von Verfasser und Leserschaft.
- source_word: διʼ ὀλίγων
  choice: mit wenigen Worten
  rationale: Natürliche deutsche Wiedergabe für eine knappe Darstellung.
- source_word: ἐλευστέον
  choice: müssen wir … übergehen
  rationale: Das verbale Adjektiv drückt Notwendigkeit aus; die inklusive Formulierung passt zum unmittelbar vorausgehenden ἡμῖν.
- source_word: ἐπὶ τὴν διήγησιν
  choice: zur Erzählung
  rationale: Bezeichnet die Rückkehr zum eigentlichen Erzählgang.
