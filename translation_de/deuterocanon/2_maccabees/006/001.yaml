  text: Μετʼ οὐ πολὺν δὲ χρόνον ἐξαπέστειλεν ὁ βασιλεὺς γέροντι Ἀθηναῖον, ἀναγκάζειν τοὺς Ἰουδαίους μεταβαίνειν ἀπὸ τῶν πατρίων νόμων, καὶ τοῖς τοῦ θεοῦ νόμοις μὴ πολιτεύεσθαι·
