base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/006/001.yaml
  text: But after not much time[a], the king sent an aged Athenian to compel the Jews to depart from the laws of their fathers and not to live by the laws of God[b],
translation:
  language: de
  text: Doch nicht lange danach schickte der König einen betagten Athener. Er sollte die Juden zwingen, sich von den Gesetzen ihrer Väter abzuwenden und nicht nach den Gesetzen Gottes zu leben.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μετʼ οὐ πολὺν ... χρόνον
  choice: nicht lange danach
  rationale: Die natürliche deutsche Zeitangabe gibt die wörtliche Wendung »nach nicht viel Zeit« genau und flüssig wieder.
- source_word: ἐξαπέστειλεν
  choice: schickte
  rationale: Das Verb bedeutet »aussenden, entsenden«; »schickte« ist hier klar, natürlich und ausreichend.
- source_word: γέροντι Ἀθηναῖον
  choice: einen betagten Athener
  rationale: γέρων bezeichnet hier am ehesten das hohe Alter des Mannes und keinen Amtsträger. »Betagt« wahrt den würdevollen Erzählton.
- source_word: ἀναγκάζειν
  choice: zwingen
  rationale: Die Zweckangabe bezeichnet unmittelbaren Zwang; »zwingen« bringt dies in modernem Deutsch klar zum Ausdruck.
- source_word: μεταβαίνειν ἀπὸ τῶν πατρίων νόμων
  choice: sich von den Gesetzen ihrer Väter abzuwenden
  rationale: μεταβαίνειν ἀπό bezeichnet den Übergang beziehungsweise die Abkehr von etwas. Die Formulierung bewahrt zugleich die väterliche Ausdrucksweise von πατρίων.
- source_word: τοῖς τοῦ θεοῦ νόμοις μὴ πολιτεύεσθαι
  choice: nicht nach den Gesetzen Gottes zu leben
  rationale: πολιτεύεσθαι kann die Lebensführung einschließlich ihrer gemeinschaftlichen oder bürgerlichen Dimension bezeichnen. »Nach ... leben« vermittelt im Kontext den umfassenden praktischen Sinn, ohne ihn auf Politik zu verengen.
theological_decisions:
- issue: Wiedergabe der väterlich-ancestralen Sprache in πατρίων
  choice: Gesetze ihrer Väter
  alternative: überlieferten Gesetze / Gesetze ihrer Vorfahren
  rationale: Der griechische Ausdruck trägt ausdrücklich die Vorstellung des von den Vätern Überkommenen. Die gewählte Form bewahrt diese Textur, ohne eine zusätzliche konfessionelle Deutung einzuführen.
- issue: Bedeutungsumfang von πολιτεύεσθαι unter den Gesetzen Gottes
  choice: nach den Gesetzen Gottes zu leben
  alternative: ihr Gemeinwesen nicht nach den Gesetzen Gottes zu ordnen
  rationale: Das Verb kann bürgerlich-gemeinschaftliche Obertöne haben, bezeichnet hier jedoch allgemein eine an den Gesetzen ausgerichtete Lebensführung. Die weitere Bedeutung bleibt gewahrt, ohne den Vers einseitig politisch zu lesen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Teilung in zwei Sätze löst die griechische Infinitivkonstruktion natürlich auf; »Er sollte« bewahrt dabei eindeutig den Zweck des königlichen Sendens. Der Vers endet in der Vorlage syntaktisch mit einem weiterführenden Semikolon; der deutsche Punkt ist als lesbare Versabgrenzung gesetzt.
