translation:
  language: de
  text: So hinterließ er den jungen Menschen ein edles Vorbild dafür, bereitwillig und mutig für die ehrwürdigen und heiligen Gesetze zu sterben. Nachdem er dies gesagt hatte, ging er unverzüglich zur Folterbank[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Griechisch τύμπανον, wörtlich „Trommel“; hier bezeichnet es ein Foltergerät. Seine genaue Bauart ist nicht sicher.
    reason: Die Fußnote erklärt die kontextbezogene Wiedergabe und bewahrt die Unsicherheit hinsichtlich der konkreten Form des antiken Folterinstruments.
lexical_decisions:
- source_word: τοῖς δὲ νέοις
  choice: den jungen Menschen
  rationale: Der substantivierte Dativ bezeichnet allgemein die Jüngeren, nicht notwendig ausschließlich junge Männer; die Formulierung ist im modernen Deutschen klar und inklusiv.
- source_word: ὑπόδειγμα γενναῖον
  choice: ein edles Vorbild
  rationale: ὑπόδειγμα bezeichnet ein Beispiel oder Muster; γενναῖον verbindet sittliche Größe mit Mut. „Edles Vorbild“ bewahrt beide Aspekte.
- source_word: καταλελοιπὼς
  choice: hinterließ
  rationale: 'Das Perfektpartizip betont das bleibende Ergebnis: Sein Handeln bleibt den Jungen als Vorbild zurück.'
- source_word: εἰς τὸ ... ἀπευθανατίζειν
  choice: dafür, … in den Tod zu gehen
  rationale: Die Konstruktion bezeichnet Inhalt beziehungsweise Ziel des Vorbilds. Das seltene intensive Verb meint, den Tod ganz auf sich zu nehmen beziehungsweise tatsächlich zu sterben; „in den Tod zu gehen“ klingt natürlich und bewahrt den bewussten Vollzug.
- source_word: προθύμως
  choice: bereitwillig
  rationale: Das Adverb bezeichnet innere Bereitschaft, ohne eine unpassende Begeisterung am Sterben zu unterstellen.
- source_word: γενναίως
  choice: mutig
  rationale: Hier beschreibt das Adverb die tapfere Weise, in der der Tod auf sich genommen wird.
- source_word: ὑπὲρ τῶν σεμνῶν καὶ ἁγίων νόμων
  choice: für die ehrwürdigen und heiligen Gesetze
  rationale: ὑπέρ bedeutet hier „für“ beziehungsweise „zugunsten von“; σεμνός hebt die Verehrungswürdigkeit und Würde der Gesetze hervor, ἅγιος ihre Heiligkeit.
- source_word: τοσαῦτα δὲ εἰπών
  choice: Nachdem er dies gesagt hatte
  rationale: Natürliche deutsche Wiedergabe des temporalen Partizips; τοσαῦτα verweist zusammenfassend auf die vorausgehenden Worte.
- source_word: ἐπὶ τὸ τύμπανον
  choice: an das Folterrad
  rationale: τύμπανον bedeutet wörtlich „Trommel“, bezeichnet hier aber ein trommel- oder radförmiges Foltergerät. „Folterrad“ vermittelt Bild und Funktion besser als das im Deutschen missverständliche „Trommel“.
- source_word: εὐθέως ἦλθεν
  choice: trat er unverzüglich
  rationale: εὐθέως drückt unmittelbares Handeln aus; ἦλθεν mit ἐπί bezeichnet die Bewegung hin zum Foltergerät. „trat … an“ ist idiomatisch und bewahrt seine aktive Entschlossenheit.
theological_decisions:
- issue: Wertung von Eleasars Tod und der Gesetze
  choice: Die Gesetze bleiben „ehrwürdig und heilig“, und sein bereitwilliger, mutiger Tod wird ausdrücklich als edles Vorbild dargestellt.
  alternative: Die Wertung durch neutralere Ausdrücke wie „geachtete Gesetze“ oder „entschlossen sterben“ abschwächen.
  rationale: Diese positive moralische und theologische Wertung steht im griechischen Text selbst. Die Übersetzung darf die Spannung des als vorbildlich dargestellten Martyriums nicht neutralisieren.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Den jungen Menschen“ vermeidet eine unnötige Beschränkung auf Männer. „In den Tod zu gehen“ gibt das intensive, bewusste Sterben wieder, ohne die Aussage auszuschmücken. Der Fußnotenmarker [a] steht unmittelbar bei dem erklärungsbedürftigen Ausdruck.
