base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/006/018.yaml
  text: A certain Eleazar[a], one of the leading scribes, a man already advanced in age and most handsome in appearance, was being forced, with his mouth pried open, to eat pork.
translation:
  language: de
  text: Ein gewisser Eleasar, einer der führenden Schriftgelehrten, war bereits hochbetagt und von überaus schöner Erscheinung. Man zwang ihn, indem man ihm den Mund aufzwängte, Schweinefleisch[a] zu essen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: Fleisch vom Schwein.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐλεάζαρός τις
  choice: Ein gewisser Eleasar
  rationale: Das unbestimmte τις führt Eleasar erzählerisch ein; „ein gewisser“ bewahrt diese Nuance. Der Eigenname folgt der gebräuchlichen deutschen Form.
- source_word: τῶν πρωτευόντων γραμματέων
  choice: einer der führenden Schriftgelehrten
  rationale: πρωτεύοντες bezeichnet eine herausgehobene Stellung. „Schriftgelehrte“ gibt γραμματεῖς im jüdischen Kontext verständlich wieder, ohne es enger als „Gesetzeslehrer“ auszulegen.
- source_word: ἤδη προβεβηκὼς τὴν ἡλικίαν
  choice: war bereits hochbetagt
  rationale: Die Wendung bezeichnet ein weit fortgeschrittenes Lebensalter; „hochbetagt“ ist knapp, würdig und gegenwärtiges Standarddeutsch.
- source_word: τὴν πρόσοψιν τοῦ προσώπου κάλλιστος
  choice: von überaus schöner Erscheinung
  rationale: Die Formulierung bewahrt den ausdrücklichen Bezug auf Eleasars sichtbares Äußeres und die verstärkende Kraft des Superlativs, ohne die moralische Deutung „edel“ einzutragen.
- source_word: ἀναχαινόμενον
  choice: indem man ihm den Mund aufzwängte
  rationale: Das Partizip schildert ein gewaltsames Öffnen des Mundes. „Aufzwängen“ macht den körperlichen Zwang anschaulich und vermeidet die Abschwächung „weit öffnen“.
- source_word: ἠναγκάζετο φαγεῖν
  choice: Man zwang ihn … zu essen
  rationale: Die aktive deutsche Konstruktion gibt den fortdauernden passiven Zwang natürlich wieder; der ungenannte Handelnde bleibt unbestimmt.
- source_word: ὕειον κρέας
  choice: Schweinefleisch
  rationale: Die griechische Wendung bezeichnet Fleisch vom Schwein. „Schweinefleisch“ ist die klare, natürliche deutsche Entsprechung und wahrt den konkreten Bezug des Textes.
theological_decisions:
- issue: Bezeichnung der nach jüdischem Speisegesetz unreinen Nahrung im Martyriumskontext
  choice: Schweinefleisch
  alternative: Fleisch vom Schwein
  rationale: Der griechische Text benennt das Fleisch konkret, erklärt an dieser Stelle aber weder das Speisegesetz noch dessen theologische Bedeutung. Die Übersetzung lässt diese Bedeutung aus dem Kontext hervorgehen, statt sie in den Vers hineinzutragen.
- issue: Deutung von κάλλιστος als äußere oder charakterliche Qualität
  choice: von überaus schöner Erscheinung
  alternative: von überaus edler Erscheinung
  rationale: κάλλιστος beschreibt zusammen mit πρόσοψις und πρόσωπον ausdrücklich das sichtbare Äußere. „Edel“ könnte eine sittliche Qualität oder würdige Gesinnung eintragen, die hier nicht ausdrücklich genannt wird.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Zweiteilung des langen griechischen Satzes verbessert die Verständlichkeit, ohne Informationen oder die Reihenfolge der Schilderung wesentlich zu verändern. Der körperliche Zwang bleibt durch „den Mund aufzwängte“ deutlich.
