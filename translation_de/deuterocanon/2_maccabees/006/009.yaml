  text: But those who did not choose to adopt the Greek ways were to be slaughtered[a]. Thus one could see the present misery.
translation:
  language: de
  text: Wer sich aber nicht dafür entschied, zu den griechischen Lebensweisen überzugehen[a], sollte niedergemetzelt werden. So konnte man die gegenwärtige Not sehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „zu den griechischen Dingen überzugehen“; gemeint sind allgemein griechisch-hellenistische Sitten und Praktiken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ προαιρουμένους
  choice: Wer sich aber nicht dafür entschied
  rationale: προαιρέομαι bezeichnet eine bewusste Wahl oder Entscheidung. Die Formulierung bewahrt diesen Willensaspekt, ohne die Beweggründe näher festzulegen.
- source_word: μεταβαίνειν ἐπὶ τὰ Ἑλληνικά
  choice: zu den griechischen Lebensweisen überzugehen
  rationale: μεταβαίνειν bedeutet wörtlich „übergehen“ oder „hinüberwechseln“; τὰ Ἑλληνικά bezeichnet hier umfassend griechisch-hellenistische Sitten, Praktiken und Lebensformen, nicht nur Sprache oder Volkszugehörigkeit.
- source_word: κατασφάζειν
  choice: sollte niedergemetzelt werden
  rationale: Das verstärkte Verb bezeichnet gewaltsames Abschlachten und ist deutlich schärfer als ein allgemeines „töten“. Die deutsche Passivkonstruktion gibt im Zusammenhang die angeordnete Folge wieder.
- source_word: παρῆν οὖν ὁρᾶν
  choice: So konnte man ... sehen
  rationale: Die unpersönliche griechische Wendung bezeichnet etwas, das offen zu beobachten war; diese Wiedergabe klingt im modernen Deutschen natürlich.
- source_word: τὴν ἐνεστῶσαν ταλαιπωρίαν
  choice: das Elend, das nun herrschte
  rationale: ἐνεστῶσαν bezeichnet das gegenwärtig bestehende oder unmittelbar vorhandene Elend. „Das nun herrschte“ gibt den aktuellen Zustand wieder, ohne fälschlich nur sein Eintreten zu betonen.
theological_decisions:
- issue: Bedeutungsumfang von ἐπὶ τὰ Ἑλληνικά
  choice: Übergang zu griechisch-hellenistischen Lebensweisen
  alternative: ethnisch Grieche werden oder lediglich die griechische Sprache übernehmen
  rationale: Der Zusammenhang betrifft die erzwungene Anpassung an hellenistische Sitten und religiös-kulturelle Praktiken. Die Übersetzung wahrt diese Breite, ohne ausdrücklich eine ethnische Verwandlung oder eine ausschließlich sprachliche Anpassung zu behaupten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Lebensweisen“ hält den kulturell-religiösen Bedeutungsumfang offen; „niedergemetzelt“ bewahrt die Härte des griechischen Verbs.
