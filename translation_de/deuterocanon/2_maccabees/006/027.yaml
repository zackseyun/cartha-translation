lexical_decisions:
- source_word: διόπερ
  choice: Darum
  rationale: Gibt die folgernde Bedeutung „deshalb/aus diesem Grund“ knapp und natürlich wieder.
- source_word: ἀνδρείως
  choice: mutig
  rationale: Entspricht dem adverbialen Sinn „tapfer, mutig“ in modernem Standarddeutsch.
- source_word: νῦν ἀλλάξας τὸν βίον
  choice: indem ich jetzt mutig aus dem Leben scheide
  rationale: Die wörtliche Wendung „das Leben wechseln“ bezeichnet hier euphemistisch das Sterben. „Aus dem Leben scheiden“ bewahrt diesen zurückhaltenden Ton, ohne eine unnatürliche Lehnübersetzung zu erzeugen.
- source_word: τοῦ μὲν γήρως ἄξιος φανήσομαι
  choice: werde ich mich meines hohen Alters würdig erweisen
  rationale: „Sich als würdig erweisen“ bildet ἄξιος φανήσομαι genau ab; „hohes Alter“ gibt γῆρας im Deutschen idiomatisch wieder.
