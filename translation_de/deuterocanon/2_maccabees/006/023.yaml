base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/006/023.yaml
  text: But he[a], adopting a noble resolve worthy of his age and of the dignity of old age, and of the distinction of his acquired and honored way of life, and of the finest conduct from childhood—rather, in keeping with the holy and God-given law—declared himself plainly, saying that they should send him quickly to Hades.
translation:
  language: de
  text: Er aber fasste einen edlen Entschluss, der seinem Alter, der Würde des Greisenalters, seinem erworbenen und angesehenen Lebenswandel sowie seiner vortrefflichen Lebensführung seit seiner Kindheit angemessen war; doch mehr noch im Einklang mit dem heiligen und gottgegebenen Gesetz erklärte er unumwunden, man solle ihn unverzüglich in den Hades[a] schicken.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in das Totenreich“. Griechisch: „in den Hades“.'
    reason: Der griechische Begriff ᾅδης bezeichnet das Reich der Toten und ist nicht ohne Weiteres mit „Hölle“ gleichzusetzen.
lexical_decisions:
- source_word: λογισμὸν ἀστεῖον
  choice: einen edlen Entschluss
  rationale: λογισμός bezeichnet hier eine wohlüberlegte Entscheidung; ἀστεῖος würdigt sie im ethischen Zusammenhang als edel oder vornehm.
- source_word: ἀναλαβών
  choice: fasste
  rationale: Die idiomatische deutsche Verbindung „einen Entschluss fassen“ gibt das Aufnehmen und bewusste Ergreifen des Entschlusses natürlich wieder.
- source_word: ἄξιον τῆς ἡλικίας
  choice: der seinem Alter … entsprach
  rationale: ἄξιος bezeichnet, was jemandes Alter angemessen oder würdig ist. Die Formulierung bindet auch die folgenden Genitive flüssig an.
- source_word: τῆς τοῦ γήρους ὑπεροχῆς
  choice: der Würde des Greisenalters
  rationale: ὑπεροχή bezeichnet Vorrang, Erhabenheit oder herausragende Stellung; „Würde“ vermittelt hier den ehrwürdigen Rang hohen Alters.
- source_word: τῆς ἐπικτήτου καὶ ἐπιφανοῦς πολιτείας
  choice: seinem erworbenen und angesehenen Lebenswandel
  rationale: πολιτεία kann Lebensführung oder Lebenswandel bezeichnen. ἐπίκτητος und ἐπιφανής werden als „erworben“ und „angesehen“ bewahrt, auch wenn die Verbindung im Deutschen bewusst gehoben klingt.
- source_word: τῆς ἐκ παιδὸς καλλίστης ἀναστροφῆς
  choice: seinem vorbildlichen Verhalten von Kindheit an
  rationale: ἀναστροφή bezeichnet das gelebte Verhalten; κάλλιστος wird kontextgerecht als „vorbildlich“ wiedergegeben.
- source_word: μᾶλλον δὲ
  choice: mehr noch
  rationale: Die Wendung steigert beziehungsweise korrigiert die zuvor genannten Beweggründe und hebt das Gesetz als entscheidenden Maßstab hervor.
- source_word: τῆς ἁγίας καὶ θεοκτίστου νομοθεσίας
  choice: dem heiligen, von Gott gestifteten Gesetz
  rationale: νομοθεσία meint Gesetzgebung beziehungsweise Gesetzesordnung; θεόκτιστος bezeichnet ihren göttlichen Ursprung. „Von Gott gestiftet“ bleibt näher am Bild des griechischen Wortes als bloß „gegeben“.
- source_word: ἀκολούθως
  choice: Im Einklang mit
  rationale: Das Adverb bezeichnet ein Handeln in Übereinstimmung mit der heiligen Gesetzesordnung.
- source_word: ἀπεφήνατο
  choice: erklärte er unumwunden
  rationale: Das Medium bezeichnet hier die klare Bekanntgabe der eigenen Entscheidung; „unumwunden“ bringt die Offenheit und Entschiedenheit zum Ausdruck, ohne einen im Deutschen unnatürlichen Reflexivgebrauch zu erzwingen.
- source_word: ταχέως … προπέμπειν εἰς τὸν ᾅδην
  choice: man solle ihn unverzüglich in den Hades schicken
  rationale: προπέμπειν bedeutet fort- oder hinschicken; ταχέως fordert die sofortige Ausführung. „Hades“ bewahrt die Bezeichnung des Totenreichs und vermeidet eine Gleichsetzung mit der Hölle.
theological_decisions:
- issue: Wiedergabe von ᾅδης
  choice: Hades
  alternative: Totenreich
  rationale: Der griechische Ausdruck bezeichnet den Bereich der Toten, nicht ausdrücklich den Ort endgültiger Strafe. Die Transliteration bewahrt diese Offenheit; die Fußnote erklärt den Begriff.
- issue: Wiedergabe von θεοκτίστου νομοθεσίας
  choice: das heilige, von Gott gestiftete Gesetz
  alternative: die heilige, von Gott gegebene Gesetzgebung
  rationale: Die gewählte Formulierung wahrt sowohl die Heiligkeit als auch den göttlichen Ursprung der Gesetzesordnung, ohne zusätzliche konfessionelle Aussagen einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht gehobenem erzählerischem Ton. Die lange griechische Satzperiode wird durch einen Gedankenstrich und einen neuen Hauptsatz gegliedert, während die rhetorische Steigerung und die Aufzählung erhalten bleiben.
