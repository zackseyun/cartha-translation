  text: But others[a], having gathered nearby in the caves to observe the week in secret, were informed against to Philip and were burned together, because they scrupled to defend themselves out of regard for the honor of that most holy day.
translation:
  language: de
  text: Andere aber hatten sich in nahe gelegenen Höhlen versammelt, um heimlich die Woche[a] zu begehen. Sie wurden bei Philipp angezeigt und gemeinsam verbrannt, weil sie aus Ehrfurcht vor der Würde dieses hochheiligen Tages Bedenken hatten, sich selbst zu verteidigen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „um heimlich den Sabbat zu begehen“. Wörtlich steht im Griechischen „die Woche“; im Zusammenhang ist wahrscheinlich die Sabbatfeier gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕτεροι
  choice: Andere
  rationale: Gibt den unbestimmten Gegensatz zur zuvor genannten Gruppe natürlich wieder.
- source_word: πλησίον συνδρομόντες εἰς τὰ σπήλαια
  choice: kamen in den Höhlen in der Nähe zusammen
  rationale: συντρέχω bezeichnet das Zusammenkommen, während πλησίον die Höhlen als nahe gelegen kennzeichnet; das griechische εἰς hat zwar eine Richtungsnuance, doch im Deutschen ergibt sich hier idiomatisch der Ort ihres Zusammenkommens.
- source_word: λεληθότως ἄγειν τὴν ἑβδομάδα
  choice: um heimlich die Woche zu begehen
  rationale: Bewahrt den ungewöhnlichen Wortlaut τὴν ἑβδομάδα („die Woche“), während „begehen“ die religiöse Observanz ausdrückt und λεληθότως mit „heimlich“ wiedergegeben wird.
- source_word: μηνυθέντες τῷ Φιλίππῳ
  choice: Sie wurden bei Philipp angezeigt
  rationale: μηνύω bezeichnet hier ein feindseliges Melden beziehungsweise Denunzieren; „bei Philipp angezeigt“ ist knapp und natürlich.
- source_word: συνεφλογίσθησαν
  choice: gemeinsam verbrannt
  rationale: Das Kompositum bezeichnet, dass die Betroffenen zusammen dem Feuer preisgegeben wurden; „lebendig“ wird nicht ergänzt, da es nicht ausdrücklich im Verb steht.
- source_word: διὰ τὸ εὐλαβῶς ἔχειν βοηθῆσαι αὐτοῖς
  choice: weil sie … Bedenken hatten, sich selbst zu verteidigen
  rationale: εὐλαβῶς ἔχειν trägt die Nuance ehrfürchtiger beziehungsweise gewissenhafter Zurückhaltung; βοηθῆσαι αὐτοῖς ist im Kontext als Selbsthilfe oder Selbstverteidigung zu verstehen.
- source_word: κατὰ δόξαν τῆς σεμνοτάτης ἡμέρας
  choice: aus Ehrfurcht vor der Würde dieses hochheiligen Tages
  rationale: δόξα bezeichnet hier die Ehre oder Würde des Tages; σεμνοτάτης hebt dessen außergewöhnliche Heiligkeit und Erhabenheit hervor.
theological_decisions:
- issue: Bedeutung von τὴν ἑβδομάδα im Verfolgungskontext
  choice: die Woche
  alternative: den Sabbat
  rationale: Der griechische Text hat wörtlich „die Woche“ und nicht das eindeutige σάββατον. Die wahrscheinlich gemeinte Sabbatfeier wird deshalb in einer Fußnote genannt, ohne die echte sprachliche Spannung im Haupttext aufzulösen.
- issue: Grund für die unterlassene Gegenwehr
  choice: ehrfürchtige Bedenken, sich selbst zu verteidigen
  alternative: Weigerung, einander zu helfen
  rationale: Der Zusammenhang und der reflexive Sinn von αὐτοῖς sprechen für Selbsthilfe beziehungsweise Selbstverteidigung. Die Übersetzung verbindet dies mit der ausdrücklich genannten Ehrfurcht vor dem heiligen Tag, ohne eine weitergehende Lehre über Sabbatgebote einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz wurde für gute Verständlichkeit in zwei Hauptsätze gegliedert. „Hochheilig“ bewahrt den starken Superlativ von σεμνοτάτης, während die ungewöhnliche Bezeichnung „Woche“ im Haupttext erhalten bleibt.
