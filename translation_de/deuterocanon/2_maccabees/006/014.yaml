base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/006/014.yaml
  text: 'For he did not decide to deal with us as he does with the other nations: he waits patiently with them until they have reached the full measure of their sins[a], and then punishes them.'
translation:
  language: de
  text: Denn der Gebieter[a] wartet bei den anderen Völkern geduldig, bis sie das volle Maß ihrer Sünden erreicht haben, und bestraft sie dann; doch hat er nicht beschlossen, es auch bei uns so zu halten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Herrscher“. Das griechische Wort bezeichnet hier Gott als den, der Herrschaft und Verfügungsgewalt besitzt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναμένει
  choice: wartet
  rationale: Das Verb bezeichnet ein Abwarten bis zu einem bestimmten Zeitpunkt. Hier geht es darum, dass Gott das Strafgericht über die anderen Völker aufschiebt.
- source_word: μακροθυμῶν
  choice: geduldig
  rationale: Das Partizip beschreibt die Langmut beziehungsweise Nachsicht, mit der das Warten geschieht; die adverbiale Wiedergabe ist im Deutschen natürlich und genau.
- source_word: ὁ δεσπότης
  choice: der Gebieter
  rationale: δεσπότης bezeichnet den Herrn oder souveränen Machthaber. „Gebieter“ bewahrt diesen Herrschaftsaspekt und vermeidet eine Gleichsetzung mit κύριος.
- source_word: καταντήσαντας αὐτοὺς πρὸς ἐκπλήρωσιν ἁμαρτιῶν
  choice: bis sie das volle Maß ihrer Sünden erreicht haben
  rationale: Die Wendung beschreibt das Gelangen zur Vollendung beziehungsweise zum vollen Ausmaß der Sünden. „Das volle Maß ihrer Sünden“ ist verständliches, idiomatisches Deutsch.
- source_word: κολάσῃ
  choice: bestraft sie
  rationale: Das Verb bezeichnet hier unmittelbar die Verhängung von Strafe.
- source_word: οὕτως καὶ ἐφʼ ἡμῶν ἔκρινεν εἶναι
  choice: doch hat er nicht beschlossen, es auch bei uns so zu halten
  rationale: Das vorangestellte οὐ verneint die Anwendung desselben Vorgehens auf „uns“. Die Formulierung macht den im Griechischen knapp ausgedrückten Vergleich deutlich, ohne ihn inhaltlich zu erweitern.
theological_decisions:
- issue: Gottes Langmut gegenüber den Völkern im Unterschied zu seinem Umgang mit Israel
  choice: Gott wartet bei den anderen Völkern bis zum vollen Maß ihrer Sünden, hat aber nicht beschlossen, bei Israel ebenso zu verfahren.
  alternative: Die komprimierte griechische Vergleichskonstruktion könnte wörtlicher und dadurch weniger eindeutig wiedergegeben werden.
  rationale: Die Konstruktion οὐ … καθάπερ … οὕτως καὶ ἐφ’ ἡμῶν stellt einen verneinten Vergleich her. Die Übersetzung wahrt die Spannung zwischen dem aufgeschobenen Gericht über die Völker und Gottes anderem Umgang mit Israel, ohne den Grund dafür über den Vers hinaus zu erklären.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der griechischen Satzfolge wird weitgehend gefolgt; das Semikolon verdeutlicht den verneinten Vergleich und verhindert, dass sich die Verneinung irrtümlich nur auf das geduldige Warten bezieht.
