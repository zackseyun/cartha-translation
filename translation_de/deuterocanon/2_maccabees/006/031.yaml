  source_fidelity: Der Entwurf gibt die gehobene Todesumschreibung (μετήλλαξεν), die modale Wendung, den Vermächtnischarakter von καταλιπών sowie die ethischen Begriffe ὑπόδειγμα γενναιότητος und μνημόσυνον ἀρετῆς zuverlässig wieder. „Tapferkeit“ ist hier eine angemessene, nicht einengende Wiedergabe von γενναιότης; „Tugend“ bewahrt den ethischen Sinn von ἀρετή.
  naturalness: Die Formulierung „hinterließ seinen eigenen Tod nicht nur den jungen Menschen, sondern auch den meisten aus seinem Volk“ ist im Deutschen syntaktisch schwerfällig. Die Empfängergruppen und die prädikative Bestimmung des Todes lassen sich mit „für“ klarer und natürlicher verbinden. „der größte Teil seines Volkes“ gibt τοῖς πλείστοις τοῦ ἔθνους idiomatisch wieder, ohne einen modernen staatsrechtlichen Nationsbegriff zu implizieren.
  terminology: „Aus dem Leben scheiden“, „Beispiel“, „Tapferkeit“, „Denkmal“ und „Tugend“ entsprechen dem würdevollen Register. „Denkmal der Tugend“ ist als bildhafte, feierliche Wiedergabe von μνημόσυνον ἀρετῆς vertretbar und wahrt die knappe griechische Verbindung ohne erläuternde Zusätze.
