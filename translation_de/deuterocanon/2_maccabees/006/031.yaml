base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/006/031.yaml
  text: So then[a], in this way he passed away, leaving behind his own death as an example of courage and a memorial of virtue[c][b], not only for the young but also for most of the nation.
translation:
  language: de
  text: So schied er auf diese Weise aus dem Leben und hinterließ seinen eigenen Tod für die jungen Menschen und für den größten Teil seines Volkes als Beispiel der Tapferkeit und als Denkmal der Tugend.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετήλλαξεν
  choice: schied … aus dem Leben
  rationale: Die gehobene, euphemistische Umschreibung bewahrt den feierlichen Ton des griechischen Verbs und bezeichnet dennoch eindeutig Eleasars Tod.
- source_word: τοῦτον τὸν τρόπον
  choice: auf diese Weise
  rationale: Gibt die modale Wendung klar und unmittelbar wieder.
- source_word: ὑπόδειγμα
  choice: Beispiel
  rationale: Bezeichnet ein vor Augen gestelltes Muster zur Nachahmung; „Beispiel“ ist im Deutschen natürlich und allgemein verständlich.
- source_word: γενναιότητος
  choice: Tapferkeit
  rationale: Im Kontext des standhaften Martyriums bezeichnet das Wort vor allem mutige, edle Haltung. „Tapferkeit“ wahrt diese ethische Bedeutung, ohne sie auf militärischen Mut zu verengen.
- source_word: μνημόσυνον
  choice: Denkmal
  rationale: Bezeichnet etwas, das die Erinnerung dauerhaft bewahrt, und erhält den feierlich-kommemorativen Ton.
- source_word: ἀρετῆς
  choice: Tugend
  rationale: Gibt die moralische Vortrefflichkeit in der gehobenen ethischen Sprache des Verses knapp wieder.
- source_word: τοῖς νέοις
  choice: den jungen Menschen
  rationale: Gibt die substantivierte Bezeichnung inklusiv und in modernem Standarddeutsch wieder.
- source_word: τοῖς πλείστοις τοῦ ἔθνους
  choice: den meisten aus seinem Volk
  rationale: ἔθνος meint hier das jüdische Volk; „seinem Volk“ macht den Bezug natürlich verständlich, ohne eine moderne staatsrechtliche Vorstellung von „Nation“ einzutragen.
- source_word: καταλιπών
  choice: hinterließ
  rationale: Erfasst sowohl das Zurücklassen als auch den Gedanken eines bleibenden Vermächtnisses.
theological_decisions:
- issue: Ethische Begriffe im Bericht vom Martyrium
  choice: γενναιότης als „Tapferkeit“ und ἀρετή als „Tugend“ wiedergeben
  alternative: „edle Gesinnung“ und „moralische Vortrefflichkeit“
  rationale: Die gewählte Wortpaarung bewahrt die moralische Würdigung von Eleasars Tod, ohne spätere konfessionelle oder dogmatische Kategorien einzutragen.
- issue: Gehobene Umschreibung des Todes
  choice: „schied … aus dem Leben“
  alternative: „starb“
  rationale: Die Übersetzung erhält die feierliche Umschreibung des griechischen μετήλλαξεν, bleibt aber für heutige Leser eindeutig.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit feierlichem Erzählton. Die griechische Satzstruktur wurde leicht geordnet, damit klar bleibt, dass Eleasars Tod den genannten Gruppen als Beispiel und Denkmal hinterlassen wurde.
