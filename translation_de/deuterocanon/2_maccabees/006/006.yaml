base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/006/006.yaml
  text: And it was permitted neither to keep the Sabbath[a], nor to observe the ancestral festivals, nor even simply to acknowledge being a Jew.
translation:
  language: de
  text: Man durfte weder den Sabbat halten noch die überlieferten Feste[a] begehen noch sich auch nur als Jude bekennen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: die väterlichen Feste; gemeint sind die von den Vorfahren überlieferten religiösen Feste.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν ... οὔτε ... οὔτε ... οὔτε
  choice: Man durfte weder ... noch ... noch
  rationale: Die unpersönliche Konstruktion mit den Infinitiven beschreibt, was unter den herrschenden Umständen nicht erlaubt war. Die deutsche Formulierung gibt die dreigliedrige Verneinung natürlich und präzise wieder.
- source_word: σαββατίζειν
  choice: den Sabbat halten
  rationale: Das Verb bezeichnet das Einhalten beziehungsweise Begehen des Sabbats; „den Sabbat halten“ ist im Deutschen klar und gebräuchlich.
- source_word: πατρίους ἑορτάς
  choice: die überlieferten Feste
  rationale: πατρίους bezeichnet das von den Vorfahren Ererbte. „Überliefert“ klingt im modernen Deutschen natürlicher als „angestammt“ und wahrt den Gedanken religiöser Tradition.
- source_word: διαφυλάττειν
  choice: begehen
  rationale: Im Zusammenhang mit religiösen Festen bedeutet das Verb, diese treu einzuhalten. „Feste begehen“ ist eine natürliche deutsche Verbindung.
- source_word: ἁπλῶς
  choice: auch nur
  rationale: In der abschließenden negativen Aussage hebt das Adverb hervor, dass selbst die bloße öffentliche Identifikation untersagt war.
- source_word: Ἰουδαῖον
  choice: Jude
  rationale: Der Zusammenhang betrifft die Unterdrückung jüdischer religiöser Praxis und Identität, nicht lediglich eine geografische Herkunft aus Judäa.
- source_word: ὁμολογεῖν εἶναι
  choice: sich als ... bekennen
  rationale: Die Wendung bezeichnet das offene Eingestehen beziehungsweise Erklären der eigenen Identität. „Sich als Jude bekennen“ ist natürlich und bewahrt den öffentlichen Charakter, ohne unnötig eine spätere dogmatische Bedeutung einzutragen.
theological_decisions:
- issue: Bedeutung von Ἰουδαῖον im Verfolgungskontext
  choice: Jude
  alternative: Judäer
  rationale: Die verbotene Sabbat- und Festpraxis zeigt, dass die ethnisch-religiöse Identität im Vordergrund steht. „Jude“ gibt dies im Deutschen am treffendsten wieder; „Judäer“ könnte zu stark geografisch verstanden werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe dreigliedrige Verbotsreihe des Griechischen bleibt erhalten; „Man durfte“ vermeidet eine schwerfällige unpersönliche Passivkonstruktion.
