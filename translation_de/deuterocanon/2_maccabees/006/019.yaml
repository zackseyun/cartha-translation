  text: But he[a], choosing death with honor rather than life with defilement, went to the rack of his own accord,
translation:
  language: de
  text: Er aber zog es vor, einen ehrenvollen Tod auf sich zu nehmen statt eines Lebens in Befleckung, und ging aus eigenem Entschluss zum Foltergerät[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Griechisch „zum Týmpanon“, einem Foltergerät; traditionell wird das Wort wörtlicher mit „Trommel“ wiedergegeben, doch die genaue Art der Vorrichtung ist ungewiss.
    reason: lexical_alternative
lexical_decisions:
- source_word: μετʼ εὐκλείας θάνατον
  choice: einen ehrenvollen Tod
  rationale: εὐκλεία bezeichnet guten Ruf, Ehre oder Ruhm. „Ehrenvoll“ gibt den Gegensatz zur Befleckung knapp und in natürlichem Deutsch wieder.
- source_word: μᾶλλον ἢ
  choice: lieber … als
  rationale: Die deutsche Vergleichskonstruktion drückt hier die bewusste Bevorzugung angemessen aus.
- source_word: μετὰ μύσους βίον
  choice: ein Leben in Befleckung
  rationale: μύσος kann moralische oder kultische Befleckung bezeichnen. „Befleckung“ bewahrt diese Bedeutungsbreite besser als das rein soziale „Schande“.
- source_word: ἀναδεξάμενος
  choice: nahm … auf sich
  rationale: Das Partizip bezeichnet das bewusste Annehmen beziehungsweise Übernehmen; die deutsche Wendung passt sowohl zum Tod als auch zur entschlossenen Haltung Eleasars.
- source_word: αὐθαιρέτως
  choice: aus eigenem Entschluss
  rationale: Die Formulierung betont, dass Eleasar freiwillig und selbstbestimmt handelte.
- source_word: ἐπὶ τὸ τύμπανον
  choice: zur Folterbank
  rationale: τύμπανον bezeichnet hier ein Foltergerät. „Folterbank“ vermittelt dessen Funktion verständlich, ohne die unsichere Bauart im Haupttext festzulegen.
- source_word: προσῆγεν
  choice: ging
  rationale: Im Zusammenhang mit αὐθαιρέτως ist eine selbst vollzogene Annäherung gemeint; „ging“ vermeidet die irreführende Vorstellung, er sei passiv hingeführt worden.
theological_decisions:
- issue: Bedeutung von μύσος im Martyriumskontext
  choice: Befleckung
  alternative: Schande; Verunreinigung
  rationale: Der Zusammenhang verbindet den Gesetzesbruch mit moralischer und möglicherweise kultischer Verunreinigung. „Befleckung“ erhält diese Spannung, ohne sie auf eine einzelne Kategorie zu verengen.
- issue: Wiedergabe von τύμπανον
  choice: Folterbank
  alternative: Trommel; Folterrad; Týmpanon
  rationale: Der Erzählzusammenhang verlangt ein Foltergerät. Die funktionale Übersetzung ist für heutige Leser verständlich; die Fußnote wahrt den wörtlicheren Ausdruck und die Unsicherheit über die genaue Vorrichtung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bewahrt den scharfen Gegensatz zwischen ehrenvollem Tod und einem Leben in Befleckung; „aus eigenem Entschluss“ hebt die Freiwilligkeit hervor.
