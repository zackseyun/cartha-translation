  yaml_path: translation/deuterocanon/2_maccabees/006/016.yaml
  text: Therefore he never withdraws his mercy from us; but while disciplining with calamity, he does not abandon his own people.
translation:
  language: de
  text: Darum entzieht er uns niemals sein Erbarmen; doch indem er uns durch Unglück erzieht, verlässt er sein eigenes Volk nicht.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διόπερ
  choice: Darum
  rationale: Kennzeichnet den Vers als Folgerung aus dem vorausgehenden Gedankengang und klingt in modernem Deutsch natürlich.
- source_word: οὐδέποτε
  choice: niemals
  rationale: Gibt die uneingeschränkte zeitliche Verneinung präzise und idiomatisch wieder.
- source_word: τὸν ἔλεον
  choice: sein Erbarmen
  rationale: ἔλεος bezeichnet Erbarmen oder Barmherzigkeit. Das Possessivpronomen macht den im Zusammenhang eindeutigen Bezug auf Gott im Deutschen natürlich deutlich.
- source_word: ἀφʼ ἡμῶν ἀφίστησιν
  choice: entzieht er uns
  rationale: Gibt das Veranlassen einer Entfernung von uns knapp und idiomatisch wieder; zusammen mit „sein Erbarmen“ bleibt das Bild des Zurücknehmens gewahrt.
- source_word: παιδεύων
  choice: indem er uns … erzieht
  rationale: παιδεύω umfasst Erziehung, Schulung und korrigierende Zurechtweisung. „Erzieht“ bewahrt den auf Besserung zielenden Sinn, ohne ausschließlich Strafgericht auszudrücken; das ergänzte „uns“ erschließt das im Kontext gemeinte Objekt.
- source_word: μετὰ συμφορᾶς
  choice: durch Unglück
  rationale: συμφορά bezeichnet schweres Unglück oder Unheil. „Durch“ bringt hier das Mittel der göttlichen Erziehung natürlich zum Ausdruck.
- source_word: οὐκ ἐγκαταλείπει
  choice: verlässt … nicht
  rationale: Das geläufige „verlässt nicht“ gibt ἐγκαταλείπω verständlich wieder und bewahrt den Gedanken, dass Gott sein Volk trotz des Unglücks nicht preisgibt.
- source_word: τὸν ἑαυτοῦ λαόν
  choice: sein eigenes Volk
  rationale: „Eigenes“ bewahrt die durch das reflexive ἑαυτοῦ betonte Zugehörigkeit.
theological_decisions:
- issue: Bedeutung von παιδεύων für Gottes Handeln
  choice: indem er uns durch Unglück erzieht
  alternative: während er uns durch Unglück züchtigt
  rationale: „Erzieht“ hält fest, dass das Unglück korrigierende und formende Funktion hat, ohne die Aussage auf Vergeltungsstrafe zu verengen. Zugleich wird die Härte des Mittels durch „Unglück“ nicht abgeschwächt.
- issue: Expliziter Besitzer bei τὸν ἔλεον
  choice: sein Erbarmen
  alternative: das Erbarmen
  rationale: Der griechische Artikel nennt den Besitzer nicht ausdrücklich, doch Subjekt und Zusammenhang beziehen das Erbarmen eindeutig auf Gott. Das Possessivpronomen sorgt im Deutschen für Klarheit, ohne eine zusätzliche Lehraussage einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Semikolonstruktur und der Gegensatz mit „doch“ spiegeln den griechischen Satzbau. „Erzieht“ ist bewusst verständlicher und weniger archaisch-punitiv als „züchtigt“, während „Unglück“ die Schwere von συμφορά wahrt.
