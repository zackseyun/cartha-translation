lexical_decisions:
- source_word: Οὐ γὰρ
  choice: Denn ... nicht
  rationale: „Denn“ bewahrt die begründende Verbindung zum vorausgehenden Gedankengang.
- source_word: τῆς ἡμετέρας ἡλικίας ἄξιόν ἐστιν
  choice: es ist unseres Alters nicht würdig
  rationale: Die Formulierung erhält den Bezug auf Eleasars hohes Lebensalter und das moralische Gewicht von ἄξιος; die erste Person Plural wird als würdevolle Selbstbezeichnung beibehalten.
- source_word: ὑποκριθῆναι
  choice: uns zu verstellen
  rationale: Gemeint ist, durch äußeres Verhalten etwas Unwahres vorzutäuschen. „Uns zu verstellen“ ist im modernen Deutsch klar und lässt den konkreten Gegenstand des Vortäuschens wie im Griechischen unausgesprochen.
- source_word: ἵνα
  choice: sodass
  rationale: Hier wird die befürchtete Folge des verstellten Handelns eingeführt, nicht ein von Eleasar beabsichtigtes Ziel.
- source_word: πολλοὶ τῶν νέων
  choice: viele von den jungen Leuten
  rationale: Die Wiedergabe bezeichnet die jüngere Generation natürlich und legt das grammatische Maskulinum nicht unnötig auf ausschließlich männliche Personen fest.
- source_word: ὑπολαβόντες
  choice: meinen könnten
  rationale: Die jungen Leute würden aus Eleasars Verhalten einen irrigen Schluss ziehen. Der Konjunktiv kennzeichnet die vorgestellte Möglichkeit.
- source_word: Ἐλεάζαρον τὸν ἐνενηκονταετῆ
  choice: Eleasar ... mit seinen neunzig Jahren
  rationale: Die natürliche deutsche Wendung hebt wie der griechische Zusatz sein hohes Alter hervor.
- source_word: μεταβεβληκέναι
  choice: habe sich ... zugewandt
  rationale: Der deutsche Konjunktiv gibt den nur angenommenen Sachverhalt wieder; „sich zugewandt“ vermittelt den vollzogenen Wechsel der Lebensführung oder Zugehörigkeit.
- source_word: εἰς ἀλλοφυλισμόν
  choice: einer fremden Lebensweise
  rationale: Die Wendung bezeichnet die Übernahme nichtjüdischer, fremder Lebensformen, ohne einen späteren konfessionellen oder polemischen Fachbegriff einzutragen.
theological_decisions:
- issue: Wiedergabe von ἀλλοφυλισμός im Zusammenhang jüdischer Bundestreue
  choice: einer fremden Lebensweise
  alternative: fremden Bräuchen; dem Heidentum
  rationale: Die gewählte Formulierung umfasst Lebensführung, Bräuche und erkennbare Zugehörigkeit, ohne die Bedeutung auf einzelne Sitten zu verengen oder mit „Heidentum“ zusätzliche spätere Konnotationen einzuführen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt bewusst offen, da der griechische Vers an dieser Stelle in den folgenden Vers hinein weiterläuft.
