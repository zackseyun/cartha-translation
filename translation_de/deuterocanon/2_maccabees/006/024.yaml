  yaml_path: translation/deuterocanon/2_maccabees/006/024.yaml
  text: For it is not worthy of our age to pretend[a], so that many of the young, supposing that Eleazar at ninety years of age has changed over to foreign ways,
translation:
  language: de
  text: Denn es entspricht unserem Alter nicht, uns zu verstellen, sodass viele junge Leute meinen könnten, Eleasar habe sich mit seinen neunzig Jahren einer fremden Lebensweise zugewandt,[a]
  philosophy: optimal-equivalence
  footnotes:
