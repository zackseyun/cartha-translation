  text: And the pressure of this evil was harsh and grievous for everyone[a].
translation:
  language: de
  text: Das Hereinbrechen dieses Unheils war für alle hart und schwer zu ertragen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Der Druck dieses Bösen war für alle hart und bedrückend.«'
    reason: Lexikalische Alternative für ἐπίστασις und κακία; sie bewahrt stärker die Nuance einer auf den Menschen lastenden, auferlegten Bedrängnis.
lexical_decisions:
- source_word: χαλεπὴ
  choice: hart
  rationale: Das Adjektiv bezeichnet hier die Härte oder Schwere der Belastung; „hart“ ist verständlich und bleibt von δυσχερής unterschieden.
- source_word: δυσχερὴς
  choice: schwer zu ertragen
  rationale: Die Wendung bringt den Gedanken des Beschwerlichen und kaum Erträglichen natürlich zum Ausdruck, ohne ihn mit χαλεπή gleichzusetzen.
- source_word: τοῖς ὅλοις
  choice: für alle
  rationale: Die idiomatische Formulierung bewahrt den umfassenden Bezug auf alle Betroffenen.
- source_word: ἡ ἐπίστασις
  choice: das Hereinbrechen
  rationale: Im Zusammenhang bezeichnet das Substantiv das Eintreten beziehungsweise bedrängende Aufkommen des geschilderten Unheils. „Hereinbrechen“ gibt diese dynamische Bedeutung wieder; die mögliche Nuance eines auferlegten Drucks wird in der Fußnote bewahrt.
- source_word: τῆς κακίας
  choice: dieses Unheils
  rationale: κακία verweist hier konkret auf die zuvor geschilderte böse Unterdrückung. „Unheil“ erfasst sowohl deren Bosheit als auch ihre verheerende Wirkung, ohne eine abstrakte Sentenz daraus zu machen.
theological_decisions:
- issue: Bezug von κακία im Kontext
  choice: Konkreter Bezug auf die bereits geschilderte böse Unterdrückung und ihre Folgen
  alternative: Das Böse allgemein oder Bosheit als persönliche Eigenschaft
  rationale: Der Erzählzusammenhang handelt von erzwungener Entweihung und Verfolgung. Die konkrete Wiedergabe als „dieses Unheil“ wahrt diesen Bezug, ohne die griechische Aussage konfessionell oder sachlich zu überpräzisieren.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die beiden Prädikatsadjektive werden mit „hart“ und „schwer zu ertragen“ semantisch unterschieden; die knappe Satzstruktur des Griechischen bleibt erhalten.
