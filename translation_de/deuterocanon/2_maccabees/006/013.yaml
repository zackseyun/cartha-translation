  source_fidelity: Die Übersetzung gibt den Gegensatz zwischen einer nicht langen Duldung der gottlos Handelnden und ihrem unmittelbaren Eintreten in Strafen sowie die Bewertung als Zeichen großer Güte sachgerecht wieder. Die griechische substantivierte Infinitivkonstruktion bezeichnet jedoch den gesamten Sachverhalt als Subjekt von „ist ein Zeichen“, nicht eine mit „wenn“ eingeleitete Bedingung.
  naturalness: „Wenn … sondern“ ist in diesem Satzbau nicht idiomatisch und verwischt die syntaktische Funktion des griechischen τὸ … ἐᾶσθαι … περιπίπτειν. Eine Dass-Konstruktion ist im modernen Standarddeutsch klarer. „Strafen verfallen“ ist eine natürliche, dem „anheimfallen“ semantisch entsprechende Formulierung.
  terminology: „gottlos handeln“, „Strafen“ und „große Güte“ sind treffend. Sie erhalten den verbalen Charakter von δυσσεβεῖν, den Strafcharakter von ἐπιτίμια und die spannungsvolle positive Wertung von εὐεργεσία, ohne eine konfessionelle Deutung einzutragen.
