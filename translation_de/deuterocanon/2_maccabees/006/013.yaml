base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/006/013.yaml
  text: For indeed[a], not allowing those who act impiously to go on for a long time, but immediately bringing punishments upon them, is a sign of great kindness.
translation:
  language: de
  text: Denn dass diejenigen, die gottlos handeln, nicht lange gewähren gelassen werden, sondern sogleich Strafen verfallen, ist ein Zeichen großer Güte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸ μὴ πολὺν χρόνον ἐᾶσθαι
  choice: wenn ... nicht lange Zeit gelassen wird
  rationale: Die substantivierte Infinitivkonstruktion bildet den Gegenstand der Aussage. Das Passiv ἐᾶσθαι wird nah am Griechischen als „Zeit gelassen wird“ wiedergegeben und bezeichnet, dass ihr gottloses Handeln nicht lange ungestraft fortbestehen darf.
- source_word: τοὺς δυσσεβοῦντας
  choice: denen, die gottlos handeln
  rationale: Die verbale Kraft des Partizips bleibt erhalten; die Formulierung bezeichnet konkretes gottloses Verhalten, statt die Betroffenen lediglich statisch als „die Gottlosen“ einzuordnen.
- source_word: ἀλλʼ εὐθέως
  choice: sondern ... sogleich
  rationale: „Sondern“ gibt den deutlichen Gegensatz zur langen Frist wieder; „sogleich“ bewahrt den gehobenen, aber gegenwärtig verständlichen Ton von εὐθέως.
- source_word: περιπίπτειν τοῖς ἐπιτιμίοις
  choice: den Strafen anheimfallen
  rationale: Die Wendung wahrt die intransitive Bildlichkeit von περιπίπτειν („hinein-/anheimfallen“) und den Strafcharakter von ἐπιτίμια, ohne Gott als ausdrücklich genanntes handelndes Subjekt einzuführen.
- source_word: μεγάλης εὐεργεσίας
  choice: großer Güte
  rationale: εὐεργεσία bezeichnet hier wohltätiges, gütiges Handeln. „Güte“ ist natürlich, würdevoll und lässt die Spannung bestehen, dass rasche Strafe als Wohltat gilt, ohne den engeren theologischen Begriff „Barmherzigkeit“ einzutragen.
- source_word: σημεῖόν ἐστιν
  choice: es ist ein Zeichen
  rationale: Die geläufige deutsche Entsprechung bewahrt den evidenziellen Bildgehalt von σημεῖον.
theological_decisions:
- issue: Rasche Strafe als Ausdruck göttlicher Wohltat
  choice: „ein Zeichen großer Güte“ bei unverändert deutlicher Bezeichnung als „Strafen“
  alternative: „ein Zeichen großer Barmherzigkeit“ oder die abschwächende Wiedergabe „Züchtigungen“
  rationale: 'Der griechische Text stellt die Spannung unmittelbar heraus: Das schnelle Eintreten von Strafen gilt als εὐεργεσία. Die Übersetzung bewahrt diese Aussage, ohne sie konfessionell zu deuten oder den Strafcharakter abzuschwächen.'
- issue: Ungenanntes handelndes Subjekt der Bestrafung
  choice: 'intransitiv: „sie ... den Strafen anheimfallen“'
  alternative: „Gott ... Strafen über sie bringt“
  rationale: Im Griechischen wird Gott in diesem Satz nicht ausdrücklich als grammatisches Subjekt genannt. Die gewählte Form wahrt diese Zurückhaltung und folgt περιπίπτειν genauer.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, allgemein verständlichem Bibelstil. Der Satzbau wurde für natürliches Deutsch leicht umgestellt; „sogleich“ und „anheimfallen“ geben dem Vers einen gehobenen Ton, ohne archaisch oder unverständlich zu wirken.
