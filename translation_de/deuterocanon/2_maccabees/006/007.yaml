base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/006/007.yaml
  text: And they were being led[a], under bitter compulsion, to the king’s monthly birthday observance for the sacrificial meal; and when a festival of Dionysus came, they were being forced, wearing ivy wreaths[b], to join the procession in honor of Dionysus.
translation:
  language: de
  text: Unter bitterem Zwang brachte man sie jeden Monat zur Feier des Geburtstags des Königs, zur Teilnahme am Opfermahl[a]. Und als ein Fest zu Ehren des Dionysos gefeiert wurde, zwang man sie, mit Efeu geschmückt[b] an der Prozession für Dionysos teilzunehmen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „zum Essen der Opfereingeweide oder Opferstücke“. Das griechische Wort bezeichnet die Teilnahme am Opferritus durch das Essen der dargebrachten Teile.'
    reason: lexical_alternative
  - marker: b
    text: Efeu war mit der Verehrung des Dionysos verbunden. Wörtlich heißt es „Efeu tragend“; wahrscheinlich ist Efeuschmuck gemeint, etwa Kränze oder Girlanden.
    reason: cultural_note
lexical_decisions:
- source_word: ἤγον
  choice: brachte man sie
  rationale: Das Imperfekt bezeichnet hier fortgesetztes beziehungsweise regelmäßig wiederkehrendes Handeln. Die aktive unbestimmte Konstruktion gibt das griechische Verb natürlich wieder, ohne die handelnden Personen näher festzulegen.
- source_word: μετὰ πικρᾶς ἀνάγκης
  choice: unter bitterem Zwang
  rationale: Die Formulierung bewahrt sowohl den starken äußeren Zwang als auch dessen schmerzlichen, bedrückenden Charakter.
- source_word: εἰς τὴν κατὰ μῆνα τοῦ βασιλέως γενέθλιον ἡμέραν
  choice: jeden Monat zur Feier des Geburtstags des Königs
  rationale: κατὰ μῆνα bezeichnet die monatliche Wiederkehr. Die Übersetzung macht verständlich, dass der königliche Geburtstag monatlich kultisch oder zeremoniell begangen wurde.
- source_word: ἐπὶ σπλαγχνισμόν
  choice: damit sie am Opfermahl teilnahmen
  rationale: Das seltene Wort bezeichnet im Opferkontext das Essen der Eingeweide beziehungsweise der zugeteilten Opferstücke. „Opfermahl“ vermittelt die kultische Teilnahme verständlich; die genauere Wortbedeutung wird in der Fußnote genannt.
- source_word: Διονυσίων ἑορτῆς
  choice: ein Fest zu Ehren des Dionysos
  rationale: Die Wendung bezeichnet ein dionysisches Fest, ohne zwingend einen bestimmten technisch benannten Festtag festzulegen.
- source_word: κισσοὺς ἔχοντες
  choice: mit Efeu bekränzt
  rationale: Wörtlich heißt es, dass sie Efeu hatten oder trugen. Im dionysischen Festzusammenhang liegt Efeuschmuck oder ein Efeukranz nahe; die Fußnote bewahrt die allgemeinere Form des Griechischen.
- source_word: πομπεύειν
  choice: an der Prozession ... teilzunehmen
  rationale: Das Verb bezeichnet die Teilnahme an einem feierlichen, hier kultischen Umzug.
- source_word: τῷ Διονύσῳ
  choice: für Dionysos
  rationale: Die knappe Dativfügung bewahrt die Ausrichtung der Prozession auf Dionysos, ohne die genaue kultische Beziehung übermäßig auszudeuten.
theological_decisions:
- issue: Grad der Explizitheit bei der erzwungenen Teilnahme am heidnischen Opfer in ἐπὶ σπλαγχνισμόν
  choice: Im Haupttext steht „am Opfermahl teilnahmen“; die konkrete Bedeutung des Essens von Opferteilen wird in einer Fußnote erläutert.
  alternative: „Opfereingeweide essen“ oder „an einem Opferfest teilnehmen“
  rationale: Der Text schildert erzwungene kultische Beteiligung. „Opfermahl“ macht den religiösen Charakter deutlich, bleibt lesbar und vermeidet zugleich eine unnötig enge Festlegung darauf, dass ausschließlich Eingeweide gemeint seien.
- issue: Auslegung von κισσοὺς ἔχοντες im Dionysoskult
  choice: „mit Efeu bekränzt“ im Haupttext, mit Hinweis auf die wörtlich allgemeinere Bedeutung in der Fußnote
  alternative: „Efeu tragend“
  rationale: Die kulturell naheliegende Form des Efeuschmucks wird idiomatisch ausgedrückt, während die genuine lexikalische Offenheit des Griechischen ausdrücklich erhalten bleibt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholte Zwangsausübung wird durch „jeden Monat“ und die unbestimmte Konstruktion „brachte man sie / zwang man sie“ klar. Kultische Begriffe bleiben erkennbar, werden aber nicht unnötig technisch formuliert.
