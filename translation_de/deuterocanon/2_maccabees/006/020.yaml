  text: But after spitting it out[a], he came forward in the manner required for those who choose to resist things that it is not lawful to taste, even for the sake of one’s attachment to life.
translation:
  language: de
  text: Nachdem er es aber ausgespuckt hatte, trat er so vor, wie es diejenigen tun müssen, die standhaft Widerstand leisten gegen das, was zu kosten nicht erlaubt ist, selbst aus Liebe zum Leben.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die ausharren, sich gegen Dinge zu wehren, die man nicht kosten darf«. Das Griechische verbindet Ausharren und Abwehr in einer schwer nachzubildenden Wendung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προπτύσας
  choice: Nachdem er es aber ausgespuckt hatte
  rationale: Das Aoristpartizip bezeichnet das Ausstoßen dessen, was Eleasar in den Mund genommen hatte. Das Pronomen »es« ergibt sich eindeutig aus dem Zusammenhang.
- source_word: καθʼ ὃν ἔδει τρόπον
  choice: so, wie es sich … gehörte
  rationale: Die Wendung verbindet Notwendigkeit mit sittlicher Angemessenheit; die deutsche Formulierung gibt beides natürlich wieder.
- source_word: προσέρχεσθαι
  choice: trat er … vor
  rationale: Das formal infinitivische Verb beschreibt hier sein bewusstes Herantreten zur bevorstehenden Strafe und wird im Deutschen narrativ aufgelöst.
- source_word: τοὺς ὑπομένοντας ἀμύνασθαι
  choice: die standhaft abwehren
  rationale: ὑπομένω bringt Ausharren und Standhaftigkeit zum Ausdruck, während ἀμύνομαι das aktive Abwehren bezeichnet. Die knappe Wiedergabe bewahrt beide Aspekte, ohne die schwierige griechische Verbindung einseitig festzulegen.
- source_word: ὧν οὐ θέμις γεύσασθαι
  choice: was zu kosten nicht erlaubt ist
  rationale: θέμις bezeichnet religiös und sittlich Erlaubtes; »nicht erlaubt« wahrt diesen normativen Sinn. »Kosten« bildet γεύομαι genauer ab als das allgemeinere »essen«.
- source_word: διὰ τὴν πρὸς ζῆν φιλοστοργίαν
  choice: auch nicht aus Liebe zum Leben
  rationale: φιλοστοργία bezeichnet eine starke, natürliche Zuneigung. Die Formulierung macht deutlich, dass selbst der Wunsch weiterzuleben den Genuss der verbotenen Speise nicht rechtfertigt.
theological_decisions:
- issue: Normative Kraft von οὐ θέμις im jüdischen Martyriumskontext
  choice: nicht erlaubt
  alternative: nicht gesetzmäßig; verboten
  rationale: »Nicht erlaubt« bewahrt den religiös-sittlichen Normcharakter, ohne eine bestimmte spätere Gesetzesterminologie einzutragen.
- issue: Bezug der Liebe zum Leben auf den verbotenen Genuss
  choice: auch nicht aus Liebe zum Leben
  alternative: wegen der Liebe zum Leben
  rationale: Die Formulierung gibt den kontextuellen Sinn wieder, dass Lebensliebe kein rechtmäßiger Grund zum Kosten ist, und vermeidet im Deutschen die missverständliche Aussage, gerade die Lebensliebe mache das Kosten unerlaubt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bleibt der gedrängten ethischen Argumentation des Griechischen nahe, wird aber für heutige Leser idiomatisch gegliedert.
