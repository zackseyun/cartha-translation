base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/006/002.yaml
  text: and also to defile the temple in Jerusalem and to name it for Olympian Zeus[a], and the one on Gerizim, as those who inhabited the place happened to do[b], for Zeus the protector of strangers.
translation:
  language: de
  text: außerdem den Tempel in Jerusalem zu entweihen und ihn Zeus Olympios zu nennen[a], ebenso den auf dem Garizim – wie es den Bewohnern des Ortes entsprach – Zeus Xenios[b] zu nennen, den Beschützer der Fremden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihm den Namen Zeus Olympios zu geben“. Das griechische Verb kann bedeuten, jemandem oder etwas eine zusätzliche oder neue Bezeichnung zu geben. „Olympios“ bedeutet „der Olympische“.'
    reason: lexical_alternative
  - marker: b
    text: 'Griechisch „Zeus Xenios“: Zeus als Schutzherr der Fremden, der Gäste und der Gastfreundschaft. Die vorausgehende Wendung über die Bewohner des Ortes ist im Griechischen knapp und kann auch wiedergegeben werden: „so, wie es der Lage der Ortsbewohner entsprach“.'
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: μολῦναι
  choice: zu entweihen
  rationale: Das Verb bezeichnet hier kultische Verunreinigung beziehungsweise Schändung. „Entweihen“ gibt diesen Bezug auf den Tempel im heutigen Deutsch klar und würdig wieder.
- source_word: νεὼ
  choice: Tempel
  rationale: νεώς bezeichnet hier das Tempelgebäude beziehungsweise Heiligtum; „Tempel“ ist an beiden Orten die natürliche und verständliche Wiedergabe.
- source_word: προσονομάσαι
  choice: nach … zu benennen
  rationale: Das Verb kann die Zuweisung einer zusätzlichen oder neuen Bezeichnung ausdrücken. Die Formulierung lässt offen, ob eine eigentliche Umbenennung oder eine kultische Neubenennung gemeint ist.
- source_word: Διὸς Ὀλυμπίου
  choice: Zeus Olympios
  rationale: Der Eigenname wird transliteriert; der etablierte griechische Kulttitel bleibt erkennbar. Eine Fußnote erläutert die wörtliche Bedeutung.
- source_word: Γαριζείν
  choice: Garizim
  rationale: Der Ortsname wird in seiner im Deutschen geläufigen biblischen Form wiedergegeben. Aus dem parallelen Satzbau ergibt sich, dass der dortige Tempel gemeint ist.
- source_word: καθὼς ἐτύγχανον οἱ τὸν τόπον οἰκοῦντες
  choice: entsprechend den dort lebenden Menschen
  rationale: Die knappe und mehrdeutige griechische Wendung wird bewusst nicht auf eine bestimmte Eigenschaft, Sitte oder Selbstaussage der Bewohner festgelegt.
- source_word: Διὸς ξενίου
  choice: Zeus Xenios, dem Beschützer der Fremden
  rationale: Der Kulttitel wird genannt und zugleich knapp verständlich gemacht. ξένιος bezeichnet Zeus in seiner Rolle als Schutzherr von Fremden, Gästen und Gastfreundschaft.
theological_decisions:
- issue: Wiedergabe heidnischer Göttertitel bei der Schändung jüdischer Heiligtümer
  choice: Die Titel als „Zeus Olympios“ und „Zeus Xenios“ beibehalten und ihre Bedeutung erläutern
  alternative: „Olympischer Zeus“ und „Zeus, der Beschützer der Fremden“ unmittelbar im Text
  rationale: So bleiben die historischen Kulttitel als solche sichtbar, während Haupttext und Fußnoten modernen Lesern ihre Bedeutung erschließen. Die berichtete erzwungene Umwidmung wird weder abgeschwächt noch konfessionell ausgedeutet.
- issue: Deutung von καθὼς ἐτύγχανον οἱ τὸν τόπον οἰκοῦντες
  choice: Eine offene Zuordnung zu den dortigen Bewohnern bewahren
  alternative: Die Wendung ausdrücklich auf deren Sitte, gesellschaftliche Stellung oder Eigenschaft als Fremde beziehen
  rationale: Der griechische Satz ist verdichtet und lässt die genaue Beziehung offen. Die Übersetzung vermeidet es, eine historisch oder theologisch weitergehende Erklärung in den Haupttext einzutragen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem historischem Ton. Der Satz bleibt als Fortsetzung des vorangehenden Auftrags im Infinitiv. Der Gedankenstrich macht die eingeschobene, im Griechischen verdichtete Bewohnerklausel lesbar, ohne ihre genaue Bedeutung festzulegen.
