  terminology: „Erlass“, „benachbarte griechische Städte“ und „gegen die Juden ebenso verfahren“ sind treffend. „Auf Vorschlag des Ptolemäus“ wahrt die Bedeutung von ὑποθεμένου besser als die stärker veranlassende Wendung „auf Betreiben“. Die Fußnote soll die kultische, nicht tödliche Bedeutung von σπλαγχνίζειν erläutern.
