base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/006/008.yaml
  text: And a decree went out to the neighboring Greek cities[a], at the suggestion of Ptolemy, to follow the same policy against the Jews, and to kill them,
translation:
  language: de
  text: 'Auch an die benachbarten griechischen Städte erging auf Vorschlag des Ptolemäus ein Erlass: Sie sollten gegen die Juden ebenso verfahren und sie zwingen, die Eingeweide der Opfertiere zu essen.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Verb bezieht sich auf die Eingeweide beziehungsweise inneren Teile eines Opfertiers. Im Zusammenhang ist damit der Zwang gemeint, diese Opferteile zu essen, nicht sie zu töten.
    reason: Das seltene und bildhafte σπλαγχνίζειν bezeichnet hier den kultischen Zwang im Kontext der vorausgehenden Verse und nicht eine Tötung.
lexical_decisions:
- source_word: ψήφισμα
  choice: Erlass
  rationale: Das Wort bezeichnet einen amtlichen Beschluss oder eine verbindliche Anordnung; »Erlass« passt zum administrativen Zusammenhang.
- source_word: ἐξῆλθεν εἰς
  choice: erging an
  rationale: Die griechische Wendung beschreibt die Bekanntgabe beziehungsweise Übermittlung eines Erlasses. »erging an« ist im Deutschen natürlich und wahrt den amtlichen Ton.
- source_word: ἀστυγείτονας Ἑλληνίδας πόλεις
  choice: benachbarte griechische Städte
  rationale: ἀστυγείτονας bezeichnet räumlich benachbarte Städte; Ἑλληνίδας kennzeichnet sie als griechisch.
- source_word: Πτολεμαίου ὑποθεμένου
  choice: auf Betreiben des Ptolemäus
  rationale: Der Genitivus absolutus nennt Ptolemäus als denjenigen, der die Maßnahme anregte oder veranlasste. »Auf Betreiben« gibt diesen wirksamen Anstoß prägnant wieder, ohne ihn zwingend als formellen Urheber des Erlasses darzustellen.
- source_word: τὴν αὐτὴν ἀγωγὴν κατὰ τῶν Ἰουδαίων ἄγειν
  choice: gegen die Juden ebenso verfahren
  rationale: Die Verbindung aus ἀγωγή und ἄγειν bezeichnet hier dieselbe Vorgehens- oder Behandlungsweise. Die deutsche Formulierung ist idiomatisch und bewahrt den Bezug auf die zuvor geschilderten Zwangsmaßnahmen.
- source_word: σπλαγχνίζειν
  choice: sie zwingen, vom Opferfleisch zu essen
  rationale: Das seltene Verb ist mit σπλάγχνα, den Eingeweiden beziehungsweise inneren Teilen eines Opfertiers, verbunden und bedeutet hier im Kontext der erzwungenen Teilnahme an heidnischen Opfern nicht »töten«, sondern das Essen der Opferteile. Weil die Städte handeln und die Maßnahmen gegen die Juden gerichtet sind, wird der im Zusammenhang vorausgesetzte Zwang ausdrücklich gemacht.
theological_decisions:
- issue: Deutung von σπλαγχνίζειν
  choice: sie zwingen, vom Opferfleisch zu essen
  alternative: sie töten / abschlachten
  rationale: Die gewaltsame Tötungsdeutung der englischen Beratungsschicht wird vom griechischen Wort im unmittelbaren Kontext nicht gestützt. σπλαγχνίζειν verweist auf Eingeweide beziehungsweise Opferteile; die vorausgehenden Verse handeln ausdrücklich vom erzwungenen Essen von Opfergaben. Die Übersetzung wahrt daher den kultischen Zwang als Sinn der Stelle und erläutert die ungewöhnliche Bildlichkeit in einer Fußnote.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur macht den Inhalt des Erlasses klar, ohne den amtlichen Ton zu überladen. »Ptolemäus« folgt der im Deutschen üblichen griechischen Namensform. Die kultische Bedeutung des Schlussverbs wird gegen die sachlich unzutreffende Tötungsdeutung der englischen Beratungsschicht aus dem griechischen Kontext heraus wiedergegeben.
