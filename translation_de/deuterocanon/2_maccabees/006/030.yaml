  source_fidelity: Die Übersetzung gibt die zeitliche Nähe zum Tod (μέλλων ... τελευτᾷν), die Schläge als Begleitumstand, das Aufstöhnen, die Aussage über die dem Herrn offenbarte Erkenntnis sowie den Kontrast von körperlichem Schmerz und willigem innerem Erleiden zuverlässig wieder. »Dem Tod hätte entkommen können« bewahrt die im Kontext gemeinte Möglichkeit, der Hinrichtung durch Nachgeben zu entgehen, ohne den griechischen Befreiungsbegriff zu überdeuten.
  naturalness: Modernes Standarddeutsch in einem dem Kontext angemessen würdigen Register. Die leicht markierte Formulierung »Dem Herrn ... ist offenbar« ist verständlich und spiegelt sinnvoll die ungewöhnliche dative Bezugnahme des griechischen Satzes. Der Gegensatz »am Körper« / »in meiner Seele« ist klar und natürlich.
  terminology: »Herr«, »heilige Erkenntnis«, »geißelt«, »Seele« und »Furcht« sind quellennahe und terminologisch konsistent. Die Fußnote zu »Furcht« bewahrt die mögliche Nuance von Ehrfurcht, ohne den stärkeren Grundsinn von φόβος im Haupttext aufzulösen.
