base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/006/030.yaml
  text: But as he was about to die under the blows[a], he groaned and said, “To the Lord, who has the holy knowledge, it is clear that, though I could have been released from death, I am enduring cruel pains in my body while being scourged[b]; but in my soul I gladly suffer these things because of fear of him.”
translation:
  language: de
  text: 'Als er unter den Schlägen dem Tod nahe war, stöhnte er auf und sagte: »Dem Herrn, der die heilige Erkenntnis besitzt, ist offenbar, dass ich, obwohl ich dem Tod hätte entkommen können,[a] am Körper grausame Schmerzen ertrage, während ich gegeißelt werde; in meiner Seele aber erleide ich dies gern aus Furcht vor ihm.[b]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Gemeint ist: Er hätte der Hinrichtung entgehen können, wenn er nachgegeben hätte. Wörtlich: »vom Tod befreit werden«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »aus Ehrfurcht vor ihm«. Das griechische Wort bedeutet »Furcht« und kann gegenüber Gott ehrfürchtige Furcht einschließen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μέλλων ... τελευτᾷν
  choice: als er ... dem Tod nahe war
  rationale: Die Konstruktion bezeichnet den unmittelbar bevorstehenden Tod; die deutsche Formulierung ist natürlich und würdevoll.
- source_word: ταῖς πληγαῖς
  choice: unter den Schlägen
  rationale: Der Dativ beschreibt Mittel bzw. Begleitumstand seines Sterbens, ohne die Beziehung unnötig zu verengen.
- source_word: ἀναστενάξας
  choice: stöhnte er auf
  rationale: Das Partizip bezeichnet ein hörbares tiefes Seufzen oder Stöhnen.
- source_word: Τῷ κυρίῳ τῷ τὴν ἁγίαν γνῶσιν ἔχοντι
  choice: Dem Herrn, der die heilige Erkenntnis besitzt
  rationale: Die Anrede bzw. Bezugnahme im Dativ und das markante ἁγίαν γνῶσιν werden eng am Griechischen bewahrt.
- source_word: φανερὸν ἐστὶν
  choice: ist offenbar
  rationale: Gibt die unpersönliche Feststellung prägnant und in angemessenem Register wieder.
- source_word: δυνάμενος ἀπολυθῆναι τοῦ θανάτου
  choice: obwohl ich dem Tod hätte entkommen können
  rationale: ἀπολύω kann hier Befreiung oder Entrinnen bezeichnen; gemeint ist die reale Möglichkeit, die Hinrichtung durch Nachgeben zu vermeiden.
- source_word: σκληρὰς ... ἀλγηδόνας
  choice: grausame Schmerzen
  rationale: Bewahrt sowohl den Schmerzbegriff als auch die Härte des Adjektivs.
- source_word: κατὰ σῶμα
  choice: am Körper
  rationale: Natürliches Deutsch, das den ausdrücklichen Gegensatz zu κατὰ ψυχήν erhält.
- source_word: μαστιγούμενος
  choice: während ich gegeißelt werde
  rationale: Bezeichnet die gleichzeitig stattfindende körperliche Misshandlung präzise und mit dem Ernst der Szene.
- source_word: κατὰ ψυχὴν
  choice: in meiner Seele
  rationale: Bewahrt die anthropologische Gegenüberstellung von Körper und Seele, ohne sie psychologisch zu verflachen.
- source_word: ἡδέως
  choice: gern
  rationale: Drückt die willige Annahme des Leidens natürlich aus; „gern“ vermeidet im Deutschen den möglichen Eindruck unbeschwerter Freude.
- source_word: διὰ τὸν αὐτοῦ φόβον
  choice: aus Furcht vor ihm
  rationale: Behält den kräftigen Grundsinn von φόβος bei und lässt zugleich den Kontext ehrfürchtiger Gottesfurcht offen.
theological_decisions:
- issue: Bedeutung von φόβος in Bezug auf den Herrn
  choice: Furcht vor ihm
  alternative: Ehrfurcht vor ihm
  rationale: φόβος kann im biblischen Sprachgebrauch ehrfürchtige Gottesfurcht bezeichnen, behält aber die stärkere Bedeutung „Furcht“. Der Haupttext wahrt diese Spannung; die Fußnote nennt die mögliche Nuance.
- issue: Bedeutung von ψυχή im Gegensatz zu σῶμα
  choice: Seele
  alternative: Inneres; Geist
  rationale: Der griechische Text stellt körperlichen Schmerz und innere willige Haltung ausdrücklich gegenüber. „Seele“ erhält die lexikalische und anthropologische Spannung.
- issue: Art der Befreiung vom Tod
  choice: dem Tod entkommen können
  alternative: vom Tod freigelassen werden können
  rationale: Der Zusammenhang legt nahe, dass Eleasar durch Nachgeben der Hinrichtung hätte entgehen können. Die idiomatische Wiedergabe wird durch eine Fußnote erläutert, ohne den griechischen Befreiungsbegriff zu überfrachten.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch in würdigem erzählerischem Ton. Der Körper-Seele-Gegensatz sowie die Spannung zwischen Furcht und Ehrfurcht bleiben erhalten; ungewöhnliche griechische Bildlichkeit wird nur dort idiomatisch geglättet, wo eine wörtliche Wiedergabe im Deutschen missverständlich wäre.
