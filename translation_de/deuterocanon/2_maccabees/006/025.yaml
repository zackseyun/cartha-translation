  text: and they too[a], because of my hypocrisy and because of this brief and momentary life, might be led astray because of me[c][b], and I would acquire hatred and a stain upon my old age.
translation:
  language: de
  text: Auch sie könnten wegen meiner Heuchelei und wegen dieses kurzen, flüchtigen Lebens durch mich in die Irre geführt werden, und ich würde mir Abscheu und einen Makel meines Alters zuziehen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „und ich würde mir Abscheu und einen Makel des Alters erwerben“. „Abscheu“ kann auch bedeuten, dass jemand zum Gegenstand von Abscheu oder öffentlicher Verachtung wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπόκρισιν
  choice: Heuchelei
  rationale: Das Wort bezeichnet hier ein vorgetäuschtes Verhalten, das Beobachtende täuschen würde. „Heuchelei“ bewahrt sowohl den Gedanken des Schauspiels als auch das moralische Gewicht.
- source_word: μικρὸν καὶ ἀκαριαῖον ζῆν
  choice: dieses kurze, flüchtige Leben
  rationale: Die substantivierte Infinitivkonstruktion meint die geringe und schnell vorübergehende verbleibende Lebenszeit. Die Formulierung ist im Deutschen natürlich und erhält den Kontrast zur bleibenden Schande.
- source_word: πλανηθῶσιν
  choice: könnten … in die Irre geführt werden
  rationale: Der passive Aorist-Konjunktiv bezeichnet hier die befürchtete Möglichkeit, dass andere durch Eleasars Beispiel getäuscht und moralisch fehlgeleitet werden.
- source_word: μύσος
  choice: Abscheu
  rationale: μύσος bezeichnet starken Widerwillen beziehungsweise etwas Abscheuerregendes. „Abscheu“ gibt die Nuance öffentlicher Verachtung genauer wieder als das allgemeinere „Hass“.
- source_word: κηλῖδα
  choice: einen Makel
  rationale: Das konkrete Bild eines Flecks wird metaphorisch auf den Ruf bezogen. „Makel“ ist im Deutschen idiomatisch und bewahrt das Bild bleibender Beschädigung.
- source_word: γήρως
  choice: mein Alter
  rationale: Der Genitiv bezeichnet das hohe Alter, über das die Schande gebracht würde. „Mein Alter“ klingt natürlicher als „mein Greisenalter“ und wahrt den würdevollen Ton.
- source_word: κατακτήσωμαι
  choice: ich würde … über mich bringen
  rationale: Das Medium drückt aus, dass Eleasar die Folgen selbst auf sich ziehen würde. Die deutsche Wendung macht diesen selbstverschuldeten Erwerb von Schande deutlich.
theological_decisions:
- issue: Moralische Tragweite von ὑπόκρισις im Martyriumskontext
  choice: Heuchelei
  alternative: Verstellung; Vortäuschung
  rationale: Gemeint ist nicht nur eine taktische Täuschung, sondern ein falsches äußeres Zeugnis, das andere fehlleiten könnte. „Heuchelei“ erhält diesen ethischen Ernst, ohne eine spätere konfessionelle Deutung einzutragen.
- issue: Sinn des Schlusssatzes
  choice: als selbst herbeigeführte Schande wiedergegeben
  alternative: „ich würde Abscheu und einen Makel im Alter erwerben“
  rationale: Das griechische Medium betont, dass Eleasar die entehrenden Folgen durch das eigene Handeln auf sich ziehen würde. „Über mein Alter bringen“ drückt dies idiomatisch aus.
translation_notes:
  register: 'Modernes, würdevolles Standarddeutsch. Der Satz bleibt eng an der griechischen Gedankenführung, wird jedoch durch idiomatische deutsche Wendungen geglättet. Das zweimalige διὰ wird differenziert wiedergegeben: kausal bei der Heuchelei und final-motivisch bei der kurzen Lebenszeit.'
