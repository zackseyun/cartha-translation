    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: damit
  rationale: Leitet den Zweck der vorgeschlagenen Handlung natürlich und präzise ein.
- source_word: τοῦτο πράξας
  choice: wenn er dies täte
  rationale: Das Aoristpartizip bezeichnet die der erhofften Freilassung vorausgehende Handlung; im deutschen Satzgefüge gibt der konditionale Nebensatz den sachlichen Zusammenhang idiomatisch wieder.
- source_word: ἀπολυθῇ τοῦ θανάτου
  choice: dem Tod entginge
  rationale: ἀπολύω mit dem Genitiv bezeichnet hier die Befreiung vom drohenden Tod, konkret die Verschonung von der Hinrichtung. Die Wendung ist im Deutschen natürlich und vermeidet jenseitige oder heilsgeschichtliche Nebenbedeutungen.
- source_word: διὰ τὴν ἀρχαίαν πρὸς αὐτοὺς φιλίαν
  choice: wegen seiner langjährigen Freundschaft mit ihnen
  rationale: ἀρχαία bezeichnet eine seit langer Zeit bestehende Freundschaft; πρὸς αὐτούς richtet die Beziehung auf die betreffende Gruppe. Die gewählte Formulierung bewahrt diese Relation ohne die Perspektive unnötig umzukehren.
- source_word: τύχοι φιλανθρωπίας
  choice: menschliche Güte erführe
  rationale: τυγχάνω mit Genitiv bedeutet erlangen oder erfahren; φιλανθρωπία bezeichnet menschenfreundliche Güte, Wohlwollen oder humane Behandlung. Die Formulierung hält diese Bedeutungsbreite offen.
theological_decisions:
- issue: Bedeutung der Befreiung vom Tod
  choice: dem Tod entginge
  alternative: vom Tod freigelassen würde / von der Hinrichtung verschont bliebe
  rationale: Die Aussage betrifft im Erzählzusammenhang die drohende Hinrichtung, nicht Erlösung oder ein Weiterleben nach dem Tod. Die Übersetzung vermeidet daher eine theologische Überdeutung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Konjunktiv gibt die beabsichtigte beziehungsweise erhoffte Folge wieder. „Menschliche Güte“ spiegelt φιλανθρωπία enger als das allgemeinere „Freundlichkeit“, während die Fußnote idiomatische Alternativen nennt.
