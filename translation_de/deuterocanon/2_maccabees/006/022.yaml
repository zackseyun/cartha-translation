translation:
  language: de
  text: damit er, nachdem er dies getan hätte, dem Tod entkommen könnte[a] und wegen seiner langjährigen Freundschaft mit ihnen Wohlwollen erfahren könnte[b].
  philosophy: optimal-equivalence
  footnotes:
