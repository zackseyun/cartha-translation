  source_fidelity: 'Die Grundbedeutung wird überwiegend getroffen: Es geht darum, dass Eleasar durch die vorgeschlagene Handlung dem Tod entkommen und aufgrund seiner langjährigen Beziehung zu ihnen Wohlwollen erfahren soll. Das griechische Aoristpartizip τοῦτο πράξας bezeichnet jedoch eine vorausgehende Handlung („nachdem/indem er dies getan hätte“), nicht eine bloße Bedingung („wenn er dies täte“).'
