base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/008/009.yaml
  text: But he quickly selected Nicanor son of Patroclus[a], one of his chief Friends, and sent him, having assigned to him no fewer than twenty thousand from the nations of every tribe to wipe out the whole Jewish people. They also appointed with him Gorgias, a military man experienced in matters of war[c][b],
translation:
  language: de
  text: Er aber wählte rasch Nikanor, den Sohn des Patroklos und einen der ersten Freunde[a], aus und sandte ihn. Dabei unterstellte er ihm nicht weniger als zwanzigtausend Mann aus Völkern verschiedenster Herkunft[b], um das ganze jüdische Volk auszurotten[c]. Ihm stellte man außerdem Gorgias zur Seite, einen Feldherrn, der in Kriegsangelegenheiten viel Erfahrung hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Erste Freunde“ war wahrscheinlich eine Hofbezeichnung für hochrangige Vertraute des Königs und meinte nicht bloß persönliche Freunde.
    reason: lexical_alternative
  - marker: b
    text: Die ungewöhnliche griechische Wendung kann auch „aus Völkern jeder Art“ oder „aus Völkern aller Stämme“ bedeuten; gemeint sind wohl Truppen unterschiedlicher Herkunft.
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlicher: „das ganze Geschlecht Judäas auszurotten“.'
    reason: alternative_reading
lexical_decisions:
- source_word: προχειρισάμενος
  choice: wählte … aus
  rationale: Das Partizip bezeichnet die Auswahl beziehungsweise Bestimmung für einen Auftrag; „auswählen“ ist im Deutschen natürlich und wahrt beide Aspekte.
- source_word: τῶν πρώτων φίλων
  choice: einen der Ersten Freunde
  rationale: „Freunde“ kann im hellenistischen Hofwesen eine Rang- oder Hofbezeichnung sein. Die Großschreibung und die nahe Wiedergabe von πρῶτοι erhalten diesen möglichen Titelsinn.
- source_word: ὑποτάξας
  choice: unterstellte er ihm
  rationale: Gemeint ist, dass die Truppen Nikanors Befehl unterstellt wurden; die militärische Beziehung wird damit präzise ausgedrückt.
- source_word: παμφύλων ἔθνη
  choice: Mann aus Völkern verschiedenster Herkunft
  rationale: Die ungewöhnliche Wendung bezeichnet wahrscheinlich ethnisch vielfältige Kontingente. „Verschiedenster Herkunft“ ist verständlich, ohne die Mehrdeutigkeit auf eine einzelne Stammesordnung festzulegen.
- source_word: οὐκ ἐλάττους τῶν δισμυρίων
  choice: nicht weniger als zwanzigtausend Mann
  rationale: Die quantitative Vergleichsform wird direkt wiedergegeben; „Mann“ verdeutlicht im Kontext, dass es sich um Truppen handelt.
- source_word: τὸ πᾶν τῆς Ἰουδαίας ἐξᾶραι γένος
  choice: das ganze jüdische Volk auszurotten
  rationale: ἐξᾶραι bezeichnet hier vollständige Beseitigung beziehungsweise Vernichtung; γένος meint die jüdische Volksgemeinschaft und nicht eine modern-biologische „Rasse“.
- source_word: συνέστησαν δὲ αὐτῷ καὶ Γοργίαν
  choice: Ihm stellte man außerdem Gorgias zur Seite
  rationale: Die Formulierung gibt die Zuordnung des Gorgias zu Nikanor als Mitwirkendem wieder und bewahrt das unbestimmte Subjekt des griechischen Plurals.
- source_word: ἄνδρα στρατηγὸν
  choice: einen Feldherrn
  rationale: στρατηγός bezeichnet einen militärischen Befehlshaber; „Feldherr“ ist würdig, klar und im antiken Zusammenhang angemessen.
- source_word: εὖ πολεμικαῖς χρείαις ἔχοντα πεῖραν
  choice: der in Kriegsangelegenheiten viel Erfahrung hatte
  rationale: Die Wendung hebt praktische, bewährte Erfahrung in militärischen Belangen hervor.
theological_decisions:
- issue: Wiedergabe von γένος im ethnisch-nationalen Zusammenhang
  choice: jüdisches Volk
  alternative: Geschlecht Judas / Volk Judäas
  rationale: Der Vernichtungsplan richtet sich gegen die Juden als Gesamtvolk. „Jüdisches Volk“ wahrt den kollektiven ethnischen Sinn, ohne moderne biologische Vorstellungen einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau wurde zur besseren Verständlichkeit geteilt. Die möglichen hellenistischen Hof- und Militärtitel bleiben erkennbar; ungewöhnliche beziehungsweise mehrdeutige Quellformulierungen werden in Fußnoten offengelegt.
