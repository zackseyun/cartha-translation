  yaml_path: translation/deuterocanon/2_maccabees/008/006.yaml
  text: And coming upon cities and countryside unexpectedly[a], he would set them on fire; and by seizing strategic places, he put not a few of the enemies to flight,
translation:
  language: de
  text: Er kam unerwartet in Städte und ländliche Gebiete und steckte sie in Brand; wobei er strategisch wichtige Orte einnahm und nicht wenige der Feinde in die Flucht schlug,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πόλεις
  choice: Städte
  rationale: Die übliche Bezeichnung für städtische Siedlungen; sie bildet hier den Gegensatz zu den ländlichen Gebieten.
- source_word: χώρας
  choice: Landgebiete
  rationale: Im Kontrast zu πόλεις sind ländliche Gebiete gemeint, nicht politische Staaten. „Landgebiete“ wahrt zugleich den Plural des Griechischen.
- source_word: ἀπροσδοκήτως
  choice: unerwartet
  rationale: Gibt den schlichten Sinn wieder, dass sein Kommen nicht erwartet wurde, ohne die Art des Angriffs weiter auszudeuten.
- source_word: ἐρχόμενος
  choice: kam ... über
  rationale: Die deutsche Wendung „über etwas kommen“ lässt den feindlichen und überraschenden Charakter des Kommens erkennen, ohne das allgemeinere griechische Verb ausdrücklich mit „überfallen“ zu verstärken.
- source_word: ἐνεπίμπρα
  choice: steckte ... in Brand
  rationale: Gibt das transitive Verb idiomatisch wieder. Der griechische Imperfekt beschreibt im Zusammenhang sein wiederholtes Vorgehen.
- source_word: ἐπικαίρους τόπους
  choice: strategisch wichtige Orte
  rationale: ἐπίκαιρος bezeichnet hier im militärischen Zusammenhang Orte, die zur rechten Zeit vorteilhaft oder entscheidend sind; „strategisch wichtig“ vermittelt diese Funktion natürlich.
- source_word: ἀπολαμβάνων
  choice: nahm ... ein
  rationale: Bei militärisch bedeutsamen Orten bezeichnet das Verb die Inbesitznahme oder Besetzung.
- source_word: οὐκ ὀλίγους
  choice: nicht wenige
  rationale: Bewahrt die griechische Litotes, die auch im Deutschen verständlich und wirkungsvoll ist.
- source_word: τῶν πολεμίων
  choice: Feinde
  rationale: Bewahrt den Plural des griechischen Ausdrucks; der bestimmte Artikel muss im Deutschen nach „nicht wenige“ nicht wiedergegeben werden.
- source_word: τροπούμενος
  choice: schlug ... in die Flucht
  rationale: Gibt den militärischen Sinn wieder, Gegner zum Weichen oder zur Flucht zu bringen, ohne ihn zum allgemeineren „besiegen“ abzuschwächen.
