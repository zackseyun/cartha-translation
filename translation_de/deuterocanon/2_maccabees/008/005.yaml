base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/008/005.yaml
  text: But when Maccabaeus had formed a band[a], he had by then become irresistible to the nations, because the wrath of the Lord had turned to mercy.
translation:
  language: de
  text: Als Makkabäus aber eine Schar um sich gesammelt hatte, war er für die Völker[a] nicht mehr aufzuhalten, denn der Zorn des Herrn hatte sich in Erbarmen gewandelt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „für die Heiden“; das griechische Wort kann hier die nichtjüdischen Völker im Umfeld Judäas bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γενόμενος ... ἐν συστήματι
  choice: eine Schar um sich gesammelt hatte
  rationale: Die Wendung bezeichnet, dass Makkabäus nun innerhalb eines zusammengeschlossenen Verbandes handelte. Die gewählte Formulierung ist natürliches Deutsch und lässt Größe und genaue militärische Organisation der Gruppe offen.
- source_word: ἀνυπόστατος
  choice: nicht mehr aufzuhalten
  rationale: Das Adjektiv bezeichnet jemanden, dem man nicht standhalten kann. Die idiomatische Wendung gibt diese militärische Unwiderstehlichkeit wieder, ohne absolute Unverwundbarkeit zu behaupten.
- source_word: τοῖς ἔθνεσιν
  choice: für die Völker
  rationale: ἔθνη bezeichnet hier wahrscheinlich die nichtjüdischen Völker beziehungsweise Mächte im Umfeld Judäas. „Völker“ bleibt nah am Griechischen; die mögliche Bedeutung „Heiden“ wird in der Fußnote genannt.
- source_word: τῆς ὀργῆς τοῦ κυρίου
  choice: der Zorn des Herrn
  rationale: „Zorn“ bewahrt das Gewicht der göttlichen Missbilligung; „Herr“ ist hier die Gottesbezeichnung.
- source_word: εἰς ἔλεον τραπείσης
  choice: hatte sich in Erbarmen gewandelt
  rationale: Die Formulierung erhält das starke Bild einer Wendung vom göttlichen Zorn zum Erbarmen und glättet die darin liegende theologische Spannung nicht.
theological_decisions:
- issue: Ursächlicher Bezug des abschließenden Genitivus absolutus
  choice: denn der Zorn des Herrn hatte sich in Erbarmen gewandelt
  alternative: während sich der Zorn des Herrn in Erbarmen gewandelt hatte
  rationale: Der Genitivus absolutus erklärt im Zusammenhang den Erfolg des Makkabäus. „Denn“ macht diesen naheliegenden ursächlichen Bezug verständlich, ohne zusätzliche göttliche Handlungen in den Text einzutragen.
- issue: Wendung von Gottes Zorn zu Erbarmen
  choice: der Zorn des Herrn hatte sich in Erbarmen gewandelt
  alternative: der Herr hatte seinen Zorn in Erbarmen verwandelt
  rationale: Die gewählte Fassung folgt der grammatischen Bildsprache des Griechischen, in der der Zorn selbst Subjekt der Wendung ist, und bewahrt die auffällige theologische Aussage.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Eine Schar um sich gesammelt“ ist allgemein verständlich und vermeidet eine unbelegte Festlegung auf Größe oder Organisationsform der Streitmacht; „nicht mehr aufzuhalten“ gibt die militärische Aussage idiomatisch wieder.
