base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/008/030.yaml
  text: And after crushing the forces around Timothy and Bacchides[a], they killed more than twenty thousand of them, gained firm control of very high strongholds, and divided the plentiful plunder, making themselves equal sharers with the oppressed and orphans and widows, and even with the elderly.
translation:
  language: de
  text: Nachdem sie die Truppen um Timotheus und Bakchides vernichtend geschlagen hatten, töteten sie mehr als zwanzigtausend von ihnen. Sie brachten sehr hoch gelegene Festungen fest in ihre Gewalt und teilten die reichliche Beute so auf, dass sie selbst denselben Anteil erhielten wie die Unterdrückten, die Waisen und Witwen und sogar die älteren Menschen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „… so auf, dass sie den Unterdrückten, den Waisen und Witwen und sogar den älteren Menschen denselben Anteil gaben wie sich selbst.“ Das griechische Pronomen lässt beide Zuordnungen zu; der Haupttext versteht es so, dass die Kämpfer selbst mit diesen schutzbedürftigen Gruppen den gleichen Anteil erhielten.'
    reason: alternative_reading
lexical_decisions:
- source_word: συνερείσαντες
  choice: vernichtend geschlagen hatten
  rationale: Das Partizip bezeichnet ein gewaltsames Niederwerfen oder Zerschlagen; im militärischen Zusammenhang gibt „vernichtend schlagen“ die Stärke des Ausdrucks natürlich wieder, ohne zwingend die völlige Vernichtung aller Truppen zu behaupten.
- source_word: τοὺς περὶ Τιμόθεον καὶ Βακχίδην
  choice: die Truppen um Timotheus und Bakchides
  rationale: Die griechische Wendung οἱ περὶ mit Personennamen bezeichnet die mit ihnen verbundene oder von ihnen geführte Gruppe; „Truppen um“ bewahrt diese Bedeutung im militärischen Kontext.
- source_word: ὑπὲρ τοὺς δισμυρίους
  choice: mehr als zwanzigtausend
  rationale: δισμύριοι bedeutet zwanzigtausend, und ὑπέρ mit Akkusativ bezeichnet hier eine Überschreitung.
- source_word: ἀνεῖλον
  choice: töteten
  rationale: ἀναιρέω bedeutet in einem Schlachtbericht unmittelbar „töten“; die Wiedergabe ist klar und sachlich.
- source_word: ὀχυρωμάτων ὑψηλῶν εὖ μάλα ἐγκρατεῖς ἐγένοντο
  choice: brachten sehr hoch gelegene Festungen fest in ihre Gewalt
  rationale: ἐγκρατεῖς γενέσθαι bezeichnet das Erlangen von Herrschaft oder Besitz; εὖ μάλα verstärkt ὑψηλῶν. „Hoch gelegen“ ist bei Festungen im Deutschen natürlicher als „hoch“ und lässt den topografischen Sinn erkennen.
- source_word: λάφυρα πλείονος
  choice: die reiche Beute
  rationale: Die textlich auffällige Formulierung bezeichnet dem Zusammenhang nach eine große Menge an Kriegsbeute. „Reiche Beute“ ist idiomatisch, würdig und wahrt den quantitativen Sinn.
- source_word: ἐμερίσαντο
  choice: teilten ... auf
  rationale: Das Verb bedeutet teilen oder in Anteile aufteilen; „aufteilen“ passt natürlich zur Beuteverteilung.
- source_word: ἰσομοίρους αὐτοὺς ... ποιήσαντες
  choice: wobei sie sich selbst ... als gleichberechtigte Teilhaber zur Seite stellten
  rationale: 'Die Hauptfassung versteht αὐτούς rückbezüglich auf die handelnden Kämpfer: Sie beanspruchten keinen größeren Anteil als die genannten Bedürftigen. Die syntaktisch mögliche umgekehrte Zuordnung wird in der Fußnote bewahrt.'
- source_word: τοῖς ἠκισμένοις
  choice: den Unterdrückten
  rationale: Die Bezeichnung meint misshandelte, geschädigte oder bedrängte Menschen. „Unterdrückte“ passt zur Reihe sozial verletzlicher Gruppen.
- source_word: πρεσβυτέροις
  choice: den älteren Menschen
  rationale: Der Zusammenhang betrifft die Verteilung an schutzbedürftige Personen, nicht ein Leitungsamt. Die inklusive Formulierung vermeidet die unnötige Festlegung auf männliche Amtsträger.
theological_decisions:
- issue: Bezug von αὐτούς in ἰσομοίρους αὐτοὺς ... ποιήσαντες
  choice: Die Kämpfer machten sich selbst zu gleichberechtigten Teilhabern neben den Unterdrückten, Waisen, Witwen und älteren Menschen.
  alternative: Sie machten die genannten schutzbedürftigen Gruppen zu gleichberechtigten Teilhabern neben sich selbst beziehungsweise gaben ihnen gleiche Anteile.
  rationale: αὐτούς kann sich nach den vorausgehenden Verben auf die handelnde Gruppe beziehen und annähernd rückbezüglich gebraucht sein. Damit wird hervorgehoben, dass die Kämpfer sich keinen höheren Anteil vorbehielten. Da die umgekehrte Zuordnung syntaktisch möglich ist und denselben Akt gerechter Verteilung aus einer anderen Perspektive beschreibt, wird sie nicht stillschweigend ausgeschlossen, sondern in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzfolge wurde zur besseren Verständlichkeit geteilt. „Bakchides“ folgt einer üblichen deutschen Transkription des griechischen Namens; „ältere Menschen“ vermeidet sowohl einen amtlichen Sinn von „Älteste“ als auch eine unnötige geschlechtliche Verengung.
