translation:
  language: de
  text: Das Geld derer aber, die gekommen waren, um sie zu kaufen, nahmen sie an sich. Nachdem sie ihnen eine beträchtliche Strecke weit[a] nachgesetzt hatten, zogen sie sich aus der Gegend zurück, da sie bedrängt wurden[b].
