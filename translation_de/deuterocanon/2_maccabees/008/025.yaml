  verdict: revise
  source_fidelity: Die Übersetzung gibt χρήματα, den Kaufzweck, die zeitliche Abfolge der Verfolgung und die begründende Funktion von συγκλειόμενοι insgesamt zutreffend wieder. »Bedrängt wurden« wahrt sinnvoll die offene Ursache der Einengung. Bei ἀνέλυον ἀπὸ τῆς χώρας ist jedoch »kehrten sie aus der Gegend zurück« im Deutschen missverständlich und stilistisch unnatürlich; es kann nahelegen, sie seien in die Gegend zurückgekehrt. »Zogen sie sich aus der Gegend zurück« bildet den Rückzug bzw. das Verlassen des Gebiets klarer ab, ohne dessen genaue geografische Bestimmung festzulegen.
  naturalness: Der Text ist ansonsten modernes, würdiges Standarddeutsch. Die Änderung von »kehrten ... aus der Gegend zurück« zu »zogen sich aus der Gegend zurück« beseitigt eine syntaktisch-semantische Unklarheit.
  terminology: »Geld«, »kaufen«, »nachsetzen«, »beträchtliche Strecke weit« und »Gegend« sind angemessene, registergerechte Wiedergaben. Die Fußnoten bewahren die lexikalische Offenheit von ἐφʼ ἱκανόν und συγκλειόμενοι.
