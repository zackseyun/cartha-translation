translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der erste Satz behält durch die Stellung von »aber« einen leichten Kontrast bei. Die beiden Partizipialkonstruktionen werden zur besseren Verständlichkeit als temporaler Nebensatz beziehungsweise begründender da-Satz wiedergegeben; die sachlichen Unschärfen des Griechischen bleiben durch Fußnoten sichtbar.
