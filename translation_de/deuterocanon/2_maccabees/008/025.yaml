lexical_decisions:
- source_word: χρήματα
  choice: Geld
  rationale: Im Zusammenhang ist das Zahlungsmittel gemeint, das die Händler zum Kauf der erwarteten Gefangenen mitgebracht hatten; »Geld« ist daher genauer und natürlicher als »Besitz« oder »Mittel«.
- source_word: τῶν παραγενομένων ἐπὶ τὸν ἀγορασμὸν αὐτῶν
  choice: derer, die gekommen waren, um sie zu kaufen
  rationale: Die Formulierung gibt das Ankommen zum Zweck des Kaufs idiomatisch wieder. Das Pronomen bezieht sich im Kontext auf die Menschen, die als Gefangene verkauft werden sollten.
- source_word: συνδιώξαντες
  choice: nachdem sie ihnen … nachgesetzt hatten
  rationale: Das Partizip wird zeitlich aufgelöst. »Nachsetzen« passt zum militärischen Verfolgungszusammenhang, ohne das Präfix συν- unnatürlich mit »gemeinsam« zu überladen.
- source_word: ἐφʼ ἱκανόν
  choice: eine beträchtliche Strecke weit
  rationale: Bei einer Verfolgung liegt eine räumliche Ausdehnung nahe; die Wendung kann jedoch auch eine längere Dauer bezeichnen, was in einer Fußnote erhalten bleibt.
- source_word: ἀνέλυον
  choice: kehrten … zurück
  rationale: ἀναλύω kann im Reise- und Militärzusammenhang Aufbruch, Rückkehr oder Rückzug bezeichnen. Nach der Verfolgung gibt »kehrten zurück« die Bewegungsumkehr natürlich wieder.
- source_word: ἀπὸ τῆς χώρας
  choice: aus der Gegend
  rationale: χώρα bezeichnet hier unspezifisch ein Gebiet oder eine Gegend; »Gegend« vermeidet eine unbelegte politische oder nationale Festlegung.
- source_word: συγκλειόμενοι
  choice: da sie bedrängt wurden
  rationale: Das Partizip kann ein Eingeschlossen-, Eingeengt- oder Bedrängtwerden ausdrücken und dürfte den Grund der Rückkehr nennen. Die Übersetzung wahrt die Unbestimmtheit darüber, wodurch oder von wem die Bedrängnis ausging.
