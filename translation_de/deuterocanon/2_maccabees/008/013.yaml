  yaml_path: translation/deuterocanon/2_maccabees/008/013.yaml
  text: But those who had become cowardly and distrusted the justice of God kept slipping away and going into exile[a].
translation:
  language: de
  text: Diejenigen aber, die feige waren und dem Gericht Gottes nicht vertrauten, machten sich immer wieder davon und zogen in die Fremde.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „gingen ins Exil“. Das griechische Wort bezeichnet das Verlassen des eigenen Ortes oder Heimatgebiets, ohne zwingend ein förmlich angeordnetes Exil zu meinen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δειλανδροῦντες
  choice: den Mut verloren hatten
  rationale: Das Partizip bezeichnet Feigheit beziehungsweise ein Schwinden des Mutes. Die Formulierung gibt den resultativen Sinn natürlich wieder, ohne die vorwurfsvolle Nuance völlig abzuschwächen.
- source_word: ἀπιστοῦντες
  choice: nicht vertrauten
  rationale: Mit τὴν τοῦ θεοῦ δίκην als Objekt geht es um mangelndes Vertrauen darauf, dass Gottes richterliches Handeln wirksam werden wird, nicht bloß um abstrakten Unglauben.
- source_word: δίκην
  choice: Gericht
  rationale: „Gericht“ bewahrt die Spannweite zwischen göttlicher Gerechtigkeit, richterlichem Eingreifen und vergeltender Ahndung besser als eine stärker festlegende Wiedergabe.
- source_word: διεδίδρασκον ἑαυτούς
  choice: machten sich immer wieder davon
  rationale: Der Imperfekt bezeichnet einen fortdauernden oder wiederholten Vorgang; die reflexive Wendung wird idiomatisch und mit einem Anklang an heimliches Entkommen wiedergegeben.
- source_word: ἐξετόπιζον
  choice: verließen ihre Heimat
  rationale: Das Verb bezeichnet das Fortgehen aus dem eigenen Ort beziehungsweise die Verlagerung in die Fremde. „Verließen ihre Heimat“ ist im Deutschen natürlich und vermeidet die mögliche Überdeutung eines förmlich auferlegten Exils.
theological_decisions:
- issue: Bedeutung von τὴν τοῦ θεοῦ δίκην
  choice: dem Gericht Gottes
  alternative: der Gerechtigkeit Gottes; Gottes Vergeltung
  rationale: Der Ausdruck kann sowohl Gottes Gerechtigkeit als solche als auch sein konkretes richterliches und vergeltendes Eingreifen bezeichnen. „Gericht Gottes“ hält diese theologische Spannung offen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Formulierung ist gut verständlich, bewahrt den fortdauernden Charakter der beiden Verben und vermeidet sowohl unnötige Kirchensprache als auch eine Festlegung von δίκη allein auf „Gerechtigkeit“ oder „Vergeltung“.
