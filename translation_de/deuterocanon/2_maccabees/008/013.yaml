  terminology: „Gericht Gottes“ ist für δίκη eine tragfähige, nicht konfessionell verengende Wahl. Es lässt sowohl Gottes gerechtes Urteil als auch sein konkretes richterliches Eingreifen offen. Die Fußnote soll die mögliche Exilnuance erläutern, ohne sie zur Hauptaussage zu machen.
