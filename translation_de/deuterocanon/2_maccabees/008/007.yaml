  text: He especially took the nights as allies for such attacks[b][a], and the report of his valor spread everywhere.
translation:
  language: de
  text: Besonders die Nächte nahm er sich für solche Angriffe zu Verbündeten[a], und die Kunde von seiner Tapferkeit verbreitete sich überall.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Besonders die Nächte nahm er sich für solche Angriffe zu Verbündeten.“ Das Griechische stellt die Nächte bildhaft als seine Mitstreiter dar.'
