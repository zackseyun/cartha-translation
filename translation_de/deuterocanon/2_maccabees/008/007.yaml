    reason: textual_variant
lexical_decisions:
- source_word: μάλιστα
  choice: besonders
  rationale: Gibt die Hervorhebung des griechischen Adverbs in natürlichem, modernem Deutsch wieder.
- source_word: τὰς νύκτας ... συνεργοὺς ἐλάμβανεν
  choice: die Nächte nahm er sich ... zu Verbündeten
  rationale: Bewahrt die auffällige griechische Metapher, nach der die Nächte bei seinen militärischen Unternehmungen als Mitstreiter dienen.
- source_word: πρὸς τὰς τοιαύτας ἐπιβολάς
  choice: bei solchen Angriffen
  rationale: ἐπιβολαί bezeichnet hier feindliche Unternehmungen oder Überfälle; „Angriffe“ ist klar und kontextgerecht.
- source_word: ἡ ἁλὴ τῆς εὐανδρείας αὐτοῦ
  choice: die Kunde von seiner Tapferkeit
  rationale: Die ungewöhnliche überlieferte Wendung scheint die sich ausbreitende Nachricht beziehungsweise den Ruf seiner kriegerischen Tüchtigkeit zu bezeichnen; „Kunde“ wahrt den Bezug auf das Bekanntwerden, ohne den schwierigen Ausdruck zu überpräzisieren.
- source_word: διηχεῖτο πανταχῇ
  choice: verbreitete sich überall
  rationale: Gibt den Gedanken des überall Hindurchtönens beziehungsweise weithin Bekanntwerdens idiomatisch wieder.
