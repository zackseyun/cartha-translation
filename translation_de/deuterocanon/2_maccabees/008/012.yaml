  yaml_path: translation/deuterocanon/2_maccabees/008/012.yaml
  text: But news of Nicanor’s advance came to Judas[a]; and when he had shared with those with him the presence of the army camp[b],
translation:
  language: de
  text: Judas aber erfuhr von Nikanors Vormarsch[a]. Als er seinen Begleitern mitgeteilt hatte, dass das Heer da war[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „von Nikanors Angriff“. Das griechische Wort kann einen Vormarsch, Angriff oder Ansturm bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „dass das Heer eingetroffen war“ oder „dass das Heerlager in der Nähe war“. Die knappe griechische Wendung kann sich auf die Ankunft oder die Anwesenheit des Heeres beziehungsweise seines Lagers beziehen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσέπεσεν περὶ
  choice: erfuhr von
  rationale: Die Wendung bezeichnet hier idiomatisch, dass Judas eine Nachricht erreichte. „Erfuhr von“ gibt diesen Informationsvorgang im Deutschen natürlich wieder.
- source_word: τῆς τοῦ Νικάνορος ἐφόδου
  choice: Nikanors Vormarsch
  rationale: ἐφόδος kann einen Vormarsch, Angriff oder Ansturm bezeichnen. Da der eigentliche Kampf erst anschließend erzählt wird, wahrt „Vormarsch“ die feindliche Bewegung, ohne einen bereits begonnenen Angriff vorauszusetzen.
- source_word: μεταδόντος
  choice: mitgeteilt hatte
  rationale: Das Partizip bezeichnet, dass Judas die erhaltene Information an seine Begleiter weitergab; „mitgeteilt hatte“ ist dafür eine natürliche und präzise deutsche Wiedergabe.
- source_word: τοῖς σὺν αὐτῷ
  choice: seinen Begleitern
  rationale: Die Wendung meint die Menschen, die bei Judas waren. „Seinen Begleitern“ ist knapp und verständlich, ohne ihre Rolle näher festzulegen.
- source_word: τὴν παρουσίαν τοῦ στρατοπέδου
  choice: dass das Heer eingetroffen war
  rationale: παρουσία kann „Anwesenheit“ oder „Ankunft“ bedeuten, στρατόπεδον sowohl „Heerlager“ als auch „Heer“. Die gewählte Formulierung gibt den wahrscheinlich gemeinten Sachverhalt in natürlichem Deutsch wieder und kennzeichnet die verbleibende Mehrdeutigkeit in einer Fußnote.
