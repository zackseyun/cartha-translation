base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/008/036.yaml
  text: And the one who had undertaken to pay tribute to the Romans from the capture of those in Jerusalem kept proclaiming that the Jews had as their defender one who fought for them[a], and that for this reason the Jews were invulnerable[b], because they followed the laws that had been commanded to them.
translation:
  language: de
  text: Und der Mann, der es übernommen hatte, die Abgabe an die Römer aus der Gefangennahme der Bewohner Jerusalems aufzubringen,[a] verkündete, die Juden hätten einen Verteidiger, der für sie kämpfe,[b] und seien deshalb unverwundbar, weil sie die ihnen auferlegten Gesetze befolgten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Gemeint ist, dass die Abgabe aus dem erwarteten Erlös der Gefangennahme der Menschen in Jerusalem bezahlt werden sollte; möglich ist auch: „aus der Gefangenschaft der Bewohner Jerusalems“.'
    reason: lexical_alternative
  - marker: b
    text: Der Verteidiger wird hier nicht ausdrücklich genannt; der Zusammenhang legt nahe, dass Gott für die Juden kämpft.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ ... ἀναδεξάμενος
  choice: der Mann, der es übernommen hatte
  rationale: Das substantivierte Partizip bezeichnet rückblickend Nikanor. „Es übernommen hatte“ gibt die eingegangene Verpflichtung wieder, ohne einen bestimmten Vertragstyp vorauszusetzen.
- source_word: φόρον
  choice: Abgabe
  rationale: „Abgabe“ bezeichnet eine an eine politische Obermacht zu entrichtende Zahlung und klingt im modernen Deutschen natürlicher als das enger oder historisch stärker markierte „Tribut“.
- source_word: ἀπὸ τῆς τῶν ἐν Ἱεροσολύμοις αἰχμαλωσίας
  choice: aus der Gefangennahme der Bewohner Jerusalems
  rationale: 'Die Wendung bezeichnet die erwartete Einnahmequelle: Die Abgabe sollte aus dem Erlös der Gefangennahme beziehungsweise Versklavung der Bewohner aufgebracht werden. Die Übersetzung bewahrt den weiteren Sinn von αἰχμαλωσία, ohne ausdrücklich „Versklavung“ einzutragen.'
- source_word: κατορθώσασθαι
  choice: aufzubringen
  rationale: Das Verb bedeutet grundsätzlich „zustande bringen“ oder „erfolgreich ausführen“. Im finanziellen Zusammenhang gibt „aufbringen“ idiomatisch wieder, dass Nikanor die zugesagte Abgabe beschaffen wollte.
- source_word: κατήγγελλεν
  choice: erklärte nun
  rationale: Das Imperfekt beschreibt Nikanors Äußerung im Fortgang der Erzählung. „Erklärte nun“ ist natürliches Deutsch; eine ausdrücklich wiederholte Verkündigung lässt sich aus dem Imperfekt allein nicht zwingend ableiten.
- source_word: ὑπέρμαχον ἔχειν
  choice: einen Vorkämpfer, der für sie kämpfe
  rationale: ὑπέρμαχος bezeichnet jemanden, der zugunsten anderer kämpft. Die Formulierung hält sowohl den Schutz- als auch den aktiven Kampfgedanken fest.
- source_word: ἀτρώτους
  choice: unverwundbar
  rationale: Das Adjektiv bedeutet „nicht verwundbar“ und passt unmittelbar zum militärischen Zusammenhang.
- source_word: διὰ τὸ ἀκολουθεῖν
  choice: weil sie ... befolgten
  rationale: Die Präposition mit substantiviertem Infinitiv nennt ausdrücklich den Grund.
- source_word: τοῖς ἑαυτῶν προστεταγμένοις νόμοις
  choice: die ihnen auferlegten Gesetze
  rationale: Das passive Perfektpartizip bezeichnet Gesetze, die ihnen verbindlich vorgeschrieben worden waren. „Auferlegt“ bewahrt diese passive und autoritative Nuance.
theological_decisions:
- issue: Identität des Vorkämpfers in ὑπέρμαχον ἔχειν
  choice: Der Vorkämpfer bleibt im Haupttext ungenannt; der Zusammenhang legt Gott nahe.
  alternative: Gott ausdrücklich als ihren Vorkämpfer nennen.
  rationale: Das Griechische nennt den Vorkämpfer nicht ausdrücklich. Die indirekte Formulierung bewahrt diese Offenheit, während die Fußnote die naheliegende kontextuelle Deutung erläutert.
- issue: Zusammenhang zwischen Gesetzestreue und Unverwundbarkeit
  choice: Die von Nikanor ausgesprochene Begründung wird ohne dogmatische Erweiterung wiedergegeben.
  alternative: Die Aussage als allgemeingültige Verheißung göttlichen Schutzes formulieren.
  rationale: Der Vers berichtet Nikanors Schlussfolgerung in einer bestimmten geschichtlichen Lage. Die Übersetzung sollte daraus keine über den Wortlaut hinausgehende allgemeine Lehrformel machen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der lange griechische Satzbau bleibt erkennbar, wird aber durch klare Gliederung und idiomatische Verben („aufbringen“, „befolgen“) lesbar gehalten. Der Konjunktiv in „hätten“ und „kämpfe“ kennzeichnet die berichtete Aussage Nikanors.
