  terminology: „Abgabe“, „Gefangennahme“, „unverwundbar“ und „die ihnen auferlegten Gesetze“ sind sachgerecht. Die Fußnote zum ungenannten Verteidiger soll die kontextuelle Gottesdeutung als naheliegend, nicht als vom griechischen Wortlaut ausdrücklich festgelegt formulieren.
