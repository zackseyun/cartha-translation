  source_fidelity: 'Die Übersetzung gibt den Sinn im Wesentlichen zutreffend wieder: die Küstenstädte werden als potenzielle Käufer angeworben, σώματα bleibt als bewusst verdinglichende Bezeichnung erhalten, und die bevorstehende göttliche δίκη wird als Strafe verstanden. »Körper« ist im heutigen Deutschen für menschliche Personen jedoch deutlich weniger idiomatisch als das hier passende, ebenso bewusst harte »Leiber«. Zudem lässt »die Aufforderung« als konkret Gesandtes den griechisch nur impliziten Nachrichteninhalt unnötig dinghaft wirken.'
