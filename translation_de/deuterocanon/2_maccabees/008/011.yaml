  terminology: »der Allmächtige« ist eine etablierte und treffende Wiedergabe von παντοκράτωρ. »Strafe« ist im Kontext für δίκη gut begründet; die Fußnote erhält die mögliche Nuance »Gerechtigkeit«. Die Fußnote zu σώματα sollte die wörtliche Wiedergabe als »Leiber« nennen und die Deutung als Verkauf in Gefangenschaft vorsichtig formulieren.
