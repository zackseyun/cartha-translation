base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/008/011.yaml
  text: So he immediately sent to the cities along the coast[a], inviting them to buy Jewish bodies, promising to hand over ninety bodies for a talent[b]; but he did not expect the punishment from the Almighty that was about to come upon him.
translation:
  language: de
  text: Sofort sandte er an die Küstenstädte eine Nachricht und forderte dazu auf, jüdische Leiber[a] zu kaufen; er versprach, neunzig Leiber für ein Talent auszuliefern. Dabei rechnete er nicht mit der Strafe[b] des Allmächtigen, die ihm bevorstand.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit »Leiber« bezeichnet der griechische Text Juden, die als verkäufliche Gefangene behandelt werden. Möglich wäre auch »Menschen«; »Sklaven« würde die naheliegende Folgerung ausdrücklich machen.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »mit der Gerechtigkeit des Allmächtigen, die ihm bevorstand«. Das griechische Wort kann sowohl Gerechtigkeit im Vollzug als auch die daraus folgende Strafe bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: παραθαλασσίους πόλεις
  choice: Küstenstädte
  rationale: Die kompakte deutsche Bezeichnung gibt Städte am Meer natürlich und präzise wieder.
- source_word: ἀπέστειλεν προκαλούμενος ἐπʼ ἀγορασμόν
  choice: schickte ... die Aufforderung, ... zu kaufen
  rationale: Das im Griechischen ohne ausdrückliches Objekt gebrauchte »sandte« wird im Deutschen durch die aus dem Partizip hervorgehende »Aufforderung« ergänzt; so bleibt die geschäftliche Anwerbung möglicher Käufer klar.
- source_word: Ἰουδαίων σωμάτων
  choice: jüdische Körper
  rationale: Die wörtliche Wiedergabe bewahrt die schockierende Verdinglichung der Juden als verkäufliche Gefangene. »Menschen« würde sie abschwächen, »Sklaven« die Folgerung ausdrücklich in den Haupttext eintragen.
- source_word: ἐνενήκοντα σώματα ταλάντου παραχωρήσειν
  choice: für ein Talent neunzig Körper auszuliefern
  rationale: Die Formulierung gibt das kommerzielle Tauschverhältnis verständlich wieder und behält das wiederholte »Körper« des Ausgangstextes bei.
- source_word: οὐ προσδεχόμενος
  choice: rechnete ... nicht mit
  rationale: Die Wendung drückt idiomatisch aus, dass er die bevorstehende Folge seines Handelns nicht erwartete oder in Betracht zog.
- source_word: δίκην
  choice: Strafe
  rationale: Im Zusammenhang bezeichnet das Wort die konkrete Folge göttlicher Gerechtigkeit; die ebenfalls mögliche Wiedergabe »Gerechtigkeit« wird in einer Fußnote bewahrt.
- source_word: τοῦ παντοκράτορος
  choice: des Allmächtigen
  rationale: »Der Allmächtige« ist die etablierte, verständliche deutsche Wiedergabe des göttlichen Titels παντοκράτωρ.
- source_word: μέλλουσαν παρακολουθήσειν αὐτῷ
  choice: die ihn bald ereilen sollte
  rationale: Dies gibt sowohl das unmittelbar Bevorstehende als auch das Bild einer ihn einholenden Folge natürlich wieder.
theological_decisions:
- issue: Göttlicher Titel παντοκράτωρ
  choice: der Allmächtige
  alternative: der Allherrscher
  rationale: Die gewählte Form ist im Deutschen als Gottesbezeichnung geläufig und bewahrt den Akzent auf Gottes umfassender Macht, ohne zusätzliche Lehraussagen einzutragen.
- issue: Verdinglichende Bezeichnung σώματα
  choice: jüdische Körper
  alternative: jüdische Menschen; jüdische Sklaven
  rationale: Die wörtliche Form erhält die moralisch aufgeladene Sprache des Erzählers. »Menschen« mildert sie, während »Sklaven« den gemeinten Status deutlicher auslegt, als der Wortlaut selbst es tut.
- issue: Bedeutung von δίκη
  choice: Strafe
  alternative: Gerechtigkeit
  rationale: Der Kontext legt die vollzogene Vergeltung nahe, doch das griechische Wort kann sowohl Gerechtigkeit als auch deren strafende Auswirkung bezeichnen; diese Spannung wird in der Fußnote offengelegt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die brutale Handelssprache des Ausgangstextes bleibt bewusst sichtbar; zugleich wird die knappe griechische Satzfügung für gewöhnliche Leser in zwei deutsche Sätze gegliedert.
