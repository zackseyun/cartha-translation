  yaml_path: translation/deuterocanon/2_maccabees/008/021.yaml
  text: With these words he encouraged them and made them ready to die for the laws and the fatherland[a], and he formed the army into four parts.
translation:
  language: de
  text: Nachdem er ihnen mit diesen Worten Mut gemacht und sie darauf vorbereitet hatte, für die Gesetze und das Vaterland zu sterben, gliederte er das Heer in vier Abteilungen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐφʼ οἷς
  choice: durch diese Worte
  rationale: Die Wendung verweist auf die vorausgehende Ansprache und bezeichnet hier das Mittel, durch das Judas die Männer ermutigte.
- source_word: εὐθαρσεῖς αὐτοὺς παραστήσας
  choice: ihnen Mut gemacht
  rationale: Die Verbindung beschreibt ursächlich, dass Judas die Männer in einen mutigen, zuversichtlichen Zustand versetzte. Die deutsche Formulierung ist natürlich und bewahrt diesen Sinn.
- source_word: ἑτοίμους … ἀποθνήσκειν
  choice: sie bereit gemacht hatte, … zu sterben
  rationale: Die Übersetzung gibt die Bereitschaft zum Sterben ausdrücklich und ungemildert wieder.
- source_word: ὑπὲρ τῶν νόμων καὶ τῆς πατρίδος
  choice: für die Gesetze und das Vaterland
  rationale: „Für“ bezeichnet den Einsatz zugunsten und zur Verteidigung; „Gesetze“ bewahrt den griechischen Plural, und „Vaterland“ erhält das Gewicht der Bindung an das angestammte Land.
- source_word: τετραμερές τι ἐποίησεν τὸ στράτευμα
  choice: gliederte er das Heer in vier Abteilungen
  rationale: Die idiomatische deutsche Fassung beschreibt die Bildung einer vierteiligen Heeresordnung. „Abteilungen“ passt zum militärischen Zusammenhang, während die Fußnote die wörtlichere Möglichkeit festhält.
theological_decisions:
- issue: Wiedergabe von πατρίς im Zusammenhang mit der Treue zu den Gesetzen und zum angestammten Land
  choice: Vaterland
  alternative: Heimat; Heimatland
  rationale: „Vaterland“ bewahrt die rhetorische und gemeinschaftliche Tragweite des griechischen Wortes, ohne über den Text hinaus eine moderne politische Ideologie einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Partizipialkonstruktion des Griechischen bleibt als vorangestellter Nebensatz erkennbar; unnötige altertümliche oder konfessionell geprägte Begriffe werden vermieden.
