  text: having set before their eyes the lawless outrage committed by them against the holy place, and the abuse of the city that had been mocked, and also the overthrow of the ancestral way of life.
translation:
  language: de
  text: 'Sie sollten sich vor Augen halten: den gesetzlosen Frevel, den jene am heiligen Ort verübt hatten, die Misshandlung der verhöhnten Stadt und außerdem die Abschaffung der überlieferten Lebensordnung der Vorfahren.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πρὸ ὀφθαλμῶν λαβόντας
  choice: Sie sollten sich vor Augen halten
  rationale: Gibt das bildhafte Idiom natürlich wieder und wahrt den partizipialen Anschluss an den vorausgehenden Kontext, ohne im Deutschen einen unvollständigen Satz zu erzeugen.
- source_word: ἀνόμως ... ὕβριν
  choice: frevelhaften Übergriff
  rationale: ἀνόμως bezeichnet das gesetz- bzw. rechtswidrige Handeln; ὕβρις meint hier eine entehrende, gewaltsame Anmaßung. „Frevelhaft“ und „Übergriff“ bündeln beide Aspekte.
- source_word: εἰς τὸν ἅγιον τόπον
  choice: gegen den heiligen Ort
  rationale: Bewahrt die Zielrichtung von εἰς und vermeidet eine vorschnelle Präzisierung als Tempel oder Heiligtum.
- source_word: τὴν τῆς ἐμπεπαιγμένης πόλεως αἰκισμόν
  choice: wie die verhöhnte Stadt misshandelt ... worden war
  rationale: ἐμπαίζω bezeichnet das Verhöhnen, αἰκισμός schwere Misshandlung oder Schändung. Die deutsche Verbalkonstruktion ist idiomatischer als eine Häufung abstrakter Substantive.
- source_word: προγονικῆς πολιτείας
  choice: überlieferte Lebensordnung ihrer Vorfahren
  rationale: πολιτεία kann Lebensweise, gesellschaftliche Ordnung oder Verfassung bezeichnen. Die Wiedergabe hält diese soziale und religiös-kulturelle Weite offen.
- source_word: κατάλυσιν
  choice: beseitigt worden war
  rationale: Drückt die Aufhebung bzw. Zerstörung der angestammten Ordnung klar aus, ohne ausschließlich politischen Umsturz zu suggerieren.
theological_decisions:
- issue: Bedeutungsumfang von προγονικῆς πολιτείας
  choice: überlieferte Lebensordnung ihrer Vorfahren
  alternative: Verfassung der Vorfahren / angestammte Lebensweise
  rationale: Die gewählte Formulierung umfasst sowohl religiös-kulturelle Lebensführung als auch gemeinschaftliche Ordnung und legt den Ausdruck nicht einseitig politisch aus.
- issue: Referenz von τὸν ἅγιον τόπον
  choice: der heilige Ort
  alternative: das Heiligtum / der Tempel
  rationale: Die quellennähere Bezeichnung bewahrt die Ausdrucksweise des griechischen Textes und vermeidet eine unnötige interpretierende Festlegung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz ist als inhaltlich abhängige Aufforderung formuliert, weil das griechische Akkusativpartizip syntaktisch an den vorangehenden Vers anschließt. Die drei Erinnerungsmotive bleiben parallel erkennbar; schwerfällige Nominalketten werden teilweise verbal aufgelöst.
