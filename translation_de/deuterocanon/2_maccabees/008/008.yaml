  footnotes:
  - marker: a
    text: Gemeint ist Judas Makkabäus, von dem im Zusammenhang die Rede ist.
    reason: cross_reference
  - marker: b
    text: 'Oder: „den Interessen des Königs“ beziehungsweise „den Angelegenheiten des Königs“. Die griechische Wendung kann die königliche Sache umfassender bezeichnen als eine einzelne militärische Unternehmung.'
