  text: But when Philip saw that the man was gradually making progress and advancing all the more often in successes, he wrote to Ptolemy, the governor of Coele-Syria and Phoenicia, to come to the aid of the king’s cause.
translation:
  language: de
  text: Als Philippus aber sah, dass der Mann[a] nach und nach vorankam und immer häufiger Erfolge erzielte, schrieb er an Ptolemäus, den Statthalter von Koilesyrien und Phönizien, er solle der Sache des Königs[b] beistehen.
