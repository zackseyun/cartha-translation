lexical_decisions:
- source_word: Συνιδὼν
  choice: als ... sah
  rationale: Das Partizip bezeichnet die Wahrnehmung, die Philippus zum Handeln veranlasst; die temporale Wiedergabe ist im Deutschen natürlich und bewahrt den Zusammenhang.
- source_word: κατὰ μικρὸν
  choice: nach und nach
  rationale: Die Wendung bezeichnet eine schrittweise Entwicklung und wird idiomatisch, aber quellennah wiedergegeben.
- source_word: εἰς προκοπὴν ἐρχόμενον
  choice: vorankam
  rationale: Die Formulierung beschreibt zunehmenden Fortschritt, ohne den Sinn unnötig auf materielles Wohlergehen festzulegen.
- source_word: τὸν ἄνδρα
  choice: der Mann
  rationale: Die ausdrückliche griechische Bezeichnung bleibt erhalten; der Bezug auf Judas wird in einer Fußnote erläutert.
- source_word: πυκνότερον
  choice: immer häufiger
  rationale: Der Komparativ kann eine zunehmende Häufigkeit oder Verdichtung ausdrücken; im Zusammenhang wiederholter günstiger Entwicklungen ist „immer häufiger“ eine plausible, die Vergleichskraft wahrende Wiedergabe.
- source_word: ἐν ταῖς εὐημερίαις προβαίνοντα
  choice: Erfolge erzielte
  rationale: Die pluralischen εὐημερίαι bezeichnen günstige Ausgänge oder Erfolge. Die idiomatische deutsche Wendung gibt das weitere erfolgreiche Voranschreiten verständlich wieder, ohne wirtschaftlichen Wohlstand anzudeuten.
- source_word: στρατηγὸν
  choice: Statthalter
  rationale: Hier bezeichnet der Titel Ptolemäus’ amtliche Zuständigkeit für Koilesyrien und Phönizien; „Statthalter“ umfasst die administrative und militärische Funktion.
- source_word: ἐπιβοηθεῖν
  choice: zu Hilfe kommen
  rationale: Das Verb bezeichnet ein unterstützendes Herbeikommen und behält damit gegenüber einem bloßen „helfen“ seine gerichtete Nuance.
- source_word: τοῖς τοῦ βασιλέως πράγματι
  choice: der Sache des Königs
  rationale: Die griechische Wendung kann die Angelegenheiten, Interessen oder Sache des Königs im weiteren politisch-militärischen Sinn bezeichnen; „Sache“ lässt diese Breite bestehen.
