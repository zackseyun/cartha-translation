  text: After carefully stripping them of their arms[a], they put everything in the proper places, but they carried the rest of the spoils to Jerusalem.
translation:
  language: de
  text: Nachdem sie ihnen sorgfältig die Waffen abgenommen hatten[a], legten sie alles an geeigneten Orten ab; den Rest der Beute aber brachten sie nach Jerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Nachdem sie sorgfältig deren Waffen eingesammelt hatten.“ Das griechische Partizip kann entweder das Entwaffnen der Besiegten oder das Einsammeln ihrer Waffen hervorheben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁπλολογήσαντες
  choice: nachdem sie ihnen … die Waffen abgenommen hatten
  rationale: Das Partizip bezeichnet hier das Abnehmen beziehungsweise Einsammeln der Waffen der Besiegten. Der Personenbezug αὐτούς wird mit „ihnen“ gewahrt; die alternative Akzentuierung wird in der Fußnote genannt.
- source_word: ἐπιμελῶς
  choice: sorgfältig
  rationale: Gibt die aufmerksame und gewissenhafte Art des Vorgehens in natürlichem modernem Deutsch wieder.
- source_word: πάντα συνέθηκαν
  choice: legten sie alles … ab
  rationale: συντίθημι bezeichnet hier das geordnete Niederlegen beziehungsweise Unterbringen. „Ablegen“ bleibt näher an der konkreten Handlung als eine ausdrücklichere Deutung wie „einlagern“.
- source_word: εἰς τοὺς ἐπικαίρους τόπους
  choice: an geeigneten Orten
  rationale: ἐπίκαιρος bedeutet im Kontext passend oder zweckmäßig. „Geeignet“ wahrt diesen Sinn, ohne die Orte unnötig als strategisch oder als feste Lagerstätten festzulegen.
- source_word: τὰ δὲ λοιπὰ τῶν σκύλων
  choice: den Rest der Beute aber
  rationale: σκῦλα bezeichnet Kriegsbeute; λοιπά hebt den verbleibenden Teil gegenüber dem zuvor abgelegten Gut hervor.
- source_word: ἤνεγκαν εἰς Ἰεροσόλυμα
  choice: brachten sie nach Jerusalem
  rationale: Die Aoristform von φέρω bezeichnet den Transport nach Jerusalem. „Brachten“ ist im Deutschen idiomatisch und konkret.
