  yaml_path: translation/deuterocanon/2_maccabees/008/019.yaml
  text: And he also recounted to them the help that had come to their forefathers[a], and the one against Sennacherib[b], how a hundred eighty-five thousand were destroyed.
translation:
  language: de
  text: Außerdem rief er ihnen die Hilfen in Erinnerung, die ihre Vorfahren erfahren hatten, und die Hilfe gegen Sanherib, wie 185.000 umkamen.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Rettungstaten“. Das griechische Wort kann Hilfe, Beistand oder rettendes Eingreifen bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Gemeint ist der Untergang des Heeres Sanheribs zur Zeit Hiskias; siehe 2. Könige 19,35 und Jesaja 37,36.
    reason: cross_reference
lexical_decisions:
- source_word: προσαναλεξάμενος
  choice: rief … in Erinnerung
  rationale: Das Partizip beschreibt, wie Judas frühere Ereignisse vor seinen Männern nochmals zur Sprache bringt. Die Wendung ist im heutigen Deutsch natürlich und bewahrt den erinnernden, berichtenden Sinn.
- source_word: ἀντιλήμψεις
  choice: Hilfen
  rationale: Das Substantiv bezeichnet Beistand oder Hilfe in einer Notlage. „Hilfen“ bleibt bewusst breit; „Rettungstaten“ wäre möglich, würde den rettenden Ausgang aber stärker hervorheben.
- source_word: ἐπὶ τῶν προγόνων γενομένας
  choice: die ihre Vorfahren erfahren hatten
  rationale: Die Formulierung gibt wieder, dass sich diese Hilfen bei beziehungsweise zugunsten der Vorfahren ereigneten, ohne die im griechischen Satz nicht ausdrücklich genannte handelnde Person hinzuzufügen.
- source_word: τὴν ἐπὶ Σεναχηρεὶμ
  choice: die Hilfe gegen Sanherib
  rationale: Der Artikel nimmt elliptisch das vorausgehende Wort „Hilfen“ wieder auf. Die ausdrückliche Wiederholung von „Hilfe“ ist im Deutschen klarer als eine ebenso elliptische Wiedergabe.
- source_word: ἑκατὸν ὀγδοήκοντα πέντε χιλιάδες
  choice: '185.000'
  rationale: Die Ziffernschreibung gibt die Zahl knapp und eindeutig wieder. Wie im Griechischen wird kein Bezugswort wie „Mann“ oder „Soldaten“ ergänzt.
- source_word: ὡς ἀπώλοντο
  choice: wie … umkamen
  rationale: ὡς leitet den Inhalt der Erinnerung ein. „Umkamen“ wahrt die im Verb liegende Aussage des Untergangs, ohne eine im Satz nicht ausdrücklich genannte handelnde Instanz einzusetzen.
theological_decisions:
- issue: Nur vorausgesetztes göttliches Handeln bei der Hilfe für die Vorfahren und beim Untergang von Sanheribs Heer
  choice: Gott wird im Haupttext nicht ausdrücklich als Handelnder ergänzt.
  alternative: „die Hilfe, die Gott ihren Vorfahren erwiesen hatte“ beziehungsweise „wie Gott 185.000 vernichtete“
  rationale: Der Zusammenhang spielt auf bekannte Überlieferungen göttlicher Rettung an. In diesem griechischen Satz wird Gott jedoch nicht ausdrücklich genannt; die Übersetzung bewahrt daher die Anspielung, ohne die vorausgesetzte Urheberschaft sprachlich auszuschreiben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Rief … in Erinnerung“ ist allgemein verständlich; die Wiederholung „die Hilfe“ löst die griechische Ellipse behutsam auf. Der Doppelpunkt erhält die enge Verbindung zwischen dem Fall Sanheribs und der Zahl der Umgekommenen.
