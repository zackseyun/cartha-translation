base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/008/020.yaml
  text: 'And the engagement in Babylonia against the Galatians had gone this way: when all who came to the need were eight thousand[a], together with four thousand Macedonians, and the Macedonians were at a loss, the six thousand destroyed the one hundred twenty thousand because of the help coming to them from heaven, and they received great advantage.'
translation:
  language: de
  text: 'Auch die Schlacht in Babylonien gegen die Galater[a] verlief folgendermaßen: Alle, die wegen der Notlage herbeigekommen waren, waren achttausend, zusammen mit viertausend Makedonen. Als die Makedonen keinen Ausweg mehr wussten, vernichteten die sechstausend die hundertzwanzigtausend, weil ihnen Hilfe vom Himmel zuteilwurde, und sie erlangten einen großen Vorteil.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Gallier“. Die griechische Volksbezeichnung kann je nach Betonung die Galater Kleinasiens oder ihre weiter gefasste keltische Identität bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: παράταξιν
  choice: Schlacht
  rationale: Das Wort bezeichnet hier eine militärische Aufstellung beziehungsweise das daraus entstehende Gefecht; „Schlacht“ gibt den Zusammenhang natürlich und prägnant wieder.
- source_word: Γαλάτας
  choice: Galater
  rationale: „Galater“ entspricht der griechischen Volksbezeichnung direkt; die mögliche Wiedergabe „Gallier“ bleibt in der Fußnote erhalten.
- source_word: ἐπὶ τὴν χρείαν ἦλθον
  choice: in der Notlage herbeikamen
  rationale: Die Wendung bezeichnet das Herbeikommen angesichts einer dringenden Not oder Krise, ohne ausdrücklich festzulegen, wem Hilfe geleistet wurde.
- source_word: ἀπορουμένων
  choice: keinen Ausweg mehr wussten
  rationale: Das Partizip beschreibt Ratlosigkeit beziehungsweise eine ausweglose Lage und lässt sowohl den praktischen als auch den inneren Aspekt erkennen.
- source_word: ἀπώλεσαν
  choice: vernichteten
  rationale: Das Verb bedeutet, zugrunde zu richten oder zu vernichten; im militärischen Zusammenhang ist diese kraftvolle, aber nicht unnötig spezifizierende Wiedergabe angemessen.
- source_word: δώδεκα μυριάδας
  choice: die hundertzwanzigtausend
  rationale: Die zwölf Zehntausendschaften werden für heutige Leser als Zahl wiedergegeben, wobei die auffällige Größenangabe des griechischen Textes unverändert bleibt.
- source_word: διὰ τὴν γινομένην αὐτοῖς ἀπʼ οὐρανοῦ βοήθειαν
  choice: weil ihnen Hilfe vom Himmel zuteilwurde
  rationale: Die Formulierung bewahrt sowohl die kausale Aussage als auch die ehrfürchtige Umschreibung „vom Himmel“, ohne Gott ausdrücklich einzusetzen, wo der griechische Text dies nicht tut.
- source_word: ὠφέλειαν πολλὴν ἔλαβον
  choice: sie erlangten einen großen Vorteil
  rationale: ὠφέλεια kann Nutzen, Gewinn oder Vorteil bezeichnen. „Großen Vorteil“ hält den Sinn offen und legt ihn nicht speziell auf Beute oder strategischen Gewinn fest.
theological_decisions:
- issue: Bezug der „Hilfe vom Himmel“
  choice: Die ehrfürchtige Umschreibung für göttliche Hilfe wird wörtlich als „Hilfe vom Himmel“ bewahrt.
  alternative: Die Wendung ausdrücklich als „Gottes Hilfe“ wiederzugeben oder nur allgemein als glückliche Fügung zu verstehen.
  rationale: Im jüdisch-griechischen Sprachgebrauch verweist „vom Himmel“ häufig zurückhaltend auf Gottes Eingreifen. Die Übersetzung wahrt diese theologische Aussage und zugleich die sprachliche Zurückhaltung des Ausgangstextes.
- issue: Spannung zwischen den Truppenzahlen
  choice: Die Angaben achttausend, viertausend und sechstausend werden ohne harmonisierende Erklärung wiedergegeben.
  alternative: Die Zahlen rechnerisch anzugleichen oder durch erläuternde Zusätze miteinander zu versöhnen.
  rationale: Der griechische Text enthält diese auffällige Abfolge. Eine Übersetzung darf die überlieferte Spannung nicht stillschweigend auflösen.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Der Satzbau wurde zur besseren Verständlichkeit in zwei Sätze gegliedert; die erzählerische Einleitung, die Zahlenfolge und die zurückhaltende Rede von himmlischer Hilfe bleiben erhalten.
