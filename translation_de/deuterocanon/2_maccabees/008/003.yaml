  text: and to have mercy also on the city that was being destroyed and was about to be leveled to the ground[a], and to hear the blood crying out to him[b];
translation:
  language: de
  text: und sich auch der Stadt zu erbarmen, die verwüstet wird und kurz davorsteht, dem Erdboden gleich zu werden, und das Blut[a] zu hören, das zu ihm schreit[b];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Griechischen steht hier der Plural „der Blute“. Er kann vielfach vergossenes Blut oder die Schwere der Blutschuld hervorheben.
    reason: lexical_alternative
  - marker: b
    text: Das Bild vom Blut, das zu Gott schreit, kann an das biblische Motiv erinnern, dass unschuldig vergossenes Blut zu Gott ruft.
    reason: cross_reference
lexical_decisions:
- source_word: ἐλεῆσαι
  choice: sich … zu erbarmen
  rationale: Der Aoristinfinitiv führt den Inhalt des Gebets aus dem vorherigen Zusammenhang fort. „Sich erbarmen“ bewahrt den starken Sinn göttlichen Erbarmens und passt zum gehobenen, aber gegenwärtigen Bibeldeutsch.
- source_word: καταφθειρομένην
  choice: die verwüstet wird
  rationale: Das Präsenspartizip bezeichnet die fortschreitende Zerstörung der Stadt. „Verwüstet wird“ gibt den laufenden Vorgang natürlich wieder, ohne die Art der Zerstörung näher festzulegen.
- source_word: πόλιν
  choice: der Stadt
  rationale: Die allgemeine Bezeichnung des griechischen Textes bleibt erhalten; Jerusalem wird nicht ausdrücklich eingesetzt.
- source_word: μέλλουσαν ἰσόπεδον γίνεσθαι
  choice: kurz davorsteht, dem Erdboden gleichgemacht zu werden
  rationale: μέλλουσαν drückt das unmittelbar Bevorstehende aus; ἰσόπεδον γίνεσθαι bezeichnet das Einebnen bis auf Bodenniveau. Die deutsche Formulierung ist idiomatisch und bewahrt den passivischen Sinn.
- source_word: τῶν … αἱμάτων
  choice: das Blut
  rationale: Obwohl im Griechischen der Plural „Blute“ steht, verwendet das Deutsche in diesem Bild gewöhnlich den Kollektivsingular „Blut“. Eine Fußnote hält die auffällige griechische Form fest.
- source_word: καταβοώντων πρὸς αὐτόν
  choice: das zu ihm schreit
  rationale: Die konkrete Personifikation des Blutes bleibt erhalten. Das Präsens „schreit“ entspricht dem griechischen Präsenspartizip und lässt die mögliche biblische Anspielung offen.
- source_word: εἰσακοῦσαι
  choice: zu hören
  rationale: Das Verb kann im Gebetszusammenhang auch ein erhörendes oder gnädiges Hören meinen. „Hören“ ist unmittelbar und legt diese theologische Nuance nicht einseitig fest.
theological_decisions:
- issue: Mögliche Anspielung des zu Gott schreienden Blutes
  choice: Das konkrete Bild „das Blut …, das zu ihm schreit“ bleibt im Haupttext stehen.
  alternative: „das Blut der Getöteten zu hören, das nach Vergeltung schreit“
  rationale: Der griechische Text nennt weder ausdrücklich die Getöteten noch Vergeltung oder Gericht. Die unverstärkte Metapher bewahrt die biblische Resonanz und die theologische Offenheit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die infinitivische Satzfortsetzung bildet die Syntax des vorangehenden Gebets ab. Präsensformen geben die griechischen Präsenspartizipien als laufende Vorgänge wieder; die Personifikation des Blutes bleibt bewusst unaufgelöst.
