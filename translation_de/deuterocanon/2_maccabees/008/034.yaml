  yaml_path: translation/deuterocanon/2_maccabees/008/034.yaml
  text: But Nikanor[a], that utterly defiled man, who had brought three thousand merchants for the sale of the Jews,
translation:
  language: de
  text: Der durch und durch ruchlose Nikanor[a] aber, der dreitausend Händler für den Verkauf der Juden herbeigebracht hatte,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „der dreimal verfluchte Nikanor“ oder „der durch und durch verworfene Nikanor“. Das seltene griechische Wort ist eine äußerst scharfe Schmähung; das Element „dreimal-“ dient wahrscheinlich der Verstärkung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τρισαλιτήριος
  choice: durch und durch ruchlos
  rationale: Das seltene, stark abwertende Adjektiv bezeichnet einen sündigen, fluchwürdigen oder verwerflichen Menschen; das Präfix τρισ- verstärkt die Aussage. „Durch und durch ruchlos“ gibt diese Intensität in natürlichem, würdigem Deutsch wieder, ohne die seltene Bildung vorschnell auf eine einzige Nuance festzulegen.
- source_word: Νικάνωρ
  choice: Nikanor
  rationale: Die Schreibung folgt der griechischen Namensform unmittelbar und entspricht einer im Deutschen geläufigen Transliteration.
- source_word: τρισχιλίους ἐμπόρους
  choice: dreitausend Händler
  rationale: Die Zahl und die Bezeichnung kommerzieller Käufer werden direkt wiedergegeben.
- source_word: ἐπὶ τὴν πρᾶσιν τῶν Ἰουδαίων
  choice: für den Verkauf der Juden
  rationale: 'Die Präpositionalphrase bezeichnet den Zweck ihres Herbeibringens: Die Händler sollten die als Gefangene erwarteten Juden kaufen.'
- source_word: ἀγαγών
  choice: herbeigebracht hatte
  rationale: Das Aoristpartizip beschreibt eine vorausliegende Handlung Nikanors; das Plusquamperfekt gibt dieses zeitliche Verhältnis im Deutschen klar wieder.
theological_decisions:
- issue: Wiedergabe der seltenen Schmähbezeichnung τρισαλιτήριος
  choice: durch und durch ruchlos
  alternative: dreimal verflucht; höchst frevelhaft; durch und durch verworfen
  rationale: Der Ausdruck trägt eine starke moralisch-religiöse Verurteilung, bleibt aber lexikalisch selten und mehrdeutig. Die Hauptübersetzung bewahrt die Schärfe, während die Fußnote die wörtlichere, fluchbezogene Möglichkeit offenhält.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Satzform bleibt als Nebensatzgefüge mit abschließendem Komma offen, weil der vorgelegte griechische Text nur den Anfang des vollständigen Satzes enthält.
