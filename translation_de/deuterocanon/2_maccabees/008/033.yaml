base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/008/033.yaml
  text: And while they were celebrating the victory in their homeland[a], they burned those who had set fire to the sacred gates, including Kallisthenes, who had fled into a certain house for shelter; and he received the reward worthy of his ungodliness.
translation:
  language: de
  text: Während sie in ihrer Heimat den Sieg feierten, verbrannten sie diejenigen, die die heiligen Tore in Brand gesteckt hatten, und Kallisthenes, der sich in eine Unterkunft geflüchtet hatte[a]. Und er erhielt den Lohn, den seine Gottlosigkeit verdiente.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der sich in ein Wohnhaus geflüchtet hatte“. Das seltene griechische Wort ἐνοίκιον bezeichnet hier offenbar einen Wohn- oder Zufluchtsort; die genaue Art des Ortes ist ungewiss.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπινίκια ... ἄγοντες
  choice: während sie ... den Sieg feierten
  rationale: Die griechische Wendung bezeichnet das Abhalten einer Siegesfeier; die gewählte Formulierung ist natürlich und bewahrt den festlichen Sinn.
- source_word: ἐν τῇ πατρίδι
  choice: in ihrer Heimat
  rationale: πατρίς bezeichnet das eigene Heimatland; „Heimat“ ist im Deutschen idiomatisch und vermeidet das heute markierte „Vaterland“.
- source_word: τοὺς ἐμπρήσαντας τοὺς ἱεροὺς πυλῶνας
  choice: diejenigen, die die heiligen Tore in Brand gesteckt hatten
  rationale: Die Formulierung gibt die vollendete Brandstiftung wieder und bewahrt mit „heilig“ die kultische Bedeutung von ἱερούς, ohne die Architektur näher zu bestimmen.
- source_word: Καλλισθένην
  choice: Kallisthenes
  rationale: Direkte, im Deutschen gut lesbare Transliteration des griechischen Namens.
- source_word: ὑφήψαν
  choice: verbrannten sie
  rationale: Das Verb bezeichnet das Anzünden beziehungsweise Inbrandsetzen; im Kontext schließt es die tödliche Verbrennung der Betroffenen ein.
- source_word: εἰς ἐνοίκιον πεφευγότα
  choice: der sich in ein Wohnhaus geflüchtet hatte
  rationale: πεφευγότα drückt die Flucht an einen Zufluchtsort aus. Das seltene ἐνοίκιον wird vorsichtig als Wohngebäude wiedergegeben; die Unsicherheit wird in einer Fußnote kenntlich gemacht.
- source_word: τὸν ἄξιον ... μισθόν
  choice: den Lohn, den ... verdiente
  rationale: μισθός bedeutet Lohn oder Vergeltung. Die deutsche Wendung erhält den ironischen Gedanken einer angemessenen Vergeltung.
- source_word: δυσσεβείας
  choice: Gottlosigkeit
  rationale: Das Wort bezeichnet religiös-sittliche Frevelhaftigkeit beziehungsweise mangelnde Ehrfurcht vor dem Heiligen; „Gottlosigkeit“ ist verständlich und bewahrt das religiöse Urteil.
theological_decisions:
- issue: Kultische Bedeutung von ἱεροὺς πυλῶνας
  choice: heilige Tore
  alternative: Tempeltore; geheiligte Tore
  rationale: „Heilige Tore“ bewahrt ihre Zugehörigkeit zum sakralen Bereich, ohne über den griechischen Wortlaut hinaus eine bestimmte architektonische Zuordnung festzulegen.
- issue: Religiös-moralischer Sinn von δυσσεβείας
  choice: Gottlosigkeit
  alternative: Frevel; Ruchlosigkeit
  rationale: Die Übersetzung gibt die ausdrückliche religiöse Verurteilung wieder, ohne eine konfessionelle Deutung hinzuzufügen.
- issue: Bezug des abschließenden Singulars ἐκόμισατο
  choice: So erhielt er
  alternative: und er erhielt
  rationale: Der Singular bezieht sich am naheliegendsten auf den unmittelbar zuvor genannten Kallisthenes. „So“ macht die Folgerung lesbar, ohne den Vergeltungsgedanken zu verstärken.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Erzählung bleibt knapp und direkt; der kultische und moralische Wortlaut wird bewahrt. Die ungewöhnliche Ortsangabe wird nicht überpräzisiert, sondern durch eine Fußnote als unsicher ausgewiesen.
