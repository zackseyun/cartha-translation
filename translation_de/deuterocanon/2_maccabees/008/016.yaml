  text: Then Maccabeus[a], after gathering those with him, about six thousand in number, urged them not to be terrified by the enemy, nor to fear the great multitude of the nations that had come against them unjustly, but to fight bravely,
translation:
  language: de
  text: Nachdem Makkabäus die, die bei ihm waren – insgesamt sechstausend –, versammelt hatte, ermutigte er sie, sich von den Feinden[a] nicht in Schrecken versetzen zu lassen und sich nicht vor der großen Menge der Völker zu fürchten, die zu Unrecht gegen sie herangezogen waren, sondern mutig zu kämpfen.
