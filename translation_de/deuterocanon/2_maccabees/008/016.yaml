    text: 'Griechisch: „von den Gefangenen“ oder „von den Gefesselten“. Der Wortlaut ist hier schwierig; der Zusammenhang deutet auf feindliche Streitkräfte, daher steht im Haupttext „von den Feinden“.'
    reason: Lexikalische Alternative und schwieriger Ausgangstext
lexical_decisions:
- source_word: Συναγαγών
  choice: Nachdem … versammelt hatte
  rationale: Das Aoristpartizip bezeichnet eine Handlung, die der Aufforderung vorausgeht; die temporale Nebensatzkonstruktion gibt diese Abfolge in natürlichem Deutsch wieder.
- source_word: τοὺς περὶ αὐτὸν ὄντας
  choice: die bei ihm waren
  rationale: Die Formulierung bleibt nahe bei der griechischen Wendung und vermeidet die stärker deutende Ergänzung „seine Männer“.
- source_word: ἀριθμὸν ἑξακισχιλίους
  choice: insgesamt sechstausend
  rationale: Die Wendung gibt die zahlenmäßige Stärke an. Anders als die englische Konsultationsfassung enthält der griechische Text kein ausdrückliches Näherungssignal; daher steht keine Entsprechung für „about“.
- source_word: παρεκάλει
  choice: ermahnte
  rationale: Im Zusammenhang einer Ansprache vor dem Kampf bezeichnet das Verb eindringliches Zureden und Ermutigen.
- source_word: μὴ καταπλαγῆναι
  choice: sich … nicht in Schrecken versetzen zu lassen
  rationale: Die Wendung bewahrt den Gedanken, von Furcht überwältigt oder in Bestürzung versetzt zu werden.
- source_word: τοῖς δεσμίοις
  choice: von den Feinden
  rationale: Der gewöhnliche Wortsinn lautet „Gefangene“ oder „Fesseln tragende Menschen“, passt hier jedoch nur schwer zum militärischen Zusammenhang. „Feinde“ gibt den im Kontext naheliegenden Bezug wieder; die Textschwierigkeit wird in einer Fußnote offengelegt.
- source_word: μηδὲ εὐλαβεῖσθαι
  choice: und sich auch nicht … zu fürchten
  rationale: Das Verb bezeichnet hier furchtsame Scheu oder Besorgnis; die Wiedergabe unterscheidet sich sprachlich von der stärkeren vorhergehenden Aussage über Schrecken.
- source_word: τὴν … πολυπληθείαν
  choice: vor der großen Menge
  rationale: Die Übersetzung bewahrt den Nachdruck auf der zahlenmäßigen Überlegenheit.
- source_word: τῶν … ἐθνῶν
  choice: der Völker
  rationale: „Völker“ erhält den ethnisch-politischen Sinn, ohne den Begriff durch eine spätere fachtheologische Verwendung von „Heiden“ einzuengen.
- source_word: ἀδίκως παραγενομένων ἐπʼ αὐτούς
  choice: die zu Unrecht gegen sie herangezogen waren
  rationale: Die Formulierung gibt sowohl die feindliche Bewegung gegen sie als auch deren ausdrücklich als ungerecht bezeichneten Charakter wieder.
- source_word: ἀγωνίσασθαι γενναίως
  choice: mutig zu kämpfen
  rationale: Im militärischen Kontext bedeutet ἀγωνίζομαι kämpfen; γενναίως hebt dabei den Mut beziehungsweise die Tapferkeit hervor.
theological_decisions:
- issue: Wiedergabe von ἐθνῶν im jüdisch-hellenistischen Kriegskontext
  choice: Völker
  alternative: Heiden; Nationen
  rationale: „Völker“ lässt den ethnischen und politischen Bezug auf die fremden Gegner erkennen, ohne eine spätere christlich-theologische Fachbedeutung einzutragen.
- issue: Umgang mit dem schwierigen Ausdruck δεσμίοις
  choice: Feinde im Haupttext, wörtliche Bedeutungen in der Fußnote
  alternative: Gefangene; Gefesselte
  rationale: Die üblichen lexikalischen Bedeutungen ergeben in dieser Ermahnung vor dem Kampf einen schwer verständlichen Sinn. Der Zusammenhang verweist auf die gegnerischen Streitkräfte; die Fußnote erhält die echte textliche Schwierigkeit, statt sie zu verschweigen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Partizipialstruktur wurde für gute Verständlichkeit als temporaler Nebensatz wiedergegeben. Der Kontrast zwischen lähmendem Schrecken, Furcht vor der Übermacht und mutigem Kampf bleibt erhalten.
