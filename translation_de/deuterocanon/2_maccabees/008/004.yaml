  text: and also to remember the lawless destruction of the innocent infants[a], and the blasphemies committed against his name[b], and to hate evil.
translation:
  language: de
  text: und sich auch an die gesetzwidrige Vernichtung der unschuldigen Kleinkinder[a] zu erinnern, an die Lästerungen, die gegen seinen Namen verübt wurden, und das Böse zu hassen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der sündlosen Kleinkinder“. Das griechische Adjektiv bedeutet wörtlich „ohne Sünde“, hebt hier aber wahrscheinlich ihre Unschuld als Opfer hervor.'
    reason: lexical_alternative
  - marker: b
    text: Das seltene griechische Verb kann auch mit „das Böse zu verabscheuen“ wiedergegeben werden und drückt eine starke Abneigung gegen das Böse aus.
    reason: lexical_alternative
lexical_decisions:
- source_word: μνησθῆναι
  choice: zu denken
  rationale: Im fortlaufenden griechischen Infinitivgefüge gibt „an … zu denken“ den Sinn von „sich erinnern / eingedenk sein“ natürlich und würdig wieder.
- source_word: ἀναμαρτήτων
  choice: unschuldigen
  rationale: Das Adjektiv bedeutet wörtlich „ohne Sünde“; im Zusammenhang bezeichnet es die moralische Unschuld der getöteten Opfer, ohne eine weitergehende dogmatische Aussage zu erzwingen.
- source_word: νηπίων
  choice: Kleinkinder
  rationale: νηπίων bezeichnet sehr junge Kinder. „Kleinkinder“ ist im heutigen Deutsch natürlicher und weniger altersspezifisch als „Säuglinge“.
- source_word: παρανόμου
  choice: gesetzwidrige
  rationale: Die Wiedergabe bewahrt den Gedanken eines Handelns gegen Gesetz und Recht; „rechtswidrig“ wäre ebenfalls möglich, klingt hier jedoch stärker juristisch-technisch.
- source_word: ἀπωλίας
  choice: Vernichtung
  rationale: Das Substantiv bezeichnet Untergang oder Vernichtung. Der Ausdruck bleibt nah am Griechischen, während „Abschlachten“ die Art des Todes stärker ausmalen würde.
- source_word: βλασφημιῶν
  choice: Lästerungen
  rationale: Da sie gegen Gottes Namen gerichtet sind, ist die religiöse Bedeutung „Lästerungen“ sachgemäß.
- source_word: εἰς τὸ ὄνομα αὐτοῦ
  choice: gegen seinen Namen
  rationale: „Gegen“ gibt in diesem feindseligen Zusammenhang die Zielrichtung der Lästerungen idiomatisch wieder.
- source_word: μισοπνηρῆσαι
  choice: das Böse zu hassen
  rationale: Das seltene Verb bezeichnet starken Hass oder Abscheu gegenüber dem Bösen. Die direkte Formulierung ist klar und lässt eine mögliche ingressive Nuance offen.
theological_decisions:
- issue: Wiedergabe von ἀναμαρτήτων bei den getöteten Kindern
  choice: unschuldigen Kleinkinder
  alternative: sündlosen Kleinkinder
  rationale: „Unschuldig“ wahrt die kontextuelle Aussage über ihre Schuldlosigkeit als Opfer, ohne die Formulierung stillschweigend zu einer umfassenden Lehrbehauptung über absolute Sündlosigkeit auszubauen.
- issue: Bezug des seltenen Verbs μισοπνηρῆσαι
  choice: das Böse zu hassen
  alternative: Abscheu vor dem Bösen zu empfinden
  rationale: Die substantivische Ergänzung „das Böse“ bewahrt die moralische Allgemeinheit des griechischen Verbs und vermeidet eine Einengung auf bestimmte Täter.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Infinitivstruktur des griechischen Satzes bleibt erhalten, da der Vers syntaktisch an den vorausgehenden Zusammenhang anschließt. „Kleinkinder“ vermeidet das heute engere Verständnis von „Säuglinge“; „gesetzwidrig“ wahrt die Rechtsdimension von παράνομος.
