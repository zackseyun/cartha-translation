  yaml_path: translation/deuterocanon/2_maccabees/008/026.yaml
  text: For it was the day before the Sabbath[a], and for that reason they did not continue pursuing them for long.
translation:
  language: de
  text: Denn es war der Tag vor dem Sabbat[a]; deshalb setzten sie die Verfolgung nicht lange fort.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die hier mit „der Tag vor dem Sabbat“ wiedergegebene griechische Wendung ist in Swetes Text („ἡ πρὸ τοῦ σαββάτου δίκη“) sprachlich und textlich schwierig. Die Übersetzung folgt dem klaren Sinn des Zusammenhangs: Wegen des bevorstehenden Sabbats konnten sie die Verfolgung nicht lange fortsetzen.'
    reason: textual_variant
lexical_decisions:
- source_word: ἦν γὰρ
  choice: Denn es war
  rationale: γάρ begründet, weshalb die Verfolgung abgebrochen wurde; „Denn es war“ gibt diesen Zusammenhang im Deutschen natürlich wieder.
- source_word: ἡ πρὸ τοῦ σαββάτου δίκη
  choice: der Tag vor dem Sabbat
  rationale: Das überlieferte δίκη ist hier lexikalisch und textlich schwierig. Der Zusammenhang mit πρὸ τοῦ σαββάτου und der verkürzten Verfolgung weist jedoch klar auf eine Zeitangabe unmittelbar vor dem Sabbat.
- source_word: διʼ ἣν αἰτίαν
  choice: deshalb
  rationale: Die Wendung bezeichnet den daraus folgenden Grund; „deshalb“ ist knapp, idiomatisch und bewahrt den kausalen Zusammenhang.
- source_word: οὐκ ἐμακροτόνησαν
  choice: setzten sie … nicht lange fort
  rationale: Das Verb bezeichnet das zeitliche Ausdehnen einer Handlung. Zusammen mit dem Partizip wird ausgedrückt, dass sie die Verfolgung nicht lange fortführten.
- source_word: κατατρέχοντες αὐτούς
  choice: die Verfolgung
  rationale: Das Partizip bezeichnet das Nachsetzen oder Verfolgen von Gegnern. Die nominale deutsche Fügung mit „fortsetzen“ gibt den militärischen Zusammenhang natürlich wieder; das Objekt ergibt sich eindeutig aus dem Kontext.
theological_decisions: []
