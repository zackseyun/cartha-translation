  text: After doing these things[a], and making a common prayer of supplication[b], they begged the merciful Lord to be fully reconciled to his servants.
translation:
  language: de
  text: Nachdem sie dies vollbracht und gemeinsam ein Bittgebet gesprochen hatten, baten sie den barmherzigen Herrn inständig, sich mit seinen Dienern vollständig zu versöhnen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sich endgültig mit seinen Dienern zu versöhnen“. Die griechische Wendung kann sowohl vollständige als auch endgültig zustande gekommene Versöhnung bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: διαπραξάμενοι
  choice: nachdem sie dies vollbracht hatten
  rationale: Das Partizip fasst die zuvor berichteten Handlungen als ausgeführt zusammen. „Vollbracht“ gibt den Abschluss wieder, ohne die Art des Ergebnisses näher festzulegen.
- source_word: κοινὴν ἱκετίαν ποιησάμενοι
  choice: gemeinsam ein Bittgebet gesprochen hatten
  rationale: κοινήν bezeichnet das gemeinschaftliche Handeln; ἱκετία ist eine eindringliche Bitte, die sich hier an Gott richtet und daher natürlich als „Bittgebet“ wiedergegeben wird.
- source_word: ἐλεήμονα κύριον
  choice: den barmherzigen Herrn
  rationale: „Barmherzig“ ist für ἐλεήμων in Bezug auf Gott treffend und würdevoll; κύριος fungiert hier als Gottesbezeichnung.
- source_word: ἠξίουν
  choice: baten sie inständig
  rationale: Das Verb bezeichnet hier ein nachdrückliches Ersuchen. Die Formulierung bewahrt die Intensität, ohne im Deutschen unnatürlich zu wirken.
- source_word: εἰς τέλος καταλλαγῆναι
  choice: sich vollständig zu versöhnen
  rationale: καταλλάσσομαι bezeichnet die Wiederherstellung eines gestörten Verhältnisses. εἰς τέλος kann die Vollständigkeit oder den endgültigen Abschluss dieser Versöhnung hervorheben.
- source_word: τοῖς αὐτοῦ δούλοις
  choice: mit seinen Dienern
  rationale: δοῦλοι bezeichnet Menschen, die einem Herrn gehören und ihm unterstellt sind. „Diener“ ist im heutigen Deutschen verständlich und bewahrt in der Beziehung zum Herrn den Gedanken der Abhängigkeit, ohne das hier nicht eigens betonte soziale Sklavenverhältnis in den Vordergrund zu rücken.
theological_decisions:
- issue: Bedeutung von δοῦλοις in der Beziehung zu Gott
  choice: seinen Dienern
  alternative: seinen Knechten / seinen Sklaven
  rationale: Der Zusammenhang beschreibt die Zugehörigkeit und Unterordnung unter Gott. „Diener“ gibt dies in natürlichem modernem Deutsch wieder; „Knechte“ wäre traditioneller, „Sklaven“ würde den rechtlich-sozialen Status stärker hervorheben, als es der unmittelbare Zusammenhang verlangt.
- issue: Bedeutung von εἰς τέλος bei καταλλαγῆναι
  choice: sich vollständig zu versöhnen
  alternative: sich endgültig / schließlich zu versöhnen
  rationale: Die Wendung kann den Grad der Versöhnung oder ihr Erreichen bis zum Ende bezeichnen. Der Haupttext gibt die wahrscheinlichere intensivierende Bedeutung wieder; die zeitlich-abschließende Möglichkeit bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Die Satzstruktur folgt dem griechischen Handlungsablauf, wird aber idiomatisch formuliert; echte Bedeutungsbreite bei εἰς τέλος bleibt durch die Fußnote erhalten.
