  text: And they were calling on the Lord to look upon the people trampled down by all[a], and also to have mercy on the temple that had been defiled by ungodly men;
translation:
  language: de
  text: Und sie riefen den Herrn an, auf das von allen niedergetretene Volk zu schauen und sich auch des Tempels zu erbarmen, der von gottlosen Menschen entweiht[a] worden war.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „entheiligt“ oder „geschändet“. Das griechische Wort betont, dass der heilige Tempel von gottlosen Menschen wie etwas Gewöhnliches behandelt worden war.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεκαλοῦντο
  choice: sie riefen … an
  rationale: Der Imperfekt bezeichnet einen fortdauernden oder wiederholten Gebetsruf; „anrufen“ gibt den religiösen Sinn im Deutschen natürlich wieder.
- source_word: τὸν κύριον
  choice: den Herrn
  rationale: „Herr“ ist in diesem Gebetszusammenhang die angemessene ehrfürchtige Gottesbezeichnung, ohne den Gottesnamen ausdrücklich einzutragen.
- source_word: ἐφιδεῖν
  choice: zu schauen auf
  rationale: Das Verb meint hier nicht bloßes Sehen, sondern aufmerksames, helfendes Hinsehen; die Wendung bewahrt zugleich den würdevollen Gebetston.
- source_word: τὸν … λαόν
  choice: das … Volk
  rationale: Gemeint ist das Volk als Gemeinschaft; „Volk“ ist die klare und sachlich passende deutsche Entsprechung.
- source_word: καταπατούμενον
  choice: niedergetretene
  rationale: Die Übersetzung erhält das anschauliche Bild gewaltsamer Unterdrückung und Erniedrigung, statt es zu verallgemeinern.
- source_word: ὑπὸ πάντων
  choice: von allen
  rationale: Die knappe und umfassende Formulierung des Griechischen bleibt erhalten, ohne ein nicht genanntes Bezugswort zu ergänzen.
- source_word: οἰκτεῖραι
  choice: sich … zu erbarmen
  rationale: „Sich erbarmen“ ist eine natürliche, würdige Gebetsformulierung und bringt das erbetene göttliche Mitgefühl zum Ausdruck.
- source_word: τὸν ναόν
  choice: des Tempels
  rationale: Im historischen Zusammenhang ist der Jerusalemer Tempel gemeint; „Tempel“ ist dafür die geläufigste Bezeichnung.
- source_word: βεβηλωθέντα
  choice: entweiht
  rationale: Das Wort bezeichnet die Behandlung von Heiligem als gewöhnlich oder profan. „Entweiht“ ist präzise und im modernen Deutsch verständlich; Alternativen werden in der Fußnote genannt.
- source_word: ὑπὸ τῶν ἀσεβῶν ἀνθρώπων
  choice: von gottlosen Menschen
  rationale: „Gottlos“ bewahrt den religiösen Bezug von ἀσεβής. „Menschen“ gibt ἀνθρώπων hier als allgemeine Bezeichnung der menschlichen Täter wieder, ohne ein im Kontext nicht gesichertes Geschlecht festzulegen.
theological_decisions:
- issue: Wiedergabe von κύριος im Gebet an Israels Gott
  choice: Herr
  alternative: Gebieter
  rationale: „Herr“ vermittelt die ehrfürchtige Anrede Gottes und vermeidet zugleich, den im griechischen Text nicht ausdrücklich stehenden Gottesnamen einzutragen.
- issue: Wiedergabe von ἀσεβῶν ἀνθρώπων
  choice: gottlose Menschen
  alternative: gottlose Männer
  rationale: ἀσεβής bezeichnet fehlende Ehrfurcht gegenüber Gott. Das grammatische Maskulinum ἀνθρώπων kann Menschen allgemein bezeichnen; da der Vers das Geschlecht der Täter nicht eigens hervorhebt, wahrt „Menschen“ die genuine Offenheit des Ausdrucks.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Gebetston. Die bildhafte Sprache von „niedertreten“ und die umfassende Formulierung „von allen“ bleiben erhalten; der Satzbau folgt dem griechischen Gedankengang, ohne unnatürlich zu wirken.
