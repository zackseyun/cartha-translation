  yaml_path: translation/deuterocanon/2_maccabees/008/032.yaml
  text: But they killed the commander among those with Timothy, a thoroughly worthless man who had caused the Jews much distress.
translation:
  language: de
  text: Den Stammesführer unter den Leuten des Timotheus aber töteten sie. Er war ein durch und durch verwerflicher Mann und hatte den Juden viel Leid zugefügt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φυλάρχην
  choice: Stammesführer
  rationale: Das Wort bezeichnet wörtlich den Führer eines Stammes oder einer Volksgruppe; „Stammesführer“ wahrt diese konkrete Bedeutung besser als das allgemeinere „Befehlshaber“.
- source_word: τῶν περὶ Τιμόθεον
  choice: unter den Leuten des Timotheus
  rationale: Die griechische Wendung bezeichnet den Kreis um Timotheus. „Unter den Leuten des Timotheus“ lässt offen, ob der Stammesführer diesen gesamten Kreis befehligte.
- source_word: ἀνυπόστατον
  choice: durch und durch verwerflich
  rationale: Das seltene Adjektiv ist hier eine starke negative Charakterisierung; diese Wiedergabe vermittelt den Nachdruck, ohne eine speziellere Untat in den Text hineinzulesen.
- source_word: ἐπιλελυπηκότα
  choice: hatte … viel Leid zugefügt
  rationale: Das Partizip beschreibt vorausgegangenes, wiederholtes oder erhebliches Zufügen von Kummer und Bedrängnis; die deutsche Formulierung ist natürlich und hält den zeitlichen Bezug fest.
