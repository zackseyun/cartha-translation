base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/008/010.yaml
  text: But Nikanor undertook to pay to the king the tribute owed to the Romans[a], amounting to two thousand talents[b], from the captivity of the Jews.
translation:
  language: de
  text: Nikanor aber übernahm es, für den König den den Römern geschuldeten Tribut von zweitausend Talenten durch die Gefangennahme der Juden aufzubringen.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Griechische verbindet „dem König“ und „den Römern“ in einer knappen Dativkonstruktion. Gemeint ist wahrscheinlich, dass Nikanor die Zahlungsverpflichtung des Königs gegenüber Rom erfüllen wollte.
    reason: alternative_reading
  - marker: b
    text: Die Gefangennahme von Juden sollte als Geldquelle dienen, etwa durch ihren Verkauf oder durch Lösegeld; der Vers selbst nennt die konkrete Form der Verwertung nicht.
    reason: cultural_note
lexical_decisions:
- source_word: ἰδιωτεύσατο
  choice: übernahm es
  rationale: Das Verb bezeichnet hier die persönliche Übernahme einer Verpflichtung. „Übernahm es“ ist gegenwärtiges, natürliches Deutsch und legt die genaue verwaltungstechnische Form nicht unnötig fest.
- source_word: φόρον
  choice: Tribut
  rationale: φόρος bezeichnet eine Abgabe an eine übergeordnete Macht; im politischen Verhältnis zu Rom ist „Tribut“ treffender als das allgemeinere „Steuer“.
- source_word: τῷ βασιλεῖ
  choice: dem König
  rationale: Der Dativ bezeichnet den Empfänger beziehungsweise denjenigen, dessen Verpflichtung Nikanor erfüllen wollte.
- source_word: τοῖς ις Ῥωμαίοις
  choice: an die Römer
  rationale: Die überlieferte griechische Wendung ist knapp und textlich auffällig; im Zusammenhang bezeichnet sie wahrscheinlich den mit Rom verbundenen Tribut. Die Formulierung bleibt bewusst weniger explizit als „den der König den Römern schuldete“.
- source_word: ὄντα τάλαντων δισχιλίων
  choice: in Höhe von zweitausend Talenten
  rationale: Dies gibt die Bezifferung des Tributs idiomatisch wieder und behält die antike Gewichtes- und Geldeinheit bei.
- source_word: ἐκ τῆς τῶν Ἰουδαίων αἰχμαλωσίας
  choice: aus der Gefangennahme der Juden
  rationale: αἰχμαλωσία kann Gefangenschaft oder Gefangennahme bezeichnen. Hier ist das geplante Ergreifen und wirtschaftliche Ausbeuten jüdischer Gefangener als Geldquelle gemeint; „Gefangennahme“ bildet diesen Vorgang ab, ohne den Verkauf in den Haupttext einzutragen.
- source_word: ἐκπληρώσειν
  choice: aufzubringen
  rationale: Im finanziellen Zusammenhang bedeutet das Verb, eine geschuldete Summe vollständig zu leisten. „Aufzubringen“ verbindet dies natürlich mit der ausdrücklich genannten Geldquelle.
theological_decisions:
- issue: Bezug der kompakten Dativkonstruktion τῷ βασιλεῖ τοῖς ις Ῥωμαίοις
  choice: „dem König den Tribut an die Römer“
  alternative: „dem König den den Römern geschuldeten Tribut“ oder wörtlicher „den Tribut für den König, für die Römer“
  rationale: Der Kontext spricht dafür, dass Nikanor die römische Zahlungsverpflichtung des Königs aus der Gefangennahme der Juden decken wollte. Da die griechische Konstruktion knapp und in der vorliegenden Gestalt auffällig ist, wird die wahrscheinlichste Beziehung verständlich ausgedrückt, ohne das Schuldverhältnis im Haupttext vollständig auszudeuten.
- issue: Art des Gewinns aus der Gefangennahme der Juden
  choice: im Haupttext nicht näher festgelegt
  alternative: aus dem Verkauf oder Lösegeld jüdischer Gefangener
  rationale: Der Zusammenhang legt Verkauf oder Lösegeld nahe, doch der Vers selbst nennt lediglich die Gefangennahme als Quelle. Die konkrete wirtschaftliche Verwertung wird daher nur in der Fußnote erläutert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung hält Nikanors persönliche Verpflichtungsübernahme und den grausamen Finanzierungsplan klar zusammen. „Talente“ bleibt als antike Einheit unmodernisiert; die syntaktische Unsicherheit beim römischen Tribut wird durch Fußnote [a] offengelegt.
