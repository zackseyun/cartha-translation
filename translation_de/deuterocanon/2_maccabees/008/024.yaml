base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/008/024.yaml
  text: But with the Almighty as their ally, they slaughtered more than nine thousand of the enemy, and they wounded and maimed most of Nicanor’s army, and forced them all to flee.
translation:
  language: de
  text: Doch als der Allmächtige ihr Verbündeter wurde, metzelten sie mehr als neuntausend Feinde nieder. Den größten Teil des Heeres Nikanors verwundeten und verstümmelten sie, und sie zwangen alle zur Flucht.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦ παντοκράτορος
  choice: der Allmächtige
  rationale: Der etablierte deutsche Gottesname gibt den Titel für den uneingeschränkt Mächtigen beziehungsweise Herrscher über alles würdig und prägnant wieder.
- source_word: συμμάχου
  choice: ihr Verbündeter
  rationale: Das Wort bezeichnet einen Mitkämpfer oder Bundesgenossen und bewahrt hier den ausdrücklich militärischen Sinn.
- source_word: κατέσφαξαν
  choice: metzelten … nieder
  rationale: Die kräftige, gewaltsame Aussage des Verbs ist stärker als bloßes „töteten“; die gewählte Formulierung passt zum Kampfgeschehen.
- source_word: ὑπὲρ τοὺς ἐννακισχιλίους
  choice: mehr als neuntausend
  rationale: ὑπέρ mit Akkusativ bezeichnet bei einer Zahl deren Überschreitung.
- source_word: τραυματίας
  choice: verwundeten
  rationale: Die verbale Wiedergabe ergibt im Deutschen einen natürlichen Satz und bezeichnet präzise im Kampf Verwundete.
- source_word: τοῖς μέλεσιν ἀπηρεῖς
  choice: verstümmelten
  rationale: Die Wendung bezeichnet Menschen, die an ihren Gliedmaßen schwer geschädigt oder unbrauchbar gemacht wurden; „verstümmelten“ gibt dies knapp und deutlich wieder.
- source_word: τὸ πλεῖον μέρος τῆς τοῦ Νικάνορος στρατειᾶς
  choice: den größten Teil des Heeres Nikanors
  rationale: Die Formulierung bezeichnet die Mehrheit der unter Nikanor stehenden Streitmacht; „Heer“ ist im Kontext natürlich und sachlich.
- source_word: πάντας δὲ φεύγειν ἠνάγκασαν
  choice: sie zwangen alle zur Flucht
  rationale: Die Wiedergabe erhält sowohl den Zwang als auch das uneingeschränkte πάντας, ohne durch „alle Übrigen“ eine nicht ausdrücklich genannte Einschränkung einzuführen.
theological_decisions:
- issue: Wiedergabe des Gottestitels παντοκράτωρ im Zusammenhang militärischer Rettung
  choice: der Allmächtige
  alternative: der Herrscher über alles
  rationale: „Der Allmächtige“ ist der geläufige und ehrfurchtsvolle deutsche Titel. Er betont Gottes höchste Macht, ohne die Aussage über seine konkrete Unterstützung im Kampf über den griechischen Text hinaus dogmatisch auszudeuten.
- issue: Gottes Rolle als σύμμαχος
  choice: ihr Verbündeter
  alternative: ihr Mitstreiter
  rationale: „Verbündeter“ wahrt die militärische Metapher und lässt die Aussage stehen, dass Gott auf ihrer Seite in den Kampf eingreift, ohne sie zu einer abstrakten Aussage über Vorsehung abzuschwächen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer militärischer Bildsprache. Die starke Gewaltsemantik von κατέσφαξαν wird nicht geglättet. Der letzte Satz bewahrt das unbestimmte Bezugsfeld von „alle“, statt erklärend „alle Übrigen“ einzusetzen.
