base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/008/023.yaml
  text: He also brought Eleazar[a], and after bringing forward the holy book and giving the watchword[b], “God’s Help,” he himself led the first company and engaged Nicanor.
translation:
  language: de
  text: Auch Eleasar zog er heran. Dann brachte er das heilige Buch herbei und gab die Losung »Gottes Hilfe«[a] aus. Er selbst stellte sich an die Spitze der ersten Abteilung[b] und nahm den Kampf mit Nikanor auf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: »Hilfe von Gott« oder »Gott ist Hilfe«. Der griechische Ausdruck ist knapp und kann unterschiedlich verstanden werden.'
    reason: lexical_alternative
  - marker: b
    text: Das griechische Wort bezeichnet eine militärische Einheit und kann auch mit »Kohorte« oder »Truppe« wiedergegeben werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔτι δὲ καὶ Ἐλεάζαρον
  choice: Auch Eleasar ließ er herbeiholen
  rationale: Der alleinstehende Akkusativ Ἐλεάζαρον setzt das Subjekt und den Handlungszusammenhang aus dem Kontext voraus. Die Formulierung folgt der plausiblen Ergänzung einer Handlung des Judas, ohne Eleasar zum Subjekt der folgenden Partizipien zu machen.
- source_word: παραγαγὼν τὴν ἱερὰν βίβλον
  choice: Dann brachte er das heilige Buch herbei
  rationale: παράγω bezeichnet hier das Herbeibringen beziehungsweise Vorlegen; die finite deutsche Form gibt die griechische Handlungsfolge natürlich wieder. »Buch« lässt die konkrete Gestalt als Buchrolle offen.
- source_word: σύνθημα
  choice: Losung
  rationale: Im militärischen Zusammenhang bezeichnet σύνθημα ein vereinbartes Erkennungs- oder Losungswort. »Losung« ist im Deutschen knapp, verständlich und dem gehobenen Erzählton angemessen.
- source_word: θεοῦ Βοηθείας
  choice: Gottes Hilfe
  rationale: Die stark verdichtete Genitivverbindung wird als Inhalt der Losung wiedergegeben. »Gottes Hilfe« bewahrt die grammatische Beziehung, ohne sie zu einem vollständigen Aussagesatz auszubauen.
- source_word: τῆς πρώτης σπείρης
  choice: der ersten Abteilung
  rationale: σπεῖρα bezeichnet eine militärische Einheit. »Abteilung« ist verständlich und vermeidet die zu enge Festlegung auf eine römische Kohorte.
- source_word: αὐτὸς προηγούμενος
  choice: Er selbst stellte sich an die Spitze
  rationale: Die Wiedergabe erhält sowohl die Betonung durch αὐτός als auch den Gedanken, dass Judas persönlich voranging und die Einheit führte.
- source_word: συνέβαλε τῷ Νικάνορι
  choice: trat gegen Nikanor zum Kampf an
  rationale: συμβάλλω mit Dativ bezeichnet im militärischen Zusammenhang das Zusammentreffen oder den Kampf mit einem Gegner. Die Formulierung vermeidet die einseitigere Aussage, Judas habe Nikanor angegriffen.
theological_decisions:
- issue: Subjekt der Partizipialkette und des Hauptverbs
  choice: Judas bleibt das aus dem Zusammenhang erschlossene Subjekt; Eleasar ist Objekt der einleitenden, elliptischen Wendung.
  alternative: Eleasar könnte als stärker an den folgenden Handlungen beteiligt verstanden werden.
  rationale: Ἐλεάζαρον steht im Akkusativ, während παραγαγών, δούς und προηγούμενος grammatisch auf das fortlaufende männliche Subjekt der Erzählung weisen. Die Übersetzung macht diese wahrscheinlichste Zuordnung deutlich, ohne Eleasar zum Leser oder Träger des heiligen Buches zu erklären.
- issue: Aussagegehalt der Losung θεοῦ Βοηθείας
  choice: Die nominale und mehrdeutige Form bleibt als »Gottes Hilfe« erhalten.
  alternative: Möglich wären auch »Hilfe von Gott« oder die satzförmige Deutung »Gott ist Hilfe«.
  rationale: Der griechische Ausdruck ist verdichtet und legt nicht eindeutig fest, ob Besitz beziehungsweise Herkunft der Hilfe oder eine Aussage über Gott gemeint ist. Eine nominale Wiedergabe vermeidet eine theologische Präzisierung, die der Wortlaut nicht erzwingt.
translation_notes:
  register: Moderner, würdiger Erzählstil mit klarer militärischer Terminologie. Die kurzen Hauptsätze lösen die griechische Partizipialfolge lesbar auf. »Losung« und »Abteilung« sind gegenwärtig verständlich, ohne den Schauplatz unnötig zu romanisieren.
