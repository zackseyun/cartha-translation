base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/008/014.yaml
  text: But they were selling all that remained[a], and at the same time were imploring the Lord to rescue those who had been sold by the ungodly Nikanor before he encountered them.
translation:
  language: de
  text: Sie aber verkauften alles, was ihnen noch geblieben war, und zugleich flehten sie den Herrn an, diejenigen zu retten, die von dem gottlosen Nikanor schon verkauft worden waren[a], noch bevor er ihnen begegnet war.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dem Zusammenhang nach bedeutet dies: „in die Sklaverei verkauft worden waren“. Im Griechischen steht lediglich „verkauft worden waren“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ περιλελειμμένα πάντα
  choice: alles, was ihnen noch geblieben war
  rationale: Die substantivierte Perfektform bezeichnet umfassend das noch Vorhandene, im Zusammenhang wohl den restlichen Besitz. Die Wiedergabe bleibt natürlich, ohne den Gegenstand ausdrücklich festzulegen.
- source_word: ἐπώλουν
  choice: verkauften
  rationale: Das griechische Imperfekt beschreibt den fortdauernden Vorgang. Das deutsche Präteritum ist im Erzählzusammenhang idiomatisch; die Gleichzeitigkeit mit dem Flehen wird durch „zugleich“ deutlich.
- source_word: ὁμοῦ δὲ
  choice: und zugleich
  rationale: ὁμοῦ kennzeichnet hier, dass Verkauf und Flehen gleichzeitig geschahen.
- source_word: τὸν κύριον
  choice: den Herrn
  rationale: Der Zusammenhang bezeichnet Gott als Adressaten des Gebets; „der Herr“ ist die sachgemäße und übliche Wiedergabe.
- source_word: ἠξίουν
  choice: flehten ... an
  rationale: Das Verb kann „bitten“ oder „ersuchen“ bedeuten. In dieser Notlage bringt „anflehen“ die Eindringlichkeit der Bitte angemessen zum Ausdruck.
- source_word: ῥύσασθαι
  choice: zu retten
  rationale: Das Verb bezeichnet die Befreiung aus einer konkreten Gefahr. „Retten“ ist verständlich und lässt den unmittelbaren Bezug der Bitte bestehen.
- source_word: τοὺς ... πεπραμένους
  choice: die ... verkauft worden waren
  rationale: Das Perfektpartizip bezeichnet einen bereits vollzogenen Verkauf mit fortbestehendem Ergebnis. Die passive Form entspricht der griechischen Konstruktion; „in die Sklaverei“ wird nicht in den Haupttext eingefügt, da es nur aus dem Zusammenhang hervorgeht.
- source_word: ὑπὸ τοῦ δυσσεβοῦς Νικάνορος
  choice: von dem gottlosen Nikanor
  rationale: δυσσεβής ist eine starke religiös-moralische Wertung. „Gottlos“ bewahrt diese Aussage in geläufigem modernem Deutsch.
- source_word: πρὶν συντυχεῖν
  choice: noch bevor er ihnen begegnet war
  rationale: Der unausgesprochene Handelnde des Infinitivs ist am ehesten Nikanor; „ihnen“ bezieht sich auf die Menschen, denen er später begegnen beziehungsweise im Kampf gegenübertreten würde. „Begegnen“ erhält die Formulierung, ohne den militärischen Vorgang stärker auszudeuten.
theological_decisions:
- issue: Wiedergabe von κύριος in einem an Gott gerichteten Gebet
  choice: der Herr
  alternative: der Gebieter
  rationale: Der Kontext identifiziert Gott als Adressaten. „Der Herr“ ist hier eindeutig und führt keine zusätzliche konfessionelle Deutung ein.
- issue: Ob der Verkauf in die Sklaverei ausdrücklich genannt werden soll
  choice: die ... verkauft worden waren
  alternative: die ... in die Sklaverei verkauft worden waren
  rationale: Der Zusammenhang legt einen Verkauf in die Sklaverei nahe, doch πεπραμένους nennt dies nicht ausdrücklich. Der Haupttext bewahrt daher die Offenheit des Wortlauts; eine Fußnote erläutert die kontextuelle Bedeutung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit gut verständlichem Satzbau. Die wiederholte Nennung des Subjekts nach „zugleich“ verdeutlicht die beiden gleichzeitig vollzogenen Handlungen. Die sachlich naheliegende Sklavereibedeutung wird nicht in den Haupttext eingetragen, sondern in der Fußnote kenntlich gemacht.
