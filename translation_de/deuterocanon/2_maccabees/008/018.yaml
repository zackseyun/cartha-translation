base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/008/018.yaml
  text: For they[a], he said, have put their confidence in weapons and boldness, but we have put our confidence in Almighty God, who is able with a single nod to bring down both those coming against us and the whole world.
translation:
  language: de
  text: Denn sie, sagte er, vertrauen auf Waffen und Kühnheit; wir aber vertrauen auf Gott, den Allmächtigen, der mit einem einzigen Wink[a] sowohl die, die gegen uns heranziehen, als auch die ganze Welt zu Fall bringen kann.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit einem einzigen Zeichen“ bzw. „mit einem einzigen Nicken“. Das griechische Wort bezeichnet einen Wink oder ein Signal und unterstreicht, wie mühelos Gott seine Gegner niederwerfen kann.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπλοις
  choice: Waffen
  rationale: Bezeichnet hier im militärischen Zusammenhang Kriegsgerät; „Waffen“ ist die klare, gegenwärtige Entsprechung.
- source_word: τόλμαις
  choice: Kühnheit
  rationale: Gibt den Mut und die Entschlossenheit im Kampf wieder, ohne das Wort unnötig als Leichtsinn oder Vermessenheit zu deuten.
- source_word: ἐπὶ τῷ παντοκράτορι θεῷ
  choice: auf Gott, den Allmächtigen
  rationale: ἐπί mit Dativ bezeichnet bei πεποίθαμεν die Grundlage des Vertrauens; die Formulierung bewahrt zugleich den göttlichen Titel παντοκράτωρ.
- source_word: δυναμένῳ
  choice: der … kann
  rationale: Das Partizip bezieht sich auf Gott und begründet das Vertrauen; ein deutscher Relativsatz ist natürlich und präzise.
- source_word: τοὺς ἐρχομένους ἐφʼ ἡμᾶς
  choice: die, die gegen uns heranziehen
  rationale: Bewahrt sowohl die Bewegung als auch die feindliche Ausrichtung, ohne den genauen Stand des Angriffs stärker festzulegen als der griechische Text.
- source_word: τὸν ὅλον κόσμον
  choice: die ganze Welt
  rationale: κόσμος kann „Welt“ oder „Weltall“ bezeichnen; „die ganze Welt“ wahrt hier die umfassende Aussage und die lexikalische Offenheit.
- source_word: ἑνὶ νεύματι
  choice: mit einem einzigen Wink
  rationale: νεῦμα bezeichnet einen Wink, ein Nicken oder ein Zeichen. „Wink“ ist im Deutschen idiomatisch und hebt hervor, wie mühelos Gott handeln kann.
- source_word: καταβαλεῖν
  choice: zu Fall bringen
  rationale: Gibt das Niederwerfen oder Stürzen natürlich wieder und lässt sich sowohl auf die heranziehenden Gegner als auch auf die ganze Welt beziehen.
- source_word: πεποίθασιν / πεποίθαμεν
  choice: vertrauen / vertrauen
  rationale: Das deutsche Präsens drückt den durch die griechischen Perfektformen bezeichneten bestehenden Zustand des Vertrauens natürlich aus und erhält den Parallelismus.
theological_decisions:
- issue: Wiedergabe des Gottestitels παντοκράτωρ
  choice: Gott, den Allmächtigen
  alternative: der allmächtige Gott
  rationale: Die substantivische Form bewahrt παντοκράτωρ als gewichtigen Gottestitel und klingt zugleich in modernem, würdigem Deutsch natürlich.
- issue: Bedeutungsumfang von κόσμος
  choice: die ganze Welt
  alternative: das ganze Weltall
  rationale: „Welt“ lässt die mögliche kosmische Weite der Aussage bestehen, ohne die im Kontext nicht eindeutig festgelegte Bedeutung auf „Weltall“ einzuengen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Der antithetische Parallelismus zwischen „sie“ und „wir“ bleibt erhalten; auf altertümliche Formen und konfessionell geprägte Zusätze wurde verzichtet.
