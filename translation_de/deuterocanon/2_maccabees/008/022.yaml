  text: having appointed his brothers to lead each division[a], Simon and Joseph and Jonathan, assigning to each one a thousand men in addition to five hundred,
translation:
  language: de
  text: Er bestimmte seine Brüder Simon, Josef und Jonatan zu Anführern der einzelnen Abteilungen und unterstellte jedem von ihnen tausend Mann zusätzlich zu fünfhundert,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „tausend zusätzlich zu fünfhundert“, also 1.500 unter jedem Anführer.'
    reason: Die Fußnote erläutert die additive griechische Zahlenangabe, ohne sie im Haupttext zu glätten.
lexical_decisions:
- source_word: τάξας
  choice: Er bestimmte
  rationale: Das Aoristpartizip bezeichnet eine vorbereitende Einsetzung; im Deutschen gibt ein koordinierter Hauptsatz den fortlaufenden Satzbau natürlich wieder.
- source_word: ἀδελφοὺς αὐτοῦ
  choice: seine Brüder
  rationale: Die gewöhnliche familiäre Bedeutung ist hier sachlich passend und sollte nicht zu „Verwandten“ abgeschwächt werden.
- source_word: προηγουμένους
  choice: zu Anführern
  rationale: Wörtlich bezeichnet das Wort die Vorausgehenden; im militärischen Zusammenhang ist damit die Leitungsfunktion gemeint.
- source_word: ἑκάτερας τάξεως
  choice: der einzelnen Abteilungen
  rationale: τάξις bezeichnet hier einen geordneten Truppenkörper. Die distributive Formulierung wird idiomatisch mit „der einzelnen“ wiedergegeben.
- source_word: ὑποτάξας
  choice: unterstellte
  rationale: Das Verb beschreibt, dass die Soldaten jeweils dem Befehl eines der genannten Anführer untergeordnet wurden.
- source_word: ἑκάστῳ
  choice: jedem von ihnen
  rationale: Die Ergänzung „von ihnen“ macht den Rückbezug auf die drei genannten Brüder im Deutschen eindeutig.
- source_word: χιλίους πρὸς τοῖς πεντακοσίοις
  choice: tausend Mann zusätzlich zu fünfhundert
  rationale: Die additive Ausdrucksweise des Griechischen bleibt erhalten; „Mann“ wird aufgrund des militärischen Kontexts ergänzt.
