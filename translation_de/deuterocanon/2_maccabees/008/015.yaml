    issue: „über ihnen ausgerufen“ für ἐπʼ αὐτοὺς ἐπίκλησις
    rationale: Die griechische Wendung bezeichnet die Anrufung beziehungsweise das Angerufensein des göttlichen Namens über ihnen. „Ausgerufen“ kann dies zu einer bloßen Proklamation abschwächen; „angerufen“ bewahrt den idiomatischen und kultischen Bezug.
  - severity: low
