  yaml_path: translation/deuterocanon/2_maccabees/008/015.yaml
  text: and not because of them[a], but because of the covenants made with their fathers[b], and because of the invocation of his majestic and magnificent name over them.
translation:
  language: de
  text: und wenn nicht um ihretwillen[a], so doch um der Bünde willen, die er mit ihren Vätern geschlossen hatte, und weil sein ehrwürdiger und herrlicher Name über ihnen angerufen worden war.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „nicht ihretwegen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „um der Anrufung seines ehrwürdigen und herrlichen Namens über ihnen willen“. Gemeint ist die biblische Wendung, dass Gottes Name über seinem Volk angerufen beziehungsweise genannt wird.'
    reason: cultural_note
lexical_decisions:
- source_word: εἰ μὴ διʼ αὐτούς
  choice: wenn nicht um ihretwillen
  rationale: Die Wendung bezeichnet den verneinten Beweggrund. „Um ihretwillen“ gibt διὰ mit persönlichem Akkusativ natürlich wieder und lässt die Aussage über fehlendes eigenes Verdienst bestehen.
- source_word: διὰ τὰς πρὸς τοὺς πατέρας αὐτῶν διαθήκας
  choice: um der Bündnisse willen, die er mit ihren Vätern geschlossen hatte
  rationale: διαθήκη bezeichnet im jüdisch-schriftsprachlichen Zusammenhang einen Bund. Die Ergänzung „geschlossen hatte“ macht die Beziehung zu den Vätern im Deutschen idiomatisch deutlich, ohne einen weiteren Sachgehalt einzuführen.
- source_word: ἕνεκα
  choice: weil
  rationale: ἕνεκα führt einen zweiten Beweggrund an. Der Nebensatz ermöglicht eine natürliche deutsche Wiedergabe der schwierigen nominalen Konstruktion.
- source_word: τῆς ἐπʼ αὐτοὺς ἐπικλήσεως
  choice: über ihnen ausgerufen worden war
  rationale: Die Formulierung bewahrt das Bild, dass der göttliche Name über dem Volk genannt beziehungsweise ausgerufen wurde. Das Passiv entspricht der nominalen ἐπίκλησις, ohne die Wendung auf bloßen Ruf oder Ansehen zu reduzieren.
- source_word: τοῦ σεμνοῦ καὶ μεγαλοπρεποῦς ὀνόματος αὐτοῦ
  choice: sein erhabener und majestätischer Name
  rationale: „Erhaben“ und „majestätisch“ geben die beiden ehrenden Adjektive σεμνός und μεγαλοπρεπής in würdigem, gegenwärtigem Deutsch wieder.
theological_decisions:
- issue: Bundesbezogene Begründung göttlicher Hilfe
  choice: Gottes Handeln wird nicht mit dem Verdienst des Volkes, sondern mit den Bundesschlüssen mit den Vätern und seinem über dem Volk ausgerufenen Namen begründet.
  alternative: Die Aussage könnte verallgemeinernd allein auf Gottes Ansehen oder allein auf die Verheißungen an die Vorfahren bezogen werden.
  rationale: Der griechische Text nennt ausdrücklich zwei Beweggründe und stellt sie dem Handeln „um ihretwillen“ gegenüber. Beide bleiben erhalten, ohne daraus eine weitergehende Lehre über Verdienst oder Erwählung abzuleiten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Konstruktion „wenn nicht …, so doch …“ bildet den griechischen Gegensatz verständlich ab; die bildhafte Rede vom über dem Volk ausgerufenen Namen bleibt erhalten.
