  source_fidelity: Der Sinn und die zweigliedrige Begründung des griechischen Textes sind erhalten. Für διαθῆκαι ist im biblisch-theologischen Deutsch jedoch „Bünde“ präziser als das allgemeinere „Bündnisse“. Die nominale ἐπίκλησις kann idiomatisch durch ein Passiv wiedergegeben werden; „angerufen“ trifft dabei den kultisch-biblischen Charakter besser als „ausgerufen“.
  naturalness: Die antithetische Konstruktion „wenn nicht …, so doch …“ ist natürlich und dem würdigen Register angemessen. Die überarbeitete Formulierung bleibt flüssig und vermeidet bei der Namensanrufung die leicht missverständliche Vorstellung einer bloßen öffentlichen Ausrufung.
  terminology: „Bünde“ ist die etablierte deutsche Wiedergabe von διαθῆκαι in diesem jüdisch-schriftsprachlichen Kontext. „Ehrwürdig und herrlich“ gibt σεμνός καὶ μεγαλοπρεπής differenzierter wieder als „erhaben und majestätisch“, ohne den erhöhten Ton zu verlieren.
  issues:
