  terminology: „Der Herr“, „prächtiges Gewand“, „Landesinneres“ und „Antiochia“ sind angemessen. „Landesinneres“ ist gegenüber „Binnenland“ etwas idiomatischer und vermeidet jede Verwechslung mit dem Mittelmeer. Die Formulierung zum Erfolg wird absichtlich nicht geglättet, weil der griechische Schluss ironisch ist.
