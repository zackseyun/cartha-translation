base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/008/035.yaml
  text: Having been humbled by those who were thought to be the least among his own[a], and by the Lord’s help having laid aside his splendid robe, he made himself like a fugitive, traveling through the inland country in isolation and came to Antioch[c][b], having prospered beyond all expectation in the destruction of his army.
translation:
  language: de
  text: Nachdem er von denen gedemütigt worden war, die im Vergleich mit ihm als die Geringsten galten,[a] legte er mit Hilfe des Herrn sein prächtiges Gewand ab, machte sich wie ein Flüchtling ganz allein durch das Landesinnere[b] auf den Weg und gelangte nach Antiochia – nachdem er bei der Vernichtung seines Heeres über alle Maßen Erfolg gehabt hatte.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die knappe griechische Wendung kann auch „von denen, die in seinem Umfeld als die Geringsten galten“ bedeuten.
    reason: Die Konstruktion καθʼ αὑτὸν νομιζομένων ἐλαχίστων εἶναι lässt offen, ob ein Vergleich mit ihm oder sein eigenes Umfeld im Blick ist.
  - marker: b
    text: „Landesinneres“ bezeichnet hier das Gebiet im Inneren des Landes, nicht das Mittelmeer. „Wie ein Flüchtling“ kann wörtlicher auch „nach Art eines Entlaufenen“ heißen.
    reason: Erläutert die räumliche Bedeutung von μεσόγειος und bewahrt die mögliche stärkere Färbung von δραπέτης.
  - marker: c
    text: 'Die Formulierung ist ironisch: Sein „Erfolg“ bestand im Untergang seines eigenen Heeres.'
    reason: Die paradoxe Verbindung von εὐημερέω („Erfolg haben, gedeihen“) mit der Vernichtung des Heeres soll erkennbar bleiben.
lexical_decisions:
- source_word: ταπεινωθεὶς ὑπὸ τῶν καθʼ αὑτὸν νομιζομένων ἐλαχίστων εἶναι
  choice: von denen gedemütigt, die er für die Geringsten gehalten hatte
  rationale: Die passive Erniedrigung und die ironische Umkehrung bleiben erhalten. καθʼ αὑτόν wird hier als Bezug auf seine eigene Einschätzung verstanden; die syntaktische Verdichtung des Griechischen lässt jedoch auch eine allgemeinere Deutung zu.
- source_word: τῇ τοῦ κυρίου βοηθείᾳ
  choice: durch die Hilfe des Herrn
  rationale: 'Der Dativ bezeichnet das Mittel: Die Erniedrigung geschieht durch die Hilfe des Herrn. Die deutsche Formulierung bindet die Wendung klar an ταπεινωθείς.'
- source_word: τὴν δοξικὴν ἀποθέμενος ἐσθῆτα
  choice: Er legte sein prächtiges Gewand ab
  rationale: δοξικός bezeichnet ein prachtvolles, Rang und Ansehen sichtbar machendes Kleidungsstück; „prächtiges Gewand“ ist würdig und verständlich.
- source_word: διὰ τῆς μεσογείου
  choice: durch das Binnenland
  rationale: μεσόγειος bezeichnet hier das Landesinnere, nicht das Mittelmeer.
- source_word: δραπέτου τρόπον ἔρημον ἑαυτὸν ποιήσας
  choice: zog wie ein Flüchtling ganz allein
  rationale: δραπέτου τρόπον beschreibt die Art seiner schmachvollen Flucht; ἔρημον ἑαυτὸν ποιήσας hebt hervor, dass er sich ohne Begleitung auf den Weg machte. „Flüchtling“ vermeidet es, die mögliche, aber nicht zwingende Bedeutung „entlaufener Sklave“ in den Haupttext einzutragen.
- source_word: ἧκεν εἰς Ἀντιόχειαν
  choice: gelangte nach Antiochia
  rationale: Die schlichte Ankunftsangabe wird in natürlichem modernem Deutsch wiedergegeben.
- source_word: ὑπὲρ ἅπαν εὐημερηκὼς ἐπὶ τῇ τοῦ στρατοῦ διαφθορᾷ
  choice: nachdem er bei der Vernichtung seines Heeres überaus erfolgreich gewesen war
  rationale: Die bewusst widersinnige Erfolgssprache des Griechischen bleibt als Ironie stehen. „Überaus“ gibt die starke Steigerung ὑπὲρ ἅπαν wieder, ohne sie als bloße Erwartung zu interpretieren.
theological_decisions:
- issue: Bezug von κύριος
  choice: der Herr
  alternative: der herrschende Herr beziehungsweise Gebieter
  rationale: Im erzählerischen Zusammenhang bezeichnet κύριος den Gott Israels. „der Herr“ bewahrt die traditionelle Titelform, ohne den Gottesnamen ergänzend einzutragen.
- issue: Ironie von εὐημερηκὼς bei der Vernichtung des Heeres
  choice: bei der Vernichtung seines Heeres überaus erfolgreich gewesen
  alternative: bei der Vernichtung des Heeres über alle Maßen gut davongekommen
  rationale: 'Die auffällige theologische und erzählerische Ironie wird nicht geglättet: Sein einziger „Erfolg“ besteht im Untergang des eigenen Heeres. Das possessive „seines“ macht den aus dem Kontext gegebenen Bezug verständlich.'
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die lange griechische Partizipialkonstruktion wird zur besseren Verständlichkeit in zwei Sätze gegliedert. Der Gedankenstrich markiert die scharfe Ironie des Schlusssatzes, ohne sie im Haupttext auszudeuten.
