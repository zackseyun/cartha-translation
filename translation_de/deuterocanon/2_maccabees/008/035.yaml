  source_fidelity: 'Die Zuordnung von τῇ τοῦ κυρίου βοηθείᾳ ist im Entwurf nicht quellentreu: Der Dativ gehört zur Partizipialhandlung ἀποθέμενος („mit/durch die Hilfe des Herrn ... abgelegt“), nicht zu ταπεινωθείς („durch die Hilfe des Herrn gedemütigt“). Die übrigen Kernelemente – Erniedrigung durch vermeintlich Geringe, Ablegen des prächtigen Gewands, einsame Flucht durchs Landesinnere, Ankunft in Antiochia und der ironische Schluss – werden grundsätzlich erfasst.'
