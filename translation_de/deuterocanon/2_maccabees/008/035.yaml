    rationale: Die knappe Wendung kann diejenigen bezeichnen, die in Bezug auf ihn bzw. in seinem Umfeld als die Geringsten galten. Eine weniger festlegende Formulierung wahrt die syntaktische Mehrdeutigkeit; die Fußnote kann sie erläutern.
