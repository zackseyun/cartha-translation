revisions:
- from: So wurde er durch die Hilfe des Herrn von denen gedemütigt, die er für die Geringsten gehalten hatte.[a] Er legte sein prächtiges Gewand ab, zog wie ein Flüchtling ganz allein durch das Binnenland[b] und gelangte nach Antiochia – nachdem er bei der Vernichtung seines Heeres überaus erfolgreich gewesen war.[c]
  to: Nachdem er von denen gedemütigt worden war, die im Vergleich mit ihm als die Geringsten galten,[a] legte er mit Hilfe des Herrn sein prächtiges Gewand ab, machte sich wie ein Flüchtling ganz allein durch das Landesinnere[b] auf den Weg und gelangte nach Antiochia – nachdem er bei der Vernichtung seines Heeres über alle Maßen Erfolg gehabt hatte.[c]
  rationale: Die erforderliche Korrektur ordnet „mit Hilfe des Herrn“ dem Ablegen des Gewands zu, wie es die griechische Syntax nahelegt. Zugleich wird die umstritten knappe Bezugnahme bei καθʼ αὑτόν im Haupttext weniger eng bestimmt und in der Fußnote transparent erläutert. Die Anker a–c bleiben jeweils unmittelbar bei den erläuterten Stellen.
