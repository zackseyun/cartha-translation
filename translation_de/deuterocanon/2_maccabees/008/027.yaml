base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/008/027.yaml
  text: After they had collected their weapons and stripped the spoils from the enemies[a], they devoted themselves to the Sabbath, abundantly blessing and giving thanks to the Lord who had preserved them to this day[b], having appointed for them the beginning of mercy.
translation:
  language: de
  text: Nachdem sie Waffen eingesammelt und den Feinden die Beute abgenommen hatten, wandten sie sich dem Sabbat zu[a]. Dabei priesen sie den Herrn überschwänglich und dankten ihm, der sie bis zu diesem Tag bewahrt und ihnen einen Anfang des Erbarmens bestimmt hatte[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Wendung kann auch bedeuten: „Sie beschäftigten sich mit der Einhaltung des Sabbats.“ Möglicherweise schwingt mit, dass der Sabbat nun herangekommen war.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „Er hatte ihnen den ersten Erweis seiner Barmherzigkeit gewährt.“ Gemeint sein kann, dass diese Rettung den Beginn neu erfahrener göttlicher Gunst markierte.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὁπλολογήσαντες δὲ αὐτούς
  choice: Nachdem sie ihre Waffen eingesammelt hatten
  rationale: Das Verb bezeichnet hier das Einsammeln beziehungsweise Erbeuten von Waffen nach dem Kampf. Das Pronomen wird im Deutschen idiomatisch possessiv wiedergegeben, ohne genauer festzulegen, ob die Waffen zuvor den Gegnern gehörten.
- source_word: τὰ σκῦλα ἐκδύσαντες τῶν πολεμίων
  choice: den Feinden die Beute abgenommen hatten
  rationale: Die Formulierung bewahrt das anschauliche Moment des Abnehmens, klingt aber im modernen Deutschen natürlicher als eine wörtliche Wiedergabe mit „entkleiden“.
- source_word: περὶ τὸ σάββατον ἐγίνοντο
  choice: wandten sie sich dem Sabbat zu
  rationale: Die idiomatische griechische Wendung beschreibt, dass sie ihre Aufmerksamkeit nun dem Sabbat beziehungsweise seiner Einhaltung zuwandten, ohne bestimmte Riten zu nennen.
- source_word: περισσῶς
  choice: überschwänglich
  rationale: Das Adverb verstärkt das Preisen und Danken und bezeichnet ein reiches, überströmendes Lob.
- source_word: εὐλογοῦντες καὶ ἐξομολογούμενοι
  choice: priesen sie ... und dankten ihm
  rationale: Bei auf Gott gerichteter kultischer Sprache bedeutet εὐλογεῖν „preisen“; ἐξομολογεῖσθαι bezeichnet hier dankbares, öffentliches Bekennen beziehungsweise Danken.
- source_word: τῷ κυρίῳ τῷ διασώζοντι εἰς τὴν ἡμέραν ταύτην
  choice: dem Herrn ... der sie bis zu diesem Tag bewahrt hatte
  rationale: „Herr“ ist im Kontext die angemessene Gottesbezeichnung. „Bewahrt“ gibt die rettende Erhaltung bis zum gegenwärtigen Tag wieder.
- source_word: ἀρχὴν ἐλέους τάξαντος αὐτοῖς
  choice: er hatte ihnen einen Anfang des Erbarmens gesetzt
  rationale: Die bewusst ungewöhnliche Wendung erhält sowohl den Gedanken eines von Gott gesetzten Anfangs als auch die Offenheit von ἔλεος zwischen Erbarmen, Barmherzigkeit und neuer Gunst.
theological_decisions:
- issue: Bedeutung von ἀρχὴν ἐλέους τάξαντος αὐτοῖς
  choice: Die Rettung wird als ein von Gott gesetzter Anfang des Erbarmens bezeichnet.
  alternative: Gott hatte ihnen ein erstes Zeichen seiner Barmherzigkeit gewährt.
  rationale: Der Text bezeichnet den Sieg als Beginn göttlichen Erbarmens, ohne ihn als vollständige Wiederherstellung oder als abschließende Erfüllung zu deuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Dem Sabbat zuwenden“ hält die idiomatische Unschärfe des Griechischen offen; „Anfang des Erbarmens“ bewahrt die theologische Spannung der Schlusswendung.
