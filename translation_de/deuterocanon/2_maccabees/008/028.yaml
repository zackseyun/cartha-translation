base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/008/028.yaml
  text: But after the Sabbath[a], having distributed some of the spoils to those who had been oppressed, and to the widows and the orphans[b], they divided the rest among themselves and their children.
translation:
  language: de
  text: Nach dem Sabbat aber gaben sie den Misshandelten[a], den Witwen und den Waisen einen Teil der Beute[b]; den Rest teilten sie unter sich und ihren Kindern auf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „den Bedrängten“ oder „denen, die schlecht behandelt worden waren“. Das griechische Wort bezeichnet allgemein Menschen, die harte oder entehrende Behandlung erlitten haben.'
    reason: lexical_alternative
  - marker: b
    text: „Beute“ kann hier auch mit „Kriegsbeute“ oder „Plündergut“ wiedergegeben werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ δὲ τὸ σάββατον
  choice: Nach dem Sabbat aber
  rationale: μετά mit Akkusativ bezeichnet den Zeitpunkt nach dem Sabbat; δέ markiert einen leichten Fortgang oder Gegensatz und wird durch das unaufdringliche „aber“ bewahrt.
- source_word: τοῖς ἠκισμένοις
  choice: den Misshandelten
  rationale: Das substantivierte Perfekt-Passiv-Partizip bezeichnet Menschen, denen übel mitgespielt wurde oder die schwere Behandlung erlitten haben. „Misshandelte“ wahrt den Bezug auf erlittenes Unrecht, ohne eine feste gesellschaftliche Gruppe vorauszusetzen.
- source_word: ταῖς χήραις καὶ τοῖς ὀρφανοῖς
  choice: den Witwen und den Waisen
  rationale: Die ausdrücklich genannten schutzbedürftigen Gruppen werden mit den geläufigen und präzisen deutschen Bezeichnungen wiedergegeben.
- source_word: μερίσαντες ἀπὸ τῶν σκύλων
  choice: gaben … einen Teil der Beute
  rationale: μερίζω bezeichnet das Zuteilen oder Verteilen; ἀπό zeigt, dass die Gabe aus der Kriegsbeute genommen wurde. Die Formulierung macht idiomatisch deutlich, dass zunächst ein Anteil ausgegeben wurde.
- source_word: τὰ λοιπὰ
  choice: den Rest
  rationale: Gemeint ist der nach der ersten Zuteilung verbleibende Teil der Beute.
- source_word: αὐτοὶ καὶ τὰ παιδία
  choice: unter sich und ihren Kindern
  rationale: αὐτοί bezeichnet die Kämpfer selbst, τὰ παιδία ihre Kinder beziehungsweise die zu ihnen gehörenden Kinder. Das Possessivpronomen ist im Deutschen kontextgemäß und natürlich.
- source_word: διεμερίσαντο
  choice: teilten … auf
  rationale: Die mediale Form bezeichnet das Aufteilen unter den genannten Empfängern; „aufteilen“ gibt dies knapp und idiomatisch wieder.
theological_decisions:
- issue: Sozialethische Reihenfolge bei der Verteilung der Beute
  choice: Zuerst wird ein Teil der Beute den Misshandelten, Witwen und Waisen gegeben; erst danach wird der Rest unter den Kämpfern und ihren Kindern aufgeteilt.
  alternative: Formaler könnte lediglich von einem „Zuteilen aus der Beute“ gesprochen werden, ohne ausdrücklich „einen Teil“ zu nennen.
  rationale: Die Verbindung von μερίσαντες mit ἀπὸ τῶν σκύλων und das anschließende τὰ λοιπά zeigen, dass zunächst ein Anteil für die genannten Bedürftigen ausgesondert und danach der verbleibende Rest verteilt wurde. Dies folgt der sprachlichen Abfolge und fügt keine konfessionelle Deutung hinzu.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau ist gegenüber der griechischen Partizipialkonstruktion behutsam gegliedert, damit die zeitliche und sachliche Reihenfolge klar bleibt. Die Fußnotenmarker stehen unmittelbar bei den jeweils erläuterten Ausdrücken.
