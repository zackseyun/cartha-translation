base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/008/001.yaml
  text: But Judas[a], who was also called Maccabeus, and those with him, slipping in secretly into the villages, were calling together their relatives; and taking in those who had remained in Judaism, they gathered about six thousand.
translation:
  language: de
  text: Judas aber, der auch Makkabäus genannt wurde, und seine Gefährten gelangten unbemerkt in die Dörfer und riefen dort ihre Verwandten zusammen. Sie nahmen diejenigen auf, die am Judentum festgehalten hatten[a], und brachten so sechstausend zusammen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die der jüdischen Lebensweise treu geblieben waren“. Das griechische Wort für „Judentum“ bezeichnet hier die jüdische religiöse Identität und Lebenspraxis im Gegensatz zum hellenisierenden Anpassungsdruck.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεισπορευόμενοι λεληθότως
  choice: gelangten unbemerkt in die Dörfer
  rationale: Die Wendung verbindet eine heimliche Bewegung beziehungsweise ein unauffälliges Eindringen mit dem ausdrücklichen Adverb für verborgenes, unbemerktes Handeln. Die deutsche Formulierung gibt den verdeckten Charakter natürlich wieder, ohne unnötig zu dramatisieren.
- source_word: προσεκαλοῦντο
  choice: riefen dort … zusammen
  rationale: Das Medium bezeichnet hier das Heranrufen von Menschen zur eigenen Gruppe. „Zusammenrufen“ passt zum Aufbau einer Anhängerschaft, ohne eine förmliche militärische Einberufung vorauszusetzen.
- source_word: τοὺς συγγενεῖς
  choice: ihre Verwandten
  rationale: Die Bezeichnung meint verwandte oder durch Herkunft eng verbundene Personen. „Verwandte“ ist im modernen Deutsch klar und geschlechtsneutral.
- source_word: τοὺς μεμενηκότας ἐν τῷ Ἰουδαϊσμῷ
  choice: die am Judentum festgehalten hatten
  rationale: Das Perfektpartizip hebt ihr anhaltendes Verbleiben hervor. „Am Judentum festhalten“ bewahrt den Bezug auf jüdische Identität und Lebenspraxis und klingt im Deutschen natürlicher als „im Judentum bleiben“.
- source_word: προσλαμβανόμενοι
  choice: Sie nahmen … auf
  rationale: Das Verb bezeichnet das Annehmen und Eingliedern weiterer Personen in die eigene Gruppe. „Aufnehmen“ lässt offen, ob dies eher Schutz, Anschluss oder Rekrutierung meint.
- source_word: συνῆγον εἰς ἑξακισχιλίους
  choice: brachten so etwa sechstausend Mann zusammen
  rationale: Das Verb bezeichnet das Versammeln zu einer Gruppe; die Präposition mit der Zahl nennt deren erreichte Größenordnung. „Etwa“ gibt die bei erzählenden Zahlenangaben mögliche Näherung wieder, und „Mann“ macht deutlich, dass hier die zusammengebrachte Anhängerschaft gezählt wird.
- source_word: ὁ καὶ Μακκαβαῖος
  choice: der auch Makkabäus genannt wurde
  rationale: Die Konstruktion führt einen zusätzlichen Namen oder Beinamen des Judas ein. Die Formulierung ist eindeutig und im deutschen Erzählstil natürlich.
theological_decisions:
- issue: Wiedergabe von Ἰουδαϊσμός
  choice: Judentum
  alternative: jüdische Lebensweise
  rationale: Der Ausdruck bezeichnet im Kontext des 2. Makkabäerbuchs die jüdische religiöse und gemeinschaftliche Identität im Gegensatz zum hellenisierenden Anpassungsdruck. „Judentum“ ist die direkte Entsprechung; die Fußnote nennt die stärker entfaltete, ebenfalls mögliche Lesart.
translation_notes:
  register: Moderne, würdige Erzählsprache. Der lange griechische Satz wurde zur besseren Verständlichkeit in zwei deutsche Sätze gegliedert. Die verdeckte Bewegung, die verwandtschaftliche Mobilisierung und die Aufnahme der am Judentum Festhaltenden bleiben als getrennte Handlungsschritte erkennbar.
