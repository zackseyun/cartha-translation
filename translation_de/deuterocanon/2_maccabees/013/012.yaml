base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/013/012.yaml
  text: And when all had done the same together and had implored the merciful Lord with weeping and fasting and prostration for three days without ceasing[a], Judas encouraged them and ordered them to assemble.
translation:
  language: de
  text: Nachdem aber alle gemeinsam dasselbe getan und den barmherzigen Herrn unter Weinen, Fasten und Niederwerfen drei Tage lang unablässig angefleht hatten, sprach Judas ihnen Mut zu und befahl ihnen, sich einzufinden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »sich zu versammeln«; im militärischen Zusammenhang möglicherweise auch: »sich bereitzuhalten«. Das griechische Verb kann bedeuten, zu kommen, einzutreffen oder anwesend zu sein.'
    reason: Das Bedeutungsspektrum von παραγίνεσθαι lässt sowohl eine örtliche Aufforderung als auch eine kontextuell erschlossene militärische Bereitschaft zu.
lexical_decisions:
- source_word: πάντων ... τὸ αὐτὸ ποιησάντων ὁμοῦ
  choice: Nachdem aber alle gemeinsam dasselbe getan hatten
  rationale: Der Genitivus absolutus bezeichnet den vorausgehenden Umstand. »Alle gemeinsam« gibt sowohl πάντων als auch ὁμοῦ wieder; »dasselbe getan« bewahrt den Rückverweis des griechischen Ausdrucks.
- source_word: καταξιωσάντων τὸν ἐλεήμονα κύριον
  choice: den barmherzigen Herrn ... angefleht hatten
  rationale: Im Zusammenhang von Weinen, Fasten und Niederwerfen bezeichnet der Ausdruck ein inständiges Bitten. »Angefleht« gibt diese Intensität in natürlichem Deutsch wieder.
- source_word: τὸν ἐλεήμονα κύριον
  choice: den barmherzigen Herrn
  rationale: ἐλεήμων bezeichnet Barmherzigkeit beziehungsweise Erbarmen; κύριος wird in der an Gott gerichteten Gebetssprache als »Herr« wiedergegeben.
- source_word: μετὰ κλαυθμοῦ καὶ νηστειῶν καὶ προπτώσεως
  choice: unter Weinen, Fasten und Niederwerfen
  rationale: Die Wendung nennt die begleitenden Formen der inständigen Bitte. Das im Deutschen idiomatische Kollektivwort »Fasten« kann den griechischen Plural νηστειῶν umfassen; »Niederwerfen« bewahrt den körperlichen Vollzug von πρόπτωσις verständlicher als das abstraktere »Prostration«.
- source_word: ἐπὶ ἡμέρας τρεῖς ἀδιαλείπτως
  choice: drei Tage lang unablässig
  rationale: ἐπί mit Akkusativ bezeichnet die Dauer, während ἀδιαλείπτως die fortgesetzte Beharrlichkeit ausdrückt.
- source_word: παρακαλέσας αὐτοὺς
  choice: sprach Judas ihnen Mut zu
  rationale: παρακαλέω kann ermutigen, ermahnen oder auffordern bedeuten. Nach der gemeinschaftlichen Klage und vor dem Befehl passt »Mut zusprechen«, ohne den mahnenden Unterton auszuschließen.
- source_word: ἐκέλευσεν παραγίνεσθαι
  choice: befahl ihnen, sich einzufinden
  rationale: παραγίνομαι bezeichnet das Kommen, Eintreffen oder Anwesendsein. »Sich einfinden« wahrt diesen Grundsinn und passt zu einer angeordneten Zusammenkunft, ohne die militärisch erschlossene Bedeutung »sich bereithalten« in den Haupttext einzutragen.
theological_decisions:
- issue: Wiedergabe von κύριον
  choice: Herr
  alternative: Gebieter
  rationale: In diesem Gebetszusammenhang ist »Herr« die natürliche ehrfürchtige Bezeichnung Gottes und fügt keine weitergehende konfessionelle Deutung hinzu.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Partizipialkonstruktion wird als temporaler Nebensatz wiedergegeben. Konkrete und allgemein verständliche Wörter wie »Niederwerfen« und »sich einfinden« vermeiden unnötige Fachsprache; die echte lexikalische Offenheit des Schlussverbs bleibt durch die Fußnote sichtbar.
