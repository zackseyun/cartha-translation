  yaml_path: translation/deuterocanon/2_maccabees/013/011.yaml
  text: '[they were] about to be deprived of the law and fatherland and holy temple[a], and [he urged them] not to allow the people, who had just now recovered a little[b], to become subject to the reviling nations.'
translation:
  language: de
  text: '[Er ermahnte] diejenigen, die im Begriff standen, des Gesetzes, des Vaterlandes[a] und des heiligen Tempels beraubt zu werden, nicht zuzulassen, dass das Volk, das gerade erst ein wenig Erholung erfahren hatte, den schmähenden Völkern[b] unterworfen würde.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Heimatland“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „den lästernden Völkern“. Das griechische Wort kann schmähende, beleidigende oder profane Rede bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῖς ... στερεῖσθαι μέλλουσιν
  choice: denen, die im Begriff standen, ... beraubt zu werden
  rationale: Der Dativ Plural ist syntaktisch vom vorhergehenden Vers abhängig. Die Wiedergabe wahrt diese Abhängigkeit und gibt μέλλω mit Infinitiv sowie den starken Verlustsinn von στερέω präzise wieder.
- source_word: τοῦ νόμου
  choice: des Gesetzes
  rationale: Der bestimmte Artikel und der jüdische Kontext weisen auf das überlieferte Gesetz beziehungsweise die Tora; „das Gesetz“ bewahrt die knappe Form und das religiöse Gewicht.
- source_word: πατρίδος
  choice: des Vaterlandes
  rationale: πατρίς bezeichnet das angestammte Land. „Vaterland“ bewahrt diesen Herkunfts- und Zugehörigkeitssinn; „Heimatland“ bleibt eine mögliche modernere Alternative.
- source_word: ἱεροῦ ἁγίου
  choice: des heiligen Tempels
  rationale: ἱερόν bezeichnet hier den Tempel beziehungsweise Tempelbezirk; „heiliger Tempel“ ist im Deutschen eindeutig, würdevoll und idiomatisch.
- source_word: ἄρτι βραχέως ἀνεψυγμένα
  choice: das sich gerade erst ein wenig erholt hatte
  rationale: Die Formulierung drückt eine eben eingetretene, nur begrenzte Erholung oder Erleichterung aus. Die deutsche Wendung gibt sowohl den zeitlichen als auch den graduellen Aspekt wieder.
- source_word: δυσφήμοις ἔθνεσιν
  choice: der schmähenden Völker
  rationale: δυσφήμος kann üble, beleidigende oder profane Rede bezeichnen. „schmähend“ erhält diese sprachliche Stoßrichtung, ohne sie ausschließlich als Lästerung im engeren theologischen Sinn festzulegen.
- source_word: ὑποχειρίους γενέσθαι
  choice: unter die Gewalt ... geriet
  rationale: Die Wendung bezeichnet das Gelangen unter fremde Macht oder Kontrolle. „unter die Gewalt geraten“ ist natürliches Deutsch und bewahrt die Stärke des Ausdrucks.
theological_decisions:
- issue: Syntaktische Abhängigkeit des Versanfangs vom vorhergehenden Kontext
  choice: Den Vers als abhängigen Satzteil mit „denen, die ...“ beginnen lassen
  alternative: Einen selbstständigen Satz mit ergänztem Subjekt und Prädikat bilden, etwa „Sie standen im Begriff ...“
  rationale: τοῖς ... μέλλουσιν steht im Dativ Plural und hängt grammatisch vom vorhergehenden Vers ab. Eine Ergänzung zu einem selbstständigen Satz würde die Syntax stärker umdeuten und ein nicht ausdrücklich vorhandenes Prädikat einführen.
- issue: Bedeutungsumfang von δυσφήμοις
  choice: „schmähenden“
  alternative: „lästernden“ oder „gotteslästerlichen“
  rationale: Das griechische Wort kann schmähende, übelredende oder profane Rede bezeichnen. Die gewählte Fassung bewahrt diesen Spielraum, ohne eine ausschließlich theologische Deutung festzuschreiben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die vom vorhergehenden Vers abhängige Satzform bleibt erhalten; unnötige Ergänzungen in eckigen Klammern werden vermieden. Die Wortwahl ist verständlich, ohne die Mehrdeutigkeit von δυσφήμοις vorschnell theologisch einzuengen.
