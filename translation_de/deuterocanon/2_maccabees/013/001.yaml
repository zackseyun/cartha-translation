translation:
  language: de
  text: Im 149. Jahr wurde den Leuten um Judas bekannt[a], dass Antiochus Eupator mit Streitkräften gegen Judäa gekommen war.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder im Sinn eines eintretenden Geschehens: »Im 149. Jahr geschah es den Leuten um Judas, dass Antiochus Eupator mit Streitkräften gegen Judäa gekommen war.« Das griechische Verb kann sowohl ein eintretendes Geschehen als auch etwas bezeichnen, das Judas’ Gruppe zur Kenntnis gelangt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔτῳ δὲ ἐνάτῳ καὶ τεσσερακοστῷ καὶ ἑκατοστῷ ἔτει
  choice: Im 149. Jahr
  rationale: Der zeitliche Dativ bezeichnet den Zeitpunkt. Die ungewöhnliche griechische Auszählung wird in natürlichem Deutsch als Ordinalzahl wiedergegeben.
- source_word: προσέπεσεν
  choice: wurde ... bekannt
  rationale: Das Verb kann hier ein Geschehen oder eine Meldung bezeichnen, die den Betreffenden erreicht. Die gewählte Formulierung passt zur folgenden Inhaltsangabe, ohne ausdrücklich eine nicht genannte »Nachricht« einzuführen; die mögliche ereignishafte Lesart bleibt in der Fußnote erhalten.
- source_word: τοῖς περὶ τὸν Ἰούδαν
  choice: den Leuten um Judas
  rationale: Die Wendung bezeichnet Judas’ Gefährten beziehungsweise seine Gruppe. »Leute um Judas« bleibt nahe am griechischen Ausdruck und setzt nicht eigens voraus, dass ausschließlich Männer gemeint sind.
- source_word: Ἀντίοχον τὸν Εὐπάτορα
  choice: Antiochus Eupator
  rationale: Name und Beiname werden in der üblichen deutschen Namensform wiedergegeben.
- source_word: παραγεγόνα
  choice: herangerückt war
  rationale: Die Perfektform bezeichnet eine bereits vollzogene Ankunft mit gegenwärtiger Bedeutung. Im militärischen Zusammenhang gibt »herangerückt war« sowohl die Bewegung als auch deren bedrohlichen Charakter natürlich wieder.
- source_word: σὺν πλήθεσιν
  choice: mit zahlreichen Truppen
  rationale: Das pluralische πλήθη meint hier größere Truppenkörper oder Streitkräfte. »Zahlreiche Truppen« ist verständlich, militärisch passend und vermeidet das unnatürliche »mit Mengen«.
- source_word: ἐπὶ τὴν Ἰουδαίαν
  choice: gegen Judäa
  rationale: ἐπί mit Akkusativ bezeichnet im Kontext eines militärischen Vormarschs die feindliche Stoßrichtung.
