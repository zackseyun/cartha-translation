base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/013/008.yaml
  text: Very justly[a]; for because he had committed many sins against the altar, whose fire and ashes were holy[b], he met his death in ashes.
translation:
  language: de
  text: Völlig zu Recht[a]. Denn weil er am Altar viele Sünden begangen hatte, dessen Feuer und Asche heilig[b] waren, fand er in der Asche den Tod[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Vollkommen gerecht.“ Die griechische Wendung hebt hervor, dass sein Schicksal verdient war.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „rein“. Gemeint ist im kultischen Zusammenhang die geweihte Reinheit von Feuer und Asche des Altars.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlicher: „empfing er in der Asche den Tod“. Die Formulierung greift wahrscheinlich seine Sünden am Altar und dessen Asche auf.'
    reason: literal_rendering
lexical_decisions:
- source_word: πάνυ δικαίως
  choice: Völlig zu Recht
  rationale: πάνυ verstärkt δικαίως; die Wendung bezeichnet das Schicksal des Mannes nachdrücklich als verdient und klingt im heutigen Deutsch natürlich.
- source_word: συνετέλεσεν ... ἁμαρτήματα
  choice: hatte ... Sünden begangen
  rationale: Die Verbindung bezeichnet das Vollbringen beziehungsweise Begehen sündiger Taten. Das Plusquamperfekt gibt den zeitlichen Bezug zur anschließenden Todesfolge wieder.
- source_word: πολλὰ ... ἁμαρτήματα
  choice: viele Sünden
  rationale: Diese Wiedergabe bewahrt den religiös-moralischen Gehalt von ἁμαρτήματα und schwächt ihn nicht zu bloßen Vergehen ab.
- source_word: περὶ τὸν βωμόν
  choice: am Altar
  rationale: περί bezeichnet hier den Bereich beziehungsweise Gegenstand seines sakrilegischen Handelns. „Am Altar“ bleibt gegenüber „gegen den Altar“ etwas offener und ist im Deutschen idiomatisch.
- source_word: ἁγνόν
  choice: heilig
  rationale: Im kultischen Zusammenhang bezeichnet ἁγνός die geweihte Reinheit des Altarfeuers und der Asche; „heilig“ vermittelt diesen Sinn verständlich.
- source_word: σποδός
  choice: Asche
  rationale: Der griechische Kollektivsingular wird im Deutschen natürlich mit dem Singular „Asche“ wiedergegeben; die Wiederholung bleibt erhalten.
- source_word: ἐν σποδῷ τὸν θάνατον ἐκομίσατο
  choice: fand er in der Asche den Tod
  rationale: Die idiomatische Formulierung bewahrt sowohl die Ortsangabe „in der Asche“ als auch die zugespitzte Verbindung zwischen Vergehen und Todesart.
theological_decisions:
- issue: Kultische Beschreibung von Feuer und Asche des Altars
  choice: dessen Feuer und Asche heilig waren
  alternative: dessen Feuer rein war und ebenso die Asche
  rationale: Obwohl ἁγνός auch „rein“ bedeuten kann, legt der Tempel- und Altarkontext kultische Heiligkeit nahe. Die koordinierte deutsche Formulierung bezieht die Eigenschaft wie im Sinnzusammenhang auf Feuer und Asche, ohne eine zusätzliche dogmatische Aussage einzutragen.
- issue: Beziehung der Sünden zum Altar
  choice: am Altar viele Sünden begangen
  alternative: viele Sünden gegen den Altar begangen
  rationale: περὶ τὸν βωμόν kann den Bereich oder Gegenstand der Verfehlungen bezeichnen. „Am Altar“ bewahrt diese gewisse Offenheit, während der Kontext den sakrilegischen Charakter bereits deutlich macht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Eröffnung und die bewusste Wiederholung von „Asche“ erhalten die zugespitzte, vergeltende Aussage des griechischen Textes.
