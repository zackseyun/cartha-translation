revisions:
- from: Er griff die Männer um Judas an, wurde aber besiegt. In seiner Verzweiflung ging er gegen Philippus in Antiochia vor, der mit der Führung der Regierungsgeschäfte betraut worden war; da geriet er in Verwirrung.[a] Er wandte sich an die Juden, gab nach und beschwor alle gerechten Bedingungen.[b] So kam es zu einer Einigung. Er brachte ein Opfer dar, erwies dem Heiligtum und dem Ort Ehre und zeigte sich wohlwollend.
  to: Er griff die Männer um Judas an, wurde aber besiegt. In seiner Verzweiflung ging er gegen Philippus vor, der in Antiochia zur Führung der Regierungsgeschäfte zurückgelassen worden war; da geriet er in Verwirrung.[a] Er wandte sich an die Juden, gab nach und schwor allem zu, was recht war.[b] Er kam zu einer Einigung, brachte ein Opfer dar, erwies dem Heiligtum und dem Ort Ehre und zeigte sich wohlwollend.
  rationale: Die Revision korrigiert die unzutreffende deutsche Verbwahl bei ὤμοσεν, erhält die lexikalische Offenheit von ἐπὶ πᾶσι τοῖς δικαίοις und belässt die schwierige Aussage über Philippus vorsichtig mit Fußnote. Die Ergänzung „in Antiochia ... zurückgelassen“ bildet ἐν Ἀντιοχίᾳ und ἀπολελειμμένον genauer ab. Kultische und örtliche Begriffe bleiben unverändert sachgerecht.
