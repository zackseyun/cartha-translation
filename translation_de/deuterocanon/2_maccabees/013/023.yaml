  naturalness: Modernes, würdiges Deutsch ist überwiegend erreicht. „beschwor ... Bedingungen“ ist im Deutschen semantisch falsch bzw. missverständlich; „schwor allem zu, was recht war“ ist idiomatisch und bewahrt die Offenheit des griechischen Ausdrucks. Die Einigung lässt sich direkter dem handelnden Subjekt zuordnen.
  terminology: „Philippus“, „Heiligtum“ und „brachte ein Opfer dar“ sind sachgerecht. „schwor allem zu, was recht war“ vermeidet eine zu starke Festlegung auf Vertragsbedingungen; die mögliche Deutung als gerechte Bedingungen bleibt in der Fußnote erhalten.
