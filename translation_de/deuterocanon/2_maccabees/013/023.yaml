base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/013/023.yaml
  text: He attacked those around Judas[a], but was defeated. Having become desperate, he took action against Philip in Antioch, the one left in charge of affairs; he was thrown into confusion, appealed to the Jews, submitted, and swore to all the just terms. He was reconciled and offered sacrifice, honored the sanctuary and the place[b], and showed kindness.
translation:
  language: de
  text: Er griff die Männer um Judas an, wurde aber besiegt. In seiner Verzweiflung ging er gegen Philippus vor, der in Antiochia zur Führung der Regierungsgeschäfte zurückgelassen worden war; da geriet er in Verwirrung.[a] Er wandte sich an die Juden, gab nach und schwor allem zu, was recht war.[b] Er kam zu einer Einigung, brachte ein Opfer dar, erwies dem Heiligtum und dem Ort Ehre und zeigte sich wohlwollend.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die griechische Satzfolge bei der Handlung gegenüber Philippus und der anschließenden Verwirrung ist stark gerafft und schwer zu deuten; was genau der König gegenüber Philippus tat, bleibt unsicher.
    reason: textual_variant
  - marker: b
    text: 'Oder: „allen gerechten Bedingungen“. Die Wendung kann allgemein alles Gerechte oder konkreter die gerechten Bedingungen einer Vereinbarung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσέβαλεν τοῖς περὶ τὸν Ἰούδαν
  choice: griff die Männer um Judas an
  rationale: προσβάλλω bezeichnet hier einen militärischen Angriff; die Umschreibung τοῖς περὶ τὸν Ἰούδαν meint Judas und besonders die zu ihm gehörenden Männer, ohne ihn ausdrücklich als direktes Objekt zu nennen.
- source_word: ἥττων ἐγένετο
  choice: wurde besiegt
  rationale: Die Wendung bezeichnet im militärischen Zusammenhang, dass jemand unterliegt.
- source_word: ἀπονοηθεὶς
  choice: in seiner Verzweiflung
  rationale: Das Partizip beschreibt einen Zustand der Ratlosigkeit oder Verzweiflung nach der Niederlage.
- source_word: μετέλαβεν ... τὸν Φίλιππον
  choice: ging ... gegen Philippus ... vor
  rationale: Die stark geraffte Konstruktion ist unsicher. Diese Wiedergabe bezeichnet eine entschiedene Handlung gegenüber Philippus, ohne eine nicht eindeutig bezeugte Einzelmaßnahme wie Gefangennahme oder Bündnis zu behaupten.
- source_word: τὸν ἀπολελειμμένον ἐπὶ τῶν πραγμάτων
  choice: der mit der Führung der Regierungsgeschäfte betraut worden war
  rationale: Die Formulierung bezeichnet Philippus als denjenigen, der in Antiochia mit politisch-administrativer Verantwortung zurückgelassen worden war.
- source_word: συνεχύθη
  choice: geriet er in Verwirrung
  rationale: Das Passiv beschreibt, dass er in Unruhe oder Verwirrung versetzt wurde.
- source_word: τοὺς Ἰουδαίους παρεκάλεσεν
  choice: Er wandte sich an die Juden
  rationale: παρακαλέω kann bitten, auffordern oder anrufen bedeuten; im diplomatischen Zusammenhang lässt die offene Formulierung den genauen Ton der Kontaktaufnahme unbestimmt.
- source_word: ὑπετάγη
  choice: gab nach
  rationale: Das passive Verb bezeichnet hier Unterordnung oder Nachgeben; im Zusammenhang von Verhandlungen ist „gab nach“ natürlich und weniger missverständlich als „unterwarf sich“.
- source_word: ὤμοσεν ἐπὶ πᾶσι τοῖς δικαίοις
  choice: beschwor alle gerechten Bedingungen
  rationale: Die Wendung kann auf sämtliche als gerecht geltenden Vereinbarungsbedingungen oder allgemeiner auf alles Gerechte bezogen werden. „Bedingungen“ passt zum diplomatischen Kontext, bleibt aber durch eine Fußnote als Deutung kenntlich.
- source_word: συνελύθη
  choice: So kam es zu einer Einigung
  rationale: Im Anschluss an Nachgeben und Eid bezeichnet das Verb die Beilegung des Konflikts beziehungsweise einen Vergleich.
- source_word: θυσίαν προσήγαγεν
  choice: brachte ein Opfer dar
  rationale: Dies ist die übliche kultische Bedeutung der Wendung und entspricht natürlichem deutschem Bibelstil.
- source_word: ἐτίμησεν τὸν νεὼ καὶ τὸν τόπον
  choice: erwies dem Heiligtum und dem Ort Ehre
  rationale: νεώς bezeichnet das Heiligtum beziehungsweise Tempelgebäude; die parallele Nennung von „Ort“ wird bewahrt, ohne beide Begriffe zusammenzuziehen.
- source_word: ἐφιλανθρώπησεν
  choice: zeigte sich wohlwollend
  rationale: Das Verb bezeichnet menschenfreundliches, gnädiges oder gütiges Verhalten; das im Griechischen nicht ausdrücklich genannte Objekt wird nicht ergänzt.
theological_decisions:
- issue: Kultische Begriffe für νεώς und θυσίαν προσήγαγεν
  choice: „Heiligtum“ und „brachte ein Opfer dar“
  alternative: „Tempel“ und „opferte“
  rationale: Die gewählte Fassung bewahrt die konkrete kultische Handlung und unterscheidet das Heiligtum vom anschließend genannten Ort, ohne spätere dogmatische Vorstellungen einzutragen.
- issue: Mehrdeutige diplomatische Formel ἐπὶ πᾶσι τοῖς δικαίοις
  choice: „alle gerechten Bedingungen“ mit Fußnote
  alternative: „alles, was gerecht war“
  rationale: Der Zusammenhang legt Vereinbarungsbedingungen nahe, doch die allgemeinere Bedeutung bleibt sprachlich möglich und wird deshalb ausdrücklich dokumentiert.
- issue: Schwierige Satzfolge um μετέλαβεν ... τὸν Φίλιππον ... συνεχύθη
  choice: Vorsichtige Wiedergabe als Vorgehen gegen Philippus und anschließende Verwirrung
  alternative: Philippus gefangen nehmen, sich an ihn wenden oder mit ihm verhandeln
  rationale: Der griechische Text ist stark gerafft und lässt die genaue Handlung nicht sicher erkennen. Die Übersetzung erhält den Handlungsablauf, ohne eine theologisch oder historisch folgenreiche Präzisierung zu erzwingen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit gut verständlicher historischer und kultischer Sprache. „Philippus“ folgt der im deutschen Bibel- und Altertumsstil üblichen Namensform. Die kurzen griechischen Hauptsätze werden maßvoll gegliedert; sachliche und syntaktische Unsicherheiten werden nicht verdeckt.
