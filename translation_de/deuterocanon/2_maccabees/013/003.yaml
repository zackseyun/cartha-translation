  source_fidelity: Der Entwurf trifft den Anschluss des Menelaus an die Gruppe, den durativen Charakter von παρεκάλει sowie den Gegensatz zwischen dem vorgeblichen Gemeinwohl und seinem persönlichen Machtstreben im Wesentlichen. „drängte Antiochus ... dazu“ lässt jedoch im Deutschen offen, wozu er ihn drängte, obwohl das Griechische allgemein ein eindringliches Zureden bezeichnet. „zur Herrschaft eingesetzt“ gibt ἐπὶ τῆς ἀρχῆς κατασταθήσεται angemessener und idiomatischer wieder als „in die Herrschaft eingesetzt“.
  naturalness: 'Eine sichere stilistische Korrektur ist angezeigt: „jemanden immer wieder dazu drängen“ verlangt gewöhnlich eine ergänzte Handlung. „Antiochus immer wieder zureden“ ist modernes, natürliches Deutsch und wahrt die im Griechischen nicht näher bestimmte Aufforderung. „Mit viel Verstellung“ ist zudem eine idiomatischere Wiedergabe von μετὰ πολλῆς εἰρωνίας als das abstrakte „mit großer Unaufrichtigkeit“.'
