base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/013/003.yaml
  text: Menelaus also joined them and[a], with great insincerity, kept urging Antiochus on—not for the safety of the fatherland[b], but because he thought he would be established in power.
translation:
  language: de
  text: Auch Menelaus schloss sich ihnen an und redete Antiochus mit viel Verstellung[a] immer wieder zu – nicht zum Wohl des Vaterlandes[b], sondern weil er meinte, zur Herrschaft eingesetzt zu werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit großer Unaufrichtigkeit“; das griechische Wort kann ein geheucheltes Auftreten oder das Verbergen der wahren Beweggründe bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „zur Rettung der Heimat“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: συνέμιξεν
  choice: schloss sich ihnen an
  rationale: Das Verb bezeichnet hier, dass Menelaus sich der Gruppe anschloss. Die deutsche Wendung ist natürlich und gibt den erzählerischen Zusammenhang klar wieder.
- source_word: παρεκάλει
  choice: drängte ... immer wieder dazu
  rationale: Der Imperfekt bezeichnet ein fortgesetztes oder wiederholtes Einwirken. Die Formulierung bewahrt sowohl diesen Aspekt als auch den auffordernden Sinn des Verbs.
- source_word: μετὰ πολλῆς εἰρωνίας
  choice: mit großer Unaufrichtigkeit
  rationale: εἰρωνία meint hier eher Verstellung und das Verschleiern der wahren Beweggründe als Ironie im heutigen deutschen Sinn. „Unaufrichtigkeit“ gibt die moralische Wertung verständlich wieder, ohne die konkrete Art des Auftretens weiter auszumalen.
- source_word: σωτηρίᾳ
  choice: Rettung
  rationale: σωτηρία bezeichnet in diesem politischen Zusammenhang die Bewahrung oder Rettung des Landes, nicht ausdrücklich ein theologisches Heilsgeschehen.
- source_word: πατρίδος
  choice: des Vaterlandes
  rationale: πατρίς bezeichnet das angestammte Land. „Vaterland“ bewahrt den ancestral-patriotischen und leicht gehobenen Ton des griechischen Ausdrucks.
- source_word: ἐπὶ τῆς ἀρχῆς κατασταθήσεται
  choice: er werde in die Herrschaft eingesetzt werden
  rationale: Die Formulierung bewahrt sowohl das Einsetzen in eine Stellung als auch den Herrschafts- oder Amtscharakter von ἀρχή, ohne die Art oder Reichweite dieser Stellung vorschnell genauer festzulegen.
theological_decisions:
- issue: Moralische Charakterisierung von Menelaus durch εἰρωνία
  choice: „mit großer Unaufrichtigkeit“ statt des formgleichen „mit großer Ironie“
  alternative: „mit großer Verstellung“
  rationale: Der Kontext stellt den vorgegebenen Einsatz für das Vaterland seinem eigennützigen Streben nach Herrschaft gegenüber. „Ironie“ würde im modernen Deutschen wahrscheinlich als spöttische oder uneigentliche Rede missverstanden; „Unaufrichtigkeit“ wahrt die ethische Spannung.
- issue: Bezug von σωτηρία
  choice: politisch-konkrete „Rettung des Vaterlandes“
  alternative: „Wohlergehen der Heimat“
  rationale: Im Zusammenhang geht es um die Bewahrung des Landes. Die Übersetzung vermeidet eine unnötige dogmatische Aufladung, lässt aber den starken Rettungsbegriff des Griechischen stehen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Vaterland“ ist bewusst leicht gehoben, um die angestammte und patriotische Nuance von πατρίς zu bewahren. Der Gedankenstrich hebt den ausdrücklichen Gegensatz zwischen dem vorgegebenen öffentlichen Anliegen und dem eigennützigen Beweggrund hervor.
