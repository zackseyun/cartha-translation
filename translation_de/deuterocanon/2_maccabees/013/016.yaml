  text: And in the end they filled the camp with fear and confusion[a], and withdrew prosperously.
translation:
  language: de
  text: Schließlich erfüllten sie das Lager mit Furcht und Verwirrung und zogen erfolgreich ab.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „zogen ab, wobei es ihnen gut erging“; auch möglich: „zogen wohlbehalten ab“. Das griechische Partizip εὐημεροῦντες bezeichnet, dass es ihnen gut beziehungsweise erfolgreich erging.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ τέλος
  choice: schließlich
  rationale: Die Wendung markiert hier den abschließenden Ausgang des Geschehens; „schließlich“ ist im Deutschen natürlich und prägnant.
- source_word: παρεμβολήν
  choice: das Lager
  rationale: Im militärischen Zusammenhang bezeichnet das Substantiv das Heerlager oder die dort versammelte Streitmacht. „Das Lager“ bewahrt die konkrete Aussage.
- source_word: δέους
  choice: Furcht
  rationale: Das Wort bezeichnet Furcht oder Schrecken. „Furcht“ gibt die Bedeutung wieder, ohne die Intensität unnötig zu steigern.
- source_word: ταραχῆς
  choice: Verwirrung
  rationale: Der Begriff umfasst Unruhe, Erschütterung und Unordnung; „Verwirrung“ passt zum militärischen Zusammenhang und zur Verbindung mit „Furcht“.
- source_word: ἐπλήρωσαν
  choice: erfüllten
  rationale: Das Verb bedeutet „füllen“. Die gehobene, aber geläufige Formulierung „mit Furcht und Verwirrung erfüllen“ ist im Deutschen idiomatisch.
- source_word: ἐξέλυσαν
  choice: zogen ... ab
  rationale: Im militärischen Zusammenhang bezeichnet das Verb den Aufbruch beziehungsweise Rückzug. „Abziehen“ ist natürlicher und kontextgerechter als das allgemeinere „weggehen“.
- source_word: εὐημεροῦντες
  choice: erfolgreich
  rationale: Das Partizip bezeichnet ein Wohlergehen oder günstiges Ergehen. Auf den militärischen Abzug bezogen gibt „erfolgreich“ den Sinn idiomatisch wieder, während die Fußnote die wörtlichere Bedeutungsbreite offenhält.
