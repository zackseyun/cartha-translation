  source_fidelity: „Schließlich“ gibt τὸ τέλος als abschließende zeitliche Wendung angemessen wieder. „Sie erfüllten das Lager mit Furcht und Verwirrung“ bildet Konstruktion und Bedeutungsumfang von τὴν παρεμβολὴν δέους καὶ ταραχῆς ἐπλήρωσαν präzise ab. „Zogen erfolgreich ab“ ist eine idiomatische, kontextgerechte Wiedergabe von ἐξέλυσαν εὐημεροῦντες und vermeidet die unbelegte Zuspitzung auf einen bestimmten militärischen Erfolg oder auf Unversehrtheit.
  naturalness: Der Satz ist flüssiges modernes Standarddeutsch und wahrt den knappen, erzählenden Registerton. „Furcht und Verwirrung“ ist eine natürliche Verbindung; „abziehen“ passt zum militärischen Kontext.
  terminology: „Lager“ ist für παρεμβολή sachgerecht. „Furcht“ und „Verwirrung“ bewahren die abgestufte, nicht übersteigerte Bedeutung von δέος und ταραχή. Die Fußnote erläutert εὐημεροῦντες zutreffend und hält mit „wohlbehalten“ eine mögliche, aber nicht im Haupttext festgelegte Nuance offen.
