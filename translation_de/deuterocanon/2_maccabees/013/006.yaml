base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/013/006.yaml
  text: Here everyone pushes on to destruction the man guilty of temple robbery[a], or one who has committed some outstanding excess of other evils.
translation:
  language: de
  text: Dort stoßen alle den, der sich des Tempelraubs[a] schuldig gemacht hat, oder auch den, der sich durch besonders schwere andere Untaten hervorgetan hat, ins Verderben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Frevel an einem Heiligtum“. Das griechische Wort bezeichnet insbesondere die Beraubung oder Verletzung eines Tempels beziehungsweise Heiligtums.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνταῦθα
  choice: Hier
  rationale: Bewahrt den unmittelbaren örtlichen Verweis und ist im Deutschen natürlich.
- source_word: ἱεροσυλίας
  choice: Tempelraub
  rationale: Bezeichnet konkret die Beraubung oder Verletzung eines Heiligtums; die Wiedergabe ist präziser als das allgemeinere „Sakrileg“.
- source_word: ἔνοχον
  choice: sich … schuldig gemacht
  rationale: Gibt den rechtlich-moralischen Sinn der Schuld an einem Vergehen idiomatisch wieder.
- source_word: ὑπεροχὴν πεποιημένον
  choice: sich … hervorgetan hat
  rationale: Die ungewöhnliche Wendung bezeichnet ein Hervorragen beziehungsweise ein außergewöhnliches Maß im Bösen; die Formulierung wahrt diesen Gedanken in natürlichem Deutsch.
- source_word: τινων ἄλλων κακῶν
  choice: besonders schwere andere Untaten
  rationale: „Untaten“ erfasst den moralischen und verbrecherischen Sinn von κακά; „besonders schwere“ bringt zusammen mit der verbalen Wendung den Gedanken von ὑπεροχή zum Ausdruck.
- source_word: ἅπαντες
  choice: alle
  rationale: Gibt die umfassende Beteiligung knapp und unmittelbar wieder.
- source_word: προωθοῦσιν εἰς ὄλεθρον
  choice: stoßen … ins Verderben
  rationale: Bewahrt die körperliche Stoßbewegung des Verbs und das tödliche Ergebnis, ohne ὄλεθρος unnötig auf ein einzelnes deutsches Todeswort festzulegen.
theological_decisions:
- issue: Bedeutungsumfang von ἱεροσυλία
  choice: Tempelraub
  alternative: Sakrileg; Frevel an einem Heiligtum
  rationale: Der griechische Ausdruck benennt spezifisch die Beraubung oder Verletzung eines Heiligtums. „Tempelraub“ wahrt diesen konkreten Kern, während die Fußnote die weiter gefasste Alternative nennt.
- issue: Wiedergabe von ὄλεθρος
  choice: Verderben
  alternative: Tod; Vernichtung
  rationale: „Verderben“ erhält die starke, aber nicht völlig spezifizierte Bedeutung des griechischen Wortes; im geschilderten Zusammenhang schließt sie den Tod ein, ohne ihn interpretierend zum alleinigen Lexem zu machen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz bewahrt die konkrete Stoßbewegung und den örtlichen Hinweis; die etwas sperrige griechische Wendung für außergewöhnlich schweres Böses wird idiomatisch, aber ohne Abschwächung wiedergegeben.
