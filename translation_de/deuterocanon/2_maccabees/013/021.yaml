  text: But Rhodocus, from the Jewish ranks, disclosed the secrets to the enemies; he was sought out and caught and imprisoned.
translation:
  language: de
  text: Doch Rhodokus aus den Reihen der Juden verriet den Feinden die geheimen Pläne. Man suchte nach ihm, ergriff ihn und sperrte ihn ein.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσήγγειλεν
  choice: verriet
  rationale: Das Verb bedeutet hier, den Feinden etwas zu melden oder mitzuteilen; im Zusammenhang geheimer Informationen gibt „verriet“ die illoyale Preisgabe natürlich und prägnant wieder.
- source_word: τὰ μυστήρια
  choice: die geheimen Pläne
  rationale: Gemeint sind vertrauliche militärische Informationen, nicht religiöse „Mysterien“. „Geheime Pläne“ wahrt den bestimmten, kontextbezogenen Sinn.
- source_word: ἐκ τῆς Ἰουδαϊκῆς τάξεως
  choice: aus den Reihen der Juden
  rationale: τάξις kann eine geordnete Gruppe oder militärische Formation bezeichnen. Die Formulierung bleibt nahe am Griechischen und klingt im Deutschen natürlich.
- source_word: ἀνεζητήθη
  choice: Man suchte nach ihm
  rationale: Das Passiv wird im Deutschen idiomatisch unpersönlich wiedergegeben; die verstärkte Suchhandlung von ἀναζητέω bleibt erhalten.
- source_word: κατελήμφθη
  choice: ergriff ihn
  rationale: Das Verb bezeichnet hier das Ergreifen beziehungsweise Festnehmen der gesuchten Person.
- source_word: κατεκλείσθη
  choice: sperrte ihn ein
  rationale: Die Formulierung gibt das Einschließen oder Gefangensetzen verständlich wieder, ohne eine im Ausgangstext nicht näher bestimmte Haftform festzulegen.
