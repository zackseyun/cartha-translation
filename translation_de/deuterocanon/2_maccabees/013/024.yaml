  text: And he received Maccabaeus favorably[a], and left Hegemonides as commander from Ptolemais as far as the Gerrenians,
translation:
  language: de
  text: Und er nahm Makkabäus freundlich auf und ließ Hegemonides als Befehlshaber für das Gebiet von Ptolemaïs bis zu den Gennern[a] zurück.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die griechische Bezeichnung „Genner“ ist textlich und geografisch unsicher; möglicherweise ist ein Volk oder ein Gebiet gemeint. Die Übersetzung gibt die griechische Namensform wieder, ohne eine genauere Identifizierung festzulegen.
    reason: textual_variant
lexical_decisions:
- source_word: ἐπεδέξατο
  choice: nahm … freundlich auf
  rationale: Das Medium bezeichnet hier mehr als ein bloßes Annehmen und kann eine wohlwollende Aufnahme ausdrücken. Die Formulierung gibt diese Nuance natürlich wieder.
- source_word: κατέλειπεν
  choice: ließ … zurück
  rationale: Dies entspricht der Grundbedeutung des Verbs. Aus dem Zusammenhang ergibt sich zugleich, dass Hegemonides in einer amtlichen Stellung zurückgelassen wurde.
- source_word: στρατηγόν
  choice: Befehlshaber
  rationale: Der Ausdruck bezeichnet einen militärischen Führer, ohne dass hier ein genauer moderner Dienstgrad festgelegt werden sollte.
- source_word: ἀπὸ Πτολεμαΐδος ἕως τῶν Γεννήρων
  choice: für das Gebiet von Ptolemaïs bis zu den Gennern
  rationale: Die Wendung beschreibt den räumlichen Zuständigkeitsbereich. Das ergänzte „für das Gebiet“ macht die Funktion der Grenzangaben im Deutschen deutlich, ohne eine präzisere geografische Identifikation zu behaupten.
- source_word: Ἡγεμονίδην
  choice: Hegemonides
  rationale: Der Personenname wird nach der griechischen Form transliteriert.
- source_word: Μακκαβαῖον
  choice: Makkabäus
  rationale: Die im Deutschen eingebürgerte Form des griechischen Namens wird verwendet.
