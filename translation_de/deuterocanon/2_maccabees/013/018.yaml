  text: But the king[a], having learned by experience the Jews’ boldness, tried to take the strongholds by stratagems[c][b],
translation:
  language: de
  text: Doch der König hatte die Kühnheit der Juden selbst erfahren[a] und versuchte, die Stellungen mit Kriegslisten einzunehmen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »hatte Erfahrung von der Kühnheit der Juden genommen«.'
    reason: lexical_alternative
  - marker: b
    text: 'Die griechische Verbform ist hier in ihrer genauen Bedeutung unsicher; möglich ist auch: »griff die Stellungen mit Kriegslisten an«. Für »Stellungen« steht wörtlich »die Orte«; der militärische Zusammenhang legt verteidigte Positionen nahe.'
    reason: textual_or_lexical_ambiguity
lexical_decisions:
- source_word: εἰληφὼς πεῖραν
  choice: hatte … selbst erfahren
  rationale: Die griechische Wendung bedeutet wörtlich etwa »Erfahrung genommen/gemacht haben«. Die deutsche Fassung gibt die durch eigene Erfahrung gewonnene Erkenntnis natürlich wieder.
- source_word: εὐτολμίας
  choice: Kühnheit
  rationale: Das Wort bezeichnet entschlossene Bereitschaft zu kühnem Handeln. »Kühnheit« wahrt die mögliche positive oder negative Wertung besser als »Mut« beziehungsweise »Dreistigkeit«.
- source_word: κατεῖρασεν
  choice: versuchte … einzunehmen
  rationale: Die seltene und im Zusammenhang schwierige Verbform bezeichnet hier wahrscheinlich ein feindliches Vorgehen gegen militärische Stellungen. Die Fassung folgt der im Kontext plausiblen Bedeutung, ohne einen erfolgreichen Ausgang zu behaupten.
- source_word: διὰ μεθόδων
  choice: mit Kriegslisten
  rationale: μέθοδοι sind hier im militärischen Zusammenhang planvolle taktische Mittel oder Listen, nicht bloß neutrale »Methoden«.
- source_word: τοὺς τόπους
  choice: die befestigten Stellungen
  rationale: τόποι bedeutet wörtlich »Orte«, bezieht sich hier aber dem militärischen Zusammenhang nach auf verteidigte Positionen. »Befestigte Stellungen« macht diesen Bezug verständlich, ohne zwingend große Festungen vorauszusetzen.
