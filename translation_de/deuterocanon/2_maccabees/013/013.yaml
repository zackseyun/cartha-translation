base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/013/013.yaml
  text: But he himself[a], after meeting with the elders, decided, before the king’s army could invade Judea and gain control of the city, to go out and decide the matter with the help of God.
translation:
  language: de
  text: Er aber kam mit den Ältesten zu einer Beratung im kleinen Kreis zusammen und beschloss, noch bevor das Heer des Königs in Judäa einfallen und die Stadt in ihre Gewalt bringen konnte, dass sie hinausziehen und mit Gottes Hilfe die Angelegenheit entscheiden sollten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die Angelegenheit zu klären« beziehungsweise »die Lage zu beurteilen«. Der griechische Ausdruck ist weit gefasst und kann die Bewältigung der gegenwärtigen Krise bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθʼ ἑαυτὸν ... σὺν τοῖς πρεσβυτέροις γενόμενος
  choice: beriet sich im kleinen Kreis mit den Ältesten
  rationale: καθʼ ἑαυτόν kann hier wegen der anschließenden Gemeinschaft mit den Ältesten nicht gut ‚allein‘ bedeuten, sondern bezeichnet eine gesonderte, nicht öffentliche Beratung; γενόμενος σὺν τοῖς πρεσβυτέροις wird im Zusammenhang natürlich als Zusammenkunft zur Beratung wiedergegeben.
- source_word: ἐβουλεύσατο
  choice: beschloss
  rationale: Das Verb bezeichnet hier eine Beratung, die zu einem Entschluss führt; der beratende Aspekt ist bereits im vorangehenden Ausdruck enthalten.
- source_word: πρὶν εἰσβαλεῖν τὸ στράτευμα τοῦ βασιλέως ἐπὶ τὴν Ἰουδαίαν
  choice: noch bevor das Heer des Königs in Judäa einfallen ... konnte
  rationale: εἰσβάλλω bezeichnet in diesem militärischen Zusammenhang einen feindlichen Einfall; die deutsche Konstruktion macht deutlich, dass Judas dem erwarteten Angriff zuvorkommen wollte.
- source_word: γενέσθαι τῆς πόλεως ἐγκρατεῖς
  choice: die Stadt unter seine Gewalt bringen
  rationale: ἐγκρατεῖς γενέσθαι bezeichnet das Erlangen von Herrschaft oder Kontrolle. Das singularische Possessivpronomen bezieht sich im Deutschen grammatisch auf das Heer, ohne die kollektiv-plurale Bedeutung auszuschließen.
- source_word: ἐξελόντας
  choice: hinauszuziehen
  rationale: Das Partizip ist pluralisch und weist sachlich auf Judas und seine Mitstreiter beziehungsweise den beratenden Kreis. Der deutsche Infinitiv bleibt stilistisch knapp, ohne die genaue Zusammensetzung der Gruppe unnötig festzulegen.
- source_word: κρῖναι τὰ πράγματα
  choice: die Sache zu entscheiden
  rationale: Die breite Wendung kann das Entscheiden, Klären oder Beilegen der gegenwärtigen Krise bezeichnen. Die Hauptfassung bewahrt den Entscheidungssinn; die Fußnote nennt naheliegende Alternativen.
- source_word: τῇ τοῦ θεοῦ βοηθείᾳ
  choice: mit Gottes Hilfe
  rationale: Der Dativ bezeichnet das Mittel beziehungsweise die Unterstützung, auf die das geplante Handeln vertraut.
theological_decisions:
- issue: Bezugsgruppe des pluralischen ἐξελόντας
  choice: Das Hinausziehen wird als gemeinsames Vorgehen von Judas und den mit ihm verbundenen Männern verstanden, im Deutschen jedoch durch einen Infinitiv ausgedrückt.
  alternative: 'Judas allein zieht hinaus; oder ausdrücklich: ‚sie sollten hinausziehen‘.'
  rationale: Das pluralische ἐξελόντας spricht gegen eine ausschließlich singularische Handlung. Zugleich benennt der griechische Text die genaue Zusammensetzung der handelnden Gruppe nicht, weshalb die Übersetzung sie nicht näher festlegt.
- issue: Bedeutungsumfang von κρῖναι τὰ πράγματα
  choice: die Sache entscheiden
  alternative: die Lage beurteilen; die Angelegenheit zum Abschluss bringen
  rationale: Die Wendung verbindet einen urteilenden mit einem lösenden Sinn. Keine konfessionelle oder providenztheologische Deutung wird ergänzt; Gottes Hilfe bleibt ausdrücklich Mittel beziehungsweise Grundlage des Vorgehens.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Im kleinen Kreis« gibt die private beziehungsweise abgesonderte Beratung natürlich wieder. Die lange griechische Satzperiode bleibt als ein Satz erhalten, wird aber durch klare deutsche Gliederung lesbar gemacht.
