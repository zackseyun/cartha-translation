  naturalness: Der Satz ist grundsätzlich klar und modernes Standarddeutsch. „Zu einer Beratung im kleinen Kreis zusammenkommen“ ist etwas expliziter, aber natürlich und gibt die abgesonderte Zusammenkunft mit den Ältesten angemessen wieder.
  terminology: „Heer des Königs“, „in Judäa einfallen“, „die Stadt in ihre Gewalt bringen“ und „mit Gottes Hilfe“ treffen den sachlichen und religiösen Wortlaut angemessen. „Die Angelegenheit entscheiden“ wahrt die breite Bedeutung von κρῖναι τὰ πράγματα; die Fußnote sichert mögliche Nuancen ab.
