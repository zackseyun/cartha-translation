translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die sehr große Truppenangabe und die Aussage, jeder von beiden habe ein solches Heer gehabt, werden trotz ihrer möglichen historischen oder syntaktischen Schwierigkeit nicht harmonisiert. Die Fußnotenmarker stehen unmittelbar bei den jeweils erläuterten Ausdrücken.
