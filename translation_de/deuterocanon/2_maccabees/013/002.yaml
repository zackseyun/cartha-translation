base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/013/002.yaml
  text: 'and with him Lysias[a], the guardian and overseer of affairs, each having a Greek force: eleven myriads of infantry, five thousand three hundred cavalry, twenty-two elephants[b], and three hundred scythed chariots.'
translation:
  language: de
  text: Bei ihm war Lysias, der Vormund und Verwalter der Staatsgeschäfte[a]. Jeder von ihnen verfügte über ein griechisches Heer von 110.000 Fußsoldaten[b], 5.300 Reitern, 22 Elefanten und 300 Sichelwagen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Regent und Verantwortliche für die Staatsgeschäfte“. Die griechischen Bezeichnungen verbinden anvertraute Vormundschaft mit amtlicher Leitungsgewalt.'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlich: „elf Myriaden Fußsoldaten“; eine Myriade entspricht 10.000.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σὺν αὐτῷ Λυσίαν
  choice: und mit ihm Lysias
  rationale: Gibt die Begleitung schlicht und eng am griechischen Wortlaut wieder; der Namen wird in der im Deutschen üblichen Form transliteriert.
- source_word: τὸν ἐπίτροπον
  choice: den Vormund
  rationale: ἐπίτροπος bezeichnet einen mit Fürsorge oder stellvertretender Verantwortung Betrauten. „Vormund“ bewahrt den Grundsinn, ohne die konkrete Hofstellung vorschnell auf „Regent“ festzulegen.
- source_word: καὶ ἐπὶ τῶν πραγμάτων
  choice: und Verwalter der Staatsgeschäfte
  rationale: Die Wendung bezeichnet amtliche Zuständigkeit für die öffentlichen beziehungsweise staatlichen Angelegenheiten. Die Übersetzung macht diesen administrativen Sinn in natürlichem Deutsch deutlich.
- source_word: ἕκαστον ἔχοντα δύναμιν Ἑλληνικὴν
  choice: Jeder von ihnen verfügte über ein griechisches Heer
  rationale: Der Singular ἕκαστον bezieht Antiochus und Lysias jeweils einzeln ein. „Verfügte über“ gibt ἔχοντα im militärischen Zusammenhang natürlich wieder; „griechisch“ lässt die mögliche hellenistische Bedeutung offen.
- source_word: πεζῶν μυριάδας ἕνδεκα
  choice: 110.000 Fußsoldaten
  rationale: Elf Myriaden entsprechen 110.000. Die Zahl wird für heutige Leser unmittelbar verständlich wiedergegeben, während die griechische Zählweise in einer Fußnote dokumentiert wird.
- source_word: ἱππέων πεντακισχιλίους τριακοσίους
  choice: 5.300 Reitern
  rationale: ἱππεῖς sind berittene Soldaten; „Reiter“ ist knapp, klar und entspricht dem militärischen Zusammenhang.
- source_word: ἐλέφαντας εἴκοσι δύο
  choice: 22 Elefanten
  rationale: Direkte Wiedergabe der angegebenen Zahl; im Kontext sind Kriegselefanten gemeint, doch der Haupttext ergänzt nichts, was nicht ausdrücklich dasteht.
- source_word: ἅρματα δὲ δρεπανηφόρα τριακόσια
  choice: 300 Sichelwagen
  rationale: „Sichelwagen“ ist die etablierte deutsche Bezeichnung für mit Sicheln oder Klingen ausgerüstete Streitwagen und gibt δρεπανηφόρα prägnant wieder.
