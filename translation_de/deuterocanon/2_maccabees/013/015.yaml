base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/013/015.yaml
  text: And after giving those around him the battle cry[a], “God’s Victory,” he attacked the royal court by night with the finest armed young men, struck down about two thousand men in the camp[b], and cut down the leading elephant together with its rider.
translation:
  language: de
  text: Nachdem er seinen Leuten das Losungswort[a] »Gottes Sieg« gegeben hatte, griff er nachts mit einer Schar hervorragend ausgerüsteter junger Männer das königliche Lagerquartier an. Im Heerlager erschlug er etwa zweitausend Mann und tötete den führenden Elefanten samt dem Mann in seinem Aufbau.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Kennwort«, »Signal« oder »Schlachtruf«. Das griechische Wort bezeichnet eine militärische Losung oder ein vereinbartes Signal.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »samt dem, der sich beim/im Häuschen befand«; gemeint ist wohl der Mann im turmartigen Aufbau auf dem Kriegselefanten.'
    reason: cultural_note
lexical_decisions:
- source_word: ἀναδοὺς δὲ τοῖς περὶ αὐτὸν
  choice: Nachdem er seinen Leuten ... gegeben hatte
  rationale: Das Aoristpartizip bezeichnet die dem Angriff vorausgehende Handlung; τοῖς περὶ αὐτόν meint idiomatisch die Männer in seinem Gefolge.
- source_word: σύνθημα
  choice: Losungswort
  rationale: Der militärische Ausdruck kann ein Kennwort, Losungswort oder Signal bezeichnen. »Losungswort« passt dazu, dass sein Inhalt ausdrücklich genannt wird, ohne es sicher als Schlachtruf festzulegen.
- source_word: Θεοῦ Νίκην
  choice: Gottes Sieg
  rationale: Die knappe Genitivverbindung wird als sloganartige Losung wiedergegeben; die Mehrdeutigkeit zwischen einem Gott gehörenden und einem von Gott bewirkten Sieg bleibt gewahrt.
- source_word: μετὰ νεανίσκων ἀρίστων κεκοσμημένων
  choice: mit einer Schar hervorragend ausgerüsteter junger Männer
  rationale: κεκοσμημένων bedeutet hier im militärischen Zusammenhang ausgerüstet beziehungsweise zum Kampf gerüstet; ἀρίστων qualifiziert die Männer als besonders ausgezeichnet.
- source_word: ἐπιβαλὼν νύκτωρ
  choice: griff er nachts ... an
  rationale: ἐπιβάλλω mit ἐπί bezeichnet hier einen Angriff; νύκτωρ gibt dessen nächtlichen Zeitpunkt an.
- source_word: τὴν βασιλικὴν αὐλήν
  choice: das königliche Lagerquartier
  rationale: αὐλή kann Hof, umfriedeten Bereich oder Residenz bezeichnen. Im Feldlagerkontext ist das abgegrenzte königliche Quartier gemeint; »königlicher Hof« wäre räumlich missverständlich.
- source_word: τὴν παρεμβολὴν ἀνεῖλεν εἰς ἄνδρας δυσχιλίους
  choice: Im Heerlager erschlug er etwa zweitausend Mann
  rationale: παρεμβολή bezeichnet das Heerlager. ἀναιρέω bedeutet hier töten; εἰς mit der Zahl drückt eine ungefähre Größenordnung aus.
- source_word: τὸν πρωτεύοντα τῶν ἐλεφάντων
  choice: den führenden Elefanten
  rationale: Die Wendung bezeichnet den vorrangigen oder an der Spitze stehenden Elefanten, ohne eindeutig zwischen Rang und Position zu entscheiden.
- source_word: σὺν τῷ κατʼ οἰκίαν ὄντι
  choice: samt dem Mann in seinem Aufbau
  rationale: Die ungewöhnliche Formulierung bezeichnet wörtlich denjenigen, der sich beim beziehungsweise im hausartigen Aufbau befindet. Die konkrete Wiedergabe vermeidet, ihn ohne Textgrundlage bloß als Reiter zu bestimmen.
theological_decisions:
- issue: Bedeutung der Losung Θεοῦ Νίκην
  choice: Gottes Sieg
  alternative: Gott siegt / Sieg durch Gott
  rationale: Der Genitiv lässt Besitz, Ursprung oder Urheberschaft offen. Die nominale deutsche Fassung bewahrt diese theologische Offenheit.
translation_notes:
  register: Moderne, würdevolle Erzählprosa. Die lange griechische Satzperiode wurde zur besseren Verständlichkeit in zwei Sätze gegliedert. Militärische Begriffe wurden konkret, aber ohne unnötige technische Festlegung wiedergegeben.
