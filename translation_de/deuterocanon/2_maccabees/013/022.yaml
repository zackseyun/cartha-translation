  text: The king negotiated further with those in Bethsura[a], gave and received pledges of good faith, and went away[b],
translation:
  language: de
  text: Der König verhandelte erneut mit denen in Bet-Zur, gab ihnen die rechte Hand und nahm ihre entgegen[a]; dann ging er fort.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „gab die rechte Hand und nahm sie“. Der Handschlag diente als Zeichen gegenseitiger Zusicherung oder einer Vereinbarung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδευτερολόγησεν
  choice: verhandelte erneut
  rationale: Das Verb bezeichnet wörtlich ein zweites Reden oder erneutes Verhandeln. Im militärisch-politischen Zusammenhang und angesichts des folgenden Handschlags ist „verhandelte erneut“ natürlich und sachgerecht, ohne bereits einen Vertragsabschluss vorauszusetzen.
- source_word: τοῖς ἐν Βαθσούροις
  choice: mit denen in Bet-Zur
  rationale: Die Wendung bezeichnet die dort befindlichen Menschen, wohl die Verteidiger, legt deren Geschlecht oder genaue Funktion jedoch nicht ausdrücklich fest.
- source_word: Βαθσούροις
  choice: Bet-Zur
  rationale: Die geläufige, dem hebräischen Ortsnamen entsprechende deutsche Form ist verständlicher als eine bloße Umschrift der griechischen Form „Bathsura“.
- source_word: δεξιὰν ἔδωκεν, ἔλαβεν
  choice: gab ihnen die rechte Hand und empfing die ihre
  rationale: Die Übersetzung bewahrt das konkrete griechische Bild und zugleich die Gegenseitigkeit. Gemeint ist ein Handschlag als Zeichen einer Zusage oder Vereinbarung; dies wird in der Fußnote erläutert.
- source_word: ἀπῄει
  choice: zog er ab
  rationale: Im militärischen Erzählzusammenhang gibt „zog er ab“ das Weggehen des Königs knapp und idiomatisch wieder.
