translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch in würdigem Erzählstil. Der Ortsname wird in der etablierten Form »Ptolemaïs« wiedergegeben. Die emotionale Aussage bleibt stark, vermeidet aber mit »verängstigt« eine vorschnelle Festlegung auf den moralisch wertenden Sinn »feige«.
