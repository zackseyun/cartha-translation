  text: He came to Ptolemais[a]. The people of Ptolemais were displeased about the terms, for they were exceedingly fearful[b], and they wanted to set aside the arrangements.
translation:
  language: de
  text: Er kam nach Ptolemaïs. Die Einwohner von Ptolemaïs waren über die Abmachungen ungehalten, denn sie waren überaus verängstigt. Sie wollten die Bestimmungen[a] außer Kraft setzen.[b]
