lexical_decisions:
- source_word: ἐδυσφόρουν
  choice: waren … ungehalten
  rationale: Das Verb bezeichnet eine heftige negative Reaktion, ein Beunruhigt- oder Unzufriedensein. »Ungehalten« gibt dies im politischen Zusammenhang prägnant wieder, ohne zwingend offenen Zorn auszudrücken.
- source_word: συνθηκῶν
  choice: Abmachungen
  rationale: Der Plural bezeichnet hier die ausgehandelten Vereinbarungen beziehungsweise deren Bedingungen. »Abmachungen« ist verständlich und wahrt den Bezug auf eine politische Übereinkunft.
- source_word: ἐδειλίαζον
  choice: waren … verängstigt
  rationale: Das Verb bezeichnet Furcht oder zaghaftes Verhalten und kann auch den wertenden Sinn »sich feige verhalten« tragen. »Verängstigt« bewahrt den Furchtaspekt, ohne die mögliche moralische Abwertung unnötig festzuschreiben.
- source_word: ὑπεράγαν
  choice: überaus
  rationale: Das starke Gradadverb intensiviert ἐδειλίαζον. »Überaus« ist würdig, natürlich und gibt die außergewöhnliche Stärke wieder.
- source_word: ἀθετεῖν
  choice: außer Kraft setzen
  rationale: Das Verb kann »verwerfen«, »missachten« oder »für ungültig erklären« bedeuten. Im Blick auf vereinbarte Regelungen trifft »außer Kraft setzen« die beabsichtigte Aufhebung.
- source_word: διαστάλσεις
  choice: Bestimmungen
  rationale: Das seltene Substantiv meint im Zusammenhang wahrscheinlich die einzelnen Festlegungen oder Klauseln der Einigung. »Bestimmungen« ist genauer als das allgemeinere »Regelungen«, ohne eine nicht belegte technische Bedeutung zu erzwingen.
- source_word: οἱ Πτολεμαεῖς
  choice: die Einwohner von Ptolemaïs
  rationale: Das substantivierte Ethnikon bezeichnet hier die Menschen der Stadt. Die aufgelöste Form ist im heutigen Deutsch klarer als »die Ptolemäer«, das missverständlich auf die Dynastie bezogen werden könnte.
