  text: But the king[a], weighed down in spirit, advanced, intending to inflict on the Jews the worst things that had happened under his father.
translation:
  language: de
  text: Der König aber rückte vor, innerlich schwer belastet, und beabsichtigte[a], den Juden das Schlimmste von dem anzutun, was unter seinem Vater geschehen war.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »in der Erwartung, über die Juden das Schlimmste von dem zu bringen, was zur Zeit seines Vaters geschehen war«. Das griechische Partizip kann eine Erwartung oder eine Absicht ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: φρονήμασιν
  choice: innerlich
  rationale: Der Dativ Plural bezeichnet den inneren Bereich der Gedanken, Gesinnung oder Absichten. »Innerlich« bewahrt diese Offenheit, ohne das seltene und im Deutschen schwer verständliche Abstraktum wörtlich nachzubilden.
- source_word: βεβαρημένος
  choice: schwer belastet
  rationale: Das Perfektpartizip beschreibt einen anhaltenden Zustand und erhält mit »schwer belastet« das Gewichtsbild des griechischen Verbs.
- source_word: ἦρχετο
  choice: rückte vor
  rationale: Im Zusammenhang des Feldzugs bezeichnet das Imperfekt ein fortschreitendes Herankommen; »rückte vor« gibt die militärische Bewegung natürlich wieder.
- source_word: τὰ χείριστα
  choice: das Schlimmste
  rationale: Der substantivierte neutrale Superlativ wird idiomatisch wiedergegeben, ohne die Art der drohenden Taten näher festzulegen.
- source_word: τῶν ἐπὶ τοῦ πατρὸς αὐτοῦ γεγονότων
  choice: von dem, was unter seinem Vater geschehen war
  rationale: ἐπί mit Genitiv bezeichnet hier die Zeit beziehungsweise Herrschaft des Vaters; die Formulierung wahrt sowohl den zeitlichen als auch den politischen Bezug.
- source_word: ἐνδεξόμενος
  choice: beabsichtigte … anzutun
  rationale: Das Partizip bezeichnet im feindseligen Zusammenhang das Vorhaben, den Juden die genannten Übel widerfahren zu lassen. Die Fußnote hält die ebenfalls mögliche Erwartungsnuance offen.
