    rationale: εἰς bezeichnet hier die Bewegung bzw. das Gefälle in die Asche. „in die Asche“ gibt die Richtungsrelation genauer wieder, ohne den technischen Aufbau weiter auszugestalten.
  - severity: low
    issue: Die deutsche Gegenwartsform ist im erzählerischen Zusammenhang unnatürlich.
    rationale: Das griechische ἔστιν/ἔχει kann in dieser beschreibenden Rückblende idiomatisch mit deutschem Präteritum wiedergegeben werden; dadurch wird keine relevante Bedeutungsnuance verloren.
  revised_text: An diesem Ort gab es einen fünfzig Ellen hohen Turm, der mit Asche gefüllt war. Er hatte ringsum eine kreisförmige Vorrichtung, die steil in die Asche abfiel.
