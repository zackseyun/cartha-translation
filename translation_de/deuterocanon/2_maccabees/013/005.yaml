  text: In that place there was a tower fifty cubits high[a], full of ashes, and it had all around it a circular contrivance sloping steeply down into the ashes.
translation:
  language: de
  text: An diesem Ort gab es einen fünfzig Ellen hohen Turm, der mit Asche gefüllt war. Er hatte ringsum eine kreisförmige Vorrichtung, die steil in die Asche abfiel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πύργος
  choice: Turm
  rationale: Die gewöhnliche Bedeutung ist „Turm“; sie passt zur beschriebenen Anlage.
- source_word: πεντήκοντα πήχεων
  choice: fünfzig Ellen hoher
  rationale: πῆχυς bezeichnet die antike Längeneinheit Elle. „hoch“ verdeutlicht idiomatisch, dass die Angabe die Höhe des Turms betrifft.
- source_word: πλήρης σποδοῦ
  choice: mit Asche gefüllt
  rationale: σποδός bedeutet „Asche“; die Formulierung gibt die Konstruktion mit πλήρης natürlich wieder.
- source_word: ὄργανον
  choice: Vorrichtung
  rationale: Das Wort kann allgemein ein Werkzeug, Gerät oder eine technische Vorrichtung bezeichnen. „Vorrichtung“ wahrt die Unbestimmtheit des beschriebenen Apparats.
- source_word: περιφερές
  choice: kreisförmig
  rationale: Das Adjektiv bezeichnet hier am ehesten die runde Gestalt. Eine Bewegung oder Drehfunktion wird nicht ausdrücklich behauptet.
- source_word: πάντοθεν
  choice: ringsum
  rationale: Das Adverb bezeichnet eine Ausdehnung beziehungsweise Beschaffenheit auf allen Seiten.
- source_word: ἀπόκρημνον
  choice: steil … abfällt
  rationale: Das Wort beschreibt etwas abschüssig oder jäh Abfallendes; die verbale Fassung ist im Deutschen anschaulich und natürlich.
- source_word: εἰς τὴν σποδόν
  choice: zur Asche hin
  rationale: εἰς bezeichnet die Richtung auf die Asche beziehungsweise in sie hinein. Im Zusammenhang mit dem Gefälle ist „zur Asche hin“ idiomatisch, ohne den genauen Aufbau stärker festzulegen.
