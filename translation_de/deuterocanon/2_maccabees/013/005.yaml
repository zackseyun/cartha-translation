translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das griechische Präsens ἔστιν und ἔχει wird mit „steht“ und „hat“ bewahrt. Die beiden griechischen Hauptaussagen werden zur besseren Lesbarkeit auf zwei Sätze verteilt; die räumliche und technische Unbestimmtheit der Vorrichtung bleibt erhalten.
