base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/013/026.yaml
  text: Lysias came forward to the tribunal, made as good a defense as he could, persuaded them, calmed them, made them well-disposed, and marched back to Antioch. Thus the king’s attack and withdrawal proceeded.
translation:
  language: de
  text: Lysias trat vor das Tribunal[a], verteidigte sich, so gut es die Umstände zuließen[b], überzeugte und besänftigte sie, gewann ihr Wohlwollen und zog sich nach Antiochia zurück. So verliefen der Angriff des Königs und sein Rückzug[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „vor den Richterstuhl“ beziehungsweise „auf die Plattform“.'
    reason: βῆμα kann die erhöhte Plattform selbst oder den öffentlichen beziehungsweise gerichtlichen Amtssitz darauf bezeichnen.
  - marker: b
    text: 'Die Bedeutung des Adverbs ist unsicher; auch möglich: „angemessen“ oder „so gut er konnte“.'
    reason: ἐνδεχομένως kann Eignung, hinreichende Angemessenheit oder das unter den Umständen Mögliche ausdrücken.
  - marker: c
    text: 'Oder: „der Vorstoß des Königs und sein Abmarsch“.'
    reason: ἔφοδος und ἀναζυγή besitzen militärische Bedeutungsbreiten von Angriff beziehungsweise Vorrücken und Rückzug beziehungsweise Aufbruch.
lexical_decisions:
- source_word: προσῆλθεν
  choice: trat vor
  rationale: Gibt das Herantreten in einem öffentlichen oder gerichtlichen Rahmen natürlich und prägnant wieder.
- source_word: βῆμα
  choice: Tribüne
  rationale: Bezeichnet eine erhöhte Plattform und kann in öffentlichem oder gerichtlichem Zusammenhang den dort befindlichen Amtssitz meinen; „Tribüne“ bewahrt die konkrete Bildlichkeit.
- source_word: ἀπελογήσατο ἐνδεχομένως
  choice: verteidigte sich, so gut es die Umstände zuließen
  rationale: ἀπελογήσατο bedeutet, eine Verteidigung vorzubringen; das schwierige Adverb ἐνδεχομένως wird als situationsbedingte Möglichkeit wiedergegeben, ohne eine sichere Nuance vorzutäuschen.
- source_word: συνέπεισεν
  choice: überzeugte sie
  rationale: Bewahrt den Kern der erfolgreichen Überredung; das aus dem Zusammenhang erschlossene Objekt wird im Deutschen ergänzt.
- source_word: κατεπράϋνεν
  choice: besänftigte sie
  rationale: Entspricht dem Herabstimmen von Erregung oder Widerstand und passt zum politischen Kontext.
- source_word: εὐμενεῖς ἐποίησεν
  choice: stimmte sie wohlwollend
  rationale: Gibt die kausative Wendung „machte sie wohlgesinnt“ in natürlichem Deutsch wieder.
- source_word: ἀνέζευξεν
  choice: zog ... zurück
  rationale: Der militärische Ausdruck bezeichnet das Aufbrechen beziehungsweise Abziehen; „zog zurück“ erhält diesen Kontext, ohne eine Flucht zu unterstellen.
- source_word: ἐφόδου
  choice: Angriff
  rationale: Der Genitiv bezeichnet hier den feindlichen Vorstoß beziehungsweise Angriff des Königs.
- source_word: ἀναζυγῆς
  choice: Rückzug
  rationale: Bezeichnet das Abziehen oder Zurückmarschieren und bildet den sachlichen Gegenpol zum Angriff, ohne eine Niederlage zu behaupten.
- source_word: ἐχώρησεν
  choice: verliefen
  rationale: Die Form fasst zusammen, wie die betreffenden Ereignisse ihren Lauf nahmen; der deutsche Plural richtet sich nach den zwei genannten Vorgängen.
theological_decisions:
- issue: Historische Zusammenfassung ohne unmittelbar lehrmäßigen Streitpunkt
  choice: Der Vers wird als Bericht über die erfolgreiche Verteidigungsrede des Lysias und den anschließenden militärischen Rückzug wiedergegeben.
  alternative: βῆμα als „Richterstuhl“ und ἀναζυγή als „Abmarsch“ wiederzugeben.
  rationale: Die griechischen Begriffe tragen vor allem öffentliche, gerichtliche und militärische Nuancen. Die Übersetzung bewahrt diese, ohne einen förmlichen Gerichtsprozess oder eine Niederlage stärker zu behaupten, als der Text erlaubt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Abfolge griechischer Verben bleibt als zügige Erzählfolge erhalten; erschlossene Objekte werden zur deutschen Verständlichkeit ergänzt. Militärische und öffentliche Fachnuancen werden verständlich formuliert und in Fußnoten offengehalten.
