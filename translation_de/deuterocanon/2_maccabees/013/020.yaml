lexical_decisions:
- source_word: τοῖς δὲ ἔνδον
  choice: denen drinnen
  rationale: ἔνδον bezeichnet substantivisch die Menschen innerhalb des belagerten Ortes. „Denen drinnen“ bewahrt den räumlichen Sinn, ohne ein im Griechischen nicht ausdrücklich genanntes „Männer“ hinzuzufügen.
- source_word: Ἰούδας
  choice: Judas
  rationale: Der Personenname Ἰούδας wird entsprechend dem üblichen deutschen Namensgebrauch in 2 Makkabäer als „Judas“ wiedergegeben.
- source_word: τὰ δέοντα
  choice: was sie brauchten
  rationale: Der substantivierte Ausdruck bezeichnet das jeweils Erforderliche. Die Wiedergabe bleibt bewusst allgemein und legt nicht fest, ob ausschließlich Vorräte oder auch andere notwendige Dinge gemeint sind.
- source_word: εἰσεπέμπεν
  choice: ließ … immer wieder zukommen
  rationale: Das Imperfekt kann eine fortdauernde oder wiederholte Handlung in der Vergangenheit ausdrücken. Die Formulierung gibt diesen Aspekt natürlich wieder; „zukommen lassen“ bewahrt zudem die Bewegungsrichtung nach innen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der knappe griechische Satzbau bleibt erkennbar, wird aber idiomatisch gestaltet. „Denen drinnen“ ist bewusst allgemein; „was sie brauchten“ vermeidet eine unbelegte Eingrenzung auf Lebensmittel oder militärische Vorräte.
