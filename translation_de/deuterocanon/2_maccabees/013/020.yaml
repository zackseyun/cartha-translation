  text: Judas aber sandte denen im Inneren weiterhin das Nötige zu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Judas ließ denen im Inneren das Nötige zukommen.“ Das griechische Imperfekt kann eine fortdauernde oder wiederholte Handlung bezeichnen.'
