  text: And at Bethsura he attacked a small garrison of the Jews[a], but was turned back, was repulsed[c][b], and was weakened.
translation:
  language: de
  text: Auch bei Bethsura[a] rückte er gegen eine kleine Festung der Juden[b] vor; doch wurde er zurückgeschlagen, stieß auf Widerstand und verlor an Stärke.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Auch „Beth-Zur“. Der griechische Text gibt den Ortsnamen als Βαθσούρα beziehungsweise hier im Dativ als Βαθσούροις wieder.
    reason: lexical_alternative
  - marker: b
    text: „Festung“ kann hier auch einen befestigten Stützpunkt oder dessen kleine Besatzung bezeichnen; das griechische φρούριον lässt diese Bedeutungsbreite zu.
    reason: lexical_alternative
  - marker: c
    text: 'Die griechischen Verben bilden eine knappe, kumulative Folge: Er rückte gegen die Festung vor, wurde zurückgeschlagen, traf auf Widerstand und verlor an Stärke.'
    reason: literary_structure
lexical_decisions:
- source_word: Βαθσούροις
  choice: Bethsura
  rationale: Die Form gibt den griechisch überlieferten Ortsnamen in einer im Deutschen gut lesbaren Transkription wieder; die semitische Namensform lautet Beth-Zur.
- source_word: φρούριον ὀλίγον
  choice: eine kleine Festung
  rationale: φρούριον bezeichnet zunächst einen befestigten Ort oder Stützpunkt; ὀλίγον beschreibt hier am natürlichsten dessen geringe Größe oder Stärke. Die mögliche metonymische Bedeutung „Besatzung“ bleibt in einer Fußnote erhalten.
- source_word: τῶν Ἰουδαίων
  choice: der Juden
  rationale: Der Genitiv bezeichnet die Festung knapp als den Juden zugehörig beziehungsweise von ihnen gehalten, ohne diese Beziehung enger festzulegen.
- source_word: προσῆγεν
  choice: rückte ... vor
  rationale: Im militärischen Zusammenhang bezeichnet das Verb das Heranführen beziehungsweise Vorrücken gegen ein Ziel. Diese Wiedergabe bleibt näher am griechischen Ausdruck als das stärker deutende „griff an“.
- source_word: ἐτροποῦτο
  choice: wurde ... zurückgeschlagen
  rationale: Die mediale oder passive Form bezeichnet eine erzwungene Umkehr beziehungsweise Niederlage, ohne zwingend eine vollständige Flucht oder Vernichtung auszudrücken.
- source_word: προσενέκρουσεν
  choice: stieß auf Widerstand
  rationale: Das Verb vermittelt wörtlich das Anstoßen an ein Hindernis. Im militärischen Zusammenhang bezeichnet es anschaulich, dass sein Vorstoß auf Gegenwehr traf; die aktive Form bleibt dabei gewahrt.
- source_word: ἡλαττονοῦτο
  choice: verlor an Stärke
  rationale: Das Verb bedeutet, geringer oder vermindert zu werden. Die Formulierung gibt im militärischen Zusammenhang einen fortschreitenden Verlust an Stärke wieder, ohne dessen genaue Art festzulegen.
