base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/013/004.yaml
  text: But the King of kings stirred up Antiochus’s anger against the wretch, and when Lysias pointed him out as being responsible for the evils and for everything, he ordered them to put him to death, taking him to Beroea, as is the custom in that place.
translation:
  language: de
  text: Doch der König der Könige entfachte den Zorn des Antiochus gegen den Frevler[a]. Als Lysias diesen als verantwortlich für die Übel und für alles bezeichnete, befahl Antiochus, ihn nach Beröa zu bringen und dort nach dem Brauch dieses Ortes zu töten[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „gegen den Verbrecher“ beziehungsweise „gegen den Schurken“. Das griechische Wort ἀλιτήριος drückt eine starke moralische Verurteilung aus.'
    reason: lexical_alternative
  - marker: b
    text: Der Satzbau lässt erkennen, dass die Tötung in Beröa nach dem dortigen Brauch vollzogen werden sollte.
    reason: cultural_note
lexical_decisions:
- source_word: ὁ δὲ βασιλεὺς τῶν βασιλέων
  choice: Doch der König der Könige
  rationale: Die feste Hoheitsbezeichnung wird direkt wiedergegeben; im Kontext bezeichnet sie ehrfürchtig Gott als den Souverän über irdische Könige.
- source_word: ἐξήγειρεν τὸν θυμὸν τοῦ Ἀντιόχου
  choice: entfachte den Zorn des Antiochus
  rationale: Die Formulierung bewahrt die kausative Aussage des Verbs und gibt θυμός in natürlichem, würdigem Deutsch als feindseligen Zorn wieder.
- source_word: ἐπὶ τὸν ἀλιτήριον
  choice: gegen den Frevler
  rationale: ἀλιτήριος ist eine starke moralische Verurteilung eines schuldigen, ruchlosen Menschen. „Frevler“ wahrt diesen Ton, ohne eine bestimmte strafrechtliche Kategorie festzulegen.
- source_word: Λυσίου ὑποδείξαντος τοῦτον αἴτιον τῶν κακῶν εἶναι καὶ πάντων
  choice: Als Lysias diesen als verantwortlich für die Übel und für alles bezeichnete
  rationale: Die Genitivus-absolute-Konstruktion wird als Nebensatz wiedergegeben. Das komprimierte καὶ πάντων bleibt mit „und für alles“ bewusst weit und wird nicht auf bestimmte Ereignisse verengt.
- source_word: προσέταξεν
  choice: befahl Antiochus
  rationale: Das im Griechischen unausgesprochene Subjekt wird zur Klarheit genannt; gemeint ist der unmittelbar zuvor genannte Antiochus.
- source_word: προσαπολέσαι
  choice: zu töten
  rationale: Im Zusammenhang bezeichnet das verstärkte Verb die angeordnete Hinrichtung. „Zu töten“ ist klar und vermeidet einen übermäßig technischen Rechtsbegriff.
- source_word: ἀγαγόντας εἰς Βέροιαν
  choice: ihn nach Beröa zu bringen
  rationale: Das Partizip bezeichnet die begleitende beziehungsweise vorausgehende Handlung der Beauftragten. Der deutsche Satz macht die Abfolge idiomatisch deutlich.
- source_word: ὡς ἔθος ἐστὶν ἐν τῷ τόπῳ
  choice: dort nach dem Brauch dieses Ortes
  rationale: Die Wendung wahrt den örtlichen Bezug und verbindet den lokalen Brauch natürlich mit der Tötung.
theological_decisions:
- issue: Bezug von „König der Könige“
  choice: Göttlicher Titel für Gott
  alternative: Bloße übersteigernde Bezeichnung eines irdischen Herrschers
  rationale: Im Erzählzusammenhang stellt die Formulierung Gottes Herrschaft über Antiochus und andere irdische Könige heraus. Die Übersetzung erhält diese theologische Aussage, ohne weitere Lehraussagen einzutragen.
- issue: Göttliches Bewirken von Antiochus’ Zorn
  choice: 'Direkte kausative Aussage bewahrt: Gott entfacht den Zorn'
  alternative: Abgeschwächte Wiedergabe als bloßes Zulassen oder indirekte Vorsehung
  rationale: ἐξήγειρεν sagt ausdrücklich, dass der König der Könige den Zorn erregte. Die Spannung zwischen göttlichem Handeln und menschlicher Verantwortung wird nicht aufgelöst.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur wurde für klare Rollenverteilung leicht entfaltet, während die starke moralische Sprache, die göttliche Kausalität und die Weite des komprimierten Ausdrucks καὶ πάντων erhalten bleiben.
