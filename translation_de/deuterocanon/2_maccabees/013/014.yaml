  yaml_path: translation/deuterocanon/2_maccabees/013/014.yaml
  text: And after entrusting the outcome to the Lord of the world[a], and urging those with him to fight bravely to the death for the laws, the temple, the city, the homeland, and the commonwealth[b], he encamped near Modein.
translation:
  language: de
  text: Nachdem er die Sache dem Herrn der Welt[a] anvertraut und die bei ihm waren dazu aufgefordert hatte, bis zum Tod tapfer für die Gesetze, den Tempel, die Stadt, die Heimat und die Staatsordnung[b] zu kämpfen, schlug er bei Modeïn sein Lager auf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dem Herrn des Universums“. Das griechische Wort κόσμος kann die Welt oder das geordnete All bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Das griechische Wort πολιτεία kann auch „Gemeinwesen“, „Verfassung“ oder „Lebensordnung“ bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: δοὺς … τὴν ἐπιτροπὴν
  choice: die Entscheidung … anvertraut hatte
  rationale: ἐπιτροπή kann eine einem anderen überlassene Entscheidung oder Beurteilung bezeichnen. Die Wendung gibt hier natürlich wieder, dass Judas den Ausgang beziehungsweise die Entscheidung in Gottes Hand legt, ohne eine administrative „Aufsicht“ anzunehmen.
- source_word: τῷ κυρίῳ τοῦ κόσμου
  choice: dem Herrn der Welt
  rationale: κύριος wird in biblischem Register mit „Herr“ wiedergegeben. κόσμος bezeichnet die Welt beziehungsweise das geordnete All; „Welt“ ist die unmittelbare und geläufige Wiedergabe.
- source_word: παρακαλέσας τοὺς σὺν αὐτῷ
  choice: rief er seine Männer dazu auf
  rationale: παρακαλέω hat hier auffordernden und ermutigenden Sinn. „Seine Männer“ bezeichnet im militärischen Zusammenhang natürlich diejenigen, die bei ihm waren.
- source_word: γενναίως ἀγωνίσασθαι μέχρι θανάτου
  choice: bis zum Tod tapfer … zu kämpfen
  rationale: ἀγωνίζομαι bezeichnet im militärischen Kontext den Kampf; γενναίως hebt den Mut hervor, und μέχρι θανάτου lässt die Bereitschaft zum Kampf bis in den Tod ausdrücklich stehen.
- source_word: περὶ νόμων, ἱεροῦ, πόλεως, πατρίδος, πολιτείας
  choice: für die Gesetze, den Tempel, die Stadt, die Heimat und die Staatsordnung
  rationale: περί bezeichnet hier die Güter, für deren Schutz gekämpft wird. Die Pluralform „Gesetze“ bleibt erhalten; ἱερόν meint in diesem Kontext den Tempel. πολιτεία hat eine politisch-gesellschaftliche Spannweite, die „Staatsordnung“ besser wahrt als eine bloß private „Lebensweise“.
- source_word: περὶ δὲ Μωδεεὶμ ἐποιήσατο τὴν στρατιάν
  choice: Dann schlug er bei Modeïn sein Lager auf
  rationale: Die Wendung bezeichnet im Erzählzusammenhang die Stationierung beziehungsweise Lagerung des Heeres in der Umgebung von Modeïn. „Bei“ wahrt den räumlichen Sinn von περί; „sein Lager aufschlagen“ ist im Deutschen die natürliche militärische Formulierung.
theological_decisions:
- issue: Gottesbezeichnung κύριος τοῦ κόσμου
  choice: Herr der Welt
  alternative: Herr des Universums
  rationale: „Herr“ bewahrt das übliche biblische Gottesprädikat und bringt die ausgesagte Souveränität zum Ausdruck. Die mögliche kosmologische Weite von κόσμος wird in einer Fußnote offengehalten.
- issue: Bedeutungsumfang von πολιτεία im Zusammenhang der national-religiösen Verteidigung
  choice: Staatsordnung
  alternative: Gemeinwesen; Verfassung; Lebensordnung
  rationale: Der Ausdruck kann die bürgerliche Ordnung, Verfassung oder gemeinschaftliche Lebensform meinen. „Staatsordnung“ erhält die öffentliche und politische Dimension, ohne den Begriff ausschließlich auf einen modernen Staat oder einen Gesetzestext zu verengen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die lange griechische Partizipialkonstruktion wird zur besseren Verständlichkeit in zwei Hauptsätze gegliedert. „Modeïn“ folgt einer im Deutschen gut lesbaren Umschrift und macht die getrennte Aussprache kenntlich.
