  text: And when Judas learned these things, he ordered the multitude to call upon the Lord day and night, that, as at other times, so now also he might come to their aid,
translation:
  language: de
  text: Als Judas davon erfuhr, befahl er der Menge, den Herrn Tag und Nacht anzurufen, damit er ihnen, wie schon zu anderen Zeiten, so auch jetzt zu Hilfe komme.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μεταλαβὼν
  choice: Als Judas davon erfuhr
  rationale: Das Partizip bezeichnet hier das Aufnehmen einer Nachricht. „Davon erfuhr“ gibt den Bezug auf die zuvor berichteten Vorgänge in natürlichem Deutsch wieder, ohne den griechischen Ausdruck unnötig zu verengen.
- source_word: παρήγγειλεν
  choice: befahl
  rationale: „Befahl“ bewahrt die verbindliche, autoritative Kraft des Verbs und passt zum militärisch geprägten Erzählzusammenhang.
- source_word: τῷ πλήθει
  choice: der Menge
  rationale: Der Ausdruck bezeichnet die versammelte größere Gemeinschaft. „Der Menge“ wahrt den kollektiven Sinn und den gehobenen Erzählton.
- source_word: διʼ ἡμέρας καὶ νυκτὸς
  choice: Tag und Nacht
  rationale: Dies ist die geläufige deutsche Entsprechung für den fortgesetzten Vollzug bei Tag und bei Nacht.
- source_word: ἐπικαλεῖσθαι τὸν κύριον
  choice: den Herrn anzurufen
  rationale: „Anrufen“ ist im biblischen Sprachgebrauch eine natürliche Bezeichnung für das bittende Gebet; „Herr“ entspricht κύριος im Gottesbezug.
- source_word: εἴ ποτε καὶ ἄλλοτε, καὶ νῦν
  choice: wenn je auch früher, dann auch jetzt
  rationale: Die Formulierung hält die konditionale Gestalt des Griechischen fest und erinnert zugleich an frühere göttliche Hilfe, ohne sie in eine eindeutig vergleichende Aussage umzudeuten.
- source_word: ἐπιβοηθεῖν
  choice: ihnen … zu Hilfe kommen
  rationale: Die Wendung gibt die erbetene, dringliche Unterstützung idiomatisch wieder. Das im Deutschen nötige Objekt „ihnen“ ergibt sich aus der betenden Menge.
theological_decisions:
- issue: Wiedergabe von κύριος im Gebetskontext
  choice: Herr
  alternative: Gebieter
  rationale: Gemeint ist Gott als der im Gebet Angerufene. „Herr“ bewahrt den jüdisch-biblischen Gottesbezug und vermeidet eine säkulare Verengung.
- issue: Aussage über frühere göttliche Hilfe in εἴ ποτε καὶ ἄλλοτε
  choice: wenn je auch früher, dann auch jetzt
  alternative: wie schon bei anderen Gelegenheiten, so auch jetzt
  rationale: Die gewählte Fassung bewahrt die sprachliche Spannung der griechischen Bedingungsform. Die Alternative macht aus der Bitte deutlicher eine Feststellung über bereits erfahrene Hilfe, als es die Formulierung zwingend verlangt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit vertrauter biblischer Gebetssprache. Der Gedankenstrich hebt die eingeschobene, im Griechischen knappe Bedingungswendung hervor und erleichtert das Verständnis des langen Satzes.
