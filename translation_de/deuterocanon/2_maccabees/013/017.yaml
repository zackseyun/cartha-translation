  text: And when day was already beginning to appear[a], this had happened because the Lord’s protection had quickly come to his aid.
translation:
  language: de
  text: Als der Tag schon zu dämmern begann, war dies geschehen, weil der Herr ihm rechtzeitig Schutz und Hilfe gewährt hatte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „weil der Schutz des Herrn ihm zu Hilfe gekommen war.“ Das seltene Wort ἐπαρήγορασις kann Hilfe, besonders rechtzeitigen Beistand, oder Erleichterung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑποφαινούσης ... τῆς ἡμέρας
  choice: Als der Tag schon zu dämmern begann
  rationale: Der Genitivus absolutus bezeichnet das erste Sichtbarwerden des Tageslichts. Die Formulierung gibt den einsetzenden Tagesanbruch natürlich wieder.
- source_word: τοῦτο ἐγέγονει
  choice: war dies geschehen
  rationale: Die Form ἐγέγονει stellt das Geschehen als bereits abgeschlossen dar, als der Tag zu dämmern begann.
- source_word: διὰ
  choice: weil
  rationale: διά mit Akkusativ bezeichnet hier den Grund des Geschehens.
- source_word: ἐπαρήγορασιν
  choice: rasch zu Hilfe gekommen war
  rationale: Das seltene Substantiv bezeichnet im Zusammenhang wohl rasche Hilfe oder Entlastung. Die verbale Wiedergabe ist im Deutschen idiomatisch, ohne die lexikalische Unsicherheit zu verdecken.
- source_word: αὐτῷ
  choice: ihm ... zu Hilfe
  rationale: Der Dativ bezeichnet den Begünstigten der göttlichen Hilfe.
- source_word: τοῦ κυρίου
  choice: des Herrn
  rationale: „Herr“ entspricht dem üblichen Gottesprädikat κύριος und bewahrt die Verbindung zum Sprachgebrauch der Septuaginta.
- source_word: σκέπην
  choice: der Schutz
  rationale: σκέπη kann Bedeckung, Zuflucht oder Schutz bedeuten; im militärischen Zusammenhang trifft „Schutz“ die Funktion am besten.
theological_decisions:
- issue: Wiedergabe von κύριος in einer deuterokanonischen griechischen Erzählung
  choice: der Herr
  alternative: der Gebieter
  rationale: Hier bezeichnet κύριος Gott als Ursprung der Rettung. „Der Herr“ ist ehrfürchtig, verständlich und entspricht dem etablierten biblischen Sprachgebrauch, ohne eine zusätzliche konfessionelle Deutung einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt nahe am Griechischen, wird aber idiomatisch gestaltet. Die ungewöhnliche Verbindung von ἐπαρήγορασις und σκέπη wird im Haupttext verständlich wiedergegeben; die verbleibende lexikalische Mehrdeutigkeit ist in der Fußnote ausgewiesen.
