    rationale: Die griechische Wendung spricht elliptisch vom Nichterlangen der Erde und meint die fehlende Bestattung. Die deutsche Formulierung ist verständlich, aber unnötig gegenständlich; die idiomatische Wiedergabe mit „in der Erde bestattet“ trifft den Sinn klarer.
