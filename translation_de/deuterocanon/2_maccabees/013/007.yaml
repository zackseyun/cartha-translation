  naturalness: „Durch ein solches Geschick kam … ums Leben“ ist modernes, würdiges Deutsch und bewahrt den rückblickenden, schicksalhaften Ton. „Ohne auch nur in der Erde bestattet zu werden“ ist idiomatischer als „ein Grab in der Erde zu erhalten“.
  terminology: „der gesetzlose Menelaus“ gibt τὸν παράνομον transparent und ohne zusätzliche konfessionelle Deutung wieder. Menelaus ist die übliche deutsche Namensform.
