  yaml_path: translation/deuterocanon/2_maccabees/013/007.yaml
  text: By such a fate the lawless Menelaus happened to die[a], not even obtaining burial in the earth.
translation:
  language: de
  text: Durch ein solches Geschick kam der gesetzlose Menelaus ums Leben, ohne auch nur in der Erde bestattet zu werden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „ohne auch nur die Erde zu erlangen“; gemeint ist, dass Menelaus nicht einmal eine Erdbestattung erhielt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοιούτῳ μόρῳ
  choice: durch ein solches Schicksal
  rationale: μόρος bezeichnet Schicksal oder Todesgeschick; τοιούτῳ verweist auf die zuvor geschilderte Todesart. Die Formulierung bewahrt den feierlich-rückblickenden Ton.
- source_word: τὸν παράνομον
  choice: der gesetzlose Menelaus
  rationale: παράνομος bezeichnet jemanden, der gegen das Gesetz handelt. „Gesetzlos“ erhält die rechtlich-moralische Wertung, ohne sie allgemein zu „böse“ abzuschwächen.
- source_word: συνέβη θανεῖν
  choice: musste … sterben
  rationale: συμβαίνω mit Infinitiv beschreibt, was jemandem widerfuhr. Im Zusammenhang mit μόρος gibt „musste … sterben“ das schicksalhafte Eintreten des Todes in natürlichem, würdevollem Deutsch wieder, ohne eine ausdrückliche göttliche Verursachung hinzuzufügen.
- source_word: μηδὲ τῆς γῆς τυγχάνοντα
  choice: ohne auch nur ein Grab in der Erde zu erhalten
  rationale: Wörtlich ist vom Nichterlangen der Erde die Rede; im Todeskontext bezeichnet dies die verweigerte Erdbestattung. „Ein Grab in der Erde“ macht die gemeinte Bestattung verständlich und hält zugleich das Bild der Erde fest.
- source_word: Μενέλαον
  choice: Menelaus
  rationale: Eingebürgerte deutsche Form des griechischen Eigennamens Μενέλαος.
theological_decisions:
- issue: Moralisch-rechtliche Kennzeichnung des Menelaus durch παράνομος
  choice: der gesetzlose Menelaus
  alternative: der frevelhafte Menelaus
  rationale: „Gesetzlos“ bildet den unmittelbaren Bezug auf Gesetzesübertretung ab und vermeidet eine stärker religiös zugespitzte Deutung.
- issue: Schicksalhafte Aussage in συνέβη θανεῖν
  choice: musste … sterben
  alternative: es widerfuhr ihm zu sterben
  rationale: Die gewählte Formulierung bewahrt die Unausweichlichkeit des berichteten Todesgeschicks, schreibt es jedoch nicht ausdrücklich Gott als unmittelbare Handlung zu.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz behält den feierlichen Rückblick und die rechtlich-moralische Verurteilung bei; die ungewöhnliche griechische Wendung zur verweigerten Bestattung wird im Haupttext verständlich wiedergegeben und in der Fußnote wörtlich ausgewiesen.
