base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/004/040.yaml
  text: But when the crowds were rising up and being filled with anger[a], Lysimachus armed about three thousand men and began unjust violence, with a certain Auranus taking the lead[c][b], a man advanced in age and no less in ignorance.
translation:
  language: de
  text: Als aber die Menschenmengen sich erhoben und von Zorn erfüllt wurden, bewaffnete Lysimachus etwa dreitausend Männer[a] und begann, mit ungerechter Gewalt vorzugehen.[b] Dabei übernahm ein gewisser Auranus die Führung, ein Mann, der an Jahren weit fortgeschritten war, an Unwissenheit jedoch nicht weniger.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „an die dreitausend Männer“. Die griechische Formulierung gibt wahrscheinlich eine ungefähre Zahl an.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich etwa: „begann mit ungerechten Händen“; gemeint ist der Beginn rechtswidriger Gewalttätigkeit.'
    reason: idiom_explanation
  - marker: c
    text: 'Die Formulierung ist ironisch: Auranus war an Jahren weit fortgeschritten, an Unwissenheit aber ebenso.'
    reason: literary_feature
lexical_decisions:
- source_word: ἐπεγειρομένων
  choice: sich erhoben
  rationale: Das Partizip beschreibt, wie die Menschenmengen in Bewegung und Aufruhr geraten. „Sich erhoben“ lässt offen, ob sie aus eigenem Antrieb handelten oder von anderer Seite aufgewiegelt wurden.
- source_word: ὄχλων
  choice: Menschenmengen
  rationale: Die neutrale Wiedergabe vermeidet die vorwegnehmende Abwertung durch „Pöbel“ oder „Mob“, die im griechischen Substantiv selbst nicht zwingend enthalten ist.
- source_word: ταῖς ὀργαῖς διεμπιπλαμένων
  choice: von Zorn erfüllt wurden
  rationale: Die Formulierung gibt sowohl das starke Gefühl von ὀργή als auch das intensive „Erfülltwerden“ durch die zusammengesetzte Verbform wieder.
- source_word: καθοπλίσας
  choice: bewaffnete
  rationale: Das Verb bezeichnet hier das Ausrüsten von Männern mit Waffen; „bewaffnete“ ist präzise und natürlich.
- source_word: πρὸς τρισχιλίους
  choice: etwa dreitausend Männer
  rationale: πρός vor einer Zahl kann eine ungefähre Mengenangabe ausdrücken. „Etwa“ bewahrt diese Näherung.
- source_word: κατήρξατο χειρῶν ἀδίκων
  choice: begann, mit ungerechter Gewalt vorzugehen
  rationale: Wörtlich steht eine ungewöhnliche Verbindung im Sinn von „mit ungerechten Händen beginnen“. Die gewählte Formulierung vermittelt den Beginn rechtswidriger Gewalttätigkeit, ohne die moralische Wertung von ἀδίκων abzuschwächen.
- source_word: προηγησαμένου
  choice: übernahm … die Führung
  rationale: Der Genitivus absolutus stellt Auranus als denjenigen dar, der voranging und die bewaffnete Gruppe anführte.
- source_word: τινὸς Αὑρανοῦ
  choice: ein gewisser Auranus
  rationale: „Ein gewisser“ bewahrt die einführende, leicht distanzierende Funktion von τινός bei einer sonst nicht näher bekannten Person.
- source_word: προβεβηκότος τὴν ἡλικίαν
  choice: an Jahren weit fortgeschritten
  rationale: Die Wendung bezeichnet ein hohes beziehungsweise fortgeschrittenes Alter und bereitet zugleich die ironische Parallele des folgenden Satzteils vor.
- source_word: οὐδὲν δὲ ἧττον καὶ τὴν ἄγνοιαν
  choice: an Unwissenheit jedoch nicht weniger
  rationale: 'Die knappe Vergleichsform erhält die scharfe Ironie: Auranus war nicht nur an Jahren, sondern ebenso an Unwissenheit weit fortgeschritten.'
