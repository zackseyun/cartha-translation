  yaml_path: translation/deuterocanon/2_maccabees/004/014.yaml
  text: so that the priests were no longer eager for the services of the altar[a], but, despising the temple and neglecting the sacrifices, they hurried to take part in the unlawful exercise in the wrestling school after the summons to the discus throw[b];
translation:
  language: de
  text: So kam es, dass die Priester keinen Eifer mehr für den Dienst am Altar zeigten. Stattdessen verachteten sie den Tempel und vernachlässigten die Opfer; sie eilten, um an der gesetzwidrigen Zuwendung[a] in der Ringschule teilzuhaben, nachdem zum Diskuswurf[b] aufgerufen worden war.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der griechische Ausdruck ist schwierig. Er kann eine gesetzwidrige Zuwendung, Bereitstellung, Finanzierung oder Ausstattung bezeichnen, die mit den sportlichen Aktivitäten verbunden war.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „nach dem Aufruf des Diskus“. Gemeint ist der Aufruf zur Teilnahme am Diskuswurf.'
    reason: cultural_note
lexical_decisions:
- source_word: λειτουργίας
  choice: Dienst
  rationale: Im kultischen Zusammenhang bezeichnet das Wort den priesterlichen Dienst am Altar. Der Singular als Sammelbegriff klingt im Deutschen natürlich und vermeidet eine Verengung auf spätere kirchliche Liturgie.
- source_word: προθύμους
  choice: Eifer zeigen
  rationale: Die Wendung gibt Bereitschaft und engagierten Einsatz wieder und bildet einen klaren Gegensatz zur anschließenden Vernachlässigung.
- source_word: νεὼ
  choice: Tempel
  rationale: Gemeint ist hier der Jerusalemer Tempel; „Tempel“ ist die klare und übliche deutsche Bezeichnung.
- source_word: καταφρονοῦντες
  choice: verachteten
  rationale: Das Verb drückt aktive Geringschätzung aus, nicht bloß mangelndes Interesse.
- source_word: ἀμελοῦντες
  choice: vernachlässigten
  rationale: Die Priester kamen ihrer gebotenen Sorge für die Opfer nicht nach; „vernachlässigen“ bewahrt diesen Vorwurf.
- source_word: παλαίστρῃ
  choice: Ringschule
  rationale: Eine παλαίστρα war eine Anlage beziehungsweise Schule für Ringkampf und andere athletische Übungen. „Ringschule“ ist präziser als das weiter gefasste „Gymnasium“.
- source_word: παρανόμου χορηγίας
  choice: gesetzwidrige Zuwendung
  rationale: χορηγία kann eine bereitgestellte Leistung, Finanzierung, Ausstattung oder Zuwendung bezeichnen. Die gewählte Formulierung bewahrt die schwierige und im Kontext nicht völlig eindeutige Bedeutung, statt sie sicher als sportliche Übung auszugeben.
- source_word: ἔσπευδον μετέχειν
  choice: sie eilten, um … teilzuhaben
  rationale: Die Formulierung erhält sowohl die hastige Hinwendung als auch den Gedanken der Beteiligung beziehungsweise Teilhabe.
- source_word: μετὰ τὴν τοῦ δίσκου πρόσκλησιν
  choice: nachdem zum Diskuswurf aufgerufen worden war
  rationale: Dies gibt die zeitliche Abfolge und den athletischen Sinn der wörtlichen Wendung „nach dem Aufruf des Diskus“ in natürlichem Deutsch wieder.
theological_decisions:
- issue: Bedeutung von παρανόμου im Verhältnis zum jüdischen Gesetz und zur hellenisierenden Sportkultur
  choice: gesetzwidrig
  alternative: gesetzlos; nach dem Gesetz verboten; frevelhaft
  rationale: Der Zusammenhang bewertet die Teilnahme als Gegensatz zum überlieferten jüdischen Gesetz und zu den priesterlichen Pflichten. Das griechische Adjektiv bleibt jedoch allgemeiner; „gesetzwidrig“ bewahrt die negative rechtlich-moralische Wertung, ohne deren genaue Grundlage im Haupttext festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzverknüpfung „So kam es, dass“ macht den im Griechischen mit ὥστε ausgedrückten Folgezusammenhang als eigenständig zitierbaren Vers verständlich. Die schwierige Wendung παρανόμου χορηγίας wird bewusst nicht zu einer eindeutig bestimmten sportlichen Übung verengt.
