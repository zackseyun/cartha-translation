base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/004/017.yaml
  text: For it is not easy to act wickedly against the divine laws[b][a]; but the time that follows will make these things clear.
translation:
  language: de
  text: Denn gegen die göttlichen Gesetze zu freveln[a] ist keine leichte Sache; doch die darauf folgende Zeit wird das alles deutlich machen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „gottlos gegen die göttlichen Gesetze zu handeln“. Das griechische Verb bezeichnet ehrfurchtsloses oder ungottesfürchtiges Handeln.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „doch die Folgezeit wird dies offenbaren“.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀσεβεῖν
  choice: zu freveln
  rationale: Das Verb bezeichnet ehrfurchtsloses, gottloses Handeln. „Freveln“ bewahrt die religiös-moralische Dimension und bezeichnet eine konkrete Verfehlung, ohne sie auf eine bloße innere Haltung zu beschränken.
- source_word: εἰς τοὺς θείους νόμους
  choice: gegen die göttlichen Gesetze
  rationale: εἰς bezeichnet hier die Ausrichtung des Frevels gegen etwas. Der Plural „Gesetze“ und das Adjektiv „göttlich“ werden unmittelbar wiedergegeben.
- source_word: οὐ ῥᾴδιον
  choice: ist keine leichte Sache
  rationale: Die Wendung kann wörtlich als „ist nicht leicht“ verstanden werden, trägt im Zusammenhang aber auch den Sinn, dass ein solches Handeln keine geringfügige oder folgenlose Angelegenheit ist. Die gewählte Formulierung lässt beide Nuancen zu.
- source_word: ὁ ἀκόλουθος καιρός
  choice: die darauf folgende Zeit
  rationale: Die Formulierung wahrt den zeitlichen Bezug des Griechischen, ohne die Aussage ausdrücklich endzeitlich oder anderweitig theologisch festzulegen.
- source_word: ταῦτα … δηλώσει
  choice: wird das alles deutlich machen
  rationale: δηλόω bedeutet „deutlich machen“, „zeigen“ oder „offenbaren“. „Das alles“ gibt den griechischen Plural ταῦτα idiomatisch wieder und verweist auf die angesprochenen Vorgänge und ihre Bedeutung.
theological_decisions:
- issue: Aussagekraft der Warnung vor dem Frevel gegen Gottes Gesetze
  choice: Die Verletzung der göttlichen Gesetze ist keine leichte oder belanglose Sache; die folgenden Ereignisse werden dies erkennbar machen.
  alternative: 'Ein solches frevelhaftes Handeln ist lediglich schwer auszuführen; oder: Die folgende Zeit wird ausdrücklich ein göttliches Gericht offenbaren.'
  rationale: Das Griechische kann sowohl praktische Schwierigkeit als auch moralisches Gewicht anklingen lassen. Der Hinweis auf die folgende Zeit legt eine Warnung vor erkennbaren Folgen nahe, nennt jedoch das göttliche Gericht nicht ausdrücklich. Die Übersetzung bewahrt diese Spannung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Freveln“ ist bewusst leicht gehoben, bleibt jedoch verständlich und bildet die religiös-moralische Färbung des griechischen Verbs prägnant ab. Die Satzstruktur folgt dem knappen, warnenden Ton des Originals.
