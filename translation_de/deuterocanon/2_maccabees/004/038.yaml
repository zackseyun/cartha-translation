revisions:
- from: Und als er vor Zorn entbrannt war, nahm er Andronikos unverzüglich den Purpurmantel ab und riss ihm die Gewänder vom Leib. Dann ließ er ihn durch die ganze Stadt bis genau an die Stelle führen, an der er sich an Onias vergangen hatte, und dort ließ er den blutbefleckten Mörder[a] niederstoßen[b]. So ließ der Herr ihm die verdiente Strafe zuteilwerden.
  to: Und von Zorn entbrannt nahm er Andronikos sofort den Purpurmantel ab und zerriss seine Gewänder. Dann führte er ihn durch die ganze Stadt genau zu der Stelle, an der er an Onias Frevel verübt hatte. Dort tötete[b] er den blutschuldigen Mörder[a]. Der Herr ließ ihm die verdiente Strafe zuteilwerden.
  rationale: Die Revision stellt die aktiven Handlungen des griechischen Textes wieder her, bewahrt den Frevelcharakter der Tat gegen Onias und vermeidet eine über das ausdrücklich Gesagte hinausgehende Beschreibung des Zerreißens der Gewänder. Die Aussage, dass der Herr die angemessene Strafe zuteilwerden lässt, bleibt klar erhalten.
  reviewer_model: gpt-5.6-terra
