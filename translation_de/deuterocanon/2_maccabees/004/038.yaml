base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/004/038.yaml
  text: And[a], inflamed with anger, he immediately stripped off Andronikos's purple robe and tore off his garments, and after leading him around through the whole city to the very place where he had committed his impiety against Onias, there he dispatched the murderer[b], the Lord rendering to him the punishment he deserved.
translation:
  language: de
  text: Und von Zorn entbrannt nahm er Andronikos sofort den Purpurmantel ab und zerriss seine Gewänder. Dann führte er ihn durch die ganze Stadt genau zu der Stelle, an der er an Onias Frevel verübt hatte. Dort tötete[b] er den blutschuldigen Mörder[a]. Der Herr ließ ihm die verdiente Strafe zuteilwerden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort bezeichnet einen durch Blutvergießen befleckten, blutschuldigen Mörder.
    reason: lexical_alternative
  - marker: b
    text: Das griechische Verb kann an das Töten mit einem Speer oder einer ähnlichen Waffe denken lassen; sicher ist hier, dass Andronikos getötet wurde.
    reason: lexical_alternative
lexical_decisions:
- source_word: πυρωθεὶς τοῖς θυμοῖς
  choice: vor Zorn entbrannt
  rationale: Bewahrt das Feuerbild von πυρόω und gibt den heftigen Zorn in natürlichem, gehobenem Deutsch wieder.
- source_word: παραχρῆμα
  choice: unverzüglich
  rationale: Gibt die unmittelbar einsetzende Handlung präzise und erzählerisch flüssig wieder.
- source_word: τὴν τοῦ Ἀνδρονίκου πορφύραν περιελόμενος
  choice: nahm er Andronikos den Purpurmantel ab
  rationale: πορφύρα bezeichnet hier wahrscheinlich das purpurne Ranggewand; περιαιρέω bezeichnet dessen Entfernung.
- source_word: τοὺς χιτῶνας περιρρήξας
  choice: riss ihm die Gewänder vom Leib
  rationale: Gibt die gewaltsame Entkleidung und öffentliche Erniedrigung wieder, ohne den Plural χιτῶνας unnatürlich als mehrere Untergewänder zu konkretisieren.
- source_word: περιαγαγὼν καθʼ ὅλην τὴν πόλιν
  choice: ließ er ihn durch die ganze Stadt führen
  rationale: Das kausative deutsche 'ließ führen' passt zum Handeln eines Herrschers; die öffentliche Vorführung bleibt erkennbar, ohne eine formelle Parade einzutragen.
- source_word: ἐπʼ αὐτὸν τὸν τόπον
  choice: bis genau an die Stelle
  rationale: Das emphatische αὐτόν wird durch 'genau' wiedergegeben.
- source_word: οὗπερ τὸν Ὀνίαν ἠσέβησεν
  choice: an der er sich an Onias vergangen hatte
  rationale: Die Wendung bewahrt den schweren moralisch-religiösen Charakter von ἀσεβέω und bezeichnet zugleich den gegen Onias gerichteten Frevel.
- source_word: τὸν μιαφόνον
  choice: den blutbefleckten Mörder
  rationale: μιαφόνος bezeichnet nicht nur einen Mörder, sondern einen durch Blutvergießen befleckten beziehungsweise blutschuldigen Täter.
- source_word: ἀπεκόντισεν
  choice: ließ er ... niederstoßen
  rationale: Das seltene, bildhafte Verb hängt mit der Waffe ἀκόντιον zusammen und bezeichnet hier die Tötung; 'niederstoßen' erhält die mögliche Waffenanspielung, ohne eine bestimmte Waffe festzulegen.
- source_word: τοῦ κυρίου τὴν ἄξιαν αὐτῷ κόλασιν ἀποδόντος
  choice: So ließ der Herr ihm die verdiente Strafe zuteilwerden
  rationale: Gibt den Genitivus absolutus als deutende Folgerung wieder und hält ausdrücklich fest, dass der Herr die angemessene Vergeltung bewirkte.
theological_decisions:
- issue: Wiedergabe von κύριος beim göttlichen Gericht
  choice: der Herr
  alternative: Gott; der HERR
  rationale: Der griechische Text verwendet κύριος. 'Der Herr' bewahrt den Titel, ohne den Gottesnamen typografisch einzutragen oder den Titel durch 'Gott' zu ersetzen.
- issue: Verhältnis menschlicher Hinrichtung und göttlicher Vergeltung
  choice: Die menschliche Tötung wird erzählt und anschließend ausdrücklich als vom Herrn zugeteilte Strafe gedeutet.
  alternative: Nur menschliche Rechtsprechung darstellen; den Herrn zum unmittelbaren Vollstrecker machen
  rationale: Der Genitivus absolutus schreibt die angemessene Vergeltung dem Herrn zu, während das finite Verb die konkrete Vollstreckung durch den erzählten Herrscher bezeichnet. Beide Ebenen bleiben erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Erzählbewegung. 'Purpurmantel' macht das Ranggewand verständlich; 'vom Leib reißen' vermittelt die gewaltsame öffentliche Demütigung. Die beiden Fußnoten sichern die stärkeren beziehungsweise möglichen Bedeutungsnuancen von μιαφόνος und ἀπεκόντισεν.
