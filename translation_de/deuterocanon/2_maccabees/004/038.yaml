    issue: Kausative Wiedergabe der Handlungen
    rationale: περιαγαγών und ἀπεκόντισεν bezeichnen Handlungen des erzählten Subjekts. „ließ ihn ... führen“ und „ließ ... niederstoßen“ fügen nicht ausdrücklich belegte Mittler ein und schwächen die aktive Darstellung ab.
  - severity: medium
    issue: Abschwächung von ἠσέβησεν
    rationale: „Sich an jemandem vergangen“ kann schweres Unrecht bezeichnen, bringt aber den im griechischen Verb enthaltenen Frevel- bzw. Gottlosigkeitsaspekt nicht hinreichend zur Geltung.
  - severity: low
    issue: „Vom Leib reißen“ als zusätzliche Konkretisierung
    rationale: Das griechische περιρρήξας besagt, dass die Gewänder zerrissen wurden; dass sie ihm dabei vom Leib gerissen wurden, ist möglich, aber nicht ausdrücklich gesagt.
