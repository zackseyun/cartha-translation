  source_fidelity: 'Die Hauptaussage und die theologischen Bezugspunkte sind getroffen. Allerdings sind die Kausativformen „ließ ... führen“ und „ließ ... niederstoßen“ gegenüber den aktiven griechischen Partizipien und dem finiten Verb unnötig distanzierend: Der erzählte Handelnde führt Andronikos selbst durch die Stadt und tötet ihn. „Sich an Onias vergangen“ ist zudem weniger deutlich als ἠσέβησεν, das den Frevelcharakter der Tat hervorhebt.'
  naturalness: Der Entwurf ist überwiegend flüssiges, würdiges modernes Standarddeutsch. Die aktivere Satzführung ist sowohl quellennäher als auch erzählerisch klarer. „Seine Gewänder zerriss“ vermeidet die nicht eindeutig vom griechischen Text verlangte Ergänzung „vom Leib“.
  terminology: „Purpurmantel“, „der Herr“ und „blutschuldiger Mörder“ sind angemessen. „Frevel an Onias verübt“ erhält die religiös-moralische Schwere von ἀσεβέω. Die Fußnoten werden unmittelbar an die Wörter „Mörder“ und „tötete“ gesetzt, auf die sie sich beziehen.
