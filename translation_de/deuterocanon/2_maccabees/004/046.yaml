  text: But Menelaus[a], already having been won over, promised Ptolemy son of Dorymenes a considerable amount of money to persuade the king.
translation:
  language: de
  text: Menelaos aber, der bereits für sich eingenommen worden war[a], versprach Ptolemäus, dem Sohn des Dorymenes, eine beträchtliche Geldsumme, um den König zu überzeugen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der bereits gewonnen worden war“; möglicherweise auch: „der bereits günstig gestimmt worden war“. Das griechische Partizip λελιμμένος ist schwer zu deuten. Es bezeichnet wahrscheinlich, dass Menelaos schon zuvor beeinflusst oder für eine Sache gewonnen worden war, ohne die Art dieser Einflussnahme näher zu bestimmen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λελιμμένος
  choice: in die Enge getrieben
  rationale: Das schwer zu deutende Partizip beschreibt hier am ehesten die bereits bedrängte beziehungsweise nahezu unterlegene Lage des Menelaos. Die Wiedergabe passt zum Prozesskontext, ohne ein im Griechischen nicht genanntes Mittel der Einflussnahme einzutragen.
- source_word: ἐπηγγείλατο
  choice: versprach
  rationale: Die mediale Form bezeichnet hier die Zusage einer Zahlung; „versprach“ ist präzise und idiomatisch.
- source_word: χρήματα ἱκανά
  choice: eine beträchtliche Geldsumme
  rationale: χρήματα bezeichnet Geld, ἱκανά eine erhebliche beziehungsweise ausreichende Menge. Im Zusammenhang mit der zugesagten Einflussnahme ist „eine beträchtliche Geldsumme“ natürlich und sachlich.
- source_word: τῷ Πτολεμαίῳ Δορυμένους
  choice: Ptolemäus, dem Sohn des Dorymenes
  rationale: Der Genitiv Δορυμένους dient als Patronym und identifiziert Ptolemäus als Sohn des Dorymenes.
- source_word: πρὸς τὸ πεῖσαι τὸν βασιλέα
  choice: damit er den König überredete
  rationale: 'πρὸς τό mit Infinitiv drückt einen Zweck aus. Der Dativ Ptolemäus ist im Zusammenhang der naheliegende Handelnde: Er soll den König zugunsten des Menelaos beeinflussen.'
