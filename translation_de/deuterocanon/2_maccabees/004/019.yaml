base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/004/019.yaml
  text: Jason the vile man sent Antiochians from Jerusalem as envoys, carrying three hundred silver drachmas for the sacrifice to Heracles; but those who carried them requested that they not be used for sacrifice,
translation:
  language: de
  text: Der verwerfliche Jason sandte Antiochener als Kultgesandte von Jerusalem[a]; sie überbrachten dreihundert Silberdrachmen für ein Opfer für Herakles. Doch die Überbringer baten darum, das Geld nicht für ein Opfer zu verwenden,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „gleichsam von Jerusalem“ beziehungsweise „im Namen Jerusalems“. Die Formulierung kann die repräsentative Entsendung aus Jerusalem hervorheben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μιερὸς
  choice: der verwerfliche
  rationale: Das seltene, stark abwertende Adjektiv bezeichnet Jason als moralisch beziehungsweise religiös befleckt. „Verwerflich“ bewahrt das ausdrückliche Urteil des Erzählers in natürlichem modernem Deutsch.
- source_word: θεωρούς
  choice: als Festgesandte
  rationale: θεωροί sind offizielle Abgesandte zu Festen oder kultischen Veranstaltungen. „Festgesandte“ gibt hier sowohl die repräsentative als auch die kultisch-festliche Funktion wieder.
- source_word: ὡς ἀπʼ Ἱεροσολύμων
  choice: von Jerusalem
  rationale: Die Wendung bezeichnet die dargestellte Herkunft beziehungsweise repräsentative Entsendung aus Jerusalem. Das bedeutungsoffene ὡς wird in einer Fußnote ausgewiesen.
- source_word: Ἀντιοχέας
  choice: Antiochener
  rationale: Das Ethnikon bezeichnet Personen, die Antiochia zugeordnet sind. „Antiochener“ ist die übliche und klare deutsche Bezeichnung.
- source_word: παρακομίζοντας
  choice: sie überbrachten
  rationale: Das Partizip beschreibt das Befördern der Geldsumme. Ein eigener Satzteil ist im Deutschen klarer als eine lange Partizipialkonstruktion.
- source_word: ἀργυρίου δραχμὰς τριακοσίους
  choice: dreihundert Silberdrachmen
  rationale: Die Wiedergabe erhält Betrag und Materialangabe knapp und verständlich.
- source_word: εἰς τὴν τοῦ Ἡρακλέους θυσίαν
  choice: für das Opfer zu Ehren des Herakles
  rationale: Die Formulierung bezeichnet den vorgesehenen kultischen Zweck und macht deutlich, dass Herakles der Empfänger beziehungsweise die verehrte Gottheit ist.
- source_word: ἠξίωσαν
  choice: baten darum
  rationale: Das Verb kann fordern, darauf bestehen oder ersuchen bedeuten. „Baten darum“ bewahrt den Charakter eines nachdrücklichen Ersuchens, ohne die Stärke zu überzeichnen.
- source_word: μὴ χρησθαι εἰς θυσίαν
  choice: das Geld nicht für ein Opfer zu verwenden
  rationale: Gemeint ist die Nichtverwendung der überbrachten Summe für einen Opferzweck. „Das Geld“ stellt den Bezug im Deutschen eindeutig her.
theological_decisions:
- issue: Ausdrückliches moralisches Urteil in μιερὸς
  choice: Das abwertende Urteil mit „der verwerfliche Jason“ beibehalten
  alternative: der befleckte Jason; der ruchlose Jason
  rationale: Die Verurteilung Jasons gehört zur Rhetorik des griechischen Textes und darf weder abgeschwächt noch durch eine konfessionell geprägte Deutung ersetzt werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Festgesandte“ bewahrt die besondere offizielle und kultische Bedeutung von θεωροί. Der Vers endet entsprechend der Vorlage syntaktisch offen mit einem Komma, da der Gedanke im folgenden Vers fortgeführt wird.
