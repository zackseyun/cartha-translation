  text: Jason[a], the brother of Onias, undermined the high priesthood, promising the king through a petition three hundred sixty talents of silver[b], and eighty talents from some other revenue.
translation:
  language: de
  text: Jason, der Bruder des Onias, erschlich sich das Amt des Hohepriesters, indem er dem König durch eine Eingabe[a] 360 Talente Silber[b] und weitere achtzig Talente aus einer anderen Einnahmequelle versprach.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „bei einer Audienz“ beziehungsweise „durch eine persönliche Vorsprache“; das griechische Wort kann sowohl eine förmliche Eingabe als auch den persönlichen Zugang zum König bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „sechzig Talente zusätzlich zu den dreihundert“, also insgesamt 360 Talente Silber.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπενόθευσεν
  choice: erschlich sich
  rationale: Das Verb bezeichnet ein verfälschendes oder unlauteres Vorgehen. Im Zusammenhang mit dem Hohepriesteramt gibt „erschlich sich“ sowohl die Aneignung des Amtes als auch deren moralisch anstößigen Charakter knapp und natürlich wieder.
- source_word: ἀρχιερωσύνην
  choice: das Amt des Hohepriesters
  rationale: Gemeint ist das Amt beziehungsweise die Würde des Hohepriesters. Die ausgeschriebene Form ist im heutigen Deutsch klarer als das abstraktere „Hohepriestertum“.
- source_word: ἐπαγγειλάμενος
  choice: indem er … versprach
  rationale: 'Das Partizip beschreibt, durch welches Vorgehen Jason das Amt an sich brachte: Er sagte dem König Zahlungen zu.'
- source_word: διʼ ἐντεύξεως
  choice: durch eine Eingabe
  rationale: ἔντευξις kann eine förmliche Eingabe, eine persönliche Vorsprache oder eine Audienz bezeichnen. „Durch eine Eingabe“ eignet sich als zurückhaltende Haupttextfassung; die verbleibende Mehrdeutigkeit wird in der Fußnote erhalten.
- source_word: ἀργυρίου
  choice: Silber
  rationale: Der Genitiv bezeichnet den Stoff beziehungsweise den Zahlungswert; „Talente Silber“ ist eine natürliche und quellennahe deutsche Formulierung.
- source_word: τάλαντα ἑξήκοντα πρὸς τοῖς τριακοσίοις
  choice: 360 Talente Silber
  rationale: Die griechische Formulierung lautet wörtlich „sechzig Talente zusätzlich zu den dreihundert“ und ergibt insgesamt 360. Der Haupttext nennt die Summe idiomatisch; die Quellenstruktur bleibt in der Fußnote sichtbar.
- source_word: προσόδου τινὸς ἄλλης
  choice: aus einer anderen Einnahmequelle
  rationale: πρόσοδος bezeichnet Einnahmen oder Ertrag. Die Formulierung wahrt das unbestimmte τινός, ohne im Deutschen schwerfällig zu wirken.
- source_word: τάλαντα ὀγδοήκοντα
  choice: weitere achtzig Talente
  rationale: „Weitere“ kennzeichnet diese Summe als zusätzliche Zusage aus einer anderen Einnahmequelle.
theological_decisions:
- issue: Moralische Wertung von Jasons Vorgehen gegenüber dem Hohepriesteramt
  choice: erschlich sich das Amt des Hohepriesters
  alternative: untergrub das Hohepriesteramt; brachte das Hohepriesteramt auf unlautere Weise an sich
  rationale: Der Text schildert keine neutrale Amtsnachfolge, sondern eine durch finanzielle Zusagen bewirkte, unlautere Aneignung. „Erschlich sich“ erhält diese negative Wertung, ohne eine über den Kontext hinausgehende konkrete Straftat zu benennen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch in würdigem erzählerischem Stil. „Erschlich sich“ bringt die negative Aussage des seltenen griechischen Verbs idiomatisch zum Ausdruck. Die Fußnotenmarker stehen unmittelbar bei den jeweils erläuterten Wendungen.
