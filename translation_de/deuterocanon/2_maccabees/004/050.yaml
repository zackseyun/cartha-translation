base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/004/050.yaml
  text: But Menelaus[a], because of the greed of those in power, remained in office, growing in wickedness and having become a great plotter against his fellow citizens.
translation:
  language: de
  text: Menelaus aber blieb wegen der Habgier der Machthaber[a] im Amt, nahm an Bosheit zu und war zu einem großen Intriganten gegen seine Mitbürger geworden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „durch die Habgier der Machthaber“.'
    reason: Die griechische Präposition διά mit Akkusativ bezeichnet hier die Ursache; die formalere Wiedergabe mit „durch“ ist ebenfalls möglich.
lexical_decisions:
- source_word: διὰ τὰς τῶν κρατούντων πλεονεξίας
  choice: wegen der Habgier der Machthaber
  rationale: διά mit Akkusativ hat hier kausalen Sinn. „Habgier“ gibt πλεονεξία prägnant wieder; „Machthaber“ bezeichnet natürlich und treffend diejenigen, die politische oder amtliche Gewalt ausüben.
- source_word: ἔμενεν ἐπὶ τῇ ἀρχῇ
  choice: blieb im Amt
  rationale: ἀρχή bezeichnet im Zusammenhang Menelaus’ Amtsstellung. „Im Amt bleiben“ ist im modernen Deutschen natürlich und vermeidet die weitergehende Aussage, er habe allgemein die Macht behalten.
- source_word: ἐπιφυόμενος τῇ κακίᾳ
  choice: nahm er an Bosheit zu
  rationale: Das Partizip beschreibt eine fortschreitende Zunahme; die Formulierung bewahrt diesen Verlauf und gibt κακία als moralische Bosheit wieder.
- source_word: μέγας τῶν πολιτῶν ἐπίβουλος καθεστώς
  choice: wurde zu einem großen Intriganten gegen seine Mitbürger
  rationale: ἐπίβουλος bezeichnet jemanden, der anderen nachstellt oder gegen sie Ränke schmiedet. „Intrigant“ bewahrt dieses aktive Moment, ohne eine förmliche Verschwörung vorauszusetzen. „Mitbürger“ gibt die politische Beziehung von πολῖται wieder; „wurde“ drückt den erreichten Zustand von καθεστώς aus.
