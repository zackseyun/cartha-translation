translation:
  language: de
  text: Was diese Angelegenheiten betraf, kam es zu einem Gerichtsverfahren gegen Menelaus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „… entstand ein Rechtsstreit gegen Menelaus.“ Die knappe griechische Formulierung kann sowohl das Aufkommen eines Rechtsfalls als auch die Einleitung eines Gerichtsverfahrens bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Περὶ δὲ τούτων
  choice: Was diese Angelegenheiten betraf
  rationale: περί mit dem Genitiv führt das Thema ein; δέ markiert hier vor allem den Fortgang der Erzählung. Die deutsche Wendung gibt beides natürlich wieder, ohne ein im Griechischen nicht ausdrücklich vorhandenes zeitliches „nun“ einzufügen.
- source_word: ἐνέστη
  choice: kam es zu
  rationale: Die intransitive Form bezeichnet hier das Eintreten oder Entstehen des gerichtlichen Vorgangs. „Kam es zu“ bleibt nahe an dieser offenen Ausdrucksweise und vermeidet die stärkere Annahme, ein nicht genannter Handelnder habe das Verfahren förmlich eröffnet.
- source_word: κρίσις
  choice: Gerichtsverfahren
  rationale: κρίσις kann Urteil, gerichtliche Entscheidung oder den gerichtlichen Vorgang bezeichnen. Im Zusammenhang ist „Gerichtsverfahren“ verständlich und rechtlich präzise, ohne eine bestimmte Verfahrensstufe wie eine Hauptverhandlung festzulegen.
- source_word: ἐπὶ τὸν Μενέλαον
  choice: gegen Menelaus
  rationale: ἐπί mit Akkusativ bezeichnet im rechtlichen Zusammenhang die Ausrichtung des Verfahrens gegen Menelaus.
