base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/004/043.yaml
  text: For this reason they wounded many of them[a], struck down some, and drove them all into flight; and they seized the temple-robber himself beside the treasury.
translation:
  language: de
  text: Aus diesem Grund verwundeten sie viele von ihnen, schlugen einige nieder und trieben sie alle in die Flucht; den Tempelräuber[a] selbst aber ergriffen sie beim Schatzhaus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Frevler“. Das griechische Wort bezeichnet jemanden, der sich an Heiligem vergreift, besonders durch den Raub an einem Tempel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διʼ ἣν αἰτίαν
  choice: Aus diesem Grund
  rationale: Gibt die kausale Verknüpfung idiomatisch und genau wieder.
- source_word: τραυματίας ἐποίησαν
  choice: verwundeten
  rationale: Die wörtliche Wendung „zu Verwundeten machen“ wird im Deutschen natürlich verbal ausgedrückt; „verwunden“ bewahrt den konkreten Sinn körperlicher Gewalt.
- source_word: κατέβαλον
  choice: schlugen ... nieder
  rationale: Das Verb bezeichnet ein Niederwerfen oder Zu-Fall-Bringen. Die Wiedergabe lässt offen, ob die Betroffenen dabei getötet wurden.
- source_word: εἰς φυγὴν συνήλασαν
  choice: trieben sie alle in die Flucht
  rationale: Bewahrt sowohl den Zwang zum Fliehen als auch die ausdrückliche Einbeziehung aller.
- source_word: τὸν ἱερόσυλον
  choice: den Tempelräuber
  rationale: ἱερόσυλος bezeichnet jemanden, der sich an Heiligtümern beziehungsweise heiligem Eigentum vergreift. Im Zusammenhang mit dem Schatzhaus bringt „Tempelräuber“ die konkrete Tat prägnant zum Ausdruck.
- source_word: ἐχειρώσαντο
  choice: ergriffen sie
  rationale: Das Medium bedeutet hier, jemanden in seine Gewalt zu bringen. „Ergriffen“ ist deutlich, ohne den stärker formal-rechtlichen Sinn von „verhafteten“ einzutragen.
- source_word: παρὰ τὸ γαζοφυλάκιον
  choice: beim Schatzhaus
  rationale: Gibt die räumliche Nähe und die Bedeutung von γαζοφυλάκιον als Schatzhaus beziehungsweise Schatzkammer natürlich wieder.
theological_decisions:
- issue: Bedeutungsumfang von ἱερόσυλος im Tempelkontext
  choice: Tempelräuber
  alternative: Frevler; Tempelplünderer
  rationale: Der Ausdruck verbindet den verwerflichen Zugriff auf Heiliges mit dem konkreten Raub an einem Heiligtum. Wegen des unmittelbaren Bezugs auf das Schatzhaus steht die konkrete Bedeutung im Haupttext; die weiter gefasste Bedeutung wird in der Fußnote erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die gereihte Satzstruktur des Griechischen bleibt erhalten; zugleich werden unnatürliche wörtliche Wendungen idiomatisch formuliert. Der Fußnotenmarker steht beim tatsächlich erläuterten Ausdruck „Tempelräuber“.
