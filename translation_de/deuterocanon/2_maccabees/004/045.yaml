  yaml_path: translation/deuterocanon/2_maccabees/004/045.yaml
  text: And when the king arrived at Tyre, the three men sent by the council presented their case before him.
translation:
  language: de
  text: Als der König nach Tyrus gekommen war, trugen die drei Männer, die vom Ältestenrat entsandt worden waren, ihm ihre Rechtssache vor.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καταντήσαντος
  choice: gekommen war
  rationale: Das Partizip bezeichnet hier das Eintreffen des Königs in Tyrus; die vorzeitige Form gibt das zeitliche Verhältnis zum Hauptsatz natürlich wieder.
- source_word: γερουσίας
  choice: Ältestenrat
  rationale: Das Wort bezeichnet ein aus Ältesten bestehendes Ratsgremium; »Ältestenrat« ist präziser und im Deutschen verständlicher als eine bloße Wiedergabe mit »Rat«.
- source_word: δικαιολογίαν ἐποιήσαντο
  choice: trugen … ihre Rechtssache vor
  rationale: Die Wendung kann eine Verteidigung beziehungsweise rechtliche Darlegung bezeichnen. »Ihre Rechtssache vortragen« wahrt den juristischen Sinn, ohne festzulegen, ob die Männer ausschließlich als Angeklagte oder als Ankläger auftraten.
- source_word: ἐπʼ αὐτοῦ
  choice: ihm … vor
  rationale: Gemeint ist, dass die Darlegung vor dem König beziehungsweise in seiner Gegenwart erfolgte; die deutsche Konstruktion gibt dies idiomatisch wieder.
