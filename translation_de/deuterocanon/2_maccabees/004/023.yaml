base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/004/023.yaml
  text: But after a period of three years[a], Jason sent Menelaus, the brother of the aforementioned Simon, to carry the money to the king and to deliver memoranda concerning necessary matters.
translation:
  language: de
  text: Nach drei Jahren aber sandte Jason Menelaus, den Bruder des bereits erwähnten Simon, um dem König das Geld zu überbringen und die Denkschriften zu notwendigen Angelegenheiten zu erledigen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „schriftliche Berichte zu notwendigen Angelegenheiten fertigzustellen“ oder „schriftliche Eingaben zu notwendigen Angelegenheiten auszuführen“. Das griechische Wort kann Denkschriften, Aktennotizen oder schriftliche Berichte bezeichnen; auch die genaue verwaltungstechnische Bedeutung von „erledigen“ ist unsicher.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ τριετῆ χρόνον
  choice: Nach drei Jahren aber
  rationale: μετά mit Akkusativ bezeichnet den Ablauf eines Zeitraums; δέ wird als milder erzählerischer Übergang mit „aber“ wiedergegeben.
- source_word: ἀπέστειλεν Ἰάσων Μενέλαον
  choice: sandte Jason Menelaus
  rationale: Die schlichte Erzählform gibt den Aorist von ἀποστέλλω natürlich und quellennah wieder.
- source_word: τὸν τοῦ προσηνομένου Σίμωνος ἀδελφόν
  choice: den Bruder des bereits erwähnten Simon
  rationale: Das Partizip προσηνομένου verweist auf den zuvor genannten Simon; „bereits erwähnt“ ist modernes, verständliches Deutsch.
- source_word: παρακομίζοντα τὰ χρήματα τῷ βασιλεῖ
  choice: um dem König das Geld zu überbringen
  rationale: Das Partizip bezeichnet hier den Auftrag beziehungsweise Zweck der Sendung; χρήματα meint im Zusammenhang Geldmittel.
- source_word: περὶ πραγμάτων ἀναγκαίων
  choice: über notwendige Angelegenheiten
  rationale: Die Wiedergabe bleibt nahe an der offenen Bedeutung von πράγματα und ἀναγκαῖος, ohne Dringlichkeit oder Inhalt näher festzulegen.
- source_word: ὑπομνηματισμοὺς τελέσοντα
  choice: die schriftlichen Berichte … fertigzustellen
  rationale: ὑπομνηματισμός bezeichnet administrative Aufzeichnungen, Denkschriften oder Berichte; τελέω hat den Sinn des Vollendens beziehungsweise ordnungsgemäßen Ausführens. Eine Fußnote bewahrt die unsichere Verwaltungsnuance.
