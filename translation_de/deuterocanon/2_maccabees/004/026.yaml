  register: Moderne, würdevolle Erzählsprache. Die mit μέν eröffnete Gegenüberstellung wird durch „aber“ angedeutet; der Satz bleibt zugleich als eigenständiger Vers verständlich. Die aktive/passive Wortwiederholung des griechischen Textes wurde bewusst bewahrt.
