  yaml_path: translation/deuterocanon/2_maccabees/004/026.yaml
  text: And Jason[a], who had supplanted his own brother, having himself been supplanted by another, fled and went into the land of the Ammonites.
translation:
  language: de
  text: Jason aber, der seinen eigenen Bruder verdrängt hatte, wurde selbst von einem anderen verdrängt und ging als Flüchtling in das Land der Ammoniter.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der seinen eigenen Bruder hintergangen hatte, wurde selbst von einem anderen hintergangen“. Im Griechischen steht dasselbe Verb zuerst im Aktiv und dann im Passiv; dadurch wird die ironische Umkehrung betont.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπονοθεύσας
  choice: verdrängt hatte
  rationale: Das Verb bezeichnet hier Jasons hinterlistig bewirkte Verdrängung seines Bruders aus dem Hohepriesteramt. „Verdrängen“ gibt das Ergebnis klar wieder, ohne den im Verb mitschwingenden unlauteren Vorgang zu stark festzulegen.
- source_word: ὑπονοθευθεὶς
  choice: wurde nun selbst ... verdrängt
  rationale: 'Die Wiederholung desselben deutschen Verbs in passiver Form bewahrt die pointierte Umkehrung des Griechischen: Wer seinen Bruder verdrängte, wird seinerseits verdrängt. „nun selbst“ hebt diese Ironie hervor.'
- source_word: φυγάς
  choice: floh als Flüchtling
  rationale: φυγάς bezeichnet Jason als Flüchtling beziehungsweise Verbannten. Die Formulierung erhält diesen nominalen Zug und verbindet ihn im Deutschen natürlich mit seiner Flucht.
- source_word: ὑπῆλθεν
  choice: in ... floh
  rationale: Das Bewegungsverb wird zusammen mit φυγάς idiomatisch durch „floh ... in“ wiedergegeben; dadurch bleibt das Ziel der Bewegung eindeutig.
- source_word: τὴν Ἀμμανῖτιν χώραν
  choice: das Land der Ammoniter
  rationale: Die Wendung gibt das ethnische Adjektiv und χώρα verständlich und traditionsnah wieder.
- source_word: ὁ τὸν ἴδιον ἀδελφὸν
  choice: der seinen eigenen Bruder
  rationale: „eigenen“ entspricht ἴδιον und unterstreicht den Verrat innerhalb der Familie.
