lexical_decisions:
- source_word: ἕνεκα
  choice: angesichts
  rationale: Die Präposition bezeichnet hier den Anlass beziehungsweise die Begründung. „Angesichts“ klingt in diesem elliptischen Satzteil natürlich und bewahrt den Bezug auf die bestehende Lage.
- source_word: τῶν παρόντων
  choice: der gegenwärtigen Umstände
  rationale: Das substantivierte Partizip im Neutrum Plural bezeichnet allgemein das, was gegenwärtig vorliegt. Die Wiedergabe vermeidet eine unnötige Festlegung auf konkrete Bedürfnisse.
- source_word: κατασκευάς
  choice: Ausrüstung
  rationale: Im Zusammenhang mit Trieren meint der Ausdruck deren Bereitstellung, Ausrüstung oder Vorbereitung, nicht zwingend allein ihren Bau.
- source_word: τριηρέων
  choice: Trieren
  rationale: Der historische Fachbegriff bewahrt die genaue Bezeichnung des genannten antiken Kriegsschifftyps.
