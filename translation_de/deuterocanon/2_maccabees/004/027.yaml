  yaml_path: translation/deuterocanon/2_maccabees/004/027.yaml
  text: But Menelaus held on to the office[a], yet he made no provision at all for the money he had promised to the king.
translation:
  language: de
  text: Menelaus behielt zwar sein Amt, traf aber für die Gelder, die er dem König versprochen hatte, überhaupt keine Vorkehrungen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, stärker konkretisierend: „... zahlte er nichts von dem Geld, das er dem König versprochen hatte.“ Das griechische Verb bedeutet eigentlich „in Ordnung bringen“ oder „regelnd verfügen“; im Zusammenhang besagt es, dass er hinsichtlich der versprochenen Gelder keine Vorkehrungen traf.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρχῆς
  choice: Amt
  rationale: Im Zusammenhang bezeichnet ἀρχή die von Menelaus bekleidete hohepriesterliche Stellung, nicht abstrakt Herrschaft oder Macht.
- source_word: ἐκράτει
  choice: behauptete sich
  rationale: Das Imperfekt beschreibt das fortdauernde Festhalten an beziehungsweise Behalten der Stellung; „behauptete sich im Amt“ gibt dies in natürlichem Deutsch wieder.
- source_word: ἐπηγγελμένων
  choice: versprochen hatte
  rationale: Das Partizip verweist auf die Geldsumme, die Menelaus dem König zuvor zugesagt hatte.
- source_word: χρημάτων
  choice: Geld
  rationale: Hier geht es konkret um die dem König geschuldete finanzielle Leistung; „Geld“ ist klar und idiomatisch.
- source_word: οὐδὲν εὐτάκτει
  choice: stellte überhaupt nichts bereit
  rationale: εὐτακτέω bezeichnet dem Wortlaut nach ein Ordnen oder ordnungsgemäßes Bereitstellen. Im finanziellen Zusammenhang ist eine Zahlung gemeint oder zumindest stark nahegelegt; die gewählte Formulierung bewahrt dennoch die etwas weitere Ausdrucksweise des Griechischen.
