revisions:
- from: Und er setzte die für die Juden geltenden königlichen Gnadenerweise[a] beiseite, die durch Johannes, den Vater des Eupolemus, zustande gekommen waren – jener hatte die Gesandtschaft zu den Römern wegen Freundschaft und Bündnis übernommen. Dabei hob er die gesetzmäßige öffentliche Ordnung[b] auf und führte gesetzwidrige Bräuche ein.
  to: Und er setzte die für die Juden geltenden wohlwollenden königlichen Verfügungen[a] beiseite, die durch Johannes, den Vater des Eupolemus – der die Gesandtschaft an die Römer wegen Freundschaft und Bündnis ausgeführt hatte –, erwirkt worden waren; indem er die gesetzmäßigen Einrichtungen[b] abschaffte, führte er gesetzwidrige Bräuche ein.
  rationale: Die Revision gibt die günstigen königlichen Regelungen neutraler wieder, bindet Johannes und seine diplomatische Mission syntaktisch klar aneinander und wahrt bei πολιτείας den Plural sowie die institutionell-gemeinschaftliche Weite des griechischen Ausdrucks. Die semantische Gegenüberstellung von gesetzmäßigen Einrichtungen und gesetzwidrigen Bräuchen bleibt erhalten.
  reviewer_model: gpt-5.6-terra
