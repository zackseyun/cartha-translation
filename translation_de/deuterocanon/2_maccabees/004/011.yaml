  verdict: revise
  source_fidelity: Die Hauptaussage wird getroffen. Die deutsche Fassung sollte jedoch die durch Johannes vermittelten bzw. erwirkten königlichen Regelungen unmittelbarer mit der näheren Bestimmung über seine Gesandtschaft verbinden. Zudem gibt der Plural πολιτείας sich besser mit „Einrichtungen“ wieder als mit dem singularischen, leicht anders konnotierten Ausdruck „öffentliche Ordnung“.
  naturalness: „Gnadenerweise“ ist zwar verständlich, klingt aber religiös bzw. stark herrscherlich und ist für die hier gemeinten günstigen königlichen Regelungen unnötig eng. „Wohlwollende königliche Verfügungen“ ist neutraler und idiomatisch. Die Satzverbindung wird mit klarer Apposition und Partizipialbezug geglättet.
  terminology: „Gesandtschaft an die Römer“, „Freundschaft und Bündnis“, „gesetzmäßige Einrichtungen“ und „gesetzwidrige Bräuche“ geben die diplomatisch-rechtliche Terminologie angemessen wieder. „Verfügungen“ wahrt bei τὰ κείμενα ... βασιλικά den Charakter bestehender königlicher Maßnahmen, ohne „Privilegien“ oder eine bestimmte Rechtsform zu behaupten.
  issues:
  - severity: medium
    issue: „königliche Gnadenerweise“
    rationale: Die Formulierung kann im Deutschen eine persönliche Gunstbezeugung oder einen religiös gefärbten Herrscherakt nahelegen. Das Griechische bezeichnet günstige, bestehende königliche Maßnahmen/Regelungen für die Juden; eine neutralere Wiedergabe ist genauer.
  - severity: medium
    issue: „die gesetzmäßige öffentliche Ordnung“ im Singular
    rationale: νομίμους πολιτείας steht im Plural und bezeichnet hier die etablierten rechtlich-gemeinschaftlichen Einrichtungen bzw. Ordnungen. Der Singular „öffentliche Ordnung“ verschiebt den Akzent in Richtung Sicherheits- oder Ordnungsbegriff.
