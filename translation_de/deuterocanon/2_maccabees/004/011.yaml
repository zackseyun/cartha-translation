base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/004/011.yaml
  text: And he set aside the royal provisions laid down for the Jews through John[a], the father of Eupolemus—the one who had carried out the embassy to the Romans concerning friendship and alliance—and, while abolishing the lawful institutions[b], he introduced unlawful customs.
translation:
  language: de
  text: Und er setzte die für die Juden geltenden wohlwollenden königlichen Verfügungen[a] beiseite, die durch Johannes, den Vater des Eupolemus – der die Gesandtschaft an die Römer wegen Freundschaft und Bündnis ausgeführt hatte –, erwirkt worden waren; indem er die gesetzmäßigen Einrichtungen[b] abschaffte, führte er gesetzwidrige Bräuche ein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die für die Juden bestehenden menschenfreundlichen königlichen Maßnahmen“ oder „die wohlwollenden königlichen Erlasse für die Juden“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „die gesetzmäßigen Ordnungen“, „die gesetzmäßige Verfassung“ oder „die gesetzmäßige Ordnung des Gemeinwesens“. Der griechische Ausdruck kann umfassend die etablierten öffentlichen und bürgerlichen Einrichtungen einer Gemeinschaft bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ κείμενα τοῖς Ἰουδαίοις φιλάνθρωπα βασιλικὰ
  choice: die für die Juden geltenden königlichen Gnadenerweise
  rationale: κείμενα bezeichnet hier geltende beziehungsweise festgelegte Maßnahmen; φιλάνθρωπα βασιλικά kennzeichnet sie als wohlwollende königliche Gewährungen. „Gnadenerweise“ bewahrt diesen positiven, vom König ausgehenden Charakter, ohne sie auf einzelne Privilegien einzuengen.
- source_word: διὰ Ἰωάννου
  choice: durch Johannes ... zustande gekommen
  rationale: διά mit Genitiv bezeichnet Johannes als Vermittler. Die Formulierung vermeidet die Behauptung, er selbst habe die königlichen Maßnahmen erlassen.
- source_word: παρώσας
  choice: setzte ... beiseite
  rationale: Das Verb bezeichnet das Zurückdrängen oder Missachten bestehender Regelungen; „beiseitesetzen“ trifft den rechtlich-politischen Zusammenhang, ohne zwingend eine förmliche Aufhebung auszudrücken.
- source_word: πρεσβείαν
  choice: Gesandtschaft
  rationale: Gemeint ist eine offizielle diplomatische Mission; „Gesandtschaft“ wahrt den politischen Sprachgebrauch.
- source_word: φιλίας καὶ συμμαχίας
  choice: Freundschaft und Bündnis
  rationale: Die beiden diplomatischen Begriffe werden direkt und verständlich wiedergegeben.
- source_word: νομίμους ... πολιτίας
  choice: die gesetzmäßige öffentliche Ordnung
  rationale: πολιτεία kann die verfassungsmäßige, institutionelle oder bürgerliche Ordnung eines Gemeinwesens bezeichnen. „Öffentliche Ordnung“ erhält die Breite des Ausdrucks und vermeidet die zu enge Festlegung auf eine Regierungsform.
- source_word: καταλύων
  choice: hob ... auf
  rationale: Das Partizip beschreibt die aktive Beseitigung der bestehenden Ordnung; „aufheben“ passt zum rechtlich-institutionellen Kontext.
- source_word: παρανόμους ἔθισμους
  choice: gesetzwidrige Bräuche
  rationale: Die Wiedergabe erhält sowohl den Gegensatz zum Gesetzmäßigen als auch den Charakter eingeübter Sitten und Praktiken.
- source_word: ἐκαίνιζεν
  choice: führte ... ein
  rationale: Das Imperfekt beschreibt sein fortgesetztes beziehungsweise programmatisches Einführen neuer Praktiken; natürliches Deutsch gibt dies hier mit dem Präteritum wieder.
theological_decisions:
- issue: Bedeutung von πολιτεία im jüdischen rechtlich-politischen Zusammenhang
  choice: gesetzmäßige öffentliche Ordnung
  alternative: gesetzmäßige Einrichtungen; gesetzmäßige Verfassung; gesetzmäßige Staatsordnung
  rationale: Der griechische Ausdruck umfasst die etablierte Ordnung des Gemeinwesens, ohne eindeutig nur Verfassung, Regierung oder einzelne Institutionen zu meinen. Die gewählte Formulierung bewahrt diese Offenheit.
- issue: Bedeutung von φιλάνθρωπα βασιλικά
  choice: königliche Gnadenerweise
  alternative: wohlwollende königliche Maßnahmen; menschenfreundliche königliche Erlasse; königliche Vergünstigungen
  rationale: Der Ausdruck bezeichnet günstige königliche Regelungen für die Juden. „Gnadenerweise“ macht die wohlwollende Gewährung deutlich, ohne eine bestimmte rechtliche Form vorauszusetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der lange griechische Satz wurde zur besseren Verständlichkeit in zwei Sätze gegliedert. Die Gedankenstriche kennzeichnen die erläuternde Identifizierung des Johannes, ohne die diplomatische Aussage vom Hauptgedanken zu lösen.
