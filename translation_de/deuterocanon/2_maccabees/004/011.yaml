    rationale: Die Aufteilung nach „zustande gekommen waren“ macht die erläuternde Identifizierung des Johannes weniger unmittelbar. Die Apposition sollte direkt deutlich machen, dass Johannes der Vater des Eupolemus und der Gesandte war.
