base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/004/006.yaml
  text: For he saw that without royal intervention it was impossible for affairs to attain peace[c][b][a], and that Simon would not stop his folly.
translation:
  language: de
  text: Denn er sah[c], dass ohne königliches Eingreifen[a] kein Frieden in den Angelegenheiten zu erreichen war und dass Simon von seiner Torheit nicht ablassen werde.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Griechisch wörtlich „ohne königliche πρόνοια“. Das Wort kann Voraussicht, Fürsorge oder Vorsorge bedeuten; hier meint es wahrscheinlich die aktive Unterstützung oder das Eingreifen des Königs.
    reason: lexical_alternative
  - marker: b
    text: 'Griechisch wörtlich etwa: „Simon werde keine Unterbrechung seiner Torheit erfahren“; gemeint ist, dass er nicht davon ablassen würde.'
    reason: lexical_alternative
  - marker: c
    text: Der Vers beginnt im Griechischen mit einem Partizip („betrachtend“ oder „erwägend“), das eng an den vorhergehenden Satz anknüpft. Für einen natürlichen deutschen Satz wird diese Verbindung hier geglättet.
    reason: syntactic_explanation
lexical_decisions:
- source_word: βασιλικῆς προνοίας
  choice: königliches Eingreifen
  rationale: πρόνοια kann Voraussicht, Fürsorge oder Vorsorge bezeichnen. Im politischen Zusammenhang ist die aktive Mitwirkung oder Unterstützung des Königs gemeint; „königliches Eingreifen“ gibt diesen praktischen Sinn im Deutschen natürlich wieder.
- source_word: τυχεῖν εἰρήνης
  choice: Frieden einkehren konnte
  rationale: τυγχάνω mit Genitiv bedeutet hier „erlangen“ oder „erreichen“. Die idiomatische Wendung „Frieden einkehren“ bewahrt den ergebnisbezogenen Sinn und verbindet sich natürlich mit den angesprochenen Verhältnissen.
- source_word: ἐπὶ τὰ πράγματα
  choice: in den Verhältnissen
  rationale: τὰ πράγματα bezeichnet hier die bestehende Lage beziehungsweise die öffentlichen Angelegenheiten. „In den Verhältnissen“ hält die Aussage bewusst allgemein und passt zum politisch-administrativen Kontext.
- source_word: παῦλαν οὐ λημψόμενον
  choice: nicht ablassen würde
  rationale: Wörtlich heißt die Wendung etwa „keine Pause erhalten würde“. Gemeint ist idiomatisch, dass Simon sein Verhalten nicht beenden werde; „nicht ablassen“ bringt dieses Fortsetzen treffend zum Ausdruck.
- source_word: ἀνοίας
  choice: Torheit
  rationale: ἄνοια bezeichnet Unvernunft, Sinnlosigkeit oder Torheit. „Torheit“ bewahrt die deutliche moralische Wertung, ohne einen klinischen Zustand zu unterstellen.
- source_word: σκοπῶν
  choice: er erkannte
  rationale: Der griechische Text beginnt mit einem Partizip im Sinn von „betrachtend“ oder „erwägend“, das eng an den vorausgehenden Satz anschließt. Im Deutschen wird die Konstruktion für einen flüssigen Satz in das finite Verb „erkannte“ einbezogen.
