base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/004/028.yaml
  text: But when Sostratus[a], the commander of the citadel, pressed the claim—for the handling of the revenues belonged to him—for this reason the two men were summoned by the king.
translation:
  language: de
  text: Als aber Sostratos, der Befehlshaber der Zitadelle, die Forderung geltend machte – denn die Verwaltung der Einnahmen fiel in seinen Zuständigkeitsbereich[a] –, wurden die beiden aus diesem Grund vom König vorgeladen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „denn ihm oblag die Verwaltung der Geldangelegenheiten“. Die griechische Wendung kann allgemeiner eine Zuständigkeit für Finanzangelegenheiten bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιουμένου ... τὴν ἀπαίτησιν
  choice: die Forderung geltend machte
  rationale: Die Verbindung von ποιέω mit ἀπαίτησις bezeichnet das aktive Erheben oder Verfolgen einer Forderung. „Geltend machte“ gibt dies in natürlichem Verwaltungsdeutsch wieder.
- source_word: Σωστράτου
  choice: Sostratos
  rationale: Der griechische Personenname wird nach üblicher deutscher Konvention transliteriert.
- source_word: τοῦ τῆς ἀκροπόλεως ἐπάρχου
  choice: der Befehlshaber der Zitadelle
  rationale: ἔπαρχος bezeichnet hier einen militärisch-administrativen Amtsträger; „Befehlshaber“ ist im Zusammenhang mit der befestigten ἀκρόπολις verständlich und sachgerecht.
- source_word: πρὸς τοῦτον γὰρ ἦν
  choice: fiel in seinen Zuständigkeitsbereich
  rationale: Die Wendung zeigt an, dass die betreffende Finanzangelegenheit Sostratos unterstand. Die deutsche Formulierung gibt die amtliche Zuständigkeit klar wieder.
- source_word: ἡ τῶν διαφόρων πρᾶξις
  choice: die Verwaltung der Einnahmen
  rationale: διάφορα kann im administrativen Kontext Einnahmen, Abgaben oder Geldmittel bezeichnen; πρᾶξις meint deren praktische Verwaltung oder Einziehung. „Verwaltung der Einnahmen“ wahrt den fiskalischen Sinn, ohne ihn unnötig zu verengen.
- source_word: διʼ ἣν αἰτίαν
  choice: aus diesem Grund
  rationale: Die ausdrückliche Kausalverknüpfung des Griechischen bleibt erhalten.
- source_word: οἱ δύο
  choice: die beiden
  rationale: Der substantivierte Zahlbegriff verweist auf die zwei zuvor genannten Personen; „die beiden“ ist im Deutschen vollständig und fügt kein nicht ausdrücklich genanntes Geschlecht hinzu.
- source_word: ὑπὸ τοῦ βασιλέως προσεκλήθησαν
  choice: wurden vom König vorgeladen
  rationale: Das Passiv von προσκαλέω bezeichnet hier eine amtliche Vorladung. „Vorgeladen“ entspricht dem politischen und administrativen Zusammenhang.
