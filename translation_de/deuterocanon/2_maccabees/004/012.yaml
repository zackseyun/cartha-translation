base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/004/012.yaml
  text: For he gladly established a gymnasium under the very citadel[a], and by bringing the noblest of our young men under the Greek cap, he was leading them on.
translation:
  language: de
  text: Denn gern gründete er direkt unter der Akropolis ein Gymnasion und führte die Vornehmsten unter uns, indem er sie unter den Petasos stellte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Petasos war ein breitkrempiger griechischer Hut. Die Wendung „unter den Petasos stellen“ bewahrt das konkrete Bild des griechischen Textes; im Zusammenhang kennzeichnet es die Hinwendung zu hellenistischen Bräuchen.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡδέως
  choice: bereitwillig
  rationale: Das Adverb bezeichnet willige, bereitwillige Zustimmung zum Handeln; „bereitwillig“ klingt im Deutschen natürlich und trägt nicht unnötig eine Vorstellung von Freude ein.
- source_word: ὑπʼ αὐτὴν ἀκρόπολιν
  choice: unmittelbar unterhalb der Festung
  rationale: ὑπό mit Akkusativ ist hier räumlich; αὐτήν verstärkt die auffällige unmittelbare Nähe. „Festung“ gibt die Jerusalemer ἀκρόπολις verständlich wieder, ohne einen modernen Burgtyp vorauszusetzen.
- source_word: γυμνάσιον
  choice: Gymnasion
  rationale: Gemeint ist die spezifisch hellenistische Bildungs- und Sporteinrichtung, nicht eine moderne Turnhalle. Die historische deutsche Fachform bewahrt diesen kulturellen Gehalt.
- source_word: καθίδρυσεν
  choice: richtete ... ein
  rationale: Die Wendung bezeichnet das Gründen beziehungsweise dauerhafte Einrichten einer Institution und ist im modernen Deutsch idiomatisch.
- source_word: τοὺς κρατίστους τῶν ἐφʼ ἡμῶν
  choice: die Vornehmsten unter den jungen Männern unseres Volkes
  rationale: κρατίστους bezeichnet die sozial Hervorragenden oder Vornehmsten. Die Einordnung als junge Männer folgt dem Gymnasion-Kontext und der überlieferten Deutung der schwierigen Wortfolge; „unseres Volkes“ macht die Sprecherperspektive verständlich.
- source_word: ὑποτάσσων ὑπὸ πέτασον
  choice: brachte ... unter den Petasos
  rationale: Die konkrete Metapher des Unterstellens unter den griechischen Hut bleibt erhalten. Der Petasos war hier ein sichtbares Zeichen hellenistischer Zugehörigkeit; eine abstrakte Wiedergabe als „griechische Lebensweise“ würde das Bild auflösen.
- source_word: ἦγεν
  choice: führte sie so immer weiter
  rationale: Der Imperfekt schildert einen fortdauernden Vorgang. „Immer weiter“ lässt die Richtung der kulturellen Entwicklung erkennen, ohne das Ziel stärker festzulegen, als der griechische Text es tut.
theological_decisions:
- issue: Kulturelle Angleichung durch ὑπὸ πέτασον
  choice: Das konkrete Bild „unter den Petasos“ bleibt im Haupttext stehen.
  alternative: „führte sie in die griechische Lebensweise ein“
  rationale: Der Ausgangstext nennt ein sichtbares Kleidungsstück als Kennzeichen hellenistischer Identität. Die konkrete Darstellung wahrt sowohl den historischen Charakter als auch die wertende Spannung des Zusammenhangs.
- issue: Identität der als κράτιστοι bezeichneten Personen
  choice: „die Vornehmsten unter den jungen Männern unseres Volkes“
  alternative: „die Vornehmsten unter uns“
  rationale: Der Gymnasion-Kontext legt junge Teilnehmer aus führenden Kreisen nahe. Die Formulierung vermeidet zugleich die engere Festlegung auf Amtsträger oder auf moralisch „beste“ Personen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit historisch präzisen Fachbegriffen. „Gymnasion“ und „Petasos“ bewahren die konkrete hellenistische Prägung; die Fußnote erklärt den weniger geläufigen Kleidungsbegriff. Der lange griechische Satz ist für bessere Verständlichkeit in zwei deutsche Sätze gegliedert.
