  rationale: Die Revision entfernt nicht im griechischen Wortlaut ausgedrückte Zusätze, verwendet mit „Akropolis“ den präziseren historischen Begriff und gibt die Partizipialkonstruktion ὑποτάσσων ὑπὸ πέτασον konkret wieder. Sie wahrt dabei die historische und semantische Ungewöhnlichkeit der Hutmetapher, statt sie als bloße kulturelle Assimilation zu paraphrasieren.
