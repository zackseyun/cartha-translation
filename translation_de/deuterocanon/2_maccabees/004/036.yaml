  text: They were indignant and deeply grieved over the man's unjust murder. But when the king returned from the regions of Cilicia[a], the Jews in the city appealed to him, and the Greeks as well, sharing in their hatred of the wicked deed,
translation:
  language: de
  text: Sie waren empört und tief betrübt über den ungerechten Mord an dem Mann. Als aber der König aus den Gebieten Kilikiens zurückkehrte, trugen ihm die Juden in der Stadt ihre Beschwerde vor; auch die Griechen teilten ihren Abscheu vor der bösen Tat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »wobei auch die Griechen gemeinsam mit ihnen die böse Tat verabscheuten«. Das seltene griechische Partizip συμμισοπονηρούντων ist stark verdichtet und lässt offen, wie eng die Griechen an der Beschwerde selbst beteiligt waren.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδείναζον
  choice: waren empört
  rationale: Das Verb bezeichnet heftige Bestürzung oder Entrüstung; zusammen mit ἐδυσφόρουν tritt hier besonders die moralische Empörung hervor.
- source_word: ἐδυσφόρουν
  choice: waren tief betrübt
  rationale: Das Verb beschreibt, dass jemand etwas schwer erträgt und darüber bekümmert ist. Die Wiedergabe ergänzt die Empörung um den Aspekt tiefer Trauer.
- source_word: ἐπὶ τῷ τοῦ ἀνδρὸς ἀδίκῳ φόνῳ
  choice: über den ungerechten Mord an diesem Mann
  rationale: φόνος bezeichnet hier einen Mord, ἄδικος verurteilt ihn ausdrücklich als ungerecht; τοῦ ἀνδρός verweist auf den bereits genannten Mann.
- source_word: ἐπανελθόντος
  choice: zurückkehrte
  rationale: Die temporale Genitivus-abs.-Konstruktion wird im Deutschen natürlich mit einem als-Satz wiedergegeben.
- source_word: τῶν κατὰ Κιλικίαν τόπων
  choice: aus den Gebieten Kilikiens
  rationale: τόποι im Plural bezeichnet die verschiedenen Gegenden oder Gebiete in Kilikien.
- source_word: ἐνετύγχανον
  choice: trugen ihm ihre Beschwerde vor
  rationale: Das Verb kann die persönliche Vorsprache oder Eingabe bei einem Herrscher bezeichnen. Der König ist als Adressat aus dem Zusammenhang zu ergänzen.
- source_word: οἱ κατὰ πόλιν Ἰουδαῖοι
  choice: die Juden in der Stadt
  rationale: Die Wendung bezeichnet die in der betreffenden Stadt ansässigen Juden.
- source_word: συμμισοπονηρούντων καὶ τῶν Ἑλλήνων
  choice: auch die Griechen teilten ihren Abscheu vor der bösen Tat
  rationale: Das seltene zusammengesetzte Partizip bezeichnet ein gemeinsames Verabscheuen des Bösen. Die deutsche Formulierung bewahrt die Beteiligung der Griechen und die moralische Wertung, ohne sie zwingend zu Mitpetenten zu machen.
