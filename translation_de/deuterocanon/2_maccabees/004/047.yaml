translation:
  language: de
  text: Darauf nahm Ptolemäus den König beiseite und führte ihn, als wolle er ihm Erholung verschaffen, in einen Säulenhof.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische ἀναψύχοντα kann auch „um ihn zu erfrischen“ oder „um ihn wiederzubeleben“ bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅθεν
  choice: Darauf
  rationale: Das Wort knüpft folgernd an das zuvor Erzählte an; „Darauf“ wahrt den natürlichen Erzählfluss, ohne zwingend eine räumliche Bedeutung anzunehmen.
- source_word: ἀπολαβών
  choice: nahm … beiseite
  rationale: Das Partizip bezeichnet hier plausibel, dass Ptolemäus den König aus der unmittelbaren Situation herausnahm, um unbeobachtet auf ihn einzuwirken. Das im Griechischen unausgesprochene Objekt wird aus τὸν βασιλέα erschlossen.
- source_word: εἴς τι περίστυλον
  choice: in einen Säulengang
  rationale: περίστυλον bezeichnet einen von Säulen umgebenen beziehungsweise mit Säulen versehenen Bereich. „Säulengang“ ist verständlich und gibt die architektonische Vorstellung ohne unnötigen Fachausdruck wieder.
- source_word: ὡς ἀναψύχοντα
  choice: angeblich um ihn zu erfrischen
  rationale: ὡς kennzeichnet hier den Anschein oder Vorwand; ἀναψύχω kann „erfrischen“, „Erholung verschaffen“ oder „wieder beleben“ bedeuten. „Angeblich“ macht die vorgeschobene Absicht im Kontext deutlich, ohne sie als tatsächlichen Beweggrund auszugeben.
- source_word: μετέθηκεν
  choice: stimmte … um
  rationale: μετατίθημι kann neben räumlichem Versetzen auch eine Änderung der Haltung bewirken bedeuten. Da der König bereits in den Säulengang geführt worden ist und Ptolemäus ihn im Zusammenhang zugunsten des Menelaus beeinflusst, ist „stimmte den König um“ die kontextgerechte Bedeutung.
- source_word: τὸν βασιλέα
  choice: den König
  rationale: Die ausdrückliche Wiederholung vermeidet unklare Pronomenbezüge und entspricht dem griechischen Akkusativobjekt von μετέθηκεν.
- source_word: ὁ Πτολεμαῖος
  choice: Ptolemäus
  rationale: Gebräuchliche deutsche Form des griechischen Eigennamens.
