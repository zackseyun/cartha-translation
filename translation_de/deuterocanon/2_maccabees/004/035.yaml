  text: For this reason[a], not only Jews, but also many of the other nations,
translation:
  language: de
  text: Aus diesem Grund[a] nicht nur Juden, sondern auch viele aus den anderen Völkern
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Daher«. Bei »Juden« ist auch die Übersetzung »Judäer« möglich; der Gegensatz zu den anderen Völkern spricht hier jedoch für die umfassendere Bezeichnung des jüdischen Volkes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διʼ ἣν αἰτίαν
  choice: Aus diesem Grund
  rationale: Eine natürliche deutsche Wiedergabe des kausalen Anschlusses an das zuvor Berichtete.
- source_word: οὐ μόνον ... δὲ καὶ
  choice: nicht nur ... sondern auch
  rationale: Die deutsche Korrelativkonstruktion bewahrt die Erweiterung und Hervorhebung des griechischen Ausdrucks.
- source_word: Ἰουδαῖοι
  choice: Juden
  rationale: Der Gegensatz zu den anderen Völkern spricht hier für die Bezeichnung der jüdischen Volksgruppe und nicht bloß der Bewohner Judäas.
- source_word: πολλοὶ
  choice: viele
  rationale: Entspricht dem einfachen quantitativen Sinn des griechischen Adjektivs.
- source_word: τῶν ἄλλων ἐθνῶν
  choice: aus den anderen Völkern
  rationale: Der partitive Genitiv bezeichnet viele Angehörige anderer, nichtjüdischer Völker; »aus« ist dafür im Deutschen idiomatisch.
theological_decisions:
- issue: Wiedergabe von Ἰουδαῖοι
  choice: Juden
  alternative: Judäer
  rationale: Da die Gruppe den »anderen Völkern« gegenübergestellt wird, steht die ethnisch-religiöse Zugehörigkeit im Vordergrund. »Juden« gibt diesen Sinn im heutigen Deutsch am klarsten wieder, während »Judäer« stärker geografisch verstanden werden könnte.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Da der vorgelegte griechische Text nur den ersten, syntaktisch unvollständigen Teil des Verses umfasst, bleibt auch die Übersetzung ohne abschließendes Prädikat.
