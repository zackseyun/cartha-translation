  yaml_path: translation/deuterocanon/2_maccabees/004/007.yaml
  text: But when Seleucus passed from life[a], and Antiochus, the one called Epiphanes, took over the kingdom,
translation:
  language: de
  text: Als aber Seleukus aus dem Leben geschieden war[a] und Antiochus, genannt Epiphanes, die Königsherrschaft übernommen hatte,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: »sein Leben gewechselt hatte«; eine verhüllende Ausdrucksweise dafür, dass Seleukus starb.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μεταλλάξαντος … τὸν βίον
  choice: aus dem Leben geschieden war
  rationale: Die Wendung ist ein Euphemismus für den Tod. Die deutsche Formulierung bewahrt die indirekte Ausdrucksweise des Griechischen und ist zugleich natürlich verständlich.
- source_word: παραλαβόντος
  choice: übernommen hatte
  rationale: Im Zusammenhang der Thronfolge bezeichnet das Verb die Übernahme der königlichen Herrschaft.
- source_word: τὴν βασιλείαν
  choice: die Königsherrschaft
  rationale: βασιλεία kann sowohl das Königreich als auch die Königsherrschaft bezeichnen. Mit παραλαμβάνω steht hier der Herrschaftsantritt im Vordergrund, ohne dass das beherrschte Reich ausgeblendet wird.
- source_word: Ἀντιόχου
  choice: Antiochus
  rationale: Gebräuchliche deutsche Form des Eigennamens.
- source_word: τοῦ προσαγορευθέντος
  choice: genannt
  rationale: Das Partizip führt den Beinamen des Antiochus ein; die knappe deutsche Apposition entspricht dieser Funktion.
- source_word: Ἐπιφανοῦς
  choice: Epiphanes
  rationale: Der königliche Beiname wird in seiner etablierten transliterierten Form wiedergegeben, statt seine mögliche Bedeutung im Haupttext festzulegen.
