  yaml_path: translation/deuterocanon/2_maccabees/004/005.yaml
  text: he presented himself to the king[a], not becoming an accuser of his fellow citizens, but seeking what was advantageous both publicly and privately for the whole multitude.
translation:
  language: de
  text: Er wurde beim König vorstellig und trat dabei nicht als Ankläger seiner Mitbürger auf, sondern war darauf bedacht, was der gesamten Bevölkerung insgesamt und jedem Einzelnen zugutekam.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »sondern war darauf bedacht, was der gesamten Bevölkerung öffentlich und privat zugutekam.«'
    reason: Die Wendung κοινῇ καὶ κατʼ ἰδίαν kann entweder den Nutzen für die Gemeinschaft und für den Einzelnen oder adverbial den öffentlichen und privaten Bereich bezeichnen.
lexical_decisions:
- source_word: διεκοσμήθη
  choice: begab sich
  rationale: Das Passiv bezeichnet hier im höfischen Zusammenhang, dass Onias sich zum König aufmachte beziehungsweise vor ihn trat. »Begab sich« ist natürlich und vermeidet die unpassende wörtliche Vorstellung eines Schmückens oder Ordnens.
- source_word: οὐ γινόμενος
  choice: trat dabei nicht … auf
  rationale: Das Partizip beschreibt die Art und Weise seines Vorgehens. Die idiomatische Formulierung gibt wieder, dass er gegenüber dem König nicht die Rolle eines Anklägers übernahm.
- source_word: τῶν πολιτῶν
  choice: seiner Mitbürger
  rationale: πολῖται bezeichnet die mit ihm zur selben politischen Gemeinschaft gehörenden Bürger; »seine Mitbürger« macht diesen Beziehungsaspekt deutlich.
- source_word: κατήγορος
  choice: Ankläger
  rationale: Das Wort hat einen allgemein forensischen Sinn. »Ankläger« ist genauer als »Denunziant« und weniger institutionell verengt als »Staatsanwalt«.
- source_word: τὸ δὲ σύμφορον
  choice: was … zugutekam
  rationale: Der substantivierte Ausdruck bezeichnet das Vorteilhafte oder Förderliche. Die verbale deutsche Wendung klingt natürlich und wahrt den Gedanken des Nutzens.
- source_word: κοινῇ καὶ κατʼ ἰδίαν
  choice: gemeinsam und jedem Einzelnen
  rationale: Die komprimierte Gegenüberstellung betrifft den gemeinschaftlichen und den individuellen Nutzen. Die Wiedergabe verbindet beide Ebenen verständlich, ohne sie gegeneinander auszuspielen.
- source_word: παντὶ τῷ πλήθει
  choice: der ganzen Bevölkerung
  rationale: πλῆθος meint hier die Gesamtheit des Volkes beziehungsweise der Bürgerschaft. »Ganze Bevölkerung« bewahrt die umfassende Reichweite in natürlichem Deutsch.
theological_decisions:
- issue: Ethische Charakterisierung des Vorgehens von Onias
  choice: Onias erscheint nicht als Ankläger seiner Mitbürger, sondern als jemand, der den gemeinschaftlichen wie individuellen Nutzen der Bevölkerung sucht.
  alternative: Der Schlussteil kann enger als »was öffentlich und privat für das ganze Volk von Vorteil war« verstanden werden.
  rationale: Die Syntax des Schlusses ist verdichtet. Die Hauptfassung bewahrt die Spannung zwischen Gemeinwohl und dem Wohl jedes Einzelnen, ohne Onias weitere, im Text nicht genannte Motive zuzuschreiben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau wurde gegenüber der griechischen Partizipialkonstruktion leicht geglättet; die sachliche und ethische Zurückhaltung des Ausgangstextes bleibt erhalten.
