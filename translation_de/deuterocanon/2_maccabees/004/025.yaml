  source_fidelity: Die zeitliche Vorordnung von λαβών, die königlichen Befehle, das Eintreffen sowie die scharfe Gegenüberstellung zwischen mangelnder Eignung für das Hohepriesteramt und gewalttätigem Wesen sind zutreffend erfasst. „Ungebändigten Tieres“ gibt βαρβάρου jedoch nur indirekt wieder und schwächt die bewusst barbarisch-brutale Charakterisierung ab. „Wutausbrüche“ kann zudem stärker konkrete Ausbrüche als die im Griechischen als Besitz dargestellten Zornesregungen nahelegen.
  naturalness: Die Satztrennung „kam er an. Er brachte“ ist im Deutschen unnötig abgehackt. Eine einheitliche Satzfügung ist natürlicher und bildet die griechische Partizipialstruktur besser nach. „Heftige Impulse“ und „Zorneswallungen“ sind moderne, verständliche und unterscheidbare Bezeichnungen für die zwei überlappenden pluralischen Ausdrücke.
  terminology: „Hohepriesteramt“ ist passend. „Grausamer Tyrann“ gibt ὠμός angemessen wieder. „Barbarisches Tier“ ist hier als bildhafte Charakterisierung zu verstehen und wahrt βάρβαρος genauer als „ungebändigt“.
