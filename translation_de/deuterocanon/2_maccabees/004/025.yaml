base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/004/025.yaml
  text: But after receiving the royal commands[a], he arrived, bringing nothing worthy of the high priesthood[c][b], but having the passions of a cruel tyrant and the rage of a barbarous beast.
translation:
  language: de
  text: Nachdem er die königlichen Befehle[a] erhalten hatte, kam er, ohne etwas mit sich zu führen, das des Hohepriesteramtes würdig war[b], dafür aber mit den heftigen Impulsen eines grausamen Tyrannen und den Zorneswallungen eines barbarischen Tieres[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Befehle des Königs“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „ohne etwas an sich zu haben, das dem Hohepriesteramt entsprach“.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlicher: „die Impulse eines grausamen Tyrannen und die Zornesregungen eines barbarischen Tieres“. Das Griechische verwendet jeweils den Plural und zwei bedeutungsnahe Ausdrücke, um seinen gewalttätigen Charakter zu verstärken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λαβὼν δὲ τὰς βασιλικὰς ἐντολὰς
  choice: Nachdem er die königlichen Befehle erhalten hatte
  rationale: Das vorzeitige Aoristpartizip wird im natürlichen Deutschen als temporaler Nebensatz wiedergegeben; βασιλικάς bezeichnet die königliche Autorität.
- source_word: παρεγίνετο
  choice: kam er an
  rationale: Gibt das Eintreffen am Ort knapp und erzählerisch wieder.
- source_word: τῆς μὲν ἀρχιερωσύνης οὐδὲν ἄξιον φέρων
  choice: Er brachte nichts mit, was des Hohepriesteramtes würdig war
  rationale: Bewahrt das Bild von φέρων und den scharfen Gegensatz zwischen Amtswürde und Charakter; die genitivische Wendung wird in gehobenem, aber verständlichem Deutsch wiedergegeben.
- source_word: θυμοὺς
  choice: die heftigen Regungen
  rationale: Der Plural bezeichnet gewaltsame Gemütsimpulse; „Regungen“ hält ihn von den folgenden ὀργάς unterscheidbar.
- source_word: ὠμοῦ τυράννου
  choice: eines grausamen Tyrannen
  rationale: ὠμός bezeichnet hier rohe, erbarmungslose Grausamkeit; „grausam“ ist im modernen Deutsch unmittelbar verständlich.
- source_word: θηρὸς βαρβάρου
  choice: eines ungebändigten Tieres
  rationale: Die Verbindung charakterisiert tierhafte, unzivilisierte Wildheit. „Ungebändigt“ vermittelt diese Bildwirkung natürlicher als das heute missverständliche „barbarisch“.
- source_word: ὀργὰς ἔχων
  choice: hatte die Wutausbrüche
  rationale: Bewahrt den Plural und unterscheidet ὀργάς von θυμούς; „Wutausbrüche“ bezeichnet konkrete Äußerungen des Zorns.
theological_decisions:
- issue: Moralische Charakterisierung des Menelaus im Verhältnis zum Hohepriesteramt
  choice: Der Text stellt seine völlige Unwürdigkeit für das Amt seinen tyrannischen und tierhaften Gewaltimpulsen gegenüber.
  alternative: Die Aussage lediglich als politische Kritik abzuschwächen.
  rationale: Das Griechische sagt ausdrücklich, er bringe nichts mit, was des Hohepriesteramtes würdig sei, und kontrastiert dies mit seinen gewaltsamen Regungen und Wutausbrüchen.
translation_notes:
  register: Modernes Standarddeutsch in würdigem Erzählstil. Der erste lange griechische Satz wird zur besseren Verständlichkeit in zwei Sätze gegliedert. Die rhetorische Gegenüberstellung sowie die zwei einander überlappenden Ausdrücke für heftige Gemütsbewegungen bleiben erhalten.
