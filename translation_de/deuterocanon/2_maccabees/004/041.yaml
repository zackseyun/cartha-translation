translation:
  language: de
  text: Er begann, mit ungerechten Händen Gewalt auszuüben[a]. Dabei ging ein gewisser Auranus voran, der an Jahren weit fortgeschritten war, aber nicht weniger an Unwissenheit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der griechische Wortlaut ist knapp und schwierig. Die elliptische Verbindung bezeichnet den Beginn einer gewaltsamen, unrechtmäßigen Handlung; eine konkrete Handlung wird nicht genannt. Auranus wird als derjenige beschrieben, der dabei voranging.
    reason: Die Ellipse von κατήρξατο χειρῶν ἀδίκων wird erläutert, ohne eine im Griechischen nicht ausdrücklich benannte Gewalthandlung festzulegen.
lexical_decisions:
- source_word: κατήρξατο
  choice: Er begann
  rationale: Der Aorist Medium von κατάρχομαι bezeichnet hier idiomatisch den Beginn einer Handlung.
- source_word: χειρῶν ἀδίκων
  choice: mit frevelhaften Händen Gewalt auszuüben
  rationale: Die Genitivverbindung ist elliptisch und bezeichnet gewaltsames, unrechtes Handeln. Die Wiedergabe bewahrt das Bild der Hände, ohne ein im Griechischen nicht ausdrücklich genanntes einzelnes Schlagverb zu stark festzulegen.
- source_word: προηγησαμένου
  choice: übernahm … die Führung
  rationale: Der Genitivus absolutus beschreibt Auranus als denjenigen, der bei der Handlung voranging und sie anführte.
- source_word: τινὸς Αὐρανοῦ
  choice: ein gewisser Auranus
  rationale: τινός bei einem Eigennamen wird natürlich mit „ein gewisser“ wiedergegeben; der Personenname wird transliteriert.
- source_word: προβεβηκότος τὴν ἡλικίαν
  choice: an Jahren weit fortgeschritten
  rationale: Die Wendung bezeichnet ein hohes beziehungsweise fortgeschrittenes Alter und lässt zugleich die folgende pointierte Parallele zu „Unwissenheit“ zu.
- source_word: οὐδὲν δὲ ἧττον καὶ τὴν ἄγνοιαν
  choice: nicht weniger aber auch an Unwissenheit
  rationale: Die ungewöhnliche rhetorische Parallelisierung von Alter und Unwissenheit bleibt erhalten, einschließlich ihrer scharfen Ironie.
