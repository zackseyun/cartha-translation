  yaml_path: translation/deuterocanon/2_maccabees/004/022.yaml
  text: And he was received with great splendor by Jason and the city[a], and was welcomed with a torchlight procession and shouts; then in this way he encamped in Phoenicia.
translation:
  language: de
  text: Von Jason und der Stadt glanzvoll empfangen, wurde er mit einem Fackelzug und lauten Rufen[a] willkommen geheißen. Anschließend schlug er in Phönizien sein Lager auf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „unter Jubelrufen“. Das Griechische bezeichnet laute Rufe bei einem zeremoniellen Empfang, ohne ihren genauen Wortlaut zu nennen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μεγαλομερῶς
  choice: einen glanzvollen Empfang
  rationale: Das Adverb bezeichnet eine großartige oder prachtvolle Art des Empfangs. Die substantivische deutsche Wendung ist natürlich und bewahrt den feierlich-öffentlichen Charakter.
- source_word: ἀποδεχθεὶς
  choice: bereiteten ihm … Empfang
  rationale: Das passive Partizip bezeichnet hier die förmliche Aufnahme des Herrschers. Die aktive Umformung mit Jason und der Stadt als Subjekt ergibt klares, idiomatisches Deutsch.
- source_word: δᾳδουχίας
  choice: mit einem Fackelzug
  rationale: Das Substantiv bezeichnet zeremonielles Fackeltragen, wahrscheinlich in Form eines öffentlichen Zuges. „Fackelzug“ gibt dies knapp und anschaulich wieder.
- source_word: βοῶν
  choice: lauten Rufen
  rationale: Der Genitiv Plural bezeichnet laute Rufe oder Zurufe. Die neutrale Wiedergabe vermeidet die nicht ausdrücklich festgelegte Deutung als Jubel.
- source_word: εἰσεδέχθη
  choice: wurde er in die Stadt geleitet
  rationale: Das Verb bezeichnet die Aufnahme beziehungsweise das Hineingeleiten. Diese Wiedergabe erhält gegenüber dem vorausgehenden allgemeinen Empfang die räumliche Nuance und vermeidet bloße Wiederholung.
- source_word: εἶθʼ οὕτως
  choice: Anschließend
  rationale: Die Verbindung markiert vor allem die zeitliche Folge. Im Deutschen ist „anschließend“ natürlich; das griechische οὕτως besitzt hier wahrscheinlich überleitende Kraft.
- source_word: κατεστρατοπέδευσεν
  choice: schlug er … sein Lager auf
  rationale: Das Verb bezeichnet das Beziehen eines Lagers. Diese konkrete Wiedergabe bleibt näher am griechischen Ausdruck als das allgemeinere „zog“ oder „marschierte“.
- source_word: Φοινίκην
  choice: Phönizien
  rationale: Übliche deutsche Form des geografischen Namens.
