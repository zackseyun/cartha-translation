  text: When Onias saw the severity of the rivalry[a], and that Apollonius son of Menestheus, the governor of Coele-Syria and Phoenicia, was increasing Simon’s wickedness[b],
translation:
  language: de
  text: Als Onias erkannte, wie schwerwiegend die Auseinandersetzung war[a] und dass Apollonius, der Sohn des Menestheus, der Statthalter von Koilesyrien und Phönizien, Simons Bosheit weiter förderte,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wie schwer der Streit war“. Das griechische Wort kann Streit, Rivalität oder Konflikt bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: συνορῶν
  choice: Als Onias erkannte
  rationale: Das einleitende Partizip bezeichnet die Wahrnehmung, die Onias zu der im folgenden Vers berichteten Handlung veranlasst. „Als … erkannte“ ist natürlich und gibt mehr als bloßes Sehen wieder.
- source_word: τὸ χαλεπὸν τῆς φιλονεικίας
  choice: wie erbittert der Streit war
  rationale: Das substantivierte Adjektiv bezeichnet den schweren bzw. bedrohlichen Charakter der Auseinandersetzung. „Erbittert“ verbindet Schärfe und Ernst, während „Streit“ die Bedeutung von φιλονεικία hier verständlich wiedergibt.
- source_word: Ἀπολλώνιον Μενεσθέως
  choice: Apollonius, der Sohn des Menestheus
  rationale: Der Genitiv ist als Patronymikon zu verstehen und wird im Deutschen eindeutig als Sohnschaft ausgedrückt.
- source_word: στρατηγόν
  choice: Statthalter
  rationale: In Verbindung mit einem Gebiet bezeichnet στρατηγός hier einen leitenden militärisch-administrativen Amtsträger. „Statthalter“ passt zum territorialen Zuständigkeitsbereich, ohne den militärischen Grundsinn ganz auszuschließen.
- source_word: τῶν Κοίλης Φοινίκης καὶ Συρίας
  choice: von Koilesyrien und Phönizien
  rationale: Trotz der ungewöhnlichen Wortstellung benennt die feste geographisch-administrative Einheit Koilesyrien und Phönizien; die deutsche Reihenfolge folgt der etablierten Gebietsbezeichnung.
- source_word: συναύξοντα
  choice: noch förderte
  rationale: Das Verb bezeichnet ein Mitwirken am Anwachsen. „Noch förderte“ bringt sowohl den verstärkenden als auch den unterstützenden Aspekt idiomatisch zum Ausdruck.
- source_word: κακίαν
  choice: Bosheit
  rationale: Der Ausdruck bezeichnet moralische Schlechtigkeit bzw. böswilliges Handeln. „Bosheit“ wahrt das ethische Gewicht, ohne die Art des Fehlverhaltens unnötig einzuengen.
