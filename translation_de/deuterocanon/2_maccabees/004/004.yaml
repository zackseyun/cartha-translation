  source_fidelity: 'Der Satzbau und die wesentlichen Bezüge sind zutreffend wiedergegeben: Onias nimmt sowohl den ernsten Charakter der φιλονεικία als auch das Handeln des Apollonius wahr. Die Patronymik, der territoriale Amtstitel und die offene Satzfortführung entsprechen dem Griechischen. „Erbittert“ legt jedoch eine emotionale Feindseligkeit nahe, die τὸ χαλεπόν nicht ausdrücklich bezeichnet; „schwerwiegend“ gibt die Schwere bzw. Brisanz neutraler wieder. Bei συναύξοντα ist „weiter förderte“ präziser als das potenziell temporal verstandene „noch förderte“.'
  naturalness: Die revidierte Fassung ist idiomatisches, würdiges modernes Standarddeutsch und bewahrt den vom Folgesatz abhängigen, abschließenden Kommasatz. „Schwerwiegend“ und „Auseinandersetzung“ sind in diesem administrativ-politischen Kontext natürlich.
  terminology: „Statthalter“ ist für στρατηγός in dieser territorial-administrativen Funktion vertretbar. „Koilesyrien und Phönizien“ ist die etablierte deutsche geographische Bezeichnung. „Bosheit“ gibt κακία angemessen wieder. Die Fußnote sollte keine „Streitsucht“ als unmittelbare Alternative für die konkrete Auseinandersetzung formulieren; möglich sind Streit, Rivalität oder Konflikt.
