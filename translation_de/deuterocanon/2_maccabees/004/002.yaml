translation:
  language: de
  text: Und er wagte es, den Wohltäter der Stadt, den Beschützer seiner Landsleute und den Verfechter der Gesetze einen Verschwörer gegen den Staat[a] zu nennen.
  philosophy: optimal-equivalence
  footnotes:
