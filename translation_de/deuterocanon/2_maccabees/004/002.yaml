lexical_decisions:
- source_word: εὐεργέτην
  choice: Wohltäter
  rationale: Der Ausdruck bezeichnet im städtischen Zusammenhang einen Menschen, der sich öffentlich verdient gemacht hat; „Wohltäter“ bewahrt diesen ehrenden Sinn knapp und natürlich.
- source_word: κηδεμόνα
  choice: Beschützer
  rationale: Das Wort bezeichnet jemanden, der fürsorglich für andere eintritt und sie schützt. „Beschützer“ ist im heutigen Deutsch natürlicher als „Vormund“ und passt zur ehrenden Charakterisierung.
- source_word: τῶν ὁμοεθνῶν
  choice: seiner Volksgenossen
  rationale: Gemeint sind Menschen desselben Volkes. „Volksgenossen“ gibt die ethnisch-nationale Verbundenheit wieder; das Possessivpronomen stellt idiomatisch den Bezug zur beschriebenen Person her.
- source_word: ζηλωτήν
  choice: Eiferer
  rationale: Das Substantiv bezeichnet einen Menschen, der von starkem Eifer geprägt ist. „Eiferer“ erhält diese Aussage, ohne daraus eine technische Bezeichnung für eine spätere Partei zu machen.
- source_word: τῶν νόμων
  choice: für die Gesetze
  rationale: Der griechische Plural wird ausdrücklich bewahrt und bezeichnet die Gesetze der jüdischen Überlieferung.
- source_word: ἐπίβουλον
  choice: Verschwörer
  rationale: Das Wort bezeichnet jemanden, der heimlich gegen etwas Anschläge oder Pläne betreibt. Im politischen Zusammenhang trifft „Verschwörer“ die Schärfe der Anschuldigung.
- source_word: τῶν πραγμάτων
  choice: gegen den Staat
  rationale: πράγματα bezeichnet hier die öffentlichen oder politischen Angelegenheiten. „Gegen den Staat“ ist eine knappe, verständliche Wiedergabe; die wörtlichere Bedeutungsbreite wird in der Fußnote erhalten.
- source_word: ἐτόλμα λέγειν
  choice: er wagte es, … zu nennen
  rationale: Die Konstruktion hebt die Dreistigkeit der Äußerung hervor. Da anschließend die Bezeichnung der Person folgt, ist „jemanden … nennen“ idiomatischer als „sagen“.
