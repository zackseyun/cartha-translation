base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/004/034.yaml
  text: Therefore Menelaus took Andronicus aside privately and urged him to strike down Onias by treachery[a]. Andronicus went to Onias, and after winning his confidence by deceit and greeting him with oaths, giving him his right hand, though he was under suspicion, he persuaded him to come out from the place of asylum. Then he immediately shut him away[c][b], showing no regard for justice.
translation:
  language: de
  text: Deshalb nahm Menelaus Andronikus beiseite und drängte ihn, Onias heimtückisch aus dem Weg zu räumen.[a] Andronikus trat an Onias heran, gewann durch Täuschung sein Vertrauen, begrüßte ihn unter Eidesschwüren und reichte ihm die rechte Hand. Obwohl er unter Verdacht stand, überredete er Onias, den geschützten Zufluchtsort zu verlassen.[b] Dann schloss er ihn unverzüglich weg,[c] ohne sich um das Recht zu kümmern.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die griechische Formulierung ist an dieser Stelle textlich und lexikalisch schwierig. Aus dem Zusammenhang ergibt sich, dass Menelaus Andronikus im Geheimen dazu drängte, die Tötung des Onias zu veranlassen.
    reason: textual_variant
  - marker: b
    text: 'Auch möglich: „das Heiligtum zu verlassen“ oder „aus der Zuflucht herauszukommen“. Das griechische Wort bezeichnet einen unverletzlichen, geschützten Zufluchtsort.'
    reason: lexical_alternative
  - marker: c
    text: 'Der Zusammenhang kann stärker gemeint sein: „Dann ermordete er ihn unverzüglich“ oder „ließ ihn unverzüglich töten“. Das hier überlieferte griechische Verb sagt dies jedoch weniger ausdrücklich.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὅθεν
  choice: Darauf
  rationale: Kennzeichnet die Folgerung aus dem vorausgehenden Geschehen und stellt zugleich einen natürlichen erzählerischen Übergang her.
- source_word: λαβὼν ἰδίᾳ
  choice: nahm … beiseite
  rationale: Gibt das private, verschwörerische Gespräch knapp und idiomatisch wieder.
- source_word: παρεκάλει
  choice: drängte ihn
  rationale: Im Zusammenhang fordert Menelaus Andronikus nachdrücklich zu einer verbrecherischen Tat auf; „drängte“ trifft diese Stärke.
- source_word: χειρόγραφον τὸν Ὀνίαν
  choice: Onias heimtückisch aus dem Weg zu räumen
  rationale: Die überlieferte Formulierung ist textlich und lexikalisch schwierig. Der Erzählzusammenhang weist auf die heimlich betriebene Tötung des Onias; die Fußnote macht die Unsicherheit ausdrücklich.
- source_word: παραγόμενος ἐπὶ τὸν Ὀνίαν
  choice: trat an Onias heran
  rationale: Gibt die Bewegung auf Onias zu in natürlichem Deutsch wieder.
- source_word: πεισθεὶς ἐπὶ δόλῳ
  choice: gewann durch Täuschung sein Vertrauen
  rationale: Die schwierige Wendung wird entsprechend ihrer Funktion im Satz als betrügerische Vertrauensgewinnung wiedergegeben, ohne die Täuschung abzuschwächen.
- source_word: δεξιωθεὶς μεθʼ ὅρκων
  choice: versicherte sich ihm mit Eiden
  rationale: Bewahrt den Gedanken einer durch Eide bekräftigten freundschaftlichen Zusicherung, die im Kontext betrügerisch ist.
- source_word: δοὺς δεξιάν
  choice: reichte ihm die rechte Hand
  rationale: Die konkrete antike Vertrauens- und Treuegeste bleibt sichtbar.
- source_word: καίπερ ἐν ὑποψίᾳ κείμενος
  choice: obwohl er unter Verdacht stand
  rationale: Bewahrt die unbestimmte Bezugnahme des Griechischen, ohne festzulegen, bei wem der Verdacht bestand.
- source_word: ἔπεισεν ἐκ τοῦ ἀσύλου προελθεῖν
  choice: überredete er Onias, den geschützten Zufluchtsort zu verlassen
  rationale: „Geschützter Zufluchtsort“ bringt die rechtliche Unverletzlichkeit von ἄσυλον zum Ausdruck, ohne den Begriff vorschnell auf ein Heiligtum zu verengen.
- source_word: παραχρῆμα
  choice: unverzüglich
  rationale: Gibt die unmittelbare zeitliche Abfolge in würdigem, modernem Deutsch wieder.
- source_word: παρέκλεισεν
  choice: schloss er ihn … weg
  rationale: Bleibt nahe bei der weniger ausdrücklichen Bedeutung des griechischen Verbs. Dass im Erzählzusammenhang die Ermordung gemeint sein kann, wird in der Fußnote festgehalten.
- source_word: οὐκ αἰδεσθεὶς τὸ δίκαιον
  choice: ohne das Recht zu achten
  rationale: Gibt die Missachtung dessen wieder, was recht und gerecht ist, ohne eine spezifische Rechtstheorie einzutragen.
theological_decisions:
- issue: Bedeutung von ἄσυλον
  choice: geschützter Zufluchtsort
  alternative: Heiligtum; Zuflucht
  rationale: Der Ausdruck bezeichnet einen unverletzlichen Schutzort, der im Kontext kultische Bezüge haben kann. Die gewählte Formulierung wahrt zunächst seine rechtlich-protektive Bedeutung.
- issue: Aussagekraft von παρέκλεισεν
  choice: schloss ihn weg
  alternative: ermordete ihn; ließ ihn töten
  rationale: Der weitere Erzählzusammenhang setzt den Tod des Onias voraus, doch das hier überlieferte Verb benennt die Tötung nicht eindeutig. Haupttext und Fußnote bewahren diese Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Erzählbewegung. Konkrete antike Gesten bleiben erhalten; textliche und semantische Unsicherheiten werden nicht im Haupttext dogmatisch aufgelöst, sondern transparent in den Fußnoten ausgewiesen.
