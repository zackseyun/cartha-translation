base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/004/024.yaml
  text: But after being presented to the king and magnifying him by the display of his authority[a], he secured the high priesthood for himself[b], outbidding Jason by three hundred talents of silver.
translation:
  language: de
  text: Nachdem er dem König vorgestellt worden war[a] und ihn mit einem Auftreten voller Autorität hoch geehrt hatte[b], verschaffte er sich selbst das Amt des Hohepriesters, indem er Jason um dreihundert Talente Silber überbot.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „beim König empfohlen worden war“. Das griechische Wort kann sowohl die förmliche Vorstellung als auch eine Empfehlung am Hof bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher etwa: „mit dem Gesicht beziehungsweise der Erscheinung der Autorität“. Die griechische Wendung bezeichnet vermutlich ein eindrucksvolles, autoritatives Auftreten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: συσταθεὶς τῷ βασιλεῖ
  choice: nachdem er dem König vorgestellt worden war
  rationale: Das passive Partizip bezeichnet im höfischen Zusammenhang eine Vorstellung oder Empfehlung beim König. „Vorgestellt“ ist natürlich und legt den genauen Vermittlungsvorgang nicht fest.
- source_word: δοξάσας αὐτὸν
  choice: ihn … hoch geehrt hatte
  rationale: δοξάζω kann „ehren“, „verherrlichen“ oder „rühmen“ bedeuten. „Hoch ehren“ wahrt die starke positive Aussage, ohne die im Kontext mögliche, aber lexikalisch nicht zwingende Wertung „schmeicheln“ in den Haupttext einzutragen.
- source_word: τῷ προσώπῳ τῆς ἐξουσίας
  choice: mit einem Auftreten voller Autorität
  rationale: Die wörtlich schwierige Wendung („mit dem Gesicht/der Erscheinung der Autorität“) beschreibt am ehesten ein eindrucksvolles, autoritatives Auftreten. Die deutsche Fassung gibt den idiomatischen Sinn wieder und bewahrt die Verbindung zu äußerer Erscheinung bzw. Präsenz.
- source_word: εἰς ἑαυτὸν κατήντησεν ἀρχιερωσύνην
  choice: verschaffte er sich selbst das Amt des Hohepriesters
  rationale: Die Konstruktion schildert, dass er das Hohepriesteramt an sich brachte. „Sich selbst verschaffen“ bringt sowohl den erfolgreichen Erwerb als auch den eigennützigen Zug von εἰς ἑαυτόν zum Ausdruck.
- source_word: ὑπερβάλλων τὸν Ἰάσονα
  choice: indem er Jason … überbot
  rationale: Die unmittelbar genannte Geldsumme zeigt, dass es um ein höheres Angebot geht. „Überbieten“ gibt diesen geschäftsartigen Sinn prägnant wieder.
- source_word: τάλαντα ἀργυρίου τριακόσια
  choice: dreihundert Talente Silber
  rationale: Die antike Gewicht- und Geldeinheit bleibt erhalten; eine Umrechnung in moderne Werte wäre unsicher und würde falsche Genauigkeit erzeugen.
theological_decisions:
- issue: Moralische Färbung von Menelaus’ Verhalten gegenüber dem König
  choice: „hoch geehrt“ statt ausdrücklich „geschmeichelt“
  alternative: „ihm geschmeichelt“ oder „ihn verherrlicht“
  rationale: Der politische Zusammenhang lässt eigennützige Schmeichelei vermuten, doch δοξάζω bezeichnet zunächst Ehre oder Verherrlichung. Die neutralere Wiedergabe überlässt die moralische Bewertung dem Erzählzusammenhang.
- issue: Bezug und Bedeutung von τῷ προσώπῳ τῆς ἐξουσίας
  choice: Als Beschreibung eines autoritativen äußeren Auftretens verstanden
  alternative: 'Wörtlicher: „mit dem Gesicht/der Erscheinung der Autorität“; stärker deutend: „durch die Zurschaustellung seiner Macht“'
  rationale: Die griechische Wendung ist semantisch verdichtet und im Deutschen wörtlich kaum verständlich. Die gewählte Form bewahrt das Moment sichtbarer Präsenz, ohne genauer festzulegen, worin seine Autorität bestand.
translation_notes:
  register: Modernes, gehobenes Standarddeutsch mit klarer Erzählbewegung. „Hohepriester“ und „Talente“ bewahren die historisch-religiöse Begrifflichkeit; schwer verständliche griechische Idiomatik wird maßvoll erschlossen und in den Fußnoten offengelegt.
