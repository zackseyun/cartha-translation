translation:
  language: de
  text: Sie hielten die Ehren ihrer Vorfahren für nichts, die griechischen Auszeichnungen dagegen für die besten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die griechischen Ruhmestitel« beziehungsweise »Ehren«; das griechische Wort bezeichnet hier wahrscheinlich angesehene Merkmale griechischen Kulturprestiges.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πατρῴας τιμὰς
  choice: die von den Vätern überkommenen Ehren
  rationale: Die Formulierung bewahrt sowohl den familiär-geschichtlichen Sinn von πατρῴας als auch den Wert- und Ehrbegriff von τιμάς, ohne ihn auf rechtliche Vorrechte oder bloße Bräuche zu verengen.
- source_word: ἐν οὐδενὶ τεθειμένοι
  choice: achteten … für nichts
  rationale: Die idiomatische deutsche Wendung gibt die starke Geringschätzung des griechischen Ausdrucks wieder, ohne das nicht ausdrücklich verwendete Verb „verachten“ einzuführen.
- source_word: Ἑλληνικὰς
  choice: griechischen
  rationale: „Griechisch“ ist im Zusammenhang mit kultureller Orientierung und gesellschaftlichem Ansehen die natürliche moderne Entsprechung.
- source_word: δόξας
  choice: Auszeichnungen
  rationale: Der Plural bezeichnet hier wahrscheinlich angesehene Merkmale oder Formen griechischen Prestiges. „Auszeichnungen“ erhält diesen sozialen Sinn und vermeidet eine vorschnelle Gleichsetzung mit den zuvor genannten Ehren.
- source_word: καλλίστας
  choice: die vorzüglichsten
  rationale: Der Superlativ von καλός bezeichnet hier eine wertende Bevorzugung. „Vorzüglichsten“ klingt würdig und lässt sowohl den Gedanken des Besten als auch des besonders Anziehenden anklingen.
- source_word: ἡγούμενοι
  choice: hielten … für
  rationale: Diese natürliche deutsche Konstruktion gibt das urteilende Einschätzen des Partizips präzise wieder.
theological_decisions:
- issue: Wertender Gegensatz zwischen dem überkommenen jüdischen Erbe und griechischem Kulturprestige
  choice: 'Den scharfen Gegensatz beschreibend wiedergeben: „für nichts achten“ gegenüber „für die vorzüglichsten halten“.'
  alternative: „die Ehren ihrer Vorfahren verachten und die griechische Herrlichkeit für das Beste halten“
  rationale: Der griechische Text drückt starke Geringschätzung aus, verwendet aber nicht ausdrücklich ein Verb für „verachten“. Zugleich bleibt δόξας mehrdeutig; die Übersetzung vermeidet es, daraus eine theologisch aufgeladene „Herrlichkeit“ zu machen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der parallele Satzbau bildet den griechischen Gegensatz nach. „Von den Vätern überkommen“ ist für heutige Leser klarer als das knappere „väterlich“ oder „angestammt“; „vorzüglichsten“ wahrt den gehobenen Ton, ohne altertümlich zu wirken.
