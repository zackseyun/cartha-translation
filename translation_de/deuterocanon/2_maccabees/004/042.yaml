base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/004/042.yaml
  text: But when they also became aware of the attack by Lysimachus[a], some snatched up stones, others thick pieces of wood, and some, grabbing handfuls of the ashes lying nearby[c][b], hurled them all together at those around Lysimachus.
translation:
  language: de
  text: Als sie aber auch den Angriff des Lysimachus bemerkten[a], rissen die einen Steine an sich, andere dicke Holzstücke[b], und wieder andere griffen nach einer Handvoll Asche, die in der Nähe lag. Dann schleuderten sie alles durcheinander gegen die Leute um Lysimachus[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „da sie auch von dem Angriff des Lysimachus wussten“. Das griechische Partizip kann eher statisch („wissend“) oder im Erzählzusammenhang dynamisch („als sie bemerkten“) verstanden werden.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Dicken von Holz“, also schwere oder dicke Holzstücke.'
    reason: lexical_alternative
  - marker: c
    text: Mit den „Leuten um Lysimachus“ sind wahrscheinlich seine Begleiter oder Unterstützer gemeint.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνειδότες
  choice: als sie … bemerkten
  rationale: Das Partizip bezeichnet hier die Wahrnehmung, die die Reaktion der Menge auslöst. „Bemerkten“ ist natürliches Deutsch und lässt die ebenfalls mögliche statische Bedeutung „wussten“ in einer Fußnote erkennen.
- source_word: ἐπίθεσιν
  choice: Angriff
  rationale: Im Zusammenhang der gewaltsamen Auseinandersetzung gibt „Angriff“ die feindselige Handlung klar und idiomatisch wieder.
- source_word: συναρπάσαντες
  choice: rissen … an sich
  rationale: Die Form vermittelt ein plötzliches, energisches Ergreifen verfügbarer Gegenstände.
- source_word: ξύλων πάχη
  choice: dicke Holzstücke
  rationale: Die Formulierung bleibt nahe bei den wörtlichen „Dicken/Massen von Holz“, ohne sie vorschnell als Knüppel oder Balken festzulegen.
- source_word: σποδοῦ
  choice: Asche
  rationale: „Asche“ ist die gewöhnliche konkrete Bedeutung; „Staub“ wäre weniger präzise, „Glut“ würde dem Text etwas hinzufügen.
- source_word: δραξόμενοι
  choice: griffen nach einer Handvoll
  rationale: Das Verb bezeichnet das Fassen mit der Hand; „eine Handvoll“ bildet die körperliche Handlung im Deutschen anschaulich ab.
- source_word: φύρδην
  choice: alles durcheinander
  rationale: Das Adverb beschreibt ein vermischtes, ungeordnetes Werfen der verschiedenen Gegenstände und Stoffe.
- source_word: ἐνετίνασσον
  choice: schleuderten
  rationale: Der Imperfekt schildert fortgesetztes beziehungsweise wiederholtes heftiges Werfen; „schleuderten“ bewahrt die Gewalt der Handlung.
- source_word: τοὺς περὶ τὸν Λυσίμαχον
  choice: die Leute um Lysimachus
  rationale: Die Wiedergabe bleibt bei der offenen griechischen Umschreibung und legt nicht fest, ob es sich um Begleiter, Anhänger oder bewaffnete Männer handelte.
