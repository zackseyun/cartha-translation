  text: When the quadrennial games were being held in Tyre[a], and the king was present,
translation:
  language: de
  text: Als in Tyrus die alle vier Jahre stattfindenden Spiele[a] abgehalten wurden und der König anwesend war,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich steht im Griechischen »fünfjährig«. Nach antiker inklusiver Zählweise waren damit Spiele gemeint, die alle vier Jahre stattfanden.
    reason: cultural_note
lexical_decisions:
- source_word: Ἀγομένου
  choice: abgehalten wurden
  rationale: Das Partizip im Genitivus absolutus von ἄγω bezeichnet hier die Durchführung einer Festveranstaltung oder eines Wettkampfs. »Abgehalten wurden« ist im Deutschen idiomatisch und bewahrt den andauernden zeitlichen Rahmen.
- source_word: πενταετηρικοῦ
  choice: alle vier Jahre stattfindenden
  rationale: Das Wort bedeutet seiner Form nach »fünfjährig«, bezeichnet im antiken inklusiven Zählsystem jedoch gewöhnlich einen tatsächlich alle vier Jahre wiederkehrenden Festzyklus. Die Umschreibung ist für heutige Leser klarer als »quadriennal«.
- source_word: ἀγῶνος
  choice: Spiele
  rationale: ἀγών kann allgemein einen Wettkampf bezeichnen; im Zusammenhang eines städtischen Festes in Tyrus sind öffentliche Spiele gemeint. Die Übersetzung vermeidet die nicht ausdrücklich genannte Einschränkung auf rein athletische Wettkämpfe.
- source_word: ἐν Τύρῳ
  choice: in Tyrus
  rationale: Direkte Wiedergabe der Ortsangabe mit der im Deutschen üblichen Namensform.
- source_word: τοῦ βασιλέως παρόντος
  choice: und der König anwesend war
  rationale: Der zweite Genitivus absolutus wird als beigeordneter Umstandssatz wiedergegeben. Das ist natürliches modernes Deutsch und erhält die Gleichzeitigkeit.
