base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/004/048.yaml
  text: And he released Menelaus[a], the cause of all the evil, from among the accused; but for those wretched men—who, even if they had pleaded their case before Scythians[c][b], would have been acquitted—for them he decreed death.
translation:
  language: de
  text: Und Menelaus, den Urheber all des Bösen, entließ er aus dem Kreis der Angeklagten; über jene beklagenswerten Männer aber – die selbst dann, wenn sie vor Skythen ihre Sache vorgebracht hätten, ohne Verurteilung freigelassen worden wären[a] – verhängte er das Todesurteil.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „die, selbst wenn sie vor Skythen gesprochen hätten, unverurteilt freigelassen worden wären“. Die Erwähnung der Skythen verschärft die Ironie: Selbst ein Volk, das als besonders rau galt, hätte diese Männer nicht verurteilt.'
    reason: cultural_note
lexical_decisions:
- source_word: τὸν ... τῆς ὅλης κακίας αἴτιον
  choice: den Urheber all des Bösen
  rationale: αἴτιος bezeichnet hier den Verantwortlichen beziehungsweise Verursacher. „Urheber“ wahrt den starken moralischen Vorwurf; ὅλης gibt die umfassende Aussage „all des Bösen“ vor.
- source_word: ἀπέλυσεν τῶν κατηγορημένων
  choice: entließ er aus dem Kreis der Angeklagten
  rationale: ἀπολύω bedeutet „freilassen/entlassen“; der Genitiv τῶν κατηγορημένων bezeichnet die Gruppe der Angeklagten. Die Wiedergabe erhält das griechische Bild, ohne ausdrücklich einen förmlichen Freispruch zu behaupten.
- source_word: τοῖς ... ταλαιπώροις
  choice: über jene beklagenswerten Männer
  rationale: ταλαίπωρος drückt Elend und bemitleidenswerte Not aus. „Beklagenswert“ vermittelt das Pathos in würdigem, modernem Deutsch.
- source_word: οἵτινες εἰ καὶ ἐπὶ Σκυθῶν ἔλεγον
  choice: die selbst dann, wenn sie vor Skythen ihre Sache vorgebracht hätten
  rationale: ἐπί mit Genitiv hat hier gerichtlichen Sinn („vor“); ἔλεγον ist im Zusammenhang elliptisch für das Vorbringen ihrer Verteidigung beziehungsweise Sache.
- source_word: ἀπελύθησαν ἀκατάγνωστοι
  choice: ohne Verurteilung freigelassen worden wären
  rationale: Die Formulierung bildet sowohl ἀπολύω („freilassen“) als auch ἀκατάγνωστος („nicht verurteilt“) ab und vermeidet, die beiden Begriffe in einem einzigen „freigesprochen“ zusammenzuziehen.
- source_word: θάνατον ἀπέκρινεν
  choice: verhängte er das Todesurteil
  rationale: ἀποκρίνω bezeichnet hier das Fällen beziehungsweise Aussprechen einer Entscheidung. „Das Todesurteil verhängen“ ist im Deutschen idiomatisch und gibt den forensischen Sinn präzise wieder.
