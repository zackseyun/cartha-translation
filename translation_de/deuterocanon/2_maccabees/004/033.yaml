  text: And Onias[a], when he clearly recognized this, withdrew to a place of asylum at Daphne, which lies near Antioch.
translation:
  language: de
  text: Als Onias dies klar erkannt hatte, zog er sich in eine Asylstätte[a] in Daphne zurück, das bei Antiochia liegt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „an einen Zufluchtsort“. Das griechische Wort bezeichnet einen Ort, der als Asyl rechtlich und sakral geschützt beziehungsweise unverletzlich war, nicht nur allgemein einen sicheren Ort.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σαφῶς ἐπεγνωκὼς
  choice: als … dies klar erkannt hatte
  rationale: Die zeitliche Nebensatzkonstruktion gibt das vorzeitige Partizip natürlich wieder; „klar erkannt“ bewahrt den Nachdruck auf sicherer, deutlicher Erkenntnis.
- source_word: ἀπήνεγκεν ἀποκεχωρηκὼς
  choice: zog er sich … zurück
  rationale: Die ungewöhnliche Verbindung der beiden Bewegungsverben bezeichnet im Zusammenhang den Rückzug des Onias aus der Gefahr. Eine einzige idiomatische deutsche Verbfügung vermeidet eine hölzerne Doppelung.
- source_word: εἰς ἄσυλον τόπον
  choice: an einen unverletzlichen Zufluchtsort
  rationale: „Unverletzlich“ bewahrt die rechtlich-sakrale Bedeutung von ἄσυλος; „Zufluchtsort“ macht zugleich die konkrete Funktion des Ortes verständlich.
- source_word: ἐπὶ Δάφνης
  choice: in Daphne
  rationale: Die Präposition ist hier örtlich zu verstehen; im Deutschen ist bei der benannten Ortschaft „in Daphne“ am natürlichsten.
- source_word: τῆς πρὸς Ἀντιοχίας κειμένης
  choice: das bei Antiochia liegt
  rationale: Der Relativsatz identifiziert Daphne durch seine Lage nahe Antiochia und folgt dem Bezug auf den Ortsnamen.
