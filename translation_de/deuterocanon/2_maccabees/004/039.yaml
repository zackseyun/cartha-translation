base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/004/039.yaml
  text: But when many acts of temple robbery had been committed in the city by Lysimachus[a], with the consent of Menelaus, and the report had spread outside, the crowd gathered against Lysimachus[b], since much gold had already been plundered.
translation:
  language: de
  text: Als Lysimachus mit Zustimmung des Menelaus in der Stadt zahlreiche Tempelraube begangen hatte[a] und die Nachricht davon sich außerhalb verbreitet hatte[b], versammelte sich die Menge gegen Lysimachus; denn viele Goldgegenstände waren bereits geraubt worden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zahlreiche Sakrilegien verübt hatte“. Das griechische Wort bezeichnet genauer den Raub heiligen oder zum Tempel gehörenden Eigentums.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „das Gerücht davon sich außerhalb verbreitet hatte“. Das griechische φήμη kann „Nachricht“, „Bericht“ oder „Gerücht“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἱεροσυλημάτων
  choice: Fälle von Tempelraub
  rationale: Das Wort bezeichnet nicht allgemein religiösen Frevel, sondern besonders den Raub heiligen beziehungsweise zum Tempel gehörenden Eigentums. Die pluralische Wendung gibt die Vielzahl der Taten wieder.
- source_word: μετὰ τῆς τοῦ Μενελάου γνώμης
  choice: mit Zustimmung des Menelaus
  rationale: γνώμη kann Meinung, Absicht oder Billigung bezeichnen. Im Zusammenhang drückt die Formulierung Menelaus’ Mitverantwortung aus, ohne zu behaupten, er habe die Taten selbst ausgeführt.
- source_word: διαδοθείσης ἔξω τῆς φήμης
  choice: die Nachricht davon nach draußen gedrungen war
  rationale: φήμη kann Nachricht, Bericht oder Gerücht bedeuten. „Nachricht“ bleibt neutral; „nach draußen gedrungen“ bewahrt die räumliche Ausdrucksweise des Griechischen.
- source_word: ἐπισυνήχθη τὸ πλῆθος
  choice: versammelte sich die Menge
  rationale: Die Wendung beschreibt das Zusammenkommen einer größeren Menschenmenge und lässt sich so natürlich und zugleich nah am Griechischen wiedergeben.
- source_word: ἐπὶ τὸν Λυσίμαχον
  choice: gegen Lysimachus
  rationale: ἐπί mit Akkusativ bezeichnet hier die Ausrichtung der versammelten Menge auf Lysimachus; der Zusammenhang legt eine feindselige Konfrontation nahe.
- source_word: χρυσωμάτων
  choice: Goldgegenstände
  rationale: Der Ausdruck bezeichnet Gegenstände oder Kostbarkeiten aus Gold. „Goldgegenstände“ ist genauer als das bloße „Gold“, ohne die nicht ausdrücklich genannte Bedeutung „Gefäße“ einzutragen.
- source_word: διηρπαγμένων
  choice: waren bereits geraubt worden
  rationale: Das Perfektpartizip bezeichnet vollendeten Raub mit fortbestehendem Ergebnis; ἤδη wird durch „bereits“ wiedergegeben.
theological_decisions:
- issue: Art des mit ἱεροσυλημάτων bezeichneten Vergehens
  choice: Raub von Tempel- beziehungsweise heiligem Eigentum
  alternative: allgemeiner religiöser Frevel
  rationale: Die spezifische lexikalische Bedeutung betrifft sakrilegischen Diebstahl. Die Wiedergabe als „Tempelraub“ wahrt die religiöse und geschichtliche Tragweite, ohne weitere dogmatische Aussagen hinzuzufügen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Fälle von Tempelraub“ macht die konkrete Art und die Mehrzahl der Vergehen verständlich; der abschließende Kausalsatz bewahrt die gedankliche Beziehung des griechischen Genitivus absolutus zum Zusammenkommen der Menge.
