  text: And when the king had given his approval, and he had gained control of the office, he immediately shifted his countrymen over to the Greek way of life.
translation:
  language: de
  text: Nachdem der König zugestimmt und Jason das Amt erlangt hatte, stellte er seine Volksgenossen unverzüglich auf griechische Lebensart[a] um.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „auf den griechischen Charakter“ oder „auf das griechische Gepräge“; gemeint ist die Übernahme griechischer kultureller Formen und Bräuche.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπινεύσαντος
  choice: zugestimmt hatte
  rationale: Der Genitivus absolutus bezeichnet die vorausgehende Zustimmung des Königs; „zustimmen“ gibt den amtlichen Konsens natürlich wieder, ohne das wörtliche Bild eines Nickens aufzudrängen.
- source_word: ἀρχῆς
  choice: des Amtes
  rationale: Im Zusammenhang bezeichnet ἀρχή die von Jason erlangte leitende Stellung beziehungsweise das Amt, nicht lediglich abstrakte Macht.
- source_word: κρατήσας
  choice: in den Besitz … gelangt war
  rationale: κρατέω bezeichnet hier das Erlangen wirksamer Verfügung über das Amt. Die Formulierung wahrt den Erwerbsaspekt und fügt sich natürlich in den deutschen Satz ein.
- source_word: εὐθέως
  choice: unverzüglich
  rationale: Das Wort betont, dass Jason unmittelbar nach Erlangung des Amtes handelte; „unverzüglich“ ist modern, klar und dem würdigen Erzählton angemessen.
- source_word: ὁμοφύλους
  choice: seine Volksgenossen
  rationale: Der Ausdruck bezeichnet Menschen desselben Volkes beziehungsweise derselben Abstammung. „Volksgenossen“ erhält diesen ethnisch-gemeinschaftlichen Bezug, ohne „Juden“ ausdrücklich in den griechischen Wortlaut einzutragen.
- source_word: μετέστησε
  choice: führte … hinüber
  rationale: Das transitive Verb beschreibt, dass Jason seine Volksgenossen aus einer bisherigen kulturellen Ausrichtung in eine andere überführte. „führte … hinüber“ bewahrt sowohl seine aktive Rolle als auch die Bewegung zu einem neuen Zustand.
- source_word: Ἑλληνικὸν χαρακτῆρα
  choice: zur griechischen Lebensart
  rationale: Wörtlich steht „zum griechischen Charakter/Gepräge“. Im Kontext bezeichnet die Wendung griechische kulturelle Muster und Lebensformen; „griechische Lebensart“ vermittelt dies verständlich, während die Fußnote das Bild des Ausgangstextes bewahrt.
theological_decisions:
- issue: Kulturelle Tragweite von Ἑλληνικὸν χαρακτῆρα
  choice: griechische Lebensart
  alternative: griechischer Charakter / griechisches Gepräge
  rationale: Die Aussage betrifft Jasons Hellenisierungsprogramm und nicht primär eine innere Charaktereigenschaft. Die gewählte Fassung macht den kulturellen Sinn verständlich, ohne die Annahme einzelner Bräuche oder eine theologische Wertung hinzuzufügen.
translation_notes:
  register: Moderner, würdiger Erzählstil. Der Satzbau macht die vorausgehende Zustimmung des Königs und Jasons anschließendes Handeln deutlich. Die bildhafte Wendung „führte … hinüber“ bleibt verständlich und vermeidet sowohl Umgangssprache als auch eine übermäßig technische Beschreibung kultureller Assimilation.
