  to: Zusätzlich dazu versprach er, weitere fünfzig Talente zu den hundert hinzuzuschreiben,[a] wenn er durch seine Vollmacht die Erlaubnis erhielte, für sich ein Gymnasion und eine Ephebie einzurichten[b] und die Einwohner Jerusalems als Antiochener einzutragen.[c]
