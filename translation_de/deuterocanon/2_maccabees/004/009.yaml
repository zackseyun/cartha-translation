base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/004/009.yaml
  text: In addition to these things[a], he promised to register another fifty talents beyond the one hundred, if he were granted authority to establish for himself a gymnasium and an enrollment of young men[b], and to enroll those in Jerusalem as Antiochenes.
translation:
  language: de
  text: Zusätzlich dazu versprach er, weitere fünfzig Talente zu den hundert hinzuzuschreiben,[a] wenn er durch seine Vollmacht die Erlaubnis erhielte, für sich ein Gymnasion und eine Ephebie einzurichten[b] und die Einwohner Jerusalems als Antiochener einzutragen.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Griechischen steht hier nur »weitere fünfzig zu den hundert«; die Maßeinheit Talente ergibt sich aus dem unmittelbaren Zusammenhang. Das Verb kann eine schriftliche Eintragung oder finanzielle Festsetzung bezeichnen.
    reason: textual_clarification
  - marker: b
    text: Ein Gymnasion und die Ephebie waren griechische Einrichtungen für körperliche, kulturelle und staatsbürgerliche Ausbildung. Sie stehen hier im Zusammenhang mit der Hellenisierung Jerusalems.
    reason: cultural_note
  - marker: c
    text: 'Oder: »die Einwohner Jerusalems als Bürger von Antiochia eintragen«. Das griechische Wort lautet wörtlich »Antiochener«; welcher genaue rechtliche Status damit verbunden war, bleibt offen.'
    reason: alternative_reading
lexical_decisions:
- source_word: πρὸς δὲ τούτοις
  choice: Zusätzlich dazu
  rationale: Gibt den anschließenden, steigernden Charakter der Wendung knapp und natürlich wieder.
- source_word: ὑποσχεῖτο
  choice: versprach er
  rationale: Das Medium bezeichnet hier eine verbindliche Zusage im Rahmen des finanziellen Angebots.
- source_word: ἕτερα διαγράψειν πεντήκοντα πρὸς τοῖς ἑκατόν
  choice: weitere fünfzig Talente zu den hundert hinzuzuschreiben
  rationale: διαγράφειν bewahrt den verwaltungssprachlichen Gedanken einer schriftlichen Eintragung oder Festsetzung. Die Maßeinheit »Talente« ist aus dem unmittelbaren Zusammenhang ergänzt.
- source_word: ἐὰν ἐπιχορηγηθῇ διὰ τῆς ἐξουσίας αὐτοῦ
  choice: falls ihm kraft dessen Vollmacht gestattet würde
  rationale: Die Formulierung gibt die passive Gewährung und die Ausübung übergeordneter Vollmacht wieder, ohne den Bezug des griechischen Pronomens im Haupttext ausdrücklich festzulegen.
- source_word: γυμνάσιον
  choice: griechische Sport- und Bildungsstätte
  rationale: Das antike Gymnasion war keine Schule im heutigen deutschen Sinn; die funktionale Wiedergabe vermeidet dieses Missverständnis und wahrt den hellenistischen Kontext.
- source_word: ἐφηβίαν
  choice: Verband junger Männer
  rationale: ἐφηβία bezeichnet die institutionalisierte Gemeinschaft beziehungsweise Ausbildung der Epheben. Die gewählte Formulierung ist verständlich, ohne das schwer zugängliche Fachwort »Ephebie« in den Haupttext zu setzen.
- source_word: αὐτῷ συστήσασθαι
  choice: für sich … einzurichten
  rationale: Bewahrt sowohl den Gründungscharakter von συστήσασθαι als auch die reflexive Nuance von αὐτῷ.
- source_word: τοὺς ἐν Ἱεροσολύμοις Ἀντιοχεῖς ἀναγράψαι
  choice: die Menschen in Jerusalem als Antiochener registrieren zu lassen
  rationale: ἀναγράφειν ist ein administratives Registrieren; »als Antiochener« hält die Bezeichnung des griechischen Textes fest, ohne den genauen Rechtsstatus vorschnell als volles Bürgerrecht zu bestimmen.
theological_decisions:
- issue: Politisch-rechtliche Bedeutung von Ἀντιοχεῖς
  choice: Antiochener
  alternative: Bürger von Antiochia
  rationale: Der Zusammenhang legt eine staatsbürgerliche oder korporative Registrierung nahe, doch das Griechische nennt unmittelbar nur »Antiochener«. Die offenere Wiedergabe wahrt die historische Unschärfe.
- issue: Bezug von αὐτοῦ in διὰ τῆς ἐξουσίας αὐτοῦ
  choice: dessen Vollmacht
  alternative: Vollmacht des Königs
  rationale: Im Zusammenhang ist sehr wahrscheinlich die königliche Vollmacht gemeint; das Pronomen selbst nennt den Träger jedoch nicht ausdrücklich. Die Übersetzung bewahrt diesen formalen Bezug.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Historische Fachbegriffe werden im Haupttext funktional und verständlich wiedergegeben; die Fußnoten nennen die griechischen Institutionen und erhalten verwaltungsrechtliche Unschärfen.
