base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/004/032.yaml
  text: But Menelaus[a], thinking that he had found a favorable opportunity, embezzled some of the gold vessels of the temple and gave them as a gift to Andronicus[b], and he had managed to sell others in Tyre and the surrounding cities.
translation:
  language: de
  text: Menelaus aber meinte, eine günstige Gelegenheit gefunden zu haben. Er unterschlug einige Goldgegenstände[a] des Tempels und schenkte sie Andronikus; andere hatte er nach Tyrus und in die umliegenden Städte verkauft.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich allgemeiner: „einige goldene Gegenstände“; der griechische Ausdruck legt nicht fest, dass es sich um Gefäße handelte.'
    reason: lexical_alternative
  - marker: b
    text: Die griechische Wendung kann näher am Wortlaut mit „und es traf sich, dass er andere bereits nach Tyrus und in die umliegenden Städte verkauft hatte“ wiedergegeben werden. Gemeint ist jedenfalls, dass weitere Gegenstände dort schon verkauft worden waren.
    reason: lexical_ambiguity
lexical_decisions:
- source_word: νομίσας
  choice: meinte
  rationale: Das Aoristpartizip bezeichnet Menelaus’ subjektive Einschätzung; „meinte“ bewahrt diesen Vorbehalt knapp und natürlich.
- source_word: καιρὸν εὐφυῆ
  choice: eine günstige Gelegenheit
  rationale: Die Wendung bezeichnet einen besonders passenden oder vorteilhaften Zeitpunkt.
- source_word: χρυσώματά τινα
  choice: einige Goldgegenstände
  rationale: χρυσώματα bezeichnet allgemein Gegenstände aus Gold. „Goldgefäße“ wäre im Tempelkontext möglich, ist aber enger als der griechische Ausdruck.
- source_word: τῶν τοῦ ἱεροῦ
  choice: des Tempels
  rationale: Der Genitiv kennzeichnet die Gegenstände als Eigentum des Tempels; die knappe deutsche Zuordnung ist eindeutig.
- source_word: νοσφισάμενος
  choice: unterschlug
  rationale: Das Verb bezeichnet die widerrechtliche Aneignung von Gut, das jemandem anvertraut ist oder einem anderen gehört. „Unterschlug“ gibt diese Veruntreuung präzise wieder.
- source_word: ἐχαρίσατο
  choice: schenkte sie
  rationale: Die mediale Form bezeichnet hier die Zuwendung als Geschenk oder Gefälligkeit; „schenkte“ bewahrt diesen Sinn ohne erklärenden Zusatz.
- source_word: ἐτύγχανεν πεπρακὼς
  choice: hatte er ... verkauft
  rationale: Die Verbindung mit dem Perfektpartizip stellt den bereits vollzogenen Verkauf fest. Die beiläufige Nuance von τυγχάνω lässt sich im Deutschen nicht ohne Schwerfälligkeit vollständig im Haupttext abbilden und wird in der Fußnote kenntlich gemacht.
- source_word: εἴς τε Τύρον καὶ τὰς κύκλῳ πόλεις
  choice: nach Tyrus und in die umliegenden Städte
  rationale: Bei einem Verkaufsverb bezeichnet εἰς die Orte beziehungsweise Absatzgebiete, in die die Gegenstände verkauft wurden. Die wechselnden Präpositionen ergeben idiomatisches Deutsch.
theological_decisions:
- issue: Art von Menelaus’ Vergehen am Tempeleigentum
  choice: „unterschlug“ als widerrechtliche Aneignung von Tempelgut
  alternative: „nahm an sich“ oder „stahl“
  rationale: Die Übersetzung hält die moralische und rechtliche Schwere des Verbs fest, ohne das Vergehen durch spätere theologische Kategorien weiter zu bestimmen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die lange griechische Satzperiode wurde zur besseren Verständlichkeit in zwei Sätze gegliedert. „Goldgegenstände“ vermeidet die nicht ausdrücklich belegte Verengung auf Kultgefäße; „unterschlug“ wahrt die Schwere der widerrechtlichen Aneignung.
