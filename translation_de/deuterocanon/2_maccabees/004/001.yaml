base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/004/001.yaml
  text: But the previously mentioned Simon[a], who had become an informer against the money and the homeland, kept slandering Onias, as though he were the one who had incited Heliodorus and had become the author of the troubles.
translation:
  language: de
  text: 'Doch der schon erwähnte Simon, der zum Denunzianten der Gelder und des Vaterlands geworden war, verleumdete Onias fortwährend: Dieser habe Heliodor angestachelt und sei zum Urheber des Unheils[a] geworden.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »zum Urheber der Übel«. Das griechische Wort kann allgemein Unheil, schlimme Ereignisse oder Schwierigkeiten bezeichnen und meint nicht zwingend moralisch Böses.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προειρημένος
  choice: schon erwähnte
  rationale: Gibt den Rückverweis klar und ohne altertümlichen Klang wieder.
- source_word: ἐνδείκτης
  choice: Verräter an
  rationale: Das Wort bezeichnet hier jemanden, der belastende Informationen preisgibt. In Verbindung mit den ungewöhnlichen Genitiven »Gelder« und »Vaterland« bringt »Verräter an« den feindseligen und illoyalen Sinn natürlich zum Ausdruck, ohne den Vorgang übermäßig zu präzisieren.
- source_word: τῶν χρημάτων
  choice: den Geldern
  rationale: Der Plural bezeichnet Geldmittel; »Gelder« bleibt allgemein genug und legt nicht ausdrücklich fest, dass es sich um Tempelgelder handelt.
- source_word: τῆς πατρίδος
  choice: am Vaterland
  rationale: »Vaterland« bewahrt den Sinn der heimatlichen und politischen Zugehörigkeit und passt idiomatisch zur Wendung »Verräter an«.
- source_word: ἐκακολόγει
  choice: verleumdete … fortwährend
  rationale: Die Wiedergabe erfasst sowohl den verleumderischen Charakter der Rede als auch den andauernden beziehungsweise wiederholten Aspekt des Imperfekts.
- source_word: ἐπισεσυκώς
  choice: habe … angestachelt
  rationale: Das Verb bezeichnet das Aufhetzen oder Antreiben. Der Konjunktiv markiert die Aussage als Simons verleumderische Behauptung, nicht als bestätigte Tatsache.
- source_word: τῶν κακῶν δημιουργός
  choice: Urheber des Unheils
  rationale: Die Formulierung schreibt Onias die Verantwortung für schädliche Ereignisse zu. »Unheil« bewahrt die Breite von κακά, ohne es ausschließlich als moralisch Böses zu deuten.
- source_word: καθεστηκώς
  choice: sei … geworden
  rationale: Entspricht dem resultativen Sinn des Partizips und fügt sich in die indirekte Rede ein.
theological_decisions:
- issue: Art des mit κακά bezeichneten Übels
  choice: Unheil
  alternative: Übel; schlimme Ereignisse; Schwierigkeiten
  rationale: κακά kann moralisch Böses, schädliche Zustände oder schlimme Ereignisse bezeichnen. »Unheil« wahrt diese Breite und vermeidet eine einseitig moralische Festlegung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die fortgesetzte Verleumdung wird durch »fortwährend« ausgedrückt; der Konjunktiv macht deutlich, dass die folgenden Vorwürfe Simon zugeschrieben werden. Die ungewöhnliche Verbindung von ἐνδείκτης mit Geldern und Vaterland wird idiomatisch, aber quellenah als Verrat wiedergegeben.
