  text: Therefore those who had spoken beforehand concerning the city and the people and the sacred vessels quickly suffered the unjust penalty[a][b][c].
translation:
  language: de
  text: So erlitten diejenigen, die sich für die Stadt, die Bevölkerungsgruppen[a] und die heiligen Kultgeräte eingesetzt hatten,[b] rasch die ungerechte Strafe.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich steht im Griechischen ein Plural, der auch „Bürgerschaften“ oder „Gemeinwesen“ bedeuten kann.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „für die Stadt, die Bevölkerungsgruppen und die heiligen Kultgeräte das Wort ergriffen hatten“. Das griechische Verb bezeichnet hier ein öffentliches Eintreten oder eine Fürsprache.'
    reason: lexical_alternative
  - marker: c
    text: Das griechische Wort kann neben „Strafe“ auch „Verlust“ oder „Schaden“ bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: ταχέως οὖν
  choice: So … schon bald
  rationale: οὖν führt die Folge aus dem vorherigen Geschehen ein; ταχέως bezeichnet deren rasches Eintreten. Die deutsche Formulierung gibt beides natürlich und klar wieder.
- source_word: τὴν ἄδικον ζημίαν
  choice: eine ungerechte Strafe
  rationale: ζημία kann Verlust, Schaden oder eine auferlegte Strafe bezeichnen. In diesem Zusammenhang steht die ungerechte Sanktion beziehungsweise das dadurch verursachte Leiden im Vordergrund; die Fußnote hält die weitere Bedeutungsbreite offen.
- source_word: ὑπέσχον
  choice: erlitten
  rationale: In Verbindung mit ζημία bedeutet das Verb hier, eine nachteilige Folge oder Strafe auf sich nehmen beziehungsweise erfahren zu müssen. „Erlitten“ ist prägnant und idiomatisch.
- source_word: οἱ … προηγορήσαντες
  choice: die … eingetreten waren
  rationale: Das Partizip bezeichnet hier ein vorheriges öffentliches Eintreten beziehungsweise eine Fürsprache für die genannten Anliegen. „Eingetreten waren“ passt zur Konstruktion mit περί und vermeidet die sachlich problematische Deutung als Anklage gegen Stadt, Bevölkerung und Geräte.
- source_word: περὶ πόλεως καὶ δήμων καὶ τῶν ἱερῶν σκευῶν
  choice: für die Stadt, die Bevölkerung und die heiligen Geräte
  rationale: περί nennt hier die Anliegen, für die gesprochen wurde. πόλις ist die Stadt; das pluralische δήμων kann Bevölkerungsteile, Bürgerschaften oder Gemeinwesen meinen; ἱερὰ σκεύη bezeichnet die dem Heiligtum zugehörigen heiligen Geräte.
