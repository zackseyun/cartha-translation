  register: Modernes, würdiges Standarddeutsch. Die Satzstellung hebt die rasch eintretende ungerechte Folge hervor. „Heilige Geräte“ bleibt nahe am Griechischen, ohne die im Kontext naheliegende Zuordnung zum Tempel ausdrücklich in den Text einzutragen.
