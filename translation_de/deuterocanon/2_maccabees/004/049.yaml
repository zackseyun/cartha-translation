  to: So erlitten diejenigen, die sich für die Stadt, die Bevölkerungsgruppen[a] und die heiligen Kultgeräte eingesetzt hatten,[b] rasch die ungerechte Strafe.[c]
  rationale: Die Revision wahrt den Plural von δήμων, gibt ταχέως direkter wieder, erhält den bestimmten Artikel der griechischen Nominalgruppe und präzisiert die kultische Bedeutung von ἱερὰ σκεύη. Die kontextuell begründete, aber nicht dogmatisch zugespitzte Wiedergabe von προηγορήσαντες als Fürsprache bleibt erhalten.
