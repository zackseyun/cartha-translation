  yaml_path: translation/deuterocanon/2_maccabees/004/037.yaml
  text: So Antiochus[a], deeply grieved in soul and moved to pity, and having wept because of the self-control and great good order of the one who had died[c][b],
translation:
  language: de
  text: So wurde Antiochus innerlich tief betrübt und zum Erbarmen bewegt; er weinte wegen der Besonnenheit und der großen Disziplin[a] des Verstorbenen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „gute Ordnung“, „geordnetes Verhalten“ oder „ausgezeichnete Lebensführung“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ψυχικῶς … ὑπολυπηθείς
  choice: in seiner Seele tief betrübt
  rationale: Die Wendung gibt sowohl den ausdrücklichen Bezug auf das Innere bzw. die Seele als auch die starke Betrübnis in natürlichem Deutsch wieder.
- source_word: τραπεὶς ἐπὶ ἔλεος
  choice: zum Erbarmen bewegt
  rationale: Die Formulierung bewahrt den im Griechischen beschriebenen inneren Umschwung hin zu Mitleid bzw. Erbarmen.
- source_word: δακρύσας
  choice: er weinte
  rationale: Die finite Wiedergabe löst die griechische Partizipienfolge für verständliches modernes Deutsch auf, ohne den Vorgang abzuschwächen.
- source_word: διὰ
  choice: über
  rationale: In Verbindung mit „weinen“ drückt „über“ den kausalen Anlass idiomatisch aus.
- source_word: τοῦ μετηλλαχότος
  choice: des Verstorbenen
  rationale: Das substantivierte Perfektpartizip bezeichnet hier den bereits Gestorbenen; „der Verstorbene“ ist knapp, würdig und eindeutig.
- source_word: σωφροσύνην
  choice: Besonnenheit
  rationale: Der Begriff umfasst Selbstbeherrschung, vernünftige Mäßigung und sittliche Besonnenheit; „Besonnenheit“ hält diese Bedeutungsbreite besser offen als das engere „Selbstbeherrschung“.
- source_word: πολλὴν εὐταξίαν
  choice: vorbildliche Haltung
  rationale: εὐταξία kann geordnetes, diszipliniertes oder schickliches Verhalten bezeichnen. Im Lob eines Menschen gibt „vorbildliche Haltung“ den Sinn natürlich wieder, während die Fußnote die Mehrdeutigkeit wahrt.
