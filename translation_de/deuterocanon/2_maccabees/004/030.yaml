  yaml_path: translation/deuterocanon/2_maccabees/004/030.yaml
  text: While these things were underway[a], it happened that the people of Tarsus and Mallus revolted, because they were being given as a gift to Antiochis, the king’s concubine.
translation:
  language: de
  text: Während dies geschah, lehnten sich die Einwohner von Tarsus und Mallus auf, weil ihre Städte[a] Antiochis, der Konkubine des Königs, als Geschenk überlassen wurden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „weil sie Antiochis, der Konkubine des Königs, als Geschenk gegeben wurden“. Die griechischen Einwohnerbezeichnungen stehen hier für die betreffenden Städte bzw. Gemeinwesen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: συνεστηκότων
  choice: Während dies im Gange war
  rationale: Der Genitivus absolutus bildet den zeitlichen Übergang aus dem vorhergehenden Zusammenhang. Die idiomatische Wiedergabe bewahrt diese Funktion, ohne ein wörtliches „Zusammenstehen“ oder „Versammeltsein“ einzutragen.
- source_word: συνέβη
  choice: kam es dazu
  rationale: Das gewöhnliche Erzählverb führt das folgende Geschehen sachlich ein und klingt im Deutschen zusammen mit dem Infinitiv natürlich.
- source_word: Ταρσεῖς καὶ Μαλλῶτας
  choice: die Einwohner von Tarsus und Mallus
  rationale: Die griechischen Einwohnerbezeichnungen werden zur unmittelbaren Verständlichkeit mit den geläufigeren Städtenamen umschrieben.
- source_word: στασιάζειν
  choice: sich ... auflehnten
  rationale: Das Verb bezeichnet hier politischen Aufruhr beziehungsweise Widerstand. „Sich auflehnen“ gibt dies natürlich wieder, ohne genauer als der Ausgangstext festzulegen, welche Form die Unruhen annahmen.
- source_word: διὰ τὸ
  choice: weil
  rationale: Die Konstruktion leitet den Grund der Auflehnung ein; „weil“ ist die natürliche deutsche Entsprechung.
- source_word: Ἀντιοχίδι
  choice: Antiochis
  rationale: Der Eigenname wird in etablierter griechischer Transliteration beibehalten.
- source_word: παλλακῇ
  choice: Nebenfrau
  rationale: Der Ausdruck bezeichnet eine Frau in einer anerkannten, aber gegenüber einer Ehefrau nachgeordneten Verbindung. „Nebenfrau“ ist historisch angemessen und vermeidet die modernen Nebenbedeutungen von „Geliebte“.
- source_word: ἐν δωρεᾷ δίδοσθαι
  choice: ihre Städte ... zum Geschenk gegeben wurden
  rationale: Die Passivkonstruktion bezeichnet die Übertragung der Städte beziehungsweise ihrer Einkünfte oder Herrschaftsrechte als königliches Geschenk. Das ergänzte „ihre Städte“ macht im Deutschen den sachlichen Bezug verständlich, ohne die Einwohner selbst als verschenkte Personen erscheinen zu lassen.
