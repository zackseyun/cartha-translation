  yaml_path: translation/deuterocanon/2_maccabees/004/029.yaml
  text: And Menelaus left Lysimachus[a], his own brother, as successor to the high priesthood, while Sostratus left Crates, the one over the Cyprians.
translation:
  language: de
  text: Menelaus ließ seinen eigenen Bruder Lysimachus als Nachfolger im Amt des Hohenpriesters zurück, Sostratus dagegen Krates, der den Zyprern vorstand.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der für die Zyprer zuständige Beamte“ beziehungsweise „der Statthalter über die Zyprer“. Der griechische Text nennt den genauen Amts- oder Verwaltungstitel nicht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέλιπεν
  choice: ließ … zurück
  rationale: Die Wiedergabe bewahrt die Grundbedeutung „zurücklassen“. Im Zusammenhang bezeichnet das Verb zugleich, dass während der Abwesenheit ein Stellvertreter beziehungsweise Amtsnachfolger eingesetzt wurde, ohne diese Bedeutung stärker als der griechische Text festzulegen.
- source_word: τῆς ἀρχιερωσύνης διάδοχον
  choice: als Nachfolger im Amt des Hohenpriesters
  rationale: διάδοχος bezeichnet einen Nachfolger; der Genitiv nennt das betreffende Amt. Die Formulierung ist im Deutschen natürlich und lässt offen, ob eine dauerhafte Nachfolge oder eine vorläufige Amtsvertretung gemeint ist.
- source_word: τὸν ἑαυτοῦ ἀδελφόν
  choice: seinen eigenen Bruder
  rationale: „eigenen“ gibt die Hervorhebung durch ἑαυτοῦ wieder.
- source_word: τὸν ἐπὶ τῶν Κυπρίων
  choice: der den Zyprern vorstand
  rationale: Die Wendung bezeichnet Krates als jemanden, der „über“ den Zyprern stand. Da der genaue Verwaltungs- oder militärische Titel nicht genannt wird, vermeidet diese Wiedergabe die Festlegung auf ein bestimmtes Amt.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Gegenüberstellung mit μέν … δέ wird durch „dagegen“ wiedergegeben; im zweiten Satzteil bleibt das im Griechischen ausgelassene Verb auch im Deutschen sinngemäß ergänzt. Der Fußnotenmarker steht bei der tatsächlich erläuterten Wendung über Krates und die Zyprer.
