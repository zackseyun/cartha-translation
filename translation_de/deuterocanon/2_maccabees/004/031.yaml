  yaml_path: translation/deuterocanon/2_maccabees/004/031.yaml
  text: So the king came quickly to settle the affairs, leaving Andronicus, one of those holding high office, as his successor.
translation:
  language: de
  text: Darum kam der König eilig, um die Lage zu beruhigen. Er ließ Andronikus, einen der hohen Würdenträger, als seinen Stellvertreter[a] zurück.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: als seinen Nachfolger.'
    reason: διαδέχομαι kann sowohl das vertretungsweise Einnehmen einer Stelle als auch das Nachfolgen bezeichnen; der unmittelbare Kontext legt »Stellvertreter« nahe, ohne die andere Möglichkeit völlig auszuschließen.
lexical_decisions:
- source_word: θᾶττον
  choice: eilig
  rationale: Gibt das adverbiale »rasch/schnell« in natürlichem, würdevollem Deutsch wieder.
- source_word: καταστεῖλαι τὰ πράγματα
  choice: um die Lage zu beruhigen
  rationale: Die Wendung bezeichnet das Ordnen beziehungsweise Beruhigen angespannter Verhältnisse; »die Lage« ist hier natürlicher als das wörtliche »die Angelegenheiten«.
- source_word: τὸν διαδεχόμενον
  choice: als seinen Stellvertreter
  rationale: Im Kontext bezeichnet das Partizip Andronikus als denjenigen, der während der Abwesenheit des Königs dessen Stelle einnimmt; die mögliche Bedeutung »Nachfolger« bleibt in einer Fußnote erhalten.
- source_word: τῶν ἐν ἀξιώματι κειμένων
  choice: einen der hohen Würdenträger
  rationale: Bringt idiomatisch zum Ausdruck, dass Andronikus zu den Personen in einer angesehenen beziehungsweise hohen Amtsstellung gehörte.
