base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/004/016.yaml
  text: 'For this reason a harsh crisis surrounded them: those whose ways they envied and whom they wanted to imitate became their enemies and punishers[a][b].'
translation:
  language: de
  text: 'Deshalb[a] gerieten sie in schwere Bedrängnis: Gerade diejenigen, deren Lebensweise[b] sie nachahmten und denen sie gleichen wollten, wurden ihre Feinde und bestraften sie.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ihretwegen“; die griechische Wendung kann die zuvor genannten Menschen ausdrücklich als Ursache der folgenden Bedrängnis bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: „Lebensweise“ kann hier auch mit „Sitten“, „Bräuche“ oder „Lebensführung“ wiedergegeben werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὧν καὶ χάριν
  choice: Deshalb
  rationale: Die Verbindung von χάριν mit dem Genitiv bezeichnet hier den Grund der folgenden Bedrängnis. „Deshalb“ gibt die kausale Aussage natürlich wieder; die mögliche ausdrückliche Rückbeziehung auf die zuvor genannten Menschen wird in Fußnote [a] bewahrt.
- source_word: περιεῖχεν αὐτοὺς χαλεπὴ περίστασις
  choice: gerieten sie in schwere Bedrängnis
  rationale: περιέχω zeichnet eigentlich das Bild eines Umschließens, während περίστασις hier eine bedrängende Notlage bezeichnet. Die deutsche Wendung ist verständlich und bewahrt den Druck der Situation, ohne das Bild unnatürlich nachzuahmen.
- source_word: ἐζήλουν
  choice: nacheiferten
  rationale: ζηλόω kann Eifer, Bewunderung, Nachahmung oder Neid bezeichnen. „Nacheifern“ hält die auf Nachahmung gerichtete Bedeutung fest und passt zur folgenden Aussage, dass sie ihnen gleichen wollten.
- source_word: τὰς ἀγωγὰς
  choice: Lebensweise
  rationale: ἀγωγή kann Lebensführung, Verhalten, Erziehung oder Brauch bezeichnen. Im Zusammenhang der Übernahme hellenistischer Sitten ist „Lebensweise“ weit genug und zugleich konkret verständlich.
- source_word: καθʼ ἃ ἤθελον ἐξομοιοῦσθαι
  choice: denen sie gleichen wollten
  rationale: ἐξομοιόομαι bezeichnet das Sich-angleichen oder Gleichwerden. Die relationale Konstruktion wird idiomatisch auf die genannten Menschen bezogen, ohne den Grad der beabsichtigten Angleichung näher festzulegen.
- source_word: πολεμίους καὶ τιμωρητὰς ἔσχον
  choice: wurden ihre Feinde und bestraften sie
  rationale: 'Wörtlich hatten sie diese Menschen „als Feinde und Strafende/Vergelter“. Die verbale deutsche Fassung vermeidet das unnatürliche Substantiv „Bestrafer“, bewahrt aber beide Rollen: Feindschaft und vollzogene Strafe beziehungsweise Vergeltung.'
theological_decisions:
- issue: Moralische Deutung der Übernahme fremder Lebensweisen
  choice: 'Die ironische Umkehr bleibt sichtbar: Die Menschen, denen die Juden nacheiferten, wurden zu ihren Feinden und bestraften sie.'
  alternative: Neutraler könnte lediglich gesagt werden, dass die zuvor Bewunderten später gegen sie vorgingen.
  rationale: ἐζήλουν und τιμωρητάς tragen im Kontext eine negative, vergeltende Färbung. Die Übersetzung wahrt diese Wertung, ohne ausdrücklich zu bestimmen, ob die Strafe unmittelbar als göttliches Gericht zu verstehen ist.
- issue: Art der in τιμωρητάς bezeichneten Vergeltung
  choice: „bestraften sie“
  alternative: „übten Vergeltung an ihnen“ oder „wurden ihre Rächer“
  rationale: Das griechische Wort kann Bestrafung oder Vergeltung bezeichnen. „Bestraften sie“ ist im modernen Deutsch natürlich und legt weder ein förmliches Gerichtsverfahren noch ein bestimmtes Rachemotiv fest.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Gerieten in schwere Bedrängnis“ und die verbale Wiedergabe „bestraften sie“ vermeiden unbeholfene Lehnwendungen, während die ironische Umkehr und der ernste Ton des griechischen Textes erhalten bleiben.
