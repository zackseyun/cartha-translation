  yaml_path: translation/deuterocanon/2_maccabees/004/013.yaml
  text: And there was such a height of Hellenism and an increase of foreign ways because of the surpassing shamelessness of Jason[a], who was ungodly and not the high priest,
translation:
  language: de
  text: Der Hellenismus erreichte einen solchen Höhepunkt, und fremde Sitten[a] drangen so weit vor – wegen der maßlosen Schamlosigkeit des gottlosen Jason, der kein Hohepriester war.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Eindringen fremder Lebensweisen“. Der seltene griechische Ausdruck bezeichnet die Ausbreitung nichtjüdischer Bräuche und Lebensformen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκμή
  choice: Höhepunkt
  rationale: Das Wort bezeichnet den höchsten Entwicklungsstand oder Gipfel und wird im Deutschen durch „Höhepunkt“ präzise und natürlich wiedergegeben.
- source_word: Ἑλληνισμός
  choice: Hellenisierung
  rationale: Im Zusammenhang geht es um die Ausbreitung und Übernahme griechischer Kultur und Lebensweise. „Hellenisierung“ bezeichnet diesen Vorgang im Deutschen klarer als das mehrdeutige „Hellenismus“.
- source_word: πρόσβασις
  choice: Vordringen
  rationale: Der seltene Ausdruck beschreibt hier das weitere Eindringen beziehungsweise die zunehmende Ausbreitung; „Vordringen“ bewahrt diese räumliche Metaphorik.
- source_word: ἀλλοφυλισμός
  choice: fremde Sitten
  rationale: Das seltene Wort verweist auf die Übernahme nichtjüdischer, fremder Lebensformen und Bräuche. „Fremde Sitten“ ist verständlich, ohne die kulturell-religiöse Wertung zu beseitigen.
- source_word: διὰ
  choice: wegen
  rationale: Mit dem Akkusativ bezeichnet διά hier die Ursache.
- source_word: ἀσεβοῦς
  choice: gottlos
  rationale: Das Adjektiv verurteilt Jasons fehlende Ehrfurcht vor Gott; „gottlos“ gibt diese starke Wertung unmittelbar wieder.
- source_word: οὐκ ἀρχιερέως
  choice: der kein Hoher Priester war
  rationale: Die Formulierung bewahrt die schroffe polemische Bestreitung von Jasons Anspruch auf das Hohepriesteramt, ohne „rechtmäßig“ oder „wahr“ erläuternd hinzuzufügen.
- source_word: ὑπερβάλλουσαν ἀναιδείαν
  choice: maßlose Schamlosigkeit
  rationale: „Maßlos“ gibt die steigernde Kraft des Partizips idiomatisch wieder; „Schamlosigkeit“ bewahrt die deutliche moralische Verurteilung.
theological_decisions:
- issue: Aussagekraft von οὐκ ἀρχιερέως in Bezug auf Jason
  choice: der kein Hoher Priester war
  alternative: der kein rechtmäßiger Hoher Priester war
  rationale: Der griechische Text spricht Jason das Hohepriestertum polemisch ab. Die gewählte Fassung erhält diese Spannung, ohne mit „rechtmäßig“ eine mögliche Erklärung in den Text einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur folgt den beiden parallelen Nominalausdrücken des Griechischen, bleibt aber durch die Wiederholung von „zu einem solchen“ und den Gedankenstrich gut verständlich. „Hellenisierung“ ist historisch präzise und für heutige Leser transparenter als „Hellenismus“.
