- from: So kam es zu einem solchen Höhepunkt der Hellenisierung und zu einem solchen Vordringen fremder Sitten[a] – wegen der maßlosen Schamlosigkeit Jasons, dieses gottlosen Mannes, der kein Hoher Priester war.
