translation:
  language: de
  text: Als aber die Feindschaft so weit fortschritt, dass sogar durch einen von denen, die Simon gebilligt hatte, Morde verübt wurden,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dass sogar von einem von denen, die Simon gebilligt hatte, Morde verübt wurden“. Das Griechische lässt die Person unbestimmt; διά kann hier sowohl ihre vermittelnde Rolle als auch ihre unmittelbare Täterschaft bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔχθρας
  choice: Feindschaft
  rationale: ἔχθρα bezeichnet feindselige Gegnerschaft oder Feindschaft. „Feindschaft“ ist im Deutschen natürlich und lässt offen, ob eher die Haltung oder der ausgetragene Konflikt im Vordergrund steht.
- source_word: ἐπὶ τοσοῦτον προβαινούσης
  choice: so weit fortschritt
  rationale: Die Genitivus-absolute-Konstruktion beschreibt eine Entwicklung bis zu einem äußersten Punkt. „so weit fortschritt“ bewahrt das Bild des Fortschreitens.
- source_word: διὰ τινος
  choice: durch einen
  rationale: διά mit Genitiv bezeichnet hier die vermittelnde beziehungsweise ausführende Person; τις bleibt unbestimmt. „durch einen“ erhält diese Unbestimmtheit und vermeidet eine vorschnelle Festlegung auf unmittelbare Täterschaft.
- source_word: τῶν ὑπὸ τοῦ Σίμωνος δεδοκιμασμένων
  choice: aus dem Kreis der von Simon Bewährten
  rationale: Das partitive Verhältnis nach τινος wird ausdrücklich wiedergegeben. δεδοκιμασμένων bezeichnet Personen, die geprüft und als bewährt beziehungsweise geeignet anerkannt worden waren; die Formulierung vermeidet den nicht ausdrücklich genannten Funktionsbegriff „Agenten“.
- source_word: φόνους
  choice: Morde
  rationale: φόνος bezeichnet hier schuldhafte Tötungen beziehungsweise Mordtaten. Der Plural wird beibehalten.
- source_word: συντελεῖσθαι
  choice: verübt wurden
  rationale: Das passive Infinitivgefüge bezeichnet, dass die Morde ausgeführt beziehungsweise vollbracht wurden. „verübt wurden“ ist die natürliche deutsche Verbindung mit „Morde“.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die Satzstruktur folgt dem griechischen Genitivus absolutus in natürlichem Deutsch. „Bewährten“ gibt den Aspekt vorheriger Prüfung und Anerkennung wieder, ohne eine amtliche Stellung oder ein festes Agentenverhältnis hinzuzufügen.
