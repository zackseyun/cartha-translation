  verdict: revise
  source_fidelity: 'Der Entwurf gibt den Genitivus absolutus, die Steigerung und den Plural von φόνους zutreffend wieder. „durch einen“ kann διά mit Genitiv abbilden. „aus dem Kreis der von Simon Bewährten“ fügt jedoch „Kreis“ hinzu und ist mit substantiviertem „Bewährten“ leicht missverständlich: δεδοκιμασμένων bezeichnet hier diejenigen, die Simon gebilligt/anerkannt hatte, nicht notwendig Personen mit der Eigenschaft, sich bewährt zu haben.'
  naturalness: Der Satz ist grundsätzlich natürlich und würdevoll. „einen aus dem Kreis der von Simon Bewährten“ wirkt jedoch unnötig umständlich. „einen von denen, die Simon gebilligt hatte“ ist idiomatischer und bewahrt die partitive, unbestimmte Konstruktion.
  terminology: „Feindschaft“, „so weit fortschritt“, „Morde“ und „verübt wurden“ sind angemessen. Für δεδοκιμασμένων ist „gebilligt“ im Kontext genauer als „Bewährte“, weil das griechische Partizip die Anerkennung durch Simon ausdrückt.
