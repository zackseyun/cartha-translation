revisions:
- from: Als Apollonius, der Sohn des Menestheus, zu den Feierlichkeiten anlässlich der Thronbesteigung König Philometors nach Ägypten gesandt worden war, erfuhr Antiochus, dass Philometor den Angelegenheiten des Antiochus ablehnend gegenüberstand.[a] Daher war er auf seine eigene Sicherheit bedacht. Er kam nach Joppe und zog von dort weiter nach Jerusalem.
  to: Als Apollonius, der Sohn des Menestheus, zu den Feierlichkeiten bei der Thronbesteigung König Philometors nach Ägypten gesandt worden war, erfuhr Antiochus, dass er seinen eigenen Angelegenheiten entfremdet worden war.[a] Daher sorgte er für seine eigene Sicherheit. Nachdem er nach Joppe gekommen war, gelangte er nach Jerusalem.
  rationale: Die Revision beseitigt die sachlich nicht gedeckte Umdeutung der schwierigen griechischen Wendung zu einer Aussage über Philometors politische Haltung. Sie gibt die Bezugnahme auf Antiochus wieder und bewahrt die verbleibende semantische Offenheit durch eine knappe Fußnote. Die Abfolge von Joppe und Jerusalem sowie der politische Sinn von Antiochus' Sorge um Sicherheit bleiben erhalten.
