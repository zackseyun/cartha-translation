base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/004/021.yaml
  text: When Apollonius son of Menestheus had been sent to Egypt for the accession festivities of King Philometor[a], Antiochus, learning that he had become estranged from his own affairs, took thought for his own security. Therefore, after arriving at Joppa, he went on to Jerusalem.
translation:
  language: de
  text: Als Apollonius, der Sohn des Menestheus, zu den Feierlichkeiten bei der Thronbesteigung König Philometors nach Ägypten gesandt worden war, erfuhr Antiochus, dass er seinen eigenen Angelegenheiten entfremdet worden war.[a] Daher sorgte er für seine eigene Sicherheit. Nachdem er nach Joppe gekommen war, gelangte er nach Jerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die griechische Formulierung ist stark verdichtet. Sie kann allgemein bedeuten, dass Antiochus in seinen eigenen politischen Angelegenheiten ins Hintertreffen geraten oder von ihnen abgeschnitten war.
    reason: Die genaue politische Tragweite von ἀλλότριον αὐτὸν τῶν αὐτοῦ γεγονότων πραγμάτων bleibt unsicher; die Anmerkung erläutert dies, ohne Philometor eine im Text nicht ausgedrückte Haltung zuzuschreiben.
lexical_decisions:
- source_word: Ἀποσταλέντος
  choice: gesandt worden war
  rationale: Der Aorist Passiv im Genitivus absolutus bezeichnet den vorausgehenden Umstand; das deutsche Plusquamperfekt gibt die zeitliche Abfolge natürlich wieder.
- source_word: διὰ τὰ προτοκλήρια
  choice: zu den Feierlichkeiten anlässlich der Thronbesteigung
  rationale: Das seltene Substantiv bezeichnet hier Feierlichkeiten im Zusammenhang mit dem Herrschaftsantritt; die Formulierung ist verständlich, ohne eine unsichere Einzelzeremonie festzulegen.
- source_word: τοῦ φιλομήτορος βασιλέως
  choice: König Philometors
  rationale: Φιλομήτωρ ist der etablierte Herrscherbeiname des ägyptischen Königs und wird daher als Name transliteriert, nicht wörtlich als »mutterliebend« übersetzt.
- source_word: μεταλαβὼν
  choice: erfuhr
  rationale: Das Partizip bezeichnet in diesem Zusammenhang das Erlangen einer Nachricht oder Erkenntnis.
- source_word: ἀλλότριον αὐτὸν τῶν αὐτοῦ γεγονότων πραγμάτων
  choice: dass Philometor den Angelegenheiten des Antiochus ablehnend gegenüberstand
  rationale: Die historisch naheliegende Deutung bezieht αὐτόν auf Philometor und versteht ἀλλότριον politisch als distanziert oder feindlich. Wegen der stark verdichteten und mehrdeutigen Pronomenfolge wird die alternative Deutung in einer Fußnote offengehalten.
- source_word: τῆς καθʼ αὑτὸν ἀσφαλίας ἐφρόντιζεν
  choice: war er auf seine eigene Sicherheit bedacht
  rationale: Die Wiedergabe bewahrt sowohl den Gedanken aktiver Sorge als auch den politischen Sinn von ἀσφάλεια, ohne konkrete Maßnahmen hinzuzufügen.
- source_word: παραγενόμενος ... κατήντησεν
  choice: kam ... und zog von dort weiter
  rationale: Die Verbindung macht die Abfolge der Ankunft in Joppe und der Weiterreise nach Jerusalem im Deutschen klar und vermeidet eine schwerfällige Partizipialkonstruktion.
theological_decisions:
- issue: Historischer Beiname Φιλομήτωρ
  choice: als Eigenname bzw. Herrscherbeiname »Philometor« wiedergegeben
  alternative: wörtlich »der mutterliebende König«
  rationale: Der Ausdruck identifiziert einen bestimmten ägyptischen Herrscher; eine wörtliche Übersetzung würde den historischen Bezug verdunkeln.
- issue: Bezug der Pronomen in der Aussage über die politischen Angelegenheiten
  choice: Philometor stand den Angelegenheiten des Antiochus ablehnend gegenüber
  alternative: Antiochus erkannte, dass er seinen eigenen Angelegenheiten entfremdet bzw. in ihnen politisch benachteiligt war
  rationale: Die griechische Wendung ist syntaktisch verdichtet. Der historische Kontext stützt die gewählte Lesart, doch die alternative Zuordnung der Pronomen bleibt sprachlich möglich und wird deshalb nicht verschwiegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Historische Namen bleiben in ihrer üblichen Form erhalten; die Satzstruktur ist gegenüber dem langen griechischen Satz maßvoll gegliedert, um die Verständlichkeit zu sichern.
