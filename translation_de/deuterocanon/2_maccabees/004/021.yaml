  source_fidelity: Die Hauptaussage des Entwurfs verschiebt den Bezug der griechischen Wendung ἀλλότριον αὐτὸν τῶν αὐτοῦ γεγονότων πραγμάτων unzulässig auf Philometor und ergänzt damit ein ablehnendes Verhalten Philometors gegenüber Antiochus. Der griechische Wortlaut beschreibt vielmehr Antiochus als von seinen eigenen Angelegenheiten entfremdet bzw. darin politisch benachteiligt. Die knappe und schwierige Formulierung sollte ohne diese historische Konkretisierung wiedergegeben werden.
  naturalness: Die Satzgliederung ist überwiegend natürlich. Eine Wiedergabe mit »seinen eigenen Angelegenheiten entfremdet« ist zwar bewusst etwas markiert, bildet hier aber die ungewöhnlich verdichtete griechische Aussage angemessener ab; die Fußnote erläutert den politischen Sinn.
  terminology: »König Philometor«, »Thronbesteigung«, »eigene Sicherheit«, »Joppe« und »Jerusalem« sind sachgerecht. »Feierlichkeiten bei der Thronbesteigung« ist idiomatisch und wahrt die Bedeutung von προτοκλήρια.
