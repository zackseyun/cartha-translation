base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/003/033.yaml
  text: And while the high priest was making atonement[a], the same young men appeared again to Heliodorus, clothed in the same garments, and standing there they said, “Give many thanks to Onias the high priest, for because of him the Lord has graciously granted you your life.”
translation:
  language: de
  text: 'Während der Hohepriester die Sühne vollzog[a], erschienen Heliodor dieselben jungen Männer wieder, in dieselben Gewänder gekleidet. Sie stellten sich hin und sagten: »Sei dem Hohenpriester Onias sehr dankbar; denn um seinetwillen hat der Herr dir aus Gnade das Leben gewährt.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »eine sühnende Handlung vollzog«; das griechische Wort kann auch technisch die Entsühnung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιουμένου ... τὸν ἱλασμόν
  choice: die Sühne vollzog
  rationale: Die Wendung bezeichnet die Ausführung einer sühnenden kultischen Handlung. »Die Sühne vollziehen« bewahrt den religiösen Gehalt, ohne eine bestimmte Sühnetheorie oder ausdrücklich ein Opfer vorauszusetzen.
- source_word: οἱ αὐτοὶ νεανίαι
  choice: dieselben jungen Männer
  rationale: Die Wiedergabe bezeichnet männliche Jugendliche beziehungsweise junge Männer und stellt durch »dieselben« ausdrücklich den Bezug zu ihrer früheren Erscheinung her.
- source_word: ἐν ταῖς αὐταῖς ἐσθήσεσιν ἐστολισμένοι
  choice: in dieselben Gewänder gekleidet
  rationale: »Gewänder« gibt ἐσθήσεσιν würdig und anschaulich wieder; »in ... gekleidet« entspricht dem Partizip und bewahrt die visuelle Kontinuität.
- source_word: στάντες
  choice: sie stellten sich hin
  rationale: Die Form bezeichnet das Einnehmen einer stehenden Haltung. Die Übersetzung fügt weder einen Ort noch eine ausdrücklich genannte Nähe zu Heliodor hinzu.
- source_word: Πολλὰ ... χάριτας ἔχε
  choice: Sei ... sehr dankbar
  rationale: Die griechische idiomatische Wendung fordert nachdrücklich zu großer Dankbarkeit auf. Diese deutsche Form ist natürlicher als eine wörtliche Wiedergabe des Plurals χάριτας.
- source_word: διὰ γὰρ αὐτὸν
  choice: denn um seinetwillen
  rationale: διά mit Akkusativ bezeichnet hier den Grund oder Anlass. »Um seinetwillen« hält den persönlichen Bezug fest, ohne eine weitergehende Mittlerrolle zu definieren.
- source_word: σοὶ κεχάρισται τὸ ζῆν
  choice: hat dir aus Gnade das Leben gewährt
  rationale: κεχάρισται bezeichnet ein gnädiges beziehungsweise unverdientes Gewähren; τὸ ζῆν wird im Deutschen idiomatisch als »das Leben« wiedergegeben.
- source_word: Κύριος
  choice: der Herr
  rationale: Die traditionelle und im Kontext natürliche Gottesbezeichnung gibt Κύριος angemessen wieder.
theological_decisions:
- issue: Kultische Bedeutung von ἱλασμός
  choice: die Sühne vollzog
  alternative: die Entsühnung vollzog; eine sühnende Handlung vollzog
  rationale: Die Hauptfassung wahrt den kultischen und theologischen Gehalt, legt aber nicht fest, ob der Akzent ausschließlich auf Besänftigung, Tilgung von Schuld oder Reinigung liegt.
- issue: Gnadencharakter von κεχάρισται
  choice: hat dir aus Gnade das Leben gewährt
  alternative: hat dir das Leben geschenkt; hat dir zu leben gewährt
  rationale: »Aus Gnade« erhält den im Verb enthaltenen Gedanken freier Gunst, während »gewährt« die Aussage nicht über das griechische Verb hinaus verstärkt.
- issue: Bedeutung von διὰ αὐτόν für Onias' Rolle
  choice: um seinetwillen
  alternative: wegen ihm; durch ihn
  rationale: Der Akkusativ spricht vorrangig für Grund oder Anlass. Die Übersetzung vermeidet es, Onias ausdrücklich als vermittelnde Ursache zu bezeichnen, lässt aber den Zusammenhang mit seinem sühnenden Handeln bestehen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz wurde nach der Erscheinung der jungen Männer geteilt, um die lange griechische Partizipialkonstruktion verständlich wiederzugeben. »Hohepriester« wird als Amtsbezeichnung großgeschrieben; unnötig konfessionelle Fachsprache wurde vermieden.
