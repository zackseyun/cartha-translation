lexical_decisions:
- source_word: Ταξάμενος ... ἡμέραν
  choice: Nachdem er einen Tag festgesetzt hatte
  rationale: Das aoristische Partizip bezeichnet die vorherige Festsetzung eines noch nicht näher bestimmten Tages; die Wiedergabe bewahrt sowohl die zeitliche Folge als auch die Unbestimmtheit des artikellosen ἡμέραν.
- source_word: εἰσῄει
  choice: ging er hinein
  rationale: Die Form ist Imperfekt und bezeichnet im Erzählzusammenhang das Hineingehen. „Ging hinein“ bleibt natürlich und vermeidet eine nicht ausdrücklich genannte Ortsangabe.
- source_word: τὴν περὶ τούτων ἐπίσκεψιν
  choice: die Untersuchung dieser Angelegenheiten
  rationale: ἐπίσκεψις bezeichnet hier eine amtliche Prüfung beziehungsweise Untersuchung. „Untersuchung“ passt zum administrativen Zusammenhang; περὶ τούτων bleibt in „dieser Angelegenheiten“ erhalten.
- source_word: οἰκονομήσων
  choice: um ... zu veranlassen
  rationale: Das futurische Partizip drückt den Zweck des Hineingehens aus. Im Kontext meint οἰκονομέω, die amtliche Untersuchung zu organisieren beziehungsweise in die Wege zu leiten; „veranlassen“ ist dafür idiomatisches Deutsch.
- source_word: οὐ μικρὰ
  choice: nicht geringe
  rationale: Die Litotes des Griechischen wird bewahrt, statt sie zu „große“ einzuebnen.
- source_word: καθʼ ὅλην τὴν πόλιν
  choice: in der ganzen Stadt
  rationale: Die Formulierung gibt die räumlich-distributive Bedeutung von κατά und die Betonung durch ὅλην knapp und natürlich wieder.
- source_word: ἀγωνία
  choice: Sorge
  rationale: Das Wort bezeichnet hier die starke öffentliche Beklemmung und Besorgnis angesichts der bevorstehenden Untersuchung. „Sorge“ ist verständlich und würdig, ohne körperliche Qual zu unterstellen.
