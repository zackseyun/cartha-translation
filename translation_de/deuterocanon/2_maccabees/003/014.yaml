  text: After setting a day[a], he went in to arrange the examination concerning these matters; and there was no small anxiety throughout the whole city.
translation:
  language: de
  text: Nachdem er einen Tag festgesetzt hatte, ging er hinein, um die Untersuchung dieser Angelegenheiten zu organisieren. In der ganzen Stadt herrschte aber nicht geringe Sorge.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „nicht geringe Sorge“; eine Untertreibung, die große Besorgnis ausdrückt.'
