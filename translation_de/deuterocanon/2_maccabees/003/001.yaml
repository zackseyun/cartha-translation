  yaml_path: translation/deuterocanon/2_maccabees/003/001.yaml
  text: While the holy city was inhabited in complete peace[a], and the laws were being observed in the best way because of Onias the high priest,
translation:
  language: de
  text: Als die heilige Stadt in völligem Frieden bewohnt war und die Gesetze wegen des Hohenpriesters Onias aufs Beste[a] eingehalten wurden,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sehr gut“. Das griechische Adverb κάλλιστα kann „aufs Beste“ oder verstärkend „sehr gut“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τῆς ἁγίας πόλεως
  choice: die heilige Stadt
  rationale: „Die heilige Stadt“ ist die natürliche und religiös angemessene deutsche Entsprechung; der Genitiv gehört zur einleitenden Genitivus-absolute-Konstruktion.
- source_word: κατοικουμένης
  choice: bewohnt war
  rationale: Das Partizip beschreibt den bestehenden Zustand der Stadt. „Bewohnt war“ wahrt diesen stativen Sinn und fügt sich natürlich in den deutschen temporalen Nebensatz ein.
- source_word: μετὰ πάσης εἰρήνης
  choice: in völligem Frieden
  rationale: Die Formulierung gibt den umfassenden Sinn von πάσης idiomatisch wieder, ohne ihn über „vollständigen Frieden“ hinaus zu verstärken.
- source_word: τῶν νόμων
  choice: die Gesetze
  rationale: Der Plural bleibt erhalten und bezeichnet die einzelnen beziehungsweise gemeinsam betrachteten gesetzlichen Vorschriften.
- source_word: ὅτι κάλλιστα
  choice: aufs Beste
  rationale: Die feste deutsche Wendung bewahrt den superlativischen Sinn des Adverbs und passt idiomatisch zu „eingehalten wurden“.
- source_word: συντηρουμένων
  choice: eingehalten wurden
  rationale: Bei Gesetzen bezeichnet „einhalten“ verständlich und präzise deren fortdauernde Beachtung; die passive Konstruktion des Griechischen bleibt erkennbar.
- source_word: διὰ τὴν Ὀνίου τοῦ ἀρχιερέως
  choice: aufgrund des Hohenpriesters Onias
  rationale: διά mit Akkusativ hat kausale Bedeutung. Da der bereitgestellte griechische Wortlaut nach dem vorangestellten femininen Artikel τὴν abbricht und das zugehörige Bezugswort fehlt, ist dies eine zurückhaltende, am englischen Konsultationstext orientierte Glättung des unvollständigen Segments.
theological_decisions:
- issue: Kausaler Bezug auf Onias
  choice: Der Zustand geordneten Friedens und besonders die Einhaltung der Gesetze werden ursächlich mit dem Hohenpriester Onias verbunden.
  alternative: „durch den Hohenpriester Onias“ als stärker instrumentale Formulierung
  rationale: διά mit Akkusativ bezeichnet hier am ehesten einen Grund. „Aufgrund“ bewahrt diese Kausalität, ohne eine weitergehende theologische Aussage über Onias einzuführen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der griechische Genitivus absolutus wird als natürlicher temporaler Nebensatz mit „Als“ wiedergegeben. Der Satz bleibt mit einem Komma offen, weil das überlieferte Segment syntaktisch in den folgenden Zusammenhang hineinführt. Der bereitgestellte griechische Text endet zudem mitten in der mit διά eingeleiteten Wortgruppe; die deutsche Formulierung folgt deshalb vorsichtig dem geprüften englischen Konsultationstext.
