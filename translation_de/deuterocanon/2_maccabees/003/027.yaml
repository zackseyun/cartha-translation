  text: But he suddenly fell to the ground and was enveloped in deep darkness[a]; and they picked him up and put him on a stretcher,
translation:
  language: de
  text: Doch plötzlich fiel er zu Boden und wurde von tiefer Dunkelheit umhüllt.[a] Da hoben sie ihn auf und legten ihn auf eine Trage,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im griechischen Text der Swete-Ausgabe steht γῆν („Boden“) dreimal unmittelbar hintereinander. Dies ist sehr wahrscheinlich eine Abschreib- oder Übertragungswiederholung und kein beabsichtigter Sinn. Übersetzt wird daher die klare Wendung „zu Boden“.
    reason: textual_variant
lexical_decisions:
- source_word: αἴφνω
  choice: plötzlich
  rationale: Gibt die unerwartete Unmittelbarkeit des Sturzes natürlich und präzise wieder.
- source_word: πεσόντα πρὸς τὴν γῆν
  choice: fiel er zu Boden
  rationale: Idiomatiche deutsche Wiedergabe der Bewegungsrichtung; die Partizipialkonstruktion wird als finites Verb aufgelöst.
- source_word: πολλῷ σκότει περιχυθέντα
  choice: wurde von tiefer Dunkelheit umhüllt
  rationale: Bewahrt das passive Bild einer Dunkelheit, die ihn ringsum erfasst; „tiefe Dunkelheit“ klingt im modernen Deutsch natürlich und würdevoll.
- source_word: συναρπάσαντες
  choice: hoben sie ihn auf
  rationale: Im Zusammenhang bezeichnet das Verb das rasche Ergreifen und Aufnehmen des Gestürzten; eine gewaltsame Wiedergabe wie „packten“ wäre hier unnötig stark.
- source_word: φορεῖον
  choice: Trage
  rationale: Klarer moderner Ausdruck für eine Vorrichtung, auf der ein nicht gehfähiger Mensch getragen wird.
- source_word: ἐνθέντες
  choice: legten ihn auf
  rationale: Entspricht dem Einlegen beziehungsweise Platzieren auf der Trage und verbindet sich idiomatisch mit „Trage“.
