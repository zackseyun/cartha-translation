lexical_decisions:
- source_word: ὁ δὲ
  choice: aber
  rationale: δέ kennzeichnet hier einen leichten Gegensatz zum vorausgehenden Geschehen; die Nachstellung von „aber“ entspricht natürlichem, würdevollem Deutsch.
- source_word: Ἡλιόδωρος
  choice: Heliodor
  rationale: Die im Deutschen übliche Namensform wird verwendet.
- source_word: τὸ διεγνωσμένον
  choice: was beschlossen worden war
  rationale: Das substantivierte Perfektpassiv bezeichnet etwas, das bereits entschieden oder festgelegt worden war; die Formulierung bewahrt diesen Vorzeitigskeits- und Passivsinn.
- source_word: ἐπετέλει
  choice: führte aus
  rationale: Das Imperfekt bezeichnet die in der Vergangenheit verlaufende Umsetzung des Beschlossenen. „führte aus“ gibt den Vollzug idiomatisch wieder, ohne zwingend einen erfolgreichen Abschluss zu behaupten.
