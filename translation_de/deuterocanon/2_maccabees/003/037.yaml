  yaml_path: translation/deuterocanon/2_maccabees/003/037.yaml
  text: When the king asked Heliodorus who might be fit to be sent once more to Jerusalem[a], he said,
translation:
  language: de
  text: 'Als der König Heliodor fragte, wer geeignet wäre, noch einmal nach Jerusalem geschickt zu werden[a], sagte er:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „wer geeignet wäre, noch ein einziges Mal nach Jerusalem geschickt zu werden“. „Noch einmal“ gibt ἔτι ἅπαξ im Deutschen idiomatisch wieder.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπερωτήσαντος
  choice: fragte
  rationale: Der Genitivus absolutus gibt den Umstand der anschließenden Antwort an. „fragte“ ist natürliches modernes Deutsch und gibt das Erkundigen ohne unnötige Förmlichkeit wieder.
- source_word: ποῖός τις εἴη
  choice: wer … wäre
  rationale: Die indirekte Frage zielt zugleich auf Person und Eignung. „wer … wäre“ bewahrt ihre offene, potentiale Färbung.
- source_word: ἐπιτήδειος
  choice: geeignet
  rationale: Das Adjektiv bezeichnet eine für die Aufgabe passende Person. „geeignet“ ist präzise, geläufig und neutral.
- source_word: ἔτι ἅπαξ
  choice: noch einmal
  rationale: Die Wendung bezeichnet eine weitere einzelne Gelegenheit; „noch einmal“ bildet sowohl Wiederholung als auch Einmaligkeit idiomatisch ab.
- source_word: διαπεμφθῆναι
  choice: geschickt zu werden
  rationale: Der passive Infinitiv bezeichnet die Entsendung zu einem Auftrag. Die gewählte Formulierung ist klar und vermeidet übermäßige Amtssprache.
- source_word: εἰς Ἱεροσόλυμα
  choice: nach Jerusalem
  rationale: Bei einer Bewegungsrichtung zu einer Stadt verlangt natürliches Deutsch „nach“.
- source_word: ἔφησεν
  choice: sagte er
  rationale: Das Verb führt Heliodors folgende Äußerung ein. „sagte er“ bleibt näher am schlichten griechischen Ausdruck als das stärker deutende „antwortete er“.
