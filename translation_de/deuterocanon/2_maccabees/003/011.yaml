revisions:
- from: Ein Teil gehörte auch Hyrkanus, dem Sohn des Tobias, einem Mann in sehr angesehener Stellung. So weit waren die Verleumdungen des gottlosen Simon allerdings nicht von der Wahrheit entfernt. Insgesamt waren es vierhundert Talente Silber und zweihundert Talente Gold.[a]
  to: Ein Teil davon gehörte auch Hyrkanus, dem Sohn des Tobias, einem Mann von sehr hohem Rang. Der gottlose Simon verleumdete also nicht in diesem Maß. Insgesamt waren es vierhundert Talente Silber und zweihundert Talente Gold.[a]
  rationale: Die Revision wahrt die abgestufte Aussage von οὐχ οὕτως und erhält zugleich διαβάλλω als Vorwurf der Verleumdung. Außerdem wird der Bezug von „Ein Teil“ durch „davon“ klarer markiert. Die Fußnote zur im Griechischen elliptischen Goldsumme bleibt erforderlich und korrekt.
