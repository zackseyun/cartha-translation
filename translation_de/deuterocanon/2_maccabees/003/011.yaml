review_pass:
  verdict: revise
  source_fidelity: Der Entwurf gibt die Besitzzuordnung, Hyrkanus’ Patronym, seinen hohen sozialen Rang sowie die beiden Geldsummen grundsätzlich zutreffend wieder. Die Umschreibung „nicht von der Wahrheit entfernt“ schwächt jedoch διαβάλλων („verleumden/verleumderisch darstellen“) zu stark ab und ersetzt die Aussage über Simons verleumderisches Reden durch eine Aussage über den Wahrheitsgehalt.
  naturalness: „Ein Teil davon gehörte Hyrkanus“ und „ein Mann von sehr hohem Rang“ sind idiomatisches modernes Standarddeutsch. „Der gottlose Simon verleumdete also nicht in diesem Maß“ ist natürlicher und näher am griechischen Verb als die vorliegende abstrakte Formulierung über die Entfernung von der Wahrheit.
  terminology: „gottlos“ gibt δυσσεβής angemessen wieder. „Talente Silber/Gold“ ist als Gewichts- bzw. Geldangabe sachgerecht. Die Ergänzung von „Talente“ bei Gold ist im Deutschen sinnvoll und durch die Fußnote transparent gemacht.
  issues:
  - severity: medium
    issue: Die Wiedergabe von οὐχ οὕτως διαβάλλων als „So weit waren die Verleumdungen ... nicht von der Wahrheit entfernt“ paraphrasiert das Verb διαβάλλω weg.
    rationale: Das Griechische bezeichnet Simon weiterhin ausdrücklich als verleumderisch Handelnden, nur nicht „in diesem Maß“ bzw. „so sehr“. Die deutsche Formulierung verlagert den Akzent auf einen Wahrheitsabstand und kann den Vorwurf der Verleumdung abschwächen.
  - severity: low
    issue: „Ein Teil gehörte auch Hyrkanus“ bleibt ohne ausdrücklichen Rückbezug etwas abrupt.
    rationale: „Ein Teil davon“ macht klar, dass sich τινά auf einen Teil der zuvor genannten hinterlegten Gelder bezieht, ohne den Sinn zu verändern.
