  yaml_path: translation/deuterocanon/2_maccabees/003/011.yaml
  text: and some also belonging to Hyrcanus son of Tobias[a], a man of very high position. The ungodly Simon was not slandering to that extent. Altogether there were four hundred talents of silver and two hundred of gold.
translation:
  language: de
  text: Ein Teil davon gehörte auch Hyrkanus, dem Sohn des Tobias, einem Mann von sehr hohem Rang. Der gottlose Simon verleumdete also nicht in diesem Maß. Insgesamt waren es vierhundert Talente Silber und zweihundert Talente Gold.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich steht im Griechischen beim Gold nur „zweihundert“; „Talente“ ist aus der vorausgehenden Angabe zu ergänzen.
    reason: Die griechische Ellipse wird für klares Deutsch im Haupttext aufgelöst und hier kenntlich gemacht.
lexical_decisions:
- source_word: τινὰ δὲ καὶ Ὑρκανοῦ τοῦ Τωβίου
  choice: Ein Teil gehörte auch Hyrkanus, dem Sohn des Tobias
  rationale: τινά bezeichnet einen nicht näher bestimmten Teil der zuvor erwähnten Einlagen; der Genitiv wird im Deutschen natürlich als Zugehörigkeit ausgedrückt. τοῦ Τωβίου ist als Patronymikon verstanden.
- source_word: σφόδρα ἀνδρὸς ἐν ὑπεροχῇ κειμένου
  choice: einem Mann in sehr angesehener Stellung
  rationale: Die Wendung bezeichnet gesellschaftliche Hervorgehobenheit oder Rang; „angesehene Stellung“ ist natürliches modernes Deutsch und σφόδρα wird durch „sehr“ wiedergegeben.
- source_word: οὐχ οὕτως διαβάλλων
  choice: So weit waren die Verleumdungen … allerdings nicht von der Wahrheit entfernt
  rationale: διαβάλλω bezeichnet verleumderisches beziehungsweise irreführendes Reden. Im Zusammenhang räumt der Erzähler ein, dass Simons Darstellung trotz ihrer Bosheit einen tatsächlichen Bestand an Geldern zum Anlass hatte. Die deutsche Fassung bewahrt die abgestufte Verneinung οὐχ οὕτως.
- source_word: ὁ δυσσεβὴς Σίμων
  choice: der gottlose Simon
  rationale: δυσσεβής enthält ein religiös-moralisches Werturteil; „gottlos“ bewahrt diese Aussage ohne zusätzliche konfessionelle Deutung.
- source_word: τὰ δὲ πάντα
  choice: Insgesamt waren es
  rationale: Die Wendung leitet die Gesamtsumme ein und wird als übliche deutsche Abrechnungsformel wiedergegeben.
- source_word: ἀργυρίου τετρακόσια τάλαντα
  choice: vierhundert Talente Silber
  rationale: Die Maßeinheit und das Material werden vollständig und in natürlicher deutscher Wortfolge wiedergegeben.
- source_word: χρυσίου δὲ διακόσια
  choice: zweihundert Talente Gold
  rationale: „Talente“ steht im Griechischen nur beim Silber, ist beim Gold jedoch aus der parallelen Konstruktion zu ergänzen; die Ergänzung dient der Klarheit und wird in einer Fußnote offengelegt.
theological_decisions:
- issue: Moralische Charakterisierung Simons durch δυσσεβής
  choice: der gottlose Simon
  alternative: der frevlerische Simon; der ruchlose Simon
  rationale: „Gottlos“ erhält den religiös-moralischen Gehalt des griechischen Ausdrucks in verständlichem Gegenwartsdeutsch, ohne darüber hinausgehende Lehraussagen einzutragen.
- issue: Bedeutung von οὐχ οὕτως διαβάλλων
  choice: So weit waren die Verleumdungen … allerdings nicht von der Wahrheit entfernt
  alternative: Der gottlose Simon verleumdete sie nicht in diesem Ausmaß
  rationale: 'Die gewählte Formulierung wahrt die Spannung: Simon wird ausdrücklich als Verleumder bewertet, doch die genannte Höhe der tatsächlich vorhandenen Gelder zeigt, dass seine Behauptung nicht völlig grundlos war. Der griechische Ausdruck bleibt semantisch schwierig; die Alternative ist formaler, im Deutschen aber undeutlich.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzfolge bleibt nah am Griechischen, während Zugehörigkeit, gesellschaftlicher Rang und die elliptische Mengenangabe idiomatisch ausgedrückt werden.
