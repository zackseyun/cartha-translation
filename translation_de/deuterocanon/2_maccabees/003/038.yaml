base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/003/038.yaml
  text: If you have any enemy or one plotting against your affairs[a], send him there[b], and you will receive him back flogged—if indeed he even survives—because there truly is some power of God about the place.
translation:
  language: de
  text: Wenn du einen Feind hast oder jemanden, der gegen deine Interessen Ränke schmiedet[a], dann schick ihn dorthin. Du wirst ihn ausgepeitscht zurückerhalten – falls er überhaupt überlebt[b] –, denn diesen Ort umgibt wahrhaftig eine gewisse Kraft Gottes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »jemanden, der gegen deine Angelegenheiten intrigiert«.'
    reason: lexical_alternative
  - marker: b
    text: 'Das Griechische betont den Zweifel: Gemeint ist, ob er überhaupt heil davonkommt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πολέμιον
  choice: Feind
  rationale: Die substantivische Form bezeichnet hier einen persönlichen Gegner; »Feind« ist die klare und natürliche deutsche Entsprechung.
- source_word: πραγμάτων ἐπίβουλον
  choice: jemanden, der gegen deine Interessen Ränke schmiedet
  rationale: ἐπίβουλος bezeichnet einen Menschen, der Anschläge plant oder intrigiert; πράγματα meint hier die Angelegenheiten beziehungsweise Interessen des Angeredeten. Die Formulierung bleibt bewusst breit.
- source_word: πέμψον αὐτὸν ἐκεῖ
  choice: schick ihn dorthin
  rationale: Der schlichte Imperativ wird in natürlichem modernem Deutsch wiedergegeben.
- source_word: μεμαστιγωμένον
  choice: ausgepeitscht
  rationale: Das Perfektpassiv-Partizip bezeichnet eine bereits vollzogene schwere Züchtigung. »Ausgepeitscht« bewahrt diese Härte.
- source_word: προσδέξῃ
  choice: du wirst ihn … zurückerhalten
  rationale: Im Zusammenhang ist die Rückkehr des zuvor Fortgeschickten vorausgesetzt; »zurückerhalten« drückt dies knapp und idiomatisch aus.
- source_word: ἐάνπερ καὶ διασωθῇ
  choice: falls er überhaupt überlebt
  rationale: διασῴζω bedeutet hier, heil davonzukommen beziehungsweise zu überleben; ἐάνπερ καί verstärkt den zweifelnden, beinahe grimmig-ironischen Vorbehalt.
- source_word: περὶ τὸν τόπον
  choice: diesen Ort umgibt
  rationale: Die räumliche Beziehung von περί mit Akkusativ wird durch »umgibt« ausgedrückt, ohne sie auf ein bloßes »an diesem Ort« zu verengen.
- source_word: ἀληθῶς
  choice: wahrhaftig
  rationale: Das Adverb betont die tatsächliche Wirklichkeit der genannten Kraft; »wahrhaftig« ist würdig, verständlich und nachdrücklich.
- source_word: τινα θεοῦ δύναμιν
  choice: eine gewisse Kraft Gottes
  rationale: »Eine gewisse« bewahrt die unbestimmte Aussage von τινα; der Genitiv θεοῦ wird als »Gottes« wiedergegeben, ohne ihn zu »göttlich« abzuschwächen oder die Aussage stärker zu definieren.
theological_decisions:
- issue: Bezeichnung der mit dem Tempelort verbundenen θεοῦ δύναμις
  choice: eine gewisse Kraft Gottes
  alternative: Gottes Kraft
  rationale: Das unbestimmte τινα spricht von einer realen, aber nicht näher bestimmten Kraft Gottes. Die Übersetzung wahrt diese Zurückhaltung und macht daraus keine umfassendere dogmatische Aussage über Gottes Gegenwart.
- issue: Räumliche Beziehung der Kraft Gottes zum Ort
  choice: diesen Ort umgibt
  alternative: an diesem Ort wirkt
  rationale: Die gewählte Fassung erhält die räumliche Bildhaftigkeit von περὶ τὸν τόπον. Sie behauptet nicht genauer, auf welche Weise die Kraft Gottes dort gegenwärtig oder wirksam ist.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Der erste Satz bleibt direkt und leicht spöttisch-drohend; der Gedankenstrich hebt den düsteren Vorbehalt hervor. Die ungewöhnliche, räumliche Aussage über die Kraft Gottes wird bewusst nicht dogmatisch geglättet.
