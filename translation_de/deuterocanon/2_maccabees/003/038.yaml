  text: Εἴ τινα ἔχεις πολέμιον ἢ πραγμάτων ἐπίβουλον, πέμψον αὐτὸν ἐκεῖ, καὶ μεμαστιγωμένον αὐτὸν προσδέξῃ, ἐάνπερ καὶ διασωθῇ, διὰ τὸ περὶ τὸν τόπον ἀληθῶς εἶναί τινα θεοῦ δύναμιν.
