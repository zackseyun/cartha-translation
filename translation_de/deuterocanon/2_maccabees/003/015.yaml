base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/003/015.yaml
  text: But the priests[a], having thrown themselves down before the altar in their priestly robes, were calling out to heaven to the one who had given the law concerning deposits[b], that he should keep these things safe for those who had deposited them.
translation:
  language: de
  text: Die Priester aber warfen sich in ihren priesterlichen Gewändern vor dem Altar nieder und riefen zum Himmel[a] und baten den, der das Gesetz über anvertraute Güter erlassen hatte, diese Güter für diejenigen, die sie anvertraut hatten, unversehrt zu bewahren.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: »Zum Himmel« ist hier eine ehrfürchtige Umschreibung für den Ruf zu Gott.
    reason: lexical_alternative
  - marker: b
    text: Gemeint ist Eigentum, das dem Tempel zur sicheren Verwahrung anvertraut worden war.
    reason: cultural_note
lexical_decisions:
- source_word: ῥίψαντες ἑαυτούς
  choice: warfen sich ... nieder
  rationale: Die Wendung bewahrt die anschauliche, körperliche Kraft von ῥίπτω und klingt zugleich in modernem Deutsch natürlich.
- source_word: ἐν ταῖς ἱερατικαῖς στολαῖς
  choice: in ihren priesterlichen Gewändern
  rationale: Diese Wiedergabe bezeichnet die Amtskleidung klar und würdig, ohne altertümliche kirchliche Fachsprache zu verwenden.
- source_word: ἐπεκαλοῦντο εἰς οὐρανόν
  choice: riefen zum Himmel zu dem
  rationale: Das Imperfekt wird als andauernder, dringlicher Ruf wiedergegeben. »Zum Himmel« erhält die ehrfürchtige Umschreibung des griechischen Textes, statt sie ausdrücklich durch »zu Gott« zu ersetzen.
- source_word: τὸν περὶ παρακαταθήκης νομοθετήσαντα
  choice: der das Gesetz über anvertrautes Gut erlassen hatte
  rationale: »Das Gesetz erlassen« bewahrt den rechtlichen Gehalt von νομοθετέω; »anvertrautes Gut« verdeutlicht, dass es um zur sicheren Verwahrung überlassenes Eigentum geht.
- source_word: τοῖς παρακαταθεμένοις
  choice: für diejenigen, die sie anvertraut hatten
  rationale: Die Formulierung bezeichnet die Eigentümer beziehungsweise Hinterleger und hält durch »anvertraut« die sprachliche Verbindung zu παρακαταθήκη aufrecht.
- source_word: ταῦτα σῶα διαφυλάξαι
  choice: diese Güter ... unversehrt bewahren
  rationale: »Unversehrt bewahren« gibt sowohl den Zustand σῶα als auch den schützenden Sinn von διαφυλάσσω wieder.
theological_decisions:
- issue: Ehrfürchtige Umschreibung im Gebet
  choice: zum Himmel
  alternative: zu Gott; zum Herrn im Himmel
  rationale: Der griechische Text nennt ausdrücklich den Himmel. Die Übersetzung erhält diese ehrfürchtige Umschreibung und macht den Gottesbezug nicht ausdrücklicher, als es die Vorlage tut.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die lebhafte Körperbewegung der Priester und der rechtliche Wortschatz des Satzes bleiben erhalten; die etwas feierliche Satzführung entspricht der Gebetsszene, ohne unnötig altertümlich zu wirken.
