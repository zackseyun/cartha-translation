base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/003/005.yaml
  text: And since he was unable to overcome Onias[a], he went to Apollonius son of Thrasaeus[b], who at that time was governor of Coele-Syria and Phoenicia.
translation:
  language: de
  text: Da er sich gegen Onias nicht durchsetzen konnte, ging er zu Apollonius, dem Sohn des Thrasäus[a], der zu jener Zeit Statthalter[b] von Koilesyrien und Phönizien war.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Genitiv kann als Vatersname verstanden werden: „Sohn des Thrasäus“; möglich ist auch, Thrasäus als Beiname oder nähere Namensangabe zu lesen.'
    reason: lexical_alternative
  - marker: b
    text: Das griechische Wort kann sowohl „Feldherr“ als auch „Statthalter“ bedeuten. Hier spricht das genannte Zuständigkeitsgebiet für „Statthalter“.
    reason: lexical_alternative
lexical_decisions:
- source_word: νικήσαι
  choice: sich gegen … durchsetzen
  rationale: Das Verb bezeichnet hier, gegenüber Onias die Oberhand zu gewinnen. Die Formulierung ist im Deutschen natürlich und legt den Konflikt nicht unnötig auf eine militärische Niederlage fest.
- source_word: μὴ δυνάμενος
  choice: Da er … nicht … konnte
  rationale: Das Partizip nennt hier den Grund für die anschließende Handlung; ein kausaler Nebensatz gibt diesen Zusammenhang im Deutschen klar wieder.
- source_word: ἦλθεν πρὸς
  choice: ging er zu
  rationale: Die Wendung beschreibt die Bewegung hin zu Apollonius. „Ging zu“ ist erzählerisch natürlich, ohne eine nicht ausdrücklich genannte förmliche Vorsprache einzutragen.
- source_word: Ἀπολλώνιον Θρασαίου
  choice: Apollonius, dem Sohn des Thrasäus
  rationale: Der Genitiv Θρασαίου wird im Kontext am natürlichsten als Vatersname verstanden. Die deutsche Form „Thrasäus“ folgt der üblichen Wiedergabe griechisch-lateinischer Personennamen.
- source_word: τὸν … στρατηγόν
  choice: der … Statthalter … war
  rationale: στρατηγός kann einen militärischen Befehlshaber oder einen regionalen Amtsträger bezeichnen. Wegen des ausdrücklich genannten Zuständigkeitsgebiets passt „Statthalter“ im Kontext am besten; die Mehrdeutigkeit wird in einer Fußnote bewahrt.
- source_word: κατʼ ἐκεῖνον τὸν καιρόν
  choice: zu jener Zeit
  rationale: Die Formulierung gibt die zeitliche Einordnung knapp und in würdigem Erzählstil wieder.
- source_word: Κοίλης Συρίας καὶ Φοινίκης
  choice: Koilesyrien und Phönizien
  rationale: „Koilesyrien“ ist die etablierte deutsche Bezeichnung der historischen Region; eine wörtliche Übersetzung würde den geografischen Namen verdunkeln.
