  text: And he[a], because of the divine power, lay speechless and deprived of all hope and salvation;
translation:
  language: de
  text: Und er lag infolge des göttlichen Wirkens sprachlos da, aller Hoffnung und Rettung[a] beraubt;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Heil“. Das griechische Wort kann je nach Zusammenhang Rettung, Befreiung oder Heil bezeichnen.'
    reason: lexikalische Bedeutungsbreite
lexical_decisions:
- source_word: θείαν ἐνέργειαν
  choice: das göttliche Wirken
  rationale: ἐνέργεια bezeichnet wirksames Handeln bzw. eine sich auswirkende Kraft. „Göttliches Wirken“ bewahrt sowohl den tätigen als auch den machtvollen Sinn des griechischen Ausdrucks.
- source_word: ἄφωνος
  choice: sprachlos
  rationale: ἄφωνος bedeutet hier, dass Heliodor keine Stimme hatte beziehungsweise nicht sprechen konnte. „Sprachlos“ ist im Deutschen natürlich und bezeichnet in diesem Zusammenhang klar seinen körperlichen Zustand.
- source_word: πάσης ἐστερημένος ἐλπίδος καὶ σωτηρίας
  choice: aller Hoffnung und Rettung beraubt
  rationale: ἐστερημένος drückt einen Zustand des Beraubtseins aus. σωτηρία bezeichnet in der unmittelbaren Gefahr vor allem Rettung, kann aber auch umfassender als Heil verstanden werden.
- source_word: ἔρριπτο
  choice: lag … da
  rationale: Die Form beschreibt den andauernden Zustand des Niedergestreckten. „Lag … da“ gibt dies in natürlichem Deutsch wieder, ohne ein im Griechischen nicht ausdrücklich genanntes handelndes Subjekt einzuführen.
theological_decisions:
- issue: Wiedergabe von σωτηρία im Kontext unmittelbarer Lebensgefahr
  choice: Rettung
  alternative: Heil
  rationale: Der Erzählzusammenhang meint zunächst die Aussicht auf Rettung aus Heliodors körperlicher Not. Die mögliche weiterreichende Bedeutung „Heil“ wird in der Fußnote offengehalten, ohne dem Vers eine bestimmte dogmatische Deutung aufzuzwingen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Stellung „aller Hoffnung und Rettung beraubt“ erhält die feierliche Schwere des griechischen Satzes; das abschließende Semikolon bewahrt seinen Anschluss an den folgenden Vers.
