revisions:
- from: Als er nun mit seinen Wächtern[a] dort bereits vor der Schatzkammer stand, ließ der Herrscher über die Geister und über alle Macht eine gewaltige Erscheinung[b] geschehen. Da wurden alle, die es gewagt hatten, dorthin zu kommen[c], von Gottes Macht überwältigt und verfielen in Kraftlosigkeit und Furcht.
  to: Als er nun dort mit seinen Wächtern[a] bereits bei der Schatzkammer angekommen war, bewirkte der Gebieter über die Geister und über alle Gewalt eine gewaltige Erscheinung[b], sodass alle, die es gewagt hatten, dorthin zu kommen[c], von Gottes Macht überwältigt wurden und in Kraftlosigkeit und Furcht verfielen.
  rationale: Die Ortsangabe wurde quellennäher und ohne unnötige Präzisierung gefasst. Der göttliche Titel wurde leicht angepasst, um die Herrschafts- und Vollmachtsnuance des Griechischen klarer wiederzugeben. Die Fußnotenanker a, b und c bleiben jeweils an der einschlägigen Textstelle; die Fußnote zu „Erscheinung“ vermeidet die zu enge Aussage eines ausdrücklich sichtbaren Werdens.
