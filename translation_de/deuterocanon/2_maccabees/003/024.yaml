base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/003/024.yaml
  text: But when he had already arrived there with the guards at the treasury[a], the Sovereign of spirits and of all authority made a great manifestation, so that all who had dared to come in, struck with awe at the power of God[c][b], were turned to weakness and fear.
translation:
  language: de
  text: Als er nun dort mit seinen Wächtern[a] bereits bei der Schatzkammer angekommen war, bewirkte der Gebieter über die Geister und über alle Gewalt eine gewaltige Erscheinung[b], sodass alle, die es gewagt hatten, dorthin zu kommen[c], von Gottes Macht überwältigt wurden und in Kraftlosigkeit und Furcht verfielen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Speerträger“; gemeint ist seine bewaffnete Begleitung.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „bewirkte ein großes Erscheinen“ oder „machte eine große Erscheinung“. Das Griechische betont eine eindrucksvolle göttliche Manifestation.'
    reason: lexical_alternative
  - marker: c
    text: Das griechische Wort kann auch „zusammenzukommen“ bedeuten; im Zusammenhang ist das Kommen zur Schatzkammer gemeint.
    reason: alternative_reading
lexical_decisions:
- source_word: αὐτόθι
  choice: dort
  rationale: Das Ortsadverb verweist natürlich auf den zuvor genannten Ort.
- source_word: δορυφόροις
  choice: Wächtern
  rationale: Wörtlich sind es Speerträger; im Zusammenhang bezeichnet das Wort die bewaffnete Begleitung.
- source_word: κατὰ τὸ γαζοφυλάκιον
  choice: vor der Schatzkammer
  rationale: κατά mit Akkusativ bezeichnet hier die Lage beim beziehungsweise vor dem Schatzhaus; „Schatzkammer“ ist im Deutschen konkret und geläufig.
- source_word: ὁ τῶν πνευμάτων καὶ πάσης ἐξουσίας δυνάστης
  choice: der Herrscher über die Geister und über alle Macht
  rationale: „Herrscher“ gibt δυνάστης wieder, ohne es mit κύριος gleichzusetzen. „Macht“ wahrt hier die umfassende Bedeutung von ἐξουσία als Macht- und Verfügungsgewalt.
- source_word: ἐπιφάνειαν μεγάλην ἐποίησεν
  choice: ließ eine gewaltige Erscheinung geschehen
  rationale: Die Formulierung bewahrt den Charakter eines eindrucksvollen göttlichen Erscheinens und bleibt zugleich verständlich.
- source_word: κατατολμήσαντας συνελθεῖν
  choice: die es gewagt hatten, dorthin zu kommen
  rationale: Die Wiedergabe erhält das Moment des vermessenen Wagnisses und lässt die mögliche Bedeutung von συνελθεῖν als Kommen beziehungsweise Zusammenkommen offen.
- source_word: καταπλαγέντας τὴν τοῦ θεοῦ δύναμιν
  choice: von Gottes Macht überwältigt
  rationale: καταπλήσσω bezeichnet ein heftiges Erschrecken oder Erschüttertwerden; „überwältigt“ vermittelt die Wirkung der göttlichen Macht, ohne bloße Verwunderung anzunehmen.
- source_word: εἰς ἔκλυσιν καὶ δειλίαν τραπῆναι
  choice: verfielen in Kraftlosigkeit und Furcht
  rationale: Die Wendung beschreibt den Eintritt in einen Zustand körperlicher Entkräftung und angstvoller Mutlosigkeit.
theological_decisions:
- issue: Göttlicher Titel ὁ τῶν πνευμάτων καὶ πάσης ἐξουσίας δυνάστης
  choice: der Herrscher über die Geister und über alle Macht
  alternative: der Gebieter über die Geister und über jede Vollmacht
  rationale: Die gewählte Fassung betont Gottes uneingeschränkte Herrschaft über geistige Wesen und alle Machtbereiche, ohne δυνάστης durch den nicht vorliegenden Titel „Herr“ wiederzugeben.
- issue: Art der göttlichen ἐπιφάνεια
  choice: eine gewaltige Erscheinung
  alternative: eine gewaltige Offenbarung seiner Gegenwart
  rationale: „Erscheinung“ hält offen, in welcher konkreten Weise Gott sich sichtbar beziehungsweise wirksam zeigt, und vermeidet eine dogmatische Präzisierung.
translation_notes:
  register: Moderne, würdevolle Erzählsprache. Der lange griechische Satz wurde zur besseren Verständlichkeit in zwei Sätze gegliedert. Die göttlichen Titel und die Mehrdeutigkeit von συνελθεῖν bleiben erkennbar; konfessionell geprägte Terminologie wird vermieden.
