base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/003/012.yaml
  text: and that to wrong those who had trusted in the holiness of the place[a], and in the majesty and inviolability of the temple honored throughout the whole world, was utterly impossible.
translation:
  language: de
  text: und dass es völlig unmöglich sei, denen Unrecht zu tun, die auf die Heiligkeit des Ortes sowie auf die Würde und Unverletzlichkeit[a] des in der ganzen Welt hoch geehrten Tempels vertraut hatten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: das Asylrecht beziehungsweise der geschützte Asylstatus des Tempels.'
    reason: 'Lexikalische Alternative: ἀσυλία kann neben allgemeiner Unverletzlichkeit besonders den rechtlich geschützten Asylstatus eines Heiligtums bezeichnen.'
lexical_decisions:
- source_word: ἀδικήσαί
  choice: Unrecht zu tun
  rationale: Das Verb bezeichnet hier ungerechtes Handeln gegen Menschen. „Unrecht tun“ bewahrt den moralischen und rechtlichen Gehalt, ohne eine bloß körperliche Schädigung nahezulegen.
- source_word: τοὺς πεπιστευκότας
  choice: die … vertraut hatten
  rationale: Das Perfektpartizip bezeichnet ein bereits gefasstes, fortwirkendes Vertrauen. Die Formulierung passt zu den folgenden Dativobjekten und vermeidet eine unnötig lehrhafte Färbung von „glauben“.
- source_word: ἁγιωσύνῃ
  choice: Heiligkeit
  rationale: Das Substantiv bezeichnet die Heiligkeit beziehungsweise den geheiligten Charakter des Ortes; „Heiligkeit“ gibt dies direkt und würdig wieder.
- source_word: σεμνότητι
  choice: Würde
  rationale: Gemeint ist die ehrfurchtgebietende, erhabene Würde des Tempels. „Würde“ ist im Deutschen natürlich und gibt den abstrakten Charakter des griechischen Ausdrucks gut wieder.
- source_word: ἀσυλίᾳ
  choice: Unverletzlichkeit
  rationale: Der Ausdruck bezeichnet den geschützten Status gegen Zugriff oder Entweihung und kann besonders das Asylrecht einschließen. „Unverletzlichkeit“ hält den Sinn im Haupttext bewusst weiter; die engere rechtliche Nuance steht in der Fußnote.
- source_word: τετιμημένου
  choice: hoch geehrt wurde
  rationale: Das Perfekt Passiv beschreibt den Tempel als dauerhaft anerkannt und geehrt. „hoch geehrt“ vermittelt die besondere Wertschätzung natürlich.
- source_word: κατὰ τὸν σύμπαντα κόσμον
  choice: in der ganzen Welt
  rationale: Die Formulierung bewahrt die rhetorisch universale Reichweite des griechischen Ausdrucks in idiomatischem Deutsch.
- source_word: παντελῶς ἀμήχανον εἶναι
  choice: völlig unmöglich sei
  rationale: „Völlig“ gibt die Verstärkung durch παντελῶς wieder; der Konjunktiv „sei“ passt zur abhängigen Aussage im fortlaufenden Satzgefüge.
theological_decisions:
- issue: Ob ἀσυλίᾳ ausdrücklich mit Asylsprache wiederzugeben ist
  choice: Unverletzlichkeit
  alternative: Asylrecht oder geschützte Asylstellung
  rationale: Das Wort kann den besonderen Asylstatus eines Heiligtums bezeichnen, umfasst im Zusammenhang aber auch allgemein dessen rechtlich-sakrale Immunität. „Unverletzlichkeit“ wahrt diese Bedeutungsbreite, während die Fußnote die engere Asylnuance transparent macht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzform bleibt wegen des einleitenden griechischen τε als Fortsetzung mit „und dass“ fragmentarisch an den Kontext angebunden. „Sowie“ macht die Gliederung zwischen der Heiligkeit des Ortes und den beiden Eigenschaften des Tempels klar, ohne die griechische Koordination umzudeuten.
