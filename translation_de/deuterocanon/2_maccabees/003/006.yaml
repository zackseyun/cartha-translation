base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/003/006.yaml
  text: And he reported that the treasury in Jerusalem was full of immense sums of money[a], so that the quantity of the separate funds was beyond counting, and that they were not connected with the account of the sacrifices[c][b], but that it was possible for these things to fall under the king’s authority.
translation:
  language: de
  text: Und er berichtete, die Schatzkammer in Jerusalem sei mit unermesslichen Geldsummen gefüllt, sodass die Menge der verschiedenen Geldbestände[a] unzählbar sei. Diese gehörten nicht zur Abrechnung für die Opfer[b]; es sei jedoch möglich, dass dieses Vermögen unter die Verfügungsgewalt des Königs falle.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Menge der verschiedenen Einlagen“. Der griechische Ausdruck kann unterschiedliche, der Schatzkammer anvertraute Geldsummen bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Gemeint ist, dass diese Gelder nicht zur regulären Abrechnung oder zu den Ausgaben für die Opfer gehörten.
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich näher: „unter die Macht des Königs fallen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσήγγειλεν
  choice: berichtete
  rationale: Das Verb bezeichnet das Überbringen einer Nachricht oder Meldung; „berichtete“ passt natürlich zum erzählerischen Zusammenhang.
- source_word: χρημάτων ἀμυθήτων
  choice: unermessliche Geldsummen
  rationale: χρήματα bezeichnet hier Geld oder Vermögen, während ἀμύθητος die kaum erfassbare Größe hervorhebt.
- source_word: γαζοφυλάκιον
  choice: Schatzkammer
  rationale: Der Ausdruck bezeichnet einen Aufbewahrungsort für Geld und Wertgegenstände; „Schatzkammer“ ist im Tempelkontext präzise und verständlich.
- source_word: τὸ πλῆθος τῶν διαφόρων
  choice: die Menge der verschiedenen Geldbestände
  rationale: διαφόρων kann unterschiedliche, gesondert verwahrte Geldbestände oder Einlagen bezeichnen. Die Übersetzung erhält diese Mehrzahl verschiedener Bestände, ohne ihre genaue Rechtsnatur festzulegen.
- source_word: ἀναρίθμητον
  choice: unzählbar
  rationale: Das Wort bedeutet „nicht zu zählen“ und bewahrt hier die starke, möglicherweise hyperbolische Aussage.
- source_word: μὴ προσήκειν αὐτὰ πρὸς τὸν τῶν θυσιῶν λόγον
  choice: Diese gehörten nicht zur Abrechnung für die Opfer
  rationale: προσήκειν drückt Zugehörigkeit oder sachlichen Bezug aus; λόγος kann hier Rechnung, Abrechnung oder Verwaltungsbereich bedeuten. Die Formulierung unterscheidet die Gelder von der Opferabrechnung, ohne ihnen jede sakrale Beziehung abzusprechen.
- source_word: ὑπὸ τὴν τοῦ βασιλέως ἐξουσίαν πεσεῖν
  choice: unter die Verfügungsgewalt des Königs fallen
  rationale: Die Wendung bezeichnet das Gelangen unter die Macht, Zuständigkeit oder Kontrolle des Königs. „Verfügungsgewalt“ gibt den finanziell-politischen Zusammenhang klar wieder.
- source_word: ταῦτα
  choice: dieses Vermögen
  rationale: Das Pronomen verweist auf die zuvor genannten Gelder. „Dieses Vermögen“ macht den Bezug im Deutschen eindeutig, ohne neue Sachinformation hinzuzufügen.
theological_decisions:
- issue: Art und Status der beschriebenen Tempelgelder
  choice: Die Gelder werden von der Abrechnung für die Opfer unterschieden.
  alternative: Die Gelder waren vollständig weltliche Privateinlagen oder durften deshalb rechtmäßig vom König eingezogen werden.
  rationale: Der griechische Text sagt lediglich, dass sie nicht zum λόγος der Opfer gehörten. Er erklärt weder ausdrücklich, dass sie keinerlei sakralen Bezug hatten, noch dass eine königliche Beschlagnahme rechtmäßig wäre.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Konjunktiv I kennzeichnet den Inhalt der Meldung. Die Aufteilung in zwei Sätze verbessert die Verständlichkeit, ohne die logischen Beziehungen des griechischen Satzes zu verändern.
