  text: Pitiful indeed was the complete prostration of the crowd[a], and the expectation of the high priest[b], who was in great agony—
translation:
  language: de
  text: Erbarmungswürdig war das allgemeine Niederfallen der Menge[a] und die Erwartung[b] des Hohen Priesters, der in großer Angst war –
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort kann ein Vorwärtsfallen, Niederfallen oder Sich-Niederwerfen bezeichnen. Es bleibt offen, ob vor allem eine körperliche Geste, ein Zusammenbruch oder beides gemeint ist.
    reason: lexical_alternative
  - marker: b
    text: Die vorgelegte griechische Textzeile bricht nach προσδο- ab. Die Übersetzung gibt daher nur den erkennbaren Erwartungssinn wieder; die genaue Wortform und der weitere Satzlaut sind in der Vorlage nicht erhalten.
    reason: textual_variant
lexical_decisions:
- source_word: ἐλεεινή
  choice: Ein beklagenswerter Anblick war es
  rationale: Das prädikative, verblose Adjektiv bezeichnet etwas Erbarmungswürdiges oder Jammervolles. Die idiomatische Formulierung bewahrt die starke emotionale Wertung.
- source_word: τοῦ πλήθους
  choice: die ganze Menschenmenge
  rationale: πλῆθος bezeichnet hier die versammelte Menge. »Menschenmenge« ist im modernen Deutsch anschaulich und eindeutig.
- source_word: παμμιγῆ
  choice: ganze
  rationale: Im Zusammenhang verstärkt das Adjektiv die umfassende Beteiligung der Menge. »Die ganze« gibt diesen Gesamtsinn natürlich wieder, ohne eine genaue Art der Zusammensetzung der Menge festzulegen.
- source_word: πρόπτωσιν
  choice: sich zu Boden warf
  rationale: πρόπτωσις bezeichnet ein Vorwärts- oder Niederfallen beziehungsweise eine Niederwerfung. Die verbale Wiedergabe ist im Deutschen natürlich und lässt sowohl die körperliche Bewegung als auch die demütige oder verzweifelte Gebärde erkennen.
- source_word: τοῦ μεγάλως ἀγωνιῶντος ἀρχιερέως
  choice: der Hohe Priester, von großer Angst erfüllt
  rationale: ἀγωνιάω bezeichnet heftige innere Angst oder Qual; μεγάλως verstärkt sie. Die Formulierung gibt die Intensität des Partizips würdevoll und verständlich wieder.
- source_word: προσδο-
  choice: das Kommende erwartete
  rationale: Der sichtbare Wortanfang weist wahrscheinlich auf eine Form aus der Wortfamilie προσδοκάω/προσδοκία hin. Wegen des Zeilenabbruchs wird der Erwartungssinn vorsichtig im Kontext ausgedrückt und die Unsicherheit in einer Fußnote offengelegt.
