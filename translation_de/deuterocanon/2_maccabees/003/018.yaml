translation:
  language: de
  text: Die Menschen stürzten in Scharen aus den Häusern, um zu einem öffentlichen Flehen zusammenzukommen, denn der Ort stand kurz davor, in Verachtung zu geraten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint ist der Tempelbereich; im Griechischen steht lediglich »der Ort«.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ ἐκ τῶν οἰκιῶν
  choice: Die Menschen ... aus den Häusern
  rationale: Die substantivierte Wendung bezeichnet kollektiv die Bewohner, die aus den Häusern kommen. »Die Menschen« ist im Deutschen natürlich; ein nicht ausdrücklich vorhandenes Possessivpronomen wird vermieden.
- source_word: ἀγεληδὸν
  choice: in Scharen
  rationale: Das Adverb beschreibt eine massenhafte, gruppenweise Bewegung. »In Scharen« bewahrt das lebhafte Bild, ohne im Deutschen unangemessen animalisierend zu wirken.
- source_word: ἐξεπήδων
  choice: stürzten ... heraus
  rationale: Der Imperfekt schildert einen sich vollziehenden Vorgang; das lebhafte Verb bezeichnet ein Herausspringen oder eiliges Herausdrängen. »Stürzten ... heraus« gibt die Dringlichkeit idiomatisch wieder.
- source_word: ἐπὶ πανδήμῳ ἱκετείᾳ
  choice: um sich gemeinsam flehend an Gott zu wenden
  rationale: πανδήμῳ hebt die Beteiligung der ganzen Bevölkerung hervor, ἱκετεία eine inständige Bitte. Die Zielangabe »an Gott« ist im Gebetskontext sinngemäß, jedoch im Griechischen nicht ausdrücklich genannt.
- source_word: διὰ τὸ μὴ μέλλειν
  choice: denn ... war im Begriff
  rationale: Im Zusammenhang mit εἰς καταφρόνησιν ἔρχεσθαι drückt die Konstruktion die unmittelbar drohende Entwicklung aus. »War im Begriff« bewahrt diesen Aspekt.
- source_word: εἰς καταφρόνησιν ἔρχεσθαι
  choice: der Verachtung preisgegeben zu werden
  rationale: Die griechische Wendung bedeutet wörtlich, »in Verachtung zu kommen«. Die deutsche Fassung macht natürlich verständlich, dass dem Ort entehrende Behandlung droht, ohne die Aussage auf eine bestimmte Form der Entweihung einzuengen.
- source_word: τὸν τόπον
  choice: der Ort
  rationale: Die Übersetzung hält am allgemeinen Ausdruck τόπος fest. Aus dem Zusammenhang ist der Tempel beziehungsweise der Tempelbezirk gemeint; dies wird in der Fußnote erläutert.
theological_decisions:
- issue: Bezug von τὸν τόπον
  choice: der Ort, kontextuell der Tempel beziehungsweise Tempelbezirk
  alternative: das Heiligtum / der Tempel
  rationale: Der Zusammenhang bezeichnet eindeutig den Jerusalemer Tempel als bedrohten Ort, doch der griechische Text verwendet hier das allgemeinere τόπος. Der Haupttext bewahrt diese Ausdrucksweise und die Fußnote erklärt den Bezug.
- issue: Adressat der ἱκετεία
  choice: an Gott
  alternative: 'den Adressaten unausgesprochen lassen: »zu einem gemeinsamen Flehen«'
  rationale: Der Kontext legt ein gemeinsames Flehen zu Gott nahe. Die ausdrückliche Nennung erhöht die Verständlichkeit, ist jedoch eine kontextuelle Explikation und keine im Vers selbst stehende Bezeichnung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die dynamischen Verben »stürzten ... heraus« und die Wendung »in Scharen« erhalten die Dringlichkeit und Anschaulichkeit des griechischen Satzes. Die Fußnotenmarke steht unmittelbar nach der Aussage, die sie erläutert.
