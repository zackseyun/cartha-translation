  source_fidelity: Der Genitivus absolutus τοῦ δὲ ἀρχιερέως ὑποδείξαντος ist mit „Als aber der Hohe Priester darauf hinwies“ angemessen wiedergegeben. παρακαταθήκας wird sachgerecht als „hinterlegte Gelder“ gefasst. Die Genitive χηρῶν τε καὶ ὀρφανῶν bleiben im Haupttext als „von Witwen und Waisen“ erhalten; die Fußnote erläutert zutreffend die naheliegende possessive Deutung, ohne eine moderne Rechtskategorie einzutragen.
  naturalness: Der Satz ist für modernes, würdevolles Standarddeutsch natürlich. Die einleitende „Als aber“-Konstruktion ist als satzfragmentarischer Anschluss passend, da auch der vorgelegte griechische Textabschnitt mit einem Genitivus absolutus beginnt und seine Fortsetzung im folgenden Vers hat.
  terminology: „Hoher Priester“ ist die etablierte biblische Amtsbezeichnung. „hinterlegte Gelder“ vermittelt die Bedeutung von παρακαταθήκας verständlich und ohne unangemessene juristische Modernisierung. Die Fußnote ist klar formuliert und korrekt am Ausdruck „Witwen und Waisen“ verankert.
