lexical_decisions:
- source_word: τοῦ δὲ ἀρχιερέως
  choice: Als aber der Hohe Priester
  rationale: Der Genitivus absolutus gibt den begleitenden Umstand an; δέ markiert einen leichten Gegensatz beziehungsweise einen erzählerischen Übergang. „Als aber“ bildet beides natürlich ab.
- source_word: ὑποδείξαντος
  choice: darauf hinwies
  rationale: Das Aoristpartizip von ὑποδείκνυμι bedeutet hier, etwas anzuzeigen oder klarzustellen. „darauf hinwies“ ist im Deutschen idiomatisch und wahrt den sachlichen Ton.
- source_word: παρακαταθήκας
  choice: hinterlegte Gelder
  rationale: Das Wort bezeichnet zur Verwahrung anvertrautes Geld oder Gut. „hinterlegte Gelder“ ist im Kontext klarer als das mehrdeutige „Einlagen“ und vermeidet die modernen rechtlichen Konnotationen von „Treuhandvermögen“.
- source_word: εἶναι
  choice: dass es sich … handelte
  rationale: Der Infinitiv steht in indirekter Rede nach ὑποδείξαντος. Die deutsche Konstruktion „darauf hinwies, dass es sich … handelte“ gibt diese syntaktische Beziehung natürlich wieder.
- source_word: χηρῶν τε καὶ ὀρφανῶν
  choice: von Witwen und Waisen
  rationale: Die Genitive bezeichnen am wahrscheinlichsten die Eigentümer der hinterlegten Gelder. Im Haupttext bleibt die knappe Genitivfügung erhalten; die Fußnote erläutert den möglichen Sinn.
