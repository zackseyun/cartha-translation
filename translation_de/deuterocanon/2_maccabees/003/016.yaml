base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/003/016.yaml
  text: To see the appearance of the high priest was enough to wound the mind[b][a]; for his face and altered color made visible the agony in his soul.
translation:
  language: de
  text: Schon der Anblick des Hohepriesters musste das Gemüt verwunden[a]; denn sein Gesicht und seine veränderte Gesichtsfarbe ließen die Qual in seiner Seele[b] sichtbar werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „innerlich verletzen“ oder „zutiefst erschüttern“. Das griechische Verb für „verwunden“ wird hier bildlich für die Wirkung auf den Betrachter gebraucht.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „die Qual in Bezug auf die Seele“, das heißt eine innere, die Seele betreffende Qual.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν δὲ ὁρῶντα
  choice: Schon der Anblick ... musste
  rationale: Die elliptische griechische Konstruktion beschreibt allgemein die Wirkung auf jeden Betrachter. Die deutsche Fassung gibt diesen Sinn natürlich wieder, ohne einen bestimmten Beobachter einzuführen.
- source_word: τὴν τοῦ ἀρχιερέως ἰδέαν
  choice: der Anblick des Hohenpriesters
  rationale: ἰδέα bezeichnet hier die sichtbare Erscheinung. „Anblick“ passt zugleich zur Perspektive des Betrachters und vermeidet die im Deutschen mögliche Bedeutung von „Idee“.
- source_word: τιτρώσκεσθαι τὴν διάνοιαν
  choice: das Gemüt verwunden
  rationale: τιτρώσκω bezeichnet wörtlich das Verwunden und wird hier bildlich gebraucht. „Gemüt“ erfasst διάνοια als inneres Wahrnehmungs- und Empfindungsvermögen besser als das im Deutschen zu eng verstandesbezogene „Verstand“.
- source_word: ἡ ὄψις
  choice: sein Gesicht
  rationale: Im Zusammenhang mit der veränderten Gesichtsfarbe bezeichnet ὄψις den sichtbaren Gesichtsausdruck beziehungsweise das Antlitz.
- source_word: τῆς χρόας παρηλλαγμένον
  choice: seine veränderte Gesichtsfarbe
  rationale: χρόα meint die körperliche Farbe beziehungsweise den Teint, und παρηλλαγμένον deren Veränderung. Die Richtung der Veränderung bleibt wie im Griechischen offen.
- source_word: ἐνέφαινεν
  choice: ließen ... sichtbar werden
  rationale: Das Verb bezeichnet das Sichtbar- oder Erkennbarwerden von etwas Innerem durch äußere Zeichen.
- source_word: τὴν κατὰ ψυχὴν ἀγωνίαν
  choice: die Qual in seiner Seele
  rationale: ἀγωνία bezeichnet intensive innere Bedrängnis oder Qual. „In seiner Seele“ wahrt die anthropologische Sprache des griechischen Textes, ohne sie dogmatisch auszudeuten.
theological_decisions:
- issue: Anthropologische Bedeutung von ψυχή
  choice: Seele
  alternative: Innerstes; Inneres
  rationale: ψυχή bezeichnet hier das innere Leben des Hohenpriesters. „Seele“ erhält die theologische und sprachliche Resonanz des Ausgangstextes; der Kontext zeigt zugleich, dass von innerer Qual und nicht von einer ausgearbeiteten Anthropologie die Rede ist.
- issue: Metaphorische Verwundung des Betrachters
  choice: das Gemüt verwunden
  alternative: innerlich erschüttern; das Herz durchbohren
  rationale: Die körperliche Verwundungsmetapher des Verbs wird bewahrt, ohne „Herz“ einzuführen, das nicht dem griechischen διάνοια entspricht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die körperliche Verwundungsmetapher und „Seele“ bleiben erhalten; die elliptische Eröffnung wird in eine natürliche deutsche Aussage über die Wirkung des Anblicks überführt.
