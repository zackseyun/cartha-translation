base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/003/039.yaml
  text: For he himself[a], who has his dwelling in heaven, is the overseer and helper of that place[b], and he strikes and destroys those who come to do harm.
translation:
  language: de
  text: Denn er selbst, der seine Wohnung im Himmel hat,[a] wacht über jenen Ort[b] und steht ihm bei; und die, die kommen, um Schaden anzurichten, schlägt und vernichtet er.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »der eine himmlische Wohnstätte hat«; sinngemäß auch: »der im Himmel wohnt«.'
    reason: lexical_alternative
  - marker: b
    text: Gemeint ist der Tempel; im Griechischen steht wörtlich »jener Ort«.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατοικίαν ἐπουράνιον ἔχων
  choice: der seine Wohnung im Himmel hat
  rationale: Die partizipiale Wendung wird als natürlicher deutscher Relativsatz wiedergegeben. Sie bewahrt den Gedanken der himmlischen Wohnstätte, ohne das Griechische unnötig zu verengen.
- source_word: ἐπόπτης
  choice: wacht über
  rationale: Das Verb gibt die Funktion dessen, der Aufsicht führt und schützend achtgibt, in natürlichem Deutsch wieder. „Aufseher“ wäre zwar formal näher, klingt hier jedoch amtlich und weniger idiomatisch.
- source_word: βοηθός
  choice: steht ihm bei
  rationale: Die Wendung wahrt die Grundbedeutung des helfenden Beistands und vermeidet eine stärkere militärische Deutung wie „Verteidiger“.
- source_word: ἐκείνου τοῦ τόπου
  choice: jenen Ort
  rationale: Die Übersetzung folgt dem allgemeinen τόπος, statt den im Kontext gemeinten Tempel ausdrücklich in den Haupttext einzusetzen.
- source_word: τοὺς παραγινομένους ἐπὶ κακώσει
  choice: alle, die kommen, um Schaden anzurichten
  rationale: Die Formulierung gibt sowohl das Herankommen als auch die durch ἐπί mit Dativ ausgedrückte schädigende Absicht verständlich wieder.
- source_word: τύπτων ἀπόλλυσι
  choice: schlägt und vernichtet er
  rationale: Die beiden gewaltsamen Handlungen bleiben unterscheidbar. Die koordinierte deutsche Wiedergabe vermittelt den Sinn des Partizips mit dem finiten Verb klar und würdevoll.
theological_decisions:
- issue: Bezug von αὐτός
  choice: Das betonte „er selbst“ bleibt stehen; der Zusammenhang identifiziert den himmlischen Beschützer als Gott.
  alternative: Den Gottesnamen ausdrücklich ergänzen oder die Aussage als unbestimmte himmlische Macht verstehen.
  rationale: Das Griechische nennt an dieser Stelle keinen Gottesnamen. Die Übersetzung erhält daher die emphatische, aber kontextabhängige Bezeichnung und fügt keine ausdrückliche Identifikation in den Haupttext ein.
- issue: Bezug von ἐκείνου τοῦ τόπου
  choice: Im Haupttext steht „jener Ort“, mit einer Fußnote zum Tempel.
  alternative: Direkt „der Tempel“ oder „das Heiligtum“ übersetzen.
  rationale: Der Erzählzusammenhang weist eindeutig auf den Tempel, doch der griechische Wortlaut verwendet den allgemeineren Ausdruck „Ort“. Beides wird durch Haupttext und Fußnote sichtbar gehalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz wahrt die betonte Subjektstellung und die Härte der abschließenden Strafhandlung, vermeidet aber altertümliche Wörter wie „Heimsuchung“, „schmettern“ oder „zerschlagen“.
