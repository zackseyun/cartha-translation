  rationale: Die einzige Änderung im Haupttext entfernt das nicht ausdrücklich im Griechischen enthaltene »alle«. Die Fußnote a wird geringfügig präzisiert, damit die wörtlichere Alternative die unbestimmte griechische Form κατοικίαν ἐπουράνιον genauer abbildet. Bedeutung, Register und Ambiguität des Ausgangstextes bleiben erhalten.
