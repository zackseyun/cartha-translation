  text: Because of the piety and hatred of wickedness there, it came about that even the kings themselves honored the place and glorified the sanctuary with the finest gifts sent.
translation:
  language: de
  text: Wegen der Frömmigkeit und der Abscheu vor dem Bösen kam es dazu, dass sogar die Könige selbst den Ort ehrten und das Heiligtum durch die erlesensten Gaben[a] verherrlichten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „durch die hervorragendsten zugesandten Gaben“. Das griechische Wort kann hier Zuwendungen oder Gaben bezeichnen, die dem Heiligtum zugesandt wurden; die genaue Art bleibt offen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐσέβειαν
  choice: Frömmigkeit
  rationale: Bezeichnet ehrfürchtige Gottesverehrung, die sich in entsprechendem Verhalten zeigt; im Tempelkontext ist „Frömmigkeit“ prägnant und natürlich.
- source_word: μισοπονηρίαν
  choice: Abscheu vor dem Bösen
  rationale: Das Kompositum bezeichnet wörtlich den Hass auf das Böse beziehungsweise die Schlechtigkeit. „Abscheu vor dem Bösen“ bewahrt die starke moralische Wertung in natürlichem Deutsch.
- source_word: συνέβαινεν
  choice: es kam dazu
  rationale: Gibt die resultative Bedeutung des Imperfekts idiomatisch wieder, ohne ein einmaliges Ereignis stärker zu behaupten, als der griechische Text es verlangt.
- source_word: τιμᾶν
  choice: ehrten
  rationale: Entspricht dem öffentlichen Erweisen von Ehre gegenüber dem heiligen Ort.
- source_word: τὸν τόπον
  choice: den Ort
  rationale: Bewahrt die schlichte, ehrerbietige Bezeichnung des Tempelortes im Ausgangstext.
- source_word: τὸ ἱερὸν
  choice: das Heiligtum
  rationale: Bezeichnet den heiligen Tempelbezirk und wahrt zugleich die Unterscheidung zu „dem Ort“.
- source_word: ἀποστολαῖς
  choice: Zuwendungen
  rationale: Im Zusammenhang sind zugesandte Gaben oder Beiträge gemeint. „Zuwendungen“ ist natürlich und lässt offen, ob es sich enger um Opfergaben oder allgemeiner um königliche Geschenke handelte.
- source_word: ταῖς κρατίσταις
  choice: überaus kostbare
  rationale: Der Superlativ bezeichnet hier höchstrangige oder besonders hervorragende Zuwendungen; „überaus kostbare“ vermittelt deren außergewöhnlichen Wert idiomatisch.
- source_word: δοξάζειν
  choice: verherrlichten
  rationale: Bewahrt gegenüber dem vorangehenden „ehrten“ die Unterscheidung der beiden griechischen Verben und drückt aus, dass die Zuwendungen dem Heiligtum Glanz und Ansehen verliehen.
theological_decisions:
- issue: Bezug der Frömmigkeit und der Abscheu vor dem Bösen
  choice: Die Eigenschaften bleiben ohne ausdrücklich ergänztes persönliches oder örtliches Bezugswort stehen.
  alternative: „Wegen der dort herrschenden Frömmigkeit und Abscheu vor dem Bösen“ oder ein ausdrücklicher Bezug auf den Hohen Priester beziehungsweise die Verwaltung der Stadt.
  rationale: Der griechische Vers nennt keinen eigenen Träger dieser Eigenschaften. Die Übersetzung vermeidet daher eine nicht ausdrücklich belegte Zuordnung und bewahrt die Mehrdeutigkeit innerhalb des tempelbezogenen Zusammenhangs.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallelen Verben „ehrten“ und „verherrlichten“ sowie „Ort“ und „Heiligtum“ bilden die Differenzierung des griechischen Textes nach; die unbestimmte Zuordnung der moralischen Eigenschaften bleibt erhalten.
