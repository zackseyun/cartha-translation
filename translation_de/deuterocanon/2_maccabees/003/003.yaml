base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/003/003.yaml
  text: so that even Seleucus[a], the king of Asia[b], used to provide from his own revenues all the expenses that fell due for the services of the sacrifices.
translation:
  language: de
  text: sodass sogar Seleukus, der König von Asien,[a] aus seinen eigenen Einkünften alle anfallenden Kosten für die Opferdienste übernahm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Asien“ bezeichnet hier im hellenistischen Sprachgebrauch das asiatische Herrschaftsgebiet des Seleukidenkönigs, nicht den gesamten Kontinent im heutigen Sinn.
    reason: cultural_note
lexical_decisions:
- source_word: χορηγεῖν
  choice: übernahm
  rationale: Im Zusammenhang mit Kosten bezeichnet das Verb, dass Seleukus die erforderlichen Mittel bereitstellte bzw. die Ausgaben trug. „Übernahm“ ist im Deutschen natürlich und bewahrt den finanziellen Sinn.
- source_word: ἐκ τῶν ἰδίων προσόδων
  choice: aus seinen eigenen Einkünften
  rationale: πρόσοδοι bezeichnet Einnahmen oder Einkünfte, besonders im fiskalischen Zusammenhang. Die Formulierung erhält sowohl die Herkunft der Mittel als auch die Betonung des Eigenen.
- source_word: λειτουργίας τῶν θυσιῶν
  choice: Opferdienste
  rationale: Im Tempelkontext sind die kultischen Dienste gemeint, die mit den Opfern verbunden waren. „Opferdienste“ ist knapp, verständlich und vermeidet späteres kirchliches Fachvokabular.
- source_word: ἐπιβάλλοντα δαπανήματα
  choice: anfallenden Kosten
  rationale: ἐπιβάλλοντα beschreibt Ausgaben, die erforderlich werden bzw. jemandem zufallen. „Anfallende Kosten“ gibt diesen Verpflichtungs- und Aufwandssinn idiomatisch wieder.
- source_word: ὥστε καὶ
  choice: sodass sogar
  rationale: Die Wendung drückt die Folge des vorangehenden Sachverhalts aus; καί hebt Seleukus als bemerkenswertes Beispiel hervor.
- source_word: τὸν τῆς Ἀσίας βασιλέα
  choice: der König von Asien
  rationale: Die historische Titulatur wird formal bewahrt; eine Fußnote grenzt den hellenistischen Sprachgebrauch vom heutigen Kontinentbegriff ab.
theological_decisions:
- issue: Kultische Terminologie in einer deuterokanonischen Geschichtserzählung
  choice: Die Tempel- und Finanzsprache wird in klaren historischen Begriffen wiedergegeben.
  alternative: „Liturgien der Opfer“ oder „Dienstverrichtungen bei den Opfern“
  rationale: Der Vers berichtet von der königlichen Finanzierung des Opferbetriebs am Tempel. „Opferdienste“ bewahrt den kultischen Bezug, ohne spätere konfessionelle Vorstellungen einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt nahe am Griechischen, während „anfallende Kosten“ und „übernahm“ einen natürlichen deutschen Finanzsprachgebrauch bieten.
