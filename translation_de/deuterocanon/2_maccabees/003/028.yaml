revisions:
- from: Den Mann, der gerade noch mit großem Getöse[a] und seinem gesamten Gefolge in die bereits erwähnte Schatzkammer[b] eingetreten war, trug man nun hilflos hinaus; er war völlig außer Gefecht gesetzt[c] und hatte die Herrschermacht unübersehbar erkannt.
  to: Den Mann, der gerade erst unter großem geschäftigem Treiben und mit seiner ganzen Leibwache in die bereits erwähnte Schatzkammer eingetreten war, trug man hilflos hinaus, völlig handlungsunfähig, nachdem er die Macht klar erkannt hatte.
  rationale: Die Revision beseitigt Bedeutungsverschiebungen bei ἄρτι und παραδρομή, macht die Schutztruppen-Nuance von δορυφορία im Haupttext sichtbar und ersetzt einzelne weniger natürliche oder unnötig eng gefasste deutsche Ausdrücke. Die schwierige Wendung τοῖς ὅλοις καθεστῶτα bleibt durch „völlig handlungsunfähig“ als umfassender resultierender Zustand wiedergegeben. Die abstrakte Referenz von δυναστεία bleibt ohne dogmatische Explikation erhalten. Die Marker sind unmittelbar an „Treiben“, „Schatzkammer“ und „handlungsunfähig“ zu setzen.
