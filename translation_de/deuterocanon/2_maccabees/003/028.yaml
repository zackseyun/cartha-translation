  yaml_path: translation/deuterocanon/2_maccabees/003/028.yaml
  text: The man who had just entered the treasury with much rushing about and all his guard[a], they carried out helpless, being completely incapacitated[c][b], having plainly recognized the sovereign power.
translation:
  language: de
  text: Den Mann, der gerade erst unter großem geschäftigem Treiben und mit seiner ganzen Leibwache in die bereits erwähnte Schatzkammer eingetreten war, trug man hilflos hinaus, völlig handlungsunfähig, nachdem er die Macht klar erkannt hatte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸν ἄρτι ... εἰσελθόντα
  choice: Den Mann, der gerade noch ... eingetreten war
  rationale: Der substantivierte Partizipialausdruck bezeichnet Heliodor. „Gerade noch“ gibt ἄρτι wieder und hebt den unmittelbaren, ironischen Gegensatz zwischen seinem machtvollen Eintreten und seinem hilflosen Abtransport hervor.
- source_word: μετὰ πολλῆς παραδρομῆς
  choice: mit großem Getöse
  rationale: παραδρομή bezeichnet wörtlich ein Umher- oder Vorbeilaufen und kann hier geschäftige, demonstrative Bewegung ausdrücken. „Getöse“ gibt den lärmenden, auffälligen Auftritt natürlich wieder, ohne die Bedeutung auf bloßen Prunk festzulegen.
- source_word: πάσης δορυφορίας
  choice: seinem gesamten Gefolge
  rationale: δορυφορία bezeichnet eine bewaffnete Leibwache oder Eskorte. „Gefolge“ liest sich im Satz flüssig; die Fußnote präzisiert den militärischen Charakter.
- source_word: τὸ προειρημένον ... γαζοφυλάκιον
  choice: die bereits erwähnte Schatzkammer
  rationale: Anders als die englische Hauptzeile wird προειρημένον ausdrücklich wiedergegeben. γαζοφυλάκιον ist die Schatzkammer beziehungsweise der Schatzraum.
- source_word: ἔφερον
  choice: trug man nun ... hinaus
  rationale: Der Imperfekt bezeichnet den Abtransport. „Hinaus“ ergibt sich aus der Bewegung aus der zuvor betretenen Schatzkammer; das unpersönliche „man“ bewahrt das im Griechischen unausgesprochene Subjekt.
- source_word: ἀβοήθητον
  choice: hilflos
  rationale: Das Adjektiv bezeichnet einen Zustand ohne Hilfe beziehungsweise ohne Möglichkeit zur Hilfe und betont den Gegensatz zu seinem bewaffneten Auftreten.
- source_word: τοῖς ὅλοις καθεστῶτα
  choice: völlig außer Gefecht gesetzt
  rationale: Die schwierige idiomatische Wendung beschreibt seinen umfassend niedergeworfenen, handlungsunfähigen Zustand. Die Übersetzung bewahrt den resultativen Sinn von καθεστῶτα und die Totalität von τοῖς ὅλοις.
- source_word: φανερῶς
  choice: unübersehbar
  rationale: Das Adverb bezeichnet etwas offenkundig oder klar Erkennbares. „Unübersehbar“ lässt offen, ob sich die Deutlichkeit primär auf seine eigene Erkenntnis oder auf deren Sichtbarkeit für andere bezieht.
- source_word: τὴν δυναστείαν
  choice: die Herrschermacht
  rationale: δυναστεία umfasst Macht, Herrschaft und überlegene Gewalt. „Herrschermacht“ bewahrt sowohl den Macht- als auch den Herrschaftsaspekt, ohne Gott im Vers ausdrücklich hinzuzusetzen.
- source_word: ἐπεγνωκότα
  choice: hatte ... erkannt
  rationale: Das Partizip Perfekt bezeichnet die durch das Geschehen gewonnene, nun bestehende Erkenntnis. Das deutsche Plusquamperfekt fügt sich natürlich in die Erzählfolge ein.
theological_decisions:
- issue: Bezug der Herrschermacht
  choice: Die abstrakte Formulierung „die Herrschermacht“ bleibt erhalten.
  alternative: „Gottes Macht“ oder „die Macht des Herrn der Schatzkammer“
  rationale: Der Zusammenhang identifiziert die Macht als göttlich und als Schutz des Heiligtums; der griechische Vers nennt Gott an dieser Stelle jedoch nicht ausdrücklich. Die Übersetzung vermeidet daher eine verdeutlichende Festlegung.
- issue: Bedeutung von φανερῶς bei ἐπεγνωκότα
  choice: „hatte die Herrschermacht unübersehbar erkannt“
  alternative: „hatte die Herrschermacht eindeutig anerkannt“
  rationale: ἐπιγινώσκω bezeichnet hier ein durch Erfahrung erzwungenes Erkennen. „Anerkannt“ könnte eine freiwillige Bekenntnishandlung nahelegen, die der Text nicht zwingend aussagt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusstem Kontrast zwischen dem lärmend-machtvollen Eintreten und dem hilflosen Hinaustragen. Die Satzperiode folgt der griechischen Struktur, bleibt aber durch Hauptsatz und Semikolon gut verständlich. Alle Fußnotenmarker stehen an der jeweils einschlägigen Stelle im Haupttext.
