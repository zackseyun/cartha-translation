    issue: „gerade noch“ für ἄρτι
    rationale: „Gerade noch“ kann bedeuten, dass etwas nur knapp oder beinahe geschah. ἄρτι besagt hier „gerade/soeben/gerade erst“.
  - severity: medium
    issue: „mit großem Getöse“ für μετὰ πολλῆς παραδρομῆς
    rationale: Die griechische Vokabel bezieht sich auf Herumlaufen, geschäftige Bewegung oder auffälligen Betrieb; ein akustisches „Getöse“ ist nicht abgesichert.
  - severity: medium
    issue: „Gefolge“ für δορυφορία
    rationale: Das Wort kann zwar eine Begleitung bezeichnen, meint aber besonders eine Leibwache bzw. bewaffnete Eskorte. Die Hauptzeile sollte diese Nuance nicht allein einer nicht vorhandenen Fußnote überlassen.
  - severity: low
    issue: „unübersehbar erkannt“
    rationale: Die Verbindung ist weniger idiomatisch als „klar erkannt“. φανερῶς wird damit direkt und ohne Bedeutungsverlust wiedergegeben.
  revised_text: Den Mann, der gerade erst unter großem geschäftigem Treiben und mit seiner ganzen Leibwache in die bereits erwähnte Schatzkammer eingetreten war, trug man hilflos hinaus, völlig handlungsunfähig, nachdem er die Macht klar erkannt hatte.
