review_pass:
  verdict: revise
  source_fidelity: Der Entwurf gibt die Satzstruktur, den Kontrast zwischen Eintritt und Abtransport sowie die schwierige Zustandsbeschreibung insgesamt zutreffend wieder. Korrigiert werden sollten jedoch „gerade noch“, das eine Beinahe-Bedeutung nahelegt, und „Getöse“, das Lärm behauptet, während παραδρομή geschäftige Bewegung bzw. ein auffälliges Hin und Her bezeichnet. „Gefolge“ lässt zudem den bei δορυφορία naheliegenden Sinn einer Leibwache zu sehr zurücktreten.
  naturalness: Die revidierte Fassung ist modernes, würdiges Standarddeutsch. „Gerade erst“ ist idiomatisch und präzise; „unter großem geschäftigem Treiben“ wahrt die Bewegungsnuance ohne eine nicht ausgesagte Lautstärke zu unterstellen. „Völlig außer Gefecht gesetzt“ ist verständlich, aber stärker idiomatisch-militärisch; „völlig handlungsunfähig“ gibt die umfassende resultierende Hilflosigkeit neutraler wieder.
  terminology: „Leibwache“ gibt δορυφορία in diesem Kontext genauer wieder als „Gefolge“. Für δυναστεία ist „Macht“ die natürliche, ausreichend weite Wiedergabe; sie fügt Gott nicht ausdrücklich ein und vermeidet die im Deutschen ungebräuchliche bzw. stärker personal-herrschaftliche Nuance von „Herrschermacht“.
  issues:
