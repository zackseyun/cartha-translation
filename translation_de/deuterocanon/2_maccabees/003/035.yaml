base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/003/035.yaml
  text: But Heliodorus[a], after offering a sacrifice to God and making very great vows to the one who had preserved his life, and after taking leave of Onias[c][b], returned to the king.
translation:
  language: de
  text: Heliodor aber brachte Gott ein Opfer dar und legte dem, der ihm das Leben erhalten hatte, sehr große Gelübde ab.[a] Dann verabschiedete er sich von Onias[b] und zog zum König zurück.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sprach sehr eindringliche Gebete“. Das griechische Wort kann sowohl Gebete als auch Gelübde bezeichnen; der Zusammenhang mit dem Opfer spricht eher für Gelübde.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „nahm Onias freundlich auf“. Das griechische Verb kann auch „empfangen“ oder „willkommen heißen“ bedeuten; wegen der anschließenden Abreise ist hier wahrscheinlich ein Abschied gemeint.'
    reason: lexical_alternative
  - marker: c
    text: Das griechische Verb ist militärisch geprägt und kann wörtlich das Aufbrechen des Lagers oder einen Rückmarsch bezeichnen.
    reason: cultural_note
lexical_decisions:
- source_word: θυσίαν ἀνενέγκων τῷ θεῷ
  choice: brachte Gott ein Opfer dar
  rationale: Die feste Verbindung bezeichnet das Darbringen eines Opfers; der Dativ gibt Gott als Empfänger an.
- source_word: εὐχὰς μεγίστας εὐξάμενος
  choice: legte ... große Gelübde ab
  rationale: εὐχή kann sowohl Gebet als auch Gelübde bedeuten. Der Opferzusammenhang spricht eher für Gelübde; μεγίστας wird ohne unnötige Steigerung als „große“ wiedergegeben.
- source_word: τῷ τὸ ζῆν περιποιήσαντι
  choice: dem, der ihm das Leben erhalten hatte
  rationale: Das substantivierte Partizip verweist im Zusammenhang auf Gott, der Heliodors Weiterleben gesichert hatte. Die deutsche Formulierung gibt diesen konkreten Bezug idiomatisch wieder.
- source_word: τὸν Ὀνίαν ἀποδεξάμενος
  choice: verabschiedete er sich von Onias
  rationale: Das Verb kann je nach Zusammenhang ein Empfangen, Begrüßen oder Abschiednehmen bezeichnen. Da Heliodor unmittelbar danach abreist, passt hier das Abschiednehmen am besten.
- source_word: ἀνεστρατοπέδευσεν πρὸς τὸν βασιλέα
  choice: zog zum König zurück
  rationale: Das Verb hat militärisches Gepräge und kann das Aufbrechen beziehungsweise Zurückmarschieren bezeichnen. „zog ... zurück“ bewahrt davon mehr als das neutrale „kehrte zurück“, bleibt aber natürlich.
theological_decisions:
- issue: Bezug von τῷ τὸ ζῆν περιποιήσαντι
  choice: Gott ist derjenige, der Heliodor das Leben erhalten hatte.
  alternative: 'Allgemeiner: Gott als derjenige, der ihm Leben gewährt hatte.'
  rationale: Der unmittelbare Erzählzusammenhang handelt von Heliodors Rettung aus Todesgefahr. Daher ist konkret sein erhaltenes Weiterleben gemeint, ohne darüber hinaus eine lehrmäßige Aussage einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Abfolge der griechischen Partizipien wird zur besseren Verständlichkeit in zwei Sätze gegliedert. „zog ... zurück“ erhält den militärischen Unterton, ohne altertümlich zu wirken; echte lexikalische Mehrdeutigkeiten werden in den Fußnoten offengehalten.
