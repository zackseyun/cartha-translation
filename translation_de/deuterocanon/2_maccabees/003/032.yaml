base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/003/032.yaml
  text: But the high priest[a], becoming suspicious that the king might perhaps suppose that some wrongdoing against Heliodorus had been carried out by the Jews, offered a sacrifice for the man's recovery.
translation:
  language: de
  text: Da der Hohe Priester jedoch befürchtete, der König könnte womöglich annehmen, die Juden hätten Heliodor irgendein Unrecht angetan, brachte er ein Opfer für die Genesung[a] des Mannes dar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Rettung“ beziehungsweise „Heil“. Das griechische Wort σωτηρία kann Rettung, Bewahrung oder Heil bezeichnen; hier ist wahrscheinlich Heliodors körperliche Genesung gemeint.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὕποπτος ... γενόμενος
  choice: befürchtete
  rationale: Die Konstruktion bezeichnet hier die besorgte Vermutung des Hohen Priesters darüber, welchen Schluss der König ziehen könnte. „Befürchtete“ gibt diese apprehensive Bedeutung im Deutschen natürlich wieder, ohne zu unterstellen, der Hohe Priester selbst sei verdächtig geworden.
- source_word: μή ποτε
  choice: könnte womöglich
  rationale: Die Wendung führt eine als möglich befürchtete Annahme ein; „könnte womöglich“ bewahrt sowohl Möglichkeit als auch Besorgnis.
- source_word: διάλημψιν
  choice: annehmen
  rationale: Gemeint ist die Vorstellung oder Schlussfolgerung, zu der der König gelangen könnte. „Annehmen“ ist präzise und gegenwartssprachlich.
- source_word: κακουργίαν τινά
  choice: irgendein Unrecht
  rationale: Die Formulierung bewahrt die Unbestimmtheit von τινά und gibt κακουργία als schuldhaftes, möglicherweise verbrecherisches Handeln wieder, ohne den Rechtsgrad unnötig festzulegen.
- source_word: περὶ τὸν Ἡλιόδωρον
  choice: Heliodor ... angetan
  rationale: Im Zusammenhang mit κακουργία bezeichnet die Präpositionalfügung ein gegen Heliodor gerichtetes Unrecht. Die deutsche Konstruktion „jemandem Unrecht antun“ drückt dies idiomatisch aus.
- source_word: συντετελέσθαι
  choice: hätten ... angetan
  rationale: Der griechische Perfektinfinitiv bezeichnet eine als abgeschlossen gedachte Tat; der deutsche Konjunktiv II der Vorzeitigkeit ist durch „hätten ... angetan“ im Zusammenhang der möglichen königlichen Annahme wiedergegeben.
- source_word: προσήγαγε θυσίαν
  choice: brachte ... ein Opfer ... dar
  rationale: „Ein Opfer darbringen“ ist im Deutschen die natürliche und zugleich würdige Entsprechung der kultischen Wendung.
- source_word: ὑπὲρ τῆς ... σωτηρίας
  choice: für die Genesung
  rationale: σωτηρία kann Rettung, Bewahrung, Heil oder Wiederherstellung bezeichnen. Da Heliodor im unmittelbaren Erzählzusammenhang körperlich niedergeschlagen wurde, ist „Genesung“ hier die naheliegende kontextuelle Wiedergabe.
- source_word: τοῦ ἀνδρός
  choice: des Mannes
  rationale: Die ausdrückliche Nominalform des Griechischen bleibt erhalten und verweist auf Heliodor zurück.
theological_decisions:
- issue: Bedeutung von σωτηρία im Zusammenhang körperlicher Wiederherstellung
  choice: Genesung
  alternative: Rettung oder Heil
  rationale: Der unmittelbare Zusammenhang handelt von Heliodors körperlichem Zustand und seiner Wiederherstellung. „Genesung“ gibt diesen Sinn wieder, während die Fußnote die größere Bedeutungsbreite des griechischen Wortes offenhält und eine unnötige soteriologische Festlegung vermeidet.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch in würdigem Erzählstil. Der lange griechische Satz bleibt als zusammenhängender Satz erhalten, wird aber durch natürliche deutsche Satzführung klar gegliedert.
