  yaml_path: translation/deuterocanon/2_maccabees/003/030.yaml
  text: And they were blessing the Lord[a], who was glorifying his own place; and the temple, which a little earlier had been full of fear and turmoil, was filled with joy and gladness when the Almighty Lord appeared.
translation:
  language: de
  text: Sie aber priesen den Herrn, der seine eigene Stätte verherrlichte. Und der Tempel, der noch kurz zuvor von Furcht und Unruhe erfüllt gewesen war, wurde mit Freude und Jubel erfüllt, als der allmächtige Herr erschien.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sich offenbarte“. Das griechische Wort gehört zum Sprachfeld göttlicher Erscheinung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλόγουν
  choice: priesen
  rationale: Das Imperfekt bezeichnet ein andauerndes oder wiederholtes Preisen als Reaktion auf das Geschehen. „Den Herrn preisen“ gibt εὐλογεῖν mit göttlichem Objekt im heutigen Deutsch natürlicher wieder als das missverständliche „segnen“.
- source_word: παραδοξάζοντα
  choice: verherrlichte
  rationale: Das Partizip beschreibt, wie der Herr seiner Stätte durch sein außergewöhnliches Eingreifen Herrlichkeit und Ehre verschafft. „Verherrlichte“ bewahrt den Bezug zur Herrlichkeit, ohne die Art des Eingreifens näher festzulegen.
- source_word: τὸν ἑαυτοῦ τόπον
  choice: seine eigene Stätte
  rationale: „Stätte“ gibt τόπος relativ formal und ortsbezogen wieder; „seine eigene“ bewahrt die betonte Rückbezüglichkeit von ἑαυτοῦ. Der folgende Satz identifiziert die Stätte als den Tempel.
- source_word: τὸ μικρῷ πρότερον
  choice: noch kurz zuvor
  rationale: Die Wendung bezeichnet einen erst wenig zurückliegenden Zustand und hebt den starken Gegensatz zur folgenden Freude hervor.
- source_word: δέους καὶ ταραχῆς γέμον
  choice: von Furcht und Unruhe erfüllt gewesen war
  rationale: δέος bezeichnet Furcht oder Schrecken, ταραχή Unruhe oder Aufruhr. Das Plusquamperfekt fügt sich im Deutschen natürlich zur Rückblende „kurz zuvor“.
- source_word: ἱερόν
  choice: Tempel
  rationale: ἱερόν bezeichnet hier den Tempel beziehungsweise Tempelbezirk; „Tempel“ ist die klare und übliche deutsche Wiedergabe.
- source_word: τοῦ παντοκράτορος ... κυρίου
  choice: der allmächtige Herr
  rationale: παντοκράτωρ wird mit dem etablierten göttlichen Titel „allmächtig“ wiedergegeben; beide griechischen Titelelemente bleiben erhalten.
- source_word: ἐπιφανέντος
  choice: erschien
  rationale: Der Genitivus absolutus nennt die göttliche Erscheinung als zeitlichen Anlass des Umschwungs. „Erschien“ gibt den epiphanischen Gehalt knapp wieder; die mögliche Wiedergabe „sich offenbarte“ wird in der Fußnote genannt.
- source_word: χαρᾶς καὶ εὐφροσύνης ἐπληροῦτο
  choice: wurde mit Freude und Jubel erfüllt
  rationale: Die passive Form bleibt erhalten. „Freude und Jubel“ gibt die beiden verwandten, aber unterscheidbaren Begriffe χαρά und εὐφροσύνη in natürlichem Deutsch wieder.
theological_decisions:
- issue: Das Handeln des Herrn an seiner Stätte in παραδοξάζοντα τὸν ἑαυτοῦ τόπον
  choice: Der Herr „verherrlichte“ seine eigene Stätte.
  alternative: Der Herr machte seine Stätte wunderbar oder erwies ihre Herrlichkeit.
  rationale: Die Formulierung bewahrt die Aussage, dass Gottes Eingreifen dem Tempel Herrlichkeit und Ehre verschafft, ohne den ungewöhnlichen griechischen Ausdruck auf einen bestimmten Wirkmechanismus festzulegen.
- issue: Die Aussage von ἐπιφανέντος κυρίου
  choice: „als der allmächtige Herr erschien“
  alternative: „als der allmächtige Herr sich offenbarte“
  rationale: Der Text schildert eine wirkliche göttliche Epiphanie. „Erschien“ wahrt diese Aussage, ohne sie zu bloßer Vorsehung abzuschwächen oder dogmatisch näher auszugestalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Stätte“ hält den sakralen Ton, bleibt aber verständlich. Die Wiederholung von „erfüllt“ bildet den bewussten Gegensatz zwischen dem früheren Zustand des Tempels und der anschließenden Freude ab.
