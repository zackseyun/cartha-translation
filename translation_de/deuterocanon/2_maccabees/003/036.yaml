  text: And he testified to everyone about the works of the greatest God that he had seen with his own eyes[a].
translation:
  language: de
  text: Und allen bezeugte er die Werke des größten Gottes, die er mit eigenen Augen gesehen hatte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traditioneller auch: »des höchsten Gottes«. Im Griechischen steht hier jedoch »größten« (μεγίστου), nicht das übliche Wort für »höchsten«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξεμαρτύρει
  choice: er bezeugte
  rationale: Das Imperfekt bezeichnet ein fortdauerndes oder wiederholtes Zeugnis. »Bezeugte« wahrt den öffentlichen Charakter der Aussage und klingt im heutigen Deutsch würdig und verständlich.
- source_word: πᾶσιν
  choice: vor allen
  rationale: Der Dativ bezeichnet die Personen, denen gegenüber das Zeugnis abgelegt wurde. »Vor allen« gibt den öffentlichen Rahmen knapp und natürlich wieder.
- source_word: ἅπερ
  choice: die
  rationale: Das Relativpronomen wird auf »Werke« bezogen und leitet den Inhalt seiner eigenen Wahrnehmung ein; die deutsche Satzstruktur bewahrt diesen Bezug klar.
- source_word: ὑπʼ ὄψιν
  choice: mit eigenen Augen
  rationale: Die Wendung betont unmittelbare persönliche Wahrnehmung. »Mit eigenen Augen« ist dafür die natürliche deutsche Entsprechung.
- source_word: τεθεαμένος
  choice: gesehen hatte
  rationale: Das Perfektpartizip bezeichnet eine abgeschlossene persönliche Wahrnehmung mit fortdauernder Bedeutung. Das deutsche Plusquamperfekt bildet das zeitliche Verhältnis zum Bezeugen verständlich ab.
- source_word: ἔργα
  choice: Werke
  rationale: »Werke« entspricht dem griechischen Ausdruck eng und bezeichnet hier Gottes machtvolle Taten, ohne den Wortlaut unnötig einzuengen.
- source_word: τοῦ μεγίστου θεοῦ
  choice: des größten Gottes
  rationale: μεγίστου bedeutet wörtlich »größten« und nicht »höchsten«. Die Formulierung folgt daher dem griechischen Wortlaut, während die traditionelle Alternative in der Fußnote genannt wird.
theological_decisions:
- issue: Wiedergabe der Gottesbezeichnung μεγίστου θεοῦ
  choice: des größten Gottes
  alternative: des höchsten Gottes
  rationale: Der Text gebraucht den Superlativ von μέγας (»groß«), nicht ὕψιστος (»höchster«). Deshalb wird die ungewöhnlichere Formulierung beibehalten, statt stillschweigend den vertrauten Titel »der höchste Gott« einzusetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung ist nah am griechischen Aufbau, bleibt aber flüssig; »mit eigenen Augen« vermittelt die Augenzeugenschaft idiomatisch.
