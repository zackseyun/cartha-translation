  yaml_path: translation/deuterocanon/2_maccabees/003/031.yaml
  text: But quickly some of Heliodorus's companions were urging Onias to call upon the Most High and grant life to the one who was lying at his last breath[a][b].
translation:
  language: de
  text: Doch unverzüglich baten einige von Heliodors Begleitern Onias eindringlich, den Höchsten anzurufen[a] und dem, der in den letzten Zügen lag[b], das Leben zu schenken.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den Höchsten anzurufen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „dem, der völlig im letzten Atemzug dalag“; gemeint ist: der unmittelbar vor dem Tod stand.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταχὺ
  choice: schon bald
  rationale: Das Adverb bezeichnet rasches Handeln. „Schon bald“ ist im Deutschen natürlich und wahrt die Dringlichkeit, ohne zwingend augenblickliches Handeln auszudrücken.
- source_word: τινες τῶν τῷ Ἡλιοδώρῳ συνηθῶν
  choice: einige aus Heliodors engstem Kreis
  rationale: Das substantivierte σύνηθοι bezeichnet vertraute, eng verbundene Personen. Die Wendung gibt diese Nähe idiomatisch wieder, ohne eine bestimmte amtliche Stellung zu unterstellen.
- source_word: ἠξίουν
  choice: baten … eindringlich
  rationale: Der Imperfekt kann einen anhaltenden oder wiederholten Appell ausdrücken; „baten … eindringlich“ bewahrt sowohl den Bittcharakter als auch die Dringlichkeit.
- source_word: ἐπικαλέσασθαι τὸν ὕψιστον
  choice: den Höchsten anzurufen
  rationale: ἐπικαλέομαι bezeichnet hier das an Gott gerichtete Anrufen. „Der Höchste“ ist die geläufige deutsche Wiedergabe des göttlichen Titels.
- source_word: τὸ ζῆν χαρίσασθαι
  choice: das Leben zu schenken
  rationale: χαρίζομαι bezeichnet ein gnädiges Gewähren oder Schenken; zusammen mit τὸ ζῆν wird das Leben als gewährte Gabe dargestellt.
- source_word: τῷ παντελῶς ἐν ἐσχάτῃ πνοῇ κειμένῳ
  choice: dem, der im letzten Atemzug dalag
  rationale: Die bildhafte Formulierung bleibt nahe am Griechischen. Das im Deutschen ungewöhnliche Bild wird durch eine Fußnote als Bezeichnung für die unmittelbare Todesnähe erläutert.
theological_decisions:
- issue: Wiedergabe des Gottestitels τὸν ὕψιστον
  choice: den Höchsten
  alternative: Gott, den Höchsten
  rationale: Der griechische Text enthält den substantivierten Titel ohne zusätzliches θεός. „Den Höchsten“ bewahrt diese knappe Titelform und fügt keine ausdrückliche Bezeichnung hinzu.
- issue: Bezugsrichtung von τὸ ζῆν χαρίσασθαι
  choice: Onias soll den Höchsten anrufen und dem Sterbenden das Leben schenken
  alternative: Onias soll den Höchsten anrufen, damit dieser dem Sterbenden das Leben schenkt
  rationale: Die griechische Infinitivkonstruktion koordiniert ἐπικαλέσασθαι und χαρίσασθαι grammatisch unter demselben unausgesprochenen Subjekt Onias. Die Übersetzung bewahrt diese Spannung, statt den Höchsten ausdrücklich zum Subjekt des Lebensschenkens zu machen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt dem griechischen Aufbau nahe, klingt aber flüssig. Das ungewöhnliche Bild vom „letzten Atemzug“ wurde im Haupttext bewahrt und in der Fußnote erklärt.
