translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die zwei Sätze vermeiden eine schwerfällige griechische Periodenstruktur, halten aber Ursache, sichtbare Zeichen und inneren Zustand eng zusammen. Der Fußnotenmarker steht unmittelbar bei der mehrdeutigen Wendung.
