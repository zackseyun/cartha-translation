  text: For a certain dread and bodily trembling had come over the man[a], by which the pain present in his heart was becoming evident to those who were watching.
translation:
  language: de
  text: Denn eine gewisse Furcht und körperliches Zittern hatten den Mann ergriffen. Dadurch wurde den Zuschauern der Schmerz[a] deutlich, der sein Herz bedrängte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die innere Qual«. Das griechische ἄλγος kann sowohl Schmerz allgemein als auch seelische Qual oder tiefen Kummer bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: περικεχύτο
  choice: hatten ... ergriffen
  rationale: Das Plusquamperfekt gibt den resultativen Sinn der griechischen Form wieder; »ergreifen« ist im Deutschen eine natürliche Wendung für überwältigende Furcht und körperliches Zittern.
- source_word: δέος τι
  choice: eine tiefe Furcht
  rationale: δέος bezeichnet starke, ehrfurchtgebietende oder bange Furcht. Das unbestimmte τι wird im Deutschen durch den unbestimmten Artikel aufgenommen; »tiefe« vermittelt die Intensität, ohne bis zu »Entsetzen« zu steigern.
- source_word: φρικασμὸς σώματος
  choice: körperliches Zittern
  rationale: Die Wendung bezeichnet ein körperlich sichtbares Schaudern oder Zittern. Diese Wiedergabe ist klar und idiomatisch.
- source_word: διʼ ὧν
  choice: Daran
  rationale: Das Pronomen verweist auf Furcht und Zittern als sichtbare Anzeichen, durch die der innere Schmerz erkennbar wurde.
- source_word: πρόδηλον ἐγίνετο
  choice: wurde ... deutlich
  rationale: Die Form beschreibt das Sichtbar- oder Erkennbarwerden eines Zustands; die deutsche Wendung bewahrt diesen Vorgangssinn.
- source_word: τοῖς θεωροῦσιν
  choice: für die Beobachter
  rationale: Bezeichnet diejenigen, die den Mann ansahen beziehungsweise beobachteten; die substantivische Wiedergabe ist knapp und natürlich.
- source_word: τὸ κατὰ καρδίαν ἐνεστὸς ἄλγος
  choice: welcher Schmerz sein Herz erfüllte
  rationale: κατὰ καρδίαν lokalisiert den Schmerz im Inneren, während ἐνεστὸς seine gegenwärtige, bedrängende Realität bezeichnet. Die Formulierung ist idiomatisch und bewahrt das Bild des Herzens als Sitz inneren Leidens.
