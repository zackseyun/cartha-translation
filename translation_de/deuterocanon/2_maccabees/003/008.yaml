  text: So Heliodorus immediately set out on the journey[a], outwardly as though to inspect the cities of Coele-Syria and Phoenicia, but in reality to carry out the king’s purpose.
translation:
  language: de
  text: Da machte sich Heliodor sofort auf den Weg, dem äußeren Anschein nach, um die Städte in Koilesyrien und Phönizien zu bereisen, tatsächlich aber, um den Plan des Königs[a] auszuführen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Im vorliegenden griechischen Quelltext steht vor „Königs“ (βασιλέως) ein auffälliges „A“. Vermutlich handelt es sich um ein Editions- oder Übertragungsartefakt und nicht um einen Bestandteil des Satzes. Übersetzt wird daher nach dem klaren Zusammenhang: „des Königs“.'
    reason: textual_variant
lexical_decisions:
- source_word: εὐθέως
  choice: sofort
  rationale: Gibt die unverzügliche Ausführung in natürlichem, modernem Deutsch wieder.
- source_word: ἐποιεῖτο τὴν πορίαν
  choice: machte sich auf den Weg
  rationale: Natürliche deutsche Wiedergabe der Wendung für das Antreten beziehungsweise Durchführen einer Reise; im Kontext liegt der Beginn der Reise nahe.
- source_word: τῇ μὲν ἐμφάσει
  choice: dem äußeren Anschein nach
  rationale: Bewahrt den ausdrücklichen Gegensatz zwischen Erscheinungsbild und tatsächlicher Absicht, ohne die Täuschung stärker zu formulieren als der griechische Text.
- source_word: ὡς ... ἐφοδεῦσαι
  choice: um ... zu bereisen
  rationale: ὡς mit Infinitiv bezeichnet hier den vorgeblichen Zweck; ἐφοδεύω kann das Bereisen beziehungsweise Aufsuchen eines Gebiets oder seiner Orte bezeichnen. „Bereisen“ vermeidet die möglicherweise zu enge Festlegung auf eine formelle Inspektion.
- source_word: τὰς κατὰ Κοίλην Συρίαν καὶ Φοινίκην πόλεις
  choice: die Städte in Koilesyrien und Phönizien
  rationale: Gibt die geographische Zuordnung klar wieder; „Koilesyrien“ ist die gebräuchliche deutsche Form des historischen Regionsnamens.
- source_word: τῷ πράγματι δέ
  choice: tatsächlich aber
  rationale: Stellt den Gegensatz zwischen äußerem Anschein und Wirklichkeit knapp und deutlich heraus.
- source_word: τὴν ... πρόθεσιν ἐπιτελεῖν
  choice: den Plan ... auszuführen
  rationale: πρόθεσις bezeichnet hier Absicht oder Vorhaben, während ἐπιτελεῖν dessen Ausführung meint; „Plan ausführen“ ist idiomatisch und sachlich.
- source_word: τοῦ A βασιλέως
  choice: des Königs
  rationale: Das isolierte „A“ ergibt syntaktisch und inhaltlich keinen sinnvollen Bestandteil der Wendung und ist sehr wahrscheinlich ein Editions- oder Übertragungsartefakt; die Übersetzung folgt dem klaren Sinn und dokumentiert die Auffälligkeit in einer Fußnote.
