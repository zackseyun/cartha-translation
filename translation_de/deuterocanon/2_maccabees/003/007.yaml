  source_fidelity: Der Entwurf gibt den zeitlichen Ablauf, die Mitteilung über die gemeldeten Gelder sowie den Auftrag zum Fortbringen der Gelder insgesamt zutreffend wieder. Bei „bestimmte ... den Leiter der Staatsgeschäfte“ kann jedoch der Eindruck entstehen, Heliodor sei erst zum Leiter der Staatsgeschäfte ernannt worden. Das griechische τὸν ἐπὶ τῶν πραγμάτων kennzeichnet ihn vielmehr bei seiner Auswahl als den bereits für die Angelegenheiten zuständigen hohen Beamten.
  naturalness: „Nachdem Apollonius ... zusammengetroffen war“ ist im Deutschen weniger idiomatisch als die vollendete Ereignisform „sich ... getroffen hatte“. Die Umstellung zu einem Relativsatz über Heliodors bestehende Funktion ist klar, natürlich und vermeidet die syntaktische Mehrdeutigkeit der Apposition.
  terminology: „Gelder“, „gemeldet“, „Staatsgeschäfte“ und „Abtransport“ sind für den administrativen Kontext angemessen. „Staatsgeschäfte“ ist eine verständliche Auslegung von πραγμάτων; die Fußnote erläutert zutreffend, dass es sich um einen Amtstitel handelt.
  issues:
  - severity: medium
