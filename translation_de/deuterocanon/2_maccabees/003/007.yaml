base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/003/007.yaml
  text: After conferring with the king[a], Apollonius informed him about the money that had been reported to him. Then the king appointed Heliodorus, who was over the affairs of state[c][b], and sent him with orders to carry out the removal of the aforementioned money.
translation:
  language: de
  text: Nachdem Apollonius sich mit dem König getroffen hatte[a], berichtete er ihm von den Geldern, die ihm gemeldet worden waren. Darauf wählte der König Heliodor aus, der die Staatsgeschäfte leitete[b], und sandte ihn mit dem Auftrag, den Abtransport der zuvor genannten Gelder durchzuführen[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Nachdem Apollonius sich mit dem König beraten hatte.“ Der griechische Ausdruck kann sowohl das Zusammentreffen als auch die damit verbundene Unterredung bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „der über die Angelegenheiten [gesetzt war]“. Gemeint ist der Amtstitel eines hohen Beamten, der die Staatsgeschäfte beaufsichtigte.'
    reason: cultural_note
  - marker: c
    text: 'Auch möglich: „die zuvor genannten Gelder wegzuschaffen“. Der griechische Ausdruck betont, dass das Geld von seinem Aufbewahrungsort fortgebracht werden sollte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: συμμίξας
  choice: Nachdem … mit … zusammengetroffen war
  rationale: Das Partizip bezeichnet hier ein Zusammentreffen mit dem König, das im Kontext eine Unterredung einschließt. Die Formulierung bewahrt den zeitlichen Bezug, ohne mehr als der griechische Ausdruck festzulegen.
- source_word: ἐνεφάνισεν
  choice: berichtete
  rationale: Das Verb bezeichnet das offizielle Bekanntmachen einer Angelegenheit und passt hier zum administrativen Vorgang.
- source_word: μηνυθέντων
  choice: gemeldet worden waren
  rationale: Das passive Partizip verweist auf die vorherige Mitteilung über die Gelder. „Gemeldet“ wahrt den amtlichen Ton, ohne die stärkere Bedeutung einer Denunziation einzutragen.
- source_word: χρημάτων
  choice: Gelder
  rationale: Im Zusammenhang sind bestimmte Geldbestände oder Summen gemeint. Der Plural „Gelder“ gibt diesen konkreten administrativen Sinn natürlich wieder.
- source_word: προχειρισάμενος
  choice: bestimmte
  rationale: Der König wählt Heliodor offiziell für diese Aufgabe aus. „Bestimmte“ lässt offen, ob damit eine dauerhafte Ernennung oder nur die Beauftragung für diesen Einsatz gemeint ist.
- source_word: τὸν ἐπὶ τῶν πραγμάτων
  choice: den Leiter der Staatsgeschäfte
  rationale: Die Wendung fungiert als Amtstitel eines hohen Beamten, der für die Regierungsgeschäfte zuständig war. Die Übersetzung ist verständlich und bewahrt den administrativen Charakter.
- source_word: ἐκκομιδὴν ποιήσασθαι
  choice: den Abtransport … durchzuführen
  rationale: Die Verbindung bezeichnet das Ausführen der Entfernung aus dem bisherigen Aufbewahrungsort. „Abtransport“ bildet die räumliche Bewegung ab, ohne ausdrücklich eine rechtliche Wertung wie „Beschlagnahmung“ einzutragen.
- source_word: προειρημένων
  choice: zuvor genannten
  rationale: Das Partizip verweist auf die bereits erwähnten Gelder und wird in natürlichem, zugleich formellem Deutsch wiedergegeben.
