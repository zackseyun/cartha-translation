base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/003/026.yaml
  text: But two other young men appeared to him[a], outstanding in strength, most handsome in appearance, and splendid in clothing; and standing on either side of him, they kept scourging him without stopping, landing many blows on him.
translation:
  language: de
  text: Doch zwei weitere junge Männer erschienen ihm. Sie zeichneten sich durch ihre Kraft aus, waren von größter Schönheit in ihrer Erscheinung[a] und trugen prächtige Gewänder. Sie stellten sich zu beiden Seiten neben ihn und geißelten ihn unaufhörlich, wobei sie ihm viele Schläge versetzten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »von größter Schönheit in ihrer Ausstrahlung«. Das griechische Wort kann hier sichtbare Erscheinung, Ausstrahlung oder Herrlichkeit bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕτεροι δὲ δύο
  choice: Doch zwei weitere
  rationale: ἕτεροι bezeichnet zwei zusätzliche Gestalten; δέ markiert hier einen leichten erzählerischen Übergang beziehungsweise Gegensatz.
- source_word: ἐφάνησαν αὐτῷ
  choice: erschienen ihm
  rationale: Die intransitive Bedeutung von φαίνομαι wird direkt und natürlich wiedergegeben; der Dativ αὐτῷ bleibt erhalten.
- source_word: νεανίαι
  choice: junge Männer
  rationale: Die Bezeichnung benennt junge Männer, ohne sie ausdrücklich als Engel oder Krieger zu identifizieren.
- source_word: τῇ ῥώμῃ μὲν ἐκπρεπεῖς
  choice: Sie zeichneten sich durch ihre Kraft aus
  rationale: ῥώμη bezeichnet Kraft oder Stärke, ἐκπρεπής ein auffallendes Hervorragen.
- source_word: κάλλιστοι δὲ τὴν δόξαν
  choice: von größter Schönheit in ihrer Erscheinung
  rationale: κάλλιστοι ist ein Superlativ; δόξα bezeichnet im beschreibenden Zusammenhang die sichtbare Erscheinung, kann jedoch auch den Beiklang von Herrlichkeit oder Ausstrahlung tragen.
- source_word: διαπρεπεῖς δὲ τὴν περιβολήν
  choice: trugen prächtige Gewänder
  rationale: περιβολή meint Kleidung oder Gewandung; die verbale deutsche Formulierung gibt διαπρεπεῖς idiomatisch wieder.
- source_word: οἵ καὶ παραστάντες ἐξ ἑκατέρου μέρους
  choice: Sie stellten sich zu beiden Seiten neben ihn
  rationale: Das Aoristpartizip bezeichnet das Einnehmen einer Stellung; ἐξ ἑκατέρου μέρους bedeutet auf beiden beziehungsweise auf je einer Seite.
- source_word: ἐμαστίγουν αὐτὸν ἀδιαλείπτως
  choice: geißelten ihn unaufhörlich
  rationale: Der Imperfekt stellt das fortdauernde Schlagen heraus; μαστιγόω ist stärker und genauer als ein allgemeines „schlagen“, ἀδιαλείπτως bedeutet unaufhörlich.
- source_word: πολλὰς ἐπιρριπτοῦντες αὐτῷ πληγάς
  choice: wobei sie ihm viele Schläge versetzten
  rationale: Das Partizip erläutert die fortdauernde Geißelung; πληγαί sind Schläge oder Hiebe, und ἐπιρρίπτω wird im Deutschen idiomatisch mit „versetzen“ wiedergegeben.
theological_decisions:
- issue: Wesen der erscheinenden Gestalten
  choice: zwei weitere junge Männer
  alternative: zwei Engel / zwei himmlische Wesen
  rationale: Der griechische Text nennt sie νεανίαι und beschreibt ihre Kraft, Schönheit und Kleidung, bezeichnet sie in diesem Vers aber nicht ausdrücklich als Engel. Die Übersetzung wahrt diese Offenheit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzteilung erhöht die Verständlichkeit, ohne die Abfolge oder die beschreibenden Parallelglieder des griechischen Satzes zu verändern.
