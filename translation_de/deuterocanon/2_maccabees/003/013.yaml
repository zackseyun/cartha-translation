translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die Satzstruktur bleibt nahe am griechischen Gedankengang; „bestand darauf“ vermeidet eine unnatürlich wörtliche Wiedergabe von πάντως ἔλεγεν. Der Fußnotenmarker steht bei der tatsächlich erläuterten Wendung.
