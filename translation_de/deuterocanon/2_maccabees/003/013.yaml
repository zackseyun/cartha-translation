  to: Der andere aber beharrte, weil er königliche Befehle hatte, nachdrücklich darauf, dass diese Dinge in den königlichen Schatz[a] gebracht werden müssten.
  rationale: Die Revision vermeidet mit „gebracht werden“ eine nicht ausdrücklich im griechischen Text enthaltene Verfahrensspezifizierung. „Beharrte ... nachdrücklich darauf“ gibt die fortdauernde, nachdrückliche Aussage (πάντως ἔλεγεν) in modernem Standarddeutsch wieder. Der Bezug und die vorsichtige Deutung von εἰς τὸ βασιλικόν bleiben unverändert.
