  text: But the other[a], because he had royal orders, kept insisting that these things were to be taken into the royal treasury.
translation:
  language: de
  text: Der andere aber beharrte, weil er königliche Befehle hatte, nachdrücklich darauf, dass diese Dinge in den königlichen Schatz[a] gebracht werden müssten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in den Schatz des Königs“. Das griechische εἰς τὸ βασιλικόν bezeichnet in diesem Zusammenhang wahrscheinlich den königlichen Fiskus oder Schatz.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δ᾽ ἕτερος
  choice: Der andere aber
  rationale: ἕτερος bezeichnet die andere Seite im Gegensatz zum zuvor genannten Sprecher; δέ markiert den Gegensatz. Die Formulierung fügt kein im Griechischen ungenanntes Substantiv hinzu.
- source_word: δι᾽ ἃς εἶχεν βασιλικὰς ἐντολάς
  choice: weil er königliche Befehle hatte
  rationale: διά mit dem Relativpronomen gibt hier den Grund seines Beharrens an. βασιλικάς ἐντολάς sind vom König ausgehende Befehle.
- source_word: πάντως ἔλεγεν
  choice: bestand … darauf … auf jeden Fall
  rationale: Das Imperfekt ἔλεγεν schildert anhaltendes oder wiederholtes Reden, während πάντως die nachdrückliche Geltung der Aussage hervorhebt. Die deutsche Wendung gibt beide Aspekte natürlich wieder.
- source_word: εἰς τὸ βασιλικὸν
  choice: in den königlichen Schatz
  rationale: Das substantivierte Neutrum βασιλικόν bezeichnet im Zusammenhang der beanspruchten Vermögenswerte wahrscheinlich den königlichen Fiskus beziehungsweise Schatz. Die Richtungsangabe εἰς wird mit „in den“ bewahrt.
- source_word: ἀναλημπτέα
  choice: überführt werden müssten
  rationale: Das Verbaladjektiv drückt Notwendigkeit oder Verpflichtung aus. „Überführt werden“ gibt die Verbringung der betreffenden Werte in den königlichen Schatz wieder, ohne eine bestimmte praktische Form der Einziehung festzulegen.
- source_word: ταῦτα
  choice: diese Dinge
  rationale: Die neutrale Pluralform wahrt den demonstrativen Bezug auf die zuvor behandelten Vermögenswerte, ohne sie näher zu bestimmen, als es der griechische Text tut.
