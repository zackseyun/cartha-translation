base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/003/025.yaml
  text: For a horse appeared to them with a fearsome rider[a], adorned with a most beautiful saddlecloth; and rushing headlong, it struck Heliodorus with its front hoofs[b], while the one seated on it appeared to be wearing golden armor.
translation:
  language: de
  text: Denn ihnen erschien ein Pferd mit einem furchterregenden Reiter, mit wunderschönem Pferdegeschirr geschmückt[a]. Es stürmte ungestüm und schlug Heliodor mit seinen Vorderhufen[b]. Der darauf saß, schien eine goldene Vollrüstung zu tragen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »mit prächtigem Pferdeschmuck ausgestattet«. Das griechische Wort bezeichnet die Zier- oder Ausrüstung eines Pferdes.'
    reason: lexical_alternative
  - marker: b
    text: Wörtlich kann das Verb »schüttelte« bedeuten; im Zusammenhang bezeichnet es offenbar heftige Schläge mit den Vorderhufen.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὤφθη
  choice: erschien
  rationale: Der Aorist Passiv von ὁράω bezeichnet hier das Sichtbarwerden; »erschien« gibt die plötzliche Manifestation natürlich wieder, ohne über ihre physische oder visionäre Art zu entscheiden.
- source_word: τις ἵππος
  choice: ein Pferd
  rationale: τις ist hier indefinit; im natürlichen Deutschen genügt der unbestimmte Artikel.
- source_word: φοβερὸν ἔχων τὸν ἐπιβάτην
  choice: mit einem furchterregenden Reiter
  rationale: φοβερός beschreibt den Reiter als Furcht einflößend. Die Konstruktion bleibt verständlich und eng am Griechischen.
- source_word: καλλίστῃ σαγῇ διακεκοσμημένος
  choice: prächtig mit schönstem Pferdegeschirr geschmückt
  rationale: σαγή bezeichnet die Zier- oder Ausrüstung des Pferdes. »Pferdegeschirr« ist weiter als »Satteldecke« und vermeidet eine nicht sicher belegte Verengung; der Superlativ καλλίστῃ wird mit »schönstem« gewahrt.
- source_word: φερόμενος δὲ ῥύδην
  choice: Es stürmte ungestüm heran
  rationale: Die Wendung vermittelt schnelle, heftige und unaufhaltsame Bewegung; die deutsche Formulierung gibt diese Dynamik idiomatisch wieder.
- source_word: ἔσεισεν
  choice: schlug … ein
  rationale: σείω bedeutet grundsätzlich »schütteln«, bezeichnet mit den Vorderhufen als Mittel hier aber ein heftiges Schlagen oder Bearbeiten.
- source_word: τὰς ἐμπροσθίους ὁπλάς
  choice: mit seinen Vorderhufen
  rationale: ὁπλή bezeichnet ausdrücklich den Huf; ἐμπροσθίους spezifiziert die vorderen Hufe.
- source_word: ὁ δὲ ἐπικαθήμενος
  choice: Der darauf saß
  rationale: Die substantivierte Partizipialform wird beschreibend wiedergegeben und nicht unnötig erneut durch »Reiter« ersetzt.
- source_word: χρυσῆν πανοπλίαν
  choice: eine goldene Vollrüstung
  rationale: πανοπλία bezeichnet die vollständige Rüstung; »Vollrüstung« erhält diese Genauigkeit besser als das allgemeinere »Rüstung«.
theological_decisions:
- issue: Art der Erscheinung in der Gerichtsszene im Tempel
  choice: Die Szene wird als konkretes Erscheinen eines Pferdes und Reiters erzählt, ohne ihre ontologische Art näher festzulegen.
  alternative: Die Erscheinung ausdrücklich als Vision oder als symbolisches Geschehen kennzeichnen.
  rationale: Der griechische Text schildert Erscheinung und Angriff mit konkreten Begriffen, erklärt jedoch nicht, ob das Geschehen physisch oder visionär war. Diese Spannung bleibt erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Kurze Hauptsätze bewahren die Wucht der Szene. »Heliodor« folgt der im Deutschen üblichen Namensform; »Pferdegeschirr« bleibt bewusst weiter als »Satteldecke«, da σαγή die dekorative Pferdeausrüstung bezeichnen kann.
