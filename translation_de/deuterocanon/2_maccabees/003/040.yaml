lexical_decisions:
- source_word: τὰ μὲν καθʼ Ἡλιόδωρον
  choice: die Sache mit Heliodor
  rationale: Die substantivierte neutrale Mehrzahl mit κατά fasst idiomatisch die Heliodor betreffenden Ereignisse zusammen. „Die Sache mit Heliodor“ bewahrt den abschließenden Rückblick und klingt in modernem Deutsch natürlich.
- source_word: γαζοφυλακίου
  choice: Schatzkammer
  rationale: Das Wort bezeichnet hier die Schatzkammer beziehungsweise den Tempelschatz. „Schatzkammer“ gibt den konkreten Aufbewahrungsort prägnant wieder.
- source_word: τήρησιν
  choice: Bewahrung
  rationale: τήρησις bezeichnet das Bewahren, Hüten oder Schützen. „Bewahrung“ lässt offen, ob vor allem der Schutz oder der Erhalt der Schatzkammer gemeint ist.
- source_word: οὕτως
  choice: so
  rationale: Das Adverb verweist rückblickend auf den eben erzählten Verlauf; „so“ ist knapp, idiomatisch und entspricht dem abschließenden Charakter des Satzes.
- source_word: ἐχώρησεν
  choice: verlief
  rationale: In dieser narrativen Zusammenfassung bezeichnet das Verb, wie die Angelegenheit vor sich ging beziehungsweise ausging. „Verlief“ ist natürlich und vermeidet eine unnötig technische Formulierung.
