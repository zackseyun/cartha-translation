  text: And the matter concerning Heliodorus and the safeguarding of the treasury proceeded in this way[a].
translation:
  language: de
  text: So nahmen die Ereignisse um Heliodor und die Sicherung der Schatzkammer ihren Lauf.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
