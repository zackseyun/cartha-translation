  text: So then they were calling on the all-powerful Lord to keep what had been entrusted to those who had made the deposit safe with all security[a].
translation:
  language: de
  text: So riefen sie den allmächtigen Herrn an, das Gut derer, die es zur Verwahrung anvertraut hatten, unversehrt und mit aller Sicherheit zu bewahren.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „das den Anvertrauenden Anvertraute“; gemeint ist das Gut, das diese Personen zur sicheren Verwahrung übergeben hatten.'
    reason: Die eng verwandten aktiven und passiven Partizipien πεπιστευκόσιν und πεπιστευμένα ergeben im Griechischen eine knappe Wortfigur, die sich im Deutschen nur schwer natürlich nachbilden lässt.
lexical_decisions:
- source_word: ἐπεκαλοῦντο
  choice: riefen … an
  rationale: Der Imperfekt bezeichnet das andauernde Gebet; „jemanden anrufen“ gibt den religiösen Sinn im Deutschen natürlich wieder.
- source_word: παγκρατῆ
  choice: allmächtigen
  rationale: Das Adjektiv bezeichnet den, der Macht über alles hat. „Allmächtig“ ist die geläufige, würdevolle deutsche Entsprechung.
- source_word: κύριον
  choice: Herrn
  rationale: Κύριος ist hier die ehrfürchtige Gottesbezeichnung „Herr“.
- source_word: τὰ πεπιστευμένα
  choice: das anvertraute Gut
  rationale: Das substantivierte Perfektpartizip bezeichnet die zur sicheren Verwahrung übergebenen Vermögenswerte; der deutsche Kollektivausdruck ist präzise und gut verständlich.
- source_word: τοῖς πεπιστευκόσιν
  choice: für diejenigen, die es anvertraut hatten
  rationale: Das aktive Perfektpartizip bezeichnet die Personen, die ihr Gut zur Verwahrung übergeben hatten. „Für“ macht den begünstigenden Sinn des Dativs verständlich, ohne Eigentumsverhältnisse über den Kontext hinaus festzulegen.
- source_word: σῶα
  choice: unversehrt
  rationale: Das prädikative Adjektiv beschreibt das anvertraute Gut als heil und unbeschädigt bewahrt.
- source_word: διαφυλάσσειν
  choice: zu bewahren
  rationale: Das Verb bezeichnet sorgfältiges, sicheres Hüten und Erhalten; „bewahren“ trägt diese Schutzbedeutung.
- source_word: μετὰ πάσης ἀσφαλείας
  choice: in völliger Sicherheit
  rationale: Die Wendung verstärkt die Art der Bewahrung und wird in natürlichem Deutsch eng am griechischen Sinn wiedergegeben.
theological_decisions:
- issue: Wiedergabe der Gottesbezeichnung κύριον
  choice: Herrn
  alternative: Gebieter
  rationale: Im Zusammenhang des Gebets ist κύριος die ehrfürchtige Gottesbezeichnung. „Herr“ bewahrt diese Funktion, ohne eine zusätzliche konfessionelle Deutung einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung bleibt dem griechischen Gebetsinhalt nahe, während „das anvertraute Gut“ die im Deutschen schwerfällige substantivierte Partizipialkonstruktion verständlich wiedergibt. Das am Anfang der gelieferten Quelle stehende Fragment „κίαν.“ gehört offenbar zum vorangehenden Text und wurde wegen des ausgewiesenen geringfügigen Quellenabgleichfehlers nicht in Vers 22 aufgenommen.
