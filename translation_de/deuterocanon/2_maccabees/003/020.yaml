  text: And all of them[a], stretching out their hands toward heaven[b], were making supplication.
translation:
  language: de
  text: Und sie alle[a] streckten die Hände zum Himmel aus und flehten inständig.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „alle“; die griechische Form ist feminin und bezieht sich wahrscheinlich auf die zuvor genannten Frauen.'
    reason: lexical_alternative
  - marker: b
    text: Das griechische Wort bezeichnet hier eine inständige Bitte oder ein Flehen, nicht notwendig eine förmliche „Litanei“ im späteren kirchlichen Sinn.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶσαι
  choice: sie alle
  rationale: Die feminine Pluralform verweist wahrscheinlich auf die Frauen im vorausgehenden Zusammenhang. „Sie alle“ wahrt diesen Rückbezug, ohne das Bezugswort im Vers ausdrücklich zu wiederholen.
- source_word: προτείνουσαι
  choice: streckten … aus
  rationale: Das Partizip bezeichnet das Ausstrecken beziehungsweise Vorstrecken der Hände; im Deutschen lässt es sich natürlich mit dem finiten Verb und dem anschließenden Prädikat koordinieren.
- source_word: τὰς χεῖρας
  choice: die Hände
  rationale: Der griechische Artikel kann bei Körperteilen im Deutschen idiomatisch ebenfalls mit dem bestimmten Artikel wiedergegeben werden; die Zugehörigkeit ergibt sich aus dem Subjekt.
- source_word: εἰς τὸν οὐρανόν
  choice: zum Himmel
  rationale: Die Wendung bezeichnet die Richtung der Gebärde. Im Gebetszusammenhang ist „Himmel“ treffender als „Himmelsgewölbe“ oder „Luftraum“.
- source_word: ἐποιοῦντο
  choice: flehten
  rationale: Das imperfektische Verb bildet mit λιτανείαν eine Wendung für ein andauerndes inständiges Bitten. Im Deutschen gibt ein einfaches, kontextuell präzises Verb die Handlung natürlicher wieder als „vollzogen eine Bitte“.
- source_word: τὴν λιτανείαν
  choice: inständig
  rationale: Das Substantiv bezeichnet hier eine dringliche Bitte beziehungsweise ein Flehen. Die adverbiale Wiedergabe zusammen mit „flehten“ vermeidet die später kirchlich geprägte Bedeutung von „Litanei“.
theological_decisions:
- issue: Bedeutung von οὐρανός bei der Gebetsgebärde
  choice: Himmel
  alternative: Himmelsraum
  rationale: Der Zusammenhang schildert eine Gebetsgebärde; „Himmel“ bewahrt sowohl die räumliche Richtung als auch den religiösen Bezug, ohne diesen näher dogmatisch auszugestalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die koordinierte Verbform vermeidet eine schwerfällige Nachbildung der griechischen Partizipialkonstruktion; „flehten inständig“ gibt die dringliche und andauernde Gebetshandlung klar wieder.
