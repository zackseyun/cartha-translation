  text: And the women[a], with sackcloth bound under their breasts, were crowding the streets; and the virgins who were shut in, some were running together to the gates, others to the walls[c][b], and some were peering out through the windows.
translation:
  language: de
  text: Die Frauen, die sich Sacktuch[a] unterhalb der Brüste umgebunden hatten, drängten sich zahlreich auf den Straßen.[b] Von den Jungfrauen, die eingeschlossen waren, liefen die einen zu den Toren, die anderen auf die Mauern, und einige spähten durch die Fenster hinaus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sacktuch war ein grober Stoff, der als Zeichen von Trauer, Not oder Buße getragen wurde.
    reason: cultural_note
  - marker: b
    text: 'Wörtlich heißt es im Griechischen etwa: „Sie wurden auf den Straßen immer zahlreicher.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπεζωσμέναι ... σάκκους ὑπὸ τοὺς μαστούς
  choice: hatten sich Sacktuch unterhalb der Brüste umgebunden
  rationale: Die Formulierung gibt das Umgürten beziehungsweise Befestigen des Sacktuchs unterhalb der Brüste anschaulich und in natürlichem Deutsch wieder.
- source_word: κατὰ τὰς ὁδοὺς ἐπλήθυνον
  choice: drängten in großer Zahl durch die Straßen
  rationale: ἐπλήθυνον bezeichnet hier das zahlreiche Auftreten der Frauen; die Wiedergabe wahrt diesen Sinn, ohne das im Deutschen missverständliche Bild des Sich-Vermehrens zu übernehmen.
- source_word: κατάκλειστοι τῶν παρθένων
  choice: Von den Jungfrauen, die eingeschlossen lebten
  rationale: κατάκλειστοι bedeutet eingeschlossen oder in Abgeschlossenheit gehalten; παρθένοι wird spezifisch mit „Jungfrauen“ wiedergegeben.
- source_word: συνέτρεχον ἐπὶ τοὺς πυλῶνας
  choice: liefen ... zu den Toren
  rationale: Das Verb bezeichnet ein eiliges Zusammenlaufen; im Deutschen ergibt sich der kollektive Bezug bereits aus der pluralischen Gruppe.
- source_word: ἐπὶ τὰ τείχη
  choice: auf die Mauern
  rationale: Die Präposition mit Akkusativ bezeichnet hier die Bewegung hinauf beziehungsweise auf die Stadtmauern.
- source_word: διὰ τῶν θυρίδων διεκύπτον
  choice: spähten durch die Fenster hinaus
  rationale: διεκύπτον beschreibt ein fortdauerndes oder wiederholtes Herausschauen; „spähten ... hinaus“ vermittelt die angespannte Beobachtung aus dem Inneren.
