base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/003/009.yaml
  text: And when he arrived in Jerusalem and was courteously received by the high priest of the city[a], he reported the manifestation that had taken place, explained for what reason he was present, and inquired whether these things were truly so.
translation:
  language: de
  text: Als er in Jerusalem angekommen und vom Hohepriester der Stadt freundlich empfangen worden war, berichtete er von der erfolgten Mitteilung[a], erklärte, aus welchem Grund er da war, und erkundigte sich, ob diese Angaben tatsächlich zutrafen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „von der erfolgten Offenlegung“; das griechische Wort kann eine Kundgabe, Offenlegung oder Manifestation bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παραγενηθεὶς
  choice: als er … angekommen … war
  rationale: Das aoristische Partizip bezeichnet die der anschließenden Unterredung vorausgehende Ankunft; die deutsche Nebensatzkonstruktion gibt den zeitlichen Zusammenhang natürlich wieder.
- source_word: φιλοφρόνως … ἀποδεχθεὶς
  choice: freundlich empfangen worden war
  rationale: Die Verbindung bezeichnet einen wohlwollenden, höflichen Empfang. „Freundlich“ ist gegenwärtiges, würdevolles Standarddeutsch, ohne die Herzlichkeit zu überzeichnen.
- source_word: ὑπὸ τοῦ ἀρχιερέως τῆς πόλεως
  choice: vom Hohen Priester der Stadt
  rationale: Die Genitivfügung wird formal bewahrt; „Hoher Priester“ ist die geläufige deutsche Amtsbezeichnung.
- source_word: ἀνέθετο
  choice: berichtete er
  rationale: Das Verb bezeichnet hier das Darlegen beziehungsweise Vortragen einer Angelegenheit gegenüber dem Hohen Priester.
- source_word: περὶ τοῦ γεγονότος ἐμφανισμοῦ
  choice: von der erfolgten Bekanntmachung
  rationale: ἐμφανισμός kann eine Kundgabe oder Offenlegung bezeichnen; im Erzählzusammenhang geht es wahrscheinlich um die zuvor bekannt gewordene Information über den Tempelschatz. Die Fußnote wahrt die mögliche Wiedergabe als „Erscheinung“.
- source_word: καί τινος ἕνεκεν πάρεστι, διεσάφησεν
  choice: erklärte, aus welchem Grund er da war
  rationale: Die Übersetzung gibt sowohl das Klarstellen durch διεσάφησεν als auch die präsentische Anwesenheit in πάρεστι idiomatisch wieder.
- source_word: ἐπυνθάνετο
  choice: erkundigte sich
  rationale: Der Imperfekt bezeichnet sein Nachfragen; „erkundigte sich“ bewahrt den formellen Erzählton.
- source_word: εἰ ταῖς ἀληθείαις ταῦτα οὕτως ἔχοντα τυγχάνει
  choice: ob es sich wirklich so verhielt
  rationale: Die idiomatische Formulierung gibt die Frage wieder, ob die berichteten Umstände tatsächlich so lagen, ohne das schwerfällige griechische Gefüge nachzubilden.
theological_decisions:
- issue: Bedeutung von ἐμφανισμός
  choice: Bekanntmachung
  alternative: Erscheinung / Offenbarung
  rationale: Im unmittelbaren Zusammenhang bezeichnet das Wort am ehesten die Mitteilung beziehungsweise Offenlegung der Angaben über den Tempelschatz, kann lexikalisch jedoch auch eine Erscheinung oder Manifestation meinen. Diese Mehrdeutigkeit wird in der Fußnote ausdrücklich erhalten.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem historischem Erzählton. Die lange griechische Satzperiode bleibt in einem flüssigen deutschen Satz erhalten; die lexikalische Mehrdeutigkeit von ἐμφανισμός wird nicht stillschweigend aufgelöst.
