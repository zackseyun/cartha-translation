  to: Als er in Jerusalem angekommen und vom Hohepriester der Stadt freundlich empfangen worden war, berichtete er von der erfolgten Mitteilung[a], erklärte, aus welchem Grund er da war, und erkundigte sich, ob diese Angaben tatsächlich zutrafen.
  rationale: Die Überarbeitung verwendet die etablierte Amtsbezeichnung „Hohepriester“, gibt ἐμφανισμός im erzählerischen Zusammenhang als „Mitteilung“ wieder und hält die weitere lexikalische Spannweite in der Fußnote offen. Die abschließende Frage benennt die im Griechischen ausdrücklich genannten Angaben, ohne den Satz schwerfällig zu machen.
