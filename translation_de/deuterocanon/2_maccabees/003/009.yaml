  naturalness: Der Satz ist flüssiges modernes Standarddeutsch und wahrt den gehobenen erzählerischen Ton. „Vom Hohen Priester“ sollte jedoch in der üblichen biblisch-deutschen Amtsbezeichnung zu „vom Hohepriester“ vereinheitlicht werden. „Von der erfolgten Mitteilung“ ist natürlicher als „von der erfolgten Bekanntmachung“.
  terminology: „Hohepriester“ ist die geläufige deutsche Bezeichnung des jüdischen Amtes. Die Fußnote sollte die lexikalische Spannweite von ἐμφανισμός behutsam dokumentieren, ohne den kontextuell naheliegenden Sinn einer Mitteilung/Offenlegung durch eine primäre Lesart „Erscheinung“ zu übersteuern.
