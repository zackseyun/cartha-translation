base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/003/034.yaml
  text: But you[a], having been scourged from heaven, proclaim to all the majestic power of God. And when they had said these things[b], they became invisible.
translation:
  language: de
  text: Du aber, vom Himmel her gegeißelt, verkünde allen Gottes majestätische Macht.[a] Nachdem sie dies gesagt hatten, wurden sie unsichtbar.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die Größe der Macht Gottes«. Der griechische Ausdruck verbindet Begriffe für Größe oder Majestät und für Macht oder Stärke.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »verschwanden sie« beziehungsweise »entschwanden sie den Blicken«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μεμαστιγωμένος
  choice: gegeißelt
  rationale: Das Perfekt Passiv bezeichnet eine bereits erlittene schwere körperliche Züchtigung. »Gegeißelt« bewahrt die Bildkraft und den würdigen Erzählton.
- source_word: ἐξ οὐρανοῦ
  choice: vom Himmel her
  rationale: Die Wendung bezeichnet den himmlischen Ursprung der Geißelung, ohne die göttliche Urheberschaft ausdrücklich zu ergänzen.
- source_word: διάγγελλε
  choice: verkünde
  rationale: Der Imperativ fordert dazu auf, Gottes Machterweis öffentlich und weithin bekannt zu machen.
- source_word: πᾶσι
  choice: allen
  rationale: Der Dativ bezeichnet die umfassende Hörerschaft der Verkündigung.
- source_word: τὸ μεγαλεῖον ... κράτος
  choice: Gottes majestätische Macht
  rationale: Die Formulierung gibt sowohl den Gedanken der Größe und Majestät als auch den der wirksamen Macht in natürlichem Deutsch wieder.
- source_word: ἀφανεῖς ἐγένοντο
  choice: sie wurden unsichtbar
  rationale: Die möglichst formnahe Wiedergabe bewahrt den übernatürlichen Charakter und legt nicht fest, ob die Gestalten fortgingen oder lediglich nicht mehr wahrnehmbar waren.
theological_decisions:
- issue: Urheberschaft der vom Himmel kommenden Geißelung
  choice: vom Himmel her gegeißelt
  alternative: von Gott vom Himmel her gegeißelt
  rationale: Der griechische Text nennt den Himmel als Ursprung, aber Gott an dieser Stelle nicht ausdrücklich als Handelnden. Die Übersetzung vermeidet eine erklärende Ergänzung.
- issue: Verschwinden der himmlischen Gestalten
  choice: sie wurden unsichtbar
  alternative: sie verschwanden
  rationale: Die griechische Wendung beschreibt wörtlich ein Unsichtbarwerden. Diese offene Formulierung wahrt die übernatürliche Erzählweise, ohne einen Ortswechsel vorauszusetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Gegeißelt« ist bewusst gehoben, bleibt aber verständlich und entspricht der körperlichen Härte des griechischen Verbs. Die Satzfolge bleibt knapp und feierlich.
