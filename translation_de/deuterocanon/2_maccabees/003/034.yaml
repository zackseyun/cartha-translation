  source_fidelity: 'Der Text gibt die griechische Satzstruktur und die wesentlichen Bedeutungen zuverlässig wieder: Das perfektische Passiv μεμαστιγωμένος wird als bereits widerfahrene Geißelung ausgedrückt; ἐξ οὐρανοῦ bleibt ohne zusätzliche Benennung Gottes als Handelnden »vom Himmel her«; διάγγελλε πᾶσι wird treffend als öffentliche, an alle gerichtete Verkündigung wiedergegeben. »Gottes majestätische Macht« bildet τὸ μεγαλεῖον ... κράτος angemessen ab. »wurden sie unsichtbar« wahrt die bildhafte Offenheit von ἀφανεῖς ἐγένοντο.'
