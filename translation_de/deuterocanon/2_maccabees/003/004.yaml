base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/003/004.yaml
  text: But a certain Simon[a], of the tribe of Benjamin, having been appointed overseer of the temple, was at odds with the high priest about the administration of the market in the city.
translation:
  language: de
  text: Ein gewisser Simon aus dem Stamm Benjamin war zum Aufseher über den Tempel eingesetzt worden. Er geriet jedoch mit dem Hohepriester über die Marktaufsicht[a] in der Stadt in Streit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Marktverwaltung“ oder „Marktregulierung“. Das griechische Wort bezeichnet die öffentliche Aufsicht über das Marktgeschehen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προστάτης τοῦ ἱεροῦ
  choice: Aufseher über den Tempel
  rationale: προστάτης bezeichnet hier eine eingesetzte Aufsichts- oder Leitungsfunktion; ἱερόν meint den Tempelkomplex. Die Formulierung vermeidet, Simon einen priesterlichen Titel zuzuschreiben.
- source_word: καθεσταμένος
  choice: war … eingesetzt worden
  rationale: Das Partizip bezeichnet Simons bestellten beziehungsweise eingesetzten Amtsstatus und wird im Deutschen natürlich mit einem Plusquamperfekt wiedergegeben.
- source_word: διηχθῆναι τῷ ἀρχιερεῖ
  choice: geriet … mit dem Hohen Priester … in Streit
  rationale: Die Wendung beschreibt einen Konflikt oder ein Zerwürfnis, ohne notwendig offene Feindschaft auszudrücken.
- source_word: ἀγορανομίας
  choice: Marktaufsicht
  rationale: Der Begriff bezeichnet die behördliche Aufsicht und Regelung des Marktgeschehens; „Marktaufsicht“ ist knapp und im Deutschen verständlich.
- source_word: κατὰ τὴν πόλιν
  choice: in der Stadt
  rationale: Die Präpositionalphrase bezeichnet den städtischen Wirkungsbereich der Marktaufsicht und wird bewusst nicht enger als „städtischer Markt“ aufgelöst.
theological_decisions:
- issue: Art von Simons Amt am Tempel
  choice: Simon wird als eingesetzter Aufseher über den Tempel dargestellt, ohne dass ihm ein priesterlicher Rang zugeschrieben wird.
  alternative: Simon als Schutzherr oder Patron des Tempels zu verstehen.
  rationale: προστάτης … καθεσταμένος legt eine bestellte Aufsichtsfunktion nahe; der Vers selbst bezeichnet Simon nicht als Priester.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzfolge wurde für natürliche deutsche Lesbarkeit gegliedert; „jedoch“ gibt die kontrastive Funktion von δέ wieder. Die Stellung der Fußnotenmarke bindet sie eindeutig an „Marktaufsicht in der Stadt“.
