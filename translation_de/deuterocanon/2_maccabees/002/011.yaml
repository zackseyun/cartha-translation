base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/002/011.yaml
  text: And after many years had passed[a], when it pleased God, Nehemiah, having been sent by the king of Persia, sent the descendants of the priests who had hidden it to get the fire.
translation:
  language: de
  text: Als aber viele Jahre vergangen waren und Gott es für gut hielt[a], schickte Nehemia, den der König von Persien entsandt hatte, die Nachkommen der Priester, die das Feuer verborgen hatten, aus, um es zu holen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „es Gott gefiel“; auch: „Gott es für richtig hielt“.'
    reason: Lexikalische Alternativen für ὅτε ἔδοξεν τῷ θεῷ.
lexical_decisions:
- source_word: διελθόντων δὲ ἐτῶν ἱκανῶν
  choice: Als aber viele Jahre vergangen waren
  rationale: Der Genitivus absolutus bezeichnet verstrichene Zeit. ἱκανῶν meint hier eine beträchtliche Zahl von Jahren; „viele Jahre“ gibt dies natürlich und präzise wieder.
- source_word: ὅτε ἔδοξεν τῷ θεῷ
  choice: und Gott es für gut hielt
  rationale: ἔδοξεν mit Dativ bedeutet idiomatisch „es erschien jemandem gut“. Die Formulierung wahrt den Gedanken göttlicher Bestimmung, ohne ihn stärker auszudeuten.
- source_word: ἀποσταλεὶς Νεεμίας ἀπὸ τοῦ βασιλέως τῆς Περσίδος
  choice: Nehemia, den der König von Persien entsandt hatte
  rationale: Das passive Aoristpartizip bezeichnet eine der Haupthandlung vorausgehende Entsendung Nehemias im Auftrag des persischen Königs.
- source_word: τοὺς ἐκγόνους τῶν ἱερέων
  choice: die Nachkommen der Priester
  rationale: ἐκγόνους bezeichnet allgemein Nachkommen und sollte nicht ohne kontextuellen Zwang auf unmittelbare Söhne eingeengt werden.
- source_word: τῶν ἀποκρυψάντων
  choice: die das Feuer verborgen hatten
  rationale: Das Partizip bezieht sich grammatisch auf die Priester. Das im Griechischen unausgesprochene Objekt wird aus dem unmittelbaren Erzählzusammenhang als „das Feuer“ ergänzt.
- source_word: ἔπεμψεν ἐπὶ τὸ πῦρ
  choice: schickte … aus, um es zu holen
  rationale: πέμπω mit ἐπί und Akkusativ bezeichnet hier das Aussenden mit dem Ziel, das Feuer aufzusuchen beziehungsweise zu holen. „ausschicken, um es zu holen“ ist im Deutschen idiomatisch.
theological_decisions:
- issue: Göttliches Wollen in ὅτε ἔδοξεν τῷ θεῷ
  choice: Gott es für gut hielt
  alternative: es Gott gefiel / Gott es für richtig hielt
  rationale: Die gewählte Formulierung bleibt nahe an der griechischen Wendung und bringt Gottes Zeitpunkt beziehungsweise Willensentscheidung zum Ausdruck, ohne weitergehende dogmatische Aussagen einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt zusammenhängend, wird aber gegenüber der griechischen Wortfolge so geordnet, dass Subjekt, Auftraggeber und Zweck eindeutig verständlich sind. Das zweite „Feuer“ wird durch „es“ aufgenommen, um unnötige Wiederholung zu vermeiden.
