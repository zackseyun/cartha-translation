  yaml_path: translation/deuterocanon/2_maccabees/002/041.yaml
  text: Likewise also Judas gathered together for us all the things that had been scattered because of the war that had occurred[b][a], and they are with us.
translation:
  language: de
  text: Ebenso sammelte auch Judas für uns alles wieder zusammen, was infolge des Krieges, zu dem es gekommen war, zerstreut worden war[a], und es ist bei uns.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »was verstreut worden war«. Der griechische Text bezeichnet die Gegenstände in diesem Vers nicht genauer; der Zusammenhang legt jedoch gesammelte Aufzeichnungen oder Schriften nahe.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich steht im Griechischen: »und es ist bei uns«. Bei einem sächlichen Subjekt im Plural kann das Verb im Griechischen im Singular stehen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡσαύτως δὲ καὶ
  choice: Ebenso … auch
  rationale: Gibt sowohl den vergleichenden Anschluss an den vorherigen Satz als auch die additive Hervorhebung natürlich wieder.
- source_word: Ἰούδας
  choice: Judas
  rationale: Entspricht der im Deutschen üblichen Namensform für Judas Makkabäus.
- source_word: τὰ διεσπεπτωκότα … πάντα
  choice: alles …, was … zerstreut worden war
  rationale: Die breite, substantivierte Formulierung bewahrt, dass der griechische Text die Gegenstände hier nicht ausdrücklich als Schriften oder Aufzeichnungen bezeichnet; das Perfekt bezeichnet ihren fortbestehenden Zustand nach der Zerstreuung.
- source_word: διὰ τὸν γεγονότα πόλεμον
  choice: infolge des Krieges, zu dem es gekommen war
  rationale: Bewahrt den ursächlichen Zusammenhang und macht zugleich die durch das Partizip bezeichnete vorausgegangene Realität des Krieges sichtbar, ohne sie auf dessen Ausbruch zu verengen.
- source_word: ἡμῖν
  choice: für uns
  rationale: 'Gibt den Dativ am natürlichsten als Dativ des Vorteils wieder: Judas sammelte die verstreuten Dinge zugunsten der Gemeinschaft.'
- source_word: ἐπισυνήγαγεν
  choice: sammelte … wieder zusammen
  rationale: Das Verb bezeichnet das Zusammenbringen verstreuter Dinge; „wieder zusammen“ passt zum vorausgehenden Zustand der Zerstreuung.
- source_word: καὶ ἔστιν παρʼ ἡμῖν
  choice: und es ist bei uns
  rationale: Folgt der knappen griechischen Aussage und lässt offen, ob vor allem Verwahrung, Besitz oder Verfügbarkeit gemeint ist.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Formulierung bleibt bewusst allgemein, weil der Vers die gesammelten Gegenstände nicht ausdrücklich benennt; zugleich wird die knappe Aussage über ihre gegenwärtige Verwahrung nicht zu »in unserem Besitz« präzisiert.
