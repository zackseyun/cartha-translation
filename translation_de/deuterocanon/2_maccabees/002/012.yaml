base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/002/012.yaml
  text: As they explained to us that they had found not fire but thick water[a], he ordered them, after drawing some out, to bring it. Then when the things for the sacrifices had been brought forward[c][b], Nehemiah ordered the priests to sprinkle the water on both the wood and what was laid upon it.
translation:
  language: de
  text: Als sie uns erklärten, sie hätten kein Feuer, sondern dickes Wasser[a] gefunden, befahl er ihnen, etwas davon zu schöpfen[b] und herzubringen. Als dann die Opfergaben herbeigebracht worden waren, befahl Nehemia den Priestern, mit dem Wasser das Holz und das darauf Liegende zu besprengen[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: »zähflüssiges Wasser« oder »dicke Flüssigkeit«. Die griechische Formulierung ist ungewöhnlich und hebt vermutlich die seltsame Beschaffenheit des Stoffes hervor.'
    reason: lexical_alternative
  - marker: b
    text: Das hier gebrauchte griechische Wort ist selten und in dieser Form schwer zu deuten. Gemeint ist offenbar, dass sie etwas von der Flüssigkeit entnehmen und herbeibringen sollten.
    reason: textual_difficulty
  - marker: c
    text: 'Auch: »das Wasser auf das Holz und das darauf Liegende zu sprengen« oder allgemeiner: »auf sie zu bringen«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διεσάφησαν
  choice: erklärten
  rationale: Das Verb bezeichnet ein deutliches Darlegen oder Erklären; „erklärten“ ist natürlich und bewahrt den Mitteilungscharakter.
- source_word: μὴ εὑρηκέναι πῦρ ἀλλὰ ὕδωρ παχύ
  choice: sie hätten kein Feuer, sondern dickes Wasser gefunden
  rationale: Der abhängige Konjunktiv gibt die berichtete Aussage angemessen wieder. „Dickes Wasser“ erhält die auffällige und ungewöhnliche Formulierung des Griechischen.
- source_word: ἀποβλίψαντας
  choice: etwas davon zu schöpfen
  rationale: Die seltene bzw. schwierige Form bezeichnet im Zusammenhang offenbar das Entnehmen eines Teils der Flüssigkeit. „Schöpfen“ bleibt anschaulich, ohne das Verfahren unnötig festzulegen.
- source_word: φέρειν
  choice: herzubringen
  rationale: Das Bewegungsziel liegt bei Nehemia bzw. dem Opferplatz; „herzubringen“ gibt den Befehl idiomatisch wieder.
- source_word: ἀνηνέχθη τὰ τῶν θυσιῶν
  choice: die Opfergaben herbeigebracht worden waren
  rationale: Die elliptische Wendung bezeichnet das zum Opfer Gehörende. „Opfergaben“ ist im Deutschen natürlich, lässt aber offen, um welche einzelnen Bestandteile es sich handelt.
- source_word: ἐπιρᾶναι
  choice: über … zu gießen
  rationale: Das Verb bezeichnet hier das Aufbringen einer Flüssigkeit auf Holz und Aufliegendes. „Darübergießen“ ist gegenüber „besprengen“ semantisch weniger ritualisierend und passt zu der entnommenen Flüssigkeitsmenge.
- source_word: τά τε ξύλα καὶ τὰ ἐπικείμενα
  choice: das Holz und das darauf Liegende
  rationale: Die Formulierung bewahrt die unbestimmte substantivische Bezeichnung dessen, was auf dem Holz lag, ohne es ausdrücklich als Fleisch oder Opferstücke zu identifizieren.
- source_word: Νεεμίας
  choice: Nehemia
  rationale: Verwendet wird die im modernen deutschen Bibelgebrauch übliche Namensform.
theological_decisions:
- issue: Art des Aufbringens der Flüssigkeit auf die Opfermaterialien
  choice: das Wasser über das Holz und über das darauf Liegende zu gießen
  alternative: das Holz und das darauf Liegende mit dem Wasser zu besprengen
  rationale: Das griechische Verb erlaubt eine allgemeinere Vorstellung des Auf- oder Übergießens. Die gewählte Fassung vermeidet es, ohne zwingenden sprachlichen Grund einen bestimmten rituellen Sprengvorgang festzulegen.
- issue: Ungewöhnliche Bezeichnung der gefundenen Substanz
  choice: dickes Wasser
  alternative: zähflüssiges Wasser; dicke Flüssigkeit
  rationale: Die wörtlich auffällige Verbindung von „Wasser“ und „dick“ gehört zur Spannung der Erzählung und wird nicht erklärend geglättet.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau folgt dem griechischen Erzählablauf, ist aber für heutige Leser gegliedert. Auffällige Unbestimmtheiten und die ungewöhnliche Wendung „dickes Wasser“ bleiben erhalten.
