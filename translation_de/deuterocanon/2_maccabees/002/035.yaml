  yaml_path: translation/deuterocanon/2_maccabees/002/035.yaml
  text: And then the Lord will reveal these things[a], and the glory of the Lord and the cloud will appear, as it was shown in the case of Moses, and as Solomon also asked[d][c][b], that the place might be greatly sanctified.
translation:
  language: de
  text: Dann wird der Herr diese Dinge ans Licht bringen[a], und die Herrlichkeit des Herrn und die Wolke werden erscheinen, wie es sich bei Mose gezeigt hatte[b] und wie auch Salomo darum bat[c], dass der Ort in hohem Maß geheiligt werde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „offenbaren“ oder „bekannt machen“. Das griechische Verb kann das Offenlegen oder Sichtbarmachen von etwas Verborgenem bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher auch: „wie es bei Mose offenbar gemacht wurde“. Gemeint ist der frühere Vorgang göttlicher Offenbarung bei Mose.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „wie auch Salomo darum betete“. Das griechische Verb bezeichnet hier eine Bitte; der Zusammenhang legt eine Bitte im Gebet nahe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναδείξει
  choice: wird … ans Licht bringen
  rationale: Das Verb bezeichnet hier das Offenlegen oder Sichtbarmachen dessen, was zuvor verborgen war. „Ans Licht bringen“ ist im Deutschen natürlich und bewahrt den Bezug auf die verborgenen Dinge.
- source_word: ταῦτα
  choice: diese Dinge
  rationale: Die ausdrückliche, inhaltlich offene Rückverweisung des griechischen Demonstrativpronomens bleibt erhalten; der Kontext bestimmt, worauf sie sich bezieht.
- source_word: ὀφθήσεται
  choice: werden erscheinen
  rationale: Die passive Form von ὁράω hat häufig die intransitive Bedeutung „erscheinen“ oder „sichtbar werden“. Wegen der beiden verbundenen Subjekte steht im natürlichen Deutschen der Plural.
- source_word: δόξα τοῦ κυρίου
  choice: die Herrlichkeit des Herrn
  rationale: „Herrlichkeit“ bewahrt den vertrauten biblischen Ausdruck für die sichtbare Offenbarung göttlicher Gegenwart.
- source_word: ἡ νεφέλη
  choice: die Wolke
  rationale: Der bestimmte Artikel weist auf die aus den Heiligtumsüberlieferungen bekannte Wolke göttlicher Gegenwart hin, ohne sie im Haupttext weiter auszudeuten.
- source_word: ἐπὶ Μωσῇ ἐδηλοῦτο
  choice: wie es sich bei Mose gezeigt hatte
  rationale: Die Formulierung verweist auf das frühere Geschehen zur Zeit beziehungsweise im Fall des Mose. Das Plusquamperfekt macht den Rückblick im Deutschen klar.
- source_word: ἠξίωσεν
  choice: darum bat
  rationale: Im Zusammenhang bezeichnet das Verb Salomos Bitte um die Heiligung des Ortes. „Bat“ ist natürlich; „darum“ stellt den Bezug zum folgenden ἵνα-Satz her.
- source_word: ὁ τόπος
  choice: der Ort
  rationale: Die schlichte Wiedergabe lässt wie das Griechische den Kontext erkennen, dass der Heiligtumsort gemeint ist.
- source_word: καταγιασθῇ μεγάλως
  choice: in hohem Maß geheiligt werde
  rationale: „Geheiligt“ bewahrt den theologischen Gehalt des Verbs; „in hohem Maß“ gibt die adverbiale Verstärkung wieder, ohne eine bestimmte Art der Heiligung hinzuzufügen.
theological_decisions:
- issue: Wiedergabe von κύριος im theophanischen Kontext
  choice: Herr
  alternative: HERR
  rationale: Die Übersetzung folgt dem griechischen κύριος und setzt nicht ohne hebräische Vorlage die typografische Wiedergabe des Gottesnamens voraus.
- issue: Verhältnis von Herrlichkeit und Wolke
  choice: Beide werden als gemeinsam erscheinende Größen genannt
  alternative: Die Wolke ausdrücklich als bloßes Zeichen oder Behältnis der Herrlichkeit deuten
  rationale: Der griechische Text verbindet Herrlichkeit und Wolke, erklärt ihr genaues Verhältnis aber nicht. Diese Offenheit bleibt bestehen.
- issue: Salomos Bitte und die Heiligung des Ortes
  choice: Die Bitte wird sachlich auf die Heiligung des Ortes bezogen
  alternative: Eine bestimmte spätere Tempel- oder Gegenwartslehre ergänzen
  rationale: Die Übersetzung wahrt die historische und theophanische Aussage, ohne sie konfessionell auszubauen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit vertrauter biblischer Begrifflichkeit. Sperrige Gräzismen werden vermieden; die offenen Rückverweise und die theophanische Spannung des Ausgangstextes bleiben erhalten.
