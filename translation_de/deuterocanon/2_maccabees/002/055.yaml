translation:
  language: de
  text: wobei wir die genaue Behandlung der einzelnen Punkte dem Verfasser überlassen[a] und uns bemühen, den Grundlinien der Kurzfassung zu folgen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wobei wir es dem Verfasser überlassen, jeden einzelnen Punkt genau zu untersuchen, und uns bemühen, an den vorgezeichneten Linien der Kurzfassung entlangzugehen.“ Der griechische Text verwendet literarische Begriffe, die den Unterschied zwischen einem ausführlichen Werk und seiner gekürzten Fassung beschreiben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διακριβοῦν
  choice: die genaue Behandlung
  rationale: Der substantivierte Infinitiv bezeichnet hier im literarischen Zusammenhang die präzise, ausführliche Bearbeitung des Stoffes; „genaue Behandlung“ wahrt sowohl den Genauigkeitsaspekt als auch den Gegensatz zur Kurzfassung.
- source_word: περὶ ἑκάστων
  choice: der einzelnen Punkte
  rationale: Die Formulierung gibt den distributiven Sinn wieder und bezeichnet natürlich die jeweiligen Gegenstände der umfassenderen Darstellung.
- source_word: τῷ συγγραφεῖ
  choice: dem Verfasser
  rationale: Gemeint ist der Urheber des umfangreicheren Geschichtswerks; „Verfasser“ passt zum gehobenen literarischen Kontext.
- source_word: παραχωρήσαντες
  choice: überlassen
  rationale: Das Partizip bezeichnet, dass die Aufgabe der ausführlichen Darstellung dem Verfasser des größeren Werkes vorbehalten beziehungsweise überlassen wird.
- source_word: ἐπιπορεύεσθαι
  choice: zu folgen
  rationale: In Verbindung mit ὑπογραμμοῖς bezeichnet das Verb ein Fortschreiten entlang vorgegebener Linien; „folgen“ ist im Deutschen klar und idiomatisch.
- source_word: ὑπογραμμοῖς
  choice: den Grundlinien
  rationale: Das Wort bezeichnet vorgezeichnete Linien, einen Entwurf oder Umriss. „Grundlinien“ bewahrt das Bild und eignet sich für den Aufbau einer gekürzten Darstellung.
- source_word: ἐπιτομῆς
  choice: der Kurzfassung
  rationale: ἐπιτομή ist der literarische Fachbegriff für die gekürzte Fassung eines größeren Werkes. „Kurzfassung“ ist in modernem Deutsch verständlich und präzise.
- source_word: σπουδάζοντες
  choice: uns bemühen
  rationale: Das Partizip drückt ernsthaften, sorgfältigen Einsatz aus; „uns bemühen“ gibt diesen Sinn natürlich wieder.
