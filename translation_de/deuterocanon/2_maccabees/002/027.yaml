  text: Just as it is not easy for one who prepares a banquet and seeks the advantage of others[a], yet for the gratitude of the many we will gladly endure the hardship;
translation:
  language: de
  text: Wie es für jemanden, der ein Festmahl vorbereitet und auf den Nutzen anderer bedacht ist, nicht leicht ist, so wollen wir dennoch um der Dankbarkeit der vielen willen die Mühe gern auf uns nehmen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθάπερ
  choice: Wie
  rationale: Leitet den Vergleich natürlich ein; das korrelative „so“ im zweiten Satzteil macht die Beziehung im Deutschen deutlich.
- source_word: τῷ παρασκευάζοντι συμπόσιον
  choice: für jemanden, der ein Festmahl vorbereitet
  rationale: Gibt den Dativ der betroffenen Person und das gehobene, gemeinschaftliche Mahl verständlich und würdig wieder.
- source_word: καὶ ζητοῦντι τὴν ἑτέρων λυσιτέλειαν
  choice: und auf den Nutzen anderer bedacht ist
  rationale: Bewahrt die zielgerichtete Bedeutung von ζητεῖν und gibt λυσιτέλεια idiomatisch als Nutzen beziehungsweise Vorteil wieder.
- source_word: οὐκ εὐχερές
  choice: nicht leicht ist
  rationale: Direkte und natürliche Wiedergabe der unpersönlichen Aussage über die Schwierigkeit.
- source_word: ὅμως
  choice: dennoch
  rationale: Markiert den einräumenden Gegensatz klar.
- source_word: διὰ τὴν τῶν πολλῶν εὐχαριστίαν
  choice: um der Dankbarkeit der vielen willen
  rationale: Gibt εὐχαριστία in seinem gewöhnlichen hellenistisch-griechischen Sinn als Dankbarkeit wieder und bewahrt τῶν πολλῶν als „der vielen“.
- source_word: ἡδέως
  choice: gern
  rationale: Drückt die bereitwillige Haltung trotz der Mühe in natürlichem Deutsch aus.
- source_word: τὴν κακοπάθειαν ὑποίσομεν
  choice: die Mühe gern auf uns nehmen
  rationale: Das idiomatische deutsche Gefüge vermittelt sowohl die belastende Arbeit als auch das freiwillige Tragen, ohne körperliches Leiden zu überzeichnen.
theological_decisions:
- issue: Bedeutung von εὐχαριστία
  choice: Dankbarkeit
  alternative: Eucharistie
  rationale: In diesem hellenistisch-jüdischen Zusammenhang bezeichnet das Wort Dankbarkeit beziehungsweise Dank, nicht den späteren christlichen liturgischen Fachbegriff.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die lange Vergleichsstruktur des Griechischen bleibt erhalten, wird aber durch die deutsche Korrelation „Wie …, so …“ übersichtlich gestaltet.
