  yaml_path: translation/deuterocanon/2_maccabees/002/032.yaml
  text: So then[a], let us begin the narrative from this point, adding only this much to what has been said before; for it is foolish to be excessive before the history and to abridge the history itself.
translation:
  language: de
  text: Von diesem Punkt an wollen wir nun mit der Erzählung beginnen und dem zuvor Gesagten nur dies hinzufügen; denn es ist töricht, vor dem Geschichtsbericht zu ausführlich zu werden, den Geschichtsbericht selbst aber zu kürzen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Für »Geschichtsbericht« kann in beiden Vorkommen auch »Darstellung« oder »Bericht« stehen. Das griechische Wort ἱστορία bezeichnet hier eine geschichtliche Darstellung und nicht notwendig »Geschichte« im modernen wissenschaftlichen Sinn.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐντεῦθεν οὖν
  choice: Von hier aus ... nun
  rationale: Kennzeichnet den Übergang vom Vorwort zur eigentlichen Erzählung und bewahrt sowohl den Ausgangspunkt als auch die weiterführende Funktion von οὖν.
- source_word: ἀρξώμεθα τῆς διηγήσεως
  choice: wollen wir ... mit der Erzählung beginnen
  rationale: Gibt den hortativen Konjunktiv natürlich wieder; διήγησις bezeichnet hier die nun einsetzende erzählende Darstellung.
- source_word: τοῖς προειρημένοις τοσοῦτον ἐπιζεύξαντες
  choice: dem zuvor Gesagten nur noch dies hinzufügen
  rationale: Drückt das Anfügen einer letzten, begrenzten Bemerkung an die vorausgehenden Ausführungen idiomatisch aus.
- source_word: εὔηθες
  choice: töricht
  rationale: Bezeichnet hier mangelndes Urteil bei der Gestaltung eines Werkes; „töricht“ ist klar, würdig und ausreichend kräftig.
- source_word: πλεονάζειν
  choice: sich ... in zu vielen Worten zu ergehen
  rationale: Gemeint ist ein unangemessen ausführliches Vorwort. Die deutsche Wendung macht diesen literarischen Sinn verständlich, ohne den Gedanken bloß auf Umfang zu reduzieren.
- source_word: ἱστορία
  choice: Geschichtsbericht
  rationale: Bezeichnet den Bericht über die geschichtlichen Ereignisse, nicht „Geschichte“ als moderne akademische Disziplin; zugleich bleibt der Unterschied zur allgemeineren διήγησις erkennbar.
- source_word: ἐπιτέμνειν
  choice: kürzen
  rationale: Gibt das beschneidende Verkürzen des eigentlichen Berichts knapp und natürlich wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die antithetische Struktur des griechischen Satzes bleibt durch »vor ... selbst aber« erhalten; der schwerfällige Ausdruck »vor der Geschichte« wird zugunsten des sachlich genaueren »vor dem Geschichtsbericht« vermieden.
