translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Hauptfassung folgt der grammatisch naheliegenden Zuordnung des singularischen Partizips συνοικῶν zu Antiochus, vermeidet jedoch eine übergenaue Bestimmung seines Verhältnisses zu der genannten Frau. Die erhebliche syntaktische Unsicherheit wird in der Fußnote offengelegt.
