translation:
  language: de
  text: Denn als Antiochus, der mit ihr zusammenlebte, mit seinen Begleitern zu dem Ort kam, ging es ihm vor allem darum, sich der größeren Geldsumme zu bemächtigen – unter dem Vorwand einer Überprüfung.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der überlieferte griechische Satz ist syntaktisch schwierig. Insbesondere sind die Bezüge des singularischen Partizips, des folgenden Verbs und der Pronomen unsicher. συνοικῶν αὐτῇ kann „der mit ihr zusammenlebte“ bedeuten; im Zusammenhang wird auch eine Deutung wie „als Antiochus und seine Begleiter sie zu dem Ort begleiteten“ erwogen. Die Schlusswendung kann auch „um mehr Geld zu erlangen, mit einer Überprüfung als Begründung“ verstanden werden.
    reason: textual_variant
lexical_decisions:
- source_word: συνοικῶν αὐτῇ
  choice: der mit ihr zusammen war
  rationale: συνοικέω bedeutet wörtlich „mit jemandem zusammenwohnen“ und kann eine enge Lebensgemeinschaft bezeichnen. Die bewusst etwas offene Formulierung bewahrt das feminine Pronomen αὐτῇ, ohne wegen des schwierigen Zusammenhangs eine genauere Beziehung festzulegen.
- source_word: παρῆγεν εἰς τὸν τόπον
  choice: zu dem Ort kam
  rationale: παράγω kann je nach Konstruktion „hinführen“, „vorbeiführen“ oder intransitiv „hingehen/kommen“ bedeuten. Da im überlieferten Satz kein eindeutiges Objekt genannt ist, vermeidet diese Wiedergabe ein ergänztes „ihn“ oder „sie“.
- source_word: οἱ σὺν αὐτῷ φίλοι
  choice: mit seinen Freunden
  rationale: Natürliche deutsche Wiedergabe für die Freunde bzw. Vertrauten, die bei Antiochus waren.
- source_word: κύριον τὸ λαβεῖν
  choice: ging es ihm vor allem darum, … an sich zu nehmen
  rationale: Die schwierige Verbindung bezeichnet das Nehmen wahrscheinlich als Hauptzweck. „An sich nehmen“ gibt λαβεῖν wieder, während „vor allem darum“ die Funktion von κύριον ausdrückt.
- source_word: τὰ χρήματα πλείονα
  choice: die größere Geldsumme
  rationale: χρήματα bezeichnet Geld oder Vermögen; πλείονα weist am ehesten auf einen größeren Betrag hin. Wegen der rauen Syntax bleibt auch „mehr Geld“ möglich.
- source_word: εἰς ἐφορῆς λόγον
  choice: angeblich zu einer Besichtigung
  rationale: λόγος kann hier den angegebenen Grund bezeichnen, während ἐφορά mit Aufsicht, Prüfung oder Besichtigung zusammenhängt. „Angeblich“ bringt den wahrscheinlichen Vorwandcharakter idiomatisch zum Ausdruck.
