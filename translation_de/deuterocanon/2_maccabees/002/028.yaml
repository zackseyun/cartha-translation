translation:
  language: de
  text: Dabei überlassen wir es dem Verfasser, jeden einzelnen Punkt genau auszuführen, und mühen uns, den Grundlinien der Kurzfassung zu folgen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und strengen uns an, an den vorgezeichneten Linien der Kurzfassung entlangzugehen.“ Das Griechische ist stark verdichtet und betont die Mühe, die mit der gekürzten Darstellung verbunden ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διακριβοῦν
  choice: genau auszuführen
  rationale: Das substantivierte Infinitivgefüge bezeichnet die genaue, ins Einzelne gehende Behandlung des Stoffes. „Genau auszuführen“ gibt sowohl die Präzision als auch die schriftstellerische Darlegung natürlich wieder.
- source_word: περὶ ἑκάστων
  choice: jeden einzelnen Punkt
  rationale: Die Wendung ist distributiv und bezieht sich auf die jeweiligen Einzelheiten des Geschichtswerks.
- source_word: τῷ συγγραφεῖ παραχωρήσαντες
  choice: überlassen wir es dem Verfasser
  rationale: παραχωρέω bezeichnet hier das Überlassen einer Aufgabe oder Zuständigkeit; συγγραφεύς ist in diesem literarischen Zusammenhang der Verfasser des ausführlicheren Werkes.
- source_word: ἐπιπορεύεσθαι
  choice: zu folgen
  rationale: Zusammen mit ὑπογραμμοῖς beschreibt das Verb bildlich das Entlanggehen an vorgezeichneten Linien; „folgen“ ist dafür klares, idiomatisches Deutsch.
- source_word: ὑπογραμμοῖς
  choice: den Grundlinien
  rationale: Das Wort kann vorgezeichnete Linien, einen Umriss oder ein Muster bezeichnen. „Grundlinien“ bewahrt das Bild und passt zur Anlage einer gekürzten Darstellung.
- source_word: ἐπιτομῆς
  choice: der Kurzfassung
  rationale: Gemeint ist die gekürzte Bearbeitung eines umfangreicheren Werkes. „Kurzfassung“ ist im modernen Deutsch verständlicher als der Fachausdruck „Epitome“.
- source_word: ἀτονοῦντες
  choice: mühen uns
  rationale: Das Partizip hebt die Anstrengung bei der Arbeit an der gekürzten Darstellung hervor. „Mühen uns“ erhält diesen Akzent, ohne die gedrängte griechische Formulierung unnötig auszudeuten.
