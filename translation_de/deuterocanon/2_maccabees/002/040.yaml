base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/002/040.yaml
  text: The same things were also related in the records and in the memoirs concerning Nehemiah[a], and how, in founding a library, he gathered together the books about the kings and prophets, and the writings of David[b], and letters of kings concerning votive offerings.
translation:
  language: de
  text: 'Auch in den Aufzeichnungen und in den Denkschriften über Nehemia wurde dasselbe berichtet: wie er eine Bibliothek anlegte[a] und die Bücher über die Könige und Propheten, die Schriften Davids sowie Briefe von Königen über Weihegaben[b] zusammentrug.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eine Bibliothek gründete“ oder „eine Bibliothek einrichtete“. Das griechische Partizip bezeichnet hier das Anlegen oder Begründen einer Bibliothek.'
    reason: lexical_alternative
  - marker: b
    text: „Weihegaben“ sind Gaben oder Gegenstände, die Gott geweiht wurden; auch „geweihte Gaben“ ist möglich.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐξηγοῦντο
  choice: wurde … berichtet
  rationale: Die unpersönlich-passive Wiedergabe passt zum dokumentarischen Zusammenhang und lässt offen, ob der Vorgang eher als Erzählen oder als Darlegen verstanden wird.
- source_word: ἀναγραφαῖς
  choice: Aufzeichnungen
  rationale: Der Ausdruck bezeichnet schriftliche Aufzeichnungen oder archivalische Einträge; „Aufzeichnungen“ ist verständlich und hinreichend allgemein.
- source_word: ὑπομνηματισμοῖς
  choice: Denkschriften
  rationale: Das Wort bezeichnet erinnernde oder dokumentierende Schriften. „Denkschriften“ bewahrt den schriftlich-dokumentarischen Charakter, ohne moderne autobiografische Memoiren vorauszusetzen.
- source_word: τοῖς κατὰ τὸν Νεεμίαν
  choice: über Nehemia
  rationale: Die Wendung bezeichnet Schriften, die Nehemia betreffen, ohne ihn ausdrücklich als Verfasser festzulegen.
- source_word: καταβαλλόμενος βιβλιοθήκην
  choice: eine Bibliothek aufbaute
  rationale: Das Partizip beschreibt das Begründen oder Einrichten einer Bibliothek. „Aufbaute“ ist im Deutschen natürlich und bewahrt zugleich das Bild des Anlegens beziehungsweise Gründens.
- source_word: ἐπισυνήγαγεν
  choice: zusammentrug
  rationale: Das Verb betont das Sammeln an einem Ort; „zusammentrug“ gibt diese Bedeutung prägnant wieder.
- source_word: τὰ περὶ τῶν βασιλέων καὶ προφητῶν βιβλία
  choice: die Bücher über die Könige und Propheten
  rationale: περί bezeichnet hier am direktesten den Gegenstand der Bücher und nicht zwingend deren Verfasserschaft.
- source_word: τὰ τοῦ Δαυείδ
  choice: die Schriften Davids
  rationale: Die elliptische Formulierung verweist auf David zugeordnete Schriften, ohne sie enger als Psalmen oder als bestimmte Sammlung zu bestimmen.
- source_word: ἐπιστολὰς βασιλέων
  choice: Briefe von Königen
  rationale: Diese Formulierung gibt den Genitiv klar wieder, ohne aus den Schreiben eine bestimmte amtliche Gattung zu machen.
- source_word: ἀναθεμάτων
  choice: Weihegaben
  rationale: Im Tempelkontext sind Gott geweihte Gaben oder Gegenstände gemeint, nicht der spätere kirchliche Sinn von „Anathema“.
theological_decisions:
- issue: Bedeutung von ἀναθεμάτων
  choice: Weihegaben
  alternative: geweihte Gaben; Gott geweihte Gegenstände
  rationale: Der historische und kultische Zusammenhang spricht für Gaben, die Gott geweiht wurden. „Weihegaben“ vermeidet die irreführende spätere Bedeutung „Bannflüche“ und lässt offen, um welche Arten geweihter Gaben es sich handelte.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt nahe am Griechischen, wird aber durch den Doppelpunkt und die abschließende Stellung von „zusammentrug“ natürlich lesbar. Die Formulierungen vermeiden sowohl eine Festlegung Nehemias als Verfasser der Denkschriften als auch eine genauere Identifikation der David zugeschriebenen Schriften.
