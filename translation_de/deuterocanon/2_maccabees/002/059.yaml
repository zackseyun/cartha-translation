  text: Therefore let us begin the narrative from this point[a], adding only this much to what has been said before; for it is foolish to be excessive before the history[b], but to abridge the history itself.
translation:
  language: de
  text: 'Beginnen wir also von hier an mit der Erzählung[a] und fügen dem zuvor Gesagten nur dies hinzu: Denn es ist töricht, vor dem Geschichtsbericht allzu ausführlich zu sein, den Geschichtsbericht selbst aber zu kürzen.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit dem Bericht“; das griechische Wort διήγησις kann eine erzählende Darstellung oder einen Bericht bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „vor dem Geschichtsbericht zu viel zu sagen, den Geschichtsbericht selbst aber kurz abzuschneiden“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐντεῦθεν οὖν
  choice: nun von hier aus
  rationale: Kennzeichnet den folgernden Übergang vom Vorwort zur eigentlichen Darstellung. „Nun“ gibt οὖν natürlich wieder, während „von hier aus“ den Ausgangspunkt von Ἐντεῦθεν wahrt.
- source_word: ἀρξώμεθα
  choice: Beginnen wir
  rationale: Der hortative Konjunktiv der ersten Person Plural wird als einladende Aufforderung wiedergegeben.
- source_word: τῆς διηγήσεως
  choice: mit der Erzählung
  rationale: διήγησις bezeichnet hier die nun folgende erzählende Darstellung; „Erzählung“ ist verständlich und dem gehobenen literarischen Kontext angemessen.
- source_word: τοῖς προειρημένοις τοσοῦτον ἐπιζεύξαντες
  choice: und fügen wir dem zuvor Gesagten nur noch so viel hinzu
  rationale: Die Formulierung bewahrt den Rückverweis und den Gedanken, dem Vorangehenden lediglich eine begrenzte Schlussbemerkung anzufügen.
- source_word: εὔηθες
  choice: töricht
  rationale: Das Wort bewertet die beschriebene schriftstellerische Vorgehensweise als unvernünftig; „töricht“ wahrt den pointierten, würdigen Ton.
- source_word: τὸ μὲν πρὸ τῆς ἱστορίας πλεονάζειν
  choice: vor dem Geschichtsbericht zu ausführlich zu werden
  rationale: πλεονάζειν meint hier, im vorgeschalteten Stoff übermäßig ausführlich zu sein. Die Wiedergabe ist im Deutschen natürlich und erhält den Gegensatz zum Kürzen des Hauptberichts.
- source_word: τὴν δὲ ἱστορίαν ἐπιτέμνειν
  choice: den Geschichtsbericht selbst aber zu kürzen
  rationale: ἐπιτέμνειν bedeutet „kürzen“ oder „beschneiden“; „selbst“ verdeutlicht den im Griechischen angelegten Gegensatz zwischen Vorrede und eigentlichem Bericht.
