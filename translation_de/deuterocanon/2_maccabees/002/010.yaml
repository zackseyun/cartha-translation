  terminology: „Vorfahren“, „fromme Priester“, „Feuer des Altars“ und „weggeführt“ sind angemessen. „Wasserlos“ ist gegenüber „ausgetrocknet“ der präzisere Ausdruck für ἀνύδρου und vermeidet eine nicht belegte zeitliche Aussage.
