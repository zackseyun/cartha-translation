base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/002/010.yaml
  text: For when our fathers were being led away into Persia[a], the devout priests secretly took some of the fire from the altar and hid it in the hollow of a dry well, where they secured it so that the place would be unknown to everyone.
translation:
  language: de
  text: Denn als unsere Vorfahren nach Persien weggeführt wurden, nahmen die frommen Priester heimlich etwas von dem Feuer des Altars und verbargen es in der Höhlung eines wasserlosen Brunnens[a]. Dort sicherten sie es, sodass der Ort allen unbekannt blieb.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in einem Hohlraum eines wasserlosen Brunnens oder Schachts“. Die griechische Ortsbeschreibung ist stark verdichtet und etwas ungewöhnlich; sie verbindet Begriffe für einen Hohlraum und einen wasserlosen Brunnen oder Schacht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤγοντο
  choice: weggeführt wurden
  rationale: Die passive Form bezeichnet hier im Zusammenhang der Verschleppung eine unfreiwillige Wegführung und nicht eine freiwillige Reise.
- source_word: εἰς τὴν Περσικὴν
  choice: nach Persien
  rationale: Die Wendung bezeichnet das persische Land; „nach Persien“ ist im Deutschen die natürliche Richtungsangabe.
- source_word: οἱ πατέρες
  choice: unsere Vorfahren
  rationale: Im historischen Rückblick sind die Angehörigen der früheren Generationen gemeint; „Vorfahren“ ist im heutigen Deutsch klarer als das wörtliche „Väter“.
- source_word: εὐσεβεῖς
  choice: frommen
  rationale: „Fromm“ gibt die religiöse Ehrfurcht der Priester in verständlicher, würdiger Sprache wieder.
- source_word: λαβόντες ἀπὸ τοῦ πυρὸς τοῦ θυσιαστηρίου
  choice: nahmen etwas von dem Feuer des Altars
  rationale: Die Formulierung wahrt, dass sie einen Anteil des Altarfeuers nahmen, ohne anzunehmen, das gesamte Feuer sei fortgebracht worden.
- source_word: λαθραίως
  choice: heimlich
  rationale: Das Adverb bezeichnet eine vor anderen verborgene Handlung.
- source_word: κατέκρυφαν
  choice: verbargen
  rationale: Das Verb bedeutet verbergen oder verstecken; „verbargen“ passt zum würdigen Erzählregister, ohne ein Vergraben hinzuzufügen.
- source_word: ἐν κοιλώματι φρέατος τάξιν ἔχοντος ἀνύδρου
  choice: in der Höhlung eines ausgetrockneten Brunnens
  rationale: Die komprimierte griechische Beschreibung verbindet einen Hohlraum mit einem wasserlosen Brunnen oder Schacht. Die Übersetzung erhält beide Vorstellungen und markiert die sprachliche Unsicherheit in der Fußnote.
- source_word: κατησφαλίσαντο
  choice: verwahrten sie es so sicher
  rationale: Die mediale Verbform bezeichnet ein Sichern oder geschütztes Verwahren, ohne festzulegen, ob das Feuer versiegelt, abgedeckt oder auf andere Weise geschützt wurde.
- source_word: ὥστε πᾶσιν ἄγνωστον εἶναι τὸν τόπον
  choice: dass der Ort allen unbekannt blieb
  rationale: Dies gibt die Folge des Sicherns eng am Griechischen und zugleich idiomatisch wieder.
theological_decisions:
- issue: Bedeutung der Bewahrung des Altarfeuers
  choice: Die Übersetzung berichtet nur, dass fromme Priester einen Teil des Altarfeuers heimlich bewahrten.
  alternative: Die Handlung könnte als Sicherung der gottesdienstlichen Kontinuität nach der Verbannung oder allgemein als ehrfürchtige Bewahrung eines heiligen Elements verstanden werden.
  rationale: Der Vers selbst erläutert die rituelle oder theologische Bedeutung der Handlung nicht; daher wird keine weitergehende Lehre in den Text eingetragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Vorfahren“ vermeidet die mögliche Verengung von „Väter“ auf unmittelbare Eltern. Der Fußnotenmarker steht bei der tatsächlich erklärungsbedürftigen Ortsbeschreibung.
