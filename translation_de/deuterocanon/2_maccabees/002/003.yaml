translation:
  language: de
  text: Denn er selbst trieb die in der heiligen Stadt zum Kampf Aufgestellten nach Persien hinaus.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das griechische Wort παρατασσομένους ist ein militärischer Ausdruck und bezeichnet zum Kampf oder in Schlachtordnung Aufgestellte. Möglich ist auch die Wiedergabe: „die zum Kampf Aufgestellten“ oder „die in Schlachtordnung Stehenden“.'
    reason: lexical_alternative
  - marker: b
    text: Der überlieferte griechische Wortlaut ist an dieser Stelle im Zusammenhang schwer verständlich und könnte auf ein Problem der Textüberlieferung zurückgehen. Die Übersetzung bleibt daher nahe am vorhandenen griechischen Text.
    reason: textual_variant
lexical_decisions:
- source_word: αὐτὸς
  choice: er selbst
  rationale: Das selbstständige und betonte Pronomen hebt den Handelnden hervor; „er selbst“ bewahrt diese Betonung.
- source_word: γὰρ
  choice: denn
  rationale: Die Partikel leitet eine Begründung oder erläuternde Aussage ein; „denn“ gibt diese Verknüpfung im Deutschen unmittelbar wieder.
- source_word: ἐξέβρασεν
  choice: trieb … hinaus
  rationale: Das Verb bezeichnet ein gewaltsames Hinaustreiben oder Ausstoßen. Die geteilte deutsche Verbform ist anschaulich und wahrt die Bewegungsrichtung.
- source_word: τοὺς παρατασσομένους
  choice: diejenigen, die sich … zum Kampf aufgestellt hatten
  rationale: Das Partizip von παρατάσσω ist militärisch geprägt und bezeichnet das Aufstellen in Schlachtordnung. Die Formulierung gibt diesen Sinn verständlich wieder, ohne die Personen genauer zu bestimmen, als es der griechische Text tut.
- source_word: ἐν τῇ ἁγίᾳ πόλει
  choice: in der heiligen Stadt
  rationale: Die direkte Wiedergabe erhält die Bezeichnung des griechischen Textes, statt sie ausdrücklich durch den Eigennamen Jerusalem zu ersetzen.
- source_word: εἰς τὴν Περσίδα
  choice: nach Persien
  rationale: εἰς bezeichnet hier das Ziel der Bewegung. Bei Ländernamen ist „nach Persien“ im Deutschen die natürliche Entsprechung; zusammen mit „hinaus“ bleibt die gerichtete Bewegung erkennbar.
