lexical_decisions:
- source_word: Οἱ δὲ
  choice: aber
  rationale: δέ ist ein schwaches verbindendes beziehungsweise leicht absetzendes Partikel. „Aber“ wahrt diese Nuance, ohne einen starken Gegensatz zu erzwingen.
- source_word: ἱερεῖς
  choice: die Priester
  rationale: Der bestimmte Artikel kennzeichnet eine bereits bekannte oder aus dem Zusammenhang erkennbare Gruppe von Priestern.
- source_word: ἐπέαλλον
  choice: sangen
  rationale: Das Verb bezeichnet hier den gesanglichen Vortrag von Hymnen. „Sangen“ ist im modernen Deutschen natürlich und verständlich; der durative Aspekt des griechischen Imperfekts wird in der Fußnote erläutert.
- source_word: τοὺς ὕμνους
  choice: die Hymnen
  rationale: Die Wiedergabe erhält den bestimmten Artikel und den kultisch-liturgischen Charakter von ὕμνους.
