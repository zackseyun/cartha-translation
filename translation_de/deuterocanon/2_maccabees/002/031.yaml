translation:
  language: de
  text: Man sollte dem, der die Kurzfassung erstellt, zugestehen, nach einer knappen Ausdrucksweise zu streben und auf die ausführliche Behandlung des Stoffes zu verzichten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wer den Auszug erstellt“. Das griechische Wort kann auch „Übersetzung“ bedeuten; hier bezeichnet es im Zusammenhang jedoch die Kurzfassung eines umfangreicheren Werkes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σύντομον τῆς λέξεως
  choice: eine knappe Ausdrucksweise
  rationale: Das substantivisch gebrauchte σύντομον bezeichnet Kürze oder Knappheit; λέξις meint hier die sprachliche Ausdrucksweise, nicht ein einzelnes Wort.
- source_word: μεταδιώκειν
  choice: nach … zu streben
  rationale: Das Verb bezeichnet ein nachdrückliches Verfolgen oder Anstreben und wird im Deutschen natürlich mit „nach … streben“ wiedergegeben.
- source_word: τὸ ἐξεργαστικὸν τῆς πραγματίας
  choice: die ausführliche Behandlung des Stoffes
  rationale: ἐξεργαστικόν bezeichnet die eingehende Ausarbeitung; πραγματεία ist hier der behandelte Stoff beziehungsweise Gegenstand.
- source_word: παραιτεῖσθαι
  choice: auf … zu verzichten
  rationale: Das Medium bezeichnet hier das Ablehnen oder Sichenthalten von etwas; „verzichten“ passt zum bewussten Absehen von einer ausführlichen Darstellung.
- source_word: τῷ τὴν μετάφρασιν ποιουμένῳ
  choice: wer … den Auszug erstellt
  rationale: Im literarischen Zusammenhang des Prologs ist die Bearbeitung beziehungsweise Kurzfassung des größeren Werkes gemeint. Die deutsche Formulierung ist idiomatisch und bewahrt den Bezug auf den Auszug.
- source_word: συγχωρητέον
  choice: dem sollte man zugestehen
  rationale: 'Das Verbaladjektiv drückt eine unpersönliche Verpflichtung oder Angemessenheit aus: Etwas soll eingeräumt beziehungsweise zugestanden werden.'
theological_decisions:
- issue: Bedeutung von μετάφρασις im Kontext
  choice: Auszug/Kurzfassung
  alternative: Übersetzung
  rationale: Der Prolog beschreibt die Kürzung des fünfbändigen Werkes Jasons von Kyrene. Obwohl μετάφρασις auch „Übersetzung“ bedeuten kann, bezeichnet es hier kontextuell die bearbeitende Kurzfassung; die Fußnote hält die lexikalische Alternative offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur folgt dem griechischen Gegensatz zwischen knapper Ausdrucksweise und ausführlicher Stoffbehandlung, ohne unnötig schwerfällig zu wirken.
