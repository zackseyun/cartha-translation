  text: Therefore[a], if you have need, send those who will bring them to you.
translation:
  language: de
  text: Wenn ihr sie also braucht[a], schickt Leute, die sie euch bringen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im griechischen Text steht »wenn« (ἐὰν) zweimal; wahrscheinlich handelt es sich um eine Textunregelmäßigkeit oder versehentliche Verdoppelung. Die Übersetzung gibt den erkennbaren Sinn wieder.
    reason: textual_variant
lexical_decisions:
- source_word: ἐὰν ... χρείαν ἔχητε
  choice: wenn ihr sie braucht
  rationale: Die Wendung χρείαν ἔχειν bedeutet idiomatisch »Bedarf haben« bzw. »brauchen«. Das im Griechischen unausgesprochene Objekt wird aus dem Zusammenhang als »sie« ergänzt.
- source_word: οὖν
  choice: also
  rationale: οὖν kennzeichnet hier eine folgernde oder überleitende Aussage; »also« ist in einem modernen deutschen Brief natürlich und bewahrt diese Funktion.
- source_word: τοὺς ἀποκομιούντας
  choice: Leute, die sie euch bringen
  rationale: Das substantivierte Partizip bezeichnet Personen, die das zuvor Erwähnte überbringen. »Leute« gibt die unbestimmte Personengruppe natürlich wieder; »sie« ergänzt das kontextuell vorausgesetzte Objekt.
- source_word: ὑμῖν
  choice: euch
  rationale: Der Dativ bezeichnet bei ἀποκομίζω die Empfänger und wird im Deutschen mit »euch« wiedergegeben.
- source_word: ἀποστείλατε
  choice: schickt
  rationale: Der Aoristimperativ fordert zu einer konkreten Handlung auf. »Schickt« ist klar, gegenwärtig und dem Briefstil angemessen.
- source_word: ἐὰν οὖν ἐὰν
  choice: wenn ... also
  rationale: Der überlieferte griechische Text enthält ἐὰν doppelt. Die Übersetzung gibt die verständliche Bedingung nur einmal wieder und weist auf die Textunregelmäßigkeit in einer Fußnote hin.
