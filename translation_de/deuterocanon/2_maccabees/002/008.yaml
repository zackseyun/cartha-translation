    rationale: „Preisgegeben“ bezeichnet bei Personen klar und ohne Ergänzung eines Empfängers das Überlassen an ein Gericht bzw. Verderben und entspricht der im Audit Trail ausgewiesenen Bedeutung „gave over“.
