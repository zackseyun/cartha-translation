translation:
  language: de
  text: In jeder Hinsicht sei unser Gott gepriesen,[a] der diejenigen preisgegeben hat, die gottlos gehandelt haben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der für diesen Vers vorgelegte griechische Text ist ungewöhnlich kurz und wurde in den Quelldaten als erhebliche Abweichung gekennzeichnet. Die Übersetzung folgt diesem überlieferten Wortlaut, statt aus anderen Ausgaben einen längeren Text zu rekonstruieren.
    reason: textual_variant
lexical_decisions:
- source_word: κατὰ πάντα
  choice: in jeder Hinsicht
  rationale: Die Wendung verstärkt die Lobpreisung umfassend und bleibt im modernen Deutschen natürlich, ohne sie unnötig auf »völlig« einzuengen.
- source_word: εὐλογητὸς
  choice: sei … gepriesen
  rationale: In der doxologischen Formel gibt diese idiomatische deutsche Fügung den Sinn des prädikativen Adjektivs würdig und verständlich wieder.
- source_word: ἡμῶν ὁ θεός
  choice: unser Gott
  rationale: Entspricht der griechischen Genitivzuordnung und der im Deutschen üblichen Gottesbezeichnung ohne Artikel.
- source_word: ἔδωκεν
  choice: dahingegeben hat
  rationale: Da Personen das direkte Objekt bilden, bezeichnet das Verb hier ein Übergeben beziehungsweise Preisgeben; »dahingegeben« bewahrt den knappen, gerichtlichen Ton.
- source_word: τοὺς ἀσεβήσαντας
  choice: die Frevler
  rationale: Das substantivierte Aoristpartizip bezeichnet Menschen, die frevelhaft beziehungsweise gottlos gehandelt haben. »Frevler« ist knapp und wahrt den religiös-moralischen Gehalt.
theological_decisions:
- issue: Integrität des Ausgangstextes und kontextuelle Abweichung
  choice: Der vorgelegte griechische Wortlaut wird als kurze Lobpreisung mit anschließendem Hinweis auf das Gericht über die Frevler übersetzt; die erhebliche textliche Abweichung wird in einer Fußnote offengelegt.
  alternative: Andere Ausgaben oder Handschriften könnten an dieser Stelle einen längeren, kontextuell anders eingebetteten Wortlaut bieten.
  rationale: Die Übersetzung folgt konsequent dem bereitgestellten griechischen Primärzeugen und ergänzt keinen mutmaßlichen längeren Text. So bleiben sowohl die Quellenbindung als auch die bestehende Unsicherheit erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit doxologischem Klang. Die knappe und abrupt wirkende Gestalt des vorgelegten griechischen Textes wird nicht geglättet; der Fußnotenmarker [a] steht unmittelbar bei der Lobpreisungsformel.
