  naturalness: Der Satz bleibt knapp, würdig und im modernen Standarddeutsch gut verständlich. Die Umschreibung „diejenigen, die gottlos gehandelt haben“ ist natürlicher und genauer als das etwas gehobene, pauschalierende „die Frevler“.
  terminology: „gottlos gehandelt haben“ wahrt den religiös-ethischen Gehalt von ἀσεβήσαντας, ohne die engere Bedeutung „Sakrileg begangen“ zu behaupten. Die Fußnote bewahrt angemessen die durch die Quelldaten ausgewiesene Unsicherheit des ungewöhnlich kurzen griechischen Wortlauts.
