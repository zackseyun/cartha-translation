  text: And for us[a], who have undertaken the hardship of making the abridgment, the task is not easy, but a matter of sweat and sleeplessness;
translation:
  language: de
  text: Für uns jedoch, die wir die Mühsal auf uns genommen haben, eine Kurzfassung zu erstellen, ist die Aufgabe nicht leicht, sondern erfordert Schweiß und schlaflose Nächte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡμῖν μὲν τοῖς
  choice: Für uns aber, die wir
  rationale: Die Dativkonstruktion mit substantiviertem Partizip bezeichnet diejenigen, für die bzw. von deren Standpunkt aus die Aussage gilt. „Für uns aber, die wir“ ist im Deutschen natürlich und gibt μὲν als gliederndes „aber“ wieder.
- source_word: τὴν κακοπάθειαν
  choice: die Mühe
  rationale: κακοπάθεια bezeichnet Beschwernis, Mühsal oder Leiden. Im Zusammenhang redaktioneller Arbeit trifft „Mühe“ den Sinn, ohne eine Verfolgungs- oder Leidenssituation nahezulegen.
- source_word: ἐπιδεδιγμένοις
  choice: auf uns genommen haben
  rationale: Das perfekte mediale Partizip bezeichnet eine übernommene Verpflichtung mit fortdauernder Wirkung. Die Wendung bewahrt zudem den Gedanken persönlicher Selbstverpflichtung.
- source_word: τῆς ἐπιτομῆς
  choice: der Kurzfassung
  rationale: ἐπιτομή meint hier eine gekürzte Fassung eines umfangreicheren Werkes. „Kurzfassung“ ist gegenwärtiges, verständliches Deutsch und bezeichnet sowohl das Ergebnis als auch im Kontext die Arbeit seiner Herstellung.
- source_word: οὐ ῥᾴδιον
  choice: ist die Aufgabe nicht leicht
  rationale: Das im Griechischen elliptische Prädikat wird im Deutschen mit Bezug auf τὸ πρᾶγμα ausdrücklich formuliert.
- source_word: ἱδρῶτος δὲ καὶ ἀγρυπνίας
  choice: sondern mit Schweiß und schlaflosen Nächten verbunden
  rationale: Die Formulierung erhält das anschauliche Bild körperlicher Anstrengung und verlorenen Schlafes. „Schlaflose Nächte“ gibt ἀγρυπνία in diesem Arbeitszusammenhang idiomatisch wieder.
- source_word: τὸ πρᾶγμα
  choice: die Aufgabe
  rationale: πρᾶγμα bezeichnet hier das konkrete Unternehmen, die Kurzfassung herzustellen; „Aufgabe“ ist präzise und natürlich.
