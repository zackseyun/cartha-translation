  text: But when it happened that time had passed and the sun shone out[a], though it had been overcast, a great fire was kindled, so that everyone marveled.
translation:
  language: de
  text: Als aber Zeit vergangen war und die Sonne hervorschien[a], obwohl sie von Wolken bedeckt war, wurde ein großes Feuer entzündet, sodass alle staunten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „während sie von Wolken bedeckt war“. Der griechische Ausdruck ἐπινεφὴς ὤν lautet wörtlicher „bewölkt seiend“ und kann die gleichzeitige Begleitumstandsangabe ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ ἐγένετο καὶ χρόνος διῆλθεν
  choice: Als dann einige Zeit vergangen war
  rationale: Die Wendung leitet einen neuen zeitlichen Abschnitt der Erzählung ein. „Als dann“ gibt δέ und den Übergang natürlich wieder; „einige Zeit“ drückt den unbestimmten Zeitraum aus, ohne dessen Länge festzulegen.
- source_word: ὅ τε ἥλιος ἀνέλαμψεν
  choice: und die Sonne hervorstrahlte
  rationale: ἀναλάμπω bezeichnet ein Hervor- oder Aufstrahlen. „Hervorstrahlte“ passt zum geschilderten Gegensatz zur Bewölkung und bewahrt den gehobenen Erzählton.
- source_word: ἐπινεφὴς ὤν
  choice: obwohl sie zuvor von Wolken bedeckt gewesen war
  rationale: ἐπινεφής bedeutet „bewölkt, von Wolken bedeckt“. Die konzessive Wiedergabe ergibt im Zusammenhang einen natürlichen Sinn, doch die grammatisch mögliche gleichzeitige Lesart wird in der Fußnote bewahrt.
- source_word: ἀνήφθη πυρὰ μεγάλη
  choice: wurde ein großes Feuer entfacht
  rationale: Die passive Form ἀνήφθη wird als Passiv wiedergegeben. πυρά kann Feuer, Feuerstelle oder Scheiterhaufen bezeichnen; „Feuer“ bleibt hier bewusst allgemein und fügt keine nähere kultische Bestimmung hinzu.
- source_word: ὥστε θαυμάσαι πάντας
  choice: sodass alle staunten
  rationale: ὥστε mit Infinitiv bezeichnet hier die Folge; πάντας umfasst alle Anwesenden. „Staunten“ ist im modernen Deutsch natürlich und gibt θαυμάζω angemessen wieder.
theological_decisions:
- issue: Nähere Bestimmung des Feuers (πυρά)
  choice: „ein großes Feuer“ ohne kultische Präzisierung
  alternative: „ein großes Opferfeuer“ oder „ein großer Scheiterhaufen“
  rationale: Der weitere Zusammenhang kann an ein Opferfeuer denken lassen, doch der griechische Ausdruck selbst legt diese nähere Bestimmung an dieser Stelle nicht ausdrücklich fest. Die Übersetzung lässt die Aussage daher offen.
- issue: Verhältnis von Sonnenschein und Bewölkung
  choice: Die Sonne strahlte hervor, nachdem sie zuvor von Wolken bedeckt gewesen war
  alternative: Die Sonne strahlte, während sie noch von Wolken bedeckt war
  rationale: Das Partizip ἐπινεφὴς ὤν kann formal gleichzeitig verstanden werden; im Zusammenhang ist auch eine konzessiv-vorzeitige Deutung naheliegend. Die Hauptfassung bietet die idiomatischere Lesart, während die echte Mehrdeutigkeit durch die Fußnote erhalten bleibt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Satzstruktur bleibt nahe am griechischen Ablauf, ohne unnatürlich zu wirken. Der Ausdruck für das Feuer wird nicht über den Wortlaut hinaus kultisch präzisiert.
