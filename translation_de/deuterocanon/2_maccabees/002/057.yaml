lexical_decisions:
- source_word: ἐμβατείνειν
  choice: sich eingehend mit dem Stoff zu befassen
  rationale: Das Verb bezeichnet bildhaft ein Hineinschreiten oder tieferes Eindringen. Im Zusammenhang meint es die ausführliche und vertiefte Behandlung des Stoffes.
- source_word: περίπατον ποιεῖσθαι λόγῳ
  choice: sich in der Darstellung auf einen längeren Gedankengang einzulassen
  rationale: Die Wendung bedeutet wörtlich etwa »mit der Rede einen Spaziergang machen«. »Längerer Gedankengang« bewahrt einen Teil des Bewegungsbildes, ohne im Deutschen befremdlich zu wirken, und bezeichnet eine ausgreifende Darstellung.
- source_word: πολυπραγμονεῖν
  choice: sich übermäßig zu beschäftigen
  rationale: Das Verb trägt hier die kritische Nuance eines allzu eifrigen oder umständlichen Befassens, ohne notwendig zwischenmenschliche Einmischung zu bezeichnen.
- source_word: ἐν τοῖς κατὰ μέρος
  choice: mit den Einzelheiten
  rationale: Die Wendung bezeichnet die einzelnen Punkte beziehungsweise eine Behandlung Punkt für Punkt.
- source_word: τῷ τῆς ἱστορίας ἀρχηγενέτῃ
  choice: dessen, der das Geschichtswerk ursprünglich verfasst hat
  rationale: Das seltene ἀρχηγενέτης bezeichnet den ursprünglichen Hervorbringer. Die Formulierung unterscheidet den Verfasser des umfassenden Geschichtswerks vom Bearbeiter seiner Kurzfassung.
- source_word: καθῆκε
  choice: war Sache
  rationale: Das Verb bezeichnet, was jemandem zukommt oder als Aufgabe angemessen ist. »War Sache« gibt diese Zuständigkeit natürlich wieder.
