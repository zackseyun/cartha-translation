translation:
  language: de
  text: Sich eingehend mit dem Stoff zu befassen, in der Darstellung weiter auszuholen[a] und sich allzu sehr mit Einzelheiten zu beschäftigen, war Sache dessen, der das Geschichtswerk ursprünglich verfasst hat;
