  text: what has been set forth by Jason of Cyrene in five books[a], we will attempt to abridge in one volume.
translation:
  language: de
  text: Was Jason von Kyrene in fünf Büchern dargelegt hat, werden wir versuchen, in einem einzigen Werk gekürzt wiederzugeben.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zu kürzen“ oder „in verkürzter Form wiederzugeben“. Das griechische Verb bezeichnet die Herstellung einer kürzeren Fassung eines umfangreicheren schriftlichen Werkes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δηλωθέντα
  choice: dargelegt hat
  rationale: Das Partizip bezeichnet das von Jason schriftlich dargestellte Material. „Dargelegt“ ist im literarischen Zusammenhang natürlich und gibt den Gedanken des Offenlegens beziehungsweise Darstellens wieder.
- source_word: διὰ πέντε βιβλίων
  choice: in fünf Büchern
  rationale: διά mit dem Genitiv bezeichnet hier das literarische Medium beziehungsweise den Umfang; „in fünf Büchern“ ist die idiomatische deutsche Wiedergabe.
- source_word: πειρασόμεθα
  choice: werden wir versuchen
  rationale: Das Futur Medium drückt ein Vorhaben in bescheidenem Ton aus. „Werden wir versuchen“ bewahrt diese Zurückhaltung.
- source_word: διʼ ἑνὸς συντάγματος
  choice: in einem einzigen Werk
  rationale: σύνταγμα bezeichnet hier eine geordnete schriftliche Abhandlung oder Zusammenstellung. „Ein einziges Werk“ bildet den Gegensatz zu den fünf Büchern klar ab, ohne eine bestimmte materielle Buchform vorauszusetzen.
- source_word: ἐπιτεμεῖν
  choice: zusammenzufassen
  rationale: Das Verb bedeutet, ein umfangreicheres schriftliches Werk zu kürzen beziehungsweise in verkürzter Form wiederzugeben. „Zusammenzufassen“ ist präzise und für heutige Leser gut verständlich.
- source_word: ὑπὸ Ἰάσονος τοῦ Κυρηναίου
  choice: Jason von Kyrene
  rationale: Die Herkunftsbezeichnung wird im modernen Deutschen idiomatisch mit „von Kyrene“ wiedergegeben.
