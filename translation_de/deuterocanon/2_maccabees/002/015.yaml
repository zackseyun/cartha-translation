  text: 'And the prayer had this form: “Lord God[a], creator of all things, the fearful and mighty and righteous and merciful one[c][b], the only king and good one,”'
translation:
  language: de
  text: 'Das Gebet lautete folgendermaßen: »Herr, Gott, Schöpfer von allem, du Furchtgebietender[a], Mächtiger, Gerechter und Barmherziger, du alleiniger König und Gütiger[b]«,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Ehrfurchtgebietender«. Das griechische Wort bezeichnet jemanden, der Furcht oder Ehrfurcht hervorruft.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Guter« beziehungsweise »Wohltätiger«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν δὲ ἡ προσευχὴ τὸν τρόπον ἔχουσα τοῦτον
  choice: Das Gebet lautete folgendermaßen
  rationale: Die griechische Wendung führt den Wortlaut des Gebets ein. Diese Fassung gibt die Funktion idiomatisch und zugleich eng am Sinn wieder.
- source_word: Κύριε ὁ θεός
  choice: Herr, Gott
  rationale: Die Formen stehen als direkte Anrede. Das Komma macht im Deutschen kenntlich, dass sowohl »Herr« als auch »Gott« Anredetitel sind.
- source_word: ὁ πάντων κτίστης
  choice: Schöpfer von allem
  rationale: κτίστης bezeichnet den Schöpfer oder Urheber; πάντων umfasst alles Geschaffene, ohne dass »Dinge« ausdrücklich im Griechischen steht.
- source_word: ὁ φοβερὸς
  choice: du Furchtgebietender
  rationale: φοβερός bezeichnet hier den, der Furcht beziehungsweise Ehrfurcht hervorruft, nicht jemanden, der selbst ängstlich ist. Das anredende »du« trägt die substantivierten göttlichen Eigenschaften im Deutschen natürlich.
- source_word: ὁ ἰσχυρὸς
  choice: Mächtiger
  rationale: ἰσχυρός bezeichnet Stärke und Macht; »Mächtiger« ist in einer feierlichen Gottes­anrede zugleich präzise und verständlich.
- source_word: δίκαιος
  choice: Gerechter
  rationale: »Gerecht« deckt im Deutschen sowohl die moralische Rechtschaffenheit als auch das gerechte Handeln ab, ohne zwischen diesen Aspekten unnötig zu entscheiden.
- source_word: ἐλεήμων
  choice: Barmherziger
  rationale: Das Wort bezeichnet einen, der Erbarmen und Barmherzigkeit erweist; »Barmherziger« ist die direkte, etablierte Wiedergabe.
- source_word: ὁ μόνος βασιλεὺς
  choice: du alleiniger König
  rationale: μόνος betont die Ausschließlichkeit. »Alleiniger König« bewahrt diese Aussage und den königlichen Titel.
- source_word: χρηστός
  choice: Gütiger
  rationale: χρηστός kann gut, gütig, freundlich oder wohltätig bedeuten. »Gütiger« passt als substantivierte Anrede und hebt die Gott zugeschriebene Güte gegenüber anderen hervor.
theological_decisions:
- issue: Wiedergabe von κύριος in der Gottes­anrede
  choice: Herr
  alternative: Gebieter
  rationale: Im Gebetskontext ist κύριος ein göttlicher Titel. »Herr« wahrt diese traditionelle und sachlich passende Titelfunktion, ohne sie abzuschwächen.
- issue: Bedeutungsumfang von φοβερός als göttliche Eigenschaft
  choice: Furchtgebietender
  alternative: Ehrfurchtgebietender
  rationale: Das griechische Wort kann Furcht wie Ehrfurcht bezeichnen. Der Haupttext bewahrt die stärkere, nicht verharmlosende Aussage; die Fußnote erhält die mögliche Nuance der Ehrfurcht.
- issue: Bedeutungsumfang von χρηστός
  choice: Gütiger
  alternative: Guter oder Wohltätiger
  rationale: Die Bezeichnung verbindet moralische Güte mit freundlichem, wohltätigem Handeln. »Gütiger« hält diese Aspekte zusammen, während die Alternativen in der Fußnote offengelegt werden.
translation_notes:
  register: Feierliche, aber gegenwärtige Gebetssprache. Das wiederholte »du« macht die substantivischen Anreden des Griechischen im Deutschen klar, ohne die Reihe unnötig schwerfällig zu gestalten. Das abschließende Komma bleibt erhalten, weil der überlieferte Satz mit dem folgenden Vers weitergeht.
