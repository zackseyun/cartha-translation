  - marker: b
    text: Das seltene, mit „eindringen“ wiedergegebene Verb kann auch bedeuten, sich auf die geschichtlichen Erzählungen einzulassen oder sich durch sie hindurchzuarbeiten.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνορῶντες
  choice: wir haben … vor Augen
  rationale: Die Wendung gibt das wahrnehmende und zugleich abwägende Moment des Partizips natürlich wieder; zusammen mit „Denn“ bleibt seine begründende Funktion erhalten.
- source_word: τὸ χῦμα τῶν ἀριθμῶν
  choice: die Flut der Zahlen
  rationale: „Flut“ bewahrt das anschauliche Bild für eine überwältigende Menge; „der Zahlen“ hält an der Grundbedeutung von ἀριθμοί fest, ohne sie vorschnell als Einzelheiten auszudeuten.
- source_word: τὴν οὖσαν δυσχέρειαν
  choice: die Schwierigkeit, die sich … stellt
  rationale: Die idiomatische deutsche Formulierung bezeichnet die tatsächlich bestehende Schwierigkeit, ohne das bedeutungsarme Partizip εἶναι übermäßig wörtlich abzubilden.
- source_word: τοῖς θέλουσιν εἰσκυκλεῖσθαι
  choice: denen, die … eindringen wollen
  rationale: „Eindringen“ erhält bei dem seltenen Verb die Vorstellung, sich Zugang zu einem umfangreichen Gegenstand zu verschaffen, und klingt im Deutschen verständlich und würdig.
- source_word: τοῖς τῆς ἱστορίας διηγήμασιν
  choice: in die geschichtlichen Erzählungen
  rationale: Die Formulierung gibt die erzählenden Darstellungen der Geschichte in natürlichem Deutsch wieder.
- source_word: διὰ τὸ πλῆθος τῆς ὕλης
  choice: wegen der Fülle des Stoffes
  rationale: ὕλη bezeichnet hier den behandelten Stoff, nicht buchstäblich Holz oder Materie; „Fülle“ vermittelt dessen großen Umfang.
