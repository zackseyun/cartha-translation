  text: For[a], seeing the flood of numbers and the difficulty for those who wish to enter into the narratives of the history because of the abundance of material[b],
translation:
  language: de
  text: Denn wir haben die Flut von Zahlen[a] und die Schwierigkeit vor Augen, die sich wegen der Fülle des Stoffes denen stellt, die in die geschichtlichen Erzählungen eindringen wollen,[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „die Masse der Zahlen“; das Griechische gebraucht ein anschauliches Bild für eine überwältigende Menge.'
