  naturalness: „Flut von Zahlen“ ist im modernen Standarddeutsch idiomatischer als „Flut der Zahlen“. „In geschichtliche Erzählungen eindringen“ ist zwar leicht markiert, aber als bewusst bildnahe Wiedergabe des seltenen Verbs vertretbar und wird durch die Fußnote erklärt.
