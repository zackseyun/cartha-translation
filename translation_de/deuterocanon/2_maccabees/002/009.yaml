base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/002/009.yaml
  text: Since we are about to celebrate the purification of the temple on the twenty-fifth of Chislev[a], we thought it necessary to make this clear to you, so that you also may celebrate the festival of booths and of the fire, when Nehemiah, who built the temple and the altar[c][b], offered sacrifices.
translation:
  language: de
  text: Da wir am fünfundzwanzigsten Kislew die Reinigung des Tempels feiern werden, hielten wir es für nötig, euch dies klar darzulegen, damit auch ihr das Laubhüttenfest[a] und das Fest des Feuers[b] feiert, als Nehemia, der den Tempel und den Altar gebaut[c] hatte, Opfer darbrachte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich kann die Bezeichnung auch mit „Fest der Hütten“ wiedergegeben werden; traditionell: „Laubhüttenfest“.'
    reason: lexical_alternative
  - marker: b
    text: Die griechische Wendung „und des Feuers“ ist knapp und elliptisch. Sie verweist wohl auf die mit Nehemias Opfer und dem Feuer verbundene Gedenkfeier, die im Zusammenhang erzählt wird.
    reason: cultural_note
  - marker: c
    text: 'Griechisch: „gebaut“. Aus dem historischen Zusammenhang kann „wiederaufgebaut“ verstanden werden, doch das Verb selbst sagt dies nicht ausdrücklich.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μέλλοντες ἄγειν
  choice: Da wir … feiern werden
  rationale: ἄγειν bezeichnet bei einem Fest dessen Feier; μέλλοντες weist auf die bevorstehende Begehung hin. Die deutsche Futurform gibt dies natürlich wieder.
- source_word: ἐν τῷ Χασελεὺ πέμπτῃ καὶ εἰκάδι
  choice: am fünfundzwanzigsten Kislew
  rationale: Die Wendung nennt den fünfundzwanzigsten Tag des jüdischen Monats Kislew.
- source_word: τὸν καθαρισμὸν τοῦ ἱεροῦ
  choice: die Reinigung des Tempels
  rationale: καθαρισμός bedeutet Reinigung beziehungsweise kultische Reinweihung; ἱερόν bezeichnet hier den Tempel. „Reinigung“ wahrt die Aussage des griechischen Textes ohne erklärende Erweiterung.
- source_word: δέον ἡγησάμεθα διασαφῆσαι ὑμῖν
  choice: hielten wir es für nötig, euch dies klar darzulegen
  rationale: Die Formulierung verbindet die Einschätzung einer Notwendigkeit mit dem Gedanken des deutlichen Erklärens.
- source_word: ἵνα καὶ αὐτοὶ ἄγητε
  choice: damit auch ihr … feiert
  rationale: Das zweite ἄγειν ist wiederum im Sinn der Feier eines Festes gebraucht; καὶ αὐτοί hebt die Adressaten als ebenfalls Feiernde hervor.
- source_word: σκηνοπηγίας
  choice: das Laubhüttenfest
  rationale: σκηνοπηγία ist die übliche griechische Bezeichnung des jüdischen Laubhüttenfestes. Der geläufige deutsche Name ist verständlich und bedeutungsnah.
- source_word: καὶ τοῦ πυρός
  choice: und das Fest des Feuers
  rationale: Der Genitiv τοῦ πυρός steht knapp und elliptisch neben σκηνοπηγίας. „Fest des Feuers“ ergänzt nur den im Zusammenhang vorausgesetzten Festbegriff, ohne die genaue Art der Feier festzulegen.
- source_word: ὅτε Νεεμίας
  choice: als Nehemia
  rationale: ὅτε führt den zurückliegenden Anlass ein, der mit der Feuerfeier verbunden wird.
- source_word: ὁ οἰκοδομήσας τό τε ἱερὸν καὶ τὸ θυσιαστήριον
  choice: der den Tempel und den Altar gebaut hatte
  rationale: οἰκοδομέω bedeutet ausdrücklich „bauen“. Das Plusquamperfekt ordnet die Handlung im Deutschen zeitlich vor dem Darbringen der Opfer ein; „wiederaufgebaut“ wäre historisch erklärend, steht aber nicht ausdrücklich im griechischen Wort.
- source_word: ἀνήνεγκεν θυσίας
  choice: Opfer darbrachte
  rationale: ἀναφέρω ist im kultischen Zusammenhang das Darbringen beziehungsweise Opfern einer Opfergabe.
theological_decisions:
- issue: Bezeichnung von σκηνοπηγίας
  choice: Laubhüttenfest
  alternative: Fest der Hütten; Hüttenfest
  rationale: „Laubhüttenfest“ ist die natürliche moderne deutsche Bezeichnung und bewahrt zugleich den konkreten Bezug auf Hütten, ohne eine konfessionelle Deutung einzutragen.
- issue: Deutung der verkürzten Wendung καὶ τοῦ πυρός
  choice: Fest des Feuers
  alternative: und des Feuers; Feuerfest
  rationale: Der griechische Ausdruck ist elliptisch und seine syntaktische Beziehung zum folgenden ὅτε-Satz bleibt gedrängt. Die Wiedergabe macht den mit σκηνοπηγίας koordinierten Festbezug lesbar, erklärt aber nicht näher, worin die Feuerfeier bestand.
- issue: οἰκοδομήσας im historischen Zusammenhang
  choice: gebaut
  alternative: wiederaufgebaut
  rationale: Obwohl der historische Zusammenhang an einen Wiederaufbau denken lässt, enthält das griechische Verb selbst diese Präzisierung nicht. Die Übersetzung vermeidet es daher, die geschichtliche Deutung in den Haupttext einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit allgemein verständlicher Syntax. Die Festnamen werden bedeutungsnah wiedergegeben. Die gedrängte Konstruktion um „des Feuers“ und „als Nehemia“ wird nicht durch eine weitergehende historische oder theologische Erklärung im Haupttext aufgelöst.
