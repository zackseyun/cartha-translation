  text: And when this happened[a], a flame was kindled; but when the light from the altar shone forth, it was consumed.
translation:
  language: de
  text: Als dies geschah, wurde eine Flamme entzündet. Als aber das Licht vom Altar aufleuchtete, wurde sie verzehrt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Verb für „aufleuchten“ kann auch ein Zurück- oder Entgegenstrahlen bezeichnen. Das Subjekt von „wurde verzehrt“ wird im Griechischen nicht ausdrücklich genannt; gemeint sein kann die Flamme, möglicherweise aber auch das Brennmaterial beziehungsweise die zuvor erwähnte Flüssigkeit.
    reason: Bewahrt die lexikalische und syntaktische Mehrdeutigkeit des griechischen Textes.
lexical_decisions:
- source_word: ὡς δὲ τοῦτο ἐγενήθη
  choice: Als dies geschehen war
  rationale: Gibt den temporalen Übergang natürlich und würdig wieder; das Plusquamperfekt macht deutlich, dass darauf das Entzünden der Flamme folgt.
- source_word: φλὸξ ἀνήφθη
  choice: entzündete sich eine Flamme
  rationale: Bewahrt das konkrete Singularbild von φλόξ. Die deutsche reflexive Form gibt das Entstehen der Flamme idiomatisch wieder, ohne einen im Griechischen ungenannten Handelnden einzuführen.
- source_word: τοῦ ... ἀπὸ τοῦ θυσιαστηρίου ... φωτός
  choice: das Licht vom Altar
  rationale: Die Präpositionalgruppe bezeichnet die Herkunft des Lichts; „Altar“ ist die klare und übliche Entsprechung für θυσιαστήριον.
- source_word: ἀντιλάμψαντος
  choice: aufleuchtete
  rationale: ἀντιλάμπω kann ein Entgegen-, Wider- oder Zurückleuchten bezeichnen. „Aufleuchtete“ ist im Zusammenhang natürlich und wahrt das Hervortreten des Lichts, ohne die schwer sichere räumliche Beziehung zu überbestimmen.
- source_word: ἐδαπανήθη
  choice: wurde sie verzehrt
  rationale: Das Passiv bezeichnet ein Verbraucht- oder Aufgezehrtwerden. Das feminine Pronomen bezieht sich in der Hauptlesart auf „Flamme“, während die im Griechischen unausgesprochene Subjektreferenz in der Fußnote offengehalten wird.
theological_decisions:
- issue: Unausgesprochenes Subjekt von ἐδαπανήθη
  choice: Im Haupttext bezieht sich „sie“ auf die Flamme.
  alternative: Gemeint sein könnte auch der verbrannte Stoff beziehungsweise das Opfermaterial oder die im vorherigen Zusammenhang erwähnte Flüssigkeit.
  rationale: φλόξ ist der nächstliegende ausdrücklich genannte Singular und daher die sprachlich sparsamste Bezugsgröße. Weil das Griechische das Subjekt des Schlussverbs jedoch nicht nennt, wird die Mehrdeutigkeit nicht dogmatisch aufgelöst, sondern in einer Fußnote kenntlich gemacht.
- issue: Nuance von ἀντιλάμπω
  choice: „aufleuchtete“
  alternative: „zurückstrahlte“, „entgegenleuchtete“ oder „widerstrahlte“
  rationale: Das Verb kann ein Leuchten in Gegenrichtung oder als Reaktion ausdrücken. Der Kontext erlaubt jedoch keine völlig sichere Festlegung; die flüssige Hauptübersetzung wird daher durch die Fußnote ergänzt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem erzählerischem Ton. Die Satzteilung vermeidet einen überladenen Periodenbau. Keine konfessionell geprägte Deutung wird in den Haupttext eingetragen.
