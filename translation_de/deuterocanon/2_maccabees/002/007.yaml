  text: After opening the secret door in the ceiling[a], they threw stones and struck down the leader, and after cutting them into pieces[c][b], they threw the heads to those outside.
translation:
  language: de
  text: Nachdem sie die verborgene Tür in der Decke[a] geöffnet hatten, bewarfen sie den Anführer mit Steinen und erschlugen ihn[b]. Dann zerstückelten sie ihn und warfen die Köpfe[c] denen zu, die draußen waren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das seltene griechische Wort kann eine Decke oder Deckentäfelung, möglicherweise auch einen Raum im Decken- oder Dachbereich, bezeichnen.
    reason: lexical_alternative
  - marker: b
    text: Das griechische Verb ist ungewöhnlich kraftvoll und beschreibt ein vernichtendes Niederstrecken, bildlich wie durch einen Blitzschlag.
    reason: lexical_alternative
  - marker: c
    text: Im griechischen Text steht „die Köpfe“ in der Mehrzahl, obwohl zuvor nur ein Anführer ausdrücklich genannt wird. Diese auffällige Formulierung wird hier beibehalten.
    reason: textual_variant
lexical_decisions:
- source_word: ἀνοίξαντες
  choice: Nachdem sie … geöffnet hatten
  rationale: Das Aoristpartizip bezeichnet eine Handlung, die den folgenden Ereignissen vorausgeht; der deutsche Nebensatz gibt diese Abfolge natürlich wieder.
- source_word: κρυπτὴν θύραν
  choice: die verborgene Tür
  rationale: κρυπτός bezeichnet etwas Verborgenes oder Verdecktes. „Verborgene Tür“ ist präzise und vermeidet die mögliche Nebenbedeutung einer nur Eingeweihten bekannten „Geheimtür“.
- source_word: τοῦ φατινώματος
  choice: in der Decke
  rationale: Das seltene und unsichere Wort φατίνωμα bezeichnet hier wahrscheinlich eine Decke, Deckentäfelung oder einen Raum im Decken- beziehungsweise Dachbereich. „In der Decke“ passt zum unmittelbaren räumlichen Zusammenhang, ohne eine bestimmte Bauform vorauszusetzen.
- source_word: βάλλοντες πέτρους
  choice: bewarfen sie … mit Steinen
  rationale: Das Partizip beschreibt das Mittel, durch das der Anführer getötet wurde. Die deutsche Konstruktion verbindet Mittel und Ergebnis klar und idiomatisch.
- source_word: συνεκεραύνωσαν
  choice: erschlugen ihn
  rationale: Das seltene, besonders kraftvolle Verb beschreibt ein vernichtendes Niederstrecken, bildlich wie durch einen Blitzschlag. Im Zusammenhang mit den geworfenen Steinen gibt „erschlugen“ den tödlichen Ausgang knapp und verständlich wieder.
- source_word: τὸν ἡγεμόνα
  choice: den Anführer
  rationale: ἡγεμών kann je nach Zusammenhang Anführer, Herrscher, Statthalter oder Befehlshaber bedeuten. Da der vorliegende Wortlaut kein bestimmtes Amt erkennen lässt, bleibt „Anführer“ angemessen offen.
- source_word: μέλη ποιήσαντες
  choice: Dann zerstückelten sie ihn
  rationale: Die Wendung bedeutet wörtlich etwa „sie machten [ihn] zu Gliedern“ und bezeichnet eine Zerstückelung. Das Objekt ist im Griechischen nicht ausdrücklich genannt; „ihn“ nimmt den zuvor genannten Anführer auf, ohne die auffällige folgende Mehrzahl „Köpfe“ zu glätten.
- source_word: τὰς κεφαλάς
  choice: die Köpfe
  rationale: Der griechische Text hat ausdrücklich den Plural. Obwohl zuvor nur ein Anführer genannt wird und der Zusammenhang daher auffällig ist, wird die Mehrzahl bewahrt.
- source_word: τοῖς ἔξω
  choice: denen …, die draußen waren
  rationale: Der substantivierte Ausdruck bezeichnet Personen außerhalb des betreffenden Raumes, nicht bloß eine Richtung oder einen Ort.
