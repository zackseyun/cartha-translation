  text: To go into detail and to make a circuit with the discourse[a], and to be overly busy with the particulars, belongs to the originator of the history;
translation:
  language: de
  text: In die Tiefe zu gehen, mit der Darstellung weit auszuholen[a] und sich eingehend mit den Einzelheiten zu befassen, kommt dem Urheber des Geschichtswerks zu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die Erörterung weit auszuführen«. Die griechische Formulierung ist rhetorisch dicht und verwendet mehrere räumliche Metaphern.'
