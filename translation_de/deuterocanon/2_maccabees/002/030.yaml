lexical_decisions:
- source_word: ἐμβατεύειν
  choice: in die Tiefe zu gehen
  rationale: Die Wendung gibt im Zusammenhang ein gründliches Eindringen in den Stoff wieder, ohne das Bild völlig auf eine sachliche Paraphrase zu reduzieren.
- source_word: περίπατον ποιεῖσθαι λόγῳ
  choice: mit der Darstellung weit auszuholen
  rationale: Die ungewöhnliche Bewegungsmetapher bezeichnet eine weiträumige, ausführliche Behandlung des Gegenstands; die deutsche Formulierung klingt natürlich und bewahrt das Bild des Abschweifens beziehungsweise weiten Ausholens.
- source_word: πολυπραγμονεῖν ἐν τοῖς κατὰ μέρος
  choice: sich eingehend mit den Einzelheiten zu befassen
  rationale: Im Kontext geht es um intensive, womöglich aufwendige Beschäftigung mit den einzelnen Punkten, nicht um Einmischung in fremde Angelegenheiten.
- source_word: τῷ τῆς ἱστορίας ἀρχηγενέτῃ
  choice: dessen, der das Geschichtswerk ursprünglich verfasst hat
  rationale: Die seltene Bezeichnung ἀρχηγενέτης hebt den ursprünglichen Hervorbringer des Geschichtswerks hervor. Die Umschreibung ist im Deutschen verständlicher als ein künstliches Substantiv und unterscheidet ihn vom Bearbeiter beziehungsweise Auszügler.
- source_word: καθήκει
  choice: ist die Aufgabe
  rationale: Das Verb bezeichnet, was jemandem zukommt oder für ihn angemessen ist. Im Kontext der Arbeitsteilung zwischen ursprünglichem Historiker und Bearbeiter ist „ist die Aufgabe“ idiomatisch.
