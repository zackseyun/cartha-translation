translation:
  language: de
  text: Wir haben uns bemüht, denen, die lesen wollen, Lesefreude zu bereiten, denen, die geneigt sind, es sich einzuprägen, dies zu erleichtern, und allen, die ihm begegnen, Nutzen zu bringen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐφροντίσαμεν
  choice: Wir haben darauf geachtet
  rationale: Gibt die bewusste Sorgfalt des Verfassers natürlich und ohne Übertreibung wieder.
- source_word: εὐχαγωγίαν
  choice: Lesefreude
  rationale: Das seltene Wort bezeichnet hier eine angenehme, unterhaltsame Zugänglichkeit für die Lesenden; „Lesefreude“ bringt dies im Kontext knapp zum Ausdruck.
- source_word: φιλοφρονοῦσιν
  choice: die geneigt sind
  rationale: Bewahrt die Bedeutung einer willigen beziehungsweise positiven inneren Neigung, ohne eine stärkere Verpflichtung einzutragen.
- source_word: εἰς τὸ διαμνήμης ἀναλαβεῖν
  choice: es sich einzuprägen
  rationale: Bezeichnet das Aufnehmen und dauerhafte Bewahren im Gedächtnis; die deutsche Wendung ist natürlich und präzise.
- source_word: ἐντυγχάνουσιν
  choice: die sich damit befassen
  rationale: Das Verb kann hier das Antreffen, Lesen oder Beschäftigen mit dem Werk meinen. Diese Formulierung lässt den Bezug bewusst etwas weiter als nur „lesen“.
- source_word: ὠφέλειαν
  choice: Nutzen
  rationale: Direkte und im Deutschen idiomatische Entsprechung für den beabsichtigten Gewinn.
