  - severity: low
    issue: Die einleitende Verbfügung klingt leicht schwerfällig.
    rationale: „Wir haben uns bemüht“ gibt ἐφροντίσαμεν als bewusste Bemühung idiomatischer wieder und trägt die folgenden Infinitivgruppen klar.
