  terminology: „Architekt“, „auszumalen“ und „Ausschmückung“ sind treffend. „Herrichten“ ist als offene Wiedergabe von ἐγκαινίζειν natürlicher als „auszustatten“ und legt weniger stark eine bestimmte Art der Einrichtung fest.
