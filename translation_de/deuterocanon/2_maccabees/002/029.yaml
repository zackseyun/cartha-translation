base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/002/029.yaml
  text: For just as the architect of a new house must take thought for the whole structure[a], but the one undertaking to decorate it with painted ornament must consider the things suitable for adornment, so also, I think, it is with us.
translation:
  language: de
  text: Denn wie der Architekt eines neuen Hauses für die Grundlegung des ganzen Hauses Sorge tragen muss, derjenige aber, der daran geht, es herzurichten und auszumalen, prüfen muss, was sich zur Ausschmückung eignet, so verhält es sich, denke ich, auch bei uns.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „es fertigzustellen und auszumalen“. Das hier mit „herzurichten“ wiedergegebene griechische Wort kann im Zusammenhang auch das Ausstatten oder Vollenden des Hauses bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθάπερ γὰρ
  choice: Denn wie
  rationale: Gibt sowohl die begründende Funktion von γάρ als auch den einleitenden Vergleich durch καθάπερ natürlich wieder.
- source_word: ἀρχιτέκτονι
  choice: der Architekt
  rationale: Bezeichnet den leitenden Planer und Baumeister; das moderne deutsche Wort bewahrt diese spezifische Rolle.
- source_word: τῆς ὅλης καταβολῆς
  choice: für die gesamte Grundlegung
  rationale: καταβολή bezeichnet hier die grundlegende Anlage beziehungsweise deren Ausführung. „Grundlegung“ wahrt den Vorgangscharakter und legt den Ausdruck nicht vorschnell auf bloßes Fundament oder den gesamten Bau fest.
- source_word: φροντιστέον
  choice: sorgen muss
  rationale: Die griechische Verbaladjektivkonstruktion drückt Notwendigkeit aus; „sorgen muss“ ist klar und idiomatisch.
- source_word: ἐγκαινίζειν
  choice: auszustatten
  rationale: Im Zusammenhang mit Ausmalen und Ausschmückung liegt die Herrichtung beziehungsweise Ausstattung des Hauses näher als eine zeremonielle Einweihung. Die mögliche Bedeutung „fertigzustellen“ bleibt sachlich benachbart.
- source_word: ζωγραφεῖν
  choice: auszumalen
  rationale: Bewahrt den konkreten Bezug auf malerische Gestaltung, ohne eine im Griechischen nicht zwingend festgelegte Technik wie Enkaustik einzutragen.
- source_word: τὰ ἐπιτήδεια πρὸς διακόσμησιν
  choice: was sich zur Ausschmückung eignet
  rationale: Gibt die allgemeine Bedeutung der geeigneten beziehungsweise zweckmäßigen Dinge natürlich wieder, ohne sie auf Materialien zu verengen.
- source_word: οὕτως δοκῶ καὶ ἐπὶ ἡμῶν
  choice: so verhält es sich, denke ich, auch bei uns
  rationale: Erhält den Abschluss des Vergleichs und die zurückhaltende persönliche Einschätzung δοκῶ.
