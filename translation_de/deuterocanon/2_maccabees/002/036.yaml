  yaml_path: translation/deuterocanon/2_maccabees/002/036.yaml
  text: And it was also made clear that[a], as one having wisdom[b], he offered a sacrifice for the dedication and completion of the sanctuary.
translation:
  language: de
  text: Und es wurde auch deutlich dargelegt, wie er in seiner Weisheit ein Opfer zur Einweihung[a] und Vollendung[b] des Heiligtums darbrachte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wiedereinweihung“. Der historische Zusammenhang legt eine erneute Einweihung nahe; im Griechischen steht jedoch lediglich „Einweihung“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Weihe des Heiligtums“. Das griechische Wort kann im kultischen Zusammenhang die vollständige Weihe bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διεσαφείτο
  choice: es wurde deutlich dargelegt
  rationale: Das Imperfekt im Passiv bezeichnet ein fortlaufendes oder berichtendes Klarstellen. „Deutlich dargelegt“ bewahrt sowohl den Erklärungs- als auch den Klarheitsaspekt.
- source_word: ὡς σοφίαν ἔχων
  choice: wie er, da er Weisheit besaß
  rationale: ὡς führt hier ein, auf welche Weise beziehungsweise unter welchem Gesichtspunkt gehandelt wurde; das Partizip ἔχων kann zugleich den Grund anklingen lassen. Die Formulierung wahrt diese Spannung, ohne bloß „weise“ zu setzen.
- source_word: ἀνήνεγκεν
  choice: darbrachte
  rationale: ἀναφέρω ist im Opferkontext idiomatisch mit „darbringen“ wiederzugeben.
- source_word: θυσίαν
  choice: ein Opfer
  rationale: „Opfer“ ist die übliche und sachlich passende Wiedergabe im kultischen Zusammenhang.
- source_word: ἐγκαινισμοῦ
  choice: zur Einweihung
  rationale: Der Genitiv bezeichnet Art oder Zweck des Opfers. „Einweihung“ gibt den griechischen Ausdruck wieder, ohne die historisch naheliegende Wiedereinweihung ausdrücklich in den Haupttext einzutragen.
- source_word: τελειώσεως
  choice: Vollendung
  rationale: „Vollendung“ bewahrt die Grundbedeutung des Zu-Ende- beziehungsweise Zur-Erfüllung-Bringens; eine kultisch-technische Bedeutung wie „Weihe“ bleibt als Alternative in der Fußnote erhalten.
- source_word: τοῦ ἱεροῦ
  choice: des Heiligtums
  rationale: ἱερόν bezeichnet den heiligen Tempelbereich. „Heiligtum“ erhält den sakralen und räumlich nicht unnötig verengten Sinn.
theological_decisions:
- issue: Kultische Bedeutung von τελειώσεως
  choice: Vollendung
  alternative: Weihe beziehungsweise vollständige Heiligung
  rationale: Der Ausdruck kann das kultische Zu-seiner-heiligen-Bestimmung-Bringen bezeichnen. Der Haupttext behält den weiteren lexikalischen Sinn bei, während die Fußnote die kultische Lesart sichtbar macht.
- issue: Historische Bedeutung von ἐγκαινισμοῦ
  choice: Einweihung
  alternative: Wiedereinweihung
  rationale: Im makkabäischen Zusammenhang ist eine erneute Einweihung historisch naheliegend; das griechische Wort selbst macht das Präfix „wieder-“ hier jedoch nicht ausdrücklich.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Darbringen“ und „Heiligtum“ wahren den kultischen Ton, bleiben aber allgemein verständlich. Die etwas ungewöhnliche Wendung „da er Weisheit besaß“ folgt bewusst der substantivischen griechischen Formulierung und vermeidet eine unnötige Festlegung auf bloße Eigenschaft oder eindeutige Kausalität.
