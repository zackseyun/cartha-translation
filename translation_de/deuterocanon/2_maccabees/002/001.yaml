base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/002/001.yaml
  text: 'And those in Judea[a], and the council of elders, and Judas, to Aristobulus, teacher of King Ptolemy, who is also of the family of the anointed priests, and to the Jews in Egypt: greetings and good health.'
translation:
  language: de
  text: Die in Judäa, der Ältestenrat und Judas grüßen Aristobulos, den Lehrer des Königs Ptolemäus, der zudem aus dem Geschlecht der gesalbten Priester[a] stammt, sowie die Juden in Ägypten und wünschen ihnen Wohlergehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »der geweihten Priester«. Das griechische Wort bedeutet hier »gesalbt« und wird nicht als christologischer Titel gebraucht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ ἐν τῇ Ἰουδαίᾳ
  choice: die Menschen in Judäa
  rationale: Der griechische Ausdruck bezeichnet wörtlich »die in Judäa« und lässt die Personengruppe unausgesprochen. Die Wiedergabe bleibt entsprechend weiter als »die Juden in Judäa«, ist aber im Deutschen natürlich verständlich.
- source_word: γερουσία
  choice: Ältestenrat
  rationale: Das Wort bezeichnet ein institutionelles Gremium von Ältesten. »Ältestenrat« ist präzise, verständlich und vermeidet das irreführende »Senat«.
- source_word: διδασκάλῳ Πτολεμαίου τοῦ βασιλέως
  choice: den Lehrer des Königs Ptolemäus
  rationale: Der Dativ bezeichnet Aristobulos als Lehrer, der König Ptolemäus zugeordnet ist. »Lehrer« gibt διδάσκαλος direkt und ohne unnötige Spezifizierung als Privatlehrer oder Erzieher wieder.
- source_word: ὄντι δὲ ἀπὸ τοῦ τῶν χριστῶν ἱερέων γένους
  choice: der zudem aus dem Geschlecht der gesalbten Priester stammt
  rationale: ὄντι bezieht sich grammatisch auf Aristobulos. γένος bezeichnet hier Abstammung beziehungsweise Geschlecht; χριστῶν bedeutet in diesem Zusammenhang gewöhnlich »gesalbt« und beschreibt die Priester.
- source_word: χαίρειν καὶ ὑγιαίνειν
  choice: grüßen … und wünschen ihnen Wohlergehen
  rationale: Die beiden Infinitive bilden eine briefliche Gruß- und Wohlergehensformel. Die finite deutsche Formulierung macht die Absender- und Empfängerbeziehung klar und klingt natürlich.
- source_word: Ἰούδας
  choice: Judas
  rationale: Die geläufige deutsche Namensform für Ἰούδας wird beibehalten; »Juda« könnte hier eher an den Stamm oder den Patriarchen denken lassen.
theological_decisions:
- issue: Bedeutung von χριστῶν in τῶν χριστῶν ἱερέων
  choice: gesalbte Priester
  alternative: geweihte Priester
  rationale: χριστῶν ist hier die Pluralform mit der gewöhnlichen Bedeutung »gesalbt« und kein christologischer Titel. »Gesalbt« bewahrt den konkreten Wortlaut und vermeidet zugleich die Deutung als »Christen« oder »Messiasse«.
translation_notes:
  register: Moderne, würdige Standardsprache. Die knappe griechische Briefformel wird zu einem vollständigen deutschen Satz entfaltet. Die ungewöhnlich breite Bezeichnung der ersten Absendergruppe wird nicht stillschweigend zu »die Juden in Judäa« verengt.
