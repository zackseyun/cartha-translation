base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/002/018.yaml
  text: Gather our dispersion, free those who are enslaved among the nations, look upon those who are despised and abhorred; and let the nations know that you are our God.
translation:
  language: de
  text: Sammle unser zerstreutes Volk[a], befreie alle, die unter den Völkern versklavt sind, und sieh auf die Verachteten und Verabscheuten[b]. Die Völker sollen erkennen, dass du unser Gott bist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Sammle unsere Zerstreuung.“ Das griechische abstrakte Substantiv bezeichnet hier kollektiv das zerstreute Volk.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Achte auf“ beziehungsweise „wende dich den Verachteten und Verabscheuten zu“. Gemeint ist, dass Gott ihnen seine Aufmerksamkeit schenkt; ausdrückliches Erbarmen wird nicht genannt, kann aber mitschwingen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπισυνάγαγε
  choice: Sammle
  rationale: Der Aoristimperativ fordert Gott unmittelbar dazu auf, die Zerstreuten wieder zusammenzuführen. „Sammle“ ist knapp, natürlich und bewahrt den Gebetscharakter.
- source_word: τὴν διασπορὰν ἡμῶν
  choice: unser zerstreutes Volk
  rationale: Das abstrakte Substantiv διασπορά bezeichnet hier kollektiv die zerstreute Gemeinschaft. Die Wiedergabe ist im Deutschen natürlich und macht den Personenbezug deutlich; die wörtliche Form bleibt in der Fußnote sichtbar.
- source_word: ἐλευθέρωσον
  choice: befreie
  rationale: Das Verb bezeichnet das Freimachen beziehungsweise die Befreiung und erhält hier seine konkrete Bedeutung.
- source_word: τοὺς δουλεύοντας
  choice: alle, die … versklavt sind
  rationale: δουλεύω bezeichnet in diesem Zusammenhang unfreiwillige Knechtschaft unter fremden Völkern, nicht freiwilligen Dienst. „Versklavt“ bringt den Zustand klar zum Ausdruck.
- source_word: ἐν τοῖς ἔθνεσιν
  choice: unter den Völkern
  rationale: ἔθνη bezeichnet die fremden Völker, in deren Mitte die Angehörigen Israels leben. „Unter den Völkern“ ist idiomatisch und vermeidet eine unnötig konfessionell geprägte Wiedergabe.
- source_word: τοὺς ἐξουθενημένους καὶ βδελυκτοὺς
  choice: die Verachteten und Verabscheuten
  rationale: Beide Ausdrücke bezeichnen Menschen als Ziel von Geringschätzung beziehungsweise Abscheu. Die substantivierten Partizipien und Adjektive bewahren die knappe Parallelität des Griechischen.
- source_word: ἔφιδε
  choice: sieh auf
  rationale: Der Imperativ bittet Gott, diesen Menschen seine Aufmerksamkeit zuzuwenden. „Sieh auf“ bewahrt die Bildsprache, ohne das damit verbundene Erbarmen ausdrücklich in den Text einzutragen.
- source_word: γνώτωσαν τὰ ἔθνη
  choice: Die Völker sollen erkennen
  rationale: Der Imperativ der dritten Person hat auffordernden beziehungsweise wünschenden Sinn. „Sollen erkennen“ gibt diese jussive Kraft in natürlichem Deutsch wieder.
- source_word: ὅτι σὺ ὁ θεὸς ἡμῶν
  choice: dass du unser Gott bist
  rationale: Die Formulierung gibt das betonte Personalpronomen und das Bekenntnis zur besonderen Beziehung Gottes zu seinem Volk unmittelbar wieder.
theological_decisions:
- issue: Bedeutung von δουλεύοντας im Zusammenhang der Unterdrückung unter fremden Völkern
  choice: alle, die … versklavt sind
  alternative: die dort dienen
  rationale: Der Kontext spricht von Befreiung und von einer verachteten zerstreuten Gemeinschaft. Daher steht der Zustand der Unfreiheit im Vordergrund, ohne dass eine bestimmte historische Form der Versklavung näher festgelegt wird.
- issue: Abstrakte oder kollektive Wiedergabe von διασπορά
  choice: unser zerstreutes Volk
  alternative: unsere Zerstreuung
  rationale: Das Griechische verwendet ein abstraktes Substantiv kollektiv für die zerstreute Gemeinschaft. Im modernen Deutschen vermittelt „unser zerstreutes Volk“ diesen Sinn klarer; die formale Ausdrucksweise wird in der Fußnote dokumentiert.
- issue: Implizites Erbarmen in ἔφιδε
  choice: sieh auf
  alternative: erbarme dich über
  rationale: Die Bitte um Gottes Zuwendung kann Erbarmen einschließen, nennt es aber nicht ausdrücklich. Die Übersetzung erhält diese Offenheit.
translation_notes:
  register: Modernes, würdiges Gebetsdeutsch mit klaren Imperativen. „Zerstreutes Volk“ vermeidet die im Deutschen unnatürliche Verbindung „unsere Zerstreuung“, während die Fußnote die griechische Form transparent hält. „Verachteten und Verabscheuten“ bewahrt die zugespitzte Parallelität des Ausgangstextes.
