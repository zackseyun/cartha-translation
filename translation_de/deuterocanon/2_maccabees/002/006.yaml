  text: And when the priests of Nanea had set them out[a], and he had come with a few men into the enclosure of the sanctuary, they shut the temple as soon as Antiochus entered[c][b],
translation:
  language: de
  text: Nachdem die Priester des Nanaios sie bereitgelegt hatten[b] und er mit einigen Männern in den umfriedeten Bereich des Heiligtums gekommen war, schlossen sie den Tempel zu, sobald Antiochus eintrat.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Worauf sich „sie“ bezieht, wird im griechischen Wortlaut dieses Verses nicht gesagt; gemeint sind offenbar zuvor erwähnte Gegenstände.
    reason: cross_reference
  - marker: c
    text: Dieser Vers scheint zur Erzählung über Antiochus und den in 2 Makkabäer 1,13–15 mit Nanaia verbundenen Tempel zu gehören und passt nicht zum umgebenden Zusammenhang von Kapitel 2. Der überlieferte Wortlaut wird dennoch so übersetzt, wie er vorliegt.
    reason: textual_variant
lexical_decisions:
- source_word: προθεμένων
  choice: bereitgelegt hatten
  rationale: Das Aoristpartizip von προτίθημι bezeichnet hier das vorherige Hinlegen oder Bereitstellen von Gegenständen. „Bereitgelegt“ ist natürlich und legt weder Zurschaustellung noch einen bestimmten Zweck fest.
- source_word: αὐτά
  choice: sie
  rationale: Das griechische Pronomen ist sachlich pluralisch, doch sein Bezugswort fehlt in diesem Vers. „Sie“ bewahrt diesen unbestimmten Rückbezug.
- source_word: τῶν ἱερέων τοῦ Ναναίου
  choice: die Priester des Nanaios
  rationale: Der Genitiv wird unmittelbar wiedergegeben. Ναναῖος erscheint hier als griechische Namensform der Gottheit; „Nanaios“ bildet genau die vorliegende Form ab, ohne sie stillschweigend an die andernorts geläufige Form Nanaia anzugleichen.
- source_word: προσελθόντος
  choice: gekommen war
  rationale: Das Partizip beschreibt das Herankommen; zusammen mit εἰς wird die Bewegung in den Bereich hinein ausgedrückt. „Gekommen war“ vermeidet eine übergenaue Festlegung auf bloßes Annähern.
- source_word: μετʼ ὀλίγων
  choice: mit einigen Männern
  rationale: Das Griechische sagt wörtlich „mit wenigen“; die männlichen Begleiter sind impliziert. Die Ergänzung „Männern“ macht den deutschen Satz verständlich.
- source_word: περίβολον
  choice: umfriedeten Bereich
  rationale: περίβολος bezeichnet einen umschlossenen Bezirk. „Umfriedeter Bereich“ wahrt den räumlichen Sinn, ohne einen architektonisch bestimmten Hof vorauszusetzen.
- source_word: τέμενος
  choice: Heiligtums
  rationale: τέμενος ist ein abgegrenzter heiliger Bezirk. Im Genitiv nach περίβολος ist „des Heiligtums“ idiomatisch und kultisch angemessen.
- source_word: συγκλείσαντες
  choice: verschlossen sie
  rationale: Das Verb bezeichnet das feste Schließen. „Verschlossen“ gibt dies klar wieder, ohne einen bestimmten Mechanismus wie Verriegeln zu behaupten.
- source_word: ἱερόν
  choice: Tempel
  rationale: ἱερόν bezeichnet hier den sakralen Tempelbereich beziehungsweise das Tempelgebäude. „Tempel“ hält es sprachlich von τέμενος unterscheidbar.
- source_word: ὡς εἰσῆλθεν Ἀντίοχος
  choice: sobald Antiochus eingetreten war
  rationale: ὡς mit dem Aorist ist temporal. „Sobald“ bringt die unmittelbare zeitliche Abfolge zum Ausdruck; das Plusquamperfekt passt zum deutschen Erzählgefüge.
