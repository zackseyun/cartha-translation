base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/002/024.yaml
  text: But when the matter became known[a], and it was reported to the king of the Persians that in the place where the priests who had been taken away had hidden the fire, water appeared, from which also those with Nehemiah purified the sacrifices[c][b],
translation:
  language: de
  text: Als die Sache aber bekannt wurde und man dem König der Perser berichtete, dass an dem Ort, wo die weggeführten Priester[a] das Feuer verborgen hatten, Wasser zum Vorschein gekommen war, mit dem Nehemia und seine Begleiter[b] auch die Opfer reinigten[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die verbannten Priester“ beziehungsweise „die deportierten Priester“. Das griechische Wort bezeichnet Priester, die von ihrem Ort weggebracht worden waren.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „die um Nehemia“, das heißt Nehemia und die zu ihm gehörende Gruppe.'
    reason: lexical_alternative
  - marker: c
    text: Wörtlicher lässt sich der griechische Ausdruck mit „von dem“ oder „aus dem“ wiedergeben. Er kann das Wasser als Quelle bezeichnen; dem Sinn nach ist auch die instrumentale Wiedergabe „mit dem“ möglich.
    reason: lexical_ambiguity
lexical_decisions:
- source_word: φανερὸν ἐγενήθη τὸ πρᾶγμα
  choice: die Sache bekannt wurde
  rationale: Die Wendung bezeichnet, dass der Vorgang ans Licht kam. „Bekannt wurde“ gibt den resultativen Sinn natürlich wieder.
- source_word: διηγήθη
  choice: man … berichtete
  rationale: Das unpersönliche deutsche Aktiv entspricht hier dem griechischen Passiv und passt zum formellen Erzählstil.
- source_word: τῷ βασιλεῖ τῶν Περσῶν
  choice: dem König der Perser
  rationale: Die formnahe Wiedergabe ist im Deutschen klar und würdevoll.
- source_word: εἰς τὸν τόπον οὗ
  choice: an dem Ort, wo
  rationale: εἰς hat im Zusammenhang mit dem Erscheinen des Wassers lokative Bedeutung; „wo“ gibt das Relativadverb natürlich wieder.
- source_word: οἱ μεταχθέντες ἱερεῖς
  choice: die weggeführten Priester
  rationale: „Weggeführt“ bewahrt den Sinn einer Entfernung von ihrem Ort, ohne ausdrücklich festzulegen, ob Verbannung oder Deportation gemeint ist.
- source_word: τὸ πῦρ ἔκρυψαν
  choice: das Feuer verborgen hatten
  rationale: Das Plusquamperfekt verdeutlicht im Deutschen, dass das Verbergen vor dem Erscheinen des Wassers und dem Bericht geschah.
- source_word: τὸ ὕδωρ ἐφάνη
  choice: Wasser zum Vorschein gekommen war
  rationale: Die idiomatische Wendung gibt das Erscheinen des Wassers und die zeitliche Vorordnung im berichteten Inhalt wieder.
- source_word: ἀφʼ οὗ
  choice: mit dem
  rationale: Im Deutschen ist die instrumentale Fassung bei „reinigen“ natürlich. Eine Fußnote hält fest, dass der griechische Ausdruck wörtlicher eine Herkunfts- oder Quellenbeziehung bezeichnet.
- source_word: οἱ περὶ τὸν Νεεμίαν
  choice: Nehemia und seine Begleiter
  rationale: Die griechische Gruppenformel bezeichnet Nehemia samt den mit ihm verbundenen Personen; diese Wiedergabe ist klar und schränkt die Gruppe nicht unnötig ein.
- source_word: ἥγνισαν τὰς θυσίας
  choice: die Opfer reinigten
  rationale: „Reinigten“ bewahrt den kultischen Sinn des Verbs, ohne die Handlung als bloße Weihe umzudeuten.
theological_decisions:
- issue: Kultische Bedeutung der Reinigung der Opfer
  choice: die Opfer reinigten
  alternative: die Opfer weihten
  rationale: Der griechische Text bezeichnet eine rituelle Reinigung. „Reinigten“ erhält die Spannung, ob die Opfergaben selbst oder der Opferhandlung zugehörige Dinge betroffen sind, besser als das deutendere „weihten“.
- issue: Beziehung des Wassers zur Reinigung
  choice: mit dem … reinigten, mit erläuternder Fußnote
  alternative: von dem/aus dem … reinigten
  rationale: Die Hauptfassung ist idiomatisches Deutsch; die Fußnote bewahrt die im griechischen ἀφʼ οὗ liegende mögliche Quellenbedeutung und macht die instrumentale Deutung transparent.
translation_notes:
  register: Moderner, würdevoller Erzählstil. Der Vers ist im griechischen Ausgangstext syntaktisch nicht abgeschlossen; daher bleibt auch die deutsche Fassung mit einem Komma offen und schließt an den folgenden Vers an.
