  text: and the appearances from heaven that came to those who fought bravely with zeal for Judaism[a], so that, though they were few, they plundered the whole country and drove off the barbarian hordes[c][b],
translation:
  language: de
  text: und die Erscheinungen, die vom Himmel denen zuteilwurden, die mutig und eifrig für das Judentum[a] kämpften, sodass sie, obwohl sie nur wenige waren, das ganze Land plünderten und die barbarischen Scharen[b] verfolgten,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Judentum“ bezeichnet hier die jüdische Religion und Lebensweise, die gegen äußeren Druck verteidigt wurde.
    reason: cultural_note
  - marker: b
    text: 'Das griechische „barbarische Scharen“ ist eine ethnokulturell wertende Bezeichnung aus der Perspektive des Textes; möglich ist auch: „fremde Scharen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιφανείας
  choice: Erscheinungen
  rationale: Bezeichnet sichtbare Manifestationen oder Erscheinungen; „Erscheinungen“ ist verständlich und vermeidet unnötige technische oder spätere theologische Nebenbedeutungen.
- source_word: τὰς ἐξ οὐρανοῦ γενομένας
  choice: vom Himmel, die … zuteilwurden
  rationale: Wahrt den himmlischen Ursprung und gibt zugleich wieder, dass diese Erscheinungen für die genannten Menschen geschahen.
- source_word: τοῖς ... φιλοτίμως ἀνδραγαθήσασιν
  choice: denen, die sich mutig und mit Eifer … einsetzten
  rationale: Gibt sowohl die Tapferkeit von ἀνδραγαθέω als auch den eifrigen, ehrenvollen Einsatz von φιλοτίμως wieder, ohne das Handeln enger als nötig ausschließlich auf den Kampf zu beschränken.
- source_word: ὑπὲρ τοῦ Ἰουδαισμοῦ
  choice: für das Judentum
  rationale: Direkte und etablierte Entsprechung für die verteidigte jüdische Religion und Lebensweise.
- source_word: ὡς
  choice: sodass
  rationale: Drückt hier die Folge der himmlischen Erscheinungen idiomatisch aus.
- source_word: τὴν ὅλην χώραν
  choice: das ganze Land
  rationale: Bewahrt die umfassende territoriale Aussage in natürlichem Deutsch.
- source_word: ὀλίγους ὄντας
  choice: obwohl sie nur wenige waren
  rationale: Macht den konzessiven Sinn des Partizips deutlich.
- source_word: λεηλατεῖν
  choice: plünderten
  rationale: Gibt die militärische Bedeutung des Erbeutens oder Plünderns direkt wieder.
- source_word: τὰ βάρβαρα πλήθη
  choice: die fremden Heerscharen
  rationale: „Fremd“ gibt βάρβαρα im antiken ethnokulturellen Sinn wieder, ohne das heute stark wertende deutsche „barbarisch“ unmarkiert in den Haupttext zu übernehmen; „Heerscharen“ passt zum militärischen Kontext von πλήθη.
- source_word: διώκειν
  choice: verfolgten
  rationale: Bewahrt die Grundbedeutung von διώκω und vermeidet die stärkere Ergebnisdeutung „vertrieben“.
theological_decisions:
- issue: Wiedergabe von Ἰουδαϊσμός im historischen Kontext
  choice: Judentum
  alternative: jüdische Lebensweise
  rationale: „Judentum“ entspricht dem griechischen Begriff direkt; eine Fußnote erläutert, dass hier Religion und Lebensweise gemeinsam gemeint sind.
- issue: Charakter der himmlischen Hilfe
  choice: Erscheinungen vom Himmel
  alternative: himmlische Offenbarungen
  rationale: Die Übersetzung wahrt die sichtbare Manifestation und ihren himmlischen Ursprung, ohne Art oder Träger der Erscheinungen genauer festzulegen, als es der griechische Text tut.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz bleibt als fortlaufender Bestandteil der längeren griechischen Konstruktion mit einem abschließenden Komma stehen. Die Formulierung bewahrt die militärische Härte von „plünderten“ und die Mehrdeutigkeit von διώκειν als „verfolgen“.
