  text: And the priests made prayer when the sacrifice had been consumed[a], both the priests and all the others, with Jonathan beginning and the rest responding[b], as in Nehemiah.
translation:
  language: de
  text: Während das Opfer verzehrt wurde, sprachen die Priester ein Gebet, sowohl die Priester als auch alle Anwesenden.[a] Jonatan begann, und die Übrigen antworteten laut, wie bei Nehemia.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Im Griechischen steht auffällig wiederholt: „die Priester … sowohl die Priester als auch alle“. Wahrscheinlich wird damit betont, dass sich die ganze Versammlung dem Gebet anschloss.'
    reason: lexical_alternative
  - marker: b
    text: 'Das Griechische lautet verkürzt: „wie [bei] Nehemia“. Die Wendung kann „wie Nehemia es getan hatte“ oder „wie im Gebet Nehemias“ bedeuten.'
    reason: alternative_reading
lexical_decisions:
- source_word: προσευχὴν … ἐποιήσαντο
  choice: sprachen … ein Gebet
  rationale: Die griechische Wendung bedeutet wörtlich, dass sie „ein Gebet machten“. „Ein Gebet sprechen“ gibt das Idiom in natürlichem, würdigem Deutsch wieder.
- source_word: δαπανωμένης τῆς θυσίας
  choice: während das Opfer verzehrt wurde
  rationale: Das Präsenspartizip bezeichnet hier einen gleichzeitig ablaufenden Vorgang. Im Opferkontext meint δαπανάω am ehesten das Aufzehren beziehungsweise Verbrennen des Opfers.
- source_word: οἵ τε ἱερεῖς καὶ πάντες
  choice: die Priester und alle Anwesenden
  rationale: Das Griechische wiederholt „die Priester“ und schließt danach πάντες, „alle“, ein. „Alle Anwesenden“ verdeutlicht den gemeinten Personenkreis, ohne nur die Priester als Handelnde erscheinen zu lassen.
- source_word: καταρχομένου Ἰωνάθον
  choice: Jonatan begann
  rationale: κατάρχομαι bezeichnet das Anfangen oder Anstimmen. „Begann“ bewahrt die Offenheit, ob Jonatan das Gebet, einen Wechselruf oder einen Gesang anstimmte.
- source_word: τῶν τε λοιπῶν ἐπιφωνούντων
  choice: die Übrigen antworteten laut
  rationale: ἐπιφωνέω bezeichnet ein hörbares Zurufen oder Antworten. Die Formulierung lässt den wahrscheinlich responsorischen Charakter erkennen, ohne ausdrücklich einen liturgischen Wechselgesang vorauszusetzen.
- source_word: ὡς Νεεμίου
  choice: wie bei Nehemia
  rationale: Die griechische Wendung ist stark verkürzt. „Wie bei Nehemia“ bleibt ebenso knapp und vermeidet es, im Haupttext eindeutig zwischen „wie Nehemia es tat“ und „wie im Gebet Nehemias“ zu entscheiden.
theological_decisions:
- issue: Bezug der elliptischen Schlusswendung ὡς Νεεμίου
  choice: wie bei Nehemia
  alternative: wie Nehemia es getan hatte; wie im Gebet Nehemias
  rationale: Der griechische Text nennt nur den Vergleich mit Nehemia und lässt das ergänzte Beziehungswort offen. Der Haupttext bewahrt diese Spannung; die Fußnote nennt die wichtigsten möglichen Ergänzungen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die ungewöhnliche Wiederholung des griechischen Subjekts wird im Haupttext sichtbar gehalten und in einer Fußnote erläutert; die elliptische Nehemia-Wendung wird nicht stillschweigend aufgelöst.
