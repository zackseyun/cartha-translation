lexical_decisions:
- source_word: ὁ μόνος χορηγός
  choice: der einzige Geber
  rationale: χρηγός bezeichnet den, der etwas bereitstellt oder gewährt. „Geber“ ist als göttlicher Titel würdevoll und weiter gefasst als „Versorger“, ohne die sozialgeschichtliche Spezialisierung von „Wohltäter“ oder „Mäzen“ einzutragen.
- source_word: ὁ μόνος δίκαιος
  choice: der allein Gerechte
  rationale: Das substantivierte Adjektiv wird als persönlicher Hoheitstitel wiedergegeben; „allein“ bewahrt die erneute Exklusivitätsaussage von μόνος.
- source_word: παντοκράτωρ
  choice: der Allmächtige
  rationale: Die etablierte deutsche Wiedergabe bewahrt Gewicht und Kürze des göttlichen Titels.
- source_word: αἰώνιος
  choice: der Ewige
  rationale: Als substantivierter Titel in der Reihe der Gottesbezeichnungen klingt „der Ewige“ natürlicher und feierlicher als „der ewig Seiende“.
- source_word: ὁ διασώζων
  choice: der … errettet
  rationale: διασῴζω bezeichnet das sichere Herausretten aus Gefahr. „Errettet“ wahrt sowohl den konkreten Rettungssinn als auch den gehobenen Gebetsstil.
- source_word: ἐκ παντὸς κακοῦ
  choice: aus allem Bösen
  rationale: κακόν kann Böses, Unheil oder Not bezeichnen. „Alles Böse“ lässt die moralische wie die leidbezogene Bedeutungsweite offen.
- source_word: τοὺς πατέρας
  choice: die Väter
  rationale: Die direkte Wiedergabe erhält die biblische Bezeichnung für Israels Vorfahren und passt zum feierlichen Register.
- source_word: ποιήσας … ἐκλεκτούς
  choice: zu Auserwählten gemacht hat
  rationale: Die Konstruktion ποιεῖν mit prädikativem Adjektiv bedeutet „zu etwas machen“. Das substantivierte „Auserwählte“ bildet den prädikativen Status im Deutschen verständlich ab.
- source_word: ἡγίασας
  choice: du hast sie geheiligt
  rationale: Die finite Verbform steht in der zweiten Person Singular. Die Übersetzung bewahrt diesen Wechsel zur direkten Anrede, statt sie wie ein weiteres Partizip anzugleichen.
theological_decisions:
- issue: Reihe göttlicher Hoheitstitel
  choice: Die appositionale Folge bleibt als Reihe von Titeln erhalten.
  alternative: 'Dynamisch in selbstständige Sätze auflösen: „Du allein gibst; du allein bist gerecht, allmächtig und ewig …“'
  rationale: Die Artikel- und Partizipialkonstruktionen des Griechischen prägen den feierlichen Gebetsstil. Eine Auflösung würde die syntaktische Gestalt stärker verändern als nötig.
- issue: Wechsel von der dritten zur zweiten Person bei ἡγίασας
  choice: „und du hast sie geheiligt“
  alternative: „und sie geheiligt hat“ beziehungsweise „der sie heiligte“
  rationale: Der überlieferte griechische Text hat eindeutig die zweite Person Singular. Der abrupte Anredewechsel wird als echte Spannung des Textes bewahrt und nicht stillschweigend harmonisiert.
- issue: Bedeutung von ἁγιάζω
  choice: „heiligen“
  alternative: „heilig machen“ oder „weihen“
  rationale: „Heiligen“ lässt sowohl das Heiligmachen als auch das Aussondern für Gott anklingen, ohne die Aussage auf einen bestimmten rituellen Vorgang zu verengen.
translation_notes:
  register: Moderner, würdevoller Gebetsstil mit verständlichen traditionellen Gottesbezeichnungen. Die Kleinschreibung am Anfang und das Semikolon am Ende zeigen, dass der Vers syntaktisch in einen größeren Zusammenhang eingebettet ist. Der auffällige Personenwechsel der griechischen Vorlage wird bewusst beibehalten.
