base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/002/037.yaml
  text: Just as Moses prayed to the Lord[a], and fire came down from heaven and consumed the things of the sacrifice, so also Solomon prayed to the Lord[b], and the fire came down and consumed the whole burnt offerings.
translation:
  language: de
  text: Wie Mose zum Herrn betete und Feuer vom Himmel herabkam und alles verzehrte, was zum Opfer gehörte,[a] so betete auch Salomo zum Herrn; und das Feuer kam herab[c] und verzehrte die Ganzbrandopfer.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die Dinge des Opfers“; gemeint sein können die zum Opfer gehörenden Gaben oder Bestandteile.'
    reason: lexical_alternative
  - marker: b
    text: Das griechische Wort bezeichnet Opfer, die vollständig verbrannt wurden.
    reason: lexical_alternative
  - marker: c
    text: Der griechische Wortlaut ist hier syntaktisch auffällig und hat wörtlich die Infinitivform „herabzukommen“. Die Übersetzung folgt dem Parallelismus mit dem vorangehenden Satz.
    reason: textual_syntax
lexical_decisions:
- source_word: προσηύξατο πρὸς Κύριον
  choice: betete zum Herrn
  rationale: Die schlichte Wiedergabe entspricht dem Aorist von προσεύχομαι und bewahrt mit „Herr“ die Ausdrucksweise des griechischen Zeugen, ohne den hebräischen Gottesnamen einzutragen.
- source_word: κατέβη πῦρ ἐκ τοῦ οὐρανοῦ
  choice: Feuer vom Himmel herabkam
  rationale: Dies gibt die anschauliche Bewegung des Feuers in natürlichem modernem Deutsch wieder.
- source_word: τὰ τῆς θυσίας
  choice: alles, was zum Opfer gehörte
  rationale: Die substantivierte, weit gefasste griechische Wendung wird verständlich wiedergegeben, ohne sie vorschnell auf nur einen Opferbestandteil einzuengen.
- source_word: ἐδαπάνησεν / ἀνήλωσεν
  choice: verzehrte
  rationale: Bei Feuer und Opfergut ist „verzehrte“ für beide Verben idiomatisch und erhält den Parallelismus.
- source_word: ὁλοκαυτώματα
  choice: Ganzbrandopfer
  rationale: Der kultische Fachausdruck bezeichnet Opfer, die vollständig verbrannt wurden; „Ganzbrandopfer“ bewahrt diese Besonderheit.
theological_decisions:
- issue: Wiedergabe von Κύριον als Bezeichnung für Israels Gott
  choice: Herrn
  alternative: HERRN
  rationale: Der griechische Ausgangstext hat Κύριον und nicht unmittelbar den hebräischen Gottesnamen; daher wird keine typografische Tetragramm-Konvention importiert.
- issue: Kultische Genauigkeit von ὁλοκαυτώματα
  choice: Ganzbrandopfer
  alternative: Brandopfer
  rationale: Die gewählte Form macht kenntlich, dass diese Opfer vollständig verbrannt wurden, ohne eine konfessionelle Deutung hinzuzufügen.
- issue: Syntaktisch auffällige Form καταβῆναι im letzten Satzteil
  choice: da kam das Feuer herab
  alternative: und dass das Feuer herabkomme, verzehrte die Ganzbrandopfer
  rationale: Der überlieferte griechische Wortlaut ist an dieser Stelle syntaktisch gedrängt beziehungsweise auffällig. Die Hauptübersetzung folgt dem klaren Parallelismus mit dem ersten Satzteil; die formale Schwierigkeit wird in einer Fußnote offengelegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bewahrt den Vergleich zwischen Mose und Salomo; das Semikolon macht den langen Parallelismus lesbar. „Ganzbrandopfer“ ist präzise und im biblisch-kultischen Zusammenhang verständlich.
