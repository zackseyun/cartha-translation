  text: just as he promised through the law[a]. For we hope in God that he will soon have mercy on us and gather us from under heaven into the holy place[c][b]; for he rescued us from great evils and cleansed the place.
translation:
  language: de
  text: wie er es durch das Gesetz verheißen hat. Denn wir hoffen auf Gott, dass er sich bald über uns erbarmen und uns von überall unter dem Himmel[a] an den heiligen Ort[b] zusammenführen wird; denn er hat uns aus großem Unheil[c] errettet und den Ort gereinigt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Wendung ist elliptisch; gemeint ist offenbar: von überall her unter dem Himmel, also aus den Orten der Zerstreuung.'
    reason: lexical_alternative
  - marker: b
    text: Gemeint ist die heilige Stätte in Jerusalem, im Zusammenhang also das Tempelgebiet.
    reason: cultural_note
  - marker: c
    text: 'Oder: „aus großen Nöten“ beziehungsweise „aus großen Katastrophen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς ἐπηγγείλατο
  choice: wie er es … verheißen hat
  rationale: „Wie“ bewahrt den vergleichenden Bezug von καθώς; „verheißen“ gibt ἐπαγγέλλομαι in diesem feierlich-religiösen Zusammenhang natürlich wieder.
- source_word: διὰ τοῦ νόμου
  choice: durch das Gesetz
  rationale: διά mit Genitiv bezeichnet hier das Mittel, durch das die Verheißung vermittelt wurde.
- source_word: ἐλπίζομεν … ἐπὶ τῷ θεῷ
  choice: wir hoffen auf Gott
  rationale: Die deutsche Wendung „auf Gott hoffen“ entspricht der Konstruktion mit ἐπί und Dativ.
- source_word: ταχέως
  choice: bald
  rationale: Im zukunftsbezogenen Satz bezeichnet das Adverb zeitliche Nähe; „bald“ klingt im Deutschen natürlicher als „schnell“.
- source_word: ἐλεήσει
  choice: sich … über uns erbarmen
  rationale: Die feste deutsche Wendung bewahrt den Sinn göttlichen Erbarmens von ἐλεέω.
- source_word: ἐπισυνάξει
  choice: zusammenführen
  rationale: Das Verb bezeichnet das Zusammenbringen beziehungsweise Sammeln und trägt hier den Gedanken der Rückführung der Zerstreuten.
- source_word: ἐκ τῆς ὑπὸ τὸν οὐρανόν
  choice: von überall unter dem Himmel
  rationale: Die griechische Formulierung ist elliptisch. Die Wiedergabe vermittelt verständlich die weltweite Zerstreuung, ohne im Haupttext ein bestimmtes ausgelassenes Substantiv zu ergänzen.
- source_word: εἰς τὸν ἅγιον τόπον
  choice: an den heiligen Ort
  rationale: „Ort“ entspricht τόπος, während „an“ im Deutschen die Bewegung zu einer heiligen Stätte natürlich ausdrückt.
- source_word: ἐξείλατο
  choice: errettet
  rationale: Das Medium von ἐξαιρέω bedeutet aus Gefahr befreien. „Errettet“ ist würdevoll und im religiösen Kontext gut verständlich.
- source_word: ἐκ μεγάλων κακῶν
  choice: aus großem Unheil
  rationale: Das kollektive „Unheil“ wahrt die Bedeutungsbreite von κακά zwischen Übeln, Nöten und Katastrophen.
- source_word: τὸν τόπον ἐκαθάρισεν
  choice: den Ort gereinigt
  rationale: Die Übersetzung hält an dem allgemeinen Substantiv τόπος fest und gibt καθαρίζω direkt mit „reinigen“ wieder.
theological_decisions:
- issue: Bezug von „dem heiligen Ort“ und „dem Ort“
  choice: Beide Vorkommen von τόπος werden als „Ort“ wiedergegeben.
  alternative: „Heiligtum“ oder „Tempel“
  rationale: Der Zusammenhang weist auf die Tempelstätte in Jerusalem, doch der griechische Text verwendet das allgemeinere Wort τόπος. Die spezifische Einordnung steht deshalb in einer Fußnote statt als interpretierende Erweiterung im Haupttext.
- issue: Reichweite der Sammlung „unter dem Himmel“
  choice: Die Wendung wird als Sammlung der Zerstreuten von überall her wiedergegeben.
  alternative: Aus einem bestimmten „Land unter dem Himmel“
  rationale: Die griechische Formulierung ist elliptisch und lässt ein Bezugswort unausgesprochen. Die Übersetzung wahrt das Bild und kennzeichnet die sprachliche Schwierigkeit in der Fußnote.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur folgt dem argumentativen Gang des Griechischen, wird aber idiomatisch formuliert. „Verheißen“, „erbarmen“ und „errettet“ erhalten den religiösen Ton, ohne konfessionelle Sonderbegriffe einzuführen.
