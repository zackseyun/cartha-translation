  text: Ebenso feierte auch Salomo acht Tage lang.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡσαύτως
  choice: Ebenso
  rationale: Gibt die rückbezügliche Vergleichspartikel knapp und natürlich wieder.
- source_word: ἤγαγεν
  choice: feierte … lang
  rationale: Das wörtliche „führte/beging die acht Tage“ bezeichnet hier idiomatisch das Abhalten einer achttägigen Feier; „feierte acht Tage lang“ ist im modernen Deutschen natürlich und wahrt den zeitlichen Umfang.
- source_word: τὰς ὀκτὼ ἡμέρας
  choice: acht Tage lang
  rationale: Der Akkusativ bezeichnet in Verbindung mit ἄγω die Dauer beziehungsweise den Umfang der Feier. Der deutsche temporale Ausdruck vermeidet das unnatürliche „die acht Tage halten“.
theological_decisions: []
translation_notes:
  register: Kurzer, würdevoller Erzählsatz in modernem Standarddeutsch. Das doppelte Anschlussmoment von ὡσαύτως καί wird mit „Ebenso … auch“ bewahrt; ein im Griechischen nicht ausdrücklich genanntes Fest wird nicht ergänzt.
