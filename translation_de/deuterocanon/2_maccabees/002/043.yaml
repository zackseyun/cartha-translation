  text: Since we are about to celebrate the purification[a], we have written to you. Therefore you will do well to observe the days.
translation:
  language: de
  text: Da wir nun im Begriff sind, die Reinigung zu feiern, haben wir euch geschrieben. Ihr werdet also gut daran tun, die Tage zu feiern.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Tage zu begehen“ beziehungsweise „die Tage zu halten“. Im Griechischen steht hier dasselbe Verb wie zuvor bei der Feier der „Reinigung“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μέλλοντες
  choice: da wir … feiern wollen
  rationale: Das Partizip bezeichnet die bevorstehende beziehungsweise beabsichtigte Feier. Die deutsche Wendung gibt diesen prospektiven Sinn natürlich wieder.
- source_word: ἄγειν
  choice: feiern
  rationale: Das Verb steht zweimal und bezeichnet im Festzusammenhang das Begehen oder Feiern einer Feier beziehungsweise bestimmter Tage. Die Wiederholung von „feiern“ bildet die Wiederholung des griechischen Verbs ab.
- source_word: τὸν καθαρισμόν
  choice: die Reinigung
  rationale: Die wörtliche Bedeutung „Reinigung“ bleibt erhalten. Der Zusammenhang lässt erkennen, dass die Feier zur Erinnerung an die Reinigung des Tempels gemeint ist, ohne dass „Fest“ ausdrücklich in den Text eingefügt wird.
- source_word: ἐγράψαμεν
  choice: haben wir euch geschrieben
  rationale: Das Perfekt ist im modernen Deutsch für den Bezug auf den vorliegenden Brief natürlich und gibt den epistolaren Aorist angemessen wieder.
- source_word: καλῶς … ποιήσετε
  choice: ihr tut … gut daran
  rationale: Diese geläufige deutsche Wendung gibt die griechische Empfehlung beziehungsweise Aufforderung klar und idiomatisch wieder.
- source_word: τὰς ἡμέρας
  choice: die Tage
  rationale: Der griechische Text nennt schlicht „die Tage“. Die Formulierung bewahrt diese Offenheit, statt erklärend „Festtage“ einzusetzen.
