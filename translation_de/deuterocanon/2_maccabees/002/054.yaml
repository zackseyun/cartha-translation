  yaml_path: translation/deuterocanon/2_maccabees/002/054.yaml
  text: For just as it is not easy for one who prepares a banquet[a], or even seeks the benefit of others, yet for the gratitude of the many we will gladly endure the hardship[b];
translation:
  language: de
  text: Denn wie es für den, der ein Gastmahl[a] ausrichtet oder auch den Nutzen anderer sucht, nicht leicht ist, so wollen wir dennoch um der Dankbarkeit der Vielen[b] willen die Mühsal gern auf uns nehmen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Festmahl«; das griechische Wort kann ein Gastmahl oder ein Symposion bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Mit der »Dankbarkeit der Vielen« ist der Dank oder die Anerkennung vieler Leser gemeint, kein sakramentaler Fachbegriff.
    reason: cultural_note
lexical_decisions:
- source_word: καθάπερ
  choice: Denn wie
  rationale: Leitet begründend einen Vergleich ein und knüpft den Satz an die vorausgehenden Ausführungen an.
- source_word: τῷ παρασκευάζοντι συμπόσιον
  choice: für den, der ein Gastmahl ausrichtet
  rationale: Die Dativkonstruktion bezeichnet die Person, für die etwas schwierig ist; „Gastmahl ausrichten“ gibt die Vorbereitung und Veranstaltung eines συμποσίον natürlich wieder.
- source_word: ἢ καὶ ζητοῦντι τὴν ἑτέρων ὠφέλειαν
  choice: oder auch den Nutzen anderer sucht
  rationale: Bewahrt die alternative beziehungsweise erweiternde Formulierung und den altruistischen Sinn von ὠφέλεια.
- source_word: οὐκ εὐχερές
  choice: nicht leicht ist
  rationale: Gibt die idiomatische Aussage über die Schwierigkeit schlicht und unmittelbar wieder.
- source_word: ὅμως
  choice: dennoch
  rationale: Markiert klar den Gegensatz zwischen der Schwierigkeit der Aufgabe und der Bereitschaft, sie zu übernehmen.
- source_word: διὰ τὴν τῶν πολλῶν εὐχαριστίαν
  choice: um der Dankbarkeit der vielen willen
  rationale: Bewahrt sowohl den gewöhnlichen Sinn „Dankbarkeit“ als auch die auffällige griechische Wendung „der vielen“, ohne einen sakramentalen Fachsinn einzutragen.
- source_word: ἡδέως
  choice: gern
  rationale: Drückt die bereitwillige, positive Haltung in natürlichem modernem Deutsch aus.
- source_word: τὴν κακοπάθειαν ὑποίσομεν
  choice: die Mühsal ... auf uns nehmen
  rationale: Die Verbindung bezeichnet das willige Tragen einer beschwerlichen Arbeit; „Mühsal“ passt zum literarischen Arbeitsaufwand, ohne Verfolgung oder extremes Leiden zu unterstellen.
theological_decisions:
- issue: Bedeutung von εὐχαριστία
  choice: gewöhnliche Dankbarkeit beziehungsweise Anerkennung der Leser
  alternative: allgemeine Danksagung oder ein späterer sakramentaler Fachsinn
  rationale: Der Zusammenhang ist das Vorwort eines Bearbeiters, der von der Aufnahme seiner mühevollen Arbeit durch viele spricht. Ein liturgisch-sakramentaler Sinn ist hier nicht angezeigt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das im Griechischen nur angedeutete Vergleichsgefüge wird mit „wie ... so“ idiomatisch vervollständigt, ohne den Gedankengang inhaltlich festzulegen. „Gastmahl“, „Mühsal“ und „um ... willen“ halten den literarischen Ton, bleiben aber allgemein verständlich.
