  text: Having been saved by God from great dangers[a], we give him great thanks, as if arrayed against a king.
translation:
  language: de
  text: Von Gott aus großen Gefahren gerettet, danken wir ihm überaus, als wären wir gegen einen König zur Schlacht aufgestellt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »als stünden wir einem König in Schlachtordnung gegenüber«. Der griechische Vergleich ist knapp formuliert und lässt in der militärischen Nuance geringfügig verschiedene Wiedergaben zu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ μεγάλων κινδύνων
  choice: aus großen Gefahren
  rationale: Die Wendung bewahrt die räumliche Grundbedeutung von ἐκ sowie den Plural und gibt κινδύνοι klar als »Gefahren« wieder.
- source_word: ὑπὸ τοῦ θεοῦ
  choice: von Gott
  rationale: ὑπό mit Genitiv bezeichnet hier den Urheber der Rettung; im Deutschen steht »Gott« idiomatisch ohne Artikel.
- source_word: σεσωσμένοι
  choice: gerettet
  rationale: Das Perfektpartizip bezeichnet eine vollzogene Rettung mit fortbestehendem Ergebnis. Die vorangestellte Partizipialkonstruktion bildet dies knapp und natürlich ab.
- source_word: μεγάλως εὐχαριστοῦμεν αὐτῷ
  choice: danken wir ihm überaus
  rationale: »Überaus« erhält die starke Intensivierung durch μεγάλως, während »ihm danken« den Dativ αὐτῷ idiomatisch wiedergibt.
- source_word: ὡς ἂν
  choice: als wären wir
  rationale: Die irreale Vergleichsformulierung gibt die durch ἄν nuancierte, gedrängte Vergleichsaussage im Deutschen natürlich wieder.
- source_word: πρὸς βασιλέα
  choice: gegen einen König
  rationale: In Verbindung mit παρατάσσομαι hat πρός am ehesten adversative Bedeutung und bezeichnet das Gegenüber in einer militärischen Aufstellung.
- source_word: παρατασσόμενοι
  choice: zur Schlacht aufgestellt
  rationale: Die Wiedergabe erhält das konkrete Bild einer geordneten militärischen Aufstellung, statt es allgemein zu »kämpfen« abzuschwächen.
theological_decisions:
- issue: Militärischer Vergleich im Schlusssatz
  choice: als wären wir gegen einen König zur Schlacht aufgestellt
  alternative: als stünden wir einem König in Schlachtordnung gegenüber
  rationale: Die Hauptfassung bewahrt sowohl den Vergleichscharakter als auch die wahrscheinlich adversative Bedeutung von πρός und das militärische Bild des Partizips. Wegen der gedrängten griechischen Formulierung wird eine leicht anders nuancierte Wiedergabe in der Fußnote genannt, ohne die Spannung aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die vorangestellte Partizipialwendung wahrt die Struktur des Griechischen; »zur Schlacht aufgestellt« macht das militärische Bild für heutige Leser verständlich, ohne es auszudeuten.
