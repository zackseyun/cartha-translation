  text: Accept the sacrifice for all your people Israel[b][a], and preserve your portion and sanctify it.
translation:
  language: de
  text: Nimm das Opfer[a] für dein ganzes Volk Israel an, bewahre deinen Anteil[b] und heilige ihn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Nimm die Opfergabe für dein ganzes Volk Israel an.“'
    reason: lexical_alternative
  - marker: b
    text: „Dein Anteil“ bezieht sich wahrscheinlich auf Israel als das Volk, das Gott gehört; auch „dein Erbteil“ ist möglich.
    reason: alternative_reading
lexical_decisions:
- source_word: πρόσδεξαι
  choice: nimm … an
  rationale: Der griechische Aoristimperativ von προσδέχομαι bittet im Gebetskontext darum, dass Gott das Opfer wohlwollend annimmt. „Nimm … an“ ist im modernen Deutschen natürlich und bewahrt diesen Sinn.
- source_word: θυσίαν
  choice: das Opfer
  rationale: θυσία bezeichnet hier eine kultische Opfergabe. „Opfer“ gibt diesen spezifischen Sinn knapp und würdig wieder.
- source_word: ὑπὲρ παντὸς τοῦ λαοῦ σου Ἰσραήλ
  choice: für dein ganzes Volk Israel
  rationale: ὑπέρ mit dem Genitiv bezeichnet hier Stellvertretung oder Begünstigung. „Für dein ganzes Volk Israel“ gibt sowohl den Bezug als auch die kollektive Gesamtheit von παντός wieder.
- source_word: διαφύλαξον
  choice: bewahre
  rationale: διαφυλάσσω bedeutet schützen, sicher bewahren oder erhalten. „Bewahre“ passt zum Gebetsstil und bleibt semantisch offen genug.
- source_word: τὴν μερίδα σου
  choice: deinen Anteil
  rationale: μερίς bezeichnet einen Anteil oder ein zugeteiltes Teil. „Deinen Anteil“ erhält das griechische Bild, ohne den Bezug ausdrücklich als „Erbteil“ oder „Volk“ auszudeuten.
- source_word: καθαγίασον
  choice: heilige ihn
  rationale: καθαγιάζω bedeutet heiligen oder weihen. Das Pronomen „ihn“ nimmt grammatisch „deinen Anteil“ auf und macht das im Griechischen unausgesprochene Objekt im Deutschen deutlich.
theological_decisions:
- issue: Bezug von „deinen Anteil“
  choice: Das Bild „deinen Anteil“ bleibt im Haupttext erhalten und wird wahrscheinlich auf Israel bezogen.
  alternative: „dein Erbteil“ oder ausdrücklich „dein Volk“
  rationale: Der griechische Text lässt die Metapher stehen. Da Israel unmittelbar zuvor als Gottes Volk bezeichnet wird, bewahrt „deinen Anteil“ den möglichen Bundes- und Zugehörigkeitsklang, ohne ihn im Haupttext verbindlich auszulegen.
translation_notes:
  register: Natürliches, modernes Standarddeutsch in würdigem Gebetsstil. Die parallelen Imperative „nimm … an“, „bewahre“ und „heilige“ entsprechen der knappen Struktur des griechischen Textes; die Metapher „dein Anteil“ bleibt bewusst erhalten.
