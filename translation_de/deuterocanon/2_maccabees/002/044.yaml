  text: But God[a], who saved all his people and gave his inheritance to all, and the kingship, and the priesthood, and the sanctification[c][b],
translation:
  language: de
  text: Gott aber, der sein ganzes Volk gerettet und allen sein Erbe, die Königsherrschaft, das Priestertum und die Heiligung[a][b][c] gegeben hat,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „zurückgegeben“ oder „wiederhergestellt“. Das griechische Verb kann sowohl das Geben als auch das Zurückgeben oder Wiederherstellen bezeichnen.'
    reason: lexical_alternative
  - marker: b
