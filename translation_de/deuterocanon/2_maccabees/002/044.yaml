    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ θεός
  choice: Gott aber
  rationale: δέ führt den vorausgehenden Zusammenhang weiter und kann zugleich einen leichten Gegensatz markieren; die Nachstellung von „aber“ entspricht natürlichem, würdevollem Deutsch.
- source_word: ὁ σώσας
  choice: der … gerettet … hat
  rationale: Das substantivisch-relativisch wiedergegebene Aoristpartizip bezeichnet Gottes vollzogene Rettungstat.
- source_word: τὸν πάντα λαὸν αὐτοῦ
  choice: sein ganzes Volk
  rationale: Die Konstruktion mit Artikel und πᾶς bezeichnet das Volk als vollständige Gesamtheit; „sein ganzes Volk“ ist im Deutschen präziser als das potenziell distributive „alle seine Leute“.
- source_word: ἀποδοὺς
  choice: zurückgegeben
  rationale: ἀποδίδωμι kann „geben“, besonders aber auch „zurückgeben“ oder „wiederherstellen“ bedeuten. Im Zusammenhang der erneuerten Bundesgüter bringt „zurückgegeben“ diese mögliche restitutive Bedeutung klar zum Ausdruck, ohne sie in der Fußnote zu verbergen.
- source_word: τὴν κληρονομίαν αὐτοῦ
  choice: sein Erbe
  rationale: Das singularische αὐτοῦ bezieht sich grammatisch am nächsten auf Gott. Die formale Wendung bewahrt die Aussage, dass das Erbe ihm gehört und von ihm zugeteilt beziehungsweise zurückgegeben wird.
- source_word: πᾶσιν
  choice: allen
  rationale: Der knappe Dativ Plural bleibt ohne ergänztes Substantiv erhalten und bezieht sich naheliegend auf das ganze Volk.
- source_word: τὸ βασίλειον
  choice: die Königsherrschaft
  rationale: βασίλειον kann Königsherrschaft, königliche Würde oder Königreich bezeichnen. In der Reihe mit Priestertum und Heiligung passt die institutionell-abstrakte Bedeutung „Königsherrschaft“ besonders gut.
- source_word: τὸ ἱεράτευμα
  choice: das Priestertum
  rationale: „Priestertum“ ist die übliche und natürliche deutsche Bezeichnung für das priesterliche Amt beziehungsweise die priesterliche Institution.
- source_word: τὸν ἁγιασμόν
  choice: die Heiligung
  rationale: „Heiligung“ wahrt die theologische und kultische Bedeutungsbreite von ἁγιασμός; je nach Akzent sind auch „Heiligkeit“ und „Weihe“ möglich.
theological_decisions:
- issue: Bezug des Possessivpronomens in „sein Erbe“
  choice: 'Das Pronomen wird auf Gott bezogen: „sein Erbe“.'
  alternative: 'Sinngemäßer Bezug auf das Volk: „ihr Erbe“.'
  rationale: αὐτοῦ verweist grammatisch am unmittelbarsten auf θεός. Die wörtlichere Wiedergabe erhält die bundestheologische Spannung, dass das Erbe Gott gehört und zugleich seinem Volk gegeben wird.
- issue: Bedeutung von βασίλειον
  choice: Königsherrschaft
  alternative: Königreich; königliche Würde
  rationale: Die abstrakte Wiedergabe fügt sich in die Aufzählung von Bundesgütern, ohne den Begriff auf ein Gebiet oder Reich festzulegen.
- issue: Bedeutung von ἁγιασμός
  choice: Heiligung
  alternative: Heiligkeit; Weihe
  rationale: Der griechische Ausdruck kann einen Vorgang, einen geheiligten Zustand oder kultische Weihe bezeichnen. „Heiligung“ bewahrt diese theologische Offenheit am ehesten; die Alternativen werden ausdrücklich genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die partizipiale griechische Satzstruktur wird durch einen Relativsatz natürlich wiedergegeben; die offene Aufzählung und das abschließende Komma bleiben erhalten, weil der vorgelegte Vers syntaktisch in den folgenden Text weiterführt.
