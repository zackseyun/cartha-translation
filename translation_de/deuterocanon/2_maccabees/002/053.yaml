  text: And for us[a], who have undertaken the hardship of making the abridgment, the task is not easy, but one of sweat and sleeplessness;
translation:
  language: de
  text: Für uns aber, die wir die Mühsal der Erstellung einer Kurzfassung auf uns genommen haben[a], ist die Arbeit nicht leicht, sondern sie erfordert Schweiß und Schlaflosigkeit;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher etwa: „die wir die Mühsal der Kurzfassung gezeigt haben“. Die griechische Wendung ist ungewöhnlich; im Zusammenhang kann sie bedeuten, dass die Verfasser die mit der Erstellung der Kurzfassung verbundene Mühsal auf sich genommen und ertragen haben.'
