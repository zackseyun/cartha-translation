lexical_decisions:
- source_word: ἡμῖν μὲν τοῖς
  choice: Für uns aber, die wir
  rationale: Die Dativkonstruktion mit substantiviertem Partizip bezeichnet die Verfasser als diejenigen, für die das Folgende gilt. „Für uns aber, die wir“ ist natürliches Deutsch und gibt zugleich das μὲν wieder, das den Gegensatz im Zusammenhang vorbereitet.
- source_word: τὴν κακοπάθειαν
  choice: die Mühsal
  rationale: κακοπάθεια bezeichnet beschwerliches Leiden beziehungsweise das Ertragen von Mühe. Im Zusammenhang der redaktionellen Arbeit trifft „Mühsal“ den Sinn, ohne an Verfolgung denken zu lassen.
- source_word: ἐπιδεδειγμένοις
  choice: auf uns genommen haben
  rationale: Das Perfektpartizip von ἐπιδείκνυμι bedeutet wörtlich „gezeigt/erwiesen habend“. Mit κακοπάθεια beschreibt es idiomatisch, dass die Verfasser die Mühsal auf sich genommen und erfahren haben. Die Fußnote bewahrt den ungewöhnlicheren wörtlichen Ausdruck.
- source_word: τῆς ἐπιτομῆς
  choice: der Kürzung
  rationale: ἐπιτομή bezeichnet hier das Herstellen einer gekürzten Fassung. „Kürzung“ ist im modernen Deutschen verständlich und passt zur Tätigkeit des Bearbeiters.
- source_word: οὐ ῥᾴδιον
  choice: ist ... nicht leicht
  rationale: Die schlichte deutsche Formulierung entspricht unmittelbar dem griechischen Prädikatsadjektiv und bewahrt die Aussage über die Schwierigkeit.
- source_word: ἱδρῶτος δὲ καὶ ἀγρυπνίας
  choice: sondern mit Schweiß und Schlaflosigkeit verbunden
  rationale: Die beiden Genitive kennzeichnen, was diese Arbeit erfordert. Die Übersetzung bewahrt das körperliche Bild des Schweißes sowie die ausdrücklich genannte Schlaflosigkeit und formuliert zugleich idiomatisch.
- source_word: τὸ πρᾶγμα
  choice: die Arbeit
  rationale: πρᾶγμα bezeichnet hier das konkrete Vorhaben beziehungsweise die Aufgabe der Kürzung. „Arbeit“ ist im Zusammenhang klar und natürlich.
