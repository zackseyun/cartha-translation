  text: und außerdem die Kriege gegen Antiochus Epiphanes und dessen Sohn Eupator,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔτι τε
  choice: und außerdem
  rationale: Die Wortverbindung fügt der fortlaufenden Aufzählung einen weiteren Punkt hinzu. „Und außerdem“ gibt diese additive Funktion in natürlichem modernem Deutsch wieder.
- source_word: τοὺς ... πολέμους
  choice: die Kriege
  rationale: πολέμους bezeichnet hier allgemein Kriege beziehungsweise militärische Auseinandersetzungen; „die Kriege“ entspricht dem griechischen Plural und dem zusammenfassenden Stil.
- source_word: πρὸς
  choice: gegen
  rationale: In Verbindung mit πολέμους bezeichnet πρὸς die Gegner, gegen die Krieg geführt wurde. „Gegen“ gibt diese feindliche Ausrichtung idiomatisch wieder.
- source_word: Ἀντίοχον τὸν Ἐπιφανῆ
  choice: Antiochus Epiphanes
  rationale: Der Königsname samt Beiname wird in seiner geläufigen historischen Form transliteriert, statt den Beinamen („der Erscheinende/Glanzvolle“) auszudeuten.
- source_word: τὸν τούτου υἱὸν Εὐπάτορα
  choice: dessen Sohn Eupator
  rationale: τούτου verweist auf Antiochus zurück. „Dessen Sohn Eupator“ bewahrt den eindeutigen Bezug knapp und vermeidet die mögliche umgangssprachliche Unklarheit von „seinen Sohn“.
