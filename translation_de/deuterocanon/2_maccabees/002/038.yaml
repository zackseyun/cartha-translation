  text: And Moses said[a], “Because it was not eaten, the sin offering was consumed.”
translation:
  language: de
  text: 'Und Mose sagte: »Weil es nicht gegessen worden war, wurde das Sündopfer[a] aufgezehrt.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »das, was die Sünde betrifft«. Die griechische Wendung ist eine übliche biblische Bezeichnung für ein Sündopfer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ εἶπεν Μωυσῆς
  choice: Und Mose sagte
  rationale: Die schlichte Erzählverknüpfung mit καί wird als »Und« bewahrt; die Wortstellung ist natürliches modernes Deutsch.
- source_word: Διὰ τὸ μὴ βεβρῶσθαι
  choice: Weil es nicht gegessen worden war
  rationale: διά mit substantiviertem Infinitiv bezeichnet den Grund. Der Perfekt Passiv βεβρῶσθαι wird durch das deutsche Plusquamperfekt wiedergegeben, das den vorausliegenden Zustand klar ausdrückt.
- source_word: τὸ περὶ τῆς ἁμαρτίας
  choice: das Sündopfer
  rationale: Die Wendung ist im biblisch-griechischen Opferwortschatz eine feste Bezeichnung für das Sündopfer. Eine streng wörtliche Wiedergabe wie »das die Sünde Betreffende« wäre im Deutschen unnötig dunkel.
- source_word: ἀνηλώθη
  choice: wurde vernichtet
  rationale: Das Passiv von ἀναλίσκω kann »aufgebraucht«, »verzehrt« oder »vernichtet« bedeuten. »Vernichtet« ist hier idiomatisch und legt nicht ausdrücklich fest, auf welche Weise das Opfer beseitigt wurde; insbesondere ergänzt es nicht eigenmächtig »verbrannt«.
theological_decisions:
- issue: Kultische Bedeutung von τὸ περὶ τῆς ἁμαρτίας
  choice: das Sündopfer
  alternative: das die Sünde Betreffende; das für die Sünde Bestimmte
  rationale: Der etablierte kultische Sinn wird verständlich wiedergegeben, ohne der Wendung eine weitergehende konfessionelle Deutung aufzuerlegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Begründungsstruktur des Griechischen bleibt erhalten. »Vernichtet« vermeidet sowohl das missverständliche »verzehrt« unmittelbar nach »gegessen« als auch die im Griechischen nicht ausdrücklich genannte Präzisierung »verbrannt«.
