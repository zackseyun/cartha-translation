  text: But the pursuit of brevity in expression[a], and the refusal of an elaborate treatment of the subject, should be allowed to one who is making an abridgment.
translation:
  language: de
  text: Das Streben nach knapper Ausdrucksweise und der Verzicht auf eine ausführliche Behandlung des Stoffes sollten dem zugestanden werden, der eine Kurzfassung erstellt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der eine Übersetzung anfertigt“, wenn μετάφρασις in seinem geläufigeren Sinn verstanden wird; im vorliegenden Zusammenhang liegt jedoch „Kurzfassung“ oder „Auszug“ näher.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ σύντομον τῆς λέξεως
  choice: eine knappe Ausdrucksweise
  rationale: Das substantivierte σύντομον bezeichnet hier die Kürze bzw. Knappheit der sprachlichen Darstellung; λέξις meint die Ausdrucksweise, nicht ein einzelnes Wort.
- source_word: μεταδιώκειν
  choice: nach … gestrebt wird
  rationale: Das Verb bezeichnet ein bewusstes Anstreben. Die passive Formulierung fügt sich natürlich in die deutsche Konstruktion mit συγχωρητέον ein.
- source_word: τὸ ἐξεργαστικὸν τῆς πραγματίας
  choice: eine ausführliche Behandlung des Stoffes
  rationale: ἐξεργαστικόν bezeichnet die eingehende Ausarbeitung; πραγματεία meint hier den behandelten Stoff bzw. Gegenstand.
- source_word: παραιτεῖσθαι
  choice: auf … verzichtet wird
  rationale: Das Medium bezeichnet hier das Ablehnen oder bewusste Abstandnehmen von einer ausführlichen Ausarbeitung; „verzichten“ ist klar und idiomatisch.
- source_word: τῷ τὴν μετάφρασιν ποιουμένῳ
  choice: dem …, der eine Kurzfassung erstellt
  rationale: Im Kontext der Vorrede geht es um die verdichtende Bearbeitung des umfangreicheren Werkes Jasons von Kyrene. Daher ist „Kurzfassung“ hier sachgerechter als die sonst mögliche Bedeutung „Übersetzung“.
- source_word: συγχωρητέον
  choice: sollte man … zugestehen
  rationale: Das Verbaladjektiv drückt aus, was billigerweise eingeräumt oder zugestanden werden soll; die unpersönliche deutsche Form bewahrt diesen Sinn.
theological_decisions:
- issue: Bedeutung von μετάφρασις im literarischen Kontext
  choice: Kurzfassung
  alternative: Übersetzung
  rationale: Obwohl μετάφρασις gewöhnlich auch eine Übersetzung bezeichnen kann, spricht der Kontext der Vorrede vom Kürzen eines größeren Geschichtswerks. Die kontextuell bevorzugte Bedeutung wird im Text verwendet, die echte lexikalische Alternative aber in der Fußnote erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die etwas komplexe Satzstruktur spiegelt den argumentativen Stil der griechischen Vorrede, bleibt aber für heutige Leser verständlich.
