base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/002/049.yaml
  text: and to recover the sanctuary renowned throughout the whole inhabited world[a], and to free the city, and to restore the laws that were about to be abolished, since the Lord was showing them mercy with all forbearance[b],
translation:
  language: de
  text: und das in der ganzen bewohnten Welt[a] berühmte Heiligtum zurückzugewinnen, die Stadt zu befreien und die Gesetze wiederherzustellen, deren Abschaffung bevorstand, weil der Herr sich ihrer mit aller Milde[b] erbarmte,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in der ganzen Welt“; griechisch wörtlich: „in der ganzen bewohnten Welt“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „mit aller Nachsicht“ beziehungsweise „mit großer Güte“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: περιβόητον
  choice: berühmt
  rationale: Das Adjektiv bezeichnet etwas, von dem weithin gesprochen wird. „Berühmt“ ist natürlich, verständlich und bewahrt den gehobenen Ton.
- source_word: καθʼ ὅλην τὴν οἰκουμένην
  choice: in der ganzen bewohnten Welt
  rationale: Die Wiedergabe erhält den wörtlichen Bezug auf die bewohnte beziehungsweise bekannte Welt und vermeidet eine unnötig moderne globale Präzisierung.
- source_word: ἱερόν
  choice: Heiligtum
  rationale: Gemeint ist der Jerusalemer Tempel in seinem Charakter als heiliger Ort; „Heiligtum“ gibt diese Bedeutung wieder, ohne den griechischen Ausdruck unnötig einzuengen.
- source_word: ἀνακομίσασθαι
  choice: zurückzugewinnen
  rationale: Der mediale Infinitiv bezeichnet hier das Wiedererlangen des Heiligtums. „Zurückzugewinnen“ drückt diesen Zusammenhang im Deutschen klar aus.
- source_word: ἐλευθερῶσαι
  choice: zu befreien
  rationale: Das Verb bezeichnet die Befreiung der Stadt und hat hier einen deutlichen politischen Sinn.
- source_word: τοὺς μέλλοντας καταλύεσθαι νόμους
  choice: die Gesetze, deren Abschaffung bevorstand
  rationale: Die Formulierung bewahrt sowohl das bevorstehende Geschehen als auch den passiven Sinn von καταλύεσθαι, ohne mit „sollten“ eine normative Bedeutung nahezulegen.
- source_word: ἐπανορθῶσαι
  choice: wiederherzustellen
  rationale: Das Verb bedeutet, etwas erneut aufzurichten oder in den rechten Zustand zu versetzen; bei Gesetzen ist „wiederherstellen“ idiomatisch.
- source_word: τοῦ κυρίου
  choice: der Herr
  rationale: Im Zusammenhang bezeichnet κύριος Gott, der seinem Volk Erbarmen erweist.
- source_word: μετὰ πάσης ἐπιεικείας
  choice: mit aller Milde
  rationale: ἐπιείκεια umfasst Milde, Nachsicht und Güte. „Milde“ passt zu Gottes erbarmendem Handeln und lässt die weiteren Nuancen offen.
- source_word: ἐλεημονοῦντος αὐτοῖς
  choice: sich ihrer erbarmte
  rationale: Die idiomatische deutsche Wendung gibt das barmherzige Handeln des Herrn gegenüber ihnen wieder.
theological_decisions:
- issue: Wiedergabe von κύριος
  choice: der Herr
  alternative: der Gebieter
  rationale: Der Kontext spricht von Gottes Erbarmen gegenüber dem Volk. „Herr“ ist deshalb die sachgemäße und traditionsübergreifend verständliche Wiedergabe.
- issue: Verhältnis von Gottes Erbarmen zu den vorausgehenden Erfolgen
  choice: weil der Herr sich ihrer … erbarmte
  alternative: während der Herr sich ihrer … erbarmte
  rationale: Der Genitivus absolutus kann begleitend oder begründend verstanden werden. „Weil“ macht den im Zusammenhang naheliegenden ursächlichen Bezug deutlich; die grammatische Spannung wird als mögliche Alternative dokumentiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Infinitivreihe und das abschließende Komma bleiben erhalten, da der Vers als syntaktisches Fragment an den vorausgehenden Zusammenhang anschließt. Unnötige Fach- und Konfessionssprache wurde vermieden.
