lexical_decisions:
- source_word: καταφύτευσον
  choice: Pflanze … ein
  rationale: Der Aoristimperativ von καταφυτεύω bezeichnet wörtlich das Einpflanzen. „Pflanze … ein“ bewahrt sowohl das Bild als auch die Aufforderungsform; „gründe“ oder „siedle an“ wären mögliche, aber weniger bildhafte Wiedergaben.
- source_word: τὸν λαόν σου
  choice: dein Volk
  rationale: λαός bezeichnet hier eine gemeinschaftlich verstandene Volksgruppe; „dein Volk“ ist im Deutschen natürlich und bewahrt den möglichen Bundesbezug, ohne ihn ausdrücklich einzutragen.
- source_word: εἰς τὸν τόπον τὸν ἅγιόν σου
  choice: an deinem heiligen Ort
  rationale: εἰς kann nach einem Verb des Einpflanzens die Zielrichtung bezeichnen. Idiomatisches Deutsch verlangt hier „an … Ort“; „Land“ würde τόπος unnötig spezifizieren.
- source_word: καθὼς εἶπεν
  choice: so wie … gesagt hat
  rationale: Die Formulierung gibt den Vergleich καθὼς und den Aorist von λέγω in natürlichem, modernem Deutsch wieder.
- source_word: Μωσῆς
  choice: Mose
  rationale: „Mose“ ist die etablierte deutsche Namensform.
theological_decisions:
- issue: Integrität des Quelltexts und erhebliche Abweichung vom erwarteten Kontext
  choice: Die vorgelegte griechische Klausel wird unmittelbar als eigenständige, gebetsartige Bitte übersetzt.
  alternative: Den erwarteten Wortlaut von 2. Makkabäer 2,20 anhand anderer Ausgaben oder des Zusammenhangs rekonstruieren.
  rationale: Der bereitgestellte griechische Text passt offenbar nicht zum üblichen Kontext von 2. Makkabäer 2,20. Gemäß dem Vorrang der vorgelegten originalsprachlichen Evidenz wird er dennoch übersetzt; die Abweichung wird transparent in einer Fußnote ausgewiesen, statt stillschweigend einen anderen Text einzusetzen.
