lexical_decisions:
- source_word: βάσανισον
  choice: Bestrafe
  rationale: Der Aoristimperativ bittet hier um strafendes Eingreifen. „Bestrafe“ gibt die richterliche Stoßrichtung natürlich wieder, ohne die Art des Leidens mit „quäle“ unnötig festzulegen.
- source_word: τοὺς καταδυναστεύοντας
  choice: alle, die andere unterdrücken
  rationale: Das substantivierte Partizip bezeichnet Menschen, die ihre Macht fortgesetzt bedrückend gegen andere einsetzen. Das ergänzte „andere“ macht das deutsche Objekt verständlich, ohne den Sinn einzuengen.
- source_word: καὶ ἐξυβρίζοντας
  choice: und sie schändlich behandeln
  rationale: Das Verb bezeichnet anmaßendes, beleidigendes oder misshandelndes Verhalten und kann über bloße Worte hinausgehen. „Schändlich behandeln“ bewahrt diese Breite in natürlichem Deutsch.
- source_word: ἐν ὑπερηφανίᾳ
  choice: in ihrem Hochmut
  rationale: Die Wendung beschreibt Haltung beziehungsweise Art des Handelns. „Hochmut“ wahrt das moralische Gewicht und klingt in einem würdevollen Gebet natürlich.
theological_decisions:
- issue: Integrität der Quelle und Verszuordnung
  choice: Nur die vorgelegte griechische Klausel als Gebetsbitte übersetzen.
  alternative: Aus anderen Überlieferungen oder dem vermuteten Zusammenhang einen vollständigeren Vers rekonstruieren.
  rationale: Die angegebene griechische Quelle besteht aus einer kurzen Imperativklausel und ist als erhebliche Abweichung gekennzeichnet. Daher wird kein fehlender Kontext ergänzt.
- issue: Reichweite von ἐξυβρίζοντας
  choice: Eine breite Wiedergabe wählen, die beleidigendes wie misshandelndes Verhalten einschließt.
  alternative: Das Verb auf verbales „Beleidigen“ oder auf körperliches „Misshandeln“ festlegen.
  rationale: Der griechische Ausdruck lässt die genaue Form des übermütigen Übergriffs offen; diese Spannung soll nicht stillschweigend aufgelöst werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung bleibt als knappe Gebetsbitte erhalten; „schändlich behandeln“ vermeidet sowohl eine Abschwächung auf bloße Beschimpfung als auch eine unbelegte Festlegung auf körperliche Gewalt.
