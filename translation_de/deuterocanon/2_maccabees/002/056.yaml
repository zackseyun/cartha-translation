base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/002/056.yaml
  text: For just as[a], in the case of a new house, the architect must take thought for the whole foundation, but the one undertaking to decorate and paint it must examine the things suitable for adornment, so also, I think, it is with us.
translation:
  language: de
  text: Denn wie bei einem neuen Haus der Architekt für die gesamte Grundlegung Sorge tragen muss, derjenige aber, der es auszustatten[a] und auszumalen unternimmt, prüfen muss, was sich zur Ausschmückung eignet, so verhält es sich, meine ich, auch bei uns.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „herzurichten“ beziehungsweise „auszuschmücken“. Das griechische Verb kann das Ausstatten oder Herrichten eines Hauses bezeichnen, nicht nur dessen Verzierung.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθάπερ
  choice: wie
  rationale: Leitet den Vergleich natürlich ein; das vorausgehende γάρ wird mit „Denn“ wiedergegeben.
- source_word: τῆς καινῆς οἰκίας
  choice: bei einem neuen Haus
  rationale: Bewahrt das konkrete Bild eines neu errichteten Hauses und gibt den griechischen Genitiv im Deutschen idiomatisch wieder.
- source_word: ἀρχιτέκτονι
  choice: der Architekt
  rationale: Bezeichnet den leitenden Planer und Baumeister und wahrt die fachliche Rolle im Vergleich.
- source_word: τῆς ὅλης καταβολῆς
  choice: für die gesamte Grundlegung
  rationale: καταβολή bezeichnet hier das Legen des Fundaments beziehungsweise die grundlegende Anlage; „Grundlegung“ hält den Vorgangscharakter und die mögliche Weite des Ausdrucks offen.
- source_word: φροντιστέον
  choice: Sorge tragen muss
  rationale: Gibt sowohl die notwendige Verpflichtung des Verbaladjektivs als auch den Sinn sorgfältiger Verantwortung wieder.
- source_word: ἐγκαινίζειν
  choice: auszustatten
  rationale: Im Zusammenhang mit Ausmalen und Ausschmückung geht es um das Herrichten beziehungsweise Ausstatten des Hauses, nicht um eine kultische Einweihung.
- source_word: ζωγραφεῖν
  choice: auszumalen
  rationale: Passt im Deutschen zum bildlichen Ausgestalten eines Hauses und ist hier konkreter als das allgemeinere „malen“.
- source_word: τὰ ἐπιτήδεια
  choice: was sich eignet
  rationale: Bewahrt die offene Bezeichnung des Geeigneten, ohne sie unnötig auf Materialien oder Gegenstände festzulegen.
- source_word: πρὸς διακόσμησιν
  choice: zur Ausschmückung
  rationale: Gibt die geordnete dekorative Ausgestaltung in natürlichem, würdigem Deutsch wieder.
- source_word: ἐξεταστέον
  choice: prüfen muss
  rationale: Bewahrt die Notwendigkeit und den Gedanken sorgfältiger Untersuchung.
- source_word: οὕτως δοκῶ καὶ ἐπὶ ἡμῶν
  choice: so verhält es sich, meine ich, auch bei uns
  rationale: Erhält die zurückhaltende Einschätzung des Verfassers und überträgt die Analogie idiomatisch auf seine eigene Aufgabe.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ausgedehnte Vergleichsstruktur des Griechischen bleibt erhalten, wird aber durch geläufige deutsche Wendungen klar gegliedert. Der Fachausdruck „Architekt“ und die zurückhaltende Einfügung „meine ich“ wurden bewahrt.
