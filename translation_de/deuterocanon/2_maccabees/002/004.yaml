  source_fidelity: 'Die Grundbedeutung wird gut getroffen: ἡγεμών bezeichnet einen Anführer, δύναμις die ihn begleitende Streitmacht, und κατεκόπησαν eine gewaltsame Tötung. Die deutsche Formulierung „mit seiner Streitmacht eingetroffen war“ lässt jedoch die koordinierte Subjektgruppe im folgenden Passiv weniger klar hervortreten. Außerdem ergänzt „sie ... getäuscht“ ein im Griechischen nicht ausgedrücktes Objekt zu παραλογισμῷ χρησαμένων. Die Revision gibt die List als Handlungsmittel wieder, ohne dieses Objekt festzulegen.'
  naturalness: Die Syntax ist grundsätzlich flüssig und dem Register angemessen. „Der Anführer und die ihn begleitende Streitmacht ... eingetroffen waren“ ist im Deutschen klarer als die singularische Konstruktion mit „mit seiner Streitmacht“. Die revidierte Wiedergabe des Genitivus absolutus bleibt natürlich und präziser.
  terminology: „Anführer“, „Streitmacht“, „Tempel“ und die Transkription „Nanaia“ sind passend. „Unüberwindlich“ ist als kontextuelle Deutung der schwierigen Wendung vertretbar, sofern die Fußnote die Unsicherheit dokumentiert. „Priester im Dienst der Nanaia“ gibt die Zuordnung durch οἱ περὶ τὴν Ναναίαν ἱερεῖς angemessen wieder.
