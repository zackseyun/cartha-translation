base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/002/004.yaml
  text: For when the leader and the force around him[a], which seemed invincible, had arrived, they were cut down in the temple of Nanaia, because the priests attending Nanaia had used deceit.
translation:
  language: de
  text: Denn als der Anführer und die ihn begleitende Streitmacht, die unüberwindlich zu sein schien[a], eingetroffen waren, wurden sie im Tempel der Nanaia niedergemacht, weil die Priester im Dienst der Nanaia eine List angewandt hatten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der niemand standhalten zu können schien“. Die griechische Wendung ist ungewöhnlich und kann auch im Sinn von „unwiderstehlich“ verstanden werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γενόμενος
  choice: eingetroffen war
  rationale: Im Erzählzusammenhang bezeichnet das Partizip am ehesten das Eintreffen des Anführers; „geworden war“ wäre hier sachlich unpassend.
- source_word: ἡγεμών
  choice: Anführer
  rationale: Die allgemeine Bezeichnung wahrt den Sinn einer leitenden Person, ohne ein bestimmtes ziviles oder militärisches Amt vorauszusetzen.
- source_word: ἡ περὶ αὐτὸν ... δύναμις
  choice: mit seiner Streitmacht
  rationale: δύναμις bezeichnet im militärischen Zusammenhang eine Truppe; περὶ αὐτόν meint die ihn begleitenden Kräfte. Die deutsche Fügung verbindet sie natürlich mit dem Anführer.
- source_word: ἀνυπόστατος δοκοῦσα εἶναι
  choice: die unüberwindlich zu sein schien
  rationale: Im militärischen Kontext bezeichnet die schwierige Wendung wahrscheinlich eine Streitmacht, der niemand standhalten zu können schien. Die Übersetzung bewahrt durch „schien“ die Wahrnehmungsperspektive.
- source_word: κατεκόπησαν
  choice: wurden sie ... niedergemacht
  rationale: Das Passiv beschreibt eine gewaltsame Tötung. „Niedergemacht“ ist anschaulich, verständlich und weniger wörtlich-mechanisch als „niedergehauen“.
- source_word: ἐν τῷ τῆς Ναναίας ἱερῷ
  choice: im Tempel der Nanaia
  rationale: ἱερόν kann Tempel oder Heiligtum bedeuten; „Tempel“ ist hier eine klare und natürliche Wiedergabe.
- source_word: παραλογισμῷ χρησαμένων
  choice: weil ... sie durch eine List getäuscht hatten
  rationale: Der Genitivus absolutus nennt den erklärenden Umstand beziehungsweise das Mittel. παραλογισμός bezeichnet Täuschung oder einen listigen Kunstgriff; die Formulierung macht den Handlungszusammenhang im Deutschen deutlich.
- source_word: τῶν περὶ τὴν Ναναίαν ἱερέων
  choice: die Priester im Dienst der Nanaia
  rationale: περὶ mit Akkusativ bezeichnet hier die Nanaia zugeordneten Priester. „Im Dienst der Nanaia“ gibt diese Zugehörigkeit verständlich wieder, ohne ein missverständliches Besitzverhältnis zu betonen.
theological_decisions:
- issue: Wiedergabe des Namens Ναναία
  choice: Nanaia
  alternative: Nanea; Nanaya
  rationale: Der Eigenname der Göttin wird transliteriert und nicht übersetzt. „Nanaia“ bildet die griechische Namensform eng und im Deutschen lesbar ab.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die verschachtelte griechische Satzstruktur wurde behutsam geglättet. Das Relativpronomen „die“ bezieht sich eindeutig auf die Streitmacht; das anschließende „sie“ umfasst dagegen den Anführer und seine Truppe.
