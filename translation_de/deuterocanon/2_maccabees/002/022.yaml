review_pass:
  verdict: revise
  source_fidelity: 'Der deutsche Satz gibt den überlieferten griechischen Wortlaut im Wesentlichen zutreffend wieder: ἀνηλώθη ist mit „aufgebraucht war“ angemessen offen wiedergegeben; τὰ τῆς θυσίας wird ohne unzulässige Konkretisierung entfaltet; μείζονας bleibt ein Komparativ ohne bestimmten Artikel. Das hinzugefügte „auch“ hat jedoch im Deutschen eine stärker additive Bedeutung, die das bloß satzverbindende καί nicht verlangt.'
  naturalness: „Als aber das zum Opfer Gehörende aufgebraucht war“ ist modernes, verständliches Standarddeutsch mit einem passenden erzählerischen Register. „Das übrig gebliebene Wasser über größere Steine zu gießen“ ist idiomatisch und klar.
  terminology: „Nehemia“ entspricht dem üblichen modernen deutschen Bibelgebrauch. Die neutrale Umschreibung „das zum Opfer Gehörende“ bewahrt die Ellipse des griechischen τὰ τῆς θυσίας besser als eine Festlegung auf bestimmte Opfermaterialien.
  issues:
  - severity: medium
    issue: Unbegründigte additive Nuance durch „auch“
    rationale: Das καί verbindet hier die Handlung Nehemias mit dem vorausgehenden Nebensatz. Ein deutsches „auch“ kann nahelegen, das Wasser sei zusätzlich zu anderen ausdrücklich genannten Gegenständen ausgegossen worden, was der Text nicht sagt.
  - severity: high
    issue: Fußnote b enthält eine sachlich unzutreffende bzw. nicht zum Wortlaut passende Referenzbehauptung
    rationale: Der vorgelegte griechische Wortlaut gehört nach der gebräuchlichen Verszählung zu 2. Makkabäer 1,22, nicht zu 2. Makkabäer 1,31. Zudem ist eine Editions-/Metadatenabweichung keine Textvariante und sollte nicht als Übersetzungsfußnote erscheinen. Die Kennzeichnung des Auftrags als 2 Makkabäer 2,22 steht daher im Widerspruch zum Wortlaut und erfordert eine redaktionelle Prüfung.
  revised_text: Als aber das zum Opfer Gehörende[a] aufgebraucht war, befahl Nehemia, das übrig gebliebene Wasser über größere Steine zu gießen.
  revised_footnotes:
  - marker: a
    text: 'Wörtlich: „das des Opfers“ beziehungsweise „die Dinge des Opfers“. Die griechische Wendung ist elliptisch und bezeichnet allgemein das, was zum Opfer gehörte.'
    reason: lexical_alternative
  revision_rationale: „Auch“ wurde entfernt, damit die Übersetzung keine zusätzliche, im griechischen Satz nicht ausdrücklich markierte Hinzufügung erzeugt. Die fehlerhafte Fußnote b wurde entfernt. Der übermittelte griechische Wortlaut ist nach der üblichen Zählung 2. Makkabäer 1,22 zuzuordnen; diese Abweichung vom gelieferten Identifikator 2MA.2.22 muss in den Metadaten bzw. der Quellreferenz korrigiert werden, nicht durch eine irreführende Übersetzungsfußnote.
