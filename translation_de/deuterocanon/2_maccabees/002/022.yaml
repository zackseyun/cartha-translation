translation_notes:
  register: Moderne, gut verständliche Standardsprache mit würdigem Erzählton. Die elliptische Ausdrucksweise des Griechischen wird verständlich entfaltet, ohne den Gegenstand näher zu bestimmen, als es der Ausgangstext erlaubt. Die ungewöhnliche Quellen-/Referenzabweichung wird transparent in einer Fußnote vermerkt.
