  yaml_path: translation/deuterocanon/2_maccabees/002/022.yaml
  text: And when the things for the sacrifice had been consumed[b][a], Nehemiah ordered them to pour the remaining water on the larger stones.
translation:
  language: de
  text: Als nun alles, was zum Opfer gehörte,[a] aufgebraucht war, befahl Nehemia, auch das übrig gebliebene Wasser über größere Steine zu gießen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „das des Opfers“ beziehungsweise „die Dinge des Opfers“. Die griechische Wendung ist elliptisch und bezeichnet allgemein das, was zum Opfer gehörte.'
    reason: lexical_alternative
  - marker: b
    text: Der angegebene griechische Wortlaut entspricht in der üblichen Verszählung 2. Makkabäer 1,31, nicht 2,22.
    reason: textual_variant
lexical_decisions:
- source_word: ἀνηλώθη
  choice: aufgebraucht war
  rationale: Das passive Verb bezeichnet hier, dass das zum Opfer Gehörende verbraucht bzw. verzehrt worden war. „Aufgebraucht“ lässt offen, auf welche Weise dies geschah, und gibt die griechische Form natürlich wieder.
- source_word: τὰ τῆς θυσίας
  choice: alles, was zum Opfer gehörte
  rationale: Die substantivierte neutrale Wendung mit Genitiv ist elliptisch („die Dinge des Opfers“). Die gewählte Form bleibt inhaltlich weit und ist im Deutschen verständlich, ohne den Referenten voreilig auf bestimmte Opfermaterialien einzugrenzen.
- source_word: τὸ περιλειπόμενον ὕδωρ
  choice: das übrig gebliebene Wasser
  rationale: Die partizipiale Wendung wird direkt und idiomatisch wiedergegeben.
- source_word: ὁ Νεεμίας
  choice: Nehemia
  rationale: Verwendet wird die im modernen deutschen Bibelgebrauch übliche Namensform.
- source_word: ἐκέλευσεν
  choice: befahl
  rationale: Das Verb bezeichnet eine verbindliche Anweisung; der deutsche Infinitivsatz gibt die griechische Konstruktion knapp und natürlich wieder.
- source_word: λίθους μείζονας
  choice: größere Steine
  rationale: μείζονας ist ein Komparativ, und im griechischen Text steht kein Artikel. Daher wird weder zu „große“ abgeschwächt noch ein bestimmter Artikel ergänzt.
- source_word: καταχεῖν
  choice: über … zu gießen
  rationale: Das Kompositum bezeichnet das Ausgießen auf oder über etwas; diese Formulierung passt idiomatisch zum Wasser und zu den Steinen.
- source_word: καί
  choice: auch
  rationale: Das καί vor „das übrig gebliebene Wasser“ wird als Hinzufügung zum vorherigen Geschehen verstanden. „Auch“ bewahrt diesen Anschluss, ohne die Satzfolge stark zu glätten.
