  yaml_path: translation/deuterocanon/2_maccabees/002/033.yaml
  text: And some of those who had followed came near to mark the way[a], but they were not able to find it.
translation:
  language: de
  text: Einige derer, die ihm gefolgt waren, kamen herbei, um den Weg zu kennzeichnen[a]; sie konnten ihn jedoch nicht finden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Straße zu markieren“ beziehungsweise „die Route zu kennzeichnen“. Das griechische Wort ὁδός kann je nach Zusammenhang einen Weg, eine Straße oder eine Route bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθόντες
  choice: kamen näher
  rationale: Das Aoristpartizip von προσέρχομαι bezeichnet eine Annäherung. „Kamen näher“ wahrt diese Richtungsbedeutung, ohne ein im Griechischen nicht ausdrücklich genanntes Ziel hinzuzufügen.
- source_word: τινὲς τῶν συνακολουθούντων
  choice: Einige von denen, die ihm gefolgt waren
  rationale: Die partitive Konstruktion τινὲς τῶν wird direkt wiedergegeben. Das Präfix συν- bezeichnet das Mitfolgen; „ihm“ stellt im Deutschen den aus dem Zusammenhang erschließbaren Bezug her, ohne die Gruppe als „Gefährten“ zu interpretieren.
- source_word: ὥστε ἐπισημήνασθαι τὴν ὁδόν
  choice: um den Weg zu kennzeichnen
  rationale: ὥστε mit Infinitiv bezeichnet hier die beabsichtigte Folge beziehungsweise den Zweck. ἐπισημαίνομαι meint das kenntliche Markieren; „kennzeichnen“ ist in diesem Zusammenhang natürlich und präzise.
- source_word: οὐκ ἠδυνήθησαν
  choice: doch sie konnten ... nicht
  rationale: Die finite Wendung gibt die ausgesagte Unfähigkeit idiomatisch und vollständig wieder; „doch“ bildet den Gegensatz zwischen Absicht und Scheitern ab.
- source_word: εὑρεῖν
  choice: ihn ... finden
  rationale: Der Infinitiv hängt von ἠδυνήθησαν ab. Das Pronomen „ihn“ nimmt grammatisch den zuvor genannten „Weg“ auf; der griechische Text lässt das Objekt unausgesprochen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau bleibt nah am Griechischen, wird jedoch durch „doch“ und die idiomatische Modalverbkonstruktion flüssig gestaltet. Die Fußnote bewahrt die Bedeutungsbreite von ὁδός.
