lexical_decisions:
- source_word: περιφράξας
  choice: nachdem … eingefriedet hatte
  rationale: Das Aoristpartizip bezeichnet ein Umschließen oder Umzäunen, wohl zum Schutz. „Einfrieden“ wahrt den konkreten räumlichen Sinn, ohne eine Mauer oder Befestigung vorauszusetzen.
- source_word: ἱερὸν
  choice: zu einem Heiligtum
  rationale: Das artikellose ἱερόν kann einen Tempel, einen heiligen Ort oder einen sakralen Bezirk bezeichnen. „Heiligtum“ bewahrt diese Bedeutungsbreite.
- source_word: ἐποίησεν
  choice: machte … zu
  rationale: ποιέω ist hier bewusst direkt wiedergegeben und lässt offen, ob der König den Ort baulich gestaltete, dazu bestimmte oder als Heiligtum einrichtete.
- source_word: δοκιμάσας
  choice: nachdem … geprüft hatte
  rationale: δοκιμάζω bedeutet prüfen, erproben oder nach einer Prüfung für bewährt befinden. „Prüfen“ erhält den Vorgang, ohne ein positives Ergebnis ausdrücklich hinzuzufügen.
- source_word: τὸ πρᾶγμα
  choice: die Sache
  rationale: πρᾶγμα ist allgemein und kann eine Sache, Angelegenheit oder einen Sachverhalt bezeichnen. „Die Sache“ erhält diese Offenheit in natürlichem Deutsch.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Den Ort“ nimmt das im Griechischen nur implizite Objekt von περιφράξας und ἐποίησεν auf, um im Deutschen einen vollständigen, verständlichen Satz zu bilden; wegen des fehlenden Kontexts bleibt der Bezug bewusst allgemein. Die Wiederholung „nachdem“ bildet die beiden Aoristpartizipien formal ab, auch wenn das Ergebnis leicht schwerfällig klingt.
