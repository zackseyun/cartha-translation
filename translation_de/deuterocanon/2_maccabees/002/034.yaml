  yaml_path: translation/deuterocanon/2_maccabees/002/034.yaml
  text: But when Jeremiah learned of it[a], he reproved them and said, “The place will remain unknown until God gathers his people together and shows mercy.”
translation:
  language: de
  text: 'Als aber Jeremia davon erfuhr, wies er sie zurecht und sagte: „Der Ort wird unbekannt bleiben, bis Gott das Volk wieder zusammenführt und sich Erbarmen erweist.“[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Griechisch wörtlicher: „bis Gott eine Versammlung des Volkes versammelt und Erbarmen entsteht.“ Die Übersetzung gibt die ungewöhnliche Sammelformulierung idiomatisch wieder; der letzte Teilsatz bleibt gegenüber der Frage offen, wer das Erbarmen erweist.'
    reason: Die Fußnote dokumentiert sowohl die auffällige Verbindung von συνάγῃ und ἐπισυναγωγή als auch die unpersönlichere griechische Gestalt von ἔλεος γένηται.
lexical_decisions:
- source_word: ὡς δὲ
  choice: Als
  rationale: Die Verbindung leitet einen zeitlichen Übergang ein. Im Deutschen gibt „Als“ die Erzählfolge natürlich wieder; ein zusätzliches „aber“ ist hier nicht erforderlich.
- source_word: ἔγνων
  choice: davon erfuhr
  rationale: Im Zusammenhang geht es darum, dass Jeremia von dem zuvor geschilderten Tun Kenntnis erhält. „Davon erfuhr“ drückt diesen Eintritt des Wissens idiomatisch aus. Die überlieferte Form ἔγνων ist formal die 1. Person Singular, während ὁ Ἰερεμίας als Subjekt die 3. Person erwarten lässt; die Übersetzung folgt dem aus Satzbau und Kontext klar erkennbaren Sinn.
- source_word: μεμψάμενος αὐτοῖς
  choice: wies er sie zurecht
  rationale: Das Partizip bezeichnet tadelnde Missbilligung. „Wies er sie zurecht“ ist gegenwärtiges, würdevolles Deutsch und bewahrt die negative Wertung, ohne unnötig scharf zu klingen.
- source_word: ἄγνωστος ὁ τόπος ἔσται
  choice: Der Ort wird unbekannt bleiben
  rationale: ἄγνωστος bedeutet „unbekannt“. Das deutsche „bleiben“ gibt im Zusammenhang den bis zu einem künftigen Zeitpunkt fortdauernden Zustand natürlich wieder.
- source_word: ἕως ἂν συνάγῃ ὁ θεὸς ἐπισυναγωγὴν τοῦ λαοῦ
  choice: bis Gott das Volk wieder zusammenführt
  rationale: Die Verbindung von συνάγῃ mit ἐπισυναγωγή ist im Griechischen eine nachdrückliche beziehungsweise pleonastische Sammelformulierung. „wieder zusammenführt“ gibt den Gedanken einer erneuten Sammlung flüssig wieder, ohne das im Griechischen nicht ausdrücklich stehende Possessivpronomen „sein“ einzufügen.
- source_word: ἔλεος γένηται
  choice: und Erbarmen geschieht
  rationale: 'Wörtlich ist ἔλεος das Subjekt von γένηται: Erbarmen entsteht beziehungsweise geschieht. Die bewusst ungewohnte, aber verständliche Formulierung bewahrt diese grammatische Gestalt und legt die göttliche Wirksamkeit nicht stärker fest, als der griechische Wortlaut es tut.'
theological_decisions:
- issue: Göttliches Handeln im letzten Teilsatz
  choice: „und Erbarmen geschieht“
  alternative: „und Gott Erbarmen zeigt“
  rationale: Obwohl Gott im vorangehenden Teilsatz Subjekt ist, hat der griechische Schlusssatz ἔλεος als grammatisches Subjekt. Die Übersetzung bewahrt diese offene Form und macht Gott nicht ausdrücklich zum Subjekt einer Handlung, die der Ausgangstext unpersönlicher formuliert.
- issue: Beziehung des Volkes zu Gott
  choice: „das Volk“
  alternative: „sein Volk“
  rationale: Der griechische Text hat den bestimmten Ausdruck τοῦ λαοῦ, nicht ein Possessivpronomen. Der Zusammenhang kann Gottes Volk meinen, doch die Übersetzung fügt diese Beziehung nicht ausdrücklich hinzu.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Erzählung ist flüssig formuliert; die ungewöhnliche Wendung „Erbarmen geschieht“ bleibt bewusst stehen, um die grammatische und theologische Offenheit des griechischen Schlusssatzes zu erhalten.
