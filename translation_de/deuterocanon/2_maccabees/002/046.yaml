  text: The matters concerning Judas Maccabeus and his brothers[a], and the purification of the greatest sanctuary, and the dedication of the altar,
translation:
  language: de
  text: Die Ereignisse um Judas Makkabäus und seine Brüder, die Reinigung des größten Heiligtums und die Einweihung[a] des Altars,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wiedereinweihung“. Im Griechischen steht „Einweihung“; der geschichtliche Zusammenhang betrifft jedoch die Wiederherstellung des Altars nach seiner Entweihung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τὰ δὲ κατὰ τὸν Ἰούδαν
  choice: Die Ereignisse um Judas
  rationale: Die substantivierte Wendung mit κατά bezeichnet allgemein das, was Judas betrifft. „Die Ereignisse um“ ist im Deutschen natürlich und legt den Inhalt nicht ausschließlich auf Taten oder eine Geschichtsdarstellung fest; δέ muss in dieser fortlaufenden Aufzählung nicht eigens mit „nun“ wiedergegeben werden.
- source_word: Ἰούδαν τὸν Μακκαβαῖον
  choice: Judas Makkabäus
  rationale: Übliche deutsche Namensform für Judas und seinen Beinamen.
- source_word: τοὺς τούτου ἀδελφούς
  choice: seine Brüder
  rationale: Gemeint sind hier die leiblichen Brüder des Judas; die konkrete deutsche Bezeichnung ist daher sachgerecht.
- source_word: τοῦ ἱεροῦ τοῦ μεγίστου
  choice: des größten Heiligtums
  rationale: ἱερόν bezeichnet hier den Jerusalemer Tempel beziehungsweise Tempelbezirk; „Heiligtum“ wahrt die kultische Bedeutung. Der Superlativ μεγίστου wird ohne interpretierende Umformung als „größten“ wiedergegeben.
- source_word: καθαρισμόν
  choice: Reinigung
  rationale: Das Wort bezeichnet in diesem Zusammenhang die kultische Reinigung des entweihten Heiligtums.
- source_word: βωμοῦ
  choice: Altars
  rationale: „Altar“ ist im Opferkontext die direkte und geläufige Entsprechung zu βωμός.
- source_word: ἐγκαινισμόν
  choice: Einweihung
  rationale: Das Substantiv bezeichnet Einweihung beziehungsweise Inbetriebnahme. Da im griechischen Wort nicht ausdrücklich „wieder“ steht, bleibt „Einweihung“ im Haupttext; die historisch naheliegende Wiedereinweihung wird in der Fußnote genannt.
theological_decisions:
- issue: Wiedergabe von ἱερόν im jüdischen Kultkontext
  choice: Heiligtum
  alternative: Tempel
  rationale: „Heiligtum“ gibt den kultischen Bezug präzise wieder und lässt offen, ob der gesamte Tempelkomplex oder der heilige Bereich im Vordergrund steht. „Tempel“ wäre im historischen Zusammenhang ebenfalls möglich, konkretisiert aber stärker.
- issue: Einweihung oder Wiedereinweihung des Altars
  choice: Einweihung
  alternative: Wiedereinweihung
  rationale: Der griechische Ausdruck sagt lexikalisch nur „Einweihung“. Der geschichtliche Zusammenhang nach der Entweihung legt eine erneute Einweihung nahe, doch diese Deutung wird nicht stillschweigend in den Haupttext aufgenommen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die nominale Aufzählung und das abschließende Komma bleiben erhalten, weil der griechische Satz im folgenden Vers weitergeführt wird. Der Fußnotenmarker steht unmittelbar bei „Einweihung“, auf die sich die Anmerkung bezieht.
