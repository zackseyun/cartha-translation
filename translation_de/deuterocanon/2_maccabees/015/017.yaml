base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/015/017.yaml
  text: And having been encouraged by the very noble words of Judas[a], which were able to stir them on to virtue and to make the souls of young men manly, they resolved not merely to make a campaign, but to press on bravely and, engaging with all courage, settle the matter[d][c][b], because the city and the holy things and the temple were also in danger.
translation:
  language: de
  text: Durch die überaus edlen Worte des Judas ermutigt, die sie zur Tugend[a] anspornen und den jungen Männern mannhaften Mut einflößen konnten[b], beschlossen sie, nicht nur in den Kampf zu ziehen[c], sondern mutig vorzudringen und mit aller Tapferkeit den Kampf aufzunehmen, um die Sache zu entscheiden; denn auch die Stadt, die heiligen Dinge und der Tempel waren in Gefahr[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort kann auch „Vortrefflichkeit“ oder im militärischen Zusammenhang „Tapferkeit“ bedeuten.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „die Seelen junger Männer männlich machen“. Das Griechische verwendet ausdrücklich männliche Bildsprache für Mut.'
    reason: lexical_alternative
  - marker: c
    text: Gemeint ist nicht, dass sie beschlossen, keinen Krieg zu führen. Sie wollten vielmehr nicht bloß ins Feld ziehen, sondern den Kampf entschlossen zu einer Entscheidung bringen.
    reason: alternative_reading
  - marker: d
    text: Der griechische Text unterscheidet „die heiligen Dinge“ vom „Tempel“; deshalb werden beide eigens genannt.
    reason: lexical_alternative
lexical_decisions:
- source_word: Παρακληθέντες
  choice: ermutigt
  rationale: Das passive Partizip kann Ermutigung, Ermahnung oder Zuspruch bezeichnen. Im militärischen Zusammenhang steht die stärkende und zugleich anspornende Wirkung der Rede im Vordergrund.
- source_word: πάνυ καλοῖς
  choice: überaus edlen
  rationale: καλός bewertet die Worte hier in einem erhöhten ethisch-rhetorischen Sinn; „edel“ ist im Deutschen natürlicher und gehaltvoller als bloß „gut“ oder „schön“.
- source_word: δυναμένοις ἐπ' ἀρετὴν παρορμῆσαι
  choice: die sie zu sittlicher Größe anspornen konnten
  rationale: ἀρετή umfasst Tugend, Tüchtigkeit, Vortrefflichkeit und im Krieg auch Tapferkeit. „Sittliche Größe“ hält den ethischen Sinn offen, während der militärische Kontext die Tapferkeitsnuance mitträgt.
- source_word: ψυχὰς νέων ἐπανδρῶσαι
  choice: den jungen Männern mannhaften Mut einflößen
  rationale: Die Formulierung bewahrt das ausdrücklich männliche Bild von ἐπανδρόω, klingt aber im modernen Deutschen natürlicher als eine wörtliche Rede von „Seelen männlich machen“.
- source_word: διέγνωσαν μὴ στρατεύεσθαι
  choice: beschlossen sie, nicht nur in den Kampf zu ziehen
  rationale: Eine rein verneinende Wiedergabe würde dem folgenden Entschluss zum entschlossenen Kampf widersprechen. μὴ bezeichnet im Kontrast sinngemäß „nicht nur“ beziehungsweise „nicht bloß“.
- source_word: γενναίως δὲ ἐφέρεσθαι
  choice: sondern mutig vorzudringen
  rationale: Die Wendung beschreibt entschlossenes, tapferes Vorwärtsdrängen und nicht nur eine innere Haltung.
- source_word: μετὰ πάσης εὐανδρείας ἐμπλακέντες
  choice: sich mit aller Tapferkeit in den Kampf zu stürzen
  rationale: Im militärischen Kontext bezeichnet ἐμπλακέντες das Eintreten in den Kampf; εὐανδρεία meint mannhaften Mut beziehungsweise Tapferkeit.
- source_word: κρῖναι τὰ πράγματα
  choice: um die Sache zu entscheiden
  rationale: Die idiomatische Wendung zielt auf eine endgültige Entscheidung der Lage durch den bevorstehenden Kampf.
- source_word: τὴν πόλιν καὶ τὰ ἅγια καὶ τὸ ἱερὸν
  choice: die Stadt, die heiligen Dinge und der Tempel
  rationale: Der griechische Text unterscheidet ausdrücklich τὰ ἅγια von τὸ ἱερόν; daher werden beide Größen getrennt wiedergegeben.
- source_word: κινδυνεύειν
  choice: waren in Gefahr
  rationale: 'Die Infinitivkonstruktion nennt den Grund für ihren Entschluss: Stadt, Heiligtümer und Tempel waren bedroht.'
theological_decisions:
- issue: Männlich geprägte Sprache in ψυχὰς νέων ἐπανδρῶσαι und εὐανδρείας
  choice: Die männliche Bildsprache wird mit „jungen Männern“ und „mannhaften Mut“ sichtbar erhalten.
  alternative: „die jungen Leute ermutigen“ oder „ihnen Mut machen“
  rationale: Der Ausgangstext verwendet bewusst männlich codierte Sprache für kriegerischen Mut. Eine vollständige Neutralisierung würde dieses rhetorische Merkmal beseitigen; zugleich wird die Wendung für modernes Deutsch idiomatisch gestaltet.
- issue: Bedeutung von μὴ στρατεύεσθαι im syntaktischen Gegensatz
  choice: „nicht nur in den Kampf zu ziehen“
  alternative: „nicht in den Kampf zu ziehen“
  rationale: Die unmittelbar folgenden Infinitive beschreiben gerade ihr mutiges Eingreifen. Die Negation ist daher im Sinne von „nicht bloß“ zu verstehen, ohne den Text so wiederzugeben, als hätten sie den Kampf verweigert.
- issue: Unterscheidung zwischen τὰ ἅγια und τὸ ἱερόν
  choice: „die heiligen Dinge und der Tempel“
  alternative: Beide Ausdrücke zu „das Heiligtum“ zusammenziehen
  rationale: Die getrennten griechischen Begriffe können verschiedene gefährdete sakrale Größen bezeichnen. Ihre Spannung und mögliche Bedeutungsbreite sollen nicht eingeebnet werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer militärischer Dynamik. Die Periodenstruktur des Griechischen wurde lesbar gegliedert, ohne die Folge von Ermutigung, Entschluss, Kampf und Begründung aufzulösen. Ungewöhnliche oder mehrdeutige Formulierungen werden durch Fußnoten transparent gemacht.
