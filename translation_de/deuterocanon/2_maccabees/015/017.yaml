  to: Durch die überaus edlen Worte des Judas ermutigt, die sie zur Tugend[a] anspornen und den jungen Männern mannhaften Mut einflößen konnten[b], beschlossen sie, nicht nur in den Kampf zu ziehen[c], sondern mutig vorzudringen und mit aller Tapferkeit den Kampf aufzunehmen, um die Sache zu entscheiden; denn auch die Stadt, die heiligen Dinge und der Tempel waren in Gefahr[d].
