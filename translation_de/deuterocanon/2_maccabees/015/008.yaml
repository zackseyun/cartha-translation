base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/015/008.yaml
  text: And he urged those with him not to fear the attack of the nations, but to keep in mind the help that had previously come to them from heaven, and now to expect the victory that would come to them from the Almighty.
translation:
  language: de
  text: Und er ermutigte die bei ihm waren, sich vor dem Angriff der Völker[a] nicht zu fürchten, sondern sich die Hilfe vor Augen zu halten, die sie zuvor vom Himmel erfahren hatten, und nun den Sieg zu erwarten, der ihnen vom Allmächtigen kommen würde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Heiden.'
    reason: ἔθνη kann in diesem Kontext sowohl die fremden Völker als auch Nichtjuden im religiösen Sinn bezeichnen.
lexical_decisions:
- source_word: παρεκάλει
  choice: ermutigte
  rationale: Das Imperfekt bezeichnet ein fortgesetztes Zusprechen. „Ermutigte“ gibt die nachdrückliche Aufforderung in natürlichem, gegenwärtigem Deutsch wieder.
- source_word: τοὺς σὺν αὐτῷ
  choice: die Männer bei ihm
  rationale: Gemeint sind im militärischen Zusammenhang die Männer, die Judas begleiteten. Die Wiedergabe bleibt nah am Griechischen und ist eindeutiger als das allgemeinere „die bei ihm waren“.
- source_word: μὴ δειλιᾷν
  choice: sich … nicht zu fürchten
  rationale: Das Verb bezeichnet furchtsames Zurückschrecken oder Mutlosigkeit. Die gewählte Formulierung ist idiomatisch und wahrt den auffordernden Ton.
- source_word: τὴν τῶν ἐθνῶν ἔφοδον
  choice: den Angriff der Völker
  rationale: ἔφοδος bezeichnet hier einen feindlichen Vorstoß oder Angriff. „Völker“ wahrt die Grundbedeutung von ἔθνη, ohne vorschnell eine ausschließlich religiöse Kategorie festzulegen.
- source_word: ἔχοντας δὲ κατὰ νοῦν
  choice: sondern sich … vor Augen zu halten
  rationale: Die Wendung bezeichnet bewusstes Gegenwärtighalten. „Sich vor Augen halten“ ist im Deutschen natürlich und bewahrt den gedanklichen Akzent.
- source_word: τὰ προγεγονότα αὐτοῖς ἀπʼ οὐρανοῦ βοηθήματα
  choice: die Hilfe, die sie zuvor vom Himmel erfahren hatten
  rationale: Das griechische Neutrum Plural verweist auf frühere Hilfeleistungen. Der deutsche Kollektivbegriff „Hilfe“ vermeidet das unnatürliche „Hilfen“, während „zuvor“ und das Plusquamperfekt den vorausliegenden Charakter ausdrücken.
- source_word: τὰ νῦν προσδοκᾷν
  choice: und nun … zu erwarten
  rationale: προσδοκάω bezeichnet erwartungsvolles Entgegensehen. „Erwarten“ fügt sich natürlich in die fortgesetzte Aufforderung ein.
- source_word: τὴν παρὰ τοῦ παντοκράτορος ἐσομένην αὐτοῖς νίκην
  choice: den Sieg, der ihnen vom Allmächtigen kommen würde
  rationale: Die Formulierung bewahrt sowohl den zukünftigen Charakter von ἐσομένην als auch den durch παρά bezeichneten Ursprung des Sieges bei Gott.
theological_decisions:
- issue: Wiedergabe des Gottestitels παντοκράτωρ
  choice: der Allmächtige
  alternative: der Herrscher über alles
  rationale: „Der Allmächtige“ ist die etablierte, natürliche deutsche Wiedergabe des griechischen Gottestitels und erhält dessen theologisches Gewicht, ohne eine über den Text hinausgehende philosophische Präzisierung einzutragen.
- issue: Bedeutung von ἔθνη im jüdisch-hellenistischen Kontext
  choice: Völker
  alternative: Heiden
  rationale: Der Ausdruck kann die fremden, nichtjüdischen Völker bezeichnen. „Völker“ hält die ethnisch-politische und die mögliche religiöse Bedeutung offen; die traditionelle Alternative wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzführung. Der militärische Zusammenhang bleibt erkennbar; zugleich werden die himmlische Hilfe und der göttliche Ursprung des erwarteten Sieges ohne konfessionelle Zusätze wiedergegeben.
