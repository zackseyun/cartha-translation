  text: And for those shut up in the city, the anxiety also was no small matter, as they were troubled about the attack in the open country.
translation:
  language: de
  text: Auch für die in der Stadt Eingeschlossenen war die Angst keineswegs gering, denn sie waren wegen des Angriffs im offenen Gelände[a] beunruhigt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „des Angriffs auf freiem Feld“. Der griechische Ausdruck stellt die Eingeschlossenen in der Stadt dem Kampf draußen gegenüber.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατειλημμένοις
  choice: die ... Eingeschlossenen
  rationale: Das Perfekt Passiv bezeichnet Menschen, die durch die Umstände in der Stadt festgehalten beziehungsweise eingeschlossen sind. „Eingeschlossenen“ bewahrt den passiven Sinn und passt zur bedrängten Lage.
- source_word: οὐ πάρεργος ἀγωνία
  choice: litten unter großer Angst
  rationale: οὐ πάρεργος bedeutet wörtlich etwa „nicht nebensächlich“ und hebt die Ernsthaftigkeit der ἀγωνία hervor. Die positive deutsche Formulierung gibt den idiomatischen Sinn natürlich wieder.
- source_word: ταρασσομένοις
  choice: versetzte sie in Unruhe
  rationale: Das Partizip beschreibt ihre innere Erschütterung und erklärt die große Angst. Die Formulierung ist im Deutschen klar und wahrt den emotionalen Gehalt.
- source_word: τῆς ἐν ὑπαίθρῳ προσβολῆς
  choice: der Angriff draußen im offenen Gelände
  rationale: προσβολή bezeichnet hier einen militärischen Angriff; ἐν ὑπαίθρῳ stellt den Schauplatz außerhalb der Stadt im freien Gelände heraus.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur wurde gegenüber dem Griechischen leicht geglättet, ohne den Gegensatz zwischen der Stadt und dem offenen Gelände oder die Stärke der Angst abzuschwächen.
