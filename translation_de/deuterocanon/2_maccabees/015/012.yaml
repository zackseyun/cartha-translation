base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/015/012.yaml
  text: 'His vision was like this: Onias[a], who had become high priest, a noble and good man, modest in bearing, gentle in manner, and one who spoke fittingly, and who from childhood had cultivated all the proper qualities of virtue—this man was stretching out his hands and praying for the whole body of the Jews.'
translation:
  language: de
  text: 'Seine Vision war folgende: Onias, der Hohepriester geworden war, ein edler und guter Mann, zurückhaltend im Auftreten, sanft im Wesen, der angemessen sprach und von Kindheit an alles gepflegt hatte, was zur Tugend gehört, streckte die Hände aus und betete für die gesamte Gemeinschaft der Juden[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: „für den gesamten Verband der Juden“. Das griechische Wort bezeichnet die Juden hier als eine zusammengehörige Gesamtheit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: θεωρία
  choice: Vision
  rationale: Im Zusammenhang bezeichnet das Wort den geschauten Inhalt eines Traumes; „Vision“ gibt dies im Deutschen klar wieder.
- source_word: γενόμενον ἀρχιερέα
  choice: der Hoher Priester geworden war
  rationale: Bewahrt den retrospektiven Sinn des Aoristpartizips, ohne es deutend zu „ehemaliger Hoher Priester“ umzudeuten.
- source_word: καλὸν καὶ ἀγαθόν
  choice: ein edler und guter Mann
  rationale: Die Wortverbindung würdigt hier vor allem den Charakter und nicht die körperliche Schönheit.
- source_word: αἰδήμονα μὲν τὴν ἀπάντησιν
  choice: zurückhaltend in seinem Auftreten
  rationale: Gibt die respektvolle Bescheidenheit seines äußeren Verhaltens wieder, ohne die schwierige Wendung auf eine konkrete Begrüßung einzuengen.
- source_word: πρᾶον δὲ τὸν τρόπον
  choice: sanft in seinem Wesen
  rationale: Entspricht der ethischen Charakterisierung als mild und sanft.
- source_word: λαλιὰν προειμένον πρεπόντως
  choice: von angemessener Rede
  rationale: Die schwierige Formulierung besagt, dass seine Redeweise passend und geziemend war; die deutsche Fassung wahrt dies knapp und würdig.
- source_word: ἐκ παιδὸς ἐκμεμελετηκότα
  choice: von Kindheit an … gepflegt hatte
  rationale: Das Perfektpartizip bezeichnet eine langjährige, sorgfältige Einübung und Pflege.
- source_word: πάντα τὰ τῆς ἀρετῆς ἴδια
  choice: alles …, was zur Tugend gehört
  rationale: Gibt die Eigenschaften oder Verhaltensweisen wieder, die der Tugend eigen sind, ohne zusätzliche Systematisierung.
- source_word: κατεύχεσθαι
  choice: betete für
  rationale: Das Verb bezeichnet hier ein fürbittendes Beten; der Gegenstand der Fürbitte folgt im Dativ.
- source_word: τῷ παντὶ τῶν Ἰουδαίων συστήματι
  choice: für die gesamte Gemeinschaft der Juden
  rationale: σύστημα bezeichnet die Juden als zusammengehörige Gesamtheit; „Gemeinschaft“ ist natürlich und bewahrt den kollektiven Sinn.
theological_decisions:
- issue: Onias in einer visionären Fürsprecherrolle
  choice: Die Szene wird ausdrücklich als Gebet des Onias für die jüdische Gemeinschaft wiedergegeben.
  alternative: Die Handlung lediglich als Segenswunsch oder Wohlwollen wiederzugeben.
  rationale: κατεύχεσθαι bezeichnet Gebet. Die Übersetzung bewahrt die Darstellung der Vision, ohne weitergehende dogmatische Folgerungen hinzuzufügen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die lange griechische Periodenstruktur wird weitgehend bewahrt, aber durch Gedankenstrich und idiomatische Charakterbeschreibungen lesbar gehalten. Der Fußnotenmarker steht am Ende der von ihm erläuterten Wendung.
