base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/015/022.yaml
  text: 'And he spoke[a], calling upon him in this way: “You, Master, sent your angel in the time of Hezekiah king of Judea, and he struck down a hundred eighty-five thousand in the camp of Sennacherib.”'
translation:
  language: de
  text: 'Er sprach und rief ihn dabei folgendermaßen an: »Du, Gebieter, hast deinen Engel zur Zeit[b] Hiskias, des Königs von Judäa[a], gesandt, und er erschlug 185.000 Mann aus dem Lager Sanheribs.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Juda«. Im Griechischen steht »Judäa« (Ἰουδαίας); historisch ist das Königreich Juda gemeint.'
    reason: lexical_alternative
  - marker: b
    text: Die griechische Fügung kann formal auch mit »über Hiskia« oder »gegen Hiskia« wiedergegeben werden; der historische Zusammenhang spricht hier für den zeitlichen Sinn.
    reason: source_ambiguity
lexical_decisions:
- source_word: ἔλεγεν δὲ ἐπικαλούμενος
  choice: Er sprach und rief ihn dabei … an
  rationale: Die Wiedergabe erhält sowohl das Sprechen des Imperfekts ἔλεγεν als auch den anrufenden, gebetsartigen Sinn des Partizips ἐπικαλούμενος, ohne beide zu einem einzigen Verb zusammenzuziehen.
- source_word: τόνδε τὸν τρόπον
  choice: folgendermaßen
  rationale: Natürliche und zugleich formnahe deutsche Einleitung der unmittelbar folgenden Gebetsworte.
- source_word: Σύ, δέσποτα
  choice: Du, Gebieter
  rationale: Das ausdrücklich gesetzte σύ bleibt zur Betonung als »Du« erhalten. »Gebieter« wahrt den Unterschied zwischen δέσποτα und κύριος und bringt die uneingeschränkte Autorität der Anrede zum Ausdruck.
- source_word: ἀπέστειλας τὸν ἄγγελόν σου
  choice: hast deinen Engel … gesandt
  rationale: Direkte, idiomatische Wiedergabe der göttlichen Sendung; im Zusammenhang der Rettung vor Sanherib bezeichnet ἄγγελος einen Engel.
- source_word: ἐπὶ Ἐζεκίου
  choice: zur Zeit Hiskijas
  rationale: ἐπί mit Genitiv kann einen zeitlichen Bezug bezeichnen. Der historische Rückblick auf Gottes Eingreifen während der Herrschaft Hiskijas spricht für diese Lesart; die formal mögliche alternative Beziehung wird in einer Fußnote offengelegt.
- source_word: τοῦ βασιλέως τῆς Ἰουδαίας
  choice: des Königs von Judäa
  rationale: »Judäa« gibt die griechische Gebietsbezeichnung Ἰουδαία unmittelbar wieder; historisch ist das Königreich Juda gemeint.
- source_word: ἀνεῖλεν
  choice: erschlug
  rationale: Das Verb bezeichnet hier das Töten der Angehörigen des feindlichen Heeres. »Erschlug« ist knapp, würdig und in diesem historischen Kampfzusammenhang verständlich.
- source_word: ἐκ τῆς παρεμβολῆς Σενναχηρείμ
  choice: aus dem Lager Sanheribs
  rationale: »Aus dem Lager« bewahrt die Präposition ἐκ und bezeichnet die Gruppe beziehungsweise den Ort, aus dem die Getöteten stammten.
- source_word: εἰς ἑκατὸν ὀγδοήκοντα πέντε χιλιάδας
  choice: 185.000 Mann
  rationale: Die Zahl wird klar und modern wiedergegeben. »Mann« macht den im Heerlager kontextuell vorausgesetzten menschlich-militärischen Bezug deutlich, ohne eine zusätzliche Truppengattung festzulegen.
theological_decisions:
- issue: Unterscheidung von δέσποτα und κύριος
  choice: Gebieter
  alternative: Herr; Herrscher
  rationale: »Gebieter« erhält die besondere Wortwahl δέσποτα und vermeidet eine unmarkierte Gleichsetzung mit κύριος. Zugleich bleibt die Anrede natürlich und drückt Gottes Autorität aus.
- issue: Bezug von ἐπὶ Ἐζεκίου
  choice: zur Zeit Hiskijas
  alternative: über/gegen Hiskia
  rationale: 'Der historische Zusammenhang legt die zeitliche Bedeutung nahe: Der Engel wurde während Hiskijas Herrschaft gegen Sanheribs Heer gesandt, nicht gegen Hiskia. Da die griechische Fügung formal anders bezogen werden kann, wird die Alternative in der Fußnote genannt.'
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Gebetseinleitung bleibt etwas feierlich, ohne altertümliche Formen zu verwenden. Die Fußnotenmarker stehen unmittelbar bei den jeweils erläuterten Ausdrücken.
