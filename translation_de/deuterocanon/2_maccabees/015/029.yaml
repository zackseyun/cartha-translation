base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/015/029.yaml
  text: And when a cry and turmoil arose[b][a], they blessed the Sovereign in their ancestral language.
translation:
  language: de
  text: Als aber lautes Rufen und Unruhe aufkamen, priesen sie den Herrscher[a] in der Sprache ihrer Vorfahren.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „den Mächtigen“ beziehungsweise „den Gebieter“; das griechische Wort bezeichnet jemanden, der Macht oder Herrschaft besitzt.
    reason: lexical_alternative
  - marker: b
    text: Wörtlich „in/mit der angestammten Stimme“; „Stimme“ kann hier „Sprache“ bedeuten. Gemeint ist wahrscheinlich ihre angestammte Sprache.
    reason: lexical_alternative
lexical_decisions:
- source_word: γενομένης
  choice: als … aufkamen
  rationale: Das Aoristpartizip von γίνομαι steht in einem Genitivus absolutus und bezeichnet hier einen zeitlichen Begleitumstand. „Als … aufkamen“ gibt dies in natürlichem Deutsch wieder.
- source_word: κραυγῆς
  choice: lautes Rufen
  rationale: κραυγή bezeichnet einen lauten Ruf oder ein Geschrei. „Lautes Rufen“ bewahrt den Vorgang, ohne ihn näher als Schlachtruf, Klage oder Jubel festzulegen.
- source_word: ταραχῆς
  choice: Unruhe
  rationale: ταραχή bezeichnet Erregung, Verwirrung oder tumultartige Unordnung. „Unruhe“ bleibt im Deutschen offen genug für die konkrete Art des Tumults.
- source_word: εὐλόγουν
  choice: priesen
  rationale: Das Imperfekt von εὐλογέω bezeichnet hier fortgesetztes oder wiederholtes ehrendes Reden zu Gott. „Priesen“ ist im Deutschen idiomatischer als „segneten“, ohne den gottesdienstlichen Sinn zu verflachen.
- source_word: τὸν δυνάστην
  choice: den Herrscher
  rationale: δυνάστης bezeichnet den, der Macht oder Vollmacht besitzt. Als Gottesbezeichnung vermittelt „der Herrscher“ Autorität und Würde, ohne eine spezifischere Gottesbezeichnung einzutragen.
- source_word: τῇ πατρίῳ φωνῇ
  choice: in der Sprache ihrer Vorfahren
  rationale: Der Dativ bezeichnet Mittel oder Art und Weise. πατρίος bedeutet „von den Vätern/Vorfahren überliefert“, während φωνή hier wahrscheinlich Sprache oder Sprechweise meint. Die Formulierung ist klar und bewahrt den Bezug zur überlieferten eigenen Sprache.
theological_decisions:
- issue: Wiedergabe des auf Gott bezogenen Titels τὸν δυνάστην
  choice: den Herrscher
  alternative: den Mächtigen; den Machthaber; den Gebieter
  rationale: Der griechische Titel verbindet Macht und Herrschaft. „Der Herrscher“ ist als ehrende Gottesbezeichnung verständlich und würdevoll; die Fußnote bewahrt die mögliche Betonung der Macht, ohne den Titel im Haupttext dogmatisch zu präzisieren.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit gut verständlichem Satzbau. Das einleitende δέ wird durch „aber“ sichtbar gehalten. Der Haupttext gibt die wahrscheinliche Bedeutung von φωνή idiomatisch als „Sprache“ wieder; die wörtlichere Möglichkeit bleibt in der Fußnote erhalten.
