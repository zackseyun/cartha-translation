base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/015/027.yaml
  text: And while fighting with their hands[a], they were praying in their hearts to God, and they struck down no fewer than thirty-five thousand and four hundred[b], having been greatly gladdened by the care of God.
translation:
  language: de
  text: Während sie mit den Händen kämpften und in ihren Herzen zu Gott beteten, streckten sie nicht weniger als 35.400 Mann nieder[a] und freuten sich sehr über Gottes Fürsorge.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die griechische Zahlenangabe entspricht dem Sinn nach 35.400. Ihre überlieferte Form ist an dieser Stelle verkürzt beziehungsweise unregelmäßig.
    reason: textual_variant
  - marker: b
    text: 'Oder: „… wurden durch Gottes Fürsorge sehr erfreut.“ Wörtlicher steht im Griechischen „die Fürsorge Gottes“; das zugehörige Verb bezeichnet große Freude.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῖς μὲν χερσὶν ἀγωνιζόμενοι
  choice: während sie mit den Händen kämpften
  rationale: ἀγωνίζομαι bezeichnet hier den tätlichen Kampf. Die Wendung bewahrt den Gegensatz zwischen dem äußeren Kämpfen mit den Händen und dem inneren Beten im Herzen.
- source_word: ταῖς δὲ καρδίαις πρὸς τὸν θεὸν εὐχόμενοι
  choice: und in ihren Herzen zu Gott beteten
  rationale: Der Dativ καρδίαις bezeichnet den inneren Bereich des Gebets und steht parallel zu χερσίν. „In ihren Herzen“ ist im modernen Deutsch klar und natürlich.
- source_word: κατέστρωσαν
  choice: streckten sie … nieder
  rationale: Das Verb bedeutet im militärischen Zusammenhang, Gegner zu Boden zu bringen oder niederzustrecken. Die gewählte Formulierung ist kraftvoll, aber nicht unnötig archaisch.
- source_word: οὐδὲν ἧττον
  choice: nicht weniger als
  rationale: Die idiomatische Wendung hebt die Zahl als Mindestangabe hervor.
- source_word: μυριάδων πένθων καὶ τετρακισχιλίων
  choice: 35.400 Mann
  rationale: Die überlieferte Zahlenformulierung ist in diesem Zeugnis verkürzt beziehungsweise unregelmäßig. Entsprechend der erschlossenen Zahl wird die Summe in der im Deutschen üblichen Ziffernschreibung wiedergegeben; die textliche Schwierigkeit wird in einer Fußnote offengelegt.
- source_word: τῇ τοῦ θεοῦ μεγάλως ἐφρανθέντες ἐπιμελείᾳ
  choice: dabei erfüllte Gottes Fürsorge sie mit großer Freude
  rationale: ἐπιμέλεια bezeichnet Fürsorge, Sorgfalt oder kümmernde Zuwendung; ἐφρανθέντες drückt große Freude aus. Die aktive deutsche Satzform gibt den kausalen Zusammenhang natürlich wieder, ohne „Fürsorge“ zum theologischen Fachbegriff „Vorsehung“ auszuweiten.
theological_decisions:
- issue: Wiedergabe von τοῦ θεοῦ ἐπιμελείᾳ als „Fürsorge“ oder als „Vorsehung“
  choice: Gottes Fürsorge
  alternative: Gottes Vorsehung / Gottes fürsorgendes Eingreifen
  rationale: ἐπιμέλεια benennt unmittelbar Fürsorge oder aufmerksame Zuwendung. „Vorsehung“ ist als theologische Deutung möglich, würde jedoch einen stärker systematischen Begriff einführen, als der griechische Wortlaut verlangt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der parallele Gegensatz von äußerem Kampf und innerem Gebet bleibt erhalten. „Mann“ verdeutlicht, dass die Zahl gefallene Kämpfer bezeichnet; die Fußnotenmarker stehen unmittelbar bei den jeweils erläuterten Aussagen.
