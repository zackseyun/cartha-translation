base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/015/037.yaml
  text: and to keep the thirteenth day of the twelfth month—called Adar in the Syrian language—as a notable day[b][a], one day before Mordecai's day.
translation:
  language: de
  text: und den dreizehnten Tag des zwölften Monats – er heißt in syrischer Sprache[a] Adar – als besonderen Tag zu begehen, einen Tag vor dem Mordechai-Tag.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der vorgelegte griechische Wortlaut hat hier die ungewöhnliche Form κυριακῇ, wörtlich etwa „herrschaftlich“ oder „zum Herrn gehörig“. Wahrscheinlich ist Συριακῇ, „syrisch“, zu lesen; möglich ist dem Sinn nach auch „in der Landessprache“ beziehungsweise „in der Volkssprache“.
    reason: textual_variant
  - marker: b
    text: Gemeint ist der Tag der mit Mordechai verbundenen Feier, wahrscheinlich das Purimfest.
    reason: cross_reference
lexical_decisions:
- source_word: ἔχειν
  choice: zu begehen
  rationale: Im Zusammenhang mit einem festgelegten Gedenktag bezeichnet das Verb das Einhalten oder Begehen des Tages, nicht bloßen Besitz.
- source_word: ἐπίσημον
  choice: als besonderen Tag
  rationale: Das Wort kennzeichnet den Tag als hervorgehoben oder bemerkenswert, ohne ihn ausdrücklich zu einem gesetzlich geregelten Feiertag zu erklären.
- source_word: προκαδεκάτην
  choice: den dreizehnten Tag
  rationale: Der zusammengesetzte griechische Zahlbegriff bezeichnet den Tag vor dem vierzehnten, also den dreizehnten Tag.
- source_word: τοῦ δωδεκάτου μηνός
  choice: des zwölften Monats
  rationale: Direkte und natürliche Wiedergabe der Monatsangabe.
- source_word: Ἀδὰρ
  choice: Adar
  rationale: Der Monatsname wird in seiner üblichen deutschen Form transliteriert.
- source_word: τῇ κυριακῇ φωνῇ
  choice: in syrischer Sprache
  rationale: Der Zusammenhang verlangt eine sprachliche Erläuterung des Namens Adar. Die überlieferungsgeschichtlich naheliegende Lesart ist Συριακῇ, „syrisch“; die im bereitgestellten Wortlaut stehende Form κυριακῇ ist auffällig und wird daher in einer Fußnote offengelegt.
- source_word: πρὸ μιᾶς ἡμέρας
  choice: einen Tag vor
  rationale: Die Wendung gibt den zeitlichen Abstand zum folgenden Gedenktag an.
- source_word: τῆς Μαρδοχαϊκῆς ἡμέρας
  choice: dem Mordechai-Tag
  rationale: Das Adjektiv bedeutet „zu Mordechai gehörig“. Die knappe Wiedergabe bewahrt den Bezug, ohne die im Text nicht ausdrücklich genannte Deutung als Purimfest in den Haupttext einzutragen.
theological_decisions:
- issue: Art der mit ἐπίσημον bezeichneten Begehung
  choice: ein hervorgehobener besonderer Gedenktag
  alternative: ein Festtag oder gesetzlicher Feiertag
  rationale: Der Zusammenhang ist kalendarisch, doch ἐπίσημον allein legt weder einen besonderen Kultstatus noch eine rechtliche Verpflichtung fest.
- issue: Textform und Bedeutung von τῇ κυριακῇ φωνῇ
  choice: „in syrischer Sprache“ im Haupttext, mit textkritischem Hinweis
  alternative: „in der herrschaftlichen Sprache“, „in der Landessprache“ oder „in der Volkssprache“
  rationale: Die vorgelegte Form κυριακῇ ist in diesem Zusammenhang schwer verständlich; die bekannte und kontextuell passende Form Συριακῇ bezeichnet die syrische beziehungsweise aramäische Sprache. Die Fußnote wahrt die Unsicherheit, statt sie stillschweigend zu beseitigen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Begehen“ passt zum kalendarischen Zusammenhang; „besonderer Tag“ vermeidet eine zu starke kultische oder rechtliche Festlegung. Der Satzanfang bleibt als Fortsetzung mit „und“ erhalten, weil der griechische Ausgangstext syntaktisch an den vorherigen Zusammenhang anschließt.
