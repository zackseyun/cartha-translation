review_pass:
  verdict: revise
  source_fidelity: Die Wiedergabe von προκαδεκάτην, Monatsangabe, Adar, dem hervorgehobenen Status des Tages und dem zeitlichen Verhältnis zum Mordechai-Tag ist sachgerecht. Der überlieferte Wortlaut τῇ κυριακῇ φωνῇ ist jedoch auffällig und lautet nicht Συριακῇ („syrisch“). Da die Lesart und ihre intendierte Bedeutung unsicher sind, sollte der Haupttext nicht eindeutig „in syrischer Sprache“ behaupten, sondern eine zurückhaltende, kontextgerechte Wiedergabe wählen und die Schwierigkeit in der Anmerkung ausweisen.
  naturalness: Der Satz ist in modernem Standarddeutsch flüssig. „als besonderen Tag zu begehen“ ist idiomatisch und wahrt den nicht weiter spezifizierten Charakter von ἐπίσημον. „in der Landessprache“ ist hier natürlich und weniger festlegend als „in syrischer Sprache“.
  terminology: „Adar“ und „Mordechai-Tag“ sind angemessen. „Besonderer Tag“ vermeidet die nicht ausdrücklich im griechischen Adjektiv enthaltene Fest- oder Rechtskategorie. Die Fußnote soll die mögliche syrisch/aramäische Bezugnahme als textkritisch bzw. kontextuell naheliegende Deutung, nicht als gesicherte Lesart, kennzeichnen.
  issues:
  - severity: medium
    issue: Die Haupttextwiedergabe „in syrischer Sprache“ setzt gegenüber dem vorgelegten griechischen Wortlaut τῇ κυριακῇ φωνῇ eine nicht im Text stehende Lesart Συριακῇ voraus.
    rationale: Die Kontextdeutung auf Syrisch/Aramäisch ist gut nachvollziehbar und entspricht dem englischen Audit, aber der maßgebliche vorgelegte Wortlaut ist ungewöhnlich und unsicher. Die Übersetzung sollte die Unsicherheit im Haupttext nicht auflösen.
  - severity: low
    issue: Die Fußnote formuliert „Wahrscheinlich ist Συριακῇ … zu lesen“ zu bestimmt.
    rationale: Ohne einen ausgewiesenen textkritischen Apparat sollte die abweichende Lesart lediglich als mögliche, kontextuell naheliegende Erklärung dargestellt werden.
  revised_text: und den dreizehnten Tag des zwölften Monats – in der Landessprache[a] heißt er Adar – als besonderen Tag zu begehen, einen Tag vor dem Mordechai-Tag.[b]
  revised_footnotes:
  - marker: a
    text: Der vorgelegte griechische Wortlaut hat die ungewöhnliche Form κυριακῇ, deren genaue Bedeutung hier unsicher ist. Sie kann im Zusammenhang auf die Landessprache oder Volkssprache weisen. Eine Lesart Συριακῇ („syrisch“) würde die gebräuchliche Erklärung des Monatsnamens als syrisch beziehungsweise aramäisch ergeben.
    reason: textual_variant
  - marker: b
    text: Gemeint ist der Tag der mit Mordechai verbundenen Feier, wahrscheinlich das Purimfest.
    reason: cross_reference
  revision_rationale: Die Revision wahrt die kalendarische und syntaktische Aussage des griechischen Satzes, macht aber die problematische Sprachbezeichnung nicht zu einer ungesicherten Festlegung auf „syrisch“. Die Anmerkung dokumentiert sowohl die überlieferte schwierige Form als auch die kontextuell plausible syrische/aramäische Erklärung.
