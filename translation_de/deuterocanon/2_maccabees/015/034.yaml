base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/015/034.yaml
  text: And they all blessed the manifest Lord toward heaven[a], saying, “Blessed is the one who has kept his own place undefiled.”
translation:
  language: de
  text: 'Da priesen sie alle, zum Himmel gewandt, den Herrn, der sich offen gezeigt hatte, und sagten: »Gepriesen sei der, der seinen eigenen Ort[a] unbefleckt bewahrt hat.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sein eigenes Heiligtum“ beziehungsweise „seinen eigenen Tempel“. Wörtlich steht im Griechischen „Ort“; im Zusammenhang ist wahrscheinlich der heilige Ort gemeint, der vor Verunreinigung bewahrt wurde.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς τὸν οὐρανόν
  choice: zum Himmel gewandt
  rationale: Die Wendung mit εἰς und Akkusativ bezeichnet hier die Richtung des Lobpreises. Die Übersetzung bewahrt diese Aufwärtsrichtung, ohne auszusagen, dass Gott räumlich auf den Himmel begrenzt sei.
- source_word: εὐλόγησαν / Εὐλογητός
  choice: priesen / Gepriesen sei
  rationale: Bei auf Gott gerichtetem εὐλογέω ist „preisen“ im heutigen Deutsch natürlicher als „segnen“. „priesen“ und „Gepriesen“ erhalten zugleich die erkennbare Wortverbindung zwischen Verb und Ausruf.
- source_word: τὸν ἐπιφανῆ κύριον
  choice: den Herrn, der sich offen gezeigt hatte
  rationale: ἐπιφανής bezeichnet den Herrn als den, der sichtbar beziehungsweise offenkundig in Erscheinung getreten ist. Die verbale Wiedergabe klingt im Deutschen natürlicher als „den offenbaren Herrn“ und vermeidet die Verengung auf bloßen Glanz.
- source_word: διατηρήσας
  choice: bewahrt hat
  rationale: Das Verb bezeichnet das fortdauernde Erhalten in einem bestimmten Zustand; „bewahrt hat“ verbindet sich idiomatisch mit „unbefleckt“.
- source_word: τὸν ἑαυτοῦ τόπον
  choice: seinen eigenen Ort
  rationale: τόπος bedeutet zunächst allgemein „Ort“. Obwohl der Zusammenhang sehr wahrscheinlich Gottes heiligen Ort beziehungsweise den Tempel meint, bleibt die allgemeinere Formulierung des Griechischen im Haupttext erhalten.
- source_word: ἀμίαντον
  choice: unbefleckt
  rationale: ἀμίαντος bezeichnet kultische wie auch moralische Unverunreinigung. „unbefleckt“ bewahrt diese Reinheitsbedeutung und passt zum wahrscheinlichen Tempelbezug.
theological_decisions:
- issue: Ob τὸν ἑαυτοῦ τόπον im Haupttext ausdrücklich als Heiligtum oder Tempel bezeichnet werden soll
  choice: Die allgemeinere Wiedergabe „seinen eigenen Ort“ bleibt im Haupttext stehen.
  alternative: „sein eigenes Heiligtum“ oder „seinen eigenen Tempel“
  rationale: Der Zusammenhang legt den Tempel deutlich nahe, doch der griechische Text verwendet τόπος („Ort“) und nicht das spezifischere ναός oder ἱερόν. Die Fußnote nennt die naheliegende Deutung, ohne sie dem Wortlaut aufzuzwingen.
- issue: Wie ἐπιφανής auf den Herrn bezogen wiederzugeben ist
  choice: „der sich offen gezeigt hatte“
  alternative: „der herrliche Herr“ oder „der erschienene Herr“
  rationale: Die gewählte Fassung lässt das sichtbare beziehungsweise offenkundige Eingreifen Gottes erkennen, ohne die Aussage ausschließlich als ästhetische Herrlichkeit oder als technisch verstandene Erscheinung zu deuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Gepriesen sei“ wahrt den feierlichen Lobpreis, während die Relativsatzfassung von ἐπιφανής natürlich verständlich bleibt. Die Stellung der Fußnotenmarke beim Wort „Ort“ entspricht ihrem tatsächlichen Gegenstand.
