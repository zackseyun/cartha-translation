  source_fidelity: 'Die Übersetzung gibt die wesentlichen Elemente des griechischen Textes zuverlässig wieder: das gemeinsame Gotteslob, die himmelwärts gerichtete Wendung, den als offenbar handelnd verstandenen Herrn sowie die Bewahrung seines eigenen „Ortes“ vor Befleckung. „Der sich offen gezeigt hatte“ ist eine natürliche kontextuelle Entfaltung von ἐπιφανῆ und wahrt den Bezug auf das offenbar gewordene Eingreifen des Herrn.'
  naturalness: Modernes, würdevolles und gut lesbares Standarddeutsch. „Zum Himmel gewandt“ ist idiomatisch und vermittelt die durch εἰς τὸν οὐρανόν bezeichnete Ausrichtung. Die feierliche Formel „Gepriesen sei“ passt zum anschließenden Εὐλογητός.
  terminology: „Herr“, „unbefleckt“ und „bewahrt“ sind angemessen. Die Wortverbindung „priesen/Gepriesen“ bildet die griechische Verbindung von εὐλόγησαν und Εὐλογητός sinnvoll nach. „Ort“ bewahrt die lexikalische Weite von τόπος; die Fußnote bietet die im Kontext naheliegenden, aber im Haupttext nicht erzwungenen Deutungen „Heiligtum“ und „Tempel“.
