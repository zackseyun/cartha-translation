base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/015/038.yaml
  text: So[a], since the events concerning Nicanor had turned out in this way, and from those times the city had remained in the possession of the Hebrews[b], I too will bring my account to a close here.
translation:
  language: de
  text: Da nun die Ereignisse um Nikanor so verlaufen waren und die Stadt seit jener Zeit von den Hebräern gehalten wurde, will auch ich meinen Bericht hier beenden.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τῶν ... κατὰ Νικάνορα χωρησάντων οὕτως
  choice: Da nun die Ereignisse um Nikanor so verlaufen waren
  rationale: Die Wendung fasst rückblickend zusammen, wie die Angelegenheit um Nikanor ausgegangen ist. „So verlaufen waren“ gibt χωρησάντων οὕτως natürlich und ergebnisbezogen wieder.
- source_word: ἀπ᾿ ἐκείνων τῶν καιρῶν
  choice: seit jener Zeit
  rationale: Das idiomatische deutsche Singular „seit jener Zeit“ bezeichnet wie der griechische Plural den seit den geschilderten Ereignissen andauernden Zeitraum.
- source_word: κρατηθείσης τῆς πόλεως ὑπὸ τῶν Ἐβραίων
  choice: die Stadt ... von den Hebräern gehalten wurde
  rationale: Die passive Form bleibt erhalten. „Gehalten wurde“ lässt offen, ob vor allem Besitz, Herrschaft oder militärische Kontrolle gemeint ist, statt die Aussage unnötig einzuengen.
- source_word: τῆς πόλεως
  choice: die Stadt
  rationale: Obwohl aus dem Zusammenhang Jerusalem gemeint ist, nennt der griechische Text die Stadt hier nicht ausdrücklich beim Namen.
- source_word: καὶ αὐτὸς
  choice: auch ich
  rationale: Die Formulierung bewahrt die betonte Selbstbezeichnung des Erzählers.
- source_word: αὐτόθι τὸν λόγον καταπαύσω
  choice: meinen Bericht hier beenden
  rationale: λόγος bezeichnet hier den schriftlichen Bericht; καταπαύσω kündigt dessen Abschluss an. Die Wiedergabe ist gegenwärtiges, würdiges Deutsch.
theological_decisions: []
translation_notes:
  register: Moderner, würdiger Buchschluss in gut verständlichem Standarddeutsch. Die syntaktische Unterordnung mit „Da nun“ bildet den zusammenfassend-begründenden Charakter der griechischen Genitivkonstruktionen ab. Keine Fußnote ist erforderlich; die im englischen Konsultationstext gesetzten Marker sind erkennbar den jeweils falschen Stellen zugeordnet und wurden daher nicht übernommen.
