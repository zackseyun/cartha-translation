base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/015/004.yaml
  text: But they declared[a], “The Lord lives; he himself is the ruler in heaven, the one who commanded the observance of the seventh day.”
translation:
  language: de
  text: 'Sie aber erklärten: „Der Herr lebt! Er selbst ist der Herrscher im Himmel, der geboten hat, den siebten Tag[a] zu halten.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den Sabbat“. Im Griechischen steht „den siebten Tag“; gemeint ist das Halten des Sabbats.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποφηναμένων
  choice: sie aber erklärten
  rationale: Das Partizip führt ihre förmliche, nachdrückliche Antwort ein; „erklärten“ gibt dies natürlicher wieder als ein bloßes „sagten“.
- source_word: Ἔστιν ὁ κύριος ζῶν
  choice: Der Herr lebt!
  rationale: Die idiomatische deutsche Wendung bewahrt den bekenntnishaften und feierlichen Nachdruck des Griechischen.
- source_word: δυνάστης
  choice: Herrscher
  rationale: Das Wort bezeichnet denjenigen, der Macht und Herrschaft besitzt; „Herrscher“ ist klar, würdig und nicht unnötig altertümlich.
- source_word: κελεύσας
  choice: der geboten hat
  rationale: Die Form bezeichnet Gottes autoritative Anordnung; „geboten hat“ wahrt die verbindliche Kraft.
- source_word: ἀσκεῖν τὴν ἑβδόμαδα
  choice: den siebten Tag zu halten
  rationale: „Halten“ gibt in diesem Zusammenhang die religiöse Beachtung natürlich wieder, während „der siebte Tag“ die Ausdrucksweise des griechischen Textes bewahrt.
theological_decisions:
- issue: Wiedergabe von τὴν ἑβδόμαδα
  choice: den siebten Tag
  alternative: den Sabbat
  rationale: Der griechische Text verwendet wörtlich eine Bezeichnung für den siebten Tag, meint im Kontext aber die Sabbatbeachtung. Der Haupttext bleibt an der Formulierung der Quelle; die eindeutige kontextuelle Bedeutung wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Ausruf „Der Herr lebt!“ erhält den feierlichen Bekenntniston; die Satzstruktur bleibt klar und mündlich verständlich.
