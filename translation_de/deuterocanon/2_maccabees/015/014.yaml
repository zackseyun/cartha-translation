base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/015/014.yaml
  text: Then Onias answered and said[a], “This is Jeremiah, the prophet of God, who loves his brothers and prays much for the people and the holy city.”
translation:
  language: de
  text: 'Onias aber antwortete: „Das ist Jeremia, der Prophet Gottes, der seine Brüder liebt[a] und viel für das Volk und die heilige Stadt betet.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: „der die Brüder liebt“. Das griechische Wort bezeichnet brüderliche Liebe und meint hier die Verbundenheit mit den Angehörigen seines Volkes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθέντα δὲ τὸν Ὀνίαν εἰπεῖν
  choice: Onias aber antwortete
  rationale: Die griechische Verbindung aus Aoristpartizip und εἰπεῖν leitet die direkte Rede ein. Im heutigen Deutschen gibt „antwortete“ die Wendung natürlich und ohne das schwerfällige „antwortete und sagte“ wieder; δέ erscheint als „aber“.
- source_word: φιλάδελφος
  choice: der seine Brüder liebt
  rationale: Das Adjektiv bezeichnet brüderliche beziehungsweise geschwisterliche Liebe. „Seine Brüder“ bewahrt das konkrete männliche Verwandtschaftsbild und bezeichnet im Kontext Jeremias Volksgenossen; eine Fußnote macht diese Bedeutungsspanne sichtbar.
- source_word: πολλὰ προσευχόμενος
  choice: viel … betet
  rationale: Die präsentische Partizipialform beschreibt anhaltende beziehungsweise wiederholte Fürbitte. „Viel betet“ wahrt den adverbialen Sinn von πολλά, ohne ihn auf bloße Häufigkeit festzulegen.
- source_word: περὶ τοῦ λαοῦ καὶ τῆς ἁγίας πόλεως
  choice: für das Volk und die heilige Stadt
  rationale: περί mit Genitiv bezeichnet hier den Gegenstand der Fürbitte. „Das Volk“ fügt kein im Griechischen unausgedrücktes Possessivpronomen hinzu; „die heilige Stadt“ entspricht der sakralen Bezeichnung Jerusalems.
- source_word: Ἰερεμίας ὁ τοῦ θεοῦ προφήτης
  choice: Jeremia, der Prophet Gottes
  rationale: Die Apposition wird eng am griechischen Wortlaut und zugleich idiomatisch wiedergegeben.
theological_decisions:
- issue: Jeremias Liebe zu den „Brüdern“ und seine Fürbitte in der Vision
  choice: der seine Brüder liebt und viel für das Volk und die heilige Stadt betet
  alternative: der die Brüder liebt und oft für das Volk und die heilige Stadt betet
  rationale: Die Übersetzung erhält sowohl das familiale Bild von φιλάδελφος als auch die im Text ausdrücklich ausgesagte Fürbitte Jeremias, ohne deren theologischen Status über die Darstellung der Vision hinaus zu bestimmen. „Viel“ lässt offen, ob Umfang, Intensität oder Häufigkeit betont ist.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die umständliche griechische Redeeinleitung wird idiomatisch gestrafft; die appositionelle Identifizierung Jeremias und die Aussage über seine fortdauernde Fürbitte bleiben erhalten.
