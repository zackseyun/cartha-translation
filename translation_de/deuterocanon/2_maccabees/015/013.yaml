base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/015/013.yaml
  text: Then in this way there appeared a man distinguished by his gray hair and glory[b][a], and the majesty surrounding him was in some way marvelous and most splendid.
translation:
  language: de
  text: Dann erschien auf diese Weise ein Mann, der durch sein graues Haar und seine Herrlichkeit hervorstach[a]; die Erhabenheit, die ihn umgab[b], war von wunderbarer und höchst prachtvoller Art.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein Mann, der an grauem Haar und Herrlichkeit hervorragte“. Das Griechische fasst die Beschreibung in einer Partizipialkonstruktion zusammen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „die Erhabenheit um ihn herum“. Gemeint ist die außergewöhnliche Hoheit oder Größe, die seine Erscheinung umgab.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶθ᾽ οὕτως
  choice: Dann auf diese Weise
  rationale: Gibt sowohl die zeitliche Abfolge als auch die Art der visionären Erscheinung wieder, ohne οὕτως auf bloße Gleichartigkeit festzulegen.
- source_word: ἐπιφανῆναι
  choice: erschien
  rationale: Im berichteten Visionszusammenhang bezeichnet der Aoristinfinitiv das Sichtbarwerden; „erschien“ ist im Deutschen natürlich und vermeidet eine stärker theologisch gefärbte Wiedergabe wie „wurde offenbart“.
- source_word: ἄνδρα
  choice: ein Mann
  rationale: Direkte und im Kontext angemessene Wiedergabe von ἀνήρ.
- source_word: πολιᾷ
  choice: sein graues Haar
  rationale: Das Substantiv bezeichnet graues beziehungsweise weißes Haar als Zeichen von Alter und Würde. Die konkrete Wiedergabe bewahrt das sichtbare Merkmal.
- source_word: δόξῃ
  choice: seine Herrlichkeit
  rationale: „Herrlichkeit“ wahrt den gehobenen biblischen Sprachgebrauch und kann hier sowohl Würde als auch sichtbaren Glanz anklingen lassen.
- source_word: διαφέροντα
  choice: hervorstach
  rationale: Das Partizip bezeichnet eine auffällige Auszeichnung oder Überlegenheit hinsichtlich der beiden Dative; „hervorstach“ ist verständlich und wahrt diese vergleichende Nuance.
- source_word: θαυμαστὴν ... τινα
  choice: auf eine gewisse Weise wunderbar
  rationale: Bewahrt sowohl den Eindruck des Staunenswerten als auch die durch τινα ausgedrückte gewisse Unbestimmtheit.
- source_word: μεγαλοπρεπεστάτην
  choice: überaus majestätisch
  rationale: Gibt den Superlativ der Pracht und Größe in natürlichem, gehobenem Deutsch wieder.
- source_word: τὴν περὶ αὐτὸν ὑπεροχήν
  choice: die Erhabenheit, die ihn umgab
  rationale: „Erhabenheit“ bleibt nahe bei der Vorstellung von Vorrang und herausragender Größe; der Relativsatz gibt περὶ αὐτόν als eine den Mann umgebende sichtbare Hoheit wieder.
theological_decisions:
- issue: Wesen und Identität der visionären Gestalt
  choice: Die Gestalt wird nur als erscheinender, würdevoller Mann beschrieben und in diesem Vers nicht näher identifiziert.
  alternative: Die Gestalt ausdrücklich als himmlisches oder verherrlichtes Wesen bezeichnen.
  rationale: Der griechische Text beschreibt Erscheinung, altersgeprägte Würde, Herrlichkeit und umgebende Erhabenheit, nennt hier aber keine Identität. Die Übersetzung wahrt diese Zurückhaltung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht gehobenem visionärem Ton. Die Formulierungen bleiben bildhaft und verständlich, ohne die Gestalt über den Wortlaut hinaus theologisch zu bestimmen.
