base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/015/018.yaml
  text: For the concern about wives and children[a], and further about brothers and relatives, weighed less with them[b], but the greatest and first fear was for the consecrated temple.
translation:
  language: de
  text: Denn die Sorge um Ehefrauen[a] und Kinder, ferner auch um Brüder und Verwandte, wog für sie weniger[b]; doch am größten und an erster Stelle stand die Angst[c] um den geweihten Tempel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „Frauen“; im Zusammenhang der aufgezählten Familienangehörigen sind wahrscheinlich Ehefrauen gemeint.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich etwa: „nahm für sie einen geringeren Platz ein“; gemeint ist, dass diese Sorge für sie geringere Priorität hatte.'
    reason: idiom_explanation
  - marker: c
    text: Oder „Sorge“ beziehungsweise „Furcht“. Das griechische Wort kann hier sowohl Angst als auch besorgte Unruhe ausdrücken.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ περὶ γυναικῶν καὶ τέκνων
  choice: die Sorge um Ehefrauen und Kinder
  rationale: Der substantivierte Ausdruck mit περὶ bezeichnet hier die Sorge um Familienangehörige. γυναικῶν bedeutet wörtlich „Frauen“, bezeichnet in dieser familiären Reihe aber wahrscheinlich Ehefrauen.
- source_word: ἔτι δὲ ἀδελφῶν καὶ συγγενῶν
  choice: ferner auch um Brüder und Verwandte
  rationale: ἔτι δέ fügt eine weitere Gruppe hinzu; συγγενεῖς bezeichnet Verwandte beziehungsweise Angehörige der Sippe.
- source_word: ἐν ἥττονι μέρει κείμενος αὐτοῖς
  choice: wog für sie weniger
  rationale: Die griechische Wendung besagt wörtlich, dass diese Sorge bei ihnen „in einem geringeren Teil“ lag, also einen niedrigeren Stellenwert hatte. Die gewählte Formulierung gibt den Prioritätsvergleich idiomatisch wieder.
- source_word: μέγιστος δὲ καὶ πρῶτος
  choice: am größten und an erster Stelle
  rationale: Die Doppelung bewahrt sowohl die Stärke als auch den Vorrang der Sorge, ohne eines der beiden griechischen Elemente einzuebnen.
- source_word: ὁ περὶ τοῦ καθηγιασμένου ναοῦ φόβος
  choice: die Angst um den geweihten Tempel
  rationale: φόβος kann Angst, Furcht oder besorgte Unruhe bezeichnen. „Angst um“ passt zum drohenden Verlust und bleibt stärker als das allgemeinere „Sorge“. καθηγιασμένου bezeichnet den Tempel als geweiht beziehungsweise geheiligt.
theological_decisions:
- issue: Bedeutung von φόβος im militärisch-religiösen Zusammenhang
  choice: Angst um den geweihten Tempel
  alternative: Sorge um den geweihten Tempel; Furcht um den geweihten Tempel
  rationale: „Angst“ erhält die emotionale Stärke von φόβος, während die Konstruktion „Angst um“ deutlich macht, dass es um die Bedrohung des Tempels und nicht um ehrfürchtige Gottesfurcht geht. Die Fußnote hält die weitere Bedeutungsbreite offen.
- issue: Wiedergabe von καθηγιασμένου ναοῦ
  choice: der geweihte Tempel
  alternative: der geheiligte Tempel; der heilige Tempel
  rationale: Das Perfektpartizip bezeichnet einen Tempel, der geweiht worden ist und diesen Status besitzt. „Geweiht“ bewahrt diesen verbalen und kultischen Sinn besser als das allgemeinere „heilig“.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Wog für sie weniger“ gibt die vergleichende Priorität natürlich wieder; „am größten und an erster Stelle“ bewahrt die nachdrückliche Doppelung des griechischen Textes. Die Semikolon-Struktur hält den deutlichen Gegensatz zwischen familiärer Sorge und der vorrangigen Angst um den Tempel fest.
