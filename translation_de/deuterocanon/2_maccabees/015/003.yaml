base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/015/003.yaml
  text: But that thrice-accursed man asked whether there is in heaven a sovereign who commanded the keeping of the sabbath day[a].
translation:
  language: de
  text: Doch der dreifach Verfluchte fragte, ob es im Himmel einen Herrscher gebe, der geboten habe, den Sabbattag zu halten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ob der Herrscher im Himmel sei, der geboten habe, den Sabbattag zu halten.“ Das Griechische lässt sich entweder unbestimmt verstehen („ob es im Himmel einen Herrscher gebe …“) oder als bestimmtere Bezugnahme auf den Gott Israels.'
    reason: alternative_reading
lexical_decisions:
- source_word: τρισαλιτήριος
  choice: der dreifach Verfluchte
  rationale: Das seltene, stark abwertende Epitheton mit dem verstärkenden Präfix τρις- wird kraftvoll und zugleich verständlich wiedergegeben; die substantivierte Form entspricht der Personenbezeichnung im Kontext.
- source_word: ἐπηρώτησεν
  choice: fragte
  rationale: Das Verb bezeichnet hier das Stellen einer feindseligen Frage. Der schlichte Ausdruck „fragte“ ist natürlich; die Verachtung ergibt sich aus Kontext und Epitheton.
- source_word: δυνάστης
  choice: Herrscher
  rationale: Das Wort bezeichnet einen Machthaber beziehungsweise jemanden mit Herrschaftsgewalt. „Herrscher“ ist direkt und würdevoll, ohne mit „Herr“ einen feststehenden Gottesnamen oder Titel einzutragen.
- source_word: προστατάξας
  choice: der geboten habe
  rationale: Das Partizip bezeichnet eine autoritative Anordnung. Der Konjunktiv „habe“ fügt sich in die indirekte Frage und bewahrt die Aussage als Inhalt der spöttischen Nachfrage.
- source_word: ἄγειν
  choice: zu halten
  rationale: In Verbindung mit einer Fest- oder Sabbatbezeichnung bedeutet das Verb, den betreffenden Tag zu begehen beziehungsweise einzuhalten. „Den Sabbattag halten“ ist knapp und idiomatisch.
- source_word: τὴν τῶν σαββάτων ἡμέραν
  choice: den Sabbattag
  rationale: Die wörtlich komplexere Wendung bezeichnet den wöchentlichen Sabbat. „Sabbattag“ gibt den Bezug klar wieder, ohne den griechischen Plural unnatürlich nachzubilden.
theological_decisions:
- issue: Referenz der himmlischen Autorität
  choice: einen Herrscher im Himmel
  alternative: den Herrscher im Himmel
  rationale: 'Obwohl δυνάστης den Artikel trägt, kann die Konstruktion in der feindseligen Rede als unbestimmte Frage verstanden werden: ob es überhaupt einen solchen Herrscher gebe. Die alternative bestimmte Bezugnahme auf Israels Gott bleibt in der Fußnote sichtbar.'
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem erzählerischem Ton. „Dreifach Verfluchte“ bewahrt die ungewöhnliche rhetorische Schärfe; „Herrscher“ vermeidet eine konfessionell oder titular überbestimmte Wiedergabe.
