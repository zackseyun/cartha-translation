base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/015/001.yaml
  text: But Nicanor[a], having learned that those with Judas were in the regions of Samaria, resolved to attack them on the day of rest with complete security.
translation:
  language: de
  text: Nikanor aber erfuhr, dass die Leute um Judas sich in den Gebieten Samarias aufhielten, und beschloss, sie am Tag der Ruhe[a] in völliger Sicherheit anzugreifen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint ist wahrscheinlich der Sabbat; wörtlich steht hier „Tag der Ruhe“.
    reason: lexical_alternative
lexical_decisions:
- source_word: μεταλαβών
  choice: erfuhr
  rationale: In Verbindung mit dem folgenden Akkusativ samt Partizip bezeichnet das Verb hier das Erlangen einer Information. „Erfuhr“ ist im Deutschen natürlich und gibt den erzählerischen Sinn präzise wieder.
- source_word: τοὺς περὶ τὸν Ἰούδαν ὄντας
  choice: die Männer um Judas
  rationale: Die Wendung οἱ περὶ mit einem Personennamen bezeichnet die zu dieser Person gehörende oder sie begleitende Gruppe. „Die Männer um Judas“ gibt diese Bedeutung knapp und verständlich wieder.
- source_word: ἐν τοῖς κατὰ Σαμάρειαν τόποις
  choice: in den Gebieten Samarias
  rationale: Die Formulierung bezeichnet die mit Samaria verbundene Gegend, ohne eine genaue Verwaltungseinheit festzulegen. Der Plural „Gebiete“ bewahrt zudem τόποις.
- source_word: ἐβουλεύσατο
  choice: beschloss
  rationale: Die mediale Form bezeichnet hier eine überlegte Entscheidung beziehungsweise einen gefassten Plan. „Beschloss“ bewahrt sowohl die Abwägung als auch die Entschlossenheit.
- source_word: τῇ τῆς καταπαύσεως ἡμέρᾳ
  choice: am Tag der Ruhe
  rationale: Dies gibt die griechische Formulierung wörtlich und verständlich wieder. Da nicht das übliche Wort σάββατον steht, wird die wahrscheinliche Bezugnahme auf den Sabbat in der Fußnote erläutert.
- source_word: μετὰ πάσης ἀσφαλείας
  choice: ohne jedes Risiko
  rationale: Die Wendung drückt Nikanors Erwartung aus, den Angriff in völliger Sicherheit und ohne Gefahr für sich ausführen zu können. „Ohne jedes Risiko“ ist idiomatisches modernes Deutsch.
- source_word: ἐπιβαλεῖν
  choice: anzugreifen
  rationale: Im militärischen Zusammenhang bedeutet das Verb, sich auf jemanden zu werfen beziehungsweise ihn anzugreifen. „Angreifen“ ist direkt und sachgerecht.
theological_decisions:
- issue: Bestimmung des „Tages der Ruhe“
  choice: Im Haupttext wörtlich „Tag der Ruhe“, mit Hinweis auf den wahrscheinlich gemeinten Sabbat in der Fußnote.
  alternative: Sabbattag
  rationale: Der griechische Text verwendet hier nicht das übliche Lehnwort σάββατον, sondern die transparente Umschreibung „Tag der Ruhe“. Die Übersetzung bewahrt diesen Wortlaut, ohne die wahrscheinliche historische Bedeutung zu verschweigen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Auflösung des griechischen Partizipialgefüges in zwei Hauptsätze sorgt für klare, natürliche Erzählprosa; „Daraufhin“ bewahrt den engen sachlichen Zusammenhang zwischen Nachricht und Entschluss.
