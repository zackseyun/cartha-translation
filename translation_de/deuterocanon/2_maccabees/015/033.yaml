  text: And after cutting out the tongue of the ungodly Nikanor, he said he would throw it piece by piece to the birds, and hang up the wages of his folly opposite the temple.
translation:
  language: de
  text: Und nachdem er dem gottlosen Nikanor die Zunge herausgeschnitten hatte, sagte er, er werde sie Stück für Stück den Vögeln vorwerfen und den Lohn für seinen Unverstand[a] gegenüber dem Tempel aufhängen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die gebührende Strafe für seinen Unverstand“. Der griechische Ausdruck kann die Vergeltung oder das bezeichnen, was jemand für seine Taten empfängt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γλῶσσαν
  choice: Zunge
  rationale: Das Herausschneiden verlangt hier eindeutig die körperliche Bedeutung.
- source_word: δυσσεβοῦς
  choice: gottlosen
  rationale: Das Wort bezeichnet fehlende Ehrfurcht gegenüber Gott; „gottlos“ bewahrt diese religiöse Wertung in verständlichem Deutsch.
- source_word: ἐκτεμών
  choice: nachdem er … herausgeschnitten hatte
  rationale: Das Partizip bezeichnet eine Handlung, die der folgenden Äußerung vorausgeht, und meint die vollständige Entfernung der Zunge.
- source_word: ἔφη
  choice: sagte er, er werde
  rationale: Die folgenden Infinitive geben den von ihm angekündigten Vorsatz wieder; der deutsche Konjunktiv bildet die indirekte Rede natürlich ab.
- source_word: μετὰ μέρος
  choice: Stück für Stück
  rationale: Die Wendung bezeichnet eine Aufteilung in einzelne Teile und passt zum Verfüttern an die Vögel.
- source_word: τοῖς ὄρνεσιν
  choice: den Vögeln vorwerfen
  rationale: Der Dativ bezeichnet die Empfänger; „vorwerfen“ macht im Deutschen den Vorgang des Verfütterns knapp und natürlich deutlich.
- source_word: τὰ δʼ ἐπίχειρα
  choice: den Lohn
  rationale: Der Ausdruck bezeichnet das, was jemand als Vergeltung für sein Tun empfängt. „Lohn“ erhält die pointierte Vergeltungssprache, ohne ihre strafende Bedeutung ausdrücklich festzulegen.
- source_word: τῆς ἀνοίας
  choice: für seinen Unverstand
  rationale: ἀνοία bezeichnet Torheit, Unvernunft oder Verblendung. „Unverstand“ ist würdig, verständlich und bewahrt die moralische Wertung.
- source_word: κατέναντι τοῦ ναοῦ
  choice: gegenüber dem Tempel
  rationale: κατέναντι bezeichnet eine Lage gegenüber oder vor etwas; „gegenüber“ bewahrt die räumliche Aussage, ohne sie genauer festzulegen.
- source_word: κρεμιάσαι
  choice: aufhängen
  rationale: Der Infinitiv bezeichnet das Aufhängen zur öffentlichen Zurschaustellung.
theological_decisions:
- issue: Religiöse Charakterisierung Nikanors durch δυσσεβοῦς
  choice: gottlosen
  alternative: frevelhaften
  rationale: „Gottlos“ gibt die ausdrücklich religiöse Dimension des griechischen Ausdrucks klar wieder, ohne eine konfessionelle Deutung hinzuzufügen.
- issue: Deutung von τὰ ἐπίχειρα als vergeltende Folge seines Handelns
  choice: den Lohn für seinen Unverstand
  alternative: die gebührende Strafe für seinen Unverstand
  rationale: „Lohn“ bewahrt die bildhafte und grundsätzlich offene Vergeltungssprache des Griechischen; der strafende Sinn ergibt sich aus dem Zusammenhang, wird aber nicht stärker expliziert als im Ausgangstext.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die drastische Körperlichkeit des Ausgangstextes bleibt ungemildert; indirekte Rede und Handlungsfolge werden idiomatisch wiedergegeben.
