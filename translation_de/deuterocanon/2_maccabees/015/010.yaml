base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/015/010.yaml
  text: And after stirring up their spirits[a], he urged them on[b], at the same time pointing out the godlessness of the nations and the violation of oaths.
translation:
  language: de
  text: Und nachdem er ihren Kampfgeist geweckt hatte, forderte er sie auf und führte ihnen zugleich die Gottlosigkeit der Völker[a] und den Bruch der Eide[b] vor Augen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Heiden“.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: „die Verletzung der Eide“ oder „den Eidbruch“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῖς θυμοῖς διεγείρας αὐτούς
  choice: nachdem er ihren Kampfgeist geweckt hatte
  rationale: θυμός kann Gemüt, Leidenschaft, Zorn oder Mut bezeichnen. Im Zusammenhang der Ermutigung vor dem Kampf ist „Kampfgeist“ eine natürliche, kontextgerechte Wiedergabe, ohne die Wendung auf Zorn zu verengen.
- source_word: παρήγγειλεν
  choice: ermahnte er sie
  rationale: παραγγέλλω kann befehlen, anweisen oder eindringlich auffordern. Hier steht die motivierende Ansprache der Kämpfer im Vordergrund; „ermahnte“ bewahrt zugleich den nachdrücklichen Charakter.
- source_word: ἅμα παρειδείκνυς
  choice: und hielt ihnen zugleich … vor
  rationale: Das Partizip bezeichnet eine gleichzeitig begleitende Handlung. „Ihnen … vorhalten“ gibt das aufweisende und argumentativ mahnende Moment idiomatisch wieder.
- source_word: τὴν τῶν ἐθνῶν ἀθεσίαν
  choice: die Gottlosigkeit der Völker
  rationale: ἀθεσία bezeichnet Gottlosigkeit oder Frevel; ἔθνη meint hier die fremden Völker. Die Wiedergabe bleibt verständlich und vermeidet unnötig konfessionell geprägte Assoziationen.
- source_word: τὴν τῶν ὅρκων παράβασιν
  choice: den Bruch der Eide
  rationale: παράβασις bezeichnet Übertretung oder Verletzung. Die Formulierung wahrt den bestimmten griechischen Genitiv, ohne einen im Ausgangstext nicht ausdrücklich bezeichneten Besitzer der Eide einzuführen.
theological_decisions:
- issue: Wiedergabe von ἐθνῶν
  choice: Völker
  alternative: Heiden
  rationale: Im historischen Erzählzusammenhang bezeichnet der Ausdruck die fremden Völker als Gegner. „Völker“ bewahrt diese politisch-ethnische Bedeutung, während „Heiden“ die religiöse Abgrenzung stärker hervorheben würde.
- issue: Bezug der gebrochenen Eide
  choice: Bruch der Eide
  alternative: Bruch ihrer Eide
  rationale: Der griechische Text nennt keinen Besitzer ausdrücklich. Daher wird die mögliche Beziehung zu den zuvor genannten Völkern nicht durch ein ergänztes Possessivpronomen festgelegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Kampfgeist“ erschließt die militärische Situation unmittelbar; Satzbau und Wortwahl bleiben nah an der griechischen Handlungsfolge. Die Fußnotenmarker stehen jeweils unmittelbar bei der betreffenden Wendung.
