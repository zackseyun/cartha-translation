  source_fidelity: „Kampfgeist geweckt“ ist im militärischen Kontext eine gut begründete, idiomatische Wiedergabe von τοῖς θυμοῖς διεγείρας αὐτούς. „Ermahnte“ kann παρήγγειλεν zwar wiedergeben, ist im heutigen Deutsch aber leicht als tadelnde Mahnung missverständlich. „Forderte sie auf“ bringt den appellativ-direktiven Charakter ohne unnötige Einengung besser zum Ausdruck. Für παρειδείκνυς ist „vor Augen führen“ genauer als „vorhalten“, das eine vorwurfsvolle Konnotation haben kann, die der griechische Text nicht ausdrücklich setzt.
  naturalness: Der Satz ist flüssig und würdig. Die Revision vermeidet die potenzielle Mehrdeutigkeit von „hielt ihnen ... vor“ (als Vorwurf gegen die Angesprochenen) und bleibt modernes Standarddeutsch.
  terminology: „Gottlosigkeit der Völker“ gibt ἀθεσία und τῶν ἐθνῶν angemessen wieder. „Völker“ ist gegenüber „Heiden“ im historischen Kontext vorzuziehen. „Bruch der Eide“ gibt τὴν τῶν ὅρκων παράβασιν präzise wieder; ein nicht im Griechischen stehendes Possessivpronomen wird nicht ergänzt.
