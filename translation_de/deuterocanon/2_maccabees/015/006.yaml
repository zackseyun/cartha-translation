  text: And Nicanor[a], in complete confidence and with arrogant pride, had decided to make a public example of those with Judas.
translation:
  language: de
  text: Nikanor aber war völlig selbstsicher und überheblich. Er hatte beschlossen, an Judas und seinen Leuten ein öffentliches Exempel zu statuieren.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Er hatte beschlossen, Judas und seinen Leuten die gleiche Behandlung widerfahren zu lassen.“ Die griechische Wendung κοινὸν … τρόπον ist schwer verständlich; der Haupttext gibt ihren wahrscheinlichen Sinn sinngemäß wieder.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ πάσης ἀσφαλείας
  choice: völlig selbstsicher
  rationale: Die Wendung beschreibt hier Nikanors uneingeschränktes Gefühl der Sicherheit, nicht äußeren Schutz. „Völlig selbstsicher“ gibt diese Haltung in natürlichem Deutsch wieder.
- source_word: ὑψαυχενῶν
  choice: überheblich
  rationale: Das Partizip bezeichnet hochmütiges, selbstüberhebliches Auftreten. Die adverbiale Wiedergabe bewahrt die negative Wertung.
- source_word: διεγνώκει
  choice: hatte beschlossen
  rationale: Das Plusquamperfekt bezeichnet einen bereits gefassten, festen Entschluss.
- source_word: κοινὸν ... τρόπον
  choice: ein öffentliches Exempel
  rationale: Die überlieferte Formulierung ist schwierig und wörtlich („eine gemeinsame Art/Behandlung“) im Deutschen unverständlich. Im Zusammenhang liegt eine öffentlich vorgeführte, exemplarische Behandlung der Gruppe um Judas nahe.
- source_word: τῶν περὶ τὸν Ἰούδαν
  choice: an Judas und seinen Leuten
  rationale: Die idiomatische griechische Wendung bezeichnet Judas samt der ihm zugehörigen Gruppe; die deutsche Formulierung schließt Judas selbst natürlich ein.
- source_word: συστήσασθαι
  choice: zu statuieren
  rationale: Das Medium bezeichnet hier das Herbeiführen beziehungsweise Ins-Werk-Setzen der beabsichtigten Behandlung und verbindet sich im Deutschen idiomatisch mit „ein Exempel statuieren“.
