lexical_decisions:
- source_word: Οἱ δὲ περὶ τὸν Νικάνορα
  choice: Doch Nikanor und seine Leute
  rationale: Die griechische Wendung bezeichnet Nikanors Gefolgschaft beziehungsweise Truppe. Die deutsche Formulierung ist natürlich und schließt Nikanor als ihren Anführer ein, ohne eine bestimmte militärische Gliederung vorauszusetzen.
- source_word: σαλπίγγων
  choice: Trompeten
  rationale: Der allgemeine Ausdruck entspricht dem griechischen Wort für ein Signal- oder Kriegsblasinstrument, ohne ein genaueres modernes Instrument zu unterstellen.
- source_word: παιάνων
  choice: Schlachtgesängen
  rationale: Im militärischen Zusammenhang bezeichnet παιάν gesungene Sieges-, Kampf- oder Lobgesänge. „Schlachtgesänge“ vermittelt dies verständlich, während die genauere Bedeutungsbreite in der Fußnote erhalten bleibt.
- source_word: προσῆγον
  choice: rückten … heran
  rationale: Die Form bezeichnet hier die gerichtete Bewegung auf den Gegner zu. „Heranrücken“ gibt den militärischen Zusammenhang idiomatisch wieder.
