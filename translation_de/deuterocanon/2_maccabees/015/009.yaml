  text: And by encouraging them from the Law and the Prophets, and also by reminding them of the struggles they had already completed, he made them more eager.
translation:
  language: de
  text: Und indem er ihnen aus dem Gesetz und den Propheten Mut zusprach und sie zudem an die Kämpfe erinnerte, die sie bereits zu Ende geführt hatten, machte er sie entschlossener.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραμυθούμενος
  choice: Mut zusprach
  rationale: Gibt das ermutigende und stärkende Zureden des griechischen Partizips in natürlichem modernem Deutsch wieder.
- source_word: ἐκ τοῦ νόμου καὶ τῶν προφητῶν
  choice: aus dem Gesetz und den Propheten
  rationale: Bewahrt die beiden traditionellen Schriftkategorien und die Vorstellung, dass daraus die Ermutigung geschöpft wird.
- source_word: τοὺς ἀγῶνας
  choice: die Kämpfe
  rationale: Entspricht dem weiten Bedeutungsfeld von ἀγών und passt zum militärischen Zusammenhang, ohne es unnötig zu verengen.
- source_word: ἐκτετελεκότες
  choice: zu Ende geführt hatten
  rationale: Bewahrt gegenüber bloßem „ertragen“ den Vollendungsaspekt des Perfekts von ἐκτελέω.
- source_word: προθυμοτέρους
  choice: entschlossener
  rationale: Drückt gesteigerte Bereitschaft und Tatkraft idiomatisch aus; „eifriger“ könnte im Deutschen zu stark religiös oder emotional klingen.
