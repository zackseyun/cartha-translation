  yaml_path: translation/deuterocanon/2_maccabees/015/031.yaml
  text: And when he arrived there[a], he called together his fellow countrymen and the priests, stood them before the altar, and sent for those from the citadel.
translation:
  language: de
  text: Als er dort angekommen war, rief er seine Landsleute und die Priester zusammen, stellte sie vor dem Altar auf und ließ diejenigen aus der Zitadelle[a] herbeirufen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Möglicherweise ist die Akra gemeint, die befestigte Burganlage in Jerusalem.
    reason: Die Fußnote bewahrt die historisch naheliegende Identifizierung der ἄκρα, ohne sie gegenüber dem Gemeinnamen „Zitadelle“ als zwingend oder als bloß lexikalisch genauere Wiedergabe auszugeben.
lexical_decisions:
- source_word: παραγενόμενος
  choice: als er dort angekommen war
  rationale: Das Aoristpartizip bezeichnet eine Handlung, die den folgenden Handlungen vorausgeht; die Formulierung gibt diese zeitliche Abfolge in natürlichem Deutsch wieder.
- source_word: συγκαλεσάμενος
  choice: rief ... zusammen
  rationale: Das Verb bezeichnet das Zusammenrufen zu einer Versammlung; „zusammenrufen“ wahrt sowohl den Vorgang als auch die Initiative des Handelnden.
- source_word: τοὺς ὁμοεθνεῖς
  choice: seine Landsleute
  rationale: ὁμοεθνής bezeichnet Angehörige desselben Volkes. „Landsleute“ ist verständlich und vermeidet die gegenüber dem griechischen Ausdruck engere Festlegung auf „Mitjuden“.
- source_word: τοὺς ἱερεῖς
  choice: die Priester
  rationale: Direkte und im Kontext natürliche Wiedergabe des griechischen Plurals.
- source_word: πρὸ τοῦ θυσιαστηρίου στῆσας
  choice: stellte sie vor dem Altar auf
  rationale: στῆσας ist die transitive Aoristform von ἵστημι; die zuvor genannten Akkusativobjekte, die Landsleute und Priester, sind sinngemäß auch sein Objekt. „Aufstellen“ drückt die veranlasste Positionierung vor dem Altar klar aus.
- source_word: μετεπέμψατο
  choice: ließ ... holen
  rationale: Das Verb bedeutet, nach jemandem zu schicken beziehungsweise jemanden herbeirufen zu lassen. „ließ ... holen“ ist im Deutschen idiomatisch und bewahrt diesen Sinn.
- source_word: τοὺς ἐκ τῆς ἄκρας
  choice: diejenigen aus der Zitadelle
  rationale: ἄκρα kann eine Zitadelle oder befestigte Höhe bezeichnen und meint hier wahrscheinlich die als Akra bekannte Festung in Jerusalem. Der Haupttext bleibt allgemein verständlich; die historische Bezeichnung steht in der Fußnote.
theological_decisions:
- issue: Historisch-geografischer Bezug von ἄκρα
  choice: Zitadelle
  alternative: Akra
  rationale: Die Entscheidung ist historisch-geografisch, nicht konfessionell. Der Haupttext gibt den Gemeinnamensinn verständlich wieder, während die Fußnote die mögliche beziehungsweise wahrscheinliche Bezeichnung der konkreten Jerusalemer Festung bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzfolge bleibt nah an der griechischen Handlungsabfolge, wird jedoch durch finite Verben natürlich lesbar. Der Fußnotenmarker steht unmittelbar bei dem Ausdruck, auf den sich die Anmerkung bezieht.
