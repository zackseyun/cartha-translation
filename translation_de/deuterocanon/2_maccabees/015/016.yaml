lexical_decisions:
- source_word: Λάβε
  choice: Nimm
  rationale: Der Aoristimperativ von λαμβάνω wird direkt und natürlich mit „Nimm“ wiedergegeben; „Empfange“ bleibt möglich, legt aber stärker den Akzent auf das Entgegennehmen.
- source_word: τὴν ἁγίαν ῥομφαίαν
  choice: das heilige Schwert
  rationale: ῥομφαία bezeichnet eine große Klinge beziehungsweise ein Schwert. „Schwert“ ist im Deutschen die natürliche Entsprechung; „heilig“ bewahrt den religiösen Gehalt von ἁγίαν.
- source_word: δῶρον παρὰ τοῦ θεοῦ
  choice: eine Gabe von Gott
  rationale: δῶρον steht appositionell zum Schwert, während παρά mit Genitiv dessen Ursprung bezeichnet. Die Formulierung identifiziert das Schwert knapp als göttliche Gabe.
- source_word: δι' ἧς
  choice: mit dem
  rationale: Die feminine Form bezieht sich im Griechischen auf ῥομφαία; im Deutschen richtet sich das Relativpronomen nach dem grammatisch sächlichen „Schwert“. „Mit“ gibt den instrumentalen Sinn natürlich wieder.
- source_word: θραύσεις
  choice: du wirst zerschmettern
  rationale: Das Futur von θραύω bezeichnet ein gewaltsames Zerbrechen. „Zerschmettern“ erhält die starke Bildhaftigkeit und den kriegerischen Ton.
- source_word: τοὺς ὑπεναντίους
  choice: die Widersacher
  rationale: ὑπεναντίους bezeichnet feindlich Gegenüberstehende. „Widersacher“ bewahrt den gehobenen Ton und den Aspekt aktiver Gegnerschaft; „Feinde“ ist ebenfalls möglich.
theological_decisions:
- issue: Wiedergabe von ἁγίαν
  choice: heilig
  alternative: geweiht
  rationale: „Heilig“ gibt ἁγίαν unmittelbar wieder und lässt offen, ob vor allem göttliche Zugehörigkeit, Aussonderung oder kultische Weihe gemeint ist.
- issue: Verhältnis des Schwertes zur göttlichen Gabe
  choice: 'appositionell: „das heilige Schwert, eine Gabe von Gott“'
  alternative: „das heilige Schwert als Gabe von Gott“
  rationale: Das knappe griechische δῶρον kann appositionell verstanden werden. Die gewählte Fassung bezeichnet das Schwert als Gabe, ohne eine zusätzliche Deutung des Empfangsvorgangs einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direktem Imperativ und kräftiger martialischer Bildsprache. „Gabe“ hält einen leicht gehobenen biblischen Ton, bleibt aber allgemein verständlich.
