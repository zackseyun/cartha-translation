  text: And they all decreed by common vote that this day should by no means be left unmarked,[a]
translation:
  language: de
  text: Und sie alle beschlossen in gemeinsamer Abstimmung, diesen Tag keinesfalls unbeachtet zu lassen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »diesen Tag auf keinen Fall ungekennzeichnet zu lassen« beziehungsweise »ohne Gedenken zu lassen«. Das griechische Wort ἀπαρασήμαντον bedeutet wörtlich »ohne kennzeichnendes Zeichen« und bezieht sich hier auf die öffentliche Erinnerung an oder Begehung dieses Tages.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδογμάτισαν
  choice: beschlossen
  rationale: Der Aorist bezeichnet hier eine förmliche, gemeinschaftlich gefasste Entscheidung. »Beschlossen« wahrt den offiziellen Charakter, ohne im Deutschen unnötig obrigkeitlich zu klingen.
- source_word: πάντες
  choice: sie alle
  rationale: Die Wendung gibt die ausdrückliche Gesamtheit der Beteiligten wieder und lässt zusammen mit der gemeinsamen Abstimmung die Einmütigkeit der Gruppe erkennen.
- source_word: μετὰ κοινοῦ ψηφίσματος
  choice: in gemeinsamer Abstimmung
  rationale: κοινός bezeichnet das Gemeinsame, ψήφισμα einen durch Abstimmung zustande gekommenen Beschluss. Die Formulierung bewahrt den öffentlich-beratenden Charakter und vermeidet die schwerfällige Dopplung »durch gemeinsamen Beschluss beschlossen«.
- source_word: μηδαμῶς
  choice: keinesfalls
  rationale: Das Wort ist eine nachdrückliche Verneinung; »keinesfalls« gibt diese Stärke in natürlichem modernem Deutsch wieder.
- source_word: ἐᾶσαι
  choice: zu lassen
  rationale: Der Infinitiv bedeutet zulassen oder in einem Zustand belassen. Die deutsche Infinitivkonstruktion bildet die griechische Fügung knapp und idiomatisch ab.
- source_word: ἀπαρασήμαντον
  choice: unbeachtet
  rationale: Wörtlich bezeichnet das Wort etwas, das ohne kennzeichnendes Zeichen bleibt. Im Zusammenhang mit einem besonderen Gedenktag meint es, den Tag nicht ohne öffentliche Beachtung oder Erinnerung verstreichen zu lassen. »Unbeachtet« ist natürlich, während die Fußnote die konkrete Bildsprache und mögliche kultische beziehungsweise öffentliche Begehung offenhält.
- source_word: τήνδε τὴν ἡμέραν
  choice: diesen Tag
  rationale: Die demonstrative Fügung verweist betont auf den konkret genannten Tag; »diesen Tag« gibt dies im Deutschen unmittelbar wieder.
