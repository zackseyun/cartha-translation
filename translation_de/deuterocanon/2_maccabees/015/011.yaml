  terminology: „Schilden und Speeren“, „glaubwürdiger Traum“ und „über alle Maßen“ sind angemessen. „Ermutigung durch gute Worte“ gibt παράκλησις in Verbindung mit ἐν τοῖς ἀγαθοῖς λόγοις klarer wieder als „Zuspruch guter Worte“, ohne die Bedeutung von ἀγαθός unnötig auf „edel“ einzuengen.
