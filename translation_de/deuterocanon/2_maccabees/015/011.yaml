  source_fidelity: 'Die Grundstruktur und die wesentlichen Bedeutungen werden zutreffend wiedergegeben: die vergleichende Gewichtung von Waffen und Zuspruch, der positiv bewertete Traum sowie die stark gesteigerte Freude. „Zuspruch guter Worte“ ist jedoch im Deutschen semantisch und syntaktisch weniger klar als der griechische Bezug der Ermutigung auf die guten Worte. Zudem sollte das kollektive Objekt bei der abschließenden Freude ausdrücklich erscheinen.'
