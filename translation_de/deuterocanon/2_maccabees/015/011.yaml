base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/015/011.yaml
  text: And after arming each of them[a], not with the security of shields and spears so much as with encouragement from noble words, and after relating to them a trustworthy dream[b], he made them all rejoice.
translation:
  language: de
  text: Nachdem er jeden von ihnen ausgerüstet hatte, nicht so sehr durch die Sicherheit von Schilden und Speeren als durch die Ermutigung guter Worte, und ihnen einen glaubwürdigen Traum erzählt hatte, machte er sie alle über alle Maßen froh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „einen vertrauenswürdigen Traum“. Das griechische Wort bezeichnet etwas, das des Vertrauens würdig oder glaubhaft ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθοπλίσας
  choice: ausgerüstet hatte
  rationale: Das Aoristpartizip von καθοπλίζω bezeichnet vollständiges Ausrüsten oder Bewaffnen. „Ausgerüstet“ lässt sowohl die militärische als auch die übertragene Ausrüstung durch Worte zu und bildet die zeitliche Partizipialfolge natürlich ab.
- source_word: οὐ τὴν ... ἀσφάλειαν, ὡς τὴν ... παράκλησιν
  choice: nicht so sehr mit dem Schutz ... wie mit dem Zuspruch
  rationale: Die vergleichende Gegenüberstellung οὐ ... ὡς wird im Deutschen idiomatisch mit „nicht so sehr ... wie ...“ wiedergegeben. ἀσφάλεια bezeichnet hier Schutz beziehungsweise Sicherheit, παράκλησις stärkenden Zuspruch oder Ermutigung.
- source_word: ἀσπίδων καὶ λογχῶν
  choice: Schilden und Speeren
  rationale: Dies sind die natürlichen modernen deutschen Entsprechungen der beiden militärischen Begriffe.
- source_word: ἐν τοῖς ἀγαθοῖς λόγοις
  choice: guter Worte
  rationale: Der Genitivanschluss an „Zuspruch“ gibt die in bzw. durch den guten Worten liegende Ermutigung knapp und natürlich wieder. „Gut“ bewahrt die breite Bedeutung von ἀγαθός, ohne unnötig „edel“ oder „vortrefflich“ festzulegen.
- source_word: προσηγησάμενος
  choice: ihnen ... erzählt hatte
  rationale: Das mediale Partizip bezeichnet das Darlegen oder Erzählen gegenüber den Hörern. „Ihnen erzählt“ macht den im Verb angelegten Adressatenbezug im Deutschen deutlich.
- source_word: ὄνειρον ἀξιόπιστον
  choice: einen glaubwürdigen Traum
  rationale: ἀξιόπιστος bedeutet „glaubwürdig“ beziehungsweise „des Vertrauens würdig“. Die Wiedergabe bestätigt die Zuverlässigkeit des Traums, ohne seine Herkunft näher zu bestimmen.
- source_word: ὑπὲρ τὰ πάντα
  choice: über alle Maßen
  rationale: Die Wendung wirkt bei ηὔφραινεν adverbial verstärkend. „Über alle Maßen“ bewahrt das Bild des Überschreitens und klingt in gehobener moderner Erzählsprache natürlich.
- source_word: ηὔφραινεν
  choice: erfüllte er sie ... mit Freude
  rationale: 'Das Imperfekt von εὐφραίνω hat hier kausativen Sinn: Er machte sie froh. Die gewählte Formulierung ist idiomatisch und bewahrt die starke, anhaltend wirkende Freude.'
theological_decisions:
- issue: Herkunft und Charakter des Traums
  choice: „einen glaubwürdigen Traum“
  alternative: „einen von Gott eingegebenen Traum“ oder „einen vertrauenswürdigen Traum“
  rationale: Der griechische Text bewertet den Traum als glaubwürdig, nennt in diesem Vers aber nicht ausdrücklich seinen Ursprung. Die Übersetzung bewahrt diese positive Bewertung, ohne eine göttliche Eingebung hinzuzufügen.
- issue: Verhältnis von Waffen und ermutigenden Worten
  choice: „nicht so sehr ... wie ...“
  alternative: „nicht ... sondern ...“
  rationale: 'Die vergleichende Form wahrt die Spannung des griechischen Ausdrucks: Der Schutz der Waffen wird nicht zwingend vollständig verneint, doch der stärkende Zuspruch erhält das größere Gewicht.'
translation_notes:
  register: Moderne, würdige Erzählsprache. Der lange Satz folgt der griechischen Partizipialstruktur, bleibt aber durch die wiederholte Form „hatte“ klar. „Zuspruch“ ist allgemeinverständlich und trägt sowohl Ermutigung als auch Ermahnung mit, ohne konfessionelle Färbung.
