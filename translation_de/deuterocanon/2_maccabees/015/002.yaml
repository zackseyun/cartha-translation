base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/015/002.yaml
  text: But when the Jews who were being compelled to accompany him said[a], “Do not destroy them in so savage and barbarous a way; rather[b], assign honor to the day that has been specially honored in holiness by the One who watches over all,”
translation:
  language: de
  text: 'Als aber die Juden, die gezwungen waren, ihn zu begleiten, sagten: »Vernichte sie keinesfalls auf so grausame und barbarische Weise[a], sondern erweise dem Tag Ehre[b], der von dem, der über alles wacht, in seiner Heiligkeit besonders geehrt worden ist«,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Töte sie keinesfalls so grausam und barbarisch.« Das griechische Verb kann sowohl »töten« als auch »vernichten« bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich etwa: »Teile dem Tag Ehre beziehungsweise Herrlichkeit zu, der von dem, der über alles wacht, in Heiligkeit bevorzugt worden ist.« Gemeint ist, dem heiligen Tag die ihm zukommende Achtung zu erweisen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τῶν ... Ἰουδαίων
  choice: die Juden
  rationale: Ἰουδαῖοι bezeichnet hier die jüdische ethnisch-religiöse Gemeinschaft, nicht lediglich Bewohner Judäas.
- source_word: κατὰ ἀνάγκην συνεπομένων αὐτῷ
  choice: die gezwungen waren, ihn zu begleiten
  rationale: κατὰ ἀνάγκην drückt Zwang aus; συνεπομένων bezeichnet das Mitgehen oder Begleiten. Die Formulierung macht deutlich, dass sie keine freiwilligen Gefolgsleute waren.
- source_word: Μηδαμῶς
  choice: keinesfalls
  rationale: Das Adverb formuliert eine nachdrückliche Verneinung beziehungsweise ein starkes Verbot.
- source_word: ἀγρίως καὶ βαρβάρως
  choice: auf so grausame und barbarische Weise
  rationale: Die beiden Adverbien werden als rhetorisch verstärkendes Wortpaar bewahrt; „grausam“ gibt ἀγρίως im gegenwärtigen Deutschen natürlicher wieder als „wild“.
- source_word: ἀπολέσῃς
  choice: vernichte
  rationale: ἀπόλλυμι kann sowohl das Töten als auch allgemeiner das Vernichten oder Zugrunderichten bezeichnen. „Vernichte“ erhält diese Bedeutungsbreite; die tödliche Bedeutung bleibt im Kontext möglich.
- source_word: δόξαν δὲ ἀπομέρισον
  choice: sondern erweise ... Ehre
  rationale: δόξα bezeichnet hier die dem heiligen Tag zukommende Ehre, während ἀπομερίζω das Zuteilen oder Zuweisen ausdrückt. Die deutsche Wendung ist natürlich, ohne den Gedanken des gebührenden Ehrenanteils aufzugeben.
- source_word: τῇ προτετιμημένῃ ... ἡμέρᾳ
  choice: dem Tag, der ... besonders geehrt worden ist
  rationale: Das Perfektpartizip bezeichnet den bereits bestehenden, ausgezeichneten Ehrenrang des Tages.
- source_word: ὑπὸ τοῦ πάντα ἐφορῶντος
  choice: von dem, der über alles wacht
  rationale: Die ehrfürchtige Umschreibung für Gott bleibt eine Umschreibung. ἐφοράω umfasst Sehen, Beaufsichtigen und wachsames Überblicken.
- source_word: μεθʼ ἁγιότητος
  choice: in Heiligkeit
  rationale: Die knappe Wiedergabe bewahrt die sakrale Aussage und ihre Zuordnung zum besonderen Ehrenrang des Tages, ohne ausdrücklich „geheiligt“ einzusetzen.
theological_decisions:
- issue: Unausgesprochener Gottesbezug in τοῦ πάντα ἐφορῶντος
  choice: dem, der über alles wacht
  alternative: dem Allsehenden
  rationale: Der griechische Text nennt Gott nicht ausdrücklich, sondern verwendet eine ehrfürchtige substantivierte Partizipialwendung. Die Übersetzung erhält sowohl diesen indirekten Bezug als auch den Gedanken göttlicher Aufsicht.
- issue: Der besondere Status des heiligen Tages
  choice: der ... in Heiligkeit besonders geehrt worden ist
  alternative: der von Gott vor allen anderen geheiligt worden ist
  rationale: Der Text spricht von einem bereits besonders geehrten oder bevorzugten Tag und verbindet dies mit Heiligkeit; er verwendet jedoch kein ausdrückliches Verb für „heiligen“. Daher wird die stärkere Alternative nicht in den Haupttext aufgenommen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz bleibt als abhängiger, zum folgenden Vers hin offener Satzteil erhalten. Die doppelte Charakterisierung „grausam und barbarisch“ sowie die ehrfürchtige indirekte Gottesbezeichnung werden bewahrt.
