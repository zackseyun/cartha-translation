  text: But Maccabeus was continually confident, with every hope, that he would obtain help from the Lord.
translation:
  language: de
  text: Makkabäus aber war stets zuversichtlich und voller Hoffnung, vom Herrn Hilfe zu erlangen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δὲ Μακκαβαῖος
  choice: Der Makkabäer aber
  rationale: Gibt die kontrastive Partikel δέ und den gebräuchlichen deutschen Beinamen natürlich wieder.
- source_word: ἦν ἀδιαλείπτως πεποιθώς
  choice: vertraute unablässig
  rationale: Die periphrastische Konstruktion bezeichnet anhaltendes Vertrauen; „unablässig“ entspricht ἀδιαλείπτως.
- source_word: μετὰ πάσης ἐλπίδος
  choice: und hoffte fest darauf
  rationale: Die wörtliche Formulierung „mit aller Hoffnung“ wäre im Deutschen unnatürlich; gemeint ist eine uneingeschränkte, feste Hoffnung.
- source_word: ἀντιλήμψεως τεύξεσθαι
  choice: Hilfe zu erhalten
  rationale: τεύχομαι mit Genitiv bedeutet hier „etwas erlangen/erhalten“; ἀντίλημψις bezeichnet Beistand oder Hilfe.
- source_word: παρὰ τοῦ κυρίου
  choice: vom Herrn
  rationale: Bewahrt die Herkunftsangabe παρά und die traditionelle, kontextgerechte Wiedergabe von κύριος.
theological_decisions:
- issue: Gewissheit göttlicher Hilfe
  choice: Die Aussage bleibt als festes Vertrauen und feste Hoffnung des Makkabäers formuliert.
  alternative: Die Hilfe als bereits objektiv zugesichert oder garantiert darstellen.
  rationale: Der griechische Text beschreibt seine fortdauernde Zuversicht, nicht ausdrücklich eine göttliche Verheißung oder den bereits erfolgten Beistand.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die etwas sperrige griechische Verbindung von Vertrauen und „aller Hoffnung“ wird idiomatisch entfaltet, ohne ihren Nachdruck abzuschwächen.
