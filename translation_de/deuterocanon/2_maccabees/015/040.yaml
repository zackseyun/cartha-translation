  to: Denn wie es unangenehm ist, Wein für sich allein zu trinken, und ebenso unangenehm, Wasser für sich zu trinken, während mit Wasser gemischter Wein angenehm wird und Genuss bereitet, so erfreut auch die Gestaltung des Berichts die Ohren derer, die das Werk lesen. Hier aber soll das Ende sein.
