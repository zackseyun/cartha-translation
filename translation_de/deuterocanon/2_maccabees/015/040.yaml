  yaml_path: translation/deuterocanon/2_maccabees/015/040.yaml
  text: For just as drinking wine by itself[a], and then again water, is unpleasant, but wine mixed with water becomes pleasing and produces delight, so also the style of the composition delights the ears of those who read the work. Here, then, will be the end.
translation:
  language: de
  text: Denn wie es unangenehm ist, Wein für sich allein zu trinken, und ebenso unangenehm, Wasser für sich zu trinken, während mit Wasser gemischter Wein angenehm wird und Genuss bereitet, so erfreut auch die Gestaltung des Berichts die Ohren derer, die das Werk lesen. Hier aber soll das Ende sein.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθάπερ
  choice: Denn wie
  rationale: Leitet den begründenden Vergleich ein und gibt dessen erklärende Funktion in natürlichem Deutsch wieder.
- source_word: οἶνον κατὰ μόνας πίνειν
  choice: Wein für sich allein zu trinken
  rationale: κατὰ μόνας bezeichnet das Trinken des Weins für sich beziehungsweise ohne Beimischung; die Formulierung bleibt nah am griechischen Ausdruck.
- source_word: ὕδωρ πάλιν πολέμιον
  choice: ebenso auch Wasser [ist unangenehm]
  rationale: πολέμιον bedeutet wörtlich »feindlich«, bezeichnet hier im Zusammenhang des Trinkens aber etwas Unangenehmes oder Unzuträgliches. Das aus dem ersten Satzglied ergänzte Prädikat ergibt idiomatisches Deutsch.
- source_word: συγκερασθεὶς
  choice: mit Wasser gemischt
  rationale: Bezeichnet die in der Antike übliche Mischung von Wein und Wasser; die Ergänzung macht den im Griechischen ausdrücklich genannten Dativ ὕδατι sichtbar.
- source_word: ἐπιτερπῇ τὴν χάριν ἀποτελεῖ
  choice: wird wohlschmeckend und bereitet Genuss
  rationale: Die Wiedergabe bewahrt die doppelte Aussage einer angenehmen Qualität und ihrer erfreulichen Wirkung, ohne die griechische Wendung hölzern nachzubilden.
- source_word: τὸ τῆς κατασκευῆς τοῦ λόγου
  choice: die Gestaltung der Darstellung
  rationale: κατασκευή bezeichnet hier die literarische Ausarbeitung oder Gestaltung, λόγος die vorliegende Darstellung beziehungsweise Erzählung.
- source_word: τέρπει τὰς ἀκοὰς
  choice: erfreut die Ohren
  rationale: Bewahrt das anschauliche Hörbild des griechischen Textes und klingt zugleich würdig und verständlich.
- source_word: τῶν ἐντυγχανόντων τῇ συντάξει
  choice: derer, die das Werk lesen
  rationale: ἐντυγχάνειν kann im Bezug auf einen Text »lesen« bedeuten; σύνταξις bezeichnet hier das zusammengestellte schriftliche Werk.
- source_word: Ἐνταῦθα δὲ ἔσται ἡ τελευτή
  choice: Hiermit soll es zu Ende sein
  rationale: Gibt die knappe, bewusst gesetzte Schlussformel in natürlichem und würdigem Deutsch wieder.
