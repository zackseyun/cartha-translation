base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/015/028.yaml
  text: But once they were relieved of the pressure, and as they withdrew with joy[c][b][a], they recognized Nikanor fallen forward with his armor.
translation:
  language: de
  text: Als sie aber von der Bedrängnis befreit waren[a] und voller Freude abzogen[b], erkannten sie Nikanor, der in voller Rüstung vornüber gestürzt war[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „von der Notwendigkeit entblößt“; gemeint sein kann auch: „von der Notlage befreit“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „aufbrachen“ beziehungsweise „sich zurückzogen“. Das Verb bezeichnet ein Fortgehen oder Aufbrechen, ohne die Richtung eindeutig festzulegen.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder einfach: „zu Boden gestürzt war“. Das griechische Verb kann ein Vorwärts- oder Niederfallen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γεγυμνωμένοι ἀπὸ τῆς χρείας
  choice: von der Bedrängnis befreit
  rationale: γεγυμνωμένοι bedeutet wörtlich „entblößt“ oder „beraubt“, bezeichnet mit ἀπό aber idiomatisch das Befreitsein von etwas. χρεία meint grundsätzlich „Not“, „Bedarf“ oder „Notwendigkeit“; im Zusammenhang der gerade beendeten Schlacht gibt „Bedrängnis“ die konkrete Notlage natürlich wieder.
- source_word: ἀναλύοντες
  choice: abzogen
  rationale: ἀναλύω kann das Aufbrechen oder Fortgehen bezeichnen. „abzogen“ passt zum militärischen Zusammenhang, ohne die vom griechischen Wort nicht eindeutig ausgesagte Rückkehr an einen bestimmten Ort einzutragen.
- source_word: ἐπέγνωσαν
  choice: erkannten
  rationale: ἐπιγινώσκω bezeichnet hier das deutliche Erkennen beziehungsweise Identifizieren des Gefallenen als Nikanor.
- source_word: προπεπτωκότα
  choice: vornüber gestürzt war
  rationale: Das Perfektpartizip beschreibt Nikanor als bereits gestürzt daliegend; „vornüber“ bewahrt die mögliche Richtungsnuance von προ-, ohne sie im Haupttext übermäßig auszubauen.
- source_word: πανοπλίᾳ
  choice: in voller Rüstung
  rationale: πανοπλία bezeichnet die vollständige Rüstung beziehungsweise Kriegsausrüstung. „volle Rüstung“ gibt diesen Umfang genauer wieder als das bloße „Rüstung“.
