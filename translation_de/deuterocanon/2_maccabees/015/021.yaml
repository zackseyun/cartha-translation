revisions:
- from: Als der Makkabäer die heranrückenden Menschenmengen[a], die vielfältige Ausrüstung mit Waffen und die Wildheit der Tiere sah, die an einem günstigen Ort aufgestellt waren, streckte er die Hände zum Himmel aus und rief den wundertätigen Herrn an. Denn er wusste, dass der Sieg nicht durch Waffen errungen wird, sondern dass der Herr ihn denen verschafft, die würdig sind, wie immer er es für recht befindet.[b]
  to: Als der Makkabäer die Anwesenheit der Menschenmengen[a], die vielfältige Ausrüstung mit Waffen und die Wildheit der Tiere sah, die an einem günstigen Ort aufgestellt waren, streckte er die Hände zum Himmel aus und rief den wundertätigen Herrn an, in dem Wissen, dass der Sieg nicht durch Waffen errungen wird, sondern dass er ihn den Würdigen verschafft, wie er es jeweils für richtig befindet.[b]
  rationale: Die Revision entfernt die nicht belegte Bewegungsnuance in „heranrückend“, bewahrt die militärisch günstige Stellung der Tiere und bindet Judas’ Wissen syntaktisch an seine Gebetshandlung zurück. Die Aussage über Gottes Verfügung über den Sieg und die nicht weiter erklärte Würdigkeit der Empfänger bleibt unverändert erhalten.
