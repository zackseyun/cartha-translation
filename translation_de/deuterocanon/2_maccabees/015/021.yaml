base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/015/021.yaml
  text: When Maccabeus saw the presence of the crowds[a], the varied array of weapons, and the savagery of the beasts positioned advantageously, he stretched out his hands to heaven and called on the wonder-working Lord, knowing that victory is not secured by weapons, but that, whenever it is judged right by him[b], he grants it to those who are worthy.
translation:
  language: de
  text: Als der Makkabäer die Anwesenheit der Menschenmengen[a], die vielfältige Ausrüstung mit Waffen und die Wildheit der Tiere sah, die an einem günstigen Ort aufgestellt waren, streckte er die Hände zum Himmel aus und rief den wundertätigen Herrn an, in dem Wissen, dass der Sieg nicht durch Waffen errungen wird, sondern dass er ihn den Würdigen verschafft, wie er es jeweils für richtig befindet.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit den „Tieren“ sind im Zusammenhang wahrscheinlich Kriegselefanten gemeint; der griechische Text nennt sie hier jedoch nur „Tiere“.
    reason: Die Anmerkung erläutert den wahrscheinlichen historischen Bezug, ohne die allgemeinere Bezeichnung des griechischen Textes im Haupttext zu ersetzen.
  - marker: b
    text: 'Die griechische Wendung ist knapp: wörtlich etwa „wie es ihm jeweils entschieden wird“. Sie kann im Zusammenhang auch bedeuten: „wie er es jeweils für richtig befindet“.'
    reason: Die Anmerkung dokumentiert die formale Knappheit der Wendung καθὼς δὲ ἐὰν αὐτῷ κριθῇ, während der Haupttext eine natürliche kontextgemäße Wiedergabe bietet.
lexical_decisions:
- source_word: συνιδών
  choice: sah
  rationale: Das Partizip bezeichnet das aufmerksame Erfassen der gesamten Lage; „sah“ ist natürlich und lässt diesen weiteren Sinn im Zusammenhang erkennen.
- source_word: τὴν τῶν πλήθων παρουσίαν
  choice: die heranrückenden Menschenmengen
  rationale: παρουσία kann Anwesenheit oder Ankunft bezeichnen. Im Schlachtzusammenhang gibt „heranrückend“ die bedrohliche Gegenwart der versammelten Massen idiomatisch wieder, ohne sie ausdrücklich als bestimmte Truppengattung festzulegen.
- source_word: τῶν ὅπλων τὴν ποικίλην παρασκευήν
  choice: die vielfältige Ausrüstung mit Waffen
  rationale: παρασκευή bezeichnet hier angesichts des Genitivs „der Waffen“ am ehesten die militärische Ausrüstung beziehungsweise Bereitstellung; „vielfältig“ bewahrt ποικίλην.
- source_word: θηρίων
  choice: Tiere
  rationale: Das griechische Wort nennt die Tiere nicht näher. Vermutlich sind Kriegselefanten gemeint; diese Identifikation wird jedoch nicht in den Haupttext eingetragen.
- source_word: ἐπὶ μέρος εὔκαιρον
  choice: an einem günstigen Ort aufgestellt
  rationale: Die Wendung beschreibt eine taktisch geeignete Platzierung; die Übersetzung bleibt nahe am räumlichen Ausdruck.
- source_word: ἀγριότητα
  choice: Wildheit
  rationale: „Wildheit“ gibt die bedrohliche, ungebändigte Gefährlichkeit wieder, ohne stärker als das griechische Substantiv zu werten.
- source_word: ἀνατείνας χεῖρας εἰς τὸν οὐρανόν
  choice: streckte er die Hände zum Himmel aus
  rationale: Die konkrete Gebetsgebärde wird bildhaft und in natürlichem Deutsch bewahrt.
- source_word: τερατοποιὸν κύριον
  choice: den wundertätigen Herrn
  rationale: τερατοποιός bezeichnet den, der außergewöhnliche Wunderzeichen vollbringt. „Wundertätig“ ist würdevoll und wahrt die Verbindung von Wunder und Wirken.
- source_word: οὐκ ἐν ὅπλοις
  choice: nicht durch Waffen
  rationale: Die instrumentale Bedeutung von ἐν wird im Deutschen klar mit „durch“ wiedergegeben.
- source_word: καθὼς δὲ ἐὰν αὐτῷ κριθῇ
  choice: wie immer er es für recht befindet
  rationale: Die schwierige unpersönliche Formulierung wird als Entscheidung nach dem Urteil des Herrn verstanden. „Wie immer“ wahrt die Offenheit von καθὼς ἐάν.
- source_word: τοῖς ἀξίοις περιποιεῖται τὴν νίκην
  choice: der Herr ihn denen verschafft, die würdig sind
  rationale: περιποιεῖται bezeichnet das Verschaffen beziehungsweise Sichern des Sieges. Das ausdrückliche Subjekt „der Herr“ verhindert im Deutschen ein unklares Pronomen; „würdig“ bewahrt die wertende, theologisch spannungsreiche Formulierung.
theological_decisions:
- issue: Göttliches Handeln und militärische Mittel
  choice: Der Sieg wird nicht durch Waffen errungen, sondern vom Herrn nach seinem Urteil verschafft.
  alternative: Die Aussage könnte als absolute Verneinung jeder menschlichen Mitwirkung oder ausschließlich als Hinweis auf ein Wunder verstanden werden.
  rationale: Der griechische Gegensatz ordnet den Sieg nicht den Waffen, sondern Gottes Entscheidung und Gewährung zu. Der Vers entwickelt darüber hinaus keine vollständige Lehre über menschliche Mittel.
- issue: Würdigkeit der Empfänger
  choice: „denen, die würdig sind“ bleibt ohne nähere Erklärung stehen.
  alternative: Man könnte „denen, die es verdienen“ schreiben und damit einen stärker verdienstbezogenen Sinn nahelegen.
  rationale: τοῖς ἀξίοις enthält eine echte Wertung, erklärt aber weder deren Grundlage noch ein umfassendes Verdienstsystem. Diese Spannung wird nicht aufgelöst.
- issue: Bezug der göttlichen Entscheidung
  choice: „wie immer er es für recht befindet“ bezieht die Entscheidung auf den Herrn.
  alternative: Die unpersönliche griechische Wendung könnte näher formal mit „wie es ihm entschieden wird“ wiedergegeben werden.
  rationale: Die gewählte Fassung ist im Deutschen verständlich und gibt die naheliegende Aussage göttlichen Ermessens wieder; eine Fußnote weist auf die formale Schwierigkeit und Alternative hin.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit erzählerischer Klarheit. Der Satz wurde zur besseren Verständlichkeit nach dem Gebetsruf geteilt. Militärische Bildsprache und die Spannung zwischen göttlichem Urteil, Sieg und Würdigkeit bleiben erhalten; konfessionelle Ausdeutungen werden vermieden.
