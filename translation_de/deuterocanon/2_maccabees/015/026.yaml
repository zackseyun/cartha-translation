  text: But those around Judas joined battle with the enemies with invocation and prayers[a][b].
translation:
  language: de
  text: Die Männer um Judas aber traten mit Anrufung und Gebeten[a][b] zum Kampf gegen die Feinde an.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit Anrufung Gottes und Gebeten“. Im Griechischen steht „mit Anrufung und Gebeten“; wen sie anrufen, wird in diesem Satz nicht ausdrücklich gesagt.'
    reason: lexical_alternative
  - marker: b
    text: „Gebete“ können auch mit „Gelübde“ wiedergegeben werden; das griechische Wort kann je nach Zusammenhang beides bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ περὶ τὸν Ἰούδαν
  choice: Die Männer um Judas aber
  rationale: Die griechische Wendung bezeichnet die mit Judas verbundene Gruppe. „Die Männer um Judas“ ist im Deutschen natürlich und macht den militärischen Kontext deutlich, ohne die Gruppe näher zu bestimmen, als es der Text tut.
- source_word: μετὰ ἐπικλήσεως
  choice: unter Anrufung
  rationale: ἐπίκλησις bezeichnet hier eine religiöse Anrufung. Die knappe Wiedergabe bewahrt, dass das Objekt der Anrufung in diesem Satz nicht ausdrücklich genannt wird.
- source_word: καὶ εὐχῶν
  choice: und Gebeten
  rationale: εὐχή kann „Gebet“ oder „Gelübde“ bedeuten. In Verbindung mit ἐπίκλησις und unmittelbar vor dem Kampf ist „Gebete“ die wahrscheinlichere Bedeutung; die mögliche Alternative wird in einer Fußnote bewahrt.
- source_word: συνῆψαν
  choice: griffen … an
  rationale: συνάπτω bezeichnet im militärischen Zusammenhang das Aufnehmen beziehungsweise Beginnen des Kampfes. „Die Feinde angreifen“ ist modernes, klares Deutsch und gibt die kriegerische Handlung treffend wieder.
- source_word: τοῖς πολεμίοις
  choice: die Feinde
  rationale: Der Dativ bezeichnet bei συνῆψαν die gegnerische Partei. Die deutsche Konstruktion mit „angreifen“ verlangt den Akkusativ.
theological_decisions:
- issue: Religiöser Gehalt von ἐπίκλησις im Kampfzusammenhang
  choice: „unter Anrufung“ behält die ausdrücklich religiöse Sprache bei, ohne das nicht genannte Objekt zu ergänzen.
  alternative: „unter Anrufung Gottes“ oder allgemeiner „mit einem Hilferuf“
  rationale: Der Vers stellt heraus, dass Judas’ Männer den Kampf betend aufnehmen. Obwohl aus dem Zusammenhang eine Anrufung Gottes naheliegt, nennt der griechische Satz das Objekt nicht ausdrücklich; diese Offenheit bleibt im Haupttext erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Die Männer um Judas“ wirkt natürlicher als das wörtlichere „die um Judas“; „unter Anrufung und Gebeten“ bewahrt den knappen religiösen Parallelismus und die Ambiguität des griechischen Textes.
