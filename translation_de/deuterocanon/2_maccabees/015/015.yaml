  yaml_path: translation/deuterocanon/2_maccabees/015/015.yaml
  text: 'Then Jeremiah stretched out his right hand and handed Judas a golden sword, and as he gave it he addressed him with these words:'
translation:
  language: de
  text: 'Da streckte Jeremia seine rechte Hand aus, übergab Judas ein goldenes Schwert und richtete dabei folgende Worte an ihn:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προτείναντα
  choice: streckte … aus
  rationale: Das Partizip von προτείνω bezeichnet das Vorstrecken der Hand; die deutsche Wendung ist natürlich und wahrt die körperliche Geste.
- source_word: τὴν δεξιὰν
  choice: seine rechte Hand
  rationale: Das substantivierte Adjektiv bedeutet wörtlich »die Rechte«; »seine rechte Hand« ist im heutigen Deutsch klar und idiomatisch.
- source_word: παραδοῦναι
  choice: überreichte
  rationale: Das Verb bezeichnet hier die Übergabe des Schwertes an Judas; »überreichte« gibt den feierlichen Erzählton und die konkrete Handlung treffend wieder.
- source_word: ῥομφαίαν χρυσῆν
  choice: ein goldenes Schwert
  rationale: ῥομφαία bezeichnet eine große Klinge beziehungsweise ein Schwert; »Schwert« ist die verständlichste allgemeine Entsprechung, χρυσῆν heißt »golden«.
- source_word: διδόντα
  choice: während er es ihm gab
  rationale: Das gleichzeitige Partizip verbindet die Übergabe mit dem anschließenden Sprechen. Die Wiedergabe erhält diese zeitliche Beziehung, auch wenn die Übergabe dadurch bewusst nochmals aufgegriffen wird.
- source_word: προσφωνῆσαι τάδε
  choice: sprach zu ihm … folgende Worte
  rationale: προσφωνέω bedeutet jemanden anzureden; τάδε weist auf die nachfolgende Rede. Die Formulierung ist würdig, natürlich und leitet das folgende Zitat klar ein.
- source_word: Ἰούδα
  choice: Judas
  rationale: »Judas« ist die im Deutschen übliche Namensform für Judas Makkabäus.
- source_word: Ἰερεμίαν
  choice: Jeremia
  rationale: »Jeremia« ist die konventionelle deutsche Namensform des Propheten.
theological_decisions:
- issue: Jeremia überreicht in einer Vision eine Waffe
  choice: Die Handlung wird ohne zusätzlichen Hinweis auf ihren visionären Charakter unmittelbar erzählt.
  alternative: Im Vers ausdrücklich ergänzen, dass die Handlung in einer Vision geschieht.
  rationale: Der griechische Wortlaut dieses Verses erzählt die Handlung direkt; der visionäre Rahmen ergibt sich aus dem Kontext. Eine ausdrückliche Ergänzung würde hier nicht vorhandene Information in den Vers eintragen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die Partizipialstruktur des Griechischen wird in einen flüssigen deutschen Satz überführt; die durch παραδοῦναι und διδόντα entstehende Wiederaufnahme des Gebens bleibt in natürlicher Form erhalten.
