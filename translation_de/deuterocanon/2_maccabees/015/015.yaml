  terminology: „Jeremia“, „Judas“, „rechte Hand“, „goldenes Schwert“ und „folgende Worte“ sind terminologisch passend. „Übergab“ entspricht παραδοῦναι gut und wahrt den leicht feierlichen Erzählton.
