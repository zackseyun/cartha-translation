  source_fidelity: Der Hauptsatz gibt den instrumentalen/kausalen Bezug von μεγέθει βραχίονός σου, den passiven Imperativ καταπλαγήτωσαν und das Ziel der feindlichen Annäherung insgesamt zutreffend wieder. »Unter Lästerungen« ist jedoch für μετὰ βλασφημίας im modernen Deutschen unidiomatisch und kann einen bloßen Begleitumstand statt der feindseligen, lästernden Weise des Kommens nahelegen. »Mit Lästerung gegen dein heiliges Volk« ist näher am griechischen Ausdruck und klarer.
