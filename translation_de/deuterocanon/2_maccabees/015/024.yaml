base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/015/024.yaml
  text: Let those who come against your holy people with blasphemy be struck with terror by the greatness of your arm[c][b][a]. And thus he ended in these words.
translation:
  language: de
  text: »Durch die Größe deines Arms[b] sollen alle, die mit Lästerung gegen dein heiliges Volk heranziehen, von Schrecken erfasst werden!«[a] Und so schloss er mit diesen Worten.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »sollen erschrecken« beziehungsweise »bestürzt werden«; das griechische Verb bezeichnet, dass jemand von Furcht oder Bestürzung getroffen wird.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »durch die Größe deines Arms«; der Arm Gottes ist ein biblisches Bild für seine wirksame Macht.'
    reason: cultural_note
  - marker: c
    text: 'Oder: »Und damit kam er zum Schluss«; der griechische Ausdruck verweist auf die eben gesprochenen Worte zurück.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μεγέθει βραχίονός σου
  choice: durch die Größe deines Arms
  rationale: Der instrumentale Dativ wird mit »durch« wiedergegeben. Das konkrete biblische Bild vom Arm Gottes bleibt erhalten und wird nicht deutend durch »Macht« ersetzt.
- source_word: καταπλαγήτωσαν
  choice: sollen … von Schrecken erfasst werden
  rationale: Die Form ist ein passiver Imperativ. Die Wendung bewahrt sowohl den auffordernden Gebetscharakter als auch die Vorstellung, plötzlich in Furcht und Bestürzung versetzt zu werden.
- source_word: οἱ μετὰ βλασφημίας παραγινόμενοι
  choice: alle, die unter Lästerungen … heranziehen
  rationale: παραγίνομαι bezeichnet hier das Herankommen oder Heranziehen; μετὰ βλασφημίας beschreibt dessen Begleitumstand. »Unter Lästerungen« hält den substantivischen Ausdruck fest, ohne seine genaue Ausprägung enger zu bestimmen.
- source_word: ἐπὶ τὸν ἅγιον σου λαόν
  choice: gegen dein heiliges Volk
  rationale: ἐπί mit Akkusativ bezeichnet in diesem feindlichen Zusammenhang die gegen das Volk gerichtete Bewegung. »Heiliges Volk« entspricht der griechischen Formulierung unmittelbar.
- source_word: καὶ οὕτως μὲν ἐν τούτοις ἔληξεν
  choice: Und so schloss er mit diesen Worten
  rationale: ἔληξεν bedeutet »beendete/schloss ab«; ἐν τούτοις verweist auf das unmittelbar zuvor Gesagte. Die deutsche Wendung ist natürlich und wahrt diesen Rückbezug.
theological_decisions:
- issue: Bildhafte Rede vom Arm Gottes
  choice: »deines Arms« als konkretes Bild beibehalten
  alternative: »deiner Macht« oder »deines mächtigen Arms«
  rationale: Der griechische Text nennt ausdrücklich Gottes Arm. Das vertraute biblische Bild bezeichnet Gottes wirksame Macht, sollte aber im Haupttext nicht durch eine Auslegung ersetzt oder durch einen nicht ausdrücklich vorhandenen Zusatz erweitert werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede wird durch deutsche Anführungszeichen kenntlich gemacht. »Heranziehen« trägt dem feindlichen Kontext Rechnung; »unter Lästerungen« bewahrt die substantivische und inhaltlich offene Ausdrucksweise des Griechischen.
