  naturalness: „Zum Kampf aneinandergeraten“ ist im modernen Deutsch weniger eindeutig militärisch und kann einen bloßen Streit nahelegen. „Aufeinandergetroffen waren“ ist natürlich und bezeichnet im Kontext klar das Zusammentreffen der Gegner. „Günstig ... aufgestellt“ ist idiomatisch und präzise.
  terminology: „Heer“, „Reiterei“ und „Flügel“ passen zum militärischen Register. „Tiere“ wahrt die allgemeinere Bedeutung von θηρία; die wahrscheinliche Konkretisierung als Kriegselefanten bleibt zu Recht in einer Anmerkung. Der Anker dieser Anmerkung muss unmittelbar bei „Tiere“ stehen, nicht am Satzende nach „Reiterei“.
