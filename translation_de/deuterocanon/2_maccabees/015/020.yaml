base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/015/020.yaml
  text: And when all were already expecting the coming judgment[a], and the enemies had already joined battle, and the army had been drawn up, and the beasts had been suitably stationed in one part, and the cavalry posted on the flanks[b],
translation:
  language: de
  text: Als nun alle bereits das bevorstehende Gericht[a] erwarteten, die Feinde schon aufeinandergetroffen waren, das Heer in Schlachtordnung aufgestellt war, die Tiere[b] günstig in einem Abschnitt aufgestellt waren und die Reiterei auf den Flügeln aufgestellt war,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die bevorstehende Entscheidung« oder »die kommende Krise«.'
    reason: alternative_reading
  - marker: b
    text: Bei den Tieren handelt es sich wahrscheinlich um Kriegselefanten innerhalb der Schlachtordnung.
    reason: cultural_note
lexical_decisions:
- source_word: προσδοκώντων
  choice: erwarteten
  rationale: Das Partizip bezeichnet ein gespanntes, erwartungsvolles Warten; „erwarteten“ ist natürlich und wahrt die militärische Spannung.
- source_word: τὴν ἐσομένην κρίσιν
  choice: das bevorstehende Gericht
  rationale: κρίσις kann Gericht, Entscheidung oder entscheidende Krise bedeuten. „Gericht“ bewahrt die Schwere und mögliche theologische Resonanz, ohne die im Kampfzusammenhang liegende Entscheidung auszuschließen.
- source_word: προσμιξάντων τῶν πολεμίων
  choice: die Feinde schon zum Kampf aneinandergeraten waren
  rationale: προσμίγνυμι bezeichnet hier das feindliche Zusammentreffen beziehungsweise den Kampfbeginn; die deutsche Wendung gibt dies idiomatisch wieder.
- source_word: τῆς στρατιᾶς ἐκταγείσης
  choice: das Heer in Schlachtordnung aufgestellt war
  rationale: Das Passiv bezeichnet die geordnete Aufstellung der Truppen und wird durch die ausdrückliche Schlachtordnung im Deutschen klar wiedergegeben.
- source_word: τῶν θηρίων
  choice: die Tiere
  rationale: Der griechische Ausdruck ist allgemein und wird deshalb nicht im Haupttext auf Elefanten verengt; die wahrscheinliche Identifikation erfolgt in der Fußnote.
- source_word: ἐπὶ μέρος
  choice: an einem geeigneten Abschnitt
  rationale: μέρος bezeichnet hier einen Teil oder Abschnitt der Schlachtordnung; die Verbindung mit εὐκαίρως wird in natürlichem Deutsch zusammengezogen.
- source_word: εὐκαίρως ἀποκατασταθέντων
  choice: ihren Platz erhalten hatten
  rationale: Die Wendung beschreibt eine zweckmäßige taktische Platzierung; zusammen mit „an einem geeigneten Abschnitt“ bleibt der Sinn präzise und flüssig.
- source_word: τῆς δὲ ἵππου
  choice: die Reiterei
  rationale: ἵππος wird kollektiv-militärisch gebraucht und entspricht im Deutschen der Reiterei beziehungsweise Kavallerie.
- source_word: κατὰ κέρας τεταγμένης
  choice: auf den Flügeln aufgestellt war
  rationale: κέρας ist als militärischer Fachausdruck der Flügel eines Heeres; „Flügel“ bleibt näher am Bild des Griechischen als „Flanken“ und ist verständlich.
theological_decisions:
- issue: Wiedergabe von κρίσις im Kampfzusammenhang mit möglicher theologischer Resonanz
  choice: Gericht
  alternative: Entscheidung; entscheidende Stunde
  rationale: Der unmittelbare Bezug gilt dem bevorstehenden Ausgang der Schlacht. Zugleich lässt κρίσις die Vorstellung eines Gerichts anklingen. „Gericht“ bewahrt diese Spannung; die Fußnote nennt die ebenfalls möglichen kontextuellen Bedeutungen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die lange griechische Partizipialkonstruktion bleibt als ein spannungsreicher, auf den Folgesatz zulaufender Satz erhalten. Militärische Begriffe sind verständlich, ohne die Bildsprache oder Mehrdeutigkeit des Ausgangstextes unnötig einzuebnen.
