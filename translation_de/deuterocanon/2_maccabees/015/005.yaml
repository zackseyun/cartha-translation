  naturalness: Der Text ist flüssiges modernes Standarddeutsch mit einem angemessen würdevollen Erzählton. »Königliche Aufgaben zu erfüllen« ist ebenso natürlich und bildet die Weite des griechischen Ausdrucks genauer ab.
