base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/015/005.yaml
  text: But the other said[a], “I also am a ruler upon the earth[b], the one who commands men to take up arms and to carry out the king’s business.” Yet he did not prevail to accomplish his savage purpose.
translation:
  language: de
  text: 'Der andere aber sagte: »Auch ich bin ein Herrscher auf Erden. Ich befehle, die Waffen zu ergreifen[a] und königliche Aufgaben zu erfüllen.« Dennoch gelang es ihm nicht, seinen grausamen Plan[b] zu verwirklichen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »die Waffen anzuheben«; die Wendung bezeichnet militärisches Handeln.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: »sein brutales Vorhaben« oder »sein ungeheuerlicher Entschluss«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δυνάστης
  choice: Herrscher
  rationale: Das Wort bezeichnet einen Machthaber. »Herrscher« gibt den Machtanspruch natürlich wieder, ohne den Sprecher ausdrücklich zum König zu machen.
- source_word: προστατάσσων
  choice: Ich befehle
  rationale: Das Partizip beschreibt den Sprecher als jemanden, der mit Autorität Befehle erteilt. Die finite Form ergibt im Deutschen eine klare und natürliche direkte Rede.
- source_word: αἴρειν τὰ ὅπλα
  choice: die Waffen zu ergreifen
  rationale: Die Wendung bezeichnet militärisches Handeln. »Die Waffen ergreifen« bewahrt das Bild des Griechischen und ist im Deutschen idiomatisch.
- source_word: τὰς βασιλικὰς χρείας ἐπιτελεῖν
  choice: die Aufträge des Königs auszuführen
  rationale: χρείας kann Angelegenheiten, Erfordernisse oder Dienste bezeichnen; mit βασιλικάς geht es um Aufgaben im königlichen Auftrag. Die gewählte Formulierung ist konkret, ohne den Inhalt dieser Aufträge enger festzulegen.
- source_word: ὅμως
  choice: Dennoch
  rationale: Das Wort markiert den scharfen Gegensatz zwischen dem vorgetragenen Machtanspruch und dem anschließenden Scheitern.
- source_word: οὐ κατέσχεν
  choice: es gelang ihm nicht
  rationale: Im Zusammenhang bezeichnet die Wendung das Unvermögen, die beabsichtigte Tat tatsächlich zu vollenden. Die Formulierung ist präzise und gegenwärtiges Standarddeutsch.
- source_word: σχέτλιον
  choice: grausamen
  rationale: Das stark abwertende Adjektiv kann etwas Grausames, Frevelhaftes oder Ungeheuerliches bezeichnen. »Grausam« bringt die Brutalität der Absicht verständlich zum Ausdruck.
- source_word: βούλημα
  choice: Plan
  rationale: Das Substantiv bezeichnet eine bewusste Absicht oder einen gefassten Willen. »Plan« passt zur beabsichtigten Tat und klingt im Deutschen natürlicher als eine wörtliche Wiedergabe mit »Wille«.
theological_decisions:
- issue: Selbstbezeichnung des Sprechers als irdischer Machthaber im visionären Zusammenhang
  choice: »Auch ich bin ein Herrscher auf Erden« wird ohne nähere Identifizierung oder Deutung wiedergegeben.
  alternative: »Auch ich bin ein König auf Erden« oder »Auch ich übe auf Erden Macht aus«
  rationale: Der griechische Text gibt den Machtanspruch des Sprechers wieder, nennt ihn aber nicht ausdrücklich König. Die zurückhaltende Übersetzung bewahrt die erzählerische und theologische Spannung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede wurde zur besseren Lesbarkeit in zwei Sätze gegliedert. Die Fußnotenmarker stehen unmittelbar bei den jeweils erläuterten Wendungen.
