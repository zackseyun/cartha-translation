  terminology: „Der Allmächtige“ ist die etablierte deutsche Wiedergabe des göttlichen Titels. „Gotteslästerer“ ist angesichts des Tempelkontexts angemessen; die Fußnote bewahrt die allgemeinere Bedeutung „Schmäher“. „Verrucht“ gibt die pejorativ-religiöse Wertung von μιερός idiomatisch wieder, während die Alternative „befleckt“ die lexikalische Spannweite dokumentiert.
