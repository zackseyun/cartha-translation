  verdict: revise
  source_fidelity: 'Die Satzstruktur als zum folgenden Vers hin offene Partizipialkonstruktion ist zutreffend. Die Wiedergabe von μιερός mit „verrucht“, δυσφήμος mit „Gotteslästerer“, ἐπί mit Akkusativ als „gegen“ sowie παντοκράτωρ als „der Allmächtige“ ist im Kontext vertretbar. Allerdings fügt „während“ eine ausdrückliche Gleichzeitigkeit hinzu, die das Griechische nicht festlegt: Der Aoristpartizip ἐκτείνας ordnet das Ausstrecken der Hand dem Prahlen als vorausgehend bzw. begleitend unter, ohne diese zeitliche Nuance näher zu bestimmen. Auch „öffentlich“ ist als mögliche Konnotation von ἐπιδείκνυμι denkbar, aber nicht erforderlich und sollte bei einer engen Übersetzung nicht explizit ergänzt werden.'
