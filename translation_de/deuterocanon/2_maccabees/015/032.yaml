  text: And after displaying the head of the accursed Nikanor and the hand of that blasphemer[a], which he had stretched out against the holy house of the Almighty and boasted greatly[b],
translation:
  language: de
  text: Und nachdem er den Kopf des verruchten Nikanor[a] und die Hand dieses Gotteslästerers[b] gezeigt hatte – die Hand, die er gegen das heilige Haus des Allmächtigen ausgestreckt und mit der er großspurig geprahlt hatte –,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „des befleckten Nikanor“. Das griechische Adjektiv ist ein scharfes Wort religiöser und moralischer Verurteilung.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „dieses Schmähers“. Das griechische Wort kann allgemein jemanden bezeichnen, der andere beschimpft oder verleumdet; „Gotteslästerer“ entspricht hier dem Zusammenhang des Angriffs auf den Tempel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιδειξάμενος
  choice: nachdem er … öffentlich gezeigt hatte
  rationale: Das aoristische Partizip bezeichnet hier eine der Handlung des folgenden Verses vorausgehende Handlung. „Öffentlich gezeigt“ gibt den demonstrativen Charakter von ἐπιδείκνυμι natürlich wieder.
- source_word: μιεροῦ
  choice: verruchten
  rationale: Das seltene Adjektiv ist ein scharfes religiös-moralisches Schimpfwort und kann „befleckt“, „unrein“ oder „verabscheuungswürdig“ bedeuten. Auf eine Person bezogen vermittelt „verrucht“ diese starke Verurteilung idiomatisch.
- source_word: δυσφήμου
  choice: Gotteslästerers
  rationale: Das Wort bezeichnet jemanden, der schmäht oder üble Worte führt. Wegen des unmittelbar folgenden Bezugs auf Gottes heiliges Haus ist die religiös zugespitzte Wiedergabe „Gotteslästerer“ kontextgemäß.
- source_word: ἐκτείνας
  choice: ausgestreckt hatte
  rationale: Die Form bezeichnet Nikanors vorausgegangene drohende Geste gegen den Tempel; das Plusquamperfekt macht die zeitliche Beziehung im Deutschen deutlich.
- source_word: ἐπὶ τὸν ἅγιον … οἶκον
  choice: gegen das heilige Haus
  rationale: ἐπί mit Akkusativ hat im feindseligen Kontext adversative Bedeutung. „Heiliges Haus“ bewahrt die griechische Tempelbezeichnung.
- source_word: παντοκράτορος
  choice: des Allmächtigen
  rationale: „Der Allmächtige“ ist die geläufige, würdevolle deutsche Wiedergabe dieses Gottestitels.
- source_word: ἐμεγαλαύχησεν
  choice: während er großspurig prahlte
  rationale: Das Verb bezeichnet großtuerisches, anmaßendes Prahlen. Die temporale Verbindung lässt erkennen, dass das Prahlen die drohende Geste begleitete, ohne den Inhalt des Prahlens zu ergänzen.
theological_decisions:
- issue: Wiedergabe des Gottestitels παντοκράτωρ
  choice: der Allmächtige
  alternative: der Allherrscher
  rationale: „Der Allmächtige“ ist im modernen Standarddeutsch verständlich und als ehrfürchtiger Gottestitel fest etabliert; der Titel wird übersetzt, nicht transliteriert.
- issue: Religiöse Zuspitzung von δύσφημος
  choice: Gotteslästerer
  alternative: Schmäher
  rationale: Das griechische Wort kann allgemein einen Schmäher bezeichnen. Der Angriff auf das heilige Haus des Allmächtigen gibt ihm hier jedoch ausdrücklich sakrilegischen Kontext; die allgemeinere Möglichkeit bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz bleibt wie im griechischen Ausgangstext syntaktisch zum folgenden Vers hin offen; Gedankenstriche gliedern den längeren Einschub, ohne die Abhängigkeit aufzulösen.
