revisions:
- from: Und nachdem er den Kopf des verruchten Nikanor[a] und die Hand dieses Gotteslästerers[b] öffentlich gezeigt hatte – jene Hand, die er gegen das heilige Haus des Allmächtigen ausgestreckt hatte, während er großspurig prahlte –,
  to: Und nachdem er den Kopf des verruchten Nikanor[a] und die Hand dieses Gotteslästerers[b] gezeigt hatte – die Hand, die er gegen das heilige Haus des Allmächtigen ausgestreckt und mit der er großspurig geprahlt hatte –,
  rationale: Die Revision streicht die nicht zwingend im griechischen Text ausgedrückte Angabe „öffentlich“ und ersetzt die zeitlich festlegende Konstruktion mit „während“ durch eine koordinierte Wiedergabe. „Mit der er großspurig geprahlt hatte“ macht im Deutschen klar, dass beide Handlungen Nikanor betreffen, ohne einen bestimmten zeitlichen Ablauf über das hinaus festzulegen, was die griechische Partizipialkonstruktion nahelegt. Die Fußnoten bleiben inhaltlich korrekt und ihre Anker stehen weiterhin unmittelbar bei den jeweiligen Begriffen.
