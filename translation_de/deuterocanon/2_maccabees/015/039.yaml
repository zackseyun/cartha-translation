  text: And if it is well written and suitably arranged[a], that is what I myself wanted; but if it is poorly and moderately done, this was what I could achieve.
translation:
  language: de
  text: Wenn es gut und der Anlage nach angemessen gelungen ist, dann war es auch mein eigener Wunsch; wenn es aber dürftig und mittelmäßig ausgefallen ist[a], dann war dies das, was mir möglich war.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wenn es aber schlicht und nur mäßig ausgefallen ist“. Die beiden griechischen Adverbien können eine dürftige oder lediglich durchschnittliche literarische Ausführung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καλῶς
  choice: gut
  rationale: Das Adverb bewertet im Zusammenhang des Schlussworts die literarische Ausführung; „gut“ gibt dies knapp und ohne unnötige Ergänzung wieder.
- source_word: εὐθίκτως τῇ συντάξει
  choice: in seiner Gestaltung gelungen
  rationale: Die seltene adverbiale Wendung bezeichnet wahrscheinlich die angemessene Anlage oder Komposition des Werkes. Die deutsche Fassung verbindet treffende Gestaltung und gelungenes Ergebnis in natürlicher Form.
- source_word: τοῦτο καὶ αὐτὸς ἤθελον
  choice: so wollte ich selbst es genau so
  rationale: Die Formulierung bewahrt den Nachdruck von καὶ αὐτός und gibt ἤθελον als schlichte Aussage über die eigene Absicht wieder.
- source_word: εὐτελῶς
  choice: dürftig
  rationale: Im Gegensatz zu καλῶς bezeichnet das Wort hier eine geringe literarische Qualität. „Dürftig“ ist wertend, ohne den möglichen Sinn von schlichter oder anspruchsloser Ausführung völlig auszuschließen.
- source_word: μετρίως
  choice: mittelmäßig
  rationale: Das Adverb bezeichnet hier wahrscheinlich ein nur mäßiges, durchschnittliches Ergebnis und verstärkt zusammen mit εὐτελῶς die bescheidene Selbsteinschätzung.
- source_word: ἐφικτὸν ἦν μοι
  choice: so war mir eben nur dies möglich
  rationale: Die Wendung drückt die Grenze des eigenen Könnens aus. „Eben nur“ macht diese bescheidene Einschränkung im Deutschen deutlich, ohne eine Ursache hinzuzufügen.
