base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/015/030.yaml
  text: And he ordered that the head of Nikanor[a], and the hand with the shoulder, be cut off and carried to Jerusalem—he who with his whole body and soul had fought in the forefront for the citizens, and who had preserved from youth his goodwill toward his fellow countrymen.
translation:
  language: de
  text: Und er befahl, Nikanors Kopf und die Hand samt der Schulter[a] abzuschlagen und nach Jerusalem zu bringen – er, der mit Leib und Seele an vorderster Stelle für die Bürger gekämpft und sich von Jugend an sein Wohlwollen gegenüber seinen Volksgenossen bewahrt hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den Arm samt der Schulter“. Wörtlich steht im Griechischen „die Hand samt der Schulter“; gemeint ist wahrscheinlich die abgetrennte obere Gliedmaße.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσέταξεν
  choice: er befahl
  rationale: Das Verb bezeichnet das Erteilen eines verbindlichen Befehls; „befahl“ ist knapp, natürlich und wahrt die autoritative Kraft.
- source_word: ὁ καθʼ ὅλον σώματι καὶ ψυχῇ πρωταγωνιστὴς
  choice: er, der mit Leib und Seele an vorderster Stelle … gekämpft
  rationale: „Mit Leib und Seele“ bewahrt die konkrete Zweigliedrigkeit, während „an vorderster Stelle gekämpft“ die führende Rolle des πρωταγωνιστής verständlich wiedergibt.
- source_word: ὑπὲρ τῶν πολιτῶν
  choice: für die Bürger
  rationale: πολῖται trägt eine bürgerlich-gemeinschaftliche Bedeutung; „Bürger“ erhält diese Nuance, ohne sie zu ethnischer Verwandtschaft umzudeuten.
- source_word: τὴν τῆς ἡλικίας εὔνοιαν
  choice: von Jugend an sein Wohlwollen
  rationale: Im Zusammenhang bezeichnet τῆς ἡλικίας die über die Lebenszeit, besonders seit der Jugend, bewahrte wohlwollende Haltung. Die Formulierung ist idiomatisch, ohne die zeitliche Dauer zu verlieren.
- source_word: ὁμοεθνεῖς
  choice: Volksgenossen
  rationale: Das Wort bezeichnet Angehörige desselben Volkes. „Volksgenossen“ ist hier präziser als „Mitbürger“, da die ethnisch-nationale Zusammengehörigkeit im Vordergrund steht.
- source_word: διαφυλάξας
  choice: sich … bewahrt hatte
  rationale: Das Verb betont dauerhaftes Bewahren; die reflexive deutsche Wendung gibt das Festhalten an einer Haltung natürlich wieder.
- source_word: ἀποτεμόντας
  choice: abzuschlagen
  rationale: Das Akkusativpartizip hängt vom Befehlsverb ab und bezeichnet den Inhalt des Befehls; der deutsche Infinitiv bildet diese Konstruktion idiomatisch ab.
- source_word: τὴν χεῖρα σὺν τῷ ὤμῳ
  choice: die Hand samt der Schulter
  rationale: Die Übersetzung folgt der ungewöhnlichen griechischen Formulierung wörtlich; wahrscheinlich ist die ganze obere Gliedmaße einschließlich der Schulter gemeint, was die Fußnote erläutert.
- source_word: περιφέρειν εἰς Ἰερουσαλήμ
  choice: nach Jerusalem zu bringen
  rationale: Mit εἰς bezeichnet die Wendung die Bewegung nach Jerusalem. „Bringen“ vermeidet die unbegründete Festlegung auf ein Umhertragen oder eine förmliche Parade.
theological_decisions:
- issue: Bezug der beiden appositionellen Beschreibungen
  choice: Die Beschreibungen beziehen sich auf Judas, das unausgesprochene Subjekt von „er befahl“.
  alternative: Die Beschreibungen könnten als freier, vom Erzähler eingeschobener Lobpreis gelesen werden.
  rationale: Die wiederholten griechischen Artikel ὁ … ὁ kennzeichnen Appositionen zum handelnden Subjekt. Der Gedankenstrich erhält den lobenden Einschub, ohne Judas im Vers ausdrücklich zu benennen.
- issue: Anthropologische Wendung σώματι καὶ ψυχῇ
  choice: „mit Leib und Seele“
  alternative: „mit seinem ganzen Wesen“
  rationale: Die konkrete griechische Zweigliedrigkeit bleibt erhalten, ohne daraus eine weitergehende Lehre über das Verhältnis von Leib und Seele abzuleiten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der lange griechische Satz bleibt in seiner rhetorischen Struktur erkennbar; ein Gedankenstrich hebt die appositionelle Würdigung des Judas ab. Die Gewaltbeschreibung wird sachlich und ohne abschwächende Umschreibung wiedergegeben.
