  source_fidelity: Die Übersetzung gibt die Befehlsstruktur von προσέταξεν mit den abhängigen Infinitiven treffend wieder. „mit Leib und Seele“, „an vorderster Stelle gekämpft“, „für die Bürger“ und „Volksgenossen“ bewahren die Aussage und die Registerebenen des Griechischen. „nach Jerusalem zu bringen“ ist für περιφέρειν εἰς Ἰερουσαλήμ eine zurückhaltende, kontextgerechte Wiedergabe, ohne einen öffentlichen Umzug ausdrücklich hineinzulesen.
  naturalness: Der Satz ist trotz seiner bewusst erhaltenen rhetorischen Länge gut verständliches modernes Standarddeutsch. Der Gedankenstrich markiert den griechischen lobenden Einschub angemessen. „Hand samt der Schulter“ ist absichtlich ungewöhnlich, aber durch die Fußnote hinreichend abgesichert.
  terminology: „Leib und Seele“ wahrt die bildhafte Zweigliedrigkeit ohne systematische Lehrimplikationen. „Bürger“ erhält den zivilen Charakter von πολιτῶν, während „Volksgenossen“ die andere, ethnisch-nationale Bezugsgruppe von ὁμοεθνεῖς sachgerecht unterscheidet. Die Fußnote behandelt χεῖρα σὺν τῷ ὤμῳ transparent und ohne übermäßige Festlegung.
