  yaml_path: translation/deuterocanon/2_maccabees/015/023.yaml
  text: And now[a], O Sovereign of the heavens, send a good angel before us for fear and trembling.
translation:
  language: de
  text: Und nun, Herrscher der Himmel, sende einen guten Engel vor uns her, um Furcht und Zittern auszulösen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „zu Furcht und Zittern“. Der griechische Text sagt nicht ausdrücklich, wen Furcht und Zittern erfassen sollen; dem Zusammenhang nach sind wohl die Feinde gemeint.'
    reason: Die Fußnote dokumentiert sowohl die formnähere Wiedergabe von εἰς als auch die im Ausgangstext bestehende Unbestimmtheit des Bezugs.
lexical_decisions:
- source_word: δυνάστα
  choice: Herrscher
  rationale: Der Vokativ von δυνάστης bezeichnet einen, der Macht und Herrschaft ausübt. „Herrscher“ wahrt die feierliche Gebetsanrede, ohne die im heutigen Deutsch oft negative Färbung von „Machthaber“ einzutragen.
- source_word: τῶν οὐρανῶν
  choice: der Himmel
  rationale: Der griechische Plural wird mit dem im biblischen Deutsch geläufigen Plural „die Himmel“ wiedergegeben; im Genitiv lautet die Form „der Himmel“.
- source_word: ἀπόστειλον
  choice: sende
  rationale: Der Aoristimperativ formuliert eine unmittelbare Bitte. „Sende“ gibt ihn natürlich und in einem würdigen Gebetsregister wieder.
- source_word: ἄγγελον ἀγαθὸν
  choice: einen guten Engel
  rationale: Im militärischen Gebetskontext ist ἄγγελος als himmlischer Engel zu verstehen. ἀγαθός wird ohne zusätzliche Deutung schlicht mit „gut“ wiedergegeben.
- source_word: ἔμπροσθεν ἡμῶν
  choice: vor uns her
  rationale: Die Wendung bezeichnet, dass der Engel den Betenden beziehungsweise ihrem Heer vorausgehen soll. „Vor uns her“ ist gegenwärtiges, natürliches Deutsch und wahrt die räumliche Bedeutung.
- source_word: εἰς δέος καὶ τρόμον
  choice: um Furcht und Zittern auszulösen
  rationale: εἰς bezeichnet hier wahrscheinlich den beabsichtigten Erfolg. Die Formulierung macht diesen Ergebnissinn idiomatisch deutlich, nennt aber kein betroffenes Gegenüber und bewahrt damit die Unbestimmtheit des griechischen Textes.
theological_decisions:
- issue: Wessen Furcht und Zittern gemeint sind
  choice: Kein Betroffener wird ausdrücklich genannt; der Engel soll Furcht und Zittern auslösen.
  alternative: „zu Furcht und Zittern“ oder eine ausdrückliche Ergänzung wie „bei den Feinden“
  rationale: Der militärische Zusammenhang legt als Betroffene die Gegner nahe, doch der griechische Satz nennt sie nicht. Die Übersetzung wahrt diese Offenheit und vermeidet zugleich die im Deutschen missverständliche Formulierung „zu Furcht und Zittern“.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit biblisch-feierlicher Gebetsanrede. „Vor uns her“ sorgt für natürliche Verständlichkeit; „Herrscher der Himmel“ bewahrt den gehobenen Klang und den griechischen Plural.
