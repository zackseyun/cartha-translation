  text: having heard that the Jews did not approve of their father's change to Greek ways[a], but were choosing their own way of life and requesting that their own laws be permitted to them[b],
translation:
  language: de
  text: Nachdem sie gehört hatten, dass die Juden der Hinwendung des Vaters zu griechischen Lebensweisen[a] nicht zustimmten, sondern ihre eigene Lebensweise bevorzugten und darum baten, dass ihnen ihre gesetzlichen Bräuche gestattet würden[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich knapp: »der Hinwendung des Vaters zu den griechischen Dingen«. Gemeint sind griechische kulturelle Lebensformen und Bräuche. Im Griechischen steht bei »Vater« kein ausdrückliches Possessivpronomen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »dass ihnen die gesetzlichen Ordnungen gestattet würden« oder »dass ihnen ihre Satzungen zugestanden würden«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκηκοότες
  choice: Nachdem sie gehört hatten
  rationale: Das Perfektpartizip bezeichnet eine vorausgehende Wahrnehmung und bleibt als einleitende, an den Kontext anschließende Umstandsangabe erkennbar.
- source_word: μὴ συνεὐδοκοῦντας
  choice: nicht zustimmten
  rationale: συνευδοκέω bezeichnet Zustimmung oder Billigung; „nicht zustimmten“ ist hier präzise und idiomatisch.
- source_word: τῇ τοῦ πατρὸς εἰς τὰ Ἑλληνικὰ μεταθέσει
  choice: der vom Vater vorgenommenen Umstellung auf griechische Lebensweisen
  rationale: μετάθεσις bezeichnet eine Veränderung oder Umstellung; εἰς τὰ Ἑλληνικά verweist auf griechische kulturelle und gesellschaftliche Lebensformen, nicht lediglich auf die Sprache. Die Formulierung gibt den Vater als Urheber der Umstellung wieder, ohne ein im Griechischen nicht ausdrücklich gesetztes Possessivpronomen einzufügen.
- source_word: τὴν ἑαυτῶν ἀγωγὴν αἱρετίζοντας
  choice: ihre eigene Lebensweise bevorzugten
  rationale: ἀγωγή bezeichnet Lebensführung oder Lebensweise, αἱρετίζω das Wählen beziehungsweise Vorziehen; „bevorzugten“ bringt den Gegensatz zu der griechischen Lebensweise natürlich zum Ausdruck.
- source_word: ἀξιοῦν
  choice: darum baten
  rationale: In diesem Zusammenhang bezeichnet ἀξιόω eine Bitte oder Forderung. „Baten“ vermeidet eine unbegründete Festlegung auf den stärkeren Sinn „forderten“.
- source_word: συγχωρηθῆναι αὐτοῖς τὰ νόμιμα
  choice: ihnen die Ausübung ihrer überlieferten Ordnungen zu gestatten
  rationale: τὰ νόμιμα umfasst geltende Satzungen, Gebräuche und religiös-rechtliche Ordnungen. Die Ausübung zu gestatten gibt den Sinn der erbetenen Erlaubnis idiomatisch wieder, ohne den Ausdruck auf bloß schriftlich kodifizierte Gesetze zu verengen.
theological_decisions:
- issue: Kulturelle Tragweite von εἰς τὰ Ἑλληνικά
  choice: auf griechische Lebensweisen
  alternative: zum Griechentum / auf griechische Bräuche
  rationale: Der Ausdruck betrifft griechische kulturelle Praxis in Abgrenzung zur jüdischen Lebensordnung. „Griechische Lebensweisen“ ist verständlich und breit genug, ohne den technischeren Begriff „Hellenismus“ in den Text einzutragen.
- issue: Bedeutungsumfang von τὰ νόμιμα
  choice: ihre überlieferten Ordnungen
  alternative: ihre Gesetze / ihre gesetzlichen Bräuche
  rationale: Der griechische Ausdruck kann sowohl rechtliche Satzungen als auch verbindliche Gebräuche bezeichnen. „Überlieferte Ordnungen“ wahrt diese Breite und den jüdischen Lebenszusammenhang, ohne ihn auf kodifiziertes Recht zu beschränken.
- issue: Bezug von τοῦ πατρός
  choice: vom Vater
  alternative: von ihrem Vater / von unserem Vater
  rationale: Im griechischen Wortlaut steht nur der bestimmte Artikel, kein ausdrückliches Possessivpronomen. Daher wird weder „ihr“ noch „unser“ stillschweigend festgelegt.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die Satzform bleibt als partizipial eingeleiteter Anschluss an den umgebenden Satz erkennbar; deshalb endet der Vers mit einem Komma. Die beiden Fußnoten sichern die komprimierten und mehrdeutigen Ausdrücke des griechischen Textes ab.
