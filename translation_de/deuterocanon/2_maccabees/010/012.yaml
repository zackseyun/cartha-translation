  text: But most of them escaped wounded and naked[a]; and Lysias himself also escaped by fleeing shamefully.
translation:
  language: de
  text: Die meisten von ihnen entkamen jedoch verwundet und nackt[a]; auch Lysias selbst konnte sich durch eine schmachvolle Flucht retten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „entblößt“; möglicherweise flohen sie, nachdem sie im Kampf ihre Ausrüstung oder Oberkleidung verloren hatten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ πλείονες
  choice: die meisten von ihnen
  rationale: Die substantivisch gebrauchte Komparativform bezeichnet den größeren Teil beziehungsweise die Mehrheit; diese Wiedergabe ist im modernen Deutsch natürlich.
- source_word: τραυματίαι
  choice: verwundet
  rationale: Das Wort bezeichnet Verwundete. Als prädikative Zustandsangabe zu „entkamen“ ist „verwundet“ knapp und idiomatisch.
- source_word: γυμνοὶ
  choice: nackt
  rationale: Die direkte Bedeutung ist „nackt“ oder „entblößt“. Eine Deutung als Verlust von Rüstung oder Oberkleidung ist möglich, wird aber nicht in den Haupttext eingetragen.
- source_word: διεσώθησαν
  choice: entkamen
  rationale: Im militärischen Erzählzusammenhang bezeichnet das Verb, dass sie heil beziehungsweise lebend davonkamen; „entkamen“ gibt dies natürlich wieder.
- source_word: αἰσχρῶς
  choice: schmachvoll
  rationale: Das Adverb bewertet die Flucht als beschämend oder unehrenhaft; „schmachvoll“ bewahrt diese wertende Aussage in würdigem Deutsch.
- source_word: φεύγων
  choice: durch eine … Flucht
  rationale: Das gleichzeitige Partizip kann Umstand oder Mittel des Entkommens ausdrücken. Die nominale Wendung ergibt zusammen mit dem Adverb einen natürlichen deutschen Satz.
- source_word: διεσώθη
  choice: konnte sich … retten
  rationale: Die Wiedergabe bezeichnet hier das Davonkommen aus der Niederlage und vermeidet die im Deutschen mögliche religiöse Nebenbedeutung von „wurde gerettet“.
