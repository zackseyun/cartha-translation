  text: and to make the sanctuary taxable[a], like the other shrines of the nations, and to make the high priesthood sold each year[c][b];
translation:
  language: de
  text: und das Heiligtum abgabenpflichtig zu machen[a], wie die übrigen Tempelbezirke der Völker, und das Hohepriesteramt jedes Jahr zum Verkauf zu stellen[b][c];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »tributpflichtig«. Das griechische Adjektiv bezeichnet eine finanzielle Veranlagung oder Abgabenpflicht.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: »das Hohepriesteramt jedes Jahr käuflich zu machen«. Gemeint ist, dass das Amt jährlich zum Verkauf stehen sollte.'
    reason: lexical_alternative
  - marker: c
    text: Der erhaltene griechische Wortlaut ist hier syntaktisch stark zusammengedrängt; die Übersetzung macht die beiden beschriebenen Maßnahmen im Deutschen ausdrücklich.
    reason: textual_or_syntactic_note
lexical_decisions:
- source_word: ἱερόν
  choice: Heiligtum
  rationale: Der Ausdruck bezeichnet hier den Jerusalemer Tempelbezirk. »Heiligtum« bewahrt den sakralen Sinn und ist weiter als nur das Tempelgebäude.
- source_word: ἀργυρολόγητον
  choice: abgabenpflichtig
  rationale: Das seltene Adjektiv bezeichnet eine finanzielle Veranlagung beziehungsweise Abgaben- oder Tributpflicht. »Abgabenpflichtig« ist verständlich und legt die genaue Verwaltungsform nicht unnötig fest.
- source_word: τεμένη
  choice: Tempelbezirke
  rationale: τέμενος bezeichnet einen abgegrenzten heiligen Bezirk. »Tempelbezirke« gibt den räumlich-kultischen Sinn wieder und wahrt die Verschiedenheit zum zuvor gebrauchten ἱερόν.
- source_word: ἐθνῶν
  choice: der Völker
  rationale: Dies entspricht dem wörtlichen Sinn; im Kontext sind die nichtjüdischen Völker gemeint, ohne dass die Übersetzung eine zusätzliche wertende Bezeichnung einführt.
- source_word: πρατήν
  choice: zum Verkauf zu stellen
  rationale: Das Adjektiv bedeutet »verkäuflich, zum Verkauf stehend«. Die verbale Formulierung macht im Deutschen klar, dass das Hohepriesteramt jährlich verkauft werden sollte.
- source_word: ἀρχιερωσύνην
  choice: das Hohepriesteramt
  rationale: Gemeint ist das Amt beziehungsweise die Würde des Hohenpriesters. »Hohepriesteramt« ist im modernen Deutsch klarer als das abstraktere »Hohepriestertum«.
- source_word: ποιήσειν
  choice: zu machen / zu stellen
  rationale: Der Infinitiv regiert die beiden komprimiert formulierten Maßnahmen. Im Deutschen wird er beim ersten Glied mit »zu machen« und beim zweiten idiomatisch mit »zu stellen« wiedergegeben.
theological_decisions:
- issue: Bezeichnung des Jerusalemer Heiligtums gegenüber den heiligen Stätten der Völker
  choice: ἱερόν mit »Heiligtum«, τεμένη mit »Tempelbezirke« wiedergeben
  alternative: Beide Ausdrücke einheitlich mit »Tempel« oder »Heiligtümer« wiedergeben
  rationale: Die unterschiedlichen griechischen Begriffe bleiben erkennbar, ohne daraus einen stärkeren theologischen Gegensatz abzuleiten, als der Text selbst ausdrückt.
- issue: Kommerzialisierung des Hohepriesteramts
  choice: »das Hohepriesteramt jedes Jahr zum Verkauf zu stellen«
  alternative: »das Hohepriesteramt jedes Jahr käuflich zu machen«
  rationale: Die gewählte Formulierung bringt die konkrete jährliche Veräußerung des Amtes zum Ausdruck, ohne zu bestimmen, an wen oder nach welchem Verfahren es verkauft wurde.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung bleibt als Satzteil offen und behält das abschließende Semikolon, da der griechische Ausgangstext hier ein syntaktisch komprimiertes Satzglied bietet.
