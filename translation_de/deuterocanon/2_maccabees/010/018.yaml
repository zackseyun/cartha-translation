  text: So then[a], I have made clear whatever had to be presented to the king, and he granted what was possible.
translation:
  language: de
  text: Was nun dem König vorgelegt werden musste, habe ich dargelegt[a]; und was möglich war, gewährte er.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der griechische Wortlaut wirkt hier wie ein redaktioneller oder brieflicher Abschluss in der ersten Person („habe ich dargelegt“) und steht im Zusammenhang unvermittelt. Die Übersetzung folgt dem bei Swete überlieferten Text.
    reason: textual_variant
lexical_decisions:
- source_word: ὅσα μὲν οὖν
  choice: Was nun
  rationale: Die Formulierung bewahrt den zusammenfassenden Übergang und leitet zugleich den ersten Teil der μὲν-δέ-Gegenüberstellung natürlich ein.
- source_word: ἔδει
  choice: musste
  rationale: Der Imperfekt von δεῖ bezeichnet hier eine aus der Vergangenheit betrachtete Notwendigkeit.
- source_word: τῷ βασιλεῖ
  choice: dem König
  rationale: Der Dativ bezeichnet bei προσενεχθῆναι den Adressaten dessen, was vorgelegt wird.
- source_word: προσενεχθῆναι
  choice: vorgelegt werden
  rationale: Der passive Infinitiv bezeichnet in diesem formellen Zusammenhang das Vorbringen beziehungsweise Unterbreiten einer Angelegenheit vor dem König.
- source_word: διεσάφησα
  choice: habe ich dargelegt
  rationale: Das Verb meint, etwas deutlich zu erklären oder klar darzulegen; die deutsche Perfektform gibt die abgeschlossene Aussage idiomatisch wieder.
- source_word: ἃ δὲ ἦν ἐνδεχόμενα
  choice: was möglich war
  rationale: Die substantivierte neutrale Relativkonstruktion bezeichnet kollektiv das, was möglich oder durchführbar war.
- source_word: συνεχώρησεν
  choice: gewährte er
  rationale: Das Verb kann erlauben, zugestehen oder gewähren bedeuten; im Zusammenhang einer königlichen Entscheidung passt „gewähren“, ohne den Gegenstand näher festzulegen.
