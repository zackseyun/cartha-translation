lexical_decisions:
- source_word: Ἐπέμψαν δὲ καὶ οἱ Ῥωμαῖοι
  choice: Auch die Römer sandten
  rationale: Die Wiedergabe bewahrt die kollektive Bezeichnung »die Römer« und gibt δὲ καί im Zusammenhang natürlich mit »auch« wieder, ohne eine ausdrücklich nicht genannte Behörde einzuführen.
- source_word: πρὸς αὐτοὺς ἐπιστολήν
  choice: ihnen einen Brief
  rationale: Die deutsche Konstruktion mit Dativ ist idiomatisch und entspricht dem Sinn von πρὸς αὐτούς; ἐπιστολή bezeichnet schlicht einen Brief.
- source_word: ἔχουσαν οὕτως
  choice: mit folgendem Wortlaut
  rationale: Die Formel leitet den Inhalt des Schreibens ein. Diese deutsche Wendung ist natürlich, würdevoll und funktional genau.
- source_word: Κόιντος Μέμμιος, Τίτος Μάνιος
  choice: Quintus Memmius und Titus Manius
  rationale: Die Namen werden nach geläufigen lateinisch-deutschen Namensformen wiedergegeben; das im Griechischen unverbundene Nebeneinander wird für flüssiges Deutsch mit »und« verbunden.
- source_word: πρεσβυταὶ Ῥωμαίων
  choice: Älteste der Römer
  rationale: πρεσβυταί bedeutet im vorgelegten griechischen Wortlaut wörtlich »Älteste«. Eine speziellere Amtsbezeichnung wie »Gesandte« oder »Senatoren« wäre kontextuell möglich, steht aber nicht eindeutig im gegebenen Text.
- source_word: τῷ δήμῳ τῶν Ἰουδαίων
  choice: das Volk der Juden
  rationale: δῆμος bezeichnet das Volk beziehungsweise die politische Bürgerschaft. Die Formulierung bleibt nah an der griechischen Struktur, ist aber noch gut verständlich.
- source_word: χαίρειν
  choice: grüßen
  rationale: Der Infinitiv ist die übliche griechische Briefformel. In die deutsche Absender-Empfänger-Konstruktion ist »grüßen« natürlicher eingebunden als das isolierte Substantiv »Grüße«.
