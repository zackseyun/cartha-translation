  text: 'The Romans also sent them a letter[a], worded as follows: “Quintus Memmius and Titus Manius, elders of the Romans, to the people of the Jews[b], greetings.”'
translation:
  language: de
  text: 'Auch die Römer sandten ihnen einen Brief mit folgendem Wortlaut: »Quintus Memmius und Titus Manius, Älteste[a] der Römer, grüßen das Volk der Juden[b].«[c]'
