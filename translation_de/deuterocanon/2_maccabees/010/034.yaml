  register: Modernes, gut verständliches Standarddeutsch mit dem würdevollen Ton eines amtlichen Briefes. Die eigentümliche Amtsbezeichnung und die korporative Empfängerformel werden nicht vorschnell vereindeutigt. Wegen der als »major_mismatch« gekennzeichneten Referenzabweichung wird die verbreitete Verszählung transparent in einer Fußnote genannt.
