lexical_decisions:
- source_word: ἔρρωσθε
  choice: Lebt wohl
  rationale: Der pluralische Imperativ von ῥώννυμι bedeutet wörtlich etwa »seid stark« oder »bleibt gesund«, dient am Briefschluss jedoch als übliche Abschiedsformel. »Lebt wohl« gibt diese Funktion in natürlichem Deutsch wieder.
- source_word: ἔτους
  choice: im … Jahr
  rationale: Der Genitiv gehört zu einer Datierungsformel; im Deutschen wird sie idiomatisch mit »im … Jahr« wiedergegeben.
- source_word: ἑκατοστοῦ τεσσερακοστοῦ ὀγδόου
  choice: '148.'
  rationale: Die griechischen Ordinalzahlen bezeichnen das hundertachtundvierzigste Jahr. Die Ziffernschreibung ist in einer Datumsangabe klar und natürlich.
- source_word: Ξανθικοῦ
  choice: Xanthikos
  rationale: Der makedonische Monatsname wird gemäß seiner griechischen Form ins Deutsche transliteriert und nicht übersetzt.
- source_word: πεντεκαιδεκάτῃ
  choice: am fünfzehnten Tag
  rationale: Der Dativ bezeichnet in der Datierungsformel den Tag des Monats. Die Präposition und »Tag« werden für klares, idiomatisches Deutsch ergänzt.
