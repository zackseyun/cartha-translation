  text: Lebt wohl.[a] Im 148. Jahr, am fünfzehnten Tag des Monats Xanthikos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort ἔρρωσθε bedeutet wörtlich etwa »Seid stark« oder »Bleibt gesund«, wird am Ende eines Briefes aber als übliche Abschiedsformel gebraucht.
