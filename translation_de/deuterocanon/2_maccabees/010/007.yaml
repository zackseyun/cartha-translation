base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/010/007.yaml
  text: But Maccabeus himself was the first to take up arms[a], and he urged the others, by risking danger together with him, to come to the aid of their brothers[b]; and together they also charged out eagerly.
translation:
  language: de
  text: Makkabäus selbst aber griff als Erster zu den Waffen. Er rief die anderen dazu auf, sich gemeinsam mit ihm in Gefahr zu begeben[a] und ihren Brüdern[b] zu Hilfe zu kommen. Da stürmten sie alle gemeinsam voller Eifer los.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „gemeinsam mit ihm das Wagnis einzugehen“. Das griechische Partizip bezieht sich auf die anderen und betont, dass sie sich zusammen mit Makkabäus der Gefahr aussetzen sollten.'
    reason: lexical_alternative
  - marker: b
    text: Mit „Brüdern“ können hier auch ihre jüdischen Volksgenossen oder Landsleute gemeint sein.
    reason: lexical_alternative
lexical_decisions:
- source_word: πρῶτος
  choice: als Erster
  rationale: Die prädikative Stellung hebt hervor, dass Makkabäus die Führung übernahm und den anderen voranging.
- source_word: ἀναλαβὼν τὰ ὅπλα
  choice: griff zu den Waffen
  rationale: Die deutsche Wendung gibt das griechische Bild idiomatisch und zugleich nah am Wortlaut wieder.
- source_word: προετρέψατο
  choice: rief ... dazu auf
  rationale: Das Verb bezeichnet einen nachdrücklichen Ansporn zum Handeln; die gewählte Form ist natürlich und wahrt die militärische Dringlichkeit.
- source_word: ἅμα αὐτῷ διακινδυνεύοντας
  choice: sich gemeinsam mit ihm in Gefahr zu begeben
  rationale: Die Formulierung bewahrt sowohl das gemeinsame Wagnis als auch den Bezug der Partizipialkonstruktion auf die anderen.
- source_word: ἐπιβοηθεῖν
  choice: zu Hilfe zu kommen
  rationale: Das Kompositum bezeichnet das Herbeieilen zur Unterstützung und ist stärker als ein bloßes „helfen“.
- source_word: τοῖς ἀδελφοῖς αὐτῶν
  choice: ihren Brüdern
  rationale: Dies entspricht der maskulinen griechischen Pluralform und lässt die kontextuelle Bedeutung als jüdische Volks- oder Glaubensgenossen offen.
- source_word: ὁμοῦ δὲ καὶ προθύμως
  choice: alle gemeinsam voller Eifer
  rationale: „Gemeinsam“ gibt ὁμοῦ wieder; „voller Eifer“ erfasst die Bereitwilligkeit und Entschlossenheit von προθύμως.
- source_word: ἐξώρμησαν
  choice: stürmten ... los
  rationale: Das Verb bezeichnet ein kraftvolles Aufbrechen beziehungsweise Hervorstürmen und passt zum militärischen Zusammenhang.
theological_decisions:
- issue: Bedeutung von ἀδελφοῖς im militärisch-nationalen Zusammenhang
  choice: ihren Brüdern
  alternative: ihren jüdischen Volksgenossen / ihren Landsleuten
  rationale: Der Haupttext wahrt die konkrete Verwandtschaftsmetapher des Griechischen, während die Fußnote darauf hinweist, dass hier wahrscheinlich eine größere Gemeinschaft gemeint ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die lange griechische Periode wurde zur besseren Verständlichkeit in drei Sätze gegliedert; die Abfolge und Dynamik der Handlungen bleiben erhalten.
