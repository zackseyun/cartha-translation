  text: Therefore hurry[a], and send some men, so that we too may learn what your intention is.
translation:
  language: de
  text: Darum beeilt euch und schickt einige Leute, damit auch wir erfahren, wie ihr gesinnt seid.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „welcher Art ihr hinsichtlich der Gesinnung oder Meinung seid“. Gemeint sein können eure Haltung, euer Entschluss oder eure Absicht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ
  choice: Darum
  rationale: Kennzeichnet knapp und natürlich die Folgerung aus dem vorausgehenden Zusammenhang.
- source_word: σπεύσατε
  choice: beeilt euch
  rationale: Der Aoristimperativ fordert zu unverzüglichem Handeln auf; die Wendung ist modern und wahrt die Dringlichkeit.
- source_word: πέμψατέ τινας
  choice: schickt einige Leute
  rationale: τινας bezeichnet unbestimmt einige Personen. „Leute“ vermeidet eine unbegründete Festlegung auf männliche Abgesandte, lässt aber Vertreter oder Boten als kontextuelle Möglichkeit offen.
- source_word: ὅπως
  choice: damit
  rationale: Gibt den durch ὅπως eingeleiteten Zweck idiomatisch wieder.
- source_word: καὶ ἡμεῖς
  choice: auch wir
  rationale: Bewahrt die einschließende beziehungsweise hervorhebende Wirkung von καί beim ausdrücklich genannten Pronomen.
- source_word: ἐπιγνῶμεν
  choice: erfahren
  rationale: Bezeichnet hier das Erlangen verlässlicher Kenntnis durch die entsandten Personen; „erfahren“ ist natürlicher als eine Wiedergabe mit „vollständig erkennen“.
- source_word: ὁποῖοί ἐστε γνώμης
  choice: welche Absicht ihr habt
  rationale: Die griechische Wendung fragt wörtlich nach der Art ihrer Gesinnung oder Meinung und kann im Zusammenhang Absicht, Haltung oder Entschluss bezeichnen. „Welche Absicht ihr habt“ gibt den praktischen Sinn natürlich wieder, während die Fußnote die Spannweite offenlegt.
