  text: But after a very short time[a], Lysias, the king’s guardian and kinsman and the one over affairs, taking the events very hard[c][b],
translation:
  language: de
  text: Doch schon nach ganz kurzer Zeit[a] nahm Lysias, der Vormund[b] und Verwandte des Königs sowie der Leiter der Staatsgeschäfte[c], das Geschehene sehr schwer,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Doch schon kurze Zeit später“; der griechische Ausdruck betont, wie kurz der Zeitraum war.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Bevollmächtigte“ beziehungsweise „Reichsverweser“; das griechische Wort bezeichnet jemanden, dem Aufsicht und Vertretung anvertraut sind.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „der über die Angelegenheiten Eingesetzte“; vermutlich ist damit die Leitung der Staatsgeschäfte gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετʼ ὀλίγον δὲ παντελῶς χρονίσκον
  choice: Doch schon nach ganz kurzer Zeit
  rationale: Die Verbindung aus μετʼ ὀλίγον, παντελῶς und dem diminutivischen χρονίσκον hebt die Kürze des Zeitraums nachdrücklich hervor. Die gewählte Formulierung gibt diese kumulative Wirkung in natürlichem Deutsch wieder.
- source_word: ἐπίτροπος τοῦ βασιλέως
  choice: der Vormund des Königs
  rationale: ἐπίτροπος bezeichnet eine mit Aufsicht und Vertretung betraute Person. Im Verhältnis zum König ist „Vormund“ eine historisch plausible und verständliche Wiedergabe, ohne die Amtsvollmacht als förmliche Regentschaft festzulegen.
- source_word: συγγενὴς
  choice: Verwandte
  rationale: Das Wort bezeichnet eine verwandtschaftlich verbundene Person. „Verwandte“ ist im modernen Deutschen natürlicher als „Anverwandte“ und wahrt den historischen Sinn.
- source_word: ἐπὶ τῶν πραγμάτων
  choice: Leiter der Staatsgeschäfte
  rationale: Wörtlich steht Lysias „über den Angelegenheiten“. Der Kontext weist auf eine hohe Verwaltungsfunktion hin; „Leiter der Staatsgeschäfte“ ist verständlich, ohne einen nicht ausdrücklich genannten Amtstitel einzuführen.
- source_word: λίαν βαρέως φέρων ἐπὶ τοῖς γεγονόσι
  choice: nahm das Geschehene sehr schwer
  rationale: βαρέως φέρειν ist eine idiomatische Wendung für heftige Bekümmerung, Verärgerung oder Entrüstung. Die deutsche Wendung bewahrt diese emotionale Spannweite, ohne eine einzelne Gefühlsregung festzulegen.
