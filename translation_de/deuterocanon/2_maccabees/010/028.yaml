  text: Lebt wohl[a]! Möge es so sein, wie wir es wünschen[b]. Auch wir selbst sind gesund.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Im Griechischen steht wörtlich Gesundheitssprache: „Seid stark/gesund … auch wir selbst sind gesund.“ „Lebt wohl“ gibt die übliche Bedeutung als formelhaften Abschiedsgruß wieder.'
