lexical_decisions:
- source_word: ἔρρωσθε
  choice: Lebt wohl
  rationale: Der Imperativ Plural von ῥώννυμι verwendet Gesundheitssprache, dient in Briefen jedoch idiomatisch als Abschiedsgruß. „Lebt wohl“ gibt diese Funktion in natürlichem, würdigem Deutsch wieder.
- source_word: εἴη ἂν
  choice: Möge es so sein
  rationale: Der Optativ mit ἄν bezeichnet hier einen Wunsch beziehungsweise eine als erwünscht vorgestellte Möglichkeit. Die Wiedergabe bewahrt den offenen Bezug von „es“.
- source_word: ὡς βουλόμεθα
  choice: wie wir es wünschen
  rationale: βούλομαι bezeichnet Wollen oder Wünschen. „Wünschen“ passt zum höflichen Ton der brieflichen Schlussformel.
- source_word: καὶ αὐτοὶ δὲ ὑγιαίνομεν
  choice: Auch wir selbst sind gesund
  rationale: ὑγιαίνω bezeichnet wörtlich das Gesundsein; αὐτοί setzt eine leichte Betonung auf die Schreibenden. Die Formulierung bewahrt sowohl die Gesundheitssprache als auch die Gegenseitigkeit.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem brieflichem Ton. Die ungewöhnliche, im Griechischen selbst offene Wendung „Möge es so sein“ wird nicht durch eine kontextuelle Ergänzung vereindeutigt.
