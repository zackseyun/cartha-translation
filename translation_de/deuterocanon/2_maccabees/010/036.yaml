    text: 'Oder, etwas wörtlicher: „Was aber entschieden wurde, dem König vorzulegen.“ Die griechische Formulierung ist stark verdichtet; sie lässt offen, wer dies entschieden hat beziehungsweise ob sie unpersönlich zu verstehen ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἃ δὲ ἔκρινεν
  choice: Was aber … vorgelegt werden soll
  rationale: Die griechische Wendung ist stark verdichtet; ἔκρινεν steht in der 3. Person Singular, ohne dass im vorliegenden Satz ein eindeutiges Subjekt genannt wird. Die deutsche Fassung gibt den wahrscheinlichen Sinn idiomatisch wieder, ohne ein bestimmtes Subjekt einzusetzen.
- source_word: προσανενεχθῆναι τῷ Βασιλεῖ
  choice: dem König vorgelegt werden
  rationale: Das Verb bezeichnet hier das Vorbringen einer Angelegenheit bei einer übergeordneten Autorität. „Vorgelegt werden“ lässt offen, ob dies mündlich oder schriftlich geschieht.
- source_word: πέμψατέ τινα παραχρῆμα
  choice: schickt unverzüglich jemanden
  rationale: Der Imperativ Plural fordert die Adressaten zu sofortigem Handeln auf; „unverzüglich“ gibt παραχρῆμα präzise und in einem angemessen formellen Register wieder.
- source_word: ἐπισκεψόμενον περὶ τούτων
  choice: der diese Angelegenheiten prüft
  rationale: Das futurisch gebrauchte Partizip bezeichnet den Zweck der Entsendung. „Prüft“ erfasst das Untersuchen oder Begutachten der betreffenden Fragen.
- source_word: ἵνʼ ἔχωμεν ὡς καθήκει ἡμῖν
  choice: damit wir so handeln können, wie es uns zukommt
  rationale: Das wörtliche „damit wir haben“ wäre im Deutschen unvollständig. Im Zusammenhang bezeichnet die Wendung die Möglichkeit, in angemessener Weise zu verfahren.
- source_word: ἡμεῖς γὰρ προσάγομεν πρὸς Ἀντιοχίαν
  choice: denn wir ziehen weiter nach Antiochia
  rationale: Das Präsens beschreibt eine gegenwärtige oder unmittelbar bevorstehende Weiterreise. „Weiterziehen“ bewahrt den Bewegungssinn und klingt im erzählerischen Zusammenhang natürlich.
