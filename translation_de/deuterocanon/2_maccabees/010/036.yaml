  text: But if there are matters that should be brought before the king[a], send someone at once to look into these things, so that we may act as is fitting for us; for we are going on to Antioch.
translation:
  language: de
  text: Was aber dem König vorgelegt werden soll[a], dazu schickt unverzüglich jemanden, der diese Angelegenheiten prüft, damit wir so verfahren können, wie es sich für uns gehört; denn wir ziehen nach Antiochia.
  philosophy: optimal-equivalence
  footnotes:
