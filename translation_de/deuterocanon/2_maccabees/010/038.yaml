lexical_decisions:
- source_word: ὑγιαίνετε
  choice: Lebt wohl
  rationale: Wörtlich bezeichnet das Verb das Gesundsein; hier steht es als konventionelle Schlussformel eines Briefes. „Lebt wohl“ gibt diese Funktion in natürlichem, würdigem Deutsch wieder.
- source_word: ἔτους ἑκατοστοῦ τεσσερακοστοῦ ὀγδόου
  choice: im 148. Jahr
  rationale: Die griechische Genitivverbindung bildet eine Datierungsformel und bezeichnet das hundertachtundvierzigste Jahr.
- source_word: Ξανθικοῦ
  choice: des Monats Xanthikos
  rationale: Der makedonische Monatsname wird transliteriert; „des Monats“ macht seine kalendarische Funktion für heutige Leser deutlich.
- source_word: πεντεκαιδεκάτῃ
  choice: am fünfzehnten Tag
  rationale: Der feminine Dativ gehört zur elliptischen Datierungsformel und bezeichnet den fünfzehnten Tag des genannten Monats.
