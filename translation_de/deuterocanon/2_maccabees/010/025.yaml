translation_notes:
  register: Moderner, würdevoller Verwaltungston eines königlichen Erlasses. Die Satzstruktur bleibt förmlich, wird aber für heutige Leser geglättet. Die gemeinschaftlich-politische Bedeutung von πολιτεύεσθαι und der mögliche Umfang von ἱερόν werden nicht vereindeutigt, sondern in Fußnoten offengehalten.
