  yaml_path: translation/deuterocanon/2_maccabees/010/025.yaml
  text: Therefore[a], since we choose that this nation also should be free from disturbance, we judge that the sanctuary should be restored to them[c][b], and that they should live according to the customs of their ancestors.
translation:
  language: de
  text: Da wir nun wünschen, dass auch dieses Volk von Unruhen verschont bleibt, bestimmen wir, dass ihnen das Heiligtum[a] wiederhergestellt wird und dass sie nach den Bräuchen leben sollen, die zur Zeit ihrer Vorfahren galten.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Das Heiligtum“ kann auch mit „der Tempel“ wiedergegeben werden; das griechische Wort kann den heiligen Tempelbereich als Ganzes bezeichnen.
    reason: lexical_alternative
  - marker: b
    text: Das mit „leben“ wiedergegebene Verb kann auch bedeuten, das gemeinschaftliche oder bürgerliche Leben entsprechend zu gestalten.
    reason: lexical_alternative
lexical_decisions:
- source_word: αἱρούμενοι
  choice: Da wir nun wollen
  rationale: Das präsentische Partizip bezeichnet den leitenden Willen hinter der amtlichen Entscheidung. Die Formulierung bewahrt den deliberativen Sinn, ohne ihn vorschnell als bereits abgeschlossenen Beschluss wiederzugeben.
- source_word: ἔθνος
  choice: Volk
  rationale: Im administrativen Zusammenhang bezeichnet ἔθνος die jüdische Gemeinschaft als eigenständige kollektive Größe. „Volk“ ist im Deutschen natürlich und vermeidet moderne staatsrechtliche Nebenbedeutungen von „Nation“.
- source_word: ἐκτὸς ταραχῆς εἶναι
  choice: von Unruhen verschont bleibt
  rationale: Die Wendung zielt auf Freiheit von öffentlicher Unruhe oder Aufruhr. „Von Unruhen verschont“ gibt diesen gesellschaftlich-politischen Sinn idiomatisch wieder.
- source_word: κρίνομεν
  choice: bestimmen wir
  rationale: κρίνω bezeichnet hier eine förmliche amtliche Entscheidung. „Bestimmen“ entspricht dem Verwaltungston besser als das im Deutschen missverständliche „urteilen“, ohne die stärkere Formulierung „verordnen“ vorauszusetzen.
- source_word: τὸ ἱερὸν
  choice: das Heiligtum
  rationale: ἱερόν kann das Heiligtum beziehungsweise den gesamten heiligen Tempelbereich bezeichnen. „Heiligtum“ wahrt die kultische Bedeutung und lässt den genauen räumlichen Umfang offen.
- source_word: ἀποκατασταθῆναι αὐτοῖς
  choice: ihnen … zurückzugeben
  rationale: Der passive Infinitiv bezeichnet die Wiederherstellung des früheren Zustands beziehungsweise der früheren Verfügungsgewalt. Im Deutschen drückt „ihnen … zurückzugeben“ die Verbindung mit dem Dativ αὐτοῖς klar und natürlich aus.
- source_word: πολιτεύεσθαι
  choice: sie … leben zu lassen
  rationale: Das Verb umfasst die Lebensführung als Gemeinschaft und kann politische oder bürgerliche Obertöne tragen. In Verbindung mit den überlieferten Bräuchen ist „leben“ gut verständlich; die weitergehende gemeinschaftlich-politische Bedeutung wird in einer Fußnote offengehalten.
- source_word: κατὰ τὰ ἐπὶ τῶν προγόνων αὐτῶν ἔθη
  choice: nach den Bräuchen aus der Zeit ihrer Vorfahren
  rationale: Die Formulierung ἐπὶ τῶν προγόνων verweist wörtlich auf die Zeit der Vorfahren. Diese Wiedergabe erhält den zeitlichen Bezug genauer als die verkürzte Form „nach ihren überlieferten Bräuchen“.
