  terminology: „Volk“, „Unruhen“ und „Heiligtum“ sind passend. „Heiligtum“ wahrt die mögliche Weite von τὸ ἱερόν; die Fußnote erläutert die Alternative „Tempel“ sachgerecht. Die Fußnote zu πολιτεύεσθαι bewahrt dessen gemeinschaftlich-bürgerliche Nuance.
