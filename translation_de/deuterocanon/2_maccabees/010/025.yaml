- from: Da wir nun wollen, dass auch dieses Volk von Unruhen verschont bleibt, bestimmen wir, ihnen das Heiligtum[a] zurückzugeben und sie nach den Bräuchen aus der Zeit ihrer Vorfahren leben zu lassen.[b]
