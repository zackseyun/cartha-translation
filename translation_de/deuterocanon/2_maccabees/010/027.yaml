    reason: reference_mismatch
lexical_decisions:
- source_word: Πρὸς δὲ τὸ ἔθνος
  choice: An das Volk
  rationale: Πρός mit Akkusativ bezeichnet hier den Adressaten; ἔθνος meint die jüdische Gemeinschaft als kollektives Volk.
- source_word: ἡ τοῦ βασιλέως ἐπιστολὴ τοιαύδε ἦν
  choice: lautete der Brief des Königs folgendermaßen
  rationale: Die idiomatische deutsche Wendung gibt die Einleitung eines wörtlich folgenden Schreibens natürlich und vollständig wieder.
- source_word: Βασιλεὺς Ἀντίοχος
  choice: König Antiochos
  rationale: Bewahrt Titel und Namen in der knappen Form des königlichen Briefkopfs.
- source_word: τῇ γερουσίᾳ τῶν Ἰουδαίων
  choice: den Ältestenrat der Juden
  rationale: γερουσία bezeichnet ein offizielles Ältestengremium; „Ältestenrat“ vermeidet die römische Konnotation von „Senat“.
- source_word: τοῖς ἄλλοις Ἰουδαίοις
  choice: die übrigen Juden
  rationale: ἄλλοις unterscheidet die weitere jüdische Bevölkerung von dem zuvor genannten Ältestenrat; „übrigen“ ist im Deutschen hier natürlicher als „anderen“.
- source_word: χαίρειν
  choice: grüßt
  rationale: χαίρειν ist in Briefanfängen eine feste Grußformel. Die verbale Wiedergabe „grüßt“ fügt sich natürlich in den deutschen Satzbau ein.
