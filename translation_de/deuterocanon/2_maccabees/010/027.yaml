  text: 'And to the nation the king’s letter was as follows: “King Antiochus to the council of elders of the Jews and to the other Jews[b][a], greetings.”'
translation:
  language: de
  text: 'An das Volk lautete der Brief des Königs folgendermaßen: »König Antiochos grüßt den Ältestenrat[a] der Juden und die übrigen Juden[b].«[c]'
  philosophy: optimal-equivalence
  footnotes:
