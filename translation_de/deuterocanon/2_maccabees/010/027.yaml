review_pass:
  verdict: revise
  source_fidelity: 'Der deutsche Wortlaut gibt den griechischen Text vollständig wieder: Adressierung an das jüdische Volk, Einleitung des königlichen Schreibens, Antiochos, die Gerusie/den Ältestenrat, die weiteren Juden und die Grußformel. Die Partikel δέ wird mit „aber“ berücksichtigt. Der überlieferte griechische Wortlaut gehört allerdings zu 2. Makkabäer 11,27, nicht zu 10,27.'
  naturalness: „Der Brief des Königs an das Volk lautete aber folgendermaßen“ ist im modernen Standarddeutsch deutlich natürlicher als die vorangestellte Formulierung „An das Volk lautete der Brief des Königs“. Die knappe Formel „König Antiochos grüßt …“ ist als Briefkopf verständlich und angemessen.
  terminology: „Ältestenrat“ trifft γερουσία als institutionelles Ältestengremium gut, ohne die spezifisch römische Färbung von „Senat“ nahezulegen. „Übrigen Juden“ gibt τοῖς ἄλλοις Ἰουδαίοις idiomatisch und sachgerecht wieder. „Antiochos“ ist die im Deutschen übliche Namensform.
  issues:
  - severity: low
    issue: Unnatürliche Satzstellung in der Einleitung
    rationale: Die Formulierung „An das Volk lautete der Brief des Königs“ ist zwar verständlich, aber im Deutschen stilistisch sperrig. Eine Umstellung erhält den Sinn und verbessert die Lesbarkeit.
  - severity: high
    issue: Abweichende Versreferenz zwischen Aufgaben-ID und Quelltext
    rationale: Der vorgelegte griechische Text ist in den üblichen Ausgaben 2. Makkabäer 11,27 zugeordnet. Die Passage sollte nicht ohne editorische Klärung als 2. Makkabäer 10,27 veröffentlicht werden.
  revised_text: 'Der Brief des Königs an das Volk lautete aber folgendermaßen: »König Antiochos grüßt den Ältestenrat[a] der Juden und die übrigen Juden[b].«[c]'
