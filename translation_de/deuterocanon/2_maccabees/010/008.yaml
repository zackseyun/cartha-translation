  text: And while they were there near Jerusalem[a], a horseman appeared, going before them[b], clothed in white and brandishing golden armor.
translation:
  language: de
  text: Als sie aber dort nahe Jerusalem waren, erschien ein Mann zu Pferd[b], der ihnen voranzog[a]. Er war weiß gekleidet und schwang eine goldene Rüstung.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der vor ihnen herzog“. Das griechische Partizip kann lediglich bezeichnen, dass der Mann sich vor ihnen befand oder bewegte; im Zusammenhang kann zugleich ein Führen anklingen.'
    reason: lexical_alternative
  - marker: b
    text: Der Text sagt nicht ausdrücklich, wer der Mann zu Pferd ist. Die Beschreibung kann auf eine himmlische oder engelhafte Gestalt hindeuten, lässt dies aber offen.
    reason: theological_ambiguity
lexical_decisions:
- source_word: αὐτόθι δὲ πρὸς τοῖς Ἱεροσολύμοις ὄντων
  choice: Als sie aber dort bei Jerusalem waren
  rationale: Die Genitivkonstruktion wird als natürlicher temporaler Nebensatz wiedergegeben. „Bei Jerusalem“ bewahrt den örtlichen Sinn von πρός mit Dativ, ohne einen Aufenthalt innerhalb der Stadt zu behaupten.
- source_word: ἐφάνη
  choice: erschien
  rationale: Das Verb bezeichnet das Sichtbarwerden oder plötzliche Auftreten der Gestalt und lässt den übernatürlichen Charakter lediglich anklingen.
- source_word: προηγούμενος αὐτῶν
  choice: der ihnen voranzog
  rationale: Die Formulierung bezeichnet den Reiter als vor der Gruppe herziehend, ohne ausdrücklich festzulegen, dass er sie als Anführer leitete.
- source_word: ἔφιππος
  choice: ein Reiter
  rationale: Das substantivisch gebrauchte Adjektiv bezeichnet eine berittene Gestalt; „Reiter“ ist im Deutschen knapp und natürlich.
- source_word: ἐν λευκῇ ἐσθῆτι
  choice: Er war weiß gekleidet
  rationale: Die Wendung gibt die sichtbare weiße Kleidung wieder, ohne die Art des Gewandes näher zu bestimmen.
- source_word: πανοπλίαν χρυσῆν
  choice: eine goldene Rüstung
  rationale: πανοπλία bezeichnet die vollständige Rüstung beziehungsweise Waffenausrüstung. „Rüstung“ ist verständlich und vermeidet das im heutigen Deutsch ungebräuchliche „Panoplie“.
- source_word: κραδαίνων
  choice: schwang
  rationale: Das Partizip beschreibt eine lebhafte schwingende oder schwenkende Bewegung. Die finite Form ergibt nach der Satzteilung einen natürlichen deutschen Text.
theological_decisions:
- issue: Wesen der Erscheinung
  choice: Die Gestalt wird nur als Reiter bezeichnet.
  alternative: ein Engel oder himmlischer Reiter
  rationale: Der griechische Text benennt die Gestalt nicht als Engel. Weiße Kleidung und goldene Rüstung können eine himmlische Erscheinung nahelegen, legen deren Wesen aber nicht ausdrücklich fest.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Teilung in zwei Sätze vermeidet eine schwerfällige Häufung von Partizipien; das einleitende „aber“ bewahrt δέ. Die ungewöhnliche Vorstellung, eine Rüstung zu schwingen, wird nicht stillschweigend in das Schwingen einer einzelnen Waffe umgedeutet.
