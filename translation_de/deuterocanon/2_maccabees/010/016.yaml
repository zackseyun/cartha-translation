review_pass:
  verdict: revise
  source_fidelity: 'Die Grundstruktur wird zutreffend wiedergegeben: γάρ als begründender Anschluss, die passive Vorvergangenheit, Briefe als an die Juden gerichtete Schreiben von Lysias sowie die anschließende Briefformel. In der Anrede sollte τῷ πλήθει jedoch nicht durch „Gemeinschaft“ festgelegt werden; „Menge“ wahrt den kollektiven Sinn ohne eine institutionelle oder religiöse Gemeinschaft zu insinuieren. Die Formel ist zudem quellentreuer als bloße Anredeformel „Lysias grüßt …“ wiederzugeben.'
  naturalness: 'Der Satz ist insgesamt verständlich und würdig. „Sie enthielten folgenden Wortlaut“ ist jedoch idiomatischer und klarer als „die folgenden Wortlaut hatten“. Die deutsche epistolarische Formel „Lysias an die Menge der Juden: Gruß!“ ist knapp, natürlich und bildet die griechische Konstruktion präzise nach.'
  terminology: „Briefe“ und „Lysias“ sind passend. „Menge der Juden“ gibt πλῆθος neutral wieder. „Gruß!“ ist als deutsche Wiedergabe des epistolaren χαίρειν angemessen.
  issues:
  - severity: medium
    issue: „Gemeinschaft der Juden“ für τῷ πλήθει τῶν Ἰουδαίων
    rationale: πλῆθος bezeichnet eine Menge, Volksmenge oder Gesamtheit. „Gemeinschaft“ kann eine organisierte oder religiös definierte Körperschaft nahelegen, die der griechische Ausdruck nicht ausdrücklich bezeichnet.
  - severity: low
    issue: Formulierung „die folgenden Wortlaut hatten“
    rationale: Grammatisch möglich, aber „sie enthielten folgenden Wortlaut“ ist im modernen Standarddeutsch idiomatischer und bildet περιέχουσαι genauer ab.
  - severity: high
    issue: Abweichung zwischen Aufgabenreferenz und geliefertem griechischen Text
    rationale: Der zitierte griechische Text ist in der üblichen Zählung 2. Makkabäer 11,16 zugeordnet, nicht 10,16. Die sachliche Anmerkung muss erhalten bleiben; die Referenzzuordnung benötigt eine redaktionelle Prüfung.
  revised_text: 'Denn von Lysias waren Briefe an die Juden geschrieben worden; sie enthielten folgenden Wortlaut[a]: »Lysias an die Menge der Juden[b]: Gruß!«[c]'
  revised_footnotes:
  - marker: a
    text: 'Auch: »diese Formulierung«, »diese Fassung« oder »in dieser Form«.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: »Gesamtheit der Juden« oder »Versammlung der Juden«. Wörtlich: »Menge der Juden«.'
    reason: lexical_alternative
  - marker: c
    text: Der angegebene griechische Quelltext entspricht in der üblichen Verszählung 2. Makkabäer 11,16, nicht 10,16.
    reason: source_reference_mismatch
  revision_rationale: Die Revision ersetzt die interpretierende Bezeichnung „Gemeinschaft“ durch die neutrale, quellennähere „Menge“ und stellt die griechische Briefkopf- bzw. Grußformel als solche dar. Der Hinweis auf die abweichende Versreferenz bleibt unverändert sachlich bestehen.
