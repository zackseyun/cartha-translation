  yaml_path: translation/deuterocanon/2_maccabees/010/016.yaml
  text: 'For letters had been written to the Jews from Lysias[a], containing this form: “Lysias to the multitude of the Jews[b], greetings.”'
translation:
  language: de
  text: 'Denn an die Juden waren von Lysias Briefe geschrieben worden, die folgenden Wortlaut[a] hatten: »Lysias grüßt die Gemeinschaft der Juden[b].«[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: »folgende Form« oder »folgende Fassung«.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »die Menge der Juden«; gemeint sein kann auch die Gesamtheit oder Versammlung der Juden.'
    reason: lexical_alternative
  - marker: c
    text: Der angegebene griechische Quelltext entspricht in der üblichen Verszählung 2. Makkabäer 11,16, nicht 10,16.
    reason: source_reference_mismatch
lexical_decisions:
- source_word: ἦσαν γὰρ γεγραμμέναι
  choice: Denn … waren … geschrieben worden
  rationale: Gibt die umschreibende passive Vorvergangenheit wieder und bewahrt den begründenden Anschluss durch γάρ.
- source_word: ἐπιστολαὶ
  choice: Briefe
  rationale: Natürliche und sachlich passende Bezeichnung für amtliche Korrespondenz.
- source_word: τοῖς Ἰουδαίοις
  choice: an die Juden
  rationale: Der Dativ bezeichnet hier die Empfänger; im Deutschen ist bei Briefen »an« idiomatisch.
- source_word: παρὰ μὲν Λυσίου
  choice: von Lysias
  rationale: παρά mit Genitiv bezeichnet die Herkunft; »von Lysias« ist im Deutschen knapp und natürlich.
- source_word: περιέχουσαι τὸν τρόπον τοῦτον
  choice: die folgenden Wortlaut hatten
  rationale: Leitet den zitierten Inhalt beziehungsweise die Formulierung des Schreibens idiomatisch ein.
- source_word: τῷ πλήθει τῶν Ἰουδαίων
  choice: die Gemeinschaft der Juden
  rationale: πλῆθος bezeichnet hier die Juden als kollektive Gesamtheit. »Gemeinschaft« klingt im modernen Deutsch natürlicher als »Menge«, ohne eine förmliche Versammlung vorauszusetzen.
- source_word: χαίρειν
  choice: grüßt
  rationale: Gibt die übliche griechische Briefformel natürlich wieder; wörtliches »sich freuen« wäre hier missverständlich.
