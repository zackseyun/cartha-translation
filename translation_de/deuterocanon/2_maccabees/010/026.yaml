base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/010/026.yaml
  text: Therefore you will do well to send to them and give them pledges of good faith[a], so that, knowing our intention[c][b], they may be encouraged and may live gladly with support for their own interests.
translation:
  language: de
  text: Daher wirst du gut daran tun, zu ihnen zu senden und ihnen verbindliche Zusicherungen zu geben[a], damit sie, wenn sie unsere Absicht kennen, guten Mutes sind[b] und mit Unterstützung in ihren eigenen Angelegenheiten angenehm leben können.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „ihnen rechte Hände zu geben“; die Geste steht für verbindliche Zusicherungen, Frieden oder Treue.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „zuversichtlich“ beziehungsweise „frohen Mutes“.'
    reason: lexical_alternative
  - marker: c
    text: 'Der letzte Satzteil kann auch enger verstanden werden: „mit Unterstützung für ihren eigenen Besitz“ oder allgemeiner: „mit Unterstützung für ihre eigenen Belange“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὖ οὖν ποιήσεις
  choice: Daher wirst du gut daran tun
  rationale: Die geläufige deutsche Wendung bewahrt sowohl die futurische Form als auch den empfehlenden beziehungsweise auffordernden Sinn.
- source_word: διαπεμψάμενος πρὸς αὐτούς
  choice: Boten zu ihnen zu schicken
  rationale: Die mediale Form von διαπέμπω bezeichnet hier im diplomatischen Zusammenhang das Entsenden zu einer Gruppe; „Boten“ macht den impliziten Vorgang im Deutschen verständlich, ohne den Inhalt der Botschaft festzulegen.
- source_word: δοὺς δεξιάς
  choice: ihnen verbindliche Zusicherungen zu geben
  rationale: Das wörtliche Geben der rechten Hände ist eine idiomatische Geste der Zusicherung, des Friedens oder der Treue. Die sinngemäße Wiedergabe ist im modernen Deutschen klarer; die Bildsprache bleibt in der Fußnote erhalten.
- source_word: προαίρεσιν
  choice: Absicht
  rationale: προαίρεσις bezeichnet einen bewusst gefassten Entschluss oder eine Absicht; „Absicht“ wahrt die diplomatische Offenheit des Ausdrucks.
- source_word: εὔθυμοί
  choice: guten Mutes
  rationale: Der Ausdruck bezeichnet eine zuversichtliche, frohe innere Haltung. „Guten Mutes“ ist würdig und liegt näher am griechischen Adjektiv als eine rein kausative Wiedergabe wie „ermutigt“.
- source_word: ἡδέως διαγίνωνται
  choice: zufrieden leben können
  rationale: ἡδέως bezeichnet angenehmes oder erfreuliches Ergehen, während διαγίνομαι das Verbringen der Zeit beziehungsweise das Fortleben ausdrückt. „Zufrieden leben“ klingt natürlich, ohne übermäßige Freude hineinzulesen.
- source_word: πρὸς τῇ τῶν ἰδίων ἀντιλήψει
  choice: da sie in ihren eigenen Angelegenheiten Unterstützung erhalten
  rationale: ἀντίληψις kann Hilfe, Beistand oder Schutz bedeuten; τὰ ἴδια kann eigene Angelegenheiten, Interessen oder Besitz bezeichnen. Die Übersetzung hält den Bezug bewusst allgemein, formuliert die schwerfällige griechische Nominalfügung aber idiomatisch.
