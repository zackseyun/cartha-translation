  yaml_path: translation/deuterocanon/2_maccabees/010/030.yaml
  text: Therefore[a], for those going down until the thirtieth of Xanthicus, there will be a right hand given with safe-conduct[c][b],
translation:
  language: de
  text: Denen nun, die bis zum dreißigsten Tag des Monats Xanthikos abreisen, wird freies Geleit zugesichert.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „wird eine rechte Hand mit Erlaubnis gewährt“. Die „rechte Hand“ bezeichnet hier wahrscheinlich eine formelhafte Zusicherung oder Garantie; zusammen mit „Erlaubnis“ ist freies Geleit gemeint.'
    reason: lexical_alternative
  - marker: b
    text: Xanthikos ist der Name eines Monats im makedonischen Kalender. Das knappe griechische Satzstück gehört offenbar zu einem größeren Zusammenhang; „abreisen“ kann auch wörtlicher „hinabziehen“ oder allgemeiner „fortgehen“ bedeuten.
    reason: cultural_note_and_alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: nun
  rationale: Gibt die folgernde beziehungsweise weiterführende Verbindung knapp und natürlich wieder, ohne den unvollständigen Zusammenhang zu überdeuten.
- source_word: καταπορευομένοις
  choice: die … abreisen
  rationale: Das Verb bezeichnet wörtlich eine Bewegung hinab beziehungsweise fort. Im diplomatisch-militärischen Zusammenhang ist „abreisen“ idiomatisch; die mögliche wörtlichere Bedeutung wird in der Fußnote bewahrt.
- source_word: μέχρι τριακάδος Ξανθικοῦ
  choice: bis zum dreißigsten Tag des Monats Xanthikos
  rationale: Gibt die zeitliche Frist ausdrücklich wieder und bewahrt den historischen makedonischen Monatsnamen in einer im Deutschen verständlichen Form.
- source_word: ὑπάρξει δεξιὰ
  choice: wird … zugesichert
  rationale: „Rechte Hand“ bezeichnet hier wahrscheinlich die durch Handschlag bekräftigte Zusage oder Garantie. Die idiomatische Übersetzung vermeidet eine im Deutschen missverständliche Körperteilmetapher.
- source_word: μετὰ τῆς ἀδείας
  choice: freies Geleit
  rationale: ἀδεία kann Erlaubnis, Freiheit oder Sicherheit vor Behelligung bedeuten. Zusammen mit δεξιά passt im diplomatischen Kontext „freies Geleit“ am besten.
