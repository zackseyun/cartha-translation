translation_notes:
  register: Moderne, würdevolle Erzählsprache mit lebendiger Kampfschilderung. Die Spannung zwischen dem Niederstrecken vieler Gegner und der anschließenden Aussage, sie seien allesamt zur Flucht gezwungen worden, bleibt entsprechend dem griechischen Wortlaut erhalten.
