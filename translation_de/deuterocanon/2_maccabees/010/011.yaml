  source_fidelity: 'Der deutsche Text gibt die Abfolge und den Sinn des griechischen Satzes zuverlässig wieder: den löwenartigen Angriff, das Niederstrecken von 11.000 Gegnern und 1.600 Reitern sowie die erzwungene Flucht aller. „Von ihnen“ entspricht αὐτῶν; „Reiter“ ist für ἱππεῖς historisch und sprachlich passend. Die spannungsvolle Verbindung von hohen Verlustzahlen mit „allesamt zur Flucht“ wird, wie im griechischen Text, nicht harmonisierend aufgelöst.'
  naturalness: Die Formulierung ist modernes, gut lesbares Standarddeutsch mit angemessen würdigem erzählerischem Register. „Sie stürzten sich wie Löwen auf die Feinde“ und „zwangen sie allesamt zur Flucht“ sind idiomatisch. Die Wortstellung bei den Zahlen bleibt klar.
  terminology: Die militärischen Begriffe „Mann“ und „Reiter“ sind angemessen. „Wie Löwen“ trifft die vergleichende Bildsprache, ohne die seltene griechische Form unnötig technisch nachzubilden. Es sind keine theologischen Fachbegriffe oder Eigennamen zu prüfen.
