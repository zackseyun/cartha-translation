base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/010/011.yaml
  text: But springing at the enemies like lions[a], they laid low eleven thousand of them, and one thousand six hundred cavalry; and they forced them all to flee.
translation:
  language: de
  text: Doch sie stürzten sich wie Löwen auf die Feinde, streckten von ihnen elftausend Mann und tausendsechshundert Reiter nieder[a] und zwangen sie allesamt zur Flucht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich lauten die griechischen Zahlenangaben: „tausend zu zehntausend hinzu“ und „sechshundert zu tausend hinzu“.'
    reason: Die Fußnote dokumentiert die ungewöhnliche additive Form der beiden Zahlenangaben.
lexical_decisions:
- source_word: λεόντινων
  choice: wie Löwen
  rationale: Die seltene adverbiale Form bezeichnet löwenartige Wildheit; die Vergleichsform ist im Deutschen anschaulich und natürlich.
- source_word: ἐντινάξαντες
  choice: sie stürzten sich ... auf
  rationale: Das Partizip beschreibt eine plötzliche, heftige Bewegung gegen den Feind und verbindet sich natürlich mit dem Löwenvergleich.
- source_word: κατέστρωσαν
  choice: streckten ... nieder
  rationale: Im Schlachtzusammenhang bezeichnet das Verb das Niederwerfen beziehungsweise Töten von Gegnern; die Formulierung wahrt die Bildhaftigkeit, ohne den genauen Ausgang für jeden Einzelnen stärker festzulegen als der griechische Text.
- source_word: χιλίους πρὸς τοῖς μυρίοις
  choice: elftausend Mann
  rationale: Die additive griechische Zahlenangabe bedeutet wörtlich tausend zu zehntausend hinzu, also insgesamt elftausend.
- source_word: ἱππεῖς
  choice: Reiter
  rationale: Das Wort bezeichnet berittene Kämpfer; „Reiter“ ist präzise, verständlich und passt zum historischen Erzählton.
- source_word: ἑξακοσίους πρὸς χιλίοις
  choice: tausendsechshundert
  rationale: Die additive Konstruktion ergibt insgesamt tausendsechshundert; die zusammengeschriebene deutsche Zahl gibt den Gesamtwert klar wieder.
- source_word: τοὺς δὲ πάντας ἠνάγκασαν φεύγειν
  choice: und zwangen sie allesamt zur Flucht
  rationale: Die Wiedergabe bewahrt sowohl die verursachende Bedeutung von ἠνάγκασαν als auch die umfassende Aussage von πάντας, ohne stillschweigend „die Übrigen“ in den Text einzufügen.
