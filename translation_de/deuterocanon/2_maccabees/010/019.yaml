base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/010/019.yaml
  text: If[a], then, you maintain your goodwill toward these matters[b], I will also try from now on to be the cause of good things.
translation:
  language: de
  text: Wenn ihr also euer Wohlwollen gegenüber diesen Angelegenheiten[a] bewahrt, werde auch ich mich künftig bemühen, Gutes zu bewirken[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »für diese Angelegenheiten«. Die griechische Wendung ist weit gefasst und kann die behandelte Sache oder das Unternehmen als Ganzes bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: »Urheber guter Dinge zu sein«. Gemeint ist, Gutes oder Wohltaten hervorzubringen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: συντηρήσητε
  choice: bewahrt
  rationale: Das Verb bezeichnet das fortdauernde Erhalten oder Aufrechterhalten; »bewahrt« gibt den bedingten, zukunftsbezogenen Sinn knapp und würdig wieder.
- source_word: εἰς τὰ πράγματα
  choice: gegenüber diesem Vorhaben
  rationale: Die griechische Wendung ist weit gefasst und kann die behandelte Sache, das Unternehmen oder die Angelegenheiten insgesamt meinen. Im Zusammenhang ist »diesem Vorhaben« natürlich, ohne den Bezug unnötig einzuengen.
- source_word: εὔνοιαν
  choice: Wohlwollen
  rationale: εὔνοια bezeichnet eine wohlwollende, günstige Haltung; »Wohlwollen« entspricht dem gehobenen Vorredenstil und ist zugleich allgemein verständlich.
- source_word: εἰς τὸ λοιπόν
  choice: künftig
  rationale: Die Wendung weist auf die folgende Zeit. »Künftig« ist prägnant und entspricht dem Sinn von »von nun an« beziehungsweise »für die Zukunft«.
- source_word: πειράσομαι
  choice: werde ich mich bemühen
  rationale: Das Futur Medium drückt die Absicht aus, einen Versuch oder eine Anstrengung zu unternehmen. »Mich bemühen« wahrt diesen Sinn in natürlichem Deutsch.
- source_word: αἰτιαῖος ἀγαθῶν
  choice: Gutes zu bewirken
  rationale: αἰτιαῖος hebt die ursächliche Mitwirkung hervor, während ἀγαθῶν substantivisch und inhaltlich weit bleibt. »Gutes zu bewirken« gibt beides idiomatisch wieder.
