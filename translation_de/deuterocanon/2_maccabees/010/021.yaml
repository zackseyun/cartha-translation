lexical_decisions:
- source_word: ἔρρωσθε
  choice: Lebt wohl!
  rationale: Die Form ist hier eine übliche briefliche Schlussformel. „Lebt wohl!“ gibt ihre Funktion im Deutschen natürlicher wieder als die wörtlicheren Möglichkeiten „Seid stark“ oder „Seid gesund“.
- source_word: ἔτους ἑκατοστοῦ τεσσερακοστοῦ ὀγδόου
  choice: Im 148. Jahr
  rationale: Die griechische Datierungsformel bezeichnet das Jahr; die knappe deutsche Wiedergabe bewahrt diese Funktion und lässt die im Satz selbst nicht genannte Ära offen.
- source_word: Διὸς Κορινθίου
  choice: des Monats Dios Korinthios
  rationale: Der makedonische Monatsname wird als Eigenname transliteriert. „des Monats“ wird zur unmittelbaren Verständlichkeit ergänzt; die getrennte Schreibung entspricht den zwei griechischen Namensbestandteilen.
- source_word: τετράδι καὶ εἰκάδι
  choice: am vierundzwanzigsten Tag
  rationale: Die griechische Wendung lautet formal „am vierten und zwanzigsten“, ist aber die gewöhnliche Ausdrucksweise für den vierundzwanzigsten Tag. Die idiomatische deutsche Datumsangabe vermeidet unnötige Fremdheit.
