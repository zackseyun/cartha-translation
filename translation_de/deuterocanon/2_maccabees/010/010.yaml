  yaml_path: translation/deuterocanon/2_maccabees/010/010.yaml
  text: As before[a], being in battle array and having the ally from heaven[b], because the Lord had shown them mercy.
translation:
  language: de
  text: Wie zuvor[a] standen sie kampfbereit da und hatten den Verbündeten aus dem Himmel[b], weil der Herr sich ihrer erbarmt hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wie früher waren sie gerüstet“. Das griechische Wort kann allgemein Ausrüstung oder Bereitschaft und im Zusammenhang besonders Kampfbereitschaft bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Das Griechische ist knapp formuliert, wörtlich etwa: „den Verbündeten aus dem Himmel habend, nachdem der Herr sich ihrer erbarmt hatte“.'
    reason: alternative_reading
lexical_decisions:
- source_word: τὸ πρόηγον
  choice: wie zuvor
  rationale: Die substantivierte adverbiale Wendung verweist idiomatisch auf das frühere Geschehen und stellt den gegenwärtigen Zustand damit in Vergleich.
- source_word: ἐν διασκευῇ
  choice: standen sie kampfbereit da
  rationale: διασκευή bezeichnet Ausrüstung oder Vorbereitung; im militärischen Zusammenhang gibt „kampfbereit“ den Sinn natürlich wieder, ohne eine bestimmte Schlachtformation zwingend vorauszusetzen.
- source_word: τὸν ἀπʼ οὐρανοῦ σύμμαχον
  choice: den Verbündeten aus dem Himmel
  rationale: σύμμαχος bezeichnet einen Mitkämpfer oder Verbündeten und bewahrt so das militärische Bild; „aus dem Himmel“ folgt der räumlichen Formulierung des Griechischen, ohne den Referenten näher festzulegen.
- source_word: ἔχοντες
  choice: hatten
  rationale: Das Partizip beschreibt begleitend, dass ihnen dieser himmlische Verbündete zur Seite stand; die finite Wiedergabe ergibt einen klaren deutschen Satz.
- source_word: ἐλεήσαντος αὐτοὺς τοῦ κυρίου
  choice: weil der Herr sich ihrer erbarmt hatte
  rationale: Der Genitivus absolutus gibt hier plausibel den Grund für den himmlischen Beistand an. „Sich erbarmen“ wahrt das Motiv göttlicher Barmherzigkeit und den vorausliegenden Aspekt.
theological_decisions:
- issue: Identität und Art des himmlischen Beistands
  choice: Das militärische Bild „der Verbündete aus dem Himmel“ bleibt ohne nähere Identifizierung erhalten.
  alternative: „der himmlische Helfer“ oder ausdrücklich „Gott als ihr Verbündeter“
  rationale: Der Text verbindet den Beistand mit dem Erbarmen des Herrn, benennt den σύμμαχος jedoch nicht ausdrücklich. Eine genauere Identifizierung würde die verdichtete Formulierung theologisch auflösen.
- issue: Logische Beziehung des Genitivus absolutus
  choice: 'kausal: „weil der Herr sich ihrer erbarmt hatte“'
  alternative: 'lockerer Begleitumstand: „wobei der Herr sich ihrer erbarmt hatte“'
  rationale: Der Zusammenhang legt nahe, dass das Erbarmen des Herrn den himmlischen Beistand begründet; die griechische Partizipialkonstruktion lässt die Beziehung jedoch formal verdichtet.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Kampfbereit“ macht den militärischen Zusammenhang verständlich, lässt aber gegenüber „in Schlachtordnung“ die lexikalische Weite von διασκευή bestehen. Die etwas ungewöhnliche Wendung „Verbündeter aus dem Himmel“ bewahrt bewusst das Bild und die Mehrdeutigkeit des Ausgangstextes.
