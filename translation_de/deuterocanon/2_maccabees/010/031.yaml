  source_fidelity: Die Übersetzung gibt die abhängigen Infinitive des Erlassinhalts angemessen wieder. „sich … bedienen dürfen“ vermittelt den erlaubenden Charakter von χρῆσθαι im Kontext, „wie zuvor“ entspricht καθὰ καὶ τὸ πρότερον, und die umfassende negative Zusicherung von κατʼ οὐδένα τρόπον ist mit „in irgendeiner Weise“ erhalten. „wegen dessen, was aus Unwissenheit geschehen ist“ wahrt die absichtlich unbestimmte, sachliche Form von τῶν ἠγνοημένων.
  naturalness: Modernes, verständliches Standarddeutsch in passend förmlichem Erlassstil. Die Verbindung „sich ihrer eigenen Mittel und Gesetze bedienen“ ist etwas gehoben, aber idiomatisch möglich und wegen der parallelen griechischen Dative vertretbar.
  terminology: „Mittel“ ist für δαπανήμασιν eine tragfähige, nicht überpräzisierende Wiedergabe. Die Fußnote dokumentiert die wesentlichen engeren Möglichkeiten „Aufwendungen“ und „Unterhaltsmittel“. „Gesetze“ gibt νόμοις direkt wieder; „behelligt werden“ trifft den amtlich-rechtlichen Ton von παρενοχληθήσεται.
