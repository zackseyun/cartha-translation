base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/010/031.yaml
  text: that the Jews should make use of their own resources and laws as before[a], and that none of them should in any way be harassed concerning the things done in ignorance.
translation:
  language: de
  text: dass die Juden sich wie zuvor ihrer eigenen Mittel[a] und Gesetze bedienen dürfen und keiner von ihnen in irgendeiner Weise wegen dessen, was aus Unwissenheit geschehen ist, behelligt werden wird.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihrer eigenen Aufwendungen“ oder „ihrer eigenen Unterhaltsmittel“; das griechische Wort kann Ausgaben oder materielle Mittel zum Unterhalt bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: χρῆσθαι
  choice: sich … bedienen dürfen
  rationale: Das Verb mit Dativ bedeutet „gebrauchen“ oder „sich einer Sache bedienen“. Im Zusammenhang einer gewährten Regelung bringt „dürfen“ den permissiven Sinn natürlich zum Ausdruck, ohne den Inhalt auszuweiten.
- source_word: τοῖς ἑαυτῶν δαπανήμασιν
  choice: ihrer eigenen Mittel
  rationale: δαπάνημα kann Aufwendungen oder materielle Mittel bezeichnen. „Mittel“ ist im Deutschen idiomatisch und lässt offen, ob Geldmittel, Ausgaben oder Mittel zum Unterhalt gemeint sind; die engere Alternative wird in der Fußnote genannt.
- source_word: νόμοις
  choice: Gesetze
  rationale: νόμος bezeichnet hier am unmittelbarsten die eigenen Gesetze der Juden; „Bräuche“ wäre möglich, aber weniger formal und nicht erforderlich.
- source_word: καθὰ καὶ τὸ πρότερον
  choice: wie zuvor
  rationale: Die knappe Wendung gibt die Wiederherstellung der früheren Praxis natürlich und genau wieder.
- source_word: παρενοχληθήσεται
  choice: wird … behelligt werden
  rationale: Das Futur Passiv bezeichnet störendes Eingreifen oder Drangsalierung. „Behelligt werden“ passt zu einem amtlichen Zusicherungs- oder Erlasskontext und ist weniger umgangssprachlich als „belästigt werden“.
- source_word: περὶ τῶν ἠγνοημένων
  choice: wegen dessen, was aus Unwissenheit geschehen ist
  rationale: Die substantivierte Perfekt-Passiv-Form lässt die betreffenden Handlungen oder Sachverhalte unbestimmt. Die Wiedergabe wahrt diese Weite und den Gedanken mangelnden Wissens; περὶ hat in diesem Zusammenhang den Sinn „wegen/hinsichtlich“.
theological_decisions: []
translation_notes:
  register: Moderner, würdiger Erlassstil. Die Konstruktion „sich … ihrer … Gesetze bedienen“ bleibt bewusst nah am griechischen Dativgefüge, obwohl sie im Deutschen leicht formell klingt. Die unbestimmte Formulierung zu dem aus Unwissenheit Geschehenen wird nicht näher ausgelegt.
