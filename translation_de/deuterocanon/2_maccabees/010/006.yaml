base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/010/006.yaml
  text: But when those around Makkabaios[a], while besieging it, gained possession of the strongholds, with lamentations and tears they, together with the crowds[b], pleaded with the Lord to send a good angel for the salvation of Israel.
translation:
  language: de
  text: Als aber die Männer um Makkabäus die Befestigungen in Besitz nahmen, während Makkabäus ihn belagerte[a], flehten sie zusammen mit den Menschenmengen unter Klagen und Tränen den Herrn an, einen guten Engel[b] zur Rettung Israels zu senden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich steht im Griechischen knapp: „während Makkabäus ihn belagerte“. Worauf sich „ihn“ bezieht, ist in diesem Satz nicht eindeutig; dem Zusammenhang nach kann ein befestigter Ort gemeint sein.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „einen wohlwollenden Engel“. Das griechische „gut“ kann den Charakter des Engels oder seine hilfreiche Aufgabe bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ περὶ τὸν Μακκαβαῖον
  choice: die Männer um Makkabäus
  rationale: Die griechische Wendung bezeichnet die Gefährten beziehungsweise Gefolgsleute des Makkabäus. Die deutsche Fassung ist natürlich, ohne ihnen einen nicht ausdrücklich genannten militärischen Rang zuzuschreiben.
- source_word: μετέλαβον
  choice: nahmen … in Besitz
  rationale: Im militärischen Zusammenhang bezeichnet das Verb die Erlangung der Verfügungsgewalt. „In Besitz nehmen“ bleibt näher am Bedeutungsumfang als das stärker zugespitzte „erobern“.
- source_word: τὰ ὀχυρώματα
  choice: die Befestigungen
  rationale: Das Substantiv bezeichnet befestigte Plätze oder Anlagen. „Befestigungen“ ist präzise und lässt offen, ob einzelne Festungen oder befestigte Stellungen gemeint sind.
- source_word: πολιορκοῦντα αὐτόν
  choice: während er den belagerten Ort einschloss
  rationale: Das Partizip bezeichnet eine gleichzeitig stattfindende Belagerung. Das maskuline Pronomen hat im vorgelegten Satz keinen eindeutigen ausdrücklich genannten Bezug; die Übersetzung gibt den aus dem militärischen Zusammenhang erschlossenen Ort wieder und kennzeichnet die Schwierigkeit in einer Fußnote.
- source_word: μετὰ ὀδυρμῶν καὶ δακρύων
  choice: unter Klagen und Tränen
  rationale: Die Wendung bewahrt die starke emotionale Sprache des Griechischen und klingt zugleich in modernem Deutsch würdig und idiomatisch.
- source_word: ἱκέτευον
  choice: flehten … an
  rationale: Das Verb bezeichnet eindringliches Bitten oder inständiges Flehen und ist stärker als ein schlichtes „bitten“.
- source_word: τὸν κύριον
  choice: den Herrn
  rationale: Im jüdischen Schriftkontext ist „der Herr“ die angemessene ehrerbietige Wiedergabe für κύριος als Gottesbezeichnung.
- source_word: ἀγαθὸν ἄγγελον
  choice: einen guten Engel
  rationale: Die wörtliche Wiedergabe lässt offen, ob ἀγαθός den Charakter des Engels oder seine wohltätige Aufgabe hervorhebt.
- source_word: ἀποστεῖλαι πρὸς σωτηρίαν τῷ Ἰσραήλ
  choice: zur Rettung Israels zu senden
  rationale: „Rettung“ gibt σωτηρία im konkreten Gefahren- und Kampfzusammenhang klar wieder, ohne die weiterreichende theologische Bedeutung des Wortes auszuschließen.
theological_decisions:
- issue: Bedeutung von ἀγαθὸν ἄγγελον
  choice: einen guten Engel
  alternative: einen hilfreichen oder wohlwollenden Engel
  rationale: Der griechische Text bestimmt weder die Identität des Engels noch die genaue Hinsicht seines Gutseins. Die wörtliche Fassung bewahrt diese Zurückhaltung.
- issue: Bezug von πολιορκοῦντα αὐτόν
  choice: Bezug auf den belagerten Ort, mit offengelegter syntaktischer Unsicherheit
  alternative: „während er ihn belagerte“, mit möglichem Bezug auf eine männliche Person
  rationale: Das griechische Pronomen ist maskulin und sein Bezug im isoliert vorgelegten Satz unklar. Der militärische Zusammenhang legt einen befestigten Ort als Sinn nahe; die Fußnote verhindert, dass diese Deutung als grammatisch eindeutig erscheint.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit verständlicher militärischer Begrifflichkeit. Die syntaktische Rauheit des griechischen Pronominalbezugs wird im Haupttext lesbar wiedergegeben und in der Fußnote ausdrücklich offengelegt; die theologische Unbestimmtheit des „guten Engels“ bleibt erhalten.
