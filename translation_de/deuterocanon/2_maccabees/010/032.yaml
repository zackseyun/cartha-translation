lexical_decisions:
- source_word: πέπομφα
  choice: habe ich gesandt
  rationale: Das Perfekt bezeichnet die vollzogene Sendung mit gegenwärtiger Relevanz; das deutsche Perfekt gibt dies natürlich wieder.
- source_word: δὲ καὶ
  choice: Auch
  rationale: καί hebt Menelaus als zusätzlich Gesandten hervor; δέ führt den weiteren Punkt fort und muss im Deutschen nicht eigens mit »aber« wiedergegeben werden.
- source_word: παρακαλέσοντα
  choice: damit er ... eindringlich bittet
  rationale: Das futurische Partizip bezeichnet den Zweck der Sendung. παρακαλέω kann je nach Zusammenhang bitten, ermahnen oder auffordern bedeuten; »eindringlich bitten« wahrt den appellativen Nachdruck, ohne einen bloßen Befehl zu unterstellen.
