lexical_decisions:
- source_word: ἐπὶ τοῦ πατρὸς ἡμῶν … μεταστάντος
  choice: Da unser Vater … hinübergegangen ist
  rationale: Die Konstruktion gibt den zeitlichen und zugleich begründenden Rahmen der königlichen Aussage an. „Da“ bewahrt diese Doppelbedeutung im Deutschen knapp und natürlich.
- source_word: εἰς θεοὺς μεταστάντος
  choice: zu den Göttern hinübergegangen ist
  rationale: Die ausdrückliche hellenistische Hofsprache für den Tod wird erhalten, statt sie zu „gestorben ist“ zu verflachen.
- source_word: βουλόμενοι
  choice: wollen wir
  rationale: Das Partizip bezeichnet die erklärte Absicht des königlichen Sprechers; „wollen wir“ passt zum amtlichen Zusammenhang und ist im modernen Deutsch direkt.
- source_word: τοὺς ἐκ τῆς βασιλείας
  choice: die Bewohner des Reiches
  rationale: Gemeint sind die Menschen beziehungsweise Untertanen innerhalb des Herrschaftsgebiets. „Bewohner des Reiches“ ist verständlicher als das wörtlichere „die aus dem Reich“.
- source_word: ἀπερισπάστως ὄντας
  choice: unbehelligt bleiben
  rationale: Das Adverb bezeichnet einen Zustand ohne Ablenkung, Störung oder widerstreitende Beanspruchung. Im politisch-administrativen Zusammenhang gibt „unbehelligt“ diesen Sinn natürlich wieder.
- source_word: γενέσθαι πρὸς τὴν τῶν Ἰουδαίων ἐπιμέλειαν
  choice: sich um die Angelegenheiten der Juden kümmern
  rationale: ἐπιμέλεια kann Sorge, Aufmerksamkeit oder administrative Betreuung bezeichnen. Die Formulierung wahrt den breiten Verwaltungssinn, ohne ausschließlich wohlwollende Fürsorge zu unterstellen.
theological_decisions:
- issue: Polytheistische königliche Todesformel εἰς θεοὺς μεταστάντος
  choice: zu den Göttern hinübergegangen ist
  alternative: gestorben ist
  rationale: Die Übersetzung bewahrt die Perspektive und Ausdrucksweise des seleukidischen Hofes. Sie gibt diese Redeweise wieder, ohne sie als Aussage des Übersetzers zu bestätigen.
- issue: Mehrdeutigkeit von ἐπιμέλεια
  choice: sich um die Angelegenheiten der Juden kümmern
  alternative: für die Juden sorgen
  rationale: Die gewählte Fassung lässt offen, ob fürsorgliche, administrative oder allgemein beaufsichtigende Tätigkeit gemeint ist, und vermeidet damit eine unnötige theologische oder politische Festlegung.
translation_notes:
  register: Moderne, würdige Standardsprache mit amtlichem Ton. Die polytheistische Hofsprache bleibt sichtbar. Das abschließende Komma wurde beibehalten, da der vorgelegte griechische Text syntaktisch in den folgenden Zusammenhang weiterführt.
