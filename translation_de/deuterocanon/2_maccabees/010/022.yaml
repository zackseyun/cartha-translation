lexical_decisions:
- source_word: Ἡ ... τοῦ βασιλέως ἐπιστολή
  choice: Der Brief des Königs
  rationale: ἐπιστολή bezeichnet hier ein förmliches Schreiben; „Brief“ ist die natürliche, gegenwärtige deutsche Entsprechung.
- source_word: δὲ
  choice: aber
  rationale: Die weiterführende beziehungsweise leicht kontrastierende Partikel wird beibehalten. Ohne den vorausgehenden Kontext könnte auch „und“ passend sein.
- source_word: περιεῖχεν οὕτως
  choice: hatte folgenden Wortlaut
  rationale: Wörtlich steht etwa „enthielt so“. Die gewählte Formulierung gibt die Einleitung des Briefinhalts im Deutschen idiomatisch und dennoch quellennah wieder.
- source_word: Βασιλεὺς Ἀντίοχος
  choice: König Antiochus
  rationale: Βασιλεύς fungiert in der Absenderformel als Herrschertitel; der Personenname wird in der üblichen deutschen Form wiedergegeben.
- source_word: τῷ ἀδελφῷ Λυσίᾳ
  choice: seinen Bruder Lysias
  rationale: Der Dativ bezeichnet den Empfänger. Das im Deutschen nötige Possessivpronomen ergibt sich aus der Briefanrede; „Bruder“ bewahrt die mögliche familiäre wie auch höfische Bedeutung.
- source_word: χαίρειν
  choice: grüßt
  rationale: χαίρειν ist hier die feststehende griechische Briefformel. „grüßt“ fügt sich natürlich in die deutsche Absender-Empfänger-Formel; das wörtliche „sich freuen“ wäre irreführend.
theological_decisions:
- issue: Bedeutung von ἀδελφός in der königlichen Anrede
  choice: Bruder, mit erklärender Fußnote
  alternative: Verwandter; Amtsbruder; enger Vertrauter
  rationale: Der griechische Text entscheidet nicht, ob eine leibliche Verwandtschaft oder ein höfischer Ehrentitel gemeint ist. Die Übersetzung lässt diese Spannung bestehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die königliche Briefformel klingt förmlich, bleibt aber für heutige Leser unmittelbar verständlich. Der erhebliche Widerspruch zwischen angegebener Versreferenz und geliefertem griechischem Text wird transparent ausgewiesen.
