  register: Modernes, würdevolles Standarddeutsch. Die behördlich-diplomatische Sprache des Briefkontexts bleibt erkennbar. Die im Griechischen nicht näher bestimmte Bitte wird nicht durch eine ergänzte Auskunft, Entscheidung oder Genehmigung konkretisiert.
