  text: John and Absalom[a], who were sent from you, after delivering the written document, asked about the matters indicated by it.
translation:
  language: de
  text: Johannes und Absalom, die von euch gesandt worden waren, übergaben das schriftlich abgefasste Schreiben[a] und äußerten hinsichtlich der darin bezeichneten Angelegenheiten eine Bitte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die schriftliche Mitteilung“ oder „die schriftliche Verfügung“. Der griechische Ausdruck kann eine schriftliche Mitteilung oder Weisung bezeichnen, ohne deren genaue Gattung eindeutig festzulegen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰωάνης
  choice: Johannes
  rationale: Der Personenname wird in der im Deutschen geläufigen biblischen Form wiedergegeben.
- source_word: Ἀβεσσαλώμ
  choice: Absalom
  rationale: Der Personenname wird in seiner geläufigen deutschen biblischen Form wiedergegeben.
- source_word: οἱ πεμφθέντες παρʼ ὑμῶν
  choice: die von euch gesandt worden waren
  rationale: Die Relativsatzform ist im Deutschen natürlich; das Plusquamperfekt verdeutlicht, dass die Entsendung der Übergabe und Bitte vorausging.
- source_word: ἐπιδόντες
  choice: übergaben
  rationale: Das Aoristpartizip bezeichnet eine der Haupthandlung vorausgehende Übergabe. Die Koordination ergibt einen klaren, natürlichen deutschen Satz.
- source_word: τὸν ὑπογεγραμμένον χρηματισμόν
  choice: das nachstehend wiedergegebene amtliche Schreiben
  rationale: ὑπογεγραμμένον kann hier auf den im Folgenden niedergeschriebenen Wortlaut weisen; χρηματισμός bezeichnet eine förmliche Mitteilung oder Verfügung. „Amtliches Schreiben“ wahrt den offiziellen Charakter, ohne sicher auf einen Erlass festzulegen.
- source_word: ἠξίουν περὶ
  choice: brachten wegen … eine Bitte vor
  rationale: ἀξιόω bezeichnet hier ein Ersuchen. Die Formulierung bewahrt, dass der griechische Satz den genauen Inhalt beziehungsweise die erbetene Maßnahme nicht ausdrücklich nennt.
- source_word: τῶν διʼ αὐτοῦ σημαινομένων
  choice: der darin bezeichneten Angelegenheiten
  rationale: Das Pronomen bezieht sich am natürlichsten auf das Schreiben; σημαινομένων bezeichnet das darin Mitgeteilte oder kenntlich Gemachte.
