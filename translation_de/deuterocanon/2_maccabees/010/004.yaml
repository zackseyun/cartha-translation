  text: not at all taking into account the might of God[a], but puffed up by the tens of thousands of foot soldiers, the thousands of horsemen, and the eighty elephants.
translation:
  language: de
  text: Er berücksichtigte Gottes Macht überhaupt nicht, sondern war durch die Zehntausende Fußsoldaten, die Tausende Reiter und die achtzig Elefanten überheblich geworden.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐδάμως ἐπιλογιζόμενος
  choice: rechnete überhaupt nicht mit
  rationale: Die Formulierung bewahrt die nachdrückliche Verneinung und gibt den Gedanken des erwägenden Kalkulierens im militärischen Zusammenhang natürlich wieder.
- source_word: τὸ τοῦ θεοῦ κράτος
  choice: Gottes Macht
  rationale: κράτος bezeichnet hier Gottes wirksame Stärke im Gegensatz zu menschlichen Streitkräften. „Macht“ ist im Deutschen klar und lässt sich idiomatisch mit „rechnen mit“ verbinden.
- source_word: πεφρονηματισμένος
  choice: war überheblich
  rationale: Das Perfektpartizip beschreibt einen gefestigten Zustand stolzer Selbstüberschätzung. „Überheblich“ ist gegenwärtiges, verständliches Deutsch und vermeidet das weniger natürliche „aufgebläht“.
- source_word: ταῖς μυριάσιν τῶν πεζῶν
  choice: im Vertrauen auf die Zehntausende Fußsoldaten
  rationale: Der Dativ benennt die militärischen Mittel, auf die sich der Hochmut stützt. „Zehntausende“ erhält den möglichen Zahlenwert von μυριάδες, ohne starre Truppeneinheiten vorauszusetzen.
- source_word: ταῖς χιλιάσι τῶν ἱππέων
  choice: die Tausende Reiter
  rationale: Der Plural χιλιάσιν bezeichnet mehrere Tausende; „Reiter“ gibt ἱππεῖς unmittelbar und verständlich wieder.
- source_word: τοῖς ἐλέφασιν τοῖς ὀγδοήκοντα
  choice: die achtzig Elefanten
  rationale: Die bestimmte Zahlenangabe und der bekannte Truppenbestand werden direkt wiedergegeben.
theological_decisions:
- issue: Bedeutung von κράτος in Bezug auf Gott
  choice: Gottes Macht
  alternative: Gottes Stärke; Gottes Herrschaft
  rationale: Der unmittelbare Gegensatz gilt Gottes wirksamer Macht gegenüber zahlenmäßig überlegenen menschlichen Streitkräften. „Herrschaft“ würde den Akzent unnötig auf Souveränität statt auf Kraft im Konflikt verschieben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das im griechischen Partizipialsatz nicht eigens genannte Subjekt wird für einen selbstständig lesbaren deutschen Vers mit „Er“ aufgenommen. Die Reihung der drei militärischen Machtmittel bleibt erhalten.
