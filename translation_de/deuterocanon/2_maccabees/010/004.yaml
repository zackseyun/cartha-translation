  source_fidelity: 'Die emphatische Verneinung (οὐδάμως), das Berücksichtigen bzw. Einkalkulieren von Gottes Macht (ἐπιλογιζόμενος τὸ τοῦ θεοῦ κράτος) und die gestaffelte Aufzählung der militärischen Mittel sind zutreffend wiedergegeben. „Im Vertrauen auf“ schwächt bzw. verschiebt jedoch πεφρονηματισμένος: Das Partizip bezeichnet hier das Hochmütig-/Aufgeblähtsein aufgrund dieser Streitmacht, nicht primär ein vertrauendes Sichverlassen auf sie.'
