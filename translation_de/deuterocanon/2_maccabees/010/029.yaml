translation:
  language: de
  text: Menelaus teilte uns mit, dass er wünschte, ihr möchtet, nachdem ihr herabgekommen wart, bei euren eigenen Leuten sein.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: »zu euren eigenen Leuten gehören«, »zu eurer eigenen Seite gehören« oder »euch euren eigenen Leuten anschließen«. Die griechische Wendung ist knapp und lässt die genaue Art der Zugehörigkeit offen.'
    reason: lexical_alternative
  - marker: b
    text: Der überlieferte griechische Satz ist syntaktisch schwierig. Das Partizip kann ausdrücken, dass das Herabkommen dem Bei-den-Eigenen-Sein vorausgeht; die genaue Verbindung der Satzteile bleibt gedrängt.
    reason: textual_variant
lexical_decisions:
- source_word: ἐνεφάνισεν
  choice: teilte uns mit
  rationale: Das Verb bezeichnet hier das Bekanntmachen oder Mitteilen; die deutsche Wendung gibt den Dativ ἡμῖν natürlich wieder.
- source_word: βουλόμενος
  choice: er wünsche
  rationale: Das Partizip drückt den Wunsch oder die Absicht des Menelaus aus. Die aufgelöste Form ist im Deutschen klar und bewahrt den Bezug auf Menelaus.
- source_word: κατελθόντας
  choice: dass ihr herabkommt
  rationale: Das aoristische Partizip bezeichnet das Herabkommen der Angesprochenen. In der komprimierten griechischen Konstruktion liegt grundsätzlich eine Vorzeitigkeit nahe, doch eine koordinierte deutsche Wiedergabe vermeidet eine schwerfällige und möglicherweise überpräzise zeitliche Festlegung.
- source_word: γίνεσθαι πρὸς τοὺς ἰδίους
  choice: euch euren eigenen Leuten anschließt
  rationale: Wörtlich steht eine komprimierte Wendung im Sinn von „bei/zu den Eigenen werden oder sein“. „Sich anschließen“ gibt den naheliegenden sozialen oder politischen Sinn wieder, ohne die im Griechischen nicht ausdrücklich enthaltene Vorstellung einer Wiederherstellung einzutragen.
- source_word: τοὺς ἰδίους
  choice: euren eigenen Leuten
  rationale: Der substantivierte Ausdruck bezeichnet die eigene Gruppe, die eigenen Leute oder die eigene Seite. „Eure eigenen Leute“ ist verständlich und lässt die genaue Art der Zugehörigkeit offen.
