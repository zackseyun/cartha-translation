  text: After gathering about eighty thousand men and all the cavalry[a], he came against the Jews, thinking to make the city a dwelling place for Greeks[b],
translation:
  language: de
  text: Nachdem er etwa achtzigtausend Mann[a] und die gesamte Reiterei zusammengezogen hatte, rückte er gegen die Juden vor, in dem Gedanken, die Stadt zu einem Wohnort für Griechen zu machen[b],
  philosophy: optimal-equivalence
