    reason: cross_reference
lexical_decisions:
- source_word: συναθροίσας
  choice: Nachdem er … zusammengezogen hatte
  rationale: Das Aoristpartizip bezeichnet eine Handlung, die dem Vorrücken vorausgeht; die deutsche Nebensatzkonstruktion gibt diese zeitliche Abfolge natürlich wieder.
- source_word: περὶ τὰς ὀκτὼ μυριάδας
  choice: etwa achtzigtausend Mann
  rationale: περί bezeichnet bei Zahlen eine ungefähre Angabe; acht Myriaden entsprechen achtzigtausend. „Mann“ wird aus dem militärischen Zusammenhang ergänzt.
- source_word: τὴν ἵππον ἅπασαν
  choice: die gesamte Reiterei
  rationale: ἵππος bezeichnet hier kollektiv die Kavallerie, während ἅπασαν deren Gesamtheit hervorhebt.
- source_word: παρεγένετο ἐπὶ τοὺς Ἰουδαίους
  choice: rückte er gegen die Juden vor
  rationale: Die Verbindung mit ἐπί und Akkusativ beschreibt im militärischen Kontext eine gegen einen Gegner gerichtete Bewegung, nicht bloß ein Eintreffen.
- source_word: λογιζόμενος
  choice: in dem Gedanken
  rationale: Die Formulierung bewahrt den mentalen Aspekt des Erwägens beziehungsweise Planens, ohne den Gedanken als bereits feststehenden Beschluss darzustellen.
- source_word: τὴν μὲν πόλιν
  choice: die Stadt
  rationale: Gemeint ist die im Kontext bestimmte Stadt. Das korrespondierende μέν weist auf einen Gegensatz hin, dessen Fortsetzung erst im nächsten Vers folgt.
- source_word: Ἕλλησιν
  choice: für Griechen
  rationale: Der Dativ bezeichnet diejenigen, denen die Stadt als Wohnort dienen soll. „Griechen“ ist im heutigen Deutsch klarer und geläufiger als „Hellenen“.
- source_word: οἰκητήριον ποιήσειν
  choice: zu einem Wohnort … zu machen
  rationale: Die Infinitivverbindung bezeichnet die beabsichtigte Umgestaltung der Stadt zu einem Ort dauerhaften Wohnens.
