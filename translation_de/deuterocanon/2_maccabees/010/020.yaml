  text: But concerning these matters in detail[b][a], I have instructed both these men and those from me to speak with you.
translation:
  language: de
  text: Über diese Angelegenheiten im Einzelnen[a] habe ich sowohl diesen Männern als auch denen, die von mir kommen,[b] aufgetragen, mit euch zu sprechen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Punkt für Punkt« bzw. »ausführlich« (κατὰ μέρος).'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »denen von mir«; gemeint sind wahrscheinlich Beauftragte oder Abgesandte des Schreibers.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπὲρ δὲ τούτων
  choice: Über diese Angelegenheiten
  rationale: 'ὑπέρ mit dem Genitiv bezeichnet hier im brieflichen Zusammenhang das Thema: »über« bzw. »hinsichtlich«. Das deutsche »über« ist natürlich und präzise.'
- source_word: κατὰ μέρος
  choice: im Einzelnen
  rationale: Die Wendung bezeichnet eine Behandlung nach einzelnen Punkten oder im Detail. »Im Einzelnen« bewahrt diesen Sinn in idiomatischem Deutsch.
- source_word: ἐντέταλμαι
  choice: habe ich … aufgetragen
  rationale: Das Perfekt von ἐντέλλομαι bezeichnet einen erteilten Auftrag mit fortdauernder Geltung. »Aufgetragen« entspricht dem formellen Ton, ohne die Stärke von »befohlen« aufzuzwingen.
- source_word: τούτους τε καὶ τοὺς παρʼ ἐμοῦ
  choice: sowohl diesen Männern als auch denen von mir
  rationale: Die korrelative Verbindung τε καί umfasst zwei Personengruppen. »Denen von mir« gibt παρʼ ἐμοῦ bewusst wörtlich wieder und vermeidet die nicht ausdrücklich im Griechischen stehende Ergänzung »gesandt«.
- source_word: διαλεχθῆναι ὑμῖν
  choice: mit euch zu sprechen
  rationale: διαλέγομαι kann ein Gespräch, eine Erörterung oder Verhandlung bezeichnen. »Mit euch zu sprechen« wahrt die Bedeutungsbreite und gibt dem Dativ ὑμῖν im Deutschen natürlich Ausdruck.
