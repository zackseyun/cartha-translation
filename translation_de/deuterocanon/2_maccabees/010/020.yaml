translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit brieflich-diplomatischem Ton. Die ungewöhnliche Formulierung »denen von mir« bleibt im Text stehen, um die Offenheit des griechischen Ausdrucks nicht durch »meinen Abgesandten« oder »den von mir Gesandten« vorzeitig festzulegen.
