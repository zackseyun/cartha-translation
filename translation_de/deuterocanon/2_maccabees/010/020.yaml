revisions:
- from: Über diese Angelegenheiten im Einzelnen[a] habe ich sowohl diesen Männern als auch denen von mir[b] aufgetragen, mit euch zu sprechen.
  to: Über diese Angelegenheiten im Einzelnen[a] habe ich sowohl diesen Männern als auch denen, die von mir kommen,[b] aufgetragen, mit euch zu sprechen.
  rationale: Die einzige Änderung ersetzt die unidiomatische Wortfolge »denen von mir« durch »denen, die von mir kommen«. Damit wird die Personenbezeichnung im Deutschen verständlich, während die Fußnote die wörtliche griechische Form und die wahrscheinliche, aber nicht explizit ausgedrückte Funktion als Beauftragte dokumentiert. Die übrigen Formulierungen bleiben unverändert.
