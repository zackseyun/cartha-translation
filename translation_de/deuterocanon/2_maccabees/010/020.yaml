  source_fidelity: Die Übersetzung trifft ὑπὲρ δὲ τούτων, κατὰ μέρος, das Perfekt ἐντέταλμαι sowie die Zweiteilung τούτους τε καὶ τοὺς παρʼ ἐμοῦ grundsätzlich zutreffend. Die Formulierung »denen von mir« ist jedoch im Deutschen nicht tragfähig und verschleiert die syntaktische und kommunikative Funktion der bezeichneten Personengruppe. »denen, die von mir kommen« gibt παρʼ ἐμοῦ idiomatisch wieder, ohne ausdrücklich »gesandt« zu behaupten.
  naturalness: »Über diese Angelegenheiten im Einzelnen« und »mit euch zu sprechen« sind natürlich und dem formell-brieflichen Register angemessen. »Denen von mir« ist dagegen keine natürliche moderne deutsche Personenbezeichnung. Die Relativformulierung ist klar und bewahrt den zurückhaltenden Charakter des griechischen Ausdrucks.
  terminology: »Aufgetragen« gibt ἐντέταλμαι passend wieder; »im Einzelnen« ist eine gute Wiedergabe von κατὰ μέρος. Für παρʼ ἐμοῦ sollte die Fußnote den wörtlichen Ausdruck erklären und die mögliche Funktion als Vertreter offen markieren, ohne sie im Haupttext zwingend festzulegen.
