review_pass:
  verdict: revise
  source_fidelity: Die Wiedergabe von ἔπεισεν und der schwierigen Wendung συλλύεσθαι ἐπὶ πᾶσι τοῖς δικαίοις ist im Grundsatz tragfähig. Jedoch fügt „sagte zu“ ein im Griechischen nicht ausgedrücktes Sprechereignis hinzu und schwächt bzw. verändert die syntaktische Verbindung von διότι, πείσει und ἀναγκάζων. Die starke Bedeutung von ἀναγκάζων sollte ausdrücklich erhalten bleiben.
  naturalness: „sich in allen berechtigten Punkten zu einigen“ ist verständlich und modernes Standarddeutsch. Die revidierte Satzfügung ist etwas dichter am schwierigen griechischen Satzbau, bleibt aber natürlich lesbar.
  terminology: „gerechten Angelegenheiten“ gibt τοῖς δικαίοις als substantiviertes Neutrum angemessen wieder, ohne daraus speziell „Forderungen“ zu machen. „ihr Freund“ wahrt die politische Freundschaftssprache von φίλον αὐτοῖς.
  issues:
  - severity: medium
    issue: „und sagte zu“ ist eine zusätzliche, nicht ausdrücklich im griechischen Text vorhandene Aussagehandlung.
    rationale: διότι kann Inhalt oder Begründung einleiten, rechtfertigt aber nicht ohne Weiteres die Ergänzung „sagte zu“. Die Ergänzung legt die Konstruktion zu stark als ausdrückliches Versprechen aus.
  - severity: medium
    issue: Die deutsche Koordination ordnet „ihn dazu zu zwingen“ dem zuvor genannten „ihn“ zu und verdeckt die im Griechischen bei ἀναγκάζων bestehende enge Verbindung mit dem König.
    rationale: Das Partizip ἀναγκάζων bezeichnet weiterhin starken Zwang und ist am naheliegendsten auf den König als den zum Freundwerden Gedrängten bezogen. Die Übersetzung sollte dies klarer ausdrücken.
  revised_text: Er bewog ihn, sich in allen gerechten Angelegenheiten zu einigen,[a] weil er auch den König überzeugen werde und ihn dazu zwingen werde, ihr Freund zu werden.[b]
  revised_footnotes:
  - marker: a
    text: Das hier verwendete griechische Verb ist in diesem Textzeugen textlich und lexikalisch schwierig. Gemeint ist wahrscheinlich eine Einigung oder Aussöhnung über das, was als recht und billig galt.
    reason: textual_variant
  - marker: b
    text: 'Das griechische Bindewort kann auch den Inhalt der Überredung einleiten: „dass er auch den König überzeugen werde“. Das Partizip kann dabei ausdrücken, dass der König mit Nachdruck dazu gedrängt werde, ihr Freund zu werden.'
    reason: lexical_alternative
  revision_rationale: Die Revision entfernt die ungesicherte Ergänzung „sagte zu“, erhält die mögliche begründende Lesart von διότι im Haupttext und dokumentiert die Inhaltslesart in der Fußnote. Zugleich wird die Zwangskomponente von ἀναγκάζων bewahrt und der Bezug auf den König klar formuliert, ohne die wegen des schwierigen Textes verbleibende Unsicherheit zu verschleiern.
