base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/010/014.yaml
  text: He persuaded him to come to terms on all the just demands[a], and that he would also persuade the king[b], compelling him to become their friend.
translation:
  language: de
  text: Er bewog ihn, sich in allen berechtigten Punkten zu einigen,[a] und sagte zu, auch den König zu überzeugen und ihn dazu zu zwingen, ihr Freund zu werden.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hier verwendete griechische Verb ist in diesem Textzeugen textlich und lexikalisch schwierig. Gemeint ist wahrscheinlich eine Einigung oder Aussöhnung über das, was als recht und billig galt.
    reason: textual_variant
  - marker: b
    text: 'Oder: „weil er auch den König überzeugen werde, indem er ihn zwang, ihr Freund zu werden“. Das griechische Bindewort kann hier eine Zusage beziehungsweise einen Inhalt oder eine Begründung einleiten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔπεισεν
  choice: Er bewog ihn
  rationale: Der Aorist von πείθω bezeichnet hier, dass jemand zu einem diplomatischen Schritt gebracht wird. „Bewog“ verbindet sich im Deutschen natürlich mit dem folgenden Infinitiv und lässt die im Griechischen nicht ausdrücklich genannten Beteiligten unbestimmt.
- source_word: συλλύεσθαι
  choice: sich … zu einigen
  rationale: Das seltene und in diesem Textzeugen schwierige Verb bezeichnet im Zusammenhang am ehesten das Zustandekommen einer Einigung oder Aussöhnung. Die Formulierung legt sich nicht auf einen förmlichen Vertrag fest.
- source_word: ἐπὶ πᾶσι τοῖς δικαίοις
  choice: in allen berechtigten Punkten
  rationale: Das substantivierte δικαίοις meint das Rechte oder Billige, auf das sich die Verhandlungen beziehen. „Berechtigte Punkte“ ist idiomatisch und vermeidet die zusätzliche Festlegung, es handle sich ausschließlich um Forderungen.
- source_word: διότι καὶ τὸν βασιλέα πείσει
  choice: und sagte zu, auch den König zu überzeugen
  rationale: διότι kann einen Grund oder den Inhalt der Überredung einführen. Im Zusammenhang wird es als Zusage wiedergegeben; der Zukunftssinn von πείσει bleibt erhalten.
- source_word: φίλον αὐτοῖς
  choice: ihr Freund
  rationale: Die Wendung bezeichnet eine ihnen gegenüber freundschaftliche beziehungsweise politisch wohlwollende Haltung. Die knappe Wiedergabe wahrt das Bild des griechischen Textes.
- source_word: ἀναγκάζων γενέσθαι
  choice: und ihn dazu zu zwingen, … zu werden
  rationale: Das Partizip von ἀναγκάζω drückt starken Zwang aus und bezieht sich am naheliegendsten auf den König; die deutsche Koordination gibt den sachlichen Zusammenhang klar wieder.
