base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/010/009.yaml
  text: And all together they blessed the merciful God and were strengthened in their souls[b][a], being ready to wound not only men but even the fiercest wild beasts and iron walls.
translation:
  language: de
  text: Und alle gemeinsam priesen den barmherzigen Gott und wurden in ihren Seelen gestärkt[a]. Sie waren bereit, nicht nur Menschen, sondern sogar die wildesten Tiere und eiserne Mauern zu verwunden[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wurden innerlich gestärkt“; sinngemäß: „fassten Mut“.'
    reason: lexical_alternative
  - marker: b
    text: Die Aussage, sogar „eiserne Mauern zu verwunden“, ist wohl eine bewusste Übertreibung und bringt ihren außerordentlichen Kampfesmut zum Ausdruck.
    reason: cultural_note
lexical_decisions:
- source_word: ὁμοῦ δὲ πάντες
  choice: Und alle gemeinsam
  rationale: Gibt sowohl die Gesamtheit der Gruppe (πάντες) als auch ihr gemeinsames Handeln (ὁμοῦ) wieder; das einleitende δέ wird im Zusammenhang schlicht mit „Und“ angeschlossen.
- source_word: εὐλόγησαν
  choice: priesen
  rationale: Beim Handeln von Menschen gegenüber Gott bezeichnet εὐλογέω das lobende Preisen. „Priesen“ ist im heutigen Deutschen natürlicher als „segneten“, ohne den religiösen Sinn abzuschwächen.
- source_word: τὸν ἐλεήμονα θεόν
  choice: den barmherzigen Gott
  rationale: „Barmherzig“ entspricht dem biblischen Bedeutungsgehalt von ἐλεήμων und wahrt einen würdigen, allgemein verständlichen Sprachton.
- source_word: ἐπερρώσθησαν ταῖς ψυχαῖς
  choice: wurden in ihren Seelen gestärkt
  rationale: Bewahrt sowohl die passive Form als auch die Bildsprache von ψυχαῖς. Gemeint ist innere Festigung beziehungsweise neuer Mut, ohne dass daraus eine technische Seelenlehre abgeleitet werden muss.
- source_word: οὐ μόνον ἀνθρώπους θῆρας δὲ τοὺς ἀγριωτάτους καὶ σιδηρᾶ τείχη
  choice: nicht nur Menschen, sondern sogar die wildesten Tiere und eiserne Mauern
  rationale: Erhält die steigernde Reihung des griechischen Textes. „Sogar“ macht den Übergang zu den außergewöhnlichen Zielen deutlich, ohne die Hyperbel aufzulösen.
- source_word: τιτρώσκειν
  choice: zu verwunden
  rationale: Gibt die Grundbedeutung „verwunden, verletzen“ wieder. Die ungewöhnliche Verbindung mit „eisernen Mauern“ bleibt bewusst erhalten, da sie die drastische Übertreibung des Ausgangstextes trägt.
- source_word: ὄντες ἕτοιμοι
  choice: Sie waren bereit
  rationale: Löst die griechische Partizipialfügung in einen eigenständigen deutschen Satz auf und hält zugleich den Folgezusammenhang zwischen innerer Stärkung und Kampfbereitschaft fest.
theological_decisions:
- issue: Anthropologische Bedeutung von ψυχαῖς
  choice: in ihren Seelen
  alternative: innerlich; im Geist; sie fassten Mut
  rationale: Die Formulierung bewahrt den Ausdruck des griechischen Textes, ohne ψυχή als dogmatischen Fachbegriff festzulegen. Im Zusammenhang bezeichnet die Wendung vor allem die innere Entschlossenheit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die leicht ungewöhnlichen Wendungen „in ihren Seelen“ und „Mauern zu verwunden“ bleiben erhalten, um die Bildsprache und Spannung des griechischen Textes sichtbar zu machen; die Satzteilung sorgt zugleich für gute Verständlichkeit.
