base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/010/005.yaml
  text: But when he entered Judea and came near Bethsura[a], a fortified place about five schoeni from Jerusalem[b], he was pressing it hard.
translation:
  language: de
  text: Als er aber nach Judäa gekommen war und sich Bet-Zur näherte – einem befestigten Ort, der etwa fünf Schoinen[a] von Jerusalem entfernt lag –, setzte er ihm hart zu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Eine Schoine war ein antikes Längenmaß. Ihr genauer Wert war je nach Zeit und Gegend verschieden; deshalb wird das griechische Maß hier nicht in eine moderne Einheit umgerechnet.
    reason: cultural_note
  - marker: b
    text: 'Oder: „belagerte er ihn“. Wörtlich heißt es im Griechischen: „bedrängte er ihn“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσελθὼν δὲ εἰς τὴν Ἰουδαίαν
  choice: Als er aber nach Judäa gekommen war
  rationale: Das Aoristpartizip wird im Erzählzusammenhang temporal wiedergegeben; δέ erscheint als leicht fortführendes „aber“.
- source_word: συνεγγίσας Βεθσουρῶν
  choice: und sich Bet-Zur näherte
  rationale: συνεγγίζω bezeichnet das Herankommen beziehungsweise Sichnähern. „Bet-Zur“ ist eine im Deutschen verständliche, semitisch orientierte Wiedergabe des Ortsnamens.
- source_word: ὄντι μὲν ἐρυμνῷ χωρίῳ
  choice: einem befestigten Ort
  rationale: ἐρυμνός bezeichnet hier einen militärisch starken oder geschützten Ort; „befestigt“ gibt den Sinn natürlich wieder, ohne den Ort zwingend als Festung zu klassifizieren.
- source_word: Ἱεροσολύμων δὲ ἀπέχοντι ὡσεὶ σχοίνους πέντε
  choice: der etwa fünf Schoinen von Jerusalem entfernt lag
  rationale: ὡσεὶ bleibt mit „etwa“ erkennbar. Da die Länge des antiken Maßes σχοῖνος schwankte, wird es transliteriert und nicht mit Scheingenauigkeit in Kilometer umgerechnet.
- source_word: τοῦτο ἔθλιβε
  choice: setzte er ihm hart zu
  rationale: θλίβω bedeutet wörtlich „drücken, bedrängen“. Die Formulierung passt zum militärischen Zusammenhang, bewahrt aber gegenüber „belagerte“ die weniger technische Aussage des Griechischen.
