lexical_decisions:
- source_word: οὐκ ἀνόους δὲ ὑπάρχων
  choice: Da er jedoch nicht unverständig war
  rationale: Die Formulierung bewahrt die verneinende Ausdrucksweise des Griechischen und gibt ἀνόους als Mangel an Einsicht oder Verstand wieder.
- source_word: πρὸς ἑαυτὸν ἀντιβάλλων
  choice: sondern bei sich ... bedachte
  rationale: Die Wendung bezeichnet ein inneres Abwägen oder Überdenken; „bei sich bedachte“ wahrt den reflexiven und überlegenden Sinn in natürlichem Deutsch.
- source_word: τὸ γεγονὸς περὶ αὐτὸν ἐλάττωμα
  choice: den Rückschlag, den er erlitten hatte
  rationale: ἐλάττωμα kann einen Verlust, Nachteil oder eine Niederlage bezeichnen. „Rückschlag“ lässt die genaue Tragweite offen und passt zum militärischen Zusammenhang.
- source_word: συννοήσας
  choice: und erkannte
  rationale: Das Aoristpartizip bezeichnet hier die gewonnene Einsicht, die seinem folgenden Handeln vorausgeht.
- source_word: ἀνικήτους εἶναι τοὺς Ἑβραίους
  choice: dass die Hebräer unbesiegbar waren
  rationale: „Unbesiegbar“ gibt ἀνικήτους kräftig und idiomatisch wieder; „Hebräer“ entspricht unmittelbar dem ausdrücklich verwendeten Ἑβραίους.
- source_word: τοῦ δυναμένου θεοῦ
  choice: der mächtige Gott
  rationale: Das substantivierte Partizip betont Gottes Macht beziehungsweise Fähigkeit. „Der mächtige Gott“ ist knapp, würdig und im Zusammenhang natürlich.
- source_word: συμμαχοῦντος αὐτοῖς
  choice: an ihrer Seite kämpfte
  rationale: συμμαχέω bezeichnet das Mitkämpfen als Verbündeter; die Übersetzung bewahrt das aktive militärische Bild.
- source_word: προαποστείλας
  choice: sandte er voraus
  rationale: Das Präfix προ- bezeichnet ein vorheriges oder vorausgehendes Senden. Da der griechische Vers syntaktisch in den folgenden Text hineinführt, bleibt auch die deutsche Formulierung bewusst offen.
theological_decisions:
- issue: Bezeichnung Ἑβραίους
  choice: Hebräer
  alternative: Juden
  rationale: Der griechische Text verwendet ausdrücklich Ἑβραίους. Die direkte Wiedergabe vermeidet eine stillschweigende Harmonisierung mit der sonst häufigeren Bezeichnung „Juden“.
- issue: Gottes Beistand im Kampf
  choice: weil der mächtige Gott an ihrer Seite kämpfte
  alternative: weil Gott ihr Verbündeter war
  rationale: Die gewählte Fassung erhält die Aussage vom aktiven Mitkämpfen Gottes und schwächt sie nicht zu allgemeiner Hilfe ab.
- issue: Bedeutung von τοῦ δυναμένου θεοῦ
  choice: der mächtige Gott
  alternative: der Gott, der dazu imstande ist
  rationale: Die idiomatische Fassung betont Gottes Macht, ohne den möglichen wörtlichen Sinn des substantivierten Partizips dogmatisch enger festzulegen; die Alternative wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Partizipialkonstruktionen werden zu einem gut verständlichen Satzgefüge aufgelöst. Der offene Schluss „sandte er voraus“ spiegelt bewusst den syntaktischen Übergang des griechischen Verses in den folgenden Kontext.
