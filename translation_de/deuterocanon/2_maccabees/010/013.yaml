  terminology: Die Gottesbezeichnung „der mächtige Gott“ und die Wiedergabe von συμμαχοῦντος als „an ihrer Seite kämpfte“ sind angemessen. Die Fußnoten bewahren die vorhandenen lexikalischen Alternativen, ohne eine konfessionelle Deutung einzutragen.
