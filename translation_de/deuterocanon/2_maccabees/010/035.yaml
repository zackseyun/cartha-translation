  yaml_path: translation/deuterocanon/2_maccabees/010/035.yaml
  text: Concerning the matters that Lysias[a], the king’s kinsman, has granted to you, we also approve.
translation:
  language: de
  text: Was die Angelegenheiten betrifft, die Lysias, der Verwandte des Königs, euch zugestanden hat, stimmen auch wir zu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπὲρ ὧν
  choice: Was die Angelegenheiten betrifft, die
  rationale: ὑπέρ mit dem Relativpronomen führt hier den Gegenstand der Aussage ein. Die Formulierung ist modernes, klares Deutsch und gibt den durch ὧν bezeichneten Sachverhalt angemessen wieder.
- source_word: Λυσίας
  choice: Lysias
  rationale: Der Personenname wird nach der im Deutschen üblichen Form wiedergegeben.
- source_word: ὁ συγγενὴς τοῦ βασιλέως
  choice: der Verwandte des Königs
  rationale: συγγενής bezeichnet eine verwandtschaftlich verbundene Person; „Verwandte“ bewahrt diese Bedeutung, ohne einen genaueren Verwandtschaftsgrad festzulegen.
- source_word: συνεχώρησεν
  choice: zugestanden hat
  rationale: συγχωρέω bedeutet in diesem diplomatischen Zusammenhang, Forderungen oder Rechte einzuräumen beziehungsweise zuzugestehen. Das Perfekt bezeichnet natürlich eine bereits erfolgte, weiterhin maßgebliche Entscheidung.
- source_word: ὑμῖν
  choice: euch
  rationale: Der Dativ als Empfänger der Zugeständnisse wird im Deutschen unmittelbar wiedergegeben.
- source_word: καὶ ἡμεῖς συνευδοκοῦμεν
  choice: stimmen auch wir zu
  rationale: συνευδοκέω bezeichnet gemeinsame Zustimmung oder Billigung. „Stimmen auch wir zu“ bewahrt den Gedanken, dass sich die Sprecher der Entscheidung des Lysias anschließen.
