    issue: „das Wohl aller“ für τοῦ συμφέροντος
    rationale: Das griechische substantivierte Neutrum bezeichnet das Zuträgliche/Vorteilhafte; „aller“ ist eine zusätzliche Explikation. „Gemeinwohl“ ist im Verhandlungskontext möglich, sollte aber nicht als explizites „aller“ formuliert werden.
  - severity: low
