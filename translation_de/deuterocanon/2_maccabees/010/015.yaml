  naturalness: Die Satzführung ist gut verständlich. „Allem zustimmen, wozu jemand ihn drängte“ ist jedoch weniger unmittelbar als „allem zustimmen, worum jemand bat“. Die revidierte Fassung bleibt modernes, würdiges Standarddeutsch.
  terminology: γραμματεύς wird neutral als „Sekretär“ wiedergegeben und durch eine Fußnote lexikalisch transparent gehalten. „auf das Gemeinwohl bedacht“ gibt den im Kontext naheliegenden gemeinschaftlichen Sinn von τοῦ συμφέροντος idiomatisch wieder, ohne eine bestimmte Gruppe als expliziten Wortlaut auszugeben.
