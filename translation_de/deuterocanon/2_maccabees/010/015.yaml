translation:
  language: de
  text: Makkabäus aber stimmte allem zu, worum Lysias bat, wobei er auf das Gemeinwohl bedacht war. Denn was Makkabäus Lysias über die Juden schriftlich vorlegte, genehmigte der Sekretär.[a]
