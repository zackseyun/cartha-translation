revisions:
- from: Makkabäus aber stimmte allem zu, wozu Lysias ihn drängte, denn er hatte das Wohl aller im Blick. Was Makkabäus nämlich Lysias über die Juden schriftlich vorlegte, genehmigte der Bevollmächtigte.[a]
  to: Makkabäus aber stimmte allem zu, worum Lysias bat, wobei er auf das Gemeinwohl bedacht war. Denn was Makkabäus Lysias über die Juden schriftlich vorlegte, genehmigte der Sekretär.[a]
