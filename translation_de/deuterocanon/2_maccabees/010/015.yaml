lexical_decisions:
- source_word: ἐπένευσε
  choice: stimmte … zu
  rationale: Gibt die Zustimmung zu den von Lysias vorgebrachten Anliegen natürlich und sachlich wieder.
- source_word: παρεκάλει
  choice: wozu … ihn drängte
  rationale: Bewahrt gegenüber einem neutralen „vorschlug“ den nachdrücklichen Charakter des Imperfekts von παρακαλέω.
- source_word: τοῦ συμφέροντος φροντίζων
  choice: denn er hatte das Wohl aller im Blick
  rationale: Drückt die Sorge um das Förderliche bzw. Gemeinwohl idiomatisch aus; „aller“ erschließt den im substantivierten Ausdruck mitgemeinten gemeinschaftlichen Bezug.
- source_word: ἔδωκεν … διὰ γραπτῶν
  choice: schriftlich vorlegte
  rationale: Erfasst die Übergabe schriftlicher Forderungen oder Vorschläge, ohne deren genaue Gattung festzulegen.
- source_word: συνεχώρησεν
  choice: genehmigte
  rationale: Passt zum administrativen Verhandlungskontext und gibt das Gewähren bzw. Zugestehen wieder.
- source_word: ὁ γραμματεύς
  choice: der Bevollmächtigte
  rationale: Der griechische Text bietet wörtlich „der Schreiber/Sekretär“, doch im Kontext bezeichnet der Ausdruck offenbar eine amtlich handelnde Person; die Fußnote wahrt die lexikalische Transparenz.
