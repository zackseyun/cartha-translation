base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/001/023.yaml
  text: And when the sacrifice had been consumed[a], the priests and all the others offered prayer, with Jonathan leading and the rest responding, as in Nehemiah's time.
translation:
  language: de
  text: Als das Opfer verzehrt wurde, sprachen die Priester und alle anderen ein Gebet. Jonatan begann, und die Übrigen antworteten, wie bei Nehemia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: »Jonatan stimmte an, und die Übrigen riefen als Antwort, wie Nehemia es getan hatte.« Der griechische Satz ist am Ende stark verkürzt; ob der Vergleich Nehemias Handeln, seine Zeit oder die mit ihm verbundene Gebetsweise meint, bleibt offen.'
    reason: alternative_reading
lexical_decisions:
- source_word: προσευχὴν ... ἐποιήσαντο
  choice: sprachen ... ein Gebet
  rationale: Die Verbindung bedeutet wörtlich, dass sie ein Gebet »machten«. »Ein Gebet sprechen« ist im Deutschen natürlich, würdig und bezeichnet hier den gemeinsamen liturgischen Vollzug.
- source_word: δαπανωμένης τῆς θυσίας
  choice: als das Opfer verzehrt wurde
  rationale: 'Das Partizip Präsens δαπανωμένης bezeichnet einen gleichzeitig ablaufenden Vorgang: Das Opfer wurde aufgebraucht beziehungsweise vom Feuer verzehrt. Die imperfektive Form spricht eher für »wurde verzehrt« als für das bereits abgeschlossene »verzehrt worden war«.'
- source_word: οἵ τε ἱερεῖς καὶ πάντες
  choice: die Priester und alle anderen
  rationale: πάντες erweitert die ausdrücklich genannten Priester um die Gesamtheit der übrigen Anwesenden. »Alle anderen« macht dies im Deutschen verständlich, ohne die Gruppe näher zu bestimmen.
- source_word: καταρχομένου Ἰωνάθον
  choice: Jonatan begann
  rationale: κατάρχομαι kann das Beginnen oder Anstimmen eines gemeinsamen liturgischen Vollzugs bezeichnen. »Begann« bleibt näher an der Formulierung als das stärker deutende »leitete«.
- source_word: τῶν τε λοιπῶν ἐπιφωνούντων
  choice: und die Übrigen antworteten
  rationale: ἐπιφωνέω bezeichnet hier ein lautes Einfallen oder Antworten. Im Zusammenhang mit Jonatans Beginn gibt »antworteten« den Wechselgesang beziehungsweise die responsorische Gebetsform knapp wieder.
- source_word: ὡς Νεεμίου
  choice: wie bei Nehemia
  rationale: Die elliptische Genitivkonstruktion lässt die genaue Beziehung zu Nehemia offen. »Wie bei Nehemia« bewahrt diese Kürze und Mehrdeutigkeit besser als eine Festlegung auf sein Handeln oder seine Zeit.
theological_decisions:
- issue: Bezug der elliptischen Wendung ὡς Νεεμίου
  choice: wie bei Nehemia
  alternative: wie Nehemia es getan hatte / wie zur Zeit Nehemias
  rationale: Der griechische Text nennt weder ausdrücklich ein Tun Nehemias noch seine Zeit. Die gewählte Form wahrt den historischen und liturgischen Vergleich, ohne die syntaktische Lücke dogmatisch oder erzählerisch aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzteilung entlastet die im Griechischen stark verdichtete Konstruktion. Der liturgische Charakter bleibt durch »ein Gebet sprechen«, »begann« und »antworteten« erhalten; die Fußnote dokumentiert die echte Mehrdeutigkeit des Versschlusses.
