lexical_decisions:
- source_word: αὐτὸς
  choice: er selbst
  rationale: Das Intensivpronomen hebt den unmittelbar zuvor genannten Handelnden ausdrücklich hervor.
- source_word: γὰρ
  choice: denn
  rationale: Die Konjunktion kennzeichnet die Aussage als Begründung oder Erläuterung des vorausgehenden Zusammenhangs.
- source_word: ἐξέβρασεν
  choice: vertrieb
  rationale: Das Verb bezeichnet ein kraftvolles Hinauswerfen oder Vertreiben; „vertrieb“ gibt die entschiedene Entfernung natürlich und würdig wieder.
- source_word: τοὺς παρατασσομένους
  choice: die, die sich … zum Kampf aufgestellt hatten
  rationale: Das Partizip von παρατάσσω ist militärisch geprägt und bezeichnet Personen, die sich in Schlachtordnung aufstellen; die Formulierung wahrt zugleich den medialen Charakter.
- source_word: ἐν τῇ ἁγίᾳ πόλει
  choice: in der heiligen Stadt
  rationale: Dies entspricht der örtlichen Bedeutung der Präposition und bewahrt die sakrale Bezeichnung der Stadt.
- source_word: εἰς τὴν Περσίδα
  choice: nach Persien
  rationale: εἰς bezeichnet hier die Richtung beziehungsweise das Ziel der Vertreibung; bei Ländernamen ist „nach Persien“ im Deutschen die natürliche Wiedergabe.
theological_decisions:
- issue: Betonung der handelnden Person bei der Rettung beziehungsweise Niederlage
  choice: „er selbst“ bewahrt die ausdrückliche Hervorhebung der unmittelbaren Handlungsmacht, ohne den im Einzelvers nicht genannten Bezug näher festzulegen.
  alternative: Nur „er“ ohne besondere Hervorhebung.
  rationale: Der griechische Text betont durch αὐτός den Handelnden. Die Übersetzung erhält diese Betonung, ohne eine zusätzliche theologische Identifizierung in den Vers hineinzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nahe am Griechischen, wird aber durch die finite Relativkonstruktion natürlich lesbar. Die doppelte Fußnotenmarkierung steht unmittelbar nach dem Satzteil, auf den beide lexikalischen Hinweise bezogen sind.
