translation:
  language: de
  text: Denn er selbst vertrieb[a] diejenigen, die in der heiligen Stadt zum Kampf aufgestellt waren[b], nach Persien.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „warf … hinaus“ beziehungsweise „stieß … hinaus“; das griechische Verb bezeichnet eine kraftvolle, entschiedene Entfernung.'
