lexical_decisions:
- source_word: Οἱ δὲ
  choice: Und die
  rationale: δέ führt die Erzählung mit einem milden Anschluss weiter; „und“ gibt dies natürlich wieder, ohne einen stärkeren Gegensatz einzutragen.
- source_word: ἱερεῖς
  choice: Priester
  rationale: Der bestimmte Artikel bezeichnet die bereits im Zusammenhang stehende Gruppe; im Deutschen steht er in „die Priester“ entsprechend.
- source_word: ἐπέψαλλον
  choice: sangen
  rationale: Das Verb bezeichnet hier den liturgischen Gesang. Das deutsche Präteritum ist im Erzählstil natürlich und kann den im griechischen Imperfekt dargestellten fortlaufenden Vorgang einschließen.
- source_word: τοὺς ὕμνους
  choice: die Lobgesänge
  rationale: ὕμνοι sind an Gott gerichtete Preis- oder Lobgesänge. „Lobgesänge“ bewahrt diesen Sinn und den bestimmten Artikel in verständlichem, würdigem Deutsch.
