  to: Als nun die Priester des Nanaios[a] diese Dinge bereitgelegt hatten und Antiochos mit wenigen Männern in den umfriedeten Bereich innerhalb des Tempelbezirks gekommen war, verschlossen sie den Tempel, sobald er eingetreten war.
