  yaml_path: translation/deuterocanon/2_maccabees/001/015.yaml
  text: And when the priests of Nanea had set these things out[a], and he had come with a few men into the enclosure of the temple precinct, they shut the temple as soon as Antiochus entered.
translation:
  language: de
  text: Als nun die Priester des Nanaios[a] diese Dinge bereitgelegt hatten und Antiochos mit wenigen Männern in den umfriedeten Bereich innerhalb des Tempelbezirks gekommen war, verschlossen sie den Tempel, sobald er eingetreten war.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der griechische Name Ναναῖος wird auch als „Nanaia“ oder „Nanea“ wiedergegeben.
    reason: lexical_alternative
lexical_decisions:
- source_word: προθεμένων
  choice: ausgelegt hatten
  rationale: Das Aoristpartizip von προτίθημι bezeichnet hier das Bereitstellen oder Auslegen der zuvor gemeinten Gegenstände. Die Übersetzung bleibt konkret, ohne diese näher zu bestimmen.
- source_word: αὐτά
  choice: diese Dinge
  rationale: Das Pronomen nennt in diesem Vers kein ausdrückliches Bezugswort. „Diese Dinge“ bewahrt diese Offenheit.
- source_word: τῶν ἱερέων τοῦ Ναναίου
  choice: die Priester des Nanaios
  rationale: Die Genitivverbindung wird direkt wiedergegeben. „Nanaios“ bildet die im griechischen Text vorliegende Namensform Ναναίου im Deutschen transparent ab.
- source_word: προσελθόντος
  choice: gekommen war
  rationale: Das Partizip beschreibt seine Bewegung in den umfriedeten Bereich; „gekommen war“ passt zur zeitlichen Abfolge und vermeidet den Eindruck, er sei nur bis davor gelangt.
- source_word: μετʼ ὀλίγων
  choice: mit wenigen Männern
  rationale: „Männern“ wird als im Zusammenhang naheliegende Ergänzung ausgedrückt; gemeint ist die kleine Begleitgruppe des Antiochos.
- source_word: περίβολον
  choice: umfriedeten Bereich
  rationale: περίβολος bezeichnet einen eingefriedeten oder umschlossenen Bereich. Die Wiedergabe legt sich nicht unnötig auf einen bestimmten Hof fest.
- source_word: τέμενος
  choice: Tempelbezirk
  rationale: τέμενος bezeichnet den abgegrenzten heiligen Bezirk. „Tempelbezirk“ unterscheidet ihn verständlich von ἱερόν im folgenden Satzteil.
- source_word: συγκλείσαντες τὸ ἱερόν
  choice: verschlossen sie den Tempel
  rationale: ἱερόν bezeichnet hier den Tempel beziehungsweise das Heiligtum als verschließbaren Ort; „Tempel“ ergibt im Deutschen eine klare räumliche Unterscheidung zum Tempelbezirk.
- source_word: ὡς εἰσῆλθεν
  choice: sobald ... eingetreten war
  rationale: ὡς mit dem Aorist ist temporal und bezeichnet hier den unmittelbaren Zeitpunkt, zu dem der Tempel verschlossen wurde.
- source_word: Ἀντίοχος
  choice: Antiochos
  rationale: Übliche deutsche Umschrift des griechischen Eigennamens.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die verschachtelte zeitliche Struktur des griechischen Satzes bleibt erkennbar, ist aber natürlich lesbar. „Tempelbezirk“ und „Tempel“ geben die Unterscheidung zwischen τέμενος und ἱερόν wieder.
