  verdict: revise
  source_fidelity: 'Die Übersetzung gibt die Wegführung, die fromme Haltung der Priester, die Entnahme eines Teils des Altarfeuers, das heimliche Verbergen und die Folge der Unkenntnis des Ortes insgesamt zutreffend wieder. »Ausgetrocknet« ist jedoch enger als ἄνυδρος: Das Griechische beschreibt den Brunnen als wasserlos, nicht notwendig als zuvor wasserführend und später ausgetrocknet.'
  naturalness: Der Satz ist modernes, würdiges Standarddeutsch und gut lesbar. »in der Höhlung eines wasserlosen Brunnens« bewahrt das konkrete Bild und vermeidet die zusätzliche zeitliche Implikation von »ausgetrocknet«.
  terminology: »Vorfahren«, »gottesfürchtig«, »Altar«, »weggeführt« und »Brunnen« sind angemessen. Die Fußnote gibt die lexikalische Alternative zu ἤγοντο sachgerecht wieder. Kein theologischer Fachbegriff wird unangemessen eingeengt.
