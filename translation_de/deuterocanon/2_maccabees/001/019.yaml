base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/001/019.yaml
  text: For when our fathers were being led away into Persia[a], the devout priests took some of the fire from the altar and secretly hid it in the hollow of a dry well, where they secured it so that the place would be unknown to everyone.
translation:
  language: de
  text: Denn als unsere Vorfahren nach Persien weggeführt wurden[a], nahmen die gottesfürchtigen Priester etwas von dem Feuer des Altars, verbargen es heimlich in der Höhlung eines wasserlosen Brunnens und verwahrten es dort so sicher, dass der Ort allen unbekannt blieb.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »nach Persien deportiert wurden«. Das griechische Verb kann ein Wegführen oder Verschleppen ins Exil bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤγοντο
  choice: weggeführt wurden
  rationale: Das Imperfekt Passiv bezeichnet hier das Fortführen in die Fremde und lässt offen, ob dies technisch als Deportation zu bezeichnen ist.
- source_word: Περσικὴν
  choice: nach Persien
  rationale: Das substantivierte Adjektiv bezeichnet das persische Land; »Persien« ist die natürliche geografische Wiedergabe.
- source_word: εὐσεβεῖς
  choice: gottesfürchtig
  rationale: Das Wort bezeichnet religiöse Ehrfurcht und Frömmigkeit; »gottesfürchtig« ist würdig und im heutigen Deutsch verständlich.
- source_word: λαβόντες ἀπὸ τοῦ πυρὸς τοῦ θυσιαστηρίου
  choice: nahmen etwas von dem Feuer des Altars
  rationale: Die Genitivkonstruktion gibt die Quelle an. »Etwas von dem Feuer« verdeutlicht idiomatisch, dass ein Teil des Altarfeuers genommen wurde.
- source_word: λαθραίως
  choice: heimlich
  rationale: Das Adverb kennzeichnet eine vor anderen verborgene Handlung.
- source_word: κοιλώματι φρέατος τάξιν ἔχοντος ἀνύδρου
  choice: in der Höhlung eines ausgetrockneten Brunnens
  rationale: Die Wiedergabe bewahrt das Bild einer Vertiefung beziehungsweise eines Hohlraums in einem wasserlosen Brunnen und formuliert es natürlich auf Deutsch.
- source_word: κατησφαλίσαντο
  choice: verwahrten es dort so sicher
  rationale: Das Verb bezeichnet das Sichern beziehungsweise sichere Verwahren. Der Ortsbezug wird aus dem Relativsatz natürlich aufgenommen.
- source_word: ὥστε πᾶσιν ἄγνωστον εἶναι τὸν τόπον
  choice: dass der Ort allen unbekannt blieb
  rationale: Die Formulierung bewahrt die mögliche Ergebnis- beziehungsweise Folgebeziehung der ὥστε-Konstruktion, ohne ausschließlich eine Absicht auszudrücken.
theological_decisions:
- issue: Historische Bezeichnung der Wegführung
  choice: nach Persien weggeführt wurden
  alternative: nach Persien deportiert wurden
  rationale: »Weggeführt« hält sich eng an das griechische Verb und wahrt den Exilkontext, ohne einen stärker technischen Begriff einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Vorfahren« ist gegenüber »Väter« im historischen Rückblick für heutige Leser eindeutig; die Satzführung bleibt erzählerisch und nah an der griechischen Struktur.
