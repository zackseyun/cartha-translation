translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung bleibt erzählerisch klar; die sachliche Breite von τὰ τῆς θυσίας und der nicht näher bestimmte Vergleich bei „größere Steine“ werden bewahrt.
