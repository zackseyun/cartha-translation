base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/001/031.yaml
  text: And when the things of the sacrifice had been consumed[a], Nehemiah ordered the remaining water to be poured on larger stones.
translation:
  language: de
  text: Als nun alles, was zum Opfer gehörte,[a] verzehrt war, ließ Nehemia das restliche Wasser über größere Steine gießen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die Dinge des Opfers“; gemeint ist umfassend das, was zum Opfer gehörte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνηλώθη
  choice: verzehrt war
  rationale: Der Aorist Passiv bezeichnet hier, dass das zum Opfer Gehörende vollständig aufgebraucht beziehungsweise vom Feuer verzehrt worden war. „Verzehrt war“ passt zum Opferkontext, ohne den Vorgang unnötig weiter auszudeuten.
- source_word: τὰ τῆς θυσίας
  choice: alles, was zum Opfer gehörte
  rationale: Die substantivierte neutrale Pluralform mit Genitiv meint umfassender die zum Opfer gehörenden Dinge und nicht nur das Opfer als einzelnen Vorgang. Die gewählte Formulierung bewahrt diese Breite in natürlichem Deutsch.
- source_word: τὸ περιλειπόμενον ὕδωρ
  choice: das restliche Wasser
  rationale: Die Formulierung gibt knapp und idiomatisch das Wasser wieder, das nach der vorausgehenden Handlung noch übrig war.
- source_word: ἐκέλευσεν
  choice: ließ … gießen
  rationale: Das griechische Verb bezeichnet eine autoritative Anweisung. Die deutsche Konstruktion mit „ließ“ gibt zusammen mit dem Infinitiv natürlich wieder, dass Nehemia das Ausgießen anordnete.
- source_word: λίθους μείζονας
  choice: größere Steine
  rationale: Der Komparativ μείζονας bezeichnet größere Steine. Die Vergleichsgröße bleibt wie im Griechischen unausgesprochen.
- source_word: καταχεῖν
  choice: über … gießen
  rationale: Der Infinitiv bedeutet, etwas auf beziehungsweise über etwas auszugießen. „Über größere Steine gießen“ ist im Deutschen idiomatisch und bildet die Richtung der Handlung ab.
