base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/001/008.yaml
  text: And they set the gateway on fire and poured out innocent blood; but we prayed to the Lord and were heard. We offered sacrifice and fine flour[a], lit the lamps, and set out the loaves.
translation:
  language: de
  text: Sie steckten den Torbau in Brand und vergossen unschuldiges Blut. Da flehten wir zum Herrn und wurden erhört. Wir brachten Opfer und Feinmehl dar, brachten die Lampen heraus[a] und legten die Brote vor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „führten die Lampen heraus“. Im Zusammenhang des wiederhergestellten Tempeldienstes kann damit gemeint sein, dass sie die Lampen bereitmachten oder anzündeten.'
    reason: Lexikalische und kontextuelle Mehrdeutigkeit von ἐξηγάγομεν.
lexical_decisions:
- source_word: ἐνέπυραν
  choice: steckten … in Brand
  rationale: 'Die Wendung gibt den kausativen Sinn des Verbs natürlich und anschaulich wieder: Sie setzten das Bauwerk in Brand.'
- source_word: τὸν πυλῶνα
  choice: den Torbau
  rationale: πυλών bezeichnet hier wahrscheinlich nicht nur den beweglichen Torflügel, sondern den baulichen Torbereich. „Torbau“ bleibt architektonisch offen, ohne einen Turm oder eine Vorhalle festzulegen.
- source_word: ἐξέχεαν αἷμα ἀθῷον
  choice: vergossen unschuldiges Blut
  rationale: „Blut vergießen“ ist die natürliche deutsche Entsprechung für das griechische Bild und bewahrt dessen moralisches Gewicht.
- source_word: ἐδεήθημεν τοῦ κυρίου
  choice: flehten wir zum Herrn
  rationale: δέομαι bezeichnet eine eindringliche Bitte. „flehen“ bringt diese Intensität deutlicher zum Ausdruck als das allgemeinere „beten“.
- source_word: εἰσηκούσθημεν
  choice: wurden erhört
  rationale: Das Passiv des griechischen Textes bleibt erhalten; „erhört werden“ bezeichnet im Deutschen nicht nur das Hören, sondern die gnädige Annahme des Gebets.
- source_word: προσηνέγκαμεν θυσίαν καὶ σεμίδαλιν
  choice: Wir brachten Opfer und Feinmehl dar
  rationale: „darbringen“ entspricht dem kultischen Zusammenhang. Der artikellose Singular θυσίαν kann kollektiv als „Opfer“ erscheinen; σεμίδαλις ist feines, für Opfer bestimmtes Weizenmehl.
- source_word: ἐξηγάγομεν τοὺς λύχνους
  choice: brachten die Lampen heraus
  rationale: Die Wiedergabe folgt zunächst dem gewöhnlichen Sinn von ἐξάγω („herausbringen“) und vermeidet es, die im Kontext mögliche Bedeutung „für den Tempeldienst bereitmachen/anzünden“ ohne Kennzeichnung in den Haupttext einzutragen.
- source_word: προεθήκαμεν τοὺς ἄρτους
  choice: legten die Brote vor
  rationale: Die Formulierung bewahrt die Grundbedeutung „vorlegen, vor jemandem aufstellen“ und lässt den kultischen Bezug erkennen, ohne „Schaubrote“ ausdrücklich in den Text einzufügen.
theological_decisions:
- issue: Wiedergabe von κύριος
  choice: Herr
  alternative: HERR; Gebieter
  rationale: κύριος bezeichnet hier den Gott Israels. „Herr“ ist die angemessene Standardwiedergabe; da nur der griechische Text vorliegt, wird die typografische Form „HERR“ nicht zur Rekonstruktion eines ausdrücklich belegten Gottesnamens verwendet.
- issue: Passivische Aussage über die Erhörung
  choice: wurden erhört
  alternative: der Herr erhörte uns
  rationale: Das Passiv wahrt die Form und den zurückhaltenden Ausdruck des griechischen Textes. Der Zusammenhang macht Gott als Handelnden hinreichend deutlich, ohne ihn syntaktisch ausdrücklich einzusetzen.
- issue: Deutung der Lampenhandlung im kultischen Ablauf
  choice: wörtliche Handlung im Haupttext, kontextuelle Deutung in der Fußnote
  alternative: zündeten die Lampen an; machten die Lampen bereit
  rationale: Der Tempelkontext spricht für die Wiederaufnahme des Lampendienstes, doch ἐξάγω bedeutet lexikalisch „hinaus-/herausbringen“. Die Fußnote bewahrt beide Ebenen, statt die genuine Spannung stillschweigend aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knappen, rhythmisch verbundenen Hauptsätzen. Kultische Begriffe bleiben verständlich und werden nicht konfessionell erweitert. Die wiederholte Form „brachten … dar, brachten … heraus“ folgt der Abfolge des griechischen Textes und ist trotz der Wortwiederholung bewusst beibehalten.
