base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/001/018.yaml
  text: Since we are about to celebrate the purification of the temple on the twenty-fifth of Chasleu[a], we thought it necessary to make this clear to you also, so that you too may celebrate the festival of booths and of the fire, when Nehemiah, after building both the temple and the altar, offered sacrifices.
translation:
  language: de
  text: Da wir am fünfundzwanzigsten Chasleu[a] die Reinigung des Tempels feiern wollen, hielten wir es für nötig, euch dies klar darzulegen, damit auch ihr das Laubhüttenfest und das Fest des Feuers[b] feiert, als Nehemia, nachdem er sowohl den Tempel als auch den Altar erbaut hatte, Opfer darbrachte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Chasleu ist der Monatsname in der griechischen Textform; gebräuchlich ist auch Kislew.
    reason: Namensform und moderne geläufige Entsprechung.
  - marker: b
    text: 'Wörtlich lautet das Griechische nur: »und des Feuers«. Gemeint ist wahrscheinlich eine mit dem anschließend erzählten Feuerereignis verbundene Gedenkfeier.'
    reason: Die knappe und mehrdeutige griechische Wendung wird offengelegt.
lexical_decisions:
- source_word: Μέλλοντες ἄγειν
  choice: Da wir … feiern wollen
  rationale: μέλλω mit Infinitiv bezeichnet die bevorstehende Absicht; ἄγειν bedeutet im Festkontext »feiern« oder »begehen«.
- source_word: ἐν τῷ Χασελεὺ πέμπτῃ καὶ εἰκάδι
  choice: am fünfundzwanzigsten Chasleu
  rationale: Die Wendung nennt Monat und Tag. »Chasleu« gibt die griechische Namensform direkt wieder.
- source_word: τὸν καθαρισμὸν τοῦ ἱεροῦ
  choice: die Reinigung des Tempels
  rationale: καθαρισμός bezeichnet Reinigung; ἱερόν meint hier den Tempel beziehungsweise den heiligen Tempelbereich. »Weihe« wäre stärker auslegend.
- source_word: δέον ἡγησάμεθα διασαφῆσαι ὑμῖν
  choice: hielten wir es für nötig, euch dies klar darzulegen
  rationale: Die Formulierung bewahrt sowohl das abgewogene Urteil in ἡγησάμεθα als auch das klare Erläutern in διασαφῆσαι.
- source_word: ἵνα καὶ αὐτοὶ ἄγητε
  choice: damit auch ihr … feiert
  rationale: ἄγητε ist erneut festlich-kultisch gebraucht; καὶ αὐτοί wird natürlich mit »auch ihr« wiedergegeben.
- source_word: σκηνοπηγίας
  choice: das Laubhüttenfest
  rationale: Dies ist die verständliche und etablierte deutsche Bezeichnung des jüdischen Festes und bewahrt das Bild der Hütten.
- source_word: καὶ τοῦ πυρός
  choice: und das Fest des Feuers
  rationale: Der griechische Genitiv »und des Feuers« ist verkürzt und hängt sinngemäß von der Festbezeichnung ab. Die Ergänzung »Fest« macht die deutsche Syntax verständlich, während eine Fußnote die wörtliche Kürze offenlegt.
- source_word: ὁ οἰκοδομήσας τό τε ἱερὸν καὶ τὸ θυσιαστήριον
  choice: nachdem er sowohl den Tempel als auch den Altar erbaut hatte
  rationale: Das Aoristpartizip kann eine der Opferhandlung vorausgehende Tätigkeit ausdrücken; die temporale Wiedergabe ist im Deutschen natürlich.
- source_word: ἀνήνεγκεν θυσίας
  choice: Opfer darbrachte
  rationale: ἀναφέρω ist im kultischen Zusammenhang das Darbringen von Opfern.
theological_decisions:
- issue: Bezeichnung von σκηνοπηγίας
  choice: das Laubhüttenfest
  alternative: das Fest der Hütten
  rationale: Die gewählte Form ist im modernen Deutsch transparent und üblich, ohne eine konfessionelle Sonderdeutung einzutragen.
- issue: Deutung von καὶ τοῦ πυρός
  choice: das Fest des Feuers
  alternative: und des Feuers
  rationale: Die Wendung bleibt inhaltlich allusiv; lediglich die im Deutschen notwendige Festbeziehung wird expliziert. Die Fußnote bewahrt den knappen griechischen Wortlaut und weist auf den folgenden Bericht hin.
- issue: Zeitverhältnis des Aoristpartizips οἰκοδομήσας
  choice: nachdem er … erbaut hatte
  alternative: der … erbaute
  rationale: Die gewählte Fassung versteht den Bau als der Opferdarbringung vorausgehend, ohne daraus eine weitergehende historische oder theologische Aussage abzuleiten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Laubhüttenfest« ist allgemein verständlich; »Chasleu« wahrt die griechische Namensform. Die schwerfällige Satzstruktur des Originals bleibt als ein einziger Gedankengang erkennbar, wird aber idiomatisch gegliedert.
