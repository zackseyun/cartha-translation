  source_fidelity: Die Übersetzung gibt die Satzstruktur und den Sinn des Griechischen zuverlässig wieder. „In jeder Hinsicht“ entspricht κατὰ πάντα; die Lobpreisungsformel „sei unser Gott gepriesen“ ist für εὐλογητὸς ἡμῶν ὁ θεός idiomatisch und angemessen. „Dahingab“ gibt ἔδωκεν in seinem kontextuell naheliegenden Übergabe-Sinn wieder, ohne den im Griechischen ungenannten Empfänger festzulegen. „Die, die gottlos gehandelt hatten“ bewahrt den handlungsbezogenen Charakter von τοὺς ἀσεβήσαντας.
  naturalness: Der Satz ist verständliches, würdevolles modernes Standarddeutsch mit bewusst liturgischem Klang. Die Wiederholung „die, die“ ist leicht markiert, aber grammatisch korrekt und hier als genaue Wiedergabe des substantivierten Partizips vertretbar.
  terminology: „Gepriesen“ wahrt den traditionellen Lobpreisungsregisterwert von εὐλογητός; „gottlos“ ist eine treffende und nicht unnötig doktrinär verengte Wiedergabe von ἀσεβήσαντας. Die Fußnote erläutert sachgerecht die wörtlich offene Konstruktion und die mögliche kontextuelle Ergänzung des Empfängers.
