  yaml_path: translation/deuterocanon/2_maccabees/001/017.yaml
  text: Blessed in every way is our God[a], who gave up those who acted wickedly.
translation:
  language: de
  text: In jeder Hinsicht sei unser Gott gepriesen, der die, die gottlos gehandelt hatten, dahingab.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „der die, die gottlos gehandelt hatten, gab“. Gemeint sein kann auch: „der uns die, die gottlos gehandelt hatten, auslieferte“ oder „der sie dahingab“; der Empfänger bleibt im Griechischen ungenannt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ πάντα
  choice: in jeder Hinsicht
  rationale: Die Wendung gebraucht κατά mit πάντα adverbial und verstärkt εὐλογητός umfassend; „in jeder Hinsicht“ ist natürlich und wahrt diese Weite.
- source_word: εὐλογητὸς
  choice: sei … gepriesen
  rationale: Die deutsche Lobpreisungsformel gibt das prädikative Adjektiv in seinem liturgischen Sinn würdig und idiomatisch wieder.
- source_word: ἡμῶν ὁ θεός
  choice: unser Gott
  rationale: Dies ist die natürliche deutsche Wiedergabe der griechischen Genitivkonstruktion und bewahrt den gemeinschaftlichen Beziehungsbezug.
- source_word: ἔδωκεν
  choice: dahingab
  rationale: Bei einem persönlichen Objekt kann δίδωμι hier die Übergabe in fremde Gewalt bzw. Gericht oder Niederlage bezeichnen. „Dahingab“ lässt den im Griechischen nicht genannten Empfänger offen.
- source_word: τοὺς ἀσεβήσαντας
  choice: die, die gottlos gehandelt hatten
  rationale: Das substantivierte Aoristpartizip bezeichnet Menschen aufgrund einer vorausgehenden gottlosen bzw. frevelhaften Handlung; die verbale Wiedergabe bewahrt diesen Handlungsaspekt.
theological_decisions:
- issue: Sinn des göttlichen Handelns in ἔδωκεν mit persönlichem Objekt
  choice: Gott gab die gottlos Handelnden dahin, ohne den Empfänger ausdrücklich zu nennen.
  alternative: Gott gab uns die gottlos Handelnden bzw. überlieferte sie ausdrücklich dem Gericht oder der Niederlage.
  rationale: Der Kontext legt Übergabe zur Niederlage oder zum Gericht nahe, doch der griechische Satz nennt weder Empfänger noch Ziel. Die Übersetzung wahrt diese syntaktische Offenheit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit leicht liturgischem Klang. Die vorangestellte Lobpreisung folgt der griechischen Hervorhebung; die sperrige Wiederholung „die, die“ hält den verbalen Charakter des Partizips sichtbar.
