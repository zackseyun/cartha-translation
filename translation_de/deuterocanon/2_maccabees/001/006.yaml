lexical_decisions:
- source_word: Καὶ νῦν
  choice: Und nun
  rationale: Bewahrt sowohl den verbindenden Charakter von καί als auch den zeitlichen Sinn von νῦν in natürlichem, würdigem Deutsch.
- source_word: ὧδε
  choice: hier
  rationale: ὧδε ist im Zusammenhang am besten örtlich zu verstehen. „Hier“ gibt den griechischen Ausdruck knapp wieder, ohne ihn zu „so“ umzudeuten.
- source_word: ἐσμεν
  choice: sind wir
  rationale: Die einfache Kopula wird ohne unnötige Erweiterung wiedergegeben; zusammen mit „hier“ ergibt sich idiomatisches Deutsch.
- source_word: προσευχόμενοι
  choice: und beten
  rationale: Das präsentische Partizip bezeichnet eine gleichzeitig andauernde Handlung. Die finite Nebenordnung ist im Deutschen natürlicher als „betend“, ohne den Sinn zu verändern.
- source_word: περὶ ὑμῶν
  choice: für euch
  rationale: Bei einem Gebet bezeichnet περί mit Genitiv das Gebet zugunsten der Adressaten; „für euch“ ist die direkte und übliche deutsche Formulierung.
