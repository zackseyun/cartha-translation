  naturalness: Der Text ist würdiges, gut verständliches modernes Standarddeutsch. „Mit großem Herzen und williger Seele“ bewahrt die absichtlich bildhafte, leicht gehobene Sprache des Ausgangstextes. Der Gedankenstrich ist stilistisch möglich und beeinträchtigt das Verständnis nicht.
