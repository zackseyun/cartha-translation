  yaml_path: translation/deuterocanon/2_maccabees/001/003.yaml
  text: and may he give you a faithful heart to worship him and to do his will with a great heart and a willing soul;[a]
translation:
  language: de
  text: Und er gebe euch ein treues Herz[a], damit ihr ihn verehrt und seinen Willen tut – mit großem Herzen und williger Seele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein gläubiges Herz“ oder „ein Herz des Glaubens“. Die griechische Wendung kann Treue oder Glauben hervorheben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δοίη
  choice: er gebe
  rationale: Der griechische Optativ drückt einen Segenswunsch bzw. ein Gebet aus. Der deutsche Konjunktiv I bewahrt diesen feierlichen Wunschcharakter, ohne das im unmittelbaren Satz nicht ausdrücklich genannte Subjekt näher zu bestimmen.
- source_word: καρδίαν πίστιν
  choice: ein treues Herz
  rationale: Die ungewöhnliche Verbindung betont wahrscheinlich Treue und Verlässlichkeit des Herzens im Blick auf Verehrung und Gehorsam. Da auch ein glaubendes bzw. von Glauben erfülltes Herz gemeint sein kann, wird diese echte Bedeutungsbreite in der Fußnote erhalten.
- source_word: σέβεσθαι
  choice: verehren
  rationale: Das Verb bezeichnet ehrfürchtige religiöse Hingabe. „Verehren“ gibt diese Bedeutung natürlich wieder, ohne sie auf eine bestimmte kultische Handlung zu verengen.
- source_word: τὰ θελήματα
  choice: seinen Willen
  rationale: Der griechische Plural bezeichnet die einzelnen Willensäußerungen oder Gebote Gottes; im Deutschen fasst der kollektive Singular „seinen Willen“ dies idiomatisch zusammen.
- source_word: καρδίᾳ μεγάλῃ
  choice: mit großem Herzen
  rationale: Die bildhafte Ausdrucksweise des Griechischen bleibt bewusst erhalten. Sie kann Weite, Großherzigkeit oder ungeteilte Hingabe andeuten, ohne dass eine dieser Nuancen allein festgelegt wird.
- source_word: ψυχῇ βουλομένῃ
  choice: mit williger Seele
  rationale: Das Partizip bezeichnet bereitwilliges Wollen. „Willige Seele“ bewahrt sowohl diese Bereitschaft als auch die anthropologische Bildsprache von ψυχή.
theological_decisions:
- issue: Bedeutung der πίστις-Wortgruppe in καρδίαν πίστιν
  choice: treues Herz
  alternative: gläubiges Herz; ein Herz des Glaubens
  rationale: Der Zusammenhang von Gottesverehrung und dem Tun seines Willens spricht für beständige Treue, schließt Glauben als Vertrauen jedoch nicht aus. Der Haupttext folgt der kontextuell naheliegenden Treuenuance; die Fußnote bewahrt die theologisch bedeutsame Alternative.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Er gebe“ wahrt den Gebets- und Segenscharakter; der Gedankenstrich gliedert die beiden abschließenden Bestimmungen, ohne ihre Zugehörigkeit zum Tun des göttlichen Willens aufzulösen.
