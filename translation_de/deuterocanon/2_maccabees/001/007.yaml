base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/001/007.yaml
  text: In the reign of Demetrius[a], in the one hundred sixty-ninth year, we Jews wrote to you in the distress and in the crisis that came upon us in those years[c][b], after Jason and those with him departed from the holy land and the kingdom.
translation:
  language: de
  text: Als Demetrius regierte, im hundertneunundsechzigsten Jahr, schrieben[a] wir Juden euch in der Bedrängnis und in der Krise, die in diesen Jahren über uns gekommen war, seit Jason und die mit ihm waren vom heiligen Land und vom Königreich abgefallen waren.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „haben wir euch geschrieben“. Der griechische Perfekt kann hier als brieflicher Perfekt verstanden werden.'
    reason: lexical_alternative
  - marker: b
    text: „Abgefallen“ kann hier politische Auflehnung, religiöse Abtrünnigkeit oder allgemein eine Lossagung bezeichnen.
    reason: alternative_reading
lexical_decisions:
- source_word: βασιλεύοντος Δημητρίου
  choice: Als Demetrius regierte
  rationale: Die Genitivus-absolute-Datierungsformel wird in natürlichem, würdigem Deutsch als zeitlicher Nebensatz wiedergegeben.
- source_word: ἔτους ἑκατοστοῦ ἑξηκοστοῦ ἐνάτου
  choice: im hundertneunundsechzigsten Jahr
  rationale: Bewahrt die formelle Jahresangabe des griechischen Textes.
- source_word: ἡμεῖς οἱ Ἰουδαῖοι
  choice: wir Juden
  rationale: Gibt Pronomen und appositionelle Volksbezeichnung knapp und idiomatisch wieder.
- source_word: γεγράφαμεν
  choice: schrieben
  rationale: Der griechische Perfekt kann brieflich gebraucht sein; das deutsche Präteritum passt zum rückblickenden Zeitbezug, während die Perfektalternative in einer Fußnote erhalten bleibt.
- source_word: ἐν τῇ θλίψει
  choice: in der Bedrängnis
  rationale: Bezeichnet schwere gemeinschaftliche Not, ohne einen späteren theologischen Fachgebrauch aufzudrängen.
- source_word: ἐν τῇ ἀκμῇ τῇ ἐπελθούσῃ ἡμῖν
  choice: auf dem Höhepunkt dessen, was ... über uns kam
  rationale: ἀκμή bezeichnet Spitze oder äußersten Punkt. Die Formulierung bildet diese Grundbedeutung deutlicher ab als das interpretierendere „Krise“ und verbindet das feminine Partizip sinngemäß mit der bedrängenden Lage.
- source_word: ἐν τοῖς ἔτεσιν τούτοις
  choice: in jenen Jahren
  rationale: Im rückblickenden deutschen Erzählstandpunkt ist „jenen“ natürlich, obwohl τούτοις formal „diesen“ bedeutet.
- source_word: ἀφʼ οὗ
  choice: nachdem
  rationale: Markiert hier den zeitlichen Ausgangspunkt der geschilderten Not.
- source_word: Ἰάσων καὶ οἱ μετʼ αὐτοῦ
  choice: Jason und seine Anhänger
  rationale: Natürliches Deutsch für Jason und die mit ihm verbundene Gruppe; die neutralere wörtliche Alternative wäre „die mit ihm“.
- source_word: ἀπέστη ... ἀπὸ τῆς ἁγίας γῆς καὶ τῆς βασιλείας
  choice: vom heiligen Land und vom Königreich abgefallen waren
  rationale: „Abfallen“ bewahrt die mögliche politische wie religiöse Schwere von ἀφίστημι besser als das zu schwache „weggehen“, ohne ausschließlich eine religiöse Apostasie festzulegen.
theological_decisions:
- issue: Bedeutung von ἀπέστη bei Jason
  choice: abgefallen waren
  alternative: sich losgesagt hatten; weggegangen waren; abgetrünnig geworden waren
  rationale: Das Verb kann Trennung, politischen Abfall oder religiöse Abtrünnigkeit bezeichnen. „Abfallen“ hält diese Spannung offen; eine Fußnote nennt die möglichen Nuancen.
- issue: Bezug von ἀκμή
  choice: auf dem Höhepunkt dessen, was ... über uns kam
  alternative: in der Krise; im äußersten Maß der Bedrängnis
  rationale: Die griechische Konstruktion ist knapp und etwas sperrig. Die Übersetzung wahrt die Vorstellung eines akuten oder kulminierenden Punktes, ohne die Bedrängnis dogmatisch näher zu bestimmen.
translation_notes:
  register: Modernes, standarddeutsches und würdiges Briefregister. Die lange griechische Satzperiode bleibt als ein Satz erhalten. Zweideutigkeiten bei γεγράφαμεν, ἀκμή und ἀπέστη werden nicht stillschweigend aufgelöst, sondern im Text beziehungsweise in den Fußnoten sichtbar gemacht.
