revisions:
- from: Und von ihnen erhielt der König viele verschiedene Gaben[a] und verteilte sie weiter.
  to: Und der König nahm viele verschiedene Dinge entgegen und verteilte sie an sie.
  rationale: Die Revision stellt die grammatische Funktion von οἷς als Empfängerbezug wieder her und gibt πολλὰ διάφορα ohne unbelegte Einengung als „viele verschiedene Dinge“ wieder. Die Zusatzdeutung „Gaben“ samt Fußnote entfällt, weil der griechische Ausdruck selbst ein offenes, aber ausdrückliches Objekt enthält.
