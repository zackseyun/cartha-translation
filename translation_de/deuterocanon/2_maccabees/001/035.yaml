    rationale: 'οἷς ist Dativ und passt in der Satzstellung sowie semantisch unmittelbar zu μετεδίδου: Der König verteilte die Dinge an diese Personen. Eine Herkunftsangabe „von ihnen“ wird vom griechischen Text nicht ausdrücklich markiert.'
  - severity: medium
    issue: „Gaben“ und die Fußnote behaupten, der Gegenstand sei im Griechischen nicht ausdrücklich genannt.
    rationale: πολλὰ διάφορα steht ausdrücklich als substantiviertes Neutrum und bedeutet etwa „viele verschiedene Dinge“. „Gaben“ ist kontextuell möglich, aber stärker interpretierend; die Fußnote beschreibt die griechische Form daher unzutreffend.
