translation:
  language: de
  text: Und der König nahm viele verschiedene Dinge entgegen und verteilte sie an sie.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἷς
  choice: von ihnen
  rationale: Das Relativpronomen bezieht sich auf die zuvor genannten Personen. Zusammen mit ἐλάμβανεν ist im Deutschen die Herkunftsangabe „von ihnen“ natürlich und hinreichend deutlich.
- source_word: πολλὰ διάφορα
  choice: viele verschiedene Gaben
  rationale: διάφορα bezeichnet Verschiedenartiges. Das im Griechischen nicht ausdrücklich genannte Bezugswort wird aus dem Zusammenhang als „Gaben“ ergänzt; die Fußnote wahrt die formale Offenheit.
- source_word: ἐλάμβανεν
  choice: erhielt
  rationale: λαμβάνω kann „nehmen“ oder „empfangen“ bedeuten. Im Zusammenhang passt das unmarkierte „erhielt“; der griechische Imperfekt wird in natürlicher deutscher Erzählweise mit dem Präteritum wiedergegeben.
- source_word: μετεδίδου
  choice: verteilte sie weiter
  rationale: μεταδίδωμι bezeichnet das Weitergeben beziehungsweise Zuteilen eines Anteils. „verteilte sie weiter“ macht den Bezug auf die empfangenen Gaben im Deutschen klar.
