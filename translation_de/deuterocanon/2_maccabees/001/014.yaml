  yaml_path: translation/deuterocanon/2_maccabees/001/014.yaml
  text: For when Antiochus and his friends with him arrived at the place as though to marry her[a], in order to get the money in large amount as a dowry payment,
translation:
  language: de
  text: Denn als Antiochus mit seinen Freunden an den Ort kam, als wolle er sie heiraten[a], um eine große Geldsumme als Mitgift zu erhalten,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »als wolle er mit ihr zusammenleben«. Das griechische Wort kann sowohl das eheliche Zusammenleben als auch das Eingehen einer Ehe bezeichnen. Hier geht es offenbar um die vorgetäuschte Absicht, die Göttin zu heiraten und so an den Tempelschatz zu gelangen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς … συνοικῶν αὐτῇ
  choice: als wolle er sie heiraten
  rationale: ὡς mit dem Partizip kennzeichnet hier den vorgegebenen beziehungsweise vermeintlichen Beweggrund. συνοικέω kann sowohl das Zusammenleben als auch das Eingehen einer Ehe bezeichnen; im Zusammenhang passt die Heiratsabsicht, ohne sie als wirklich vollzogene Ehe darzustellen.
- source_word: παρεγένετο εἰς τὸν τόπον
  choice: an den Ort kam
  rationale: Gibt das Eintreffen schlicht und natürlich wieder und bewahrt den ausdrücklich genannten Zielort.
- source_word: ὅ τε Ἀντίοχος καὶ οἱ σὺν αὐτῷ φίλοι
  choice: Antiochus mit seinen Freunden
  rationale: Das Deutsche gibt Antiochus als Hauptperson und die ihn begleitenden φίλοι natürlich wieder. »Freunde« bewahrt den Wortlaut, auch wenn das Wort im hellenistischen Hofmilieu zugleich Gefolgsleute oder Amtsträger bezeichnen kann.
- source_word: χάριν τοῦ λαβεῖν
  choice: um … zu erhalten
  rationale: Die Konstruktion drückt einen Zweck aus. »Erhalten« wahrt gegenüber »rauben« die lexikalische Offenheit von λαμβάνω, obwohl der Kontext eine beabsichtigte Aneignung nahelegt.
- source_word: τὰ χρήματα πλείονα
  choice: eine große Geldsumme
  rationale: πλείονα bezeichnet eine größere beziehungsweise beträchtliche Menge. Die idiomatische deutsche Formulierung vermeidet das unnatürliche »das Geld in größerer Menge«, ohne die Größenangabe zu verlieren.
- source_word: εἰς φερνῆς λόγον
  choice: als Mitgift
  rationale: φερνή bedeutet »Mitgift«; εἰς … λόγον bezeichnet hier die Zuordnung oder Anrechnung des Geldes als Mitgift.
