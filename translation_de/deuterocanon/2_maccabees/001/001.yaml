  terminology: „jüdische Brüder“, „Ägypten“, „Jerusalem“ und „Land Judäa“ sind angemessen. „Guten Frieden“ bewahrt εἰρήνη und ἀγαθήν; die Fußnote kann die im Deutschen markierte, im Griechischen ungewöhnliche Verbindung erläutern.
