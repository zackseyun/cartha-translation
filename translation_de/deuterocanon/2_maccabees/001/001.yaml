  source_fidelity: Die Adressaten und Absender sowie die wiederholte Bezeichnung „Brüder“ sind zutreffend wiedergegeben. Die Wiedergabe von εἰρήνην ἀγαθήν als „Wohlergehen und Frieden“ entfaltet jedoch ein einzelnes Substantiv mit Attribut zu zwei inhaltlich unterschiedlichen Begriffen und überschreitet damit die Vorlage.
