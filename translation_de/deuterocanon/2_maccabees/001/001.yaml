base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/001/001.yaml
  text: 'To the Jewish brothers in Egypt: the Jewish brothers in Jerusalem and those in the land of Judea[a], greetings and good peace.'
translation:
  language: de
  text: 'An die jüdischen Brüder in Ägypten: Die jüdischen Brüder in Jerusalem und die im Land Judäa entbieten euch Grüße und guten Frieden.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Griechische verbindet die übliche Briefformel χαίρειν („Grüße“) mit der ungewöhnlichen Wendung „guter Frieden“.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῖς ἀδελφοῖς τοῖς κατʼ Αἴγυπτον Ἰουδαίοις
  choice: An die jüdischen Brüder in Ägypten
  rationale: Die Dativgruppe bezeichnet die Empfänger des Briefes. „Brüder“ gibt ἀδελφοῖς ausdrücklich wieder, und „jüdischen“ erfasst Ἰουδαίοις im Deutschen natürlich.
- source_word: χαίρειν
  choice: grüßen euch
  rationale: χαίρειν ist hier die übliche griechische Briefformel. „grüßen euch“ gibt ihre epistolare Funktion in natürlichem Deutsch wieder, ohne sie als Aufforderung „Freut euch“ misszuverstehen.
- source_word: οἱ ἀδελφοὶ οἱ ἐν Ἱεροσολύμοις Ἰουδαῖοι
  choice: die jüdischen Brüder in Jerusalem
  rationale: Die Formulierung bewahrt sowohl die jüdische Identität als auch die im Ausgangstext wiederholte familiäre Anrede „Brüder“.
- source_word: καὶ οἱ ἐν τῇ χώρᾳ τῆς Ἰουδαίας
  choice: und die im Land Judäa
  rationale: „Land Judäa“ bildet χώρα τῆς Ἰουδαίας eng ab; das substantivierte „die“ ergänzt wie im Griechischen sinngemäß die dort lebenden Absender.
- source_word: εἰρήνην ἀγαθήν
  choice: Wohlergehen und Frieden
  rationale: Wörtliches „guten Frieden“ wäre im heutigen Deutsch missverständlich und unnatürlich. „Wohlergehen und Frieden“ bringt die positive Qualifizierung durch ἀγαθήν idiomatisch zum Ausdruck; die ungewöhnliche griechische Wendung wird in einer Fußnote transparent gemacht.
theological_decisions:
- issue: Wiedergabe von ἀδελφοῖς/ἀδελφοί in der gemeinschaftlichen Briefanrede
  choice: Brüder
  alternative: Brüder und Schwestern; Geschwister
  rationale: Der griechische Text verwendet zweimal ausdrücklich die maskuline Verwandtschaftsbezeichnung. „Brüder“ bewahrt diese Form und die betonte familiäre Verbundenheit, ohne den möglichen Umfang der angesprochenen Gemeinschaft dogmatisch festzulegen.
translation_notes:
  register: Moderne, würdige deutsche Briefsprache. Die zwei Satzteile machen Adressaten und Absender klar erkennbar. Die sperrige Formulierung εἰρήνην ἀγαθήν wird im Haupttext idiomatisch und in der Fußnote formal näher wiedergegeben.
