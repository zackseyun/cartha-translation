  text: and open your heart in his law and in the commandments[a], and bring about peace;
translation:
  language: de
  text: und er öffne euer Herz für sein Gesetz und für die Gebote und schaffe Frieden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechischen Infinitive setzen den Gebetswunsch aus dem vorhergehenden Vers fort: „und möge er euer Herz … öffnen und Frieden schaffen“.'
    reason: Die abhängige Satzform und der unausgesprochene Handelnde werden im Deutschen ausdrücklich gemacht.
lexical_decisions:
- source_word: διανοίξαι
  choice: öffne
  rationale: Das Grundbild des Öffnens bleibt erhalten. Der Konjunktiv „öffne“ gibt im Deutschen den aus dem vorhergehenden Vers fortgeführten Gebetswunsch natürlich wieder.
- source_word: καρδίαν
  choice: Herz
  rationale: „Herz“ bewahrt die biblische Rede vom inneren Menschen, die Verstand, Willen und Haltung umfasst.
- source_word: ἐν τῷ νόμῳ αὐτοῦ
  choice: für sein Gesetz
  rationale: Wörtliches „in seinem Gesetz“ wäre im Deutschen an dieser Stelle schwer verständlich. „Für sein Gesetz“ gibt die gemeinte Öffnung und Empfänglichkeit natürlich wieder, ohne sie auf bloßes Verstehen einzuengen.
- source_word: ἐν τοῖς προστάγμασιν
  choice: für die Gebote
  rationale: „Gebote“ ist eine klare und kontextgemäße Wiedergabe der verbindlichen Anordnungen. Das wiederholte „für“ bildet den parallelen griechischen Ausdruck ab.
- source_word: εἰρήνην
  choice: Frieden
  rationale: „Frieden“ bewahrt sowohl die gemeinschaftliche als auch die umfassendere biblische Bedeutung des griechischen Wortes.
- source_word: ποιῆσαι
  choice: schaffe
  rationale: „Frieden schaffen“ gibt den verursachenden Sinn von ποιεῖν εἰρήνην knapp und idiomatisch wieder und lässt Gott als den Handelnden erkennen.
theological_decisions:
- issue: Unausgesprochenes Subjekt und Gebetsform der Infinitive
  choice: Das aus dem vorhergehenden Vers fortwirkende göttliche Subjekt wird mit „er“ ausdrücklich aufgenommen; der Konjunktiv kennzeichnet den Gebetswunsch.
  alternative: 'Die Infinitivkonstruktion als bloßes Satzfragment wiedergeben: „und euer Herz … öffnen und Frieden schaffen“.'
  rationale: Die griechischen Aoristinfinitive hängen syntaktisch vom Gebetswunsch des vorhergehenden Verses ab. Die ausdrückliche Aufnahme mit „er öffne … und schaffe“ macht diesen Zusammenhang in natürlichem Deutsch sichtbar, ohne die göttliche Urheberschaft inhaltlich zu erweitern.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das traditionelle biblische Bild vom geöffneten Herzen und die umfassende Bedeutung von „Frieden“ bleiben erhalten; schwer verständliches wörtliches „in seinem Gesetz“ wird idiomatisch als „für sein Gesetz“ wiedergegeben.
