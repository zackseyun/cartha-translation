  yaml_path: translation/deuterocanon/2_maccabees/001/021.yaml
  text: When they reported to us that they had found no fire[a], but thick water, he ordered them to draw some out and bring it. Then, when the things for the sacrifices had been brought forward[b], Nehemiah ordered the priests to sprinkle the water on both the wood and what was laid on it.
translation:
  language: de
  text: Als sie uns berichteten, sie hätten kein Feuer gefunden, sondern dickes Wasser[a], befahl er ihnen, etwas davon zu schöpfen und zu bringen. Als dann die Dinge für die Opfer[b] herbeigebracht worden waren, befahl Nehemia den Priestern, das Holz und das, was darauf lag, mit dem Wasser zu besprengen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dichtes Wasser“ beziehungsweise „eine dicke Flüssigkeit“. Der griechische Ausdruck ist ungewöhnlich und wird relativ wörtlich wiedergegeben, weil die unerwartete Beschaffenheit des Stoffes für die Erzählung bedeutsam ist.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „die Dinge der Opfer“; eine verkürzte Wendung für die Materialien oder Gegenstände, die zu den Opferhandlungen gehörten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διεσάφησαν
  choice: berichteten
  rationale: Das Verb bezeichnet ein deutliches Mitteilen oder Erklären. Im deutschen Erzählzusammenhang gibt „berichteten“ den Sinn natürlich wieder; der Inhalt des Berichts folgt im abhängigen Satz.
- source_word: μὴ εὑρηκέναι πῦρ ἀλλὰ ὕδωρ παχύ
  choice: sie hätten kein Feuer gefunden, sondern dickes Wasser
  rationale: Der abhängige Konjunktiv gibt den Inhalt des Berichts idiomatisch wieder. „Dickes Wasser“ bewahrt die auffällige und für die Erzählung wichtige Ausdrucksweise des Griechischen.
- source_word: ἀποβλίψαντας
  choice: etwas davon zu schöpfen
  rationale: Das Partizip bezeichnet hier wahrscheinlich das Entnehmen eines Teils der Flüssigkeit aus der Grube oder einem Behältnis. „Schöpfen“ ist im Deutschen anschaulich und lässt die genaue Art der Entnahme offen.
- source_word: ἀνηνέχθη τὰ τῶν θυσιῶν
  choice: die Dinge für die Opfer herbeigebracht worden waren
  rationale: Die griechische Wendung ist elliptisch und meint die zum Opfer gehörenden Gegenstände oder Materialien. Die Übersetzung erhält diese Breite, ohne nur die Opfergaben oder bereits vollzogene Opfer vorauszusetzen.
- source_word: ἐπιρᾶναι
  choice: zu sprengen
  rationale: Das Verb bezeichnet das Aufbringen der Flüssigkeit auf Holz und Opfermaterial. „Sprengen“ passt zum rituellen Zusammenhang, ohne eine große ausgegossene Menge festzulegen.
- source_word: τά τε ξύλα καὶ τὰ ἐπικείμενα
  choice: über das Holz und über das, was darauf lag
  rationale: Die Formulierung bewahrt die Allgemeinheit des Griechischen. Gemeint sind wahrscheinlich die auf dem Holz liegenden Opferteile, doch der Ausgangstext benennt sie nicht ausdrücklich.
theological_decisions:
- issue: Wiedergabe des Namens Νεεμίας
  choice: Nehemia
  alternative: Nehemias
  rationale: „Nehemia“ ist die im modernen deutschen Bibelgebrauch geläufige Namensform und ermöglicht die Wiedererkennung, ohne über die Identität der genannten Person hinausgehende Aussagen zu treffen.
translation_notes:
  register: Moderne, würdige Standardsprache mit gut verständlichem Erzählfluss. Die ungewöhnliche Bezeichnung „dickes Wasser“ und die elliptische Rede von den „Dingen für die Opfer“ bleiben erhalten und werden durch Fußnoten erläutert. Das zweimalige „befahl“ spiegelt die parallele Struktur des griechischen Textes.
