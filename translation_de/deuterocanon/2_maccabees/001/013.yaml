  register: Modernes, würdevolles Standarddeutsch. Der Satzbau folgt der griechischen Begründungsstruktur, wird jedoch für gute Verständlichkeit geglättet. Der Name Nanaia wird transliteriert. Die scheinbare Unüberwindlichkeit der Streitmacht bleibt als bloßer Eindruck erhalten.
