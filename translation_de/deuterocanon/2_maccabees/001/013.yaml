    issue: „hineingegangen“ ergänzt eine Bewegung in das Heiligtum, die der griechische Text an dieser Stelle nicht ausdrücklich nennt.
    rationale: γενόμενος kann im Kontext Ankunft bedeuten; das Betreten des Heiligtums ist allenfalls kontextuell erschließbar. Die vorhandene Fußnote weist zwar darauf hin, doch der Übersetzungstext selbst sollte diese nicht ausdrücklich formulierte Einzelheit nicht festlegen.
  revised_text: Denn als der Anführer mit der Streitmacht, die ihn begleitete und unüberwindlich zu sein schien, gekommen war, wurden sie im Heiligtum der Nanaia niedergemacht, weil die Priester der Nanaia eine List angewandt hatten.
