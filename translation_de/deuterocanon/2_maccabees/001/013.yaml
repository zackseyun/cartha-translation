  yaml_path: translation/deuterocanon/2_maccabees/001/013.yaml
  text: For when the leader and the force around him that seemed to be invincible had entered[a], they were cut down in the temple of Nanaia[b], because the priests of Nanaia had used deceit.
translation:
  language: de
  text: Denn als der Anführer mit der Streitmacht, die ihn begleitete und unüberwindlich zu sein schien, gekommen war, wurden sie im Heiligtum der Nanaia niedergemacht, weil die Priester der Nanaia eine List angewandt hatten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γενόμενος
  choice: als … hineingegangen waren
  rationale: Die wörtliche Wiedergabe „geworden war“ ist hier unverständlich. Im Erzählzusammenhang bezeichnet das Partizip die Ankunft beziehungsweise das Hineingehen des Anführers und seiner Truppe in das Heiligtum; die Ergänzung wird als kontextbedingt im Text kenntlich gemacht.
- source_word: ὁ ἡγεμών
  choice: der Anführer
  rationale: ἡγεμών kann einen Führer, Herrscher oder Befehlshaber bezeichnen. „Anführer“ wahrt die Breite des Ausdrucks, ohne ein bestimmtes Amt vorauszusetzen.
- source_word: ἡ περὶ αὐτὸν … δύναμις
  choice: die Streitmacht um ihn
  rationale: δύναμις bezeichnet hier eine militärische Macht oder Truppe; περὶ αὐτόν meint die ihn umgebenden beziehungsweise begleitenden Kräfte.
- source_word: ἀνυπόστατος δοκοῦσα εἶναι
  choice: die unüberwindlich zu sein schien
  rationale: ἀνυπόστατος bezeichnet etwas, dem man nicht standhalten kann. „Unüberwindlich“ gibt dies im militärischen Zusammenhang natürlich wieder; „schien“ bewahrt ausdrücklich den Anschein und behauptet keine tatsächliche Unbesiegbarkeit.
- source_word: κατεκόπησαν
  choice: wurden … niedergemacht
  rationale: Das Passiv von κατακόπτω bezeichnet ein gewaltsames Erschlagen oder Niederhauen. „Niedergemacht“ erhält die Härte des Ausdrucks, ohne unnötig drastisch zu werden.
- source_word: ἐν τῷ τῆς Ναναίας ἱερῷ
  choice: im Heiligtum der Nanaia
  rationale: ἱερόν kann Tempel oder Heiligtum bedeuten. „Heiligtum“ ist für den sakralen Ort präzise und lässt offen, ob der gesamte Tempelbezirk oder ein bestimmtes Tempelgebäude gemeint ist.
- source_word: παραλογισμῷ χρησαμένων
  choice: weil … eine List angewandt hatten
  rationale: Die Genitivus-absolute-Konstruktion bezeichnet Ursache oder Mittel. παραλογισμός meint Täuschung, List oder Betrug; „eine List angewandt“ ist idiomatisch und bewahrt den absichtlichen Täuschungscharakter.
- source_word: τῶν περὶ τὴν Ναναίαν ἱερέων
  choice: die Priester der Nanaia
  rationale: Die Wendung bezeichnet die Nanaia zugeordneten beziehungsweise ihr dienenden Priester. „Priester der Nanaia“ ist im Deutschen natürlich und vermeidet eine missverständliche räumliche Wiedergabe.
