review_pass:
  verdict: revise
  source_fidelity: Die explizite Angabe „hineingegangen“ ist im griechischen Wortlaut nicht enthalten. γενόμενος bezeichnet hier die Ankunft bzw. das Eintreffen des Anführers; dass dies ein Betreten des Heiligtums einschließt, kann der weitere Erzählzusammenhang nahelegen, sollte aber nicht als Übersetzung in den Text aufgenommen werden. Die Wiedergabe der begleitenden Streitmacht, ihres nur scheinbaren Unüberwindlichseins, der gewaltsamen Tötung und der durch die Priester eingesetzten List ist ansonsten sachgerecht.
  naturalness: Der Entwurf ist insgesamt gutes modernes Standarddeutsch. Die Revision vermeidet die im Deutschen etwas sperrige Verbindung „der Anführer und die Streitmacht um ihn ... hineingegangen waren“ und bildet zugleich die singularische Partizipkonstruktion des Griechischen mit „der Anführer mit ... Streitmacht ... gekommen war“ natürlich ab.
  terminology: „Anführer“, „Streitmacht“, „unüberwindlich“, „Heiligtum“, „Nanaia“ und „eine List angewandt“ sind angemessene, registergerechte Wiedergaben. „Die ihn begleitete“ erläutert die hier zuordnende Wendung περὶ αὐτόν idiomatisch, ohne ein bestimmtes militärisches Amt oder eine genaue Truppenstärke festzulegen.
