revisions:
- from: Denn als der Anführer und die Streitmacht um ihn, die unüberwindlich zu sein schien, hineingegangen waren,[a] wurden sie im Heiligtum der Nanaia niedergemacht, weil die Priester der Nanaia eine List angewandt hatten.
  to: Denn als der Anführer mit der Streitmacht, die ihn begleitete und unüberwindlich zu sein schien, gekommen war, wurden sie im Heiligtum der Nanaia niedergemacht, weil die Priester der Nanaia eine List angewandt hatten.
  rationale: Die nicht ausdrücklich im griechischen Text ausgedrückte Einfügung „hineingegangen“ samt zugehöriger Fußnote wird entfernt. „Mit der Streitmacht, die ihn begleitete“ gibt die Verbindung von ὁ ἡγεμών und ἡ περὶ αὐτὸν δύναμις flüssig wieder und erlaubt zugleich die singularische Bezugsform von γενόμενος. Der übrige Sinn und der würdevolle moderne Registerton bleiben erhalten.
