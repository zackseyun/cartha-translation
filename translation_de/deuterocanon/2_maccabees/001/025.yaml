  yaml_path: translation/deuterocanon/2_maccabees/001/025.yaml
  text: the only provider[a], the only righteous one, almighty and eternal, the one who rescues Israel from every evil, who made the fathers chosen and sanctified them[c][b];
translation:
  language: de
  text: der einzige Versorger[a], der einzig Gerechte, allmächtig und ewig, der Israel aus allem Bösen rettet, der die Väter erwählt[b] und sie geheiligt[c] hat;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Geber“ beziehungsweise „der, der alles Nötige bereitstellt“. Das griechische Wort bezeichnet jemanden, der bereitstellt, was gebraucht wird.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „die Väter zu Erwählten gemacht“.'
    reason: lexical_alternative
  - marker: c
    text: Oder „heilig gemacht“ beziehungsweise „geweiht“.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ μόνος χορηγός
  choice: der einzige Versorger
  rationale: Die substantivische Gottesbezeichnung und die betonte Ausschließlichkeit werden bewahrt. „Versorger“ gibt χορηγός als den wieder, der das Nötige bereitstellt.
- source_word: ὁ μόνος δίκαιος
  choice: der einzig Gerechte
  rationale: δίκαιος steht substantivisch als Gottesbezeichnung; „der Gerechte“ wahrt den personalen und moralischen Sinn, „einzig“ die Wiederholung von μόνος.
- source_word: παντοκράτωρ
  choice: allmächtig
  rationale: Die geläufige und prägnante deutsche Wiedergabe der göttlichen Bezeichnung für umfassende Macht.
- source_word: αἰώνιος
  choice: ewig
  rationale: Im Lobpreis bezeichnet das Wort Gottes zeitlich unbegrenztes Sein; „ewig“ ist natürlich und würdig.
- source_word: ὁ διασώζων
  choice: der … rettet
  rationale: Das Präsenspartizip bezeichnet Gott als den fortdauernd Rettenden. „rettet“ ist idiomatisch und umfasst Befreiung aus Gefahr.
- source_word: ἐκ παντὸς κακοῦ
  choice: aus allem Bösen
  rationale: Die Formulierung lässt die Breite von κακόν zwischen Bösem, Unheil und Schaden bestehen.
- source_word: ὁ ποιήσας τοὺς πατέρας ἐκλεκτούς
  choice: der die Väter erwählt hat
  rationale: Die wörtliche Konstruktion „zu Erwählten gemacht“ wäre im Deutschen schwerfällig. „erwählt“ gibt die resultative Bedeutung natürlich wieder, ohne eine spätere Lehrsystematik einzutragen.
- source_word: τοὺς πατέρας
  choice: die Väter
  rationale: Der Ausdruck bewahrt den biblisch-bundestheologischen Bezug auf Israels Vorväter und fügt kein im Griechischen fehlendes Possessivpronomen hinzu.
- source_word: ἡγίασας αὐτούς
  choice: sie geheiligt hat
  rationale: „geheiligt“ erhält sowohl den Gedanken des Heiligmachens als auch des Aussonderns und passt zum gehobenen Gebetsregister.
theological_decisions:
- issue: Bezeichnung der Bundesvorfahren mit τοὺς πατέρας
  choice: die Väter
  alternative: die Vorfahren; unsere Väter
  rationale: „Die Väter“ wahrt den traditionellen heilsgeschichtlichen Klang. „Unsere“ wird nicht ergänzt, da im Griechischen kein Possessivpronomen steht.
- issue: Kausative Wendung ποιήσας … ἐκλεκτούς
  choice: die Väter erwählt hat
  alternative: die Väter zu Erwählten gemacht hat
  rationale: Die idiomatische deutsche Verbform bewahrt Gottes erwählendes Handeln, ohne die unbeholfene griechische Objekt-Prädikativ-Konstruktion nachzubilden oder deren Aussage dogmatisch auszuweiten.
- issue: Wiedergabe von ἡγίασας
  choice: geheiligt
  alternative: heilig gemacht; geweiht
  rationale: „Geheiligt“ bewahrt die theologische und kultische Bedeutungsbreite. Die Alternativen verdeutlichen mögliche Nuancen, ohne den Text auf eine davon festzulegen.
translation_notes:
  register: Gehobene, aber gegenwärtige Gebetssprache. Die wiederholten substantivischen Gottesbezeichnungen und Partizipialstrukturen werden in flüssigem Deutsch nachgebildet. Das Präteritum der griechischen Aoristformen wird idiomatisch mit Perfekt wiedergegeben; die Satzfolge bleibt als Teil der fortlaufenden Anrufung mit Semikolon offen.
