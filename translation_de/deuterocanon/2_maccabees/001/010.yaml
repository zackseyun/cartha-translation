lexical_decisions:
- source_word: ἔτους
  choice: Im … Jahr
  rationale: Der Genitiv bezeichnet hier eine Zeit- beziehungsweise Datumsangabe. Im Deutschen wird die knappe griechische Formel idiomatisch mit „im … Jahr“ wiedergegeben.
- source_word: ὀγδοηκοστοῦ καὶ ὀγδόου
  choice: achtundachtzigsten
  rationale: Die analytische griechische Ordinalzahl („achtzigsten und achten“) bedeutet „achtundachtzigsten“; die zusammengesetzte Form ist im Deutschen natürlich.
- source_word: ἐν Ἱεροσολύμοις
  choice: in Jerusalem
  rationale: Ἱεροσόλυμα ist im Griechischen ein formal pluralischer Ortsname, wird im Deutschen jedoch als „Jerusalem“ wiedergegeben; ἐν ist hier örtlich zu verstehen.
