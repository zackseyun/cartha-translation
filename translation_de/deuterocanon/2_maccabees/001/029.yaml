translation:
  language: de
  text: Pflanze dein Volk an deinem heiligen Ort ein[a], so wie Mose gesagt hat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Lass dein Volk an deinem heiligen Ort festen Fuß fassen.“ Das griechische Verb bedeutet wörtlich „einpflanzen“ und zeichnet das Bild einer dauerhaften, sicheren Ansiedlung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καταφύτευσον
  choice: Pflanze … ein
  rationale: Der Aoristimperativ von καταφυτεύω bezeichnet wörtlich ein Einpflanzen. „Einpflanzen“ bewahrt das anschauliche Bild und kann zugleich eine dauerhafte, sichere Ansiedlung ausdrücken.
- source_word: τὸν λαόν σου
  choice: dein Volk
  rationale: λαός bezeichnet hier das Volk als gemeinschaftliches Ganzes; „dein Volk“ ist im Deutschen natürlich und entspricht dem Gebetskontext.
- source_word: εἰς τὸν τόπον τὸν ἅγιόν σου
  choice: an deinem heiligen Ort
  rationale: εἰς bezeichnet beim Verb des Einpflanzens die Ausrichtung auf den Ort; idiomatisches Deutsch verwendet dafür „an … einpflanzen“. τόπος bleibt allgemein als „Ort“ wiedergegeben, ohne ihn als Land, Tempel oder Heiligtum näher festzulegen.
- source_word: καθὼς εἶπεν Μωσῆς
  choice: so wie Mose gesagt hat
  rationale: καθώς bezeichnet Übereinstimmung oder Vergleich; die Formulierung gibt den Verweis auf die Aussage des Mose klar und natürlich wieder.
theological_decisions:
- issue: Bezug von „deinem heiligen Ort“
  choice: Die allgemeine Bezeichnung „deinem heiligen Ort“ bleibt erhalten.
  alternative: deinem heiligen Land; deinem Heiligtum
  rationale: Der griechische Text nennt lediglich τόπος („Ort“) und legt nicht ausdrücklich fest, ob Land, Tempel oder Heiligtum gemeint ist. Eine engere Bestimmung würde die vorhandene Offenheit auflösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das seltenere, aber verständliche Bild des Einpflanzens wird im Haupttext bewahrt; die Fußnote erläutert seinen übertragenen Sinn.
