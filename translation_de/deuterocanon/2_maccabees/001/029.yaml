  source_fidelity: „Pflanze … ein“ gibt καταφύτευσον treffend als bildhaften Imperativ wieder. „Dein Volk“ entspricht τὸν λαόν σου, und die allgemeine Wiedergabe von τόπος als „Ort“ wahrt die im Griechischen offene Referenz. Die deutsche Ortsangabe „an deinem heiligen Ort“ ist bei „einpflanzen“ idiomatisch und vermittelt die beabsichtigte dauerhafte Ansiedlung, ohne den Ort als Land oder Heiligtum festzulegen. „So wie Mose gesagt hat“ entspricht καθὼς εἶπεν Μωσῆς angemessen.
  naturalness: Der Satz ist verständliches modernes Standarddeutsch und bewahrt einen würdevollen Gebetsregister. Die Stellung von „ein“ am Satzende ist grammatisch und stilistisch passend. Die Fußnote erläutert die Metapher klar.
