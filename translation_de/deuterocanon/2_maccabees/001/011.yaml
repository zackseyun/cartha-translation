  text: Having been saved by God from great dangers[a], we give him great thanks, as those about to array ourselves against a king.
translation:
  language: de
  text: Von Gott aus großen Gefahren gerettet, danken wir ihm sehr – als ob wir uns gegen einen König in Schlachtordnung aufstellten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wie Menschen, die gegen einen König in Schlachtordnung aufgestellt sind“; möglich auch: „als ob wir uns gegen einen König zum Kampf aufstellten“. Der griechische Vergleich ist stark verkürzt und verwendet ein militärisches Bild.'
