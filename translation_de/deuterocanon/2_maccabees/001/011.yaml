lexical_decisions:
- source_word: ἐκ μεγάλων κινδύνων
  choice: aus großen Gefahren
  rationale: Die Wendung bewahrt die Präposition, den Plural von κίνδυνος und die Verstärkung durch μεγάλων in natürlichem modernem Deutsch.
- source_word: ὑπὸ τοῦ θεοῦ σεσωσμένοι
  choice: Da Gott uns … gerettet hat
  rationale: Die finite Nebensatzkonstruktion gibt das griechische Perfekt-Passiv-Partizip idiomatisch wieder, wahrt die abgeschlossene Rettung und nennt Gott ausdrücklich als Handelnden.
- source_word: μεγάλως εὐχαριστοῦμεν αὐτῷ
  choice: danken wir ihm sehr
  rationale: „Sehr“ gibt das verstärkende Adverb μεγάλως wieder; „ihm“ entspricht dem ausdrücklichen Dativ αὐτῷ. Die Formulierung ist klar und gegenwärtig.
- source_word: ὡς ἂν
  choice: wie Menschen, die
  rationale: Die Vergleichspartikel wird als Vergleich wiedergegeben, ohne die gedrängte griechische Konstruktion vorschnell kausal oder zeitlich festzulegen.
- source_word: πρὸς βασιλέα
  choice: gegen einen König
  rationale: In Verbindung mit dem militärisch geprägten παρατάσσομαι hat πρός adversative Bedeutung.
- source_word: παρατασσόμενοι
  choice: sich … zum Kampf aufstellen
  rationale: Die Wiedergabe erhält die mediale Form und das militärische Bild des Aufstellens in Schlachtordnung, ohne ein im Griechischen nicht ausdrücklich vorhandenes Heer einzuführen.
theological_decisions:
- issue: Göttliche Urheberschaft der Rettung
  choice: Gott wird ausdrücklich als derjenige genannt, der die Schreibenden gerettet hat.
  alternative: Eine unpersönliche Formulierung wie „nach unserer Rettung“
  rationale: ὑπὸ τοῦ θεοῦ bezeichnet bei dem Passivpartizip eindeutig Gott als Handelnden; diese Aussage darf nicht abgeschwächt werden.
- issue: Verhältnis von Dank und militärischem Vergleich
  choice: Die ungewöhnliche Vergleichskonstruktion bleibt im Haupttext als Vergleich erhalten.
  alternative: Die Wendung als Aussage über einen tatsächlich geführten Kampf oder als Begründung des Dankes ausdeuten
  rationale: ὡς ἂν mit dem Partizip ist gedrängt und mehrdeutig. Die Übersetzung bewahrt diese Spannung, statt den geschichtlichen oder theologischen Bezug festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der erste griechische Partizipialsatz wird für bessere Verständlichkeit als Kausalsatz formuliert. Der Gedankenstrich macht den abrupten, gedrängten Vergleich kenntlich; die Fußnote wahrt dessen grammatische und bildliche Mehrdeutigkeit.
