    rationale: Da der Haupttext bereits „Sklaven“ hat, erklärt „bedeutet wörtlich ‚Sklaven‘“ nichts Zusätzliches. Eine knappe Erläuterung der alternativen deutschen Wiedergaben und der Zugehörigkeitsnuance ist hilfreicher.
