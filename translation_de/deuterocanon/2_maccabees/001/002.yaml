  source_fidelity: Der Wunschcharakter von ἀγαθοποιῆσαι und μνησθῆναι wird mit „möge“ zutreffend wiedergegeben. „Bund“, die deutschen Namensformen und „treuen Sklaven“ entsprechen dem griechischen Text. Für μνησθῆναι ist „sich an … erinnern“ jedoch die unmittelbarere, idiomatischere Entsprechung als das etwas schwächere „an … denken“.
  naturalness: Die Satzfügung ist insgesamt würdig und modernes Standarddeutsch. Die reflexive Formulierung „sich an seinen Bund … erinnern“ ist klarer und natürlicher als „an seinen Bund … denken“.
