translation:
  language: de
  text: Und möge Gott euch Gutes tun und sich an seinen Bund mit Abraham, Isaak und Jakob, seinen treuen Sklaven[a], erinnern.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Dienern“ oder „Knechten“. Das griechische Wort betont ihre Zugehörigkeit zu Gott.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀγαθοποιῆσαι
  choice: Gutes tun
  rationale: Die Wendung gibt den Wunsch wieder, Gott möge den Empfängern wohltun, ohne die Art seines guten Handelns näher festzulegen.
- source_word: μνησθῆναι
  choice: an … denken
  rationale: Die Formulierung ist natürliches modernes Deutsch und bewahrt den biblischen Gedanken des Erinnerns, der im Bundeskontext auch ein entsprechendes Handeln einschließen kann.
- source_word: διαθήκης
  choice: Bund
  rationale: Bei Abraham, Isaak und Jakob bezeichnet διαθήκη eindeutig Gottes Bund und nicht eine allgemeine Vereinbarung oder ein Testament.
- source_word: δούλων
  choice: Sklaven
  rationale: Die Wiedergabe bewahrt die starke Aussage des griechischen Wortes über die Zugehörigkeit zu Gott; eine Fußnote nennt die im Deutschen geläufigeren, aber schwächeren Alternativen.
- source_word: πιστῶν
  choice: treuen
  rationale: Das Adjektiv kennzeichnet Abraham, Isaak und Jakob als Gott gegenüber treu und zuverlässig.
theological_decisions:
- issue: Wiedergabe von δοῦλοι als Bezeichnung der Erzväter
  choice: Sklaven
  alternative: Diener oder Knechte
  rationale: „Sklaven“ erhält die im griechischen Ausdruck liegende uneingeschränkte Zugehörigkeit zu Gott. „Diener“ klingt natürlicher, schwächt diese Beziehung jedoch ab; „Knechte“ ist traditionell, im heutigen Deutsch aber altertümlich und weniger eindeutig.
- issue: Bedeutung von Gottes Erinnern an den Bund
  choice: an seinen Bund … denken
  alternative: seines Bundes … gedenken
  rationale: Die Hauptfassung bleibt modern und verständlich, ohne das Erinnern auf einen rein inneren Vorgang festzulegen. Die feierlichere Alternative wäre möglich, wirkt aber im heutigen Standarddeutsch gehobener und weniger unmittelbar.
translation_notes:
  register: Moderne, würdige Gebetssprache. Die Satzform mit „möge“ macht den Wunschcharakter der griechischen Infinitive deutlich. Die Namen folgen der üblichen deutschen biblischen Form.
