base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/001/022.yaml
  text: And when this happened and some time had passed[a], and the sun shone out though it was clouded over, a great fire was kindled, so that everyone marveled.
translation:
  language: de
  text: Als dies geschehen war und einige Zeit vergangen war, leuchtete die Sonne auf, obwohl sie von Wolken verhüllt war[a], und ein großes Feuer wurde entzündet, sodass alle staunten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »während sie von Wolken verhüllt war«. Das griechische Partizipialgefüge beschreibt die Bewölkung; im Text wird es wegen des Zusammenhangs konzessiv verstanden: Die Sonne leuchtete trotz der Wolken auf.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ ἐγένετο
  choice: Als dies geschehen war
  rationale: Die Wendung leitet idiomatisch den nächsten zeitlichen Abschnitt der Erzählung ein; sie bezeichnet hier ein Geschehen und nicht ein »Werden«.
- source_word: χρόνος διῆλθεν
  choice: einige Zeit vergangen war
  rationale: Gibt den unbestimmten Zeitablauf natürlich wieder, ohne seine Dauer näher festzulegen.
- source_word: ὅ τε ἥλιος ἀνέλαμψεν
  choice: leuchtete die Sonne auf
  rationale: ἀναλάμπω bezeichnet ein Hervor- oder Aufleuchten; »aufleuchten« vermittelt das plötzliche Sichtbarwerden des Sonnenlichts knapp und natürlich.
- source_word: ἐπινεφὴς ὤν
  choice: obwohl sie von Wolken verhüllt war
  rationale: Das maskuline Partizipialgefüge stimmt mit ἥλιος überein und beschreibt die Sonne unter Wolken. Die konzessive Wiedergabe passt zum überraschenden Aufleuchten, während die mögliche rein begleitende Bedeutung in der Fußnote erhalten bleibt.
- source_word: ἀνήφθη
  choice: wurde entzündet
  rationale: Das Passiv von ἀνάπτω bleibt erhalten und lässt den Handelnden wie im Griechischen ungenannt.
- source_word: πυρὰ μεγάλη
  choice: ein großes Feuer
  rationale: πυρά bezeichnet hier ein Feuer beziehungsweise einen Feuerstoß; die schlichte Wiedergabe vermeidet eine unnötige Festlegung auf einen Scheiterhaufen.
- source_word: ὥστε θαυμάσαι πάντας
  choice: sodass alle staunten
  rationale: Die resultative Infinitivkonstruktion und der umfassende Bezug von πάντας werden knapp und idiomatisch wiedergegeben.
