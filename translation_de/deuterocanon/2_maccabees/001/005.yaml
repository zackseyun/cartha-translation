  text: and may he hear your prayers[a], and be reconciled to you[c][b], and not abandon you in an evil time.
translation:
  language: de
  text: und er erhöre eure Bitten[a], versöhne sich mit euch[b] und verlasse euch nicht in einer bösen Zeit[c].
  philosophy: optimal-equivalence
  footnotes:
