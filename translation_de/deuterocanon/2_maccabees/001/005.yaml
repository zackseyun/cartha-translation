    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπακούσαι
  choice: er erhöre
  rationale: Das Verb bezeichnet hier, auf Gebete bezogen, ein aufmerksames und wohlwollendes Hören. „Erhöre“ ist im Deutschen idiomatisch, ohne ausdrücklich zu behaupten, auf welche Weise Gott die Bitten beantwortet.
- source_word: τῶν δεήσεων
  choice: eure Bitten
  rationale: δέησις bezeichnet eine dringliche Bitte oder ein Flehen. „Bitten“ ist natürlich und bewahrt den konkreteren Sinn gegenüber dem allgemeineren „Gebete“.
- source_word: καταλλαγείη
  choice: versöhne sich mit euch
  rationale: Der Optativ bezeichnet die erhoffte Wiederherstellung des Verhältnisses beziehungsweise der Gunst. Die reflexive deutsche Form gibt den relationalen Sinn natürlich wieder, ohne einen bestimmten Versöhnungsmechanismus einzutragen.
- source_word: ἐγκαταλίποι
  choice: verlasse euch nicht
  rationale: ἐγκαταλείπω bedeutet verlassen, im Stich lassen oder preisgeben. „Verlasse euch nicht“ ist gegenwärtiges, würdiges Deutsch und passt zum Gebetswunsch.
- source_word: ἐν καιρῷ πονηρῷ
  choice: in einer bösen Zeit
  rationale: Die Wiedergabe bleibt nahe bei καιρός und πονηρός und bewahrt sowohl die widrige als auch die mögliche moralische Färbung der Wendung.
theological_decisions:
- issue: Ob καταλλαγείη vor allem Besänftigung Gottes oder die Wiederherstellung der Beziehung ausdrückt
  choice: versöhne sich mit euch
  alternative: werde euch wieder gnädig; lasse sich euch gegenüber besänftigen
  rationale: „Sich versöhnen“ wahrt die Spannung einer gestörten und wiederhergestellten Beziehung, ohne Gottes Haltung auf eine bloße Gefühlsänderung zu reduzieren oder die Art der Versöhnung festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die fortgeführte Wunschform wird durch die Konjunktive „erhöre“, „versöhne“ und „verlasse“ ausgedrückt. „Böse Zeit“ erhält bewusst die Mehrdeutigkeit zwischen moralisch böser und bedrängnisvoller Zeit.
