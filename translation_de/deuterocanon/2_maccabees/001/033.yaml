base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/001/033.yaml
  text: But when the matter became known and it was reported to the king of the Persians that[a], in the place where the priests who had been taken away had hidden the fire, water had appeared, from which also those with Nehemiah purified the sacrifices[c][b],
translation:
  language: de
  text: Als aber die Sache bekannt wurde und man dem König der Perser berichtete, dass an dem Ort, wo die weggebrachten Priester das Feuer verborgen hatten, Wasser zum Vorschein gekommen war, mit dem auch die Leute um Nehemia die Opfer reinigten,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „von dem“ oder „aus dem“. Gemeint ist das zuvor erwähnte Wasser, das zur rituellen Reinigung der Opfer verwendet wurde.'
    reason: Erläutert die instrumentale Wiedergabe „mit dem“ und gibt Bezug sowie Grundbedeutung von ἀφ’ οὗ quellentreu an.
lexical_decisions:
- source_word: φανερὸν ἐγενήθη τὸ πρᾶγμα
  choice: die Sache bekannt wurde
  rationale: Gibt das öffentliche Bekanntwerden des Geschehens natürlich wieder; φανερός bezeichnet hier das Offenbar- bzw. Bekanntwerden.
- source_word: διηγήθη τῷ βασιλεῖ τῶν Περσῶν
  choice: man dem König der Perser berichtete
  rationale: Die unpersönliche deutsche Konstruktion gibt den griechischen Passivgedanken idiomatisch wieder und bewahrt die förmliche Mitteilung an den König.
- source_word: οἱ μεταχθέντες ἱερεῖς
  choice: die weggebrachten Priester
  rationale: Bewahrt den passiven Sinn des Partizips und deutet die Wegführung an, ohne ausdrücklich mehr als der griechische Wortlaut zu sagen.
- source_word: τὸ ὕδωρ ἐφάνη
  choice: Wasser zum Vorschein gekommen war
  rationale: Gibt das Erscheinen des Wassers und die zeitliche Vorordnung innerhalb des Berichts klar wieder.
- source_word: ἀφ' οὗ
  choice: mit dem
  rationale: Bezieht das Relativpronomen am natürlichsten auf das unmittelbar vorausgehende Wasser und macht dessen Verwendung bei der Reinigung im Deutschen verständlich.
- source_word: οἱ περὶ τὸν Νεεμίαν
  choice: die Leute um Nehemia
  rationale: Eine natürliche Wiedergabe der griechischen Wendung für die mit Nehemia verbundene Gruppe, ohne sie unnötig auf Männer einzugrenzen.
- source_word: ἥγνισαν τὰς θυσίας
  choice: die Opfer reinigten
  rationale: Bewahrt den kultischen Reinigungssinn von ἁγνίζω, ohne ihn als Weihehandlung umzudeuten.
theological_decisions:
- issue: Kultischer Sinn von ἥγνισαν τὰς θυσίας
  choice: die Opfer reinigten
  alternative: die Opfer weihten
  rationale: „Reinigten“ wahrt die kultische Bedeutung, ohne eine stärker spezifizierte Weihevorstellung in den Text einzutragen.
- issue: Bezug von ἀφ' οὗ
  choice: 'auf das Wasser bezogen: „mit dem“'
  alternative: 'zeitlich auf das gesamte Ereignis bezogen: „danach“'
  rationale: Das Wasser ist das nächste grammatische Bezugswort; auch der Erzählzusammenhang legt nahe, dass es zur Reinigung der Opfer verwendet wurde.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der abschließende Beistrich zeigt an, dass der griechische Satz in den folgenden Vers weiterläuft. „Weggebracht“ bleibt bewusst näher und weniger ausdeutend als „deportiert“; „die Leute um Nehemia“ ist idiomatisch und inklusiv.
