base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/001/020.yaml
  text: But after many years had passed, when it seemed good to God, Nehemiah, having been sent by the king of Persia, sent for the descendants of the priests who had hidden it, to get the fire.
translation:
  language: de
  text: Nach Ablauf vieler Jahre, als Gott es für gut hielt, sandte Nehemia, den der König von Persien entsandt hatte, die Nachkommen der Priester, die das Feuer verborgen hatten, aus, um es zu holen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: »sandte … zum Feuer hin«. Das Griechische ist knapp formuliert; aus dem Zusammenhang ergibt sich, dass Nehemia die Nachkommen aussandte, um das verborgene Feuer zu holen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διελθόντων δὲ ἐτῶν ἱκανῶν
  choice: Nachdem aber viele Jahre vergangen waren
  rationale: Der Genitivus absolutus setzt den zeitlichen Rahmen; ἱκανῶν bezeichnet hier eine beträchtliche Zahl von Jahren. Die deutsche Formulierung ist idiomatisch und wahrt das rückblickende Zeitverhältnis.
- source_word: ὅτε ἔδοξεν τῷ θεῷ
  choice: und es Gott gut erschien
  rationale: Die Wendung gibt ἔδοξεν mit Dativ möglichst nah und dennoch verständlich wieder. Sie wahrt den Gedanken göttlichen Gutheißens beziehungsweise Bestimmens, ohne ihn als bloßes Gefallen auszudeuten.
- source_word: ἀποσταλεὶς Νεεμίας ἀπὸ τοῦ βασιλέως τῆς Περσίδος
  choice: Nehemia, den der König von Persien entsandt hatte
  rationale: Das passive Aoristpartizip bezeichnet eine vorausliegende Entsendung Nehemias. Der Relativsatz ist im Deutschen natürlicher als eine schwere Partizipialkonstruktion; ἀπό bezeichnet hier den Urheber der Entsendung.
- source_word: τοὺς ἐκγόνους τῶν ἱερέων
  choice: die Nachkommen der Priester
  rationale: ἐκγόνους meint allgemein Nachkommen und sollte nicht unnötig auf Söhne oder ausschließlich männliche Nachfahren verengt werden.
- source_word: τῶν ἀποκρυψάντων
  choice: die das Feuer verborgen hatten
  rationale: Das substantivierte Partizip bezieht sich auf die Priester. Das im Griechischen ausgelassene Objekt wird aus dem unmittelbaren Zusammenhang als das Feuer ergänzt.
- source_word: ἔπεμψεν ἐπὶ τὸ πῦρ
  choice: sandte ... aus, um es zu holen
  rationale: Die knappe Verbindung ἐπί mit Akkusativ bezeichnet im Zusammenhang Ziel beziehungsweise Zweck der Entsendung. Die Wiedergabe macht die Rückholung des zuvor verborgenen Feuers verständlich, ohne den Sinn weiter auszubauen.
theological_decisions:
- issue: Göttliches Wollen in ὅτε ἔδοξεν τῷ θεῷ
  choice: und es Gott gut erschien
  alternative: als Gott es für richtig hielt / als es Gott gefiel
  rationale: Die gewählte Formulierung bewahrt die offene griechische Redeweise von göttlicher Billigung oder Entscheidung. Sie legt weder bloßes subjektives Gefallen noch eine besondere dogmatische Bestimmung in den Ausdruck hinein.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der komplexe griechische Satzbau wird durch einen Relativsatz geglättet. »Es Gott gut erschien« wahrt bewusst die ungewöhnliche, aber verständliche Wendung des Ausgangstextes; die Fußnote kennzeichnet die sinngemäße Verdeutlichung der knappen Schlussformulierung.
