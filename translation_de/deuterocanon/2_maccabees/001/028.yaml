  text: Torment those who oppress and insolently abuse us in their pride;[a]
translation:
  language: de
  text: Quäle die, die uns unterdrücken und uns in ihrem Hochmut schändlich behandeln.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Heimsuche die, die uns unterdrücken und uns in ihrer Überheblichkeit misshandeln“ oder „Bestrafe die, die uns unterdrücken und uns in ihrer Überheblichkeit misshandeln.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: βάσανισον
  choice: Quäle
  rationale: Der Aoristimperativ von βασανίζω bittet Gott hier um die Zufügung schweren Leids beziehungsweise harter Strafe. „Quäle“ bewahrt die Intensität des griechischen Verbs, ohne es ausdrücklich auf körperliche Folter festzulegen.
- source_word: τοὺς καταδυναστεύοντας
  choice: die, die uns unterdrücken
  rationale: Das Partizip bezeichnet Menschen, die ihre Macht bedrückend gegen andere ausüben. Das im Gebetszusammenhang mitgemeinte Objekt wird im Deutschen natürlich als „uns“ ausgedrückt.
- source_word: ἐξυβρίζοντας
  choice: uns schändlich behandeln
  rationale: ἐξυβρίζω bezeichnet eine von Überheblichkeit geprägte, empörende Misshandlung oder Entehrung. „Schändlich behandeln“ gibt die feindselige Tat idiomatisch wieder, ohne sie unnötig auf bloße Beschimpfung einzuengen.
- source_word: ἐν ὑπερηφανίᾳ
  choice: in ihrem Hochmut
  rationale: Die Wendung bezeichnet die hochmütige Haltung oder Art ihres Handelns. „In ihrem Hochmut“ ist im Deutschen natürlich und erhält das moralische Gewicht von ὑπερηφανία.
theological_decisions:
- issue: Mitgemeintes Objekt der beiden Partizipien
  choice: Bei beiden Handlungen „uns“ ausdrücklich wiedergeben
  alternative: Das Objekt nur einmal ausdrücken oder im Deutschen unausgesprochen lassen
  rationale: Der gemeinschaftliche Gebetskontext macht die Betenden zum Ziel der Unterdrückung und schändlichen Behandlung. Die explizite Wiedergabe dient der deutschen Verständlichkeit und fügt keine neue theologische Aussage hinzu.
- issue: Art der erbetenen göttlichen Vergeltung
  choice: Die starke, aber nicht näher bestimmte Aussage „Quäle“ bewahren
  alternative: Mit „Bestrafe“ allgemeiner oder mit „Foltere“ körperlich spezifischer übersetzen
  rationale: Der griechische Ausdruck verlangt eine harte Heimsuchung, legt ihre konkrete Form jedoch nicht fest. Die Übersetzung soll weder die Spannung des Gebets abschwächen noch die Strafart präzisieren.
translation_notes:
  register: Moderne, würdige Gebetssprache. Der scharfe Imperativ des griechischen Textes bleibt erhalten; die Satzstruktur ist klar und für heutige Leser unmittelbar verständlich.
