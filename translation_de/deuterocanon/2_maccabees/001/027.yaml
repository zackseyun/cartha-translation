base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/001/027.yaml
  text: Gather our dispersed people[a], free those enslaved among the nations, look upon those who are despised and abhorred; and let the nations know that you are our God.
translation:
  language: de
  text: Führe unsere Zerstreuten[a] zusammen, befreie die, die unter den Völkern versklavt sind, sieh auf die Verachteten und Verabscheuten; und lass die Völker erkennen, dass du unser Gott bist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »unsere Zerstreuung«. Gemeint ist die zerstreute Gemeinschaft.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπισυνάγαγε
  choice: Führe ... zusammen
  rationale: Der Aoristimperativ von ἐπισυνάγω bittet Gott, die Zerstreuten zu sammeln und wieder zusammenzuführen. Die deutsche Wendung gibt sowohl das Sammeln als auch die durch die Vorsilbe betonte Zusammenführung natürlich wieder.
- source_word: τὴν διασπορὰν ἡμῶν
  choice: die Zerstreuten unseres Volkes
  rationale: Wörtlich steht »unsere Zerstreuung«. Gemeint ist metonymisch die zerstreute Gemeinschaft; die gewählte Formulierung macht den Personenbezug deutlich, ohne »Diaspora« als mögliches Fremdwort einzuführen.
- source_word: ἐλευθέρωσον
  choice: befreie
  rationale: Das Verb bezeichnet ausdrücklich das Freimachen oder In-Freiheit-Setzen und wird daher nicht zum allgemeineren »rette« abgeschwächt.
- source_word: τοὺς δουλεύοντας
  choice: die, die ... versklavt sind
  rationale: δουλεύω bezeichnet hier ein Leben in Unfreiheit beziehungsweise Sklaverei. Die passive deutsche Formulierung wahrt diesen starken Sinn und vermeidet eine Verharmlosung zu bloßem Dienen.
- source_word: ἐν τοῖς ἔθνεσιν
  choice: unter den Völkern
  rationale: ἔθνη bezeichnet die umliegenden Völker. »Unter den Völkern« ist im jüdischen Kontext natürlich und weniger traditionsgebunden als »unter den Heiden«.
- source_word: τοὺς ἐξουθενημένους καὶ βδελυκτοὺς
  choice: die Verachteten und Verabscheuten
  rationale: Die substantivierten Ausdrücke bewahren die Parallelität und geben sowohl soziale Missachtung als auch starke Abscheu wieder.
- source_word: ἔφιδε
  choice: sieh auf
  rationale: Der Gebetsimperativ bedeutet »schau auf, beachte«. »Sieh auf« bleibt nahe am Bild des göttlichen Hinsehens, ohne die zusätzliche Deutung »erweise Gunst« einzutragen.
- source_word: γνώτωσαν
  choice: lass ... erkennen
  rationale: Der Imperativ hat hier petitionale beziehungsweise jussive Kraft. »Erkennen« gibt das angestrebte Gewahrwerden der Völker etwas deutlicher wieder als bloßes Faktenwissen.
- source_word: ὅτι σὺ ὁ θεὸς ἡμῶν
  choice: dass du unser Gott bist
  rationale: Die schlichte Prädikation wird direkt wiedergegeben; die im Griechischen durch σύ ausgedrückte Betonung ergibt sich im Deutschen aus dem Zusammenhang.
theological_decisions:
- issue: Bezug von τὴν διασπορὰν ἡμῶν
  choice: Als zerstreute Angehörige des eigenen Volkes verstanden
  alternative: »unsere Zerstreuung« oder »unsere Diaspora«
  rationale: Das Verb des Zusammenführens richtet sich sachlich auf Menschen. Der Personenbezug ist im griechischen Substantiv metonymisch möglich; die Fußnote bewahrt zugleich die wörtliche Ausdrucksweise.
- issue: Bedeutung der δουλεύω-Wortgruppe
  choice: Mit ausdrücklicher Sklaverei- beziehungsweise Unfreiheitsbedeutung wiedergegeben
  alternative: »die unter den Völkern dienen« oder »in Dienstbarkeit leben«
  rationale: Der Zusammenhang handelt von Unterdrückung und Fremdherrschaft. Eine Wiedergabe als bloßes Dienen würde die Intensität des griechischen Ausdrucks abschwächen.
translation_notes:
  register: Modernes, würdiges Gebetsdeutsch mit klaren Imperativen. »Unter den Völkern« vermeidet das heute missverständliche »Heiden«; »Verachteten und Verabscheuten« erhält die kräftige Parallelität des Griechischen.
