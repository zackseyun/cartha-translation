base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/001/036.yaml
  text: And the men around Nehemiah called this Nephthar[a], which is translated “Purification”; but by most people it is called Nephi.
translation:
  language: de
  text: Die Leute um Nehemia nannten dies Neftar, was übersetzt „Reinigung“ bedeutet; bei den meisten aber heißt es Nefti.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Griechisch: Νεφθί; eine buchstabengetreuere Umschrift wäre „Nefthi“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσηγόρευσαν
  choice: nannten
  rationale: Das Verb bezeichnet hier die Vergabe einer Benennung; „nannten“ ist natürlich und quellentreu.
- source_word: οἱ περὶ τὸν Νεεμίαν
  choice: die Leute um Nehemia
  rationale: Die Wendung bezeichnet Nehemias Begleiter oder Umfeld. „Die Leute um Nehemia“ bewahrt die griechische Konstruktion, ohne sie stärker als nötig auszudeuten.
- source_word: τοῦτο
  choice: dies
  rationale: Das Demonstrativpronomen verweist knapp auf das zuvor erwähnte Material.
- source_word: Νεφθάρ
  choice: Neftar
  rationale: Der fremdsprachige Name wird in einer für deutsche Leser transparenten Umschrift wiedergegeben.
- source_word: διερμηνεύεται
  choice: was übersetzt … bedeutet
  rationale: Die Formulierung gibt sowohl den Übersetzungsvorgang als auch die erklärende Funktion des griechischen Ausdrucks idiomatisch wieder.
- source_word: Καθαρισμός
  choice: Reinigung
  rationale: Das Substantiv bezeichnet Reinigung beziehungsweise Läuterung und kann im Kontext eine kultische Färbung haben; „Reinigung“ wahrt die nominale Form.
- source_word: καλεῖται
  choice: heißt es
  rationale: Dies ist eine natürliche deutsche Wiedergabe der passiven Benennungsformel.
- source_word: παρὰ τοῖς πολλοῖς
  choice: bei den meisten
  rationale: Die Wendung bezeichnet den bei der Mehrheit üblichen Sprachgebrauch und bleibt nahe an der griechischen Form.
- source_word: Νεφθί
  choice: Nefti
  rationale: Die Umschrift bildet das griechische Νεφθί mit seinem hörbaren Theta-Laut vereinfacht und deutsch lesbar ab; die genauere Form wird in der Fußnote genannt.
