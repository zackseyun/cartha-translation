  text: And now[b][a], celebrate the days of the Festival of Booths in the month of Chislev.
translation:
  language: de
  text: Und nun feiert die Tage des Laubhüttenfestes[a] im Monat Kislew[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „Fest der Hütten“.'
    reason: lexical_alternative
  - marker: b
    text: Kislew entspricht im jüdischen Kalender ungefähr den Monaten November und Dezember.
    reason: cultural_note
lexical_decisions:
- source_word: ἄγητε
  choice: feiert
  rationale: ἄγω bezeichnet in Verbindung mit Festtagen idiomatisch deren Begehung oder Feier; „feiert“ ist im Deutschen natürlich und gibt den festlichen Zusammenhang wieder.
- source_word: τὰς ἡμέρας
  choice: die Tage
  rationale: Die direkte Wiedergabe bewahrt den zeitlichen Schwerpunkt und die Mehrzahl des griechischen Ausdrucks.
- source_word: τῆς σκηνοπηγίας
  choice: des Laubhüttenfestes
  rationale: σκηνοπηγία bezeichnet das jüdische Fest der Hütten. „Laubhüttenfest“ ist die geläufige, verständliche deutsche Bezeichnung.
- source_word: τοῦ Χασελεὺ μηνός
  choice: im Monat Kislew
  rationale: Die griechische Genitivverbindung wird im Deutschen idiomatisch mit „im Monat“ wiedergegeben. „Kislew“ ist die im Deutschen übliche Form des Monatsnamens.
- source_word: καὶ νῦν ἵνα
  choice: Und nun
  rationale: Das finale ἵνα kann hier exhortativ beziehungsweise imperativisch wirken. „Und nun“ mit anschließendem Imperativ gibt diese Funktion natürlich wieder, ohne einen im Deutschen unvollständigen Zwecksatz zu erzeugen.
theological_decisions:
- issue: Bezeichnung von σκηνοπηγία
  choice: Laubhüttenfest
  alternative: Fest der Hütten
  rationale: „Laubhüttenfest“ identifiziert den bekannten jüdischen Festtag klar und entspricht dem etablierten deutschen Sprachgebrauch, ohne eine konfessionelle Deutung einzutragen.
- issue: Exhortative Funktion von ἵνα
  choice: Imperativ „feiert“
  alternative: 'wörtlich: „damit ihr … feiert“'
  rationale: In diesem Zusammenhang trägt der ἵνα-Satz Aufforderungscharakter. Der deutsche Imperativ bewahrt die kommunikative Funktion; die alternative formale Wiedergabe wäre als selbstständiger Satz unvollständig.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz bleibt knapp und bewahrt die ungewöhnliche Verbindung des Laubhüttenfestes mit dem Monat Kislew, ohne sie erklärend aufzulösen.
