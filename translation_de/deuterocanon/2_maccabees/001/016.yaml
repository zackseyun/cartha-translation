base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/001/016.yaml
  text: After opening the hidden door of the smoke chamber[a], they threw stones and struck down the leader, and after cutting him into pieces[b], they threw the heads to those outside.
translation:
  language: de
  text: Nachdem sie die verborgene Tür des Fatinoma[a] geöffnet hatten, warfen sie Steine und streckten den Anführer nieder.[b] Nachdem sie ihn zerstückelt hatten, warfen sie die Köpfe den Draußenstehenden zu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das seltene griechische Wort φατίνωμα ist in seiner genauen Bedeutung unsicher. Es könnte einen Raum im Zusammenhang mit Rauch oder Feuer bezeichnen; auch andere Deutungen sind vorgeschlagen worden.
    reason: lexical_alternative
  - marker: b
    text: Das griechische Verb ist von dem Wort für „Donnerkeil“ oder „Blitz“ geprägt und kann einen besonders gewaltsamen Schlag andeuten. Ein buchstäblicher Blitzschlag wird nicht ausdrücklich berichtet.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνοίξαντες
  choice: Nachdem sie … geöffnet hatten
  rationale: Das Aoristpartizip bezeichnet eine Handlung, die den folgenden Handlungen vorausgeht; die deutsche Konstruktion gibt diese Abfolge natürlich wieder.
- source_word: τὴν τοῦ φατινώματος κρυπτὴν θύραν
  choice: die verborgene Tür in der Decke
  rationale: κρυπτή bezeichnet etwas Verborgenes. Das seltene φατίνωμα kann eine getäfelte beziehungsweise kassettenartig gestaltete Decke bezeichnen; im Zusammenhang ist mit einer verborgenen Öffnung in der Decke zu rechnen, durch die Steine hinabgeworfen werden konnten.
- source_word: βάλλοντες πέτρους
  choice: bewarfen … mit Steinen
  rationale: Die deutsche Wendung verbindet das Werfen der Steine idiomatisch mit dem betroffenen Herrscher und bewahrt den Handlungsablauf.
- source_word: συνεκεραύνωσαν
  choice: schmetterten ihn nieder
  rationale: Das ungewöhnliche Verb ist von κεραυνός, »Donnerkeil/Blitz«, geprägt und bezeichnet hier einen wuchtigen, vernichtenden Schlag. »Schmetterten … nieder« erhält die Bildkraft, ohne ausdrücklich einen übernatürlichen Blitzschlag zu behaupten.
- source_word: τὸν ἡγεμόνα
  choice: den Herrscher
  rationale: ἡγεμών kann einen Herrscher, Statthalter oder Anführer bezeichnen. »Herrscher« passt zum erzählerischen Zusammenhang, ohne einen präziseren Amtstitel einzuführen.
- source_word: μέλη ποιήσαντες
  choice: Dann zerstückelten sie ihn
  rationale: Die wörtliche Vorstellung, jemanden »zu Gliedern zu machen«, ist im Deutschen idiomatisch als Zerstückeln wiederzugeben.
- source_word: καὶ τὰς κεφαλὰς
  choice: die Köpfe
  rationale: Der auffällige Plural des griechischen Textes wird bewahrt und nicht stillschweigend zum Singular geglättet.
- source_word: τοῖς ἔξω παρρίψαντες
  choice: warfen … denen zu, die draußen waren
  rationale: Der Dativ τοῖς ἔξω bezeichnet am natürlichsten die draußen befindlichen Personen; παρρίπτειν drückt ein Hin- oder Zuwerfen aus.
theological_decisions:
- issue: Ob συνεκεραύνωσαν einen buchstäblichen, göttlich verursachten Blitzschlag oder bildhaft einen vernichtenden Angriff bezeichnet
  choice: Bildkräftig mit »schmetterten ihn nieder« wiedergegeben
  alternative: »trafen ihn mit einem Blitz« beziehungsweise schlicht »streckten ihn nieder«
  rationale: Das Verb enthält Donnerkeil- oder Blitzbildlichkeit, doch als unmittelbare Handelnde erscheinen Menschen, die Steine werfen. Die Wiedergabe erhält die ungewöhnliche Gewalt des Ausdrucks, ohne ein Wunder festzuschreiben oder auszuschließen.
translation_notes:
  register: Moderne, würdige Erzählsprache mit klarer Darstellung der Gewalt. Der ungewöhnliche Plural »die Köpfe« bleibt entsprechend dem griechischen Text stehen. Die seltene Deckenbezeichnung und die Blitzbildlichkeit des Verbs werden in Fußnoten transparent gemacht.
