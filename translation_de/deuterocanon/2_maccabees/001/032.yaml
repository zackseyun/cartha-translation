base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/001/032.yaml
  text: And when this happened[a], a flame was kindled; and when the light from the altar shone forth[b], it was consumed.
translation:
  language: de
  text: Als dies geschah, wurde eine Flamme entzündet; und als das Licht vom Altar her zurückstrahlte[a], wurde sie aufgezehrt[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »aufleuchtete«. Das griechische Verb kann ein Zurückstrahlen oder antwortendes Aufleuchten bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Im Griechischen steht nur: »wurde aufgezehrt«, ohne dass das Subjekt genannt wird. Hier ist dies auf die Flamme bezogen; möglich sind auch das Brennmaterial beziehungsweise Opfergut oder, vom weiteren Zusammenhang her, die ausgegossene Flüssigkeit.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὡς δὲ τοῦτο ἐγενήθη
  choice: Als dies geschehen war
  rationale: ὡς mit dem Aorist leitet hier einen temporalen Nebensatz ein. Die Formulierung gibt die zeitliche Abfolge natürlich wieder, ohne eine besondere Unmittelbarkeit hinzuzufügen.
- source_word: φλὸξ ἀνήφθη
  choice: entzündete sich eine Flamme
  rationale: φλόξ bezeichnet eine einzelne Flamme, und ἀνήφθη beschreibt ihr Entzündetwerden. Die idiomatische deutsche Wendung wahrt den Vorgang, ohne einen nicht genannten Handelnden einzuführen.
- source_word: ἀπὸ τοῦ θυσιαστηρίου
  choice: vom Altar her
  rationale: Die Wendung gibt Herkunft beziehungsweise Ausgangspunkt des Lichts knapp und verständlich wieder.
- source_word: ἀντιλάμψαντος φωτός
  choice: als das Licht … zurückstrahlte
  rationale: Der Genitivus absolutus bezeichnet einen begleitenden zeitlichen Umstand. „Zurückstrahlte“ bildet die mögliche responsive oder rückstrahlende Nuance von ἀντιλάμπω ab; die weniger spezifische Alternative wird in der Fußnote genannt.
- source_word: ἐδαπανήθη
  choice: verzehrte sie sich
  rationale: Das passive Verb bedeutet, dass etwas aufgezehrt, verbraucht oder zu Ende gebracht wurde. Bezogen auf die Flamme ist „verzehrte sie sich“ im Deutschen natürlich und wahrt das Bild des Sich-Aufbrauchens besser als das stärker deutende „erlosch“.
theological_decisions:
- issue: Nicht ausdrücklich genanntes Subjekt von ἐδαπανήθη
  choice: Das Pronomen „sie“ bezieht sich im Haupttext auf die zuvor genannte Flamme.
  alternative: Gemeint sein könnten das Brennmaterial beziehungsweise Opfergut oder im weiteren Erzählzusammenhang die ausgegossene Flüssigkeit.
  rationale: Die Flamme ist der nächste ausdrückliche mögliche Bezugspunkt und ergibt einen verständlichen Satz. Da das Griechische im letzten Teilsatz jedoch kein Subjekt nennt, wird die sachlich und erzählerisch bedeutsame Mehrdeutigkeit in einer Fußnote offengehalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzfolge. Das Semikolon hält die beiden eng verbundenen Vorgänge zusammen. „Verzehrte sie sich“ vermeidet das stärker auslegende „erlosch“, während die Fußnoten die lexikalische und syntaktische Offenheit des Griechischen sichtbar machen.
