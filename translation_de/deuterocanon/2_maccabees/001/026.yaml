  yaml_path: translation/deuterocanon/2_maccabees/001/026.yaml
  text: Accept the sacrifice for all your people Israel[a], and preserve your portion and sanctify it.
translation:
  language: de
  text: Nimm das Opfer für dein ganzes Volk Israel an und bewahre deinen Anteil[a] und heilige ihn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit „deinem Anteil“ ist wahrscheinlich Israel als Gottes eigener Anteil gemeint; möglich ist auch ein Bezug auf das Land oder das Heiligtum.
    reason: lexical_alternative
lexical_decisions:
- source_word: πρόσδεξαι
  choice: nimm … an
  rationale: Der Aoristimperativ von προσδέχομαι bittet Gott im Gebetszusammenhang, das Dargebrachte wohlwollend anzunehmen. „Nimm … an“ ist natürliches, würdevolles Deutsch.
- source_word: τὴν θυσίαν
  choice: das Opfer
  rationale: θυσία bezeichnet hier im kultischen Zusammenhang konkret ein Opfer; „Opfer“ wahrt diesen Sinn besser als das allgemeinere „Gabe“.
- source_word: ὑπὲρ παντὸς τοῦ λαοῦ σου Ἰσραήλ
  choice: für dein ganzes Volk Israel
  rationale: ὑπέρ drückt hier Stellvertretung beziehungsweise Begünstigung aus. „Für“ gibt dies knapp und idiomatisch wieder; παντός wird mit „ganzes“ bewahrt.
- source_word: διαφύλαξον
  choice: bewahre
  rationale: Das Verb bittet um schützendes Erhalten. „Bewahre“ passt zum Gebetsregister und lässt sowohl Schutz als auch fortdauernde Erhaltung anklingen.
- source_word: τὴν μερίδα σου
  choice: deinen Anteil
  rationale: μερίς bezeichnet einen Anteil oder ein zugeteiltes Teil. „Deinen Anteil“ erhält das griechische Bild, ohne den Bezug ausdrücklich auf Volk, Land oder Heiligtum festzulegen.
- source_word: καθαγίασον
  choice: heilige ihn
  rationale: καθαγιάζω bedeutet heiligen beziehungsweise weihen. „Heilige“ ist eng am griechischen Heiligkeitsbegriff; „ihn“ nimmt grammatisch den unmittelbar vorausgehenden „Anteil“ auf.
theological_decisions:
- issue: Bezug von „deinen Anteil“
  choice: Die Formulierung bleibt metaphorisch und wird nicht ausdrücklich aufgelöst; im unmittelbaren Zusammenhang liegt Israel als Gottes Anteil nahe.
  alternative: Gemeint sein könnten auch das Land oder das Heiligtum als Gottes Anteil.
  rationale: Der vorangehende Ausdruck „dein ganzes Volk Israel“ und biblische Bundesterminologie sprechen für Israel. Da das Griechische den Bezug jedoch nicht ausdrücklich bestimmt, wahrt die Übersetzung die Mehrdeutigkeit.
translation_notes:
  register: Modernes, würdevolles Gebetsdeutsch. Die Satzstruktur bleibt nahe am Griechischen, ohne unnatürlich zu wirken; „heilige“ bewahrt den theologischen Leitbegriff und ist im Kontext allgemein verständlich.
