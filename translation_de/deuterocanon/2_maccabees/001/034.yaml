  text: Then the king enclosed it and made it sacred[a], after testing the matter.
translation:
  language: de
  text: Dann umzäunte der König es und heiligte es[a], nachdem er die Sache geprüft hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „machte es zu einem Heiligtum“. Das griechische Wort kann hier entweder prädikativ („machte es heilig“) oder substantivisch („machte es zu einem Heiligtum“) verstanden werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: περιφράξας
  choice: ließ … einzäunen
  rationale: Das Aoristpartizip bezeichnet das Umhegen oder Einfrieden. „Einzäunen“ gibt die konkrete Handlung natürlich wieder, ohne eine Mauer oder eine bestimmte Bauweise vorauszusetzen.
- source_word: ἱερὸν
  choice: heiligte es
  rationale: 'ἱερόν kann hier prädikativ zu ἐποίησεν verstanden werden: Der König machte den eingefriedeten Ort heilig. Die kompakte deutsche Formulierung „heiligte es“ gibt diesen Sinn idiomatisch wieder; die substantivische Deutung wird in der Fußnote bewahrt.'
- source_word: ἐποίησεν
  choice: heiligte
  rationale: Wörtlich „machte“; zusammen mit dem prädikativen ἱερόν ergibt sich auf Deutsch natürlich „heiligte“.
- source_word: δοκιμάσας
  choice: nachdem er … geprüft hatte
  rationale: Das Aoristpartizip drückt eine der Haupthandlung vorausgehende Prüfung oder Erprobung aus.
- source_word: τὸ πρᾶγμα
  choice: die Sache
  rationale: Der allgemeine Ausdruck bezeichnet die betreffende Angelegenheit beziehungsweise das berichtete Geschehen, ohne es näher festzulegen.
theological_decisions:
- issue: Bedeutung von ἱερὸν für den eingefriedeten Ort
  choice: 'Prädikativ: Der König heiligte ihn beziehungsweise machte ihn heilig.'
  alternative: 'Substantivisch: Der König machte ihn zu einem Heiligtum.'
  rationale: Das artikellose ἱερόν lässt sich gut als Prädikatsbestimmung zu ἐποίησεν lesen. So wird keine Errichtung eines Tempelgebäudes vorausgesetzt; da die substantivische Lesart grammatisch möglich bleibt, wird sie in einer Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Ließ … einzäunen“ ist anschaulich und vermeidet eine nicht belegte Festlegung auf eine Mauer; „heiligte es“ ist knapp und natürlich. Die mögliche Doppeldeutigkeit von ἱερόν bleibt durch die Fußnote erhalten.
