  yaml_path: translation/deuterocanon/2_maccabees/001/024.yaml
  text: 'And the prayer was in this form: “Lord God[a], creator of all things, the awesome and mighty and righteous and merciful one[b], the only king and good one,”'
translation:
  language: de
  text: 'Das Gebet lautete folgendermaßen: „Herr, Gott, Schöpfer von allem, du Furchtgebietender[a], Mächtiger, Gerechter und Barmherziger, du alleiniger König und Gütiger[b],“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Ehrfurchtgebietender“ beziehungsweise „Furchterregender“; das griechische Wort bezeichnet jemanden, der Furcht oder Ehrfurcht hervorruft.
    reason: lexical_alternative
  - marker: b
    text: Oder „Guter“ beziehungsweise „Freundlicher“; das griechische χρηστός kann Güte, Freundlichkeit oder Wohlwollen bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν δὲ ἡ προσευχὴ τὸν τρόπον ἔχουσα τοῦτον
  choice: Das Gebet lautete folgendermaßen
  rationale: Gibt die einleitende Wendung idiomatisch und zugleich formell wieder, ohne ihren Sinn zu erweitern.
- source_word: Κύριε ὁ θεός
  choice: Herr, Gott
  rationale: Bewahrt die Gebetsanrede und bildet sowohl den Vokativ Κύριε als auch die anschließende Gottesbezeichnung ab.
- source_word: ὁ πάντων κτίστης
  choice: Schöpfer von allem
  rationale: κτίστης bezeichnet den Schöpfer; πάντων drückt den umfassenden Geltungsbereich aus.
- source_word: ὁ φοβερὸς
  choice: du Furchtgebietender
  rationale: φοβερός bezeichnet jemanden, der Furcht oder ehrfürchtiges Erschauern hervorruft. „Furchtgebietender“ wahrt diese Spannweite besser als das im Deutschen missverständliche „Furchtsamer“.
- source_word: ὁ ἰσχυρὸς
  choice: Mächtiger
  rationale: Eine knappe und im Gebetsregister natürliche Wiedergabe göttlicher Stärke.
- source_word: δίκαιος
  choice: Gerechter
  rationale: Bezeichnet Gottes gerechtes Wesen und erhält durch die Substantivierung die Reihung der griechischen Attribute.
- source_word: ἐλεήμων
  choice: Barmherziger
  rationale: Die geläufige und präzise Wiedergabe für ein von Erbarmen geprägtes Wesen.
- source_word: ὁ μόνος βασιλεὺς
  choice: du alleiniger König
  rationale: „Alleiniger“ bewahrt die exklusive Aussage von μόνος über Gottes Königtum.
- source_word: χρηστός
  choice: Gütiger
  rationale: „Gütiger“ umfasst hier Güte und freundliche Zuwendung und erhält die substantivierte Form der Anrede.
theological_decisions:
- issue: Wiedergabe von κύριος in der jüdischen Gebetsanrede
  choice: Herr
  alternative: Gebieter
  rationale: „Herr“ ist die natürliche, traditionsübergreifende Wiedergabe der direkten Anrede und legt keine zusätzliche Deutung fest.
- issue: Ausschließlichkeitsanspruch in μόνος βασιλεὺς
  choice: du alleiniger König
  alternative: du einziger König
  rationale: „Alleiniger“ bringt die ausschließliche Königsherrschaft Gottes klar zum Ausdruck, ohne die Aussage auszubauen.
- issue: Bedeutungsspannweite von φοβερός
  choice: Furchtgebietender
  alternative: Ehrfurchtgebietender
  rationale: Die gewählte Form bewahrt sowohl den Aspekt der Furcht als auch den der überwältigenden Ehrfurcht, statt den Ausdruck nur auf Bewunderung zu verengen.
translation_notes:
  register: Modernes, würdiges Gebetsdeutsch. Das wiederholte „du“ macht die griechischen substantivierten Gottesattribute im Deutschen als direkte Anrede verständlich; die Reihung bleibt bewusst feierlich. Der Vers endet entsprechend der Vorlage mitten im fortlaufenden Gebet mit einem Komma.
