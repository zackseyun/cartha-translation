  text: But in his rage he thought to vent on the Jews the malice of those who had put him to flight. Therefore he ordered the charioteer[a], driving without stopping, to press on with the journey, while the judgment from heaven was accompanying him. For in his arrogance he had said, “When I arrive there, I will make Jerusalem a burial place of Jews.”
translation:
  language: de
  text: 'Doch von Zorn getrieben, gedachte er, die Bosheit derer, die ihn in die Flucht geschlagen hatten, an den Juden auszulassen. Darum befahl er dem Wagenlenker, durch ununterbrochenes Fahren die Reise zu Ende zu bringen, während das Gericht vom Himmel ihn begleitete. Denn in seinem Hochmut hatte er gesagt: »Wenn ich dort ankomme, werde ich Jerusalem zu einer Begräbnisstätte für Juden machen.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »zu einem Massengrab für Juden«. Das griechische Wort bezeichnet eine Begräbnisstätte für viele Tote.'
    reason: lexikalische Alternative zu Πολυάνδριον
lexical_decisions:
- source_word: ἐπαρθεὶς ... τῷ θυμῷ
  choice: von Zorn getrieben
  rationale: Gibt das vom Zorn Erfasst- und Angetriebensein idiomatisch wieder, ohne das griechische Bild mechanisch nachzuahmen.
- source_word: τῶν πεφυγαδευκότων αὐτὸν κακίαν
  choice: die Bosheit derer, die ihn in die Flucht geschlagen hatten
  rationale: πεφυγαδευκότων bezeichnet hier das Veranlassen zur Flucht; κακία bleibt mit „Bosheit“ bewusst weit und bezeichnet die ihm zugeschriebene feindselige Schlechtigkeit.
- source_word: ἐναπερείσασθαι
  choice: an den Juden auszulassen
  rationale: Drückt natürlich aus, dass Antiochus die gegen andere gerichtete Wut beziehungsweise Vergeltung auf die Juden abwälzen will.
- source_word: συνέταξεν τὸν ἁρματηλάτην
  choice: befahl er dem Wagenlenker
  rationale: „Wagenlenker“ gibt die konkrete Berufs- beziehungsweise Funktionsbezeichnung ἁρματηλάτης präzise und verständlich wieder.
- source_word: ἀδιαλείπτως ἐλαύνοντα καταλύειν τὴν πορείαν
  choice: durch ununterbrochenes Fahren die Reise zu Ende zu bringen
  rationale: Bewahrt sowohl das unablässige Fahren als auch die mögliche Bedeutung von καταλύειν als Beendigen beziehungsweise ans Ziel Bringen der Reise.
- source_word: τῆς ἐξ οὐρανοῦ τῆς κρίσεως συνοδούσης αὐτῷ
  choice: während das Gericht vom Himmel ihn begleitete
  rationale: Der Genitivus absolutus wird als gleichzeitiger Vorgang wiedergegeben; „Gericht“ erhält den richterlichen Sinn von κρίσις und „begleitete“ das Bild von συνοδεῖν.
- source_word: ὑπερηφάνως
  choice: in seinem Hochmut
  rationale: Gibt die hochmütige, vermessene Haltung in einem würdigen und geläufigen deutschen Ausdruck wieder.
- source_word: Πολυάνδριον
  choice: Begräbnisstätte
  rationale: Das Wort bezeichnet einen Ort, an dem viele Tote bestattet werden. „Begräbnisstätte“ wahrt die Bedeutung, ohne die konkrete Form voreilig festzulegen.
theological_decisions:
- issue: Göttliche Herkunft des Gerichts über Antiochus
  choice: das Gericht vom Himmel ihn begleitete
  alternative: die Strafe vom Himmel folgte ihm
  rationale: „Gericht“ bewahrt den forensischen und theologischen Gehalt von κρίσις, während „vom Himmel“ die im Text ausdrücklich genannte Herkunft stehen lässt. Das Begleitmotiv wird nicht zu einem bloßen zeitlichen Nachfolgen abgeschwächt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt erzählerisch klar; der drohende Ton des Zitats und die ausdrückliche himmlische Gerichtsaussage werden bewahrt.
