  yaml_path: translation/deuterocanon/2_maccabees/009/028.yaml
  text: So then the murderer and blasphemer[a], after suffering the worst things, just as he had treated others, came to a most pitiable end in a foreign land among the mountains.
translation:
  language: de
  text: So fand der Mörder und Gotteslästerer, nachdem er das Schlimmste erlitten hatte, wie er mit anderen verfahren war, in einem fremden Land in den Bergen ein äußerst beklagenswertes Ende.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der griechische Text des vorgelegten Zeugen bricht am Zeilenende bei κατέ- ab; der Satz wird offenkundig mit der Aussage fortgesetzt, dass er sein Ende fand oder starb. Die Übersetzung gibt diese Fortsetzung wieder.
    reason: textual_variant
lexical_decisions:
- source_word: ἀνδροφόνος
  choice: Mörder
  rationale: Das Kompositum bezeichnet einen Menschen, der andere Menschen tötet; „Mörder“ gibt die deutliche moralische Verurteilung im Kontext natürlich und knapp wieder.
- source_word: βλάσφημος
  choice: Gotteslästerer
  rationale: Im Kontext richtet sich die Lästerung gegen Gott. „Gotteslästerer“ macht diesen religiösen Bezug im Deutschen klarer als das allgemeinere „Lästerer“.
- source_word: τὰ χείριστα παθών
  choice: nachdem er das Schlimmste erlitten hatte
  rationale: Die temporale Wiedergabe des Partizips ist im Deutschen natürlich; „das Schlimmste“ bewahrt den Superlativ, ohne die Leiden näher festzulegen.
- source_word: ὡς ἑτέρους διέθηκεν
  choice: so wie er es anderen angetan hatte
  rationale: Die Formulierung wahrt den Gedanken entsprechender Vergeltung und gibt διέθηκεν in diesem leidvollen Zusammenhang idiomatisch wieder.
- source_word: ἐπὶ ξένης
  choice: in einem fremden Land
  rationale: Die Wendung bezeichnet einen Ort fern der Heimat und bewahrt das Pathos seines Todes in der Fremde.
- source_word: ἐν τοῖς ὄρεσιν
  choice: in den Bergen
  rationale: Dies ist die direkte und natürliche deutsche Ortsangabe für die Präpositionalfügung.
- source_word: οἰκτίστῳ μόρῳ
  choice: ein höchst beklagenswertes Ende
  rationale: μόρος bezeichnet hier das Todesgeschick beziehungsweise Ende; οἰκτίστῳ ist ein Superlativ und wird durch „höchst beklagenswert“ formell und verständlich wiedergegeben.
- source_word: κατέ-
  choice: fand ... ein ... Ende
  rationale: Der vorgelegte Zeuge bricht am Zeilenende bei κατέ- ab; aus Fortsetzung und Satzsinn ergibt sich jedoch eindeutig das Zu-Ende-Kommen beziehungsweise Sterben. Die deutsche Wendung gibt diesen Sinn zurück.
theological_decisions:
- issue: Moralisch-vergeltender Rahmen des Todes des Antiochus
  choice: 'Die entsprechende Vergeltung bleibt ausdrücklich: Er erlitt das Schlimmste so, wie er es anderen angetan hatte.'
  alternative: Den Vers lediglich als Bericht seines Todes wiederzugeben, ohne den Vergleich mit seinem Handeln an anderen hervorzuheben.
  rationale: Die Wendung ὡς ἑτέρους διέθηκεν trägt den Gedanken angemessenen Gerichts und darf nicht abgeschwächt werden.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, allgemein verständlichem Erzählstil. Der Satzbau bleibt dem griechischen Gedankengang nahe, ohne hölzern zu wirken; die scharfe moralische Bezeichnung und die Spannung zwischen Vergeltung und beklagenswertem Ende bleiben erhalten.
