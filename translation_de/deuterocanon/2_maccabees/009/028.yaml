  terminology: „Mörder“ und „Gotteslästerer“ sind im Kontext angemessene, klare Wiedergaben von ἀνδροφόνος und βλάσφημος. „Fremdes Land“, „Berge“ und „Ende“ bewahren die Orts- und Todesangaben. Die retributive Aussage bleibt ausdrücklich erhalten, ohne sie konfessionell auszudeuten.
