  text: very justly[b][a], he who had tortured the inward parts of others with many and foreign afflictions.
translation:
  language: de
  text: völlig zu Recht, da er die Eingeweide[a] anderer mit vielen ungewöhnlichen Leiden[b] gefoltert hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „innere Organe“. Das griechische Wort ist hier konkret und körperlich gemeint, nicht nur im Sinn innerer Gefühle.
    reason: lexical_alternative
  - marker: b
    text: Oder „mit vielen fremdartigen Heimsuchungen“. Das griechische Adjektiv kann „fremd“, „seltsam“ oder „ungewöhnlich“ bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάνυ δικαίως
  choice: völlig zu Recht
  rationale: πάνυ verstärkt δικαίως. „Völlig zu Recht“ bewahrt sowohl die adverbiale Form als auch das ausdrückliche moralische Urteil.
- source_word: σπλάγχνα
  choice: Eingeweide
  rationale: Das Wort bezeichnet konkret die inneren Organe beziehungsweise Eingeweide. Im Zusammenhang körperlicher Folter ist eine leibliche Wiedergabe sachgemäßer als eine übertragene Bedeutung wie „Herz“.
- source_word: βασανίσαντα
  choice: gefoltert hatte
  rationale: Das Partizip bezeichnet schwere Peinigung oder Folter. Das Plusquamperfekt gibt im Deutschen natürlich wieder, dass diese Taten der nun beschriebenen Vergeltung vorausgingen.
- source_word: πολλαῖς καὶ ξενίζουσαις συμφοραῖς
  choice: mit vielen ungewöhnlichen Leiden
  rationale: συμφοραί bezeichnet hier zugefügte Leiden oder Heimsuchungen; ξενίζουσαις hebt deren fremdartigen beziehungsweise ungewöhnlichen Charakter hervor. „Ungewöhnlich“ ist im modernen Deutschen klarer als das missverständliche „fremd“.
- source_word: τὸν ... βασανίσαντα
  choice: da er ... gefoltert hatte
  rationale: Der substantivierte Partizipialausdruck bezeichnet den Betroffenen als denjenigen, der andere zuvor gefoltert hatte. Die kausale Fügung stellt im Deutschen den vom Kontext und von δικαίως angezeigten Vergeltungszusammenhang natürlich dar.
theological_decisions:
- issue: Moralische Bewertung des Leidens des Antiochus
  choice: „völlig zu Recht“ bezeichnet sein Leiden ausdrücklich als gerechte Vergeltung.
  alternative: Eine mildere Wiedergabe wie „durchaus verdient“ oder „ganz zu Recht“.
  rationale: Der griechische Ausdruck πάνυ δικαίως enthält ein unübersehbares moralisches Urteil. Dieses wird bewahrt, ohne die Art oder den Urheber der Vergeltung über den Wortlaut hinaus zu bestimmen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die körperliche Härte des griechischen Ausdrucks bleibt mit „Eingeweide“ und „gefoltert“ erhalten; zugleich vermeidet „ungewöhnliche Leiden“ das im Deutschen missverständliche „fremde Leiden“.
