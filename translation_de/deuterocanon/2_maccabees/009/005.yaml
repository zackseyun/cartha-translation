  text: But the all-seeing Lord, the God of Israel, struck him with an incurable and unseen blow; and just as he finished speaking, an unrelenting pain in his bowels seized him, with bitter torments in his inner parts,
translation:
  language: de
  text: Doch der allsehende Herr, der Gott Israels, schlug ihn mit einem unheilbaren, unsichtbaren Schlag[a]. Kaum hatte er ausgeredet, da ergriff ihn ein unheilbarer Schmerz in den Eingeweiden und bittere Qualen in seinem Inneren[b].
