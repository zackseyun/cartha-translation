    reason: lexical_alternative
lexical_decisions:
- source_word: παντεπόπτης
  choice: alles sehende
  rationale: Das Kompositum bezeichnet den, der alles sieht. Die Wendung ist im Deutschen klar und bewahrt die Aussage göttlicher Allsicht.
- source_word: κύριος
  choice: Herr
  rationale: Hier steht κύριος als göttlicher Titel in Apposition zu »der Gott Israels«.
- source_word: ἐπάταξεν
  choice: schlug
  rationale: Das Verb bezeichnet unmittelbar das Schlagen; die direkte göttliche Urheberschaft bleibt erhalten.
- source_word: ἀνιάτῳ καὶ ἀοράτῳ πληγῇ
  choice: mit einem unheilbaren, unsichtbaren Schlag
  rationale: Die beiden Adjektive werden eng am Griechischen wiedergegeben. »Schlag« erhält das Bild zu »schlug«, während die Fußnote den Bedeutungsbereich von πληγή offenlegt.
- source_word: ἄρτι ... καταλήξαντος τὸν λόγον
  choice: Kaum hatte er ausgeredet
  rationale: Die Formulierung gibt den unmittelbaren zeitlichen Anschluss idiomatisch und prägnant wieder.
- source_word: ἔλαβεν αὐτὸν
  choice: da ergriff ihn
  rationale: »Ergriff« vermittelt das plötzliche Einsetzen des Schmerzes.
- source_word: ἀνήκεστος τῶν σπλάγχνων ἀλγηδών
  choice: ein unheilbarer Schmerz in den Eingeweiden
  rationale: ἀνήκεστος bedeutet nicht heilbar beziehungsweise nicht zu beheben; σπλάγχνα bezeichnet die inneren Organe oder Eingeweide. Die konkrete Körperlichkeit des Ausgangstextes bleibt gewahrt.
- source_word: πικραὶ τῶν ἔνδον βάσανοι
  choice: qualvolle Schmerzen im Innern
  rationale: Die Wiedergabe vermeidet im Deutschen eine schwerfällige wörtliche Verdopplung und bringt die heftige innere Qual natürlich zum Ausdruck.
theological_decisions:
- issue: Göttliche Urheberschaft des Leidens
  choice: Gott wird ausdrücklich als der Handelnde dargestellt, der Antiochus schlägt.
  alternative: Eine abschwächende Wiedergabe könnte sagen, Gott habe das Leiden zugelassen.
  rationale: Der griechische Text nennt den Herrn, den Gott Israels, ausdrücklich als Subjekt von ἐπάταξεν. Diese direkte Zuschreibung darf nicht abgeschwächt werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Eingeweide« bewahrt die anschauliche körperliche Sprache, ohne unnötig medizinisch zu wirken. Die zweimalige Vorstellung des Unheilbaren folgt der griechischen Wortwahl, obwohl dort zwei verschiedene Adjektive stehen.
