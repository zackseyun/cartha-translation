    text: 'Oder: »mit einer unheilbaren, unsichtbaren Plage« beziehungsweise »Verwundung«. Das griechische Wort kann einen Schlag, eine Verletzung oder eine Plage bezeichnen.'
    reason: lexical_alternative
  - marker: b
