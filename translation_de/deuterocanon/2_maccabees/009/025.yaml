base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/009/025.yaml
  text: Moreover[a], considering the rulers nearby and those bordering the kingdom, who are watching for opportunities and awaiting what will happen, I have appointed my son Antiochus as king, whom, when I repeatedly went up to the upper satrapies, I often entrusted and commended to most of you[b]. And I have written to him the things written below.
translation:
  language: de
  text: Überdies habe ich, da ich die Herrscher in der Nähe und diejenigen an den Grenzen des Königreichs[a] im Blick habe, die günstige Gelegenheiten abpassen und abwarten, was geschehen wird, meinen Sohn Antiochus zum König bestimmt. Ihn habe ich bei meinen häufigen Reisen in die oberen Satrapien[b] den meisten von euch anvertraut und empfohlen. Ihm habe ich das nachstehend Geschriebene geschrieben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: »die benachbarten Herrscher und diejenigen, die an das Königreich angrenzen«. Das Griechische häuft einander überschneidende geografisch-politische Bezeichnungen, um die umliegenden Mächte hervorzuheben.'
    reason: lexical_alternative
  - marker: b
    text: »Satrapien« ist der im Griechischen verwendete persische Verwaltungsbegriff. Die »oberen Satrapien« können allgemein die weiter im Landesinneren oder im Osten gelegenen Provinzen bezeichnen.
    reason: cultural_note
lexical_decisions:
- source_word: κατανοῶν
  choice: im Blick habe
  rationale: Die Wendung bezeichnet hier ein aufmerksames Wahrnehmen und Abwägen der politischen Lage, nicht nur ein optisches Sehen.
- source_word: τοὺς παρακειμένους δυνάστας
  choice: die Herrscher in der Nähe
  rationale: δυνάσται sind konkrete Machthaber oder Herrscher; παρακείμενοι bezeichnet ihre räumliche Nähe.
- source_word: γειτνιῶντας τῆς βασιλείας
  choice: diejenigen an den Grenzen des Königreichs
  rationale: Die substantivisch gebrauchte Partizipialform bezeichnet weitere angrenzende politische Akteure. Die Übersetzung bewahrt die Überschneidung mit der vorangehenden Beschreibung.
- source_word: τοῖς καιροῖς ἐπέχοντας
  choice: die günstige Gelegenheiten abpassen
  rationale: καιρός bezeichnet häufig den geeigneten oder günstigen Zeitpunkt; ἐπέχω drückt hier gespannte Aufmerksamkeit aus. Die Formulierung lässt den politischen Opportunismus erkennen, ohne ein konkretes Vorhaben hinzuzufügen.
- source_word: προσδοκῶντας τὸ ἀποβησόμενον
  choice: abwarten, was geschehen wird
  rationale: Die offene Formulierung gibt die Erwartung des noch unbekannten Ausgangs natürlich wieder.
- source_word: ἀναδέδειχα
  choice: habe ... bestimmt
  rationale: Im Zusammenhang der Thronfolge bezeichnet das Verb die förmliche Einsetzung oder Designation zum König.
- source_word: τὸν υἱὸν Ἀντίοχον βασιλέα
  choice: meinen Sohn Antiochus zum König
  rationale: Der doppelte Akkusativ bezeichnet Antiochus als denjenigen, der in die Königswürde eingesetzt wird.
- source_word: πολλάκις ἀνατρέχων εἰς τὰς ἄνω σατραπίας
  choice: bei meinen häufigen Reisen in die oberen Satrapien
  rationale: Die Wendung hat wiederholenden Sinn. 'Satrapien' bewahrt den persischen Verwaltungsterminus, während 'obere' ἄνω direkt wiedergibt.
- source_word: παρεκατετίθεμην
  choice: habe ... anvertraut
  rationale: Die mediale Verbform bezeichnet das Übergeben einer Person in die Fürsorge oder Obhut anderer.
- source_word: συνίστων
  choice: empfohlen
  rationale: Das Verb bedeutet hier, eine Person anderen empfehlend vorzustellen; die Wortwahl unterscheidet den Vorgang vom vorausgehenden Anvertrauen.
- source_word: τὰ ὑπογεγραμμένα
  choice: das nachstehend Geschriebene
  rationale: Die dokumentarische Formulierung verweist auf den anschließend wiedergegebenen Inhalt des Schreibens.
