  text: so that[a], if anything unexpected should happen and some difficulty should arise, those in the country, knowing to whom the affairs have been entrusted, may not be thrown into confusion;
translation:
  language: de
  text: damit die Menschen im Land, falls etwas Unerwartetes geschieht und eine Schwierigkeit auftritt, in dem Wissen, wem die Angelegenheiten anvertraut worden sind[a], nicht in Verwirrung geraten;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wem die Angelegenheiten überlassen worden sind“. Das griechische Perfektpassiv kann sowohl das bloße Überlassen als auch die förmliche Übertragung von Verantwortung betonen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπως
  choice: damit
  rationale: Leitet den Zweck ein und gibt die finale Bedeutung im Deutschen knapp und natürlich wieder.
- source_word: ἐάν τι παράδοξον ἀποβῇ
  choice: falls etwas Unerwartetes geschieht
  rationale: παράδοξον bezeichnet hier ein unerwartetes oder ungewöhnliches Ereignis; die Formulierung bewahrt den offenen Bedingungscharakter, ohne das Ereignis näher festzulegen.
- source_word: προσπέλθῃ τι δυσχερές
  choice: eine schwierige Lage eintritt
  rationale: Das substantivierte δυσχερές bezeichnet etwas Schwieriges oder Bedrängendes. Die idiomatische deutsche Wendung passt zum politischen Zusammenhang und zur parallelen Ereignisformulierung.
- source_word: εἰδότες
  choice: in dem Wissen
  rationale: Gibt das begleitende Partizip wieder, ohne sein Verhältnis zum Hauptverb unnötig auf eine ausschließlich kausale Deutung festzulegen.
- source_word: οἱ κατὰ τὴν χώραν
  choice: die Menschen im Land
  rationale: Bezeichnet allgemein die im Herrschaftsgebiet lebenden Menschen; „Land“ ist weiter und weniger verwaltungstechnisch als „Provinz“.
- source_word: ᾧ καταλέλειπται τὰ πράγματα
  choice: wem die Angelegenheiten anvertraut worden sind
  rationale: „Angelegenheiten“ wahrt die Breite von τὰ πράγματα, während „anvertraut“ die im Kontext naheliegende Übertragung von Verantwortung ausdrückt. Die mögliche schlichtere Bedeutung „überlassen“ wird in der Fußnote bewahrt.
- source_word: μὴ ἐπιταράσσωνται
  choice: nicht in Verwirrung geraten
  rationale: Erfasst die verstärkte Unruhe oder Erschütterung, die ἐπιταράσσω in diesem politischen Zusammenhang bezeichnet.
