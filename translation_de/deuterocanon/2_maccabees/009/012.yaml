base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/009/012.yaml
  text: 'As his pains intensified from moment to moment[a], and he was not even able to endure his own stench, he said this: “It is right to submit to God[c][b], and for one who is mortal not to think proudly.”'
translation:
  language: de
  text: 'Als ihm die Schmerzen von Augenblick zu Augenblick[a] immer heftiger zusetzten und er nicht einmal seinen eigenen Gestank ertragen konnte, sagte er: »Es ist recht[b], sich Gott zu unterwerfen und als sterblicher Mensch nicht hochmütig zu denken.[c]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Augenblick für Augenblick“; möglicherweise auch: „unablässig“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Es ist gerecht“ beziehungsweise „Es ist angemessen“.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlicher: „und nicht, sterblich seiend, hochmütig zu denken“; gemeint ist ein allgemeiner Grundsatz über den Menschen angesichts seiner Sterblichkeit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ στιγμὴν
  choice: von Augenblick zu Augenblick
  rationale: Die Wendung bezeichnet eine fortschreitende Entwicklung über aufeinanderfolgende Augenblicke hinweg und wird im Deutschen natürlich und zugleich quellennah wiedergegeben.
- source_word: ἐπιτεινόμενος ταῖς ἀλγηδόσιν
  choice: ihm die Schmerzen … immer heftiger zusetzten
  rationale: Das maskuline Partizip bezieht sich auf den Leidenden; der Dativ bezeichnet die Schmerzen, durch die sein Zustand zunehmend verschärft wird. Die Formulierung bewahrt diesen Bezug natürlicher als eine rein substantivische Aussage über sich verstärkende Schmerzen.
- source_word: μηδὲ τῆς ὀσμῆς αὐτοῦ ἀνέχεσθαι δυνάμενος
  choice: er nicht einmal seinen eigenen Gestank ertragen konnte
  rationale: ὀσμή bedeutet Geruch; im Zusammenhang der Krankheit ist „Gestank“ sachlich angemessen. αὐτοῦ wird als Rückbezug auf seinen eigenen Körper ausdrücklich wiedergegeben.
- source_word: ταῦτʼ ἔφη
  choice: sagte er
  rationale: Die schlichte Redeeinleitung gibt den griechischen Ausdruck idiomatisch wieder; ein zusätzliches „dies“ ist im Deutschen vor direkter Rede entbehrlich.
- source_word: Δίκαιον
  choice: Es ist recht
  rationale: Das prädikativ und unpersönlich gebrauchte Adjektiv umfasst moralische Richtigkeit und Angemessenheit, ohne die Aussage unnötig einzuengen.
- source_word: ὑποτάσσεσθαι τῷ θεῷ
  choice: sich Gott zu unterwerfen
  rationale: Die reflexive Form bringt das Sich-Unterordnen unter Gottes Autorität präzise zum Ausdruck und bewahrt die starke Bedeutung des griechischen Verbs.
- source_word: μὴ θνητὸν ὄντα
  choice: als sterblicher Mensch nicht
  rationale: Die Formulierung erhält die Begründung durch menschliche Sterblichkeit und lässt die Aussage als allgemeinen Grundsatz erkennen.
- source_word: ὑπερήφανα φρονεῖν
  choice: hochmütig zu denken
  rationale: Die Wiedergabe bewahrt die kognitive Bedeutung von φρονεῖν und den Hochmutssinn des Adverbs, statt nur allgemein ein arrogantes Verhalten zu bezeichnen.
theological_decisions:
- issue: Allgemeine Aussage über menschliche Sterblichkeit in μὴ θνητὸν ὄντα
  choice: als sterblicher Mensch nicht hochmütig zu denken
  alternative: und, da man sterblich ist, nicht hochmütig zu denken
  rationale: Der griechische Ausdruck formuliert einen allgemeinen Grundsatz, auch wenn er aus dem Mund eines bestimmten Mannes kommt. „Mensch“ macht die generische Reichweite im modernen Deutsch deutlich, ohne die Aussage auf Männer zu beschränken.
- issue: Bedeutungsumfang von Δίκαιον
  choice: Es ist recht
  alternative: Es ist gerecht / Es ist angemessen
  rationale: „Recht“ lässt sowohl die moralische Richtigkeit als auch die Angemessenheit der Unterordnung unter Gott anklingen und legt keine engere dogmatische Deutung fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die körperliche Not wird anschaulich, aber nicht ausgeschmückt wiedergegeben. Die direkte Rede bleibt knapp und sentenzartig; „sich Gott zu unterwerfen“ wahrt die Stärke des Ausgangstextes.
