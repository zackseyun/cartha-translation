base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/009/013.yaml
  text: 'But the polluted man kept praying to the Master who would no longer have mercy on him[b][a], saying this:'
translation:
  language: de
  text: 'Doch der Befleckte[a] betete weiter zu dem Gebieter[b], der kein Erbarmen mehr mit ihm haben würde, und sagte:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »der Unreine«. Das griechische Adjektiv bezeichnet eine starke moralische oder kultische Befleckung.'
    reason: lexical_alternative
  - marker: b
    text: Griechisch δεσπότης, »Gebieter«; hier steht nicht das häufigere Wort κύριος, »Herr«.
    reason: lexical_alternative
lexical_decisions:
- source_word: ηὔχετο
  choice: betete weiter
  rationale: Der Imperfekt bezeichnet einen andauernden Vorgang. »Betete weiter« gibt diesen durativen Sinn in natürlichem Deutsch wieder.
- source_word: ὁ μιερὸς
  choice: der Befleckte
  rationale: Das substantivierte Adjektiv bezeichnet eine Person, die in starkem moralischem oder kultischem Sinn befleckt beziehungsweise unrein ist. »Der Befleckte« bewahrt diese wertende Bildsprache.
- source_word: δεσπότην
  choice: Gebieter
  rationale: δεσπότης betont uneingeschränkte Verfügungsgewalt und Autorität. »Gebieter« erhält zudem den Unterschied zum häufigeren Gottes­titel κύριος (»Herr«).
- source_word: οὐκέτι
  choice: kein … mehr
  rationale: Die deutsche Wendung gibt die zeitliche Verneinung »nicht länger« idiomatisch wieder.
- source_word: ἐλεήσοντα
  choice: Erbarmen … haben würde
  rationale: Das Futurpartizip bezeichnet hier aus der Erzählperspektive ein künftig nicht mehr erfolgendes Erbarmen; die Konstruktion mit »würde« bewahrt diesen Zukunftsbezug.
- source_word: οὕτως λέγων
  choice: 'und sagte:'
  rationale: Die Formulierung leitet die unmittelbar folgende Rede ein. Im Deutschen ist der Doppelpunkt die natürliche Entsprechung zu »indem er so sprach« beziehungsweise »wobei er Folgendes sagte«.
theological_decisions:
- issue: Wiedergabe von δεσπότης als Gottesbezeichnung
  choice: Gebieter
  alternative: Herr; Herrscher
  rationale: Der griechische Text verwendet δεσπότης und nicht κύριος. »Gebieter« bewahrt die besondere Betonung souveräner Verfügungsgewalt, ohne beide Titel gleichzusetzen.
- issue: Aussage, dass Gott kein Erbarmen mehr haben würde
  choice: als bestimmte Aussage des Erzählers beibehalten
  alternative: als bloße Erwartung oder Befürchtung des Betenden formulieren
  rationale: Das attributive Futurpartizip beschreibt den Gebieter als denjenigen, der sich seiner nicht mehr erbarmen wird. Eine Abschwächung zu subjektiver Befürchtung wäre im griechischen Satz nicht ausdrücklich markiert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Gebieter« und »der Befleckte« sind bewusst markierte, aber verständliche Wörter, die die starke Wertung und die besondere Gottesbezeichnung des griechischen Textes erhalten.
