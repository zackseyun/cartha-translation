base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/009/020.yaml
  text: Farewell[a], and your children. And your own affairs—your own affairs—your own affairs will be according to your judgment. Having my hope in heaven,
translation:
  language: de
  text: Lebt wohl, ihr und eure Kinder. Und eure eigenen Angelegenheiten – eure eigenen Angelegenheiten – eure eigenen Angelegenheiten – werden sich nach eurem Urteil richten.[a] Wobei ich meine Hoffnung auf den Himmel richte,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der hier zugrunde gelegte griechische Text wiederholt „eure eigenen Angelegenheiten“ dreimal. Dies kann als nachdrückliche Wiederholung verstanden werden; möglicherweise handelt es sich aber auch um eine versehentliche Vervielfachung in der Textüberlieferung.
    reason: textual_variant
lexical_decisions:
- source_word: ἐρρῶσθε
  choice: Lebt wohl
  rationale: Die Form ist hier als konventioneller brieflicher Abschieds- und Segenswunsch zu verstehen, nicht als bloße Aufforderung zu körperlicher Stärke.
- source_word: τὰ τέκνα
  choice: ihr und eure Kinder
  rationale: Der Artikel kann im Zusammenhang possessiv wiedergegeben werden. Die Ergänzung „ihr und“ verbindet den verkürzten griechischen Ausdruck idiomatisch mit dem vorausgehenden Abschiedswunsch.
- source_word: τὰ ἴδια
  choice: eure eigenen Angelegenheiten
  rationale: Das substantivierte Neutrum Plural bezeichnet hier die persönlichen Belange oder Angelegenheiten der Adressaten; „Angelegenheiten“ ist präzise und im Deutschen natürlich.
- source_word: κατὰ γνώμην ὑμῶν
  choice: nach eurem Urteil
  rationale: γνώμη bezeichnet hier Urteil, Auffassung oder überlegte Entscheidung. Die Formulierung wahrt den sachlich-formellen Ton und lässt die genaue Nuance offen.
- source_word: ἔσται
  choice: werden sich … richten
  rationale: Die einfache Zukunft von εἰμί wird zusammen mit κατὰ γνώμην idiomatisch als „werden sich nach … richten“ wiedergegeben, ohne den Sinn inhaltlich auszuweiten.
- source_word: εἰς οὐρανὸν τὴν ἐλπίδα ἔχων
  choice: Da ich meine Hoffnung auf den Himmel setze
  rationale: Die deutsche Wendung gibt die Ausrichtung der Hoffnung wieder und erhält durch den anschließenden Beistrich den im Quelltext fortführenden Charakter des Partizipialsatzes.
theological_decisions:
- issue: Dreifache Wiederholung von τὰ ἴδια im griechischen Zeugen
  choice: Die dreifache Wiederholung wird im Haupttext beibehalten.
  alternative: Die Wendung nur einmal wiedergeben und die Wiederholung als versehentliche Textverdopplung beziehungsweise -verdreifachung ansehen.
  rationale: Der vorgelegte griechische Ausgangstext enthält die Wendung dreimal. Da sowohl emphatische Wiederholung als auch ein Überlieferungsfehler möglich sind, wird keine Möglichkeit stillschweigend ausgeschlossen; die Unsicherheit wird in einer Fußnote offengelegt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der briefliche Abschiedswunsch wird idiomatisch formuliert; die auffällige Wiederholung des Ausgangstextes bleibt sichtbar. Der abschließende Beistrich bewahrt den fragmentarischen, zum folgenden Zusammenhang weiterführenden Satzbau.
