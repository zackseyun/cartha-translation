base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/009/008.yaml
  text: But the one who had thought[a], in his arrogance over men, to command even the waves of the sea, and imagined that he could weigh out the heights of the mountains on a scale, was brought down to the ground and carried in a litter[b], plainly showing to all the power of God.
translation:
  language: de
  text: Er aber, der sich in seinem Hochmut[a] über die Menschen zutraute, sogar den Wellen des Meeres zu gebieten, und sich einbildete, die Höhen der Berge auf einer Waage abwiegen zu können, war zu Boden gekommen und wurde auf einer Tragbahre fortgetragen. So machte er allen Gottes Macht offenkundig.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »wegen seines Hochmuts über die Menschen«. Das Griechische kann den Hochmut als Grund seiner Anmaßung hervorheben.'
    reason: lexical_alternative
  - marker: b
    text: 'Der griechische Text hat hier die unregelmäßige Folge »den Glauben, den Glauben, die Macht«. Wahrscheinlich liegt eine Textverderbnis oder eine Abschreibwiederholung vor; der Haupttext folgt dem klaren Sinn des Satzes: »Gottes Macht«.'
    reason: textual_variant
lexical_decisions:
- source_word: ἀντιδοκῶν τοῖς τῆς θαλάσσης κύμασιν
  choice: der sich … zugetraut hatte, sogar den Wellen des Meeres zu gebieten
  rationale: Die Wendung beschreibt die vermessene Selbsteinschätzung des Antiochus. Die idiomatische deutsche Fassung bewahrt den Gedanken, er habe selbst die Meereswellen beherrschen können, und leitet den ironischen Gegensatz zu seiner Erniedrigung ein.
- source_word: διὰ τὴν ὑπὲρ ἀνθρώπων ὑπερηφανίαν
  choice: in seinem Hochmut über die Menschen
  rationale: ὑπὲρ ἀνθρώπων bezeichnet hier seine hochmütige Erhebung über andere Menschen. Die Formulierung bleibt nahe am Griechischen und bewahrt die Mehrdeutigkeit, ob sein Hochmut als Ursache oder als Art seiner Anmaßung beschrieben wird.
- source_word: πλάστιγγι τῶν ὀρέων οἰόμενος ὕψη στήσειν
  choice: sich einbildete, die Höhen der Berge auf einer Waage abwiegen zu können
  rationale: πλάστιγξ bezeichnet eine Waage beziehungsweise Waagschale; στήσειν hat in diesem Zusammenhang den Sinn, ein Maß oder Gewicht festzustellen. „Abwiegen“ erhält das übersteigerte Bild in natürlichem Deutsch.
- source_word: κατὰ γῆν γενόμενος
  choice: lag nun am Boden
  rationale: Wörtlich ist er „auf den Boden gekommen“. Die Fassung drückt seinen körperlichen Zustand sowie den rhetorischen Sturz aus seiner selbstbeanspruchten Höhe aus. „Nun“ verdeutlicht den im Satz angelegten Gegensatz, ohne ein zusätzliches Ereignis einzuführen.
- source_word: ἐν φορίᾳ παρεκομίζετο
  choice: wurde auf einer Tragbahre fortgetragen
  rationale: φορία ist ein Traggerät für einen Kranken oder Bewegungsunfähigen. „Tragbahre“ ist historisch unaufdringlich und im heutigen Deutsch eindeutiger als „Sänfte“.
- source_word: φανερὰν τοῦ θεοῦ … τὴν δύναμιν ἐνδεικνύμενος
  choice: So machte er allen Gottes Macht offenkundig
  rationale: Die Partizipialkonstruktion bezeichnet die öffentliche Wirkung seiner Erniedrigung. „So“ macht deutlich, dass sein Zustand unfreiwillig Gottes Macht vor Augen führt.
- source_word: τὴν πίστιν τὴν πίστιν τὴν δύναμιν
  choice: Macht
  rationale: Die zweimalige Wiederholung von πίστιν ist im vorliegenden Text unregelmäßig und wahrscheinlich durch Textverderbnis oder Abschreibwiederholung entstanden. Der Haupttext gibt den klar erkennbaren Satzsinn wieder; die Unregelmäßigkeit wird in einer Fußnote dokumentiert.
theological_decisions:
- issue: Bedeutung von ἀνθρώπων als allgemeine Bezeichnung
  choice: die Menschen
  alternative: die Männer; die Menschheit
  rationale: Der griechische maskuline Plural bezeichnet hier Menschen allgemein. „Die Menschen“ ist im modernen Deutschen sachlich genau und vermeidet die unbeabsichtigte Einschränkung auf männliche Personen.
- issue: Umgang mit dem unregelmäßig wiederholten πίστιν
  choice: Im Haupttext „Gottes Macht“, mit Dokumentation des Befunds in einer Fußnote
  alternative: „Gottes Glauben und Macht“ oder „Gottes Treue und Macht“
  rationale: Die überlieferte Folge „den Glauben, den Glauben, die Macht“ ist syntaktisch und sachlich auffällig. Eine Deutung als „Glaube“ oder „Treue“ würde eine unsichere theologische Aussage festlegen; daher wird der klare Kontextgedanke wiedergegeben und die Textunsicherheit offengelegt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer historischer Bildsprache. Die lange griechische Periode wird am Schluss in zwei Sätze gegliedert, damit die Umkehr von vermessener Höhe zu öffentlicher Erniedrigung verständlich bleibt. Sämtliche Fußnotenmarker stehen an der jeweils sachlich passenden Stelle im Haupttext.
