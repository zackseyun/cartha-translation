base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/009/021.yaml
  text: I remembered your honor and goodwill with affection[a]; after returning from the regions of Persia and falling into an illness that has become severe, I considered it necessary to take thought for the common safety of all of you[c][b];
translation:
  language: de
  text: An eure Achtung und euer Wohlwollen dachte ich mit herzlicher Zuneigung[a]. Nachdem ich aus den Gebieten Persiens zurückgekehrt war und an einer Krankheit erkrankt war, die schwer zu ertragen ist[b], hielt ich es für notwendig, für die gemeinsame Sicherheit von euch allen Sorge zu tragen[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „An eure Ehrerbietung und eure Gunst dachte ich mit inniger Zuneigung.“'
    reason: Lexikalische Alternativen für τιμή, εὔνοια und φιλοστόργως werden sichtbar gemacht.
  - marker: b
    text: 'Wörtlicher: „an einer Krankheit erkrankt war, die Beschwerlichkeit hat“; gemeint ist eine belastende, schwer zu ertragende Erkrankung.'
    reason: Die ungewöhnliche griechische Verbindung ἀσθενείᾳ δυσχερίαν ἔχουσῃ lässt mehrere eng verwandte Wiedergaben zu.
  - marker: c
    text: 'Oder: „für die öffentliche Sicherheit von euch allen“.'
    reason: κοινή kann sowohl „gemeinsam“ als auch im öffentlichen bzw. staatlichen Sinn verstanden werden.
lexical_decisions:
- source_word: τιμή
  choice: Achtung
  rationale: Das Substantiv bezeichnet hier Ehrerbietung bzw. Wertschätzung. „Achtung“ bewahrt im Zusammenhang eines königlichen Schreibens diese Breite, ohne den Ausdruck auf politische Loyalität zu verengen.
- source_word: εὔνοια
  choice: Wohlwollen
  rationale: „Wohlwollen“ gibt die freundliche, dem Sprecher zugewandte Haltung wieder und passt natürlich zur „Achtung“.
- source_word: ἐμνημόνευον
  choice: dachte ich
  rationale: Die Wendung „an ... denken“ ist im Deutschen idiomatisch und kann wie der griechische Imperfekt ein fortdauerndes, zugewandtes Gedenken ausdrücken.
- source_word: φιλοστόργως
  choice: mit herzlicher Zuneigung
  rationale: Der Ausdruck bezeichnet warme, innige, oft familienähnliche Zuneigung. Die Übersetzung bewahrt diese Färbung, ohne ein tatsächliches Verwandtschaftsverhältnis zu behaupten.
- source_word: ἐπαναγαγών
  choice: nachdem ich ... zurückgekehrt bin
  rationale: Das Partizip wird im Kontext am natürlichsten intransitiv verstanden und bezeichnet die Rückkehr des Schreibers.
- source_word: ἐκ τῶν κατὰ τὴν Περσίδα τόπων
  choice: aus den Gebieten Persiens
  rationale: Die Formulierung bezeichnet allgemein Orte oder Landstriche im persischen Raum; „Gebiete Persiens“ ist präzise und gut verständlich.
- source_word: περιπεσών
  choice: in ... geraten bin
  rationale: Mit ἀσθενείᾳ bezeichnet das Verb das Hineingeraten in einen Krankheitszustand.
- source_word: ἀσθενείᾳ
  choice: eine Krankheit
  rationale: Obwohl das Wort auch „Schwäche“ bedeuten kann, bezeichnet es hier im Zusammenhang eindeutig eine Erkrankung.
- source_word: δυσχερίαν ἔχουσῃ
  choice: die schwer zu ertragen ist
  rationale: Die ungewöhnliche griechische Verbindung beschreibt die Krankheit als beschwerlich oder bedrückend. Die Übersetzung bewahrt diesen Sinn, ohne ausdrücklich eine im Griechischen nicht markierte Zustandsveränderung einzuführen.
- source_word: ἀναγκαῖον ἡγησάμην
  choice: hielt ich es für notwendig
  rationale: Dies ist eine natürliche und genaue deutsche Wiedergabe des Urteils bzw. Entschlusses.
- source_word: φροντίσαι
  choice: Sorge zu tragen
  rationale: Die Wendung vermittelt sowohl fürsorgliche Aufmerksamkeit als auch verantwortliches Vorsorgen im administrativen Zusammenhang.
- source_word: κοινῆς πάντων ὑμῶν ἀσφαλείας
  choice: die gemeinsame Sicherheit von euch allen
  rationale: „Gemeinsame Sicherheit“ wahrt den kollektiven bzw. öffentlichen Sinn von κοινή und die Schutz- und Stabilitätsbedeutung von ἀσφάλεια.
