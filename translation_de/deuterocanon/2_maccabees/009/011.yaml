revisions:
- from: Da begann nun das Übermaß seines Hochmuts nachzulassen[a]; gebrochen kam er unter der Zuchtrute Gottes zur Einsicht[b].
  to: Da begann das große Ausmaß seines Hochmuts zu schwinden, und er begann, gebrochen, durch eine göttliche Geißel zur Einsicht zu kommen.[a][b]
  rationale: Die Revision stellt die beiden von „begann“ abhängigen Vorgänge im Deutschen ausdrücklich wieder her. Sie gibt τὸ πολὺ neutral als „das große Ausmaß“ wieder und ersetzt die auslegende „Zuchtrute Gottes“ durch die quellennahe, zugleich moderne Formulierung „durch eine göttliche Geißel“. Die Stellung von „gebrochen“ und „durch eine göttliche Geißel“ lässt offen, wie eng das Gebrochensein und das Erlangen der Einsicht kausal zuzuordnen sind.
