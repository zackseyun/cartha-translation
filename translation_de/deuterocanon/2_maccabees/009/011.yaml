lexical_decisions:
- source_word: ἐνταῦθα οὖν
  choice: Da … nun
  rationale: Kennzeichnet den erreichten Wendepunkt und bewahrt sowohl den zeitlich-lokalen Bezug von ἐνταῦθα als auch die weiterführende Folgerung von οὖν.
- source_word: ἤρξατο
  choice: begann
  rationale: Gibt den inchoativen Sinn wieder und bezieht sich natürlich auf die beiden folgenden Infinitivkonstruktionen.
- source_word: τὸ πολὺ τῆς ὑπερηφανίας
  choice: das Übermaß seines Hochmuts
  rationale: Gibt die idiomatische Größenangabe τὸ πολὺ kompakt wieder; „Hochmut“ bezeichnet hier seine überhebliche Haltung gegenüber Gott.
- source_word: λήγειν
  choice: nachzulassen
  rationale: Drückt das beginnende Aufhören beziehungsweise Schwinden des Hochmuts in natürlichem Deutsch aus.
- source_word: τεθραυσμένος
  choice: gebrochen
  rationale: Bewahrt den resultativen Zustand des perfekten Passivpartizips und lässt den körperlichen wie inneren Zusammenbruch anklingen.
- source_word: εἰς ἐπίγνωσιν ἔρχεσθαι
  choice: zur Einsicht kommen
  rationale: Natürliches Deutsch für das Erlangen von Erkenntnis oder Einsicht, ohne ausdrücklich Reue oder Umkehr zu behaupten.
- source_word: θείᾳ μάστιγι
  choice: unter der Zuchtrute Gottes
  rationale: Bewahrt das Bild der μάστιξ und macht das attributive θεῖος idiomatisch als göttliches Gerichtshandeln verständlich, ohne die konkrete Art des Leidens festzulegen.
theological_decisions:
- issue: Ob der Vers echte Reue oder lediglich erzwungene Einsicht unter dem Gericht ausdrückt
  choice: zur Einsicht kommen
  alternative: zur Umkehr kommen
  rationale: ἐπίγνωσις bezeichnet Erkenntnis, Einsicht oder Anerkennung; der griechische Wortlaut behauptet nicht ausdrücklich Reue oder Umkehr.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung löst die im Griechischen knappe Partizipialfügung natürlich auf; das traditionelle Bild der Zuchtrute bleibt erhalten. Alle Fußnotenmarker stehen im Haupttext.
