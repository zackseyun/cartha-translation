base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/009/002.yaml
  text: For he had entered the so-called Persepolis and attempted to rob the temple and seize control of the city[a]; therefore, when the crowds rushed to arms, they turned him back, and it happened that Antiochus, put to flight by the local inhabitants[b], made a shameful retreat.
translation:
  language: de
  text: Denn er war in die sogenannte Persepolis eingedrungen und hatte versucht, den Tempel zu plündern und die Stadt in seine Gewalt zu bringen. Als deshalb die Volksmengen heranstürmten, griffen sie zu den Waffen[a]. So geschah es, dass Antiochus von den Einheimischen in die Flucht geschlagen wurde und einen schmachvollen Rückzug antrat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »wandten sie sich der Hilfe der Waffen zu«, das heißt, sie leisteten bewaffneten Widerstand.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσεληλύθει
  choice: war … eingedrungen
  rationale: Das Plusquamperfekt wahrt die Vorzeitigkeit; „eingedrungen“ passt zum feindlichen Vorgehen im Kontext.
- source_word: τὴν λεγομένην Περσέπολιν
  choice: das sogenannte Persepolis
  rationale: „sogenannt“ bildet λεγομένην ausdrücklich ab, ohne über den griechischen Wortlaut hinaus Zweifel anzudeuten.
- source_word: ἐπεχείρησεν
  choice: hatte versucht
  rationale: Die Form bezeichnet einen Versuch und lässt offen, ob das Vorhaben ausgeführt wurde.
- source_word: ἱεροσυλεῖν
  choice: den Tempel zu plündern
  rationale: Das Verb bezeichnet spezifisch den Frevel des Raubes an einem Heiligtum; die Formulierung ist klar und kultisch präzise.
- source_word: συνέχειν
  choice: die Stadt in seine Gewalt zu bringen
  rationale: Im militärisch-politischen Zusammenhang bezeichnet das Verb die beabsichtigte Kontrolle über die Stadt.
- source_word: τῶν πληθῶν ὁρμησάντων
  choice: als … die Volksmenge heranstürmte
  rationale: Der Genitivus absolutus beschreibt das plötzliche, energische Vorgehen der örtlichen Bevölkerung.
- source_word: ἐπὶ τὴν τῶν ὅπλων βοήθειαν ἐτράπησαν
  choice: griff sie zu den Waffen
  rationale: Die griechische Wendung bedeutet wörtlich eine Hinwendung zur Hilfe der Waffen und wird im Deutschen idiomatisch als bewaffnete Gegenwehr wiedergegeben.
- source_word: τροπωθέντα
  choice: in die Flucht geschlagen wurde
  rationale: Das militärische Partizip bezeichnet Niederlage und Vertreibung.
- source_word: τῶν ἐγχωρίων
  choice: von den Einheimischen
  rationale: Gemeint sind die Menschen, die an diesem Ort ansässig waren.
- source_word: αἰσχύμονα τὴν ἀναζυγὴν ποιήσασθαι
  choice: einen schmachvollen Rückzug antreten musste
  rationale: Die Wendung verbindet den Abzug mit Schande; „musste“ gibt im Deutschen natürlich die durch die Niederlage erzwungene Folge wieder.
