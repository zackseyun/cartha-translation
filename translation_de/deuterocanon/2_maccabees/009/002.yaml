  register: Modernes, würdiges Standarddeutsch. Der lange griechische Satz ist zur besseren Verständlichkeit in zwei Sätze gegliedert. Der Singular „Volksmenge … sie“ gibt den griechischen Plural τῶν πληθῶν idiomatisch wieder; die Mehrzahl „Volksmengen“ wäre im Deutschen hier schwerfällig.
