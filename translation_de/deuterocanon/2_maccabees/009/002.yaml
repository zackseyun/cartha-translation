  source_fidelity: Die Übersetzung gibt Handlungsablauf, den Versuch des Tempelraubs, die bewaffnete Gegenwehr, die Niederlage des Antiochus und seinen schmachvollen Abzug insgesamt zutreffend wieder. Korrigiert werden sollten jedoch der Numerus von τῶν πληθῶν/ἐτράπησαν (Plural) sowie die unnötig modale Wiedergabe von ποιήσασθαι durch „musste“.
  naturalness: Die revidierte Fassung ist modernes, würdiges Standarddeutsch. „die sogenannte Persepolis“ verwendet zugleich das im Deutschen übliche feminine Genus des Ortsnamens. Der Plural „die Volksmengen“ bildet den griechischen Text ab, ohne unnatürlich zu wirken.
  terminology: „den Tempel zu plündern“ gibt ἱεροσυλεῖν im Kontext angemessen wieder; die Fußnote hält die spezifisch sakrale Dimension des Verbs fest. „in seine Gewalt zu bringen“, „zu den Waffen greifen“, „in die Flucht geschlagen“ und „schmachvoller Rückzug“ sind sachgerecht und registerangemessen.
