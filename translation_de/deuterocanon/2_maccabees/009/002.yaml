revisions:
- from: Denn er war in das sogenannte Persepolis eingedrungen und hatte versucht, den Tempel zu plündern und die Stadt in seine Gewalt zu bringen. Als deshalb die Volksmenge heranstürmte, griff sie zu den Waffen[a]. So geschah es, dass Antiochus von den Einheimischen in die Flucht geschlagen wurde und einen schmachvollen Rückzug antreten musste.
  to: Denn er war in die sogenannte Persepolis eingedrungen und hatte versucht, den Tempel zu plündern und die Stadt in seine Gewalt zu bringen. Als deshalb die Volksmengen heranstürmten, griffen sie zu den Waffen[a]. So geschah es, dass Antiochus von den Einheimischen in die Flucht geschlagen wurde und einen schmachvollen Rückzug antrat.
