translation:
  language: de
  text: sodass sogar aus dem Körper des Gottlosen Würmer hervorwimmelten[a] und ihm noch bei lebendigem Leib unter Schmerzen und Qualen das Fleisch abfiel[b]; wegen seines Gestanks wurde das ganze Heerlager durch die Fäulnis belastet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Würmer wallten aus dem Körper des Gottlosen auf.“ Das griechische Verb bezeichnet eigentlich ein Aufkochen oder Aufwallen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Sein Fleisch fiel ab“, während er noch lebte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δυσσεβοῦς
  choice: des Gottlosen
  rationale: δυσσεβής bezeichnet hier nicht nur allgemeine Bosheit, sondern Gottlosigkeit beziehungsweise Frevel gegenüber Gott. „der Gottlose“ bewahrt diese religiös-moralische Dimension knapp und verständlich.
- source_word: σκώληκας ἀναζεῖν
  choice: Würmer hervorwimmelten
  rationale: ἀναζέω bedeutet wörtlich „aufkochen, aufwallen“. Im Zusammenhang mit Würmern, die aus dem Körper hervorkommen, gibt „hervorwimmeln“ das drastische Bild natürlich wieder; die wörtlichere Bildsprache steht in der Fußnote.
- source_word: ζῶντος
  choice: noch bei lebendigem Leib
  rationale: Die Konstruktion hebt hervor, dass der körperliche Verfall bereits vor seinem Tod eintrat. Die deutsche Wendung gibt diesen zeitlichen Nachdruck deutlich wieder.
- source_word: ἐν ὀδύναις καὶ ἀλγηδόσιν
  choice: unter Schmerzen und Qualen
  rationale: Beide Substantive bezeichnen heftiges körperliches Leiden. Die Paarung „Schmerzen und Qualen“ wahrt die Intensität und klingt im Deutschen natürlich.
- source_word: τὰς σάρκας αὐτοῦ διαπίπτειν
  choice: ihm das Fleisch abfiel
  rationale: σάρκες ist körperlich und konkret; διαπίπτω bezeichnet hier das Auseinander- beziehungsweise Abfallen. „Das Fleisch fiel ihm ab“ bleibt anschaulich, ohne zusätzlich „verfaulen“ in das Verb einzutragen.
- source_word: ὑπὸ δὲ τῆς ὀσμῆς αὐτοῦ
  choice: wegen seines Gestanks
  rationale: ὀσμή kann neutral „Geruch“ bedeuten, ist durch den Zusammenhang der Fäulnis hier jedoch eindeutig negativ bestimmt. „Gestank“ gibt diesen Kontext treffend wieder.
- source_word: πᾶν τὸ στρατόπεδον
  choice: das ganze Heerlager
  rationale: στρατόπεδον meint das militärische Lager. „Heerlager“ ist präzise, verständlich und dem würdigen Erzählregister angemessen.
- source_word: βαρύνεσθαι τὴν σαπρίαν
  choice: wurde von der Fäulnis bedrückt
  rationale: Die schwierige Konstruktion verbindet βαρύνω, „beschweren/bedrücken“, mit σαπρία, „Fäulnis/Verwesung“. Die Übersetzung bewahrt sowohl die Belastungsmetapher als auch den konkreten Verfall.
theological_decisions:
- issue: Religiös-moralische Kennzeichnung des Antiochus durch δυσσεβοῦς
  choice: des Gottlosen
  alternative: des Frevlers; des Ruchlosen
  rationale: „Gottloser“ wahrt den Gottesbezug des griechischen Ausdrucks, ohne den Vers durch eine weitergehende dogmatische Deutung festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst drastischer Körperlichkeit entsprechend dem griechischen Text. Der lange Satzbau und die Ursachenfolge bleiben erkennbar, werden aber durch ein Semikolon lesbar gegliedert.
