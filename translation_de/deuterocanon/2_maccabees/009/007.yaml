base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/009/007.yaml
  text: But he in no way ceased from his arrogance[a]; rather, he was filled even more with pride, breathing fire in his rage against the Jews and ordering the journey to be hastened. Then it happened that he fell from the chariot as it was rushing along, and in the hard fall[b] all the limbs of his body were wrenched out of joint.
translation:
  language: de
  text: Doch er ließ keineswegs von seinem Hochmut ab; vielmehr war er noch mehr von Überheblichkeit erfüllt. In seinem Zorn gegen die Juden schnaubte er Feuer und befahl, die Reise zu beschleunigen.[a] Da geschah es, dass er von dem mit Getöse dahinjagenden Wagen stürzte; bei dem schweren Sturz wurden ihm alle Glieder des Körpers ausgerenkt.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den Marsch zu beschleunigen“. Das griechische Wort πορία kann je nach Zusammenhang Reise, Fortbewegung oder Marsch bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Das seltene griechische Verb bezeichnet hier wahrscheinlich, dass seine Glieder durch den Sturz gewaltsam aus den Gelenken gelöst wurden.
    reason: lexical_clarification
lexical_decisions:
- source_word: οὐδαμῶς ... ἔληγεν
  choice: ließ keineswegs ... ab
  rationale: Die Formulierung gibt sowohl die verstärkte Verneinung οὐδαμῶς als auch das Aufhören beziehungsweise Ablassen in natürlichem Deutsch wieder.
- source_word: ἀγερωχίας
  choice: Hochmut
  rationale: Das Wort bezeichnet anmaßende, überhebliche Selbstherrlichkeit; „Hochmut“ bewahrt den moralischen Ton.
- source_word: ὑπερηφανίας ἐπεπλήρωτο
  choice: war noch mehr von Überheblichkeit erfüllt
  rationale: Die Wendung bewahrt das Bild des Erfülltseins und gibt die steigernde Kraft von ἔτι δὲ καί wieder, ohne ἀγερωχία und ὑπερηφανία gleichzusetzen.
- source_word: πῦρ πνέων τοῖς θυμοῖς
  choice: In seinem Zorn ... schnaubte er Feuer
  rationale: Die anschauliche Feuermetapher bleibt erhalten; „schnaubte“ ist im Deutschen für zorniges Hervorstoßen natürlicher als ein streng wörtliches „atmete“.
- source_word: ἐπὶ τοὺς Ἰουδαίους
  choice: gegen die Juden
  rationale: Im Zusammenhang mit feindseligem Zorn bezeichnet ἐπί die gegen sie gerichtete Haltung.
- source_word: κελεύων ἐποξύνειν τὴν πορίαν
  choice: befahl, die Reise zu beschleunigen
  rationale: πορία kann Reise, Fortbewegung oder Marsch bezeichnen; „Reise“ ist im unmittelbaren Kontext neutral und natürlich.
- source_word: ἅρματος φερομένου ῥοίζῳ
  choice: dem mit Getöse dahinjagenden Wagen
  rationale: Die Wiedergabe erfasst sowohl die schnelle Bewegung als auch den hörbaren Beiklang von ῥοῖζος.
- source_word: δυσχερεῖ πτώματι περιπεσόντα
  choice: bei dem schweren Sturz
  rationale: Die knappe deutsche Fügung gibt den schweren beziehungsweise schlimmen Sturz idiomatisch wieder.
- source_word: πάντα τὰ μέλη τοῦ σώματος ἀποσφύζειν
  choice: alle Glieder des Körpers ausgerenkt wurden
  rationale: Das seltene Verb wird kontextgemäß als gewaltsames Lösen der Glieder aus ihren Gelenken verstanden; „ausgerenkt“ bleibt verständlich, ohne zusätzliche Verletzungen einzutragen.
theological_decisions:
- issue: Moralische Charakterisierung des Antiochus durch zwei verwandte Begriffe
  choice: ἀγερωχία mit „Hochmut“ und ὑπερηφανία mit „Überheblichkeit“ wiedergeben
  alternative: Beide Wörter einheitlich mit „Hochmut“ oder „Überheblichkeit“ übersetzen
  rationale: Der griechische Text verwendet zwei verwandte, aber verschiedene Substantive und steigert dadurch die Darstellung. Zwei deutsche Begriffe erhalten diese rhetorische Spannung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die lebhafte Feuermetapher und das Getöse des rasenden Wagens bleiben erhalten; die beiden Ausdrücke für stolze Selbstüberhebung werden nicht eingeebnet.
