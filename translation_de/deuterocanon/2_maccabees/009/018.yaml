base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/009/018.yaml
  text: 'But when his pains had somewhat let up[a], for the just judgment of God had come upon him, and when he recognized his own condition, he wrote to the Jews the letter written below, having the character of a petition[c][b], and reading as follows:'
translation:
  language: de
  text: 'Als seine Schmerzen jedoch etwas nachließen[a] – denn Gottes gerechtes Gericht war über ihn gekommen –, schrieb er, nachdem er seine eigene Lage erkannt hatte[b], den Juden den folgenden Brief. Er hatte die Form einer Bittschrift[c] und lautete folgendermaßen:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das seltene griechische Adverb ἰουδαϊσμῶς ist an dieser Stelle schwer zu deuten. Im Zusammenhang wird es als Hinweis darauf verstanden, dass die Schmerzen nur in begrenztem Maß nachließen; möglich ist auch: „ein wenig“ oder „einigermaßen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „nachdem er das ihn Betreffende erkannt hatte“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „den Charakter eines Bittgesuchs“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰουδαϊσμῶς
  choice: etwas
  rationale: Das Adverb ist in dieser Verbindung äußerst schwierig und bedeutet seiner gewöhnlichen Wortbildung nach eigentlich „auf jüdische Weise“, was hier keinen klaren Sinn ergibt. Die zurückhaltende Wiedergabe „etwas“ folgt dem aus dem Zusammenhang erschlossenen Gedanken eines begrenzten Nachlassens, ohne ein vollständiges Ende der Schmerzen zu behaupten; die Unsicherheit wird in einer Fußnote offengelegt.
- source_word: ληγόντων τῶν πόνων
  choice: seine Schmerzen … nachließen
  rationale: λήγω bezeichnet hier ein Nachlassen oder Abklingen; πόνοι meint im unmittelbaren Zusammenhang die körperlichen Qualen des Antiochus. „Schmerzen nachließen“ ist natürlich und wahrt den durativen Charakter der Genitivus-abstractus-Konstruktion.
- source_word: δικαία ἡ τοῦ θεοῦ κρίσις
  choice: Gottes gerechtes Gericht
  rationale: κρίσις bezeichnet ein richtendes Urteil beziehungsweise Gericht, δικαία dessen Gerechtigkeit. Die Formulierung bewahrt die ausdrückliche theologische Deutung seiner Leiden.
- source_word: τὰ κατʼ αὐτὸν ἐπιγνούς
  choice: er seine eigene Lage erkannte
  rationale: Die verdichtete Wendung bedeutet wörtlich etwa „als er das ihn Betreffende erkannt hatte“. Im Kontext ist seine Einsicht in den eigenen Zustand gemeint.
- source_word: τὴν ὑπογεγραμμένην ἐπιστολήν
  choice: den nachstehend wiedergegebenen Brief
  rationale: ὑπογεγραμμένην weist auf den unmittelbar folgenden Wortlaut voraus. „Nachstehend wiedergegeben“ klingt im Deutschen idiomatisch und eindeutig.
- source_word: ἱκετηρίας τάξιν
  choice: die Form einer Bittschrift
  rationale: ἱκετηρία bezeichnet eine Bitte oder ein Flehen, τάξις hier Form beziehungsweise Charakter. „Bittschrift“ gibt den als Gesuch gestalteten Brief knapp und würdig wieder.
- source_word: περιέχουσαν δὲ οὕτως
  choice: und lautete folgendermaßen
  rationale: Die Wendung ist eine Einleitungsformel für den nun folgenden Brieftext. Die deutsche Formulierung erfüllt dieselbe Funktion natürlich.
theological_decisions:
- issue: Deutung der Leiden des Antiochus als göttliches Gericht
  choice: „denn Gottes gerechtes Gericht war über ihn gekommen“
  alternative: Eine neutralere Formulierung, die seine Leiden lediglich als Umstand beschreibt
  rationale: Der griechische Text führt ausdrücklich Gottes gerechtes Gericht als über Antiochus gekommen an. Diese theologische Aussage wird weder abgeschwächt noch weiter ausgedeutet.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bewahrt den erzählerischen Zusammenhang und hebt den begründenden Einschub über Gottes Gericht durch Gedankenstriche ab. Die unklare griechische Formulierung wird lesbar wiedergegeben, ihre echte lexikalische Schwierigkeit jedoch ausdrücklich in der Fußnote bewahrt.
