base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/009/016.yaml
  text: And the holy temple[a], which he had formerly plundered, he would adorn with the finest votive offerings, and he would restore all the sacred vessels many times over, and from his own revenues he would provide the expenses required for the sacrifices[b];
translation:
  language: de
  text: Und den heiligen Tempel, den er zuvor geplündert hatte, werde er mit den prächtigsten Weihegaben schmücken, alle heiligen Geräte um ein Vielfaches ersetzen[a] und aus seinen eigenen Einkünften die für die Opfer anfallenden Kosten bestreiten[b];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „alle heiligen Geräte um ein Vielfaches zurückgeben“. Gemeint ist eine vervielfachte Ersatzleistung, nicht nur einfacher Ersatz.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „die für die Opfer fälligen Aufwendungen aus seinen eigenen Einkünften bereitstellen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσκύλευεν
  choice: den er zuvor geplündert hatte
  rationale: Der Imperfekt beschreibt das frühere Vorgehen gegen den Tempel; im Deutschen gibt das Plusquamperfekt im Rückblick den zeitlichen Gegensatz zu den angekündigten Leistungen natürlich wieder.
- source_word: ἅγιον ναὸν
  choice: den heiligen Tempel
  rationale: Die Wendung bewahrt sowohl die konkrete Beziehung zum Jerusalemer Tempel als auch dessen kultische Heiligkeit.
- source_word: καλλίστοις ἀναθήμασιν
  choice: mit den prächtigsten Weihegaben
  rationale: Der Superlativ καλλίστοις wird durch „prächtigsten“ ausgedrückt; „Weihegaben“ bezeichnet eigens einem Heiligtum gewidmete Gaben.
- source_word: κοσμήσειν
  choice: schmücken
  rationale: Das Verb bezeichnet hier die Ausstattung und Verschönerung des Tempels durch Weihegaben.
- source_word: τὰ ἱερὰ σκεύη
  choice: alle heiligen Geräte
  rationale: „Heilige Geräte“ ist eine klare, kultisch spezifische Bezeichnung für die Tempelgeräte.
- source_word: πολυπλάσια πάντα ἀποδώσειν
  choice: alle ... um ein Vielfaches ersetzen
  rationale: πολυπλάσια fordert mehr als bloßen Ersatz und bezeichnet eine vervielfachte Wiedergutmachung; „ersetzen“ passt sachlich zu den zuvor geraubten Geräten.
- source_word: τὰς ἐπιβαλλούσας πρὸς τὰς θυσίας συντάξεις
  choice: die für die Opfer anfallenden Kosten
  rationale: Die Formulierung bezeichnet die finanziellen Aufwendungen, die für die Opfer erforderlich beziehungsweise fällig werden.
- source_word: ἐκ τῶν ἰδίων προσόδων
  choice: aus seinen eigenen Einkünften
  rationale: πρόσοδοι bezeichnet Einkünfte oder Einnahmen; „eigenen“ bewahrt die Betonung persönlicher beziehungsweise königlicher Mittel.
- source_word: χορηγήσειν
  choice: bestreiten
  rationale: Im Zusammenhang mit Kosten bedeutet das Verb, die nötigen Mittel auf eigene Rechnung bereitzustellen.
theological_decisions:
- issue: Kultische Bezeichnungen für Tempelgaben, Geräte und Opfer
  choice: 'Konkrete kultische Sprache: „heiliger Tempel“, „Weihegaben“, „heilige Geräte“, „Opfer“'
  alternative: Verallgemeinernde Begriffe wie „Heiligtum“, „Geschenke“ oder „religiöse Gegenstände“
  rationale: Der Vers betrifft ausdrücklich den Jerusalemer Tempel und seinen Opferdienst. Die konkrete Terminologie wahrt den historischen und religiösen Zusammenhang, ohne spätere konfessionelle Deutungen einzutragen.
- issue: Stärke der zugesagten Wiedergutmachung
  choice: „um ein Vielfaches ersetzen“
  alternative: „zurückgeben“ oder „vollständig ersetzen“
  rationale: Die Übersetzung hält die durch πολυπλάσια ausgesagte übermäßige, vervielfachte Ersatzleistung fest, ohne ihren Umfang genauer zu bestimmen, als es der griechische Text erlaubt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer kultischer Terminologie. Die indirekte Zukunftsaussage wird entsprechend der griechischen Infinitivkonstruktion mit „werde er“ wiedergegeben; das abschließende Semikolon bewahrt den syntaktischen Anschluss des Quelltexts.
