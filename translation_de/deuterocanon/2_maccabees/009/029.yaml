  yaml_path: translation/deuterocanon/2_maccabees/009/029.yaml
  text: But Philip[a], his companion, was carrying the body; and, because he feared Antiochus’s son[b], he went over to Ptolemy Philometor in Egypt.
translation:
  language: de
  text: Philippus aber, sein Gefährte[a], führte den Leichnam mit sich. Weil er den Sohn des Antiochus fürchtete, begab er sich[b] zu Ptolemäus Philometor nach Ägypten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Gefährte“ kann hier auch einen mit ihm Aufgewachsenen bezeichnen, also einen engen Jugend- oder Hofgefährten.
    reason: lexical_alternative
  - marker: b
    text: Das griechische Verb διεκομίσθη ist der Form nach passiv und kann wörtlicher auch mit „wurde gebracht“ oder „wurde überführt“ wiedergegeben werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεκομίζετο
  choice: überführte
  rationale: Das Imperfekt bezeichnet die im Verlauf befindliche Überführung des Leichnams. „Überführte“ ist im Deutschen für den Transport eines Verstorbenen natürlich und wahrt den gehobenen Erzählton.
- source_word: τὸ σῶμα
  choice: den Leichnam
  rationale: Wörtlich steht „den Körper/Leib“; da eindeutig der Körper des verstorbenen Königs gemeint ist, gibt „Leichnam“ den Sinn im heutigen Deutsch klar und würdig wieder.
- source_word: σύντροφος
  choice: Gefährte
  rationale: Das Wort kann allgemein einen engen Gefährten, aber auch einen gemeinsam Aufgezogenen beziehungsweise Jugendgefährten am Hof bezeichnen. „Gefährte“ legt den genaueren Status nicht fest.
- source_word: εὐλαβηθεὶς
  choice: weil er … fürchtete
  rationale: Das Partizip nennt Furcht beziehungsweise vorsichtige Besorgnis als Beweggrund. Der kausale Nebensatz ist im Deutschen klar und idiomatisch.
- source_word: τὸν υἱὸν Ἀντιόχου
  choice: den Sohn des Antiochus
  rationale: Dies entspricht der griechischen Verwandtschaftsbezeichnung, ohne „Erbe“ oder einen Namen ergänzend hineinzuinterpretieren.
- source_word: πρὸς Πτολεμαῖον τὸν Φιλομήτορα
  choice: zu Ptolemäus Philometor
  rationale: πρός bezeichnet hier das Ziel der Bewegung beziehungsweise den Herrschaftsbereich, in den Philippus sich begab.
- source_word: εἰς Αἴγυπτον
  choice: nach Ägypten
  rationale: εἰς bezeichnet die Bewegung hinein in das Land; „nach Ägypten“ ist die natürliche deutsche Richtungsangabe.
- source_word: διεκομίσθη
  choice: begab er sich
  rationale: Die formal passive Verbform bezeichnet im Zusammenhang den Ortswechsel des Philippus nach Ägypten. Die gewählte Form ist natürlich, während die formale Passivität in einer Fußnote transparent gemacht wird.
