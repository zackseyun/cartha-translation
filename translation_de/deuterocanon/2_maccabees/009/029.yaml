translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer historischer Erzählweise. Der erste Satz bewahrt durch „aber“ den griechischen Anschluss; die mögliche besondere Bedeutung von σύντροφος und die formale Passivität von διεκομίσθη werden nicht im Haupttext festgelegt, sondern in Fußnoten offengelegt.
