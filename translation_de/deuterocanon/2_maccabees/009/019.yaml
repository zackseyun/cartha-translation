translation:
  language: de
  text: 'Antiochus, König und Heerführer,[a] an die guten jüdischen Bürger: viele Grüße, Gesundheit und Wohlergehen.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Im Griechischen stehen Name und Titel des Absenders erst nach der Grußformel: „An die guten jüdischen Bürger … König Antiochus und Heerführer.“ Zur besseren Erkennbarkeit der Briefform wurden sie hier vorangestellt.'
    reason: cultural_note
  - marker: b
    text: 'Oder: „gutes Ergehen“. Das griechische εὖ πράττειν bedeutet „es gut haben“ oder „sich wohl befinden“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῖς χρηστοῖς
  choice: an die guten
  rationale: χρηστός bezeichnet Güte, Freundlichkeit oder Achtbarkeit. „Gut“ bewahrt hier den anerkennenden Ton der förmlichen Anrede, ohne ihn unnötig zu präzisieren.
- source_word: Ἰουδαίοις
  choice: jüdischen
  rationale: Ἰουδαῖοι bezeichnet in diesem Zusammenhang die jüdische Gemeinschaft und nicht lediglich Menschen aus der Landschaft Judäa.
- source_word: τοῖς πολίταις
  choice: Bürger
  rationale: πολίτης bedeutet „Bürger“. Die schlichte Wiedergabe erhält den politischen Klang der förmlichen Empfängerbezeichnung.
- source_word: πολλὰ χαίρειν
  choice: herzliche Grüße
  rationale: Die feste Briefformel χαίρειν wird idiomatisch mit „Grüße“ wiedergegeben; πολλά verstärkt sie. „Herzliche“ vermittelt diese Verstärkung natürlicher als das wörtliche „viele“.
- source_word: ὑγιαίνειν
  choice: Gesundheit
  rationale: Der Infinitiv drückt innerhalb der Grußformel den Wunsch aus, gesund zu sein. Die substantivische Form passt im Deutschen natürlich zur Aufzählung.
- source_word: εὖ πράττειν
  choice: Wohlergehen
  rationale: Die Wendung bedeutet „sich wohl befinden“ oder „es gut haben“. „Wohlergehen“ ist in einer förmlichen Grußformel natürlich und lässt sowohl persönliches Wohl als auch günstige Lebensumstände anklingen.
- source_word: βασιλεὺς Ἀντίοχος καὶ στρατηγὸς
  choice: Antiochus, König und Heerführer
  rationale: Die Wiedergabe bewahrt beide Amtsbezeichnungen und macht die appositionale Konstruktion im Deutschen verständlich, ohne στρατηγός enger als nötig militärisch zu bestimmen.
