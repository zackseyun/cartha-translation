base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/009/017.yaml
  text: And besides these things[a], he would also become a Jew and would visit every inhabited place[b], proclaiming the power of God.
translation:
  language: de
  text: Darüber hinaus werde er auch Jude werden[a] und jeden bewohnten Ort aufsuchen und dabei die Macht Gottes[b] verkünden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Jude sein“. Im Zusammenhang ist wohl gemeint, dass er jüdische Identität oder Zugehörigkeit annehmen werde, nicht dass sich seine ethnische Herkunft ändere.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Stärke Gottes“ beziehungsweise „Herrschaft Gottes“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸς δὲ τούτοις
  choice: Darüber hinaus
  rationale: Gibt die hinzufügende Funktion der Wendung knapp und idiomatisch wieder.
- source_word: Ἰουδαῖος ἔσεσθαι
  choice: Jude werden
  rationale: Der Zusammenhang beschreibt ein Versprechen, jüdische Identität beziehungsweise Zugehörigkeit anzunehmen. „Werden“ bringt dies im Deutschen natürlicher zum Ausdruck als das formal wörtlichere „sein“.
- source_word: πάντα τόπον οἰκητὴν
  choice: jeden bewohnten Ort
  rationale: Bewahrt den distributiven Sinn von πάντα und gibt οἰκητήν entsprechend dem wahrscheinlichen Zusammenhang als Bezeichnung eines bewohnten Ortes wieder.
- source_word: ἐπελεύσεσθαι
  choice: aufsuchen
  rationale: Passt zur angekündigten Reise von Ort zu Ort, ohne genauer festzulegen, wie lange er jeweils dort bleiben würde.
- source_word: καταγγέλλοντα
  choice: und dabei … verkünden
  rationale: Drückt die begleitende öffentliche Bekanntmachung aus, ohne das Partizip eindeutig als Zweckangabe festzulegen.
- source_word: τὸ τοῦ θεοῦ κράτος
  choice: die Macht Gottes
  rationale: κράτος bezeichnet wirksame Stärke oder Herrschaftsmacht. „Macht“ ist hier klar und natürlich, während verwandte Bedeutungsnuancen in der Fußnote erhalten bleiben.
theological_decisions:
- issue: Bedeutung des Versprechens, Ἰουδαῖος zu sein
  choice: Er werde Jude werden.
  alternative: Er werde Jude sein beziehungsweise sich den Juden anschließen oder jüdisch leben.
  rationale: Die Formulierung ist stärker als ein bloßes Wohlwollen gegenüber den Juden und bezeichnet eine angenommene Identität oder Zugehörigkeit. Sie wird jedoch nicht mit späteren technischen Vorstellungen einer formalen Konversion ausgeschmückt.
- issue: Bedeutungsumfang von κράτος
  choice: Macht Gottes
  alternative: Stärke Gottes oder Herrschaft Gottes
  rationale: Der Zusammenhang betont Gottes Überlegenheit, lässt aber offen, ob stärker seine Kraft oder seine Herrschaft gemeint ist; die Fußnote bewahrt diese Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Konjunktiv I („werde“) führt die im griechischen Infinitiv ausgedrückte berichtete Ankündigung fort. Die koordinierende Formulierung „und dabei“ vermeidet eine unnötige Festlegung des Partizips als reine Zweckangabe.
