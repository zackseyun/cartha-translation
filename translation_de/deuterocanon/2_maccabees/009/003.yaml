  text: But while he was at Ecbatana[b][a], news came to him of what had happened to Nicanor and those with Timothy.
translation:
  language: de
  text: Als er sich bei Ekbatana aufhielt[a], erreichte ihn die Nachricht von dem, was mit Nikanor und den Leuten um Timotheus geschehen war.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in Ekbatana“. Die griechische Wendung kann den Ort selbst oder dessen Umgebung bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich etwa: „Die Ereignisse hinsichtlich Nikanors und der Leute um Timotheus, die geschehen waren, fielen über ihn.“ Das Verb ist bildhaft; im Zusammenhang bedeutet es, dass ihn die Nachricht davon erreichte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὄντι δὲ αὐτῷ
  choice: Als er sich … aufhielt
  rationale: Der Genitivus absolutus bezeichnet hier einen zeitlichen Begleitumstand. Die Wiedergabe ist im Deutschen natürlich und bewahrt diesen zeitlichen Sinn.
- source_word: κατʼ Ἐκβάτανα
  choice: im Gebiet von Ekbatana
  rationale: κατά mit einem Ortsnamen kann einen Aufenthalt am Ort oder in dessen Umgebung bezeichnen. Diese Fassung bewahrt die räumliche Unschärfe des Griechischen.
- source_word: προσεπέσε
  choice: erreichte ihn die Nachricht
  rationale: Das Verb bedeutet wörtlich etwa „stieß auf ihn“ oder „kam über ihn“. Da die folgenden Ereignisse ihm offenbar bekannt werden, gibt „erreichte ihn die Nachricht“ den idiomatischen Sinn verständlich wieder.
- source_word: τὰ … γεγονότα
  choice: was … geschehen war
  rationale: Das substantivierte Partizip im Neutrum Plural bezeichnet die bereits eingetretenen Ereignisse; das deutsche Plusquamperfekt bildet deren Vorzeitigkeit ab.
- source_word: τὰ κατὰ Νικάνορα
  choice: was mit Nikanor … geschehen war
  rationale: τὰ κατά mit Akkusativ bezeichnet die Angelegenheiten oder Ereignisse, die jemanden betreffen. „Mit Nikanor“ bleibt näher an dieser offenen Beziehung als eine stärker festlegende Formulierung.
- source_word: τοὺς περὶ Τιμόθεον
  choice: den Leuten um Timotheus
  rationale: οἱ περί mit einem Personennamen bezeichnet den Kreis oder die Gefolgschaft um diese Person. Die Formulierung vermeidet es, eine im Griechischen nicht ausdrücklich genannte militärische Gliederung einzutragen.
