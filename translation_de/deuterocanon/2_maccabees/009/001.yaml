  text: About that time Antiochus happened to be returning in disgrace from the regions around Persia[a].
translation:
  language: de
  text: Um jene Zeit kehrte Antiochus gerade unrühmlich[a] aus den Gebieten um Persien zurück.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „in ungeordneter Weise“ beziehungsweise „auf ungebührliche Weise“; das griechische Adverb kann sowohl Unordnung als auch Schmach oder unangemessenes Verhalten bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: Περὶ δὲ τὸν καιρὸν ἐκεῖνον
  choice: Um jene Zeit
  rationale: Περὶ mit dem Akkusativ bezeichnet hier einen ungefähren Zeitraum. „Um jene Zeit“ gibt diese zeitliche Unschärfe natürlich wieder; δέ fungiert als leichter Erzählanschluss und muss im Deutschen nicht eigens mit „aber“ ausgedrückt werden.
- source_word: ἐτύγχανεν
  choice: gerade
  rationale: Das Verb kennzeichnet die Lage als einen zu jener Zeit bestehenden Begleitumstand. Im Deutschen vermittelt „gerade“ diese beiläufige zeitliche Überschneidung natürlicher als das schwerfällige „es traf sich, dass“.
- source_word: ἀναλελυκὼς
  choice: kehrte … zurück
  rationale: Das Perfektpartizip von ἀναλύω bezeichnet im Zusammenhang Antiochus’ Rückkehr beziehungsweise Abzug aus der persischen Region. Die finite deutsche Wendung ist idiomatisch und wahrt den erzählerischen Sinn.
- source_word: ἀκόσμως
  choice: unrühmlich
  rationale: Das Adverb kann eine ungeordnete, ungebührliche oder schmachvolle Art der Rückkehr bezeichnen. „Unrühmlich“ gibt im Haupttext die wahrscheinliche ehrmindernde Nuance knapp wieder; die sachliche Mehrdeutigkeit wird in der Fußnote offengehalten.
- source_word: ἐκ τῶν περὶ τὴν Περσίδα τόπων
  choice: aus den Gebieten um Persien
  rationale: Die griechische Wendung ist geografisch weit und bezeichnet wörtlich die Orte beziehungsweise Gebiete um Persien. Die Übersetzung vermeidet eine unbegründete Gleichsetzung mit einem exakt abgegrenzten persischen Staatsgebiet.
- source_word: Ἀντίοχος
  choice: Antiochus
  rationale: Der Personenname wird in seiner im Deutschen üblichen hellenistischen Form wiedergegeben.
