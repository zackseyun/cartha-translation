translation:
  language: de
  text: Ohne wegen meiner Lage zu verzweifeln, hege ich große Hoffnung, der Krankheit zu entkommen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐκ ἀπογινώσκων
  choice: Ich gebe … nicht auf
  rationale: Das Partizip bezeichnet hier, dass der Sprecher seine Lage nicht als hoffnungslos abschreibt. Die deutsche Wendung ist natürlich und bewahrt den Bezug auf das folgende Objekt.
- source_word: τὰ κατʼ ἐμαυτόν
  choice: meine Lage
  rationale: Die idiomatische Wendung meint die den Sprecher betreffenden Umstände; im Zusammenhang ist besonders sein Gesundheitszustand gemeint, ohne dass der griechische Ausdruck darauf verengt wird.
- source_word: ἔχων πολλὴν ἐλπίδα
  choice: habe große Hoffnung
  rationale: Die direkte Wiedergabe erhält die deutliche Betonung durch πολλήν und klingt in modernem Deutsch würdevoll und verständlich.
- source_word: ἐκφεύξεσθαι
  choice: zu entkommen
  rationale: Der zukünftige Infinitiv bezeichnet die erwartete Befreiung aus der Krankheit. „Entkommen“ bewahrt das griechische Bild stärker als die kontextuell mögliche Wiedergabe „genesen“.
- source_word: τὴν ἀσθένειαν
  choice: der Krankheit
  rationale: Im Kontext bezeichnet ἀσθένεια eine körperliche Erkrankung. Der Dativ folgt der üblichen deutschen Verbindung „einer Sache entkommen“.
