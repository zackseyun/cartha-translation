  terminology: „Begräbnis“ und „kleine Kinder“ sind angemessen. „Vögeln und wilden Tieren zum Fraß“ gibt οἰωνοβρώτους … θηρίοις idiomatisch wieder, ohne „Raubvögel“ unnötig zu spezifizieren. „Den Athenern gleichstellen“ bewahrt die Offenheit von ἴσους Ἀθηναίοις ποιήσειν.
