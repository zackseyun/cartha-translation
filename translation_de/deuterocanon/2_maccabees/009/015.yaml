- from: Die Juden aber, die er, wie er beschlossen hatte, nicht einmal eines Begräbnisses für würdig halten, sondern samt ihren kleinen Kindern hinauswerfen wollte, damit sie von Raubvögeln und wilden Tieren gefressen würden – sie alle wollte er den Athenern gleichstellen.[a]
  to: Die Juden aber, die er zuvor beschlossen hatte, nicht einmal eines Begräbnisses zu würdigen, sondern mitsamt ihren kleinen Kindern den Vögeln und wilden Tieren zum Fraß auszusetzen, wollte er alle den Athenern gleichstellen.[a]
