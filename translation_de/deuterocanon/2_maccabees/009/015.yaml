base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/009/015.yaml
  text: But the Jews[a], whom he had determined not even to count worthy of burial, but to cast out with their infants for the birds to devour and for the wild beasts—he would make them all equal to the Athenians.
translation:
  language: de
  text: Die Juden aber, die er zuvor beschlossen hatte, nicht einmal eines Begräbnisses zu würdigen, sondern mitsamt ihren kleinen Kindern den Vögeln und wilden Tieren zum Fraß auszusetzen, wollte er alle den Athenern gleichstellen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder genauer: „ihnen einen Status gleich dem der Athener verleihen“. Wahrscheinlich sind bürgerliche Vorrechte oder eine rechtliche Stellung gemeint, nicht bloß gesellschaftliches Ansehen.'
    reason: Die Wendung lässt die genaue Art der Gleichstellung offen, hat im historischen Zusammenhang aber wahrscheinlich einen politisch-rechtlichen Sinn.
lexical_decisions:
- source_word: διέγνωκε
  choice: wie er beschlossen hatte
  rationale: Das Verb bezeichnet hier einen bereits gefassten, festen Entschluss. Die eingeschobene Formulierung wahrt die rückblickende Zeitstufe und den Bezug auf Antiochus’ früheren Vorsatz.
- source_word: μηδὲ ταφῆς ἀξιῶσαι
  choice: nicht einmal eines Begräbnisses für würdig halten
  rationale: Die Wiedergabe erhält den wertenden Gehalt von ἀξιόω und macht deutlich, dass ihnen selbst die Bestattung verweigert werden sollte.
- source_word: οἰωνοβρώτους
  choice: damit sie von Raubvögeln ... gefressen würden
  rationale: Das zusammengesetzte Adjektiv bezeichnet dem Fraß durch Vögel ausgesetzte Menschen. „Raubvögel“ gibt den unheilvollen, aasfressenden Kontext idiomatisch wieder.
- source_word: σὺν τοῖς νηπίοις
  choice: samt ihren kleinen Kindern
  rationale: νήπιοι meint sehr junge Kinder. „Kleine Kinder“ ist im heutigen Deutsch natürlich und vermeidet die mögliche Verengung von „Säuglinge“.
- source_word: ἐκρίψαι
  choice: hinauswerfen wollte
  rationale: Das Verb drückt gewaltsames Wegwerfen beziehungsweise Aussetzen aus; „hinauswerfen“ bewahrt die Härte des Bildes.
- source_word: θηρίοις
  choice: wilden Tieren
  rationale: θηρία sind wilde Tiere. In Verbindung mit dem Aussetzen ist das Gefressenwerden sinngemäß auch auf sie zu beziehen.
- source_word: πάντας αὐτοὺς ἴσους Ἀθηναίοις ποιήσειν
  choice: sie alle wollte er den Athenern gleichstellen
  rationale: Die Formulierung bleibt nahe am Griechischen und lässt offen, worin die Gleichstellung genau bestand; wahrscheinlich geht es um Bürgerrechte oder einen rechtlichen Status.
theological_decisions:
- issue: Politisch-rechtliche Bedeutung der Gleichstellung mit den Athenern
  choice: Die wörtliche, offene Aussage „den Athenern gleichstellen“ bleibt im Haupttext erhalten.
  alternative: „ihnen dieselben Bürgerrechte wie den Athenern verleihen“
  rationale: Der griechische Text nennt weder ausdrücklich Bürgerrecht noch einen bestimmten rechtlichen Mechanismus. Die wahrscheinlich politische Bedeutung wird deshalb nur in der Fußnote erläutert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der lange griechische Satz wird syntaktisch gegliedert, ohne seinen starken Gegensatz zwischen dem früheren Vernichtungsplan und dem späteren Versprechen abzuschwächen.
