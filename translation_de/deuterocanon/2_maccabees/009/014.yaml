  yaml_path: translation/deuterocanon/2_maccabees/009/014.yaml
  text: As for the holy city[a], which he had been hurrying to make level with the ground and to build into a mass grave, he will declare it free.
translation:
  language: de
  text: Was die heilige Stadt betrifft, zu der er eilte, um sie dem Erdboden gleichzumachen und zu einem Massengrab[a] zu machen, so werde er sie für frei erklären.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »zu einer gemeinsamen Grabstätte« beziehungsweise »zu einer Grabstätte für viele«. Das griechische Wort bezeichnet ein Grab für zahlreiche Tote.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὴν μὲν ἁγίαν πόλιν
  choice: Was die heilige Stadt betrifft
  rationale: Die Wendung gibt das vorangestellte Objekt und das gliedernde μέν wieder; „heilige Stadt“ ist die natürliche biblische Bezeichnung für Jerusalem.
- source_word: ἣν σπεύδων παρεγίνετο
  choice: zu der er geeilt war
  rationale: σπεύδων bezeichnet Eile, παρεγίνετο die Bewegung zur Stadt. Die knappe deutsche Form bewahrt beide Aspekte und passt zum rückblickenden Zusammenhang.
- source_word: ἰσόπεδον ποιῆσαι
  choice: sie dem Erdboden gleichzumachen
  rationale: Die geläufige deutsche Wendung vermittelt die vollständige Einebnung der Stadt.
- source_word: πολυάνδριον οἰκοδομῆσαι
  choice: zu einem Massengrab auszubauen
  rationale: πολυάνδριον bezeichnet eine Grabstätte für viele Tote; „Massengrab“ gibt die düstere Aussage klar wieder. „ausbauen“ erhält zugleich den Bauaspekt von οἰκοδομῆσαι.
- source_word: ἐλευθέραν ἀναδείξει
  choice: werde er sie für frei erklären
  rationale: ἀναδείξει bezeichnet hier eine öffentliche Erklärung oder Einsetzung in einen Status. Der deutsche Konjunktiv gibt die im Erzählzusammenhang berichtete Zusage wieder, ohne sie politisch enger als nötig zu bestimmen.
theological_decisions:
- issue: Art der zugesagten Freiheit Jerusalems
  choice: für frei erklären
  alternative: freimachen; für autonom erklären
  rationale: Die Übersetzung bewahrt den öffentlichen Statusakt, ohne eine bestimmte Verfassungsordnung oder einen weitergehenden theologischen Sinn einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die markierte Gliederung mit μέν wird durch „Was … betrifft“ und „so“ sichtbar gemacht; die drastische Bildsprache des Ausgangstextes bleibt erhalten.
