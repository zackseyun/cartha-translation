  source_fidelity: 'Die Grundbedeutung ist getroffen: Jerusalem wird als „heilige Stadt“ bezeichnet, Antiochus beabsichtigte ihre völlige Zerstörung und eine künftige Erklärung ihrer Freiheit. „Zu der er geeilt war“ gibt jedoch das imperfektische παρεγίνετο weniger genau wieder, da es seine Ankunft nahelegt; der griechische Ausdruck schildert sein hastiges Kommen/Unterwegssein. „Ausbauen“ ist für οἰκοδομῆσαι in Verbindung mit πολυάνδριον nicht idiomatisch und kann eine bauliche Erweiterung statt der beabsichtigten Umwandlung der Stadt nahelegen.'
  naturalness: Die Satzgliederung mit „Was … betrifft“ und „so“ ist verständlich und angemessen gehoben. „Zu der er eilte“ ist im Deutschen direkter und genauer als das Plusquamperfekt. „Zu einem Massengrab zu machen“ ist idiomatischer als „zu einem Massengrab auszubauen“.
  terminology: „Heilige Stadt“ und „dem Erdboden gleichmachen“ sind treffend. „Massengrab“ ist als klare Wiedergabe von πολυάνδριον vertretbar, sofern die Fußnote die weniger anachronistisch klingenden Alternativen „gemeinsame Grabstätte“ und „Grabstätte für viele“ nennt. „Für frei erklären“ bewahrt den öffentlichen Statusakt von ἐλευθέραν ἀναδείξει, ohne die Art der Freiheit konfessionell oder staatsrechtlich zu bestimmen.
