  rationale: Die Revision gibt den fortlaufenden Charakter des griechischen Imperfekts bei παρεγίνετο wieder und ersetzt das missverständliche „ausbauen“ durch eine idiomatische Formulierung, die die beabsichtigte Umwandlung der Stadt in eine Grabstätte für viele Tote klar ausdrückt. Aussagegehalt, Register, Gliederung und Fußnotenanker bleiben erhalten.
