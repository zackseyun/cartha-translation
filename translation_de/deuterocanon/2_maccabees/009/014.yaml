    issue: Aspekt von παρεγίνετο
    rationale: „Zu der er geeilt war“ klingt abgeschlossen und legt nahe, dass er die Stadt bereits erreicht hatte. Das Imperfekt παρεγίνετο beschreibt sein hastiges Kommen beziehungsweise Unterwegssein; „zu der er eilte“ wahrt dies besser.
  - severity: medium
    issue: „ausbauen“ für οἰκοδομῆσαι
    rationale: „Ausbauen“ bezeichnet im modernen Deutsch gewöhnlich Erweiterung oder Weiterentwicklung. Im Kontext soll die Stadt zu einer Grabstätte für viele Tote gemacht werden; „zu einem Massengrab zu machen“ ist semantisch klar und natürlich.
