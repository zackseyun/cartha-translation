  yaml_path: translation/deuterocanon/2_maccabees/009/023.yaml
  text: And seeing that my father[a], whenever he campaigned in the upper regions, appointed the one who would succeed him,
translation:
  language: de
  text: Da ich nun bedenke, dass auch mein Vater, sooft er in die oberen Gebiete auf Feldzug zog[a], den bestimmte, der ihm nachfolgen sollte,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das griechische Verb kann wörtlicher auch bedeuten: „sein Lager aufschlug“ bzw. „sich lagerte“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: θεωρῶν
  choice: da ich sehe
  rationale: Das Partizip leitet die Begründung des Sprechers ein. „Da ich sehe“ bewahrt sowohl die Wahrnehmung als auch den kausalen Zusammenhang.
- source_word: ὁ πατήρ
  choice: mein Vater
  rationale: Der bestimmte Artikel mit dem aus dem Zusammenhang zu ergänzenden Besitzverhältnis bezeichnet hier den leiblichen Vater des Sprechers.
- source_word: καθʼ οὓς καιρούς
  choice: sooft
  rationale: Die Wendung hat distributiv-iterativen Sinn und verweist auf die wiederholten Anlässe, bei denen der Vater auszog.
- source_word: εἰς τοὺς ἄνω τόπους
  choice: in die oberen Gebiete
  rationale: Die Richtungsangabe εἰς wird mit „in die“ wiedergegeben; „obere Gebiete“ bewahrt die räumliche Formulierung, ohne die geografische Lage vorschnell als Hochland oder Binnenland festzulegen.
- source_word: ἐστρατοπέδευσεν
  choice: auf Feldzug zog
  rationale: Das Verb bedeutet wörtlich „ein Lager aufschlagen“, kann im militärischen Zusammenhang aber weiter gefasst das Ziehen beziehungsweise Befinden auf einem Feldzug bezeichnen. Die gewählte Formulierung ist im Deutschen natürlich und passt zur königlichen Militärtätigkeit.
- source_word: ἀνέδειξεν
  choice: bestimmte
  rationale: Gemeint ist die förmliche Benennung des künftigen Nachfolgers. „Bestimmte“ gibt dies klar wieder, ohne ein weitergehendes Amtsverständnis einzutragen.
- source_word: τὸν διαδεξάμενον
  choice: denjenigen, der ihm nachfolgen sollte
  rationale: Die substantivierte Partizipialform bezeichnet die Person, die anschließend die Herrschaft übernehmen würde. Die verbale Wiedergabe bewahrt den Zukunftsbezug im Zusammenhang.
