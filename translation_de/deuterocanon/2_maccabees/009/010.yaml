base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/009/010.yaml
  text: And no one was able to carry the man who a little earlier had seemed to touch the stars of heaven[a], because of the unbearable burden of the stench.
translation:
  language: de
  text: Und niemand konnte den Mann, der kurz zuvor die Sterne des Himmels zu berühren schien[a], wegen der unerträglichen Last des Gestanks tragen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »meinte, die Sterne des Himmels berühren zu können«. Das Griechische kann sowohl den Anschein besonderer Erhöhung als auch vermessene Selbsteinschätzung ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸν ... δοκοῦντα
  choice: den Mann, der ... zu berühren schien
  rationale: Das substantivierte Partizip bezeichnet Antiochus. »Den Mann« ist im Deutschen natürlich; »schien« bewahrt die mögliche Bedeutung von äußerem Anschein, ohne die ebenfalls mögliche Selbstüberschätzung auszuschließen.
- source_word: μικρῷ πρότερον
  choice: kurz zuvor
  rationale: Die Wendung bezeichnet eine erst kurze Zeit zurückliegende Vergangenheit und wird so idiomatisch und prägnant wiedergegeben.
- source_word: τῶν οὐρανίων ἄστρων
  choice: die Sterne des Himmels
  rationale: Die Genitivverbindung bleibt in ihrer erhabenen kosmischen Bildsprache erhalten.
- source_word: ἅπτεσθαι
  choice: zu berühren
  rationale: Die Grundbedeutung des Verbs und das übersteigerte Bild von Antiochus’ früherer Höhe beziehungsweise Anmaßung werden unmittelbar bewahrt.
- source_word: παρακομίζειν
  choice: tragen
  rationale: Das Verb meint hier das Tragen beziehungsweise Befördern einer Person. »Tragen« ist im Kontext klar und modernes Standarddeutsch.
- source_word: διὰ τὸ τῆς ὀσμῆς ἀφόρητον βάρος
  choice: weil der Gestank eine unerträgliche Last war
  rationale: Die Wiedergabe bewahrt βάρος als bildhafte »Last« und vermeidet zugleich die unnatürliche Formulierung »Last des Gestanks«.
theological_decisions:
- issue: Hyperbolische Beschreibung der früheren Überhebung des Antiochus
  choice: die Sterne des Himmels zu berühren schien
  alternative: meinte, die Sterne des Himmels berühren zu können
  rationale: δοκέω mit Infinitiv kann sowohl den Anschein als auch die eigene Einschätzung ausdrücken. Der Haupttext lässt die ironische Fallhöhe hervortreten; die Fußnote hält die mögliche Deutung als vermessene Selbsteinschätzung offen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Satzführung. Das starke Bild von der »unerträglichen Last« des Gestanks und die ironische Gegenüberstellung von früherer Erhöhung und gegenwärtiger Hilflosigkeit bleiben erhalten.
