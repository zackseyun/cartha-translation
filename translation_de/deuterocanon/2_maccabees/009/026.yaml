  yaml_path: translation/deuterocanon/2_maccabees/009/026.yaml
  text: Therefore I urge you and ask you, remembering the benefits shown both publicly and privately, each of you to maintain the goodwill that now exists toward me and my son.
translation:
  language: de
  text: 'Darum ermahne und bitte ich euch: Denkt an die Wohltaten, die euch allen gemeinsam und jedem Einzelnen erwiesen wurden, und bewahrt jeder von euch das bestehende Wohlwollen mir und meinem Sohn gegenüber.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρακαλῶ ... καὶ ἀξιῶ
  choice: ermahne und bitte ich
  rationale: παρακαλέω bezeichnet hier ein eindringliches Zureden; ἀξιόω kann im Briefstil »bitten/ersuchen« bedeuten. Die Paarung bleibt erhalten, ohne unnatürlich amtlich zu klingen.
- source_word: τῶν εὐεργεσιῶν
  choice: an die Wohltaten
  rationale: Das Substantiv bezeichnet erwiesene Wohltaten oder Begünstigungen. Der bestimmte Artikel wird durch den konkreten Rückbezug gewahrt.
- source_word: κοινῇ καὶ κατʼ ἰδίαν
  choice: euch allen gemeinsam und jedem Einzelnen
  rationale: Die adverbiale Gegenüberstellung meint kollektive und individuelle Begünstigung. Die Ergänzung »euch ... erwiesen« macht den deutschen Satz natürlich, ohne den Sinn auszuweiten.
- source_word: συντηρεῖν
  choice: bewahrt
  rationale: Das Verb meint bewahren, aufrechterhalten oder fortbestehen lassen. »Bewahrt« entspricht dem bereits vorhandenen Wohlwollen und der Aufforderung an jeden Einzelnen.
- source_word: τὴν οὖσαν εὔνοιαν
  choice: das bestehende Wohlwollen
  rationale: Das Partizip οὖσαν kennzeichnet das Wohlwollen als bereits vorhanden; »bestehend« wahrt dies, ohne ein zeitliches »jetzt« stärker als der griechische Text hervorzuheben.
- source_word: εἰς ἐμὲ καὶ τὸν υἱόν
  choice: mir und meinem Sohn gegenüber
  rationale: εἰς bezeichnet hier die Ausrichtung des Wohlwollens. Im Deutschen ist »gegenüber« idiomatisch; das Possessivpronomen beim Sohn ergibt sich eindeutig aus dem Kontext.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Briefsprache. Der imperativische Hauptsatz bildet den griechischen Infinitiv nach den Verben des Ermahnens und Bittens idiomatisch ab. Die kollektive und individuelle Ebene der Wohltaten sowie das bereits bestehende Wohlwollen bleiben ausdrücklich erhalten.
