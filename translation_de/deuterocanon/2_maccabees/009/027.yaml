  yaml_path: translation/deuterocanon/2_maccabees/009/027.yaml
  text: For I am convinced that[a], if he is guided by my purpose with fairness and humanity, he will deal with you accordingly.
translation:
  language: de
  text: Denn ich bin überzeugt, dass er, da er meiner Absicht mit Nachsicht und Menschenfreundlichkeit folgt[a], euch entsprechend behandeln wird.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hier mit „da er … folgt“ wiedergegebene griechische Partizip ist knapp und mehrdeutig. Es kann auch „weil er meiner Absicht entsprechend eingestellt ist“ oder „weil er mit meiner Absicht in Einklang gebracht ist“ bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: πέπεισμαι
  choice: ich bin überzeugt
  rationale: Das Perfekt bezeichnet eine gefestigte Überzeugung; die deutsche Wendung ist natürlich und bewahrt die bestimmte Zuversicht des Sprechers.
- source_word: ἐπιεικῶς
  choice: von Nachsicht
  rationale: Das Adverb bezeichnet entgegenkommende Milde, Billigkeit und vernünftige Nachsicht. „Nachsicht“ gibt diese ethische Haltung in verständlichem Deutsch wieder.
- source_word: φιλανθρώπως
  choice: von Menschenfreundlichkeit
  rationale: Das Adverb bezeichnet eine menschenfreundliche, gütige Haltung und bildet mit „Nachsicht“ ein der griechischen Doppelung entsprechendes Begriffspaar.
- source_word: συνσταθέντα
  choice: wenn er sich … leiten lässt
  rationale: Das schwierige Partizip wird kontextuell als Ausrichtung beziehungsweise Übereinstimmung mit der Absicht des Sprechers verstanden. Die Formulierung bleibt lesbar, während die mögliche konditionale Nuance erhalten bleibt.
- source_word: τῇ ἐμῇ προαιρέσει
  choice: meiner Absicht entsprechend
  rationale: προαίρεσις bezeichnet eine überlegte Absicht oder Zielsetzung. Der Dativ drückt hier die Ausrichtung beziehungsweise Übereinstimmung damit aus.
- source_word: συνπεριενεχθήσεσθαι
  choice: euch ebenso behandeln wird
  rationale: Das Verb bezeichnet ein entsprechendes Verhalten gegenüber den Angesprochenen. „Ebenso“ nimmt die zuvor genannte Haltung auf.
