base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/012/008.yaml
  text: May the sinners perish from the presence of the Lord once for all[c][b][a], and may the devout of the Lord inherit the promises.
translation:
  language: de
  text: Mögen die Sünder[c] aus der Gegenwart des Herrn ein für alle Mal[b] zugrunde gehen, und mögen die Frommen[a] des Herrn die Verheißungen erben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Heiligen des Herrn“ oder „die Treuen des Herrn“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder einfach: „einmal“; das griechische Wort kann entweder die Einmaligkeit oder die Endgültigkeit betonen.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder ohne Hervorhebung einer bestimmten Gruppe: „Mögen Sünder … zugrunde gehen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπόλοιντο
  choice: mögen … zugrunde gehen
  rationale: Der Optativ drückt einen Wunsch beziehungsweise ein Gebet aus. „Zugrunde gehen“ gibt ἀπόλλυμι wieder, ohne ausdrücklich einen menschlichen Urheber der Vernichtung einzuführen.
- source_word: οἱ ἁμαρτωλοὶ
  choice: die Sünder
  rationale: Der bestimmte Artikel wird beibehalten; dadurch kann die im Kontext mögliche Bezeichnung einer bestimmten Gruppe erhalten bleiben, statt nur allgemein sündige Menschen zu meinen.
- source_word: ἀπὸ προσώπου Κυρίου
  choice: aus der Gegenwart des Herrn
  rationale: Die Wendung bedeutet wörtlich „vom Angesicht des Herrn“. „Aus der Gegenwart des Herrn“ ist im heutigen Deutsch verständlich und bewahrt den räumlich-relationalen Sinn.
- source_word: ἅπαξ
  choice: ein für alle Mal
  rationale: Im Zusammenhang des Vernichtungswunsches liegt eine endgültige, nicht wiederholte Beseitigung nahe; die mögliche schlichtere Bedeutung „einmal“ wird in einer Fußnote offengehalten.
- source_word: ὅσιοι
  choice: die Frommen
  rationale: ὅσιος bezeichnet Menschen, die sich durch Frömmigkeit und treue Hingabe auszeichnen. „Fromme“ ist hier natürlich und vermeidet die mögliche übertechnische Wirkung von „Heilige“.
- source_word: κληρονομήσαισαν
  choice: mögen … erben
  rationale: Auch dieser Optativ formuliert einen Wunsch. „Erben“ wahrt das Bild des zugesprochenen Erbteils und seine bundestheologische Färbung.
- source_word: ἐπαγγελίας
  choice: die Verheißungen
  rationale: Obwohl das griechische Substantiv ohne Artikel steht, legt die Verbindung mit „erben“ bekannte göttliche Zusagen nahe; im Deutschen ist der bestimmte Artikel idiomatisch.
theological_decisions:
- issue: Referenz von οἱ ἁμαρτωλοί
  choice: „die Sünder“ mit bestimmtem Artikel
  alternative: „Sünder“ als allgemeine moralische Kategorie
  rationale: Der griechische Artikel und der polemische Sprachgebrauch der Psalmen Salomos lassen eine bestimmte Gruppe als Referenten zu. Die Übersetzung legt deren historische Identität jedoch nicht ausdrücklich fest.
- issue: Bedeutungsumfang von ὅσιοι
  choice: „die Frommen“
  alternative: „die Heiligen“ oder „die Treuen“
  rationale: Die gewählte Formulierung hält Frömmigkeit und loyale Hingabe zusammen, ohne eine spätere dogmatische Kategorie einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallelen Optative werden durch die wiederholte Wunschformel „mögen“ sichtbar gemacht. „Gegenwart des Herrn“ ist verständlicher als das wörtliche „Angesicht des Herrn“, während „Verheißungen erben“ die biblische Bildsprache bewahrt.
