base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/012/001.yaml
  text: Lord[a], deliver my soul from a lawless and wicked man, from a lawless and whispering tongue, speaking falsehood and deceit[c][b];
translation:
  language: de
  text: Herr, rette meine Seele[a] vor einem gesetzlosen und bösen Mann, vor einer gesetzlosen und flüsternden[b] Zunge, die Lüge und Trug redet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »mein Leben«; sinngemäß auch: »mich«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »verleumderischen«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Κύριε
  choice: Herr
  rationale: Der Vokativ richtet das Gebet unmittelbar an Gott. »Herr« ist die natürliche und würdevolle deutsche Wiedergabe.
- source_word: ῥῦσαι
  choice: rette
  rationale: Der Aoristimperativ bittet um ein entschiedenes Eingreifen und um Befreiung aus einer Bedrohung. »Rette« gibt dies im Deutschen klar wieder.
- source_word: τὴν ψυχήν μου
  choice: meine Seele
  rationale: ψυχή kann Seele, Leben oder die ganze Person bezeichnen. »Meine Seele« bewahrt das Bild und die persönliche Eindringlichkeit; die weiteren Möglichkeiten werden in einer Fußnote genannt.
- source_word: ἀνδρὸς παρανόμου καὶ πονηροῦ
  choice: einem gesetzlosen und bösen Mann
  rationale: ἀνήρ bezeichnet hier ausdrücklich einen Mann. παράνομος beschreibt ihn als dem Gesetz zuwiderhandelnd, während πονηρός seine Bosheit bezeichnet.
- source_word: γλώσσης παρανόμου καὶ ψιθυροῦ
  choice: einer gesetzlosen und flüsternden Zunge
  rationale: Beide Adjektive beziehen sich grammatisch auf »Zunge«. Die konkrete Metapher wird bewahrt; »flüsternd« lässt zugleich die Vorstellung heimlicher, schädlicher Rede erkennen.
- source_word: λαλούσης ψευδῆ καὶ δόλια
  choice: die Lüge und Trug redet
  rationale: Das feminine Partizip bezieht sich auf »Zunge«. Die feste deutsche Verbindung »Lüge und Trug« gibt sowohl Falschheit als auch Täuschung prägnant und poetisch wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Gebetsdeutsch mit bewahrter poetischer Bildsprache. Die parallelen Wendungen mit »vor« folgen der Struktur des griechischen Textes; »gesetzlos« erhält dessen Bezug auf eine Missachtung des Gesetzes.
