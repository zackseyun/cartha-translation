base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/012/005.yaml
  text: May the tongue of whisperers perish in flaming fire[c][b][a], away from the devout.
translation:
  language: de
  text: In loderndem Feuer möge die Zunge der heimlichen Verleumder[a] zugrunde gehen, fern von den Frommen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „der Flüsterer“; gemeint sind Menschen, die heimlich gegen andere reden.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „den Gottestreuen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γλῶττα
  choice: Zunge
  rationale: Bewahrt das konkrete, eindringliche Bild des griechischen Singulars, der hier kollektiv verstanden werden kann.
- source_word: ψιθύρων
  choice: der heimlichen Verleumder
  rationale: ψίθυρος bezeichnet Menschen, die im Verborgenen gegen andere reden. „Heimliche Verleumder“ gibt sowohl das leise, geheime Reden als auch dessen schädlichen Charakter wieder; die wörtlichere Alternative steht in der Fußnote.
- source_word: ἀπόλοιτο
  choice: möge … zugrunde gehen
  rationale: Der Optativ formuliert einen feierlichen Wunsch beziehungsweise einen Ruf nach Gericht, ohne die Art des Untergangs über das genannte Feuer hinaus näher festzulegen.
- source_word: ἐν πυρὶ φλογός
  choice: in loderndem Feuer
  rationale: Eine natürliche poetische Wiedergabe der wörtlichen Wendung „im Feuer einer Flamme“, die deren verstärkendes Feuerbild erhält.
- source_word: ὁσίων
  choice: den Frommen
  rationale: ὅσιοι bezeichnet hier die frommen beziehungsweise gottestreuen Menschen. „Die Frommen“ ist genauer als „die Heiligen“, das im Griechischen eher ἅγιοι entspräche.
- source_word: ἀπὸ
  choice: fern von
  rationale: Gibt die räumlich beziehungsweise gemeinschaftlich trennende Kraft der Präposition wieder und lässt den knappen Anschluss an den Untergang der Verleumder bestehen.
theological_decisions:
- issue: Bezeichnung der Gruppe mit ὅσιοι
  choice: die Frommen
  alternative: die Heiligen / die Gottestreuen
  rationale: „Die Frommen“ bewahrt den religiös-ethischen Sinn und vermeidet, ὅσιοι mit dem stärker kultisch oder statusbezogen wirkenden „Heilige“ gleichzusetzen.
translation_notes:
  register: Poetisch-feierlicher, aber moderner Standardstil. Die konkrete Metapher „Zunge“ und der Wunschcharakter des Gerichtswortes bleiben erhalten; „loderndes Feuer“ gibt die griechische Verstärkung idiomatisch wieder.
