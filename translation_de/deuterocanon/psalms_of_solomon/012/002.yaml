translation:
  language: de
  text: Die Worte auf der Zunge eines bösen Mannes sind von mannigfaltigen Wendungen geprägt[a]; seine Schönheit[b] ist wie ein Feuer, das in einem Volk aufflammt[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „in Mannigfaltigkeit der Wendung“; das Griechische zeichnet eine Rede, die von wechselnden oder verschlungenen Wendungen geprägt ist.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „sein Liebreiz“.'
    reason: lexical_alternative
  - marker: c
    text: 'Auch möglich: „wie ein Feuer, das in einem Volk zündet“. Das griechische Partizip bezeichnet ein Feuer, das gerade aufflammt oder etwas entzündet.'
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: ἐν ποικιλίᾳ στροφῆς
  choice: voller vielfältiger Wendungen
  rationale: Die Wendung beschreibt eine Rede, die sich auf wechselnde, verschlungene Weise dreht. Die deutsche Fassung bewahrt das Bild des Wendens und gibt zugleich die Mannigfaltigkeit von ποικιλία wieder.
- source_word: οἱ λόγοι τῆς γλώσσης
  choice: Die Worte auf der Zunge
  rationale: Die konkrete Bildsprache der Zunge bleibt erhalten; „auf der Zunge“ klingt im Deutschen natürlicher als die streng formale Genitivfolge „die Worte der Zunge“.
- source_word: ἀνδρὸς πονηροῦ
  choice: eines bösen Mannes
  rationale: ἀνήρ bezeichnet hier ausdrücklich einen Mann, während πονηρός eine moralisch negative Bedeutung trägt.
- source_word: καλλονὴ
  choice: Liebreiz
  rationale: „Liebreiz“ bezeichnet eine anziehende Schönheit und passt zum gefährlich verführerischen Einfluss, den der folgende Feuervergleich nahelegt, ohne die Grundbedeutung „Schönheit“ aufzugeben.
- source_word: πῦρ ἀνάπτον
  choice: ein Feuer, das … aufflammt
  rationale: Das präsentische aktive Partizip schildert das Feuer als gegenwärtig aufflammend beziehungsweise zündend, nicht als bereits passiv entzündet.
- source_word: ἐν λαῷ
  choice: in einem Volk
  rationale: Der artikellose Singular λαῷ wird unbestimmt wiedergegeben und als kollektive Gemeinschaft verstanden.
