base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/012/006.yaml
  text: May the Lord protect a quiet soul that hates the unjust[c][b][a], and may the Lord guide a man who makes peace in the house.
translation:
  language: de
  text: Der Herr bewahre eine stille Seele[a], die Ungerechte hasst, und der Herr leite einen Mann, der im Haus Frieden stiftet.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Für „Seele“ auch: „Leben“ oder „Selbst“.'
    reason: lexical_alternative
  - marker: b
    text: 'Für „im Haus“ auch: „im eigenen Zuhause“ oder „in der Hausgemeinschaft“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: φυλάξαι
  choice: bewahre
  rationale: Der Aorist Optativ drückt hier einen Gebets- oder Segenswunsch aus; „bewahre“ gibt sowohl Schutz als auch Erhaltung würdig und natürlich wieder.
- source_word: Κύριος
  choice: der Herr
  rationale: Κύριος steht hier als Gottesbezeichnung; „der Herr“ ist die übliche und kontextgerechte Wiedergabe.
- source_word: ψυχὴν
  choice: Seele
  rationale: ψυχή kann Seele, Leben oder Selbst bezeichnen. „Seele“ bewahrt hier den Bezug auf den inneren Menschen und lässt die lexikalische Weite bestehen.
- source_word: ἡσύχιον
  choice: stille
  rationale: ἡσύχιος bezeichnet einen ruhigen, friedlichen oder stillen Charakter. „Still“ ist knapp, verständlich und nahe an der griechischen Formulierung.
- source_word: μισοῦσαν ἀδίκους
  choice: die Ungerechte hasst
  rationale: Das feminine Partizip bezieht sich auf „Seele“. Das substantivierte ἀδίκους wird direkt als „Ungerechte“ wiedergegeben, ohne es auf bestimmte Taten einzuengen.
- source_word: κατευθύναι
  choice: leite
  rationale: κατευθύνω kann gerade richten, ausrichten oder führen bedeuten. „Leite“ ist in der Gebetssprache natürlich und erhält den Gedanken göttlicher Lenkung.
- source_word: ἄνδρα
  choice: einen Mann
  rationale: ἄνδρα ist maskulin Singular und bezeichnet ausdrücklich einen Mann; die Übersetzung erhält diese Form.
- source_word: ποιοῦντα εἰρήνην
  choice: der … Frieden stiftet
  rationale: Die wörtliche Verbindung „Frieden machen“ wird im Deutschen idiomatisch und aktiv mit „Frieden stiften“ wiedergegeben.
- source_word: ἐν οἴκῳ
  choice: im Haus
  rationale: οἶκος kann Haus, Zuhause oder Hausgemeinschaft bedeuten. „Im Haus“ ist die formnahe Hauptlesart; die mögliche soziale Bedeutung wird in einer Fußnote erhalten.
theological_decisions:
- issue: Das Hassen der Ungerechten
  choice: die Ungerechte hasst
  alternative: die das Unrecht hasst
  rationale: Der griechische Text hat das substantivierte maskuline Pluraladjektiv ἀδίκους und bezeichnet daher ungerechte Menschen, nicht abstrakt das Unrecht. Die moralische Spannung wird nicht abgeschwächt.
translation_notes:
  register: Moderne, würdevolle Gebetssprache. Die Optative werden mit dem deutschen Wunschkonjunktiv wiedergegeben. „Stille Seele“ wahrt die knappe, leicht ungewohnte Bildsprache des Griechischen; „Frieden stiften“ ist idiomatisches Standarddeutsch.
