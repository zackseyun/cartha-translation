base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/012/003.yaml
  text: His dwelling is to fill houses with a lying tongue[a], to cut down trees of gladness[d][c][b], flaming against the lawless.
translation:
  language: de
  text: Sein Aufenthalt[a] besteht darin, Häuser mit lügnerischer Zunge zu füllen und Bäume der Freude[b] abzuhauen, die Gesetzlose in Brand setzt.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „sein Wohnen“ beziehungsweise „sein Aufenthalt in der Fremde“; das griechische Wort kann das Wohnen als Fremder oder zeitweilig Ansässiger bezeichnen.
    reason: lexical_alternative
  - marker: b
    text: Wörtlich „Bäume der Freude“; wahrscheinlich ist bildhaft das gemeint, was ein Haus gedeihen lässt und ihm Freude bringt.
    reason: cultural_note
  - marker: c
    text: Der griechische Schluss ist stark verdichtet. Das feminine Genitivpartizip bezieht sich grammatisch am nächsten auf „Freude“ und beschreibt sie als eine Freude, die Gesetzlose in Brand setzt. Die Aussage bleibt im überlieferten Wortlaut ungewöhnlich.
    reason: alternative_reading
lexical_decisions:
- source_word: ἡ παροικία αὐτοῦ
  choice: Sein Aufenthalt
  rationale: παροικία bezeichnet Aufenthalt oder Wohnen, häufig mit dem Beiklang eines zeitweiligen Aufenthalts in der Fremde. „Aufenthalt“ bewahrt diese mögliche Nuance und lässt zugleich die nominale Satzstruktur des Griechischen bestehen.
- source_word: ἐμπλῆσαι οἴκους
  choice: Häuser zu füllen
  rationale: Die Infinitivkonstruktion wird als Erläuterung zu „Sein Aufenthalt“ wiedergegeben. „Häuser“ erhält das konkrete Bild, ohne es vorschnell zu „Familien“ zu abstrahieren.
- source_word: ἐν γλώσσῃ ψεύδει
  choice: mit lügnerischer Zunge
  rationale: Die Formulierung bewahrt das körperhafte Bild der Zunge als Werkzeug der Lüge. Das ungewöhnliche griechische ψεύδει wird sinngemäß attributiv wiedergegeben.
- source_word: ἐκκόψαι δένδρα εὐφροσύνης
  choice: Bäume der Freude abzuhauen
  rationale: ἐκκόψαι bezeichnet ein kräftiges Abhauen oder Fällen. Das auffällige Bild „Bäume der Freude“ bleibt erhalten und wird nicht durch eine abstrakte Deutung ersetzt.
- source_word: φλογίζούσης παρανόμους
  choice: einer Freude, die Gesetzlose entflammt
  rationale: Das feminine Genitivpartizip φλογιζούσης wird grammatisch auf das unmittelbar vorausgehende εὐφροσύνης bezogen; παρανόμους bleibt das Akkusativobjekt. „Entflammt“ erhält sowohl das Feuerbild als auch dessen mögliche übertragene Bedeutung.
theological_decisions:
- issue: Bezug des Partizips φλογιζούσης
  choice: Bezug auf εὐφροσύνης („Freude“)
  alternative: 'Lockerer Bezug auf γλώσσῃ („Zunge“), also: „mit einer lügnerischen Zunge, die Gesetzlose entflammt“'
  rationale: Genus und Kasus erlauben beide Bezüge, doch die unmittelbare Stellung nach εὐφροσύνης spricht eher für „Freude“. Wegen der ungewöhnlichen Aussage wird die andere grammatisch mögliche Zuordnung in einer Fußnote offengehalten; eine eigenständige Handlung des Mannes wäre mit dem femininen Genitivpartizip nicht vereinbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die nominale Grundstruktur und die beiden Infinitive des griechischen Textes bleiben erkennbar. Die ungewöhnliche Baummetapher und die syntaktische Spannung des Schlusses werden nicht geglättet; der Gedankenstrich macht lediglich den gewählten Bezug des Partizips lesbar.
