base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/012/004.yaml
  text: May God throw lawless houses into turmoil in war by whispering lips[a]; may God remove from the innocent the lips of the lawless in distress[c][b], and may the bones of whisperers be scattered away from those who fear the Lord.
translation:
  language: de
  text: Möge Gott gesetzlose Häuser[b] im Krieg durch flüsternde Lippen[a] in Aufruhr versetzen. Möge Gott in der Not die Lippen der Gesetzlosen von den Unschuldigen fernhalten[c], und mögen die Knochen der Flüsterer von denen fort verstreut werden, die den Herrn fürchten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „durch verleumderische Lippen“; entsprechend später: „die Knochen der Verleumder“. Die griechische Wortgruppe kann heimliche, böswillige Rede bezeichnen, nicht bloß leises Sprechen.'
    reason: lexical_alternative
  - marker: b
    text: „Häuser“ kann hier auch Hausgemeinschaften, Familien oder deren Besitzstände meinen, nicht nur Gebäude.
    reason: lexical_alternative
  - marker: c
    text: Der griechische Ausdruck „in der Not“ kann sich auf die Lage der Unschuldigen, auf die Gesetzlosen oder allgemeiner auf die erbetene Abwehr beziehen. Auch „in Ratlosigkeit“ oder „in Bedrängnis“ ist möglich.
    reason: source_ambiguity
lexical_decisions:
- source_word: συνταράξαι
  choice: in Aufruhr versetzen
  rationale: Die Wendung gibt die starke Erschütterung und Verwirrung des griechischen Verbs wieder; im Zusammenhang drückt der Infinitiv einen Gebetswunsch aus.
- source_word: οἴκους
  choice: Häuser
  rationale: Die konkrete Grundbedeutung bleibt erhalten; zugleich kann das Wort hier auch Hausgemeinschaften oder Familien meinen, was in einer Fußnote vermerkt wird.
- source_word: παρανόμους / παρανόμων
  choice: gesetzlos / der Gesetzlosen
  rationale: Dies bildet den Bezug auf ein Handeln gegen das Gesetz möglichst direkt ab, ohne allgemeinere Wertungen wie „böse“ einzutragen.
- source_word: χείλεσι ψιθυροῖς
  choice: durch flüsternde Lippen
  rationale: Die Körpermetapher und der instrumentale Dativ werden bewahrt. „Flüsternd“ kann im Kontext heimliche, böswillige Rede bezeichnen.
- source_word: μακρύναι
  choice: fernhalten
  rationale: Das Verb bezeichnet ein Entfernen beziehungsweise Auf-Distanz-Halten; „fernhalten“ ist im Deutschen klar und entspricht dem Gebetswunsch.
- source_word: ἀκάκων
  choice: die Unschuldigen
  rationale: Die Bezeichnung meint Menschen ohne Bosheit oder Arglist. „Unschuldige“ ist gegenwärtig, verständlich und moralisch nicht überpräzisiert.
- source_word: ἐν ἀπορίᾳ
  choice: in der Not
  rationale: Die Wendung kann Bedrängnis, Hilflosigkeit oder Ratlosigkeit bezeichnen. „In der Not“ ist idiomatisch und lässt den genauen Charakter der bedrängten Lage offen.
- source_word: ψιθύρων
  choice: Flüsterer
  rationale: Die Übersetzung hält die Wortverbindung zu den „flüsternden Lippen“ fest; die mögliche Bedeutung „Verleumder“ wird in der Fußnote genannt.
- source_word: φοβουμένων Κύριον
  choice: die den Herrn fürchten
  rationale: Die traditionelle biblische Wendung bezeichnet ehrfürchtige Gottesverehrung und gibt κύριος mit „Herr“ wieder.
theological_decisions:
- issue: Bezug von ἐν ἀπορίᾳ („in der Not“)
  choice: Die Wendung wird vor die zweite Bitte gestellt, ohne ausdrücklich festzulegen, auf welche Personengruppe sie sich bezieht.
  alternative: „die Lippen der Gesetzlosen, die in Not sind“ oder „von den Unschuldigen, wenn diese in Not sind“
  rationale: Die griechische Stellung am Ende der Wortgruppe lässt den Bezug offen. Der Haupttext vermeidet eine eindeutige theologische oder moralische Zuordnung der Not; die Fußnote weist die Möglichkeiten aus.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit der wiederholten Wunschform „Möge …“. Die Satzstruktur folgt den drei Bitten des Griechischen, wird aber durch zwei Sätze lesbarer gemacht. Konkrete Bilder wie „Lippen“ und „Gebeine“ bleiben erhalten; ungewöhnliche oder mehrdeutige Ausdrücke werden nicht stillschweigend geglättet.
