  text: The Lord’s salvation be upon Israel[a], his servant[b], forever.
translation:
  language: de
  text: Die Rettung des Herrn sei für immer über Israel, seinen Diener.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Israel wird als Gottes „Kind“ beziehungsweise „Sohn“ bezeichnet. Das griechische Wort παῖς kann sowohl „Diener“ als auch „Kind/Sohn“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦ κυρίου
  choice: des Herrn
  rationale: 'Der Genitiv wird possessiv wiedergegeben: Die Rettung gehört dem Herrn und geht von ihm aus. „Herr“ entspricht dem üblichen biblischen Titel κύριος.'
- source_word: ἡ σωτηρία
  choice: die Rettung
  rationale: σωτηρία bezeichnet Rettung oder Heil. „Rettung“ ist hier verständlich, würdevoll und bewahrt den konkreten Gedanken göttlicher Befreiung.
- source_word: ἐπὶ Ἰσραήλ
  choice: über Israel
  rationale: „Über“ erhält das räumlich-segnende Bild von ἐπί. Wegen des optativischen Gebetszusammenhangs wird die verblos formulierte griechische Zeile als Wunsch mit „sei“ verstanden.
- source_word: παῖδα αὐτοῦ
  choice: seinem Diener
  rationale: παῖς kann „Diener“, „Kind“ oder „Sohn“ bedeuten. Im biblischen Verhältnis zwischen Gott und Israel passt „Diener“ gut, ohne die echte lexikalische Mehrdeutigkeit in der Fußnote zu verschweigen.
- source_word: εἰς τὸν αἰῶνα
  choice: für immer
  rationale: Die feste Wendung bezeichnet unbegrenzte Dauer; „für immer“ ist natürliches modernes Deutsch.
theological_decisions:
- issue: Aussage oder Segenswunsch
  choice: sei
  alternative: ist
  rationale: Obwohl der griechische Satz kein ausdrückliches finites Verb enthält, sprechen die Optative in den umgebenden Versen dafür, ihn als Gebet beziehungsweise Segenswunsch zu lesen. Die Ellipse bleibt grundsätzlich mehrdeutig.
- issue: Bezeichnung Israels als παῖς
  choice: Diener
  alternative: Kind oder Sohn
  rationale: „Diener“ entspricht dem verbreiteten biblischen Bundes- und Dienstmotiv. Da παῖς zugleich ein Abstammungs- oder Kindschaftsverhältnis ausdrücken kann, wird diese Alternative ausdrücklich vermerkt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Formulierung „sei … über“ bewahrt den Charakter eines Segenswunsches und zugleich das Bild der griechischen Präposition.
