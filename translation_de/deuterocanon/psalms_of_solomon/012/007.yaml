  source_fidelity: Die Wiedergabe erfasst σωτηρία, κύριος, die Dauerformel εἰς τὸν αἰῶνα und den im Kontext naheliegenden Wunschcharakter mit „sei“ zutreffend. παῖδα αὐτοῦ wird vertretbar als „seinen Diener“ verstanden; die lexikalische Alternative ist anzumerken.
  naturalness: 'Die Apposition ist im Entwurf grammatisch nicht stimmig: Nach „über Israel“ steht „seinem Diener“ im Dativ, obwohl die Konstruktion im Deutschen hier eine akkusativische Apposition verlangt. „Israel, seinen Diener“ ist korrekt und bewahrt die knappe, gehobene Psalmensprache.'
  terminology: „Rettung des Herrn“, „Diener“ und „für immer“ sind modernes, würdiges Standarddeutsch und dem griechischen Register angemessen. Die Fußnote soll die Alternativen ohne einen falschen Kasus in einem Zitat nennen.
