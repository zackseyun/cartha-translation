  - severity: low
    issue: Fußnote zitiert die Alternativen in einem nicht zur Satzkonstruktion passenden Dativ
    rationale: „Israel, seinem Kind/seinem Sohn“ übernimmt den fehlerhaften Dativ. Die Alternativen lassen sich präzise und kasusunabhängig erläutern.
