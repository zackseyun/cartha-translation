source:
  edition: lxx-swete-1909
  text: φεύξονται γὰρ ὡς διωκόμενοι πολέμου ἀπὸ ὁσίων, καταδιώξονται δὲ ἁμαρτωλοὺς καὶ καταλήψονται· καὶ οὐκ ἐκφεύξονται οἱ ποιοῦντες ἀνομίαν τὸ κρίμα Κυρίου, ὡς ὑπὸ πολεμίων ἐμπείρων καταλημφθήσονται.
  language: Greek
  pages:
  - 804
  validation: swete_direct
base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/015/009.yaml
  text: For they will flee from the holy ones as those pursued by war[a], but they will pursue sinners and overtake them; and those who practice lawlessness will not escape the Lord’s judgment[c][b]; they will be captured like those seized by experienced enemies.
translation:
  language: de
  text: Denn sie werden vor den Frommen fliehen wie Menschen, die vom Krieg verfolgt werden[a]; sie aber werden die Sünder verfolgen und einholen. Diejenigen, die Unrecht tun, werden dem Urteil des Herrn nicht entkommen; sie werden ergriffen werden wie von erfahrenen Feinden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die gedrängte griechische Wendung kann auch sinngemäß wiedergegeben werden: „wie Menschen, die der Krieg in die Flucht treibt“.'
    reason: alternative_reading
lexical_decisions:
- source_word: φεύξονται
  choice: sie werden fliehen
  rationale: Das Futur wird unmittelbar wiedergegeben; „fliehen“ bezeichnet hier die Bewegung weg von den Frommen.
- source_word: ὡς διωκόμενοι πολέμου
  choice: wie Menschen, die vom Krieg verfolgt werden
  rationale: Die verdichtete griechische Wendung und ihr Kriegsbild bleiben erhalten, ohne die genaue Art der Bedrängnis vorschnell festzulegen.
- source_word: ἀπὸ ὁσίων
  choice: vor den Frommen
  rationale: ὅσιος bezeichnet hier fromme beziehungsweise gottesfürchtige Menschen; „die Frommen“ unterscheidet die Gruppe von einer allgemeinen Wiedergabe als „Heilige“ und passt idiomatisch zu „fliehen vor“.
- source_word: καταδιώξονται
  choice: sie werden verfolgen
  rationale: Das Verb bezeichnet nachdrückliche Verfolgung; die schlichte Wiedergabe wahrt die Parallelität der Bewegungsverben.
- source_word: καταλήψονται
  choice: einholen
  rationale: Nach „verfolgen“ beschreibt „einholen“ natürlich das erfolgreiche Erreichen der Verfolgten.
- source_word: οἱ ποιοῦντες ἀνομίαν
  choice: diejenigen, die Unrecht tun
  rationale: Die partizipiale Formulierung wird als kennzeichnendes Handeln wiedergegeben; „Unrecht tun“ ist modernes, verständliches Deutsch und bewahrt den Bezug zur Missachtung der göttlichen Ordnung.
- source_word: τὸ κρίμα Κυρίου
  choice: dem Urteil des Herrn
  rationale: κρίμα bezeichnet hier das richterliche Urteil; der Dativ folgt idiomatisch aus „entkommen“.
- source_word: ὡς ὑπὸ πολεμίων ἐμπείρων καταλημφθήσονται
  choice: sie werden ergriffen werden wie von erfahrenen Feinden
  rationale: Die passive Gefangennahme und das militärische Bild bleiben erhalten; ἐμπείρων wird direkt mit „erfahrenen“ wiedergegeben.
theological_decisions:
- issue: Wiedergabe von κύριος in τὸ κρίμα Κυρίου
  choice: das Urteil des Herrn
  alternative: das Urteil des HERRN
  rationale: „Herr“ gibt κύριος direkt wieder und führt keine im griechischen Text nicht ausdrücklich markierte Wiedergabe des Gottesnamens ein.
- issue: Bezeichnung der ὅσιοι
  choice: die Frommen
  alternative: die Heiligen
  rationale: „Die Frommen“ bildet den religiös-ethischen Sinn von ὅσιοι ab und vermeidet eine Gleichsetzung mit ἅγιοι; zugleich wird keine bestimmte konfessionelle Heiligenlehre eingetragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die militärische Bildsprache und die Abfolge „verfolgen – einholen – ergriffen werden“ werden bewahrt. Der Wechsel des Subjekts nach dem Semikolon wird durch „sie aber“ verdeutlicht, ohne eine neue Personengruppe einzuführen.
