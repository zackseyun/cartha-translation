  text: And the inheritance of sinners is destruction and darkness, and their lawlessness will pursue them down to Hades.
translation:
  language: de
  text: Und das Erbe der Sünder ist Vernichtung und Finsternis, und ihre Gesetzlosigkeit wird sie bis hinab in den Hades[a] verfolgen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das heißt: bis hinab ins Totenreich; im griechischen Text steht ᾅδης (Hades), nicht γέεννα (Gehenna).'
    reason: lexical_clarification
lexical_decisions:
- source_word: κληρονομία
  choice: Erbe
  rationale: „Erbe“ bewahrt die konkrete Vorstellung eines zugeteilten Anteils und lässt den bitteren Gegensatz zu einem segensreichen Erbe bestehen.
- source_word: ἁμαρτωλῶν
  choice: der Sünder
  rationale: Die substantivische Pluralform wird im Deutschen direkt und natürlich mit „der Sünder“ wiedergegeben.
- source_word: ἀπώλεια
  choice: Vernichtung
  rationale: „Vernichtung“ gibt den Gedanken endgültigen Verderbens deutlich wieder, ohne die altertümliche oder konfessionell aufgeladene Sprache mancher Alternativen.
- source_word: σκότος
  choice: Finsternis
  rationale: „Finsternis“ wahrt das starke Bild des griechischen Ausdrucks und passt zum würdevollen poetischen Register.
- source_word: ἀνομία
  choice: Gesetzlosigkeit
  rationale: „Gesetzlosigkeit“ erhält den unmittelbaren Bezug zur Missachtung des Gesetzes, statt den Ausdruck allgemein zu „Bosheit“ abzuschwächen.
- source_word: διώξεται
  choice: wird … verfolgen
  rationale: Die Wiedergabe bewahrt Futur und Bild einer unerbittlichen Verfolgung, ohne die Bedeutung auf religiöse Verfolgung einzuengen.
- source_word: ἕως ᾅδου κάτω
  choice: bis hinab in den Hades
  rationale: „Bis“ bildet ἕως ab, „hinab“ erhält die durch κάτω bezeichnete Abwärtsrichtung, und „Hades“ vermeidet die interpretierende Gleichsetzung mit der Hölle.
theological_decisions:
- issue: Wiedergabe von ᾅδης
  choice: Hades
  alternative: Totenreich; Hölle
  rationale: „Hades“ wahrt die konkrete griechische Bezeichnung für den Bereich der Toten. „Hölle“ wäre theologisch stärker festgelegt, während „Totenreich“ zwar verständlich, aber bereits eine erklärende Deutung ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer poetischer Bildsprache. Die Satzstruktur folgt dem griechischen Parallelismus; „bis hinab“ bewahrt sowohl die Grenzangabe als auch die Abwärtsbewegung.
