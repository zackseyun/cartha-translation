base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/015/013.yaml
  text: For sins will lay waste the houses of sinners[b][a], and sinners will perish on the day of the Lord’s judgment forever.
translation:
  language: de
  text: Denn die Sünden werden die Häuser der Sünder verwüsten[a], und die Sünder werden am Tag des Gerichts des Herrn für immer zugrunde gehen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »öde machen« beziehungsweise »verheeren«.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: »für das Zeitalter«; hier mit »für immer« wiedergegeben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἁμαρτίαι
  choice: die Sünden
  rationale: Der Plural bezeichnet konkrete oder angehäufte Verfehlungen; »Sünden« ist die direkte und natürliche deutsche Entsprechung.
- source_word: ἐξερημώσουσιν
  choice: werden … verwüsten
  rationale: Das Verb bedeutet, etwas zu verwüsten oder öde zu machen. »Verwüsten« gibt die Härte des Ausdrucks in natürlichem, würdigem Deutsch wieder.
- source_word: οἴκους
  choice: die Häuser
  rationale: Die Grundbedeutung ist »Häuser«. Eine übertragene Wiedergabe als »Hausgemeinschaften« oder »Familien« wird vom unmittelbaren Wortlaut nicht verlangt.
- source_word: ἁμαρτωλῶν
  choice: der Sünder
  rationale: Der Genitiv ist eindeutig und bewahrt die Wiederholung von »Sünder« im folgenden Satzteil.
- source_word: ἀπολοῦνται
  choice: werden … zugrunde gehen
  rationale: Das Verb bezeichnet Untergang oder Verderben. »Zugrunde gehen« wahrt den ernsten Gerichtston, ohne die Art des Untergangs näher festzulegen.
- source_word: ἐν ἡμέρᾳ κρίσεως Κυρίου
  choice: am Tag des Gerichts des Herrn
  rationale: Die Formulierung bildet die Genitivverhältnisse genau ab und ist zugleich verständliches Standarddeutsch.
- source_word: εἰς τὸν αἰῶνα
  choice: für immer
  rationale: Im Zusammenhang des Gerichts drückt die Wendung bleibende Endgültigkeit aus. Die Fußnote hält die wörtlichere Möglichkeit »für das Zeitalter« fest.
theological_decisions:
- issue: Bezug und Reichweite von εἰς τὸν αἰῶνα
  choice: »für immer« bezieht sich auf das Zugrundegehen der Sünder.
  alternative: Die Wendung könnte allgemeiner die gesamte Gerichtsaussage verstärken oder wörtlicher mit »für das Zeitalter« wiedergegeben werden.
  rationale: Durch ihre Stellung nach der Aussage über den Untergang der Sünder qualifiziert die Wendung am natürlichsten diesen Untergang. Die deutsche Wortstellung vermeidet möglichst den Eindruck, sie bezeichne die Dauer des Gerichtstags.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit enger Bindung an die griechische Satzstruktur. Die Wiederholung von »Sünden/Sünder« und die konkrete Rede von den »Häusern« bleiben erhalten.
