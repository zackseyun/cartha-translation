  text: For the sign of God is upon the righteous for salvation[e][d][c][b][a]; famine and sword and death are far from the righteous.
translation:
  language: de
  text: Denn Gottes Zeichen ist auf den Gerechten, zu ihrer Rettung[a]; Hungersnot, Schwert und Tod[b] sind den Gerechten fern.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Kennzeichen Gottes“ beziehungsweise „das Mal Gottes“.'
    reason: lexical_alternative
  - marker: b
    text: Das griechische Wort bedeutet gewöhnlich „Tod“; in traditionellen Aufzählungen von Gerichtsplagen kann hier auch an „Pest“ oder „Seuche“ gedacht sein.
    reason: alternative_reading
lexical_decisions:
- source_word: σημεῖον
  choice: Zeichen
  rationale: „Zeichen“ bewahrt die offene Bedeutung eines sichtbaren oder erkennbaren göttlichen Kennzeichens und lässt zugleich den Zusammenhang mit dem Zeichen an den Sündern in Psalm Salomos 15,10 erkennen.
- source_word: δικαίους / δικαίων
  choice: die Gerechten / den Gerechten
  rationale: Die substantivierte Form bezeichnet allgemein die Menschen, die gerecht sind; „die Gerechten“ ist im modernen Deutschen natürlich und würdevoll.
- source_word: εἰς σωτηρίαν
  choice: zu ihrer Rettung
  rationale: Die Formulierung gibt die Zielrichtung von εἰς wieder. Das ergänzte Possessivpronomen macht im Deutschen verständlich, dass die Rettung den Gerechten gilt, ohne die Aussage inhaltlich zu verengen.
- source_word: λιμός
  choice: Hunger
  rationale: „Hunger“ ist eine geläufige deutsche Wiedergabe und bezeichnet hier im Zusammenhang mit Schwert und Tod eine öffentliche Notlage; „Hungersnot“ wäre ebenfalls möglich.
- source_word: ῥομφαία
  choice: Schwert
  rationale: „Schwert“ ist die sachgerechte und traditionelle Wiedergabe in einer Aufzählung von Gerichtsplagen.
- source_word: θάνατος
  choice: Tod
  rationale: „Tod“ entspricht der unmittelbaren Bedeutung des griechischen Wortes. Eine engere Deutung als „Pest“ ist im traditionsgeschichtlichen Zusammenhang möglich, wird aber nicht in den Haupttext eingetragen.
- source_word: μακράν
  choice: fern
  rationale: Die prädikative Wendung „den Gerechten fern“ gibt die räumlich-bildhafte Distanz des griechischen Ausdrucks knapp und würdevoll wieder.
theological_decisions:
- issue: Art und Wirkung des göttlichen Zeichens
  choice: Die offene Bezeichnung „Zeichen“ und die zielgerichtete Wendung „zu ihrer Rettung“ werden beibehalten.
  alternative: „Schutzzeichen“ oder „Siegel Gottes“
  rationale: Der Vers spricht von einem σημεῖον, erklärt aber weder dessen konkrete Gestalt noch den genauen Mechanismus seines Schutzes. Eine präzisere theologische Deutung würde mehr festlegen als der griechische Text.
- issue: Bedeutung von θάνατος in der Gerichtsreihe
  choice: Tod
  alternative: Pest / Seuche
  rationale: Die wörtliche Bedeutung bleibt im Haupttext erhalten; die mögliche Anspielung auf traditionelle Reihen von Gerichtsplagen wird in einer Fußnote kenntlich gemacht, ohne die Mehrdeutigkeit aufzulösen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit knapper, poetisch-würdiger Satzführung. Der Parallelismus der beiden Satzhälften und die zweimalige Bezeichnung „die Gerechten“ bleiben erhalten.
