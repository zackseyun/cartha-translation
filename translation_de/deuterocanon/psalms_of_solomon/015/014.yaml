lexical_decisions:
- source_word: ὅταν
  choice: wenn
  rationale: Leitet mit dem Konjunktiv einen zeitlichen Nebensatz ein. „Wenn“ ist im Deutschen natürlich und lässt offen, ob ein bestimmter künftiger Zeitpunkt oder ein allgemeiner Fall gemeint ist.
- source_word: ἐπισκέπτηται
  choice: heimsucht
  rationale: Das Verb bezeichnet ein zielgerichtetes Aufsuchen oder Eingreifen. „Heimsucht“ bewahrt den biblisch-feierlichen Klang und passt zum gerichtlichen Zusammenhang, ohne die Art des Gerichts weiter auszudeuten.
- source_word: τὴν γῆν
  choice: die Erde
  rationale: γῆ kann „Erde“ oder „Land“ bedeuten. Der knappe Satz nennt kein bestimmtes Gebiet; daher gibt „die Erde“ den wahrscheinlich umfassenden Bezug wieder. Die Alternative wird in der Fußnote bewahrt.
- source_word: ἐν κρίματι αὐτοῦ
  choice: in seinem Gericht
  rationale: Die Formulierung folgt der griechischen Präpositionalkonstruktion und erhält den möglichen Sinn eines gerichtlichen Geschehens beziehungsweise Urteilshandelns, ohne sie auf „zur Verurteilung“ zu verengen.
theological_decisions:
- issue: Charakter der göttlichen Heimsuchung
  choice: Die gerichtliche Färbung ergibt sich aus „in seinem Gericht“, während das Verb selbst nicht ausdrücklich als Strafe paraphrasiert wird.
  alternative: „wenn Gott strafend über die Erde kommt“
  rationale: Der griechische Text verbindet ein in seiner Wertung offenes Verb des Aufsuchens mit κρίμα. Eine ausdrücklich strafende Paraphrase würde die Aussage stärker festlegen als die Vorlage.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper poetischer Satzführung. „Heimsucht“ ist gehoben und bibelsprachlich, hier jedoch noch allgemein verständlich; es trägt die Vorstellung eines folgenreichen göttlichen Eingreifens.
