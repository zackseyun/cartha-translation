translation:
  language: de
  text: wenn Gott die Erde in seinem Gericht heimsucht.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wenn Gott das Land in seinem Gericht heimsucht“.'
