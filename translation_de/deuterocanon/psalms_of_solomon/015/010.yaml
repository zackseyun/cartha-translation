lexical_decisions:
- source_word: σημεῖον
  choice: Zeichen
  rationale: „Zeichen“ gibt den breiten Sinn des griechischen Wortes wieder und bewahrt den beabsichtigten sprachlichen Parallelismus mit anderen Zeichenmotiven im Zusammenhang.
- source_word: ἀπωλείας
  choice: des Verderbens
  rationale: Der Genitiv bezeichnet das Zeichen als eines, das Verderben kennzeichnet oder ankündigt. „Verderben“ ist würdevoll und lässt die Spannung zwischen Untergang und Vernichtung bestehen.
- source_word: ἐπὶ
  choice: auf
  rationale: Mit dem Genitiv τοῦ μετώπου bezeichnet die Präposition hier die Lage auf der Stirn; „auf“ ist im modernen Deutschen natürlich und genau.
- source_word: μετώπου αὐτῶν
  choice: ihrer Stirn
  rationale: Die wörtliche kollektive Einzahl des Griechischen ist auch im Deutschen verständlich und erhält die Form des Ausgangstextes.
