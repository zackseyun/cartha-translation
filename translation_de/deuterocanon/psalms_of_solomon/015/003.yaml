lexical_decisions:
- source_word: τίς γὰρ ἰσχύει
  choice: Denn wer ist stark
  rationale: Die rhetorische Frage und die Grundbedeutung von ἰσχύω („stark sein“, „Kraft haben“) bleiben erhalten. Der folgende Infinitiv erläutert, worin diese Stärke besteht.
- source_word: ὁ θεός
  choice: o Gott
  rationale: Der formal nominativische Ausdruck mit Artikel wird im Zusammenhang als direkte Anrede gebraucht; „o Gott“ gibt den Gebetston würdig und eindeutig wieder.
- source_word: εἰ μὴ ἐξομολογήσασθαί σοι
  choice: außer wenn er dir … dankt
  rationale: εἰ μή bezeichnet hier die ausschließende Ausnahme. Die finite deutsche Formulierung ist natürlicher als eine wörtliche Infinitivkonstruktion. ἐξομολογέομαι mit Dativ bezeichnet im biblisch-griechischen Lobkontext vor allem Danken beziehungsweise Preisen, nicht notwendig ein Sündenbekenntnis.
- source_word: ἐν ἀληθείᾳ
  choice: in Wahrheit
  rationale: Die relativ formale Wiedergabe bewahrt sowohl den Wahrheitsbezug als auch den feierlichen Klang; möglich ist zugleich die Nuance „aufrichtig“.
theological_decisions:
- issue: Bedeutung von ἐξομολογήσασθαι im Gebetskontext
  choice: dir … dankt
  alternative: dich aufrichtig preist oder sich wahrhaftig zu dir bekennt
  rationale: Der Sprachgebrauch der Septuaginta und der parallele Lobkontext sprechen vorrangig für Danken oder Preisen. Die Fußnote hält die weitere Bedeutung des offenen Anerkennens fest, ohne den Ausdruck auf ein Sündenbekenntnis einzuengen.
- issue: Verhältnis von Stärke und Dank
  choice: Stark ist, wer Gott in Wahrheit dankt
  alternative: Wer besitzt überhaupt die Kraft, Gott in Wahrheit zu danken?
  rationale: Die Verbindung von ἰσχύει mit εἰ μή und dem Infinitiv sowie der Parallelismus des Folgeverses legen nahe, dass das Danken als der Bereich beziehungsweise Ausdruck wahrer Stärke dargestellt wird. Die deutsche Fassung bewahrt die rhetorische Spannung.
translation_notes:
  register: Moderne, verständliche Standardsprache mit feierlichem Gebetston. „o Gott“ und „in Wahrheit“ bewahren die Würde und den biblischen Rhythmus; die finite Konstruktion nach „außer“ vermeidet unnatürliches Deutsch.
