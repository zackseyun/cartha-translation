translation:
  language: de
  text: einen neuen Psalm mit Gesang, in der Freude des Herzens; die Frucht der Lippen mit dem wohlgestimmten Instrument der Zunge[a]; eine Erstlingsgabe der Lippen aus einem heiligen und gerechten Herzen.[b]
