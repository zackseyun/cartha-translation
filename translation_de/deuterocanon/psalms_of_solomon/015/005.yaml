lexical_decisions:
- source_word: ψαλμὸν καινὸν
  choice: einen neuen Psalm
  rationale: „Psalm“ bewahrt die literarisch-religiöse Gattungsbezeichnung; καινόν bedeutet hier schlicht „neu“.
- source_word: μετὰ ᾠδῆς
  choice: mit Gesang
  rationale: ᾠδή bezeichnet ein Lied oder einen Gesang. „Mit Gesang“ gibt die knappe Begleitkonstruktion mit μετά wieder, ohne sie unnötig auszudeuten.
- source_word: ἐν εὐφροσύνῃ καρδίας
  choice: in der Freude des Herzens
  rationale: Die Formulierung bewahrt sowohl die innere Freude als auch die Genitivverbindung mit „Herz“.
- source_word: καρπὸν χειλέων
  choice: die Frucht der Lippen
  rationale: Die wörtliche Metapher ist biblisch geprägt und verbindet das gesprochene Lob mit der folgenden Opfermetaphorik.
- source_word: ἐν ὀργάνῳ ἤρμοσμένῳ γλώσσης
  choice: mit dem wohlgestimmten Instrument der Zunge
  rationale: Die Wiedergabe folgt der kompakten griechischen Substantiv-Genitiv-Struktur. ἤρμοσμένῳ kann „gefügt“, „angepasst“ oder bei einem Instrument „gestimmt“ bedeuten; „wohlgestimmt“ passt zum musikalischen Kontext.
- source_word: ἀπαρχὴν χειλέων
  choice: eine Erstlingsgabe der Lippen
  rationale: „Erstlingsgabe“ bewahrt die kultische Opfermetaphorik von ἀπαρχή deutlicher als eine allgemeine Wiedergabe mit „Gabe“ oder „Opfer“.
- source_word: ἀπὸ καρδίας ὁσίας καὶ δικαίας
  choice: aus einem heiligen und gerechten Herzen
  rationale: „Heilig und gerecht“ erhält die religiös-ethische Doppelbestimmung von ὁσίας καὶ δικαίας.
theological_decisions:
- issue: Opferbild in „Frucht der Lippen“ und „Erstlingsgabe der Lippen“
  choice: Beide Metaphern werden ausdrücklich beibehalten.
  alternative: Die Wendungen als „Lobpreis“ oder „Worte des Lobes“ paraphrasieren.
  rationale: Der griechische Text stellt die Äußerung als Frucht und Erstlingsgabe dar. Eine bloße Paraphrase als Lobpreis würde die kultische Bildsprache und ihre innere Spannung einebnen.
translation_notes:
