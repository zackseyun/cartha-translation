lexical_decisions:
- source_word: ἡ κληρονομία αὐτῶν
  choice: ihr Erbe
  rationale: κληρονομία bezeichnet ein Erbe beziehungsweise einen ererbten Besitz. „Erbe“ bewahrt den rechtlich-familiären Sinn und passt zum Bezug auf die Kinder.
- source_word: οὐχ εὑρεθήσεται
  choice: wird nicht zu finden sein
  rationale: Die griechische Futur-Passivform wird eng und zugleich idiomatisch wiedergegeben. Die Formulierung vermeidet eine erklärende Festlegung auf Verlust, Fortbestand oder Weitergabe.
- source_word: τοῖς τέκνοις αὐτῶν
  choice: für ihre Kinder
  rationale: Der Dativ bleibt bewusst weit gefasst und kann Verfügbarkeit, Nutzen oder Übergang bezeichnen. „Kinder“ ist hier die natürliche Wiedergabe von τέκνα.
