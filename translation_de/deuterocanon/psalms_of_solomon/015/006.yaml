  yaml_path: translation/deuterocanon/psalms_of_solomon/015/006.yaml
  text: The one who does these things will never be shaken by evil[d][c][b][a]; a flame of fire and the wrath of the unrighteous will not touch him.
translation:
  language: de
  text: Wer dies tut, wird niemals durch Unheil und durch eine Flamme des Feuers erschüttert werden; und der Zorn gegen die Ungerechten[b] wird ihn nicht treffen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'Der griechische Genitiv kann auch bedeuten: „der Zorn der Ungerechten“.'
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: ὁ ποιῶν ταῦτα
  choice: Wer dies tut
  rationale: Das substantivierte Partizip bezeichnet allgemein jeden Menschen, der das zuvor Genannte tut. Die deutsche Konstruktion ist natürlich und bewahrt diesen allgemeinen Sinn.
- source_word: οὐ σαλευθήσεται εἰς τὸν αἰῶνα
  choice: wird niemals … erschüttert werden
  rationale: Das Passiv von σαλεύω bezeichnet ein Erschüttert- oder Ins-Wanken-Gebrachtwerden; εἰς τὸν αἰῶνα verstärkt die Verneinung zeitlich und wird idiomatisch mit „niemals“ wiedergegeben.
- source_word: ἀπὸ κακοῦ, φλογὸς πυρός
  choice: durch Unheil, durch eine Feuerflamme
  rationale: κακοῦ und φλογός stehen im Genitiv und lassen sich beide auf ἀπό beziehen. „Unheil“ hält hier die zerstörerische Bedeutung offen, während „Feuerflamme“ die eindringliche griechische Wendung φλὸξ πυρός bewahrt.
- source_word: ὀργὴ ἀδίκων
  choice: der Zorn gegen die Ungerechten
  rationale: 'Der Genitiv kann objektiv verstanden werden: Es handelt sich um Zorn, der sich gegen Ungerechte richtet. Der folgende Vers, der Zorn vom Angesicht des Herrn über Sünder beschreibt, stützt diese Lesart.'
- source_word: οὐχ ἅψεται αὐτοῦ
  choice: wird ihn nicht treffen
  rationale: ἅπτομαι bedeutet wörtlich „berühren“ oder „ergreifen“. Bei Zorn ist „treffen“ im Deutschen idiomatischer und erhält den Gedanken, dass der Genannte davon verschont bleibt.
theological_decisions:
- issue: Bedeutet κακόν moralisch „das Böse“ oder allgemeiner „Unheil“?
  choice: Unheil
  alternative: das Böse
  rationale: Die Verbindung mit der Feuerflamme legt eine schädigende oder vernichtende Macht nahe. „Unheil“ bewahrt diese Breite, ohne den möglichen moralischen Beiklang auszuschließen.
- issue: Ist ἀδίκων ein objektiver oder subjektiver Genitiv?
  choice: Zorn gegen die Ungerechten
  alternative: Zorn der Ungerechten
  rationale: Morphologisch sind beide Deutungen möglich. Der unmittelbare Kontext des folgenden Verses spricht jedoch dafür, dass die Ungerechten Ziel des Zorns sind; die andere Möglichkeit bleibt in einer Fußnote sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzgestalt folgt dem griechischen Aufbau, ohne unnötig steif zu wirken. Die doppelte Angabe mit „durch“ macht sichtbar, dass sowohl κακοῦ als auch φλογός von ἀπό abhängen können; die echte Mehrdeutigkeit von ἀδίκων wird durch die Fußnote bewahrt.
