  verdict: approve
  source_fidelity: Die Übersetzung gibt die temporale Einleitung (ὅταν), das bewusst unausgedrückte Singularsubjekt von ἐξέλθῃ, die gegen Sünder gerichtete Bewegung sowie die Zweckangabe zutreffend wieder. „Vom Angesicht des Herrn her“ bildet ἀπὸ προσώπου Κυρίου quellbezogen und mit angemessener biblischer Bildsprache ab. „Den ganzen Besitz der Sünder“ ist für πᾶσαν ὑπόστασιν ἁμαρτωλῶν eine gut vertretbare, kontextuell klare Wiedergabe und stimmt mit der jüngsten englischen Auditentscheidung („every possession“) überein.
  naturalness: Der Satz ist als kontextabhängiger Wenn-Satz natürlich und verständlich. „Vom Angesicht des Herrn her“ hat eine bewusst leicht biblische, aber im modernen Standarddeutsch weiterhin idiomatische Färbung. Das unbestimmte „es“ wahrt die Ellipse des griechischen Textes, ohne einen nicht im Vers genannten Bezug vorwegzunehmen.
  terminology: „Herr“ für Κύριος und „Sünder“ für ἁμαρτωλοί sind registergerecht und konsistent. „Vernichten“ gibt die starke Aussage von ὀλεθρεύσαι ohne unnötige Zuspitzung wieder. Die Fußnote zu „Bestand“ bewahrt sachgerecht die semantische Breite von ὑπόστασις, ohne die Hauptübersetzung zu belasten.
