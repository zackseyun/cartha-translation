  text: when it goes out against sinners from the presence of the Lord[a], to destroy every possession of sinners.
translation:
  language: de
  text: wenn es vom Angesicht des Herrn her gegen die Sünder ausgeht, um den ganzen Besitz der Sünder[a] zu vernichten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: den ganzen Bestand der Sünder.'
    reason: ὑπόστασις kann außer Besitz oder Habe auch das Bestehende beziehungsweise den Bestand bezeichnen.
lexical_decisions:
- source_word: ὅταν
  choice: wenn
  rationale: Die temporale Konjunktion leitet einen auf den Eintritt des Geschehens bezogenen Nebensatz ein. „Wenn“ ist natürlich und legt keine ausdrückliche Wiederholung fest.
- source_word: ἐξέλθῃ
  choice: es … ausgeht
  rationale: Das griechische Verb hat ein nur aus dem vorausgehenden Zusammenhang erschließbares Subjekt. Das unbestimmte „es“ wahrt diese Ellipse, statt hier eine Person oder Sache ausdrücklich zu benennen.
- source_word: ἐφʼ ἁμαρτωλοὺς
  choice: gegen die Sünder
  rationale: ἐπί bezeichnet bei der Bewegungsrichtung hier ein feindliches Vorgehen; „gegen“ gibt den Gerichtssinn idiomatisch wieder.
- source_word: ἀπὸ προσώπου Κυρίου
  choice: vom Angesicht des Herrn her
  rationale: Die Wendung wird nah am griechischen Bild wiedergegeben. Das ergänzende „her“ macht im Deutschen deutlich, dass von dort etwas ausgeht.
- source_word: ὀλεθρεύσαι
  choice: um … zu vernichten
  rationale: Der Infinitiv bezeichnet hier Zweck oder beabsichtigte Folge. „Vernichten“ bewahrt die Stärke des Verbs.
- source_word: πᾶσαν ὑπόστασιν ἁμαρτωλῶν
  choice: den ganzen Besitz der Sünder
  rationale: ὑπόστασις kann im hellenistisch-jüdischen Sprachgebrauch den vorhandenen Besitz beziehungsweise die Habe bezeichnen. „Den ganzen Besitz“ ist im Deutschen natürlicher als eine etymologisierende Wiedergabe mit „Stütze“; eine Fußnote hält die weiter reichende Bedeutung „Bestand“ offen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht biblischer Färbung in „vom Angesicht des Herrn“. Die ungenannte Bezugsgröße des Verbs bleibt durch „es“ bewusst unbestimmt.
