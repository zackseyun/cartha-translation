  source_fidelity: Die Übersetzung gibt die temporale Konstruktion ἐν τῷ θλίβεσθαί με zutreffend wieder. ἐπεκαλεσάμην mit „rief ... an“, die feste Wendung „den Namen des Herrn“, die auf Gottes Hilfe gerichtete Hoffnung sowie das passive ἐσώθην sind sachgerecht abgebildet. „die Hilfe des Gottes Jakobs“ bewahrt die im griechischen Satz nahegelegte Zuordnung der Hilfe zu „dem Gott Jakobs“.
