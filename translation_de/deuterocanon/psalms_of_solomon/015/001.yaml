base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/015/001.yaml
  text: When I was in distress[a], I called on the name of the Lord; I hoped for help from the God of Jacob[b], and I was saved.
translation:
  language: de
  text: Als ich bedrängt wurde, rief ich den Namen des Herrn an; ich hoffte auf die Hilfe des Gottes Jakobs und wurde gerettet.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »befreit«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν τῷ θλίβεσθαί με
  choice: Als ich bedrängt wurde
  rationale: Die Verbindung ἐν mit dem substantivierten Infinitiv ist hier temporal. Das Passiv θλίβεσθαι bezeichnet Bedrängnis oder Bedrückung; die gewählte Formulierung bewahrt sowohl den Vorgang als auch den zeitlichen Bezug.
- source_word: ἐπεκαλεσάμην
  choice: rief ich … an
  rationale: Das Medium bedeutet in diesem Gebetszusammenhang »anrufen«; die deutsche Verbklammer ergibt sich natürlich aus dem Objekt.
- source_word: τὸ ὄνομα Κυρίου
  choice: den Namen des Herrn
  rationale: Die feste biblische Wendung wird unmittelbar und in würdigem, geläufigem Deutsch wiedergegeben.
- source_word: εἰς βοήθειαν ἤλπισα τοῦ θεοῦ Ἰακώβ
  choice: ich hoffte auf die Hilfe des Gottes Jakobs
  rationale: εἰς βοήθειαν ist als Gegenstand beziehungsweise Ziel des Hoffens zu verstehen, während τοῦ θεοῦ Ἰακώβ die Hilfe näher bestimmt. Diese Wiedergabe bildet die griechische Syntax genauer ab als »hoffte auf Hilfe von«.
- source_word: ἐσώθην
  choice: wurde gerettet
  rationale: Das Passiv von σῴζω bezeichnet hier die erfahrene Rettung aus der Bedrängnis. »Gerettet« wahrt den breiten Bedeutungsumfang; »befreit« bleibt als kontextuell mögliche Alternative in der Fußnote erhalten.
theological_decisions:
- issue: Bedeutungsumfang von ἐσώθην
  choice: wurde gerettet
  alternative: wurde befreit
  rationale: »Gerettet« entspricht dem üblichen breiten Sinn des Verbs, ohne die Rettung auf eine ausschließlich geistliche Bedeutung festzulegen; im Kontext kann ebenso konkrete Befreiung gemeint sein.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit vertrauter biblischer Ausdrucksweise. Der Parallelismus und die Abfolge von Bedrängnis, Anrufung, Hoffnung und Rettung bleiben erhalten.
