  text: And what is man able to do[a], except give thanks to your name?
translation:
  language: de
  text: Und was kann ein Mensch tun, außer deinem Namen zu danken[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »deinen Namen zu bekennen« oder »deinen Namen zu preisen«. Das griechische Verb kann je nach Zusammenhang alle diese Bedeutungen haben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τί
  choice: was
  rationale: Das Interrogativpronomen fragt nach der möglichen Handlung des Menschen, nicht nach der Identität einer Person.
- source_word: δυνατὸς
  choice: kann … tun
  rationale: Das Adjektiv bezeichnet hier Fähigkeit oder Vermögen. Die verbale Wiedergabe mit »kann … tun« ist im Deutschen natürlich und macht die im Griechischen vorausgesetzte Handlung deutlich.
- source_word: ἄνθρωπος
  choice: ein Mensch
  rationale: »Ein Mensch« bewahrt den generischen Singular und gibt ἄνθρωπος im heutigen Standarddeutsch geschlechtsübergreifend und natürlich wieder.
- source_word: εἰ μὴ
  choice: außer
  rationale: In der rhetorischen Frage führt εἰ μή die einzige ausgenommene Möglichkeit ein.
- source_word: ἐξομολογήσασθαι
  choice: zu danken
  rationale: Im biblisch-griechischen Sprachgebrauch kann das Verb gegenüber Gott dankendes Bekenntnis oder Lob ausdrücken. »Danken« passt zum doxologischen Zusammenhang; die weiteren echten Bedeutungsnuancen werden in der Fußnote bewahrt.
- source_word: τῷ ὀνόματί σου
  choice: deinem Namen
  rationale: Der Dativ wird unmittelbar beibehalten und wahrt die biblische Redeweise, nach der der Dank Gottes Namen gilt.
theological_decisions: []
