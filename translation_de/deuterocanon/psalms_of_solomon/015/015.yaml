base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/015/015.yaml
  text: But those who fear the Lord will be shown mercy in it[a], and they will live by the mercy of their God, but sinners will perish forever.
translation:
  language: de
  text: Die aber den Herrn fürchten, werden darin[a] Erbarmen finden, und sie werden durch das Erbarmen ihres Gottes leben; doch die Sünder werden für immer zugrunde gehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „in ihr“. Gemeint ist wahrscheinlich der kurz zuvor erwähnte Tag des Gerichts des Herrn; möglich ist auch ein Rückbezug auf die Erde beziehungsweise das Land in der vorhergehenden Zeile.'
    reason: Das feminine Pronomen αὐτῇ hat in diesem Vers kein ausdrücklich genanntes Bezugswort; die echte Mehrdeutigkeit soll sichtbar bleiben.
lexical_decisions:
- source_word: φοβούμενοι
  choice: die … fürchten
  rationale: Das substantivisch gebrauchte Partizip bezeichnet Menschen, die durch ihre Gottesfurcht gekennzeichnet sind. „Den Herrn fürchten“ bewahrt den religiösen Sinn und klingt im Deutschen natürlich.
- source_word: κύριον
  choice: Herrn
  rationale: „Herr“ ist die übliche und kontextgerechte Wiedergabe von κύριος in der ehrfürchtigen Sprache dieses Psalms.
- source_word: ἐλεηθήσονται
  choice: werden … Erbarmen finden
  rationale: Die Form ist ein Futur Passiv. Die idiomatische deutsche Wendung drückt aus, dass ihnen Erbarmen zuteilwird, ohne es als Verdienst erscheinen zu lassen.
- source_word: ἐν αὐτῇ
  choice: darin
  rationale: Das feminine Pronomen bleibt wie im Griechischen ohne ausdrücklich genanntes Bezugswort. „Darin“ bewahrt diese echte Mehrdeutigkeit, statt vorschnell „an jenem Tag“ oder „im Land“ festzulegen.
- source_word: ἐν τῇ ἐλεημοσύνῃ
  choice: durch das Erbarmen
  rationale: ἐλεημοσύνη meint hier Gottes Erbarmen, nicht menschliches Almosengeben. „Durch“ gibt den tragenden beziehungsweise vermittelnden Sinn von ἐν in diesem Zusammenhang natürlich wieder.
- source_word: ἀπολοῦνται
  choice: werden … zugrunde gehen
  rationale: Die Wendung ist im Deutschen idiomatisch und gibt den ernsten Gerichtssinn von ἀπόλλυμι wieder, ohne unnötig festzulegen, ob eine äußere Vernichtung oder das Verderben im weiteren Sinn gemeint ist.
- source_word: εἰς τὸν αἰῶνα χρόνον
  choice: für immer
  rationale: Die verstärkte Zeitangabe bezeichnet unbegrenzte Dauer; „für immer“ ist dafür die klare und natürliche deutsche Entsprechung.
theological_decisions:
- issue: Bezugswort von αὐτῇ
  choice: Das Hauptwort bleibt mit „darin“ unausgesprochen.
  alternative: Gemeint sein könnte der zuvor erwähnte Tag des Gerichts des Herrn („an jenem Tag“) oder die Erde beziehungsweise das Land aus der vorhergehenden Zeile.
  rationale: Da der griechische Vers selbst das Bezugswort nicht wiederholt, bewahrt „darin“ die sprachliche und theologische Offenheit. Die wahrscheinlichen Bezüge werden in der Fußnote genannt, aber nicht in den Haupttext eingetragen.
- issue: Verhältnis von Erbarmen und Leben
  choice: „durch das Erbarmen ihres Gottes leben“
  alternative: „im Erbarmen ihres Gottes leben“
  rationale: Die Formulierung kann Gottes Erbarmen als Lebensgrund oder Lebensraum darstellen. „Durch“ liest es vorrangig als tragende Ursache, ohne eine weitergehende dogmatische Erklärung einzuführen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau folgt der antithetischen Struktur des Griechischen. „Darin“ erhält die Mehrdeutigkeit des Pronomens; die zweimalige Gegenüberstellung mit δέ wird durch „aber“ und „doch“ natürlich wiedergegeben.
