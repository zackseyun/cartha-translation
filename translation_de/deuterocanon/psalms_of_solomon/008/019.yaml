  text: They made rough roads smooth before his entrance; they opened gates toward Jerusalem; they crowned her walls.
translation:
  language: de
  text: Sie ebneten raue Wege vor seinem Einzug[a]; sie öffneten Tore nach Jerusalem hin[b]; sie krönten ihre Mauern[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: „von seinem Einzug an“. Die griechische Wendung ist ungewöhnlich; wahrscheinlich bezeichnet sie die Vorbereitung vor seinem Einzug.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „sie öffneten Tore für Jerusalem“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „sie bekränzten ihre Mauern“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡμάλισαν
  choice: ebneten
  rationale: Das Verb bezeichnet das Einebnen oder Glätten. „Ebneten“ ist im Deutschen knapp und bewahrt das konkrete Bild der Wegbereitung.
- source_word: ὁδοὺς τραχείας
  choice: raue Wege
  rationale: „Raue Wege“ gibt Substantiv und Adjektiv unmittelbar wieder und klingt zugleich natürlich; „Wege“ lässt die bildhafte Weite des griechischen ὁδός bestehen.
- source_word: ἀπὸ εἰσόδου αὐτοῦ
  choice: vor seinem Einzug
  rationale: Das griechische ἀπό ist hier ungewöhnlich. „Vor seinem Einzug“ versteht die Wendung räumlich beziehungsweise zeitlich als Vorbereitung auf sein Kommen und entspricht wahrscheinlich einem semitisch geprägten Ausdruck, ohne die Schwierigkeit zu verschweigen.
- source_word: ἤνοιξαν πύλας
  choice: sie öffneten Tore
  rationale: Die artikellose griechische Wendung wird ebenso unbestimmt wiedergegeben. Die schlichte Verbform bewahrt die Abfolge der Handlungen.
- source_word: ἐπὶ Ἰερουσαλήμ
  choice: nach Jerusalem hin
  rationale: Bei den Toren wird ἐπί zunächst direktional verstanden. „Nach Jerusalem hin“ erhält diesen räumlichen Sinn, während eine Fußnote die ebenfalls mögliche Zweck- oder Bezugsangabe nennt.
- source_word: ἐστεφάνωσαν
  choice: krönten
  rationale: Die Grundbedeutung „krönen“ bewahrt das auffällige triumphale Bild. Das konkretere „bekränzen“ bleibt als mögliche Deutung in der Fußnote erhalten.
- source_word: τείχη αὐτῆς
  choice: ihre Mauern
  rationale: Das feminine Pronomen bezieht sich auf Jerusalem. „Ihre Mauern“ erhält die Personifizierung der Stadt.
