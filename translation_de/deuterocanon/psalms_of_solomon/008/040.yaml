base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/008/040.yaml
  text: Praised is the Lord in his judgments in the mouth of the holy ones[d][c][b][a], and blessed is Israel by the Lord forever.
translation:
  language: de
  text: Gepriesen ist der Herr in seinen Gerichten im Mund der Frommen[a], und gesegnet ist Israel vom Herrn in Ewigkeit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Getreuen“. Das griechische Wort bezeichnet Menschen, die Gott ergeben und treu sind.'
    reason: lexical_alternative
lexical_decisions:
- source_word: αἰνετός
  choice: Gepriesen ist
  rationale: Das prädikative Adjektiv eröffnet eine feierliche Aussage. „Gepriesen ist“ wahrt die deklarative Form besser als das optativ klingende „Gepriesen sei“.
- source_word: Κύριος
  choice: der Herr
  rationale: Natürliche deutsche Wiedergabe des griechischen Gottestitels κύριος.
- source_word: ἐν τοῖς κρίμασιν αὐτοῦ
  choice: in seinen Gerichten
  rationale: Die Formulierung bleibt eng am Griechischen und lässt offen, ob κρίματα richterliche Entscheidungen, Urteilssprüche oder Gerichtstaten bezeichnet.
- source_word: ἐν στόματι
  choice: im Mund
  rationale: Bewahrt das konkrete griechische Bild für das ausgesprochene Lob; „auf den Lippen“ wäre idiomatischer, aber weniger formnah.
- source_word: ὁσίων
  choice: der Frommen
  rationale: ὅσιοι bezeichnet hier Menschen, die Gott ergeben und bundestreu leben. „Fromme“ unterscheidet den Ausdruck von ἅγιοι, das eher „Heilige“ entspricht.
- source_word: εὐλογημένος
  choice: gesegnet ist
  rationale: Die prädikative, deklarative Wiedergabe erhält die Parallelität zu „Gepriesen ist“.
- source_word: Ἰσραήλ
  choice: Israel
  rationale: Der Eigenname wird in seiner üblichen deutschen Form wiedergegeben.
- source_word: ὑπὸ Κυρίου
  choice: vom Herrn
  rationale: ὑπό mit Genitiv bezeichnet hier den Herrn als den Handelnden, von dem Israels Segen ausgeht.
- source_word: εἰς τὸν αἰῶνα
  choice: in Ewigkeit
  rationale: Feierliche und im Deutschen natürliche Wiedergabe der unbegrenzten zeitlichen Dauer.
theological_decisions:
- issue: Aussage oder Segenswunsch
  choice: „Gepriesen ist … und gesegnet ist …“ als Feststellung
  alternative: „Gepriesen sei … und gesegnet sei …“ als Wunsch oder Aufforderung
  rationale: Die griechischen prädikativen Adjektive enthalten keinen ausdrücklichen Optativ oder Imperativ. Daher wird die grammatische Offenheit nicht zugunsten einer liturgischen Wunschform aufgelöst.
- issue: Bedeutung von ὅσιοι
  choice: die Frommen
  alternative: die Getreuen; die Heiligen
  rationale: „Die Frommen“ gibt die Gottesergebenheit von ὅσιοι wieder, ohne den Ausdruck mit ἅγιοι gleichzusetzen oder ihn konfessionell einzuengen.
translation_notes:
  register: Feierlich-dichterischer, moderner Standarddeutschstil. Die markierte Wortstellung und das Bild „im Mund“ folgen bewusst der griechischen Parallelstruktur, ohne die Aussage durch eine freiere Umschreibung auszudeuten.
