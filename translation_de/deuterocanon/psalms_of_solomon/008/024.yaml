base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/008/024.yaml
  text: He led away their sons and their daughters[a], whom they had begotten in defilement.
translation:
  language: de
  text: Er führte ihre Söhne und Töchter weg, die sie in Entweihung[a] gezeugt hatten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »in Befleckung«. Das griechische Wort kann Entweihung, Profanierung oder die dadurch verursachte Befleckung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπήγαγεν
  choice: führte … weg
  rationale: Der Aorist von ἀπάγω bezeichnet hier das Wegführen oder Fortschaffen, wahrscheinlich im Zusammenhang einer Verschleppung, ohne die Art der Gewalt näher festzulegen.
- source_word: τοὺς υἱοὺς καὶ τὰς θυγατέρας αὐτῶν
  choice: ihre Söhne und Töchter
  rationale: Die ausdrücklich geschlechtsspezifische Paarung »Söhne und Töchter« wird bewahrt; das wiederholte Possessivpronomen ist im Deutschen nicht nötig.
- source_word: ἃ
  choice: die
  rationale: Das neutrale Relativpronomen im Griechischen bezieht sich zusammenfassend auf Söhne und Töchter; das deutsche »die« ist dafür idiomatisch.
- source_word: ἐγέννησαν
  choice: gezeugt hatten
  rationale: γεννάω kann sowohl zeugen als auch gebären bezeichnen. »Gezeugt hatten« bewahrt hier die genealogische Aussage und legt die Handlung nicht ausschließlich auf die Mütter fest.
- source_word: ἐν βεβηλώσει
  choice: in Entweihung
  rationale: βεβήλωσις bezeichnet Profanierung, Entheiligung oder die daraus folgende Befleckung. »Entweihung« erhält den religiös-moralischen Gehalt und lässt die genaue Art des Verstoßes offen.
theological_decisions:
- issue: Religiös-moralische Bedeutung von ἐν βεβηλώσει
  choice: in Entweihung
  alternative: in Befleckung; unter Entheiligung heiliger Ordnungen
  rationale: Die Formulierung bewertet die Umstände der Zeugung als profanierend oder verunreinigend. »Entweihung« gibt diese kultisch-religiöse Spannung wieder, ohne eine im Vers nicht ausdrücklich genannte konkrete Sünde festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Satzstruktur des Griechischen bleibt erhalten; »führten … weg« ist verständlich und vermeidet eine unnötige Festlegung auf eine bestimmte Form der Verschleppung.
