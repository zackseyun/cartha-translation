lexical_decisions:
- source_word: αἰνετὸς
  choice: Gelobt sei
  rationale: Das Verbaladjektiv bezeichnet den Herrn als des Lobes würdig. Die doxologische Formulierung „Gelobt sei“ gibt diesen Sinn im Deutschen natürlich und würdig wieder, ohne ihn mit „gesegnet“ zu verwechseln.
- source_word: Κύριος
  choice: der Herr
  rationale: Der bestimmte Titel wird entsprechend dem griechischen Artikel mit „der Herr“ wiedergegeben.
- source_word: ὁ κρίνων
  choice: der … richtet
  rationale: Das substantivierte Präsenspartizip wird als Relativsatz wiedergegeben. „Richtet“ bewahrt sowohl den gerichtlichen Sinn als auch den allgemeinen, gegenwärtig-charakteristischen Aspekt.
- source_word: πᾶσαν τὴν γῆν
  choice: die ganze Erde
  rationale: γῆ bezeichnet hier im universalen Zusammenhang am ehesten die Erde, nicht ein bestimmtes Land; πᾶσαν unterstreicht ihren gesamten Umfang.
- source_word: ἐν δικαιοσύνῃ αὐτοῦ
  choice: in seiner Gerechtigkeit
  rationale: Die Formulierung bewahrt die Präposition und die breite moralisch-theologische Bedeutung von δικαιοσύνη; „Gerechtigkeit“ kann hier zugleich die gerechte Art seines Richtens bezeichnen.
