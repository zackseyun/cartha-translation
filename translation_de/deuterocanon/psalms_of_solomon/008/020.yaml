  yaml_path: translation/deuterocanon/psalms_of_solomon/008/020.yaml
  text: He entered like a father into the house of his sons in peace[b][a]; he set his feet with great security.
translation:
  language: de
  text: Wie ein Vater trat er in Frieden in das Haus seiner Söhne ein; er setzte seine Füße sicher und fest auf.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Er fasste sehr sicher Fuß.“ Die Wendung kann einen sicheren, ungehinderten Stand oder eine gefestigte Stellung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσῆλθεν
  choice: zog … ein
  rationale: Das Aoristverb bezeichnet das Hineingehen. „Einziehen“ ist im Deutschen in Verbindung mit einem Haus natürlich und passt zum feierlichen, bildhaften Kontext.
- source_word: ὡς πατὴρ
  choice: wie ein Vater
  rationale: ὡς kennzeichnet hier einen Vergleich. „Wie ein Vater“ bewahrt das Gleichnis, ohne eine tatsächliche Vaterrolle zu behaupten.
- source_word: εἰς οἶκον υἱῶν αὐτοῦ
  choice: in das Haus seiner Söhne
  rationale: Die Wiedergabe erhält sowohl das konkrete Bild des Hauses als auch die Genitivbeziehung des griechischen Textes.
- source_word: μετʼ εἰρήνης
  choice: in Frieden
  rationale: Die feste deutsche Wendung gibt den modalen Sinn der Präpositionalphrase knapp und würdig wieder.
- source_word: ἔστησεν τοὺς πόδας αὐτοῦ
  choice: setzte er seine Füße fest
  rationale: Die Formulierung bewahrt das ausdrückliche Körperbild der „Füße“ und bringt zugleich den Sinn eines festen, sicheren Standes zum Ausdruck.
- source_word: μετὰ ἀσφαλείας πολλῆς
  choice: mit großer Sicherheit
  rationale: Die nominale Konstruktion und die Verstärkung durch πολλῆς werden eng am griechischen Wortlaut wiedergegeben; ἀσφάλεια kann Sicherheit, Gefahrlosigkeit oder festen Halt bezeichnen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung „Wie ein Vater …“ stellt den Vergleich klar heraus. Das konkrete Bild von Haus, Söhnen und Füßen bleibt erhalten; die Fußnote bietet für die zweite Vershälfte eine idiomatischere Deutung an.
