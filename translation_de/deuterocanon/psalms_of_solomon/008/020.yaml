revisions:
- from: Wie ein Vater zog er in Frieden in das Haus seiner Söhne ein; mit großer Sicherheit setzte er seine Füße fest.[a]
  to: Wie ein Vater trat er in Frieden in das Haus seiner Söhne ein; er setzte seine Füße sicher und fest auf.[a]
  rationale: Die Änderungen beseitigen einen möglichen Wohnsitz-Beiklang bei „zog ein“ und die moderne Bedeutungsmehrdeutigkeit von „mit großer Sicherheit“. Das Bild des Eintretens und der Füße sowie die Betonung sicherer Festigkeit bleiben erhalten.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T17:53:41Z'
review_pass:
  verdict: revise
  source_fidelity: Der Entwurf gibt Vergleich, Ziel („Haus seiner Söhne“), Frieden und das ausdrückliche Bild der Füße im Wesentlichen zutreffend wieder. „zog ... ein“ kann im Deutschen jedoch den Beiklang eines dauerhaften Wohnungsbezugs haben, den εἰσῆλθεν nicht verlangt. Außerdem bedeutet „mit großer Sicherheit“ im heutigen Deutsch häufig „mit hoher Gewissheit“ und kann daher die gemeinte sichere bzw. ungehinderte Stellung missverständlich wiedergeben.
  naturalness: Die Revision verwendet mit „trat ... ein“ die natürliche, ereignishafte deutsche Entsprechung für εἰσῆλθεν. „setzte seine Füße sicher und fest auf“ ist idiomatischer als die Verbindung „mit großer Sicherheit setzte ... fest“ und bewahrt das konkrete Körperbild.
  terminology: „Wie ein Vater“, „Haus seiner Söhne“ und „in Frieden“ sind treffend und registergerecht. Die Formulierung „sicher und fest“ gibt ἀσφάλεια πολλή in modernem Deutsch angemessen wieder, ohne die Aussage auf bloße subjektive Gewissheit zu verengen.
  issues:
  - severity: medium
    issue: „zog ... ein“
    rationale: Diese Wendung kann im modernen Deutsch insbesondere bei einem Haus den Sinn haben, dort einzuziehen bzw. Wohnsitz zu nehmen. Das griechische εἰσῆλθεν bezeichnet lediglich das Eintreten.
  - severity: medium
    issue: „mit großer Sicherheit“
    rationale: Die übliche moderne Lesart lautet „mit hoher Gewissheit“. Für μετὰ ἀσφαλείας πολλῆς ist hier sichere, ungehinderte Festigkeit bzw. Sicherheit gemeint; die Formulierung sollte dies klarer ausdrücken.
  revised_text: Wie ein Vater trat er in Frieden in das Haus seiner Söhne ein; er setzte seine Füße sicher und fest auf.[a]
