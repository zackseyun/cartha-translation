  terminology: „Bedrängnis“, „Kriegslärm“, „Trompete“, „Gemetzel“ und „Vernichtung“ sind tragfähige, registergerechte Entsprechungen. „Ertönen ließ“ bewahrt die absichtlich harte, dichterische Konstruktion besser als ein eindeutiges „ankündigte“; die Fußnote benennt die mögliche signalhafte Nuance ausreichend.
