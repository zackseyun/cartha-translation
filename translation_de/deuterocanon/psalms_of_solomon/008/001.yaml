  text: My ear heard distress and the sound of war[a], the sound of a trumpet sounding slaughter and destruction[c][b];
translation:
  language: de
  text: Mein Ohr hörte Bedrängnis[a] und Kriegslärm[b], den Klang einer Trompete, die Gemetzel und Vernichtung ertönen ließ[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Not“ bzw. „Drangsal“.'
    reason: lexical_alternative
  - marker: b
    text: Wörtlich steht „die Stimme/der Laut des Krieges“.
    reason: lexical_alternative
  - marker: c
    text: 'Die griechische Formulierung ist ungewöhnlich; sinngemäß auch: „die Gemetzel und Vernichtung ankündigte“ oder „signalisierte“.'
    reason: source_ambiguity
lexical_decisions:
- source_word: Θλίψιν
  choice: Bedrängnis
  rationale: Das Wort bezeichnet schweren Druck oder große Not. „Bedrängnis“ wahrt die Schwere des Ausdrucks, ohne ihm eine spätere theologische Fachbedeutung aufzuzwingen.
- source_word: φωνὴν πολέμου
  choice: Kriegslärm
  rationale: φωνή bezeichnet hier ein hörbares Phänomen; die kompakte deutsche Wiedergabe „Kriegslärm“ ist idiomatisch und entspricht dem akustischen Zusammenhang.
- source_word: τὸ οὖς μου
  choice: mein Ohr
  rationale: Die konkrete, im Griechischen als Subjekt gesetzte Körpermetapher wird beibehalten, statt sie zum schlichten „ich hörte“ aufzulösen.
- source_word: φωνὴν σάλπιγγος
  choice: den Klang einer Trompete
  rationale: „Klang“ gibt φωνή im Zusammenhang mit einem Signalinstrument natürlich wieder und vermeidet eine unnötige Wiederholung von „Lärm“.
- source_word: ἠχούσης
  choice: ertönen ließ
  rationale: Die Form beschreibt das Tönen der Trompete und ist hier mit „Gemetzel und Vernichtung“ verbunden. Die transitive Wendung bewahrt diese ungewöhnliche Konstruktion, ohne sie eindeutig als bloßes Ankündigen auszulegen.
- source_word: σφαγὴν
  choice: Gemetzel
  rationale: „Gemetzel“ vermittelt die gewaltsame Massentötung und die Härte des griechischen Ausdrucks.
- source_word: ὄλεθρον
  choice: Vernichtung
  rationale: „Vernichtung“ ist ein gewichtiger, direkter Ausdruck für katastrophales Verderben und passt zur Steigerung neben „Gemetzel“.
theological_decisions:
- issue: Bedeutung des Trompetensignals
  choice: die Gemetzel und Vernichtung ertönen ließ
  alternative: die Gemetzel und Vernichtung ankündigte
  rationale: Das Griechische kann im militärischen Zusammenhang ein Signalisieren nahelegen, sagt jedoch wörtlicher, dass die Trompete Gemetzel und Vernichtung ertönen lässt. Die Übersetzung bewahrt diese dichterische Spannung, statt die Funktion ausdrücklich als Ankündigung festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter dichterischer Körpermetapher. „Kriegslärm“ sorgt für natürliche Verständlichkeit; die ungewöhnliche Verbindung von Trompetenklang, Gemetzel und Vernichtung bleibt bewusst spannungsreich.
