  source_fidelity: 'Die Wiedergabe folgt der Abfolge und Bildsprache des Griechischen gut: Das Ohr ist Subjekt; Θλίψις, Kriegsgeräusch, Trompetenklang, σφαγή und ὄλεθρος sind angemessen erfasst. Die eigenartige Verbindung der Trompete mit „Gemetzel und Vernichtung“ wird nicht unnötig zu einer eindeutigen Aussage über ein bloßes Ankündigen aufgelöst.'
