  text: A son with a mother and a father with a daughter were commingling[a][b].
translation:
  language: de
  text: Ein Sohn und seine Mutter sowie ein Vater und seine Tochter vermischten sich.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: „wurden miteinander vermischt“. Gemeint ist hier eine unerlaubte Verbindung engster Familienangehöriger.'
    reason: lexical_alternative
lexical_decisions:
- source_word: υἱὸς
  choice: ein Sohn
  rationale: Der repräsentative Singular bleibt erhalten; der unbestimmte Artikel entspricht natürlichem modernem Deutsch.
- source_word: μετὰ μητρὸς
  choice: mit seiner Mutter
  rationale: μετά mit Genitiv bezeichnet die Gemeinschaft bzw. Verbindung. Das Possessivpronomen macht die im knappen griechischen Ausdruck vorausgesetzte enge Verwandtschaftsbeziehung im Deutschen verständlich.
- source_word: πατὴρ μετὰ θυγατρὸς
  choice: ein Vater mit seiner Tochter
  rationale: Die parallele Verwandtschaftsbezeichnung und die symmetrische Satzstruktur werden bewahrt; die Possessivform ist im Deutschen idiomatisch.
- source_word: συνεφύροντο
  choice: vermischten sich miteinander
  rationale: Das Imperfekt wird als andauerndes bzw. wiederholtes Geschehen wiedergegeben. Die Formulierung bewahrt das Bild des Vermischens und dessen euphemistische Kraft, ohne den sexuellen Sinn expliziter auszudrücken als das griechische Verb.
theological_decisions:
- issue: Soll der inzestuöse sexuelle Sinn im Haupttext ausdrücklich benannt werden?
  choice: Die bildhafte Formulierung „vermischten sich miteinander“ bleibt stehen.
  alternative: „hatten sexuelle Beziehungen miteinander“ oder „trieben miteinander Unzucht“
  rationale: Die genannten Verwandtschaftspaare legen eine unerlaubte sexuelle Verbindung nahe; das Verb selbst bezeichnet jedoch bildhaft ein Vermischen. Die Übersetzung bewahrt diese Spannung und vermeidet eine ausdeutende Verschärfung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die symmetrische, erschütternde Kürze des griechischen Satzes bleibt erhalten; „vermischten sich miteinander“ wirkt bewusst euphemistisch und vermeidet sowohl umgangssprachliche als auch unnötig explizite Sexualsprache.
