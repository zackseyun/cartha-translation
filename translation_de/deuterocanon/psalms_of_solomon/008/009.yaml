  terminology: »Gesetzlose Taten« bewahrt den rechtlich-moralischen Gehalt von παρανομίαι ohne konfessionelle Zuspitzung. »Verborgene Räume« ist für καταγωγαί κρυφίαι hinreichend weit und legt weder eine bestimmte Architektur noch eine bestimmte Art von Versteck fest. Die Fußnote erklärt zutreffend sowohl die wörtlichere substantivische Konstruktion als auch die fehlende Objektangabe.
