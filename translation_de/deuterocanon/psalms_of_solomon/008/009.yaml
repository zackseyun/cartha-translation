  source_fidelity: Die Übersetzung gibt die verblos gesetzte griechische Aussage idiomatisch wieder. »Ihre gesetzlosen Taten« entspricht αἱ παρανομίαι αὐτῶν; »in verborgenen Räumen« wahrt den nicht näher bestimmten, verdeckten Charakter von ἐν καταγώγαις κρυφίοις. »reizten zum Zorn« bringt die im παροργισμός enthaltene Provokations- bzw. Zornkomponente angemessen zur Geltung, ohne ein Objekt wie Gott oder ihn einzutragen, das im griechischen Text nicht genannt ist.
