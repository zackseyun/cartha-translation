  text: Their lawless deeds were in secret chambers[a], in provocation.
translation:
  language: de
  text: Ihre gesetzlosen Taten geschahen in verborgenen Räumen und reizten zum Zorn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »in Provokation« oder »unter Erregung von Zorn«. Im Griechischen wird nicht ausdrücklich gesagt, wer zum Zorn gereizt wird.'
    reason: Die Fußnote bewahrt die substantivische Form und die fehlende ausdrückliche Objektangabe des griechischen Ausdrucks ἐν παροργισμῷ.
lexical_decisions:
- source_word: ἐν καταγώγαις κρυφίοις
  choice: in verborgenen Räumen
  rationale: καταγωγή kann einen Aufenthaltsort, eine Unterkunft oder einen abgeschlossenen Raum bezeichnen; κρυφίοις kennzeichnet ihn als verborgen. »Verborgene Räume« ist natürliches Deutsch und legt die genaue Art des Ortes nicht unnötig fest.
- source_word: αἱ παρανομίαι αὐτῶν
  choice: ihre gesetzlosen Taten
  rationale: παρανομίαι bezeichnet Verstöße gegen Gesetz und Recht. »Gesetzlose Taten« bewahrt sowohl den konkreten Handlungsbezug als auch die rechtlich-moralische Aussage.
- source_word: ἐν παροργισμῷ
  choice: reizten zum Zorn
  rationale: παροργισμός bezeichnet eine Provokation beziehungsweise das Hervorrufen von Zorn. Die verbale Wiedergabe ist im Deutschen verständlicher als »in Provokation« und bewahrt den Bezug auf Zorn, ohne ein im Griechischen nicht ausdrücklich genanntes Objekt einzusetzen.
- source_word: '[implied copula]'
  choice: geschahen
  rationale: Der griechische Satz ist verblos. »Geschahen« verbindet die Taten idiomatisch mit ihrem verborgenen Schauplatz, ohne einen zusätzlichen Handelnden einzuführen.
theological_decisions:
- issue: Nicht genanntes Objekt der Zornesreizung
  choice: Kein Objekt ausdrücklich ergänzen
  alternative: »reizten ihn/Gott zum Zorn«
  rationale: Der Zusammenhang kann Gott als den zum Zorn Gereizten nahelegen, doch im griechischen Vers steht kein ausdrückliches Objekt. Die Übersetzung wahrt diese Offenheit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Verborgene Räume« vermeidet eine unnötig genaue architektonische Festlegung; »reizten zum Zorn« gibt die besondere Zornkomponente von παροργισμός natürlich wieder.
