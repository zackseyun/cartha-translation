  yaml_path: translation/deuterocanon/psalms_of_solomon/008/008.yaml
  text: God exposed their sins before the sun[a]; all the earth came to know the righteous judgments of God.
translation:
  language: de
  text: Gott deckte ihre Sünden vor der Sonne auf; die ganze Erde erkannte die gerechten Urteile Gottes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die gerechten Entscheidungen Gottes“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνεκάλυψεν
  choice: deckte … auf
  rationale: Das Verb bezeichnet das Sichtbarmachen von etwas Verborgenem. „Aufdecken“ bewahrt sowohl das konkrete Bild als auch den Zusammenhang öffentlicher Bloßstellung.
- source_word: ἁμαρτίας
  choice: Sünden
  rationale: Dies ist die direkte und im biblischen Sprachgebrauch geläufige Entsprechung; der Ausdruck wird nicht zu „Verfehlungen“ abgeschwächt.
- source_word: ἐναντίον τοῦ ἡλίου
  choice: vor der Sonne
  rationale: Die wörtliche Bildsprache der öffentlichen Sichtbarkeit bleibt erhalten. Eine rein idiomatische Wiedergabe wie „vor aller Augen“ würde das Bild der Sonne beseitigen.
- source_word: ἔγνω
  choice: erkannte
  rationale: „Erkannte“ gibt den durch Gottes öffentliches Handeln ausgelösten Erkenntnisvorgang natürlich und knapp wieder.
- source_word: πᾶσα ἡ γῆ
  choice: die ganze Erde
  rationale: Der umfassende Horizont des griechischen Ausdrucks bleibt erhalten; „das ganze Land“ würde den Bezug unnötig regional begrenzen.
- source_word: κρίματα
  choice: Gerichtsurteile
  rationale: „Gerichtsurteile“ macht den richterlichen Sinn deutlicher als das im modernen Deutschen mehrdeutige „Gerichte“ und passt zum Handeln Gottes als Richter.
- source_word: δίκαια
  choice: gerecht
  rationale: „Gerecht“ umfasst im Deutschen sowohl die moralische Richtigkeit als auch den gerechten Charakter der richterlichen Entscheidungen Gottes.
theological_decisions:
- issue: Charakterisierung von Gottes κρίματα als δίκαια
  choice: die gerechten Gerichtsurteile Gottes
  alternative: die gerechten Entscheidungen Gottes
  rationale: Die Hauptfassung bewahrt den forensischen Gehalt von κρίματα und die Aussage, dass Gottes Urteile gerecht sind. Die Alternative ist sprachlich weiter, ohne die Gerechtigkeitsaussage abzuschwächen.
translation_notes:
  register: Moderne, würdige Standardsprache mit bewahrter biblischer Bildsprache. Der Satzbau folgt der zweigliedrigen Struktur des Griechischen; das Semikolon gibt die enge Folge von öffentlicher Aufdeckung und weltweiter Erkenntnis wieder.
