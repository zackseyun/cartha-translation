  yaml_path: translation/deuterocanon/psalms_of_solomon/008/039.yaml
  text: May favor be upon us and our children forever[a]; O Lord our Savior[c][b], we shall never again be shaken forever.
translation:
  language: de
  text: Uns und unseren Kindern gilt die Gunst für immer[a]. Herr, unser Retter, wir werden in Ewigkeit nicht mehr ins Wanken geraten[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Griechische enthält in dieser Klausel kein ausdrückliches Verb. Für εὐδοκία ist auch „Wohlgefallen“ möglich.
    reason: grammatical_and_lexical_alternative
  - marker: b
    text: 'Wörtlicher: „Wir werden nicht mehr für alle Zeit ins Wanken geraten“; die griechische Zeitangabe unterstreicht die dauerhafte Beständigkeit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐδοκία
  choice: Gunst
  rationale: „Gunst“ gibt hier wohlwollende Zuwendung oder Anerkennung natürlich und knapp wieder. Anders als „Wohlgefallen“ ist es im heutigen Deutsch unmittelbar verständlich, ohne die göttliche Herkunft durch ein im Griechischen nicht ausdrückliches Possessivpronomen festzulegen.
- source_word: Κύριε
  choice: Herr
  rationale: Der Vokativ von κύριος ist in der direkten Anrede Gottes angemessen mit „Herr“ wiedergegeben.
- source_word: σωτήρ
  choice: Retter
  rationale: σωτήρ bezeichnet den, der rettet oder befreit. „Retter“ wahrt die titelartige Apposition in „Herr, unser Retter“ und klingt im modernen Deutsch natürlich.
- source_word: σαλευθησόμεθα
  choice: ins Wanken geraten
  rationale: Das Futur Passiv bezeichnet ein Erschüttert- oder Destabilisiertwerden. Die deutsche Wendung „ins Wanken geraten“ bewahrt das Bild und ist idiomatisch.
- source_word: τὸν αἰῶνα χρόνον
  choice: in Ewigkeit
  rationale: Die verstärkte Zeitangabe betont dauerhafte Beständigkeit. „In Ewigkeit“ erhält diesen Nachdruck in würdigem, psalmischem Deutsch.
- source_word: ἡμῖν καὶ τοῖς τέκνοις ἡμῶν
  choice: uns und unseren Kindern
  rationale: Die Dative bezeichnen die Begünstigten; τέκνα ist geschlechtsübergreifend als „Kinder“ wiederzugeben.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Gebetsdeutsch mit leicht psalmischem Klang. Die knappe Anrede bleibt ohne ein zusätzliches „O“. Die nicht ausdrücklich genannte Quelle der Gunst wird im Haupttext nicht durch „deine“ ergänzt; die verblose erste Klausel wird als Wunsch formuliert, während die Fußnote die mögliche Feststellung bewahrt.
