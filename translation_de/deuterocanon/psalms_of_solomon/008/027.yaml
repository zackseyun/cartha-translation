  yaml_path: translation/deuterocanon/psalms_of_solomon/008/027.yaml
  text: God was vindicated in his judgments among the nations of the earth,[a]
translation:
  language: de
  text: Gott wurde in seinen Gerichten unter den Völkern der Erde als gerecht erwiesen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Gott wurde in seinen Gerichten unter den Völkern der Erde gerechtfertigt.«'
    reason: Lexikalische Alternative zu ἐδικαίωθη; »gerechtfertigt« ist formaler, kann im heutigen theologischen Sprachgebrauch jedoch missverstanden werden.
lexical_decisions:
- source_word: ἐδικαίωθη
  choice: wurde … als gerecht erwiesen
  rationale: Die passive Form bezeichnet hier nicht, dass Gott erst gerecht gemacht wird, sondern dass sich sein Rechtsein in seinen Gerichten zeigt. Die Formulierung ist im heutigen Deutsch klarer als das missverständliche »wurde gerechtfertigt« und bewahrt zugleich das Passiv des griechischen Textes.
- source_word: κρίμασιν
  choice: Gerichten
  rationale: κρίμασιν bezeichnet richterliche Entscheidungen beziehungsweise vollzogene Gerichte. »Gerichte« erhält den rechtlich-moralischen Sinn und passt zur Aussage, dass Gott darin als gerecht erwiesen wird.
- source_word: ἔθνεσι
  choice: Völkern
  rationale: Gemeint sind hier allgemein die Völker und nicht ausdrücklich die Nichtjuden im Gegensatz zu Israel.
- source_word: τῆς γῆς
  choice: der Erde
  rationale: In Verbindung mit den Völkern ist die umfassende Bedeutung »Erde« wahrscheinlicher als das örtlich begrenzte »Land«.
theological_decisions:
- issue: Wie δικαιόω in Bezug auf Gott wiederzugeben ist
  choice: als gerecht erwiesen
  alternative: gerechtfertigt
  rationale: Die Aussage bedeutet nicht, dass Gott Gerechtigkeit empfängt oder erst gerecht wird, sondern dass seine Gerechtigkeit in seinen Gerichten erkennbar und bestätigt wird. Die gewählte Formulierung vermeidet eine irreführende Übertragung späterer rechtfertigungstheologischer Fachsprache.
- issue: Bedeutung der ersten Präposition ἐν
  choice: in seinen Gerichten
  alternative: durch seine Gerichte
  rationale: »In« bildet die griechische Form bewusst nach und lässt offen, ob die Gerichte eher als Bereich oder als Mittel des Erweises verstanden werden; »durch« wäre im Deutschen möglich, würde die instrumentale Deutung jedoch stärker festlegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung bleibt natürlich und bewahrt zugleich die sachliche, gerichtliche Bildwelt des griechischen Textes. »Als gerecht erwiesen« erläutert den Sinn, ohne die theologische Aussage über Gottes Gerechtigkeit zu erweitern.
