lexical_decisions:
- source_word: ἐποίησαν
  choice: handelten
  rationale: Das breite Verb bedeutet „tun/machen“; mit der folgenden Maßstabsangabe gibt „handelten“ das Verhalten im Deutschen natürlich wieder.
- source_word: κατὰ
  choice: nach
  rationale: „Nach“ bezeichnet hier den Maßstab beziehungsweise die Ausrichtung ihres Handelns und entspricht knapp dem griechischen κατά.
- source_word: τὰς ἀκαθαρσίας αὐτῶν
  choice: ihren Unreinheiten
  rationale: Der Plural bleibt erhalten; „Unreinheiten“ bewahrt zudem die mögliche moralische und kultische Bedeutung, ohne die Wendung auf konkrete Taten einzuengen.
- source_word: καθὼς
  choice: ebenso wie
  rationale: Die Formulierung macht die ausdrückliche Übereinstimmung ihres Verhaltens mit dem ihrer Väter deutlich.
- source_word: οἱ πατέρες αὐτῶν
  choice: ihre Väter
  rationale: „Väter“ ist die direkte Entsprechung und bewahrt die familiär-überlieferungsgeschichtliche Ausdrucksweise; „Vorfahren“ wäre eine mögliche, aber interpretierende Verallgemeinerung.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die markante Mehrzahl „Unreinheiten“ wurde bewusst beibehalten, um die Form und die moralisch-kultische Bedeutungsbreite des griechischen Ausdrucks nicht einzuebnen.
