  yaml_path: translation/deuterocanon/psalms_of_solomon/008/036.yaml
  text: Do not overlook us[a], our God[b], lest the nations swallow us up as though there were no one to redeem.
translation:
  language: de
  text: Sieh nicht über uns hinweg, unser Gott, damit die Völker uns nicht verschlingen, als gäbe es niemanden, der uns erlöst.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »als gäbe es keinen Erlöser« beziehungsweise »als gäbe es niemanden, der uns befreit«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ ὑπερίδῃς
  choice: Sieh nicht über uns hinweg
  rationale: Das Verb bezeichnet ein Hinwegsehen beziehungsweise Nichtbeachten. Die bildhafte Wendung bewahrt die Nähe zum griechischen Ausdruck und klingt als Gebetsbitte im Deutschen natürlich.
- source_word: ὁ θεὸς ἡμῶν
  choice: unser Gott
  rationale: Der Nominativ hat hier anredende Funktion; »unser Gott« gibt die Gebetsanrede schlicht und würdig wieder.
- source_word: ἵνα μὴ
  choice: damit … nicht
  rationale: Die Konstruktion bezeichnet hier einen befürchteten Ausgang. Im heutigen Deutsch ist »damit … nicht« natürlicher als das gehobene »auf dass nicht«.
- source_word: καταπίωσιν
  choice: verschlingen
  rationale: »Verschlingen« bewahrt das konkrete, bedrohliche Bild des griechischen Verbs.
- source_word: ἔθνη
  choice: die Völker
  rationale: Gemeint sind die fremden Völker beziehungsweise Nationen. »Die Völker« ist im Deutschen transparent und vermeidet die stärker traditionsgeprägte Wiedergabe »Heiden«.
- source_word: ὡς μὴ ὄντος λυτρουμένου
  choice: als gäbe es niemanden, der erlöst
  rationale: Die Formulierung gibt das substantivisch gebrauchte Partizip verbal wieder und lässt offen, wer der rettend-erlösende Handelnde ist. Zugleich bleibt die mögliche Bedeutung »befreien« in einer Fußnote sichtbar.
theological_decisions:
- issue: Wiedergabe von λυτρουμένου
  choice: der erlöst
  alternative: der befreit; einen Erlöser
  rationale: Das Verb kann Erlösung, Loskauf oder Befreiung bezeichnen. Die verbale Wiedergabe entspricht dem Partizip besser als ein ausdrücklich titular verstandenes »Erlöser« und legt keine messianische Deutung fest.
translation_notes:
  register: Modernes, würdiges Gebetsdeutsch. Die anschaulichen Bilder des Hinwegsehens und Verschlingens bleiben erhalten; konfessionell geprägte Festlegungen werden vermieden.
