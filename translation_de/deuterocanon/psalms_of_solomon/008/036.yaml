    issue: Unvollständige Verbvalenz in der Schlusswendung
    rationale: Die Formulierung »als gäbe es niemanden, der erlöst« lässt das bei »erlösen« im Deutschen erwartete Objekt offen. Das Griechische setzt das Objekt zwar nicht aus, der vorangehende Kontext identifiziert es aber eindeutig als »uns«. Die Ergänzung verbessert die Lesbarkeit ohne inhaltliche Festlegung.
