review_pass:
  verdict: revise
  source_fidelity: 'Der Entwurf gibt die Satzglieder und Bilder des Griechischen insgesamt zuverlässig wieder: μὴ ὑπερίδῃς als Bitte, ἔθνη als »die Völker«, καταπίωσιν als »verschlingen« und die befürchtete Folge mit »damit … nicht«. Die substantivische Partizipialform λυτρουμένου bezeichnet jedoch einen Handelnden; die Hauptfassung sollte dies im Deutschen mit einem explizit kontextbezogenen Objekt idiomatischer ausdrücken.'
  naturalness: »Sieh nicht über uns hinweg« ist als würdige Gebetsbitte verständlich. Dagegen wirkt »niemanden, der erlöst« im modernen Deutsch unvollständig, da »erlösen« hier gewöhnlich ein Objekt verlangt. »der uns erlöst« ist natürlich und macht das aus dem Kontext erschließbare Objekt sichtbar.
  terminology: »Erlösen« ist für λυτρουμένου möglich, sollte aber nicht als feststehender Titel missverstanden werden. Die Alternativen »Erlöser« und »befreit« bleiben in der Fußnote erhalten. »Unser Gott« und »die Völker« sind angemessen.
  issues:
