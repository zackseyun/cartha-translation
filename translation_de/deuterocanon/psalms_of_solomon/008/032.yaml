  yaml_path: translation/deuterocanon/psalms_of_solomon/008/032.yaml
  text: For you are the God of righteousness[b][a], judging Israel with discipline.
translation:
  language: de
  text: Denn du bist der Gott der Gerechtigkeit[a], der Israel mit erzieherischer Disziplin[b] richtet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „des Rechts“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „durch Zurechtweisung“; auch „mit Züchtigung“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Denn
  rationale: Die Konjunktion begründet die umgebende Aussage oder Bitte; „Denn“ bewahrt diesen Zusammenhang in natürlichem Deutsch.
- source_word: σὺ ὁ θεός
  choice: du bist der Gott
  rationale: Die ausdrückliche Anrede mit σὺ erhält durch „du“ Nachdruck; im Deutschen ist zur natürlichen Prädikation „bist“ zu ergänzen.
- source_word: τῆς δικαιοσύνης
  choice: der Gerechtigkeit
  rationale: „Gerechtigkeit“ umfasst hier sowohl Gottes gerechtes Wesen als auch sein gerechtes Handeln, ohne die Wendung einseitig auf Rechtsprechung zu verengen.
- source_word: κρίνων
  choice: der … richtet
  rationale: Der attributive Relativsatz gibt das präsentische Partizip idiomatisch wieder und bewahrt Gottes fortdauerndes richterliches Handeln.
- source_word: τὸν Ἰσραήλ
  choice: Israel
  rationale: Der Eigenname wird in der üblichen deutschen Form wiedergegeben; der griechische Artikel wird im Deutschen nicht ausgedrückt.
- source_word: ἐν παιδείᾳ
  choice: durch Zurechtweisung
  rationale: παιδεία bezeichnet hier erziehende, korrigierende Disziplin. „Durch“ gibt den wahrscheinlichen instrumentalen Sinn von ἐν wieder, während „Zurechtweisung“ im heutigen Deutsch verständlich bleibt.
theological_decisions:
- issue: Verhältnis von Gottes Gericht und παιδεία
  choice: „durch Zurechtweisung richtet“ lässt das Gericht als erziehend-korrigierendes Handeln erscheinen.
  alternative: „unter Züchtigung richtet“ oder „mit Erziehung richtet“
  rationale: Die Formulierung wahrt die Spannung zwischen richterlichem Urteil und korrigierender Erziehung, ohne das Gericht entweder rein strafend oder bloß pädagogisch zu deuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Zurechtweisung“ ist klarer und weniger missverständlich als das heute oft körperlich verstandene „Züchtigung“; die Alternative wird dennoch in der Fußnote bewahrt.
