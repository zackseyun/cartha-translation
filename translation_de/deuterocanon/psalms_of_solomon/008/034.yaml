  source_fidelity: „Sammle“ gibt den Aoristimperativ συνάγαγε treffend wieder. „die Zerstreuten Israels“ ist eine sprachlich legitime kollektive Entfaltung von τὴν διασπορὰν Ἰσραήλ im Zusammenhang des Sammelns; die wörtlich-abstrakte Lesart bleibt korrekt in der Fußnote dokumentiert. „mit Erbarmen und Güte“ entspricht μετὰ ἐλέους καὶ χρηστότητος ohne zusätzliche Deutung.
