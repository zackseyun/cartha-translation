lexical_decisions:
- source_word: συνάγαγε
  choice: Sammle
  rationale: Der Aorist-Imperativ formuliert eine eindringliche Bitte. „Sammle“ ist im Deutschen natürlich und bewahrt das Motiv der Sammlung, ohne die Art der Rückführung näher festzulegen.
- source_word: τὴν διασπορὰν Ἰσραήλ
  choice: die Zerstreuten Israels
  rationale: διασπορά bezeichnet wörtlich die „Zerstreuung“, kann hier aber kollektiv die verstreut lebenden Angehörigen Israels meinen. „Die Zerstreuten Israels“ gibt diesen Personenbezug klar wieder und bewahrt zugleich das Motiv der Diaspora; die formale Wiedergabe steht in der Fußnote.
- source_word: μετὰ ἐλέους
  choice: mit Erbarmen
  rationale: μετά mit Genitiv bezeichnet hier Begleitung oder Art und Weise. „Mit Erbarmen“ ist würdig, verständlich und entspricht dem biblischen Gebetsregister.
- source_word: χρηστότητος
  choice: Güte
  rationale: χρηστότης kann Güte, Freundlichkeit oder wohlwollendes Handeln bezeichnen. „Güte“ ist knapp, idiomatisch und lässt die ethische wie tätige Bedeutung offen.
theological_decisions:
- issue: Kollektive oder abstrakte Wiedergabe von διασπορά
  choice: die Zerstreuten Israels
  alternative: die Zerstreuung Israels
  rationale: Der Kontext bittet um ein „Sammeln“, dessen naheliegendes Objekt Menschen sind. Dennoch wird die theologisch und geschichtlich gewichtige Substantivform nicht verschwiegen, sondern als wörtliche Alternative in der Fußnote erhalten.
translation_notes:
  register: Modernes, würdevolles Gebetsdeutsch. Die knappe Imperativform und die parallelen Begriffe „Erbarmen und Güte“ bewahren Rhythmus und Feierlichkeit des griechischen Satzes.
