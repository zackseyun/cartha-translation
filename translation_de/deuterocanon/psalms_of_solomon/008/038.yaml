lexical_decisions:
- source_word: ἀφεξόμεθά σου
  choice: wir werden uns nicht von dir fernhalten
  rationale: Das Futur Medium von ἀπέχω/ἀφέχομαι mit dem Genitiv einer Person bezeichnet, dass man sich von jemandem fernhält oder entfernt. Die deutsche Wiedergabe bewahrt den relationalen Sinn und die reflexive Form.
- source_word: χρηστὰ
  choice: gut
  rationale: χρηστός kann »gut«, »gütig« oder »wohltuend« bedeuten. »Gut« ist hier bewusst weit gefasst und lässt die mögliche Nuance göttlicher Güte offen.
- source_word: κρίματά
  choice: Urteile
  rationale: κρίματα bezeichnet Urteile, richterliche Entscheidungen oder Gerichtshandlungen. »Urteile« erhält den rechtlich-theologischen Klang, ohne den Ausdruck auf Erlasse oder Strafgerichte einzuengen.
- source_word: εἰς ἡμᾶς
  choice: über uns
  rationale: εἰς bezeichnet hier die Beziehung beziehungsweise Ausrichtung der Urteile auf die Sprecher. Im Deutschen ist »Urteile über uns« idiomatisch und wahrt den gerichtlichen Bezug; mögliche zielgerichtete oder begünstigende Nuancen werden in der Fußnote kenntlich gemacht.
theological_decisions:
- issue: Bewertung der göttlichen Urteile
  choice: deine Urteile über uns sind gut
  alternative: deine Urteile an uns sind gütig
  rationale: Der Text bekennt die Güte der göttlichen κρίματα, legt aber nicht eindeutig fest, ob χρηστά vor allem ihre sittliche Richtigkeit oder ihre gütige, wohltuende Wirkung bezeichnet. Der Haupttext bewahrt mit »gut« diese Offenheit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit enger Bindung an die griechische Satzstruktur. »Fernhalten« bildet die mediale, relationale Aussage natürlich ab; »Urteile« wahrt den rechtlich-theologischen Ton. Die Fußnoten erhalten die lexikalische Spannweite von ἀφέχομαι, χρηστός und εἰς.
