  text: They omitted no sin that they did not commit[a], beyond the nations.
translation:
  language: de
  text: Sie ließen keine Sünde unbegangen und gingen damit über die Völker hinaus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, enger auf „begingen“ bezogen: „Sie ließen keine Sünde aus, die sie nicht in größerem Maß als die Völker begingen.“'
    reason: Die Schlusswendung ὑπὲρ τὰ ἔθνη kann als Steigerung der ganzen Aussage oder enger mit „begingen“ verbunden verstanden werden.
lexical_decisions:
- source_word: παρέλειπον
  choice: ließen … unbegangen
  rationale: Das Verb bezeichnet hier das Auslassen beziehungsweise Unterlassen. Zusammen mit ἁμαρτίαν und dem verneinten Relativsatz gibt die feste deutsche Wendung „keine Sünde unbegangen lassen“ die umfassende Aussage natürlich wieder.
- source_word: ἁμαρτίαν
  choice: Sünde
  rationale: „Sünde“ entspricht dem moralisch-religiösen Gehalt des griechischen Wortes und dem würdevollen Ton des Zusammenhangs.
- source_word: ἐποίησαν
  choice: begangen
  rationale: Das Verb bedeutet wörtlich „tun“; im Deutschen wird eine Sünde idiomatisch „begangen“.
- source_word: ὑπὲρ τὰ ἔθνη
  choice: gingen … über die Völker hinaus
  rationale: ὑπέρ mit Akkusativ drückt hier ein Überschreiten oder Übertreffen aus. „Völker“ wahrt den allgemeinen Bezug von ἔθνη und vermeidet die stärker religiös markierte Festlegung „Heiden“.
theological_decisions:
- issue: Bezug von ὑπὲρ τὰ ἔθνη
  choice: 'Als zusammenfassende Steigerung der gesamten Aussage wiedergegeben: „und gingen damit über die Völker hinaus“'
  alternative: 'Enger an ἐποίησαν angeschlossen: „die sie nicht mehr als die Völker begingen“'
  rationale: Die griechische Endstellung erlaubt eine gewisse syntaktische Mehrdeutigkeit. Der Haupttext bietet eine natürliche deutsche Fassung, während die Fußnote die formal mögliche engere Anbindung sichtbar hält, ohne sie dogmatisch festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die idiomatische Wendung „keine Sünde unbegangen lassen“ bewahrt die Totalität der griechischen doppelten Verneinung; die Fußnote dokumentiert die syntaktische Mehrdeutigkeit der Schlusswendung.
