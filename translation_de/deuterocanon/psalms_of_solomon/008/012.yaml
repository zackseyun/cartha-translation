base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/008/012.yaml
  text: The holy things of God were being plundered[b][a], as though there were no heir to redeem them.
translation:
  language: de
  text: Die heiligen Dinge Gottes wurden geplündert[b], als gäbe es keinen Erben, der sie auslöste.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „als gäbe es keinen Erben, der auslöste“; ein ausdrückliches Objekt steht im Griechischen nicht.'
    reason: alternative_reading
  - marker: b
    text: „Die heiligen Dinge“ kann auch konkreter als „die heiligen Gegenstände“ oder möglicherweise als „das Heiligtum“ verstanden werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ἅγια τοῦ θεοῦ
  choice: die heiligen Dinge Gottes
  rationale: Der substantivierte neutrale Plural bezeichnet am natürlichsten die Gott gehörenden heiligen Gegenstände beziehungsweise Güter. Die breite Wiedergabe bewahrt die Offenheit des Griechischen, ohne vorschnell auf das Heiligtum als Ort festzulegen.
- source_word: διηρπάζοντο
  choice: wurden geplündert
  rationale: Der Imperfekt gibt einen andauernden Vorgang wieder; das Verb bezeichnet gewaltsames Rauben oder Plündern. Im Deutschen lässt sich der Verlaufsaspekt hier natürlich aus dem Zusammenhang erschließen.
- source_word: ὡς μὴ ὄντος
  choice: als gäbe es keinen
  rationale: 'Die Formulierung gibt den irreal beziehungsweise vergleichend wirkenden Gedanken idiomatisch wieder: Man handelte, als existiere eine solche Person nicht.'
- source_word: κληρονόμου
  choice: Erben
  rationale: Dies ist die unmittelbare Bedeutung des Substantivs und bewahrt die Verbindung von Erbrecht, Zugehörigkeit und Verantwortung, ohne die Rolle erklärend umzudeuten.
- source_word: λυτρουμένου
  choice: der sie auslöste
  rationale: Das Partizip bezeichnet befreiendes Auslösen beziehungsweise Zurückgewinnen. Der deutsche Relativsatz bindet die Handlung klar an den Erben und bewahrt die Erlösungssemantik.
theological_decisions:
- issue: Beziehung des erlösenden Handelns zum Erben
  choice: 'Relativsatz: „der sie auslöste“'
  alternative: „um sie auszulösen“ oder „der sie zurückforderte“
  rationale: Der Genitiv des Partizips stimmt mit „Erben“ überein und beschreibt diesen als den Handelnden. Die Übersetzung hält diese grammatische Beziehung fest, ohne genauer zu bestimmen, ob Auslösung durch Zahlung, Befreiung oder rechtmäßige Rückgewinnung gemeint ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Heilige Dinge“ wahrt die absichtliche begriffliche Breite; „auslösen“ erhält den für λυτρόομαι charakteristischen Gedanken der Befreiung beziehungsweise Rückgewinnung, auch wenn das Wort im heutigen Alltag weniger häufig ist.
