lexical_decisions:
- source_word: φωνὴν
  choice: einen Klang
  rationale: Im Zusammenhang von Psalm Salomos 8,1–4 wird φωνή wiederholt für hörbare Geräusche verwendet. „Klang“ bewahrt diese rhetorische Wiederholung besser als „Stimme“, ohne die Art des Gehörten unnötig festzulegen.
- source_word: ἤκουσα
  choice: Ich hörte
  rationale: Der Aorist bezeichnet hier schlicht die abgeschlossene Wahrnehmung eines Geräuschs.
- source_word: εἰς Ἰερουσαλήμ
  choice: in Jerusalem
  rationale: εἰς kann im späteren Griechisch lokativ gebraucht werden; im Zusammenhang ist „in Jerusalem“ die natürliche und sachlich passende Wiedergabe.
- source_word: πόλιν ἁγιάσματος
  choice: der Stadt der Heiligkeit
  rationale: Die Genitivverbindung wird bewusst formnah wiedergegeben. Sie erhält die mögliche Bedeutung „Stadt der Heiligkeit/des Heiligtums“, statt sie eindeutig zum geläufigen Titel „heilige Stadt“ zu glätten.
theological_decisions:
- issue: Bedeutung von ἁγίασμα in πόλιν ἁγιάσματος
  choice: Stadt der Heiligkeit
  alternative: Stadt des Heiligtums
  rationale: ἁγίασμα kann Heiligkeit beziehungsweise etwas Geheiligtes, besonders ein Heiligtum, bezeichnen. Der Haupttext wahrt die abstrakte Lesart; die konkrete, kultische Möglichkeit bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Klang“ ist im Deutschen etwas markierter als „Geräusch“, trägt aber die wiederholte akustische Leitvokabel des griechischen Zusammenhangs und lässt offen, ob eine Stimme oder ein anderes hörbares Zeichen gemeint ist. Der Genitiv „Stadt der Heiligkeit“ ist bewusst leicht fremdartig, um die genuine Mehrdeutigkeit von ἁγίασμα zu erhalten.
