  text: I heard a voice in Jerusalem[b][a], the holy city.
translation:
  language: de
  text: Ich hörte ein Geräusch in Jerusalem, der Stadt der Heiligkeit.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, konkreter: „der Stadt des Heiligtums“; freier: „der heiligen Stadt“.'
