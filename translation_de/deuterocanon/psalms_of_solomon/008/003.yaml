lexical_decisions:
- source_word: εἶπα τῇ καρδίᾳ μου
  choice: ich sagte in meinem Herzen
  rationale: Wörtlich steht im Griechischen »ich sagte zu meinem Herzen«. Die gewählte Formulierung bewahrt das Bild des Herzens und drückt zugleich in natürlichem Deutsch ein inneres Selbstgespräch aus.
- source_word: Ποῦ ἄρα
  choice: Wo also
  rationale: Ποῦ fragt nach dem Ort; ἄρα verleiht der Frage einen folgernden oder nachdenklichen Ton. »Wo also« gibt beides knapp und natürlich wieder.
- source_word: κρινεῖ
  choice: wird … richten
  rationale: κρίνω bedeutet hier grundsätzlich »richten«. »Verurteilen« wäre enger und würde einen zwingend negativen Urteilsspruch ausdrücken, den das Verb allein nicht festlegt.
- source_word: αὐτόν
  choice: ihn
  rationale: Das maskuline Akkusativpronomen wird unmittelbar und ohne zusätzliche Identifizierung wiedergegeben.
- source_word: ὁ θεός
  choice: Gott
  rationale: Dies ist in diesem Zusammenhang die übliche deutsche Wiedergabe.
