  text: The rulers of the land met him with joy[a]; they said to him, “Blessed is your way. Come[c][b], enter with peace.”
translation:
  language: de
  text: 'Die Herrscher des Landes[c] traten ihm voller Freude entgegen; sie sagten zu ihm: »Willkommen ist dein Weg[a]. Kommt[b], tretet in Frieden ein!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Dein Weg ist erwünscht.“ Auch „Gesegnet ist dein Weg“ ist möglich; wörtlich bezeichnet das griechische Wort etwas Ersehntes oder Willkommenes.'
    reason: lexical_alternative
  - marker: b
    text: Obwohl zuvor nur von „ihm“ die Rede ist, stehen „Kommt“ und „tretet ein“ im Griechischen in der Mehrzahl; offenbar wird nun auch seine Begleitung angesprochen.
    reason: grammatical_clarification
  - marker: c
    text: 'Oder: „der Erde“. Hier ist wahrscheinlich das Land beziehungsweise das betreffende Gebiet gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠπάντησαν
  choice: traten … entgegen
  rationale: Das Verb bezeichnet ein Begegnen, häufig ein Entgegengehen zum Empfang. Die deutsche Wendung gibt die einladende Szene natürlich wieder.
- source_word: οἱ ἄρχοντες
  choice: die Herrscher
  rationale: ἄρχοντες bezeichnet regierende oder führende Personen; „Herrscher“ bewahrt hier die politische Aussagekraft.
- source_word: τῆς γῆς
  choice: des Landes
  rationale: Im Zusammenhang liegt ein bestimmtes Gebiet beziehungsweise Land näher als die gesamte Erde.
- source_word: μετὰ χαρᾶς
  choice: voller Freude
  rationale: Die Formulierung gibt die freudige Art des Empfangs klar und idiomatisch wieder.
- source_word: Εὐκτὴ
  choice: willkommen
  rationale: Das Adjektiv bedeutet „erwünscht“ oder „willkommen“ und bezeichnet den Weg als etwas, das man sich gewünscht hat; „glücklich“ oder „gesegnet“ wäre stärker deutend.
- source_word: ἡ ὁδός σου
  choice: dein Weg
  rationale: „Weg“ bewahrt die Bedeutungsbreite von ὁδός zwischen Route, Reise und Unternehmung.
- source_word: δεῦτε
  choice: Kommt
  rationale: δεῦτε ist eine Aufforderung an mehrere Personen und wird daher mit dem deutschen Plural wiedergegeben.
- source_word: εἰσέλθατε
  choice: tretet … ein
  rationale: Der pluralische Imperativ bedeutet „hineingehen/eintreten“; „eintreten“ passt zum förmlichen Empfang.
- source_word: μετʼ εἰρήνης
  choice: in Frieden
  rationale: Die geläufige Wendung bezeichnet einen friedlichen und sicheren Eintritt; „in Frieden“ ist im Deutschen natürlich und quellennah.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die leicht ungewöhnliche Aussage „Dein Weg ist willkommen“ bewahrt das Bild des griechischen ὁδός und die Bedeutung von εὐκτή, ohne daraus ausdrücklich eine Segensformel oder einen Wunsch nach Erfolg zu machen.
