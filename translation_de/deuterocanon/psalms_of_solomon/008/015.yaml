base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/008/015.yaml
  text: Therefore God mixed for them a spirit of delusion[a]; he made them drink a cup of undiluted wine to drunkenness.
translation:
  language: de
  text: Darum mischte Gott ihnen einen Geist der Verirrung bei[a]; er ließ sie einen Becher unverdünnten Weines trinken, bis zur Trunkenheit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der überlieferte Text hat hier „εὕρε πλανήσεως“, eine im Zusammenhang schwierige Lesart. Die Übersetzung folgt der naheliegenden, durch die griechische Fassung von Jesaja 19,14 gestützten Lesung „πνεῦμα πλανήσεως“: „Geist der Verirrung“.'
    reason: Die Textunsicherheit und die Grundlage der gewählten Lesung werden transparent angegeben, ohne die Emendation als sicher auszugeben.
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Darum
  rationale: Die Wendung zieht aus den vorangehenden Anklagen eine Folgerung; „Darum“ gibt diese Schlussfolgerung knapp und natürlich wieder.
- source_word: ἐκέρασεν αὐτοῖς
  choice: mischte Gott ihnen … bei
  rationale: Das Verb bezeichnet das Mischen, besonders von Getränken. „Beimischen“ bewahrt das konkrete Bild und verbindet es im Deutschen verständlich mit dem Dativ αὐτοῖς.
- source_word: πνεῦμα πλανήσεως (im übermittelten Text offenbar als εὕρε πλανήσεως entstellt)
  choice: einen Geist der Verirrung
  rationale: Die durch Jesaja 19,14 LXX gestützte Lesart πνεῦμα ergibt die ausdrückliche Schriftanspielung. „Verirrung“ lässt bei πλάνη sowohl Irreführung als auch das Abirren im Irrtum anklingen, ohne die Aussage einseitig zu erklären.
- source_word: ἐπότισεν αὐτούς
  choice: er ließ sie … trinken
  rationale: Das Kausativ bedeutet, jemandem zu trinken zu geben beziehungsweise ihn trinken zu lassen. Die gewählte Form klingt gegenwärtig und bewahrt den Charakter eines auferlegten Gerichts.
- source_word: ποτήριον οἴνου ἀκράτου
  choice: einen Becher unverdünnten Weines
  rationale: ἄκρατος bezeichnet Wein, der nicht mit Wasser verdünnt ist. „Unverdünnt“ ist im modernen Deutschen präziser und natürlicher als „ungemischt“.
- source_word: εἰς μέθην
  choice: bis zur Trunkenheit
  rationale: Die Präpositionalphrase bezeichnet hier den erreichten Endzustand beziehungsweise das Ergebnis des Trinkens; die knappe Form erhält den poetischen Ton.
theological_decisions:
- issue: Göttliches Handeln bei der Verirrung
  choice: Die aktive Aussage „Gott … mischte … bei; er ließ sie … trinken“ bleibt erhalten.
  alternative: Eine abschwächende Wiedergabe, nach der Gott die Verirrung lediglich zulässt.
  rationale: Die griechischen Verben stellen Gott ausdrücklich als Handelnden im Gericht dar. Diese theologische Spannung darf nicht durch eine erklärende Abschwächung aufgelöst werden.
- issue: Bedeutungsumfang von πλάνη
  choice: „Verirrung“
  alternative: „Täuschung“, „Irrtum“ oder „Wahn“
  rationale: „Verirrung“ bewahrt die mögliche Spannung zwischen eigenem Abirren und bewirkter Irreführung besser als stärker festlegende Alternativen.
translation_notes:
  register: Moderne, würdige Standardsprache mit bewusst beibehaltenem Bild vom Beimischen und vom unverdünnten Wein. „Bis zur Trunkenheit“ ist leicht gehoben, aber klar und dem poetisch-gerichtlichen Ton angemessen.
