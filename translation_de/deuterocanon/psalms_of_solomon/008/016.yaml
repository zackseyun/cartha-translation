lexical_decisions:
- source_word: ἤγαγεν
  choice: Er brachte
  rationale: Der Aorist von ἄγω bezeichnet hier am natürlichsten, dass jemand herbeigebracht beziehungsweise auf den Schauplatz geführt wird. „Er brachte“ ist knapp und lässt Ziel und genauere Art der Bewegung offen.
- source_word: τὸν ἀπʼ ἐσχάτου τῆς γῆς
  choice: den vom Ende der Erde
  rationale: Die substantivierte Akkusativfügung bezeichnet den Herbeigebrachten. „Vom Ende der Erde“ bewahrt das Bild eines äußersten geografischen Ortes und die knappe Form des Griechischen.
- source_word: παίοντα
  choice: der … zuschlägt
  rationale: Das Präsenspartizip von παίω bezeichnet das Schlagen. „Zuschlägt“ ist im modernen Deutsch natürlich und gibt die kraftvolle, gegen jemanden gerichtete Handlung wieder, ohne das altertümliche „schlägt nieder“ oder „schmettert“ einzutragen.
- source_word: κραταιῶς
  choice: mit Macht
  rationale: Das Adverb bezeichnet kräftiges, machtvolles Handeln. „Mit Macht“ wahrt den gehobenen Ton und verbindet Stärke mit Nachdruck, ohne ausdrücklich Gewalt als solche hinzuzufügen.
