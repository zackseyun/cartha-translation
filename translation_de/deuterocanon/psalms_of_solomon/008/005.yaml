  text: My loins were crushed from the report[c][b][a]; my knees gave way.
translation:
  language: de
  text: Meine Lenden waren zerschmettert von dem, was ich hörte[a]; meine Knie versagten[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „von der Nachricht“ oder „vom Hören“.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: „meine Knie wurden kraftlos“, „meine Knie waren wie gelähmt“ oder „meine Knie brachen ein“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: συντριβὴ
  choice: waren zerschmettert
  rationale: Das Substantiv bezeichnet Zerschmetterung oder Gebrochenheit. Zusammen mit dem unausgedrückten Kopulaverb wird es im Deutschen als prädikative Aussage wiedergegeben; die Vergangenheitsform entspricht dem erzählenden Zusammenhang.
- source_word: ὀσφύς
  choice: Lenden
  rationale: „Lenden“ bewahrt die körperliche Wucht und den biblisch-dichterischen Ton des griechischen Ausdrucks, ohne ihn auf Hüften, Taille oder unteren Rücken einzuengen.
- source_word: ἀπὸ ἀκοῆς
  choice: von dem, was ich hörte
  rationale: Die Wendung bezeichnet den auslösenden Grund. Diese Formulierung ist im modernen Deutschen natürlich und lässt offen, ob ein Bericht, eine Nachricht oder allgemein das Gehörte gemeint ist.
- source_word: παρελύθη
  choice: versagten
  rationale: Das Verb kann Lähmung, Erschlaffung oder körperlichen Zusammenbruch ausdrücken. Bei Knien gibt „versagten“ das körperliche Nachgeben idiomatisch wieder, ohne eine medizinische Lähmung festzulegen.
- source_word: γόνατά
  choice: Knie
  rationale: Direkte und natürliche deutsche Entsprechung.
theological_decisions: []
