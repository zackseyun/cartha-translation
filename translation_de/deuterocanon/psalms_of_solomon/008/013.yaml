base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/008/013.yaml
  text: They trampled the altar of the Lord with every uncleanness[a], and with menstrual blood they defiled the sacrifices like profane meat[c][b];
translation:
  language: de
  text: Sie traten den Altar des Herrn mit aller Unreinheit nieder[a] und entweihten die Opfer mit Menstruationsblut[b] wie gewöhnliches Fleisch.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die überlieferte griechische Anfangsform ist schwierig. Eine gut gestützte Lesart ergibt: „Sie traten den Altar des Herrn nieder.“'
    reason: textual_variant
  - marker: b
    text: 'Formnäher: „mit der Unreinheit des Blutes“; gemeint ist die mit der Menstruation verbundene kultische Unreinheit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπίπουσαν
  choice: sie traten ... nieder
  rationale: Die überlieferte griechische Form ist schwierig. Die gut gestützte Lesetradition und der Zusammenhang einer gewaltsamen Schändung des Altars sprechen für „niedertreten“; die Textunsicherheit wird in einer Fußnote kenntlich gemacht.
- source_word: τὸ θυσιαστήριον Κυρίου
  choice: den Altar des Herrn
  rationale: Direkte und im Deutschen natürliche Wiedergabe der kultischen Wendung.
- source_word: ἀπὸ πάσης ἀκαθαρσίας
  choice: mit jeder Art von Unreinheit
  rationale: „Unreinheit“ wahrt den rituell-kultischen Sinn von ἀκαθαρσία; „jede Art von“ ergibt idiomatisches Deutsch, ohne den umfassenden Ausdruck abzuschwächen.
- source_word: ἐν ἀφέδρῳ αἵματος
  choice: mit Menstruationsblut
  rationale: ἄφεδρος bezeichnet im Sprachgebrauch der Septuaginta spezifisch die mit der Menstruation verbundene Unreinheit. Die konkrete Wiedergabe macht die beabsichtigte kultische Grenzverletzung deutlich; eine formnähere Alternative steht in der Fußnote.
- source_word: ἐμίανιν
  choice: entweihten
  rationale: Im Zusammenhang mit Opfern bezeichnet μιαίνω ihre kultische Verunreinigung. „Entweihen“ ist würdig, verständlich und stellt den Gegensatz zum Heiligen heraus.
- source_word: τὰς θυσίας
  choice: die Opfer
  rationale: Knappes, eindeutiges deutsches Äquivalent im kultischen Zusammenhang.
- source_word: ὡς κρέα βέβηλα
  choice: als wären sie gewöhnliches Fleisch
  rationale: βέβηλος bezeichnet hier den Gegensatz zum Geheiligten, also das Profane oder nicht kultisch abgesonderte. „Gewöhnliches Fleisch“ gibt diesen Heilig–profan-Gegensatz in natürlichem modernem Deutsch wieder.
theological_decisions:
- issue: Spezifität der blutbedingten Unreinheit
  choice: Menstruationsblut im Haupttext
  alternative: blutiger Ausfluss / Unreinheit des Blutes
  rationale: Der technische Septuaginta-Gebrauch von ἄφεδρος legt Menstruation nahe. Diese kultisch bedeutsame Konkretheit soll nicht durch eine allgemeinere Formulierung verdeckt werden; zugleich dokumentiert die Fußnote eine formnähere Wiedergabe.
- issue: Bedeutung von βέβηλα
  choice: gewöhnliches Fleisch
  alternative: profanes Fleisch / entweihtes Fleisch
  rationale: Der Ausdruck kontrastiert Opferfleisch mit nicht geheiligtem Fleisch. „Gewöhnlich“ wahrt diesen kultischen Gegensatz, ohne eine zusätzliche Verunreinigung des Fleisches zu behaupten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die drastische kultische Bildsprache bleibt erhalten. „Gewöhnliches Fleisch“ ist für ein breites Publikum verständlicher als „profanes Fleisch“ und bewahrt dennoch den Gegensatz zwischen heilig und nicht geheiligt.
