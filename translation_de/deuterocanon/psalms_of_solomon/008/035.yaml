base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/008/035.yaml
  text: For your faithfulness is with us[a], and we have stiffened our neck[c][b], and you are our disciplinarian.
translation:
  language: de
  text: Denn deine Treue ist mit uns[a], und wir haben unseren Nacken verhärtet[b], und du bist unser Erzieher.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dein Glaube ist mit uns“.'
    reason: lexical_alternative
  - marker: b
    text: Den Nacken zu verhärten ist ein biblisches Bild dafür, sich hartnäckig zu widersetzen.
    reason: cultural_note
lexical_decisions:
- source_word: πίστις σου
  choice: deine Treue
  rationale: Bei einer Aussage über Gott bezeichnet πίστις hier am ehesten seine verlässliche Treue. Die formal mögliche Wiedergabe „dein Glaube“ bleibt in einer Fußnote erhalten.
- source_word: μεθʼ ἡμῶν
  choice: ist mit uns
  rationale: Die Wendung gibt die räumlich-relationale Aussage des Griechischen knapp wieder, ohne sie deutend zu „begleitet uns“ zu erweitern.
- source_word: ἐσκληρύναμεν τράχηλον ἡμῶν
  choice: wir haben unseren Nacken verhärtet
  rationale: Die Übersetzung bewahrt sowohl den perfektischen Aspekt als auch das biblische Bild der Halsstarrigkeit; der kollektive Singular τράχηλον bleibt erhalten.
- source_word: παιδευτὴς ἡμῶν
  choice: der uns erzieht
  rationale: παιδευτής umfasst Unterweisung, Formung und korrigierende Zucht. Die verbale deutsche Formulierung klingt natürlicher als „unser Erzieher“ und wahrt die Breite des Begriffs.
theological_decisions:
- issue: Bedeutung von πίστις σου in Bezug auf Gott
  choice: deine Treue
  alternative: dein Glaube
  rationale: Im Kontext ist Gottes verlässliche Zuwendung wahrscheinlicher als ein von Gott ausgeübter Glaube. Wegen der echten lexikalischen Möglichkeit wird die formalere Alternative nicht ausgeschlossen, sondern in der Fußnote genannt.
- issue: Verhältnis zwischen Gottes Treue und der Verstockung des Volkes
  choice: wir aber
  alternative: und wir
  rationale: Das betonte ἡμεῖς stellt das Verhalten des Volkes der Treue Gottes gegenüber. „Aber“ macht diesen im Satz angelegten Kontrast verständlich, obwohl καί formal auch schlicht mit „und“ wiedergegeben werden kann.
translation_notes:
  register: Moderne, würdige Standardsprache mit bewusst bewahrtem biblischem Bild. Der Semikolon gliedert die drei eng verbundenen Aussagen, ohne den Zusammenhang aufzulösen.
