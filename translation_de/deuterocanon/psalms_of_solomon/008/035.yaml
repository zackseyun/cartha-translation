    issue: Adversative Wiedergabe von καί
    rationale: „Wir aber“ legt einen Gegensatz fest, der zwar plausibel sein kann, aber durch καί im griechischen Wortlaut nicht ausdrücklich markiert ist. „Und wir“ erhält die mögliche kontrastive Lesart im Kontext, ohne sie grammatisch vorzuschreiben.
  - severity: low
    issue: Umschreibung von παιδευτὴς ἡμῶν
    rationale: „Du bist es, der uns erzieht“ ist verständlich, fügt aber eine hervorgehobene Relativkonstruktion hinzu. „Du bist unser Erzieher“ entspricht der nominalen Prädikation des Griechischen unmittelbarer.
  revised_text: Denn deine Treue ist mit uns[a], und wir haben unseren Nacken verhärtet[b], und du bist unser Erzieher.
