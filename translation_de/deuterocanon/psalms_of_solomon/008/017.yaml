lexical_decisions:
- source_word: ἔκρινεν
  choice: beschloss
  rationale: Der Aorist von κρίνω bezeichnet hier ein Entscheiden oder verbindliches Bestimmen. „Beschloss“ gibt diese richterlich-autoritative Entscheidung im Deutschen natürlich wieder, ohne sie als bloße Beurteilung eines Krieges misszuverstehen.
- source_word: τὸν πόλεμον
  choice: den Krieg
  rationale: πόλεμος bezeichnet gewöhnlich einen Krieg, nicht nur eine einzelne Schlacht. Der bestimmte Artikel wird entsprechend wiedergegeben.
- source_word: ἐπὶ
  choice: gegen
  rationale: Im Zusammenhang mit Krieg bezeichnet ἐπί die feindliche Zielrichtung und wird idiomatisch mit „gegen“ wiedergegeben.
- source_word: Ἰερουσαλήμ
  choice: Jerusalem
  rationale: Übliche deutsche Form des Ortsnamens.
- source_word: γῆν
  choice: Land
  rationale: γῆ kann Land, Gebiet oder Territorium bedeuten. „Land“ bewahrt die Breite des griechischen Ausdrucks.
- source_word: αὐτῆς
  choice: ihr
  rationale: Das feminine Pronomen bezieht sich im Griechischen auf Jerusalem. „Ihr“ bewahrt die biblische Personifizierung der Stadt, auch wenn der Name im Deutschen grammatisch meist sächlich behandelt wird.
