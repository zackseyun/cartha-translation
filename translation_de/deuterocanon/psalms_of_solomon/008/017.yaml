  source_fidelity: „Er beschloss den Krieg gegen Jerusalem und sein Land“ gibt ἔκρινεν τὸν πόλεμον ἐπὶ Ἰερουσαλὴμ καὶ τὴν γῆν αὐτῆς treffend wieder. „Beschloss“ wahrt die entscheidend-verfügende Nuance von κρίνω, ohne das im Deutschen missverständliche „richtete den Krieg“ zu erzeugen. „Land“ bleibt für γῆ angemessen weit.
