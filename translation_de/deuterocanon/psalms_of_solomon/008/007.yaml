  source_fidelity: 'Der Entwurf gibt die Abfolge und die zentralen Begriffe des Griechischen insgesamt zuverlässig wieder: εἶπα, Κατευθύνουσιν, ἀνελογισάμην, κρίματα und die δίκαι-Wortfamilie sind angemessen berücksichtigt. Das wiederholte άρθrige Attribut τοῖς ἀπʼ αἰῶνος bezieht sich jedoch syntaktisch auf τοῖς κρίμασιν αὐτοῦ, nicht auf den Zeitpunkt des Erklärens. Die deutsche Stellung „ich erklärte ... von alters her für gerecht“ lässt diesen Bezug unnötig offen.'
  naturalness: Die Sprache ist überwiegend modernes, würdiges Standarddeutsch. „in seinen Gerichten von alters her“ ist allerdings in dieser Stellung mehrdeutig und weniger flüssig. Ein attributiver Anschluss an „Gerichten“ macht den Satz klar, ohne den gehobenen Registerton aufzugeben.
  terminology: „Gerechtigkeit“ und „gerecht“ bewahren sinnvoll die griechische δίκαι-Wortverbindung. „Gerichte“ ist als umfassende Wiedergabe von κρίματα tragfähig. „für gerecht erklären“ gibt ἐδικαίωσα idiomatisch wieder, ohne die missverständliche Vorstellung zu erzeugen, Gott werde erst gerecht gemacht.
