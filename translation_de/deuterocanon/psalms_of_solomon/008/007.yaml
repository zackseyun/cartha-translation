  yaml_path: translation/deuterocanon/psalms_of_solomon/008/007.yaml
  text: I said[a], “They direct their ways in righteousness.” I considered the judgments of God from the creation of heaven and earth[d][c][b]; I declared God righteous in his judgments from of old.
translation:
  language: de
  text: 'Ich sagte: »Sie richten ihre Wege in Gerechtigkeit aus.« Ich erwog die Gerichte Gottes von der Erschaffung des Himmels und der Erde an; ich erklärte Gott in seinen seit alters her bestehenden Gerichten[a] für gerecht[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »in seinen Gerichten, die von Ewigkeit her sind«.'
    reason: Der Ausdruck ἀπʼ αἰῶνος kann sowohl „seit alters her“ als auch „von Ewigkeit her“ bedeuten.
  - marker: b
    text: 'Wörtlicher auch: »ich rechtfertigte Gott«; gemeint ist, dass der Sprecher Gott als gerecht anerkennt.'
    reason: Die nähere formale Entsprechung zu ἐδικαίωσα ist im heutigen Deutsch missverständlich und kann so klingen, als müsse Gott erst gerecht gemacht oder entschuldigt werden.
lexical_decisions:
- source_word: Κατευθύνουσιν
  choice: sie richten … aus
  rationale: Das Verb bezeichnet das Gerademachen oder rechte Ausrichten eines Weges. Die Formulierung bewahrt das Wegbild und klingt im Deutschen verständlich, ohne die moralische Aussage stärker auszudeuten.
- source_word: ὁδοὺς
  choice: Wege
  rationale: „Wege“ gibt den Plural wieder und bewahrt das verbreitete Bild für Lebensführung und Verhalten.
- source_word: δικαιοσύνῃ
  choice: in Gerechtigkeit
  rationale: Die Wiedergabe erhält die mögliche Bedeutung von moralischer Rechtschaffenheit ebenso wie den Anklang an gerechtes Handeln.
- source_word: ἀνελογισάμην
  choice: ich erwog
  rationale: Das Verb bezeichnet ein bedachtes Überlegen oder Abwägen; „erwog“ ist prägnant und gibt den reflektierenden Sinn wieder.
- source_word: κρίματα
  choice: Gerichte
  rationale: „Gerichte“ kann sowohl Gottes richterliche Entscheidungen als auch sein richtendes Handeln bezeichnen und erhält damit die Weite des griechischen Ausdrucks.
- source_word: ἐδικαίωσα
  choice: ich erklärte … für gerecht
  rationale: Diese Formulierung bezeichnet die Anerkennung, dass Gott im Recht ist, und bewahrt zugleich die sprachliche Verbindung zu δικαιοσύνη („Gerechtigkeit“).
- source_word: τοῖς ἀπʼ αἰῶνος
  choice: Gerichten von alters her
  rationale: „Von alters her“ wahrt den Bezug auf weit zurückliegende Zeit, ohne eindeutig festzulegen, ob der Ausdruck Ewigkeit im strengen Sinn meint.
theological_decisions:
- issue: Bedeutung von ἐδικαίωσα τὸν θεόν
  choice: ich erklärte Gott … für gerecht
  alternative: ich gab Gott recht; ich rechtfertigte Gott
  rationale: Der Sprecher verleiht Gott keine Gerechtigkeit, sondern erkennt Gottes Gerechtigkeit in seinen Gerichten an. Die gewählte Fassung erhält zudem die wiederkehrende Wortwurzel von „Gerechtigkeit“ und „gerecht“.
- issue: Zeitliche Bedeutung und Bezug von τοῖς ἀπʼ αἰῶνος
  choice: in seinen Gerichten von alters her
  alternative: in seinen Gerichten, die von Ewigkeit her sind
  rationale: Der griechische Ausdruck kann hohes Alter oder Ewigkeit bezeichnen. Der Haupttext entscheidet diese Spannung nicht metaphysisch; die alternative Deutung wird in einer Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter Wegmetaphorik und bewusst biblischem, aber verständlichem „Gerichte“. Die wiederkehrende griechische δίκαι-Wortfamilie wird durch „Gerechtigkeit“ und „gerecht“ sichtbar gehalten.
