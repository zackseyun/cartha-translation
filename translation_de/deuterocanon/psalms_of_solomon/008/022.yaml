  yaml_path: translation/deuterocanon/psalms_of_solomon/008/022.yaml
  text: For God led him safely through their wandering[a][b].
translation:
  language: de
  text: Denn Gott führte ihn sicher in ihrem Irrtum.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „in ihrer Verirrung“ oder „in ihrer Täuschung“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤγαγεν
  choice: führte
  rationale: Der Aorist von ἄγω bezeichnet hier am natürlichsten ein Führen oder Geleiten und bewahrt das Bild, dass Gott den Weg des Einzelnen lenkt.
- source_word: μετὰ ἀσφαλείας
  choice: sicher
  rationale: Die Wendung bezeichnet Sicherheit beziehungsweise Unversehrtheit; das Adverb „sicher“ gibt ihre Funktion in natürlichem Deutsch wieder.
- source_word: ἐν τῇ πλανήσει
  choice: durch ihren Irrtum
  rationale: πλάνησις kann Verirrung, Irrtum oder Täuschung bezeichnen. Im Zusammenhang ist ein Irrtum der Gruppe gemeint, durch den der Einzelne sicher hineingelangt; „durch“ gibt diesen begleitenden beziehungsweise mittelbaren Zusammenhang idiomatisch wieder, ohne die lexikalische Mehrdeutigkeit in der Fußnote zu verschweigen.
- source_word: αὐτόν
  choice: ihn
  rationale: Das Pronomen ist maskulin Singular und wird entsprechend wiedergegeben.
- source_word: αὐτῶν
  choice: ihren
  rationale: Der Genitiv Plural bezeichnet die Gruppe im Gegensatz zu dem einzelnen männlichen Bezugswort.
theological_decisions:
- issue: Gottes Führung innerhalb menschlichen Irrens
  choice: Die Aussage, dass Gott ihn sicher führte, bleibt unmittelbar bestehen.
  alternative: Den Satz so umzuformulieren, dass Gott lediglich zuließ, dass er sicher gelangte.
  rationale: Der griechische Text schreibt das Führen ausdrücklich Gott zu; eine Abschwächung zu bloßem Zulassen wäre eine theologische Interpretation, die der Text nicht vorgibt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Denn“ bildet den begründenden Anschluss von ὅτι ab. Die knappe Satzstruktur des Griechischen bleibt erhalten; die Fußnote wahrt die Bedeutungsbreite von πλάνησις und die mögliche engere Wiedergabe der Präposition ἐν.
