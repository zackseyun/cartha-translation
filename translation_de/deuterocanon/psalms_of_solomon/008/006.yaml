translation:
  language: de
  text: Mein Herz fürchtete sich; meine Gebeine wurden erschüttert wie Flachs.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wie Leinen“. Das griechische Wort kann Flachs oder Leinen bezeichnen; das Bild bleibt schwer verständlich.'
