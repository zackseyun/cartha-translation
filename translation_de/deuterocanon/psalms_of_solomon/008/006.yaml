lexical_decisions:
- source_word: ἐφοβήθη
  choice: fürchtete sich
  rationale: Die deponentisch gebrauchte Aoristform bezeichnet hier Furcht; „fürchtete sich“ gibt sie direkt und in natürlichem Deutsch wieder, ohne den Beginn oder die Stärke der Furcht zusätzlich auszudeuten.
- source_word: ἡ καρδία μου
  choice: mein Herz
  rationale: Die konkrete und im biblischen Sprachgebrauch geläufige Körpermetapher bleibt erhalten; eine abstraktere Wiedergabe wie „mein Inneres“ wäre bereits Auslegung.
- source_word: ἐταράχθη
  choice: wurden erschüttert
  rationale: Bei „Gebeinen“ bezeichnet das Verb eine körperlich erfahrbare Erschütterung oder heftige Unruhe. Das Passiv des griechischen Textes bleibt gewahrt.
- source_word: τὰ ὀστᾶ μου
  choice: meine Gebeine
  rationale: „Gebeine“ bewahrt das konkrete körperliche Bild und passt zum würdevollen poetischen Register besser als das im Deutschen hier sachlicher wirkende „Knochen“.
- source_word: ὡς
  choice: wie
  rationale: Die Vergleichspartikel wird im Deutschen unmittelbar mit „wie“ wiedergegeben.
- source_word: λίνον
  choice: Flachs
  rationale: Das Wort kann Flachs oder Leinen bezeichnen. „Flachs“ wahrt am ehesten das Bild des beweglichen Rohmaterials, ohne die schwierige Metapher zu erklären oder zu glätten.
