  yaml_path: translation/deuterocanon/psalms_of_solomon/008/002.yaml
  text: The sound of a great multitude was like a very strong wind[c][b][a], like a storm of great fire sweeping through the wilderness.
translation:
  language: de
  text: Das Geräusch einer großen Menschenmenge[a] war wie ein überaus heftiger Wind, wie ein Sturm gewaltigen Feuers, das durch die Wüste dahingetrieben wurde.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Die Stimme eines großen Volkes.«'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »wie ein Sturm von viel Feuer, das durch die Wüste getragen wurde.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: φωνὴ
  choice: Geräusch
  rationale: Im Zusammenhang bezeichnet φωνή vor allem den hörbaren Eindruck, der von der Menschenmenge ausgeht. »Geräusch« ist im modernen Deutschen natürlicher als »Stimme«, ohne die mögliche Bedeutung »Stimme« auszuschließen.
- source_word: λαοῦ πολλοῦ
  choice: einer großen Menschenmenge
  rationale: λαός bezeichnet kollektiv Menschen beziehungsweise ein Volk; πολλοῦ hebt hier deren große Zahl hervor. »Große Menschenmenge« gibt den konkreten Höreindruck idiomatisch wieder.
- source_word: ἀνέμου πολλοῦ σφόδρα
  choice: ein überaus heftiger Wind
  rationale: πολλοῦ und σφόδρα verstärken gemeinsam das Bild. »Überaus heftig« bewahrt diese starke Intensivierung in natürlichem Deutsch.
- source_word: καταιγὶς
  choice: Sturm
  rationale: »Sturm« ist die klare, gegenwärtige Entsprechung und wahrt die Wucht des Bildes.
- source_word: πυρὸς πολλοῦ
  choice: gewaltigen Feuers
  rationale: Die Wendung bedeutet wörtlich »viel/großes Feuer«. »Gewaltiges Feuer« vermittelt Umfang und Wucht, ohne das Bild zu einer bestimmten Feuererscheinung zu verengen.
- source_word: φερομένου διʼ ἐρήμου
  choice: das durch die Wüste dahingetrieben wurde
  rationale: Das genitivische Partizip φερομένου bezieht sich grammatisch auf πυρός und beschreibt das Feuer als durch die Wüste getragen oder getrieben. Die passive Form wahrt diese Nuance genauer als das freiere »dahinfegte«.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die in Vers 2 durch den Nominativ angezeigte neue selbstständige Aussage wird mit dem ergänzten Prädikat »war« wiedergegeben. Die Bildfolge und die grammatische Zuordnung des dahingetriebenen Feuers bleiben erhalten.
