base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/008/011.yaml
  text: Each one was committing adultery with his neighbor’s wife[a]; they made covenants with one another under oath about these things.
translation:
  language: de
  text: Jeder beging Ehebruch mit der Frau seines Nächsten; über diese Dinge schlossen sie miteinander[a] Vereinbarungen unter Eid.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit ihnen“. Das griechische αὐτοῖς kann wörtlicher in diesem Sinn verstanden werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμοιχῶντο
  choice: beging Ehebruch
  rationale: Das Verb bezeichnet Ehebruch. Das deutsche Präteritum gibt die fortdauernde oder wiederholte Handlung im erzählenden Zusammenhang natürlich wieder, ohne eine zusätzliche Häufigkeitsangabe in den Text einzutragen.
- source_word: ἕκαστος
  choice: Jeder
  rationale: 'Die distributive Einzahl bleibt erhalten: Der Vorwurf gilt jedem Einzelnen in der betreffenden Gruppe.'
- source_word: τὴν γυναῖκα τοῦ πλησίον αὐτοῦ
  choice: mit der Frau seines Nächsten
  rationale: Dies ist eine natürliche und genaue deutsche Wiedergabe der Genitivverbindung im Zusammenhang mit Ehebruch.
- source_word: συνέθεντο
  choice: schlossen
  rationale: Zusammen mit συνθήκας bezeichnet das Verb das Treffen oder Schließen einer Vereinbarung.
- source_word: συνθήκας
  choice: Vereinbarungen
  rationale: Der Plural kann Vereinbarungen, Abmachungen oder Bündnisse bezeichnen. „Vereinbarungen“ bewahrt hier den formellen Charakter, ohne unnötig eine heilsgeschichtliche Bundesbedeutung einzutragen.
- source_word: αὐτοῖς
  choice: miteinander
  rationale: Der Dativ ist im Griechischen knapp und mehrdeutig. „Miteinander“ gibt im Kontext plausibel gegenseitige Absprachen unter den Beschuldigten wieder; die wörtlichere Alternative „mit ihnen“ wird in der Fußnote bewahrt.
- source_word: μετὰ ὅρκου
  choice: unter Eid
  rationale: Die idiomatische deutsche Wendung erhält die feierliche Bekräftigung durch einen Schwur.
- source_word: περὶ τούτων
  choice: über diese Dinge
  rationale: Die enge Wiedergabe verweist auf die zuvor genannten Taten, ohne den Bezug stärker festzulegen, als es das Griechische tut.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur folgt dem griechischen Vorwurf eng; „Vereinbarungen“ vermeidet eine unnötige theologische Aufladung von συνθήκας. Der Fußnotenmarker steht unmittelbar bei der mehrdeutigen Wiedergabe von αὐτοῖς.
