lexical_decisions:
- source_word: ὅσιοι
  choice: die Frommen
  rationale: ὅσιοι bezeichnet Menschen, die durch Frömmigkeit und treue Hinwendung zu Gott gekennzeichnet sind. „Die Frommen“ gibt diesen Sinn im Deutschen genauer wieder als „die Heiligen“, das eher ἅγιοι entsprechen und spätere kirchliche Vorstellungen wecken kann.
- source_word: ἀρνία
  choice: Lämmer
  rationale: ἀρνία bezeichnet ausdrücklich Lämmer und bewahrt das Bild von Unschuld und Schutzlosigkeit.
- source_word: ἐν ἀκακίᾳ
  choice: in Unschuld
  rationale: Die präpositionale Fügung wird als solche bewahrt. „Unschuld“ gibt die Abwesenheit von Bosheit oder Arglist natürlich und würdig wieder.
- source_word: ἐν μέσῳ αὐτῶν
  choice: mitten unter ihnen
  rationale: Die Wendung bewahrt sowohl die räumliche Vorstellung als auch den im Griechischen nicht ausdrücklich bestimmten Bezug von αὐτῶν.
- source_word: verbless clause
  choice: waren
  rationale: Das Griechische enthält hier keine ausdrückliche Kopula. Der historische Erzählzusammenhang, besonders der Aorist des vorangehenden Verses, legt im Deutschen die Vergangenheitsform „waren“ nahe.
