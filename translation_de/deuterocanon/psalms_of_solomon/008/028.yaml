  source_fidelity: „Die Frommen Gottes“ gibt οἱ ὅσιοι treffend als die Gottesfürchtigen bzw. Frommen wieder, ohne die stärker kirchlich geprägte Konnotation von „Heilige“ einzutragen. „waren wie Lämmer in Unschuld“ bildet ὡς ἀρνία ἐν ἀκακίᾳ präzise ab; die ergänzte Vergangenheitsform ist im erzählenden Kontext angemessen. „mitten unter ihnen“ bewahrt sowohl ἐν μέσῳ als auch den im Griechischen offenen Bezug von αὐτῶν.
  naturalness: Der Satz ist knapp, idiomatisch und würdig in modernem Standarddeutsch. „Mitten unter ihnen“ ist hier eine natürliche Entsprechung von „in ihrer Mitte“ und erhält die Bildkraft.
  terminology: „Frommen“, „Lämmer“ und „Unschuld“ sind terminologisch passend. Die Fußnoten bieten sinnvolle, nicht bedeutungsverändernde lexikalische Alternativen.
