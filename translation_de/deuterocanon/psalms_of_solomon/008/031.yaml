base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/008/031.yaml
  text: Our eyes have seen your judgments[a], O God; we have justified your honored name forever[b],
translation:
  language: de
  text: Unsere Augen haben deine Gerichte gesehen[a], Gott; wir haben deinen hochgeehrten Namen[b] für immer als gerecht anerkannt[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Text ist hier schwierig; wörtlich heißt es: „Unsere Augen gaben deine Gerichte.“ Die Übersetzung folgt dem im Zusammenhang naheliegenden Sinn: „Unsere Augen haben deine Gerichte gesehen.“'
    reason: textual_variant
  - marker: b
    text: 'Oder: „ehrenvollen Namen“.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlicher: „haben … gerechtfertigt“. Gemeint ist offenbar, dass die Sprecher die Gerechtigkeit von Gottes Namen anerkannt haben.'
    reason: theological_clarity
lexical_decisions:
- source_word: ἔδοσαν
  choice: haben … gesehen
  rationale: Die überlieferte Form bedeutet wörtlich „gaben“, ergibt aber mit „unsere Augen“ als Subjekt und „deine Gerichte“ als Objekt einen schwierigen Satz. Im Zusammenhang, in dem Gottes Gericht sichtbar geworden ist, gibt „gesehen“ den wahrscheinlich gemeinten Wahrnehmungssinn verständlich wieder; die Textschwierigkeit wird in einer Fußnote offengelegt.
- source_word: τὰ κρίματά σου
  choice: deine Gerichte
  rationale: κρίματα bezeichnet Gottes richterliche Entscheidungen oder sein richtendes Handeln. „Gerichte“ ist eine direkte, im biblischen Sprachgebrauch vertraute und inhaltlich ausreichend offene Wiedergabe.
- source_word: ἐδικαιώσαμεν
  choice: haben … als gerecht anerkannt
  rationale: Das Verb kann formal mit „rechtfertigen“ wiedergegeben werden. Da Gottes Name Objekt ist, bezeichnet es hier jedoch am ehesten die menschliche Anerkennung seiner Gerechtigkeit, nicht ein Gerechtmachen Gottes.
- source_word: τὸ ὄνομά σου τὸ ἔντιμον
  choice: deinen hochgeehrten Namen
  rationale: ἔντιμος bezeichnet etwas, das in hoher Ehre oder Wertschätzung steht. „Hochgeehrt“ bewahrt den ehrerbietigen Ton und klingt im modernen Deutschen natürlich.
- source_word: εἰς αἰῶνας
  choice: für immer
  rationale: Die Wendung bezeichnet unbegrenzte, fortdauernde Zeit; „für immer“ ist dafür die klare und idiomatische deutsche Entsprechung.
theological_decisions:
- issue: Bedeutung von ἐδικαιώσαμεν, wenn Gottes Name das Objekt ist
  choice: „als gerecht anerkannt“
  alternative: „gerechtfertigt“ oder „für gerecht erklärt“
  rationale: Die Formulierung soll ausdrücken, dass die Sprecher aufgrund von Gottes offenbartem Gericht die Gerechtigkeit seines Namens bekennen. Sie soll nicht nahelegen, Menschen würden Gott erst gerecht machen. Die formal mögliche Wiedergabe wird dennoch in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit vertrautem biblischem Wortschatz. Die schwierige griechische Lesart wird nicht in den Haupttext gezwungen, sondern transparent in der Fußnote bewahrt. Das abschließende Komma signalisiert, dass der Satz im poetischen Zusammenhang weitergeführt wird.
