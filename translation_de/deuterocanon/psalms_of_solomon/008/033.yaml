lexical_decisions:
- source_word: ἐπίστρεψον
  choice: Wende … zu
  rationale: Der Aoristimperativ fordert Gott auf, sein Erbarmen den Betenden zuzuwenden. Die deutsche Verbklammer „Wende … zu“ bewahrt das Bewegungsbild und klingt in einem Gebet natürlich.
- source_word: ἔλεός
  choice: Erbarmen
  rationale: ἔλεος bezeichnet barmherzige, mitfühlende Zuwendung. „Erbarmen“ passt zum gehobenen, aber heutigen Gebetsstil und steht in enger sachlicher Beziehung zum folgenden Verb, ohne dessen Aussage völlig zu verdoppeln.
- source_word: ἐφʼ ἡμᾶς
  choice: uns zu
  rationale: ἐπί mit Akkusativ bezeichnet hier die Richtung auf die Betenden hin. „uns zu“ gibt diese Zielrichtung im Deutschen idiomatisch wieder.
- source_word: οἰκτείρησον
  choice: hab Mitleid mit uns
  rationale: Das Verb bezeichnet mitfühlendes Erbarmen oder Mitleid. „Hab Mitleid mit uns“ wahrt die eigene Nuance gegenüber ἔλεος und ist unmittelbar verständlich.
theological_decisions: []
translation_notes:
  register: Moderner, würdevoller Gebetsstil. Die Anrede „o Gott“ folgt ihrer Stellung im Griechischen. „Hab“ ist eine natürliche heutige Imperativform; die Alternative in der Fußnote bewahrt die vertraute liturgische Ausdrucksweise.
