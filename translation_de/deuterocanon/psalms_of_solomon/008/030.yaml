  yaml_path: translation/deuterocanon/psalms_of_solomon/008/030.yaml
  text: Behold now[a], O God, you have shown us your judgment in your righteousness,
translation:
  language: de
  text: Sieh doch, Gott, du hast uns dein Gericht in deiner Gerechtigkeit[a] gezeigt,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in deinem Recht“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ δή
  choice: Sieh doch
  rationale: Die Verbindung ist ein nachdrücklicher Aufmerksamkeitsruf. „Sieh doch“ bewahrt die hervorgehobene, gebetssprachliche Kraft und klingt im modernen Deutschen natürlicher als „Siehe nun“.
- source_word: ὁ θεός
  choice: Gott
  rationale: Der Artikel mit θεός hat hier im Gebetszusammenhang anredende, vokativische Funktion; die bloße Anrede „Gott“ ist im heutigen Deutschen natürlich und würdig.
- source_word: ἔδειξας
  choice: du hast … gezeigt
  rationale: Das Perfekt gibt die abgeschlossene Handlung mit ihrer gegenwärtigen Bedeutung im Gebet natürlich wieder. „Gezeigt“ bleibt näher am Grundverb als das deutendere „offenbart“.
- source_word: τὸ κρῖμά σου
  choice: dein Gericht
  rationale: κρῖμα bezeichnet hier Gottes richterliches Handeln oder Urteil. „Gericht“ bewahrt dieses forensische Gewicht, ohne den Sinn auf einen bestimmten Rechtsspruch zu verengen.
- source_word: ἐν τῇ δικαιοσύνῃ σου
  choice: in deiner Gerechtigkeit
  rationale: Die Präpositionalphrase bezeichnet am ehesten den Bereich oder die Art und Weise von Gottes Handeln. „Gerechtigkeit“ bewahrt sowohl die moralische als auch die richterliche Nuance; „Recht“ bleibt als kontextuell mögliche Alternative erhalten.
theological_decisions:
- issue: Wiedergabe von δικαιοσύνη im Zusammenhang mit Gottes Gericht
  choice: Gerechtigkeit
  alternative: Recht
  rationale: „Gerechtigkeit“ hält die umfassendere moralische und relationale Bedeutung offen, während „Recht“ die richterliche Nuance stärker hervorhebt. Die Hauptfassung bewahrt daher die größere Bedeutungsbreite, und die Alternative wird in einer Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Gebetsdeutsch. Der einleitende Aufmerksamkeitsruf ist bewusst nachdrücklich, aber nicht altertümlich formuliert. Das abschließende Komma folgt dem überlieferten Versanschluss.
