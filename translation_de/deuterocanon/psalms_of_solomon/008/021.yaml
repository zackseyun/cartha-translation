lexical_decisions:
- source_word: κατελάβετο
  choice: nahm … ein
  rationale: Im militärischen Zusammenhang bezeichnet das Verb die Inbesitznahme befestigter Anlagen. „nahm … ein“ bewahrt den Eroberungs- bzw. Besetzungssinn, ohne zwingend einen gewaltsamen Sturm auszudrücken.
- source_word: τὰς πυργοβάρεις
  choice: ihre befestigten Türme
  rationale: Das seltene Wort bezeichnet offenbar Verteidigungsanlagen, wahrscheinlich befestigte Türme oder Zitadellen. „befestigte Türme“ bildet die Bestandteile und den militärischen Kontext verständlich ab.
- source_word: αὐτῆς
  choice: ihre
  rationale: Das feminine Pronomen verweist auf Jerusalem als weiblich vorgestellte Stadt und erhält diese poetische Personifikation.
- source_word: τὸ τεῖχος Ἰερουσαλήμ
  choice: die Mauer Jerusalems
  rationale: Die Formulierung folgt eng dem griechischen Singular und nennt Jerusalem ausdrücklich.
