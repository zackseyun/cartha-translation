base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/008/023.yaml
  text: He destroyed their rulers and everyone wise in counsel[c][b][a]; he poured out the blood of those dwelling in Jerusalem like unclean water.
translation:
  language: de
  text: Er vernichtete ihre Herrscher und jeden, der im Rat weise war,[a] er vergoss das Blut der Bewohner Jerusalems wie Wasser der Unreinheit.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »jeden weisen Ratgeber«; die griechische Wendung ist knapp und kollektiv formuliert.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »wie unreines Wasser«. Wörtlich steht eine Genitivverbindung: »wie Wasser der Unreinheit« beziehungsweise »der Verunreinigung«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπώλεσεν
  choice: vernichtete
  rationale: Das Verb bezeichnet das Ins Verderben oder zur Vernichtung Bringen. »Vernichtete« bewahrt die umfassende Aussage, ohne sie allein auf eine Hinrichtung zu verengen.
- source_word: ἄρχοντας αὐτῶν
  choice: ihre Herrscher
  rationale: Ἄρχοντες sind Personen, die politische oder gesellschaftliche Autorität ausüben; »Herrscher« erhält diesen Sinn.
- source_word: πᾶν σοφὸν ἐν βουλῇ
  choice: jeden, der weise im Rat war
  rationale: Die verdichtete, kollektiv gebrauchte Formulierung wird verständlich wiedergegeben, ohne sie eindeutig auf ein formelles Amt als Ratgeber festzulegen.
- source_word: ἐξέχεεν
  choice: vergoss
  rationale: »Blut vergießen« ist im Deutschen die natürliche und bildkräftige Entsprechung. Der anschließende Vergleich mit Wasser hält das konkrete Bild des Ausgießens gegenwärtig.
- source_word: τῶν οἰκούντων Ἰερουσαλήμ
  choice: der Bewohner Jerusalems
  rationale: Die substantivierte Wiedergabe des Partizips ist natürliches modernes Deutsch und bezeichnet weiterhin diejenigen, die in Jerusalem wohnen.
- source_word: ὡς ὕδωρ ἀκαθαρσίας
  choice: wie Wasser der Unreinheit
  rationale: Die Genitivverbindung wird bewusst bewahrt. So bleibt offen, ob allgemein unreines beziehungsweise verunreinigendes Wasser oder Wasser mit kultischem Bezug gemeint ist.
theological_decisions:
- issue: Möglicher kultischer Gehalt von ἀκαθαρσία
  choice: Wasser der Unreinheit
  alternative: unreines Wasser
  rationale: Die quellensprachliche Genitivkonstruktion kann mehr als bloße Schmutzigkeit ausdrücken. Die Übersetzung bewahrt diese Spannung, ohne einen bestimmten kultischen Ritus ausdrücklich in den Text einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau folgt der parallelen Struktur des Griechischen; ungewohnte Quellensprachlichkeit bleibt nur dort erhalten, wo sie eine echte Bedeutungsnuance trägt.
