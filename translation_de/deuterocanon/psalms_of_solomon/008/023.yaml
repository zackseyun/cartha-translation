  source_fidelity: 'Die Übersetzung gibt die Abfolge und den Sinn des Griechischen zuverlässig wieder: ἀπώλεσεν bleibt mit „vernichtete“ weit genug, ἄρχοντας mit „Herrscher“ politisch treffend, und „vergoss das Blut“ entspricht dem Bild von ἐξέχεεν idiomatisch. „Wasser der Unreinheit“ bewahrt angemessen die Genitivverbindung ὕδωρ ἀκαθαρσίας und ihren möglichen kultischen Unterton, ohne einen konkreten Ritus hineinzulesen.'
  naturalness: Die doppelte Verbindung mit „und“ verbindet im Deutschen zwei selbständige Prädikate etwas schwerfällig. Ein Semikolon bildet die klare Zäsur des griechischen Satzes natürlicher nach. Zudem ist „jeden, der im Rat weise war“ eine etwas flüssigere Stellung als „jeden, der weise im Rat war“, ohne die Bedeutung zu verändern.
  terminology: „Herrscher“, „Bewohner Jerusalems“, „Blut vergoss“ und „Unreinheit“ sind registergerecht und terminologisch tragfähig. Die Fußnoten bilden die beiden echten Übersetzungsfragen korrekt ab. Der kultische Sinn von ἀκαθαρσία wird weder abgeschwächt noch dogmatisch festgelegt.
