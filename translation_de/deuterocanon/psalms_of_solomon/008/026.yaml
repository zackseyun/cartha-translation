translation:
  language: de
  text: Er verunreinigte Jerusalem und die Dinge[a], die dem Namen Gottes geweiht waren[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Geheiligte“ oder „die geweihten Gegenstände“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „die im Namen Gottes geheiligt waren“; auch möglich: „die durch den Namen Gottes geheiligt waren“.'
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: ἐμίανεν
  choice: verunreinigte
  rationale: Das Verb μίανω bezeichnet rituelle oder moralische Verunreinigung. „Verunreinigte“ bewahrt diese Bedeutung, ohne bereits stärker deutend „entweihte“ zu sagen.
- source_word: Ἰερουσαλήμ
  choice: Jerusalem
  rationale: Die im Deutschen übliche Form des Ortsnamens.
- source_word: τὰ ἡγιασμένα
  choice: die Dinge, die … geweiht waren
  rationale: Das substantivierte neutrale Perfektpassiv von ἁγιάζω bezeichnet Dinge, die geheiligt beziehungsweise geweiht worden sind; die Formulierung erhält sowohl den Sachbezug als auch den resultativen passiven Sinn.
- source_word: τῷ ὀνόματι τοῦ θεοῦ
  choice: dem Namen Gottes
  rationale: Der Dativ lässt sich im Zusammenhang als Dativ der Widmung verstehen. „Dem Namen Gottes geweiht“ ist natürliches Deutsch und gibt die Zuordnung oder Hingabe an Gottes Namen wieder, ohne den Namen selbst mit Gott gleichzusetzen.
theological_decisions:
- issue: Funktion des Dativs τῷ ὀνόματι τοῦ θεοῦ
  choice: dem Namen Gottes geweiht
  alternative: im Namen Gottes geheiligt; durch den Namen Gottes geheiligt
  rationale: Der Dativ kann eine Widmung oder Zuordnung ausdrücken, während eine instrumentale beziehungsweise modale Deutung grammatisch nicht völlig ausgeschlossen ist. Der Haupttext folgt der im Kontext plausiblen Widmungsbedeutung; die Fußnote erhält die alternative Lesart.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Verunreinigte“ erhält die kultische und moralische Unreinheitssprache; „dem Namen Gottes geweiht“ klingt idiomatisch und wahrt den Widmungsbezug des Dativs.
