base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/006/008.yaml
  text: And the Lord hears the prayer of everyone in the fear of God[b][a], and the Lord fulfills every request of a soul that hopes in him.
translation:
  language: de
  text: Und der Herr hört das Gebet eines jeden, der Gott fürchtet,[a] und der Herr erfüllt jede Bitte einer Seele, die auf ihn hofft.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Gebet eines jeden in Gottesfurcht“. Auch möglich: „hat das Gebet … erhört“.'
    reason: Das Griechische lautet wörtlich „eines jeden in Gottesfurcht“; der Aorist kann formal auch als vergangene beziehungsweise vollendete Handlung verstanden werden, ist hier aber wahrscheinlich gnomisch.
  - marker: b
    text: 'Oder: „jede Bitte eines Menschen, der auf ihn hofft“. Griechisch: „einer Seele“.'
    reason: ψυχή kann je nach Zusammenhang die Seele oder die ganze Person bezeichnen.
lexical_decisions:
- source_word: Κύριος / ὁ κύριος
  choice: der Herr
  rationale: Die übliche Wiedergabe des göttlichen Titels; die Wiederholung in beiden Satzteilen bewahrt die griechische Hervorhebung.
- source_word: εἰσήκουσεν
  choice: hört
  rationale: Der Aorist ist im Parallelismus mit dem präsentischen ἐπιτελεῖ am besten gnomisch als zeitlos gültige Aussage zu verstehen.
- source_word: παντὸς ἐν φόβῳ θεοῦ
  choice: eines jeden, der in Gottesfurcht lebt
  rationale: Die Formulierung bewahrt das griechische Bild eines Lebens in Gottesfurcht, bleibt aber in modernem Deutsch natürlich und verständlich.
- source_word: αἴτημα
  choice: Bitte
  rationale: „Bitte“ ist im Gebetszusammenhang klar, natürlich und weniger amtlich als „Gesuch“ oder „Petition“.
- source_word: ψυχῆς
  choice: Seele
  rationale: Die konkrete anthropologische und andächtige Ausdrucksweise des griechischen Textes bleibt erhalten; kontextuell kann damit auch die ganze Person gemeint sein.
- source_word: ἐλπιζούσης πρὸς αὐτόν
  choice: die auf ihn hofft
  rationale: „Auf ihn hoffen“ gibt die durch πρὸς ausgedrückte Ausrichtung des Hoffens idiomatisch wieder.
- source_word: ἐπιτελεῖ
  choice: erfüllt
  rationale: Bei einer Bitte bezeichnet „erfüllen“ natürlich und treffend das wirksame Vollenden beziehungsweise Gewähren.
theological_decisions:
- issue: Bedeutung von φόβος θεοῦ
  choice: Gottesfurcht
  alternative: der Gott fürchtet
  rationale: „Gottesfurcht“ bewahrt den traditionsreichen biblischen Begriff und die Zustandsvorstellung der Präpositionalphrase, ohne ihn auf bloße Angst einzuengen.
- issue: Gnömischer oder zeitlich abgeschlossener Sinn von εἰσήκουσεν
  choice: hört
  alternative: hat erhört
  rationale: Der Parallelismus mit dem Präsens „erfüllt“ spricht für eine allgemeingültige Aussage; die Alternative bleibt wegen der Aoristform möglich.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht gehobenem biblischem Klang. Die beiden Nennungen „der Herr“ und der Ausdruck „Seele“ bleiben zur Wahrung von Struktur und Bildwelt des griechischen Textes erhalten.
