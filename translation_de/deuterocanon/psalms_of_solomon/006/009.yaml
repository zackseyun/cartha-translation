  text: Blessed is the Lord[a], who shows mercy to those who love him in truth.
translation:
  language: de
  text: Gepriesen sei der Herr, der denen Barmherzigkeit erweist, die ihn in Wahrheit[a] lieben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
