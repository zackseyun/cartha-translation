lexical_decisions:
- source_word: εὐλογητὸς
  choice: Gepriesen sei
  rationale: Die geläufige deutsche Lobpreisformel gibt das prädikative Adjektiv im doxologischen Zusammenhang natürlich und würdig wieder.
- source_word: Κύριος
  choice: der Herr
  rationale: Entspricht der üblichen Wiedergabe von κύριος als Gottesbezeichnung.
- source_word: ὁ ποιῶν
  choice: der … erweist
  rationale: ποιεῖν ἔλεος ist eine feste Verbindung; „Barmherzigkeit erweisen“ gibt sie im Deutschen idiomatisch und sinngenau wieder.
- source_word: ἔλεος
  choice: Barmherzigkeit
  rationale: Bewahrt sowohl den mitfühlenden als auch den beziehungsbezogenen Gehalt des griechischen Begriffs.
- source_word: τοῖς ἀγαπῶσιν αὐτὸν
  choice: denen, die ihn … lieben
  rationale: Der substantivierte Partizipialausdruck wird als natürlicher deutscher Relativsatz wiedergegeben.
- source_word: ἐν ἀληθείᾳ
  choice: in Wahrheit
  rationale: Die formal nahe Wendung erhält die mögliche Bedeutungsbreite zwischen Wahrhaftigkeit, Aufrichtigkeit und Treue.
