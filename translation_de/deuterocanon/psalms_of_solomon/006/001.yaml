    issue: „Glücklich“ für Μακάριος
    rationale: Obwohl lexikalisch möglich, ist „glücklich“ im modernen Deutsch stärker psychologisch gefärbt. In einem formelhaften Weisheitsspruch gibt „selig“ den begünstigten, als Seligpreisung ausgesprochenen Zustand präziser wieder und entspricht dem Register der Quelle sowie dem englischen audit trail („Blessed“).
  - severity: low
    issue: Die Fußnote zu „bereit“ bietet keine hilfreiche gleichwertige Alternative.
    rationale: „darauf vorbereitet“ ist umständlicher und verschiebt die knappe prädikative Aussage leicht in Richtung eines vorausgehenden Zurüstungsprozesses. Die Übersetzung „bereit“ ist eindeutig; eine Fußnote ist hierfür nicht erforderlich.
  revised_text: Selig ist der Mann, dessen Herz bereit ist, den Namen des Herrn anzurufen.
