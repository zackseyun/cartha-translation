  source_fidelity: 'Die Satzstruktur und die zentralen Begriffe sind zutreffend wiedergegeben: καρδία als „Herz“, ἑτοίμη als „bereit“ und ἐπικαλέσασθαι als „anrufen“. Für Μακάριος ist in diesem Seligpreisungs- und Weisheitsspruch „selig“ jedoch die angemessenere deutsche Entsprechung. „Glücklich“ verengt den Ausdruck im heutigen Sprachgebrauch leichter auf subjektives Empfinden.'
  naturalness: „Selig ist der Mann, dessen Herz bereit ist, den Namen des Herrn anzurufen“ ist idiomatisches, modernes Standarddeutsch mit würdig-biblischem Register. Die Formulierung ist klar und bewahrt die knappe sentenzhafte Syntax des Griechischen.
  terminology: „Der Mann“, „Herz“, „Name des Herrn“ und „anrufen“ sind terminologisch stimmig. „Selig“ wahrt zudem den etablierten Charakter von Μακάριος als Seligpreisung besser als „glücklich“.
