  text: Selig ist der Mann, dessen Herz bereit ist, den Namen des Herrn anzurufen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μακάριος
  choice: Glücklich
  rationale: Leitet eine Seligpreisung ein. „Glücklich“ ist im heutigen Deutsch verständlich und bezeichnet hier nicht bloß ein Gefühl, sondern den begünstigten Zustand des Menschen.
- source_word: ἀνὴρ
  choice: der Mann
  rationale: Gibt die maskuline Singularform des Griechischen formal wieder; sie kann in diesem Weisheitsspruch zugleich repräsentativ gebraucht sein.
- source_word: καρδία
  choice: Herz
  rationale: Bewahrt die biblische Redeweise für die innere Haltung und Bereitschaft des Menschen, ohne sie auf Verstand oder Gefühl zu verengen.
- source_word: ἑτοίμη
  choice: bereit
  rationale: Bezeichnet Bereitschaft beziehungsweise Zurüstung und lässt sowohl die innere Haltung als auch die praktische Bereitschaft offen.
- source_word: ἐπικαλέσασθαι
  choice: anzurufen
  rationale: Gibt den religiösen Sinn wieder, den Herrn bei seinem Namen anzurufen oder sich an ihn zu wenden.
- source_word: τὸ ὄνομα
  choice: den Namen
  rationale: Bewahrt die biblisch und theologisch geprägte Wendung, statt sie als Autorität oder Ruf auszudeuten.
- source_word: Κυρίου
  choice: des Herrn
  rationale: Die traditionelle und kontextuell passende Wiedergabe von κύριος; der bestimmte Artikel ergibt sich im Deutschen natürlich aus der Genitivfügung.
