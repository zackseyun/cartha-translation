lexical_decisions:
- source_word: ἀπὸ ὁράσεως
  choice: vom Anblick
  rationale: Die Präposition ἀπό bezeichnet hier den Anlass oder Auslöser; ὅρασις meint das Gesehene beziehungsweise dessen Anblick. Die Wendung bleibt im Deutschen natürlich, ohne eine besondere Offenbarungsvision vorauszusetzen.
- source_word: πονηρῶν ἐνυπνίων αὐτοῦ
  choice: seiner bösen Träume
  rationale: ἐνύπνιον bezeichnet einen Traum; πονηρός beschreibt ihn als böse, schlimm oder unheilvoll. Das Possessivpronomen αὐτοῦ wird bewahrt.
- source_word: οὐ ταραχθήσεται
  choice: wird er nicht erschreckt werden
  rationale: Das Futur Passiv von ταράσσω bezeichnet ein Erschüttert-, Beunruhigt- oder Erschrecktwerden. „erschreckt werden“ passt besonders zum unmittelbaren Zusammenhang von belastenden Träumen.
