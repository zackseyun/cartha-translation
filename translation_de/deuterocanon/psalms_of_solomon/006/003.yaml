  text: His ways are directed by the Lord, and the works of his hands are guarded by the Lord his God.
translation:
  language: de
  text: Seine Wege werden vom Herrn gerade gemacht, und die Werke seiner Hände sind vom Herrn, seinem Gott, bewahrt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αἱ ὁδοὶ αὐτοῦ
  choice: Seine Wege
  rationale: „Wege“ bewahrt die konkrete Bildsprache und kann zugleich den Lebenswandel oder die Unternehmungen einer Person bezeichnen, ohne den Sinn unnötig einzuengen.
- source_word: κατευθύνονται
  choice: werden ... gerade geführt
  rationale: Die Formulierung erhält das Passiv und verbindet die Bedeutungsanteile des Gerademachens und des rechten Lenkens. Sie gibt die göttliche Einwirkung stärker wieder als ein bloßes „gelingen“.
- source_word: πεφυλαγμένα
  choice: werden ... behütet
  rationale: Das Perfektpartizip bezeichnet einen fortbestehenden Zustand des Bewahrt- oder Beschütztseins. „Behütet“ ist natürlich, würdig und wahrt den Schutzaspekt.
- source_word: ἔργα χειρῶν αὐτοῦ
  choice: die Werke seiner Hände
  rationale: Die Wendung übernimmt die anschauliche griechische Metapher und bleibt in Bezug auf Taten, Arbeit oder Hervorgebrachtes bewusst offen.
- source_word: Κυρίου
  choice: vom Herrn
  rationale: „Herr“ ist die sachgemäße Wiedergabe von κύριος; mit ὑπό wird der Herr in beiden Satzteilen ausdrücklich als Handelnder bezeichnet.
- source_word: Κυρίου θεοῦ αὐτοῦ
  choice: vom Herrn, seinem Gott
  rationale: Die Apposition wird im Deutschen durch ein Komma klar und natürlich wiedergegeben; zugleich bleiben beide Gottesbezeichnungen erhalten.
theological_decisions:
- issue: Göttliches Handeln in den Passivformen
  choice: Die Wege werden vom Herrn gerade geführt, und die Werke werden von ihm behütet.
  alternative: Die Wege gelingen vor dem Herrn, und die Werke stehen lediglich unter allgemeinem Segen.
  rationale: Beide Aussagen nennen mit ὑπό den Herrn ausdrücklich als Urheber. Die Übersetzung bewahrt diese starke Aussage über Gottes lenkendes und schützendes Handeln, ohne sie abzuschwächen.
- issue: Verhältnis von menschlichem Tun und göttlicher Fürsorge
  choice: Die menschlichen „Wege“ und „Werke“ bleiben bestehen, während ihre rechte Führung und Bewahrung Gott zugeschrieben werden.
  alternative: Gott ersetzt oder determiniert ausdrücklich jedes menschliche Handeln.
  rationale: Der griechische Text verbindet menschliches Tun mit göttlicher Einwirkung, erklärt aber nicht näher, wie beides zueinander steht. Diese Spannung wird nicht systematisch aufgelöst.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Satzstruktur und die Wiederholung „vom Herrn“ werden entsprechend dem griechischen Text beibehalten. „Gerade geführt“ ist leicht markiert, aber verständlich und bewahrt sowohl das Bild des geraden Weges als auch die Bedeutung göttlicher Leitung.
