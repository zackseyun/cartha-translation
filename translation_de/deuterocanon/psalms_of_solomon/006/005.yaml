    reason: lexical_alternative
lexical_decisions:
- source_word: ψυχή
  choice: Seele
  rationale: „Seele“ bewahrt die dichterische und personale Weite von ψυχή; je nach Zusammenhang kann das Wort auch „Leben“ oder „Selbst“ bezeichnen.
- source_word: διάβασις
  choice: Durchqueren
  rationale: διάβασις bezeichnet das Hinübergehen beziehungsweise die Durchquerung; mit Flüssen als Ergänzung ist „Durchqueren“ im Deutschen klar und natürlich.
- source_word: σάλος
  choice: Wogen
  rationale: σάλος bezeichnet die unruhige, aufgewühlte Bewegung des Wassers. „Wogen“ gibt dieses bedrohliche Schwanken in gehobenem, aber verständlichem Deutsch wieder.
- source_word: πτοηθήσεται
  choice: wird nicht erschrecken
  rationale: Das passive Futur bezeichnet ein In-Schrecken-Versetztwerden. Das deutsche intransitive „erschrecken“ bewahrt die stärkere Bedeutung gegenüber bloßem Sichfürchten, ohne unnatürlich zu klingen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges poetisches Deutsch. Die parallelen Gefahrenbilder werden mit „beim … und im …“ natürlich verbunden; „Wogen der Meere“ hält die konkrete maritime Unruhe des griechischen Ausdrucks fest.
