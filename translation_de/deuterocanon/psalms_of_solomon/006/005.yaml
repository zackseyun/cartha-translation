review_pass:
  verdict: revise
  source_fidelity: Der Entwurf gibt ψυχή, διάβασις, σάλος und das verneinte Futurpassiv πτοηθήσεται grundsätzlich zutreffend wieder. Allerdings ist „Seine Seele ... wird nicht erschrecken“ im Deutschen potenziell missverständlich, da „erschrecken“ auch transitiv im Sinn von „jemanden erschrecken“ gebraucht wird. Die passive Bedeutung des Griechischen, nämlich nicht in Furcht/Schrecken versetzt zu werden, sollte eindeutig ausgedrückt werden.
  naturalness: „Bei Flussüberquerungen“ ist für διάβασις mit dem Plural ποταμῶν idiomatischer als das substantivierte „beim Durchqueren von Flüssen“. „Beim Wogen der Meere“ bewahrt das poetische Bild und ist natürlich genug für den würdigen Registerton.
  terminology: „Seele“ ist als poetisch-personale Wiedergabe von ψυχή vertretbar; die lexikalischen Alternativen bleiben sinnvoll in der Anmerkung. „In Schrecken geraten“ gibt πτοηθήσεται stärker und eindeutiger wieder als bloßes „sich fürchten“, ohne eine überzogene Deutung einzutragen.
  issues:
  - severity: medium
    issue: „wird ... nicht erschrecken“ ist semantisch und syntaktisch nicht eindeutig.
    rationale: πτοηθήσεται ist ein Futurpassiv („wird nicht in Schrecken versetzt werden / nicht erschreckt werden“). Das deutsche intransitive „erschrecken“ kann zwar „Erschrecken empfinden“ heißen, wird aber auch transitiv verstanden und ist daher hier weniger präzise.
  - severity: low
    issue: „beim Durchqueren von Flüssen“ ist schwerfälliger als nötig.
    rationale: διάβασις bezeichnet den Übergang bzw. die Überquerung. „Bei Flussüberquerungen“ ist knapp, idiomatisch und erhält den generischen Plural der Flüsse.
  revised_text: Seine Seele wird bei Flussüberquerungen und beim Wogen der Meere nicht in Schrecken geraten.[a][b]
