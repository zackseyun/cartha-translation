- from: Seine Seele wird beim Durchqueren von Flüssen und im Wogen der Meere nicht erschrecken.[a][b]
  to: Seine Seele wird bei Flussüberquerungen und beim Wogen der Meere nicht in Schrecken geraten.[a][b]
  rationale: Die Revision verdeutlicht das passive und intensive πτοηθήσεται durch „nicht in Schrecken geraten“ und glättet die Wiedergabe von διάβασις zu „bei Flussüberquerungen“. Das Bild des σάλος bleibt mit „beim Wogen der Meere“ erhalten. Anmerkung b bietet die idiomatischere, aber etwas schwächere deutsche Alternative; sie verändert den Haupttext nicht.
