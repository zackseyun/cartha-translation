  text: His soul will not be terrified at the crossing of rivers and the tossing of seas[a][b][c].
translation:
  language: de
  text: Seine Seele wird bei Flussüberquerungen und beim Wogen der Meere nicht in Schrecken geraten.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sein Leben“ oder „er selbst“ statt „Seine Seele“.'
