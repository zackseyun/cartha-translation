lexical_decisions:
- source_word: ἐν τῷ μνημονεύειν
  choice: Wenn … denkt
  rationale: Die Konstruktion ἐν τῷ mit Infinitiv ist hier am natürlichsten temporal zu verstehen. „Wenn“ gibt dies in aktuellem Deutsch klar wieder.
- source_word: αὐτὸν
  choice: er
  rationale: Das Akkusativpronomen wird als Subjekt des substantivierten Infinitivs verstanden, nicht als dessen Objekt; gemeint ist daher „wenn er … denkt“, nicht „wenn man an ihn denkt“.
- source_word: τὸ ὄνομα Κυρίου
  choice: an den Namen des Herrn
  rationale: μνημονεύω kann im Deutschen idiomatisch mit „an etwas denken“ wiedergegeben werden. „Der Name des Herrn“ bewahrt die biblische Ausdrucksweise und das Gewicht des griechischen Genitivs.
- source_word: σωθήσεται
  choice: wird gerettet werden
  rationale: Das Futur Passiv von σῴζω bezeichnet Rettung beziehungsweise Befreiung. „Gerettet werden“ bewahrt sowohl den Grundsinn als auch die theologische Resonanz.
theological_decisions:
- issue: Bedeutungsumfang von σωθήσεται
  choice: wird gerettet werden
  alternative: wird befreit werden
  rationale: Der Kontext des Einzelverses legt nicht eindeutig fest, ob umfassende Rettung oder konkrete Befreiung gemeint ist. Der Haupttext verwendet den weiteren Ausdruck; die Fußnote erhält die engere Möglichkeit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung bleibt einfach und nahe am Griechischen; „an den Namen … denken“ klingt natürlicher als das schwerere „des Namens … gedenken“.
