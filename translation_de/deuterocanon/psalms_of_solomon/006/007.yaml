  text: With gladness in his heart he sang praise to the name of God[b][a], and he entreated the Lord for all his household.
translation:
  language: de
  text: Mit Freude in seinem Herzen besang er den Namen Gottes und flehte das Angesicht des Herrn für sein ganzes Haus an.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich steht hier die biblische Wendung „das Angesicht des Herrn anflehen“; gemeint ist, den Herrn inständig um seine Zuwendung zu bitten.
    reason: idiom_explanation
lexical_decisions:
- source_word: ἐν εὐφρίᾳ καρδίας αὐτοῦ
  choice: Mit Freude im Herzen
  rationale: Die Wendung gibt die Freude als innere Haltung wieder, bewahrt das biblische Bild des Herzens und klingt im heutigen Deutsch natürlich.
- source_word: ἐξύμνησεν
  choice: besang
  rationale: Das Verb bezeichnet ein preisendes, hymnisches Singen. „Besang“ ist knapper und stärker als das allgemeinere „pries“.
- source_word: τῷ ὀνόματι τοῦ θεοῦ
  choice: den Namen Gottes
  rationale: Der ausdrückliche Bezug auf Gottes Namen bleibt erhalten; der deutsche Akkusativ ergibt sich aus der idiomatischen Konstruktion mit „besingen“.
- source_word: ἐδεήθη
  choice: flehte … an
  rationale: Das Verb bezeichnet eine eindringliche Bitte und regiert hier den Genitiv der angerufenen Person beziehungsweise des idiomatisch genannten Angesichts.
- source_word: τοῦ προσώπου Κυρίου
  choice: das Angesicht des Herrn
  rationale: Die ungewöhnliche, semitisch geprägte Formulierung des griechischen Textes bleibt sichtbar, statt in eine bloß örtliche Wendung wie „vor dem Herrn“ umgedeutet zu werden.
- source_word: περὶ παντὸς τοῦ οἴκου αὐτοῦ
  choice: für sein ganzes Haus
  rationale: „Haus“ bewahrt den biblischen Sammelbegriff für Familie und Hausgemeinschaft; „für“ gibt den Gegenstand seiner Fürbitte natürlich wieder.
theological_decisions:
- issue: Die Wendung τοῦ προσώπου Κυρίου als Gegenstand des Flehens
  choice: das Angesicht des Herrn anflehen
  alternative: den Herrn anflehen / vor dem Herrn flehen
  rationale: Der Genitiv hängt syntaktisch von ἐδεήθη ab und ist nicht bloß eine Ortsangabe. Die gewählte Fassung erhält das konkrete biblische Bild und erklärt seine Bedeutung in einer Fußnote, ohne es stillschweigend aufzulösen.
translation_notes:
  register: Gehobenes, aber verständliches modernes Standarddeutsch. Die Wortstellung wahrt den poetisch-biblischen Ton; „Angesicht“ ist bewusst als markiertes biblisches Wort beibehalten und durch die Fußnote erläutert.
