    rationale: αὐτοῦ bezieht sich ausdrücklich auf καρδίας. Zwar kann Deutsch den Besitz im Kontext implizieren, doch „in seinem Herzen“ ist ebenso natürlich und genauer.
  - severity: low
    issue: Die Stellung von „für sein ganzes Haus“ vor „das Angesicht des Herrn“ erschwert leicht die ohnehin markierte Rektion.
    rationale: Die Stellung „das Angesicht des Herrn für sein ganzes Haus anflehen“ lässt das griechische Objekt und den Gegenstand der Bitte klarer hervortreten.
  revised_text: Mit Freude in seinem Herzen besang er den Namen Gottes und flehte das Angesicht des Herrn für sein ganzes Haus an.[a]
