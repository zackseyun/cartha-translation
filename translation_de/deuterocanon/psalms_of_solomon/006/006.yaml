lexical_decisions:
- source_word: ἐξανέστη ἐξ ὕπνου αὐτοῦ
  choice: Er erwachte aus seinem Schlaf
  rationale: Die Wendung bezeichnet hier das Aufstehen beziehungsweise Erwachen aus dem Schlaf. „Er erwachte“ gibt den gemeinten Vorgang im modernen Deutschen natürlich wieder, ohne ein körperliches Sich-Aufrichten unnötig hervorzuheben.
- source_word: ἐυλόγησεν
  choice: pries
  rationale: εὐλογέω kann „segnen“ oder, wenn Gott beziehungsweise sein Name Gegenstand ist, „preisen“ bedeuten. Im Deutschen ist „den Namen des Herrn preisen“ idiomatisch und sachgerecht.
- source_word: τῷ ὀνόματι Κυρίου
  choice: den Namen des Herrn
  rationale: Obwohl die überlieferte Form den Dativ zeigt, verlangt der Sinn bei εὐλογέω hier das Lob des Namens; die deutsche Akkusativkonstruktion gibt diesen Bezug klar wieder. Κύριος wird traditionsgemäß und würdig mit „der Herr“ wiedergegeben.
