  text: God made every fragrant tree spring up for them[a], so that Israel might pass through in the visitation of the glory of their God.
translation:
  language: de
  text: Gott ließ für sie jeden duftenden Baum wachsen, damit Israel bei der Erscheinung der Herrlichkeit ihres Gottes hindurchziehe[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »bei der Aufsicht/Fürsorge der Herrlichkeit ihres Gottes«; wörtlicher: »bei der Heimsuchung der Herrlichkeit ihres Gottes«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶν ξύλον
  choice: jeden … Baum
  rationale: Das singularische πᾶν ist distributiv zu verstehen; ξύλον bezeichnet im Zusammenhang mit dem Wachsen einen Baum.
- source_word: εὐωδίας
  choice: duftenden
  rationale: Der Genitiv beschreibt die Bäume als wohlriechend; „duftend“ ist natürliches, gegenwärtiges Deutsch.
- source_word: ἀνέτειλεν
  choice: ließ … wachsen
  rationale: Die Wendung bewahrt sowohl das pflanzliche Bild des Hervorsprießens als auch Gott als den Handelnden.
- source_word: παρέλθῃ
  choice: hindurchziehe
  rationale: Das Verb bezeichnet hier Israels Bewegung durch den von Gott bereiteten Raum; „hindurchziehen“ passt zum kollektiven und poetischen Zusammenhang.
- source_word: ἐπισκοπῇ
  choice: Heimsuchung
  rationale: Der Ausdruck kann eine göttliche Visitation, Aufsicht oder fürsorgliche Zuwendung bezeichnen. „Heimsuchung“ wahrt den erhöhten biblischen Ton und die Vorstellung eines wirksamen göttlichen Kommens, ohne die anderen Bedeutungen im Fußnotentext zu verschweigen.
- source_word: δόξης
  choice: Herrlichkeit
  rationale: „Herrlichkeit“ ist die etablierte biblische Wiedergabe und entspricht dem göttlichen Kontext.
theological_decisions:
- issue: Bedeutung von ἐν ἐπισκοπῇ δόξης θεοῦ αὐτῶν
  choice: unter der Heimsuchung durch die Herrlichkeit ihres Gottes
  alternative: unter der Aufsicht oder Fürsorge der Herrlichkeit ihres Gottes
  rationale: ἐπισκοπή umfasst Visitation, Aufsicht und fürsorgliche Zuwendung. Der Haupttext gibt das aktive göttliche Nahen wieder; die Fußnote bewahrt die echte lexikalische Mehrdeutigkeit. „Ihres Gottes“ folgt dem griechischen Plural αὐτῶν und versteht Israel kollektiv als das Volk.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit poetisch-biblischem Ton. Der Konjunktiv „hindurchziehe“ entspricht dem finalen ἵνα-Satz; „Heimsuchung“ ist bewusst gehoben, während die Fußnote mögliche gegenwärtigere Bedeutungsnuancen nennt.
