  verdict: revise
  source_fidelity: Der erste Satzteil gibt πᾶν ξύλον εὐωδίας ἀνέτειλεν αὐτοῖς ὁ θεός sachgerecht wieder. Im Schlussteil ist ἐν ἐπισκοπῇ δόξης θεοῦ αὐτῶν eine bewusst dichte Genitivverbindung. Die Fassung „unter der Heimsuchung durch die Herrlichkeit“ macht die Herrlichkeit unnötig eindeutig zum Handelnden und verschiebt damit die offene syntaktisch-semantische Beziehung.
  naturalness: „Unter der Heimsuchung“ ist im heutigen Deutsch wenig natürlich und „Heimsuchung“ ist überwiegend negativ konnotiert. „Bei der Erscheinung der Herrlichkeit ihres Gottes“ ist würdig, verständlich und im Kontext der göttlichen Gegenwart idiomatischer.
  terminology: „duftenden Baum“, „wachsen ließ“, „hindurchziehe“ und „Herrlichkeit“ sind angemessen. „Erscheinung“ gibt hier die visierende/manifestierende Seite von ἐπισκοπή wieder; die Fußnote wahrt die Alternativen Aufsicht und Fürsorge.
  issues:
