    issue: „unter der Heimsuchung durch die Herrlichkeit ihres Gottes“
    rationale: Die Präposition „durch“ legt eine im Griechischen nicht ausdrücklich bestimmte agentive Beziehung fest. Zudem evoziert „Heimsuchung“ im modernen Deutsch gewöhnlich Unheil und ist daher für die hier positive, vorbereitende Bildsprache missverständlich.
