  text: Blast in Zion die Trompete, zum Signal für die Heiligen[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Blast in Zion die Trompete, mit einer Signaltrompete der Heiligen.“ Der knappe griechische Genitiv kann unterschiedlich zugeordnet werden.'
