lexical_decisions:
- source_word: Σαλπίσατε
  choice: Blast … die Trompete
  rationale: Der Aorist-Imperativ Plural von σαλπίζω fordert zu einem öffentlichen Trompetenstoß auf. Die deutsche Wendung bewahrt Aufforderung und Bildhaftigkeit.
- source_word: ἐν Σιὼν
  choice: in Zion
  rationale: Das erste ἐν ist lokal zu verstehen und bezeichnet Zion als Ort des öffentlichen Signals.
- source_word: ἐν σάλπιγγι
  choice: die Trompete
  rationale: Das zweite ἐν bezeichnet das Instrument. Im Deutschen wird die instrumentale Bedeutung idiomatisch durch die Verbindung „die Trompete blasen“ ausgedrückt, ohne ein zusätzliches „mit“.
- source_word: σημασίας
  choice: zum Signal
  rationale: σημασία bezeichnet ein Zeichen oder Signal. „Zum Signal“ gibt die Funktion des Trompetenstoßes klar wieder, ohne sie als militärischen Alarm festzulegen.
- source_word: ἁγίων
  choice: für die Heiligen
  rationale: Der substantivierte Genitiv Plural bezeichnet nicht näher bestimmte „Heilige“. Die Wiedergabe als Zielgruppe des Signals entspricht dem wahrscheinlichen objektiven Genitiv, während die Fußnote die formal mögliche Zuordnung offenhält.
theological_decisions:
- issue: Bezug und grammatische Funktion von ἁγίων
  choice: '„für die Heiligen“ versteht den Genitiv als objektiv: Das Signal gilt den Heiligen.'
  alternative: „Signal der Heiligen“ kann Zugehörigkeit oder Urheberschaft ausdrücken; außerdem bleibt offen, ob mit den „Heiligen“ geweihte Gottesdienstteilnehmer, Priester oder das heilige Volk allgemein gemeint sind.
  rationale: Der unmittelbare Ausdruck ist knapp, doch der Aufrufcharakter und der weitere Kontext legen ein Sammelsignal für die Heiligen nahe. Die Übersetzung grenzt deren Identität nicht näher ein; die alternative Genitivdeutung wird in der Fußnote bewahrt.
translation_notes:
  register: Würdevolle, gegenwärtige Standardsprache. „Blast … die Trompete“ ist unmittelbar und öffentlich-liturgisch gefärbt. Die Wiederaufnahme von „Trompete“ ist im Deutschen idiomatisch in das Verbgefüge integriert; die abschließende Interpunktion folgt dem fortlaufenden Satz des Ausgangstextes.
