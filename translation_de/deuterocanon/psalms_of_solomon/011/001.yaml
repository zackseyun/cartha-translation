  source_fidelity: Die Übersetzung gibt den imperativischen Plural Σαλπίσατε angemessen wieder und bewahrt sowohl den Ort („in Zion“) als auch die instrumentale Trompete. „zum Signal für die Heiligen“ gibt die plausible objektive Auffassung der kompakten Genitivverbindung σημασίας ἁγίων wieder, ohne die Identität der Heiligen näher festzulegen. Die Fußnote hält die andere syntaktische Zuordnung ausdrücklich offen.
