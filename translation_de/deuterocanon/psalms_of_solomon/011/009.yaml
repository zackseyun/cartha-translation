lexical_decisions:
- source_word: ποιήσαι
  choice: tue
  rationale: Der Aorist-Optativ drückt hier einen Wunsch aus. „Tue“ bleibt nahe am allgemeinen Sinn von ποιέω; „erfülle“ wäre möglich, würde die Aussage aber stärker als Verheißung deuten.
- source_word: ἐλάλησεν ἐπὶ
  choice: über … gesagt hat
  rationale: ἐπί mit Akkusativ bezeichnet hier den Bezug der Rede auf Israel und Jerusalem. Die Formulierung ist im Deutschen natürlich, ohne einen spezifisch prophetischen Sinn festzulegen.
- source_word: ἀναστήσαι
  choice: richte … auf
  rationale: „Aufrichten“ bewahrt das Bild des griechischen Verbs und lässt offen, ob Wiederherstellung, erneute Festigung oder Erhöhung gemeint ist.
- source_word: ἐν ὀνόματι δόξης αὐτοῦ
  choice: im Namen seiner Herrlichkeit
  rationale: Die formal verdichtete Wendung erhält sowohl „Name“ als auch „Herrlichkeit“, statt sie zu „herrlicher Name“ zusammenzuziehen.
- source_word: ἔλεος
  choice: Barmherzigkeit
  rationale: „Barmherzigkeit“ ist eine klare und würdige Wiedergabe, ohne zusätzliche bundestheologische Bedeutung einzutragen.
- source_word: εἰς τὸν αἰῶνα καὶ ἔτι
  choice: für immer und darüber hinaus
  rationale: Die Wiedergabe bildet sowohl εἰς τὸν αἰῶνα als auch das verstärkende καὶ ἔτι ab und bewahrt damit die auffällige Erweiterung über „für immer“ hinaus.
theological_decisions:
- issue: Sinn des Aufrichtens Israels
  choice: „richte Israel auf“ ohne nähere Festlegung
  alternative: „stelle Israel wieder her“ oder „lass Israel auferstehen“
  rationale: ἀναστήσαι kann Wiederherstellung, Aufrichtung oder ein Aufstehen bezeichnen. Der Kontext zwingt weder zu einer ausschließlich politischen Wiederherstellung noch zu einer Auferstehungsdeutung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die beiden Optative werden als Wunschsätze mit Konjunktiv I wiedergegeben. Die verdichtete Formulierung „im Namen seiner Herrlichkeit“ und die offene Bildsprache von ἀναστήσαι bleiben bewusst erhalten.
