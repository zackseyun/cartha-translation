  text: May the Lord do what he has spoken concerning Israel and Jerusalem[a]; may the Lord raise up Israel in the name of his glory[d][c][b]. The Lord’s mercy be upon Israel forever and ever.
translation:
  language: de
  text: Der Herr tue, was er über Israel und Jerusalem gesagt hat[a]. Der Herr richte Israel auf[b] im Namen seiner Herrlichkeit. Die Barmherzigkeit des Herrn sei über Israel für immer und darüber hinaus[c].
  philosophy: optimal-equivalence
