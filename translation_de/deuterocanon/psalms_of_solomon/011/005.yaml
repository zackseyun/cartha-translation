lexical_decisions:
- source_word: ὄρη
  choice: Berge
  rationale: Das Substantiv bezeichnet gewöhnlich Berge oder größere Hügel; »Berge« entspricht dem Maßstab des Bildes.
- source_word: ὑψηλά
  choice: hohe
  rationale: Die direkte attributive Wiedergabe bewahrt das Bild räumlicher Höhe und klingt im modernen Deutsch natürlich.
- source_word: ἐταπείνωσεν
  choice: senkte er
  rationale: Das Verb kann »erniedrigen« bedeuten; bei Bergen als Objekt steht hier die räumliche Absenkung im Vordergrund. »senkte« erhält zugleich etwas von der bildhaften Kraft.
- source_word: εἰς ὁμαλισμόν
  choice: zu ebenem Land
  rationale: 'Die Präpositionalfügung bezeichnet das Ergebnis: Die Berge werden zu einer ebenen Fläche gemacht. »zu ebenem Land« gibt dies klar und idiomatisch wieder.'
- source_word: αὐτοῖς
  choice: für sie
  rationale: 'Der Dativ wird im Zusammenhang am besten als Dativ des Vorteils verstanden: Das Einebnen geschieht zu ihren Gunsten.'
