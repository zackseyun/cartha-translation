lexical_decisions:
- source_word: ἀπὸ βορρᾶ
  choice: aus dem Norden
  rationale: ἀπό mit Genitiv bezeichnet Herkunft oder Ausgangspunkt; „aus dem Norden“ gibt die Richtungsangabe natürlich und präzise wieder.
- source_word: ἔρχονται
  choice: kommen sie
  rationale: Das griechische Präsens wird als anschauliches deutsches Präsens beibehalten.
- source_word: τῇ εὐφροσύνῃ
  choice: in der Freude
  rationale: Der Dativ bezeichnet am ehesten die begleitende Haltung oder den Zustand. Die Formulierung bewahrt zudem die substantivische Ausdrucksweise des Griechischen.
- source_word: τοῦ θεοῦ αὐτῶν
  choice: ihres Gottes
  rationale: Der Genitiv wird unmittelbar wiedergegeben, ohne ihn ausdrücklich kausal („von ihrem Gott geschenkt“) oder räumlich („vor ihrem Gott“) auszudeuten.
- source_word: ἐκ νήσων μακρόθεν
  choice: von fernen Inseln
  rationale: ἐκ bezeichnet die Herkunft; νῆσοι bedeutet gewöhnlich „Inseln“, kann im biblischen Sprachgebrauch jedoch auch Küstenländer bezeichnen. μακρόθεν wird idiomatisch durch „fern“ ausgedrückt.
- source_word: συνήγαγεν
  choice: hat … gesammelt
  rationale: Das Perfekt gibt die abgeschlossene Sammlung mit ihrer für das gegenwärtige Kommen fortwirkenden Bedeutung natürlich wieder.
- source_word: ὁ θεός
  choice: Gott
  rationale: Das ausdrücklich genannte Subjekt und die göttliche Urheberschaft bleiben erhalten.
