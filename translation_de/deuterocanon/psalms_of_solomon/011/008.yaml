base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/011/008.yaml
  text: Put on[a], Jerusalem, the garments of your glory; make ready your sacred robe[c][b], for God has spoken good things to Israel forever and ever.
translation:
  language: de
  text: Zieh, Jerusalem, die Gewänder deiner Herrlichkeit an; bereite dein heiliges Gewand[a] vor! Denn Gott hat Israel Gutes gesagt, für immer und ewig.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „das Gewand deiner Heiligkeit“ oder „das Gewand deines Heiligtums“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich etwa: „auf ewig und noch weiter“; die Wendung verstärkt die Aussage von bleibender Dauer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔνδυσαι
  choice: Zieh … an
  rationale: Der mediale Imperativ fordert Jerusalem auf, sich selbst zu bekleiden; die trennbare Verbform ist im modernen Deutschen natürlich und wahrt die Bildsprache.
- source_word: τὰ ἱμάτια τῆς δόξης σου
  choice: die Gewänder deiner Herrlichkeit
  rationale: „Gewänder“ entspricht dem Plural und trägt den gehobenen poetischen Ton; „Herrlichkeit“ bewahrt die biblisch-theologische Resonanz von δόξα.
- source_word: ἑτοίμασον
  choice: lege … bereit
  rationale: Gibt den Imperativ „bereite vor/mache bereit“ idiomatisch wieder und passt zu einem anzulegenden Gewand.
- source_word: τὴν στολὴν
  choice: Festgewand
  rationale: στολή bezeichnet ein langes bzw. stattliches Gewand. „Festgewand“ vermittelt im Kontext der feierlichen Einkleidung Jerusalems dessen besondere Würde, ohne einen konkreten Zuschnitt festzulegen.
- source_word: τοῦ ἁγιάσματός σου
  choice: dein heiliges
  rationale: Die Formulierung versteht den Genitiv als Kennzeichnung eines Jerusalem zugehörigen, geheiligten Gewands. Die ebenfalls mögliche Beziehung auf „Heiligkeit“ oder „Heiligtum“ wird in der Fußnote offengehalten.
- source_word: ἐλάλησεν ἀγαθὰ
  choice: hat … Gutes zugesagt
  rationale: Wörtlich steht „hat Gutes gesprochen“. „Gutes zugesagt“ ist natürliches Deutsch und bringt die kontextuelle Verheißung zum Ausdruck; die wörtlichere Fassung wird in einer Fußnote genannt.
- source_word: εἰς τὸν αἰῶνα καὶ ἔτι
  choice: für immer und darüber hinaus
  rationale: Die Wendung verbindet unbegrenzte Dauer mit dem verstärkenden καὶ ἔτι („und noch/weiter“). Die Übersetzung bewahrt diese auffällige Steigerung, statt sie zu einer bloßen Formel einzuebnen.
theological_decisions:
- issue: Bedeutung von τοῦ ἁγιάσματός σου in der Einkleidung Jerusalems
  choice: ein Jerusalem zugehöriges heiliges Festgewand
  alternative: „das Gewand deiner Heiligkeit“ oder „das Gewand deines Heiligtums“
  rationale: ἁγίασμα kann Heiligkeit, etwas Geheiligtes oder ein Heiligtum bezeichnen. Der Haupttext wahrt die Vorstellung eines geheiligten Gewands, während die Fußnote die sachlich möglichen Genitivbezüge offenhält.
- issue: Aussagekraft von ἐλάλησεν ἀγαθὰ
  choice: Gott hat Israel Gutes zugesagt
  alternative: Gott hat Gutes zu Israel gesprochen
  rationale: Der Kontext legt eine wirksame göttliche Zusage nahe, doch der griechische Wortlaut spricht allgemein vom Reden des Guten. Eine Fußnote bewahrt die formale Alternative.
- issue: Zeitliche Reichweite von εἰς τὸν αἰῶνα καὶ ἔτι
  choice: für immer und darüber hinaus
  alternative: für immer und ewig / auf ewig und noch weiter
  rationale: Die ungewöhnliche Zusatzpartikel ἔτι wird ausdrücklich wiedergegeben, damit die emphatische Fortsetzung nicht in einer geläufigen Ewigkeitsformel verschwindet.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit poetischer Parallelität. Die Imperative bleiben unmittelbar; „Festgewand“ hebt die feierliche Investitur hervor. Markierte Fußnoten stehen sämtlich im Haupttext und dokumentieren die echten lexikalischen Mehrdeutigkeiten.
