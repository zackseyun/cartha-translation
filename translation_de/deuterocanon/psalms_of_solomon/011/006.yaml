    issue: Die Hauptlesart „vor ihrem Kommen“ ist im Deutschen potenziell temporal missverständlich.
    rationale: ἀπό bei φεύγω bezeichnet hier eher das Fliehen vor bzw. weg von ihrem Nahen/Eintritt. „Herannahen“ erhält diese Richtung und die Personifikation klarer.
  - severity: low
    issue: Die Fußnotenalternative „bei ihrem Einzug“ schwächt die Bedeutung von ἀπό ab.
    rationale: „Bei“ gibt eher eine bloße Zeit- oder Begleitumstandsangabe wieder. Als Alternative sollte sie daher nicht angeboten werden; ein knapper Hinweis auf „vor ihrem Kommen“ genügt.
  revised_text: Die Hügel flohen vor ihrem Herannahen[a]; die Wälder spendeten ihnen Schatten auf ihrem Weg.
