  yaml_path: translation/deuterocanon/psalms_of_solomon/011/006.yaml
  text: The hills fled from their approach[c][b][a]; the forests gave them shade along their way.
translation:
  language: de
  text: Die Hügel flohen vor ihrem Herannahen[a]; die Wälder spendeten ihnen Schatten auf ihrem Weg.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „vor ihrem Kommen“. Der knappe griechische Ausdruck kann ihr Kommen oder ihr Herannahen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ βουνοὶ
  choice: die Hügel
  rationale: βουνός bezeichnet gewöhnlich einen Hügel oder eine Anhöhe; „Hügel“ bewahrt die Größenordnung und klingt im Deutschen natürlich.
- source_word: ἔφυγον
  choice: flohen
  rationale: Die gewöhnliche Bedeutung von φεύγω ist „fliehen“. Die Wiedergabe erhält die lebhafte Personifikation.
- source_word: ἀπὸ εἰσόδου αὐτῶν
  choice: vor ihrem Kommen
  rationale: Bei φεύγω trägt ἀπό eine räumliche Bedeutung („weg von“, „vor“), während εἴσοδος hier das Kommen beziehungsweise Herannahen bezeichnet. „Vor ihrem Kommen“ wahrt die kompakte Formulierung und vermeidet das im Deutschen enger wirkende „Eintritt“.
- source_word: οἱ δρυμοὶ
  choice: die Wälder
  rationale: δρυμός kann Wald, Gehölz oder Dickicht bezeichnen. „Wälder“ gibt das Bild eines bewaldeten Gebietes klar und würdig wieder.
- source_word: ἐσκίασαν αὐτοῖς
  choice: spendeten ihnen Schatten
  rationale: Die Formulierung bildet den benefaktiven Dativ αὐτοῖς ab und gibt die Handlung idiomatisch wieder.
- source_word: ἐν τῇ παρόδῳ αὐτῶν
  choice: auf ihrem Weg
  rationale: πάροδος bezeichnet hier das Vorüberziehen beziehungsweise den zurückgelegten Weg. „Auf ihrem Weg“ ist natürlich und bleibt nahe am Bild.
theological_decisions: []
