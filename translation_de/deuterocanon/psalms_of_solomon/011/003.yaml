  yaml_path: translation/deuterocanon/psalms_of_solomon/011/003.yaml
  text: Stand[a], O Jerusalem, on high[c][b], and see your children gathered from east and west by the Lord.
translation:
  language: de
  text: Stell dich, Jerusalem, auf eine Anhöhe und sieh deine Kinder, die der Herr aus Osten und Westen alle zusammengeführt hat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „auf einmal“. Der griechische Ausdruck kann sowohl das gemeinsame Zusammenkommen als auch dessen Gleichzeitigkeit hervorheben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: στῆθι
  choice: Stell dich
  rationale: Der Aoristimperativ fordert Jerusalem auf, einen Standort einzunehmen. „Stell dich“ ist direkt, natürlich und passt zur anschließenden Aufforderung zu schauen.
- source_word: ἐφʼ ὑψηλοῦ
  choice: auf eine Anhöhe
  rationale: Die Wendung bezeichnet hier einen erhöhten, räumlich konkreten Aussichtspunkt. „Auf eine Anhöhe“ vermeidet die mögliche himmlisch-abstrakte Bedeutung von „in der Höhe“.
- source_word: τέκνα
  choice: Kinder
  rationale: τέκνα bezeichnet die Kinder beziehungsweise Nachkommen Jerusalems ohne Beschränkung auf männliche Personen.
- source_word: ἀπὸ ἀνατολῶν καὶ δυσμῶν
  choice: aus Osten und Westen
  rationale: Die griechischen Pluralformen bezeichnen idiomatisch die östlichen und westlichen Gegenden; im Deutschen ist die Richtungsangabe „aus Osten und Westen“ natürlich und prägnant.
- source_word: συνηγμένα
  choice: zusammengeführt
  rationale: Das Partizip bezeichnet Menschen, die zu einer Gemeinschaft gesammelt beziehungsweise zusammengebracht worden sind. Die aktive deutsche Relativkonstruktion nennt den im Griechischen angegebenen Urheber klar.
- source_word: εἰς ἅπαξ
  choice: alle zusammen
  rationale: Die komprimierte Wendung kann die gemeinsame, einheitliche Sammlung oder deren Gleichzeitigkeit hervorheben. „Alle zusammen“ gibt im Kontext vor allem den gemeinschaftlichen Aspekt natürlich wieder; die mögliche zeitliche Nuance wird in der Fußnote bewahrt.
- source_word: ἀπὸ Κυρίου
  choice: die der Herr … zusammengeführt hat
  rationale: ἀπό mit Κυρίου bezeichnet hier am natürlichsten den Herrn als Ursprung beziehungsweise Urheber der Sammlung. Die aktive Formulierung ist im Deutschen klar und wahrt diese Aussage.
