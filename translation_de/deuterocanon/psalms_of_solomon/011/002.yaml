  text: 'Proclaim in Jerusalem the voice of one bringing good news: for God has shown mercy to Israel in their visitation[a][b][c].'
translation:
  language: de
  text: 'Verkündet in Jerusalem die Stimme[a] dessen, der gute Nachricht bringt: Denn Gott hat sich über Israel erbarmt bei seiner Zuwendung zu ihnen.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »den Ruf« beziehungsweise »den Klang dessen, der gute Nachricht bringt«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »bei seinem Aufsuchen Israels« oder »bei seiner Heimsuchung«. Das griechische Wort kann ein Aufsuchen, ein aufmerksames Nachsehen oder ein fürsorgliches Eingreifen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κηρύξατε
  choice: Verkündet
  rationale: Der Imperativ Plural fordert zu öffentlicher Bekanntmachung auf; »verkündet« bewahrt den heroldartigen, feierlichen Ton in natürlichem modernem Deutsch.
- source_word: φωνὴν
  choice: die Stimme
  rationale: Die konkrete Bildsprache des griechischen Substantivs bleibt erhalten, statt die Wendung lediglich als »Botschaft« wiederzugeben.
- source_word: εὐαγγελιζομένου
  choice: dessen, der gute Nachricht bringt
  rationale: Das substantivierte Partizip bezeichnet jemanden, der frohe Nachricht überbringt. Die Formulierung vermeidet eine vorschnelle Festlegung auf den späteren christlichen Fachgebrauch von »Evangelium«.
- source_word: ἠλέησεν
  choice: hat sich erbarmt
  rationale: Die im Verb enthaltene Sprache des Erbarmens wird direkt und idiomatisch wiedergegeben.
- source_word: ἐπισκοπῇ
  choice: als er nach ihnen sah
  rationale: Die Wendung gibt den positiven Kontext göttlicher Zuwendung wieder und lässt sowohl das Aufsuchen als auch die fürsorgliche Aufmerksamkeit anklingen. Eine Fußnote bewahrt das weitere Bedeutungsspektrum des Nomens.
- source_word: αὐτῶν
  choice: ihnen
  rationale: 'Der Plural bezieht sich auf Israel als Volk. In Verbindung mit ἐπισκοπή wird er hier als objektiv verstanden: Gott sieht nach Israel beziehungsweise sucht es auf.'
theological_decisions:
- issue: Bedeutung von ἐπισκοπῇ αὐτῶν
  choice: 'Gottes barmherzige Zuwendung zu Israel: »als er nach ihnen sah«'
  alternative: »bei ihrer Heimsuchung«, »als er sie aufsuchte« oder »bei seinem Eingreifen für sie«
  rationale: Die unmittelbare Verbindung mit guter Nachricht und Erbarmen spricht für eine gnädige göttliche Zuwendung. Die gewählte Formulierung verdeutlicht, dass Israel Gegenstand dieser Zuwendung ist, ohne den Ausdruck ausschließlich auf einen Besuch oder ein Eingreifen festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die konkrete Rede von der »Stimme« bleibt erhalten; »gute Nachricht« vermeidet einen unnötig technischen Klang. Der Schlusssatz ist bewusst positiv formuliert, weil der Kontext von Erbarmen spricht, während die Fußnote die Bedeutungsbreite von ἐπισκοπή dokumentiert.
