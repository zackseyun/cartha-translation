  text: And if you do not turn us back[a], we will not keep away[c][b], but we will come to you.
translation:
  language: de
  text: Und wenn du uns nicht zurückführst[a], werden wir uns nicht fernhalten[b], sondern zu dir kommen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wiederherstellst“ oder „zur Umkehr führst“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „werden wir uns nicht zurückhalten“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν μὴ
  choice: wenn … nicht
  rationale: Die einfache verneinte Bedingung gibt den direkten appellativen Charakter wieder und vermeidet die stärkere Zuspitzung durch „es sei denn“.
- source_word: ἐπιστρέψῃς
  choice: zurückführst
  rationale: Das transitive Verb mit „uns“ als Objekt bezeichnet, dass Gott die Sprechenden zurückbringt bzw. zur Umkehr führt. „Zurückführen“ bewahrt die Richtungsbedeutung, ohne sie ausschließlich räumlich oder bekehrungstheologisch festzulegen.
- source_word: ἡμᾶς
  choice: uns
  rationale: Schlichte Wiedergabe des direkten Objekts in der ersten Person Plural.
- source_word: οὐκ ἀφεξόμεθα
  choice: werden wir uns nicht fernhalten
  rationale: Die mediale Form bezeichnet hier, Abstand zu halten oder sich zurückzuhalten. „Sich fernhalten“ bildet einen klaren Gegensatz zum anschließenden Kommen zu Gott.
- source_word: ἀλλʼ
  choice: sondern
  rationale: Nach der verneinten Aussage markiert „sondern“ im Deutschen den adversativen Gegensatz natürlich und präzise.
- source_word: ἐπὶ σὲ ἥξομεν
  choice: zu dir kommen
  rationale: Die Wendung drückt die Ankunft bzw. Hinwendung zu der angeredeten Person aus; „zu dir kommen“ wahrt ihren persönlichen Charakter.
theological_decisions:
- issue: Ob ἐπιστρέψῃς ausdrücklich als Bekehrung oder Wiederherstellung zu deuten ist
  choice: zurückführst
  alternative: wiederherstellst; zur Umkehr führst
  rationale: Der griechische Wortlaut trägt sowohl die Vorstellung einer Rückführung als auch im weiteren Sinn die einer Wiederherstellung oder Umkehr. Die Hauptfassung lässt diese theologische und kontextuelle Spannung offen, statt eine bestimmte Heilslehre festzuschreiben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper psalmischer Satzführung. Die zunächst überraschende Bedingungslogik des griechischen Textes bleibt erhalten und wird nicht erklärend geglättet.
