  text: And if they are hungry[a], they will lift up their faces to you.
translation:
  language: de
  text: Und wenn sie Hunger haben, werden sie ihre Gesichter zu dir erheben.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Bild, das Gesicht zu Gott zu erheben, kann bittende Hinwendung und Vertrauen ausdrücken.
