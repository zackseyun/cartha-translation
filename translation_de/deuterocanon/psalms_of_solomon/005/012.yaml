lexical_decisions:
- source_word: πεινάσωσιν
  choice: Hunger haben
  rationale: Der Aorist Konjunktiv mit ἐὰν bildet eine allgemeine zukünftige Bedingung. „Hunger haben“ ist natürliches modernes Deutsch und verstärkt die Aussage nicht zu „verhungern“.
- source_word: ἀροῦσιν
  choice: werden … erheben
  rationale: Das Futur von αἴρω bedeutet wörtlich „heben, erheben“. Die Wiedergabe bewahrt das konkrete Bild des griechischen Ausdrucks.
- source_word: πρόσωπον αὐτῶν
  choice: ihr Gesicht
  rationale: Das Griechische setzt πρόσωπον trotz des pluralischen Besitzers in den Singular. Der kollektive Singular „ihr Gesicht“ ist im Deutschen verständlich und erhält die auffällige Form des Ausgangstextes.
- source_word: πρὸς σέ
  choice: zu dir
  rationale: „Zu dir“ gibt die Richtung von πρὸς natürlich wieder und passt zum bildhaften „das Gesicht erheben“.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die konkrete Körpermetapher und der kollektive Singular des griechischen Textes bleiben erhalten; die Fußnote erläutert das damit bezeichnete Bitten und Vertrauen.
