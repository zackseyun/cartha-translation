  text: Do not lay your hand heavily upon us, so that we may not sin under compulsion.
translation:
  language: de
  text: Lass deine Hand nicht schwer auf uns lasten, damit wir nicht unter Zwang sündigen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder wörtlicher: „Mach deine Hand nicht schwer über uns, damit wir nicht aus Not sündigen.“'
    reason: Bewahrt die wörtlichere Bildform von βαρύνῃς und ἐφʼ ἡμᾶς sowie die Nuance von διʼ ἀνάγκην, ohne die unidiomatische Formulierung der bisherigen Fußnote.
lexical_decisions:
- source_word: βαρύνῃς
  choice: schwer … lasten
  rationale: Das Verb bezeichnet ein Schwer-Machen bzw. schweres Drücken. Die deutsche Wendung bewahrt das Bild und vermittelt belastenden Druck natürlich.
- source_word: χεῖρά
  choice: Hand
  rationale: Die konkrete Bildsprache des Griechischen bleibt erhalten; die Hand kann zugleich ausgeübte Macht oder Bedrängnis bezeichnen.
- source_word: ἐφʼ ἡμᾶς
  choice: auf uns
  rationale: Die Präposition fügt sich unmittelbar in das Bild einer schwer auf jemandem lastenden Hand, ohne den Sinn vorschnell auf Feindseligkeit zu verengen.
- source_word: ἵνα μὴ
  choice: damit … nicht
  rationale: Diese Wiedergabe lässt die mögliche Zweck- oder Folgebeziehung offen und klingt in modernem Deutsch natürlich.
- source_word: διʼ ἀνάγκην
  choice: unter Zwang
  rationale: Die Formulierung gibt den durch äußeren Druck oder eine Notlage erzeugten Zwang knapp und verständlich wieder, ohne absolute Unvermeidlichkeit zu behaupten.
- source_word: ἁμάρτωμεν
  choice: wir nicht … sündigen
  rationale: Der Aorist Konjunktiv nach ἵνα μή wird als abhängige verneinte Aussage wiedergegeben.
theological_decisions:
- issue: Verhältnis von Bedrängnis und Sünde
  choice: „damit wir nicht unter Zwang sündigen“
  alternative: „damit wir nicht aus Notwendigkeit sündigen“
  rationale: „Unter Zwang“ bewahrt die Vorstellung, dass starker Druck zur Sünde treiben kann, ohne auszusagen, Sünde werde unausweichlich oder moralisch entschuldigt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die körperliche Metapher der schweren Hand bleibt erhalten; „damit“ bewahrt die griechische Zweck-/Folgespannung.
