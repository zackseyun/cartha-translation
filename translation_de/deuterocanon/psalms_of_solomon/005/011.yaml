base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/005/011.yaml
  text: You feed the birds and the fish[z], as you give rain to the desolate places for the sprouting of grass[a], to prepare fodder in the wilderness for every living thing.
translation:
  language: de
  text: Du ernährst die Vögel und die Fische, indem[a] du den öden Gegenden Regen gibst, damit Gras sprießt, um in der Wüste Futter für jedes Lebewesen bereitzustellen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wenn du“.'
    reason: Der griechische artikulierte Infinitiv kann hier sowohl instrumental als auch temporal verstanden werden.
lexical_decisions:
- source_word: τὰ πετεινὰ
  choice: die Vögel
  rationale: πετεινά bezeichnet fliegende Tiere, im Kontext natürlich und knapp als „Vögel“ wiedergegeben.
- source_word: τοὺς ἰχθύας
  choice: die Fische
  rationale: Die direkte und geläufige deutsche Entsprechung zu ἰχθύας.
- source_word: τρέφεις
  choice: du ernährst
  rationale: τρέφω bezeichnet das Versorgen mit Nahrung. „Ernährst“ umfasst die providentielle Versorgung und passt auch zur Verbindung von Vögeln und Fischen.
- source_word: ἐν τῷ διδόναι σὲ
  choice: indem du … gibst
  rationale: Der artikulierte Infinitiv kann instrumental oder temporal verstanden werden. „Indem“ gibt hier die Versorgung durch das Schenken von Regen wieder; die zeitliche Möglichkeit bleibt in einer Fußnote erhalten.
- source_word: ὑετὸν ἐρήμοις
  choice: den öden Gegenden Regen
  rationale: ἐρήμοις bezeichnet unbewohnte, dürre oder wüstenartige Gebiete. „Öde Gegenden“ bewahrt die Mehrzahl und vermeidet eine unnötige Verengung auf Sandwüsten.
- source_word: εἰς ἀνατολὴν χλόης
  choice: damit Gras sprießt
  rationale: Wörtlich geht es um das Aufgehen beziehungsweise Hervorsprossen jungen Grüns. Die deutsche Zwecksatzform gibt das Bild natürlich wieder.
- source_word: χορτάσματα
  choice: Futter
  rationale: χορτάσματα meint Nahrung beziehungsweise Futter für Lebewesen. „Futter“ ist konkreter als „Nahrung“ und entspricht dem durch Regen hervorgebrachten Pflanzenwuchs.
- source_word: παντὶ ζῶντι
  choice: für jedes Lebewesen
  rationale: Die umfassende Formulierung schließt jedes lebende Geschöpf ein; „Lebewesen“ ist im modernen Deutsch klar und natürlich.
theological_decisions:
- issue: Verhältnis des Regens zur Ernährung der Geschöpfe
  choice: 'instrumental: „indem du … Regen gibst“'
  alternative: 'temporal: „wenn du … Regen gibst“'
  rationale: Der Zusammenhang beschreibt Gottes Regen als Mittel seiner fürsorglichen Ernährung, doch die grammatisch mögliche zeitliche Lesart wird nicht ausgeschlossen und daher in der Fußnote genannt.
- issue: Funktion von ἑτοιμάσαι
  choice: 'Zweck: „um … bereitzustellen“'
  alternative: 'Folge: „sodass … bereitsteht“'
  rationale: Der Aoristinfinitiv wird am ehesten als Zweck der vorausgehenden Regengabe verstanden. Die Formulierung wahrt den handelnden göttlichen Urheber, ohne über den Text hinauszugehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit anschaulicher Naturbildsprache. Die Satzstruktur bleibt dem griechischen Gedankengang nahe, wird aber durch deutsche Zweckkonstruktionen lesbar gestaltet.
