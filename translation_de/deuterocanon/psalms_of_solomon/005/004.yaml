  - marker: b
    text: 'Oder: „Denn er wird einem mächtigen Mann keine Beute abnehmen.“ Das griechische Verb nennt kein ausdrückliches Subjekt.'
    reason: source_ambiguity
lexical_decisions:
- source_word: λήψεται
  choice: wird … abnehmen
  rationale: Die Futurform von λαμβάνω bezeichnet hier das Erlangen von Beute. Im Deutschen gibt „jemandem Beute abnehmen“ den Zusammenhang und die mit παρά bezeichnete Herkunft natürlich wieder.
- source_word: σκῦλα
  choice: Beute
  rationale: Das Wort bezeichnet erbeutete Güter. „Beute“ ist im modernen Deutschen klar und knapp; „Beutestücke“ ist als stärker gegenständliche Alternative möglich.
- source_word: παρὰ ἀνδρὸς δυνατοῦ
  choice: einem mächtigen Mann
  rationale: παρά mit Genitiv bezeichnet hier die Herkunft beziehungsweise die Person, der etwas abgenommen wird; dies wird idiomatisch durch den Dativ bei „abnehmen“ ausgedrückt. „Mächtig“ bewahrt den Bedeutungsumfang von δυνατός zwischen Stärke und Macht.
theological_decisions:
- issue: Nicht ausdrücklich genanntes Subjekt von λήψεται
  choice: niemand
  alternative: er
  rationale: Das griechische Verb steht in der dritten Person Singular ohne ausdrückliches Subjekt und kann unpersönlich beziehungsweise indefinit verstanden werden. „Niemand“ ergibt einen natürlichen deutschen Spruchsatz; die mögliche personale Wiedergabe „er“ bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe, sprichwortartige Satzform bleibt erhalten; „abnehmen“ verbindet das Nehmen der Beute idiomatisch mit ihrer Herkunft.
