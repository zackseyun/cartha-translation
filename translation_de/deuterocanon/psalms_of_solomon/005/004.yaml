translation:
  language: de
  text: Denn niemand wird einem mächtigen Mann Beute abnehmen.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Beutestücke“ statt „Beute“.'
