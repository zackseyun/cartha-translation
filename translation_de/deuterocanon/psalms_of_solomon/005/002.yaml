translation:
  language: de
  text: Denn du bist gütig und barmherzig, die Zuflucht des Armen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χρηστός
  choice: gütig
  rationale: Das Adjektiv bezeichnet hier wohlwollende, wohltätige Güte. „Gütig“ bewahrt diesen persönlichen und zugleich würdevollen Sinn.
- source_word: ἐλεήμων
  choice: barmherzig
  rationale: „Barmherzig“ ist die direkte, im biblischen Sprachgebrauch vertraute Entsprechung und bezeichnet tätiges Erbarmen.
- source_word: καταφυγή
  choice: Zuflucht
  rationale: „Zuflucht“ erhält das Bild eines sicheren Ortes oder Schutzes und gibt das griechische Substantiv ohne unnötige Ausdeutung wieder.
- source_word: τοῦ πτωχοῦ
  choice: des Armen
  rationale: Der griechische Singular wird bewahrt. „Der Arme“ bezeichnet hier einen mittellosen oder bedürftigen Menschen.
- source_word: ὅτι
  choice: Denn
  rationale: Die Konjunktion begründet oder erläutert die vorausgehende Aussage; „Denn“ gibt diese Funktion in gehobenem, natürlichem Deutsch knapp wieder.
theological_decisions:
- issue: Bezug von „gütig und barmherzig“
  choice: Die Adjektive beziehen sich auf das angeredete „du“; „die Zuflucht des Armen“ steht als Apposition dazu.
  alternative: „Denn die Zuflucht des Armen ist gütig und barmherzig.“
  rationale: χρηστός und ἐλεήμων sind maskulin, während καταφυγή feminin ist. Daher kann „Zuflucht“ grammatisch nicht das Subjekt der beiden Adjektive sein. Die Anrede bleibt unbenannt, statt den im Vers nicht ausdrücklich genannten Gottesnamen einzusetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit psalmischem Klang. Der Singular „des Armen“ und die Zufluchtsmetapher bleiben erhalten. Die Apposition „die Zuflucht des Armen“ wirkt leicht feierlich, ist aber klar verständlich und bildet die knappe griechische Struktur angemessen ab.
