translation:
  language: de
  text: Und wer wird etwas von allem nehmen, was du geschaffen hast, wenn du es nicht gibst?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τίς λήψεται
  choice: wer kann ... nehmen
  rationale: 'Das futurische λήψεται steht hier in einer rhetorischen Frage und hat sinngemäß modale Kraft: Niemand vermag etwas zu nehmen, wenn Gott es nicht gibt.'
- source_word: ἀπὸ πάντων ὧν ἐποίησας
  choice: etwas von all dem, was du geschaffen hast
  rationale: ἀπό bezeichnet die Entnahme aus der Gesamtheit; „etwas“ ist im Deutschen zur natürlichen Wiedergabe des partitiven Sinnes ergänzt. ἐποίησας wird im Schöpfungskontext mit „geschaffen hast“ wiedergegeben.
- source_word: ἐὰν μὴ σὺ δῷς
  choice: wenn du es nicht gibst
  rationale: Die ausdrückliche Hervorhebung durch σὺ bleibt mit „du“ erhalten. Das Objekt „es“ ist im Griechischen nur sinngemäß enthalten, im Deutschen aber für einen vollständigen und natürlichen Satz erforderlich.
theological_decisions:
- issue: Göttliche Verfügung über das Geschaffene
  choice: Die rhetorische Frage bleibt offen formuliert und bindet den Empfang des Geschaffenen an Gottes Geben.
  alternative: „Niemand kann ... nehmen“ als ausdrückliche Feststellung.
  rationale: Die Frageform des griechischen Textes wahrt dessen rhetorische Spannung, ohne sie in eine dogmatische Aussage umzuschreiben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung wahrt den rhetorischen Charakter und hebt das göttliche „du“ natürlich hervor.
