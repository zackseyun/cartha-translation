  text: But your gift is abundant in kindness and rich[b][a], and the hope in you will not be disappointed in the gift.
translation:
  language: de
  text: Doch deine Gabe ist überreich an Güte und von großer Fülle; wer auf dich hofft, wird bei deiner Gabe nicht kärglich bedacht.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Schlusssatz ist stark verkürzt und lässt Subjekt und Satzbezug offen. Möglich ist auch: „Und es gibt keinen, der auf dich hofft, bei dessen Beschenkung du sparen wirst.“ Weniger wahrscheinlich ist: „Wer auf dich hofft, wird beim Geben nicht sparen.“'
    reason: textual_ambiguity
lexical_decisions:
- source_word: δόμα
  choice: Gabe
  rationale: δόμα bezeichnet das Gegebene, also eine Gabe oder ein Geschenk. „Gabe“ bewahrt den konkreten Sinn und passt zum Gegensatz zwischen menschlich begrenztem Geben und Gottes Fülle.
- source_word: πολύ
  choice: überreich
  rationale: πολύ hebt hier die große Menge beziehungsweise Fülle hervor. „Überreich“ gibt diesen Gedanken im Zusammenhang göttlicher Freigebigkeit idiomatisch wieder.
- source_word: μετὰ χρηστότητος
  choice: an Güte
  rationale: χρηστότης bezeichnet Güte, Freundlichkeit oder gütige Freigebigkeit. Die Wendung „überreich an Güte“ ist im Deutschen natürlich und bewahrt den wohlwollenden Sinn.
- source_word: πλούσιον
  choice: von großer Fülle
  rationale: πλούσιον bedeutet wörtlich „reich“. Da „überreich“ bereits πολύ wiedergibt, vermeidet „von großer Fülle“ eine ungelenke Wiederholung und erhält die poetische Verstärkung.
- source_word: ἡ ἐλπὶς ἐπὶ σέ
  choice: wer auf dich hofft
  rationale: Der griechische Ausdruck ist stark verkürzt und nennt wörtlich „die Hoffnung auf dich“. Die personale Wiedergabe macht verständlich, dass es um den auf Gott hoffenden Menschen geht.
- source_word: οὐ φείσεται ἐν δόματι
  choice: wird bei deiner Gabe nicht kärglich bedacht
  rationale: φείδομαι bedeutet „schonen, sparen, zurückhalten“. Der Kontext legt nahe, dass der Hoffende Gottes Gabe empfängt und dabei nicht knapp bedacht wird; die Formulierung wahrt zugleich den Gedanken des Nicht-Sparens.
theological_decisions:
- issue: Subjekt und Empfänger im elliptischen Schlusssatz
  choice: Der auf Gott Hoffende wird als Empfänger verstanden; Gott ist als Geber mitgedacht.
  alternative: „Wer auf dich hofft, wird beim Geben nicht sparen“ beziehungsweise „du wirst mit deiner Gabe nicht sparen“.
  rationale: Der Zusammenhang stellt Gottes reiche Gabe menschlich begrenzter Freigebigkeit gegenüber. Daher ist es wahrscheinlicher, dass der Hoffende nicht selbst der großzügige Geber ist, sondern von Gott nicht kärglich bedacht wird. Wegen der grammatischen Ellipse wird die Alternative in der Fußnote offengelegt.
translation_notes:
  register: Moderne, würdige Standardsprache. Die poetische Steigerung von πολύ und πλούσιον wird mit „überreich … von großer Fülle“ bewahrt, ohne eine schwerfällige Doppelung von „reich“ zu erzeugen. Die Ellipse des zweiten Satzteils wird im Haupttext verständlich aufgelöst und in der Fußnote transparent gemacht.
