  text: For man and his portion from you are in the balance[a]; he will not add so as to exceed your judgment[b], O God.
translation:
  language: de
  text: Denn der Mensch und sein Anteil stammen von dir und sind auf der Waage[a]; er wird nichts hinzufügen, um dein Urteil zu überschreiten[b], o Gott.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „… stammen von dir und sind nach Gewicht bemessen.“ Das griechische Bild kann Abwägen oder Zumessen ausdrücken.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „… er wird nichts hinzufügen, um über dein Urteil hinauszugehen.“'
    reason: syntactic_alternative
lexical_decisions:
- source_word: ἄνθρωπος
  choice: der Mensch
  rationale: Der substantivierte Singular bezeichnet hier den einzelnen Menschen in repräsentativer, allgemein-menschlicher Bedeutung und entspricht dem folgenden αὐτοῦ.
- source_word: μερὶς
  choice: sein Anteil
  rationale: „Anteil“ gibt den zugeteilten Teil oder das zugemessene Los natürlich wieder und passt zum Bild des Wiegens.
- source_word: παρὰ σοῦ
  choice: von dir
  rationale: 'παρά mit Genitiv bezeichnet regelgerecht die Herkunft: Der Anteil kommt von Gott. Eine Wiedergabe mit „vor dir“ würde eher παρά mit Dativ voraussetzen.'
- source_word: ἐν σταθμῷ
  choice: auf der Waage
  rationale: Die Wendung bewahrt das konkrete Bild einer Waage und klingt im modernen Deutschen natürlich.
- source_word: οὐ προσθήσει
  choice: er wird nichts hinzufügen
  rationale: Das Verb bedeutet wörtlich „hinzufügen“. „Nichts“ ergänzt im Deutschen ein idiomatisch erforderliches Objekt, ohne die Aussage in ein bloßes „nicht vermehren können“ umzudeuten.
- source_word: τοῦ πλεονάσαι
  choice: um … zu überschreiten
  rationale: Der artikulierte Infinitiv bezeichnet hier Ziel oder Folge des Hinzufügens; „überschreiten“ bringt das Hinausgehen über das von Gott gesetzte Maß prägnant zum Ausdruck.
- source_word: κρίμα
  choice: Urteil
  rationale: „Urteil“ wahrt den richterlich-bewertenden Sinn von κρίμα, ohne ihn enger als Erlass oder Strafspruch festzulegen.
- source_word: ὁ θεός
  choice: o Gott
  rationale: Der formal nominativische Ausdruck fungiert als direkte Anrede; „o Gott“ gibt den Gebetsstil würdig wieder.
theological_decisions:
- issue: Generische beziehungsweise repräsentative Bedeutung von ἄνθρωπος im Singular
  choice: „der Mensch“ im Singular
  alternative: „ein Mensch“ oder „die Menschen“
  rationale: Der griechische Text verwendet den Singular und verbindet ihn mit „seinem Anteil“. „Der Mensch“ bewahrt diese Form und kann im Deutschen zugleich repräsentativ verstanden werden.
- issue: Verhältnis zwischen menschlichem Hinzufügen und Gottes κρίμα
  choice: Die Aussage als Begrenzung durch Gottes Urteil wiedergeben
  alternative: Das Verb modal als „er kann nicht vermehren“ deuten oder κρίμα als festes „Dekret“ übersetzen
  rationale: Der Text sagt unmittelbar, dass der Mensch nicht so hinzufügen wird, dass er Gottes κρίμα überschreitet. Die Übersetzung wahrt diese Spannung, ohne ausdrücklich Unfähigkeit, Vorherbestimmung oder eine besondere Art göttlichen Beschlusses einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das konkrete Waagenbild, der repräsentative Singular und die direkte Gottesrede bleiben erhalten; unnatürliche Archaismen und konfessionell festgelegte Deutungen werden vermieden.
