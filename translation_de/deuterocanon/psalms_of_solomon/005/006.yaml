  verdict: revise
  source_fidelity: 'Die Grundwiedergabe trifft die entscheidenden Elemente: παρά mit Genitiv ist als Herkunft („von dir“) zu verstehen, ἐν σταθμῷ bewahrt das Bild des Wiegens, und κρίμα ist angemessen mit „Urteil“ wiedergegeben. In der vorliegenden deutschen Satzstellung bezieht sich „von dir“ jedoch am leichtesten nur auf „sein Anteil“, obwohl die griechische prädikative Fügung „Mensch und sein Anteil“ insgesamt mit παρά σοῦ verbindet.'
  naturalness: „Der Mensch und sein Anteil von dir sind auf der Waage“ ist verständlich, aber die Stellung von „von dir“ ist im Deutschen syntaktisch schwerfällig. Eine Auflösung in zwei gleichrangige Prädikate ist natürlich und macht den Bezug klar. Die Fußnotenformulierung „in einer Waage“ ist kein idiomatisches modernes Deutsch.
  terminology: „der Mensch“, „Anteil“, „von dir“, „auf der Waage“, „nichts hinzufügen“, „Urteil“ und „o Gott“ sind für Register und Sinngehalt geeignet. „Urteil überschreiten“ ist möglich; „über dein Urteil hinauszugehen“ zeigt in der Anmerkung die räumlich-bildhafte Nuance von παρά deutlicher.
  issues:
  - severity: medium
    issue: Unklarer Skopus von „von dir“ im Haupttext
    rationale: Die deutsche Wortfolge legt nahe, dass nur der Anteil von Gott stammt. Die griechische Verbindung stellt hingegen „Mensch und sein Anteil“ gemeinsam in die prädikative Aussage mit παρά σοῦ und ἐν σταθμῷ.
  - severity: low
    issue: Fußnote a ist sprachlich unidiomatisch
    rationale: „in einer Waage“ ist keine natürliche deutsche Wiedergabe. Die alternative Deutung als Bemessung nach Gewicht lässt sich idiomatisch ausdrücken, ohne das Waagenbild zu verlieren.
