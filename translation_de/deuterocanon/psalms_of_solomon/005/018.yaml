  text: Selig ist, an den Gott in angemessener Genügsamkeit denkt.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Selig ist, an den Gott im rechten Maß der Genügsamkeit denkt.“ Die knappe griechische Wendung kann auch „mit wohlbemessener Zufriedenheit“ verstanden werden.'
