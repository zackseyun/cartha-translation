lexical_decisions:
- source_word: μακάριος
  choice: Glücklich
  rationale: Die übliche deutsche Seligpreisungsformel „Glücklich ist“ bewahrt den gehobenen, psalmistischen Ton und ist zugleich unmittelbar verständlich.
- source_word: οὗ
  choice: an wen
  rationale: Der Genitiv des Relativpronomens hängt von μνημονεύει ab; „an wen“ entspricht der natürlichen deutschen Rektion von „an jemanden denken“.
- source_word: μνημονεύει
  choice: denkt
  rationale: „An jemanden denken“ gibt hier sowohl das Erinnern als auch die fürsorgliche Zuwendung wieder, ohne eine zwischenzeitliche Vergessenheit Gottes nahezulegen.
- source_word: ἐν συμμετρίᾳ
  choice: das rechte Maß
  rationale: συμμετρία bezeichnet ein angemessenes, ausgewogenes Maß. „Das rechte Maß“ ist idiomatisch und wahrt den Gedanken passender Begrenzung.
- source_word: αὐταρκίας
  choice: zum Auskommen
  rationale: αὐτάρκεια kann Genügsamkeit, ausreichendes Haben oder Selbstgenügsamkeit bedeuten. „Zum Auskommen“ betont kontextgemäß das von Gott gewährte Genug, ohne menschliche Unabhängigkeit von Gott zu suggerieren.
theological_decisions:
- issue: Bedeutung von αὐταρκίας im Verhältnis zu Gottes Handeln
  choice: Gott denkt fürsorglich an den Menschen und gewährt ihm ein angemessenes Genug.
  alternative: Die Wendung bezeichnet vor allem innere Genügsamkeit oder wörtlicher Selbstgenügsamkeit.
  rationale: Da Gott Subjekt von μνημονεύει ist, legt der Zusammenhang seine fürsorgliche Zuwendung nahe. Die Übersetzung hält dennoch durch Fußnoten die mögliche Betonung von Genügsamkeit beziehungsweise Selbstgenügsamkeit offen.
- issue: Semantische Verbindung der Genitivwendung συμμετρίᾳ αὐταρκίας
  choice: 'Als angemessen bemessene Versorgung expliziert: „das rechte Maß zum Auskommen“.'
  alternative: 'Formal enger: „im rechten Maß der Genügsamkeit“.'
  rationale: Die knappe griechische Nominalfügung ist im Deutschen mehrdeutig und unidiomatisch, wenn sie wörtlich nachgebildet wird. Die gewählte Fassung macht die wahrscheinlich gemeinte ausreichende Versorgung verständlich, ohne Überfluss zu behaupten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die syntaktisch dichte griechische Wendung wird maßvoll expliziert; zwei Fußnoten bewahren ihre lexikalische und relationale Mehrdeutigkeit.
