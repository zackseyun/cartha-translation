  naturalness: „Glücklich ist“ ist verständlich, doch „Selig ist“ entspricht im Deutschen dem gehobenen psalmischen Seligpreisungsregister. Die revidierte Fassung ist knapp und modern verständlich, ohne die griechische Verdichtung unnötig aufzulösen.
