translation:
  language: de
  text: Und du wirst erhören[a]; denn wer außer dir ist gütig und mild genug, die Seele des Demütigen[b] zu erfreuen, wenn du deine Hand in Barmherzigkeit öffnest[c]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „gnädig hören“ beziehungsweise „antworten“; das Verb kann besonders beim Gebet ein Hören bezeichnen, auf das eine Reaktion folgt.'
    reason: lexical_alternative
  - marker: b
    text: 'Der vorgelegte griechische Text hat hier die grammatisch auffällige Form ταπεινὸν. Wahrscheinlich ist ταπεινοῦ zu lesen: „die Seele des Demütigen“.'
    reason: textual_note
  - marker: c
    text: „Die Hand öffnen“ ist ein Bild für großzügiges Geben und Versorgen.
    reason: cultural_note
lexical_decisions:
- source_word: ἐπακούσῃ
  choice: wirst erhören
  rationale: „Erhören“ gibt das aufmerksame und in einem Gebetszusammenhang oft antwortende Hören prägnant wieder.
- source_word: χρηστός
  choice: gütig
  rationale: „Gütig“ bezeichnet hier persönliche, wohltätige Güte und passt zum würdevollen Gebetston.
- source_word: ἐπιεικής
  choice: milde
  rationale: „Milde“ bewahrt den Gedanken nachsichtiger, schonender Freundlichkeit und bildet eine natürliche Verbindung mit „gütig“.
- source_word: εὐφρᾶναι
  choice: zu erfreuen
  rationale: Der Infinitiv wird als Infinitiv wiedergegeben und behält so seine erläuternde beziehungsweise folgebezogene Verbindung mit Gottes Güte und Milde.
- source_word: ψυχὴν
  choice: die Seele
  rationale: „Seele“ entspricht dem poetisch-religiösen Sprachgebrauch und bezeichnet hier das innere Leben des Menschen.
- source_word: ταπεινὸν / vermutlich ταπεινοῦ
  choice: des Demütigen
  rationale: Die überlieferte Form ταπεινὸν stimmt grammatisch nicht mit dem femininen ψυχὴν überein; die naheliegende Lesart ταπεινοῦ ergibt „die Seele des Demütigen“ und entspricht der sachlichen Aussage.
- source_word: ἐν τῷ ἀνοῖξαι χεῖρά σου
  choice: wenn du deine Hand öffnest
  rationale: Die zeitlich formulierte Wendung erhält das anschauliche biblische Bild großzügigen Gebens.
- source_word: ἐν ἐλέει
  choice: in Barmherzigkeit
  rationale: Die Präpositionalform bleibt erhalten; „Barmherzigkeit“ trifft den helfenden, erbarmenden Sinn von ἔλεος im Gebetskontext.
theological_decisions:
- issue: Bedeutung des göttlichen Hörens im Gebet
  choice: erhören
  alternative: hören / gnädig hören / antworten
  rationale: „Erhören“ lässt die im Verb mögliche Antwort auf das Gebet anklingen, ohne Art oder Zeitpunkt dieser Antwort dogmatisch festzulegen.
- issue: Bezeichnung des ταπεινός
  choice: der Demütige
  alternative: der Niedrige / der Bedrängte
  rationale: „Demütige“ wahrt die geistliche wie soziale Offenheit des Ausdrucks; eine ausschließliche Deutung als Bedrängter würde den Sinn zu stark festlegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit poetischem Gebetston. Die rhetorische Frage und die Bildsprache des griechischen Textes bleiben erhalten; die etwas gespannte Infinitivkonstruktion wird nicht durch eine stärker deutende Umschreibung aufgelöst.
