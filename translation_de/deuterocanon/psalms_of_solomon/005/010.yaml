  text: For if I am hungry[a], I will cry out to you, O God, and you will give to me.
translation:
  language: de
  text: Denn wenn ich hungrig werde, werde ich zu dir rufen, Gott, und du wirst mir geben[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »du wirst mir geben«; der Gegenstand wird im Griechischen nicht ausdrücklich genannt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πεινάσω
  choice: ich hungrig werde
  rationale: Der Aorist Konjunktiv mit ἐὰν bezeichnet hier einen möglichen künftigen Fall. „Wenn ich hungrig werde“ gibt diesen Zukunftsbezug natürlich wieder, ohne eine stärker deutende Formulierung einzuführen.
- source_word: κεκράξομαι
  choice: werde ich zu dir rufen
  rationale: „Zu dir rufen“ bewahrt die nachdrückliche Hinwendung zu Gott und klingt im modernen Deutschen natürlich und würdig.
- source_word: ὁ θεός
  choice: Gott
  rationale: Der formal artikulierte Nominativ dient im biblischen Griechisch als Anrede. Im Deutschen ist die artikellose Anrede „Gott“ natürlich; ein zusätzliches „o“ wäre möglich, klänge aber gehobener und weniger gegenwärtig.
- source_word: δώσεις μοι
  choice: du wirst mir geben
  rationale: Die Wiedergabe bleibt eng beim einfachen Verb „geben“ und ergänzt keinen im Griechischen ungenannten Gegenstand. Dadurch bleibt die offene Aussage erhalten.
theological_decisions:
- issue: Nicht genannter Gegenstand von δώσεις
  choice: 'Keinen Gegenstand ergänzen: „du wirst mir geben“'
  alternative: „du wirst für mich sorgen“ oder „du wirst mir Nahrung geben“
  rationale: Der Zusammenhang mit Hunger legt Versorgung beziehungsweise Nahrung nahe, doch der griechische Text nennt das Gegebene nicht ausdrücklich. Die Übersetzung wahrt diese Offenheit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wiederholte Futurform bildet die künftige Bedingung und ihre Folge transparent ab; die direkte Gottesanrede bleibt schlicht und gegenwärtig.
