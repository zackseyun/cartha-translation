  yaml_path: translation/deuterocanon/psalms_of_solomon/005/013.yaml
  text: You feed kings and rulers and peoples, O God; and You sustain kings and rulers and peoples, O God; and who is the hope of the poor and needy, if not you, Lord?
translation:
  language: de
  text: Du ernährst Könige, Herrscher und Völker, o Gott; und wer ist die Hoffnung des Armen und Bedürftigen, wenn nicht du, Herr?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τρέφεις
  choice: ernährst
  rationale: Das Verb bezeichnet hier Gottes Versorgung mit Nahrung und Lebensunterhalt; „ernährst“ gibt dies präzise und natürlich wieder.
- source_word: ἄρχοντας
  choice: Herrscher
  rationale: Der allgemeine Begriff für Machthaber wird von „Könige“ unterschieden und ohne unnötige politische Präzisierung wiedergegeben.
- source_word: λαούς
  choice: Völker
  rationale: Der griechische Plural bezeichnet hier mehrere Völker beziehungsweise Volksgemeinschaften.
- source_word: πτωχοῦ καὶ πένητος
  choice: des Armen und Bedürftigen
  rationale: Die beiden substantivierten Singularformen beschreiben den armen, auf Hilfe angewiesenen Menschen. Die koordinierte Form des Griechischen bleibt erhalten, ohne künstlich zwei Personengruppen daraus zu machen.
- source_word: ἐλπίς
  choice: Hoffnung
  rationale: Die direkte Entsprechung bewahrt sowohl den Sinn von Zuversicht als auch den Gedanken, dass Gott selbst der Grund dieser Hoffnung ist.
theological_decisions:
- issue: Gott als Hoffnung des Armen
  choice: Die personale Frage „wer ist die Hoffnung“ bleibt erhalten.
  alternative: „Worauf kann der Arme hoffen?“
  rationale: Das griechische τίς („wer?“) bezeichnet Gott selbst als Hoffnung und nicht bloß als Geber einer erhofften Hilfe.
- issue: Abweichende Doppelung in der englischen Konsultationsfassung
  choice: Der Versorgungssatz wird nur einmal übersetzt.
  alternative: Den Satz nach der englischen Fassung wiederholen und zusätzlich „sustain“ wiedergeben.
  rationale: Im angegebenen griechischen Ausgangstext steht nur τοὺς βασιλεῖς … σὺ τρέφεις; eine Wiederholung oder ein zweites Verb hat dort keine Grundlage.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Anrede „Gott“ und „Herr“ folgt der griechischen Satzstruktur; die rhetorische Frage und der repräsentative Singular bleiben erhalten.
