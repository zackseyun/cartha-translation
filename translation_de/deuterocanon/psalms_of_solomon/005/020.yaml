    issue: εἰς πλησμονὴν ist im Entwurf nicht als Ziel- oder Ergebnisangabe markiert.
    rationale: „Sättigung“ nach dem Doppelpunkt gibt πλησμονή wieder, lässt aber die Präposition εἰς aus. „zur Sättigung“ bewahrt die Richtung auf Genüge bzw. volle Versorgung hin, ohne das Verhältnis dogmatisch zu präzisieren.
  - severity: low
    issue: Die verbindende Partikel καί fehlt als ausdrückliche Konjunktion.
    rationale: Das Semikolon kann einen Zusammenhang andeuten, doch „und“ bildet die griechische Koordination klarer ab und verbessert den Satzfluss.
