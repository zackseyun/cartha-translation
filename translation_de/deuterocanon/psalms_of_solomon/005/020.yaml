  text: Enough is a modest portion with righteousness, and in this is the Lord’s blessing—Enough is a modest portion with righteousness, and in this is the Lord’s blessing, for satisfaction in righteousness. in righteousness.
translation:
  language: de
  text: 'Ein bescheidener Anteil in Gerechtigkeit genügt, und darin liegt der Segen des Herrn: zur Sättigung in Gerechtigkeit.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἱκανὸν
  choice: genügt
  rationale: Gibt die prädikative Bedeutung „ausreichend sein/genügen“ knapp und idiomatisch wieder.
- source_word: τὸ μέτριον
  choice: ein bescheidener Anteil
  rationale: Das substantivierte Adjektiv bezeichnet hier ein maßvolles, begrenztes Auskommen; „Anteil“ macht den im Deutschen sonst abstrakten Ausdruck verständlich, ohne Überfluss anzudeuten.
- source_word: ἐν δικαιοσύνῃ
  choice: in Gerechtigkeit
  rationale: Bewahrt die wiederholte, theologisch offene Präpositionalfügung und legt nicht fest, ob gerechtes Handeln, ein gerechter Zustand oder beides gemeint ist.
- source_word: ἡ εὐλογία Κυρίου
  choice: der Segen des Herrn
  rationale: Direkte und traditionsnahe Wiedergabe des griechischen Genitivs.
- source_word: εἰς πλησμονὴν
  choice: Sättigung
  rationale: πλησμονή bezeichnet Fülle im Sinn des Sattseins bzw. der Genüge. „Sättigung“ wahrt den Bezug auf ausreichende Versorgung besser als „Überfluss“.
theological_decisions:
- issue: Verhältnis von maßvollem Besitz, Gerechtigkeit und göttlichem Segen
  choice: 'Die Aussage bleibt: Ein bescheidener Anteil zusammen mit Gerechtigkeit genügt, und der Segen des Herrn besteht bzw. führt in diesem Zusammenhang zur Sättigung in Gerechtigkeit.'
  alternative: Den Vers als Verheißung materiellen Überflusses für Gerechte wiederzugeben.
  rationale: Der griechische Text kontrastiert das Maßvolle nicht ausdrücklich mit Armut und verlangt bei πλησμονή keinen luxuriösen Überfluss. Die knappe Syntax lässt das genaue Verhältnis von Segen und Sättigung offen; der Doppelpunkt bewahrt diese Apposition bzw. Folgewirkung, ohne sie dogmatisch festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung von „in Gerechtigkeit“ wird entsprechend dem griechischen Text beibehalten; die fehlerhafte Doppelung der englischen Konsultationsfassung wird nicht übernommen.
