  text: But if I cry out to you[a], do not be silent to me.
translation:
  language: de
  text: Doch wenn ich zu dir schreie[a], geh nicht schweigend an mir vorüber.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, formnäher: „wenn ich zu dir geschrien habe, geh nicht schweigend an mir vorüber.“'
    reason: Bewahrt als Übersetzungsalternative den formalen Perfektaspekt von κεκραγέναι.
lexical_decisions:
- source_word: ἐὰν δὲ
  choice: Doch wenn
  rationale: Bewahrt sowohl die Bedingung als auch die leicht kontrastierende beziehungsweise weiterführende Funktion von δέ und klingt in einem Gebet natürlich.
- source_word: κεκραγέναι με
  choice: ich zu dir schreie
  rationale: Das Akkusativ-mit-Infinitiv-Gefüge wird im Deutschen idiomatisch als finiter Bedingungssatz wiedergegeben. Obwohl κεκραγέναι formal ein Perfektinfinitiv ist, vermeidet das Präsens eine im Deutschen zu stark abgeschlossene Zeitbedeutung; die formnähere Möglichkeit wird in der Fußnote genannt.
- source_word: πρὸς σέ
  choice: zu dir
  rationale: Bei einem persönlichen Gegenüber und im Gebetskontext gibt „zu dir“ die Ausrichtung des Rufens natürlich und genau wieder.
- source_word: μὴ παρασιωπήσῃς
  choice: schweige … nicht
  rationale: Die Wiedergabe erhält das konkrete Bild des Schweigens und vermeidet die stärker deutende Übersetzung „ignoriere mich nicht“.
- source_word: ἀπʼ ἐμοῦ
  choice: mir gegenüber
  rationale: Das griechische ἀπό ist hier im Deutschen nicht sinnvoll mit einem bloßen „von mir“ wiederzugeben. „Mir gegenüber“ bezeichnet verständlich, dass sich Gottes Schweigen auf den Beter richtet, ohne bereits allgemein als „nicht erhören“ zu interpretieren.
