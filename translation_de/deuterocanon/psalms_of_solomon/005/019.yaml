lexical_decisions:
- source_word: ἐὰν
  choice: Wenn
  rationale: Leitet einen Bedingungssatz ein und entspricht in einer allgemeinen Sentenz natürlichem modernem Deutsch.
- source_word: ὑπερπλεονάσῃ
  choice: übermäßig viel hat
  rationale: Gibt das Überschreiten eines angemessenen Maßes wieder, ohne den Ausdruck auf Habgier oder ein anderes ausdrücklich nicht genanntes inneres Motiv festzulegen.
- source_word: ὁ ἄνθρωπος
  choice: ein Mensch
  rationale: Der bestimmte Artikel hat hier generische Funktion. „Ein Mensch“ formuliert die allgemeine Aussage im Deutschen natürlich und bewahrt den umfassenden Sinn von ἄνθρωπος.
- source_word: ἐξαμαρτάνει
  choice: sündigt
  rationale: Gibt die klare moralische Bedeutung des Verbs knapp und idiomatisch wieder; eine Wiedergabe wie „verfehlt sich“ wäre hier unnötig unbestimmt.
theological_decisions:
- issue: Ob der übermäßige Besitz ausdrücklich als Habgier oder Habsucht gedeutet werden soll
  choice: 'Die allgemeine Aussage über das Übermaß bleibt stehen: „Wenn ein Mensch übermäßig viel hat, sündigt er.“'
  alternative: Wenn ein Mensch habgierig ist, sündigt er.
  rationale: Der griechische Text verbindet das Übermaß mit Sünde, benennt aber weder Habgier noch ein bestimmtes inneres Motiv. Die Übersetzung bewahrt diese theologische und ethische Spannung.
translation_notes:
  register: Knappe, sentenzartige Formulierung in modernem Standarddeutsch. „Ein Mensch“ ist als generischer Ausdruck natürlich und allgemein verständlich; „übermäßig viel hat“ wahrt den Gedanken des überschrittenen Maßes.
