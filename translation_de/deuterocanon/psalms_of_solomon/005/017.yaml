    issue: Unklare Stellung der Präpositionalphrase „in Güte“
    rationale: In „reicht in Güte über“ wirkt „in Güte“ im Deutschen weniger natürlich und kann unnötig eng als Art des Reichens verstanden werden. Eine Umstellung mit „erstreckt sich“ verbessert die Lesbarkeit, ohne die offene modale Beziehung des griechischen Dativs aufzulösen.
  revised_text: Dein Erbarmen erstreckt sich, Herr, in Güte über die ganze Erde.
