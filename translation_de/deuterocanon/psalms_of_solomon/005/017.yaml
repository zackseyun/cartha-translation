  text: Dein Erbarmen erstreckt sich, Herr, in Güte über die ganze Erde.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεός
  choice: Erbarmen
  rationale: ἔλεος bezeichnet barmherzige Zuwendung. »Erbarmen« bewahrt das Gewicht des Substantivs und vermeidet, ausdrücklichere bundestheologische Nuancen einzutragen.
- source_word: ἐπὶ πᾶσαν τὴν γῆν
  choice: über die ganze Erde
  rationale: ἐπί mit dem Akkusativ bezeichnet hier die Ausdehnung über den gesamten Bereich. Die deutsche Wendung gibt diesen weltweiten Umfang natürlich wieder.
- source_word: Κύριε
  choice: Herr
  rationale: Der Vokativ wird durch die direkte Anrede »Herr« wiedergegeben; ein zusätzliches »O« ist im heutigen Standarddeutsch nicht nötig.
- source_word: χρηστότητι
  choice: in Güte
  rationale: χρηστότης kann Güte, Freundlichkeit oder Wohlwollen bezeichnen. »In Güte« wahrt die knappe modale Formulierung des Griechischen, ohne sie stärker auszudeuten.
- source_word: '[implizite Kopula]'
  choice: reicht
  rationale: Der griechische Satz ist verblos. »Reicht« macht im Deutschen die durch ἐπί mit Akkusativ ausgedrückte Erstreckung idiomatisch sichtbar, ohne ihren Umfang einzuschränken.
theological_decisions: []
translation_notes:
  register: Poetisch, würdevoll und zugleich in modernem Standarddeutsch verständlich. Die Voranstellung der Anrede schafft einen natürlichen deutschen Gebetsrhythmus; die knappe Wendung »in Güte« bewahrt die leichte syntaktische Offenheit des Originals.
