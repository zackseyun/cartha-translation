  text: Those who fear the Lord rejoiced in good things[a], and your goodness is upon Israel[c][b], your kingdom.
translation:
  language: de
  text: Die den Herrn fürchten, wurden durch Gutes erfreut[a], und deine Güte ruht auf Israel in deinem Reich.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „freuten sich über das Gute“; auch: „wurden durch gute Gaben“ oder „durch Segnungen erfreut“.'
    reason: lexical_alternative
  - marker: b
    text: 'Die knappe griechische Schlusswendung kann auch verstanden werden: „und deine Güte ruht auf Israel, deinem Reich“; damit würde Israel als Gottes Reich bezeichnet.'
    reason: alternative_reading
lexical_decisions:
- source_word: ηὐφράνθησαν
  choice: wurden … froh
  rationale: Die Form ist Aorist Passiv und bezeichnet, dass die Betreffenden erfreut oder froh gemacht wurden. Die deutsche Wendung bewahrt diesen resultativen Sinn natürlicher als das schwerfällige „wurden erfreut“.
- source_word: οἱ φοβούμενοι Κύριον
  choice: die den Herrn fürchten
  rationale: Das substantivierte Partizip bezeichnet Menschen, die von ehrfürchtiger Haltung gegenüber Gott geprägt sind. „Den Herrn fürchten“ ist transparent und traditionsnah, ohne den Begriff auf bloße Angst einzuengen.
- source_word: ἐν ἀγαθοῖς
  choice: an Gutem
  rationale: 'Der substantivierte Plural bleibt bewusst weit: Er kann gute Gaben, Wohltaten oder Segnungen bezeichnen. „An Gutem“ wahrt diese Offenheit und verbindet sich idiomatisch mit „froh werden“.'
- source_word: ἡ χρηστότης σου
  choice: deine Güte
  rationale: „Güte“ gibt den umfassenden wohltätigen und wohlwollenden Sinn von χρηστότης in würdigem, geläufigem Deutsch wieder.
- source_word: ἐπʼ Ἰσραήλ
  choice: ruht auf Israel
  rationale: Das im Griechischen elliptische „ist auf Israel“ wird im Deutschen mit „ruht auf“ natürlich ausgedrückt und bewahrt das Bild einer Israel zuteilwerdenden göttlichen Güte.
- source_word: τῇ βασιλείᾳ σου
  choice: in deinem Königreich
  rationale: Der Dativ wird als Angabe des Bereichs verstanden. Diese Fassung respektiert die ausdrücklich markierte Dativform und vermeidet, sie grammatisch vorschnell als Apposition zu dem von ἐπί abhängigen Ἰσραήλ festzulegen.
theological_decisions:
- issue: Verhältnis von Israel und Gottes Königreich
  choice: „auf Israel in deinem Königreich“ versteht τῇ βασιλείᾳ σου als Bereichsangabe.
  alternative: „auf Israel, dein Königreich“ versteht die Schlusswendung als Identifizierung Israels mit Gottes Königreich.
  rationale: Die knappe griechische Wortfolge lässt das syntaktische Verhältnis offen, während die Dativform eher für eine Bereichsangabe spricht. Da die alternative Deutung theologisch bedeutsam ist und in der Überlieferung vertreten wird, wird sie in einer Fußnote erhalten statt im Haupttext ausgeschlossen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bleibt nahe am griechischen Parallelismus; ungebräuchliche Wörtlichkeit wird vermieden. Die genuine syntaktische und theologische Mehrdeutigkeit der Schlusswendung wird nicht stillschweigend beseitigt, sondern durch eine Fußnote offengehalten.
