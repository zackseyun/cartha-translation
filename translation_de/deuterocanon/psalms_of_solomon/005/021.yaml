- from: Die den Herrn fürchten, wurden an Gutem froh[a], und deine Güte ruht auf Israel in deinem Königreich.[b]
  to: Die den Herrn fürchten, wurden durch Gutes erfreut[a], und deine Güte ruht auf Israel in deinem Reich.[b]
