base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/005/001.yaml
  text: O Lord God[a], I will praise your name with exultation, in the midst of those who know your righteous judgments.
translation:
  language: de
  text: Herr, Gott, ich will deinen Namen mit Jubel preisen, inmitten derer, die deine gerechten Urteile kennen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: die deine gerechten Urteile verstehen.'
    reason: Lexikalische Alternative für ἐπισταμένων; das Verb kann sowohl „kennen“ als auch „verstehen“ bedeuten.
lexical_decisions:
- source_word: Κύριε ὁ θεός
  choice: Herr, Gott
  rationale: Die direkte göttliche Anrede wird ohne ein im Griechischen nicht vorhandenes Possessivpronomen wiedergegeben. Die Apposition bleibt in der knappen, feierlichen Anrede „Herr, Gott“ erhalten.
- source_word: αἰνέσω
  choice: ich will … preisen
  rationale: Das Futur bezeichnet hier eine Erklärung oder einen Entschluss des Beters. „Ich will … preisen“ klingt im Deutschen natürlich und bewahrt diese voluntative Zukunftsbedeutung.
- source_word: τῷ ὀνόματί σου
  choice: deinen Namen
  rationale: Die wörtliche Wiedergabe erhält die biblische Redeweise, in der Gottes Name für seine offenbarte Person und sein Ansehen steht.
- source_word: ἐν ἀγαλλιάσει
  choice: mit Jubel
  rationale: Die Wendung bezeichnet freudige, überschwängliche Weise. „Mit Jubel“ ist gegenwärtig, verständlich und zugleich würdevoll.
- source_word: ἐν μέσῳ
  choice: inmitten derer
  rationale: Die Formulierung bewahrt gegenüber dem ebenfalls möglichen „unter denen“ das räumlich-gemeinschaftliche Bild des griechischen Ausdrucks.
- source_word: ἐπισταμένων
  choice: die … kennen
  rationale: Das Partizip von ἐπίσταμαι kann Wissen, Vertrautheit oder Verstehen ausdrücken. „Kennen“ ist knapp und lässt den Gegenstandsbezug auf Gottes Urteile natürlich erscheinen.
- source_word: τὰ κρίματά σου τὰ δίκαια
  choice: deine gerechten Urteile
  rationale: κρίματα bezeichnet gerichtliche Entscheidungen oder richterliche Taten Gottes; δίκαια kennzeichnet sie als gerecht. Die deutsche Wortgruppe erhält sowohl den juristischen als auch den moralisch-theologischen Gehalt.
