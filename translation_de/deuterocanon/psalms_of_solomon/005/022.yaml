  text: Gepriesen sei die Herrlichkeit des Herrn, denn er selbst ist unser König.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐλογημένη
  choice: Gepriesen sei
  rationale: Das prädikativ gebrauchte Adjektiv bildet mit einer ergänzten Kopula eine doxologische Segens- und Lobformel. „Gepriesen sei“ klingt im Deutschen natürlich und bewahrt den benediktorischen Charakter.
- source_word: δόξα
  choice: Herrlichkeit
  rationale: „Herrlichkeit“ ist die direkte und im biblisch-theologischen Sprachgebrauch etablierte Wiedergabe; sie kann sowohl göttlichen Glanz als auch Ehre umfassen.
- source_word: Κυρίου
  choice: des Herrn
  rationale: Der griechische Text bietet κύριος; daher wird entsprechend der Projektkonvention „Herr“ verwendet, ohne die Schreibweise für den hebräischen Gottesnamen einzuführen.
- source_word: ὅτι
  choice: denn
  rationale: „Denn“ gibt die begründende beziehungsweise erläuternde Funktion wieder und passt zum würdigen doxologischen Stil.
- source_word: αὐτὸς
  choice: er selbst
  rationale: Das ausdrücklich gesetzte Pronomen trägt einen intensiven Akzent. „Er selbst“ bewahrt diese Betonung, ohne die nicht ausdrücklich ausgesagte Bedeutung „er allein“ hinzuzufügen.
- source_word: βασιλεὺς
  choice: König
  rationale: „König“ ist die unmittelbare Grundbedeutung und erhält das königliche Bekenntnis des Satzes.
