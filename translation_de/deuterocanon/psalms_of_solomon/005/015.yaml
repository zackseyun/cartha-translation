translation:
  language: de
  text: Die Güte eines Menschen ist sparsam und für morgen; und wenn er sie ein zweites Mal ohne Murren erweist, wirst du auch darüber staunen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich und unter Wahrung der knappen Ellipse auch: „Die Güte eines Menschen ist sparsam und morgen.“ Der griechische Ausdruck um „morgen“ ist verkürzt; möglicherweise ist gemeint, dass die Güte nur sparsam erwiesen und bis morgen aufgeschoben wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: χρηστότης
  choice: Güte
  rationale: Das Wort bezeichnet Güte oder Freundlichkeit. „Güte“ bewahrt hier den moralischen, leicht gehobenen Ton und lässt im Zusammenhang eine konkrete Wohltat anklingen.
- source_word: ἀνθρώπου
  choice: eines Menschen
  rationale: Der griechische Genitiv Singular bezeichnet hier sprichwörtlich den menschlichen Geber; „eines Menschen“ ist im modernen Deutschen natürlich und bleibt numerisch singular.
- source_word: ἐν φειδῷ
  choice: ist sparsam
  rationale: Die Wendung drückt Beschränkung oder geringe Bemessung aus. „ist sparsam“ erhält die knappe Aussage, ohne sie zur ausdrücklich scharfen Verurteilung als Geiz zu steigern.
- source_word: ἡ αὔριον
  choice: auf morgen verschoben
  rationale: Das isolierte αὔριον ist elliptisch. Die Wiedergabe macht den im Kontext naheliegenden Aufschub verständlich, während eine Fußnote die sprachliche Kürze und eine formalere Alternative dokumentiert.
- source_word: δευτερώσῃ
  choice: sie ein zweites Mal … erweist
  rationale: Das Verb bedeutet, etwas ein zweites Mal zu tun. Das ergänzte Pronomen bezieht den Vorgang natürlich auf die Güte beziehungsweise Wohltat zurück.
- source_word: γογγυσμοῦ
  choice: Murren
  rationale: „Murren“ gibt widerwillige, halblaute Klage treffend wieder und passt zum würdigen sprichwörtlichen Register.
- source_word: θαυμάσεις
  choice: wirst du … staunen
  rationale: Die zweite Person Singular und der Zukunftsbezug werden direkt bewahrt; „staunen“ ist im heutigen Deutsch natürlicher als „sich verwundern“.
