  source_fidelity: Die Wiedergabe von αὔριον als „auf morgen verschoben“ legt einen Aufschub als Aussage des Haupttexts fest. Das isolierte griechische αὔριον („morgen/für morgen“) ist jedoch elliptisch; ein solcher Aufschub kann gemeint sein, ist aber nicht ausdrücklich gesagt. Die Ellipse sollte im Haupttext erkennbar bleiben. Die konditionale Wiederholung „wenn er sie ein zweites Mal ohne Murren erweist“ gibt δευτερώσῃ ἄνευ γογγυσμοῦ angemessen wieder.
  naturalness: „Die Güte eines Menschen ist sparsam und für morgen“ ist bewusst knapp und elliptisch, aber als sprichwörtliche Aussage im Deutschen verständlich. „Auch darüber wirst du staunen“ ist idiomatischer und bildet καὶ τοῦτο klarer ab als „wirst du selbst darüber staunen“.
  terminology: „Güte“, „Murren“ und „staunen“ sind für χρηστότης, γογγυσμός und θαυμάσεις treffend und registergerecht. „eines Menschen“ wahrt den generischen Singular ohne unnötige Geschlechtsfestlegung.
