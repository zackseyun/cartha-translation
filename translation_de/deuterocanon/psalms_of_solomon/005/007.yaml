  text: When we are afflicted[a], we will call for help, and you will not turn away our plea[b], for you are our God.
translation:
  language: de
  text: Wenn wir bedrängt werden, werden wir um Hilfe rufen, und du wirst unsere Bitte[a] nicht abweisen, denn du bist unser Gott.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „unser Flehen“.'
