lexical_decisions:
- source_word: ἐν τῷ θλίβεσθαι ἡμᾶς
  choice: Wenn wir bedrängt werden
  rationale: Die Konstruktion ἐν mit substantiviertem Infinitiv ist hier temporal. Das Passiv θλίβεσθαι bezeichnet Bedrängnis oder Bedrückung, ohne deren Ursache genauer festzulegen.
- source_word: ἐπικαλεσόμεθα εἰς βοήθειαν
  choice: werden wir um Hilfe rufen
  rationale: Die Wendung beschreibt den künftigen Hilferuf. „Um Hilfe rufen“ gibt im Deutschen sowohl den Anruf als auch sein Ziel natürlich und prägnant wieder.
- source_word: οὐκ ἀποστρέψῃ
  choice: du wirst … nicht abweisen
  rationale: ἀποστρέφω kann bildhaft „abwenden“ bedeuten; bei einer Bitte ist „abweisen“ im Deutschen idiomatisch und wahrt den Gedanken, dass Gott das Ersuchen nicht zurückweist.
- source_word: τὴν δέησιν ἡμῶν
  choice: unsere Bitte
  rationale: δέησις bezeichnet ein ernstes, konkretes Ersuchen. „Bitte“ ist gegenwärtiges, verständliches Deutsch; „Flehen“ ist als stärker akzentuierte Alternative in der Fußnote vermerkt.
- source_word: ὅτι σὺ ὁ θεὸς ἡμῶν εἶ
  choice: denn du bist unser Gott
  rationale: ὅτι begründet die Zuversicht der Betenden. „Denn“ erhält diesen kausalen Zusammenhang und passt zum würdigen Gebetsstil.
