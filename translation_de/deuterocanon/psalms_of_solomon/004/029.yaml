  text: May your mercy, O Lord, be upon all who love you.
translation:
  language: de
  text: Deine Barmherzigkeit, Herr, sei über allen, die dich lieben.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γένοιτο
  choice: sei
  rationale: Der Aorist-Optativ von γίνομαι formuliert hier einen Wunsch beziehungsweise eine Bitte. Das deutsche „sei“ gibt diese Gebetssprache knapp, würdig und natürlich wieder.
- source_word: Κύριε
  choice: Herr
  rationale: Der Vokativ von κύριος ist eine direkte Anrede Gottes. „Herr“ entspricht dem üblichen biblischen Sprachgebrauch, ohne den Ausdruck interpretierend zu erweitern.
- source_word: τὸ ἔλεός σου
  choice: deine Barmherzigkeit
  rationale: ἔλεος bezeichnet Erbarmen oder Barmherzigkeit. „Barmherzigkeit“ ist hier die direkte, in Gebetssprache geläufige Wiedergabe.
- source_word: ἐπὶ πάντας
  choice: über allen
  rationale: ἐπί mit Akkusativ bezeichnet hier die Ausrichtung beziehungsweise das Kommen der erbetenen Barmherzigkeit auf die genannten Menschen. „über allen“ bewahrt die räumliche Bildlichkeit und den feierlichen Gebetston.
- source_word: τοὺς ἀγαπῶντάς σε
  choice: die dich lieben
  rationale: Das substantivierte Präsenspartizip bezeichnet alle, die durch ihre Liebe zu Gott gekennzeichnet sind. Der deutsche Relativsatz ist genau und idiomatisch.
theological_decisions:
- issue: Wiedergabe von κύριος in der direkten Anrede Gottes
  choice: Herr
  alternative: Gebieter
  rationale: „Herr“ bewahrt die biblische Kontinuität und den Sinn der Gottesbezeichnung, ohne eine zusätzliche theologische Deutung einzutragen.
translation_notes:
  register: Moderne standarddeutsche Gebetssprache mit würdigem, knappem Satzbau. Die Voranstellung von „Deine Barmherzigkeit“ und der Optativ „sei“ bewahren Nachdruck und Bittcharakter des griechischen Textes.
