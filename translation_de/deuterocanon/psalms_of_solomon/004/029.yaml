  naturalness: Der Satz ist knapp, verständlich und für moderne standarddeutsche Gebetssprache angemessen würdig. Die Stellung von „Herr“ als Anrede und der Konjunktiv „sei“ sind natürlich und nicht unnötig archaisierend.
