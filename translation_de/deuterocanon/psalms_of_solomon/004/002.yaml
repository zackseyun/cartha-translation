  - severity: low
    issue: Die finite Wiedergabe „verurteilt“ glättet κατακρῖναι.
    rationale: Der griechische Text setzt einen Infinitiv. Eine nominale Infinitivkonstruktion im Deutschen erhält die knappe Charakterisierung und den Aspekt der Tätigkeit besser.
