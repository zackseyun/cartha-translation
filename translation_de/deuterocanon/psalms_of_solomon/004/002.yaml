  source_fidelity: Die wiederholte Charakterisierung durch περισσός wird grundsätzlich zutreffend wiedergegeben. Die finite Form „verurteilt“ gibt jedoch das griechische Infinitivgefüge κατακρῖναι weniger genau wieder. „Selbstdarstellung“ ist als Deutung von σημείωσις enger als der offenere Sinn von auffälligem bzw. äußerem Auftreten.
  naturalness: Der Entwurf ist gut verständlich und angemessen würdig. Die Wiederholung von „übermäßig“ funktioniert, doch „mit harten Worten Sünder im Gericht verurteilt“ ist syntaktisch gegenüber dem griechischen Infinitiv weniger transparent.
  terminology: „Sünder“ und „im Gericht“ sind passend und legen weder die Art des Gerichts noch eine endgültige Verdammnis fest. „Äußeres Auftreten“ wahrt bei σημείωσις die Zurückhaltung des Ausgangstextes besser als „Selbstdarstellung“.
