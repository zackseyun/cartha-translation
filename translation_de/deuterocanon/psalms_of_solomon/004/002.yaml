  yaml_path: translation/deuterocanon/psalms_of_solomon/004/002.yaml
  text: Excessive in speech, excessive in outward show above all others, the one harsh in speech to condemn sinners in judgment.
translation:
  language: de
  text: Übermäßig im Reden, übermäßig im äußeren Auftreten vor allen anderen, hart in seinen Worten beim Verurteilen von Sündern im Gericht.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: περισσὸς ἐν λόγοις
  choice: übermäßig im Reden
  rationale: Bewahrt die wiederholte Aussage des griechischen Textes und gibt λόγοις natürlich als mündliches Reden wieder.
- source_word: περισσὸς ἐν σημειώσει
  choice: übermäßig in seiner Selbstdarstellung
  rationale: σημείωσις bezeichnet hier wahrscheinlich auffälliges Zur-Schau-Stellen beziehungsweise demonstratives Auftreten; „Selbstdarstellung“ vermittelt dies im modernen Deutsch, ohne die Wendung auf ein bestimmtes äußeres Merkmal festzulegen.
- source_word: ὑπὲρ πάντας
  choice: mehr als alle anderen
  rationale: Gibt den Vergleich idiomatisch und eindeutig wieder.
- source_word: ὁ σκληρὸς ἐν λόγοις
  choice: er, der mit harten Worten
  rationale: σκληρός bezeichnet Härte; die Formulierung erhält den substantivierten Charakter und vermeidet das weniger natürliche „hart im Reden“.
- source_word: κατακρῖναι
  choice: verurteilt
  rationale: Das Verb bezeichnet ein verurteilendes Urteil beziehungsweise Schuldigsprechen.
- source_word: ἐν κρίσει
  choice: im Gericht
  rationale: Bewahrt die mögliche forensische oder gerichtliche Bedeutung von κρίσις, ohne sie näher zu bestimmen.
theological_decisions:
- issue: Bezug von „Sünder“ und Art des Gerichts
  choice: Sünder im Gericht verurteilt
  alternative: Sünder mit einem Urteil verdammt
  rationale: Die Übersetzung wahrt die knappe griechische Konstruktion und legt weder fest, ob ein menschliches oder göttliches Gericht gemeint ist, noch ob es um endgültige Verdammnis geht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die zweimalige Wiederholung von „übermäßig“ bildet die rhetorische Wiederholung von περισσός ab; der Gedankenstrich macht den Übergang zur charakterisierenden Aussage lesbar.
