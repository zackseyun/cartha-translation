base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/004/003.yaml
  text: And his hand is among the first against him[a], as if in zeal, but he himself is guilty in a variety of sinful deeds[d][c][b], in acts of self-indulgence.
translation:
  language: de
  text: Und seine Hand richtet sich als eine der ersten gegen ihn[a], gleichsam aus Eifer[b]; er selbst aber ist schuldig an vielerlei sündigen Taten[c], an Ausschweifungen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Und seine Hand ist zuerst auf ihm“, wenn ἐν πρώτοις zeitlich statt als Vorrang unter den gegen ihn Handelnden verstanden wird.'
    reason: alternative_reading
  - marker: b
    text: 'Auch möglich: „wie im Eifer“ oder „als wäre er voll Eifer“. Die Wendung kann Eifer beschreiben, aber auch dessen Anschein oder Zurschaustellung andeuten.'
    reason: lexical_alternative
  - marker: c
    text: Die griechische Form kann auch als „der Sünder“ verstanden werden; der Ausdruck ist knapp und grammatisch mehrdeutig. Hier wird ἁμαρτωλῶν als substantiviertes Neutrum im Sinn von „sündige Dinge/Taten“ aufgefasst.
    reason: grammatical_alternative
lexical_decisions:
- source_word: χείρ
  choice: Hand
  rationale: Die wörtliche Wiedergabe bewahrt das anschauliche Bild und passt zur Wendung, dass jemand seine Hand gegen einen anderen richtet.
- source_word: ἐν πρώτοις
  choice: unter den Ersten
  rationale: Im Zusammenhang bezeichnet die Wendung am ehesten den Vorrang oder besonderen Eifer beim Vorgehen gegen den Verurteilten; die zeitliche Deutung bleibt in einer Fußnote erhalten.
- source_word: ἐπʼ αὐτόν
  choice: gegen ihn
  rationale: In Verbindung mit „Hand“ gibt die adversative Wiedergabe die gegen eine Person gerichtete Handlung natürlich wieder.
- source_word: ὡς ἐν ζήλει
  choice: wie aus Eifer
  rationale: Die Formulierung bewahrt das vergleichende ὡς und lässt offen, ob der Eifer echt, vermeintlich oder nur zur Schau gestellt ist.
- source_word: ἔνοχος
  choice: hat sich … schuldig gemacht
  rationale: Die idiomatische deutsche Formulierung erhält den forensisch-moralischen Sinn und verbindet sich natürlich mit den folgenden Verfehlungen.
- source_word: ποικιλίᾳ
  choice: vielerlei
  rationale: Das Wort bringt die Vielfalt beziehungsweise Mannigfaltigkeit der Verfehlungen in knappem, modernem Deutsch zum Ausdruck.
- source_word: ἁμαρτωλῶν
  choice: sündige Taten
  rationale: Die Form kann als substantiviertes neutrales Plural „sündige Dinge/Taten“ verstanden werden; diese Deutung passt als Beschreibung eigener Verfehlungen und parallelisiert die folgenden Ausschweifungen.
- source_word: ἀκρασίαις
  choice: Ausschweifungen
  rationale: Der Plural bezeichnet konkrete Formen zügelloser Selbsthingabe oder mangelnder Selbstbeherrschung; „Ausschweifungen“ ist knapp, würdig und moralisch gewichtig.
theological_decisions:
- issue: Echtheit des bezeichneten Eifers
  choice: Die Übersetzung „wie aus Eifer“ lässt offen, ob es sich um echten oder nur vorgeblichen Eifer handelt.
  alternative: „als ob er eifrig wäre“ würde den Eifer ausdrücklich als bloßen Schein kennzeichnen.
  rationale: Das griechische ὡς kann im polemischen Kontext einen Anschein nahelegen, erzwingt aber keine eindeutige Festlegung auf Heuchelei.
- issue: Bezug von ἁμαρτωλῶν
  choice: 'Als substantiviertes Neutrum: „sündige Taten“.'
  alternative: 'Als maskuliner Genitiv Plural: „von Sündern“, etwa „in den vielfältigen Wegen von Sündern“.'
  rationale: Die neutrale Analyse ergibt im unmittelbaren Zusammenhang eine klare Aussage über die eigenen Verfehlungen des Angeklagten und steht gut parallel zu ἐν ἀκρασίαις, ohne die formal mögliche maskuline Deutung zu verschweigen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das Körperbild „seine Hand … gegen ihn“ bleibt erhalten. Die knappe, anklagende Satzstruktur des Griechischen wird bewahrt, während „hat sich … schuldig gemacht“ und „vielerlei sündige Taten“ im Deutschen natürlich lesbar sind.
