  source_fidelity: 'Die Grunddeutung ist tragfähig: ἁμαρτωλῶν kann hier substantiviertes Neutrum sein und bezeichnet dann sündige Dinge bzw. Taten, passend zu den folgenden ἀκρασίαις. Auch die zurückhaltende Wiedergabe von ὡς ἐν ζήλει wahrt die Nuance des Vergleichs. Allerdings ist „seine Hand ist unter den Ersten“ im Deutschen semantisch und bildlich unklar, weil eine Hand nicht idiomatisch „unter den Ersten“ steht. Die Vorrangigkeit des gegen ihn gerichteten Handelns sollte ausdrücklich an die Handlung der Hand gebunden werden.'
  naturalness: Der zweite Satzteil ist verständlich und im würdigen modernen Standarddeutsch gut lesbar. „Seine Hand richtet sich als eine der ersten gegen ihn“ bewahrt das Körperbild und klingt wesentlich natürlicher als die vorliegende Konstruktion. „Er selbst aber ist schuldig an“ ist zudem näher an ἔνοχος als die reflexive Umschreibung „hat sich ... schuldig gemacht“.
  terminology: „Ausschweifungen“ gibt ἀκρασίαις angemessen als konkrete zügellose Verfehlungen wieder. „Sündige Taten“ ist im Kontext eine vertretbare, nicht konfessionell festgelegte Auflösung von ἁμαρτωλῶν. Die Fußnote muss die grammatische Alternative erhalten, ohne die gewählte Deutung als zwingend darzustellen.
