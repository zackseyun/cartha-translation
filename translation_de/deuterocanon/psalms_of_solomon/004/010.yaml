base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/004/010.yaml
  text: And their eyes are on a man's house in prosperity[a], like a snake[d][c][b], to undo one another's wisdom with lawless words.
translation:
  language: de
  text: Und ihre Augen sind, wie die einer Schlange, auf das Haus[a] eines Mannes gerichtet, der in gesicherten Verhältnissen lebt[b], um mit den Worten von Gesetzlosen die Weisheit des jeweils anderen zunichtezumachen[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Haus“ kann hier auch den Haushalt, die Familie oder den Besitz eines Mannes bezeichnen.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher auch: „in Beständigkeit“ oder „in Sicherheit“; das griechische Wort kann einen festen, gesicherten Zustand oder Wohlergehen bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „aufzulösen“, „zu zerstören“ oder „zu Fall zu bringen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ ὀφθαλμοὶ αὐτῶν
  choice: ihre Augen
  rationale: Die wörtliche Wiedergabe bewahrt das eindringliche Körperbild und den anklagenden Ton.
- source_word: ἐπʼ οἶκον ἀνδρὸς
  choice: auf das Haus eines Mannes gerichtet
  rationale: Die Wendung bleibt nah am griechischen Bild; „Haus“ kann dabei über das Gebäude hinaus Haushalt, Familie oder Besitz bezeichnen.
- source_word: ἐν εὐσταθείᾳ
  choice: der in gesicherten Verhältnissen lebt
  rationale: εὐστάθεια bezeichnet Festigkeit, Stabilität oder einen gesicherten guten Zustand. Die Formulierung ist im Deutschen natürlich und lässt materiellen Wohlstand ebenso wie allgemeine Sicherheit anklingen.
- source_word: ὡς ὄφις
  choice: wie eine Schlange
  rationale: „Schlange“ ist die natürliche moderne Entsprechung und bewahrt den bedrohlichen Vergleich.
- source_word: διαλῦσαι
  choice: zunichtezumachen
  rationale: Der Infinitiv bezeichnet den Zweck; die Wahl gibt das Auflösen, Zerstören oder Untergraben wieder, ohne sich auf einen rein körperlichen Vorgang festzulegen.
- source_word: σοφίαν ἀλλήλων
  choice: die Weisheit des jeweils anderen
  rationale: Die Formulierung bewahrt sowohl σοφία als „Weisheit“ als auch den reziproken Sinn von ἀλλήλων.
- source_word: ἐν λόγοις παρανόμων
  choice: mit den Worten von Gesetzlosen
  rationale: παρανόμων ist Genitiv Plural und substantivisch zu verstehen, nicht als mit λόγοις kongruierendes Adjektiv. Daher sind es die Worte gesetzloser Menschen, nicht grammatisch „gesetzlose Worte“.
theological_decisions:
- issue: Bezug von ὡς ὄφις
  choice: Der Vergleich bleibt in der griechischen Satzstellung nach der Zielangabe stehen.
  alternative: Den Vergleich ausdrücklich auf die handelnden Personen oder auf ihr Lauern beziehen.
  rationale: Der genaue syntaktische Bezug ist im knappen griechischen Satz nicht eindeutig. Die Übersetzung erklärt ihn daher nicht über den Wortlaut hinaus.
- issue: Reziproker Ausdruck σοφίαν ἀλλήλων
  choice: die Weisheit des jeweils anderen
  alternative: einander die Weisheit; die Weisheit untereinander
  rationale: Die gewählte Fassung erhält die gegenseitige Beziehung, ohne festzulegen, welche konkrete Gruppe innerhalb des weiteren Zusammenhangs gemeint ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die markante Bildsprache und die syntaktische Spannung des griechischen Textes bleiben erhalten; zugleich wird der Genitiv παρανόμων grammatisch korrekt als „von Gesetzlosen“ wiedergegeben.
