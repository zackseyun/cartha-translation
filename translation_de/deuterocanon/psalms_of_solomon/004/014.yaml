  text: He reasoned falsely in words[a], “There is no one who sees and judges.”
translation:
  language: de
  text: 'Er zog mit Worten einen falschen Schluss[a]: »Es gibt niemanden, der sieht und richtet.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Er täuschte sich selbst durch Worte.«'
    reason: 'Lexikalische Alternative: Die mediale Verbform kann ausdrücklich als Selbsttäuschung verstanden werden.'
lexical_decisions:
- source_word: παρελογίσατο
  choice: zog … einen falschen Schluss
  rationale: Die Wiedergabe bewahrt den gedanklichen Aspekt des Verbs und bezeichnet eine fehlerhafte oder trügerische Schlussfolgerung, ohne eindeutig festzulegen, ob die Täuschung gegen die eigene Person oder gegen andere gerichtet ist.
- source_word: ἐν λόγοις
  choice: mit Worten
  rationale: Die Präpositionalphrase wird eng am Griechischen wiedergegeben und zugleich natürlich in den deutschen Satz eingebunden.
- source_word: ὁρῶν
  choice: der sieht
  rationale: Das substantivisch gebrauchte Präsenspartizip wird idiomatisch als Relativsatz wiedergegeben; das Präsens bleibt erhalten.
- source_word: κρίνων
  choice: richtet
  rationale: Das Partizip steht parallel zu ὁρῶν und bezeichnet hier am ehesten richterliche oder moralische Beurteilung. »Richtet« bewahrt dieses gewichtige Bedeutungsfeld.
theological_decisions:
- issue: Unausgesprochenes Subjekt der Partizipien ὁρῶν und κρίνων
  choice: Es gibt niemanden, der sieht und richtet
  alternative: Er sieht und richtet nicht
  rationale: Der griechische Wortlaut verneint am natürlichsten die Existenz eines beobachtenden und richtenden Gegenübers, ohne Gott ausdrücklich zu nennen. Die Übersetzung erhält diese Offenheit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Formulierung ist verständlich und bleibt nahe an der knappen griechischen Aussage; die direkte Rede gibt den mit ὅτι eingeleiteten Gedanken natürlich wieder.
