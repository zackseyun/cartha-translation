base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/004/025.yaml
  text: And they provoked God[a], and stirred him up to remove them from the land[c][b], because by deceit they pretended to be innocent people.
translation:
  language: de
  text: Und sie reizten Gott zum Zorn und stachelten ihn dazu an, sie aus dem Land[a] zu entfernen; denn durch Täuschung gaben sie sich als unschuldige Menschen aus.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »von der Erde«; γῆ kann sowohl »Land« als auch »Erde« bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich etwa: »Seelen Unschuldiger«; gemeint sein können auch »unschuldige Menschen« oder »unschuldige Leben«. Der Satz kann außerdem bedeuten: »Sie spielten die Rolle Unschuldiger.«'
    reason: alternative_reading
lexical_decisions:
- source_word: παρώργυσαν
  choice: reizten Gott zum Zorn
  rationale: Die Wendung gibt die Bedeutung des Verbs ausdrücklich und im Deutschen natürlich wieder.
- source_word: παρώξυναν
  choice: stachelten ihn dazu an
  rationale: Das Verb steigert den vorherigen Vorwurf und bezieht sich mit dem folgenden Infinitiv auf Gottes richterliches Handeln.
- source_word: ἐξᾶραι αὐτοὺς ἀπὸ τῆς γῆς
  choice: sie aus dem Land zu entfernen
  rationale: ἐξαίρω bezeichnet das Wegnehmen oder Beseitigen und kann im Gerichtskontext eine vernichtende Färbung haben; »entfernen« wahrt diese Möglichkeit, ohne sie zu erzwingen.
- source_word: ψυχὰς ἀκάκων
  choice: unschuldige Menschen
  rationale: ψυχή kann stellvertretend für eine Person oder ein Leben stehen; die idiomatische Wiedergabe bezeichnet hier Menschen, die als unschuldig beziehungsweise arglos erscheinen.
- source_word: παραλογισμῷ
  choice: durch Täuschung
  rationale: Das Substantiv bezeichnet hier eine betrügerische Irreführung oder List, nicht bloß einen Fehlschluss.
- source_word: ὑπεκρίνοντο
  choice: gaben sie sich als … aus
  rationale: Die mediale Verbform beschreibt ein geheucheltes Auftreten oder das Spielen einer Rolle; die deutsche Wendung bringt diesen Sinn klar zum Ausdruck.
theological_decisions:
- issue: Art und Ziel des göttlichen Gerichts
  choice: zu entfernen
  alternative: auszurotten
  rationale: Der griechische Ausdruck kann ein gewaltsames oder endgültiges Beseitigen einschließen, legt jedoch nicht zwingend die stärkere deutsche Aussage »ausrotten« fest.
- issue: Bezeichnung der vorgetäuschten Identität
  choice: unschuldige Menschen
  alternative: arglose Menschen / die Rolle Unschuldiger
  rationale: ἀκάκων kann Unschuld oder Arglosigkeit bezeichnen. Die Übersetzung hält den ethischen Gegensatz zur Täuschung fest, ohne eine besondere theologische Kategorie einzuführen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallelen Verben werden als Steigerung wiedergegeben; die schwerfällige wörtliche Formulierung des letzten Teils wird idiomatisch übersetzt, während die sachlichen und syntaktischen Alternativen in der Fußnote erhalten bleiben.
