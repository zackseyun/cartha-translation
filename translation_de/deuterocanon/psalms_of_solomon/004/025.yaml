  text: καὶ παρώργυσαν τὸν θεόν, καὶ παρώξυναν ἐξᾶραι αὐτοὺς ἀπὸ τῆς γῆς· ὅτι ψυχὰς ἀκάκων παραλογισμῷ ὑπεκρίνοντο.
