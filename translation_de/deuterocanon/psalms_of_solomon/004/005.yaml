  text: At night and in secret places he sins as though unseen[c][b][a]; with his eyes he speaks to every woman in a scheme of evil.
translation:
  language: de
  text: Bei Nacht und an verborgenen Orten[a] sündigt er, als wäre er unbeobachtet; mit seinen Augen spricht er[b] zu jeder Frau nach einem bösen Plan.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »an geheimen Orten«.'
    reason: lexical_alternative
  - marker: b
    text: Die Formulierung ist ein Bild für wortlose, vielsagende Zeichen.
    reason: cultural_note
  - marker: c
    text: 'Oder: »in böser Absprache«; auch: »in einem Komplott des Bösen«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν νυκτί
  choice: Bei Nacht
  rationale: Die geläufige deutsche Zeitangabe bewahrt den Gedanken, dass die Tat im Schutz der Dunkelheit geschieht.
- source_word: ἐν ἀποκρύφοις
  choice: an verborgenen Orten
  rationale: Der substantivisch gebrauchte Plural bezeichnet eher verborgene Örtlichkeiten als nur die abstrakte Art und Weise des Handelns.
- source_word: ἁμαρτάνει
  choice: sündigt er
  rationale: Die direkte Wiedergabe erhält das klare moralisch-religiöse Gewicht des griechischen Verbs.
- source_word: ὡς οὐχ ὁρώμενος
  choice: als würde er nicht gesehen
  rationale: Diese Formulierung gibt den vergleichenden Sinn von ὡς und das Passiv von ὁρώμενος wieder, ohne ausdrücklich festzulegen, wer ihn nicht sieht.
- source_word: ἐν ὀφθαλμοῖς αὐτοῦ λαλεῖ
  choice: mit seinen Augen spricht er
  rationale: Die auffällige körperliche Metapher des Griechischen bleibt erhalten und bezeichnet wortloses, vielsagendes Signalisieren.
- source_word: πάσῃ γυναικί
  choice: zu jeder Frau
  rationale: Die distributive Bedeutung von πάσῃ wird natürlich wiedergegeben; der Dativ wird passend zum deutschen Verb mit „zu“ ausgedrückt.
- source_word: ἐν συνταγῇ κακίας
  choice: nach einem bösen Plan
  rationale: συνταγή kann eine Anordnung, Verabredung oder planvolle Anlage bezeichnen. „Nach einem bösen Plan“ ist im Deutschen verständlich und lässt die bewusste, geplante Bosheit hervortreten; weitere mögliche Nuancen werden in der Fußnote bewahrt.
