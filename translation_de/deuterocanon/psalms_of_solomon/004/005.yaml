translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die konkrete Ortsangabe und das ungewöhnliche Bild vom Sprechen mit den Augen bleiben erhalten; die schwer eindeutig zu bestimmende Wendung συνταγῇ κακίας wird im Haupttext lesbar formuliert und in der Fußnote semantisch offengehalten.
