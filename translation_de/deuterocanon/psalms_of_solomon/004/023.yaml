base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/004/023.yaml
  text: For he has laid waste many people’s households in disgrace[b][a], and scattered them by lust.
translation:
  language: de
  text: Denn er hat zahlreiche Haushalte[a] in Schande verwüstet und sie durch Begierde[b] zerstreut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „viele Häuser von Menschen“; gemeint sein können ganze Hausgemeinschaften oder Familien.
    reason: lexical_alternative
  - marker: b
    text: Oder „durch Verlangen“, „durch Leidenschaft“ oder „durch Lust“.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠρήμωσεν
  choice: hat … verwüstet
  rationale: Das Verb bezeichnet ein Verwüsten oder Verödenlassen. „Verwüstet“ bewahrt die Stärke und das Bild des griechischen Ausdrucks.
- source_word: οἴκους πολλοὺς ἀνθρώπων
  choice: viele Familien
  rationale: οἶκος bedeutet wörtlich „Haus“, kann aber auch die zu einem Haus gehörende Familie oder Hausgemeinschaft bezeichnen. Im Zusammenhang mit dem anschließenden Zerstreuen ist „Familien“ im Deutschen natürlich und gibt den wahrscheinlich gemeinten sozialen Verband wieder; die wörtliche Bedeutung bleibt in einer Fußnote sichtbar.
- source_word: ἐν ἀτιμίᾳ
  choice: in Schande
  rationale: Die Wendung bezeichnet Ehrlosigkeit, Entehrung oder Schmach. „In Schande“ erhält sowohl die moralische als auch die gesellschaftliche Dimension.
- source_word: ἐσκόρπισεν
  choice: zerstreut
  rationale: 'Die Wiedergabe folgt dem Grundbild des Verbs: auseinanderstreuen oder zerstreuen. Das ergänzte Pronomen „sie“ macht den im Griechischen unausgesprochenen Bezug im Deutschen verständlich.'
- source_word: ἐπιθυμίᾳ
  choice: durch Begierde
  rationale: Der Dativ lässt sich instrumental verstehen. ἐπιθυμία kann allgemein „Verlangen“ oder „Begehren“ und in negativem Zusammenhang „Begierde“ beziehungsweise „Lust“ bedeuten. „Begierde“ passt zum Kontext der Schande, ohne die Bedeutung so stark wie „Wollust“ einzuengen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Familien“ vermeidet das missverständliche Bild bloß zerstörter Gebäude, während die Fußnote den wörtlichen Wortlaut offenlegt. Die knappe Parallelstruktur des griechischen Satzes bleibt erhalten.
