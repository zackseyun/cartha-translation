base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/004/021.yaml
  text: May the flesh of people-pleasers be scattered by wild beasts[a], and the bones of the lawless lie before the sun in dishonor.
translation:
  language: de
  text: Möge das Fleisch derer, die den Menschen gefallen wollen, von wilden Tieren zerstreut werden, und mögen die Gebeine der Gesetzlosen entehrt vor der Sonne liegen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σκορπισθείησαν
  choice: Möge … zerstreut werden
  rationale: Der Aorist Passiv Optativ drückt hier einen Wunsch beziehungsweise Fluch aus. Die Formulierung mit „möge“ bewahrt diesen Ton.
- source_word: σάρκες
  choice: Fleisch
  rationale: Die konkrete Bezeichnung erhält das drastische Bild preisgegebener menschlicher Überreste.
- source_word: ἀνθρωπαρέσκων
  choice: derer, die Menschen gefallen wollen
  rationale: Die Umschreibung gibt das substantivierte Kompositum verständlich und würdig wieder; „Menschengefällige“ wäre im heutigen Deutsch weniger unmittelbar verständlich.
- source_word: ὑπὸ θηρίων
  choice: von wilden Tieren
  rationale: θηρία bezeichnet hier wilde Tiere, denen die Toten preisgegeben sind.
- source_word: ὀστᾶ
  choice: Gebeine
  rationale: Swetes tatsächlicher Drucktext lautet ὀστᾶ („Knochen“), während οὐτὰ in den bereitgestellten Daten auf einem Erfassungsfehler beruht. „Gebeine“ passt zum gehobenen, bildkräftigen Kontext.
- source_word: παρανόμων
  choice: der Gesetzlosen
  rationale: Die Wiedergabe erhält den rechtlich-moralischen Sinn von παράνομος, ohne ihn allgemein zu „Böse“ abzuschwächen.
- source_word: κατέναντι τοῦ ἡλίου
  choice: vor der Sonne
  rationale: Die quellennah bleibende Wendung bezeichnet die öffentliche, unverdeckte Preisgabe der Gebeine.
- source_word: ἐν ἀτιμίᾳ
  choice: entehrt
  rationale: Die adverbiale Wiedergabe klingt im Deutschen natürlicher als „in Unehre“ und bewahrt das Motiv der Schändung.
theological_decisions:
- issue: Fluch- und Wunschcharakter des Verses
  choice: Beide Vershälften werden als Wunsch mit „möge/mögen“ formuliert.
  alternative: Eine Zukunftsaussage mit „werden“ oder ein Befehl mit „sollen“
  rationale: Der griechische Optativ bezeichnet hier keine bloße Vorhersage, sondern eine Verwünschung; diese Spannung wird nicht abgeschwächt.
- issue: Elliptisches Prädikat in der zweiten Vershälfte
  choice: „liegen“ wird zur idiomatischen Vervollständigung ergänzt.
  alternative: Das Verb „zerstreut werden“ auch ausdrücklich auf die Gebeine beziehen
  rationale: Das Griechische lässt das Prädikat der zweiten Hälfte elliptisch. Im Zusammenhang mit „vor der Sonne“ und „entehrt“ gibt „liegen“ die öffentliche Preisgabe natürlich wieder, ohne eine zusätzliche theologische Deutung einzuführen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem poetischem Ton. Die drastische Körperbildlichkeit und der imprekatorische Charakter bleiben erhalten. Auf die überholte englische Fußnote „Or ‘the remains’“ wird verzichtet, da sie auf dem Erfassungsfehler οὐτὰ statt des bei Swete gedruckten ὀστᾶ beruht.
