review_pass:
  verdict: revise
  source_fidelity: Die Übersetzung gibt den imprekatorischen Charakter des Aoristoptativs zutreffend mit „Möge/mögen“ wieder. „Fleisch“, „wilde Tiere“, „Gebeine“, „Gesetzlose“, „vor der Sonne“ und „entehrt“ entsprechen dem Bild und Register des griechischen Textes. Für das in den Quelldaten offenbar fehlerhaft erfasste οὐτὰ ist nach dem angegebenen Swete-Druck und der textkritischen Auditspur ὀστᾶ („Gebeine/Knochen“) zugrunde zu legen; hierfür ist keine Unsicherheitsfußnote nötig.
  naturalness: 'Die Formulierung ist insgesamt natürlich, würdig und verständlich. Allerdings verlangt das Verb „gefallen“ hier den Dativ: „den Menschen gefallen wollen“, nicht „die Menschen gefallen wollen“.'
  terminology: „Gebeine“ wahrt den poetisch-gehobenen Ton, ohne den konkreten Sinn von ὀστᾶ zu verlieren. „Gesetzlose“ bewahrt die rechtlich-moralische Nuance von παράνομοι. „Entehrt“ ist eine idiomatische adverbiale Wiedergabe von ἐν ἀτιμίᾳ.
  issues:
  - severity: medium
    issue: Falscher Kasus bei „Menschen gefallen wollen“
    rationale: Im Deutschen steht die Person, deren Zustimmung man gewinnen will, bei „gefallen“ im Dativ. Der griechische Ausdruck ἀνθρωπαρέσκων bezeichnet Personen, die Menschen gefallen wollen; daher muss es „den Menschen gefallen wollen“ heißen.
  revised_text: Möge das Fleisch derer, die den Menschen gefallen wollen, von wilden Tieren zerstreut werden, und mögen die Gebeine der Gesetzlosen entehrt vor der Sonne liegen.
