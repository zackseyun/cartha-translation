lexical_decisions:
- source_word: μακάριοι
  choice: Glücklich
  rationale: Die übliche deutsche Seligpreisungsform „Glücklich sind …“ gibt μακάριοι natürlich und würdevoll wieder, ohne den Ausdruck auf ein bloßes Gefühl zu verengen.
- source_word: φοβούμενοι
  choice: den Herrn fürchten
  rationale: „Fürchten“ bewahrt die unmittelbare Bedeutung des griechischen Verbs und die biblische Spannung; im Zusammenhang bezeichnet es ehrfürchtige Gottesfurcht, nicht bloße Angst.
- source_word: τὸν κύριον
  choice: den Herrn
  rationale: „Herr“ ist die natürliche Wiedergabe des göttlichen Titels κύριος in diesem religiösen Zusammenhang.
- source_word: ἐν ἀκακίᾳ αὐτῶν
  choice: und dabei ohne Arglist sind
  rationale: ἀκακία bezeichnet das Freisein von Bosheit, Schlechtigkeit oder Trug. Die idiomatische Formulierung „ohne Arglist“ macht den moralischen Sinn verständlich; „dabei“ bewahrt den Bezug darauf, wie die Betreffenden den Herrn fürchten.
theological_decisions:
- issue: Art der Furcht vor dem Herrn
  choice: „fürchten“ im Haupttext beibehalten und als ehrfürchtige Gottesfurcht erläutern
  alternative: „verehren“ oder „Ehrfurcht vor dem Herrn haben“
  rationale: Eine paraphrasierende Wiedergabe würde den Sinn verdeutlichen, aber die echte Spannung des Quellwortes φοβέομαι abschwächen.
