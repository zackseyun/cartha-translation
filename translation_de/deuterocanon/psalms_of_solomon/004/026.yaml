    rationale: „Und dabei ohne Arglist sind“ macht aus der präpositionalen Bestimmung einen zusätzlichen Prädikatsinhalt. „Ohne Arglist fürchten“ stellt die modale Verbindung zum Fürchten unmittelbarer dar.
