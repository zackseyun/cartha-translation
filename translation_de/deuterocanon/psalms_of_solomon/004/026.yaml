  source_fidelity: Der Entwurf gibt die Satzglieder grundsätzlich zutreffend wieder. „Glücklich“ kann μακάριοι wiedergeben, ist im Deutschen jedoch stärker emotional und weniger als Seligpreisungsform erkennbar. Die Wiedergabe von ἐν ἀκακίᾳ αὐτῶν durch einen mit „und“ koordinierten Nebengedanken lockert zudem die im Griechischen ausgedrückte modale Zuordnung zum Fürchten.
  naturalness: „Selig sind, die …“ ist modernes, idiomatisches Deutsch in einem angemessen würdevollen biblisch-weisheitlichen Register. „Ohne Arglist“ ist klarer und weniger missverständlich als die abstrakte Konstruktion „und dabei ohne Arglist sind“ und bewahrt den Sinn der Präpositionalfügung.
  terminology: „Herrn“ für κύριον und „fürchten“ für φοβούμενοι sind angemessen. „Arglist“ trifft den Mangel an Täuschung bzw. böser Absicht bei ἀκακία; die Fußnote hält die wörtlichere und weitere Bedeutung offen.
