lexical_decisions:
- source_word: ὀφθαλμοὺς
  choice: die Augen
  rationale: Die gewöhnliche Bedeutung ist »Augen«; eine drastischere Wiedergabe wie »Augäpfel« würde den griechischen Ausdruck überzeichnen.
- source_word: ἐκκόψαισαν
  choice: sollen ... aushacken
  rationale: Der Aorist-Optativ drückt hier einen Wunsch beziehungsweise eine Verwünschung aus. Im Deutschen gibt »sollen« diese Kraft natürlich wieder; zusammen mit Raben beschreibt »aushacken« das gewaltsame Bild idiomatisch.
- source_word: κόρακες
  choice: Raben
  rationale: κόραξ bezeichnet gewöhnlich einen Raben und bewahrt hier das anschauliche Bild eines aasfressenden Vogels.
- source_word: ὑποκρινομένων
  choice: den Heuchlern
  rationale: Das substantivierte Partizip bezeichnet Menschen, die sich verstellen oder etwas vorspielen. »Heuchler« ist die knappste natürliche Wiedergabe; die weitere Bedeutungsbreite wird in der Fußnote bewahrt.
