  text: May his portion[a], O Lord, be in dishonor before you[d][c][b], his going out in groanings and his coming in in a curse.
translation:
  language: de
  text: Herr, sein Anteil sei vor dir in Unehre, sein Ausgehen geschehe unter Seufzen und sein Eingehen unter einem Fluch.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: „Ausgehen“ und „Eingehen“ bilden wahrscheinlich eine biblische Paarformel, die die Gesamtheit der Wege oder des Lebensvollzugs eines Menschen bezeichnen kann.
    reason: cultural_note
lexical_decisions:
- source_word: γένοιτο
  choice: sei / geschehe
  rationale: Der Optativ formuliert einen Gebetswunsch. Im Deutschen gibt der Konjunktiv I diesen verwünschenden Wunsch würdig und natürlich wieder; beim zweiten Glied verdeutlicht „geschehe“ die Mitgeltung des nur einmal gesetzten griechischen Verbs.
- source_word: μερὶς
  choice: Anteil
  rationale: „Anteil“ bezeichnet das einem Menschen zufallende Teil oder Los, ohne die Aussage vorschnell auf sein Schicksal einzuengen.
- source_word: ἀτιμίᾳ
  choice: Schande
  rationale: „Schande“ trifft den Zustand der Ehrlosigkeit und bewahrt den gewichtigen moralischen Ton des abstrakten Substantivs.
- source_word: ἔξοδος
  choice: Ausgehen
  rationale: Die substantivierte Form bewahrt die bewusste Paarung mit „Eingehen“ und den biblischen Ausdruck für die Bewegungen beziehungsweise den Lebensvollzug eines Menschen.
- source_word: στεναγμοῖς
  choice: unter Seufzen
  rationale: Der kollektive deutsche Ausdruck gibt den pluralischen Dativ als einen von wiederholtem Seufzen geprägten Zustand natürlich wieder.
- source_word: εἴσοδος
  choice: Eingehen
  rationale: Die Wahl erhält den formalen Gegensatz zu „Ausgehen“.
- source_word: ἀρᾷ
  choice: unter einem Fluch
  rationale: „Unter einem Fluch“ ist idiomatisches Deutsch für den von ἐν mit Dativ bezeichneten Zustand; der unbestimmte Artikel wird grammatisch benötigt und legt keinen bestimmten Fluch fest.
- source_word: Κύριε
  choice: Herr
  rationale: „Herr“ ist die übliche und angemessene deutsche Wiedergabe der göttlichen Anrede.
theological_decisions:
- issue: Struktur des Verwünschungsgebets
  choice: Als unmittelbar an den Herrn gerichteten Wunsch wiedergeben
  alternative: Als bloße Vorhersage des Gerichts formulieren
  rationale: Der Optativ γένοιτο zusammen mit dem Vokativ Κύριε kennzeichnet eine Bitte beziehungsweise Verwünschung, nicht nur eine Feststellung.
- issue: Reichweite von γένοιτο
  choice: Alle drei Satzglieder als von dem einen Optativ abhängig verstehen
  alternative: Nur den ersten Satzteil als Wunsch lesen und die folgenden Glieder fragmentarisch anschließen
  rationale: Die griechische Reihung nennt drei Subjekte zu dem einmal gesetzten Verb; die deutsche Formulierung macht diesen Zusammenhang lesbar, ohne ein neues Urteil einzuführen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst bewahrter biblischer Paarung „Ausgehen und Eingehen“. Die im Griechischen dreifach wiederholte Präposition ἐν wird nicht mechanisch gleichlautend übersetzt, sondern jeweils idiomatisch und semantisch eng wiedergegeben.
