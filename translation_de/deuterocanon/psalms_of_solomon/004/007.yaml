  yaml_path: translation/deuterocanon/psalms_of_solomon/004/007.yaml
  text: May God remove those who live in hypocrisy among the pious[d][c][b][a], in the corruption of his flesh and poverty his life.
translation:
  language: de
  text: Gott möge diejenigen beseitigen[a], die unter den Frommen[c] in Heuchelei leben, und zugleich sein Leben im Verfall seines Fleisches und in Armut.[b][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »wegnehmen«, »entfernen« oder »ausrotten«.'
    reason: lexical_alternative
  - marker: b
    text: Der griechische Text wechselt vom Plural (»diejenigen, die … leben«) zum Singular »sein Fleisch« und »sein Leben«. Die Singularformen können den einzelnen Vertreter der genannten Gruppe im Blick haben.
    reason: grammar
  - marker: c
    text: 'Oder: »Gottesfürchtigen«; wörtlicher auch: »Heiligen«.'
    reason: lexical_alternative
  - marker: d
    text: 'Der griechische Schluss ist sehr knapp gefügt. »Sein Leben« steht im Akkusativ und lässt sich als weiteres Objekt von »beseitigen« verstehen. Möglich ist auch eine geglättete Deutung: »mit Verfall in ihrem Fleisch und Armut in ihrem Leben«.'
    reason: textual_ambiguity
lexical_decisions:
- source_word: ἐξάραι
  choice: beseitigen
  rationale: Das Verb bezeichnet hier ein Wegnehmen oder Entfernen. »Beseitigen« bewahrt die Schärfe der Verwünschung, ohne ausdrücklich eine bestimmte Todesart einzutragen.
- source_word: ὑποκρίσει
  choice: Heuchelei
  rationale: »Heuchelei« ist die klare, geläufige Entsprechung und passt zum moralisch-religiösen Zusammenhang.
- source_word: ὁσίων
  choice: den Frommen
  rationale: ὅσιοι bezeichnet hier die frommen beziehungsweise gottesfürchtigen Angehörigen der Gemeinschaft. »Fromme« vermeidet die späteren kirchlichen Nebenbedeutungen von »Heilige«.
- source_word: φθορᾷ
  choice: Verfall
  rationale: In Verbindung mit »Fleisch« gibt »Verfall« den körperlichen Sinn konkret wieder, ohne das Wort ausschließlich moralisch als »Verderbnis« zu deuten.
- source_word: σαρκός
  choice: Fleisch
  rationale: Die formnahe Wiedergabe erhält die körperliche Ausdrucksweise des griechischen Textes.
- source_word: πενίᾳ
  choice: Armut
  rationale: »Armut« ist die direkte und im Deutschen natürliche Entsprechung des Ausdrucks.
- source_word: τὴν ζωὴν αὐτοῦ
  choice: sein Leben
  rationale: Der Singular des griechischen Textes wird trotz des vorausgehenden Plurals beibehalten, damit der auffällige Wechsel zum einzelnen, exemplarisch vorgestellten Heuchler sichtbar bleibt.
theological_decisions:
- issue: Funktion des einleitenden Infinitivs ἐξάραι
  choice: 'Als Wunsch beziehungsweise Gebet: »Gott möge ... beseitigen«'
  alternative: Als Aussage »Gott beseitigt ...« oder als abhängiger Infinitiv »dass Gott ... beseitige«
  rationale: Der syntaktisch knappe Infinitiv hat im verwünschenden Zusammenhang am ehesten die Kraft eines Gebetswunsches. Die Wiedergabe mit »möge« macht diese Funktion verständlich, ohne aus dem Satz eine Feststellung zu machen.
- issue: Bezug von τὴν ζωὴν αὐτοῦ
  choice: »sein Leben« als zweites Objekt des Beseitigens
  alternative: 'Die Schlusswörter als bloße Umstandsangabe glätten: »mit Verfall in ihrem Fleisch und Armut in ihrem Leben«'
  rationale: Der Akkusativ τὴν ζωήν spricht dafür, »sein Leben« als weiteres direktes Objekt zu verstehen. Die ungewöhnliche Fügung und der Wechsel vom Plural zum Singular werden nicht stillschweigend harmonisiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die harte, im Deutschen ungewöhnliche Schlusskonstruktion bleibt bewusst erkennbar, weil der griechische Text »sein Leben« im Akkusativ setzt und zugleich vom Plural zum Singular wechselt; die Fußnoten bieten die wichtigsten lexikalischen und syntaktischen Alternativen.
