  naturalness: „Vor dem Gerechten weggenommen werden“ ist im modernen Standarddeutsch mehrdeutig und weniger idiomatisch; es kann räumlich „vor seinen Augen“ statt „aus seiner Gegenwart“ verstanden werden. Eine Umstellung des Schlusssatzes macht dessen Sinn klarer, ohne die überlieferte syntaktische Spannung zu glätten.
