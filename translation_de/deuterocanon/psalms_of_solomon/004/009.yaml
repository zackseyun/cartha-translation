base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/004/009.yaml
  text: And may the devout vindicate the judgment of their God when sinners are removed from before the righteous man—even the one speaking what pleases a man, only with deceit.
translation:
  language: de
  text: Und die Frommen mögen das Urteil ihres Gottes als gerecht erweisen, wenn Sünder aus der Gegenwart des Gerechten entfernt werden – einer, der das, was einem Menschen gefällt, nur mit Arglist redet.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Griechischen folgt auf den Plural „Sünder“ unvermittelt eine Beschreibung im Singular („einer, der … redet“). Der überlieferte Satz ist syntaktisch schwierig; vermutlich wird der Sünder damit allgemein charakterisiert.
    reason: alternative_reading
  - marker: b
    text: 'Die letzten Wörter können wegen ihrer ungewöhnlichen Wortstellung auch anders verbunden werden, etwa: „einer, der nur mit Arglist redet, was einem Menschen gefällt“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅσιοι
  choice: die Frommen
  rationale: Das Wort bezeichnet hier gottesfürchtige, hingebungsvolle Menschen; „die Frommen“ ist im poetisch-religiösen Kontext natürlich und würdevoll.
- source_word: δικαιώσαισαν
  choice: mögen ... als gerecht erweisen
  rationale: Der Aorist Optativ drückt einen Wunsch aus. Mit κρίμα als Objekt bedeutet das Verb, die Gerechtigkeit des göttlichen Urteils zu bestätigen bzw. sichtbar zu machen.
- source_word: κρίμα
  choice: Urteil
  rationale: „Urteil“ bewahrt den gerichtlichen Sinn und verbindet sich im Deutschen klar mit „als gerecht erweisen“.
- source_word: ἐν τῷ ἐξαίρεσθαι
  choice: wenn ... weggenommen werden
  rationale: Die substantivierte Infinitivkonstruktion wird hier zeitlich verstanden; das Passiv und der Vorgangscharakter bleiben erhalten.
- source_word: ἀπὸ προσώπου δικαίου
  choice: vor dem Gerechten
  rationale: Die Wendung ἀπὸ προσώπου bezeichnet die Entfernung aus der Gegenwart bzw. vom Angesicht einer Person. Der substantivierte Singular δικαίου bleibt als „dem Gerechten“ erhalten.
- source_word: ἀνθρώπῳ ἀρέσκον
  choice: was einem Menschen gefällt
  rationale: 'Das neutrale Partizip ἀρέσκον wird substantivisch als Gegenstand von λαλοῦντα verstanden: Er redet das, was einem Menschen gefällt.'
- source_word: λαλοῦντα μόνον μετὰ δόλου
  choice: einer, der mit Arglist nur das redet
  rationale: Der singularische Akkusativpartizipialausdruck charakterisiert offenbar den zuvor pluralisch genannten Sünder generisch. „Mit Arglist“ gibt μετὰ δόλου wieder; die Stellung von „nur“ lässt die im Griechischen vorhandene Zuordnungsunschärfe nicht völlig verschwinden.
theological_decisions:
- issue: Bezug von δικαίου
  choice: dem Gerechten als menschliche, repräsentativ singularische Bezeichnung
  alternative: dem Gerechten als besondere oder messianische Einzelgestalt
  rationale: Der griechische Text kennzeichnet keine bestimmte Identität. Die Übersetzung bewahrt daher den substantivierten Singular, ohne ihn christologisch oder anderweitig näher festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit moderater formaler Nähe zum Griechischen. Der Optativ wird als Wunschsatz wiedergegeben; die syntaktische Unebenheit des Schlusses wird lesbar gestaltet und zugleich in den Fußnoten offengelegt.
