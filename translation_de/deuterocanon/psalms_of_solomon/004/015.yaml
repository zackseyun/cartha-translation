  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: lxx-swete-1909
  text: ἐπλήσθη ἐν παρανομίᾳ ἐν ταύτῃ· καὶ οἱ ὀφθαλμοὶ αὐτοῦ ἐπʼ οἶκον ἕτερον ὀλοθρεύσαι ἐν λόγοις ἀνυπερθέσεως· οὐκ ἐμπίπλαται ἡ ψυχὴ αὐτοῦ, ὡς ᾅδης, ἐν πᾶσι τούτοις.
  language: Greek
  pages:
  - 793
  validation: swete_direct
base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/004/015.yaml
  text: He was filled with this lawlessness[a], and his eyes were set on another household to destroy it with relentless words; his soul is not satisfied, like Hades[c][b], with all these things.
translation:
  language: de
  text: Er war von dieser Gesetzlosigkeit erfüllt, und seine Augen richteten sich auf ein anderes Haus[a], um es mit unerbittlichen Worten[b] zu vernichten. Seine Seele wird von all dem nicht satt, wie der Hades[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eine andere Hausgemeinschaft“ beziehungsweise „eine andere Familie“. Das griechische οἶκος kann sowohl ein Gebäude als auch die darin lebende Hausgemeinschaft bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Die griechische Wendung ist schwierig. Möglich sind auch „mit Worten ohne Zögern“ oder „mit Worten ohne Aufschub“.
    reason: alternative_reading
  - marker: c
    text: Der „Hades“ ist hier ein Bild für Unersättlichkeit. Als deutende Wiedergaben kommen auch „das Totenreich“ oder „das Grab“ infrage.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπλήσθη ἐν παρανομίᾳ ἐν ταύτῃ
  choice: Er war von dieser Gesetzlosigkeit erfüllt
  rationale: Die passive Form und das Bild des Erfülltseins bleiben erhalten; ἐν ταύτῃ wird natürlich auf die unmittelbar genannte Gesetzlosigkeit bezogen.
- source_word: οἱ ὀφθαλμοὶ αὐτοῦ ἐπʼ
  choice: seine Augen richteten sich auf
  rationale: Die deutsche Wendung gibt den gerichteten Blick und die damit verbundene feindliche Absicht idiomatisch wieder, ohne mehr als der Kontext auszusagen.
- source_word: οἶκον ἕτερον
  choice: ein anderes Haus
  rationale: „Haus“ entspricht οἶκος unmittelbar und kann im Deutschen wie im Griechischen neben dem Gebäude auch die Hausgemeinschaft bezeichnen; die soziale Bedeutung wird in der Fußnote offengehalten.
- source_word: ὀλοθρεύσαι
  choice: um es … zu vernichten
  rationale: Der Infinitiv bezeichnet den Zweck des gerichteten Blicks; „vernichten“ bewahrt die starke zerstörerische Bedeutung des Verbs.
- source_word: ἐν λόγοις ἀνυπερθέσεως
  choice: mit unerbittlichen Worten
  rationale: Die schwierige Wendung bezeichnet wohl Worte ohne Zurückhaltung oder Aufschub. „Unerbittlich“ vermittelt im Kontext ihre aggressive, nicht nachlassende Wirkung; die wörtlicheren Möglichkeiten werden in der Fußnote genannt.
- source_word: οὐκ ἐμπίπλαται ἡ ψυχὴ αὐτοῦ
  choice: Seine Seele wird … nicht satt
  rationale: „Nicht satt werden“ bewahrt das Bild eines unstillbaren Verlangens und klingt im Deutschen natürlicher als eine wörtliche Wiedergabe mit „gefüllt“.
- source_word: ὡς ᾅδης
  choice: wie der Hades
  rationale: „Hades“ gibt den griechischen Ausdruck transparent wieder und bewahrt das Bild des unersättlichen Totenreichs, ohne es auf „Grab“ einzuengen.
theological_decisions:
- issue: Bedeutung von ᾅδης im Vergleich
  choice: Hades
  alternative: Totenreich; Unterwelt; Grab
  rationale: Der Eigenbegriff wahrt die Bildsprache und vermeidet eine vorschnelle Gleichsetzung mit dem physischen Grab oder eine konfessionell geprägte Ausdeutung des Jenseits.
translation_notes:
  register: Moderne, würdige Standardsprache. Die starke Bildsprache von Erfülltsein, Vernichtung, unstillbarem Verlangen und Hades bleibt erhalten. Die ungewöhnliche Formulierung ἐν λόγοις ἀνυπερθέσεως wird im Haupttext lesbar wiedergegeben, während die echte lexikalische Unsicherheit in der Fußnote offengelegt wird.
