  - severity: medium
    issue: Syntaktische Aufspaltung von δολίων καὶ ἁμαρτωλῶν
    rationale: „… arglistiger Menschen und von Sündern“ behandelt die Ausdrücke als zwei getrennte, jeweils durch eine Präposition regierte Gruppen. Im Griechischen qualifizieren beide genitivischen Pluralformen ἀνθρώπων; die koordinierte deutsche Adjektivform bewahrt dies besser.
