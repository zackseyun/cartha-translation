base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/004/027.yaml
  text: And the Lord will rescue them from deceitful and sinful people[b][a], and he will rescue us from every lawless snare.
translation:
  language: de
  text: Und der Herr wird sie vor arglistigen und sündigen Menschen bewahren, und er wird uns vor jedem gesetzlosen Fallstrick bewahren.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „vor jedem Fallstrick des Gesetzlosen“ beziehungsweise „der Gesetzlosen“; auch: „vor jedem gesetzlosen Anlass zum Straucheln“.'
    reason: Der Genitiv παρανόμου kann den Fallstrick als gesetzlos kennzeichnen oder dessen Urheber, den Gesetzlosen bzw. die Gesetzlosen, bezeichnen. σκάνδαλον kann auch einen Anlass zum Straucheln meinen.
lexical_decisions:
- source_word: κύριος
  choice: Herr
  rationale: Als göttlicher Titel entspricht „Herr“ dem religiösen Sprachgebrauch und bleibt nah am Griechischen.
- source_word: ῥύσεται
  choice: wird retten / wird bewahren
  rationale: Das Verb bezeichnet Befreiung aus Gefahr. Im ersten Satzglied ist „retten“ natürlich; mit ἀπό und „Fallstrick“ gibt „bewahren vor“ denselben Sinn idiomatisch wieder.
- source_word: ἀνθρώπων δολίων
  choice: arglistiger Menschen
  rationale: „Menschen“ ist geschlechtsübergreifend; „arglistig“ bewahrt den Sinn von Täuschung und heimtückischer Absicht.
- source_word: ἁμαρτωλῶν
  choice: Sündern
  rationale: Das substantivische „Sünder“ hält die im Psalmen-Salomos-Kontext mögliche Bezeichnung einer bestimmten gegnerischen Gruppe offen, statt den Ausdruck lediglich als zweites Adjektiv zu glätten.
- source_word: σκανδάλου
  choice: Fallstrick
  rationale: Hier bezeichnet das Wort etwas, das zu Fall bringt oder ins Verderben lockt; „Fallstrick“ gibt dieses Bild in natürlichem Deutsch wieder.
- source_word: παρανόμου
  choice: gesetzlosen
  rationale: Der Genitiv kann das σκάνδαλον näher bestimmen, ist aber grammatisch auch als Bezug auf eine gesetzlose Person oder Gruppe verständlich; die Hauptfassung folgt der naheliegenden attributiven Wiedergabe.
theological_decisions:
- issue: Status von ἁμαρτωλῶν
  choice: eigenständiges Substantiv „Sündern“
  alternative: „sündigen Menschen“ als zweites koordiniertes Adjektiv zu ἀνθρώπων
  rationale: Die substantivische Form und der mögliche gruppenbezogene Gebrauch im Werk sprechen dafür, die Bezeichnung nicht zu einem bloßen moralischen Attribut einzuebnen.
- issue: Bezug von παρανόμου
  choice: 'adjektivische Bestimmung des Fallstricks: „gesetzlosen Fallstrick“'
  alternative: „Fallstrick des Gesetzlosen/der Gesetzlosen“
  rationale: Beide Deutungen sind grammatisch möglich. Die Hauptfassung folgt der unmittelbarsten Verbindung mit σκανδάλου; die Fußnote bewahrt die personbezogene Alternative.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung des griechischen Verbs wird semantisch gewahrt, aber im zweiten Satzglied idiomatisch als „bewahren“ formuliert. Die Gruppenbezeichnung „Sünder“ sowie die Mehrdeutigkeit von παρανόμου werden nicht eingeebnet.
