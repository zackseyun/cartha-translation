- from: Und der Herr wird sie aus der Hand arglistiger Menschen und von Sündern retten, und er wird uns vor jedem gesetzlosen Fallstrick bewahren.[a]
  to: Und der Herr wird sie vor arglistigen und sündigen Menschen bewahren, und er wird uns vor jedem gesetzlosen Fallstrick bewahren.[a]
  rationale: Die Revision entfernt die unbelegte Ergänzung „aus der Hand“ und bildet die gemeinsame syntaktische Zuordnung von „arglistig“ und „sündig“ zu „Menschen“ ab. Die Hauptübersetzung lässt die naheliegende attributive Deutung von παρανόμου stehen; die Fußnote erhält die grammatisch mögliche personale Deutung und die lexikalische Alternative zu σκάνδαλον.
