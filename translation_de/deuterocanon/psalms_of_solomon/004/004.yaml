  text: His eyes are on every woman without distinction[c][b][a]; his tongue is deceitful in a transaction with an oath.
translation:
  language: de
  text: Seine Augen sind auf jede Frau ohne Unterschied gerichtet[a]; seine Zunge ist trügerisch bei einer Vereinbarung mit einem Eid[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ohne Zurückhaltung“. Der griechische Ausdruck kann sowohl fehlende Unterscheidung als auch fehlende Begrenzung des Blicks nahelegen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „bei einem Geschäft mit einem Eid“. Das griechische Wort kann auch „Geschäft“, „Transaktion“ oder „Vertrag“ bedeuten; ebenso bleibt die genaue Verbindung des Eides mit der Vereinbarung knapp ausgedrückt.'
    reason: source_ambiguity
lexical_decisions:
- source_word: οἱ ὀφθαλμοὶ αὐτοῦ ἐπὶ πᾶσαν γυναῖκα
  choice: Seine Augen sind … auf jede Frau gerichtet
  rationale: Die konkrete Körperteilmetapher bleibt erhalten; ἐπί mit Akkusativ bezeichnet die Ausrichtung des Blicks, und πᾶσαν bewahrt den umfassenden Bezug auf jede Frau.
- source_word: ἄνευ διαστολῆς
  choice: unterschiedslos
  rationale: διαστολή bezeichnet zunächst Unterscheidung oder Abgrenzung. „Unterschiedslos“ gibt diese Bedeutung knapp wieder, ohne die kontextuell mögliche Nuance mangelnder Zurückhaltung zum alleinigen Sinn zu machen.
- source_word: ἡ γλῶσσα ψευδὴς
  choice: seine Zunge ist trügerisch
  rationale: Die Metapher der Zunge als Trägerin der Rede wird bewahrt. „Trügerisch“ bezeichnet hier natürlich den täuschenden Charakter seiner Rede, während „falsch“ im Deutschen missverständlich klingen könnte.
- source_word: ἐν συναλλάγματι
  choice: bei einer Vereinbarung
  rationale: συνάλλαγμα kann eine konkrete Vereinbarung, ein Geschäft oder eine Transaktion bezeichnen. Der Singular wird konkret wiedergegeben, ohne zwingend einen förmlichen Vertrag vorauszusetzen.
- source_word: μεθʼ ὅρκου
  choice: die mit einem Eid bekräftigt wird
  rationale: Die Wendung besagt, dass zur Vereinbarung ein Eid hinzutritt. Die Formulierung stellt den naheliegenden Zusammenhang idiomatisch dar, ohne einen gerichtlichen Kontext anzunehmen.
