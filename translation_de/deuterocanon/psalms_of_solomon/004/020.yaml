translation:
  language: de
  text: Sein Alter sei in der Einsamkeit der Kinderlosigkeit zur Hinwegnahme bestimmt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „zur Hinwegnahme“ oder „zur Wegnahme“. Die Wendung εἰς ἀνάλημψιν ist eine knappe Zielangabe; sie kann im Zusammenhang auch den Endpunkt des geschilderten Alters bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μονίᾳ
  choice: Einsamkeit
  rationale: Das Substantiv bezeichnet einen Zustand des Alleinseins oder der Abgeschiedenheit. „Einsamkeit“ gibt im Fluchzusammenhang die persönliche Verlassenheit natürlich und treffend wieder.
- source_word: ἀτεκνίας
  choice: Kinderlosigkeit
  rationale: Das Wort bezeichnet ausdrücklich das Fehlen von Kindern; „Kinderlosigkeit“ ist die klare und sachliche deutsche Entsprechung.
- source_word: γῆρας
  choice: Alter
  rationale: Gemeint ist das hohe beziehungsweise spätere Lebensalter des Mannes. „Alter“ ist im Deutschen die natürliche Standardwiedergabe.
- source_word: εἰς ἀνάλημψιν
  choice: bis er hinweggenommen wird
  rationale: ἀνάλημψις bezeichnet ein Hinwegnehmen oder Fortnehmen. Die Wiedergabe versteht εἰς hier im Zusammenhang als Ziel- beziehungsweise Endpunkt, ohne ausdrücklich festzulegen, ob damit der Tod gemeint ist.
- source_word: '[implizite Wunsch- bzw. Fluchform]'
  choice: sei sein Alter
  rationale: Der griechische Satz ist ohne Verb; aus der Folge von Gerichtswünschen im Kontext ergibt sich jedoch eine imprekatorische Wunschform. Der deutsche Konjunktiv „sei“ bewahrt diese Kraft knapp und würdevoll.
theological_decisions:
- issue: Ob der verblosen Satz als Wunschfluch oder als bloße Beschreibung wiederzugeben ist
  choice: 'Imprekatorischer Wunsch: „… sei sein Alter“'
  alternative: Nominale Beschreibung ohne ausgedrückten Wunsch
  rationale: Die umgebenden Verse bilden eine Folge von Bitten um Gericht. Daher ist auch hier eine Wunsch- beziehungsweise Fluchform impliziert; die Härte des Ausgangstextes wird nicht abgeschwächt.
- issue: Ob ἀνάλημψις ausdrücklich als Tod zu deuten ist
  choice: „hinweggenommen wird“ ohne ausdrückliche Nennung des Todes
  alternative: „bis er stirbt“ oder das formalere „zur Hinwegnahme“
  rationale: Im Kontext kann das Hinwegnehmen auf den Tod zielen, doch das griechische Wort benennt ihn nicht ausdrücklich. Die Übersetzung bewahrt diese Offenheit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die vorangestellte Präpositionalgruppe hält die knappe, feierlich-imprekatorische Struktur des Griechischen fest; „Einsamkeit der Kinderlosigkeit“ bewahrt dessen verdichtete Nominalform.
