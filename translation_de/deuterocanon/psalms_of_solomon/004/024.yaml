  yaml_path: translation/deuterocanon/psalms_of_solomon/004/024.yaml
  text: And they did not remember God, and they did not fear God amid all these things.
translation:
  language: de
  text: Und sie dachten nicht an Gott und fürchteten Gott nicht bei all dem.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμνήσθησαν
  choice: dachten nicht an
  rationale: Die deponentische Aoristform von μιμνῄσκομαι bezeichnet hier, Gott im Sinn zu haben beziehungsweise sich seiner zu erinnern. „Dachten nicht an Gott“ ist im modernen Deutschen natürlich und bewahrt den Vorwurf mangelnder Gottesgegenwart im Denken.
- source_word: ἐφοβήθησαν
  choice: fürchteten Gott nicht
  rationale: φοβέομαι mit Gott als Objekt kann Furcht und Ehrfurcht umfassen. „Fürchteten“ erhält die kräftige, theologisch offene Ausdrucksweise des griechischen Textes, ohne sie auf bloße Achtung einzuengen.
- source_word: ἐν πᾶσι τούτοις
  choice: bei all dem
  rationale: Die Wendung bezieht das Versagen auf die Gesamtheit der zuvor geschilderten Umstände. „Bei all dem“ gibt diesen situativen Sinn idiomatisch und knapp wieder.
theological_decisions:
- issue: Bedeutungsumfang der Gottesfurcht
  choice: fürchteten Gott nicht
  alternative: hatten keine Ehrfurcht vor Gott
  rationale: Die Übersetzung lässt bewusst offen, wie sich Furcht, Scheu und Ehrfurcht zueinander verhalten, und schwächt den Ausdruck nicht vorschnell ab.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die zweimalige Nennung Gottes wird entsprechend dem griechischen Text beibehalten; auf eine stilistische Ersetzung durch ein Pronomen wird verzichtet.
