  text: And may his house lack everything that would fill his soul.
translation:
  language: de
  text: Und seinem Haus fehle alles, was seine Seele erfüllen wird.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλλιπὴς
  choice: sei ohne
  rationale: Das prädikative Adjektiv steht in einem verblosen Satz. Im Zusammenhang der Verwünschung gibt der deutsche Konjunktiv „sei“ den Wunschcharakter wieder; „ohne“ drückt den Mangel natürlich aus.
- source_word: ὁ οἶκος αὐτοῦ
  choice: sein Haus
  rationale: „Haus“ bewahrt sowohl den konkreten als auch den möglichen weiteren Sinn von Hausstand oder Haushalt, ohne die Bedeutung vorschnell einzuengen.
- source_word: ἀπὸ παντὸς
  choice: ohne alles
  rationale: Bei ἐλλιπής bezeichnet ἀπό den Bereich dessen, woran es mangelt. „Ohne alles“ ist im Deutschen verständlich und wahrt die umfassende Aussage.
- source_word: οὗ ἐμπλήσει
  choice: womit er … sättigen könnte
  rationale: Das relative οὗ wird instrumental verstanden. ἐμπίμπλημι bezeichnet ein Füllen bis zur Sättigung; „sättigen“ gibt den idiomatischen Bezug auf ψυχή wieder, während „könnte“ den im Verwünschungssatz gemeinten potenziellen Nutzen ausdrückt.
- source_word: ψυχὴν αὐτοῦ
  choice: seine Seele
  rationale: „Seele“ erhält das Bild und die Bedeutungsweite von ψυχή, das hier auch Selbst, Verlangen oder Lebenshunger einschließen kann.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Verwünschungsform wird mit dem Konjunktiv „sei“ markiert; die Bildsprache von Haus und Seele bleibt erhalten.
