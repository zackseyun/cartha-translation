review_pass:
  verdict: revise
  source_fidelity: Die Verwünschungsform ist zutreffend erfasst, ebenso die umfassende Entbehrung und die Bildsprache von Haus und Seele. Der griechische Futur ἐμπλήσει sollte jedoch nicht als bloße Möglichkeit („könnte“) wiedergegeben werden; die Relativbestimmung bezeichnet das, was seine Seele erfüllen wird.
  naturalness: „Sein Haus sei ohne alles“ ist verständlich, aber „Möge seinem Haus alles fehlen“ ist im modernen, würdigen Deutsch idiomatischer und bildet die mangelhafte Versorgung klarer ab. „Seele erfüllen“ ist eine natürliche Entsprechung, ohne ψυχή auf bloßen körperlichen Appetit zu reduzieren.
  terminology: „Haus“ bewahrt die gewollte Offenheit von οἶκος; „Seele“ bewahrt die Bildsprache und Bedeutungsweite von ψυχή. „Erfüllen“ gibt ἐμπλήσει genauer wieder als das stärker auf Nahrung festgelegte „sättigen“.
  issues:
  - severity: medium
    issue: Der Futur ἐμπλήσει wird durch „sättigen könnte“ als Potenzial wiedergegeben.
    rationale: Der griechische Text hat hier Futur Indikativ. Die im Hauptsatz liegende Verwünschung rechtfertigt „möge“, aber nicht die Abschwächung der Relativbestimmung zu einer bloßen Möglichkeit.
  - severity: low
    issue: „womit“ legt die instrumentale Lesart unnötig fest.
    rationale: Die Konstruktion kann im Deutschen einfacher und näher am Sinn als „alles, was seine Seele erfüllen wird“ wiedergegeben werden.
  revised_text: Und seinem Haus fehle alles, was seine Seele erfüllen wird.
