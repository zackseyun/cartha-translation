- from: Und sein Haus sei ohne alles, womit er seine Seele sättigen könnte.
  to: Und seinem Haus fehle alles, was seine Seele erfüllen wird.
  rationale: Die Revision bewahrt die knappe imprekative Form sowie die Offenheit von „Haus“ und „Seele“, gibt aber den Futur von ἐμπλήσει ohne potenzielle Abschwächung wieder. Die Satzstellung ist dabei idiomatisches modernes Standarddeutsch.
