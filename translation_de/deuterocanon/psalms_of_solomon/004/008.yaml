  source_fidelity: Der Wunschcharakter von ἀνακαλύψαι ὁ θεός ist mit „Gott decke … auf“ gut getroffen; die Wiederholung von „Taten“ entspricht dem griechischen Text. Die schwer deutbare Wortgruppe ἀνθρώπων ἀρεσκόν sollte jedoch nicht durch die ungewöhnliche und semantisch weniger präzise Bildung „Menschengefälliger“ festgelegt werden. Gemeint ist wahrscheinlich eine Person, die Menschen gefallen will; die Fußnote muss die syntaktische Unsicherheit bewahren.
  naturalness: „Gott decke … auf“ ist natürliche gehobene Gebets- und Verwünschungssprache. „Menschengefälliger“ wirkt im modernen Standarddeutsch ungebräuchlich und kann eher „jemand, der Menschen gefällt“ als „jemand, der Menschen gefallen will“ nahelegen. „Menschengefällige“ ist als ethisch-religiöse Bezeichnung klarer. „Unter Spott und Hohn“ ist knapp und im poetischen Nachsatz angemessen.
  terminology: „Taten“, „Spott“ und „Hohn“ geben ἔργα, καταγέλως und μυκτηρισμός treffend wieder. „Menschengefällige“ wahrt den spezifischen ethischen Begriff besser als eine paraphrastische Haupttextlösung und wird durch die Anmerkung erläutert.
