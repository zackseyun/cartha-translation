  text: May God expose the deeds of the man-pleaser[a], his deeds with ridicule and derision.
translation:
  language: de
  text: Gott decke die Taten des Menschengefälligen[a] auf, seine Taten unter Spott und Hohn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die griechische Formulierung ist grammatisch schwierig; wahrscheinlich ist ein Mensch gemeint, der Menschen gefallen will.
    reason: Erläutert die wahrscheinlich gemeinte ethische Bezeichnung, ohne die syntaktische Unsicherheit des überlieferten griechischen Textes zu verdecken.
lexical_decisions:
- source_word: ἀνακαλύψαι ὁ θεὸς
  choice: Gott decke … auf
  rationale: Der formal infinitivische Ausdruck steht im Zusammenhang eines Fluch- bzw. Wunschgebets. Der deutsche Konjunktiv I gibt diesen jussivischen Wunsch knapp und würdig wieder.
- source_word: τὰ ἔργα
  choice: die Taten
  rationale: „Taten“ bezeichnet hier das sittlich bewertete Handeln und passt natürlicher zur öffentlichen Aufdeckung als das allgemeinere „Werke“.
- source_word: ἀνθρώπων ἀρεσκόν
  choice: des Menschengefälligen
  rationale: Die überlieferte griechische Wortfügung ist grammatisch schwierig, bezeichnet im Kontext aber am ehesten jemanden, der Menschen zu gefallen sucht. „Menschengefälliger“ bewahrt den ethisch-religiösen Begriff und ist im Deutschen verständlich.
- source_word: ἐν καταγέλωτι
  choice: unter Spott
  rationale: „Unter Spott“ gibt die begleitende öffentliche Lächerlichmachung idiomatisch wieder, ohne ἐν unnötig räumlich zu verstehen.
- source_word: μυκτηρισμῷ
  choice: Hohn
  rationale: „Hohn“ bezeichnet verächtliche Verspottung und bewahrt neben „Spott“ die Zweigliedrigkeit des griechischen Ausdrucks.
theological_decisions:
- issue: Bezug von ἀνθρώπων ἀρεσκόν
  choice: Bezeichnung eines Menschen, der Menschen zu gefallen sucht
  alternative: allgemeine Aussage über das Gefallen von Menschen bzw. über mehrere Menschen
  rationale: Die Syntax des überlieferten Textes ist ungewöhnlich; der unmittelbare Zusammenhang und die parallele ethische Begrifflichkeit sprechen jedoch für eine substantivische Personenbezeichnung. Die Fußnote macht die sprachliche Schwierigkeit sichtbar, ohne den Haupttext unleserlich zu machen.
translation_notes:
  register: Moderne, gehobene Gebetssprache. Der Konjunktiv „decke … auf“ erhält den Verwünschungs- bzw. Wunschcharakter; die Wiederholung von „seine Taten“ bewahrt die poetische Ellipse und Nachdrücklichkeit des griechischen Bikolons.
