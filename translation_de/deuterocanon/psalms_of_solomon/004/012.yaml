  text: His words are false reasonings for carrying out the desire of unjust men[a][b][c].
translation:
  language: de
  text: Seine Worte sind Trugschlüsse, um das Verlangen ungerechter Menschen in die Tat umzusetzen.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Seine Worte sind Täuschungen“ beziehungsweise „betrügerische Gedankengänge“.'
    reason: lexical_alternative
  - marker: b
    text: 'ἀδίκων kann auch sächlich verstanden werden: „um ein Verlangen nach ungerechten Dingen in die Tat umzusetzen“.'
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: λόγοι
  choice: Worte
  rationale: Die konkrete Wiedergabe hält den Blick auf das, was der Betreffende sagt, ohne den Ausdruck unnötig als Rede oder Lehre auszudeuten.
- source_word: παραλογισμοί
  choice: Trugschlüsse
  rationale: Das Wort bezeichnet falsche oder täuschende Gedankengänge. „Trugschlüsse“ bewahrt sowohl die gedankliche als auch die betrügerische Seite und ist im Deutschen knapp und verständlich.
- source_word: εἰς πρᾶξιν
  choice: um … auszuführen
  rationale: 'εἰς mit πρᾶξιν bezeichnet hier Ziel oder Zweck: Die Worte dienen dazu, ein Verlangen in die Tat umzusetzen.'
- source_word: ἐπιθυμίας
  choice: das Verlangen
  rationale: „Verlangen“ wahrt die Breite des griechischen Begriffs und legt ihn nicht vorschnell auf sexuelles Begehren fest.
- source_word: ἀδίκων
  choice: ungerechter Menschen
  rationale: Die Form kann als substantiviertes Maskulinum im Genitiv verstanden werden und bezeichnet dann die ungerechten Menschen, deren Verlangen ausgeführt werden soll. Die mögliche neutrale Deutung wird in einer Fußnote offengehalten.
theological_decisions:
- issue: Bezug und Geschlecht von ἀδίκων
  choice: 'substantiviertes Maskulinum: „ungerechter Menschen“'
  alternative: 'substantiviertes Neutrum bzw. objektiver Genitiv: „nach ungerechten Dingen“'
  rationale: Die griechische Genitivform ist formal mehrdeutig. Der unmittelbare Wortlaut erlaubt die personale Deutung, doch die sachbezogene Deutung ist ebenfalls grammatisch möglich und wird deshalb nicht verschwiegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz bleibt knapp und bewahrt die Mehrdeutigkeit des griechischen Genitivs in einer Fußnote.
