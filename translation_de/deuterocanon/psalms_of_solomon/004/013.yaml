base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/004/013.yaml
  text: He did not stop until he had succeeded in scattering them as in orphanhood[c][b][a], and he made a house desolate because of lawless desire.
translation:
  language: de
  text: Er hörte nicht auf, bis es ihm gelungen war, sie zu zerstreuen, als wären sie Waisen[a]; und wegen gesetzloser Begierde verwüstete er ein Haus[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die griechische Wendung lautet wörtlich etwa „wie in Verwaisung“ und kann auch „wie unter Waisen“ verstanden werden.
    reason: lexical_alternative
  - marker: b
    text: „Haus“ kann hier im weiteren Sinn die Hausgemeinschaft oder Familie meinen.
    reason: cultural_note
lexical_decisions:
- source_word: οὐκ ἀπέστη
  choice: Er hörte nicht auf
  rationale: Im Zusammenhang bezeichnet das Verb das beharrliche Fortsetzen seines zerstörerischen Handelns, nicht ein räumliches Weggehen.
- source_word: ἕως ἐνίκησεν σκορπίσαι
  choice: bis es ihm gelungen war, sie ... zu zerstreuen
  rationale: νικάω mit folgendem Infinitiv bezeichnet hier das erfolgreiche Erreichen eines Ziels. Das im Griechischen unausgesprochene Objekt wird im Deutschen durch „sie“ aus dem Zusammenhang ergänzt, ohne οἶκον aus dem nächsten Satzteil vorwegzunehmen.
- source_word: ὡς ἐν ὀρφανίᾳ
  choice: wie in Verwaisung
  rationale: Die ungewöhnliche, bildhafte Wendung bleibt bewusst ungewöhnlich und bewahrt das Motiv des Verlusts familiären Schutzes; ihre genaue Beziehung zum Zerstreuen bleibt offen.
- source_word: ἠρήμωσεν οἶκον
  choice: ließ er ein Haus veröden
  rationale: Die Wiedergabe erhält den Gedanken des Ödewerdens und zugleich das konkrete „Haus“, das im Zusammenhang auch die Hausgemeinschaft bezeichnen kann.
- source_word: ἕνεκεν ἐπιθυμίας παρανόμου
  choice: wegen gesetzloser Begierde
  rationale: „Gesetzlos“ bewahrt die moralisch-rechtliche Färbung von παράνομος; „Begierde“ lässt offen, ob besonders sexuelles Begehren gemeint ist.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die auffällige Wendung „wie in Verwaisung“ wahrt die Bildhaftigkeit und Mehrdeutigkeit des Griechischen; die Satzstruktur bleibt eng am zweigliedrigen Ausgangstext.
