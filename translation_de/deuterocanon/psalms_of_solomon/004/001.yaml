  text: Why do you[a], profane one, sit in a holy council, while your heart has gone far away from the Lord[b], provoking the God of Israel with proverbs?
translation:
  language: de
  text: Warum sitzt du, Gottloser, in einem frommen Rat, während dein Herz sich weit vom Herrn entfernt hat und du den Gott Israels mit Sprüchen[a] zum Zorn reizt?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit Sprichwörtern“, „mit Spottreden“ oder „in rätselhafter Rede“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: βέβηλε
  choice: du Unheiliger
  rationale: Die Anrede bezeichnet einen Menschen, der dem Heiligen fernsteht oder es entweiht. „Unheiliger“ bewahrt den scharfen Gegensatz zum „heiligen Rat“, ohne ausdrücklich Gottesleugnung zu unterstellen.
- source_word: συνεδρίῳ ὁσίῳ
  choice: in einem heiligen Rat
  rationale: συνέδριον bezeichnet eine beratende, versammelte Körperschaft; ὅσιος kennzeichnet sie als heilig beziehungsweise fromm. „Heiliger Rat“ ist knapp, würdevoll und bildet den Gegensatz zu βέβηλε ab.
- source_word: ἡ καρδία σου μακρὰν ἀφέστηκεν
  choice: dein Herz sich weit vom Herrn entfernt hat
  rationale: Das Perfekt bezeichnet eine vollzogene Entfernung mit fortdauerndem Ergebnis. Die deutsche Formulierung gibt sowohl die Abwendung als auch den gegenwärtigen Zustand der Entfremdung wieder.
- source_word: τοῦ κυρίου
  choice: vom Herrn
  rationale: κύριος bezeichnet hier eindeutig Gott; daher steht die traditionelle und im Deutschen natürliche Wiedergabe „der Herr“.
- source_word: ἐν παροιμίαις
  choice: mit Sprüchen
  rationale: παροιμία kann Sprichwort, Sinnspruch, bildhafte Rede oder spöttischen Ausspruch bezeichnen. „Sprüche“ hält diese Bandbreite eher offen als das engere „Sprichwörter“.
- source_word: παροργίζων
  choice: reizt ... zum Zorn
  rationale: Das Partizip bezeichnet ausdrücklich das Hervorrufen von Zorn. „Zum Zorn reizen“ gibt diese Bedeutung vollständig und idiomatisch wieder.
theological_decisions:
- issue: Bedeutung von ὅσιος im Ausdruck συνεδρίῳ ὁσίῳ
  choice: heiligen Rat
  alternative: frommen Rat; Rat der Frommen
  rationale: ὅσιος kann besonders die fromme, Gott gemäße Haltung bezeichnen. Der Text nennt jedoch grammatisch den Rat selbst ὅσιος; „Rat der Frommen“ würde die Eigenschaft deutender auf dessen Mitglieder übertragen. „Heilig“ wahrt den direkten Gegensatz zu βέβηλε, ohne eine bestimmte Gruppenzugehörigkeit festzulegen.
translation_notes:
  register: Moderne, würdige Standardsprache. Die doppelte Anrede „du, du Unheiliger“ wirkt bewusst scharf und erhält den rhetorischen Nachdruck des griechischen σύ, βέβηλε. Der lange Fragesatz folgt der Argumentbewegung des Originals, ist aber im Deutschen syntaktisch geglättet.
