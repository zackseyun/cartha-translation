  yaml_path: translation/deuterocanon/psalms_of_solomon/004/017.yaml
  text: May his life be in pains and poverty and want[a], O Lord; his sleep in griefs[b], and his waking in distresses.
translation:
  language: de
  text: Sein Leben sei in Schmerzen, Armut und Not[a], Herr; sein Schlaf in Kummer und sein Erwachen in Nöten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort kann je nach Zusammenhang auch »Mangel«, »Hilflosigkeit« oder »Bedrängnis« bedeuten; es steht am Versende nochmals im Plural.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀδύναις
  choice: Schmerzen
  rationale: Der Plural umfasst körperliches wie seelisches Leiden, ohne die Aussage zu »Qualen« zu steigern.
- source_word: πενίᾳ
  choice: Armut
  rationale: Das Substantiv bezeichnet materielle Armut beziehungsweise Mangel; »Armut« ist die klare und natürliche deutsche Entsprechung.
- source_word: ἀπορίᾳ
  choice: Not
  rationale: Im Zusammenhang mit Armut bezeichnet das Wort eher schwere Mangellage, Hilflosigkeit oder Bedrängnis als gedankliche Ratlosigkeit.
- source_word: ζωὴ
  choice: Leben
  rationale: Die übliche Entsprechung bezeichnet hier die gesamte Lebenslage des Betroffenen.
- source_word: λύπαις
  choice: Kummer
  rationale: »Kummer« gibt den emotionalen Gehalt natürlich wieder; im Deutschen kann der Kollektivsingular den griechischen Plural idiomatisch abbilden.
- source_word: ἐξέγερσις
  choice: Erwachen
  rationale: Das Wort bezeichnet das Aufwachen beziehungsweise Sich-Erheben aus dem Schlaf; »Erwachen« bildet einen natürlichen Gegenpol zu »Schlaf«.
- source_word: ἀπορίαις
  choice: Bedrängnissen
  rationale: Beim Erwachen hebt der Kontext fortdauernde, vielfältige Nöte hervor. Der Plural wahrt die Form des griechischen Textes und bleibt im Bedeutungsfeld von ἀπορία.
- source_word: Κύριε
  choice: Herr
  rationale: Der Vokativ ist als direkte, gebetartige Anrede wiedergegeben.
theological_decisions:
- issue: Verbloser Satz und Gebetsmodus
  choice: 'Optativisch: »Sein Leben sei …«'
  alternative: 'Indikativisch: »Sein Leben ist …«'
  rationale: Die verblosen Satzglieder stehen im fortlaufenden Zusammenhang von Verwünschungen und Bitten (vgl. die ausdrücklichen Optative in den Nachbarversen). Die deutsche Jussivform wahrt diesen Zusammenhang, ohne ein im Vers selbst nicht vorhandenes Verb einzusetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ergänzte Wendung »von … erfüllt« macht die verblosen griechischen Wendungen idiomatisch, während »sei« den im Kontext geforderten Wunsch- beziehungsweise Verwünschungscharakter erhält. Die Reihung bleibt knapp und rhythmisch.
