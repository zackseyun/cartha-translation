  source_fidelity: Die optativische Wiedergabe ist im Kontext der fortlaufenden Verwünschung zutreffend. Die drei mit ἐν eingeleiteten Nominalgruppen werden jedoch im Ausgangstext parallel geführt. Das ergänzte »von … erfüllt« in der ersten Gruppe zerstört diese Parallelität und lässt die folgenden Gruppen syntaktisch ungleichartig erscheinen. Die Wiederaufnahme von ἀπορία sollte im Deutschen zudem möglichst erkennbar bleiben.
  naturalness: »Sein Leben sei in Schmerzen, Armut und Not …; sein Schlaf in Kummer und sein Erwachen in Nöten« ist würdiges, modernes Standarddeutsch und erhält die knappe, parallele Satzführung. »In Nöten« ist idiomatisch und vermeidet das etwas schwerfällige »in Bedrängnissen«.
  terminology: »Schmerzen«, »Armut«, »Not/Nöten«, »Kummer«, »Erwachen« und »Herr« sind angemessen. Die Form »Not/Nöten« bildet die Wiederholung von ἀπορία/ἀπορίαις transparent ab, ohne die semantische Bandbreite auf bloße materielle Armut zu verengen.
