translation:
  language: de
  text: Schnell tritt er mit Heiterkeit in jedes Haus, als wäre er arglos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ταχὺς εἰσόδῳ
  choice: Schnell betritt er
  rationale: Die wörtliche Fügung »schnell beim Eintreten« wird als natürlicher deutscher Satz wiedergegeben; der Gedanke der raschen Bereitschaft zum Eintritt bleibt erhalten.
- source_word: εἰς πᾶσαν οἰκίαν
  choice: jedes Haus
  rationale: Gibt die umfassende Aussage von πᾶσαν direkt und idiomatisch wieder.
- source_word: ἱλαρότητι
  choice: heiter
  rationale: Der Dativ bezeichnet die Art des Auftretens; »heiter« bewahrt den Sinn von Fröhlichkeit beziehungsweise freundlicher Unbeschwertheit knapp und natürlich.
- source_word: ὡς ἄκακος
  choice: als wäre er unschuldig
  rationale: ὡς wird hier vergleichend beziehungsweise den Anschein bezeichnend verstanden. »Als wäre« bewahrt die Distanz zwischen Auftreten und Wirklichkeit; ἄκακος bezeichnet jemanden ohne Schuld oder böse Absicht.
theological_decisions:
- issue: Ob ὡς ἄκακος echte Unschuld behauptet oder nur den Anschein beschreibt
  choice: als wäre er unschuldig
  alternative: wie ein Unschuldiger
  rationale: Der Zusammenhang der Beschreibung eines heuchlerischen Menschen und die Vergleichspartikel ὡς sprechen dafür, den vorgespiegelten Eindruck auszudrücken, ohne die Person tatsächlich für unschuldig zu erklären.
translation_notes:
  register: Moderner, knapper und würdevoller deutscher Stil. Die elliptische griechische Charakterisierung wird zu einem flüssigen Hauptsatz entfaltet; der Gegensatz zwischen heiterem Auftreten und nur scheinbarer Unschuld bleibt bestehen.
