base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/004/028.yaml
  text: May God remove those who do every kind of unrighteousness in arrogance[c][b][a], for the Lord our God is a great and mighty judge in righteousness.
translation:
  language: de
  text: Gott möge alle beseitigen,[a] die in Überheblichkeit jede Ungerechtigkeit begehen,[b] denn der Herr, unser Gott, ist ein großer und mächtiger Richter, der in Gerechtigkeit richtet.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher steht im Griechischen ein Infinitiv: „Gott zu beseitigen“. Im Zusammenhang drückt er einen Wunsch oder eine Verwünschung aus: „Gott möge beseitigen …“'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „alles Unrecht begehen“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „der gerecht richtet“ beziehungsweise „der nach Recht richtet“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξᾶραι
  choice: möge … beseitigen
  rationale: Der Aoristinfinitiv hat hier im Gebets- und Verwünschungskontext die Kraft eines Wunsches. Die Formulierung gibt diesen Sinn in natürlichem Deutsch wieder, ohne eine bestimmte gewaltsame Todesart einzutragen.
- source_word: τοὺς ποιοῦντας
  choice: alle, die … begehen
  rationale: Das substantivierte Partizip bezeichnet Menschen, deren Handeln durch die genannte Ungerechtigkeit gekennzeichnet ist. „Begehen“ verbindet sich im Deutschen idiomatisch mit „Ungerechtigkeit“.
- source_word: ἐν ὑπερηφανίᾳ
  choice: in Überheblichkeit
  rationale: Die nominale Wendung bewahrt sowohl die Art und Weise als auch die innere Haltung des Handelns. „Überheblichkeit“ trifft hier den negativen Sinn von ὑπερηφανία genauer als ein möglicherweise positiv verstandener „Stolz“.
- source_word: πᾶσαν ἀδικίαν
  choice: jede Ungerechtigkeit
  rationale: Die Wiedergabe bewahrt den umfassenden Bezug von πᾶσαν und die breite moralische wie soziale Bedeutung von ἀδικία.
- source_word: κριτὴς
  choice: Richter
  rationale: Der richterliche Sinn ist im Zusammenhang vorrangig und begründet die erbetene Beseitigung der Übeltäter.
- source_word: μέγας καὶ κραταιὸς
  choice: großer und mächtiger
  rationale: Die Wortpaarung bleibt eng am Griechischen und klingt zugleich würdig und gegenwärtig.
- source_word: Κύριος
  choice: Herr
  rationale: „Herr“ ist die natürliche deutsche Wiedergabe des göttlichen Titels κύριος.
- source_word: ἐν δικαιοσύνῃ
  choice: der in Gerechtigkeit richtet
  rationale: Die Ergänzung des im Deutschen benötigten Verbs macht deutlich, dass die Wendung das richterliche Handeln näher bestimmt, und erhält zugleich den theologischen Begriff „Gerechtigkeit“.
theological_decisions:
- issue: Bedeutung von δικαιοσύνη im richterlichen Zusammenhang
  choice: Gerechtigkeit
  alternative: Recht / gerecht
  rationale: „Gerechtigkeit“ erhält die umfassende moralische Bedeutung des griechischen Begriffs, während „Recht“ den Ausdruck stärker auf den forensischen Bereich verengen könnte.
- issue: Charakter der Eingangsform als Wunsch oder Verwünschung
  choice: Gott möge … beseitigen
  alternative: 'Gott soll … beseitigen / wörtlich: Gott zu beseitigen'
  rationale: Die Wunschform wahrt den gebetsartigen, imprekatorischen Charakter, ohne die grammatisch ungewöhnliche Infinitivkonstruktion in unnatürlichem Deutsch nachzubilden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Formulierung bleibt nahe an der griechischen Satzstruktur, glättet aber die Infinitivkonstruktion und macht den Bezug von ἐν δικαιοσύνῃ auf das Richten im Deutschen ausdrücklich.
