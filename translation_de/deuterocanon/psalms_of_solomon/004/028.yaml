  text: ἐξᾶραι ὁ θεὸς τοὺς ποιοῦντας ἐν ὑπερηφανίᾳ πᾶσαν ἀδικίαν, ὅτι κριτὴς μέγας καὶ κραταιὸς Κύριος ὁ θεὸς ἡμῶν ἐν δικαιοσύνῃ.
