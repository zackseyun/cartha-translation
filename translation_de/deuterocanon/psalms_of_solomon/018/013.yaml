  text: ἐν φόβῳ θεοῦ ἡ ὁδὸς αὐτῶν καθʼ ἑκάστην ἡμέραν, ἀφʼ ἧς ἡμέρας ἔκτισεν αὐτοὺς ὁ θεὸς καὶ ἕως αἰῶνος.
