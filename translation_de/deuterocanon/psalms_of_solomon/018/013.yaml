base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/018/013.yaml
  text: Their way is in the fear of God every day[b][a], from the day God created them and forever.
translation:
  language: de
  text: In der Furcht Gottes gehen sie Tag für Tag ihren Weg[a][b], von dem Tag an, an dem Gott sie erschuf, und bis in Ewigkeit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »Ihr Weg ist Tag für Tag in der Furcht Gottes.«'
    reason: formal_alternative
  - marker: b
    text: 'Oder: »in Ehrfurcht vor Gott«; für »ihren Weg« auch: »ihren Lebenswandel«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν φόβῳ θεοῦ
  choice: in der Furcht Gottes
  rationale: Die traditionelle und im Deutschen verständliche Wendung bewahrt den theologischen Gehalt ehrfürchtiger, auf Gott ausgerichteter Lebensführung, ohne sie auf bloße Angst einzuengen.
- source_word: ἡ ὁδὸς αὐτῶν
  choice: gehen sie … ihren Weg
  rationale: Die verbale Formulierung klingt im modernen Deutschen natürlicher als „ihr Weg ist“, bewahrt aber die Wegmetapher für Lebensführung und Verhalten.
- source_word: καθʼ ἑκάστην ἡμέραν
  choice: Tag für Tag
  rationale: Die Wendung gibt die fortdauernde tägliche Regelmäßigkeit idiomatisch wieder.
- source_word: ἀφʼ ἧς ἡμέρας
  choice: von dem Tag an, an dem
  rationale: Diese Formulierung markiert den zeitlichen Ausgangspunkt klar und verbindet sich natürlich mit dem folgenden Verb.
- source_word: ἔκτισεν
  choice: erschuf
  rationale: „Erschuf“ gibt κτίζω präzise wieder und bewahrt den Bezug auf Gottes Schöpfungshandeln.
- source_word: ἕως αἰῶνος
  choice: bis in Ewigkeit
  rationale: Die geläufige biblische Wendung erhält sowohl die durch ἕως bezeichnete zeitliche Erstreckung als auch die offene, unbegrenzte Dauer von αἰών.
theological_decisions:
- issue: Bedeutung von φόβος θεοῦ
  choice: Furcht Gottes
  alternative: Ehrfurcht vor Gott
  rationale: „Furcht Gottes“ bewahrt die traditionelle theologische Spannung zwischen ehrfürchtigem Respekt und wirklicher Furcht; eine reine Wiedergabe als „Ehrfurcht“ würde den Bedeutungsumfang verengen.
- issue: Zeitliche Tragweite von ἕως αἰῶνος
  choice: bis in Ewigkeit
  alternative: für immer
  rationale: Die gewählte Form lässt die traditionsreiche, eschatologisch offene Ausdrucksweise stehen, ohne die genaue metaphysische Tragweite über den griechischen Wortlaut hinaus festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die leicht gehobene Wendung „Furcht Gottes“ und „bis in Ewigkeit“ entspricht dem poetisch-religiösen Register; die Satzstruktur wurde für natürliches Deutsch behutsam verbalisiert.
