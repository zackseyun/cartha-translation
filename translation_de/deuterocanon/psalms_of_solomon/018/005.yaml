translation:
  language: de
  text: eine lernbereite Seele in ihrer Unwissenheit von Torheit abzuwenden.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eine bereitwillig hörende Seele“ oder „eine gehorsame Seele“.'
    reason: lexical_alternative
  - marker: b
    text: Das Griechische unterscheidet hier ἀμαθία („Torheit“, „Unbelehrtheit“) und ἀγνοία („Unwissenheit“). Die knappe Fügung lässt die genaue Beziehung von „in Unwissenheit“ offen.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποστρέψαι
  choice: abzuwenden
  rationale: Der Aoristinfinitiv bezeichnet hier, jemanden oder etwas von einem Zustand oder Weg wegzuführen; „abwenden“ bewahrt zusammen mit ἀπό die Richtungsangabe.
- source_word: ψυχὴν
  choice: Seele
  rationale: „Seele“ erhält in diesem sittlich-religiösen Zusammenhang das anthropologische Gewicht von ψυχή.
- source_word: εὔκοον
  choice: lernbereite
  rationale: Das Adjektiv bezeichnet eine Seele, die bereitwillig hört und sich unterweisen lässt. „Lernbereit“ gibt diesen Bezug zum Hören und zur Unterweisung natürlich wieder, ohne förmlichen Gehorsam zwingend vorauszusetzen.
- source_word: ἀμαθίας
  choice: Torheit
  rationale: ἀμαθία bezeichnet mangelnde Bildung beziehungsweise Einsicht. „Torheit“ unterscheidet den Ausdruck von der unmittelbar folgenden ἀγνοία und bewahrt seine sittlich-intellektuelle Färbung.
- source_word: ἐν ἀγνοίᾳ
  choice: in Unwissenheit
  rationale: Die direkte Wiedergabe bewahrt die knappe griechische Fügung und lässt offen, ob Unwissenheit als Zustand, Begleitumstand oder Ursache der Torheit gemeint ist.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die ungewöhnlich knappe Verbindung „Torheit in Unwissenheit“ wurde beibehalten, um die Mehrdeutigkeit des griechischen ἐν nicht stillschweigend aufzulösen.
