lexical_decisions:
- source_word: μέγας
  choice: groß
  rationale: „Groß“ gibt den grundlegenden Sinn des Adjektivs wieder und passt zum feierlichen Lobpreis, ohne den Akzent einseitig auf Macht zu legen.
- source_word: ἔνδοξος
  choice: herrlich
  rationale: „Herrlich“ ist im Kontext des Gotteslobs natürlich und bewahrt den deutlichen Bezug auf Gottes Herrlichkeit.
- source_word: ἐν ὑψίστοις
  choice: in den Höhen
  rationale: Die Wendung bezeichnet wörtlich die höchsten Orte oder Bereiche. „In den Höhen“ bewahrt das räumliche Bild, ohne ausdrücklich „Himmel“ zu ergänzen.
- source_word: κατοικῶν
  choice: der ... wohnt
  rationale: Der griechische Präsenspartizip bezeichnet Gottes fortdauerndes Wohnen. Ein deutscher Relativsatz klingt natürlich und gibt diesen Sinn klar wieder.
theological_decisions:
- issue: Bezug von ἐν ὑψίστοις
  choice: in den Höhen
  alternative: in den höchsten Höhen; in den höchsten Himmeln
  rationale: Der griechische Ausdruck lässt offen, ob allgemein die höchsten Bereiche oder ausdrücklich die Himmel gemeint sind. Die Übersetzung erhält diese Offenheit.
translation_notes:
  register: Feierlich und doxologisch, zugleich in modernem Standarddeutsch. Die vorangestellten Adjektive bewahren die emphatische Wortstellung des Griechischen; der Relativsatz gibt das Partizip idiomatisch wieder.
