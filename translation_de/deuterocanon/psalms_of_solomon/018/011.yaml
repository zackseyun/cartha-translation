  text: Great and glorious is our God[a], dwelling in the heights;
translation:
  language: de
  text: Groß und herrlich ist unser Gott, der in den Höhen wohnt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der in den höchsten Höhen wohnt“; möglicherweise auch: „der in den höchsten Himmeln wohnt“.'
