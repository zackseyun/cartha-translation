  yaml_path: translation/deuterocanon/psalms_of_solomon/018/007.yaml
  text: Blessed are those who come to be in those days[b][a], to see the good things of the Lord that he will do for the generation to come.
translation:
  language: de
  text: Glücklich sind die, die in jenen Tagen ins Dasein kommen[a], das Gute des Herrn[b] zu sehen, das er für die kommende Generation tun wird.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die in jenen Tagen geboren werden“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „die Segnungen des Herrn“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριοι
  choice: Glücklich
  rationale: Gibt die Seligpreisungsformel in natürlichem modernem Deutsch wieder; „selig“ wäre traditioneller, kann heute jedoch enger religiös oder jenseitig verstanden werden.
- source_word: οἱ γενόμενοι
  choice: die … leben
  rationale: Das substantivierte Partizip von γίνομαι bezeichnet hier diejenigen, die in jener künftigen Zeit da sein beziehungsweise ins Dasein gekommen sein werden. „leben“ ist idiomatisch, ohne die Bedeutung unnötig auf Geburt einzuengen.
- source_word: ἐν ἡμέραις ἐκείναις
  choice: in jenen Tagen
  rationale: Bewahrt die vertraute zeitliche Wendung des Griechischen in würdigem, verständlichem Deutsch.
- source_word: ἰδεῖν
  choice: und … sehen
  rationale: Der Infinitiv bezeichnet, was diesen Menschen vergönnt sein wird. Die koordinierte deutsche Fassung vermeidet einen unnatürlichen Anschluss mit „zu sehen“.
- source_word: τὰ ἀγαθὰ Κυρίου
  choice: das Gute des Herrn
  rationale: Bewahrt die semantische Weite des substantivierten Neutrums Plural; im Deutschen ist der kollektive Singular natürlicher als „die guten Dinge“.
- source_word: ἃ ποιήσει
  choice: das er … tun wird
  rationale: Gibt ποιεῖν direkt wieder und erhält ausdrücklich den Herrn als Handelnden.
- source_word: γενεᾷ τῇ ἐρχομένῃ
  choice: für die kommende Generation
  rationale: Gibt dem Dativ seine naheliegende begünstigende Beziehung und bewahrt die Zukunftsausrichtung des Partizips.
theological_decisions:
- issue: Zeitliche Identität der Gepriesenen
  choice: „die in jenen Tagen leben“
  alternative: „die in jenen Tagen geboren werden“ / „die in jenen Tagen ins Dasein kommen“
  rationale: γενόμενοι kann das Ins-Dasein-Kommen nahelegen, legt aber nicht eindeutig eine Geburt fest. Die Übersetzung hält offen, ob alle dann Lebenden oder besonders die dann Geborenen gemeint sind.
- issue: Bedeutungsumfang von τὰ ἀγαθὰ Κυρίου
  choice: „das Gute des Herrn“
  alternative: „die Segnungen des Herrn“
  rationale: „Segnungen“ würde die sachlich breite Formulierung stärker theologisch bestimmen, als es der griechische Ausdruck verlangt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit leicht biblischer Färbung („in jenen Tagen“, „des Herrn“). Die Wortstellung ist auf natürliche Lesbarkeit ausgerichtet; echte lexikalische Offenheit wird in den Fußnoten bewahrt.
