    issue: „die in jenen Tagen leben“ statt οἱ γενόμενοι
    rationale: „Leben“ bezeichnet den Aufenthalt bzw. das Lebendigsein in jener Zeit, während γενόμενοι das Werden bzw. Ins-Dasein-Kommen ausdrückt. Die gegenwärtige Hauptfassung verschiebt daher die Aussage, obwohl die Fußnote die nähere Bedeutung aufführt.
  revised_text: Glücklich sind die, die in jenen Tagen ins Dasein kommen[a], das Gute des Herrn[b] zu sehen, das er für die kommende Generation tun wird.
