revisions:
- from: Glücklich sind, die in jenen Tagen leben[a] und das Gute des Herrn sehen, das er für die kommende Generation tun wird.[b]
  to: Glücklich sind die, die in jenen Tagen ins Dasein kommen[a], das Gute des Herrn[b] zu sehen, das er für die kommende Generation tun wird.
  rationale: Die Revision ersetzt die interpretierend verallgemeinernde Wiedergabe „leben“ durch „ins Dasein kommen“, das die Grundbedeutung von γενόμενοι wahrt, ohne sie auf körperliche Geburt festzulegen. Die alternative Deutung „geboren werden“ bleibt in der Fußnote. Die Fußnotenanker werden unmittelbar an den jeweils erläuterten Ausdruck gesetzt. Alle übrigen Formulierungen können beibehalten werden.
