  text: Lord[a], your mercy is upon the works of your hands forever[b];
translation:
  language: de
  text: Herr, deine Barmherzigkeit ruht[a] für immer auf den Werken deiner Hände[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „ist … über“ oder „erstreckt sich … auf“.'
    reason: lexical_alternative
  - marker: b
    text: „Werke deiner Hände“ kann auch mit „dein Werk“ oder „alles, was deine Hände geschaffen haben“ wiedergegeben werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: Κύριε
  choice: Herr
  rationale: Der Vokativ wird im modernen Deutschen durch die direkte Anrede „Herr“ klar wiedergegeben; ein zusätzliches „O“ ist nicht nötig.
- source_word: τὸ ἔλεός σου
  choice: deine Barmherzigkeit
  rationale: ἔλεος bezeichnet barmherzige Zuwendung, Erbarmen oder Güte. „Barmherzigkeit“ ist hier würdig, verständlich und lässt sowohl Haltung als auch wirksame Zuwendung anklingen.
- source_word: ἐπὶ
  choice: ruht … auf
  rationale: ἐπί beschreibt hier bildhaft, dass Gottes Barmherzigkeit auf seinen Werken liegt beziehungsweise sich auf sie erstreckt. „ruht auf“ gibt dieses Bild in natürlichem Deutsch wieder, ohne den Bezug enger festzulegen.
- source_word: τὰ ἔργα τῶν χειρῶν σου
  choice: den Werken deiner Hände
  rationale: Die konkrete anthropomorphe Wendung wird bewahrt. Sie verweist auf das von Gott Geschaffene, ohne ἔργα ausdrücklich auf „Schöpfung“ einzuengen.
- source_word: εἰς τὸν αἰῶνα
  choice: für immer
  rationale: Die Wendung bezeichnet unbegrenzte Dauer. „für immer“ ist modernes, klares Deutsch; „in Ewigkeit“ bleibt als mögliche traditionellere Wiedergabe mitgemeint.
theological_decisions:
- issue: Ob τὰ ἔργα τῶν χειρῶν σου ausdrücklich als die Schöpfung bezeichnet werden soll
  choice: Werke deiner Hände
  alternative: dein Werk; alles, was deine Hände geschaffen haben
  rationale: Der griechische Wortlaut verwendet die bildhafte Wendung „Werke deiner Hände“ und legt keine engere sachliche Bestimmung fest. Ihre Beibehaltung wahrt die Bildsprache und vermeidet eine unnötige Auslegung.
- issue: Wie das Verhältnis der Barmherzigkeit zu den Werken in ἐπὶ auszudrücken ist
  choice: ruht auf
  alternative: ist über; erstreckt sich auf
  rationale: Die räumliche Metapher bleibt erkennbar. „ruht auf“ formuliert idiomatisch, ohne zu entscheiden, ob vor allem Schutz, Herrschaft oder Zuwendung gemeint ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter biblischer Bildsprache. Die direkte Anrede bleibt knapp; „ruht auf“ ist natürlich, ohne die Mehrdeutigkeit von ἐπί theologisch einzuengen.
