  yaml_path: translation/deuterocanon/psalms_of_solomon/018/002.yaml
  text: Your kindness is upon Israel like a rich gift[a]; your eyes look upon them[c][b], and none of them will be lacking.
translation:
  language: de
  text: Deine Güte ist über Israel wie eine reiche Gabe; deine Augen blicken auf sie, und keiner von ihnen wird Mangel leiden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Unter ihnen wird es keinen Mangel geben.“'
    reason: alternative_reading
lexical_decisions:
- source_word: χρηστότης
  choice: Güte
  rationale: „Güte“ gibt die wohltätige, freundlich handelnde Qualität des griechischen Wortes in einem würdigen und natürlichen deutschen Ausdruck wieder.
- source_word: ἐπὶ δόματος πλουσίου
  choice: wie eine reiche Gabe
  rationale: δόμα bedeutet „Gabe“ oder „Geschenk“ (nicht δῶμα, „Dach/Haus“). Die vergleichende Wiedergabe bildet die knappe poetische Konstruktion mit ἐπί verständlich ab.
- source_word: ἐπὶ Ἰσραήλ
  choice: kommt über Israel
  rationale: Die Formulierung bewahrt die räumliche Bildsprache von ἐπί und verbindet sie im Deutschen natürlich mit der über Israel kommenden Güte.
- source_word: ἐπιβλέποντες ἐπʼ αὐτά
  choice: blicken auf sie
  rationale: Die Wiedergabe erhält das konkrete Motiv des Sehens und vermeidet die stärker deutende Übersetzung „wachen über sie“.
- source_word: οὐχ ὑστερήσει ἐξ αὐτῶν
  choice: keiner von ihnen wird Mangel leiden
  rationale: ὑστερέω kann Mangel oder Entbehrung bezeichnen. Die Formulierung folgt der naheliegenden kollektiven Beziehung auf Israel, ohne den Gegenstand des Mangels zu ergänzen.
theological_decisions:
- issue: Bezug und Aussage der Schlussklausel
  choice: 'Die Aussage wird auf die einzelnen Angehörigen Israels bezogen: Keiner von ihnen wird Mangel leiden.'
  alternative: '„Unter ihnen wird es keinen Mangel geben“ oder unpersönlicher: „Von ihnen wird nichts fehlen“.'
  rationale: Der griechische Ausdruck ist elliptisch und lässt offen, ob einzelne Personen oder ein Mangel innerhalb der Gemeinschaft im Vordergrund stehen. Die Hauptfassung ist im Deutschen klar und folgt dem kollektiven Bezug auf Israel; die sachlich mögliche unpersönliche Lesart bleibt in der Fußnote erhalten.
translation_notes:
  register: Moderne, würdige Psalmenprosa mit klarer Bildsprache. „Reiche Gabe“ korrigiert ausdrücklich die Verwechslung von δόμα („Gabe“) mit δῶμα („Dach/Haus“). Die elliptische Schlussaussage wird lesbar formuliert, ihre genuine Mehrdeutigkeit jedoch durch die Fußnote bewahrt.
