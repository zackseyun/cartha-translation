lexical_decisions:
- source_word: κατευθῦναι
  choice: zu leiten
  rationale: Der Infinitiv bezeichnet eine zielgerichtete Führung auf einen rechten Weg; „leiten“ ist natürlich und bewahrt den moralischen Richtungssinn.
- source_word: ἄνδρας
  choice: Männer
  rationale: Das griechische Substantiv ist ausdrücklich maskulin; ohne eindeutigen Kontext für einen generischen Gebrauch wird diese Form beibehalten.
- source_word: ἐν ἔργοις δικαιοσύνης
  choice: in Werken der Gerechtigkeit
  rationale: Die Wiedergabe erhält das konkrete Substantiv „Werke“ und lässt bei δικαιοσύνη sowohl moralische Rechtschaffenheit als auch den Gerechtigkeitsaspekt anklingen.
- source_word: φόβῳ θεοῦ
  choice: in der Furcht Gottes
  rationale: Der Dativ kann den Bereich oder die Art und Weise bezeichnen; die biblisch vertraute Wendung wahrt diese Offenheit.
- source_word: καταστῆσαι
  choice: zu stellen
  rationale: Der parallele Infinitiv bezeichnet hier das Versetzen beziehungsweise Aufstellen von Personen vor dem Herrn, ohne eine amtliche Einsetzung zu unterstellen.
- source_word: ἐνώπιον Κυρίου
  choice: vor den Herrn
  rationale: „Vor den Herrn“ ist die knappe, transparente Wiedergabe und bezeichnet zugleich seine Gegenwart.
theological_decisions:
- issue: Wiedergabe von δικαιοσύνη
  choice: Gerechtigkeit
  alternative: Rechtschaffenheit
  rationale: „Gerechtigkeit“ ist formal transparent und lässt die ethische wie die auf gerechtes Handeln bezogene Bedeutung offen; „Rechtschaffenheit“ würde den persönlichen Moralbezug stärker festlegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrtem Parallelismus der beiden Infinitive. Die ungewöhnliche, aber verständliche Formulierung „in Werken der Gerechtigkeit“ hält sich eng an die griechische Nominalfügung; die Alternativen werden in Fußnoten ausgewiesen.
