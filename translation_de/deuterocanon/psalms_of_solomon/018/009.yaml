translation:
  language: de
  text: um Männer in Werken der Gerechtigkeit[a][b] in der Furcht Gottes zu leiten und sie alle vor den Herrn zu stellen[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in gerechten Taten“.'
