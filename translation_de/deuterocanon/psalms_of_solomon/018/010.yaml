translation:
  language: de
  text: Eine gute Generation in Gottesfurcht, in Tagen des Erbarmens. Zwischenspiel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Zwischenspiel“ gibt διάψαλμα wieder, vermutlich einen liturgischen oder musikalischen Hinweis; traditionell auch „Sela“.
    reason: lexical_alternative
lexical_decisions:
- source_word: γενεὰ ἀγαθὴ
  choice: ein gutes Geschlecht
  rationale: „Geschlecht“ bewahrt den kollektiven Sinn von γενεά und den knappen nominalen Ausdruck; ἀγαθή wird ohne zusätzliche moralische Einengung schlicht mit „gut“ wiedergegeben.
- source_word: ἐν φόβῳ θεοῦ
  choice: in der Furcht Gottes
  rationale: Die vertraute biblische Wendung wahrt das Bedeutungsspektrum von Ehrfurcht, Scheu und gehorsamer Gottesbeziehung, ohne es auf bloße „Ehrfurcht“ zu verengen.
- source_word: ἐν ἡμέραις ἐλέους
  choice: in Tagen des Erbarmens
  rationale: Die artikellose Pluralform bleibt erhalten. „Erbarmen“ gibt ἔλεος in gehobenem, aber verständlichem Deutsch wieder und lässt offen, ob die Tage durch göttliches Erbarmen gekennzeichnet sind.
- source_word: διάψαλμα
  choice: Zwischenspiel
  rationale: Der wahrscheinlich liturgische oder musikalische Hinweis wird funktional und verständlich wiedergegeben, ohne eine genauere Bedeutung vorzutäuschen, als sprachlich gesichert ist.
- source_word: '[verbloser Nominalsatz]'
  choice: kein Verb ergänzt
  rationale: Die knappe, poetische Form des Griechischen wird bewahrt. Ein ergänztes „lebt“ oder „ist“ würde die syntaktische Offenheit unnötig festlegen.
theological_decisions:
- issue: Wiedergabe von φόβος θεοῦ
  choice: Furcht Gottes
  alternative: Ehrfurcht vor Gott
  rationale: „Furcht Gottes“ erhält die gewichtige biblische Ausdrucksweise samt ihrer Spannung zwischen Scheu, Ehrfurcht und Gehorsam.
- issue: Bezug und Funktion der beiden ἐν-Wendungen im verblosen Satz
  choice: Beide Präpositionalgruppen bleiben ohne ergänztes Verb nebeneinander stehen.
  alternative: „Ein gutes Geschlecht lebt in der Furcht Gottes in Tagen des Erbarmens.“
  rationale: Das Griechische bestimmt weder ausdrücklich ein Verb noch das genaue syntaktische Verhältnis. Die nominale Übersetzung bewahrt diese poetische Mehrdeutigkeit.
translation_notes:
  register: Knappe, gehobene poetische Sprache in modernem Standarddeutsch. Die verblöse Nominalzeile des Griechischen bleibt erhalten; der abschließende Fachausdruck wird durch eine verständliche Funktionsbezeichnung mit Fußnote erschlossen.
