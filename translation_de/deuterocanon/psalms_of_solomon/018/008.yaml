  text: ὑπὸ ῥάβδον παιδείας χριστοῦ κυρίου, ἐν φόβῳ θεοῦ αὐτοῦ, ἐν σοφίᾳ πνεύματος καὶ δικαιοσύνης καὶ ἰσχύος·
