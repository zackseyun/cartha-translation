base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/018/008.yaml
  text: under the rod of discipline of the Lord's Messiah[a], in the fear of his God, in wisdom of spirit and righteousness and strength[d][c][b];
translation:
  language: de
  text: unter dem Zuchtstab des Messias des Herrn[a], in der Furcht vor seinem Gott, in Weisheit des Geistes[b] und der Gerechtigkeit[c] und der Stärke;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die eng gefügte griechische Genitivverbindung kann auch als „des gesalbten Herrn“ oder „des Messias, des Herrn“ verstanden werden.
    reason: alternative_reading
  - marker: b
    text: „Geist“ kann hier den menschlichen Geist oder Gottes Geist bezeichnen.
    reason: lexical_and_theological_ambiguity
  - marker: c
    text: „Gerechtigkeit“ kann hier auch den Sinn von „Recht“ oder „gerechtem Handeln“ haben.
    reason: lexical_alternative
lexical_decisions:
- source_word: ῥάβδον παιδείας
  choice: Zuchtstab
  rationale: Die kompakte deutsche Zusammensetzung bewahrt sowohl das Bild des Stabes als auch den erzieherisch-korrigierenden Sinn von παιδεία.
- source_word: χριστοῦ
  choice: Messias
  rationale: Χριστός fungiert hier als Titel; „Messias“ erhält den jüdisch-messianischen Bedeutungsgehalt deutlicher als das im Deutschen stärker zum Eigennamen gewordene „Christus“.
- source_word: κυρίου
  choice: des Herrn
  rationale: Der Genitiv wird formal bewahrt; seine genaue syntaktische Beziehung zu χριστοῦ bleibt jedoch mehrdeutig und wird in der Fußnote erläutert.
- source_word: φόβῳ θεοῦ αὐτοῦ
  choice: in der Furcht vor seinem Gott
  rationale: „Furcht vor“ ist in modernem Deutsch idiomatisch und bewahrt sowohl φόβος als auch das ausdrückliche Possessivpronomen αὐτοῦ.
- source_word: σοφίᾳ
  choice: Weisheit
  rationale: „Weisheit“ ist die direkte und kontextuell passende Entsprechung.
- source_word: πνεύματος
  choice: des Geistes
  rationale: Die Schreibung lässt im Deutschen die mögliche Beziehung auf Gottes Geist offen; ebenso ist ein allgemeinerer Sinn von „Geist“ möglich.
- source_word: δικαιοσύνης
  choice: der Gerechtigkeit
  rationale: „Gerechtigkeit“ bewahrt den breiten ethischen Sinn; „Recht“ oder „Rechtsprechung“ wäre hier unnötig verengend.
- source_word: ἰσχύος
  choice: der Stärke
  rationale: „Stärke“ gibt ἰσχύς zurück, ohne den Ausdruck stärker als nötig in Richtung Herrschaft oder Gewalt zu deuten.
theological_decisions:
- issue: Syntaktische Beziehung von χριστοῦ κυρίου
  choice: des Messias des Herrn
  alternative: des gesalbten Herrn; des Messias, des Herrn
  rationale: Die dicht aufeinanderfolgenden Genitive lassen mehrere Beziehungen zu. Der Haupttext gibt die naheliegende Deutung als „Messias des Herrn“ wieder, während die Fußnote die echte Mehrdeutigkeit offenhält.
- issue: Bezug von πνεύματος
  choice: des Geistes
  alternative: des menschlichen Geistes; des Geistes Gottes
  rationale: Der griechische Ausdruck hat keinen Artikel und entscheidet nicht eindeutig, ob vom menschlichen Geist oder von Gottes Geist die Rede ist. Deshalb wird die Frage nicht dogmatisch festgelegt.
- issue: Abhängigkeit der Genitive πνεύματος καὶ δικαιοσύνης καὶ ἰσχύος
  choice: alle drei Genitive werden parallel an „Weisheit“ angeschlossen
  alternative: „Geist, Gerechtigkeit und Stärke“ als drei eigenständige Größen
  rationale: Die Kasusfolge spricht dafür, πνεύματος, δικαιοσύνης und ἰσχύος parallel von σοφίᾳ abhängig zu verstehen; die ungewöhnliche Spannung der Formulierung wird im Deutschen nicht geglättet.
translation_notes:
  register: Moderne, würdige Standardsprache. „Zuchtstab“ ist bewusst bildkräftig und bibelsprachlich, aber noch allgemein verständlich. Die fragmentarische, aufzählende Struktur und das abschließende Semikolon des Quelltexts bleiben erhalten.
