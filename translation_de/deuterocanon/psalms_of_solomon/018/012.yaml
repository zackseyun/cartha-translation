lexical_decisions:
- source_word: διατάξας
  choice: eingesetzt hat
  rationale: Das Partizip bezeichnet ein zielgerichtetes Anordnen oder Einsetzen. „eingesetzt hat“ gibt die bewusste Festlegung der Himmelslichter in ihrer geordneten Bewegung natürlich wieder.
- source_word: φωστῆρας
  choice: die Himmelslichter
  rationale: Im Zusammenhang mit geordneten Bahnen und Zeitabschnitten sind die leuchtenden Himmelskörper gemeint. „Himmelslichter“ ist verständlich, würdig und weniger fachsprachlich als „Gestirne“ oder „Leuchtkörper“.
- source_word: ἐν πορείᾳ
  choice: auf ihrer Bahn
  rationale: Die Wendung bezeichnet Bewegung oder ein geordnetes Dahinziehen. „auf ihrer Bahn“ passt zum kosmischen Bild, ohne moderne astronomische Vorstellungen wie eine Umlaufbahn ausdrücklich einzutragen.
- source_word: καιροὺς ὡρῶν
  choice: die festgesetzten Zeiten der Stunden
  rationale: 'Die ungewöhnliche Verbindung wird bewusst transparent wiedergegeben: καιρούς bezeichnet bestimmte oder festgesetzte Zeiten, ὡρῶν die Stunden beziehungsweise Zeitabschnitte. Die formale Spannung des Griechischen bleibt erhalten.'
- source_word: ἀφʼ ἡμερῶν εἰς ἡμέρας
  choice: Tag für Tag
  rationale: Die idiomatische Formulierung drückt fortdauernde Regelmäßigkeit aus; „Tag für Tag“ ist im modernen Deutschen natürlich und bewahrt die Wiederholung.
- source_word: παρέβησαν
  choice: sie sind nicht … abgewichen
  rationale: Im Bild eines vorgeschriebenen Weges steht die räumliche Bedeutung des Verbs im Vordergrund. Das Perfekt bringt die bis zur Gegenwart bestehende Beständigkeit zum Ausdruck, ohne den Aorist schematisch nachzubilden.
- source_word: ὁδοῦ
  choice: von dem Weg
  rationale: „Weg“ bewahrt das konkrete Bild der vorgeschriebenen Bewegung und vermeidet die Wiederholung von „Bahn“.
- source_word: ἐνετείλατο
  choice: den er ihnen geboten hat
  rationale: Das Verb bezeichnet ein autoritatives Gebieten. „geboten hat“ wahrt diesen Sinn und fügt sich würdig in die poetische Aussage ein.
theological_decisions:
- issue: Göttliche Ordnung und Gehorsam der Himmelslichter
  choice: Die Himmelslichter weichen nicht von dem ihnen gebotenen Weg ab.
  alternative: Die Himmelslichter übertreten sein Gebot nicht.
  rationale: Der unmittelbare Kontext spricht von Bahn und Weg, sodass die räumliche Bildsprache vorrangig ist. Die darin enthaltene Aussage göttlicher Autorität bleibt dennoch deutlich, ohne das Verb unnötig zu moralisieren.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht poetischem Satzbau. Die ungewöhnliche griechische Verbindung καιροὺς ὡρῶν wird nicht geglättet, sondern im Text transparent und in der Fußnote erläutert. Der Vers bleibt als syntaktisch anschließende Relativ-/Partizipialwendung mit „der“ eröffnet.
