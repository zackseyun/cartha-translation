translation:
  language: de
  text: der die Himmelslichter auf ihrer Bahn[a] für die festgesetzten Zeiten der Stunden[b] eingesetzt hat, Tag für Tag; und sie sind nicht von dem Weg abgewichen[c], den er ihnen vorgeschrieben hat.
