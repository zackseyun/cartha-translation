  verdict: revise
  source_fidelity: 'Der Entwurf gibt die wesentlichen Begriffe zutreffend wieder: ἐπακούει als zugewandtes Hören, δέησις als dringliches Flehen, der maskuline Singular πτωχοῦ, κρίματα und ἔλεος. „Voller Hoffnung“ legt im deutschen Satz jedoch vor allem den Armen als hoffend fest, obwohl ἐν ἐλπίδι syntaktisch knapp bleibt und auch das Flehen näher bestimmen kann. Zudem kann „Gerichte ergehen über die ganze Erde“ im Deutschen stärker nach gegen die Erde vollzogenem Gericht klingen als die offene griechische Bereichsangabe.'
  naturalness: „Deine Ohren hören auf das Flehen“ ist in würdigem modernem Deutsch möglich. „Deine Gerichte über die ganze Erde ergehen mit Erbarmen“ ist eine klarere und idiomatischere Satzfügung als „Gerichte ergehen über die ganze Erde mit Erbarmen“ und bewahrt den knappen Parallelismus.
  terminology: „Flehen“, „eines Armen“, „Gerichte“ und „Erbarmen“ passen zum religiös-literarischen Register. Die Fußnoten zu maskulinem Singular, der Präposition ἐπί und ἔλεος sind sachlich angemessen. Die Anmerkung zu ἐν ἐλπίδι soll die Ambiguität erläutern, ohne dass der Haupttext sie bereits einseitig auflöst.
  issues:
  - severity: medium
    issue: „voller Hoffnung“ verengt die syntaktische Zuordnung von ἐν ἐλπίδι.
    rationale: Die Stellung nach „eines Armen“ lässt im Deutschen hauptsächlich den Armen als „voller Hoffnung“ erscheinen. Das griechische Präpositionalgefüge kann, bei knapper und nicht ausdrücklich entschiedener Zuordnung, auch das Flehen charakterisieren. „in Hoffnung“ erhält diese Offenheit besser.
  - severity: low
    issue: Die Stellung von „über die ganze Erde“ bei „ergehen“ ist missverständlich.
    rationale: Die bestehende Fassung kann nahelegen, die Gerichte gingen gegen die ganze Erde vor. Eine engere Verbindung von „Gerichte über die ganze Erde“ gibt die umfassende Reichweite von ἐπὶ πᾶσαν τὴν γῆν ohne unnötige Zuspitzung wieder.
