translation:
  language: de
  text: Deine Ohren hören auf das Flehen eines Armen in Hoffnung[a][b]; deine Gerichte über die ganze Erde[c] ergehen mit Erbarmen[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „in Hoffnung“; die Wendung kann das Flehen oder den Armen als hoffend kennzeichnen.'
    reason: syntactic_ambiguity
  - marker: b
    text: 'Oder: „eines armen Menschen“; im Griechischen steht die maskuline Singularform.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „auf die ganze Erde“ beziehungsweise „auf der ganzen Erde“.'
    reason: lexical_alternative
