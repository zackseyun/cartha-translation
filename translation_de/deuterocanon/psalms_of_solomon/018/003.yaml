revisions:
- from: Deine Ohren hören auf das Flehen eines Armen voller Hoffnung[a][b]; deine Gerichte ergehen über die ganze Erde[c] mit Erbarmen[d].
  to: Deine Ohren hören auf das Flehen eines Armen in Hoffnung[a][b]; deine Gerichte über die ganze Erde[c] ergehen mit Erbarmen[d].
  rationale: Die Revision ersetzt „voller Hoffnung“ durch das quellennähere und syntaktisch offenere „in Hoffnung“. Der zweite Halbvers wird umgestellt, damit die räumlich-universale Angabe klar zu den Gerichten gehört und „mit Erbarmen“ weiterhin deren Charakter bezeichnet. Alle vorhandenen Fußnotenanker bleiben erhalten und stehen bei den jeweils erläuterten Ausdrücken.
