    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπακούει
  choice: hören auf
  rationale: Die Wendung bezeichnet hier nicht nur akustisches Hören, sondern aufmerksames, zugewandtes Hören. „Auf … hören“ bewahrt diesen responsiven Sinn und passt zum ausdrücklichen Subjekt „deine Ohren“.
- source_word: δέησιν
  choice: Flehen
  rationale: Das Substantiv bezeichnet eine dringliche Bitte. „Flehen“ gibt deren Nachdruck wieder und bleibt in einem würdigen Gebetston natürlich.
- source_word: πτωχοῦ
  choice: eines Armen
  rationale: Der griechische Ausdruck steht im maskulinen Singular. Die substantivierte Form „eines Armen“ bewahrt Numerus und grammatische Gestalt, ohne eine kollektive Bedeutung festzuschreiben.
- source_word: ἐν ἐλπίδι
  choice: voller Hoffnung
  rationale: Diese natürliche deutsche Wendung gibt den Zustand vertrauensvoller Erwartung wieder. Die syntaktische Zuordnung bleibt im Griechischen knapp und ist daher in einer Fußnote erläutert.
- source_word: κρίματά
  choice: Gerichte
  rationale: „Gerichte“ ist die direkte, im biblischen Register verständliche Wiedergabe für Gottes richterliche Entscheidungen beziehungsweise Taten.
- source_word: ἐπὶ πᾶσαν τὴν γῆν
  choice: über die ganze Erde
  rationale: Die Formulierung bewahrt sowohl die räumliche Reichweite als auch den möglichen Beiklang umfassender Herrschaft.
- source_word: μετὰ ἐλέους
  choice: mit Erbarmen
  rationale: 'Die nominale Wendung bleibt erhalten und wahrt die theologische Spannung: Gottes Gerichte gelten der ganzen Erde und geschehen zugleich mit Erbarmen.'
theological_decisions:
- issue: Verhältnis von Gericht und Erbarmen
  choice: „deine Gerichte ergehen … mit Erbarmen“
  alternative: „du richtest die ganze Erde erbarmungsvoll“
  rationale: Die gewählte Fassung lässt die beiden im Griechischen ausdrücklich nebeneinandergestellten Begriffe „Gerichte“ und „Erbarmen“ stehen, ohne ihre Spannung erklärend aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht biblischem Klang. Der Parallelismus der beiden Halbverse bleibt erhalten; „hören auf“ vermeidet die im Deutschen unnatürliche Verbindung „Ohren erhören“, während der responsive Sinn des Verbs gewahrt wird.
