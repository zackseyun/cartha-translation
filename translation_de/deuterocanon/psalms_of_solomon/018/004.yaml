  text: And your love is upon the offspring of Abraham, the sons of Israel. Your discipline is upon us as upon a firstborn, an only son,
translation:
  language: de
  text: Und deine Liebe ruht auf den Nachkommen Abrahams, den Söhnen Israels. Du erziehst uns[a] wie einen erstgeborenen, einzigen Sohn,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das überlieferte griechische Wort παιδία bezeichnet hier Erziehung und Unterweisung, die auch Zurechtweisung einschließen kann.
    reason: Die Bedeutungsbreite lässt sich mit einem einzelnen natürlichen deutschen Ausdruck nicht vollständig abbilden; die Anmerkung bewahrt den korrigierenden Unterton und nennt die im Ausgangstext überlieferte Wortform korrekt.
lexical_decisions:
- source_word: ἀγάπη σου
  choice: deine Liebe
  rationale: „Liebe“ ist die natürliche und inhaltlich volle Wiedergabe; sie bewahrt die Wärme der Bundesbeziehung.
- source_word: ἐπὶ σπέρμα Ἀβραάμ
  choice: ruht auf den Nachkommen Abrahams
  rationale: Das singularische σπέρμα wird kollektiv gebraucht. „Nachkommen“ ist im Deutschen natürlich und hält den Bezug auf Abraham klar; „ruht auf“ gibt ἐπί idiomatisch wieder.
- source_word: υἱοὺς Ἰσραήλ
  choice: den Söhnen Israels
  rationale: Die ausdrücklich männliche Bezeichnung wird beibehalten und lässt zugleich die sprachliche Verbindung zum anschließenden Bild des Sohnes erkennen.
- source_word: ἡ παιδία σου
  choice: du erziehst
  rationale: Gemeint ist formende, auch korrigierende Erziehung. Die verbale Fassung ist im modernen Deutschen natürlicher als Wendungen wie „deine Erziehung liegt auf uns“, ohne den Sinn auf bloße Bestrafung zu verengen.
- source_word: ὡς υἱὸν πρωτότοκον μονογενῆ
  choice: wie einen erstgeborenen, einzigen Sohn
  rationale: Beide Bezeichnungen, πρωτότοκον und μονογενῆ, bleiben nebeneinander stehen. So werden weder das Erstgeburtsmotiv noch die Einzigkeit und besondere Kostbarkeit des Sohnes eingeebnet.
theological_decisions:
- issue: Verhältnis von „erstgeboren“ und „einzig“
  choice: beide Prädikate unaufgelöst nebeneinander wiedergeben
  alternative: zu „einzigem erstgeborenen Sohn“ verschmelzen oder eines der Prädikate abschwächen
  rationale: Der griechische Text häuft beide Ausdrücke an. Die Übersetzung bewahrt diese Spannung, statt sie genealogisch oder dogmatisch zu harmonisieren.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die verbale Form „Du erziehst uns“ vermeidet eine schwerfällige Nominalkonstruktion. „Söhne Israels“ erhält bewusst das Sohnesmotiv; „erstgeborenen, einzigen Sohn“ bewahrt die auffällige Doppelbestimmung des Ausgangstextes.
