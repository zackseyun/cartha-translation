base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/018/006.yaml
  text: May God purify Israel for a day of mercy in blessing[e][d][c][b][a], for a day of choosing in the raising up of his Messiah.
translation:
  language: de
  text: Gott reinige Israel für einen Tag des Erbarmens unter Segen, für einen Tag der Erwählung bei der Erhebung seines Messias.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die griechische Form καθαρίσαι kann für sich genommen auch als Infinitiv („zu reinigen“) gelesen werden; zusammen mit „Gott“ als Subjekt und „Israel“ als Objekt liegt hier jedoch die Wunschform „Gott reinige Israel“ nahe.
    reason: grammatical_ambiguity
  - marker: b
    text: 'Oder: „bei der Erhöhung“ beziehungsweise „beim Hinaufführen seines Messias“. Der griechische Ausdruck bezeichnet eine Bewegung oder Erhebung nach oben, ohne den Vorgang näher festzulegen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθαρίσαι
  choice: reinige
  rationale: Die Form kann hier als Aorist-Optativ der 3. Person Singular verstanden werden und drückt einen Wunsch aus. Der deutsche Konjunktiv „reinige“ gibt diesen Gebets- beziehungsweise Wunschcharakter knapp und würdig wieder.
- source_word: Ἰσραήλ
  choice: Israel
  rationale: 'Das indeklinable Ἰσραήλ wird syntaktisch am natürlichsten als direktes Objekt zu καθαρίσαι verstanden: Gott soll Israel reinigen.'
- source_word: εἰς ἡμέραν ἐλέους
  choice: für einen Tag des Erbarmens
  rationale: εἰς bezeichnet hier eine Ausrichtung auf einen kommenden Tag; „Erbarmen“ bewahrt den religiösen Gehalt von ἔλεος und klingt im Deutschen natürlich.
- source_word: ἐν εὐλογίᾳ
  choice: unter Segen
  rationale: Die Wendung bezeichnet wahrscheinlich den begleitenden Umstand oder die Sphäre dieses Tages. „Unter Segen“ ist idiomatischer als das wörtliche „in Segen“, ohne die Beziehung genauer festzulegen.
- source_word: εἰς ἡμέραν ἐκλογῆς
  choice: für einen Tag der Erwählung
  rationale: „Erwählung“ gibt den religiösen und theologischen Sinn von ἐκλογή präzise wieder; anders als im Englischen ist das Wort im Deutschen nicht vorrangig politisch besetzt.
- source_word: ἐν ἀνάξει
  choice: bei der Erhebung
  rationale: „Erhebung“ bewahrt die Vorstellung des Hinaufführens beziehungsweise Erhöhens und lässt offen, ob ein Auftreten, eine Einsetzung oder eine Erhöhung gemeint ist.
- source_word: χριστοῦ αὐτοῦ
  choice: seines Messias
  rationale: Χριστός fungiert hier als Titel. „Messias“ wahrt den jüdisch-messianischen Zusammenhang besser als „Christus“.
theological_decisions:
- issue: Syntaktische Funktion von Ἰσραήλ
  choice: 'Ἰσραήλ als direktes Objekt: „Gott reinige Israel“'
  alternative: 'Ἰσραήλ als nähere Bestimmung zu θεός: „Der Gott Israels reinige uns“'
  rationale: Da καθαρίσαι als finiter Optativ gelesen werden kann und ein transitives Verb ist, ergibt Ἰσραήλ als Objekt eine vollständige, ungezwungene Syntax. Die Alternative müsste ein im griechischen Text nicht ausgedrücktes „uns“ ergänzen.
- issue: Bedeutungsumfang von ἀνάξει
  choice: „Erhebung“ mit offengehaltener Referenz
  alternative: „Erhöhung“, „Hinaufführung“ oder „Auftreten“ des Messias
  rationale: Der Ausdruck enthält die Vorstellung einer Aufwärtsbewegung, bestimmt aber nicht eindeutig, ob die Einsetzung, das Hervortreten oder die Erhöhung des Messias gemeint ist. Die Übersetzung soll diese Spannung nicht dogmatisch auflösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der knappe Gebetsstil des griechischen Satzes bleibt erhalten. „Erbarmen“, „Erwählung“ und „Messias“ sind verständliche biblische Begriffe; unnötige Ergänzungen und konfessionelle Festlegungen werden vermieden.
