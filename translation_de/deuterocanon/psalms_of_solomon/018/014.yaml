revisions:
- from: Und sie sind nicht in die Irre gegangen seit dem Tag, an dem er sie erschuf.[a] Seit uralten Generationen sind sie von ihren Wegen[b] nicht abgewichen, außer wenn Gott es ihnen durch den Befehl seiner Sklaven[c][d] gebot.
  to: Und sie sind seit dem Tag, an dem er sie erschuf, nicht in die Irre gegangen.[a] Seit den Generationen der Vorzeit sind sie nicht von ihren Wegen[b] abgewichen, es sei denn, Gott gebot ihnen durch den Befehl seiner Sklaven[c][d].
  rationale: Die Revision beseitigt ausschließlich die nicht im Griechischen ausgedrückte Ergänzung „es“ und glättet die Zeitangabe in idiomatisches modernes Deutsch. Die schwierige Schlusskonstruktion, der offene Referent von „sie“ sowie die terminologisch wichtige Wiedergabe von δούλων als „Sklaven“ bleiben erhalten. Alle Fußnotenanker und Fußnoten bleiben vollständig und korrekt zugeordnet.
