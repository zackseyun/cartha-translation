  yaml_path: translation/deuterocanon/psalms_of_solomon/018/014.yaml
  text: And they have not gone astray since the day he created them[a]. From ancient generations they have not departed from their ways[d][c][b], unless God commanded them by the command of his servants.
translation:
  language: de
  text: Und sie sind seit dem Tag, an dem er sie erschuf, nicht in die Irre gegangen.[a] Seit den Generationen der Vorzeit sind sie nicht von ihren Wegen[b] abgewichen, es sei denn, Gott gebot ihnen durch den Befehl seiner Sklaven[c][d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sind nicht umhergeirrt“.'
    reason: lexical_alternative
  - marker: b
    text: „Ihre Wege“ kann auch ihre festgelegten Bahnen oder Ordnungen meinen.
    reason: lexical_alternative
  - marker: c
    text: 'Oder weniger wörtlich: „Diener“. Griechisch: „Sklaven“.'
    reason: lexical_alternative
  - marker: d
    text: Die knappe griechische Wendung kann auch mit „durch eine Anordnung mittels seiner Sklaven“ wiedergegeben werden.
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: ἐπλανήθησαν
  choice: sind nicht in die Irre gegangen
  rationale: Die mediale/passive Form bezeichnet hier das Abweichen vom rechten oder festgelegten Lauf. Die Wendung ist im Deutschen natürlich und lässt offen, ob ein moralischer Irrweg oder ein Verlassen der Bahn gemeint ist.
- source_word: ἔκτισεν
  choice: erschuf
  rationale: κτίζω bedeutet gewöhnlich „erschaffen“; die Formulierung passt zum Zusammenhang der geordneten Schöpfung.
- source_word: γενεῶν ἀρχαίων
  choice: seit uralten Generationen
  rationale: Die Präposition ἀπό mit der Zeitangabe bezeichnet den Ausgangspunkt in ferner Vergangenheit. „Seit“ gibt die bis zur Gegenwart reichende Dauer idiomatisch wieder.
- source_word: ἀπέστησαν
  choice: sind nicht abgewichen
  rationale: ἀφίστημι bezeichnet das Sich-Entfernen oder Abweichen von einem bestehenden Weg beziehungsweise einer festgelegten Ordnung.
- source_word: ὁδῶν αὐτῶν
  choice: von ihren Wegen
  rationale: ὁδός kann Wege im wörtlichen oder übertragenen Sinn sowie festgelegte Bahnen bezeichnen. „Wege“ bewahrt diese Bedeutungsbreite.
- source_word: ἐνετείλατο
  choice: gebot
  rationale: Das Verb bezeichnet ein autoritatives Befehlen. „Gebot“ erhält den würdigen Ton und die formale Nähe zum griechischen Ausdruck.
- source_word: ἐν ἐπιταγῇ
  choice: durch den Befehl
  rationale: ἐν kann hier Mittel oder Art und Weise ausdrücken; ἐπιταγή bezeichnet einen verbindlichen Befehl oder eine Anordnung.
- source_word: δούλων
  choice: Sklaven
  rationale: δοῦλος bezeichnet Menschen in einem Verhältnis vollständiger Unterordnung. „Sklaven“ bewahrt diese stärkere Aussage, die „Diener“ abschwächen würde.
theological_decisions:
- issue: Bezug des unausgesprochenen Subjekts „sie“
  choice: Das Subjekt bleibt als „sie“ unbestimmt.
  alternative: Es ausdrücklich als Himmelskörper, Schöpfungselemente oder geschaffene Wesen bestimmen.
  rationale: Der griechische Vers setzt den Bezug aus dem Kontext voraus, nennt ihn hier jedoch nicht. Eine Ergänzung würde die Aussage enger festlegen als der Ausgangstext.
- issue: Verhältnis von Gottes Gebot zum „Befehl seiner Sklaven“
  choice: Die formale Genitivkonstruktion wird als „durch den Befehl seiner Sklaven“ bewahrt.
  alternative: „durch seine Sklaven“ oder „durch eine Anordnung an seine Sklaven“
  rationale: Der griechische Genitiv δούλων αὐτοῦ ist grammatisch knapp und kann ohne Kontext missverständlich wirken. Die Übersetzung löst weder die Zugehörigkeit des Befehls noch seine Vermittlung stillschweigend auf.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nah am griechischen Parallelismus; zugleich werden die Zeitangaben idiomatisch mit „seit“ wiedergegeben. Der ungewöhnliche Schluss wird nicht geglättet, damit seine grammatische und theologische Spannung erhalten bleibt.
