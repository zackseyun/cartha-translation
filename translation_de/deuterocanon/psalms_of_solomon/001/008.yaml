  text: Their lawless deeds surpassed those of the nations before them[b][a]; they profaned the holy things of the Lord with profanation.
translation:
  language: de
  text: Ihre gesetzlosen Taten übertrafen die der Völker vor ihnen; sie entweihten das Heiligtum des Herrn in entweihender Weise.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die heiligen Dinge des Herrn“ beziehungsweise „die heiligen Stätten des Herrn“. Der griechische Ausdruck steht im Plural; im jüdisch-griechischen Kultwortschatz kann er jedoch kollektiv das Heiligtum oder seinen heiligen Bereich bezeichnen. Die Wendung „in entweihender Weise“ gibt die im Griechischen auffällige Stammwiederholung wieder.'
    reason: lexical_alternative
lexical_decisions:
- source_word: αἱ ἀνομίαι αὐτῶν
  choice: ihre Gesetzlosigkeiten
  rationale: Der Plural bezeichnet ihre Verstöße gegen das Gesetz beziehungsweise ihre gesetzlosen Taten. „Gesetzlosigkeiten“ bewahrt die Form und den Rechtsbezug des griechischen Ausdrucks.
- source_word: ὑπὲρ τὰ πρὸ αὐτῶν ἔθνη
  choice: übertrafen die der Völker vor ihnen
  rationale: ὑπέρ mit Akkusativ drückt hier einen Vergleich aus. Die Ellipse „die“ bezieht sich natürlich auf die Gesetzlosigkeiten und vermeidet die sachlich falsche Aussage, dass die Taten die Völker selbst übertrafen.
- source_word: ἐβεβήλωσαν
  choice: sie entweihten
  rationale: βεβηλόω bedeutet, Heiliges profan zu machen beziehungsweise als gewöhnlich zu behandeln. „Entweihen“ gibt diesen kultischen Gegensatz präziser wieder als das allgemeinere „verunreinigen“.
- source_word: τὰ ἅγια Κυρίου
  choice: die Heiligtümer des Herrn
  rationale: Der substantivierte neutrale Plural kann heilige Dinge, heilige Orte oder den Heiligtumsbereich bezeichnen. „Heiligtümer“ bewahrt den Plural und die kultisch-räumliche Offenheit besser als der Singular „das Heiligtum“.
- source_word: ἐν βεβηλώσει
  choice: durch Entweihung
  rationale: Die Präpositionalphrase mit dem stammverwandten Substantiv verstärkt oder bestimmt die Art des Entweihens. Die bewusste Wiederholung „entweihten … durch Entweihung“ erhält diese auffällige figura etymologica.
theological_decisions:
- issue: Bezeichnet τὰ ἅγια Κυρίου ein einzelnes Heiligtum oder allgemeiner das dem Herrn Geheiligte?
  choice: die Heiligtümer des Herrn
  alternative: das Heiligtum des Herrn; die heiligen Dinge des Herrn; die heiligen Stätten des Herrn
  rationale: Der griechische Plural kann in jüdisch-griechischem Sprachgebrauch kollektiv den Tempel beziehungsweise seine heiligen Bereiche meinen, ist lexikalisch jedoch nicht eindeutig auf einen singulären Bau beschränkt. Der Plural „Heiligtümer“ hält den kultisch-räumlichen Bezug fest, ohne die Mehrdeutigkeit vollständig aufzulösen; die Alternativen werden in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnliche Stammwiederholung „entweihten … durch Entweihung“ ist bewusst beibehalten, weil auch der griechische Text Verb und stammverwandtes Substantiv verbindet. Der Fußnotenmarker steht unmittelbar nach dem davon betroffenen Satzteil.
