  source_fidelity: Die Vergleichsaussage ist zutreffend wiedergegeben. »Gesetzlosigkeiten« ist zwar formal nah an ἀνομίαι, im heutigen Deutsch jedoch kein idiomatischer Ausdruck. Für τὰ ἅγια Κυρίου ist »Heiligtümer« problematisch, weil es mehrere eigenständige Kultstätten nahelegt. Im hier kultisch bestimmten Zusammenhang ist der Plural sehr wahrscheinlich eine kollektive Bezeichnung für das Heiligtum bzw. den heiligen Bereich. »das Heiligtum des Herrn« gibt den beabsichtigten Bezug daher besser wieder; die Fußnote wahrt die lexikalische Pluralform und die mögliche weitere Bedeutung.
  naturalness: »Ihre Gesetzlosigkeiten« und besonders »die Heiligtümer des Herrn« wirken im modernen Standarddeutsch hölzern beziehungsweise missverständlich. »Ihre gesetzlosen Taten« und »das Heiligtum des Herrn« sind klar und würdig. Die figura etymologica von ἐβεβήλωσαν … ἐν βεβηλώσει sollte nicht mit der schwerfälligen Formel »entweihten … durch Entweihung« mechanisch reproduziert werden; »in entweihender Weise« bewahrt die Verstärkung, bleibt aber noch verständlich.
  terminology: »entweihen« trifft βεβηλόω als kultischen Begriff gut. »Heiligtum des Herrn« ist im gegebenen historischen und literarischen Kontext der treffendste deutsche Haupttext; »heilige Dinge/Stätten« gehören als offene Alternativen in die Anmerkung.
