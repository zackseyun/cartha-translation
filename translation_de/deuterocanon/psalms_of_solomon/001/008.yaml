    rationale: τὰ ἅγια kann im jüdisch-griechischen Kultwortschatz kollektiv den Tempel bzw. das Heiligtum bezeichnen. Der deutsche Plural bezeichnet gewöhnlich mehrere Heiligtümer und verschiebt daher den Sinn.
