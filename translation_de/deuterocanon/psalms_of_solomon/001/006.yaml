lexical_decisions:
- source_word: ἐξύβρισαν
  choice: sie verhielten sich überheblich
  rationale: Das Verb bezeichnet anmaßendes, überhebliches oder frevelhaftes Verhalten. Die gewählte Formulierung gibt die moralische Schärfe in natürlichem, gegenwärtigem Deutsch wieder.
- source_word: ἐν τοῖς ἀγαθοῖς αὐτῶν
  choice: in ihrem Wohlergehen
  rationale: Der substantivierte Plural ἀγαθά kann Güter, Vorteile oder gute Lebensumstände bezeichnen. Im Kontext erfasst „Wohlergehen“ den wahrscheinlichen Sinn, ohne ihn ausschließlich auf materiellen Besitz festzulegen.
- source_word: οὐκ ἤνεγκαν
  choice: sie hielten nicht stand
  rationale: ἤνεγκαν von φέρω kann hier idiomatisch „ertragen“, „aushalten“ oder „standhalten“ bedeuten. Da im Griechischen kein Objekt genannt wird, bewahrt die objektlose Wiedergabe die Kürze und Offenheit des Satzes.
theological_decisions: []
translation_notes:
