translation:
  language: de
  text: Und sie verhielten sich überheblich in ihrem Wohlergehen[a] und hielten nicht stand.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „unter ihren Gütern“; wörtlich: „inmitten ihrer guten Dinge“.'
