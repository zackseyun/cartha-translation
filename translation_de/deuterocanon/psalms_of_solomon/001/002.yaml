  text: Suddenly[a], a cry of war was silenced before me; he will hear me[c][b], because I am filled with righteousness.
translation:
  language: de
  text: Plötzlich war vor mir Kriegsgeschrei zu hören; er wird mich erhören, denn ich bin von Gerechtigkeit erfüllt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξάπινα
  choice: Plötzlich
  rationale: Das Adverb bezeichnet einen unvermittelten Eintritt und wird im modernen Deutschen natürlich mit »plötzlich« wiedergegeben.
- source_word: κωφωθὴ
  choice: verstummte
  rationale: Die Form gehört zu κωφόω und bezeichnet hier ein Verstummen beziehungsweise Zum-Schweigen-Kommen. Die flüssige deutsche Hauptfassung gibt den Vorgang erzählend wieder; die formal mögliche imperativische Lesart bleibt in einer Fußnote erhalten.
- source_word: κραυγὴ πολέμου
  choice: Kriegsgeschrei
  rationale: Das deutsche Kompositum gibt die Genitivverbindung knapp und idiomatisch wieder, ohne sie enger auf einen bestimmten militärischen Ruf festzulegen.
- source_word: ἐνώπιόν μου
  choice: vor mir
  rationale: Die gewöhnliche räumliche beziehungsweise persönliche Wendung wird direkt und natürlich wiedergegeben.
- source_word: ἐπακούσεταί μου
  choice: er wird mich erhören
  rationale: ἐπακούω meint in einem Gebetszusammenhang nicht nur akustisches Hören, sondern geneigtes Hören. »Erhören« bewahrt diese Nuance, ohne ausdrücklich eine Antwort oder Hilfe hinzuzufügen.
- source_word: ἐπλήσθην
  choice: ich bin … erfüllt
  rationale: Der griechische Aorist kann hier mit seinem fortbestehenden Ergebnis wiedergegeben werden; die deutsche Zustandsform passt zum begründenden Satz.
- source_word: δικαιοσύνης
  choice: Gerechtigkeit
  rationale: »Gerechtigkeit« deckt im Deutschen sowohl die moralisch-religiöse Rechtschaffenheit als auch den Aspekt gerechten Handelns ab und bewahrt damit die Bedeutungsbreite von δικαιοσύνη.
theological_decisions:
- issue: Unausgesprochenes Subjekt von ἐπακούσεταί μου
  choice: Das Pronomen »er« bleibt ohne ausdrückliche Benennung; im Gebetszusammenhang ist Gott als Bezug naheliegend.
  alternative: »Gott wird mich erhören« oder unpersönlich »ich werde erhört werden«
  rationale: Der griechische Text nennt das Subjekt nicht. Die Übersetzung wahrt diese formale Zurückhaltung und erläutert lediglich die kontextuelle Bezugsmöglichkeit in der Fußnote.
- issue: Aussage, von Gerechtigkeit erfüllt zu sein
  choice: Die uneingeschränkte Selbstaussage des Sprechers bleibt stehen.
  alternative: Eine abschwächende oder erklärende Wiedergabe, etwa als Streben nach Gerechtigkeit
  rationale: Der Text verbindet die erwartete Erhörung ausdrücklich mit dem Erfülltsein von δικαιοσύνη. Diese theologische Spannung darf nicht durch eine interpretierende Abschwächung aufgelöst werden.
translation_notes:
  register: Moderne, würdige und gut verständliche poetische Sprache. »Kriegsgeschrei« ist kräftig, aber nicht altertümlich; »erhören« wahrt den Gebetston. Die Satzfolge und die theologische Begründung des griechischen Textes bleiben erhalten.
