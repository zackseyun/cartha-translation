  terminology: „Kriegsgeschrei“ ist für κραυγὴ πολέμου treffend. „Gerechtigkeit“ ist als Wiedergabe von δικαιοσύνη möglich und bewahrt die im Deutschen relevante Spannweite; „von Gerechtigkeit erfüllt“ ist würdig und klar.
