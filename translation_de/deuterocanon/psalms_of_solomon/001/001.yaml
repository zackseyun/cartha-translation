translation:
  language: de
  text: Ich schrie zum Herrn, als ich bis ans Ende bedrängt wurde[a], zu Gott, als Sünder über mich herfielen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder möglicherweise: „als ich völlig bedrängt wurde“ beziehungsweise „als ich unablässig bedrängt wurde“. Das griechische εἰς τέλος bedeutet wörtlich „bis ans Ende“ und kann hier als Verstärkung dienen.'
    reason: lexical_alternative
  - marker: b
    text: Der griechische Ausdruck ist schwierig. Möglich sind auch Nuancen wie „als Sünder auf mich zukamen“ oder eine andere feindliche Handlung. „Mich“ ist dem Zusammenhang entsprechend ergänzt.
    reason: alternative_reading
lexical_decisions:
- source_word: ἘΒΟΗΣΑ
  choice: Ich schrie
  rationale: Der Aorist von βοάω bezeichnet einen dringlichen, lauten Hilferuf; „schrie“ bewahrt diese Stärke im Gebetskontext.
- source_word: πρὸς Κύριον
  choice: zum Herrn
  rationale: πρός mit Akkusativ bezeichnet die Richtung des Rufens; κύριος wird im Gebetskontext sachgerecht mit „Herr“ wiedergegeben.
- source_word: ἐν τῷ θλίβεσθαί με
  choice: als ich … bedrängt wurde
  rationale: Die Konstruktion ἐν mit substantiviertem Infinitiv ist hier temporal beziehungsweise umstandsbezeichnend. Das Passiv von θλίβω bleibt erhalten.
- source_word: εἰς τέλος
  choice: bis ans Ende
  rationale: Die bewusst wörtliche Wiedergabe erhält die mögliche zeitliche oder verstärkende Bedeutung, ohne sie im Haupttext auf „völlig“ oder „unablässig“ festzulegen.
- source_word: πρὸς τὸν θεὸν
  choice: zu Gott
  rationale: Die zweite Anrede steht parallel zu „zum Herrn“; ihre Wiederholung bewahrt die poetische Struktur des Griechischen.
- source_word: ἐν τῷ ἐπιδέσθαι ἁμαρτωλοὺς
  choice: als Sünder über mich herfielen
  rationale: Die griechische Verbform ist schwierig. Im Klagekontext liegt eine feindliche Handlung nahe; „über mich herfielen“ gibt diesen wahrscheinlichen Sinn idiomatisch wieder. Das im Deutschen nötige Objekt „mich“ ist aus dem Kontext ergänzt und wird in der Fußnote kenntlich gemacht.
- source_word: ἁμαρτωλούς
  choice: Sünder
  rationale: Die direkte Personenbezeichnung wahrt den Wortlaut besser als die deutendere Wiedergabe „Frevler“ oder „Gottlose“.
theological_decisions:
- issue: Wiedergabe von κύριος in der Anrede an Gott
  choice: Herr
  alternative: Gebieter
  rationale: „Herr“ ist die natürliche und traditionsübergreifende Wiedergabe im Gebetskontext, ohne einen zusätzlichen herrschaftlichen Nebensinn einzutragen.
- issue: Doppelte Gottesbezeichnung
  choice: „zum Herrn … zu Gott“ beibehalten
  alternative: zu einer einzigen Anrede zusammenziehen
  rationale: Die parallelen Präpositionalgruppen stehen ausdrücklich im Griechischen; ihre Beibehaltung wahrt Aufbau und Nachdruck des Verses.
- issue: Deutung von εἰς τέλος
  choice: mehrdeutig als „bis ans Ende“ wiedergeben
  alternative: eindeutig intensiv als „bis zum Äußersten“ oder durativ als „unablässig“ wiedergeben
  rationale: Der Ausdruck kann wörtlich, zeitlich oder verstärkend verstanden werden. Der Haupttext legt sich nicht unnötig auf nur eine dieser Möglichkeiten fest.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der dringliche Ton des Klagegebets und die parallele doppelte Gottesbezeichnung bleiben erhalten. Ungewohnte Formulierungen werden dort beibehalten, wo sie eine echte Mehrdeutigkeit des griechischen Textes sichtbar machen.
