base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/001/003.yaml
  text: I thought in my heart that I was filled with righteousness when I prospered and became great in children[a][b][c].
translation:
  language: de
  text: Ich dachte in meinem Herzen, ich sei von Gerechtigkeit erfüllt, als es mir gut ging und ich reich an Kindern wurde.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Gerechtigkeit“ kann hier auch im Sinn von „Rechtschaffenheit“ verstanden werden.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „und groß/reich an Kindern wurde“, das heißt: viele Kinder beziehungsweise zahlreiche Nachkommen hatte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλογισάμην
  choice: ich dachte
  rationale: Der Aorist von λογίζομαι bezeichnet hier eine innere Überlegung oder Einschätzung. „Ich dachte“ ist natürlich und wahrt den Charakter einer persönlichen Selbstbeurteilung.
- source_word: ἐν καρδίᾳ μου
  choice: in meinem Herzen
  rationale: Die Formulierung bewahrt die biblische Rede vom Herzen als Ort des inneren Denkens und Urteilens, ohne sie auf bloße verstandesmäßige Reflexion zu verengen.
- source_word: ἐπλήσθην
  choice: ich sei … erfüllt
  rationale: Das Passiv wird mit „erfüllt“ wiedergegeben. Der Konjunktiv I kennzeichnet im Deutschen den Inhalt des damaligen Gedankens, ohne dessen Behauptung als Erzählerurteil zu bestätigen.
- source_word: δικαιοσύνης
  choice: von Gerechtigkeit
  rationale: „Gerechtigkeit“ ist die übliche und semantisch breite Entsprechung für δικαιοσύνη. Im Zusammenhang bezeichnet das Wort besonders die vermeintliche moralische Rechtschaffenheit des Sprechers.
- source_word: ἐν τῷ εὐθηνῆσαί με
  choice: als es mir gut ging
  rationale: Die Konstruktion ἐν τῷ mit Infinitiv hat hier zeitlich-umständliche Bedeutung. Die natürliche deutsche Wendung erfasst Wohlergehen und Gedeihen, ohne zwingend nur materiellen Reichtum zu meinen.
- source_word: πολλὴν γενέσθαι ἐν τέκνοις
  choice: und ich reich an Kindern wurde
  rationale: Die komprimierte griechische Wendung beschreibt Größe oder Fülle im Blick auf Kinder. „Reich an Kindern“ ist im Deutschen verständlich, bewahrt das Bild der Fülle und vermeidet die unnatürliche Formulierung „groß in Kindern“.
theological_decisions:
- issue: Bedeutung von δικαιοσύνη in der Selbsteinschätzung des Sprechers
  choice: Gerechtigkeit
  alternative: Rechtschaffenheit
  rationale: „Gerechtigkeit“ hält die volle theologische und ethische Spannweite des griechischen Begriffs offen. Der Kontext legt eine behauptete persönliche Rechtschaffenheit nahe, doch diese Deutung wird nicht stillschweigend zum einzigen Wortsinn gemacht.
- issue: Verhältnis zwischen vermeintlicher Gerechtigkeit und Wohlergehen
  choice: 'zeitlich-umständlich: „als“'
  alternative: 'begründend: „weil“'
  rationale: ἐν τῷ mit Infinitiv bezeichnet gewöhnlich den zeitlichen oder begleitenden Umstand. Die Übersetzung behauptet daher nicht ausdrücklich, Wohlstand und Kinderreichtum seien der logische Beweis oder Grund der Gerechtigkeit, auch wenn diese gedankliche Verbindung im Kontext mitschwingt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „In meinem Herzen“ bewahrt den biblischen Sprachklang; „als es mir gut ging“ und „reich an Kindern“ bleiben zugleich für heutige Leser verständlich. Der Konjunktiv macht kenntlich, dass es sich um die Selbsteinschätzung des Sprechers handelt.
