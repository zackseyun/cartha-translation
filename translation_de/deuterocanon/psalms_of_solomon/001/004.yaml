  yaml_path: translation/deuterocanon/psalms_of_solomon/001/004.yaml
  text: Their wealth was spread throughout all the land[c][b][a], and their glory reached to the end of the earth.
translation:
  language: de
  text: Ihr Reichtum breitete sich über das ganze Land aus,[a] und ihr Ruhm[b] reichte bis ans Ende der Erde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „über die ganze Erde“. Das griechische Wort γῆ kann sowohl „Land“ als auch „Erde“ bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Herrlichkeit“ oder „Ansehen“. Das griechische Wort δόξα kann Ruhm, Ehre, Ansehen oder Herrlichkeit bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ πλοῦτος αὐτῶν
  choice: ihr Reichtum
  rationale: πλοῦτος bezeichnet Reichtum oder Besitzfülle. „Reichtum“ ist im modernen Standarddeutsch natürlich und wahrt den kollektiven Singular des Griechischen.
- source_word: διεδόθη
  choice: breitete sich … aus
  rationale: Der Aorist Passiv von διαδίδωμι bezeichnet hier die weite Ausbreitung. Die reflexiv-intransitive deutsche Form gibt den Vorgang natürlich wieder, ohne einen nicht genannten Handelnden einzuführen.
- source_word: εἰς πᾶσαν τὴν γῆν
  choice: über das ganze Land
  rationale: γῆ kann „Land“ oder „Erde“ bedeuten. „Land“ lässt im ersten Halbvers eine mögliche räumliche Steigerung zum „Ende der Erde“ im zweiten Halbvers erkennen.
- source_word: ἡ δόξα αὐτῶν
  choice: ihr Ruhm
  rationale: δόξα kann Herrlichkeit, Ehre oder öffentliches Ansehen bezeichnen. In Verbindung mit einer Ausdehnung bis ans Ende der Erde ist „Ruhm“ im Deutschen besonders natürlich; die weitere Bedeutungsbreite wird in einer Fußnote offengehalten.
- source_word: ἕως ἐσχάτου τῆς γῆς
  choice: bis ans Ende der Erde
  rationale: Die Wendung bezeichnet die äußerste räumliche Reichweite. „Bis ans Ende der Erde“ ist klar, würdig und nahe an der griechischen Formulierung.
theological_decisions:
- issue: Bedeutungsumfang von γῆ in den beiden Halbversen
  choice: Im ersten Halbvers „Land“, im zweiten „Erde“
  alternative: Beide Vorkommen einheitlich mit „Erde“ oder „Land“ wiedergeben
  rationale: Das Substantiv ist im Griechischen identisch, kann jedoch je nach Wendung „Land“ oder „Erde“ bedeuten. Die unterschiedliche Wiedergabe bewahrt eine mögliche poetische Steigerung, ohne die Alternative zu verschweigen.
- issue: Fehlendes ausdrückliches Verb im zweiten Halbvers
  choice: Das sinngemäß vorausgesetzte Verb mit „reichte“ ergänzen
  alternative: 'Die griechische Ellipse nachbilden: „und ihr Ruhm bis ans Ende der Erde“'
  rationale: Im Griechischen übernimmt der zweite Halbvers gedanklich die verbale Aussage des ersten. Im modernen deutschen Fließtext wäre eine unvermittelte nominale Ellipse auffällig und potenziell missverständlich; „reichte“ macht die Beziehung natürlich verständlich, ohne eine zusätzliche sachliche Aussage einzuführen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit poetischem Parallelismus. Die Formulierung bleibt nah am griechischen Bild, ergänzt jedoch im zweiten Halbvers ein im Griechischen ausgespartes, im Deutschen für einen vollständigen und natürlichen Satz hilfreiches Verb.
