  text: They were exalted to the stars[a]; they said[d][c][b], “We will certainly not fall.”
translation:
  language: de
  text: Sie wurden bis zu den Sternen erhöht; sie sagten, sie würden gewiss nicht fallen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch als direkte Rede möglich: „Sie werden gewiss nicht fallen.“ Das griechische Verb steht in der dritten Person Mehrzahl, nicht in der ersten („wir“); die starke Verneinung kann auch mit „keinesfalls“ oder „niemals“ wiedergegeben werden.'
    reason: grammar_and_lexical_alternative
lexical_decisions:
- source_word: ὑψώθησαν
  choice: wurden erhöht
  rationale: Der Aorist Passiv von ὑψόω bezeichnet hier Erhöhung oder Erhebung. „Wurden erhöht“ bewahrt sowohl die Passivform als auch das Zusammenspiel von räumlichem Bild und übertragener Selbsterhöhung.
- source_word: ἕως τῶν ἄστρων
  choice: bis zu den Sternen
  rationale: ἕως mit Genitiv bezeichnet die erreichte Ausdehnung. Die direkte deutsche Wendung bewahrt das dichterische, hyperbolische Höhenbild.
- source_word: εἶπαν
  choice: sie sagten
  rationale: Die schlichte Wiedergabe entspricht dem unmarkierten griechischen Redeverb und fügt keine Deutung wie „behaupteten“ oder „prahlten“ hinzu.
- source_word: Οὐ μὴ πέσωσιν
  choice: sie würden gewiss nicht fallen
  rationale: οὐ μή mit dem Aorist Konjunktiv drückt eine nachdrückliche Verneinung aus. πέσωσιν steht in der dritten Person Plural; deshalb gibt die indirekte Rede „sie würden … nicht fallen“ die überlieferte Personform genauer wieder als eine direkte Rede in der ersten Person.
theological_decisions:
- issue: Ob die Aussage als hochmütige Selbstsicherheit oder als neutrale Stabilitätsaussage wiederzugeben ist
  choice: Die nachdrückliche Gewissheit wird mit „gewiss nicht fallen“ hörbar gemacht, ohne im Text ausdrücklich „sie prahlten“ hinzuzufügen.
  alternative: „sie würden nicht fallen“ oder ausdrücklich wertend „sie prahlten, sie würden niemals fallen“
  rationale: Die starke Verneinung und das Bild der Erhöhung legen vermessene Sicherheit nahe. Die Übersetzung bewahrt diesen Ton, ohne eine im Satz nicht ausdrücklich formulierte Verurteilung einzutragen.
- issue: Person und Form der wiedergegebenen Rede
  choice: Indirekte Rede in der dritten Person Plural
  alternative: 'Direkte Rede: „Sie werden gewiss nicht fallen.“; sinngemäße Selbstrede: „Wir werden gewiss nicht fallen.“'
  rationale: Die griechische Verbform πέσωσιν ist eindeutig dritte Person Plural. Eine erste Person wäre πέσωμεν. Indirekte Rede ermöglicht im Deutschen, dieselbe Personengruppe als Sprecher und als Subjekt des Fallens zu verstehen, ohne die griechische Personform stillschweigend zu ändern.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper poetischer Satzführung. „Bis zu den Sternen“ erhält das Psalmwortbild; „gewiss nicht“ bringt die emphatische Verneinung natürlich zum Ausdruck. Die indirekte Rede vermeidet eine grammatisch nicht belegte erste Person.
