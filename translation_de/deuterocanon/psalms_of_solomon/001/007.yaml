translation:
  language: de
  text: Ihre Sünden waren im Verborgenen[a], und ich wusste nichts davon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ihre Sünden wurden heimlich begangen“; wörtlicher auch: „Ihre Sünden waren in verborgenen Dingen“ oder „an verborgenen Orten“. Die griechische Wendung ist knapp und lässt offen, ob vor allem die heimliche Begehung, verborgene Umstände oder Orte gemeint sind.'
    reason: lexical_alternative
lexical_decisions:
- source_word: αἱ ἁμαρτίαι αὐτῶν
  choice: ihre Sünden
  rationale: Die Nominalphrase bezeichnet ihre konkreten Sünden bzw. Verfehlungen. „Ihre Sünden“ entspricht der griechischen Form unmittelbar und klingt im Deutschen natürlich.
- source_word: ἐν ἀποκρύφοις
  choice: im Verborgenen
  rationale: Der substantivisch gebrauchte Plural ist knapp und elliptisch. „Im Verborgenen“ gibt die Heimlichkeit wieder, ohne die Aussage unnötig auf verborgene räumliche Orte einzuengen.
- source_word: καὶ ἐγώ
  choice: und ich
  rationale: καί wird mit seinem gewöhnlichen verbindenden Sinn wiedergegeben; ein stärker kontrastierendes „aber ich“ ist nicht erforderlich.
- source_word: οὐκ ᾔδειν
  choice: wusste nichts davon
  rationale: Die Form bezeichnet fehlendes Wissen oder Bewusstsein. Das idiomatische „wusste nichts davon“ macht im Deutschen den Bezug auf die zuvor genannten Sünden deutlich, ohne den Grund ihrer Verborgenheit näher festzulegen.
theological_decisions:
- issue: Art der Verborgenheit in ἐν ἀποκρύφοις
  choice: Die Sünden waren im Verborgenen, ohne näher zu bestimmen, vor wem oder auf welche Weise sie verborgen waren.
  alternative: Ihre Sünden wurden heimlich begangen; ihre Sünden waren an verborgenen Orten; ihre Sünden betrafen verborgene Dinge.
  rationale: Die griechische Wendung ist elliptisch und lässt mehrere Nuancen zu. Die Übersetzung bewahrt diese Offenheit und legt weder fest, dass die Sünden vor Gott verborgen waren, noch dass ausschließlich geheime Orte gemeint sind.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. „Im Verborgenen“ bewahrt die knappe Ausdrucksweise und vermeidet eine unnötige räumliche Festlegung.
