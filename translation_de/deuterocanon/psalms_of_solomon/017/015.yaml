  source_fidelity: Der Entwurf gibt die beiden parallelen Formen des Wortfelds ἀλλοτριότης/ἀλλότριος mit „Fremder/fremd“ nachvollziehbar wieder. „Als Fremder“ ist eine idiomatische deutsche Auslegung der präpositionalen Wendung ἐν ἀλλοτριότητι und wahrt deren mögliche Aussage über den Feind als Außenstehenden. „In Hochmut“ entspricht ἐν ὑπερηφανίᾳ, und „sein Herz war unserem Gott fremd“ bildet die prädikative Aussage ἀλλοτρία ἀπὸ τοῦ θεοῦ ἡμῶν ohne Zusatz einer früheren Gottesbeziehung ab.
  naturalness: Modernes, würdiges und gut verständliches Deutsch. Die knappe, leicht vorangestellte Satzstellung ist im poetisch-biblischen Register natürlich. Die Wiederholung von „fremd“ ist stilistisch sinnvoll, weil sie das griechische Wortspiel erkennen lässt.
  terminology: „Feind“, „Hochmut“ und „Herz“ sind treffende und registergerechte Wiedergaben. Die Fußnoten kennzeichnen die relationale Alternative „Entfremdung“ ausdrücklich als Möglichkeit und machen sie nicht zur Hauptaussage.
