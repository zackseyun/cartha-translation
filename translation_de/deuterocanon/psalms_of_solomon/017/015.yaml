  text: The enemy acted in estrangement[a], in pride[c][b]; and his heart was estranged from our God.
translation:
  language: de
  text: Als Fremder[a] handelte der Feind in Hochmut; und sein Herz war unserem Gott fremd.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: „in Fremdheit“; möglich ist ferner: „in Entfremdung“.'
