  - marker: b
    text: 'Oder: „war von unserem Gott entfremdet“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἀλλοτριότητι
  choice: als Fremder
  rationale: Die Wendung bezeichnet Anders- oder Fremdsein und kann im Zusammenhang auf den Feind als Außenstehenden beziehungsweise fremden Eindringling weisen. „Als Fremder“ ist natürliches Deutsch und vermeidet die unbelegte Annahme, er sei zuvor mit Gott verbunden gewesen.
- source_word: ὁ ἐχθρός
  choice: der Feind
  rationale: Schlichte und im biblischen Sprachgebrauch geläufige Wiedergabe.
- source_word: ἐποίησεν
  choice: handelte
  rationale: Das Verb steht ohne ausdrückliches Objekt; „handelte“ gibt diesen absoluten Gebrauch im Deutschen klar wieder.
- source_word: ἐν ὑπερηφανίᾳ
  choice: in Hochmut
  rationale: „Hochmut“ bewahrt die negative Bedeutung selbstüberheblicher Haltung und entspricht dem würdigen poetischen Register.
- source_word: ἡ καρδία αὐτοῦ
  choice: sein Herz
  rationale: Bewahrt das biblische Bild für das innere Denken, Wollen und Trachten.
- source_word: ἀλλοτρία ἀπὸ τοῦ θεοῦ ἡμῶν
  choice: war unserem Gott fremd
  rationale: Die prädikative Adjektivkonstruktion wird idiomatisch wiedergegeben und bewahrt zugleich die Wortverbindung mit ἀλλοτριότητι, ohne zwingend eine frühere Gottesbeziehung vorauszusetzen.
theological_decisions:
- issue: Fremdstatus oder Entfremdung von einer früheren Beziehung
  choice: Als Fremder … unserem Gott fremd
  alternative: In Entfremdung … von unserem Gott entfremdet
  rationale: Der griechische Wortstamm lässt sowohl Fremdheit als auch Entfremdung anklingen. Der Haupttext wahrt die wahrscheinlich konkrete Kennzeichnung des Feindes als Außenstehenden; die Fußnoten erhalten die relationale Lesart, ohne sie dogmatisch festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper poetischer Satzform. Die Wiederholung des Wortfelds „fremd“ bildet das griechische Wortspiel zwischen ἀλλοτριότητι und ἀλλοτρία nach.
