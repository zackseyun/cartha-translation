  source_fidelity: Die Übersetzung von καθαριεῖ mit „wird … reinigen“, von Ἰερουσαλήμ mit „Jerusalem“ und von ἐν ἁγιασμῷ mit „in Heiligkeit“ ist quellennah. Die elliptische Schlusswendung benötigt im Deutschen jedoch eine behutsame Ergänzung, damit der Satz verständlich und grammatisch vollständig ist. „Wie es auch von Anfang an war“ gibt die naheliegende Ergänzung wieder, ohne den im Griechischen nicht ausdrücklich benannten Bezugszustand weiter zu bestimmen.
  naturalness: Der bisherige Haupttext endet mit „wie auch das von Anfang an“ und ist im modernen Standarddeutsch syntaktisch unvollständig sowie nicht verständlich. Die revidierte Fassung ist natürlich, würdig und weiterhin knapp.
  terminology: „Reinigen“ ist für καθαριεῖ angemessen. Die Fußnotenalternative „Jerusalem heiligen“ ist dagegen keine tragfähige lexikalische Alternative zu καθαρίζω; sie verwechselt Reinigen mit Heiligen/Weihen. „In Heiligkeit“ bewahrt die offene Nuance von ἐν ἁγιασμῷ.
  issues:
