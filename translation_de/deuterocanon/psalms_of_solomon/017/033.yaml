  text: Und er wird Jerusalem in Heiligkeit reinigen[a], wie es auch von Anfang an war[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Jerusalem säubern“ oder „Jerusalem reinigen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Der griechische Ausdruck lautet wörtlich etwa: „wie auch das von Anfang an“ und ist elliptisch. „Es war“ ist zur Verständlichkeit ergänzt; der genauer gemeinte Zustand wird nicht ausdrücklich genannt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθαριεῖ
  choice: wird … reinigen
  rationale: Das Verb bezeichnet das Rein- oder Saubermachen. „Reinigen“ ist im religiösen Zusammenhang natürlich und lässt sowohl kultische als auch sittliche Reinheit offen.
- source_word: Ἰερουσαλήμ
  choice: Jerusalem
  rationale: Der Eigenname wird nach der üblichen deutschen Form wiedergegeben.
- source_word: ἐν ἁγιασμῷ
  choice: in Heiligkeit
  rationale: ἁγιασμός kann Heiligkeit, Heiligung oder Weihe bezeichnen. „In Heiligkeit“ folgt der griechischen Formulierung eng und legt nicht fest, ob die Wendung Mittel, Art und Weise oder Sphäre bezeichnet.
- source_word: ὡς καὶ τὸ ἀπ’ ἀρχῆς
  choice: wie auch das von Anfang an
  rationale: Die bewusst knappe Wiedergabe bewahrt die Ellipse des Griechischen, in dem τὸ auf einen unausgesprochenen Zustand oder Sachverhalt verweist.
theological_decisions:
- issue: Bezug und Ergänzung der elliptischen Vergleichsphrase
  choice: 'Die Ellipse bleibt im Haupttext sichtbar: „wie auch das von Anfang an“.'
  alternative: „wie es von Anfang an war“
  rationale: Der griechische Text enthält kein ausdrückliches Verb und benennt den verglichenen Zustand nicht eindeutig. Die natürlichere Ergänzung wird daher nur in der Fußnote angeboten, statt die Mehrdeutigkeit im Haupttext aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bleibt quellennah; die auffällige Ellipse am Versende wird erhalten und in einer Fußnote erläutert.
