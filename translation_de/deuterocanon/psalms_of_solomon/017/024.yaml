lexical_decisions:
- source_word: ὑψώσον
  choice: erhöhe
  rationale: Der Imperativ bezeichnet nach dem validierten vorliegenden griechischen Text das Erheben bzw. Erhöhen der betreffenden Person. »Erhöhe« bewahrt diese Bedeutung und den feierlichen Gebetsstil.
- source_word: ἰσχὺν
  choice: in Kraft
  rationale: Der Akkusativ kann hier adverbial als Angabe der Art und Weise verstanden werden. »In Kraft« hält die knappe, etwas ungewöhnliche Ausdrucksweise fest, ohne eindeutig zwischen machtvoller Erhöhung und Ausstattung mit Kraft zu entscheiden.
- source_word: τοῦ θραῦσαι
  choice: damit er … zerschmettert
  rationale: Der artikulierte Infinitiv bezeichnet den Zweck. Ein deutscher Finalsatz ist natürlich und gibt den Bezug zur handelnden Person klar wieder; »zerschmettert« wahrt die starke Gewaltsemantik von θραύω.
- source_word: ἄρχοντας
  choice: Herrscher
  rationale: Das Wort bezeichnet Personen mit Regierungs- oder Befehlsgewalt. »Herrscher« ist im politischen Zusammenhang klar und hinreichend breit.
- source_word: ἀδίκους
  choice: ungerechte
  rationale: Das Adjektiv kennzeichnet die Herrscher als gegen Recht und Gerechtigkeit handelnd. »Ungerecht« bewahrt hier besonders die öffentliche und politische Dimension.
theological_decisions:
- issue: Mögliche textkritische Abweichung bei ὑψώσον
  choice: Übersetzung des ausdrücklich vorgelegten und als direkt validiert bezeichneten Wortlauts ὑψώσον mit »erhöhe«
  alternative: Bei einer Lesart ὑπόζωσον wäre »gürte ihn mit Kraft« zu übersetzen.
  rationale: Die Übersetzung folgt der angegebenen originalsprachlichen Quellenevidenz. Da die Revisionsnotiz eine abweichende Lesart behauptet, ohne dass sie im bereitgestellten Quelltext steht, wird diese Möglichkeit transparent in einer Fußnote genannt und nicht stillschweigend in den Haupttext übernommen.
translation_notes:
  register: Moderner, würdevoller Gebetsstil. Die kompakte Wendung »in Kraft« erhält die Mehrdeutigkeit der griechischen Konstruktion; der Finalsatz sorgt zugleich für verständliches heutiges Deutsch.
