  yaml_path: translation/deuterocanon/psalms_of_solomon/017/001.yaml
  text: O Lord[a], you are our King forever and ever; for in you, our God[b], our soul will boast.
translation:
  language: de
  text: Herr, du bist unser König für immer und ewig[a]; denn in dir wird sich unsere Seele rühmen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „für das Zeitalter und noch darüber hinaus“; auch: „für immerdar“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „wird in dir frohlocken“ oder „wird sich in dir rühmen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Κύριε
  choice: Herr
  rationale: Der Vokativ richtet sich unmittelbar an Gott. „Herr“ ist die natürliche und würdige deutsche Wiedergabe von κύριος; ein zusätzliches „O“ wäre im heutigen Deutsch unnötig feierlich.
- source_word: Βασιλεὺς
  choice: König
  rationale: „König“ bewahrt das konkrete königliche Bild und die Aussage über Gottes Herrschaft.
- source_word: εἰς τὸν αἰῶνα καὶ ἔτι
  choice: für immer und ewig
  rationale: Die idiomatische deutsche Wendung gibt die nachdrückliche, über ein einzelnes Zeitalter hinausreichende Dauer wieder, auch wenn der griechische Wortlaut näher bei „für das Zeitalter und noch darüber hinaus“ liegt.
- source_word: ἐν σοὶ
  choice: mit dir
  rationale: Bei καυχᾶσθαι bezeichnet ἐν mit Dativ den Grund oder Bezug des Rühmens. „Sich mit dir rühmen“ ist im Deutschen natürlich und wahrt, dass Gott selbst Gegenstand und Grund des Rühmens ist.
- source_word: καυχήσεται
  choice: wird … sich rühmen
  rationale: „Sich rühmen“ entspricht der Grundbedeutung des Verbs und klingt im gehobenen, aber modernen Deutsch natürlicher als „prahlen“; die mögliche Nuance freudigen Jubelns bleibt in der Fußnote sichtbar.
- source_word: ἡ ψυχὴ ἡμῶν
  choice: unsere Seele
  rationale: Der griechische Singular mit pluralischem Possessiv wird bewahrt und vermittelt die gemeinschaftliche Stimme, ohne ψυχή zu einem bloßen Personalpronomen zu verflachen.
theological_decisions:
- issue: Gott als Gegenstand beziehungsweise Grund des Rühmens
  choice: „mit dir … sich rühmen“
  alternative: „in dir … jubeln“ oder „auf dich … stolz sein“
  rationale: 'Die Übersetzung lässt die semantische Spannung von ἐν σοὶ καυχήσεται bestehen: Das Rühmen gründet in Gott und richtet sich zugleich auf ihn. Eine stärker deutende Formulierung würde diese Offenheit verengen.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter Anrede. Der kollektive Singular „unsere Seele“ und das königliche Gottesbild bleiben erhalten; unnötige Archaismen werden vermieden.
