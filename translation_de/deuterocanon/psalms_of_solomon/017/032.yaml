  naturalness: Der Relativsatz zu ἔχω + Akkusativ + Infinitiv ist idiomatisches modernes Deutsch. „Vor aller Welt sichtbar“ ist verständlich und angemessen; „Völker der Nationen“ bildet die absichtlich doppelte griechische Bezeichnung genauer ab als „Völker aus den Nationen“.
  terminology: „Joch“, „Herrn“ und „verherrlichen“ sind treffende, würdige und traditionsfähige Wiedergaben. Die Fassung vermeidet eine über das Griechische hinausgehende Identifizierung des Ortes oder eine konfessionelle Deutung der unterworfenen Völker.
