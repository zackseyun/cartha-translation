base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/017/032.yaml
  text: And he will have peoples of the nations serve him under his yoke[d][c][b][a], and he will glorify the Lord in a place conspicuous to all the earth.
translation:
  language: de
  text: Und er wird Völker der Nationen haben, die ihm unter seinem Joch dienen[a], und er wird den Herrn an einem Ort verherrlichen, der vor aller Welt sichtbar ist[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Völker der Nationen als Untertanen unter seinem Joch haben“. Das griechische Verb kann Dienen und Unterworfensein bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „an einem in der ganzen Welt angesehenen Ort“. Das griechische Wort kann sowohl auffällige Sichtbarkeit als auch besondere Bekanntheit oder hohes Ansehen ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕξει ... δουλεύειν
  choice: wird ... haben, die ... dienen
  rationale: Die Konstruktion mit ἔχω, Akkusativ und Infinitiv wird im Deutschen natürlich durch einen Relativsatz wiedergegeben. Sie bezeichnet hier, dass ihm Völker als Dienende unterstellt sein werden, ohne bloß eine momentane Veranlassung auszudrücken.
- source_word: λαοὺς ἐθνῶν
  choice: Völker aus den Nationen
  rationale: Die Wiedergabe wahrt die beiden Begriffe λαοί und ἔθνη und berücksichtigt zugleich den fehlenden Artikel bei λαούς. Sie vermeidet, die Wendung vorschnell auf den theologischen Fachbegriff „Heiden“ festzulegen.
- source_word: δουλεύειν
  choice: dienen
  rationale: „Dienen“ deckt sowohl Dienst als auch Unterordnung ab; der Zwangs- und Herrschaftsaspekt wird bereits durch „unter seinem Joch“ deutlich.
- source_word: ζυγὸν
  choice: Joch
  rationale: Das konkrete Herrschaftsbild des griechischen Textes bleibt erhalten.
- source_word: τὸν κύριον
  choice: den Herrn
  rationale: „Herr“ ist die sachgerechte und traditionsfähige Wiedergabe des Titels κύριος.
- source_word: δοξάσει
  choice: wird ... verherrlichen
  rationale: „Verherrlichen“ gibt δοξάζω direkt wieder und bewahrt dessen religiöses Gewicht.
- source_word: ἐν ἐπισήμῳ πάσης τῆς γῆς
  choice: an einem Ort ..., der vor aller Welt sichtbar ist
  rationale: Das substantivisch gebrauchte ἐπισήμῳ bezeichnet einen hervorgehobenen, auffälligen oder weithin wahrnehmbaren Ort. „Vor aller Welt sichtbar“ gibt den Bezug von πάσης τῆς γῆς idiomatisch wieder, ohne einen nicht vorhandenen Vergleich („über der ganzen Erde“) einzuführen.
theological_decisions:
- issue: Art der Unterordnung der Nationenvölker
  choice: „die ihm unter seinem Joch dienen“
  alternative: „die ihm als Untertanen dienen“ oder „die ihm versklavt sind“
  rationale: Der Text spricht eindeutig von Unterordnung, legt mit δουλεύειν allein jedoch nicht jede rechtliche oder soziale Einzelheit fest. Das Bild des Jochs trägt die Spannung zwischen Dienst und Zwang, ohne sie konfessionell oder politisch auszudeuten.
- issue: Bezug des auffälligen Ortes
  choice: Der Ort bleibt unbenannt.
  alternative: Identifizierung etwa mit Jerusalem oder Zion
  rationale: Der Vers nennt den Ort nicht ausdrücklich. Eine Identifizierung würde mehr festlegen, als der griechische Wortlaut an dieser Stelle sagt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bleibt nahe am griechischen Parallelismus, während der Relativsatz die Konstruktion ἔχω + Akkusativ + Infinitiv natürlich wiedergibt. „Vor aller Welt“ ist idiomatisch und meint hier die ganze Erde beziehungsweise ihre Bewohner, nicht bloß eine moderne Öffentlichkeit.
