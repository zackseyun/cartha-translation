  source_fidelity: 'Die Übersetzung gibt die griechischen Aussagen zutreffend wieder: οὐκ ἐλέησεν als „hatte kein Erbarmen“, ἐξερεύνησεν als zielgerichtetes „spürte ... auf“, σπέρμα als „Nachkommen“ und οὐκ ἀφῆκεν αὐτῶν ἕνα als vollständiges Zurücklassen von niemandem. Die Totalitätsaussage bleibt erhalten.'
