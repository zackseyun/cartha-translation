base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/017/011.yaml
  text: God did not have mercy on them[b][a]. He searched out their offspring and did not leave one of them.
translation:
  language: de
  text: Gott hatte kein Erbarmen mit ihnen. Er spürte ihre Nachkommen[a] auf und ließ keinen von ihnen übrig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: „ihren Samen“; gemeint sind ihre Nachkommen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλέησεν
  choice: hatte kein Erbarmen mit
  rationale: ἐλεέω bezeichnet hier ausdrücklich das Erweisen von Erbarmen. Die Wiedergabe bewahrt diesen Begriff und vermeidet eine Gleichsetzung mit dem in Psalm Salomos 17,14 verwendeten φείδομαι („verschonen“).
- source_word: ἐξερεύνησεν
  choice: spürte ... auf
  rationale: Das Verb bezeichnet ein gründliches Suchen oder Ausforschen. Im Zusammenhang des Gerichts gibt „aufspüren“ die zielgerichtete Suche natürlich und prägnant wieder.
- source_word: σπέρμα
  choice: Nachkommen
  rationale: σπέρμα meint hier nicht wörtlichen Samen, sondern die Nachkommenschaft. „Nachkommen“ ist im modernen Deutschen klar und wahrt den familiären Bezug.
- source_word: οὐκ ἀφῆκεν αὐτῶν ἕνα
  choice: ließ keinen von ihnen übrig
  rationale: Diese Formulierung gibt die griechische Aussage vollständiger Vernichtung idiomatisch wieder, ohne das Verb zusätzlich als „verschonen“ zu deuten.
theological_decisions:
- issue: Erbarmen oder Verschonung in οὐκ ἐλέησεν
  choice: Gott hatte kein Erbarmen mit ihnen
  alternative: Gott verschonte sie nicht
  rationale: Die gewählte Fassung erhält den eigenständigen theologischen Begriff des Erbarmens. „Verschonen“ würde die Aussage stärker auf das Ergebnis des Gerichts verengen und die Unterscheidung zu φείδομαι verwischen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Spürte ... auf“ vermittelt die gründliche, zielgerichtete Suche; „ließ keinen ... übrig“ bewahrt die Härte und Totalität der Aussage.
