  terminology: „Erbarmen“ bewahrt gegenüber „verschonen“ sinnvoll die lexikalische und theologische Eigenart von ἐλεέω; dies stimmt auch mit dem englischen Auditvermerk zur Unterscheidung von φείδομαι überein. „Nachkommen“ ist für σπέρμα kontextgerecht. Die Fußnote bietet die wörtliche Alternative „Samen“ am korrekt verankerten Ausdruck.
