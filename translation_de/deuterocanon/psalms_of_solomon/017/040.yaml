lexical_decisions:
- source_word: εὐλογήσει
  choice: Er wird … segnen
  rationale: Das Futur Aktiv von εὐλογέω bezeichnet hier, mit dem Volk als Objekt, das Segnen beziehungsweise Zuwenden von Segen. „Segnen“ ist die natürliche und kontextgerechte deutsche Wiedergabe.
- source_word: λαὸν Κυρίου
  choice: das Volk des Herrn
  rationale: λαός bezeichnet hier das dem Herrn zugehörige Volk; der Genitiv Κυρίου wird natürlich und zugleich eng am Griechischen als „des Herrn“ wiedergegeben.
- source_word: ἐν σοφίᾳ
  choice: in Weisheit
  rationale: ἐν kann die Sphäre oder Art und Weise bezeichnen. „In Weisheit“ bewahrt diese leichte Offenheit und entspricht der vom Griechischen unterschiedenen Präposition gegenüber dem folgenden μετά.
- source_word: μετʼ εὐφροσύνης
  choice: mit Freude
  rationale: μετά mit Genitiv bezeichnet Begleitung; εὐφροσύνη meint Freude, Frohsinn oder freudiges Jubeln. „Mit Freude“ ist klar, würdig und idiomatisch.
theological_decisions:
- issue: Bezug der modalen Angaben
  choice: Die griechische Abfolge wird in „in Weisheit …, mit Freude“ bewahrt.
  alternative: „Er wird das Volk des Herrn mit Weisheit und Freude segnen.“
  rationale: Die gewählte Fassung unterscheidet ἐν und μετά und vermeidet es, beide Angaben durch ein im Ausgangstext nicht vorhandenes „und“ vollständig gleichzuordnen. Zugleich bleibt offen, ob „in Weisheit“ eher die Sphäre oder die Art des Segnens bezeichnet.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die leicht markierte Nachstellung „mit Freude“ folgt der griechischen Wortfolge und erhält die Spannung zwischen den beiden unterschiedlich eingeleiteten modalen Angaben.
