base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/017/021.yaml
  text: The everlasting springs from the depths[a], from the lofty mountains, were restrained, because there was no one among them doing righteousness and justice; from their ruler to the least of the people[b], all were in every kind of sin.
translation:
  language: de
  text: Die immerwährenden Quellen aus den Tiefen, von den hohen Bergen her, wurden zurückgehalten[a], denn unter ihnen war niemand, der Gerechtigkeit und Recht übte. Von ihrem Herrscher bis zum Geringsten im Volk waren alle in jeder Art von Sünde verstrickt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die ewigen Quellen“ beziehungsweise „die uralten Quellen“.'
    reason: Das griechische αἰώνιοι kann je nach Zusammenhang fortdauernde, ewige oder seit alters bestehende Dauer bezeichnen.
lexical_decisions:
- source_word: πηγαὶ
  choice: Quellen
  rationale: Das Substantiv bezeichnet natürliche Ursprünge fließenden Wassers; „Quellen“ ist im Deutschen klar, natürlich und bildkräftig.
- source_word: συνεσχέθησαν
  choice: wurden zurückgehalten
  rationale: Die Passivform bezeichnet ein Hemmen oder Aufhalten. „Zurückgehalten“ wahrt den Gerichtston, ohne den Vorgang unnötig technisch festzulegen.
- source_word: αἰώνιοι
  choice: immerwährenden
  rationale: Im Zusammenhang mit Wasserquellen bezeichnet das Adjektiv wahrscheinlich lang anhaltendes oder unaufhörliches Fließen. „Immerwährend“ wahrt den poetischen Ton und vermeidet eine rein philosophische Auffassung von Ewigkeit; die mögliche Bedeutung „uralt“ wird in der Fußnote genannt.
- source_word: ἐξ ἀβύσσων
  choice: aus den Tiefen
  rationale: „Aus den Tiefen“ gibt die Herkunft aus tiefen, verborgenen Bereichen idiomatisch wieder und bewahrt die poetische Bildsprache.
- source_word: ἀπὸ ὀρέων ὑψηλῶν
  choice: von den hohen Bergen her
  rationale: Die Wendung bezeichnet die Herkunft der Quellen. Das ergänzte „her“ macht diese Richtung im Deutschen eindeutig.
- source_word: ποιῶν δικαιοσύνην καὶ κρίμα
  choice: der Gerechtigkeit und Recht übte
  rationale: „Üben“ gibt den aktiven moralischen Vollzug des Partizips wieder. Die Paarung „Gerechtigkeit und Recht“ bewahrt die ethisch-rechtliche Spannung beider Begriffe.
- source_word: ἄρχοντος αὐτῶν
  choice: ihrem Herrscher
  rationale: „Herrscher“ ist die allgemeinste passende Bezeichnung für eine führende politische Autorität und bildet den sozialen Gegenpol zum Geringsten.
- source_word: λαοῦ ἐλαχίστου
  choice: zum Geringsten im Volk
  rationale: Der Superlativ bezeichnet die niedrigste soziale Stellung. Die Konstruktion „vom … bis zum …“ gibt die umfassende Spannweite idiomatisch wieder.
- source_word: ἐν πάσῃ ἁμαρτίᾳ
  choice: in jeder Art von Sünde verstrickt
  rationale: Die Formulierung drückt umfassende Sündhaftigkeit aus. „In jeder Art von Sünde“ ist natürliches Deutsch; „verstrickt“ vervollständigt die elliptische griechische Aussage, ohne eine bestimmte Sündenlehre einzutragen.
theological_decisions:
- issue: Wiedergabe von δικαιοσύνη in einem frühjüdischen, nichtpaulinischen Text
  choice: Gerechtigkeit
  alternative: Rechtschaffenheit
  rationale: „Gerechtigkeit“ wahrt den etablierten ethischen Gehalt von δικαιοσύνη, während κρίμα mit „Recht“ wiedergegeben wird. So werden die beiden verwandten, aber nicht identischen Begriffe nicht zu einem einzigen Bedeutungsfeld eingeebnet.
- issue: Umfassender Umfang der Sündenaussage
  choice: Von ihrem Herrscher bis zum Geringsten im Volk waren alle in jeder Art von Sünde verstrickt
  alternative: von ihrem Herrscher und dem Geringsten des Volkes her in jeder Sünde
  rationale: Der griechische Schlusssatz ist elliptisch. Die deutsche Fassung macht die durch die sozialen Endpunkte bezeichnete Gesamtheit ausdrücklich, ohne einzelne Sündenarten oder einen besonderen dogmatischen Begriff universaler Sündhaftigkeit einzuführen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit poetischem Klang. Die Herkunftsangaben stehen unmittelbar bei „Quellen“, damit sie nicht missverständlich auf das Zurückhalten bezogen werden. Der zweite Satz bewahrt die ethisch-rechtliche Doppelung des griechischen Ausdrucks; der elliptische Schluss wird für heutige Leser behutsam vervollständigt.
