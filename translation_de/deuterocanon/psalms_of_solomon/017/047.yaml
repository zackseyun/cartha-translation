  yaml_path: translation/deuterocanon/psalms_of_solomon/017/047.yaml
  text: 'This is the splendor of the king of Israel[a], which God knew: to raise him up over the house of Israel[c][b], to discipline him.'
translation:
  language: de
  text: Das ist die Pracht des Königs von Israel, die Gott kannte:[a] ihn über das Haus Israel zu erheben[b] und ihn zu erziehen.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „vorherkannte“ oder „anerkannte“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „für das Haus Israel einzusetzen“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „ihn zu unterweisen“ beziehungsweise „ihn zu züchtigen“. Der Satz kann auch verstanden werden: „die Gott darin erkannte, dass er ihn über das Haus Israel erhob und erzog“.'
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: εὐπρέπεια
  choice: Herrlichkeit
  rationale: Das Wort bezeichnet ansehnliche Schönheit, Würde oder königlichen Glanz. „Herrlichkeit“ verbindet sichtbare Pracht mit erhabener Würde, ohne die Aussage auf bloß äußere Schönheit zu verengen.
- source_word: ἔγνω
  choice: kannte
  rationale: Die schlichte Wiedergabe wahrt die Weite von γινώσκω und lässt offen, ob hier bloßes Wissen, Anerkennen, Erwählen oder Vorherwissen mitschwingt.
- source_word: ἀναστῆσαι
  choice: zu erheben
  rationale: Der Infinitiv bezeichnet das Aufstehenlassen beziehungsweise Einsetzen. „Zu erheben“ bewahrt das Bild und passt zugleich zur königlichen Einsetzung.
- source_word: ἐπʼ οἶκον Ἰσραήλ
  choice: über das Haus Israel
  rationale: ἐπί mit Akkusativ kann hier die Herrschaft über Israel ausdrücken. „Haus Israel“ bewahrt die korporative Bezeichnung des Volkes.
- source_word: παιδεῦσαι
  choice: zu erziehen
  rationale: παιδεύω umfasst Erziehung, Unterweisung, Schulung und Züchtigung. „Erziehen“ hält den formenden Sinn offen und vermeidet eine unnötige Festlegung auf Strafe.
theological_decisions:
- issue: Bedeutung von Gottes Erkennen des Königs beziehungsweise seiner Herrlichkeit
  choice: kannte
  alternative: vorherkannte, anerkannte oder erwählte
  rationale: Der mögliche semitische Hintergrund kann göttliche Erwählung oder Vorherbestimmung anklingen lassen; der griechische Wortlaut legt diese Nuance jedoch nicht eindeutig fest. „Kannte“ bewahrt die theologische Spannung.
- issue: Bezug und Funktion der beiden Infinitive
  choice: Erläuterung nach einem Doppelpunkt
  alternative: 'Umstandsangabe: „darin, dass er ihn … erhob und erzog“'
  rationale: Die Infinitive können den Inhalt oder Zweck dessen entfalten, was Gott kannte. Der Doppelpunkt erhält ihre erklärende beziehungsweise zweckhafte Kraft, ohne die syntaktische Beziehung endgültig festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzgestalt folgt der knappen griechischen Prädikation; der Doppelpunkt macht die Infinitivgruppe lesbar, ohne ihre mehrdeutige Beziehung zu ἔγνω aufzulösen.
