  text: Look, Lord, and raise up for them their king, Look, Lord, and raise up for them their king, the son of David, at the time you chose, O God, for him to reign over Israel your servant., at the time Look, Lord, and raise up for them their king, a son of David, at the time you chose, O God, for him to reign over Israel your servant., O God, for him to reign over Israel your servant.
translation:
  language: de
  text: Sieh, Herr, und erwecke ihnen ihren König, den Sohn Davids, zu der Zeit, die du, o Gott, vorgesehen hast, damit dein Diener über Israel herrsche.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „damit er über Israel, deinen Diener, herrsche“. Das Griechische lässt offen, ob „dein Diener“ den davidischen König oder Israel bezeichnet.'
    reason: παῖδά σου kann als Akkusativsubjekt zu βασιλεῦσαι auf den davidischen König bezogen werden oder als Apposition zu Ἰσραήλ verstanden werden. Die Übersetzung bewahrt diese Mehrdeutigkeit in der Anmerkung.
lexical_decisions:
- source_word: ἴδε
  choice: Sieh her
  rationale: Gibt den imperativischen Gebetsruf natürlich und würdevoll wieder, ohne das im heutigen Deutsch ungewöhnlich steife „Siehe“ zu erzwingen.
- source_word: ἀνάστησον
  choice: erwecke
  rationale: Bewahrt das Bild des göttlichen Auftretenlassens bzw. Erweckens eines Königs; „setze ein“ wäre eindeutiger, aber weniger bildnah.
- source_word: υἱὸν Δαυίδ
  choice: den Sohn Davids
  rationale: Die artikellose griechische Apposition bezeichnet hier den davidischen König; im Deutschen ist die bestimmte Form nach „ihren König“ idiomatisch.
- source_word: εἰς τὸν καιρὸν ὃν ἴδες σύ
  choice: zu der Zeit, die du bestimmt hast
  rationale: Wörtlich steht „zu der Zeit, die du gesehen hast“; im Kontext bezeichnet Gottes Sehen die von ihm ersehnte bzw. festgesetzte Zeit. „bestimmt“ vermittelt den idiomatischen Sinn.
- source_word: βασιλεῦσαι
  choice: herrsche
  rationale: Gibt das Königtum als Tätigkeit wieder und passt zum finalen Infinitiv mit τοῦ.
- source_word: παῖδά σου
  choice: dein Diener
  rationale: παῖς kann „Kind“, „Sohn“ oder „Diener“ heißen. Im königlich-messianischen Zusammenhang bleibt „Diener“ die offenere und sachlich passende Wiedergabe.
theological_decisions:
- issue: Bezug von παῖδά σου
  choice: 'Als Subjekt des Infinitivs auf den davidischen König bezogen: „damit dein Diener über Israel herrsche“'
  alternative: 'Als Apposition zu Israel: „damit er über Israel, deinen Diener, herrsche“'
  rationale: Der Akkusativ παῖδά σου kann grammatisch als Subjekt von βασιλεῦσαι verstanden werden und bezeichnet dann den erbetenen davidischen König als Gottes Diener. Wegen der Stellung nach ἐπʼ Ἰσραήλ bleibt jedoch ein Bezug auf Israel möglich und wird in der Fußnote offengelegt.
- issue: Bestimmtheit von υἱὸν Δαυίδ
  choice: „den Sohn Davids“
  alternative: „einen Sohn Davids“
  rationale: Als Apposition zu „ihren König“ identifiziert der Ausdruck den erwarteten davidischen Herrscher. Der fehlende griechische Artikel allein verlangt hier im Deutschen keine unbestimmte Wiedergabe.
translation_notes:
  register: Modernes, würdiges Gebetsdeutsch. „Sieh her“ vermeidet archaisches „Siehe“, während „erwecke“ die bildhafte Sprache des griechischen Textes erhält. Die Anrede „Gott“ bleibt entsprechend dem griechischen ὁ θεός ohne ergänztes „o“.
