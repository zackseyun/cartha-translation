  yaml_path: translation/deuterocanon/psalms_of_solomon/017/030.yaml
  text: For he will recognize them[a], that they all are sons of their God[c][b], and he will apportion them among their tribes upon the land.
translation:
  language: de
  text: Denn er wird sie daran erkennen[a], dass sie alle Söhne ihres Gottes sind; und er wird sie nach ihren Stämmen im Land[b] verteilen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Denn er wird sie erkennen, weil/denn sie alle Söhne ihres Gottes sind.“ Das griechische ὅτι kann einen Inhalt („dass“) oder einen Grund („weil/denn“) angeben.'
    reason: syntactic_alternative
  - marker: b
    text: 'Oder: „auf der Erde“. Das griechische γῆ kann sowohl „Land“ als auch „Erde“ bedeuten; ἐπί heißt wörtlich „auf“.'
    reason: alternative_reading
lexical_decisions:
- source_word: γνώσεται
  choice: wird sie erkennen und wissen
  rationale: γινώσκω bezeichnet hier nicht bloß das Erlangen einer Information, sondern ein identifizierendes, anerkennendes Kennen. Die Doppelwendung gibt diesen persönlichen Sinn wieder und ermöglicht zugleich eine natürliche deutsche Verbindung mit dem folgenden ὅτι-Satz.
- source_word: υἱοὶ θεοῦ ... αὐτῶν
  choice: Söhne ihres Gottes
  rationale: υἱοί ist ausdrücklich maskuliner Plural; „Söhne“ bewahrt sowohl die Formulierung als auch ihren möglichen Klang von Bundeszugehörigkeit und Würde. Das nachgestellte αὐτῶν wird idiomatisch als Possessiv „ihres“ wiedergegeben.
- source_word: καταμερίσει
  choice: wird ... verteilen
  rationale: Das Verb bezeichnet ein Aufteilen oder Zuweisen nach geordneten Anteilen. In Verbindung mit Personen und Stämmen ist „verteilen“ im Deutschen natürlicher als „zuteilen“, ohne den Gedanken einer geregelten Aufteilung aufzugeben.
- source_word: ἐν ταῖς φυλαῖς αὐτῶν
  choice: nach ihren Stämmen
  rationale: Die Wendung beschreibt hier am ehesten eine stammesweise Gliederung, nicht lediglich einen Ort innerhalb der Stämme. „Nach ihren Stämmen“ gibt diesen distributiven Sinn knapp und verständlich wieder.
- source_word: ἐπὶ τῆς γῆς
  choice: im Land
  rationale: Im Zusammenhang mit der stammesweisen Verteilung liegt das territorial verstandene Land nahe. Da γῆ zugleich „Erde“ bedeuten kann und ἐπί wörtlicher mit „auf“ wiedergegeben werden könnte, bleibt diese echte Mehrdeutigkeit in einer Fußnote sichtbar.
theological_decisions:
- issue: Bedeutung von υἱοὶ θεοῦ
  choice: Söhne ihres Gottes
  alternative: Kinder ihres Gottes
  rationale: Die Übersetzung bewahrt die ausdrücklich maskuline Bildsprache des griechischen Textes, ohne über die dort ausgesagte Zugehörigkeit zu Gott hinaus eine besondere dogmatische Deutung einzutragen.
- issue: Territorialer oder universaler Sinn von ἐπὶ τῆς γῆς
  choice: im Land
  alternative: auf der Erde / auf dem Land
  rationale: Die Nennung der Stämme und der Verteilung spricht im Kontext für ein bestimmtes Land. Die sprachlich mögliche weitere Bedeutung „Erde“ sowie die wörtlichere Wiedergabe der Präposition werden jedoch nicht ausgeschlossen, sondern in der Fußnote genannt.
- issue: Verhältnis von γνώσεται αὐτούς und ὅτι
  choice: er wird sie erkennen und wissen, dass ...
  alternative: er wird sie erkennen, weil ...
  rationale: ὅτι kann einen Inhalt („dass“) oder einen Grund („weil/denn“) einleiten. Der Haupttext versteht den Satz als Inhalt seines Erkennens, während die mögliche kausale Lesart in der Fußnote offengehalten wird.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau wurde gegenüber der im Deutschen schwer nachbildbaren griechischen Folge γνώσεται αὐτούς ὅτι behutsam geglättet. „Söhne“ wahrt die konkrete Bildsprache; „nach ihren Stämmen“ und „im Land“ ergeben eine klare, natürliche Aussage, während sachlich echte Alternativen in den Fußnoten erhalten bleiben.
