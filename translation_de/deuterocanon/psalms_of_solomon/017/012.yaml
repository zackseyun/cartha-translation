  source_fidelity: Der deutsche Text gibt πιστός mit „treu“, κύριος mit „der Herr“, ἐν πᾶσι τοῖς κρίμασιν αὐτοῦ mit „in all seinen Gerichten“ und den an κρίμασιν anschließenden Relativsatz angemessen wieder. „die er auf der Erde vollzieht“ wahrt den Bezug auf die Gerichte sowie die Ortsangabe ἐπὶ τὴν γῆν. Das explizite αὐτοῦ ist durch „seinen“ enthalten.
  naturalness: „Der Herr ist treu in all seinen Gerichten, die er auf der Erde vollzieht“ ist natürliches, würdiges modernes Standarddeutsch. „Vollzieht“ passt idiomatisch zu gerichtlichen Handlungen und bleibt nahe am griechischen ποιεῖ.
  terminology: „Herr“, „treu“ und „Gerichten“ sind konsistent und sachgerecht. „Gerichte“ lässt die im griechischen κρίματα enthaltene Bandbreite von Urteilen bzw. richterlichen Handlungen offen, ohne eine spezifische theologische Deutung einzutragen. Die Fußnote bewahrt die mögliche örtlich-konkrete Bedeutung von γῆ.
