  yaml_path: translation/deuterocanon/psalms_of_solomon/017/012.yaml
  text: The Lord is faithful in all his judgments that he carries out on the earth[a].
translation:
  language: de
  text: Der Herr ist treu in all seinen Gerichten, die er auf der Erde[a] vollzieht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: im Land.'
    reason: γῆ kann je nach Zusammenhang sowohl die Erde als auch ein bestimmtes Land bezeichnen; ohne weiteren Kontext ist „Erde“ die weniger einschränkende Hauptlesart.
lexical_decisions:
- source_word: πιστός
  choice: treu
  rationale: Das prädikative Adjektiv bezeichnet die Verlässlichkeit und Beständigkeit des Herrn; „treu“ gibt dies im Deutschen natürlich und theologisch offen wieder.
- source_word: κύριος
  choice: der Herr
  rationale: Die übliche ehrerbietige Wiedergabe des Titels κύριος entspricht dem Sprachgebrauch der Septuaginta.
- source_word: κρίμασιν
  choice: Gerichten
  rationale: κρίματα bezeichnet hier richterliche Entscheidungen oder konkrete Akte des Gerichts. „Gerichte“ bewahrt diese Bedeutungsbreite und vermeidet eine erklärende Festlegung.
- source_word: ποιεῖ
  choice: vollzieht
  rationale: Wörtlich bedeutet ποιεῖ „tut/macht“; in Verbindung mit „Gerichten“ drückt „vollzieht“ idiomatisch aus, dass diese tatsächlich ausgeführt werden.
- source_word: ἐπὶ τὴν γῆν
  choice: auf der Erde
  rationale: Die Formulierung bezeichnet am naheliegendsten den Bereich, in dem der Herr handelt; die mögliche kontextuelle Bedeutung „im Land“ wird in der Fußnote bewahrt.
theological_decisions:
- issue: Ob der Vers vor allem Gottes Wesensart oder die Beschaffenheit seiner Gerichte hervorhebt
  choice: „Der Herr ist treu“ lässt πιστός ausdrücklich eine Eigenschaft des Herrn bezeichnen, während „in all seinen Gerichten“ diese Treue in seinem richterlichen Handeln verortet.
  alternative: „Der Herr ist gerecht in all seinen Gerichten“
  rationale: „Gerecht“ würde einen anderen, im griechischen Adjektiv πιστός nicht ausdrücklich enthaltenen Begriff einführen. Die Übersetzung bewahrt sowohl die Aussage über Gottes Treue als auch deren Sichtbarkeit in seinen Gerichten.
- issue: Bezug des Relativsatzes οἷς ποιεῖ
  choice: „die er … vollzieht“ bezieht den Relativsatz auf die Gerichte und gibt sie als ausgeführte richterliche Handlungen wieder.
  alternative: Den Relativsatz allgemeiner als „bei allem, was er tut“ verstehen.
  rationale: Das Relativpronomen knüpft grammatisch an κρίμασιν an; daher ist der Bezug auf die Gerichte am stärksten im Text verankert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „In all seinen Gerichten“ hält die enge griechische Verbindung von Gottes Treue und seinem richterlichen Handeln fest; „vollzieht“ ist gegenüber einem wörtlichen „tut“ idiomatischer.
