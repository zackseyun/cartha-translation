  yaml_path: translation/deuterocanon/psalms_of_solomon/017/010.yaml
  text: According to their sins you will repay them[a], O God; may they be found according to their works.
translation:
  language: de
  text: Nach ihren Sünden wirst du ihnen vergelten, o Gott; möge es ihnen nach ihren Taten ergehen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Möge es für sie nach ihren Taten gefunden werden.“'
    reason: Die griechische Passivwendung ist im Deutschen nicht idiomatisch; die Fußnote dokumentiert ihre ungewöhnliche Form.
lexical_decisions:
- source_word: κατὰ τὰ ἁμαρτήματα αὐτῶν
  choice: nach ihren Sünden
  rationale: κατά mit Akkusativ bezeichnet hier den Maßstab der Vergeltung. „Nach ihren Sünden“ bewahrt diese proportionale Aussage und den biblisch-würdigen Ton.
- source_word: ἀποδώσεις αὐτοῖς
  choice: wirst du ihnen vergelten
  rationale: Das Futur bezeichnet Gottes künftige Vergeltung. Das deutsche „jemandem vergelten“ gibt sowohl die gerichtliche Bedeutung als auch die Dativkonstruktion knapp und natürlich wieder.
- source_word: ὁ θεός
  choice: o Gott
  rationale: Der formal nominativische Ausdruck fungiert als Anrede. „O Gott“ erhält den Gebetscharakter.
- source_word: εὑρεθείη αὐτοῖς
  choice: möge es ihnen ergehen
  rationale: Der Aoristoptativ drückt einen Wunsch aus. Die wörtliche passive Wendung „möge es für sie gefunden werden“ ist im Deutschen unverständlich; „möge es ihnen ergehen“ gibt idiomatisch wieder, was ihnen entsprechend ihren Taten widerfahren soll, ohne ein konkretes Ergebnis hinzuzufügen.
- source_word: κατὰ τὰ ἔργα αὐτῶν
  choice: nach ihren Taten
  rationale: κατά nennt erneut den Maßstab. „Taten“ ist im heutigen Deutsch natürlicher als „Werke“ und bezeichnet hier klar das moralisch relevante Handeln.
theological_decisions:
- issue: Art und Ausgang der göttlichen Vergeltung
  choice: Die Formulierung lässt offen, was ihnen konkret widerfahren soll.
  alternative: Die Aussage ausdrücklich als Strafe oder Verurteilung wiederzugeben.
  rationale: Der Zusammenhang legt gerichtliche Vergeltung nahe, doch der griechische zweite Halbsatz benennt das Ergebnis nicht ausdrücklich. Die Übersetzung bewahrt diese Offenheit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper poetischer Parallelstruktur. Die wiederholte Maßstabsangabe „nach ihren …“ spiegelt die beiden κατά-Fügungen; der Optativ bleibt als Wunsch mit „möge“ erkennbar.
