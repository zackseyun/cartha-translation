base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/017/036.yaml
  text: And there will be no injustice in his days among them[a], because all are holy[b], and their king is the Lord Messiah.
translation:
  language: de
  text: Und in seinen Tagen wird es unter ihnen kein Unrecht geben,[a] denn sie alle sind heilig, und ihr König ist der Messias, der Herr.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher nach der Verbform: „Und in seinen Tagen gibt es unter ihnen kein Unrecht.“'
    reason: Das griechische ἔστιν steht im Präsens, erhält im Zusammenhang der angekündigten künftigen Herrschaft jedoch Zukunftsbezug.
  - marker: b
    text: 'Auch möglich: „der Herr Messias“; nach anderer Deutung: „der Messias des Herrn“.'
    reason: Die knappe griechische Folge χριστὸς κύριος lässt das genaue Verhältnis der beiden Titel offen; ein ausdrücklicher Genitiv steht nicht im Text.
lexical_decisions:
- source_word: ἀδικία
  choice: Unrecht
  rationale: „Unrecht“ umfasst moralisches Fehlverhalten und soziale Ungerechtigkeit, ohne den Ausdruck unnötig zu verengen.
- source_word: ἐν ταῖς ἡμέραις αὐτοῦ
  choice: in seinen Tagen
  rationale: Die idiomatische Zeitangabe bleibt nahe am Griechischen und bezeichnet seine künftige Epoche, ohne sie ausdrücklich als Regierungszeit auszudeuten.
- source_word: ἐν μέσῳ αὐτῶν
  choice: unter ihnen
  rationale: „Unter ihnen“ gibt den gemeinschaftlichen Bezug natürlich und präzise wieder.
- source_word: ἅγιοι
  choice: heilig
  rationale: „Heilig“ ist die direkte, allgemein verständliche Wiedergabe und vermeidet den später stärker fachsprachlichen Klang von „Heilige“ als Substantiv.
- source_word: χριστός
  choice: Messias
  rationale: Hier ist χριστός ein jüdisch-königlicher Titel und wird daher mit „Messias“ statt mit dem namensartig wirkenden „Christus“ wiedergegeben.
- source_word: κύριος
  choice: Herr
  rationale: „Herr“ ist die übliche und würdige Wiedergabe; in der mehrdeutigen Titelfolge wird das Wort nicht paraphrasierend aufgelöst.
theological_decisions:
- issue: Wiedergabe der Titelfolge χριστὸς κύριος
  choice: der Herr Messias
  alternative: 'der Messias, der Herr; nach anderer Deutung: der Messias des Herrn'
  rationale: Beide griechischen Wörter stehen im Nominativ; ein Genitiv ist nicht ausdrücklich vorhanden. „Der Herr Messias“ bewahrt beide Titel mit möglichst wenig syntaktischer Festlegung. Die möglichen appositionellen beziehungsweise possessiven Deutungen werden in der Fußnote offengelegt, nicht stillschweigend entschieden.
- issue: Zeitwert von οὐκ ἔστιν im prophetischen Zusammenhang
  choice: wird es … nicht geben
  alternative: es gibt … kein
  rationale: Obwohl ἔστιν formal Präsens ist, beschreibt der Kontext die kommende Zeit des Königs. Das Futur macht diesen zeitlichen Rahmen im Deutschen verständlich; die formal präsentische Wiedergabe bleibt als Fußnotenalternative erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht biblischem Ton. Die Satzstruktur bleibt eng am griechischen Ausgangstext, während „unter ihnen“ und „kein Unrecht geben“ natürliches heutiges Deutsch bieten.
