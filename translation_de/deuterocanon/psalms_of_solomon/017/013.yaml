  yaml_path: translation/deuterocanon/psalms_of_solomon/017/013.yaml
  text: The lawless one laid waste our land, emptying it of its inhabitants; they wiped out young and old, and their children together.
translation:
  language: de
  text: Der Gesetzlose verwüstete unser Land und entvölkerte es; sie vernichteten[a] Jung und Alt sowie ihre Kinder allesamt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Griechischen wechselt der Text vom Singular („der Gesetzlose“) zu einem Verb im Plural („sie vernichteten“). Die Übersetzung bewahrt diesen Wechsel, statt ihn auszugleichen.
    reason: textual_variant
lexical_decisions:
- source_word: ἠρήμωσεν
  choice: verwüstete
  rationale: Gibt die gewaltsame Verödung des Landes prägnant und in natürlichem Deutsch wieder.
- source_word: ὁ ἄνομος
  choice: der Gesetzlose
  rationale: Bewahrt den substantivierten Singular mit Artikel und bildet den Bezug zur Gesetzlosigkeit genauer ab als das allgemeinere „der Böse“.
- source_word: ἀπὸ ἐνοικούντων αὐτήν
  choice: und entvölkerte es
  rationale: 'Die knappe deutsche Formulierung gibt das Ergebnis der ungewöhnlichen griechischen Verbindung wieder: Das Land wird seiner Bewohner beraubt.'
- source_word: ἠφάνισαν
  choice: vernichteten
  rationale: Drückt die Auslöschung der Menschen in einem würdigen, klaren Register aus, ohne die Aussage abzuschwächen.
- source_word: νέον καὶ πρεσβύτην
  choice: Jung und Alt
  rationale: Die geläufige deutsche Paarformel bewahrt den Merismus der beiden Altersgruppen.
- source_word: τέκνα αὐτῶν ἅμα
  choice: und zugleich ihre Kinder
  rationale: „Zugleich“ wahrt die ausdrückliche Kraft von ἅμα und schließt die Kinder in die gemeinsame Vernichtung ein.
theological_decisions:
- issue: Numeruswechsel zwischen dem einzelnen Gesetzlosen und dem pluralischen Täterverb
  choice: Der Wechsel vom Singular „Der Gesetzlose“ zum Plural „sie vernichteten“ wird bewahrt.
  alternative: 'Den Plural an den Singular angleichen: „er vernichtete“.'
  rationale: Der griechische Text wechselt unvermittelt von ὁ ἄνομος mit singularischem Verb zu ἠφάνισαν im Plural. Eine Angleichung würde die echte Spannung des Wortlauts beseitigen und möglicherweise Gefolgsleute oder Truppen des Gesetzlosen stillschweigend ausblenden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Verwüstete“ und „vernichteten“ halten den ernsten poetisch-historischen Ton; „Jung und Alt“ ist natürlich und zugleich angemessen gehoben.
