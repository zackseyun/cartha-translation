  text: For he will subdue the earth forever with the word of his mouth[c][b][a],
translation:
  language: de
  text: Denn er wird die Erde[a] durch das Wort seines Mundes für immer zerschmettern.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „das Land“.
    reason: lexical_alternative
  - marker: b
    text: Die Zeile erinnert wahrscheinlich an Jesaja 11,4, wo der ideale Herrscher durch das Wort seines Mundes richtet und die Erde schlägt.
    reason: cross_reference
  - marker: c
    text: Der gedruckte griechische Text hat κατάξει, „wird zerschmettern“. Häufig wird in Anlehnung an Jesaja 11,4 die Lesart πατάξει, „wird schlagen“, vermutet.
    reason: textual_note
lexical_decisions:
- source_word: κατάξει
  choice: wird zerschmettern
  rationale: Der in Swetes gedrucktem Text stehende Futur κατάξει ist als Form von κατάγνυμι zu verstehen und bezeichnet ein Zerbrechen oder Zerschmettern. Die Wiedergabe folgt dem vorgegebenen griechischen Text, statt stillschweigend die häufig vermutete Lesart πατάξει („wird schlagen“) einzusetzen.
- source_word: γῆν
  choice: die Erde
  rationale: γῆ kann sowohl „Erde“ als auch „Land“ bedeuten. „Erde“ entspricht hier am ehesten der umfassenden königlichen Gerichtsaussage; die örtlich begrenztere Bedeutung „Land“ bleibt in einer Fußnote erhalten.
- source_word: τῷ λόγῳ τοῦ στόματος αὐτοῦ
  choice: durch das Wort seines Mundes
  rationale: Die bildkräftige Wendung wird eng am Griechischen wiedergegeben. „Durch“ bezeichnet das Wort als Mittel seines machtvollen Handelns, ohne die Aussage zu einer bloßen Anordnung abzuschwächen.
- source_word: εἰς αἰῶνα
  choice: für immer
  rationale: Die geläufige deutsche Wendung gibt die zeitlich unbegrenzte beziehungsweise dauerhafte Bedeutung natürlich und feierlich wieder.
theological_decisions:
- issue: 'Möglicher Bezug auf Jesaja 11,4: Gericht des messianischen Königs durch sein gesprochenes Wort'
  choice: Das unmittelbare Bild vom Zerschmettern der Erde durch das Wort seines Mundes bleibt im Haupttext erhalten.
  alternative: Die Aussage dynamisch als „Er wird die Erde durch seinen Befehl unterwerfen“ wiederzugeben.
  rationale: Der griechische Wortlaut verbindet gewaltsam-gerichtliches Handeln mit der Wirksamkeit des gesprochenen Wortes. Eine Umschreibung als bloßes Herrschen oder Befehlen würde diese Spannung abschwächen.
- issue: Gedruckter Wortlaut κατάξει gegenüber der vermuteten Angleichung πατάξει
  choice: Der gedruckte Ausgangstext wird mit „zerschmettern“ übersetzt; die mögliche andere Lesart wird nur in der Fußnote erläutert.
  alternative: Im Haupttext „schlagen“ zu schreiben und damit die häufig vermutete Lesart πατάξει vorauszusetzen.
  rationale: Die Übersetzung soll zunächst der validierten Swete-Ausgabe folgen und keine textkritische Emendation stillschweigend zum Haupttext machen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die bewusst starke Gerichtsmetapher bleibt erhalten; Satzbau und Wortwahl sind zugleich für heutige Leser unmittelbar verständlich.
