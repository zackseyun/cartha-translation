lexical_decisions:
- source_word: ἐν τῷ ἐπαναστῆναι
  choice: als sich … erhob
  rationale: Die Verbindung von ἐν mit dem substantivierten Infinitiv ist hier temporal. „Als sich … erhob“ gibt diese Funktion und den verbalen Gehalt in natürlichem Deutsch wieder.
- source_word: αὐτοῖς
  choice: gegen sie
  rationale: Beim Verb ἐπανίστημι bezeichnet der Dativ gewöhnlich die Partei, gegen die sich jemand erhebt.
- source_word: ἄνθρωπον
  choice: ein Mann
  rationale: Das griechische Substantiv steht im Singular und bezeichnet im Kontext ausdrücklich einen Mann.
- source_word: ἀλλότριον
  choice: fremd
  rationale: „Fremd“ gibt die hier gemeinte Nichtzugehörigkeit idiomatisch wieder, ohne die unerwünschten modernen Nebenbedeutungen von „ausländisch“ aufzudrängen.
- source_word: γένους ἡμῶν
  choice: unserem Volk
  rationale: γένος bezeichnet hier die gemeinsame Abstammungs- und Volkszugehörigkeit. „Unser Volk“ ist im modernen Deutschen verständlich und vermeidet die missverständlichen modernen Konnotationen von „Rasse“.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung bewahrt den zeitlichen Nebensatz und die Opposition gegen „sie“; „Volk“ vermittelt die kollektive Zugehörigkeit, während die Fußnote die engere formale Entsprechung zu γένος nennt.
