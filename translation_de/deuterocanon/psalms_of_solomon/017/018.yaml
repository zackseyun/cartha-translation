  source_fidelity: 'Die Grundbedeutung ist weitgehend getroffen: συναγωγαὶ ὁσίων ist angemessen als „Versammlungen der Frommen“ wiedergegeben, und das Sperlingsbild bleibt erhalten. „vor ihnen flohen“ legt jedoch stärker ein Fliehen vor Personen bzw. Verfolgern nahe. ἀπʼ αὐτῶν bezeichnet lediglich die Bewegung weg von ihnen; der im Einzelvers offene Bezug sollte ohne diese Nuance bewahrt werden. κοίτη meint einen Lager- bzw. Schlafplatz, nicht spezifisch ein Nest.'
  naturalness: Die Fassung ist verständlich und würdig. „Diejenigen, die“ wirkt etwas schwerfällig; „Die, die“ ist im modernen Standarddeutsch natürlicher. „von ihrem Lager davonfliegen“ gibt das Bild knapp und idiomatisch wieder.
  terminology: „Fromme“ ist für ὅσιοι eine gute nichttechnische Wiedergabe. „Versammlungen“ vermeidet zutreffend eine unangebrachte Institutionalisierung als „Synagogen“. „Lager“ bildet κοίτη genauer ab als das etwas abstrahierende „Ruheplatz“ und wahrt gegenüber dem englischen audit trail („nest“) die geringere Spezifizierung des Griechischen.
