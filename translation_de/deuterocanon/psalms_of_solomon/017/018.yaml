  text: Those who loved the assemblies of the holy ones fled from them; like sparrows they flew away from their nest.
translation:
  language: de
  text: Die, die die Versammlungen der Frommen liebten, flohen von ihnen fort; wie Sperlinge flogen sie von ihrem Lager davon.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συναγωγὰς
  choice: Versammlungen
  rationale: Das griechische Wort bezeichnet hier Zusammenkünfte beziehungsweise versammelte Gemeinschaften; die Wiedergabe vermeidet die im Deutschen enger institutionell oder baulich verstandene Bezeichnung „Synagogen“.
- source_word: ὁσίων
  choice: der Frommen
  rationale: ὅσιος bezeichnet Menschen als fromm, gottesfürchtig oder Gott ergeben. „Fromme“ gibt diesen ethisch-religiösen Sinn wieder, ohne vorschnell einen technischen Heiligenbegriff einzutragen.
- source_word: κοίτης
  choice: Ruheplatz
  rationale: κοίτη bedeutet Lager, Schlaf- oder Ruheplatz. Im Sperlingsvergleich ist „Ruheplatz“ natürlich und bewahrt zugleich das allgemeinere Bild des griechischen Ausdrucks besser als das spezifischere „Nest“.
- source_word: ἐξεπετάσθησαν
  choice: flogen … davon
  rationale: Das Verb beschreibt das Weg- oder Auffliegen und wird im Deutschen passend zum Vergleich mit Sperlingen idiomatisch wiedergegeben.
theological_decisions:
- issue: Bezeichnung der ὅσιοι
  choice: die Frommen
  alternative: die Heiligen
  rationale: „Die Frommen“ hält den Akzent auf Gottesfurcht und Ergebenheit offen; „die Heiligen“ könnte im modernen kirchlichen Sprachgebrauch stärker als feststehende heilsgeschichtliche oder konfessionelle Kategorie verstanden werden.
- issue: Unbestimmter Bezug von ἀπ’ αὐτῶν
  choice: vor ihnen
  alternative: von ihnen fort
  rationale: Das Pronomen bleibt wie im griechischen Einzelvers ohne ausdrücklich benannten Bezug. Die Übersetzung ergänzt daher keinen möglichen Verfolger oder Gegner.
translation_notes:
  register: Moderne, würdige Standardsprache mit überschaubarem Satzbau. Die Wiederholung „die die“ ist grammatisch korrekt und hält die substantivierte Partizipialkonstruktion nah am Griechischen. Das Sperlingsbild bleibt erhalten; „Ruheplatz“ vermeidet die gegenüber κοίτη engere Festlegung auf ein Nest.
