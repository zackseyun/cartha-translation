  - severity: low
    issue: „Ruheplatz“ für κοίτης
    rationale: Die Wiedergabe ist möglich, aber „Lager“ entspricht der Grundbedeutung von κοίτη als Schlaf- oder Liegeplatz unmittelbarer und hält das Vogelbild konkret, ohne „Nest“ einzutragen.
