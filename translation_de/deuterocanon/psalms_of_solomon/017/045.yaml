  yaml_path: translation/deuterocanon/psalms_of_solomon/017/045.yaml
  text: Shepherding the Lord’s flock in faithfulness and righteousness[d][c][b][a], he will not allow any among them to grow weak in their pasture.
translation:
  language: de
  text: Er wird die Herde des Herrn in Treue[a] und Gerechtigkeit[b] hüten und nicht zulassen, dass einer unter ihnen auf ihrer Weide schwach wird.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „im Glauben“. Das griechische Wort kann sowohl Glaube als auch Treue bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Auch im Sinn von „Recht“ oder „gerechtem Handeln“.
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlicher beginnt der Satz mit einem Partizip: „Die Herde des Herrn in Treue und Gerechtigkeit hütend, wird er nicht zulassen …“'
    reason: source_syntax
lexical_decisions:
- source_word: ποιμαίνων
  choice: Er wird … hüten
  rationale: Das Verb führt das Bild vom Herrn als Eigentümer einer Herde fort und bezeichnet sowohl Fürsorge als auch Leitung. Die finite Zukunftsform gibt im Deutschen die Verbindung des Partizips mit dem folgenden Futur natürlich und im prophetischen Zusammenhang angemessen wieder.
- source_word: τὸ ποίμνιον Κυρίου
  choice: die Herde des Herrn
  rationale: ποίμνιον bezeichnet die Herde als Gemeinschaft; der Genitiv Κυρίου drückt ihre Zugehörigkeit zum Herrn aus.
- source_word: ἐν πίστει
  choice: in Treue
  rationale: Im Zusammenhang beschreibt πίστις am ehesten die verlässliche Haltung, in der der Herrscher die Herde hütet. Die ebenfalls mögliche Bedeutung „Glaube“ bleibt in einer Fußnote erhalten.
- source_word: δικαιοσύνῃ
  choice: Gerechtigkeit
  rationale: Der Ausdruck bezeichnet die sittlich rechte und gerechte Ausübung seiner Hirtenherrschaft; „Gerechtigkeit“ bewahrt die Breite des griechischen Begriffs.
- source_word: οὐκ ἀφήσει ἀσθενῆσαι
  choice: wird nicht zulassen, dass … schwach wird
  rationale: ἀφίημι mit Infinitiv hat hier permissiven Sinn; der Aoristinfinitiv bezeichnet das Eintreten von Schwäche.
- source_word: ἐν αὐτοῖς
  choice: einer unter ihnen
  rationale: 'Bei einer Mehrzahl von Personen wird die Wendung idiomatisch distributiv verstanden: Niemand innerhalb der Herde soll schwach werden.'
- source_word: ἐν τῇ νομῇ αὐτῶν
  choice: auf ihrer Weide
  rationale: νομή bezeichnet Weide oder Weideland und führt das Hirtenbild konsequent weiter.
theological_decisions:
- issue: Zeitform und Verhältnis von ποιμαίνων zu καὶ οὐκ ἀφήσει
  choice: 'Beide Handlungen werden als koordinierte zukünftige Aussagen wiedergegeben: „Er wird … hüten und nicht zulassen“'
  alternative: „Die Herde … hütend, wird er nicht zulassen“
  rationale: Formal ist ποιμαίνων ein Präsenspartizip, doch es ist durch καί mit dem finiten Futur ἀφήσει verbunden und steht in einem prophetischen Zusammenhang. Die koordinierte Zukunftsform ist im Deutschen natürlicher, ohne die zwei zusammengehörigen Handlungen voneinander zu lösen; die formale Konstruktion wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das durchgehende Hirtenbild wird mit „Herde“, „hüten“ und „Weide“ bewahrt. Die Satzstruktur ist für heutige Leser geglättet, während die griechische Partizipialkonstruktion in einer Fußnote transparent bleibt.
