- from: Und er selbst wird rein von Sünde sein[a], um über große Völker zu herrschen, Herrscher zurechtzuweisen und Sünder durch die Kraft seines Wortes zu beseitigen[b].
  to: Und er selbst wird rein von Sünde sein[a], um über große Völker zu herrschen, Herrscher zurechtzuweisen und Sünder durch die Kraft seines Wortes zu entfernen[b].
  rationale: Die einzige Änderung ersetzt „beseitigen“ durch das semantisch weitere „entfernen“. Dadurch bleibt die Art des in ἐξᾶραι bezeichneten Handelns offen, während die mögliche engere Deutung „vertreiben“ weiterhin als Fußnote zugänglich ist. Alle übrigen Formulierungen können unverändert bleiben.
