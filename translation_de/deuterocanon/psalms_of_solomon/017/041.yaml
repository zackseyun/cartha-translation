    reason: lexical_alternative
lexical_decisions:
- source_word: καθαρὸς ἀπὸ ἁμαρτίας
  choice: rein von Sünde
  rationale: Die Wendung bezeichnet moralische Reinheit. „Rein von Sünde“ bewahrt das Reinheitsbild von καθαρός genauer als eine bloße Umschreibung mit „frei“ und klingt im Deutschen würdig und verständlich.
- source_word: ἄρχειν λαοὺς μεγάλους
  choice: über große Völker zu herrschen
  rationale: ἄρχειν bezeichnet die Ausübung von Herrschaft; λαούς bleibt als „Völker“ erhalten, und μεγάλους wird unmittelbar mit „große“ wiedergegeben.
- source_word: ἐλέγξαι ἄρχοντας
  choice: Herrscher zurechtzuweisen
  rationale: ἐλέγξαι meint hier eine autoritative Rüge oder Überführung. „Zurechtzuweisen“ wahrt diese gerichtliche Schärfe, ohne den Sinn auf bloßes Tadeln oder vollständiges Überführen festzulegen.
- source_word: ἐξᾶραι ἁμαρτωλοὺς
  choice: Sünder zu beseitigen
  rationale: ἐξᾶραι bezeichnet das Entfernen oder Wegschaffen. „Beseitigen“ gibt die kräftige, aber hinsichtlich der konkreten Art der Entfernung offene Aussage wieder; „vertreiben“ bleibt als mögliche engere Deutung in der Fußnote.
- source_word: ἐν ἰσχύϊ λόγου
  choice: durch die Kraft seines Wortes
  rationale: Die griechische Wendung bezeichnet wirksame Macht, die durch das Wort beziehungsweise die Rede ausgeübt wird. Das Possessivpronomen ist im Deutschen idiomatisch und bezieht das Wort auf das handelnde Subjekt.
theological_decisions:
- issue: Zeitbezug der verblosen Aussage über die Reinheit der Gestalt
  choice: wird rein von Sünde sein
  alternative: ist rein von Sünde
  rationale: Im Griechischen fehlt in καὶ αὐτὸς καθαρὸς ἀπὸ ἁμαρτίας eine ausdrückliche Kopula. Der Zukunftsbezug passt zum prophetisch-messianischen Zusammenhang, doch die präsentische Wiedergabe bleibt grammatisch möglich und wird deshalb in einer Fußnote genannt.
- issue: Aussage über die moralische Reinheit der messianischen Gestalt
  choice: rein von Sünde
  alternative: ohne Sünde / frei von Sünde
  rationale: Die Übersetzung lässt die starke Aussage des Textes stehen und bewahrt zugleich das konkrete Reinheitsbild von καθαρός, ohne daraus eine weitergehende dogmatische Formulierung abzuleiten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau folgt der zielgerichteten Folge der griechischen Infinitive, ohne unnötige Archaismen. „Große Völker“ und „rein von Sünde“ bewahren bewusst die Bild- und Begriffswahl des Ausgangstextes.
