  text: And he himself will be pure from sin[a], to rule great peoples, to rebuke rulers[c][b], and to remove sinners by the strength of his word.
translation:
  language: de
  text: Und er selbst wird rein von Sünde sein[a], um über große Völker zu herrschen, Herrscher zurechtzuweisen und Sünder durch die Kraft seines Wortes zu entfernen[b].
  philosophy: optimal-equivalence
  footnotes:
