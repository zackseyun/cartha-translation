base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/017/029.yaml
  text: And he will not allow unrighteousness to remain among them any longer[a], and no one who knows wickedness will dwell with them.
translation:
  language: de
  text: Und er wird nicht zulassen, dass Unrecht noch länger unter ihnen bleibt[a]; und kein Mensch, der Bosheit kennt, wird mit ihnen wohnen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Wortlaut ist an dieser Stelle im Bereich von „unter ihnen“ textlich und grammatisch schwierig. Der Gesamtsinn ist jedoch erkennbar: Unrecht soll in der Gemeinschaft nicht länger fortbestehen.'
    reason: textual_variant
lexical_decisions:
- source_word: ἀφήσει
  choice: wird nicht zulassen
  rationale: In Verbindung mit dem Infinitiv μεῖναι bezeichnet ἀφίημι hier das Gewährenlassen; die Verneinung drückt aus, dass er den Fortbestand nicht dulden wird.
- source_word: ἀδικίαν
  choice: Unrecht
  rationale: ἀδικία kann Ungerechtigkeit, Unrecht oder moralische Verfehlung bezeichnen. „Unrecht“ wahrt die moralische und gemeinschaftliche Weite des Begriffs und klingt im heutigen Deutsch natürlich.
- source_word: ἔτι
  choice: noch länger
  rationale: Beim verneinten Futur kennzeichnet ἔτι das Ende eines bisherigen Zustands.
- source_word: μεῖναι
  choice: bleibt
  rationale: „Bleiben“ gibt den Sinn des Aoristinfinitivs idiomatisch in dem deutschen dass-Satz wieder.
- source_word: ἐν αὐτῶν
  choice: unter ihnen
  rationale: Die überlieferte Formulierung ist grammatisch gestört; „unter ihnen“ gibt den erkennbaren gemeinschaftlichen Bezug wieder, ohne eine innerliche Bedeutung einzutragen.
- source_word: κατοικήσει
  choice: wird … wohnen
  rationale: κατοικέω bezeichnet dauerhaftes Wohnen oder Ansässigsein und passt zum Bild der gereinigten Gemeinschaft.
- source_word: ἄνθρωπος
  choice: kein Mensch
  rationale: ἄνθρωπος ist hier generisch gebraucht. „Kein Mensch“ wahrt die ausdrückliche Personenbezeichnung und ist nicht auf Männer beschränkt.
- source_word: εἰδὼς κακίαν
  choice: der Bosheit kennt
  rationale: 'Die knappe Formulierung erhält die Mehrdeutigkeit von γινώσκω/οἶδα-nahem „Kennen“: Gemeint ist mehr als bloßes Wissen, doch der Grad persönlicher Verstrickung wird nicht ausgedeutet.'
- source_word: κακίαν
  choice: Bosheit
  rationale: κακία bezeichnet hier allgemein moralisch Böses; „Bosheit“ bewahrt den feierlich-moralischen Ton und vermeidet eine Verengung auf bloße Gehässigkeit.
theological_decisions:
- issue: Ausschluss des Unrechts aus der wiederhergestellten Gemeinschaft
  choice: Der Vers schließt sowohl das Unrecht als auch den Menschen, der Bosheit kennt, vom dauerhaften Leben in der Gemeinschaft aus.
  alternative: ἀδικία könnte forensischer mit „Ungerechtigkeit“ wiedergegeben und εἰδὼς κακίαν stärker deutend als „wer mit dem Bösen vertraut ist“ übersetzt werden.
  rationale: Die Fassung hält die gemeinschaftliche Reinigung unter gerechter Herrschaft fest, ohne spätere Lehrbegriffe einzutragen oder das „Kennen“ der Bosheit psychologisch beziehungsweise dogmatisch näher zu bestimmen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit psalmischem Ton. Der Semikolon trennt die abstrakte Beseitigung des Unrechts von der Aussage über Personen, die Bosheit kennen. Die ungewöhnlich knappe Wendung „Bosheit kennt“ bleibt bewusst nahe am Griechischen und wahrt dessen Spannung.
