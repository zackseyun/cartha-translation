  text: And what is the span of a man's life on the earth? According to his span[b][a], so also is his hope upon him.
translation:
  language: de
  text: Und wie lang ist die Lebenszeit eines Menschen auf der Erde? Seiner Lebenszeit entsprechend richtet sich auch seine Hoffnung auf ihn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Seiner Lebenszeit entsprechend richtet sich auch seine Hoffnung auf sie.“ Das griechische Pronomen kann sich auf den Menschen oder auf seine Lebenszeit beziehen.'
    reason: alternative_reading
lexical_decisions:
- source_word: χρόνος ζωῆς ἀνθρώπου
  choice: die Lebenszeit eines Menschen
  rationale: χρόνος bezeichnet hier die begrenzte Dauer des menschlichen Lebens. „Lebenszeit“ gibt die Genitivverbindung knapp und idiomatisch wieder.
- source_word: ἐπὶ τῆς γῆς
  choice: auf der Erde
  rationale: Die Wendung ist örtlich gebraucht und wird im modernen Standarddeutsch natürlich wiedergegeben.
- source_word: κατὰ τὸν χρόνον αὐτοῦ
  choice: seiner Lebenszeit entsprechend
  rationale: κατά bezeichnet eine Entsprechung beziehungsweise ein Verhältnis. Die Formulierung bewahrt diesen Vergleich, statt ihn lediglich als zeitliches „solange“ auszudrücken.
- source_word: ἡ ἐλπὶς αὐτοῦ ἐπʼ αὐτόν
  choice: die Hoffnung, die auf ihn gesetzt wird
  rationale: Im Zusammenhang liegt nahe, dass die Hoffnung auf den Menschen gerichtet ist und ebenso begrenzt ist wie seine Lebenszeit. Die deutsche Passivform macht diesen Sinn verständlich, ohne eine unnatürliche Pronomenfolge zu erzeugen.
theological_decisions:
- issue: Bezugswort von ἐπʼ αὐτόν
  choice: 'Das Pronomen bezieht sich im Haupttext auf den Menschen: Hoffnung wird auf ihn gesetzt.'
  alternative: 'Das Pronomen kann grammatisch auf χρόνος, also die Lebenszeit, zurückbezogen werden: Die Hoffnung ruht auf ihr.'
  rationale: Der Bezug auf den Menschen passt zum proportionalen Vergleich und zum anschließenden Gegensatz zwischen Hoffnung auf einen Menschen und Hoffnung auf Gott. Da χρόνος ebenfalls maskulin ist, bleibt die grammatisch mögliche Alternative in einer Fußnote erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die einleitende Frage wird mit „wie lang“ idiomatisch formuliert; der zweite Satz bewahrt den Gedanken einer proportionalen Entsprechung. Die echte Mehrdeutigkeit des griechischen Pronomenbezugs wird nicht beseitigt, sondern in der Fußnote dokumentiert.
