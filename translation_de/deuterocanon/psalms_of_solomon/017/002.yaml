revisions:
- from: Und wie lang ist die Lebenszeit eines Menschen auf der Erde? Seiner Lebenszeit entsprechend ist auch die Hoffnung, die auf ihn gesetzt wird.[a]
  to: Und wie lang ist die Lebenszeit eines Menschen auf der Erde? Seiner Lebenszeit entsprechend richtet sich auch seine Hoffnung auf ihn.[a]
  rationale: Die Revision ersetzt die interpretierende Passivkonstruktion durch „seine Hoffnung“ und bewahrt damit αὐτοῦ. Der im englischen Audit-Trail bevorzugte Bezug des abschließenden Pronomens auf den Menschen bleibt im Haupttext erhalten. Die grammatisch mögliche Rückbeziehung auf χρόνος/Lebenszeit wird weiterhin ausdrücklich in der Fußnote dokumentiert.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T17:54:20Z'
review_pass:
  verdict: revise
  source_fidelity: 'Der erste Satz gibt χρόνος ζωῆς ἀνθρώπου und ἐπὶ τῆς γῆς treffend wieder. Im zweiten Satz bewahrt „seiner Lebenszeit entsprechend“ die proportionale Aussage von κατὰ τὸν χρόνον αὐτοῦ. Die Umschreibung „die Hoffnung, die auf ihn gesetzt wird“ verändert jedoch ἡ ἐλπὶς αὐτοῦ: Das ausdrückliche Possessivpronomen („seine Hoffnung“) wird zu einer unpersönlichen, von anderen gesetzten Hoffnung. Der Haupttext sollte die possessive Form und die syntaktische Spannung des Griechischen beibehalten.'
  naturalness: „Wie lang ist die Lebenszeit eines Menschen auf der Erde?“ ist klares modernes Standarddeutsch. „Seiner Lebenszeit entsprechend richtet sich auch seine Hoffnung auf ihn“ ist etwas bewusst gespannt, aber verständlich und dem knappen, rhetorischen griechischen Satz angemessen. Es ist natürlicher und quellennäher als die Passivumschreibung.
  terminology: „Lebenszeit“, „Mensch“, „Erde“ und „Hoffnung“ sind passend. Der Bezug von ἐπʼ αὐτόν ist wegen des maskulinen χρόνου grammatisch nicht völlig eindeutig. Der Bezug auf den Menschen ist im Haupttext angemessen, entsprechend dem englischen Audit-Trail; die Alternative auf die Lebenszeit soll in der Fußnote verbleiben.
  issues:
  - severity: medium
    issue: Das Possessivum αὐτοῦ bei ἡ ἐλπὶς αὐτοῦ wird im Haupttext nicht abgebildet.
    rationale: „Die Hoffnung, die auf ihn gesetzt wird“ besagt eine auf den Menschen gesetzte Hoffnung, lässt aber offen, wessen Hoffnung es ist. Das Griechische sagt ausdrücklich „seine Hoffnung“; die Passivumschreibung verschiebt damit die Aussage.
  - severity: low
    issue: Die Fußnote bezeichnet die Alternative zu stark als bloßes Ruhen der Hoffnung auf der Lebenszeit.
    rationale: Die Fußnote sollte den möglichen Bezug des Schlusspronomens knapp benennen, ohne die syntaktisch dichte Aussage weiter zu interpretieren.
