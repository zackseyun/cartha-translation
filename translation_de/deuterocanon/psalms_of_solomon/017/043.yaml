lexical_decisions:
- source_word: εὐλογία
  choice: Segen
  rationale: Das Substantiv bezeichnet hier unmittelbar den Segen; „Segen“ ist die klare und natürliche deutsche Entsprechung.
- source_word: Κυρίου
  choice: des Herrn
  rationale: Der Genitiv bezeichnet den Urheber beziehungsweise Ursprung des Segens; „des Herrn“ gibt Form und Sinn knapp wieder.
- source_word: μετʼ αὐτοῦ
  choice: mit ihm
  rationale: μετά mit dem Genitiv bedeutet gewöhnlich „mit“. Die Wiedergabe bewahrt den relationalen Sinn, ohne ihn deutend zu erweitern.
- source_word: ἐν ἰσχύϊ
  choice: in Kraft
  rationale: ἰσχύς bezeichnet Kraft, Stärke oder Macht. „In Kraft“ folgt der griechischen Präpositionalfügung eng und lässt ihre genaue Beziehung bewusst offen.
- source_word: '[implied copula]'
  choice: ist
  rationale: Im Griechischen fehlt die Kopula; für einen vollständigen und natürlichen deutschen Satz wird „ist“ ergänzt.
