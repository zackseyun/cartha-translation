  text: They laid waste the throne of David in arrogant usurpation[a]. But you, O God, will cast them down and remove their offspring from the earth[b],
translation:
  language: de
  text: Sie verwüsteten den Thron Davids in hochmütiger Usurpation[a]. Doch du, Gott, wirst sie stürzen und ihre Nachkommen von der Erde entfernen[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „im Hochmut des Austauschs/der Ersetzung“. Der griechische Ausdruck ist stark verdichtet; „Usurpation“ gibt seinen wahrscheinlich politischen Sinn wieder.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „aus dem Land“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠρήμωσαν
  choice: verwüsteten
  rationale: Das Verb bezeichnet ein Veröden- oder Verwüstetmachen. „Verwüsteten“ bewahrt die Stärke des Ausdrucks und klingt im Deutschen natürlich.
- source_word: τὸν θρόνον Δαυίδ
  choice: den Thron Davids
  rationale: Die formnahe Wiedergabe erhält den königlichen und dynastischen Bezug.
- source_word: ἐν ὑπερηφανίᾳ ἀλλάγματος
  choice: in hochmütiger Anmaßung
  rationale: ὑπερηφανία bezeichnet Hochmut; ἀλλάγμα kann Wechsel, Austausch oder Ersetzung meinen. Im politischen Zusammenhang bringt „Anmaßung“ die wahrscheinlich gemeinte widerrechtliche Verdrängung zum Ausdruck, ohne die schwerfällige griechische Genitivverbindung nachzuahmen.
- source_word: καταβαλεῖς
  choice: wirst sie stürzen
  rationale: Das Futur bezeichnet ein entschiedenes Niederwerfen oder Zu-Fall-Bringen. „Stürzen“ passt zum politischen Kontext und wahrt den feierlichen Ton.
- source_word: ἀρεῖς
  choice: wirst ... tilgen
  rationale: αἴρω bedeutet hier wegnehmen oder beseitigen. In Verbindung mit Nachkommenschaft und „von der Erde“ gibt „tilgen“ das umfassende Gericht prägnant wieder, ohne dessen genaue Vollzugsweise näher festzulegen.
- source_word: σπέρμα αὐτῶν
  choice: ihre Nachkommen
  rationale: Das wörtliche „ihr Same“ wäre im heutigen Deutsch missverständlich. „Nachkommen“ gibt den generationenbezogenen Sinn klar wieder.
- source_word: ἀπὸ τῆς γῆς
  choice: von der Erde
  rationale: γῆ kann „Erde“ oder „Land“ bedeuten. „Erde“ wahrt hier den möglichen umfassenden Sinn; die engere Alternative wird in einer Fußnote genannt.
theological_decisions:
- issue: Zeitstufe der göttlichen Gerichtsverben καταβαλεῖς und ἀρεῖς
  choice: 'Futur: „wirst ... stürzen und ... tilgen“'
  alternative: 'Vergangenheit: „stürztest ... und tilgtest“'
  rationale: Beide griechischen Formen sind morphologisch eindeutig Futur. Auch wenn der weitere Zusammenhang einen Rückblick auf geschichtliches Gericht nahelegen kann, sollte die Übersetzung die im überlieferten griechischen Text stehende Zukunftsform nicht stillschweigend in die Vergangenheit umdeuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Anrede „du, Gott“ bewahrt die direkte Gebetssprache; „Thron Davids“ und „tilgen“ erhalten den feierlich-dynastischen Ton. Das abschließende Komma folgt dem vorgelegten Verssegment, dessen Satz im folgenden Vers weiterläuft.
