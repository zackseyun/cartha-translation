  text: gesetzlose Völker durch das Wort seines Mundes zu vernichten, Völker durch seine Drohung vor ihm fliehen zu lassen und Sünder durch das Wort ihres Herzens[a] zu überführen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Wendung ist knapp und mehrdeutig. Sie kann auch bedeuten: „Sünder durch das Reden ihres Herzens aufzudecken“ oder „zurechtzuweisen“. Gemeint sein könnte, dass ihr eigenes inneres Reden oder ihre Absicht sie überführt.'
