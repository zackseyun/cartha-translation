lexical_decisions:
- source_word: ὀλοθρεῦσαι
  choice: zu vernichten
  rationale: Das Verb bezeichnet eine gewaltsame, vollständige Beseitigung. „Vernichten“ bewahrt seine Stärke, ohne über den griechischen Ausdruck hinauszugehen.
- source_word: ἔθνη παράνομα
  choice: gesetzlose Völker
  rationale: „Völker“ gibt ἔθνη im politischen Gerichtskontext wieder; „gesetzlos“ erhält den Bezug von παράνομα auf Gesetz und Recht.
- source_word: ἐν λόγῳ στόματος αὐτοῦ
  choice: durch das Wort seines Mundes
  rationale: Die konkrete Rede-Metaphorik und der instrumentale Sinn von ἐν bleiben erhalten.
- source_word: ἐν ἀπειλῇ αὐτοῦ
  choice: durch seine Drohung
  rationale: Die Wendung bezeichnet das Mittel beziehungsweise den wirksamen Anlass der Flucht.
- source_word: φυγεῖν ἔθνη ἀπὸ προσώπου αὐτοῦ
  choice: Völker vor seinem Angesicht fliehen zu lassen
  rationale: Die Formulierung gibt die durch seine Drohung bewirkte Flucht natürlich wieder und bewahrt mit „vor seinem Angesicht“ das anschauliche Bild des Griechischen.
- source_word: ἐλέγξαι
  choice: zu überführen
  rationale: ἐλέγχω kann aufdecken, zurechtweisen oder der Schuld überführen. „Überführen“ passt zum gerichtlichen Zusammenhang, ohne den Sinn auf bloße Vernichtung oder Bestrafung zu verengen.
- source_word: ἐν λόγῳ καρδίας αὐτῶν
  choice: durch das Wort ihres Herzens
  rationale: Die auffällig verdichtete Formulierung sowie der griechische Singular καρδίας bei einem pluralischen Bezug bleiben erhalten.
theological_decisions:
- issue: Gericht des messianischen Herrschers durch Rede
  choice: Das Gericht wird als durch sein Wort und seine Drohung wirksam dargestellt.
  alternative: Wort und Drohung lediglich als allgemeine Sinnbilder königlicher Macht zu deuten.
  rationale: Der griechische Text hebt ausdrücklich Wort, Mund und Drohung hervor, erklärt aber die Wirkungsweise nicht näher.
- issue: Überführung der Sünder durch das Wort ihres Herzens
  choice: Die ungewöhnliche Wendung wird eng am Wortlaut bewahrt.
  alternative: Explizit zu formulieren, dass die Sünder durch ihre eigenen Gedanken, Absichten oder inneren Aussagen entlarvt werden.
  rationale: Der Text lässt offen, ob das innere Reden, die Absicht oder eine aus dem Herzen kommende Äußerung gemeint ist; diese Spannung soll nicht stillschweigend aufgelöst werden.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit bewusst biblischer Bildhaftigkeit in „Wort seines Mundes“ und „vor seinem Angesicht“. Die Infinitivkette des Ausgangstextes bleibt erhalten; ungewohnte, aber bedeutsame Verdichtung wird nicht paraphrasierend aufgelöst.
