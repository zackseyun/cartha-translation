  yaml_path: translation/deuterocanon/psalms_of_solomon/017/019.yaml
  text: They wandered in wildernesses[a], that their lives might be saved from evil, and in the eyes of the sojourning community[d][c][b], a life saved from among them was precious.
translation:
  language: de
  text: Sie zogen in Einöden umher[a], damit ihr Leben[b] vor dem Bösen[c] gerettet würde. In den Augen der Gemeinschaft in der Fremde[d] war ein aus ihrer Mitte gerettetes Leben kostbar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »in Wüsten« beziehungsweise »an verlassenen Orten«.'
    reason: lexical_alternative
  - marker: b
    text: Das griechische Wort ψυχή kann »Leben« oder »Seele« bedeuten; im Zusammenhang der Rettung aus Gefahr liegt hier »Leben« nahe. Dasselbe Wort steht auch im letzten Satzteil.
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »vor Unheil« beziehungsweise »vor Schaden«.'
    reason: lexical_alternative
  - marker: d
    text: 'Oder: »in den Augen der Fremde«, »des Exils« oder »der Diaspora«; das griechische παροικία kann das Leben fern der Heimat oder eine dort lebende Gemeinschaft bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπλανῶντο
  choice: sie zogen … um
  rationale: Im Zusammenhang mit Einöden bezeichnet das Verb ein tatsächliches Umherziehen, nicht eine geistliche oder moralische Verirrung.
- source_word: ἐν ἐρήμοις
  choice: in Einöden
  rationale: Der Plural bezeichnet mehrere unbewohnte oder öde Gegenden, ohne die Landschaft auf Sandwüsten zu beschränken.
- source_word: σωθῆναι
  choice: damit … gerettet würde
  rationale: Die passive Form und die Zweckbedeutung des Infinitivs bleiben erhalten; die Umherziehenden werden nicht ausdrücklich selbst zu den Rettern gemacht.
- source_word: ψυχὰς αὐτῶν / ψυχὴ σεσωμένη
  choice: ihr Leben / ein … gerettetes Leben
  rationale: ψυχή bezeichnet hier im Zusammenhang der Flucht und Rettung am ehesten das konkrete Leben; die Fußnote bewahrt die mögliche Wiedergabe mit „Seele“.
- source_word: ἀπὸ κακοῦ
  choice: vor dem Bösen
  rationale: Die Wiedergabe hält die moralische Bedeutung von κακόν offen; eine kontextuell ebenfalls mögliche Bedeutung „Unheil“ wird in der Fußnote genannt.
- source_word: τίμιον
  choice: kostbar
  rationale: Das Wort bezeichnet etwas Hochgeschätztes oder Wertvolles und passt zur Wertschätzung eines geretteten Lebens.
- source_word: παροικίας
  choice: der Gemeinschaft in der Fremde
  rationale: Die Formulierung gibt den gemeinschaftlichen und zugleich heimatfernen Sinn von παροικία in natürlichem Deutsch wieder.
- source_word: ἐξ αὐτῶν
  choice: aus ihrer Mitte
  rationale: Die Wendung bezeichnet am natürlichsten jemanden, der aus der zuvor genannten Gruppe heraus gerettet wurde.
theological_decisions:
- issue: Bedeutung von ψυχή an beiden Stellen
  choice: Leben
  alternative: Seele
  rationale: Der unmittelbare Zusammenhang handelt von Umherziehen angesichts einer Gefahr und damit von der Bewahrung des Lebens. „Leben“ vermeidet eine weitergehende anthropologische Festlegung.
- issue: Bezug und Bedeutung von παροικία
  choice: Gemeinschaft in der Fremde
  alternative: Fremde, Exil oder Diaspora
  rationale: Die gewählte Fassung lässt sowohl die Gemeinschaft als auch ihre Lebenslage außerhalb der Heimat erkennen, ohne sie konfessionell oder historisch enger festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzteilung verbessert die Verständlichkeit, ohne die Parallelität und den Gedankengang des griechischen Satzes aufzulösen. „Gemeinschaft in der Fremde“ vermeidet das heute missverständliche oder künstliche „Fremdlingsgemeinschaft“.
