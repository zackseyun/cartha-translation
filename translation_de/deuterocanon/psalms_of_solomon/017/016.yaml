  text: And everything that he did in Jerusalem was just as the nations do to their gods in their cities[a][b].
translation:
  language: de
  text: Und alles, was er in Jerusalem tat, war ebenso, wie es auch die Völker in ihren Städten mit ihren Göttern tun.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Vergleich ist elliptisch; sinngemäß kann auch ergänzt werden: »wie die Völker in ihren Städten mit ihren Göttern handeln«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »die Heiden« statt »die Völker«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα ὅσα
  choice: alles, was
  rationale: Die umfassende Relativkonstruktion wird im Deutschen natürlich und vollständig wiedergegeben.
- source_word: ἐποίησεν
  choice: tat
  rationale: Das allgemein gehaltene ποιέω bezeichnet hier Handlungen, ohne deren Art näher festzulegen; »tat« bewahrt diese Breite.
- source_word: ἐν Ἰερουσαλήμ
  choice: in Jerusalem
  rationale: Die Präpositionalphrase ist eindeutig örtlich.
- source_word: καθὼς καὶ
  choice: war so, wie
  rationale: Die griechische Vergleichskonstruktion ist elliptisch. Die Ergänzung »war so« macht den Vergleich im Deutschen verständlich, ohne seinen Inhalt weiter auszudeuten.
- source_word: τὰ ἔθνη
  choice: die Völker
  rationale: »Die Völker« entspricht dem griechischen Ausdruck wörtlich und passt zum allgemeinen Vergleich; »die Heiden« bleibt als kontextuell mögliche Alternative erhalten.
- source_word: ἐν ταῖς πόλεσι
  choice: in ihren Städten
  rationale: Das Possessivpronomen wird im Deutschen sinngemäß aus αὐτῶν und der parallelen Aussage ergänzt.
- source_word: τοὺς θεοὺς αὐτῶν
  choice: mit ihren Göttern
  rationale: Der Akkusativ hängt im elliptischen Vergleich sinngemäß von einem ergänzten Handlungsverb ab. »Götter« bewahrt die griechische Bezeichnung und ersetzt sie nicht deutend durch »Götzen«.
theological_decisions:
- issue: Bezug und Ergänzung des elliptischen Vergleichs
  choice: wie die Völker in ihren Städten mit ihren Göttern verfahren
  alternative: wie die Völker ihren Göttern in ihren Städten tun
  rationale: Im zweiten Vergleichsglied fehlt ein ausdrückliches Verb. »Mit ihren Göttern verfahren« ergibt idiomatisches Deutsch, bleibt aber als Ergänzung gekennzeichnet und löst die Ellipse nicht dogmatisch auf.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die sperrige griechische Ellipse wird für die Verständlichkeit maßvoll ergänzt; beide Fußnoten bewahren die sprachlichen Alternativen.
