  validation: swete_direct
base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/017/042.yaml
  text: And he will not grow weak in his days in his God[a], because God has made him powerful in the Holy Spirit, and wise in the counsel of understanding[c][b], with strength and righteousness.
translation:
  language: de
  text: Und er wird in seinen Tagen nicht schwach werden, im Vertrauen auf seinen Gott[a]; denn Gott hat ihn mächtig gemacht in heiligem Geist[b] und weise in verständigem Rat, mit Kraft und Gerechtigkeit[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „auf seinen Gott gestützt“; auch möglich: „bei seinem Gott“.'
    reason: Die Konstruktion ἐπί mit Dativ kann Grundlage, Abhängigkeit oder Nähe ausdrücken.
  - marker: b
    text: 'Oder: „im Heiligen Geist“ beziehungsweise „durch den Heiligen Geist“.'
    reason: Der artikellose griechische Ausdruck und die Präposition lassen qualitative, definite und instrumentale Nuancen zu.
  - marker: c
    text: 'Oder: „Rechtschaffenheit“.'
    reason: δικαιοσύνη kann sowohl Gerechtigkeit als auch persönliche Rechtschaffenheit bezeichnen.
lexical_decisions:
- source_word: ἀσθενήσει
  choice: wird … nicht schwach werden
  rationale: Die Wiedergabe bewahrt den zukünftigen Verlaufssinn des Verbs und bleibt näher am Griechischen als stärkere Formulierungen wie „wird nicht versagen“.
- source_word: ἐπὶ θεῷ αὐτοῦ
  choice: im Vertrauen auf seinen Gott
  rationale: ἐπί mit Dativ bezeichnet hier plausibel die Grundlage beziehungsweise das Sichstützen auf Gott. Die deutsche Formulierung gibt diesen Sinn natürlich wieder, ohne eine bloß räumliche Bedeutung vorzutäuschen.
- source_word: κατηργάσατο
  choice: hat … gemacht
  rationale: Das ungewöhnliche Verb bezeichnet im Zusammenhang Gottes wirksames Handeln am Herrscher. „Hat … gemacht“ ist klar, idiomatisch und wahrt die resultative Aussage.
- source_word: δυνατὸν
  choice: mächtig
  rationale: Das Adjektiv bezeichnet Kraft und Befähigung; „mächtig“ entspricht dem gehobenen, aber verständlichen Register des Verses.
- source_word: ἐν πνεύματι ἁγίῳ
  choice: in heiligem Geist
  rationale: Die artikellose Form und die Präposition lassen sowohl eine qualitative beziehungsweise sphärische als auch eine instrumentale oder definite Deutung zu. Die Haupttextfassung bewahrt diese Offenheit.
- source_word: σοφὸν ἐν βουλῇ συνέσεως
  choice: weise in verständigem Rat
  rationale: Die Genitivverbindung wird im Deutschen idiomatisch als Rat wiedergegeben, der von Einsicht geprägt ist; zugleich bleibt die enge Verbindung von Weisheit, Einsicht und Rat erhalten.
- source_word: ἰσχύος
  choice: Kraft
  rationale: „Kraft“ ist die direkte und im Satz natürliche Entsprechung und vermeidet eine unnötige Wiederholung von „mächtig“.
- source_word: δικαιοσύνης
  choice: Gerechtigkeit
  rationale: „Gerechtigkeit“ deckt im Deutschen sowohl rechtschaffenes Handeln als auch den Gerechtigkeitsaspekt des griechischen Begriffs ab.
theological_decisions:
- issue: Ob πνεύματι ἁγίῳ ausdrücklich als Bezeichnung des Heiligen Geistes zu verstehen ist
  choice: in heiligem Geist
  alternative: im Heiligen Geist; durch den Heiligen Geist
  rationale: Da der griechische Ausdruck keinen Artikel hat und ἐν sowohl Sphäre als auch Mittel bezeichnen kann, legt der Haupttext weder die personale definite noch die instrumentale Lesart ausschließlich fest.
- issue: Bedeutung von δικαιοσύνη im messianischen Herrschaftskontext
  choice: Gerechtigkeit
  alternative: Rechtschaffenheit
  rationale: „Gerechtigkeit“ wahrt die Spannung zwischen persönlicher Rechtschaffenheit und gerechtem Herrschaftshandeln, ohne den Begriff auf nur einen Aspekt einzuengen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit enger Bindung an die griechische Satzstruktur. Unnatürliche Lehnsyntax wird vermieden; echte lexikalische und theologische Mehrdeutigkeit wird durch die Haupttextfassung und knappe Fußnoten erhalten.
