base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/017/003.yaml
  text: But we will hope in God our savior, because the dominion of our God is forever with mercy, and the kingdom of our God is forever over the nations.
translation:
  language: de
  text: Wir aber werden auf Gott, unseren Retter, hoffen; denn die Macht unseres Gottes währt ewig, begleitet von Barmherzigkeit, und das Königtum unseres Gottes währt ewig über die Völker.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλπιοῦμεν ἐπὶ
  choice: werden auf … hoffen
  rationale: Gibt das Futur und die auf Gott gerichtete Hoffnung direkt und idiomatisch wieder.
- source_word: σωτῆρα
  choice: Retter
  rationale: Die natürliche moderne Entsprechung bewahrt die soteriologische Aussage, ohne sie näher zu bestimmen.
- source_word: κράτος
  choice: Herrschaft
  rationale: Bezeichnet hier Gottes bleibende Macht beziehungsweise souveräne Herrschaft; „Herrschaft“ passt zum parallelen βασιλεία, ohne beide Begriffe gleichzusetzen.
- source_word: μετʼ ἐλέους
  choice: in Barmherzigkeit
  rationale: Bewahrt den modalen Zusammenhang zwischen Gottes ewiger Herrschaft und seinem Erbarmen; „in“ klingt im Deutschen natürlicher als das wörtliche „mit“.
- source_word: βασιλεία
  choice: Königtum
  rationale: Hebt Gottes königliche Herrschaft hervor und wahrt zugleich den lexikalischen Unterschied zu κράτος.
- source_word: τὰ ἔθνη
  choice: die Völker
  rationale: Im Kontext bezeichnet der Plural die nichtisraelitischen beziehungsweise allgemeinen Völker; die Übersetzung lässt den genauen Umfang offen.
theological_decisions:
- issue: Verhältnis von Gottes Herrschaft und Barmherzigkeit
  choice: „die Herrschaft unseres Gottes währt ewig in Barmherzigkeit“
  alternative: „die Macht unseres Gottes besteht ewig samt Barmherzigkeit“
  rationale: Die gewählte Fassung bewahrt die enge Verbindung von dauernder Herrschaft und Erbarmen, ohne zu erklären, ob μετʼ ἐλέους instrumental, modal oder begleitend gemeint ist.
- issue: Reichweite des göttlichen Königtums
  choice: „über die Völker“
  alternative: „gegen die Völker“
  rationale: ἐπί mit Akkusativ kann verschiedene räumliche oder relationale Nuancen tragen; im Zusammenhang mit βασιλεία ist die Herrschaft „über“ die Völker am wahrscheinlichsten, ohne eine spezifische endzeitliche Auslegung einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der adversative Auftakt „Wir aber“ sowie die parallele Satzstruktur des Griechischen bleiben erhalten. „Währt ewig“ vermeidet die schwerfällige Wiederholung von „ist in Ewigkeit“ und gibt εἰς τὸν αἰῶνα natürlich wieder.
