  source_fidelity: Die drei Verneinungen, die militärischen Mittel und der Dativ des Vorteils in „für sich“ sind im Wesentlichen treffend wiedergegeben. „Tag des Kampfes“ verengt jedoch πόλεμος gegenüber dem zuvor mit „Krieg“ übersetzten Wort unnötig. Die Wendung „bei vielen ... Hoffnungen sammeln“ bildet den gedrängten Dativ πολλοῖς zwar formal nach, ist im Deutschen aber semantisch missverständlich.
  naturalness: Der Satz ist insgesamt würdevoll und gut lesbar. „Bei vielen Hoffnungen sammeln“ ist jedoch kein natürliches modernes Deutsch und kann nahelegen, dass viele Personen jeweils Hoffnungen besitzen. „Aus vielen“ macht die wahrscheinlich gemeinte numerische Grundlage idiomatischer kenntlich, ohne die vielen näher als Soldaten oder Verbündete festzulegen.
  terminology: „Hoffnung auf ... setzen“, „Pferd, Reiter und Bogen“ sowie „weder Gold noch Silber“ sind angemessen. Die Wiederholung von „Krieg“ wahrt die lexikalische Kohärenz für πόλεμος.
