  yaml_path: translation/deuterocanon/psalms_of_solomon/017/037.yaml
  text: For he will not put his hope in horse and rider and bow[a], nor will he multiply gold or silver for himself for war[b], nor will he gather hopes from many for the day of battle.
translation:
  language: de
  text: Denn er wird seine Hoffnung nicht auf Pferd, Reiter und Bogen setzen; auch wird er für den Krieg weder Gold noch Silber für sich anhäufen, und er wird aus vielen keine Hoffnungen für den Tag des Krieges sammeln.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „und aus/von vielen wird er keine Hoffnungen für den Tag des Krieges sammeln“. Das knappe Griechisch kann das Vertrauen auf viele Menschen oder auf eine zahlenmäßig große Streitmacht meinen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλπιεῖ ἐπὶ
  choice: wird seine Hoffnung nicht auf … setzen
  rationale: Bewahrt die Grundbedeutung von ἐλπίζω und gibt die durch ἐπί bezeichnete Ausrichtung des Vertrauens im Deutschen idiomatisch wieder.
- source_word: ἵππον καὶ ἀναβάτην καὶ τόξον
  choice: Pferd, Reiter und Bogen
  rationale: Die konkreten militärischen Mittel werden ohne erklärende Zusätze wiedergegeben; die Singularformen und die Reihung des Griechischen bleiben erhalten.
- source_word: πληθυνεῖ αὐτῷ
  choice: wird … für sich anhäufen
  rationale: πληθύνω bezeichnet ein Vermehren; im Zusammenhang mit Edelmetallen ist „anhäufen“ natürlich, während αὐτῷ als Dativ des Vorteils mit „für sich“ wiedergegeben wird.
- source_word: χρυσίον οὐδὲ ἀργύριον
  choice: weder Gold noch Silber
  rationale: Nach der Verneinung bildet „weder … noch“ die griechische disjunktive Verknüpfung mit οὐδέ präzise und idiomatisch ab.
- source_word: εἰς πόλεμον
  choice: für den Krieg
  rationale: Gibt Zweck beziehungsweise Verwendung der angesammelten Mittel direkt wieder und wahrt die allgemeinere Bedeutung von πόλεμος.
- source_word: πολλοῖς
  choice: bei vielen
  rationale: Der bloße Dativ ist semantisch gedrängt und kann sich auf viele Menschen oder eine große Streitmacht beziehen. „Bei vielen“ hält diese Unbestimmtheit eher offen als eine konkretisierende Übersetzung.
- source_word: συνάξει ἐλπίδας
  choice: wird … keine Hoffnungen … sammeln
  rationale: Die ungewöhnliche konkrete Metapher und der Plural ἐλπίδας werden bewusst bewahrt, statt sie deutend zu „Zuversicht“ oder „Rückhalt“ aufzulösen.
- source_word: ἡμέραν πολέμου
  choice: den Tag des Kampfes
  rationale: „Tag des Kampfes“ ist im Deutschen natürlich und bezeichnet hier den konkreten Zeitpunkt der kriegerischen Auseinandersetzung.
theological_decisions:
- issue: Grundlage der Hoffnung des erwarteten Herrschers
  choice: Die militärischen und materiellen Mittel werden als Gegenstände genannt, auf die er seine Hoffnung nicht setzt.
  alternative: Die Aussage als generelle Ablehnung von Pferden, Waffen, Reichtum oder Verbündeten formulieren.
  rationale: Der griechische Text bestreitet ausdrücklich das Hoffen beziehungsweise das Sammeln von Hoffnungen, nicht notwendig jeden Gebrauch dieser Mittel. Die Übersetzung vermeidet daher eine weitergehende theologische Folgerung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallele Satzstruktur und die konkrete militärische Bildsprache bleiben erhalten. Die bewusst ungewöhnliche Wendung „Hoffnungen sammeln“ wahrt die Ausdrucksweise und Mehrdeutigkeit des griechischen Textes; die Fußnote erläutert sie, ohne die Hauptübersetzung stillschweigend festzulegen.
