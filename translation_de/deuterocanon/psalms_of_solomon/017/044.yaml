  yaml_path: translation/deuterocanon/psalms_of_solomon/017/044.yaml
  text: And his hope in the Lord will not grow weak; and who can stand against him? He is strong in his deeds and mighty in the fear of God,
translation:
  language: de
  text: Und seine Hoffnung auf den Herrn wird nicht schwach werden. Wer kann gegen ihn bestehen? Stark ist er in seinen Taten und mächtig in der Furcht Gottes,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀσθενήσει
  choice: wird nicht schwach werden
  rationale: Das Futur bezeichnet ein Schwachwerden oder Nachlassen. Mit „Hoffnung“ als Subjekt bewahrt diese Wiedergabe das Bild des griechischen Ausdrucks.
- source_word: ἡ ἐλπὶς αὐτοῦ ἐπὶ Κύριον
  choice: seine Hoffnung auf den Herrn
  rationale: Die Präposition ἐπί bezeichnet hier die Ausrichtung vertrauender Hoffnung auf den Herrn; die deutsche Wendung ist natürlich und bleibt nahe an der griechischen Struktur.
- source_word: Κύριον
  choice: den Herrn
  rationale: „Herr“ ist die sachgemäße traditionelle Wiedergabe von κύριος; der bestimmte Artikel ist in dieser deutschen Fügung erforderlich.
- source_word: τίς δύναται πρὸς αὐτόν;
  choice: Wer kann gegen ihn bestehen?
  rationale: Der knappe griechische Ausdruck ist adversativ und rhetorisch. „Gegen ihn bestehen“ bringt die Fähigkeit zum erfolgreichen Widerstand idiomatisch zum Ausdruck, ohne sie weiter auszudeuten.
- source_word: ἰσχυρὸς ἐν ἔργοις αὐτοῦ
  choice: Stark ist er in seinen Taten
  rationale: ἰσχυρός bezeichnet Stärke, ἔργα seine Handlungen oder Taten. Die Formulierung wahrt die prädikative Struktur und klingt im gehobenen deutschen Bibelstil natürlich.
- source_word: κραταιὸς ἐν φόβῳ θεοῦ
  choice: mächtig in der Furcht Gottes
  rationale: κραταιός bezeichnet kraftvolle Stärke. „Furcht Gottes“ bewahrt den biblischen Ausdruck und seine Spannung zwischen Ehrfurcht, Gehorsam und tatsächlicher Gottesfurcht, statt ihn auf bloße Verehrung zu verengen.
- source_word: '[implied copula]'
  choice: ist er
  rationale: Im griechischen Nominalsatz fehlt eine ausdrückliche Kopula. Für einen grammatisch vollständigen deutschen Satz wird sie ergänzt, ohne neuen Inhalt einzuführen.
theological_decisions:
- issue: Bedeutungsumfang von φόβος θεοῦ
  choice: Furcht Gottes
  alternative: Ehrfurcht vor Gott
  rationale: Die traditionelle, quellennähere Wendung bewahrt die theologische Mehrdeutigkeit des griechischen φόβος und mildert sie nicht stillschweigend zu bloßer Ehrfurcht ab.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht biblischem Klang. Die rhetorische Frage bleibt knapp; der abschließende Satz behält wegen des fortlaufenden Kontextes das Komma der Quelle bei.
