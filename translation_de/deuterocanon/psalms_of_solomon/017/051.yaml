base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/017/051.yaml
  text: May God hasten his mercy upon Israel[a]. He will rescue us from the uncleanness of profane enemies[c][b]. The Lord himself is our king forever and ever.
translation:
  language: de
  text: Gott möge Israel bald sein Erbarmen erweisen.[a] Er wird uns von der Unreinheit unheiliger Feinde[b][c] befreien. Der Herr selbst ist unser König für immer und ewig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der griechische Text beginnt mit einem Infinitiv („zu beschleunigen“ bzw. „eilends kommen zu lassen“). Er wird hier idiomatisch als dringlicher Gebetswunsch wiedergegeben.
    reason: alternative_reading
  - marker: b
    text: 'Oder: „Befleckung“ statt „Unreinheit“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „gottloser“ beziehungsweise „profaner Feinde“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ταχύναι
  choice: bald erweisen
  rationale: Der vorangestellte Infinitiv drückt hier am ehesten einen dringlichen Gebetswunsch aus. Im Deutschen gibt „möge … bald erweisen“ die zeitliche Dringlichkeit natürlicher wieder als das bei Erbarmen schwerfällige „beschleunigen“.
- source_word: ἔλεος
  choice: Erbarmen
  rationale: „Erbarmen“ bezeichnet Gottes mitfühlende, rettende Zuwendung, ohne eine im Ausdruck selbst nicht eindeutig bezeichnete Bundesterminologie einzutragen.
- source_word: ῥύσεται
  choice: wird … befreien
  rationale: Das Futur wird als zuversichtliche Rettungszusage bewahrt; „befreien“ passt idiomatisch zur Konstruktion mit ἀπό.
- source_word: ἀκαθαρσίας
  choice: Unreinheit
  rationale: „Unreinheit“ wahrt die kultische und sittliche Bedeutungsbreite des griechischen Ausdrucks.
- source_word: βεβήλων
  choice: entweihender
  rationale: Im Genitiv Plural kann das Adjektiv substantivisch die Feinde kennzeichnen oder auf ihre entweihende Wirkung bezogen werden. „Entweihender Feinde“ hält den Zusammenhang mit der Unreinheit deutlich und wahrt die sakrale Gegenüberstellung.
- source_word: Κύριος
  choice: Herr
  rationale: Die traditionelle und kontextgerechte Wiedergabe bezeichnet Gott als Israels eigentlichen Herrscher.
- source_word: εἰς τὸν αἰῶνα καὶ ἔτι
  choice: für immer und ewig
  rationale: Die deutsche Formel gibt die verstärkende Aussage einer unbegrenzt fortdauernden Königsherrschaft würdig und verständlich wieder.
theological_decisions:
- issue: Aussagekraft des eröffnenden Infinitivs ταχύναι
  choice: 'Gebetswunsch: „Gott möge … bald erweisen“'
  alternative: Wörtlicher Infinitiv („Gott sein Erbarmen … bald erweisen zu lassen“) oder Feststellung („Gott erweist … bald“)
  rationale: Der isolierte Infinitiv lässt die Satzfunktion formal offen. Im poetischen Zusammenhang ist ein dringlicher Wunsch am plausibelsten; die Fußnote macht die grammatische Besonderheit sichtbar.
- issue: Bezug und Sinn von βεβήλων
  choice: „entweihender Feinde“
  alternative: „gottloser“ oder „unheiliger Feinde“
  rationale: Der Ausdruck bezeichnet das Profane beziehungsweise sakral Unzulässige. Die gewählte Fassung bewahrt die Verbindung zur „Unreinheit“, ohne die Feinde lediglich allgemein als moralisch schlecht festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper poetischer Satzführung. Die Eröffnung wird idiomatisch als Wunsch formuliert; kultisch-sakrale Begriffe bleiben erkennbar. Alle Fußnotenmarker stehen im Haupttext.
