  text: And the sons of the covenant prevailed over them in the midst of the mixed nations[a]; there was no one among them, in Jerusalem[b], doing mercy and truth.
translation:
  language: de
  text: Und die Söhne des Bundes übertrafen sie inmitten der gemischten Völker[a]; unter ihnen, in Jerusalem, gab es niemanden, der Barmherzigkeit und Wahrheit[b] übte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »gewannen über sie die Oberhand«; wörtlicher: »waren ihnen überlegen«.'
