  - marker: b
    text: 'Oder: »Barmherzigkeit und Treue«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεκρατοῦσαν αὐτῶν
  choice: waren ihnen … überlegen
  rationale: Die Imperfektform bezeichnet einen fortdauernden Zustand oder Vorgang. „Ihnen überlegen sein“ bewahrt den Vergleichs- und Überlegenheitsgedanken, ohne zwingend politische oder militärische Herrschaft auszudrücken; die stärker dynamische Lesart wird in der Fußnote genannt.
- source_word: υἱοὶ τῆς διαθήκης
  choice: die Söhne des Bundes
  rationale: Die wörtliche, ausdrücklich maskuline Identitätsbezeichnung des Griechischen bleibt erhalten und wahrt das Gewicht der Bundeszugehörigkeit.
- source_word: ἐν μέσῳ ἐθνῶν συμμίκτων
  choice: inmitten der miteinander vermischten Völker
  rationale: „Völker“ gibt ἐθνῶν wieder; „miteinander vermischt“ drückt συμμίκτων verständlich aus und vermeidet die missverständliche Vorstellung, jedes Volk sei nur in sich gemischt.
- source_word: ὁ ποιῶν
  choice: der … übte
  rationale: Bei ethischen Größen wie Barmherzigkeit und Wahrheit ist „üben“ im Deutschen natürlicher als das formal mögliche „tun“ und bewahrt dennoch den Gedanken gelebten Handelns.
- source_word: ἔλεος
  choice: Barmherzigkeit
  rationale: Die Wahl gibt die religiös-ethische Bedeutung von erbarmender Güte direkt und in würdigem Gegenwartsdeutsch wieder.
- source_word: ἀλήθειαν
  choice: Wahrheit
  rationale: „Wahrheit“ ist die direkte Entsprechung und erhält die traditionelle, semitisch geprägte Wortverbindung; die mögliche Bedeutung „Treue“ wird in der Fußnote bewahrt.
theological_decisions:
- issue: Wiedergabe der geschlechtsspezifischen Bundesbezeichnung υἱοὶ τῆς διαθήκης
  choice: Söhne des Bundes
  alternative: Kinder des Bundes; Angehörige des Bundesvolkes
  rationale: Die maskuline Form ist im Ausgangstext ausdrücklich gesetzt und fungiert als Identitätsbezeichnung. Eine Neutralisierung würde diese Form ohne zwingenden Kontextgrund abschwächen.
- issue: Deutung der Verbindung ἔλεος καὶ ἀλήθειαν
  choice: Barmherzigkeit und Wahrheit
  alternative: Barmherzigkeit und Treue
  rationale: Die Hauptfassung hält an der transparenten griechischen Wortwahl fest. Zugleich bleibt durch die Fußnote offen, dass ἀλήθεια in dieser semitisch geprägten Verbindung auch verlässliche Treue bezeichnen kann.
- issue: Art der Überlegenheit in ἐπεκρατοῦσαν αὐτῶν
  choice: waren ihnen überlegen
  alternative: gewannen über sie die Oberhand; übertrafen sie
  rationale: Der unmittelbare Ausdruck bezeichnet ein Überlegensein oder Sich-Durchsetzen. Die gewählte Form lässt offen, ob eine vergleichende oder eine stärker machtbezogene Nuance im Vordergrund steht, und legt keine bestimmte historische Deutung fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung folgt dem griechischen Gedankengang, wird aber durch „gab es niemanden, der …“ idiomatisch geglättet. Beide Fußnotenmarker stehen unmittelbar bei der jeweils erklärten Wendung.
