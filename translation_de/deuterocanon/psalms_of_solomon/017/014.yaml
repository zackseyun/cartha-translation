  yaml_path: translation/deuterocanon/psalms_of_solomon/017/014.yaml
  text: In the wrath of his splendor he sent them away as far as the west[a], and the rulers of the land to mockery[c][b]; and he did not spare.
translation:
  language: de
  text: Im Zorn seiner Schönheit schickte er sie bis in den Westen[a] fort und gab die Herrscher des Landes dem Spott preis[b]; und er verschonte nicht[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: „bis zu den Gegenden des Sonnenuntergangs“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „in den Spott“. Sinngemäß auch: „und machte die Herrscher des Landes zum Gespött“.'
    reason: lexical_alternative
  - marker: c
    text: 'Das griechische Verb nennt hier kein ausdrückliches Objekt; möglich ist dem Sinn nach auch: „und er verschonte sie nicht“.'
    reason: source_ambiguity
lexical_decisions:
- source_word: ἐν ὀργῇ κάλλους αὐτοῦ
  choice: Im Zorn seiner Schönheit
  rationale: Die ungewöhnliche Genitivverbindung wird entsprechend dem griechischen Wortlaut bewahrt. κάλλος bedeutet hier zunächst „Schönheit“; „Herrlichkeit“ oder „Pracht“ wäre glatter, würde aber die im Ausgangstext vorhandene auffällige Formulierung interpretierend abschwächen.
- source_word: ἐξαπέστειλεν αὐτὰ
  choice: schickte er sie fort
  rationale: Die Wiedergabe erhält sowohl den Grundsinn des Sendens als auch die verstärkende Bedeutung des Fortschickens, ohne das Verb zu „vertrieb“ zuzuspitzen.
- source_word: ἕως ἐπὶ δυσμῶν
  choice: bis in den Westen
  rationale: δυσμαί bezeichnet den Westen beziehungsweise die Gegend des Sonnenuntergangs. Die Präpositionsfolge drückt die erreichte Ferne oder Grenze aus.
- source_word: τοὺς ἄρχοντας τῆς γῆς
  choice: die Herrscher des Landes
  rationale: ἄρχοντες sind politische Machthaber; γῆ kann „Land“ oder „Erde“ bedeuten. Im geschichtlichen Zusammenhang ist „Land“ die naheliegende, aber nicht völlig zwingende Lesart.
- source_word: εἰς ἐμπαιγμόν
  choice: in den Spott
  rationale: Die knappe Ziel- oder Ergebnisangabe des Griechischen wird formal erhalten. Gemeint ist, dass sie dem Spott preisgegeben beziehungsweise zum Gegenstand des Spotts wurden.
- source_word: οὐκ ἐφείσατο
  choice: er verschonte nicht
  rationale: Das Griechische nennt kein ausdrückliches Objekt. Die deutsche Fassung bewahrt diese Offenheit, statt „sie“ ergänzend einzusetzen.
theological_decisions:
- issue: Bezug von „seiner“ in ἐν ὀργῇ κάλλους αὐτοῦ
  choice: Die grammatisch auffällige Aussage bleibt ohne Identifizierung oder theologische Umdeutung stehen.
  alternative: „im Zorn seiner Herrlichkeit“ oder eine auf göttliche Majestät bezogene Paraphrase
  rationale: Der Vers selbst bezeichnet das handelnde Subjekt nicht neu. Eine Deutung als Aussage über Gottes Herrlichkeit wäre aus diesem Wortlaut allein nicht gesichert und würde die historische Bezugsmöglichkeit auf eine menschliche Gestalt verdecken.
- issue: Unausgesprochenes Objekt bei οὐκ ἐφείσατο
  choice: „er verschonte nicht“
  alternative: „er verschonte sie nicht“
  rationale: Die absolute Form des Griechischen soll erhalten bleiben; das mögliche Objekt wird nicht dogmatisch oder erzählerisch festgelegt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die markante und schwierige Wendung „Zorn seiner Schönheit“ sowie die elliptische Satzfügung wurden bewusst nicht geglättet. Die Wiederholung von „und“ folgt der parataktischen Struktur des griechischen Textes.
