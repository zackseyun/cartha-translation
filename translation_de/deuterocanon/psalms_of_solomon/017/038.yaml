base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/017/038.yaml
  text: The Lord himself is their king[a], the hope of the mighty one in God[d][c][b]; and he will have mercy on all the nations before him in fear.
translation:
  language: de
  text: Der Herr selbst ist ihr König[a]. Die Hoffnung des Mächtigen ist Hoffnung auf Gott[b]; und er wird sich aller Völker vor ihm in Furcht erbarmen[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Einige Textzeugen lesen »sein König« statt »ihr König«. Dann würde die Zeile die Unterordnung des davidischen Herrschers unter den Herrn unmittelbarer ausdrücken.
    reason: textual_variant
  - marker: b
    text: 'Die griechische Wortfolge ist in der überlieferten Form schwierig und möglicherweise fehlerhaft. Möglich wäre auch eine engere Verbindung: »die Hoffnung des Mächtigen auf Gott«.'
    reason: textual_variant
  - marker: c
    text: 'Oder: »in Ehrfurcht vor ihm«; das griechische Wort kann sowohl Furcht als auch ehrfürchtige Scheu bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Κύριος
  choice: der Herr
  rationale: Die übliche und kontextgemäße Wiedergabe des Gottestitels; Gott erscheint hier als der höchste König.
- source_word: βασιλεὺς αὐτῶν
  choice: ihr König
  rationale: Folgt dem Pluralpronomen αὐτῶν im Swete-Text. Die abweichende Singularlesart wird in einer Fußnote bewahrt.
- source_word: ἐλπὶς τοῦ δυνατοῦ
  choice: die Hoffnung des Mächtigen
  rationale: Bewahrt sowohl das Substantiv ἐλπίς als auch den substantivierten Singular δυνατός, ohne die Aussage zu verallgemeinern.
- source_word: ἐλπὶθ θεοῦ
  choice: ist Hoffnung auf Gott
  rationale: Die Überlieferung ist sprachlich schwierig. Die Wiedergabe behandelt die Wortgruppe vorsichtig als nominale Aussage, erhält die Wiederholung von ‚Hoffnung‘ und richtet sie auf Gott aus.
- source_word: ἐλεήσει
  choice: wird sich … erbarmen
  rationale: Natürliche, würdige deutsche Entsprechung für das Verb des barmherzigen Handelns.
- source_word: πάντα τὰ ἔθνη
  choice: aller Völker
  rationale: Gibt den umfassenden Sinn von πάντα und den breiten Bezug von ἔθνη wieder, ohne ihn konfessionell auf ‚Heiden‘ festzulegen.
- source_word: ἐνώπιον αὐτοῦ ἐν φόβῳ
  choice: die in Furcht vor ihm stehen
  rationale: Formt die knappe griechische Fügung zu verständlichem Deutsch und bewahrt zugleich die mögliche Spannung zwischen Furcht und ehrfürchtiger Scheu.
theological_decisions:
- issue: Verhältnis zwischen der Königsherrschaft des Herrn und dem davidischen Herrscher im Kontext
  choice: Der Herr selbst ist ihr König
  alternative: Der Herr selbst ist sein König
  rationale: Der Haupttext folgt Swetes Plural αὐτῶν und lässt Gott als letzten König des Volkes erscheinen. Die Singularvariante, die die Unterordnung des davidischen Herrschers unmittelbarer ausdrücken würde, bleibt in der Fußnote sichtbar.
- issue: Bezug von Gottes Erbarmen und der abschließenden Furchtformel
  choice: Er erbarmt sich aller Völker, die in Furcht vor ihm stehen
  alternative: Er erbarmt sich aller Völker vor ihm in Furcht
  rationale: Die deutsche Relativkonstruktion macht den wahrscheinlichsten syntaktischen Bezug verständlich, ohne φόβος ausschließlich als Angst oder ausschließlich als Ehrfurcht festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der markante Satzbruch nach »ihr König« wird entsprechend der Interpunktion des griechischen Textes bewahrt. Die schwer überlieferte Hoffnungsformel wird bewusst nicht zu einer eindeutigen theologischen Aussage geglättet.
