review_pass:
  verdict: approve
  source_fidelity: Die Übersetzung gibt die syntaktisch fortlaufende Infinitivkonstruktion καὶ ἰδεῖν angemessen wieder. „Herrlichkeit des Herrn“ und die bewusste Wortverwandtschaft „Herrlichkeit/verherrlicht“ entsprechen δόξα/ἐδόξασεν. „Mit der Gott sie verherrlicht hat“ bildet die im Griechischen ungewöhnlich verdichtete Konstruktion sachgerecht ab, ohne den Bezug der femininen Pronomina auf die personifizierte Stadt übermäßig zu explizieren. Der im zweiten Teilsatz für das im Griechischen fehlende Prädikat ergänzte Zukunftsausdruck „wird ... sein“ ist im gegebenen Zukunftskontext vertretbar. „Über sie“ gibt ἐπ’ αὐτούς im Herrschaftskontext korrekt wieder.
  naturalness: Das Deutsch ist modernes, würdiges Standarddeutsch. Die Stellung „wird über sie ein gerechter König sein“ ist idiomatisch und macht den Herrschaftsbezug klar. Der einleitende Infinitiv bleibt bewusst als Anschluss an den vorherigen Vers stehen; dies ist für eine versweise Übersetzung angemessen.
  terminology: „Herrlichkeit“, „Herr“, „verherrlicht“, „gerechter König“ und „von Gott gelehrt“ sind registergerecht und terminologisch konsistent. Die Fußnoten bieten sinnvolle, nicht doktrinal zuspitzende Alternativen. Fußnotenanker und -texte sind strukturell stimmig.
