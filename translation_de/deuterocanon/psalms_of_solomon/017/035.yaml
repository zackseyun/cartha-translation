  text: and to see the glory of the Lord with which God glorified her[a]; and he himself will be a righteous king over them, taught by God[c][b],
translation:
  language: de
  text: und die Herrlichkeit des Herrn zu sehen, mit der Gott sie verherrlicht hat[a]. Und er selbst wird über sie ein gerechter König sein, von Gott gelehrt[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die Herrlichkeit des Herrn, mit der Gott sie verherrlicht hat“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „von Gott unterwiesen“.'
    reason: lexical_alternative
  - marker: c
    text: 'Auch möglich: „Und er selbst wird ein gerechter, von Gott gelehrter König über sie sein.“'
    reason: word_order_ambiguity
lexical_decisions:
- source_word: δόξαν
  choice: Herrlichkeit
  rationale: „Herrlichkeit“ bewahrt den erhabenen biblischen Ton und kann sowohl sichtbaren Glanz als auch verliehene Ehre bezeichnen.
- source_word: Κυρίου
  choice: des Herrn
  rationale: Der Genitiv bezeichnet hier am natürlichsten die Herrlichkeit des Herrn.
- source_word: ἐδόξασεν
  choice: verherrlicht hat
  rationale: Die verwandte Wortwahl „Herrlichkeit/verherrlicht“ erhält das griechische Wortspiel zwischen δόξα und δοξάζω.
- source_word: αὐτὴν
  choice: sie
  rationale: Das feminine Pronomen verweist im Zusammenhang am ehesten auf die personifizierte Stadt Jerusalem.
- source_word: βασιλεὺς δίκαιος
  choice: ein gerechter König
  rationale: „Gerecht“ ist die natürliche und bibelsprachlich passende Wiedergabe von δίκαιος.
- source_word: διδακτὸς ὑπὸ θεοῦ
  choice: von Gott gelehrt
  rationale: Die formal nahe Wiedergabe erhält die passive Aussage, dass Gott der Lehrende ist; „unterwiesen“ bleibt als idiomatische Alternative möglich.
- source_word: ἐπ’ αὐτούς
  choice: über sie
  rationale: Im Zusammenhang des Königtums bezeichnet ἐπί mit Akkusativ am ehesten die Herrschaft über ein Volk.
theological_decisions:
- issue: Ergänztes Verb im zweiten Satzteil
  choice: wird … sein
  alternative: er selbst, ein gerechter König, von Gott gelehrt, über sie
  rationale: Der überlieferte griechische Satzteil ist ohne ausdrückliches Verb. Das ergänzte Futur entspricht dem zukunftsgerichteten Kontext, ohne die messianische Aussage näher zu bestimmen.
- issue: Zuordnung von ἐπ’ αὐτούς
  choice: „über sie“ unmittelbar bei „König sein“
  alternative: „von Gott gelehrt, über sie“
  rationale: Die Stellung macht im Deutschen deutlich, dass die Präpositionalphrase die Königsherrschaft bezeichnet. Die griechische Wortstellung lässt sich jedoch auch enger am Schluss nachbilden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst erhaltener biblischer Wortverwandtschaft „Herrlichkeit/verherrlicht“. Der einleitende Infinitiv setzt syntaktisch den vorausgehenden Vers fort. Die feminine Stadtpersonifikation bleibt durch „sie“ erhalten.
