  text: His words are like the words of holy ones in the midst of sanctified peoples.
translation:
  language: de
  text: Seine Worte sind wie die Worte von Heiligen inmitten geheiligter Völker.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ λόγοι αὐτοῦ
  choice: Seine Worte
  rationale: λόγοι bezeichnet hier am unmittelbarsten Worte oder Äußerungen. „Seine Worte“ gibt die Wendung transparent wieder und bewahrt die Wiederholung von λόγοι.
- source_word: ὡς
  choice: sind wie
  rationale: ὡς leitet einen Vergleich ein. „sind wie“ ist im modernen Deutsch natürlich und hält den Vergleich ausdrücklich fest.
- source_word: λόγοι ἁγίων
  choice: die Worte von Heiligen
  rationale: ἁγίων ist am ehesten substantivisch auf heilige Personen bezogen. „von Heiligen“ ist verständlich und vermeidet die missverständliche Deutung als bloß „heilige Worte“.
- source_word: ἐν μέσῳ
  choice: inmitten
  rationale: Die Wendung bezeichnet eine Stellung mitten unter einer Gruppe. „inmitten“ wahrt das räumlich-soziale Bild knapp und würdig.
- source_word: λαῶν ἡγιασμένων
  choice: geheiligter Völker
  rationale: λαῶν steht im Plural und wird daher als „Völker“ wiedergegeben. Das Partizip ἡγιασμένων enthält den Gedanken, dass diese Völker geheiligt beziehungsweise Gott geweiht worden sind; „geheiligt“ bewahrt diesen verbalen Aspekt.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit enger Bindung an die griechische Wortfolge. Die auffällige Mehrzahl „Völker“ und der Unterschied zwischen „Heiligen“ und „geheiligten Völkern“ bleiben erhalten.
