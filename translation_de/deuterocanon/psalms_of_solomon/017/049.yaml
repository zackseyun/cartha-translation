  source_fidelity: 'Die Übersetzung gibt alle wesentlichen Elemente des griechischen Satzes präzise wieder: οἱ λόγοι αὐτοῦ als „Seine Worte“, den Vergleich ὡς als „sind wie“, λόγοι ἁγίων als personal verstandene „Worte von Heiligen“, ἐν μέσῳ als „inmitten“ sowie den Plural λαῶν ἡγιασμένων als „geheiligter Völker“. Die Genitivfügung nach „inmitten“ ist korrekt und bewahrt die pluralische Aussage.'
  naturalness: „Seine Worte sind wie die Worte von Heiligen inmitten geheiligter Völker“ ist grammatisch korrektes, verständliches modernes Standarddeutsch. Die leicht gehobene Diktion passt zum poetisch-religiösen Register, ohne künstlich zu wirken.
