lexical_decisions:
- source_word: καθάρισον
  choice: Reinige
  rationale: Der Aoristimperativ fordert eine entschiedene Beseitigung von Verunreinigung oder Verderbnis. „Reinige“ bewahrt sowohl den kultischen als auch den politischen Sinn.
- source_word: Ἰερουσαλήμ
  choice: Jerusalem
  rationale: Die im Deutschen übliche Form des Ortsnamens.
- source_word: ἐθνῶν
  choice: Völkern
  rationale: Das Wort kann allgemein „Völker“ oder spezifischer „Heiden“ bezeichnen. Im Zusammenhang sind fremde Völker gemeint; „Völker“ vermeidet eine unnötige religiös-ethnische Verengung.
- source_word: καταπατούντων
  choice: die es … zertreten
  rationale: Das Partizip beschreibt gewaltsame, verächtliche Unterdrückung. „Zertreten“ gibt die starke Bildsprache im Deutschen treffend wieder.
- source_word: ἐν ἀπωλείᾳ
  choice: zu seinem Verderben
  rationale: Die Wendung bezeichnet hier am ehesten die zerstörerische Wirkung oder das Ergebnis des Zertretens. Die Formulierung ist natürlich und hält den Gedanken der Verwüstung fest.
- source_word: ἐν σοφίᾳ
  choice: in Weisheit
  rationale: Die relativ formale Wiedergabe lässt offen, ob Weisheit die Art, das Mittel oder den Maßstab des erbetenen Reinigens bezeichnet.
- source_word: ἐν δικαιοσύνῃ
  choice: in Gerechtigkeit
  rationale: „Gerechtigkeit“ ist die breite und theologisch nicht verengte Entsprechung; kontextuell ist auch „Recht“ möglich.
theological_decisions:
- issue: Ob ἐθνῶν allgemein als „Völker“ oder religiös-ethnisch als „Heiden“ wiederzugeben ist.
  choice: Völker
  alternative: Heiden
  rationale: Gemeint sind fremde Völker, die Jerusalem bedrängen. „Völker“ bewahrt diesen Sinn, ohne einen stärker technischen Gegensatz zwischen Juden und Nichtjuden vorauszusetzen.
- issue: Worauf sich ἐν σοφίᾳ und ἐν δικαιοσύνῃ beziehen.
  choice: Die Wendungen werden dem Imperativ „Reinige“ zugeordnet und bezeichnen Art, Mittel oder Maßstab des göttlichen Handelns.
  alternative: Die Wendungen können als nachgestellte Bestimmung verstanden werden, die sich auf das Gericht über die Völker oder weniger wahrscheinlich auf deren Zertreten bezieht.
  rationale: Die Voranstellung im Deutschen verhindert die irreführende unmittelbare Zuordnung zu den zertretenden Völkern. Eine Fußnote bewahrt die durch die knappe griechische Wortstellung bestehende Mehrdeutigkeit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung ordnet „in Weisheit und Gerechtigkeit“ verständlich dem Reinigungsauftrag zu; die Fußnote dokumentiert die kompaktere und mehrdeutige griechische Stellung. Das grammatische Neutrum „es/seinem“ bezieht sich auf Jerusalem.
