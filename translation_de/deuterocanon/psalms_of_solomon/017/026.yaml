  text: to drive sinners out from the inheritance[a], to wipe out the pride of the sinner like a potter's vessels[d][c][b], to crush all their substance with an iron rod.
translation:
  language: de
  text: um Sünder aus dem Erbteil[a] zu vertreiben, den Hochmut des Sünders[b] wie Töpfergefäße zu zerschlagen und mit eisernem Stab ihren ganzen Bestand[c] zu zerschmettern.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „aus dem Erbe“ beziehungsweise „aus dem Erbbesitz“.'
    reason: lexical_alternative
  - marker: b
    text: „Des Sünders“ steht im Griechischen im Singular und kann stellvertretend für Sünder allgemein gebraucht sein.
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „ihre ganze Grundlage“, „ihre ganze Stellung“ oder „ihren gesamten Besitz“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῶσαι
  choice: zu vertreiben
  rationale: Das Verb bezeichnet eine gewaltsame Entfernung; „vertreiben“ gibt diesen Sinn natürlich und prägnant wieder.
- source_word: κληρονομίας
  choice: aus dem Erbteil
  rationale: „Erbteil“ bewahrt den Gedanken eines zugewiesenen beziehungsweise ererbten Besitzes und lässt den möglichen Bezug auf Land oder Bundeserbe offen.
- source_word: ἐκτρῖψαι
  choice: zu zerschlagen
  rationale: Im Zusammenspiel mit dem Bild der Töpfergefäße bezeichnet das Verb hier vernichtendes Zerbrechen; „zerschlagen“ erhält die konkrete Bildlichkeit.
- source_word: ὑπερηφανίαν
  choice: den Hochmut
  rationale: „Hochmut“ bezeichnet die negative, selbstüberhebende Haltung deutlicher als das im Deutschen auch neutral oder positiv verwendbare „Stolz“.
- source_word: ἁμαρτωλοῦ
  choice: des Sünders
  rationale: Der griechische Singular wird als möglicher repräsentativer Singular bewahrt.
- source_word: σκεύη κεραμέως
  choice: wie Töpfergefäße
  rationale: Die kompakte deutsche Zusammensetzung ist natürlich und erhält das konkrete Bild zerbrechlicher Gefäße aus der Hand eines Töpfers.
- source_word: ἐν ῥάβδῳ σιδηρᾷ
  choice: mit eisernem Stab
  rationale: Die instrumentale Wendung ist idiomatisches Deutsch und bewahrt die biblische Bildsprache.
- source_word: συντρίψαι
  choice: zu zerbrechen
  rationale: Das Verb bezeichnet gewaltsames Brechen oder Zerschmettern. „Zerbrechen“ vermeidet eine unmittelbare Wiederholung und bleibt stark genug für den Zusammenhang.
- source_word: πᾶσαν ὑπόστασιν αὐτῶν
  choice: ihre ganze Grundlage
  rationale: ὑπόστασις kann Bestand, Grundlage, Stellung oder Besitz bezeichnen. „Grundlage“ wahrt diese Breite besser als eine einseitige Festlegung auf materiellen Besitz.
theological_decisions:
- issue: Möglicher Bundes- und Landbezug von κληρονομία
  choice: Erbteil
  alternative: Erbe; Erbbesitz
  rationale: „Erbteil“ lässt einen konkreten zugewiesenen Besitz anklingen, ohne den Ausdruck ausdrücklich auf Israel, das Land oder eine bestimmte Bundestheologie festzulegen.
- issue: Bedeutungsbreite von ὑπόστασις
  choice: Grundlage
  alternative: Bestand; Besitz; Stellung
  rationale: Der Kontext spricht von umfassender Vernichtung, bestimmt aber nicht eindeutig, ob materielle Mittel, gesellschaftliche Stellung oder der gesamte Bestand gemeint sind. Die Übersetzung lässt diese Spannung bestehen.
translation_notes:
  register: Moderner, würdiger Standardstil. Die parallelen Infinitive werden beibehalten. „Hochmut“ vermeidet die positive Nebenbedeutung von „Stolz“; „Töpfergefäße“ ist konkret und idiomatisch. Die semantische Offenheit von ὑπόστασις wird im Haupttext und in der Fußnote sichtbar gemacht.
