  yaml_path: translation/deuterocanon/psalms_of_solomon/017/048.yaml
  text: His words are refined beyond the finest precious gold[a]; in the assemblies he will judge the people[d][c][b], the tribes of the sanctified.
translation:
  language: de
  text: Seine Worte sind reiner als feinstes, kostbares Gold[a]. In den Versammlungen wird er das Volk richten[b] – die Stämme des geheiligten Volkes[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Seine Worte sind im Feuer gereinigt oder geprüft, mehr noch als feinstes Gold.“'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „wird er das Volk unterscheiden“ beziehungsweise „scheiden“.'
    reason: alternative_reading
  - marker: c
    text: 'Im Griechischen steht eine gedrängte Genitiv-Singularform: etwa „die Stämme eines/des Geheiligten“. Wahrscheinlich ist damit kollektiv das geheiligte Volk gemeint; möglich sind auch „des Heiligen“ oder „des Geweihten“.'
    reason: alternative_reading
lexical_decisions:
- source_word: ῥήματα
  choice: Worte
  rationale: Das Wort bezeichnet gesprochene Worte oder Aussprüche. „Worte“ ist im Deutschen natürlich und bewahrt die knappe Ausdrucksweise.
- source_word: πεπυρωμένα
  choice: geläutert
  rationale: Das Partizip bezeichnet wörtlich etwas, das dem Feuer ausgesetzt und dadurch geprüft oder gereinigt wurde. „Geläutert“ erhält im Zusammenhang mit Gold das metallurgische Bild.
- source_word: ὑπὲρ χρυσίον τὸ πρῶτον τίμιον
  choice: mehr als feinstes kostbares Gold
  rationale: Die Wendung steigert den Vergleich mit hochwertigem Gold. Die Übersetzung gibt diese Wertsteigerung idiomatisch wieder, ohne das ungewöhnliche Griechisch unnötig zu glätten.
- source_word: συναγωγαῖς
  choice: Versammlungen
  rationale: Gemeint sind gemeinschaftliche Zusammenkünfte; „Versammlungen“ ist hier weiter und weniger institutionell festgelegt als „Synagogen“.
- source_word: διακρινεῖ
  choice: wird … richten
  rationale: Im Zusammenhang mit dem königlichen Herrscher liegt eine richterliche Bedeutung nahe. Das Verb kann jedoch auch „unterscheiden“ oder „scheiden“ bedeuten; diese Offenheit wird in einer Fußnote bewahrt.
- source_word: λαὸν φυλὰς ἡγιασμένου
  choice: das Volk … die Stämme des geheiligten Volkes
  rationale: „Die Stämme“ wird als erläuternde Apposition zu „das Volk“ verstanden. Das substantivierte Genitivpartizip im Singular ist syntaktisch gedrängt und wahrscheinlich kollektiv auf das geheiligte Volk bezogen; die Ergänzung „Volkes“ vermeidet die irreführende Vorstellung eines einzelnen Geheiligten.
theological_decisions:
- issue: Bezug von ἡγιασμένου
  choice: kollektiver Bezug auf das geheiligte Volk
  alternative: Bezug auf einen einzelnen „Geheiligten“ oder „Heiligen“
  rationale: Der Zusammenhang mit „Volk“ und „Stämmen“ spricht für eine kollektive Deutung. Da die griechische Singularform auch formal anders verstanden werden kann, wird die Alternative in der Fußnote genannt, statt dogmatisch ausgeschlossen zu werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Gedankenstrich macht die wahrscheinlich erläuternde Beziehung zwischen „das Volk“ und „die Stämme“ sichtbar. Die Feuer- und Goldmetaphorik bleibt erhalten; die syntaktische und semantische Unsicherheit der Schlusswendung wird nicht verschwiegen.
