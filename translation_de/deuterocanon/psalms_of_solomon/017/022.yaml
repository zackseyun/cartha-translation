base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/017/022.yaml
  text: The king was in lawlessness[a], and the judge in disobedience[c][b], and the people in sin.
translation:
  language: de
  text: Der König war[a] in Gesetzlosigkeit, der Richter in Ungehorsam[b] und das Volk in Sünde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Im Griechischen steht kein Verb. Wegen des vorausgehenden Erzählzusammenhangs wird hier „war“ ergänzt; möglich wäre auch eine Wiedergabe in der Gegenwart: „Der König ist in Gesetzlosigkeit …“.'
    reason: grammar_and_lexical_alternative
  - marker: b
    text: 'Oder: „Auflehnung“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: βασιλεὺς
  choice: König
  rationale: Die übliche politische Amtsbezeichnung wird direkt und ohne unnötige Verallgemeinerung wiedergegeben.
- source_word: ἐν
  choice: in
  rationale: Das dreimalige ἐν bezeichnet jeweils einen Zustand oder Bereich; die Wiederholung mit „in“ bewahrt Aufbau und Rhythmus des griechischen Satzes.
- source_word: παρανομίᾳ
  choice: Gesetzlosigkeit
  rationale: Die Wiedergabe erhält den rechtlich-moralischen Sinn des Verstoßes gegen Gesetz und geordnete Norm.
- source_word: κριτὴς
  choice: Richter
  rationale: „Richter“ ist die direkte und im Zusammenhang natürliche Bezeichnung des genannten Amtes.
- source_word: ἀπειθείᾳ
  choice: Ungehorsam
  rationale: Das Wort bezeichnet hier die Weigerung zu gehorchen; „Ungehorsam“ wahrt diese Bedeutung, ohne sie unnötig auf Unglauben einzuengen.
- source_word: λαὸς
  choice: Volk
  rationale: „Volk“ gibt das Kollektiv wieder, ohne einen stärkeren geopolitischen Akzent einzutragen.
- source_word: ἁμαρτίᾳ
  choice: Sünde
  rationale: Die knappe, geläufige Wiedergabe bewahrt den abschließenden Teil der dreigliedrigen Anklage.
theological_decisions:
- issue: Zeitform der griechischen Nominalsätze
  choice: 'Vergangenheit: „war“'
  alternative: 'Gegenwart: „ist“'
  rationale: Im Griechischen steht kein ausdrückliches Verb. Der vorausgehende Erzählzusammenhang legt jedoch eine Beschreibung vergangener Zustände nahe; deshalb wird „war“ ergänzt, während die Fußnote die grammatische Offenheit sichtbar macht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Dreierstruktur und das wiederholte „in“ folgen bewusst dem griechischen Parallelismus; nur im ersten Glied wird das ergänzte Verb ausgesprochen.
