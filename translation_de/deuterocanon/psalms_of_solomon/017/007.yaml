base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/017/007.yaml
  text: And they did not glorify your honored name[a]; in splendor they set up a kingdom because of their arrogance,
translation:
  language: de
  text: Und sie verherrlichten deinen hochgeehrten Namen nicht; in Pracht errichteten sie ein Königtum anstelle ihrer eigenen Hoheit.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, kontextuell: „wegen ihres Hochmuts“. Wörtlich: „anstelle ihrer Hoheit/Erhöhung“. Die griechische Wendung kann eine erhöhte Stellung oder Würde bezeichnen; die kausale Deutung ist aus dem Kontext erschlossen.'
    reason: Die knappe Wendung ἀντὶ ὕψους αὐτῶν wird im Haupttext mit der regulären Ersatzbedeutung von ἀντί wiedergegeben. Die Fußnote dokumentiert sowohl die wörtlichere Bedeutung von ὕψος als auch die kontextuelle Deutung, ohne diese als gesicherte Bedeutung des griechischen Wortlauts auszugeben.
lexical_decisions:
- source_word: οὐκ ἐδόξασαν
  choice: sie verherrlichten … nicht
  rationale: „Verherrlichen“ bewahrt den ausdrücklichen Bezug auf δόξα und bezeichnet hier, Gottes Namen Ehre und Herrlichkeit zu geben.
- source_word: τὸ ὄνομά σου τὸ ἔντιμον
  choice: deinen hochgeehrten Namen
  rationale: ἔντιμος bezeichnet etwas, das in Ehren steht oder hochgeschätzt ist. „Hochgeehrt“ ist würdig und im heutigen Deutsch verständlich.
- source_word: ἐν δόξῃ
  choice: in Pracht
  rationale: δόξα kann Herrlichkeit, Ehre oder Pracht bedeuten. Im Zusammenhang der Errichtung einer menschlichen Königsherrschaft gibt „Pracht“ den sichtbaren Glanz wieder, ohne ihn mit Gottes Herrlichkeit gleichzusetzen.
- source_word: ἔθεντο
  choice: errichteten sie
  rationale: τίθημι hat hier den Sinn, etwas einzusetzen oder zu etablieren. „Errichteten“ ist für eine Königsherrschaft natürlich und bewahrt die aktive politische Aussage.
- source_word: βασίλειον
  choice: ein Königtum
  rationale: Das Neutrum βασίλειον kann eine Königsherrschaft oder ein Königreich bezeichnen. „Königtum“ lässt offen, ob vor allem die Institution, Herrschaft oder das Reich gemeint ist.
- source_word: ἀντὶ ὕψους αὐτῶν
  choice: anstelle ihrer eigenen Erhöhung
  rationale: ἀντί mit Genitiv bedeutet regulär „anstelle von“, während ὕψος wörtlich „Höhe“ und übertragen „Erhöhung/Hoheit“ bezeichnet. Die bewusst knappe Formulierung bewahrt die Unschärfe des griechischen Textes; „eigenen“ verdeutlicht lediglich den possessiven Bezug von αὐτῶν.
theological_decisions:
- issue: Deutung von ἀντὶ ὕψους αὐτῶν als kausale Aussage über Hochmut
  choice: anstelle ihrer eigenen Erhöhung
  alternative: wegen ihres Hochmuts
  rationale: Die kausale Wiedergabe kann durch eine angenommene hebräische Vorlage und den historischen Kontext erklärt werden, ist aber aus dem überlieferten griechischen Wortlaut nicht eindeutig. Daher steht die formal naheliegende Ersatzbedeutung im Haupttext; die kontextuelle Alternative wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Parallelklang von „verherrlichten“ und „Pracht“ gibt die wiederholte δόξα-Wortfamilie sinngemäß wieder, ohne die politische Pracht als göttliche Herrlichkeit zu bezeichnen. Die ungewöhnliche Wendung am Versende bleibt wegen der echten textlichen Mehrdeutigkeit bewusst leicht sperrig.
