  naturalness: „Anstelle ihrer eigenen Erhöhung“ ist im Deutschen unnötig abstrakt und missverständlich, da „Erhöhung“ vor allem den Vorgang des Erhöhens bezeichnet. „Hoheit“ gibt ὕψος als erhöhte Stellung bzw. Würde natürlicher wieder und wahrt die knappe, etwas spannungsvolle Syntax des Griechischen.
  terminology: „Verherrlichten“, „hochgeehrten Namen“, „in Pracht“ und „Königtum“ sind im würdevollen modernen Standarddeutsch angemessen. „Hoheit“ ist hier gegenüber „Erhöhung“ die passendere Wiedergabe von ὕψος; die Fußnote hält zusätzlich die wörtlichere Möglichkeit offen.
