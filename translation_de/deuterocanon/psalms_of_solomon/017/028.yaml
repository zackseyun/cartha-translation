base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/017/028.yaml
  text: And he will gather a holy people[a], whom he will lead in righteousness[d][c][b]; and he will judge the tribes of the people sanctified by the Lord his God.
translation:
  language: de
  text: Und er wird ein heiliges Volk sammeln, das er in Gerechtigkeit[a] führen wird; und er wird die Stämme eines Volkes richten[b], das vom Herrn, seinem Gott, geheiligt worden ist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit Gerechtigkeit“ beziehungsweise „in Rechtschaffenheit“.'
    reason: lexical_alternative
  - marker: b
    text: „Richten“ kann in diesem königlichen Zusammenhang auch den weiteren Sinn „regieren“ oder „Recht schaffen“ haben.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνάξει
  choice: wird sammeln
  rationale: Das Verb bezeichnet das Zusammenbringen oder Versammeln von Menschen; „sammeln“ gibt die zukünftige Handlung knapp und natürlich wieder.
- source_word: λαὸν ἅγιον
  choice: ein heiliges Volk
  rationale: Die Wendung bewahrt den religiösen und gemeinschaftlichen Sinn von ἅγιος in geläufiger biblischer Sprache.
- source_word: ἀφήγήσεται
  choice: wird führen
  rationale: Im Zusammenhang bezeichnet das Verb das Führen oder Leiten eines Volkes; „führen“ ist im Deutschen klar und unverengt.
- source_word: ἐν δικαιοσύνῃ
  choice: in Gerechtigkeit
  rationale: Die substantivische Form wahrt die Ausdrucksweise des Griechischen und lässt sowohl sittige Rechtschaffenheit als auch gerechtes Handeln anklingen.
- source_word: κρινεῖ
  choice: wird richten
  rationale: „Richten“ bewahrt die Grundbedeutung von κρίνω; die im königlichen Kontext mögliche weitere Bedeutung „regieren“ wird in einer Fußnote offengehalten.
- source_word: φυλὰς λαοῦ ἡγιασμένου
  choice: die Stämme eines Volkes, das … geheiligt worden ist
  rationale: Der Genitiv Singular ἡγιασμένου bezieht sich auf λαοῦ, nicht auf die Stämme. „Eines Volkes“ spiegelt zudem das artikellose λαοῦ und die Parallele zu λαὸν ἅγιον wider.
- source_word: ὑπὸ Κυρίου θεοῦ αὐτοῦ
  choice: vom Herrn, seinem Gott
  rationale: Die Formulierung bewahrt sowohl die passive Urheberschaft als auch die persönliche Beziehung, die αὐτοῦ ausdrückt.
theological_decisions:
- issue: Bedeutungsumfang von δικαιοσύνη
  choice: in Gerechtigkeit
  alternative: in Recht / mit Gerechtigkeit
  rationale: „Gerechtigkeit“ wahrt die breite ethische und rechtliche Bedeutung des griechischen Ausdrucks, ohne ihn ausschließlich auf Rechtsprechung einzuengen.
- issue: Königlicher Sinn von κρίνω
  choice: richten
  alternative: regieren / Recht schaffen
  rationale: Die Grundbedeutung bleibt im Haupttext erhalten; zugleich wird die mögliche herrscherliche Bedeutung nicht ausgeschlossen.
- issue: Bezug und Bestimmtheit von λαοῦ ἡγιασμένου
  choice: eines Volkes, das … geheiligt worden ist
  alternative: des Volkes, das … geheiligt worden ist
  rationale: Das artikellose λαοῦ und die Parallele zum zuvor genannten „ein heiliges Volk“ sprechen für die unbestimmte Wiedergabe. Eine definite oder rückbezügliche Lesart ist grammatisch und im Zusammenhang dennoch möglich.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst erhaltener biblischer Begrifflichkeit. Der Satzbau folgt der griechischen Zweigliedrigkeit, bleibt aber im Deutschen flüssig; das Passiv „geheiligt worden ist“ bewahrt den vollendeten, von Gott bewirkten Vorgang.
