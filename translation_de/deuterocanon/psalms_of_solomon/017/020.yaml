  text: Those who loved the assemblies of the the pious fled from them; their scattering by lawless men spread over all the earth, because heaven held back from dripping rain upon the earth.
translation:
  language: de
  text: Diejenigen, die die Versammlungen[a] der Frommen liebten, flohen von ihnen weg. Über die ganze Erde hin wurden sie von Gesetzlosen zerstreut[b], denn der Himmel unterließ es, Regen auf die Erde träufeln zu lassen[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Zusammenkünfte“; möglicherweise auch „Gemeinden“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Über die ganze Erde hin geschah ihre Zerstreuung durch Gesetzlose.“'
    reason: formal_equivalence
  - marker: c
    text: 'Wörtlich: „den Regen auf die Erde träufeln zu lassen“; sinngemäß: „Regen auf die Erde fallen zu lassen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφυγοσαν ἀπʼ αὐτῶν
  choice: flohen vor ihnen
  rationale: Das Verb bezeichnet Flucht; ἀπό mit Genitiv benennt diejenigen, vor denen beziehungsweise von denen weg die Flucht erfolgt. Das deutsche Pronomen bewahrt den unbestimmten Rückbezug des Griechischen.
- source_word: συναγωγὰς
  choice: Versammlungen
  rationale: Gemeint sind Zusammenkünfte beziehungsweise versammelte Gemeinschaften. „Versammlungen“ ist verständlich und vermeidet eine vorschnelle institutionelle Festlegung auf „Synagogen“.
- source_word: ὁσίων
  choice: der Frommen
  rationale: Ὅσιοι bezeichnet hier Menschen, die durch Frömmigkeit und Treue gekennzeichnet sind. „Die Frommen“ bildet dies besser ab als das stärker mit ἅγιοι verbundene „die Heiligen“.
- source_word: εἰς πᾶσαν τὴν γῆν ἐγενήθη σκορπισμὸς αὐτῶν
  choice: Über die ganze Erde hin wurden sie … zerstreut
  rationale: Die verbale deutsche Fassung gibt das Ergebnis des nominalen griechischen Ausdrucks natürlich wieder und behält dessen weltweite Ausdehnung bei.
- source_word: ὑπὸ ἀνόμων
  choice: von Gesetzlosen
  rationale: Die Präposition bezeichnet die handelnden Urheber. „Gesetzlose“ bewahrt die rechtlich-moralische Bedeutung von ἄνομος, ohne ein im Griechischen nicht ausgedrücktes Geschlecht hinzuzufügen.
- source_word: ἀνέσχεν ὁ οὐρανὸς
  choice: der Himmel hielt sich zurück
  rationale: ἀνέχω mit dem folgenden Infinitiv bezeichnet hier das Unterlassen beziehungsweise Zurückhalten der Handlung; die Personifikation des Himmels bleibt erhalten.
- source_word: τοῦ στάξαι ὑετὸν
  choice: Regen … träufeln zu lassen
  rationale: στάζω bedeutet wörtlich „träufeln“ oder „tropfen lassen“. Die Formulierung wahrt das konkrete Bild und bleibt im Deutschen verständlich.
theological_decisions:
- issue: Referenz von ἀπʼ αὐτῶν („vor ihnen“)
  choice: Das Pronomen bleibt ohne ausdrückliche Identifizierung stehen.
  alternative: „vor den Gesetzlosen“ oder ein anderer aus dem weiteren Kontext ergänzter Bezug
  rationale: Der unmittelbare griechische Satz nennt das Bezugswort nicht eindeutig. Eine ausdrückliche Identifizierung würde die echte syntaktische Mehrdeutigkeit auflösen.
- issue: Kausaler Anschluss mit ὅτι
  choice: „denn“
  alternative: „weil“
  rationale: ὅτι führt einen begründenden Zusammenhang ein. „Denn“ bewahrt ihn, ohne die genaue Art der Beziehung zwischen Zerstreuung und ausbleibendem Regen stärker festzulegen, als der Text es tut.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau wurde für gute Verständlichkeit in zwei Sätze gegliedert. Die Personifikation des Himmels und das ungewöhnlich konkrete Bild des träufelnden Regens wurden bewahrt; institutionelle und konfessionelle Festlegungen wurden vermieden.
