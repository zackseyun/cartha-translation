base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/017/005.yaml
  text: You[a], Lord, chose David as king over Israel, and you swore to him concerning his offspring forever[b], that his kingdom would not fail before you.
translation:
  language: de
  text: Du, Herr, hast David zum König über Israel erwählt, und du hast ihm im Blick auf seine Nachkommen[a] für immer geschworen, dass seine Königsherrschaft[b] vor dir nicht aufhören werde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich „seinen Samen“, das heißt: seine Nachkommenschaft.'
    reason: lexical_alternative
  - marker: b
    text: Oder „sein Königreich“ oder „sein Königtum“.
    reason: lexical_ambiguity
lexical_decisions:
- source_word: σύ, Κύριε
  choice: Du, Herr
  rationale: Das ausdrücklich gesetzte Pronomen σύ wird beibehalten und gibt der direkten Anrede Nachdruck; Κύριε bezeichnet hier Gott und wird traditionsgemäß wie gegenwartssprachlich mit „Herr“ wiedergegeben.
- source_word: ᾑρέτισω
  choice: hast … erwählt
  rationale: Das Verb bezeichnet Gottes Auswahl Davids. „Erwählt“ wahrt den theologischen und königlichen Zusammenhang, ohne einen zusätzlichen Einsetzungsritus vorauszusetzen.
- source_word: βασιλέα ἐπʼ Ἰσραήλ
  choice: zum König über Israel
  rationale: Die Präposition ἐπί bezeichnet hier den Herrschaftsbereich. Die deutsche Wendung ist idiomatisch und bleibt der griechischen Aussage eng verbunden.
- source_word: περὶ τοῦ σπέρματος
  choice: in Bezug auf seine Nachkommen
  rationale: σπέρμα bezeichnet in diesem Zusammenhang Davids fortbestehende Abstammungslinie. „Nachkommen“ ist im modernen Deutsch klar; die wörtliche Bildsprache wird in einer Fußnote bewahrt.
- source_word: εἰς τὸν αἰῶνα
  choice: für immer
  rationale: In der Sprache einer göttlichen Verheißung drückt die Wendung unbegrenzte Dauer aus. „Für immer“ ist natürlich und lässt den feierlichen Charakter bestehen.
- source_word: τοῦ μὴ ἐκλείπειν
  choice: dass … nicht aufhören werde
  rationale: Der Infinitiv erläutert den Inhalt beziehungsweise die Folge des Schwurs. „Nicht aufhören“ gibt das Ausbleiben oder Erlöschen der davidischen Herrschaft klar wieder.
- source_word: ἀπέναντί σου
  choice: vor dir
  rationale: Die knappe Formulierung bewahrt sowohl die räumliche Bildsprache als auch den Gedanken des Fortbestands in Gottes Gegenwart und Anerkennung.
- source_word: βασίλειον αὐτοῦ
  choice: seine Königsherrschaft
  rationale: βασίλειον kann das Königreich, das Königtum oder die dynastische Herrschaft bezeichnen. „Königsherrschaft“ passt zur vorausgehenden Aussage über die Nachkommenschaft, ohne die lexikalische Mehrdeutigkeit völlig auf eine Dynastie einzuengen.
theological_decisions:
- issue: Die davidische Verheißung verbindet Nachkommenschaft und bleibende Herrschaft
  choice: „dass seine Königsherrschaft vor dir nicht aufhören werde“
  alternative: „dass sein Königreich vor dir nicht untergehen werde“ oder „dass seine Dynastie vor dir nicht erlöschen werde“
  rationale: Der griechische Text verbindet σπέρμα mit βασίλειον und lässt damit sowohl den Fortbestand der davidischen Linie als auch ihrer königlichen Herrschaft anklingen. Die Hauptfassung hält beides zusammen, ohne die Aussage ausschließlich als politisches Reich oder als technische Dynastiebezeichnung festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Satzführung. Die zweimalige Wiedergabe von σύ durch „Du“ beziehungsweise „du“ erhält den Nachdruck der griechischen Anrede. Der Konjunktiv „werde“ markiert den Inhalt des feierlichen Schwurs.
