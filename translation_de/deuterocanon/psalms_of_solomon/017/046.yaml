  yaml_path: translation/deuterocanon/psalms_of_solomon/017/046.yaml
  text: With equity he will lead them all[b][a], and there will be no arrogance among them to oppress one another.
translation:
  language: de
  text: Er wird sie alle gerecht führen, und unter ihnen wird es keinen Hochmut geben, durch den jemand unter ihnen unterdrückt wird.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „und unter ihnen wird es keinen Hochmut geben zum/um unter ihnen unterdrückt zu werden“. Der griechische Infinitiv „unterdrückt zu werden“ ist formal passiv, und seine Verbindung mit „Hochmut“ ist schwierig. Der Haupttext gibt den wahrscheinlichen Sinn wieder: Hochmut wird innerhalb der Gemeinschaft nicht dazu führen, dass jemand unterdrückt wird. Möglich ist auch eine freiere aktive Wiedergabe: „um einander zu unterdrücken“.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν ἰσότητι
  choice: in Gleichheit
  rationale: Die Wendung bewahrt den Grundsinn von ἰσότης als Gleichheit beziehungsweise gleichberechtigte, unparteiische Behandlung; im Zusammenhang beschreibt sie die Art seines Führens.
- source_word: πάντας αὐτοὺς
  choice: sie alle
  rationale: Die Formulierung gibt die umfassende und betonte Aussage idiomatisch wieder.
- source_word: ἄξει
  choice: wird er … führen
  rationale: ἄγω bedeutet hier sachgerecht „führen“ und passt zum leitenden beziehungsweise hirtenähnlichen Kontext.
- source_word: ὑπερηφανία
  choice: Hochmut
  rationale: Das Wort bezeichnet eine überhebliche, sich über andere erhebende Haltung; „Hochmut“ ist würdig, verständlich und in diesem Kontext präzise.
- source_word: τοῦ καταδυναστευθῆναι
  choice: sodass jemand … unterdrückt wird
  rationale: Der griechische Aoristinfinitiv ist formal passiv. Die resultative Wiedergabe wahrt diese Form und bringt zugleich den wahrscheinlichen sozialen Sinn der schwierigen Konstruktion verständlich zum Ausdruck.
- source_word: ἐν αὐτοῖς
  choice: unter ihnen
  rationale: Bei einer Gruppe von Personen ist „unter ihnen“ die natürliche deutsche Entsprechung; die Wiederholung im griechischen Satz bleibt erhalten.
theological_decisions:
- issue: Sozialer Charakter der Herrschaft des Königs
  choice: Der König führt alle gleich und in seiner Gemeinschaft führt Hochmut nicht zur Unterdrückung Einzelner.
  alternative: 'Die Schlusswendung aktiv wiederzugeben: „um einander zu unterdrücken“.'
  rationale: Die Übersetzung hält an der formal passiven Gestalt von καταδυναστευθῆναι fest und bewahrt damit die Spannung des überlieferten griechischen Textes, ohne den ethisch-sozialen Zusammenhang zu verlieren.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung „unter ihnen“ folgt bewusst dem griechischen Text; die schwierige passive Schlusskonstruktion wird im Haupttext lesbar bewahrt und in der Fußnote erläutert.
