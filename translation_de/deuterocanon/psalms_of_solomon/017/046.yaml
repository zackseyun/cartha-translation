revisions:
- from: In Gleichheit wird er sie alle führen, und unter ihnen wird es keinen Hochmut geben, sodass jemand unter ihnen unterdrückt wird.[a]
  to: Er wird sie alle gerecht führen, und unter ihnen wird es keinen Hochmut geben, durch den jemand unter ihnen unterdrückt wird.[a]
  rationale: Die Revision ersetzt die unidiomatische Wendung „in Gleichheit“ durch eine kontextgerechte deutsche Formulierung und behebt die fehlerhafte Satzlogik im Schlussglied. Sie belässt καταδυναστευθῆναι im Haupttext passiv, bewahrt die zweite Nennung von ἐν αὐτοῖς („unter ihnen“) und erläutert die syntaktische Unsicherheit transparent in der Fußnote. Die aktive Alternative wird lediglich als mögliche sinngemäße Lesart ausgewiesen.
