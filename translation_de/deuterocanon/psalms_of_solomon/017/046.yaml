review_pass:
  verdict: revise
  source_fidelity: 'Die Übersetzung gibt die umfassende Führung (πάντας αὐτούς; ἄξει), die Gleichbehandlung bzw. Unparteilichkeit (ἐν ἰσότητι) und die zweimalige Binnenperspektive ἐν αὐτοῖς grundsätzlich wieder. Die Schlusswendung enthält jedoch einen formal passiven, syntaktisch schwierigen Infinitiv. Der bisherige Haupttext („sodass jemand … unterdrückt wird“) ist im Deutschen logisch und syntaktisch nicht tragfähig: Das bloße Nichtvorhandensein von Hochmut kann nicht mit „sodass“ unmittelbar als Ursache einer Unterdrückung verbunden werden. Eine vorsichtige relative Umschreibung bewahrt die passive Aussage, ohne eine aktive Lesart als Textbestand auszugeben.'
  naturalness: „In Gleichheit“ ist im heutigen Standarddeutsch als Beschreibung einer Führungsweise unidiomatisch. „Sie alle gerecht führen“ ist natürlich und vermittelt im Kontext den Sinn von ἐν ἰσότητι als gerechte, unparteiische Behandlung. Die revidierte Schlusskonstruktion ist verständlich, würdig und erhält die Wiederholung von „unter ihnen“.
  terminology: „gerecht“ für ἐν ἰσότητι ist hier angemessen, ohne den Begriff auf bloße mathematische Gleichheit zu verengen. „Hochmut“ trifft ὑπερηφανία im gehobenen, aber modernen biblischen Register. „Unterdrückt wird“ bewahrt die formale Passivität von καταδυναστευθῆναι; die Fußnote kennzeichnet die unsichere Verknüpfung mit „Hochmut“ als Auslegung der schwierigen Konstruktion.
  issues:
  - severity: medium
    issue: Die kausale/resultative Verbindung „und ... keinen Hochmut geben, sodass jemand ... unterdrückt wird“ ist im Deutschen widersprüchlich und nicht als Satzlogik verständlich.
    rationale: Der griechische articular infinitive τοῦ καταδυναστευθῆναι ist zwar schwierig und wohl resultativ zu verstehen, aber die deutsche Formulierung lässt das Fehlen von Hochmut gerade zur Folge der Unterdrückung werden. Die Beziehung muss explizit und vorsichtig als durch Hochmut verursachte Unterdrückung formuliert werden.
  - severity: low
    issue: „In Gleichheit“ ist eine zu wörtliche und unnatürliche Wiedergabe von ἐν ἰσότητι.
    rationale: Im Herrschafts- und Führungskontext bezeichnet ἰσότης gerechte bzw. unparteiische Behandlung. „Er wird sie alle gerecht führen“ ist idiomatisches modernes Deutsch und bleibt dem griechischen Sinn treu.
