base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/017/031.yaml
  text: And no sojourner or foreigner shall sojourn among them any longer[a]; he will judge peoples and nations in the wisdom of his righteousness[d][c][b]. Selah.
translation:
  language: de
  text: Kein ansässiger Fremder und kein Ausländer wird noch bei ihnen wohnen[a]. Er wird Völker und Nationen in der Weisheit seiner Gerechtigkeit richten[b]. Sela.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Kein Beisasse und kein Ausländer wird noch bei ihnen wohnen.« Das erste Substantiv und das Verb sind im Griechischen miteinander verwandt.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »in der Weisheit seiner Rechtschaffenheit«. Die griechische Verbindung kann sowohl die gerechte Art des Richtens als auch die sittliche Qualität des Richters hervorheben.'
    reason: lexical_alternative
  - marker: c
    text: »Sela« bezeichnet wahrscheinlich eine liturgische oder musikalische Zäsur; seine genaue Bedeutung ist ungewiss.
    reason: cultural_note
lexical_decisions:
- source_word: πάροικος
  choice: ansässiger Fremder
  rationale: Der Ausdruck bezeichnet jemanden, der bei einem Volk wohnt, ohne zu den Einheimischen zu gehören. »Ansässiger Fremder« gibt diese Verbindung von Wohnsitz und Außenseiterstatus in verständlichem modernem Deutsch wieder.
- source_word: ἀλλογενής
  choice: Fremdstämmiger
  rationale: Das Wort hebt die andere Herkunft hervor. »Fremdstämmiger« wahrt die Unterscheidung zum ansässigen Fremden, ohne den Ausdruck mit πάροικος gleichzusetzen.
- source_word: παροικήσει
  choice: wird … bei ihnen wohnen
  rationale: Das Verb bezeichnet das Wohnen bei oder unter anderen als Nicht-Einheimischer. Eine wörtliche Wiedergabe der griechischen Wortverwandtschaft mit πάροικος wäre im Deutschen unnatürlich.
- source_word: λαούς
  choice: Völker
  rationale: Der Plural bezeichnet kollektive Bevölkerungsgruppen und bleibt gegenüber dem folgenden ἔθνη eigenständig.
- source_word: ἔθνη
  choice: Nationen
  rationale: »Nationen« erhält die Paarung mit »Völker«, ohne ἔθνη kontextlos auf »Heiden« festzulegen.
- source_word: σοφίᾳ
  choice: Weisheit
  rationale: Im königlich-richterlichen Zusammenhang bezeichnet der Ausdruck weise Einsicht und Urteilsfähigkeit.
- source_word: δικαιοσύνης
  choice: Gerechtigkeit
  rationale: »Gerechtigkeit« umfasst im Deutschen sowohl die sittliche Rechtschaffenheit als auch die gerechte Ausübung des Gerichts und bewahrt damit die Spannweite des griechischen Ausdrucks.
- source_word: διάψαλμα
  choice: Sela
  rationale: Die traditionelle Transliteration bewahrt die Unsicherheit über die genaue liturgische oder musikalische Funktion des Ausdrucks.
theological_decisions:
- issue: Bedeutung von δικαιοσύνη im königlich-richterlichen Zusammenhang
  choice: seiner Gerechtigkeit
  alternative: seiner Rechtschaffenheit
  rationale: Da vom Richten die Rede ist, liegt die gerichtliche Dimension nahe; zugleich kann δικαιοσύνη die umfassendere sittliche Qualität des Herrschers bezeichnen. »Gerechtigkeit« lässt beide Aspekte offen.
- issue: Verhältnis des Genitivs δικαιοσύνης zu σοφίᾳ
  choice: in der Weisheit seiner Gerechtigkeit
  alternative: mit der Weisheit, die seiner Gerechtigkeit entspricht
  rationale: Die ungewöhnliche griechische Genitivverbindung wird bewusst erhalten, statt sie eindeutig als Herkunft, Eigenschaft oder Maßstab auszulegen.
translation_notes:
  register: Moderne, würdige Psalmensprache. Die seltenere Formulierung »ansässiger Fremder« ist sachlich präzise und allgemein verständlicher als das altertümliche »Beisasse«. Die auffällige Wendung »in der Weisheit seiner Gerechtigkeit« bleibt bewusst nahe am Griechischen, um dessen Mehrdeutigkeit nicht aufzulösen.
