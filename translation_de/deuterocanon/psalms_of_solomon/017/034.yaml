review_pass:
  verdict: approve
  source_fidelity: Die Übersetzung bewahrt die vom vorausgehenden Satz abhängige Zweck-/Folgesyntax des Infinitivs ἔρχεσθαι mit „damit … kommen“. „Völker“, „vom Ende der Erde“, „seine Herrlichkeit“ und die Wiedergabe der Söhne selbst als Gaben entsprechen dem griechischen Wortlaut und seiner Bildsprache. „kraftlos gewordenen“ gibt den resultativen Charakter des Perfektpartizips ἐξησθενηκότας angemessen wieder.
  naturalness: Der Teilsatz ist in modernem Standarddeutsch klar und angemessen würdevoll. Die Koordination „kommen, um … zu sehen, und … bringen“ ist trotz der griechischen Partizipialkonstruktion gut verständlich und stellt keinen Sinnverlust dar.
  terminology: „Herrlichkeit“ ist für δόξα passend; „Völker“ vermeidet die stärker auslegende Engführung von „Heiden“. „Söhne“ erhält den maskulinen Plural υἱούς. Das Pronomen „ihre“ lässt den kontextuellen Bezug auf Jerusalem bestehen, ohne ihn über den griechischen Wortlaut hinaus auszubauen.
