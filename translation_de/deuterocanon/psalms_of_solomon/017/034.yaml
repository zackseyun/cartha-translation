  yaml_path: translation/deuterocanon/psalms_of_solomon/017/034.yaml
  text: for nations to come from the end of the earth to see his glory[a], bringing her weakened sons as gifts[b],
translation:
  language: de
  text: damit Völker vom Ende der Erde kommen, um seine Herrlichkeit zu sehen, und ihre kraftlos gewordenen Söhne als Gaben bringen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihre entkräfteten Söhne als Gaben bringen“.'
    reason: Das griechische Partizip kann den erreichten Zustand als „kraftlos geworden“, „geschwächt“ oder „entkräftet“ ausdrücken.
lexical_decisions:
- source_word: ἔρχεσθαι
  choice: damit … kommen
  rationale: Der Infinitiv hängt syntaktisch vom vorausgehenden Satz ab und bezeichnet Zweck oder Folge; er ist daher nicht als selbstständige Zukunftsaussage wiedergegeben.
- source_word: ἔθνη
  choice: Völker
  rationale: Gemeint sind die nichtisraelitischen Völker allgemein. „Völker“ ist im Deutschen natürlich und vermeidet eine unnötige Festlegung auf „Heiden“.
- source_word: ἀπ’ ἄκρου τῆς γῆς
  choice: vom Ende der Erde
  rationale: Die Formulierung bewahrt den Singular des Griechischen und bezeichnet bildhaft äußerste Ferne.
- source_word: ἰδεῖν τὴν δόξαν αὐτοῦ
  choice: um seine Herrlichkeit zu sehen
  rationale: Der Infinitiv wird als Zweckangabe wiedergegeben; „Herrlichkeit“ erhält das religiöse Gewicht von δόξα.
- source_word: φέροντες δῶρα
  choice: als Gaben bringen
  rationale: 'δῶρα steht sachlich zu den Söhnen in Apposition: Die Söhne selbst werden als Gaben gebracht.'
- source_word: τοὺς ἐξησθενηκότας
  choice: die kraftlos gewordenen
  rationale: Das Perfektpartizip bezeichnet einen eingetretenen Zustand. Die Formulierung lässt offen, ob körperliche Erschöpfung oder allgemeinere Schwächung gemeint ist.
- source_word: υἱοὺς αὐτῆς
  choice: ihre … Söhne
  rationale: Der maskuline Plural wird als „Söhne“ bewahrt; das feminine Pronomen verweist im Kontext auf Jerusalem.
theological_decisions:
- issue: Bezug von αὐτῆς
  choice: „ihre“ mit Bezug auf Jerusalem
  alternative: Bezug auf die Erde oder ein anderes feminines Bezugswort
  rationale: Im Zusammenhang ist Jerusalem das naheliegende feminine Bezugswort und die Mutter der zurückgebrachten Söhne; die Übersetzung lässt den Bezug durch das Pronomen formal unausgesprochen.
translation_notes:
  register: Moderne, würdige Standardsprache. Der Vers bleibt als syntaktisch vom vorhergehenden Satz abhängiger Teilsatz stehen; die ungewöhnliche Vorstellung, dass Jerusalems geschwächte Söhne von den Völkern als Gaben gebracht werden, wird nicht geglättet.
