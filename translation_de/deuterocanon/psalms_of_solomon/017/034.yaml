  text: ἔρχεσθαι ἔθνη ἀπ’ ἄκρου τῆς γῆς ἰδεῖν τὴν δόξαν αὐτοῦ, φέροντες δῶρα τοὺς ἐξησθενηκότας υἱοὺς αὐτῆς,
