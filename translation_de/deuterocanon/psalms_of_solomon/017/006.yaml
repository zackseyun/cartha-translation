  text: And in our sins sinners rose up against us[a]; they attacked us and drove us out[c][b]. Those to whom you had not promised it took it away by force.
translation:
  language: de
  text: Und wegen unserer Sünden erhoben sich Sünder gegen uns; sie griffen uns an und vertrieben uns. Die, denen du es nicht verheißen hattest, nahmen es mit Gewalt an sich.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich steht beim letzten Verb kein Gegenstand; der griechische Text sagt nicht ausdrücklich, was sie mit Gewalt an sich nahmen.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ταῖς ἁμαρτίαις ἡμῶν
  choice: wegen unserer Sünden
  rationale: Die Präposition ἐν bezeichnet hier im Zusammenhang den Anlass beziehungsweise den schuldhaften Hintergrund. „Wegen unserer Sünden“ gibt diesen Zusammenhang in natürlichem Deutsch wieder, ohne die Verantwortung der Sprecher abzuschwächen.
- source_word: ἐπανέστησαν ἡμῖν
  choice: erhoben sich gegen uns
  rationale: Das Verb bezeichnet ein feindliches Aufstehen oder Auftreten gegen jemanden. Die gewählte Formulierung bewahrt dieses Bild und den adversativen Sinn.
- source_word: ἐπέθεντο ἡμῖν
  choice: sie griffen uns an
  rationale: Im Zusammenhang mit Vertreibung und gewaltsamer Aneignung bezeichnet das Verb einen tätlichen Angriff; „griffen uns an“ ist klar und idiomatisch.
- source_word: ἐξώσαντο ἡμᾶς
  choice: vertrieben uns
  rationale: Das Verb drückt ein gewaltsames Hinausdrängen aus. „Vertrieben“ ist prägnant und bewahrt die erzwungene Entfernung.
- source_word: οἷς
  choice: denen
  rationale: 'Das maskuline Relativpronomen im Dativ Plural verweist auf die zuvor genannten Sünder: Es sind diejenigen, denen die angesprochene Person nichts verheißen hatte.'
- source_word: ἐπηγγείλω
  choice: du … verheißen hattest
  rationale: Die Form ist Aorist Medium Indikativ, zweite Person Singular, und setzt die Anrede an Gott fort. Das Plusquamperfekt verdeutlicht im Deutschen, dass die ausbleibende Verheißung der gewaltsamen Aneignung vorausliegt.
- source_word: μετὰ βίας ἀφείλαντο
  choice: nahmen es mit Gewalt an sich
  rationale: Die Wendung bezeichnet gewaltsames Wegnehmen beziehungsweise Aneignen. Das idiomatische „mit Gewalt an sich nehmen“ bewahrt den Zwangsaspekt; das im Deutschen notwendige Pronomen wird durch eine Fußnote als im Griechischen unausgedrückt kenntlich gemacht.
theological_decisions:
- issue: Person des Subjekts von ἐπηγγείλω
  choice: Die zweite Person Singular wird als „du“ wiedergegeben, ohne die angesprochene Person im Vers eigens zu benennen.
  alternative: Eine unpersönliche Formulierung wie „was ihnen nicht verheißen worden war“
  rationale: Die griechische Verbform ist zweite Person Singular und führt wahrscheinlich die Gottesanklage beziehungsweise Gottesanrede aus dem Kontext fort. Eine unpersönliche Wiedergabe würde dieses grammatische Merkmal tilgen.
- issue: Unausgedrücktes Objekt bei ἀφείλαντο
  choice: Im deutschen Haupttext steht das grammatisch erforderliche „es“, ohne den Gegenstand näher zu bestimmen.
  alternative: Ein konkretes Objekt wie „das Reich“, „das Land“ oder „das Erbe“ einsetzen
  rationale: Der griechische Text nennt den weggenommenen Gegenstand nicht. Eine konkrete Ergänzung würde eine mögliche Deutung zur ausdrücklichen Aussage machen.
- issue: Bezug von οἷς
  choice: 'Das Relativpronomen bezieht sich auf die feindlichen Sünder: „Die, denen du …“'
  alternative: Umformung zu „Was du ihnen nicht verheißen hattest …“
  rationale: οἷς ist maskuliner Dativ Plural, nicht ein neutrales Relativpronomen. Daher bezeichnet es Personen, denen nichts verheißen war, und nicht die weggenommene Sache.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallelen feindlichen Handlungen bleiben knapp und rhythmisch. „Verheißen“ entspricht dem biblisch-theologischen Kontext, ist aber im heutigen Deutsch weiterhin verständlich. Die echte Leerstelle beim Gegenstand der gewaltsamen Aneignung wird nicht durch eine konkrete Deutung gefüllt.
