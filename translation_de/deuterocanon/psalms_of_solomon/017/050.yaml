base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/017/050.yaml
  text: Blessed are those who are alive in those days[a], to see the good things of Israel in the assembly of the tribes. May God bring it to pass!
translation:
  language: de
  text: Selig sind, die in jenen Tagen leben[a] und das Gute Israels in der Versammlung der Stämme sehen. Möge Gott es vollbringen![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: die in jenen Tagen geboren werden.'
    reason: γενόμενοι kann enger das Geborenwerden oder weiter das Dasein beziehungsweise Leben in jener Zeit bezeichnen.
  - marker: b
    text: 'Oder als Anschluss an den vorhergehenden Satz: das Gott vollbringen wird.'
    reason: Die knappe griechische Schlusswendung ποιῆσαι ὁ θεός kann als eigenständiger Wunsch oder als inhaltlich an das zuvor genannte Gute angeschlossen verstanden werden.
lexical_decisions:
- source_word: μακάριοι
  choice: Glücklich zu preisen sind
  rationale: Die feste Seligpreisungsformel wahrt den gehobenen biblischen Ton und bezeichnet mehr als ein bloßes momentanes Glück.
- source_word: οἱ γενόμενοι ἐν ταῖς ἡμέραις ἐκείναις
  choice: alle, die in jenen Tagen leben
  rationale: γενόμενοι bezeichnet wörtlich diejenigen, die in jenen Tagen ins Dasein kommen beziehungsweise dann da sind. Im Zusammenhang sind die Menschen gemeint, die jene künftige Zeit erleben; die mögliche engere Bedeutung „geboren werden“ bleibt in der Fußnote erhalten.
- source_word: ἰδεῖν
  choice: sehen
  rationale: Der Infinitiv bezeichnet, was die Glücklichgepriesenen erleben dürfen. Das schlichte „sehen“ entspricht dem Griechischen und klingt im Deutschen natürlich.
- source_word: τὰ ἀγαθὰ Ἰσραήλ
  choice: das Gute Israels
  rationale: Die Formulierung bleibt nahe am substantivierten Plural τὰ ἀγαθά und lässt die Beziehung des Genitivs Ἰσραήλ bewusst offen, statt sie eindeutig als „für Israel“ oder als „Segnungen Israels“ auszulegen.
- source_word: ἐν συναγωγῇ φυλῶν
  choice: in der Versammlung der Stämme
  rationale: συναγωγή bezeichnet hier das Zusammenkommen beziehungsweise die Versammlung. Die nominale Wiedergabe bewahrt das Bild der vereinten Stämme.
- source_word: ποιῆσαι ὁ θεός
  choice: Möge Gott es vollbringen!
  rationale: Die knappe Schlusswendung folgt nach einem Hochpunkt und lässt sich als selbstständiger Wunsch verstehen. „Vollbringen“ gibt ποιεῖν in diesem Zusammenhang würdig und ohne sachliche Ergänzungen wieder.
theological_decisions:
- issue: Bezug von τὰ ἀγαθὰ Ἰσραήλ
  choice: das Gute Israels
  alternative: das Gute für Israel / Israels Segnungen
  rationale: Der griechische Genitiv kann unterschiedlich bestimmt werden. Die gewählte Form wahrt diese Offenheit und legt weder Besitz noch Empfängerrichtung ausschließlich fest.
- issue: Funktion von ποιῆσαι ὁ θεός
  choice: 'selbstständiger Gebetswunsch: „Möge Gott es vollbringen!“'
  alternative: 'Anschluss an das Vorhergehende: „das Gott vollbringen wird“'
  rationale: Der Hochpunkt vor der Wendung sowie die knappe volitive Ausdrucksweise sprechen für einen abschließenden Wunsch. Da die infinitivische Form auch anders angeschlossen werden kann, wird die alternative Deutung in einer Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit biblischem Seligpreisungston. Die Syntax ist für heutige Leser geglättet, ohne die Mehrdeutigkeit des Genitivs oder der knappen Schlusswendung zu verdecken.
