  yaml_path: translation/deuterocanon/psalms_of_solomon/009/016.yaml
  text: And now you are God, and we are your people whom you loved. Look and have compassion, O God of Israel, because we are yours; and do not withdraw your mercy from us, lest they attack us.
translation:
  language: de
  text: 'Und nun: Du bist Gott, und wir sind dein Volk, das du geliebt hast. Sieh und hab Erbarmen, du Gott Israels, denn wir gehören dir. Entziehe uns dein Erbarmen nicht, damit sie uns nicht angreifen.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἰκτείρησον
  choice: hab Erbarmen
  rationale: Gibt den Imperativ natürlich und würdevoll wieder und bewahrt den Gedanken mitfühlender Barmherzigkeit.
- source_word: ὅτι σοί ἐσμεν
  choice: denn wir gehören dir
  rationale: Natürliches Deutsch für die wörtliche Aussage „denn wir sind dein“, mit bewahrtem Zugehörigkeitsgedanken.
- source_word: μὴ ἀποστῇς ἔλεός σου ἀφʼ ἡμῶν
  choice: Entziehe uns dein Erbarmen nicht
  rationale: Gibt das Entfernen beziehungsweise Zurückziehen des göttlichen Erbarmens idiomatisch wieder, ohne den Sinn abzuschwächen.
- source_word: ἐπιθῶνται ἡμῖν
  choice: sie uns nicht angreifen
  rationale: Der mediale Aoristkonjunktiv von ἐπιτίθημι bezeichnet hier ein feindliches Vorgehen gegen die Betenden; „angreifen“ ist klar und kontextgerecht.
theological_decisions:
- issue: Zeitlicher beziehungsweise folgernder Sinn von καὶ νῦν
  choice: Und nun
  alternative: Auch jetzt
  rationale: „Und nun“ wahrt den einfachen Übergang des griechischen Textes, ohne eine zusätzliche Aussage über fortdauerndes Gottsein einzutragen.
- issue: Bezeichnung des Bundesverhältnisses
  choice: wir gehören dir
  alternative: wir sind dein
  rationale: Die idiomatische Fassung bewahrt die Zugehörigkeit Israels zu Gott und legt keine spezifische konfessionelle Deutung darüber hinaus fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter Gebetssprache. Die Anrede „du Gott Israels“ bleibt nahe am griechischen Vokativ; keine Fußnoten erforderlich.
