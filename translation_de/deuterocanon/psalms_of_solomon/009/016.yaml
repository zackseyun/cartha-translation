  source_fidelity: 'Die Übersetzung gibt die Satzstruktur und den Sinn des Griechischen insgesamt zuverlässig wieder: Gottes Anrede, Israels Zugehörigkeit zu ihm, die Bitte um Erbarmen und die abschließende Abwehr feindlichen Angriffs bleiben erhalten. „Entziehe uns dein Erbarmen nicht“ entspricht μὴ ἀποστῇς ἔλεός σου ἀφʼ ἡμῶν idiomatisch und präzise. Für ἴδε ist jedoch „Sieh her“ leicht stärker bzw. räumlicher als das einfache „Sieh“; die knappe imperativische Bitte sollte ohne diesen Zusatz stehen.'
  naturalness: Die Gebetssprache ist modernes, würdiges Standarddeutsch. „Sieh und hab Erbarmen“ ist in diesem Register natürlicher und zugleich näher am knappen griechischen ἴδε καὶ οἰκτείρησον als „Sieh her und hab Erbarmen“.
