base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/009/007.yaml
  text: Our deeds are within the choice and power of our soul[d][c][b][a], to do righteousness and unrighteousness with the works of our hands.
translation:
  language: de
  text: In der Wahl[a] und Macht[b] unserer Seele liegt es, durch die Werke unserer Hände[c] Gerechtigkeit und Ungerechtigkeit zu tun.
  philosophy: optimal-equivalence
  footnotes:
