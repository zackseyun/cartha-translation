revisions:
- from: 'Unsere Taten liegen in der Wahl[a] und Macht[b] unserer Seele: Gerechtigkeit und Ungerechtigkeit durch die Werke unserer Hände[c] zu tun.'
  to: In der Wahl[a] und Macht[b] unserer Seele liegt es, durch die Werke unserer Hände[c] Gerechtigkeit und Ungerechtigkeit zu tun.
  rationale: Die Revision ersetzt die im Deutschen unnatürliche Formulierung „Unsere Taten liegen ...“ durch eine idiomatische unpersönliche Konstruktion, ohne die Aussage über menschliche moralische Handlungsfähigkeit abzuschwächen. Die Schlüsselbegriffe und die Gegenüberstellung von Gerechtigkeit und Ungerechtigkeit bleiben erhalten; die Fußnote zum instrumentalen Dativ wird präzisiert.
