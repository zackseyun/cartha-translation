    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ἔργα ἡμῶν
  choice: unsere Taten
  rationale: „Taten“ bezeichnet natürliche und zugleich moralisch bedeutsame Handlungen; „Werke“ bleibt für die konkrete Wendung am Versende erhalten.
- source_word: ἐκλογῇ
  choice: Wahl
  rationale: Gemeint ist hier das menschliche Wählen beziehungsweise die moralische Entscheidung, nicht eine theologische Erwählung.
- source_word: ἐξουσίᾳ
  choice: Macht
  rationale: „Macht“ gibt in diesem Zusammenhang die tatsächliche Handlungs- und Verfügungsfähigkeit wieder; „Vollmacht“ wäre möglich, klänge aber stärker nach einer verliehenen Amtsbefugnis.
- source_word: ψυχῆς
  choice: Seele
  rationale: Die konkrete Bezeichnung des griechischen Textes wird bewahrt; hier bezeichnet sie den inneren Träger moralischer Entscheidung und Handlungsfähigkeit.
- source_word: τοῦ ποιῆσαι
  choice: zu tun
  rationale: Der Infinitiv wird offen wiedergegeben, ohne seine Funktion einseitig als Zweck oder bloße Möglichkeit festzulegen.
- source_word: δικαιοσύνην
  choice: Gerechtigkeit
  rationale: Die substantivische und moralisch-theologische Weite des griechischen Ausdrucks bleibt erhalten.
- source_word: ἀδικίαν
  choice: Ungerechtigkeit
  rationale: Die formale Gegenüberstellung zu δικαιοσύνη wird im Deutschen durch das entsprechende Gegensatzpaar bewahrt.
- source_word: ἔργοις χειρῶν ἡμῶν
  choice: durch die Werke unserer Hände
  rationale: Die körperlich-konkrete Bildsprache der Hände und der instrumentale Sinn des Dativs werden sichtbar gehalten.
theological_decisions:
- issue: Starke Betonung menschlicher moralischer Handlungsfähigkeit
  choice: „in der Wahl und Macht unserer Seele“
  alternative: „in der Entscheidung und Verfügungsgewalt unseres Inneren“
  rationale: Die Übersetzung lässt die Aussage des Verses über menschliche Verantwortung für gerechtes wie ungerechtes Handeln ungeschmälert stehen, ohne sie durch eine konfessionelle Lehraussage zu erklären oder einzuschränken.
- issue: Verhältnis von Gerechtigkeit und Ungerechtigkeit
  choice: Beide abstrakten Substantive werden als direktes Gegensatzpaar wiedergegeben.
  alternative: „Gerechtes und Unrechtes“
  rationale: Das substantivische Gegensatzpaar entspricht der griechischen Form genauer und bewahrt die moralisch-theologische Spannung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit enger Bindung an Satzbau und Bildsprache des Griechischen. Der Doppelpunkt macht den erläuternden Infinitiv im Deutschen verständlich, ohne ihn eindeutig als Zweck- oder Folgesatz festzulegen.
