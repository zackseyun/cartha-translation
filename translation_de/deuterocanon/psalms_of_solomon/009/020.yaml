  text: Das Erbarmen des Herrn gilt dem Haus Israel für immer und ewig.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „für immer und noch weiter“; die ungewöhnliche griechische Wendung verstärkt die Aussage über die Dauer.'
