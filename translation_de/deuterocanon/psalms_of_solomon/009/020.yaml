lexical_decisions:
- source_word: κυρίου
  choice: des Herrn
  rationale: Der deutsche Genitiv gibt die Zugehörigkeit formal und natürlich wieder; κύριος wird entsprechend der üblichen biblischen Sprachform mit „Herr“ wiedergegeben.
- source_word: ἐλεημοσύνη
  choice: Erbarmen
  rationale: Im Kontext bezeichnet das Wort die barmherzige Zuwendung des Herrn. „Erbarmen“ bewahrt das theologische Gewicht und ist im modernen Standarddeutsch natürlicher als „Barmherzigkeit“ in dieser Satzkonstruktion.
- source_word: ἡ ἐπʼ οἶκον Ἰσραήλ
  choice: gilt dem Haus Israel
  rationale: Die Präpositionalgruppe bezeichnet die Ausrichtung des Erbarmens auf Israel. „gilt dem“ ist idiomatisches Deutsch und bewahrt den kollektiven Ausdruck „Haus Israel“, ohne die räumliche Vorstellung von ἐπί unnötig zu überzeichnen.
- source_word: εἰς τὸν αἰῶνα καὶ ἔτι
  choice: für immer und darüber hinaus
  rationale: Die Wiedergabe bildet sowohl die unbegrenzte Dauer von εἰς τὸν αἰῶνα als auch den verstärkenden Zusatz καὶ ἔτι ausdrücklich ab und bewahrt damit die ungewöhnliche Fülle der griechischen Formulierung.
