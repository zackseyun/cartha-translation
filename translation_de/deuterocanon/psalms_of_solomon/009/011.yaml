  text: Wem wirst du Güte erweisen, Gott, wenn nicht denen, die den Herrn anrufen?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τίνι
  choice: Wem
  rationale: Der Dativ des Interrogativpronomens fragt rhetorisch nach dem Empfänger von Gottes Güte; „Wem“ entspricht dem griechischen Ausdruck knapp und natürlich.
- source_word: χρηστεύσῃ
  choice: wirst du Güte erweisen
  rationale: Die zweite Person Singular richtet die Frage unmittelbar an Gott. „Güte erweisen“ gibt das wohlwollende Handeln des Verbs in würdigem, verständlichem Deutsch wieder.
- source_word: ὁ θεός
  choice: Gott
  rationale: Der Nominativ mit Artikel dient hier aufgrund der direkten Anrede und der Verbform als Anrede; im Deutschen ist „Gott“ ohne ein altertümliches „o“ natürlich.
- source_word: ἐπικαλουμένοις
  choice: denen, die … anrufen
  rationale: Das substantivierte Partizip bezeichnet Menschen, die sich bittend oder verehrend an den Herrn wenden; „anrufen“ bewahrt den religiösen Sinn.
- source_word: κύριον
  choice: den Herrn
  rationale: Im religiösen Zusammenhang ist „Herr“ die angemessene Wiedergabe von κύριος; der Akkusativ folgt auf „anrufen“.
theological_decisions:
- issue: Person des Verbs und syntaktische Funktion von ὁ θεός
  choice: 'Direkte Anrede: „wirst du …, Gott“'
  alternative: 'Dritte Person: „wird Gott …“'
  rationale: χρηστεύσῃ ist hier zweite Person Singular Futur; ὁ θεός fungiert als hellenistische Anrede. So bleibt die direkte Hinwendung des Psalmisten zu Gott erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die rhetorische Frage und der Wechsel zwischen der direkten Anrede „Gott“ und der Bezeichnung „der Herr“ wurden entsprechend dem griechischen Text bewahrt.
