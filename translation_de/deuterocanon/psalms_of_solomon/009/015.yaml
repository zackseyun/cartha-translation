base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/009/015.yaml
  text: You will bless the righteous[a], and you do not call them to account for the things in which they sinned[c][b]; and your goodness is toward those who sin in repentance.
translation:
  language: de
  text: Die Gerechten wirst du segnen, und du ziehst sie nicht zur Rechenschaft für das, worin sie gesündigt haben; und deine Güte gilt denen, die sündigen und es bereuen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „denen, die sündigen, in Reue“. Das griechische Wort kann auch Bedauern oder Gewissensreue bezeichnen und je nach Zusammenhang eine Umkehr einschließen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δικαίους
  choice: die Gerechten
  rationale: Das substantivisch gebrauchte Adjektiv bezeichnet Menschen, die durch Gerechtigkeit gekennzeichnet sind. „Die Gerechten“ ist im Deutschen klar, würdig und traditionsnah.
- source_word: εὐλογήσεις
  choice: wirst du segnen
  rationale: Die Futurform wird ausdrücklich bewahrt; „segnen“ entspricht dem religiösen und bundesbezogenen Sinn.
- source_word: οὐκ εὐθύνεις
  choice: du ziehst sie nicht zur Rechenschaft
  rationale: Die Präsensform εὐθύνεις wird gegenüber dem vorangehenden Futur εὐλογήσεις erhalten. Die Wendung gibt den hier naheliegenden gerichtlichen Sinn des Verbs natürlich wieder.
- source_word: περὶ ὧν ἥμαρτοσαν
  choice: für das, worin sie gesündigt haben
  rationale: Die Formulierung bleibt nahe an der relationalen Struktur des Griechischen und gibt den Aorist als abgeschlossene Verfehlung wieder.
- source_word: ἡ χρηστότης σου
  choice: deine Güte
  rationale: „Güte“ bewahrt die breite Bedeutung moralischer Güte und wohlwollender Freundlichkeit, ohne sie auf bloße Milde zu verengen.
- source_word: περὶ ἁμαρτάνοντας
  choice: gilt denen, die sündigen
  rationale: Das Partizip wird verbal wiedergegeben und nicht zu einer starren Personenbezeichnung wie „Sünder“ gemacht. „Gilt“ drückt die relationale Bedeutung von περί idiomatisch aus.
- source_word: ἐν μεταμελείᾳ
  choice: und es bereuen
  rationale: Die natürliche deutsche Formulierung macht deutlich, dass Reue die sündigenden Menschen kennzeichnet und nicht die Art des Sündigens. Die mögliche Bedeutungsbreite von Reue, Bedauern und Umkehr wird in der Fußnote bewahrt.
theological_decisions:
- issue: Verhältnis von Sünde, Reue und Gottes Güte
  choice: „deine Güte gilt denen, die sündigen und es bereuen“
  alternative: „deine Güte gilt den Sündigenden in Reue“
  rationale: Die Übersetzung stellt Reue als Kennzeichen der sündigenden Menschen dar, ohne daraus eine ausgearbeitete Lehre über Vergebung oder Buße abzuleiten. Die weniger idiomatische, aber formal nähere Alternative wird durch die Fußnote transparent gemacht.
- issue: Zeitform bei Gottes Zur-Rechenschaft-Ziehen
  choice: 'Präsens: „du ziehst sie nicht zur Rechenschaft“'
  alternative: 'Futur: „du wirst sie nicht zur Rechenschaft ziehen“'
  rationale: Das überlieferte εὐθύνεις ist Präsens, im Unterschied zum futurischen εὐλογήσεις. Dieser Wechsel wird nicht harmonisiert.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem poetisch-religiösem Ton. Der Wechsel vom Futur zum Präsens sowie die Spannung zwischen fortdauerndem Sündigen und Reue bleiben erhalten.
