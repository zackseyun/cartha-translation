  terminology: „Die Gerechten“, „segnen“, „zur Rechenschaft ziehen“, „Güte“, „sündigen“ und „bereuen“ sind sachgerecht und registergerecht. Die Fußnote wahrt die mögliche Nuance von μεταμέλεια als Reue, Bedauern oder eine Umkehr einschließende Reue.
