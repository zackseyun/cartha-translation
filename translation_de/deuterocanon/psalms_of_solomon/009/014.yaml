  text: And to whom will he forgive sins, if not to those who have sinned?
translation:
  language: de
  text: Und wem wird er die Sünden vergeben, wenn nicht denen, die gesündigt haben?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀφήσει
  choice: wird er … vergeben
  rationale: Das Futur Aktiv von ἀφίημι bedeutet im Zusammenhang mit Sünden gewöhnlich „vergeben“. Die deutsche Verbindung „jemandem die Sünden vergeben“ gibt die personale und relationale Bedeutung natürlich wieder.
- source_word: ἁμαρτίας
  choice: die Sünden
  rationale: Der Plural bezeichnet unmittelbar Sünden. Der bestimmte Artikel ist im Deutschen in der festen Verbindung „die Sünden vergeben“ idiomatisch, obwohl das Griechische hier artikellos ist.
- source_word: τοῖς ἡμαρτηκόσι
  choice: denen, die gesündigt haben
  rationale: Das substantivierte Perfektpartizip bezeichnet Menschen, die gesündigt haben. Der Relativsatz bewahrt sowohl die verbale Kraft als auch den perfektischen Rückbezug und vermeidet die stärker etikettierende Wiedergabe „den Sündern“.
- source_word: τίνι
  choice: wem
  rationale: Der Dativ wird entsprechend der deutschen Rektion von „vergeben“ direkt mit „wem“ wiedergegeben.
theological_decisions:
- issue: Reichweite der göttlichen Vergebung
  choice: Die rhetorische Frage stellt heraus, dass Vergebung Menschen gilt, die tatsächlich gesündigt haben.
  alternative: Die Vergebung sei hier enger nur auf Menschen bezogen, die sich ihrer Sünde bereits bewusst sind.
  rationale: Der Wortlaut nennt allein das begangene Sündigen und sagt nichts über ein vorausgesetztes Sündenbewusstsein. Die rhetorische Form bleibt deshalb ungemildert erhalten, ohne ein umfassenderes Lehrsystem in den Satz hineinzulesen.
translation_notes:
  register: Moderne, klare und zugleich würdige Standardsprache. Die knappe rhetorische Frage und die Wiederholung des Wortfeldes „Sünde/sündigen“ werden bewahrt.
