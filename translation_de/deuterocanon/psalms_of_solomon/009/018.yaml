  naturalness: „Und du hast deinen Namen auf uns gelegt, Herr“ ist würdiges und verständliches modernes Standarddeutsch. „Und du wirst in Ewigkeit nicht aufhören“ ist natürlich genug für einen poetisch-biblischen Kontext und vermeidet die im Entwurf eingeführte Bildverschiebung zu einem Wegnehmen.
