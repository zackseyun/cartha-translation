  text: And you set your name upon us, O Lord; and you will never remove it.
translation:
  language: de
  text: Und du hast deinen Namen auf uns gelegt, Herr, und du wirst in Ewigkeit nicht aufhören.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔθου
  choice: hast … gelegt
  rationale: Der Aorist von τίθημι bezeichnet hier das vollzogene Auferlegen bzw. Anbringen des Namens; das deutsche Perfekt klingt natürlich und bewahrt den Rückbezug auf eine geschehene Handlung.
- source_word: τὸ ὄνομά σου ἐφʼ ἡμᾶς
  choice: deinen Namen auf uns
  rationale: Die konkrete Präposition und das biblische Bild der Zugehörigkeit werden ohne erklärende Auflösung bewahrt.
- source_word: οὐ καταπαύσεις
  choice: wirst ihn … nicht wegnehmen
  rationale: καταπαύω kann ein Beenden oder Aufhörenlassen bezeichnen. Im Zusammenhang mit dem zuvor auf die Gemeinschaft gelegten Namen ergibt sich idiomatisch das Nicht-Wegnehmen; das ergänzte Pronomen »ihn« nimmt »Namen« auf.
- source_word: τὸν αἰῶνα
  choice: in Ewigkeit
  rationale: Die feste Wendung bezeichnet unaufhörliche bzw. dauerhafte Geltung; »in Ewigkeit« ist würdig, verständlich und in diesem Kontext idiomatisch.
theological_decisions:
- issue: Dauerhaftigkeit des göttlichen Namens über der Gemeinschaft
  choice: und wirst ihn in Ewigkeit nicht wegnehmen
  alternative: und du wirst in Ewigkeit nicht aufhören
  rationale: Die gewählte Fassung bindet das Objekt sinnvoll an »deinen Namen« zurück, ohne die Aussage in eine konfessionelle Lehre über Erwählung oder Verwerfung auszubauen. Die grammatisch mögliche allgemeinere Deutung von καταπαύσεις bleibt als Alternative erkennbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit enger Bindung an die griechische Bildsprache. Die Anrede Κύριε wird als »Herr« wiedergegeben; die Satzverbindung mit zweimaligem »und« bewahrt den schlichten poetischen Parallelismus.
