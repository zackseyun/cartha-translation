translation:
  language: de
  text: Und in deiner Gerechtigkeit suchst du die Menschenkinder auf.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Und in deiner Gerechtigkeit prüfst du die Menschen“; das griechische Verb kann auch „besuchen“, „nach jemandem sehen“ oder „sich um jemanden kümmern“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δικαιοσύνῃ
  choice: Gerechtigkeit
  rationale: Die Wendung bezeichnet Gottes gerechte Wesens- und Handlungsweise. „Gerechtigkeit“ bewahrt sowohl den ethischen als auch den möglichen richterlichen Klang.
- source_word: ἐπεσκέπτῃ
  choice: suchst du … auf
  rationale: Das Verb kann besuchen, sich jemandem zuwenden, nach jemandem sehen oder jemanden prüfen bedeuten. „aufsuchen“ bewahrt die Vorstellung einer gezielten göttlichen Zuwendung, ohne den im Kontext möglichen prüfenden beziehungsweise richterlichen Sinn einseitig festzulegen.
- source_word: υἱοὺς ἀνθρώπων
  choice: die Menschenkinder
  rationale: Die idiomatische, semitisch geprägte Wendung meint die Menschen insgesamt. „Menschenkinder“ erhält den bildhaften Ausdruck und ist im Deutschen zugleich inklusiv verständlich.
theological_decisions:
- issue: Art der göttlichen Heimsuchung
  choice: Der Haupttext verwendet das offene „aufsuchen“.
  alternative: „prüfen“, „über die Menschen wachen“ oder „heimsuchen“
  rationale: Der Zusammenhang ist richterlich, doch ἐπισκέπτομαι bezeichnet nicht ausschließlich eine Untersuchung oder Bestrafung. Eine stärker festlegende Wiedergabe würde die genuine Bedeutungsbreite und theologische Spannung vermindern.
- issue: Reichweite von υἱοὺς ἀνθρώπων
  choice: „Menschenkinder“ als Bezeichnung für die gesamte Menschheit
  alternative: „Menschensöhne“ oder schlicht „Menschen“
  rationale: Die griechische Form ist grammatisch maskulin, fungiert hier aber als überkommene Sammelbezeichnung für Menschen. Die gewählte deutsche Entsprechung bewahrt Bild und allgemeinen Bezug.
translation_notes:
  register: Moderne, würdevolle Standardsprache. „Menschenkinder“ bewahrt die traditionelle Bildsprache, ohne auf männliche Personen beschränkt zu wirken; „aufsuchen“ lässt den im Kontext möglichen richterlichen Unterton bestehen.
