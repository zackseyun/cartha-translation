  text: In a covenant you appointed to our fathers concerning us[b][a], and we will hope in you in the turning back of our soul.
translation:
  language: de
  text: Du hast mit unseren Vätern einen Bund geschlossen, der uns gilt, und wir werden bei der Umkehr unserer Seele auf dich hoffen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wenn unsere Seele umkehrt“; die griechische Wendung kann auch im Sinn von „wenn wir umkehren“ beziehungsweise „wenn wir Buße tun“ verstanden werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν διαθήκῃ διέθου
  choice: du hast … einen Bund geschlossen
  rationale: Die hebräisch geprägte Verbindung bezeichnet idiomatisch das Schließen eines Bundes. Die natürliche deutsche Wendung bewahrt den Bundbegriff und gibt die verbale Handlung klar wieder.
- source_word: τοῖς πατράσιν ἡμῶν
  choice: mit unseren Vätern
  rationale: Im Bundeskontext bezeichnet der Dativ die am Bund beteiligten Vorfahren; „Väter“ erhält die ausdrückliche Form und den patriarchalischen Bezug des Griechischen.
- source_word: περὶ ἡμῶν
  choice: der uns gilt
  rationale: Die relativische Form gibt „uns betreffend“ in natürlichem Deutsch wieder, ohne das mögliche Verhältnis als bloßen Nutzen „für uns“ festzulegen.
- source_word: ἐλπιοῦμεν ἐπὶ σέ
  choice: wir werden auf dich hoffen
  rationale: Das Futur wird bewahrt; „auf dich hoffen“ ist die natürliche deutsche Entsprechung für die Präpositionalkonstruktion.
- source_word: ἐν ἐπιστροφῇ ψυχῆς ἡμῶν
  choice: wenn unsere Seele umkehrt
  rationale: „Umkehrt“ erhält das Bild der Rückkehr und seine sittlich-religiöse Bedeutung, ohne es im Haupttext ausdrücklich auf „Buße tun“ zu verengen. Der kollektive Singular „unsere Seele“ bleibt erhalten.
theological_decisions:
- issue: Ob ἐπιστροφῇ ψυχῆς ἡμῶν ausdrücklich als Buße bezeichnet werden soll
  choice: wenn unsere Seele umkehrt
  alternative: wenn wir umkehren / Buße tun
  rationale: Die Wendung hat wahrscheinlich einen Bußsinn, spricht aber wörtlich von der Umkehr oder Rückkehr der Seele. Die gewählte Fassung bewahrt diese Spannung.
- issue: Wie περὶ ἡμῶν auf den Bund bezogen wird
  choice: ein Bund …, der uns gilt
  alternative: ein Bund … über uns / für uns
  rationale: „Der uns gilt“ wahrt den Bezug auf die Sprechenden, ohne genauer zu bestimmen, ob sie Gegenstand, Nutznießer oder spätere Teilhaber des Bundes sind.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die idiomatische Wendung „einen Bund schließen“ vermeidet eine unnatürliche Nachbildung des griechisch-hebräischen Ausdrucks; „unsere Seele“ bewahrt bewusst den kollektiven Singular.
