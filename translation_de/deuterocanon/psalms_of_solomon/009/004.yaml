  text: For you are a righteous judge over all the peoples of the earth[a].
translation:
  language: de
  text: Denn du bist ein gerechter Richter über alle Völker der Erde.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „über alle Nationen der Erde“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Denn
  rationale: Leitet die Begründung für die Aussage im Zusammenhang ein und bewahrt die kausale Funktion natürlich im Deutschen.
- source_word: κριτὴς
  choice: Richter
  rationale: Direkte und im Deutschen natürliche Wiedergabe für denjenigen, der richtet.
- source_word: δίκαιος
  choice: gerecht
  rationale: Gibt sowohl die rechtliche Gerechtigkeit als auch die moralische Qualität des Richters wieder.
- source_word: ἐπὶ
  choice: über
  rationale: Drückt hier den Bereich beziehungsweise die umfassende Zuständigkeit des Richters aus.
- source_word: πάντας τοὺς λαοὺς
  choice: alle Völker
  rationale: Bewahrt den Plural verschiedener Menschengruppen; im Deutschen ist „Völker“ weniger politisch eingeengt als „Nationen“.
- source_word: τῆς γῆς
  choice: der Erde
  rationale: Der universale Zusammenhang mit allen Völkern spricht für „Erde“ statt für das örtlich begrenzte „Land“.
theological_decisions:
- issue: Gottes universale Richtergewalt
  choice: „Richter über alle Völker der Erde“
  alternative: „Richter aller Völker der Erde“
  rationale: Die Präposition ἐπί wird ausdrücklich wiedergegeben, ohne näher festzulegen, ob der Schwerpunkt auf Herrschaft, Zuständigkeit oder Gerichtshandeln liegt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe begründende Aussage und die universale Reichweite des griechischen Textes bleiben erhalten.
