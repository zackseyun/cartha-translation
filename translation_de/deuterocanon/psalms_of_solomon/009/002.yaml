base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/009/002.yaml
  text: They were cast out from the inheritance that the Lord gave them; the dispersion of Israel is among every nation[a], according to the word of God.
translation:
  language: de
  text: Sie wurden aus dem Erbteil, das der Herr ihnen gegeben hatte, verstoßen; die Zerstreuung Israels ist gemäß dem Wort Gottes unter allen Völkern[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Israel ist gemäß dem Wort Gottes unter allen Völkern zerstreut.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπερρίφησαν
  choice: wurden … verstoßen
  rationale: Das Passiv bezeichnet eine entschiedene Ausstoßung beziehungsweise Entfernung. „Verstoßen“ bewahrt die Härte des Ausdrucks und passt zum Zusammenhang von Verlust und Zerstreuung.
- source_word: κληρονομίας
  choice: Erbteil
  rationale: „Erbteil“ ist im biblischen Deutsch eine natürliche Bezeichnung für den von Gott zugewiesenen Besitz und lässt hier besonders an das Land denken, ohne die Bedeutung darauf zu beschränken.
- source_word: Κύριος
  choice: Herr
  rationale: Die übliche Wiedergabe von Κύριος; im vorliegenden Bundeszusammenhang bezeichnet das Wort Israels Gott.
- source_word: διασπορὰ
  choice: Zerstreuung
  rationale: Das Substantiv wird nominal wiedergegeben. Die Formulierung „in der Zerstreuung leben“ klingt im Deutschen natürlich und bewahrt zugleich den sachlichen Akzent des griechischen Nomens.
- source_word: ῥῆμα
  choice: Wort
  rationale: „Wort“ gibt ῥῆμα direkt wieder und lässt offen, ob eine Äußerung, Ankündigung oder ein göttlicher Beschluss im Vordergrund steht.
theological_decisions:
- issue: Nominale oder verbale Wiedergabe von ἡ διασπορὰ τοῦ Ἰσραήλ
  choice: Die nominale Vorstellung bleibt in „Israel lebt … in der Zerstreuung“ erhalten.
  alternative: „Israel ist unter allen Völkern zerstreut.“
  rationale: Die gewählte Fassung wahrt das griechische Substantiv, vermeidet aber die im Deutschen schwerfällige wörtliche Form „die Zerstreuung Israels ist“. Die Fußnote dokumentiert die mögliche rein verbale Wiedergabe.
- issue: Zeitbezug von ἧς ἔδωκεν αὐτοῖς Κύριος
  choice: „das der Herr ihnen gegeben hatte“
  alternative: „das der Herr ihnen gab“
  rationale: Das Plusquamperfekt macht im Deutschen deutlich, dass die Gabe des Erbteils der anschließenden Verstoßung vorausging, ohne eine zusätzliche theologische Aussage einzuführen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Erbteil“ erhält den biblischen Sachgehalt, während „lebt … in der Zerstreuung“ die nominale griechische Konstruktion lesbar wiedergibt. „Unter allen Völkern“ ist im Deutschen idiomatischer als „in jedem Volk“ und entspricht dem distributiven Sinn von ἐν παντὶ ἔθνει.
