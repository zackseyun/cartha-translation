  - marker: b
    text: 'Oder: „mehr als alle Völker“ beziehungsweise „über alle Völker hinaus“.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἡρέτισω
  choice: hast … erwählt
  rationale: Das Verb bezeichnet ein bewusstes Auswählen. „Erwählt“ ist im Deutschen natürlich, würdevoll und bewahrt hier den theologischen Klang göttlicher Wahl, ohne ihn näher auszugestalten.
- source_word: τὸ σπέρμα Ἀβραάμ
  choice: die Nachkommen Abrahams
  rationale: σπέρμα steht als kollektiver Singular für die aus Abraham hervorgegangene Nachkommenschaft. „Nachkommen“ gibt diesen kollektiven Sinn in modernem Deutsch klar wieder; „Same“ wäre formnäher, wirkt hier jedoch weniger natürlich.
- source_word: παρὰ πάντα τὰ ἔθνη
  choice: vor allen Völkern
  rationale: παρά mit Akkusativ trägt hier einen vergleichenden Sinn. „Vor allen Völkern“ drückt Vorrang beziehungsweise Bevorzugung aus und lässt zugleich die mögliche Nuance „mehr als“ erkennen.
- source_word: ἔθνη
  choice: Völker
  rationale: „Völker“ ist im Kontext Abrahams idiomatisch und weniger konfessionell vorgeprägt als „Heiden“; es gibt den Plural ἔθνη angemessen wieder.
theological_decisions:
- issue: Erwählung der Nachkommen Abrahams im Verhältnis zu den Völkern
  choice: Die Aussage wird unmittelbar als Erwählung der Nachkommen Abrahams vor allen Völkern wiedergegeben.
  alternative: Du hast die Nachkommen Abrahams aus allen Völkern erwählt.
  rationale: Der vergleichende Gebrauch von παρά stützt eher Vorrang oder Bevorzugung als eine Auswahl „aus“ einer Gesamtmenge. Die Übersetzung bewahrt die Aussage über Gottes besondere Wahl, ohne spätere Lehrsysteme einzutragen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. „Denn“ wahrt den begründenden Anschluss von ὅτι; die Fußnoten erhalten die kollektive Bildsprache von σπέρμα und die vergleichende Bedeutungsbreite von παρά.
