  text: For you chose the offspring of Abraham above all the nations[b][a],
translation:
  language: de
  text: Denn du hast die Nachkommen Abrahams vor allen Völkern erwählt.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „den Samen Abrahams“; auch: „die Nachkommenschaft Abrahams“.'
