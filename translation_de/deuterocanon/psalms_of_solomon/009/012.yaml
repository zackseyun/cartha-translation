  terminology: „Bekenntnis“ und „offene Eingeständnisse“ geben die zwei unterschiedlichen griechischen Ausdrücke unterscheidbar wieder. „Seele“ ist als Übersetzung von ψυχή hier vertretbar. Die Fußnote wahrt die Auslegungsöffnung und setzt keine konfessionelle Deutung voraus.
