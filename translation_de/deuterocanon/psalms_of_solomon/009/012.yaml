  yaml_path: translation/deuterocanon/psalms_of_solomon/009/012.yaml
  text: He will cleanse a soul in sins by confession, by open acknowledgment.
translation:
  language: de
  text: Er wird eine Seele in Sünden[a] reinigen, durch Bekenntnis, durch offene Eingeständnisse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „in Sünden“; die griechische Formulierung bezeichnet die Seele in ihrem Verhältnis oder Zustand zu den Sünden, ohne ausdrücklich „von Sünden“ zu sagen.'
    reason: Die ungewöhnliche Präposition ist auslegungsrelevant und soll weder geglättet noch als eindeutige Trennung von den Sünden dargestellt werden.
lexical_decisions:
- source_word: καθαρίσει
  choice: wird … reinigen
  rationale: Gibt das Futur Aktiv und die Grundbedeutung des Verbs direkt wieder; das unausgesprochene Subjekt bleibt wie im griechischen Text durch „er“ bestimmt.
- source_word: ψυχὴν
  choice: eine Seele
  rationale: Bewahrt den unbestimmten Charakter des griechischen Akkusativs und die in diesem Kontext naheliegende Bedeutung „Seele“.
- source_word: ἐν ἐξομολογήσει
  choice: durch Bekenntnis
  rationale: Das instrumentale ἐν wird im Deutschen natürlich mit „durch“ wiedergegeben; „Bekenntnis“ lässt sowohl Sündenbekenntnis als auch ausdrückliches Eingestehen zu.
- source_word: ἐν ἐξαγορίαις
  choice: durch offene Eingeständnisse
  rationale: Gibt den Gedanken ausdrücklicher, offener Anerkennung wieder und wahrt den griechischen Plural.
theological_decisions:
- issue: Verhältnis der Sünden zur Reinigung
  choice: „eine Seele in Sünden reinigen“
  alternative: „eine Seele von Sünden reinigen“
  rationale: Der überlieferte griechische Text hat ἐν ἁμαρτίαις („in Sünden“), nicht eine eindeutige Konstruktion für die Entfernung von Sünden. Die Übersetzung bewahrt diese ungewöhnliche Formulierung und vermeidet es, die theologische Beziehung stillschweigend festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung „durch …, durch …“ bildet den parallelen griechischen Ausdruck nach; „offene Eingeständnisse“ bleibt verständlich und unterscheidet den zweiten Ausdruck vom allgemeineren „Bekenntnis“.
