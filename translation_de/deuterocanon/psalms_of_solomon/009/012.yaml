  source_fidelity: 'Die Übersetzung folgt dem griechischen Satzbau und den zentralen Ausdrücken sorgfältig: καθαρίσει als futurisches „wird … reinigen“, ψυχὴν als „eine Seele“, ἐν ἐξομολογήσει als „durch Bekenntnis“ und der Plural ἐν ἐξαγορίαις als „durch offene Eingeständnisse“. Besonders angemessen ist, dass ἐν ἁμαρτίαις nicht zu „von Sünden“ umgedeutet wird. Dies entspricht auch dem englischen POB-Audit-Text.'
