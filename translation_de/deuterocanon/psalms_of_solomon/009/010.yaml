base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/009/010.yaml
  text: For the judgments of the Lord are in righteousness toward each man and household[a][b][c].
translation:
  language: de
  text: Denn die Urteile des Herrn ergehen in Gerechtigkeit über jeden Menschen und jedes Haus[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Griechisch wörtlich etwa: „nach Mann und Haus“; wahrscheinlich ist dies distributiv gemeint: für jeden Einzelnen und jedes Haus.'
    reason: lexical_alternative
  - marker: b
    text: „Haus“ kann hier auch „Hausgemeinschaft“ oder „Familie“ bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: κρίματα
  choice: Urteile
  rationale: Das Wort bezeichnet richterliche Entscheidungen oder Akte des Gerichts; „Urteile“ bewahrt sowohl den rechtlichen als auch den sittlichen Gehalt.
- source_word: Κυρίου
  choice: des Herrn
  rationale: Die übliche und kontextgemäße Wiedergabe von κύριος ist „Herr“.
- source_word: ἐν δικαιοσύνῃ
  choice: in Gerechtigkeit
  rationale: Die substantivische Form wird beibehalten, um die im Zusammenhang wiederholte Wortlinie mit δικαιοσύνη zu bewahren; gemeint sein kann sowohl der gerechte Charakter als auch die gerechte Weise der Urteile.
- source_word: κατʼ ἄνδρα
  choice: über jeden Menschen
  rationale: κατά mit Akkusativ wird hier distributiv verstanden. „Jeden Menschen“ gibt die Anwendung auf die Einzelnen natürlich wieder, während „über“ im Deutschen gut zu „Urteile ergehen“ passt.
- source_word: οἶκον
  choice: jedes Haus
  rationale: „Haus“ bewahrt das konkrete griechische Bild und kann wie οἶκος zugleich die Hausgemeinschaft beziehungsweise Familie bezeichnen.
theological_decisions:
- issue: Bezug von ἐν δικαιοσύνῃ
  choice: in Gerechtigkeit
  alternative: sind gerecht / ergehen gerecht
  rationale: Die nominale und leicht offene Formulierung des Griechischen wird erhalten, statt sie eindeutig als Prädikatsadjektiv oder bloß adverbiale Bestimmung festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Konstruktion „Urteile … ergehen“ macht den deutschen Satz idiomatisch, während „in Gerechtigkeit“ die substantivische Ausdrucksweise und die thematische Wiederholung des griechischen δικαιοσύνη erhält.
