  text: For shame is upon us and upon our faces because of all this[a][b].
translation:
  language: de
  text: Denn Schande liegt auf uns und auf unseren Gesichtern wegen all dessen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „im Blick auf alles“. Das Griechische kann sowohl den Anlass der Schande als auch das, worauf sie sich bezieht, bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Denn
  rationale: Die Konjunktion leitet hier begründend oder erläuternd an den Zusammenhang an; „Denn“ bewahrt diese Funktion natürlich.
- source_word: αἰσχύνη
  choice: Schande
  rationale: „Schande“ gibt sowohl den Zustand der Beschämung als auch den öffentlichen Ehrverlust wieder und passt zur sichtbaren Bildsprache der Gesichter.
- source_word: ἡμῖν καὶ τοῖς προσώποις ἡμῶν
  choice: liegt auf uns und auf unseren Gesichtern
  rationale: Die beiden parallelen Dative bleiben von demselben Subjekt abhängig. „liegt auf“ wahrt die konkrete, semitisch geprägte Ausdrucksweise in verständlichem Deutsch.
- source_word: περὶ ἁπάντων
  choice: wegen all dessen
  rationale: περί mit Genitiv kann Anlass beziehungsweise Ursache bezeichnen. „All dessen“ vermeidet einen im Griechischen nicht vorhandenen expliziten Pluraldemonstrativ und ist im Rückbezug natürlich.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die auffällige Parallelität „auf uns und auf unseren Gesichtern“ wurde bewusst bewahrt, ohne sie in zwei selbstständige Aussagen aufzulösen.
