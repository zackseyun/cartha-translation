review_pass:
  verdict: revise
  source_fidelity: Die Grundstruktur und die wesentlichen Begriffe sind zutreffend wiedergegeben. Die Schlussformulierung „für seine Seele im Verderben verantwortlich“ bildet zwar die griechische Kürze nach, ist im Deutschen aber syntaktisch und semantisch unklar. αἴτιος mit dem Genitiv bezeichnet hier Schuld bzw. Verantwortlichkeit für das Verderben der eigenen ψυχή; „schuld am Verderben seiner Seele“ gibt dies idiomatisch wieder. Die Fußnote hält weniger festgelegte Umschreibungen fest.
  naturalness: „Häuft sich Leben beim Herrn an“ ist verständlich, wirkt aber etwas schwerfällig. „Sammelt sich beim Herrn Leben an“ ist modernes, natürliches Deutsch und bewahrt das Bild des Ansammelns. Die revidierte zweite Satzhälfte ist klar und würdig, ohne unnötig paraphrasierend zu werden.
  terminology: „Gerechtigkeit“ und „Unrecht“ sind als kontrastierendes Begriffspaar angemessen. „Herr“ für Κύριος und „Seele“ für ψυχή sind sachgerecht; die Fußnote zu ψυχή wahrt die Bedeutungsbreite von „Leben“ bzw. „eigene Person“. „Verderben“ ist eine passende Wiedergabe von ἀπώλεια.
  issues:
  - severity: medium
    issue: Die Formulierung „ist selbst für seine Seele im Verderben verantwortlich“ ist im Deutschen unidiomatisch und mehrdeutig.
    rationale: Sie kann nahelegen, die Person sei im Zustand des Verderbens lediglich für ihre Seele zuständig, statt dass sie für deren Verderben schuldhaft verantwortlich ist. Die griechische Konstruktion αἴτιος τῆς ψυχῆς ἐν ἀπωλείᾳ verlangt eine verständliche Verbindung von persönlicher Schuld und Verderben.
  - severity: low
    issue: „häuft sich Leben beim Herrn an“ klingt leicht sperrig.
    rationale: Das Verb ist nicht falsch, doch „sammelt sich beim Herrn Leben an“ ist im modernen Standarddeutsch flüssiger und erhält die Bildlichkeit von θησαυρίζει.
