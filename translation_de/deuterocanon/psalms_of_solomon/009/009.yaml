revisions:
- from: Wer Gerechtigkeit[a] übt, häuft sich Leben beim Herrn[b] an; und wer Unrecht tut, ist selbst für seine Seele[c] im Verderben verantwortlich.[d]
  to: Wer Gerechtigkeit[a] übt, sammelt sich beim Herrn[b] Leben an; und wer Unrecht tut, ist selbst schuld am Verderben seiner Seele[c].[d]
  rationale: Die Revision beseitigt die im Deutschen schwer verständliche Schlusskonstruktion. „Ist selbst schuld am Verderben seiner Seele“ gibt αἴτιος als persönliche Schuld bzw. Verantwortlichkeit wieder und bezieht ἐν ἀπωλείᾳ idiomatisch auf das Verderben, ohne den Mechanismus des Verderbens näher zu bestimmen. Die wörtlichere, aber sperrige Fassung bleibt als Alternative dokumentiert. Außerdem wird die Wortstellung im ersten Satzteil geglättet.
  reviewer_model: gpt-5.6-terra
