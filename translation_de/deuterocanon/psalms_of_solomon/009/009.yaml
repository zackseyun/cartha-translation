base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/009/009.yaml
  text: The one who does righteousness stores up life for himself with the Lord[e][d][c][b][a], and the one who does unrighteousness is himself responsible for his soul in destruction.
translation:
  language: de
  text: Wer Gerechtigkeit[a] übt, sammelt sich beim Herrn[b] Leben an; und wer Unrecht tut, ist selbst schuld am Verderben seiner Seele[c].[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Recht tut“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „vor dem Herrn“; möglicherweise auch: „vom Herrn her“.'
    reason: lexical_alternative
  - marker: c
    text: „Seele“ kann hier auch „Leben“ oder „eigene Person“ bedeuten.
    reason: lexical_alternative
  - marker: d
    text: 'Auch möglich: „ist selbst für seine Seele im Verderben verantwortlich“ oder „trägt selbst die Verantwortung dafür, dass sein Leben ins Verderben gerät“. Das Griechische ist hier knapp und lässt die genaue Beziehung von Schuld und Verderben offen.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ ποιῶν
  choice: wer … übt / wer … tut
  rationale: Das substantivierte Partizip wird als allgemeiner Relativsatz wiedergegeben. Die unterschiedlichen Verben ergeben im Deutschen eine natürliche Formulierung, ohne den Aussagegehalt zu verändern.
- source_word: δικαιοσύνην
  choice: Gerechtigkeit
  rationale: „Gerechtigkeit“ bewahrt sowohl die ethische als auch die rechtliche Bedeutungsbreite des griechischen Begriffs.
- source_word: θησαυρίζει
  choice: häuft … an
  rationale: Die Wendung erhält das Bild des Ansammelns eines Schatzes und klingt zugleich in modernem Deutsch natürlich.
- source_word: ζωὴν
  choice: Leben
  rationale: Das artikellose Substantiv bezeichnet hier Leben als das beim Herrn angesammelte Gut.
- source_word: αὐτῷ
  choice: sich
  rationale: Der Dativ ist in diesem Zusammenhang reflexiv zu verstehen und bezeichnet den Nutzen für den Handelnden selbst.
- source_word: παρὰ Κυρίῳ
  choice: beim Herrn
  rationale: παρά mit Dativ bezeichnet hier am ehesten Nähe beziehungsweise Verwahrung in der Gegenwart des Herrn. Die Formulierung lässt den möglichen Gedanken des Angenommenseins vor Gott offen.
- source_word: ἀδικίαν
  choice: Unrecht
  rationale: „Unrecht“ bildet einen klaren Gegensatz zu „Gerechtigkeit“ und ist im Deutschen natürlicher als „Ungerechtigkeit tun“.
- source_word: αἴτιος
  choice: verantwortlich
  rationale: Das Adjektiv bezeichnet persönliche Verantwortlichkeit oder Schuld. „Verantwortlich“ wahrt diese Bedeutung, ohne den Satz stärker kausal auszulegen als das Griechische.
- source_word: τῆς ψυχῆς
  choice: seine Seele
  rationale: ψυχή kann Seele, Leben oder die eigene Person bezeichnen. „Seele“ erhält im Haupttext das religiös-eschatologische Gewicht; die weitere Bedeutungsbreite wird in einer Fußnote genannt.
- source_word: ἐν ἀπωλείᾳ
  choice: im Verderben
  rationale: Die knappe und ungewöhnliche griechische Wendung wird bewusst nicht eindeutig als Ursache, Ziel oder Zustand aufgelöst.
theological_decisions:
- issue: Persönliche Verantwortung und Verderben im zweiten Satzteil
  choice: „ist selbst für seine Seele im Verderben verantwortlich“
  alternative: „ist selbst am Verderben seiner Seele schuld“ oder „trägt selbst die Verantwortung dafür, dass sein Leben ins Verderben gerät“
  rationale: Die Hauptfassung bewahrt die ungewöhnliche Verbindung von αἴτιος, Genitiv und ἐν ἀπωλείᾳ. Die glatteren Alternativen verdeutlichen eine mögliche kausale Lesart, legen sie aber stärker fest.
- issue: Bedeutung von ψυχή
  choice: Seele
  alternative: Leben oder eigene Person
  rationale: „Seele“ wahrt den ernsten religiösen Ton, während eine Fußnote die lexikalisch möglichen umfassenderen Bedeutungen festhält.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit weisheitlicher Prägnanz. Das Semikolon verdeutlicht den Gegensatz der parallelen Aussagen, obwohl sie im Griechischen mit καί verbunden sind. Die ungewöhnliche Schlussformulierung bleibt im Haupttext bewusst etwas spannungsvoll, damit die grammatische und theologische Mehrdeutigkeit nicht stillschweigend aufgelöst wird.
