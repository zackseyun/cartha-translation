  yaml_path: translation/deuterocanon/psalms_of_solomon/009/001.yaml
  text: When Israel was carried away into exile to a foreign land[a], when they departed from the Lord who had redeemed them,
translation:
  language: de
  text: Als Israel in die Verbannung, in ein fremdes Land, weggeführt wurde, als sie sich vom Herrn abwandten[a], der sie erlöst hatte,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: vom Herrn abfielen oder sich von ihm lossagten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπαχθῆναι
  choice: weggeführt wurde
  rationale: Der passive Infinitiv bezeichnet, dass Israel fortgebracht wurde, und legt keine freiwillige Reise nahe. „Weggeführt wurde“ gibt dies natürlich und historisch passend wieder.
- source_word: ἀποικεσίᾳ
  choice: in die Verbannung
  rationale: Das Substantiv bezeichnet hier Israels erzwungenen Aufenthalt fern vom eigenen Land. „Verbannung“ ist im Deutschen verständlich und wahrt den Gedanken des Exils.
- source_word: γῆν ἀλλοτρίαν
  choice: in ein fremdes Land
  rationale: Die Wendung bezeichnet ein Land, das nicht Israels eigenes ist. „Ein fremdes Land“ ist idiomatisch und bewahrt diesen Gegensatz.
- source_word: ἀποστῆναι
  choice: sich … abwandten
  rationale: Das Verb kann sowohl ein Sich-Entfernen als auch religiösen Abfall bezeichnen. „Sich abwandten“ bewahrt die relationale und bundestheologische Aussage, ohne die stärkere Bedeutung des Abfalls zwingend festzulegen; diese wird in der Fußnote genannt.
- source_word: Κυρίου
  choice: dem Herrn
  rationale: „Herr“ ist die angemessene traditionelle und kontextuell bündige Wiedergabe von κύριος.
- source_word: τοῦ λυτρωσαμένου
  choice: der sie erlöst hatte
  rationale: Das substantivisch bezogene Partizip nennt den Herrn als den, der Israel zuvor befreit beziehungsweise losgekauft hat. Das Plusquamperfekt stellt die Vorzeitigkeit klar; „erlöst“ bewahrt die heilsgeschichtliche Tragweite.
theological_decisions:
- issue: Bedeutung von ἀποστῆναι als räumliche Abkehr oder religiöser Abfall
  choice: sich von dem Herrn abwandten
  alternative: vom Herrn abfielen / sich vom Herrn lossagten
  rationale: Der Haupttext wahrt die mögliche Spannweite zwischen Abkehr und offenem Abfall. Die Fußnote macht die stärkere, theologisch gewichtige Lesart sichtbar, ohne sie allein festzuschreiben.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die doppelte temporale Konstruktion ἐν τῷ mit Infinitiv wird durch das wiederholte „als“ erhalten. Der abschließende Beistrich bleibt stehen, da der Vers syntaktisch in den folgenden Zusammenhang weiterführt.
