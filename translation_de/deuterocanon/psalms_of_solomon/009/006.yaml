translation:
  language: de
  text: Und die gerechten Taten deiner Frommen liegen vor dir, Herr. Wo könnte sich ein Mensch vor deiner Erkenntnis verbergen, Gott?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δικαιοσύναι
  choice: gerechten Taten
  rationale: Der Plural bezeichnet hier am natürlichsten konkrete Erweise gerechten Handelns; das bewahrt den Pluralgedanken, ohne das im Deutschen missverständliche „Gerechtigkeiten“ zu verwenden.
- source_word: ὁσίων
  choice: Frommen
  rationale: ὅσιος bezeichnet Menschen, die Gott ergeben und ihm treu sind. „Fromme“ ist im Kontext würdig und vermeidet eine vorschnelle Gleichsetzung mit dem weiter gefassten Begriff „Heilige“.
- source_word: ἐνώπιόν σου
  choice: liegen vor dir
  rationale: Gibt die räumlich-forensische Vorstellung „vor deinem Angesicht“ in natürlichem Deutsch wieder und deutet an, dass diese Taten Gott bekannt und gegenwärtig sind.
- source_word: κρυβήσεται
  choice: könnte sich … verbergen
  rationale: Die rhetorische Frage mit futurischer Verbform wird idiomatisch als Frage nach einer unmöglichen Möglichkeit ausgedrückt.
- source_word: γνώσεώς σου
  choice: deiner Erkenntnis
  rationale: Bewahrt den abstrakten und umfassenden Sinn von γνῶσις; „Wissen“ wäre ebenfalls möglich, doch „Erkenntnis“ entspricht dem feierlichen Register.
theological_decisions:
- issue: Bedeutung von αἱ δικαιοσύναι
  choice: gerechten Taten
  alternative: Gerechtigkeiten
  rationale: Die Übersetzung versteht den Plural als konkrete gerechte Handlungen, ohne daraus eine systematische Aussage über zugerechnete oder innewohnende Gerechtigkeit abzuleiten.
- issue: Reichweite der göttlichen γνώσις
  choice: vor deiner Erkenntnis verbergen
  alternative: deinem Wissen entgehen
  rationale: Die Formulierung erhält die Aussage von Gottes allumfassender Kenntnis, ohne näher zu bestimmen, auf welche Weise diese Erkenntnis theologisch zu erklären ist.
- issue: Anrede Κύριε … ὁ θεός
  choice: Herr … Gott
  alternative: Herr … o Gott
  rationale: Beide Gottesbezeichnungen bleiben erhalten; das Deutsche kann die zweite Vokativanrede ohne das heute markierte „o“ natürlich wiedergeben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die beiden koordinierten Aussagen werden zur besseren deutschen Lesbarkeit in zwei Sätze gegliedert; die direkte Gottesansprache und die rhetorische Spannung des Griechischen bleiben erhalten.
