  source_fidelity: 'Der Haupttext gibt οὐ γὰρ κρυβήσεται ἀπὸ τῆς γνώσεώς σου πᾶς ποιῶν ἄδικα vollständig und zutreffend wieder: „Denn“ entspricht γάρ, „jeder“ bewahrt πᾶς, „Unrecht tut“ ist eine idiomatische und semantisch passende Wiedergabe von ποιῶν ἄδικα, und „wird deiner Kenntnis nicht verborgen bleiben“ erhält sowohl Zukunft als auch das Bild des Nicht-Verborgenbleibens vor dem Wissen des Angeredeten. Die Umstellung der griechischen Verneinung ist im Deutschen natürlich und bedeutungsgleich.'
  naturalness: Modernes, würdiges Standarddeutsch. Die Verbindung „deiner Kenntnis nicht verborgen bleiben“ ist leicht gehoben, aber klar und für einen Psalm angemessen. Der Satz ist flüssig und nicht unnötig paraphrastisch.
  terminology: „Unrecht“ bewahrt das für den Kontext wichtige δικ-/ἀδικ-Wortfeld besser als „Böses“ oder bloßes „Falsches“. „Kenntnis“ ist für γνῶσις direkt und zurückhaltend; es trägt keine zusätzliche theologische Ausdeutung ein. Die Fußnote bietet mit „ungerechte Dinge“ eine vertretbare, stärker formnahe Alternative für das substantivierte neutrale Plural ἄδικα.
