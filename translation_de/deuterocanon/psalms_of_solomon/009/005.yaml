  text: For everyone who does unjust deeds will not be hidden from your knowledge[b][a],
translation:
  language: de
  text: Denn jeder, der Unrecht tut, wird deiner Kenntnis nicht verborgen bleiben.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: „Denn jeder, der ungerechte Dinge tut, wird deiner Kenntnis nicht verborgen bleiben.“'
    reason: Die Fußnote macht die substantivierte neutrale Mehrzahl ἄδικα sichtbar, während der Haupttext sie idiomatisch mit „Unrecht“ wiedergibt.
lexical_decisions:
- source_word: κρυβήσεται
  choice: wird … nicht verborgen bleiben
  rationale: Die futurische Passivform und das Bild des Verborgenseins werden bewahrt; „verborgen bleiben“ ist in diesem Zusammenhang natürliches Deutsch.
- source_word: γνώσεώς σου
  choice: deiner Kenntnis
  rationale: „Kenntnis“ gibt γνῶσις direkt wieder und wahrt die Aussage, dass kein Täter sich Gottes Wissen entziehen kann, ohne sie mit „Aufmerksamkeit“ oder „Blick“ stärker auszudeuten.
- source_word: πᾶς ποιῶν ἄδικα
  choice: jeder, der Unrecht tut
  rationale: „Jeder“ bewahrt die ausdrückliche Universalität von πᾶς; „Unrecht tun“ ist idiomatisch und hält zugleich die Verbindung zum Wortfeld von Gerechtigkeit und Ungerechtigkeit aufrecht.
theological_decisions:
- issue: Bezug zum Wortfeld δίκαιος/ἄδικος
  choice: Unrecht
  alternative: Böses
  rationale: „Unrecht“ bewahrt den im Psalm wichtigen Gegensatz zwischen Gerechtigkeit und Ungerechtigkeit; das allgemeinere „Böses“ würde diesen Zusammenhang abschwächen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die griechische Satzstruktur mit „jeder“ und der Verneinung wird weitgehend erhalten; „verborgen bleiben“ sorgt für eine natürliche deutsche Verbindung mit „Kenntnis“.
