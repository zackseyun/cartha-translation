  source_fidelity: 'Die Übersetzung gibt die Abfolge und die wesentlichen Bedeutungen des Griechischen zuverlässig wieder: ἵνα mit „damit“, δικαιωθῇς als passives Erweisen der Gerechtigkeit Gottes, die Anrede „Gott“, δικαιοσύνη als „Gerechtigkeit“ und ἀνομίαι als „Gesetzlosigkeiten“. „Angesichts“ ist für das syntaktisch und semantisch nicht eindeutig festgelegte zweite ἐν eine vertretbare idiomatische Wiedergabe, ohne die Beziehung unzulässig kausal festzulegen.'
