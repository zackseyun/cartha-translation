base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/009/003.yaml
  text: So that you may be vindicated[a], O God, in your righteousness amid our lawless deeds[c][b];
translation:
  language: de
  text: damit du, Gott, in deiner Gerechtigkeit angesichts unserer Gesetzlosigkeiten als gerecht erwiesen wirst.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: „damit du, Gott, gerechtfertigt wirst“; oder: „damit sich zeigt, dass du im Recht bist“.'
    reason: lexical_alternative
  - marker: b
    text: 'Für „angesichts unserer Gesetzlosigkeiten“ auch möglich: „inmitten unserer Gesetzlosigkeiten“ oder „hinsichtlich unserer Gesetzlosigkeiten“.'
    reason: source_ambiguity
lexical_decisions:
- source_word: ἵνα
  choice: damit
  rationale: Bewahrt die mögliche Zweck- oder Folgebeziehung des griechischen ἵνα und schließt natürlich an den vorausgehenden Zusammenhang an.
- source_word: δικαιωθῇς
  choice: als gerecht erwiesen wirst
  rationale: Das passive Verb bezeichnet bei Gott nicht ein Gerechtwerden, sondern sein Erweisen oder Anerkanntwerden als gerecht; die Formulierung bleibt zugleich näher am Wortfeld von δικαιόω als „bestätigt wirst“.
- source_word: ὁ θεός
  choice: Gott
  rationale: Der formal nominativische Ausdruck fungiert hier als Anrede; im modernen Deutschen ist „Gott“ ohne zusätzliches „o“ natürlich und würdig.
- source_word: ἐν τῇ δικαιοσύνῃ σου
  choice: in deiner Gerechtigkeit
  rationale: Die Wiedergabe wahrt die Präposition und die grundlegende Bedeutungsbreite von δικαιοσύνη zwischen Gerechtigkeit als Eigenschaft und gerechtem Handeln.
- source_word: ἐν ταῖς ἀνομίαις ἡμῶν
  choice: angesichts unserer Gesetzlosigkeiten
  rationale: „Angesichts“ gibt den schwer bestimmbaren Bezugs- oder Situationssinn von ἐν idiomatisch wieder, ohne ihn eindeutig kausal festzulegen. „Gesetzlosigkeiten“ bewahrt die stärkere Bedeutung von ἀνομία gegenüber einem allgemeinen Wort für Sünde.
theological_decisions:
- issue: Bedeutung von δικαιωθῇς bei Gott als Subjekt
  choice: als gerecht erwiesen wirst
  alternative: gerechtfertigt wirst; Recht behältst
  rationale: Die Hauptfassung lässt Gott nicht erst gerecht werden, sondern bezeichnet das Offenbarwerden beziehungsweise Anerkanntwerden seiner Gerechtigkeit. Die formalere, spannungsreichere Alternative wird in einer Fußnote bewahrt.
- issue: Bedeutung von δικαιοσύνη
  choice: Gerechtigkeit
  alternative: gerechtes Handeln
  rationale: „Gerechtigkeit“ bewahrt den zentralen theologischen Begriff und lässt offen, ob vor allem Gottes Eigenschaft oder sein richterliches Handeln gemeint ist.
- issue: Bezug des zweiten ἐν
  choice: angesichts unserer Gesetzlosigkeiten
  alternative: inmitten unserer Gesetzlosigkeiten; hinsichtlich unserer Gesetzlosigkeiten
  rationale: Die syntaktische Beziehung ist mehrdeutig. Die Hauptfassung bezeichnet den Bezug beziehungsweise die Situation, ohne die Wendung ausdrücklich kausal als „wegen“ auszulegen.
translation_notes:
  register: Moderne, würdige Gebetssprache. Der Satzanfang mit „damit“ bewahrt bewusst den Anschlusscharakter des griechischen Verses. „Als gerecht erwiesen“ ist verständlicher als das missverständliche „gerechtfertigt“, während die Fußnote die formale Alternative erhält.
