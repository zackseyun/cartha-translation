  terminology: „Gerechtigkeit“ bewahrt den zentralen Begriff δικαιοσύνη. Die Wiedergabe von δικαιωθῇς vermeidet die im Deutschen missverständliche Vorstellung, Gott werde erst gerecht, während Fußnote a die formal nähere Alternative „gerechtfertigt“ dokumentiert. Die Fußnoten sind passend verankert und machen die relevante Ambiguität der zweiten Präpositionalgruppe transparent.
