  source_fidelity: 'Die Übersetzung gibt die Satzstruktur und die zentralen Ausdrücke des griechischen Textes zuverlässig wieder: Gottes Barmherzigkeit „ruht auf“ den ihn Liebenden, und sein künftiges gnädiges Gedenken gilt seinen Dienern. „In Treue“ ist als kontextuell mögliche Auslegung von ἐν ἀληθείᾳ vertretbar; die Fußnote hält die näheren Alternativen offen. Die Wiedergabe von μνήσεται durch „wird … an … denken“ ist idiomatisch und wahrt den zukunftsbezogenen, zugewandten Sinn.'
