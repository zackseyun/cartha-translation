base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/010/004.yaml
  text: And the mercy of the Lord is upon those who love him in truth[b][a], and the Lord will remember his servants with mercy.
translation:
  language: de
  text: Und die Barmherzigkeit des Herrn ruht auf denen, die ihn in Treue lieben[a], und der Herr wird in Barmherzigkeit an seine Diener[b] denken.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in Wahrheit“ oder „aufrichtig“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Sklaven“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεος / ἐλέει
  choice: Barmherzigkeit / in Barmherzigkeit
  rationale: „Barmherzigkeit“ gibt sowohl das erbarmende Handeln als auch die beständige Güte Gottes wieder und wahrt durch die Wiederholung die Verbindung beider Satzhälften.
- source_word: Κυρίου / Κύριος
  choice: Herr / der Herr
  rationale: Im jüdischen Gebetskontext ist „Herr“ die natürliche Wiedergabe des göttlichen Titels κύριος.
- source_word: ἐπὶ
  choice: ruht auf
  rationale: „Ruht auf“ bewahrt das räumliche Bild der griechischen Präposition und klingt im Deutschen natürlicher als das wörtliche „ist auf“.
- source_word: ἀγαπῶντας αὐτόν
  choice: die ihn lieben
  rationale: Das substantivierte Partizip wird idiomatisch wiedergegeben, ohne seinen allgemeinen, fortdauernden Sinn einzuschränken.
- source_word: ἐν ἀληθείᾳ
  choice: in Treue
  rationale: Hier bezeichnet ἀλήθεια wahrscheinlich eine wahrhaftige, verlässliche Haltung. „In Treue“ ist im Deutschen natürlicher als „in Wahrheit“, ohne die mögliche Bedeutung „aufrichtig“ auszuschließen.
- source_word: μνήσεται
  choice: wird … denken
  rationale: Die Wendung „an jemanden denken“ gibt μιμνῄσκομαι mit Genitiv natürlich wieder; im Kontext meint sie ein wirksames, gnädiges Gedenken.
- source_word: δούλων
  choice: Diener
  rationale: „Diener“ passt zum Gebetskontext und lässt das Zugehörigkeits- und Dienstverhältnis erkennen; die stärkere soziale Bedeutung „Sklaven“ wird in einer Fußnote genannt.
theological_decisions:
- issue: Bedeutungsweite von ἐν ἀληθείᾳ
  choice: in Treue
  alternative: in Wahrheit; aufrichtig
  rationale: Die Übersetzung wahrt den relationalen und ethischen Gehalt, ohne die Wendung auf bloße subjektive Aufrichtigkeit oder auf propositionale Wahrheit festzulegen.
- issue: Wiedergabe von δοῦλος
  choice: Diener
  alternative: Sklave
  rationale: Der Vers betont Gottes barmherziges Gedenken an die ihm Zugehörigen. „Diener“ ist dafür im Deutschen angemessen, während die Fußnote die stärkere Statusbedeutung offenhält.
- issue: Göttliches Erinnern
  choice: der Herr wird … an seine Diener denken
  alternative: der Herr wird seiner Diener gedenken
  rationale: Die Formulierung bezeichnet nicht das Wiedererlangen einer verlorenen Erinnerung, sondern Gottes zugewandtes und wirksames Gedenken; die natürliche deutsche Wendung lässt dies im Kontext offen hervortreten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit leicht poetischem Klang. Die beiden Vorkommen von ἔλεος werden bewusst mit „Barmherzigkeit“ wiedergegeben. Sämtliche Fußnotenmarker stehen unmittelbar bei den betreffenden Ausdrücken.
