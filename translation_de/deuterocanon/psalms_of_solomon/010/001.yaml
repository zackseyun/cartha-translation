base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/010/001.yaml
  text: Blessed is the man whom the Lord remembered with rebuke[a], and who was turned away from an evil way by a scourge, to be cleansed from sin[e][d][c][b], so that it might not increase.
translation:
  language: de
  text: Glücklich zu preisen ist der Mann, dessen der Herr mit Zurechtweisung gedachte[a] und der durch eine Geißel von einem bösen Weg abgehalten wurde[b], um von Sünde gereinigt zu werden, damit sie nicht zunimmt.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit Tadel“ beziehungsweise „mit Ermahnung“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „umringt“ oder „eingeschlossen“; gemeint ist offenbar, dass er von dem bösen Weg ferngehalten oder gegen ihn abgesperrt wurde.'
    reason: lexical_alternative
  - marker: c
    text: 'Der knappe Schlusssatz kann auch verstanden werden als: „damit er die Sünde nicht vermehrt“ oder, mit Bezug auf die Sünde, „damit sie nicht zunimmt“.'
    reason: alternative_reading
lexical_decisions:
- source_word: Μακάριος
  choice: Glücklich zu preisen
  rationale: Bewahrt den Charakter einer Seligpreisung, ohne das Wort auf ein bloßes Glücksgefühl zu verengen.
- source_word: ἀνὴρ
  choice: der Mann
  rationale: Gibt das grammatisch maskuline Singularwort genau wieder; der Kontext verlangt keine Verallgemeinerung zu „Mensch“.
- source_word: ἐμνήσθη
  choice: gedachte
  rationale: Entspricht dem Grundsinn „sich erinnern/gedenken“ und bewahrt die Vorstellung, dass der Herr sich dem Mann in seiner Zurechtweisung aufmerksam zuwendet.
- source_word: ἐν ἐλεγμῷ
  choice: mit Zurechtweisung
  rationale: Drückt den korrigierenden, tadelnden Sinn aus und ist im modernen Deutschen verständlicher als „in Rüge“.
- source_word: ἐκυκλώθη
  choice: wurde … abgehalten
  rationale: Die wörtliche Bedeutung ist „wurde umringt/eingeschlossen“; im Zusammenhang bezeichnet sie bildhaft ein Begrenzen oder Absperren gegenüber einem bösen Weg. Die Bildhaftigkeit wird in der Fußnote kenntlich gemacht.
- source_word: ἀπὸ ὁδοῦ πονηρᾶς
  choice: von einem bösen Weg
  rationale: Bewahrt das verbreitete Bild des Weges für moralisches Verhalten und gibt πονηρός sachgerecht wieder.
- source_word: ἐν μάστιγι
  choice: durch eine Geißel
  rationale: Bewahrt das konkrete Bild körperlicher Züchtigung; „Geißel“ ist würdevoll und entspricht dem griechischen Substantiv genauer als eine abstrakte Wiedergabe wie „Strafe“.
- source_word: καθαρισθῆναι ἀπὸ ἁμαρτίας
  choice: um von Sünde gereinigt zu werden
  rationale: Bewahrt den passiven Infinitiv, den Reinigungsgedanken und den Singular von ἁμαρτία.
- source_word: τοῦ μὴ πληθῦναι
  choice: damit sie nicht zunimmt
  rationale: Versteht „Sünde“ als naheliegenden unausgesprochenen Bezug des knappen griechischen Zwecksatzes; die syntaktische Mehrdeutigkeit wird in der Fußnote offengehalten.
theological_decisions:
- issue: Bezug und Funktion von τοῦ μὴ πληθῦναι
  choice: „damit sie nicht zunimmt“, mit „Sünde“ als Bezug
  alternative: „damit er sie nicht vermehrt“ oder unpersönlich „damit es nicht mehr wird“
  rationale: Der unmittelbar vorausgehende Singular ἁμαρτίας legt „Sünde“ als Bezug nahe. Das Griechische nennt jedoch weder Subjekt noch Objekt ausdrücklich; deshalb wird die mögliche personenbezogene Deutung nicht dogmatisch ausgeschlossen, sondern in der Fußnote dokumentiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Glücklich zu preisen“ markiert die Seligpreisungsformel; „dessen … gedachte“ ist leicht gehoben, bewahrt aber die ungewöhnliche Aussage des griechischen μιμνῄσκομαι besser als eine freie Umschreibung. Die konkrete Disziplinmetaphorik von „Geißel“ bleibt erhalten.
