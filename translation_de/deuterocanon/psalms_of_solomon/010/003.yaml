  yaml_path: translation/deuterocanon/psalms_of_solomon/010/003.yaml
  text: For he has made straight the ways of the righteous[c][b][a], and he will not pervert them in discipline.
translation:
  language: de
  text: Denn er hat die Wege der Gerechten gerade gemacht und wird sie bei der Zurechtweisung[a] nicht krumm machen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „durch Zurechtweisung“. Das griechische Wort kann auch „Erziehung“, „Schulung“ oder „Disziplinierung“ bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Das Objekt steht im Griechischen nicht ausdrücklich da. Möglich ist auch der Sinn: „und er wird die Gerechten durch Zurechtweisung nicht vom rechten Weg abbringen“.'
    reason: ambiguity
lexical_decisions:
- source_word: ὤρθωσε
  choice: hat … gerade gemacht
  rationale: Die Wendung bewahrt das konkrete Bild gerader Wege und gibt den perfektiven griechischen Aorist im Deutschen natürlich wieder.
- source_word: ὁδοὺς
  choice: die Wege
  rationale: „Wege“ erhält sowohl das räumliche Bild als auch den übertragenen Bezug auf Lebensführung.
- source_word: δικαίων
  choice: der Gerechten
  rationale: Der substantivierte Genitiv Plural bezeichnet gerechte Menschen; „der Gerechten“ ist prägnant und im gehobenen modernen Deutsch geläufig.
- source_word: διαστρέψει
  choice: wird … nicht verdrehen
  rationale: „Verdrehen“ bildet einen deutlichen Gegensatz zu „gerade gemacht“ und bewahrt die räumliche Metaphorik, ohne sie abstrakt als moralisches Unrecht auszulegen.
- source_word: ἐν παιδείᾳ
  choice: bei der Zurechtweisung
  rationale: „Zurechtweisung“ trifft hier den korrigierenden Aspekt von παιδεία. „Bei“ lässt offen, ob ein begleitender Umstand oder ein engerer Zusammenhang mit der Zurechtweisung gemeint ist.
theological_decisions:
- issue: Verhältnis der göttlichen Zurechtweisung zu den Wegen der Gerechten
  choice: Gott macht die Wege der Gerechten gerade und verdreht diese Wege auch im Zusammenhang mit Zurechtweisung nicht.
  alternative: 'Gott führt die Gerechten durch seine Zurechtweisung nicht in die Irre; oder: Er handelt beim Zurechtweisen nicht ungerecht.'
  rationale: Das unmittelbar vorausgehende ὁδοὺς legt nahe, die nicht ausdrücklich genannte Ergänzung zu διαστρέψει auf die „Wege“ zu beziehen. Eine Fußnote wahrt jedoch die grammatische Offenheit.
translation_notes:
  register: Moderne, würdige Standardsprache mit erhaltener Wegmetaphorik. „Zurechtweisung“ vermeidet das heute altertümliche und missverständliche „Zucht“; die Fußnoten halten die semantische und syntaktische Mehrdeutigkeit offen.
