base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/010/008.yaml
  text: For God is kind and merciful forever[b][a], and the assemblies of Israel will glorify the name of the Lord.
translation:
  language: de
  text: Denn Gott ist gütig[a] und barmherzig in Ewigkeit, und die Versammlungen[b] Israels werden den Namen des Herrn verherrlichen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »gut«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Gemeinden« beziehungsweise »Zusammenkünfte«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Denn
  rationale: Leitet die Begründung oder Erläuterung des vorausgehenden Gedankens ein und bewahrt die kausale Kraft in natürlichem Deutsch.
- source_word: χρηστός
  choice: gütig
  rationale: Gibt die wohlwollende, freundlich-gute Wesensart wieder und fügt sich neben „barmherzig“, ohne den Ausdruck auf das allgemeinere „gut“ zu verengen.
- source_word: ἐλεήμων
  choice: barmherzig
  rationale: Ist die direkte, etablierte deutsche Wiedergabe für erbarmende göttliche Zuwendung.
- source_word: εἰς τὸν αἰῶνα
  choice: in Ewigkeit
  rationale: Entspricht der festen biblischen Zeitformel und bezeichnet unbegrenzte Dauer in würdigem, verständlichem Deutsch.
- source_word: συναγωγαὶ
  choice: Versammlungen
  rationale: Bezeichnet die versammelten Gemeinschaften Israels, ohne vorschnell eine spätere institutionelle Bedeutung von „Synagogen“ einzutragen.
- source_word: δοξάσουσιν
  choice: werden … verherrlichen
  rationale: Bewahrt sowohl das Futur als auch den starken doxologischen Sinn des Verbs.
- source_word: Κυρίου
  choice: des Herrn
  rationale: Gibt den göttlichen Titel im Genitiv innerhalb der natürlichen deutschen Wendung „den Namen des Herrn“ wieder.
theological_decisions:
- issue: Wiedergabe von κύριος in einem griechisch überlieferten frühjüdischen Text
  choice: des Herrn
  alternative: des HERRN
  rationale: Der Text bietet κύριος, nicht unmittelbar das hebräische Tetragramm. „Herr“ bewahrt den griechischen Titel, ohne eine nicht ausdrücklich vorliegende hebräische Ausgangsform typografisch festzulegen.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem biblischem Klang. Die parallele Aussageform, das Futur und die doxologische Wortwahl bleiben erhalten; institutionell engführende Begriffe werden vermieden.
