  yaml_path: translation/deuterocanon/psalms_of_solomon/010/006.yaml
  text: Righteous and holy is our Lord in his judgments forever[a], and Israel will praise the name of the Lord with gladness.
translation:
  language: de
  text: Gerecht und heilig ist unser Herr in seinen Urteilen auf ewig, und Israel wird den Namen des Herrn mit Freude preisen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δίκαιος
  choice: gerecht
  rationale: Das Adjektiv bezeichnet hier die moralische und richterliche Gerechtigkeit des Herrn. „Gerecht“ bewahrt beide Aspekte, ohne den Ausdruck auf bloße Unparteilichkeit zu verengen.
- source_word: ὅσιος
  choice: heilig
  rationale: Als Aussage über Gott gibt „heilig“ den sakralen und sittlichen Gehalt des griechischen Adjektivs im Deutschen am natürlichsten wieder.
- source_word: Κύριος ἡμῶν
  choice: unser Herr
  rationale: κύριος ist hier Gottesbezeichnung; die traditionelle und zugleich allgemein verständliche Wiedergabe lautet „Herr“.
- source_word: κρίμασιν αὐτοῦ
  choice: in seinen Urteilen
  rationale: Der Dativ bezeichnet den Bereich, in dem sich Gottes Gerechtigkeit und Heiligkeit zeigen. „Urteile“ wahrt die richterliche Bedeutung, ohne unnötig zu erläutern.
- source_word: εἰς τὸν αἰῶνα
  choice: auf ewig
  rationale: Die feste Wendung bezeichnet unbegrenzte Dauer. „Auf ewig“ entspricht dem gehobenen poetischen Register des Psalms und bleibt im modernen Deutsch verständlich.
- source_word: αἰνέσει
  choice: wird … preisen
  rationale: Die Futurform wird mit dem deutschen Futur wiedergegeben; „preisen“ trifft den gottesdienstlichen Sinn von αἰνέω.
- source_word: τῷ ὀνόματι Κυρίου
  choice: den Namen des Herrn
  rationale: Der griechische Dativ steht beim Verb des Preisens als Ergänzung. Die relativ formale Wiedergabe erhält das theologisch gewichtige Motiv des göttlichen Namens.
- source_word: ἐν εὐφροσύνῃ
  choice: mit Freude
  rationale: Die Präpositionalgruppe beschreibt die Art des Lobpreises. „Mit Freude“ ist klar, natürlich und bewahrt den festlichen Ton.
theological_decisions:
- issue: Wiedergabe der beiden vorangestellten Prädikate δίκαιος und ὅσιος
  choice: gerecht und heilig
  alternative: gerecht und treu
  rationale: Die gewählte Fassung erhält sowohl die moralisch-richterliche als auch die sakrale Dimension, ohne ὅσιος deutend auf Bundestreue festzulegen.
- issue: Stellung der göttlichen Eigenschaften vor dem Subjekt
  choice: Gerecht und heilig ist unser Herr
  alternative: Unser Herr ist gerecht und heilig
  rationale: Die Voranstellung im Griechischen hebt die Eigenschaften hervor und lässt sich in würdigem, verständlichem Deutsch bewahren; die Fußnote nennt die sachlich gleichwertige Normalstellung.
translation_notes:
  register: Poetisch-gehobenes, aber modernes Standarddeutsch. Die markierte Voranstellung der Prädikate folgt dem griechischen Psalmstil; „auf ewig“ und „preisen“ tragen den würdigen liturgischen Ton, ohne altertümlich zu wirken.
