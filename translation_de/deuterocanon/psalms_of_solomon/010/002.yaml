base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/010/002.yaml
  text: The one who prepares his back for scourges will be cleansed[d][c][b][a], for the Lord is good to those who endure discipline.
translation:
  language: de
  text: Wer seinen Rücken für Geißelhiebe hinhält, wird gereinigt werden[a]; denn der Herr ist gut zu denen, die Züchtigung ertragen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wird geläutert werden“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Erziehung“, „Zurechtweisung“ oder „Disziplin“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἑτοιμάζων
  choice: Wer … bereithält
  rationale: Das substantivierte Präsenspartizip bezeichnet allgemein einen Menschen, der sich zur Annahme der Züchtigung bereitmacht. Die deutsche Wer-Konstruktion gibt diesen generischen Sinn natürlich wieder.
- source_word: νῶτον
  choice: seinen Rücken
  rationale: νῶτον bezeichnet den Rücken; im Deutschen verlangt die persönliche Aussage idiomatisch ein Possessivpronomen.
- source_word: εἰς μάστιγας
  choice: für Geißelhiebe
  rationale: Die Wendung bezeichnet die Bereitschaft, Schläge als Züchtigung zu empfangen. „Geißelhiebe“ bewahrt das konkrete Bild und den Bezug zu μάστιξ, ohne eine bestimmte Strafpraxis festzulegen.
- source_word: καθαρισθήσεται
  choice: wird gereinigt werden
  rationale: Das Futur Passiv bezeichnet eine daraus folgende Reinigung. Die Formulierung bleibt offen für moralische, geistliche oder kultische Nuancen.
- source_word: χρηστὸς
  choice: gut
  rationale: χρηστός kann „gut“, „gütig“ oder „freundlich“ bedeuten. „Gut“ ist hier eine klare und breite Charakteraussage über den Herrn.
- source_word: κύριος
  choice: der Herr
  rationale: Die übliche und kontextuell angemessene Wiedergabe von κύριος ist „der Herr“.
- source_word: τοῖς ὑπομένουσιν
  choice: zu denen, die … ertragen
  rationale: ὑπομένω bezeichnet standhaftes Ausharren unter einer Belastung. „Ertragen“ passt unmittelbar zur hier genannten Züchtigung.
- source_word: παιδείαν
  choice: Züchtigung
  rationale: Im Zusammenhang mit Geißelhieben meint παιδεία korrigierende Erziehung oder disziplinierende Zurechtweisung. „Züchtigung“ erhält diesen ernsten korrektiven Sinn.
theological_decisions:
- issue: Art der Reinigung durch angenommene Züchtigung
  choice: Die Aussage lässt die Reinigung als Folge bereitwillig ertragener göttlicher Züchtigung stehen, ohne ihre genaue Art festzulegen.
  alternative: Man kann die Reinigung enger kultisch oder weiter als moralische Läuterung beziehungsweise Rechtfertigung durch Leiden verstehen.
  rationale: καθαρισθήσεται bezeichnet tatsächlich Reinigung, während der Zusammenhang mit παιδεία besonders an korrigierende Läuterung denken lässt. Der Wortlaut entscheidet jedoch nicht ausdrücklich zwischen kultischer, moralischer und anderer Bildlichkeit.
- issue: Charakter und Wirkung der παιδεία
  choice: παιδεία wird als korrigierende „Züchtigung“ wiedergegeben.
  alternative: Möglich sind auch „Erziehung“, „Zurechtweisung“ oder „Disziplin“.
  rationale: Das Bild der Geißelhiebe gibt dem Begriff hier eine schmerzhafte, korrektive Färbung; zugleich darf er nicht auf bloße Bestrafung verengt werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die konkrete Körpermetapher bleibt erhalten; die generische Wer-Konstruktion ist inklusiv und natürlich. „Züchtigung“ wirkt bewusst ernster als „Erziehung“, entspricht hier aber dem unmittelbaren Bild der Geißelhiebe.
