  yaml_path: translation/deuterocanon/psalms_of_solomon/010/007.yaml
  text: And the pious will give thanks in the assembly of the people[d][c][b][a], and God will have mercy on the poor in the gladness of Israel.
translation:
  language: de
  text: Und die Frommen[a] werden in der Versammlung des Volkes Dank sagen, und Gott wird sich der Armen erbarmen in der Freude Israels.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Treuen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „bei Israels Jubel“. Die griechische Wendung lässt offen, wie genau die Freude Israels mit Gottes Erbarmen verbunden ist.'
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: ὅσιοι
  choice: die Frommen
  rationale: Bezeichnet Menschen, die durch Frömmigkeit beziehungsweise Bundestreue geprägt sind. „Die Frommen“ unterscheidet den Ausdruck von ἅγιοι („die Heiligen“) und bleibt im modernen Deutschen verständlich.
- source_word: ἐξομολογήσονται
  choice: werden … Dank sagen
  rationale: Im religiösen Sprachgebrauch der Septuaginta bezeichnet das Verb häufig öffentliches Danken oder Preisen. Der Versammlungskontext stützt „Dank sagen“ statt eines bloßen „bekennen“.
- source_word: ἐν ἐκκλησίᾳ λαοῦ
  choice: in der Versammlung des Volkes
  rationale: Gibt den öffentlichen, gemeinschaftlichen Rahmen direkt wieder, ohne ἐκκλησία vorschnell mit einem später geprägten Kirchenbegriff gleichzusetzen.
- source_word: πτωχοὺς
  choice: der Armen
  rationale: Die deutsche Konstruktion „sich der Armen erbarmen“ gibt den direkten sozialen und materiellen Sinn des griechischen Ausdrucks wieder.
- source_word: ἐλεήσει
  choice: wird sich … erbarmen
  rationale: „Sich erbarmen“ ist eine natürliche und theologisch gewichtige deutsche Entsprechung für das Handeln göttlicher Barmherzigkeit.
- source_word: ἐν εὐφροσύνῃ Ἰσραήλ
  choice: in der Freude Israels
  rationale: Die formal nahe Wiedergabe bewahrt sowohl das Motiv der Freude als auch die offene Beziehung der Präpositionalphrase zu Gottes Erbarmen.
theological_decisions:
- issue: Identität der ὅσιοι
  choice: die Frommen
  alternative: die Treuen; die Heiligen
  rationale: „Die Frommen“ gibt Frömmigkeit und mögliche Bundestreue wieder, ohne die Gruppe ausdrücklich mit „Heiligen“ gleichzusetzen oder ihre Treue stärker auszudeuten, als der Ausdruck selbst verlangt.
- issue: Bezug von ἐν εὐφροσύνῃ Ἰσραήλ
  choice: in der Freude Israels
  alternative: bei Israels Jubel; inmitten von Israels Freude
  rationale: Die knappe griechische Schlussphrase kann den Rahmen von Gottes Erbarmen bezeichnen, lässt ihre genaue semantische Beziehung aber offen. Die Hauptfassung bewahrt diese Spannung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt dem parallelen Aufbau des griechischen Textes nahe; „Versammlung“ vermeidet unnötig kirchlich-konfessionelle Festlegungen.
