  text: Das Heil des Herrn ist über dem Haus Israel zu ewiger Freude.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder als Segenswunsch: „Das Heil des Herrn sei über dem Haus Israel zu ewiger Freude.“ Im Griechischen steht in diesem Satz kein ausdrückliches Verb.'
    reason: alternative_reading
