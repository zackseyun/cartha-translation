    reason: textual_note
lexical_decisions:
- source_word: τοῦ κυρίου
  choice: des Herrn
  rationale: Der Genitiv wird natürlich possessiv wiedergegeben; κύριος entspricht im biblisch-liturgischen Sprachgebrauch „Herr“.
- source_word: ἡ σωτηρία
  choice: das Heil
  rationale: σωτηρία bezeichnet Rettung und heilvolle Bewahrung. „Heil“ wahrt hier die umfassende religiöse Bedeutung und passt zum psalmischen Register.
- source_word: ἐπὶ οἶκον Ἰσραήλ
  choice: kommt über das Haus Israel
  rationale: Die griechische Aussage ist ohne ausdrückliches Verb. „Kommt über“ gibt die Wendung mit ἐπί verständlich wieder, ohne „Haus Israel“ zu verkürzen.
- source_word: εἰς
  choice: und bringt
  rationale: εἰς bezeichnet hier wahrscheinlich Ziel oder Ergebnis. Die verbale Wiedergabe macht diesen Zusammenhang im Deutschen natürlich verständlich, ohne streng zwischen Zweck und Folge zu entscheiden.
- source_word: εὐφροσύνην
  choice: Freude
  rationale: Swetes gedruckter Text liest εὐφροσύνην („Freude, Frohsinn“). Die in den bereitgestellten Quelldaten angeführte Form σωφροσύνην ist nach der dokumentierten Textprüfung ein Übertragungsfehler.
- source_word: αἰώνιον
  choice: ewige
  rationale: Das Adjektiv bezeichnet die bleibende, nicht endende Dauer der Freude.
theological_decisions:
- issue: Wiedergabe von κύριος im griechisch-jüdischen liturgischen Kontext
  choice: Herr
  alternative: Gebieter
  rationale: „Herr“ entspricht dem etablierten biblischen Gebrauch und legt keine weitergehende konfessionelle Deutung fest.
- issue: Aussageweise der verblosen Nominalklausel
  choice: 'Aussage: „kommt über“'
  alternative: 'Segenswunsch: „sei über“'
  rationale: Der unmittelbare Wortlaut lässt im Deutschen sowohl eine feststellende als auch eine segensartige Ergänzung zu. Der Haupttext liest die Klausel als Heilszusage; die alternative Aussageweise wird in einer Fußnote bewahrt.
- issue: Textform des abschließenden Substantivs
  choice: εὐφροσύνην („Freude“)
  alternative: σωφροσύνην („Selbstbeherrschung/Besonnenheit“)
  rationale: Die dokumentierte Prüfung der genannten Swete-Ausgabe identifiziert σωφροσύνην in der übermittelten Zeile als Transkriptions- beziehungsweise OCR-Fehler. Daher folgt der Haupttext dem gedruckten εὐφροσύνην; die Abweichung wird transparent vermerkt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Haus Israel“ bleibt als biblische Kollektivbezeichnung erhalten. Die leicht freie Verknüpfung „und bringt“ bildet die Ziel- oder Ergebnisbedeutung von εἰς idiomatisch ab.
