  yaml_path: translation/deuterocanon/psalms_of_solomon/010/005.yaml
  text: For the testimony is in the law of the everlasting covenant[a]; the testimony of the Lord is upon the ways of men in visitation.
translation:
  language: de
  text: Denn das Zeugnis steht im Gesetz des ewigen Bundes; das Zeugnis des Herrn betrifft die Wege der Menschen bei der Heimsuchung.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder als ein Satz: „Denn das Zeugnis im Gesetz des ewigen Bundes ist das Zeugnis des Herrn über die Wege der Menschen bei der Heimsuchung.“ Das griechische Wort für „Heimsuchung“ kann auch Prüfung, Aufsicht oder ein göttliches Aufsuchen bezeichnen.'
    reason: Die verblosen griechischen Satzteile lassen sich syntaktisch auch enger verbinden; außerdem besitzt ἐπισκοπή eine bewusst nicht eindeutig auf Gericht oder Fürsorge festgelegte Bedeutungsbreite.
lexical_decisions:
- source_word: μαρτυρία
  choice: Zeugnis
  rationale: „Zeugnis“ bewahrt den rechtlichen und bundesbezogenen Klang des griechischen Substantivs und lässt sowohl eine bezeugende Aussage als auch deren Inhalt anklingen.
- source_word: ἐν νόμῳ διαθήκης αἰωνίου
  choice: steht im Gesetz des ewigen Bundes
  rationale: „Im Gesetz“ gibt die lokative Präposition ἐν wieder; das idiomatische „steht“ ergänzt die im Griechischen fehlende Kopula, ohne den Satz unnötig auszudeuten. „Ewiger Bund“ ist die natürliche und traditionsfähige Wiedergabe von διαθήκη αἰώνιος.
- source_word: Κυρίου
  choice: des Herrn
  rationale: Der Genitiv wird formal bewahrt; „Herr“ ist in diesem göttlichen und bundesbezogenen Zusammenhang die angemessene Wiedergabe von κύριος.
- source_word: ἐπὶ ὁδοὺς ἀνθρώπων
  choice: betrifft die Wege der Menschen
  rationale: Bei μαρτυρία bezeichnet ἐπί plausibel den Gegenstand, auf den sich das Zeugnis richtet. „Die Wege der Menschen“ bewahrt das biblische Bild für menschliches Verhalten und gibt ἀνθρώπων allgemein-menschlich wieder.
- source_word: ἐν ἐπισκοπῇ
  choice: bei der Heimsuchung
  rationale: „Heimsuchung“ erhält die substantivische Form und die für ἐπισκοπή typische Spannung zwischen prüfendem Aufsuchen, Aufsicht und möglichem Gericht. Die Fußnote erläutert diese Bedeutungsbreite.
theological_decisions:
- issue: Bedeutung der göttlichen ἐπισκοπή
  choice: bei der Heimsuchung
  alternative: bei der Prüfung / wenn der Herr nach ihnen sieht
  rationale: Der Kontext legt göttliche Prüfung nahe, entscheidet aber nicht eindeutig zwischen fürsorglichem Aufsuchen und gerichtlicher Untersuchung. „Heimsuchung“ hält diese Spannung offen.
- issue: Satzbau des zweifach gesetzten ἡ μαρτυρία
  choice: zwei parallele Teilsätze
  alternative: ein einziger Satz, in dem das erste „Zeugnis“ Subjekt und das zweite Prädikatsnomen ist
  rationale: Die Wiederholung des Artikels mit μαρτυρία und die Gliederung der griechischen Zeile sprechen eher für einen poetischen Bicolon. Die alternative syntaktische Verbindung bleibt jedoch möglich und wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst biblischer Bildsprache. Der parallele Aufbau und die Wiederholung von „Zeugnis“ bleiben erhalten; „Heimsuchung“ wird wegen seiner theologischen Bedeutungsbreite beibehalten und in der Fußnote erklärt.
