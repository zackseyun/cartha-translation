  yaml_path: translation/deuterocanon/psalms_of_solomon/002/019.yaml
  text: You made their memorial perish from the earth[a]. God is a righteous judge[d][c][b], and he will not show partiality.
translation:
  language: de
  text: Du hast ihr Gedenken von der Erde her bekannt gemacht.[a][b] Gott ist ein gerechter Richter und wird niemanden bevorzugen.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Verb bedeutet gewöhnlich »bekannt machen«, »offenbaren« oder »deutlich machen«. Die gesamte Wendung ist hier ungewöhnlich; bisweilen wird vermutet, gemeint sei, dass ihr Gedenken von der Erde getilgt wurde, doch so lautet der überlieferte griechische Text nicht.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »vom Land her«; das griechische Wort kann sowohl »Erde« als auch »Land« bedeuten.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: »wird kein Gesicht bewundern«; im Zusammenhang eines Richters bezeichnet die Wendung Parteilichkeit oder Bevorzugung aufgrund der Person.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδήλωσας
  choice: hast … bekannt gemacht
  rationale: Das Verb δηλόω bedeutet regulär »bekannt machen«, »offenbaren« oder »deutlich machen«. Obwohl die Verbindung mit »von der Erde her« ungewöhnlich ist, folgt die Übersetzung dem überlieferten griechischen Wortlaut und ersetzt ihn nicht ohne Handschriftenbeleg durch »auslöschen« oder »verschwinden lassen«.
- source_word: τὸ μνημόσυνον αὐτῶν
  choice: ihr Gedenken
  rationale: μνημόσυνον bezeichnet das Gedenken, die Erinnerung oder ein Erinnerungszeichen. »Ihr Gedenken« bewahrt den möglichen kollektiven und öffentlichen Sinn.
- source_word: ἀπὸ τῆς γῆς
  choice: von der Erde her
  rationale: ἀπό bezeichnet hier formal den Ausgangspunkt; γῆ kann »Erde« oder »Land« bedeuten. »Von der Erde her« wahrt die ungewöhnliche Konstruktion, ohne sie als Tilgung von der Erde auszulegen.
- source_word: κριτὴς δίκαιος
  choice: ein gerechter Richter
  rationale: Die Wendung beschreibt Gott als Richter, dessen Urteil gerecht ist; die traditionelle deutsche Formulierung ist zugleich klar und quellentreu.
- source_word: οὐ θαυμάσει πρόσωπον
  choice: wird niemanden nach seiner Person bevorzugen
  rationale: Wörtlich steht »wird kein Gesicht bewundern«. Gemeint ist im richterlichen Zusammenhang, sich nicht von Rang, Ansehen oder Identität einer Person beeinflussen zu lassen.
theological_decisions:
- issue: Deutung der ungewöhnlichen ersten Aussage
  choice: 'Der regulären Bedeutung von ἐδήλωσας folgen: »bekannt gemacht«'
  alternative: »Du hast ihr Gedenken von der Erde verschwinden lassen/ausgelöscht«
  rationale: Die alternative Deutung passt zwar zu einem verbreiteten biblischen Motiv, widerspricht jedoch der normalen Bedeutung des tatsächlich überlieferten Verbs. Die Übersetzung wahrt deshalb die Schwierigkeit des griechischen Textes und erläutert sie, statt stillschweigend zu emendieren.
- issue: Wiedergabe der richterlichen Unparteilichkeit
  choice: »wird niemanden nach seiner Person bevorzugen«
  alternative: 'Wörtlich: »wird kein Gesicht bewundern«'
  rationale: Die idiomatische Wiedergabe vermittelt die Aussage über Gottes unparteiisches Gericht verständlich, ohne eine konfessionelle Zuspitzung einzuführen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die schwer verständliche erste Satzhälfte bleibt bewusst nahe am sicher bezeugten griechischen Wortlaut; die Fußnote benennt die kontextuell naheliegende, aber textkritisch nicht gesicherte Alternativdeutung. Der zweite Satz wird idiomatisch und allgemeinverständlich wiedergegeben.
