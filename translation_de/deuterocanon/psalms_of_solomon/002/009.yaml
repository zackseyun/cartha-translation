lexical_decisions:
- source_word: πονηρά
  choice: Böses
  rationale: Das substantivierte „Böses“ bewahrt die breite moralische Bedeutung und die knappe Ausdrucksweise des Griechischen.
- source_word: ἐποίησαν
  choice: taten
  rationale: „Böses tun“ ist im Deutschen natürlich und entspricht dem einfachen griechischen Verb.
- source_word: εἰς ἅπαξ
  choice: gemeinsam
  rationale: Im unmittelbaren Zusammenhang, besonders nach der Aufzählung verschiedener Bevölkerungsgruppen in Vers 8, bezeichnet die Wendung wahrscheinlich gemeinsames beziehungsweise allseitiges Handeln. Die ebenfalls mögliche Bedeutung „ein für alle Mal“ wird in der Fußnote offengehalten.
- source_word: τοῦ μὴ ἀκοῦσαι
  choice: ohne zu hören
  rationale: Die knappe Infinitivkonstruktion bleibt als negative Begleitumstands-, Zweck- oder Folgeangabe erhalten, ohne vorschnell ausdrückliche Verweigerung festzulegen.
theological_decisions:
- issue: Bezug und Sinn von εἰς ἅπαξ
  choice: gemeinsam
  alternative: ein für alle Mal; vollständig
  rationale: Der Nahkontext legt die gemeinsame Beteiligung der zuvor genannten Gruppen nahe; da die griechische Wendung auch Endgültigkeit oder Vollständigkeit ausdrücken kann, werden diese Möglichkeiten nicht ausgeschlossen, sondern in der Fußnote genannt.
- issue: Funktion von τοῦ μὴ ἀκοῦσαι
  choice: ohne zu hören
  alternative: um nicht zu hören; weil sie nicht hören wollten
  rationale: Die griechische Konstruktion kann Zweck, Folge oder eine näher beschreibende Haltung anzeigen. Die Übersetzung vermeidet es, Absicht oder bewusste Weigerung stärker festzulegen, als der Wortlaut verlangt.
translation_notes:
  register: Knapper, würdevoller moderner Standardstil. „Gemeinsam Böses tun“ ist gut verständlich; „ohne zu hören“ bewahrt bewusst die Spannung der ungewöhnlichen griechischen Infinitivkonstruktion.
