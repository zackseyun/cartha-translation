  source_fidelity: „Gemeinsam“ ist für εἰς ἅπαξ im vorliegenden Nahkontext eine gut vertretbare Wiedergabe und bewahrt die bestehende Mehrdeutigkeit durch die Fußnote. Die negative Infinitivkonstruktion τοῦ μὴ ἀκοῦσαι wird jedoch mit „ohne zu hören“ im Deutschen zu stark als bloßes akustisches Hören verstanden; „ohne zuzuhören“ gibt die offene, absolute Verwendung von ἀκούειν treffender wieder, ohne Absicht oder Verweigerung einzutragen.
  naturalness: „Gemeinsam Böses tun“ ist knapp und idiomatisch. „Ohne zuzuhören“ ist im modernen Standarddeutsch deutlich natürlicher als „ohne zu hören“. Der Fußnotentext zu a ist in der vorliegenden Stellung syntaktisch missglückt und muss auf die markierte Wendung bezogen formuliert werden.
  terminology: '„Böses“ und „taten“ sind angemessen, sachlich und registergerecht. Die Fußnotenmarker müssen unmittelbar bei den jeweiligen Bezugswörtern stehen: a bei „gemeinsam“, b bei „zuzuhören“.'
