    rationale: „Ohne zu hören“ kann im Deutschen lediglich fehlende Wahrnehmung bedeuten. Das absolute ἀκούειν ist hier besser mit „zuhören“ wiedergegeben; dies bleibt gegenüber „nicht hören wollen“ bzw. „sich weigern zuzuhören“ nicht stärker interpretierend.
  - severity: medium
    issue: Fehlplatzierte und ungrammatische Fußnote zu εἰς ἅπαξ
    rationale: Marker a steht bei „Böses“, obwohl die Anmerkung εἰς ἅπαξ betrifft. Zudem ist „ein für alle Mal Böses“ keine angemessene deutsche Alternativformulierung. Die Alternative muss als Adverbialbestimmung ausgewiesen werden.
