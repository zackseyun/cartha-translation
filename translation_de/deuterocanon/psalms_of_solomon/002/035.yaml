  text: the one who raises me to glory and brings the proud to everlasting destruction in disgrace[d][c][b][a], because they did not know him.
translation:
  language: de
  text: der mich zur Herrlichkeit emporhebt und die Hochmütigen in Schande dem ewigen Verderben[a] zuführt, weil sie ihn nicht kannten.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „dem Verderben des Zeitalters“; auch: „dem Verderben für immer“.'
    reason: lexical_alternative
  - marker: b
