    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνιστῶν
  choice: emporhebt
  rationale: Das Partizip bezeichnet ein Aufrichten oder Emporheben. „Emporhebt“ bewahrt die räumliche Vorstellung und ergibt zusammen mit „zur Herrlichkeit“ zugleich den vom Kontext nahegelegten Sinn der Erhöhung.
- source_word: εἰς δόξαν
  choice: zur Herrlichkeit
  rationale: εἰς bezeichnet hier Ziel oder Ergebnis. „Zur Herrlichkeit“ ist im Deutschen natürlich und lässt diese Zielrichtung bestehen.
- source_word: κομίζων
  choice: zuführt
  rationale: Die im vorgelegten griechischen Ausgangstext stehende Form κομίζων bedeutet hier „bringen“ beziehungsweise „hinführen“. Mit dem anschließenden εἰς-Ausdruck gibt „dem … Verderben zuführt“ die Zielbewegung idiomatisch wieder.
- source_word: ὑπερηφάνους
  choice: die Hochmütigen
  rationale: Die substantivierte Wiedergabe bezeichnet Menschen, die sich hochmütig überheben, ohne ihr Geschlecht unnötig festzulegen.
- source_word: ἀπωλίαν αἰῶνος
  choice: dem ewigen Verderben
  rationale: Der Genitiv αἰῶνος verleiht dem Verderben wahrscheinlich bleibende beziehungsweise unaufhörliche Dauer. Die wörtlichere, aber mehrdeutige Formulierung wird in der Fußnote offengehalten.
- source_word: ἐν ἀτιμίᾳ
  choice: in Schande
  rationale: „In Schande“ gibt den Zustand entehrender Erniedrigung knapp und idiomatisch wieder.
- source_word: οὐκ ἔγνωσαν
  choice: nicht kannten
  rationale: „Nicht kannten“ bewahrt den breiten Bedeutungsumfang von γινώσκω. Je nach Kontext können auch Nichterkennen oder Nichtanerkennen mitschwingen, was die Fußnote ausweist.
theological_decisions:
- issue: Bedeutungsumfang von ἀπωλίαν αἰῶνος
  choice: ewiges Verderben
  alternative: Verderben des Zeitalters
  rationale: Die dauerhafte Bedeutung ist im Zusammenhang am wahrscheinlichsten; die formal mögliche Genitivwiedergabe wird jedoch nicht ausgeschlossen, sondern in der Fußnote genannt.
- issue: Bedeutungsumfang von οὐκ ἔγνωσαν αὐτόν
  choice: weil sie ihn nicht kannten
  alternative: weil sie ihn nicht erkannten beziehungsweise anerkannten
  rationale: Die Hauptfassung vermeidet es, die Aussage ausschließlich als intellektuelles Nichterkennen oder als willentliche Verweigerung der Anerkennung festzulegen.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Der kleingeschriebene Beginn wahrt den im Ausgangstext erkennbaren Anschlusscharakter des Versfragments. Die antithetische Bewegung zwischen dem Emporheben des Sprechers und dem Zuführen der Hochmütigen zum Verderben bleibt erhalten, soweit es die vorgelegte Lesart κομίζων erlaubt.
