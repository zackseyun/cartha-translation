  yaml_path: translation/deuterocanon/psalms_of_solomon/002/020.yaml
  text: For the nations insulted Jerusalem in her trampling[c][b][a]; they pulled her splendor down from the throne of glory.
translation:
  language: de
  text: Denn die Völker verhöhnten Jerusalem, als es zertreten wurde; sie rissen seine Pracht[a] vom Thron der Herrlichkeit[b] herab.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „seine Schönheit“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „von einem herrlichen Thron“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: συνείδισαν
  choice: verhöhnten
  rationale: Die überlieferte Form wird hier entsprechend der textkritisch naheliegenden Lesart im Sinn von ὠνείδισαν verstanden. „Verhöhnten“ gibt den öffentlichen Spott im Zusammenhang natürlich wieder, ohne das Verb fälschlich von συνοράω („sehen“) abzuleiten.
- source_word: ἐν καταπατήσει
  choice: als es zertreten wurde
  rationale: Die präpositionale Nominalfügung bezeichnet Jerusalems Erniedrigung durch Zertreten. Die temporale deutsche Wiedergabe bewahrt das Bild und vermeidet die unnatürliche Formulierung „in seiner Zertretung“.
- source_word: κατέσπασεν
  choice: sie rissen … herab
  rationale: Der griechische Singular kann bei einem kollektiven beziehungsweise pluralisch gedachten Handlungsträger im Deutschen idiomatisch pluralisch aufgenommen werden. „Herabreißen“ bewahrt die gewaltsame Abwärtsbewegung.
- source_word: τὸ κάλλος αὐτῆς
  choice: seine Pracht
  rationale: κάλλος kann Schönheit bezeichnen, meint hier im Zusammenhang von Jerusalem und seinem Ehrenthron jedoch passend die sichtbare Pracht und Würde.
- source_word: ἀπὸ θρόνου δόξης
  choice: vom Thron der Herrlichkeit
  rationale: Die Genitivfügung bleibt erhalten, da sie im Deutschen verständlich ist und das erhabene Bild des griechischen Textes wahrt.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Jerusalem wird nach üblichem deutschen Sprachgebrauch mit dem sächlichen Pronomen aufgenommen. Die etwas schwierige Textüberlieferung bei συνείδισαν wird im Haupttext sinnvoll als Ausdruck des Verhöhnens wiedergegeben; die frühere Deutung „sahen“ wird wegen der morphologischen und textkritischen Probleme nicht als gleichwertige Übersetzungsalternative geführt.
