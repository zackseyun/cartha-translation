  yaml_path: translation/deuterocanon/psalms_of_solomon/002/034.yaml
  text: He himself is king over the heavens[a], and judges kings and rulers;
translation:
  language: de
  text: Er selbst ist König über die Himmel und richtet dabei Könige und Herrscher[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Fürsten.'
    reason: Lexikalische Alternative für ἀρχάς; im Zusammenhang sind politische Machthaber gemeint.
lexical_decisions:
- source_word: αὐτὸς
  choice: er selbst
  rationale: Die ausdrückliche Wiedergabe bewahrt die Hervorhebung des griechischen Pronomens.
- source_word: βασιλεὺς
  choice: König
  rationale: Das artikellose Substantiv steht prädikativ; „ist König“ gibt den königlichen Herrschaftsanspruch unmittelbar wieder.
- source_word: ἐπὶ τῶν οὐρανῶν
  choice: über die Himmel
  rationale: ἐπί mit Genitiv bezeichnet hier Herrschaft über einen Bereich; der Plural τῶν οὐρανῶν wird bewahrt.
- source_word: κρίνων
  choice: richtet
  rationale: Das Partizip wird für natürliches Deutsch als koordiniertes finites Verb wiedergegeben, ohne den richterlichen Sinn abzuschwächen.
- source_word: ἀρχάς
  choice: Herrscher
  rationale: Neben „Könige“ bezeichnet das Wort am ehesten weitere Träger politischer Herrschaft; „Herrscher“ ist verständlich und vermeidet eine unnötige technische Deutung.
theological_decisions:
- issue: Reichweite der göttlichen Herrschaft in ἐπὶ τῶν οὐρανῶν
  choice: Gottes Königtum erstreckt sich über die Himmel; zugleich richtet er irdische Machthaber.
  alternative: „Himmel“ als deutscher Kollektivsingular
  rationale: Der griechische Plural bleibt sichtbar, ohne eine weitergehende kosmologische Systematik in die Aussage einzutragen.
- issue: Verhältnis von βασιλεὺς und κρίνων
  choice: Das Richten wird als Tätigkeit desselben göttlichen Königs ausgesagt.
  alternative: „wobei er Könige und Herrscher richtet“
  rationale: Die finite Koordination ist im Deutschen natürlich und erhält die enge Verbindung von Königtum und Gericht, ohne das Partizip zeitlich oder kausal festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Die Himmel“ ist bewusst quellenah und etwas feierlicher als der übliche Singular. Der Fußnotenmarker steht bei dem Wort, auf das sich die lexikalische Alternative tatsächlich bezieht.
