revisions:
- from: Sie machten die Söhne Jerusalems zum Gespött, anstelle von Prostituierten[a] in ihrer Mitte; jeder, der vorüberging, ging am helllichten Tag zu ihnen hinein[b]. Sie trieben mit ihren gesetzlosen Taten Spott[c].
  to: Sie machten die Söhne Jerusalems zum Gespött, an die Stelle von Prostituierten in ihr[a]; jeder, der vorüberging, ging am helllichten Tag hinein[b]. Sie verspotteten ihre Gesetzlosigkeiten[c].
  rationale: Die Revision entfernt die unbelegte Zielergänzung „zu ihnen“ und gibt den letzten Satz so wieder, dass der griechische Dativ ohne Einfügung eines unausgedrückten verspotteten Personenkreises abgebildet wird. Die bewusst beibehaltene Formel „an die Stelle von“ samt Fußnote wahrt die mögliche vergleichende Lesart von ἀντί, ohne sie im Haupttext zu erzwingen.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T10:25:00Z'
review_pass:
  verdict: revise
  source_fidelity: Die Hinzufügung „zu ihnen“ hat im griechischen Text keine Grundlage und legt ein Ziel beziehungsweise einen Bezug fest, der nicht ausdrücklich genannt ist. Im letzten Satz ist der Dativ ταῖς ἀνομίαις αὐτῶν am besten als Bezug dessen zu verstehen, was verspottet wird („ihre Gesetzlosigkeiten“), nicht als bloßes Mittel, mit dem ein unausgedrücktes Objekt verspottet würde.
  naturalness: „An die Stelle von Prostituierten in ihr“ bewahrt die formale und kontextuell umstrittene Wendung ἀντὶ πορνῶν ἐν αὐτῇ in idiomatischem, aber zurückhaltendem Deutsch. Die Entfernung von „zu ihnen“ macht den mittleren Satz zugleich natürlicher und quellennäher.
  terminology: „Söhne Jerusalems“, „zum Gespött“, „Prostituierten“, „am helllichten Tag“ und „Gesetzlosigkeiten“ geben Bildsprache, Register und moralisch-religiösen Gehalt des Griechischen angemessen wieder, ohne eine historische Identifikation vorzunehmen.
  issues:
  - severity: medium
    issue: „zu ihnen“ fügt ein nicht ausgedrücktes Ziel hinzu.
    rationale: εἰσεπορεύετο bedeutet „ging/ging hinein“, doch der Text nennt kein „zu ihnen“. Die Ergänzung kann die Söhne Jerusalems oder andere Personen als Ziel festlegen und sollte daher entfallen.
  - severity: medium
    issue: Der letzte Satz gibt die syntaktische Funktion von ταῖς ἀνομίαις αὐτῶν nicht angemessen wieder.
    rationale: „Sie trieben mit ihren gesetzlosen Taten Spott“ lässt die Taten als Mittel des Verspottens erscheinen und setzt dabei ein ungenanntes Objekt voraus. Der Dativ bei ἐμπαίζω kann den Gegenstand des Spotts bezeichnen; „Sie verspotteten ihre Gesetzlosigkeiten“ bewahrt dies ohne zusätzliche Referenzauflösung.
  - severity: low
    issue: Fußnote c beschreibt eine Mehrdeutigkeit, die durch die revidierte Wiedergabe nicht mehr in derselben Form besteht.
    rationale: Wenn „Gesetzlosigkeiten“ als Gegenstand des Spotts übersetzt wird, ist kein unausgedrücktes Objekt „wer hier verspottet wird“ zu erläutern. Allenfalls der Besitzerbezug von αὐτῶν bleibt kontextuell offen.
  revised_text: Sie machten die Söhne Jerusalems zum Gespött, an die Stelle von Prostituierten in ihr[a]; jeder, der vorüberging, ging am helllichten Tag hinein[b]. Sie verspotteten ihre Gesetzlosigkeiten[c].
