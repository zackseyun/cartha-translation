base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/002/013.yaml
  text: They made the sons of Jerusalem a mockery[a], like prostitutes within her; everyone passing by would enter in broad daylight[c][b]; they mocked them with their lawless deeds.
translation:
  language: de
  text: Sie machten die Söhne Jerusalems zum Gespött, an die Stelle von Prostituierten in ihr[a]; jeder, der vorüberging, ging am helllichten Tag hinein[b]. Sie verspotteten ihre Gesetzlosigkeiten[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „an die Stelle von Prostituierten in ihr“; möglich ist auch ein vergleichender Sinn: „wie Prostituierte“.'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlich: „vor der Sonne“, das heißt offen und bei Tageslicht.'
    reason: lexical_alternative
  - marker: c
    text: Der Bezug von „ihre“ ist im griechischen Kontext nicht ausdrücklich näher bestimmt.
    reason: source_ambiguity
lexical_decisions:
- source_word: ἔστησαν … εἰς ἐμπαιγμόν
  choice: machten … zum Gespött
  rationale: Die Konstruktion bezeichnet das Versetzen in einen Zustand beziehungsweise das öffentliche Preisgeben zum Spott. Die deutsche Wendung gibt sowohl das Ergebnis als auch die Demütigung natürlich wieder.
- source_word: τοὺς υἱοὺς Ἱερουσαλήμ
  choice: die Söhne Jerusalems
  rationale: Bewahrt die ausdrücklich männliche Form und das familiäre Bild des griechischen Textes.
- source_word: ἀντὶ πορνῶν
  choice: anstelle von Prostituierten
  rationale: Gibt die Grundbedeutung von ἀντί formal wieder, ohne die mögliche vergleichende Bedeutung im Haupttext festzulegen.
- source_word: πᾶς ὁ πορευόμενος εἰσεπορεύετο
  choice: jeder, der vorüberging, ging … hinein
  rationale: Die Wiederholung der Bewegungsverben und der iterative Charakter werden bewahrt; „zu ihnen“ verdeutlicht lediglich das im Deutschen erforderliche Ziel aus dem Kontext.
- source_word: κατέναντι τοῦ ἡλίου
  choice: am helllichten Tag
  rationale: Die wörtliche Wendung „vor der Sonne“ bezeichnet hier ein offenes Geschehen bei Tageslicht; die gewählte Formulierung ist idiomatisch und bildkräftig.
- source_word: ἐνέπαιζον ταῖς ἀνομίαις αὐτῶν
  choice: Sie trieben mit ihren gesetzlosen Taten Spott
  rationale: Bewahrt den Spott-Sinn von ἐμπαίζω und die instrumentale beziehungsweise begleitende Dativform, ohne ein im Griechischen nicht ausdrücklich genanntes Objekt fest einzusetzen.
theological_decisions:
- issue: Bezug und Funktion von αὐτῶν im letzten Satz
  choice: „ihren“ bleibt ohne ausdrückliche Auflösung
  alternative: „sie verhöhnten sie durch ihre gesetzlosen Taten“
  rationale: Der griechische Text nennt weder ein ausdrückliches Objekt zu ἐνέπαιζον noch löst er den Bezug des Pronomens zweifelsfrei auf. Die Übersetzung vermeidet daher eine theologisch oder historisch voreilige Identifikation.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die drastische öffentliche Demütigung bleibt erkennbar, während syntaktische und referenzielle Mehrdeutigkeiten des Griechischen durch Fußnoten offengelegt statt im Haupttext stillschweigend aufgelöst werden.
