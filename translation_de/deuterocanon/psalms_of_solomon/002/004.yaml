base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/002/004.yaml
  text: Because of these things he said[a], “Cast them far away from me[c][b]; the beauty of his glory did not prosper them.”
translation:
  language: de
  text: 'Darum sagte er: »Werft sie weit weg von mir!« Die Schönheit seiner[a] Herrlichkeit brachte ihnen keinen Nutzen.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Pronomen kann je nach Bezugswort auch im Sinn von »dessen« verstanden werden. Eine Handschriftenvariante liest »ihrer« statt »seiner«.
    reason: textual_variant
  - marker: b
    text: 'Da der griechische Text keine Anführungszeichen setzt, kann der letzte Satz auch noch als Teil der direkten Rede gelesen werden: »Werft sie weit weg von mir; die Schönheit seiner Herrlichkeit brachte ihnen keinen Nutzen.«'
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: ἕνεκεν τούτων
  choice: Darum
  rationale: Die Wendung verweist ausdrücklich auf das zuvor Geschilderte zurück. »Darum« gibt diesen kausalen Rückbezug natürlich und knapp wieder.
- source_word: εἶπεν
  choice: sagte er
  rationale: Das gewöhnliche Verb des Sprechens wird ohne zusätzliche Bestimmung des Sprechers wiedergegeben.
- source_word: Ἀπορρίψατε αὐτὰ μακρὰν ἀπ’ ἐμοῦ
  choice: Werft sie weit weg von mir!
  rationale: »Werft« bewahrt die anschauliche Kraft von ἀπορρίπτω, während »weit weg von mir« sowohl μακράν als auch ἀπ’ ἐμοῦ wiedergibt.
- source_word: οὐκ εὐώδωκεν αὐτοῖς
  choice: brachte ihnen keinen Nutzen
  rationale: εὐοδόω kann hier bedeuten, jemandem Erfolg oder Vorteil zu verschaffen. Die Formulierung ist gegenwärtiges, klares Deutsch und vermeidet das missverständliche »ließ sie nicht gedeihen«.
- source_word: τὸ κάλλος τῆς δόξης αὐτοῦ
  choice: die Schönheit seiner Herrlichkeit
  rationale: Die Wiedergabe erhält sowohl κάλλος (»Schönheit«) als auch den theologischen und ästhetischen Gehalt von δόξα (»Herrlichkeit«). »Seiner« lässt den möglichen Bezug des griechischen αὐτοῦ auf eine männliche oder sächliche Bezugsgröße offen.
theological_decisions:
- issue: Grenze der direkten Rede
  choice: Die direkte Rede endet nach »mir«; der folgende Satz wird als Erzählerwort verstanden.
  alternative: Auch »Die Schönheit seiner Herrlichkeit brachte ihnen keinen Nutzen« kann noch zur direkten Rede gehören.
  rationale: Der Wechsel von der ersten Person »mir« zum Pronomen der dritten Person legt einen Abschluss der Rede nahe. Da die griechische Handschrift keine modernen Anführungszeichen setzt, wird die andere syntaktische Möglichkeit in einer Fußnote bewahrt.
- issue: Bezug von αὐτοῦ
  choice: »seiner«
  alternative: »dessen« beziehungsweise gemäß einer Variante »ihrer«
  rationale: Die Grundtextlesart αὐτοῦ ist ein Genitiv Singular und kann sich auf eine männliche oder sächliche Bezugsgröße beziehen. Die Übersetzung legt den sachlichen Bezug nicht durch einen erläuternden Zusatz fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der kräftige Imperativ bleibt erhalten; die abstrakte Verbindung »Schönheit seiner Herrlichkeit« folgt bewusst eng dem Griechischen, ohne sie theologisch zu glätten.
