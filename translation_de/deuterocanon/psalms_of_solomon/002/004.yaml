  verdict: approve
  source_fidelity: Die Übersetzung gibt die kausale Einleitung, den schroffen Imperativ mit der Distanzangabe sowie die Aussage über den fehlenden Nutzen der »Schönheit ... Herrlichkeit« sachgerecht wieder. »Darum« ist als knapper Rückverweis auf ἕνεκεν τούτων vertretbar. Die Abgrenzung der direkten Rede nach »mir« ist eine plausible editorische Entscheidung; die Fußnote bewahrt die mögliche alternative Satzgrenze.
  naturalness: Modernes, würdiges und gut verständliches Standarddeutsch. »Werft sie weit weg von mir!« ist idiomatisch und bewahrt den nachdrücklichen Charakter des Imperativs. Die bewusst nahe Formulierung »die Schönheit seiner Herrlichkeit« ist zwar gehoben, aber im poetisch-religiösen Register natürlich genug.
  terminology: »Herrlichkeit« gibt δόξα angemessen wieder, und »Schönheit« erhält κάλλος. »Seiner« kann im Deutschen sowohl einen männlichen als auch einen sächlichen Bezug ausdrücken und legt den umstrittenen bzw. kontextabhängigen Bezug von αὐτοῦ nicht unnötig fest. Die Variantenfußnote ist sachlich und angemessen vorsichtig formuliert.
