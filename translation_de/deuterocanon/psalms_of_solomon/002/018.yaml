  text: You exposed their sins so that your judgment might be seen.
translation:
  language: de
  text: Du hast ihre Sünden aufgedeckt, damit dein Urteil sichtbar wird.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνέκαλυψας
  choice: hast … aufgedeckt
  rationale: Gibt das bildhafte Offenlegen oder Enthüllen verborgener Sünden natürlich und präzise wieder.
- source_word: τὰς ἁμαρτίας αὐτῶν
  choice: ihre Sünden
  rationale: Direkte und idiomatische Entsprechung des griechischen Ausdrucks.
- source_word: τὸ κρίμα σου
  choice: dein Urteil
  rationale: κρίμα bezeichnet hier im Zusammenhang das göttliche Urteil; „Urteil“ wahrt den gerichtlichen Sinn, ohne zusätzliche Deutung einzutragen.
- source_word: φανῇ
  choice: sichtbar würde
  rationale: Entspricht dem passivischen Sinn „erscheinen/sichtbar werden“ und bewahrt die durch ἵνα ausgedrückte Ziel- oder Folgebeziehung.
theological_decisions:
- issue: Bedeutung von κρίμα
  choice: dein Urteil
  alternative: dein Gericht
  rationale: „Urteil“ bezeichnet die konkrete göttliche Entscheidung; „Gericht“ könnte sowohl den Vorgang als auch das Strafgeschehen meinen. Die Übersetzung legt nicht fest, auf welche Weise das Urteil sichtbar wird.
- issue: Beziehung des ἵνα-Satzes
  choice: damit dein Urteil sichtbar würde
  alternative: sodass dein Urteil sichtbar wurde
  rationale: „Damit“ wahrt die gewöhnliche finale Lesart von ἵνα, ohne die mögliche Ergebnisnuance völlig auszuschließen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Parallelität und die direkte Anrede Gottes bleiben erhalten; keine erläuternden Zusätze.
