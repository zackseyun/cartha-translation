lexical_decisions:
- source_word: ἐκχέαι
  choice: auszugießen
  rationale: Bewahrt das griechische Bild des Ausgießens und den infinitivischen Anschluss an den vorausgehenden Zusammenhang.
- source_word: τὴν ὀργὴν αὐτῶν
  choice: ihren Zorn
  rationale: „Zorn“ gibt die starke, gegen andere gerichtete Bedeutung von ὀργή in diesem Gerichtszusammenhang angemessen wieder.
- source_word: ἐν ἁρπάγματι
  choice: indem sie uns ausplündern
  rationale: Die kompakte und schwierige Präpositionalphrase wird als Begleitumstand des Zornausgießens verstanden. „Ausplündern“ macht den gewaltsamen Vorgang im Deutschen natürlich verständlich, ohne die Unsicherheit der Konstruktion zu verschweigen.
- source_word: μὴ χρονίσῃς
  choice: zögere nicht
  rationale: Natürliches modernes Deutsch für die Bitte, Gottes vergeltendes Handeln nicht aufzuschieben.
- source_word: τοῦ ἀποδοῦναι αὐτοῖς εἰς κεφαλάς
  choice: es ihnen auf ihr eigenes Haupt zu vergelten
  rationale: Bewahrt das Vergeltungsmotiv und die bildhafte Wendung mit „Haupt“; „eigenes“ verdeutlicht idiomatisch, dass die Folgen auf die Täter selbst zurückfallen.
theological_decisions:
- issue: Vergeltungsbild
  choice: Die Bitte richtet sich an Gott, den Tätern ihr Handeln auf ihr eigenes Haupt zu vergelten.
  alternative: Die Formulierung könnte mechanischer als „es ihnen auf Häupter zurückzugeben“ wiedergegeben werden.
  rationale: Die griechische Wendung bezeichnet zurückkehrende Vergeltung. Die idiomatische deutsche Fassung macht diesen Sinn deutlich, ohne die Härte der Bitte abzuschwächen.
- issue: Bezug des unausgesprochenen Objekts bei ἀποδοῦναι
  choice: Das neutrale Pronomen „es“ verweist allgemein auf ihr gewaltsames Handeln beziehungsweise die entsprechende Vergeltung.
  alternative: 'Das Objekt könnte im Deutschen ausgelassen werden: „ihnen auf ihr eigenes Haupt zu vergelten“.'
  rationale: „Es“ ergibt einen vollständigen, natürlichen deutschen Satz, legt aber nicht genauer fest, was der griechische Text unausgesprochen lässt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz bleibt wegen seines Anschlusses an den vorausgehenden Vers zunächst infinitivisch. Das drastische Bild des ausgegossenen Zorns und die Vergeltungsformel werden bewahrt; die schwierige Wendung ἐν ἁρπάγματι wird im Haupttext verständlich wiedergegeben und in der Fußnote als mehrdeutig kenntlich gemacht.
