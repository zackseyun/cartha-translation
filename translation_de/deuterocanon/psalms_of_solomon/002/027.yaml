review_pass:
  verdict: approve
  source_fidelity: 'Die Übersetzung gibt den knappen griechischen Gegensatz genau wieder: ἐποίησαν ist mit „handelten“ idiomatisch und ohne Ergänzung eines nicht genannten Handlungsobjekts übertragen; ζήλῳ mit „Eifer“ bewahrt den naheliegenden, nicht unnötig negativ festgelegten Sinn; und ἐν ἐπιθυμίᾳ ψυχῆς wird angemessen als „aus dem Verlangen ihrer Seele“ wiedergegeben. Die Wiedergabe erhält ψυχῆς („Seele“) und glättet es nicht zu bloß „eigenem Verlangen“.'
  naturalness: „Denn sie handelten nicht aus Eifer, sondern aus dem Verlangen ihrer Seele“ ist natürliches, modernes Standarddeutsch mit angemessen würdigem psalmischem Register. Der bewusst leicht gehobene Ausdruck „Verlangen ihrer Seele“ ist verständlich und dem Textton angemessen.
  terminology: „Eifer“, „Verlangen“ und „Seele“ sind terminologisch tragfähig. Sie legen weder ζῆλος auf „Eifersucht“ noch ἐπιθυμία auf einen spezifisch sexuellen Sinn fest und vermeiden eine dogmatische Ausdeutung von ψυχή.
