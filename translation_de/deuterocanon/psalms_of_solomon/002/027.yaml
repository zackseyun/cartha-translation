base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/002/027.yaml
  text: For they did not act out of zeal[a], but out of the desire of their soul[b],
translation:
  language: de
  text: Denn sie handelten nicht aus Eifer, sondern aus dem Verlangen ihrer Seele[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: „aus Verlangen der Seele“; sinngemäß: „aus ihrem eigenen Verlangen“.'
    reason: Das Griechische hat kein ausdrückliches Possessivpronomen und lässt die idiomatische Beziehung zwischen „Verlangen“ und „Seele“ offen.
lexical_decisions:
- source_word: ἐποίησαν
  choice: handelten
  rationale: Das allgemein gebrauchte ποιέω bedeutet wörtlich „tun/machen“. Mit den folgenden Motivangaben ist „handeln“ im Deutschen natürlich und lässt den im Vers nicht genannten Gegenstand der Handlung offen.
- source_word: ζήλῳ
  choice: Eifer
  rationale: ζῆλος kann Eifer, leidenschaftlichen Einsatz oder Eifersucht bezeichnen. Im Gegensatz zu einem selbstbezogenen Verlangen gibt „Eifer“ den hier naheliegenden moralisch-religiösen Sinn wieder, ohne ihn unnötig negativ festzulegen.
- source_word: ἐπιθυμίᾳ
  choice: Verlangen
  rationale: ἐπιθυμία bezeichnet ein starkes Begehren oder Verlangen. „Verlangen“ bewahrt die im Zusammenhang problematische Triebkraft, ohne den Ausdruck durch „Begierde“ vorschnell sexuell oder durch „Wunsch“ zu schwach zu bestimmen.
- source_word: ψυχῆς
  choice: ihrer Seele
  rationale: ψυχή kann Seele, Leben oder Selbst bedeuten. Die relativ formale Wiedergabe „ihrer Seele“ erhält das gewichtige, möglicherweise semitisch geprägte Seelenidiom und den psalmischen Ton; das im Griechischen nicht ausdrücklich vorhandene Possessivpronomen wird aus dem pluralischen Subjekt ergänzt.
theological_decisions:
- issue: Bewertung des ζῆλος
  choice: Eifer
  alternative: Eifersucht
  rationale: Der Text verneint ζῆλος als Beweggrund, erklärt aber nicht ausdrücklich, ob damit an sich guter Eifer oder Eifersucht gemeint ist. „Eifer“ wahrt die Spannung zwischen einem womöglich vorgeschobenen höheren Motiv und dem tatsächlichen Verlangen.
- issue: Anthropologische Bedeutung von ψυχή
  choice: Seele
  alternative: eigenes Selbst
  rationale: Die Wiedergabe als „Seele“ wahrt die Bild- und Bedeutungsebene des griechischen Ausdrucks, ohne daraus eine bestimmte Lehre über die Bestandteile des Menschen abzuleiten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit psalmischem Klang. Die Satzstruktur folgt dem knappen Gegensatz des Griechischen. „Verlangen ihrer Seele“ ist bewusst gehobener als Alltagssprache, bleibt aber verständlich und bewahrt die Ausdruckskraft von ψυχῆς.
