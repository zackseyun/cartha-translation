base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/002/037.yaml
  text: Bless God[a], you who fear the Lord with understanding, because the mercy of the Lord is upon those who fear him[b], with judgment.
translation:
  language: de
  text: Preist Gott, die ihr den Herrn mit Einsicht[a] fürchtet; denn die Barmherzigkeit des Herrn ruht auf denen, die ihn fürchten – mit Gericht.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „mit Erkenntnis“ oder „mit Unterscheidungsvermögen“.
    reason: lexical_alternative
  - marker: b
    text: Oder „mit Gerechtigkeit“; der griechische Text lässt das Verhältnis zwischen Barmherzigkeit und Gericht in knapper Form offen.
    reason: alternative_reading
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: Preist
  rationale: Der Pluralimperativ fordert unmittelbar zu einer doxologischen Antwort auf. „Preist“ ist im heutigen Deutschen bei einer an Gott gerichteten Aufforderung natürlicher als „Segnet“, ohne den Sinn auf bloßes Reden zu verengen.
- source_word: οἱ φοβούμενοι
  choice: die ihr … fürchtet
  rationale: Das Partizip ist als Anrede zum Imperativ zu verstehen. Die direkte Anrede gibt diese Funktion klar und idiomatisch wieder.
- source_word: κύριον / Κυρίου
  choice: Herrn / Herrn
  rationale: „Herr“ entspricht dem üblichen biblischen Titelgebrauch von κύριος und passt an beiden Stellen zum Kontext.
- source_word: ἐν ἐπιστήμῃ
  choice: mit Einsicht
  rationale: Die Wendung bezeichnet eine wissende, verständige Gottesfurcht. „Mit Einsicht“ ist natürliches Deutsch und bewahrt die mögliche Nuance von Erkenntnis beziehungsweise Unterscheidungsvermögen.
- source_word: ἔλεος
  choice: Barmherzigkeit
  rationale: „Barmherzigkeit“ ist die etablierte und kontextgerechte Wiedergabe von ἔλεος und wahrt den feierlich-biblischen Ton.
- source_word: μετὰ κρίματος
  choice: mit Gericht
  rationale: Die knappe griechische Formulierung wird bewusst nicht aufgelöst. „Gericht“ bewahrt sowohl die forensische Bedeutung als auch die Spannung zur Barmherzigkeit.
theological_decisions:
- issue: Verhältnis von Barmherzigkeit und Gericht in μετὰ κρίματος
  choice: Die Barmherzigkeit des Herrn gilt den Gottesfürchtigen „mit Gericht“.
  alternative: „mit Gerechtigkeit“ oder „verbunden mit Gericht“
  rationale: Der griechische Text lässt offen, ob κρίμα das Gericht, die Gerechtigkeit oder eine richterliche Zumessung betont und wie genau die Präpositionalphrase syntaktisch anzuschließen ist. Die gedrängte Formulierung erhält diese theologische Spannung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit direkter Anrede. Der Semikolonanschluss verdeutlicht den Begründungssatz; der Gedankenstrich vor „mit Gericht“ macht die bewusst gedrängte Schlusswendung lesbar, ohne sie inhaltlich aufzulösen.
