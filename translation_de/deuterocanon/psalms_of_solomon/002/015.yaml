base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/002/015.yaml
  text: Because they themselves defiled what was pure in the filth of illicit mingling[c][b][a]. My belly and my inward parts ache over these things.
translation:
  language: de
  text: Denn sie selbst[c] haben das Reine[a] im Schmutz[d] der Vermischung[b] entweiht. Mein Bauch und mein Innerstes schmerzen darüber.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Heilige“.'
    reason: lexical_alternative
  - marker: b
    text: Wörtlich „Vermischung“; der Ausdruck hat hier wahrscheinlich einen moralisch anstößigen oder sexuellen Sinn.
    reason: cultural_note
  - marker: c
    text: 'Das griechische Pronomen ist betont und feminin: „sie selbst“, möglicherweise mit Bezug auf zuvor genannte Frauen.'
    reason: grammatical_note
  - marker: d
    text: Die vorgelegte Form ῥύμῳ dürfte ein Übertragungsfehler für ῥύπῳ („Schmutz“) sein. Eine ältere Wiedergabe als „auf einer Straße“ beruht auf ῥύμη („Straße“), dessen regulärer Dativ jedoch ῥύμῃ lautet.
    reason: textual_note
lexical_decisions:
- source_word: ἀνθ’ ὧν
  choice: Weil
  rationale: Leitet den Grund der Klage ein und gibt den kausalen Zusammenhang im Deutschen knapp und natürlich wieder.
- source_word: αὐταὶ
  choice: sie selbst
  rationale: Bewahrt die emphatische Kraft des Pronomens, ohne ein im Vers nicht ausdrücklich genanntes Bezugswort einzufügen; das feminine Genus wird in einer Fußnote kenntlich gemacht.
- source_word: ἐμίαυσαν (wohl fehlerhaft für ἐμίαναν)
  choice: entweiht haben
  rationale: Gibt die moralisch-rituelle Verunreinigung in würdigem, verständlichem Deutsch wieder. Die bezeugte Form wirkt wie ein Übertragungs- oder Druckfehler; der Zusammenhang verlangt das Verb für beflecken bzw. verunreinigen.
- source_word: ἁγνὰ
  choice: das Reine
  rationale: Bewahrt den substantivierten neutralen Plural idiomatisch, ohne festzulegen, ob Dinge, Menschen oder heilige Güter gemeint sind.
- source_word: ἐν ῥύμῳ (wohl ἐν ῥύπῳ)
  choice: im Schmutz
  rationale: Die grammatisch und kontextuell naheliegende Lesart ῥύπῳ bedeutet Schmutz; ῥύμῳ passt weder als regulärer Dativ von ῥύμη noch zum unmittelbaren Verunreinigungskontext.
- source_word: ἀναμίξεως
  choice: der Vermischung
  rationale: Erhält das konkrete griechische Bild des Mischens und lässt zugleich dessen hier wahrscheinlich moralisch oder sexuell belastete Bedeutung offen.
- source_word: τὴν κοιλίαν μου
  choice: Mein Bauch
  rationale: Bewahrt das körperliche Bild des griechischen Ausdrucks und damit die Eindringlichkeit der Klage.
- source_word: τὰ σπλάγχνα μου
  choice: mein Innerstes
  rationale: Ist im modernen Deutsch natürlicher als „Eingeweide“, lässt aber die Vorstellung der inneren Organe und des tiefsten Empfindens anklingen.
- source_word: πονῶ ἐπὶ τούτοις
  choice: schmerzen darüber
  rationale: Gibt den gegenwärtigen, körperlich empfundenen Schmerz und seinen Bezug auf das zuvor Genannte knapp wieder.
theological_decisions:
- issue: Bezug von ἁγνά
  choice: das Reine
  alternative: das Heilige
  rationale: Der Ausdruck kann Reinheit oder Heiligkeit bezeichnen. Der Haupttext vermeidet eine kultische Festlegung; die mögliche religiöse Nuance bleibt in der Fußnote sichtbar.
- issue: Sinn von ἀνάμιξις
  choice: Vermischung
  alternative: unerlaubter Geschlechtsverkehr
  rationale: Der Kontext legt eine moralisch und möglicherweise sexuell belastete Vermischung nahe, doch der Vers benennt die genaue Art nicht ausdrücklich. Die Übersetzung bewahrt diese Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die körperliche Bildsprache der Klage bleibt erhalten; ungesicherte kultische oder sexuelle Präzisierungen werden nicht in den Haupttext eingetragen.
