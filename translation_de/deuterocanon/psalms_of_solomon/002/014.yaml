lexical_decisions:
- source_word: καθὰ ἐποίουν αὐτοί
  choice: Wie sie selbst handelten
  rationale: Die vergleichende Wendung und das ausdrücklich gesetzte αὐτοί bleiben erhalten. Das Imperfekt wird als fortdauerndes beziehungsweise wiederholtes Handeln verstanden, ohne einen im Griechischen nicht genannten Gegenstand zu ergänzen.
- source_word: παρεδειγμάτισαν
  choice: stellten … öffentlich zur Schau
  rationale: Das Verb bezeichnet ein öffentliches Bloßstellen oder Zurschaustellen; die Wiedergabe macht diesen Aspekt in natürlichem Deutsch deutlich.
- source_word: ἀδικίας
  choice: Freveltaten
  rationale: Der Plural bezeichnet konkrete schuldhafte Handlungen. „Freveltaten“ wahrt das moralisch-religiöse Gewicht, ohne den Ausdruck auf soziale Ungerechtigkeit zu verengen.
- source_word: ἀπέναντι τοῦ ἡλίου
  choice: vor der Sonne
  rationale: Die auffällige Bildsprache des griechischen Textes wird bewahrt; die Fußnote erläutert ihren Sinn als öffentliches Handeln am hellen Tag.
- source_word: βέβηλοι
  choice: entweiht
  rationale: Das Wort bezeichnet das Profane beziehungsweise seiner Heiligkeit Beraubte. „Entweiht“ bringt den Gegensatz zur Heiligkeit verständlich zum Ausdruck, ohne kultische Einzelheiten hinzuzufügen.
- source_word: κατὰ τὸ κρίμα σου
  choice: deinem Urteil gemäß
  rationale: Die Formulierung erhält den ausdrücklichen Bezug auf Gottes richterliches Urteil und lässt offen, ob stärker das Urteil selbst oder dessen Vollzug gemeint ist.
theological_decisions:
- issue: Verhältnis der Entweihung der Töchter Jerusalems zu Gottes κρίμα
  choice: waren deinem Urteil gemäß entweiht
  alternative: wurden durch dein Urteil entweiht
  rationale: Das Griechische enthält in der Schlussklausel kein ausdrückliches Verb und bezeichnet mit κατά eher eine Entsprechung zum Urteil als eindeutig dessen unmittelbare Verursachung. Die Übersetzung vermeidet daher eine stärkere kausale Festlegung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die ungewöhnliche Wendung „vor der Sonne“ bewahrt bewusst das griechische Bild und wird in der Fußnote erklärt; das Semikolon gliedert die beiden Aussagen, ohne ihren Zusammenhang aufzulösen.
