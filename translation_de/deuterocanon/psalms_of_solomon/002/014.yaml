  text: Just as they themselves used to do[a], they displayed their iniquities before the sun, and the daughters of Jerusalem were profane according to your judgment[d][c][b],
translation:
  language: de
  text: Wie sie es selbst zu tun pflegten,[c] stellten sie ihre Freveltaten vor der Sonne[a] öffentlich zur Schau; und die Töchter Jerusalems waren deinem Urteil gemäß entweiht.[b]
