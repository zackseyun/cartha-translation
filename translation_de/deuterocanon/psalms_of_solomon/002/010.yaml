  text: And heaven was weighed down[a], and the earth abhorred them[b],
translation:
  language: de
  text: Und der Himmel wurde schwer[a], und die Erde verabscheute sie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die überlieferte Form ἐβαρύνθησενσεν enthält offenbar eine verdoppelte Endung; übersetzt wird die erkennbare zugrunde liegende Form ἐβαρύνθησεν.
    reason: textual_variant
lexical_decisions:
- source_word: οὐρανός
  choice: Himmel
  rationale: In der Verbindung mit γῆ bildet das Wort das kosmische Begriffspaar »Himmel und Erde«. »Himmel« bewahrt diese Bildsprache besser als »Firmament« oder eine rein meteorologische Wiedergabe.
- source_word: ἐβαρύνθησεν
  choice: wurde schwer
  rationale: Die Wiedergabe folgt der Grundbedeutung von βαρύνω und lässt offen, ob vor allem Belastung, Bedrückung oder kosmische Schwere gemeint ist.
- source_word: γῆ
  choice: Erde
  rationale: Das Gegenüber zu »Himmel« legt hier die umfassende Bedeutung »Erde« nahe, nicht das örtlich begrenzte »Land«.
- source_word: ἐβδελύξατο
  choice: verabscheute
  rationale: Das Verb bezeichnet starke Abscheu beziehungsweise Ekel; »verabscheute« ist im heutigen Deutsch verständlich und dem würdevollen poetischen Ton angemessen.
- source_word: αὐτούς
  choice: sie
  rationale: Das Akkusativpronomen verweist auf die im Zusammenhang genannten Menschen, die dem Gericht verfallen.
theological_decisions:
- issue: Kosmische Reaktion von Himmel und Erde
  choice: Die personifizierende Aussage wird unmittelbar beibehalten.
  alternative: Die Wendung als bloße Wetter- oder Naturbeschreibung zu deuten.
  rationale: Die Parallelität von Himmel und Erde stellt beide als auf das verurteilte Verhalten reagierende Teile der Schöpfung dar. Eine rein meteorologische Auslegung würde diese moralisch-kosmische Spannung verengen.
translation_notes:
  register: Modernes, gehobenes Standarddeutsch mit knapper poetischer Parallelstruktur. »Wurde schwer« bewahrt das ungewöhnliche Bild und vermeidet eine vorschnelle Deutung als Verdunkelung, Unwetter oder ausdrückliches Niedergedrücktwerden.
