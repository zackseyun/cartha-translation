  source_fidelity: 'Die Übersetzung gibt die sinntragenden Elemente des griechischen Textes präzise wieder: οὐρανός/γῆ als kosmisches Paar »Himmel und Erde«, das passive ἐβαρύνθησεν als Zustandsveränderung zu Schwere sowie ἐβδελύξατο als starke Abscheu. Die Personifikation und die knappe Parallelstruktur bleiben erhalten. Die offenkundig verderbte doppelte Endung der Überlieferung wird zutreffend und transparent in der Anmerkung behandelt.'
