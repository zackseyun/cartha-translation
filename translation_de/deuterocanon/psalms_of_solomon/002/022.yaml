lexical_decisions:
- source_word: περιείλατο
  choice: nahm … ab
  rationale: Der Aorist Medium bezeichnet hier am natürlichsten, dass die als Frau dargestellte Stadt ihren eigenen Kopfschmuck abnahm. Die Formulierung vermeidet eine stärkere Vorstellung gewaltsamen Entreißens.
- source_word: μίτραν
  choice: Kopfschmuck
  rationale: Der allgemeine Ausdruck passt zur weiblichen Personifikation Jerusalems und bewahrt die konkrete Vorstellung einer ehrenvollen Kopfbedeckung, ohne sie vorschnell als Diadem oder Turban festzulegen.
- source_word: δόξης
  choice: der Herrlichkeit
  rationale: Die Genitivverbindung wird formal bewahrt und erhält den gehobenen Ausdruck sowie die mögliche Bedeutungsbreite von Ehre, Glanz und Herrlichkeit.
- source_word: περιέθηκεν αὐτῇ
  choice: ihr aufgesetzt hatte
  rationale: Die Wendung gibt das Anlegen beziehungsweise Aufsetzen eines Kopfschmucks idiomatisch wieder; das Plusquamperfekt macht deutlich, dass Gottes Gabe dem Abnehmen vorausging.
- source_word: ὁ θεός
  choice: Gott
  rationale: Dies ist die unmittelbare und im Deutschen übliche Wiedergabe.
