base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/002/033.yaml
  text: He said[a], "I will be lord of land and sea," and he did not know that God is great[b], mighty in his great strength.
translation:
  language: de
  text: 'Er sagte: „Ich werde Herr über Land und Meer sein.“[a] Doch er wusste nicht, dass Gott groß ist, mächtig in seiner großen Kraft.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Herr über Erde und Meer“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „mächtig durch seine große Macht“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριος
  choice: Herr
  rationale: Das Wort bezeichnet hier den Herrschaftsanspruch eines Menschen, nicht einen göttlichen Titel. „Herr“ bewahrt diesen Anspruch auf umfassende Herrschaft; die Großschreibung ist im Deutschen als Substantiv grammatisch erforderlich.
- source_word: γῆς
  choice: Land
  rationale: In der festen Gegenüberstellung mit dem Meer bezeichnet „Land“ den trockenen beziehungsweise beherrschbaren Bereich natürlicher als „Erde“.
- source_word: οὐκ ἔγνω
  choice: wusste nicht
  rationale: Diese direkte Wiedergabe bewahrt die schlichte Aussage des Aorists und die Ironie zwischen menschlichem Anspruch und fehlender Gotteserkenntnis, ohne sie durch „begriff nicht“ oder „erkannte nicht“ auszudeuten.
- source_word: κραταιὸς
  choice: mächtig
  rationale: „Mächtig“ entspricht dem gehobenen Ton und lässt sich eng mit der folgenden Aussage über Gottes Kraft verbinden.
- source_word: ἐν ἰσχύϊ αὐτοῦ τῇ μεγάλῃ
  choice: in seiner großen Kraft
  rationale: Die Formulierung folgt der griechischen Wendung eng, bewahrt den Bezug auf Gottes eigene Kraft und erhält die wiederholte Steigerung durch „groß“.
theological_decisions:
- issue: Ob ὁ θεὸς als titelartige Bekenntnisformel oder als einfache Aussage über Gott wiederzugeben ist
  choice: dass Gott groß ist, mächtig in seiner großen Kraft
  alternative: dass Gott der Große und Mächtige ist
  rationale: Der griechische Satz stellt Gottes Größe und Macht am natürlichsten als schlichte Aussage dem vermessenen Anspruch des Sprechers gegenüber. Eine substantivierte Titelform würde eine im Ausgangstext nicht zwingend angelegte Akzentuierung einführen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der menschliche Herrschaftsanspruch bleibt knapp und hochmütig; der Kontrast zu Gottes tatsächlicher Größe und Macht wird nicht zusätzlich erklärt. Die leicht markierte Wendung „mächtig in seiner großen Kraft“ bewahrt bewusst die Struktur und Intensivierung des griechischen Textes.
