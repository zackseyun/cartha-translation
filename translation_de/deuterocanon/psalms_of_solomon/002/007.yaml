revisions:
- from: Er verfuhr mit ihnen nach ihren Sünden; denn[a] er überließ sie den Händen derer, die sie überwältigten.[b]
  to: Er verfuhr mit ihnen nach ihren Sünden; denn[a] er überließ sie in die Hände derer, die sie überwältigten.[b]
  rationale: Die einzige erforderliche Änderung ergänzt „in“ vor „die Hände“. Damit wird sowohl die Richtung von εἰς als auch die im Deutschen übliche Formel für das Ausgeliefertwerden an fremde Macht wiedergegeben. Satzbau, Register, Fußnotenanker und die bewusst offene Nuance von ὅτι bleiben erhalten.
