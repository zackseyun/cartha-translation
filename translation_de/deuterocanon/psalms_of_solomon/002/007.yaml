  timestamp: '2026-07-17T10:24:53Z'
review_pass:
  verdict: revise
  source_fidelity: Die Wiedergabe trifft die gerichtliche Entsprechung von κατὰ τὰς ἁμαρτίας αὐτῶν, den erläuternd-begründenden Anschluss mit ὅτι und die Aussage der Preisgabe an überlegene Gegner insgesamt gut. Bei εἰς χεῖρας sollte jedoch die Richtungsformel „in die Hände“ stehen; „den Händen“ verwischt die im Griechischen markierte Auslieferung in die Gewalt anderer.
  naturalness: „Er verfuhr mit ihnen nach ihren Sünden“ ist würdig und verständlich. „Sie den Händen derer überlassen“ ist im heutigen Standarddeutsch weniger idiomatisch als „sie in die Hände derer überlassen“ und klingt zudem semantisch unpräziser.
  terminology: „Sünden“, „verfuhr mit“, „überließ“ und „überwältigten“ sind sachgemäß. „Denn“ bewahrt die mögliche erläuternde beziehungsweise begründende Nuance von ὅτι, ohne eine dogmatisch engere Kausalbeziehung festzulegen. Die Alternativen zu κατισχυόντων sind sinnvoll angegeben.
