base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/002/007.yaml
  text: He dealt with them according to their sins[b][a], because he abandoned them into the hands of those who prevailed over them.
translation:
  language: de
  text: Er verfuhr mit ihnen nach ihren Sünden; denn[a] er überließ sie in die Hände derer, die sie überwältigten.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „weil“.'
    reason: ὅτι kann sowohl begründend-erläuternd als auch ausdrücklich kausal verstanden werden.
  - marker: b
    text: 'Oder: „die über sie die Oberhand gewannen“; auch möglich: „die stärker waren als sie“.'
    reason: κατισχυόντων kann das tatsächliche Überwältigen, das Gewinnen der Oberhand oder die erwiesene Überlegenheit bezeichnen.
lexical_decisions:
- source_word: κατὰ τὰς ἁμαρτίας αὐτῶν
  choice: nach ihren Sünden
  rationale: κατά bezeichnet hier die Entsprechung beziehungsweise den Maßstab des Handelns. „Nach ihren Sünden“ bewahrt den knappen gerichtlichen Sinn und klingt im Deutschen natürlich.
- source_word: ἐποίησεν αὐτοῖς
  choice: er verfuhr mit ihnen
  rationale: Wörtlich steht „er tat ihnen“. „Er verfuhr mit ihnen“ gibt die auf sie gerichtete Handlung idiomatisch wieder, ohne eine ausdrücklichere Vergeltungsterminologie in den Text einzutragen.
- source_word: ὅτι
  choice: denn
  rationale: ὅτι kann kausal oder erläuternd-begründend gebraucht sein. „Denn“ lässt die Preisgabe als Erklärung beziehungsweise konkrete Ausführung des zuvor genannten Handelns erscheinen und vermeidet den missverständlichen Eindruck, die Preisgabe sei dessen vorausgehende Ursache.
- source_word: ἐγκατέλειπεν
  choice: er überließ sie
  rationale: Das Verb bezeichnet das Verlassen oder Preisgeben. Mit dem folgenden Bild der Hände gibt „überließ“ die Auslieferung an fremde Gewalt in natürlichem Deutsch wieder.
- source_word: εἰς χεῖρας
  choice: den Händen
  rationale: Die biblische Metapher der „Hände“ als Machtbereich bleibt erhalten; mit „überließ“ verlangt idiomatisches Deutsch hier den Dativ.
- source_word: κατισχυόντων
  choice: derer, die sie überwältigten
  rationale: Das substantivierte Präsenspartizip bezeichnet diejenigen, die die Oberhand gewinnen beziehungsweise sich als überlegen erweisen. Die aktive Wiedergabe „überwältigten“ passt zum geschichtlichen Vorgang der Unterwerfung.
theological_decisions:
- issue: Logische Beziehung des ὅτι-Satzes
  choice: erläuternd-begründend mit „denn“
  alternative: kausal mit „weil“
  rationale: Der griechische Anschluss lässt beide Nuancen zu. Im Zusammenhang ist die Preisgabe am ehesten die konkrete Gestalt oder Begründung des Handelns nach ihren Sünden, nicht dessen zeitlich oder logisch vorgelagerte Ursache; die Alternative wird daher in einer Fußnote offengehalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter biblischer Bildsprache. Das Semikolon macht den erläuternden Anschluss sichtbar, ohne die knappe Satzstruktur unnötig auszubauen.
