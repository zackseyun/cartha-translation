  text: And the earth will know all your righteous judgments[a], O God.
translation:
  language: de
  text: Und die Erde wird alle deine gerechten Urteile erkennen, o Gott.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γνώσεται
  choice: wird erkennen
  rationale: Das Futur von γινώσκω kann ein künftiges Erkennen oder Anerkennen ausdrücken. „Wird erkennen“ ist im Deutschen natürlicher als „wird wissen“ und legt die genaue Nuance nicht unnötig fest.
- source_word: ἡ γῆ
  choice: die Erde
  rationale: γῆ kann „Land“ oder „Erde“ bedeuten. Der umfassende Zusammenhang mit allen Urteilen Gottes spricht hier für „die Erde“.
- source_word: τὰ κρίματά σου
  choice: deine Urteile
  rationale: κρίματα bezeichnet Urteile oder richterliche Entscheidungen. „Urteile“ bewahrt den forensischen Sinn knapp und verständlich.
- source_word: πάντα
  choice: alle
  rationale: πάντα bezieht sich auf die gesamte Nominalgruppe und bezeichnet die Gesamtheit der gerechten Urteile Gottes.
- source_word: τὰ δίκαια
  choice: gerechten
  rationale: δίκαια charakterisiert die Urteile als gerecht. „Gerecht“ gibt sowohl ihre rechtliche als auch ihre sittliche Qualität wieder.
- source_word: ὁ θεός
  choice: o Gott
  rationale: Der artikulierte Nominativ wird hier als Anrede gebraucht. „O Gott“ erhält den Gebetscharakter und die feierliche Würde.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wortstellung bleibt nah am griechischen Satz, klingt dabei aber natürlich; die mögliche Bedeutung „Land“ wird wegen des wahrscheinlich universalen Bezugs nicht in den Haupttext aufgenommen.
