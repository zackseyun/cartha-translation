lexical_decisions:
- source_word: σῶμα
  choice: Leib
  rationale: Das gewöhnliche Wort bezeichnet hier den toten Körper. „Leib“ bewahrt den konkreten und zugleich würdevollen Ton, ohne die im Kontext klare Todesvorstellung durch „Leichnam“ ausdrücklich hinzuzufügen.
- source_word: διαφερόμενον
  choice: dahingetrieben
  rationale: Das passive Partizip beschreibt, wie der Leib durch eine äußere Kraft auf den Wellen fortbewegt wird. „Dahingetrieben“ ist im Deutschen natürlich und lässt die genaue Bewegungsart offen.
- source_word: ἐπὶ κυμάτων
  choice: auf den Wellen
  rationale: Die Wendung gibt schlicht den Ort beziehungsweise das Medium der Bewegung an und wird idiomatisch mit „auf den Wellen“ wiedergegeben.
- source_word: ἐν ὕβρει πολλῇ
  choice: in großer Schmach
  rationale: ὕβρις kann Übermut, Misshandlung, Entehrung oder Schändung bezeichnen. Im Zusammenhang mit dem preisgegebenen, unbestatteten Leib bringt „Schmach“ die entwürdigende Behandlung prägnant zum Ausdruck, ohne ihren Urheber näher festzulegen.
- source_word: οὐκ ἦν ὁ θάπτων
  choice: niemand war da, der ihn begrub
  rationale: Die substantivierte Partizipialkonstruktion bezeichnet das Fehlen einer Person, die die Bestattung vollzieht. Die Formulierung ist klares, heutiges Deutsch und bewahrt den erzählenden Vergangenheitsbezug.
