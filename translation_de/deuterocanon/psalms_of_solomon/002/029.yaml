translation:
  language: de
  text: um den Hochmut des Drachen in Schande zu stürzen[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Etwas förmlicher: „um den Hochmut des Drachen in Schmach zu versetzen“.'
    reason: lexical_alternative
  - marker: b
    text: Der „Drache“ bezeichnet im Zusammenhang wahrscheinlich bildlich einen feindlichen Herrscher oder eine feindliche Macht; das griechische Bild bleibt im Haupttext erhalten.
    reason: cross_reference
lexical_decisions:
- source_word: τοῦ ἐπιθεῖναι
  choice: zu stürzen
  rationale: Der substantivierte Infinitiv führt die vorausgehende Zweck- oder Erstattungsbitte weiter. Zusammen mit ἐν ἀτιμίᾳ gibt „in Schande zu stürzen“ die bewirkte Erniedrigung natürlich wieder, ohne das Bild auf eine bestimmte historische Deutung festzulegen.
- source_word: τὴν ὑπερηφανίαν
  choice: den Hochmut
  rationale: ὑπερηφανία bezeichnet überhebliche Selbsterhöhung. „Hochmut“ bewahrt die deutlich negative Wertung und passt zum würdevollen poetischen Register.
- source_word: τοῦ δράκοντος
  choice: des Drachen
  rationale: Die konkrete griechische Bildsprache wird beibehalten. Eine Übersetzung als „Herrscher“, „Feind“ oder „Unterdrücker“ würde den nicht ausdrücklich genannten Bezug vorzeitig festlegen.
- source_word: ἐν ἀτιμίᾳ
  choice: in Schande
  rationale: ἀτιμία meint Ehrverlust, Schmach oder Entehrung. „In Schande“ bewahrt diesen besonderen Akzent und verbindet sich im Deutschen idiomatisch mit „stürzen“.
theological_decisions:
- issue: Identität des „Drachen“
  choice: Die Metapher „Drache“ bleibt im Haupttext stehen.
  alternative: Den Drachen ausdrücklich als einen geschichtlichen fremden Herrscher oder eine feindliche Macht bezeichnen.
  rationale: Der Vers nennt den Bezug der Metapher nicht ausdrücklich. Ihre Beibehaltung wahrt die Bildsprache und lässt die historische beziehungsweise theologische Zuordnung offen.
- issue: Verhältnis von Hochmut und Schande
  choice: Der Hochmut wird „in Schande“ gestürzt.
  alternative: Den Hochmut „mit Schmach bedecken“, „der Schmach preisgeben“ oder „zuschanden machen“.
  rationale: Die gewählte Formulierung erhält sowohl den Hochmut als grammatisches Objekt als auch ἀτιμία als eigenständigen Gedanken des Ehrverlusts; sie löst die Konstruktion nicht lediglich in das allgemeinere „beschämen“ auf.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit poetischer Prägnanz. „Hochmut“ und „Schande“ erhalten den Gegensatz von übersteigerter Ehre und öffentlichem Ehrverlust; die ungewöhnliche, aber verständliche Bildfügung des Griechischen wird nicht eingeebnet.
