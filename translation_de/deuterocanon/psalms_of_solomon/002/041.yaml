  text: Gepriesen ist der Herr für immer vor seinen Dienern.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐλογητὸς
  choice: Gepriesen ist
  rationale: Das Adjektiv steht prädikativ in einer doxologischen Aussage. „Gepriesen ist“ bewahrt den feststellenden Charakter; „Gepriesen sei“ könnte stärker als Wunsch oder Aufforderung verstanden werden.
- source_word: Κύριος
  choice: der Herr
  rationale: Die Wiedergabe als göttlicher Titel ist im Deutschen idiomatisch und entspricht dem Kontext.
- source_word: εἰς τὸν αἰῶνα
  choice: für immer
  rationale: Die feste Wendung bezeichnet unbegrenzte Dauer; „für immer“ ist eine klare, natürliche Wiedergabe im heutigen Deutsch.
- source_word: ἐνώπιον
  choice: vor
  rationale: „Vor“ gibt die räumlich beziehungsweise relational verstandene Gegenwart der Diener knapp wieder, ohne die mögliche Bedeutung unnötig auf Sehen oder öffentliche Anerkennung festzulegen.
- source_word: δούλων
  choice: Dienern
  rationale: δοῦλος kann „Sklave“ oder „Diener“ bezeichnen. Im doxologischen Verhältnis zu Gott ist „Diener“ natürlich und wahrt den Gedanken der Unterordnung, ohne hier einen nicht eigens betonten sozialen Sklavenstatus in den Vordergrund zu rücken.
theological_decisions: []
translation_notes:
  register: Kurze, würdige doxologische Aussage in modernem Standarddeutsch. Die vorangestellte Prädikatsformulierung „Gepriesen ist“ erhält den feierlichen Ton und den deklarativen Charakter des Griechischen.
