base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/002/001.yaml
  text: When the sinner acted arrogantly[a], he tore down fortified walls with battering rams[b], and you did not stop him.
translation:
  language: de
  text: Als der Sünder sich überhob, riss er mit Rammböcken befestigte Mauern nieder, und du hindertest ihn nicht.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich kann κριοῖς auch „Widdern“ heißen; im Zusammenhang mit dem Niederreißen befestigter Mauern sind jedoch Rammböcke gemeint.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν τῷ ὑπερηφανεύεσθαι
  choice: Als … sich überhob
  rationale: Die Konstruktion ἐν τῷ mit Infinitiv ist hier temporal. „Sich überheben“ gibt die hochmütige Selbsterhöhung von ὑπερηφανεύομαι knapp und würdevoll wieder.
- source_word: τὸν ἁμαρτωλόν
  choice: der Sünder
  rationale: Der Singular und die direkte moralische Bezeichnung des griechischen Textes bleiben erhalten.
- source_word: ἐν κριοῖς
  choice: mit Rammböcken
  rationale: κριός bedeutet wörtlich „Widder“, bezeichnet im Zusammenhang mit dem Niederreißen befestigter Mauern aber sehr wahrscheinlich das gleichnamige Belagerungsgerät.
- source_word: κατέβαλλε
  choice: riss … nieder
  rationale: Das Verb bezeichnet das Niederwerfen beziehungsweise Niederreißen; der deutsche Ausdruck passt zum Angriff auf Mauern. Das griechische Imperfekt stellt den Vorgang als im Verlauf dar, ohne dass dies im Deutschen zwingend umschrieben werden muss.
- source_word: τείχη ὀχυρά
  choice: befestigte Mauern
  rationale: ὀχυρός bedeutet hier „stark“ beziehungsweise „befestigt“; bei Mauern ist „befestigte Mauern“ die natürliche militärische Wiedergabe.
- source_word: οὐκ ἐκώλυας
  choice: du hindertest ihn nicht
  rationale: Das im Griechischen unausgesprochene Objekt wird aus dem vorhergehenden Subjekt ergänzt. „Hindern“ bleibt näher an κωλύω als eine freiere Formulierung wie „aufhalten“.
theological_decisions:
- issue: Der angesprochene Verantwortliche wird nicht ausdrücklich benannt.
  choice: Das unbestimmte „du“ bleibt stehen.
  alternative: „Gott“ oder „Herr“ ausdrücklich ergänzen.
  rationale: Der Vers spricht ein Gegenüber in der zweiten Person an, nennt es aber nicht. Eine ausdrückliche Identifizierung würde eine im Einzelvers nur kontextuell erschlossene Deutung in den Text eintragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Sich überheben“ bewahrt den Gedanken hochmütiger Selbsterhöhung, ohne eine konfessionelle Deutung einzutragen. Die Satzstellung ordnet „mit Rammböcken“ dem Niederreißen der Mauern zu, wie es Syntax und Sachzusammenhang nahelegen.
