translation:
  language: de
  text: Söhne und Töchter waren in schlimmer Gefangenschaft; ihre Nacken waren mit einem Siegel gekennzeichnet[a], mit einem Kennzeichen unter den Völkern.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „ihr Nacken in einem Siegel“. Die griechische Formulierung ist stark verdichtet und kann an ein Siegel, einen Stempel oder die öffentliche Kennzeichnung von Gefangenen erinnern.'
    reason: lexical_alternative
  - marker: b
    text: Das griechische Wort kann „gekennzeichnet“, „auffällig“ oder „hervorgehoben“ bedeuten. Im Zusammenhang ist möglicherweise ein öffentlich sichtbares Kennzeichen oder Brandmal gemeint.
    reason: lexical_alternative
lexical_decisions:
- source_word: υἱοὶ καὶ θυγατέρες
  choice: Söhne und Töchter
  rationale: Die ausdrückliche Paarform des Griechischen bleibt erhalten; das allgemeinere „Kinder“ würde sie einebnen.
- source_word: ἐν αἰχμαλωσίᾳ πονηρᾷ
  choice: in schlimmer Gefangenschaft
  rationale: „Gefangenschaft“ gibt αἰχμαλωσία direkt wieder. „Schlimm“ bewahrt die breite negative Wertung von πονηρά, ohne sie vorschnell ausschließlich als moralisch böse oder als grausam auszulegen.
- source_word: ἐν σφραγῖδι ὁ τράχηλος αὐτῶν
  choice: ihr Nacken war mit einem Siegel gekennzeichnet
  rationale: Die knappe griechische Wendung lautet formal „ihr Nacken in einem Siegel“. Die deutsche Fassung macht die naheliegende Wirkung des Siegels verständlich, erhält aber mit „Siegel“ das konkrete Bild und mit dem kollektiven Singular „ihr Nacken“ die Form des Ausgangstextes.
- source_word: ἐν ἐπισήμῳ
  choice: sie trugen ein Kennzeichen
  rationale: ἐπίσημος bezeichnet etwas Gekennzeichnetes, Auffälliges oder Hervorgehobenes. „Kennzeichen“ nimmt die Markierungsbildsprache auf, ohne die stärkere und unsichere Deutung „Brandmal“ in den Haupttext einzutragen.
- source_word: ἐν τοῖς ἔθνεσιν
  choice: unter den Völkern
  rationale: Die Wiedergabe ist transparent und wahrt die räumlich-soziale Bedeutung; „Heiden“ wäre hier stärker theologisch festgelegt.
