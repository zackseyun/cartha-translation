  source_fidelity: 'Der deutsche Text gibt die griechische Satzfolge und die wesentlichen Bedeutungen zuverlässig wieder: καὶ als fortführendes „Und“, das futurische Ende in συντελεσθήσονται, die Ausnahmebedingung ἐὰν μὴ, die Anrede „Herr“ sowie die Zurechtweisung „in deinem Zorn“. „Ein Ende finden“ ist eine idiomatische deutsche Wiedergabe, die die Art dieses Endes nicht überbestimmt.'
