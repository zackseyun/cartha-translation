base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/002/026.yaml
  text: And they will be brought to an end[a], unless you, Lord[b], rebuke them in your wrath.
translation:
  language: de
  text: Und sie werden ein Ende finden[a], wenn nicht du, Herr, sie[b] in deinem Zorn zurechtweist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „werden völlig beseitigt werden“ oder „werden vernichtet werden“ (συντελεσθήσονται).
    reason: lexical_alternative
  - marker: b
    text: Im Griechischen bleibt das Subjekt von „werden ein Ende finden“ unausgesprochen; auch die von Gott Zurechtgewiesenen werden nur mit „sie“ bezeichnet. Der Zusammenhang kann darauf hindeuten, dass unterschiedliche Gruppen gemeint sind.
    reason: referential_ambiguity
lexical_decisions:
- source_word: καὶ
  choice: Und
  rationale: Die einfache Verknüpfung führt den Gedankengang des Gebets fort, ohne eine zusätzliche zeitliche oder logische Nuance einzutragen.
- source_word: συντελεσθήσονται
  choice: werden ein Ende finden
  rationale: Die Form ist Futur Passiv von συντελέω und bezeichnet hier, dass jemand zu einem Ende kommt beziehungsweise vollständig beseitigt wird. Die deutsche Wendung ist natürlich und wahrt die Spannweite, ohne die Art des Endes festzulegen.
- source_word: ἐὰν μὴ
  choice: wenn nicht
  rationale: Die Bedingungsfügung ἐὰν μή lässt sich hier unmittelbar und idiomatisch mit „wenn nicht“ wiedergeben; „es sei denn“ wäre ebenfalls möglich, würde aber den Satz stärker umformen.
- source_word: Κύριε
  choice: Herr
  rationale: Der Vokativ bezeichnet die direkte Gebetsanrede und wird im modernen Standarddeutsch natürlich mit „Herr“ wiedergegeben.
- source_word: ἐπιτιμήσεις
  choice: zurechtweist
  rationale: ἐπιτιμάω bezeichnet einen nachdrücklichen, autoritativen Verweis. „Zurechtweisen“ bewahrt diesen Sinn in verständlicher, würdiger Sprache.
- source_word: ἐν ὀργῇ σου
  choice: in deinem Zorn
  rationale: ὀργή bezeichnet hier heftigen, auch richterlichen Zorn. Die formnahe Wiedergabe erhält das theologische Gewicht der Aussage.
theological_decisions:
- issue: Bezug des unausgesprochenen Subjekts und des Pronomens αὐτοῖς
  choice: Die mehrdeutige pronominale Form bleibt im Haupttext erhalten und wird in einer Fußnote erläutert.
  alternative: Das Subjekt ausdrücklich als „Israel“ und das Objekt als dessen Feinde beziehungsweise die Völker bestimmen.
  rationale: Das Griechische nennt das Subjekt von συντελεσθήσονται nicht ausdrücklich und bezeichnet das Objekt der Zurechtweisung nur als „sie“. Der Zusammenhang kann auf unterschiedliche Bezugsgruppen weisen, doch eine ausdrückliche Identifizierung im Haupttext würde eine Auslegung festschreiben, die der einzelne Vers grammatisch nicht ausformuliert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Ein Ende finden“ vermeidet das schwerfällige doppelte Passiv „zu Ende gebracht werden“ und legt sich zugleich weniger stark als „vernichtet werden“ auf eine bestimmte Art des Endes fest. Die pronominale Spannung des griechischen Satzes wird nicht stillschweigend durch ergänzte Eigennamen aufgelöst.
