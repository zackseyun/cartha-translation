  text: And I did not delay until God showed me his insolence[a], pierced through on the mountains of Egypt[d][c][b], utterly despised on land and sea.
translation:
  language: de
  text: 'Und ich wartete nicht lange, bis Gott mir seine Überheblichkeit zeigte: Er war auf den Bergen Ägyptens durchbohrt und mehr verachtet als der Geringste zu Land und auf See.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich kann der Anfang auch heißen: „Und ich zögerte nicht, bis Gott mir seine Überheblichkeit zeigte.“ Im Zusammenhang liegt jedoch der Sinn nahe, dass der Sprecher nicht lange warten musste.'
    reason: lexical_alternative
  - marker: b
    text: 'Das Griechische ist knapp gefügt: „durchbohrt auf den Bergen Ägyptens, mehr verachtet als der Geringste zu Land und auf See“. Das im Griechischen maskuline Partizip „durchbohrt“ bezieht sich auf den Mann, nicht auf die feminine „Überheblichkeit“.'
    reason: grammar_clarification
lexical_decisions:
- source_word: οὐκ ἐχρόνισα
  choice: ich wartete nicht lange
  rationale: Im Zusammenhang bezeichnet die Wendung am natürlichsten, dass der Sprecher nicht lange warten musste, bis er Gottes Antwort sah; eine rein wörtliche Wiedergabe als „ich zögerte nicht“ könnte fälschlich eine Entscheidung des Sprechers ausdrücken.
- source_word: τὴν ὕβριν αὐτοῦ
  choice: seine Überheblichkeit
  rationale: ὕβρις verbindet anmaßenden Hochmut mit frevelhaftem, beleidigendem Verhalten. „Überheblichkeit“ ist gegenwärtiges, verständliches Deutsch und wahrt den moralischen Nachdruck.
- source_word: ἐκκενεκεντημένον
  choice: durchbohrt
  rationale: Das maskuline Partizip bezeichnet den gewaltsam durchbohrten Mann, nicht die feminine „Überheblichkeit“. Der deutsche Satz macht diesen Bezug mit „Er war“ deutlich, ohne ein Tatwerkzeug festzulegen.
- source_word: ἐπὶ τῶν ὀρέων Αἰγύπτου
  choice: auf den Bergen Ägyptens
  rationale: Die direkte Wiedergabe bewahrt die auffällige, aber klare Ortsangabe des griechischen Textes und glättet ὄρη nicht zu „Hügelland“.
- source_word: ὑπὲρ ἐλάχιστον ἐξουδενωμένον
  choice: mehr verachtet als der Geringste
  rationale: Die knappe griechische Vergleichsformulierung wird im Deutschen verständlich ergänzt, ohne den Komparativ in ein bloßes „völlig verachtet“ aufzulösen.
- source_word: ἐπὶ γῆς καὶ θαλάσσης
  choice: zu Land und auf See
  rationale: Diese feste deutsche Wendung gibt den räumlichen Gegensatz natürlich und prägnant wieder.
theological_decisions:
- issue: Bezug des maskulinen Partizips ἐκκενεκεντημένον nach dem femininen Substantiv ὕβριν
  choice: Ein neuer Satz mit „Er war“ bezieht das Durchbohrtsein ausdrücklich auf den hochmütigen Mann.
  alternative: 'Die griechische Reihung ohne ergänztes Pronomen nachbilden: „… zeigte, durchbohrt auf den Bergen Ägyptens …“'
  rationale: Die Alternative erzeugt im Deutschen den falschen Eindruck, die „Überheblichkeit“ sei durchbohrt worden. Die Ergänzung verdeutlicht nur den grammatisch durch das maskuline Partizip angezeigten Personenbezug und fügt keine konfessionelle Deutung hinzu.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnliche Ortsangabe „Berge Ägyptens“ und der gesteigerte Vergleich „mehr verachtet als der Geringste“ bleiben bewusst erhalten; nur der im Griechischen komprimierte Personenbezug wird für verständliches Deutsch explizit gemacht.
