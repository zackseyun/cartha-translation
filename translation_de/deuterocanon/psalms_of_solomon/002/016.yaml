  yaml_path: translation/deuterocanon/psalms_of_solomon/002/016.yaml
  text: I will declare you righteous[a], O God, with an upright heart; for in your judgments is your righteousness[b], O God.
translation:
  language: de
  text: Ich werde dich als gerecht bekennen[a], o Gott, mit aufrichtigem Herzen; denn in deinen Urteilen liegt deine Gerechtigkeit[b], o Gott.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dich rechtfertigen“ oder „dich für gerecht erklären“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „dein Recht“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δικαιώσω
  choice: werde dich als gerecht bekennen
  rationale: Das Futur Aktiv der ersten Person Singular hat Gott zum Objekt. Gemeint ist daher nicht, dass der Sprecher Gott gerecht macht, sondern dass er Gottes Gerechtigkeit anerkennt und bekennt. Die Formulierung bewahrt den rechtlichen Klang, ohne das im Deutschen missverständliche „dich rechtfertigen“ in den Haupttext zu setzen.
- source_word: ἐν εὐθύτητι καρδίας
  choice: mit aufrichtigem Herzen
  rationale: Die Wendung bezeichnet die innere Lauterkeit, mit der der Sprecher sein Bekenntnis ablegt. „Mit aufrichtigem Herzen“ ist natürliches modernes Deutsch und erhält das Bild moralischer Geradheit.
- source_word: κρίμασιν
  choice: Urteilen
  rationale: Der Plural bezeichnet Gottes Urteile oder richterliche Entscheidungen. „Urteile“ gibt den gerichtlichen Sinn knapp und verständlich wieder.
- source_word: δικαιοσύνη
  choice: Gerechtigkeit
  rationale: Der Begriff bezeichnet hier Gottes gerechtes Wesen beziehungsweise seine Gerechtigkeit, wie sie in seinen Urteilen erkennbar ist. „Gerechtigkeit“ wahrt zugleich die mögliche Bedeutungsnähe zu „Recht“.
theological_decisions:
- issue: Ein Mensch spricht Gott Gerechtigkeit zu
  choice: als gerecht bekennen
  alternative: rechtfertigen / für gerecht erklären
  rationale: Die Übersetzung lässt die forensische Spannung des griechischen Verbs erkennen, vermeidet aber den Eindruck, der Sprecher mache Gott erst gerecht oder spreche als übergeordneter Richter ein Urteil über ihn.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die zweimalige Anrede „o Gott“ sowie die parallele Struktur des griechischen Textes bleiben erhalten; „liegt“ ergänzt idiomatisch die im Griechischen nominal formulierte Aussage.
