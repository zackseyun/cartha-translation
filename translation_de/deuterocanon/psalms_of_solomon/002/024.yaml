  yaml_path: translation/deuterocanon/psalms_of_solomon/002/024.yaml
  text: And I saw[a], and I entreated the face of the Lord and said, “Enough, Lord[d][c][b], of your hand weighing heavily on Israel by the attack of the nations.”
translation:
  language: de
  text: 'Und ich sah und flehte vor dem Angesicht des Herrn[b] und sagte: »Lass es genug sein, Herr[a], dass deine Hände schwer auf Israel lasten[c] durch den Angriff der Völker[d].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: »Sei zufrieden, Herr« oder »Lass es genügen, Herr«. Der griechische Imperativ Ἱκάνωσον bezeichnet das Genügen oder das Erreichen eines ausreichenden Maßes.'
    reason: lexical_alternative
  - marker: b
    text: Wörtlich steht eine Wendung mit dem »Angesicht des Herrn«; gemeint ist ein Flehen in seiner Gegenwart und um seine Zuwendung.
    reason: cultural_note
  - marker: c
    text: 'Wörtlich: »dass deine Hände schwer auf Israel lasten«. Das Bild bezeichnet den lastenden Druck des göttlichen Gerichts.'
    reason: cultural_note
  - marker: d
    text: 'Auch: »durch das Hereinbrechen der Völker« oder »durch das Heranführen der Völker«. ἐπαγωγή kann sowohl das Heranbringen als auch den daraus folgenden Angriff bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ ἐγὼ εἶδον
  choice: Und ich sah es
  rationale: Das griechische εἶδον hat hier kein ausdrücklich genanntes Objekt; das deutsche »es« greift den vorausgehenden Zusammenhang auf und vermeidet eine unnatürlich abbrechende Formulierung.
- source_word: ἐδεήθην τοῦ προσώπου Κυρίου
  choice: flehte vor dem Angesicht des Herrn
  rationale: δέομαι bezeichnet eine eindringliche Bitte. »Vor dem Angesicht des Herrn« bewahrt die semitisch geprägte Wendung mit πρόσωπον und bleibt im biblischen Deutsch verständlich.
- source_word: Ἱκάνωσον
  choice: Lass es genug sein
  rationale: Der Imperativ verlangt nach Genügen beziehungsweise Beendigung. Die Formulierung gibt die Bitte um ein Ende der Bedrängnis natürlicher und zugleich genauer wieder als der bloße Ausruf »Genug!«.
- source_word: τοῦ βαρύνεσθαι χεῖράς σου ἐπʼ Ἰσραήλ
  choice: dass deine Hände schwer auf Israel lasten
  rationale: Der substantivierte Infinitiv hängt von Ἱκάνωσον ab. Der Plural χεῖράς wird bewahrt, ebenso das Bild der schwer lastenden göttlichen Hände als Ausdruck des Gerichts.
- source_word: ἐν ἐπαγωγῇ ἐθνῶν
  choice: durch den Angriff der Völker
  rationale: ἐπαγωγή kann das Heranführen, Hereinbrechen oder den Angriff bezeichnen. »Durch den Angriff« gibt den wahrscheinlichen instrumentalen Sinn wieder, ohne die mögliche Bedeutungsbreite zu verschweigen.
- source_word: Κύριε
  choice: Herr
  rationale: In der direkten Anrede Gottes ist »Herr« die natürliche und traditionsgemäße Wiedergabe von κύριος.
theological_decisions:
- issue: Wiedergabe von κύριος in der Anrede Gottes
  choice: Herr
  alternative: Gebieter
  rationale: »Herr« wahrt die übliche biblische Gottesbezeichnung und vermeidet eine unnötige Einengung auf das Herr-Knecht-Verhältnis.
- issue: Gottes Handeln durch fremde Völker
  choice: dass deine Hände schwer auf Israel lasten … durch den Angriff der Völker
  alternative: dass der Angriff der Völker unabhängig von Gottes Handeln geschieht
  rationale: Die griechische Syntax verbindet die schwer lastenden Hände Gottes mit der ἐπαγωγή der Völker. Die Übersetzung bewahrt diese theologische Spannung, ohne das genaue Verhältnis von göttlichem Gericht und menschlichem Angriff weiter auszudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst bewahrter biblischer Bildsprache. Die semitisch geprägte Wendung »vor dem Angesicht des Herrn« und der Plural »deine Hände« bleiben erhalten; erklärungsbedürftige Bedeutungsvarianten werden in Fußnoten ausgewiesen.
