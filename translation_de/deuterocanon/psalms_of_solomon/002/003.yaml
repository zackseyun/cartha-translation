base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/002/003.yaml
  text: because the sons of Jerusalem defiled the holy things of the Lord; they profaned the offerings of God with their lawless acts.
translation:
  language: de
  text: weil die Söhne Jerusalems[a] die heiligen Dinge des Herrn verunreinigt und die Opfergaben für Gott[b] durch ihre gesetzlosen Taten entweiht hatten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Kinder Jerusalems“. Im Griechischen steht „Söhne“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „die Gaben Gottes“; gemeint sind wahrscheinlich heilige Gaben, die Gott dargebracht wurden.'
    reason: cultural_note
lexical_decisions:
- source_word: ἀνθ’ ὧν
  choice: weil
  rationale: Die Wendung begründet im Zusammenhang das zuvor geschilderte Gericht; „weil“ gibt diese kausale Funktion natürlich wieder.
- source_word: οἱ υἱοὶ Ἱερουσαλήμ
  choice: die Söhne Jerusalems
  rationale: Bewahrt die ausdrücklich maskuline Form des griechischen Textes und die personifizierende Verbindung mit Jerusalem.
- source_word: ἐμίαναν
  choice: verunreinigt
  rationale: Gibt die kultische Verunreinigung heiliger Dinge klar und in würdigem modernem Deutsch wieder.
- source_word: τὰ ἅγια Κυρίου
  choice: die heiligen Dinge des Herrn
  rationale: Das substantivierte sächliche Pluraladjektiv bezeichnet am ehesten Heiliges beziehungsweise heilige Gegenstände und sollte nicht auf ein einzelnes Heiligtum eingeengt werden.
- source_word: ἐβεβήλωσαν
  choice: entweiht
  rationale: Bezeichnet prägnant die profanierende Behandlung dessen, was heilig ist.
- source_word: τὰ δῶρα τοῦ θεοῦ
  choice: die Opfergaben für Gott
  rationale: δῶρα bedeutet wörtlich „Gaben“, bezeichnet im kultischen Zusammenhang jedoch naheliegend dargebrachte Opfergaben. „für Gott“ vermeidet das deutsche Missverständnis, es seien von Gott ausgehende Gaben.
- source_word: ἐν ἀνομίαις
  choice: durch ihre gesetzlosen Taten
  rationale: Gibt den instrumentalen Sinn von ἐν und den konkreten Plural ἀνομίαις verständlich wieder.
theological_decisions:
- issue: Bezugsrichtung des Genitivs in τὰ δῶρα τοῦ θεοῦ
  choice: Opfergaben für Gott
  alternative: Gaben Gottes
  rationale: Der Tempelkontext legt Gaben nahe, die Gott dargebracht beziehungsweise ihm zugeordnet sind. Die Fußnote hält die formal mögliche wörtlichere Wiedergabe offen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die beiden griechischen Aoriste werden wegen des durch ἀνθ’ ὧν eingeleiteten Rückbezugs als Plusquamperfekt wiedergegeben und zu einer koordinierten Kausalkonstruktion verbunden.
