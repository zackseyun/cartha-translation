  verdict: approve
  source_fidelity: Die Übersetzung gibt den kausalen Rückbezug von ἀνθ᾽ ὧν angemessen wieder. „Söhne Jerusalems“ bewahrt die maskuline Pluralform, „heilige Dinge des Herrn“ die plurale und nicht näher eingegrenzte Bedeutung von τὰ ἅγια, und „verunreinigt“/„entweiht“ unterscheidet die beiden kultisch geprägten Verben sinnvoll. „Opfergaben für Gott“ gibt δῶρα im hier naheliegenden kultischen Sinn wieder, ohne die im Deutschen missverständliche Lesart zu fördern, Gott selbst gebe diese Gaben.
  naturalness: Der Satz ist idiomatisches, würdevolles modernes Standarddeutsch. Die Plusquamperfekta passen zum begründenden Rückblick im Zusammenhang. „Heilige Dinge“ ist etwas formeller, aber für die bewusst breite kultische Pluralform sowohl natürlich genug als auch genauer als eine Einengung auf Gegenstände oder Heiligtum.
  terminology: 'Die Terminologie ist konsistent und kultisch angemessen: „Herr“, „verunreinigt“, „entweiht“, „Opfergaben“ und „gesetzlose Taten“ bewahren Register und Sachgehalt. Die Fußnoten behandeln die mögliche Alternative zu „Söhne“ sowie die wörtliche Bedeutung von δῶρα transparent, ohne eine unsichere Deutung als Gewissheit auszugeben.'
