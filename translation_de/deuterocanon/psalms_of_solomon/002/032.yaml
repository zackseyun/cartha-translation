  terminology: „Verachtete“, „bedachte“ und „Mensch“ sind angemessen. Für ἀτιμία ist „Unehre“ im modernen Standarddeutsch präziser und natürlicher als „Schmach“. Die Alternativen zu τὸ ὕστερον in der Fußnote sind sachgerecht; „das Ende“ sollte als erste Alternative stehen, ohne den Haupttext auf diese Deutung festzulegen.
