translation:
  language: de
  text: Denn er verachtete ihn in Unehre; er bedachte nicht, dass er ein Mensch ist,[a] und auch das Spätere bedachte er nicht.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Griechischen werden die Handelnden nicht ausdrücklich benannt; deshalb bleibt offen, ob das Subjekt hier wechselt.
    reason: referent_ambiguity
  - marker: b
    text: 'Oder: »das Ende«; auch möglich: »was danach kam« oder »den späteren Ausgang«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξουδένωσεν
  choice: verachtete
  rationale: Das Verb bezeichnet, jemanden für nichts zu achten oder verächtlich zu behandeln. »Verachtete« gibt die Aussage knapp und kräftig wieder und wahrt zugleich den Wortanklang im näheren Zusammenhang.
- source_word: ἐν ἀτιμίᾳ
  choice: in Schmach
  rationale: Die Präpositionalfügung bezeichnet Unehre, Entehrung oder Schmach. »In Schmach« bewahrt die Form der griechischen Wendung, ohne sie zu zwei gleichgeordneten Handlungen auszuweiten.
- source_word: ἐλογίσατο
  choice: bedachte
  rationale: Das wiederholte Verb meint ein bewusstes Erwägen oder In-Rechnung-Stellen. »Bedachte« ist in beiden Vorkommen idiomatisch und erhält die Wiederholung.
- source_word: ἄνθρωπός
  choice: ein Mensch
  rationale: »Ein Mensch« entspricht dem singularischen ἄνθρωπος und bringt hier die menschliche Begrenztheit beziehungsweise Sterblichkeit natürlich zum Ausdruck.
- source_word: τὸ ὕστερον
  choice: das Spätere
  rationale: Die substantivierte Wendung kann das Nachfolgende, das Ende oder den späteren Ausgang bezeichnen. »Das Spätere« hält diesen Bezug bewusst offen.
theological_decisions:
- issue: Bezug der unausgesprochenen beziehungsweise pronominalen Subjekte
  choice: Die Pronomen bleiben im Haupttext unaufgelöst; eine Fußnote weist auf die Mehrdeutigkeit hin.
  alternative: Den ersten Handelnden ausdrücklich als Gott und den später Handelnden als den zuvor genannten Mann benennen.
  rationale: Der griechische Vers nennt die Handelnden nicht ausdrücklich. Eine eindeutige Ergänzung würde eine kontextuelle Deutung in den Text eintragen und die vorhandene Spannung beseitigen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die bewusste Wiederholung von »bedachte« bildet die griechische Wiederholung nach. »In Schmach« ist leicht gehoben, aber verständlich und dem poetisch-weisheitlichen Register angemessen.
