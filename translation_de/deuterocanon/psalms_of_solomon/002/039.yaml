translation:
  language: de
  text: und dem Gerechten Erbarmen zu erweisen angesichts der Erniedrigung durch den Sünder[a][b][c] und dem Sünder zu vergelten, was er dem Gerechten getan hat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher und stärker verdichtet: „und dem Gerechten aus der Erniedrigung des Sünders Erbarmen zu erweisen“. Die Verbindung mit „aus“ kann einen Rettungsgedanken nahelegen, nennt eine Befreiung jedoch nicht ausdrücklich.'
    reason: lexical_alternative
  - marker: b
    text: „Erniedrigung“ kann hier auch „Demütigung“, „Bedrängnis“ oder „Unterdrückung“ bedeuten.
    reason: lexical_alternative
  - marker: c
    text: „Erniedrigung des Sünders“ ist im Griechischen formal mehrdeutig. Im Zusammenhang liegt nahe, dass die vom Sünder verursachte Erniedrigung des Gerechten gemeint ist.
    reason: ambiguity
lexical_decisions:
- source_word: ἐλεῆσαι
  choice: Erbarmen zu erweisen
  rationale: Der Aoristinfinitiv bezeichnet eine konkrete barmherzige Handlung, nicht nur ein Gefühl. Die Formulierung ist im Deutschen natürlich und bewahrt den aktiven Sinn.
- source_word: δίκαιον / δικαίῳ
  choice: dem Gerechten
  rationale: Das substantivierte Adjektiv bezeichnet im Singular einen gerechten Menschen als Repräsentanten einer moralischen Kategorie. „Der Gerechte“ bewahrt sowohl Numerus als auch Kontrast zum Sünder.
- source_word: ἀπὸ ταπεινώσεως
  choice: aus der Erniedrigung … zu befreien
  rationale: Die griechische Verbindung ist stark verdichtet. „Aus“ gibt ἀπό wieder; „zu befreien“ macht den wahrscheinlich vorausgesetzten Gedanken der Rettung in verständlichem Deutsch sichtbar. „Erniedrigung“ wahrt den sozialen und moralischen Sinn von ταπείνωσις.
- source_word: ἁμαρτωλοῦ / ἁμαρτωλῷ
  choice: durch den Sünder / dem Sünder
  rationale: Das Substantiv steht jeweils im Singular und bezeichnet eine Person. In der ersten Hälfte wird der Genitiv kontextgemäß als Urheber der Erniedrigung verstanden; die mögliche formale Mehrdeutigkeit wird in einer Fußnote offengehalten.
- source_word: ἀποδοῦναι
  choice: zu vergelten
  rationale: „Vergelten“ drückt die retributive Erwiderung prägnant und in würdigem, noch geläufigem Deutsch aus.
- source_word: ἀνθʼ ὧν
  choice: was
  rationale: In Verbindung mit „vergelten“ gibt der Relativsatz „was er … getan hat“ den Grund und Gegenstand der Vergeltung idiomatisch wieder.
- source_word: ἐποίησεν δικαίῳ
  choice: was er dem Gerechten getan hat
  rationale: Der Dativ wird im Deutschen natürlich mit „dem Gerechten“ wiedergegeben, ohne die Art der Handlung über den griechischen Wortlaut hinaus festzulegen.
theological_decisions:
- issue: Verhältnis zwischen Erbarmen und Befreiung
  choice: Die Befreiung aus der Erniedrigung wird als konkrete Gestalt des Erbarmens ausgedrückt.
  alternative: 'Wörtlich verdichtet: „sich des Gerechten aus der Erniedrigung des Sünders zu erbarmen“.'
  rationale: Die Konstruktion ἐλεῆσαι … ἀπό ist im Griechischen knapp und kann einen in der Barmherzigkeit eingeschlossenen Rettungsgedanken voraussetzen. Die Hauptfassung macht diesen wahrscheinlichen Sinn lesbar, während die Fußnote die Verdichtung und Mehrdeutigkeit offenlegt.
- issue: Genitiv ἁμαρτωλοῦ
  choice: 'Der Sünder wird als Urheber der Erniedrigung verstanden: „durch den Sünder“.'
  alternative: 'Formal: „die Erniedrigung des Sünders“, möglicherweise mit anderer Zuordnung des Genitivs.'
  rationale: Der parallele zweite Halbvers, in dem dem Sünder sein Handeln am Gerechten vergolten wird, stützt die Deutung, dass der Sünder den Gerechten erniedrigt hat. Da der Genitiv allein dies nicht ausdrücklich markiert, wird die Alternative vermerkt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallelen Infinitive und der Gegensatz zwischen dem Gerechten und dem Sünder bleiben erhalten. Die Hauptfassung löst die im Deutschen schwer verständliche griechische Verdichtung behutsam auf; die Fußnoten dokumentieren den engeren Wortlaut und seine Mehrdeutigkeit.
