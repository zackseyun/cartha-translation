  text: For he turned his face away from mercy toward them—young and old and their children[b][a], all at once.
translation:
  language: de
  text: Denn er wandte sein Angesicht davon ab, sich des Jungen wie des Alten und ihrer Kinder zu erbarmen – von ihnen allen auf einmal.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπέστρεψεν
  choice: wandte … ab
  rationale: Das Verb bezeichnet ein Abwenden. Zusammen mit πρόσωπον bleibt so das konkrete Bild des griechischen Textes erhalten.
- source_word: τὸ πρόσωπον αὐτοῦ
  choice: sein Angesicht
  rationale: „Angesicht“ bewahrt die biblische, anthropomorphe Ausdrucksweise; „Gegenwart“ würde das Bild bereits auslegen.
- source_word: ἀπὸ ἐλέους αὐτῶν
  choice: davon ab, sich ihrer zu erbarmen
  rationale: Die griechische Wendung ist gedrängt und kann wörtlich als ein Abwenden „vom Erbarmen ihrer“ verstanden werden. Die deutsche Fassung gibt den naheliegenden verbalen Sinn verständlich wieder, ohne das Erbarmen abstrakt zu umschreiben.
- source_word: νέον καὶ πρεσβύτην
  choice: des Jungen wie des Alten
  rationale: Die beiden griechischen Singularformen werden kollektiv beziehungsweise distributiv gebraucht. Die deutsche Paarform wahrt sowohl den Singular als auch den umfassenden Sinn.
- source_word: τέκνα αὐτῶν
  choice: ihre Kinder
  rationale: τέκνα bezeichnet Kinder beziehungsweise Nachkommen unabhängig vom Geschlecht; „Kinder“ ist hier die natürliche und genaue Wiedergabe.
- source_word: εἰς ἅπαξ
  choice: alle auf einmal
  rationale: Die Wendung drückt hier umfassende Gleichzeitigkeit aus. „Alle auf einmal“ bezieht sowohl die genannten Altersgruppen als auch ihre Kinder ein.
theological_decisions:
- issue: Anthropomorphe Rede vom Abwenden des göttlichen Angesichts
  choice: Das konkrete Bild „wandte sein Angesicht … ab“ wurde beibehalten.
  alternative: „entzog ihnen sein Erbarmen“ oder „versagte ihnen sein Mitleid“
  rationale: Der griechische Text verbindet Gottes Angesicht mit dem Entzug des Erbarmens. Eine abstrakte Umschreibung würde die relationale und theologische Spannung glätten.
- issue: Bezug von ἀπὸ ἐλέους αὐτῶν
  choice: Als Abwenden davon, sich ihrer zu erbarmen, wiedergegeben.
  alternative: „von ihrem Erbarmen“ oder „von der Barmherzigkeit ihnen gegenüber“
  rationale: Der Genitiv αὐτῶν ist formal knapp und semantisch auf die Betroffenen bezogen. Die gewählte Form macht den wahrscheinlichsten Sinn verständlich, während die Fußnote die wörtlichere Struktur dokumentiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter biblischer Bildsprache. Der Gedankenstrich grenzt die betroffenen Gruppen als Erläuterung ab; die Formulierung vermeidet konfessionelle Zusatzdeutungen.
