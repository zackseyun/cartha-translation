review_pass:
  verdict: revise
  source_fidelity: Die Übersetzung bewahrt das Bild des abgewandten Angesichts und gibt ἐλέους αὐτῶν sachgerecht im Sinn von Erbarmen mit den Betroffenen wieder. Die Aufzählung von Jungem, Altem und Kindern sowie die Kollektivbedeutung der griechischen Singularformen werden erfasst. In der vorliegenden Satzgestaltung ist jedoch der Bezug von „alle auf einmal“ syntaktisch zu locker.
  naturalness: „Davon ab, sich ihrer zu erbarmen“ ist verständlich, doch die eingeschobene Genitiv-Apposition nach „ihrer“ und das anschließend losgelöste „alle auf einmal“ wirken im modernen Deutschen unnötig verschachtelt. Eine leicht umgestellte Fassung macht die Bezüge klar, ohne den knappen Charakter des Griechischen zu verlieren.
  terminology: „Angesicht“ ist für πρόσωπον in diesem bildhaften Kontext passend; „sich erbarmen“ entspricht ἔλεος idiomatisch und wahrt den personalen Bezug. Die Fußnote sollte die Alternative als deutsche idiomatische wörtlichere Struktur formulieren, nicht mit dem missverständlichen „Erbarmen über sie“.
  issues:
  - severity: medium
    issue: Unklarer syntaktischer Bezug von „alle auf einmal“
    rationale: Nach der durch Gedankenstriche abgetrennten Genitiv-Apposition kann „alle auf einmal“ im Deutschen nur schwer eindeutig auf die genannten Personen bezogen werden. Eine Einbindung als „von ihnen allen auf einmal“ klärt den Bezug und entspricht weiterhin εἰς ἅπαξ.
  - severity: low
    issue: Fußnotenformulierung „vom Erbarmen über sie“
    rationale: „Erbarmen über sie“ ist im modernen Standarddeutsch nicht idiomatisch und kann eine räumliche Bedeutung nahelegen. „Erbarmen mit ihnen“ gibt die mögliche nominale Struktur verständlicher wieder.
  revised_text: Denn er wandte sein Angesicht davon ab, sich des Jungen wie des Alten und ihrer Kinder zu erbarmen – von ihnen allen auf einmal.
  revised_footnotes:
  - marker: a
    text: 'Oder wörtlicher: „vom Erbarmen mit ihnen“. „Junger“ und „Alter“ stehen im Griechischen im Singular, sind hier aber kollektiv gemeint.'
    reason: lexical_alternative
  revision_rationale: Die Umstellung ordnet die Personen unmittelbar dem Verb „sich erbarmen“ zu. „Von ihnen allen auf einmal“ bindet εἰς ἅπαξ eindeutig an die gesamte Gruppe, ohne eine weitergehende Deutung hinzuzufügen. Da die Singularformen im deutschen Text erhalten bleiben, bleibt die Fußnote zur kollektiven Verwendung sinnvoll.
