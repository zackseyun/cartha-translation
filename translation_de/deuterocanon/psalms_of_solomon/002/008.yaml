revisions:
- from: Denn er wandte sein Angesicht davon ab, sich ihrer zu erbarmen – des Jungen wie des Alten und ihrer Kinder[a] –, alle auf einmal.
  to: Denn er wandte sein Angesicht davon ab, sich des Jungen wie des Alten und ihrer Kinder zu erbarmen – von ihnen allen auf einmal.
  rationale: Die Umstellung ordnet die Personen unmittelbar dem Verb „sich erbarmen“ zu. „Von ihnen allen auf einmal“ bindet εἰς ἅπαξ eindeutig an die gesamte Gruppe, ohne eine weitergehende Deutung hinzuzufügen. Da die Singularformen im deutschen Text erhalten bleiben, bleibt die Fußnote zur kollektiven Verwendung sinnvoll.
