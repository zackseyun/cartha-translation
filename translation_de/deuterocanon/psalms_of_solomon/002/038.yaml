  text: to distinguish between the righteous and the sinner[a], to repay sinners forever according to their deeds[b];
translation:
  language: de
  text: um zwischen dem Gerechten und dem Sünder zu unterscheiden[a] und den Sündern für immer nach ihren Taten zu vergelten[b];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »zwischen dem Gerechten und dem Sünder zu scheiden«.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »für das Zeitalter«; hier wahrscheinlich im Sinn von »dauerhaft« oder »für immer«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διαστεῖλαι
  choice: zu unterscheiden
  rationale: Das Verb bezeichnet hier die klare Scheidung zweier moralischer Gruppen. »Unterscheiden« bewahrt den richterlichen Sinn, ohne zwingend eine räumliche Trennung auszudrücken.
- source_word: ἀνὰ μέσον
  choice: zwischen
  rationale: Die Wendung bezeichnet die Unterscheidung oder Trennung zwischen zwei Seiten; »zwischen« ist die direkte und natürliche deutsche Entsprechung.
- source_word: δικαίου
  choice: dem Gerechten
  rationale: Der substantivierte Singular ist generisch und steht stellvertretend für eine moralische Gruppe. Die Form wahrt zugleich Numerus und grammatisches Geschlecht des Griechischen.
- source_word: ἁμαρτωλοῦ
  choice: dem Sünder
  rationale: Der substantivierte Singular bildet das genaue moralische Gegenstück zu δικαίου und bleibt in Numerus und Form quellennah.
- source_word: ἀποδοῦναι
  choice: zu vergelten
  rationale: Im Gerichtskontext bezeichnet das Verb eine den Taten entsprechende Erwiderung. »Vergelten« gibt diesen Gedanken knapp und idiomatisch wieder.
- source_word: ἁμαρτωλοῖς
  choice: den Sündern
  rationale: Der Dativ Plural wird als Empfänger der Vergeltung unmittelbar wiedergegeben.
- source_word: εἰς τὸν αἰῶνα
  choice: für immer
  rationale: Wörtlich verweist die Wendung auf »das Zeitalter«; im vorliegenden Gerichtszusammenhang bezeichnet sie wahrscheinlich eine unbegrenzte oder dauerhafte Geltung. Die Fußnote bewahrt die lexikalische Offenheit.
- source_word: κατὰ τὰ ἔργα αὐτῶν
  choice: nach ihren Taten
  rationale: »Taten« gibt ἔργα im moralischen Gerichtskontext natürlich wieder; »nach« wahrt den Maßstabcharakter von κατά.
theological_decisions:
- issue: Generischer Singular moralischer Kategorien
  choice: »dem Gerechten und dem Sünder« als klassenvertretende Singularformen
  alternative: »den Gerechten und den Sündern« oder ausdrücklich männlich-individuell »dem gerechten Mann und dem sündigen Mann«
  rationale: Die griechischen Singularformen stellen zwei moralische Typen einander gegenüber. Der deutsche substantivierte Singular erhält diese Form, ohne die Aussage auf zwei bestimmte Einzelpersonen festzulegen.
- issue: Zeitliche Tragweite von εἰς τὸν αἰῶνα
  choice: »für immer« im Haupttext, mit wörtlicher Alternative in der Fußnote
  alternative: »für das Zeitalter«
  rationale: Die idiomatische Bedeutung ist hier wahrscheinlich fortdauernd beziehungsweise ewig; die Fußnote verhindert jedoch, dass die wörtliche Bildstruktur und mögliche Nuance des Ausdrucks verdeckt werden.
translation_notes:
  register: Moderne, würdige Standardsprache. Der Infinitivanschluss und das abschließende Semikolon wurden beibehalten, da der Vers als Satzteil in seinen unmittelbaren Kontext eingebunden ist. Die Paarung »der Gerechte / der Sünder« wahrt die prägnante moralische Gegenüberstellung des Griechischen.
