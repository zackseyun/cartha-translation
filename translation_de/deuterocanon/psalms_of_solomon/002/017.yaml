base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/002/017.yaml
  text: For you repaid the sinners according to their deeds[c][b][a], and according to their exceedingly evil sins.
translation:
  language: de
  text: Denn du hast den Sündern nach ihren Taten[a] vergolten und nach ihren überaus bösen Sünden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: ihren Werken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέδωκας
  choice: hast … vergolten
  rationale: Das Verb bezeichnet die angemessene Rückgabe beziehungsweise Vergeltung. „Vergolten“ bewahrt hier den gerichtlichen Sinn und fügt sich natürlich in die Verbindung mit „nach ihren Taten“ ein.
- source_word: τοῖς ἁμαρτωλοῖς
  choice: den Sündern
  rationale: Die substantivische Bezeichnung und der bestimmte Artikel des Griechischen bleiben erhalten. Dadurch wird weder eine bloß allgemeine Umschreibung noch eine nähere historische Identifizierung in den Text eingeführt.
- source_word: ἔργα
  choice: Taten
  rationale: „Taten“ gibt in diesem Zusammenhang konkrete, der Beurteilung unterliegende Handlungen in heutigem Deutsch natürlicher wieder als „Werke“.
- source_word: ἁμαρτίας
  choice: Sünden
  rationale: „Sünden“ ist die direkte, moralisch und religiös präzise Entsprechung und bewahrt die deutliche Sprache der Vorlage.
- source_word: πονηρὰς σφόδρα
  choice: überaus bösen
  rationale: „Überaus“ erhält die starke Intensivierung durch σφόδρα, während „bösen“ die Wertung von πονηράς ohne Abschwächung wiedergibt.
- source_word: κατὰ … καὶ κατὰ
  choice: nach … und nach
  rationale: Die Wiederholung der Präposition und die verbindende Konjunktion werden bewahrt, sodass beide Maßangaben parallel hervortreten.
theological_decisions:
- issue: Bestimmtheit von τοῖς ἁμαρτωλοῖς
  choice: den Sündern
  alternative: Sündern
  rationale: Der bestimmte Artikel kann im Kontext eine bekannte oder abgegrenzte Gruppe bezeichnen. Die deutsche Form mit Artikel bewahrt diese Möglichkeit, ohne die Gruppe im Übersetzungstext näher zu bestimmen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Satzstruktur des Griechischen bleibt erhalten; „vergolten“ trägt den gerichtlichen Ton, ohne altertümlich zu wirken.
