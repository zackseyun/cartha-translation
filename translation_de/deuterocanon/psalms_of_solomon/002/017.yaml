  text: ὅτι ἀπέδωκας τοῖς ἁμαρτωλοῖς κατὰ τὰ ἔργα αὐτῶν, καὶ κατὰ τὰς ἁμαρτίας αὐτῶν τὰς πονηρὰς σφόδρα.
