  text: For they mocked and did not spare, in anger and wrath with fierce indignation.
translation:
  language: de
  text: Denn sie verhöhnten und übten keine Schonung, in Zorn und Grimm und mit Groll.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit anhaltendem Zorn“ oder „mit rachsüchtigem Zorn“.'
    reason: Das Wort μήνισις kann starken, fortdauernden oder auf Vergeltung gerichteten Zorn bezeichnen.
lexical_decisions:
- source_word: ὅτι
  choice: Denn
  rationale: Die Konjunktion führt die Begründung für die vorausgehende Aussage ein; „Denn“ ist dafür im Deutschen der natürliche Anschluss.
- source_word: ἐνέπαιξαν
  choice: sie verhöhnten
  rationale: Das Verb bezeichnet spöttische, verächtliche Behandlung. „Verhöhnten“ bewahrt den feindseligen Ton und passt zum gehobenen, aber verständlichen Register.
- source_word: οὐκ ἐφείσαντο
  choice: übten keine Schonung
  rationale: φείδομαι bedeutet hier, jemanden zu verschonen beziehungsweise von Schädigung abzusehen. Die Formulierung bleibt ohne ergänztes Objekt aus und ist im Deutschen natürlicher als „verschonten nicht“.
- source_word: ἐν ὀργῇ καὶ θυμῷ
  choice: in Zorn und Grimm
  rationale: Die Doppelung zweier verwandter Ausdrücke wird erhalten. „Grimm“ steigert den Ausdruck gegenüber „Zorn“, ohne beide Begriffe zusammenzuziehen.
- source_word: μετὰ μηνίσεως
  choice: voller Groll
  rationale: μήνισις bezeichnet starken, möglicherweise anhaltenden oder vergeltenden Zorn. „Groll“ gibt diese Nuance knapp wieder; „voller“ gestaltet die dreifache Häufung im Deutschen idiomatisch.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die rhetorische Steigerung aus drei Zornesbezeichnungen bleibt erhalten, ohne die begrifflichen Überschneidungen künstlich aufzulösen.
