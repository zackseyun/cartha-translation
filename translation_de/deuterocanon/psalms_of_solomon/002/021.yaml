base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/002/021.yaml
  text: She wrapped herself in sackcloth instead of splendid clothing[c][b][a], and a cord around her head instead of a wreath.
translation:
  language: de
  text: Sie band sich Sacktuch um statt eines prächtigen Gewandes[b] und eine Schnur um den Kopf statt eines Kranzes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „einer Krone“.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: „eines schönen Gewandes“ oder „festlicher Kleidung“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: περιέζωσατο
  choice: band sich … um
  rationale: Das griechische Medium bezeichnet, dass die Frau sich selbst bekleidet beziehungsweise etwas umlegt. Die deutsche Formulierung ist natürlich und lässt das Verb sowohl auf „Sacktuch“ als auch auf „eine Schnur“ bezogen sein.
- source_word: σάκκον
  choice: Sacktuch
  rationale: „Sacktuch“ ist die geläufige biblische Bezeichnung für den groben Stoff, der als Zeichen der Trauer getragen wurde.
- source_word: ἐνδύματος εὐπρεπείας
  choice: prächtigen Gewandes
  rationale: Die Wendung bezeichnet ein ansehnliches, schmückendes oder stattliches Kleidungsstück und bildet den bewussten Gegensatz zum Sacktuch.
- source_word: σχοινίον
  choice: Schnur
  rationale: Das Wort kann eine Schnur oder ein Seil bezeichnen. Im Zusammenhang mit dem Kopfschmuck ist „Schnur“ die angemessene, nicht unnötig schwere Wiedergabe.
- source_word: στεφάνου
  choice: Kranzes
  rationale: στέφανος bezeichnet einen um den Kopf gelegten Kranz und kann je nach Zusammenhang auch als „Krone“ wiedergegeben werden. Hier steht der schmückende Kopfschmuck im Vordergrund.
theological_decisions: []
translation_notes:
  register: 'Modernes, würdiges Standarddeutsch. Die parallele Satzstruktur des Griechischen bleibt erhalten: Sacktuch ersetzt das prächtige Gewand, die Schnur den Kranz. Das feminine Pronomen und die bildhafte Personifikation werden nicht näher bestimmt oder ausgedeutet.'
