  naturalness: Modernes, würdevolles Deutsch. „Seinen Frommen gegenüber handeln“ ist idiomatischer und präziser als „an seinen Frommen handeln“, das im heutigen Deutsch leicht eine unerwünschte Bedeutung von Eingriff oder Behandlung nahelegen kann.
  terminology: „Herr“, „gütig“, „anrufen“, „Ausdauer“, „Erbarmen“, „Fromme“, „allezeit“ und „in Kraft“ sind angemessen. „Fromme“ ist für ὅσιοι im Kontext der Psalmen Salomos vorzugswürdig und bewahrt die Unterscheidung von ἅγιοι. Die Alternativen in Fußnote b sind hilfreich.
