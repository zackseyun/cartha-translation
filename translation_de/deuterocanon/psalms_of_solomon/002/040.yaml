  yaml_path: translation/deuterocanon/psalms_of_solomon/002/040.yaml
  text: For the Lord is kind to those who call on him with endurance[a], to act according to his mercy toward his holy ones[c][b], to stand continually before him in strength.
translation:
  language: de
  text: Denn der Herr ist gütig zu denen, die ihn mit Ausdauer[a] anrufen. Er handelt seinen Frommen[b] gegenüber nach seinem Erbarmen, sodass sie allezeit in Kraft vor ihm stehen.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit Geduld“ beziehungsweise „in standhaftem Ausharren“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „seinen Getreuen“; wörtlich auch „seinen Heiligen“, wobei im Griechischen ὅσιοι und nicht ἅγιοι steht.'
    reason: lexical_alternative
  - marker: c
    text: 'Der griechische Text reiht hier zwei Infinitive aneinander und lässt ihren genauen Bezug offen. Formnäher: „… seinen Frommen gegenüber nach seinem Erbarmen zu handeln, allezeit in Kraft vor ihm zu stehen.“'
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: χρηστὸς
  choice: gütig
  rationale: „Gütig“ gibt die persönliche, wohlwollende Bedeutung von χρηστός wieder und entspricht dem würdevollen Gebetston.
- source_word: τοῖς ἐπικαλουμένοις αὐτὸν
  choice: zu denen, die ihn … anrufen
  rationale: ἐπικαλεῖσθαι bezeichnet hier das an Gott gerichtete Rufen im Gebet; „anrufen“ ist im Deutschen klar und angemessen.
- source_word: ἐν ὑπομονῇ
  choice: mit Ausdauer
  rationale: ὑπομονή bezeichnet beharrliches Ausharren, besonders unter Belastung. „Mit Ausdauer“ bewahrt diesen aktiven Sinn; Alternativen werden in einer Fußnote genannt.
- source_word: ποιῆσαι κατὰ τὸ ἔλεος αὐτοῦ
  choice: Er handelt … nach seinem Erbarmen
  rationale: Die finite Formulierung erschließt die gedrängte griechische Infinitivkonstruktion in natürlichem Deutsch, ohne die Art des göttlichen Handelns über den Text hinaus zu bestimmen.
- source_word: τοῖς ὁσίοις αὐτοῦ
  choice: seinen Frommen
  rationale: ὅσιοι bezeichnet die Gott ergebenen, bundestreuen Menschen und ist von ἅγιοι („Heilige“) zu unterscheiden. „Fromme“ bewahrt dieses Profil besser als „Heilige“; „Getreue“ bleibt als mögliche Alternative erhalten.
- source_word: διὰ παντὸς
  choice: allezeit
  rationale: „Allezeit“ drückt die fortdauernde Geltung prägnant aus und passt zum dichterisch-frommen Register.
- source_word: ἐν ἰσχύι
  choice: in Kraft
  rationale: Die nahe Wiedergabe lässt offen, woher die Kraft stammt, und bewahrt damit die Zurückhaltung des griechischen Textes.
theological_decisions:
- issue: Bezug und Subjekt der beiden Infinitive ποιῆσαι und παρεστᾶναι
  choice: Das erste Infinitivglied wird als Handeln des Herrn verstanden, das zweite als daraus folgendes Stehen seiner Frommen vor ihm.
  alternative: Beide Infinitive können formal unaufgelöst an „der Herr ist gütig“ angeschlossen werden; παρεστᾶναι könnte grammatisch auch anders bezogen werden.
  rationale: Die griechische Syntax ist stark verdichtet. Der gewählte Hauptsatz mit Folgesatz ergibt einen verständlichen Sinn und vermeidet die schwer nachvollziehbare Vorstellung, der Herr stehe vor sich selbst. Die echte syntaktische Unsicherheit wird ausdrücklich in der Fußnote bewahrt.
- issue: Bezeichnung der ὅσιοι
  choice: die Frommen
  alternative: 'die Getreuen; formnäher, aber im Buchkontext weniger treffend: die Heiligen'
  rationale: Im Kontext der Psalmen Salomos bezeichnet ὅσιοι eine durch Gottesfurcht und Bundestreue gekennzeichnete Gruppe. „Fromme“ wahrt diese soziale und religiöse Kontur, ohne eine konfessionelle Sonderlehre einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz wird für die Verständlichkeit behutsam gegliedert; die gedrängte und mehrdeutige Infinitivsyntax des Griechischen bleibt in der Fußnote sichtbar. „Allezeit“ erhält den poetisch-liturgischen Ton, ohne unnötig altertümlich zu wirken.
