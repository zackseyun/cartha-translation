translation:
  language: de
  text: Denn kein Mensch auf der Erde hat getan, was sie getan haben.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι
  choice: Denn
  rationale: Leitet die Begründung beziehungsweise Erläuterung der vorausgehenden Aussage ein und bewahrt die kausale Verknüpfung.
- source_word: οὐκ ... πᾶς ἄνθρωπος
  choice: nicht jeder Mensch
  rationale: Gibt die Stellung und den normalen Sinn der griechischen Verneinung bei πᾶς wieder. Die stärkere Wiedergabe „kein Mensch“ wäre möglich, würde die formal vorhandene Unterscheidung jedoch einebnen.
- source_word: ἐπ' αὐτῆς
  choice: auf der Erde
  rationale: Das feminine Pronomen bezieht sich im Zusammenhang auf ἡ γῆ, „die Erde“. Die ausdrückliche Wiederaufnahme des Bezugsworts ist im Deutschen klarer als „auf ihr“ und vermeidet die unbegründete feindliche Deutung „gegen sie“.
- source_word: ἐποίησεν
  choice: tat
  rationale: Der deutsche einfache Präteritalgebrauch gibt den griechischen Aorist in der erzählenden beziehungsweise rückblickenden Aussage natürlich wieder.
- source_word: ὅσα ἐποίησαν
  choice: all das, was sie taten
  rationale: ὅσα bezeichnet die Gesamtheit beziehungsweise das Ausmaß dessen, was die Mehrzahl getan hat; „all das, was“ erhält diesen Umfang deutlicher als ein bloßes „was“.
theological_decisions:
- issue: Umfang der Verneinung in οὐκ ... πᾶς ἄνθρωπος
  choice: nicht jeder Mensch
  alternative: kein Mensch
  rationale: Der griechische Wortlaut sagt formal „nicht jeder“, auch wenn der Zusammenhang möglicherweise eine rhetorisch verstärkte Aussage nahelegt. Die Übersetzung bewahrt diese Spannung, statt sie zugunsten einer universalen Verneinung aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt quellennah, während „auf der Erde“ den im Deutschen sonst undeutlichen Pronomenbezug verständlich macht.
