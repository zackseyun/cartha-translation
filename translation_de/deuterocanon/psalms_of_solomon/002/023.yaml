lexical_decisions:
- source_word: ἀτιμίᾳ
  choice: in Schande
  rationale: Das Substantiv bezeichnet Ehrlosigkeit, Entehrung oder öffentliche Demütigung. „In Schande“ ist im Deutschen natürlich und bewahrt den beschämenden Charakter der Aussage.
- source_word: τὸ κάλλος αὐτῆς
  choice: ihre Schönheit
  rationale: κάλλος bedeutet unmittelbar „Schönheit“, kann im Zusammenhang mit einer personifizierten Stadt aber auch deren Pracht bezeichnen. Die direkte Wiedergabe lässt diese Bildweite offen.
- source_word: ἀπερρίφη
  choice: wurde … geworfen
  rationale: Der Aorist Passiv bezeichnet ein Weg- oder Niederwerfen. Zusammen mit „zu Boden“ gibt „wurde … geworfen“ Richtung und Gewalt des Vorgangs klar wieder.
- source_word: ἐπὶ τὴν γῆν
  choice: zu Boden
  rationale: ἐπί mit Akkusativ drückt hier eine Bewegung auf die Erde beziehungsweise den Boden hin aus. „Zu Boden“ ist die natürliche deutsche Wendung.
theological_decisions:
- issue: Bezug des femininen Pronomens αὐτῆς
  choice: ihre
  alternative: eine ausdrückliche Nennung der Stadt
  rationale: Das feminine Pronomen wird formal bewahrt. Die wahrscheinlich personifizierte Stadt wird nicht ergänzend in den Haupttext eingeführt, da sie in diesem Vers nicht ausdrücklich genannt ist.
translation_notes:
  register: Gehobene, aber gegenwärtige Psalmsprache. Die Voranstellung von „In Schande“ bildet die griechische Hervorhebung nach; „Schönheit“ bleibt lexikalisch eng an κάλλος, während die Fußnote die kontextuell mögliche Bedeutung „Pracht“ nennt.
