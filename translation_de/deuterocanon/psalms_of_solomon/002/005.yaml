  source_fidelity: Die Übersetzung gibt die beiden aoristischen Passivformen ἐξουδενώθη und ἠτιμώθη treffend als „wurde verachtet“ bzw. „wurde ... entehrt“ wieder. „Vor Gott“ entspricht ἐνώπιον τοῦ θεοῦ unmittelbar. „Bis zum Ende“ wahrt bei ἕως εἰς τέλος die zeitliche beziehungsweise ausgedehnte Bedeutung, ohne die Wendung einseitig als bloße Steigerung festzulegen. Das Neutrum „es“ bewahrt den im griechischen Satz nicht ausgedrückten und kontextabhängigen Bezug.
  naturalness: Der Text ist knapp, idiomatisch und in modernem Standarddeutsch würdevoll. Die Wiederholung von „es wurde“ bildet den griechischen Parallelismus angemessen nach.
  terminology: „Verachtet“ und „entehrt“ sind semantisch präzise und im Register passend. Es werden keine konfessionell geprägten Deutungen eingeführt.
