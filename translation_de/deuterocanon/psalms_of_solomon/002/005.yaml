  text: It was despised before God[c][b][a]; it was dishonored to the end.
translation:
  language: de
  text: Es wurde vor Gott verachtet; es wurde bis zum Ende entehrt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Es wurde vor Gott verachtet; es wurde völlig entehrt.“'
    reason: Die Wendung ἕως εἰς τέλος kann hier neben dem zeitlich gefassten „bis zum Ende“ auch das volle Ausmaß der Entehrung ausdrücken.
lexical_decisions:
- source_word: ἐξουδενώθη
  choice: wurde verachtet
  rationale: Das Passiv bezeichnet, dass etwas als nichts geachtet beziehungsweise verachtet wurde. „Wurde verachtet“ ist im Deutschen natürlich und bewahrt den Sinn der Herabsetzung.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: vor Gott
  rationale: Die Wendung bezeichnet Gottes Gegenwart beziehungsweise Urteil und lässt sich knapp und quellennah mit „vor Gott“ wiedergeben.
- source_word: ἠτιμώθη
  choice: wurde entehrt
  rationale: Das Verb bezeichnet Entehrung und den Verlust von Ansehen; „wurde entehrt“ erhält zudem den Parallelismus zum ersten Satzglied.
- source_word: ἕως εἰς τέλος
  choice: bis zum Ende
  rationale: Die Wiedergabe bleibt nahe an der ungewöhnlich verstärkten griechischen Wendung und vermeidet, ihre mögliche zeitliche Bedeutung vorschnell auf das rein graduelle „völlig“ festzulegen.
theological_decisions:
- issue: Bezug des unausgedrückten Subjekts
  choice: Neutrum „es“
  alternative: Maskulinum „er“
  rationale: Die beiden Verben nennen kein eigenes Subjekt. Im Zusammenhang verweist das Neutrum am ehesten auf einen zuvor genannten neutralen Gegenstand, etwa das Heiligtum beziehungsweise den Altar oder die Schönheit der Herrlichkeit, nicht auf den Sünder.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch; der knappe Parallelismus und das neutrale, im Kontext erschließbare Subjekt bleiben erhalten.
