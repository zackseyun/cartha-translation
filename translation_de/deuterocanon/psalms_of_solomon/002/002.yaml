  text: Foreign nations went up onto your altar[b][a]; they trampled it with their sandals in arrogance.
translation:
  language: de
  text: Fremde[a][b] Völker stiegen auf deinen Altar hinauf; in Überheblichkeit traten sie ihn mit ihren Sandalen nieder.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „nichtisraelitische Völker“; ἔθνη kann allgemein „Völker“ oder in einem jüdischen Kultzusammenhang speziell die Völker außerhalb Israels bezeichnen.
    reason: lexical_alternative
  - marker: b
    text: Auch „fremdartige“ oder „nicht zugehörige Völker“; ἀλλότρια hebt zusätzlich ihre Fremdheit und Nichtzugehörigkeit hervor.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέβησαν
  choice: stiegen auf
  rationale: Das Verb bezeichnet konkret das Hinaufsteigen; zusammen mit ἐπὶ τὸ θυσιαστήριόν σου wird die Bewegung auf den Altar ausgedrückt, ohne eine militärische Deutung hinzuzufügen.
- source_word: θυσιαστήριόν
  choice: Altar
  rationale: „Altar“ ist die geläufige und präzise deutsche Entsprechung; eine ausdrückliche Wiedergabe als „Opferaltar“ wäre hier unnötig schwerfällig.
- source_word: ἔθνη ἀλλότρια
  choice: Fremde Völker
  rationale: „Völker“ gibt ἔθνη wieder, während „fremde“ den durch ἀλλότρια hinzugefügten Gedanken der Fremdheit bewahrt. Die Formulierung bleibt offen dafür, dass im jüdischen Kultzusammenhang insbesondere nichtisraelitische Völker gemeint sein können.
- source_word: κατεπάτησαν
  choice: zertraten ihn
  rationale: „Zertraten“ vermittelt das gewaltsame Treten und den im Zusammenhang liegenden Gedanken der Entweihung. Das Pronomen „ihn“ nimmt im Deutschen eindeutig den Altar auf.
- source_word: ἐν ὑποδήμασιν αὐτῶν
  choice: mit ihren Sandalen
  rationale: Die Wendung bezeichnet Mittel oder Begleitumstand des Tretens. „Sandalen“ ist historisch anschaulich und im Deutschen natürlich.
- source_word: ἐν ὑπερηφανίᾳ
  choice: in Überheblichkeit
  rationale: „Überheblichkeit“ erfasst die hochmütige, anmaßende Haltung des sakrilegischen Handelns und wahrt die nominale Form der griechischen Wendung.
