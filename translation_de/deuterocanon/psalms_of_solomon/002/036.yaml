  text: And now see[a], you nobles of the earth, the judgment of the Lord, that he is a great and righteous king[b], judging what is under heaven.
translation:
  language: de
  text: 'Und nun seht, ihr Großen der Erde[a], das Gericht des Herrn: Denn er ist ein großer und gerechter König und richtet, was unter dem Himmel ist[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ihr Mächtigen«, »ihr Vornehmen« oder »ihr Herrscher der Erde«.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: »richtet das unter dem Himmel [Befindliche]«; auch möglich: »richtet die Erde unter dem Himmel« oder »die Welt unter dem Himmel«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἴδετε
  choice: seht
  rationale: Der Imperativ fordert die Angeredeten unmittelbar auf, das ergangene Gericht wahrzunehmen. »Seht« ist gegenwärtig, klar und bewahrt die direkte Anrede.
- source_word: μεγιστᾶνες τῆς γῆς
  choice: ihr Großen der Erde
  rationale: μεγιστᾶνες bezeichnet hochgestellte, einflussreiche Männer. »Großen der Erde« wahrt die gehobene öffentliche Anrede und lässt den sozialen wie politischen Rang offen.
- source_word: κρίμα τοῦ κυρίου
  choice: das Gericht des Herrn
  rationale: κρίμα kann den richterlichen Entscheid, das Urteil oder den Vollzug des Gerichts bezeichnen. »Gericht« erhält diese Bedeutungsbreite; κύριος wird als göttlicher Titel mit »Herr« wiedergegeben.
- source_word: μέγας βασιλεὺς καὶ δίκαιος
  choice: ein großer und gerechter König
  rationale: Die beiden Adjektive werden natürlich auf βασιλεύς bezogen. Die Formulierung bewahrt sowohl die Hoheit als auch die Gerechtigkeit des Königs.
- source_word: κρίνων τὴν ὑπʼ οὐρανόν
  choice: richtet, was unter dem Himmel ist
  rationale: Die griechische Wendung ist elliptisch und nennt das Bezugsnomen nicht ausdrücklich. »Was unter dem Himmel ist« wahrt diese Offenheit, ohne ein im Text fehlendes »alles«, »Erde« oder »Welt« einzufügen.
theological_decisions:
- issue: Funktion von ὅτι nach »das Gericht des Herrn«
  choice: Denn er ist ein großer und gerechter König
  alternative: dass er ein großer und gerechter König ist
  rationale: ὅτι kann begründend (»denn/weil«) oder inhaltlich (»dass«) verstanden werden. Der begründende Anschluss ergibt im Deutschen einen natürlichen Satz und stellt Gottes gerechtes Königtum als Grund seines Gerichts dar, ohne den möglichen inhaltlichen Anschluss zu verschweigen.
- issue: Unausgesprochenes Subjekt im ὅτι-Satz
  choice: er
  alternative: der Herr
  rationale: Das Subjekt wird aus dem unmittelbar vorausgehenden »des Herrn« aufgenommen. Das Pronomen macht den deutschen Satz vollständig, ohne den Gottesnamen im griechischen Text zu wiederholen.
translation_notes:
  register: Moderne, würdige Standardsprache mit direkter prophetischer Anrede. Die Satzstellung stellt das Gericht in den Vordergrund und bleibt gut verständlich. Die Ellipse in der Schlusswendung wird nicht durch »alles« vereindeutigt.
