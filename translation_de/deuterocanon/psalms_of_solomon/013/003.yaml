  text: Savage beasts rushed at them; with their teeth they tore at their flesh, and with their molars they crushed their bones; and from all these things the Lord rescued us. rushed at them; with their teeth they tore at their flesh, and with their molars they crushed their bones; and from all these things the Lord rescued us.
translation:
  language: de
  text: Bösartige Tiere stürzten sich auf sie; mit ihren Zähnen rissen sie ihnen das Fleisch ab, und mit ihren Backenzähnen zermalmten sie ihnen die Knochen; und aus all dem rettete uns der Herr.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θηρία … πονηρά
  choice: bösartige Tiere
  rationale: Gibt sowohl die Tierbezeichnung als auch die negative Charakterisierung durch πονηρά wieder, ohne das Bild unnötig auf „wilde Tiere“ einzuengen.
- source_word: ἐπέδραμοσαν αὐτοῖς
  choice: stürzten sich auf sie
  rationale: Entspricht dem gewaltsamen Heranstürmen gegen die Betroffenen und klingt im Deutschen natürlich.
- source_word: ἔτιλλον σάρκας αὐτῶν
  choice: rissen sie ihnen das Fleisch ab
  rationale: ἔτιλλον bezeichnet ein Ausreißen oder Rupfen; die deutsche Wendung bewahrt die drastische Körperlichkeit des Bildes.
- source_word: ἐν ταῖς μυλαῖς
  choice: mit ihren Backenzähnen
  rationale: μύλαι bezeichnet hier die mahlenden Zähne; „Backenzähne“ ist verständlich und anatomisch passend.
- source_word: ἔθλων ὀστᾶ αὐτῶν
  choice: zermalmten sie ihnen die Knochen
  rationale: Bewahrt die intensive Bedeutung des Zermürbens oder Zerquetschens.
- source_word: ἐρρύσατο
  choice: rettete
  rationale: Drückt die Befreiung aus einer akuten tödlichen Gefahr idiomatisch aus.
theological_decisions:
- issue: Wechsel von der dritten Person („sie“) zur ersten Person („uns“)
  choice: Den Personenwechsel unverändert beibehalten
  alternative: Die Pronomen zur Einheitlichkeit angleichen
  rationale: Der griechische Text wechselt ausdrücklich von αὐτοῖς/αὐτῶν zu ἡμᾶς; diese mögliche Identifikation des sprechenden Wir mit den zuvor Genannten darf nicht geglättet werden.
- issue: Wiedergabe von Κύριος
  choice: der Herr
  alternative: JHWH
  rationale: Κύριος steht im überlieferten griechischen Text ohne ausdrückliche Wiedergabe des Gottesnamens; „der Herr“ wahrt die griechische Form und den würdigen biblischen Sprachgebrauch.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit kräftigen Verben, die das drastische Tierbild erhält. Die abschließende adversative Verbindung „Doch“ macht den Kontrast zwischen äußerster Bedrohung und Rettung natürlich hörbar, ohne den Aussagegehalt zu verändern.
