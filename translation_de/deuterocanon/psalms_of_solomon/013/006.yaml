translation:
  language: de
  text: Denn die Zurechtweisung der Gerechten in Unwissenheit[a][b] ist nicht dasselbe wie der Untergang des Sünders.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Wendung „in Unwissenheit“ kann auch auf etwas bezogen werden, das unwissentlich getan wurde.
    reason: lexical_alternative
  - marker: b
    text: Eine Textvariante liest „der Sünder“ statt „der Gerechten“ im ersten Satzglied.
    reason: textual_variant
lexical_decisions:
- source_word: οὐχ ὁμοία
  choice: ist nicht dasselbe wie
  rationale: Die Wendung drückt einen grundlegenden Unterschied zwischen der Zurechtweisung der Gerechten und dem Untergang des Sünders aus; die deutsche Formulierung ist natürlich und bewahrt den Vergleich.
- source_word: παιδεία
  choice: Zurechtweisung
  rationale: Gemeint ist hier korrigierendes, erzieherisches Handeln. „Zurechtweisung“ gibt diesen Sinn wieder, ohne bereits eine bestimmte Lehre über die Art des Leidens festzulegen.
- source_word: τῶν δικαίων
  choice: der Gerechten
  rationale: Der Genitiv bezeichnet die Gruppe, an der die Zurechtweisung geschieht; „die Gerechten“ entspricht dem substantivierten griechischen Adjektiv.
- source_word: ἐν ἀγνοίᾳ
  choice: in Unwissenheit
  rationale: 'Die bewusst formnahe Wiedergabe erhält die Mehrdeutigkeit des Griechischen: Die Wendung kann den Zustand der Unwissenheit oder indirekt unwissentlich begangenes Fehlverhalten bezeichnen.'
- source_word: καταστροφὴ
  choice: Untergang
  rationale: Das Wort bezeichnet vernichtenden Ruin. „Untergang“ bildet einen klaren, kräftigen Gegensatz zur korrigierenden Zurechtweisung.
- source_word: τοῦ ἁμαρτωλοῦ
  choice: des Sünders
  rationale: Die substantivierte Einzahl wird als repräsentative moralische Bezeichnung beibehalten.
theological_decisions:
- issue: Verhältnis zwischen der Zurechtweisung der Gerechten und dem Gericht über den Sünder
  choice: Der Vers stellt die Zurechtweisung der Gerechten dem Untergang des Sünders gegenüber, ohne die genaue Ursache oder Gestalt der Zurechtweisung näher auszudeuten.
  alternative: 'Man kann ἐν ἀγνοίᾳ ausdrücklich auf unwissentlich begangene Sünden beziehen und übersetzen: „die Zurechtweisung der Gerechten für unwissentlich begangene Sünden“.'
  rationale: Der unmittelbare Gegensatz legt korrigierende Zurechtweisung gegenüber vernichtendem Ausgang nahe. Da das Griechische jedoch weder „Sünden“ noch eine eindeutige kausale Präposition enthält, bleibt die Übersetzung bei der offenen Formulierung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur wurde für natürliche Lesbarkeit leicht umgestellt; die knappe Gegenüberstellung und die Mehrdeutigkeit von ἐν ἀγνοίᾳ bleiben erhalten.
