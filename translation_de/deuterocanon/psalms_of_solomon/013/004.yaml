  terminology: „Der Gottlose“, „Verfehlungen“ und „Sünder“ sind registergerecht und wahren den religiös-ethischen Akzent. „Weggerafft“ ist als Deutung im Kontext möglich; die Alternative sollte idiomatisch als „zusammen fortgenommen“ formuliert werden, nicht als „mit fortgenommen“.
