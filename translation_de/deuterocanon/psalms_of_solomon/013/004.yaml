translation:
  language: de
  text: Der Gottlose wurde wegen seiner Verfehlungen beunruhigt, aus Furcht, dass er nicht zusammen mit den Sündern weggerafft würde.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „nicht wenn er zusammen mit den Sündern weggerafft wird“. Die griechische Wendung μὴ ὅτε συμπαραληφθῇ ist syntaktisch schwierig; der Haupttext versteht sie präventiv: „aus Furcht, dass er nicht … würde“.'
    reason: alternative_reading
  - marker: b
    text: „Weggerafft“ kann auch mit „zusammen fortgenommen“ oder „mitgerissen“ wiedergegeben werden und bezeichnet hier ein gemeinsames Ergehen mit den Sündern.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐταράχθη
  choice: wurde … erschüttert
  rationale: Das Passiv von ταράσσω bezeichnet Erschütterung, Beunruhigung oder Bestürzung. „Wurde erschüttert“ wahrt sowohl die innere als auch eine mögliche äußere Dimension, ohne sie näher festzulegen.
- source_word: ὁ ἀσεβής
  choice: der Gottlose
  rationale: ἀσεβής bezeichnet einen Menschen, dessen Haltung von fehlender Ehrfurcht vor Gott geprägt ist. „Der Gottlose“ bewahrt diesen religiös-ethischen Akzent und entspricht einem würdigen biblischen Register.
- source_word: διὰ παραπτώματα αὐτοῦ
  choice: wegen seiner Verfehlungen
  rationale: διά mit Akkusativ ist hier kausal. παραπτώματα bezeichnet konkrete Übertretungen oder Fehltritte; „Verfehlungen“ ist verständlich, gewichtig und weniger fachsprachlich als „Übertretungen“.
- source_word: μὴ ὅτε συμπαραληφθῇ
  choice: damit er nicht … weggerafft wird
  rationale: Die griechische Fügung ist syntaktisch schwierig. Die Übersetzung versteht μή präventiv und gibt den wahrscheinlich beabsichtigten Sinn wieder, ohne die alternative Gliederung zu verschweigen. Das Präfix συν-/συμ- wird durch „zusammen mit“ ausgedrückt.
- source_word: μετὰ τῶν ἁμαρτωλῶν
  choice: zusammen mit den Sündern
  rationale: Die Wendung bezeichnet die Gemeinschaft in einem gemeinsamen Gericht. „Zusammen mit den Sündern“ macht den durch Verb und Präposition doppelt markierten Gemeinschaftsaspekt natürlich deutlich.
theological_decisions:
- issue: Verhältnis der Erschütterung zur drohenden gemeinsamen Wegraffung
  choice: 'Die zweite Klausel wird als präventiver Zweck beziehungsweise befürchtete Folge verstanden: „damit er nicht … weggerafft wird“.'
  alternative: „nicht wenn er zusammen mit den Sündern weggerafft wird“
  rationale: μὴ ὅτε συμπαραληφθῇ ist im Griechischen ungewöhnlich und lässt sich nicht mit völliger Sicherheit gliedern. Der Haupttext folgt dem im Zusammenhang kohärenteren präventiven Verständnis; die Alternative bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit vertrautem biblischem Wortschatz. Die schwierige griechische Syntax wird im Haupttext lesbar wiedergegeben, während die echte Auslegungsunsicherheit in der Fußnote erhalten bleibt.
