  yaml_path: translation/deuterocanon/psalms_of_solomon/013/005.yaml
  text: For the destruction of the sinner is dreadful[a], and none of all these things will touch the righteous.
translation:
  language: de
  text: Denn furchtbar ist der Untergang des Sünders, und nichts von all dem wird den Gerechten treffen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δεινή
  choice: furchtbar
  rationale: Gibt die erschreckende, unheilvolle Stärke des Adjektivs natürlich und würdevoll wieder; es kennzeichnet den Untergang des Sünders.
- source_word: καταστροφή
  choice: Untergang
  rationale: Bezeichnet hier vernichtendes Verderben beziehungsweise endgültigen Ruin, ohne den Sinn unnötig auf einen militärischen Sturz einzuengen.
- source_word: ἁμαρτωλοῦ
  choice: des Sünders
  rationale: Bewahrt den substantivierten Singular und die moralische Aussage des griechischen Ausdrucks.
- source_word: ἅψεται
  choice: wird … treffen
  rationale: Das Verb bedeutet wörtlich „berühren/ergreifen“. Im Zusammenhang von Unheil ist „treffen“ im Deutschen idiomatisch und bewahrt die Vorstellung, dass dieses Unheil den Gerechten nicht erreicht.
- source_word: δικαίου
  choice: den Gerechten
  rationale: Der substantivierte Singular bezeichnet einen repräsentativen Gerechten beziehungsweise die moralische Gruppe; die deutsche Formulierung bleibt knapp und schriftsprachlich natürlich.
- source_word: οὐδὲν ἐκ πάντων τούτων
  choice: nichts von all dem
  rationale: Bewahrt sowohl die Verneinung jedes einzelnen Unheils als auch die zusammenfassende Kraft von πάντων („all“).
theological_decisions:
- issue: Reichweite der Bewahrung des Gerechten
  choice: „nichts von all dem wird den Gerechten treffen“
  alternative: eine allgemein formulierte Zusage, dass den Gerechten überhaupt kein Leid trifft
  rationale: Das Demonstrativ τούτων verweist auf die zuvor genannten Dinge. Die Übersetzung beschränkt die Aussage daher auf diesen Kontext und macht daraus keine uneingeschränkte Lehre über jedes mögliche Leid.
translation_notes:
  register: Moderne, würdige Standardsprache. Die vorangestellte Prädikativform „furchtbar ist“ bewahrt die Hervorhebung des griechischen δεινή, ohne altertümlich zu wirken. „Doch“ gibt den sachlichen Gegensatz zwischen dem Untergang des Sünders und der Bewahrung des Gerechten natürlicher wieder als ein rein additives „und“.
