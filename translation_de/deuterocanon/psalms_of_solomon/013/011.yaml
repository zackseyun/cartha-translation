  text: But upon the godly is the mercy of the Lord[c][b][a], and upon those who fear him is his mercy.
translation:
  language: de
  text: Den Frommen gilt die Barmherzigkeit des Herrn, und denen, die ihn fürchten[a], gilt seine Barmherzigkeit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Ihn fürchten“ schließt ehrfürchtige Verehrung ein; der griechische Text bewahrt jedoch die stärkere biblische Ausdrucksweise der Gottesfurcht.
    reason: Bewahrt die lexikalische und theologische Spannung von φοβουμένους.
lexical_decisions:
- source_word: ὁσίους
  choice: den Frommen
  rationale: ὅσιοι bezeichnet hier Menschen, die durch religiöse Treue und Frömmigkeit gekennzeichnet sind. „Die Frommen“ wahrt diese gruppenbezogene Bedeutung und vermeidet die mögliche Verwechslung mit ἅγιοι („die Heiligen“).
- source_word: ἔλεος
  choice: Barmherzigkeit
  rationale: „Barmherzigkeit“ gibt ἔλεος in beiden Vorkommen unmittelbar und in einem würdigen biblischen Register wieder.
- source_word: Κυρίου
  choice: des Herrn
  rationale: Die traditionelle und im Deutschen natürliche Wiedergabe von κύριος in der Gottesbezeichnung ist „der Herr“.
- source_word: φοβουμένους
  choice: die ihn fürchten
  rationale: Die Formulierung bewahrt die starke biblische Rede von der Gottesfurcht; sie umfasst Ehrfurcht, darf aber nicht stillschweigend darauf verengt werden.
- source_word: ἐπὶ ... ἔλεος
  choice: über ... ruht die Barmherzigkeit
  rationale: Das ergänzte Verb „ruht“ macht den nominalen griechischen Satz im Deutschen idiomatisch, während die zweimalige ἐπί-Struktur und das Bild bewahrt bleiben.
theological_decisions:
- issue: Soll die Gottesfurcht als bloße Ehrfurcht abgeschwächt werden?
  choice: die ihn fürchten
  alternative: die ihn ehren / Ehrfurcht vor ihm haben
  rationale: Das Griechische verwendet φοβέομαι und erhält damit die traditionelle theologische Spannung der Gottesfurcht, die Ehrfurcht einschließt, aber sprachlich stärker bleibt.
- issue: Ist ὅσιοι als „Heilige“ oder als „Fromme“ wiederzugeben?
  choice: die Frommen
  alternative: die Heiligen / die Gottesfürchtigen
  rationale: „Die Frommen“ bildet den besonderen moralisch-religiösen Gruppenbegriff ab, ohne ihn mit dem gewöhnlich durch ἅγιοι bezeichneten Begriff „die Heiligen“ gleichzusetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallele Satzstruktur und die Wiederholung von „Barmherzigkeit“ werden beibehalten. „Fromme“ dient als verständliche gruppenbezogene Wiedergabe von ὅσιοι.
