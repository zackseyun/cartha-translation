  source_fidelity: Die beiden parallelen Aussagen mit der Wiederholung von ἔλεος sind erfasst; „die Frommen“, „der Herr“ und „die ihn fürchten“ sind treffend. Das ergänzte Bild „ruht über“ ist jedoch im Deutschen nicht die neutralste Wiedergabe von ἐπί mit dem nominalen Prädikat und fügt eine räumlich-statische Nuance hinzu, die der griechische Text nicht ausdrücklich setzt.
  naturalness: „Über den Frommen ruht die Barmherzigkeit“ klingt im modernen Standarddeutsch poetisch, aber syntaktisch und semantisch weniger unmittelbar. „Den Frommen gilt die Barmherzigkeit“ ist idiomatisch, würdig und erhält die parallele Ausrichtung beider Satzglieder.
  terminology: „Die Frommen“ gibt ὁσίους im Kontext der Psalmen Salomos angemessen wieder und vermeidet die Gleichsetzung mit ἅγιοι. „Barmherzigkeit“, „des Herrn“ und „ihn fürchten“ sind sachgerecht; die Formulierung zur Gottesfurcht sollte nicht zu bloßer Verehrung abgeschwächt werden.
