- from: Doch über den Frommen ruht die Barmherzigkeit des Herrn[a], und über denen, die ihn fürchten[b], ruht seine Barmherzigkeit.
  to: Den Frommen gilt die Barmherzigkeit des Herrn, und denen, die ihn fürchten[a], gilt seine Barmherzigkeit.
  rationale: Die Revision ersetzt das zusätzlich bildhafte „ruht über“ durch die im Deutschen natürliche, semantisch zurückhaltende Wendung „gilt“. Sie wahrt die zweigliedrige Parallelität, die zweimalige Nennung der Barmherzigkeit und die Unterscheidung zwischen den Frommen und denen, die den Herrn fürchten. Die entbehrliche Fußnote zur gestrichenen Verbergänzung wird entfernt und der verbleibende Anker angepasst.
