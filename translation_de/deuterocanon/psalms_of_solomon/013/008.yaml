base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/013/008.yaml
  text: For he will admonish a righteous man as a beloved son[c][b][a], and his discipline is like that of a firstborn.
translation:
  language: de
  text: Denn er wird einen Gerechten zurechtweisen wie einen geliebten Sohn[a], und seine Erziehung ist die eines Erstgeborenen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „wie einen Sohn der Liebe“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „und seine Unterweisung ist wie die eines Erstgeborenen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: νουθετήσει
  choice: wird … zurechtweisen
  rationale: Das Verb bezeichnet mahnende, korrigierende Unterweisung. „Zurechtweisen“ gibt den korrektiven Sinn im Zusammenhang mit παιδεία natürlich wieder.
- source_word: δίκαιον
  choice: einen Gerechten
  rationale: Das anarthrische substantivierte Adjektiv steht im Singular. „Einen Gerechten“ bewahrt den Bezug auf eine einzelne Person und passt zum anschließenden Bild des Sohnes.
- source_word: ὡς υἱὸν ἀγαπήσεως
  choice: wie einen geliebten Sohn
  rationale: Der Genitiv ἀγαπήσεως kann qualitativ verstanden werden. „Geliebter Sohn“ ist im Deutschen natürlich und bewahrt das väterliche Bild; die wörtlichere Fassung wird in einer Fußnote genannt.
- source_word: παιδεία
  choice: Erziehung
  rationale: Das Wort umfasst Unterweisung, Schulung und disziplinierende Formung. „Erziehung“ passt zum Vater-Sohn-Bild und ist weiter als bloße Bestrafung.
- source_word: πρωτοτόκου
  choice: eines Erstgeborenen
  rationale: Das substantivierte Adjektiv bezeichnet einen Erstgeborenen. Die knappe Form bewahrt die im Griechischen nicht weiter bestimmte Beziehung.
theological_decisions:
- issue: Bezug von αὐτοῦ in καὶ ἡ παιδεία αὐτοῦ
  choice: „seine Erziehung“ lässt den grammatischen Bezug formal offen
  alternative: „die Erziehung, die er empfängt“ oder „Gottes Erziehung an ihm“
  rationale: Das Possessivpronomen kann ohne ergänzenden Kontext als zu der zurechtgewiesenen Person gehörige bzw. sie betreffende Erziehung verstanden werden. Die Übersetzung fügt weder einen ausdrücklichen Handelnden noch einen Empfänger hinzu.
- issue: Vergleich ὡς πρωτοτόκου
  choice: „ist die eines Erstgeborenen“
  alternative: „ist wie die eines Erstgeborenen“
  rationale: Das zweite ὡς leitet einen Vergleich ein; idiomatisches Deutsch kann diesen mit „die eines“ ausdrücken. Die Formulierung vermeidet eine Festlegung darauf, ob privilegierte Unterweisung oder besonders strenge Zucht gemeint ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt eng am griechischen Parallelismus; „Erziehung“ hält den pädagogischen und disziplinierenden Bedeutungsumfang von παιδεία offen.
