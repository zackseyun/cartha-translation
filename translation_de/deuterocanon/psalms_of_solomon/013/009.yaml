source:
  edition: lxx-swete-1909
  text: ὅτι φείσεται Κύριος τῶν ὁσίων αὐτοῦ, καὶ τὰ παραπτώματα αὐτῶν ἐξαλείψει ἐν παιδείᾳ. ἡ γὰρ ζωὴ τῶν δικαίων εἰς τὸν αἰῶνα·
  language: Greek
  pages:
  - 803
  validation: swete_direct
base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/013/009.yaml
  text: For the Lord will spare his faithful ones[a], and he will wipe away their trespasses by discipline[c][b]; for the life of the righteous is forever.
translation:
  language: de
  text: Denn der Herr wird seine Getreuen[a] verschonen und ihre Verfehlungen durch Züchtigung[b] auslöschen; denn das Leben der Gerechten währt ewig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „seine Frommen“ oder „seine Treuen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „durch Erziehung“, „durch Zurechtweisung“ oder „unter Züchtigung“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: φείσεται
  choice: wird … verschonen
  rationale: Gibt den konkreten Sinn wieder, vor dem vollen Gericht zu bewahren, und lässt zugleich die folgende korrigierende Züchtigung bestehen.
- source_word: Κύριος
  choice: der Herr
  rationale: Natürliche deutsche Wiedergabe des griechischen Gottestitels; der im Griechischen fehlende Artikel ist für die deutsche Form nicht maßgeblich.
- source_word: ὁσίων
  choice: seine Getreuen
  rationale: Bezeichnet hier die frommen, bundestreuen Angehörigen der Gemeinschaft. „Getreue“ bewahrt diesen Sinn besser als „Heilige“, das eher ἅγιοι entsprechen und spätere kirchliche Assoziationen wecken kann.
- source_word: παραπτώματα
  choice: Verfehlungen
  rationale: Bezeichnet moralische Fehltritte oder Übertretungen und ist im modernen Deutsch verständlich, ohne den Begriff zum allgemeineren „Sünden“ auszuweiten.
- source_word: ἐξαλείψει
  choice: wird … auslöschen
  rationale: Bewahrt das Bild vollständiger Tilgung oder Entfernung, das im griechischen Verb liegt.
- source_word: ἐν παιδείᾳ
  choice: durch Züchtigung
  rationale: Versteht ἐν instrumental und gibt παιδεία als erziehende, korrigierende Maßnahme wieder; „Züchtigung“ erhält zugleich die Härte des Ausdrucks.
- source_word: δικαίων
  choice: der Gerechten
  rationale: Transparente und etablierte Wiedergabe von δικαίων in diesem Kontext.
- source_word: εἰς τὸν αἰῶνα
  choice: währt ewig
  rationale: Gibt die unbegrenzte Dauer idiomatisch und würdig wieder.
theological_decisions:
- issue: Verhältnis von Verschonung und Züchtigung
  choice: Das Verschonen durch den Herrn schließt die erziehende Tilgung der Verfehlungen durch Züchtigung ein.
  alternative: Verschonung und Tilgung könnten als zwei getrennte Handlungen verstanden werden; παιδεία könnte vorwiegend strafend statt erziehend aufgefasst werden.
  rationale: Der Satz verbindet göttliche Schonung eng mit dem Auslöschen der Verfehlungen ἐν παιδείᾳ. Die Übersetzung wahrt daher die Spannung zwischen Erbarmen und schmerzhafter Korrektur, ohne eines von beiden abzuschwächen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Getreue“ dient als verständliche Gruppenbezeichnung für ὅσιοι; „Züchtigung“ ist bewusst gewichtiger als „Erziehung“ und bewahrt die Spannung zwischen korrigierender Unterweisung und leidvoller Ahndung.
