  yaml_path: translation/deuterocanon/psalms_of_solomon/013/007.yaml
  text: A righteous man is disciplined in secret[c][b][a], so that the sinner may not gloat over the righteous man.
translation:
  language: de
  text: Ein Gerechter wird im Verborgenen[a] zurechtgewiesen[b], damit der Sünder nicht über den Gerechten frohlockt.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit Zurückhaltung“ oder „unter Einschränkung“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „in Zucht genommen“ oder „erzogen“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „sich über den Gerechten freut“; gemeint ist schadenfrohe Freude.'
    reason: lexical_alternative
lexical_decisions:
- source_word: περιστολή
  choice: im Verborgenen
  rationale: 'Das Substantiv kann ein Bedecken oder Verbergen bezeichnen. Im Zusammenhang erklärt diese Wiedergabe den Zwecksatz: Die Zurechtweisung bleibt verborgen, sodass der Sünder keinen Anlass zum Frohlocken erhält. Die ebenfalls mögliche Bedeutung einer Einschränkung oder Zurückhaltung bleibt in der Fußnote erhalten.'
- source_word: παιδεύεται
  choice: wird zurechtgewiesen
  rationale: Das Verb bezeichnet Erziehung, Unterweisung oder korrigierende Zucht. „Zurechtgewiesen“ gibt hier den korrektiven Sinn natürlich wieder, ohne die Handlung unnötig auf körperliche Bestrafung festzulegen.
- source_word: δίκαιος
  choice: ein Gerechter
  rationale: Der maskuline Singular ist generisch und bezeichnet einen exemplarischen gerechten Menschen. „Ein Gerechter“ bewahrt Form und spruchartigen Charakter.
- source_word: ἐπιχαρῇ
  choice: frohlockt über
  rationale: Das Verb bezeichnet Freude angesichts des Ergehens eines anderen und hat hier einen feindseligen, schadenfrohen Beiklang. „Frohlockt über“ wahrt sowohl die Grundbedeutung als auch diesen Kontext.
- source_word: ἁμαρτωλός
  choice: der Sünder
  rationale: Der substantivierte Ausdruck mit Artikel steht als repräsentativer Typ und bildet den moralischen Gegensatz zum Gerechten.
theological_decisions:
- issue: Generisches Maskulinum bei δίκαιος
  choice: ein Gerechter
  alternative: ein gerechter Mensch; der Gerechte
  rationale: Die grammatisch maskuline Singularform mit allgemeiner Aussagekraft wird bewahrt, ohne die Aussage auf eine bestimmte Einzelperson zu beziehen.
- issue: Art und Sichtbarkeit der göttlichen oder erzieherischen Zurechtweisung
  choice: im Verborgenen
  alternative: mit Zurückhaltung; unter Einschränkung
  rationale: Der Zwecksatz legt nahe, dass die Zurechtweisung dem Sünder verborgen bleibt. Da περιστολή jedoch auch Einschränkung oder Zurückhaltung bezeichnen kann, wird diese echte lexikalische Möglichkeit nicht dogmatisch ausgeschlossen, sondern angemerkt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit spruchartiger Knappheit. „Im Verborgenen“ folgt der kontextuell stärksten Deutung, während die mögliche Bedeutung „mit Zurückhaltung“ in der Fußnote bewahrt wird. „Zurechtgewiesen“ vermeidet sowohl einen zu schwachen rein didaktischen als auch einen unnötig körperlich-strafenden Ausdruck.
