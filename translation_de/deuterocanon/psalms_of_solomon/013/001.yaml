base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/013/001.yaml
  text: The right hand of the Lord sheltered me[b][a]; the right hand of the Lord spared us.
translation:
  language: de
  text: Die rechte Hand des Herrn beschirmte mich[a]; die rechte Hand des Herrn verschonte uns[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »bedeckte mich«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »erbarmte sich unser«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Δεξιὰ
  choice: rechte Hand
  rationale: Die feminine, substantivisch gebrauchte Form lässt im Zusammenhang »Hand« ergänzen; die Wiedergabe bewahrt das biblische Bild für Macht und Schutz.
- source_word: Κυρίου
  choice: des Herrn
  rationale: Der Genitiv bezeichnet die Zugehörigkeit; »Herr« ist hier die natürliche und traditionsgerechte Wiedergabe von κύριος.
- source_word: ἐσκέπασέν
  choice: beschirmte
  rationale: Das Verb bezeichnet ein Bedecken, das Schutz gewährt. »Beschirmte« verbindet das Bild des Bedeckens mit dem gemeinten Schutz und passt zum würdevollen poetischen Register.
- source_word: με
  choice: mich
  rationale: Direkte Wiedergabe des Personalpronomens der ersten Person Singular als Objekt.
- source_word: ἐφείσατο
  choice: verschonte
  rationale: Das Verb bedeutet, jemanden zu schonen beziehungsweise von Vernichtung oder Schaden abzusehen. »Verschonte« gibt diesen Sinn knapp und idiomatisch wieder.
- source_word: ἡμῶν
  choice: uns
  rationale: Das Verb φείδομαι regiert im Griechischen den Genitiv; im Deutschen verlangt »verschonen« den Akkusativ.
theological_decisions:
- issue: Wiedergabe von κύριος
  choice: Herr
  alternative: Gebieter
  rationale: »Herr« ist die sachgerechte Standardwiedergabe und lässt die religiöse Bedeutung des Titels offen, ohne eine zusätzliche Deutung einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit poetischer Parallelstruktur. Die zweimalige Wendung »die rechte Hand des Herrn« wird entsprechend dem griechischen Text beibehalten; der Wechsel von »mich« zu »uns« bleibt unverändert sichtbar.
