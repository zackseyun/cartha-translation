  yaml_path: translation/deuterocanon/psalms_of_solomon/013/010.yaml
  text: But sinners will be taken away to destruction[b][a], and no remembrance of them will be found any longer.
translation:
  language: de
  text: Doch die Sünder werden ins Verderben hinweggenommen[a], und keine Erinnerung[b] an sie wird mehr zu finden sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „werden weggenommen“ oder „werden entfernt“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „kein Erinnerungszeichen“ beziehungsweise „kein Denkmal für sie“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἁμαρτωλοὶ
  choice: die Sünder
  rationale: Das substantivierte Adjektiv bezeichnet unmittelbar Menschen, die durch Sünde gekennzeichnet sind. „Die Sünder“ gibt diesen Sinn schlicht wieder, ohne ihn zur stärker deutenden Bezeichnung „die Bösen“ zu verschieben.
- source_word: ἀρθήσονται
  choice: werden hinweggenommen
  rationale: Die Futur-Passivform von αἴρω bezeichnet hier ein Wegnehmen oder Entfernen. „Hinweggenommen“ bewahrt das Passiv und passt zum gehobenen poetischen Register, ohne die Art des Gerichts näher festzulegen.
- source_word: εἰς ἀπώλειαν
  choice: ins Verderben
  rationale: ἀπώλεια bezeichnet Untergang, Vernichtung oder Verderben. „Ins Verderben“ ist im Deutschen idiomatisch, wahrt die Schwere der Aussage und vermeidet eine konfessionell aufgeladene Deutung.
- source_word: μνημόσυνον
  choice: Erinnerung
  rationale: Das Wort kann sowohl das Erinnern als auch ein Erinnerungszeichen oder Denkmal bezeichnen. „Erinnerung“ ergibt im Satz einen natürlichen poetischen Sinn; die gegenständlichere Möglichkeit wird in einer Fußnote erhalten.
- source_word: ἔτι
  choice: mehr
  rationale: In Verbindung mit der Verneinung bezeichnet ἔτι, dass von diesem Zeitpunkt an nichts Derartiges mehr bestehen oder gefunden werden wird.
