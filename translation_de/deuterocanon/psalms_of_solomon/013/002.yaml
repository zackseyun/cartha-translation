    issue: Die Formulierung „das hindurchzog“ ist stilistisch und semantisch leicht unbestimmt.
    rationale: Das deutsche Verb „hindurchziehen“ verlangt gewöhnlich einen mitgedachten oder genannten Bereich; die attributive Partizipialform „hindurchziehenden“ wirkt bei einer personifizierten Kriegsgefahr natürlicher und bleibt nahe bei διαπορευομένης.
  revised_text: Der Arm des Herrn rettete uns vor dem hindurchziehenden Schwert, vor Hungersnot und dem Tod der Sünder.[a]
