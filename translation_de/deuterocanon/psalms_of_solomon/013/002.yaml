  verdict: revise
  source_fidelity: Die Übersetzung gibt βραχίων Κυρίου, ἔσωσεν, λιμός und θάνατος zutreffend wieder. Die dreifache Gefahrenreihe und die offene Genitivbeziehung in θανάτου ἁμαρτωλῶν bleiben erhalten. Das Partizip διαπορευομένης bezeichnet ein sich hindurchbewegendes Schwert; „hindurchziehend“ bildet dies idiomatischer ab als der Relativsatz „das hindurchzog“ und vermeidet dessen etwas unklare Bezugsvorstellung („hindurch“ wodurch?).
  naturalness: „Der Arm des Herrn rettete uns vor dem hindurchziehenden Schwert“ ist modernes, würdiges Standarddeutsch und bewahrt die Bildsprache. Die Wiederholung von „vor“ entspricht der Gliederung des griechischen Satzes.
  terminology: „Arm des Herrn“, „rettete“, „Hungersnot“ und „Tod der Sünder“ sind angemessen. Der Gottesname wird nicht über den griechischen Titel κύριος hinaus spezifiziert. Die Fußnote behandelt die semantisch offene Genitivbeziehung ohne sie konfessionell festzulegen.
  issues:
