  text: The arm of the Lord saved us from the sword passing through[b][a], from famine and the death of sinners.
translation:
  language: de
  text: Der Arm des Herrn rettete uns vor dem hindurchziehenden Schwert, vor Hungersnot und dem Tod der Sünder.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »dem Tod für Sünder« beziehungsweise »dem von Sündern verursachten Tod«. Die Beziehung des griechischen Genitivs ist nicht eindeutig.'
    reason: alternative_reading
lexical_decisions:
- source_word: βραχίων
  choice: Arm
  rationale: Die konkrete Körpermetapher bleibt erhalten und bezeichnet anschaulich die rettende Macht des Herrn.
- source_word: Κυρίου
  choice: des Herrn
  rationale: Gibt den griechischen Gottestitel κύριος direkt und in natürlichem deutschem Bibelstil wieder, ohne eine nicht ausdrücklich vorliegende Wiedergabe des Gottesnamens einzuführen.
- source_word: ἔσωσεν
  choice: rettete
  rationale: Direkte Wiedergabe des Aorists; das Präteritum bezeichnet die vollzogene Rettung klar und würdig.
- source_word: ῥομφαίας
  choice: dem Schwert
  rationale: „Schwert“ ist die naheliegende konkrete Entsprechung; der bestimmte Artikel ist im Deutschen wegen des folgenden Relativsatzes natürlich.
- source_word: διαπορευομένης
  choice: das hindurchzog
  rationale: Der Relativsatz gibt das Partizip und seine Bewegung durch ein Gebiet direkt wieder, ohne die im Verb nicht ausdrücklich enthaltene zerstörerische Wirkung durch „fegte“ zu verstärken.
- source_word: λιμοῦ
  choice: Hungersnot
  rationale: Im Zusammenhang einer Reihe gemeinschaftlicher Katastrophen bezeichnet „Hungersnot“ das Ausmaß treffender als bloß „Hunger“.
- source_word: θανάτου
  choice: Tod
  rationale: Entspricht dem griechischen Substantiv unmittelbar und vermeidet eine Verallgemeinerung zu „Verderben“ oder „Vernichtung“.
- source_word: ἁμαρτωλῶν
  choice: der Sünder
  rationale: Die formale Genitivkonstruktion wahrt im Haupttext die knappe und mehrdeutige Beziehung des griechischen Genitivs.
theological_decisions:
- issue: Beziehung des Genitivs in θανάτου ἁμαρτωλῶν
  choice: dem Tod der Sünder
  alternative: dem Tod für Sünder; dem von Sündern verursachten Tod
  rationale: Der bloße Genitiv legt nicht eindeutig fest, ob die Sünder sterben, der Tod ihnen gilt oder von ihnen verursacht wird. Der Haupttext bewahrt die formal nächstliegende und ebenfalls mehrdeutige Konstruktion; die Fußnote nennt die anderen möglichen Beziehungen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter biblischer Bildsprache. Die Satzstruktur folgt der dreigliedrigen Gefahrenreihe des Griechischen, ohne unnötige Archaismen.
