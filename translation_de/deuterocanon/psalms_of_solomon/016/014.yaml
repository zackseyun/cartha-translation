revisions:
- from: Wenn ein Mensch durch seinen Untergang zurechtgewiesen wird,[a][b] so besteht deine Prüfung an seinem Fleisch und in Armut.
  to: Wenn ein Mensch durch seinen Untergang zurechtgewiesen wird,[a][b] liegt deine Prüfung in seinem Fleisch und in Armut.
  rationale: Die Revision ersetzt die nicht idiomatische und präpositional ungenaue Wendung „besteht ... an seinem Fleisch“ durch „liegt ... in seinem Fleisch und in Armut“. Dadurch werden die beiden griechischen ἐν-Wendungen parallel wiedergegeben, ohne die schwierige Aussage stärker auszudeuten. Fußnote b wird so korrigiert, dass ihre Kennzeichnung als wörtlich der Präposition ἐν entspricht.
