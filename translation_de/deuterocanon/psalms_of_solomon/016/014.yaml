review_pass:
  verdict: revise
  source_fidelity: Die Hauptfassung gibt ἐλέγχηται, die wahrscheinlich instrumentale, semitisch geprägte Wendung ἐν χειρί, ἀπώλεια sowie ψυχή im Sinn von „Mensch/Person“ angemessen wieder. Im zweiten Satzteil steht jedoch zweimal ἐν; „an seinem Fleisch“ gibt die erste Präposition nicht wieder und verschiebt die Konstruktion.
  naturalness: „So besteht deine Prüfung an seinem Fleisch und in Armut“ ist im modernen Standarddeutsch sowohl syntaktisch als auch idiomatisch unerquicklich. „liegt ... in seinem Fleisch und in Armut“ ist klarer, wahrt die elliptische Prädikation und bildet die parallelen Präpositionen ab.
  terminology: „Mensch“, „zurechtgewiesen“, „Untergang“, „Prüfung“, „Fleisch“ und „Armut“ sind sachgerecht. Die Alternativanmerkungen sollen die schwierige Syntax kenntlich machen, ohne den unsicheren Bezug übermäßig zu erklären.
  issues:
