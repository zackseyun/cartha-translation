  text: If a person is rebuked by means of his ruin[b][a], your testing is in his flesh and in poverty.
translation:
  language: de
  text: Wenn ein Mensch durch seinen Untergang zurechtgewiesen wird,[a][b] liegt deine Prüfung in seinem Fleisch und in Armut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wenn eine Seele in der Gewalt ihres Verderbens zurechtgewiesen wird.“ Der griechische Wortlaut dieses Satzteils ist schwierig.'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlicher: „Wenn eine Seele in der Hand ihres Untergangs zurechtgewiesen wird.“'
    reason: previous_rendering
lexical_decisions:
- source_word: ἐλέγχηται
  choice: zurechtgewiesen wird
  rationale: Das Verb bezeichnet ein Aufdecken und korrigierendes Zurechtweisen; die deutsche Wendung bewahrt diesen Sinn, ohne eine gerichtliche Verurteilung vorauszusetzen.
- source_word: ψυχήν
  choice: ein Mensch
  rationale: ψυχή kann semitisch geprägt eine Person bzw. ein menschliches Leben bezeichnen. „Ein Mensch“ passt zudem zu den maskulinen Rückbezügen αὐτοῦ und vermeidet eine künstliche Trennung von Seele und Leib.
- source_word: ἐν χειρὶ
  choice: durch
  rationale: Die Wendung ist hier wahrscheinlich instrumental im Sinn von „durch“ oder „mittels“ gebraucht. Die wörtliche Hand-Metapher bleibt wegen der schwierigen Syntax in einer Fußnote erhalten.
- source_word: ἀπωλίας
  choice: Untergang
  rationale: ἀπώλεια bezeichnet Untergang, Verderben oder Vernichtung. „Untergang“ ist verständlich und lässt offen, ob ein Vorgang oder dessen Ergebnis gemeint ist.
- source_word: δοκιμασία
  choice: Prüfung
  rationale: Das Substantiv bezeichnet eine Erprobung, durch die Beschaffenheit oder Bewährung sichtbar wird.
- source_word: σαρκί
  choice: Fleisch
  rationale: Die konkrete körperliche Bedeutung ist im Zusammenhang mit Armut naheliegend; „Fleisch“ erhält zugleich die formale Entsprechung.
- source_word: πενίᾳς
  choice: Armut
  rationale: Trotz der auffälligen Form im überlieferten Text ist der Sinn „Armut“ beziehungsweise materieller Mangel klar.
theological_decisions:
- issue: Deutung der schwierigen Wendung ἐν χειρὶ ἀπωλίας αὐτοῦ
  choice: „durch seinen Untergang“
  alternative: „in der Hand seines Untergangs“ bzw. „in der Gewalt seines Verderbens“
  rationale: Die Hauptfassung versteht ἐν χειρί als semitisch geprägte Angabe des Mittels. Da Syntax und Bezug von αὐτοῦ unsicher bleiben, werden wörtlichere Deutungen in den Fußnoten geboten, statt die Spannung dogmatisch aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die etwas feierliche Wendung „an seinem Fleisch“ bewahrt die ungewöhnliche Struktur des Griechischen; die schwer deutbare erste Satzhälfte wird nicht übermäßig geglättet.
