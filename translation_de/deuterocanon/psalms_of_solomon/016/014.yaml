    issue: Die Wiedergabe „an seinem Fleisch“
    rationale: Das Griechische hat ἐν σαρκὶ αὐτοῦ, parallel zu ἐν πενίαις. „an“ ist hier nicht gedeckt; die Formulierung „besteht ... an“ klingt zudem unnatürlich.
  - severity: low
    issue: Fußnote b bezeichnet „durch die Hand“ als wörtlicher
    rationale: Wörtlich entspricht ἐν χειρί „in der Hand“, nicht „durch die Hand“. Die instrumentale Deutung kann als mögliche Wiedergabe genannt werden, sollte aber nicht als wörtlich etikettiert werden.
