  text: ἐν τῷ διενεχθῆναι ψυχήν μου ἀπὸ Κυρίου θεοῦ Ἰσραήλ, εἰ μὴ ὁ κύριος ἀντελάβετό μου τῷ ἐλέει αὐτοῦ εἰς τὸν αἰῶνα.
