  source_fidelity: Die Übersetzung gibt die temporale ἐν-Infinitivkonstruktion, das passive διενεχθῆναι, die Apposition „der Gott Israels“, den irrealen Ausnahmeanschluss εἰ μὴ sowie ἀντελάβετό μου zutreffend wieder. „Durch sein Erbarmen“ ist eine mögliche instrumentale Wiedergabe des Dativs. Die Schlussstellung von „auf ewig“ bewahrt den im Griechischen möglichen offenen Bezug.
  naturalness: „Fortgerissen“ und „mir beigestanden“ sind modernes, würdiges Standarddeutsch. Die durch Gedankenstrich markierte, unvollständige Konditionalstruktur ist zwar bewusst literarisch, aber sachgerecht, weil der griechische Vers den Gedanken des vorhergehenden Verses fortführt.
