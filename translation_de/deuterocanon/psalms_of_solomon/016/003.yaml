base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/016/003.yaml
  text: When my soul was being torn away from the Lord[d][c][b][a], the God of Israel—had not the Lord helped me by his mercy forever.
translation:
  language: de
  text: Als meine Seele vom Herrn, dem Gott Israels, fortgerissen wurde[a] – hätte der Herr mir nicht durch sein Erbarmen beigestanden[b], auf ewig[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „als meine Seele vom Herrn, dem Gott Israels, fortgetragen wurde“; auch „getrennt wurde“ ist möglich.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „hätte der Herr sich meiner nicht angenommen“; auch „wäre mir nicht zu Hilfe gekommen“ ist möglich.'
    reason: lexical_alternative
  - marker: c
    text: „Auf ewig“ kann sich entweder besonders auf Gottes Erbarmen oder auf sein rettendes Handeln insgesamt beziehen.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν τῷ διενεχθῆναι
  choice: als … fortgerissen wurde
  rationale: Die Konstruktion ἐν τῷ mit Infinitiv ist temporal. „Fortgerissen“ bewahrt sowohl die passive Bewegung weg von jemandem als auch den bedrängenden Ton, ohne die mögliche Bedeutung „fortgetragen“ auszuschließen.
- source_word: ψυχήν μου
  choice: meine Seele
  rationale: „Seele“ gibt die personale und religiöse Aussage von ψυχή in diesem Gebetszusammenhang angemessen wieder; „mein Leben“ wäre ebenfalls möglich, würde die Formulierung aber stärker festlegen.
- source_word: ἀπὸ Κυρίου θεοῦ Ἰσραήλ
  choice: vom Herrn, dem Gott Israels
  rationale: Die Apposition wird im Deutschen mit Kommas kenntlich gemacht. κύριος wird entsprechend dem üblichen Projektgebrauch mit „Herr“ wiedergegeben.
- source_word: εἰ μὴ
  choice: hätte … nicht
  rationale: Die Formulierung gibt den irrealen Ausnahme- beziehungsweise Bedingungssinn wieder. Der Satz bleibt erkennbar an den Gedanken des vorangehenden Verses angeschlossen.
- source_word: ἀντελάβετό μου
  choice: mir … beigestanden
  rationale: Das Verb bezeichnet ein unterstützendes Ergreifen beziehungsweise Zu-Hilfe-Kommen. „Beigestanden“ ist natürliches, würdiges Deutsch und lässt das Bild des Haltgebens anklingen.
- source_word: τῷ ἐλέει αὐτοῦ
  choice: durch sein Erbarmen
  rationale: 'Der Dativ wird instrumental verstanden: Das Erbarmen ist das Mittel oder die Grundlage der göttlichen Hilfe.'
- source_word: εἰς τὸν αἰῶνα
  choice: auf ewig
  rationale: Die Schlussstellung bleibt erhalten, damit offenbleibt, ob die Wendung besonders das Erbarmen oder das gesamte rettende Handeln näher bestimmt.
theological_decisions:
- issue: Wiedergabe von κύριος
  choice: Herr
  alternative: HERR; Gebieter
  rationale: „Herr“ ist die sachgemäße, konfessionell nicht verengende Wiedergabe des griechischen κύριος.
- issue: Bezug von εἰς τὸν αἰῶνα
  choice: als nachgestellte Wendung „auf ewig“
  alternative: „durch sein ewiges Erbarmen“ oder enger auf das rettende Eingreifen bezogen
  rationale: Die griechische Wortstellung erlaubt mehr als einen Bezug. Die deutsche Schlussstellung bewahrt diese Mehrdeutigkeit.
- issue: Satzanschluss und Bedingungsstruktur
  choice: Gedankenstrich vor dem irrealen Bedingungsteil
  alternative: vollständig ausformulierter selbstständiger Konditionalsatz
  rationale: Vers 3 setzt syntaktisch den Gedanken des vorhergehenden Verses fort. Der Gedankenstrich macht den Einschnitt verständlich, ohne einen im Griechischen nicht ausdrücklich vorhandenen Hauptsatz zu ergänzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die leicht unvollständige Konditionalstruktur wird nicht geglättet, weil der Vers den in Vers 2 begonnenen Gedanken fortführt. Der Gedankenstrich dient der Lesbarkeit; der abschließende Punkt folgt dem eigenständigen Abschluss des Verses in der Vorlage.
