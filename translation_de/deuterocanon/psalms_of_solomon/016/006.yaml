  yaml_path: translation/deuterocanon/psalms_of_solomon/016/006.yaml
  text: Do not withdraw your mercy from me[a], O God[c][b], nor the remembrance of you from my heart until death.
translation:
  language: de
  text: Entziehe mir deine Barmherzigkeit nicht, Gott, auch nicht die Erinnerung an dich aus meinem Herzen bis zum Tod.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „auch nicht die Erinnerung über dich aus [dem] Herzen bis zum Tod“. Im Griechischen gilt das eine Verb „entziehe“ für beide Satzglieder.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποστήσῃς
  choice: entziehe
  rationale: Das Verb bezeichnet hier, dass Gott etwas vom Beter weichen lässt bzw. wegnimmt. „Entziehe“ ist im Gebetskontext natürlich und kann durch die Ellipse beide Objekte regieren.
- source_word: ἔλεός
  choice: Barmherzigkeit
  rationale: ἔλεος bezeichnet Barmherzigkeit oder Erbarmen. „Barmherzigkeit“ ist direkt, würdig und in deutscher Gebetssprache gut verständlich.
- source_word: μνήμην περὶ σοῦ
  choice: die Erinnerung an dich
  rationale: μνήμη bezeichnet Erinnerung oder Gedenken; περὶ σοῦ richtet diese auf Gott. „Erinnerung an dich“ gibt die Wendung natürlich wieder, ohne sie als bloßes Wissen oder als aktive liturgische Handlung festzulegen.
- source_word: καρδίας
  choice: Herzen
  rationale: „Herz“ bewahrt das biblische Bild für das innere Leben, Denken und Wollen.
- source_word: ἕως θανάτου
  choice: bis zum Tod
  rationale: Die Formulierung gibt die zeitliche Grenze des griechischen Ausdrucks eng und idiomatisch wieder.
theological_decisions:
- issue: Beziehung zwischen Gottes Barmherzigkeit und der Erinnerung an Gott
  choice: Ein einziges Verb („entziehe“) regiert beide Satzglieder.
  alternative: Im zweiten Satzglied ein weiteres Verb ergänzen, etwa „nimm … nicht weg“.
  rationale: Im Griechischen regiert ἀποστήσῃς beide Objekte, die durch μηδέ verbunden sind. Die Ellipse erhält die enge Parallelstruktur und lässt offen, wie Gottes Handeln und das innere Gedenken des Beters genau zusammenwirken.
translation_notes:
  register: Moderne, würdige Gebetssprache. Die Anrede „Gott“ bleibt ohne hinzugefügten Artikel. Die etwas markante Ellipse im zweiten Satzglied folgt der griechischen Parallelstruktur; die Fußnote erläutert sie.
