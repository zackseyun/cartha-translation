  yaml_path: translation/deuterocanon/psalms_of_solomon/016/005.yaml
  text: I will give thanks to you[a], O God, because you took hold of me for salvation[d][c][b], and you did not count me with sinners for destruction.
translation:
  language: de
  text: Ich will dir danken, Gott, denn du hast mir zur Rettung geholfen[a] und mich nicht mit den Sündern dem Verderben zugerechnet[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „du hast dich meiner zur Rettung angenommen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „und hast mich nicht zusammen mit den Sündern zum Verderben gerechnet“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξομολογήσομαί
  choice: Ich will dir danken
  rationale: Im Gebetskontext bezeichnet das Verb dankendes Gotteslob. Die futurische Form wird als entschlossene Ankündigung wiedergegeben.
- source_word: ἀντελάβου μου
  choice: du hast mir … geholfen
  rationale: ἀντιλαμβάνομαι mit Genitiv bedeutet hier, jemandem beizustehen oder zu helfen. Die Wiedergabe bewahrt zudem den Zusammenhang mit dem Motiv des Helfers in den vorangehenden Versen.
- source_word: εἰς σωτηρίαν
  choice: zur Rettung
  rationale: Die Formulierung hält die Ziel- beziehungsweise Ergebnisrichtung von εἰς fest, ohne zwischen zeitlicher und endgültiger Rettung festzulegen.
- source_word: ἐλογίσω με
  choice: hast mich … zugerechnet
  rationale: λογίζομαι hat hier einen einordnenden beziehungsweise wertenden Sinn. „Zurechnen“ klingt im Deutschen natürlich und bewahrt diesen Aspekt.
- source_word: μετὰ τῶν ἁμαρτωλῶν
  choice: mit den Sündern
  rationale: Der bestimmte Artikel wird beibehalten, da „die Sünder“ im Buch eine erkennbare Gruppe bezeichnen kann und nicht zwingend nur allgemein sündige Menschen meint.
- source_word: εἰς ἀπώλειαν
  choice: dem Verderben
  rationale: „Verderben“ gibt ἀπώλεια als schwerwiegendes, endgültiges Unheil wieder. Die deutsche Satzfügung verbindet das gemeinsame Geschick der Sünder idiomatisch mit dem Verb „zurechnen“.
theological_decisions:
- issue: Bestimmtheit von τῶν ἁμαρτωλῶν
  choice: den Sündern
  alternative: Sündern
  rationale: Der griechische Artikel bleibt sichtbar. So wird nicht ausgeschlossen, dass eine bestimmte, im Werk bekannte Gegengruppe gemeint ist.
- issue: Bedeutungsweite von σωτηρία
  choice: Rettung
  alternative: Heil
  rationale: „Rettung“ wahrt sowohl konkrete Bewahrung als auch eine weitergehende religiöse Bedeutung, ohne die Aussage auf eine bestimmte Heilslehre festzulegen.
translation_notes:
  register: Modernes, würdevolles Gebetsdeutsch. Die Anrede „Gott“ entspricht dem griechischen Vokativ, und der bestimmte Ausdruck „den Sündern“ bleibt wegen seiner möglichen gruppenspezifischen Bedeutung erhalten.
