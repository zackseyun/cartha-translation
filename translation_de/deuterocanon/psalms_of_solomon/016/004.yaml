  text: He prodded me like a horse’s goad He prodded me like a horse’s goad to watchfulness for Him; my Savior and my helper saved me at all times.
translation:
  language: de
  text: Er stachelte mich an wie mit dem Treibstachel eines Pferdes, um mich wach zu halten;[a] mein Retter und mein Helfer rettete mich zu jeder Zeit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „zu seinem Wachsein“ oder „zu seiner Wachsamkeit“. Der Bezug von „seinem“ ist im Griechischen nicht eindeutig; die Formulierung im Haupttext gibt den Sinn idiomatisch wieder, ohne diesen Bezug festlegen zu wollen.'
    reason: Bewahrt die referenzielle Mehrdeutigkeit von αὐτοῦ und erläutert, dass die deutsche Umformung keine theologische oder personelle Zuordnung entscheidet.
lexical_decisions:
- source_word: ἔνυξέν
  choice: stachelte … an
  rationale: Das Verb bezeichnet ein Stechen oder Antreiben. Die deutsche Wendung gibt zusammen mit dem folgenden Vergleich sowohl das Bild des Treibstachels als auch dessen antreibende Wirkung wieder.
- source_word: κέντρον ἵππου
  choice: der Treibstachel eines Pferdes
  rationale: κέντρον ist hier ein spitzer Stachel zum Antreiben; der Genitiv ἵππου bezeichnet das Pferd, auf das er angewandt wird.
- source_word: ἐγρήγορσιν
  choice: wach blieb
  rationale: Das seltene Substantiv bezeichnet Wachsein oder Wachsamkeit. Die verbale Formulierung ist in modernem Deutsch natürlich und wahrt den Sinn.
- source_word: ἀντιλήμπτωρ
  choice: Helfer
  rationale: Das Wort bezeichnet jemanden, der sich eines Menschen annimmt und ihm beisteht; „Helfer“ ist verständlich und im Kontext passend.
- source_word: ἐν παντὶ καιρῷ
  choice: zu jeder Zeit
  rationale: Die Wendung bedeutet wörtlich „zu jeder Zeit“ und betont den beständigen Beistand.
theological_decisions:
- issue: Bezug des Possessivpronomens αὐτοῦ in ἐπὶ τὴν ἐγρήγορσιν αὐτοῦ
  choice: 'Im Haupttext nicht ausdrücklich zugeordnet: „damit ich wach blieb“'
  alternative: „zu seiner Wachsamkeit“ oder „damit ich für ihn wachsam war“
  rationale: Das griechische αὐτοῦ ist grammatisch mehrdeutig und kann sich auf Gott oder möglicherweise auf das Pferd beziehungsweise den Vergleich beziehen; eine explizite Wiedergabe als „für ihn“ würde den theologischen Bezug stärker festlegen, als der Ausgangstext erlaubt. Die Fußnote dokumentiert die Form.
- issue: Subjekt von ἔνυξέν
  choice: „Er“
  alternative: Ein unbestimmtes oder zuvor genanntes Subjekt
  rationale: Die Verbform enthält ein männliches Subjekt in der dritten Person Singular, das aus dem Kontext erschlossen werden muss. Die Großschreibung am Satzanfang vermeidet eine zusätzliche ausdrückliche Identifikation.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das konkrete Bild des Antreibens durch einen Treibstachel bleibt erhalten; schwer verständliche griechische Nominalwendungen werden behutsam verbalisiert.
