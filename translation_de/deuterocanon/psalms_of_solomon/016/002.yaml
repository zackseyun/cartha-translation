  yaml_path: translation/deuterocanon/psalms_of_solomon/016/002.yaml
  text: When I was far from God[a], my soul was almost poured out to death[c][b], near the gates of Hades with a sinner.
translation:
  language: de
  text: Als ich fern von Gott war[a], wurde meine Seele[b] beinahe in den Tod ausgegossen, ganz nahe bei den Toren des Hades[c], zusammen mit einem Sünder[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Eröffnung ist verkürzt und syntaktisch ungewöhnlich; auch möglich: „Während ich fern von Gott war“.'
    reason: source_ambiguity
  - marker: b
    text: 'Oder: „mein Leben“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „des Totenreichs“ beziehungsweise „des Grabes“. Im Griechischen steht „Hades“.'
    reason: lexical_alternative
  - marker: d
    text: 'Oder generisch: „zusammen mit dem Sünder“.'
    reason: source_ambiguity
lexical_decisions:
- source_word: τῷ μακρὰν ἀπὸ θεοῦ
  choice: Als ich fern von Gott war
  rationale: Die griechische Eröffnung ist stark verkürzt und syntaktisch ungewöhnlich. Im Zusammenhang lässt sie sich am ehesten als zeitliche oder begleitende Angabe verstehen. Die deutsche Fassung gibt diesen Sinn klar wieder, ohne die bestehende syntaktische Unsicherheit zu verschweigen.
- source_word: παρʼ ὀλίγον
  choice: beinahe
  rationale: Die feste Wendung bedeutet hier „beinahe“ oder „fast“. „Beinahe“ passt natürlich zum folgenden Bild unmittelbarer Todesnähe.
- source_word: ἐξεχύθη ἡ ψυχή μου εἰς θάνατον
  choice: wurde meine Seele beinahe in den Tod ausgegossen
  rationale: Die passive Form und das anschauliche Bild des Ausgießens bleiben erhalten. „Seele“ gibt ψυχή formal wieder; im Kontext ist zugleich „Leben“ möglich und wird deshalb in der Fußnote genannt.
- source_word: σύνεγγυς πυλῶν ᾅδου
  choice: ganz nahe bei den Toren des Hades
  rationale: σύνεγγυς bezeichnet unmittelbare Nähe. „Hades“ bewahrt den ausdrücklich verwendeten griechischen Begriff und das räumliche Bild der Tore, statt ihn vorschnell auf „Grab“ oder „Tod“ einzuengen.
- source_word: μετὰ ἁμαρτωλοῦ
  choice: zusammen mit einem Sünder
  rationale: Der griechische Singular steht ohne Artikel. „Mit einem Sünder“ bildet dies im Deutschen am unmittelbarsten ab; eine generische Deutung als „mit dem Sünder“ bleibt möglich und wird in der Fußnote festgehalten.
theological_decisions:
- issue: Wiedergabe von ᾅδης
  choice: Hades
  alternative: Totenreich; Grab
  rationale: Der Ausgangstext nennt ausdrücklich den Hades. Die Transliteration bewahrt die Bildwelt und vermeidet eine dogmatische Verengung auf Grab, Hölle oder einen genauer bestimmten Zustand nach dem Tod.
- issue: Wiedergabe von ψυχή
  choice: Seele
  alternative: Leben
  rationale: ψυχή kann sowohl die Seele beziehungsweise das Selbst als auch das Leben bezeichnen. „Seele“ wahrt die Formulierung des Gebets und das Ausgießungsbild; „Leben“ wird als echte lexikalische Möglichkeit in der Fußnote erhalten.
- issue: Referenz von ἁμαρτωλοῦ
  choice: einem Sünder
  alternative: dem Sünder
  rationale: Der artikellose griechische Singular legt im Deutschen zunächst den unbestimmten Artikel nahe. Da ein generischer Singular, möglicherweise unter semitischem Einfluss, ebenfalls denkbar ist, wird „dem Sünder“ nicht ausgeschlossen, sondern als Alternative vermerkt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das ungewöhnliche Bild „in den Tod ausgegossen“ wurde bewusst bewahrt. „Ganz nahe bei“ ist idiomatisch und gibt die verstärkte Nähe von σύνεγγυς wieder; die Fußnoten sichern die wesentlichen lexikalischen und syntaktischen Alternativen.
