  source_fidelity: 'Die Hauptübersetzung gibt die als Semitismus beziehungsweise idiomatische Bitte zu verstehende Verbindung ἐπικράτησόν μου ... ἀπό treffend als Bitte um Bewahrung bzw. Zurückhaltung wieder. Die Wiederholung von πονηρᾶς, der umfassende Sinn von πάσης und das Bild von σκανδαλίζουσα sind erhalten. Für ἄφρονα ist „Unverständigen“ jedoch weniger präzise: Es bezeichnet primär jemanden, der etwas nicht versteht, während ἄφρων einen törichten bzw. unweisen Menschen meint.'
  naturalness: Der Satz ist würdevoll und gut verständlich. „Halte mich zurück“ ist hier natürlich. „Einen törichten Mann“ ist im heutigen Standarddeutsch unmittelbarer und semantisch klarer als die substantivierte Form „einen Unverständigen“. Die bisherige Fußnote ist syntaktisch holprig, weil „Übe Macht über mich aus ... weg von“ keine idiomatische deutsche Alternative bildet.
  terminology: „Böse Sünde“ und „böse Frau“ geben πονηρά konsistent wieder. Die maskuline Form bei „Mann“ bewahrt die grammatische Form von ἄφρονα, ohne eine über den Text hinausgehende Aussage zu treffen. Die Fußnote soll die Grundbedeutung von ἐπικρατέω nennen, aber die deutsche Wiedergabe nicht fälschlich als wörtlich und zugleich ungrammatisch präsentieren.
