    rationale: ἄφρων bedeutet „töricht, unverständig“ im Sinn von ohne Einsicht oder Weisheit. Das heutige deutsche Substantiv „Unverständiger“ legt eher eine Person nahe, die etwas nicht versteht. „Törichter Mann“ trifft die Aussage klarer.
