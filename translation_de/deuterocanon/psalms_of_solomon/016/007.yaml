  yaml_path: translation/deuterocanon/psalms_of_solomon/016/007.yaml
  text: Restrain me[a], O God, from evil sin and from every evil woman who causes a foolish man to stumble.
translation:
  language: de
  text: Halte mich zurück[a], o Gott, von böser Sünde und von jeder bösen Frau, die einen törichten Mann zu Fall bringt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Nimm mich, o Gott, in deine Gewalt und halte mich fern von …«'
    reason: ἐπικρατέω bezeichnet ursprünglich Machtausübung, Herrschaft oder Überlegenheit. In Verbindung mit ἀπό liegt hier idiomatisch die Bitte nahe, der Beter möge von dem Folgenden ferngehalten werden.
lexical_decisions:
- source_word: ἐπικράτησόν μου
  choice: Halte mich zurück
  rationale: Das Verb bezeichnet Machtausübung oder Beherrschung. Zusammen mit ἀπό ergibt sich hier die Bitte, Gott möge den Beter von dem Folgenden zurückhalten. Diese idiomatische Wiedergabe bewahrt den Sinn der Bitte; die wörtlichere Möglichkeit wird in der Fußnote genannt.
- source_word: ἀπὸ ἁμαρτίας πονηρᾶς
  choice: von böser Sünde
  rationale: ἀπό bezeichnet die Trennung beziehungsweise das Fernhalten; πονηρά kennzeichnet die Sünde ausdrücklich als moralisch böse.
- source_word: καὶ ἀπὸ πάσης γυναικὸς πονηρᾶς
  choice: und von jeder bösen Frau
  rationale: πάσης mit dem Singular hat umfassenden Sinn. Die Wiederholung von πονηρά wird durch die erneute Verwendung von „böse“ sichtbar gehalten.
- source_word: σκανδαλιζούσης
  choice: die ... zu Fall bringt
  rationale: Das Partizip greift das Bild des Anstoßens und Fallens auf. „Zu Fall bringen“ ist im modernen Deutsch natürlich und kann sowohl den bildlichen als auch den moralischen Sinn tragen.
- source_word: ἄφρονα
  choice: einen Unverständigen
  rationale: ἄφρων bezeichnet einen Menschen ohne Einsicht oder Weisheit. Die substantivierte maskuline Form „einen Unverständigen“ wahrt die grammatische Gestalt und vermeidet die im Deutschen potenziell missverständliche Formulierung „einen törichten Mann“.
theological_decisions:
- issue: Art der göttlichen Bewahrung
  choice: Bitte um Zurückhaltung des Beters
  alternative: Bitte, Gott möge über den Beter herrschen oder die Herrschaft über ihn übernehmen
  rationale: Die Verbindung ἐπικράτησόν μου ... ἀπό legt im Kontext eine Bitte um bewahrende Kontrolle nahe. Da das Verb für sich auch Herrschaft oder Übermacht ausdrücken kann, bleibt die wörtlichere Deutung in einer Fußnote erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Anrede „o Gott“ bewahrt den feierlichen Gebetston. Die syntaktische Parallelität der beiden mit ἀπό eingeleiteten Glieder sowie die Wiederholung von πονηρά werden erhalten.
