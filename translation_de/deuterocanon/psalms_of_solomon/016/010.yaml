base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/016/010.yaml
  text: Clothe my tongue and my lips with words of truth[c][b][a]; keep anger and senseless wrath far from me.
translation:
  language: de
  text: Bekleide meine Zunge und meine Lippen mit Worten der Wahrheit; halte Zorn und unvernünftige Wut fern von mir.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: περίστειλον
  choice: Bekleide
  rationale: Der Imperativ kann das Umhüllen oder Bekleiden bezeichnen. „Bekleide“ bewahrt das konkrete poetische Bild und lässt zugleich offen, wie die wahrhaftigen Worte das Reden bestimmen.
- source_word: τὴν γλῶσσάν μου καὶ τὰ χείλη μου
  choice: meine Zunge und meine Lippen
  rationale: Die direkte Wiedergabe erhält das körperliche Bild und den poetischen Parallelismus; „Rede“ oder „Mund“ würden ihn einebnen.
- source_word: ἐν λόγοις ἀληθείας
  choice: mit Worten der Wahrheit
  rationale: Die Formulierung erhält den Plural λόγοις und die Genitivverbindung mit ἀληθείας in würdigem, verständlichem Deutsch.
- source_word: ὀργὴν
  choice: Zorn
  rationale: „Zorn“ ist eine natürliche Entsprechung und ermöglicht, den zweiten, verwandten Affektbegriff unterscheidbar wiederzugeben.
- source_word: θυμὸν ἄλογον
  choice: unvernünftige Wut
  rationale: „Wut“ gibt θυμός als heftige Gemütsbewegung wieder; „unvernünftig“ bewahrt die Grundbedeutung von ἄλογος, ohne sie psychologisch oder theologisch zu verengen.
- source_word: μακρὰν ποίησον ἀπʼ ἐμοῦ
  choice: halte ... fern von mir
  rationale: Dies ist eine natürliche deutsche Wiedergabe des griechischen Idioms und erhält den Charakter einer Bitte an Gott.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Gebetsdeutsch mit bewahrter Körper- und Bekleidungsmetaphorik. Die beiden verwandten Affektbegriffe werden als „Zorn“ und „Wut“ unterschieden; der griechische Text enthält keine ausdrücklich zu markierende textkritische oder theologische Alternative.
