  yaml_path: translation/deuterocanon/psalms_of_solomon/016/001.yaml
  text: When my soul was departing from the Lord[c][b][a], I almost slipped in the descent of sleep.
translation:
  language: de
  text: Als meine Seele fern vom Herrn schläfrig wurde[a], wäre ich beinahe in die Tiefe des Schlafes abgeglitten.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die hier zugrunde gelegte Lesart von Swetes Drucktext ist νυστάξαι („schläfrig werden, einnicken“). In der übermittelten elektronischen Transkription steht συστάξαι, was offenbar auf einem Erfassungsfehler beruht.
    reason: textual_variant
  - marker: b
    text: 'Oder: „in die Benommenheit des Schlafes“. Das griechische Wort kann sowohl das Hinabsinken als auch tiefe Schläfrigkeit oder Schlafbenommenheit bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν τῷ νυστάξαι
  choice: Als … schläfrig wurde
  rationale: Die Konstruktion ἐν τῷ mit Aoristinfinitiv bezeichnet hier den Zeitpunkt. Swetes Drucktext liest νυστάξαι („schläfrig werden, einnicken“), was auch zum anschließenden ὕπνου passt.
- source_word: ψυχήν μου
  choice: meine Seele
  rationale: ψυχή bezeichnet hier das innere Selbst; „Seele“ bewahrt den poetisch-religiösen Klang.
- source_word: ἀπὸ Κυρίου
  choice: fern vom Herrn
  rationale: ἀπό drückt Trennung oder Entfernung aus. „Fern vom Herrn“ lässt offen, ob räumlich-bildliche oder geistliche Distanz gemeint ist.
- source_word: παρὰ μικρόν
  choice: beinahe
  rationale: Die feste Wendung bedeutet idiomatisch „beinahe“.
- source_word: ὠλίσθησα
  choice: wäre ich … abgeglitten
  rationale: Das Verb bezeichnet ein Ausgleiten. Die deutsche Form gibt zusammen mit παρὰ μικρόν den beinahe eingetretenen Vorgang natürlich wieder.
- source_word: ἐν καταφορᾷ ὕπνου
  choice: in die Tiefe des Schlafes
  rationale: καταφορά kann das Herabsinken, tiefe Schläfrigkeit oder einen Schlafstupor bezeichnen. „Tiefe des Schlafes“ bewahrt das Bild des Sinkens und verbindet sich natürlich mit „abgeglitten“.
- source_word: Κυρίου
  choice: dem Herrn
  rationale: κύριος wird in diesem religiösen Zusammenhang traditionsgemäß und verständlich mit „Herr“ wiedergegeben.
theological_decisions:
- issue: Bedeutung von ἀπὸ Κυρίου
  choice: 'relationale Entfernung: „fern vom Herrn“'
  alternative: 'bloße Herkunft: „vom Herrn her“'
  rationale: Der Trennungssinn von ἀπό passt syntaktisch und inhaltlich besser, ohne festzulegen, worin die Entfernung vom Herrn genau besteht.
- issue: Verhältnis von geistlicher Distanz und körperlicher Schläfrigkeit
  choice: 'Die Spannung bleibt erhalten: Die Seele wird fern vom Herrn schläfrig.'
  alternative: Die Schläfrigkeit ausdrücklich als geistlichen Abfall erklären.
  rationale: Der Vers verbindet beide Vorstellungen, deutet ihr Verhältnis aber nicht ausdrücklich aus; die Übersetzung fügt daher keine konfessionelle oder psychologische Erklärung hinzu.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit poetischem Bildgehalt. „Fern vom Herrn“ und „Tiefe des Schlafes“ bleiben allgemein verständlich, ohne die geistliche Spannung des Verses auszudeuten.
