review_pass:
  verdict: revise
  source_fidelity: Der vorgelegte griechische Quellentext lautet συστάξαι; die deutsche Fassung übersetzt jedoch νυστάξαι. Die Fußnote behauptet zudem, Swetes Drucktext lese νυστάξαι, obwohl die im Auftrag bereitgestellte, als „swete_direct“ validierte Quellenangabe ausdrücklich συστάξαι bietet. Eine solche unbelegte Emendation darf nicht als Textbefund ausgegeben werden. Inhaltlich ist die Schlafform zwar durch den englischen Audit-Trail und den Schlafkontext motiviert, sie ist aber gegenüber dem vorgelegten Quellentext nicht abgesichert.
  naturalness: '„Als meine Seele fern vom Herrn schläfrig wurde“ ist verständlich, aber mit „wäre ich beinahe“ unnötig hypothetisch: παρὰ μικρόν ὠλίσθησα bezeichnet einen tatsächlich nur beinahe erfolgten Vorgang. „Beinahe wäre ich … abgeglitten“ ist im Deutschen idiomatischer.'
  terminology: „Herr“ für Κύριος und „Seele“ für ψυχή sind angemessen. „Fern vom Herrn“ kann die Trennung durch ἀπό natürlich wiedergeben. Da die überlieferte Lesart im bereitgestellten Text jedoch unsicher bzw. nicht sinnvoll mit der vorhandenen Schlafform gleichzusetzen ist, muss die Übersetzung die Textunsicherheit offen kennzeichnen, statt eine abweichende Lesart Swete zuzuschreiben.
  issues:
  - severity: high
    issue: Nicht ausgewiesene Abweichung von συστάξαι zu νυστάξαι
    rationale: Der Entwurf übersetzt „schläfrig wurde“ und setzt in den lexikalischen Entscheidungen νυστάξαι voraus, während der bereitgestellte griechische Text συστάξαι hat.
  - severity: high
    issue: Irreführende textkritische Fußnote
    rationale: Die Behauptung, Swetes Drucktext lese νυστάξαι und die bereitgestellte Transkription sei fehlerhaft, widerspricht den als direkt validiert angegebenen Quelldaten. Ohne überprüfbaren abweichenden Druckbefund darf dies nicht behauptet werden.
  - severity: medium
    issue: Unpassender Konjunktiv „wäre ich beinahe“
    rationale: Die griechische Wendung bedeutet „ich wäre beinahe/fast ausgeglitten“ im Sinn eines knapp vermiedenen Geschehens; im Deutschen ist die Voranstellung von „beinahe“ mit Indikativ oder „beinahe wäre ich“ vorzuziehen.
  revised_text: Als meine Seele sich vom Herrn abwandte[a], glitt ich beinahe in den Schlafsog ab.[b]
  revised_footnotes:
  - marker: a
    text: Der bereitgestellte griechische Text hat συστάξαι. Die genaue Bedeutung dieser Lesart ist unsicher; die Übersetzung gibt vorsichtig einen Trennungssinn im Zusammenhang mit „vom Herrn“ wieder. Eine Lesart νυστάξαι („schläfrig werden, einnicken“) ist in den vorliegenden Quelldaten nicht belegt.
    reason: textual_variant
  - marker: b
    text: 'Oder: „in die Benommenheit des Schlafes“. Das griechische Wort kann sowohl ein Hinabsinken als auch tiefe Schläfrigkeit oder Schlafbenommenheit bezeichnen.'
    reason: lexical_alternative
  revision_rationale: Die Revision richtet sich nach dem tatsächlich bereitgestellten griechischen Wortlaut und entfernt die nicht belegte Zuschreibung einer abweichenden Lesart an Swete. Weil συστάξαι hier textlich bzw. lexikalisch problematisch ist, wird die Unsicherheit ausdrücklich in einer Fußnote markiert, ohne eine konfessionelle Deutung hinzuzufügen. Die zweite Vershälfte wird zugleich in natürliches modernes Deutsch gebracht und bewahrt das Bild des Abgleitens und Hinabsinkens.
