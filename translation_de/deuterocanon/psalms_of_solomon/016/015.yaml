  text: When the righteous one endures in these things[b][a], he will be shown mercy by the Lord.
translation:
  language: de
  text: Wenn der Gerechte in diesen Dingen standhält[a], wird ihm vom Herrn Erbarmen erwiesen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Indem der Gerechte in diesen Dingen standhält, wird ihm vom Herrn Erbarmen erwiesen.“ Auch möglich: „Durch sein Standhalten in diesen Dingen wird ihm vom Herrn Erbarmen erwiesen.“'
    reason: Die Konstruktion ἐν τῷ mit Infinitiv kann temporal oder modal-instrumental verstanden werden.
  - marker: b
    text: 'Auch möglich: „wird er vom Herrn Erbarmen erfahren“.'
    reason: Diese alternative deutsche Formulierung gibt die künftige Erweisung von Erbarmen wieder; der Haupttext bewahrt den passiven Charakter des Griechischen besonders deutlich.
lexical_decisions:
- source_word: ἐν τῷ ὑπομεῖναι
  choice: Wenn ... standhält
  rationale: Die Verbindung ἐν mit dem substantivierten Infinitiv kann temporal oder modal-instrumental verstanden werden. Die temporale Wiedergabe ist im Zusammenhang natürlich und bewahrt die Aussage, dass das Standhalten der Erweisung des Erbarmens vorausgeht.
- source_word: δίκαιον
  choice: der Gerechte
  rationale: Der Akkusativ ist als Subjekt des Infinitivs zu verstehen. „Der Gerechte“ gibt die substantivierte maskuline Singularform knapp und traditionsnah wieder, ohne sie auf eine bestimmte Einzelperson festzulegen.
- source_word: ἐν τούτοις
  choice: in diesen Dingen
  rationale: Die wörtlich-nahe Formulierung hält den Rückverweis auf die zuvor genannten Bedrängnisse offen und fügt keine nähere Bestimmung hinzu.
- source_word: ἐλεηθήσεται
  choice: wird ihm ... Erbarmen erwiesen
  rationale: Diese Formulierung bewahrt das Futur und den passiven Charakter des griechischen Verbs sowie dessen Bedeutung von Erbarmen statt bloßem Mitleid.
- source_word: ὑπὸ Κυρίου
  choice: vom Herrn
  rationale: ὑπό mit Genitiv bezeichnet beim Passiv den Handelnden. „Vom Herrn“ ist dafür im Deutschen die natürliche Form.
theological_decisions:
- issue: Wiedergabe von κύριος
  choice: Herr
  alternative: Gebieter
  rationale: Im Gebets- und Frömmigkeitskontext bezeichnet κύριος Gott. „Herr“ ist die sachlich und sprachlich angemessene Standardwiedergabe.
- issue: Verhältnis von Standhalten und Erbarmen
  choice: 'temporale Formulierung: „Wenn ... standhält“'
  alternative: 'modal-instrumental: „Indem ... standhält“ oder „Durch das Standhalten“'
  rationale: Die griechische Konstruktion lässt sowohl eine temporale als auch eine modal-instrumentale Nuance zu. Der Haupttext entscheidet sich aus Kontextgründen für die temporale Lesart; die Fußnote bewahrt die andere Möglichkeit, ohne daraus eine bestimmte Heilslehre abzuleiten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Standhalten“ ist verständlich und gibt ὑπομένω im Kontext von Prüfungen treffend wieder. Die knappe Wendung „der Gerechte“ bewahrt die repräsentative männliche Singularform des Griechischen.
