  text: For if you do not strengthen[b][a], who will endure discipline in poverty?
translation:
  language: de
  text: Denn wenn du nicht stärkst,[a] wer wird in Armut Erziehung[b] ertragen?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Griechischen bleibt unausgesprochen, wen du stärkst.
    reason: cultural_note
  - marker: b
    text: 'Oder: „Unterweisung“ oder „Zucht“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνισχύσῃς
  choice: stärkst
  rationale: Das Verb bezeichnet das Verleihen oder Gewähren von Kraft. Die objektlose Formulierung „du stärkst“ bewahrt, dass im Griechischen nicht ausdrücklich gesagt wird, wen Gott stärkt.
- source_word: ὑφέξεται
  choice: wird … ertragen
  rationale: Das Futur bezeichnet hier das Aushalten einer belastenden Erfahrung; „ertragen“ gibt die rhetorische Frage natürlich und präzise wieder.
- source_word: παιδείαν
  choice: Erziehung
  rationale: παιδεία umfasst Erziehung, Unterweisung und formende Zucht. „Erziehung“ hält den formenden Sinn offen, ohne den Ausdruck einseitig auf Strafe oder bloße Belehrung festzulegen.
- source_word: ἐν πενίᾳ
  choice: in Armut
  rationale: πενία bezeichnet Armut oder Mangel. „in Armut“ gibt den klaren sozioökonomischen Sinn knapp und unmittelbar wieder.
theological_decisions:
- issue: Nicht genanntes Objekt von ἐνισχύσῃς
  choice: „wenn nicht du stärkst“ ohne ergänztes Objekt
  alternative: „wenn du uns/ihn nicht stärkst“
  rationale: Der griechische Text lässt das Objekt unausgesprochen. Eine Ergänzung würde die Aussage unnötig auf eine bestimmte Person oder Gruppe festlegen.
- issue: Bedeutungsbreite von παιδεία
  choice: „Erziehung“ im Haupttext mit Alternative in der Fußnote
  alternative: „Zucht“ oder „Unterweisung“
  rationale: Der Kontext verbindet Not mit einer formenden Erfahrung, entscheidet aber nicht eindeutig zwischen Unterweisung, Erziehung und Zucht. Die Übersetzung soll diese Spannung nicht konfessionell oder dogmatisch verengen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung hebt wie der griechische Text das „du“ hervor; die knappe rhetorische Frage und die genuine Unbestimmtheit des Verbs bleiben erhalten.
