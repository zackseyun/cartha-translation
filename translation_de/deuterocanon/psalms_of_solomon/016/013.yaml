  source_fidelity: 'Der Entwurf gibt die Satzstruktur und die zentralen Begriffe zutreffend wieder: ἐνισχύσῃς bleibt objektlos, ὑφέξεται ist angemessen mit „ertragen“ wiedergegeben, und ἐν πενίᾳ wird als „in Armut“ erhalten. Die Voranstellung von σὺ verlangt keine künstliche deutsche Wortstellung; das ausdrücklich gesetzte „du“ genügt.'
