base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/016/012.yaml
  text: But establish my soul with favor and gladness[a]; when you strengthen my soul[b], what has been given will be enough for me.
translation:
  language: de
  text: Doch festige meine Seele mit Wohlwollen und Fröhlichkeit[a]; wenn du meine Seele stärkst, wird mir genügen, was gegeben ist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit Wohlgefallen und Fröhlichkeit“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐδοκία
  choice: Wohlwollen
  rationale: Das Substantiv bezeichnet hier eine wohlwollende, gnädige Haltung. „Wohlwollen“ bewahrt die personale Bedeutung, ohne einen technischen theologischen Sinn festzulegen.
- source_word: ἱλαρότητος
  choice: Fröhlichkeit
  rationale: Das Wort bezeichnet heitere, freudige Gestimmtheit. „Fröhlichkeit“ ist gegenwärtiges Standarddeutsch und gibt den Aspekt heiterer Freude wieder.
- source_word: στήρισον
  choice: festige
  rationale: Der Imperativ bedeutet, fest oder beständig zu machen. „Festige“ bewahrt diesen stabilisierenden Sinn und unterscheidet sich vom folgenden ἐνισχύω.
- source_word: ψυχήν
  choice: Seele
  rationale: Im Gebetskontext bezeichnet ψυχή den inneren Menschen. „Seele“ erhält den würdevollen, geistlichen Ton und entspricht der Wiederholung im Griechischen.
- source_word: ἐν τῷ ἐνισχῦσαί σε
  choice: wenn du … stärkst
  rationale: Die Konstruktion mit ἐν und substantiviertem Infinitiv kann temporal beziehungsweise umstandsbezogen verstanden werden. „Wenn du … stärkst“ ist natürlich und wahrt diese Beziehung.
- source_word: ἀρκέσει μοι
  choice: wird mir genügen
  rationale: Das Futur bezeichnet ausreichende Genüge. Die Formulierung ist idiomatisch, prägnant und wahrt den Zukunftsbezug.
- source_word: τὸ δοθέν
  choice: was gegeben ist
  rationale: Das substantivierte Partizip bleibt hinsichtlich Geber und Gegenstand offen. „Was gegeben ist“ bewahrt diese absichtliche Unbestimmtheit, ohne „Gabe“ hinzuzufügen.
theological_decisions:
- issue: Bezug und Herkunft des Gegebenen
  choice: „was gegeben ist“ bleibt ohne ausdrücklich genannten Geber oder näher bestimmten Gegenstand
  alternative: „deine Gabe“ oder „was du gegeben hast“
  rationale: Das griechische Passiv τὸ δοθέν nennt weder den Geber noch die Art des Gegebenen. Eine ausdrückliche Zuschreibung an Gott wäre im Gebetszusammenhang plausibel, würde den Wortlaut jedoch auslegen und seine Offenheit verringern.
translation_notes:
  register: Modernes, würdiges Gebetsdeutsch. Die Wiederholung von „meine Seele“ wird entsprechend dem griechischen Text beibehalten; „festige“ und „stärkst“ bilden die Unterscheidung zwischen στηρίζω und ἐνισχύω ab.
