  yaml_path: translation/deuterocanon/psalms_of_solomon/016/008.yaml
  text: And do not let the beauty of a lawless woman deceive me[a], nor that of anything laid before me by worthless sin.
translation:
  language: de
  text: Und möge die Schönheit einer gesetzlosen Frau mich nicht täuschen, auch nicht die Schönheit von allem, was mir aus unnützer Sünde vor Augen gestellt wird.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Wortlaut ist stark verdichtet. ὑποκειμένου kann etwa „was vorliegt“ oder „was dargeboten wird“ bedeuten; auch die Zuordnung von „aus unnützer Sünde“ ist unsicher. Möglich ist auch: „und nichts, was aus unnützer Sünde hervorgeht“.'
    reason: Die Anmerkung kennzeichnet die mehrdeutige Syntax und Semantik des zweiten Satzteils, während die Übersetzung die plausible Abhängigkeit von „Schönheit“ beibehält.
lexical_decisions:
- source_word: μὴ ἀπατησάτω με
  choice: soll mich nicht täuschen
  rationale: Die verneinte Imperativ- bzw. Jussivform wird im Deutschen natürlich mit „soll mich nicht“ wiedergegeben; „täuschen“ entspricht der Grundbedeutung von ἀπατάω, ohne die Versuchung ausdrücklich als Verführung auszudeuten.
- source_word: κάλλος γυναικὸς παρανόμου
  choice: die Schönheit einer gesetzlosen Frau
  rationale: κάλλος bezeichnet Schönheit; „gesetzlos“ bewahrt bei παράνομος das moralisch-religiöse Gewicht und schwächt es nicht zu bloßer gesellschaftlicher Ungehörigkeit ab.
- source_word: καὶ παντὸς ὑποκειμένου
  choice: ebenso wenig die Schönheit von allem, was mir … vor Augen gestellt wird
  rationale: παντός und ὑποκειμένου stehen im Genitiv und lassen sich am ehesten weiterhin von κάλλος abhängig verstehen. Die Wiederholung von „die Schönheit“ macht diese verdichtete Struktur im Deutschen verständlich. „Vor Augen gestellt“ gibt die mögliche Bedeutung von ὑπόκειμαι als etwas Vorliegendes oder Dargebotenes idiomatisch wieder.
- source_word: ἀπὸ ἁμαρτίας ἀνωφελοῦς
  choice: durch unnütze Sünde
  rationale: ἀπό wird als Herkunft bzw. vermittelnde Ursache verstanden. „Unnütz“ gibt ἀνωφελής eng als nutzlos oder ohne Gewinn wieder und bewahrt die auffällige Formulierung des Griechischen.
theological_decisions:
- issue: Bezug des zweiten Genitivausdrucks auf κάλλος
  choice: κάλλος wird sinngemäß vor παντὸς ὑποκειμένου wiederholt
  alternative: 'Der zweite Ausdruck kann als eigenständiges weiteres Subjekt verstanden werden: „und nichts, was aus unnützer Sünde hervorgeht“'
  rationale: Die Genitivform παντός entspricht γυναικός und spricht für eine gemeinsame Abhängigkeit von κάλλος. Da die gedrängte Syntax auch eine elliptische Fortführung zulässt, wird die Alternative in einer Fußnote offengehalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnliche Verbindung „unnütze Sünde“ bleibt bewusst nahe am griechischen Ausdruck; die Wiederholung von „die Schönheit“ klärt die Genitivkonstruktion, ohne deren Spannung zu verdecken.
