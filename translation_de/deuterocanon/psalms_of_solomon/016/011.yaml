review_pass:
  verdict: revise
  source_fidelity: Der Haupttext weicht ohne textkritische Kennzeichnung von der direkt bezeugten griechischen Form ἁμαρτήσῃς (2. Person Singular) zu „ich sündige“ ab. Da die überlieferte Lesart schwierig, aber eindeutig bezeugt ist, muss die Übersetzung die Ambiguität bzw. Härte im Haupttext bewahren; eine vermutete Verderbnis darf nicht als sicherer Text behandelt werden.
  naturalness: „Halte Murren und Mutlosigkeit in Bedrängnis von mir fern“ ist natürliches, würdiges modernes Deutsch. „fehlgehst“ gibt die problematische überlieferte Anrede verständlich wieder, ohne die stärkere Deutung „sündigst“ auszuschließen.
  terminology: „Murren“, „Mutlosigkeit“, „Bedrängnis“, „erziehst“ und „Umkehr“ sind treffend und registergerecht. Die englische Audit-Fassung normalisiert die griechische zweite Person zu „I sin“ und ist hier gegenüber dem griechischen Befund nicht maßgebend.
  issues:
  - severity: high
    issue: 'Ungekennzeichnete Konjektur im Haupttext: „wenn ich sündige“'
    rationale: Das vorliegende griechische Zeugnis liest ἐὰν ἁμαρτήσῃς, formal „falls du sündigst/fehlgehst“. Der Kontext kann eine Textverderbnis nahelegen, beweist aber keine Konjektur zu erster Person. Die Übersetzung soll bei streitigem Text die Schwierigkeit erhalten.
  - severity: medium
    issue: Fußnote stellt „wenn ich sündige“ zu bestimmt als Gemeintes dar
    rationale: „Wahrscheinlich ... gemeint“ überschreitet den Befund. Eine mögliche Emendation kann als Vermutung genannt werden, darf aber nicht die überlieferte Lesart im Haupttext ersetzen.
  revised_text: Halte Murren und Mutlosigkeit in Bedrängnis von mir fern, falls du fehlgehst[a], während du mich zur Umkehr erziehst.
  revised_footnotes:
  - marker: a
    text: 'Der überlieferte griechische Text hat die zweite Person Singular: „falls du sündigst“ oder „falls du fehlgehst, während du mich zur Umkehr erziehst“. Die Aussage ist im Gebetszusammenhang schwierig; gelegentlich wird deshalb eine verderbte Lesart und etwa „falls ich sündige“ vermutet. Der überlieferte Wortlaut bleibt jedoch unsicher.'
    reason: Bewahrt die grammatisch eindeutige, aber kontextuell schwierige Lesart des griechischen Textes und kennzeichnet die mögliche Emendation ausdrücklich als Vermutung.
  revision_rationale: Die Revision stellt die direkte griechische Überlieferung über die kontextuelle und theologisch motivierte Glättung im englischen Audit-Trail. Sie bewahrt die problematische zweite Person im Haupttext und erläutert die mögliche Textverderbnis zurückhaltend in der Fußnote. Alle übrigen Formulierungen des Entwurfs können bestehen bleiben.
