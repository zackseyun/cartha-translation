  yaml_path: translation/deuterocanon/psalms_of_solomon/016/011.yaml
  text: Keep grumbling and faintheartedness in affliction far from me[a], when I sin, as you discipline me for repentance.
translation:
  language: de
  text: Halte Murren und Mutlosigkeit in Bedrängnis fern von mir, wenn ich sündige,[a] während du mich zur Umkehr erziehst.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der überlieferte griechische Text lautet wörtlich: „falls du sündigst“ oder „falls du fehlgehst, während du mich zur Umkehr erziehst“. Wahrscheinlich ist der Text an dieser Stelle verderbt und gemeint: „wenn ich sündige“.'
    reason: Die griechische Verbform ἁμαρτήσῃς ist zweite Person Singular, während der Zusammenhang den Beter als den Sündigenden nahelegt.
lexical_decisions:
- source_word: γογγυσμόν
  choice: Murren
  rationale: „Murren“ bezeichnet verständlich und in angemessenem Gebetsregister eine leise, widerwillige Klage.
- source_word: ὀλιγοψυχίαν
  choice: Mutlosigkeit
  rationale: Das Wort bezeichnet mangelnden Mut, Verzagtheit oder Niedergeschlagenheit. „Mutlosigkeit“ ist im heutigen Deutsch klar und bewahrt die seelisch-moralische Aussage.
- source_word: ἐν θλίψει
  choice: in Bedrängnis
  rationale: θλῖψις bezeichnet Bedrängnis, Not oder Drangsal. „In Bedrängnis“ ist natürlich, würdig und quellennah.
- source_word: μάκρυνον ἀπʼ ἐμοῦ
  choice: halte … fern von mir
  rationale: Die Wendung fordert dazu auf, die genannten Haltungen vom Beter auf Abstand zu halten; „halte … fern von mir“ gibt dies idiomatisch wieder.
- source_word: ἐὰν ἁμαρτήσῃς
  choice: wenn ich sündige
  rationale: Der überlieferte Text hat formal die zweite Person Singular („wenn du sündigst/fehlgehst“), was im Gebet an Gott stark anstößig und wahrscheinlich textlich verderbt ist. Der Haupttext folgt dem kontextuell naheliegenden Verständnis mit dem Beter als Subjekt; die überlieferte Lesart wird ausdrücklich in der Fußnote bewahrt.
- source_word: ἐν τῷ σε παιδεύειν
  choice: während du mich … erziehst
  rationale: ἐν τῷ mit Infinitiv ist hier temporal. Das Akkusativpronomen σε ist das ausdrückliche Subjekt („du“); „mich“ wird aus dem Gebetszusammenhang als Objekt ergänzt. παιδεύω meint korrigierende, formende Erziehung.
- source_word: εἰς ἐπιστροφήν
  choice: zur Umkehr
  rationale: ἐπιστροφή bedeutet Rückkehr oder Umkehr; εἰς gibt Ziel und Richtung der erziehenden Zurechtweisung an.
theological_decisions:
- issue: Gott als mögliches Subjekt von ἁμαρτάνω
  choice: 'Im Haupttext ist der Beter das Subjekt: „wenn ich sündige“; die überlieferte zweite Person wird in einer Fußnote offengelegt.'
  alternative: „falls du fehlgehst, während du mich zur Umkehr erziehst“
  rationale: Die überlieferte Form ἁμαρτήσῃς ist grammatisch zweite Person Singular und darf nicht verschwiegen werden. Zugleich widerspricht die Aussage, Gott könne bei seiner Erziehung sündigen oder fehlgehen, dem Gebetskontext so stark, dass eine Textverderbnis oder abweichende ursprüngliche Verbform wahrscheinlich ist. Haupttext und Fußnote halten sowohl den kontextuellen Sinn als auch die echte textliche Spannung sichtbar.
translation_notes:
  register: Modernes, würdevolles Gebetsdeutsch. „Murren“, „Bedrängnis“ und „Umkehr“ bewahren den biblisch-poetischen Ton, ohne unnötig altertümlich zu wirken. Die schwierige überlieferte Verbform wird nicht stillschweigend harmonisiert, sondern im Haupttext kontextuell wiedergegeben und in der Fußnote vollständig dokumentiert.
