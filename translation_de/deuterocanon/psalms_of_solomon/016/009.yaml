  - severity: low
    issue: Die Fußnotenformulierung „Wörtlich auch“ ist unpräzise.
    rationale: „In der Erinnerung an dich“ ist eine mögliche alternative deutsche Wiedergabe, aber nicht wörtlicher als „im Gedenken an dich“.
