lexical_decisions:
- source_word: κατεύθυνον
  choice: Richte … aus
  rationale: Der Imperativ bittet Gott, das Tun des Beters auf den rechten Weg zu bringen oder richtig zu lenken. „Richte … aus“ wahrt das Bild des Gerademachens und klingt im Deutschen natürlich.
- source_word: τὰ ἔργα τῶν χειρῶν μου
  choice: die Werke meiner Hände
  rationale: Die konkrete, semitisch geprägte Wendung bezeichnet das Tun oder die Arbeit des Beters. Die wörtliche Bildsprache bleibt verständlich und würdevoll.
- source_word: ἐν τόπῳ σου
  choice: an deinem Ort
  rationale: τόπος bedeutet zunächst „Ort“ oder „Stätte“. Die Formulierung bleibt nahe am griechischen Wortlaut, ohne die mögliche kontextuelle Deutung als Gottes Gegenwart in den Haupttext einzutragen.
- source_word: τὰ διαβήματά μου
  choice: meine Schritte
  rationale: Das Wort bezeichnet die Schritte oder den Lebensgang des Beters. „Meine Schritte“ bewahrt das konkrete Bild und ist im Deutschen idiomatisch.
- source_word: ἐν τῇ μνήμῃ σου
  choice: im Gedenken an dich
  rationale: 'Der Genitiv σου wird hier im Zusammenhang am besten objektiv verstanden: Der Beter gedenkt Gottes. „Im Gedenken an dich“ macht diese Beziehung im Deutschen eindeutig und natürlich.'
- source_word: διαφύλαξον
  choice: bewahre
  rationale: Das verstärkte Verb bezeichnet sorgfältiges Hüten und Erhalten. „Bewahre“ passt zum Gebetsstil und umfasst Schutz wie fortdauernde Erhaltung.
theological_decisions:
- issue: Wer ist das Subjekt des Gedenkens in ἐν τῇ μνήμῃ σου?
  choice: 'Der Beter gedenkt Gottes: „im Gedenken an dich“.'
  alternative: 'Gott gedenkt des Beters: „in deinem Gedenken“.'
  rationale: Der objektive Genitiv entspricht dem näheren Zusammenhang, insbesondere der parallelen Rede vom Gedenken an Gott. Die alternative deutsche Formulierung könnte dagegen unbeabsichtigt Gottes Erinnerung an den Beter nahelegen.
translation_notes:
  register: Modernes, gehobenes Standarddeutsch mit bewahrter Gebetssprache und konkreter Bildwelt. Die Satzstellung bleibt gut lesbar; „Werke meiner Hände“ und „meine Schritte“ erhalten die poetischen Bilder des griechischen Textes.
