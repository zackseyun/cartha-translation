lexical_decisions:
- source_word: ἐν τῷ κατασκηνοῦν
  choice: Wenn ... wohnt
  rationale: 'Der artikulierte Infinitiv mit ἐν bezeichnet hier am natürlichsten einen zeitlichen Umstand: „wenn“ beziehungsweise „während“. Die Wiedergabe bleibt verständlich und bewahrt zugleich die Aussage vom Wohnen des göttlichen Namens.'
- source_word: κατασκηνοῦν
  choice: wohnt
  rationale: Das Verb bezeichnet das Zelten oder dauernde Wohnungnehmen. „wohnt“ ist im heutigen Deutsch natürlich; die anschaulichere Zeltmetaphorik wird in der Fußnote kenntlich gemacht.
- source_word: τὸ ὄνομά σου
  choice: dein Name
  rationale: Die Formulierung wird wörtlich bewahrt, weil „Name“ im biblischen Sprachgebrauch Gottes offenbarte Gegenwart mitbezeichnen kann. „deine Gegenwart“ würde das Bild zu stark auslegen.
- source_word: ἐν μέσῳ ἡμῶν
  choice: in unserer Mitte
  rationale: Diese idiomatische Wendung wahrt den gemeinschaftlichen und feierlichen Klang des griechischen Ausdrucks.
- source_word: ἐλεηθησόμεθα
  choice: wird uns Erbarmen erwiesen werden
  rationale: Die Wiedergabe bewahrt ausdrücklich das Futur und das Passiv. „Erbarmen“ entspricht dem theologischen Gewicht von ἐλεέω besser als ein bloß emotionales „Mitleid“.
