  text: Discipline us according to your will[c][b][a], and do not give us over to the nations.
translation:
  language: de
  text: Erziehe du uns nach deinem Willen[a], und liefere uns nicht den Völkern aus[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »weise uns zurecht« oder »züchtige uns«. Das griechische Verb umfasst sowohl korrigierende Zurechtweisung als auch formende Erziehung.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »und gib nicht den Völkern«; »uns« ist aus dem Zusammenhang mitzudenken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σὺ
  choice: du
  rationale: 'Das im Griechischen eigens gesetzte Personalpronomen trägt Nachdruck. Die Wortfolge »Weise du uns … zurecht« bewahrt diesen Kontrast: Gott selbst soll sie zurechtweisen, statt sie den Völkern preiszugeben.'
- source_word: ἐν θελήματί σου
  choice: nach deinem Willen
  rationale: Die Wendung bezeichnet hier am natürlichsten die Übereinstimmung mit Gottes Willen. »Nach deinem Willen« ist im modernen Deutsch klarer als das formalere »in deinem Willen«.
- source_word: παιδεύσον
  choice: weise … zurecht
  rationale: παιδεύω umfasst erzieherische Unterweisung und korrigierende Züchtigung. »Zurechtweisen« bringt in diesem Bittgebet den korrigierenden Sinn verständlich und würdig zum Ausdruck; die weitere Bedeutungsbreite wird in der Fußnote bewahrt.
- source_word: δῷς
  choice: liefere … aus
  rationale: Wörtlich steht »gib«. Im Zusammenhang bezeichnet das Verb jedoch die Übergabe in die Gewalt der Völker; »ausliefern« gibt diesen Sinn idiomatisch wieder. Das Objekt »uns« ist aus dem vorherigen Satzglied zu ergänzen.
- source_word: ἔθνεσιν
  choice: den Völkern
  rationale: Gemeint sind die fremden Nationen. »Völker« bleibt transparent und vermeidet sowohl die mögliche religiöse Verengung von »Heiden« als auch eine unnötig altertümliche Färbung.
theological_decisions:
- issue: Göttliche Zurechtweisung im Gegensatz zur Auslieferung an fremde Völker
  choice: Der Nachdruck auf σὺ wird durch »Weise du uns … zurecht« erhalten.
  alternative: »Weise uns … zurecht« ohne Wiedergabe des betonten Pronomens.
  rationale: Der griechische Satz stellt Gottes eigene erzieherische Behandlung der Übergabe an die Völker gegenüber. Die Übersetzung bewahrt diesen Kontrast, ohne eine weitergehende Lehraussage einzutragen.
translation_notes:
  register: Modernes, würdevolles Gebetsdeutsch. Die leicht markierte Wortfolge »Weise du uns« gibt den Nachdruck des griechischen σὺ wieder. »Zurechtweisen« ist verständlich und weniger altertümlich als »züchtigen«, während die Fußnote die volle Bedeutungsbreite von παιδεύω offenhält.
