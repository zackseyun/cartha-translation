  yaml_path: translation/deuterocanon/psalms_of_solomon/007/001.yaml
  text: Do not depart from us[a], O God[c][b], lest those who hate us without cause attack us.
translation:
  language: de
  text: Zieh nicht weg von uns, Gott,[a] damit die, die uns ohne Grund hassen,[b] uns nicht angreifen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Verb kann wörtlich bedeuten, ein Zelt oder Lager abzubrechen und wegzuziehen. Das Bild stellt Gottes Gegenwart als ein Wohnen unter seinem Volk dar.
    reason: cultural_note
  - marker: b
    text: 'Oder: „damit die, die uns hassen, uns nicht ohne Grund angreifen“. Das griechische Adverb „ohne Grund“ kann sich entweder auf den Hass oder auf den Angriff beziehen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποσκηνώσῃς
  choice: zieh … weg
  rationale: Das Verb bezeichnet wörtlich das Abbrechen eines Lagers beziehungsweise das Wegziehen mit dem Zelt und kann übertragen den Rückzug der Gegenwart bezeichnen. „Zieh nicht weg“ ist im Deutschen natürlich, bewahrt die Bewegungsvorstellung und lässt das Zeltbild in der Fußnote erkennen.
- source_word: ἀφʼ ἡμῶν
  choice: von uns
  rationale: Die Präpositionalphrase bezeichnet die Trennung von der betenden Gemeinschaft und wird direkt wiedergegeben.
- source_word: ἵνα μὴ
  choice: damit … nicht
  rationale: Die Verbindung leitet hier einen befürchteten negativen Ausgang ein. Die deutsche Konstruktion ist klar und in einem Gebet natürlich.
- source_word: ἐπιθῶνται ἡμῖν
  choice: uns … angreifen
  rationale: Das Verb kann in feindlichem Zusammenhang „sich gegen jemanden wenden“ oder „jemanden angreifen“ bedeuten; „angreifen“ gibt die Bedrohung verständlich wieder.
- source_word: οἱ μισοῦντα ἡμᾶς
  choice: die, die uns … hassen
  rationale: Das substantivierte Partizip wird durch einen natürlichen deutschen Relativsatz wiedergegeben.
- source_word: δωρεάν
  choice: ohne Grund
  rationale: Das Adverb bezeichnet hier etwas Unbegründetes oder Unverdientes. Aufgrund seiner Endstellung kann es grammatisch entweder auf das Hassen oder auf das Angreifen bezogen werden; der Haupttext verbindet es entsprechend der naheliegenden Sinnlesung mit dem Hass, die Alternative steht in der Fußnote.
theological_decisions:
- issue: Bild des abgebrochenen Zeltes beziehungsweise der zurückgezogenen Gegenwart Gottes
  choice: Im Haupttext „Zieh nicht weg“, mit ausdrücklicher Erläuterung des Zeltbildes in der Fußnote
  alternative: „Brich dein Zelt nicht bei uns ab“ oder „Entferne deine Wohnstätte nicht von uns“
  rationale: Eine vollständig bildhafte Wiedergabe würde im Deutschen ein nicht ausdrücklich genanntes Objekt wie „Zelt“ oder „Wohnstätte“ ergänzen. „Zieh nicht weg“ bleibt quellennah und natürlich, während die Fußnote die für den Psalm bedeutsame Bildkomponente transparent bewahrt.
translation_notes:
  register: Modernes, würdevolles Gebetsdeutsch. Die Anrede „Gott“ steht ohne das heute gehoben oder altertümlich wirkende „o“. Der Satzbau bleibt klar, und die echte syntaktische Mehrdeutigkeit von δωρεάν wird nicht im Haupttext überladen, sondern in einer Fußnote offengelegt.
