  text: For you have rejected them[a], O God[c][b]; let not their foot trample the inheritance of your sanctuary.
translation:
  language: de
  text: Denn du hast sie zurückgestoßen[a], Gott; mögen ihre Füße das Erbteil deines Heiligtums[b] nicht zertreten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Form kann formal ungewöhnlich wirken; im hellenistischen Sprachgebrauch ist sie am besten als „du hast sie zurückgestoßen“ zu verstehen. Möglich ist auch die Wiedergabe: „du hast sie verworfen“.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „dein heiliges Erbteil“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπώσω
  choice: du hast sie zurückgestoßen
  rationale: Die Form wird im hellenistischen Griechisch am besten als unaugmentierter Aorist Medium, 2. Person Singular, verstanden. „Zurückstoßen“ bewahrt hier stärker als „verwerfen“ das Bild der Abwehr feindlicher Eindringlinge.
- source_word: πατήσαι
  choice: zertreten
  rationale: Das Verb bezeichnet im Zusammenhang nicht bloß ein Betreten, sondern ein gewaltsames Niedertreten und damit die drohende Entweihung.
- source_word: ὁ ποὺς αὐτῶν
  choice: ihr Fuß
  rationale: Der Singular des griechischen Kollektivausdrucks bleibt erhalten und ist auch im Deutschen verständlich.
- source_word: κληρονομίαν
  choice: Erbteil
  rationale: „Erbteil“ bewahrt die biblischen und bundestheologischen Anklänge von κληρονομία besser als das allgemeinere „Besitz“.
- source_word: ἁγιάσματός σου
  choice: deines Heiligtums
  rationale: Im Kontext einer drohenden Entweihung bezeichnet ἁγίασμα am ehesten den heiligen Ort beziehungsweise das Heiligtum.
theological_decisions:
- issue: Bezug von κληρονομίαν ἁγιάσματός σου
  choice: das Erbteil deines Heiligtums
  alternative: dein heiliges Erbteil
  rationale: Der Genitiv wird im Haupttext als Zugehörigkeitsbeziehung wiedergegeben; die attributive Deutung bleibt als echte syntaktische Alternative in der Fußnote erhalten.
- issue: Modus von μὴ πατήσαι
  choice: ihr Fuß soll … nicht zertreten
  alternative: damit ihr Fuß … nicht zertritt
  rationale: Die selbstständige Wunsch- beziehungsweise Gebetsform wird als verneinter Wunsch wiedergegeben und nicht stillschweigend zu einem abhängigen Zwecksatz gemacht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Gebetscharakter wird durch „soll … nicht“ gewahrt; der kollektive Singular „ihr Fuß“ folgt bewusst dem Griechischen.
