base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/007/004.yaml
  text: For if you send death[a], you will command it concerning us; for you are merciful[c][b], and you will not be angry so as to bring us to an end.
translation:
  language: de
  text: Denn wenn du den Tod[a] sendest, wirst du ihm Anweisungen geben, die uns betreffen; denn du bist barmherzig und wirst nicht so zornig werden, dass du uns völlig vernichtest.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Im Zusammenhang möglicherweise: »eine Seuche«. Das griechische Wort bedeutet gewöhnlich »Tod«, kann in der griechischen Bibel in bestimmten Kontexten jedoch eine tödliche Seuche bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποστείλῃς
  choice: sendest
  rationale: Die Grundbedeutung »senden« passt zum Tod als von Gott ausgesandter Macht und bewahrt die Bildsprache des griechischen Textes.
- source_word: θάνατον
  choice: den Tod
  rationale: θάνατος bedeutet unmittelbar »Tod«. Der mögliche kontextuelle Sinn »Seuche« wird wegen des möglichen Anklangs an 2 Samuel 24 in einer Fußnote offengehalten, aber nicht in den Haupttext eingetragen.
- source_word: ἐντελῇ αὐτῷ
  choice: wirst du ihm Weisung geben
  rationale: ἐντέλλομαι bezeichnet das Erteilen eines Auftrags oder Befehls. »Ihm« nimmt im Deutschen wie das griechische Maskulinum den personifiziert dargestellten Tod auf; »Weisung geben« klingt würdig und lässt offen, worin der Auftrag besteht.
- source_word: περὶ ἡμῶν
  choice: über uns
  rationale: 'Die knappe Wendung gibt περὶ ἡμῶν formal wieder: Gottes Weisung an den Tod betrifft die betende Gemeinschaft.'
- source_word: ἐλεήμων
  choice: barmherzig
  rationale: »Barmherzig« ist die natürliche, bibelsprachlich vertraute und in modernem Deutsch weiterhin verständliche Entsprechung.
- source_word: οὐκ ὀργισθήσῃ
  choice: wirst nicht so zornig werden
  rationale: Das Verb bezeichnet das Zornigwerden. »So« verbindet den Zorn idiomatisch mit der folgenden Folgeaussage, ohne zu behaupten, Gott werde überhaupt nicht zornig.
- source_word: τοῦ συντελέσαι ἡμᾶς
  choice: dass du uns ein Ende machst
  rationale: Die Konstruktion bezeichnet hier die bis zur völligen Beendigung reichende Folge des Zorns. Die Formulierung erhält das Bild des Zu-Ende-Bringens und vermeidet eine unnötig explizite dogmatische Deutung.
theological_decisions:
- issue: Tod oder Seuche als von Gott gesandtes Gericht
  choice: Tod im Haupttext, mit »Seuche« als Fußnotenalternative
  alternative: Seuche im Haupttext
  rationale: Der lexikalisch direkte Sinn von θάνατος ist »Tod«. Im Kontext von Psalm Salomos 7 und angesichts eines möglichen Anklangs an 2 Samuel 24 kann jedoch eine tödliche Seuche gemeint sein. Die Fußnote bewahrt diese kontextuelle Möglichkeit, ohne sie gegen den Wortlaut zum alleinigen Sinn zu machen.
- issue: Reichweite des göttlichen Zorns
  choice: nicht so zornig, dass völlige Vernichtung folgt
  alternative: überhaupt nicht zornig werden
  rationale: Der griechische Satz verneint nicht notwendig jeden Zorn, sondern stellt dem Zorn die barmherzige Begrenzung entgegen, dass die Gemeinschaft nicht ganz zu Ende gebracht wird.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst biblischer, aber verständlicher Diktion. Die Personifizierung des Todes bleibt durch »ihm« sichtbar. Der Satzbau folgt der Begründungsstruktur des Griechischen, ohne unnötige Altertümlichkeit.
