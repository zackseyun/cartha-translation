  text: and no nation will prevail against us, because you are our defender.
translation:
  language: de
  text: Und kein Volk wird sich gegen uns durchsetzen, denn du bist unser Beschützer.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐκ ἰσχύσει
  choice: wird … überwältigen
  rationale: ἰσχύω bezeichnet Stärke oder Vermögen; mit πρός und Akkusativ wird die Wendung im Deutschen natürlich als „jemanden überwältigen“ wiedergegeben. So bleibt sowohl der Kraftaspekt als auch das Nicht-Durchdringen gegen die Angeredeten erhalten.
- source_word: πρὸς ἡμᾶς
  choice: uns
  rationale: Die gegen die Sprecher gerichtete Beziehung wird im Deutschen idiomatisch durch das direkte Objekt bei „überwältigen“ ausgedrückt; ein zusätzliches „gegen“ wäre bei diesem Verb unnötig.
- source_word: ἔθνος
  choice: Volk
  rationale: ἔθνος kann ein Volk oder eine Nation bezeichnen. „Volk“ ist hier als kollektive Bezeichnung natürlich und vermeidet die mögliche moderne Engführung von „Nation“ auf einen Nationalstaat.
- source_word: ὑπερασπιστής
  choice: Beschützer
  rationale: Das Nomen bezeichnet jemanden, der für einen anderen eintritt und ihn verteidigt. „Beschützer“ bewahrt die substantivische, titelartige Aussage und klingt in einem Gebet natürlich und würdig.
theological_decisions:
- issue: Aussage über Gottes Schutz
  choice: denn du bist unser Beschützer
  alternative: denn du bist unser Verteidiger
  rationale: Die substantivische Prädikation des Griechischen bleibt erhalten, ohne sie in einen verbalen Satz aufzulösen. „Beschützer“ bringt den fortdauernden Schutz Gottes zum Ausdruck; „Verteidiger“ wäre ebenfalls möglich, könnte im heutigen Deutsch jedoch enger juristisch verstanden werden.
translation_notes:
  register: Modernes, würdevolles Gebetsdeutsch. Die knappe Satzstruktur und die direkte Anrede Gottes bleiben erhalten; „Volk“ ist allgemein verständlich und nicht konfessionell aufgeladen.
