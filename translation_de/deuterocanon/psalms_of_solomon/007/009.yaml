base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/007/009.yaml
  text: You will guide us at the time of your help[b][a], to show mercy to the house of Jacob for the day that you promised them.
translation:
  language: de
  text: Du wirst uns zur Zeit deiner Hilfe führen[a], um dem Haus Jakob Erbarmen zu erweisen für den Tag, an dem du ihnen etwas verheißen hast.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Du wirst uns den rechten Weg weisen.“ Das griechische Verb kann das Geradelenken eines Weges oder das Ausrichten eines Kurses bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Die griechische Verbform am Versende ist textlich schwierig. Im Zusammenhang wird sie hier als „du hast ihnen etwas verheißen“ verstanden; möglich ist auch die weniger passende Deutung „ich habe ihnen etwas verheißen“.
    reason: textual_variant
lexical_decisions:
- source_word: κατευθυνεῖς
  choice: du wirst … führen
  rationale: Das Verb bezeichnet das Ausrichten oder Geradelenken eines Weges und kann im Gebetszusammenhang natürlich als göttliches Führen wiedergegeben werden. Die Alternative „den rechten Weg weisen“ wird in einer Fußnote genannt.
- source_word: ἐν καιρῷ ἀντιλήψεως σου
  choice: zur Zeit deiner Hilfe
  rationale: Die Wendung bezeichnet den Zeitpunkt oder die bestimmte Zeit göttlicher Hilfe. „Hilfe“ gibt ἀντίληψις verständlich wieder, ohne den Sinn auf „Rettung“ zu verengen.
- source_word: τοῦ ἐλεῆσαι
  choice: um … Erbarmen zu erweisen
  rationale: Der artikulierte Infinitiv wird hier als Zweckangabe verstanden. „Erbarmen erweisen“ bewahrt den aktiven Sinn von ἐλεέω und einen würdigen biblischen Ton.
- source_word: τὸν οἶκον Ἰακώβ
  choice: dem Haus Jakob
  rationale: Die konkrete kollektive Bezeichnung wird beibehalten und nicht deutend zu „Israel“ erweitert.
- source_word: εἰς ἡμέραν ἐν ᾗ
  choice: bis zu dem Tag, an dem
  rationale: εἰς blickt auf einen Zielpunkt voraus; der Relativsatz mit ἐν ᾗ wird formal als „an dem“ bewahrt. Die deutsche Fassung stellt den Tag als zeitlichen Zielpunkt des Erbarmens dar.
- source_word: ἐπηγγείλω αὐτοῖς
  choice: du es ihnen verheißen hast
  rationale: Im direkten Gebet ist die zweite Person sachgerecht. Das ergänzte „es“ verweist zurück auf das verheißene Erbarmen, ohne einen neuen Inhalt einzuführen; die Text- und Formschwierigkeit wird offengelegt.
theological_decisions:
- issue: Identität des „Hauses Jakob“
  choice: Die Quellbezeichnung „Haus Jakob“ bleibt im Haupttext stehen.
  alternative: Israel; das Volk Israel
  rationale: So bleibt die bundestheologische und literarische Ausdrucksweise des griechischen Textes erhalten, ohne sie durch eine erklärende Gleichsetzung zu ersetzen.
- issue: Inhalt und zeitlicher Bezug der Verheißung
  choice: Der Satz bezieht das Verheißene durch „es“ auf das göttliche Erbarmen und bewahrt „an dem“ als zeitlichen Relativanschluss.
  alternative: „der Tag, den du ihnen verheißen hast“
  rationale: Der griechische Text hat ἐν ᾗ („an dem/in dem“), nicht einen bloßen Akkusativ als Objekt von „verheißen“. Die gewählte Fassung vermeidet daher, den Tag selbst eindeutig zum Inhalt der Verheißung zu machen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt nahe am griechischen Gebet, wird aber durch „zur Zeit“ und die Zweckkonstruktion mit „um … zu“ idiomatisch gestaltet. Beide Fußnotenmarker stehen unmittelbar an den jeweils erklärten Stellen im Haupttext.
