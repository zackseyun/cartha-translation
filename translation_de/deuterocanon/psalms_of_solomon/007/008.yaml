base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/007/008.yaml
  text: For you will have compassion on the people of Israel forever, and you will not cast them off; and we will be under your yoke forever, and under the whip of your discipline.
translation:
  language: de
  text: Denn du wirst dich des Volkes Israel für immer erbarmen und es nicht verstoßen; und wir werden für immer unter deinem Joch und unter der Geißel deiner Zucht sein.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἰκτειρήσεις
  choice: wirst dich … erbarmen
  rationale: Gibt das starke mitfühlende Erbarmen des griechischen Verbs natürlich und würdig wieder.
- source_word: τὸ γένος Ἰσραήλ
  choice: das Volk Israel
  rationale: γένος bezeichnet hier die ethnische beziehungsweise gemeinschaftliche Größe Israel; „Volk“ ist im Deutschen idiomatischer als „Geschlecht“.
- source_word: οὐκ ἀπώσεις
  choice: wirst es nicht verstoßen
  rationale: Bewahrt den Gedanken entschiedener Zurückweisung; das Pronomen nimmt das Volk Israel auf.
- source_word: ὑπὸ ζυγόν σου
  choice: unter deinem Joch
  rationale: Erhält das konkrete Herrschafts- und Unterwerfungsbild des Ausgangstextes.
- source_word: μάστιγα παιδίας σου
  choice: unter der Geißel deiner Zucht
  rationale: μάστιξ ist eine Geißel oder Peitsche; παιδεία umfasst erziehende, zurechtweisende Zucht. Die Formulierung bewahrt die Härte und den pädagogischen Sinn.
theological_decisions:
- issue: Dauer von Gottes Erbarmen und Israels Unterordnung
  choice: Beide Vorkommen von εἰς τὸν αἰῶνα werden mit „für immer“ wiedergegeben.
  alternative: „auf ewig“ oder „für alle Zeit“
  rationale: Die parallele Formulierung des griechischen Textes wird sichtbar bewahrt, ohne die zeitliche Aussage abzuschwächen.
- issue: Verhältnis von göttlicher Herrschaft und Züchtigung
  choice: Joch und Geißel der Zucht bleiben als zwei zusammengehörige Bilder stehen.
  alternative: 'Glättend: „unter deiner Herrschaft und Erziehung“'
  rationale: Der Text verbindet bleibende Unterordnung mit schmerzhafter, aber erziehender Zurechtweisung; diese Spannung soll nicht aufgelöst werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur folgt dem griechischen Gedankengang, wird aber durch die pronominale Wiederaufnahme „es“ idiomatisch gestaltet. Keine Fußnoten erforderlich.
