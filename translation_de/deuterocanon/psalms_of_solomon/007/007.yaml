lexical_decisions:
- source_word: ἐπικαλεσόμεθαί (ἐπικαλέω)
  choice: werden … anrufen
  rationale: Im Gebetskontext bezeichnet das Verb das Anrufen Gottes. „Dich anrufen“ ist im heutigen Deutschen natürlich, würdig und näher am griechischen Ausdruck als eine stärker deutende Wiedergabe wie „an dich appellieren“.
- source_word: σε
  choice: dich
  rationale: Das direkte Objekt der zweiten Person wird unverändert wiedergegeben.
- source_word: ἐπακούσει (ἐπακούω)
  choice: wirst … erhören
  rationale: Das Verb kann ein Hören mit günstiger Zuwendung beziehungsweise das Beachten einer Bitte ausdrücken. „Erhören“ entspricht dem Gebetskontext, ohne so ausdrücklich wie „antworten“ eine konkrete Reaktion hinzuzufügen.
- source_word: ἡμῶν
  choice: uns
  rationale: Der griechische Genitiv nach ἐπακούω wird im Deutschen idiomatisch als direktes Objekt wiedergegeben; Ergänzungen wie „unser Gebet“ stehen nicht ausdrücklich im Ausgangstext.
theological_decisions: []
translation_notes:
  register: Modernes Standarddeutsch mit würdigem, allgemein verständlichem Gebetsregister. Die parallelen Zukunftsformen und das wiederholte „und“ des griechischen Textes bleiben erhalten.
