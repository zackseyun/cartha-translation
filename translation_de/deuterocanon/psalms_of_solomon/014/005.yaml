base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/014/005.yaml
  text: And they did not remember God[a], that the ways of men are known before him continually[c][b], and he knows the secrets of the heart before they come to be.
translation:
  language: de
  text: Und sie dachten nicht an Gott und nicht daran, dass die Wege der Menschen allezeit vor ihm bekannt sind und dass er die Geheimnisse des Herzens[a] kennt, bevor sie entstehen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die inneren Räume“ oder „die Kammern des Herzens“. Gemeint ist das im Herzen Verborgene.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „bevor sie ins Dasein kommen“; je nach Bezug auch: „bevor sie geschehen“ oder „aufkommen“.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐμνήσθησαν τοῦ θεοῦ
  choice: sie dachten an Gott
  rationale: Das verneinte „an Gott denken“ gibt das Erinnern beziehungsweise bewusste Im-Sinn-Behalten im heutigen Deutsch natürlich wieder. Im Haupttext steht entsprechend „sie dachten nicht an Gott“.
- source_word: ὁδοὶ ἀνθρώπων
  choice: die Wege der Menschen
  rationale: „Wege“ bewahrt sowohl das biblische Bild als auch den möglichen Bezug auf Lebensführung und Verhalten.
- source_word: γνωσταὶ ἐνώπιον αὐτοῦ διὰ παντός
  choice: allezeit vor ihm bekannt
  rationale: Die Formulierung erhält die Perspektive der Gegenwart Gottes und die zeitliche Beständigkeit von διὰ παντός.
- source_word: ταμεῖα καρδίας
  choice: die Geheimnisse des Herzens
  rationale: Wörtlich bezeichnet ταμεῖα innere Räume oder Kammern; hier ist es metonymisch für das darin Verborgene gebraucht. „Geheimnisse“ ist verständlich und verbindet sich schlüssig mit ihrem Entstehen.
- source_word: ἐπίσταται
  choice: er kennt
  rationale: Das Verb bezeichnet sicheres, eingehendes Wissen; „kennt“ passt idiomatisch zu den Geheimnissen des Herzens.
- source_word: πρὸ τοῦ γενέσθαι
  choice: bevor sie entstehen
  rationale: Die Wiedergabe bleibt offen dafür, dass innere Gedanken, Absichten oder andere verborgene Regungen erst aufkommen, ohne den Ausdruck auf äußere Ereignisse einzuengen.
theological_decisions:
- issue: Umfang des göttlichen Vorherwissens im Schlusssatz
  choice: Gott kennt die verborgenen Inhalte des Herzens, bevor sie entstehen.
  alternative: Gott kennt das im Herzen Verborgene, bevor es sich in Handlungen zeigt, oder bevor innere Überlegungen aufkommen.
  rationale: Der griechische Text formuliert umfassend, legt aber kein späteres Lehrsystem fest. Die Übersetzung wahrt diese Weite.
- issue: Funktion von ὅτι nach dem Gedenken an Gott
  choice: 'Als Inhalt dessen wiedergegeben, woran sie nicht dachten: „und nicht daran, dass …“'
  alternative: ὅτι kann grundsätzlich auch begründend als „denn/weil“ verstanden werden.
  rationale: Der folgende Satz beschreibt hier am natürlichsten die Wahrheit über Gott, die sie außer Acht ließen. Die deutsche Ergänzung macht den elliptischen griechischen Anschluss verständlich, ohne den Gedanken inhaltlich zu erweitern.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit maßvoll biblischer Bildsprache. „Allezeit“ trägt den gehobenen Ton, bleibt aber allgemein verständlich. Die Satzfügung wurde zur Klarheit leicht entfaltet.
