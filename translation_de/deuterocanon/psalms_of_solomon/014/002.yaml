base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/014/002.yaml
  text: The holy ones of the Lord will live in him forever[a]; the paradise of the Lord, the trees of life[c][b], are his holy ones.
translation:
  language: de
  text: Die Frommen des Herrn werden in ihm für immer leben[a]; das Paradies des Herrn – die Bäume des Lebens[b] – sind seine Frommen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische „in ihm“ kann sich auf den Herrn beziehen; möglicherweise nimmt das Pronomen aber auch das in Vers 1 genannte Gesetz auf.
    reason: Das Bezugswort von ἐν αὐτῷ ist im Kontext nicht eindeutig; die Anmerkung bewahrt die mögliche Lesart, ohne die Präposition instrumentell umzudeuten.
  - marker: b
    text: Im Griechischen steht „Bäume des Lebens“ im Plural.
    reason: Bewahrt die auffällige Pluralform gegenüber der geläufigen Einzahl „Baum des Lebens“.
lexical_decisions:
- source_word: ὅσιοι / ὅσιοι αὐτοῦ
  choice: die Frommen / seine Frommen
  rationale: ὅσιος bezeichnet Menschen, die durch Frömmigkeit und Treue zu Gott gekennzeichnet sind. „Die Frommen“ ist im Deutschen natürlich, würdig und vermeidet die stärkeren kultischen oder später kirchlichen Konnotationen von „die Heiligen“.
- source_word: Κυρίου / τοῦ κυρίου
  choice: des Herrn
  rationale: Die etablierte Gottesbezeichnung „der Herr“ passt in beiden Satzteilen und bewahrt den gehobenen biblischen Sprachgebrauch.
- source_word: ζήσονται
  choice: werden leben
  rationale: Die einfache Zukunft von ζάω wird direkt und idiomatisch wiedergegeben.
- source_word: ἐν αὐτῷ
  choice: durch es
  rationale: Das Pronomen nimmt wahrscheinlich den unmittelbar zuvor genannten νόμος („Gesetz“) aus 14,1 auf; „durch es leben“ gibt den Gedanken wieder, aufgrund beziehungsweise in Befolgung des Gesetzes Leben zu haben. Die formale und inhaltliche Mehrdeutigkeit wird in der Fußnote offengelegt.
- source_word: εἰς τὸν αἰῶνα
  choice: ewig
  rationale: „Ewig“ gibt die idiomatische Bedeutung der Wendung knapp und natürlich wieder.
- source_word: ὁ παράδεισος
  choice: das Paradies
  rationale: „Paradies“ bewahrt gegenüber „Garten“ die erhöhte und eschatologisch anklingende Bildsprache.
- source_word: τὰ ξύλα τῆς ζωῆς
  choice: die Bäume des Lebens
  rationale: τὰ ξύλα steht ausdrücklich im Plural. „Bäume“ ist im Kontext des Paradieses die natürliche Bedeutung von ξύλα.
theological_decisions:
- issue: Bezugswort von ἐν αὐτῷ
  choice: 'Bezug auf das in Psalm Salomos 14,1 genannte Gesetz: „durch es“'
  alternative: 'Bezug auf den Herrn: „in ihm“'
  rationale: Das unmittelbar vorausgehende griechische νόμος ist maskulin und bietet daher ein naheliegendes Bezugswort für αὐτῷ; zudem passt der Gedanke des Lebens durch das Halten des Gesetzes in den jüdischen Kontext. Da der Herr ebenfalls als Bezug denkbar bleibt und ἐν wörtlich „in“ bedeutet, wird die Alternative nicht verschwiegen.
- issue: Metaphorische Struktur des zweiten Satzteils
  choice: 'Identifikation: Das Paradies und die Bäume des Lebens sind die Frommen des Herrn.'
  alternative: Das Paradies gehört den Frommen oder die Frommen befinden sich darin.
  rationale: Der griechische Text reiht drei Nominativausdrücke ohne ausdrückliches Verb aneinander. Die ergänzte Kopula bewahrt die starke poetische Gleichsetzung, statt sie zu Besitz oder Ortsangabe umzudeuten.
translation_notes:
  register: Moderne, würdige Standardsprache mit poetischer Gedankenführung. Der Gedankenstrich macht die Apposition beziehungsweise Gleichsetzung im zweiten Halbvers sichtbar, ohne die Metapher erklärend aufzulösen.
