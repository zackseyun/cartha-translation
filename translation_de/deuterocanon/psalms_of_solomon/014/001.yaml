base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/014/001.yaml
  text: The Lord is faithful to those who love him in truth[a], to those who endure his discipline, to those who walk in the righteousness of his commandments[b], in the law that he commanded us for our life.
translation:
  language: de
  text: Der Herr ist treu gegenüber denen, die ihn in Wahrheit lieben, denen, die seine Erziehung[a] geduldig ertragen, denen, die in der Gerechtigkeit seiner Gebote[b] leben, in dem Gesetz, das er uns zu unserem Leben geboten hat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Unterweisung“ oder „Zurechtweisung“. Das griechische Wort παιδεία umfasst Erziehung, Schulung, Lehre und korrigierende Maßnahme.'
    reason: lexical_alternative
  - marker: b
    text: Die griechische Wendung kann ein gerechtes Leben gemäß seinen Geboten meinen; sie kann auch die Gerechtigkeit seiner Gebote selbst hervorheben.
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: Πιστὸς
  choice: treu
  rationale: Prädikativ gebraucht bezeichnet das Wort die Verlässlichkeit und Beständigkeit des Herrn; „treu“ ist im Deutschen natürlich und theologisch gehaltvoll.
- source_word: Κύριος
  choice: der Herr
  rationale: In diesem jüdisch-griechischen Andachtskontext ist κύριος ein Gottesprädikat und wird konventionell mit „der Herr“ wiedergegeben.
- source_word: τοῖς ἀγαπῶσιν αὐτὸν
  choice: denen, die ihn … lieben
  rationale: Die einfache verbale Form bewahrt sowohl den unmittelbaren Sinn als auch das Gewicht der Beziehung zu Gott.
- source_word: ἐν ἀληθείᾳ
  choice: in Wahrheit
  rationale: Die formnahe Wiedergabe erhält die mögliche Bedeutungsbreite zwischen Wahrhaftigkeit, Aufrichtigkeit und einer Liebe, die der Wahrheit entspricht.
- source_word: τοῖς ὑπομένουσιν
  choice: denen, die … geduldig ertragen
  rationale: ὑπομένω bezeichnet standhaftes Ausharren unter etwas; „geduldig ertragen“ macht diesen Aspekt in idiomatischem Deutsch deutlich.
- source_word: παιδείαν
  choice: Erziehung
  rationale: παιδεία umfasst Unterweisung, Schulung und Zurechtweisung. „Erziehung“ hält diese formative Breite besser offen als das enger strafend klingende „Züchtigung“.
- source_word: τοῖς πορευομένοις
  choice: denen, die … leben
  rationale: Das griechische Bild des Gehens bezeichnet hier die Lebensführung. „leben“ ist im modernen Deutschen natürlicher als „wandeln“, ohne den ethischen Sinn abzuschwächen.
- source_word: ἐν δικαιοσύνῃ
  choice: in der Gerechtigkeit
  rationale: Die substantivische und präpositionale Gestalt des Griechischen bleibt erhalten; „Gerechtigkeit“ kann hier sowohl rechtes Verhalten als auch die gerechte Ordnung der Gebote bezeichnen.
- source_word: προσταγμάτων αὐτοῦ
  choice: seiner Gebote
  rationale: „Gebote“ entspricht dem verbindlichen Charakter göttlicher Anordnungen und passt zum würdigen biblischen Register.
- source_word: ἐν νόμῳ
  choice: in dem Gesetz
  rationale: „Gesetz“ ist die transparente Standardentsprechung und erhält die Parallele zur Sprache von Gebot und Gehorsam.
- source_word: ᾧ ἐνετείλατο ἡμῖν
  choice: das er uns … geboten hat
  rationale: Das relative Satzgefüge und der ausdrückliche Bezug auf die Gemeinschaft („uns“) werden bewahrt.
- source_word: εἰς ζωὴν ἡμῶν
  choice: zu unserem Leben
  rationale: Die Wendung wahrt den Singular ζωή und lässt sowohl Ziel als auch lebensfördernde Bestimmung des Gesetzes anklingen.
theological_decisions:
- issue: Bedeutungsumfang von παιδεία als Handeln Gottes
  choice: Erziehung
  alternative: Unterweisung; Zucht; Zurechtweisung
  rationale: Der Kontext erlaubt sowohl lehrende als auch korrigierende Formung. „Erziehung“ hält diese Spannung offen und vermeidet eine einseitig strafende Auslegung.
- issue: Beziehung zwischen Gerechtigkeit und Geboten in ἐν δικαιοσύνῃ προσταγμάτων αὐτοῦ
  choice: in der Gerechtigkeit seiner Gebote
  alternative: gerecht nach seinen Geboten; in der gerechten Ordnung seiner Gebote
  rationale: 'Die formnahe Genitivverbindung bewahrt die mögliche Mehrdeutigkeit: Gemeint sein kann ein gerechtes Leben gemäß den Geboten oder die Gerechtigkeit, die den Geboten selbst zukommt.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit erkennbar biblischem Ton. Veraltetes „wandeln“ wurde zugunsten von „leben“ vermieden; die wiederholte Dativstruktur „denen, die …“ und die präpositionalen Wendungen wurden zur Wahrung des poetischen Parallelismus beibehalten.
