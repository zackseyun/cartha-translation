  text: Πιστὸς Κύριος τοῖς ἀγαπῶσιν αὐτὸν ἐν ἀληθείᾳ, τοῖς ὑπομένουσιν παιδείαν αὐτοῦ, τοῖς πορευομένοις ἐν δικαιοσύνῃ προσταγμάτων αὐτοῦ, ἐν νόμῳ ᾧ ἐνετείλατο ἡμῖν εἰς ζωὴν ἡμῶν.
