  yaml_path: translation/deuterocanon/psalms_of_solomon/014/003.yaml
  text: Their planting is rooted forever[a]; they will not fail all the days of heaven[d][c][b], because Israel is the portion and inheritance of God.
translation:
  language: de
  text: Ihre Pflanzung ist für immer verwurzelt; sie werden alle Tage des Himmels hindurch nicht vergehen[a], denn Israel ist Gottes Anteil und Erbe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sie werden nicht aufhören“ beziehungsweise „sie werden kein Ende nehmen“. Das griechische Verb ist selten und bezeichnet hier ihr Fortbestehen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: φυτεία
  choice: Pflanzung
  rationale: Das Substantiv bezeichnet eine Pflanzung beziehungsweise das Gepflanzte. „Pflanzung“ bewahrt das landwirtschaftliche Bild, ohne dessen Bezug vorschnell festzulegen.
- source_word: ἐρριζωμένη
  choice: verwurzelt
  rationale: Das Partizip Perfekt Passiv beschreibt einen fest begründeten, fortdauernden Zustand und führt das Pflanzenbild weiter.
- source_word: εἰς τὸν αἰῶνα
  choice: für immer
  rationale: Die Wendung bezeichnet hier bleibende Dauer; „für immer“ gibt ihre Kraft in natürlichem modernem Deutsch wieder.
- source_word: ἐκλήξουσιν
  choice: vergehen
  rationale: Das seltene Verb bedeutet hier, aufzuhören beziehungsweise zu einem Ende zu kommen. „Vergehen“ drückt den Gegensatz zur dauerhaften Verwurzelung verständlich aus.
- source_word: πάσας τὰς ἡμέρας τοῦ οὐρανοῦ
  choice: alle Tage des Himmels hindurch
  rationale: Die bildhafte und erhabene griechische Zeitangabe bleibt erhalten; „hindurch“ bindet sie im Deutschen natürlich an das Verb an.
- source_word: μερὶς
  choice: Anteil
  rationale: „Anteil“ wahrt die Sprache von Zuteilung und Zugehörigkeit und verbindet sich im Deutschen natürlich mit „Erbe“.
- source_word: κληρονομία
  choice: Erbe
  rationale: „Erbe“ erhält den biblischen Sinn einer zugeeigneten beziehungsweise bleibenden Besitzzugehörigkeit.
- source_word: τοῦ θεοῦ
  choice: Gottes
  rationale: Der Genitiv wird schlicht possessiv wiedergegeben, ohne die Beziehung näher auszudeuten.
theological_decisions:
- issue: Israel als Gottes Anteil und Erbe
  choice: Israel ist Gottes Anteil und Erbe
  alternative: Der Anteil und das Erbe Gottes ist Israel
  rationale: Beide Wortstellungen entsprechen der griechischen Prädikatskonstruktion. Die gewählte Form klingt im modernen Deutsch natürlich und bewahrt die Aussage über Israels Zugehörigkeit zu Gott, ohne sie dogmatisch auszuweiten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrtem Pflanzenbild und einer bewusst quellennahen Wiedergabe der ungewöhnlichen Wendung „Tage des Himmels“. Die Satzstellung ist leicht geglättet, ohne die theologische Spannung oder die Bildsprache aufzulösen.
