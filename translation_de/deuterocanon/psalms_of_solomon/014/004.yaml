base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/014/004.yaml
  text: But not so the sinners and the lawless[a], who loved a day of sharing in their sin; their desire lay in the brevity of corruption,
translation:
  language: de
  text: Doch nicht so die Sünder und Gesetzlosen, die einen Tag der Teilhabe an ihrer Sünde liebten; ihr Verlangen galt der Kürze des Verfalls.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: »der Kleinheit des Verfalls«; möglich ist ebenso: »der Geringfügigkeit der Verderbnis«.'
    reason: Die schwierige Verbindung μικρότης σαπρίας kann zeitlich („Kürze“) oder qualitativ („Kleinheit/Geringfügigkeit“) verstanden werden.
lexical_decisions:
- source_word: καὶ οὐχ οὕτως
  choice: Doch nicht so
  rationale: Die Wendung setzt einen knappen, scharfen Gegensatz zum vorher Gesagten und entspricht natürlichem deutschem Psalmstil.
- source_word: οἱ ἁμαρτωλοὶ καὶ παράνομοι
  choice: die Sünder und Gesetzlosen
  rationale: 'Beide Bezeichnungen bleiben erhalten: ἁμαρτωλοί bezeichnet Sünder, παράνομοι Menschen, die das Gesetz missachten oder übertreten.'
- source_word: οἱ ἠγάπησαν ἡμέραν ἐν μετοχῇ ἁμαρτίας αὐτῶν
  choice: die einen Tag der Teilhabe an ihrer Sünde liebten
  rationale: Die ungewöhnlich verdichtete griechische Formulierung und der bestimmte zeitliche Einzelbegriff ἡμέραν bleiben erkennbar; μετοχή wird als Teilhabe wiedergegeben, ohne die Aussage erklärend auszuweiten.
- source_word: ἐν μικρότητι σαπρίας
  choice: der Kürze des Verfalls
  rationale: Im Zusammenhang mit der bleibenden Dauer der Heiligen im vorigen Vers ist μικρότης wahrscheinlich zeitlich als Kürze zu verstehen. σαπρία bezeichnet Verfall, Fäulnis oder Verderbnis; „Verfall“ wahrt hier sowohl die Vergänglichkeit als auch den negativen Bildgehalt.
- source_word: ἡ ἐπιθυμία αὐτῶν
  choice: ihr Verlangen galt
  rationale: ἐπιθυμία bezeichnet allgemein ein starkes Verlangen. Die deutsche Konstruktion gibt das elliptische Prädikat mit ἐν idiomatisch wieder.
theological_decisions:
- issue: Zeitliche oder qualitative Bedeutung von μικρότης
  choice: Kürze
  alternative: Geringfügigkeit / Kleinheit
  rationale: Der unmittelbare Kontrast zur dauerhaften Pflanzung und zu „allen Tagen des Himmels“ spricht für zeitliche Kürze. Da μικρότης auch Kleinheit oder Geringfügigkeit bedeuten kann, wird die Alternative in einer Fußnote bewahrt.
translation_notes:
  register: Moderne, würdige Standardsprache mit bewusst verdichteter poetischer Syntax. Die ungewöhnliche Wendung „einen Tag der Teilhabe“ bewahrt die Spannung und Kürze des griechischen Textes; die Mehrdeutigkeit der Schlussphrase wird nicht stillschweigend beseitigt, sondern in der Fußnote offengelegt.
