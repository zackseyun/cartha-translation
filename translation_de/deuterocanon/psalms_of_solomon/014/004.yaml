  source_fidelity: Die Übersetzung bildet den scharfen Kontrast von καὶ οὐχ οὕτως sowie beide Personenbezeichnungen, „Sünder“ und „Gesetzlose“, zutreffend ab. „einen Tag der Teilhabe an ihrer Sünde“ wahrt die absichtlich gedrängte, im Griechischen nicht weiter erklärte Formulierung mit dem Singular ἡμέραν und μετοχή. „ihr Verlangen galt der Kürze des Verfalls“ gibt die elliptische Konstruktion mit ἐν idiomatisch wieder und trifft die im Kontext naheliegende zeitliche Lesart von μικρότης, ohne die alternative qualitative Lesart zu unterschlagen.
  naturalness: Das Deutsch ist modernes Standarddeutsch mit angemessen dichter, poetisch-psalmischer Syntax. Die Wortstellung „Doch nicht so die Sünder und Gesetzlosen“ ist bewusst markiert, aber gut verständlich und dem Kontrast angemessen. „Tag der Teilhabe“ ist leicht ungewohnt, jedoch als source-nahe Verdichtung hier gerechtfertigt.
  terminology: „Sünder“, „Gesetzlose“, „Sünde“, „Verlangen“ und „Verfall“ sind registergerecht und unterscheiden die griechischen Begriffe ohne konfessionelle Überdeutung. Die Fußnote dokumentiert sachgerecht die semantische Unsicherheit von μικρότης σαπρίας. Der Anker [a] steht korrekt bei der Schlussphrase, auf die sich die Anmerkung bezieht.
