base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/014/006.yaml
  text: Therefore Hades and darkness and destruction are their inheritance[a], and they will not be found in the day of mercy for the righteous[d][c][b]. But the holy ones of the Lord will inherit life in gladness.
translation:
  language: de
  text: 'Darum sind das Totenreich[b], Finsternis und Verderben ihr Erbe, und sie werden am Tag des Erbarmens für die Gerechten[a] nicht gefunden werden. Die Frommen[c] des Herrn aber werden das Leben in Freude erben.


    [a] Oder: »am Tag des Erbarmens der Gerechten«. Die griechische Formulierung lässt offen, ob den Gerechten Erbarmen erwiesen wird oder ob das Erbarmen von ihnen ausgeht.

    [b] Das »Totenreich« bezeichnet den Bereich der Toten und ist nicht ohne Weiteres mit dem später umfassender verstandenen Begriff »Hölle« gleichzusetzen.

    [c] Oder: »die Gottesfürchtigen« beziehungsweise »die Treuen«. Das griechische Wort bezeichnet Menschen, die sich durch Frömmigkeit und Treue zu Gott auszeichnen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »am Tag des Erbarmens der Gerechten«. Die griechische Formulierung lässt offen, ob den Gerechten Erbarmen erwiesen wird oder ob das Erbarmen von ihnen ausgeht.'
    reason: alternative_reading
  - marker: b
    text: Das »Totenreich« bezeichnet den Bereich der Toten und ist nicht ohne Weiteres mit dem später umfassender verstandenen Begriff »Hölle« gleichzusetzen.
    reason: cultural_note
  - marker: c
    text: 'Oder: »die Gottesfürchtigen« beziehungsweise »die Treuen«. Das griechische Wort bezeichnet Menschen, die sich durch Frömmigkeit und Treue zu Gott auszeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Darum
  rationale: Gibt den folgernden Anschluss knapp und natürlich wieder.
- source_word: κληρονομία
  choice: Erbe
  rationale: Bewahrt das Erb- und Besitzmotiv, das im zweiten Satz durch das Verb erneut aufgenommen wird.
- source_word: ᾅδης
  choice: das Totenreich
  rationale: Bezeichnet verständlich den Bereich der Toten, ohne die späteren theologischen Konnotationen von »Hölle« einzutragen.
- source_word: σκότος
  choice: Finsternis
  rationale: Gibt das Bild direkt wieder und passt zum würdevollen Ton der dreigliedrigen Aufzählung.
- source_word: ἀπώλεια
  choice: Verderben
  rationale: Bezeichnet Untergang und Vernichtung in einer natürlichen, zugleich gehobenen deutschen Ausdrucksweise.
- source_word: οὐχ εὑρεθήσονται
  choice: sie werden nicht gefunden werden
  rationale: Bewahrt Futur und Passiv des griechischen Ausdrucks sowie dessen möglichen Ausschluss- oder Gerichtsakzent.
- source_word: ἐν ἡμέρᾳ ἐλέους δικαίων
  choice: am Tag des Erbarmens für die Gerechten
  rationale: Versteht δικαίων als Bezeichnung der Empfänger des Erbarmens, kennzeichnet die echte grammatische Mehrdeutigkeit aber in einer Fußnote.
- source_word: ὅσιοι
  choice: die Frommen
  rationale: Gibt Frömmigkeit und loyale Gottesbeziehung präziser wieder als »die Heiligen«, das im Deutschen eher ἅγιοι entsprechen würde.
- source_word: Κυρίου
  choice: des Herrn
  rationale: Entspricht der direkten Genitivkonstruktion und der üblichen Wiedergabe von κύριος.
- source_word: κληρονομήσουσιν ζωὴν
  choice: werden das Leben erben
  rationale: Nimmt das Erbmotiv des ersten Satzes ausdrücklich wieder auf und erhält so den Kontrast.
- source_word: ἐν εὐφροσύνῃ
  choice: in Freude
  rationale: Ist eine klare, natürliche und würdevolle Wiedergabe der begleitenden Freude.
theological_decisions:
- issue: Bedeutung von ᾅδης
  choice: Totenreich
  alternative: Hades; Hölle; Grab
  rationale: »Totenreich« bewahrt den Bezug auf den Bereich der Toten, ohne dem Text die umfassenderen späteren Vorstellungen einzuschreiben, die »Hölle« nahelegen kann.
- issue: Bezug des Genitivs δικαίων
  choice: Erbarmen für die Gerechten
  alternative: Erbarmen der Gerechten
  rationale: Der Kontrast zum Geschick der Gottlosen legt die Gerechten als Empfänger des Erbarmens nahe; da der griechische Genitiv jedoch auch anders bezogen werden kann, bleibt die Alternative in der Fußnote sichtbar.
- issue: Wiedergabe von ὅσιοι
  choice: die Frommen
  alternative: die Gottesfürchtigen; die Treuen; die Heiligen
  rationale: »Die Frommen« wahrt den Akzent auf Gottesverehrung und Bundestreue und vermeidet eine unangezeigte Gleichsetzung mit ἅγιοι.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem poetischem Ton. Die parallele Erbmetaphorik und die dreigliedrige Gerichtsaussage bleiben erhalten; echte lexikalische und syntaktische Mehrdeutigkeiten werden nicht stillschweigend beseitigt.
