base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/003/007.yaml
  text: The truth of the righteous is from God their savior[b][a]; sin upon sin does not lodge in the house of a righteous man.
translation:
  language: de
  text: Die Wahrheit[a] der Gerechten kommt von Gott, ihrem Retter; Sünde auf Sünde kehrt nicht im Haus eines Gerechten ein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Treue“ oder „Aufrichtigkeit“. Das griechische Wort kann hier über abstrakte Wahrheit hinaus die verlässliche, rechtschaffene Haltung der Gerechten bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλήθεια
  choice: Wahrheit
  rationale: „Wahrheit“ gibt den griechischen Ausdruck unmittelbar wieder und lässt dessen in diesem ethischen Zusammenhang mögliche Bedeutung „Treue“ oder „Aufrichtigkeit“ offen, statt sie im Haupttext einseitig festzulegen.
- source_word: παρὰ θεοῦ
  choice: kommt von Gott
  rationale: παρά mit Genitiv bezeichnet hier Herkunft oder Ursprung. „Kommt von Gott“ ist im Deutschen natürlich und gibt diese Aussage klar wieder.
- source_word: σωτῆρος αὐτῶν
  choice: ihrem Retter
  rationale: σωτήρ bezeichnet einen Retter oder Befreier. „Retter“ wahrt den religiösen Klang, ohne über den griechischen Ausdruck hinauszugehen; das Possessivpronomen bezieht sich auf die Gerechten.
- source_word: οὐκ αὐλίζεται
  choice: kehrt nicht … ein
  rationale: αὐλίζομαι bezeichnet das Unterkommen oder Übernachten. „Einkehren“ bewahrt das konkrete Bild eines Gastes, der in einem Haus Unterkunft findet, und klingt zugleich natürlich.
- source_word: ἐν οἴκῳ δικαίου
  choice: im Haus eines Gerechten
  rationale: Der griechische Singular δικαίου bleibt erhalten. Die substantivierte Form „eines Gerechten“ ist geschlechtsgenau und in gehobenem modernem Deutsch idiomatisch.
- source_word: ἁμαρτία ἐφʼ ἁμαρτίαν
  choice: Sünde auf Sünde
  rationale: Die Wiederholung und das Bild des Anhäufens werden eng am Griechischen bewahrt; eine Umschreibung wie „eine Sünde nach der anderen“ wäre deutender.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der erste Satzteil wird wegen des im Griechischen ausgelassenen Verbs idiomatisch mit „kommt“ formuliert. „Kehrt … ein“ erhält das anschauliche Herbergs- beziehungsweise Hausbild des griechischen Verbs.
