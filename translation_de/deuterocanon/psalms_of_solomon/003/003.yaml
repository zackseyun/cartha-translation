  yaml_path: translation/deuterocanon/psalms_of_solomon/003/003.yaml
  text: The righteous will remember the Lord continually[c][b][a], with thanksgiving and vindicating the judgments of the Lord.
translation:
  language: de
  text: Die Gerechten werden allezeit an den Herrn denken, mit Dank und indem sie die Urteile des Herrn als gerecht anerkennen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „in Dank und Rechtfertigung der Urteile des Herrn“. Das Griechische kann beim ersten Ausdruck auch Lob oder Bekenntnis meinen; beim zweiten geht es um die Anerkennung beziehungsweise Erweisung der Urteile als gerecht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δίκαιοι
  choice: die Gerechten
  rationale: Das substantivierte Adjektiv bezeichnet Menschen, die durch Gerechtigkeit gekennzeichnet sind; die traditionelle, weiterhin verständliche Form wahrt die ethisch-religiöse Bedeutung.
- source_word: μνημονεύσουσιν
  choice: werden … denken
  rationale: „An den Herrn denken“ gibt das erinnernde, fortdauernde Bewussthalten im Deutschen natürlich wieder; „gedenken“ wäre formeller und könnte eine kultische Nuance verstärken.
- source_word: διὰ παντός
  choice: allezeit
  rationale: Die idiomatische Wendung bezeichnet beständige oder fortgesetzte Dauer. „Allezeit“ ist würdig, knapp und im Psalmregister geläufig.
- source_word: τοῦ κυρίου
  choice: den Herrn / des Herrn
  rationale: „Herr“ bewahrt das theologische Gewicht von κύριος und entspricht dem etablierten Sprachgebrauch biblischer Texte.
- source_word: ἐν ἐξομολογήσει
  choice: mit Dank
  rationale: Im Septuaginta- und Psalmengebrauch kann ἐξομολόγησις Dank, Lob oder Bekenntnis bezeichnen. Der Kontext und die Abgrenzung von dem in Vers 2 verwendeten Ausdruck für Lob sprechen hier besonders für Dank.
- source_word: δικαιώσει
  choice: indem sie … als gerecht anerkennen
  rationale: Das Substantiv bezeichnet Rechtfertigung beziehungsweise Erweis oder Anerkennung als gerecht. Die verbale Wiedergabe macht im Deutschen klar, dass die Urteile des Herrn als gerecht bestätigt werden, ohne den Sinn unnötig dogmatisch festzulegen.
- source_word: τὰ κρίματα τοῦ κυρίου
  choice: die Urteile des Herrn
  rationale: κρίματα bezeichnet richterliche Entscheidungen oder Urteile. „Urteile“ erhält den forensischen Sinn und bleibt zugleich verständlich.
theological_decisions:
- issue: Verhältnis der Gerechten zu Gottes κρίματα
  choice: „indem sie die Urteile des Herrn als gerecht anerkennen“
  alternative: „in Rechtfertigung der Urteile des Herrn“ / „und die Urteile des Herrn rechtfertigend“
  rationale: Die Übersetzung bewahrt den Gedanken, dass die Gerechten Gottes Urteile als gerecht bestätigen. Sie vermeidet die missverständliche Aussage, Gottes Urteile bedürften im modernen Sinn einer nachträglichen Rechtfertigung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit psalmtypischem „allezeit“. Die Satzstruktur folgt dem Griechischen, wird aber durch eine finite Umschreibung für δικαιώσει verständlich gemacht. Die echte Bedeutungsbreite von ἐξομολόγησις und δικαίωσις bleibt in der Fußnote sichtbar.
