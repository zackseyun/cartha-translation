translation:
  language: de
  text: Der Gerechte gibt acht und wird den Herrn für gerecht erklären[a]; er fällt und schaut, was Gott für ihn tun wird[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wird dem Herrn recht geben“; wörtlicher auch: „wird den Herrn rechtfertigen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „was Gott an ihm tun wird“.'
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: προσέχων
  choice: gibt acht
  rationale: Das präsentische Partizip beschreibt die anhaltend wachsame Haltung des Gerechten. „Gibt acht“ ist natürliches modernes Deutsch und legt nicht fest, ob vor allem geistige Aufmerksamkeit oder beobachtendes Warten gemeint ist.
- source_word: ὁ δίκαιος
  choice: der Gerechte
  rationale: Das substantivierte Adjektiv im maskulinen Singular bezeichnet exemplarisch den gerechten Menschen. „Der Gerechte“ ist knapp, würdig und im biblischen Deutsch gut verständlich.
- source_word: δικαιώσει
  choice: wird den Herrn für gerecht erklären
  rationale: Das Verb hat den Herrn zum Objekt. Die Wiedergabe bewahrt die Aussage, dass der Gerechte Gottes Gerechtigkeit anerkennt beziehungsweise bezeugt, ohne nahezulegen, er mache Gott erst gerecht.
- source_word: τὸν κύριον
  choice: den Herrn
  rationale: „Herr“ ist die übliche ehrerbietige Wiedergabe von κύριος, das hier Gott bezeichnet.
- source_word: ἔπεσεν
  choice: er fällt
  rationale: Der Aorist steht im Zusammenhang einer allgemeinen Beschreibung des Gerechten und kann daher gnomisch mit deutschem Präsens wiedergegeben werden. So bleibt der charakteristische Vorgang im Einklang mit dem folgenden Präsens ἀποβλέπει.
- source_word: ἀποβλέπει
  choice: schaut darauf
  rationale: Die Form bezeichnet ein gerichtetes Schauen. „Schaut darauf“ bewahrt die erwartungsvolle Blickrichtung, ohne stärker deutend „wartet“ einzusetzen.
- source_word: τί ποιήσει αὐτῷ ὁ θεός
  choice: was Gott für ihn tun wird
  rationale: Der Dativ αὐτῷ kann einen Begünstigten bezeichnen; der folgende Zusammenhang stützt diese Lesart. Die neutralere oder nachteilige Bedeutung „an ihm“ bleibt jedoch möglich und wird in einer Fußnote genannt.
theological_decisions:
- issue: Bedeutung von δικαιώσει bei Gott als Objekt
  choice: wird den Herrn für gerecht erklären
  alternative: wird dem Herrn recht geben; wird den Herrn rechtfertigen
  rationale: Die Hauptfassung bringt verständlich zum Ausdruck, dass der Gerechte die Gerechtigkeit des Herrn anerkennt. Sie vermeidet sowohl die missverständliche Vorstellung, ein Mensch mache Gott gerecht, als auch eine konfessionelle Zusatzdeutung.
- issue: Ob Gottes Handeln zugunsten des Gerechten oder lediglich an ihm geschieht
  choice: was Gott für ihn tun wird
  alternative: was Gott an ihm tun wird
  rationale: Der Dativ lässt beide Nuancen zu. Aufgrund des Zusammenhangs ist die begünstigende Lesart leicht vorzuziehen; die echte sprachliche Mehrdeutigkeit wird durch die Fußnote erhalten.
- issue: Zeitwert von ἔπεσεν
  choice: er fällt
  alternative: er fiel; er ist gefallen
  rationale: Im Kontext einer allgemeinen Gegenüberstellung beschreibt der Aorist wahrscheinlich einen charakteristischen Fall des Gerechten. Das Präsens gibt diesen gnomischen Sinn im Deutschen natürlich wieder, ohne ein bestimmtes vergangenes Ereignis vorauszusetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper poetischer Satzführung. Die maskuline Einzelform „der Gerechte“ folgt der griechischen Form und dient hier als exemplarische Personenbezeichnung. Das Semikolon erhält die Zweigliedrigkeit des griechischen Verses.
