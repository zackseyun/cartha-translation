translation:
  language: de
  text: 'Der Gerechte[a] wird es nicht gering achten, vom Herrn zurechtgewiesen zu werden[b]; sein Wohlgefallen[c] ist allezeit vor dem Herrn.


    [a] Der gedruckte Text bei Swete lautet δίκαιος παιδευόμενος („der Gerechte, der zurechtgewiesen wird“). Die Formen δίκαιας παιδευόμενους in der bereitgestellten Textübertragung beruhen auf einem OCR- oder Übertragungsfehler.


    [b] Oder: „wird die Zurechtweisung durch den Herrn nicht gering achten“.


    [c] Oder: „was ihm gefällt“; auch „sein Gefallen“.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der gedruckte Text bei Swete lautet δίκαιος παιδευόμενος („der Gerechte, der zurechtgewiesen wird“). Die Formen δίκαιας παιδευόμενους in der bereitgestellten Textübertragung beruhen auf einem OCR- oder Übertragungsfehler.
    reason: textual_variant
  - marker: b
