    reason: lexical_alternative
lexical_decisions:
- source_word: ὀλιγωρήσει
  choice: wird es nicht geringschätzen
  rationale: ὀλιγωρέω bezeichnet, etwas gering zu achten oder nicht ernst zu nehmen. „Geringschätzen“ bewahrt diese Wertung und passt zum Bezug auf die göttliche Zurechtweisung.
- source_word: 'δίκαιος / übermittelt: δίκαιας'
  choice: der Gerechte
  rationale: Die syntaktisch stimmige Lesart δίκαιος bezeichnet einen einzelnen gerechten Menschen generisch. Die ungewöhnliche übermittelte Form wird in einer Fußnote offengelegt.
- source_word: 'παιδευόμενος / übermittelt: παιδευόμενους'
  choice: vom Herrn zurechtgewiesen zu werden
  rationale: παιδεύω umfasst erziehende und korrigierende Einwirkung. „Zurechtgewiesen“ gibt im Zusammenhang den korrektiven Sinn natürlich wieder, ohne ihn auf bloße Bestrafung zu verengen.
- source_word: εὐδοκία
  choice: Wohlgefallen
  rationale: εὐδοκία kann Gefallen, Wohlwollen oder guten Willen bezeichnen. „Wohlgefallen“ wahrt die positive, willentliche Bedeutung und lässt die genaue Nuance offen.
- source_word: διὰ παντός
  choice: allezeit
  rationale: Die Wendung bezeichnet ununterbrochene beziehungsweise fortdauernde Geltung. „Allezeit“ ist knapp, würdig und idiomatisch biblisch, ohne altertümlich zu wirken.
- source_word: ἔναντι Κυρίου
  choice: vor dem Herrn
  rationale: Die formnahe Wendung bewahrt die räumlich-relationale Bildsprache des Griechischen.
- source_word: κυρίου / Κυρίου
  choice: Herr
  rationale: κύριος ist hier auf Gott bezogen. „Herr“ entspricht dem etablierten deutschen Bibelgebrauch; beide Vorkommen bleiben erhalten.
theological_decisions:
- issue: Subjekt des ersten Satzteils
  choice: Der Gerechte
  alternative: Sein Wohlgefallen wird die Gerechten nicht vernachlässigen
  rationale: Die grammatisch stimmige, für Swetes Drucktext bezeugte Lesart δίκαιος παιδευόμενος macht „der Gerechte“ zum Subjekt und entspricht der erkennbaren Anspielung auf Sprüche 3,11. Die abweichende übermittelte Form wird nicht stillschweigend verschwiegen.
- issue: Bezug von αὐτοῦ in „sein Wohlgefallen“
  choice: Bezug auf den Gerechten
  alternative: Bezug auf den Herrn
  rationale: Nach der Lesart mit „der Gerechte“ als Subjekt ist der nächstliegende Bezug der Gerechte. Da der Genitiv formal mehrdeutig wirken kann, wird die Formulierung nicht weiter ausgedeutet.
- issue: Wesen der göttlichen παιδεία
  choice: Zurechtweisung
  alternative: Erziehung; Züchtigung
  rationale: Die Übersetzung hält den formenden und korrigierenden Charakter zusammen und vermeidet sowohl eine Abschwächung zu bloßer Unterweisung als auch eine Verengung auf Strafe.
- issue: Wiedergabe von κύριος
  choice: Herr
  alternative: Gebieter
  rationale: Im Gottesbezug bewahrt „Herr“ die biblische und theologische Kontinuität, ohne eine zusätzliche konfessionelle Deutung einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Der Gerechte“ erhält den generischen Singular der grammatisch stimmigen griechischen Lesart. „Zurechtgewiesen“ ist allgemein verständlich und bewahrt den erziehend-korrigierenden Sinn; „Wohlgefallen“ hält die semantische und theologische Offenheit von εὐδοκία aufrecht.
