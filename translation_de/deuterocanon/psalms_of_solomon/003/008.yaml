  yaml_path: translation/deuterocanon/psalms_of_solomon/003/008.yaml
  text: The righteous continually watches over his house[b][a], to remove wrongdoing in his transgression.
translation:
  language: de
  text: Der Gerechte prüft beständig sein Haus[b], um Unrecht bei seinem Fehltritt zu beseitigen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in seinem Fehltritt“ oder „wegen seines Fehltritts“.'
    reason: lexical_alternative
  - marker: b
    text: Der Gerechte wird hier als jemand dargestellt, der seinen eigenen Haushalt aufmerksam prüft und gegen Unrecht vorgeht, nicht als jemand, dem moralisches Versagen gleichgültig ist.
    reason: cross_reference
lexical_decisions:
- source_word: ἐπισκέπτεται
  choice: prüft
  rationale: Im Zusammenhang mit dem eigenen Haus bezeichnet das Verb eine tätige, prüfende Aufsicht, nicht einen gesellschaftlichen Besuch.
- source_word: διὰ παντός
  choice: beständig
  rationale: Die Wendung bezeichnet ein fortdauerndes oder regelmäßig wiederkehrendes Handeln.
- source_word: ὁ δίκαιος
  choice: der Gerechte
  rationale: Die substantivierte Einzahl wird geschlechtsgenau und zugleich idiomatisch wiedergegeben.
- source_word: τὸν οἶκον αὐτοῦ
  choice: sein Haus
  rationale: „Haus“ kann wie im Griechischen sowohl das Wohnhaus als auch den Haushalt bezeichnen; diese Offenheit bleibt erhalten.
- source_word: τοῦ ἐξᾶραι
  choice: um … zu beseitigen
  rationale: Der artikulierte Infinitiv drückt hier den Zweck der prüfenden Aufsicht aus.
- source_word: ἀδικίαν
  choice: Unrecht
  rationale: Das Wort bezeichnet hier moralisches Fehlverhalten allgemein und ist nicht auf gesellschaftliche Ungerechtigkeit beschränkt.
- source_word: ἐν παραπτώματι αὐτοῦ
  choice: wenn er sich verfehlt
  rationale: Die Formulierung gibt die naheliegende Umstandsbedeutung von ἐν idiomatisch wieder und bezieht das Possessivpronomen auf den Gerechten; andere mögliche Nuancen werden in der Fußnote bewahrt.
theological_decisions:
- issue: Ob der Gerechte selbst fehlen kann
  choice: Der Vers lässt ausdrücklich zu, dass der Gerechte sich verfehlt und dann gegen das Unrecht vorgeht.
  alternative: Eine Wiedergabe, die den Bezug des Fehltritts unklar lässt oder dem Gerechten Sündlosigkeit zuschreibt.
  rationale: αὐτοῦ bezieht sich am natürlichsten auf den Gerechten. Die Aussage zeichnet ihn daher nicht als fehlerlos, sondern als jemanden, der sein Haus prüft und Unrecht beseitigt.
- issue: Bezug und Funktion von ἐν παραπτώματι αὐτοῦ
  choice: 'Als zeitlich-umständliche Aussage: „wenn er sich verfehlt“.'
  alternative: „bei seinem Fehltritt“, „in seinem Fehltritt“ oder kausal „wegen seines Fehltritts“.
  rationale: Die zeitliche Wiedergabe ist im Deutschen natürlich und kontextuell plausibel; da die griechische Präposition mehrere Nuancen zulässt, werden die Alternativen in einer Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Prüft“ vermittelt die aktive Aufsicht von ἐπισκέπτεται; „sein Haus“ bewahrt die mögliche Bedeutung „sein Haushalt“. Die Schlusswendung ist idiomatisch formuliert, während die semantische Spannweite der griechischen Präposition in der Fußnote erhalten bleibt.
