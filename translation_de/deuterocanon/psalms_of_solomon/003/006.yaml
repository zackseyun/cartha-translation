lexical_decisions:
- source_word: ἀποσκοπεύει
  choice: hält Ausschau
  rationale: Das Verb bezeichnet ein aufmerksames, erwartungsvolles Schauen. „Hält Ausschau“ gibt diesen fortdauernden Sinn natürlich und prägnant wieder.
- source_word: ὅθεν
  choice: woher
  rationale: Das Adverb bezeichnet Herkunft oder Ausgangspunkt; „woher“ bewahrt diese Bedeutung im Deutschen idiomatisch.
- source_word: ἥξει
  choice: kommen wird
  rationale: Die Futurform bezeichnet ein künftiges Kommen oder Eintreffen. In Verbindung mit „Rettung“ ist „kommen wird“ die natürliche deutsche Wiedergabe.
- source_word: σωτηρία
  choice: Rettung
  rationale: „Rettung“ deckt sowohl konkrete Befreiung als auch den weiteren religiösen Sinn des griechischen Begriffs ab, ohne den Vers unnötig einzuengen.
- source_word: αὐτῷ
  choice: ihm
  rationale: Der Dativ kann Richtung oder Begünstigung ausdrücken. „Ihm … kommen wird“ folgt der griechischen Konstruktion und klingt im Deutschen natürlich.
