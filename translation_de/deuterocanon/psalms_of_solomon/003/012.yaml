  source_fidelity: Die Übersetzung gibt προσεθήκεν ἁμαρτίας ἐφʼ ἁμαρτίαις treffend als fortgesetzte Anhäufung wieder und bewahrt den im Griechischen zweimaligen Plural mit „Sünden auf Sünden“. Die Hauptfassung versteht τῇ ζωῇ αὐτοῦ zulässig als Bereichsangabe; die Fußnote dokumentiert zugleich die ebenfalls naheliegende Lesart als Dativobjekt („seinem Leben ... hinzu“). Damit bleibt die syntaktische Nuance ohne Bedeutungsverschiebung transparent.
  naturalness: „Er häufte in seinem Leben Sünden auf Sünden“ ist modernes, würdiges und gut verständliches Standarddeutsch. Die Wortstellung ist natürlich; „Sünden auf Sünden“ trägt den bewusst repetitiven, kumulativen Stil des griechischen Textes.
  terminology: „Sünden“ ist für ἁμαρτίας sachgerecht und wahrt den Plural. „häufte ... auf“ ist als idiomatische Entfaltung von προστίθημι mit der ἐπί-Konstruktion angemessen. Die Fußnotenformulierung „fügte seinem Leben Sünden über Sünden hinzu“ hält die alternative syntaktische Anbindung präzise fest.
