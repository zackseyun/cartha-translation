  text: Er häufte in seinem Leben Sünden auf Sünden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Er fügte seinem Leben Sünden über Sünden hinzu.“'
    reason: Der Dativ τῇ ζωῇ αὐτοῦ kann statt als Angabe des Bereichs auch als indirektes Objekt zu „hinzufügen“ verstanden werden.
lexical_decisions:
- source_word: προσεθήκεν
  choice: häufte … auf
  rationale: Der Aorist von προστίθημι bezeichnet ein Hinzufügen. Zusammen mit ἐπί und dem wiederholten Substantiv gibt „häufte … auf“ die kumulative Bildsprache im Deutschen natürlich wieder.
- source_word: ἁμαρτίας ἐφʼ ἁμαρτίαις
  choice: Sünden auf Sünden
  rationale: Beide Formen stehen bewusst im Plural. Die Wiedergabe wahrt diese Intensivierung und die Vorstellung fortgesetzter Anhäufung.
- source_word: τῇ ζωῇ αὐτοῦ
  choice: in seinem Leben
  rationale: Der Dativ kann den Lebensbereich bezeichnen, in dem die Sünden angehäuft wurden. Diese Wiedergabe ist idiomatisch und hält die grammatische Alternative offen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Sünden auf Sünden“ bewahrt den auffälligen griechischen Plural; die Hauptfassung liest den Dativ als Bereichsangabe, während die Fußnote die plausible Deutung als indirektes Objekt dokumentiert.
