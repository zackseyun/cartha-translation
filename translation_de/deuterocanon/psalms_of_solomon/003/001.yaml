  text: Why do you sleep[a], O soul[b], and not bless the Lord?
translation:
  language: de
  text: Warum schläfst du, Seele, und lobst den Herrn nicht?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἵνα τί
  choice: Warum
  rationale: Die feste Frageverbindung leitet hier einen mahnenden, rhetorischen Aufruf ein; „Warum“ ist im modernen Deutsch natürlich und bewahrt die direkte Wirkung.
- source_word: ὑπνοῖς
  choice: schläfst du
  rationale: Das Präsens Aktiv in der zweiten Person Singular wird unmittelbar wiedergegeben und lässt sowohl einen gegenwärtigen Zustand als auch die mahnende rhetorische Frage erkennen.
- source_word: ψυχή
  choice: Seele
  rationale: Das Substantiv steht als direkte Anrede. Der Verzicht auf „meine“ bewahrt den griechischen Wortlaut, der kein Possessivpronomen enthält.
- source_word: εὐλογεῖς
  choice: lobst
  rationale: Bei einer an Gott gerichteten Äußerung bezeichnet εὐλογέω das preisende Reden von Gott. „Loben“ ist dafür im heutigen Deutsch natürlicher als „segnen“, ohne den doxologischen Sinn abzuschwächen.
- source_word: τὸν κύριον
  choice: den Herrn
  rationale: Im gottesdienstlichen Zusammenhang ist „der Herr“ die sachgerechte und etablierte Wiedergabe von κύριος.
theological_decisions: []
translation_notes:
  register: Direkte, mahnende Anrede in modernem, würdigem Standarddeutsch. Die knappe rhetorische Frage und die ausdrückliche Anrede „Seele“ bleiben erhalten; ein nicht im Griechischen stehendes „meine“ wird nicht ergänzt.
