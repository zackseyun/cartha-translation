base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/003/013.yaml
  text: He has fallen[a], because his fall is evil, and he will not rise. The destruction of the sinner is forever[b],
translation:
  language: de
  text: Er ist gefallen, denn sein Sturz ist schwer[a], und er wird nicht aufstehen. Das Verderben des Sünders währt ewig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „denn sein Fall ist böse“. Das griechische Wort für „Sturz“ kann auch „Leichnam“ bedeuten; dann wäre zu übersetzen: „denn sein Leichnam ist abscheulich“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔπεσεν
  choice: Er ist gefallen
  rationale: Das deutsche Perfekt gibt den eingetretenen Fall mit seiner fortdauernden Folge natürlich wieder.
- source_word: πονηρὸν τὸ πτῶμα αὐτοῦ
  choice: sein Sturz ist schwer
  rationale: Die Verbindung mit ἔπεσεν und dem folgenden Nichtaufstehen spricht primär für einen schweren, verhängnisvollen Sturz. „Schwer“ bewahrt den Ernst von πονηρός, ohne den Sturz selbst eindeutig moralisch als böse zu qualifizieren; die lexikalischen Alternativen werden in der Fußnote offengehalten.
- source_word: ἀνιστήσεται
  choice: er wird nicht aufstehen
  rationale: „Aufstehen“ entspricht dem Verb unmittelbar und fügt kein im Griechischen unausgesprochenes „wieder“ hinzu.
- source_word: ἀπώλεια
  choice: Verderben
  rationale: „Verderben“ ist gewichtig und kann endgültigen Untergang bezeichnen, ohne die Aussage durch eine speziellere dogmatische Deutung einzuengen.
- source_word: εἰς τὸν αἰῶνα
  choice: währt ewig
  rationale: Die idiomatische deutsche Formulierung gibt in diesem Gerichtszusammenhang die bleibende Dauer klar wieder.
theological_decisions:
- issue: Möglicher Anklang von ἀνίστημι an Auferstehung
  choice: wird nicht aufstehen
  alternative: wird nicht wieder auferstehen
  rationale: Die direkte Wiedergabe bewahrt sowohl den unmittelbaren Sinn des Nicht-mehr-Aufkommens als auch einen möglichen Auferstehungsanklang, ohne diesen ausdrücklich festzulegen.
- issue: Dauer des Verderbens
  choice: währt ewig
  alternative: besteht für das Zeitalter
  rationale: εἰς τὸν αἰῶνα bezeichnet hier am natürlichsten eine unbegrenzte, bleibende Dauer; eine Abschwächung auf ein einzelnes Zeitalter wäre kontextuell weniger wahrscheinlich.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe, harte Gerichtsrede und die Wiederholung von Fallen/Sturz/Aufstehen bleiben erhalten; der abschließende Gedanke wird als vollständiger deutscher Satz wiedergegeben.
