lexical_decisions:
- source_word: κύριος
  choice: der Herr
  rationale: Der bestimmte Artikel und der etablierte Gottes­titel werden im Deutschen natürlich mit „der Herr“ wiedergegeben.
- source_word: καθαρίζει
  choice: reinigt
  rationale: „Reinigt“ bewahrt den präsentischen Aspekt sowie die mögliche moralische und kultische Bedeutung von καθαρίζω.
- source_word: πᾶν ἄνδρα
  choice: jeden … Mann
  rationale: Die singularische Verbindung ist distributiv; die ausdrücklich maskuline Form des griechischen Textes bleibt erhalten.
- source_word: ὅσιον
  choice: frommen
  rationale: „Fromm“ bezeichnet hier verständlich eine von Treue zu Gott geprägte Person, ohne ὅσιος einseitig als kultische Heiligkeit zu deuten.
- source_word: οἶκον
  choice: Haus
  rationale: „Haus“ erhält die Wiederholung von οἶκος innerhalb des Zusammenhangs und kann wie das griechische Wort sowohl das Gebäude als auch die Hausgemeinschaft bezeichnen.
theological_decisions:
- issue: Bedeutungsumfang von ὅσιος
  choice: frommen
  alternative: heiligen; gottesfürchtigen
  rationale: Die Übersetzung wahrt den Gedanken persönlicher Gottesverbundenheit, ohne zwischen sittlicher Frömmigkeit, Bundestreue und Heiligkeit endgültig zu entscheiden.
- issue: Bedeutungsumfang von οἶκος
  choice: Haus
  alternative: Hausgemeinschaft; Haushalt
  rationale: Der Haupttext bewahrt die lexikalische Verbindung zu den vorangehenden Versen; eine Fußnote macht die mögliche kollektive Bedeutung sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper, dem griechischen Satzbau naher Formulierung. Die ausdrücklich männliche Bezeichnung und die Wiederholung von „Haus“ bleiben erhalten.
