  text: And the Lord cleanses every devout man and his house[a][b][c].
translation:
  language: de
  text: Und der Herr reinigt jeden frommen Mann[a] und sein Haus[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „gottesfürchtigen“ oder „heiligen Mann“.'
