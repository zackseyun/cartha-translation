  source_fidelity: 'Die Übersetzung gibt alle Elemente des griechischen Textes präzise wieder: καὶ als „Und“, ὁ κύριος als Gottesbezeichnung „der Herr“, das Präsens καθαρίζει als „reinigt“, die distributive maskuline Wendung πᾶν ἄνδρα ὅσιον als „jeden frommen Mann“ und τὸν οἶκον αὐτοῦ als „sein Haus“. Die präsentische Aussage und die Wiederholung von οἶκος im näheren Kontext bleiben gewahrt.'
  naturalness: „Und der Herr reinigt jeden frommen Mann und sein Haus“ ist knapp, verständlich und in modernem, würdigem Standarddeutsch idiomatisch. Die leicht formellere Wendung „frommer Mann“ ist für den religiös-weisheitlichen Registerton passend.
  terminology: „Der Herr“ ist die angemessene Wiedergabe von ὁ κύριος. „Reinigt“ erhält die offenbleibende kultisch-moralische Dimension von καθαρίζει. „Fromm“ gibt ὅσιος ohne unnötige dogmatische Festlegung wieder. „Haus“ folgt dem griechischen οἶκος und bewahrt dessen Wiederaufnahme aus dem Kontext; Fußnote b erläutert sachgerecht den möglichen weiteren Sinn.
