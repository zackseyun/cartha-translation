  yaml_path: translation/deuterocanon/psalms_of_solomon/003/016.yaml
  text: But those who fear the Lord will rise to eternal life, and their life in the light of the Lord will never cease.
translation:
  language: de
  text: Doch wer den Herrn fürchtet, wird zum ewigen Leben auferstehen, und sein Leben im Licht des Herrn wird nie mehr enden.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δὲ φοβούμενοι τὸν κύριον
  choice: Doch die, die den Herrn fürchten
  rationale: Das substantivierte Partizip bezeichnet eine Gruppe, deren bleibende Haltung auf den Herrn ausgerichtet ist. „Fürchten“ bewahrt das biblische Bedeutungsgewicht; „Doch“ gibt den Gegensatz von δέ wieder.
- source_word: ἀναστήσονται
  choice: werden … auferstehen
  rationale: Das griechische Futur Medium kann „aufstehen/auferstehen“ bedeuten. Zusammen mit „zum ewigen Leben“ ist die Auferstehungsbedeutung am naheliegendsten; die aktive deutsche Form vermeidet zugleich, einen griechischen Passivsatz zu unterstellen.
- source_word: εἰς ζωὴν αἰώνιον
  choice: zum ewigen Leben
  rationale: εἰς bezeichnet hier Ziel oder Ergebnis. „Zum ewigen Leben“ ist im Deutschen natürlich und erhält die eschatologische Aussage.
- source_word: ἐν φωτὶ Κυρίου
  choice: im Licht des Herrn
  rationale: Die räumlich-bildhafte Wendung wird unmittelbar und idiomatisch wiedergegeben, ohne die mögliche Bedeutung des Lichtbildes näher festzulegen.
- source_word: οὐκ ἐκλείψει ἔτι
  choice: wird nie mehr enden
  rationale: ἐκλείπω kann „ausbleiben, versagen, aufhören, enden“ bedeuten. Bezogen auf das Leben drückt „nie mehr enden“ dessen fortdauernden Bestand klar aus und gibt οὐκ … ἔτι natürlich wieder.
theological_decisions:
- issue: Auferstehungsaussage in ἀναστήσονται εἰς ζωὴν αἰώνιον
  choice: „werden zum ewigen Leben auferstehen“
  alternative: „werden zum ewigen Leben aufstehen“ beziehungsweise eine allgemeinere Aussage des Sich-Erhebens
  rationale: Die Verbindung von ἀναστήσονται mit εἰς ζωὴν αἰώνιον spricht am natürlichsten von künftiger Auferstehung zu ewigem Leben. Die Übersetzung macht diese im Kontext liegende Bedeutung deutlich, ohne ein göttliches Passiv einzuführen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau bleibt eng am griechischen Parallelismus, ist aber für heutige Leser flüssig. Keine Fußnoten erforderlich.
