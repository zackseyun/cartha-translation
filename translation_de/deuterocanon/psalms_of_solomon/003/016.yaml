  text: οἱ δὲ φοβούμενοι τὸν κύριον ἀναστήσονται εἰς ζωὴν αἰώνιον, καὶ ἡ ζωὴ αὐτῶν ἐν φωτὶ Κυρίου οὐκ ἐκλείψει ἔτι.
