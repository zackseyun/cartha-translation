lexical_decisions:
- source_word: αὕτη
  choice: Das
  rationale: Das Demonstrativpronomen verweist nachdrücklich auf das zuvor Beschriebene; im Deutschen ist „Das ist …“ hier natürlicher als „Dies ist …“.
- source_word: ἡ μερὶς
  choice: das Teil
  rationale: „Teil“ bewahrt den Sinn eines zugewiesenen Anteils oder Loses und entspricht zugleich dem würdevollen biblischen Sprachgebrauch.
- source_word: τῶν ἁμαρτωλῶν
  choice: der Sünder
  rationale: Der Genitiv Plural bezeichnet Menschen, die durch Sünde gekennzeichnet sind; „der Sünder“ ist knapp und eindeutig.
- source_word: εἰς τὸν αἰῶνα
  choice: für immer
  rationale: Die feste Wendung bezeichnet hier zeitlich unbegrenzte Dauer; „für immer“ gibt dies in natürlichem modernem Deutsch wieder.
