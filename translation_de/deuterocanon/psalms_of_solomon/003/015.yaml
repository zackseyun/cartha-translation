  naturalness: Die Satzform ist knapp und idiomatisch. Allerdings ist „das Teil“ im modernen Standarddeutschen überwiegend ein Gegenstand bzw. Bauteil; für einen Anteil oder ein Los lautet die übliche Form „der Teil“ oder, noch eindeutiger, „der Anteil“.
