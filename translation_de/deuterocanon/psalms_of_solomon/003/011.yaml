  yaml_path: translation/deuterocanon/psalms_of_solomon/003/011.yaml
  text: A sinner stumbled[a], and he curses his life, the day of his birth and his mother’s labor pains.
translation:
  language: de
  text: Ein Sünder strauchelte[a] und verflucht sein Leben, den Tag seiner Geburt und die Wehen seiner Mutter.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: kam zu Fall. Das griechische Verb kann sowohl ein wörtliches Straucheln als auch bildlich einen Fall ins Unglück bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσέκοψεν
  choice: strauchelte
  rationale: Das Verb προσκόπτω kann ein wörtliches Stolpern oder bildlich einen Fall ins Unglück bezeichnen. „Strauchelte“ bewahrt das anschauliche Bild und lässt dessen Tragweite offen.
- source_word: ἁμαρτωλός
  choice: ein Sünder
  rationale: Das substantivierte Adjektiv bezeichnet hier unmittelbar einen sündigen Menschen; „ein Sünder“ ist knapp, geläufig und entspricht der unbestimmten griechischen Form.
- source_word: καταρᾶται
  choice: verflucht
  rationale: Das Verb bedeutet, einen Fluch auszusprechen. „Verflucht“ gibt seine Stärke direkt und ohne erklärende Erweiterung wieder.
- source_word: ζωὴν αὐτοῦ
  choice: sein Leben
  rationale: Die Wendung bezeichnet das eigene Leben des Sünders als Gegenstand seines Fluches.
- source_word: τὴν ἡμέραν γενέσεως αὐτοῦ
  choice: den Tag seiner Geburt
  rationale: Die formell gehaltene Wendung entspricht dem Griechischen genauer und würdevoller als das im Deutschen mehrdeutige „Geburtstag“.
- source_word: ὠδῖνας μητρός
  choice: die Wehen seiner Mutter
  rationale: ὠδῖνες bezeichnet Geburtswehen. „Die Wehen seiner Mutter“ erhält das konkrete Bild und ist in modernem Deutsch verständlich.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Wechsel vom griechischen Aorist („strauchelte“) zum Präsens („verflucht“) bleibt erhalten. Die Reihung nach „sein Leben“ folgt der appositionellen Struktur des Ausgangstextes und deutet Geburtstag und Wehen als nähere Entfaltung dessen, was der Sünder verflucht.
