translation:
  language: de
  text: Er leistet Sühne[c] für eine unwissentlich begangene Sünde[a], indem er fastet und seine Seele demütigt[b];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „für Unwissenheit“; auch: „für eine aus Unwissenheit begangene Verfehlung“.'
    reason: lexical_alternative
  - marker: b
    text: „Seine Seele demütigen“ ist eine biblische Wendung für Selbstverleugnung beziehungsweise Buße.
    reason: cultural_note
  - marker: c
    text: Der griechische Aorist kann auch mit „Er leistete Sühne“ wiedergegeben werden; hier ist er als allgemeingültige beziehungsweise wiederholte Handlung verstanden.
    reason: textual_ambiguity
lexical_decisions:
- source_word: ἐξιλάσατο
  choice: schafft Sühne
  rationale: Die Wendung bewahrt das kultisch-religiöse Gewicht des Verbs, ohne es auf eine bestimmte Sühnetheorie festzulegen. Das Präsens gibt den Aorist als gnomischen Aorist wieder, passend zur allgemeinen Beschreibung des Gerechten im Zusammenhang.
- source_word: περὶ ἀγνοίας
  choice: für eine unwissentlich begangene Sünde
  rationale: ἀγνοία bezeichnet in diesem Sühnekontext nicht bloß fehlendes Wissen, sondern wahrscheinlich eine aus Unwissenheit beziehungsweise unabsichtlich begangene Verfehlung. „Sünde“ macht den kultischen Sinn verständlich, während die Fußnote die wörtlichere Möglichkeit offenhält.
- source_word: ἐν νηστείᾳ
  choice: indem er fastet
  rationale: ἐν beschreibt hier Mittel oder Art und Weise. Die deutsche Nebensatzkonstruktion ist natürlich und verbindet das Fasten klar mit dem Sühnehandeln.
- source_word: καὶ ταπεινώσει ψυχὴν αὐτοῦ
  choice: und seine Seele demütigt
  rationale: Die Wiedergabe erhält die biblisch-semitische Ausdrucksweise mit „Seele“, statt sie vollständig zu „sich selbst demütigt“ zu glätten.
theological_decisions:
- issue: Bedeutung von Sühne in Verbindung mit Fasten und Selbsterniedrigung
  choice: „schafft Sühne … indem er fastet und seine Seele demütigt“
  alternative: „bittet um Vergebung …“
  rationale: Der Text schreibt dem Handeln ausdrücklich sühnende Bedeutung zu. Eine Abschwächung zu einer bloßen Bitte um Vergebung würde die kultische Aussage des griechischen Verbs reduzieren; zugleich legt „Sühne schaffen“ keine einzelne dogmatische Erklärung des Vorgangs fest.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die kultische Sprache bleibt erhalten; die biblische Wendung „seine Seele demütigen“ wird bewusst nicht vollständig geglättet. Das Präsens folgt der wahrscheinlich gnomischen Funktion des Aorists im Zusammenhang.
