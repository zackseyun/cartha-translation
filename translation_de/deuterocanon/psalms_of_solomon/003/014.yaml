translation:
  language: de
  text: Und man wird sich ganz gewiss nicht an ihn erinnern, wenn er die Gerechten besucht[a][b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Das nicht genannte Subjekt von „wird sich erinnern“ kann sich auf den Untergang des Sünders beziehen. Das Subjekt von „besucht“ bleibt davon unabhängig im Griechischen ungenannt.'
    reason: alternative_reading
  - marker: b
    text: „Besucht“ kann hier auch „aufsucht“, „nach ihnen sieht“ oder „sich ihrer annimmt“ bedeuten.
    reason: lexical_alternative
  - marker: c
    text: Das Subjekt von „besucht“ wird im Griechischen nicht ausdrücklich genannt; im Zusammenhang kann Gott gemeint sein.
    reason: source_ambiguity
lexical_decisions:
- source_word: οὐ μὴ
  choice: ganz gewiss nicht
  rationale: Die doppelte Verneinung ist nachdrücklich. „Ganz gewiss nicht“ gibt diese Verstärkung in natürlichem modernem Deutsch wieder.
- source_word: μνησθήσεται
  choice: man wird sich … erinnern
  rationale: Die unpersönliche deutsche Form gibt das griechische Passiv „wird erinnert werden“ idiomatisch wieder, ohne den nicht ausdrücklich genannten Handelnden festzulegen.
- source_word: ἐπισκέπτηται
  choice: besucht
  rationale: „Besucht“ bleibt dem griechischen Verb nahe und wahrt dessen mögliche Bedeutungsnuancen von Aufsuchen, Beachten und fürsorglichem Annehmen.
- source_word: δικαίους
  choice: die Gerechten
  rationale: Dies ist in diesem religiös-ethischen Zusammenhang die direkte und geläufige Wiedergabe.
- source_word: implicit subject of μνησθήσεται
  choice: ihn
  rationale: Der Sünder aus dem Zusammenhang ist als Bezug am wahrscheinlichsten; die mögliche Beziehung auf seinen Untergang wird in einer Fußnote offengehalten.
- source_word: implicit subject of ἐπισκέπτηται
  choice: er
  rationale: Das Griechische nennt kein Subjekt. Das Pronomen bildet die formale Offenheit ab; im Zusammenhang kann besonders Gottes Zuwendung zu den Gerechten gemeint sein.
theological_decisions:
- issue: Nicht genanntes Subjekt von μνησθήσεται
  choice: Bezug auf den Sünder
  alternative: Bezug auf seinen Untergang
  rationale: Die fortlaufende Aussage über das Schicksal des Sünders stützt den persönlichen Bezug, doch die Syntax im Umfeld lässt auch den Untergang als Bezug zu.
- issue: Bedeutung und Subjekt von ἐπισκέπτηται
  choice: „er … besucht“, ohne ausdrückliche Identifizierung
  alternative: „er sich der Gerechten annimmt“ beziehungsweise ausdrücklicher Bezug auf Gott
  rationale: Das Verb kann fürsorgliche oder göttliche Zuwendung bezeichnen, aber weder diese Nuance noch das Subjekt sollte im Haupttext stärker festgelegt werden als im Griechischen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die emphatische Verneinung und die im Griechischen nicht ausdrücklich genannten Subjekte bleiben erkennbar; die Pronomenmehrdeutigkeit wird durch Fußnoten erläutert.
