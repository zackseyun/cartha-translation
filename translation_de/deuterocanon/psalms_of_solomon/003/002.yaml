  text: Sing a hymn and praise to God[a], the One worthy of praise. Sing, and keep watch for his watching[c][b], for a psalm to God from a good heart is good.
translation:
  language: de
  text: Singt Gott, dem Lobenswerten[a], einen Hymnus und einen Lobpreis. Singe[b] und wache im Blick auf sein Wachen[c]; denn ein Psalm für Gott aus gutem Herzen ist gut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dem Gepriesenen“ beziehungsweise „Gott, der gepriesen wird“.'
    reason: lexical_alternative
  - marker: b
    text: Der griechische Text wechselt hier von der Mehrzahl („Singt“) zur Einzahl („Singe“).
    reason: source_form
  - marker: c
    text: 'Die griechische Wendung ist ungewöhnlich; auch möglich: „wache im Blick auf seine Wachsamkeit“ oder „wache im Blick auf sein Wachsein“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὕμνον
  choice: Hymnus
  rationale: „Hymnus“ bezeichnet wie das griechische Wort ein feierliches Loblied und hält den Ausdruck von αἶνος („Lobpreis“) unterscheidbar.
- source_word: αἶνον
  choice: Lobpreis
  rationale: „Lobpreis“ gibt den substantivischen Sinn von αἶνος wieder und lässt sich im Deutschen als zweites Objekt zu „singt“ verstehen.
- source_word: ψάλλετε / ψάλλε
  choice: singt / singe
  rationale: Im gottesdienstlichen Zusammenhang bezeichnet ψάλλω das Singen eines Liedes oder Psalms. Der Wechsel vom Plural zum Singular wird entsprechend dem griechischen Text bewahrt.
- source_word: τῷ θεῷ τῷ αἰνετῷ
  choice: Gott, dem Lobenswerten
  rationale: αἰνετός kann sowohl „gelobt“ als auch „lobenswert“ bedeuten. „Dem Lobenswerten“ ist im Deutschen knapp und bewahrt den auf Gott bezogenen Beiwortcharakter; die alternative Deutung wird in einer Fußnote genannt.
- source_word: γρηγόρησον
  choice: sei wach
  rationale: Die Wendung drückt Wachheit und Aufmerksamkeit aus. „Sei wach“ bewahrt zugleich die Wortverwandtschaft mit dem folgenden Substantiv „Wachsein“.
- source_word: ἐπὶ τὴν γρηγόρησιν αὐτοῦ
  choice: für sein Wachsein
  rationale: Die griechische Verbindung ist ungewöhnlich und in ihrer genauen Beziehung offen. Die Wiedergabe wahrt die auffällige Wiederholung des Wortstamms, ohne sie vorschnell als Gottes Schutz, Eingreifen oder Erwartung auszudeuten.
- source_word: ψαλμός
  choice: Psalm
  rationale: „Psalm“ entspricht dem religiös-literarischen Charakter des Ausdrucks und passt zum Zusammenhang des Singens vor Gott.
- source_word: ἐξ ἀγαθῆς καρδίας
  choice: aus gutem Herzen
  rationale: Die Formulierung folgt dem Grundsinn von ἀγαθός und vermeidet die nicht ausdrücklich geforderte Verengung auf „reines“ oder „aufrichtiges“ Herz.
- source_word: ἀγαθὸς … ἀγαθῆς
  choice: gut … gutem
  rationale: Die Wiederholung von ἀγαθός wird beibehalten, da sie die schlichte rhetorische Entsprechung des griechischen Satzes prägt.
theological_decisions:
- issue: Bedeutung von Gottes γρηγόρησις
  choice: sein Wachsein
  alternative: seine Wachsamkeit / sein Wachen
  rationale: Die ungewöhnliche Aussage wird nicht näher theologisch bestimmt. So bleibt offen, ob Gottes fortdauernde Wachheit, seine Aufmerksamkeit oder sein wachsames Handeln gemeint ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die absichtliche Wiederholung von „gut“ sowie der ungewöhnliche Ausdruck „sei wach für sein Wachsein“ bewahren Form und Spannung des griechischen Textes; die Fußnoten erläutern echte lexikalische und grammatische Offenheiten.
