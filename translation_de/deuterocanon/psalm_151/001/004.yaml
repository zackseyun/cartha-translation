  text: He himself sent out his messenger[a], and took me from my father's sheep, and anointed me with the oil of his anointing.
translation:
  language: de
  text: Er selbst sandte seinen Boten[a] aus, nahm mich von den Schafen meines Vaters weg und salbte mich mit dem Öl seiner Salbung.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »seinen Engel«. Das griechische Wort kann sowohl einen menschlichen Boten als auch ein himmlisches Wesen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτὸς
  choice: Er selbst
  rationale: Das ausdrücklich gesetzte Pronomen ist betont; »Er selbst« gibt diesen Nachdruck im Deutschen natürlich wieder.
- source_word: ἐξαπέστειλεν
  choice: sandte … aus
  rationale: Die Präfigierung des Verbs wird durch das idiomatische deutsche »aussenden« gewahrt.
- source_word: τὸν ἄγγελον αὐτοῦ
  choice: seinen Boten
  rationale: ἄγγελος kann einen menschlichen Boten oder einen Engel bezeichnen. Im Zusammenhang mit Davids Salbung ist »Bote« sachlich naheliegend, ohne die lexikalische Mehrdeutigkeit in der Fußnote zu verschweigen.
- source_word: ἦρέν με
  choice: nahm mich … weg
  rationale: Die Form von αἴρω bezeichnet hier das Wegnehmen beziehungsweise Herausholen Davids von den Schafen; »nahm … weg« bleibt dem Bild und der Syntax nahe.
- source_word: ἐκ τῶν προβάτων τοῦ πατρός μου
  choice: von den Schafen meines Vaters
  rationale: Die konkrete Bedeutung »Schafe« wird gegenüber dem kollektiv-abstrakteren »Herde« bewahrt.
- source_word: ἔχρισέν με
  choice: salbte mich
  rationale: »Salben« ist die direkte und im königlichen Einsetzungskontext geläufige Entsprechung zu χρίω.
- source_word: ἐν τῷ ἐλαίῳ τῆς χρίσεως αὐτοῦ
  choice: mit dem Öl seiner Salbung
  rationale: Instrumentales ἐν wird idiomatisch mit »mit« wiedergegeben; die Genitivverbindung bleibt erhalten und verknüpft das Öl ausdrücklich mit der von Gott ausgehenden Salbung.
theological_decisions:
- issue: Bedeutung von ἄγγελος beim göttlichen Aussenden
  choice: Bote
  alternative: Engel
  rationale: Der griechische Ausdruck lässt beides zu. Der Kontext der Salbung Davids legt einen gesandten menschlichen Boten nahe; die mögliche übernatürliche Lesart wird jedoch nicht ausgeschlossen, sondern in einer Fußnote dokumentiert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit enger Bindung an die griechische Satzstruktur. Die dreigliedrige Abfolge göttlichen Handelns bleibt erhalten; unnötig altertümliche Wendungen werden vermieden.
