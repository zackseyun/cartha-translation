translation:
  language: de
  text: Meine Hände machten ein Instrument[a]; meine Finger fügten ein Saitenspiel zusammen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein Musikinstrument“. Das griechische Wort ὄργανον kann allgemein ein Werkzeug oder Instrument bezeichnen; hier ist wegen des folgenden Saitenspiels ein Musikinstrument gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: αἱ χεῖρές μου
  choice: Meine Hände
  rationale: Direkte und natürliche Wiedergabe der Possessivkonstruktion ohne zusätzliche Hervorhebung.
- source_word: ἐποίησαν
  choice: machten
  rationale: Das gewöhnliche ποιέω bezeichnet hier das Herstellen; „machten“ ist schlicht, verständlich und bewahrt den Parallelismus.
- source_word: ὄργανον
  choice: ein Instrument
  rationale: Im Zusammenhang mit ψαλτήριον ist die musikalische Bedeutung naheliegend; der allgemeinere Ausdruck des Griechischen bleibt erhalten.
- source_word: οἱ δάκτυλοί μου
  choice: meine Finger
  rationale: Direkte, idiomatische Entsprechung unter Beibehaltung des Plurals.
- source_word: ἥρμοσαν
  choice: fügten … zusammen
  rationale: ἁρμόζω kann „zusammenfügen“, „verbinden“ oder „anpassen“ bedeuten. Beim Bau eines Instruments gibt „zusammenfügen“ den handwerklichen Vorgang wieder, ohne die mögliche, aber nicht zwingende Bedeutung „stimmen“ einzutragen.
- source_word: ψαλτήριον
  choice: ein Saitenspiel
  rationale: ψαλτήριον bezeichnet ein gezupftes Saiteninstrument. „Saitenspiel“ ist im Deutschen verständlicher als das traditionelle „Psalterium“ und vermeidet die zu enge Festlegung auf Leier oder Harfe.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache mit knappem poetischem Parallelismus. „Saitenspiel“ wahrt die Unbestimmtheit der antiken Instrumentenbezeichnung besser als eine genaue Zuordnung zu Leier oder Harfe.
