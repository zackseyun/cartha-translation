base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalm_151/001/001.yaml
  text: I was small among my brothers, and younger in my father's house; I was shepherding my father's sheep.
translation:
  language: de
  text: Ich war klein unter meinen Brüdern und jünger im Haus meines Vaters; ich hütete die Schafe meines Vaters.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μικρός
  choice: klein
  rationale: Gibt die bewusst offene Bedeutung des griechischen Adjektivs wieder, das geringe Größe, Jugend oder niedrigen Rang bezeichnen kann, ohne sie auf »der Jüngste« festzulegen.
- source_word: νεώτερος
  choice: jünger
  rationale: Bewahrt den Komparativ des griechischen Textes; »der Jüngste« wäre eine nicht ausdrücklich markierte Steigerung.
- source_word: ἔποιμαινον
  choice: ich hütete
  rationale: Das Imperfekt bezeichnet Davids fortdauernde bzw. gewohnheitsmäßige Tätigkeit als Hirte; »hütete« ist im Deutschen natürlich und präzise.
- source_word: τὰ πρόβατα
  choice: die Schafe
  rationale: Direkte und idiomatische Wiedergabe des griechischen Ausdrucks.
theological_decisions:
- issue: Davids Stellung unter seinen Brüdern
  choice: klein … und jünger
  alternative: gering … und der Jüngste
  rationale: Die Übersetzung hält die beiden griechischen Adjektive auseinander und bewahrt bei νεώτερος die grammatische Komparativform, ohne Davids genaue Rang- oder Altersstellung dogmatisch festzulegen.
translation_notes:
  register: Modernes, schlichtes und würdiges Standarddeutsch. Die Wiederholung »meines Vaters« bleibt entsprechend dem griechischen Parallelismus erhalten.
