  text: And who will report[a] to my Lord? The Lord himself[b], he himself hears.
translation:
  language: de
  text: Und wer wird meinem Herrn berichten[a]? Der Herr selbst – er selbst hört[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »melden«, »verkünden« oder »bekannt machen«. Das Verb kann Melden, Verkünden oder Bekanntmachen bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Das Griechische wiederholt das betonte Pronomen: »Der Herr selbst – er selbst hört.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: τίς
  choice: wer
  rationale: Das Fragepronomen leitet eine rhetorische Frage ein; »wer« ist die unmittelbare und natürliche deutsche Entsprechung.
- source_word: ἀναγγελεῖ
  choice: wird … melden
  rationale: Das Futur von ἀναγγέλλω bezeichnet das Bekanntmachen, Berichten oder Verkünden. »Melden« passt zur Mitteilung an einen Höhergestellten und bewahrt die Zukunftsform; das im Griechischen unausgesprochene Objekt wird im Deutschen idiomatisch mit »es« wiedergegeben.
- source_word: τῷ κυρίῳ μου
  choice: meinem Herrn
  rationale: Die Dativform bezeichnet den Empfänger der Mitteilung. »Herr« bewahrt sowohl die Anrede als auch die Verbindung mit dem unmittelbar folgenden κύριος.
- source_word: αὐτὸς Κύριος
  choice: Der Herr selbst
  rationale: Das erste αὐτός hebt κύριος ausdrücklich hervor. Die deutsche Stellung mit »selbst« gibt diese Betonung natürlich wieder.
- source_word: αὐτός
  choice: er selbst
  rationale: Die Wiederholung des betonten Pronomens wird beibehalten, statt sie stilistisch einzuebnen.
- source_word: εἰσακούει
  choice: hört
  rationale: εἰσακούω kann schlichtes Hören, aufmerksames Hören oder erhörendes Hören bezeichnen. »Hört« bewahrt hier die größtmögliche semantische Offenheit.
theological_decisions:
- issue: Wiedergabe von κύριος an beiden Stellen
  choice: Herr
  alternative: Gebieter
  rationale: »Herr« ist in beiden Vorkommen lexikalisch angemessen, erhält die erkennbare Wiederholung und legt nicht fest, ob ausschließlich eine menschliche Herrschaftsbezeichnung oder ein göttlicher Titel im Vordergrund steht.
- issue: Bedeutungsumfang von εἰσακούει
  choice: hört
  alternative: erhört
  rationale: »Erhört« würde eine günstige Antwort stärker ausdrücklich machen. Da der griechische Ausdruck diese Nuance tragen kann, sie im vorliegenden absoluten Gebrauch aber nicht zwingend festlegt, bleibt die Übersetzung bei »hört«.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorische Kürze und die auffällige Wiederholung von αὐτός bleiben erhalten. Der Gedankenstrich macht die emphatische Neuaufnahme hörbar, ohne die Syntax auszudeuten.
