  text: My brothers were handsome and tall, but the Lord did not take pleasure in them[a].
translation:
  language: de
  text: Meine Brüder waren gut aussehend und groß, doch der Herr fand kein Gefallen an ihnen[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „war mit ihnen nicht zufrieden“ oder „hatte keine Freude an ihnen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀδελφοί
  choice: Brüder
  rationale: Der maskuline Plural bezeichnet im Kontext Davids männliche Brüder; „Brüder“ gibt dies präzise wieder.
- source_word: καλοί
  choice: stattlich
  rationale: In Verbindung mit μεγάλοι beschreibt καλοί wahrscheinlich das ansprechende äußere Erscheinungsbild. „Stattlich“ klingt im Deutschen natürlich und vermeidet eine moralische Deutung wie „gut“.
- source_word: μεγάλοι
  choice: groß
  rationale: Das Wort bedeutet grundsätzlich „groß“ und bezeichnet hier wahrscheinlich die beeindruckende Körpergröße oder Statur, ohne die mögliche Bedeutungsbreite unnötig auf „hochgewachsen“ zu verengen.
- source_word: οὐκ εὐδόκησεν
  choice: fand kein Gefallen an
  rationale: Diese idiomatische deutsche Wendung bewahrt den Sinn göttlichen Wohlgefallens beziehungsweise der Zustimmung, ohne daraus ausdrücklich eine Nicht-Erwählung zu machen.
- source_word: Κύριος
  choice: der Herr
  rationale: Κύριος bezeichnet hier den Gott Israels; die traditionelle und im Deutschen natürliche Wiedergabe lautet „der Herr“.
theological_decisions:
- issue: Art der Beurteilung von Davids Brüdern durch den Herrn
  choice: Der Herr fand kein Gefallen an ihnen.
  alternative: Der Herr erwählte sie nicht.
  rationale: εὐδόκησεν bezeichnet Wohlgefallen oder Zustimmung, nicht ausdrücklich eine Erwählung. Die Übersetzung wahrt diese Zurückhaltung und trägt keine Formulierung aus 1. Samuel 16 in den Vers ein.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Stattlich und groß“ beschreibt das eindrucksvolle Äußere in verständlicher Sprache; „fand kein Gefallen an“ ist gehoben, aber weiterhin allgemein verständlich und entspricht dem biblischen Ton.
