lexical_decisions:
- source_word: ἐξῆλθον
  choice: Ich zog hinaus
  rationale: Der Aorist von ἐξέρχομαι bezeichnet das Hinausgehen. „Ich zog hinaus“ ist im erzählenden, kämpferischen Zusammenhang natürlich und bewahrt die erste Person Singular.
- source_word: εἰς συνάντησιν
  choice: um … entgegenzutreten
  rationale: Die Wendung bezeichnet das Hinausgehen zur Begegnung mit jemandem. Im Zusammenhang des Kampfes gibt „entgegentreten“ den Zweck idiomatisch wieder, ohne den Ausgang der Begegnung vorwegzunehmen.
- source_word: τῷ ἀλλοφύλῳ
  choice: dem Fremden
  rationale: ἀλλόφυλος bezeichnet wörtlich einen Angehörigen eines anderen Volkes und wird in der Septuaginta häufig für einen Philister gebraucht. Der Haupttext wahrt den allgemeineren griechischen Ausdruck.
- source_word: ἐπικατηράσατό με
  choice: er verfluchte mich
  rationale: Das Verb bezeichnet das Aussprechen oder Herabrufen eines Fluches gegen jemanden. Die knappe Wiedergabe ist präzise und verständlich.
- source_word: ἐν τοῖς εἰδώλοις αὐτοῦ
  choice: bei seinen Götzen
  rationale: ἐν kann hier den Bezug beziehungsweise die angerufene Macht des Fluches ausdrücken. „Bei seinen Götzen“ wahrt die knappe Formulierung und lässt die genauere Nuance offen.
theological_decisions:
- issue: Bedeutung von ἀλλόφυλος im Zusammenhang von David und Goliat
  choice: dem Fremden
  alternative: dem Philister
  rationale: Obwohl der Erzählzusammenhang auf den Philister Goliat weist, verwendet der griechische Text den allgemeineren Ausdruck für einen Angehörigen eines anderen Volkes. Diese Spannung bleibt durch Haupttext und Fußnote sichtbar.
- issue: Bedeutung von ἐν τοῖς εἰδώλοις αὐτοῦ
  choice: bei seinen Götzen
  alternative: im Namen seiner Götzen
  rationale: Die Präpositionalphrase kann das Mittel, den Bezugsrahmen oder die angerufene Macht des Fluches bezeichnen. Der Haupttext bleibt formal knapp; die Fußnote bietet die explizitere Deutung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit erzählerischem Klang. „Entgegentreten“ passt zur bevorstehenden Kampfbegegnung; die Fußnoten bewahren die lexikalischen Alternativen des griechischen Textes.
