review_pass:
  verdict: revise
  source_fidelity: Der Entwurf gibt die erste Person Singular von ἐξῆλθον, das Ziel der Begegnung, den generischen Ausdruck ἀλλόφυλος sowie den gegen David gerichteten Fluch korrekt wieder. „Entgegentreten“ verengt jedoch εἰς συνάντησιν auf eine konfrontative Begegnung, während das Griechische zunächst nur „zur Begegnung/um zu treffen“ sagt. „Ich ging hinaus“ ist zudem die unmarkiertere, quellentreuere Wiedergabe von ἐξῆλθον als das militärisch gefärbtere „Ich zog hinaus“.
  naturalness: „Ich ging hinaus, um dem Fremden zu begegnen“ ist modernes, würdiges und idiomatisches Standarddeutsch. Die Satzfügung mit dem Semikolon entspricht der Vorlage und funktioniert im Deutschen.
  terminology: „der Fremde“ bewahrt die im griechischen Text gewählte allgemeine Bezeichnung, ohne den im Kontext naheliegenden Philister in den Haupttext einzutragen. „Götzen“ entspricht εἴδωλα. „bei seinen Götzen“ kann im Deutschen die Anrufung zwar andeuten, bleibt aber weniger klar; „im Namen seiner Götzen“ gibt die wahrscheinliche Fluchformel natürlich wieder, während die formnähere Alternative in der Fußnote erhalten bleibt.
  issues:
  - severity: medium
    issue: „entgegenzutreten“ ist semantisch enger als εἰς συνάντησιν.
    rationale: Das Verb kann ausdrücklich ein Sich-entgegenstellen oder Konfrontieren bezeichnen. Die griechische Wendung besagt hier lediglich, dass David hinausging, um den anderen zu treffen/begegnen; der Kampfkontext darf nicht in das Verb eingetragen werden.
  - severity: low
    issue: „zog hinaus“ fügt einen leicht martialisch-feierlichen Ton hinzu.
    rationale: ἐξῆλθον bedeutet schlicht „ging hinaus“ beziehungsweise „kam heraus“. Die unmarkierte Formulierung ist in modernem Standarddeutsch näher am Ausgangstext.
  - severity: low
    issue: Die Haupttextformulierung „bei seinen Götzen“ ist für die beabsichtigte Anrufungsnuance weniger unmittelbar verständlich.
    rationale: Die Präposition kann im Deutschen auch lokal wirken. „Im Namen seiner Götzen“ ist im Kontext eines ausgesprochenen Fluches klar und idiomatisch; die offenere, formnähere Möglichkeit bleibt als Fußnote bestehen.
