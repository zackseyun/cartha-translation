revisions:
- from: Ich zog hinaus, um dem Fremden[a] entgegenzutreten, und er verfluchte mich bei seinen Götzen[b];
  to: Ich ging hinaus, um dem Fremden[a] zu begegnen, und er verfluchte mich im Namen seiner Götzen[b];
  rationale: Die Revision vermeidet die nicht ausdrücklich im Griechischen enthaltene Konfrontationsnuance von „entgegentreten“ und gibt ἐξῆλθον unmarkiert wieder. Die Formulierung zum Fluch wird im Deutschen idiomatischer gefasst; die engere beziehungsweise formnähere Präpositionalalternative bleibt durch die Fußnote transparent. Die allgemeine Bezeichnung für den Gegner und damit die bewusste Zurückhaltung gegenüber „Philister“ bleiben gewahrt.
