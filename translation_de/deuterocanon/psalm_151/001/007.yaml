  source_fidelity: Die Übersetzung trifft die Handlungsabfolge und die Bedeutungen von ἀπεκεφάλισα, ὄνειδος und ἐξ υἱῶν Ἰσραήλ grundsätzlich gut. „sein eigenes Schwert“ ist jedoch im Deutschen ohne eindeutigen Bezug missverständlich und kann besagen, David habe sein eigenes Schwert gezogen. Das griechische παρ’ αὐτοῦ bezeichnet die Waffe, die dem Gegner gehört bzw. von seiner Person genommen wird.
  naturalness: Der Satz ist ansonsten knapp, würdevoll und modernes Standarddeutsch. „Ich zog ihm das Schwert heraus“ ist natürlich und macht den im griechischen Text ausgedrückten Bezug zum Gegner klar.
  terminology: „Enthauptete“, „Schmach“ und „Söhne Israels“ sind semantisch angemessen. Die Fußnote zur traditionellen Kollektivbezeichnung ist sinnvoll; ihr Anker sollte unmittelbar bei der erläuterten Wendung stehen.
