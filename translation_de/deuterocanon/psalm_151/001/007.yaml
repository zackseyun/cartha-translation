  yaml_path: translation/deuterocanon/psalm_151/001/007.yaml
  text: But I drew his own sword and cut off his head[b][a], and I removed disgrace from the sons of Israel.
translation:
  language: de
  text: Doch ich zog ihm das Schwert heraus, enthauptete ihn und nahm die Schmach von den Söhnen Israels[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Söhne Israels“ ist eine traditionelle Kollektivbezeichnung für Israel.
    reason: cultural_note
lexical_decisions:
- source_word: σπασάμενος
  choice: zog
  rationale: Das Aoristpartizip von σπάω bezeichnet hier das Ziehen einer Waffe; „zog“ ist im Deutschen idiomatisch und dem militärischen Zusammenhang angemessen.
- source_word: τὴν παρ' αὐτοῦ μάχαιραν
  choice: sein eigenes Schwert
  rationale: μάχαιρα bezeichnet eine Klinge oder ein Kurzschwert; παρ' αὐτοῦ weist darauf, dass die Waffe von ihm beziehungsweise aus seinem Besitz genommen wurde. „Sein eigenes Schwert“ gibt dies natürlich wieder und bewahrt die dramatische Umkehr.
- source_word: ἀπεκεφάλισα
  choice: enthauptete ihn
  rationale: Das Verb bedeutet, jemandem den Kopf abzuschlagen. „Enthauptete ihn“ ist präzise, würdig und in modernem Deutsch unmittelbar verständlich.
- source_word: ἦρα
  choice: nahm … von
  rationale: αἴρω bedeutet hier in Verbindung mit ὄνειδος, etwas Belastendes wegzunehmen. Die Formulierung „nahm die Schmach von“ bewahrt sowohl das Bild als auch die griechische Konstruktion.
- source_word: ὄνειδος
  choice: Schmach
  rationale: ὄνειδος bezeichnet öffentliche Beschämung, Schande oder Vorwurf. „Schmach“ passt zum Zusammenhang kollektiver Erniedrigung und hat einen würdigen, noch gut verständlichen Klang.
- source_word: ἐξ υἱῶν Ἰσραήλ
  choice: von den Söhnen Israels
  rationale: Die Wiedergabe erhält die ausdrücklich männliche Kollektivbezeichnung υἱῶν und bildet die Präposition ἐξ im Deutschen idiomatisch mit „von“ ab.
theological_decisions:
- issue: Geschlechtlich markierte Kollektivbezeichnung
  choice: von den Söhnen Israels
  alternative: vom Volk Israel
  rationale: Der griechische Text verwendet ausdrücklich den maskulinen Plural υἱῶν. Die Übersetzung bewahrt diese Form, während eine Fußnote erklärt, dass es sich um eine traditionelle Kollektivbezeichnung für Israel handelt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Doch“ gibt den Kontrast von ἐγὼ δὲ knapp wieder; die Satzfolge bleibt nah am griechischen Erzählrhythmus. Die traditionelle Wendung „Söhne Israels“ wird im Haupttext bewahrt und durch eine knappe Fußnote erläutert.
