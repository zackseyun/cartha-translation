  text: For you are the Lord Most High[a], compassionate, patient, and abounding in mercy[b], and relenting concerning the evils of men.
translation:
  language: de
  text: Denn du bist der Herr, der Höchste, voll Mitgefühl, langmütig und reich an Erbarmen, und du änderst deine Absicht im Blick auf die Übel der Menschen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, formnäher: „und du bereust die Übel der Menschen“. Das griechische Verb kann eine Änderung des Sinnes oder Entschlusses bezeichnen. Die Wendung „die Übel der Menschen“ ist knapp und kann sich auf menschliche Bosheit oder auf die Menschen betreffende Übel bzw. Unheil beziehen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριος ὕψιστος
  choice: der Herr, der Höchste
  rationale: Gibt κύριος als göttlichen Titel mit „Herr“ wieder und bewahrt ὕψιστος als eigenständigen Hoheitstitel.
- source_word: εὔσπλαγχνος
  choice: voll Mitgefühl
  rationale: Bezeichnet tiefes, herzliches Erbarmen; die Formulierung ist verständlich und vermeidet eine unnötige Wiederholung von ἔλεος.
- source_word: μακρόθυμος
  choice: langmütig
  rationale: Bewahrt die Vorstellung geduldiger Zurückhaltung und ist in einem würdevollen modernen Bibelregister weiterhin gut verständlich.
- source_word: πολυέλεος
  choice: reich an Erbarmen
  rationale: Gibt die verstärkende Bedeutung des Kompositums wieder und unterscheidet sie sprachlich von εὔσπλαγχνος.
- source_word: μετανοῶν
  choice: du lässt dich … umstimmen
  rationale: Drückt eine Änderung im Handeln oder Entschluss aus, ohne Gott moralische Schuld zuzuschreiben; zugleich bleibt die im griechischen Verb liegende Spannung erkennbar.
- source_word: ἐπὶ κακίαις ἀνθρώπων
  choice: hinsichtlich der Übel der Menschen
  rationale: Folgt der knappen und mehrdeutigen griechischen Wendung, ohne κακίαις vorschnell allein als menschliche Bosheit oder allein als über Menschen kommendes Unheil festzulegen.
theological_decisions:
- issue: Die Aussage μετανοῶν wird auf Gott bezogen
  choice: du lässt dich … umstimmen
  alternative: du bereust
  rationale: „Umstimmen“ bewahrt Gottes Reagieren und Absehen von einem Entschluss, ohne eine vorausgegangene moralische Verfehlung Gottes nahezulegen. Die Fußnote nennt die formal nähere Alternative.
- issue: Mehrdeutigkeit von κακίαις ἀνθρώπων
  choice: die Übel der Menschen
  alternative: die Bosheit der Menschen / das Unheil für die Menschen
  rationale: Der griechische Ausdruck kann menschliche böse Taten beziehungsweise Bosheit oder Übel und Unheil im Zusammenhang mit den Menschen bezeichnen. Der Haupttext hält diese Spannung offen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Reihung der göttlichen Eigenschaften bleibt erhalten; „langmütig“ trägt bewusst einen leicht gehobenen biblischen Klang, ohne veraltet zu wirken.
