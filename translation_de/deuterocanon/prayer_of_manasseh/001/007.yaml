    issue: „du lässt dich … umstimmen“
    rationale: Die passive Wendung impliziert, dass ein nicht genannter Akteur Gott umstimmt. μετανοῶν bezeichnet hier vielmehr Gottes Sinnes- bzw. Entschlussänderung; der Auslöser und die genaue Beziehung zu den „Übeln“ bleiben im Griechischen knapp.
