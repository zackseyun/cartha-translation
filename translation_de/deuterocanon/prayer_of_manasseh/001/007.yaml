  naturalness: '„Du lässt dich hinsichtlich … umstimmen“ ist im Deutschen sowohl schwerfällig als auch semantisch unglücklich: Es legt nahe, Gott werde von jemandem überzeugt. „Du änderst deine Absicht im Blick auf …“ ist modernes, würdiges Standarddeutsch und stellt die in μετανοῶν ausgedrückte Änderung ohne diese Zusatzannahme dar.'
  terminology: „Herr, der Höchste“, „voll Mitgefühl“, „langmütig“ und „reich an Erbarmen“ sind angemessen. „Langmütig“ ist in einem gehobenen Bibelregister weiterhin verständlich. Die Fußnote soll „bereust“ als formnähere, aber im Deutschen missverständliche Alternative ausweisen, nicht als wörtliche Übersetzung.
