  yaml_path: translation/deuterocanon/prayer_of_manasseh/001/012.yaml
  text: I have sinned, Lord, I have sinned, and I myself know my lawless deeds;
translation:
  language: de
  text: Ich habe gesündigt, Herr, ich habe gesündigt, und ich selbst kenne meine gesetzlosen Taten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „meine Ungerechtigkeiten“ beziehungsweise „meine Übertretungen“. Das griechische Wort bezeichnet Gesetzlosigkeit oder Verstöße gegen das Gesetz.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμάρτηκα
  choice: ich habe gesündigt
  rationale: Das Perfekt bezeichnet begangene Sünde mit fortdauernder Gegenwartsbedeutung; das deutsche Perfekt gibt dies in einem gegenwärtigen Sündenbekenntnis natürlich wieder.
- source_word: κύριε
  choice: Herr
  rationale: Der Vokativ von κύριος wird in der unmittelbaren Anrede schlicht und würdig mit „Herr“ wiedergegeben; ein zusätzliches „O“ steht nicht im Griechischen und ist im heutigen Deutsch unnötig.
- source_word: τὰς ἀνομίας μου
  choice: meine gesetzlosen Taten
  rationale: ἀνομία bezeichnet Gesetzlosigkeit beziehungsweise konkrete Verstöße gegen das Gesetz. „Gesetzlose Taten“ bewahrt diesen Bezug deutlicher als das allgemeinere „Verfehlungen“.
- source_word: ἐγώ
  choice: ich selbst
  rationale: Das ausdrücklich gesetzte Personalpronomen trägt Nachdruck. „Ich selbst“ macht diesen hervorhebenden Zug im Deutschen sichtbar.
- source_word: γινώσκω
  choice: kenne
  rationale: Die Grundbedeutung ist „kennen/wissen“. Im Bußgebet schwingt Anerkennen mit, doch „kenne“ lässt diese kontextuelle Bedeutung bestehen, ohne sie ausdrücklich festzulegen.
theological_decisions:
- issue: Wiedergabe von ἀνομία im Sündenbekenntnis
  choice: gesetzlose Taten
  alternative: Ungerechtigkeiten; Verfehlungen; Übertretungen
  rationale: Die Formulierung bewahrt den Bezug auf die Verletzung des Gesetzes und zugleich den konkreten Charakter der bekannten Taten, ohne einen konfessionell geprägten Fachbegriff einzuführen.
- issue: Nachdruck des ausdrücklichen ἐγώ
  choice: ich selbst
  alternative: ich
  rationale: Die Wiedergabe erhält die im Griechischen grammatisch entbehrliche und daher betonte Nennung des Pronomens, auch wenn ein schlichtes „ich“ im Deutschen flüssiger wäre.
- issue: Bedeutungsumfang von γινώσκω im Bußgebet
  choice: kenne
  alternative: erkenne an; bekenne
  rationale: „Kenne“ bleibt beim kognitiven Grundsinn. Ein Eingeständnis ist durch den Gebetszusammenhang nahegelegt, soll aber nicht als alleinige Bedeutung festgeschrieben werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusster Wiederholung des Bekenntnisses. Die Wortstellung bleibt natürlich, während „ich selbst“ den Nachdruck des griechischen ἐγώ erhält.
