  text: the one who made heaven and earth[a], with all their host,
translation:
  language: de
  text: der Himmel und Erde samt ihrer ganzen Ordnung[a] geschaffen hat,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »samt ihrer ganzen Anordnung« beziehungsweise »samt ihrem ganzen Schmuck«. Das griechische Wort κόσμος meint hier wahrscheinlich die geordnete Gesamtheit von Himmel und Erde, nicht nochmals »die Welt«.'
    reason: Lexikalische Alternative zu κόσμος; die echte Bedeutungsbreite soll sichtbar bleiben.
lexical_decisions:
- source_word: ὁ ποιήσας
  choice: der … geschaffen hat
  rationale: Das substantivierte Partizip bezeichnet Gott beschreibend. Im Zusammenhang des Gebets ist ein deutscher Relativsatz natürlich; »geschaffen« gibt das kosmologische ποιέω angemessen wieder, ohne über den griechischen Sinn hinauszugehen.
- source_word: τὸν οὐρανὸν καὶ τὴν γῆν
  choice: Himmel und Erde
  rationale: Die feste kosmologische Paarformel bezeichnet die gesamte Schöpfung; artikelloses Deutsch ist hier idiomatisch und würdevoll.
- source_word: σὺν
  choice: samt
  rationale: »Samt« drückt knapp und eindeutig aus, dass auch das Folgende zum Geschaffenen gehört.
- source_word: παντὶ τῷ κόσμῳ αὐτῶν
  choice: ihrer ganzen Ordnung
  rationale: κόσμος kann die geordnete Gesamtheit, Anordnung oder Zier bezeichnen. »Ordnung« vermeidet die missverständliche Wiederholung »Welt« nach »Himmel und Erde« und bewahrt den Bezug von αὐτῶν auf beide.
theological_decisions:
- issue: Bedeutung von κόσμος in der kosmologischen Schöpfungsformel
  choice: »Ordnung« als geordnete Gesamtheit von Himmel und Erde
  alternative: »Heer«, »Schmuck«, »Anordnung« oder »alles, was in ihnen ist«
  rationale: Da Himmel und Erde bereits genannt sind, wäre »Welt« redundant. »Ordnung« bewahrt die im griechischen Wort liegende Vorstellung einer geordneten Gesamtheit, ohne sie vorschnell als das »Heer« des Himmels und der Erde zu konkretisieren.
translation_notes:
  register: Moderner, würdevoller Gebetsstil. Das Fragment beginnt bewusst mit einem Relativanschluss, entsprechend dem griechischen substantivierten Partizip und seinem Zusammenhang in der Anrede. Der Fußnotenmarker steht unmittelbar nach dem vollständigen Satzteil.
